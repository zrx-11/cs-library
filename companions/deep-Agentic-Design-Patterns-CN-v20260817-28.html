果回传。工具输出回到上下文；失败返回要说明原因与下一步，例如缺少哪个参数、哪类输入不被接受。用到的假设：模型能读懂错误信息并调整后续调用。\n<\/li><li>\n环节六，再处理。模型基于结果收尾或继续：可能串联下一个工具调用、进行反思，或直接作答（PDF 第 73 页）。中间结果作为后续调用输入，与链式状态传递衔接。\n<\/ul>\n<p>机制定位：函数调用是连接 LLM 推理能力与外部功能的技术桥梁（PDF 第 73 页）；推理留在模型侧，计算、检索、动作留在外部侧，JSON 是两侧交换格式。工具宽于函数：可以是传统函数、API 端点、数据库请求，乃至发给另一个专用智能体的指令（PDF 第 73–74 页）。<\/p>\n<p>限定条件拆解：<\/p>\n<ul><li>\n史料：闭环六步为原书列出的工具使用标准流程（PDF 第 73 页）。\n<\/li><li>\n推断：工具数量与选择准确率的关系是非单调的——过少覆盖不全，过多相互干扰；最优规模取决于任务域，原书未给具体数量。\n<\/li><li>\n边界：模型可能生成看似合法但越权的参数，参数校验与权限边界必须在编排层兜底，不能靠模型自觉。\n<\/ul>\n<h2>机制逐项对照<\/h2>\n<ul><li>\n与 RAG：RAG 是专用知识检索管线，切块、索引、召回、引用围绕文档问答；工具调用是通用动作通道，检索只是可挂载的一类工具。\n<\/li><li>\n与 MCP：函数调用是一次具体调用机制；MCP 标准化模型发现、连接和使用外部能力的接口方式。调用解决“这次怎么调”，协议解决“各类工具怎么统一暴露”。\n<\/li><li>\n与护栏：工具通道把动作送到外部；护栏在通道前后做拦截与权限约束。工具自身的幂等、可回滚设计是执行护栏的一部分。\n<\/li><li>\n失败位置：工具失败集中在定义（选错）、拦截（参数越权）、回传（错误不可读）三处；通道本身不保证外部服务稳定。\n<\/ul>\n<h2>算例：订单状态查询<\/h2>\n<p>估算口径（工程估算，非原书测量值）：工具定义清单约 1200 输入 token，用户请求约 100 token；调用 JSON 约 80 token；工具往返约 300–500 ms；模型按 50 token/s 生成。<\/p>\n<p>任务：用户问“我上周的订单到哪了”。<\/p>\n<p>第 1 步，定义载入：把可用工具描述放进上下文，例如 <code>get_order_status(user_id, order_id)<\/code>，参数说明标注 order_id 可从账号历史补全。 第 2 步，决策：模型判断需要调用订单查询工具；输入约 1300 token，决策输出工具选择约 30 token。 第 3 步，调用生成：产出 JSON <code>{&quot;tool&quot;:&quot;get_order_status&quot;,&quot;args&quot;:{&quot;user_id&quot;:&quot;u_1024&quot;,&quot;order_id&quot;:null}}<\/code>，约 80 token；识别出 order_id 缺失。 第 4 步，执行拦截：编排层校验参数，发现 order_id 为空，不调用外部接口；回传错误 <code>{&quot;error&quot;:&quot;missing_arg&quot;,&quot;field&quot;:&quot;order_id&quot;,&quot;hint&quot;:&quot;可先查询该用户最近订单&quot;}<\/code>。 第 5 步，回传再处理：模型收到可读错误，改调 <code>list_recent_orders(user_id)<\/code> 取最近订单号，再回到状态查询。 第 6 步，结果成稿：状态文本带回上下文，模型组织自然语言回复；本步输入约 900 token，输出约 180 token。<\/p>\n<p>失败分支对照：<\/p>\n<ul><li>\n超时分支：工具超时后回传“调用超时，可重试一次”，模型选择重试；不把空结果当“无订单”。\n<\/li><li>\n缺参数分支：如上，返回缺哪个字段与补全路径；模型换调用补参数。\n<\/li><li>\n越权分支：参数指向他人订单，编排层权限校验拒绝，回传“无权访问该订单”，不执行查询。\n<\/ul>\n<p>量级对照：一次成功调用的模型侧输入约 1300 token、输出约 260 token；工具往返约 0.4 秒。若链路包含补查订单号，多一次工具调用与一段结果回传，输入再加约 600 token。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：查询工具超时返回空字符串，模型把“空”理解为“无订单”，回复用户没有相关订单。反例二：一次性暴露二十个功能相近的检索工具，描述交叉，模型反复选错，准确率低于保留两三个职责明确的工具。边界：外部工具不稳定时需要超时、退避重试与降级路径；模型不擅长的计算与最新信息才是工具的主场。<\/p>\n<h2>延伸推演：工具规模与调用成本<\/h2>\n<p>工具清单规模对选择准确率的影响可以分两段看。清单很小时，每个工具定义都被模型充分看到，选错主要来自任务理解偏差；清单变长后，定义之间的描述距离压缩，功能相近的工具互相竞争候选，模型选错概率上升。收窄 schema 的作用在参数侧：枚举值把参数空间限定在有限选项内，模型不需要生成自由文本；自由文本参数则要承担格式偏差与取值越界风险。工具描述之间边界写清，比单纯增加工具数量更能稳住选择。<\/p>\n<p>调用成本按链路累加。一次成功调用包含：定义载入（工具清单进入上下文的固定 token）、决策与调用生成、编排层校验、工具往返、结果回传、再处理。工具往返是外部耗时，模型侧 token 随调用次数叠加。需要补参数重试时，多一轮“错误回传—改参—再调用”，输入加上错误信息与修正后参数；连续失败超过次数应转人工，而不是无限重试同一调用。<\/p>\n<p>失败模式的代价对比：缺参数错误可恢复，返回字段名与补全路径即可；越权错误必须在编排层拒绝，不能寄望模型自觉；外部超时应区分可重试与不可重试，退避后仍失败则降级告知。工具设计的幂等性降低重复调用风险：同一参数调用多次与调用一次结果一致，重试不会产生重复副作用；有副作用的动作要可回滚或加审批。<\/p>\n<h2>补充算例：工具描述与错误分级<\/h2>\n<p>工具描述写法对照。合格定义包含：工具用途一句话、参数名与类型、每个参数的取值范围或枚举、参数之间的依赖（例如提供订单号时用户标识可省略）、返回内容概要。描述重叠的反例：两个检索工具都写“查询相关信息”，模型无法按职责区分；应分别限定检索对象（订单库、产品目录）与返回字段。<\/p>\n<p>错误返回分级：可恢复错误包括缺参数、参数格式不符、外部临时超时，返回字段名、原因与下一步建议，模型可改参重试；业务拒绝包括越权、超出额度，回传拒绝原因，不再重试同一动作；系统错误包括工具不可用、接口故障，回传降级提示，转人工或换备用工具。三级错误混在一起返回空值，模型无法选择正确后续动作。<\/p>\n<p>幂等与回滚：查询类工具天然幂等，重复调用不产生副作用；写入类工具要设计成同一参数重复执行结果一致，或带操作令牌防止重复提交。不可逆动作（删除、对外发送）需要回滚方案或前置审批；工具定义里标注副作用类型，编排层据此决定是否挂护栏。<\/p>\n<p>多工具编排：一次任务串联多个工具时，前一工具结果作为后一工具参数，状态传递走结构化字段；工具之间无依赖时可并行调用（与 c03 衔接）。工具选择冲突时，编排层可以按工具适用范围做二次校验，而不是完全交给模型判断。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：工具越多能力越强。<\/strong> 反证：描述重叠导致乱选，错误率随清单膨胀上升；工具按最小必要保留，职责边界写清。\n<\/li><li>\n<strong>误读：失败返回空值即可。<\/strong> 反证：模型无法区分“没有结果”和“调用失败”；可读错误包含原因与下一步，才能支撑重试（c05 正文环节五）。\n<\/li><li>\n<strong>误读：模型生成的参数天然合规。<\/strong> 反证：模型可能产出合法格式但越权的参数；权限边界与参数校验必须由编排层兜底，属于护栏（c09）职责。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n工具调用六环节中，哪一环把模型意图翻译成可执行请求？哪一环是模型与外部世界的边界？\n<\/li><li>\n工具 schema 为什么要窄、要枚举？参数过宽会在决策环节造成什么问题？\n<\/li><li>\n可读错误应包含哪些信息？为什么空字符串和 null 不能承担错误回传？\n<\/li><li>\n用算例说明缺参数分支如何恢复；越权分支为什么在编排层拦截而不是交给模型判断？\n<\/li><li>\n工具调用与 RAG、MCP 分别是什么关系？哪些能力走工具通道，哪些走专用检索管线？\n<\/ol>\n<h2>适用与不适用速查<\/h2>\n<p>适合工具调用的情况：任务需要最新信息、模型不擅长的计算、用户专属数据或触发外部动作。不适合工具化的能力：无法参数化描述的开放式操作，或工具职责边界长期划不清的动作。工具设计按最小必要保留：schema 收窄、枚举取值、错误可读、写入动作幂等或可回滚；权限校验放在编排层，不依赖模型自觉。多工具串联时前序结果结构化传给后序，无依赖的工具可并发。<\/p>\n<p>工具定义维护时还要定期清理长期未被选中的工具，描述重叠的候选合并或拆分；新工具接入前先核对它与现有工具的职责边界，避免清单膨胀。<\/p>\n<p>工具调用记录同样留痕：调用了哪个工具、参数摘要、返回状态，便于事后排查与合规核对。<\/p>\n<h2>第二个任务的端到端算例：查日历→查库存→订会议室<\/h2>\n<p>估算口径（工程估算，非原书实测）：中文按约 1.6 字符/token；工具定义随上下文带入；外部 API 往返按 0.5–0.8 s 估；模型回合生成按 50 token/s。<\/p>\n<p>任务：为团队预订下周三的会议室，走完工具闭环六步：决定调用谁、传什么参数、拿到结果、再决定下一步。<\/p>\n<ol><li>\n意图识别：用户消息约 50 token，可用工具定义约 350 token；模型判断先查日历。\n<\/li><li>\n调用生成：结构化 JSON <code>{tool:&quot;calendar.query&quot;, args:{date:&quot;next Wed&quot;}}<\/code>，约 40 token。\n<\/li><li>\n执行回传：框架拦截并调用日历接口，返回空闲时段 3 条，约 180 token。\n<\/li><li>\n二次决策：继续调用房间库存工具 <code>room.inventory<\/code>，参数约 40 token；返回可订房间列表约 260 token。\n<\/li><li>\n执行预订：选定房间，调用 <code>room.book<\/code>，参数含日期、时段、人数约 60 token；返回确认号约 50 token。\n<\/li><li>\n最终回复：汇总确认信息约 150 token。\n<\/ol>\n<p>token 估算：工具定义在各回合上下文累计约 930 token（日历 350、库存 300、预订 280），输入累计约 1480 token，输出累计约 290 token。外部耗时：日历接口约 0.6 s、库存约 0.5 s、预订约 0.8 s；模型三次决策回合各约 2 s 加往返，总时长约 10 s。<\/p>\n<p>失败回退：库存不足则改查相邻时段；接口超时按退避重试一次；参数缺失先向用户澄清，不编造参数。预订工具带幂等键，重试不产生重复房间。工具结果以结构化字段回传，框架可直接读取；错误信息同时供开发排查与模型判断回退分支。<\/p>\n<h2>前提再拆一层<\/h2>\n<p>工具调用闭环能成立，还依赖以下几条隐含前提；逐条抽掉后给出故障场景与可观测指标。<\/p>\n<ol><li>\n<strong>工具定义写清用途、参数类型与取值约束。<\/strong> 抽掉后：模型选错工具，或填错参数类型，调用在执行层失败。可观测指标：工具选择正确率、参数校验失败率。\n<\/li><li>\n<strong>工具调用幂等或可回滚，重试有约定。<\/strong> 抽掉后：重试产生重复预订、重复扣款等不可逆副作用。可观测指标：重复副作用事件数、回滚成功率。\n<\/li><li>\n<strong>外部结果以结构化形式回传上下文。<\/strong> 抽掉后：结果是混乱文本，模型二次理解产生偏差。可观测指标：结果解析成功率、字段读取失败条数。\n<\/li><li>\n<strong>编排层能拦截结构化调用并真实执行。<\/strong> 抽掉后：模型只能描述“我去查一下”，动作不落地。可观测指标：调用落地率、拦截解析失败次数。\n<\/li><li>\n<strong>工具错误信息可被理解并触发回退。<\/strong> 抽掉后：错误被当成正常结果继续作答，掩盖失败。可观测指标：错误分支触发率、基于错误的重规划次数。\n<\/li><li>\n<strong>上下文容纳得下多轮工具结果。<\/strong> 抽掉后：早期工具结果被挤出窗口，后续决策丢失依据。可观测指标：上下文占用峰值、早期结果引用丢失率。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "工具调用"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.87<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">反思<\/a><\/span><\/div><h1>规划（Planning）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章 | <strong>原书位置<\/strong>：第 6 章《Planning》（PDF 第 87 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>多步、开放的任务容易迷路：目标给了，路径不清楚，智能体若只按反应式行为一步步走，会在中途偏离目标、漏掉依赖关系或卡在某个环节反复试探。原书把规划定位为自主系统的核心过程：在动态或复杂环境中，把高层目标转化为由离散、可执行步骤组成的结构化行动序列（PDF 第 87 页）。<\/p>\n<p>困难在于：计划不是预先写死的脚本。环境会变化——首选场地不可用、餐饮已订满、检索不到材料；初始计划只是起点，智能体需要吸纳新信息、绕开障碍继续推进（PDF 第 87 页）。规划要解决的具体问题，是在“怎么做”尚需探索时，先厘清初始状态与目标状态，再生成行动序列，并在执行中按观察结果调整计划。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：规划智能体承接复杂目标，自主筹划通往目标的行动路线；先理解初始状态（预算、人数、意向日期等）与目标状态（活动成功预订），再找出连接两者的行动序列；计划依据请求动态生成，事先并不知道（PDF 第 87 页）。逐句拆开：<\/p>\n<ul><li>\n“高层目标”：用户给出的是 objective 与约束，不是具体做法；规划要把“做什么”翻译成“怎么做”。\n<\/li><li>\n“初始状态到目标状态”：规划在状态空间中寻路，每一步行动改变当前状态，逐步逼近目标状态（PDF 第 88 页）。\n<\/li><li>\n“离散可执行步骤”：计划由有序子任务构成，子任务之间存在依赖，执行时通过工具或与各系统交互处理依赖关系（PDF 第 87 页）。\n<\/li><li>\n“适应性”：初始计划可被修订；观察到新约束后重新评估选项，给出新计划（PDF 第 87 页）。\n<\/li><li>\n“灵活性与可预测性的权衡”：解法已经清楚且可重复时，把智能体约束在固定工作流中更有效；判断标准是“怎么做”仍需探索，还是已经明确（PDF 第 87 页）。\n<\/ul>\n<p>正例：新员工入职拆成创建系统账号、分配培训模块、协调各部门等有依赖的子任务；研究报告分成信息收集、数据摘要、内容组织、迭代润色几个阶段（PDF 第 87–88 页）。反例：流程已经标准化、每天重复执行，仍让智能体现场生成计划，结果每次步骤不一、难以复核。<\/p>\n<h2>原理推导<\/h2>\n<p>规划过程可按建模、分解、执行检查、重规划四步推导。<\/p>\n<p>第一步建模：明确初始状态、目标状态与约束。初始状态包括已有资源、可用工具、已知限制；目标状态用可验收的结果描述；约束包括时间、权限、不可触碰的边界。这一步用到的假设是：目标与约束可以被表述成状态与条件，否则规划无对象可依。<\/p>\n<p>第二步分解：把高层目标拆成有序子任务，形成计划。每个子任务标注前置依赖与完成条件；粒度以“每步可独立验收”为准。太粗则卡住时无法定位问题，太细则耗尽上下文并削弱灵活性。原书把规划描述为从反应式行为走向目标导向行为的逻辑框架，解决需要连贯、相互依赖操作序列的问题（PDF 第 88 页）。<\/p>\n<p>第三步执行与检查点：按计划逐步执行，每步对照检查点判断是否达标。检查点可以是工具返回、检索结果、校验通过等可观测信号；通过则进入下一步，不通过则进入修正环节。计划中显式记录所依据的假设，假设被推翻时才知道该改哪一段。<\/p>\n<p>第四步重规划：触发条件包括检查点失败、工具连续失败、关键假设被新观察推翻。重规划不是推倒重来，而是登记新约束、重评剩余选项、修订后续步骤；原书举例场地或餐饮不可用时，智能体更换场地或调整日期，而不是直接失败（PDF 第 87 页）。<\/p>\n<p>机制上，规划与反思（c04）衔接：检查点不通过时先局部反思修订产出；若发现计划路径本身不可行，才回到计划层重排。规划与工具调用（c05）衔接：每个子任务的落地执行通过外部工具完成。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>规划适用：任务路径需要现场发现、环境动态变化、子任务相互依赖且无法预先固化流程。结构化信息整合、流程自动化、机器人与导航状态空间寻路，都是书中列出的规划场景（PDF 第 87–88 页）。<\/p>\n<p>边界：解法已知且可重复的任务，固定工作流比自主规划更可靠、更一致，规划带来的不确定性反而是风险（PDF 第 87 页）。子任务无法定义完成条件时，规划无法判断进度，容易空转。环境信息不足、约束互相冲突时，计划质量受限于建模质量；规划不能替代信息收集。计划过细会把上下文填满，过粗则失去指导作用。<\/p>\n<p>条件去掉会怎样：去掉检查点，执行结果不被验收，偏差累积到最后才暴露；去掉重规划触发条件，环境变化后仍沿失效计划推进；去掉假设记录，计划出问题时无法判断哪一步的前提已不成立。<\/p>\n<h2>反例<\/h2>\n<p>计划一次定死的反例：预订行程的计划假设场地可用，执行时场地已满，系统仍按原计划继续联络，直到最后一步才失败；有适应性规划的系统会在登记“场地不可用”后即重排备选方案（PDF 第 87 页）。<\/p>\n<p>计划过细的反例：把一篇报告拆成上百个微步骤，每步都要模型决策与记录，上下文被计划文本占满，留给内容生成的空间不足；拆分粒度应当以可验收的子任务为单位，而不是拆到动作级别。<\/p>\n<h2>辨析<\/h2>\n<p>与链式（c01）的差别：链式步骤在任务开始前固定；规划在执行中生成并可修订序列。链式是规划落地后的一种静态执行形态，规划保留现场调整空间。<\/p>\n<p>与反思（c04）的差别：反思修订当前产出，规划调整后续序列。反思回答“这版哪里不对”，规划回答“接下来怎么走”；计划不可行时，反思的结论升级为重规划。<\/p>\n<p>与多智能体协作（c08）的差别：规划是单个决策层的任务分解与调度；多智能体在此基础上把子任务交给不同角色执行，并建立通信协议。规划可以由一个管理者智能体承担，再分派给执行者。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：链式步骤拆分、工具调用的执行通道、反思的检查—修正闭环。后继：规划是多智能体层级结构中管理者分派任务的依据；RAG 与工具为计划中的信息收集步提供手段；护栏约束规划落地的动作边界。本概念把“状态建模—任务分解—检查点—重规划”这条循环与灵活性、可预测性的权衡串在一起。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（规划）<\/summary><div class=\"depth-body\"><h1>规划（Planning）· 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>逐级倒查规划机制成立的前提：<\/p>\n<ol><li>\n“计划能落地执行”依赖每个子任务可验收：子任务有明确完成条件，执行后能对照判断是否达标；没有验收条件，进度无法判断，计划容易空转。\n<\/li><li>\n“子任务可验收”依赖目标状态可表述：最终要达成的结果能用可观测的描述写出，而不是停留在模糊愿望。\n<\/li><li>\n“目标状态清楚”依赖初始状态与约束可建模：已有资源、可用工具、时间与权限限制、不可触碰的边界都被列入；建模缺项，计划在缺口处只能假设。\n<\/li><li>\n“建模可推进”依赖关键假设被显式记录：计划依据的前提写下来，假设被新观察推翻时才知道该改哪一段。\n<\/li><li>\n“环境变化后能调整”依赖存在重规划触发条件与修订通道：检查点失败、工具连续失败、假设被推翻时，计划可回到计划层重排。\n<\/li><li>\n最底层假设：任务路径需要现场发现，且行动序列可以被分解成可执行子任务；解法已知且可重复时，固定工作流比自主规划更可靠（PDF 第 87 页）。\n<\/ol>\n<p>逆推到读者基线：先认“目标和现状能写成条件”，再认“条件能拆成可验收步骤”，最后认“跑偏后能改计划”。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条分四步，每步写清假设：<\/p>\n<ul><li>\n第一步，建模。明确初始状态、目标状态与约束。初始状态包括已有资源、可用工具、已知限制；目标状态用可验收结果描述；约束包括时间、权限与禁区。用到的假设：目标与约束可以被表述成状态与条件；无法表述的部分需要先收集信息。\n<\/li><li>\n第二步，分解。把高层目标拆成有序子任务，形成计划；每个子任务标注前置依赖与完成条件。粒度以可独立验收为准：太粗卡住时无法定位，太细耗尽上下文并削弱灵活性。原书把规划描述为从反应式行为走向目标导向行为的逻辑框架（PDF 第 88 页）。\n<\/li><li>\n第三步，执行与检查点。按计划逐步执行，每步对照检查点判断是否达标；检查点可以是工具返回、检索结果、校验通过等可观测信号。通过则进入下一步，不通过进入修正。计划中显式记录假设，假设被推翻时才知道改哪段。\n<\/li><li>\n第四步，重规划。触发条件包括检查点失败、工具连续失败、关键假设被新观察推翻。重规划不是推倒重来，而是登记新约束、重评剩余选项、修订后续步骤；原书举例场地或餐饮不可用时，更换场地或调整日期，而不是直接失败（PDF 第 87 页）。\n<\/ul>\n<p>衔接机制：检查点不通过时先局部反思修订产出；发现计划路径本身不可行，才回到计划层重排（与 c04 衔接）。每个子任务的落地执行通过外部工具完成（与 c05 衔接）。<\/p>\n<p>限定条件拆解：<\/p>\n<ul><li>\n史料：新员工入职拆成创建系统账号、分配培训模块、协调各部门等有依赖子任务；研究报告分成信息收集、数据摘要、内容组织、迭代润色阶段（PDF 第 87–88 页）。\n<\/li><li>\n推断：计划粒度与上下文占用存在权衡；拆分到动作级别会把上下文填满，拆分到阶段级别则失去指导作用。这是机制推断，原书未给粒度数值。\n<\/li><li>\n边界：解法已知且可重复的任务，固定流程更可靠一致；规划带来的不确定性在这类场景是风险而非收益（PDF 第 87 页）。\n<\/ul>\n<h2>机制逐项对照<\/h2>\n<ul><li>\n与链式：链式步骤在任务开始前固定；规划在执行中生成并可修订序列。链式是规划落地后的静态执行形态，规划保留现场调整空间。\n<\/li><li>\n与反思：反思修订当前产出；规划调整后续序列。反思回答“这版哪里不对”，规划回答“接下来怎么走”；计划不可行时反思结论升级为重规划。\n<\/li><li>\n与多智能体：规划是单个决策层的任务分解与调度；多智能体把子任务交给不同角色执行并建立协议。规划可由管理者智能体承担，规划产出的序列是多智能体协议的输入。\n<\/li><li>\n失败位置：规划失败集中在建模（目标约束不清）、分解（粒度失当）、重规划（触发条件缺失）三处；执行层失败由工具与反思承担。\n<\/ul>\n<h2>算例：CSV 月报任务<\/h2>\n<p>估算口径（工程估算，非原书测量值）：计划生成调用输入约 900 token，输出计划约 350 token；每个执行步工具往返约 0.4–0.6 秒；模型按 50 token/s 生成。<\/p>\n<p>任务：“把这份 CSV 做成月报”。<\/p>\n<p>建模：初始状态为一份未校验 CSV；目标状态为一份含指标结论与图表的月报；约束为不编造列名、缺字段需向用户确认。<\/p>\n<p>计划与检查点：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>子任务<\/th><th>完成条件（检查点）<\/th><th>工具/动作<\/th><th>失败处理<\/th><\/tr><\/thead><tbody><tr><td>1 读表校验字段<\/td><td>列名与类型识别完整，缺失字段标出<\/td><td>表格解析工具<\/td><td>缺列则转确认，不猜列名<\/td><\/tr><tr><td>2 计算指标<\/td><td>汇总值可复算，口径写明<\/td><td>计算/脚本工具<\/td><td>口径不清则回到建模补约束<\/td><\/tr><tr><td>3 写结论<\/td><td>每条结论挂对应指标<\/td><td>生成调用<\/td><td>无指标支撑的结论删除<\/td><\/tr><tr><td>4 生成图表成稿<\/td><td>图表与结论一致，格式合规<\/td><td>绘图工具 + 排版<\/td><td>不一致则回到第 3 步<\/td><\/tr><\/tbody><\/table><\/div>\n<p>执行推演：第 1 步读表发现“销售额”列缺失，检查点不通过；登记新约束“缺销售额字段”，重规划为先向用户确认字段，而不是编造列名继续算指标。若字段补齐，回到第 2 步。第 3 步某条结论找不到对应指标，局部反思删除该结论，不进入第 4 步。<\/p>\n<p>量级对照：计划生成输入约 900 token、输出约 350 token；四个执行步合计模型侧输入约 2600 token、输出约 700 token，加工具往返约 4–6 秒。若任务标准化后每天重复，可把该计划固化为固定链，省去现场规划的生成调用；这正对应“怎么做已明确”时选固定流程的判断（PDF 第 87 页）。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：计划假设场地可用，执行时已满，系统仍沿原计划联络到最后一步才失败；适应性规划应在登记“场地不可用”后即重排备选（PDF 第 87 页）。反例二：报告被拆成上百个微步骤，上下文被计划文本占满，留给内容生成的空间不足。边界：子任务无法定义完成条件时规划无法判断进度；环境信息不足时计划质量受限于建模质量。<\/p>\n<h2>延伸推演：计划粒度与重规划成本<\/h2>\n<p>计划粒度在两个方向上失当。粒度过粗：子任务无法定义完成条件，执行到中途无法判断是否达标，偏差累积到末端才暴露；粒度到动作级别：计划文本本身占满上下文，每一步都要模型决策与记录，留给实际内容生成的空间被挤压。可行粒度以“可验收子任务”为单位，每个单位带输入、输出与检查点，单位之间的依赖关系单独标注。<\/p>\n<p>重规划不是免费动作。触发重规划意味着前序某步假设失效，已执行部分可能要返工；重规划成本包括重新建模、修订剩余序列、再次执行受影响子任务。因此计划中显式记录假设的价值，在于失效时能快速定位受影响段落，而不是整份计划推倒。触发条件要可观测：检查点失败有明确信号，工具连续失败有计数，假设被推翻有新证据对照；靠“感觉不对”触发的重规划会造成频繁摆动。<\/p>\n<p>规划与固定链的成本分界：任务首次执行、路径需要探索时，规划的现场分解价值高于开销；同一流程重复跑通后，把验证过的计划固化成固定链，省去每次现场规划的生成调用与不确定性。原书把灵活性与可预测性的权衡落到一个判断上：“怎么做”仍需探索还是已经明确（PDF 第 87 页）。明确的任务用固定流程锁定一致性，探索性任务才开放规划权。<\/p>\n<h2>补充算例：计划表示与检查点设计<\/h2>\n<p>一份可执行计划至少包含：子任务编号、动作描述、前置依赖、输入材料、完成条件、所用工具、当前状态。依赖关系写成有向顺序：被依赖的子任务未完成，后续任务不启动。检查点设计对照“可观测”：完成条件必须能由工具返回、检索结果或校验规则判定，例如“列名识别完整”“汇总值可复算”“结论挂对应指标”；写不出观测信号的条件不是合格检查点。<\/p>\n<p>重规划案例展开：CSV 月报任务第 1 步发现销售额列缺失，原计划假设“表内含全部所需字段”被推翻。重规划动作：登记新约束，把“向用户确认字段”插入计划前部，受影响的计算与结论步骤顺延；不是删掉后续步骤，也不是在缺字段状态下继续算。若用户补充后字段齐全，回到原计划轨道；若确认字段不存在，调整目标状态（月报改为基于现有列的口径）。<\/p>\n<p>规划失败模式对照：建模阶段目标模糊，后续步骤围绕错误方向分解；分解阶段粒度失当，过粗卡住或过细耗上下文；执行阶段检查点缺失，偏差累积到末端；重规划阶段触发条件不可观测，频繁摆动或一直不调整。四类失败分别对应建模、分解、执行、重规划四个环节，定位时先看缺陷落在哪一环。<\/p>\n<p>规划与固定流程的切换：同一任务首次执行保留规划权，跑通后把验证过的步骤固化为链式流程；后续重复执行走固定链，省去现场分解的生成调用与不确定性。环境频繁变化、任务结构每次不同时，才持续开放规划。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：计划一次定死即可。<\/strong> 反证：环境会变化，初始计划只是起点；没有重规划通道，新约束出现后系统沿失效计划推进（PDF 第 87 页）。\n<\/li><li>\n<strong>误读：计划越细越好。<\/strong> 反证：过细耗尽上下文、降低灵活性；粒度以可验收子任务为单位，不拆到动作级别。\n<\/li><li>\n<strong>误读：开放任务都应交给规划智能体。<\/strong> 反证：解法已知可重复时固定工作流更可靠；判断标准是“怎么做”需要探索还是已经明确（PDF 第 87 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n规划四步中，哪一步把高层目标变成可执行序列？完成条件写在哪里？\n<\/li><li>\n重规划的三个触发条件分别对应哪类新观察？重规划与推倒重来有什么区别？\n<\/li><li>\n关键假设为什么要显式记录？假设被推翻时，没有记录会造成什么困难？\n<\/li><li>\n用算例说明检查点不通过时，什么时候局部反思就够，什么时候必须回到计划层？\n<\/li><li>\n规划在什么条件下应当让位于固定链式流程？这个判断依据是什么？\n<\/ol>\n<h2>适用与不适用速查<\/h2>\n<p>适合规划的情况：任务路径需要现场发现，环境动态变化，子任务相互依赖且无法预先固化流程。不适合规划的情况：解法已知、流程可重复，此时固定链式流程的一致性与可预测性更好。计划粒度以可验收子任务为单位，检查点必须可观测；关键假设显式记录，检查点失败、工具连续失败、假设被推翻时进入重规划，重规划是修订剩余序列而不是整份推倒。<\/p>\n<p>计划执行中保留一份假设清单：每条假设对应计划中的哪一步、依据什么观察；环境变化时先对照清单判断受影响范围，再决定局部调整还是整段重排。<\/p>\n<p>检查点信号要在计划写出时一并定义，避免执行到中途才补判断标准；无法观测的完成条件不写进计划。<\/p>\n<h2>第二个任务的端到端算例：线下分享会筹备规划<\/h2>\n<p>估算口径（工程估算，非原书实测）：中文按约 1.6 字符/token；规划生成按 50 token/s，外部执行步骤耗时另计；窗口按 32768 token 估算。<\/p>\n<p>任务：筹备一场 30 人线下分享会。初始状态：人数 30、日期待定、预算上限明确；目标状态：场地确认、餐饮就位、物料齐备、通知发出。<\/p>\n<p>初始计划（含依赖与检查点）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>步骤<\/th><th>内容<\/th><th>前置依赖<\/th><th>检查点<\/th><\/tr><\/thead><tbody><tr><td>P1<\/td><td>确定日期与参会名单<\/td><td>用户意向<\/td><td>名单确认<\/td><\/tr><tr><td>P2<\/td><td>预订场地<\/td><td>P1<\/td><td>场地确认号<\/td><\/tr><tr><td>P3<\/td><td>预订餐饮<\/td><td>P2（人数确定）<\/td><td>餐饮订单号<\/td><\/tr><tr><td>P4<\/td><td>准备物料与演示设备<\/td><td>P1（主题确定）<\/td><td>物料清单签收<\/td><\/tr><tr><td>P5<\/td><td>发出通知与议程<\/td><td>P2、P4<\/td><td>通知送达记录<\/td><\/tr><\/tbody><\/table><\/div>\n<p>执行中观察：首选场地当日已满。触发重规划：改期或启用备选场地，P3 顺延到新场地确认之后。检查点作用：P2 未拿到确认号，P3 不启动，避免在场地未定状态下订餐。<\/p>\n<p>token 估算：首轮规划提示加初始状态约 500 token；计划 JSON（五步含依赖与检查点）约 420 token；执行阶段每步回传结果平均约 200 token；重规划回合输入旧计划 420 + 失败观察 150 + 提示 180 ≈ 750 token，输出新计划约 300 token。累计输入约 2750 token，输出约 1520 token；首轮规划生成约 8 s，重规划约 6 s，外部执行步骤另计。<\/p>\n<h2>前提再拆一层<\/h2>\n<p>规划模式能成立，还依赖以下几条隐含前提；逐条抽掉后给出故障场景与可观测指标。<\/p>\n<ol><li>\n<strong>目标与约束可表述为初始状态与目标状态。<\/strong> 抽掉后：规划无从判断任务是否达成，步骤是否完成没有判定依据。可观测指标：目标要素完整率、达成判定可执行性。\n<\/li><li>\n<strong>存在可调用的执行手段把步骤变成现实。<\/strong> 抽掉后：计划停留在文本层面，工具与通道不可达。可观测指标：步骤执行成功率、工具不可达次数。\n<\/li><li>\n<strong>执行观察能回流到规划环节。<\/strong> 抽掉后：障碍被忽略，计划沿已经失效的状态继续推进。可观测指标：观察回流覆盖率、基于观察的重规划次数。\n<\/li><li>\n<strong>计划粒度可执行且依赖关系明确。<\/strong> 抽掉后：步骤过粗无法落地，或依赖错配导致顺序颠倒。可观测指标：步骤一次执行率、依赖冲突条数。\n<\/li><li>\n<strong>环境变化频率在可重规划范围内。<\/strong> 抽掉后：变化快于规划，计划持续处于过期状态。可观测指标：计划有效期、单位时间重规划频次。\n<\/li><li>\n<strong>规划成本与任务价值匹配。<\/strong> 抽掉后：标准化重复任务也现场生成计划，每次步骤不一、难以复核。可观测指标：单任务规划 token、规划阶段耗时占比。\n<\/ol>\n<h2>补充：规划阶段与执行阶段的成本拆分<\/h2>\n<p>把规划阶段与执行阶段分开记账：规划阶段只产出计划与检查点，不触碰外部系统；执行阶段每步调用工具并回传观察。按前述算例口径，首轮规划约 500 输入 token、420 输出 token，重规划一次约 750 输入、300 输出；执行阶段五步累计输入约 1500 token、输出约 600 token。开放任务中规划成本通常低于执行成本，但重规划次数上升时，规划侧 token 会明显放大。<\/p>\n<p>判断规划是否过度：计划步骤在执行中几乎不被修改，说明任务路径本已明确，可退回固定工作流；每步都触发重规划，说明初始状态信息不足，应先补采集再规划。两个方向的偏差都可用重规划频次与计划修改条数观测，而不是凭“计划写得详不详细”判断。<\/p><\/div><\/details>", "kind": "concept", "title": "规划"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.175<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">工具调用<\/a><\/span><\/div><h1>RAG（检索增强生成，Knowledge Retrieval）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章 | <strong>原书位置<\/strong>：第 14 章《Knowledge Retrieval (RAG)》（PDF 第 175 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>独立模型的知识封在训练参数里：信息可能过时，回答领域问题缺少可核验材料，材料没见过时只能凭倾向生成错误内容（PDF 第 175、178 页）。把整座文档库塞进上下文既不可能——上下文窗口有限，成本与延迟也不可接受。<\/p>\n<p>RAG 要解决的具体困难是：在生成之前插入一个外部知识检索环节，只把与当前问题相关的片段放进上下文，让模型基于可核验材料作答并标注出处。这样回答既能跟上外部知识库的更新，又能降低凭空编造的概率；原书指出，RAG 用可核验数据作为回答依据，降低幻觉风险（PDF 第 176、178 页）。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：RAG 把外部知识检索步骤无缝接入生成过程，依靠嵌入、语义相似度、关键词或混合检索与合理分块找到相关材料，再由专用向量库支撑大规模近邻搜索，使回答贴合语境且有事实锚点（PDF 第 178 页）。逐句拆开：<\/p>\n<ul><li>\n“切块（chunking）”：长文档按章节、段落或句子切成分片，而不是整本 50 页手册作为一块入库；切块方式影响上下文与语义是否完整保留（PDF 第 176 页）。\n<\/li><li>\n“嵌入（embedding）”：把词、句、文档表示为数值向量，含义相近的文本在向量空间距离更近（PDF 第 176 页）。\n<\/li><li>\n“召回”：主路径是向量搜索，按语义距离找概念最接近的分片；BM25 等关键词算法擅长专有名词、型号等字面匹配；工程上常见向量加 BM25 的混合检索（PDF 第 176 页）。\n<\/li><li>\n“重排与阈值”：召回候选再按相关度排序、按距离阈值过滤，取 top-k 进入上下文；书中实现以 <code>SIMILARITY_TOP_K<\/code> 控制召回条数、<code>VECTOR_DISTANCE_THRESHOLD<\/code> 限制语义距离上限（PDF 第 183 页）。\n<\/li><li>\n“注入与生成引用”：通过上下文注入提示模板，模型基于片段生成回答并标注引用；材料未召到时应明说，而不是补全。\n<\/ul>\n<p>正例：用户问公司退货政策第三条，检索命中政策文档片段，把原文片段与出处放进上下文，回答逐条引用；检索不到则说明库内无相关条目。反例：不做检索，模型凭常识概括一条“通用退货政策”。<\/p>\n<h2>原理推导<\/h2>\n<p>RAG 链路按入库、查询、召回、重排、注入、生成六步推导。<\/p>\n<p>入库步：文档切块后转向量，写入向量数据库；传统关键词检索按词面匹配，向量检索按语义接近度定位（PDF 第 177 页）。向量库用 HNSW 等索引结构在大规模向量中快速定位近邻，底层可依赖 FAISS、ScaNN 等库，方案包括托管服务与开源库，也可为 Redis、Elasticsearch、Postgres（pgvector）等增加向量能力（PDF 第 177–178 页）。<\/p>\n<p>查询步：用户问题先做必要的改写或规范化，再转向量；查询与文档措辞不一致时，纯关键词检索容易漏召，语义检索负责跨说法匹配。<\/p>\n<p>召回步：向量检索取语义近邻，关键词检索取字面命中，两路结果融合。召回阶段宁可多取候选，避免一开始就漏掉相关分片。<\/p>\n<p>重排步：候选按综合相关度排序，套距离阈值与 top-k 上限；阈值之外、相似度不足的分片不进上下文。这一步控制注入噪声：无关分片过多会干扰模型判断（PDF 第 178 页）。<\/p>\n<p>注入步：通过提示模板把入选片段连同出处拼进上下文；注入内容的数量与排序直接影响模型抓重点。<\/p>\n<p>生成步：模型基于给定材料作答，引用逐条对应片段。证据分散在多个分片或多篇文档时，检索器可能没集齐必要上下文，导致答案不完整（PDF 第 178 页）。<\/p>\n<p>机制上，RAG 的可靠性受链路最薄弱环节支配：切块切断语义、查询与文档用词脱节、top-k 过大稀释重点，都会让生成环节失去可用材料；原书把效果高度依赖分块策略与检索质量列为主要挑战（PDF 第 178 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>RAG 适用：知识量大且需要更新、回答要求可引用、问题答案可在文档材料中找到。混合检索兼顾字面精确与语义泛化；专有名词、编号、型号优先关键词路径。<\/p>\n<p>边界：证据跨多篇文档多跳关联时，普通向量近邻难以拼接，原书给出 GraphRAG 路线——沿实体节点与关系边做路径推理，代价是知识图谱构建、维护成本与延迟更高（PDF 第 178–179 页）。材料本身过时或互相矛盾时，检索质量再高也无法消除源数据问题；知识库需要周期性同步更新（PDF 第 178 页）。链路带来额外延迟、运营成本与提示 token 消耗（PDF 第 178 页）。<\/p>\n<p>条件去掉会怎样：去掉切块与索引，长文档无法被有效检索；去掉重排阈值，噪声片段涌入上下文；去掉引用要求，回答无法核验，退回纯生成；去掉混合检索，同义词与专业术语各丢一头。<\/p>\n<h2>反例<\/h2>\n<p>有 RAG 仍编造的反例：所需片段未被召回，模型在上下文材料不足时补全细节，回答看似有据实则无据。检索环节没集齐证据时，生成模型倾向把缺口填平（PDF 第 178 页）。<\/p>\n<p>切块过碎的反例：句子级切碎后，每条分片缺少主语与背景，召回命中的片段脱离上下文，模型无法判断结论成立条件；切块需要在粒度与语义完整之间留重叠与上下文窗口。<\/p>\n<h2>辨析<\/h2>\n<p>与长期记忆（第 3 章记忆管理）的差别：长期记忆存跨会话的偏好与事实，写入与召回都有过滤策略；RAG 面向外部文档库的按需检索，材料不进入参数。二者都只是把相关信息放回上下文，区别在存储对象与更新方式。<\/p>\n<p>与工具调用（c05）的差别：RAG 是专用检索管线；工具调用是通用动作通道，检索工具只是其中一类。需要动态计算、查询业务系统时走工具，需要回答文档知识时走 RAG。<\/p>\n<p>与 GraphRAG / Agentic RAG 的差别：标准 RAG 是被动数据管线；Agentic RAG 由智能体主动推理、验证并精炼外部知识；GraphRAG 换用图结构检索多跳关系（PDF 第 179、180 页）。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：嵌入与语义相似度概念、上下文窗口约束；工具调用通道可挂载检索能力。后继：RAG 为反思与评审提供外部证据，为多智能体中的研究角色提供材料；记忆层把本次交互中稳定的事实沉淀下来。本概念把“切块—索引—召回—重排—注入—引用”的链路与各环节失败模式、成本结构串在一起。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（RAG（检索增强生成））<\/summary><div class=\"depth-body\"><h1>RAG（检索增强生成）· 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>逐级倒查 RAG 链路成立的前提：<\/p>\n<ol><li>\n“回答有材料依据”依赖相关片段被召回：答案所需证据确实在知识库中，且检索器能把它取出；材料不在库内，链路再顺也无米下锅。\n<\/li><li>\n“片段被召回”依赖切块与索引可用：文档被切成语义完整的分片并转向量入库；切块切断主语与背景，分片脱离上下文，召回也无法使用。\n<\/li><li>\n“召回对齐”依赖查询与文档可对齐：查询说法与文档措辞不一致时，关键词路径漏召，需要语义检索跨说法匹配；两路互补构成混合检索。\n<\/li><li>\n“注入上下文干净”依赖重排与阈值控制：候选按相关度排序后取 top-k，相似度不足的分片不进上下文；噪声过多会误导模型判断（PDF 第 178 页）。\n<\/li><li>\n“材料可更新”依赖知识库可预处理与同步：文档切块、向量化、写入专用存储需要工程投入，动态 wiki 还需周期性更新，否则知识过时（PDF 第 178 页）。\n<\/li><li>\n最底层假设：问题答案可以在外部文档材料中找到并被引用；需要开放式推理或实时业务数据的问题，应分别走推理链路或工具调用（c05）。\n<\/ol>\n<p>逆推到读者基线：先认“材料在库里”，再认“材料能被检索到”，最后认“干净材料能进上下文并被引用”。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条按六步推进，每步写清假设：<\/p>\n<ul><li>\n入库步：文档切块后转向量写入向量库；关键词检索按词面匹配，向量检索按语义接近度定位（PDF 第 177 页）。向量库用 HNSW 等索引在大规模向量中快速定位近邻，底层可依赖 FAISS、ScaNN 等库；方案含托管服务与开源库，也可为 Redis、Elasticsearch、Postgres（pgvector）增加向量能力（PDF 第 177–178 页）。用到的假设：嵌入模型把相近语义映射到相近位置；嵌入质量差，语义检索一起失效。\n<\/li><li>\n查询步：问题先做必要改写或规范化，再转向量；查询与文档措辞脱节时，纯关键词检索漏召，语义检索负责跨说法匹配。\n<\/li><li>\n召回步：向量检索取语义近邻，关键词检索取字面命中，两路融合。召回阶段宁可多取候选，避免一开始漏掉相关分片。\n<\/li><li>\n重排步：候选按综合相关度排序，套距离阈值与 top-k 上限；书中实现以 <code>SIMILARITY_TOP_K<\/code> 控制召回条数、<code>VECTOR_DISTANCE_THRESHOLD<\/code> 限制语义距离上限（PDF 第 183 页）。这一步控制注入噪声。\n<\/li><li>\n注入步：通过提示模板把入选片段连同出处拼进上下文；注入内容数量与排序直接影响模型抓重点。\n<\/li><li>\n生成步：模型基于给定材料作答，逐条对应引用。证据分散在多个分片或多篇文档时，检索器可能没集齐必要上下文，导致答案不完整（PDF 第 178 页）。\n<\/ul>\n<p>机制定位：RAG 可靠性受链路最薄弱环节支配。切块切断语义、查询与文档用词脱节、top-k 过大稀释重点，都会让生成环节失去可用材料；原书把效果高度依赖分块策略与检索质量列为主要挑战（PDF 第 178 页）。<\/p>\n<p>限定条件拆解：<\/p>\n<ul><li>\n史料：BM25 为基于词频排序的传统方法，擅长专有名词与型号字面匹配；混合检索兼顾字面精确与语义泛化（PDF 第 176 页）。\n<\/li><li>\n推断：top-k 取值是召回率与噪声的权衡——取少了漏证据，取多了稀释重点；最优值取决于分片长度与查询类型，原书未给固定数字。\n<\/li><li>\n边界：证据跨多篇多跳关联时，普通向量近邻拼接困难，GraphRAG 沿实体节点与关系边做路径推理，代价是图谱构建维护成本与延迟更高（PDF 第 178–179 页）。\n<\/ul>\n<h2>机制逐项对照<\/h2>\n<ul><li>\n与长期记忆：长期记忆存跨会话偏好与事实，写入召回都有过滤；RAG 面向外部文档库按需检索，材料不进参数。二者都是把相关信息放回上下文，区别在存储对象与更新方式。\n<\/li><li>\n与工具调用：RAG 是专用检索管线；工具调用是通用动作通道，检索工具只是一类。文档知识走 RAG，动态计算与业务系统查询走工具。\n<\/li><li>\n与 GraphRAG / Agentic RAG：标准 RAG 是被动数据管线；Agentic RAG 由智能体主动推理、验证并精炼外部知识；GraphRAG 换用图结构检索多跳关系（PDF 第 179、180 页）。\n<\/li><li>\n失败位置：RAG 失败多在检索与切块环节，不在生成；材料没召回到，生成模型只能在缺口上补全。\n<\/ul>\n<h2>算例：退货政策问答<\/h2>\n<p>估算口径（工程估算，非原书测量值）：查询改写与嵌入约 200 输入 token；召回候选 8 条、每条约 300 token；重排后入选 3 条；生成提示约 500 token；模型按 50 token/s 生成，检索往返约 0.2–0.5 秒。<\/p>\n<p>任务：用户问“我们公司退货政策第三条是什么”。<\/p>\n<p>第 1 步，切块入库（离线）：政策文档按条款切成分片，每片含条款编号与上下文，转向量入向量库；条款标题与编号同时建关键词索引。 第 2 步，查询处理：问题规范化为“退货政策 第三条”，转向量。 第 3 步，召回：向量路径取语义近邻 5 条，BM25 路径按“退货、第三条”命中 3 条，融合去重得候选 8 条。 第 4 步，重排：按相关度排序，套距离阈值，入选 3 条；其中 1 条相似度低于阈值被剔除。 第 5 步，注入：把 3 条原文片段与出处编号拼入提示模板，注入材料约 900 token。 第 6 步，生成：模型基于片段作答，引用对应条款编号；输入约 1400 token，输出约 200 token，生成约 4 秒加检索往返。<\/p>\n<p>失败分支：<\/p>\n<ul><li>\n未召回：候选中没有第三条内容，上下文材料不足；模型应明说库内未检索到该条款，而不是凭常识补一条通用政策。\n<\/li><li>\n证据冲突：两条分片对退货期限表述不一致，重排无法消解时，标注分歧并转人工核对源文档。\n<\/li><li>\n多跳缺失：问题需要跨两篇文档拼接结论，标准向量检索只命中单篇，答案不完整；这类问题评估是否走 GraphRAG。\n<\/ul>\n<p>量级对照：链路额外成本在检索往返与注入 token；召回 8 条若不重排直接注入，材料约 2400 token，噪声稀释重点；重排后 3 条约 900 token。整条链路的延迟、运营成本与提示 token 都高于纯生成（PDF 第 178 页），换来的是可引用与可核验。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：所需片段未被召回，模型在材料不足时补全细节，回答看似有据实则无据。反例二：句子级切碎后分片缺主语与背景，命中片段脱离上下文，模型判断不出结论成立条件。边界：源数据过时或互相矛盾时检索质量无法补救；知识库需周期性同步；图谱路线成本高、延迟大。<\/p>\n<h2>延伸推演：召回率、噪声与延迟分解<\/h2>\n<p>RAG 检索环节在召回率与噪声之间权衡。top-k 取大，相关片段被漏掉的概率下降，但进入上下文的无关片段增多，模型注意力被稀释，矛盾材料也更易出现；top-k 取小，噪声减少，但证据不全时答案不完整。距离阈值剔除低相似度分片，阈值过严漏掉近义表述，过松放进噪声分片。最优取值随分片长度、查询类型与嵌入质量变化，需要在标注样例上比对召回与可用率，而不是沿用固定数字。<\/p>\n<p>切块策略影响两头。切得过碎，分片缺主语、背景与结论条件，命中后无法独立使用；切得过整，单块信息密度低、语义混杂，向量距离被稀释。重叠切块让相邻分片共享边缘句子，缓解切断语义的问题，代价是入库存储与重复内容增加。专有名词、编号、型号优先靠关键词路径，语义近义表达靠向量路径，混合检索覆盖两头（PDF 第 176 页）。<\/p>\n<p>链路延迟可以拆成几段：查询处理与嵌入、两路检索往返、重排排序、注入拼接、生成作答。检索往返是外部耗时，注入 token 随入选分片数量增长，生成时间随上下文长度上升。整条链路比纯生成多付出检索成本与提示 token，换来的是材料可引用、知识可更新；当问题答案不在知识库中时，这套成本不产生收益，系统应明示未检索到，而不是补全。<\/p>\n<h2>补充算例：检索失败的链路定位<\/h2>\n<p>RAG 回答出错时，按链路逐段定位而不是归因于生成模型。先查入库：文档是否切块、转向量、写入索引；再查查询：问题改写是否保留了核心实体与限定条件；再查召回：相关分片是否进入候选集；再查重排：相关分片是否被阈值或 top-k 滤掉；最后查注入与生成：入选材料是否完整进入上下文，引用是否对应正确分片。每一段都有可检查的中间产物，定位才不会停在“回答不准”。<\/p>\n<p>切块策略补充：说明书按章节切，条款类文档按条目切，长段落按句子加重叠切；分片内保留标题路径（章节编号加标题），让命中分片自带上下文。重叠长度按分片大小调整，目的是避免边界处结论被切断。入库时同时记录分片来源、版本与更新时间，支撑后续时效判断。<\/p>\n<p>查询改写的作用：用户提问常含代词、口语化表述或省略，改写补充实体与限定词后再转向量；改写不能改变原意，也不能引入材料中不存在的限定。混合检索中，关键词路径兜住型号、编号、专有名词等字面命中，向量路径兜住近义与表述差异；两路结果融合时按来源标注，便于回溯命中依据。<\/p>\n<p>引用核验：生成回答的每条主张都应能指回具体分片；引用缺失或分片不支撑主张，属于输出层可拦截的问题。材料互相矛盾时，标注分歧并核对源文档版本，不替源数据做取舍。知识库需要周期性同步：源文档更新后重新切块入库，旧版本分片及时失效，否则召回新旧并存的依据。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：有 RAG 就不会幻觉。<\/strong> 反证：材料没召回到时模型照样编；检索环节没集齐证据，生成倾向填平缺口（PDF 第 178 页）。\n<\/li><li>\n<strong>误读：向量检索万能。<\/strong> 反证：精确术语、编号、型号用关键词检索更稳；实践上用向量加 BM25 混合检索互补（PDF 第 176 页）。\n<\/li><li>\n<strong>误读：top-k 越大材料越全。<\/strong> 反证：候选过多稀释重点、引入噪声；重排阈值与入选条数要按分片长度和查询类型权衡。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\nRAG 六步中，哪一步决定“哪些材料进上下文”？top-k 与距离阈值分别控制什么？\n<\/li><li>\n为什么说 RAG 失败多在检索与切块，而不在生成？用未召回分支说明。\n<\/li><li>\n混合检索两路各擅长什么？只保留一路会漏掉哪类匹配？\n<\/li><li>\n用算例说明重排前后注入 token 的差别；噪声分片进入上下文会造成什么误导？\n<\/li><li>\n证据跨多篇多跳关联时标准 RAG 的短板在哪？GraphRAG 用什么结构弥补，代价是什么？\n<\/ol>\n<h2>适用与不适用速查<\/h2>\n<p>适合 RAG 的情况：知识量大且需要更新，回答要求可引用，答案可在文档材料中找到。不适合 RAG 单独承担的情况：需要开放式推理的问题、实时业务系统数据查询（走工具调用）、证据跨多篇多跳关联（评估 GraphRAG）。链路质量受最薄弱环节支配：切块切断语义、查询与文档用词脱节、top-k 过大都会让生成失去可用材料；材料未召到时应明示，而不是补全细节。<\/p>\n<p>入库分片记录来源文档、版本号与更新时间；源文档修订后重新切块入库并使旧分片失效，避免新旧版本依据同时被召回，造成答案前后矛盾。<\/p>\n<p>重排阶段保留候选出处，便于回答回溯；入选片段在上下文中按相关度排序，重点材料靠前，避免噪声材料挤占模型注意力。<\/p>\n<h2>第二个任务的端到端算例：500 篇文档库的召回率与上下文预算<\/h2>\n<p>估算口径（工程估算，非原书实测）：中文按约 1.6 字符/token；切块按 500 汉字/块 ≈ 312 token/块；窗口按 32768 token 估算。<\/p>\n<p>库规模：500 篇文档，平均每篇 3000 汉字 ≈ 1875 token/篇；每篇切 6 块，总块数约 3000 块。<\/p>\n<p>检索链路：<\/p>\n<ol><li>\n提问嵌入：问题约 40 汉字 ≈ 25 token；嵌入向量不占文本上下文。\n<\/li><li>\n向量召回 top-20：候选 20 块；BM25 关键词补回 5 块，去重后 22 块。\n<\/li><li>\n重排取 top-5：保留 5 块，片段合计约 1560 token（5 × 312）。\n<\/li><li>\n注入生成：系统提示约 300 token + 片段 1560 + 问题 25，输入约 1885 token；答案输出约 300 token，占窗口约 5.8%。\n<\/ol>\n<p>召回率推算：假设与问题相关的块在库内共 8 块；向量召回命中 6 块，BM25 补回 1 块，混合召回命中 7/8 ≈ 87.5%；重排后 top-5 保留其中 5 块，注入命中率 5/7 ≈ 71%。若只取 top-3，片段降至约 936 token，但靠后的相关块可能被截掉。<\/p>\n<p>上下文预算：top-k 每增加 1 块增加约 312 token；top-5 扩到 top-10 增加约 1560 token，生成可用上下文相应减少。失败定位：型号等专有名词走字面匹配，向量漏、BM25 命中；距离阈值过高会滤掉相关块，过低则引入噪声片段。<\/p>\n<h2>前提再拆一层<\/h2>\n<p>RAG 链路能成立，还依赖以下几条隐含前提；逐条抽掉后给出故障场景与可观测指标。<\/p>\n<ol><li>\n<strong>文档已切块入库且切块保留语义完整。<\/strong> 抽掉后：相关信息跨块断裂，召回命中也答不全。可观测指标：块内语义完整率、跨块相关占比。\n<\/li><li>\n<strong>嵌入、索引与查询处于同一表示空间并保持更新。<\/strong> 抽掉后：新文档检索不到，或术语错位导致语义距离失真。可观测指标：新文档可检索时延、索引新鲜度。\n<\/li><li>\n<strong>相关材料确实存在于库内。<\/strong> 抽掉后：检索无命中，模型只能凭倾向补全内容。可观测指标：无命中间占比、拒答率。\n<\/li><li>\n<strong>重排阈值与 top-k 与上下文预算匹配。<\/strong> 抽掉后：噪声挤占窗口，或相关块在截断处被丢掉。可观测指标：注入片段相关度、窗口占用率。\n<\/li><li>\n<strong>生成环节以片段为依据并标注出处。<\/strong> 抽掉后：检索到的材料不被使用，答案与片段脱节。可观测指标：答案引用片段覆盖率、无依据陈述条数。\n<\/li><li>\n<strong>评测集覆盖真实提问方式。<\/strong> 抽掉后：离线召回率好看，线上长尾问题漏检。可观测指标：离线 top-k 命中与线上抽样一致率、长尾问题召回率。\n<\/ol>\n<h2>补充：混合检索与阈值的代价对照<\/h2>\n<p>纯向量召回对专有名词、型号编号等字面信号较弱；BM25 补回的块在这类查询上贡献主要命中。混合召回的代价是候选集合变大，重排环节需要排序的块数从 20 增到 22，重排延迟随候选数线性增加。距离阈值的调整方向：阈值放宽，注入片段相关度下降、窗口占用上升；阈值收紧，召回率下降、无命中拒答增多。<\/p>\n<p>调阈值时同时看两个指标——注入片段相关度与无命中率，单看任一侧都会把系统推向噪声或漏检。top-k 的选择同样受上下文预算约束：每增加一块约 312 token，需要从生成可用额度里扣除对应部分；预算紧张时先收紧 top-k，再用重排质量补召回。<\/p><\/div><\/details>", "kind": "concept", "title": "RAG（检索增强生成）"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.97<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">规划<\/a><\/span><\/div><h1>多智能体协作（Multi-Agent Collaboration）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章 | <strong>原书位置<\/strong>：第 7 章《Multi-Agent Collaboration》（PDF 第 97 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>单体智能体在边界清晰的问题上往往够用，但面对复杂、跨领域任务时能力很快触及瓶颈：单个角色同时承担研究、写作、审阅，工具清单越堆越长，上下文装不下，视角也互相牵制（PDF 第 97 页）。多智能体协作要解决的困难，是把复杂问题拆给具备相应工具与能力的专精智能体，通过交互与协同完成共同目标。<\/p>\n<p>另一类困难是接口与协调：多个智能体各自独立运转时，容易重复劳动、结论互相覆盖、责任边界不清。多智能体设计不只是“多起几个模型”，还要明确谁做什么、信息怎么传递、最终由谁汇总；原书指出，系统的力量来自智能体之间的交互与协同效应（PDF 第 97 页）。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：多智能体协作设计由多个独立或半独立智能体组成的系统，围绕共同目标工作；各智能体通常有清晰角色、与总体目标对齐的子目标，并可访问不同工具或知识库（PDF 第 97 页）。逐句拆开：<\/p>\n<ul><li>\n“独立或半独立”：各智能体有自己的执行循环与上下文，不是同一提示下的几次调用。\n<\/li><li>\n“角色与子目标”：角色定义职责边界，子目标与总体目标对齐，避免各自为政。\n<\/li><li>\n“不同工具或知识库”：每个智能体分管一部分工具与资料，而不是由单一智能体包揽全部工具（PDF 第 98 页）。\n<\/li><li>\n“三要素”：角色与职责划分、信息交换通道、指导协作的任务流或交互协议（PDF 第 99 页）。\n<\/li><li>\n“协作拓扑”：书中列出顺序交接、并行处理、辩论与共识、层级结构、专家团队、批评者—审阅者六种形式（PDF 第 98 页）。\n<\/ul>\n<p>正例：研究者检索材料、写作者起草稿件、编辑审阅修订；管理者智能体按下属能力动态分派任务并汇总结果。反例：两个智能体角色描述重叠、输出格式未定，并行产出后无人负责合并，最终交付两份互相矛盾的草稿。<\/p>\n<h2>原理推导<\/h2>\n<p>多智能体系统可按分工、通信、协议、汇总四步推导。<\/p>\n<p>第一步分工：把任务拆成职责可辨的子任务，分配给对应角色。角色之间的输入、输出与验收标准写清楚；工具按角色分管，减少单个上下文的工具清单长度。分工成立的前提是子任务接口清晰、可独立验收；接口不清时，协调成本高于分工收益。<\/p>\n<p>第二步通信：智能体之间通过消息交换信息。消息内容约定结构（谁、做了什么、产物是什么、依据什么），避免每条消息都靠自然语言重新理解。通信需要共享状态：共同目标、已完成项、待办与约束，保证各角色在同一事实基础上协作。<\/p>\n<p>第三步协议：任务流规定协作顺序与规则——是顺序交接、并行汇合、辩论共识还是层级委派。原书六种拓扑对应不同依赖结构：顺序交接把产物交给下一个智能体推进流水线；并行处理同时处理不同片段后合并；辩论与共识由不同视角讨论后形成判断；层级结构由管理者分派并汇总；专家团队按领域分工；批评者—审阅者先出初稿再从政策、安全、合规、正确性、质量等维度审阅（PDF 第 98 页）。<\/p>\n<p>第四步汇总：指定最终负责合成结果的角色或环节。并行产物在此合并、去重、消解冲突；批评意见回流给原作者或终审智能体修订。没有汇总责任，多份产物无法变成一份交付。<\/p>\n<p>机制上，多智能体把单体内的上下文与工具压力分散到多个角色，代价是通信开销、上下文不一致与责任协调；收益是否覆盖成本，取决于拆分处的接口质量。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>多智能体适用：任务可拆成接口清晰、可独立验收的子任务；需要不同专业视角或不同工具/知识库；片段可并行或需要独立审阅。代码生成、研究写作、逻辑校验、伦理对齐等场景适合批评者—审阅者拓扑（PDF 第 98 页）。<\/p>\n<p>边界：子任务强依赖、接口无法预先定义时，拆分后通信反复对齐，稳定性低于单智能体加工具。角色重叠会造成重复劳动与责任稀释；智能体数量增加不直接等于质量提升。通信链条过长会放大 token 消耗与延迟，上下文在多跳传递中可能失真。<\/p>\n<p>条件去掉会怎样：去掉角色职责划分，多个智能体争抢同一任务；去掉通信协议，消息格式与流转顺序无约定；去掉汇总环节，并行结果并列输出；去掉共享状态，各角色基于不一致的前提工作。<\/p>\n<h2>反例<\/h2>\n<p>接口不清仍拆分的反例：数据分析任务拆给两个智能体，一个出结论、一个找证据，但未约定结论引用证据的格式，汇合时证据与主张对不上，只能返工重连。<\/p>\n<p>角色堆叠的反例：为一个简单问答配置规划者、执行者、批评者、汇总者四个角色，每次回答经过四跳通信，延迟与 token 数倍增长，回答质量与单智能体持平。书中把“怎么做是否需要分解”作为判断前提（与规划权衡一致，PDF 第 87 页），简单任务不必上多智能体。<\/p>\n<h2>辨析<\/h2>\n<p>与并行化（c03）的差别：并行化是执行层并发手段，子任务可以是同模型多次调用；多智能体是角色与协议层分工，含独立上下文、消息通道与汇总责任。多智能体内部常嵌套并行，但并行本身不构成多智能体。<\/p>\n<p>与规划（c06）的差别：规划是决策层分解与调度；多智能体把分解出的子任务交给不同角色执行。规划可以由管理者智能体承担，规划产出的序列是多智能体协议的输入。<\/p>\n<p>与人机协作（第 4 章）的差别：多智能体角色之间自动交接；人机协作在关键动作前引入人工审批或确认。人作为一个特殊角色进入协作链，承担复核与否决。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：链式的结构化产物、并行化的并发与聚合、规划的任务分解。后继：护栏（c09）约束各智能体的权限与输出；工具调用是各角色触达外部能力的通道；反思的生产者—批评者模型是批评者—审阅者拓扑的简化形态。本概念把“分工—通信—协议—汇总”的设计链路与协调成本、接口前提串在一起。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（多智能体协作）<\/summary><div class=\"depth-body\"><h1>多智能体协作（Multi-Agent Collaboration）· 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>逐级倒查多智能体系统成立的前提：<\/p>\n<ol><li>\n“多角色能合成一份交付”依赖汇总责任明确：有指定角色或环节负责合并、去重、消解冲突，最终产物由它收口；没有汇总责任，多份产物无法变成一份交付。\n<\/li><li>\n“汇总可执行”依赖通信协议约定：消息结构、流转顺序、交接格式事先写清；每条消息说明谁、做了什么、产物是什么、依据什么。\n<\/li><li>\n“协议可落地”依赖角色接口可验收：每个智能体的输入、输出与验收标准明确；接口不清，通信反复对齐，协调成本高于分工收益。\n<\/li><li>\n“接口可划分”依赖子任务可拆分：任务能按职责、专业或工具边界分成独立单元；强耦合、无法预先定义接口的部分不宜拆给不同智能体。\n<\/li><li>\n“协作不跑偏”依赖共享状态：共同目标、已完成项、待办与约束在角色之间一致；各角色基于不一致的前提工作，结论互相覆盖。\n<\/li><li>\n最底层假设：拆分带来的专业化与并行收益，超过通信、上下文不一致与责任协调的成本；收益不抵成本时，单智能体加工具更稳。\n<\/ol>\n<p>逆推到读者基线：先认“任务能按职责拆开”，再认“角色之间消息怎么传”，最后认“谁来收口”。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条分四步，每步写清假设：<\/p>\n<ul><li>\n第一步，分工。把任务拆成职责可辨的子任务分配给对应角色；角色之间的输入、输出与验收标准写清楚；工具按角色分管，减少单个上下文的工具清单长度。用到的假设：子任务接口清晰、可独立验收；这是分工成立的硬前提。\n<\/li><li>\n第二步，通信。智能体通过消息交换信息，消息约定结构；通信需要共享状态，保证各角色在同一事实基础上协作。用到的假设：结构化消息能被接收方直接解析，不必靠自然语言重新理解。\n<\/li><li>\n第三步，协议。任务流规定协作顺序与规则。原书列出六种拓扑：顺序交接把产物交给下一智能体推进流水线；并行处理同时处理不同片段后合并；辩论与共识由不同视角讨论后形成判断；层级结构由管理者分派并汇总；专家团队按领域分工；批评者—审阅者先出初稿，再从政策、安全、合规、正确性、质量、组织目标一致性等维度审阅（PDF 第 98 页）。\n<\/li><li>\n第四步，汇总。指定最终合成结果的角色或环节；并行产物在此合并、去重、消解冲突；批评意见回流给原作者或终审智能体修订。\n<\/ul>\n<p>机制定位：多智能体把单体内的上下文与工具压力分散到多个角色，代价是通信开销、上下文不一致与责任协调；收益是否覆盖成本取决于拆分处的接口质量。系统三要素为角色职责划分、信息交换通道、任务流或交互协议（PDF 第 99 页）。<\/p>\n<p>限定条件拆解：<\/p>\n<ul><li>\n史料：六种协作拓扑与三要素均来自原书第 7 章（PDF 第 98–99 页）。\n<\/li><li>\n推断：角色数量与质量的关系是非单调的——角色过少职责堆叠，过多则通信链拉长；最优规模取决于任务可分性，原书未给固定数量。\n<\/li><li>\n边界：子任务强依赖、接口无法预定义时，拆分后稳定性低于单智能体加工具；通信链条过长会放大 token 消耗与延迟，上下文在多跳传递中可能失真。\n<\/ul>\n<h2>机制逐项对照<\/h2>\n<ul><li>\n与并行化：并行化是执行层并发手段，子任务可以是同模型多次调用；多智能体是角色与协议层分工，含独立上下文、消息通道与汇总责任。多智能体内部常嵌套并行，但并行本身不构成多智能体。\n<\/li><li>\n与规划：规划是决策层分解与调度；多智能体把分解出的子任务交给不同角色执行。规划可由管理者智能体承担，规划产出的序列是多智能体协议的输入。\n<\/li><li>\n与人机协作：多智能体角色之间自动交接；人机协作在关键动作前引入人工审批或确认。人作为特殊角色进入协作链，承担复核与否决。\n<\/li><li>\n失败位置：多智能体失败集中在分工（接口不清）、通信（格式状态不一致）、汇总（冲突未消解）三处；角色重叠造成重复劳动与责任稀释。\n<\/ul>\n<h2>算例：研究—写作—编辑团队<\/h2>\n<p>估算口径（工程估算，非原书测量值）：每个角色系统提示约 800 token；角色间消息按产物长度计；模型按 50 token/s 生成，消息编排往返约 0.3 秒。<\/p>\n<p>任务：产出一篇带引用的研究简报。<\/p>\n<p>角色与接口：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>角色<\/th><th>输入<\/th><th>输出<\/th><th>验收标准<\/th><\/tr><\/thead><tbody><tr><td>研究者<\/td><td>主题 + 检索范围<\/td><td>材料清单（片段 + 出处）<\/td><td>每条材料带出处，无空引用<\/td><\/tr><tr><td>写作者<\/td><td>材料清单<\/td><td>简报初稿<\/td><td>主张挂对应材料，结构完整<\/td><\/tr><tr><td>编辑/审阅者<\/td><td>初稿 + 政策与质量标准<\/td><td>审阅意见 + 修订建议<\/td><td>逐条标注问题位置与改法<\/td><\/tr><tr><td>汇总者<\/td><td>修订稿<\/td><td>最终简报<\/td><td>引用完整，冲突已消解<\/td><\/tr><\/tbody><\/table><\/div>\n<p>消息流：<\/p>\n<ol><li>\n研究者并发检索，产物约 600 token，交写作者；本步输入约 1000 token，输出约 600 token。\n<\/li><li>\n写作者读取材料清单生成初稿，约 800 token；输入约 1400 token，输出约 800 token。\n<\/li><li>\n审阅者按标准出意见，约 300 token；输入约 1600 token，输出约 300 token。\n<\/li><li>\n写作者据意见出修订版，约 820 token；汇总者合并定稿约 700 token。\n<\/ol>\n<p>通信开销：四跳消息合计模型侧输入约 5000 token、输出约 3200 token；角色间消息往返约 1.2 秒，加各角色生成时间。对照单智能体串行完成同题，输入约 1800 token、输出约 900 token；多智能体多出的 token 与延迟，换的是研究、写作、审阅三个视角的分离与独立验收。<\/p>\n<p>冲突解决：研究者两份材料结论不一致时，汇总者标注分歧并退回研究者补证；审阅者与写作者意见冲突时，以验收标准为准，不按角色级别压服。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：数据分析任务拆给两个智能体，结论与证据的引用格式未约定，汇合时对不上，只能返工重连。反例二：简单问答配置规划者、执行者、批评者、汇总者四角色，每答一跳通信，延迟与 token 数倍增长，质量与单智能体持平。边界：子任务强依赖、接口无法预定义时优先单智能体；角色重叠要合并；通信链过长要压缩跳数。<\/p>\n<h2>延伸推演：通信开销与 token 爆炸<\/h2>\n<p>多智能体的通信成本随跳数和消息体积增长。设一条协作链经过 <span class=\"katex-inline\">h<\/span> 个角色，每跳传递一份产物 <span class=\"katex-inline\">M<\/span>，若每跳都把上游历史整包再带一遍，第 <span class=\"katex-inline\">h<\/span> 跳携带的内容随跳数累加；即便只传当前产物，每个角色也要重新载入自身系统提示与接收材料。角色越多、交接越频，上下文在多跳传递中被反复搬运，token 总量明显高于单智能体串行完成。<\/p>\n<p>上下文失真沿跳数累积。上游产物经过摘要、转述、格式转换后交给下游，细节在每一跳损失或走样；协议约定的结构化消息能减少自然语言转述带来的偏差，但跨多跳后仍需汇总者对照原始材料核验。压缩消息体积与保留关键依据之间要平衡：只传结论不传依据，下游无法判断结论成立条件；全量传递又撑爆上下文。<\/p>\n<p>协调成本决定多智能体是否划算。分工带来专业化与并行收益，对应的成本是角色对齐、消息等待、冲突消解与责任认定。子任务接口清晰、产物可独立验收时，协调成本可控；接口模糊时，角色间反复澄清、互相等待，成本超过单智能体加工具。判断顺序因此是先看任务可分性，再估通信与协调成本，最后才决定是否拆成多角色；不是所有并行任务都需要独立智能体。<\/p>\n<h2>补充算例：角色接口与拓扑选型<\/h2>\n<p>角色接口定义逐项写明：角色名与职责、输入材料清单、输出格式与验收标准、可调用工具、禁止动作。以研究—写作—编辑团队为例，研究者输出材料清单必须含片段与出处，写作者初稿每条主张挂材料编号，编辑意见标注问题位置与改法；接口不定，汇合时只能靠自然语言互相追问。<\/p>\n<p>拓扑选型对照：流程前后衔接、产物依次传递，选顺序交接；片段互不依赖、分头处理，选并行处理；需要多视角权衡备选项，选辩论与共识；任务可按能力分派并需要收口，选层级结构；领域专长分明，选专家团队；产出后需要合规与质量复核，选批评者—审阅者。拓扑由依赖结构决定，不是先定角色再找用途。<\/p>\n<p>汇总冲突处理：两份产物结论不一致时，汇总者对照各自依据判定；依据不足则退回补充，不按角色级别压服。重复信息在汇总步去重，遗漏项列出缺口。多跳通信中，关键依据随消息携带，避免下游只能看到结论看不到来源。<\/p>\n<p>边界对照：单智能体加工具能完成的任务，拆分多角色只会增加等待与对齐成本；子任务可独立验收、工具可分管、视角确实需要分离时，专业化收益才覆盖通信开销。判断顺序：先拆任务，再估接口清晰度，最后决定是否拆角色。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：智能体数量越多越强。<\/strong> 反证：角色重叠增加协调成本与重复劳动；能力来自接口质量与专业化，不来自角色堆叠。\n<\/li><li>\n<strong>误读：多智能体一定比单智能体准。<\/strong> 反证：接口不清时通信反复对齐，系统更不稳定；判断标准是子任务能否接口清晰、独立验收。\n<\/li><li>\n<strong>误读：多智能体就是多次并行调用。<\/strong> 反证：并行调用不含独立角色、消息协议与汇总责任；多智能体是分工层设计，并发只是其内部执行手段。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n多智能体四步中，哪一步决定角色边界？哪一步对最终产物收口？\n<\/li><li>\n六种协作拓扑分别对应什么依赖结构？批评者—审阅者拓扑适用于哪些场景？\n<\/li><li>\n通信协议要约定哪些内容？共享状态缺失会导致什么不一致？\n<\/li><li>\n用算例对照单智能体，说明多智能体多出的 token 与延迟换来了什么；什么情况下这笔交易不划算？\n<\/li><li>\n多智能体与并行化、规划、人机协作的边界分别在哪里？\n<\/ol>\n<h2>适用与不适用速查<\/h2>\n<p>适合多智能体的情况：任务可拆成接口清晰、可独立验收的子任务，需要不同专业视角或分管不同工具。不适合多智能体的情况：子任务强依赖、接口无法预定义，或单智能体加工具即可完成；后者拆分带来的通信与对齐成本高于收益。先判断任务可分性，再估协调成本，最后才决定是否拆角色。<\/p>\n<h2>第二个任务的端到端算例：分布式排障团队的通信量估算<\/h2>\n<p>估算口径（工程估算，非原书实测）：中文按约 1.6 字符/token；各角色独立上下文，顺序交接；模型回合生成按 50 token/s。<\/p>\n<p>拓扑：监控员 → 诊断员 → 修复员 → 复核员，顺序交接、层级收口；任务是线上接口报错率升高后的排障。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>角色<\/th><th>输入构成<\/th><th>输入 token<\/th><th>产物<\/th><th>输出 token<\/th><\/tr><\/thead><tbody><tr><td>监控员<\/td><td>告警信息 150<\/td><td>约 150<\/td><td>异常摘要（指标、时段、影响范围）<\/td><td>约 280<\/td><\/tr><tr><td>诊断员<\/td><td>摘要 280 + 历史日志 600<\/td><td>约 880<\/td><td>可能原因排序<\/td><td>约 320<\/td><\/tr><tr><td>修复员<\/td><td>诊断 320 + 变更记录 400<\/td><td>约 720<\/td><td>修复方案与执行步骤<\/td><td>约 300<\/td><\/tr><tr><td>复核员<\/td><td>方案 300 + 风险清单 200<\/td><td>约 500<\/td><td>复核结论<\/td><td>约 180<\/td><\/tr><\/tbody><\/table><\/div>\n<p>通信量对照：若每一跳都把上游全量上下文复制进当前角色，四跳累计上下文膨胀约 3430 token（150+280、280+600+320、320+400+300、300+200+180 分段相加）；只传结构化产物时累计约 1230 token。两者差额就是接口不清造成的 token 膨胀。<\/p>\n<p>延迟：顺序交接，四个角色各一次模型回合约 4 × 6 s，外部工具时间另计；复核必须在修复方案之后，不能与修复并行。可观测指标：角色间消息条数、每跳平均 token、重复劳动次数、结论回退率。<\/p>\n<h2>前提再拆一层<\/h2>\n<p>多智能体协作能成立，还依赖以下几条隐含前提；逐条抽掉后给出故障场景与可观测指标。<\/p>\n<ol><li>\n<strong>角色职责边界清晰且子目标对齐总目标。<\/strong> 抽掉后：两个角色重复排查，或各自为政、结论方向分散。可观测指标：职责重叠条目、子目标偏离率。\n<\/li><li>\n<strong>角色间接口与产物格式约定明确。<\/strong> 抽掉后：下游要从上游自由文本里提取信息，交接处反复返工。可观测指标：接口字段命中率、格式返工次数。\n<\/li><li>\n<strong>通信通道只传递必要信息。<\/strong> 抽掉后：全量上下文跨角色复制，token 随跳数膨胀。可观测指标：每跳平均 token、上下文冗余率。\n<\/li><li>\n<strong>有明确的收口角色与决策顺序。<\/strong> 抽掉后：多份结论并列交付，无人负责合并。可观测指标：收口缺失次数、矛盾结论条数。\n<\/li><li>\n<strong>各角色工具与资料与其职责匹配。<\/strong> 抽掉后：诊断员拿不到日志，只能凭推测给原因。可观测指标：角色工具可达率、因资料不足导致的回退次数。\n<\/li><li>\n<strong>拓扑与任务依赖匹配。<\/strong> 抽掉后：强依赖被并行切开，或无依赖被串行拖慢。可观测指标：拓扑返工次数、阶段等待时间。\n<\/ol>\n<h2>补充：顺序交接与并行团队的延迟对照<\/h2>\n<p>顺序交接拓扑的延迟等于各角色回合耗时相加，通信简单、责任清晰；并行团队中各角色同时开工，延迟取最长支路，但需要收口角色处理产物冲突。排障场景里诊断与修复存在依赖，不能并行；若任务改为“三条线索分别排查”，则可并行采集再由收口角色合并。<\/p>\n<p>选拓扑先看角色间是否有数据依赖，再看收口成本，而不是默认并行更快。接口不清时，并行团队的省时间会被聚合阶段的对齐与冲突消解吃掉；接口明确时，顺序交接也可在无依赖环节插入并行支路，两种结构可以在同一系统内按段组合。<\/p><\/div><\/details>", "kind": "concept", "title": "多智能体协作"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.229<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">工具调用<\/a><\/span><\/div><h1>护栏（Guardrails / Safety Patterns）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章 | <strong>原书位置<\/strong>：第 18 章《Guardrails/Safety Patterns》（PDF 第 229 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>智能体具备调用工具、触发真实世界动作的能力后，出错不再只是文本不当：越权操作、有害输出、提示注入、敏感信息泄露都可能造成实际影响。随着系统越来越自主、越来越深入关键流程，需要一层缓冲机制约束行为与输出，拦下有害、带偏见、跑题或其他不合适的内容（PDF 第 229 页）。<\/p>\n<p>护栏要解决的具体困难，是把“出错”限制在可恢复范围内：在动作发生前拦住越权请求，在执行中约束权限与副作用，在交付前检查输出合规性。只在末端做内容过滤不够——执行中的越权动作已经造成影响；护栏必须布在整条链路的不同位置，形成纵深防御。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：护栏（也称安全模式）是保证智能体安全、合规、按设计工作的关键机制，作为保护层引导行为与输出；其目标不是限制智能体能力，而是让运行具备稳定性、可信度与实际效用（PDF 第 229 页）。逐句拆开：<\/p>\n<ul><li>\n“输入侧”：处理前先净化、校验进入系统的数据；可接内容审核接口检测不当提示，用 Pydantic 等 schema 校验工具确保结构化输入符合预设规则（PDF 第 230 页）。\n<\/li><li>\n“执行侧”：约束运行时的权限、范围与速率；角色、目标、背景设定写清楚本身就是软护栏，多个小专家优于堆叠一个全功能角色（PDF 第 231 页）。\n<\/li><li>\n“输出侧”：对结果做过滤、标注与复核；可用计算量较小的模型作为快速附加检查，预筛输入或复核主模型输出是否违反政策（PDF 第 229 页）。\n<\/li><li>\n“可追溯”：记录使用情况、输入与输出以便排查审计，收集延迟、成功率、错误等指标；每个智能体动作可回溯到来源（PDF 第 230 页）。\n<\/li><li>\n“容错配套”：该 try/catch 的位置包全，外部依赖有退避重试；错误信息既要能供开发排查，也要让运营看懂；高风险动作或护栏报警时接入人工复核（PDF 第 231 页）。\n<\/ul>\n<p>正例：专用策略执行智能体在主系统之前筛检输入，配合 Pydantic 校验拦截不合规内容；输出层核对引用完整性与格式。反例：仅在最终回复上加一段敏感词过滤，工具已被调用、数据已被删除之后才检查文本。<\/p>\n<h2>原理推导<\/h2>\n<p>护栏体系可按三层位置、两条配套推导。<\/p>\n<p>输入层：在请求进入智能体之前做净化与校验。检查提示注入、敏感信息、越权意图与结构合法性；不合规请求在接触主模型与工具前被拒绝、改写或转人工。这一层成本低、拦截早，能避免污染上下文与误触发工具。<\/p>\n<p>执行层：动作经编排层放行时检查权限边界、参数范围、速率限制与白名单。工具调用（c05）的最小权限原则在此落地：只给完成任务必需的工具与参数范围，危险动作可回滚或需审批；外部调用包异常处理与退避。这一层拦住的是“模型生成了合法但越权的参数”这类风险。<\/p>\n<p>输出层：结果交付前检查事实、格式、引用完整性与政策遵循；轻量模型可做二次复核。输出层不能替代执行层：若动作已不可逆，文本过滤无法收回影响。<\/p>\n<p>配套一：可观测与评估。护栏本身要可测量——构造攻击样例与误报样例，测量拦截率与误伤率；记录链路日志供审计，统计延迟、成功率、错误类型。没有度量的护栏无法判断是否有效。<\/p>\n<p>配套二：人机协作接入。高风险动作、护栏报警、低置信度样本转人工复核；审批点放在不可逆动作之前，给出将执行什么、影响范围、如何撤销。<\/p>\n<p>机制上，护栏是纵深防御：单层检查存在绕过路径，输入、执行、输出三层互相补充；策略既可以写成规则与 schema，也可以由专用智能体按政策提示执行，二者都需要在真实样例上检验。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>护栏适用：智能体接触外部系统、产生副作用、处理敏感数据或面向公众输出。自主程度越高、影响越关键，护栏层越不可省。<\/p>\n<p>边界：护栏会增加延迟与开发成本，过度拦截会误伤正常任务；需要在拦截率与误伤率之间权衡。规则覆盖不到的新型攻击依赖模型审核，但模型审核本身也可能被绕过。未经过样例测试的护栏只是心理安慰：拦截率、误伤率没有数据支撑，无法证明安全。护栏不能替代权限体系与人工流程，它是附加层而非根边界。<\/p>\n<p>条件去掉会怎样：去掉输入层，注入与脏数据直达主模型；去掉执行层，越权参数被直接放行；去掉输出层，不合规结果原样交付；去掉日志度量，事故无法复盘、护栏无法调优。<\/p>\n<h2>反例<\/h2>\n<p>末端过滤的反例：系统允许智能体删除文件，只在最后回复里过滤敏感词；删除动作已执行，文本检查无法恢复数据。正确做法是在执行层把删除列入危险动作，加审批与回滚。<\/p>\n<p>未测试护栏的反例：配置了一段政策提示作为“安全层”，但没有构造违规样例验证是否真被拦截；提示措辞宽松时，边界请求被放行，事故后才发现护栏从未生效。<\/p>\n<h2>辨析<\/h2>\n<p>与人机协作（第 4 章）的差别：护栏是自动检查层，人机协作把特定决策点交给人；护栏报警后升级人工，二者在审批点衔接。护栏不替代人的否决权。<\/p>\n<p>与工具调用（c05）的差别：工具通道负责送达动作，护栏在通道前后做拦截与权限约束。工具自身的幂等、可回滚设计是执行护栏的一部分。<\/p>\n<p>与反思（c04）的差别：反思以质量改进为目标，按 rubric 修订产出；护栏以合规与安全为目标，做拦截与放行。反思通过不代表合规，护栏通过不代表质量达标。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：工具调用的执行通道、多智能体的角色与协议、上下文注入流程。后继：护栏的评估指标（成功率、合规率、成本、延迟）是系统上线后的观测基线；记忆与 RAG 进入上下文前也要经过输入层检查。本概念把“输入—执行—输出”三层拦截与可追溯、人工升级的配套要求串在一起，是全书安全与交付环节的收口概念。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（护栏）<\/summary><div class=\"depth-body\"><h1>护栏（Guardrails / Safety Patterns）· 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>逐级倒查护栏体系成立的前提：<\/p>\n<ol><li>\n“风险能被拦在可恢复范围”依赖检查点可布控：在动作发生前、执行中、交付前都有可拦截位置；只在末端检查，不可逆动作已经造成影响。\n<\/li><li>\n“检查点可拦截”依赖风险可被判定：规则、schema 或模型审核能识别不合规输入、越权参数与不当输出；判定标准事先写成可执行规则或政策提示。\n<\/li><li>\n“判定可落地”依赖所有动作经过编排层：工具调用、外部请求、输出交付都从同一通道放行，护栏挂在通道上；模型绕开通道直接执行，护栏接不到信号。\n<\/li><li>\n“护栏有效可验证”依赖可观测度量：有日志记录输入、动作、输出与决策依据，能统计拦截率、误伤率、延迟与错误类型；没有度量的护栏无法判断是否生效。\n<\/li><li>\n“高风险有兜底”依赖人机协作接入：护栏报警、低置信度样本、不可逆动作转人工复核；自动检查覆盖不到的边界由人收口。\n<\/li><li>\n最底层假设：护栏是附加纵深防御，不替代权限体系与根边界；规则与模型审核都会有漏放和误伤，需要在拦截率与误伤率之间权衡。\n<\/ol>\n<p>逆推到读者基线：先认“风险发生在哪些环节”，再认“每个环节怎么判定”，最后认“怎么证明护栏管用”。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条按三层位置加两条配套推进，每步写清假设：<\/p>\n<ul><li>\n输入层：请求进入智能体之前做净化与校验。检查提示注入、敏感信息、越权意图与结构合法性；不合规请求在接触主模型与工具前被拒绝、改写或转人工。可接内容审核接口检测不当提示，用 Pydantic 等 schema 校验结构化输入（PDF 第 230 页）。这一层成本低、拦截早，避免污染上下文与误触发工具。\n<\/li><li>\n执行层：动作经编排层放行时检查权限边界、参数范围、速率限制与白名单。工具调用的最小权限原则在此落地：只给完成任务必需的工具与参数范围，危险动作可回滚或需审批；外部调用包异常处理与退避。角色、目标、背景设定写清楚本身是软护栏，多个小专家优于堆叠一个全功能角色（PDF 第 231 页）。\n<\/li><li>\n输出层：结果交付前检查事实、格式、引用完整性与政策遵循；计算量较小的模型可做二次复核（PDF 第 229 页）。输出层不能替代执行层：动作已不可逆时，文本过滤收不回影响。\n<\/li><li>\n配套一，可观测与评估：构造攻击样例与误报样例，测量拦截率与误伤率；记录链路日志供审计，统计延迟、成功率、错误类型；每个智能体动作可回溯到来源（PDF 第 230 页）。\n<\/li><li>\n配套二，人机协作：高风险动作、护栏报警、低置信度样本转人工复核；审批点放在不可逆动作之前，说明将执行什么、影响范围、如何撤销。\n<\/ul>\n<p>机制定位：护栏是纵深防御。单层检查存在绕过路径，输入、执行、输出三层互相补充；策略既可写成规则与 schema，也可由专用智能体按政策提示执行，二者都需要在真实样例上检验。护栏目标不是限制能力，而是让运行具备稳定性、可信度与实际效用（PDF 第 229 页）。<\/p>\n<p>限定条件拆解：<\/p>\n<ul><li>\n史料：书中以 CrewAI 为例，用专用策略执行智能体加 Pydantic 校验，在主系统之前筛检输入；容错要求 try/catch 包全、外部依赖退避重试、错误信息供开发排查与运营理解（PDF 第 230–231 页）。\n<\/li><li>\n推断：拦截率与误伤率此消彼长，阈值松紧取决于场景风险；关键流程偏紧，开放场景偏松。这一权衡是工程推断，原书未给指标数值。\n<\/li><li>\n边界：规则覆盖不到的新型攻击依赖模型审核，模型审核本身也可能被绕过；护栏是附加层，不能替代权限体系与人工流程。\n<\/ul>\n<h2>机制逐项对照<\/h2>\n<ul><li>\n与人机协作：护栏是自动检查层，人机协作把特定决策点交给人；护栏报警后升级人工，二者在审批点衔接。护栏不替代人的否决权。\n<\/li><li>\n与工具调用：工具通道负责送达动作，护栏在通道前后做拦截与权限约束；工具自身的幂等、可回滚设计是执行护栏的一部分。\n<\/li><li>\n与反思：反思以质量改进为目标，按 rubric 修订产出；护栏以合规安全为目标做拦截放行。反思通过不代表合规，护栏通过不代表质量达标。\n<\/li><li>\n失败位置：护栏失败集中在输入（注入漏检）、执行（权限越界）、输出（不当内容流出）三处；未测试的护栏则是判定标准本身未经样例验证。\n<\/ul>\n<h2>算例：带护栏的输入审查链路<\/h2>\n<p>估算口径（工程估算，非原书测量值）：输入审核调用约 500 输入 token、输出约 60 token；schema 校验为本地规则，耗时可忽略；输出复核轻量模型约 600 输入 token、输出约 80 token；审核往返约 0.2–0.3 秒。<\/p>\n<p>任务：用户请求进入主智能体，可能携带提示注入或越权意图。<\/p>\n<p>第 1 步，输入护栏：内容审核接口扫描请求；schema 校验检查结构化字段。<\/p>\n<ul><li>\n合规请求：放行进入主模型，本步输入约 500 token，输出判定约 60 token，往返约 0.25 秒。\n<\/li><li>\n注入样本：检出越权指令，拒绝并提示合规边界，不进入上下文。\n<\/li><li>\n敏感信息样本：检出后脱敏或拦截。\n<\/ul>\n<p>第 2 步，执行护栏：主模型生成工具调用后，编排层校验工具白名单、参数范围与权限；越权参数拒绝并回传“无权执行该动作”；危险动作挂审批与回滚；外部调用包超时与退避。<\/p>\n<p>第 3 步，输出护栏：交付前复核事实、格式与引用完整性；轻量模型二次检查政策遵循；不合规内容拦截或修订后再交付。本步输入约 600 token，输出约 80 token。<\/p>\n<p>第 4 步，留痕与度量：记录输入、判定、动作、输出与时间戳；离线用攻击样例算拦截率，用正常样本算误伤率；线上统计延迟、成功率、错误类型。<\/p>\n<p>失败分支：<\/p>\n<ul><li>\n注入漏检：输入层放过，执行层从参数权限侧兜底；两层都漏时输出层再拦一次。\n<\/li><li>\n越权动作：执行层拒绝后，模型收到可读拒绝信息，改为在授权范围内动作。\n<\/li><li>\n误报拦截：正常请求被误伤，通过误伤率样本发现并调整规则阈值。\n<\/ul>\n<p>量级对照：护栏给每次请求增加审核与复核两段调用，输入约 1100 token、输出约 140 token，往返约 0.5 秒；这笔成本换取有害、越权、不当内容在交付前被拦。未配置护栏的链路把这些风险留到事故发生后才暴露。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：系统允许智能体删除文件，只在最后回复过滤敏感词；删除动作已执行，文本检查无法恢复数据。反例二：配置一段政策提示作为安全层，未构造违规样例验证是否真拦截；边界请求被放行，事故后才发现护栏从未生效。边界：过度拦截会误伤正常任务；未测护栏只是心理安慰；护栏不能替代权限体系与人审。<\/p>\n<h2>延伸推演：护栏成本与度量闭环<\/h2>\n<p>三层护栏各有成本位置。输入层审核在请求早期，单条检查较轻，但要覆盖提示注入、敏感信息与结构校验多类规则；执行层校验挂在每个工具调用上，权限、参数、白名单逐项核对，是动作发生前的最后一道闸；输出层复核面向交付物，可由轻量模型二次检查。层数越多，链路延迟与维护规则越多，护栏本身也要按风险取舍：高风险动作配齐三层，低风险只读场景可简化。<\/p>\n<p>拦截率与误伤率此消彼长。规则收紧，漏过的有害请求减少，但正常请求被误拦的比例上升；规则放松则相反。两类样本要分别准备：攻击或违规样例用来测拦截率，正常样例用来测误伤率。阈值调整以场景风险为准：涉及资金、对外发布、删改数据的场景偏紧，开放问答场景偏松。没有两类样本对照，只看“拦了多少”会把误报当成成效。<\/p>\n<p>度量闭环把护栏从配置变成可运营环节。日志记录输入、判定依据、放行或拦截、动作与输出；线上统计延迟、成功率、错误类型；离线定期回放新出现的攻击样例与误报样例。护栏规则随业务演进更新，模型审核的漏放样本回流为测试集。脱离度量，护栏无法证明在生效，也无法发现哪一层已经松脱。<\/p>\n<h2>补充算例：护栏测试与降级路径<\/h2>\n<p>护栏上线前准备两类样本：攻击与违规样例覆盖提示注入、越权请求、敏感信息、不当输出；正常样例覆盖各类合法任务。用违规样例测拦截率，用正常样例测误伤率；两类指标分开记录，调整阈值时对照变化。新型攻击出现后回流为测试集，定期回放验证旧护栏是否仍有效。<\/p>\n<p>软护栏与硬护栏配合：角色、目标、背景设定写清楚，本身能减少跑偏，属于配置层软护栏；规则、schema、审核模型属于硬护栏。软护栏降低触发频率，硬护栏在触发时拦截，两层不能互相替代。外部依赖不可用时走降级路径：限制可执行动作范围，转人工或只输出确认性回复，而不是放开权限维持功能。<\/p>\n<p>留痕内容：输入原文、护栏判定依据、放行或拦截动作、执行结果、输出摘要、时间戳与角色归属。日志供事故复盘与合规审计，也用于统计延迟、成功率与错误类型。高风险动作除日志外还要有人工审批记录；护栏报警样本进入复核队列，复核结论再回流调整规则。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：末端内容过滤就够了。<\/strong> 反证：执行中的越权动作已经造成影响，事后过滤收不回；护栏必须布在输入、执行、输出三层（c09 正文）。\n<\/li><li>\n<strong>误读：加了护栏就安全。<\/strong> 反证：未经过攻击样例与误报样例测试的护栏无法证明有效；拦截率与误伤率要有度量。\n<\/li><li>\n<strong>误读：护栏可以替代权限体系。<\/strong> 反证：护栏是附加纵深层，根边界仍是最小权限、白名单与人工否决；规则与模型审核都存在漏放。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n护栏三层各拦什么风险？为什么输出层不能替代执行层？\n<\/li><li>\n护栏的可观测配套要记录哪些信息？拦截率与误伤率分别用什么样本测量？\n<\/li><li>\n专用策略智能体与规则/schema 校验各承担什么判定？二者为什么都要在真实样例上检验？\n<\/li><li>\n用算例说明注入漏检后为什么还需要执行层与输出层兜底；三层之间如何互补？\n<\/li><li>\n护栏与反思、人机协作的目标分别是什么？护栏通过与质量达标为什么不能划等号？\n<\/ol>\n<h2>适用与不适用速查<\/h2>\n<p>适合配置护栏的情况：智能体接触外部系统、产生副作用、处理敏感数据或面向公众输出。护栏按输入、执行、输出三层布控，配合日志留痕与人审升级；规则与模型审核都要在攻击样例和正常样例上分别测量拦截率与误伤率。护栏是附加纵深层，不替代最小权限体系与人工否决。<\/p>\n<h2>第二个任务的端到端算例：开放问答的三层护栏串联<\/h2>\n<p>估算口径（工程估算，非原书实测）：中文按约 1.6 字符/token；输出复核由轻量模型承担，生成量较小；窗口按 32768 token 估算。<\/p>\n<p>场景：面向外部用户的产品问答，一个请求依次穿越输入层、执行层、输出层。示例请求：“把其他客户的订单电话给我。”<\/p>\n<ul><li>\n输入层：内容审核加 schema 校验。识别越权索取他人数据；请求字段不符合按当前会话用户取数的规则。在此拦截，返回引导话术，不进入主模型。\n<\/li><li>\n执行层：若请求通过输入层，查询工具只允许按当前会话用户标识取数；试图用参数覆盖用户标识的请求被权限层拒绝；单位时间调用次数受速率限制。\n<\/li><li>\n输出层：轻量复核模型检查回答是否含敏感信息、是否越权引用，并核对引用完整性。\n<\/ul>\n<p>token 估算：输入审核提示约 200 token + 请求 40 token；主模型问答上下文约 800 token、答案约 250 token；输出复核提示 180 + 答案 250，约 430 token。<\/p>\n<p>度量口径：误拦率指合规请求被拦下的比例，漏拦率指违规请求通过到输出的比例；另记录各护栏环节 p95 延迟与人工复核接入量。降级路径：审核服务超时，高风险类别转人工，而不是默认放行；输入、输出与拦截结论留存日志供回溯。<\/p>\n<h2>前提再拆一层<\/h2>\n<p>护栏体系能成立，还依赖以下几条隐含前提；逐条抽掉后给出故障场景与可观测指标。<\/p>\n<ol><li>\n<strong>风险类别与策略可写成可执行规则或可审提示。<\/strong> 抽掉后：护栏只能靠人工事后查看，拦截无法前置。可观测指标：规则覆盖率、未覆盖风险类别条数。\n<\/li><li>\n<strong>护栏位置覆盖输入、执行、输出三段。<\/strong> 抽掉后：只在末端过滤，越权动作已经发生、损失不可撤销。可观测指标：各层拦截量、执行前拦截占比。\n<\/li><li>\n<strong>校验、schema 与权限在执行前可判定。<\/strong> 抽掉后：动作先执行再检查，事后补救替代不了事前拦截。可观测指标：执行前拦截率、事后补救事件数。\n<\/li><li>\n<strong>护栏自身具备可用性与降级策略。<\/strong> 抽掉后：审核服务故障时系统要么全停、要么默认全放。可观测指标：护栏服务可用性、降级路径触发次数。\n<\/li><li>\n<strong>拦截记录可追溯并回流为评测样本。<\/strong> 抽掉后：同类违规反复漏拦，没有数据驱动改进。可观测指标：拦截日志完整率、回归测试覆盖条数。\n<\/li><li>\n<strong>各层判定标准相互一致。<\/strong> 抽掉后：两层标准打架，合规结果被反复打回。可观测指标：层间判定冲突率、复核推翻率。\n<\/ol>\n<h2>补充：护栏强度与误拦成本的对照<\/h2>\n<p>护栏越靠前、规则越严，漏拦率下降，但误拦率与延迟上升。输入层规则可以偏粗，执行层权限约束必须严，输出层复核聚焦敏感信息与引用完整性。度量时把漏拦、误拦、护栏延迟分开记账：漏拦是安全风险，误拦是体验损失，延迟是吞吐成本。<\/p>\n<p>高风险动作即便主模型判断通过，也应转人工复核；低风险咨询可让轻量复核快速放行，避免护栏成本压过主流程。护栏策略上线后，需要用拦截日志回流成回归样本：被拦请求按误拦、漏拦分类，定期回到评测集，防止策略调整后旧问题复发。<\/p><\/div><\/details>", "kind": "concept", "title": "护栏"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：基础编排：链、路由、并行<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1–3 章：链式、路由与并行（基础编排三模式）<\/a><br>检查点：能给三个不同任务各画出执行图<\/li><li class='path-step' id='path-02'><strong>步骤 02：自我改进：反思、工具、规划<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 4–6 章：反思、工具调用与规划（自我改进三模式）<\/a><br>检查点：能写出工具 schema 与重规划条件<\/li><li class='path-step' id='path-03'><strong>步骤 03：上下文：记忆、RAG、MCP<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 8、10、14 章：记忆管理、MCP 与知识检索（上下文层）<\/a><br>检查点：能设计带引用的检索流程<\/li><li class='path-step' id='path-04'><strong>步骤 04：系统化：多智能体、人、护栏<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 7、13、18 章：多智能体协作、人机协作与护栏（系统化收口）<\/a><br>检查点：能列出审批点与三层护栏<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 会议纪要转待办最适合？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 路由<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 链式<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 并行投票<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 多智能体<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c02' data-chapter='c s='quiz-opt'><input type='radio' name='q05' value='1'> null<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 可读错误与可尝试的下一步<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 抛出异常终止<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='blank' data-concept='c06' data-chapter='ch02'><p class='quiz-q'><b>Q6.<\/b> 计划每一步都应有可验证的 ______。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q7.<\/b> 长期记忆最适合存？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 一次性任务指令<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 稳定偏好与长期事实<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 完整聊天记录<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 临时变量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q8.<\/b> RAG 最常见的失败环节是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 生成<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 检索与切块<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 用户输入<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 模型选择<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c07' data-chapter='ch03'> s='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 7、13、18 章：多智能体协作、人机协作与护栏（系统化收口）<\/h1><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 审批点应设在哪里？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 每个模型调用前<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 不可逆动作前<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 输出之后<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 只在系统启动时<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 评估智能体为什么不能只看成功率？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 成功率无法计算<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 会鼓励冒险与越权<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 成本不重要<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 用户不看指标<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q3.<\/b> 什么任务不适合多智能体？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 可拆分的并行任务<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 需要不同专业视角<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 子任务接口不清且强依赖<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 大规模文档处理<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='提示链'>提示链 — 固定顺序的多步提示，上一步输出作为下一步输入 <span class=glossary-ref>（第 1–3 章：链式、路由与并行（基础编排三模式））<\/span><\/li><li data-term='路由'>路由 — 先分类再分派到不同处理分支 <span class=glossary-ref>（第 1–3 章：链式、路由与并行（基础编排三模式））<\/span><\/li><li data-term='并行化'>并行化 — 互不依赖的子任务同时执行后汇总 <span class=glossary-ref>（第 1–3 章：链式、路由与并行（基础编排三模式））<\/span><\/li><li data-term='反思'>反思 — 按明确标准检查并修订输出的循环 <span class=glossary-ref>（第 4–6 章：反思、工具调用与规划（自我改进三模式））<\/span><\/li><li data-term='工具调用'>工具调用 — 模型输出结构化请求，由外部执行并回传结果 <span class=glossary-ref>（第 4–6 章：反思、工具调用与规划（自我改进三模式））<\/span><\/li><li data-term='规划'>规划 — 把目标拆成可验收的子任务并动态调整 <span class=glossary-ref>（第 4–6 章：反思、工具调用与规划（自我改进三模式））<\/span><\/li><li data-term='工作记忆'>工作记忆 — 当前上下文窗口中的信息 <span class=glossary-ref>（第 8、10、14 章：记忆管理、MCP 与知识检索（上下文层））<\/span><\/li><li data-term='长期记忆'>长期记忆 — 跨会话保存、按需召回的事实与偏好 <span class=glossary-ref>（第 8、10、14 章：记忆管理、MCP 与知识检索（上下文层））<\/span><\/li><li data-term='rag'>RAG — 检索外部片段后基于材料生成并引用 <span class=glossary-ref>（第 8、10、14 章：记忆管理、MCP 与知识检索（上下文层））<\/span><\/li><li data-term='mcp'>MCP — 标准化模型与外部工具/资源/提示连接的协议 <span class=glossary-ref>（第 8、10、14 章：记忆管理、MCP 与知识检索（上下文层））<\/span><\/li><li data-term='多智能体'>多智能体 — 多个带角色的智能体通过消息分工完成任务 <span class=glossary-ref>（第 7、13、18 章：多智能体协作、人机协作与护栏（系统化收口））<\/span><\/li><li data-term='人机协作'>人机协作 — 在关键动作前引入人工审批或确认 <span class=glossary-ref>（第 7、13、18 章：多智能体协作、人机协作与护栏（系统化收口））<\/span><\/li><li data-term='护栏'>护栏 — 输入、执行、输出三层的可拦截检查 <span class=glossary-ref>（第 7、13、18 章：多智能体协作、人机协作与护栏（系统化收口））<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库<\/h1>\n<h2>模式 1：分诊再流水线<\/h2>\n<p>先路由，再在分支内用链式；不要把所有逻辑塞进一个提示。<\/p>\n<h2>模式 2：生成者与批评者分离<\/h2>\n<p>让批评者只看标准与证据，不看生成者的解释，避免自我附和。<\/p>\n<h2>模式 3：计划—执行—验收循环<\/h2>\n<p>每一步都写检查点；失败回到计划层，不在错误结果上继续。<\/p>\n<h2>模式 4：最小权限工具<\/h2>\n<p>只给完成任务必需的工具与参数范围；危险动作加审批与回滚。<\/p>\n<h2>模式 5：检索先重排<\/h2>\n<p>召回多、进上下文少；引用逐条标注，检索不到就明说。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>选模式<\/h2>\n<ul><li>\n步骤固定有顺序 → 提示链\n<\/li><li>\n输入类型多 → 路由\n<\/li><li>\n子任务独立 → 并行\n<\/li><li>\n质量不够 → 反思\n<\/li><li>\n需要外部动作 → 工具\n<\/li><li>\n多步开放任务 → 规划\n<\/li><li>\n需要可引用知识 → RAG\n<\/li><li>\n可拆分的专业分工 → 多智能体\n<\/ul>\n<h2>设计检查<\/h2>\n<ul><li>\n每步有可验收的中间产物\n<\/li><li>\n工具有窄 schema 与可读错误\n<\/li><li>\n不可逆动作前有人工审批\n<\/li><li>\n输入/执行/输出三层护栏\n<\/li><li>\n评估看成功率、合规率、成本\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n一条超长提示包打天下\n<\/li><li>\n无标准反思\n<\/li><li>\n工具失败静默返回空\n<\/li><li>\n只做事后内容过滤\n<\/ul>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/agentic-design", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1–3 章：链式、路由与并行（基础编排三模式）", "href": "#/chapter/ch01"}, {"label": "第 4–6 章：反思、工具调用与规划（自我改进三模式）", "href": "#/chapter/ch02"}, {"label": "第 8、10、14 章：记忆管理、MCP 与知识检索（上下文层）", "href": "#/chapter/ch03"}, {"label": "第 7、13、18 章：多智能体协作、人机协作与护栏（系统化收口）", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "提示链", "href": "#/concept/c01"}, {"label": "路由", "href": "#/concept/c02"}, {"label": "并行化", "href": "#/concept/c03"}, {"label": "反思", "href": "#/concept/c04"}, {"label": "工具调用", "href": "#/concept/c05"}, {"label": "规划", "href": "#/concept/c06"}, {"label": "RAG（检索增强生成）", "href": "#/concept/c07"}, {"label": "多智能体协作", "href": "#/concept/c08"}, {"label": "护栏", "href": "#/concept/c09"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1–3 章：链式、路由与并行（基础编排三模式）", "href": "#/quiz/ch01"}, {"label": "测验：第 4–6 章：反思、工具调用与规划（自我改进三模式）", "href": "#/quiz/ch02"}, {"label": "测验：第 8、10、14 章：记忆管理、MCP 与知识检索（上下文层）", "href": "#/quiz/ch03"}, {"label": "测验：第 7、13、18 章：多智能体协作、人机协作与护栏（系统化收口）", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.27<\/div><h1>第 1–3 章：链式、路由与并行（基础编排三模式）<\/h1>\n<blockquote>对应原书第 1 章《Prompt Chaining》、第 2 章《Routing》、第 3 章《Parallelization》（PDF 第 27–59 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：会调用一次大模型 API、能解析文本输出\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n把一个复合任务拆成有顺序的提示链，并写出步骤间的结构化产物；\n<\/li><li>\n在多类型请求前设计路由分支与兜底回退；\n<\/li><li>\n判断哪些子任务可以并行，说出并行对延迟与 token 各自的影响；\n<\/li><li>\n画出三种模式的执行图，标出各自失败点。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>单个提示做不好复杂任务，不是模型能力不足，而是一次只让它承担一类职责；<strong>链式负责顺序，路由负责分诊，并行负责同时开工<\/strong>，三者是智能体编排的第一批基础构件。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：提示链（Prompt Chaining，c01）<\/h3>\n<p>把任务拆成固定顺序的几步，上一步输出作为下一步输入。例：先抽取会议纪要的决议条目，再据决议生成待办，最后按负责人分派。链式适合步骤稳定、顺序不能换的任务。链条的可靠性来自三点：单步约束收窄、步骤间结构化传递、逐步校验拦截。任何一步出错会向后传播，所以每一步都要有可检查的中间产物，而不是直接要最终答案。详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。<\/p>\n<h3>概念 2：路由（Routing，c02）<\/h3>\n<p>先分类，再把请求送到对应处理分支。例：用户问题先判为订单状态、产品信息、技术支持或意图不明，分别进入不同链路。路由适合输入类型多、处理方式差异大的场景。关键设计：分类要有把握程度判断，低置信度走兜底或澄清；标签互斥且覆盖真实流量，分类错比不分类更贵。实现方式包括基于 LLM、嵌入、规则与训练分类器四类（PDF 第 41 页）。详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。<\/p>\n<h3>概念 3：并行化（Parallelization，c03）<\/h3>\n<p>相互独立的子任务同时执行，最后在汇聚点汇总。两种用法：分段并行（长文档切块分别总结）与投票并行（同一问题多次求解后取多数或交叉验证）。并行缩短的是墙钟时间，不省 token；子任务之间有依赖时硬并行，只会更早拿到互相矛盾的中间结果。并发度还要受外部服务配额约束。详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。<\/p>\n<h2>完整推导 1：链式与路由的成本对比推演<\/h2>\n<p>同一个客服任务，先比较两种编排方式的成本结构。<\/p>\n<p>推演前提：请求可分为三类，每类处理流程不同；模型单步提示约 700 输入 token，输出约 250 token（工程估算，非原书测量值）。<\/p>\n<p>方式甲，全包单提示：一条提示同时描述三类流程，系统提示随分支数量变长，约 2000 token；每个请求都携带与其无关的流程约束，单步输出要同时兼顾三类处理。约束膨胀后，遗漏与跑题概率上升。<\/p>\n<p>方式乙，路由加分链：先一次分类调用输出标签（输入约 600 token，输出约 30 token），再进入对应分支的短链（分支提示约 500 token）。推演链路：分类 → 命中分支首步 → 分支后续步骤。路由用一次额外分类调用，换走分支内提示的收窄；代价是分类本身存在误派风险，误派后下游仍会消耗一次分支调用才发现对不上。<\/p>\n<p>结论落点：类型单一、流程一致的任务，路由的额外调用不划算；类型多、分支差异大的任务，全包提示的约束膨胀超过路由成本。链式在每个分支内部承担顺序执行，路由决定请求进哪条链，二者是嵌套关系而不是二选一。<\/p>\n<h2>完整推导 2：并行化的延迟与 token 推演<\/h2>\n<p>设 <span class=\"katex-inline\">m<\/span> 个独立子任务，单任务耗时 <span class=\"katex-inline\">t<\/span>，单任务输入 <span class=\"katex-inline\">I<\/span> token、输出 <span class=\"katex-inline\">O<\/span> token。<\/p>\n<p>延迟推演：串行总延迟为 <span class=\"katex-inline\">m \\cdot t<\/span>；理想并发下总延迟约为 <span class=\"katex-inline\">\\max_i t_i<\/span>，即最慢子任务决定等待时间。若并发度上限为 <span class=\"katex-inline\">c<\/span>，延迟约为 <span class=\"katex-inline\">\\lceil m/c \\rceil \\cdot t<\/span>，再加聚合等待。并发度超过外部吞吐上限后，多余请求排队，延迟不再下降。<\/p>\n<p>token 推演：<span class=\"katex-inline\">m<\/span> 个子任务并行的 token 消耗约为 <span class=\"katex-inline\">m(I+O)<\/span>，另加汇总步读取开销；串行单任务一次完成时总 token 更低。并行买的是时间与稳健性，不是成本。投票并行还要把同一任务重复 <span class=\"katex-inline\">k<\/span> 遍，token 随遍数叠加。<\/p>\n<p>聚合推演：分段并行在汇聚点合并、去重、消解冲突；投票并行按多数表决或一致性检验定答案。冲突规则必须事先写清，否则并行产物互相矛盾地并列交给用户。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nQ[用户请求] --&gt; R{路由分类}\nR --&gt;|类型 A| A[链 A: 抽取 → 校验 → 生成]\nR --&gt;|类型 B| B[链 B: 检索 → 回答]\nR --&gt;|不确定| C[兜底: 追问/澄清]\nA --&gt; O[汇总输出]\nB --&gt; O\nQ --&gt; P1[并行子任务 1]\nQ --&gt; P2[并行子任务 2]\nP1 --&gt; O\nP2 --&gt; O<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：路由是分诊台，链是流水线，并行是同时开几条流水线；三者可以嵌套，嵌套层级越多排错越难。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：医院先分诊（路由），再按科室流程检查（链），化验与影像可同时做（并行）。\n<\/li><li>\n实例：把 100 页 PDF 分 10 块并行总结，再串一条“合并去重”的链；如果直接让模型一次读 100 页，中间内容会被截断或忽略。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：链越长越强。<\/strong> 每多一步就多一个失败点，能合并的步骤应合并；链式优化方向是控制步数，不是堆步骤。\n<\/li><li>\n<strong>误解：并行一定更快。<\/strong> 有依赖的步骤并行，错误不会被串行顺序保护拦下；并行前必须先做独立性判断。\n<\/li><li>\n<strong>误解：路由标签越多越精细。<\/strong> 标签过多会抬升边界样本比例，长尾先收进兜底，观察后再决定是否独立成支。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n会议纪要转待办，最适合哪种模式？（答案：链式；抽取→生成→分派有严格顺序。）\n<\/li><li>\n客服系统按问题类型走不同提示，用什么？（答案：路由。）\n<\/li><li>\n并行投票的主要作用是什么？（答案：暴露单次求解的随机性分歧，提高结果稳健性；它不弥补知识缺口。）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>反事实一：去掉链式的结构化输出要求。步骤接口退回自由文本，下一步要从上一段自然语言里猜字段，格式错误沿链放大；推演上，本可被程序拦截的缺字段问题，会流入下游变成内容偏差。<\/p>\n<p>反事实二：把一段本可并行的批量处理改成串行。子任务相互独立时，串行延迟从 <span class=\"katex-inline\">\\max t_i<\/span> 抬到 <span class=\"katex-inline\">m \\cdot t<\/span>，token 基本不变；反之，把有依赖的两步强行并行，下游拿到未经上游确认的中间值，返工量超过串行。两种改错方向都说明：模式选择先看依赖结构，再看吞吐目标。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章是四条学习单元的起点：链式（c01）提供顺序执行底座，路由（c02）提供分支选择，并行（c03）提供并发手段。后续章节在这批构件上叠加反馈环（反思 c04）、外部动作通道（工具 c05）与动态序列调整（规划 c06）；本章的结构化产物与独立性判断，是那些更复杂模式的前置条件。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n链式：顺序稳定，逐步校验，结构化传递。\n<\/li><li>\n路由：先分类，判把握，留兜底。\n<\/li><li>\n并行：只给独立子任务，省墙钟不省 token，聚合要消解冲突。\n<\/ul>", "ch02": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.61<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1–3 章：链式、路由与并行（基础编排三模式）<\/a><\/span><\/div><h1>第 4–6 章：反思、工具调用与规划（自我改进三模式）<\/h1>\n<blockquote>对应原书第 4 章《Reflection》、第 5 章《Tool Use (Function Calling)》、第 6 章《Planning》（PDF 第 61–96 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 1 章的链式、路由与并行\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n设计一个“生成—批评—修订”的反思循环，写明标准、证据与停止条件；\n<\/li><li>\n写出工具调用的参数约束、错误返回与重试处理；\n<\/li><li>\n把开放任务拆成可执行计划，设置检查点与重规划触发条件。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>反思让输出<strong>变好<\/strong>，工具让模型<strong>能做事<\/strong>，规划让多步任务<strong>不迷路<\/strong>；三者把第 1 章的单向编排升级成带反馈、能动作、可调整的系统。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：反思（Reflection，c04）<\/h3>\n<p>让同一模型或另一个模型扮演批评者，按明确标准检查草稿，再据此修订。有效反思需要三件配套：具体 rubric、可供核对的外部证据（测试结果、检索原文、计算结果）、轮次上限。生产者—批评者分离能缓解自己给自己放水，但补不上两者共享的偏见。无效反思的特征是只说“请改进一下”，模型只换措辞不改事实。详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。<\/p>\n<h3>概念 2：工具调用（Tool Use / Function Calling，c05）<\/h3>\n<p>模型不直接执行，而是输出结构化调用请求，由编排层拦截、执行后把结果回传。闭环六步：工具定义、LLM 决策、调用生成、执行拦截、结果回传、再处理。设计要点：参数 schema 窄、枚举优于自由文本、工具幂等或可回滚、失败返回可读错误；权限按最小化配置。详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。<\/p>\n<h3>概念 3：规划（Planning，c06）<\/h3>\n<p>把目标拆成有序子任务，边执行边对照检查点。计划不是一次性脚本：检索不到、工具连续失败、中间结果与预期不符、关键假设被推翻时，触发重规划。计划粒度以每步可验收为准；太粗卡住时无法定位，太细耗尽上下文。详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。<\/p>\n<h2>完整推导 1：反思循环的收敛条件推演<\/h2>\n<p>反思循环按执行 → 评估/批评 → 精炼 → 迭代推进。推演收敛条件：<\/p>\n<p>第一步，初稿由生产者产出，边界由初始提示界定。第二步，批评者按 rubric 逐条核对事实、连贯、风格、完整度与指令遵循；批评结论要指向具体可改位置。第三步，反馈回流生产者，产出修订版。第四步，再跑批评，直到通过标准或达到轮次上限。<\/p>\n<p>收敛推演：批评标准单一且可对照、结论有外部证据支撑、每条批评可执行、历史结论累积不反复反转，循环趋向收敛。反方向条件下循环会震荡：标准互相冲突，满足一头就被另一头挑出；缺外部证据，只能在文本内部换措辞；反馈不可执行，修订版与初稿实质相同；立场逐轮反转，结论没有累积方向。<\/p>\n<p>成本推演：每轮历史把初稿、批评、各版修订再带一遍，第 <span class=\"katex-inline\">k<\/span> 轮输入约等于前述内容之和；轮次越多单轮 token 与延迟上涨越快。轮次上限是退出兜底，不保证质量达标；退出后未解决部分要转人工或补证据。<\/p>\n<h2>完整推导 2：工具调用闭环与失败成本推演<\/h2>\n<p>闭环推演从定义到再处理：工具描述写清用途、名称、参数类型；模型对照请求与定义决策是否调用；需要调用时产出 JSON 调用对象；编排层解析、校验参数后执行；结果回传上下文；模型据此收尾或继续调用。<\/p>\n<p>失败分支推演：<\/p>\n<ul><li>\n缺参数：返回字段名与补全路径，模型改参重试；不填猜测值。\n<\/li><li>\n外部超时：区分可重试与不可重试，退避后仍失败则降级告知用户。\n<\/li><li>\n越权参数：编排层权限校验拒绝，回传无权执行；不靠模型自觉拦截。\n<\/li><li>\n静默失败：返回空字符串或 null 时，模型无法区分“无结果”与“调用失败”，会在缺失结果上继续作答。\n<\/ul>\n<p>成本推演：一次成功调用包含定义载入、决策生成、编排校验、工具往返、结果回传、再处理；重试多一轮错误回传与改参调用。工具清单变长后，功能相近的定义互相竞争候选，选错概率上升；收窄 schema 与划清描述边界，比单纯增加工具数量更稳。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\nG[目标] --&gt; P[计划]\nP --&gt; E[执行一步]\nE --&gt; C{结果符合检查点?}\nC --&gt;|是| N[下一步]\nC --&gt;|否| R[反思/重规划]\nR --&gt; P\nN --&gt; C<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：反思不是“再想一遍”，而是拿检查点对照；不符合就回到计划层，而不是在错误结果上继续叠加。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：装修先出施工图（规划），每道工序验收（检查点），发现墙歪了返工（反思），而不是继续贴瓷砖。\n<\/li><li>\n实例：让智能体“把这份 CSV 做成月报”。计划：读表→校验字段→算指标→写结论→生成图表；若字段缺失，触发重规划去问用户，而不是编造列名。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：反思次数越多越好。<\/strong> 没有新证据的反复反思只会让模型自我迎合，历史膨胀还推高成本。\n<\/li><li>\n<strong>误解：工具越多越强。<\/strong> 工具描述不清时模型乱选，错误率反而上升；工具按最小必要保留。\n<\/li><li>\n<strong>误解：计划必须一次定死。<\/strong> 环境变化后沿失效计划推进是典型失败；初始计划只是起点。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n有效反思必须有什么？（答案：明确标准 + 外部证据 + 轮次上限。）\n<\/li><li>\n工具调用失败时，最差的设计是什么？（答案：静默返回空结果，模型无法区分无结果与调用失败。）\n<\/li><li>\n什么时候该重规划？（答案：检查点不通过、工具连续失败、关键假设被推翻。）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>反事实一：去掉反思的外部证据环节。批评只能在初稿文本内部找瑕疵，事实错误无法被证实或消除；推演上，循环会在措辞层面反复摆动，轮次耗尽后留下的初稿与首轮差别不大。补上测试结果、检索原文或计算结果后，批评才有对照依据。<\/p>\n<p>反事实二：把工具失败改成静默返回。上游工具超时或缺参数时返回空值，模型把空理解为“没有数据”，继续生成结论；错误被带进下游成稿。反过来，若执行层不设权限校验，模型生成的合法格式参数可能直达越权动作，护栏缺口无法由模型侧弥补。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章承接第 1 章的基础构件：反思是挂在链式单步上的质量环，工具是链条与计划落地的动作通道，规划把固定序列升级成可修订的行动路线。下一章进入上下文层：这些模式产生的产物需要记忆与检索支撑，工具调用也会接入外部知识库；本章的检查点与错误返回，是第 3 章 RAG 证据闭环的前置。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n反思靠 rubric、证据与上限，不靠“再想想”。\n<\/li><li>\n工具 schema 越窄越可靠，错误要可读、可重试。\n<\/li><li>\n计划每步有验收条件，假设显式记录，失效即重规划。\n<\/ul>", "ch03": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.110<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 4–6 章：反思、工具调用与规划（自我改进三模式）<\/a><\/span><\/div><h1>第 8、10、14 章：记忆管理、MCP 与知识检索（上下文层）<\/h1>\n<blockquote>对应原书第 8 章《Memory Management》、第 10 章《Model Context Protocol》、第 14 章《Knowledge Retrieval (RAG)》（PDF 第 110–188 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1–2 章的编排与反馈模式\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分工作记忆、长期记忆与外部知识库，写出各自的写入与召回策略；\n<\/li><li>\n设计带切块、混合检索、重排与引用的 RAG 流程；\n<\/li><li>\n说明 MCP 标准化的是什么、不解决什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>模型本身没有记忆，所谓“记住”都是<strong>把相关信息重新放进上下文<\/strong>；记忆管理决定什么该存、什么该取、什么该忘，检索链路决定材料能否干净地到达模型。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>记忆分层<\/h3>\n<ul><li>\n<strong>工作记忆（短期/上下文记忆）<\/strong>：当前对话窗口内的近期消息与产物，容量有限，随会话消失；长上下文窗口只是扩大了这一层（PDF 第 110 页）。\n<\/li><li>\n<strong>长期记忆<\/strong>：向量库或数据库，跨会话保存，需要写入策略与召回策略；按语义相似度召回，再注入短期上下文使用（PDF 第 110 页）。\n<\/li><li>\n<strong>外部知识<\/strong>：文档库、API、业务数据库，按需检索，不进入模型参数。\n<\/ul>\n<p>写入长期记忆前要过滤：只存稳定偏好与长期事实，不存一次性任务指令，否则记忆被污染；旧记忆还要有时效标注，避免覆盖新事实。<\/p>\n<h3>概念 2：RAG（检索增强生成，c07）<\/h3>\n<p>流程：切块 → 建索引 → 查询改写 → 召回 → 重排 → 拼接进上下文 → 生成并标注引用。检索主路径是向量语义近邻，BM25 关键词算法擅长专有名词与型号字面匹配，工程上常用两路混合检索。常见失败不在生成而在检索：切块切断语义、查询与文档用词不一致、召回太多稀释重点。对策：小块加重叠、混合检索、重排后只留 top-k。详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。<\/p>\n<h3>MCP（模型上下文协议）<\/h3>\n<p>MCP 是一套开放标准，用于标准化模型发现、连接和使用外部能力的方式：工具、资源、提示模板用统一协议暴露，客户端不必为每个服务写一套适配；它采用客户端—服务器模型组织信息流（PDF 第 138、140 页）。MCP 解决连接方式的碎片化，不解决工具本身的质量与参数合理性。<\/p>\n<h2>完整推导 1：RAG 召回—重排—注入链路推演<\/h2>\n<p>入库推演：文档按章节、段落或句子切块，分片转向量写入向量库，关键词索引同步建立；切块过碎丢失主语与背景，过整则语义混杂、距离被稀释。<\/p>\n<p>查询推演：问题先做规范化或改写，再转向量；查询与文档措辞脱节时关键词路径漏召，语义检索负责跨说法匹配。<\/p>\n<p>召回推演：向量路径取语义近邻，BM25 路径取字面命中，两路融合去重；召回阶段宁可多取候选，避免一开始漏掉相关分片。<\/p>\n<p>重排推演：候选按综合相关度排序，套距离阈值与 top-k 上限；书中实现以 <code>SIMILARITY_TOP_K<\/code> 控制召回条数、<code>VECTOR_DISTANCE_THRESHOLD<\/code> 限制语义距离上限（PDF 第 183 页）。低于阈值的分片不进上下文，这一步控制注入噪声。<\/p>\n<p>注入与生成推演：入选片段连同出处拼入提示模板，模型基于材料作答并逐条引用。证据分散在多个分片或多篇文档时，检索器可能没集齐必要上下文，答案不完整；材料未召到时系统应明示，而不是补全细节。<\/p>\n<h2>完整推导 2：记忆写入与召回策略推演<\/h2>\n<p>写入推演：一条信息进入长期记忆前，先判断稳定性——一次性指令、临时变量不入库；稳定偏好、长期事实入库，并标注来源与时间。写入过滤缺失会让旧指令反复干扰后续会话。<\/p>\n<p>召回推演：需要信息时先查长期记忆，按语义相似度取相关条目，注入工作记忆参与当前作答；召回结果同样要走相关度筛选，不能把整段历史记录塞进上下文。<\/p>\n<p>分层边界推演：工作记忆装当前会话所需，长期记忆装跨会话沉淀，外部知识装原始文档与业务数据。三类信息更新方式不同：会话结束工作记忆清空，长期记忆周期性整理，外部知识库随源文档同步。上下文窗口扩大只抬高工作记忆容量，不替代检索；无关内容越多，模型越容易抓错重点。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\nQ[问题] --&gt; R[查询改写]\nR --&gt; S[混合检索]\nS --&gt; RR[重排 top-k]\nRR --&gt; C[上下文]\nC --&gt; L[生成 + 引用]\nL --&gt; M[(长期记忆)]\nM --&gt; C<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：检索与记忆都只是“往上下文里放材料”；放错材料，再强的模型也只能基于错误材料回答。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：开卷考试。书在书包里（外部知识），你只把相关几页摊在桌上（上下文），记在脑子里的公式是参数化知识。\n<\/li><li>\n实例：问“我们公司退货政策第 3 条”，先检索政策文档，命中后把原文片段与链接放进上下文，回答逐条引用；检索不到就明说，而不是凭常识编。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：上下文窗口大就不用检索。<\/strong> 无关内容占满窗口反而稀释重点；检索解决的是材料相关性，不是窗口容量。\n<\/li><li>\n<strong>误解：存进向量库就叫记忆。<\/strong> 没有召回策略与时效标注，旧记忆会覆盖新事实；记忆等于写入策略加召回策略加遗忘策略。\n<\/li><li>\n<strong>误解：MCP 提升了工具能力。<\/strong> 它统一连接方式，工具本身的描述质量、参数合理性仍需单独设计。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n长期记忆最适合存什么？（答案：稳定偏好、长期事实；不存一次性任务指令。）\n<\/li><li>\nRAG 最常见的失败环节？（答案：检索与切块，而不是生成。）\n<\/li><li>\nMCP 标准化了什么？（答案：模型与外部工具/资源/提示的连接方式。）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>反事实一：去掉 RAG 的重排阈值与 top-k 限制。召回候选全部注入上下文，材料 token 随候选数膨胀，无关分片引入噪声并可能给出互相矛盾的依据；推演上，模型抓重点的能力被材料数量抵消，回答质量随噪声上升而下降。<\/p>\n<p>反事实二：把长期记忆当成完整聊天记录存档。一次性指令与临时变量入库后，后续会话被过期上下文干扰；没有遗忘与时效标注，旧事实覆盖新事实。反过来，若完全不做长期记忆，跨会话的稳定偏好每次都要重新告知，个性化无法累积。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章为第 2 章的模式提供材料底座：反思与评审需要 RAG 提供外部证据，工具调用可挂载检索能力，规划中的信息收集步走检索链路。下一章进入系统化层：多智能体分工、人机审批与护栏，会把本章进入上下文的材料与动作纳入角色协议和安全检查。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n记忆 = 写入策略 + 召回策略 + 遗忘策略。\n<\/li><li>\nRAG 先修检索，再谈生成；混合检索、重排阈值、引用标注缺一不可。\n<\/li><li>\nMCP 管连接，不管内容质量。\n<\/ul>", "ch04": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.97<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 8、10、14 章：记忆管理、MCP 与知识检索（上下文层）<\/a><\/span><\/div><h1>第 7、13、18 章：多智能体协作、人机协作与护栏（系统化收口）<\/h1>\n<blockquote>对应原书第 7 章《Multi-Agent Collaboration》、第 13 章《Human-in-the-Loop》、第 18 章《Guardrails/Safety Patterns》（PDF 第 97–240 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1–3 章的编排、反馈、工具与上下文模式\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断一个任务是否真的需要多智能体，写出角色接口与汇总责任；\n<\/li><li>\n设计人机协作的审批点，明确审批信息应包含什么；\n<\/li><li>\n为智能体系统设置输入、执行、输出三层护栏，并列出评估指标。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>多智能体不是“更多模型”，而是<strong>角色分工 + 通信协议 + 汇总机制<\/strong>；护栏不是事后过滤，而是<strong>在关键动作前后设置可拦截的检查点<\/strong>；人机协作把不可逆动作交给人收口。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：多智能体协作（c08）<\/h3>\n<p>多个独立或半独立智能体围绕共同目标工作，各有角色、对齐的子目标与不同工具/知识库。常见拓扑：顺序交接、并行处理、辩论与共识、层级结构、专家团队、批评者—审阅者（PDF 第 98 页）。收益来自并行与专业化，成本来自通信开销、上下文不一致与责任不清。判断标准：任务能否拆成接口清晰、可独立验收的子任务；不能拆分时，单智能体加工具通常更稳。详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。<\/p>\n<h3>人机协作（Human-in-the-Loop）<\/h3>\n<p>在不可逆动作前设审批：付款、发邮件、删数据、对外发布。审批点要给出“将执行什么、影响范围、如何撤销”，而不是只弹一个“是否继续”。高风险动作、护栏报警与低置信度样本转人工复核；审批点集中在不可逆动作前，避免把用户变成每步都点确认的按钮。<\/p>\n<h3>概念 3：护栏与评估（c09）<\/h3>\n<ul><li>\n<strong>输入护栏<\/strong>：提示注入检测、敏感信息过滤、schema 校验。\n<\/li><li>\n<strong>执行护栏<\/strong>：权限最小化、沙箱、速率限制、危险工具白名单、参数范围校验。\n<\/li><li>\n<strong>输出护栏<\/strong>：事实核查、格式校验、引用完整性、政策遵循复核。\n<\/ul>\n<p>评估指标分三层：任务成功率、过程合规率（是否越权、是否留痕）、成本与延迟。只看成功率会鼓励智能体冒险越权。详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。<\/p>\n<h2>完整推导 1：多智能体分工与通信成本推演<\/h2>\n<p>分工推演：任务按职责、专业或工具边界拆成子任务，每个角色的输入、输出与验收标准写清，工具按角色分管。分工成立的硬前提是子任务接口清晰、可独立验收；接口模糊时，角色间反复澄清、互相等待。<\/p>\n<p>通信推演：角色间消息约定结构，说明谁、做了什么、产物是什么、依据什么；共享状态包含共同目标、已完成项、待办与约束。设协作链经过 <span class=\"katex-inline\">h<\/span> 个角色，每跳传递一份产物；若每跳整包携带上游历史，第 <span class=\"katex-inline\">h<\/span> 跳内容随跳数累加，token 总量明显高于单智能体串行。上下文在多跳转述中还会失真，汇总者需要对照原始材料核验。<\/p>\n<p>汇总推演：指定最终收口角色，并行产物在此合并、去重、消解冲突；批评意见回流给原作者或终审修订。收益是否覆盖成本，取决于拆分处的接口质量；子任务强依赖、接口无法预定义时，拆分后稳定性低于单智能体加工具。<\/p>\n<h2>完整推导 2：三层护栏与评估闭环推演<\/h2>\n<p>输入层推演：请求进入主模型与工具之前，做注入检测、敏感信息过滤与结构校验；不合规请求拒绝、改写或转人工。这一层成本低、拦截早，避免污染上下文与误触发工具。<\/p>\n<p>执行层推演：动作经编排层放行时核对权限边界、参数范围、速率与白名单；危险动作挂审批与回滚，外部调用包超时与退避。这一层拦住“格式合法但越权”的参数，是动作发生前的最后一道闸。<\/p>\n<p>输出层推演：交付前检查事实、格式、引用完整性与政策遵循，可用轻量模型二次复核；动作已不可逆时，文本过滤收不回影响，所以输出层不能替代执行层。<\/p>\n<p>评估闭环推演：构造攻击样例测拦截率，正常样例测误伤率；日志记录输入、判定依据、放行或拦截、动作与输出，统计延迟、成功率、错误类型。拦截率与误伤率此消彼长，阈值松紧按场景风险调整；没有两类样本对照，拦了多少不能直接当作安全成效。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nI[输入] --&gt; G1[输入护栏]\nG1 --&gt; A[智能体执行]\nA --&gt; H{不可逆动作?}\nH --&gt;|是| AP[人工审批]\nH --&gt;|否| G2[执行护栏]\nAP --&gt; G2\nG2 --&gt; O[输出]\nO --&gt; G3[输出护栏]\nG3 --&gt; E[评估与留痕]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：护栏分布在全流程，不是一个末端过滤器；审批点只放在不可逆动作前。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：公司报销。输入检查发票真伪，执行限制额度，超过额度要主管审批，输出核对科目；四道关缺一不可。\n<\/li><li>\n实例：让智能体自动给客户发退款邮件。检索订单→计算金额→人工审批→发送→记录日志；金额超过阈值必须二次审批。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：智能体越多越智能。<\/strong> 角色重叠时互相等待、重复劳动；能力来自接口质量，不来自角色堆叠。\n<\/li><li>\n<strong>误解：加了护栏就一定安全。<\/strong> 护栏要在攻击样例与误报样例上测试，未测的护栏只是心理安慰。\n<\/li><li>\n<strong>误解：审批点越多越稳。<\/strong> 审批集中在不可逆动作前；每步都确认会把用户变成按钮，拖慢流程且稀释关键审批的注意力。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n什么任务不适合多智能体？（答案：子任务接口不清、强顺序依赖、单模型加工具即可完成。）\n<\/li><li>\n审批点应设在哪里？（答案：不可逆、高风险、对外产生实际影响的动作前。）\n<\/li><li>\n评估为什么不能只看成功率？（答案：会鼓励冒险与越权，忽略合规、成本与延迟。）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>反事实一：去掉执行层护栏，只保留末端内容过滤。工具已被调用、数据已被删除之后，输出层文本检查无法收回动作；越权参数在编排层无人核对，风险直达外部系统。补上执行层后，越权请求在动作发生前被拒绝并回传可读信息。<\/p>\n<p>反事实二：把接口不清的任务强行拆成多智能体。角色之间引用格式与责任边界未约定，汇合时证据与主张对不上，通信反复对齐；推演上，协调成本超过单智能体加工具的方案，稳定性反而下降。反过来，若子任务可独立验收、工具可分管，专业化与并行收益才能覆盖通信开销。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章收口前 three 章：链式、路由、并行提供编排骨架，反思与工具提供反馈和动作通道，记忆与 RAG 提供材料底座；本章把这些构件放进角色协议、人工审批与安全检查之下。多智能体复用规划分解与并行聚合，护栏约束工具权限与输出，人机协作承接护栏升级的高风险决策。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n多智能体看接口，不看数量；角色、通信协议、汇总责任三要素齐备。\n<\/li><li>\n审批点 = 不可逆动作前，附影响范围与撤销方式。\n<\/li><li>\n护栏三层：输入、执行、输出；评估三层：效果、合规、成本与延迟。\n<\/ul>", "c01": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.27<\/div><h1>提示链（Prompt Chaining）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章 | <strong>原书位置<\/strong>：第 1 章《Prompt Chaining》（PDF 第 27 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>单条提示要同时承担分析、提炼、生成多种职责时，模型容易在多重约束之间顾此失彼。原书把这类失败归为五类：指令忽视（提示中的部分要求被漏掉）、上下文漂移（偏离最初语境）、错误传播（前期错误被后续步骤放大）、长上下文信息不足、以及认知负荷升高后幻觉概率上升（PDF 第 27–28 页）。书中给的例子是一条提示同时要求分析市场调研报告、总结发现、提炼带数据支撑的趋势并起草邮件，结果摘要做得不错，却提取不到数据，邮件也写不好。<\/p>\n<p>不用链式会出现什么错误？把所有子任务压在一次生成里，中间没有可检查的产物，出错时无法判断是哪一步偏离了要求；模型只能给出一个最终文本，工程侧既无法拦截错误，也无法针对某一步单独优化。提示链要解决的具体困难，就是把一次大生成拆成一串小生成，让每一步的输入、输出和校验点都可见、可替换。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：提示链（有时也称流水线 Pipeline 模式）把复杂问题拆成一系列更小、更易处理的子问题，每个子问题由专门设计的提示分别处理，前一步生成的结果作为下一步的输入（PDF 第 27 页）。逐句拆开：<\/p>\n<ul><li>\n“拆成一系列子问题”：任务被切成有序的步骤，每一步只聚焦一个侧面；书中在每个阶段为模型分配不同角色，例如市场分析师、行业分析师、文档写作者（PDF 第 28 页）。\n<\/li><li>\n“专门设计的提示”：每一步的提示只带本步骤需要的约束，不把整条任务的要求重复一遍。\n<\/li><li>\n“前一步结果作为下一步输入”：步骤之间存在依赖链，先前步骤的上下文与结果引导后续处理，这也是“链”这个名字的由来（PDF 第 27 页）。\n<\/li><li>\n“结构化输出”：步骤间传递的数据要约定 JSON、XML 等可解析格式；输出含糊或格式混乱时，下一步会因输入不当而失败（PDF 第 28–29 页）。\n<\/ul>\n<p>正例：会议纪要先抽取决议条目，再据决议生成待办，最后按负责人分派，三步顺序固定、产物可解析。反例：让一条提示既读会议录音转写稿、又判断决议有效性、又直接发出分派邮件，中间没有任何结构化中间产物。<\/p>\n<h2>原理推导<\/h2>\n<p>链式的可靠性来自三条可逐步验证的机制。<\/p>\n<p>第一条机制是认知负荷下降。一次生成要同时满足的约束越多，模型在每一步分配给各约束的注意力越分散。拆步之后，单步提示只保留本步骤的目标与输入，模型在较小的约束集合内作答，出错面随之缩小。这一步用到的假设是：模型在单步内可处理的约束数量有限，约束越多遗漏概率越高；原书把指令忽视与上下文漂移列为单提示的典型失败，正是这条假设的经验证据（PDF 第 27–28 页）。<\/p>\n<p>第二条机制是状态传递与依赖链。设步骤序列为 <span class=\"katex-inline\">S_1, S_2, \\ldots, S_n<\/span>，第 <span class=\"katex-inline\">i<\/span> 步的输入由两部分组成：本步骤提示模板 <span class=\"katex-inline\">P_i<\/span>，以及上一步产物 <span class=\"katex-inline\">O_{i-1}<\/span>；第 <span class=\"katex-inline\">i<\/span> 步输出 <span class=\"katex-inline\">O_i = f_i(P_i, O_{i-1})<\/span>。链条的状态不是整段对话历史原样搬运，而是上一步经过结构化整理后的产物。原书要求步骤间用 JSON 或 XML 传递，目的就是让 <span class=\"katex-inline\">O_{i-1}<\/span> 可被程序解析、可被校验，而不是再让下一步靠自然语言理解去猜（PDF 第 28–29 页）。<\/p>\n<p>第三条机制是逐步校验带来的错误拦截。每一步产物在进入下一步之前，可以由程序规则或另一次模型调用检查格式、字段完整性与事实一致性；校验不通过就停在当前步，不把错误送进下游。原书的三步示例中，趋势识别步的输出被约束为带 <code>trend_name<\/code> 与 <code>supporting_data<\/code> 字段的 JSON 对象（PDF 第 28 页），程序可以直接检查这两个字段是否存在。<\/p>\n<p>把三条机制合起来：拆步降低单步负荷，结构化状态让步骤间接口确定，逐步校验把错误拦在局部。链条越长，失败点数量也越多，因此链式的优化方向不是堆步骤，而是把能合并的步骤合并、把必须独立校验的步骤保留。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>链式成立的条件有三条。其一，子步骤之间顺序固定、依赖关系明确，上一步产物是下一步的必要输入。其二，每一步的产物可以写成可检查的格式，便于程序或规则校验。其三，任务可以被预先拆出稳定步骤，不需要在执行中反复探索新路径。<\/p>\n<p>边界情况：任务路径事先不清楚、需要边做边判断下一步做什么时，固定链条会把模型锁死在预设顺序里，这类任务属于规划模式（见 c06）。步骤之间强耦合、拆开后信息必然丢失时，硬拆链条反而增加返工；此时应先评估拆分是否保住了必要上下文。链条中某一步需要外部实时信息时，该步可以接入工具调用（见 c05），但工具失败不能被链条的下游步骤自行消化。<\/p>\n<p>条件去掉会怎样：去掉结构化输出要求，步骤接口退回自由文本，下一步必须重新理解上一步的措辞，格式错误会沿链条放大；去掉逐步校验，早期错误直接进入最终生成，错误传播失去拦截点。<\/p>\n<h2>反例<\/h2>\n<p>书中记录的单提示失败案例：一条请求同时要求分析市场调研报告、总结发现、提炼带数据点的趋势并起草邮件，模型摘要尚可，但数据提取与邮件撰写都失败（PDF 第 28 页）。这个案例说明，把信息提炼、证据抽取、文体生成压在一次调用里，任何一个侧面都拿不到足够的注意力。<\/p>\n<p>另一个反例来自工程实践：链条上某步返回的自然语言段落没有约定字段，下一步要从中“自己找”负责人和截止时间，结果负责人被漏抽，待办分派空转。问题不在模型能力，而在步骤间接口没有结构化。<\/p>\n<h2>辨析<\/h2>\n<p>与路由（c02）的差别在决策位置：链式是固定顺序，路线在任务开始前已经确定；路由是先分类再分派到不同分支，分支选择发生在运行时。链式回答“按什么顺序做”，路由回答“走哪条分支做”。<\/p>\n<p>与并行化（c03）的差别在依赖方向：链式步骤之间有数据依赖，必须排队执行；并行化的子任务相互独立，可以同时开工，最后在汇总点合并。<\/p>\n<p>与反思（c04）的差别在控制流方向：链式是单向推进，产物交给下游；反思是反馈环，产物回到生成者接受批评后再修订。一个任务可以外层走链、内层在某一步挂反思循环。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：调用一次 LLM 并解析其文本输出的基本工程能力。后继：链式是路由分支内部的执行方式，也是规划模式把计划落成执行序列的底座；工具调用（c05）可以挂在链条的任意一步上补充外部信息；反思（c04）可以作为链条中单步的质量关卡。本概念把“分而治之”的任务拆解思路与步骤间的状态传递机制串在一起，是全书编排类模式的第一条基础链路。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（提示链）<\/summary><div class=\"depth-body\"><h1>提示链（Prompt Chaining）· 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要把链式模式推到可落地，先逐级倒查它依赖什么，每一层不成立会让上层在哪里断掉：<\/p>\n<ol><li>\n“每步产物可校验”依赖产物格式确定：步骤间传递的必须是可解析的结构化数据（JSON、XML、字段清单）。如果产物是混合自然语言，程序无法定位字段，校验规则无从写起。\n<\/li><li>\n“结构化数据可解析”依赖单步提示只要求一类输出。一步同时要摘要、抽取、成稿，输出天然是几段性质不同的文本，落不进固定 schema；所以拆步先于格式约定。\n<\/li><li>\n“单步只做一类事”依赖任务可被拆成有序子问题。子问题之间有明确先后，上一步产物是下一步的必要输入；若子任务可以同时开工，那属于并行化（c03），不是链。\n<\/li><li>\n“任务可拆分”再往前依赖一个观察：复合任务的失败集中在多约束顾此失彼，而不是模型完全不具备单项能力。原书记录的市场报告案例就是摘要尚可、数据提取与邮件撰写失败（PDF 第 28 页），说明单项能力在，缺的是分步承载。\n<\/li><li>\n最底层假设：模型在较小约束集合内作答时，遗漏概率低于在大约束集合内作答。这条假设是工程经验观察，原书用指令忽视、上下文漂移、错误传播、信息不足、幻觉五类单提示失败现象作为支撑（PDF 第 27–28 页）。\n<\/li><li>\n再往下还需要一条工程前提：步骤产物可以被程序读取与拦截，而不是只在对话流里存在；否则即便格式确定，也没有位置挂校验。\n<\/ol>\n<p>逆推到读者基线：先认“一次调用只能拿到一份文本”，再认“文本可以约定格式”，最后认“格式确定后步骤才能排队校验”。任一层前提不满足，链式就要先补工程条件，而不是直接套模式。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条分四步，每步写清用了哪条假设与保留限定：<\/p>\n<ul><li>\n第一步，观察单提示失败。复合请求同时携带分析、提炼、生成多重约束，模型在约束间分配注意力，出现指令忽视、上下文漂移、错误传播、长上下文信息不足与认知负荷升高后幻觉五类问题（PDF 第 27–28 页）。用到的假设：约束数量与遗漏概率同向变化；如果这条假设不成立，拆步就不会改善遗漏率。\n<\/li><li>\n第二步，拆步。把任务写成序列 <span class=\"katex-inline\">S_1, S_2, \\ldots, S_n<\/span>，第 <span class=\"katex-inline\">i<\/span> 步提示模板 <span class=\"katex-inline\">P_i<\/span> 只保留本步骤目标；第 <span class=\"katex-inline\">i<\/span> 步输出 <span class=\"katex-inline\">O_i = f_i(P_i, O_{i-1})<\/span>，其中 <span class=\"katex-inline\">O_0<\/span> 为原始材料。用到的假设：子任务可独立表述，且子任务之间的信息能通过 <span class=\"katex-inline\">O_{i-1}<\/span> 完整传递；若拆开后必要上下文留在被丢弃的原始文本里，第二步就立不住。\n<\/li><li>\n第三步，固定步骤接口。要求 <span class=\"katex-inline\">O_i<\/span> 按约定 schema 输出，程序在 <span class=\"katex-inline\">O_i<\/span> 进入 <span class=\"katex-inline\">O_{i+1}<\/span> 前检查字段类型、完整性与取值范围；检查不通过就停在当前步，不向下游送错数据。用到的假设：格式错误可以被规则识别，不依赖模型自觉；语义层面的错误规则识别不了，仍需另设批评或证据校验。\n<\/li><li>\n第四步，逐步校验落地。原书趋势识别步的输出含 <code>trend_name<\/code> 与 <code>supporting_data<\/code> 字段（PDF 第 28 页），程序可直接核对这两个字段；缺字段即拦截。链条末端才是面向用户的最终生成步，中间产物不直接暴露给终端。\n<\/ul>\n<p>限定条件拆解：<\/p>\n<ul><li>\n史料：原书三步示例为总结、趋势识别、邮件撰写，每步分配不同角色（市场分析师、行业分析师、文档写作者）（PDF 第 28 页）。\n<\/li><li>\n推断：角色分工的作用是收窄单步提示的立场与语气，不是给模型附加新知识；这一解释是读者基于机制做的推断，原书未把角色与能力提升直接划等号。\n<\/li><li>\n必然还是偶然：拆步降低遗漏是机制推论，但具体拆成几步取决于任务结构，不存在“三步最优”的固定答案。\n<\/ul>\n<p>推导保留的限定：拆步不能消除上游错误，只能把错误拦在局部；步骤越多失败点越多，能合并的步骤应合并。状态传递若丢失必要上下文，下游只能在残缺输入上作答。<\/p>\n<p>补充一步关于步骤合并的判断：两个相邻步骤若共享同一套输入材料、产物无需被独立校验，合并成一步能减少一次模型往返与一次格式交接；若产物需要独立检查（例如抽取结果要先核对字段再生成），则必须保留独立步骤。判断依据是“中间产物是否需要单独拦截”，而不是步骤数量本身。<\/p>\n<h2>机制逐项对照<\/h2>\n<p>把链式放到全书编排模式中对照，差别落在控制流、依赖方向与失败位置三点：<\/p>\n<ul><li>\n控制流：链式在任务开始前确定顺序，运行时不做分支选择；路由在运行时按分类结果选分支；并行在同一时刻启动多条独立支线。链式回答“先做哪步后做哪步”，路由回答“进哪条分支”，并行回答“哪些可以同时开工”。\n<\/li><li>\n依赖方向：链式后一步依赖前一步产物；并行子任务之间不共享可变状态；路由分支之间互斥，不传递产物。\n<\/li><li>\n失败位置：链式的失败点分布在每一步的产物上，可逐步拦截；路由的失败集中在分类环节，分错则整条分支走偏；并行的失败集中在聚合环节，冲突未消解则结果并列矛盾。\n<\/li
