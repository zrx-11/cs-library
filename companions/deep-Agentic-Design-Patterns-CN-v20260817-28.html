<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>Agentic Design Patterns（智能体设计模式）</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>
<style id="zs-visual-theme">

   设计口径：深色底、钴蓝+鲸青、衬线标题、点阵底纹、无玻璃拟态。 */

:root,
html[data-theme="dark"],
body[data-theme="dark"] {

  --font-body: "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;

html[data-theme="light"],
body[data-theme="light"],
body[data-theme=""] {

  --bg-soft: #e4eaf5;

  --bg3: #dbe4f2;

  --card: #f9fbff;
  --text: #111827;
  --text2: #26324a;
  --text3: #5b6b86;
  --muted: #5b6b86;
  --border: #c9d4e8;
  --accent: #3950de;
  --accent-strong: #2f43c9;
  --accent2: #0e8fa4;
  --accent3: #12805f;
  --accent-soft: #dbe4ff;
  --ok: #12805f;
  --bad: #c02a44;
  --warn: #9a5b00;
  --danger: #c02a44;
  --code-bg: #eef2f9;
  --dot: rgba(57, 80, 222, .10);
  --ink: #111827;
  --ink-2: #26324a;
  --ink-3: #5b6b86;
  --paper: #edf1f8;
  --paper-2: #f9fbff;
  --wash: #e4eaf5;
  --line: #c9d4e8;
  --line-soft: #dbe4f2;
}

html,
body {
  background-color: var(--bg) !important;
  color: var(--text) !important;
}

body {
  font-family: var(--font-body) !important;
  background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.2px);

  font-size: 16px;

h1, h2, h3, h4, h5,

header,

切块", "用户输入", "模型选择"], "answer": 1, "explain": "材料没召回到，生成再强也会编。", "relatedConceptId": "c07"}, {"id": "q09", "chapterId": "ch03", "type": "single", "question": "MCP 主要解决？", "options": ["模型推理速度", "工具连接方式碎片化", "训练数据质量", "前端样式"], "answer": 1, "explain": "统一工具/资源/提示的暴露协议。", "relatedConceptId": "c07"}, {"id": "q10", "chapterId": "ch04", "type": "single", "question": "审批点应设在哪里？", "options": ["每个模型调用前", "不可逆动作前", "输出之后", "只在系统启动时"], "answer": 1, "explain": "把人工放在会造成实际影响且不可撤销的动作前。", "relatedConceptId": "c09"}, {"id": "q11", "chapterId": "ch04", "type": "single", "question": "评估智能体为什么不能只看成功率？", "options": ["成功率无法计算", "会鼓励冒险与越权", "成本不重要", "用户不看指标"], "answer": 1, "explain": "还要看合规、成本、延迟。", "relatedConceptId": "c09"}, {"id": "q12", "chapterId": "ch04", "type": "single", "question": "什么任务不适合多智能体？", "options": ["可拆分的并行任务", "需要不同专业视角", "子任务接口不清且强依赖", "大规模文档处理"], "answer": 2, "explain": "接口不清时协调成本高于收益。", "relatedConceptId": "c08"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "链式适用条件", "back": "步骤固定、顺序不可换", "tags": ["模式"]}, {"id": "f02", "chapterId": "ch01", "front": "路由必备", "back": "互斥标签 + 低置信度兜底", "tags": ["模式"]}, {"id": "f03", "chapterId": "ch01", "front": "并行两种用法", "back": "分段并行、投票并行", "tags": ["模式"]}, {"id": "f04", "chapterId": "ch02", "front": "有效反思三件套", "back": "rubric、外部证据、轮次上限", "tags": ["方法"]}, {"id": "f05", "chapterId": "ch02", "front": "工具 schema 原则", "back": "窄、枚举、可读错误、幂等/可回滚", "tags": ["方法"]}, {"id": "f06", "chapterId": "ch02", "front": "重规划触发条件", "back": "检查点失败、工具连续失败、假设被推翻", "tags": ["方法"]}, {"id": "f07", "chapterId": "ch03", "front": "记忆三层", "back": "工作记忆、长期记忆、外部知识", "tags": ["概念"]}, {"id": "f08", "chapterId": "ch03", "front": "RAG 流程", "back": "切块→索引→改写→召回→重排→生成引用", "tags": ["流程"]}, {"id": "f09", "chapterId": "ch04", "front": "护栏三层", "back": "输入、执行、输出", "tags": ["概念"]}, {"id": "f10", "chapterId": "ch04", "front": "多智能体判断标准", "back": "子任务接口清晰、可独立验收", "tags": ["方法"]}], "companion": {"cat": "cs"}}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.27<\/div><h1>第 1–3 章：链式、路由与并行（基础编排三模式）<\/h1>\n<blockquote>对应原书第 1 章《Prompt Chaining》、第 2 章《Routing》、第 3 章《Parallelization》（PDF 第 27–59 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：会调用一次大模型 API、能解析文本输出\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n把一个复合任务拆成有顺序的提示链，并写出步骤间的结构化产物；\n<\/li><li>\n在多类型请求前设计路由分支与兜底回退；\n<\/li><li>\n判断哪些子任务可以并行，说出并行对延迟与 token 各自的影响；\n<\/li><li>\n画出三种模式的执行图，标出各自失败点。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>单个提示做不好复杂任务，不是模型能力不足，而是一次只让它承担一类职责；<strong>链式负责顺序，路由负责分诊，并行负责同时开工<\/strong>，三者是智能体编排的第一批基础构件。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：提示链（Prompt Chaining，c01）<\/h3>\n<p>把任务拆成固定顺序的几步，上一步输出作为下一步输入。例：先抽取会议纪要的决议条目，再据决议生成待办，最后按负责人分派。链式适合步骤稳定、顺序不能换的任务。链条的可靠性来自三点：单步约束收窄、步骤间结构化传递、逐步校验拦截。任何一步出错会向后传播，所以每一步都要有可检查的中间产物，而不是直接要最终答案。详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。<\/p>\n<h3>概念 2：路由（Routing，c02）<\/h3>\n<p>先分类，再把请求送到对应处理分支。例：用户问题先判为订单状态、产品信息、技术支持或意图不明，分别进入不同链路。路由适合输入类型多、处理方式差异大的场景。关键设计：分类要有把握程度判断，低置信度走兜底或澄清；标签互斥且覆盖真实流量，分类错比不分类更贵。实现方式包括基于 LLM、嵌入、规则与训练分类器四类（PDF 第 41 页）。详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。<\/p>\n<h3>概念 3：并行化（Parallelization，c03）<\/h3>\n<p>相互独立的子任务同时执行，最后在汇聚点汇总。两种用法：分段并行（长文档切块分别总结）与投票并行（同一问题多次求解后取多数或交叉验证）。并行缩短的是墙钟时间，不省 token；子任务之间有依赖时硬并行，只会更早拿到互相矛盾的中间结果。并发度还要受外部服务配额约束。详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。<\/p>\n<h2>完整推导 1：链式与路由的成本对比推演<\/h2>\n<p>同一个客服任务，先比较两种编排方式的成本结构。<\/p>\n<p>推演前提：请求可分为三类，每类处理流程不同；模型单步提示约 700 输入 token，输出约 250 token（工程估算，非原书测量值）。<\/p>\n<p>方式甲，全包单提示：一条提示同时描述三类流程，系统提示随分支数量变长，约 2000 token；每个请求都携带与其无关的流程约束，单步输出要同时兼顾三类处理。约束膨胀后，遗漏与跑题概率上升。<\/p>\n<p>方式乙，路由加分链：先一次分类调用输出标签（输入约 600 token，输出约 30 token），再进入对应分支的短链（分支提示约 500 token）。推演链路：分类 → 命中分支首步 → 分支后续步骤。路由用一次额外分类调用，换走分支内提示的收窄；代价是分类本身存在误派风险，误派后下游仍会消耗一次分支调用才发现对不上。<\/p>\n<p>结论落点：类型单一、流程一致的任务，路由的额外调用不划算；类型多、分支差异大的任务，全包提示的约束膨胀超过路由成本。链式在每个分支内部承担顺序执行，路由决定请求进哪条链，二者是嵌套关系而不是二选一。<\/p>\n<h2>完整推导 2：并行化的延迟与 token 推演<\/h2>\n<p>设 <span class=\"katex-inline\">m<\/span> 个独立子任务，单任务耗时 <span class=\"katex-inline\">t<\/span>，单任务输入 <span class=\"katex-inline\">I<\/span> token、输出 <span class=\"katex-inline\">O<\/span> token。<\/p>\n<p>延迟推演：串行总延迟为 <span class=\"katex-inline\">m \\cdot t<\/span>；理想并发下总延迟约为 <span class=\"katex-inline\">\\max_i t_i<\/span>，即最慢子任务决定等待时间。若并发度上限为 <span class=\"katex-inline\">c<\/span>，延迟约为 <span class=\"katex-inline\">\\lceil m/c \\rceil \\cdot t<\/span>，再加聚合等待。并发度超过外部吞吐上限后，多余请求排队，延迟不再下降。<\/p>\n<p>token 推演：<span class=\"katex-inline\">m<\/span> 个子任务并行的 token 消耗约为 <span class=\"katex-inline\">m(I+O)<\/span>，另加汇总步读取开销；串行单任务一次完成时总 token 更低。并行买的是时间与稳健性，不是成本。投票并行还要把同一任务重复 <span class=\"katex-inline\">k<\/span> 遍，token 随遍数叠加。<\/p>\n<p>聚合推演：分段并行在汇聚点合并、去重、消解冲突；投票并行按多数表决或一致性检验定答案。冲突规则必须事先写清，否则并行产物互相矛盾地并列交给用户。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nQ[用户请求] --&gt; R{路由分类}\nR --&gt;|类型 A| A[链 A: 抽取 → 校验 → 生成]\nR --&gt;|类型 B| B[链 B: 检索 → 回答]\nR --&gt;|不确定| C[兜底: 追问/澄清]\nA --&gt; O[汇总输出]\nB --&gt; O\nQ --&gt; P1[并行子任务 1]\nQ --&gt; P2[并行子任务 2]\nP1 --&gt; O\nP2 --&gt; O<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：路由是分诊台，链是流水线，并行是同时开几条流水线；三者可以嵌套，嵌套层级越多排错越难。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：医院先分诊（路由），再按科室流程检查（链），化验与影像可同时做（并行）。\n<\/li><li>\n实例：把 100 页 PDF 分 10 块并行总结，再串一条“合并去重”的链；如果直接让模型一次读 100 页，中间内容会被截断或忽略。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：链越长越强。<\/strong> 每多一步就多一个失败点，能合并的步骤应合并；链式优化方向是控制步数，不是堆步骤。\n<\/li><li>\n<strong>误解：并行一定更快。<\/strong> 有依赖的步骤并行，错误不会被串行顺序保护拦下；并行前必须先做独立性判断。\n<\/li><li>\n<strong>误解：路由标签越多越精细。<\/strong> 标签过多会抬升边界样本比例，长尾先收进兜底，观察后再决定是否独立成支。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n会议纪要转待办，最适合哪种模式？（答案：链式；抽取→生成→分派有严格顺序。）\n<\/li><li>\n客服系统按问题类型走不同提示，用什么？（答案：路由。）\n<\/li><li>\n并行投票的主要作用是什么？（答案：暴露单次求解的随机性分歧，提高结果稳健性；它不弥补知识缺口。）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>反事实一：去掉链式的结构化输出要求。步骤接口退回自由文本，下一步要从上一段自然语言里猜字段，格式错误沿链放大；推演上，本可被程序拦截的缺字段问题，会流入下游变成内容偏差。<\/p>\n<p>反事实二：把一段本可并行的批量处理改成串行。子任务相互独立时，串行延迟从 <span class=\"katex-inline\">\\max t_i<\/span> 抬到 <span class=\"katex-inline\">m \\cdot t<\/span>，token 基本不变；反之，把有依赖的两步强行并行，下游拿到未经上游确认的中间值，返工量超过串行。两种改错方向都说明：模式选择先看依赖结构，再看吞吐目标。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章是四条学习单元的起点：链式（c01）提供顺序执行底座，路由（c02）提供分支选择，并行（c03）提供并发手段。后续章节在这批构件上叠加反馈环（反思 c04）、外部动作通道（工具 c05）与动态序列调整（规划 c06）；本章的结构化产物与独立性判断，是那些更复杂模式的前置条件。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n链式：顺序稳定，逐步校验，结构化传递。\n<\/li><li>\n路由：先分类，判把握，留兜底。\n<\/li><li>\n并行：只给独立子任务，省墙钟不省 token，聚合要消解冲突。\n<\/ul>", "kind": "chapter", "title": "第 1–3 章：链式、路由与并行（基础编排三模式）"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.61<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1–3 章：链式、路由与并行（基础编排三模式）<\/a><\/span><\/div><h1>第 4–6 章：反思、工具调用与规划（自我改进三模式）<\/h1>\n<blockquote>对应原书第 4 章《Reflection》、第 5 章《Tool Use (Function Calling)》、第 6 章《Planning》（PDF 第 61–96 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 1 章的链式、路由与并行\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n设计一个“生成—批评—修订”的反思循环，写明标准、证据与停止条件；\n<\/li><li>\n写出工具调用的参数约束、错误返回与重试处理；\n<\/li><li>\n把开放任务拆成可执行计划，设置检查点与重规划触发条件。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>反思让输出<strong>变好<\/strong>，工具让模型<strong>能做事<\/strong>，规划让多步任务<strong>不迷路<\/strong>；三者把第 1 章的单向编排升级成带反馈、能动作、可调整的系统。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：反思（Reflection，c04）<\/h3>\n<p>让同一模型或另一个模型扮演批评者，按明确标准检查草稿，再据此修订。有效反思需要三件配套：具体 rubric、可供核对的外部证据（测试结果、检索原文、计算结果）、轮次上限。生产者—批评者分离能缓解自己给自己放水，但补不上两者共享的偏见。无效反思的特征是只说“请改进一下”，模型只换措辞不改事实。详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。<\/p>\n<h3>概念 2：工具调用（Tool Use / Function Calling，c05）<\/h3>\n<p>模型不直接执行，而是输出结构化调用请求，由编排层拦截、执行后把结果回传。闭环六步：工具定义、LLM 决策、调用生成、执行拦截、结果回传、再处理。设计要点：参数 schema 窄、枚举优于自由文本、工具幂等或可回滚、失败返回可读错误；权限按最小化配置。详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。<\/p>\n<h3>概念 3：规划（Planning，c06）<\/h3>\n<p>把目标拆成有序子任务，边执行边对照检查点。计划不是一次性脚本：检索不到、工具连续失败、中间结果与预期不符、关键假设被推翻时，触发重规划。计划粒度以每步可验收为准；太粗卡住时无法定位，太细耗尽上下文。详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。<\/p>\n<h2>完整推导 1：反思循环的收敛条件推演<\/h2>\n<p>反思循环按执行 → 评估/批评 → 精炼 → 迭代推进。推演收敛条件：<\/p>\n<p>第一步，初稿由生产者产出，边界由初始提示界定。第二步，批评者按 rubric 逐条核对事实、连贯、风格、完整度与指令遵循；批评结论要指向具体可改位置。第三步，反馈回流生产者，产出修订版。第四步，再跑批评，直到通过标准或达到轮次上限。<\/p>\n<p>收敛推演：批评标准单一且可对照、结论有外部证据支撑、每条批评可执行、历史结论累积不反复反转，循环趋向收敛。反方向条件下循环会震荡：标准互相冲突，满足一头就被另一头挑出；缺外部证据，只能在文本内部换措辞；反馈不可执行，修订版与初稿实质相同；立场逐轮反转，结论没有累积方向。<\/p>\n<p>成本推演：每轮历史把初稿、批评、各版修订再带一遍，第 <span class=\"katex-inline\">k<\/span> 轮输入约等于前述内容之和；轮次越多单轮 token 与延迟上涨越快。轮次上限是退出兜底，不保证质量达标；退出后未解决部分要转人工或补证据。<\/p>\n<h2>完整推导 2：工具调用闭环与失败成本推演<\/h2>\n<p>闭环推演从定义到再处理：工具描述写清用途、名称、参数类型；模型对照请求与定义决策是否调用；需要调用时产出 JSON 调用对象；编排层解析、校验参数后执行；结果回传上下文；模型据此收尾或继续调用。<\/p>\n<p>失败分支推演：<\/p>\n<ul><li>\n缺参数：返回字段名与补全路径，模型改参重试；不填猜测值。\n<\/li><li>\n外部超时：区分可重试与不可重试，退避后仍失败则降级告知用户。\n<\/li><li>\n越权参数：编排层权限校验拒绝，回传无权执行；不靠模型自觉拦截。\n<\/li><li>\n静默失败：返回空字符串或 null 时，模型无法区分“无结果”与“调用失败”，会在缺失结果上继续作答。\n<\/ul>\n<p>成本推演：一次成功调用包含定义载入、决策生成、编排校验、工具往返、结果回传、再处理；重试多一轮错误回传与改参调用。工具清单变长后，功能相近的定义互相竞争候选，选错概率上升；收窄 schema 与划清描述边界，比单纯增加工具数量更稳。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\nG[目标] --&gt; P[计划]\nP --&gt; E[执行一步]\nE --&gt; C{结果符合检查点?}\nC --&gt;|是| N[下一步]\nC --&gt;|否| R[反思/重规划]\nR --&gt; P\nN --&gt; C<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：反思不是“再想一遍”，而是拿检查点对照；不符合就回到计划层，而不是在错误结果上继续叠加。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：装修先出施工图（规划），每道工序验收（检查点），发现墙歪了返工（反思），而不是继续贴瓷砖。\n<\/li><li>\n实例：让智能体“把这份 CSV 做成月报”。计划：读表→校验字段→算指标→写结论→生成图表；若字段缺失，触发重规划去问用户，而不是编造列名。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：反思次数越多越好。<\/strong> 没有新证据的反复反思只会让模型自我迎合，历史膨胀还推高成本。\n<\/li><li>\n<strong>误解：工具越多越强。<\/strong> 工具描述不清时模型乱选，错误率反而上升；工具按最小必要保留。\n<\/li><li>\n<strong>误解：计划必须一次定死。<\/strong> 环境变化后沿失效计划推进是典型失败；初始计划只是起点。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n有效反思必须有什么？（答案：明确标准 + 外部证据 + 轮次上限。）\n<\/li><li>\n工具调用失败时，最差的设计是什么？（答案：静默返回空结果，模型无法区分无结果与调用失败。）\n<\/li><li>\n什么时候该重规划？（答案：检查点不通过、工具连续失败、关键假设被推翻。）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>反事实一：去掉反思的外部证据环节。批评只能在初稿文本内部找瑕疵，事实错误无法被证实或消除；推演上，循环会在措辞层面反复摆动，轮次耗尽后留下的初稿与首轮差别不大。补上测试结果、检索原文或计算结果后，批评才有对照依据。<\/p>\n<p>反事实二：把工具失败改成静默返回。上游工具超时或缺参数时返回空值，模型把空理解为“没有数据”，继续生成结论；错误被带进下游成稿。反过来，若执行层不设权限校验，模型生成的合法格式参数可能直达越权动作，护栏缺口无法由模型侧弥补。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章承接第 1 章的基础构件：反思是挂在链式单步上的质量环，工具是链条与计划落地的动作通道，规划把固定序列升级成可修订的行动路线。下一章进入上下文层：这些模式产生的产物需要记忆与检索支撑，工具调用也会接入外部知识库；本章的检查点与错误返回，是第 3 章 RAG 证据闭环的前置。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n反思靠 rubric、证据与上限，不靠“再想想”。\n<\/li><li>\n工具 schema 越窄越可靠，错误要可读、可重试。\n<\/li><li>\n计划每步有验收条件，假设显式记录，失效即重规划。\n<\/ul>", "kind": "chapter", "title": "第 4–6 章：反思、工具调用与规划（自我改进三模式）"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.110<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 4–6 章：反思、工具调用与规划（自我改进三模式）<\/a><\/span><\/div><h1>第 8、10、14 章：记忆管理、MCP 与知识检索（上下文层）<\/h1>\n<blockquote>对应原书第 8 章《Memory Management》、第 10 章《Model Context Protocol》、第 14 章《Knowledge Retrieval (RAG)》（PDF 第 110–188 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1–2 章的编排与反馈模式\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分工作记忆、长期记忆与外部知识库，写出各自的写入与召回策略；\n<\/li><li>\n设计带切块、混合检索、重排与引用的 RAG 流程；\n<\/li><li>\n说明 MCP 标准化的是什么、不解决什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>模型本身没有记忆，所谓“记住”都是<strong>把相关信息重新放进上下文<\/strong>；记忆管理决定什么该存、什么该取、什么该忘，检索链路决定材料能否干净地到达模型。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>记忆分层<\/h3>\n<ul><li>\n<strong>工作记忆（短期/上下文记忆）<\/strong>：当前对话窗口内的近期消息与产物，容量有限，随会话消失；长上下文窗口只是扩大了这一层（PDF 第 110 页）。\n<\/li><li>\n<strong>长期记忆<\/strong>：向量库或数据库，跨会话保存，需要写入策略与召回策略；按语义相似度召回，再注入短期上下文使用（PDF 第 110 页）。\n<\/li><li>\n<strong>外部知识<\/strong>：文档库、API、业务数据库，按需检索，不进入模型参数。\n<\/ul>\n<p>写入长期记忆前要过滤：只存稳定偏好与长期事实，不存一次性任务指令，否则记忆被污染；旧记忆还要有时效标注，避免覆盖新事实。<\/p>\n<h3>概念 2：RAG（检索增强生成，c07）<\/h3>\n<p>流程：切块 → 建索引 → 查询改写 → 召回 → 重排 → 拼接进上下文 → 生成并标注引用。检索主路径是向量语义近邻，BM25 关键词算法擅长专有名词与型号字面匹配，工程上常用两路混合检索。常见失败不在生成而在检索：切块切断语义、查询与文档用词不一致、召回太多稀释重点。对策：小块加重叠、混合检索、重排后只留 top-k。详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。<\/p>\n<h3>MCP（模型上下文协议）<\/h3>\n<p>MCP 是一套开放标准，用于标准化模型发现、连接和使用外部能力的方式：工具、资源、提示模板用统一协议暴露，客户端不必为每个服务写一套适配；它采用客户端—服务器模型组织信息流（PDF 第 138、140 页）。MCP 解决连接方式的碎片化，不解决工具本身的质量与参数合理性。<\/p>\n<h2>完整推导 1：RAG 召回—重排—注入链路推演<\/h2>\n<p>入库推演：文档按章节、段落或句子切块，分片转向量写入向量库，关键词索引同步建立；切块过碎丢失主语与背景，过整则语义混杂、距离被稀释。<\/p>\n<p>查询推演：问题先做规范化或改写，再转向量；查询与文档措辞脱节时关键词路径漏召，语义检索负责跨说法匹配。<\/p>\n<p>召回推演：向量路径取语义近邻，BM25 路径取字面命中，两路融合去重；召回阶段宁可多取候选，避免一开始漏掉相关分片。<\/p>\n<p>重排推演：候选按综合相关度排序，套距离阈值与 top-k 上限；书中实现以 <code>SIMILARITY_TOP_K<\/code> 控制召回条数、<code>VECTOR_DISTANCE_THRESHOLD<\/code> 限制语义距离上限（PDF 第 183 页）。低于阈值的分片不进上下文，这一步控制注入噪声。<\/p>\n<p>注入与生成推演：入选片段连同出处拼入提示模板，模型基于材料作答并逐条引用。证据分散在多个分片或多篇文档时，检索器可能没集齐必要上下文，答案不完整；材料未召到时系统应明示，而不是补全细节。<\/p>\n<h2>完整推导 2：记忆写入与召回策略推演<\/h2>\n<p>写入推演：一条信息进入长期记忆前，先判断稳定性——一次性指令、临时变量不入库；稳定偏好、长期事实入库，并标注来源与时间。写入过滤缺失会让旧指令反复干扰后续会话。<\/p>\n<p>召回推演：需要信息时先查长期记忆，按语义相似度取相关条目，注入工作记忆参与当前作答；召回结果同样要走相关度筛选，不能把整段历史记录塞进上下文。<\/p>\n<p>分层边界推演：工作记忆装当前会话所需，长期记忆装跨会话沉淀，外部知识装原始文档与业务数据。三类信息更新方式不同：会话结束工作记忆清空，长期记忆周期性整理，外部知识库随源文档同步。上下文窗口扩大只抬高工作记忆容量，不替代检索；无关内容越多，模型越容易抓错重点。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\nQ[问题] --&gt; R[查询改写]\nR --&gt; S[混合检索]\nS --&gt; RR[重排 top-k]\nRR --&gt; C[上下文]\nC --&gt; L[生成 + 引用]\nL --&gt; M[(长期记忆)]\nM --&gt; C<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：检索与记忆都只是“往上下文里放材料”；放错材料，再强的模型也只能基于错误材料回答。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：开卷考试。书在书包里（外部知识），你只把相关几页摊在桌上（上下文），记在脑子里的公式是参数化知识。\n<\/li><li>\n实例：问“我们公司退货政策第 3 条”，先检索政策文档，命中后把原文片段与链接放进上下文，回答逐条引用；检索不到就明说，而不是凭常识编。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：上下文窗口大就不用检索。<\/strong> 无关内容占满窗口反而稀释重点；检索解决的是材料相关性，不是窗口容量。\n<\/li><li>\n<strong>误解：存进向量库就叫记忆。<\/strong> 没有召回策略与时效标注，旧记忆会覆盖新事实；记忆等于写入策略加召回策略加遗忘策略。\n<\/li><li>\n<strong>误解：MCP 提升了工具能力。<\/strong> 它统一连接方式，工具本身的描述质量、参数合理性仍需单独设计。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n长期记忆最适合存什么？（答案：稳定偏好、长期事实；不存一次性任务指令。）\n<\/li><li>\nRAG 最常见的失败环节？（答案：检索与切块，而不是生成。）\n<\/li><li>\nMCP 标准化了什么？（答案：模型与外部工具/资源/提示的连接方式。）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>反事实一：去掉 RAG 的重排阈值与 top-k 限制。召回候选全部注入上下文，材料 token 随候选数膨胀，无关分片引入噪声并可能给出互相矛盾的依据；推演上，模型抓重点的能力被材料数量抵消，回答质量随噪声上升而下降。<\/p>\n<p>反事实二：把长期记忆当成完整聊天记录存档。一次性指令与临时变量入库后，后续会话被过期上下文干扰；没有遗忘与时效标注，旧事实覆盖新事实。反过来，若完全不做长期记忆，跨会话的稳定偏好每次都要重新告知，个性化无法累积。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章为第 2 章的模式提供材料底座：反思与评审需要 RAG 提供外部证据，工具调用可挂载检索能力，规划中的信息收集步走检索链路。下一章进入系统化层：多智能体分工、人机审批与护栏，会把本章进入上下文的材料与动作纳入角色协议和安全检查。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n记忆 = 写入策略 + 召回策略 + 遗忘策略。\n<\/li><li>\nRAG 先修检索，再谈生成；混合检索、重排阈值、引用标注缺一不可。\n<\/li><li>\nMCP 管连接，不管内容质量。\n<\/ul>", "kind": "chapter", "title": "第 8、10、14 章：记忆管理、MCP 与知识检索（上下文层）"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.97<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 8、10、14 章：记忆管理、MCP 与知识检索（上下文层）<\/a><\/span><\/div><h1>第 7、13、18 章：多智能体协作、人机协作与护栏（系统化收口）<\/h1>\n<blockquote>对应原书第 7 章《Multi-Agent Collaboration》、第 13 章《Human-in-the-Loop》、第 18 章《Guardrails/Safety Patterns》（PDF 第 97–240 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1–3 章的编排、反馈、工具与上下文模式\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断一个任务是否真的需要多智能体，写出角色接口与汇总责任；\n<\/li><li>\n设计人机协作的审批点，明确审批信息应包含什么；\n<\/li><li>\n为智能体系统设置输入、执行、输出三层护栏，并列出评估指标。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>多智能体不是“更多模型”，而是<strong>角色分工 + 通信协议 + 汇总机制<\/strong>；护栏不是事后过滤，而是<strong>在关键动作前后设置可拦截的检查点<\/strong>；人机协作把不可逆动作交给人收口。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：多智能体协作（c08）<\/h3>\n<p>多个独立或半独立智能体围绕共同目标工作，各有角色、对齐的子目标与不同工具/知识库。常见拓扑：顺序交接、并行处理、辩论与共识、层级结构、专家团队、批评者—审阅者（PDF 第 98 页）。收益来自并行与专业化，成本来自通信开销、上下文不一致与责任不清。判断标准：任务能否拆成接口清晰、可独立验收的子任务；不能拆分时，单智能体加工具通常更稳。详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。<\/p>\n<h3>人机协作（Human-in-the-Loop）<\/h3>\n<p>在不可逆动作前设审批：付款、发邮件、删数据、对外发布。审批点要给出“将执行什么、影响范围、如何撤销”，而不是只弹一个“是否继续”。高风险动作、护栏报警与低置信度样本转人工复核；审批点集中在不可逆动作前，避免把用户变成每步都点确认的按钮。<\/p>\n<h3>概念 3：护栏与评估（c09）<\/h3>\n<ul><li>\n<strong>输入护栏<\/strong>：提示注入检测、敏感信息过滤、schema 校验。\n<\/li><li>\n<strong>执行护栏<\/strong>：权限最小化、沙箱、速率限制、危险工具白名单、参数范围校验。\n<\/li><li>\n<strong>输出护栏<\/strong>：事实核查、格式校验、引用完整性、政策遵循复核。\n<\/ul>\n<p>评估指标分三层：任务成功率、过程合规率（是否越权、是否留痕）、成本与延迟。只看成功率会鼓励智能体冒险越权。详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。<\/p>\n<h2>完整推导 1：多智能体分工与通信成本推演<\/h2>\n<p>分工推演：任务按职责、专业或工具边界拆成子任务，每个角色的输入、输出与验收标准写清，工具按角色分管。分工成立的硬前提是子任务接口清晰、可独立验收；接口模糊时，角色间反复澄清、互相等待。<\/p>\n<p>通信推演：角色间消息约定结构，说明谁、做了什么、产物是什么、依据什么；共享状态包含共同目标、已完成项、待办与约束。设协作链经过 <span class=\"katex-inline\">h<\/span> 个角色，每跳传递一份产物；若每跳整包携带上游历史，第 <span class=\"katex-inline\">h<\/span> 跳内容随跳数累加，token 总量明显高于单智能体串行。上下文在多跳转述中还会失真，汇总者需要对照原始材料核验。<\/p>\n<p>汇总推演：指定最终收口角色，并行产物在此合并、去重、消解冲突；批评意见回流给原作者或终审修订。收益是否覆盖成本，取决于拆分处的接口质量；子任务强依赖、接口无法预定义时，拆分后稳定性低于单智能体加工具。<\/p>\n<h2>完整推导 2：三层护栏与评估闭环推演<\/h2>\n<p>输入层推演：请求进入主模型与工具之前，做注入检测、敏感信息过滤与结构校验；不合规请求拒绝、改写或转人工。这一层成本低、拦截早，避免污染上下文与误触发工具。<\/p>\n<p>执行层推演：动作经编排层放行时核对权限边界、参数范围、速率与白名单；危险动作挂审批与回滚，外部调用包超时与退避。这一层拦住“格式合法但越权”的参数，是动作发生前的最后一道闸。<\/p>\n<p>输出层推演：交付前检查事实、格式、引用完整性与政策遵循，可用轻量模型二次复核；动作已不可逆时，文本过滤收不回影响，所以输出层不能替代执行层。<\/p>\n<p>评估闭环推演：构造攻击样例测拦截率，正常样例测误伤率；日志记录输入、判定依据、放行或拦截、动作与输出，统计延迟、成功率、错误类型。拦截率与误伤率此消彼长，阈值松紧按场景风险调整；没有两类样本对照，拦了多少不能直接当作安全成效。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nI[输入] --&gt; G1[输入护栏]\nG1 --&gt; A[智能体执行]\nA --&gt; H{不可逆动作?}\nH --&gt;|是| AP[人工审批]\nH --&gt;|否| G2[执行护栏]\nAP --&gt; G2\nG2 --&gt; O[输出]\nO --&gt; G3[输出护栏]\nG3 --&gt; E[评估与留痕]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：护栏分布在全流程，不是一个末端过滤器；审批点只放在不可逆动作前。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：公司报销。输入检查发票真伪，执行限制额度，超过额度要主管审批，输出核对科目；四道关缺一不可。\n<\/li><li>\n实例：让智能体自动给客户发退款邮件。检索订单→计算金额→人工审批→发送→记录日志；金额超过阈值必须二次审批。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：智能体越多越智能。<\/strong> 角色重叠时互相等待、重复劳动；能力来自接口质量，不来自角色堆叠。\n<\/li><li>\n<strong>误解：加了护栏就一定安全。<\/strong> 护栏要在攻击样例与误报样例上测试，未测的护栏只是心理安慰。\n<\/li><li>\n<strong>误解：审批点越多越稳。<\/strong> 审批集中在不可逆动作前；每步都确认会把用户变成按钮，拖慢流程且稀释关键审批的注意力。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n什么任务不适合多智能体？（答案：子任务接口不清、强顺序依赖、单模型加工具即可完成。）\n<\/li><li>\n审批点应设在哪里？（答案：不可逆、高风险、对外产生实际影响的动作前。）\n<\/li><li>\n评估为什么不能只看成功率？（答案：会鼓励冒险与越权，忽略合规、成本与延迟。）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>反事实一：去掉执行层护栏，只保留末端内容过滤。工具已被调用、数据已被删除之后，输出层文本检查无法收回动作；越权参数在编排层无人核对，风险直达外部系统。补上执行层后，越权请求在动作发生前被拒绝并回传可读信息。<\/p>\n<p>反事实二：把接口不清的任务强行拆成多智能体。角色之间引用格式与责任边界未约定，汇合时证据与主张对不上，通信反复对齐；推演上，协调成本超过单智能体加工具的方案，稳定性反而下降。反过来，若子任务可独立验收、工具可分管，专业化与并行收益才能覆盖通信开销。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章收口前 three 章：链式、路由、并行提供编排骨架，反思与工具提供反馈和动作通道，记忆与 RAG 提供材料底座；本章把这些构件放进角色协议、人工审批与安全检查之下。多智能体复用规划分解与并行聚合，护栏约束工具权限与输出，人机协作承接护栏升级的高风险决策。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n多智能体看接口，不看数量；角色、通信协议、汇总责任三要素齐备。\n<\/li><li>\n审批点 = 不可逆动作前，附影响范围与撤销方式。\n<\/li><li>\n护栏三层：输入、执行、输出；评估三层：效果、合规、成本与延迟。\n<\/ul>", "kind": "chapter", "title": "第 7、13、18 章：多智能体协作、人机协作与护栏（系统化收口）"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.27<\/div><h1>提示链（Prompt Chaining）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章 | <strong>原书位置<\/strong>：第 1 章《Prompt Chaining》（PDF 第 27 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>单条提示要同时承担分析、提炼、生成多种职责时，模型容易在多重约束之间顾此失彼。原书把这类失败归为五类：指令忽视（提示中的部分要求被漏掉）、上下文漂移（偏离最初语境）、错误传播（前期错误被后续步骤放大）、长上下文信息不足、以及认知负荷升高后幻觉概率上升（PDF 第 27–28 页）。书中给的例子是一条提示同时要求分析市场调研报告、总结发现、提炼带数据支撑的趋势并起草邮件，结果摘要做得不错，却提取不到数据，邮件也写不好。<\/p>\n<p>不用链式会出现什么错误？把所有子任务压在一次生成里，中间没有可检查的产物，出错时无法判断是哪一步偏离了要求；模型只能给出一个最终文本，工程侧既无法拦截错误，也无法针对某一步单独优化。提示链要解决的具体困难，就是把一次大生成拆成一串小生成，让每一步的输入、输出和校验点都可见、可替换。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：提示链（有时也称流水线 Pipeline 模式）把复杂问题拆成一系列更小、更易处理的子问题，每个子问题由专门设计的提示分别处理，前一步生成的结果作为下一步的输入（PDF 第 27 页）。逐句拆开：<\/p>\n<ul><li>\n“拆成一系列子问题”：任务被切成有序的步骤，每一步只聚焦一个侧面；书中在每个阶段为模型分配不同角色，例如市场分析师、行业分析师、文档写作者（PDF 第 28 页）。\n<\/li><li>\n“专门设计的提示”：每一步的提示只带本步骤需要的约束，不把整条任务的要求重复一遍。\n<\/li><li>\n“前一步结果作为下一步输入”：步骤之间存在依赖链，先前步骤的上下文与结果引导后续处理，这也是“链”这个名字的由来（PDF 第 27 页）。\n<\/li><li>\n“结构化输出”：步骤间传递的数据要约定 JSON、XML 等可解析格式；输出含糊或格式混乱时，下一步会因输入不当而失败（PDF 第 28–29 页）。\n<\/ul>\n<p>正例：会议纪要先抽取决议条目，再据决议生成待办，最后按负责人分派，三步顺序固定、产物可解析。反例：让一条提示既读会议录音转写稿、又判断决议有效性、又直接发出分派邮件，中间没有任何结构化中间产物。<\/p>\n<h2>原理推导<\/h2>\n<p>链式的可靠性来自三条可逐步验证的机制。<\/p>\n<p>第一条机制是认知负荷下降。一次生成要同时满足的约束越多，模型在每一步分配给各约束的注意力越分散。拆步之后，单步提示只保留本步骤的目标与输入，模型在较小的约束集合内作答，出错面随之缩小。这一步用到的假设是：模型在单步内可处理的约束数量有限，约束越多遗漏概率越高；原书把指令忽视与上下文漂移列为单提示的典型失败，正是这条假设的经验证据（PDF 第 27–28 页）。<\/p>\n<p>第二条机制是状态传递与依赖链。设步骤序列为 <span class=\"katex-inline\">S_1, S_2, \\ldots, S_n<\/span>，第 <span class=\"katex-inline\">i<\/span> 步的输入由两部分组成：本步骤提示模板 <span class=\"katex-inline\">P_i<\/span>，以及上一步产物 <span class=\"katex-inline\">O_{i-1}<\/span>；第 <span class=\"katex-inline\">i<\/span> 步输出 <span class=\"katex-inline\">O_i = f_i(P_i, O_{i-1})<\/span>。链条的状态不是整段对话历史原样搬运，而是上一步经过结构化整理后的产物。原书要求步骤间用 JSON 或 XML 传递，目的就是让 <span class=\"katex-inline\">O_{i-1}<\/span> 可被程序解析、可被校验，而不是再让下一步靠自然语言理解去猜（PDF 第 28–29 页）。<\/p>\n<p>第三条机制是逐步校验带来的错误拦截。每一步产物在进入下一步之前，可以由程序规则或另一次模型调用检查格式、字段完整性与事实一致性；校验不通过就停在当前步，不把错误送进下游。原书的三步示例中，趋势识别步的输出被约束为带 <code>trend_name<\/code> 与 <code>supporting_data<\/code> 字段的 JSON 对象（PDF 第 28 页），程序可以直接检查这两个字段是否存在。<\/p>\n<p>把三条机制合起来：拆步降低单步负荷，结构化状态让步骤间接口确定，逐步校验把错误拦在局部。链条越长，失败点数量也越多，因此链式的优化方向不是堆步骤，而是把能合并的步骤合并、把必须独立校验的步骤保留。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>链式成立的条件有三条。其一，子步骤之间顺序固定、依赖关系明确，上一步产物是下一步的必要输入。其二，每一步的产物可以写成可检查的格式，便于程序或规则校验。其三，任务可以被预先拆出稳定步骤，不需要在执行中反复探索新路径。<\/p>\n<p>边界情况：任务路径事先不清楚、需要边做边判断下一步做什么时，固定链条会把模型锁死在预设顺序里，这类任务属于规划模式（见 c06）。步骤之间强耦合、拆开后信息必然丢失时，硬拆链条反而增加返工；此时应先评估拆分是否保住了必要上下文。链条中某一步需要外部实时信息时，该步可以接入工具调用（见 c05），但工具失败不能被链条的下游步骤自行消化。<\/p>\n<p>条件去掉会怎样：去掉结构化输出要求，步骤接口退回自由文本，下一步必须重新理解上一步的措辞，格式错误会沿链条放大；去掉逐步校验，早期错误直接进入最终生成，错误传播失去拦截点。<\/p>\n<h2>反例<\/h2>\n<p>书中记录的单提示失败案例：一条请求同时要求分析市场调研报告、总结发现、提炼带数据点的趋势并起草邮件，模型摘要尚可，但数据提取与邮件撰写都失败（PDF 第 28 页）。这个案例说明，把信息提炼、证据抽取、文体生成压在一次调用里，任何一个侧面都拿不到足够的注意力。<\/p>\n<p>另一个反例来自工程实践：链条上某步返回的自然语言段落没有约定字段，下一步要从中“自己找”负责人和截止时间，结果负责人被漏抽，待办分派空转。问题不在模型能力，而在步骤间接口没有结构化。<\/p>\n<h2>辨析<\/h2>\n<p>与路由（c02）的差别在决策位置：链式是固定顺序，路线在任务开始前已经确定；路由是先分类再分派到不同分支，分支选择发生在运行时。链式回答“按什么顺序做”，路由回答“走哪条分支做”。<\/p>\n<p>与并行化（c03）的差别在依赖方向：链式步骤之间有数据依赖，必须排队执行；并行化的子任务相互独立，可以同时开工，最后在汇总点合并。<\/p>\n<p>与反思（c04）的差别在控制流方向：链式是单向推进，产物交给下游；反思是反馈环，产物回到生成者接受批评后再修订。一个任务可以外层走链、内层在某一步挂反思循环。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：调用一次 LLM 并解析其文本输出的基本工程能力。后继：链式是路由分支内部的执行方式，也是规划模式把计划落成执行序列的底座；工具调用（c05）可以挂在链条的任意一步上补充外部信息；反思（c04）可以作为链条中单步的质量关卡。本概念把“分而治之”的任务拆解思路与步骤间的状态传递机制串在一起，是全书编排类模式的第一条基础链路。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（提示链）<\/summary><div class=\"depth-body\"><h1>提示链（Prompt Chaining）· 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要把链式模式推到可落地，先逐级倒查它依赖什么，每一层不成立会让上层在哪里断掉：<\/p>\n<ol><li>\n“每步产物可校验”依赖产物格式确定：步骤间传递的必须是可解析的结构化数据（JSON、XML、字段清单）。如果产物是混合自然语言，程序无法定位字段，校验规则无从写起。\n<\/li><li>\n“结构化数据可解析”依赖单步提示只要求一类输出。一步同时要摘要、抽取、成稿，输出天然是几段性质不同的文本，落不进固定 schema；所以拆步先于格式约定。\n<\/li><li>\n“单步只做一类事”依赖任务可被拆成有序子问题。子问题之间有明确先后，上一步产物是下一步的必要输入；若子任务可以同时开工，那属于并行化（c03），不是链。\n<\/li><li>\n“任务可拆分”再往前依赖一个观察：复合任务的失败集中在多约束顾此失彼，而不是模型完全不具备单项能力。原书记录的市场报告案例就是摘要尚可、数据提取与邮件撰写失败（PDF 第 28 页），说明单项能力在，缺的是分步承载。\n<\/li><li>\n最底层假设：模型在较小约束集合内作答时，遗漏概率低于在大约束集合内作答。这条假设是工程经验观察，原书用指令忽视、上下文漂移、错误传播、信息不足、幻觉五类单提示失败现象作为支撑（PDF 第 27–28 页）。\n<\/li><li>\n再往下还需要一条工程前提：步骤产物可以被程序读取与拦截，而不是只在对话流里存在；否则即便格式确定，也没有位置挂校验。\n<\/ol>\n<p>逆推到读者基线：先认“一次调用只能拿到一份文本”，再认“文本可以约定格式”，最后认“格式确定后步骤才能排队校验”。任一层前提不满足，链式就要先补工程条件，而不是直接套模式。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条分四步，每步写清用了哪条假设与保留限定：<\/p>\n<ul><li>\n第一步，观察单提示失败。复合请求同时携带分析、提炼、生成多重约束，模型在约束间分配注意力，出现指令忽视、上下文漂移、错误传播、长上下文信息不足与认知负荷升高后幻觉五类问题（PDF 第 27–28 页）。用到的假设：约束数量与遗漏概率同向变化；如果这条假设不成立，拆步就不会改善遗漏率。\n<\/li><li>\n第二步，拆步。把任务写成序列 <span class=\"katex-inline\">S_1, S_2, \\ldots, S_n<\/span>，第 <span class=\"katex-inline\">i<\/span> 步提示模板 <span class=\"katex-inline\">P_i<\/span> 只保留本步骤目标；第 <span class=\"katex-inline\">i<\/span> 步输出 <span class=\"katex-inline\">O_i = f_i(P_i, O_{i-1})<\/span>，其中 <span class=\"katex-inline\">O_0<\/span> 为原始材料。用到的假设：子任务可独立表述，且子任务之间的信息能通过 <span class=\"katex-inline\">O_{i-1}<\/span> 完整传递；若拆开后必要上下文留在被丢弃的原始文本里，第二步就立不住。\n<\/li><li>\n第三步，固定步骤接口。要求 <span class=\"katex-inline\">O_i<\/span> 按约定 schema 输出，程序在 <span class=\"katex-inline\">O_i<\/span> 进入 <span class=\"katex-inline\">O_{i+1}<\/span> 前检查字段类型、完整性与取值范围；检查不通过就停在当前步，不向下游送错数据。用到的假设：格式错误可以被规则识别，不依赖模型自觉；语义层面的错误规则识别不了，仍需另设批评或证据校验。\n<\/li><li>\n第四步，逐步校验落地。原书趋势识别步的输出含 <code>trend_name<\/code> 与 <code>supporting_data<\/code> 字段（PDF 第 28 页），程序可直接核对这两个字段；缺字段即拦截。链条末端才是面向用户的最终生成步，中间产物不直接暴露给终端。\n<\/ul>\n<p>限定条件拆解：<\/p>\n<ul><li>\n史料：原书三步示例为总结、趋势识别、邮件撰写，每步分配不同角色（市场分析师、行业分析师、文档写作者）（PDF 第 28 页）。\n<\/li><li>\n推断：角色分工的作用是收窄单步提示的立场与语气，不是给模型附加新知识；这一解释是读者基于机制做的推断，原书未把角色与能力提升直接划等号。\n<\/li><li>\n必然还是偶然：拆步降低遗漏是机制推论，但具体拆成几步取决于任务结构，不存在“三步最优”的固定答案。\n<\/ul>\n<p>推导保留的限定：拆步不能消除上游错误，只能把错误拦在局部；步骤越多失败点越多，能合并的步骤应合并。状态传递若丢失必要上下文，下游只能在残缺输入上作答。<\/p>\n<p>补充一步关于步骤合并的判断：两个相邻步骤若共享同一套输入材料、产物无需被独立校验，合并成一步能减少一次模型往返与一次格式交接；若产物需要独立检查（例如抽取结果要先核对字段再生成），则必须保留独立步骤。判断依据是“中间产物是否需要单独拦截”，而不是步骤数量本身。<\/p>\n<h2>机制逐项对照<\/h2>\n<p>把链式放到全书编排模式中对照，差别落在控制流、依赖方向与失败位置三点：<\/p>\n<ul><li>\n控制流：链式在任务开始前确定顺序，运行时不做分支选择；路由在运行时按分类结果选分支；并行在同一时刻启动多条独立支线。链式回答“先做哪步后做哪步”，路由回答“进哪条分支”，并行回答“哪些可以同时开工”。\n<\/li><li>\n依赖方向：链式后一步依赖前一步产物；并行子任务之间不共享可变状态；路由分支之间互斥，不传递产物。\n<\/li><li>\n失败位置：链式的失败点分布在每一步的产物上，可逐步拦截；路由的失败集中在分类环节，分错则整条分支走偏；并行的失败集中在聚合环节，冲突未消解则结果并列矛盾。\n<\/li><li>\n与反思的衔接：链式是单向推进，产物交给下游；反思把产物退回生成者形成闭环。实践中常见的组合是外层一条链，在质量要求高的步骤挂一个反思关卡，批评通过后再交下游。\n<\/ul>\n<h2>算例：会议纪要转待办<\/h2>\n<p>估算口径（工程估算，非原书测量值）：每步系统提示约 700 输入 token，材料与上一步产物另计；单步输出约 250 token；模型按 50 token/s 生成，网络往返约 300 ms；以下数字用于比较步数与量级，不代表某一具体模型的实测值。<\/p>\n<p>任务：把一份会议纪要转成按负责人分派的待办清单。<\/p>\n<p>第 1 步，抽取决议条目。<\/p>\n<ul><li>\n输入：系统提示“从纪要中抽取决议条目，每条含决议内容、负责人、截止时间，输出 JSON 数组”；纪要正文约 1200 token。\n<\/li><li>\n输出：JSON 数组，例如 <code>[{&quot;decision&quot;:&quot;Q3 上线内测&quot;,&quot;owner&quot;:&quot;王某&quot;,&quot;due&quot;:&quot;2026-09-15&quot;}]<\/code>，约 220 token。\n<\/li><li>\n代价：输入约 1900 token（700 提示 + 1200 纪要），输出约 220 token；生成约 4.4 秒，加往返约 4.7 秒。\n<\/li><li>\n校验：程序检查每条是否含三个必填字段；缺 <code>due<\/code> 即退回本步补抽，不进入第 2 步。\n<\/ul>\n<p>第 2 步，生成待办描述。<\/p>\n<ul><li>\n输入：系统提示“把每条决议改写成一句可执行待办，保留负责人与截止时间”；上一步 JSON 约 220 token。\n<\/li><li>\n输出：待办条目清单，约 260 token。\n<\/li><li>\n代价：输入约 920 token，输出约 260 token；生成约 5.2 秒，加往返约 5.5 秒。\n<\/li><li>\n校验：核对待办条数与第 1 步条目数一致；条数不一致说明发生合并或漏抽，退回第 1 步。\n<\/ul>\n<p>第 3 步，按负责人分派排序并成稿。<\/p>\n<ul><li>\n输入：系统提示“按负责人分组输出最终待办表”；第 2 步清单约 260 token。\n<\/li><li>\n输出：分组待办表，约 300 token。\n<\/li><li>\n代价：输入约 960 token，输出约 300 token；生成约 6 秒，加往返约 6.3 秒。\n<\/ul>\n<p>量级对照（估算口径同上）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>步骤<\/th><th>输入 token<\/th><th>输出 token<\/th><th>生成耗时<\/th><th>加往返<\/th><\/tr><\/thead><tbody><tr><td>1 抽取决议<\/td><td>约 1900<\/td><td>约 220<\/td><td>约 4.4 s<\/td><td>约 4.7 s<\/td><\/tr><tr><td>2 生成待办<\/td><td>约 920<\/td><td>约 260<\/td><td>约 5.2 s<\/td><td>约 5.5 s<\/td><\/tr><tr><td>3 分派成稿<\/td><td>约 960<\/td><td>约 300<\/td><td>约 6.0 s<\/td><td>约 6.3 s<\/td><\/tr><tr><td>合计<\/td><td>约 3780<\/td><td>约 780<\/td><td>约 15.6 s<\/td><td>约 16.5 s<\/td><\/tr><\/tbody><\/table><\/div>\n<p>若压成单条提示一次性完成，输入约 1900 token、输出约 350 token，token 与延迟更低，但纪要稍长就会漏字段；链式用多出来的 token 与时间换取每步可检查、出错可定位。失败分支：第 1 步抽不出负责人，按校验规则退回补抽一次，补抽一次的代价是第 1 步输入再加约 220 token 反馈意见、输出再约 200 token；仍缺失则标记为“待人工确认”，而不是让第 2 步编一个负责人。<\/p>\n<p>再做一次敏感性推算：若纪要从 1200 token 涨到 3000 token，单步方案的输入约束被材料撑大，漏抽概率进一步上升；链式第 1 步仍只承担抽取职责，第 2、3 步输入不受原始材料长度影响，膨胀被限制在第一步。这是链式在长材料上的结构性优势：上下文增长集中在固定步骤，而不是摊到整条链的每一步。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：步骤接口退回自由文本，第 2 步要从上一步段落里自己找负责人和截止时间，格式错误沿链放大。反例二：链条中某一步需要外部实时信息却没接工具，只能在过期上下文里推断。边界条件：任务路径可预先固定、产物可结构化时链式有效；需要现场探索路径的任务应交给规划（c06）；子任务无依赖时优先考虑并行（c03）。<\/p>\n<h2>延伸推演：链条长度与错误传播<\/h2>\n<p>链条每增加一步，失败点数量随之增加。设单步出错概率为 <span class=\"katex-inline\">p<\/span>，<span class=\"katex-inline\">n<\/span> 步串联且错误沿链传播时，整条链不出错的概率量级约为 <span class=\"katex-inline\">(1-p)^n<\/span>；<span class=\"katex-inline\">n<\/span> 越大，任一步出错的累积概率越高。这不是说拆步有害，而是说明链式的优化方向是控制步数：能合并的相邻步骤合并，必须独立校验的步骤保留。每一步的校验拦截把局部错误挡在当前步，避免它进入下游放大。<\/p>\n<p>错误传播的方向值得分清。上游产物缺字段，下游在残缺输入上作答，偏差被继承；上游格式混乱，下游要重新理解措辞，引入二次误解。结构化输出与逐步校验正是针对这两类传播：前者固定接口，后者提前拦截。链条中某一步需要外部信息时，该步接工具调用；工具失败不能由下游步骤自行消化，应在本步返回可读错误。<\/p>\n<p>链式与其他模式的组合边界：外层走链、内层在质量关卡挂反思；分支选择前置给路由；独立子任务从链中拆出走并行。判断一个任务落在哪种结构，先看步骤是否固定有序，再看是否存在分支选择与独立支线。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：链越长效果越好。<\/strong> 反证：每增加一步就多一个失败点，且步骤间传递会损失上下文；能合并的步骤合并后，单步提示仍在可承受约束范围内。原书三步示例本身就是最小必要拆分（PDF 第 28 页）。\n<\/li><li>\n<strong>误读：中间产物可以不校验，模型自己会传对。<\/strong> 反证：上一步格式混乱时，下一步要靠自然语言猜字段，格式错误沿链条放大；原书把结构化输出列为稳健多步系统的关键一环（PDF 第 28–29 页）。\n<\/li><li>\n<strong>误读：链式适合需要来回探索的任务。<\/strong> 反证：链式路线预先固定，遇到路径不明、需要现场判断下一步做什么的任务会被锁死；这类任务应走规划模式（c06）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n链式的“依赖链”具体指哪一步产物成为哪一步输入？如果去掉结构化格式，这条链在哪里最先断裂？\n<\/li><li>\n单提示五类失败中，哪几类是拆步可以缓解的，哪几类拆步后仍然存在？\n<\/li><li>\n写一条三步链，标出每步的输入字段、输出 schema 与校验规则。\n<\/li><li>\n为什么说链式买的是“可检查性”而不是“更少 token”？用算例的 token 量级说明。\n<\/li><li>\n子任务之间强耦合、拆开必然丢信息时，硬拆链条会出现什么后果？应改用什么模式？\n<\/ol>\n<h2>第二个任务的端到端算例：合同审阅→风险摘要→邮件草稿<\/h2>\n<p>估算口径（工程估算，非原书实测）：中文按约 1.6 字符/token 折算（即 1 token ≈ 1.6 个汉字），英文与代码按约 4 字符/token；生成速度按 50 token/s，网络往返约 300 ms；上下文窗口按 32768 token 估算占用比例。<\/p>\n<p>任务：把一份采购合同走完「条款抽取 → 风险摘要 → 对外邮件草稿」三步链。<\/p>\n<p>第 1 步，条款抽取。<\/p>\n<ul><li>\n提示骨架：系统提示要求抽取编号、原文摘录、类别三类字段，输出 JSON 数组，提示约 240 汉字 ≈ 150 token。\n<\/li><li>\n输入：合同正文约 4800 汉字 ≈ 3000 token；输入合计约 3150 token，占窗口约 9.6%。\n<\/li><li>\n输出：条款清单 JSON，约 600 汉字 ≈ 375 token；生成约 7.5 s，加往返约 7.8 s。\n<\/li><li>\n校验：程序逐条核对三个必填字段；缺“原文摘录”即退回本步补抽，不进入第 2 步。\n<\/ul>\n<p>第 2 步，风险摘要。<\/p>\n<ul><li>\n输入：上一步 JSON 约 375 token，风险判定提示约 180 token，合计约 555 token。\n<\/li><li>\n输出：风险条目（每条挂条款编号与风险点）约 450 汉字 ≈ 280 token；生成约 5.6 s，加往返约 5.9 s。\n<\/li><li>\n校验：每条风险必须回挂第 1 步的条款编号；挂不上编号的条目标记“待法务复核”，不进入邮件步。\n<\/ul>\n<p>第 3 步，邮件草稿。<\/p>\n<ul><li>\n输入：风险摘要约 280 token，邮件撰写提示约 200 token，合计约 480 token。\n<\/li><li>\n输出：对外沟通邮件约 350 汉字 ≈ 220 token；生成约 4.4 s，加往返约 4.7 s。\n<\/ul>\n<p>量级汇总（估算口径同上）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>步骤<\/th><th>输入 token<\/th><th>输出 token<\/th><th>生成耗时<\/th><th>加往返<\/th><\/tr><\/thead><tbody><tr><td>1 条款抽取<\/td><td>约 3150<\/td><td>约 375<\/td><td>约 7.5 s<\/td><td>约 7.8 s<\/td><\/tr><tr><td>2 风险摘要<\/td><td>约 555<\/td><td>约 280<\/td><td>约 5.6 s<\/td><td>约 5.9 s<\/td><\/tr><tr><td>3 邮件草稿<\/td><td>约 480<\/td><td>约 220<\/td><td>约 4.4 s<\/td><td>约 4.7 s<\/td><\/tr><tr><td>合计<\/td><td>约 4185<\/td><td>约 875<\/td><td>约 17.5 s<\/td><td>约 18.4 s<\/td><\/tr><\/tbody><\/table><\/div>\n<p>失败分支：第 1 步某条款缺失字段，退回补抽一次，补抽输入再加约 200 token 反馈意见、输出再约 180 token；两轮仍缺失则在产物中标注缺口，第 2 步不得为缺口补造条款。链条最大输入出现在第 1 步，原始合同长度膨胀被限制在这一步，后两步输入不随合同页数线性增长。<\/p>\n<h2>前提再拆一层<\/h2>\n<p>链式能成立，除正文已述的“任务可拆、接口结构化”外，还依赖以下几条隐含前提；逐条抽掉后给出故障场景与可观测指标。<\/p>\n<ol><li>\n<strong>模型在单步窄约束下指令跟随可靠。<\/strong> 抽掉后：一步同时要求抽取、判断、成稿，提示要求被漏掉，字段缺失率上升。可观测指标：单步字段完整率、被忽视的指令条数、退回补抽次数。\n<\/li><li>\n<strong>步骤间传递的信息足以支撑下游作答。<\/strong> 抽掉后：必要上下文留在被丢弃的原始材料里，下游在残缺输入上推断，结论偏离原意。可观测指标：下游引用上游字段的命中率、人工标注的上下文缺失条数。\n<\/li><li>\n<strong>产物格式可被规则解析。<\/strong> 抽掉后：上一步输出是混合段落，程序定位不到字段，校验规则挂不上。可观测指标：schema 解析成功率、格式错误拦截数。\n<\/li><li>\n<strong>任务路径可在运行前固定。<\/strong> 抽掉后：现场需要探索路线时，链条被锁死在预先写定的顺序上，中途转向无入口。可观测指标：运行时临时分支请求占比、中途被迫重规划次数。\n<\/li><li>\n<strong>每步产物可独立校验。<\/strong> 抽掉后：错误沿链传到末端才暴露，定位不到是哪一步偏离。可观测指标：各步拦截率、末端交付后返工条数。\n<\/li><li>\n<strong>上下文容量装得下单步材料。<\/strong> 抽掉后：长合同在输入侧被截断，抽取遗漏随篇幅上升。可观测指标：单步输入 token 占窗口比例、截断告警次数。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "提示链"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.40<\/div><h1>路由（Routing）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章 | <strong>原书位置<\/strong>：第 2 章《Routing》（PDF 第 40 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>真实系统收到的请求不是一种类型：客服场景里有查订单、问产品、报故障、意图含糊的咨询；不同类型需要不同的提示词、模型与工具组合。如果把所有请求塞进同一条固定流程，简单问题被复杂化，专业问题又被做浅。链式模式只能沿预定顺序推进，在需要根据输入条件动态选择分支的场景下适用性受限（PDF 第 40 页）。<\/p>\n<p>路由要解决的具体困难是：在执行任何专门处理之前，先判断请求属于哪一类，再把它导向对应的专用函数、工具或子流程。没有这一层，系统无法从固定执行路径切换到按条件选择的路径；而分类一旦出错，下游整条分支都在错误方向上消耗成本。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：路由在智能体运行框架中引入条件逻辑，使系统从固定执行路径转向根据特定标准动态评估、从一组候选后续动作中选择其一执行（PDF 第 40 页）。逐句拆开：<\/p>\n<ul><li>\n“条件逻辑”：分支选择依据环境状态、用户输入或前一步操作结果，而不是写死的顺序。\n<\/li><li>\n“一组候选后续动作”：候选可以是专门的问答智能体、数据库检索工具、排障指南链路或升级人工流程（PDF 第 40 页）。\n<\/li><li>\n“先分类再分派”：书中客服示例先分析查询、判断意图，再按“订单状态 / 产品信息 / 技术支持 / 意图不明”分别路由；意图不明时进入澄清链路（PDF 第 40 页）。\n<\/li><li>\n“评估机制”：路由的核心是一个负责评估并引导控制流的部件，原书列出四种实现：基于 LLM、基于嵌入、基于规则、基于训练好的判别式分类模型（PDF 第 41 页）。\n<\/ul>\n<p>正例：用户说“我的包裹到哪了”，分类为订单状态，进入订单数据库链路；用户说“这个零件兼容哪款型号”，分类为产品信息，进入产品目录检索；措辞含糊时进入追问分支。反例：不做分类，所有问题都走同一条长提示，既查订单又查目录又给排障建议。<\/p>\n<h2>原理推导<\/h2>\n<p>路由机制可以拆成分类、置信度判断、分派、兜底四个环节逐步推导。<\/p>\n<p>环节一：分类。评估机制把输入映射到一组互斥标签。四种实现的差别在判断依据：基于规则的路由用 if-else、switch 匹配关键词、模式或结构化数据，快且确定，但对细微差别和全新输入灵活性弱；基于嵌入的路由把查询转向量，与各路径对应的嵌入做相似度比较，适合按语义分流；基于 LLM 的路由直接让模型输出类别标识符；基于机器学习模型的路由用少量标注语料监督微调出专用分类器，决策逻辑编码在模型权重里，推理时不再跑生成式提示（PDF 第 41 页）。<\/p>\n<p>环节二：置信度判断。分类输出不能只看命中的标签，还要看分类把握。LLM 路由可以要求模型给出类别与把握程度；规则路由在关键词只部分命中时记为低把握；嵌入路由用相似度距离与阈值比较。把握低于阈值的请求，不强行分派，进入兜底。这一步用到的假设是：存在边界样本，任何分类器都会把它们分错，而错误分派的代价高于暂缓处理。<\/p>\n<p>环节三：分派。拿到确定标签后，控制流进入对应分支；每个分支内部可以是一条提示链（c01）、一组工具调用（c05）或一个子智能体。路由本身只负责“送到哪里”，不负责分支内部怎么做。<\/p>\n<p>环节四：失败回退。兜底分支承担三类情况：意图不明、置信度不足、标签集合覆盖不到。书中客服示例把“意图不明确”路由到澄清智能体或提示链，先反问补全信息（PDF 第 40 页）。回退分支保证分类失败时系统不会卡死或误派。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>路由适用的前提：候选分支之间处理方式差异明显，分类标准可以被写成标签集合；流量中确实存在多类请求，单条流程无法兼顾。标签设计要求互斥且覆盖真实流量：互斥避免一个请求同时进两条分支，覆盖保证长尾请求有处可去。<\/p>\n<p>边界：请求类别很少、处理流程基本一致时，路由增加一次额外分类调用，收益抵不过开销。类别边界模糊、分类错误代价极高（例如直接触发不可逆动作）时，应把低置信度样本留在人工复核，而不是自动分派。规则路由面对新说法会失效；LLM 路由成本更高、输出格式需要约束；嵌入与微调分类器需要样本与维护成本。<\/p>\n<p>条件去掉会怎样：去掉兜底分支，低置信度请求被硬分到最近标签，错误分派沿分支放大；去掉置信度阈值，分类器在边界样本上的误判直接进入执行；标签不互斥，同一请求触发多条分支，结果互相冲突。<\/p>\n<h2>反例<\/h2>\n<p>只按关键词路由的反例：同一词汇在不同语境下意图不同，例如“退款”既可能是订单售后，也可能是咨询产品退货政策；关键词命中“退款”就派给售后链路，会把政策咨询误带进工单流程。原书也指出规则路由对细微差别和全新输入灵活性较弱（PDF 第 41 页）。<\/p>\n<p>不设兜底的反例：四类标签之外的新问题被默认塞进第一个分支，模型在陌生分支里凑答案，既延误处理又产生误导性回复。<\/p>\n<h2>辨析<\/h2>\n<p>与链式（c01）的差别：链式规定步骤顺序，路由规定分支归属。一个完整系统通常先路由分诊，再在各分支内部走链式流程；路由决定“走哪条链”，链负责“按什么顺序做”。<\/p>\n<p>与并行化（c03）的差别：路由是互斥选择，一个请求只进一条分支；并行是同时启动多条独立子任务，最后合并结果。路由排除其他分支，并行叠加其他分支。<\/p>\n<p>与规划（c06）的差别：路由在有限的预设标签之间做静态选择；规划面向开放目标，需要现场生成行动序列，标签集合事先并未给全。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：单步提示调用与结构化输出解析。后继：路由是并行化分支分派的前置判断，也是多智能体系统中管理者智能体分配任务的简化形态；工具调用（c05）作为各分支可调用的外部能力存在；护栏（c09）可以在路由前后拦截不合规输入。本概念把“条件分支”这一控制流机制与分类置信度、失败回退的工程要求串在一起。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（路由）<\/summary><div class=\"depth-body\"><h1>路由（Routing）· 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>逐级倒查路由机制成立的前提：<\/p>\n<ol><li>\n“分派到正确分支”依赖分类结果可信：标签集合必须互斥，一个请求只对应一个主标签；同时标签要覆盖真实流量，长尾请求有处可去。\n<\/li><li>\n“分类结果可信”依赖分类把握可被判断：系统需要知道分类器是高把握还是边界样本，否则低置信度请求也会被自动分派。\n<\/li><li>\n“置信度可判断”依赖输入特征能映射到标签：规则路由靠关键词与模式，嵌入路由靠语义距离，LLM 路由靠模型理解，分类器靠训练好的判别边界（PDF 第 41 页）。\n<\/li><li>\n“特征可映射”再往前依赖候选分支可枚举：分支清单在设计时确定，路由只是在既有清单里选；开放目标、没有候选清单的任务不适用路由。\n<\/li><li>\n最底层假设：同一类请求的处理方式确实相似，不同类请求的处理方式确实差异明显。如果各类请求走下来是同一套流程，分类就不产生价值。\n<\/li><li>\n工程前提：兜底分支存在且可承接低把握样本；没有兜底，分类失败的代价全部压在自动分派上。\n<\/ol>\n<p>逆推到读者基线：先认“请求可以归成几类”，再认“每类有对应分支”，最后认“拿不准时有地方退回”。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条分四步，每步写清假设：<\/p>\n<ul><li>\n第一步，分类。评估机制把输入映射到互斥标签。原书列出四种实现：基于 LLM 的路由让模型输出类别标识符；基于嵌入的路由把查询转向量，与各路径嵌入比相似度；基于规则的路由用 if-else、switch 匹配关键词、模式或结构化数据；基于机器学习模型的路由用少量标注语料监督微调出判别分类器，决策编码在权重里，推理时不再跑生成提示（PDF 第 41 页）。用到的假设：标签边界在所选实现上可分；规则可分性弱，嵌入与分类器需要样本或向量质量支撑。\n<\/li><li>\n第二步，置信度判断。LLM 路由可要求模型给出类别与把握程度；规则路由在关键词部分命中时记为低把握；嵌入路由用相似度距离对照阈值。把握低于阈值的请求不强行分派。用到的假设：存在边界样本，任何分类器都会误判，而错误分派代价高于暂缓处理。\n<\/li><li>\n第三步，分派。确定标签后控制流进入对应分支；分支内部可以是提示链（c01）、工具调用（c05）或子智能体。路由只负责送到哪里，不负责分支内部做法。\n<\/li><li>\n第四步，失败回退。兜底承接意图不明、置信不足、标签覆盖不到三类情况；原书客服示例把“意图不明确”路由到澄清智能体或提示链，先反问补全信息（PDF 第 40 页）。\n<\/ul>\n<p>限定条件拆解：<\/p>\n<ul><li>\n史料：客服示例的标签为订单状态、产品信息、技术支持、其他/意图不明，分别对应订单数据库链路、产品目录检索、排障指南或升级人工、澄清链路（PDF 第 40 页）。\n<\/li><li>\n推断：置信度阈值取多少，取决于错派代价与人工成本的权衡；原书未给固定阈值，这一权衡是工程推断。\n<\/li><li>\n边界：规则路由快且确定，但对新说法与细微差别灵活性弱；LLM 路由成本更高，输出格式需要约束；嵌入与微调分类器需要样本维护（PDF 第 41 页）。\n<\/ul>\n<h2>机制逐项对照<\/h2>\n<ul><li>\n与链式：链式规定步骤顺序，路由规定分支归属。完整系统通常先路由分诊，再在分支内走链；路由决定“走哪条链”，链负责“按什么顺序做”。\n<\/li><li>\n与并行：路由互斥选择，一个请求只进一条分支；并行同时启动多条独立支线再合并。路由排除其他分支，并行叠加其他分支。\n<\/li><li>\n与规划：路由在有限预设标签间做静态选择；规划面向开放目标现场生成行动序列，标签集合事先未给全。\n<\/li><li>\n失败位置：路由失败集中在分类环节，分错则整条分支走偏；兜底分支是分类失败的回收口。\n<\/ul>\n<h2>算例：客服请求分诊<\/h2>\n<p>估算口径（工程估算，非原书测量值）：路由分类调用系统提示约 600 输入 token，请求文本约 150 token；分类输出标签约 20 token；模型按 50 token/s 生成，往返约 300 ms；以下为量级比较。<\/p>\n<p>任务：客服入口对四类请求分诊。<\/p>\n<p>路由决策表：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>请求样例<\/th><th>分类依据<\/th><th>标签<\/th><th>进入分支<\/th><th>把握<\/th><\/tr><\/thead><tbody><tr><td>“我的包裹到哪了”<\/td><td>订单状态词 + 物流意图<\/td><td>订单状态<\/td><td>订单数据库工具链<\/td><td>高<\/td><\/tr><tr><td>“这个零件兼容哪款型号”<\/td><td>产品属性咨询<\/td><td>产品信息<\/td><td>产品目录检索链<\/td><td>高<\/td><\/tr><tr><td>“系统报错登不上”<\/td><td>故障描述<\/td><td>技术支持<\/td><td>排障指南链 / 升级人工<\/td><td>中<\/td><\/tr><tr><td>“能不能退”（无上下文）<\/td><td>关键词命中但意图两可<\/td><td>低置信<\/td><td>澄清分支<\/td><td>低<\/td><\/tr><\/tbody><\/table><\/div>\n<p>第 1 步，分类调用：输入约 750 token，输出标签与把握约 30 token；生成约 0.6 秒，加往返约 0.9 秒。 第 2 步，分派：高把握样本直接进入对应分支；中把握样本进入技术支持链并标注“必要时升级”；低把握样本进入澄清分支，反问“是想查订单售后，还是咨询退货政策”。 第 3 步，兜底回收：澄清后仍无法归类的请求转人工队列，不自动进业务分支。<\/p>\n<p>量级对照：分类调用本身只占整条客服链路很小一段；真正的成本在分支内部。路由的价值是避免所有请求都走一条长提示——那条长提示既要查订单又要查目录又给排障建议，单步约束膨胀。敏感性推算：若流量出现新类别（如投诉），标签集未覆盖，样本会落入兜底；需要先补标签与分支，再观察兜底比例是否下降。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：只按关键词路由，“退款”既可能是售后工单也可能是政策咨询，关键词命中即派售后链路，把政策咨询误带进工单流程。反例二：不设兜底，四类之外的新问题被塞进第一个分支，模型在陌生分支凑答案。边界：类别少、流程一致时，额外分类调用的收益抵不过开销；分类错误代价极高的场景，低置信度样本应留在人工复核。<\/p>\n<h2>延伸推演：路由成本与误派代价<\/h2>\n<p>把路由放回成本结构里对比。设全部请求走一条“全包长提示”：该提示要同时描述订单、产品、技术支持三类处理流程，系统提示随分支数量线性变长；每类请求都携带与其无关的流程说明，输入 token 被无效约束占满。加一层路由后，主分类调用只输出标签，分支提示各自简短。粗估：全包方案单请求系统提示约 2000 token；路由方案分类调用约 600 token，加命中分支提示约 500 token，合计约 1100 token。路由用一次额外分类调用，换走分支内提示的收窄。<\/p>\n<p>误派代价要单独核算。设错派到无关分支后，下游仍会消耗一次分支调用与工具往返，才在分支内发现对不上；这次浪费约等于一次分支处理成本，再加一次返工回到正确分支。低置信度样本若硬分派，误派概率随边界样本比例上升；兜底分支只承担澄清或转人工，成本低于错误返工。<\/p>\n<p>四种实现的工程对照（依据原书第 41 页分类）：规则路由延迟最低、确定性最强，但新说法与细微差别覆盖弱；嵌入路由按语义距离分流，需要嵌入模型与阈值标定；LLM 路由理解最灵活，但每次多一次生成调用、输出格式要约束；微调分类器离线训练、推理便宜，但需要标注语料与再训练周期。选型不是选“最强”，而是在流量规模、表述稳定性、延迟预算之间匹配：表述稳定、流量大的场景偏向规则或分类器；说法多变、样本少的场景偏向 LLM 或嵌入。<\/p>\n<h2>补充算例：澄清分支的二次分诊<\/h2>\n<p>低置信度请求进入兜底后，流程不是直接转人工结束，而是先走一次澄清反问，再做二次分类。示例：用户输入“能不能退”，首轮分类在“售后工单”与“政策咨询”之间把握不足，进入澄清分支；澄清问题为“您是已经收到货想办理退货，还是想了解退货规则”。用户回复后，二次分类带上下文进入对应分支。<\/p>\n<p>量级对照（估算口径同上）：澄清分支多一次反问调用，输入约 500 token、输出约 80 token，往返约 0.3 秒；这笔成本低于误派到工单链路后的返工——误派分支内一次处理调用加工具往返约等于一次完整分支成本，再加一次回到正确分支的二次分派。边界样本比例越高，兜底与澄清的投入越划算。<\/p>\n<p>边界案例补充：新类别首次出现时必然落入兜底，标签集不覆盖；观察兜底流量聚类，某类请求重复出现且处理方式稳定后，再把它提升为独立标签。标签冲突案例：一条请求同时含订单与产品线索，规则按首个关键词判定，LLM 路由按整体意图判定，两者结论不同；此时以分支代价为准，代价高的分支要求更高把握，把握不足仍走兜底。路由评估要单独统计分类准确率、误派率与兜底比例，不能只看下游任务成功率，因为分类错误会被下游结果掩盖。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：关键词匹配就够做路由。<\/strong> 反证：同一词在不同语境意图不同；原书也指出规则路由对细微差别和全新输入灵活性较弱（PDF 第 41 页）。语义相近说法需要嵌入或 LLM 路由覆盖。\n<\/li><li>\n<strong>误读：路由标签越多越精细越好。<\/strong> 反证：标签过多会让边界样本比例上升，分支维护成本增加；标签应互斥且覆盖真实流量，长尾先收进兜底再观察是否值得独立成支。\n<\/li><li>\n<strong>误读：低置信度也可以先派出去再说。<\/strong> 反证：错误分派比暂缓处理更贵，下游整条分支在错误方向消耗成本；低把握样本应走澄清或人工，而不是赌一个最近标签。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n路由的四个环节（分类、置信度、分派、兜底）各自失败时，系统表现有什么不同？\n<\/li><li>\n四种路由实现各自依赖什么输入条件？规则路由在什么任务上会失效？\n<\/li><li>\n标签互斥与标签覆盖分别解决什么问题？只满足一条会出现什么情况？\n<\/li><li>\n用算例中的决策表，说明低置信度请求为什么不能直接进入业务分支。\n<\/li><li>\n路由与规划都做“选择下一步”，二者的候选集合有什么本质差别？\n<\/ol>\n<h2>适用与不适用速查<\/h2>\n<p>适合路由的情况：请求可归成有限几类，各类处理流程差异明显，流量中有稳定的类别分布。不适合路由的情况：类别边界无法写清、标签集合需要随任务现场生成，或各类请求最终走同一套流程；后两类应分别考虑规划模式或单链路处理。兜底分支不是摆设，它承接低把握样本与未覆盖类别，是路由可靠性的组成部分。<\/p>\n<h2>第二个任务的端到端算例：五类用户意图分类<\/h2>\n<p>估算口径（工程估算，非原书实测）：中文按约 1.6 字符/token，提示与 JSON 结构另计；分类环节单轮模型生成按 50 token/s，往返约 300 ms；窗口占用按 32768 token 估算。<\/p>\n<p>任务：客服入口把请求分进五类——账单查询、故障报修、功能咨询、投诉升级、退款申请；分类器先给意图与置信度，再分派到对应分支。<\/p>\n<p>分类提示骨架：五类定义与输出格式约 320 汉字 ≈ 200 token；要求输出 <code>{intent, confidence, rationale}<\/code> 的 JSON。<\/p>\n<p>样本走查：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>用户消息（摘要）<\/th><th>判定意图<\/th><th>置信度<\/th><th>下游分支<\/th><\/tr><\/thead><tbody><tr><td>“我这个月被扣了两笔钱”<\/td><td>账单查询<\/td><td>0.91<\/td><td>账单核对链路<\/td><\/tr><tr><td>“打印机报 E-3 错误代码”<\/td><td>故障报修<\/td><td>0.88<\/td><td>排障指南链路<\/td><\/tr><tr><td>“怎么导出 Excel 报表”<\/td><td>功能咨询<\/td><td>0.79<\/td><td>产品文档检索<\/td><\/tr><tr><td>“三天没人回，我要投诉到消协”<\/td><td>投诉升级<\/td><td>0.95<\/td><td>人工升级坐席<\/td><\/tr><tr><td>“货不对板要退货”<\/td><td>退款申请<\/td><td>0.83<\/td><td>退款流程链路<\/td><\/tr><tr><td>“你们那个东西……不太对”<\/td><td>待定<\/td><td>0.42<\/td><td>澄清分支<\/td><\/tr><\/tbody><\/table><\/div>\n<p>单步代价：提示骨架约 200 token，用户消息平均 60 汉字 ≈ 38 token，分类 JSON 输出约 60 token；输入约 238 token，输出约 60 token；分类生成约 1.2 s，加往返约 1.5 s。<\/p>\n<p>误判成本对照：投诉升级被误分进功能咨询，情绪类请求进入自助文档链路，需要二次往返且升级感加重；账单查询被误分进退款申请，可能触发不该走的退款流程。回退路径：置信度低于阈值（示例取 0.70）走澄清分支，追问后仍低于阈值转人工坐席；不把低置信样本硬分进最接近的一类。实现上可规则先行（“扣费、发票”等关键词先走账单候选），嵌入相似度兜底，LLM 复核落在边界样本上。<\/p>\n<h2>前提再拆一层<\/h2>\n<p>路由能成立，还依赖以下几条隐含前提；逐条抽掉后给出故障场景与可观测指标。<\/p>\n<ol><li>\n<strong>类别集合封闭且定义互斥。<\/strong> 抽掉后：一条请求同时跨两类，路由没有唯一归宿，分派结果随措辞波动。可观测指标：跨类标注占比、分类歧义样本条数。\n<\/li><li>\n<strong>分类置信度与真实正确率同向。<\/strong> 抽掉后：高置信误判直接进入高成本分支，回退阈值失去过滤作用。可观测指标：按置信度分档的实测准确率、误派率。\n<\/li><li>\n<strong>每类下游分支具备对应处理能力。<\/strong> 抽掉后：分类正确，分支却做不了这件事，请求在分支内再次转派。可观测指标：分支内一次解决率、分支间转派率。\n<\/li><li>\n<strong>存在明确的澄清与人工回退路径。<\/strong> 抽掉后：低置信样本被塞进最像的类别，错误一路带到末端。可观测指标：低置信占比、回退路径流量、回退后解决率。\n<\/li><li>\n<strong>评测集覆盖真实意图分布。<\/strong> 抽掉后：离线样本偏常见类别，线上长尾意图误判率高。可观测指标：离线分类准确率与线上抽样一致率、长尾类别召回率。\n<\/li><li>\n<strong>分类环节本身成本可控。<\/strong> 抽掉后：每请求都走重模型分类，延迟与 token 成本压过专用分支收益。可观测指标：分类环节 p50/p95 延迟、单请求分类 token 成本。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "路由"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.50<\/div><h1>并行化（Parallelization）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章 | <strong>原书位置<\/strong>：第 3 章《Parallelization》（PDF 第 50 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>当一批子任务彼此不依赖时，串行排队会把等待时间累加起来：多条 LLM 调用、多次工具使用、甚至多个子智能体依次执行，整体响应时间等于各步耗时之和。原书指出，并行化通过并发执行多个组件来改善系统效率与响应能力，尤其在涉及多次模型调用或高度依赖外部服务的场景中（PDF 第 50、51 页）。<\/p>\n<p>另一类困难是单次生成的随机性：同一问题只跑一遍，偶发错误无法被察觉。需要多次求解后交叉比对，才能判断结果是否稳健。串行跑多遍虽然也能得到多个答案，但耗时随遍数线性增长，并行才有实际意义。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：并行化识别出彼此独立、可同时推进的子任务，并发执行 LLM 调用、工具使用或整个子智能体，结果在后续汇聚点合并（PDF 第 50、52 页）。逐句拆开：<\/p>\n<ul><li>\n“彼此独立”：子任务之间没有数据依赖，一个子任务的输入不依赖另一个子任务的输出；共享状态或顺序依赖是不能并行的硬约束。\n<\/li><li>\n“并发执行”：多个组件同时推进，而不是等前一个返回后再启动后一个。\n<\/li><li>\n“汇聚点合并”：并行结果在图中的后续收敛点聚合，而不是各自直接交给用户（PDF 第 52 页）。\n<\/li><li>\n书中区分两类用法：分段并行把长文档或批量条目切块、分块处理；投票并行对同一问题多次求解，再汇总多数意见或做交叉验证（PDF 第 50–51 页）。\n<\/ul>\n<p>正例：一批用户反馈同时跑情感分析、关键词抽取、分类与紧急程度识别；一篇长文档分块分别总结，再合并去重。反例：先算出合计再拆分核对合计，两步有依赖，不能并行；要求后一步参考前一步结论时强行并发，得到的是互不衔接的片段。<\/p>\n<h2>原理推导<\/h2>\n<p>并行化的收益与代价可以从延迟、token、聚合三条机制推导。<\/p>\n<p>机制一：墙钟延迟由最慢子任务决定。设 <span class=\"katex-inline\">m<\/span> 个独立子任务串行执行，单任务平均耗时 <span class=\"katex-inline\">t<\/span>，串行总延迟为 <span class=\"katex-inline\">m \\cdot t<\/span>；理想并发下总延迟约为 <span class=\"katex-inline\">\\max_i t_i<\/span>，即最慢的那个子任务决定整体等待时间。并行缩短的是墙钟时间，不是把工作本身消失。原书把降低整体延迟、提升响应能力列为并行化的核心收益（PDF 第 51 页）。<\/p>\n<p>机制二：token 总量不减少，通常反而增加。每个子任务都要携带自己的提示模板与必要上下文，投票并行还要重复相同任务 <span class=\"katex-inline\">k<\/span> 遍。设单任务输入 <span class=\"katex-inline\">I<\/span> token、输出 <span class=\"katex-inline\">O<\/span> token，<span class=\"katex-inline\">m<\/span> 个子任务并行的 token 消耗约为 <span class=\"katex-inline\">m(I+O)<\/span>，加上汇总步的读取开销；串行单任务若能一次完成，总 token 更低。并行买的是时间与稳健性，不是成本。<\/p>\n<p>机制三：聚合策略与冲突解决。分段并行的聚合做合并、去重、排序与冲突消解；投票并行的聚合按多数表决、一致性检验或交叉比对确定答案。聚合规则必须事先写清：两条片段结论矛盾时以哪份为准、重复信息如何合并、票型接近时如何升级复核。原书明确子任务在汇聚点聚合（PDF 第 52 页），没有聚合规则的并行只会把矛盾结果原样推给用户。<\/p>\n<p>机制四：并发度受外部配额约束。并行启动的子任务都要消耗模型调用额度与外部服务吞吐；并发数超过接口限流上限时，多余请求排队或被拒绝，墙钟收益被排队时间吃掉。工程上要设置并发上限与队列，让并发度贴着可承受的吞吐边界走，而不是把所有子任务同时放出。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>并行成立的条件：子任务输入可独立准备；子任务之间无共享可变状态；聚合时所需信息都包含在各自产物里。适合批量反馈处理、长文档分块总结、多视角评审、多解投票等场景。<\/p>\n<p>边界：子任务有先后依赖时，必须保留串行顺序；上下文必须跨子任务共享时，先做信息汇总再分发，避免每个分支各执一词。外部服务有速率限制或配额约束时，并发度要受限于吞吐上限，超过配额只会触发排队或报错。投票并行在答案主观、标签分散的任务上，多数意见未必更可靠，此时投票只起到暴露分歧的作用。<\/p>\n<p>条件去掉会怎样：去掉独立性检查，把有依赖的步骤并发，下游拿到的是未经上游确认的中间值，错误不会被顺序保护拦下；去掉聚合冲突规则，并行产物互相矛盾地并列输出；去掉并发上限，外部接口被打满，整体延迟反而恶化。<\/p>\n<h2>反例<\/h2>\n<p>把串行依赖硬并行的反例：内容生成步依赖大纲步的结构，两步同时开工，生成步只能凭猜测写结构，最后与大纲对不上，返工量超过串行。<\/p>\n<p>投票并行被误用的反例：在模型本身缺乏领域知识的问题上重复跑五遍，五次都在同一处出错，多数表决把错误结论“合法化”；投票只能降低单次随机性，不能弥补知识缺口，知识缺口要靠检索（c07）或工具（c05）补。<\/p>\n<h2>辨析<\/h2>\n<p>与链式（c01）的差别：链式步骤排队、产物传递；并行子任务同时开工、产物汇聚。链式优化的是顺序正确性，并行优化的是吞吐与延迟。<\/p>\n<p>与路由（c02）的差别：路由选择一条分支，互斥；并行启动多条分支，叠加。路由的分支之间通常也互不依赖，但路由的语义是“只走一条”，并行的语义是“都要做”。<\/p>\n<p>与多智能体协作（c08）的差别：并行化是执行层的并发手段，子任务可以是同模型多次调用；多智能体是角色与协议层的分工，通信、角色边界与汇总责任是其核心。多智能体内部常嵌套并行，但并行本身不等于多智能体。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：链式的步骤拆分与结构化产物。后继：并行化是多智能体并行处理、专家团队分工的底层执行机制；反思循环中的批评与多视角评审可以用投票并行组织；规划（c06）把可并发的子任务标注为并行组。本概念把“独立性判断—并发执行—聚合冲突解决”这条链路与延迟、token 的成本结构串在一起。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（并行化）<\/summary><div class=\"depth-body\"><h1>并行化（Parallelization）· 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>逐级倒查并行化成立的前提：<\/p>\n<ol><li>\n“并发执行能缩短整体等待”依赖子任务之间独立：一个子任务的输入不依赖另一个子任务的输出，也不读写同一可变状态。存在数据依赖时，并发只能拿到未经上游确认的中间值。\n<\/li><li>\n“子任务独立”依赖输入可独立准备：每个子任务所需材料在开工前就能切分好，不需要等其他子任务跑完再拼装。\n<\/li><li>\n“产物可聚合”依赖最终有明确的汇聚点：并行结果在收敛点合并、去重、消解冲突，而不是各自直接交给用户。没有聚合规则，并行只把矛盾结果原样推出。\n<\/li><li>\n“聚合规则可写”依赖子任务产物格式确定：分段并行产物是可比较的片段，投票并行产物是可计数的候选答案；格式不定，去重与表决都无法落地。\n<\/li><li>\n“并发不压垮外部服务”依赖并发度受配额约束：模型调用与外部接口都有吞吐上限，超过上限多余请求排队或被拒，墙钟收益被排队时间吃掉。\n<\/li><li>\n最底层假设：把工作切给多个并发执行体的协调成本，低于串行排队等待的时间成本；协调成本过高时，并行不划算。\n<\/ol>\n<p>逆推到读者基线：先认“哪些子任务互不依赖”，再认“产物怎么合并”，最后认“并发开到多大”。独立性判断不过关，后面两步都不必做。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条分四步，每步写清假设与公式：<\/p>\n<ul><li>\n第一步，延迟分解。设 <span class=\"katex-inline\">m<\/span> 个独立子任务，单任务耗时 <span class=\"katex-inline\">t_i<\/span>。串行总延迟为 <span class=\"katex-inline\">\\sum_{i=1}^{m} t_i<\/span>；理想并发下总延迟约为 <span class=\"katex-inline\">\\max_i t_i<\/span>，即最慢子任务决定整体等待时间。用到的假设：并发执行体之间无排队、无资源争用；实际系统中并发度有限，等待时间介于串行与理想并发之间。原书把降低整体延迟、提升响应能力列为并行化核心收益（PDF 第 51 页）。\n<\/li><li>\n第二步，token 核算。设单任务输入 <span class=\"katex-inline\">I<\/span> token、输出 <span class=\"katex-inline\">O<\/span> token，<span class=\"katex-inline\">m<\/span> 个子任务并行的 token 消耗约为 <span class=\"katex-inline\">m(I+O)<\/span>，再加汇总步读取开销。串行单任务若能一次完成，总 token 更低；并行买时间与稳健性，不买成本。用到的假设：各子任务上下文不重复计入汇总；若重复携带公共材料，token 还会更高。\n<\/li><li>\n第三步，聚合策略。分段并行做合并、去重、排序与冲突消解；投票并行按多数表决、一致性检验或交叉比对定答案。冲突规则事先写清：两条片段结论矛盾时以哪份为准，重复信息如何合并，票型接近时如何升级复核。原书明确子任务在汇聚点聚合（PDF 第 52 页）。\n<\/li><li>\n第四步，并发上限。设置并发数与队列，让并发度贴着可承受吞吐边界走；外部服务限流时优先保护接口稳定，而不是把所有子任务同时放出。\n<\/ul>\n<p>限定条件拆解：<\/p>\n<ul><li>\n史料：书中列出两类用法——分段并行（长文档切块分别总结）与投票并行（同一问题多次求解后取多数或交叉验证）；反馈批量场景可同时跑情感分析、关键词抽取、分类与紧急程度识别（PDF 第 50–51 页）。\n<\/li><li>\n推断：延迟节省比例取决于最慢子任务与串行总和的差距；子任务耗时越不均，理想并发相对串行的节省越明显。这是机制推断，原书未给实测比值。\n<\/li><li>\n边界：上下文必须跨子任务共享时，应先汇总信息再分发；外部服务有配额时并发度受限。\n<\/ul>\n<h2>机制逐项对照<\/h2>\n<ul><li>\n与链式：链式步骤排队、产物传递；并行子任务同时开工、产物汇聚。链式优化顺序正确性，并行优化吞吐与延迟。\n<\/li><li>\n与路由：路由选择一条互斥分支；并行启动多条叠加支线。路由的分支之间通常也互不依赖，但语义是“只走一条”，并行是“都要做”。\n<\/li><li>\n与多智能体：并行化是执行层并发手段，子任务可以是同模型多次调用；多智能体是角色与协议层分工，含独立上下文、消息通道与汇总责任。多智能体内部常嵌套并行。\n<\/li><li>\n失败位置：并行失败集中在聚合环节，冲突未消解则结果并列矛盾；独立性误判导致的错误则在下游暴露，且没有串行顺序保护兜底。\n<\/ul>\n<h2>算例一：长文档分块总结<\/h2>\n<p>估算口径（工程估算，非原书测量值）：每块总结提示约 500 输入 token，单块材料约 1000 token；单块输出约 200 token；模型按 50 token/s 生成，往返约 300 ms；并发上限先按 5 估计。<\/p>\n<p>任务：100 页文档切成 10 块分别总结，再合并去重。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>方案<\/th><th>调用批次<\/th><th>输入 token<\/th><th>输出 token<\/th><th>端到端延迟（估算）<\/th><\/tr><\/thead><tbody><tr><td>串行 10 块<\/td><td>10 次排队<\/td><td>约 15000<\/td><td>约 2000<\/td><td>约 10 × 23 s ≈ 230 s<\/td><\/tr><tr><td>并发 5 路<\/td><td>2 批<\/td><td>约 15000<\/td><td>约 2000<\/td><td>约 2 × 23 s + 聚合 ≈ 50 s<\/td><\/tr><\/tbody><\/table><\/div>\n<p>串行单块：输入约 1500 token，输出约 200 token，生成约 4 秒加往返约 4.3 秒；表中 23 s 为含排队与材料读取的粗估量级。并发方案 token 与串行基本持平，延迟从排队总和降到两批最慢块加聚合。聚合步读取 10 份摘要约 2000 token，输出合并稿约 400 token。<\/p>\n<h2>算例二：投票并行核查<\/h2>\n<p>任务：对同一事实判断独立求解 3 遍，再交叉比对。<\/p>\n<ul><li>\n每遍输入约 800 token，输出约 150 token；三遍并发输入约 2400 token、输出约 450 token。\n<\/li><li>\n聚合步比对三份结论：一致则采纳；两票对一票则标记存疑并补检索；三份互相矛盾则升级人工。\n<\/li><li>\n代价：投票把单次随机性暴露成可计数分歧，但不弥补知识缺口——三遍在同一处都错时，多数表决把错误合法化，缺口要靠检索（c07）或工具（c05）补。\n<\/ul>\n<p>敏感性推算：块数从 10 增到 20，串行延迟近似翻倍，并发方案只增加批次或单批块数，延迟增长慢于线性；但若单块材料切得过碎，摘要丢失主语与背景，聚合步要承担还原上下文的额外成本。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：把有依赖的步骤并发，生成步拿不到大纲步的结构，最后与大纲对不上，返工量超过串行。反例二：外部接口被打满，并发请求触发限流，整体延迟不降反升。边界：子任务有先后依赖必须串行；上下文跨子任务共享应先汇总；主观分散任务上投票多数意见未必更可靠。<\/p>\n<h2>延伸推演：并发度与延迟曲线<\/h2>\n<p>把延迟随并发度的变化拆开看。设 <span class=\"katex-inline\">m<\/span> 个子任务各耗时 <span class=\"katex-inline\">t<\/span>，并发度上限为 <span class=\"katex-inline\">c<\/span>。串行时延迟 <span class=\"katex-inline\">m \\cdot t<\/span>；并发度 <span class=\"katex-inline\">c<\/span> 时延迟约 <span class=\"katex-inline\">\\lceil m/c \\rceil \\cdot t<\/span>，再加聚合等待。并发度从 1 提到 <span class=\"katex-inline\">m<\/span>，延迟从 <span class=\"katex-inline\">m \\cdot t<\/span> 降到 <span class=\"katex-inline\">\\max t<\/span>；但并发度超过外部吞吐上限后，多余请求进入排队，延迟不再下降，反而因排队抖动上升。因此工程上并发度贴着配额上限设，而不是取子任务总数。<\/p>\n<p>再看不可并行部分的约束。若任务中有比例 <span class=\"katex-inline\">s<\/span> 的步骤必须串行（例如先汇总再分发、先聚合再定稿），这部分延迟不随并发度下降；并行只能压缩 <span class=\"katex-inline\">(1-s)<\/span> 部分。串行比例越高，并发带来的总延迟节省越小，这也是判断“值不值得并行”的定量依据：先找出任务里必须排队的环节，再评估其余部分并发的收益。<\/p>\n<p>聚合冲突成本不能漏算。分段并行若产出互相矛盾的结论，聚合步要逐条比对、找依据、定取舍；冲突越多，聚合 token 与人工复核时间越高。投票并行在票型接近时同样需要升级复核。并行节省的等待时间，有一部分会在聚合与冲突消解处还回去；设计时要把子任务边界切清，让产物之间尽量可拼接、少冲突。<\/p>\n<h2>补充算例：投票一致性判定与分段重叠<\/h2>\n<p>投票并行的聚合分三档处理：三遍结论一致，直接采纳；两票对一票，标记存疑并补检索或工具验证；三份互相矛盾，升级人工。票型记录要保留各遍原始答案，而不是只留多数结论，否则存疑样本无法回溯分歧来源。一致性判断只解决“选哪个答案”，不解决“答案对不对”；知识缺口仍需外部材料补齐。<\/p>\n<p>分段并行的切块边界要留重叠：相邻分片共享边缘句子，避免结论被切口切断。代价是入库存储与重复内容增加，聚合时同一信息在两片出现要去重。反方向边界：分片过大，单块语义混杂，向量距离被稀释；分片过碎，结论缺主语与条件。批量反馈场景中，情感、关键词、分类、紧急程度几个分析维度彼此独立，可以并发；但若某个维度的结论要作为另一维度的输入，二者必须排队。<\/p>\n<p>并发上限的工程取值：先测外部接口在不报错前提下的稳定吞吐，再把并发度设在该值以下留出余量；排队队列长度有上限，超出的请求降级为分批处理，而不是无限堆积。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：并行能省 token。<\/strong> 反证：每个子任务都携带自己的提示与上下文，投票并行还重复相同任务 <span class=\"katex-inline\">k<\/span> 遍，总 token 通常多于串行；并行缩短的是墙钟时间（c03 正文机制二）。\n<\/li><li>\n<strong>误读：所有子任务都能并行。<\/strong> 反证：有共享状态或顺序依赖的步骤并行，会放大错误且失去串行保护；开工前必须先做独立性判断。\n<\/li><li>\n<strong>误读：投票次数越多答案越准。<\/strong> 反证：模型缺知识时多遍重复同一错误，表决只暴露分歧不填补缺口；投票降低单次随机性，不提供新材料。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n用 <span class=\"katex-inline\">\\sum t_i<\/span> 与 <span class=\"katex-inline\">\\max t_i<\/span> 说明并行延迟节省来自哪里；子任务耗时不均时节省怎么变化？\n<\/li><li>\n为什么并行的 token 总量通常不减少？写出单任务输入输出与 <span class=\"katex-inline\">m<\/span> 个子任务的量级关系。\n<\/li><li>\n分段并行与投票并行的聚合规则有什么不同？冲突分别怎么处理？\n<\/li><li>\n并发上限受哪些外部约束？超过配额会出现什么后果？\n<\/li><li>\n独立性判断不过关时强行并行，错误在哪个环节暴露？为什么串行顺序保护不了它？\n<\/ol>\n<h2>适用与不适用速查<\/h2>\n<p>适合并行的情况：子任务输入可独立准备、彼此不读写同一可变状态、产物可在汇聚点拼接。不适合并行的情况：步骤间有数据依赖，或上下文必须跨分支共享后才能继续；这类步骤保留串行顺序。投票并行只在单次求解带随机性、且多份答案可比较时才有意义。<\/p>\n<h2>第二个任务的端到端算例：三路独立资料采集后聚合<\/h2>\n<p>估算口径（工程估算，非原书实测）：中文按约 1.6 字符/token；生成按 50 token/s，外部工具往返另计；窗口按 32768 token 估算。<\/p>\n<p>任务：为新品选型汇总三类互不依赖的材料——竞品报价、规格参数、用户评价，三路并发采集，最后由聚合步合并。<\/p>\n<p>并发支路：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>支路<\/th><th>输入构成<\/th><th>输入 token<\/th><th>输出产物<\/th><th>输出 token<\/th><th>支路耗时<\/th><\/tr><\/thead><tbody><tr><td>A 价格采集<\/td><td>提示 120 + 五家报价结果 800<\/td><td>约 920<\/td><td>价格对比表<\/td><td>约 300<\/td><td>约 6.5 s<\/td><\/tr><tr><td>B 规格比对<\/td><td>提示 120 + 规格文本 1000<\/td><td>约 1120<\/td><td>规格对照表<\/td><td>约 350<\/td><td>约 7.2 s<\/td><\/tr><tr><td>C 评价聚类<\/td><td>提示 120 + 评价原文 1200<\/td><td>约 1320<\/td><td>优缺点聚类<\/td><td>约 300<\/td><td>约 6.8 s<\/td><\/tr><\/tbody><\/table><\/div>\n<p>聚合步：三路产物合计约 950 token，聚合提示约 200 token，输入约 1150 token；选型汇总输出约 450 token，生成约 9.0 s。<\/p>\n<p>延迟对照：并行段耗时取三路最大值约 7.2 s；若串行排队，三段耗时相加约 20.5 s，并行段节省约 13.3 s，聚合步串行在后。token 合计：输入约 3560 token（三路提示 360 + 材料 3000 + 聚合提示 200），输出约 1400 token。<\/p>\n<p>冲突解决：报价口径不一致（含税与不含税）时，保留原始报价与口径字段，聚合步标注差异，不强行取均值；规格项互相矛盾时标记待核，不在汇总里抹平。上下文预算：单路最大输入约 1320 token，占窗口约 4.0%；聚合步约 1150 token。<\/p>\n<h2>前提再拆一层<\/h2>\n<p>并行化能成立，还依赖以下几条隐含前提；逐条抽掉后给出故障场景与可观测指标。<\/p>\n<ol><li>\n<strong>子任务之间无数据依赖。<\/strong> 抽掉后：并发结果互不衔接，聚合后出现前后矛盾的片段。可观测指标：子任务间引用缺失率、聚合冲突条数。\n<\/li><li>\n<strong>各支路产物格式一致、可合并。<\/strong> 抽掉后：汇聚步要先人工对齐结构，并行省下的时间耗在整理上。可观测指标：聚合步格式解析成功率、结构返工次数。\n<\/li><li>\n<strong>外部并发额度允许（限流与连接池）。<\/strong> 抽掉后：并发请求触发限流拒绝，支路整体失败重试。可观测指标：限流拒绝次数、重试率、并发排队时长。\n<\/li><li>\n<strong>聚合环节有权消解冲突并标注差异。<\/strong> 抽掉后：矛盾结果并列交付，读者自行判断取舍。可观测指标：冲突标注率、转人工复核条数。\n<\/li><li>\n<strong>各支路耗时量级相近，无长尾拖累。<\/strong> 抽掉后：一路超时拖住整体完成时间，并行收益被尾部吃掉。可观测指标：各支路耗时 p95、尾部等待时间占比。\n<\/li><li>\n<strong>多次求解的样本相互独立。<\/strong> 抽掉后：投票并行的几次输出高度趋同，交叉验证失去作用。可观测指标：多次结果分歧度、一致率分布。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "并行化"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.61<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">提示链<\/a><\/span><\/div><h1>反思（Reflection）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章 | <strong>原书位置<\/strong>：第 4 章《Reflection》（PDF 第 61 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>即便工作流设计完善，首版输出或初始计划仍可能不准确、不完整或未达最优（PDF 第 61 页）。一次生成完成后，模型不会自动回头核对事实、格式与约束；缺少反馈环时，错误版本直接交付。链式把产物交给下游，路由把产物送进分支，二者都是单向推进，都不包含“检查刚才那版并改好”的环节。<\/p>\n<p>反思要解决的具体困难是：让系统对自身产出或过程做评估，再用评估结果修正答案、调整策略。没有明确标准的“再想想”只会换措辞；反思必须把检查依据、反馈回传和停止条件写成可执行环节，才能把质量提升与反复空谈分开。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：反思是智能体对自身工作、产出或内部状态进行评估，并利用评估结果改进表现、修订回复的自我纠错与自我改进机制；它依据外部反馈、内部批评或与目标标准的偏差迭代，实践中也常由另一个专职审阅的智能体承担（PDF 第 61 页）。逐句拆开：<\/p>\n<ul><li>\n“评估自身产出”：检查对象是初稿、计划或生成过程，不是直接重新出题。\n<\/li><li>\n“用评估结果改进”：批评意见必须回流到生成环节，驱动重写、调参或修改计划。\n<\/li><li>\n“反馈环”：不同于链式的单向传递，反思显式引入循环；先产出，再回看产出，标出问题与改进点，再出修订版（PDF 第 61 页）。\n<\/li><li>\n“生产者—批评者分离”：书中把流程拆成 Producer 与 Critic 两个逻辑角色，也称生成器—批评者、生产者—审阅者；单一智能体可以自审，但两个专用智能体或两套不同系统提示通常更稳健，更不容易自己给自己放水（PDF 第 62 页）。\n<\/ul>\n<p>正例：生产者写一段 Python 函数，批评者按“事实正确性、代码质量、风格、完整度、是否遵循提示”逐条审阅并给结构化意见，生产者据此出第二版，直到批评通过或到达轮次上限。反例：提示只写“请改进一下你的回答”，模型没有可对照的标准，只能调整措辞。<\/p>\n<h2>原理推导<\/h2>\n<p>反思循环由四步构成，收敛条件与成本都能逐步推导。<\/p>\n<p>第一步执行（Execution）：智能体完成任务或给出初稿。生产者只专注生成内容，接收初始提示产出第一版（PDF 第 61、62 页）。<\/p>\n<p>第二步评估/批评（Evaluation/Critique）：再调一次模型或走规则引擎审视上一步产物，核对事实准确性、连贯性、风格、完整度、是否遵循提示等标准（PDF 第 61 页）。批评者使用不同人设，例如“资深工程师”“严谨事实核查员”，按指定标准找缺陷并输出结构化反馈（PDF 第 62 页）。这一步的可靠性取决于标准是否具体：标准越笼统，批评越偏向主观感受。<\/p>\n<p>第三步反思/精炼（Reflection/Refinement）：依据批评决定改法，可能是重写输出、调整后续参数，甚至推翻原计划（PDF 第 61 页）。反馈回传给生产者，作为下一版的修改依据。<\/p>\n<p>第四步迭代（Iteration）：修订版再跑执行—批评—精炼，直到达标或触发停止条件（PDF 第 61 页）。书中代码示例设 <code>max_iterations = 3<\/code>，循环持续到批评阶段判定代码完善或达到最大轮次；对话历史在循环中保留并逐轮传入（PDF 第 63 页）。<\/p>\n<p>收敛条件有两条：一是批评结论通过既定标准，二是达到轮次上限。第二条是硬性兜底，防止循环不收敛。成本侧，原书指出反思是内存密集型的：每轮历史都在膨胀，包含初始输出、批评与各版修订（PDF 第 66 页）；迭代越多，延迟与 token 越高，因此质量优先于速度和成本时才值得用（PDF 第 67 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>反思适用：最终输出的质量、准确性与细节完整度比速度和成本更重要，典型如长篇内容打磨、代码编写与调试（PDF 第 67 页）。有效反思需要三件配套：可逐条对照的 rubric、可供核对的外部证据（测试结果、检索原文、计算结果）、轮次上限。<\/p>\n<p>边界：任务本身有标准答案且单次生成已稳定时，反思轮次是纯额外开销。批评标准无法具体化的主观任务上，自审与互审都容易漂移。批评者与生产者共享同一套偏见时，分离角色也不能消除系统性盲点；这类盲点要靠外部证据或人工复核补上。历史无限累积会撑爆上下文窗口，需要在循环中裁剪或摘要早期版本。<\/p>\n<p>条件去掉会怎样：去掉 rubric，批评变成“感觉不好”，修订方向随措辞漂移；去掉外部证据，模型只能在已有文本里找问题，无法发现事实错误；去掉轮次上限，标准模糊时循环可能一直挑出新问题，永不停止。<\/p>\n<h2>反例<\/h2>\n<p>无标准反思的反例：提示要求“让回答更好”，批评者只能指出表达不顺，生产者把句子换一种说法，事实错误原样保留。原书把“对照明确标准检查”列为评估环节的核心（PDF 第 61 页），标准缺失时反思退化为润色。<\/p>\n<p>无新证据的循环反例：同一模型连续三轮自审，每轮都基于上一版文本，没有测试、检索或计算介入；后一轮倾向附和前一轮结论，错误被反复确认而不是被纠正。原书也提醒，反思收益伴随迭代成本，历史逐轮膨胀（PDF 第 66 页）。<\/p>\n<h2>辨析<\/h2>\n<p>与链式（c01）的差别：链式单向传递产物；反思把产物送回生成者形成闭环。链式可以在某一步挂一个反思关卡，但反思本身是反馈结构。<\/p>\n<p>与规划（c06）的差别：反思修订的是当前产出或局部方法；规划调整的是后续行动序列与任务分解。批评发现“计划本身不可行”时，反思触发的是重规划，进入规划模式。<\/p>\n<p>与护栏（c09）的差别：反思是质量改进环节，目标是把结果做得更好；护栏是拦截检查，目标是阻止有害、越界或不合规内容流出。反思通过不等于护栏通过，反之亦然。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：链式的结构化产物可供批评者逐项核对；工具调用（c05）为批评环节提供测试、检索等外部证据。后继：反思是规划循环中检查点不通过时的修正手段，也是多智能体批评者—审阅者拓扑（c08）的单智能体雏形；护栏（c09）在反思之外另设合规拦截。本概念把“生成—批评—精炼—迭代”的反馈环与收敛条件、成本结构串在一起。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（反思）<\/summary><div class=\"depth-body\"><h1>反思（Reflection）· 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>逐级倒查反思循环成立的前提：<\/p>\n<ol><li>\n“修订版比初稿好”依赖批评结论可被执行：批评意见必须指向具体缺陷与改法，而不是笼统感受；否则生产者拿到反馈也不知道改哪里。\n<\/li><li>\n“批评结论具体”依赖有明确对照标准（rubric）：事实准确性、连贯性、风格、完整度、是否遵循提示等维度逐条列出（PDF 第 61 页）；标准含糊，批评就滑向主观印象。\n<\/li><li>\n“标准可对照”依赖有外部证据可供核对：测试结果、检索原文、计算结果等事实依据；缺少证据，模型只能在已有文本内部挑措辞。\n<\/li><li>\n“反馈能回流”依赖产物以可结构化方式回传：生产者初稿、批评意见、各版修订在循环中保留并逐轮传入上下文（PDF 第 63 页）。\n<\/li><li>\n“循环能停下来”依赖停止条件：批评通过既定标准，或达到轮次上限；没有硬上限，标准模糊时循环可能一直挑出新问题。\n<\/li><li>\n最底层假设：模型在看到针对具体缺陷的反馈后，下一版能对应修正；若反馈无法被转化为改动，反思只是重复生成。\n<\/ol>\n<p>逆推到读者基线：先认“初稿可以被检查”，再认“检查要有标准和证据”，最后认“循环何时停”。缺任何一层，反思都会退化成换说法。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条分四步，每步写清假设：<\/p>\n<ul><li>\n第一步，执行（Execution）。生产者接收初始提示产出初稿，专注生成内容。用到的假设：初始提示足够界定任务边界；边界不清，初稿方向就偏。\n<\/li><li>\n第二步，评估/批评（Evaluation/Critique）。再调一次模型或走规则引擎审视产物，按 rubric 核对事实、连贯、风格、完整度、指令遵循等（PDF 第 61 页）。批评者使用不同人设，如资深工程师、严谨事实核查员，输出结构化反馈（PDF 第 62 页）。用到的假设：分离角色能缓解“自己给自己放水”的认知偏误；但共享同一套偏见时，分离不能消除系统性盲点。\n<\/li><li>\n第三步，反思/精炼（Reflection/Refinement）。依据批评决定重写、调参或修改计划；反馈回传生产者作为下一版依据（PDF 第 61 页）。用到的假设：批评与改动之间存在可执行映射；无法映射的批评需要转人工或补证据。\n<\/li><li>\n第四步，迭代（Iteration）。修订版再跑执行—批评—精炼，直到达标或触发停止条件（PDF 第 61 页）。书中代码示例设 <code>max_iterations = 3<\/code>，循环持续到批评判定完善或达到最大轮次（PDF 第 63 页）。\n<\/ul>\n<p>收敛条件与成本：<\/p>\n<ul><li>\n收敛条件一：批评结论通过标准，循环退出。\n<\/li><li>\n收敛条件二：达到轮次上限，强制退出并保留当前最优版或转人工。\n<\/li><li>\n成本侧：反思是内存密集型循环，每轮历史膨胀，包含初始输出、批评与各版修订（PDF 第 66 页）；迭代越多延迟与 token 越高，因此质量优先于速度成本时才用（PDF 第 67 页）。\n<\/ul>\n<p>限定条件拆解：<\/p>\n<ul><li>\n史料：生产者—批评者分离也称生成器—批评者、生产者—审阅者；LangChain 示例用 reflector_prompt 固定批评者角色，ADK 示例显式定义生产者与审阅者两个 LlmAgent（PDF 第 62 页）。\n<\/li><li>\n推断：批评轮次与质量提升不是线性关系；前两轮通常收益最大，后续轮次边际收益递减。这是机制推断，原书未给质量曲线。\n<\/li><li>\n边界：批评者与生产者共享偏见时，盲点要靠外部证据或人工复核补上；历史无限累积会撑爆上下文，需要裁剪或摘要早期版本。\n<\/ul>\n<h2>机制逐项对照<\/h2>\n<ul><li>\n与链式：链式单向传递产物；反思把产物退回生成者形成闭环。链式可在某一步挂反思关卡，但反思本身是反馈结构。\n<\/li><li>\n与规划：反思修订当前产出或局部方法；规划调整后续行动序列。批评发现计划本身不可行时，反思结论升级为重规划（c06）。\n<\/li><li>\n与护栏：反思以质量改进为目标；护栏以合规安全为目标做拦截。反思通过不等于护栏通过，反之亦然。\n<\/li><li>\n失败位置：反思失败集中在批评环节——标准空泛、证据缺失、反馈不可执行；循环不收敛则是停止条件缺失。\n<\/ul>\n<h2>算例：函数编写反思循环<\/h2>\n<p>估算口径（工程估算，非原书测量值）：生产者系统提示约 700 token，批评者系统提示约 600 token；初稿约 300 token；每轮历史逐轮累积；模型按 50 token/s 生成，往返约 300 ms。<\/p>\n<p>任务：写一个阶乘函数，处理 0 与负数输入。<\/p>\n<p>第 1 轮：<\/p>\n<ul><li>\n生产者输入：任务提示 + 函数要求，约 800 token；输出初稿约 300 token。\n<\/li><li>\n批评者输入：rubric（正确性、边界处理、错误提示、风格）+ 初稿，约 1000 token；输出意见约 200 token：“未处理负数输入；0 的阶乘返回 1 已覆盖；缺类型检查。”\n<\/li><li>\n代价：两轮调用输入约 1800 token，输出约 500 token；生成加往返约 12 秒。\n<\/ul>\n<p>第 2 轮：<\/p>\n<ul><li>\n生产者输入：第 1 轮初稿 + 批评意见，约 1300 token；输出修订版约 320 token。\n<\/li><li>\n批评者输入：历史 + 修订版，约 1600 token；输出意见约 120 token：“负数已抛 ValueError；边界覆盖完整；风格可接受。”\n<\/li><li>\n代价：输入约 2900 token，输出约 440 token；约 13 秒。\n<\/ul>\n<p>第 3 轮（上限兜底）：若批评仍有保留意见，进入第 3 轮；<code>max_iterations = 3<\/code> 到点即停，不再继续。本轮输入约 3000 token 量级。<\/p>\n<p>收敛判断：第 2 轮批评通过标准，循环提前退出；不进入第 3 轮。若 rubric 只写“写得更好”，两轮后批评仍在挑措辞，历史累积到第 3 轮仍无明确通过信号，此时靠轮次上限强制退出。<\/p>\n<p>敏感性推算：每轮历史都把初稿、批评、修订再带一遍，第 <span class=\"katex-inline\">k<\/span> 轮输入约为前 <span class=\"katex-inline\">k-1<\/span> 轮产物之和；轮次越多，单轮 token 与延迟上涨越快。长循环需要在第 2、3 轮后把早期版本摘要化，只保留当前版与未解决缺陷。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：提示只写“请改进一下”，批评者只能指出表达不顺，生产者调换措辞，事实错误原样保留。反例二：同一模型连续自审，没有测试或检索介入，后一轮附和前一轮结论，错误被反复确认。边界：答案标准、单次生成已稳定的任务，反思轮次是纯额外开销；主观任务上自审互审都易漂移。<\/p>\n<h2>延伸推演：循环何时震荡不收敛<\/h2>\n<p>反思循环不收敛有几种可识别的条件。其一，批评标准互相冲突：rubric 同时要求简短与详尽、激进与稳妥，生产者每轮满足一头就被另一头挑出问题，版本来回摆动。其二，缺少外部证据：批评只能在文本内部找瑕疵，每轮换一个措辞角度，缺陷没有可对照的事实依据，问题既不能被证实也不能被消除。其三，反馈不可执行：意见停留在“不够好”，生产者不知道改哪个位置，修订版与初稿实质相同。其四，生产者与批评者立场来回反转：上一轮肯定的点下一轮被否定，结论没有累积方向。<\/p>\n<p>收敛的反向条件因此明确：标准单一且可对照、结论有外部证据支撑、每条批评指向具体可改位置、历史结论保留并累积。轮次上限是兜底而不是收敛手段——它保证循环退出，但退出时保留的可能只是当前最优版，未达标的部分要转人工或补证据。<\/p>\n<p>历史膨胀可以用量级描述。设第 <span class=\"katex-inline\">k<\/span> 轮带入上下文的内容为初稿 <span class=\"katex-inline\">V_0<\/span>、各轮批评 <span class=\"katex-inline\">C_1 \\ldots C_k<\/span>、各版修订 <span class=\"katex-inline\">V_1 \\ldots V_k<\/span>，第 <span class=\"katex-inline\">k<\/span> 轮输入约等于这些内容之和；轮次越多，单轮携带的历史越长。长循环应在第二、三轮后把早期版本摘要化，只保留当前版、未解决缺陷与关键证据，否则上下文窗口先于质量改善被填满。<\/p>\n<h2>补充算例：带证据的代码反思回合<\/h2>\n<p>沿用阶乘函数案例，把证据类型补全。第 1 轮批评不能只看代码文本，可挂三类外部证据：运行测试（覆盖 0、正整数、负数三类输入）、静态检查（类型与异常处理）、规格对照（题目要求的边界条件是否齐全）。批评意见按证据编号引用，例如“负数分支未抛异常，对应测试用例 negative(-3) 未通过”，生产者据此定位修改位置。<\/p>\n<p>证据缺失的回合对照：若批评只能读到代码本身，无法运行测试，意见只能停留在命名与格式层面；此时循环多跑两轮，事实类缺陷仍留在稿中。工程落地时，批评环节可由另一个模型承担，使用独立系统提示与人设（如严谨事实核查员）；也可以由规则或测试工具承担可机械化核对的部分，模型负责主观质量维度。两类来源组合，比单一模型自审覆盖更全。<\/p>\n<p>反思与规划的衔接案例：批评在审阅初稿时发现“所需数据不存在于可访问范围”，这不是当前版本措辞问题，而是计划路径不可行；反思环节把问题上交到规划层重排，而不是继续在产出上打磨。判断分界：缺陷能靠修改当前产出消除，留在反思循环；缺陷来自任务分解或前提假设，进入重规划。<\/p>\n<p>历史裁剪的具体做法：第二轮结束后，把首轮初稿与首轮批评压缩成一行遗留问题清单，后续上下文只带当前版、遗留清单与关键证据；早期版本原文留存到外部记录，供回溯但不占当前窗口。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：“请改进”就是反思。<\/strong> 反证：没有可对照标准，改进方向随措辞漂移；反思的批评必须挂在逐条 rubric 上（PDF 第 61 页）。\n<\/li><li>\n<strong>误读：反思次数越多越好。<\/strong> 反证：无新证据的循环让模型自我迎合，历史膨胀还推高成本；边际收益递减后应停止（PDF 第 66 页）。\n<\/li><li>\n<strong>误读：生产者与批评者分开就不会有盲点。<\/strong> 反证：两者共享同一套偏见时分离角色不能消除系统性错误；盲点要靠外部证据或人工复核。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n反思四步（执行、评估、精炼、迭代）各自依赖什么前提？哪一步最容易失败？\n<\/li><li>\n两条收敛条件分别是什么？去掉轮次上限，标准模糊时会发生什么？\n<\/li><li>\n生产者—批评者分离缓解了哪种偏误？为什么补不上共享偏见造成的盲点？\n<\/li><li>\n用算例说明第 <span class=\"katex-inline\">k<\/span> 轮历史为什么逐轮膨胀；长循环应怎么裁剪上下文？\n<\/li><li>\n批评发现“计划路径不可行”时，反思应当把问题交给哪个后续模式处理？\n<\/ol>\n<h2>适用与不适用速查<\/h2>\n<p>适合反思的情况：输出质量优先于速度成本，有可逐条对照的标准，能取得测试、检索或计算等外部证据。不适合反思的情况：答案标准、单次生成已稳定，或批评无法获得任何外部依据；后者再跑循环只会增加措辞摆动。反思闭环要配轮次上限，长循环定期裁剪早期历史，避免窗口先于质量改善被填满。<\/p>\n<h2>第二个任务的端到端算例：产品发布公告的写作反思<\/h2>\n<p>估算口径（工程估算，非原书实测）：中文按约 1.6 字符/token；生成按 50 token/s，往返约 300 ms；窗口按 32768 token 估算。Producer 与 Critic 为两套独立提示，角色分离。<\/p>\n<p>任务：起草一份产品发布公告，生产者出初稿，批评者按事实准确性、约束符合度、语气分寸、信息完整度逐条审阅，生产者据此修订，直到意见清空或触达轮次上限。<\/p>\n<p>回合 1：<\/p>\n<ul><li>\n生产者：撰写提示约 200 token，产品要点材料约 600 token；初稿公告约 500 汉字 ≈ 310 token。\n<\/li><li>\n批评者：初稿 310 token + 审阅清单约 220 token；结构化意见（事实缺口 2 处、语气过满 1 处、缺发布日期 1 处）约 260 token。\n<\/li><li>\n修订版：初稿 310 + 批评意见 260 + 修订提示 180，输入约 750 token；二版公告约 330 token。\n<\/ul>\n<p>回合 2：批评者复核二版，残留意见约 120 token；生产者出三版，复核通过。<\/p>\n<p>量级估算：输入累计约 2530 token（首轮 800、修订 750、二轮回扣 450、复核与终稿回路另计），输出累计约 1020 token（初稿 310、一轮意见 260、二版 330、二轮意见 120）；每回合生成约 6–7 s，两回合约 28 s，另加往返。<\/p>\n<p>收敛判定：批评意见为空、或问题条目全部关闭即停止；轮次上限取 3 轮，到限仍有未关闭条目则转人工复核。震荡条件：批评标准逐回合漂移，或生产者只按字面调整措辞而不改事实内容，残留问题反复出现。可观测指标：平均回合数、每轮残留问题数、终稿人工通过率、触达轮次上限次数。<\/p>\n<h2>前提再拆一层<\/h2>\n<p>反思循环能成立，还依赖以下几条隐含前提；逐条抽掉后给出故障场景与可观测指标。<\/p>\n<ol><li>\n<strong>存在可对照的明确检查标准。<\/strong> 抽掉后：批评意见只能停留在语言措辞层面，事实与约束问题无从核对。可观测指标：意见中可执行修改点占比、标准缺失导致的空泛意见条数。\n<\/li><li>\n<strong>批评意见能回流到生成环节。<\/strong> 抽掉后：意见留在审阅记录里，初稿原样交付，闭环断开。可观测指标：意见落实率、二版改动与一轮意见的对应条数。\n<\/li><li>\n<strong>生产者与批评者角色或标准相互独立。<\/strong> 抽掉后：同一上下文自审，自己放过自己的问题。可观测指标：自审漏检率（与人工复核结果对比）、问题被放行条数。\n<\/li><li>\n<strong>循环有停止条件与轮次上限。<\/strong> 抽掉后：震荡空转，token 与延迟随回合无限增长。可观测指标：平均回合数、触达上限次数、每轮 token 增量。\n<\/li><li>\n<strong>批评所需证据可获得（可查材料、可运行代码）。<\/strong> 抽掉后：批评只能就文本挑错，事实类判断无依据。可观测指标：事实类意见占比、无证据意见条数。\n<\/li><li>\n<strong>反馈信号逐回合保持稳定。<\/strong> 抽掉后：标准来回变化，产物在两个方向间反复横跳。可观测指标：相邻回合意见重叠度、未解决问题反复出现次数。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "反思"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.73<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">提示链<\/a><\/span><\/div><h1>工具调用（Tool Use / Function Calling）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章 | <strong>原书位置<\/strong>：第 5 章《Tool Use (Function Calling)》（PDF 第 73 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>前几章的模式只编排模型之间的交互与内部信息流；模型自身受训练数据截止时间限制，不会算数、查不到最新信息、访问不到用户专属数据，也触发不了真实世界动作（PDF 第 73 页）。要让智能体真正与外部系统交互，必须有一条通道，把模型的意图翻译成可执行的外部调用，再把执行结果带回上下文。<\/p>\n<p>困难在于：模型不能直接运行代码或访问数据库，外部系统也不能直接理解自然语言。工具调用要解决的就是接口问题——模型输出结构化调用请求，由编排层拦截、执行、回传，形成“决定调用谁、传什么参数、拿到什么结果、下一步怎么办”的闭环。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：工具使用模式通常通过函数调用（Function Calling）实现，使智能体能够调用外部 API、数据库、服务甚至执行代码；核心大模型根据用户请求或任务当前状态，决定是否以及如何使用某个外部函数（PDF 第 73 页）。逐句拆开：<\/p>\n<ul><li>\n“工具定义”：向 LLM 描述外部能力，包括用途、名称、参数及其类型与说明（PDF 第 73 页）。\n<\/li><li>\n“LLM 决策”：模型收到用户请求与可用工具定义，判断是否需要调用一个或多个工具（PDF 第 73 页）。\n<\/li><li>\n“函数调用生成”：需要调用时，模型生成结构化输出（通常是 JSON），指明工具名称与从请求中提取的参数（PDF 第 73 页）。\n<\/li><li>\n“工具执行”：框架或编排层拦截该结构化输出，找到对应工具，用给定参数执行真实函数（PDF 第 73 页）。\n<\/li><li>\n“结果返回与再处理”：执行结果回传给智能体；模型把工具结果纳入上下文，生成最终回复，或决定继续调用工具、进行反思、直接作答（PDF 第 73 页）。\n<\/li><li>\n“工具宽于函数”：工具可以是传统函数，也可以是复杂 API 端点、数据库请求，甚至是发给另一个专用智能体的指令（PDF 第 73–74 页）。\n<\/ul>\n<p>正例：用户问“我上周的订单状态”，模型选择订单查询工具，传入用户标识与订单号，执行后把状态文本带回，再组织成自然语言回复。反例：模型不调用工具，凭训练记忆编造一个物流状态。<\/p>\n<h2>原理推导<\/h2>\n<p>工具调用闭环可按六个环节推导，每个环节的失败模式不同。<\/p>\n<p>环节一：工具定义。描述质量决定模型选得准不准。参数 schema 要窄：枚举值优于自由文本，必填与可选分清，类型写明确。工具描述之间边界清楚，避免功能重叠；工具清单过长时，模型在候选之间混淆的概率上升。<\/p>\n<p>环节二：决策。模型对照请求与工具说明判断是否需要调用、调用哪个。这一步依赖定义环节提供的信息；定义含糊，决策就只能猜。<\/p>\n<p>环节三：调用生成。模型产出 JSON 调用对象，包含工具名与参数。参数值从用户请求或上下文中提取；缺参数时应能表达“需要补充某参数”，而不是填一个猜测值。<\/p>\n<p>环节四：执行拦截。编排层解析结构化输出，做参数校验，再调用真实函数。这一层是模型与外部世界之间的边界：模型不直接获得执行权限，所有动作经过编排层放行。<\/p>\n<p>环节五：结果回传。工具输出回到上下文。失败返回必须可读：说明失败原因与可尝试的下一步，例如缺少哪个参数、哪类输入不被接受；返回空字符串或 null 会让模型无法区分“没有结果”和“调用失败”。<\/p>\n<p>环节六：再处理。模型基于结果决定收尾还是继续。一次任务可能串联多个工具调用，中间结果作为后续调用的输入；这一步与链式的状态传递衔接。<\/p>\n<p>机制上，函数调用是连接 LLM 推理能力与外部功能的技术桥梁（PDF 第 73 页）：推理留在模型侧，计算、检索、动作留在外部侧，结构化 JSON 是两侧的交换格式。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>工具调用适用：任务需要最新信息、模型不擅长的计算、用户专属数据或真实世界动作。工具设计原则：schema 窄、参数枚举化、描述清晰、工具幂等或可回滚、错误信息可读；权限按最小化配置，危险动作加审批。<\/p>\n<p>边界：工具描述重叠或清单过长时，模型乱选工具的概率上升，工具数量本身不等于能力。外部工具不稳定或返回延迟高时，调用链会被外部服务拖慢；需要超时、退避重试与降级路径。模型可能生成看似合法但越权的参数，参数校验与权限边界必须在编排层兜底，不能只靠模型自觉。<\/p>\n<p>条件去掉会怎样：去掉结构化调用，模型用自然语言描述“我想查订单”，外部系统无法执行；去掉可读错误，失败被静默吞掉，模型在缺失结果上继续作答；去掉权限边界，模型生成的任何参数都被放行，越权动作直达外部系统。<\/p>\n<h2>反例<\/h2>\n<p>工具失败静默返回的反例：查询工具超时后返回空结果，模型把“空”理解为“无订单”，回复用户“没有相关订单”，实际是调用未成功。正确做法是回传超时信息与可重试提示，让模型选择重试或告知用户稍后再查。<\/p>\n<p>工具堆叠的反例：一次性暴露二十个功能相近的检索工具，描述互相交叉，模型反复选错对象，结果准确率低于只保留两三个职责明确的工具。原书把工具定义作为闭环第一步，候选质量直接决定后续决策（PDF 第 73 页）。<\/p>\n<h2>辨析<\/h2>\n<p>与 RAG（c07）的差别：RAG 是专用的知识检索管线，切块、索引、召回、引用围绕文档问答展开；工具调用是通用动作通道，检索只是可挂载的一类工具。RAG 回答“材料从哪来”，工具调用回答“怎么触达外部能力”。<\/p>\n<p>与 MCP（第 3 章上下文协议）的差别：函数调用是一次具体的调用机制；MCP 标准化的是模型发现、连接和使用外部能力的接口方式。工具调用解决“这次怎么调”，协议解决“各类工具怎么统一暴露”。<\/p>\n<p>与护栏（c09）的差别：工具调用通道把动作送到外部；护栏在通道前后设置拦截，校验权限、参数与副作用。工具越权风险由护栏层兜底，而不是由工具自身承诺。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：结构化输出解析与单步提示调用。后继：工具调用是规划模式执行子任务的手段，也是多智能体之间委派任务的一种形态；RAG 作为知识型工具挂在闭环上；护栏（c09）在执行层约束工具权限。本概念把“定义—决策—生成—拦截—回传—再处理”的调用闭环与错误返回、权限边界的工程要求串在一起。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（工具调用）<\/summary><div class=\"depth-body\"><h1>工具调用（Tool Use / Function Calling）· 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>逐级倒查工具调用闭环成立的前提：<\/p>\n<ol><li>\n“模型选对工具”依赖工具定义清晰：用途、名称、参数类型与说明写在描述里；定义重叠或边界含糊，模型只能在候选之间猜。\n<\/li><li>\n“工具定义清晰”依赖候选职责可划分：每个工具的输入输出边界稳定，工具清单规模可控；清单过长会稀释每个定义的可见度。\n<\/li><li>\n“调用请求可被执行”依赖结构化交换格式：模型产出 JSON 调用对象，编排层据此定位工具并传参；自然语言描述无法被外部系统直接执行。\n<\/li><li>\n“执行安全可控”依赖编排层拦截：模型不直接获得执行权限，所有动作经编排层校验参数、边界与权限后放行。\n<\/li><li>\n“失败可恢复”依赖错误返回可读：回传失败原因与可尝试的下一步，模型才能换参数重试或换工具；返回空值则模型无法区分“无结果”与“调用失败”。\n<\/li><li>\n最底层假设：外部能力可以被描述成有限个可调用接口；需要开放式操作、无法参数化的动作，不能直接走工具通道。\n<\/ol>\n<p>逆推到读者基线：先认“外部能力能写成接口”，再认“接口调用走结构化请求”，最后认“失败能带信息回来”。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条按六个环节推进，每步写清假设：<\/p>\n<ul><li>\n环节一，工具定义。向 LLM 描述外部函数：用途、名称、参数及类型说明（PDF 第 73 页）。参数 schema 要窄，枚举优于自由文本，必填可选分清。用到的假设：描述质量直接决定候选可见度；描述重叠会导致乱选。\n<\/li><li>\n环节二，LLM 决策。模型对照请求与工具定义判断是否需要调用、调用哪个（PDF 第 73 页）。用到的假设：决策依据来自定义环节提供的信息；定义不足，决策只能猜。\n<\/li><li>\n环节三，函数调用生成。需要调用时模型生成 JSON，指明工具名与从请求中提取的参数（PDF 第 73 页）；缺参数时应表达“需要补充某参数”，而不是填猜测值。\n<\/li><li>\n环节四，执行拦截。编排层解析输出、做参数校验，再调用真实函数（PDF 第 73 页）。这一层是模型与外部世界的边界；权限、范围、白名单在此兜底。\n<\/li><li>\n环节五，结
