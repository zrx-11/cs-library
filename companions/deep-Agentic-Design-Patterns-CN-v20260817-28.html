><li>\n与反思的衔接：链式是单向推进，产物交给下游；反思把产物退回生成者形成闭环。实践中常见的组合是外层一条链，在质量要求高的步骤挂一个反思关卡，批评通过后再交下游。\n<\/ul>\n<h2>算例：会议纪要转待办<\/h2>\n<p>估算口径（工程估算，非原书测量值）：每步系统提示约 700 输入 token，材料与上一步产物另计；单步输出约 250 token；模型按 50 token/s 生成，网络往返约 300 ms；以下数字用于比较步数与量级，不代表某一具体模型的实测值。<\/p>\n<p>任务：把一份会议纪要转成按负责人分派的待办清单。<\/p>\n<p>第 1 步，抽取决议条目。<\/p>\n<ul><li>\n输入：系统提示“从纪要中抽取决议条目，每条含决议内容、负责人、截止时间，输出 JSON 数组”；纪要正文约 1200 token。\n<\/li><li>\n输出：JSON 数组，例如 <code>[{&quot;decision&quot;:&quot;Q3 上线内测&quot;,&quot;owner&quot;:&quot;王某&quot;,&quot;due&quot;:&quot;2026-09-15&quot;}]<\/code>，约 220 token。\n<\/li><li>\n代价：输入约 1900 token（700 提示 + 1200 纪要），输出约 220 token；生成约 4.4 秒，加往返约 4.7 秒。\n<\/li><li>\n校验：程序检查每条是否含三个必填字段；缺 <code>due<\/code> 即退回本步补抽，不进入第 2 步。\n<\/ul>\n<p>第 2 步，生成待办描述。<\/p>\n<ul><li>\n输入：系统提示“把每条决议改写成一句可执行待办，保留负责人与截止时间”；上一步 JSON 约 220 token。\n<\/li><li>\n输出：待办条目清单，约 260 token。\n<\/li><li>\n代价：输入约 920 token，输出约 260 token；生成约 5.2 秒，加往返约 5.5 秒。\n<\/li><li>\n校验：核对待办条数与第 1 步条目数一致；条数不一致说明发生合并或漏抽，退回第 1 步。\n<\/ul>\n<p>第 3 步，按负责人分派排序并成稿。<\/p>\n<ul><li>\n输入：系统提示“按负责人分组输出最终待办表”；第 2 步清单约 260 token。\n<\/li><li>\n输出：分组待办表，约 300 token。\n<\/li><li>\n代价：输入约 960 token，输出约 300 token；生成约 6 秒，加往返约 6.3 秒。\n<\/ul>\n<p>量级对照（估算口径同上）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>步骤<\/th><th>输入 token<\/th><th>输出 token<\/th><th>生成耗时<\/th><th>加往返<\/th><\/tr><\/thead><tbody><tr><td>1 抽取决议<\/td><td>约 1900<\/td><td>约 220<\/td><td>约 4.4 s<\/td><td>约 4.7 s<\/td><\/tr><tr><td>2 生成待办<\/td><td>约 920<\/td><td>约 260<\/td><td>约 5.2 s<\/td><td>约 5.5 s<\/td><\/tr><tr><td>3 分派成稿<\/td><td>约 960<\/td><td>约 300<\/td><td>约 6.0 s<\/td><td>约 6.3 s<\/td><\/tr><tr><td>合计<\/td><td>约 3780<\/td><td>约 780<\/td><td>约 15.6 s<\/td><td>约 16.5 s<\/td><\/tr><\/tbody><\/table><\/div>\n<p>若压成单条提示一次性完成，输入约 1900 token、输出约 350 token，token 与延迟更低，但纪要稍长就会漏字段；链式用多出来的 token 与时间换取每步可检查、出错可定位。失败分支：第 1 步抽不出负责人，按校验规则退回补抽一次，补抽一次的代价是第 1 步输入再加约 220 token 反馈意见、输出再约 200 token；仍缺失则标记为“待人工确认”，而不是让第 2 步编一个负责人。<\/p>\n<p>再做一次敏感性推算：若纪要从 1200 token 涨到 3000 token，单步方案的输入约束被材料撑大，漏抽概率进一步上升；链式第 1 步仍只承担抽取职责，第 2、3 步输入不受原始材料长度影响，膨胀被限制在第一步。这是链式在长材料上的结构性优势：上下文增长集中在固定步骤，而不是摊到整条链的每一步。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：步骤接口退回自由文本，第 2 步要从上一步段落里自己找负责人和截止时间，格式错误沿链放大。反例二：链条中某一步需要外部实时信息却没接工具，只能在过期上下文里推断。边界条件：任务路径可预先固定、产物可结构化时链式有效；需要现场探索路径的任务应交给规划（c06）；子任务无依赖时优先考虑并行（c03）。<\/p>\n<h2>延伸推演：链条长度与错误传播<\/h2>\n<p>链条每增加一步，失败点数量随之增加。设单步出错概率为 <span class=\"katex-inline\">p<\/span>，<span class=\"katex-inline\">n<\/span> 步串联且错误沿链传播时，整条链不出错的概率量级约为 <span class=\"katex-inline\">(1-p)^n<\/span>；<span class=\"katex-inline\">n<\/span> 越大，任一步出错的累积概率越高。这不是说拆步有害，而是说明链式的优化方向是控制步数：能合并的相邻步骤合并，必须独立校验的步骤保留。每一步的校验拦截把局部错误挡在当前步，避免它进入下游放大。<\/p>\n<p>错误传播的方向值得分清。上游产物缺字段，下游在残缺输入上作答，偏差被继承；上游格式混乱，下游要重新理解措辞，引入二次误解。结构化输出与逐步校验正是针对这两类传播：前者固定接口，后者提前拦截。链条中某一步需要外部信息时，该步接工具调用；工具失败不能由下游步骤自行消化，应在本步返回可读错误。<\/p>\n<p>链式与其他模式的组合边界：外层走链、内层在质量关卡挂反思；分支选择前置给路由；独立子任务从链中拆出走并行。判断一个任务落在哪种结构，先看步骤是否固定有序，再看是否存在分支选择与独立支线。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：链越长效果越好。<\/strong> 反证：每增加一步就多一个失败点，且步骤间传递会损失上下文；能合并的步骤合并后，单步提示仍在可承受约束范围内。原书三步示例本身就是最小必要拆分（PDF 第 28 页）。\n<\/li><li>\n<strong>误读：中间产物可以不校验，模型自己会传对。<\/strong> 反证：上一步格式混乱时，下一步要靠自然语言猜字段，格式错误沿链条放大；原书把结构化输出列为稳健多步系统的关键一环（PDF 第 28–29 页）。\n<\/li><li>\n<strong>误读：链式适合需要来回探索的任务。<\/strong> 反证：链式路线预先固定，遇到路径不明、需要现场判断下一步做什么的任务会被锁死；这类任务应走规划模式（c06）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n链式的“依赖链”具体指哪一步产物成为哪一步输入？如果去掉结构化格式，这条链在哪里最先断裂？\n<\/li><li>\n单提示五类失败中，哪几类是拆步可以缓解的，哪几类拆步后仍然存在？\n<\/li><li>\n写一条三步链，标出每步的输入字段、输出 schema 与校验规则。\n<\/li><li>\n为什么说链式买的是“可检查性”而不是“更少 token”？用算例的 token 量级说明。\n<\/li><li>\n子任务之间强耦合、拆开必然丢信息时，硬拆链条会出现什么后果？应改用什么模式？\n<\/ol>\n<h2>第二个任务的端到端算例：合同审阅→风险摘要→邮件草稿<\/h2>\n<p>估算口径（工程估算，非原书实测）：中文按约 1.6 字符/token 折算（即 1 token ≈ 1.6 个汉字），英文与代码按约 4 字符/token；生成速度按 50 token/s，网络往返约 300 ms；上下文窗口按 32768 token 估算占用比例。<\/p>\n<p>任务：把一份采购合同走完「条款抽取 → 风险摘要 → 对外邮件草稿」三步链。<\/p>\n<p>第 1 步，条款抽取。<\/p>\n<ul><li>\n提示骨架：系统提示要求抽取编号、原文摘录、类别三类字段，输出 JSON 数组，提示约 240 汉字 ≈ 150 token。\n<\/li><li>\n输入：合同正文约 4800 汉字 ≈ 3000 token；输入合计约 3150 token，占窗口约 9.6%。\n<\/li><li>\n输出：条款清单 JSON，约 600 汉字 ≈ 375 token；生成约 7.5 s，加往返约 7.8 s。\n<\/li><li>\n校验：程序逐条核对三个必填字段；缺“原文摘录”即退回本步补抽，不进入第 2 步。\n<\/ul>\n<p>第 2 步，风险摘要。<\/p>\n<ul><li>\n输入：上一步 JSON 约 375 token，风险判定提示约 180 token，合计约 555 token。\n<\/li><li>\n输出：风险条目（每条挂条款编号与风险点）约 450 汉字 ≈ 280 token；生成约 5.6 s，加往返约 5.9 s。\n<\/li><li>\n校验：每条风险必须回挂第 1 步的条款编号；挂不上编号的条目标记“待法务复核”，不进入邮件步。\n<\/ul>\n<p>第 3 步，邮件草稿。<\/p>\n<ul><li>\n输入：风险摘要约 280 token，邮件撰写提示约 200 token，合计约 480 token。\n<\/li><li>\n输出：对外沟通邮件约 350 汉字 ≈ 220 token；生成约 4.4 s，加往返约 4.7 s。\n<\/ul>\n<p>量级汇总（估算口径同上）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>步骤<\/th><th>输入 token<\/th><th>输出 token<\/th><th>生成耗时<\/th><th>加往返<\/th><\/tr><\/thead><tbody><tr><td>1 条款抽取<\/td><td>约 3150<\/td><td>约 375<\/td><td>约 7.5 s<\/td><td>约 7.8 s<\/td><\/tr><tr><td>2 风险摘要<\/td><td>约 555<\/td><td>约 280<\/td><td>约 5.6 s<\/td><td>约 5.9 s<\/td><\/tr><tr><td>3 邮件草稿<\/td><td>约 480<\/td><td>约 220<\/td><td>约 4.4 s<\/td><td>约 4.7 s<\/td><\/tr><tr><td>合计<\/td><td>约 4185<\/td><td>约 875<\/td><td>约 17.5 s<\/td><td>约 18.4 s<\/td><\/tr><\/tbody><\/table><\/div>\n<p>失败分支：第 1 步某条款缺失字段，退回补抽一次，补抽输入再加约 200 token 反馈意见、输出再约 180 token；两轮仍缺失则在产物中标注缺口，第 2 步不得为缺口补造条款。链条最大输入出现在第 1 步，原始合同长度膨胀被限制在这一步，后两步输入不随合同页数线性增长。<\/p>\n<h2>前提再拆一层<\/h2>\n<p>链式能成立，除正文已述的“任务可拆、接口结构化”外，还依赖以下几条隐含前提；逐条抽掉后给出故障场景与可观测指标。<\/p>\n<ol><li>\n<strong>模型在单步窄约束下指令跟随可靠。<\/strong> 抽掉后：一步同时要求抽取、判断、成稿，提示要求被漏掉，字段缺失率上升。可观测指标：单步字段完整率、被忽视的指令条数、退回补抽次数。\n<\/li><li>\n<strong>步骤间传递的信息足以支撑下游作答。<\/strong> 抽掉后：必要上下文留在被丢弃的原始材料里，下游在残缺输入上推断，结论偏离原意。可观测指标：下游引用上游字段的命中率、人工标注的上下文缺失条数。\n<\/li><li>\n<strong>产物格式可被规则解析。<\/strong> 抽掉后：上一步输出是混合段落，程序定位不到字段，校验规则挂不上。可观测指标：schema 解析成功率、格式错误拦截数。\n<\/li><li>\n<strong>任务路径可在运行前固定。<\/strong> 抽掉后：现场需要探索路线时，链条被锁死在预先写定的顺序上，中途转向无入口。可观测指标：运行时临时分支请求占比、中途被迫重规划次数。\n<\/li><li>\n<strong>每步产物可独立校验。<\/strong> 抽掉后：错误沿链传到末端才暴露，定位不到是哪一步偏离。可观测指标：各步拦截率、末端交付后返工条数。\n<\/li><li>\n<strong>上下文容量装得下单步材料。<\/strong> 抽掉后：长合同在输入侧被截断，抽取遗漏随篇幅上升。可观测指标：单步输入 token 占窗口比例、截断告警次数。\n<\/ol><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.40<\/div><h1>路由（Routing）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章 | <strong>原书位置<\/strong>：第 2 章《Routing》（PDF 第 40 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>真实系统收到的请求不是一种类型：客服场景里有查订单、问产品、报故障、意图含糊的咨询；不同类型需要不同的提示词、模型与工具组合。如果把所有请求塞进同一条固定流程，简单问题被复杂化，专业问题又被做浅。链式模式只能沿预定顺序推进，在需要根据输入条件动态选择分支的场景下适用性受限（PDF 第 40 页）。<\/p>\n<p>路由要解决的具体困难是：在执行任何专门处理之前，先判断请求属于哪一类，再把它导向对应的专用函数、工具或子流程。没有这一层，系统无法从固定执行路径切换到按条件选择的路径；而分类一旦出错，下游整条分支都在错误方向上消耗成本。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：路由在智能体运行框架中引入条件逻辑，使系统从固定执行路径转向根据特定标准动态评估、从一组候选后续动作中选择其一执行（PDF 第 40 页）。逐句拆开：<\/p>\n<ul><li>\n“条件逻辑”：分支选择依据环境状态、用户输入或前一步操作结果，而不是写死的顺序。\n<\/li><li>\n“一组候选后续动作”：候选可以是专门的问答智能体、数据库检索工具、排障指南链路或升级人工流程（PDF 第 40 页）。\n<\/li><li>\n“先分类再分派”：书中客服示例先分析查询、判断意图，再按“订单状态 / 产品信息 / 技术支持 / 意图不明”分别路由；意图不明时进入澄清链路（PDF 第 40 页）。\n<\/li><li>\n“评估机制”：路由的核心是一个负责评估并引导控制流的部件，原书列出四种实现：基于 LLM、基于嵌入、基于规则、基于训练好的判别式分类模型（PDF 第 41 页）。\n<\/ul>\n<p>正例：用户说“我的包裹到哪了”，分类为订单状态，进入订单数据库链路；用户说“这个零件兼容哪款型号”，分类为产品信息，进入产品目录检索；措辞含糊时进入追问分支。反例：不做分类，所有问题都走同一条长提示，既查订单又查目录又给排障建议。<\/p>\n<h2>原理推导<\/h2>\n<p>路由机制可以拆成分类、置信度判断、分派、兜底四个环节逐步推导。<\/p>\n<p>环节一：分类。评估机制把输入映射到一组互斥标签。四种实现的差别在判断依据：基于规则的路由用 if-else、switch 匹配关键词、模式或结构化数据，快且确定，但对细微差别和全新输入灵活性弱；基于嵌入的路由把查询转向量，与各路径对应的嵌入做相似度比较，适合按语义分流；基于 LLM 的路由直接让模型输出类别标识符；基于机器学习模型的路由用少量标注语料监督微调出专用分类器，决策逻辑编码在模型权重里，推理时不再跑生成式提示（PDF 第 41 页）。<\/p>\n<p>环节二：置信度判断。分类输出不能只看命中的标签，还要看分类把握。LLM 路由可以要求模型给出类别与把握程度；规则路由在关键词只部分命中时记为低把握；嵌入路由用相似度距离与阈值比较。把握低于阈值的请求，不强行分派，进入兜底。这一步用到的假设是：存在边界样本，任何分类器都会把它们分错，而错误分派的代价高于暂缓处理。<\/p>\n<p>环节三：分派。拿到确定标签后，控制流进入对应分支；每个分支内部可以是一条提示链（c01）、一组工具调用（c05）或一个子智能体。路由本身只负责“送到哪里”，不负责分支内部怎么做。<\/p>\n<p>环节四：失败回退。兜底分支承担三类情况：意图不明、置信度不足、标签集合覆盖不到。书中客服示例把“意图不明确”路由到澄清智能体或提示链，先反问补全信息（PDF 第 40 页）。回退分支保证分类失败时系统不会卡死或误派。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>路由适用的前提：候选分支之间处理方式差异明显，分类标准可以被写成标签集合；流量中确实存在多类请求，单条流程无法兼顾。标签设计要求互斥且覆盖真实流量：互斥避免一个请求同时进两条分支，覆盖保证长尾请求有处可去。<\/p>\n<p>边界：请求类别很少、处理流程基本一致时，路由增加一次额外分类调用，收益抵不过开销。类别边界模糊、分类错误代价极高（例如直接触发不可逆动作）时，应把低置信度样本留在人工复核，而不是自动分派。规则路由面对新说法会失效；LLM 路由成本更高、输出格式需要约束；嵌入与微调分类器需要样本与维护成本。<\/p>\n<p>条件去掉会怎样：去掉兜底分支，低置信度请求被硬分到最近标签，错误分派沿分支放大；去掉置信度阈值，分类器在边界样本上的误判直接进入执行；标签不互斥，同一请求触发多条分支，结果互相冲突。<\/p>\n<h2>反例<\/h2>\n<p>只按关键词路由的反例：同一词汇在不同语境下意图不同，例如“退款”既可能是订单售后，也可能是咨询产品退货政策；关键词命中“退款”就派给售后链路，会把政策咨询误带进工单流程。原书也指出规则路由对细微差别和全新输入灵活性较弱（PDF 第 41 页）。<\/p>\n<p>不设兜底的反例：四类标签之外的新问题被默认塞进第一个分支，模型在陌生分支里凑答案，既延误处理又产生误导性回复。<\/p>\n<h2>辨析<\/h2>\n<p>与链式（c01）的差别：链式规定步骤顺序，路由规定分支归属。一个完整系统通常先路由分诊，再在各分支内部走链式流程；路由决定“走哪条链”，链负责“按什么顺序做”。<\/p>\n<p>与并行化（c03）的差别：路由是互斥选择，一个请求只进一条分支；并行是同时启动多条独立子任务，最后合并结果。路由排除其他分支，并行叠加其他分支。<\/p>\n<p>与规划（c06）的差别：路由在有限的预设标签之间做静态选择；规划面向开放目标，需要现场生成行动序列，标签集合事先并未给全。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：单步提示调用与结构化输出解析。后继：路由是并行化分支分派的前置判断，也是多智能体系统中管理者智能体分配任务的简化形态；工具调用（c05）作为各分支可调用的外部能力存在；护栏（c09）可以在路由前后拦截不合规输入。本概念把“条件分支”这一控制流机制与分类置信度、失败回退的工程要求串在一起。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（路由）<\/summary><div class=\"depth-body\"><h1>路由（Routing）· 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>逐级倒查路由机制成立的前提：<\/p>\n<ol><li>\n“分派到正确分支”依赖分类结果可信：标签集合必须互斥，一个请求只对应一个主标签；同时标签要覆盖真实流量，长尾请求有处可去。\n<\/li><li>\n“分类结果可信”依赖分类把握可被判断：系统需要知道分类器是高把握还是边界样本，否则低置信度请求也会被自动分派。\n<\/li><li>\n“置信度可判断”依赖输入特征能映射到标签：规则路由靠关键词与模式，嵌入路由靠语义距离，LLM 路由靠模型理解，分类器靠训练好的判别边界（PDF 第 41 页）。\n<\/li><li>\n“特征可映射”再往前依赖候选分支可枚举：分支清单在设计时确定，路由只是在既有清单里选；开放目标、没有候选清单的任务不适用路由。\n<\/li><li>\n最底层假设：同一类请求的处理方式确实相似，不同类请求的处理方式确实差异明显。如果各类请求走下来是同一套流程，分类就不产生价值。\n<\/li><li>\n工程前提：兜底分支存在且可承接低把握样本；没有兜底，分类失败的代价全部压在自动分派上。\n<\/ol>\n<p>逆推到读者基线：先认“请求可以归成几类”，再认“每类有对应分支”，最后认“拿不准时有地方退回”。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条分四步，每步写清假设：<\/p>\n<ul><li>\n第一步，分类。评估机制把输入映射到互斥标签。原书列出四种实现：基于 LLM 的路由让模型输出类别标识符；基于嵌入的路由把查询转向量，与各路径嵌入比相似度；基于规则的路由用 if-else、switch 匹配关键词、模式或结构化数据；基于机器学习模型的路由用少量标注语料监督微调出判别分类器，决策编码在权重里，推理时不再跑生成提示（PDF 第 41 页）。用到的假设：标签边界在所选实现上可分；规则可分性弱，嵌入与分类器需要样本或向量质量支撑。\n<\/li><li>\n第二步，置信度判断。LLM 路由可要求模型给出类别与把握程度；规则路由在关键词部分命中时记为低把握；嵌入路由用相似度距离对照阈值。把握低于阈值的请求不强行分派。用到的假设：存在边界样本，任何分类器都会误判，而错误分派代价高于暂缓处理。\n<\/li><li>\n第三步，分派。确定标签后控制流进入对应分支；分支内部可以是提示链（c01）、工具调用（c05）或子智能体。路由只负责送到哪里，不负责分支内部做法。\n<\/li><li>\n第四步，失败回退。兜底承接意图不明、置信不足、标签覆盖不到三类情况；原书客服示例把“意图不明确”路由到澄清智能体或提示链，先反问补全信息（PDF 第 40 页）。\n<\/ul>\n<p>限定条件拆解：<\/p>\n<ul><li>\n史料：客服示例的标签为订单状态、产品信息、技术支持、其他/意图不明，分别对应订单数据库链路、产品目录检索、排障指南或升级人工、澄清链路（PDF 第 40 页）。\n<\/li><li>\n推断：置信度阈值取多少，取决于错派代价与人工成本的权衡；原书未给固定阈值，这一权衡是工程推断。\n<\/li><li>\n边界：规则路由快且确定，但对新说法与细微差别灵活性弱；LLM 路由成本更高，输出格式需要约束；嵌入与微调分类器需要样本维护（PDF 第 41 页）。\n<\/ul>\n<h2>机制逐项对照<\/h2>\n<ul><li>\n与链式：链式规定步骤顺序，路由规定分支归属。完整系统通常先路由分诊，再在分支内走链；路由决定“走哪条链”，链负责“按什么顺序做”。\n<\/li><li>\n与并行：路由互斥选择，一个请求只进一条分支；并行同时启动多条独立支线再合并。路由排除其他分支，并行叠加其他分支。\n<\/li><li>\n与规划：路由在有限预设标签间做静态选择；规划面向开放目标现场生成行动序列，标签集合事先未给全。\n<\/li><li>\n失败位置：路由失败集中在分类环节，分错则整条分支走偏；兜底分支是分类失败的回收口。\n<\/ul>\n<h2>算例：客服请求分诊<\/h2>\n<p>估算口径（工程估算，非原书测量值）：路由分类调用系统提示约 600 输入 token，请求文本约 150 token；分类输出标签约 20 token；模型按 50 token/s 生成，往返约 300 ms；以下为量级比较。<\/p>\n<p>任务：客服入口对四类请求分诊。<\/p>\n<p>路由决策表：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>请求样例<\/th><th>分类依据<\/th><th>标签<\/th><th>进入分支<\/th><th>把握<\/th><\/tr><\/thead><tbody><tr><td>“我的包裹到哪了”<\/td><td>订单状态词 + 物流意图<\/td><td>订单状态<\/td><td>订单数据库工具链<\/td><td>高<\/td><\/tr><tr><td>“这个零件兼容哪款型号”<\/td><td>产品属性咨询<\/td><td>产品信息<\/td><td>产品目录检索链<\/td><td>高<\/td><\/tr><tr><td>“系统报错登不上”<\/td><td>故障描述<\/td><td>技术支持<\/td><td>排障指南链 / 升级人工<\/td><td>中<\/td><\/tr><tr><td>“能不能退”（无上下文）<\/td><td>关键词命中但意图两可<\/td><td>低置信<\/td><td>澄清分支<\/td><td>低<\/td><\/tr><\/tbody><\/table><\/div>\n<p>第 1 步，分类调用：输入约 750 token，输出标签与把握约 30 token；生成约 0.6 秒，加往返约 0.9 秒。 第 2 步，分派：高把握样本直接进入对应分支；中把握样本进入技术支持链并标注“必要时升级”；低把握样本进入澄清分支，反问“是想查订单售后，还是咨询退货政策”。 第 3 步，兜底回收：澄清后仍无法归类的请求转人工队列，不自动进业务分支。<\/p>\n<p>量级对照：分类调用本身只占整条客服链路很小一段；真正的成本在分支内部。路由的价值是避免所有请求都走一条长提示——那条长提示既要查订单又要查目录又给排障建议，单步约束膨胀。敏感性推算：若流量出现新类别（如投诉），标签集未覆盖，样本会落入兜底；需要先补标签与分支，再观察兜底比例是否下降。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：只按关键词路由，“退款”既可能是售后工单也可能是政策咨询，关键词命中即派售后链路，把政策咨询误带进工单流程。反例二：不设兜底，四类之外的新问题被塞进第一个分支，模型在陌生分支凑答案。边界：类别少、流程一致时，额外分类调用的收益抵不过开销；分类错误代价极高的场景，低置信度样本应留在人工复核。<\/p>\n<h2>延伸推演：路由成本与误派代价<\/h2>\n<p>把路由放回成本结构里对比。设全部请求走一条“全包长提示”：该提示要同时描述订单、产品、技术支持三类处理流程，系统提示随分支数量线性变长；每类请求都携带与其无关的流程说明，输入 token 被无效约束占满。加一层路由后，主分类调用只输出标签，分支提示各自简短。粗估：全包方案单请求系统提示约 2000 token；路由方案分类调用约 600 token，加命中分支提示约 500 token，合计约 1100 token。路由用一次额外分类调用，换走分支内提示的收窄。<\/p>\n<p>误派代价要单独核算。设错派到无关分支后，下游仍会消耗一次分支调用与工具往返，才在分支内发现对不上；这次浪费约等于一次分支处理成本，再加一次返工回到正确分支。低置信度样本若硬分派，误派概率随边界样本比例上升；兜底分支只承担澄清或转人工，成本低于错误返工。<\/p>\n<p>四种实现的工程对照（依据原书第 41 页分类）：规则路由延迟最低、确定性最强，但新说法与细微差别覆盖弱；嵌入路由按语义距离分流，需要嵌入模型与阈值标定；LLM 路由理解最灵活，但每次多一次生成调用、输出格式要约束；微调分类器离线训练、推理便宜，但需要标注语料与再训练周期。选型不是选“最强”，而是在流量规模、表述稳定性、延迟预算之间匹配：表述稳定、流量大的场景偏向规则或分类器；说法多变、样本少的场景偏向 LLM 或嵌入。<\/p>\n<h2>补充算例：澄清分支的二次分诊<\/h2>\n<p>低置信度请求进入兜底后，流程不是直接转人工结束，而是先走一次澄清反问，再做二次分类。示例：用户输入“能不能退”，首轮分类在“售后工单”与“政策咨询”之间把握不足，进入澄清分支；澄清问题为“您是已经收到货想办理退货，还是想了解退货规则”。用户回复后，二次分类带上下文进入对应分支。<\/p>\n<p>量级对照（估算口径同上）：澄清分支多一次反问调用，输入约 500 token、输出约 80 token，往返约 0.3 秒；这笔成本低于误派到工单链路后的返工——误派分支内一次处理调用加工具往返约等于一次完整分支成本，再加一次回到正确分支的二次分派。边界样本比例越高，兜底与澄清的投入越划算。<\/p>\n<p>边界案例补充：新类别首次出现时必然落入兜底，标签集不覆盖；观察兜底流量聚类，某类请求重复出现且处理方式稳定后，再把它提升为独立标签。标签冲突案例：一条请求同时含订单与产品线索，规则按首个关键词判定，LLM 路由按整体意图判定，两者结论不同；此时以分支代价为准，代价高的分支要求更高把握，把握不足仍走兜底。路由评估要单独统计分类准确率、误派率与兜底比例，不能只看下游任务成功率，因为分类错误会被下游结果掩盖。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：关键词匹配就够做路由。<\/strong> 反证：同一词在不同语境意图不同；原书也指出规则路由对细微差别和全新输入灵活性较弱（PDF 第 41 页）。语义相近说法需要嵌入或 LLM 路由覆盖。\n<\/li><li>\n<strong>误读：路由标签越多越精细越好。<\/strong> 反证：标签过多会让边界样本比例上升，分支维护成本增加；标签应互斥且覆盖真实流量，长尾先收进兜底再观察是否值得独立成支。\n<\/li><li>\n<strong>误读：低置信度也可以先派出去再说。<\/strong> 反证：错误分派比暂缓处理更贵，下游整条分支在错误方向消耗成本；低把握样本应走澄清或人工，而不是赌一个最近标签。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n路由的四个环节（分类、置信度、分派、兜底）各自失败时，系统表现有什么不同？\n<\/li><li>\n四种路由实现各自依赖什么输入条件？规则路由在什么任务上会失效？\n<\/li><li>\n标签互斥与标签覆盖分别解决什么问题？只满足一条会出现什么情况？\n<\/li><li>\n用算例中的决策表，说明低置信度请求为什么不能直接进入业务分支。\n<\/li><li>\n路由与规划都做“选择下一步”，二者的候选集合有什么本质差别？\n<\/ol>\n<h2>适用与不适用速查<\/h2>\n<p>适合路由的情况：请求可归成有限几类，各类处理流程差异明显，流量中有稳定的类别分布。不适合路由的情况：类别边界无法写清、标签集合需要随任务现场生成，或各类请求最终走同一套流程；后两类应分别考虑规划模式或单链路处理。兜底分支不是摆设，它承接低把握样本与未覆盖类别，是路由可靠性的组成部分。<\/p>\n<h2>第二个任务的端到端算例：五类用户意图分类<\/h2>\n<p>估算口径（工程估算，非原书实测）：中文按约 1.6 字符/token，提示与 JSON 结构另计；分类环节单轮模型生成按 50 token/s，往返约 300 ms；窗口占用按 32768 token 估算。<\/p>\n<p>任务：客服入口把请求分进五类——账单查询、故障报修、功能咨询、投诉升级、退款申请；分类器先给意图与置信度，再分派到对应分支。<\/p>\n<p>分类提示骨架：五类定义与输出格式约 320 汉字 ≈ 200 token；要求输出 <code>{intent, confidence, rationale}<\/code> 的 JSON。<\/p>\n<p>样本走查：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>用户消息（摘要）<\/th><th>判定意图<\/th><th>置信度<\/th><th>下游分支<\/th><\/tr><\/thead><tbody><tr><td>“我这个月被扣了两笔钱”<\/td><td>账单查询<\/td><td>0.91<\/td><td>账单核对链路<\/td><\/tr><tr><td>“打印机报 E-3 错误代码”<\/td><td>故障报修<\/td><td>0.88<\/td><td>排障指南链路<\/td><\/tr><tr><td>“怎么导出 Excel 报表”<\/td><td>功能咨询<\/td><td>0.79<\/td><td>产品文档检索<\/td><\/tr><tr><td>“三天没人回，我要投诉到消协”<\/td><td>投诉升级<\/td><td>0.95<\/td><td>人工升级坐席<\/td><\/tr><tr><td>“货不对板要退货”<\/td><td>退款申请<\/td><td>0.83<\/td><td>退款流程链路<\/td><\/tr><tr><td>“你们那个东西……不太对”<\/td><td>待定<\/td><td>0.42<\/td><td>澄清分支<\/td><\/tr><\/tbody><\/table><\/div>\n<p>单步代价：提示骨架约 200 token，用户消息平均 60 汉字 ≈ 38 token，分类 JSON 输出约 60 token；输入约 238 token，输出约 60 token；分类生成约 1.2 s，加往返约 1.5 s。<\/p>\n<p>误判成本对照：投诉升级被误分进功能咨询，情绪类请求进入自助文档链路，需要二次往返且升级感加重；账单查询被误分进退款申请，可能触发不该走的退款流程。回退路径：置信度低于阈值（示例取 0.70）走澄清分支，追问后仍低于阈值转人工坐席；不把低置信样本硬分进最接近的一类。实现上可规则先行（“扣费、发票”等关键词先走账单候选），嵌入相似度兜底，LLM 复核落在边界样本上。<\/p>\n<h2>前提再拆一层<\/h2>\n<p>路由能成立，还依赖以下几条隐含前提；逐条抽掉后给出故障场景与可观测指标。<\/p>\n<ol><li>\n<strong>类别集合封闭且定义互斥。<\/strong> 抽掉后：一条请求同时跨两类，路由没有唯一归宿，分派结果随措辞波动。可观测指标：跨类标注占比、分类歧义样本条数。\n<\/li><li>\n<strong>分类置信度与真实正确率同向。<\/strong> 抽掉后：高置信误判直接进入高成本分支，回退阈值失去过滤作用。可观测指标：按置信度分档的实测准确率、误派率。\n<\/li><li>\n<strong>每类下游分支具备对应处理能力。<\/strong> 抽掉后：分类正确，分支却做不了这件事，请求在分支内再次转派。可观测指标：分支内一次解决率、分支间转派率。\n<\/li><li>\n<strong>存在明确的澄清与人工回退路径。<\/strong> 抽掉后：低置信样本被塞进最像的类别，错误一路带到末端。可观测指标：低置信占比、回退路径流量、回退后解决率。\n<\/li><li>\n<strong>评测集覆盖真实意图分布。<\/strong> 抽掉后：离线样本偏常见类别，线上长尾意图误判率高。可观测指标：离线分类准确率与线上抽样一致率、长尾类别召回率。\n<\/li><li>\n<strong>分类环节本身成本可控。<\/strong> 抽掉后：每请求都走重模型分类，延迟与 token 成本压过专用分支收益。可观测指标：分类环节 p50/p95 延迟、单请求分类 token 成本。\n<\/ol><\/div><\/details>", "c03": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.50<\/div><h1>并行化（Parallelization）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章 | <strong>原书位置<\/strong>：第 3 章《Parallelization》（PDF 第 50 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>当一批子任务彼此不依赖时，串行排队会把等待时间累加起来：多条 LLM 调用、多次工具使用、甚至多个子智能体依次执行，整体响应时间等于各步耗时之和。原书指出，并行化通过并发执行多个组件来改善系统效率与响应能力，尤其在涉及多次模型调用或高度依赖外部服务的场景中（PDF 第 50、51 页）。<\/p>\n<p>另一类困难是单次生成的随机性：同一问题只跑一遍，偶发错误无法被察觉。需要多次求解后交叉比对，才能判断结果是否稳健。串行跑多遍虽然也能得到多个答案，但耗时随遍数线性增长，并行才有实际意义。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：并行化识别出彼此独立、可同时推进的子任务，并发执行 LLM 调用、工具使用或整个子智能体，结果在后续汇聚点合并（PDF 第 50、52 页）。逐句拆开：<\/p>\n<ul><li>\n“彼此独立”：子任务之间没有数据依赖，一个子任务的输入不依赖另一个子任务的输出；共享状态或顺序依赖是不能并行的硬约束。\n<\/li><li>\n“并发执行”：多个组件同时推进，而不是等前一个返回后再启动后一个。\n<\/li><li>\n“汇聚点合并”：并行结果在图中的后续收敛点聚合，而不是各自直接交给用户（PDF 第 52 页）。\n<\/li><li>\n书中区分两类用法：分段并行把长文档或批量条目切块、分块处理；投票并行对同一问题多次求解，再汇总多数意见或做交叉验证（PDF 第 50–51 页）。\n<\/ul>\n<p>正例：一批用户反馈同时跑情感分析、关键词抽取、分类与紧急程度识别；一篇长文档分块分别总结，再合并去重。反例：先算出合计再拆分核对合计，两步有依赖，不能并行；要求后一步参考前一步结论时强行并发，得到的是互不衔接的片段。<\/p>\n<h2>原理推导<\/h2>\n<p>并行化的收益与代价可以从延迟、token、聚合三条机制推导。<\/p>\n<p>机制一：墙钟延迟由最慢子任务决定。设 <span class=\"katex-inline\">m<\/span> 个独立子任务串行执行，单任务平均耗时 <span class=\"katex-inline\">t<\/span>，串行总延迟为 <span class=\"katex-inline\">m \\cdot t<\/span>；理想并发下总延迟约为 <span class=\"katex-inline\">\\max_i t_i<\/span>，即最慢的那个子任务决定整体等待时间。并行缩短的是墙钟时间，不是把工作本身消失。原书把降低整体延迟、提升响应能力列为并行化的核心收益（PDF 第 51 页）。<\/p>\n<p>机制二：token 总量不减少，通常反而增加。每个子任务都要携带自己的提示模板与必要上下文，投票并行还要重复相同任务 <span class=\"katex-inline\">k<\/span> 遍。设单任务输入 <span class=\"katex-inline\">I<\/span> token、输出 <span class=\"katex-inline\">O<\/span> token，<span class=\"katex-inline\">m<\/span> 个子任务并行的 token 消耗约为 <span class=\"katex-inline\">m(I+O)<\/span>，加上汇总步的读取开销；串行单任务若能一次完成，总 token 更低。并行买的是时间与稳健性，不是成本。<\/p>\n<p>机制三：聚合策略与冲突解决。分段并行的聚合做合并、去重、排序与冲突消解；投票并行的聚合按多数表决、一致性检验或交叉比对确定答案。聚合规则必须事先写清：两条片段结论矛盾时以哪份为准、重复信息如何合并、票型接近时如何升级复核。原书明确子任务在汇聚点聚合（PDF 第 52 页），没有聚合规则的并行只会把矛盾结果原样推给用户。<\/p>\n<p>机制四：并发度受外部配额约束。并行启动的子任务都要消耗模型调用额度与外部服务吞吐；并发数超过接口限流上限时，多余请求排队或被拒绝，墙钟收益被排队时间吃掉。工程上要设置并发上限与队列，让并发度贴着可承受的吞吐边界走，而不是把所有子任务同时放出。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>并行成立的条件：子任务输入可独立准备；子任务之间无共享可变状态；聚合时所需信息都包含在各自产物里。适合批量反馈处理、长文档分块总结、多视角评审、多解投票等场景。<\/p>\n<p>边界：子任务有先后依赖时，必须保留串行顺序；上下文必须跨子任务共享时，先做信息汇总再分发，避免每个分支各执一词。外部服务有速率限制或配额约束时，并发度要受限于吞吐上限，超过配额只会触发排队或报错。投票并行在答案主观、标签分散的任务上，多数意见未必更可靠，此时投票只起到暴露分歧的作用。<\/p>\n<p>条件去掉会怎样：去掉独立性检查，把有依赖的步骤并发，下游拿到的是未经上游确认的中间值，错误不会被顺序保护拦下；去掉聚合冲突规则，并行产物互相矛盾地并列输出；去掉并发上限，外部接口被打满，整体延迟反而恶化。<\/p>\n<h2>反例<\/h2>\n<p>把串行依赖硬并行的反例：内容生成步依赖大纲步的结构，两步同时开工，生成步只能凭猜测写结构，最后与大纲对不上，返工量超过串行。<\/p>\n<p>投票并行被误用的反例：在模型本身缺乏领域知识的问题上重复跑五遍，五次都在同一处出错，多数表决把错误结论“合法化”；投票只能降低单次随机性，不能弥补知识缺口，知识缺口要靠检索（c07）或工具（c05）补。<\/p>\n<h2>辨析<\/h2>\n<p>与链式（c01）的差别：链式步骤排队、产物传递；并行子任务同时开工、产物汇聚。链式优化的是顺序正确性，并行优化的是吞吐与延迟。<\/p>\n<p>与路由（c02）的差别：路由选择一条分支，互斥；并行启动多条分支，叠加。路由的分支之间通常也互不依赖，但路由的语义是“只走一条”，并行的语义是“都要做”。<\/p>\n<p>与多智能体协作（c08）的差别：并行化是执行层的并发手段，子任务可以是同模型多次调用；多智能体是角色与协议层的分工，通信、角色边界与汇总责任是其核心。多智能体内部常嵌套并行，但并行本身不等于多智能体。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：链式的步骤拆分与结构化产物。后继：并行化是多智能体并行处理、专家团队分工的底层执行机制；反思循环中的批评与多视角评审可以用投票并行组织；规划（c06）把可并发的子任务标注为并行组。本概念把“独立性判断—并发执行—聚合冲突解决”这条链路与延迟、token 的成本结构串在一起。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（并行化）<\/summary><div class=\"depth-body\"><h1>并行化（Parallelization）· 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>逐级倒查并行化成立的前提：<\/p>\n<ol><li>\n“并发执行能缩短整体等待”依赖子任务之间独立：一个子任务的输入不依赖另一个子任务的输出，也不读写同一可变状态。存在数据依赖时，并发只能拿到未经上游确认的中间值。\n<\/li><li>\n“子任务独立”依赖输入可独立准备：每个子任务所需材料在开工前就能切分好，不需要等其他子任务跑完再拼装。\n<\/li><li>\n“产物可聚合”依赖最终有明确的汇聚点：并行结果在收敛点合并、去重、消解冲突，而不是各自直接交给用户。没有聚合规则，并行只把矛盾结果原样推出。\n<\/li><li>\n“聚合规则可写”依赖子任务产物格式确定：分段并行产物是可比较的片段，投票并行产物是可计数的候选答案；格式不定，去重与表决都无法落地。\n<\/li><li>\n“并发不压垮外部服务”依赖并发度受配额约束：模型调用与外部接口都有吞吐上限，超过上限多余请求排队或被拒，墙钟收益被排队时间吃掉。\n<\/li><li>\n最底层假设：把工作切给多个并发执行体的协调成本，低于串行排队等待的时间成本；协调成本过高时，并行不划算。\n<\/ol>\n<p>逆推到读者基线：先认“哪些子任务互不依赖”，再认“产物怎么合并”，最后认“并发开到多大”。独立性判断不过关，后面两步都不必做。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条分四步，每步写清假设与公式：<\/p>\n<ul><li>\n第一步，延迟分解。设 <span class=\"katex-inline\">m<\/span> 个独立子任务，单任务耗时 <span class=\"katex-inline\">t_i<\/span>。串行总延迟为 <span class=\"katex-inline\">\\sum_{i=1}^{m} t_i<\/span>；理想并发下总延迟约为 <span class=\"katex-inline\">\\max_i t_i<\/span>，即最慢子任务决定整体等待时间。用到的假设：并发执行体之间无排队、无资源争用；实际系统中并发度有限，等待时间介于串行与理想并发之间。原书把降低整体延迟、提升响应能力列为并行化核心收益（PDF 第 51 页）。\n<\/li><li>\n第二步，token 核算。设单任务输入 <span class=\"katex-inline\">I<\/span> token、输出 <span class=\"katex-inline\">O<\/span> token，<span class=\"katex-inline\">m<\/span> 个子任务并行的 token 消耗约为 <span class=\"katex-inline\">m(I+O)<\/span>，再加汇总步读取开销。串行单任务若能一次完成，总 token 更低；并行买时间与稳健性，不买成本。用到的假设：各子任务上下文不重复计入汇总；若重复携带公共材料，token 还会更高。\n<\/li><li>\n第三步，聚合策略。分段并行做合并、去重、排序与冲突消解；投票并行按多数表决、一致性检验或交叉比对定答案。冲突规则事先写清：两条片段结论矛盾时以哪份为准，重复信息如何合并，票型接近时如何升级复核。原书明确子任务在汇聚点聚合（PDF 第 52 页）。\n<\/li><li>\n第四步，并发上限。设置并发数与队列，让并发度贴着可承受吞吐边界走；外部服务限流时优先保护接口稳定，而不是把所有子任务同时放出。\n<\/ul>\n<p>限定条件拆解：<\/p>\n<ul><li>\n史料：书中列出两类用法——分段并行（长文档切块分别总结）与投票并行（同一问题多次求解后取多数或交叉验证）；反馈批量场景可同时跑情感分析、关键词抽取、分类与紧急程度识别（PDF 第 50–51 页）。\n<\/li><li>\n推断：延迟节省比例取决于最慢子任务与串行总和的差距；子任务耗时越不均，理想并发相对串行的节省越明显。这是机制推断，原书未给实测比值。\n<\/li><li>\n边界：上下文必须跨子任务共享时，应先汇总信息再分发；外部服务有配额时并发度受限。\n<\/ul>\n<h2>机制逐项对照<\/h2>\n<ul><li>\n与链式：链式步骤排队、产物传递；并行子任务同时开工、产物汇聚。链式优化顺序正确性，并行优化吞吐与延迟。\n<\/li><li>\n与路由：路由选择一条互斥分支；并行启动多条叠加支线。路由的分支之间通常也互不依赖，但语义是“只走一条”，并行是“都要做”。\n<\/li><li>\n与多智能体：并行化是执行层并发手段，子任务可以是同模型多次调用；多智能体是角色与协议层分工，含独立上下文、消息通道与汇总责任。多智能体内部常嵌套并行。\n<\/li><li>\n失败位置：并行失败集中在聚合环节，冲突未消解则结果并列矛盾；独立性误判导致的错误则在下游暴露，且没有串行顺序保护兜底。\n<\/ul>\n<h2>算例一：长文档分块总结<\/h2>\n<p>估算口径（工程估算，非原书测量值）：每块总结提示约 500 输入 token，单块材料约 1000 token；单块输出约 200 token；模型按 50 token/s 生成，往返约 300 ms；并发上限先按 5 估计。<\/p>\n<p>任务：100 页文档切成 10 块分别总结，再合并去重。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>方案<\/th><th>调用批次<\/th><th>输入 token<\/th><th>输出 token<\/th><th>端到端延迟（估算）<\/th><\/tr><\/thead><tbody><tr><td>串行 10 块<\/td><td>10 次排队<\/td><td>约 15000<\/td><td>约 2000<\/td><td>约 10 × 23 s ≈ 230 s<\/td><\/tr><tr><td>并发 5 路<\/td><td>2 批<\/td><td>约 15000<\/td><td>约 2000<\/td><td>约 2 × 23 s + 聚合 ≈ 50 s<\/td><\/tr><\/tbody><\/table><\/div>\n<p>串行单块：输入约 1500 token，输出约 200 token，生成约 4 秒加往返约 4.3 秒；表中 23 s 为含排队与材料读取的粗估量级。并发方案 token 与串行基本持平，延迟从排队总和降到两批最慢块加聚合。聚合步读取 10 份摘要约 2000 token，输出合并稿约 400 token。<\/p>\n<h2>算例二：投票并行核查<\/h2>\n<p>任务：对同一事实判断独立求解 3 遍，再交叉比对。<\/p>\n<ul><li>\n每遍输入约 800 token，输出约 150 token；三遍并发输入约 2400 token、输出约 450 token。\n<\/li><li>\n聚合步比对三份结论：一致则采纳；两票对一票则标记存疑并补检索；三份互相矛盾则升级人工。\n<\/li><li>\n代价：投票把单次随机性暴露成可计数分歧，但不弥补知识缺口——三遍在同一处都错时，多数表决把错误合法化，缺口要靠检索（c07）或工具（c05）补。\n<\/ul>\n<p>敏感性推算：块数从 10 增到 20，串行延迟近似翻倍，并发方案只增加批次或单批块数，延迟增长慢于线性；但若单块材料切得过碎，摘要丢失主语与背景，聚合步要承担还原上下文的额外成本。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：把有依赖的步骤并发，生成步拿不到大纲步的结构，最后与大纲对不上，返工量超过串行。反例二：外部接口被打满，并发请求触发限流，整体延迟不降反升。边界：子任务有先后依赖必须串行；上下文跨子任务共享应先汇总；主观分散任务上投票多数意见未必更可靠。<\/p>\n<h2>延伸推演：并发度与延迟曲线<\/h2>\n<p>把延迟随并发度的变化拆开看。设 <span class=\"katex-inline\">m<\/span> 个子任务各耗时 <span class=\"katex-inline\">t<\/span>，并发度上限为 <span class=\"katex-inline\">c<\/span>。串行时延迟 <span class=\"katex-inline\">m \\cdot t<\/span>；并发度 <span class=\"katex-inline\">c<\/span> 时延迟约 <span class=\"katex-inline\">\\lceil m/c \\rceil \\cdot t<\/span>，再加聚合等待。并发度从 1 提到 <span class=\"katex-inline\">m<\/span>，延迟从 <span class=\"katex-inline\">m \\cdot t<\/span> 降到 <span class=\"katex-inline\">\\max t<\/span>；但并发度超过外部吞吐上限后，多余请求进入排队，延迟不再下降，反而因排队抖动上升。因此工程上并发度贴着配额上限设，而不是取子任务总数。<\/p>\n<p>再看不可并行部分的约束。若任务中有比例 <span class=\"katex-inline\">s<\/span> 的步骤必须串行（例如先汇总再分发、先聚合再定稿），这部分延迟不随并发度下降；并行只能压缩 <span class=\"katex-inline\">(1-s)<\/span> 部分。串行比例越高，并发带来的总延迟节省越小，这也是判断“值不值得并行”的定量依据：先找出任务里必须排队的环节，再评估其余部分并发的收益。<\/p>\n<p>聚合冲突成本不能漏算。分段并行若产出互相矛盾的结论，聚合步要逐条比对、找依据、定取舍；冲突越多，聚合 token 与人工复核时间越高。投票并行在票型接近时同样需要升级复核。并行节省的等待时间，有一部分会在聚合与冲突消解处还回去；设计时要把子任务边界切清，让产物之间尽量可拼接、少冲突。<\/p>\n<h2>补充算例：投票一致性判定与分段重叠<\/h2>\n<p>投票并行的聚合分三档处理：三遍结论一致，直接采纳；两票对一票，标记存疑并补检索或工具验证；三份互相矛盾，升级人工。票型记录要保留各遍原始答案，而不是只留多数结论，否则存疑样本无法回溯分歧来源。一致性判断只解决“选哪个答案”，不解决“答案对不对”；知识缺口仍需外部材料补齐。<\/p>\n<p>分段并行的切块边界要留重叠：相邻分片共享边缘句子，避免结论被切口切断。代价是入库存储与重复内容增加，聚合时同一信息在两片出现要去重。反方向边界：分片过大，单块语义混杂，向量距离被稀释；分片过碎，结论缺主语与条件。批量反馈场景中，情感、关键词、分类、紧急程度几个分析维度彼此独立，可以并发；但若某个维度的结论要作为另一维度的输入，二者必须排队。<\/p>\n<p>并发上限的工程取值：先测外部接口在不报错前提下的稳定吞吐，再把并发度设在该值以下留出余量；排队队列长度有上限，超出的请求降级为分批处理，而不是无限堆积。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：并行能省 token。<\/strong> 反证：每个子任务都携带自己的提示与上下文，投票并行还重复相同任务 <span class=\"katex-inline\">k<\/span> 遍，总 token 通常多于串行；并行缩短的是墙钟时间（c03 正文机制二）。\n<\/li><li>\n<strong>误读：所有子任务都能并行。<\/strong> 反证：有共享状态或顺序依赖的步骤并行，会放大错误且失去串行保护；开工前必须先做独立性判断。\n<\/li><li>\n<strong>误读：投票次数越多答案越准。<\/strong> 反证：模型缺知识时多遍重复同一错误，表决只暴露分歧不填补缺口；投票降低单次随机性，不提供新材料。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n用 <span class=\"katex-inline\">\\sum t_i<\/span> 与 <span class=\"katex-inline\">\\max t_i<\/span> 说明并行延迟节省来自哪里；子任务耗时不均时节省怎么变化？\n<\/li><li>\n为什么并行的 token 总量通常不减少？写出单任务输入输出与 <span class=\"katex-inline\">m<\/span> 个子任务的量级关系。\n<\/li><li>\n分段并行与投票并行的聚合规则有什么不同？冲突分别怎么处理？\n<\/li><li>\n并发上限受哪些外部约束？超过配额会出现什么后果？\n<\/li><li>\n独立性判断不过关时强行并行，错误在哪个环节暴露？为什么串行顺序保护不了它？\n<\/ol>\n<h2>适用与不适用速查<\/h2>\n<p>适合并行的情况：子任务输入可独立准备、彼此不读写同一可变状态、产物可在汇聚点拼接。不适合并行的情况：步骤间有数据依赖，或上下文必须跨分支共享后才能继续；这类步骤保留串行顺序。投票并行只在单次求解带随机性、且多份答案可比较时才有意义。<\/p>\n<h2>第二个任务的端到端算例：三路独立资料采集后聚合<\/h2>\n<p>估算口径（工程估算，非原书实测）：中文按约 1.6 字符/token；生成按 50 token/s，外部工具往返另计；窗口按 32768 token 估算。<\/p>\n<p>任务：为新品选型汇总三类互不依赖的材料——竞品报价、规格参数、用户评价，三路并发采集，最后由聚合步合并。<\/p>\n<p>并发支路：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>支路<\/th><th>输入构成<\/th><th>输入 token<\/th><th>输出产物<\/th><th>输出 token<\/th><th>支路耗时<\/th><\/tr><\/thead><tbody><tr><td>A 价格采集<\/td><td>提示 120 + 五家报价结果 800<\/td><td>约 920<\/td><td>价格对比表<\/td><td>约 300<\/td><td>约 6.5 s<\/td><\/tr><tr><td>B 规格比对<\/td><td>提示 120 + 规格文本 1000<\/td><td>约 1120<\/td><td>规格对照表<\/td><td>约 350<\/td><td>约 7.2 s<\/td><\/tr><tr><td>C 评价聚类<\/td><td>提示 120 + 评价原文 1200<\/td><td>约 1320<\/td><td>优缺点聚类<\/td><td>约 300<\/td><td>约 6.8 s<\/td><\/tr><\/tbody><\/table><\/div>\n<p>聚合步：三路产物合计约 950 token，聚合提示约 200 token，输入约 1150 token；选型汇总输出约 450 token，生成约 9.0 s。<\/p>\n<p>延迟对照：并行段耗时取三路最大值约 7.2 s；若串行排队，三段耗时相加约 20.5 s，并行段节省约 13.3 s，聚合步串行在后。token 合计：输入约 3560 token（三路提示 360 + 材料 3000 + 聚合提示 200），输出约 1400 token。<\/p>\n<p>冲突解决：报价口径不一致（含税与不含税）时，保留原始报价与口径字段，聚合步标注差异，不强行取均值；规格项互相矛盾时标记待核，不在汇总里抹平。上下文预算：单路最大输入约 1320 token，占窗口约 4.0%；聚合步约 1150 token。<\/p>\n<h2>前提再拆一层<\/h2>\n<p>并行化能成立，还依赖以下几条隐含前提；逐条抽掉后给出故障场景与可观测指标。<\/p>\n<ol><li>\n<strong>子任务之间无数据依赖。<\/strong> 抽掉后：并发结果互不衔接，聚合后出现前后矛盾的片段。可观测指标：子任务间引用缺失率、聚合冲突条数。\n<\/li><li>\n<strong>各支路产物格式一致、可合并。<\/strong> 抽掉后：汇聚步要先人工对齐结构，并行省下的时间耗在整理上。可观测指标：聚合步格式解析成功率、结构返工次数。\n<\/li><li>\n<strong>外部并发额度允许（限流与连接池）。<\/strong> 抽掉后：并发请求触发限流拒绝，支路整体失败重试。可观测指标：限流拒绝次数、重试率、并发排队时长。\n<\/li><li>\n<strong>聚合环节有权消解冲突并标注差异。<\/strong> 抽掉后：矛盾结果并列交付，读者自行判断取舍。可观测指标：冲突标注率、转人工复核条数。\n<\/li><li>\n<strong>各支路耗时量级相近，无长尾拖累。<\/strong> 抽掉后：一路超时拖住整体完成时间，并行收益被尾部吃掉。可观测指标：各支路耗时 p95、尾部等待时间占比。\n<\/li><li>\n<strong>多次求解的样本相互独立。<\/strong> 抽掉后：投票并行的几次输出高度趋同，交叉验证失去作用。可观测指标：多次结果分歧度、一致率分布。\n<\/ol><\/div><\/details>", "c04": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.61<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">提示链<\/a><\/span><\/div><h1>反思（Reflection）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章 | <strong>原书位置<\/strong>：第 4 章《Reflection》（PDF 第 61 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>即便工作流设计完善，首版输出或初始计划仍可能不准确、不完整或未达最优（PDF 第 61 页）。一次生成完成后，模型不会自动回头核对事实、格式与约束；缺少反馈环时，错误版本直接交付。链式把产物交给下游，路由把产物送进分支，二者都是单向推进，都不包含“检查刚才那版并改好”的环节。<\/p>\n<p>反思要解决的具体困难是：让系统对自身产出或过程做评估，再用评估结果修正答案、调整策略。没有明确标准的“再想想”只会换措辞；反思必须把检查依据、反馈回传和停止条件写成可执行环节，才能把质量提升与反复空谈分开。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：反思是智能体对自身工作、产出或内部状态进行评估，并利用评估结果改进表现、修订回复的自我纠错与自我改进机制；它依据外部反馈、内部批评或与目标标准的偏差迭代，实践中也常由另一个专职审阅的智能体承担（PDF 第 61 页）。逐句拆开：<\/p>\n<ul><li>\n“评估自身产出”：检查对象是初稿、计划或生成过程，不是直接重新出题。\n<\/li><li>\n“用评估结果改进”：批评意见必须回流到生成环节，驱动重写、调参或修改计划。\n<\/li><li>\n“反馈环”：不同于链式的单向传递，反思显式引入循环；先产出，再回看产出，标出问题与改进点，再出修订版（PDF 第 61 页）。\n<\/li><li>\n“生产者—批评者分离”：书中把流程拆成 Producer 与 Critic 两个逻辑角色，也称生成器—批评者、生产者—审阅者；单一智能体可以自审，但两个专用智能体或两套不同系统提示通常更稳健，更不容易自己给自己放水（PDF 第 62 页）。\n<\/ul>\n<p>正例：生产者写一段 Python 函数，批评者按“事实正确性、代码质量、风格、完整度、是否遵循提示”逐条审阅并给结构化意见，生产者据此出第二版，直到批评通过或到达轮次上限。反例：提示只写“请改进一下你的回答”，模型没有可对照的标准，只能调整措辞。<\/p>\n<h2>原理推导<\/h2>\n<p>反思循环由四步构成，收敛条件与成本都能逐步推导。<\/p>\n<p>第一步执行（Execution）：智能体完成任务或给出初稿。生产者只专注生成内容，接收初始提示产出第一版（PDF 第 61、62 页）。<\/p>\n<p>第二步评估/批评（Evaluation/Critique）：再调一次模型或走规则引擎审视上一步产物，核对事实准确性、连贯性、风格、完整度、是否遵循提示等标准（PDF 第 61 页）。批评者使用不同人设，例如“资深工程师”“严谨事实核查员”，按指定标准找缺陷并输出结构化反馈（PDF 第 62 页）。这一步的可靠性取决于标准是否具体：标准越笼统，批评越偏向主观感受。<\/p>\n<p>第三步反思/精炼（Reflection/Refinement）：依据批评决定改法，可能是重写输出、调整后续参数，甚至推翻原计划（PDF 第 61 页）。反馈回传给生产者，作为下一版的修改依据。<\/p>\n<p>第四步迭代（Iteration）：修订版再跑执行—批评—精炼，直到达标或触发停止条件（PDF 第 61 页）。书中代码示例设 <code>max_iterations = 3<\/code>，循环持续到批评阶段判定代码完善或达到最大轮次；对话历史在循环中保留并逐轮传入（PDF 第 63 页）。<\/p>\n<p>收敛条件有两条：一是批评结论通过既定标准，二是达到轮次上限。第二条是硬性兜底，防止循环不收敛。成本侧，原书指出反思是内存密集型的：每轮历史都在膨胀，包含初始输出、批评与各版修订（PDF 第 66 页）；迭代越多，延迟与 token 越高，因此质量优先于速度和成本时才值得用（PDF 第 67 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>反思适用：最终输出的质量、准确性与细节完整度比速度和成本更重要，典型如长篇内容打磨、代码编写与调试（PDF 第 67 页）。有效反思需要三件配套：可逐条对照的 rubric、可供核对的外部证据（测试结果、检索原文、计算结果）、轮次上限。<\/p>\n<p>边界：任务本身有标准答案且单次生成已稳定时，反思轮次是纯额外开销。批评标准无法具体化的主观任务上，自审与互审都容易漂移。批评者与生产者共享同一套偏见时，分离角色也不能消除系统性盲点；这类盲点要靠外部证据或人工复核补上。历史无限累积会撑爆上下文窗口，需要在循环中裁剪或摘要早期版本。<\/p>\n<p>条件去掉会怎样：去掉 rubric，批评变成“感觉不好”，修订方向随措辞漂移；去掉外部证据，模型只能在已有文本里找问题，无法发现事实错误；去掉轮次上限，标准模糊时循环可能一直挑出新问题，永不停止。<\/p>\n<h2>反例<\/h2>\n<p>无标准反思的反例：提示要求“让回答更好”，批评者只能指出表达不顺，生产者把句子换一种说法，事实错误原样保留。原书把“对照明确标准检查”列为评估环节的核心（PDF 第 61 页），标准缺失时反思退化为润色。<\/p>\n<p>无新证据的循环反例：同一模型连续三轮自审，每轮都基于上一版文本，没有测试、检索或计算介入；后一轮倾向附和前一轮结论，错误被反复确认而不是被纠正。原书也提醒，反思收益伴随迭代成本，历史逐轮膨胀（PDF 第 66 页）。<\/p>\n<h2>辨析<\/h2>\n<p>与链式（c01）的差别：链式单向传递产物；反思把产物送回生成者形成闭环。链式可以在某一步挂一个反思关卡，但反思本身是反馈结构。<\/p>\n<p>与规划（c06）的差别：反思修订的是当前产出或局部方法；规划调整的是后续行动序列与任务分解。批评发现“计划本身不可行”时，反思触发的是重规划，进入规划模式。<\/p>\n<p>与护栏（c09）的差别：反思是质量改进环节，目标是把结果做得更好；护栏是拦截检查，目标是阻止有害、越界或不合规内容流出。反思通过不等于护栏通过，反之亦然。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：链式的结构化产物可供批评者逐项核对；工具调用（c05）为批评环节提供测试、检索等外部证据。后继：反思是规划循环中检查点不通过时的修正手段，也是多智能体批评者—审阅者拓扑（c08）的单智能体雏形；护栏（c09）在反思之外另设合规拦截。本概念把“生成—批评—精炼—迭代”的反馈环与收敛条件、成本结构串在一起。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（反思）<\/summary><div class=\"depth-body\"><h1>反思（Reflection）· 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>逐级倒查反思循环成立的前提：<\/p>\n<ol><li>\n“修订版比初稿好”依赖批评结论可被执行：批评意见必须指向具体缺陷与改法，而不是笼统感受；否则生产者拿到反馈也不知道改哪里。\n<\/li><li>\n“批评结论具体”依赖有明确对照标准（rubric）：事实准确性、连贯性、风格、完整度、是否遵循提示等维度逐条列出（PDF 第 61 页）；标准含糊，批评就滑向主观印象。\n<\/li><li>\n“标准可对照”依赖有外部证据可供核对：测试结果、检索原文、计算结果等事实依据；缺少证据，模型只能在已有文本内部挑措辞。\n<\/li><li>\n“反馈能回流”依赖产物以可结构化方式回传：生产者初稿、批评意见、各版修订在循环中保留并逐轮传入上下文（PDF 第 63 页）。\n<\/li><li>\n“循环能停下来”依赖停止条件：批评通过既定标准，或达到轮次上限；没有硬上限，标准模糊时循环可能一直挑出新问题。\n<\/li><li>\n最底层假设：模型在看到针对具体缺陷的反馈后，下一版能对应修正；若反馈无法被转化为改动，反思只是重复生成。\n<\/ol>\n<p>逆推到读者基线：先认“初稿可以被检查”，再认“检查要有标准和证据”，最后认“循环何时停”。缺任何一层，反思都会退化成换说法。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条分四步，每步写清假设：<\/p>\n<ul><li>\n第一步，执行（Execution）。生产者接收初始提示产出初稿，专注生成内容。用到的假设：初始提示足够界定任务边界；边界不清，初稿方向就偏。\n<\/li><li>\n第二步，评估/批评（Evaluation/Critique）。再调一次模型或走规则引擎审视产物，按 rubric 核对事实、连贯、风格、完整度、指令遵循等（PDF 第 61 页）。批评者使用不同人设，如资深工程师、严谨事实核查员，输出结构化反馈（PDF 第 62 页）。用到的假设：分离角色能缓解“自己给自己放水”的认知偏误；但共享同一套偏见时，分离不能消除系统性盲点。\n<\/li><li>\n第三步，反思/精炼（Reflection/Refinement）。依据批评决定重写、调参或修改计划；反馈回传生产者作为下一版依据（PDF 第 61 页）。用到的假设：批评与改动之间存在可执行映射；无法映射的批评需要转人工或补证据。\n<\/li><li>\n第四步，迭代（Iteration）。修订版再跑执行—批评—精炼，直到达标或触发停止条件（PDF 第 61 页）。书中代码示例设 <code>max_iterations = 3<\/code>，循环持续到批评判定完善或达到最大轮次（PDF 第 63 页）。\n<\/ul>\n<p>收敛条件与成本：<\/p>\n<ul><li>\n收敛条件一：批评结论通过标准，循环退出。\n<\/li><li>\n收敛条件二：达到轮次上限，强制退出并保留当前最优版或转人工。\n<\/li><li>\n成本侧：反思是内存密集型循环，每轮历史膨胀，包含初始输出、批评与各版修订（PDF 第 66 页）；迭代越多延迟与 token 越高，因此质量优先于速度成本时才用（PDF 第 67 页）。\n<\/ul>\n<p>限定条件拆解：<\/p>\n<ul><li>\n史料：生产者—批评者分离也称生成器—批评者、生产者—审阅者；LangChain 示例用 reflector_prompt 固定批评者角色，ADK 示例显式定义生产者与审阅者两个 LlmAgent（PDF 第 62 页）。\n<\/li><li>\n推断：批评轮次与质量提升不是线性关系；前两轮通常收益最大，后续轮次边际收益递减。这是机制推断，原书未给质量曲线。\n<\/li><li>\n边界：批评者与生产者共享偏见时，盲点要靠外部证据或人工复核补上；历史无限累积会撑爆上下文，需要裁剪或摘要早期版本。\n<\/ul>\n<h2>机制逐项对照<\/h2>\n<ul><li>\n与链式：链式单向传递产物；反思把产物退回生成者形成闭环。链式可在某一步挂反思关卡，但反思本身是反馈结构。\n<\/li><li>\n与规划：反思修订当前产出或局部方法；规划调整后续行动序列。批评发现计划本身不可行时，反思结论升级为重规划（c06）。\n<\/li><li>\n与护栏：反思以质量改进为目标；护栏以合规安全为目标做拦截。反思通过不等于护栏通过，反之亦然。\n<\/li><li>\n失败位置：反思失败集中在批评环节——标准空泛、证据缺失、反馈不可执行；循环不收敛则是停止条件缺失。\n<\/ul>\n<h2>算例：函数编写反思循环<\/h2>\n<p>估算口径（工程估算，非原书测量值）：生产者系统提示约 700 token，批评者系统提示约 600 token；初稿约 300 token；每轮历史逐轮累积；模型按 50 token/s 生成，往返约 300 ms。<\/p>\n<p>任务：写一个阶乘函数，处理 0 与负数输入。<\/p>\n<p>第 1 轮：<\/p>\n<ul><li>\n生产者输入：任务提示 + 函数要求，约 800 token；输出初稿约 300 token。\n<\/li><li>\n批评者输入：rubric（正确性、边界处理、错误提示、风格）+ 初稿，约 1000 token；输出意见约 200 token：“未处理负数输入；0 的阶乘返回 1 已覆盖；缺类型检查。”\n<\/li><li>\n代价：两轮调用输入约 1800 token，输出约 500 token；生成加往返约 12 秒。\n<\/ul>\n<p>第 2 轮：<\/p>\n<ul><li>\n生产者输入：第 1 轮初稿 + 批评意见，约 1300 token；输出修订版约 320 token。\n<\/li><li>\n批评者输入：历史 + 修订版，约 1600 token；输出意见约 120 token：“负数已抛 ValueError；边界覆盖完整；风格可接受。”\n<\/li><li>\n代价：输入约 2900 token，输出约 440 token；约 13 秒。\n<\/ul>\n<p>第 3 轮（上限兜底）：若批评仍有保留意见，进入第 3 轮；<code>max_iterations = 3<\/code> 到点即停，不再继续。本轮输入约 3000 token 量级。<\/p>\n<p>收敛判断：第 2 轮批评通过标准，循环提前退出；不进入第 3 轮。若 rubric 只写“写得更好”，两轮后批评仍在挑措辞，历史累积到第 3 轮仍无明确通过信号，此时靠轮次上限强制退出。<\/p>\n<p>敏感性推算：每轮历史都把初稿、批评、修订再带一遍，第 <span class=\"katex-inline\">k<\/span> 轮输入约为前 <span class=\"katex-inline\">k-1<\/span> 轮产物之和；轮次越多，单轮 token 与延迟上涨越快。长循环需要在第 2、3 轮后把早期版本摘要化，只保留当前版与未解决缺陷。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：提示只写“请改进一下”，批评者只能指出表达不顺，生产者调换措辞，事实错误原样保留。反例二：同一模型连续自审，没有测试或检索介入，后一轮附和前一轮结论，错误被反复确认。边界：答案标准、单次生成已稳定的任务，反思轮次是纯额外开销；主观任务上自审互审都易漂移。<\/p>\n<h2>延伸推演：循环何时震荡不收敛<\/h2>\n<p>反思循环不收敛有几种可识别的条件。其一，批评标准互相冲突：rubric 同时要求简短与详尽、激进与稳妥，生产者每轮满足一头就被另一头挑出问题，版本来回摆动。其二，缺少外部证据：批评只能在文本内部找瑕疵，每轮换一个措辞角度，缺陷没有可对照的事实依据，问题既不能被证实也不能被消除。其三，反馈不可执行：意见停留在“不够好”，生产者不知道改哪个位置，修订版与初稿实质相同。其四，生产者与批评者立场来回反转：上一轮肯定的点下一轮被否定，结论没有累积方向。<\/p>\n<p>收敛的反向条件因此明确：标准单一且可对照、结论有外部证据支撑、每条批评指向具体可改位置、历史结论保留并累积。轮次上限是兜底而不是收敛手段——它保证循环退出，但退出时保留的可能只是当前最优版，未达标的部分要转人工或补证据。<\/p>\n<p>历史膨胀可以用量级描述。设第 <span class=\"katex-inline\">k<\/span> 轮带入上下文的内容为初稿 <span class=\"katex-inline\">V_0<\/span>、各轮批评 <span class=\"katex-inline\">C_1 \\ldots C_k<\/span>、各版修订 <span class=\"katex-inline\">V_1 \\ldots V_k<\/span>，第 <span class=\"katex-inline\">k<\/span> 轮输入约等于这些内容之和；轮次越多，单轮携带的历史越长。长循环应在第二、三轮后把早期版本摘要化，只保留当前版、未解决缺陷与关键证据，否则上下文窗口先于质量改善被填满。<\/p>\n<h2>补充算例：带证据的代码反思回合<\/h2>\n<p>沿用阶乘函数案例，把证据类型补全。第 1 轮批评不能只看代码文本，可挂三类外部证据：运行测试（覆盖 0、正整数、负数三类输入）、静态检查（类型与异常处理）、规格对照（题目要求的边界条件是否齐全）。批评意见按证据编号引用，例如“负数分支未抛异常，对应测试用例 negative(-3) 未通过”，生产者据此定位修改位置。<\/p>\n<p>证据缺失的回合对照：若批评只能读到代码本身，无法运行测试，意见只能停留在命名与格式层面；此时循环多跑两轮，事实类缺陷仍留在稿中。工程落地时，批评环节可由另一个模型承担，使用独立系统提示与人设（如严谨事实核查员）；也可以由规则或测试工具承担可机械化核对的部分，模型负责主观质量维度。两类来源组合，比单一模型自审覆盖更全。<\/p>\n<p>反思与规划的衔接案例：批评在审阅初稿时发现“所需数据不存在于可访问范围”，这不是当前版本措辞问题，而是计划路径不可行；反思环节把问题上交到规划层重排，而不是继续在产出上打磨。判断分界：缺陷能靠修改当前产出消除，留在反思循环；缺陷来自任务分解或前提假设，进入重规划。<\/p>\n<p>历史裁剪的具体做法：第二轮结束后，把首轮初稿与首轮批评压缩成一行遗留问题清单，后续上下文只带当前版、遗留清单与关键证据；早期版本原文留存到外部记录，供回溯但不占当前窗口。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：“请改进”就是反思。<\/strong> 反证：没有可对照标准，改进方向随措辞漂移；反思的批评必须挂在逐条 rubric 上（PDF 第 61 页）。\n<\/li><li>\n<strong>误读：反思次数越多越好。<\/strong> 反证：无新证据的循环让模型自我迎合，历史膨胀还推高成本；边际收益递减后应停止（PDF 第 66 页）。\n<\/li><li>\n<strong>误读：生产者与批评者分开就不会有盲点。<\/strong> 反证：两者共享同一套偏见时分离角色不能消除系统性错误；盲点要靠外部证据或人工复核。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n反思四步（执行、评估、精炼、迭代）各自依赖什么前提？哪一步最容易失败？\n<\/li><li>\n两条收敛条件分别是什么？去掉轮次上限，标准模糊时会发生什么？\n<\/li><li>\n生产者—批评者分离缓解了哪种偏误？为什么补不上共享偏见造成的盲点？\n<\/li><li>\n用算例说明第 <span class=\"katex-inline\">k<\/span> 轮历史为什么逐轮膨胀；长循环应怎么裁剪上下文？\n<\/li><li>\n批评发现“计划路径不可行”时，反思应当把问题交给哪个后续模式处理？\n<\/ol>\n<h2>适用与不适用速查<\/h2>\n<p>适合反思的情况：输出质量优先于速度成本，有可逐条对照的标准，能取得测试、检索或计算等外部证据。不适合反思的情况：答案标准、单次生成已稳定，或批评无法获得任何外部依据；后者再跑循环只会增加措辞摆动。反思闭环要配轮次上限，长循环定期裁剪早期历史，避免窗口先于质量改善被填满。<\/p>\n<h2>第二个任务的端到端算例：产品发布公告的写作反思<\/h2>\n<p>估算口径（工程估算，非原书实测）：中文按约 1.6 字符/token；生成按 50 token/s，往返约 300 ms；窗口按 32768 token 估算。Producer 与 Critic 为两套独立提示，角色分离。<\/p>\n<p>任务：起草一份产品发布公告，生产者出初稿，批评者按事实准确性、约束符合度、语气分寸、信息完整度逐条审阅，生产者据此修订，直到意见清空或触达轮次上限。<\/p>\n<p>回合 1：<\/p>\n<ul><li>\n生产者：撰写提示约 200 token，产品要点材料约 600 token；初稿公告约 500 汉字 ≈ 310 token。\n<\/li><li>\n批评者：初稿 310 token + 审阅清单约 220 token；结构化意见（事实缺口 2 处、语气过满 1 处、缺发布日期 1 处）约 260 token。\n<\/li><li>\n修订版：初稿 310 + 批评意见 260 + 修订提示 180，输入约 750 token；二版公告约 330 token。\n<\/ul>\n<p>回合 2：批评者复核二版，残留意见约 120 token；生产者出三版，复核通过。<\/p>\n<p>量级估算：输入累计约 2530 token（首轮 800、修订 750、二轮回扣 450、复核与终稿回路另计），输出累计约 1020 token（初稿 310、一轮意见 260、二版 330、二轮意见 120）；每回合生成约 6–7 s，两回合约 28 s，另加往返。<\/p>\n<p>收敛判定：批评意见为空、或问题条目全部关闭即停止；轮次上限取 3 轮，到限仍有未关闭条目则转人工复核。震荡条件：批评标准逐回合漂移，或生产者只按字面调整措辞而不改事实内容，残留问题反复出现。可观测指标：平均回合数、每轮残留问题数、终稿人工通过率、触达轮次上限次数。<\/p>\n<h2>前提再拆一层<\/h2>\n<p>反思循环能成立，还依赖以下几条隐含前提；逐条抽掉后给出故障场景与可观测指标。<\/p>\n<ol><li>\n<strong>存在可对照的明确检查标准。<\/strong> 抽掉后：批评意见只能停留在语言措辞层面，事实与约束问题无从核对。可观测指标：意见中可执行修改点占比、标准缺失导致的空泛意见条数。\n<\/li><li>\n<strong>批评意见能回流到生成环节。<\/strong> 抽掉后：意见留在审阅记录里，初稿原样交付，闭环断开。可观测指标：意见落实率、二版改动与一轮意见的对应条数。\n<\/li><li>\n<strong>生产者与批评者角色或标准相互独立。<\/strong> 抽掉后：同一上下文自审，自己放过自己的问题。可观测指标：自审漏检率（与人工复核结果对比）、问题被放行条数。\n<\/li><li>\n<strong>循环有停止条件与轮次上限。<\/strong> 抽掉后：震荡空转，token 与延迟随回合无限增长。可观测指标：平均回合数、触达上限次数、每轮 token 增量。\n<\/li><li>\n<strong>批评所需证据可获得（可查材料、可运行代码）。<\/strong> 抽掉后：批评只能就文本挑错，事实类判断无依据。可观测指标：事实类意见占比、无证据意见条数。\n<\/li><li>\n<strong>反馈信号逐回合保持稳定。<\/strong> 抽掉后：标准来回变化，产物在两个方向间反复横跳。可观测指标：相邻回合意见重叠度、未解决问题反复出现次数。\n<\/ol><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.73<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">提示链<\/a><\/span><\/div><h1>工具调用（Tool Use / Function Calling）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章 | <strong>原书位置<\/strong>：第 5 章《Tool Use (Function Calling)》（PDF 第 73 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>前几章的模式只编排模型之间的交互与内部信息流；模型自身受训练数据截止时间限制，不会算数、查不到最新信息、访问不到用户专属数据，也触发不了真实世界动作（PDF 第 73 页）。要让智能体真正与外部系统交互，必须有一条通道，把模型的意图翻译成可执行的外部调用，再把执行结果带回上下文。<\/p>\n<p>困难在于：模型不能直接运行代码或访问数据库，外部系统也不能直接理解自然语言。工具调用要解决的就是接口问题——模型输出结构化调用请求，由编排层拦截、执行、回传，形成“决定调用谁、传什么参数、拿到什么结果、下一步怎么办”的闭环。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：工具使用模式通常通过函数调用（Function Calling）实现，使智能体能够调用外部 API、数据库、服务甚至执行代码；核心大模型根据用户请求或任务当前状态，决定是否以及如何使用某个外部函数（PDF 第 73 页）。逐句拆开：<\/p>\n<ul><li>\n“工具定义”：向 LLM 描述外部能力，包括用途、名称、参数及其类型与说明（PDF 第 73 页）。\n<\/li><li>\n“LLM 决策”：模型收到用户请求与可用工具定义，判断是否需要调用一个或多个工具（PDF 第 73 页）。\n<\/li><li>\n“函数调用生成”：需要调用时，模型生成结构化输出（通常是 JSON），指明工具名称与从请求中提取的参数（PDF 第 73 页）。\n<\/li><li>\n“工具执行”：框架或编排层拦截该结构化输出，找到对应工具，用给定参数执行真实函数（PDF 第 73 页）。\n<\/li><li>\n“结果返回与再处理”：执行结果回传给智能体；模型把工具结果纳入上下文，生成最终回复，或决定继续调用工具、进行反思、直接作答（PDF 第 73 页）。\n<\/li><li>\n“工具宽于函数”：工具可以是传统函数，也可以是复杂 API 端点、数据库请求，甚至是发给另一个专用智能体的指令（PDF 第 73–74 页）。\n<\/ul>\n<p>正例：用户问“我上周的订单状态”，模型选择订单查询工具，传入用户标识与订单号，执行后把状态文本带回，再组织成自然语言回复。反例：模型不调用工具，凭训练记忆编造一个物流状态。<\/p>\n<h2>原理推导<\/h2>\n<p>工具调用闭环可按六个环节推导，每个环节的失败模式不同。<\/p>\n<p>环节一：工具定义。描述质量决定模型选得准不准。参数 schema 要窄：枚举值优于自由文本，必填与可选分清，类型写明确。工具描述之间边界清楚，避免功能重叠；工具清单过长时，模型在候选之间混淆的概率上升。<\/p>\n<p>环节二：决策。模型对照请求与工具说明判断是否需要调用、调用哪个。这一步依赖定义环节提供的信息；定义含糊，决策就只能猜。<\/p>\n<p>环节三：调用生成。模型产出 JSON 调用对象，包含工具名与参数。参数值从用户请求或上下文中提取；缺参数时应能表达“需要补充某参数”，而不是填一个猜测值。<\/p>\n<p>环节四：执行拦截。编排层解析结构化输出，做参数校验，再调用真实函数。这一层是模型与外部世界之间的边界：模型不直接获得执行权限，所有动作经过编排层放行。<\/p>\n<p>环节五：结果回传。工具输出回到上下文。失败返回必须可读：说明失败原因与可尝试的下一步，例如缺少哪个参数、哪类输入不被接受；返回空字符串或 null 会让模型无法区分“没有结果”和“调用失败”。<\/p>\n<p>环节六：再处理。模型基于结果决定收尾还是继续。一次任务可能串联多个工具调用，中间结果作为后续调用的输入；这一步与链式的状态传递衔接。<\/p>\n<p>机制上，函数调用是连接 LLM 推理能力与外部功能的技术桥梁（PDF 第 73 页）：推理留在模型侧，计算、检索、动作留在外部侧，结构化 JSON 是两侧的交换格式。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>工具调用适用：任务需要最新信息、模型不擅长的计算、用户专属数据或真实世界动作。工具设计原则：schema 窄、参数枚举化、描述清晰、工具幂等或可回滚、错误信息可读；权限按最小化配置，危险动作加审批。<\/p>\n<p>边界：工具描述重叠或清单过长时，模型乱选工具的概率上升，工具数量本身不等于能力。外部工具不稳定或返回延迟高时，调用链会被外部服务拖慢；需要超时、退避重试与降级路径。模型可能生成看似合法但越权的参数，参数校验与权限边界必须在编排层兜底，不能只靠模型自觉。<\/p>\n<p>条件去掉会怎样：去掉结构化调用，模型用自然语言描述“我想查订单”，外部系统无法执行；去掉可读错误，失败被静默吞掉，模型在缺失结果上继续作答；去掉权限边界，模型生成的任何参数都被放行，越权动作直达外部系统。<\/p>\n<h2>反例<\/h2>\n<p>工具失败静默返回的反例：查询工具超时后返回空结果，模型把“空”理解为“无订单”，回复用户“没有相关订单”，实际是调用未成功。正确做法是回传超时信息与可重试提示，让模型选择重试或告知用户稍后再查。<\/p>\n<p>工具堆叠的反例：一次性暴露二十个功能相近的检索工具，描述互相交叉，模型反复选错对象，结果准确率低于只保留两三个职责明确的工具。原书把工具定义作为闭环第一步，候选质量直接决定后续决策（PDF 第 73 页）。<\/p>\n<h2>辨析<\/h2>\n<p>与 RAG（c07）的差别：RAG 是专用的知识检索管线，切块、索引、召回、引用围绕文档问答展开；工具调用是通用动作通道，检索只是可挂载的一类工具。RAG 回答“材料从哪来”，工具调用回答“怎么触达外部能力”。<\/p>\n<p>与 MCP（第 3 章上下文协议）的差别：函数调用是一次具体的调用机制；MCP 标准化的是模型发现、连接和使用外部能力的接口方式。工具调用解决“这次怎么调”，协议解决“各类工具怎么统一暴露”。<\/p>\n<p>与护栏（c09）的差别：工具调用通道把动作送到外部；护栏在通道前后设置拦截，校验权限、参数与副作用。工具越权风险由护栏层兜底，而不是由工具自身承诺。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：结构化输出解析与单步提示调用。后继：工具调用是规划模式执行子任务的手段，也是多智能体之间委派任务的一种形态；RAG 作为知识型工具挂在闭环上；护栏（c09）在执行层约束工具权限。本概念把“定义—决策—生成—拦截—回传—再处理”的调用闭环与错误返回、权限边界的工程要求串在一起。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（工具调用）<\/summary><div class=\"depth-body\"><h1>工具调用（Tool Use / Function Calling）· 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>逐级倒查工具调用闭环成立的前提：<\/p>\n<ol><li>\n“模型选对工具”依赖工具定义清晰：用途、名称、参数类型与说明写在描述里；定义重叠或边界含糊，模型只能在候选之间猜。\n<\/li><li>\n“工具定义清晰”依赖候选职责可划分：每个工具的输入输出边界稳定，工具清单规模可控；清单过长会稀释每个定义的可见度。\n<\/li><li>\n“调用请求可被执行”依赖结构化交换格式：模型产出 JSON 调用对象，编排层据此定位工具并传参；自然语言描述无法被外部系统直接执行。\n<\/li><li>\n“执行安全可控”依赖编排层拦截：模型不直接获得执行权限，所有动作经编排层校验参数、边界与权限后放行。\n<\/li><li>\n“失败可恢复”依赖错误返回可读：回传失败原因与可尝试的下一步，模型才能换参数重试或换工具；返回空值则模型无法区分“无结果”与“调用失败”。\n<\/li><li>\n最底层假设：外部能力可以被描述成有限个可调用接口；需要开放式操作、无法参数化的动作，不能直接走工具通道。\n<\/ol>\n<p>逆推到读者基线：先认“外部能力能写成接口”，再认“接口调用走结构化请求”，最后认“失败能带信息回来”。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条按六个环节推进，每步写清假设：<\/p>\n<ul><li>\n环节一，工具定义。向 LLM 描述外部函数：用途、名称、参数及类型说明（PDF 第 73 页）。参数 schema 要窄，枚举优于自由文本，必填可选分清。用到的假设：描述质量直接决定候选可见度；描述重叠会导致乱选。\n<\/li><li>\n环节二，LLM 决策。模型对照请求与工具定义判断是否需要调用、调用哪个（PDF 第 73 页）。用到的假设：决策依据来自定义环节提供的信息；定义不足，决策只能猜。\n<\/li><li>\n环节三，函数调用生成。需要调用时模型生成 JSON，指明工具名与从请求中提取的参数（PDF 第 73 页）；缺参数时应表达“需要补充某参数”，而不是填猜测值。\n<\/li><li>\n环节四，执行拦截。编排层解析输出、做参数校验，再调用真实函数（PDF 第 73 页）。这一层是模型与外部世界的边界；权限、范围、白名单在此兜底。\n<\/li><li>\n环节五，结果回传。工具输出回到上下文；失败返回要说明原因与下一步，例如缺少哪个参数、哪类输入不被接受。用到的假设：模型能读懂错误信息并调整后续调用。\n<\/li><li>\n环节六，再处理。模型基于结果收尾或继续：可能串联下一个工具调用、进行反思，或直接作答（PDF 第 73 页）。中间结果作为后续调用输入，与链式状态传递衔接。\n<\/ul>\n<p>机制定位：函数调用是连接 LLM 推理能力与外部功能的技术桥梁（PDF 第 73 页）；推理留在模型侧，计算、检索、动作留在外部侧，JSON 是两侧交换格式。工具宽于函数：可以是传统函数、API 端点、数据库请求，乃至发给另一个专用智能体的指令（PDF 第 73–74 页）。<\/p>\n<p>限定条件拆解：<\/p>\n<ul><li>\n史料：闭环六步为原书列出的工具使用标准流程（PDF 第 73 页）。\n<\/li><li>\n推断：工具数量与选择准确率的关系是非单调的——过少覆盖不全，过多相互干扰；最优规模取决于任务域，原书未给具体数量。\n<\/li><li>\n边界：模型可能生成看似合法但越权的参数，参数校验与权限边界必须在编排层兜底，不能靠模型自觉。\n<\/ul>\n<h2>机制逐项对照<\/h2>\n<ul><li>\n与 RAG：RAG 是专用知识检索管线，切块、索引、召回、引用围绕文档问答；工具调用是通用动作通道，检索只是可挂载的一类工具。\n<\/li><li>\n与 MCP：函数调用是一次具体调用机制；MCP 标准化模型发现、连接和使用外部能力的接口方式。调用解决“这次怎么调”，协议解决“各类工具怎么统一暴露”。\n<\/li><li>\n与护栏：工具通道把动作送到外部；护栏在通道前后做拦截与权限约束。工具自身的幂等、可回滚设计是执行护栏的一部分。\n<\/li><li>\n失败位置：工具失败集中在定义（选错）、拦截（参数越权）、回传（错误不可读）三处；通道本身不保证外部服务稳定。\n<\/ul>\n<h2>算例：订单状态查询<\/h2>\n<p>估算口径（工程估算，非原书测量值）：工具定义清单约 1200 输入 token，用户请求约 100 token；调用 JSON 约 80 token；工具往返约 300–500 ms；模型按 50 token/s 生成。<\/p>\n<p>任务：用户问“我上周的订单到哪了”。<\/p>\n<p>第 1 步，定义载入：把可用工具描述放进上下文，例如 <code>get_order_status(user_id, order_id)<\/code>，参数说明标注 order_id 可从账号历史补全。 第 2 步，决策：模型判断需要调用订单查询工具；输入约 1300 token，决策输出工具选择约 30 token。 第 3 步，调用生成：产出 JSON <code>{&quot;tool&quot;:&quot;get_order_status&quot;,&quot;args&quot;:{&quot;user_id&quot;:&quot;u_1024&quot;,&quot;order_id&quot;:null}}<\/code>，约 80 token；识别出 order_id 缺失。 第 4 步，执行拦截：编排层校验参数，发现 order_id 为空，不调用外部接口；回传错误 <code>{&quot;error&quot;:&quot;missing_arg&quot;,&quot;field&quot;:&quot;order_id&quot;,&quot;hint&quot;:&quot;可先查询该用户最近订单&quot;}<\/code>。 第 5 步，回传再处理：模型收到可读错误，改调 <code>list_recent_orders(user_id)<\/code> 取最近订单号，再回到状态查询。 第 6 步，结果成稿：状态文本带回上下文，模型组织自然语言回复；本步输入约 900 token，输出约 180 token。<\/p>\n<p>失败分支对照：<\/p>\n<ul><li>\n超时分支：工具超时后回传“调用超时，可重试一次”，模型选择重试；不把空结果当“无订单”。\n<\/li><li>\n缺参数分支：如上，返回缺哪个字段与补全路径；模型换调用补参数。\n<\/li><li>\n越权分支：参数指向他人订单，编排层权限校验拒绝，回传“无权访问该订单”，不执行查询。\n<\/ul>\n<p>量级对照：一次成功调用的模型侧输入约 1300 token、输出约 260 token；工具往返约 0.4 秒。若链路包含补查订单号，多一次工具调用与一段结果回传，输入再加约 600 token。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：查询工具超时返回空字符串，模型把“空”理解为“无订单”，回复用户没有相关订单。反例二：一次性暴露二十个功能相近的检索工具，描述交叉，模型反复选错，准确率低于保留两三个职责明确的工具。边界：外部工具不稳定时需要超时、退避重试与降级路径；模型不擅长的计算与最新信息才是工具的主场。<\/p>\n<h2>延伸推演：工具规模与调用成本<\/h2>\n<p>工具清单规模对选择准确率的影响可以分两段看。清单很小时，每个工具定义都被模型充分看到，选错主要来自任务理解偏差；清单变长后，定义之间的描述距离压缩，功能相近的工具互相竞争候选，模型选错概率上升。收窄 schema 的作用在参数侧：枚举值把参数空间限定在有限选项内，模型不需要生成自由文本；自由文本参数则要承担格式偏差与取值越界风险。工具描述之间边界写清，比单纯增加工具数量更能稳住选择。<\/p>\n<p>调用成本按链路累加。一次成功调用包含：定义载入（工具清单进入上下文的固定 token）、决策与调用生成、编排层校验、工具往返、结果回传、再处理。工具往返是外部耗时，模型侧 token 随调用次数叠加。需要补参数重试时，多一轮“错误回传—改参—再调用”，输入加上错误信息与修正后参数；连续失败超过次数应转人工，而不是无限重试同一调用。<\/p>\n<p>失败模式的代价对比：缺参数错误可恢复，返回字段名与补全路径即可；越权错误必须在编排层拒绝，不能寄望模型自觉；外部超时应区分可重试与不可重试，退避后仍失败则降级告知。工具设计的幂等性降低重复调用风险：同一参数调用多次与调用一次结果一致，重试不会产生重复副作用；有副作用的动作要可回滚或加审批。<\/p>\n<h2>补充算例：工具描述与错误分级<\/h2>\n<p>工具描述写法对照。合格定义包含：工具用途一句话、参数名与类型、每个参数的取值范围或枚举、参数之间的依赖（例如提供订单号时用户标识可省略）、返回内容概要。描述重叠的反例：两个检索工具都写“查询相关信息”，模型无法按职责区分；应分别限定检索对象（订单库、产品目录）与返回字段。<\/p>\n<p>错误返回分级：可恢复错误包括缺参数、参数格式不符、外部临时超时，返回字段名、原因与下一步建议，模型可改参重试；业务拒绝包括越权、超出额度，回传拒绝原因，不再重试同一动作；系统错误包括工具不可用、接口故障，回传降级提示，转人工或换备用工具。三级错误混在一起返回空值，模型无法选择正确后续动作。<\/p>\n<p>幂等与回滚：查询类工具天然幂等，重复调用不产生副作用；写入类工具要设计成同一参数重复执行结果一致，或带操作令牌防止重复提交。不可逆动作（删除、对外发送）需要回滚方案或前置审批；工具定义里标注副作用类型，编排层据此决定是否挂护栏。<\/p>\n<p>多工具编排：一次任务串联多个工具时，前一工具结果作为后一工具参数，状态传递走结构化字段；工具之间无依赖时可并行调用（与 c03 衔接）。工具选择冲突时，编排层可以按工具适用范围做二次校验，而不是完全交给模型判断。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：工具越多能力越强。<\/strong> 反证：描述重叠导致乱选，错误率随清单膨胀上升；工具按最小必要保留，职责边界写清。\n<\/li><li>\n<strong>误读：失败返回空值即可。<\/strong> 反证：模型无法区分“没有结果”和“调用失败”；可读错误包含原因与下一步，才能支撑重试（c05 正文环节五）。\n<\/li><li>\n<strong>误读：模型生成的参数天然合规。<\/strong> 反证：模型可能产出合法格式但越权的参数；权限边界与参数校验必须由编排层兜底，属于护栏（c09）职责。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n工具调用六环节中，哪一环把模型意图翻译成可执行请求？哪一环是模型与外部世界的边界？\n<\/li><li>\n工具 schema 为什么要窄、要枚举？参数过宽会在决策环节造成什么问题？\n<\/li><li>\n可读错误应包含哪些信息？为什么空字符串和 null 不能承担错误回传？\n<\/li><li>\n用算例说明缺参数分支如何恢复；越权分支为什么在编排层拦截而不是交给模型判断？\n<\/li><li>\n工具调用与 RAG、MCP 分别是什么关系？哪些能力走工具通道，哪些走专用检索管线？\n<\/ol>\n<h2>适用与不适用速查<\/h2>\n<p>适合工具调用的情况：任务需要最新信息、模型不擅长的计算、用户专属数据或触发外部动作。不适合工具化的能力：无法参数化描述的开放式操作，或工具职责边界长期划不清的动作。工具设计按最小必要保留：schema 收窄、枚举取值、错误可读、写入动作幂等或可回滚；权限校验放在编排层，不依赖模型自觉。多工具串联时前序结果结构化传给后序，无依赖的工具可并发。<\/p>\n<p>工具定义维护时还要定期清理长期未被选中的工具，描述重叠的候选合并或拆分；新工具接入前先核对它与现有工具的职责边界，避免清单膨胀。<\/p>\n<p>工具调用记录同样留痕：调用了哪个工具、参数摘要、返回状态，便于事后排查与合规核对。<\/p>\n<h2>第二个任务的端到端算例：查日历→查库存→订会议室<\/h2>\n<p>估算口径（工程估算，非原书实测）：中文按约 1.6 字符/token；工具定义随上下文带入；外部 API 往返按 0.5–0.8 s 估；模型回合生成按 50 token/s。<\/p>\n<p>任务：为团队预订下周三的会议室，走完工具闭环六步：决定调用谁、传什么参数、拿到结果、再决定下一步。<\/p>\n<ol><li>\n意图识别：用户消息约 50 token，可用工具定义约 350 token；模型判断先查日历。\n<\/li><li>\n调用生成：结构化 JSON <code>{tool:&quot;calendar.query&quot;, args:{date:&quot;next Wed&quot;}}<\/code>，约 40 token。\n<\/li><li>\n执行回传：框架拦截并调用日历接口，返回空闲时段 3 条，约 180 token。\n<\/li><li>\n二次决策：继续调用房间库存工具 <code>room.inventory<\/code>，参数约 40 token；返回可订房间列表约 260 token。\n<\/li><li>\n执行预订：选定房间，调用 <code>room.book<\/code>，参数含日期、时段、人数约 60 token；返回确认号约 50 token。\n<\/li><li>\n最终回复：汇总确认信息约 150 token。\n<\/ol>\n<p>token 估算：工具定义在各回合上下文累计约 930 token（日历 350、库存 300、预订 280），输入累计约 1480 token，输出累计约 290 token。外部耗时：日历接口约 0.6 s、库存约 0.5 s、预订约 0.8 s；模型三次决策回合各约 2 s 加往返，总时长约 10 s。<\/p>\n<p>失败回退：库存不足则改查相邻时段；接口超时按退避重试一次；参数缺失先向用户澄清，不编造参数。预订工具带幂等键，重试不产生重复房间。工具结果以结构化字段回传，框架可直接读取；错误信息同时供开发排查与模型判断回退分支。<\/p>\n<h2>前提再拆一层<\/h2>\n<p>工具调用闭环能成立，还依赖以下几条隐含前提；逐条抽掉后给出故障场景与可观测指标。<\/p>\n<ol><li>\n<strong>工具定义写清用途、参数类型与取值约束。<\/strong> 抽掉后：模型选错工具，或填错参数类型，调用在执行层失败。可观测指标：工具选择正确率、参数校验失败率。\n<\/li><li>\n<strong>工具调用幂等或可回滚，重试有约定。<\/strong> 抽掉后：重试产生重复预订、重复扣款等不可逆副作用。可观测指标：重复副作用事件数、回滚成功率。\n<\/li><li>\n<strong>外部结果以结构化形式回传上下文。<\/strong> 抽掉后：结果是混乱文本，模型二次理解产生偏差。可观测指标：结果解析成功率、字段读取失败条数。\n<\/li><li>\n<strong>编排层能拦截结构化调用并真实执行。<\/strong> 抽掉后：模型只能描述“我去查一下”，动作不落地。可观测指标：调用落地率、拦截解析失败次数。\n<\/li><li>\n<strong>工具错误信息可被理解并触发回退。<\/strong> 抽掉后：错误被当成正常结果继续作答，掩盖失败。可观测指标：错误分支触发率、基于错误的重规划次数。\n<\/li><li>\n<strong>上下文容纳得下多轮工具结果。<\/strong> 抽掉后：早期工具结果被挤出窗口，后续决策丢失依据。可观测指标：上下文占用峰值、早期结果引用丢失率。\n<\/ol><\/div><\/details>", "c06": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.87<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">反思<\/a><\/span><\/div><h1>规划（Planning）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章 | <strong>原书位置<\/strong>：第 6 章《Planning》（PDF 第 87 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>多步、开放的任务容易迷路：目标给了，路径不清楚，智能体若只按反应式行为一步步走，会在中途偏离目标、漏掉依赖关系或卡在某个环节反复试探。原书把规划定位为自主系统的核心过程：在动态或复杂环境中，把高层目标转化为由离散、可执行步骤组成的结构化行动序列（PDF 第 87 页）。<\/p>\n<p>困难在于：计划不是预先写死的脚本。环境会变化——首选场地不可用、餐饮已订满、检索不到材料；初始计划只是起点，智能体需要吸纳新信息、绕开障碍继续推进（PDF 第 87 页）。规划要解决的具体问题，是在“怎么做”尚需探索时，先厘清初始状态与目标状态，再生成行动序列，并在执行中按观察结果调整计划。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：规划智能体承接复杂目标，自主筹划通往目标的行动路线；先理解初始状态（预算、人数、意向日期等）与目标状态（活动成功预订），再找出连接两者的行动序列；计划依据请求动态生成，事先并不知道（PDF 第 87 页）。逐句拆开：<\/p>\n<ul><li>\n“高层目标”：用户给出的是 objective 与约束，不是具体做法；规划要把“做什么”翻译成“怎么做”。\n<\/li><li>\n“初始状态到目标状态”：规划在状态空间中寻路，每一步行动改变当前状态，逐步逼近目标状态（PDF 第 88 页）。\n<\/li><li>\n“离散可执行步骤”：计划由有序子任务构成，子任务之间存在依赖，执行时通过工具或与各系统交互处理依赖关系（PDF 第 87 页）。\n<\/li><li>\n“适应性”：初始计划可被修订；观察到新约束后重新评估选项，给出新计划（PDF 第 87 页）。\n<\/li><li>\n“灵活性与可预测性的权衡”：解法已经清楚且可重复时，把智能体约束在固定工作流中更有效；判断标准是“怎么做”仍需探索，还是已经明确（PDF 第 87 页）。\n<\/ul>\n<p>正例：新员工入职拆成创建系统账号、分配培训模块、协调各部门等有依赖的子任务；研究报告分成信息收集、数据摘要、内容组织、迭代润色几个阶段（PDF 第 87–88 页）。反例：流程已经标准化、每天重复执行，仍让智能体现场生成计划，结果每次步骤不一、难以复核。<\/p>\n<h2>原理推导<\/h2>\n<p>规划过程可按建模、分解、执行检查、重规划四步推导。<\/p>\n<p>第一步建模：明确初始状态、目标状态与约束。初始状态包括已有资源、可用工具、已知限制；目标状态用可验收的结果描述；约束包括时间、权限、不可触碰的边界。这一步用到的假设是：目标与约束可以被表述成状态与条件，否则规划无对象可依。<\/p>\n<p>第二步分解：把高层目标拆成有序子任务，形成计划。每个子任务标注前置依赖与完成条件；粒度以“每步可独立验收”为准。太粗则卡住时无法定位问题，太细则耗尽上下文并削弱灵活性。原书把规划描述为从反应式行为走向目标导向行为的逻辑框架，解决需要连贯、相互依赖操作序列的问题（PDF 第 88 页）。<\/p>\n<p>第三步执行与检查点：按计划逐步执行，每步对照检查点判断是否达标。检查点可以是工具返回、检索结果、校验通过等可观测信号；通过则进入下一步，不通过则进入修正环节。计划中显式记录所依据的假设，假设被推翻时才知道该改哪一段。<\/p>\n<p>第四步重规划：触发条件包括检查点失败、工具连续失败、关键假设被新观察推翻。重规划不是推倒重来，而是登记新约束、重评剩余选项、修订后续步骤；原书举例场地或餐饮不可用时，智能体更换场地或调整日期，而不是直接失败（PDF 第 87 页）。<\/p>\n<p>机制上，规划与反思（c04）衔接：检查点不通过时先局部反思修订产出；若发现计划路径本身不可行，才回到计划层重排。规划与工具调用（c05）衔接：每个子任务的落地执行通过外部工具完成。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>规划适用：任务路径需要现场发现、环境动态变化、子任务相互依赖且无法预先固化流程。结构化信息整合、流程自动化、机器人与导航状态空间寻路，都是书中列出的规划场景（PDF 第 87–88 页）。<\/p>\n<p>边界：解法已知且可重复的任务，固定工作流比自主规划更可靠、更一致，规划带来的不确定性反而是风险（PDF 第 87 页）。子任务无法定义完成条件时，规划无法判断进度，容易空转。环境信息不足、约束互相冲突时，计划质量受限于建模质量；规划不能替代信息收集。计划过细会把上下文填满，过粗则失去指导作用。<\/p>\n<p>条件去掉会怎样：去掉检查点，执行结果不被验收，偏差累积到最后才暴露；去掉重规划触发条件，环境变化后仍沿失效计划推进；去掉假设记录，计划出问题时无法判断哪一步的前提已不成立。<\/p>\n<h2>反例<\/h2>\n<p>计划一次定死的反例：预订行程的计划假设场地可用，执行时场地已满，系统仍按原计划继续联络，直到最后一步才失败；有适应性规划的系统会在登记“场地不可用”后即重排备选方案（PDF 第 87 页）。<\/p>\n<p>计划过细的反例：把一篇报告拆成上百个微步骤，每步都要模型决策与记录，上下文被计划文本占满，留给内容生成的空间不足；拆分粒度应当以可验收的子任务为单位，而不是拆到动作级别。<\/p>\n<h2>辨析<\/h2>\n<p>与链式（c01）的差别：链式步骤在任务开始前固定；规划在执行中生成并可修订序列。链式是规划落地后的一种静态执行形态，规划保留现场调整空间。<\/p>\n<p>与反思（c04）的差别：反思修订当前产出，规划调整后续序列。反思回答“这版哪里不对”，规划回答“接下来怎么走”；计划不可行时，反思的结论升级为重规划。<\/p>\n<p>与多智能体协作（c08）的差别：规划是单个决策层的任务分解与调度；多智能体在此基础上把子任务交给不同角色执行，并建立通信协议。规划可以由一个管理者智能体承担，再分派给执行者。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：链式步骤拆分、工具调用的执行通道、反思的检查—修正闭环。后继：规划是多智能体层级结构中管理者分派任务的依据；RAG 与工具为计划中的信息收集步提供手段；护栏约束规划落地的动作边界。本概念把“状态建模—任务分解—检查点—重规划”这条循环与灵活性、可预测性的权衡串在一起。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（规划）<\/summary><div class=\"depth-body\"><h1>规划（Planning）· 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>逐级倒查规划机制成立的前提：<\/p>\n<ol><li>\n“计划能落地执行”依赖每个子任务可验收：子任务有明确完成条件，执行后能对照判断是否达标；没有验收条件，进度无法判断，计划容易空转。\n<\/li><li>\n“子任务可验收”依赖目标状态可表述：最终要达成的结果能用可观测的描述写出，而不是停留在模糊愿望。\n<\/li><li>\n“目标状态清楚”依赖初始状态与约束可建模：已有资源、可用工具、时间与权限限制、不可触碰的边界都被列入；建模缺项，计划在缺口处只能假设。\n<\/li><li>\n“建模可推进”依赖关键假设被显式记录：计划依据的前提写下来，假设被新观察推翻时才知道该改哪一段。\n<\/li><li>\n“环境变化后能调整”依赖存在重规划触发条件与修订通道：检查点失败、工具连续失败、假设被推翻时，计划可回到计划层重排。\n<\/li><li>\n最底层假设：任务路径需要现场发现，且行动序列可以被分解成可执行子任务；解法已知且可重复时，固定工作流比自主规划更可靠（PDF 第 87 页）。\n<\/ol>\n<p>逆推到读者基线：先认“目标和现状能写成条件”，再认“条件能拆成可验收步骤”，最后认“跑偏后能改计划”。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条分四步，每步写清假设：<\/p>\n<ul><li>\n第一步，建模。明确初始状态、目标状态与约束。初始状态包括已有资源、可用工具、已知限制；目标状态用可验收结果描述；约束包括时间、权限与禁区。用到的假设：目标与约束可以被表述成状态与条件；无法表述的部分需要先收集信息。\n<\/li><li>\n第二步，分解。把高层目标拆成有序子任务，形成计划；每个子任务标注前置依赖与完成条件。粒度以可独立验收为准：太粗卡住时无法定位，太细耗尽上下文并削弱灵活性。原书把规划描述为从反应式行为走向目标导向行为的逻辑框架（PDF 第 88 页）。\n<\/li><li>\n第三步，执行与检查点。按计划逐步执行，每步对照检查点判断是否达标；检查点可以是工具返回、检索结果、校验通过等可观测信号。通过则进入下一步，不通过进入修正。计划中显式记录假设，假设被推翻时才知道改哪段。\n<\/li><li>\n第四步，重规划。触发条件包括检查点失败、工具连续失败、关键假设被新观察推翻。重规划不是推倒重来，而是登记新约束、重评剩余选项、修订后续步骤；原书举例场地或餐饮不可用时，更换场地或调整日期，而不是直接失败（PDF 第 87 页）。\n<\/ul>\n<p>衔接机制：检查点不通过时先局部反思修订产出；发现计划路径本身不可行，才回到计划层重排（与 c04 衔接）。每个子任务的落地执行通过外部工具完成（与 c05 衔接）。<\/p>\n<p>限定条件拆解：<\/p>\n<ul><li>\n史料：新员工入职拆成创建系统账号、分配培训模块、协调各部门等有依赖子任务；研究报告分成信息收集、数据摘要、内容组织、迭代润色阶段（PDF 第 87–88 页）。\n<\/li><li>\n推断：计划粒度与上下文占用存在权衡；拆分到动作级别会把上下文填满，拆分到阶段级别则失去指导作用。这是机制推断，原书未给粒度数值。\n<\/li><li>\n边界：解法已知且可重复的任务，固定流程更可靠一致；规划带来的不确定性在这类场景是风险而非收益（PDF 第 87 页）。\n<\/ul>\n<h2>机制逐项对照<\/h2>\n<ul><li>\n与链式：链式步骤在任务开始前固定；规划在执行中生成并可修订序列。链式是规划落地后的静态执行形态，规划保留现场调整空间。\n<\/li><li>\n与反思：反思修订当前产出；规划调整后续序列。反思回答“这版哪里不对”，规划回答“接下来怎么走”；计划不可行时反思结论升级为重规划。\n<\/li><li>\n与多智能体：规划是单个决策层的任务分解与调度；多智能体把子任务交给不同角色执行并建立协议。规划可由管理者智能体承担，规划产出的序列是多智能体协议的输入。\n<\/li><li>\n失败位置：规划失败集中在建模（目标约束不清）、分解（粒度失当）、重规划（触发条件缺失）三处；执行层失败由工具与反思承担。\n<\/ul>\n<h2>算例：CSV 月报任务<\/h2>\n<p>估算口径（工程估算，非原书测量值）：计划生成调用输入约 900 token，输出计划约 350 token；每个执行步工具往返约 0.4–0.6 秒；模型按 50 token/s 生成。<\/p>\n<p>任务：“把这份 CSV 做成月报”。<\/p>\n<p>建模：初始状态为一份未校验 CSV；目标状态为一份含指标结论与图表的月报；约束为不编造列名、缺字段需向用户确认。<\/p>\n<p>计划与检查点：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>子任务<\/th><th>完成条件（检查点）<\/th><th>工具/动作<\/th><th>失败处理<\/th><\/tr><\/thead><tbody><tr><td>1 读表校验字段<\/td><td>列名与类型识别完整，缺失字段标出<\/td><td>表格解析工具<\/td><td>缺列则转确认，不猜列名<\/td><\/tr><tr><td>2 计算指标<\/td><td>汇总值可复算，口径写明<\/td><td>计算/脚本工具<\/td><td>口径不清则回到建模补约束<\/td><\/tr><tr><td>3 写结论<\/td><td>每条结论挂对应指标<\/td><td>生成调用<\/td><td>无指标支撑的结论删除<\/td><\/tr><tr><td>4 生成图表成稿<\/td><td>图表与结论一致，格式合规<\/td><td>绘图工具 + 排版<\/td><td>不一致则回到第 3 步<\/td><\/tr><\/tbody><\/table><\/div>\n<p>执行推演：第 1 步读表发现“销售额”列缺失，检查点不通过；登记新约束“缺销售额字段”，重规划为先向用户确认字段，而不是编造列名继续算指标。若字段补齐，回到第 2 步。第 3 步某条结论找不到对应指标，局部反思删除该结论，不进入第 4 步。<\/p>\n<p>量级对照：计划生成输入约 900 token、输出约 350 token；四个执行步合计模型侧输入约 2600 token、输出约 700 token，加工具往返约 4–6 秒。若任务标准化后每天重复，可把该计划固化为固定链，省去现场规划的生成调用；这正对应“怎么做已明确”时选固定流程的判断（PDF 第 87 页）。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：计划假设场地可用，执行时已满，系统仍沿原计划联络到最后一步才失败；适应性规划应在登记“场地不可用”后即重排备选（PDF 第 87 页）。反例二：报告被拆成上百个微步骤，上下文被计划文本占满，留给内容生成的空间不足。边界：子任务无法定义完成条件时规划无法判断进度；环境信息不足时计划质量受限于建模质量。<\/p>\n<h2>延伸推演：计划粒度与重规划成本<\/h2>\n<p>计划粒度在两个方向上失当。粒度过粗：子任务无法定义完成条件，执行到中途无法判断是否达标，偏差累积到末端才暴露；粒度到动作级别：计划文本本身占满上下文，每一步都要模型决策与记录，留给实际内容生成的空间被挤压。可行粒度以“可验收子任务”为单位，每个单位带输入、输出与检查点，单位之间的依赖关系单独标注。<\/p>\n<p>重规划不是免费动作。触发重规划意味着前序某步假设失效，已执行部分可能要返工；重规划成本包括重新建模、修订剩余序列、再次执行受影响子任务。因此计划中显式记录假设的价值，在于失效时能快速定位受影响段落，而不是整份计划推倒。触发条件要可观测：检查点失败有明确信号，工具连续失败有计数，假设被推翻有新证据对照；靠“感觉不对”触发的重规划会造成频繁摆动。<\/p>\n<p>规划与固定链的成本分界：任务首次执行、路径需要探索时，规划的现场分解价值高于开销；同一流程重复跑通后，把验证过的计划固化成固定链，省去每次现场规划的生成调用与不确定性。原书把灵活性与可预测性的权衡落到一个判断上：“怎么做”仍需探索还是已经明确（PDF 第 87 页）。明确的任务用固定流程锁定一致性，探索性任务才开放规划权。<\/p>\n<h2>补充算例：计划表示与检查点设计<\/h2>\n<p>一份可执行计划至少包含：子任务编号、动作描述、前置依赖、输入材料、完成条件、所用工具、当前状态。依赖关系写成有向顺序：被依赖的子任务未完成，后续任务不启动。检查点设计对照“可观测”：完成条件必须能由工具返回、检索结果或校验规则判定，例如“列名识别完整”“汇总值可复算”“结论挂对应指标”；写不出观测信号的条件不是合格检查点。<\/p>\n<p>重规划案例展开：CSV 月报任务第 1 步发现销售额列缺失，原计划假设“表内含全部所需字段”被推翻。重规划动作：登记新约束，把“向用户确认字段”插入计划前部，受影响的计算与结论步骤顺延；不是删掉后续步骤，也不是在缺字段状态下继续算。若用户补充后字段齐全，回到原计划轨道；若确认字段不存在，调整目标状态（月报改为基于现有列的口径）。<\/p>\n<p>规划失败模式对照：建模阶段目标模糊，后续步骤围绕错误方向分解；分解阶段粒度失当，过粗卡住或过细耗上下文；执行阶段检查点缺失，偏差累积到末端；重规划阶段触发条件不可观测，频繁摆动或一直不调整。四类失败分别对应建模、分解、执行、重规划四个环节，定位时先看缺陷落在哪一环。<\/p>\n<p>规划与固定流程的切换：同一任务首次执行保留规划权，跑通后把验证过的步骤固化为链式流程；后续重复执行走固定链，省去现场分解的生成调用与不确定性。环境频繁变化、任务结构每次不同时，才持续开放规划。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：计划一次定死即可。<\/strong> 反证：环境会变化，初始计划只是起点；没有重规划通道，新约束出现后系统沿失效计划推进（PDF 第 87 页）。\n<\/li><li>\n<strong>误读：计划越细越好。<\/strong> 反证：过细耗尽上下文、降低灵活性；粒度以可验收子任务为单位，不拆到动作级别。\n<\/li><li>\n<strong>误读：开放任务都应交给规划智能体。<\/strong> 反证：解法已知可重复时固定工作流更可靠；判断标准是“怎么做”需要探索还是已经明确（PDF 第 87 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n规划四步中，哪一步把高层目标变成可执行序列？完成条件写在哪里？\n<\/li><li>\n重规划的三个触发条件分别对应哪类新观察？重规划与推倒重来有什么区别？\n<\/li><li>\n关键假设为什么要显式记录？假设被推翻时，没有记录会造成什么困难？\n<\/li><li>\n用算例说明检查点不通过时，什么时候局部反思就够，什么时候必须回到计划层？\n<\/li><li>\n规划在什么条件下应当让位于固定链式流程？这个判断依据是什么？\n<\/ol>\n<h2>适用与不适用速查<\/h2>\n<p>适合规划的情况：任务路径需要现场发现，环境动态变化，子任务相互依赖且无法预先固化流程。不适合规划的情况：解法已知、流程可重复，此时固定链式流程的一致性与可预测性更好。计划粒度以可验收子任务为单位，检查点必须可观测；关键假设显式记录，检查点失败、工具连续失败、假设被推翻时进入重规划，重规划是修订剩余序列而不是整份推倒。<\/p>\n<p>计划执行中保留一份假设清单：每条假设对应计划中的哪一步、依据什么观察；环境变化时先对照清单判断受影响范围，再决定局部调整还是整段重排。<\/p>\n<p>检查点信号要在计划写出时一并定义，避免执行到中途才补判断标准；无法观测的完成条件不写进计划。<\/p>\n<h2>第二个任务的端到端算例：线下分享会筹备规划<\/h2>\n<p>估算口径（工程估算，非原书实测）：中文按约 1.6 字符/token；规划生成按 50 token/s，外部执行步骤耗时另计；窗口按 32768 token 估算。<\/p>\n<p>任务：筹备一场 30 人线下分享会。初始状态：人数 30、日期待定、预算上限明确；目标状态：场地确认、餐饮就位、物料齐备、通知发出。<\/p>\n<p>初始计划（含依赖与检查点）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>步骤<\/th><th>内容<\/th><th>前置依赖<\/th><th>检查点<\/th><\/tr><\/thead><tbody><tr><td>P1<\/td><td>确定日期与参会名单<\/td><td>用户意向<\/td><td>名单确认<\/td><\/tr><tr><td>P2<\/td><td>预订场地<\/td><td>P1<\/td><td>场地确认号<\/td><\/tr><tr><td>P3<\/td><td>预订餐饮<\/td><td>P2（人数确定）<\/td><td>餐饮订单号<\/td><\/tr><tr><td>P4<\/td><td>准备物料与演示设备<\/td><td>P1（主题确定）<\/td><td>物料清单签收<\/td><\/tr><tr><td>P5<\/td><td>发出通知与议程<\/td><td>P2、P4<\/td><td>通知送达记录<\/td><\/tr><\/tbody><\/table><\/div>\n<p>执行中观察：首选场地当日已满。触发重规划：改期或启用备选场地，P3 顺延到新场地确认之后。检查点作用：P2 未拿到确认号，P3 不启动，避免在场地未定状态下订餐。<\/p>\n<p>token 估算：首轮规划提示加初始状态约 500 token；计划 JSON（五步含依赖与检查点）约 420 token；执行阶段每步回传结果平均约 200 token；重规划回合输入旧计划 420 + 失败观察 150 + 提示 180 ≈ 750 token，输出新计划约 300 token。累计输入约 2750 token，输出约 1520 token；首轮规划生成约 8 s，重规划约 6 s，外部执行步骤另计。<\/p>\n<h2>前提再拆一层<\/h2>\n<p>规划模式能成立，还依赖以下几条隐含前提；逐条抽掉后给出故障场景与可观测指标。<\/p>\n<ol><li>\n<strong>目标与约束可表述为初始状态与目标状态。<\/strong> 抽掉后：规划无从判断任务是否达成，步骤是否完成没有判定依据。可观测指标：目标要素完整率、达成判定可执行性。\n<\/li><li>\n<strong>存在可调用的执行手段把步骤变成现实。<\/strong> 抽掉后：计划停留在文本层面，工具与通道不可达。可观测指标：步骤执行成功率、工具不可达次数。\n<\/li><li>\n<strong>执行观察能回流到规划环节。<\/strong> 抽掉后：障碍被忽略，计划沿已经失效的状态继续推进。可观测指标：观察回流覆盖率、基于观察的重规划次数。\n<\/li><li>\n<strong>计划粒度可执行且依赖关系明确。<\/strong> 抽掉后：步骤过粗无法落地，或依赖错配导致顺序颠倒。可观测指标：步骤一次执行率、依赖冲突条数。\n<\/li><li>\n<strong>环境变化频率在可重规划范围内。<\/strong> 抽掉后：变化快于规划，计划持续处于过期状态。可观测指标：计划有效期、单位时间重规划频次。\n<\/li><li>\n<strong>规划成本与任务价值匹配。<\/strong> 抽掉后：标准化重复任务也现场生成计划，每次步骤不一、难以复核。可观测指标：单任务规划 token、规划阶段耗时占比。\n<\/ol>\n<h2>补充：规划阶段与执行阶段的成本拆分<\/h2>\n<p>把规划阶段与执行阶段分开记账：规划阶段只产出计划与检查点，不触碰外部系统；执行阶段每步调用工具并回传观察。按前述算例口径，首轮规划约 500 输入 token、420 输出 token，重规划一次约 750 输入、300 输出；执行阶段五步累计输入约 1500 token、输出约 600 token。开放任务中规划成本通常低于执行成本，但重规划次数上升时，规划侧 token 会明显放大。<\/p>\n<p>判断规划是否过度：计划步骤在执行中几乎不被修改，说明任务路径本已明确，可退回固定工作流；每步都触发重规划，说明初始状态信息不足，应先补采集再规划。两个方向的偏差都可用重规划频次与计划修改条数观测，而不是凭“计划写得详不详细”判断。<\/p><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.175<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">工具调用<\/a><\/span><\/div><h1>RAG（检索增强生成，Knowledge Retrieval）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章 | <strong>原书位置<\/strong>：第 14 章《Knowledge Retrieval (RAG)》（PDF 第 175 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>独立模型的知识封在训练参数里：信息可能过时，回答领域问题缺少可核验材料，材料没见过时只能凭倾向生成错误内容（PDF 第 175、178 页）。把整座文档库塞进上下文既不可能——上下文窗口有限，成本与延迟也不可接受。<\/p>\n<p>RAG 要解决的具体困难是：在生成之前插入一个外部知识检索环节，只把与当前问题相关的片段放进上下文，让模型基于可核验材料作答并标注出处。这样回答既能跟上外部知识库的更新，又能降低凭空编造的概率；原书指出，RAG 用可核验数据作为回答依据，降低幻觉风险（PDF 第 176、178 页）。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：RAG 把外部知识检索步骤无缝接入生成过程，依靠嵌入、语义相似度、关键词或混合检索与合理分块找到相关材料，再由专用向量库支撑大规模近邻搜索，使回答贴合语境且有事实锚点（PDF 第 178 页）。逐句拆开：<\/p>\n<ul><li>\n“切块（chunking）”：长文档按章节、段落或句子切成分片，而不是整本 50 页手册作为一块入库；切块方式影响上下文与语义是否完整保留（PDF 第 176 页）。\n<\/li><li>\n“嵌入（embedding）”：把词、句、文档表示为数值向量，含义相近的文本在向量空间距离更近（PDF 第 176 页）。\n<\/li><li>\n“召回”：主路径是向量搜索，按语义距离找概念最接近的分片；BM25 等关键词算法擅长专有名词、型号等字面匹配；工程上常见向量加 BM25 的混合检索（PDF 第 176 页）。\n<\/li><li>\n“重排与阈值”：召回候选再按相关度排序、按距离阈值过滤，取 top-k 进入上下文；书中实现以 <code>SIMILARITY_TOP_K<\/code> 控制召回条数、<code>VECTOR_DISTANCE_THRESHOLD<\/code> 限制语义距离上限（PDF 第 183 页）。\n<\/li><li>\n“注入与生成引用”：通过上下文注入提示模板，模型基于片段生成回答并标注引用；材料未召到时应明说，而不是补全。\n<\/ul>\n<p>正例：用户问公司退货政策第三条，检索命中政策文档片段，把原文片段与出处放进上下文，回答逐条引用；检索不到则说明库内无相关条目。反例：不做检索，模型凭常识概括一条“通用退货政策”。<\/p>\n<h2>原理推导<\/h2>\n<p>RAG 链路按入库、查询、召回、重排、注入、生成六步推导。<\/p>\n<p>入库步：文档切块后转向量，写入向量数据库；传统关键词检索按词面匹配，向量检索按语义接近度定位（PDF 第 177 页）。向量库用 HNSW 等索引结构在大规模向量中快速定位近邻，底层可依赖 FAISS、ScaNN 等库，方案包括托管服务与开源库，也可为 Redis、Elasticsearch、Postgres（pgvector）等增加向量能力（PDF 第 177–178 页）。<\/p>\n<p>查询步：用户问题先做必要的改写或规范化，再转向量；查询与文档措辞不一致时，纯关键词检索容易漏召，语义检索负责跨说法匹配。<\/p>\n<p>召回步：向量检索取语义近邻，关键词检索取字面命中，两路结果融合。召回阶段宁可多取候选，避免一开始就漏掉相关分片。<\/p>\n<p>重排步：候选按综合相关度排序，套距离阈值与 top-k 上限；阈值之外、相似度不足的分片不进上下文。这一步控制注入噪声：无关分片过多会干扰模型判断（PDF 第 178 页）。<\/p>\n<p>注入步：通过提示模板把入选片段连同出处拼进上下文；注入内容的数量与排序直接影响模型抓重点。<\/p>\n<p>生成步：模型基于给定材料作答，引用逐条对应片段。证据分散在多个分片或多篇文档时，检索器可能没集齐必要上下文，导致答案不完整（PDF 第 178 页）。<\/p>\n<p>机制上，RAG 的可靠性受链路最薄弱环节支配：切块切断语义、查询与文档用词脱节、top-k 过大稀释重点，都会让生成环节失去可用材料；原书把效果高度依赖分块策略与检索质量列为主要挑战（PDF 第 178 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>RAG 适用：知识量大且需要更新、回答要求可引用、问题答案可在文档材料中找到。混合检索兼顾字面精确与语义泛化；专有名词、编号、型号优先关键词路径。<\/p>\n<p>边界：证据跨多篇文档多跳关联时，普通向量近邻难以拼接，原书给出 GraphRAG 路线——沿实体节点与关系边做路径推理，代价是知识图谱构建、维护成本与延迟更高（PDF 第 178–179 页）。材料本身过时或互相矛盾时，检索质量再高也无法消除源数据问题；知识库需要周期性同步更新（PDF 第 178 页）。链路带来额外延迟、运营成本与提示 token 消耗（PDF 第 178 页）。<\/p>\n<p>条件去掉会怎样：去掉切块与索引，长文档无法被有效检索；去掉重排阈值，噪声片段涌入上下文；去掉引用要求，回答无法核验，退回纯生成；去掉混合检索，同义词与专业术语各丢一头。<\/p>\n<h2>反例<\/h2>\n<p>有 RAG 仍编造的反例：所需片段未被召回，模型在上下文材料不足时补全细节，回答看似有据实则无据。检索环节没集齐证据时，生成模型倾向把缺口填平（PDF 第 178 页）。<\/p>\n<p>切块过碎的反例：句子级切碎后，每条分片缺少主语与背景，召回命中的片段脱离上下文，模型无法判断结论成立条件；切块需要在粒度与语义完整之间留重叠与上下文窗口。<\/p>\n<h2>辨析<\/h2>\n<p>与长期记忆（第 3 章记忆管理）的差别：长期记忆存跨会话的偏好与事实，写入与召回都有过滤策略；RAG 面向外部文档库的按需检索，材料不进入参数。二者都只是把相关信息放回上下文，区别在存储对象与更新方式。<\/p>\n<p>与工具调用（c05）的差别：RAG 是专用检索管线；工具调用是通用动作通道，检索工具只是其中一类。需要动态计算、查询业务系统时走工具，需要回答文档知识时走 RAG。<\/p>\n<p>与 GraphRAG / Agentic RAG 的差别：标准 RAG 是被动数据管线；Agentic RAG 由智能体主动推理、验证并精炼外部知识；GraphRAG 换用图结构检索多跳关系（PDF 第 179、180 页）。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：嵌入与语义相似度概念、上下文窗口约束；工具调用通道可挂载检索能力。后继：RAG 为反思与评审提供外部证据，为多智能体中的研究角色提供材料；记忆层把本次交互中稳定的事实沉淀下来。本概念把“切块—索引—召回—重排—注入—引用”的链路与各环节失败模式、成本结构串在一起。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（RAG（检索增强生成））<\/summary><div class=\"depth-body\"><h1>RAG（检索增强生成）· 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>逐级倒查 RAG 链路成立的前提：<\/p>\n<ol><li>\n“回答有材料依据”依赖相关片段被召回：答案所需证据确实在知识库中，且检索器能把它取出；材料不在库内，链路再顺也无米下锅。\n<\/li><li>\n“片段被召回”依赖切块与索引可用：文档被切成语义完整的分片并转向量入库；切块切断主语与背景，分片脱离上下文，召回也无法使用。\n<\/li><li>\n“召回对齐”依赖查询与文档可对齐：查询说法与文档措辞不一致时，关键词路径漏召，需要语义检索跨说法匹配；两路互补构成混合检索。\n<\/li><li>\n“注入上下文干净”依赖重排与阈值控制：候选按相关度排序后取 top-k，相似度不足的分片不进上下文；噪声过多会误导模型判断（PDF 第 178 页）。\n<\/li><li>\n“材料可更新”依赖知识库可预处理与同步：文档切块、向量化、写入专用存储需要工程投入，动态 wiki 还需周期性更新，否则知识过时（PDF 第 178 页）。\n<\/li><li>\n最底层假设：问题答案可以在外部文档材料中找到并被引用；需要开放式推理或实时业务数据的问题，应分别走推理链路或工具调用（c05）。\n<\/ol>\n<p>逆推到读者基线：先认“材料在库里”，再认“材料能被检索到”，最后认“干净材料能进上下文并被引用”。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条按六步推进，每步写清假设：<\/p>\n<ul><li>\n入库步：文档切块后转向量写入向量库；关键词检索按词面匹配，向量检索按语义接近度定位（PDF 第 177 页）。向量库用 HNSW 等索引在大规模向量中快速定位近邻，底层可依赖 FAISS、ScaNN 等库；方案含托管服务与开源库，也可为 Redis、Elasticsearch、Postgres（pgvector）增加向量能力（PDF 第 177–178 页）。用到的假设：嵌入模型把相近语义映射到相近位置；嵌入质量差，语义检索一起失效。\n<\/li><li>\n查询步：问题先做必要改写或规范化，再转向量；查询与文档措辞脱节时，纯关键词检索漏召，语义检索负责跨说法匹配。\n<\/li><li>\n召回步：向量检索取语义近邻，关键词检索取字面命中，两路融合。召回阶段宁可多取候选，避免一开始漏掉相关分片。\n<\/li><li>\n重排步：候选按综合相关度排序，套距离阈值与 top-k 上限；书中实现以 <code>SIMILARITY_TOP_K<\/code> 控制召回条数、<code>VECTOR_DISTANCE_THRESHOLD<\/code> 限制语义距离上限（PDF 第 183 页）。这一步控制注入噪声。\n<\/li><li>\n注入步：通过提示模板把入选片段连同出处拼进上下文；注入内容数量与排序直接影响模型抓重点。\n<\/li><li>\n生成步：模型基于给定材料作答，逐条对应引用。证据分散在多个分片或多篇文档时，检索器可能没集齐必要上下文，导致答案不完整（PDF 第 178 页）。\n<\/ul>\n<p>机制定位：RAG 可靠性受链路最薄弱环节支配。切块切断语义、查询与文档用词脱节、top-k 过大稀释重点，都会让生成环节失去可用材料；原书把效果高度依赖分块策略与检索质量列为主要挑战（PDF 第 178 页）。<\/p>\n<p>限定条件拆解：<\/p>\n<ul><li>\n史料：BM25 为基于词频排序的传统方法，擅长专有名词与型号字面匹配；混合检索兼顾字面精确与语义泛化（PDF 第 176 页）。\n<\/li><li>\n推断：top-k 取值是召回率与噪声的权衡——取少了漏证据，取多了稀释重点；最优值取决于分片长度与查询类型，原书未给固定数字。\n<\/li><li>\n边界：证据跨多篇多跳关联时，普通向量近邻拼接困难，GraphRAG 沿实体节点与关系边做路径推理，代价是图谱构建维护成本与延迟更高（PDF 第 178–179 页）。\n<\/ul>\n<h2>机制逐项对照<\/h2>\n<ul><li>\n与长期记忆：长期记忆存跨会话偏好与事实，写入召回都有过滤；RAG 面向外部文档库按需检索，材料不进参数。二者都是把相关信息放回上下文，区别在存储对象与更新方式。\n<\/li><li>\n与工具调用：RAG 是专用检索管线；工具调用是通用动作通道，检索工具只是一类。文档知识走 RAG，动态计算与业务系统查询走工具。\n<\/li><li>\n与 GraphRAG / Agentic RAG：标准 RAG 是被动数据管线；Agentic RAG 由智能体主动推理、验证并精炼外部知识；GraphRAG 换用图结构检索多跳关系（PDF 第 179、180 页）。\n<\/li><li>\n失败位置：RAG 失败多在检索与切块环节，不在生成；材料没召回到，生成模型只能在缺口上补全。\n<\/ul>\n<h2>算例：退货政策问答<\/h2>\n<p>估算口径（工程估算，非原书测量值）：查询改写与嵌入约 200 输入 token；召回候选 8 条、每条约 300 token；重排后入选 3 条；生成提示约 500 token；模型按 50 token/s 生成，检索往返约 0.2–0.5 秒。<\/p>\n<p>任务：用户问“我们公司退货政策第三条是什么”。<\/p>\n<p>第 1 步，切块入库（离线）：政策文档按条款切成分片，每片含条款编号与上下文，转向量入向量库；条款标题与编号同时建关键词索引。 第 2 步，查询处理：问题规范化为“退货政策 第三条”，转向量。 第 3 步，召回：向量路径取语义近邻 5 条，BM25 路径按“退货、第三条”命中 3 条，融合去重得候选 8 条。 第 4 步，重排：按相关度排序，套距离阈值，入选 3 条；其中 1 条相似度低于阈值被剔除。 第 5 步，注入：把 3 条原文片段与出处编号拼入提示模板，注入材料约 900 token。 第 6 步，生成：模型基于片段作答，引用对应条款编号；输入约 1400 token，输出约 200 token，生成约 4 秒加检索往返。<\/p>\n<p>失败分支：<\/p>\n<ul><li>\n未召回：候选中没有第三条内容，上下文材料不足；模型应明说库内未检索到该条款，而不是凭常识补一条通用政策。\n<\/li><li>\n证据冲突：两条分片对退货期限表述不一致，重排无法消解时，标注分歧并转人工核对源文档。\n<\/li><li>\n多跳缺失：问题需要跨两篇文档拼接结论，标准向量检索只命中单篇，答案不完整；这类问题评估是否走 GraphRAG。\n<\/ul>\n<p>量级对照：链路额外成本在检索往返与注入 token；召回 8 条若不重排直接注入，材料约 2400 token，噪声稀释重点；重排后 3 条约 900 token。整条链路的延迟、运营成本与提示 token 都高于纯生成（PDF 第 178 页），换来的是可引用与可核验。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：所需片段未被召回，模型在材料不足时补全细节，回答看似有据实则无据。反例二：句子级切碎后分片缺主语与背景，命中片段脱离上下文，模型判断不出结论成立条件。边界：源数据过时或互相矛盾时检索质量无法补救；知识库需周期性同步；图谱路线成本高、延迟大。<\/p>\n<h2>延伸推演：召回率、噪声与延迟分解<\/h2>\n<p>RAG 检索环节在召回率与噪声之间权衡。top-k 取大，相关片段被漏掉的概率下降，但进入上下文的无关片段增多，模型注意力被稀释，矛盾材料也更易出现；top-k 取小，噪声减少，但证据不全时答案不完整。距离阈值剔除低相似度分片，阈值过严漏掉近义表述，过松放进噪声分片。最优取值随分片长度、查询类型与嵌入质量变化，需要在标注样例上比对召回与可用率，而不是沿用固定数字。<\/p>\n<p>切块策略影响两头。切得过碎，分片缺主语、背景与结论条件，命中后无法独立使用；切得过整，单块信息密度低、语义混杂，向量距离被稀释。重叠切块让相邻分片共享边缘句子，缓解切断语义的问题，代价是入库存储与重复内容增加。专有名词、编号、型号优先靠关键词路径，语义近义表达靠向量路径，混合检索覆盖两头（PDF 第 176 页）。<\/p>\n<p>链路延迟可以拆成几段：查询处理与嵌入、两路检索往返、重排排序、注入拼接、生成作答。检索往返是外部耗时，注入 token 随入选分片数量增长，生成时间随上下文长度上升。整条链路比纯生成多付出检索成本与提示 token，换来的是材料可引用、知识可更新；当问题答案不在知识库中时，这套成本不产生收益，系统应明示未检索到，而不是补全。<\/p>\n<h2>补充算例：检索失败的链路定位<\/h2>\n<p>RAG 回答出错时，按链路逐段定位而不是归因于生成模型。先查入库：文档是否切块、转向量、写入索引；再查查询：问题改写是否保留了核心实体与限定条件；再查召回：相关分片是否进入候选集；再查重排：相关分片是否被阈值或 top-k 滤掉；最后查注入与生成：入选材料是否完整进入上下文，引用是否对应正确分片。每一段都有可检查的中间产物，定位才不会停在“回答不准”。<\/p>\n<p>切块策略补充：说明书按章节切，条款类文档按条目切，长段落按句子加重叠切；分片内保留标题路径（章节编号加标题），让命中分片自带上下文。重叠长度按分片大小调整，目的是避免边界处结论被切断。入库时同时记录分片来源、版本与更新时间，支撑后续时效判断。<\/p>\n<p>查询改写的作用：用户提问常含代词、口语化表述或省略，改写补充实体与限定词后再转向量；改写不能改变原意，也不能引入材料中不存在的限定。混合检索中，关键词路径兜住型号、编号、专有名词等字面命中，向量路径兜住近义与表述差异；两路结果融合时按来源标注，便于回溯命中依据。<\/p>\n<p>引用核验：生成回答的每条主张都应能指回具体分片；引用缺失或分片不支撑主张，属于输出层可拦截的问题。材料互相矛盾时，标注分歧并核对源文档版本，不替源数据做取舍。知识库需要周期性同步：源文档更新后重新切块入库，旧版本分片及时失效，否则召回新旧并存的依据。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：有 RAG 就不会幻觉。<\/strong> 反证：材料没召回到时模型照样编；检索环节没集齐证据，生成倾向填平缺口（PDF 第 178 页）。\n<\/li><li>\n<strong>误读：向量检索万能。<\/strong> 反证：精确术语、编号、型号用关键词检索更稳；实践上用向量加 BM25 混合检索互补（PDF 第 176 页）。\n<\/li><li>\n<strong>误读：top-k 越大材料越全。<\/strong> 反证：候选过多稀释重点、引入噪声；重排阈值与入选条数要按分片长度和查询类型权衡。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\nRAG 六步中，哪一步决定“哪些材料进上下文”？top-k 与距离阈值分别控制什么？\n<\/li><li>\n为什么说 RAG 失败多在检索与切块，而不在生成？用未召回分支说明。\n<\/li><li>\n混合检索两路各擅长什么？只保留一路会漏掉哪类匹配？\n<\/li><li>\n用算例说明重排前后注入 token 的差别；噪声分片进入上下文会造成什么误导？\n<\/li><li>\n证据跨多篇多跳关联时标准 RAG 的短板在哪？GraphRAG 用什么结构弥补，代价是什么？\n<\/ol>\n<h2>适用与不适用速查<\/h2>\n<p>适合 RAG 的情况：知识量大且需要更新，回答要求可引用，答案可在文档材料中找到。不适合 RAG 单独承担的情况：需要开放式推理的问题、实时业务系统数据查询（走工具调用）、证据跨多篇多跳关联（评估 GraphRAG）。链路质量受最薄弱环节支配：切块切断语义、查询与文档用词脱节、top-k 过大都会让生成失去可用材料；材料未召到时应明示，而不是补全细节。<\/p>\n<p>入库分片记录来源文档、版本号与更新时间；源文档修订后重新切块入库并使旧分片失效，避免新旧版本依据同时被召回，造成答案前后矛盾。<\/p>\n<p>重排阶段保留候选出处，便于回答回溯；入选片段在上下文中按相关度排序，重点材料靠前，避免噪声材料挤占模型注意力。<\/p>\n<h2>第二个任务的端到端算例：500 篇文档库的召回率与上下文预算<\/h2>\n<p>估算口径（工程估算，非原书实测）：中文按约 1.6 字符/token；切块按 500 汉字/块 ≈ 312 token/块；窗口按 32768 token 估算。<\/p>\n<p>库规模：500 篇文档，平均每篇 3000 汉字 ≈ 1875 token/篇；每篇切 6 块，总块数约 3000 块。<\/p>\n<p>检索链路：<\/p>\n<ol><li>\n提问嵌入：问题约 40 汉字 ≈ 25 token；嵌入向量不占文本上下文。\n<\/li><li>\n向量召回 top-20：候选 20 块；BM25 关键词补回 5 块，去重后 22 块。\n<\/li><li>\n重排取 top-5：保留 5 块，片段合计约 1560 token（5 × 312）。\n<\/li><li>\n注入生成：系统提示约 300 token + 片段 1560 + 问题 25，输入约 1885 token；答案输出约 300 token，占窗口约 5.8%。\n<\/ol>\n<p>召回率推算：假设与问题相关的块在库内共 8 块；向量召回命中 6 块，BM25 补回 1 块，混合召回命中 7/8 ≈ 87.5%；重排后 top-5 保留其中 5 块，注入命中率 5/7 ≈ 71%。若只取 top-3，片段降至约 936 token，但靠后的相关块可能被截掉。<\/p>\n<p>上下文预算：top-k 每增加 1 块增加约 312 token；top-5 扩到 top-10 增加约 1560 token，生成可用上下文相应减少。失败定位：型号等专有名词走字面匹配，向量漏、BM25 命中；距离阈值过高会滤掉相关块，过低则引入噪声片段。<\/p>\n<h2>前提再拆一层<\/h2>\n<p>RAG 链路能成立，还依赖以下几条隐含前提；逐条抽掉后给出故障场景与可观测指标。<\/p>\n<ol><li>\n<strong>文档已切块入库且切块保留语义完整。<\/strong> 抽掉后：相关信息跨块断裂，召回命中也答不全。可观测指标：块内语义完整率、跨块相关占比。\n<\/li><li>\n<strong>嵌入、索引与查询处于同一表示空间并保持更新。<\/strong> 抽掉后：新文档检索不到，或术语错位导致语义距离失真。可观测指标：新文档可检索时延、索引新鲜度。\n<\/li><li>\n<strong>相关材料确实存在于库内。<\/strong> 抽掉后：检索无命中，模型只能凭倾向补全内容。可观测指标：无命中间占比、拒答率。\n<\/li><li>\n<strong>重排阈值与 top-k 与上下文预算匹配。<\/strong> 抽掉后：噪声挤占窗口，或相关块在截断处被丢掉。可观测指标：注入片段相关度、窗口占用率。\n<\/li><li>\n<strong>生成环节以片段为依据并标注出处。<\/strong> 抽掉后：检索到的材料不被使用，答案与片段脱节。可观测指标：答案引用片段覆盖率、无依据陈述条数。\n<\/li><li>\n<strong>评测集覆盖真实提问方式。<\/strong> 抽掉后：离线召回率好看，线上长尾问题漏检。可观测指标：离线 top-k 命中与线上抽样一致率、长尾问题召回率。\n<\/ol>\n<h2>补充：混合检索与阈值的代价对照<\/h2>\n<p>纯向量召回对专有名词、型号编号等字面信号较弱；BM25 补回的块在这类查询上贡献主要命中。混合召回的代价是候选集合变大，重排环节需要排序的块数从 20 增到 22，重排延迟随候选数线性增加。距离阈值的调整方向：阈值放宽，注入片段相关度下降、窗口占用上升；阈值收紧，召回率下降、无命中拒答增多。<\/p>\n<p>调阈值时同时看两个指标——注入片段相关度与无命中率，单看任一侧都会把系统推向噪声或漏检。top-k 的选择同样受上下文预算约束：每增加一块约 312 token，需要从生成可用额度里扣除对应部分；预算紧张时先收紧 top-k，再用重排质量补召回。<\/p><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.97<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">规划<\/a><\/span><\/div><h1>多智能体协作（Multi-Agent Collaboration）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章 | <strong>原书位置<\/strong>：第 7 章《Multi-Agent Collaboration》（PDF 第 97 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>单体智能体在边界清晰的问题上往往够用，但面对复杂、跨领域任务时能力很快触及瓶颈：单个角色同时承担研究、写作、审阅，工具清单越堆越长，上下文装不下，视角也互相牵制（PDF 第 97 页）。多智能体协作要解决的困难，是把复杂问题拆给具备相应工具与能力的专精智能体，通过交互与协同完成共同目标。<\/p>\n<p>另一类困难是接口与协调：多个智能体各自独立运转时，容易重复劳动、结论互相覆盖、责任边界不清。多智能体设计不只是“多起几个模型”，还要明确谁做什么、信息怎么传递、最终由谁汇总；原书指出，系统的力量来自智能体之间的交互与协同效应（PDF 第 97 页）。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：多智能体协作设计由多个独立或半独立智能体组成的系统，围绕共同目标工作；各智能体通常有清晰角色、与总体目标对齐的子目标，并可访问不同工具或知识库（PDF 第 97 页）。逐句拆开：<\/p>\n<ul><li>\n“独立或半独立”：各智能体有自己的执行循环与上下文，不是同一提示下的几次调用。\n<\/li><li>\n“角色与子目标”：角色定义职责边界，子目标与总体目标对齐，避免各自为政。\n<\/li><li>\n“不同工具或知识库”：每个智能体分管一部分工具与资料，而不是由单一智能体包揽全部工具（PDF 第 98 页）。\n<\/li><li>\n“三要素”：角色与职责划分、信息交换通道、指导协作的任务流或交互协议（PDF 第 99 页）。\n<\/li><li>\n“协作拓扑”：书中列出顺序交接、并行处理、辩论与共识、层级结构、专家团队、批评者—审阅者六种形式（PDF 第 98 页）。\n<\/ul>\n<p>正例：研究者检索材料、写作者起草稿件、编辑审阅修订；管理者智能体按下属能力动态分派任务并汇总结果。反例：两个智能体角色描述重叠、输出格式未定，并行产出后无人负责合并，最终交付两份互相矛盾的草稿。<\/p>\n<h2>原理推导<\/h2>\n<p>多智能体系统可按分工、通信、协议、汇总四步推导。<\/p>\n<p>第一步分工：把任务拆成职责可辨的子任务，分配给对应角色。角色之间的输入、输出与验收标准写清楚；工具按角色分管，减少单个上下文的工具清单长度。分工成立的前提是子任务接口清晰、可独立验收；接口不清时，协调成本高于分工收益。<\/p>\n<p>第二步通信：智能体之间通过消息交换信息。消息内容约定结构（谁、做了什么、产物是什么、依据什么），避免每条消息都靠自然语言重新理解。通信需要共享状态：共同目标、已完成项、待办与约束，保证各角色在同一事实基础上协作。<\/p>\n<p>第三步协议：任务流规定协作顺序与规则——是顺序交接、并行汇合、辩论共识还是层级委派。原书六种拓扑对应不同依赖结构：顺序交接把产物交给下一个智能体推进流水线；并行处理同时处理不同片段后合并；辩论与共识由不同视角讨论后形成判断；层级结构由管理者分派并汇总；专家团队按领域分工；批评者—审阅者先出初稿再从政策、安全、合规、正确性、质量等维度审阅（PDF 第 98 页）。<\/p>\n<p>第四步汇总：指定最终负责合成结果的角色或环节。并行产物在此合并、去重、消解冲突；批评意见回流给原作者或终审智能体修订。没有汇总责任，多份产物无法变成一份交付。<\/p>\n<p>机制上，多智能体把单体内的上下文与工具压力分散到多个角色，代价是通信开销、上下文不一致与责任协调；收益是否覆盖成本，取决于拆分处的接口质量。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>多智能体适用：任务可拆成接口清晰、可独立验收的子任务；需要不同专业视角或不同工具/知识库；片段可并行或需要独立审阅。代码生成、研究写作、逻辑校验、伦理对齐等场景适合批评者—审阅者拓扑（PDF 第 98 页）。<\/p>\n<p>边界：子任务强依赖、接口无法预先定义时，拆分后通信反复对齐，稳定性低于单智能体加工具。角色重叠会造成重复劳动与责任稀释；智能体数量增加不直接等于质量提升。通信链条过长会放大 token 消耗与延迟，上下文在多跳传递中可能失真。<\/p>\n<p>条件去掉会怎样：去掉角色职责划分，多个智能体争抢同一任务；去掉通信协议，消息格式与流转顺序无约定；去掉汇总环节，并行结果并列输出；去掉共享状态，各角色基于不一致的前提工作。<\/p>\n<h2>反例<\/h2>\n<p>接口不清仍拆分的反例：数据分析任务拆给两个智能体，一个出结论、一个找证据，但未约定结论引用证据的格式，汇合时证据与主张对不上，只能返工重连。<\/p>\n<p>角色堆叠的反例：为一个简单问答配置规划者、执行者、批评者、汇总者四个角色，每次回答经过四跳通信，延迟与 token 数倍增长，回答质量与单智能体持平。书中把“怎么做是否需要分解”作为判断前提（与规划权衡一致，PDF 第 87 页），简单任务不必上多智能体。<\/p>\n<h2>辨析<\/h2>\n<p>与并行化（c03）的差别：并行化是执行层并发手段，子任务可以是同模型多次调用；多智能体是角色与协议层分工，含独立上下文、消息通道与汇总责任。多智能体内部常嵌套并行，但并行本身不构成多智能体。<\/p>\n<p>与规划（c06）的差别：规划是决策层分解与调度；多智能体把分解出的子任务交给不同角色执行。规划可以由管理者智能体承担，规划产出的序列是多智能体协议的输入。<\/p>\n<p>与人机协作（第 4 章）的差别：多智能体角色之间自动交接；人机协作在关键动作前引入人工审批或确认。人作为一个特殊角色进入协作链，承担复核与否决。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：链式的结构化产物、并行化的并发与聚合、规划的任务分解。后继：护栏（c09）约束各智能体的权限与输出；工具调用是各角色触达外部能力的通道；反思的生产者—批评者模型是批评者—审阅者拓扑的简化形态。本概念把“分工—通信—协议—汇总”的设计链路与协调成本、接口前提串在一起。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（多智能体协作）<\/summary><div class=\"depth-body\"><h1>多智能体协作（Multi-Agent Collaboration）· 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>逐级倒查多智能体系统成立的前提：<\/p>\n<ol><li>\n“多角色能合成一份交付”依赖汇总责任明确：有指定角色或环节负责合并、去重、消解冲突，最终产物由它收口；没有汇总责任，多份产物无法变成一份交付。\n<\/li><li>\n“汇总可执行”依赖通信协议约定：消息结构、流转顺序、交接格式事先写清；每条消息说明谁、做了什么、产物是什么、依据什么。\n<\/li><li>\n“协议可落地”依赖角色接口可验收：每个智能体的输入、输出与验收标准明确；接口不清，通信反复对齐，协调成本高于分工收益。\n<\/li><li>\n“接口可划分”依赖子任务可拆分：任务能按职责、专业或工具边界分成独立单元；强耦合、无法预先定义接口的部分不宜拆给不同智能体。\n<\/li><li>\n“协作不跑偏”依赖共享状态：共同目标、已完成项、待办与约束在角色之间一致；各角色基于不一致的前提工作，结论互相覆盖。\n<\/li><li>\n最底层假设：拆分带来的专业化与并行收益，超过通信、上下文不一致与责任协调的成本；收益不抵成本时，单智能体加工具更稳。\n<\/ol>\n<p>逆推到读者基线：先认“任务能按职责拆开”，再认“角色之间消息怎么传”，最后认“谁来收口”。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条分四步，每步写清假设：<\/p>\n<ul><li>\n第一步，分工。把任务拆成职责可辨的子任务分配给对应角色；角色之间的输入、输出与验收标准写清楚；工具按角色分管，减少单个上下文的工具清单长度。用到的假设：子任务接口清晰、可独立验收；这是分工成立的硬前提。\n<\/li><li>\n第二步，通信。智能体通过消息交换信息，消息约定结构；通信需要共享状态，保证各角色在同一事实基础上协作。用到的假设：结构化消息能被接收方直接解析，不必靠自然语言重新理解。\n<\/li><li>\n第三步，协议。任务流规定协作顺序与规则。原书列出六种拓扑：顺序交接把产物交给下一智能体推进流水线；并行处理同时处理不同片段后合并；辩论与共识由不同视角讨论后形成判断；层级结构由管理者分派并汇总；专家团队按领域分工；批评者—审阅者先出初稿，再从政策、安全、合规、正确性、质量、组织目标一致性等维度审阅（PDF 第 98 页）。\n<\/li><li>\n第四步，汇总。指定最终合成结果的角色或环节；并行产物在此合并、去重、消解冲突；批评意见回流给原作者或终审智能体修订。\n<\/ul>\n<p>机制定位：多智能体把单体内的上下文与工具压力分散到多个角色，代价是通信开销、上下文不一致与责任协调；收益是否覆盖成本取决于拆分处的接口质量。系统三要素为角色职责划分、信息交换通道、任务流或交互协议（PDF 第 99 页）。<\/p>\n<p>限定条件拆解：<\/p>\n<ul><li>\n史料：六种协作拓扑与三要素均来自原书第 7 章（PDF 第 98–99 页）。\n<\/li><li>\n推断：角色数量与质量的关系是非单调的——角色过少职责堆叠，过多则通信链拉长；最优规模取决于任务可分性，原书未给固定数量。\n<\/li><li>\n边界：子任务强依赖、接口无法预定义时，拆分后稳定性低于单智能体加工具；通信链条过长会放大 token 消耗与延迟，上下文在多跳传递中可能失真。\n<\/ul>\n<h2>机制逐项对照<\/h2>\n<ul><li>\n与并行化：并行化是执行层并发手段，子任务可以是同模型多次调用；多智能体是角色与协议层分工，含独立上下文、消息通道与汇总责任。多智能体内部常嵌套并行，但并行本身不构成多智能体。\n<\/li><li>\n与规划：规划是决策层分解与调度；多智能体把分解出的子任务交给不同角色执行。规划可由管理者智能体承担，规划产出的序列是多智能体协议的输入。\n<\/li><li>\n与人机协作：多智能体角色之间自动交接；人机协作在关键动作前引入人工审批或确认。人作为特殊角色进入协作链，承担复核与否决。\n<\/li><li>\n失败位置：多智能体失败集中在分工（接口不清）、通信（格式状态不一致）、汇总（冲突未消解）三处；角色重叠造成重复劳动与责任稀释。\n<\/ul>\n<h2>算例：研究—写作—编辑团队<\/h2>\n<p>估算口径（工程估算，非原书测量值）：每个角色系统提示约 800 token；角色间消息按产物长度计；模型按 50 token/s 生成，消息编排往返约 0.3 秒。<\/p>\n<p>任务：产出一篇带引用的研究简报。<\/p>\n<p>角色与接口：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>角色<\/th><th>输入<\/th><th>输出<\/th><th>验收标准<\/th><\/tr><\/thead><tbody><tr><td>研究者<\/td><td>主题 + 检索范围<\/td><td>材料清单（片段 + 出处）<\/td><td>每条材料带出处，无空引用<\/td><\/tr><tr><td>写作者<\/td><td>材料清单<\/td><td>简报初稿<\/td><td>主张挂对应材料，结构完整<\/td><\/tr><tr><td>编辑/审阅者<\/td><td>初稿 + 政策与质量标准<\/td><td>审阅意见 + 修订建议<\/td><td>逐条标注问题位置与改法<\/td><\/tr><tr><td>汇总者<\/td><td>修订稿<\/td><td>最终简报<\/td><td>引用完整，冲突已消解<\/td><\/tr><\/tbody><\/table><\/div>\n<p>消息流：<\/p>\n<ol><li>\n研究者并发检索，产物约 600 token，交写作者；本步输入约 1000 token，输出约 600 token。\n<\/li><li>\n写作者读取材料清单生成初稿，约 800 token；输入约 1400 token，输出约 800 token。\n<\/li><li>\n审阅者按标准出意见，约 300 token；输入约 1600 token，输出约 300 token。\n<\/li><li>\n写作者据意见出修订版，约 820 token；汇总者合并定稿约 700 token。\n<\/ol>\n<p>通信开销：四跳消息合计模型侧输入约 5000 token、输出约 3200 token；角色间消息往返约 1.2 秒，加各角色生成时间。对照单智能体串行完成同题，输入约 1800 token、输出约 900 token；多智能体多出的 token 与延迟，换的是研究、写作、审阅三个视角的分离与独立验收。<\/p>\n<p>冲突解决：研究者两份材料结论不一致时，汇总者标注分歧并退回研究者补证；审阅者与写作者意见冲突时，以验收标准为准，不按角色级别压服。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：数据分析任务拆给两个智能体，结论与证据的引用格式未约定，汇合时对不上，只能返工重连。反例二：简单问答配置规划者、执行者、批评者、汇总者四角色，每答一跳通信，延迟与 token 数倍增长，质量与单智能体持平。边界：子任务强依赖、接口无法预定义时优先单智能体；角色重叠要合并；通信链过长要压缩跳数。<\/p>\n<h2>延伸推演：通信开销与 token 爆炸<\/h2>\n<p>多智能体的通信成本随跳数和消息体积增长。设一条协作链经过 <span class=\"katex-inline\">h<\/span> 个角色，每跳传递一份产物 <span class=\"katex-inline\">M<\/span>，若每跳都把上游历史整包再带一遍，第 <span class=\"katex-inline\">h<\/span> 跳携带的内容随跳数累加；即便只传当前产物，每个角色也要重新载入自身系统提示与接收材料。角色越多、交接越频，上下文在多跳传递中被反复搬运，token 总量明显高于单智能体串行完成。<\/p>\n<p>上下文失真沿跳数累积。上游产物经过摘要、转述、格式转换后交给下游，细节在每一跳损失或走样；协议约定的结构化消息能减少自然语言转述带来的偏差，但跨多跳后仍需汇总者对照原始材料核验。压缩消息体积与保留关键依据之间要平衡：只传结论不传依据，下游无法判断结论成立条件；全量传递又撑爆上下文。<\/p>\n<p>协调成本决定多智能体是否划算。分工带来专业化与并行收益，对应的成本是角色对齐、消息等待、冲突消解与责任认定。子任务接口清晰、产物可独立验收时，协调成本可控；接口模糊时，角色间反复澄清、互相等待，成本超过单智能体加工具。判断顺序因此是先看任务可分性，再估通信与协调成本，最后才决定是否拆成多角色；不是所有并行任务都需要独立智能体。<\/p>\n<h2>补充算例：角色接口与拓扑选型<\/h2>\n<p>角色接口定义逐项写明：角色名与职责、输入材料清单、输出格式与验收标准、可调用工具、禁止动作。以研究—写作—编辑团队为例，研究者输出材料清单必须含片段与出处，写作者初稿每条主张挂材料编号，编辑意见标注问题位置与改法；接口不定，汇合时只能靠自然语言互相追问。<\/p>\n<p>拓扑选型对照：流程前后衔接、产物依次传递，选顺序交接；片段互不依赖、分头处理，选并行处理；需要多视角权衡备选项，选辩论与共识；任务可按能力分派并需要收口，选层级结构；领域专长分明，选专家团队；产出后需要合规与质量复核，选批评者—审阅者。拓扑由依赖结构决定，不是先定角色再找用途。<\/p>\n<p>汇总冲突处理：两份产物结论不一致时，汇总者对照各自依据判定；依据不足则退回补充，不按角色级别压服。重复信息在汇总步去重，遗漏项列出缺口。多跳通信中，关键依据随消息携带，避免下游只能看到结论看不到来源。<\/p>\n<p>边界对照：单智能体加工具能完成的任务，拆分多角色只会增加等待与对齐成本；子任务可独立验收、工具可分管、视角确实需要分离时，专业化收益才覆盖通信开销。判断顺序：先拆任务，再估接口清晰度，最后决定是否拆角色。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：智能体数量越多越强。<\/strong> 反证：角色重叠增加协调成本与重复劳动；能力来自接口质量与专业化，不来自角色堆叠。\n<\/li><li>\n<strong>误读：多智能体一定比单智能体准。<\/strong> 反证：接口不清时通信反复对齐，系统更不稳定；判断标准是子任务能否接口清晰、独立验收。\n<\/li><li>\n<strong>误读：多智能体就是多次并行调用。<\/strong> 反证：并行调用不含独立角色、消息协议与汇总责任；多智能体是分工层设计，并发只是其内部执行手段。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n多智能体四步中，哪一步决定角色边界？哪一步对最终产物收口？\n<\/li><li>\n六种协作拓扑分别对应什么依赖结构？批评者—审阅者拓扑适用于哪些场景？\n<\/li><li>\n通信协议要约定哪些内容？共享状态缺失会导致什么不一致？\n<\/li><li>\n用算例对照单智能体，说明多智能体多出的 token 与延迟换来了什么；什么情况下这笔交易不划算？\n<\/li><li>\n多智能体与并行化、规划、人机协作的边界分别在哪里？\n<\/ol>\n<h2>适用与不适用速查<\/h2>\n<p>适合多智能体的情况：任务可拆成接口清晰、可独立验收的子任务，需要不同专业视角或分管不同工具。不适合多智能体的情况：子任务强依赖、接口无法预定义，或单智能体加工具即可完成；后者拆分带来的通信与对齐成本高于收益。先判断任务可分性，再估协调成本，最后才决定是否拆角色。<\/p>\n<h2>第二个任务的端到端算例：分布式排障团队的通信量估算<\/h2>\n<p>估算口径（工程估算，非原书实测）：中文按约 1.6 字符/token；各角色独立上下文，顺序交接；模型回合生成按 50 token/s。<\/p>\n<p>拓扑：监控员 → 诊断员 → 修复员 → 复核员，顺序交接、层级收口；任务是线上接口报错率升高后的排障。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>角色<\/th><th>输入构成<\/th><th>输入 token<\/th><th>产物<\/th><th>输出 token<\/th><\/tr><\/thead><tbody><tr><td>监控员<\/td><td>告警信息 150<\/td><td>约 150<\/td><td>异常摘要（指标、时段、影响范围）<\/td><td>约 280<\/td><\/tr><tr><td>诊断员<\/td><td>摘要 280 + 历史日志 600<\/td><td>约 880<\/td><td>可能原因排序<\/td><td>约 320<\/td><\/tr><tr><td>修复员<\/td><td>诊断 320 + 变更记录 400<\/td><td>约 720<\/td><td>修复方案与执行步骤<\/td><td>约 300<\/td><\/tr><tr><td>复核员<\/td><td>方案 300 + 风险清单 200<\/td><td>约 500<\/td><td>复核结论<\/td><td>约 180<\/td><\/tr><\/tbody><\/table><\/div>\n<p>通信量对照：若每一跳都把上游全量上下文复制进当前角色，四跳累计上下文膨胀约 3430 token（150+280、280+600+320、320+400+300、300+200+180 分段相加）；只传结构化产物时累计约 1230 token。两者差额就是接口不清造成的 token 膨胀。<\/p>\n<p>延迟：顺序交接，四个角色各一次模型回合约 4 × 6 s，外部工具时间另计；复核必须在修复方案之后，不能与修复并行。可观测指标：角色间消息条数、每跳平均 token、重复劳动次数、结论回退率。<\/p>\n<h2>前提再拆一层<\/h2>\n<p>多智能体协作能成立，还依赖以下几条隐含前提；逐条抽掉后给出故障场景与可观测指标。<\/p>\n<ol><li>\n<strong>角色职责边界清晰且子目标对齐总目标。<\/strong> 抽掉后：两个角色重复排查，或各自为政、结论方向分散。可观测指标：职责重叠条目、子目标偏离率。\n<\/li><li>\n<strong>角色间接口与产物格式约定明确。<\/strong> 抽掉后：下游要从上游自由文本里提取信息，交接处反复返工。可观测指标：接口字段命中率、格式返工次数。\n<\/li><li>\n<strong>通信通道只传递必要信息。<\/strong> 抽掉后：全量上下文跨角色复制，token 随跳数膨胀。可观测指标：每跳平均 token、上下文冗余率。\n<\/li><li>\n<strong>有明确的收口角色与决策顺序。<\/strong> 抽掉后：多份结论并列交付，无人负责合并。可观测指标：收口缺失次数、矛盾结论条数。\n<\/li><li>\n<strong>各角色工具与资料与其职责匹配。<\/strong> 抽掉后：诊断员拿不到日志，只能凭推测给原因。可观测指标：角色工具可达率、因资料不足导致的回退次数。\n<\/li><li>\n<strong>拓扑与任务依赖匹配。<\/strong> 抽掉后：强依赖被并行切开，或无依赖被串行拖慢。可观测指标：拓扑返工次数、阶段等待时间。\n<\/ol>\n<h2>补充：顺序交接与并行团队的延迟对照<\/h2>\n<p>顺序交接拓扑的延迟等于各角色回合耗时相加，通信简单、责任清晰；并行团队中各角色同时开工，延迟取最长支路，但需要收口角色处理产物冲突。排障场景里诊断与修复存在依赖，不能并行；若任务改为“三条线索分别排查”，则可并行采集再由收口角色合并。<\/p>\n<p>选拓扑先看角色间是否有数据依赖，再看收口成本，而不是默认并行更快。接口不清时，并行团队的省时间会被聚合阶段的对齐与冲突消解吃掉；接口明确时，顺序交接也可在无依赖环节插入并行支路，两种结构可以在同一系统内按段组合。<\/p><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.229<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">工具调用<\/a><\/span><\/div><h1>护栏（Guardrails / Safety Patterns）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章 | <strong>原书位置<\/strong>：第 18 章《Guardrails/Safety Patterns》（PDF 第 229 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>智能体具备调用工具、触发真实世界动作的能力后，出错不再只是文本不当：越权操作、有害输出、提示注入、敏感信息泄露都可能造成实际影响。随着系统越来越自主、越来越深入关键流程，需要一层缓冲机制约束行为与输出，拦下有害、带偏见、跑题或其他不合适的内容（PDF 第 229 页）。<\/p>\n<p>护栏要解决的具体困难，是把“出错”限制在可恢复范围内：在动作发生前拦住越权请求，在执行中约束权限与副作用，在交付前检查输出合规性。只在末端做内容过滤不够——执行中的越权动作已经造成影响；护栏必须布在整条链路的不同位置，形成纵深防御。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>原书定义：护栏（也称安全模式）是保证智能体安全、合规、按设计工作的关键机制，作为保护层引导行为与输出；其目标不是限制智能体能力，而是让运行具备稳定性、可信度与实际效用（PDF 第 229 页）。逐句拆开：<\/p>\n<ul><li>\n“输入侧”：处理前先净化、校验进入系统的数据；可接内容审核接口检测不当提示，用 Pydantic 等 schema 校验工具确保结构化输入符合预设规则（PDF 第 230 页）。\n<\/li><li>\n“执行侧”：约束运行时的权限、范围与速率；角色、目标、背景设定写清楚本身就是软护栏，多个小专家优于堆叠一个全功能角色（PDF 第 231 页）。\n<\/li><li>\n“输出侧”：对结果做过滤、标注与复核；可用计算量较小的模型作为快速附加检查，预筛输入或复核主模型输出是否违反政策（PDF 第 229 页）。\n<\/li><li>\n“可追溯”：记录使用情况、输入与输出以便排查审计，收集延迟、成功率、错误等指标；每个智能体动作可回溯到来源（PDF 第 230 页）。\n<\/li><li>\n“容错配套”：该 try/catch 的位置包全，外部依赖有退避重试；错误信息既要能供开发排查，也要让运营看懂；高风险动作或护栏报警时接入人工复核（PDF 第 231 页）。\n<\/ul>\n<p>正例：专用策略执行智能体在主系统之前筛检输入，配合 Pydantic 校验拦截不合规内容；输出层核对引用完整性与格式。反例：仅在最终回复上加一段敏感词过滤，工具已被调用、数据已被删除之后才检查文本。<\/p>\n<h2>原理推导<\/h2>\n<p>护栏体系可按三层位置、两条配套推导。<\/p>\n<p>输入层：在请求进入智能体之前做净化与校验。检查提示注入、敏感信息、越权意图与结构合法性；不合规请求在接触主模型与工具前被拒绝、改写或转人工。这一层成本低、拦截早，能避免污染上下文与误触发工具。<\/p>\n<p>执行层：动作经编排层放行时检查权限边界、参数范围、速率限制与白名单。工具调用（c05）的最小权限原则在此落地：只给完成任务必需的工具与参数范围，危险动作可回滚或需审批；外部调用包异常处理与退避。这一层拦住的是“模型生成了合法但越权的参数”这类风险。<\/p>\n<p>输出层：结果交付前检查事实、格式、引用完整性与政策遵循；轻量模型可做二次复核。输出层不能替代执行层：若动作已不可逆，文本过滤无法收回影响。<\/p>\n<p>配套一：可观测与评估。护栏本身要可测量——构造攻击样例与误报样例，测量拦截率与误伤率；记录链路日志供审计，统计延迟、成功率、错误类型。没有度量的护栏无法判断是否有效。<\/p>\n<p>配套二：人机协作接入。高风险动作、护栏报警、低置信度样本转人工复核；审批点放在不可逆动作之前，给出将执行什么、影响范围、如何撤销。<\/p>\n<p>机制上，护栏是纵深防御：单层检查存在绕过路径，输入、执行、输出三层互相补充；策略既可以写成规则与 schema，也可以由专用智能体按政策提示执行，二者都需要在真实样例上检验。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>护栏适用：智能体接触外部系统、产生副作用、处理敏感数据或面向公众输出。自主程度越高、影响越关键，护栏层越不可省。<\/p>\n<p>边界：护栏会增加延迟与开发成本，过度拦截会误伤正常任务；需要在拦截率与误伤率之间权衡。规则覆盖不到的新型攻击依赖模型审核，但模型审核本身也可能被绕过。未经过样例测试的护栏只是心理安慰：拦截率、误伤率没有数据支撑，无法证明安全。护栏不能替代权限体系与人工流程，它是附加层而非根边界。<\/p>\n<p>条件去掉会怎样：去掉输入层，注入与脏数据直达主模型；去掉执行层，越权参数被直接放行；去掉输出层，不合规结果原样交付；去掉日志度量，事故无法复盘、护栏无法调优。<\/p>\n<h2>反例<\/h2>\n<p>末端过滤的反例：系统允许智能体删除文件，只在最后回复里过滤敏感词；删除动作已执行，文本检查无法恢复数据。正确做法是在执行层把删除列入危险动作，加审批与回滚。<\/p>\n<p>未测试护栏的反例：配置了一段政策提示作为“安全层”，但没有构造违规样例验证是否真被拦截；提示措辞宽松时，边界请求被放行，事故后才发现护栏从未生效。<\/p>\n<h2>辨析<\/h2>\n<p>与人机协作（第 4 章）的差别：护栏是自动检查层，人机协作把特定决策点交给人；护栏报警后升级人工，二者在审批点衔接。护栏不替代人的否决权。<\/p>\n<p>与工具调用（c05）的差别：工具通道负责送达动作，护栏在通道前后做拦截与权限约束。工具自身的幂等、可回滚设计是执行护栏的一部分。<\/p>\n<p>与反思（c04）的差别：反思以质量改进为目标，按 rubric 修订产出；护栏以合规与安全为目标，做拦截与放行。反思通过不代表合规，护栏通过不代表质量达标。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：工具调用的执行通道、多智能体的角色与协议、上下文注入流程。后继：护栏的评估指标（成功率、合规率、成
