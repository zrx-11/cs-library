\n<p>原始指令：“请撰写一份关于开展读书会的方案。”<\/p>\n<ul><li>\n第一轮启发：“组织职场新人读书会，需要考虑哪些促进深度连接的维度？”\n<\/li><li>\n第二轮校准：“参与者多为 95 后互联网从业者，希望缓解社交焦虑。”\n<\/li><li>\n第三轮锁定：“基于上述背景，设计六期读书会安排，每期含破冰环节与阅读书目方向。”\n<p>对照：原始指令一步到位，模型给通用活动方案；三轮后受众、目的、产物形状逐步明确。<\/p>\n<\/ul>\n<h3>算例 2：研究报告的任务分解（技巧 28 试一试，PDF 第 96–97 页）<\/h3>\n<p>总体目标：智能家居设备市场趋势研究报告。<\/p>\n<ul><li>\n主要任务：市场现状、未来趋势、竞品分析。\n<\/li><li>\n子任务：现状含规模、增速、驱动因素；趋势含政策与技术；竞品含份额与特点。\n<\/li><li>\n微任务：收集 2023–2024 规模数据；分析近五年增长率；列举三个驱动因素。\n<p>每层提示词单独下发，反馈后调整。<\/p>\n<\/ul>\n<h3>算例 3：反例——问题笼统导致失焦<\/h3>\n<p>“如何提升销量”（技巧 13，PDF 第 51 页）。推导：销量涉及品类、渠道、人群、价格，命题过大时模型扫描范围失焦；优化为“如何在现有预算下提升母婴类复购率”，对象、预算、指标缩小后，推理才有落点。<\/p>\n<h2>假设与边界<\/h2>\n<p>推导假设：模型在多轮对话中能保留历史上下文；跨会话不保留时，前期结论需要重新传入（概念 c03）。任务分解不保证结论正确，只降低结构混乱；事实层面的核验仍由概念 c07 处理。R1 自动展开思维链，用户仍可要求展示推理过程以便追问；V3 不展示内部步骤，分层提示词要写得更明确。<\/p>\n<h2>补充推演：思维链展开与上下文成本<\/h2>\n<p>R1 自动展开中间步骤，步骤文本进入当前上下文。推导成本与收益：<\/p>\n<ul><li>\n收益：中间步骤可见，用户能在步骤层面追问、纠偏；技巧 25 即依据思考过程找可改进点（PDF 第 84 页）。\n<\/li><li>\n成本：链条越长，上下文占用越多；多轮后早期细节被挤出额度，需要收拢已确认结论。\n<\/li><li>\n边界：简单任务展开链条属于冗余开销，技巧 21 要求深度思考匹配任务复杂度（PDF 第 74 页）。\n<p>判断标准：任务是否有多个可被检查的中间判断点；没有判断点的任务，链条只是拉长回答。<\/p>\n<\/ul>\n<h2>补充推演：分解粒度如何定到微任务<\/h2>\n<p>技巧 28 的层级从总体目标往下切（PDF 第 94 页）。推导粒度判断：<\/p>\n<ul><li>\n主要任务：产物的大块组成，如选题、大纲、正文。\n<\/li><li>\n子任务：每大块下的动作，如选题定主题方向，大纲列结构要点。\n<\/li><li>\n微任务：可直接下发一句提示词的最细动作，如选题定为“健康饮食的重要性”。\n<p>切到哪一层为止？标准是该层动作能用一句独立提示词完成，且产物可单独检查。再往下拆会把交互轮次堆高；停得太粗，单句提示词仍包含多个动作。<\/p>\n<\/ul>\n<h2>补充推演：反馈信号如何回流到上层<\/h2>\n<p>分解链路是 选题 → 大纲 → 正文。推导反馈回流方向：正文发现论据不足，问题可能出在选题范围太窄；大纲缺章节，问题可能出在上一层结构；选题偏差则要回到第一轮重定方向。反馈不能只改当前层措辞，要沿链路判断偏差源头。技巧 28 的三条反馈分别对准选题、大纲、内容（PDF 第 96 页），正是按层级定位偏差。<\/p>\n<h2>常见误读对照<\/h2>\n<ul><li>\n误读：任务分解等于把提示词写成长清单。分解是外部工作流程，每层一句提示词；长清单堆在单轮里会让模型同时处理多个判断点，失去分层意义。\n<\/li><li>\n误读：思维链越长回答越对。链条长只说明展开了更多步骤，步骤依据仍需核验；想得多不等于事实正确，见概念 c07。\n<\/li><li>\n误读：三轮对话必须走满三轮。第一轮提问已经覆盖受众、场景、约束时，可直接进入锁定路径；三轮是结构，不是固定轮次。\n<\/ul>\n<h2>补充算例<\/h2>\n<h3>算例 4：智能家居报告的层级拆分（技巧 28 试一试，PDF 第 96–97 页）<\/h3>\n<ul><li>\n总体目标：智能家居设备市场趋势研究报告。\n<\/li><li>\n主要任务：市场现状、未来趋势、竞品分析。\n<\/li><li>\n子任务：现状含规模、增速、驱动因素；趋势含政策与技术；竞品含份额与特点。\n<\/li><li>\n微任务：收集 2023–2024 规模数据；分析近五年增长率；列举三个驱动因素。\n<p>每层独立提示词下发，反馈后调整；某子任务数据不足时先补数据检索，不跳到正文写作。<\/p>\n<\/ul>\n<h3>算例 5：反例——路径依赖阻断升级<\/h3>\n<p>对话中反复追加“按我之前说的做”，模型不再重新评估方向（技巧 13 第三坑，PDF 第 51 页）。推导：路径依赖把上下文锁在旧方案里，新进展无法进入推理；纠偏动作是定期反问“基于最新进展，是否需要调整策略方向”。<\/p>\n<h3>算例 6：反例——命题过大导致失焦<\/h3>\n<p>“如何提升销量”覆盖品类、渠道、人群、价格全部未知（技巧 13，PDF 第 51 页）。推导演扫范围失焦的机制：命题越大，可关联因素越多，模型每个因素只能点到为止；缩小到“现有预算下母婴类复购率”后，因素集合收窄，推理才有落点。<\/p>\n<h2>补充推演：开放式提问与封闭指令的切换时机<\/h2>\n<p>三轮法前两轮偏开放，最后一轮收封闭。推导切换依据：<\/p>\n<ul><li>\n探索阶段问题未定义，开放式提问“有哪些可能维度”扩大候选，避免一上来锁死方向。\n<\/li><li>\n校准阶段信息逐步明确，提问转为定向追问“是否突出医疗级监测还是年轻潮玩属性”。\n<\/li><li>\n锁定阶段方向已定，指令必须封闭具体：受众、场景、诉求、要求逐项写明。\n<p>技巧 13 的手环案例走完这三步后，最终指令才包含 40+ 女性、家庭健康、子女远程关爱等明确要素（PDF 第 50 页）。顺序反了：第一轮就封闭，探索维度被跳过；第三轮仍开放，产物无法落地。<\/p>\n<\/ul>\n<h2>补充边界：分解不替代专业判断<\/h2>\n<p>任务分解降低结构混乱，不保证结论专业。分解后的每层产物都可能包含错误事实或偏差假设；层级越细，越容易把局部正确当成整体正确。每层检查除结构外，仍要核对依据与来源（概念 c07）。复杂法律、医疗、工程任务的分解框架可交给模型草拟，最终判断由具备资质的人负责。<\/p>\n<h2>补充对照：本书分步技巧的归位<\/h2>\n<p>技巧 13 的三轮对话法处理“问题空间如何展开”（PDF 第 48 页）；技巧 28 的任务分解处理“产物层级如何拆开”（PDF 第 93 页）；技巧 25 依据思考过程追问改进点（PDF 第 84 页）；技巧 26 用连续三句话推动任务前进（PDF 第 86 页）。前两者是结构方法，后两者是多轮推进手法；复杂长任务先定层级，再用三轮法逐层展开，反馈沿层级回流。<\/p>\n<h2>机制拆解：分步与分解如何压低一步到位的偏差<\/h2>\n<p>【机制解释】候选收缩：一步到位时，模型在第一句就要同时决定受众、角度、结构与措辞，多个未定义维度互相牵制，容易落到高频组合；分步把这些维度拆到不同轮次，每一步只收缩一个维度。 【机制解释】检查落点：分步后每一步产物都可以单独核对——受众定得对不对、角度偏不偏；错误在进入下一步之前暴露，不必等成品出来再整体推翻。 【机制解释】任务分解：复杂产物拆成层级后，每层只对上级结论负责；层级边界让局部修改不会牵动全文，也便于定位问题出在哪一层。 【经验推断】三轮法在前两轮保持开放、最后一轮收封闭，比全程封闭更能覆盖遗漏维度；这一条来自技巧 13 的实践归纳（PDF 第 48 页），轮次收益随任务复杂度递减。<\/p>\n<h2>算例 6：同一产品方案，一步到位与分步推进对照（可复核）<\/h2>\n<p>任务：为一款桌面加湿器设计推广方案。 提示词 A（一步到位）：<\/p>\n<pre><code>给桌面加湿器写一套推广方案。<\/code><\/pre>\n<p>预期输出落点：受众、卖点、渠道一次性铺开，各部分互相迁就，方案泛化；中途发现受众错了，只能整篇重写。 提示词 B（分步推进）：<\/p>\n<pre><code>第一步：先只列桌面加湿器可能的使用人群与对应痛点，不要写方案。\n第二步：基于上一步，选定一个主人群，说明为什么选它。\n第三步：再围绕这个人群写推广卖点与渠道。<\/code><\/pre>\n<p>逐段对比：<\/p>\n<ul><li>\n人群段：B 先发散多类人群再收敛，A 直接猜一个受众。\n<\/li><li>\n取舍段：B 的选择理由可见，错在人群时可只回退第二步；A 的受众藏在成品里，无法单独检查。\n<\/li><li>\n方案段：B 的卖点挂在已确认人群上，A 的卖点通用于所有小家电。\n<p>差异来源：B 把“定人群”与“写方案”分成两步，错误在第二步之前暴露；A 把所有维度压进一轮。分步增加轮次，但减少整篇返工概率。<\/p>\n<\/ul>\n<h2>常见误读补充<\/h2>\n<ul><li>\n误读：写了分步指令，输出就一定更准确。反例：分步只改善结构与可检查性，不补事实依据；步骤内的前提错误仍会被一步步带到成品里。\n<\/li><li>\n误读：思维链越长，分析越深入。反例：链条冗长可能包含重复推论与冗余铺垫；深度取决于每步是否推进到新前提，不取决于字数。\n<\/li><li>\n误读：任务拆得越细越好。反例：层级过多会增加交接成本与信息损耗；简单任务硬拆多层，反而把清晰问题复杂化。\n<\/ul>\n<h2>自检问题<\/h2>\n<ol><li>\n一步到位的回答为什么容易停在高频组合？\n<\/li><li>\n三轮对话法每一轮各解决哪个判断点？\n<\/li><li>\n任务分解的四个层级分别对应什么粒度？粒度切到哪一层为止？\n<\/li><li>\n反馈调整为什么要对准具体层，而不是整篇重写？正文偏差如何沿链路判断源头？\n<\/li><li>\n什么情况下不值得做任务分解？依据技巧 22 的什么判断？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "思维链、分步对话与任务分解"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：DeepSeek使用秘笈：从入门到精通的100个实用技巧 · p.112<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">提示词四要素：背景、需求、约束、输出格式<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">上下文、身份与记忆传输<\/a><\/span><\/div><h1>场景化提示词套路：办公、创作、营销<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章（原书第 4–6 章）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>场景化套路是把四要素骨架套到具体工作场景后形成的可复用提问模式：办公场景重结构与数据口径，创作场景重风格与情绪路径，营销场景重人群标签与转化目标。每个场景的提示词都由“受众背景 + 动作产物 + 风格或人群约束 + 格式长度”组成，差别只在约束清单。<\/p>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>跨工具使用时，用户容易把技巧记成一堆零散操作：PPT 找 Kimi、Word 找插件、小红书单独一套说法。困难在于看不出这些操作背后是同一套提示词骨架，换个工具就要重新学一遍。原书第 4 章覆盖 PPT、Word、Excel、WPS、飞书、Xmind、Draw、微信（PDF 第 112–139 页），第 5 章覆盖表达、升华、模仿、解构、选题、脚本、小红书、公众号（PDF 第 152–183 页），第 6 章覆盖画像、分群、推荐、评论、客服、黑话翻译（PDF 第 189–200 页）。抽象成套路后，新场景只要补对约束清单即可。<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n<strong>办公套路<\/strong>：产物是文档、表格、导图、流程；背景是岗位与项目阶段；约束是指标口径、模板结构；格式是分点、表格、层级。代表技巧：Word 续写与段落优化（技巧 35，PDF 第 114 页）、Excel 数据分析（技巧 36、37，PDF 第 121、125 页）、Xmind 思维导图（技巧 40，PDF 第 134 页）、Draw 流程图（技巧 41，PDF 第 137 页）。\n<\/li><li>\n<strong>创作套路<\/strong>：产物是文案、脚本、标题、段落；背景是产品与受众；约束是风格、情绪路径、敏感词；格式是标题长度、正文结构、互动话术。代表技巧：高情商表达（技巧 44，PDF 第 152 页）、主题升华（技巧 45，PDF 第 154 页）、风格模仿（技巧 46，PDF 第 156 页）、小红书黄金三角（技巧 51，PDF 第 168 页）。\n<\/li><li>\n<strong>营销套路<\/strong>：产物是画像、分群规则、推荐话术、评论归类；背景是客户数据与渠道；约束是人群标签、合规用语；格式是画像表、分群规则、话术分组。代表技巧：数据侦探与动态分群（技巧 58，PDF 第 189 页）、评论解读（技巧 60，PDF 第 195 页）、客服应答（技巧 61，PDF 第 197 页）。\n<\/ul>\n<p>正例（办公）：“从市场规模、技术瓶颈、政策支持三个维度，分析 2024 年预制菜行业趋势”（技巧 35，PDF 第 120 页）。正例（创作）：“为美白防晒霜设计首图文案，主打 24 小时防晒不脱妆，目标用户是经常户外拍摄的摄影师”（技巧 51，PDF 第 169 页）。反例：“帮我写点宣传的东西”——场景、受众、格式全缺。<\/p>\n<h2>原理推导<\/h2>\n<p>第一步，场景决定约束清单。办公产物要进工作流，口径与结构错了会被退回；创作产物要触达读者，风格与情绪路径错了没有传播；营销产物要匹配人群，标签与话术错了推送无效。 第二步，工具集成只解决上下文搬运。插件把当前文档或表格送进上下文（技巧 35，PDF 第 115–119 页），但指标口径、受众、合规边界仍要提示词交代。 第三步，创作套路沿“内容如何打动人”拆动作：语气调整改措辞，升华改立意，模仿改风格，解构改结构，选题与脚本改流程。每个动作对应一条可写进提示词的要求。 第四步，营销套路沿“如何识别并触达人群”拆环节：先拼画像，再按行为变化分群，最后按人群特征给话术；评论与客服是反向收集人群反馈的环节。 第五步，推出迁移方法：遇到新场景，先判断产物类型（办公/创作/营销），再从骨架四要素填本场景变量，最后查本场景专属约束（行业口径、平台规则、合规红线）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：任务能归入三类产物之一；有明确受众与使用场景；材料可作为上下文传入。\n<\/li><li>\n条件去掉会怎样：不交代口径 → 表格结论数字不可用；不交代受众 → 文案语气错位；不喂数据 → 营销画像无依据。\n<\/li><li>\n失败案例：技巧 51 提醒敏感词过滤，“最便宜”要改成“性价比天花板”，不提“治疗功效”（PDF 第 170 页）；技巧 58 提醒广撒网推送被噪声淹没，画像与分群是前提（PDF 第 189 页）。\n<\/li><li>\n边界：套路只解决产物生成，不替代业务判断；办公数据需核验，营销合规需前置，创作事实需核对。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>办公 vs 创作<\/strong>：办公约束偏内部口径与结构，创作约束偏外部受众与情绪；同一篇方案，对内汇报走办公套路，对外宣传走创作套路。\n<\/li><li>\n<strong>创作 vs 营销<\/strong>：创作控制“怎么说”，营销控制“对谁说、说什么”；文案在营销链路里是最后一环，前面有画像与分群。\n<\/li><li>\n<strong>场景套路 vs 少样本示例<\/strong>：套路给的是结构化要求，示例是附加风格样本；套路可迁移，示例易被照搬（概念 c04）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c02 四要素、概念 c03 上下文。后继：概念 c07 在套路之上加核验、合规与知识库；概念 c08 把套路迁移到私人场景；概念 c10 把固定流程沉淀为智能体。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[场景判断] --&gt; B[办公: 口径+结构]\nA --&gt; C[创作: 风格+情绪路径]\nA --&gt; D[营销: 人群标签+转化目标]\nB --&gt; E[骨架: 背景+需求+约束+格式]\nC --&gt; E\nD --&gt; E\nE --&gt; F[产物生成]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>技巧 35（PDF 第 114 页）<\/td><td>Word 集成<\/td><td>插件搬文档，提示词定维度与结构<\/td><\/tr><tr><td>技巧 37（PDF 第 125 页）<\/td><td>Excel 分析<\/td><td>五招数据超能力：清洗、统计、口径、结论、可视化<\/td><\/tr><tr><td>技巧 46（PDF 第 156 页）<\/td><td>风格模仿<\/td><td>给风格线索：用词、句式、人称<\/td><\/tr><tr><td>技巧 51（PDF 第 168 页）<\/td><td>小红书黄金三角<\/td><td>首图钩子、标题关键词、正文私聊路径<\/td><\/tr><tr><td>技巧 58（PDF 第 189 页）<\/td><td>精准营销<\/td><td>画像、动态分群、个性推荐<\/td><\/tr><tr><td>技巧 62（PDF 第 199 页）<\/td><td>黑话翻译<\/td><td>把甲方语言翻成可执行指令<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>相关概念<\/h2>\n<p>提示词四要素、上下文与身份、核验合规与知识库、场景迁移<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（场景化提示词套路：办公、创作、营销）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：三类场景套路的结构分解与对照算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>往回追前提：<\/p>\n<ol><li>\n四要素骨架（背景、需求、约束、格式）对所有任务通用；场景差异体现在每要素填什么变量。\n<\/li><li>\n不同产物的使用方式不同：办公产物进入内部流程，创作产物面向公众注意力，营销产物匹配特定人群；使用方式决定约束清单。\n<\/li><li>\n工具插件只完成材料搬运，不替用户定义任务；任务定义仍由提示词承担。\n<\/li><li>\n场景套路是骨架的垂直实例化，不是另一套独立方法。\n<\/ol>\n<p>依赖链方向：通用骨架 → 产物使用方式 → 场景约束清单 → 具体提示词。新场景出现时，先归产物类型，再填变量；跳过归类型直接背技巧，会把工具操作误当成方法。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：推导办公场景约束从哪来<\/h3>\n<p>办公产物要被同事、上级或流程接收，错误代价是返工。技巧 35 的 Word 流程：插件加载后输入主题，Alt+Q 召唤生成；段落优化把口语句升级为书面表述（PDF 第 117–119 页）。推导：办公提示词必须交代三件事——材料范围（当前文档/附件）、分析维度（市场规模、瓶颈、政策）、产物结构（分点论述）。技巧 37 的 Excel 五招从表格小白到分析大师（PDF 第 125 页），数据类任务还要补指标口径与时间范围，否则结论数字无法对账。<\/p>\n<h3>第二步：推导创作场景动作链<\/h3>\n<p>技巧 44 高情商表达：给定原句、双方关系、语气边界，只换措辞不改意思（PDF 第 152 页）。技巧 45 升华主题：在原文事实之上提炼立意，不凭空拔高（PDF 第 154 页）。技巧 46 模仿风格：给用词、句式、人称线索（PDF 第 156 页）。技巧 47 公文解构：输入原文，输出要点列表与底层逻辑（PDF 第 159 页）。推导：创作动作按“措辞 → 立意 → 风格 → 结构 → 选题脚本”分层；每层要求不同，提示词要点名当前处理哪一层。<\/p>\n<h3>第三步：推导小红书黄金三角的提示词结构<\/h3>\n<p>技巧 51 把笔记拆成首图、标题、正文（PDF 第 168–170 页）：<\/p>\n<ul><li>\n首图：痛点扎心 + 方案发光，文案不超过七个字；输入给核心卖点与用户画像。\n<\/li><li>\n标题：关键词 + 反常识 + 吊胃口；关键词来自行业黑话与产品词。\n<\/li><li>\n正文：先卖惨、再逆袭、最后甩王炸；用对比实验与互动话术收尾。\n<p>推导：三角对应三个独立产物部件，每个部件有自己的约束；提示词一次只生成一个部件，避免把标题、正文要求混在一句里。敏感词约束贯穿三角：不提治疗功效、不用绝对化用语。<\/p>\n<\/ul>\n<h3>第四步：推导营销场景的环节链<\/h3>\n<p>技巧 58 三步（PDF 第 189–191 页）：<\/p>\n<ul><li>\n数据侦探：把 CRM、订单、到店频次等碎片拼成画像标签。提示词给数据源附件与筛选规则。\n<\/li><li>\n动态分群：按行为变化调整人群归属，如孕妈搜索修复内容后转入新手妈妈群。提示词给分群触发条件与迁移规则。\n<\/li><li>\n个性推荐：按价格敏感、品质、社交三类特征包装话术。提示词给人群类型与沟通角度。\n<p>推导：营销提示词的质量取决于数据与规则喂得是否具体；只给“做个营销方案”，模型在画像层就没有材料。技巧 60 把评论作为反向数据：归类情绪、提炼投诉点（PDF 第 195 页）；技巧 61 把常见问题与应答边界固定为客服口径（PDF 第 197 页）。<\/p>\n<\/ul>\n<h3>第五步：推导跨场景迁移步骤<\/h3>\n<p>遇到新任务：先判产物类型；再按骨架填背景（受众/岗位）、需求（动作/产物）、约束（口径/风格/标签）、格式（结构/长度）；最后查场景专属规则。工具更换不改变这套步骤，只改变材料传入方式。<\/p>\n<h2>算例<\/h2>\n<h3>算例 1：办公分析提示词对照（技巧 35，PDF 第 120 页）<\/h3>\n<p>弱版本：“分析预制菜行业。”缺维度、缺年份、缺结构。 强版本：“从市场规模、技术瓶颈、政策支持三个维度，分析 2024 年预制菜行业发展趋势。”背景：2024 年预制菜；需求：三维度分析；约束：三个指定维度；格式：分点论述。<\/p>\n<h3>算例 2：小红书标题生成（技巧 51，PDF 第 169 页）<\/h3>\n<p>输入：“主题是露营装备推荐，关键词包含轻量化、多功能、颜值。”模型输出“轻过手机的黑科技帐篷，竟能变身星空影院？” 推导：关键词进标题前半段，反常识与疑问句承担吊胃口；格式上标题用数字反差与表情分隔，不超过两个表情符号。<\/p>\n<h3>算例 3：营销画像规则（技巧 58，PDF 第 190 页）<\/h3>\n<p>输入：“创建健身咖啡族画像，筛选近 30 天购买过美式咖啡，且运动类 App 每周使用时长超过 5 小时的用户。”附件：咖啡购买记录、运动 App 行为数据。 推导：规则含时间窗、行为条件、数据源；模型识别 4286 名用户后按下单时段与搭配偏好给推送策略。没有数据附件时，画像规则只能停在假设。<\/p>\n<h3>算例 4：反例——广撒网推送<\/h3>\n<p>连锁咖啡店给所有人推同款买一送一冰美式；健身爱好者举铁时收到，乳糖不耐受顾客看到拿铁广告摇头（技巧 58，PDF 第 189 页）。失败环节：画像与分群缺失，人群标签这一约束未进入提示词，话术对所有人同一版本。<\/p>\n<h2>假设与边界<\/h2>\n<p>推导假设：上传的数据与文档可被模型读取并按规则筛选；数据本身失真会传导到画像结论。场景套路不替代专业判断：办公数字需核验（概念 c07），营销话术需合规审查，创作内容需核对事实。平台规则会更新，敏感词清单要随平台要求调整。<\/p>\n<h2>补充推演：办公产物的口径一致性推演<\/h2>\n<p>办公材料进入流程后会被对账、引用、汇总。推导口径错误的传导：指标定义不一致（如“销售额”含不含退款），表格统计、结论建议、汇报引用沿同一错误口径走，偏差逐级放大。因此办公提示词必须先锁口径：指标名称、统计时间、对比范围、数据源附件。技巧 37 的数据超能力链条从清洗开始（PDF 第 125 页），清洗规则就是口径规则；口径未交代时，模型按常见定义计算，与公司实际口径可能不同。<\/p>\n<h2>补充推演：创作情绪路径的分层控制<\/h2>\n<p>创作产物打动人靠情绪路径。技巧 51 正文三步走：先卖惨、再逆袭、最后甩王炸（PDF 第 170 页）。推导：情绪路径是结构安排，不是形容词堆砌；提示词要交代每一段承担什么情绪动作。技巧 44 高情商表达只换措辞不改意思（PDF 第 152 页），技巧 45 升华立意不凭空拔高（PDF 第 154 页），两层动作分开控制：措辞层改语气，立意层改提炼角度；混在一句“写得感人一点”里，模型只能在形容词层发力。<\/p>\n<h2>补充推演：营销链路的数据依赖顺序<\/h2>\n<p>技巧 58 三步有严格先后（PDF 第 189–191 页）：<\/p>\n<ol><li>\n画像依赖原始行为数据；数据未喂入，标签无法生成。\n<\/li><li>\n分群依赖画像标签与行为变化规则；标签缺失，分群只能按人口统计粗分。\n<\/li><li>\n话术依赖分群结果；人群不明，话术只能通用版本。\n<p>推导：链路上游缺材料，下游话术再打磨也不精准。技巧 60 评论归类是反向数据流：用户反馈文本回到画像与话术优化环节（PDF 第 195 页）；技巧 61 客服边界把常见问题与禁忌固定下来（PDF 第 197 页），避免应答现场发挥。<\/p>\n<\/ol>\n<h2>常见误读对照<\/h2>\n<ul><li>\n误读：办公与创作的差别只是文本风格。实质差别在验收标准：办公看口径与结构是否可进流程，创作看受众是否被打动；同一篇对外宣传稿，对内汇报版本走办公套路，对外发布版本走创作套路。\n<\/li><li>\n误读：营销效果主要取决于文案水平。技巧 58 案例显示推送精准度来自画像与分群（PDF 第 189 页）；文案是链路最后一环，上游数据缺失时文案无法补救。\n<\/li><li>\n误读：换软件就要换一套提示词。工具只改变材料传入方式，四要素骨架不变；先核对插件是否把文档送进上下文，再补口径与格式要求。\n<\/ul>\n<h2>补充算例<\/h2>\n<h3>算例 6：Excel 分析提示词要素<\/h3>\n<p>背景：近一年门店销售表（附件）；需求：找出销售额下滑的三个品类；约束：剔除开业不足三个月的新店；格式：表格列品类、下滑幅度、可能原因，数据注明统计月份。对照技巧 36、37（PDF 第 121、125 页）：缺约束时新店开业波动会被误判为品类下滑。<\/p>\n<h3>算例 7：标题与正文分部件生成<\/h3>\n<p>先单独生成首图文案（痛点 + 方案，七字内）；再单独生成标题（关键词 + 反常识 + 疑问句）；最后生成正文（卖惨—逆袭—王炸）。推导：三部件约束不同，混在一条提示词里互相挤占；分部件生成后再拼接，避免标题套路进正文、正文长度压过标题。<\/p>\n<h3>算例 8：反例——无数据画像<\/h3>\n<p>“给年轻女性推荐产品”：年龄性别是唯一标签，收入、场景、偏好全部缺失。推导：画像只到人口统计层，分群与个性推荐无依据；技巧 58 的健身咖啡族规则需要行为条件与数据源附件（PDF 第 190 页）。<\/p>\n<h2>补充推演：跨工具集成时的上下文边界<\/h2>\n<p>办公插件把文档送进上下文，但插件能力有边界。推导常见缺口：<\/p>\n<ul><li>\n插件只传当前打开的文档，历史版本、关联表格、邮件往来不在其中，需要作为附件补传。\n<\/li><li>\n插件提供的续写、段落优化只处理文本表层，数据口径与业务前提仍由提示词交代。\n<\/li><li>\n重要文档建议保留修改痕迹，便于回溯 AI 改了哪些句子（技巧 35，PDF 第 120 页）。\n<p>工具清单（PPT、Word、Excel、WPS、飞书、Xmind、Draw、微信）换的是材料入口与产物出口，任务定义与核验环节不随工具改变。<\/p>\n<\/ul>\n<h2>补充推演：创作场景的事实底线<\/h2>\n<p>创作套路控制表达方式，但表达内容仍受事实约束。推导分层：<\/p>\n<ul><li>\n风格层：语气、句式、情绪路径，可按目标受众调整。\n<\/li><li>\n事实层：产品参数、用户案例、数据结果，不能为煽情改写。\n<\/li><li>\n合规层：功效宣称、对比表述、敏感词，按平台与广告规则排除。\n<p>技巧 48 的版权合规扫描是创作后的独立环节（PDF 第 163 页）；技巧 51 的敏感词提醒要求把“治疗功效”类表述换成体验描述（PDF 第 170 页）。三层混在一句“写得吸引人”里时，模型优先处理风格层，事实与合规容易漏掉。<\/p>\n<\/ul>\n<h2>补充推演：营销话术的人群匹配回溯<\/h2>\n<p>话术产出后要回到人群假设检查。推导回溯链：话术引用的痛点是否对应画像标签；优惠形式是否匹配价格敏感/品质/社交类型；推送时段是否对照行为数据。技巧 58 的效果追踪环节用点击热力图与转化率数据回看哪些文案被阅读、哪个时段转化最高（PDF 第 192 页）。话术不是一次性产物，反馈数据回流后调整画像与分群规则，链路闭环。<\/p>\n<h2>补充对照：本书场景技巧的归位<\/h2>\n<p>办公侧：技巧 34 PPT、技巧 35 Word、技巧 36/37 Excel、技巧 40 Xmind、技巧 41 Draw（PDF 第 112–137 页）；创作侧：技巧 44–47 表达与解构、技巧 51 小红书、技巧 52 分镜脚本（PDF 第 152–171 页）；营销侧：技巧 58 画像分群、技巧 60 评论解读、技巧 61 客服、技巧 62 黑话翻译（PDF 第 189–199 页）。回查时先定位产物属于哪一类，再套用对应约束清单。<\/p>\n<h2>机制拆解：场景清单如何把通用模板压成可用产物<\/h2>\n<p>【机制解释】约束替换：办公、创作、营销三类场景的差异集中在约束清单上——办公围着协作与口径，创作围着受众与情绪路径，营销围着画像与转化；换场景时替换清单，动作链保持不变。 【机制解释】候选过滤：场景约束把不属于本场景的表达先排除（办公稿不做情绪煽动，营销稿不堆内部术语），生成时候选空间沿场景口径收窄。 【机制解释】工具边界：插件只负责把文档送进上下文、把产物导出为对应格式，业务前提与数据口径仍要在提示词里交代；工具不替用户理解项目。 【经验推断】三类场景各有一套高频提示骨架，套用骨架比从零写提示词更省轮次；这一条来自本书第 4–6 章技巧归纳（PDF 第 112–199 页），骨架只起起点作用，具体项目仍需补背景。<\/p>\n<h2>算例 6：同一产品信息，办公邮件与营销话术两种提示词对照（可复核）<\/h2>\n<p>产品事实：一款 12 寸便携屏，重 780 克，接口支持全功能 Type-C。 提示词 A（办公场景，内部进度邮件）：<\/p>\n<pre><code>把以上参数整理成给团队的进度邮件：先说明当前规格已定，再列待确认项，语气平实，不加宣传用语。<\/code><\/pre>\n<p>预期输出落点：条目化进度汇报，参数作为事实列出，无卖点渲染。 提示词 B（营销场景，社交平台种草文案）：<\/p>\n<pre><code>把以上参数改写成面向通勤办公族的种草文案：从“背包重量”和“一线连笔记本”切入，先讲使用场景，再点参数，结尾给一句行动引导。<\/code><\/pre>\n<p>逐段对比：<\/p>\n<ul><li>\n开头：A 交代进度状态，B 先描述通勤场景。\n<\/li><li>\n参数处理：A 平铺参数供核对，B 把重量与接口翻译成使用感受。\n<\/li><li>\n语气：A 克制中立，B 带引导性；同一参数在两类产物中位置与说法不同。\n<p>差异来源：约束清单不同决定了候选表达的方向；产品事实不变，变的是场景口径。复核时先确认产物属于哪一类，再检查口径是否跑偏。<\/p>\n<\/ul>\n<h2>常见误读补充<\/h2>\n<ul><li>\n误读：一套场景模板可以跨行业直接套。反例：行业术语、法规口径与受众心理不同；模板只提供结构，行业约束仍要逐条补进清单。\n<\/li><li>\n误读：套了场景套路就不用核验。反例：套路改善表达与结构，不保证事实与合规；营销话术里的功效宣称、对比表述仍需按概念 c07 复核。\n<\/li><li>\n误读：接上办公插件，业务前提就自动进了上下文。反例：插件只传当前打开的文档，历史版本、关联表格与业务背景不在其中；缺的前提要作为附件或提示词补传。\n<\/ul>\n<h2>自检问题<\/h2>\n<ol><li>\n三类场景的约束清单分别围绕什么展开？\n<\/li><li>\n办公提示词为什么必须补指标口径与时间范围？口径错误如何沿链路传导？\n<\/li><li>\n小红书三角各对应什么产物部件？提示词为什么要分部件生成？\n<\/li><li>\n营销三步链中，哪一步缺数据会让后续话术失去依据？\n<\/li><li>\n工具插件在场景套路中负责哪一步？任务定义由谁承担？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "场景化提示词套路：办公、创作、营销"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：DeepSeek使用秘笈：从入门到精通的100个实用技巧 · p.141<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">上下文、身份与记忆传输<\/a><\/span><\/div><h1>核验、合规与定制知识库（RAG 雏形）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书第 4–6 章，方法依据第 3 章）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>核验是在接收回答前区分已验证事实、行业共识与合理推测，并要求标注来源与计算逻辑；合规是把法律、广告、伦理约束前置进提示词；定制知识库是把企业内部文档投喂给系统，检索相关片段后再让模型作答，使回答依据可追溯。三者分别堵住“编造事实”“踩红线”“内部资料不在模型记忆里”三类缺口。<\/p>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>模型续写通顺文本时，会把推测、套话和合理想象包装成权威表述；不核验就照单全收，可能把错误数字带进正式材料。技巧 30 记录医疗市场部案例：模型宣称“国际医学会推荐每日摄入 2000mg 维生素 C”，真实指南建议量约 100mg（PDF 第 100 页）。同时，敏感领域有明确合规边界，提示词不前置约束时，模型会在常见话术库里自由组合（技巧 29，PDF 第 98 页）。第三，公司制度、合同、纪要不在模型训练记忆中，每次口述上下文容易漏传版本（技巧 43，PDF 第 142 页）。<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n<strong>核验三招<\/strong>（技巧 30，PDF 第 100–101 页）：划定能力禁区，专业领域标注“需执业医师确认”；要求说明来源，按已验证事实、行业共识、合理推测分类；要求数据说话，统计数据注明来源，估算提交计算逻辑。\n<\/li><li>\n<strong>合规前置<\/strong>（技巧 29，PDF 第 99 页）：在提示词开头写明适用法规与禁止项，如“方案需符合广告法，不得包含虚假宣传”；重要决策先让模型分析可能的伦理争议与法律问题。\n<\/li><li>\n<strong>定制知识库<\/strong>（技巧 43，PDF 第 142–149 页）：把 PDF、Word、TXT 投喂进系统，文档被分解成知识颗粒；按部门或项目建库，定期更新、剔除过期资料；提问用“场景 + 具体需求 + 格式要求”，回答标注出处文档与页码；敏感信息分级、加水印、留溯源记录。\n<\/li><li>\n<strong>RAG 雏形机制<\/strong>（自拟机制解释）：文档切块 → 转成可检索的数字表示 → 提问时检索相似片段 → 片段进入上下文 → 模型基于片段作答。本书技巧 43 描述了投喂、提问与权限环节；嵌入模型选型在第 11 章技巧 100 展开（PDF 第 310 页）。\n<\/ul>\n<p>正例：“所有统计数据请注明来源，如果是估算，请提交计算逻辑”（技巧 30，PDF 第 101 页）；“根据 2023 年 Q4 营销复盘报告，找出华北区渠道拓展的三个关键动作”（技巧 43，PDF 第 148 页）。反例：直接采纳模型给的维生素 C 剂量；先生成保健品话术再事后筛违规词。<\/p>\n<h2>原理推导<\/h2>\n<p>第一步，编造内容的来源是训练分布中的高频说法。模型为保证文本通顺，会在缺事实时填入听起来合理的表述；语气不区分事实与推测，读者难以凭语感分辨。 第二步，核验要求把内容分层。技巧 30 的分类指令让模型标注“已验证事实 / 行业共识 / 合理推测”（PDF 第 100 页）；分层后，推测部分需要额外证据才能进入正式材料。来源与计算逻辑要求把可追溯路径摆出来：数据来自普查还是问卷、样本覆盖哪些城市、什么时间调查。 第三步，合规约束在生成前删除违规分支。前置法规与禁止项，模型在候选空间里先排除不合规话术；事后筛选等于先生成再丢弃，违规内容可能已经流出（技巧 29，PDF 第 99 页）。 第四步，知识库解决“内部资料不在记忆中”。模型训练资料不含你公司的合同与纪要；投喂后，检索片段作为上下文进入本轮回答，结论可以回指出处文档。技巧 43 的溯源功能让每个回答标注出处文档及页码（PDF 第 149 页）。 第五步，推出三层防线：知识库保证依据来自内部资料，合规前置保证不踩红线，核验分层保证不把推测当事实。三层各管一段，不能互相替代。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：材料可数字化上传；结论需要追溯来源；领域有明确法规或平台规则；内部文档需要跨会话复用。\n<\/li><li>\n条件去掉会怎样：不核验 → 编造数字混入材料；不合规前置 → 违规话术进入候选；不建知识库 → 每次重新口述、版本易过期。\n<\/li><li>\n失败案例：技巧 30 的维生素 C 剂量错误（PDF 第 100 页）；技巧 29 中保健品话术触发安全警告、八卦模板导致账号临时冻结（PDF 第 98 页）；技巧 43 中扫描件不可识别、关键词检索失效（PDF 第 150 页）。\n<\/li><li>\n边界：知识库检索到的旧文档本身可能过期，需要定期更新；核验不能替代专业资质，医疗法律金融结论仍需执业人员确认。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>核验 vs 合规<\/strong>：核验回答“这条内容可不可信”，合规回答“这条内容允不允许出现”；一个对事实负责，一个对规则负责。\n<\/li><li>\n<strong>知识库 vs 附件<\/strong>：附件是单次上传，知识库是跨会话沉淀并支持检索；资料量大、复用频次高时用知识库。\n<\/li><li>\n<strong>RAG 雏形 vs 模型记忆<\/strong>：模型记忆来自训练，不可更改；知识库内容随文档更新而替换；回答依据来自检索片段，不代表模型“学会了”这些资料。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c03 上下文、概念 c02 四要素。后继：概念 c09 本地部署处理知识库与敏感数据的存放位置；概念 c10 把知识库绑定进智能体配置。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[内部文档] --&gt; B[投喂知识库: 切块+数字表示]\nC[提问] --&gt; D[检索相似片段]\nB --&gt; D\nD --&gt; E[片段进入上下文]\nE --&gt; F[模型作答]\nF --&gt; G[合规前置: 排除违规分支]\nF --&gt; H[核验分层: 事实/共识/推测+来源]\nG --&gt; I[可追溯材料]\nH --&gt; I<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>技巧 24（PDF 第 81 页）<\/td><td>回答有依据<\/td><td>给法规、学术、行业标准作为基准<\/td><\/tr><tr><td>技巧 29（PDF 第 98 页）<\/td><td>信息合规<\/td><td>理解边界、约束前置、预判决策影响<\/td><\/tr><tr><td>技巧 30（PDF 第 100 页）<\/td><td>三招避坑<\/td><td>划禁区、说明来源、用数据说话<\/td><\/tr><tr><td>技巧 43（PDF 第 141 页）<\/td><td>定制知识库<\/td><td>文档投喂、人话提问、权限分级<\/td><\/tr><tr><td>技巧 48（PDF 第 163 页）<\/td><td>版权合规扫描<\/td><td>文字合规检查作为创作后环节<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>相关概念<\/h2>\n<p>上下文与身份、场景化套路、本地部署、智能体构造要素<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（核验、合规与定制知识库（RAG 雏形））<\/summary><div class=\"depth-body\"><h1>c07 深度推导：编造来源、合规分支与检索回路<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>往回追前提：<\/p>\n<ol><li>\n模型生成文本以通顺性为直接目标，不自动判断每条陈述是否有证据；缺证据时填入高频合理表述。\n<\/li><li>\n回答的可信度取决于依据来源：已验证事实、行业共识、合理推测的证据强度不同。\n<\/li><li>\n合规规则是外部约束，模型不掌握你所在行业的具体法条与平台规则，需要在提示词或知识库中显式给出。\n<\/li><li>\n内部资料不在训练记忆中；要让回答引用内部资料，必须先把资料变成可检索的上下文片段。\n<\/ol>\n<p>依赖链方向：通顺生成机制 → 事实缺口被推测填充 → 核验分层与来源要求 → 合规前置删分支 → 知识库补内部依据。三层防线分别对应事实、规则、资料缺口；缺哪一层，对应风险就从哪一层进来。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：推导编造内容如何进入正式材料<\/h3>\n<p>技巧 30 案例：维生素 C 建议量被写成每日 2000mg，真实指南约 100mg（PDF 第 100 页）。推导链条：模型没有该指南条文在上下文中 → 从训练分布里取一个听起来合理的剂量数字 → 用权威语气写出 → 读者从语气判断可信度，发现不了数字失真。缺口不在表达能力，而在依据未被传入与标注。<\/p>\n<h3>第二步：推导核验三招各自截住什么<\/h3>\n<p>技巧 30 三招（PDF 第 100–101 页）：<\/p>\n<ul><li>\n能力禁区：“本次回答仅限于整理公开资料，涉及专业医学建议请标注‘需执业医师确认’。”推导：先限定任务范围，模型不越界给专业结论。\n<\/li><li>\n来源分层：“按已验证事实、行业共识、合理推测分类标注。”推导：三类陈述的证据强度被显式区分；推测部分不能直接当事实引用。\n<\/li><li>\n数据说话：“统计数据注明来源，估算提交计算逻辑。”推导：每个数字可被回溯到样本范围、调查时间与计算方式；经不起追问的数据在这一步暴露。\n<p>三招叠加：范围先收窄，分层再标注，数据最后追溯。<\/p>\n<\/ul>\n<h3>第三步：推导合规约束为什么要前置<\/h3>\n<p>技巧 29 记录两类翻车：中老年保健品话术触发安全警告；明星八卦爆料模板导致账号功能冻结（PDF 第 98 页）。推导：提示词不写合规边界时，模型从常见营销话术库里组合，广告法、未成年人保护、伦理红线分支没有被预先删除；先生成再筛，违规文本已经离开对话框。前置写法：“方案需符合广告法，不得包含虚假宣传”“儿童零食营销策略需通过伦理审查”（PDF 第 99 页）。合规约束在候选空间里先删分支，与概念 c02 的约束要素是同一机制。<\/p>\n<h3>第四步：推导知识库检索回路（RAG 雏形）<\/h3>\n<p>自拟机制解释，分四步：<\/p>\n<ol><li>\n文档切块：整份合同或纪要按段落切成知识颗粒，技巧 43 类比为“把整头牛分解成牛排、牛腩、牛尾”（PDF 第 143 页）。\n<\/li><li>\n数字表示：每块文本转成向量（嵌入模型在技巧 100 选 BAAI/bge-m3，PDF 第 310 页），供相似度比较。\n<\/li><li>\n检索：提问时找出与问题最相似的若干片段，进入本轮上下文。\n<\/li><li>\n作答与溯源：模型基于片段作答，回答标注出处文档与页码（技巧 43，PDF 第 149 页）。\n<p>推导：检索回路把“模型记忆里有没有”换成“资料库里有没有”；资料更新后重新切块入库，回答依据随之更新。<\/p>\n<\/ol>\n<h3>第五步：推导权限与更新要求<\/h3>\n<p>技巧 43 的权限三件套：角色分级（CEO 看并购预案，实习生只看考勤制度）、水印防护、溯源功能（PDF 第 149 页）。更新要求：按部门建库，每月喂最新报告，剔除旧版制度（PDF 第 147、150 页）。推导：知识库不是投喂一次就结束；权限控制避免敏感资料越权可见，更新机制避免过期资料被当成现行依据。<\/p>\n<h2>算例<\/h2>\n<h3>算例 1：投资理财文章的核验指令（技巧 30 试一试，PDF 第 101 页）<\/h3>\n<p>任务：写股票投资建议文章。 提示词要素：划定禁区（不构成投资建议）；分层标注（事实/共识/推测）；数据注来源与样本；预测部分区分现行政策延伸与市场传闻。 推导：四步把“看起来专业的建议”拆成可核查材料；用户只对已验证事实部分做决策引用。<\/p>\n<h3>算例 2：知识库对比问答（技巧 43，PDF 第 148 页）<\/h3>\n<p>提问：“你是从业十年的法务专家，请用表格对比 2021 版和 2023 版《数据安全法》中关于个人信息保护的差异点，并标注法律条文编号。” 推导：场景（法务对比）、具体需求（两版差异）、格式（表格 + 条文编号）齐全；资料来自已入库法规文本，回答可回指出处。对照错误示范“找市场策略”——无场景、无需求、无格式，检索与生成都失焦。<\/p>\n<h3>算例 3：反例——过期知识库<\/h3>\n<p>假设知识库里仍存 2020 年旧版制度，提问按现行制度找流程。推导：检索命中旧文档，模型把旧条款当现行依据输出；技巧 43 要求剔除过期食品（PDF 第 147 页）。修正：定期更新与版本标注，检索结果先核对文档日期。<\/p>\n<h2>假设与边界<\/h2>\n<p>推导假设：上传文档文字清晰可识别；扫描件需先转文字版，否则“知识消化不良”（技巧 43，PDF 第 150、313 页）。知识库只提升内部资料可追溯性，不保证模型推理无误；检索片段之间矛盾时，仍需人工判断版本与效力。合规清单随法规与平台规则更新，模型不自动掌握最新条文。<\/p>\n<h2>补充推演：事实、共识、推测的证据强度分层<\/h2>\n<p>技巧 30 要求把回答按三类标注（PDF 第 100 页）。推导三类的证据差异：<\/p>\n<ul><li>\n已验证事实：可回到公开资料、法规条文、内部记录核对，样本范围与时间明确。\n<\/li><li>\n行业共识：多份资料重复出现但无单一权威出处，属通行看法。\n<\/li><li>\n合理推测：模型基于趋势外推，没有直接证据，随假设变化。\n<p>证据强度依次递减；进入正式材料时，只有第一类可直接引用，第二类需注明来源范围，第三类只能作为待验证假设。核验动作就是把混在一段通顺文本里的三类内容拆开，而不是整体接受或整体否定。<\/p>\n<\/ul>\n<h2>补充推演：检索片段与模型生成的拼接位置<\/h2>\n<p>RAG 雏形回路中，检索片段进入上下文后，模型基于片段组织回答。推导拼接点的风险：<\/p>\n<ul><li>\n片段过期：检索到旧制度，模型按旧条文作答。\n<\/li><li>\n片段矛盾：多份文档版本冲突，模型可能拼接出混合表述。\n<\/li><li>\n片段不相关：检索关键词偏差，片段与问题表面相近但实质不符。\n<p>因此回答标注出处文档与页码（技巧 43，PDF 第 149 页）是必要环节：有出处才能核对版本与相关性；无出处的“引用”无法回溯，按推测处理。<\/p>\n<\/ul>\n<h2>补充推演：合规约束的可执行性要求<\/h2>\n<p>合规提示词必须写成可核对规则，不能是口号。推导：<\/p>\n<ul><li>\n可执行：“符合广告法，不使用绝对化用语，不承诺治疗功效”——模型可在生成时排除对应分支。\n<\/li><li>\n不可执行：“注意合规”——没有具体禁止项，模型不知道删哪些分支。\n<p>技巧 29 的正向写法：限定在医学共识范围内建议；依据证监会规定评估；通过伦理审查（PDF 第 99 页）。规则越具体，候选空间删除越精确；规则空泛，合规分支仍留在候选内。<\/p>\n<\/ul>\n<h2>常见误读对照<\/h2>\n<ul><li>\n误读：开了知识库就不需要核验。知识库保证依据来自内部资料，不保证资料现行、正确；旧文档与错误文档同样会被检索到，版本核对仍是人工环节。\n<\/li><li>\n误读：合规是法务事后的事。技巧 29 的前置做法在生成前删分支；事后筛稿等于先产生违规文本再丢弃，流出风险已经存在。\n<\/li><li>\n误读：模型标注“已验证事实”就可以直接引用。标注是模型自我分类，仍需回到原始来源抽查；模型也可能把推测误标为事实。\n<\/ul>\n<h2>补充算例<\/h2>\n<h3>算例 9：数据追问链<\/h3>\n<p>模型输出“Z 世代购房意愿下降 30%”。核验追问：数据来自普查还是街边问卷？样本覆盖几个城市？调查时间是否包含促销节点？估算部分提交计算逻辑（技巧 30，PDF 第 101 页）。推导：三个问题分别核对来源类型、样本范围、时间偏差；答不上来的数据按推测处理，不进入报告。<\/p>\n<h3>算例 10：知识库提问对照<\/h3>\n<p>错误：“找市场策略”——无场景、无对象、无格式，检索与作答都失焦（技巧 43，PDF 第 148 页）。 正确：“根据 2023 年 Q4 营销复盘报告，找出华北区渠道拓展的三个关键动作。”场景、时间范围、对象、数量明确，检索片段可对准章节，输出可回指出处。<\/p>\n<h3>算例 11：反例——扫描件入库<\/h3>\n<p>扫描版合同未转文字就投喂，模型读不到文字层（技巧 43，PDF 第 150 页；技巧 100 同类问题，PDF 第 313 页）。推导：切块后无可识别文本，检索无匹配片段；回答退回到通用假设，却披着“基于知识库”的外衣，比无知识库更难发现问题。<\/p>\n<h2>补充推演：知识库分库与权限的设计理由<\/h2>\n<p>技巧 43 建议按部门或项目建库：财务部喂报表，法务部喂合同（PDF 第 146 页）。推导分库理由：<\/p>\n<ul><li>\n检索范围缩小后，命中片段与问题更相关；混库时人事制度可能被财务问题检索到。\n<\/li><li>\n权限分级与库对应：不同角色可见不同库，敏感资料不进入公共检索范围。\n<\/li><li>\n维护责任到部门：哪份资料过期由对应部门更新，避免全库无人维护。\n<p>权限三件套（角色分级、水印、溯源）在分库基础上生效（PDF 第 149 页）；不分库只设角色，检索范围仍混在一起，越权风险靠事后拦截。<\/p>\n<\/ul>\n<h2>补充推演：检索质量对回答质量的决定作用<\/h2>\n<p>RAG 回路中，模型只能基于检索到的片段作答。推导检索失败的两种表现：<\/p>\n<ul><li>\n未召回相关文档：上下文缺依据，回答退回通用推测，却可能被误认为来自知识库。\n<\/li><li>\n召回不相关文档：模型按错误片段组织回答，内容看起来有条理但依据错位。\n<p>技巧 100 的三类自救正对应检索问题：识别失败查文档格式，回答错乱用精确关键词缩小检索，内容缺失改用站点地图抓取（PDF 第 313 页）。提升检索质量先查文档可识别性与提问关键词，再调整切块与分类，不能只靠改模型提示词。<\/p>\n<\/ul>\n<h2>补充推演：合规清单的来源更新<\/h2>\n<p>合规约束不是一次写死。推导更新链条：法规修订、平台规则调整、行业新规出现后，提示词里的禁止项与知识库引用条文都要同步；旧约束留在提示词里会漏掉新红线，旧条文留在知识库里会被当成现行依据。技巧 24 提醒及时更新知识库，引用过期标准如同刻舟求剑（PDF 第 83 页）。合规清单应由对应职能定期核对，模型不自动掌握最新法条。<\/p>\n<h2>边界补充：核验不能替代专业资质<\/h2>\n<p>三层防线挡住事实错误、违规分支与内部依据缺失，但不把普通用户变成执业人员。医疗诊断、法律意见、投资决策仍需执业人员确认；技巧 30 的能力禁区标注就是把这一边界写进提示词（PDF 第 100 页）。模型在专业场景定位为资料整理与初步分析工具，最终结论责任在人。<\/p>\n<h2>补充对照：本书核验技巧的归位<\/h2>\n<p>技巧 24 给法规、学术、行业标准作为回答基准（PDF 第 81 页）；技巧 29 处理合规边界与决策预判（PDF 第 98 页）；技巧 30 是核验三招（PDF 第 100 页）；技巧 43 是知识库投喂与溯源（PDF 第 141 页）；技巧 48 做文字合规扫描（PDF 第 163 页）。基准输入属于约束层，核验三招属于输出层，知识库属于依据层，三层配合使用。<\/p>\n<h2>机制拆解：核验与知识库各自卡住输出的哪一环<\/h2>\n<p>【机制解释】依据注入：知识库把与问题相关的文档片段检索进上下文，模型只能基于这些片段组织回答；片段未命中时，上下文缺依据，回答退回参数记忆里的通用内容。 【机制解释】候选排除：合规约束在生成前排除违规表述与风险分支；核验环节在生成后对照依据检查事实、来源与口径，两层位置不同，不能互相替代。 【机制解释】溯源回路：回答附带片段来源后，使用者可以回溯到原始文档核对；无来源标注的回答即使结论正确，也无法区分是来自知识库还是模型推测。 【经验推断】分库检索比混库命中更准、权限更好控；这一条来自技巧 43 的做法（PDF 第 146 页），实际检索质量还受文档切块与提问关键词影响。<\/p>\n<h2>算例 6：同一合规问题，无知识库与注入知识库对照（可复核）<\/h2>\n<p>问题：“我们这类产品可以宣称哪些功效表述？” 条件 A（未接知识库，纯对话）：<\/p>\n<pre><code>产品可以宣称哪些功效表述？<\/code><\/pre>\n<p>预期输出落点：给一般性广告合规常识，列常见禁用词；具体到本品类的允许边界与现行条款无法确定，可能把过期口径当成现行规定。 条件 B（接入本品类法规库，先检索再作答）：<\/p>\n<pre><code>先从知识库检索本品类相关法规条文，再回答可宣称与不可宣称的表述；每条结论标注来源条文。<\/code><\/pre>\n<p>逐段对比：<\/p>\n<ul><li>\n依据段：B 引用检索到的具体条文，A 凭常识作答。\n<\/li><li>\n边界段：B 区分“可宣称”与“需限定条件宣称”，A 给笼统是非判断。\n<\/li><li>\n溯源段：B 每条结论可回溯条文，A 无法核对出处。\n<p>差异来源：条件 B 的检索片段进入上下文参与生成；条件 A 缺依据，模型用通用知识补位。若检索未命中，B 也会退回通用回答，所以上线前要先点检索测试确认能返回内容（技巧 100，PDF 第 311 页）。<\/p>\n<\/ul>\n<h2>常见误读补充<\/h2>\n<ul><li>\n误读：回答里标了来源，依据就一定可靠。反例：来源标注只说明引用了哪段材料，材料本身是否现行、是否被误读仍要核对；旧版条文也可能被检索到。\n<\/li><li>\n误读：知识库投喂一次，模型以后就知道了。反例：知识库按问题检索，不改变模型参数；文档更新后要同步更新库内文件，旧材料仍会被召回。\n<\/li><li>\n误读：核验只是输出后再扫一遍敏感词。反例：敏感词扫描只能排表面违规，事实错误、依据缺失与越界结论要靠对照来源逐层检查；三层防线要在提示、生成、输出各段分别落位。\n<\/ul>\n<h2>自检问题<\/h2>\n<ol><li>\n编造数字为什么能以权威语气出现？缺的是哪一环？\n<\/li><li>\n核验三招分别截住哪类问题？三类标注的证据强度如何排序？\n<\/li><li>\n合规前置与事后筛违规词，差别在候选空间的哪一步？合规规则为什么要写成可核对条目？\n<\/li><li>\n知识库检索回路四步分别做什么？片段过期或矛盾时会发生什么？\n<\/li><li>\n过期知识库为什么比没有知识库更危险？模型自我标注的事实是否可直接引用？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "核验、合规与定制知识库（RAG 雏形）"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：DeepSeek使用秘笈：从入门到精通的100个实用技巧 · p.228<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">场景化提示词套路：办公、创作、营销<\/a><\/span><\/div><h1>生活、学习与求职场景中的提示词迁移<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 3 章（原书第 8–9 章，并入第 7 章）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>提示词迁移是把四要素骨架从工作场景搬到私人决策、学习成长与求职路径：生活任务填个人偏好与硬限制，学习任务填现状水平与目标要求，求职任务填真实经历与目标 JD。第 7 章行业技巧是同一骨架加上行业术语、法规与岗位约束的垂直版本，不是另一套方法。<\/p>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>生活与求职场景容易出现两种偏差：一是只丢一个模糊愿望（“帮我选个房子”“帮我做个计划”），模型给平均人群建议；二是把模型输出当成专业结论直接行动。技巧 73 把情绪疏导定位成 24 小时倾诉辅助（PDF 第 230 页），技巧 91 明确简历优化不等于造假（PDF 第 280 页）。困难在于：私人场景的个人条件更私人，不说出来模型更猜不到；同时风险边界更难划，涉及健康、法律、职业选择时建议代价更高。<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n<strong>生活骨架<\/strong>：现状与偏好 → 决策类型 → 硬限制与禁忌 → 产物形状。覆盖营养餐（技巧 72，PDF 第 228 页）、情绪倾诉（技巧 73，第 230 页）、选房（技巧 74，第 235 页）、选车（技巧 75，第 237 页）、家务（技巧 76，第 241 页）、咖啡（技巧 77，第 244 页）、造型（技巧 78，第 246 页）、旅行（技巧 79，第 247 页）、教练（技巧 80，第 250 页）、荐书（技巧 81，第 252 页）、祝福（技巧 82，第 254 页）、花语（技巧 83，第 256 页）。\n<\/li><li>\n<strong>学习骨架<\/strong>：现状水平 → 目标要求 → 资源与时间 → 反馈闭环。覆盖思维纠偏（技巧 84，PDF 第 260 页）、学习计划（技巧 85，第 262 页）、出题逻辑（技巧 86，第 264 页）、执行监控（技巧 87，第 266 页）。\n<\/li><li>\n<strong>求职骨架<\/strong>：JD 关键词 → 真实经历量化 → 岗位定向表述。覆盖职业规划（技巧 88，PDF 第 270 页）、学术互助（技巧 89、90，第 272、275 页）、简历改写（技巧 91，第 278 页）。\n<\/li><li>\n<strong>行业垂直套用<\/strong>：翻译（技巧 63，PDF 第 203 页）、金融（技巧 64，第 205 页）、交通（技巧 65，第 208 页）、工程建筑（技巧 66，第 210 页）、法律（技巧 67，第 212 页）、教学（技巧 68、69，第 214、217 页）、软件开发（技巧 70、71，第 219、221 页）。\n<\/ul>\n<p>正例：“我有 8 年雅思教学经验，现在想转行，帮我找 5 个能用上教学技能的朝阳行业，排除需要重新考证的选项”（技巧 88，PDF 第 271 页）。反例：“推荐北京景点”——同行人、身体条件、预算、偏好全缺。<\/p>\n<h2>原理推导<\/h2>\n<p>第一步，私人决策的变量更依赖个人条件。选房看预算与通勤，选车看场景与人数，旅行看同行人身体条件；这些变量不进入上下文，模型只能按平均人群推荐。 第二步，学习任务的缺口靠对比得出。技巧 85 上传简历、工作文档与岗位目标，模型识别能力缺口、对照能力模型排提升清单（PDF 第 262–263 页）；没有现状材料与目标要求，对比无法进行，输出是通用课程清单。 第三步，求职任务是定向文本匹配。技巧 91 先提取 JD 关键词，再把真实经历按关键词量化重写（PDF 第 278 页）；机制是简历要同时通过人工阅读与初筛系统，关键词与量化指标决定匹配度。 第四步，行业技巧 = 通用骨架 + 行业约束。翻译约束在术语与语境，法律约束在法条边界，教学约束在大纲与学情，开发约束在可运行代码与注释；骨架不变，约束清单更换。 第五步，推出边界：模型在私人场景整理信息、列选项、模拟问答；专业判断由有资质的人负责。优化表述不能添加不存在的事实。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：能说清个人现状、偏好与限制；任务属于信息整理、选项对比、方案草拟；重大决策保留人工核验环节。\n<\/li><li>\n条件去掉会怎样：不补个人条件 → 建议正确但不可用；不设专业边界 → 越界结论被直接采纳；简历改写越过事实 → 背调与面试暴露。\n<\/li><li>\n失败案例：技巧 14 中只说减肥计划不给身体条件，可能得到伤膝的跑步建议（PDF 第 52 页）；技巧 91 中“参与双十一活动”被写成“积极工作”导致初筛判定缺乏大促经验（PDF 第 278 页）。\n<\/li><li>\n边界：情绪倾诉辅助不替代心理咨询；学术辅助不替代本人写作与规范负责；职业规划是动态导航，不是一次性算命（技巧 88，PDF 第 271 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>生活 vs 学习骨架<\/strong>：生活任务的变量是偏好与限制，产物是选项或文案；学习任务的变量是水平与目标，产物是计划与反馈闭环。\n<\/li><li>\n<strong>学习计划 vs 职业规划<\/strong>：学习计划对准能力缺口与资源安排；职业规划对准路径拆解、信息整合与动态调整（技巧 88，PDF 第 270–271 页）。\n<\/li><li>\n<strong>行业技巧 vs 通用套路<\/strong>：行业技巧不新造方法，只在骨架上替换术语、法规、岗位约束；读行业案例时先抽骨架再记专属约束。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c06 场景套路、概念 c07 核验合规。后继：概念 c10 把学习与求职中反复使用的固定流程做成智能体；敏感职业资料是否本地处理见概念 c09。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[通用骨架: 背景+需求+约束+格式] --&gt; B[生活: 偏好/限制/产物]\nA --&gt; C[学习: 水平/目标/闭环]\nA --&gt; D[求职: 经历/JD/量化表述]\nA --&gt; E[行业: 骨架+术语/法规/岗位约束]\nB --&gt; F[人工核验边界]\nC --&gt; F\nD --&gt; F\nE --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>技巧 72–83（PDF 第 228–256 页）<\/td><td>生活场景<\/td><td>个人条件进上下文，产物按决策类型定格式<\/td><\/tr><tr><td>技巧 84–87（PDF 第 260–266 页）<\/td><td>学习成长<\/td><td>找漏洞、定计划、析出题、盯执行<\/td><\/tr><tr><td>技巧 88–91（PDF 第 270–280 页）<\/td><td>求职与学术<\/td><td>规划拆解、信息整合、动态调整、简历量化<\/td><\/tr><tr><td>技巧 63–71（PDF 第 203–221 页）<\/td><td>行业垂直<\/td><td>骨架加行业术语、法规与岗位约束<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>相关概念<\/h2>\n<p>场景化套路、核验合规与知识库、智能体构造要素<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（生活、学习与求职场景中的提示词迁移）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：骨架如何迁移到生活、学习、求职与行业场景<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>往回追前提：<\/p>\n<ol><li>\n提示词质量取决于输入信息能否把回答约束在可用范围；私人场景的关键信息（预算、水平、经历）只在用户一侧。\n<\/li><li>\n不同场景的产物类型不同：生活产物是选项与文案，学习产物是计划与反馈，求职产物是定向文本，行业产物是专业交付。\n<\/li><li>\n场景之间可迁移的是骨架结构，不可迁移的是具体约束；迁移时替换变量，保留结构。\n<\/li><li>\n私人决策代价高，边界声明必须进入提示词，把模型角色限定在信息整理与选项对比。\n<\/ol>\n<p>依赖链方向：通用骨架 → 产物类型分流 → 各场景填变量 → 边界声明兜底。迁移失败通常有两种：把骨架一起丢掉，重新靠背技巧；或不换约束清单，把办公话术直接套到生活场景。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：推导生活场景变量从哪来<\/h3>\n<p>生活决策先列个人条件。技巧 74 选房顾问、技巧 75 选车军师都要求输入预算、通勤、家庭结构、用车场景（PDF 第 235、237 页）；技巧 79 旅行管家要求同行人、天数、偏好（PDF 第 247 页）。推导：条件变量缺一条，模型在该维度按平均水平推荐；平均方案正确但不可用。产物类型再分：候选对比用表格，权衡分析用条目，日程方案用时间线，祝福与花语给短句成品。<\/p>\n<h3>第二步：推导学习计划的对比结构<\/h3>\n<p>技巧 85 流程：上传简历与工作文档、明确岗位目标 → 模型构建三维能力图谱 → 识别工具使用率、政策敏感度等盲区 → 对照顶尖人才能力模型排提升清单 → 整合资源并跟踪效果（PDF 第 262–264 页）。推导：能力缺口是“现状材料”与“目标模型”的差值；两边材料都进上下文，差值才可计算。只给“我想提升自己”，现状与目标都缺，差值无法定位，输出只能是通用课程清单。技巧 86 洞悉出题逻辑则要求给题型、考点与样本，让模型反向总结命题角度（PDF 第 264 页）。<\/p>\n<h3>第三步：推导执行监控为什么需要闭环<\/h3>\n<p>技巧 87 把计划“焊死”在执行轨道上（PDF 第 266 页）。推导：计划生成后需要定期对照实际完成情况反馈，模型根据偏差调整下一步；没有反馈环节，计划停在纸面。这与概念 c05 的反馈调整机制一致，只是场景换成个人学习与习惯。<\/p>\n<h3>第四步：推导求职文本的匹配机制<\/h3>\n<p>技巧 91 三步（PDF 第 278–279 页）：<\/p>\n<ul><li>\n关键词炼金术：把岗位 JD 发给模型，提取核心能力关键词。\n<\/li><li>\n成就翻译器：把职责描述改成量化成果，如“单月策划 3 个爆款专题，粉丝增长 150%”。\n<\/li><li>\n岗位变形咒：同一段经历按目标岗位重组表述。\n<p>推导：简历是定向广告文本，初筛系统按关键词匹配；经历真实但表述不含关键词，会被误判不匹配。案例对照：“负责公司日常行政工作”被改写为“优化采购流程年度节约成本 18%；主导电子档案系统查询效率提升 70%”（PDF 第 279 页）。改写只换表述与量化角度，不添加不存在的事实。<\/p>\n<\/ul>\n<h3>第五步：推导行业垂直套用的拆法<\/h3>\n<p>以技巧 70、71 软件开发为例（PDF 第 219、221 页）：背景是技术栈与项目现状，需求是代码片段或调试方案，约束是运行环境与注释要求，格式是可运行代码加说明。法律场景（技巧 67，PDF 第 212 页）约束换成法条边界与免责提示；教学场景（技巧 68、69，PDF 第 214、217 页）约束换成大纲、学情与批改标准。推导：读行业技巧时先剥离专属约束，剩下的动作链与办公创作套路一致。<\/p>\n<h2>算例<\/h2>\n<h3>算例 1：职业规划三明治提问（技巧 88，PDF 第 271 页）<\/h3>\n<p>背景：8 年雅思教学经验，想转行。 需求：找 5 个能用上教学技能的朝阳行业。 约束：排除需要重新考证的选项。 输出：教育科技产品设计、企业培训与跨文化沟通顾问、知识付费与 IP 创作、国际教育规划等方向，附技能迁移点与优势分析。 推导：背景给可迁移技能，需求给方向数量，约束排除高门槛选项；三步对应骨架的背景、需求、约束。<\/p>\n<h3>算例 2：简历表述改写（技巧 91，PDF 第 279 页）<\/h3>\n<p>原始：“负责客户对接工作。” 改写方向：体现沟通能力与问题解决能力，量化结果。 对照行政岗案例：“负责日常行政工作” → “优化采购流程，年度节约成本 18%；主导电子档案系统，查询效率提升 70%”。 推导：关键词来自目标 JD，数字来自真实经历；两者都不允许编造。<\/p>\n<h3>算例 3：反例——越过专业边界<\/h3>\n<p>情绪问题直接问“我该怎么诊断自己的病”，模型按常识回答。推导：技巧 73 定位为倾诉辅助（PDF 第 230 页），医疗判断需执业人员；提示词应加边界“仅做情绪梳理与信息整理，不构成诊断建议”。去掉边界声明后，通顺表述容易被当成专业结论。<\/p>\n<h3>算例 4：反例——简历造假<\/h3>\n<p>要求模型把“参与项目”写成“独立负责项目”。推导：表述美化越过事实层，背调与面试无法自圆；技巧 91 红线“优化≠造假”（PDF 第 280 页）。<\/p>\n<h2>假设与边界<\/h2>\n<p>推导假设：用户提供的经历与材料真实；模型不做背景调查，造假内容由用户承担后果。职业规划受行业变化影响，技巧 88 要求动态调整，定期把新信息喂回上下文（PDF 第 271 页）。学术辅助场景下，观点成文与查重责任在本人；模型输出仅作草稿与线索。<\/p>\n<h2>补充推演：生活决策中偏好与硬限制的区分<\/h2>\n<p>生活提示词里两类信息作用不同，推导时要分开写：<\/p>\n<ul><li>\n偏好变量：口味、风格、兴趣方向，影响选项排序，不满足时方案仍可用但不合心意。\n<\/li><li>\n硬限制：预算、过敏、身体条件、时间上限，属于排除条件，违反即不可用。\n<p>选房案例中预算与通勤是硬限制，地段偏好是偏好；旅行案例中步行承受度是硬限制，文化景点偏好是偏好。混在一起写会让模型把偏好当限制删掉过多选项，或把限制当偏好留下不可行方案。<\/p>\n<\/ul>\n<h2>补充推演：学习闭环的反馈节点<\/h2>\n<p>技巧 85 的学习计划不是一次性文档（PDF 第 263–264 页）。推导闭环节点：<\/p>\n<ol><li>\n输入现状材料与目标岗位，生成能力图谱与提升清单。\n<\/li><li>\n按清单执行学习与实践任务。\n<\/li><li>\n提交实践成果，模型评估进度并调整重点。\n<\/li><li>\n定期追踪，用可视化进度对照目标。\n<p>缺反馈节点时，计划停在纸面；技巧 87 的执行监控就是把节点 3、4 固定成定期检查（PDF 第 266 页）。职业规划的闭环结构相同：技巧 88 的动态调整要求把行业新信息定期喂回，规划随市场变化校准（PDF 第 271 页）。<\/p>\n<\/ol>\n<h2>补充推演：简历匹配链的两端<\/h2>\n<p>简历要同时过两端筛选：初筛系统按关键词匹配，HR 按经历相关性阅读。推导三步各对一端：<\/p>\n<ul><li>\n提取 JD 关键词：对准系统匹配端，缺关键词会被规则过滤。\n<\/li><li>\n量化经历：对准 HR 阅读端，数字与结果比职责描述更有说服力。\n<\/li><li>\n岗位定向重组：同一段经历按目标岗位调整侧重点，对准两端的优先级排序。\n<p>技巧 91 案例：“参与双十一活动”写成“积极工作”，系统判定缺乏大促经验（PDF 第 278 页）；问题出在关键词端，不是经历本身不足。<\/p>\n<\/ul>\n<h2>常见误读对照<\/h2>\n<ul><li>\n误读：生活技巧与工作方法无关。生活决策同样受预算、偏好、限制约束，骨架与办公任务一致；差别只在变量取值与风险边界。\n<\/li><li>\n误读：学习计划越全越好。技巧 85 要求基于能力缺口排优先级（PDF 第 263 页）；清单不分先后，执行时平均用力，缺口项得不到优先处理。\n<\/li><li>\n误读：行业技巧需要单独背。剥离术语、法规、岗位约束后，动作链与通用套路一致；先抽骨架再记专属约束，迁移成本最低。\n<\/ul>\n<h2>补充算例<\/h2>\n<h3>算例 6：选车提示词要素<\/h3>\n<p>背景：三口之家，市区通勤为主，每年一次长途自驾；需求：对比两款车型优缺点；约束：预算 15 万以内，后排能装儿童座椅，不考虑纯电；格式：表格列空间、油耗、保养成本、推荐结论。对照技巧 75 选车军师定位（PDF 第 237 页）；缺约束时模型可能推荐超预算或不符合用车场景的车型。<\/p>\n<h3>算例 7：职业规划拆解<\/h3>\n<p>目标：三年内成为 AI 产品专家。技巧 88 拆成六个半年计划，每阶段含学习目标、行动、产出成果（PDF 第 270 页）。推导：抽象目标无法执行，阶段成果可检查；动态调整环节保留技能树分叉，行业变冷时按可迁移方向转向。<\/p>\n<h3>算例 8：反例——学术辅助越界<\/h3>\n<p>让模型直接代写课程论文。推导：技巧 89、90 定位在文献互助与资料处理（PDF 第 272、275 页）；成文观点与查重责任在本人，代写越过学术规范边界，风险由学生承担。<\/p>\n<h3>算例 9：反例——偏好写成限制<\/h3>\n<p>“不喜欢太吵的餐厅”被模型理解为排除所有商圈店。推导：偏好是排序权重，硬限制才是排除条件；提示词应写清“优先安静，预算与地段优先满足”，避免偏好被当成禁区。<\/p>\n<h2>补充推演：第 7 章行业技巧的拆法示范<\/h2>\n<p>以技巧 70、71 软件开发为例（PDF 第 219、221 页），把行业技巧拆回通用骨架：<\/p>\n<ul><li>\n背景：技术栈、项目现状、报错信息。\n<\/li><li>\n需求：生成代码片段、定位 bug、解释实现思路。\n<\/li><li>\n约束：运行环境、注释要求、不引入未授权依赖。\n<\/li><li>\n格式：可运行代码加说明。\n<p>法律场景（技巧 67，PDF 第 212 页）把约束换成法条边界与免责提示；教学场景（技巧 68、69，PDF 第 214、217 页）把约束换成大纲、学情与批改标准；翻译场景（技巧 63，PDF 第 203 页）把约束换成术语表与语境。拆完可见：行业专属部分是术语、法规与岗位口径，动作链与其他场景一致。<\/p>\n<\/ul>\n<h2>补充推演：职业规划的动态校准机制<\/h2>\n<p>技巧 88 把规划比作动态导航而不是一次性图纸（PDF 第 271 页）。推导校准节点：<\/p>\n<ul><li>\n定期回看行业信息：岗位需求、技能要求、行业风向是否变化。\n<\/li><li>\n对照阶段成果：计划中的学习目标与产出是否完成。\n<\/li><li>\n技能树分叉：原方向变冷时，列出可迁移方向与需补充能力。\n<p>静态计划在行业变化后直接作废；动态校准要求把新信息定期喂回上下文，模型基于最新情况调整路径。规划建议本身仍需本人结合实际判断，模型不承担职业选择后果。<\/p>\n<\/ul>\n<h2>补充推演：学习计划中的资源匹配<\/h2>\n<p>技巧 85 要求整合课程、书籍、论文、报告等资源（PDF 第 263 页）。推导资源匹配前提：能力缺口定位清楚后，资源才按缺口选；缺口不明时，资源推荐变成热门课程清单。学习方式偏好（思维导图、动手练习、阅读）也属于背景变量，影响资源形式选择。计划执行后再用实践成果评估进度，资源清单随评估结果增减。<\/p>\n<h2>边界补充：生活场景的情绪与健康边界<\/h2>\n<p>技巧 73 定位为情绪倾诉辅助（PDF 第 230 页）。推导边界：模型可以整理情绪、梳理表达、给出一般放松思路，但不做心理诊断，不替代专业心理咨询；持续情绪问题需要寻求专业渠道。饮食、健身类建议边界相同：要结合身体条件，伤病情况遵医嘱。提示词中写明“不构成医疗/心理诊断建议”，把模型角色限定在整理与陪伴。<\/p>\n<h2>机制拆解：跨场景迁移时骨架与变量各起什么作用<\/h2>\n<p>【机制解释】骨架复用：背景—需求—约束—格式四段结构在不同场景通用；迁移时不变的是动作链，变的是每段填入的个人信息与行业口径。 【机制解释】变量替换：生活场景填作息、偏好、预算；学习场景填基础、目标、可用时间；求职场景填经历、岗位、短板；变量错填会让建议落到错误人群上。 【机制解释】边界回写：场景不同，约束段的专业边界不同——学习计划不替代教学判断，求职建议不承诺录用结果，生活建议不替代医疗心理诊断；边界要写进提示词。 【经验推断】先把通用骨架练熟，再逐场景填变量，比为每个场景另造一套说法更快成型；这一条来自第 8、9 章技巧归纳（PDF 第 228–278 页），个人适配度仍需本人核对。<\/p>\n<h2>算例 6：同一套骨架，学习计划与求职简历两种填法对照（可复核）<\/h2>\n<p>个人事实：大专在读，食品检验检测方向，课余可投入 3 小时/天，正在准备专升本。 提示词 A（学习场景）：<\/p>\n<pre><code>背景：大专在读食品检验检测方向，每天可学 3 小时，目标通过专升本专业课。\n需求：排一份四周复习计划。\n约束：先补无机与分析化学薄弱点，再刷练习题；不排周末全天课。\n格式：按周列目标、资料、每日任务与检查节点。<\/code><\/pre>\n<p>提示词 B（求职场景）：<\/p>\n<pre><code>背景：同上在读，有实验室检测实训经历，意向食品检验岗。\n需求：把实训经历改成简历项目描述。\n约束：用可核验的操作与结果说话，不夸大职称与独立承担职责。\n格式：按项目名、职责、成果三行一段。<\/code><\/pre>\n<p>逐段对比：<\/p>\n<ul><li>\n目标段：A 指向考试通过与知识补漏，B 指向岗位匹配与经历呈现。\n<\/li><li>\n约束段：A 排学习节奏，B 守表述边界。\n<\/li><li>\n产物段：A 是时间计划，B 是简历条目；骨架相同，变量与出口形状不同。\n<p>差异来源：场景变量替换后，候选内容沿各自目标收窄；把 A 的学习节奏填进 B，会得到一份不像简历的自我介绍。<\/p>\n<\/ul>\n<h2>常见误读补充<\/h2>\n<ul><li>\n误读：生活、学习提示词可以照搬行业黑话。反例：黑话服务于岗位身份共识，个人场景堆行业术语会让建议脱离本人实际；先填清个人变量，再决定要不要借专业口径。\n<\/li><li>\n误读：模型给的规划可以直接照执行。反例：规划基于你提供的信息，信息不全或假设不成立时路径会偏；技巧 88 把规划定位为动态导航，要定期回看校准（PDF 第 271 页）。\n<\/li><li>\n误读：情绪倾诉可以替代专业心理支持。反例：模型可整理情绪与表达，不做诊断也不替代咨询；持续情绪问题需走专业渠道，提示词中应写明不构成心理诊断建议。\n<\/ul>\n<h2>自检问题<\/h2>\n<ol><li>\n生活骨架的四类变量分别填什么个人信息？偏好与硬限制在提示词里作用有何不同？\n<\/li><li>\n学习计划中的“能力缺口”靠哪两份材料对比得出？闭环有哪几个反馈节点？\n<\/li><li>\n简历三步各解决匹配链上的哪一环？分别对准系统筛选还是 HR 阅读？\n<\/li><li>\n行业技巧与通用套路的关系是什么？迁移时保留什么、替换什么？\n<\/li><li>\n私人场景为什么必须写边界声明？去掉会有什么后果？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "生活、学习与求职场景中的提示词迁移"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：DeepSeek使用秘笈：从入门到精通的100个实用技巧 · p.287<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">核验、合规与定制知识库（RAG 雏形）<\/a><\/span><\/div><h1>本地部署：动机、硬件条件与流程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书第 10–11 章）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>本地部署是把 DeepSeek 模型权重下载到自己或企业掌控的服务器上运行，数据不经过第三方云服务。它解决数据主权、合规隔离、性能稳定性与更新可控四类问题；代价是技术基础、硬件投入与运维成本。部署要过硬件、软件、网络三重条件，流程为安装 Ollama → 选版本下载模型 → 启动服务 → 接 Web UI。<\/p>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>在线服务的便利伴随三个顾虑：敏感数据要经过第三方平台，高并发时云端可能卡顿，模型自动更新时间不可控。技巧 93 把数据主权比作“数字时代的房产证和保险箱”：云端像把日记本存进邻居保险柜，本地部署像锁进自家保险柜（PDF 第 283 页）。技巧 94 指出高并发与网络故障场景下，云端服务的延迟与中断可能造成业务损失（PDF 第 286 页）。困难在于：先判断自己是否真有这些顾虑，再核对硬件软件条件，避免为不需要的功能承担成本。<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n<strong>数据主权<\/strong>：训练数据与交互记录存储在自建服务器，从生成、存储到销毁全程自主掌控（技巧 93，PDF 第 284 页）。\n<\/li><li>\n<strong>合规隔离<\/strong>：金融、医疗、跨国数据有境内存储与隔离要求；本地部署建立专属数据隔离区（PDF 第 284 页）。\n<\/li><li>\n<strong>性能与稳定性<\/strong>：计算引擎置于企业内部，省去云端传输时间；多级冗余在硬件故障或网络中断时切换；模型更新先沙盒测试再全量部署（技巧 94，PDF 第 286 页）。\n<\/li><li>\n<strong>硬件条件<\/strong>：服务器级 CPU、内存、SSD、GPU。技巧 95 口径：14B 模型内存建议 16GB DDR4 及以上，存储至少 500GB SSD，显卡推荐 NVIDIA RTX 40 系列或更高级别（PDF 第 288 页）；技巧 92 提到显卡至少 RTX 3090 级别（PDF 第 282 页）。\n<\/li><li>\n<strong>软件与网络<\/strong>：Linux 或 Windows 环境，Ollama 开源工具管理本地模型；带宽充足，防火墙与安全组只允许授权访问（技巧 95，PDF 第 288–289 页）。\n<\/li><li>\n<strong>部署流程<\/strong>：装 Ollama → 按硬件选版本（1.5B/7B/8B/14B/32B/70B/671B）→ <code>ollama run deepseek-r1:14b<\/code> 启动 → Page Assist 接 Web UI（技巧 96、97，PDF 第 290–297 页）。\n<\/ul>\n<p>正例：医院 AI 辅助诊断系统要求病历不出院、急救场景不能断网，评估本地部署（技巧 93、94 场景，PDF 第 284、286 页）。反例：日常外语咨询、装修问答、面试模拟等普通需求，在线服务足够，不必本地安装（技巧 92，PDF 第 282 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>第一步，模型运行需要把参数量存入可访问的存储器。参数量越大，存放容量需求越高；这是硬件要求的第一来源。 第二步，估算参数占用。设参数量为 <span class=\"katex-inline\">P<\/span>（B），每参数占 <span class=\"katex-inline\">b<\/span> 字节：FP16 下 <span class=\"katex-inline\">b=2<\/span>，INT4 量化下 <span class=\"katex-inline\">b\\approx0.5<\/span>，参数占用 <span class=\"katex-inline\">V\\approx P\\times b<\/span>。14B 按 INT4 估算约 7GB，再加上下文与推理缓冲；技巧 95 的 16GB 内存口径覆盖模型加载与系统开销（PDF 第 288 页）。 第三步，区分三类存储角色。内存提供系统与加载容量；显存由 GPU 提供，并行执行参数矩阵运算，决定推理速度；SSD 存放权重文件与本地资料，决定加载速度。 第四步，推导出成本权衡。技巧 92 指出本地部署需要技术基础、高性能显卡，每月租用服务器两千多元（PDF 第 282 页）；技巧 94 估算投入 200 万元建本地集群，3 年收回成本，自建系统寿命 5–8 年，后期边际成本趋近于零（PDF 第 287 页）。个人普通需求与这笔投入不匹配。 第五步，推出决策顺序：先确认数据敏感度与业务连续性要求，再按估算式核对硬件，最后选软件与流程；不为装环境而部署。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：处理高度敏感信息；合规要求数据境内存储或物理隔离；业务不能依赖云端可用性；有技术人员维护。\n<\/li><li>\n条件去掉会怎样：硬件不达标 → 模型加载失败或速度不可用；软件环境不兼容 → 部署失败或运行不稳；网络防火墙配置不当 → 非法访问风险（技巧 95，PDF 第 289 页）。\n<\/li><li>\n失败案例：技巧 92 把本地部署比作豪华跑车，大多数人骑自行车即可到达目的地（PDF 第 282–283 页）；内存不足时关闭其他大型软件或选更小版本（技巧 96，PDF 第 293 页）。\n<\/li><li>\n边界：本地部署不改变模型能力上限；模型版本更新、知识库维护责任转到使用者一侧。在线服务仍适合非敏感、轻量需求。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>本地部署 vs 在线 API<\/strong>：本地部署数据不出自建环境，可控性强但要承担硬件运维；在线 API 开箱即用，数据经过服务商。概念 c10 的云端 API 搭建走的是后者路径。\n<\/li><li>\n<strong>内存 vs 显存<\/strong>：内存是系统级容量，显存是 GPU 并行计算容量；模型加载先过内存，推理加速靠显存。\n<\/li><li>\n<strong>部署 vs 智能体<\/strong>：部署解决模型跑在哪里，智能体解决专用助手怎么配置；两者可以组合，本地模型上挂智能体配置。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c07 知识库与敏感资料分级。后继：概念 c10 在部署或 API 模型之上配置智能体；嵌入模型与知识库检索是智能体搭建的一部分。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[判断需求] --&gt; B{敏感/合规/连续性要求?}\nB --&gt;|否| C[在线服务]\nB --&gt;|是| D[核对硬件: CPU/内存/SSD/GPU]\nD --&gt; E[软件环境: OS + Ollama]\nE --&gt; F[选模型版本下载]\nF --&gt; G[启动服务: ollama run]\nG --&gt; H[接 Web UI]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>技巧 92（PDF 第 282 页）<\/td><td>是否需要部署<\/td><td>普通在线需求不必部署；敏感信息场景才值得<\/td><\/tr><tr><td>技巧 93（PDF 第 283 页）<\/td><td>安全合规<\/td><td>数据主权、物理隔离、生命周期可控<\/td><\/tr><tr><td>技巧 94（PDF 第 285 页）<\/td><td>性能稳定效益<\/td><td>低延迟、冗余切换、更新可控、长期成本<\/td><\/tr><tr><td>技巧 95（PDF 第 287 页）<\/td><td>三重条件<\/td><td>硬件、软件、网络缺一不可<\/td><\/tr><tr><td>技巧 96（PDF 第 290 页）<\/td><td>实操步骤<\/td><td>Ollama 安装、选版本、命令启动<\/td><\/tr><tr><td>技巧 97（PDF 第 294 页）<\/td><td>Web UI<\/td><td>Page Assist 扩展接本地模型，端口 11434<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>相关概念<\/h2>\n<p>核验合规与知识库、智能体构造要素<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（本地部署：动机、硬件条件与流程）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：本地部署的资源估算、条件核对与流程推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>往回追前提：<\/p>\n<ol><li>\n大模型以参数权重形式存在；推理时权重必须进入可访问的存储器，参与矩阵运算。\n<\/li><li>\n参数量越大，权重占用容量越高；量化方式决定每个参数占多少字节。\n<\/li><li>\n推理除权重外还需要上下文与中间计算缓冲；系统本身也要占内存。\n<\/li><li>\n本地部署把模型、数据、服务的控制权从服务商移到使用者一侧，控制权对应运维责任与硬件投入。\n<\/ol>\n<p>依赖链方向：权重存储需求 → 内存/显存/SSD 分工 → 硬件条件核对 → 软件与网络配套 → 部署流程。先估容量再选版本；跳过估算直接装大版本，会在加载或运行阶段失败。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：推导权重容量估算式<\/h3>\n<p>设模型参数量为 <span class=\"katex-inline\">P<\/span>，单位 B（十亿参数）；每个参数占 <span class=\"katex-inline\">b<\/span> 字节。权重容量估算：<\/p>\n<div class=\"katex-block\">V_{\\text{weight}} \\approx P \\times b<\/div>\n<ul><li>\nFP16（半精度）：<span class=\"katex-inline\">b=2<\/span> 字节；\n<\/li><li>\nINT4 量化：<span class=\"katex-inline\">b\\approx 0.5<\/span> 字节；\n<\/li><li>\n实际可用容量还要加上上下文窗口、中间激活与系统开销，因此建议配置高于纯权重估算。\n<\/ul>\n<p>符号说明：<span class=\"katex-inline\">V_{\\text{weight}}<\/span> 是权重占用容量；<span class=\"katex-inline\">P<\/span> 来自模型版本号（如 14B 即 <span class=\"katex-inline\">P=14<\/span>）；<span class=\"katex-inline\">b<\/span> 由量化精度决定。<\/p>\n<h3>第二步：代入原书版本做算例<\/h3>\n<p>技巧 96 列出版本：1.5B、7B、8B、14B、32B、70B、671B（PDF 第 291 页）。按 INT4（<span class=\"katex-inline\">b=0.5<\/span>）估算纯权重：<\/p>\n<ul><li>\n7B：<span class=\"katex-inline\">7\\times0.5=3.5<\/span> GB；\n<\/li><li>\n14B：<span class=\"katex-inline\">14\\times0.5=7<\/span> GB；\n<\/li><li>\n32B：<span class=\"katex-inline\">32\\times0.5=16<\/span> GB；\n<\/li><li>\n70B：<span class=\"katex-inline\">70\\times0.5=35<\/span> GB；\n<\/li><li>\n671B：<span class=\"katex-inline\">671\\times0.5\\approx335.5<\/span> GB。\n<p>对照技巧 95 口径：14B 内存建议 16GB DDR4 及以上，500GB SSD，RTX 40 系列显卡（PDF 第 288 页）。14B 纯权重 7GB 与 16GB 内存建议之间的差额，是上下文、缓冲与系统占用；32B 以上纯权重已超普通消费级内存，70B 与 671B 需要专业显卡集群。<\/p>\n<\/ul>\n<h3>第三步：推导三类硬件角色<\/h3>\n<ul><li>\nCPU：处理调度与非矩阵计算，选服务器级芯片（技巧 95 提 Intel Xeon 或 AMD EPYC 方向，PDF 第 288 页）。\n<\/li><li>\n内存：加载模型权重与系统程序；不足时频繁读写硬盘，速度下降甚至崩溃。\n<\/li><li>\nSSD：存放权重文件与本地资料；读写速度影响模型加载时间。\n<\/li><li>\nGPU：显存存放权重与激活，并行执行矩阵运算，是推理速度的关键；显存不足时模型无法载入 GPU。\n<p>推导：四类硬件缺一出现不同症状——CPU 弱则调度慢，内存不足则卡顿崩溃，SSD 慢则加载久，显存不足则无法运行。<\/p>\n<\/ul>\n<h3>第四步：推导软件与网络条件<\/h3>\n<p>技巧 95：Linux（Ubuntu、CentOS）稳定兼容；Windows 界面友好但需额外配置；Ollama 是支持本地运行 DeepSeek 的开源模型管理工具（PDF 第 288 页）。网络：模型更新与传输需要带宽；防火墙、安全组只允许授权用户与服务访问（PDF 第 289 页）。推导：软件层解决“模型如何被管理与启动”，网络层解决“更新通道与访问边界”；本地部署不等于完全断网，首次下载模型仍需联网。<\/p>\n<h3>第五步：推导部署流程每一步在做什么<\/h3>\n<p>技巧 96（PDF 第 290–293 页）：<\/p>\n<ol><li>\n从 ollama.com 按操作系统安装 Ollama。\n<\/li><li>\n在模型列表找 DeepSeek R1，按硬件选版本；RTX 4070 可尝试 14B，更小版本更稳。\n<\/li><li>\nWindows 14B 示例：管理员 PowerShell 执行 <code>ollama run deepseek-r1:14b<\/code>；模型默认装 C 盘，需留足空间；提示 success 即部署成功。\n<\/li><li>\n启动后在 Ollama 界面对话；下载慢可用国内镜像，连接失败检查 API 地址与模型服务是否启动。\n<p>技巧 97：Page Assist 浏览器扩展作为 Web UI；先确认模型服务启动，Ollama 默认端口 localhost:11434，浏览器访问看到 Ollama is running 即成功，再在扩展里选本地模型（PDF 第 295–297 页）。<\/p>\n<\/ol>\n<h3>第六步：推导成本与决策边界<\/h3>\n<p>技巧 92：技术基础、显卡门槛、每月两千多元服务器成本（PDF 第 282 页）；技巧 94：200 万元本地集群约 3 年收回成本，寿命 5–8 年，后期边际成本接近零（PDF 第 287 页）。推导：部署决策对比的是敏感数据风险、业务中断损失与硬件运维投入；普通个人需求风险与损失都小，在线服务是成本更低的选择。<\/p>\n<h2>算例<\/h2>\n<h3>算例 1：个人机器能否跑 14B<\/h3>\n<p>假设机器：RTX 4070、16GB 内存、512GB SSD。对照技巧 95 口径：内存 16GB 达标下限，SSD 500GB 达标，显卡 RTX 40 系列达标；INT4 估算权重 7GB，显存余量需覆盖缓冲。技巧 96 注明 4070 可尝试 14B，更小版本更稳（PDF 第 291 页）。结论：可先跑 14B，内存不足时关大软件或换 7B/8B。<\/p>\n<h3>算例 2：企业急救场景的稳定性推导<\/h3>\n<p>医院急救 AI 辅助诊断依赖云端时，网络故障后果严重（技巧 94，PDF 第 286 页）。本地部署采用主服务器、备用节点、本地缓存多级冗余，硬件故障或网络中断时无缝切换；模型更新先沙盒测试再全量。推导：稳定性要求越高，冗余层级与更新管控越重要，这部分价值在线 API 方案里由服务商承担，本地部署则自己建设。<\/p>\n<h3>算例 3：反例——无敏感需求盲目部署<\/h3>\n<p>用户日常问外语、装修、面试模拟，为“听起来专业”本地安装。推导：硬件投入与运维时间无法被这些轻量任务回收；技巧 92 结论是普通需求在线服务足够（PDF 第 282–283 页）。反例失败不在技术操作，而在需求判断顺序颠倒：先装环境再找用途。<\/p>\n<h2>假设与边界<\/h2>\n<p>推导中的字节数为量化估算口径，实际显存占用随上下文长度、框架实现变化；以官方硬件说明与本机实测为准。本书未给出 671B 的具体集群配置，不据此估算单机可行性。本地部署后模型能力不随部署方式提升；知识库更新、权限管理仍需人工维护（概念 c07、c10）。<\/p>\n<h2>补充推演：量化精度对容量与质量的权衡<\/h2>\n<p>同一模型可选不同量化精度。推导权衡方向：<\/p>\n<ul><li>\n精度越高（如 FP16），参数容量越大，计算资源占用越高，输出质量损失越小。\n<\/li><li>\n量化越低（如 INT4），容量与显存占用下降，可在消费级机器运行，但部分细节表达可能损失。\n<p>版本选择先按显存容量定可运行区间，再在区间内选尽量大的版本；技巧 96 注明按硬件配置选 1.5B 到 671B 不同版本（PDF 第 291 页）。小机器硬选大版本，加载阶段就会因容量不足失败，而不是运行变慢。<\/p>\n<\/ul>\n<h2>补充推演：网络与安全配置的角色<\/h2>\n<p>技巧 95 把网络列为三驾马车之一（PDF 第 289 页）。推导本地部署不等于断网：<\/p>\n<ul><li>\n首次下载模型权重、后续更新版本，仍需访问模型仓库或国内镜像。\n<\/li><li>\n服务启动后通过 localhost 端口对外提供接口；防火墙与安全组决定谁能访问。\n<\/li><li>\n端口暴露在公网而无访问控制时，本地模型服务可能被未授权调用。\n<p>技巧 97 记录默认端口 11434，浏览器访问 http://localhost:11434 测试响应（PDF 第 296 页）；本地测试用回环地址，对外服务要单独配授权规则。<\/p>\n<\/ul>\n<h2>补充推演：更新主动权对应的维护责任<\/h2>\n<p>技巧 94 指出本地部署可严格控制模型更新，先沙盒测试再全量部署（PDF 第 286 页）。推导这一优势的另一面：云端服务由厂商推送更新，本地部署的更新判断、测试、回滚都由使用者承担。长期不更新会错过修复与能力改进；贸然全量更新可能影响已稳定的业务流程。配套知识库也要同步更新，旧制度与新模型组合会产生新的错位。<\/p>\n<h2>常见误读对照<\/h2>\n<ul><li>\n误读：本地部署等于数据完全不出机器。首次下载、镜像更新、故障排查仍可能经过网络；数据不出自建环境指交互数据与业务资料不送第三方云服务，下载环节另算。\n<\/li><li>\n误读：显存够就能跑。内存负责加载与系统，SSD 负责文件存放，CPU 负责调度；任一短板都会出现对应症状，不能只看显卡。\n<\/li><li>\n误读：部署完成后一劳永逸。模型服务启动、端口配置、知识库更新、案例迭代都属于持续运维；技巧 96 提醒关机后再次使用需重新执行启动命令（PDF 第 293 页）。\n<\/ul>\n<h2>补充算例<\/h2>\n<h3>算例 4：7B 与 14B 的容量对照<\/h3>\n<p>按 INT4 估算：7B 纯权重约 3.5GB，14B 约 7GB。机器显存 8GB 时，7B 留有上下文缓冲空间，14B 缓冲偏紧；技巧 96 建议内存不足时关闭其他大型软件或选更小版本（PDF 第 293 页）。选择顺序：先确认显存余量，再定版本号。<\/p>\n<h3>算例 5：反例——低配机器跑 70B<\/h3>\n<p>70B 纯权重 INT4 估算约 35GB，普通消费级显存与内存无法承载。推导：下载阶段文件可放入大 SSD，但载入显存与内存阶段失败；技巧 92 的门槛判断（RTX 3090 级别）正是把这类版本排除在个人部署范围外（PDF 第 282 页）。<\/p>\n<h3>算例 6：反例——跳过需求判断先装环境<\/h3>\n<p>为“尝试新技术”安装本地模型，日常仍用在线问答。推导：硬件投入、命令维护、版本更新成本持续发生，任务产出不回收这些成本；技巧 92 要求先问自己是否真的需要这辆“豪华跑车”（PDF 第 283 页）。<\/p>\n<h2>补充推演：本地部署与在线 API 的取舍对照<\/h2>\n<p>从四个维度对照两条路线：<\/p>\n<ul><li>\n数据：本地部署交互记录留在自建环境；在线 API 数据经过服务商。\n<\/li><li>\n成本：本地前期硬件投入加运维，长期边际成本低；在线按调用付费，前期投入小。\n<\/li><li>\n稳定性：本地可做冗余架构与更新管控；在线依赖服务商可用性与并发能力。\n<\/li><li>\n门槛：本地需要技术基础与硬件核对；在线注册即可使用。\n<p>技巧 92 与 94 的结论合起来：普通轻量需求选在线；敏感数据、合规隔离、高连续性业务评估本地（PDF 第 282、286 页）。取舍不看技术时髦度，看风险与成本谁高。<\/p>\n<\/ul>\n<h2>补充推演：部署后的常见故障与对应环节<\/h2>\n<p>技巧 96、97 记录的故障点可按环节归类：<\/p>\n<ul><li>\n下载慢：模型仓库带宽问题，可换国内镜像（PDF 第 293 页）。\n<\/li><li>\n连接失败：检查 API 地址与模型服务是否启动。\n<\/li><li>\n双击图标无反应：Ollama 已启动但模型服务未运行，需在命令行执行 <code>ollama run<\/code>（PDF 第 294 页）。\n<\/li><li>\n内存不足：关闭大型软件或选更小版本。\n<\/li><li>\nWeb UI 无响应：先确认模型服务在 11434 端口正常运行，再查扩展加载（PDF 第 296 页）。\n<p>故障定位顺序：模型进程 → 端口响应 → 扩展配置 → 资源占用；跳过进程检查直接改界面配置，问题仍在底层。<\/p>\n<\/ul>\n<h2>边界补充：估算口径与实际配置的差距<\/h2>\n<p>容量估算只覆盖权重部分，实际占用随上下文长度、推理框架、缓存策略变化；本书未给出各版本在具体显卡上的实测帧率，不据估算承诺运行速度。选型时以官方硬件说明与本机实测为准，估算式用于排除明显不匹配的版本，不替代压测。<\/p>\n<h2>机制拆解：部署条件由哪些部件占用决定<\/h2>\n<p>【机制解释】权重载入：模型参数必须先从磁盘读入内存或显存才能参与推理；权重装不进可用内存，进程无法启动，与推理快慢无关。 【机制解释】量化压缩：把权重从 fp16（每参数 2 字节）压到 int4（每参数 4 比特，即 0.5 字节），容量约降到四分之一；压缩减少容量，但会损失部分精度，具体质量损失随模型与任务变化。 【机制解释】KV cache 与运行时开销：除权重外，上下文越长、并发越多，推理过程中缓存占用越大；纯权重估算偏低，实际需求要留余量。 【经验推断】本书建议 14B 搭配 16GB 以上内存与 RTX 40 系列显卡（PDF 第 287 页）；该配置为经验区间，具体帧率与可跑上下文需以本机实测为准。<\/p>\n<h2>算例 6：7B 模型两种量化精度的显存估算（可复核）<\/h2>\n<p>设模型参数量 <span class=\"katex-inline\">P=7\\times10^9<\/span>。<\/p>\n<ul><li>\nfp16（每参数 2 字节）：<span class=\"katex-inline\">V=P\\times b=7\\times10^9\\times2=14\\times10^9<\/span> 字节 <span class=\"katex-inline\">\\approx 14.0<\/span> GB（约 13.1 GiB）纯权重。\n<\/li><li>\nint4（每参数 4 比特 = 0.5 字节）：<span class=\"katex-inline\">V=7\\times10^9\\times0.5=3.5\\times10^9<\/span> 字节 <span class=\"katex-inline\">\\approx 3.5<\/span> GB 纯权重。\n<p>复核对照：int4 纯权重约为 fp16 的四分之一；但两者都还要加上 KV cache、框架运行时与上下文占用，可用显存需高于纯权重估算。若只有 8GB 显存，fp16 的 7B 纯权重已超出容量，无法直接载入；int4 权重可放下，长上下文是否仍有余量需实测。对照技巧 95 的 14B 建议配置（PDF 第 287 页）：14B int4 纯权重约 <span class=\"katex-inline\">14\\times10^9\\times0.5=7.0<\/span> GB，加上缓存与系统占用后对应到 16GB 内存建议，差额即运行时开销。<\/p>\n<\/ul>\n<h2>常见误读补充<\/h2>\n<ul><li>\n误读：本地部署一定更安全。反例：数据不出本机是前提，但若本机无权限管控、模型文件来源不明或端口暴露公网，风险反而增加；安全取决于本机环境与访问控制，不是“装在本地”本身。\n<\/li><li>\n误读：显存够装权重就能跑。反例：权重之外还有 KV cache 与框架开销；只按权重预留显存，长上下文时仍可能内存不足。\n<\/li><li>\n误读：本地模型与云端版本效果完全一致。反例：本地常跑量化小版本，能力与云端大模型有差距；选型先确认版本与量化精度，再按本机硬件裁配置。\n<\/ul>\n<h2>自检问题<\/h2>\n<ol><li>\n权重容量估算式中 <span class=\"katex-inline\">P<\/span> 与 <span class=\"katex-inline\">b<\/span> 各指什么？量化精度在容量与质量之间如何权衡？\n<\/li><li>\n14B 按 INT4 估算纯权重多少 GB？与技巧 95 的 16GB 内存建议差额去了哪里？\n<\/li><li>\n内存、显存、SSD 分别承担什么角色？哪个不足会导致模型无法载入 GPU？\n<\/li><li>\n本地部署后为什么首次下载模型仍需要网络？端口与防火墙配置管什么？\n<\/li><li>\n什么样的需求不值得本地部署？决策顺序应先判断什么？更新主动权对应什么维护责任？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "本地部署：动机、硬件条件与流程"}, "c10": {"html": "<div class=\"source-badge\">📖 出处：DeepSeek使用秘笈：从入门到精通的100个实用技巧 · p.301<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">核验、合规与定制知识库（RAG 雏形）<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">本地部署：动机、硬件条件与流程<\/a><\/span><\/div><h1>智能体：构造要素与四步搭建流程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书第 11 章）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>智能体是在通用大模型之上固定配置角色、知识库、对话风格、工作流程，并持续用新案例迭代的专用助手。它不训练新模型，而是把临时对话中反复交代的身份、资料、流程与风格沉淀成固定配置；搭建四步为获取模型 API、配置模型、部署嵌入模型、上传知识库并创建智能体。<\/p>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>通用助手处理专业场景时存在“均码尴尬”：要法律文书助手，得到笼统建议；要电商客服机器人，回答带着学术腔调（技巧 98，PDF 第 301 页）。困难在于：每次对话重新交代背景与流程，既费时间，口径也不稳定。智能体把这些配置固定下来，同类任务直接调用；技巧 98 定位其本质是把专业经验变成可复制的数字资产（PDF 第 303 页）。<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n<strong>角色定位<\/strong>：身份馅料 + 禁忌清单 + 任务面包。例：5 年经验宠物店金牌客服，擅长安抚焦虑主人；禁忌是不推荐未经认证药品、避免兽医术语；任务是处理绝育后护理咨询（技巧 98，PDF 第 301 页）。\n<\/li><li>\n<strong>知识库投喂<\/strong>：常见问题整理成 Q&amp;A 格式入库，如“客户问疫苗为什么贵，重点解释冷链运输成本与抗体检测流程”（PDF 第 301 页）。\n<\/li><li>\n<strong>对话风格调教<\/strong>：指定应答顺序、语气与称呼；法律智能体训练成“先法条后大白话”（PDF 第 302 页）。\n<\/li><li>\n<strong>工作流程串烧<\/strong>：把重复任务固化成流水线。合同审核智能体：收到需求 → 提取关键条款 → 比对最新劳动法 → 标记风险点 → 生成修改建议（PDF 第 302 页）。\n<\/li><li>\n<strong>迭代升级<\/strong>：每周补喂特殊案例与改进样本；客服智能体投喂上百个差评案例后能处理偏门投诉（PDF 第 302 页）。\n<\/li><li>\n<strong>四步搭建<\/strong>（技巧 100，PDF 第 306–313 页）：第一步在硅基流动注册、新建 API 密钥、找到 deepseek-ai/DeepSeek-R1；第二步在 Cherry Studio 填密钥、添加模型 ID 完成认证；第三步选嵌入模型 BAAI/bge-m3；第四步按文件、目录、网页抓取、站点地图、笔记五种方式上传知识库，测试检索后创建智能体并绑定知识库。\n<\/ul>\n<p>正例：合同审核智能体，上传合同后按固定五步流程出审核意见。反例：只写“你是客服专家”，不配知识库、流程与案例，每次仍临场发挥，与临时对话无差别。<\/p>\n<h2>原理推导<\/h2>\n<p>第一步，通用模型每次应答都基于当前上下文；智能体把上下文里的固定部分抽成配置，省去每轮重复交代。 第二步，角色与禁忌限定应答边界；知识库提供内部依据；风格固定表达方式；流程固定动作顺序；迭代补充新案例。五要素各管一段，缺一项退化成普通对话。 第三步，搭建流程对应技术部件：API 密钥接通模型服务；模型 ID 完成认证；嵌入模型把文档转成可检索向量；知识库提供检索片段；智能体配置把角色、提示词与知识库绑定。 第四步，迭代机制保证口径随业务更新。新案例进入后，应答样本库扩充；长期不投喂，智能体对新情况的覆盖下降。 第五步，推出与概念 c07、c09 的关系：知识库是智能体的依据来源；模型可以跑在本地部署上，也可以走云端 API；智能体是配置层，不改变底座模型能力上限。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：任务重复出现；有固定角色口径与常见问题；内部资料可整理入库；能持续收集案例迭代。\n<\/li><li>\n条件去掉会怎样：不配知识库 → 回答缺内部依据；不配流程 → 每次动作顺序不同；不配风格 → 语气口径漂移；不迭代 → 新案例覆盖不足。\n<\/li><li>\n失败案例：技巧 100 的三类自救问题：识别失败检查文档格式；回答错乱用精确关键词缩小检索；内容缺失改用站点地图抓取（PDF 第 313 页）。\n<\/li><li>\n边界：智能体不生成新模型；底座能力上限由模型决定。配置中的角色与流程不能替代人工审核，专业结论仍需核验（概念 c07）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>智能体 vs 临时提示词<\/strong>：临时提示词只在当前会话生效；智能体把角色、资料、流程、风格持久化配置，跨会话复用。\n<\/li><li>\n<strong>智能体 vs 知识库<\/strong>：知识库是资料检索部件；智能体是在模型 + 知识库之上再加角色、风格、流程配置。\n<\/li><li>\n<strong>智能体 vs 本地部署<\/strong>：部署是模型运行位置；智能体是应用层配置。本地模型可挂智能体，云端 API 也可挂智能体。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c07 知识库与核验、概念 c09 部署选项。后继：无；智能体是本书技术线的收口形态。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[模型: API 或本地部署] --&gt; E[智能体]\nB[嵌入模型+知识库] --&gt; E\nC[角色定位+禁忌清单] --&gt; E\nD[风格+流程+案例迭代] --&gt; E\nE --&gt; F[专用应答: 同类任务直接调用]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>技巧 98（PDF 第 301 页）<\/td><td>五个训练动作<\/td><td>角色、知识库、风格、流程、迭代<\/td><\/tr><tr><td>技巧 99（PDF 第 303 页）<\/td><td>成本与组装<\/td><td>模块化分工、可插拔组件、弹性扩容<\/td><\/tr><tr><td>技巧 100（PDF 第 305 页）<\/td><td>四步搭建<\/td><td>取 API、配模型、配嵌入模型、传知识库创建智能体<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>相关概念<\/h2>\n<p>核验合规与知识库、本地部署<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（智能体：构造要素与四步搭建流程）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：智能体五要素的作用机制与搭建流程推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>往回追前提：<\/p>\n<ol><li>\n模型本身无状态，每次应答基于当前上下文；专用口径若不固化，每轮都要重复交代。\n<\/li><li>\n专用助手需要四类固定信息：身份边界、内部依据、表达风格、动作流程；再加一类持续更新信息：新案例。\n<\/li><li>\n内部依据要可检索，需要嵌入模型把文档转成向量表示，见概念 c07 检索回路。\n<\/li><li>\n智能体是配置层产品：底座模型决定能力上限，配置决定专用场景内的稳定性与一致性。\n<\/ol>\n<p>依赖链方向：临时对话重复交代 → 固定信息抽成配置 → 五要素分工 → 技术部件对接 → 持续迭代。缺任一要素，智能体退回普通对话；五要素齐全，同类任务才可能稳定复用。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：推导角色定位为什么要分三层<\/h3>\n<p>技巧 98 的角色三明治（PDF 第 301 页）：<\/p>\n<ul><li>\n身份馅料：“5 年经验宠物店金牌客服，擅长安抚焦虑主人，常用表情包和萌宠段子。”\n<\/li><li>\n禁忌清单：“绝不推荐未经 FDA 认证药品，避免专业兽医术语。”\n<\/li><li>\n任务面包：“处理猫咪绝育后护理咨询。”\n<p>推导：身份层决定立场与语气，禁忌层划定不能越过的分支，任务层限定当前工作范围。三层合起来对应提示词四要素中的背景、约束与需求；只给身份不给禁忌，专业边界缺失；只给任务不给身份，语气口径不稳。<\/p>\n<\/ul>\n<h3>第二步：推导知识库投喂为什么用 Q&amp;A 格式<\/h3>\n<p>技巧 98：把常见问题整理成 Q&amp;A 喂养，例“客户问疫苗为什么贵，重点解释冷链运输成本和抗体检测流程”（PDF 第 301 页）。推导：Q&amp;A 同时携带问题表达与应答要点，检索命中问题后可直接参照要点组织回答；纯文档投喂需要模型自行提炼要点，偏差更大。知识库检索回路见概念 c07：切块、向量表示、相似片段进入上下文。<\/p>\n<h3>第三步：推导风格调教固定的是什么<\/h3>\n<p>技巧 98：“用沈阳话改写这句话”是方言风格样本；专家人设要求“先肯定问题有洞察力，再分三点解答”；法律智能体训练成“先法条后大白话”（PDF 第 302 页）。推导：风格配置固定应答顺序、称呼、语气与句式；没有风格配置，模型每次按默认口语组织，同类问题回答口径漂移。<\/p>\n<h3>第四步：推导流程串烧如何把重复工作变成流水线<\/h3>\n<p>合同审核智能体流程（PDF 第 302 页）：收到合同审阅需求 → 提取关键条款 → 比对最新劳动法 → 标记风险点 → 生成修改建议。推导：流程把任务分解（概念 c05）固化成固定顺序；之后上传合同说“帮我审核”，智能体按流程走，不需要每次重新拆解。流程步骤本身仍可迭代：发现某类风险常漏标，就把检查项补进流程。<\/p>\n<h3>第五步：推导迭代升级的必要性<\/h3>\n<p>技巧 98：每周补喂特殊案例，如托运死亡投诉的改进对话样本；电商客服智能体投喂上百个差评案例后，能优雅化解偏门投诉（PDF 第 302 页）。推导：初始配置只覆盖常见情况；新场景、新话术、新规范进入业务后，案例库不更新，智能体覆盖范围停滞。迭代是把人工处理过的优秀样本沉淀回配置层。<\/p>\n<h3>第六步：推导四步搭建对应的技术部件<\/h3>\n<p>技巧 100 流程（PDF 第 306–313 页）：<\/p>\n<ol><li>\n获取大模型：硅基流动注册，新建 API 密钥，模型广场找到 deepseek-ai/DeepSeek-R1。API 密钥是接口鉴权凭证。\n<\/li><li>\n配置模型：下载 Cherry Studio，在硅基流动模块填入密钥，添加模型 ID 完成认证。\n<\/li><li>\n部署嵌入模型：选 BAAI/bge-m3，把文档转成可检索向量。\n<\/li><li>\n上传知识库并创建智能体：五种上传方式（文件、目录、网页抓取、站点地图、笔记）；检索测试返回内容后，创建智能体，填名称、提示词，绑定知识库。\n<p>推导：第一、二步接通底座模型；第三步解决文档可检索；第四步把资料与角色配置绑定。五要素中，角色/风格/流程写进智能体提示词，知识库走第三步与第四步。<\/p>\n<\/ol>\n<h3>第七步：推导技巧 99 的模块化与成本视角<\/h3>\n<p>技巧 99：模块化分工让不同模块各司其职，升级只换特定零件；功能模块像积木可插拔组合；弹性架构按业务峰谷分配算力（PDF 第 303–304 页）。推导：智能体搭建也应把常用功能封装成可复用模块，新组合由现有模块拼装，不从零造轮子。<\/p>\n<h2>算例<\/h2>\n<h3>算例 1：宠物店客服智能体配置清单<\/h3>\n<ul><li>\n角色：5 年经验金牌客服，安抚焦虑主人，用表情包与萌宠段子。\n<\/li><li>\n禁忌：不推荐未经认证药品，不用兽医术语。\n<\/li><li>\n知识库：疫苗费用、绝育护理、用品推荐 Q&amp;A。\n<\/li><li>\n风格：先共情，再分点解答，结尾给安抚话术。\n<\/li><li>\n流程：接收咨询 → 匹配知识库要点 → 按风格应答 → 记录未覆盖问题。\n<\/li><li>\n迭代：每周补喂新遇到的投诉样本。\n<p>对照：缺知识库时，费用与护理要点只能凭通用知识回答；缺流程时，应答顺序随对话变化。<\/p>\n<\/ul>\n<h3>算例 2：四步搭建中的检索测试<\/h3>\n<p>知识库上传后点“搜索知识库”，输入相关关键词，观察是否返回内容（技巧 100，PDF 第 311 页）。推导：检索返回才说明切块与嵌入成功；无返回则检查文档格式与关键词，见三类自救问题（PDF 第 313 页）。检索不通时，后面创建的智能体没有依据可引。<\/p>\n<h3>算例 3：反例——只有角色头衔<\/h3>\n<p>只配置“你是资深客服专家”，无知识库、无流程、无案例。推导：角色头衔不提供内部依据与动作顺序；遇到具体投诉仍临场组织语言，与临时对话差别不大。技巧 98 记录的满意度提升来自流程固定与案例投喂，不是头衔本身（PDF 第 301–302 页）。<\/p>\n<h2>假设与边界<\/h2>\n<p>推导假设：底座模型通过 API 或本地部署稳定可用；模型未启动时，Web UI 与智能体都无法交互（技巧 97、100，PDF 第 296、307 页）。智能体配置不替代专业审核：合同、法律、医疗类输出仍需人工核验。API 密钥属于敏感凭证，不公开分享；知识库内容需定期更新，避免过期依据被检索到。<\/p>\n<h2>补充推演：五要素与提示词四要素的对应关系<\/h2>\n<p>把智能体配置拆开对照概念 c02 骨架：<\/p>\n<ul><li>\n角色定位 + 禁忌清单 → 背景与约束：身份立场与禁区固定下来。\n<\/li><li>\n任务面包 → 需求：当前服务的任务范围。\n<\/li><li>\n风格配置 → 格式：应答顺序、语气、称呼固定为出口形状。\n<\/li><li>\n知识库 → 上下文：内部依据跨会话复用。\n<\/li><li>\n工作流程 → 任务分解的固化版：动作顺序不再每次重拆。\n<p>推导：临时提示词里每轮重写的部分，在智能体中变成固定配置；迭代要素则对应反馈闭环，把新样本补回配置层。<\/p>\n<\/ul>\n<h2>补充推演：模块复用与组合<\/h2>\n<p>技巧 99 讲模块化分工与可插拔组装（PDF 第 303–304 页）。推导智能体搭建中的复用方式：常见功能封装成独立模块（FAQ 库、话术风格、审核流程），新智能体由现有模块拼装；升级某一模块只换该模块，不重建整条链路。模块贴功能标签后可跨项目调用，避免每个智能体从零收集案例。<\/p>\n<h2>常见误读对照<\/h2>\n<ul><li>\n误读：智能体是一个新训练出来的模型。本书流程中底座仍是 DeepSeek-R1，智能体只做配置与资料挂载；模型能力上限由底座决定，配置提升的是专用场景内的一致性。\n<\/li><li>\n误读：知识库绑定后智能体就懂公司业务。知识库提供检索片段，角色与流程决定如何使用片段；缺流程配置时，智能体仍按通用方式回答检索到的内容。\n<\/li><li>\n误读：搭建一次即可长期使用。业务术语、法规、常见投诉持续变化；案例库不更新，智能体对新情况的覆盖逐步落后，迭代要素不能省。\n<\/ul>\n<h2>补充算例<\/h2>\n<h3>算例 4：合同审核智能体要素清点<\/h3>\n<ul><li>\n角色：合同审核助手；禁忌：不直接出具法律意见，风险点标注“需法务复核”。\n<\/li><li>\n知识库：最新劳动法条文、公司合同模板、历史风险案例 Q&amp;A。\n<\/li><li>\n风格：先列条款摘要，再标风险等级，最后给修改建议。\n<\/li><li>\n流程：提取条款 → 比对法规 → 标记风险 → 生成建议（技巧 98，PDF 第 302 页）。\n<\/li><li>\n迭代：每周补新出现的纠纷案例与改进样本。\n<p>对照缺项：无知识库时法规比对无依据；无流程时条款摘要与风险标记顺序混乱。<\/p>\n<\/ul>\n<h3>算例 5：反例——检索不通就创建智能体<\/h3>\n<p>知识库上传后未做检索测试，直接创建智能体。推导：嵌入切块或格式有问题时检索无返回，智能体绑定了空知识库，回答退回通用水平；技巧 100 要求先点“搜索知识库”确认返回内容（PDF 第 311 页），检索通过再进创建步骤。<\/p>\n<h2>补充推演：智能体与知识库、部署的组合位置<\/h2>\n<p>三者分层清晰：部署决定模型跑在哪里（本地或云端 API）；知识库决定依据从哪里检索；智能体决定专用口径与流程。概念 c07 的检索回路为智能体供料，概念 c09 的部署方案为智能体提供运行环境。同一套智能体配置可以挂在本地模型上处理敏感业务，也可以挂在云端 API 上降低硬件投入；配置层不随部署位置改变。<\/p>\n<h2>补充对照：本书智能体技巧的归位<\/h2>\n<p>技巧 98 给五个训练动作（PDF 第 301 页）；技巧 99 讲模块化、可插拔与弹性扩容（PDF 第 303 页）；技巧 100 给四步搭建流程与嵌入模型选型（PDF 第 305 页）。五要素回答“配什么”，模块复用回答“怎么拼”，四步流程回答“怎么落地”；三者从设计到实施逐层对应。<\/p>\n<h2>机制拆解：五要素拼接后与普通对话差在哪<\/h2>\n<p>【机制解释】角色与口径：智能体把岗位身份、术语口径与表达边界固化进系统设定，每次对话自动带上，不必逐轮重述；普通对话的身份只存在于当前轮提示词里。 【机制解释】知识与流程：知识库为专用问题提供依据片段，流程设定规定处理步骤；两者配合后，回答沿固定回路产出，而不是每次临场组织。 【机制解释】迭代回路：新案例与改进样本持续投喂，Q&amp;A 与规则随之更新；不迭代的智能体会停留在初始口径，随业务变化逐渐脱节。 【经验推断】模块化、可插拔的智能体便于复用与扩容（技巧 99，PDF 第 303 页）；拆分粒度按业务边界定，过早模块化会增加拼接成本。<\/p>\n<h2>算例 6：合同审查任务，普通对话与智能体配置对照（可复核）<\/h2>\n<p>任务：审查一份供货合同条款风险。 提示词 A（普通对话）：<\/p>\n<pre><code>帮我看看这份合同有没有风险。<\/code><\/pre>\n<p>预期输出落点：模型凭通用法律常识给泛化提醒，不区分本公司常用条款口径，结论无内部依据可回溯；每换一份合同都要重新交代背景。 提示词 B（智能体配置）：<\/p>\n<pre><code>角色：企业法务辅助岗，只做条款风险初筛，不出具正式法律意见。\n知识库：本公司合同模板、历史纠纷案例、适用法规条文。\n流程：提取条款 → 比对库内规则 → 标记风险等级 → 给修改建议。\n口径：风险分高/中/低三档；不确定项标注“需法务确认”。<\/code><\/pre>\n<p>逐段对比：<\/p>\n<ul><li>\n依据段：B 比对库内条款与案例，A 凭通用常识。\n<\/li><li>\n流程段：B 按固定四步产出，顺序稳定；A 临场组织，每次结构不同。\n<\/li><li>\n边界段：B 标注需人工确认项，A 可能把初筛意见写成定论。\n<p>差异来源：B 把身份、依据、流程、边界固化为可复用配置；这些要素在 A 里逐轮口头交代，缺一项就退回普通对话。<\/p>\n<\/ul>\n<h2>常见误读补充<\/h2>\n<ul><li>\n误读：建完智能体就不用再维护。反例：业务规则、案例与法规更新后不投喂，智能体沿用旧口径；技巧 98 要求持续补新案例与改进样本（PDF 第 302 页）。\n<\/li><li>\n误读：智能体比普通对话“更聪明”。反例：智能体是专用口径与流程的封装，底座模型能力不变；配置缺失时它退回普通对话水平。\n<\/li><li>\n误读：挂上知识库就算智能体完成。反例：知识库只解决依据来源，角色、流程与口径未配齐时，回答仍缺专用流程；技巧 100 要求检索测试通过后再进创建步骤（PDF 第 311 页）。\n<\/ul>\n<h2>自检问题<\/h2>\n<ol><li>\n智能体五要素各管哪一段配置？缺哪一项会退回普通对话？\n<\/li><li>\n角色三明治三层分别对应提示词四要素的哪几项？\n<\/li><li>\nQ&amp;A 格式投喂比纯文档多携带了什么信息？\n<\/li><li>\n四步搭建流程分别接通哪些技术部件？哪一步先于智能体创建必须通过检索测试？\n<\/li><li>\n为什么智能体需要持续迭代？长期不投喂新案例会出现什么情况？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "智能体：构造要素与四步搭建流程"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：DeepSeek 是什么与提示词方法论<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1–3 章：DeepSeek 是什么 + 提示词方法论<\/a><br>检查点：能区分 V3、R1、联网搜索三种模式的适用任务，并用四要素改写一句模糊提问，解释上下文、少样本、角色设定、思维链各自起什么作用<\/li><li class='path-step' id='path-02'><strong>步骤 02：办公、创作、营销三类场景的提示词套路<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 4–6 章：办公、创作、营销三类场景的提示词套路<\/a><br>检查点：能把同一套四要素套到文档、表格、文案、营销分群等场景，说清核验、合规约束与定制知识库分别挡住哪类错误<\/li><li class='path-step' id='path-03'><strong>步骤 03：生活、学习与求职场景的迁移<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 8–9 章：生活、学习与求职场景（并入第 7 章行业技巧）<\/a><br>检查点：能把提示词骨架迁移到生活决策、学习计划、考试准备、职业规划与简历改写，并说明第 7 章行业技巧为什么只是同一骨架的垂直套用<\/li><li class='path-step' id='path-04'><strong>步骤 04：本地部署与智能体<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 10–11 章：本地部署与智能体<\/a><br>检查点：能说出本地部署解决的问题、硬件与软件条件、显存估算口径，以及智能体由角色、知识库、流程、风格、迭代五个要素组成<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='提示词（prompt）'>提示词（Prompt） — 发给 DeepSeek 的整段输入文字，包含背景、任务、约束与格式要求；模型每一轮都在这段文字基础上续写回答 <span class=glossary-ref>（第 1–3 章：DeepSeek 是什么 + 提示词方法论）<\/span><\/li><li data-term='深度思考模式（r1）'>深度思考模式（R1） — DeepSeek R1 深度思考模型，会先展开链式推理再给结论，适合复杂分析、决策与推理任务（原书技巧 2、4，PDF 第 19、24 页） <span class=glossary-ref>（第 1–3 章：DeepSeek 是什么 + 提示词方法论）<\/span><\/li><li data-term='联网搜索模式'>联网搜索模式 — 调用实时网络检索补充信息的模式，适合需要最新行情、新闻、评价等时效性资料的任务（原书技巧 5、6，PDF 第 27、30 页） <span class=glossary-ref>（第 1–3 章：DeepSeek 是什么 + 提示词方法论）<\/span><\/li><li data-term='上下文（context）'>上下文（Context） — 当前对话中模型能看到的全部信息：历史消息、附件、身份说明与知识库片段；每一轮回答都基于这段可见信息生成 <span class=glossary-ref>（第 1–3 章：DeepSeek 是什么 + 提示词方法论）<\/span><\/li><li data-term='少样本示例（few-shot）'>少样本示例（Few-shot） — 在提示词里给出一两个范例，让模型模仿其格式与风格；本书指出对 R1 这类强模型，范例有时会把输出锁死在模板上（原书技巧 16，PDF 第 58 页） <span class=glossary-ref>（第 1–3 章：DeepSeek 是什么 + 提示词方法论）<\/span><\/li><li data-term='角色设定'>角色设定 — 在提示词里指定模型扮演的身份，如“你是营销专家”；本书区分了它对弱模型的引导作用与对 R1 的束缚风险（原书技巧 17、31，PDF 第 60、102 页） <span class=glossary-ref>（第 1–3 章：DeepSeek 是什么 + 提示词方法论）<\/span><\/li><li data-term='思维链（chain-of-thought）'>思维链（Chain-of-Thought） — 模型把复杂问题拆成中间步骤、逐步推理后再给结论的过程；R1 会自动展开这一过程，用户也可以用提示词引导分步（原书技巧 13、28，PDF 第 48、93 页） <span class=glossary-ref>（第 1–3 章：DeepSeek 是什么 + 提示词方法论）<\/span><\/li><li data-term='任务分解'>任务分解 — 把一个大目标拆成主要任务、子任务、微任务，逐段给提示词并加入反馈调整的工作方法（原书技巧 28，PDF 第 93 页） <span class=glossary-ref>（第 1–3 章：DeepSeek 是什么 + 提示词方法论）<\/span><\/li><li data-term='知识库（定制化）'>知识库（定制化） — 把 PDF、Word、TXT 等文档投喂给系统，检索相关片段后再交给模型作答；本书技巧 43 描述了文档投喂、提问公式与权限分级（PDF 第 141 页） <span class=glossary-ref>（第 4–6 章：办公、创作、营销三类场景的提示词套路）<\/span><\/li><li data-term='幻觉（编造内容）'>幻觉（编造内容） — 模型把推测、套话包装成看似权威的事实输出；核验手段包括要求标注来源、区分已验证事实与合理推测、要求给计算逻辑（原书技巧 30，PDF 第 100 页） <span class=glossary-ref>（第 4–6 章：办公、创作、营销三类场景的提示词套路）<\/span><\/li><li data-term='本地部署'>本地部署 — 把模型权重下载到自己或企业的服务器上运行，数据不经过第三方云服务；本书技巧 92–97 讨论其动机、硬件软件网络条件与 Ollama 流程（PDF 第 282–294 页） <span class=glossary-ref>（第 10–11 章：本地部署与智能体）<\/span><\/li><li data-term='嵌入模型（embedding model）'>嵌入模型（Embedding Model） — 把文档文本转成向量数字表示、供相似度检索的模型；本书技巧 100 选用 BAAI/bge-m3 作为知识库的知识“翻译官”（PDF 第 310 页） <span class=glossary-ref>（第 10–11 章：本地部署与智能体）<\/span><\/li><li data-term='api 密钥'>API 密钥 — 调用云端模型接口时用于鉴权的一串字符；本书技巧 100 中在硅基流动平台新建密钥后填入 Cherry Studio（PDF 第 306–308 页） <span class=glossary-ref>（第 10–11 章：本地部署与智能体）<\/span><\/li><li data-term='智能体（agent）'>智能体（Agent） — 在通用模型之上配置固定角色、知识库、工作流程与应答风格、并持续迭代案例的专用助手；本书技巧 98–100 给出训练与搭建步骤（PDF 第 301–313 页） <span class=glossary-ref>（第 10–11 章：本地部署与智能体）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库<\/h1>\n<h2>模式 1：先选模式，再写提示词<\/h2>\n<p>接到任务先过三问：要快还是要深？要论证还是直接答案？资料是否需要实时来源？三问答完再决定 V3、R1 或联网搜索；提示词的详略随模式调整——R1 目标导向即可，V3 需要更明确的角色与结构。模式是运行路径，提示词是任务定义，两者不可互相替代。<\/p>\n<h2>模式 2：四要素逐项补坐标，缺哪项退回哪项默认值<\/h2>\n<p>写提示词前按背景、需求、约束、格式逐项检查。背景缺则按平均人群回答；需求缺则多动作混杂；约束缺则包含无关与风险分支；格式缺则产物不能直接用。每条信息先判断是否改变候选空间，不改变的多余描述不写。<\/p>\n<h2>模式 3：先展开可能性，再锁定路径<\/h2>\n<p>复杂任务不要第一轮就要终稿。先用开放式提问扩大问题空间，再用追问校准方向，最后给明确指令锁定路径；对应技巧 13 的三轮法。过早关闭可能性空间会错过模型发现的隐藏维度；问题笼统则先缩小对象、预算与指标再展开。<\/p>\n<h2>模式 4：大任务分层拆解，反馈对准具体层<\/h2>\n<p>把总体目标拆成主要任务、子任务、微任务，每层配独立提示词；上一层产物作为下一层上下文。发现偏差时对准出错层调整，不整篇重写。任务简单时不硬拆，避免交互成本超过收益。<\/p>\n<h2>模式 5：事实、规则、资料三层防线分开搭<\/h2>\n<p>核验分层（事实/共识/推测 + 来源计算逻辑）管事实；合规前置（法规与禁止项写进提示词）管规则；知识库（投喂、检索、溯源、更新）管内部资料。三层各管一段，不能互相替代；任何一层缺失，对应风险从那一层进来。<\/p>\n<h2>模式 6：场景迁移先归类型，再换约束清单<\/h2>\n<p>新任务先判产物类型：办公、创作、营销、生活、学习、求职、行业交付。骨架结构不变，替换各场景变量：办公补口径与结构，创作补风格与情绪路径，营销补人群标签，生活补偏好与限制，学习补水平与目标，行业补术语与法规。<\/p>\n<h2>模式 7：专用助手先沉淀五要素，再谈自动化<\/h2>\n<p>重复任务想做成智能体，按角色定位、知识库、风格、流程、迭代五要素清点：身份与禁忌是否固定，内部依据是否入库，表达口径是否一致，动作顺序是否固化，新案例是否定期补喂。只配角色头衔不构成智能体。<\/p>\n<h2>模式 8：部署决策先算需求与成本，再核对硬件<\/h2>\n<p>判断是否本地部署，先看数据敏感度、合规要求与业务连续性；再按参数量与量化字节估算容量，核对内存、显存、SSD；最后选软件与网络。普通在线需求不上本地部署；硬件不达标先换小版本，不硬跑大模型。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1–3 章 模式与方法论<\/strong>：V3/R1/联网选型 → 四要素（背景、需求、约束、格式）→ 上下文与身份 → 示例与角色边界 → 思维链与任务分解（PDF 第 9–110 页）。\n<\/li><li>\n<strong>第 4–6 章 三类场景套路<\/strong>：办公重口径与结构，创作重风格与情绪路径，营销重人群标签与转化目标；核验、合规、知识库兜住事实与红线（PDF 第 111–201 页）。\n<\/li><li>\n<strong>第 8–9 章 生活学习求职<\/strong>：同一骨架迁移到私人决策；并入第 7 章行业垂直套用；专业边界由人负责（PDF 第 202–280 页）。\n<\/li><li>\n<strong>第 10–11 章 部署与智能体<\/strong>：本地部署过硬件/软件/网络三关；智能体五要素（角色、知识库、风格、流程、迭代）加四步搭建（PDF 第 281–313 页）。\n<\/ul>\n<h2>模式选型速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>任务特征<\/th><th>模式<\/th><th>依据<\/th><\/tr><\/thead><tbody><tr><td>快问快答、轻量文书、即时翻译<\/td><td>V3<\/td><td>技巧 2、3，PDF 第 19、21 页<\/td><\/tr><tr><td>复杂决策、深度分析、需要推理链条<\/td><td>R1<\/td><td>技巧 2、4、10，PDF 第 19、24、41 页<\/td><\/tr><tr><td>最新行情、新闻、评价、政策<\/td><td>联网搜索<\/td><td>技巧 5、6，PDF 第 27、30 页<\/td><\/tr><tr><td>先检索材料 → 再深度分析 → 后生成成品<\/td><td>三模式组合<\/td><td>技巧 2，PDF 第 21 页<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>提示词四要素<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>要素<\/th><th>回答的问题<\/th><th>本书依据<\/th><\/tr><\/thead><tbody><tr><td>背景<\/td><td>为谁、什么处境、什么水平<\/td><td>技巧 9、14，PDF 第 39、51 页<\/td><\/tr><tr><td>需求<\/td><td>做什么动作、对象是什么<\/td><td>技巧 19，PDF 第 67 页<\/td><\/tr><tr><td>约束<\/td><td>排除什么、预算与红线<\/td><td>技巧 9、29，PDF 第 39、99 页<\/td><\/tr><tr><td>格式<\/td><td>表格/分点/字数/受众语气<\/td><td>技巧 19、43，PDF 第 67、148 页<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>关键技巧页码<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>技巧<\/th><th>主题<\/th><th>PDF 页<\/th><\/tr><\/thead><tbody><tr><td>技巧 9<\/td><td>万能公式：背景+需求+约束<\/td><td>39<\/td><\/tr><tr><td>技巧 13<\/td><td>启发思考→校准调整→锁定路径<\/td><td>48<\/td><\/tr><tr><td>技巧 14<\/td><td>知识定位三要素<\/td><td>51<\/td><\/tr><tr><td>技巧 16<\/td><td>减少案例样本<\/td><td>58<\/td><\/tr><tr><td>技巧 17<\/td><td>告别角色设定<\/td><td>60<\/td><\/tr><tr><td>技巧 19<\/td><td>四步拆解法<\/td><td>66<\/td><\/tr><tr><td>技巧 28<\/td><td>任务分解六步<\/td><td>93<\/td><\/tr><tr><td>技巧 29<\/td><td>信息合规<\/td><td>98<\/td><\/tr><tr><td>技巧 30<\/td><td>核验三招<\/td><td>100<\/td><\/tr><tr><td>技巧 31<\/td><td>身份植入、记忆传输、需求对齐<\/td><td>102<\/td><\/tr><tr><td>技巧 43<\/td><td>定制知识库<\/td><td>141<\/td><\/tr><tr><td>技巧 51<\/td><td>小红书黄金三角<\/td><td>168<\/td><\/tr><tr><td>技巧 58<\/td><td>画像、分群、个性推荐<\/td><td>189<\/td><\/tr><tr><td>技巧 85<\/td><td>个性化学习计划<\/td><td>262<\/td><\/tr><tr><td>技巧 88<\/td><td>职业规划三板斧<\/td><td>270<\/td><\/tr><tr><td>技巧 91<\/td><td>简历关键词与量化改写<\/td><td>278<\/td><\/tr><tr><td>技巧 95<\/td><td>部署硬件软件网络条件<\/td><td>287<\/td><\/tr><tr><td>技巧 96<\/td><td>Ollama 部署步骤<\/td><td>290<\/td><\/tr><tr><td>技巧 98<\/td><td>智能体五技巧<\/td><td>301<\/td><\/tr><tr><td>技巧 100<\/td><td>四步搭建私人智能顾问<\/td><td>305<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>概念辨析<\/h2>\n<ul><li>\n<strong>背景 vs 角色设定<\/strong>：背景补用户处境，角色设定改模型视角；前者不能删，后者看任务与模型。\n<\/li><li>\n<strong>附件 vs 知识库<\/strong>：单次上传 vs 跨会话可检索沉淀。\n<\/li><li>\n<strong>核验 vs 合规<\/strong>：核验对事实负责，合规对规则负责。\n<\/li><li>\n<strong>思维链 vs 任务分解<\/strong>：模型内部推理步骤 vs 用户外部任务层级。\n<\/li><li>\n<strong>本地部署 vs 智能体<\/strong>：模型运行位置 vs 应用层配置。\n<\/ul>\n<h2>反例库<\/h2>\n<ul><li>\n“帮我写个文案/做个方案”：四要素全缺，输出通用套话。\n<\/li><li>\n给 R1 塞范文套专家面具：创造力与视野被先验锁住（技巧 16、17）。\n<\/li><li>\n不核验直接采纳模型数字：编造剂量进入正式材料（技巧 30）。\n<\/li><li>\n先生成保健品话术再筛违规词：合规分支未在生成前删除（技巧 29）。\n<\/li><li>\n无敏感需求盲目本地部署：硬件投入与轻量任务不匹配（技巧 92）。\n<\/li><li>\n智能体只配角色头衔：缺知识库、流程与迭代，等于普通对话（技巧 98）。\n<\/ul>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/deepseek-101", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1–3 章：DeepSeek 是什么 + 提示词方法论", "href": "#/chapter/ch01"}, {"label": "第 4–6 章：办公、创作、营销三类场景的提示词套路", "href": "#/chapter/ch02"}, {"label": "第 8–9 章：生活、学习与求职场景（并入第 7 章行业技巧）", "href": "#/chapter/ch03"}, {"label": "第 10–11 章：本地部署与智能体", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "三种模式与任务选型：V3、R1、联网搜索", "href": "#/concept/c01"}, {"label": "提示词四要素：背景、需求、约束、输出格式", "href": "#/concept/c02"}, {"label": "上下文、身份与记忆传输", "href": "#/concept/c03"}, {"label": "少样本示例与角色设定的边界", "href": "#/concept/c04"}, {"label": "思维链、分步对话与任务分解", "href": "#/concept/c05"}, {"label": "场景化提示词套路：办公、创作、营销", "href": "#/concept/c06"}, {"label": "核验、合规与定制知识库（RAG 雏形）", "href": "#/concept/c07"}, {"label": "生活、学习与求职场景中的提示词迁移", "href": "#/concept/c08"}, {"label": "本地部署：动机、硬件条件与流程", "href": "#/concept/c09"}, {"label": "智能体：构造要素与四步搭建流程", "href": "#/concept/c10"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1–3 章：DeepSeek 是什么 + 提示词方法论", "href": "#/quiz/ch01"}, {"label": "测验：第 4–6 章：办公、创作、营销三类场景的提示词套路", "href": "#/quiz/ch02"}, {"label": "测验：第 8–9 章：生活、学习与求职场景（并入第 7 章行业技巧）", "href": "#/quiz/ch03"}, {"label": "测验：第 10–11 章：本地部署与智能体", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：DeepSeek使用秘笈：从入门到精通的100个实用技巧 · p.9<\/div><h1>第 1–3 章：DeepSeek 是什么 + 提示词方法论<\/h1>\n<blockquote>对应原书第 1 章《基本认知和工具使用》、第 2 章《DeepSeek提示词使用指南》、第 3 章《DeepSeek提示词使用技巧》（PDF 第 9–110 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n分清 DeepSeek V3、R1 深度思考、联网搜索三种模式分别适合什么任务，说清选错模式会付出什么代价；\n<\/li><li>\n用“背景 + 需求 + 约束 + 输出格式”四要素拆解一句模糊提问，并解释每个要素为什么能改变输出；\n<\/li><li>\n说清上下文、身份注入、少样本示例、角色设定、思维链与任务分解各自解决什么困难、在什么条件下反而有害；\n<\/li><li>\n把原书第 1–3 章的二十多个技巧归纳成一套可复用的提示词结构，而不是背 20 条零散说法。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>DeepSeek 是一个推理型大模型：它拿到输入后会像做数学题一样逐步拆分、思考，再续写回答；<strong>你写的提示词决定了它在多大范围内、按什么格式、依据什么背景来思考<\/strong>。本章讲的就是这件事的五个部件：模式选型、四要素、上下文、示例与角色、分步推演。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. DeepSeek 是什么，从哪里打开<\/h3>\n<p>本书把 DeepSeek 定位成一个日常可随时调用的 AI 助手：微信公众号网页端无须下载、手机 App 功能最全、电脑官网版适合办公场景（原书技巧 1，PDF 第 10 页）。首次使用只需手机号注册登录，历史记录可跨设备同步；界面上同时标注了“DeepSeek 可能不准确”，医疗、法律、金融等专业内容不构成诊疗、法律或投资建议（PDF 第 11 页）。<\/p>\n<p>这里要先建立一个底层认识：DeepSeek 是<strong>推理型大模型<\/strong>，不像早期指令型模型那样需要非常复杂的结构化指令，它会自己对问题做一步步拆分和思考（原书技巧 9，PDF 第 39 页）。这个认识决定了本章后面所有方法的方向：提示词的任务不是“教模型怎么思考”，而是“给模型划清思考的范围、背景和出口形状”。<\/p>\n<h3>2. 概念 1：三种模式与任务选型（难度：基础）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。原书技巧 2 把三种模式比作三位助手：反应快的 V3“闪电侠”、爱钻牛角尖的 R1“老中医”、神通广大的联网搜索“情报员”（PDF 第 19 页）。晨会资料整理、轻量文书、即时翻译这类高频小任务交给 V3；复杂决策、深度分析、需要推理链条的任务交给 R1；需要最新行情、新闻、评价的任务开联网搜索（PDF 第 20–21 页）。<\/p>\n<h3>3. 概念 2：提示词四要素——背景、需求、约束、输出格式（难度：基础）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。原书技巧 9 给出的万能公式是“背景 + 需求 + 约束条件（可选）”（PDF 第 39 页）；本书在精讲时把“输出格式”单列成第四个要素，因为不交代出口形状时，模型只能猜你要段落还是表格、要多长、面向谁。四要素合起来做的事情是同一件：<strong>缩小模型的候选回答空间<\/strong>。<\/p>\n<h3>4. 概念 3：上下文、身份与记忆传输（难度：基础）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。模型本身不知道你的处境、水平和已有资料。原书技巧 14 要求从知识段位、知识库存、跨界储备三方面交代自己的位置（PDF 第 51–53 页）；技巧 31 把职场场景下的做法总结成身份植入、记忆传输、需求对齐三步（PDF 第 102–104 页）。这些动作都属于“往上下文里喂信息”。<\/p>\n<h3>5. 概念 4：少样本示例与角色设定的边界（难度：进阶）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。旧教程喜欢在提示词里塞范文、指定“你现在是某专家”。原书技巧 16 指出，给强模型塞案例样本可能让它把案例当成标准答案模板，创造力被锁住（PDF 第 58 页）；技巧 17 指出对 R1 戴专业面具也可能蒙住它的视野，改成描述想要的效果反而更好（PDF 第 60–62 页）。但这两条不是说示例和角色一律删掉，而是要分清它们在什么任务上起作用、在什么任务上起反作用。<\/p>\n<h3>6. 概念 5：思维链、分步对话与任务分解（难度：进阶）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。原书技巧 13 给出“启发思考 → 校准调整 → 锁定路径”的三轮对话法（PDF 第 48–50 页）；技巧 28 把复杂任务拆成总体目标、主要任务、子任务、微任务，逐层配提示词并加反馈调整（PDF 第 93–96 页）。R1 会自动执行链式思考并展示推理过程，V3 通常不展示内部步骤（原书技巧 10，PDF 第 41 页）。<\/p>\n<h2>推导一：为什么“帮我写个文案”必然平庸<\/h2>\n<p>这是本章第一个完整推演，用来解释四要素背后的机制，不引用任何新术语。<\/p>\n<p>第一步，先明确模型拿到一句话时能看到什么。模型回答问题的方式是根据当前输入，续写概率上最合理的下一段文字。输入“帮我写个文案”时，输入里只有一个动作词“写”和一个模糊对象“文案”，没有受众、产品、场景、长度、风格、禁用词。<\/p>\n<p>第二步，看候选空间被留得有多大。“文案”可以是海报标语、公众号推文、短视频口播、商品详情页、邀请函；受众可以是老人、学生、白领；语气可以是正式、活泼、煽情。在背景为空的情况下，模型只能选分布最常见的那种组合——通用、正确、但谁用都不惊喜的套话。原书技巧 31 记录的翻车案例就是这种情况：只说“优化新品推广策略”，模型给出二十页报告，唯独没提到本月刚上架的竞品，因为它根本不知道有竞品这个信息（PDF 第 102 页）。<\/p>\n<p>第三步，看补上背景后候选空间如何收缩。原书技巧 9 的对照例子：只问“如何提高英语水平”，得到通用学习计划；补上“我家孩子上初三，英语基础中等，主要想提高考试成绩，口语已经非常不错，不需要考虑口语”后，回答才变成针对性的应试建议（PDF 第 39 页）。背景每补一条，满足条件的回答组合就少一批；约束和格式再各收一道，剩下的才是能用的方案。<\/p>\n<p>第四步，推出结论。平庸不是模型能力差，而是提问留给它的信息不足以区分好坏回答。四要素的作用是把“猜你想要什么”变成“按给定坐标生成”；缺少哪一要素，对应维度上的回答就回到通用默认值。<\/p>\n<h2>推导二：从任务三问推到模式选择<\/h2>\n<p>原书技巧 2 结尾给了三个选择题：需要灭火队还是智囊团？要标准答案还是创新方案？用历史经验还是实时情报？（PDF 第 21 页）下面把这三问逐步对应到三种模式。<\/p>\n<p>第一问“灭火队还是智囊团”区分任务响应速度要求。会议前十分钟要三组竞品对比数据、电话那头催方案框架，属于快速响应任务，对应 V3；需要把问题翻来覆去琢磨透的硬骨头，属于深度分析任务，对应 R1。<\/p>\n<p>第二问“标准答案还是创新方案”区分推理深度要求。V3 依赖下一个词的预测机制，通常不展示内部推理步骤，回答直接（原书技巧 10，PDF 第 41 页）；R1 能自动执行链式思考，给出逻辑清晰的推理过程，并有一定的自我事实核查机制（PDF 第 41、43 页）。需要逐条论证依据的任务交给 R1，只需要一句定义、一个译名、一段短文案的任务交给 V3。<\/p>\n<p>第三问“历史经验还是实时情报”区分信息时效要求。模型训练资料有截止时间，发布会、财报、餐厅评价、政策更新都可能超出它的记忆范围；需要时效性内容时开联网搜索，让检索结果进入当前对话（原书技巧 5、6，PDF 第 27、30 页）。<\/p>\n<p>把三问连起来：先按速度分 V3/R1，再按深度分 R1/V3，最后按时效决定是否叠加联网搜索。原书技巧 2 还记录了一个组合用法：先让情报员搜集最新数据，再让老中医深度分析，最后派闪电侠生成汇报材料（PDF 第 21 页）。这说明三种模式不是互斥单选，可以在一条工作流里先后调用。<\/p>\n<h2>反事实分析：改掉提示词的条件，回答会怎么变<\/h2>\n<p>下面三组反事实都来自原书记录的翻车与对照案例，逐条说明去掉某个条件后输出往哪里偏。<\/p>\n<ol><li>\n<strong>去掉输出格式约束<\/strong>。原书技巧 19 的案例：只说“做个旅游攻略”，AI 可能推荐 798 艺术区和密室逃脱，而用户的父母是六十岁退休教师（PDF 第 66 页）。补上效果预期“日均步行不超过 8000 步，包含文化类景点”和风险预警“避开需要长时间排队的场所”后，输出才变成含预约攻略、轮椅通道信息、午休安排的银发友好方案（PDF 第 68 页）。反事实推演：格式与约束被拿掉后，模型在“景点趣味性”这一最常见维度上自由发挥，老年友好维度直接缺席。\n<\/ol>\n<ol><li>\n<strong>去掉上下文与身份说明<\/strong>。原书技巧 14 对比了两种问法：直接问“解释什么是元宇宙”，得到学术定义；换成“我对科技概念的了解相当于《生活大爆炸》观众，知道 VR 和区块链，但分不清数字孪生和元宇宙的区别，请用美剧场景类比说明”，输出才落到熟悉的类比上（PDF 第 53 页）。反事实推演：模型不知道读者段位，只能按平均水平解释，小白读不懂、专家嫌啰嗦；隐藏段位、谎报军情、忽略关联这三类错误都会让解释错位（PDF 第 54 页）。\n<\/ol>\n<ol><li>\n<strong>把少样本示例换成错误示例，或用错误示例当模板<\/strong>。原书技巧 16 提醒，案例样本在弱模型上是“指南针”，在强模型上可能变成“绊脚石”：模型会把范例当成必须模仿的标准答案骨架（PDF 第 58 页）。反过来，如果塞进去的范例本身风格平庸、带有违规表述，模型会照抄这个骨架。反事实推演：范例质量直接决定输出的下限；没有把握时，用精准的目标描述加边界约束替代范例，比赌范例质量更稳。\n<\/ol>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章是后三章的底座。第 4–6 章的办公、创作、营销套路，只是四要素在不同工具与受众上的套用；第 8–9 章的生活、学习、求职场景，是同一套骨架在私人决策上的迁移；第 10–11 章的本地部署与智能体，则是把本章反复出现的“上下文、知识库、固定流程”沉淀成可复用系统。读后面章节时可以回头对照：每个场景技巧抽象出来，落回本章的哪一个概念。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为提示词越长越好。原书技巧 11 指出，对 R1 这类推理能力强的模型，冗长的分步指挥反而可能限制发挥，目标导向、说清任务即可（PDF 第 44–45 页）。\n<\/li><li>\n以为角色设定永远有用。技巧 17 的测试显示，戴上“资深分析师”面具后输出中规中矩，撤掉角色、直接要求“揭示未来三年最具破坏性的技术变革”，反而挖出被忽视的冷门方向（PDF 第 60–61 页）。\n<\/li><li>\n以为 R1 想得多就一定对。技巧 30 提醒，模型会把合理推测包装成权威表述，专业领域仍需核验（PDF 第 100 页），核验方法放在第 2 章概念 c07 展开。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n任务是“会议前十分钟整理三家竞品的一句话对比”，该选哪种模式？（答案：V3；理由：快速响应、不需要深度推理，技巧 2 的“闪电侠”定位，PDF 第 19 页。）\n<\/li><li>\n把“写一份健康饮食文案”按四要素补全：背景（受众 40 岁以上人群）、需求（选题—大纲—正文）、约束（不做医疗建议）、格式（分三段小标题）。（参考答案：见技巧 28 的健康饮食案例拆解，PDF 第 94–96 页。）\n<\/li><li>\n判断：给 R1 写提示词必须先写“你现在是某领域专家”。（答案：否；技巧 17 指出角色可能成为牢笼，直接描述效果与边界更稳妥，PDF 第 60–62 页。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三种模式：V3 快、R1 深、联网搜索新；可组合调用。\n<\/li><li>\n四要素：背景定位起点，需求锁定动作，约束排除雷区，格式规定出口形状。\n<\/li><li>\n上下文喂的是模型看不到的个人处境；身份、记忆、附件都属于上下文。\n<\/li><li>\n示例与角色是“引导先验”，不是必需品；强模型上过度使用会锁死输出。\n<\/li><li>\n复杂问题走思维链与任务分解：先展开可能性，再校准，最后锁定路径。\n<\/ul>", "ch02": "<div class=\"source-badge\">📖 出处：DeepSeek使用秘笈：从入门到精通的100个实用技巧 · p.111<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1–3 章：DeepSeek 是什么 + 提示词方法论<\/a><\/span><\/div><h1>第 4–6 章：办公、创作、营销三类场景的提示词套路<\/h1>\n<blockquote>对应原书第 4 章《使用DeepSeek办公的技巧》、第 5 章《使用DeepSeek创作内容的技巧》、第 6 章《使用DeepSeek做营销与洞察客户》（PDF 第 111–201 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1–3 章的四要素、上下文与任务分解\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出办公场景下 DeepSeek 与 Word、Excel、PPT、Xmind、Draw、飞书、微信等工具结合时，提示词各自要交代什么；\n<\/li><li>\n把创作类任务拆成语气调整、主题升华、风格模仿、结构解构、选题与脚本等可复用动作；\n<\/li><li>\n把营销类任务拆成画像、动态分群、个性化推荐、评论洞察、客服应答与需求翻译几个环节；\n<\/li><li>\n解释核验、合规约束与定制知识库分别挡住哪一类错误，在什么场景下必须前置使用。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>办公、创作、营销只是同一套提示词骨架的三种垂直套用：<strong>先把场景背景喂进上下文，再用四要素规定动作与格式，最后用核验与知识库把输出钉在真实资料上<\/strong>。本章不重复罗列工具清单，重点推演每类套路为什么这样设计。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 本章在全书依赖图中的位置<\/h3>\n<p>第 1 章建立了模式选型与四要素，本章把这套方法放进具体工作流。原书第 4 章覆盖 PPT、Word、Excel、WPS 灵犀、飞书、Xmind、Draw、微信与知识库（PDF 第 112–150 页）；第 5 章覆盖高情商表达、主题升华、风格模仿、公文解构、合规扫描、短视频与小红书选题脚本、公众号与批量出图（PDF 第 152–186 页）；第 6 章覆盖精准营销、广告投放、评论解读、客服应答与黑话翻译（PDF 第 189–200 页）。<\/p>\n<h3>2. 概念 6：场景化提示词套路——办公、创作、营销（难度：基础）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。三类场景共用同一个骨架：受众与背景 → 动作与产物 → 风格与约束 → 格式与长度；差别在于每类场景的高频约束不同：办公重结构与数据口径，创作重风格与情绪路径，营销重人群标签与转化目标。<\/p>\n<h3>3. 概念 7：核验、合规与定制知识库（RAG 雏形）（难度：进阶）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。模型可能把推测包装成事实（原书技巧 30，PDF 第 100 页）；医疗、金融、广告等领域有合规红线（技巧 29，PDF 第 98–99 页）；企业内部资料不在模型记忆里，需要投喂知识库（技巧 43，PDF 第 141–150 页）。这三件事分别对应输出前的核验、输出时的约束、回答依据的来源。<\/p>\n<h2>推导一：办公场景的工具集成为什么能省时间<\/h2>\n<p>办公类技巧表面上是“DeepSeek + 某软件”，机制上要分两层推演。<\/p>\n<p>第一层，工具插件解决的是上下文搬运。以 Word 为例：原书技巧 35 描述的流程是在 Word 信任中心启用宏设置，加载 OfficeAI 助手插件，在大模型设置里开启本地部署模式并粘贴 API 密钥，选中文档后按 Alt+Q 召唤助手续写或优化段落（PDF 第 115–119 页）。没有插件时，人要自己把文档段落复制进对话框，再把生成结果贴回去；插件把“当前文档”自动放进上下文，省去的是搬运动作，不是思考动作。<\/p>\n<p>第二层，提示词承担任务定义。技巧 35 给的示范输入是“从市场规模、技术瓶颈、政策支持三个维度，分析 2024 年预制菜行业发展趋势”（PDF 第 120 页）。这句话里，“三个维度”是约束与结构，“2024 年预制菜行业”是背景与对象，“分析趋势”是需求；格式上要求分点论述。对照第 1 章推演一：背景为空时模型回到通用套话，办公场景最容易出现的偏差就是“段落优化把口语改成术语，但数据口径没人核”。<\/p>\n<p>再看表格类任务。技巧 36、37 处理 Excel 数据分析：把表格数据交给模型后，要在提示词里说明指标口径、时间范围、对比维度，模型才能做清洗、统计与结论提炼（PDF 第 121–129 页）。推演到此可以推出一条办公通用原则：<strong>插件负责把文档数据送进上下文，提示词负责说明口径与产物形状，核验环节负责拦住算错和编造的数据<\/strong>。思维导图（技巧 40，Xmind，PDF 第 134 页）、流程图（技巧 41，Draw，PDF 第 137 页）走同一套集成机制：先给主题与层级要求，再让模型生成结构，最后人工核对分支是否遗漏。<\/p>\n<h2>推导二：创作与营销套路的分解机制<\/h2>\n<p>创作类任务看似依赖灵感，拆开后每一步都对应一个可写进提示词的动作。<\/p>\n<p>语气调整：技巧 44 处理“把硬话变软”，机制是给定原句、目标关系与语气边界，让模型在保留意思的前提下更换措辞（PDF 第 152 页）。主题升华：技巧 45 要求在原文事实之上提炼立意，而不是凭空拔高；提示词需要交代原文素材与读者对象（PDF 第 154 页）。风格模仿：技巧 46 让模型学习指定作者或账号的表达习惯，输入里要给风格线索（用词、句式、人称），而不是只说“写得像某某”（PDF 第 156 页）。结构解构：技巧 47 把公文拆成核心内容与底层逻辑，输入是原文，输出是要点列表与框架（PDF 第 159 页）。选题与脚本：技巧 49、50、52 先确定选题方向与爆款要素，再生成分镜或脚本（PDF 第 165、167、171 页）。<\/p>\n<p>营销类任务的推演链条更长。技巧 58 分三步：当好数据侦探拼用户画像，按行为变化动态分群，再按人群特征做个性化推荐（PDF 第 189–191 页）。第一步需要把 CRM、小程序订单、到店频次等数据作为附件喂入上下文；第二步在提示词里给出分群规则，例如“近 30 天买过美式、运动类 App 每周使用超 5 小时”；第三步按价格敏感型、品质型、社交型分别包装话术（PDF 第 191 页）。技巧 60 处理评论洪流：把评论文本交给模型归类情绪、提炼投诉点与需求点（PDF 第 195 页）；技巧 61 配置客服应答，需要把常见问题与应答边界固定下来（PDF 第 197 页）；技巧 62 把甲方黑话翻译成可执行的精准指令（PDF 第 199 页）。<\/p>\n<p>把两条链合起来看：创作套路控制的是“输出怎么说”，营销套路控制的是“对谁说、说什么”；两者的公共底座仍是第 1 章的四要素，只是约束清单从写作风格换成了人群标签与转化目标。<\/p>\n<h2>反事实分析：去掉核验、合规、知识库会怎样<\/h2>\n<ol><li>\n<strong>去掉核验环节，照单全收<\/strong>。技巧 30 记录了医疗市场部案例：模型宣称“国际医学会推荐每日摄入 2000mg 维生素 C”，而真实指南建议量约 100mg，要不是主管及时发现，错误指南就发到客户手里（PDF 第 100 页）。反事实推演：模型的训练目标是续写通顺文本，不是保证每条事实可查；没有“标注来源、区分已验证事实与合理推测、给计算逻辑”这类要求时，编出来的数字和套话会被同样通顺的语气包裹，读者难以从语气上分辨。\n<\/ol>\n<ol><li>\n<strong>去掉合规约束前置<\/strong>。技巧 29 记录：新人让模型生成面向中老年人的保健品话术，触发安全警告；反复要求写明星八卦爆料模板，账号功能被临时冻结（PDF 第 98 页）。反事实推演：合规要求若不在提示词里前置，模型会在常见营销话术库里自由组合，踩中广告法、未成年人保护、伦理红线的概率随自由度上升；前置一句“方案需符合广告法，不得包含虚假宣传”，相当于在候选空间里先划掉违规分支（PDF 第 99 页）。\n<\/ol>\n<ol><li>\n<strong>去掉知识库，只靠模型记忆<\/strong>。技巧 43 列出的痛点包括三年前合同补充条款找不到、记得论文数据却搜不出文件名、新员工反复问基础流程（PDF 第 142 页）。反事实推演：模型记忆里没有你公司的制度、合同、纪要；靠口述上下文每次都要重新喂一遍，且容易漏传版本。投喂知识库后，回答可以标注出处文档与页码（PDF 第 149 页），这是核验在企业内部资料上的落地方式。\n<\/ol>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章把第 1 章方法论接到工作产物上：办公产物求准确与结构，创作产物求风格与情绪路径，营销产物求人群匹配。第 3 章把同样的骨架搬到私人生活、学习与求职；第 4 章则把本章出现的知识库、固定应答流程沉淀成本地部署与智能体系统。读本章每个技巧时，建议先问：它补的是四要素里的哪一项？核验和知识库在其中挡了什么错？<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为装上插件就等于 AI 懂公司业务。插件只完成文档搬运，业务口径、指标定义、合规边界仍要在提示词或知识库里交代。\n<\/li><li>\n以为营销文案的差异来自模型“会不会写”。技巧 58 的案例显示，推荐是否精准取决于画像数据与分群规则喂得够不够，文案只是最后一环（PDF 第 189–191 页）。\n<\/li><li>\n以为知识库投喂一次就够。技巧 43 要求定期更新文档、剔除过期资料（PDF 第 147、150 页）；知识过期后，检索到的旧制度会把方案带偏。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n让模型分析 Excel 销售表，提示词里至少要交代哪三类信息？（答案：指标口径与时间范围、对比维度、输出格式；参照技巧 36、37，PDF 第 121–129 页。）\n<\/li><li>\n评论区有大量差评要归类，按营销三步应先做哪一步？（答案：先
