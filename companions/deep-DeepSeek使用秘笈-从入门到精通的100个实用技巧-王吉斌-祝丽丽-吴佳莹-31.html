把评论文本作为材料喂入上下文，再让模型按情绪与投诉点归类，技巧 60，PDF 第 195 页。）\n<\/li><li>\n判断：保健品宣传文案可以先生成，事后再筛违规词。（答案：否；合规要求应前置进提示词，技巧 29，PDF 第 98–99 页。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n办公：插件搬上下文，提示词定口径与格式，核验拦数据错误。\n<\/li><li>\n创作：语气、升华、模仿、解构、选题、脚本，每个动作对应一条可写清的提示词要求。\n<\/li><li>\n营销：画像 → 动态分群 → 个性化推荐；评论归类、客服边界、黑话翻译配套使用。\n<\/li><li>\n核验三招：划能力禁区、说明来源、用数据说话；合规前置；知识库按部门投喂并定期更新。\n<\/ul>", "ch03": "<div class=\"source-badge\">📖 出处：DeepSeek使用秘笈：从入门到精通的100个实用技巧 · p.227<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 4–6 章：办公、创作、营销三类场景的提示词套路<\/a><\/span><\/div><h1>第 8–9 章：生活、学习与求职场景（并入第 7 章行业技巧）<\/h1>\n<blockquote>对应原书第 8 章《DeepSeek在生活中的使用技巧》、第 9 章《DeepSeek在学习、成长与求职中的使用技巧》；并讲第 7 章《DeepSeek在七大行业中的使用技巧》作为垂直套用对照（PDF 第 202–280 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 4–6 章的场景套路与核验意识\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n把提示词骨架迁移到生活决策类任务：饮食、情绪疏导、选房选车、家务、造型、旅行、书单、祝福；\n<\/li><li>\n把同一骨架用到学习与求职：找逻辑漏洞、定学习计划、分析出题逻辑、执行监控、职业规划、学术辅助与简历改写；\n<\/li><li>\n说出第 7 章行业技巧（翻译、金融、交通、工程建筑、法律、教师、软件开发）与通用骨架之间的对应关系；\n<\/li><li>\n划清生活场景下 AI 建议的边界：哪些只是参考，哪些必须由专业人员确认。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>生活、学习、求职不是新方法，而是第 1 章骨架在个人决策上的迁移：<strong>把你的现状、偏好、限制条件和目标讲清楚，让模型列出选项、权衡与下一步；涉及专业判断与重大决策时，模型输出只作参考材料<\/strong>。第 7 章行业技巧则是同一骨架加上行业术语、法规与岗位约束后的垂直版本。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 8：生活、学习与求职场景中的提示词迁移（难度：基础）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。迁移要做的事是把通用四要素换成场景变量：生活场景的背景是个人偏好与客观限制，学习场景的背景是当前水平与目标岗位，求职场景的背景是真实经历与目标 JD。<\/p>\n<h3>2. 先看第 7 章：行业技巧为什么是骨架的垂直套用<\/h3>\n<p>原书第 7 章覆盖翻译（技巧 63，PDF 第 203 页）、金融（技巧 64，第 205 页）、智能交通（技巧 65，第 208 页）、工程建筑（技巧 66，第 210 页）、法律（技巧 67，第 212 页）、教师备课与批改（技巧 68、69，第 214、217 页）、软件开发协作与代码生成（技巧 70、71，第 219、221 页）。这些行业案例的共同结构是：行业背景与术语进上下文，任务动作进需求，法规/规范/教材大纲进约束，产物格式按岗位要求给出。差别只在约束清单不同：金融要合规口径，法律要法条边界，教学要贴合大纲与学情，开发要可运行代码与注释。<\/p>\n<p>把第 7 章并入本章讲，是为了避免把行业技巧误读成另一套全新方法；读行业案例时对照本章的迁移骨架，能看清哪些动作通用、哪些约束是行业专属。<\/p>\n<h2>推导一：生活决策类任务的提示词结构<\/h2>\n<p>生活类技巧在原书第 8 章集中出现：挑食娃营养餐（技巧 72，PDF 第 228 页）、情绪倾诉辅助（技巧 73，第 230 页）、选房顾问（技巧 74，第 235 页）、选车军师（技巧 75，第 237 页）、家务整理（技巧 76，第 241 页）、咖啡顾问（技巧 77，第 244 页）、造型师（技巧 78，第 246 页）、旅行管家（技巧 79，第 247 页）、随身教练（技巧 80，第 250 页）、荐书（技巧 81，第 252 页）、节日祝福（技巧 82，第 254 页）、花语（技巧 83，第 256 页）。<\/p>\n<p>逐步推演这类任务的提示词构造。<\/p>\n<p>第一步，背景变量是个人条件。选房要给预算、通勤、家庭结构、地段偏好；选车要给预算、用车场景、乘坐人数、燃油或新能源偏好；旅行要给同行人年龄、步行承受度、时间长度（对照技巧 19 的父母旅游案例，PDF 第 68 页）。缺少这些变量时，模型只能按平均人群给建议，就像技巧 14 里只说“制定减肥计划”却不给身高体重与运动基础，可能得到每天跑步 5 公里的方案，对体重基数大的人反而有膝关节损伤风险（PDF 第 52 页）。<\/p>\n<p>第二步，需求变量是决策类型。有的任务要选项清单（选房候选区域对比），有的要权衡表（车型优缺点），有的要方案流程（旅行日程、家务分工），有的要文案成品（祝福、花语）。需求类型写清后，输出格式才能跟着定：对比用表格，流程用时间线，文案给短句。<\/p>\n<p>第三步，约束变量是硬限制与边界。预算上限、忌口、过敏、不喜欢的风格、避开的地点，都属于约束；情绪疏导类还要加边界声明：模型是倾诉辅助，不替代心理咨询与医疗诊断（技巧 73 的定位，PDF 第 230 页）。<\/p>\n<p>推演到这里可以推出生活场景的通用提示词骨架：<strong>我的现状与偏好 → 我要做的决策类型 → 硬限制与禁忌 → 想要的产物形状<\/strong>。第 8 章每个技巧都能套回这个骨架，差别只在变量取值。<\/p>\n<h2>推导二：学习与求职任务的提示词结构<\/h2>\n<p>第 9 章的技巧分三组。学习认知组：思维纠偏器找逻辑漏洞（技巧 84，PDF 第 260 页）、个性化学习计划（技巧 85，第 262 页）、洞悉出题逻辑（技巧 86，第 264 页）、执行监控（技巧 87，第 266 页）。职业发展组：职业规划防坑（技巧 88，第 270 页）、学术互助（技巧 89，第 272 页）、文献处理（技巧 90，第 275 页）、简历改写（技巧 91，第 278 页）。<\/p>\n<p>先推演学习计划。技巧 85 的做法是上传简历、工作文档与岗位目标，让模型识别能力缺口、对照岗位能力模型排出提升清单，再整合学习资源并跟踪效果（PDF 第 262–264 页）。机制上，能力缺口只能靠“现状材料 + 目标要求”对比出来；只说“我想提升自己”，模型给的是通用课程清单。提示词要交代：现有水平（已掌握什么、卡在哪）、目标岗位或考试、可投入时间、偏好的学习方式。<\/p>\n<p>再推演职业规划。技巧 88 拆成目标拆解、信息整合、动态调整三步：把“三年成为 AI 产品专家”切成六个半年计划；用通俗语言解释行业变化；追问技能可迁移方向（PDF 第 270–271 页）。这里的推演要点是规划必须可执行：每个阶段要有学习目标、行动与产出成果；动态调整则要求定期把新的行业信息喂回上下文，而不是拿一份计划表用到底。<\/p>\n<p>最后推演简历改写。技巧 91 给三个动作：提取岗位 JD 的核心能力关键词；把工作经历按关键词重新包装并量化成果；按目标岗位调整表述（PDF 第 278–279 页）。机制上，简历是给 HR 与初筛系统看的定向文本，关键词与量化指标决定能否被匹配；案例中“负责公司日常行政工作”被改写为“优化采购流程，年度节约成本 18%；主导电子档案系统，查询效率提升 70%”（PDF 第 279 页）。技巧 91 同时划了红线：优化不等于造假，磨皮不能换头（PDF 第 280 页）。<\/p>\n<h2>反事实分析：去掉哪些条件会踩坑<\/h2>\n<ol><li>\n<strong>去掉个人条件，接受通用建议<\/strong>。选房只说“推荐北京景点/房子”，模型在交通便利、价格适中的平均维度上推荐，不会自动考虑腿脚不便、预算上限、通勤时长；技巧 19 把这种缺省称为“警惕默认假设：你以为的常识可能是 AI 的知识盲区”（PDF 第 69 页）。反事实推演：个人条件每缺一条，输出就往平均人群偏一步；偏到最后，建议正确但不可用。\n<\/ol>\n<ol><li>\n<strong>越过边界，把模型输出当专业结论<\/strong>。情绪、医疗、法律、金融类问题在第 1 章就有免责提示：专业领域内容不构成诊疗、法律或投资建议（PDF 第 11 页）。技巧 30 也要求在专业领域划定禁区，标注“需执业医师确认”一类边界（PDF 第 100 页）。反事实推演：去掉边界声明后，模型在缺乏依据时仍会给出通顺表述；用户若直接据此行动，风险由自己承担。生活场景中模型适合整理信息、列出选项、模拟问答，不适合替代专业判断。\n<\/ol>\n<ol><li>\n<strong>把简历优化做成经历造假<\/strong>。技巧 91 明确“优化≠造假”（PDF 第 280 页）。反事实推演：提示词若要求编造数据、虚构职位，模型可以生成通顺文本，但背调与面试环节会暴露；正确方向是把真实经历量化、换岗位匹配的表述，而不是添加不存在的事实。\n<\/ol>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章上承第 2 章的场景套路：办公面向同事与上级，创作面向读者，营销面向客户，本章面向的是你自己的生活与职业路径。下启第 4 章：本章反复出现的“固定角色、资料投喂、流程化应答、持续迭代案例”，正是第 11 章智能体的雏形；而本章涉及的敏感职业资料，是否需要脱离云端处理，则引出第 10 章本地部署的判断。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为生活技巧是“哄自己玩”。选房、选车、职业规划都涉及真实成本，提示词里的预算、限制条件缺一条，权衡结果就偏一分。\n<\/li><li>\n以为模型能记住你的长期情况。每一轮对话的上下文只存在于当前会话；跨会话需要重新交代身份与资料，或借助知识库（见概念 c07、c10）。\n<\/li><li>\n以为学术辅助可以直接代写。技巧 89、90 定位在互助与文献处理，观点与成文仍需本人负责；学术规范与查重要求不在模型默认约束内。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n为父母规划 7 日北京游，提示词至少要补哪三类个人条件？（答案：同行人年龄与身体条件、步行/时间承受度、文化偏好与预算；对照技巧 19，PDF 第 68 页。）\n<\/li><li>\n做职业规划时，为什么要把目标拆成带阶段成果的计划？（答案：抽象目标无法执行，拆解后每阶段有学习目标、行动与产出，可检查可调整；技巧 88，PDF 第 270–271 页。）\n<\/li><li>\n判断：简历改写可以把“参与项目”写成“独立负责项目”，只要面试能自圆其说。（答案：否；优化不等于造假，技巧 91，PDF 第 280 页。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n生活骨架：现状与偏好 → 决策类型 → 硬限制 → 产物形状。\n<\/li><li>\n学习骨架：现状水平 → 目标要求 → 资源与时间 → 反馈闭环。\n<\/li><li>\n求职骨架：JD 关键词 → 真实经历量化 → 岗位定向表述；不造假。\n<\/li><li>\n行业技巧 = 通用骨架 + 行业术语、法规与岗位约束。\n<\/li><li>\n边界：模型整理信息与列选项，专业判断由具备资质的人负责。\n<\/ul>", "ch04": "<div class=\"source-badge\">📖 出处：DeepSeek使用秘笈：从入门到精通的100个实用技巧 · p.281<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 8–9 章：生活、学习与求职场景（并入第 7 章行业技巧）<\/a><\/span><\/div><h1>第 10–11 章：本地部署与智能体<\/h1>\n<blockquote>对应原书第 10 章《DeepSeek的本地部署》、第 11 章《用DeepSeek打造智能体》（PDF 第 281–313 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 2 章知识库与核验、第 3 章流程化应答\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清本地部署解决什么问题（数据主权、合规、性能稳定性、可控更新），以及什么情况下普通用户不需要部署；\n<\/li><li>\n按硬件、软件、网络三类条件核对一台机器能否跑起模型，并用参数量与量化字节数估算显存需求；\n<\/li><li>\n复述 Ollama 下载模型、启动服务、接 Web UI 的基本流程；\n<\/li><li>\n说出智能体的五个构造要素（角色、知识库、风格、流程、迭代）与四步搭建流程，区分“通用模型 + 临时提示词”和“固定配置的智能体”。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>本地部署是把模型权重放到自己掌控的机器上运行，代价是硬件、软件与运维成本；智能体是在通用模型之上固定角色、资料、流程与风格、并持续喂案例迭代的专用助手。两者都是把前几章的临时做法沉淀成可复用系统。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 9：本地部署——动机、硬件条件与流程（难度：进阶）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。原书技巧 92 先回答“普通人是否需要”：日常问答、装修咨询、面试模拟这类需求，在线服务足够；只有每天处理高度敏感信息、需要本地加密处理关键数据时，本地部署才值得投入（PDF 第 282 页）。技巧 93–95 分别讲安全合规优势、性能稳定性效益、硬件软件网络三重条件（PDF 第 283–289 页）；技巧 96、97 讲 Ollama 部署步骤与 Page Assist 可视化界面（PDF 第 290–298 页）。<\/p>\n<h3>2. 概念 10：智能体——构造要素与四步搭建流程（难度：进阶）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。技巧 98 给出五个训练动作：角色定位、知识库投喂、对话风格调教、工作流程串烧、迭代升级（PDF 第 301–302 页）；技巧 100 给出在 Cherry Studio 上的四步搭建：获取大模型 API、配置模型、部署嵌入模型、上传知识库并创建智能体（PDF 第 306–313 页）。<\/p>\n<h2>推导一：本地部署为什么需要这些硬件条件<\/h2>\n<p>这一节从模型运行的资源占用出发，逐步推到原书给出的配置要求。<\/p>\n<p>第一步，明确模型运行时要占什么资源。大模型由大量参数组成，参数以数字形式存放在显存或内存中；推理时还要为上下文、中间计算预留额外空间。模型参数量越大，存放参数需要的容量越多，这是硬件要求的第一来源。<\/p>\n<p>第二步，估算参数存放容量。设模型参数量为 <span class=\"katex-inline\">P<\/span>（单位：B，即十亿参数），每个参数占用 <span class=\"katex-inline\">b<\/span> 字节。全精度（FP16）下 <span class=\"katex-inline\">b=2<\/span> 字节；量化到 4 位（INT4）时，每个参数约占 <span class=\"katex-inline\">0.5<\/span> 字节。参数占用容量的估算式为：<\/p>\n<div class=\"katex-block\">V \\approx P \\times b<\/div>\n<p>以原书列出的版本为例：14B 模型按 INT4 估算，<span class=\"katex-inline\">V \\approx 14 \\times 0.5 = 7<\/span> GB；再加上上下文与推理缓冲，实际可用显存要高于这个数。原书技巧 95 给出的口径是：部署 14B 模型内存最好保证 16GB DDR4 及以上，存储推荐至少 500GB SSD，显卡推荐 NVIDIA RTX 40 系列或更高级别（PDF 第 288 页）；技巧 92 提到显卡至少要达到 RTX 3090 级别，否则运行不动（PDF 第 282 页）。70B、671B 等更大版本的参数占用按同一估算式成倍上升，普通消费级机器无法承载。<\/p>\n<p>第三步，区分内存、显存与存储各自的角色。内存负责给系统与模型加载提供容量；显存由 GPU 提供，并行计算参数矩阵，推理速度主要靠它；SSD 负责存放模型权重文件与本地资料，读写速度影响模型加载时间。三者缺一会出现不同症状：内存不足会频繁读写硬盘、速度变慢甚至崩溃；显存不足无法把模型载入 GPU；存储不足则下载不下模型文件（技巧 95 的总结，PDF 第 288–289 页）。<\/p>\n<p>第四步，看软件与网络条件。操作系统上 Linux（Ubuntu、CentOS）稳定且兼容性好，Windows 界面友好但需要额外配置；Ollama 是支持本地运行 DeepSeek 的开源模型管理工具（技巧 95，PDF 第 288 页）。网络方面，模型更新与数据传输仍需要带宽，防火墙与安全组要只允许授权用户访问（PDF 第 289 页）。<\/p>\n<p>第五步，推到部署流程。技巧 96 的步骤是：从 ollama.com 按操作系统安装 Ollama；在模型列表找到 DeepSeek R1，按硬件选 1.5B、7B、8B、14B、32B、70B、671B 等版本；以 Windows 14B 为例，管理员 PowerShell 执行 <code>ollama run deepseek-r1:14b<\/code>，提示 success 即部署成功（PDF 第 290–293 页）。技巧 97 再接 Page Assist 浏览器扩展：先确认模型服务已启动，Ollama 默认运行在 localhost 的 11434 端口，浏览器访问 http://localhost:11434 看到 Ollama is running 即启动成功，再在扩展里选择本地模型对话（PDF 第 295–297 页）。<\/p>\n<h2>推导二：智能体由哪些要素拼成，四步流程在做什么<\/h2>\n<p>先区分临时对话与智能体。临时对话每轮重新交代身份与背景；智能体把这些配置固定下来，下次同类任务直接调用。技巧 98 的五个训练动作可以逐个对应到固定配置项。<\/p>\n<ol><li>\n<strong>角色定位<\/strong>：先给身份馅料（如“5 年经验的宠物店金牌客服，擅长安抚焦虑主人”），再夹禁忌清单（不推荐未经认证药品、避免兽医术语），最后盖任务面包（处理绝育后护理咨询）（PDF 第 301 页）。角色在这里不是第 1 章讨论的“给 R1 戴面具”，而是固定一个专用助手的应答边界。\n<\/li><li>\n<strong>知识库投喂<\/strong>：把常见问题整理成 Q&amp;A 格式喂入，例如“客户问疫苗为什么贵，重点解释冷链运输成本与抗体检测流程”（PDF 第 301 页）。这对应概念 c07 的定制知识库。\n<\/li><li>\n<strong>对话风格调教<\/strong>：指定应答顺序、语气、称呼；法律咨询智能体被训练成“先法条后大白话”的模式（PDF 第 302 页）。\n<\/li><li>\n<strong>工作流程串烧<\/strong>：把重复任务固化成流水线，例如合同审核智能体：收到需求 → 提取关键条款 → 比对最新劳动法 → 标记风险点 → 生成修改建议；之后上传合同说“帮我审核”即可按流程走（PDF 第 302 页）。\n<\/li><li>\n<strong>迭代升级<\/strong>：每周把新遇到的特殊案例补喂进去，用改进后的对话样本替换旧应答；电商客服智能体经过上百个差评案例投喂后，能处理更偏门的投诉（PDF 第 302 页）。\n<\/ol>\n<p>再看技巧 100 的四步搭建流程，每一步对应一个技术部件。第一步获取大模型：在硅基流动平台注册、新建 API 密钥，在模型广场找到 deepseek-ai/DeepSeek-R1 备用（PDF 第 306–307 页）。第二步配置模型：下载 Cherry Studio，在硅基流动模块填入密钥，添加模型 ID 完成认证（PDF 第 308–309 页）。第三步部署嵌入模型：在嵌入模型库选择 BAAI/bge-m3，它把文档转成模型可检索的数字表示（PDF 第 310 页）。第四步构建记忆宫殿：按文件、目录、网页抓取、站点地图、笔记五种方式上传知识库，测试检索返回后，在“智能体 → 创建智能体”里填名称、提示词并绑定知识库（PDF 第 310–312 页）。<\/p>\n<p>推演到这里可以看清：智能体 = 通用模型（第一步、第二步）+ 嵌入模型与知识库（第三步、第四步）+ 角色/风格/流程配置（提示词与禁忌清单）+ 持续迭代（新案例补喂）。少任何一项，智能体都会退化成普通对话。<\/p>\n<h2>反事实分析：去掉部署前提或智能体要素会怎样<\/h2>\n<ol><li>\n<strong>普通人在没有敏感数据需求时盲目本地部署<\/strong>。技巧 92 的判断是：日常咨询用在线服务即可，本地部署需要技术基础、高性能显卡与较高成本，每月租用服务器两千多元是一笔不小开销（PDF 第 282 页）。反事实推演：硬件达不到估算容量时，模型要么加载失败，要么慢到不可用；投入成本与收益不匹配，部署本身变成负担。决策顺序应是先确认数据敏感程度与业务连续性要求，再评估部署，而不是先装环境再找用途。\n<\/ol>\n<ol><li>\n<strong>部署后不更新模型与知识库<\/strong>。技巧 94 提到本地部署可严格控制模型更新，先在沙盒测试再全量部署（PDF 第 286 页）；技巧 43 要求定期加餐更新文档、剔除过期资料（PDF 第 147、150 页）。反事实推演：知识库停在旧版本后，检索到的旧制度、旧合同会被当成当前依据；模型版本长期不更新则错过修复与能力改进。本地部署把更新主动权交给使用者，也把更新责任交了过来。\n<\/ol>\n<ol><li>\n<strong>智能体只配角色，不配流程与案例迭代<\/strong>。反事实推演：只写“你是客服专家”，没有 Q&amp;A 知识库、没有固定审核流程、没有差评案例积累，智能体每次仍要临场发挥，与临时对话差别不大；技巧 98 记录的满意度提升来自流程固定与案例投喂，而不是角色头衔本身（PDF 第 301–302 页）。\n<\/ol>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章是全书技术底座的收口：第 2 章的知识库与核验在这里变成嵌入模型 + 检索配置；第 3 章的流程化应答在这里固化成智能体工作流。本地部署回答“数据放在哪里跑”，智能体回答“专用助手怎么配出来”。理解这两章后，可以回头检查前面每个场景技巧：哪些值得沉淀进知识库，哪些流程值得做成智能体，哪些资料敏感到需要本地处理。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为本地部署等于“模型装在自己电脑上就一定能跑”。参数量与显存容量不匹配时，小机器跑大模型会失败或极慢；先按估算式选版本，再看技巧 96 的命令（PDF 第 291–293 页）。\n<\/li><li>\n以为智能体是一个新模型。智能体不训练新的大模型，而是在已有模型上配置角色、资料、流程与风格；模型能力上限由底座决定，配置决定它在专用场景里的稳定性。\n<\/li><li>\n以为 API 密钥可以公开分享。密钥是接口鉴权凭证，泄露后他人可消耗你的额度；技巧 35 也提醒密钥粘贴时注意不要多打空格（PDF 第 120 页），保管要求同样适用于云端 API 密钥。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n14B 模型按 INT4 量化，参数存放容量约多少 GB？（答案：<span class=\"katex-inline\">14 \\times 0.5 = 7<\/span> GB，另需上下文与推理缓冲；估算口径见本章推演一，原书 14B 内存建议 16GB 以上，PDF 第 288 页。）\n<\/li><li>\n智能体五要素是哪五个？（答案：角色定位、知识库投喂、对话风格、工作流程、迭代升级；技巧 98，PDF 第 301–302 页。）\n<\/li><li>\n搭建智能体时嵌入模型 bge-m3 负责什么？（答案：把文档转成可检索的向量表示，供知识库相似度检索；技巧 100，PDF 第 310 页。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n部署动机：数据主权、合规隔离、性能与稳定性、更新可控；普通在线需求不必部署。\n<\/li><li>\n部署条件：硬件（CPU/内存/SSD/GPU）、软件（操作系统/Ollama）、网络（带宽/防火墙）。\n<\/li><li>\n部署流程：装 Ollama → 选版本下载模型 → <code>ollama run<\/code> 启动 → 接 Web UI。\n<\/li><li>\n智能体五要素：角色、知识库、风格、流程、迭代；四步搭建：取 API → 配模型 → 配嵌入模型 → 传知识库并创建智能体。\n<\/ul>", "c01": "<div class=\"source-badge\">📖 出处：DeepSeek使用秘笈：从入门到精通的100个实用技巧 · p.19<\/div><h1>三种模式与任务选型：V3、R1、联网搜索<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章（原书第 1–3 章）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>DeepSeek 提供三种可切换的工作模式：V3 基础模型追求快速响应，R1 深度思考模型先展开链式推理再给结论，联网搜索模式调用实时网络检索补充时效信息；选型就是按速度要求、推理深度、信息时效三个维度把任务对到对应模式。<\/p>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>不区分模式时，用户面对的困难是：同一个对话框里，快任务被慢模型拖长，深任务被快模型敷衍，旧记忆被当成最新事实。原书技巧 2 记录了创业公司 CEO 的教训：让“闪电侠”制定年度战略，收获百科式套话；让“老中医”处理客服咨询，用户被 2000 字专业回复劝退（PDF 第 20 页）。模式选错的代价不是回答质量小幅波动，而是任务类型与模型能力错配。<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n<strong>V3（基础模型）<\/strong>：反应神速，适合日常救火、快速响应；依赖下一个词的预测机制，通常不展示内部推理步骤，回答直接（原书技巧 10，PDF 第 41 页）。\n<\/li><li>\n<strong>R1（深度思考模型）<\/strong>：擅长深度推理，能自动执行链式思考并给出推理过程，具备一定的自我事实核查机制，适合复杂任务（PDF 第 41、43 页）。\n<\/li><li>\n<strong>联网搜索模式<\/strong>：调用实时网络检索，补充模型记忆截止之后的新信息，适合瞬息万变的场景（原书技巧 5、6，PDF 第 27、30 页）。\n<\/li><li>\n<strong>任务选型<\/strong>：先判断任务要快还是要深，再判断信息是否需要实时来源；三种模式可以在一条工作流里先后组合，不是互斥单选。\n<\/ul>\n<p>正例：会议前十分钟要三组竞品一句话对比，选 V3；分析新能源赛道产业链与风险，选 R1；查某餐厅最新评价与突发财报，开联网搜索。反例：用 R1 写一句邀请函话术（浪费深度推理时间）；用 V3 做投资风险推演（缺少推理链条与自查）；不联网就问最新政策（可能拿到过期信息）。<\/p>\n<h2>原理推导<\/h2>\n<p>第一步，模型输出由两部分资源决定：训练时学到的语言与知识模式，运行时可调用的信息范围。V3 与 R1 的差别主要在运行时是否展开推理链条；联网搜索改变的是运行时可调用的信息范围。<\/p>\n<p>第二步，推理链条消耗时间但提高复杂问题的可靠性。R1 把问题拆成中间步骤逐步分析，再汇总结论；步骤越多，响应越慢，但论证依据更完整。V3 跳过内部步骤直接续写，响应快，代价是复杂推理容易停在表层。<\/p>\n<p>第三步，时效信息无法靠训练记忆覆盖。模型记忆有截止时间，发布会、财报、评价、政策更新都可能晚于截止日期；联网检索把最新材料拉进当前上下文，回答才能引用当下事实。<\/p>\n<p>第四步，从三步推出选型规则：速度要求高且不需要论证的任务 → V3；需要论证、拆解、权衡的任务 → R1；资料可能过期或需要外部事实 → 叠加联网搜索。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：任务能被明确归入快/深/新三类需求之一；用户愿意在提示词里说清目标。\n<\/li><li>\n条件去掉会怎样：不判断速度要求，一律用 R1，轻量任务被拖慢；一律用 V3，复杂任务得不到推理链条；不开联网，时效性问题只能依赖记忆。\n<\/li><li>\n失败案例：技巧 2 中用 R1 处理客服咨询导致长回复劝退用户（PDF 第 20 页）；技巧 10 提醒 R1 提示词可简单直接，V3 提示词则需要更明确的引导（PDF 第 41–43 页）。\n<\/li><li>\n边界：模式不改变模型的事实可靠性；R1 想得深不等于说的都对，核验方法见概念 c07。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>V3 vs R1<\/strong>：差别在推理链条是否展开，不在“聪明程度”高低。V3 不是弱模型，它在快任务上成本更低、响应更快；R1 在简单任务上展开的链条属于多余开销。\n<\/li><li>\n<strong>联网搜索 vs R1 深度思考<\/strong>：前者补的是“信息新不新”，后者补的是“推理深不深”；两者可以叠加，先检索材料再深度分析。\n<\/li><li>\n<strong>模式 vs 提示词<\/strong>：模式选的是模型工作方式，提示词决定任务范围与输出形状；选错模式时，再好的提示词也补不上推理链条或实时信息。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置概念：无（本章起点）。后继概念：概念 c02 在选定模式之后，用四要素构造提示词；概念 c05 展开 R1 思维链与任务分解；概念 c07 说明即使选了 R1，仍需核验来源。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[接到任务] --&gt; B{需要快速响应?}\nB --&gt;|是| C[V3 基础模型]\nB --&gt;|否| D{需要推理链条与论证?}\nD --&gt;|是| E[R1 深度思考]\nD --&gt;|否| C\nE --&gt; F{资料可能过期?}\nC --&gt; F\nF --&gt;|是| G[叠加联网搜索]\nF --&gt;|否| H[直接生成]\nG --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>技巧 2（PDF 第 19 页）<\/td><td>三种模式定位<\/td><td>V3 闪电侠、R1 老中医、联网情报员<\/td><\/tr><tr><td>技巧 3（PDF 第 21 页）<\/td><td>V3 适用场景<\/td><td>快问快答、轻量文书、即时翻译、记忆查询<\/td><\/tr><tr><td>技巧 4（PDF 第 24 页）<\/td><td>R1 深度思考引擎<\/td><td>复杂决策与深度分析<\/td><\/tr><tr><td>技巧 5、6（PDF 第 27、30 页）<\/td><td>联网搜索<\/td><td>实时情报流，按功能需求选择<\/td><\/tr><tr><td>技巧 10（PDF 第 41 页）<\/td><td>两模式提问差异<\/td><td>R1 提示词可简洁，V3 需要明确引导<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>相关概念<\/h2>\n<p>提示词四要素、思维链与任务分解、核验与知识库<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（三种模式与任务选型：V3、R1、联网搜索）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：模式选型的机制与算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推出“为什么任务要分三种模式”，先往回追三层前提：<\/p>\n<ol><li>\n大模型生成回答时，靠的是当前输入上下文 + 模型参数里学到的模式；它不会自动访问你的日历、公司文档或最新网页，除非提示词或工具把这些信息送进来。\n<\/li><li>\n不同任务对“推理步数”和“信息时效”的要求不同：一句话译名不需要中间论证，产业链分析需要逐步拆解，突发新闻需要当天检索。\n<\/li><li>\n同一份模型参数在运行时可以选择不同的工作路径：是否展开推理链条、是否挂载检索工具。模式就是这些运行路径的开关。\n<\/ol>\n<p>依赖链方向：任务差异 → 运行路径差异 → 模式划分 → 选型规则。任何一层前提变化，选型规则都要跟着变：如果模型默认接入实时检索，联网开关就不再是独立选项；如果模型轻量任务也自动跳过推理，V3/R1 的分界会重新画。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：把任务拆成三个可判断的变量<\/h3>\n<p>选型不能凭感觉，先把每个任务写成三个判断：<\/p>\n<ul><li>\n速度变量：要求秒级回复还是可以等待深度分析；\n<\/li><li>\n深度变量：需要给出论证步骤、风险权衡，还是只要一个直接答案；\n<\/li><li>\n时效变量：结论依赖今天的行情、评价、政策，还是可以用已有知识回答。\n<\/ul>\n<p>这三个变量对应原书技巧 2 结尾的三问：需要灭火队还是智囊团？要标准答案还是创新方案？用历史经验还是实时情报？（PDF 第 21 页）<\/p>\n<h3>第二步：从变量推到模型路径<\/h3>\n<p>假设速度变量为“快”，深度变量为“浅”：模型不需要展开中间步骤，直接续写答案即可，对应 V3。V3 依赖下一个词预测机制，通常不展示内部推理步骤（技巧 10，PDF 第 41 页）。<\/p>\n<p>假设速度变量为“可等待”，深度变量为“深”：模型需要先列中间步骤、检查前提、再汇总结论，对应 R1。R1 自动执行链式思考，输出详细推理过程，并在生成过程中更善于发现并纠正错误（PDF 第 41、43 页）。<\/p>\n<p>假设时效变量为“新”：无论选 V3 还是 R1，都需要检索工具把最新材料拉进上下文，对应联网搜索模式。检索材料进入对话后，后续回答基于这些材料继续生成。<\/p>\n<h3>第三步：推导组合顺序<\/h3>\n<p>一条完整工作流可以串联多个模式：技巧 2 记录的组合是先让情报员搜集最新行业数据，再让老中医深度分析，最后派闪电侠生成汇报 PPT（PDF 第 21 页）。推导顺序：检索解决“有没有新材料”，深度推理解决“材料怎么分析”，快速生成解决“怎么出成品”。每一步调用前，先确认上一步产物已进入当前上下文。<\/p>\n<h3>第四步：推导出提示词配合差异<\/h3>\n<p>技巧 10 对比了两模式的提示结构：R1 不需要复杂角色扮演或分步指令，准确表达目标即可；V3 可能需要设定角色、描述任务甚至给出执行步骤（PDF 第 41–42 页）。推导依据：R1 自带推理路径，提示词多余的分步指挥会限制它的发挥；V3 缺少内部步骤展开，需要外部提示词补结构。<\/p>\n<h2>算例<\/h2>\n<h3>算例 1：晨会竞品对比<\/h3>\n<p>任务：会议前十分钟，要三家新消费品牌营销策略的一句话对比。<\/p>\n<ul><li>\n速度变量：快，十分钟内要交。\n<\/li><li>\n深度变量：浅，汇总对比即可，不需要逐家推演供应链。\n<\/li><li>\n时效变量：中，若品牌是近期新出现的，叠加联网搜索。\n<p>选型：V3 为主；涉及最新动态时先联网检索再让 V3 整理。对照技巧 2 中市场部专员两小时整理 20 家品牌对比表的案例（PDF 第 19 页）。<\/p>\n<\/ul>\n<h3>算例 2：赛道投资分析<\/h3>\n<p>任务：分析某新能源赛道的产业链、政策风险与技术突破时间轴。<\/p>\n<ul><li>\n速度变量：可等待。\n<\/li><li>\n深度变量：深，需要拆解产业链、列风险树、做时间轴。\n<\/li><li>\n时效变量：高，政策与价格信息可能过期，叠加联网。\n<p>选型：R1 + 联网搜索。对照技巧 2 中投资经理用 R1 分析新能源赛道、被追问风险点时能预判地缘政治影响的案例（PDF 第 20 页）。<\/p>\n<\/ul>\n<h3>算例 3：翻车反例<\/h3>\n<p>任务：客服日常咨询回复。<\/p>\n<ul><li>\n速度变量：快，用户等待容忍度低。\n<\/li><li>\n深度变量：浅，按常见问题答复。\n<p>反例：交给 R1 生成 2000 字专业回复，用户被劝退（PDF 第 20 页）。失败原因：深度变量与任务不匹配，推理链条产出了用户不需要的篇幅。修正：切回 V3，把常见问题与应答边界放进上下文。<\/p>\n<\/ul>\n<h2>假设与边界说明<\/h2>\n<p>推导中使用了两条假设：其一，模式切换只改变运行路径，不更换底座模型的知识范围；其二，联网检索返回的材料会被当作上下文内容参与后续生成。第一条假设在本书范围内成立；若未来产品把检索结果做了可信度标注，选型规则需要再加一道核验判断。第二条假设要求用户仍要检查检索材料本身是否可靠，检索不等于事实正确。<\/p>\n<h2>补充推演：上下文长度如何影响可选模式与提示词<\/h2>\n<p>模型每轮能看到的上下文有长度上限，历史消息、附件、检索片段都占用这个额度。推导这条限制对选型的影响：<\/p>\n<ul><li>\n任务材料短（一句话译名、短文案），上下文压力小，V3 即可承载；\n<\/li><li>\n任务材料长（多份合同、长报告），需要先做资料取舍或走知识库检索，避免历史消息把额度占满；\n<\/li><li>\nR1 展开的思维链本身也占上下文长度，复杂任务多轮对话时要定期收拢已确认结论，把细节历史从上下文中精简出去。\n<p>这里要区分两件事：上下文长度限制约束的是“本轮能看到多少材料”，模式选择约束的是“用哪条推理路径”。材料超长时，换 R1 并不能突破长度限制，只能先做资料切片与检索。<\/p>\n<\/ul>\n<h2>常见误读对照<\/h2>\n<ul><li>\n误读：R1 比 V3“更聪明”，所有任务都该用 R1。对照技巧 2 的定位：V3 是高频小任务的便利店，R1 是复杂问题的会诊专家（PDF 第 21、23 页）；任务与模型错配时，深度推理反而是多余开销。\n<\/li><li>\n误读：开了联网搜索就不需要核验。检索只负责把外部材料拉进上下文，材料本身的立场、时效、准确性仍需按概念 c07 的核验流程分层检查。\n<\/li><li>\n误读：模式一旦选定，整条流程不能换。技巧 2 的组合拳说明三种模式可在一条工作流先后调用（PDF 第 21 页）；选型按环节拆，不按任务整体锁死。\n<\/ul>\n<h2>补充算例<\/h2>\n<h3>算例 4：竞品动态追踪<\/h3>\n<p>任务：持续盯某赛道近一个月的新品与价格变化。<\/p>\n<ul><li>\n速度变量：不要求秒级，但材料必须是近期。\n<\/li><li>\n深度变量：中等，需要归类变化并点出趋势。\n<\/li><li>\n时效变量：高，旧记忆不够用。\n<p>选型：联网搜索定期拉取材料，R1 归类分析；整理成周报成品时再交 V3 排版。对照技巧 2 中情报员全天候盯梢的定位（PDF 第 20 页）。<\/p>\n<\/ul>\n<h3>算例 5：即时翻译与术语解释<\/h3>\n<p>任务：遇到外文资料，复制一段译文并解释其中一个行业术语。<\/p>\n<ul><li>\n速度变量：快；深度变量：浅；时效变量：低。\n<p>选型：V3。对照技巧 3 把 V3 当扫码枪式即时翻译官的用法（PDF 第 23 页）；若术语涉及最新法规或标准，再叠加联网检索核对。<\/p>\n<\/ul>\n<h2>补充推演：模式组合中的交接条件<\/h2>\n<p>一条工作流串联三种模式时，交接点决定上一环节产物能否被下一环节使用。推导交接条件：<\/p>\n<ul><li>\n情报员交给老中医的材料，要保留来源与时间标记，深度分析才能判断材料可信度；材料未注明出处时，R1 只能按给定内容推演，无法回溯。\n<\/li><li>\n老中医交给闪电侠的结论，要整理成要点清单与立场结论，快速生成环节只做排版与扩写，不再重新论证。\n<\/li><li>\n交接时若上一环节产物含未决问题，下一环节要先列出待确认项，不能把悬而未决的判断当成结论带走。\n<p>对照技巧 2 的组合拳：先搜集数据、再深度分析、最后生成汇报（PDF 第 21 页）；三个环节的产物形状不同，交接提示词要说明“上一步给了什么、这一步拿它做什么”。<\/p>\n<\/ul>\n<h2>补充边界：模式不消除模型固有局限<\/h2>\n<p>无论选哪种模式，模型都可能遗漏前提、误用过期信息、把推测写成事实；模式选择只改变推理路径与信息来源，不改变核验必要性。R1 展示的思考过程可以作为追问入口，但链条本身仍需对照来源检查；联网检索返回的材料也有立场与质量差异。把模式选对之后，核验环节（概念 c07）仍然独立存在。<\/p>\n<h2>补充对照：本书各技巧对应的模式归属<\/h2>\n<p>把第 1 章技巧按模式归位，便于回查：技巧 3 的快问快答、轻量文书、即时翻译、记忆查询归 V3（PDF 第 23 页）；技巧 4 的深度思考引擎、技巧 10 中 R1 的链式推理归深度思考路径（PDF 第 24、41 页）；技巧 5 的实时情报流、技巧 6 的功能选择归联网搜索（PDF 第 27、30 页）。技巧 7 的附件上传与技巧 8 的备用平台不改变模式归属，分别属于材料传入与可用性兜底。同一技巧在不同任务下可能换模式：术语解释用 V3，术语背后的政策沿革分析换 R1 并叠加联网。<\/p>\n<h2>补充推演：模式与提示词详略的配合<\/h2>\n<p>技巧 10 对比了两模式的提示结构（PDF 第 41–43 页）：R1 自带推理路径，提示词把目标与边界说清即可；V3 缺少内部步骤展开，角色、任务结构与执行顺序要写得更明确。推导配合规则：先选模式，再按模式调整提示词详略；模式选错后再补提示词，只能部分弥补。同一条任务在 R1 上写成开放目标，在 V3 上要拆成明确步骤，两者提示词不能直接互换。<\/p>\n<h2>机制拆解：模式开关改变输出的三个落点<\/h2>\n<p>【机制解释】候选空间：R1 路径在生成前先展开中间步骤，每一步都在缩小后续词的候选范围；V3 直接续写，候选范围停留在下一个词的高频组合上。这是运行路径差异，不是参数知识多少的差异。 【机制解释】注意力分配：R1 的思维链把注意力集中到前提、条件与反例上；V3 把注意力集中到用户最后一句的直接诉求上。 【经验推断】同一份任务材料，R1 在多轮追问下更容易暴露前提缺口；这一条来自本书案例观察（技巧 2、10），未做对照实验，不能推广为所有模型版本的稳定表现。 【机制解释】工具挂载：联网检索把外部片段注入上下文，后续生成只能在这些片段与已有参数知识之间组合；检索不到的内容不会因为开了联网就凭空出现。<\/p>\n<h2>算例 6：同一任务两种模式对照（可复核）<\/h2>\n<p>任务：给一款新上市的降噪耳机写一段上市理由。 提示词 A（交 V3，快路径）：<\/p>\n<pre><code>写一段降噪耳机上市理由，100 字以内。<\/code><\/pre>\n<p>预期输出落点：罗列降噪、续航、外观等通用卖点，句式为常见电商话术；不区分目标人群。 提示词 B（交 R1，深路径，同一背景）：<\/p>\n<pre><code>这款耳机面向通勤上班族，主打地铁通勤降噪与长续航；先列出目标人群的三个痛点，再逐条对应产品卖点，最后给一句收尾。<\/code><\/pre>\n<p>逐段对比：<\/p>\n<ul><li>\n痛点段：B 先产出通勤场景痛点，A 直接进入卖点罗列，缺人群前提。\n<\/li><li>\n卖点段：B 的卖点逐条挂在痛点后面，A 的卖点并列堆叠，看不出对应关系。\n<\/li><li>\n收尾段：两者都能给短句，但 B 的收尾承接痛点，A 的收尾是通用口号。\n<p>差异来源：B 把任务拆成“痛点—卖点—收尾”三段，R1 沿步骤展开；A 只有一个成品要求，模型停在高频话术组合上。本算例输出为机制推演下的预期形态，实际措辞以模型当次生成为准。<\/p>\n<\/ul>\n<h2>常见误读补充<\/h2>\n<ul><li>\n误读：提示词越长，模式选得越对。反例：模式选型由速度、深度、时效三个变量决定，与提示词字数无关；长提示词配错路径，仍会产出错篇幅或错时效的回答。\n<\/li><li>\n误读：R1 输出的思考过程等于正确结论。反例：思维链是推理路径展示，链条里的事实前提仍可能过期或缺失；技巧 30 的核验三招对 R1 输出同样适用（PDF 第 100 页）。\n<\/li><li>\n误读：联网搜索返回的内容一定最新且中立。反例：检索结果受关键词与排序影响，可能命中旧帖或带立场的软文；时效要核对发布日期，立场要交叉来源。\n<\/ul>\n<h2>自检问题<\/h2>\n<ol><li>\n一个任务同时满足“可等待、需要论证、资料可能过期”，应选哪种组合？\n<\/li><li>\n为什么 V3 的提示词往往要比 R1 写得更明确？\n<\/li><li>\n客服咨询任务交给 R1 会出现什么具体偏差？依据哪本书案例？\n<\/li><li>\n联网搜索解决的是“推理深度”还是“信息时效”问题？\n<\/li><li>\n上下文长度限制与模式选择分别约束什么？材料超长时换 R1 能不能解决问题？\n<\/ol><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：DeepSeek使用秘笈：从入门到精通的100个实用技巧 · p.39<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">三种模式与任务选型：V3、R1、联网搜索<\/a><\/span><\/div><h1>提示词四要素：背景、需求、约束、输出格式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章（原书第 1–3 章）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>提示词四要素是构造一条可用提问的四个部件：背景交代你是谁、处于什么处境；需求锁定要模型做的动作与对象；约束排除不相关内容与雷区；输出格式规定产物的结构、长度与受众。原书技巧 9 的万能公式写为“背景 + 需求 + 约束条件（可选）”（PDF 第 39 页），本精讲把输出格式从约束里单列，因为它决定回答的出口形状。<\/p>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>只说“帮我写个文案”“制定个计划”时，模型拿到的动作与对象都很模糊。它不知道你的水平、资源、目标受众、禁用内容，只能按最常见的组合生成通用套话。困难不是模型不会写，而是输入信息不足以区分哪条回答对你可用。原书技巧 9 的对照：只问“如何提高英语水平”得到通用学习计划；补上孩子年级、水平、目标与已具备能力后，回答才变成应试建议（PDF 第 39 页）。四要素就是把这个信息缺口逐项补上。<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n<strong>背景<\/strong>：你是谁、当前水平、已有资料、所处场景。技巧 14 把背景拆成基础定位（知识段位）、知识库存（已掌握与卡住的点）、跨界储备（可联系的已有知识）（PDF 第 51–53 页）。\n<\/li><li>\n<strong>需求<\/strong>：核心动作加对象，用具体动词代替模糊名词。技巧 19 的任务靶心：“做个旅游攻略”改成“规划广州到北京 7 日游路线”（PDF 第 67 页）。\n<\/li><li>\n<strong>约束<\/strong>：排除项、预算、时间、合规红线、不触碰的话题。技巧 9 的例子：提高阅读能力但不涉及语法部分，模型就不推荐无关内容（PDF 第 39 页）。\n<\/li><li>\n<strong>输出格式<\/strong>：结构（表格/小标题/清单）、长度、受众语气、是否分点。技巧 19 的效果预期：5 分钟演讲稿、含互动环节这类可量化指标（PDF 第 67 页）。\n<\/ul>\n<p>正例：“我是烘焙新手，连打发蛋白都不会（背景），帮我列一份戚风蛋糕入门步骤（需求），不要使用专业厨师术语（约束），按准备—操作—失败排查三段输出（格式）。”反例：“教我做蛋糕”——背景段位、动作、约束、格式全部缺失。<\/p>\n<h2>原理推导<\/h2>\n<p>第一步，模型在当前输入的基础上续写最合理的回答；输入里没出现的信息，模型只能按训练分布里的平均值猜。 第二步，背景补的是起点位置：段位、已有知识、处境不同，同一任务的可用答案不同。没有背景时，模型按平均读者解释，小白读不懂、专家嫌啰嗦（技巧 14，PDF 第 52 页）。 第三步，需求补的是动作方向：名词任务（文案、方案、攻略）包含多种动作，动词加参数把动作钉住。 第四步，约束补的是排除边界：每条约束从候选回答空间里删掉一批分支；预算、禁忌、合规都属于这一层。 第五步，格式补的是出口形状：没有格式要求时，模型默认用最常见的段落结构；要求表格、分点、字数后，产物才能直接进入使用场景。 四步合起来：背景定起点，需求定方向，约束定边界，格式定出口；缺哪一项，对应维度回到默认值。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：任务有明确产物与受众；提问者能说清自己的现状与限制。\n<\/li><li>\n条件去掉会怎样：去掉背景 → 通用方案；去掉需求 → 多动作混杂；去掉约束 → 包含无关内容与风险分支；去掉格式 → 产物不能直接用。\n<\/li><li>\n失败案例：技巧 31 中“优化新品推广策略”没交代竞品背景，二十页报告唯独漏掉本月刚上架的爆款竞品（PDF 第 102 页）；技巧 19 中“做个旅游攻略”给六十岁父母推荐了艺术区与密室逃脱（PDF 第 66 页）。\n<\/li><li>\n边界：四要素不保证事实正确；要素写清只缩小候选空间，事实核验另见概念 c07。对 R1 也不必把提示词写成冗长步骤清单，技巧 11 主张目标导向，说清目标与任务即可（PDF 第 44–45 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>背景 vs 身份<\/strong>：身份是背景的一部分（你在组织里的角色），背景还包括水平、资料、处境；概念 c03 展开身份与记忆传输。\n<\/li><li>\n<strong>约束 vs 输出格式<\/strong>：约束排除不能出现的内容，格式规定必须呈现的形状；一个管禁区，一个管出口。\n<\/li><li>\n<strong>四要素 vs 少样本示例<\/strong>：四要素用描述性要求界定任务，少样本示例用范例展示风格；范例不是四要素的替代品，边界见概念 c04。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 模式选型。后继：概念 c03 展开背景中的身份与记忆；概念 c05 处理复杂任务时四要素逐层分解；概念 c06 把四要素套到办公、创作、营销场景。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\nA[背景: 起点] --&gt; E[提示词]\nB[需求: 方向] --&gt; E\nC[约束: 边界] --&gt; E\nD[格式: 出口] --&gt; E\nE --&gt; F[可用回答]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>技巧 9（PDF 第 39 页）<\/td><td>万能公式<\/td><td>背景 + 需求 + 约束条件<\/td><\/tr><tr><td>技巧 11（PDF 第 44 页）<\/td><td>目标导向<\/td><td>R1 上冗长分步指挥反而限制发挥<\/td><\/tr><tr><td>技巧 14（PDF 第 51 页）<\/td><td>知识定位三要素<\/td><td>段位、库存、跨界储备<\/td><\/tr><tr><td>技巧 19（PDF 第 66 页）<\/td><td>四步拆解法<\/td><td>任务靶心、场景定位、效果预期、风险预警<\/td><\/tr><tr><td>技巧 24（PDF 第 81 页）<\/td><td>依据基准<\/td><td>法规、学术、行业标准作为约束输入<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>相关概念<\/h2>\n<p>上下文与身份、少样本与角色边界、场景化套路、核验与知识库<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（提示词四要素：背景、需求、约束、输出格式）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：四要素如何收缩候选回答空间<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推出四要素为什么有效，先往回追前提：<\/p>\n<ol><li>\n模型每轮回答都基于当前可见上下文续写；上下文里没有的信息，模型只能靠训练分布中的平均值补全。\n<\/li><li>\n一个“可用回答”必须同时落在四个坐标内：符合用户起点、对准任务动作、不踩禁区、产物形状可直接使用。\n<\/li><li>\n模糊提问只提供了部分坐标，剩下坐标由默认值填充；默认值对应平均人群与常见结构，往往不贴合具体任务。\n<\/ol>\n<p>依赖链方向：模型续写机制 → 回答需要四个坐标 → 模糊输入坐标缺失 → 四要素逐项补坐标。如果模型能主动反问并补齐信息，提示词要素的压力会减小；本书场景里模型并不掌握用户处境，所以补坐标的责任在提问者一侧。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：把“回答质量”拆成四个可检查的坐标<\/h3>\n<p>把一条回答看成四个维度的组合：起点匹配度（背景）、动作匹配度（需求）、边界合规度（约束）、产物可用度（格式）。四个维度都命中，回答才可用；任一维度用默认值，回答在该维度上退回通用水平。<\/p>\n<h3>第二步：推导背景坐标的作用<\/h3>\n<p>背景回答“为谁、在什么处境下做”。技巧 14 的万能模板：“我对____（领域）的了解相当于____（参照物），已经明白____（具体点），但卡在____（问题点），需要____（讲解方式），最好联系____（已知知识）”（PDF 第 53 页）。推导：参照物划定讲解深度，已掌握与卡点划定跳过与展开的范围，已知知识提供类比锚点。背景越立体，模型越能调整难度与角度。<\/p>\n<h3>第三步：推导需求坐标的作用<\/h3>\n<p>需求回答“做什么动作”。技巧 19 把任务靶心定义为“核心动词 + 参数”：“做个旅游攻略”是名词模糊任务，“规划广州到北京 7 日游路线”是动词加参数（PDF 第 67 页）。推导：名词可以对应多个动词（规划、推荐、比价、排期），动词把动作锁定；参数（起点、终点、天数）进一步缩小对象范围。<\/p>\n<h3>第四步：推导约束坐标的作用<\/h3>\n<p>约束回答“不能碰什么”。技巧 9 的约束例子：提高阅读能力但不涉及语法部分（PDF 第 39 页）；技巧 19 的风险预警：避开长时间排队场所（PDF 第 67 页）。推导：约束在候选空间里删除分支；删除的分支越多，剩余分支越集中。合规类约束（技巧 29，PDF 第 99 页）删除的是违规分支。<\/p>\n<h3>第五步：推导格式坐标的作用<\/h3>\n<p>格式回答“长什么样”。技巧 19 的效果预期要求可量化指标：时长、受众、形式（PDF 第 67 页）；技巧 43 的提问公式是“场景 + 具体需求 + 格式要求”，例如用表格对比两版法规差异并标注条文编号（PDF 第 148 页）。推导：格式要求决定段落、清单、表格、字数与语气；没有格式要求时，模型选择训练中最常见的段落结构，产物还要二次加工。<\/p>\n<h3>第六步：推导出四要素与模型类型的配合<\/h3>\n<p>技巧 11 指出 R1 推理能力强，目标导向即可，不必长篇分步指挥（PDF 第 44–45 页）；技巧 10 指出 V3 需要更明确的角色、任务与步骤引导（PDF 第 42 页）。推导：四要素在 V3 上要写得更完整，在 R1 上保留背景、目标与边界即可，中间步骤交给模型自己展开。<\/p>\n<h2>算例<\/h2>\n<h3>算例 1：英语学习计划（原书技巧 9，PDF 第 39 页）<\/h3>\n<p>原始提问：“如何提高英语水平？”<\/p>\n<ul><li>\n背景缺失：学习者年龄、基础、目标未知。\n<\/li><li>\n需求模糊：提高听说读写哪一项未知。\n<\/li><li>\n约束缺失：是否跳过口语未知。\n<\/li><li>\n格式缺失：计划周期与形式未知。\n<p>输出：通用学习计划，不针对个人情况。<\/p>\n<\/ul>\n<p>补全后提问：“我家孩子上高三，英语基础中等，主要想提高考试成绩，口语已经非常不错，不需要考虑口语。”<\/p>\n<ul><li>\n背景：高三、基础中等；需求：提高考试成绩；约束：不考虑口语；格式：应试建议与资源。\n<p>输出：针对性应试技巧与学习资源推荐。<\/p>\n<\/ul>\n<h3>算例 2：父母旅游攻略（原书技巧 19，PDF 第 68 页）<\/h3>\n<p>四步拆解：<\/p>\n<ul><li>\n任务靶心：规划广州至北京 7 日游路线。\n<\/li><li>\n场景定位：给 60 岁退休教师父母使用。\n<\/li><li>\n效果预期：日均步行不超过 8000 步，包含文化类景点。\n<\/li><li>\n风险预警：避开需要长时间排队的场所。\n<p>输出：含国家博物馆预约攻略、老字号餐馆轮椅通道信息、酒店午休安排的银发友好方案。<\/p>\n<\/ul>\n<h3>算例 3：反例——抽象形容词代替具体要求<\/h3>\n<p>技巧 19 避坑指南：忌用“高格调”“有质感”等抽象形容词，要转成“使用深蓝色商务模板”这类具体描述；勿忘时间维度；警惕默认假设，预算等隐藏条件必须明确写出（PDF 第 69 页）。反例：“做个有格调的培训方案”——“格调”没有可判断标准，模型只能猜；修正后把风格、时长、预算写成可核对的条目。<\/p>\n<h2>假设与边界<\/h2>\n<p>推导假设：四要素信息都能由提问者在提问时提供；现实中有些背景（如最新行业数据）需要附件或检索补充，见概念 c07。要素写得再全，也不能消除模型编造事实的可能；核验是独立一层。要素数量不是越多越好，技巧 11 提醒冗长指挥会限制 R1 发挥，判断标准是每条信息是否改变候选空间。<\/p>\n<h2>补充推演：要素缺失如何沿候选空间传导<\/h2>\n<p>把候选回答空间想象成一个多维集合，每个要素在一个维度上切一刀。推导缺失时的传导路径：<\/p>\n<ul><li>\n背景缺失：起点维度不切割，模型在所有人群假设中取值；不同人群偏好互相冲突时，回答取折中值，表现为“谁都能用、谁都不贴”。\n<\/li><li>\n需求缺失：动作维度不切割，多种动作（调研、草拟、对比、罗列）被混在一段输出里；读者要自己先拆出想要的那部分。\n<\/li><li>\n约束缺失：禁区维度不切割，模型把边界外的选项一并列出；营销、医疗、法律场景下，这些分支可能带来合规风险。\n<\/li><li>\n格式缺失：出口维度不切割，模型选最常见的段落结构；需要表格、清单、短标题时，用户还要二次加工。\n<p>四刀都切下去后，剩余候选才落在“为这个用户、做这个动作、不踩禁区、按这个形状交付”的范围内。<\/p>\n<\/ul>\n<h2>补充推演：要素之间的依赖顺序<\/h2>\n<p>要素填写有先后依赖：背景先于需求，因为同一个动作在不同背景下对象不同；约束紧跟需求，因为排除项要围绕动作划定；格式最后定，因为结构取决于产物用途。<\/p>\n<ul><li>\n先写需求再补背景会返工：先定“写文案”，再发现受众是 40+ 女性，语气与卖点要重选。\n<\/li><li>\n先定格式再补约束会漏排雷：先按表格列卖点，后发现某表述违反广告法，整表要回改。\n<p>实际操作顺序：背景 → 需求 → 约束 → 格式，与技巧 19 的四步拆解（任务靶心、场景定位、效果预期、风险预警）互为表里（PDF 第 67–68 页）。<\/p>\n<\/ul>\n<h2>常见误读对照<\/h2>\n<ul><li>\n误读：要素写得越多越好。技巧 11 指出 R1 上冗长分步指挥会限制发挥（PDF 第 44–45 页）；判断标准是每条信息是否改变候选空间，不改变的客套描述删掉。\n<\/li><li>\n误读：约束等于把要求重复一遍。约束是排除分支，不是强调重要性；“要重视质量”排除不了任何分支，“不使用感叹号、不出现竞品品牌名”才是可执行约束。\n<\/li><li>\n误读：格式只是排版要求。格式同时约束篇幅与受众；“5 分钟演讲稿”限定时长，“给小学生看”限定用词，这些都会改变内容本身。\n<\/ul>\n<h2>补充算例<\/h2>\n<h3>算例 4：培训方案四要素拆解<\/h3>\n<p>原始需求：“帮我设计个员工培训方案。”<\/p>\n<ul><li>\n背景：岗位人群、现有水平、培训时长未给。\n<\/li><li>\n需求：设计方案，但培训主题未给。\n<\/li><li>\n约束：预算、合规、禁用形式未给。\n<\/li><li>\n格式：方案结构、篇幅未给。\n<p>补全（对照技巧 19 试一试框架，PDF 第 69 页）：任务靶心（设计新员工系统操作培训方案）；场景定位（入职第一周，20 人小班）；效果预期（2 小时内，含现场练习与考核清单）；风险预警（不占用下班后时间，避免复杂软件安装）。<\/p>\n<\/ul>\n<h3>算例 5：反例——抽象形容词无法核对<\/h3>\n<p>“做个高格调、有质感的方案”：“高格调”“有质感”没有可判断标准，模型无法在候选空间里切割。修正方向换成可核对描述：配色用深蓝商务模板，正文不超过三页，结论先行，附件列数据来源（技巧 19 避坑指南，PDF 第 69 页）。<\/p>\n<h2>补充推演：同一任务在不同要素组合下的输出轨迹<\/h2>\n<p>以“季度营销方案”为例，逐档补全要素，观察输出变化：<\/p>\n<ul><li>\n只有需求“写季度营销方案”：模型产出通用流程框架，含常见渠道与时间表，不针对产品。\n<\/li><li>\n补背景“新产品面向 Z 世代，预算 50 万”：渠道选择与活动形式向年轻群体偏移，但仍未排除禁忌。\n<\/li><li>\n补约束“避开竞品上月用过的 AR 合影方案，不使用绝对化用语”：方案删去重复玩法与违规表述。\n<\/li><li>\n补格式“按目标人群、渠道、预算分配、排期表四部分输出”：产物可直接进入评审。\n<p>推导：每补一档要素，候选空间收窄一层；四档齐全后，输出从“通用文档”变成“可评审方案”。要素顺序不可颠倒：背景未定就定格式，结构无法贴合受众。<\/p>\n<\/ul>\n<h2>补充边界：四要素不替代资料与核验<\/h2>\n<p>四要素描述的是任务范围，不提供事实依据。产品数据、用户画像、法规条文需要附件或知识库进入上下文（概念 c07）；要素写得再完整，模型仍可能在缺资料处填入推测。提示词质量决定回答是否贴合任务，核验流程决定回答是否可信，两件事分开做。<\/p>\n<h2>机制拆解：四要素各自改变输出的哪个落点<\/h2>\n<p>【机制解释】背景段把任务相关的身份、对象、现状送进上下文，模型据此过滤掉与背景不符的候选回答；缺背景时，模型按“平均用户”这一默认身份作答。 【机制解释】需求段限定要交付的动作与产物类型（写方案、列提纲、改措辞），决定后续生成围绕哪个动词展开；需求含糊时，模型在“解释、续写、评论”多个动作之间摇摆。 【机制解释】约束段排除禁止项、禁忌口径与必须遵守的边界，相当于在候选空间里划掉一批分支；约束写进提示词比事后逐条删改更省轮次。 【机制解释】格式约束规定段落顺序、字段、字数与呈现形状，模型按给定骨架填内容；格式缺失时，结构落到模型常见的默认排版上。 【经验推断】四要素齐全后，一轮出稿可用率明显高于只写需求；这一条来自本书办公与创作技巧的归纳（技巧 35–37、51），未做严格统计，具体提升幅度随任务而异。<\/p>\n<h2>算例 6：同一季度方案两种提示词对照（可复核）<\/h2>\n<p>任务：为新品零食做季度营销方案。 提示词 A（只有需求）：<\/p>\n<pre><code>帮我写一个季度营销方案。<\/code><\/pre>\n<p>预期输出落点：通用营销流程框架，渠道与时间表为常见组合，不针对零食品类，也未排除竞品已用玩法。 提示词 B（四要素齐全）：<\/p>\n<pre><code>背景：面向学生与年轻白领的袋装零食，单价 5–8 元，预算 5 万元。\n需求：给出一个季度营销方案，覆盖渠道选择与活动排期。\n约束：不使用“最佳”“第一”等绝对化用语；不照搬竞品上月的联名礼盒玩法。\n格式：按目标人群、渠道、预算分配、排期表四部分输出，每部分不超过 200 字。<\/code><\/pre>\n<p>逐段对比：<\/p>\n<ul><li>\n人群段：B 限定学生与白领、价格带，渠道建议围绕校园与社交平台；A 的人群描述泛化到“年轻消费者”。\n<\/li><li>\n渠道段：B 在 5 万元预算内分配，A 列全渠道清单，未做取舍。\n<\/li><li>\n合规段：B 自动避开绝对化用语，A 可能在卖点句中出现违规表述，需事后返工。\n<\/li><li>\n结构段：B 按四部分成稿，可直接进评审；A 是大段叙述，需要二次拆条。\n<p>差异来源：背景与约束先收缩候选空间，格式再固定出口形状；A 三要素缺失，输出退回通用模板。预期形态供复核，实际措辞以当次生成为准。<\/p>\n<\/ul>\n<h2>常见误读补充<\/h2>\n<ul><li>\n误读：提示词越长越好，四要素后面堆得越多越准。反例：与任务无关的背景会分散注意力，关键信息被长段落淹没；要素应只保留与当前任务直接相关的内容。\n<\/li><li>\n误读：格式约束是可有可无的包装。反例：去掉格式段后，同一需求的产物结构落到默认排版；需要表格时模型可能写成大段文字，后续拆表成本高于一开始写明格式。\n<\/li><li>\n误读：约束写了就算落实。反例：约束只排除提示词内列出的禁止项，未列出的违规表述仍可能出现；合规结果要靠核验环节复核，不能把“提示词写了禁止”等同于“输出一定合规”。\n<\/ul>\n<h2>自检问题<\/h2>\n<ol><li>\n四要素各自对应回答的哪个坐标？缺一项会退回什么默认值？\n<\/li><li>\n“做个有创意的推广”缺了哪几个要素？分别怎么补？\n<\/li><li>\n为什么约束条件能减少无关内容？它在候选空间里做了什么操作？\n<\/li><li>\nR1 与 V3 在四要素详略上为什么不同？\n<\/li><li>\n格式要求和约束条件的差别在哪一步？要素填写为什么有先后顺序？\n<\/ol><\/div><\/details>", "c03": "<div class=\"source-badge\">📖 出处：DeepSeek使用秘笈：从入门到精通的100个实用技巧 · p.51<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">提示词四要素：背景、需求、约束、输出格式<\/a><\/span><\/div><h1>上下文、身份与记忆传输<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章（原书第 1–3 章）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>上下文是当前对话中模型能看到的全部信息：历史消息、身份说明、附件资料与知识库片段；身份注入是把你的角色、职责与立场写进上下文，记忆传输是把已有项目资料、会议结论、前期讨论作为背景交给模型。模型本身不跨会话记住你，每一轮回答都基于当前可见信息生成。<\/p>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>模型不知道你的处境、资源、困境，只能按通用模式输出答案（技巧 14，PDF 第 51 页）。困难表现为两类：一是解释错位，给小白讲术语、给专家讲常识；二是方案跑偏，模型不知道竞品、项目阶段、已有结论，给出的建议从前提上就不成立。技巧 31 记录快消品牌总监的案例：只说“优化新品推广策略”，二十页报告从 4P 讲到 SWOT，唯独没提本月刚上架的竞品爆款，因为竞品信息根本没进入上下文（PDF 第 102 页）。<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n<strong>上下文<\/strong>：本轮对话可见的全部输入，包括系统提示、历史消息、附件内容、检索到的知识库片段。上下文之外的信息，模型在本轮无法引用。\n<\/li><li>\n<strong>身份植入<\/strong>：直接把角色拍给模型，如“某手机品牌华东区市场经理，针对 Z 世代策划线下快闪，预算 50 万，规避竞品上月用过的 AR 合影方案”（技巧 31，PDF 第 103 页）。\n<\/li><li>\n<strong>记忆传输<\/strong>：把已有项目资料交给模型，分初级（当前项目已完成用户画像分析、竞品动作分析，附件 1、2）、进阶（延续上周三 AB 测试方案，重点优化转化漏斗第三阶段）、高阶（适配董事长季度会“三个转变”战略，讲话纪要已上传）（PDF 第 103 页）。\n<\/li><li>\n<strong>需求对齐<\/strong>：用具体条件框定发挥空间，如 618 短视频脚本的三条硬性要求（PDF 第 103 页）。\n<\/ul>\n<p>正例：“作为互联网医疗 PM，设计问诊流程时考虑《互联网诊疗监管细则》第二十一条；当前项目已完成用户画像（附件 1），本次重点优化转化漏斗第三阶段。”反例：“写个活动方案”——身份、资料、阶段全部缺席。<\/p>\n<h2>原理推导<\/h2>\n<p>第一步，模型没有持久个人记忆。关掉会话后，下一轮对话里它不认识你；所谓“记住”，只是当前会话历史被重新送进上下文。 第二步，回答与上下文匹配。模型在生成时参照上下文中的身份、资料与历史结论；上下文缺哪类信息，哪类信息只能按默认假设补。 第三步，身份改变模型取用的视角与口径。身份说明让模型按岗位立场组织建议：市场经理看渠道与预算，医生看诊疗规范，学生看考试要求。 第四步，附件与纪要补充模型外部资料。公司制度、合同、会议纪要不在模型训练记忆里，必须通过上传或知识库进入上下文，模型才能引用具体条款与数字。 第五步，推出操作顺序：先植身份，再传资料，最后对齐需求；发现模型跑偏时，用“回到身份、限定范围、按结构重组”三类指令把上下文拉回（技巧 31 的应急方案，PDF 第 104 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：任务依赖个人/组织背景；有可上传的资料；会话内需要延续前期讨论。\n<\/li><li>\n条件去掉会怎样：不植身份 → 模型按平均用户给建议；不传资料 → 重复造轮子、引用过期或外部信息；不对齐需求 → 自由发挥跑偏。\n<\/li><li>\n失败案例：技巧 14 的三类错误：隐藏段位（经济学教授问 GDP 是什么）、谎报军情（纯不懂编程要求 C++ 实现深度学习）、忽略关联（会弹钢琴却不说，错过音阶类比）（PDF 第 54 页）。\n<\/li><li>\n边界：上下文容量有限，超长资料不能整段塞入，需要知识库检索（概念 c07）；敏感资料上传前要评估合规要求（概念 c09）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>身份 vs 角色设定<\/strong>：身份是背景的一部分，描述你在组织中的真实位置；角色设定是让模型扮演某个专家身份。技巧 17 讨论的“给模型戴面具”是另一回事，见概念 c04。\n<\/li><li>\n<strong>记忆传输 vs 知识库<\/strong>：记忆传输是会话内一次性喂入项目资料；知识库是跨会话沉淀、可检索的文档库。资料量大、复用频次高时走知识库。\n<\/li><li>\n<strong>上下文 vs 模式<\/strong>：模式改变推理路径，上下文改变可见信息；两者独立，选错模式或缺上下文都会让回答跑偏。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c02 四要素（身份与资料属于背景要素）。后继：概念 c07 把上下文资料升级为知识库；概念 c10 把身份、资料、流程固定成智能体配置。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[身份植入: 角色/职责/立场] --&gt; C[当前上下文]\nB[记忆传输: 附件/纪要/前期结论] --&gt; C\nD[需求对齐: 条件与格式] --&gt; C\nC --&gt; E[模型生成回答]\nE --&gt; F{跑偏?}\nF --&gt;|是| G[身份重置/范围限定/结构重组]\nG --&gt; C<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>技巧 7（PDF 第 31 页）<\/td><td>上传附件<\/td><td>文件作为上下文材料进入对话<\/td><\/tr><tr><td>技巧 14（PDF 第 51 页）<\/td><td>知识定位三要素<\/td><td>段位、库存、跨界储备<\/td><\/tr><tr><td>技巧 20（PDF 第 71 页）<\/td><td>训练贴心助理<\/td><td>在对话中持续校准身份与偏好<\/td><\/tr><tr><td>技巧 31（PDF 第 102 页）<\/td><td>职场身份三件套<\/td><td>身份植入、记忆传输、需求对齐<\/td><\/tr><tr><td>技巧 43（PDF 第 141 页）<\/td><td>知识库投喂<\/td><td>跨会话的文档上下文<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>相关概念<\/h2>\n<p>提示词四要素、核验与知识库、智能体构造要素<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（上下文、身份与记忆传输）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：上下文如何决定回答的起点与口径<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>往回追三层前提：<\/p>\n<ol><li>\n大模型是无状态的：每次调用时，模型本身不保留上一轮会话的私人记录；所谓对话记忆，是程序把历史消息重新拼进当前输入一起发送。\n<\/li><li>\n模型只能参照当前输入里出现过的信息生成回答；输入中没有的组织背景、项目阶段、竞品动作，模型无法从“你说过的话”里推断出来。\n<\/li><li>\n身份与资料属于上下文信息：它们影响模型取用哪类视角、哪类口径、哪类先例。上下文不同，同一任务的回答前提就不同。\n<\/ol>\n<p>依赖链方向：无状态模型 → 上下文决定可见信息 → 身份与资料进入上下文 → 回答匹配具体处境。若产品提供跨会话长期记忆功能，部分身份可以由系统持久保存，但项目资料与前期结论仍需明确传入。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：推导“为什么通用方案差点意思”<\/h3>\n<p>技巧 14 用健身教练类比：只说“我要减肥”，对方给大众减脂方案；补上“腰椎间盘突出、每天通勤三小时”，方案才变成坐姿训练加碎片化运动组合（PDF 第 52 页）。推导链条：背景症状缺失 → 教练按一般人群假设安排跑步 → 体重基数大的人跑步可能伤膝；症状进入背景 → 动作选择排除高冲击项目。模型与教练的工作方式相同：它不知道你的病史与时间条件，只能按平均方案推荐。<\/p>\n<h3>第二步：推导知识定位三要素各自补什么<\/h3>\n<p>技巧 14 把背景拆成三项（PDF 第 52–53 页）：<\/p>\n<ul><li>\n基础定位：知识段位。说清是小白、爱好者还是专家，模型据此过滤信息深度。告诉模型“我是小学生”，解释光合作用会说成“植物吃饭的秘密”，而不是叶绿体反应术语。\n<\/li><li>\n知识库存：已掌握什么、卡在哪。程序员说“懂 Python 基础语法，没接触过机器学习”，模型跳过 print 入门，直接从分类数据集讲起。\n<\/li><li>\n跨界储备：可联系的已有知识。学过乐理再理解傅里叶变换，模型可以用音阶类比；这一项提供类比锚点。\n<p>三项合起来，背景从“一句话身份”变成一张认知地图。<\/p>\n<\/ul>\n<h3>第三步：推导身份植入在职场场景的作用<\/h3>\n<p>技巧 31 的“夺舍三件套”：身份植入、记忆传输、需求对齐（PDF 第 103 页）。<\/p>\n<ul><li>\n身份植入把岗位、预算、限制动作写清：市场经理面对的是渠道与预算决策，不是学生作业。\n<\/li><li>\n记忆传输把项目阶段与已有结论传入：附件 1 是用户画像，附件 2 是竞品分析，前期 AB 测试结论作为前提。\n<\/li><li>\n需求对齐用具体条件框定脚本结构与卖点优先级。\n<p>推导：三件套分别补立场、前提、边界；缺立场则建议不分岗位，缺前提则重复分析已完成工作，缺边界则自由发挥。<\/p>\n<\/ul>\n<h3>第四步：推导跑偏后的回收机制<\/h3>\n<p>技巧 31 给出三类应急指令（PDF 第 104 页）：记忆重置术“回到市场经理身份，结合本季度 KPI 提升线下渠道销量”；范围限定咒“从附件 3 的五个核心卖点中选三个展开”；格式封印法“按痛点-方案-数据支撑结构重组”。推导：跑偏的原因是上下文在多轮对话中漂移，回收动作本质是重新注入身份、范围与格式，把上下文拉回任务轨道。<\/p>\n<h3>第五步：推导附件与知识库的分工<\/h3>\n<p>技巧 7 的上传附件功能把文件内容带入单轮对话（PDF 第 31 页）；技巧 43 的知识库把文档长期沉淀、按问题检索片段（PDF 第 142–148 页）。推导：单次材料用附件，复用材料用知识库；知识库按部门或项目分库，定期更新并剔除过期资料。<\/p>\n<h2>算例<\/h2>\n<h3>算例 1：元宇宙解释的两种上下文（技巧 14，PDF 第 53 页）<\/h3>\n<p>原始上下文：只有问题“解释什么是元宇宙”。模型输出学术定义：虚拟时空集合，源于 1992 年《雪崩》。 补全上下文：“我对科技概念的了解相当于《生活大爆炸》观众，知道 VR 和区块链，但分不清数字孪生和元宇宙的区别，请用美剧场景类比说明。”模型用谢尔顿公寓模型对应数字孪生，用科幻大会场景对应元宇宙。对比：背景参照物与卡点进入上下文后，解释角度从学术定义切换到熟悉类比。<\/p>\n<h3>算例 2：职场方案的身份对照（技巧 31，PDF 第 103 页）<\/h3>\n<p>错误上下文：“写个活动方案。”模型默认对方是需要完成作业的人，输出通用流程。 正确上下文：“作为某手机品牌华东区市场经理，需针对 Z 世代策划线下快闪活动，预算 50 万，需规避竞品上月用过的 AR 合影方案。”模型按渠道、预算、竞品限制生成方案。差异来源：身份、预算、竞品限制三条信息进入了上下文。<\/p>\n<h3>算例 3：反例——谎报段位<\/h3>\n<p>反例：“完全不懂编程”却要求“用 C++ 实现深度学习”（技巧 14，PDF 第 54 页）。推导：上下文里水平描述与任务难度冲突，模型只能给天书代码；修正为“纯文科生，刚学会安装 Visual Studio，请从识别猫狗图片开始教”，水平与任务对齐后路径才可行。<\/p>\n<h2>假设与边界<\/h2>\n<p>推导假设：上传附件能被模型读取并进入上下文；扫描件不可识别时需要先转文字版（技巧 43，PDF 第 150 页）。上下文有长度上限，超长文档不能整段塞入；此时走知识库检索，见概念 c07。身份说明应真实，谎报段位会导致内容错位；涉及公司敏感资料时，上传前先评估合规与数据主权问题，见概念 c09。<\/p>\n<h2>补充推演：多轮对话中上下文如何漂移<\/h2>\n<p>会话进行多轮后，上下文里同时存在初始任务、中途补充、临时跑偏话题。推导漂移机制：每一轮新消息都进入上下文，模型参照最新上下文组织回答；如果中途话题与原任务无关，最新上下文会把回答带离轨道。技巧 31 的三类应急指令正是针对三种漂移方向（PDF 第 104 页）：<\/p>\n<ul><li>\n身份漂移：模型忘了岗位立场 → 用身份重置术拉回角色与 KPI。\n<\/li><li>\n范围漂移：模型展开到无关卖点 → 用范围限定咒收回到指定材料。\n<\/li><li>\n结构漂移：内容顺序混乱 → 用格式封印法按固定结构重组。\n<p>漂移不是模型“记性差”，而是上下文里新增了偏移信息；回收动作本质是往上下文重新注入正确的身份、范围与结构。<\/p>\n<\/ul>\n<h2>补充推演：附件信息进入上下文的边界<\/h2>\n<p>技巧 7 的上传附件把文件内容带入对话（PDF 第 31 页）。推导附件生效的条件：文件文字可被识别；内容在当前上下文额度内；提问时引用了附件中的对象。技巧 43 记录的失败情形包括扫描件不可识别、关键词检索失效（PDF 第 150 页）：附件传上去但文字层缺失，模型读不到内容，回答仍按通用假设走。附件材料很长时，整份塞入会占满额度，需要知识库按问题检索片段，分工见概念 c07。<\/p>\n<h2>常见误读对照<\/h2>\n<ul><li>\n误读：App 账号登录后模型就长期记住我。账号同步的是会话历史与产品设置，不等于模型参数里写入了个人档案；换会话仍需重新交代身份与资料。\n<\/li><li>\n误读：身份写得越高越好。技巧 14 的隐藏段位反例：“经济学教授”问基础概念会被敷衍（PDF 第 54 页）；身份要与问题难度匹配，真实位置比头衔重要。\n<\/li><li>\n误读：记忆传输等于把所有文档都贴进对话框。文档量大、复用频次高时走知识库；单次讨论用附件，避免上下文被历史材料挤占。\n<\/ul>\n<h2>补充算例<\/h2>\n<h3>算例 4：项目阶段上下文的三层传输<\/h3>\n<p>初级：“当前项目已完成用户画像分析（附件 1）、竞品动作分析（附件 2）。” 进阶：“延续上周三讨论的 AB 测试方案，本次重点优化转化漏斗第三阶段。” 高阶：“方案需适配董事长季度会提出的‘三个转变’战略（讲话纪要已上传）。”（技巧 31，PDF 第 103 页） 推导：三层分别补已有结论、前期讨论、战略依据；缺任一层，模型可能把已完成工作重新分析一遍，或给出与战略方向冲突的建议。<\/p>\n<h3>算例 5：反例——忽略跨界关联<\/h3>\n<p>会弹钢琴十年，问声波共振原理却不提音乐背景（技巧 14，PDF 第 54 页）。推导：模型不知道可用音阶、泛音列做类比，只能从物理定义讲起；补上跨界储备后，解释可以挂在已有经验上，理解成本下降。<\/p>\n<h2>补充推演：身份说明如何影响建议的立场与口径<\/h2>\n<p>同一份材料，身份不同，建议取用的角度不同。推导身份进入上下文后的作用机制：<\/p>\n<ul><li>\n身份词标明职责立场：市场经理关注渠道与预算，法务关注条款与风险，教师关注学情与大纲。\n<\/li><li>\n身份附带可引用的内部语言：岗位黑话、制度名称、项目代号，模型按这些语言组织建议。\n<\/li><li>\n身份决定建议优先级：同样是成本问题，销售岗先看转化，财务岗先看合规。\n<p>技巧 31 的进阶写法用行业黑话建立身份共识：“以互联网医疗 PM 身份，设计问诊流程时考虑《互联网诊疗监管细则》第二十一条”（PDF 第 103 页）。身份不真实时，立场与口径随之错位；身份越具体，建议越贴近决策位置。<\/p>\n<\/ul>\n<h2>补充边界：上下文不是越长越好<\/h2>\n<p>资料堆满上下文后，模型注意力被分散，关键信息可能被淹没。推导取舍规则：与当前任务直接相关的材料优先保留；背景档案放入知识库按问题检索；多轮对话中已确认的结论收拢成几条要点，细节历史适时精简。上下文长度服务于当前回答，不追求把所有历史都留在会话里。<\/p>\n<h2>补充对照：三类上下文材料的进入方式<\/h2>\n<p>附件材料通过上传进入单轮对话（技巧 7，PDF 第 31 页）；身份与偏好通过提示词写进会话开头；沉淀资料通过知识库跨会话检索（技巧 43，PDF 第 142 页）。三类材料进入方式不同，更新周期也不同：附件随任务更换，身份随岗位变化，知识库按部门定期更新。整理资料时先判断复用频次，再选进入方式，避免把长期档案一次性塞进当前会话。<\/p>\n<h2>机制拆解：上下文与身份如何改变后续生成<\/h2>\n<p>【机制解释】上下文窗口：每轮生成时，模型只能看到本轮之前留在窗口内的消息；早期对话被挤出窗口后，模型在本轮无法引用，这与“它记不记得你这个人”是两回事。 【机制解释】身份先验：提示词中的岗位、职责、项目代号会成为后续回答的立场坐标；模型据此选择术语口径与建议优先级，而不是凭空设定立场。 【机制解释】多轮记忆传导：同一轮会话内已确认的结论会作为上下文参与下一轮；新的追问建立在既有结论上，结论被推翻后要在后续消息里明确更正，旧结论仍留在窗口内时可能被再次引用。 【经验推断】把身份与已确认结论收拢成条目放在会话开头，比散落在长对话末尾更不容易被忽略；这一条来自多轮实践观察，注意力在窗口内的分布并不均匀，靠前位置更容易被用到。<\/p>\n<h2>算例 6：同一追问在两种上下文条件下的对照（可复核）<\/h2>\n<p>任务：前一轮已讨论“产品面向 40 岁以上女性，主打家庭健康监测”，本轮追问“这条卖点怎么写”。 条件 A（上下文被清空，仅保留本轮追问）：<\/p>\n<pre><code>这条卖点怎么写？<\/code><\/pre>\n<p>预期输出落点：模型不知道“这条”指哪款产品、哪类人群，给出通用卖点句，人群与场景错位。 条件 B（保留前一轮背景，本轮追问）：<\/p>\n<pre><code>承接上一轮：产品面向 40+ 女性、主打家庭健康监测，卖点怎么写？<\/code><\/pre>\n<p>逐段对比：<\/p>\n<ul><li>\n人群句：B 围绕家庭健康与子女远程关爱展开，A 写成泛化的“关爱自己”。\n<\/li><li>\n功能句：B 把监测功能挂在家庭场景上，A 罗列参数。\n<\/li><li>\n口径句：B 沿用前一轮确认的定位，A 重新猜测定位。\n<p>差异来源：条件 B 的前一轮结论在窗口内参与本轮生成；条件 A 缺背景，模型退回默认人群。若上下文已被清空，补救做法是把已确认背景在本轮重述一遍，而不是假设模型还记得。<\/p>\n<\/ul>\n<h2>常见误读补充<\/h2>\n<ul><li>\n误读：对话越长，模型记得越牢。反例：窗口长度有上限，早期消息被挤出后不再参与生成；长会话需要定期收拢结论，而不是靠堆历史。\n<\/li><li>\n误读：身份说明写一次就永久生效。反例：身份只存在于当前会话上下文；新开会话、切换会话后身份不保留，需要重新交代或走知识库。\n<\/li><li>\n误读：模型引用了之前说过的话，就说明它理解了上下文。反例：复述原话可能只是窗口内文本被复用，前提是否被正确理解仍要核对；上下文在不等于理解到位。\n<\/ul>\n<h2>自检问题<\/h2>\n<ol><li>\n为什么关掉会话后模型“不认识”你？记忆存在哪里？\n<\/li><li>\n知识定位三要素分别补哪类上下文信息？\n<\/li><li>\n身份植入、记忆传输、需求对齐各补什么前提？\n<\/li><li>\n模型回答跑偏时，三类回收指令分别重置上下文的哪一部分？\n<\/li><li>\n附件与知识库在资料复用频次上如何分工？附件不可识别时会出现什么情况？\n<\/ol><\/div><\/details>", "c04": "<div class=\"source-badge\">📖 出处：DeepSeek使用秘笈：从入门到精通的100个实用技巧 · p.58<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">提示词四要素：背景、需求、约束、输出格式<\/a><\/span><\/div><h1>少样本示例与角色设定的边界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章（原书第 1–3 章）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>少样本示例是在提示词里给出一两个范例，让模型模仿其格式与风格；角色设定是指定模型扮演的身份。两者都是给模型加的“引导先验”：在弱模型或简单任务上能降低跑偏概率，在强推理模型上过度使用则可能把输出锁死在模板里。边界判断标准是：示例与角色是否帮助界定了任务，还是反而替代了目标描述。<\/p>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>旧教程形成的习惯是：提问先塞范文、先写“你现在是某专家”。这套方法在早期模型上是必要的，因为模型推理能力有限，需要范例引导格式、需要角色限定视角。面对 DeepSeek R1 这类强模型时，范例和角色开始产生反作用：技巧 16 记录，给了参考案例后输出像“把范文撕碎又胡乱拼贴的作业”（PDF 第 58 页）；技巧 17 记录，指定资深分析师身份后报告中规中矩，撤掉角色直接要求揭示破坏性变革，反而挖出冷门赛道（PDF 第 61 页）。困难在于：分不清什么时候该给范例和角色，什么时候该让模型按目标自由发挥。<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n<strong>少样本示例（few-shot）<\/strong>：提示词中附带的一两个输入输出范例。机制上模型会参照范例的结构、用词与长度组织输出。\n<\/li><li>\n<strong>角色设定<\/strong>：提示词中指定模型身份，如“你是环保专家”。机制上模型按该身份的视角与口径取用知识。\n<\/li><li>\n<strong>引导先验<\/strong>：在模型生成前先给一个倾向，影响候选回答的分布；先验可以收窄范围，也可以限制发挥。\n<\/li><li>\n<strong>边界<\/strong>：范例与角色是可选辅助，不是提示词必备部件；判断依据是任务类型与模型能力。\n<\/ul>\n<p>正例：V3 写营销文案时，给角色与结构要求（技巧 10，PDF 第 42 页）；创意广告语任务不给范文，改用效果坐标轴：七个字、含动物意象、第二个字是动词（技巧 16，PDF 第 59 页）。反例：写未来科技趋势时附 20 篇范文；分析市场趋势时先写“你是有十年经验的分析师”。<\/p>\n<h2>原理推导<\/h2>\n<p>第一步，模型生成时会参照提示词中的一切文本。范例不仅展示内容，还展示结构骨架；角色不仅限定视角，还限定用词与案例范围。 第二步，强模型见过海量语料，本身具备多种风格与领域知识。范例进入上下文后，模型容易把范例当成标准答案模板，优先模仿骨架而不是解决问题；技巧 16 的类比是学霸考试时看到试卷边角印着解题步骤，反而束手束脚（PDF 第 58 页）。 第三步，角色设定把模型视野收进身份框架。技巧 17 案例：要求从历史学者视角分析科技发展，报告通篇蒸汽革命案例；撤掉角色后，模型自发把古希腊机械原理与量子计算结合（PDF 第 61 页）。身份框架内的案例被优先取用，框架外的关联被压低。 第四步，推出替代方案：用目标描述与边界约束替代范例和角色。技巧 16 的做法是说清要求、避开的坑、不可逾越的边界，不提供标准答案范例（PDF 第 59 页）；技巧 17 的做法是描述想要的效果、红线清单、可参考维度，不塞入“你应该成为谁”（PDF 第 62 页）。 第五步，保留适用场景：V3 缺少内部步骤展开，明确角色与任务结构有助于引导（技巧 10，PDF 第 42 页）；需要固定专业口径的专用助手，角色与禁忌清单是配置的一部分（概念 c10）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：弱模型或 V3 上需要格式引导；任务有明确不可偏离的模板；专用智能体需要固定身份与禁忌。\n<\/li><li>\n条件去掉会怎样：创意任务给范例 → 输出模仿套路；探索性分析给角色 → 视野被身份框住；范例本身平庸或有误 → 模型照抄缺陷。\n<\/li><li>\n失败案例：技巧 16 中附两篇《量子计算改变世界》范文，不如直接说“用科幻迷能听懂的话讲十年后哪些黑科技颠覆手机行业”（PDF 第 58–59 页）；技巧 17 中“作为餐饮专家写奶茶店运营方案”不如“大学城开健康奶茶店，面向追求健康的年轻群体，预算 50 万”（PDF 第 62 页）。\n<\/li><li>\n边界：反对的是过度使用，不是一律删除。范例质量高、任务要求复刻格式时，示例仍是有效手段。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>少样本示例 vs 输出格式要求<\/strong>：范例展示“长什么样”的具体样本，格式要求描述“长什么样”的规则；规则可迁移到新内容，范例容易被照搬骨架。\n<\/li><li>\n<strong>角色设定 vs 身份植入<\/strong>：角色设定让模型扮演专家身份；身份植入是把用户自己的岗位与背景写进上下文（概念 c03）。前者改模型视角，后者补用户处境。\n<\/li><li>\n<strong>先验引导 vs 四要素<\/strong>：四要素界定任务本身，范例与角色是附加引导；四要素不清时，范例不能替代背景与需求。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c02 四要素、概念 c03 上下文。后继：概念 c10 智能体中角色与禁忌清单是固定配置；概念 c06 创作场景中风格模仿需要风格线索，但不等于照搬范文。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[任务类型] --&gt; B{需要复刻固定模板?}\nB --&gt;|是| C[可给范例/角色]\nB --&gt;|否| D{探索/创意任务?}\nD --&gt;|是| E[用目标描述+边界约束]\nD --&gt;|否| F[按四要素直接提需求]\nC --&gt; G[检查范例质量与角色边界]\nE --&gt; G<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>技巧 10（PDF 第 41 页）<\/td><td>V3 引导<\/td><td>V3 可能需要角色、任务与步骤明确引导<\/td><\/tr><tr><td>技巧 16（PDF 第 58 页）<\/td><td>减少案例样本<\/td><td>范例可能成为标准答案模板，锁住创造力<\/td><\/tr><tr><td>技巧 17（PDF 第 60 页）<\/td><td>告别角色设定<\/td><td>R1 上角色可能变成眼罩，改描述效果更好<\/td><\/tr><tr><td>技巧 31（PDF 第 102 页）<\/td><td>用户身份植入<\/td><td>与模型角色设定方向相反，补的是用户背景<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>相关概念<\/h2>\n<p>提示词四要素、上下文与身份、智能体构造要素<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（少样本示例与角色设定的边界）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：范例与角色如何改变候选回答分布<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>往回追前提：<\/p>\n<ol><li>\n模型生成回答时，提示词中的每段文本都会影响后续续写的概率分布；范例和角色文本也不例外。\n<\/li><li>\n范例同时携带两类信息：内容信息（说什么）与结构信息（怎么组织）；模型在模仿时更容易抓住可复制的结构骨架。\n<\/li><li>\n角色文本携带身份视角与用词范围；模型会优先取用该身份框架内的案例、术语与立场。\n<\/li><li>\n强模型自身已具备多风格、多领域知识；外部先验过多时，自身能力被先验压住，输出向范例与角色靠拢。\n<\/ol>\n<p>依赖链方向：提示词文本影响分布 → 范例带结构骨架、角色带身份框架 → 强模型自身能力被先验覆盖 → 出现模板化与视野收窄。模型能力较弱时，先验的引导价值大于束缚风险；这是旧教程方法在当时成立的原因。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：推导范例为什么会变成模板<\/h3>\n<p>假设任务是写新能源汽车广告语，提示词附两条范例：“驾驭未来，电启新程”“无声澎湃，绿色力量”（技巧 16 进阶对照，PDF 第 60 页）。模型读到范例后，可参照的维度包括：八字对仗结构、环保词汇、口号式节奏。生成第三条时，模型倾向于在同一结构内填词，因为范例把“对仗口号”标成了高频模式。推导：范例越完整，结构信号越强；结构信号越强，新内容越容易落在同一骨架里。<\/p>\n<h3>第二步：推导“减少样本”后效果坐标轴如何替代范例<\/h3>\n<p>技巧 16 给出的进阶指令：写三句让人想立刻试驾的广告语，包含五感中任意两种描写，用运动赛事术语替代传统环保词汇，每句结尾动词有冲刺感（PDF 第 60 页）。推导：这条提示词没有给样本，但把判断标准写成可核对规则——感官维度、术语替换、动词效果。模型在规则划定的赛道内自由组合，产出不再受范例骨架限制。反向要求“禁止出现月亮、团圆、饺子等传统元素”，属于用删除分支的方式留出创意空间（PDF 第 59 页）。<\/p>\n<h3>第三步：推导角色设定为什么会蒙住视野<\/h3>\n<p>技巧 17 记录测试：让 DeepSeek 以资深分析师身份写行业报告，结果中规中矩；仅要求“揭示未来三年最具破坏性的技术变革”，模型挖出三个专家忽视的冷门赛道（PDF 第 61 页）。推导链条：身份词“资深分析师”激活分析师常用框架（行业、规模、竞品）；框架内案例被优先取用；跨领域冷门关联在框架权重之外被压低。撤掉身份词后，框架约束消失，模型可以组合更远距离的知识。<\/p>\n<h3>第四步：推导角色在什么条件下仍是必要配置<\/h3>\n<p>技巧 10 指出 V3 自我检查机制较少、依赖外部反馈，可能需要设定角色、描述任务甚至给出执行步骤（PDF 第 42–43 页）。推导：V3 缺少内部路径展开，角色与结构提示词承担了补路径的作用；此时删掉角色，跑偏概率上升。智能体场景（概念 c10）固定角色与禁忌清单，是为了让同一专用助手每次应答口径一致；角色在这里是产品配置，不是探索任务上的临时面具。<\/p>\n<h3>第五步：推导出边界判断流程<\/h3>\n<p>遇到一个任务，先问三件事：产物是否要求复刻既有模板？模型是 V3 还是 R1？范例本身是否经过质量把关？需要复刻模板且范例可靠 → 给示例；探索创意且用 R1 → 用目标规则与边界替代；V3 通用任务 → 用明确角色与结构引导；R1 探索任务 → 直接描述效果。<\/p>\n<h2>算例<\/h2>\n<h3>算例 1：奶茶店方案的两版提示词（技巧 17，PDF 第 62 页）<\/h3>\n<p>传统版：“作为餐饮专家，写份奶茶店运营方案。”身份词把视野压进餐饮专家常见框架。 进阶版：“在大学城开一家健康奶茶店，面向追求健康生活的年轻群体，预算为 50 万元。”背景、人群、预算进入提示词，身份词删除。 对比：进阶版让模型围绕具体人群与预算组织方案，而不是先套专家模板。<\/p>\n<h3>算例 2：手表广告语的效果约束（技巧 17，PDF 第 61 页）<\/h3>\n<p>要求：给智能手表写十条广告语，每条包含时间意象，禁止出现钟表相关词汇。模型输出“把朝阳装进手腕震颤”一类句子。推导：时间意象是正向约束，钟表词汇是删除分支；没有范文，创意在规则内生成。<\/p>\n<h3>算例 3：反例——错误范例被照搬<\/h3>\n<p>假设范例本身使用了“最便宜”“治疗功效”这类违规表述（对照技巧 51 敏感词提醒，PDF 第 170 页）。推导：范例中的违规表达会被结构信号一起带入新文案；先验不区分对错，只模仿模式。修正方向：用合规规则写进约束，而不是依赖范例示范合规。<\/p>\n<h2>假设与边界<\/h2>\n<p>推导假设：范例与角色的影响随模型能力增强而相对下降；不同产品版本的表现可能不同，实际使用时可在两种写法上各试一次对比（技巧 10 小贴士，PDF 第 44 页）。角色与身份植入不要混淆：概念 c03 的用户身份背景不能删，删了方案会跑偏；本概念讨论的是“让模型扮演谁”，不是“用户是谁”。<\/p>\n<h2>补充推演：范例信号的可复制性差异<\/h2>\n<p>范例里的信息按可复制程度分三层，推导模型更容易抓住哪一层：<\/p>\n<ul><li>\n结构骨架：句式长短、对仗方式、段落顺序。这类信号形式固定，最容易被抽取与模仿。\n<\/li><li>\n用词风格：口头禅、形容词、语气词。这类信号部分被模仿，但随新内容变化。\n<\/li><li>\n实质观点：范例讨论的具体对象与结论。这类信号本不该被照搬，但骨架被锁住后，对象词汇也常一起残留。\n<p>技巧 16 记录的“范文撕碎拼贴”就是第三层残留现象：骨架沿用旧范文，对象换成新题目，读起来像拼盘（PDF 第 58 页）。判断范例是否合适，先看它的骨架是否就是你想要的模板；如果只是想借用观点角度，用规则描述角度比附范例更稳。<\/p>\n<\/ul>\n<h2>补充推演：角色框架如何改变知识取用顺序<\/h2>\n<p>模型参数里存着跨领域的关联知识；角色提示词相当于给这些知识加权重。推导：<\/p>\n<ul><li>\n身份词激活该身份常用的概念簇：分析师框架、律师口径、教师视角。\n<\/li><li>\n概念簇内的案例被优先排列到候选前列；簇外的跨领域关联权重被压低。\n<\/li><li>\n多轮对话中角色词反复出现，权重持续加强，视野进一步收窄。\n<p>技巧 17 案例：历史学者视角下，蒸汽革命案例反复出现；撤掉角色后，古希腊机械原理与量子计算的组合才被调出（PDF 第 61 页）。反向使用：需要固定专业口径时（如法律智能体），角色与禁忌清单是产品配置；需要探索跨领域洞见时，身份词先撤掉。<\/p>\n<\/ul>\n<h2>正向与反向约束的搭配<\/h2>\n<p>技巧 16、17 的进阶指令同时用两类约束：<\/p>\n<ul><li>\n正向约束：要求出现的要素，如七个字、动物意象、时间意象、第二种感官描写。\n<\/li><li>\n反向约束：禁止出现的分支，如禁止月亮/团圆/饺子传统元素、禁止钟表词汇。\n<p>推导：正向约束划定必须覆盖的赛道，反向约束删掉拥挤的老路；两类配合留出的空间，才是创意发挥区。只给正向约束，模型仍可能落入常见套路；只给反向约束，产物缺必要要素。<\/p>\n<\/ul>\n<h2>常见误读对照<\/h2>\n<ul><li>\n误读：本书主张删掉所有角色设定。技巧 17 反对的是给 R1 探索任务戴专家面具；技巧 10 同时指出 V3 可能需要明确角色引导（PDF 第 42 页）。边界按模型与任务分，不按概念一刀切。\n<\/li><li>\n误读：不给范例就等于纯自由发挥。技巧 16 要求用目标描述、边界约束、加分项替代范例（PDF 第 59 页）；约束不是放任，是把规则讲清楚。\n<\/li><li>\n误读：范例越多越准确。多个范例互相矛盾时，模型在骨架之间摇摆；范例质量参差时，下限被最差样本拖住。\n<\/ul>\n<h2>补充算例<\/h2>\n<h3>算例 6：节日海报文案的反向约束<\/h3>\n<p>任务：节日海报文案，避免传统元素。提示词加入“禁止出现月亮、团圆、饺子等传统元素”，模型交出“把思念装进 Wi-Fi 信号”一类表达（技巧 16，PDF 第 59 页）。推导：反向约束删掉了高频节日套路分支，正向需求（思念、连接）保留，创意空间才显出来。<\/p>\n<h3>算例 7：反例——范例带违规表达<\/h3>\n<p>假设两条范例使用“全网最低价”“根治”类表述。结构信号把绝对化用语一起带入新文案；对照技巧 51 敏感词要求，这类表述需改成合规说法（PDF 第 170 页）。反例结论：范例不区分对错，只模仿模式；合规规则要写进约束，不能指望范例示范合规。<\/p>\n<h2>补充推演：模型能力强弱改变先验的收益比<\/h2>\n<p>同一套范例与角色，在不同模型能力下收益方向相反。推导对比：<\/p>\n<ul><li>\n弱模型自身生成路径不稳定，范例提供结构锚点，角色提供视角限定；先验减少跑偏，收益大于束缚。\n<\/li><li>\n强模型自身掌握多风格多领域知识，范例骨架被优先模仿，角色框架压低跨领域关联；先验的束缚成本超过引导收益。\n<p>技巧 10 与技巧 17 的差异正对应这一分界：V3 需要更明确的角色与结构引导（PDF 第 42 页），R1 探索任务上撤掉角色更能发挥（PDF 第 61 页）。判断时先确认面对的是哪类模型、任务是否需要复刻模板，再决定给不给先验。<\/p>\n<\/ul>\n<h2>补充推演：去掉范例后规则如何承载风格要求<\/h2>\n<p>不给范例不等于风格失控。推导规则承载风格的写法：<\/p>\n<ul><li>\n句式规则：字数、断句、是否对仗、结尾词性。\n<\/li><li>\n用词规则：允许的词汇域、禁用的词汇域、情绪色彩。\n<\/li><li>\n结构规则：段落顺序、每段动作、互动位置。\n<p>技巧 16 的进阶指令把这些写成可核对条目：两种感官描写、赛事术语替代环保词、结尾动词有冲刺感（PDF 第 60 页）。规则描述抽象风格，范例展示具体样本；规则可迁移到新题目，样本会把旧题目一起留下。<\/p>\n<\/ul>\n<h2>常见误读补充：角色与身份不要混用<\/h2>\n<p>概念 c03 的用户身份必须保留：不交代“我是谁”，模型按平均用户回答。本概念讨论的“模型角色设定”是让模型扮演谁，属于可选先验。两者方向相反：用户身份补背景，模型角色改视角；删错对象会出两类不同问题——删用户身份导致方案跑偏，删模型角色在探索任务上释放视野。<\/p>\n<h2>补充对照：本书技巧在边界上的立场<\/h2>\n<p>技巧 16 主张减少案例样本、释放创造力（PDF 第 58 页）；技巧 17 主张告别角色设定（PDF 第 60 页）；技巧 10 同时承认 V3 需要明确引导（PDF 第 42 页）。三条并不冲突：前两条针对 R1 上的探索与创意任务，后一条针对 V3 的通用任务。判断顺序是先定模型与任务类型，再决定是否给范例与角色；脱离模型能力谈“要不要角色”，结论会偏到其中一端。<\/p>\n<h2>机制拆解：范例与角色分别锚定输出的哪一层<\/h2>\n<p>【机制解释】范例锚点：少样本示例同时传递内容骨架、句式长度与用词风格；模型在生成时把示例结构作为最近参照，未被示例覆盖的部分再退回通用组合。 【机制解释】角色约束：角色设定限定模型站在谁的视角说话，改变建议取舍与语气；角色不提供事实依据，视角再鲜明也不能替代背景资料。 【机制解释】先验挤占：范例与角色占住候选空间后，偏离模板的新关联被压低；任务需要跨领域联想或自由发散时，先验越重，原创空间越小。 【经验推断】R1 上撤掉角色更容易释放视野、V3 上保留角色更稳；这一分工来自本书技巧 10 与 17 的对照（PDF 第 41、60 页），属经验归纳，不同模型版本表现可能不同。<\/p>\n<h2>算例 6：同一标题任务，正确范例与错误范例对照（可复核）<\/h2>\n<p>任务：为一篇讲厨房收纳的公众号文章起三个标题。 提示词 A（给错误示例当参照）：<\/p>\n<pre><code>参考这个标题：震惊！不看后悔！厨房收纳原来这么简单！再写三个类似标题。<\/code><\/pre>\n<p>预期输出落点：沿用感叹号堆砌与夸张情绪，标题落入标题党句式；示例的违规倾向被一起迁移。 提示词 B（给正确示例当参照）：<\/p>\n<pre><code>参考这个标题的写法：《三口之家的厨房：把常用工具收进 40 厘米台面》——用具体场景加具体数字，不加情绪词。再写三个同风格标题。<\/code><\/pre>\n<p>逐段对比：<\/p>\n<ul><li>\n句式：B 产出场景加数字的平实标题，A 产出感叹句堆叠。\n<\/li><li>\n用词：B 避开“震惊”“后悔”类词，A 沿用示例情绪词。\n<\/li><li>\n结构：B 的标题可直接对应文章内容，A 的标题与内容脱节。\n<p>差异来源：示例不只给句子，还把句式与情绪口径一起带进候选空间；给错误示例等于把错误锚点放进去。复核时先检查示例本身是否合规，再决定要不要喂给模型。<\/p>\n<\/ul>\n<h2>常见误读补充<\/h2>\n<ul><li>\n误读：给的范例越多，成品越稳。反例：多个范例若风格不一致，模型在几套骨架之间摇摆；范例之间口径统一比数量多更重要。\n<\/li><li>\n误读：角色设定对所有任务都加分。反例：探索与创意任务上，角色框架会压低跨领域关联；技巧 17 在这类任务上主张撤掉角色（PDF 第 60 页）。\n<\/li><li>\n误读：范例只是参考，模型不会照搬。反例：示例中的旧产品名、旧数据、旧句式容易被一并保留；换题后要逐句核对是否残留示例内容。\n<\/ul>\n<h2>自检问题<\/h2>\n<ol><li>\n范例除了内容还传递了什么信号？为什么这个信号容易被照搬？\n<\/li><li>\n技巧 16 中“效果坐标轴”替代范例时，约束分正向与反向两类，各起什么作用？\n<\/li><li>\n角色设定为什么会压低跨领域关联？用技巧 17 的历史学者案例说明。\n<\/li><li>\nV3 上为什么仍可能需要角色与结构提示？\n<\/li><li>\n什么情况下错误范例比没有范例更糟？范例里三层信息哪层最容易被照搬？\n<\/ol><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：DeepSeek使用秘笈：从入门到精通的100个实用技巧 · p.48<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">提示词四要素：背景、需求、约束、输出格式<\/a><\/span><\/div><h1>思维链、分步对话与任务分解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章（原书第 1–3 章）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>思维链是模型把复杂问题拆成中间步骤、逐步推理后再给结论的过程；分步对话是用户用多轮提问引导模型先展开、再校准、最后锁定；任务分解是把大目标拆成主要任务、子任务、微任务，逐层配提示词并加入反馈调整。三者处理的是同一类困难：问题太大时一步到位容易出现混乱或笼统的结果。<\/p>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>复杂问题直接抛给模型，容易出现两类偏差：一是答案笼统，只覆盖最常见角度；二是结构混乱，选题、大纲、正文挤在一段里。技巧 28 指出，复杂问题直接解决可能产出混乱结果，拆成小问题逐步引导更易产出可用产物（PDF 第 93 页）。技巧 13 提醒，过早要求“直接给最终方案”会错过模型发现的潜在创新维度（PDF 第 49 页）。困难在于：复杂任务的中间判断点很多，单轮提问无法把这些判断点逐个展开。<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n<strong>思维链（Chain-of-Thought）<\/strong>：模型内部把推理过程写成中间步骤再汇总结论。R1 自动执行链式思考并展示过程；V3 通常不展示内部步骤（技巧 10，PDF 第 41 页）。\n<\/li><li>\n<strong>分步对话（三轮法）<\/strong>：技巧 13 的启发思考 → 校准调整 → 锁定路径。启发思考用开放式提问扩大问题空间；校准调整针对初步结果追问补充关键信息；锁定路径给出明确具体的最终指令（PDF 第 48–50 页）。\n<\/li><li>\n<strong>任务分解<\/strong>：技巧 28 的层级拆分：总体目标 → 主要任务 → 子任务 → 微任务；每层配对应提示词，层与层之间标注顺序，最后加入反馈调整机制（PDF 第 93–94 页）。\n<\/li><li>\n<strong>反馈调整<\/strong>：不把首轮回答当最终结果，针对选题、大纲、内容逐段反馈，让模型重新生成（PDF 第 96 页）。\n<\/ul>\n<p>正例：智能手环广告语任务，先问“设计传播方案需要考虑哪些创新维度”，再补“主要客群是关注家庭健康的 40+ 女性”，最后锁定“基于该特性设计三个情感共鸣广告语，体现子女远程关爱功能”（技巧 13，PDF 第 49–50 页）。反例：第一轮就要求“直接给最终方案”，问题空间未展开即关闭。<\/p>\n<h2>原理推导<\/h2>\n<p>第一步，复杂问题包含多个未知判断点：受众是谁、突出什么功能、用什么情绪路径。单轮提示词只能填入部分判断点，其余由模型猜。 第二步，思维链把判断点显式化。R1 自动展开中间步骤，用户可以在步骤层面看到依据并追问；分步对话则由用户在多轮中主动把判断点逐个补齐。 第三步，任务分解把产物拆成层级结构。总体目标定方向，主要任务分大块，子任务拆动作，微任务定最细动作；每一层提示词只对应当前层，上下文负担降低。 第四步，反馈机制纠正偏差。分解后的每层产物都可单独检查：选题偏了就改选题，大纲缺部分就补大纲，不必整篇推倒（技巧 28，PDF 第 96 页）。 第五步，推导出适用顺序：先判断问题是否复杂；复杂走三轮对话或任务分解；简单任务不必硬拆，避免把流程复杂化（技巧 22：是否需要大量设计提示词看情况，PDF 第 76 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：任务包含多个步骤或多个未知判断点；产物可分层检查；用户愿意多轮交互。\n<\/li><li>\n条件去掉会怎样：不展开直接要终稿 → 错过潜在维度；不分层 → 上下文拥挤、结构混乱；不加反馈 → 偏差沿层级传递到最终产物。\n<\/li><li>\n失败案例：技巧 13 列的三个坑：答案洁癖（过早关闭可能性空间）、问题笼统（“如何提升销量”导致推测失焦）、路径依赖（一直追加“按之前说的做”阻断认知升级）（PDF 第 51 页）。\n<\/li><li>\n边界：思维链不是越长越好；技巧 21 指出激发深度思考要配合任务本身的复杂度，简单问题展开链条属于浪费时间（PDF 第 74 页）。模型展示的思考过程也需要核验，见概念 c07。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>思维链 vs 任务分解<\/strong>：思维链是模型内部推理步骤；任务分解是用户把外部产物拆成层级任务。前者偏模型机制，后者偏工作流程。\n<\/li><li>\n<strong>分步对话 vs 多轮闲聊<\/strong>：分步对话每轮有明确目的（展开、校准、锁定）；闲聊没有任务层级，容易漂移。\n<\/li><li>\n<strong>任务分解 vs 少样本示例<\/strong>：分解给的是任务结构与顺序，示例给的是成品样本；前者规划流程，后者展示风格。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c02 四要素、概念 c01 模式选型（R1 更适合展开思维链）。后继：概念 c06 创作与办公场景的分层产出；概念 c10 智能体把固定流程串成流水线。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[复杂任务] --&gt; B[启发思考: 开放式提问]\nB --&gt; C[校准调整: 追问补信息]\nC --&gt; D[锁定路径: 明确最终指令]\nD --&gt; E[任务分解: 总体→主要→子任务→微任务]\nE --&gt; F[逐层生成]\nF --&gt; G{反馈检查}\nG --&gt;|偏差| H[调整对应层提示词]\nH --&gt; F\nG --&gt;|通过| I[最终产物]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>技巧 13（PDF 第 48 页）<\/td><td>三轮对话法<\/td><td>启发思考、校准调整、锁定路径<\/td><\/tr><tr><td>技巧 21（PDF 第 74 页）<\/td><td>激发深度思考<\/td><td>深度思考匹配复杂任务<\/td><\/tr><tr><td>技巧 25（PDF 第 84 页）<\/td><td>依据思考过程改进回答<\/td><td>从推理链条中找可追问点<\/td><\/tr><tr><td>技巧 28（PDF 第 93 页）<\/td><td>任务分解<\/td><td>总体目标、主要任务、子任务、微任务、反馈调整<\/td><\/tr><tr><td>技巧 26（PDF 第 86 页）<\/td><td>多轮连续指令<\/td><td>三句话引导助手持续推进任务<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>相关概念<\/h2>\n<p>模式选型、提示词四要素、场景化套路、智能体工作流程<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（思维链、分步对话与任务分解）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：分步为什么比一步到位更可靠<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>往回追前提：<\/p>\n<ol><li>\n复杂产物由多个判断点决定：受众、角度、结构、风格、约束；单轮提示词能填入的判断点有限。\n<\/li><li>\n模型在判断点缺失时按默认假设补全；多个默认假设叠加，产物就偏离目标。\n<\/li><li>\n推理与生成分层进行更稳：先把判断点展开，再逐个确认，最后生成成品；每一层只处理一类问题。\n<\/li><li>\n分层后每层产物可单独检查，偏差被截在当前层，不沿链条传到成品。\n<\/ol>\n<p>依赖链方向：复杂任务含多个判断点 → 单轮补不全 → 分步展开与层级拆分 → 逐层反馈纠正。若任务本身只有一个判断点（一句话译名），分层带来的收益不足以抵消交互成本。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：推导一步到位为什么容易笼统<\/h3>\n<p>以“推荐三本心理学书籍”为例（技巧 13，PDF 第 48 页）。输入只含对象“心理学书籍”，判断点缺失：读者身份、阅读目的、是否需要可讨论性、互动环节设计。模型按最常见书单回答《思考快与慢》一类常规书。推导：判断点缺失越多，输出越靠近训练分布里的高频组合；高频组合通用，但不贴合具体场景。<\/p>\n<h3>第二步：推导三轮对话如何补判断点<\/h3>\n<p>技巧 13 的三轮（PDF 第 49–50 页）：<\/p>\n<ul><li>\n启发思考：开放式提问“为智能手环设计传播方案，需要考虑哪些创新维度？”模型列出健康监测精准度、社交互动玩法、个性化表盘经济等方向。这一步扩大问题空间，把隐藏维度摆出来。\n<\/li><li>\n校准调整：针对模型提出的方向补关键信息“主要客群是关注家庭健康的 40+ 女性”。定位坐标进入上下文后，电竞联名等不相关提案被过滤。\n<\/li><li>\n锁定路径：给出最终指令“基于 40+ 女性关注家庭健康的特性，设计三个以情感共鸣为核心的广告语，体现子女远程关爱功能”。受众、场景、情感诉求、具体要求四项全部明确。\n<p>推导：三轮分别解决“有哪些可能”“哪个方向对”“按什么要求做”；跳过任何一轮，对应判断点仍由默认假设填充。<\/p>\n<\/ul>\n<h3>第三步：推导任务分解的层级结构<\/h3>\n<p>技巧 28 以健康饮食文案为例（PDF 第 94–96 页）：<\/p>\n<ul><li>\n总体目标：生成一篇健康饮食文案。\n<\/li><li>\n主要任务：选题、大纲、具体内容。\n<\/li><li>\n子任务：选题定主题方向；大纲列结构要点；内容按大纲写段落。\n<\/li><li>\n微任务：选题定为“健康饮食的重要性”；大纲分引言、好处、实践、结论；内容逐段撰写。\n<p>每层配独立提示词：选题提示词交代博主身份与受众；大纲提示词承接选题；内容提示词承接大纲。推导：层级把大任务的上下文负担拆开，每层提示词只引用上一层产物，模型不需要同时处理所有判断点。<\/p>\n<\/ul>\n<h3>第四步：推导反馈调整机制的位置<\/h3>\n<p>技巧 28 的反馈示例：选题更好具体化到“健康饮食对心脏健康的影响”；大纲增加心理健康部分；内容补充食谱示例（PDF 第 96 页）。推导：反馈对准具体层，不必整篇重写；偏差在哪一层发现，就改哪一层提示词。这比“整体重写”节省交互成本，也避免已合格部分被再次改动。<\/p>\n<h3>第五步：推导分解的边界<\/h3>\n<p>技巧 22 提出“需要花大量时间设计提示词吗？看情况”（PDF 第 76 页）。推导：判断标准是任务复杂度与返工成本。简单任务分层会增加交互轮次；高价值、长周期任务分层能在早期截住偏差。技巧 23 同时提醒：公式不能解所有题，分解结构要随任务调整（PDF 第 78 页）。<\/p>\n<h2>算例<\/h2>\n<h3>算例 1：读书会方案的三轮改写（技巧 13 试一试，PDF 第 51 页）<\/h3>\n<p>原始指令：“请撰写一份关于开展读书会的方案。”<\/p>\n<ul><li>\n第一轮启发：“组织职场新人读书会，需要考虑哪些促进深度连接的维度？”\n<\/li><li>\n第二轮校准：“参与者多为 95 后互联网从业者，希望缓解社交焦虑。”\n<\/li><li>\n第三轮锁定：“基于上述背景，设计六期读书会安排，每期含破冰环节与阅读书目方向。”\n<p>对照：原始指令一步到位，模型给通用活动方案；三轮后受众、目的、产物形状逐步明确。<\/p>\n<\/ul>\n<h3>算例 2：研究报告的任务分解（技巧 28 试一试，PDF 第 96–97 页）<\/h3>\n<p>总体目标：智能家居设备市场趋势研究报告。<\/p>\n<ul><li>\n主要任务：市场现状、未来趋势、竞品分析。\n<\/li><li>\n子任务：现状含规模、增速、驱动因素；趋势含政策与技术；竞品含份额与特点。\n<\/li><li>\n微任务：收集 2023–2024 规模数据；分析近五年增长率；列举三个驱动因素。\n<p>每层提示词单独下发，反馈后调整。<\/p>\n<\/ul>\n<h3>算例 3：反例——问题笼统导致失焦<\/h3>\n<p>“如何提升销量”（技巧 13，PDF 第 51 页）。推导：销量涉及品类、渠道、人群、价格，命题过大时模型扫描范围失焦；优化为“如何在现有预算下提升母婴类复购率”，对象、预算、指标缩小后，推理才有落点。<\/p>\n<h2>假设与边界<\/h2>\n<p>推导假设：模型在多轮对话中能保留历史上下文；跨会话不保留时，前期结论需要重新传入（概念 c03）。任务分解不保证结论正确，只降低结构混乱；事实层面的核验仍由概念 c07 处理。R1 自动展开思维链，用户仍可要求展示推理过程以便追问；V3 不展示内部步骤，分层提示词要写得更明确。<\/p>\n<h2>补充推演：思维链展开与上下文成本<\/h2>\n<p>R1 自动展开中间步骤，步骤文本进入当前上下文。推导成本与收益：<\/p>\n<ul><li>\n收益：中间步骤可见，用户能在步骤层面追问、纠偏；技巧 25 即依据思考过程找可改进点（PDF 第 84 页）。\n<\/li><li>\n成本：链条越长，上下文占用越多；多轮后早期细节被挤出额度，需要收拢已确认结论。\n<\/li><li>\n边界：简单任务展开链条属于冗余开销，技巧 21 要求深度思考匹配任务复杂度（PDF 第 74 页）。\n<p>判断标准：任务是否有多个可被检查的中间判断点；没有判断点的任务，链条只是拉长回答。<\/p>\n<\/ul>\n<h2>补充推演：分解粒度如何定到微任务<\/h2>\n<p>技巧 28 的层级从总体目标往下切（PDF 第 94 页）。推导粒度判断：<\/p>\n<ul><li>\n主要任务：产物的大块组成，如选题、大纲、正文。\n<\/li><li>\n子任务：每大块下的动作，如选题定主题方向，大纲列结构要点。\n<\/li><li>\n微任务：可直接下发一句提示词的最细动作，如选题定为“健康饮食的重要性”。\n<p>切到哪一层为止？标准是该层动作能用一句独立提示词完成，且产物可单独检查。再往下拆会把交互轮次堆高；停得太粗，单句提示词仍包含多个动作。<\/p>\n<\/ul>\n<h2>补充推演：反馈信号如何回流到上层<\/h2>\n<p>分解链路是 选题 → 大纲 → 正文。推导反馈回流方向：正文发现论据不足，问题可能出在选题范围太窄；大纲缺章节，问题可能出在上一层结构；选题偏差则要回到第一轮重定方向。反馈不能只改当前层措辞，要沿链路判断偏差源头。技巧 28 的三条反馈分别对准选题、大纲、内容（PDF 第 96 页），正是按层级定位偏差。<\/p>\n<h2>常见误读对照<\/h2>\n<ul><li>\n误读：任务分解等于把提示词写成长清单。分解是外部工作流程，每层一句提示词；长清单堆在单轮里会让模型同时处理多个判断点，失去分层意义。\n<\/li><li>\n误读：思维链越长回答越对。链条长只说明展开了更多步骤，步骤依据仍需核验；想得多不等于事实正确，见概念 c07。\n<\/li><li>\n误读：三轮对话必须走满三轮。第一轮提问已经覆盖受众、场景、约束时，可直接进入锁定路径；三轮是结构，不是固定轮次。\n<\/ul>\n<h2>补充算例<\/h2>\n<h3>算例 4：智能家居报告的层级拆分（技巧 28 试一试，PDF 第 96–97 页）<\/h3>\n<ul><li>\n总体目标：智能家居设备市场趋势研究报告。\n<\/li><li>\n主要任务：市场现状、未来趋势、竞品分析。\n<\/li><li>\n子任务：现状含规模、增速、驱动因素；趋势含政策与技术；竞品含份额与特点。\n<\/li><li>\n微任务：收集 2023–2024 规模数据；分析近五年增长率；列举三个驱动因素。\n<p>每层独立提示词下发，反馈后调整；某子任务数据不足时先补数据检索，不跳到正文写作。<\/p>\n<\/ul>\n<h3>算例 5：反例——路径依赖阻断升级<\/h3>\n<p>对话中反复追加“按我之前说的做”，模型不再重新评估方向（技巧 13 第三坑，PDF 第 51 页）。推导：路径依赖把上下文锁在旧方案里，新进展无法进入推理；纠偏动作是定期反问“基于最新进展，是否需要调整策略方向”。<\/p>\n<h3>算例 6：反例——命题过大导致失焦<\/h3>\n<p>“如何提升销量”覆盖品类、渠道、人群、价格全部未知（技巧 13，PDF 第 51 页）。推导演扫范围失焦的机制：命题越大，可关联因素越多，模型每个因素只能点到为止；缩小到“现有预算下母婴类复购率”后，因素集合收窄，推理才有落点。<\/p>\n<h2>补充推演：开放式提问与封闭指令的切换时机<\/h2>\n<p>三轮法前两轮偏开放，最后一轮收封闭。推导切换依据：<\/p>\n<ul><li>\n探索阶段问题未定义，开放式提问“有哪些可能维度”扩大候选，避免一上来锁死方向。\n<\/li><li>\n校准阶段信息逐步明确，提问转为定向追问“是否突出医疗级监测还是年轻潮玩属性”。\n<\/li><li>\n锁定阶段方向已定，指令必须封闭具体：受众、场景、诉求、要求逐项写明。\n<p>技巧 13 的手环案例走完这三步后，最终指令才包含 40+ 女性、家庭健康、子女远程关爱等明确要素（PDF 第 50 页）。顺序反了：第一轮就封闭，探索维度被跳过；第三轮仍开放，产物无法落地。<\/p>\n<\/ul>\n<h2>补充边界：分解不替代专业判断<\/h2>\n<p>任务分解降低结构混乱，不保证结论专业。分解后的每层产物都可能包含错误事实或偏差假设；层级越细，越容易把局部正确当成整体正确。每层检查除结构外，仍要核对依据与来源（概念 c07）。复杂法律、医疗、工程任务的分解框架可交给模型草拟，最终判断由具备资质的人负责。<\/p>\n<h2>补充对照：本书分步技巧的归位<\/h2>\n<p>技巧 13 的三轮对话法处理“问题空间如何展开”（PDF 第 48 页）；技巧 28 的任务分解处理“产物层级如何拆开”（PDF 第 93 页）；技巧 25 依据思考过程追问改进点（PDF 第 84 页）；技巧 26 用连续三句话推动任务前进（PDF 第 86 页）。前两者是结构方法，后两者是多轮推进手法；复杂长任务先定层级，再用三轮法逐层展开，反馈沿层级回流。<\/p>\n<h2>机制拆解：分步与分解如何压低一步到位的偏差<\/h2>\n<p>【机制解释】候选收缩：一步到位时，模型在第一句就要同时决定受众、角度、结构与措辞，多个未定义维度互相牵制，容易落到高频组合；分步把这些维度拆到不同轮次，每一步只收缩一个维度。 【机制解释】检查落点：分步后每一步产物都可以单独核对——受众定得对不对、角度偏不偏；错误在进入下一步之前暴露，不必等成品出来再整体推翻。 【机制解释】任务分解：复杂产物拆成层级后，每层只对上级结论负责；层级边界让局部修改不会牵动全文，也便于定位问题出在哪一层。 【经验推断】三轮法在前两轮保持开放、最后一轮收封闭，比全程封闭更能覆盖遗漏维度；这一条来自技巧 13 的实践归纳（PDF 第 48 页），轮次收益随任务复杂度递减。<\/p>\n<h2>算例 6：同一产品方案，一步到位与分步推进对照（可复核）<\/h2>\n<p>任务：为一款桌面加湿器设计推广方案。 提示词 A（一步到位）：<\/p>\n<pre><code>给桌面加湿器写一套推广方案。<\/code><\/pre>\n<p>预期输出落点：受众、卖点、渠道一次性铺开，各部分互相迁就，方案泛化；中途发现受众错了，只能整篇重写。 提示词 B（分步推进）：<\/p>\n<pre><code>第一步：先只列桌面加湿器可能的使用人群与对应痛点，不要写方案。\n第二步：基于上一步，选定一个主人群，说明为什么选它。\n第三步：再围绕这个人群写推广卖点与渠道。<\/code><\/pre>\n<p>逐段对比：<\/p>\n<ul><li>\n人群段：B 先发散多类人群再收敛，A 直接猜一个受众。\n<\/li><li>\n取舍段：B 的选择理由可见，错在人群时可只回退第二步；A 的受众藏在成品里，无法单独检查。\n<\/li><li>\n方案段：B 的卖点挂在已确认人群上，A 的卖点通用于所有小家电。\n<p>差异来源：B 把“定人群”与“写方案”分成两步，错误在第二步之前暴露；A 把所有维度压进一轮。分步增加轮次，但减少整篇返工概率。<\/p>\n<\/ul>\n<h2>常见误读补充<\/h2>\n<ul><li>\n误读：写了分步指令，输出就一定更准确。反例：分步只改善结构与可检查性，不补事实依据；步骤内的前提错误仍会被一步步带到成品里。\n<\/li><li>\n误读：思维链越长，分析越深入。反例：链条冗长可能包含重复推论与冗余铺垫；深度取决于每步是否推进到新前提，不取决于字数。\n<\/li><li>\n误读：任务拆得越细越好。反例：层级过多会增加交接成本与信息损耗；简单任务硬拆多层，反而把清晰问题复杂化。\n<\/ul>\n<h2>自检问题<\/h2>\n<ol><li>\n一步到位的回答为什么容易停在高频组合？\n<\/li><li>\n三轮对话法每一轮各解决哪个判断点？\n<\/li><li>\n任务分解的四个层级分别对应什么粒度？粒度切到哪一层为止？\n<\/li><li>\n反馈调整为什么要对准具体层，而不是整篇重写？正文偏差如何沿链路判断源头？\n<\/li><li>\n什么情况下不值得做任务分解？依据技巧 22 的什么判断？\n<\/ol><\/div><\/details>", "c06": "<div class=\"source-badge\">📖 出处：DeepSeek使用秘笈：从入门到精通的100个实用技巧 · p.112<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">提示词四要素：背景、需求、约束、输出格式<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">上下文、身份与记忆传输<\/a><\/span><\/div><h1>场景化提示词套路：办公、创作、营销<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章（原书第 4–6 章）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>场景化套路是把四要素骨架套到具体工作场景后形成的可复用提问模式：办公场景重结构与数据口径，创作场景重风格与情绪路径，营销场景重人群标签与转化目标。每个场景的提示词都由“受众背景 + 动作产物 + 风格或人群约束 + 格式长度”组成，差别只在约束清单。<\/p>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>跨工具使用时，用户容易把技巧记成一堆零散操作：PPT 找 Kimi、Word 找插件、小红书单独一套说法。困难在于看不出这些操作背后是同一套提示词骨架，换个工具就要重新学一遍。原书第 4 章覆盖 PPT、Word、Excel、WPS、飞书、Xmind、Draw、微信（PDF 第 112–139 页），第 5 章覆盖表达、升华、模仿、解构、选题、脚本、小红书、公众号（PDF 第 152–183 页），第 6 章覆盖画像、分群、推荐、评论、客服、黑话翻译（PDF 第 189–200 页）。抽象成套路后，新场景只要补对约束清单即可。<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n<strong>办公套路<\/strong>：产物是文档、表格、导图、流程；背景是岗位与项目阶段；约束是指标口径、模板结构；格式是分点、表格、层级。代表技巧：Word 续写与段落优化（技巧 35，PDF 第 114 页）、Excel 数据分析（技巧 36、37，PDF 第 121、125 页）、Xmind 思维导图（技巧 40，PDF 第 134 页）、Draw 流程图（技巧 41，PDF 第 137 页）。\n<\/li><li>\n<strong>创作套路<\/strong>：产物是文案、脚本、标题、段落；背景是产品与受众；约束是风格、情绪路径、敏感词；格式是标题长度、正文结构、互动话术。代表技巧：高情商表达（技巧 44，PDF 第 152 页）、主题升华（技巧 45，PDF 第 154 页）、风格模仿（技巧 46，PDF 第 156 页）、小红书黄金三角（技巧 51，PDF 第 168 页）。\n<\/li><li>\n<strong>营销套路<\/strong>：产物是画像、分群规则、推荐话术、评论归类；背景是客户数据与渠道；约束是人群标签、合规用语；格式是画像表、分群规则、话术分组。代表技巧：数据侦探与动态分群（技巧 58，PDF 第 189 页）、评论解读（技巧 60，PDF 第 195 页）、客服应答（技巧 61，PDF 第 197 页）。\n<\/ul>\n<p>正例（办公）：“从市场规模、技术瓶颈、政策支持三个维度，分析 2024 年预制菜行业趋势”（技巧 35，PDF 第 120 页）。正例（创作）：“为美白防晒霜设计首图文案，主打 24 小时防晒不脱妆，目标用户是经常户外拍摄的摄影师”（技巧 51，PDF 第 169 页）。反例：“帮我写点宣传的东西”——场景、受众、格式全缺。<\/p>\n<h2>原理推导<\/h2>\n<p>第一步，场景决定约束清单。办公产物要进工作流，口径与结构错了会被退回；创作产物要触达读者，风格与情绪路径错了没有传播；营销产物要匹配人群，标签与话术错了推送无效。 第二步，工具集成只解决上下文搬运。插件把当前文档或表格送进上下文（技巧 35，PDF 第 115–119 页），但指标口径、受众、合规边界仍要提示词交代。 第三步，创作套路沿“内容如何打动人”拆动作：语气调整改措辞，升华改立意，模仿改风格，解构改结构，选题与脚本改流程。每个动作对应一条可写进提示词的要求。 第四步，营销套路沿“如何识别并触达人群”拆环节：先拼画像，再按行为变化分群，最后按人群特征给话术；评论与客服是反向收集人群反馈的环节。 第五步，推出迁移方法：遇到新场景，先判断产物类型（办公/创作/营销），再从骨架四要素填本场景变量，最后查本场景专属约束（行业口径、平台规则、合规红线）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：任务能归入三类产物之一；有明确受众与使用场景；材料可作为上下文传入。\n<\/li><li>\n条件去掉会怎样：不交代口径 → 表格结论数字不可用；不交代受众 → 文案语气错位；不喂数据 → 营销画像无依据。\n<\/li><li>\n失败案例：技巧 51 提醒敏感词过滤，“最便宜”要改成“性价比天花板”，不提“治疗功效”（PDF 第 170 页）；技巧 58 提醒广撒网推送被噪声淹没，画像与分群是前提（PDF 第 189 页）。\n<\/li><li>\n边界：套路只解决产物生成，不替代业务判断；办公数据需核验，营销合规需前置，创作事实需核对。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>办公 vs 创作<\/strong>：办公约束偏内部口径与结构，创作约束偏外部受众与情绪；同一篇方案，对内汇报走办公套路，对外宣传走创作套路。\n<\/li><li>\n<strong>创作 vs 营销<\/strong>：创作控制“怎么说”，营销控制“对谁说、说什么”；文案在营销链路里是最后一环，前面有画像与分群。\n<\/li><li>\n<strong>场景套路 vs 少样本示例<\/strong>：套路给的是结构化要求，示例是附加风格样本；套路可迁移，示例易被照搬（概念 c04）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c02 四要素、概念 c03 上下文。后继：概念 c07 在套路之上加核验、合规与知识库；概念 c08 把套路迁移到私人场景；概念 c10 把固定流程沉淀为智能体。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[场景判断] --&gt; B[办公: 口径+结构]\nA --&gt; C[创作: 风格+情绪路径]\nA --&gt; D[营销: 人群标签+转化目标]\nB --&gt; E[骨架: 背景+需求+约束+格式]\nC --&gt; E\nD --&gt; E\nE --&gt; F[产物生成]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>技巧 35（PDF 第 114 页）<\/td><td>Word 集成<\/td><td>插件搬文档，提示词定维度与结构<\/td><\/tr><tr><td>技巧 37（PDF 第 125 页）<\/td><td>Excel 分析<\/td><td>五招数据超能力：清洗、统计、口径、结论、可视化<\/td><\/tr><tr><td>技巧 46（PDF 第 156 页）<\/td><td>风格模仿<\/td><td>给风格线索：用词、句式、人称<\/td><\/tr><tr><td>技巧 51（PDF 第 168 页）<\/td><td>小红书黄金三角<\/td><td>首图钩子、标题关键词、正文私聊路径<\/td><\/tr><tr><td>技巧 58（PDF 第 189 页）<\/td><td>精准营销<\/td><td>画像、动态分群、个性推荐<\/td><\/tr><tr><td>技巧 62（PDF 第 199 页）<\/td><td>黑话翻译<\/td><td>把甲方语言翻成可执行指令<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>相关概念<\/h2>\n<p>提示词四要素、上下文与身份、核验合规与知识库、场景迁移<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（场景化提示词套路：办公、创作、营销）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：三类场景套路的结构分解与对照算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>往回追前提：<\/p>\n<ol><li>\n四要素骨架（背景、需求、约束、格式）对所有任务通用；场景差异体现在每要素填什么变量。\n<\/li><li>\n不同产物的使用方式不同：办公产物进入内部流程，创作产物面向公众注意力，营销产物匹配特定人群；使用方式决定约束清单。\n<\/li><li>\n工具插件只完成材料搬运，不替用户定义任务；任务定义仍由提示词承担。\n<\/li><li>\n场景套路是骨架的垂直实例化，不是另一套独立方法。\n<\/ol>\n<p>依赖链方向：通用骨架 → 产物使用方式 → 场景约束清单 → 具体提示词。新场景出现时，先归产物类型，再填变量；跳过归类型直接背技巧，会把工具操作误当成方法。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：推导办公场景约束从哪来<\/h3>\n<p>办公产物要被同事、上级或流程接收，错误代价是返工。技巧 35 的 Word 流程：插件加载后输入主题，Alt+Q 召唤生成；段落优化把口语句升级为书面表述（PDF 第 117–119 页）。推导：办公提示词必须交代三件事——材料范围（当前文档/附件）、分析维度（市场规模、瓶颈、政策）、产物结构（分点论述）。技巧 37 的 Excel 五招从表格小白到分析大师（PDF 第 125 页），数据类任务还要补指标口径与时间范围，否则结论数字无法对账。<\/p>\n<h3>第二步：推导创作场景动作链<\/h3>\n<p>技巧 44 高情商表达：给定原句、双方关系、语气边界，只换措辞不改意思（PDF 第 152 页）。技巧 45 升华主题：在原文事实之上提炼立意，不凭空拔高（PDF 第 154 页）。技巧 46 模仿风格：给用词、句式、人称线索（PDF 第 156 页）。技巧 47 公文解构：输入原文，输出要点列表与底层逻辑（PDF 第 159 页）。推导：创作动作按“措辞 → 立意 → 风格 → 结构 → 选题脚本”分层；每层要求不同，提示词要点名当前处理哪一层。<\/p>\n<h3>第三步：推导小红书黄金三角的提示词结构<\/h3>\n<p>技巧 51 把笔记拆成首图、标题、正文（PDF 第 168–170 页）：<\/p>\n<ul><li>\n首图：痛点扎心 + 方案发光，文案不超过七个字；输入给核心卖点与用户画像。\n<\/li><li>\n标题：关键词 + 反常识 + 吊胃口；关键词来自行业黑话与产品词。\n<\/li><li>\n正文：先卖惨、再逆袭、最后甩王炸；用对比实验与互动话术收尾。\n<p>推导：三角对应三个独立产物部件，每个部件有自己的约束；提示词一次只生成一个部件，避免把标题、正文要求混在一句里。敏感词约束贯穿三角：不提治疗功效、不用绝对化用语。<\/p>\n<\/ul>\n<h3>第四步：推导营销场景的环节链<\/h3>\n<p>技巧 58 三步（PDF 第 189–191 页）：<\/p>\n<ul><li>\n数据侦探：把 CRM、订单、到店频次等碎片拼成画像标签。提示词给数据源附件与筛选规则。\n<\/li><li>\n动态分群：按行为变化调整人群归属，如孕妈搜索修复内容后转入新手妈妈群。提示词给分群触发条件与迁移规则。\n<\/li><li>\n个性推荐：按价格敏感、品质、社交三类特征包装话术。提示词给人群类型与沟通角度。\n<p>推导：营销提示词的质量取决于数据与规则喂得是否具体；只给“做个营销方案”，模型在画像层就没有材料。技巧 60 把评论作为反向数据：归类情绪、提炼投诉点（PDF 第 195 页）；技巧 61 把常见问题与应答边界固定为客服口径（PDF 第 197 页）。<\/p>\n<\/ul>\n<h3>第五步：推导跨场景迁移步骤<\/h3>\n<p>遇到新任务：先判产物类型；再按骨架填背景（受众/岗位）、需求（动作/产物）、约束（口径/风格/标签）、格式（结构/长度）；最后查场景专属规则。工具更换不改变这套步骤，只改变材料传入方式。<\/p>\n<h2>算例<\/h2>\n<h3>算例 1：办公分析提示词对照（技巧 35，PDF 第 120 页）<\/h3>\n<p>弱版本：“分析预制菜行业。”缺维度、缺年份、缺结构。 强版本：“从市场规模、技术瓶颈、政策支持三个维度，分析 2024 年预制菜行业发展趋势。”背景：2024 年预制菜；需求：三维度分析；约束：三个指定维度；格式：分点论述。<\/p>\n<h3>算例 2：小红书标题生成（技巧 51，PDF 第 169 页）<\/h3>\n<p>输入：“主题是露营装备推荐，关键词包含轻量化、多功能、颜值。”模型输出“轻过手机的黑科技帐篷，竟能变身星空影院？” 推导：关键词进标题前半段，反常识与疑问句承担吊胃口；格式上标题用数字反差与表情分隔，不超过两个表情符号。<\/p>\n<h3>算例 3：营销画像规则（技巧 58，PDF 第 190 页）<\/h3>\n<p>输入：“创建健身咖啡族画像，筛选近 30 天购买过美式咖啡，且运动类 App 每周使用时长超过 5 小时的用户。”附件：咖啡购买记录、运动 App 行为数据。 推导：规则含时间窗、行为条件、数据源；模型识别 4286 名用户后按下单时段与搭配偏好给推送策略。没有数据附件时，画像规则只能停在假设。<\/p>\n<h3>算例 4：反例——广撒网推送<\/h3>\n<p>连锁咖啡店给所有人推同款买一送一冰美式；健身爱好者举铁时收到，乳糖不耐受顾客看到拿铁广告摇头（技巧 58，PDF 第 189 页）。失败环节：画像与分群缺失，人群标签这一约束未进入提示词，话术对所有人同一版本。<\/p>\n<h2>假设与边界<\/h2>\n<p>推导假设：上传的数据与文档可被模型读取并按规则筛选；数据本身失真会传导到画像结论。场景套路不替代专业判断：办公数字需核验（概念 c07），营销话术需合规审查，创作内容需核对事实。平台规则会更新，敏感词清单要随平台要求调整。<\/p>\n<h2>补充推演：办公产物的口径一致性推演<\/h2>\n<p>办公材料进入流程后会被对账、引用、汇总。推导口径错误的传导：指标定义不一致（如“销售额”含不含退款），表格统计、结论建议、汇报引用沿同一错误口径走，偏差逐级放大。因此办公提示词必须先锁口径：指标名称、统计时间、对比范围、数据源附件。技巧 37 的数据超能力链条从清洗开始（PDF 第 125 页），清洗规则就是口径规则；口径未交代时，模型按常见定义计算，与公司实际口径可能不同。<\/p>\n<h2>补充推演：创作情绪路径的分层控制<\/h2>\n<p>创作产物打动人靠情绪路径。技巧 51 正文三步走：先卖惨、再逆袭、最后甩王炸（PDF 第 170 页）。推导：情绪路径是结构安排，不是形容词堆砌；提示词要交代每一段承担什么情绪动作。技巧 44 高情商表达只换措辞不改意思（PDF 第 152 页），技巧 45 升华立意不凭空拔高（PDF 第 154 页），两层动作分开控制：措辞层改语气，立意层改提炼角度；混在一句“写得感人一点”里，模型只能在形容词层发力。<\/p>\n<h2>补充推演：营销链路的数据依赖顺序<\/h2>\n<p>技巧 58 三步有严格先后（PDF 第 189–191 页）：<\/p>\n<ol><li>\n画像依赖原始行为数据；数据未喂入，标签无法生成。\n<\/li><li>\n分群依赖画像标签与行为变化规则；标签缺失，分群只能按人口统计粗分。\n<\/li><li>\n话术依赖分群结果；人群不明，话术只能通用版本。\n<p>推导：链路上游缺材料，下游话术再打磨也不精准。技巧 60 评论归类是反向数据流：用户反馈文本回到画像与话术优化环节（PDF 第 195 页）；技巧 61 客服边界把常见问题与禁忌固定下来（PDF 第 197 页），避免应答现场发挥。<\/p>\n<\/ol>\n<h2>常见误读对照<\/h2>\n<ul><li>\n误读：办公与创作的差别只是文本风格。实质差别在验收标准：办公看口径与结构是否可进流程，创作看受众是否被打动；同一篇对外宣传稿，对内汇报版本走办公套路，对外发布版本走创作套路。\n<\/li><li>\n误读：营销效果主要取决于文案水平。技巧 58 案例显示推送精准度来自画像与分群（PDF 第 189 页）；文案是链路最后一环，上游数据缺失时文案无法补救。\n<\/li><li>\n误读：换软件就要换一套提示词。工具只改变材料传入方式，四要素骨架不变；先核对插件是否把文档送进上下文，再补口径与格式要求。\n<\/ul>\n<h2>补充算例<\/h2>\n<h3>算例 6：Excel 分析提示词要素<\/h3>\n<p>背景：近一年门店销售表（附件）；需求：找出销售额下滑的三个品类；约束：剔除开业不足三个月的新店；格式：表格列品类、下滑幅度、可能原因，数据注明统计月份。对照技巧 36、37（PDF 第 121、125 页）：缺约束时新店开业波动会被误判为品类下滑。<\/p>\n<h3>算例 7：标题与正文分部件生成<\/h3>\n<p>先单独生成首图文案（痛点 + 方案，七字内）；再单独生成标题（关键词 + 反常识 + 疑问句）；最后生成正文（卖惨—逆袭—王炸）。推导：三部件约束不同，混在一条提示词里互相挤占；分部件生成后再拼接，避免标题套路进正文、正文长度压过标题。<\/p>\n<h3>算例 8：反例——无数据画像<\/h3>\n<p>“给年轻女性推荐产品”：年龄性别是唯一标签，收入、场景、偏好全部缺失。推导：画像只到人口统计层，分群与个性推荐无依据；技巧 58 的健身咖啡族规则需要行为条件与数据源附件（PDF 第 190 页）。<\/p>\n<h2>补充推演：跨工具集成时的上下文边界<\/h2>\n<p>办公插件把文档送进上下文，但插件能力有边界。推导常见缺口：<\/p>\n<ul><li>\n插件只传当前打开的文档，历史版本、关联表格、邮件往来不在其中，需要作为附件补传。\n<\/li><li>\n插件提供的续写、段落优化只处理文本表层，数据口径与业务前提仍由提示词交代。\n<\/li><li>\n重要文档建议保留修改痕迹，便于回溯 AI 改了哪些句子（技巧 35，PDF 第 120 页）。\n<p>工具清单（PPT、Word、Excel、WPS、飞书、Xmind、Draw、微信）换的是材料入口与产物出口，任务定义与核验环节不随工具改变。<\/p>\n<\/ul>\n<h2>补充推演：创作场景的事实底线<\/h2>\n<p>创作套路控制表达方式，但表达内容仍受事实约束。推导分层：<\/p>\n<ul><li>\n风格层：语气、句式、情绪路径，可按目标受众调整。\n<\/li><li>\n事实层：产品参数、用户案例、数据结果，不能为煽情改写。\n<\/li><li>\n合规层：功效宣称、对比表述、敏感词，按平台与广告规则排除。\n<p>技巧 48 的版权合规扫描是创作后的独立环节（PDF 第 163 页）；技巧 51 的敏感词提醒要求把“治疗功效”类表述换成体验描述（PDF 第 170 页）。三层混在一句“写得吸引人”里时，模型优先处理风格层，事实与合规容易漏掉。<\/p>\n<\/ul>\n<h2>补充推演：营销话术的人群匹配回溯<\/h2>\n<p>话术产出后要回到人群假设检查。推导回溯链：话术引用的痛点是否对应画像标签；优惠形式是否匹配价格敏感/品质/社交类型；推送时段是否对照行为数据。技巧 58 的效果追踪环节用点击热力图与转化率数据回看哪些文案被阅读、哪个时段转化最高（PDF 第 192 页）。话术不是一次性产物，反馈数据回流后调整画像与分群规则，链路闭环。<\/p>\n<h2>补充对照：本书场景技巧的归位<\/h2>\n<p>办公侧：技巧 34 PPT、技巧 35 Word、技巧 36/37 Excel、技巧 40 Xmind、技巧 41 Draw（PDF 第 112–137 页）；创作侧：技巧 44–47 表达与解构、技巧 51 小红书、技巧 52 分镜脚本（PDF 第 152–171 页）；营销侧：技巧 58 画像分群、技巧 60 评论解读、技巧 61 客服、技巧 62 黑话翻译（PDF 第 189–199 页）。回查时先定位产物属于哪一类，再套用对应约束清单。<\/p>\n<h2>机制拆解：场景清单如何把通用模板压成可用产物<\/h2>\n<p>【机制解释】约束替换：办公、创作、营销三类场景的差异集中在约束清单上——办公围着协作与口径，创作围着受众与情绪路径，营销围着画像与转化；换场景时替换清单，动作链保持不变。 【机制解释】候选过滤：场景约束把不属于本场景的表达先排除（办公稿不做情绪煽动，营销稿不堆内部术语），生成时候选空间沿场景口径收窄。 【机制解释】工具边界：插件只负责把文档送进上下文、把产物导出为对应格式，业务前提与数据口径仍要在提示词里交代；工具不替用户理解项目。 【经验推断】三类场景各有一套高频提示骨架，套用骨架比从零写提示词更省轮次；这一条来自本书第 4–6 章技巧归纳（PDF 第 112–199 页），骨架只起起点作用，具体项目仍需补背景。<\/p>\n<h2>算例 6：同一产品信息，办公邮件与营销话术两种提示词对照（可复核）<\/h2>\n<p>产品事实：一款 12 寸便携屏，重 780 克，接口支持全功能 Type-C。 提示词 A（办公场景，内部进度邮件）：<\/p>\n<pre><code>把以上参数整理成给团队的进度邮件：先说明当前规格已定，再列待确认项，语气平实，不加宣传用语。<\/code><\/pre>\n<p>预期输出落点：条目化进度汇报，参数作为事实列出，无卖点渲染。 提示词 B（营销场景，社交平台种草文案）：<\/p>\n<pre><code>把以上参数改写成面向通勤办公族的种草文案：从“背包重量”和“一线连笔记本”切入，先讲使用场景，再点参数，结尾给一句行动引导。<\/code><\/pre>\n<p>逐段对比：<\/p>\n<ul><li>\n开头：A 交代进度状态，B 先描述通勤场景。\n<\/li><li>\n参数处理：A 平铺参数供核对，B 把重量与接口翻译成使用感受。\n<\/li><li>\n语气：A 克制中立，B 带引导性；同一参数在两类产物中位置与说法不同。\n<p>差异来源：约束清单不同决定了候选表达的方向；产品事实不变，变的是场景口径。复核时先确认产物属于哪一类，再检查口径是否跑偏。<\/p>\n<\/ul>\n<h2>常见误读补充<\/h2>\n<ul><li>\n误读：一套场景模板可以跨行业直接套。反例：行业术语、法规口径与受众心理不同；模板只提供结构，行业约束仍要逐条补进清单。\n<\/li><li>\n误读：套了场景套路就不用核验。反例：套路改善表达与结构，不保证事实与合规；营销话术里的功效宣称、对比表述仍需按概念 c07 复核。\n<\/li><li>\n误读：接上办公插件，业务前提就自动进了上下文。反例：插件只传当前打开的文档，历史版本、关联表格与业务背景不在其中；缺的前提要作为附件或提示词补传。\n<\/ul>\n<h2>自检问题<\/h2>\n<ol><li>\n三类场景的约束清单分别围绕什么展开？\n<\/li><li>\n办公提示词为什么必须补指标口径与时间范围？口径错误如何沿链路传导？\n<\/li><li>\n小红书三角各对应什么产物部件？提示词为什么要分部件生成？\n<\/li><li>\n营销三步链中，哪一步缺数据会让后续话术失去依据？\n<\/li><li>\n工具插件在场景套路中负责哪一步？任务定义由谁承担？\n<\/ol><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：DeepSeek使用秘笈：从入门到精通的100个实用技巧 · p.141<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">上下文、身份与记忆传输<\/a><\/span><\/div><h1>核验、合规与定制知识库（RAG 雏形）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书第 4–6 章，方法依据第 3 章）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>核验是在接收回答前区分已验证事实、行业共识与合理推测，并要求标注来源与计算逻辑；合规是把法律、广告、伦理约束前置进提示词；定制知识库是把企业内部文档投喂给系统，检索相关片段后再让模型作答，使回答依据可追溯。三者分别堵住“编造事实”“踩红线”“内部资料不在模型记忆里”三类缺口。<\/p>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>模型续写通顺文本时，会把推测、套话和合理想象包装成权威表述；不核验就照单全收，可能把错误数字带进正式材料。技巧 30 记录医疗市场部案例：模型宣称“国际医学会推荐每日摄入 2000mg 维生素 C”，真实指南建议量约 100mg（PDF 第 100 页）。同时，敏感领域有明确合规边界，提示词不前置约束时，模型会在常见话术库里自由组合（技巧 29，PDF 第 98 页）。第三，公司制度、合同、纪要不在模型训练记忆中，每次口述上下文容易漏传版本（技巧 43，PDF 第 142 页）。<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n<strong>核验三招<\/strong>（技巧 30，PDF 第 100–101 页）：划定能力禁区，专业领域标注“需执业医师确认”；要求说明来源，按已验证事实、行业共识、合理推测分类；要求数据说话，统计数据注明来源，估算提交计算逻辑。\n<\/li><li>\n<strong>合规前置<\/strong>（技巧 29，PDF 第 99 页）：在提示词开头写明适用法规与禁止项，如“方案需符合广告法，不得包含虚假宣传”；重要决策先让模型分析可能的伦理争议与法律问题。\n<\/li><li>\n<strong>定制知识库<\/strong>（技巧 43，PDF 第 142–149 页）：把 PDF、Word、TXT 投喂进系统，文档被分解成知识颗粒；按部门或项目建库，定期更新、剔除过期资料；提问用“场景 + 具体需求 + 格式要求”，回答标注出处文档与页码；敏感信息分级、加水印、留溯源记录。\n<\/li><li>\n<strong>RAG 雏形机制<\/strong>（自拟机制解释）：文档切块 → 转成可检索的数字表示 → 提问时检索相似片段 → 片段进入上下文 → 模型基于片段作答。本书技巧 43 描述了投喂、提问与权限环节；嵌入模型选型在第 11 章技巧 100 展开（PDF 第 310 页）。\n<\/ul>\n<p>正例：“所有统计数据请注明来源，如果是估算，请提交计算逻辑”（技巧 30，PDF 第 101 页）；“根据 2023 年 Q4 营销复盘报告，找出华北区渠道拓展的三个关键动作”（技巧 43，PDF 第 148 页）。反例：直接采纳模型给的维生素 C 剂量；先生成保健品话术再事后筛违规词。<\/p>\n<h2>原理推导<\/h2>\n<p>第一步，编造内容的来源是训练分布中的高频说法。模型为保证文本通顺，会在缺事实时填入听起来合理的表述；语气不区分事实与推测，读者难以凭语感分辨。 第二步，核验要求把内容分层。技巧 30 的分类指令让模型标注“已验证事实 / 行业共识 / 合理推测”（PDF 第 100 页）；分层后，推测部分需要额外证据才能进入正式材料。来源与计算逻辑要求把可追溯路径摆出来：数据来自普查还是问卷、样本覆盖哪些城市、什么时间调查。 第三步，合规约束在生成前删除违规分支。前置法规与禁止项，模型在候选空间里先排除不合规话术；事后筛选等于先生成再丢弃，违规内容可能已经流出（技巧 29，PDF 第 99 页）。 第四步，知识库解决“内部资料不在记忆中”。模型训练资料不含你公司的合同与纪要；投喂后，检索片段作为上下文进入本轮回答，结论可以回指出处文档。技巧 43 的溯源功能让每个回答标注出处文档及页码（PDF 第 149 页）。 第五步，推出三层防线：知识库保证依据来自内部资料，合规前置保证不踩红线，核验分层保证不把推测当事实。三层各管一段，不能互相替代。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：材料可数字化上传；结论需要追溯来源；领域有明确法规或平台规则；内部文档需要跨会话复用。\n<\/li><li>\n条件去掉会怎样：不核验 → 编造数字混入材料；不合规前置 → 违规话术进入候选；不建知识库 → 每次重新口述、版本易过期。\n<\/li><li>\n失败案例：技巧 30 的维生素 C 剂量错误（PDF 第 100 页）；技巧 29 中保健品话术触发安全警告、八卦模板导致账号临时冻结（PDF 第 98 页）；技巧 43 中扫描件不可识别、关键词检索失效（PDF 第 150 页）。\n<\/li><li>\n边界：知识库检索到的旧文档本身可能过期，需要定期更新；核验不能替代专业资质，医疗法律金融结论仍需执业人员确认。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>核验 vs 合规<\/strong>：核验回答“这条内容可不可信”，合规回答“这条内容允不允许出现”；一个对事实负责，一个对规则负责。\n<\/li><li>\n<strong>知识库 vs 附件<\/strong>：附件是单次上传，知识库是跨会话沉淀并支持检索；资料量大、复用频次高时用知识库。\n<\/li><li>\n<strong>RAG 雏形 vs 模型记忆<\/strong>：模型记忆来自训练，不可更改；知识库内容随文档更新而替换；回答依据来自检索片段，不代表模型“学会了”这些资料。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c03 上下文、概念 c02 四要素。后继：概念 c09 本地部署处理知识库与敏感数据的存放位置；概念 c10 把知识库绑定进智能体配置。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[内部文档] --&gt; B[投喂知识库: 切块+数字表示]\nC[提问] --&gt; D[检索相似片段]\nB --&gt; D\nD --&gt; E[片段进入上下文]\nE --&gt; F[模型作答]\nF --&gt; G[合规前置: 排除违规分支]\nF --&gt; H[核验分层: 事实/共识/推测+来源]\nG --&gt; I[可追溯材料]\nH --&gt; I<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>技巧 24（PDF 第 81 页）<\/td><td>回答有依据<\/td><td>给法规、学术、行业标准作为基准<\/td><\/tr><tr><td>技巧 29（PDF 第 98 页）<\/td><td>信息合规<\/td><td>理解边界、约束前置、预判决策影响<\/td><\/tr><tr><td>技巧 30（PDF 第 100 页）<\/td><td>三招避坑<\/td><td>划禁区、说明来源、用数据说话<\/td><\/tr><tr><td>技巧 43（PDF 第 141 页）<\/td><td>定制知识库<\/td><td>文档投喂、人话提问、权限分级<\/td><\/tr><tr><td>技巧 48（PDF 第 163 页）<\/td><td>版权合规扫描<\/td><td>文字合规检查作为创作后环节<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>相关概念<\/h2>\n<p>上下文与身份、场景化套路、本地部署、智能体构造要素<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（核验、合规与定制知识库（RAG 雏形））<\/summary><div class=\"depth-body\"><h1>c07 深度推导：编造来源、合规分支与检索回路<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>往回追前提：<\/p>\n<ol><li>\n模型生成文本以通顺性为直接目标，不自动判断每条陈述是否有证据；缺证据时填入高频合理表述。\n<\/li><li>\n回答的可信度取决于依据来源：已验证事实、行业共识、合理推测的证据强度不同。\n<\/li><li>\n合规规则是外部约束，模型不掌握你所在行业的具体法条与平台规则，需要在提示词或知识库中显式给出。\n<\/li><li>\n内部资料不在训练记忆中；要让回答引用内部资料，必须先把资料变成可检索的上下文片段。\n<\/ol>\n<p>依赖链方向：通顺生成机制 → 事实缺口被推测填充 → 核验分层与来源要求 → 合规前置删分支 → 知识库补内部依据。三层防线分别对应事实、规则、资料缺口；缺哪一层，对应风险就从哪一层进来。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：推导编造内容如何进入正式材料<\/h3>\n<p>技巧 30 案例：维生素 C 建议量被写成每日 2000mg，真实指南约 100mg（PDF 第 100 页）。推导链条：模型没有该指南条文在上下文中 → 从训练分布里取一个听起来合理的剂量数字 → 用权威语气写出 → 读者从语气判断可信度，发现不了数字失真。缺口不在表达能力，而在依据未被传入与标注。<\/p>\n<h3>第二步：推导核验三招各自截住什么<\/h3>\n<p>技巧 30 三招（PDF 第 100–101 页）：<\/p>\n<ul><li>\n能力禁区：“本次回答仅限于整理公开资料，涉及专业医学建议请标注‘需执业医师确认’。”推导：先限定任务范围，模型不越界给专业结论。\n<\/li><li>\n来源分层：“按已验证事实、行业共识、合理推测分类标注。”推导：三类陈述的证据强度被显式区分；推测部分不能直接当事实引用。\n<\/li><li>\n数据说话：“统计数据注明来源，估算提交计算逻辑。”推导：每个数字可被回溯到样本范围、调查时间与计算方式；经不起追问的数据在这一步暴露。\n<p>三招叠加：范围先收窄，分层再标注，数据最后追溯。<\/p>\n<\/ul>\n<h3>第三步：推导合规约束为什么要前置<\/h3>\n<p>技巧 29 记录两类翻车：中老年保健品话术触发安全警告；明星八卦爆料模板导致账号功能冻结（PDF 第 98 页）。推导：提示词不写合规边界时，模型从常见营销话术库里组合，广告法、未成年人保护、伦理红线分支没有被预先删除；先生成再筛，违规文本已经离开对话框。前置写法：“方案需符合广告法，不得包含虚假宣传”“儿童零食营销策略需通过伦理审查”（PDF 第 99 页）。合规约束在候选空间里先删分支，与概念 c02 的约束要素是同一机制。<\/p>\n<h3>第四步：推导知识库检索回路（RAG 雏形）<\/h3>\n<p>自拟机制解释，分四步：<\/p>\n<ol><li>\n文档切块：整份合同或纪要按段落切成知识颗粒，技巧 43 类比为“把整头牛分解成牛排、牛腩、牛尾”（PDF 第 143 页）。\n<\/li><li>\n数字表示：每块文本转成向量（嵌入模型在技巧 100 选 BAAI/bge-m3，PDF 第 310 页），供相似度比较。\n<\/li><li>\n检索：提问时找出与问题最相似的若干片段，进入本轮上下文。\n<\/li><li>\n作答与溯源：模型基于片段作答，回答标注出处文档与页码（技巧 43，PDF 第 149 页）。\n<p>推导：检索回路把“模型记忆里有没有”换成“资料库里有没有”；资料更新后重新切块入库，回答依据随之更新。<\/p>\n<\/ol>\n<h3>第五步：推导权限与更新要求<\/h3>\n<p>技巧 43 的权限三件套：角色分级（CEO 看并购预案，实习生只看考勤制度）、水印防护、溯源功能（PDF 第 149 页）。更新要求：按部门建库，每月喂最新报告，剔除旧版制度（PDF 第 147、150 页）。推导：知识库不是投喂一次就结束；权限控制避免敏感资料越权可见，更新机制避免过期资料被当成现行依据。<\/p>\n<h2>算例<\/h2>\n<h3>算例 1：投资理财文章的核验指令（技巧 30 试一试，PDF 第 101 页）<\/h3>\n<p>任务：写股票投资建议文章。 提示词要素：划定禁区（不构成投资建议）；分层标注（事实/共识/推测）；数据注来源与样本；预测部分区分现行政策延伸与市场传闻。 推导：四步把“看起来专业的建议”拆成可核查材料；用户只对已验证事实部分做决策引用。<\/p>\n<h3>算例 2：知识库对比问答（技巧 43，PDF 第 148 页）<\/h3>\n<p>提问：“你是从业十年的法务专家，请用表格对比 2021 版和 2023 版《数据安全法》中关于个人信息保护的差异点，并标注法律条文编号。” 推导：场景（法务对比）、具体需求（两版差异）、格式（表格 + 条文编号）齐全；资料来自已入库法规文本，回答可回指出处。对照错误示范“找市场策略”——无场景、无需求、无格式，检索与生成都失焦。<\/p>\n<h3>算例 3：反例——过期知识库<\/h3>\n<p>假设知识库里仍存 2020 年旧版制度，提问按现行制度找流程。推导：检索命中旧文档，模型把旧条款当现行依据输出；技巧 43 要求剔除过期食品（PDF 第 147 页）。修正：定期更新与版本标注，检索结果先核对文档日期。<\/p>\n<h2>假设与边界<\/h2>\n<p>推导假设：上传文档文字清晰可识别；扫描件需先转文字版，否则“知识消化不良”（技巧 43，PDF 第 150、313 页）。知识库只提升内部资料可追溯性，不保证模型推理无误；检索片段之间矛盾时，仍需人工判断版本与效力。合规清单随法规与平台规则更新，模型不自动掌握最新条文。<\/p>\n<h2>补充推演：事实、共识、推测的证据强度分层<\/h2>\n<p>技巧 30 要求把回答按三类标注（PDF 第 100 页）。推导三类的证据差异：<\/p>\n<ul><li>\n已验证事实：可回到公开资料、法规条文、内部记录核对，样本范围与时间明确。\n<\/li><li>\n行业共识：多份资料重复出现但无单一权威出处，属通行看法。\n<\/li><li>\n合理推测：模型基于趋势外推，没有直接证据，随假设变化。\n<p>证据强度依次递减；进入正式材料时，只有第一类可直接引用，第二类需注明来源范围，第三类只能作为待验证假设。核验动作就是把混在一段通顺文本里的三类内容拆开，而不是整体接受或整体否定。<\/p>\n<\/ul>\n<h2>补充推演：检索片段与模型生成的拼接位置<\/h2>\n<p>RAG 雏形回路中，检索片段进入上下文后，模型基于片段组织回答。推导拼接点的风险：<\/p>\n<ul><li>\n片段过期：检索到旧制度，模型按旧条文作答。\n<\/li><li>\n片段矛盾：多份文档版本冲突，模型可能拼接出混合表述。\n<\/li><li>\n片段不相关：检索关键词偏差，片段与问题表面相近但实质不符。\n<p>因此回答标注出处文档与页码（技巧 43，PDF 第 149 页）是必要环节：有出处才能核对版本与相关性；无出处的“引用”无法回溯，按推测处理。<\/p>\n<\/ul>\n<h2>补充推演：合规约束的可执行性要求<\/h2>\n<p>合规提示词必须写成可核对规则，不能是口号。推导：<\/p>\n<ul><li>\n可执行：“符合广告法，不使用绝对化用语，不承诺治疗功效”——模型可在生成时排除对应分支。\n<\/li><li>\n不可执行：“注意合规”——没有具体禁止项，模型不知道删哪些分支。\n<p>技巧 29 的正向写法：限定在医学共识范围内建议；依据证监会规定评估；通过伦理审查（PDF 第 99 页）。规则越具体，候选空间删除越精确；规则空泛，合规分支仍留在候选内。<\/p>\n<\/ul>\n<h2>常见误读对照<\/h2>\n<ul><li>\n误读：开了知识库就不需要核验。知识库保证依据来自内部资料，不保证资料现行、正确；旧文档与错误文档同样会被检索到，版本核对仍是人工环节。\n<\/li><li>\n误读：合规是法务事后的事。技巧 29 的前置做法在生成前删分支；事后筛稿等于先产生违规文本再丢弃，流出风险已经存在。\n<\/li><li>\n误读：模型标注“已验证事实”就可以直接引用。标注是模型自我分类，仍需回到原始来源抽查；模型也可能把推测误标为事实。\n<\/ul>\n<h2>补充算例<\/h2>\n<h3>算例 9：数据追问链<\/h3>\n<p>模型输出“Z 世代购房意愿下降 30%”。核验追问：数据来自普查还是街边问卷？样本覆盖几个城市？调查时间是否包含促销节点？估算部分提交计算逻辑（技巧 30，PDF 第 101 页）。推导：三个问题分别核对来源类型、样本范围、时间偏差；答不上来的数据按推测处理，不进入报告。<\/p>\n<h3>算例 10：知识库提问对照<\/h3>\n<p>错误：“找市场策略”——无场景、无对象、无格式，检索与作答都失焦（技巧 43，PDF 第 148 页）。 正确：“根据 2023 年 Q4 营销复盘报告，找出华北区渠道拓展的三个关键动作。”场景、时间范围、对象、数量明确，检索片段可对准章节，输出可回指出处。<\/p>\n<h3>算例 11：反例——扫描件入库<\/h3>\n<p>扫描版合同未转文字就投喂，模型读不到文字层（技巧 43，PDF 第 150 页；技巧 100 同类问题，PDF 第 313 页）。推导：切块后无可识别文本，检索无匹配片段；回答退回到通用假设，却披着“基于知识库”的外衣，比无知识库更难发现问题。<\/p>\n<h2>补充推演：知识库分库与权限的设计理由<\/h2>\n<p>技巧 43 建议按部门或项目建库：财务部喂报表，法务部喂合同（PDF 第 146 页）。推导分库理由：<\/p>\n<ul><li>\n检索范围缩小后，命中片段与问题更相关；混库时人事制度可能被财务问题检索到。\n<\/li><li>\n权限分级与库对应：不同角色可见不同库，敏感资料不进入公共检索范围。\n<\/li><li>\n维护责任到部门：哪份资料过期由对应部门更新，避免全库无人维护。\n<p>权限三件套（角色分级、水印、溯源）在分库基础上生效（PDF 第 149 页）；不分库只设角色，检索范围仍混在一起，越权风险靠事后拦截。<\/p>\n<\/ul>\n<h2>补充推演：检索质量对回答质量的决定作用<\/h2>\n<p>RAG 回路中，模型只能基于检索到的片段作答。推导检索失败的两种表现：<\/p>\n<ul><li>\n未召回相关文档：上下文缺依据，回答退回通用推测，却可能被误认为来自知识库。\n<\/li><li>\n召回不相关文档：模型按错误片段组织回答，内容看起来有条理但依据错位。\n<p>技巧 100 的三类自救正对应检索问题：识别失败查文档格式，回答错乱用精确关键词缩小检索，内容缺失改用站点地图抓取（PDF 第 313 页）。提升检索质量先查文档可识别性与提问关键词，再调整切块与分类，不能只靠改模型提示词。<\/p>\n<\/ul>\n<h2>补充推演：合规清单的来源更新<\/h2>\n<p>合规约束不是一次写死。推导更新链条：法规修订、平台规则调整、行业新规出现后，提示词里的禁止项与知识库引用条文都要同步；旧约束留在提示词里会漏掉新红线，旧条文留在知识库里会被当成现行依据。技巧 24 提醒及时更新知识库，引用过期标准如同刻舟求剑（PDF 第 83 页）。合规清单应由对应职能定期核对，模型不自动掌握最新法条。<\/p>\n<h2>边界补充：核验不能替代专业资质<\/h2>\n<p>三层防线挡住事实错误、违规分支与内部依据缺失，但不把普通用户变成执业人员。医疗诊断、法律意见、投资决策仍需执业人员确认；技巧 30 的能力禁区标注就是把这一边界写进提示词（PDF 第 100 页）。模型在专业场景定位为资料整理与初步分析工具，最终结论责任在人。<\/p>\n<h2>补充对照：本书核验技巧的归位<\/h2>\n<p>技巧 24 给法规、学术、行业标准作为回答基准（PDF 第 81 页）；技巧 29 处理合规边界与决策预判（PDF 第 98 页）；技巧 30 是核验三招（PDF 第 100 页）；技巧 43 是知识库投喂与溯源（PDF 第 141 页）；技巧 48 做文字合规扫描（PDF 第 163 页）。基准输入属于约束层，核验三招属于输出层，知识库属于依据层，三层配合使用。<\/p>\n<h2>机制拆解：核验与知识库各自卡住输出的哪一环<\/h2>\n<p>【机制解释】依据注入：知识库把与问题相关的文档片段检索进上下文，模型只能基于这些片段组织回答；片段未命中时，上下文缺依据，回答退回参数记忆里的通用内容。 【机制解释】候选排除：合规约束在生成前排除违规表述与风险分支；核验环节在生成后对照依据检查事实、来源与口径，两层位置不同，不能互相替代。 【机制解释】溯源回路：回答附带片段来源后，使用者可以回溯到原始文档核对；无来源标注的回答即使结论正确，也无法区分是来自知识库还是模型推测。 【经验推断】分库检索比混库命中更准、权限更好控；这一条来自技巧 43 的做法（PDF 第 146 页），实际检索质量还受文档切块与提问关键词影响。<\/p>\n<h2>算例 6：同一合规问题，无知识库与注入知识库对照（可复核）<\/h2>\n<p>问题：“我们这类产品可以宣称哪些功效表述？” 条件 A（未接知识库，纯对话）：<\/p>\n<pre><code>产品可以宣称哪些功效表述？<\/code><\/pre>\n<p>预期输出落点：给一般性广告合规常识，列常见禁用词；具体到本品类的允许边界与现行条款无法确定，可能把过期口径当成现行规定。 条件 B（接入本品类法规库，先检索再作答）：<\/p>\n<pre><code>先从知识库检索本品类相关法规条文，再回答可宣称与不可宣称的表述；每条结论标注来源条文。<\/code><\/pre>\n<p>逐段对比：<\/p>\n<ul><li>\n依据段：B 引用检索到的具体条文，A 凭常识作答。\n<\/li><li>\n边界段：B 区分“可宣称”与“需限定条件宣称”，A 给笼统是非判断。\n<\/li><li>\n溯源段：B 每条结论可回溯条文，A 无法核对出处。\n<p>差异来源：条件 B 的检索片段进入上下文参与生成；条件 A 缺依据，模型用通用知识补位。若检索未命中，B 也会退回通用回答，所以上线前要先点检索测试确认能返回内容（技巧 100，PDF 第 311 页）。<\/p>\n<\/ul>\n<h2>常见误读补充<\/h2>\n<ul><li>\n误读：回答里标了来源，依据就一定可靠。反例：来源标注只说明引用了哪段材料，材料本身是否现行、是否被误读仍要核对；旧版条文也可能被检索到。\n<\/li><li>\n误读：知识库投喂一次，模型以后就知道了。反例：知识库按问题检索，不改变模型参数；文档更新后要同步更新库内文件，旧材料仍会被召回。\n<\/li><li>\n误读：核验只是输出后再扫一遍敏感词。反例：敏感词扫描只能排表面违规，事实错误、依据缺失与越界结论要靠对照来源逐层检查；三层防线要在提示、生成、输
