扑校验，折叠后产生孤立边或非流形邻接。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>距离平方的二次型展开<\/strong>：平面距离 <span class=\"katex-inline\">r=a_lx+b_ly+c_lz+d_l=\\mathbf n_l^\\top p+d_l<\/span>。<span class=\"katex-inline\">r^2<\/span> 展开含坐标平方项、交叉项与常数项；齐次坐标 <span class=\"katex-inline\">\\hat p<\/span> 把常数项并入第四分量，系数对称矩阵 <span class=\"katex-inline\">Q_l<\/span> 由外积 <span class=\"katex-inline\">\\mathbf q_l\\mathbf q_l^\\top<\/span> 构成，<span class=\"katex-inline\">\\mathbf q_l=(a_l,b_l,c_l,d_l)<\/span>。<\/p>\n<p><strong>矩阵可加性<\/strong>：多个平面距离平方和 <span class=\"katex-inline\">\\sum_l\\hat p^\\top Q_l\\hat p=\\hat p^\\top(\\sum_l Q_l)\\hat p<\/span>；顶点累积矩阵 <span class=\"katex-inline\">Q_a=\\sum_{l\\in N(p_a)}Q_l<\/span>，折叠边合并 <span class=\"katex-inline\">Q_a+Q_b<\/span>。矩阵累加只加不改结构，增量更新方便。<\/p>\n<p><strong>最优驻点推导<\/strong>：<span class=\"katex-inline\">Q(p)=\\hat p^\\top Q\\hat p<\/span>。写 <span class=\"katex-inline\">\\hat p=(p,1)<\/span>，对 <span class=\"katex-inline\">p<\/span> 求导：<span class=\"katex-inline\">2(\\mathbf A p+\\mathbf b)=0<\/span>，<span class=\"katex-inline\">Q=\\begin{pmatrix}\\mathbf A&amp;\\mathbf b\\\\\\mathbf b^\\top&amp;c\\end{pmatrix}<\/span>。解 <span class=\"katex-inline\">\\mathbf A p=-\\mathbf b<\/span>。<span class=\"katex-inline\">\\mathbf A<\/span> 正定解为最小点；<span class=\"katex-inline\">\\mathbf A<\/span> 奇异时驻点不唯一，回退候选：<span class=\"katex-inline\">p_a<\/span>、<span class=\"katex-inline\">p_b<\/span>、中点，取 QEM 最小者。<\/p>\n<p><strong>队列贪心依据<\/strong>：每步选当前局部误差最小的可折叠边；QEM 是局部平面距离度量，不保证全局最优，但复杂度可控、误差分布均匀。折叠影响 1-环邻域，邻接边 QEM 需重算入队。<\/p>\n<p><strong>拓扑校验<\/strong>：折叠前检查边是否位于孔洞边界、非流形接缝、被约束控制边；邻接三角形合并后是否产生孤立边或双面共边。校验不通过的边不入队或标记禁止折叠。<\/p>\n<p><strong>渐进网格分解<\/strong>：每步折叠记录 <span class=\"katex-inline\">s,t<\/span> 顶点编号、合并坐标 <span class=\"katex-inline\">v_e<\/span>、删除三角形信息；逆分裂 <span class=\"katex-inline\">vsplit_i<\/span> 凭记录把 <span class=\"katex-inline\">v_e<\/span> 拆回 <span class=\"katex-inline\">v_s,v_t<\/span> 并恢复邻接三角形。层间差量即折叠/分裂操作本身。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：网格流形、三角形质量可接受；简化目标为几何形状保真；平面距离度量能代表局部偏差。\n<\/li><li>\n边界 1：QEM 基于平面距离，对高曲率自由曲面与锐边的误差估计偏局部；需要保留特征的场景加入特征边保护。\n<\/li><li>\n边界 2：非流形网格折叠拓扑校验失败率高，先修拓扑再简化。\n<\/li><li>\n边界 3：网格噪声尖刺会被 QEM 误判为大误差边保护下来；简化前应光顺。\n<\/li><li>\n边界 4：顶点聚类类方法不保留逐边对应，与渐进网格路线不兼容。\n<\/li><li>\n失败案例：约束边（边界、特征线）未保护，折叠后孔洞收缩、棱边消失。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>QEM vs 边长排队<\/strong>：边长只看几何长度，QEM 看邻接平面偏差；大平面上短边 QEM 小可删，尖棱短边 QEM 大应保留。\n<\/li><li>\n<strong>边折叠 vs 顶点删除<\/strong>：边折叠合并两顶点并更新邻接三角形；顶点删除移除孤立顶点后空洞三角化。边折叠对应关系明确，适合渐进网格。\n<\/li><li>\n<strong>离散多分辨率 vs 连续多分辨率<\/strong>：离散表示各层独立网格，无层间对应；连续表示（渐进网格）保留折叠/分裂操作与差量，可层间插值与局部编辑。\n<\/li><li>\n<strong>简化 vs 重网格化<\/strong>：简化减少单元数、尽量保留原连接；重网格化重新组织单元形状与拓扑，数量可增可减。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 半边结构承载折叠与邻接更新；c05 光顺去除噪声尖刺，避免误差误判；c02 曲率可用于特征边保护。后继：c03 章节内压缩编码基于渐进网格层级；c04 形变在简化网格上做粗尺度编辑；c09 检索可在低精度层级先做粗筛。简化是网格管线中控制规模的主要工序。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（网格简化：二次误差度量（QEM）边折叠与渐进网格多分辨率表示）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：QEM 二次型组装、折叠位置求解与渐进网格复盘<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把网格简化往回追四层：<\/p>\n<ol><li>\n<strong>输入网格<\/strong>：流形拓扑、邻接平面集合、顶点邻接关系；拓扑不合格先修复。\n<\/li><li>\n<strong>局部误差度量<\/strong>：候选折叠点到邻接三角形平面距离平方和，写成二次型 <span class=\"katex-inline\">Q<\/span>。\n<\/li><li>\n<strong>折叠决策<\/strong>：可折叠边清单、QEM 排队、拓扑校验、最优位置求解。\n<\/li><li>\n<strong>层级记录<\/strong>：折叠操作与逆分裂操作成对记录，形成渐进网格序列与差量编码。\n<\/ol>\n<p>依赖链方向：网格输入 → 误差度量 → 折叠决策 → 层级记录。上游接重建与光顺，下游接压缩、绘制 LOD 与粗尺度形变。<\/p>\n<h2>正向推导：QEM 矩阵从平面方程组装<\/h2>\n<p><strong>第一步，平面归一化。<\/strong> 平面 <span class=\"katex-inline\">P_l<\/span>：<span class=\"katex-inline\">a_lx+b_ly+c_lz+d_l=0<\/span>，法向分量归一化 <span class=\"katex-inline\">a_l^2+b_l^2+c_l^2=1<\/span>。记齐次系数行 <span class=\"katex-inline\">\\mathbf q_l=(a_l,b_l,c_l,d_l)<\/span>。<\/p>\n<p><strong>第二步，距离平方展开。<\/strong> 点 <span class=\"katex-inline\">p=(x,y,z)<\/span>，带符号距离 <span class=\"katex-inline\">r_l=\\mathbf q_l\\hat p<\/span>，<span class=\"katex-inline\">\\hat p=(x,y,z,1)^\\top<\/span>。距离平方 <span class=\"katex-inline\">r_l^2=\\hat p^\\top(\\mathbf q_l^\\top\\mathbf q_l)\\hat p=\\hat p^\\top Q_l\\hat p<\/span>，<span class=\"katex-inline\">Q_l=\\mathbf q_l^\\top\\mathbf q_l<\/span> 为 <span class=\"katex-inline\">4\\times4<\/span> 对称矩阵：<\/p>\n<div class=\"katex-block\">Q_l=\\begin{bmatrix}a_l^2&a_lb_l&a_lc_l&a_ld_l\\\\a_lb_l&b_l^2&b_lc_l&b_ld_l\\\\a_lc_l&b_lc_l&c_ld_l\\\\a_ld_l&b_ld_l&c_ld_l&d_l^2\\end{bmatrix}<\/div>\n<p><strong>第三步，顶点累积。<\/strong> 顶点 <span class=\"katex-inline\">p_a<\/span> 邻接平面集合 <span class=\"katex-inline\">N(p_a)<\/span>，<span class=\"katex-inline\">Q_a=\\sum_{l\\in N(p_a)}Q_l<\/span>；<span class=\"katex-inline\">Q_b<\/span> 按相同方式累积。边 <span class=\"katex-inline\">(p_a,p_b)<\/span> 折叠候选点 <span class=\"katex-inline\">p<\/span> 的误差：<\/p>\n<div class=\"katex-block\">Q(p)=\\hat p^\\top(Q_a+Q_b)\\hat p<\/div>\n<p><strong>第四步，分块与驻点。<\/strong> 写 <span class=\"katex-inline\">Q=\\begin{pmatrix}\\mathbf A&amp;\\mathbf b\\\\\\mathbf b^\\top&amp;c\\end{pmatrix}<\/span>，<span class=\"katex-inline\">\\hat p=(p,1)<\/span>。展开 <span class=\"katex-inline\">Q(p)=p^\\top\\mathbf A p+2\\mathbf b^\\top p+c<\/span>。对 <span class=\"katex-inline\">p<\/span> 求导：<span class=\"katex-inline\">2(\\mathbf A p+\\mathbf b)=0<\/span>，驻点方程 <span class=\"katex-inline\">\\mathbf A p=-\\mathbf b<\/span>。<\/p>\n<p><strong>第五步，正定判定。<\/strong> <span class=\"katex-inline\">\\mathbf A<\/span> 正定时驻点为全局最小点，解 <span class=\"katex-inline\">\\mathbf A^{-1}(-\\mathbf b)<\/span>；<span class=\"katex-inline\">\\mathbf A<\/span> 奇异或半正定，驻点不唯一或在无界方向退化，回退候选：<span class=\"katex-inline\">p_a<\/span>、<span class=\"katex-inline\">p_b<\/span>、中点 <span class=\"katex-inline\">(p_a+p_b)/2<\/span>，取 QEM 值最小者。<\/p>\n<p><strong>第六步，边折叠执行。<\/strong> 把 <span class=\"katex-inline\">p_a,p_b<\/span> 合并到 <span class=\"katex-inline\">p<\/span>；邻接三角形中引用 <span class=\"katex-inline\">p_a<\/span> 或 <span class=\"katex-inline\">p_b<\/span> 的顶点改指 <span class=\"katex-inline\">p<\/span>；退化三角形（两顶点重合）删除；更新 1-环邻域边的 <span class=\"katex-inline\">Q<\/span> 累积值并重排队列。<\/p>\n<p><strong>第七步，队列流程。<\/strong> 初始化：遍历可折叠边算 QEM 入最小优先队列。迭代：弹出队首边，拓扑校验；通过则折叠、更新邻接边 QEM；不通过则标记禁止。达到目标顶点/面片数或队列空停止。<\/p>\n<h2>数值算例一：平面表面的退化 QEM<\/h2>\n<p>邻接平面均为 <span class=\"katex-inline\">z=0<\/span>，<span class=\"katex-inline\">\\mathbf q=(0,0,1,0)<\/span>。<span class=\"katex-inline\">Q_l<\/span> 非零元仅 <span class=\"katex-inline\">(3,3)<\/span> 位置为 1。<\/p>\n<ol><li>\n<span class=\"katex-inline\">Q_a+Q_b<\/span> 的 <span class=\"katex-inline\">\\mathbf A<\/span> 块在 <span class=\"katex-inline\">x,y<\/span> 方向全零，<span class=\"katex-inline\">\\mathbf b=0<\/span>。\n<\/li><li>\n驻点方程 <span class=\"katex-inline\">\\mathbf A p=0<\/span> 在 <span class=\"katex-inline\">x,y<\/span> 方向无解约束；平面内位置由回退候选决定。\n<\/li><li>\n回退取中点 <span class=\"katex-inline\">p=(p_a+p_b)/2<\/span>；平面内移动不改变到 <span class=\"katex-inline\">z=0<\/span> 平面的距离，QEM 无法区分平面内位置——这正是平面表面折叠位置可在邻接范围内自由选取的原因。\n<\/li><li>\n多个不同朝向平面邻接时，<span class=\"katex-inline\">\\mathbf A<\/span> 才获得三维约束，驻点解出非平凡最优位置。\n<\/ol>\n<h2>数值算例二：两平面约束下的折叠位置<\/h2>\n<p>平面 <span class=\"katex-inline\">P_1: y=0<\/span>，<span class=\"katex-inline\">\\mathbf q_1=(0,1,0,0)<\/span>；平面 <span class=\"katex-inline\">P_2: x=0<\/span>，<span class=\"katex-inline\">\\mathbf q_2=(1,0,0,0)<\/span>。两顶点邻接这两个平面，<span class=\"katex-inline\">Q=Q_1+Q_2<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">Q_1<\/span> 非零元 <span class=\"katex-inline\">(2,2)=1<\/span>；<span class=\"katex-inline\">Q_2<\/span> 非零元 <span class=\"katex-inline\">(1,1)=1<\/span>。<span class=\"katex-inline\">\\mathbf A=\\mathrm{diag}(1,1,0)<\/span>，<span class=\"katex-inline\">\\mathbf b=0<\/span>，<span class=\"katex-inline\">c=0<\/span>。\n<\/li><li>\n驻点方程给出 <span class=\"katex-inline\">x=0,y=0<\/span>；<span class=\"katex-inline\">z<\/span> 方向无约束，回退取中点 <span class=\"katex-inline\">z<\/span> 坐标。\n<\/li><li>\n最优 <span class=\"katex-inline\">p=(0,0,(z_a+z_b)/2)<\/span>；QEM 残差只计 <span class=\"katex-inline\">x,y<\/span> 方向到两平面距离。\n<\/li><li>\n加入第三平面 <span class=\"katex-inline\">z=1<\/span>（<span class=\"katex-inline\">\\mathbf q_3=(0,0,1,-1)<\/span>）后 <span class=\"katex-inline\">\\mathbf A<\/span> 第三对角元为 1，<span class=\"katex-inline\">\\mathbf b<\/span> 第三分量为 <span class=\"katex-inline\">-1<\/span>，驻点 <span class=\"katex-inline\">z=1<\/span>，三维位置被三个平面约束确定。\n<\/ol>\n<h2>数值算例三：折叠前后计数核对<\/h2>\n<p>折叠前边 <span class=\"katex-inline\">(p_a,p_b)<\/span>，邻接三角形 <span class=\"katex-inline\">T_a,T_b<\/span> 各含两顶点。折叠后：<\/p>\n<ol><li>\n顶点数减 1（两合一）；邻接三角形中退化者删除，三角形数按实际合并减少。\n<\/li><li>\n邻接边更新：原关联 <span class=\"katex-inline\">p_a,p_b<\/span> 的边改挂 <span class=\"katex-inline\">p<\/span>；重复边去重。\n<\/li><li>\n增量更新 <span class=\"katex-inline\">Q<\/span>：新邻接平面集合重新累积 <span class=\"katex-inline\">Q_p<\/span>；1-环内其他边 <span class=\"katex-inline\">Q<\/span> 加入 <span class=\"katex-inline\">Q_p<\/span> 相关平面矩阵。\n<\/li><li>\n队列中旧边条目作废，新边按 QEM 重新入队；优先队列支持键值更新或懒删除（旧条目弹出时校验有效性）。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>特征边未保护。<\/strong> 棱边邻接平面夹角大但 QEM 仍可能小于平坦区某些边；贪心队列先删棱边，折叠后锐边倒圆。处置：特征边标记禁止折叠，或在 QEM 上加特征惩罚项。<\/p>\n<p><strong>拓扑校验缺失。<\/strong> 折叠孔洞边界边后边界环收缩；非流形接缝折叠产生孤立边。处置：折叠前查边类型与邻接面数，约束边入禁止清单。<\/p>\n<p><strong>噪声尖刺进入简化。<\/strong> 尖刺顶点邻接平面朝向杂乱，QEM 偏大被保护，高密度网格保留多余尖刺。处置：简化前跑 c05 光顺，去掉高频抖动。<\/p>\n<p><strong>队列懒删除失效。<\/strong> 邻接边 QEM 变化后旧条目未标记作废，弹出时重复折叠或折叠已不存在的边。处置：条目带边版本号，弹出时校验当前拓扑与 QEM。<\/p>\n<p><strong>全局贪心误判。<\/strong> 局部最优折叠组合起来误差分布不均，某些区域过度简化。处置：分层级保留预算，局部误差超阈值的区域暂停折叠。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n卡在&quot;QEM 为什么是二次型&quot;：距离本身是平面方程一次式，平方后坐标二次；齐次坐标把常数项并入第四分量，矩阵外积形式自然出现。\n<\/li><li>\n卡在&quot;矩阵为什么可加&quot;：距离平方和展开后交叉项按平面累加，同一二次型矩阵求和；顶点累积矩阵可在折叠时增量合并。\n<\/li><li>\n卡在&quot;<span class=\"katex-inline\">\\mathbf A<\/span> 奇异怎么办&quot;：回到第五步。退化方向回退端点或中点，不靠伪逆硬解；平面内位置本就无约束。\n<\/li><li>\n卡在&quot;渐进网格怎样恢复&quot;：折叠记录 <span class=\"katex-inline\">s,t,v_e<\/span>；逆分裂把 <span class=\"katex-inline\">v_e<\/span> 拆回 <span class=\"katex-inline\">v_s,v_t<\/span>，恢复删除三角形；从最简网格重复分裂即得原网格。\n<\/li><li>\n卡在&quot;简化和重网格化区别&quot;：简化保留原连接只减单元；重网格化重建单元形状与拓扑，数量由目标决定。\n<\/ul>\n<h2>补充展开七：QEM 与表面距离的关系<\/h2>\n<p>QEM 度量候选点到邻接平面的距离平方和；原始网格表面是这些三角形拼成的分片曲面，平面是三角形的局部切近似。平坦三角形集合接近共面，QEM 小折叠偏差小；高曲率处平面集合朝向分散，QEM 大。QEM 不是到原始顶点的距离，也不是网格间 Hausdorff 距离：Hausdorff 取两片网格所有点对的最大最近距离，用于事后评估简化保真度；QEM 是折叠前可计算的代理度量，用于排队决策。两者配合：简化时用 QEM 决策，简化后用 Hausdorff 或平均表面距离复核层级保真度。<\/p>\n<h2>补充展开八：折叠后的邻接指针推演<\/h2>\n<p>设折叠边 <span class=\"katex-inline\">(p_a,p_b)<\/span>，合并到 <span class=\"katex-inline\">p<\/span>。<\/p>\n<ol><li>\n三角形列表遍历：凡含 <span class=\"katex-inline\">p_a<\/span> 或 <span class=\"katex-inline\">p_b<\/span> 的三角形，对应顶点改指 <span class=\"katex-inline\">p<\/span>。\n<\/li><li>\n退化三角形：三个顶点中两个改指 <span class=\"katex-inline\">p<\/span> 后重合，删除该三角形并释放边。\n<\/li><li>\n边表去重：原分别挂 <span class=\"katex-inline\">p_a,p_b<\/span> 的邻接边合并，重复边删除；半边结构重新配对 flip。\n<\/li><li>\n1-环邻域：<span class=\"katex-inline\">p<\/span> 的邻接顶点为原两顶点邻域并集；邻接面片为合并后面片集合。\n<\/li><li>\n矩阵更新：<span class=\"katex-inline\">Q_p<\/span> 累积新邻接平面矩阵；邻接各边重算 QEM，旧队列条目标记失效。\n<p>指针推演顺序：先改顶点引用，再删退化三角形，末段重建边与半边配对；顺序颠倒会出现悬空指针。<\/p>\n<\/ol>\n<h2>补充展开九：多分辨率层级与 LOD 选择<\/h2>\n<p>渐进网格序列 <span class=\"katex-inline\">M_0,M_1,\\dots,M_k<\/span>，<span class=\"katex-inline\">M_0<\/span> 最简，<span class=\"katex-inline\">M_k<\/span> 为原始网格。每层顶点面片数递减记录；绘制时按视距选层级：近处取高层级，远处取低层级。层间插值可在两个相邻层级间平滑过渡，避免跳变。局部多分辨率：复杂区域保留高层级三角形，平坦区域用低层级，局部分裂/折叠操作按视点需求触发。层级序列的每步操作可逆，是流式传输与渐进显示的基础结构。<\/p>\n<h2>补充展开十：简化质量评估指标<\/h2>\n<ol><li>\n几何偏差：简化网格到原始网格的平均距离与最大距离（Hausdorff）。\n<\/li><li>\n拓扑保持：非流形边数、孤立边数、孔洞数量变化。\n<\/li><li>\n特征保留：棱边、尖角、边界环是否存在，特征线偏移量。\n<\/li><li>\n单元质量：简化后三角形角度分布、退化三角形比例。\n<\/li><li>\n层级误差分布：误差在网格上的热力图，检查局部集中偏差。\n<p>指标分开统计：整体平均偏差小不代表特征区未被破坏；拓扑与特征指标用于校验决策是否误删。<\/p>\n<\/ol>\n<h2>补充展开十一：约束与特征保留策略<\/h2>\n<p>特征边来源：曲率突变线、参数化边界、交互标记边、物理模拟约束边。策略分级：<\/p>\n<ol><li>\n禁止折叠：约束边两顶点不合并，邻接三角形保护。\n<\/li><li>\n加权保护：QEM 加特征惩罚项，同条件下特征边排队靠后。\n<\/li><li>\n边界规则化：边界边单列简化算子，折叠沿边界环顺序进行，避免孔洞收缩。\n<\/li><li>\n层级保留：特征区域在低层级仍保留必要三角形，简化预算向平坦区倾斜。\n<p>保护规则在初始化时写入边清单，拓扑更新后重新校验；特征检测依赖 c02 曲率量，光顺前检测避免特征被磨掉后漏检。<\/p>\n<\/ol>\n<h2>补充展开十二：压缩编码与渐进网格的关系<\/h2>\n<p>第 3 章压缩编码包括三角形条带、广义三角形网、单网格压缩、渐进网格压缩与网格序列压缩。渐进网格压缩利用层级差量：基础网格存顶点面片，折叠/分裂操作只存局部增量（顶点编号、位置差量、三角形索引）。条带编码把三角形组织成连续边带，减少面片邻接索引开销；网格序列压缩处理多帧动画网格的逐帧差量。简化是压缩的前置工序：层级越少，基础网格与差量规模越小。<\/p>\n<h2>补充展开十三：简化前后的网格核对清单<\/h2>\n<p>简化执行前后逐项核对：顶点面片数量是否按目标下降；非流形边与孤立边数量是否保持为零；边界环是否完整；特征边是否保留；退化三角形（面积近零、钝角近 <span class=\"katex-inline\">\\pi<\/span>）比例是否可接受；简化网格到原始网格的平均与最大表面距离是否在阈值内。核对不通过的层级回退该步折叠，调整保护规则或队列策略。清单记录每步折叠涉及的边与删除三角形，便于回溯某一偏差由哪次操作引起。<\/p>\n<h2>补充展开十四：QEM 变体与扩展口径<\/h2>\n<p>基础 QEM 累加邻接平面距离平方；扩展口径可加入边界约束项、特征保持项与颜色/纹理平面误差。带属性的网格把颜色平面或纹理面也纳入二次型，折叠同时考虑几何与属性偏差。自适应简化按区域误差预算分配折叠次数：平坦区多折叠，特征区少折叠。网格序列简化（多帧动画）保持帧间拓扑一致，折叠决策在序列层面统一，避免帧间拓扑跳变。<\/p>\n<h2>补充展开十五：与第 4 章重网格化的分工<\/h2>\n<p>简化减少单元数并尽量保留原连接；重网格化重新生成单元形状与拓扑，可把细长三角形换成规则单元，数量由目标决定。简化输出可以作为重网格化输入的低精度基础；重网格化不保留原始逐边对应，因此不构成渐进网格层级。两道工序解决不同问题：简化控规模，重网格化改质量。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出平面距离平方的二次型形式，说明 <span class=\"katex-inline\">Q_l<\/span> 由哪些系数构成。\n<\/li><li>\n折叠边的累积矩阵 <span class=\"katex-inline\">Q_a+Q_b<\/span> 怎样得到？可加性来自什么展开？\n<\/li><li>\n最优折叠位置的驻点方程是什么？<span class=\"katex-inline\">\\mathbf A<\/span> 奇异时回退哪些候选？\n<\/li><li>\n优先队列简化的每一步更新哪些邻接关系与 QEM 矩阵？\n<\/li><li>\n渐进网格分解记录哪些字段？重建沿什么逆操作恢复？\n<\/li><li>\n特征边与边界边为什么要禁止折叠？不保护会出现什么后果？\n<\/ol>\n<h2>补充展开一：QEM 度量的几何含义<\/h2>\n<p>QEM 累加的是候选点到邻接所有三角形平面的距离平方，不直接度量到原始网格表面的距离。平面逼近在平坦区误差小，在高曲率区平面集合本身偏离曲面；折叠位置被平面交线附近吸引。QEM 小表示邻接平面接近共面，折叠后三角形被拉偏的程度小；它是局部偏差的代理度量，不是 Hausdorff 距离。<\/p>\n<h2>补充展开二：边类型与可折叠条件<\/h2>\n<ul><li>\n内部边：邻接两面，可折叠，合并后邻接三角形重挂。\n<\/li><li>\n边界边：邻接一面，折叠使边界收缩；默认禁止或单列边界简化规则。\n<\/li><li>\n约束边：特征线、缝合边、参数化钉制边，禁止折叠。\n<\/li><li>\n非流形边：邻接面数不为一或二，不进标准折叠流程。\n<p>可折叠条件在初始化与每次拓扑更新后重新判定，条件变化的边从队列移除。<\/p>\n<\/ul>\n<h2>补充展开三：渐进网格的编码结构<\/h2>\n<p>每步折叠操作记录：被合并顶点编号 <span class=\"katex-inline\">s,t<\/span>、新顶点位置 <span class=\"katex-inline\">v_e<\/span>、删除三角形列表、受影响边表。逆分裂 <span class=\"katex-inline\">vsplit_i<\/span> 反向执行：在 <span class=\"katex-inline\">v_e<\/span> 处分裂出 <span class=\"katex-inline\">v_s,v_t<\/span>，按表恢复三角形与边。最简网格存基础几何，后续只存操作差量；传输时从基础网格流式分裂，绘制端按精度层级取到对应状态。<\/p>\n<h2>补充展开四：简化方法对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>方法<\/th><th>操作<\/th><th>对应关系<\/th><th>适用<\/th><\/tr><\/thead><tbody><tr><td>面片合并<\/td><td>三角形并片<\/td><td>弱<\/td><td>平面区域粗简<\/td><\/tr><tr><td>顶点聚类<\/td><td>空间格点合并<\/td><td>无逐点对应<\/td><td>快速粗简<\/td><\/tr><tr><td>顶点删除<\/td><td>删点后空洞三角化<\/td><td>局部<\/td><td>稀疏顶点网格<\/td><\/tr><tr><td>边折叠 QEM<\/td><td>两顶点合一<\/td><td>强、可记逆操作<\/td><td>形状保真简化<\/td><\/tr><\/tbody><\/table><\/div>\n<p>渐进网格只与边折叠路线兼容；顶点聚类不保留逐边对应，无法构造分裂逆操作。<\/p>\n<h2>补充展开五：复杂度口径<\/h2>\n<p>初始化遍历全部边算 QEM：<span class=\"katex-inline\">O(E)<\/span>。每轮折叠弹出队首 <span class=\"katex-inline\">O(\\log E)<\/span>，更新 1-环邻接边；邻域大小为常数度数时，总复杂度 <span class=\"katex-inline\">O(E\\log E)<\/span>。顶点度数大的局部区域更新成本上升。队列懒删除条目数与折叠次数同量级。<\/p>\n<h2>补充展开六：衔接速查与易错口径<\/h2>\n<ul><li>\n衔接：c01 邻接结构支撑折叠更新；c05 光顺先去尖刺；c07 自身层级供压缩编码；c04 形变在粗层级编辑；c09 检索低精度粗筛。\n<\/li><li>\n易错：把 QEM 当三维表面距离——它是平面距离平方和。\n<\/li><li>\n易错：折叠位置取中点即可——驻点存在时应解最优位置，中点只是退化回退。\n<\/li><li>\n易错：简化后不保留逆操作——离散层级无法恢复原网格，差量编码也无从构造。\n<\/ul><\/div><\/details>", "kind": "concept", "title": "网格简化：二次误差度量（QEM）边折叠与渐进网格多分辨率表示"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.203<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">离散曲率与 Laplace–Beltrami 算子：余切权格式、平均曲率法向与高斯曲率<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">网格参数化：映射优化模型、Jacobian 扭曲度量、调和/共形能量与防翻转<\/a><\/span><\/div><h1>网格形变：梯度域 Poisson 编辑与保刚性（ARAP 式）局部旋转能量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（原书第 6 章 §6.2–6.3，PDF 第 197–214 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>网格形变在用户交互约束下调整顶点位置：梯度域方法把原网格局部变换编成导引梯度场，再解 Poisson 方程重建形变网格；保刚性方法对每个 1-环邻域估计局部旋转，惩罚边向量经旋转后与变形后边向量的偏差，两种路线都把细节保持在局部邻域内，控制点作为边界条件进入求解。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>网格建模中需要局部调整形体：拉动手臂、弯折肢体、按目标姿态变形，同时保持表面褶皱、棱角与局部细节不被拉伸扭曲。直接把选中顶点沿拖动方向平移，未约束顶点不动，约束区与自由区之间出现硬折痕；全局 Laplacian 坐标固定不随旋转更新，大尺度弯折时局部细节被拉偏，肢体弯折处出现塌陷与不自然褶皱。<\/p>\n<p>困难分两层：一是位移怎样从约束点扩散到整张网格，二是扩散过程中怎样保持局部形状。线性梯度域方法在梯度场上做文章：保留原网格局部朝向与细节，只调整全局布局；非线性保刚性方法把每个邻域的旋转单独估计，允许局部转动、抑制局部伸缩。骨架类约束进一步把语义骨骼线加入优化，保持肢体直线性与原长。<\/p>\n<p>输入网格需要平顺（c05 光顺前置），邻接结构完整（c01），Laplace 坐标与法向口径一致（c02）。形变输出仍是同拓扑网格，顶点位置改变、连接关系不变。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>插值重构路线<\/strong>：蒙皮 <span class=\"katex-inline\">v=\\sum_i w_iT_i(p_i)<\/span>，骨骼变换 <span class=\"katex-inline\">T_i<\/span> 按权重混合；自由形变在控制栅格上变形并插值回网格；多分辨率编辑在粗层级变形、细层级恢复细节。<\/p>\n<p><strong>梯度域形变<\/strong>：<\/p>\n<ol><li>\n三角形上定义标量场梯度；导引梯度场 <span class=\"katex-inline\">\\mathbf w<\/span> 保留原网格局部变换（旋转缩放）；\n<\/li><li>\n离散散度 <span class=\"katex-inline\">\\mathrm{Div}(\\mathbf w)<\/span> 由邻接三角形梯度面积加权求和；\n<\/li><li>\nPoisson 方程 <span class=\"katex-inline\">\\mathrm{Div}(\\nabla u)=\\mathrm{Div}(\\mathbf w)<\/span>，三个坐标分量分别作为势场 <span class=\"katex-inline\">u<\/span>；\n<\/li><li>\n约束顶点给定边界值，解稀疏系统得新坐标。\n<\/ol>\n<p><strong>Laplace 坐标表示<\/strong>：<span class=\"katex-inline\">\\delta_i=\\sum_{j\\in N(i)}\\beta_{ij}(v_j-v_i)<\/span>，<span class=\"katex-inline\">\\beta_{ij}<\/span> 为系数；固定系数使坐标表示具备旋转不变性约束口径。变形后位置 <span class=\"katex-inline\">v&#x27;<\/span> 与原 Laplace 坐标关系进入能量。<\/p>\n<p><strong>ARAP 式保刚性能量<\/strong>：<\/p>\n<div class=\"katex-block\">E_{\\text{arap}}=\\sum_i\\sum_{j\\in N(i)}w_{ij}\\|R_i(v_i-v_j)-(v'_i-v'_j)\\|^2<\/div>\n<p><span class=\"katex-inline\">R_i<\/span> 为邻域 <span class=\"katex-inline\">i<\/span> 的局部旋转（三维正交行列式 1），<span class=\"katex-inline\">w_{ij}<\/span> 取面积或余切权；变形前边向量 <span class=\"katex-inline\">v_i-v_j<\/span>，变形后边向量 <span class=\"katex-inline\">v&#x27;_i-v&#x27;_j<\/span>。<\/p>\n<p><strong>交替优化<\/strong>：固定位置估 <span class=\"katex-inline\">R_i<\/span>（邻域协方差 SVD 极分解）；固定 <span class=\"katex-inline\">R_i<\/span>，能量关于 <span class=\"katex-inline\">\\{v&#x27;\\}<\/span> 二次，解最小二乘系统；迭代到能量收敛。<\/p>\n<p><strong>骨架约束<\/strong>：骨骼采样点写成网格顶点线性组合；约束采样点共线、间距保持原长；非线性骨架项加入总能量。骨骼线代表肢体主轴，网格表面跟随主轴转动，表面到主轴的距离尽量保持。<\/p>\n<p><strong>正例<\/strong>：肢体弯折时各邻域只转不伸缩，褶皱细节随局部朝向转动保留。<\/p>\n<p><strong>反例<\/strong>：固定 Laplace 坐标不更新朝向，大旋转后细节被拉伸；无局部旋转约束时变形边向量自由伸缩，表面出现网格状褶皱。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>导引场构造<\/strong>：原网格三角形梯度由三维坐标场给出；交互约束扩散到邻域形成局部变换，导引场保持原边向量方向关系。导引场不是目标变形后的梯度，而是待重建网格应逼近的局部变换。<\/p>\n<p><strong>Poisson 重建<\/strong>：网格上离散梯度 <span class=\"katex-inline\">\\nabla u<\/span> 由三角形边向量差商给出；散度算子沿 1-环邻域面积加权。方程两侧：左侧为待求坐标场的散度，右侧为导引场散度。固定边界顶点后，系统系数矩阵只依赖网格拓扑，可复用分解。<\/p>\n<p><strong>局部旋转估计<\/strong>：邻域 <span class=\"katex-inline\">i<\/span> 边向量集合 <span class=\"katex-inline\">\\{v_i-v_j\\}<\/span> 与变形后集合 <span class=\"katex-inline\">\\{v&#x27;_i-v&#x27;_j\\}<\/span>；协方差 <span class=\"katex-inline\">H_i=\\sum_j w_{ij}(v_i-v_j)(v&#x27;_i-v&#x27;_j)^\\top<\/span>，SVD 分解 <span class=\"katex-inline\">H_i=U\\Sigma V^\\top<\/span>，<span class=\"katex-inline\">R_i=VU^\\top<\/span>，行列式为负时校正为旋转。<\/p>\n<p><strong>位置更新<\/strong>：固定 <span class=\"katex-inline\">R_i<\/span> 后，<span class=\"katex-inline\">E_{\\text{arap}}<\/span> 对 <span class=\"katex-inline\">v&#x27;_i<\/span> 求导得线性方程；邻接边偏差项叠加到同一顶点行，约束顶点作为边值。解系统得到新位置，进入下一轮旋转估计。<\/p>\n<p><strong>骨架项并入<\/strong>：采样点 <span class=\"katex-inline\">s_k=\\sum_l\\alpha_{kl}v_l<\/span>；共线约束 <span class=\"katex-inline\">s_k<\/span> 落在骨骼线上，长度约束 <span class=\"katex-inline\">\\|s_{k+1}-s_k\\|<\/span> 保持原长；非线性项在迭代中线性化。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：网格流形平顺；控制点约束可明确给定；变形为同拓扑形变，不增删面片。\n<\/li><li>\n边界 1：梯度域方法在大旋转下导引场朝向需要随局部变换更新，固定朝向会塌陷。\n<\/li><li>\n边界 2：ARAP 为非凸交替优化，结果依赖初值；初值取线性形变或原网格。\n<\/li><li>\n边界 3：骨架约束依赖骨骼采样点与顶点权重，蒙皮权重不准时约束偏离网格表面。\n<\/li><li>\n边界 4：自由变形区域过大时局部刚性约束互相牵制，能量收敛慢；需要刚度权重分级。\n<\/li><li>\n失败案例：输入网格有尖刺噪声，ARAP 邻域把尖刺当局部细节保留，形变后尖刺随邻域转动。\n<\/li><li>\n变形幅度口径：小幅度形变用线性梯度域即可；大弯折、肢体关节转动用 ARAP 或骨架约束；两种路线可按区域混用，约束强的区域用保刚性，自由区用梯度域扩散。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>梯度域线性形变 vs ARAP 非线性形变<\/strong>：前者解一次 Poisson 系统，快但大旋转下细节保持弱；后者交替估计旋转与位置，细节保持好，每轮解二次系统。\n<\/li><li>\n<strong>蒙皮 vs 网格形变<\/strong>：蒙皮由骨骼变换按权重驱动顶点，形变空间受骨骼拓扑限制；网格形变直接优化顶点位置，骨架约束是其中可选项。\n<\/li><li>\n<strong>Laplace 坐标固定 vs 旋转不变<\/strong>：固定系数的 Laplace 坐标在旋转下需要随标架变换；直接固定原坐标值不保证旋转不变性，ARAP 局部旋转估计弥补这一点。\n<\/li><li>\n<strong>插值重构 vs 能量驱动<\/strong>：蒙皮/自由形变由控制单元插值；能量驱动在顶点上最小化形变误差与正则项。两类可组合：粗层级插值、细层级能量调整。\n<\/li><li>\n<strong>梯度场 vs 法向场<\/strong>：导引梯度场描述三角形局部变换朝向；法向场描述表面朝向。形变重建用梯度场解坐标，光顺用滤波法向调整位置，二者数据源相近但求解目标不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 邻域结构定义 <span class=\"katex-inline\">N(i)<\/span>；c02 Laplace 坐标与曲率法向是形变初始几何量；c05 光顺保证输入平顺；c06 ARAP 参数化能量与本章局部旋转项形式相通。后继：第 7 章弹性运动模拟把静态形变推进到动态方程；c09 形状匹配在形变前后模型间建立对应；形变网格可再简化（c07）与参数化（c06）。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（网格形变：梯度域 Poisson 编辑与保刚性（ARAP 式）局部旋转能量）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：Poisson 梯度重建、ARAP 交替优化小例与形变边界复盘<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把网格形变往回追五层：<\/p>\n<ol><li>\n<strong>输入网格与几何量<\/strong>：平顺流形网格、邻接结构、Laplace 坐标与法向；噪声尖刺先光顺。\n<\/li><li>\n<strong>约束输入<\/strong>：交互拖动的控制点位置、可选骨骼线与采样点权重；约束作为边界条件。\n<\/li><li>\n<strong>形变模型选择<\/strong>：梯度域线性重建、ARAP 局部刚性、骨架非线性约束；模型决定能量项。\n<\/li><li>\n<strong>求解结构<\/strong>：线性 Poisson 系统；ARAP 交替估计旋转与位置；骨架项迭代线性化。\n<\/li><li>\n<strong>输出复核<\/strong>：变形后网格拓扑不变，局部伸缩量、细节保留、约束满足程度逐项检查。\n<\/ol>\n<p>依赖链方向：输入几何 → 约束 → 能量模型 → 求解 → 复核输出。<\/p>\n<h2>正向推导：梯度域 Poisson 形变逐步展开<\/h2>\n<p><strong>第一步，原网格梯度。<\/strong> 三角形上坐标场梯度由边向量差商给出；三个坐标分量各有梯度向量。<\/p>\n<p><strong>第二步，导引场构造。<\/strong> 控制点局部变换扩散到邻域，形成导引梯度场 <span class=\"katex-inline\">\\mathbf w<\/span>；导引场保留原网格局部朝向与边向量比例关系，不直接等于变形后梯度。<\/p>\n<p><strong>第三步，离散散度。<\/strong> 顶点 <span class=\"katex-inline\">i<\/span> 处散度 <span class=\"katex-inline\">\\mathrm{Div}(\\mathbf w)_i=\\sum_{t\\ni i}A_t\\,(\\nabla_t\\mathbf w)<\/span> 按三角形面积加权；网格散度算子是梯度算子的伴随口径。<\/p>\n<p><strong>第四步，Poisson 方程。<\/strong> 待求坐标场 <span class=\"katex-inline\">u<\/span> 满足 <span class=\"katex-inline\">\\mathrm{Div}(\\nabla u)=\\mathrm{Div}(\\mathbf w)<\/span>。<span class=\"katex-inline\">x,y,z<\/span> 三个分量分别组方程，系数矩阵相同、右端不同。<\/p>\n<p><strong>第五步，边界条件。<\/strong> 控制点 <span class=\"katex-inline\">u_i=\\bar u_i<\/span> 固定；自由顶点为未知量。方程消去固定变量后解稀疏线性系统。<\/p>\n<p><strong>第六步，重建复核。<\/strong> 解出新坐标后重算三角形梯度，与导引场比较残差；残差大的三角形记录，必要时调整导引场重解。<\/p>\n<h2>正向推导：ARAP 交替优化逐步展开<\/h2>\n<p><strong>第一步，邻域集合。<\/strong> 顶点 <span class=\"katex-inline\">i<\/span> 的 1-环邻域 <span class=\"katex-inline\">N(i)<\/span>；变形前边向量 <span class=\"katex-inline\">e_{ij}=v_i-v_j<\/span>，变形后 <span class=\"katex-inline\">\\hat e_{ij}=v&#x27;_i-v&#x27;_j<\/span>。<\/p>\n<p><strong>第二步，能量写式。<\/strong><\/p>\n<div class=\"katex-block\">E=\\sum_i\\sum_{j\\in N(i)}w_{ij}\\|R_i e_{ij}-\\hat e_{ij}\\|^2<\/div>\n<p><span class=\"katex-inline\">R_i<\/span> 正交旋转，<span class=\"katex-inline\">w_{ij}<\/span> 面积或余切权。<\/p>\n<p><strong>第三步，固定位置估旋转。<\/strong> 邻域协方差 <span class=\"katex-inline\">H_i=\\sum_j w_{ij}e_{ij}\\hat e_{ij}^\\top<\/span>；SVD <span class=\"katex-inline\">H_i=U\\Sigma V^\\top<\/span>，<span class=\"katex-inline\">R_i=VU^\\top<\/span>；<span class=\"katex-inline\">\\det R_i=-1<\/span> 时第三维符号校正为 <span class=\"katex-inline\">R_i=V\\mathrm{diag}(1,1,-1)U^\\top<\/span>。<\/p>\n<p><strong>第四步，固定旋转解位置。<\/strong> 能量对 <span class=\"katex-inline\">v&#x27;_i<\/span> 求导得线性方程：邻接边偏差项叠加，约束顶点固定。解最小二乘系统更新全部位置。<\/p>\n<p><strong>第五步，交替收敛。<\/strong> 重复第三、四步；能量单调不增，下降小于阈值停止。非凸性决定初值影响结果，初值取线性形变解。<\/p>\n<p><strong>第六步，骨架项并入。<\/strong> 采样点 <span class=\"katex-inline\">s_k=\\sum_l\\alpha_{kl}v&#x27;_l<\/span>；共线约束与长度约束作为附加项；迭代中把非线性约束线性化并入二次系统。<\/p>\n<h2>数值算例一：二维邻域旋转估计<\/h2>\n<p>邻域顶点 <span class=\"katex-inline\">i<\/span> 位于原点，原边 <span class=\"katex-inline\">e_1=(1,0)<\/span>，<span class=\"katex-inline\">e_2=(0,1)<\/span>；变形后 <span class=\"katex-inline\">\\hat e_1=(0,1)<\/span>，<span class=\"katex-inline\">\\hat e_2=(-1,0)<\/span>（旋转 <span class=\"katex-inline\">90^\\circ<\/span>）。<\/p>\n<ol><li>\n协方差 <span class=\"katex-inline\">H=e_1\\hat e_1^\\top+e_2\\hat e_2^\\top<\/span>：\n<\/li><li>\nSVD 得旋转估计 <span class=\"katex-inline\">R=\\begin{pmatrix}0&amp;-1\\\\1&amp;0\\end{pmatrix}<\/span> 类 <span class=\"katex-inline\">90^\\circ<\/span> 旋转（口径按行列约定核对）；<span class=\"katex-inline\">Re_1<\/span> 与 <span class=\"katex-inline\">\\hat e_1<\/span> 方向一致。\n<\/li><li>\n若变形后 <span class=\"katex-inline\">\\hat e_1=(2,0)<\/span>（拉伸一倍），协方差主方向仍指向 <span class=\"katex-inline\">x<\/span>，旋转估计为单位阵；拉伸量留在边偏差项里由位置更新承担。\n<\/li><li>\n旋转只对齐方向，比例偏差进入残差；保刚性约束正是要求残差尽量小。\n<p><span class=\"katex-inline\">e_1\\hat e_1^\\top=(1,0)^\\top(0,1)=\\begin{pmatrix}0&amp;1\\\\0&amp;0\\end{pmatrix}<\/span> <span class=\"katex-inline\">e_2\\hat e_2^\\top=(0,1)^\\top(-1,0)=\\begin{pmatrix}0&amp;0\\\\-1&amp;0\\end{pmatrix}<\/span> <span class=\"katex-inline\">H=\\begin{pmatrix}0&amp;1\\\\-1&amp;0\\end{pmatrix}<\/span>。<\/p>\n<\/ol>\n<h2>数值算例二：三顶点 Poisson 小系统<\/h2>\n<p>顶点 <span class=\"katex-inline\">v_1<\/span> 固定 <span class=\"katex-inline\">(0,0)<\/span>，<span class=\"katex-inline\">v_3<\/span> 固定 <span class=\"katex-inline\">(1,0)<\/span>，自由顶点 <span class=\"katex-inline\">v_2<\/span>。导引场散度右端在 <span class=\"katex-inline\">v_2<\/span> 为 <span class=\"katex-inline\">g_2<\/span>。<\/p>\n<ol><li>\n离散 Laplace 方程 <span class=\"katex-inline\">L u=g<\/span>，<span class=\"katex-inline\">L<\/span> 在 <span class=\"katex-inline\">v_2<\/span> 行：<span class=\"katex-inline\">2u_2-u_1-u_3=g_2<\/span>。\n<\/li><li>\n代入边界：<span class=\"katex-inline\">2u_2-0-1=g_2<\/span>，<span class=\"katex-inline\">u_2=(1+g_2)/2<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">g_2=0<\/span> 时 <span class=\"katex-inline\">u_2=0.5<\/span>，调和扩散；<span class=\"katex-inline\">g_2&amp;gt;0<\/span> 时顶点向对应方向偏移。\n<\/li><li>\n<span class=\"katex-inline\">y<\/span> 分量按相同方式组方程；三个分量共享 <span class=\"katex-inline\">L<\/span> 矩阵。\n<\/ol>\n<h2>数值算例三：骨架采样点权重<\/h2>\n<p>骨骼点 <span class=\"katex-inline\">s_k<\/span> 由邻近网格顶点线性组合：<span class=\"katex-inline\">s_k=\\alpha_1v&#x27;_1+\\alpha_2v&#x27;_2+\\alpha_3v&#x27;_3<\/span>，<span class=\"katex-inline\">\\sum\\alpha=1<\/span>。<\/p>\n<ol><li>\n共线约束：<span class=\"katex-inline\">s_k<\/span> 落在骨骼轴线方向；长度约束 <span class=\"katex-inline\">\\|s_{k+1}-s_k\\|=L_k<\/span> 保持骨节原长。\n<\/li><li>\n权重 <span class=\"katex-inline\">\\alpha<\/span> 按顶点到采样点距离或蒙皮权重给定；权重不准时采样点脱离表面。\n<\/li><li>\n骨架项与 ARAP 项加权组合：<span class=\"katex-inline\">E=E_{\\text{arap}}+\\mu_{\\text{skel}}E_{\\text{skel}}<\/span>，<span class=\"katex-inline\">\\mu_{\\text{skel}}<\/span> 控制骨架约束强度。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>固定 Laplace 坐标不随旋转更新。<\/strong> 大弯折时原 Laplace 坐标朝向固定，新网格面法向转走，坐标与法向错位，局部细节被拉伸塌陷。处置：ARAP 局部旋转或梯度域导引场随局部变换更新朝向。<\/p>\n<p><strong>初值落入非凸局部最小。<\/strong> ARAP 交替从随意初值出发，旋转估计锁在错误邻域构型；能量下降但形状失真。处置：初值取线性 Poisson 解，约束强的区域先固定。<\/p>\n<p><strong>蒙皮权重不准。<\/strong> 骨骼采样点权重集中在错误顶点，弯折时表面脱离骨骼，关节处体积收缩或穿插。处置：权重按邻域重新标定，关节区域提高权重过渡密度。<\/p>\n<p><strong>输入网格带噪声尖刺。<\/strong> ARAP 邻域把尖刺边向量当作局部形状保留，转动后尖刺随邻域方向伸出。处置：形变前光顺（c05），噪声顶点不进刚性邻域。<\/p>\n<p><strong>刚度权重一刀切。<\/strong> 全部邻域同刚度，自由区被牵制收敛慢，特征区又保护不足。处置：按曲率与区域分级权重。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n卡在&quot;导引场和变形后梯度什么关系&quot;：导引场是待逼近目标，变形后梯度由解出的新坐标算出；二者残差是复核指标。\n<\/li><li>\n卡在&quot;ARAP 为什么要交替&quot;：旋转 <span class=\"katex-inline\">R_i<\/span> 与位置 <span class=\"katex-inline\">v&#x27;<\/span> 耦合在一起；固定一类优化另一类，拆开后各为闭式解或二次系统。\n<\/li><li>\n卡在&quot;旋转估计的 SVD 口径&quot;：协方差 SVD 极分解得到正交最接近旋转；反射情形行列式校正。\n<\/li><li>\n卡在&quot;骨架约束非线性在哪&quot;：长度约束 <span class=\"katex-inline\">\\|s_{k+1}-s_k\\|<\/span> 带范数，迭代线性化；共线约束可线性表达。\n<\/li><li>\n卡在&quot;梯度域为什么快&quot;：系数矩阵只依赖拓扑，一次分解多分量复用；ARAP 每轮重解二次系统，成本更高。\n<\/ul>\n<h2>补充展开七：正交旋转估计的极分解细节<\/h2>\n<p>邻域边向量组成矩阵 <span class=\"katex-inline\">E<\/span>（列向量为 <span class=\"katex-inline\">e_{ij}<\/span>）与 <span class=\"katex-inline\">\\hat E<\/span>（列向量为 <span class=\"katex-inline\">\\hat e_{ij}<\/span>）。最优正交变换 <span class=\"katex-inline\">R<\/span> 最小化 <span class=\"katex-inline\">\\sum_j w_{ij}\\|Re_{ij}-\\hat e_{ij}\\|^2<\/span>，展开后等价于最大化 <span class=\"katex-inline\">\\mathrm{tr}(R^\\top\\hat E W E^\\top)<\/span>。协方差 <span class=\"katex-inline\">H=\\hat E W E^\\top<\/span> 的 SVD 为 <span class=\"katex-inline\">U\\Sigma V^\\top<\/span>，最优正交矩阵为 <span class=\"katex-inline\">R=UV^\\top<\/span>（行列约定按协方差方向核对）。当 <span class=\"katex-inline\">\\det R=-1<\/span>，说明最近正交变换是反射；把奇异值最小那一维符号翻转 <span class=\"katex-inline\">R=U\\mathrm{diag}(1,1,-1)V^\\top<\/span> 校正为旋转。三维邻域边向量张成二维切平面时，第三维方向由法向补全，避免 SVD 秩亏。<\/p>\n<h2>补充展开八：静态形变与弹性运动模拟的边界<\/h2>\n<p>第 6 章网格形变是静态编辑：给定约束求一组成形后位置，不随时间演化。第 7 章弹性运动模拟建立运动方程，位置随时间步推进，处理惯性、弹性力、碰撞接触。两者共用网格邻域与局部刚度口径，但求解对象不同：静态是单次优化，动态是时间步进的微分方程。碰撞检测与响应只在动态模拟中出现；静态形变的约束条件由交互直接给定。本章概念落到静态编辑路线，动态扩展见第 7 章。<\/p>\n<h2>补充展开九：约束类型与进入方程的方式<\/h2>\n<ol><li>\n控制点固定：顶点位置给定，作为 Dirichlet 边界条件从未知量中消去。\n<\/li><li>\n区域约束：一片区域跟随某变换，约束项加权进入能量。\n<\/li><li>\n骨架约束：采样点共线与定长，非线性迭代线性化。\n<\/li><li>\n对称/平面约束：顶点关于平面镜像或落在平面上，线性方程加入。\n<p>约束强度由权重控制：硬约束固定位置，软约束以罚项进入目标函数。软约束允许小偏差，硬约束严格满足；混用时常把交互拖动点设硬约束，细节区域设软正则。<\/p>\n<\/ol>\n<h2>补充展开十：形变质量评估口径<\/h2>\n<ol><li>\n局部伸缩：邻域边长度变化率，超阈值区域标记拉伸或压缩。\n<\/li><li>\n细节保留：褶皱、棱边位置与形变前对比；法向偏差分布。\n<\/li><li>\n约束满足：控制点到位误差，骨架长度与共线偏差。\n<\/li><li>\n网格质量：变形后三角形角度、退化三角形比例。\n<\/li><li>\n全局观感：无穿插、无硬折痕、无体积异常收缩。\n<p>评估在自由区与约束区分开统计；局部伸缩集中区返回调整刚度权重或导引场。<\/p>\n<\/ol>\n<h2>补充展开十一：常见失败现象对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>现象<\/th><th>常见原因<\/th><th>处置<\/th><\/tr><\/thead><tbody><tr><td>弯折处塌陷拉伸<\/td><td>Laplace 坐标未随旋转更新<\/td><td>换 ARAP 或更新导引场朝向<\/td><\/tr><tr><td>表面网格状褶皱<\/td><td>局部刚性不足、自由度过大<\/td><td>提高刚性权重、加密正则<\/td><\/tr><tr><td>关节体积收缩<\/td><td>蒙皮权重过渡不合理<\/td><td>重标权重、补形状插值<\/td><\/tr><tr><td>尖刺跟随转动<\/td><td>输入网格噪声未光顺<\/td><td>形变前 c05 光顺<\/td><\/tr><tr><td>约束区与自由区硬折痕<\/td><td>约束扩散不足<\/td><td>扩大约束影响范围、梯度域平滑<\/td><\/tr><tr><td>迭代停滞不收敛<\/td><td>初值差、权重失衡<\/td><td>换线性初值、调权重<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>补充展开十二：与参数化 ARAP 的形式对照<\/h2>\n<p>参数化 ARAP 在二维参数域估计局部旋转，约束三维网格到平面映射的邻域只转不伸缩；网格形变 ARAP 在三维空间估计 <span class=\"katex-inline\">R_i<\/span>，约束变形前后邻域边向量偏差。两者能量项结构相同：局部旋转乘原边向量，对齐变形后边向量；区别是作用空间（二维/三维）与原模型（参数映射/网格形变）。参数化得到的对应关系可作为形变前后顶点匹配的参考。<\/p>\n<h2>补充展开十三：形变数据记录口径<\/h2>\n<p>一次形变输出记录：原始坐标、约束顶点与目标位置、每轮旋转矩阵集合、变形后坐标、能量收敛历史、邻域权重与刚度参数。复核时按记录回溯旋转估计与位置更新；对比多组权重方案时保留各轮快照。骨架采样点权重与骨骼线坐标单独存表，关节区域权重过渡曲线随模型一并保存。记录不全无法判断塌陷来自模型选择还是参数设置，也不能在同一输入上复现实验。<\/p>\n<h2>补充展开十四：形变结果复核清单<\/h2>\n<p>形变输出逐项核对：约束顶点到位误差；邻域边长度变化率；局部旋转矩阵是否为有效正交旋转；骨架长度与共线偏差；变形后网格有无退化三角形与自穿插；自由区是否出现硬折痕。复核不通过的区域回到对应能量项调整权重，不整体加大变形强度。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出 Poisson 网格形变的方程，说明两侧算子与边界条件。\n<\/li><li>\nARAP 能量的边偏差项怎样写？局部旋转 <span class=\"katex-inline\">R_i<\/span> 的约束是什么？\n<\/li><li>\n固定位置时 <span class=\"katex-inline\">R_i<\/span> 怎样由协方差 SVD 得到？反射怎样校正？\n<\/li><li>\n固定 <span class=\"katex-inline\">R_i<\/span> 后位置更新为什么是二次系统？\n<\/li><li>\n骨架采样点的线性组合形式与两类约束是什么？\n<\/li><li>\n固定 Laplace 坐标在大旋转下为什么会塌陷？哪种模型弥补这一点？\n<\/ol>\n<h2>补充展开一：Laplace 坐标的旋转不变性口径<\/h2>\n<p>Laplace 坐标 <span class=\"katex-inline\">\\delta_i=\\sum_{j\\in N(i)}\\beta_{ij}(v_j-v_i)<\/span>。网格整体旋转 <span class=\"katex-inline\">R<\/span> 后，<span class=\"katex-inline\">\\delta_i<\/span> 应变为 <span class=\"katex-inline\">R\\delta_i<\/span>；若能量直接固定原 <span class=\"katex-inline\">\\delta_i<\/span> 数值，旋转后不匹配。旋转不变的写法是允许坐标随局部标架变换，或在 ARAP 中用局部旋转 <span class=\"katex-inline\">R_i<\/span> 对齐前后邻域。系数 <span class=\"katex-inline\">\\beta_{ij}<\/span> 固定，但坐标差值随旋转更新。<\/p>\n<h2>补充展开二：梯度域与图像 Poisson 编辑的对照<\/h2>\n<p>图像 Poisson 编辑把源区域梯度场贴到目标图像，解像素 Poisson 方程；网格梯度域形变把三角形局部变换编成梯度场，解顶点坐标方程。离散口径对应：像素对应顶点，图像梯度对应三角形梯度，边界像素对应约束顶点。差别是网格梯度定义在三维面片上，散度按面积加权；图像梯度按像素邻域差分。<\/p>\n<h2>补充展开三：形变能量组成的加权结构<\/h2>\n<p>总能量 <span class=\"katex-inline\">E=E_{\\text{fit}}+\\lambda_{\\text{arap}}E_{\\text{arap}}+\\mu E_{\\text{skel}}+\\nu E_{\\text{reg}}<\/span>。<span class=\"katex-inline\">E_{\\text{fit}}<\/span> 为控制点贴合约束；<span class=\"katex-inline\">E_{\\text{arap}}<\/span> 局部刚性；<span class=\"katex-inline\">E_{\\text{skel}}<\/span> 骨架约束；<span class=\"katex-inline\">E_{\\text{reg}}<\/span> 邻域变换平滑正则。权重按任务调：姿态编辑偏重刚性与骨架，自由造型偏重贴合与平滑。<\/p>\n<h2>补充展开四：求解系统规模<\/h2>\n<p>未知量为自由顶点坐标分量 <span class=\"katex-inline\">3n<\/span>；ARAP 每轮位置系统稀疏对称，每行非零元对应 1-环边数。旋转估计是邻域独立小矩阵 SVD，不形成全局系统。系统矩阵在拓扑不变时可复用分解；约束顶点变化时右端更新。迭代轮数由能量阈值与最大轮数双重控制。<\/p>\n<h2>补充展开五：衔接速查与易错口径<\/h2>\n<ul><li>\n衔接：c01 邻域；c02 Laplace 坐标；c05 光顺前置；c06 ARAP 形式相通；第 7 章动态模拟接静态形变；c09 形变前后对应匹配。\n<\/li><li>\n易错：把形变当拓扑修改——连接关系不变，只改顶点位置。\n<\/li><li>\n易错：把导引场当最终梯度——导引场是逼近目标，解出后要复核残差。\n<\/li><li>\n易错：忽略初值——非凸交替优化结果依赖初值，不能从任意构型直接收敛。\n<\/ul>\n<h2>补充展开六：蒙皮混合的线性口径<\/h2>\n<p>蒙皮公式 <span class=\"katex-inline\">v=\\sum_i w_iT_i(p_i)<\/span>，<span class=\"katex-inline\">T_i<\/span> 含旋转平移；线性混合时关节处多骨骼权重过渡，体积收缩来自邻域骨骼缩放方向叠加。形状插值与融合蒙皮方法针对收缩改进。蒙皮是插值重构路线，不做顶点位置能量优化；与 ARAP 网格形变可组合：骨骼驱动粗姿态，网格能量修细节。<\/p><\/div><\/details>", "kind": "concept", "title": "网格形变：梯度域 Poisson 编辑与保刚性（ARAP 式）局部旋转能量"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.168<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">离散曲率与 Laplace–Beltrami 算子：余切权格式、平均曲率法向与高斯曲率<\/a><\/span><\/div><h1>三维形状分析：全局与局部形状描述子、模型分割与匹配检索<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch04（原书第 5 章 §5.1–5.4，PDF 第 167–195 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>三维形状分析把网格模型映成可比较的特征表达：全局描述子用整模型统计量做分类与检索，局部描述子刻画区域特征做对应与分割；模型分割把网格按相似性聚成部件区块；匹配检索在描述子空间度量相似性并返回候选模型，好的描述子具备可区分性、鲁棒性与刚体变换不变性。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>拿到一批三维网格，人能看出类别（椅子、杯子、动物）、部件（靠背、腿、杯把），机器需要可计算的特征。直接比较顶点坐标行不通：模型摆放姿态不同、尺度不同、细分密度不同，坐标序列两两对不上。形状分析要把形状翻译成向量或图结构，使同类形状距离近、异类形状距离远；局部区域要能跨模型对齐，分割出语义部件，检索库中相似模型。<\/p>\n<p>困难分三层。描述层：用什么量统计形状——法向分布、曲率、距离直方图、矩投影，各有适用尺度。对应层：两个模型的局部区域怎样匹配，局部描述子在邻域窗口内建立对应。组织层：分割与检索把描述子聚合成部件清单或排序结果。描述子设计要兼顾不变性（旋转、平移、尺度）、可区分性（类间拉开）与鲁棒性（噪声、采样密度变化不敏感）。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>全局描述子<\/strong>：整模型映射为固定维向量。代表：<\/p>\n<ol><li>\n扩展高斯图（ESG）：把面片法向映射到单位球，统计法向方向分布；凸面法向集中，凹面与边缘法向分散；\n<\/li><li>\n形状分布：随机抽取点对，统计欧氏距离直方图；距离分布反映模型整体尺寸与部件布局；\n<\/li><li>\n光场描述子：从多个视角投影轮廓与深度，统计投影图像特征；\n<\/li><li>\n3D Zernike 矩：在球面上用正交 Zernike 基展开形状函数，系数向量旋转不变。\n<p>全局描述子适合分类、粗检索，不直接给局部对应；向量维度固定，库内比较成本低。<\/p>\n<\/ol>\n<p><strong>局部描述子<\/strong>：刻画局部区域（顶点、面片或邻域块）的特征；邻域内统计法向、曲率、距离方向分布，形成局部向量。用于对应点匹配、部件分割、配准辅助。邻域半径按模型尺度选取，半径内几何信息足够区分局部形状，又不吞进相邻部件。<\/p>\n<p><strong>基于学习的描述子<\/strong>：从数据自动提取特征，替代手工统计；特征层级由网络或字典学习得到，泛化能力依赖训练集覆盖。<\/p>\n<p><strong>模型分割<\/strong>：把网格分解为部件或区块。<\/p>\n<ol><li>\n全自动分割：几何相似性聚类，邻接面片法向与曲率接近的归为一组；\n<\/li><li>\n交互式分割：用户给种子，区域生长或图割划定边界；\n<\/li><li>\n多形状协同分割：一批模型联合对齐部件类别，同类部件同时分出。\n<p>面片 <span class=\"katex-inline\">j<\/span> 归入种子子集 <span class=\"katex-inline\">S_i<\/span>，按距离函数 <span class=\"katex-inline\">\\|s_i-j\\|<\/span> 归类；迭代法交替更新种子与聚类。边界判定看相邻面片特征差与几何不连续（棱边、曲率突变）。<\/p>\n<\/ol>\n<p><strong>匹配与检索<\/strong>：描述子向量距离（欧氏、直方图交、核）度量相似性；检索按相似度排序返回候选模型库；匹配在局部描述子之间找对应，再验证整体一致性（对应点空间位置、刚体变换或非刚性对齐误差）。粗检索用全局描述子筛候选，精匹配用局部描述子建对应。<\/p>\n<p><strong>不变性口径<\/strong>：描述子对平移不敏感（中心化）、对旋转不敏感（方向统计或旋转不变基）、对尺度不敏感（归一化尺寸）。<\/p>\n<p><strong>正例<\/strong>：两个同姿态椅子模型，形状分布直方图接近，检索排序靠前；局部描述子把两条椅腿对应起来。<\/p>\n<p><strong>反例<\/strong>：描述子按原始坐标统计，模型转个角度向量分布改变，同类被判为异类。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>描述子构造流程<\/strong>：预处理（中心化、归一化、法向定向）→ 特征量采样（法向、曲率、点对距离、投影）→ 统计成直方图或系数向量 → 归一化到可比口径。<\/p>\n<p><strong>距离比较<\/strong>：全局向量欧氏距离 <span class=\"katex-inline\">d=\\|D_a-D_b\\|<\/span>；直方图用交或 <span class=\"katex-inline\">\\chi^2<\/span> 距离；局部描述子最近邻匹配后统计一致对应数。<\/p>\n<p><strong>分割聚类逻辑<\/strong>：特征空间中相邻面片相似度高；把面片特征向量聚类，同一聚类对应一个部件。种子法从标记区域生长；谱方法利用邻接图拉普拉斯谱嵌入聚类；图割把分割写成能量最小化（区域项加边界项）。<\/p>\n<p><strong>协同分割<\/strong>：多模型描述子共享部件类别；联合聚类使同类部件在各模型中同时分出，减少单模型几何歧义。<\/p>\n<p><strong>不变性实现<\/strong>：平移用质心对齐消除；旋转用法向方向球统计或 Zernike 类旋转不变基；尺度用包围盒或体积归一化。描述子向量随后做长度归一化，使距离比较不受点云规模影响。<\/p>\n<p><strong>描述子评价标准<\/strong>：可区分性——类间向量距离大；鲁棒性——噪声、采样密度、局部缺损下向量稳定；不变性——刚体变换不改变向量；紧致性——维度可控，库内检索快；可重复性——同一区域不同采样下描述子稳定。五项标准之间存在取舍：维数高区分度强但检索慢，统计窗口大鲁棒但局部定位粗。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：网格拓扑完整、法向定向一致；描述子采样口径与模型分辨率匹配；检索库类别覆盖目标形状。\n<\/li><li>\n边界 1：全局描述子丢失局部细节，不能做部件级对应；局部描述子对邻域半径敏感，半径过大混入邻域、过小不稳定。\n<\/li><li>\n边界 2：非刚性形变模型（弯折前后）全局坐标描述子失效，需要形状上下文或内蕴不变量。\n<\/li><li>\n边界 3：学习类描述子在训练集外类别上泛化受限；手工描述子可解释但区分度有限。\n<\/li><li>\n边界 4：分割依赖几何相似性，语义部件与几何边界可能不一致；同材质相邻部件几何上连通，分割需要先验或交互种子。\n<\/li><li>\n失败案例：低分辨率网格法向抖动，局部描述子直方图被噪声拉偏，匹配对应率下降。\n<\/li><li>\n描述子与网格分辨率的关系：全局统计量对密度变化较稳，局部直方图受邻域三角形数量影响；同一模型不同细分级别要统一采样口径，或在描述子里用归一化权重。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>全局 vs 局部描述子<\/strong>：全局向量整模型统计，分类粗检索用；局部向量邻域窗口计算，对应与分割用。一个系统可两层并用：全局粗筛，局部精配。\n<\/li><li>\n<strong>手工 vs 学习描述子<\/strong>：手工统计量可解释、无需训练数据；学习特征靠数据提取，表达力强但依赖样本与标注。\n<\/li><li>\n<strong>分割 vs 匹配<\/strong>：分割在单模型内聚类部件；匹配在模型间找对应区域。分割结果可为匹配提供部件候选，匹配对齐可辅助协同分割。\n<\/li><li>\n<strong>描述子 vs 特征检测<\/strong>：检测找关键点位置，描述子给关键点邻域向量；两者常配合使用。\n<\/li><li>\n<strong>几何分割 vs 语义分割<\/strong>：几何分割按法向、曲率、距离聚类，边界落在几何不连续处；语义分割要求部件名（椅腿、扶手），需要类别先验或训练数据。几何聚类结果可作为语义标注的几何候选。\n<\/li><li>\n<strong>刚体匹配 vs 非刚性匹配<\/strong>：刚体匹配对齐姿态与位置，对应点距离经刚体变换后度量；非刚性匹配允许局部变形，对应关系在变形空间中评估。弯折前后模型用刚体描述子会失配。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 曲率与法向是描述子输入特征；c01 邻接结构支撑面片聚类；c06 参数化对应为局部匹配提供二维域；c05 光顺去除噪声对统计的干扰。后继：检索结果供模型库复用；分割部件可作为形变骨架区域；对应关系支撑 c03 类配准与形变前后比对。形状分析是几何处理管线中把网格转为语义与可比表达的环节，也是数据驱动几何处理取特征的入口。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（三维形状分析：全局与局部形状描述子、模型分割与匹配检索）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：描述子构造流程、分割聚类算例与匹配检索复盘<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把形状分析往回追四层：<\/p>\n<ol><li>\n<strong>网格输入<\/strong>：拓扑完整、法向定向、分辨率统一；噪声先光顺。\n<\/li><li>\n<strong>几何特征采样<\/strong>：法向、曲率、点对距离、投影轮廓、矩系数；采样口径与邻域半径确定。\n<\/li><li>\n<strong>描述子聚合<\/strong>：特征统计成直方图或固定维向量，做不变性对齐与归一化。\n<\/li><li>\n<strong>分析任务<\/strong>：分类检索用全局向量距离；分割聚类局部特征；匹配在局部描述子间建对应并验证一致性。\n<\/ol>\n<p>依赖链方向：网格输入 → 特征采样 → 描述子聚合 → 检索/分割/匹配任务。<\/p>\n<h2>正向推导：描述子构造逐步展开<\/h2>\n<p><strong>第一步，预处理。<\/strong> 质心对齐消除平移；包围盒或体积归一化消除尺度；法向定向统一（沿用 c04 重建口径）；可选重采样到均匀三角网格。<\/p>\n<p><strong>第二步，特征采样。<\/strong> 按描述子类型取量：法向方向投到单位球；随机点对算距离；多视角投影轮廓与深度；球面正交基系数。采样点数量决定统计稳定性。<\/p>\n<p><strong>第三步，统计聚合。<\/strong> 连续量分箱成直方图，或按基函数加权成系数向量；分箱宽度、基阶数是可调参数。<\/p>\n<p><strong>第四步，归一化。<\/strong> 向量长度归一化使距离比较不受点数量影响；直方图除以总样本数成概率分布。<\/p>\n<p><strong>第五步，不变性核对。<\/strong> 旋转后重算描述子，与原向量比较差异；旋转敏感的统计量需要换不变基或方向对齐。<\/p>\n<p><strong>第六步，距离定义。<\/strong> 欧氏距离用于连续向量；直方图交 <span class=\"katex-inline\">S=\\sum_k\\min(h_a(k),h_b(k))<\/span> 或 <span class=\"katex-inline\">\\chi^2<\/span> 距离用于分布；局部描述子最近邻加一致性验证。<\/p>\n<h2>正向推导：分割聚类逐步展开<\/h2>\n<p><strong>第一步，面片特征。<\/strong> 每个面片取法向、曲率、邻域距离特征组成向量 <span class=\"katex-inline\">f_j<\/span>。<\/p>\n<p><strong>第二步，种子初始化。<\/strong> 自动聚类从特征空间选初始中心；交互分割由用户标记种子面片。<\/p>\n<p><strong>第三步，归类。<\/strong> 面片 <span class=\"katex-inline\">j<\/span> 归入最近种子子集 <span class=\"katex-inline\">S_i<\/span>：<span class=\"katex-inline\">\\|f_j-s_i\\|<\/span> 最小者。<\/p>\n<p><strong>第四步，种子更新。<\/strong> 子集内面片特征平均得新种子 <span class=\"katex-inline\">s_i<\/span>；重复第三、四步到聚类稳定。<\/p>\n<p><strong>第五步，边界优化。<\/strong> 相邻面片特征差小则合并，特征差大（棱边、曲率突变）保持分界；图割形式把区域归属与边界代价写成能量最小化。<\/p>\n<p><strong>第六步，协同分割。<\/strong> 多模型联合聚类，部件类别跨模型对齐；单模型歧义由同批模型共同纠正。<\/p>\n<h2>数值算例一：形状分布直方图小例<\/h2>\n<p>模型上随机抽 6 对点，距离 <span class=\"katex-inline\">r<\/span>：<span class=\"katex-inline\">0.8,1.2,1.0,1.5,0.9,1.1<\/span>。分箱 <span class=\"katex-inline\">[0,1),[1,2)<\/span>。<\/p>\n<ol><li>\n第一箱：<span class=\"katex-inline\">0.8,0.9<\/span> 计 2；第二箱：<span class=\"katex-inline\">1.2,1.0,1.5,1.1<\/span> 计 4。\n<\/li><li>\n归一化：概率分布 <span class=\"katex-inline\">(2/6,4/6)=(1/3,2/3)<\/span>。\n<\/li><li>\n另一同类别模型采样分布接近，直方图交高；异类模型距离分布峰值位置不同，交低。\n<\/li><li>\n点对数少则直方图波动大；实际采样成百上千对点，分箱宽度按距离范围定。\n<\/ol>\n<h2>数值算例二：三面片聚类<\/h2>\n<p>面片特征 <span class=\"katex-inline\">f_1=(1,0.1)<\/span>，<span class=\"katex-inline\">f_2=(1.1,0)<\/span>，<span class=\"katex-inline\">f_3=(0,2)<\/span>。种子 <span class=\"katex-inline\">s_A=(1,0)<\/span>，<span class=\"katex-inline\">s_B=(0,2)<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">f_1<\/span> 到 <span class=\"katex-inline\">s_A<\/span> 距离 <span class=\"katex-inline\">\\sqrt{0.1^2}=0.1<\/span>，到 <span class=\"katex-inline\">s_B<\/span> 距离 <span class=\"katex-inline\">\\sqrt{1+4}\\approx2.24<\/span>，归 A。\n<\/li><li>\n<span class=\"katex-inline\">f_2<\/span> 到 <span class=\"katex-inline\">s_A<\/span> 距离 <span class=\"katex-inline\">0.1<\/span>，归 A。\n<\/li><li>\n<span class=\"katex-inline\">f_3<\/span> 到 <span class=\"katex-inline\">s_B<\/span> 距离 0，归 B。\n<\/li><li>\n更新种子：<span class=\"katex-inline\">s_A=(f_1+f_2)/2=(1.05,0.05)<\/span>，<span class=\"katex-inline\">s_B=f_3<\/span>；再归类保持不变，聚类收敛。\n<\/li><li>\n边界在 <span class=\"katex-inline\">f_2<\/span> 与 <span class=\"katex-inline\">f_3<\/span> 之间；法向或曲率差异决定这条分界是否为真实部件边界。\n<\/ol>\n<h2>数值算例三：旋转不变性核对<\/h2>\n<p>模型绕轴旋转 <span class=\"katex-inline\">90^\\circ<\/span>。<\/p>\n<ol><li>\n法向方向球直方图：法向随模型一起转，投到球上的分布整体旋转；用球面均匀分箱时分布形状不变，直方图向量稳定。\n<\/li><li>\n原始坐标直接统计：坐标方向分布改变，描述子变化。\n<\/li><li>\nZernike 矩：球面正交基在旋转下系数按基变换，旋转不变阶系数保持。\n<\/li><li>\n结论：描述子是否不变取决于统计量的几何口径；选不变口径或先做方向对齐。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>姿态未对齐直接比较。<\/strong> 模型摆放角度不同，原始坐标描述子距离大，同类排到检索后面。处置：质心对齐加旋转不变统计。<\/p>\n<p><strong>邻域半径失当。<\/strong> 局部描述子半径过大吞进相邻部件，特征混合；半径过小邻域点少，直方图不稳。处置：按模型尺度分级选半径，多尺度描述子并置。<\/p>\n<p><strong>噪声拉偏法向直方图。<\/strong> 低分辨率网格法向抖动，法向分布散开，类间区分度下降。处置：光顺后再采样，或对法向做邻域滤波。<\/p>\n<p><strong>语义边界与几何边界错位。<\/strong> 同一部件表面几何连续，几何聚类把多部件并片；需要交互种子或学习类先验。<\/p>\n<p><strong>训练集外类别。<\/strong> 学习描述子只见过训练类别，新类别特征向量不可比；检索库要覆盖目标类别，或回退手工描述子。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n卡在&quot;全局和局部怎么配合&quot;：全局粗筛候选，局部精匹配对应；不是二选一。\n<\/li><li>\n卡在&quot;距离度量怎么选&quot;：连续向量欧氏，分布直方图用交或 <span class=\"katex-inline\">\\chi^2<\/span>；度量要与描述子形式匹配。\n<\/li><li>\n卡在&quot;分割迭代怎么停&quot;：种子移动小于阈值或归类不再变化即停。\n<\/li><li>\n卡在&quot;不变性靠什么实现&quot;：平移质心对齐，旋转不变基或方向球，尺度归一化；逐项消去刚体变换影响。\n<\/li><li>\n卡在&quot;描述子维数取舍&quot;：维数高区分强检索慢，维数低紧致但特征丢失；按检索规模与类别数定。\n<\/ul>\n<h2>补充展开七：采样口径细节<\/h2>\n<p>全局描述子采样：法向方向球按经纬度分箱；点对距离随机采样固定对数；投影视角按均匀环绕分布选取；Zernike 阶数截断到指定阶。局部描述子采样：邻域半径内面片或点按距离加权，特征向量分箱。采样数量不足时直方图波动，过密则计算成本上升。同一模型库内所有模型使用相同分箱宽度、视角数与基阶数，保证向量维度对齐。<\/p>\n<h2>补充展开八：检索排序流程<\/h2>\n<ol><li>\n库内每个模型预计算描述子向量入库；\n<\/li><li>\n查询模型描述子与库内向量逐一算距离；\n<\/li><li>\n距离升序排序，取前 <span class=\"katex-inline\">k<\/span> 候选；\n<\/li><li>\n候选过局部描述子精匹配复核；\n<\/li><li>\n返回排序结果与匹配对应。\n<p>粗检索用全局向量保证召回，精匹配用局部对应保证准确。库规模大时用向量索引（近似最近邻）加速，不做全库暴力比对。<\/p>\n<\/ol>\n<h2>补充展开九：协同分割步骤<\/h2>\n<ol><li>\n一批模型各自计算局部特征；\n<\/li><li>\n模型间建立初步对应（全局粗对齐或局部描述子匹配）；\n<\/li><li>\n联合聚类：同一部件类别在多模型中同时分配；\n<\/li><li>\n部件类别数先验给定或从数据估计；\n<\/li><li>\n输出各模型部件标签与跨模型对应。\n<p>协同分割缓解单模型几何歧义：某模型部件边界不清时，同批其他模型的对应边界提供参照。<\/p>\n<\/ol>\n<h2>补充展开十：非刚性匹配与内蕴描述<\/h2>\n<p>刚体匹配对齐旋转平移；人体弯折、布料变形等非刚性场景，表面内蕴属性（测地距离、曲率分布、局部拓扑）不随弯曲改变。内蕴描述子在曲面度量上统计，不依赖嵌入坐标。局部对应在内蕴空间建立，再映射回嵌入网格。使用边界：严重自交或度量退化区域内蕴量不稳；非刚性描述子计算成本高于刚体描述子。<\/p>\n<h2>补充展开十一：噪声与缺损下的鲁棒性<\/h2>\n<p>局部缺损：缺失区域描述子按剩余邻域估计，邻域半径内样本不足时降权或标记不可靠。噪声：法向与曲率统计前滤波，直方图分箱适度加宽吸收抖动。重采样：网格细分密度变化，描述子用归一化权重抵消三角形数量差。鲁棒性测试人为加噪、删片、重采样，对比描述子相似度变化曲线，选出稳健的参数区间。<\/p>\n<h2>补充展开十二：数据集与评价流程<\/h2>\n<p>标注数据集含模型类别标签、部件标注或对应点对。评价分类用类准确率；检索用召回率、Top-<span class=\"katex-inline\">k<\/span> 命中率；分割用边界重合度；匹配用对应点正确率。训练/测试分开，避免学习描述子记住测试集。手工描述子在同一数据集上作为基线对照，学习方法增益按基线差值衡量。<\/p>\n<h2>补充展开十三：描述子维度与存储<\/h2>\n<p>全局向量维度从十几（形状分布少箱）到数百（高阶矩）；局部描述子每关键点一个向量，关键点数量随模型规模增长。库内存储全局向量表，局部对应按需计算不全部入库。检索距离计算成本随维度与库规模增长；高维向量配合近似最近邻索引。<\/p>\n<h2>补充展开十四：典型应用场景<\/h2>\n<p>模型库检索：按样例找相似零件或角色；部件分割：为蒙皮绑定分区；对应匹配：形变前后或跨模型参数迁移；形状分类：入库自动归类；质量检测：与标准模型比较偏差区域。各场景描述子选择不同：检索偏全局，绑定偏局部分割，迁移偏跨模型对应。<\/p>\n<h2>补充展开十五：直方图与矩系数的数学口径<\/h2>\n<p>形状分布直方图：采样点对 <span class=\"katex-inline\">(p_a,p_b)<\/span>，距离 <span class=\"katex-inline\">r=\\|p_a-p_b\\|<\/span>，落入第 <span class=\"katex-inline\">k<\/span> 箱计数 <span class=\"katex-inline\">n_k<\/span>，概率 <span class=\"katex-inline\">h(k)=n_k/N<\/span>。两模型分布距离可用 <span class=\"katex-inline\">L_2<\/span> 范数 <span class=\"katex-inline\">\\|h_a-h_b\\|_2<\/span> 或 <span class=\"katex-inline\">\\chi^2<\/span>：<span class=\"katex-inline\">\\sum_k(h_a(k)-h_b(k))^2/(h_a(k)+h_b(k))<\/span>。<\/p>\n<p>Zernike 矩：球面正交基 <span class=\"katex-inline\">Z_{lm}(\\theta,\\phi)<\/span>，形状函数 <span class=\"katex-inline\">f<\/span> 的系数 <span class=\"katex-inline\">M_{lm}=\\int f Z_{lm}\\,d\\Omega<\/span>；旋转下基按角向阶 <span class=\"katex-inline\">m<\/span> 变换，取模 <span class=\"katex-inline\">\\|M_{lm}\\|<\/span> 得到旋转不变量。阶数 <span class=\"katex-inline\">l<\/span> 越高刻画越细细节，截断阶数决定向量维度与高频细节取舍。<\/p>\n<p>ESG：面片法向 <span class=\"katex-inline\">\\mathbf n_f<\/span> 投到单位球，球面分箱计数；凸曲面法向集中在若干方向，平面法向聚成一点，边缘法向环绕分布。法向定向一致是 ESG 有效的前提，反向法向会投到对趾箱。<\/p>\n<h2>补充展开十六：分割方法的几何依据<\/h2>\n<p>几何相似性依据三类量：法向夹角（相邻面片朝向差）、曲率差（弯曲程度差）、位置距离（邻域远近）。区域生长从种子面片出发，把特征差小于阈值的邻接面片并入；阈值过大并片，过小过碎。谱分割利用邻接图拉普拉斯：图权 <span class=\"katex-inline\">w_{ij}<\/span> 为面片相似度，拉普拉斯特征向量嵌入后 <span class=\"katex-inline\">k<\/span> 维聚类。图割能量 <span class=\"katex-inline\">E=\\sum_j D(j,S_{l(j)})+\\sum_{(i,j)}V(i,j)<\/span>，数据项惩罚归属差异，边界项惩罚跨分割边相似度；最小割解归属。自动分割定类别数，交互分割由种子指定，协同分割跨模型对齐类别。<\/p>\n<h2>补充展开十七：失败现象诊断表<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>现象<\/th><th>诊断方向<\/th><th>处置<\/th><\/tr><\/thead><tbody><tr><td>同类模型检索排名靠后<\/td><td>姿态未对齐或描述子非不变<\/td><td>质心对齐、换不变基<\/td><\/tr><tr><td>局部对应错误率高<\/td><td>邻域半径失当或法向噪声<\/td><td>调半径、先光顺<\/td><\/tr><tr><td>分割片过碎<\/td><td>相似度阈值过小<\/td><td>放宽阈值、合并小片<\/td><\/tr><tr><td>多部件并片<\/td><td>阈值过大或缺语义先验<\/td><td>交互种子、协同分割<\/td><\/tr><tr><td>新类别不可比<\/td><td>学习描述子训练集未覆盖<\/td><td>回退手工描述子<\/td><\/tr><tr><td>缺损区描述子失真<\/td><td>邻域样本不足<\/td><td>降权标记、补采样<\/td><\/tr><\/tbody><\/table><\/div>\n<p>诊断顺序：先查输入网格质量与定向，再查采样口径与参数，末段查描述子类型是否匹配任务。<\/p>\n<h2>补充展开十八：在全书管线中的衔接路径<\/h2>\n<p>上游：c03 配准对齐多片点云；c04 重建输出网格；c05 光顺稳定法向与曲率；c02 提供曲率法向特征；c01 邻接图支撑面片聚类与局部邻域。中游：本章描述子、分割、匹配把网格转成向量与部件结构。下游：c07 简化可在分割区域内分级保留细节；c08 形变按分割部件划分骨骼绑定区域；检索结果回供给模型库与复用；第 8 章学习方法以本章手工特征为基线与对照。管线闭环：扫描输入 → 重建 → 光顺 → 分析 → 编辑/复用。<\/p>\n<h2>补充展开十九：描述子选择决策口径<\/h2>\n<p>先定任务：分类与库检索选全局描述子，部件绑定选局部分割，跨模型迁移选局部匹配加整体验证。再看输入：网格噪声大先光顺；非刚性变形选内蕴描述；姿态未知选不变统计量。末了看资源：库规模大选低维全局向量加近似索引；局部匹配只在候选上计算。没有单一描述子覆盖所有任务，实际系统常组合两层：全局粗筛、局部精配、分割分区。<\/p>\n<h2>补充展开二十：形状分析与重建管线的输入输出<\/h2>\n<p>输入：光顺后网格、法向与曲率统计、可选标注类别；输出：全局/局部描述子向量、部件分割标签、模型间对应与检索排序。描述子计算不改变网格几何；分割标签挂在面片索引上；对应关系存顶点对列表。下游编辑与检索按索引取回结果，不重复计算描述子。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n列举四类全局描述子及其统计量来源。\n<\/li><li>\n描述子构造的预处理与归一化各消除什么影响？\n<\/li><li>\n分割聚类的归类与种子更新怎样交替？\n<\/li><li>\n直方图交距离怎样计算？什么形式的描述子适用？\n<\/li><li>\n局部描述子邻域半径过大与过小各有什么问题？\n<\/li><li>\n非刚性形变模型为什么刚体描述子会失配？\n<\/ol>\n<h2>补充展开一：描述子评价指标的量化口径<\/h2>\n<p>可区分性用类内距离与类间距离比值衡量：类内距离小、类间距离大则描述子好。鲁棒性用加噪、缺损、重采样前后描述子相似度变化衡量。可重复性用同一区域不同采样下描述子最近邻匹配率衡量。检索质量用召回率（同类被检出比例）与准确率（检出中同类比例）评估。指标在标注数据集上统计，不能只看单个样例视觉效果。<\/p>\n<h2>补充展开二：常见全局描述子口径对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>描述子<\/th><th>统计对象<\/th><th>不变性<\/th><th>短板<\/th><\/tr><\/thead><tbody><tr><td>ESG<\/td><td>法向方向球分布<\/td><td>旋转（球口径）<\/td><td>对称形状区分弱<\/td><\/tr><tr><td>形状分布<\/td><td>点对距离直方图<\/td><td>平移旋转尺度<\/td><td>丢失空间布局<\/td><\/tr><tr><td>光场描述子<\/td><td>多视角投影<\/td><td>视角覆盖依赖<\/td><td>计算视角采样<\/td><\/tr><tr><td>Zernike 矩<\/td><td>球面正交基系数<\/td><td>旋转不变<\/td><td>阶数截断丢细节<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>补充展开三：局部匹配的验证流程<\/h2>\n<ol><li>\n局部描述子最近邻初匹配；\n<\/li><li>\n剔除距离超阈值对应；\n<\/li><li>\n用对应点估计刚体或非刚性变换；\n<\/li><li>\n检查内点比例，不一致对应剔除；\n<\/li><li>\n一致对应集作为最终匹配。\n<p>单靠描述子最近邻会有错误对应，几何一致性验证是必要环节。<\/p>\n<\/ol>\n<h2>补充展开四：谱分割与图割口径<\/h2>\n<p>网格邻接图顶点为面片，边权为邻接面片特征相似度。谱方法把图拉普拉斯特征向量嵌入低维空间，在嵌入空间聚类。图割把归属写成能量：区域项惩罚面片与种子差异，边界项惩罚跨分割边的特征差；最小割得到分割边界。两种方法都把几何相似性转成图上优化问题。<\/p>\n<h2>补充展开五：衔接速查与易错口径<\/h2>\n<ul><li>\n衔接：c02 曲率法向进描述子；c01 邻接图支撑分割；c06 参数化对应辅助局部匹配；c05 光顺稳定统计输入。\n<\/li><li>\n易错：把全局描述子当局部对应工具——它没有逐点定位能力。\n<\/li><li>\n易错：把几何分割结果当语义标注——部件名需要先验。\n<\/li><li>\n易错：忽略描述子归一化——点数量与尺度不同时距离比较失真。\n<\/ul>\n<h2>补充展开六：数据驱动几何处理的位置<\/h2>\n<p>第 8 章压缩感知与稀疏学习支撑网格去噪、稀疏正则匹配、字典学习蒙皮；深度学习从低级特征到流形上三维学习、端到端生成模型。形状分析描述子是学习特征的手工基线：学习描述子在标注数据上替代手工统计，但评价口径（不变性、区分度、鲁棒性）与手工描述子一致。<\/p><\/div><\/details>", "kind": "concept", "title": "三维形状分析：全局与局部形状描述子、模型分割与匹配检索"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：数学基础：网格表示、流形条件与离散微分算子<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化）<\/a><br>检查点：能画出半边结构的指针关系，判断一条边邻接面片数是否满足流形条件，写出余切权离散 Laplace 算子与平均曲率法向表达式<\/li><li class='path-step' id='path-02'><strong>步骤 02：点云管线：配准、显式/隐式重建与曲面光顺<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：点云曲面重建和光顺（配准、显式与隐式重建、曲面光顺）<\/a><br>检查点：能复述 ICP 的最近点对应与刚体变换交替步骤，说明 Voronoi/Delaunay 滤波重建与 Poisson 指示函数重建各自约束了什么，比较基于顶点与基于法向的两类光顺能量<\/li><li class='path-step' id='path-03'><strong>步骤 03：网格处理：参数化、QEM 简化与多分辨率表示<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：网格曲面的参数化和多分辨率表示（参数化、简化、压缩与渐进网格）<\/a><br>检查点：能写出参数化优化模型的形变能量与位置约束，解释 Jacobian 非退化与无翻转条件，按 QEM 定义一条边折叠的二次误差并描述优先队列简化流程<\/li><li class='path-step' id='path-04'><strong>步骤 04：分析与形变：形状描述、网格形变能量与几何处理应用<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4–9 章：重网格化、形状分析、网格形变、弹性模拟与机器学习几何处理<\/a><br>检查点：能区分全局与局部形状描述子，写出梯度域 Poisson 重建方程与 ARAP 式保刚性能量的局部旋转项，说明骨架约束在形变中的作用<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='流形网格（manifold mesh）'>流形网格（manifold mesh） — 拓扑上同胚于二维圆盘（内部点）或半圆碟（边界点）的网格；网格表现为每条边最多邻接两个面片，每个顶点的邻接面片构成闭合或开放的单一扇面 <span class=glossary-ref>（第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化））<\/span><\/li><li data-term='半边数据结构（half-edge data structure）'>半边数据结构（half-edge data structure） — 把每条无向边拆成两条方向相反的半边；每条半边记录起点指针、邻接面指针、同面下一条边指针、对偶半边指针，顶点与面片各挂一条代表半边，用于逆时针遍历邻域 <span class=glossary-ref>（第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化））<\/span><\/li><li data-term='1-环邻域（1-ring neighborhood）'>1-环邻域（1-ring neighborhood） — 顶点 $v_i$ 沿半边环绕一圈所到达的邻接顶点集合 $N(i)$ 及其共享三角形，是离散曲率、Laplace 算子与形变能量定义的局部范围 <span class=glossary-ref>（第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化））<\/span><\/li><li data-term='laplace–beltrami 算子'>Laplace–Beltrami 算子 — 平面 Laplace 算子向曲面流形的推广；三角网格上常用余切权离散格式 $\\Delta v_i=\\frac{1}{2A_i}\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(v_j-v_i)$，其中 $\\alpha_{ij},\\beta_{ij}$ 为共享边 $(i,j)$ 两个三角形的对顶角 <span class=glossary-ref>（第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化））<\/span><\/li><li data-term='平均曲率法向（mean curvature normal）'>平均曲率法向（mean curvature normal） — 连续情形为 $2H\\mathbf n$；离散格式由余切权 Laplace 向量给出，方向沿邻接面法向张成的线性空间，其长度对应平均曲率大小 <span class=glossary-ref>（第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化））<\/span><\/li><li data-term='高斯曲率离散算子'>高斯曲率离散算子 — 基于高斯–博内定理：顶点 $v_i$ 处离散高斯曲率 $K_G(v_i)=(2\\pi-\\sum_{f\\in N(i)}\\theta_f)/A_i$，$\\theta_f$ 为面片在该顶点的顶角，$A_i$ 为 Voronoi 或重心元胞面积 <span class=glossary-ref>（第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化））<\/span><\/li><li data-term='voronoi 图与 delaunay 三角剖分'>Voronoi 图与 Delaunay 三角剖分 — 样本点 $p$ 的 Voronoi 单元是空间中比其他样本点更接近 $p$ 的点集；其对偶图连接相邻单元样本点即 Delaunay 三角剖分，外接圆内不含其他样本点且满足最小角最大化 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺（配准、显式与隐式重建、曲面光顺））<\/span><\/li><li data-term='隐式曲面零水平集'>隐式曲面零水平集 — 把重建曲面表示为三维标量函数 $F(x)$ 取值为 0 的集合 $S=\\{x\\mid F(x)=0\\}$；法向信息约束曲面内外符号，抽取零等值面得到封闭网格 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺（配准、显式与隐式重建、曲面光顺））<\/span><\/li><li data-term='poisson 重建'>Poisson 重建 — 寻找指示函数 $\\chi$ 使其梯度最佳逼近点云法向量场；由散度算子等价为求解 $\\Delta\\chi=\\nabla\\cdot\\mathbf w$，再抽取零等值面得到封闭曲面 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺（配准、显式与隐式重建、曲面光顺））<\/span><\/li><li data-term='参数化扭曲度量'>参数化扭曲度量 — 衡量三维网格到参数域映射局部形变程度的能量密度，可基于 Dirichlet 能量、共形能量、伸缩能量或 Green–Lagrange 能量；配合位置约束最小化整体扭曲 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示（参数化、简化、压缩与渐进网格））<\/span><\/li><li data-term='二次误差度量（qem）'>二次误差度量（QEM） — 边折叠后顶点到折叠前两顶点邻接所有三角形平面距离平方和；写成齐次坐标下二次型 $v^TQv$，QEM 越小该边折叠引起的几何误差越小，用于排优先队列 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示（参数化、简化、压缩与渐进网格））<\/span><\/li><li data-term='渐进网格（progressive mesh）'>渐进网格（Progressive Mesh） — 连续多分辨率表示：记录每一步边折叠操作（顶点编号与合并后坐标）及其逆操作顶点分裂；从最简网格出发逐步分裂即可恢复原网格，相邻层差量编码为局部操作 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示（参数化、简化、压缩与渐进网格））<\/span><\/li><li data-term='保刚性能量（arap 式）'>保刚性能量（ARAP 式） — 对每个局部邻域估计旋转 $R_i$，惩罚边向量经局部旋转后与变形后边向量的偏差 $\\sum w_{ij}\\|R_i(v_i-v_j)-(v&#x27;_i-v&#x27;_j)\\|^2$，在局部标架内保持细节形状 <span class=glossary-ref>（第 4–9 章：重网格化、形状分析、网格形变、弹性模拟与机器学习几何处理）<\/span><\/li><li data-term='形状描述子（shape descriptor）'>形状描述子（shape descriptor） — 把三维模型或局部区域映射为描述子空间向量的特征表达；全局描述子用于分类检索，局部描述子用于对应、配准与分割，好的描述子应具备可区分性、鲁棒性与不变性 <span class=glossary-ref>（第 4–9 章：重网格化、形状分析、网格形变、弹性模拟与机器学习几何处理）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>思维模式库：离散几何处理<\/h1>\n<h2>模式 1：连续对象 → 离散邻域平均<\/h2>\n<p>连续微分几何定义在极限点上，网格只存有限采样。先把连续量改成 1-环邻域上的空间平均：面积分借高斯定理落到边权，点导数换成邻接顶点加权差。检查口径：邻域是否拓扑圆盘、元胞面积是否归一化、采样加密时平均是否收敛到连续值。<\/p>\n<ul><li>\n触发：离散曲率、Laplace 算子、法向估计。\n<\/li><li>\n关键：连续参照 → 分片逼近假设 → 邻域元胞 → 边界积分 → 离散求和。\n<\/ul>\n<h2>模式 2：结构先行于算子<\/h2>\n<p>任何几何算子先问邻接关系存得下来存不下来：边邻接数、顶点扇面是否单一、半边能否唯一配对。结构不合格时先修复拓扑，再谈曲率、参数化、简化；拓扑问题用位置滤波修不好。<\/p>\n<ul><li>\n触发：拿到重建网格准备计算前。\n<\/li><li>\n关键：流形判据 → 半边配对 → 1-环遍历 → 算子输入。\n<\/ul>\n<h2>模式 3：能量驱动 + 约束边界条件<\/h2>\n<p>几何处理问题写成&quot;数据贴合项 + 正则/刚性项 + 位置约束&quot;的目标函数：贴合项对齐观测或交互目标，正则项控制平滑或刚性，约束项钉住边界顶点。二次能量解线性系统，非二次能量拆成局部估计与整体更新交替。<\/p>\n<ul><li>\n触发：参数化、光顺、形变、配准。\n<\/li><li>\n关键：变量分离（固定一类优化另一类）；约束进右端或罚项；权重按区域分级。\n<\/ul>\n<h2>模式 4：贪心队列 + 局部误差代理<\/h2>\n<p>简化不追求全局最优，按局部误差度量排队，每步选当前误差最小的可执行操作，执行后只更新 1-环邻域的误差值。代理度量（QEM 平面距离）不等于最终表面距离，事后要用 Hausdorff 或平均表面距离复核。<\/p>\n<ul><li>\n触发：边折叠简化、渐进网格构造。\n<\/li><li>\n关键：局部二次型可累加；拓扑校验先于执行；队列条目带版本号防懒删除失效。\n<\/ul>\n<h2>模式 5：显式路线 vs 隐式路线分工<\/h2>\n<p>输入稠密低噪声选显式：Delaunay 对偶 + 极点/锥体滤波直接出面片；有噪有缺失选隐式：标量场零水平集，法向定内外符号。路线选择先看采样密度、噪声水平与法向可估计性，不按习惯硬套。<\/p>\n<ul><li>\n触发：点云重建方案选型。\n<\/li><li>\n关键：显式靠几何结构判断表面；隐式靠场拟合补封闭；两类输出都要过拓扑与法向检查。\n<\/ul>\n<h2>模式 6：不变量先于距离比较<\/h2>\n<p>描述子、配准对应先消去刚体变换影响：平移用质心对齐，旋转用不变基或方向球，尺度用归一化；之后才在特征空间算距离。不消除姿态直接比坐标，同类形状距离被姿态差淹没。<\/p>\n<ul><li>\n触发：检索匹配、跨模型对应、配准初值核对。\n<\/li><li>\n关键：不变性口径 → 归一化 → 特征统计 → 距离度量。\n<\/ul>\n<h2>模式 7：反事实剥离条件查边界<\/h2>\n<p>每个格式先列前提：流形、非退化、定向一致、采样密度、初值接近。逐条去掉前提，推演断在哪一步：边权失正、面积分母趋零、对应错配、邻域分裂。失败案例先核对前提是否满足，再调参数。<\/p>\n<ul><li>\n触发：结果发散、局部失真、收敛到坏解。\n<\/li><li>\n关键：前提清单 → 剥离反例 → 失效步骤定位 → 修复路线（修网格/修定向/补采样/换模型）。\n<\/ul>\n<h2>模式 8：局部到整体交替优化<\/h2>\n<p>非二次、耦合问题（ARAP、非刚性配准）拆两步：局部估计（旋转/仿射）闭式解，整体位置二次系统；交替迭代到能量下降趋平。初值取线性解，避免非凸局部最小；每步固定一类变量，保证子问题可解。<\/p>\n<ul><li>\n触发：保刚性形变、非刚性配准、ARAP 参数化。\n<\/li><li>\n关键：局部极分解 → 全局二次解 → 单调不增 → 初值与收敛阈值。\n<\/ul>\n<h2>模式 9：管线顺序不可逆<\/h2>\n<p>扫描 → 配准 → 重建 → 光顺 → 参数化/简化/形变 → 分析复用。上游缺陷向下游放大：噪声尖刺被简化保护、被形变保留、被描述子统计污染。每道工序输出记录参照网格与改动量，便于回溯哪一步引入偏差。<\/p>\n<ul><li>\n触发：定位网格质量问题、安排处理流程。\n<\/li><li>\n关键：工序依赖 → 上游修复优先 → 分层记录 → 事后复核指标。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表：离散几何处理与应用<\/h1>\n<h2>1. 网格表示与流形判据<\/h2>\n<ul><li>\n网格 <span class=\"katex-inline\">G=(V,E,F)<\/span>：顶点、边、面片三层集合；三角网格每个面片三顶点。\n<\/li><li>\n流形条件：每条边至多邻接两个面片；每个顶点邻接面片构成单一闭合/开放扇面。\n<\/li><li>\n半边四指针：<code>origin<\/code>（起点）、<code>face<\/code>（邻接面）、<code>next<\/code>（同面下一条）、<code>flip<\/code>（对偶半边）。\n<\/li><li>\n遍历：面遍历沿 <code>next<\/code> 回起点；顶点邻域遍历交替 <code>flip<\/code> → <code>next<\/code>。\n<\/li><li>\n计数：封闭三角网格 <span class=\"katex-inline\">3F=2E<\/span>，<span class=\"katex-inline\">V-E+F=2<\/span>；开放圆盘 <span class=\"katex-inline\">V-E+F=1<\/span>。\n<\/ul>\n<h2>2. 离散曲率算子<\/h2>\n<ul><li>\n余切权 Laplace–Beltrami：\n<\/ul>\n<div class=\"katex-block\">\\int_{\\Omega_i}\\Delta z\\,dA=\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(z_j-z_i)<\/div>\n<ul><li>\n平均曲率法向：\n<\/ul>\n<div class=\"katex-block\">H(v_i)\\mathbf n_i=-\\frac{1}{2A_i}\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(v_j-v_i)<\/div>\n<ul><li>\n离散高斯曲率：<span class=\"katex-inline\">K_G(v_i)=(2\\pi-\\sum_{f\\in N(i)}\\theta_f)/A_i<\/span>。\n<\/li><li>\n主曲率反解：<span class=\"katex-inline\">k_{1,2}=H\\pm\\sqrt{H^2-K}<\/span>；判别式 <span class=\"katex-inline\">H^2-K<\/span> 为负说明离散估值不自洽。\n<\/li><li>\n收敛前提：分片逼近、三角形非退化、采样加密、邻域拓扑圆盘。\n<\/ul>\n<h2>3. 点云配准<\/h2>\n<ul><li>\n刚性配准能量：<span class=\"katex-inline\">E(R,t)=\\sum_i\\|y_i-(Rx_i+t)\\|^2<\/span>。\n<\/li><li>\n闭式解：去质心 <span class=\"katex-inline\">\\bar x,\\bar y<\/span>；协方差 <span class=\"katex-inline\">H=\\sum(x_i-\\bar x)(y_i-\\bar y)^\\top<\/span>；SVD <span class=\"katex-inline\">H=U\\Sigma V^\\top<\/span>，<span class=\"katex-inline\">R=VU^\\top<\/span>，反射行列式校正；<span class=\"katex-inline\">t=\\bar y-R\\bar x<\/span>。\n<\/li><li>\nICP 循环：最近点对应 → 刚体闭式解 → 更新点云 → 收敛判断；误差单调不增，依赖初值。\n<\/li><li>\n粗配准：RANSAC 最大内点一致性集；4PCS 用长度、夹角、交点比例不变量筛点对。\n<\/li><li>\nCPD：GMM 后验软对应，E 步后验权重，M 步更新位置参数。\n<\/ul>\n<h2>4. 曲面重建<\/h2>\n<ul><li>\nVoronoi 单元：<span class=\"katex-inline\">V(p)=\\{x\\mid d(x,p)\\le d(x,q),\\forall q\\}<\/span>；Delaunay 对偶空圆性质。\n<\/li><li>\nCrust：取极点 → <span class=\"katex-inline\">P\\cup P&#x27;<\/span> 做 Delaunay → 保留三顶点全属 <span class=\"katex-inline\">P<\/span> 的三角形。\n<\/li><li>\n隐式曲面：<span class=\"katex-inline\">S=\\{x\\mid F(x)=0\\}<\/span>；法向约束内外符号。\n<\/li><li>\nPoisson 链：<span class=\"katex-inline\">\\min\\|\\nabla\\chi-\\mathbf w\\|^2\\Rightarrow\\Delta\\chi=\\nabla\\cdot\\mathbf w<\/span>；<span class=\"katex-inline\">\\mathbf w\\approx\\sum |M_{p_i}|\\phi(x-p_i)\\mathbf m_i<\/span>；八叉树离散后抽零等值面。\n<\/li><li>\n路线对照：SDF 投影距离（怕法向噪声）、RBF 基函数组合（矩阵稠密）、Poisson 指示函数（需定向法向）、MPU 局部二次混合。\n<\/ul>\n<h2>5. 曲面光顺<\/h2>\n<ul><li>\nLaplacian 显式更新：<span class=\"katex-inline\">v_i^{\\text{new}}=v_i+\\lambda(c_i-v_i)<\/span>，<span class=\"katex-inline\">c_i<\/span> 为邻点质心。\n<\/li><li>\n曲率流：<span class=\"katex-inline\">v_i^{\\text{new}}=v_i+h\\,H(v_i)\\mathbf n_i<\/span>。\n<\/li><li>\n距离误差：顶点到邻接滤波平面距离平方和，线性二次型。\n<\/li><li>\n梯度误差：新三角形法向对齐滤波法向，非线性，迭代线性化。\n<\/li><li>\n风险：体积收缩、棱边倒圆、法向未定向平均成零向量、孔洞边界被拉进内部。\n<\/ul>\n<h2>6. 网格参数化<\/h2>\n<ul><li>\n目标：<span class=\"katex-inline\">E_{\\text{param}}=\\sum_t e(\\phi_t)S(t)+\\sum_i\\omega_i\\|u_i-\\bar u_i\\|^2<\/span>。\n<\/li><li>\nJacobian 奇异值 <span class=\"katex-inline\">\\sigma_1,\\sigma_2<\/span>：拉伸比 <span class=\"katex-inline\">\\sigma_1/\\sigma_2<\/span>，面积缩放 <span class=\"katex-inline\">|\\det J|<\/span>。\n<\/li><li>\n能量族：Dirichlet <span class=\"katex-inline\">\\sigma_1^2+\\sigma_2^2<\/span>；共形 <span class=\"katex-inline\">(\\sigma_1-\\sigma_2)^2<\/span>；伸缩分方向；Green–Lagrange <span class=\"katex-inline\">J^\\top J-I<\/span>；ARAP 局部旋转。\n<\/li><li>\n可行性：<span class=\"katex-inline\">\\det J\\neq0<\/span> 单射，<span class=\"katex-inline\">\\det J&gt;0<\/span> 无翻转；闭合曲面先分割成圆盘片。\n<\/ul>\n<h2>7. QEM 简化<\/h2>\n<ul><li>\n平面 <span class=\"katex-inline\">\\mathbf q=(a,b,c,d)<\/span> 归一化；<span class=\"katex-inline\">Q_l=\\mathbf q^\\top\\mathbf q<\/span>（4×4 对称阵）。\n<\/li><li>\n折叠误差：<span class=\"katex-inline\">Q(p)=\\hat p^\\top(Q_a+Q_b)\\hat p<\/span>。\n<\/li><li>\n驻点：<span class=\"katex-inline\">\\mathbf A p=-\\mathbf b<\/span>（分块 <span class=\"katex-inline\">Q=\\begin{pmatrix}\\mathbf A&amp;\\mathbf b\\\\\\mathbf b^\\top&amp;c\\end{pmatrix}<\/span>）；<span class=\"katex-inline\">\\mathbf A<\/span> 奇异回退端点/中点。\n<\/li><li>\n队列：初始化 QEM 入队 → 弹最小边 → 拓扑校验 → 折叠更新 1-环 → 重排队列。\n<\/li><li>\n渐进网格：记录 <span class=\"katex-inline\">ecol<\/span>（<span class=\"katex-inline\">s,t,v_e<\/span>）；逆操作 <span class=\"katex-inline\">vsplit<\/span> 逐层分裂恢复。\n<\/ul>\n<h2>8. 网格形变<\/h2>\n<ul><li>\nPoisson 形变：<span class=\"katex-inline\">\\mathrm{Div}(\\nabla u)=\\mathrm{Div}(\\mathbf w)<\/span>，三坐标分量分别解，约束顶点为边界值。\n<\/li><li>\nARAP 能量：\n<\/ul>\n<div class=\"katex-block\">E_{\\text{arap}}=\\sum_i\\sum_{j\\in N(i)}w_{ij}\\|R_i(v_i-v_j)-(v'_i-v'_j)\\|^2<\/div>\n<ul><li>\n旋转估计：协方差 <span class=\"katex-inline\">H_i=\\sum w_{ij}(v_i-v_j)(v&#x27;_i-v&#x27;_j)^\\top<\/span>，SVD 极分解，反射行列式校正。\n<\/li><li>\n交替：固定位置估 <span class=\"katex-inline\">R_i<\/span> → 固定 <span class=\"katex-inline\">R_i<\/span> 解位置二次系统 → 迭代收敛。\n<\/li><li>\n骨架：采样点 <span class=\"katex-inline\">s_k=\\sum\\alpha_{kl}v_l<\/span>；共线与定长约束。\n<\/ul>\n<h2>9. 形状分析<\/h2>\n<ul><li>\n全局描述子：ESG 法向球分布、形状分布点对距离直方图、光场投影、Zernike 矩系数。\n<\/li><li>\n局部描述子：邻域窗口内法向/曲率/距离方向统计，用于对应与分割。\n<\/li><li>\n不变性：平移质心对齐，旋转不变基或方向球，尺度归一化。\n<\/li><li>\n分割：种子归类 <span class=\"katex-inline\">\\|f_j-s_i\\|<\/span> 最小 → 更新种子 → 边界优化；谱嵌入/图割。\n<\/li><li>\n检索：全局向量距离粗筛，局部描述子精匹配 + 一致性验证。\n<\/ul>\n<h2>10. 高频反事实速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>去掉的条件<\/th><th>后果<\/th><\/tr><\/thead><tbody><tr><td>流形假设<\/td><td>flip 配对断裂，曲率连续对应失效<\/td><\/tr><tr><td>余切权改均匀权<\/td><td>细长三角形方向拉偏，不保证收敛<\/td><\/tr><tr><td>法向全局定向<\/td><td>隐式内外颠倒，等值面翻面<\/td><\/tr><tr><td>无翻转约束<\/td><td>参数域三角形翻面重叠，纹理镜像<\/td><\/tr><tr><td>拓扑校验<\/td><td>折叠产生孤立边/非流形邻接<\/td><\/tr><tr><td>局部旋转更新<\/td><td>大弯折处细节拉伸塌陷<\/td><\/tr><tr><td>描述子旋转不变性<\/td><td>同模型转姿态后匹配失配<\/td><\/tr><\/tbody><\/table><\/div>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/discrete-geometry-processing", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化）", "href": "#/chapter/ch01"}, {"label": "第 2 章：点云曲面重建和光顺（配准、显式与隐式重建、曲面光顺）", "href": "#/chapter/ch02"}, {"label": "第 3 章：网格曲面的参数化和多分辨率表示（参数化、简化、压缩与渐进网格）", "href": "#/chapter/ch03"}, {"label": "第 4–9 章：重网格化、形状分析、网格形变、弹性模拟与机器学习几何处理", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "多边形网格、流形条件与半边数据结构", "href": "#/concept/c01"}, {"label": "离散曲率与 Laplace–Beltrami 算子：余切权格式、平均曲率法向与高斯曲率", "href": "#/concept/c02"}, {"label": "点云配准：粗配准（RANSAC、4PCS）与精配准（ICP、CPD）", "href": "#/concept/c03"}, {"label": "显式与隐式曲面重建：Voronoi/Delaunay 滤波、零水平集、RBF 与 Poisson 重建", "href": "#/concept/c04"}, {"label": "曲面光顺：基于顶点距离误差与基于法向梯度误差的滤波平滑", "href": "#/concept/c05"}, {"label": "网格参数化：映射优化模型、Jacobian 扭曲度量、调和/共形能量与防翻转", "href": "#/concept/c06"}, {"label": "网格简化：二次误差度量（QEM）边折叠与渐进网格多分辨率表示", "href": "#/concept/c07"}, {"label": "网格形变：梯度域 Poisson 编辑与保刚性（ARAP 式）局部旋转能量", "href": "#/concept/c08"}, {"label": "三维形状分析：全局与局部形状描述子、模型分割与匹配检索", "href": "#/concept/c09"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化）", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：点云曲面重建和光顺（配准、显式与隐式重建、曲面光顺）", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：网格曲面的参数化和多分辨率表示（参数化、简化、压缩与渐进网格）", "href": "#/quiz/ch03"}, {"label": "测验：第 4–9 章：重网格化、形状分析、网格形变、弹性模拟与机器学习几何处理", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.13<\/div><h1>第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化）<\/h1>\n<blockquote>对应原书第 1 章 §1.1–1.6（PDF 第 13–42 页；章首两处互核：PDF 13 页为印刷页 1，PDF 42 页为印刷页 30）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出多边形网格的顶点集、边集、面片集三层结构，判断一张网格是否满足流形条件；\n<\/li><li>\n描述半边数据结构的五类指针，并推演从一条半边出发遍历一个面或一个顶点 1-环邻域的过程；\n<\/li><li>\n写出连续曲面上切平面、法向、主曲率、平均曲率与高斯曲率的定义关系；\n<\/li><li>\n从连续 Laplace–Beltrami 算子出发，经高斯定理推出余切权离散格式与平均曲率法向；\n<\/li><li>\n解释 Hausdorff 距离的上下界估计思路，以及无约束/带约束优化中搜索方向与步长的选择依据。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>离散几何处理先把连续几何对象变成有限存储的采样表示：网格、点云、隐式场；再把连续微分几何与优化理论映射到这些离散结构上。本章的两条主线是——表示层（网格怎样组织邻接关系）与算子层（曲率、法向、Laplace 量怎样在 1-环邻域上算出来），后续重建、参数化、简化、形变全部建立在这两层之上。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：多边形网格、流形条件与半边数据结构（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。§1.1.1 把网格记为顶点集合 <span class=\"katex-inline\">V<\/span>、边集合 <span class=\"katex-inline\">E<\/span>、面片集合 <span class=\"katex-inline\">F<\/span>（PDF 第 14 页）：每条边连接两个顶点，每个面片由一组成环的边围成。拓扑上网格分流形与非流形：流形网格中每条边最多邻接两个面片，每个顶点的邻接面片构成闭合或开放的单一扇面（PDF 第 16 页）。半边结构把每条边拆成方向相反的两条半边，用起点、邻接面、同面下一条边、对偶半边等指针记录连接关系，使面遍历与 1-环邻域遍历成为常数邻接时间的操作。<\/p>\n<h3>2. 概念 2：连续曲率到离散曲率（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。§1.3.1 在嵌入 <span class=\"katex-inline\">\\mathbb{R}^3<\/span> 的光滑曲面 <span class=\"katex-inline\">S<\/span> 上定义切平面、法向、法曲率、主曲率 <span class=\"katex-inline\">k_1,k_2<\/span>、平均曲率 <span class=\"katex-inline\">H=(k_1+k_2)/2<\/span> 与高斯曲率 <span class=\"katex-inline\">K=k_1k_2<\/span>（PDF 第 27–28 页）。§1.3.2 假定网格只是光滑曲面的分片逼近，把顶点处几何属性定义为邻近有限面积区域上的空间平均；在 Voronoi 元胞或重心元胞上，由高斯定理把 Laplace–Beltrami 算子的面积分化成 1-环邻域的余切权求和，得到平均曲率法向与离散高斯曲率（PDF 第 29–31 页）。<\/p>\n<h3>3. 概念 3：样条表示、计算几何度量与数值优化（背景）<\/h3>\n<p>§1.2 梳理三次样条、Bézier、B-样条与有理样条（NURBS）：样条以少量控制参数刻画形状，精度高但表达任意拓扑复杂细节受限；网格与点云是与之并列的离散表示。§1.4 给出 Hausdorff 距离 <span class=\"katex-inline\">h(A,B)=\\max_{a\\in A}\\min_{b\\in B}d(a,b)<\/span>，并由子集包含关系给出上下界估计：采样子集算下界，细分收紧上界（PDF 第 33–34 页）。§1.5 把优化写成 <span class=\"katex-inline\">\\min f(x)<\/span> 带等式/不等式约束的形式，线搜索先定方向再定步长，信赖域先定半径再在域内求方向；拉格朗日乘子法处理等式约束，ADMM 交替最小化，MPRGP 处理带边界约束的二次规划（PDF 第 37–41 页）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[连续曲面 S] --&gt; B[离散表示: 网格/点云/隐式场]\n    B --&gt; C[邻接结构: 半边与 1-环邻域]\n    C --&gt; D[离散算子: 余切权 Laplace / 曲率 / 法向]\n    D --&gt; E[几何处理能量: 光顺/参数化/简化/形变]\n    F[连续微分几何] --&gt; D\n    G[数值优化: 线搜索/信赖域/约束求解] --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这条依赖链断在 C 就崩——邻接关系存不下来，后面所有 1-环邻域求和都无法定义；断在 D 则能量函数只剩几何坐标而没有曲率与梯度信息。<\/p>\n<h2>推导一（算法推演）：半边结构上的面遍历与顶点邻域遍历<\/h2>\n<p>推演目标：给定网格半边结构，从一条半边 <span class=\"katex-inline\">h<\/span> 出发，遍历所在面片的全部半边，再遍历起点顶点的 1-环邻域。<\/p>\n<ol><li>\n记 <span class=\"katex-inline\">h<\/span> 的指针：<code>origin(h)<\/code> 为起点，<code>face(h)<\/code> 为邻接面，<code>next(h)<\/code> 为同面下一条半边，<code>flip(h)<\/code> 为对偶半边。\n<\/li><li>\n遍历面片：从 <span class=\"katex-inline\">h_0=h<\/span> 开始，令 <span class=\"katex-inline\">h_{k+1}=\\mathrm{next}(h_k)<\/span>；回到 <span class=\"katex-inline\">h_0<\/span> 时停止。面片顶点依次为 <code>origin(h_0)<\/code>, <code>origin(h_1)<\/code>, …，遍历顺序与面片逆时针方向一致（沿外法向）。\n<\/li><li>\n遍历顶点邻域：令当前半边 <span class=\"katex-inline\">a<\/span> 为从该顶点出发的半边；取对偶 <span class=\"katex-inline\">b=\\mathrm{flip}(a)<\/span>，再取同面下一条 <span class=\"katex-inline\">a&#x27;=\\mathrm{next}(b)<\/span>，<span class=\"katex-inline\">a&#x27;<\/span> 即从该顶点出发的下一条半边。重复 <span class=\"katex-inline\">a\\leftarrow a&#x27;<\/span>，直到回到初始半边。沿途 <code>origin(flip(a))<\/code> 给出邻接顶点，<code>face(a)<\/code> 给出邻接面片。\n<\/li><li>\n复杂度：一个面片有 <span class=\"katex-inline\">k<\/span> 条边，面遍历访问 <span class=\"katex-inline\">k<\/span> 条半边；顶点度数为 <span class=\"katex-inline\">d<\/span>，邻域遍历访问 <span class=\"katex-inline\">d<\/span> 条半边，均与访问元素数成正比，不依赖网格总规模。\n<\/ol>\n<p>推演依据：半边结构把连接关系显式存在边上，<code>next<\/code> 与 <code>flip<\/code> 两个指针组合即可推出上一条半边，因此上一条半边指针在原书结构中标为可选。<\/p>\n<h2>推导二（证明/推导）：从连续 Laplace–Beltrami 到余切权离散格式<\/h2>\n<p>推导目标：在三角网格顶点 <span class=\"katex-inline\">v_i<\/span> 的邻域 <span class=\"katex-inline\">\\Omega_i<\/span> 上，把平均曲率法向算子的面积分离散成邻接顶点的余切权线性组合。<\/p>\n<ol><li>\n连续对应：平均曲率算子即曲面流形上的 Laplace–Beltrami 算子。取共形参数 <span class=\"katex-inline\">(u,v)<\/span>，曲面上的 Laplace 算子为 <span class=\"katex-inline\">\\Delta=\\partial_{uu}+\\partial_{vv}<\/span>；对函数 <span class=\"katex-inline\">z<\/span>，面积分 <span class=\"katex-inline\">\\int_{\\Omega_i}\\Delta z\\,dA<\/span> 可借高斯定理化为边界积分。\n<\/li><li>\n网格上每个三角形定义局部曲面度量；对共享边 <span class=\"katex-inline\">(i,j)<\/span> 的两个三角形，记其对顶角为 <span class=\"katex-inline\">\\alpha_{ij}<\/span>、<span class=\"katex-inline\">\\beta_{ij}<\/span>。高斯定理的边界贡献落到每条边上，边 <span class=\"katex-inline\">(i,j)<\/span> 对顶点 <span class=\"katex-inline\">i<\/span> 的权重为 <span class=\"katex-inline\">\\cot\\alpha_{ij}+\\cot\\beta_{ij}<\/span>。\n<\/li><li>\n逐边合并 1-环邻域 <span class=\"katex-inline\">N(i)<\/span> 的贡献，得到离散求和：\n<\/ol>\n<div class=\"katex-block\">\\int_{\\Omega_i}\\Delta z\\,dA=\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(z_j-z_i)<\/div>\n<ol><li>\n除以邻域面积 <span class=\"katex-inline\">A_i<\/span>，得到平均曲率法向算子的离散格式：\n<\/ol>\n<div class=\"katex-block\">H(v_i)\\mathbf n_i=-\\frac{1}{2A_i}\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(v_j-v_i)<\/div>\n<ol><li>\n收敛前提：网格分片逼近光滑曲面，邻域取 Voronoi 元胞或重心元胞且非退化；随局部采样密度增大，顶点处空间平均收敛到连续定义。\n<\/ol>\n<p>推导依据：高斯定理把面积分换成边界周线积分；余切权重来自三角形边与对顶角的局部几何关系；面积归一化使格式与元胞面积无关地趋近连续曲率。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉流形假设<\/strong>：若一条边邻接三个面片，或一个顶点的邻接面片分成两个互不连通的扇面，半边 <code>flip<\/code> 指针无法唯一配对，面遍历与 1-环邻域遍历会出现环断裂或重复访问。此时余切权格式仍能逐三角形写出，但邻域不是拓扑圆盘，平均曲率与高斯曲率的连续对应失去意义，曲率估计可能在非流形接缝处发散。\n<\/li><li>\n<strong>去掉余切权，改用均匀权重<\/strong>：把 <span class=\"katex-inline\">(\\cot\\alpha_{ij}+\\cot\\beta_{ij})<\/span> 换成常数 <span class=\"katex-inline\">1<\/span>，离散格式退化为邻点算术平均的缩放形式。细长三角形占大角度时，对顶角余切值很小，均匀权会把细长三角形的影响与等边三角形等同对待，曲率法向被斜边方向拉偏；网格细化时该格式不保证收敛到连续 Laplace–Beltrami 算子。\n<\/li><li>\n<strong>去掉邻域非退化假设<\/strong>：若三角形面积趋近零，<span class=\"katex-inline\">A_i<\/span> 趋于零，除以 <span class=\"katex-inline\">A_i<\/span> 的曲率法向放大为无穷大；退化面片需要先做重网格化或剔除，再跑算子。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：半边结构像把一张网的每条棱剪成两段单向车道，车道上挂着&quot;本侧目的地（邻接面）&quot;&quot;下一个路口（next）&quot;&quot;对向车道（flip）&quot;四块路牌；绕面与绕顶点就是沿路牌换乘绕圈。\n<\/li><li>\n实例：一个等边三角形顶点 <span class=\"katex-inline\">i<\/span> 有两个邻接三角形共享边 <span class=\"katex-inline\">(i,j)<\/span>，每个对顶角 <span class=\"katex-inline\">\\alpha_{ij}=\\beta_{ij}=60^\\circ<\/span>，<span class=\"katex-inline\">\\cot60^\\circ=1/\\sqrt{3}<\/span>，边权为 <span class=\"katex-inline\">2/\\sqrt{3}<\/span>；若三角形退化为接近平直，对顶角接近 <span class=\"katex-inline\">180^\\circ<\/span>，<span class=\"katex-inline\">\\cot<\/span> 趋于零，该边权重被压低。\n<\/li><li>\n实例：Hausdorff 距离比较两个网格时，撒点采样只能给出近似；按三角形细分逐步收紧上下界，是在精度与遍历开销之间换取可控误差。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n误解 1：网格里只要有三角形就是流形网格。为什么错：流形是拓扑条件，与面片形状无关；三边共边、顶点扇面分裂等情况形状画得规整，拓扑上仍是非流形。\n<\/li><li>\n误解 2：离散曲率就是顶点邻接点的平均坐标位移。为什么错：邻点平均是几何位置平均；曲率算子带余切权与面积归一化，且平均曲率法向是向量，高斯曲率是角度亏损除以面积，二者不能混为一种量。\n<\/li><li>\n误解 3：样条与网格是两种互相替代的表示，选一个即可。为什么错：原书把样条视作 CAD 主流表示，网格视为图形与数值计算核心表示；同一算法不同环节可能在两种表示间转换，§1.1 并列介绍正是这个原因。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n一条边邻接三个面片时，半边结构的哪条指针无法唯一确定？对曲率计算会产生什么影响？\n<\/li><li>\n写出余切权离散 Laplace 格式中各符号的含义：<span class=\"katex-inline\">N(i)<\/span>、<span class=\"katex-inline\">\\alpha_{ij}<\/span>、<span class=\"katex-inline\">\\beta_{ij}<\/span>、<span class=\"katex-inline\">A_i<\/span>。\n<\/li><li>\n为什么均匀权重的 Laplace 平滑在细长三角形区域会把法向拉偏？从对顶角角度解释。\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n流形网格的两条判据：每条边至多邻接两面，每个顶点邻接面片构成单一扇面。\n<\/li><li>\n余切权格式：<span class=\"katex-inline\">H(v_i)\\mathbf n_i=-\\frac{1}{2A_i}\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(v_j-v_i)<\/span>。\n<\/li><li>\n离散算子的收敛依赖分片逼近、邻域非退化与采样密度增大三条前提。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章是全书地基：表示层交给第 2 章点云重建（把扫描点拼成网格）与第 3 章参数化、简化（在网格邻接结构上做映射与删边）；算子层交给第 2 章光顺（沿曲率法向滤波）、第 3 章参数化能量与第 4 章形变（局部旋转约束建立在 1-环邻域上）。第 1 章末尾的数值优化方法，是后面各类变形能量迭代求解的通用工具箱。<\/p>", "ch02": "<div class=\"source-badge\">📖 出处：离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.43<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化）<\/a><\/span><\/div><h1>第 2 章：点云曲面重建和光顺（配准、显式与隐式重建、曲面光顺）<\/h1>\n<blockquote>对应原书第 2 章 §2.1–2.5（PDF 第 43–83 页；章首互核：PDF 43 页为印刷页 31，PDF 83 页为印刷页 71）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n把点云配准问题写成刚性变换 <span class=\"katex-inline\">(R,t)<\/span> 的最小二乘误差优化，说出粗配准与精配准的分工；\n<\/li><li>\n推演 ICP 算法&quot;最近点对应—刚体参数估计—更新源点云&quot;的迭代循环，说明其初值依赖；\n<\/li><li>\n比较显式重建（Voronoi/Delaunay 滤波、Crust、Power Crust、Cocone）与隐式重建（符号距离场、RBF、Poisson、MPU）的构造路线与适用条件；\n<\/li><li>\n写出 Poisson 重建从指示函数梯度逼近法向场到求解 <span class=\"katex-inline\">\\Delta\\chi=\\nabla\\cdot\\mathbf w<\/span> 的推导链；\n<\/li><li>\n区分基于顶点距离误差与基于法向梯度误差两类光顺能量，说明特征保持的取舍。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>扫描得到的点云错位、有噪、有缺失，本章按三条管线处理：先配准把多片点云拼到同一坐标系，再重建出网格——显式路线用 Delaunay 三角剖分滤出表面三角形，隐式路线构造标量场抽零等值面，末段用光顺去掉噪声同时尽量保住形状特征。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：点云配准（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。§2.1.1 刚性配准求解 <span class=\"katex-inline\">(R,t)<\/span>，使源点云 <span class=\"katex-inline\">X<\/span> 变换后与目标点云 <span class=\"katex-inline\">Y<\/span> 误差最小：<span class=\"katex-inline\">\\min_{R,t}\\sum_{i=1}^{N}\\|y_i-(Rx_i+t)\\|^2<\/span>（PDF 第 44–45 页）。流程分粗配准与精配准：粗配准代表方法为 RANSAC 随机采样一致性与 4PCS 四点共面集；精配准代表方法为 ICP 迭代最近点与 CPD 相干点漂移（PDF 第 45、48、50 页）。非刚性配准引入局部仿射变换或拟刚体变形，配准误差与刚性正则项加权组合。<\/p>\n<h3>2. 概念 2：显式与隐式曲面重建（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。§2.2 显式重建从点集的 Voronoi 图与 Delaunay 三角剖分出发展开：Voronoi 单元是空间中距该样本点最近的点集，对偶 Delaunay 剖分外接圆内不含其他样本点（PDF 第 58–59 页）。Crust 取样本点的极点加入点集再做 Delaunay，滤除顶点不全属于原样本点的三角形；Power Crust 用加权 Voronoi（Power 图）逼近中轴；Cocone 用极点估计法向、以双锥体筛选 Voronoi 边对应的对偶三角形（PDF 第 61、63 页）。§2.3 隐式重建把曲面写成标量函数零水平集：符号距离场取到邻近切平面的带符号投影距离，RBF 以径向基函数插值或拟合约束，Poisson 重建用指示函数梯度逼近法向场，MPU 用八叉树单元内局部二次函数加权混合（PDF 第 65–66、69、73 页）。<\/p>\n<h3>3. 概念 3：曲面光顺（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。§2.4 分三类：基于顶点的光顺把顶点向滤波后邻域位置移动；基于法向的光顺先滤波面法向，再让更新后三角形贴近滤波法向（PDF 第 80 页）；数据驱动方法用级联网络回归法向滤波算子。基于法向的两类能量中，距离误差最小化让顶点贴近邻域滤波三角形平面，梯度误差最小化让新三角形法向与滤波法向对齐；后者匹配法向更精确、对剖分更鲁棒，计算量稍大。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[多视角扫描点云] --&gt; B[粗配准: RANSAC / 4PCS]\n    B --&gt; C[精配准: ICP / CPD]\n    C --&gt; D{重建路线}\n    D --&gt; E[显式: Voronoi-Delaunay 滤波]\n    D --&gt; F[隐式: 零水平集 SDF / RBF / Poisson / MPU]\n    E --&gt; G[网格曲面]\n    F --&gt; G\n    G --&gt; H[光顺: 顶点距离误差 / 法向梯度误差]\n    H --&gt; I[高质量网格]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：配准环断裂会让两片点云错位，后续重建把错位缝成错误表面；隐式路线缺了法向定向约束，内外符号反转会抽出错内错外的等值面。<\/p>\n<h2>推导一（算法推演）：ICP 的迭代循环与不变量<\/h2>\n<p>推演目标：给定源点云 <span class=\"katex-inline\">X=\\{x_i\\}<\/span> 与目标点云 <span class=\"katex-inline\">Y<\/span>，初值 <span class=\"katex-inline\">(R_0,t_0)<\/span>，迭代逼近最优刚性变换。<\/p>\n<ol><li>\n对应步骤：对当前变换后的源点云 <span class=\"katex-inline\">X_k=R_kX+t_k<\/span>，在 <span class=\"katex-inline\">Y<\/span> 中为每个 <span class=\"katex-inline\">x_i^{(k)}<\/span> 找最近点 <span class=\"katex-inline\">c_i^{(k)}<\/span>，组成对应点集 <span class=\"katex-inline\">C_k<\/span>。\n<\/li><li>\n参数估计步骤：求解最小二乘刚体变换 <span class=\"katex-inline\">(R_k,t_k)<\/span>，使 <span class=\"katex-inline\">\\sum_i\\|c_i^{(k)}-(R_kx_i+t_k)\\|^2<\/span> 最小；旋转部分由对应点去质心后的协方差矩阵奇异值分解得到，平移部分取质心差。\n<\/li><li>\n更新步骤：把 <span class=\"katex-inline\">R_k,t_k<\/span> 作用于源点云得到 <span class=\"katex-inline\">X_{k+1}<\/span>，记录均方误差 <span class=\"katex-inline\">e_k<\/span>。\n<\/li><li>\n收敛判断：相邻两次迭代误差差小于阈值或变换矩阵变化小于阈值时停止；否则回到步骤 1。\n<\/ol>\n<p>推演依据：每一步固定对应关系时，刚体最小二乘有闭式解；固定刚体时最近点对应唯一确定。ICP 的不变量是旋转保距、平移保距，因此对应点间欧氏距离度量在变换中保持定义。局限：最近点对应在两片点云初始错位较大时容易收敛到局部最小，所以 ICP 常接在粗配准结果之后使用。<\/p>\n<h2>推导二（证明/推导）：Poisson 重建的指示函数方程<\/h2>\n<p>推导目标：从&quot;指示函数梯度逼近点云法向量场&quot;出发，推出可离散求解的 Poisson 系统。<\/p>\n<ol><li>\n设定指示函数 <span class=\"katex-inline\">\\chi<\/span>：曲面内部取值 1，外部取值 <span class=\"katex-inline\">-1<\/span>，曲面为零等值面；采样点处 <span class=\"katex-inline\">\\nabla\\chi<\/span> 近似等于曲面内法向 <span class=\"katex-inline\">\\mathbf m<\/span>，其余位置梯度为零向量。\n<\/li><li>\n逼近目标：最小化 <span class=\"katex-inline\">\\|\\nabla\\chi-\\mathbf w\\|^2<\/span>，其中 <span class=\"katex-inline\">\\mathbf w<\/span> 为点云法向构成的向量场。\n<\/li><li>\n变分展开：对泛函求一阶变分，梯度残差的散度形式给出最优性条件——指示函数梯度场的散度等于目标向量场的散度：\n<\/ol>\n<div class=\"katex-block\">\\Delta\\chi=\\nabla\\cdot\\mathbf w<\/div>\n<ol><li>\n离散化：用自适应八叉树表示隐函数，每个节点带节点函数；向量场 <span class=\"katex-inline\">\\mathbf w<\/span> 由采样点内法向按局部面积加权，卷积盒式滤波表达为节点函数的线性求和；代入上式得到稀疏线性方程组 <span class=\"katex-inline\">\\min\\|\\nabla\\mathbf A\\chi-\\mathbf Y\\|^2<\/span> 形式的最小二乘系统。\n<\/li><li>\n抽取等值面：解出 <span class=\"katex-inline\">\\chi<\/span> 在各节点的值，选合适等值面用 Marching Cubes 类方法抽成网格。\n<\/ol>\n<p>推导依据：变分法把泛函极小化的一阶条件写成散度等式；法向场由曲面内法向在局部区域上的积分近似（式 2.36）；八叉树节点函数保证非均匀采样处仍有足够分辨率。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉法向全局定向<\/strong>：隐式重建依赖法向约定曲面内外；若相邻法向一半向内一半向外，向量场 <span class=\"katex-inline\">\\mathbf w<\/span> 互相抵消，Poisson 散度场失真，抽出的等值面局部翻面、孔洞或内外面颠倒。§2.3 用图优化把邻切平面法向点积最大化来统一方向，这一步不能省。\n<\/li><li>\n<strong>去掉采样密度与低噪声假设<\/strong>：显式 Delaunay 滤波在欠采样区域找不到足够邻近三角形，产生孔洞与伪像；噪声点被 Delaunay 四面体带进候选集，滤出细长错误三角形。Tight Cocone 靠标记内外四面体补水密表面，但严重噪声下仍会恶化。\n<\/li><li>\n<strong>去掉对应关系已知这一步<\/strong>：ICP 把&quot;最近点&quot;当对应；若两片点云形变差异大（非刚性场景），最近点并非真实对应，刚体估计把拉伸量误当旋转平移，迭代停在错误配准。这类场景要换 CPD 概率对应或非刚性配准能量。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：显式重建像在散点之间拉三角网再筛掉不属于表面的边；隐式重建像先给空间每个点标一个&quot;内外倾向值&quot;，再沿值为零的地方切片成面。\n<\/li><li>\n实例：Crust 流程中先算样本点集 <span class=\"katex-inline\">P<\/span> 的 Voronoi 图，取距样本最远且分居表面两侧的极点集合 <span class=\"katex-inline\">P&#x27;<\/span>，对 <span class=\"katex-inline\">P\\cup P&#x27;<\/span> 做 Delaunay 剖分，只保留三个顶点都属于 <span class=\"katex-inline\">P<\/span> 的三角形；极点相当于替中轴方向投下的辅助点。\n<\/li><li>\n实例：RBF 重建对带噪点云改用拟合而非严格插值，加入平滑参数 <span class=\"katex-inline\">\\delta<\/span> 平衡数据不光滑性；贪心迭代在误差大的位置补约束点再重算。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n误解 1：显式重建直接把相邻点连成三角形即可。为什么错：裸连接不经过 Voronoi/Delaunay 滤波，会把表面两侧样本连进内部三角形；滤波步骤依据外接圆与极点关系筛边，不是就近连线。\n<\/li><li>\n误解 2：隐式重建不需要点云法向。为什么错：纯位置约束下零等值面的内外符号无法定出；法向是最常用的附加约束，法向估计质量直接决定隐式曲面是否闭合正确。\n<\/li><li>\n误解 3：光顺越强越好。为什么错：基于顶点的低通滤波在去噪同时削平高曲率特征；特征保持要靠法向滤波或数据驱动算子，并在能量里权衡细节保留与噪声去除。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\nICP 每一步固定对应关系时，刚体参数为什么有闭式解？初值不好时会出什么问题？\n<\/li><li>\n写出 Poisson 重建最优性条件的方程，并说明向量场 <span class=\"katex-inline\">\\mathbf w<\/span> 由什么近似得到。\n<\/li><li>\n显式重建与隐式重建在噪声、缺失数据两类缺陷下各自的短板是什么？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n配准管线：粗配准给初值，ICP/CPD 精配准交替更新对应与变换。\n<\/li><li>\n显式靠 Voronoi/Delaunay 滤波，隐式靠标量场零水平集；法向定向是隐式内外的依据。\n<\/li><li>\n两类光顺：距离误差贴近邻域平面，法向误差对齐滤波法向，后者鲁棒但计算更贵。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章接住第 1 章的网格邻接结构与离散算子：配准与重建输出的网格，是第 3 章参数化、简化与压缩的输入；光顺用到的法向与曲率量来自第 1 章离散曲率格式。第 3 章多分辨率简化反过来为重建模型提供不同精度层级，第 4 章形变则在本章光顺后的网格上施加局部变换约束。<\/p>", "ch03": "<div class=\"source-badge\">📖 出处：离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.84<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化）<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：点云曲面重建和光顺（配准、显式与隐式重建、曲面光顺）<\/a><\/span><\/div><h1>第 3 章：网格曲面的参数化和多分辨率表示（参数化、简化、压缩与渐进网格）<\/h1>\n<blockquote>对应原书第 3 章 §3.1–3.3（PDF 第 84–122 页；章首互核：PDF 84 页为印刷页 72，PDF 105 页为印刷页 93）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01、ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n把网格参数化写成&quot;扭曲能量 + 位置约束&quot;的优化模型，说清单射与无翻转两条非退化条件；\n<\/li><li>\n写出映射 Jacobian 矩阵，解释共形、Dirichlet、伸缩等几类形变能量度量的差别；\n<\/li><li>\n定义 QEM 二次误差度量，推导折叠后顶点的二次型误差与最优折叠位置；\n<\/li><li>\n描述边折叠优先队列简化流程，并说明局部拓扑条件怎样约束可折叠边；\n<\/li><li>\n解释渐进网格的分解/重建两步：边折叠记录与顶点分裂逆操作。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>网格拿到后要解决两类降复杂度问题：把三维曲面摊到二维参数域做贴图与对应，这是参数化；把顶点面片数压到更少而少改形状，这是简化与多分辨率表示。两条路线都靠能量驱动：参数化最小化局部扭曲，简化按局部误差贪心删边，压缩则把邻接与坐标信息编码成渐进数据流。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：网格参数化（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。§3.1 把参数化建模为优化：<span class=\"katex-inline\">\\min_\\phi E(\\phi)+\\sum_i\\omega_i\\|u_i-\\bar u_i\\|^2<\/span>，<span class=\"katex-inline\">E(\\phi)<\/span> 为扭曲度量，位置约束以罚项形式给出（PDF 第 85 页）。平面参数化要求映射局部单射 <span class=\"katex-inline\">|J\\phi|\\neq 0<\/span>，且三角形在参数域内保持正定向面积（无翻转条件）。单片参数化把整张开网格映到一片参数域；闭合曲面或高弯曲区域扭曲大，需要分割成与圆盘同胚的多片分别参数化。能量可选 Dirichlet、共形、伸缩、Green–Lagrange、ABF 角度平摊或尽可能刚性（ARAP）能量；二次能量可解线性方程组，非二次能量用逐顶点或局部到整体交替迭代（PDF 第 85–86、92、98 页）。<\/p>\n<h3>2. 概念 2：QEM 简化与渐进网格（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。§3.2.1 简化目标是减少顶点与面片数量而尽量少改形状；方法含面片合并、顶点聚类、顶点删除与边折叠，边折叠法通过不断把一条网格边收缩为单个顶点实现简化，并结合局部误差估计构造优先队列贪心选择（PDF 第 101–102 页）。Garland 等提出的 QEM 定义折叠后顶点到折叠前两顶点邻接全部三角形平面的距离平方和（PDF 第 103 页）。§3.2.2 多分辨率表示分离散与连续两类：连续表示含分解与重建两步，渐进网格把每步边折叠 <span class=\"katex-inline\">ecol<\/span> 与逆操作顶点分裂 <span class=\"katex-inline\">vsplit<\/span> 记录进数据流，从最简网格逐步分裂恢复原网格（PDF 第 105 页）。§3.3 压缩编码包括三角形条带、广义三角形网、单网格压缩、渐进网格压缩与网格序列压缩。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[输入三角网格] --&gt; B[参数化: 扭曲能量 + 位置约束]\n    B --&gt; C[二维参数域: 贴图/对应/重映射]\n    A --&gt; D[QEM 边折叠: 误差优先队列]\n    D --&gt; E[简化网格序列]\n    E --&gt; F[渐进网格: 折叠记录 vsplit 逆操作]\n    F --&gt; G[多分辨率传输与绘制]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：参数化缺了无翻转条件，贴图三角形会翻面重叠；简化缺了局部拓扑校验，边折叠可能把非流形缝、孔
