 <span class=\"katex-inline\">j<\/span> 归入种子子集 <span class=\"katex-inline\">S_i<\/span>，按距离函数 <span class=\"katex-inline\">\\|s_i-j\\|<\/span> 归类；迭代法交替更新种子与聚类。边界判定看相邻面片特征差与几何不连续（棱边、曲率突变）。<\/p>\n<\/ol>\n<p><strong>匹配与检索<\/strong>：描述子向量距离（欧氏、直方图交、核）度量相似性；检索按相似度排序返回候选模型库；匹配在局部描述子之间找对应，再验证整体一致性（对应点空间位置、刚体变换或非刚性对齐误差）。粗检索用全局描述子筛候选，精匹配用局部描述子建对应。<\/p>\n<p><strong>不变性口径<\/strong>：描述子对平移不敏感（中心化）、对旋转不敏感（方向统计或旋转不变基）、对尺度不敏感（归一化尺寸）。<\/p>\n<p><strong>正例<\/strong>：两个同姿态椅子模型，形状分布直方图接近，检索排序靠前；局部描述子把两条椅腿对应起来。<\/p>\n<p><strong>反例<\/strong>：描述子按原始坐标统计，模型转个角度向量分布改变，同类被判为异类。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>描述子构造流程<\/strong>：预处理（中心化、归一化、法向定向）→ 特征量采样（法向、曲率、点对距离、投影）→ 统计成直方图或系数向量 → 归一化到可比口径。<\/p>\n<p><strong>距离比较<\/strong>：全局向量欧氏距离 <span class=\"katex-inline\">d=\\|D_a-D_b\\|<\/span>；直方图用交或 <span class=\"katex-inline\">\\chi^2<\/span> 距离；局部描述子最近邻匹配后统计一致对应数。<\/p>\n<p><strong>分割聚类逻辑<\/strong>：特征空间中相邻面片相似度高；把面片特征向量聚类，同一聚类对应一个部件。种子法从标记区域生长；谱方法利用邻接图拉普拉斯谱嵌入聚类；图割把分割写成能量最小化（区域项加边界项）。<\/p>\n<p><strong>协同分割<\/strong>：多模型描述子共享部件类别；联合聚类使同类部件在各模型中同时分出，减少单模型几何歧义。<\/p>\n<p><strong>不变性实现<\/strong>：平移用质心对齐消除；旋转用法向方向球统计或 Zernike 类旋转不变基；尺度用包围盒或体积归一化。描述子向量随后做长度归一化，使距离比较不受点云规模影响。<\/p>\n<p><strong>描述子评价标准<\/strong>：可区分性——类间向量距离大；鲁棒性——噪声、采样密度、局部缺损下向量稳定；不变性——刚体变换不改变向量；紧致性——维度可控，库内检索快；可重复性——同一区域不同采样下描述子稳定。五项标准之间存在取舍：维数高区分度强但检索慢，统计窗口大鲁棒但局部定位粗。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：网格拓扑完整、法向定向一致；描述子采样口径与模型分辨率匹配；检索库类别覆盖目标形状。\n<\/li><li>\n边界 1：全局描述子丢失局部细节，不能做部件级对应；局部描述子对邻域半径敏感，半径过大混入邻域、过小不稳定。\n<\/li><li>\n边界 2：非刚性形变模型（弯折前后）全局坐标描述子失效，需要形状上下文或内蕴不变量。\n<\/li><li>\n边界 3：学习类描述子在训练集外类别上泛化受限；手工描述子可解释但区分度有限。\n<\/li><li>\n边界 4：分割依赖几何相似性，语义部件与几何边界可能不一致；同材质相邻部件几何上连通，分割需要先验或交互种子。\n<\/li><li>\n失败案例：低分辨率网格法向抖动，局部描述子直方图被噪声拉偏，匹配对应率下降。\n<\/li><li>\n描述子与网格分辨率的关系：全局统计量对密度变化较稳，局部直方图受邻域三角形数量影响；同一模型不同细分级别要统一采样口径，或在描述子里用归一化权重。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>全局 vs 局部描述子<\/strong>：全局向量整模型统计，分类粗检索用；局部向量邻域窗口计算，对应与分割用。一个系统可两层并用：全局粗筛，局部精配。\n<\/li><li>\n<strong>手工 vs 学习描述子<\/strong>：手工统计量可解释、无需训练数据；学习特征靠数据提取，表达力强但依赖样本与标注。\n<\/li><li>\n<strong>分割 vs 匹配<\/strong>：分割在单模型内聚类部件；匹配在模型间找对应区域。分割结果可为匹配提供部件候选，匹配对齐可辅助协同分割。\n<\/li><li>\n<strong>描述子 vs 特征检测<\/strong>：检测找关键点位置，描述子给关键点邻域向量；两者常配合使用。\n<\/li><li>\n<strong>几何分割 vs 语义分割<\/strong>：几何分割按法向、曲率、距离聚类，边界落在几何不连续处；语义分割要求部件名（椅腿、扶手），需要类别先验或训练数据。几何聚类结果可作为语义标注的几何候选。\n<\/li><li>\n<strong>刚体匹配 vs 非刚性匹配<\/strong>：刚体匹配对齐姿态与位置，对应点距离经刚体变换后度量；非刚性匹配允许局部变形，对应关系在变形空间中评估。弯折前后模型用刚体描述子会失配。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 曲率与法向是描述子输入特征；c01 邻接结构支撑面片聚类；c06 参数化对应为局部匹配提供二维域；c05 光顺去除噪声对统计的干扰。后继：检索结果供模型库复用；分割部件可作为形变骨架区域；对应关系支撑 c03 类配准与形变前后比对。形状分析是几何处理管线中把网格转为语义与可比表达的环节，也是数据驱动几何处理取特征的入口。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（三维形状分析：全局与局部形状描述子、模型分割与匹配检索）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：描述子构造流程、分割聚类算例与匹配检索复盘<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把形状分析往回追四层：<\/p>\n<ol><li>\n<strong>网格输入<\/strong>：拓扑完整、法向定向、分辨率统一；噪声先光顺。\n<\/li><li>\n<strong>几何特征采样<\/strong>：法向、曲率、点对距离、投影轮廓、矩系数；采样口径与邻域半径确定。\n<\/li><li>\n<strong>描述子聚合<\/strong>：特征统计成直方图或固定维向量，做不变性对齐与归一化。\n<\/li><li>\n<strong>分析任务<\/strong>：分类检索用全局向量距离；分割聚类局部特征；匹配在局部描述子间建对应并验证一致性。\n<\/ol>\n<p>依赖链方向：网格输入 → 特征采样 → 描述子聚合 → 检索/分割/匹配任务。<\/p>\n<h2>正向推导：描述子构造逐步展开<\/h2>\n<p><strong>第一步，预处理。<\/strong> 质心对齐消除平移；包围盒或体积归一化消除尺度；法向定向统一（沿用 c04 重建口径）；可选重采样到均匀三角网格。<\/p>\n<p><strong>第二步，特征采样。<\/strong> 按描述子类型取量：法向方向投到单位球；随机点对算距离；多视角投影轮廓与深度；球面正交基系数。采样点数量决定统计稳定性。<\/p>\n<p><strong>第三步，统计聚合。<\/strong> 连续量分箱成直方图，或按基函数加权成系数向量；分箱宽度、基阶数是可调参数。<\/p>\n<p><strong>第四步，归一化。<\/strong> 向量长度归一化使距离比较不受点数量影响；直方图除以总样本数成概率分布。<\/p>\n<p><strong>第五步，不变性核对。<\/strong> 旋转后重算描述子，与原向量比较差异；旋转敏感的统计量需要换不变基或方向对齐。<\/p>\n<p><strong>第六步，距离定义。<\/strong> 欧氏距离用于连续向量；直方图交 <span class=\"katex-inline\">S=\\sum_k\\min(h_a(k),h_b(k))<\/span> 或 <span class=\"katex-inline\">\\chi^2<\/span> 距离用于分布；局部描述子最近邻加一致性验证。<\/p>\n<h2>正向推导：分割聚类逐步展开<\/h2>\n<p><strong>第一步，面片特征。<\/strong> 每个面片取法向、曲率、邻域距离特征组成向量 <span class=\"katex-inline\">f_j<\/span>。<\/p>\n<p><strong>第二步，种子初始化。<\/strong> 自动聚类从特征空间选初始中心；交互分割由用户标记种子面片。<\/p>\n<p><strong>第三步，归类。<\/strong> 面片 <span class=\"katex-inline\">j<\/span> 归入最近种子子集 <span class=\"katex-inline\">S_i<\/span>：<span class=\"katex-inline\">\\|f_j-s_i\\|<\/span> 最小者。<\/p>\n<p><strong>第四步，种子更新。<\/strong> 子集内面片特征平均得新种子 <span class=\"katex-inline\">s_i<\/span>；重复第三、四步到聚类稳定。<\/p>\n<p><strong>第五步，边界优化。<\/strong> 相邻面片特征差小则合并，特征差大（棱边、曲率突变）保持分界；图割形式把区域归属与边界代价写成能量最小化。<\/p>\n<p><strong>第六步，协同分割。<\/strong> 多模型联合聚类，部件类别跨模型对齐；单模型歧义由同批模型共同纠正。<\/p>\n<h2>数值算例一：形状分布直方图小例<\/h2>\n<p>模型上随机抽 6 对点，距离 <span class=\"katex-inline\">r<\/span>：<span class=\"katex-inline\">0.8,1.2,1.0,1.5,0.9,1.1<\/span>。分箱 <span class=\"katex-inline\">[0,1),[1,2)<\/span>。<\/p>\n<ol><li>\n第一箱：<span class=\"katex-inline\">0.8,0.9<\/span> 计 2；第二箱：<span class=\"katex-inline\">1.2,1.0,1.5,1.1<\/span> 计 4。\n<\/li><li>\n归一化：概率分布 <span class=\"katex-inline\">(2/6,4/6)=(1/3,2/3)<\/span>。\n<\/li><li>\n另一同类别模型采样分布接近，直方图交高；异类模型距离分布峰值位置不同，交低。\n<\/li><li>\n点对数少则直方图波动大；实际采样成百上千对点，分箱宽度按距离范围定。\n<\/ol>\n<h2>数值算例二：三面片聚类<\/h2>\n<p>面片特征 <span class=\"katex-inline\">f_1=(1,0.1)<\/span>，<span class=\"katex-inline\">f_2=(1.1,0)<\/span>，<span class=\"katex-inline\">f_3=(0,2)<\/span>。种子 <span class=\"katex-inline\">s_A=(1,0)<\/span>，<span class=\"katex-inline\">s_B=(0,2)<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">f_1<\/span> 到 <span class=\"katex-inline\">s_A<\/span> 距离 <span class=\"katex-inline\">\\sqrt{0.1^2}=0.1<\/span>，到 <span class=\"katex-inline\">s_B<\/span> 距离 <span class=\"katex-inline\">\\sqrt{1+4}\\approx2.24<\/span>，归 A。\n<\/li><li>\n<span class=\"katex-inline\">f_2<\/span> 到 <span class=\"katex-inline\">s_A<\/span> 距离 <span class=\"katex-inline\">0.1<\/span>，归 A。\n<\/li><li>\n<span class=\"katex-inline\">f_3<\/span> 到 <span class=\"katex-inline\">s_B<\/span> 距离 0，归 B。\n<\/li><li>\n更新种子：<span class=\"katex-inline\">s_A=(f_1+f_2)/2=(1.05,0.05)<\/span>，<span class=\"katex-inline\">s_B=f_3<\/span>；再归类保持不变，聚类收敛。\n<\/li><li>\n边界在 <span class=\"katex-inline\">f_2<\/span> 与 <span class=\"katex-inline\">f_3<\/span> 之间；法向或曲率差异决定这条分界是否为真实部件边界。\n<\/ol>\n<h2>数值算例三：旋转不变性核对<\/h2>\n<p>模型绕轴旋转 <span class=\"katex-inline\">90^\\circ<\/span>。<\/p>\n<ol><li>\n法向方向球直方图：法向随模型一起转，投到球上的分布整体旋转；用球面均匀分箱时分布形状不变，直方图向量稳定。\n<\/li><li>\n原始坐标直接统计：坐标方向分布改变，描述子变化。\n<\/li><li>\nZernike 矩：球面正交基在旋转下系数按基变换，旋转不变阶系数保持。\n<\/li><li>\n结论：描述子是否不变取决于统计量的几何口径；选不变口径或先做方向对齐。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>姿态未对齐直接比较。<\/strong> 模型摆放角度不同，原始坐标描述子距离大，同类排到检索后面。处置：质心对齐加旋转不变统计。<\/p>\n<p><strong>邻域半径失当。<\/strong> 局部描述子半径过大吞进相邻部件，特征混合；半径过小邻域点少，直方图不稳。处置：按模型尺度分级选半径，多尺度描述子并置。<\/p>\n<p><strong>噪声拉偏法向直方图。<\/strong> 低分辨率网格法向抖动，法向分布散开，类间区分度下降。处置：光顺后再采样，或对法向做邻域滤波。<\/p>\n<p><strong>语义边界与几何边界错位。<\/strong> 同一部件表面几何连续，几何聚类把多部件并片；需要交互种子或学习类先验。<\/p>\n<p><strong>训练集外类别。<\/strong> 学习描述子只见过训练类别，新类别特征向量不可比；检索库要覆盖目标类别，或回退手工描述子。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n卡在&quot;全局和局部怎么配合&quot;：全局粗筛候选，局部精匹配对应；不是二选一。\n<\/li><li>\n卡在&quot;距离度量怎么选&quot;：连续向量欧氏，分布直方图用交或 <span class=\"katex-inline\">\\chi^2<\/span>；度量要与描述子形式匹配。\n<\/li><li>\n卡在&quot;分割迭代怎么停&quot;：种子移动小于阈值或归类不再变化即停。\n<\/li><li>\n卡在&quot;不变性靠什么实现&quot;：平移质心对齐，旋转不变基或方向球，尺度归一化；逐项消去刚体变换影响。\n<\/li><li>\n卡在&quot;描述子维数取舍&quot;：维数高区分强检索慢，维数低紧致但特征丢失；按检索规模与类别数定。\n<\/ul>\n<h2>补充展开七：采样口径细节<\/h2>\n<p>全局描述子采样：法向方向球按经纬度分箱；点对距离随机采样固定对数；投影视角按均匀环绕分布选取；Zernike 阶数截断到指定阶。局部描述子采样：邻域半径内面片或点按距离加权，特征向量分箱。采样数量不足时直方图波动，过密则计算成本上升。同一模型库内所有模型使用相同分箱宽度、视角数与基阶数，保证向量维度对齐。<\/p>\n<h2>补充展开八：检索排序流程<\/h2>\n<ol><li>\n库内每个模型预计算描述子向量入库；\n<\/li><li>\n查询模型描述子与库内向量逐一算距离；\n<\/li><li>\n距离升序排序，取前 <span class=\"katex-inline\">k<\/span> 候选；\n<\/li><li>\n候选过局部描述子精匹配复核；\n<\/li><li>\n返回排序结果与匹配对应。\n<p>粗检索用全局向量保证召回，精匹配用局部对应保证准确。库规模大时用向量索引（近似最近邻）加速，不做全库暴力比对。<\/p>\n<\/ol>\n<h2>补充展开九：协同分割步骤<\/h2>\n<ol><li>\n一批模型各自计算局部特征；\n<\/li><li>\n模型间建立初步对应（全局粗对齐或局部描述子匹配）；\n<\/li><li>\n联合聚类：同一部件类别在多模型中同时分配；\n<\/li><li>\n部件类别数先验给定或从数据估计；\n<\/li><li>\n输出各模型部件标签与跨模型对应。\n<p>协同分割缓解单模型几何歧义：某模型部件边界不清时，同批其他模型的对应边界提供参照。<\/p>\n<\/ol>\n<h2>补充展开十：非刚性匹配与内蕴描述<\/h2>\n<p>刚体匹配对齐旋转平移；人体弯折、布料变形等非刚性场景，表面内蕴属性（测地距离、曲率分布、局部拓扑）不随弯曲改变。内蕴描述子在曲面度量上统计，不依赖嵌入坐标。局部对应在内蕴空间建立，再映射回嵌入网格。使用边界：严重自交或度量退化区域内蕴量不稳；非刚性描述子计算成本高于刚体描述子。<\/p>\n<h2>补充展开十一：噪声与缺损下的鲁棒性<\/h2>\n<p>局部缺损：缺失区域描述子按剩余邻域估计，邻域半径内样本不足时降权或标记不可靠。噪声：法向与曲率统计前滤波，直方图分箱适度加宽吸收抖动。重采样：网格细分密度变化，描述子用归一化权重抵消三角形数量差。鲁棒性测试人为加噪、删片、重采样，对比描述子相似度变化曲线，选出稳健的参数区间。<\/p>\n<h2>补充展开十二：数据集与评价流程<\/h2>\n<p>标注数据集含模型类别标签、部件标注或对应点对。评价分类用类准确率；检索用召回率、Top-<span class=\"katex-inline\">k<\/span> 命中率；分割用边界重合度；匹配用对应点正确率。训练/测试分开，避免学习描述子记住测试集。手工描述子在同一数据集上作为基线对照，学习方法增益按基线差值衡量。<\/p>\n<h2>补充展开十三：描述子维度与存储<\/h2>\n<p>全局向量维度从十几（形状分布少箱）到数百（高阶矩）；局部描述子每关键点一个向量，关键点数量随模型规模增长。库内存储全局向量表，局部对应按需计算不全部入库。检索距离计算成本随维度与库规模增长；高维向量配合近似最近邻索引。<\/p>\n<h2>补充展开十四：典型应用场景<\/h2>\n<p>模型库检索：按样例找相似零件或角色；部件分割：为蒙皮绑定分区；对应匹配：形变前后或跨模型参数迁移；形状分类：入库自动归类；质量检测：与标准模型比较偏差区域。各场景描述子选择不同：检索偏全局，绑定偏局部分割，迁移偏跨模型对应。<\/p>\n<h2>补充展开十五：直方图与矩系数的数学口径<\/h2>\n<p>形状分布直方图：采样点对 <span class=\"katex-inline\">(p_a,p_b)<\/span>，距离 <span class=\"katex-inline\">r=\\|p_a-p_b\\|<\/span>，落入第 <span class=\"katex-inline\">k<\/span> 箱计数 <span class=\"katex-inline\">n_k<\/span>，概率 <span class=\"katex-inline\">h(k)=n_k/N<\/span>。两模型分布距离可用 <span class=\"katex-inline\">L_2<\/span> 范数 <span class=\"katex-inline\">\\|h_a-h_b\\|_2<\/span> 或 <span class=\"katex-inline\">\\chi^2<\/span>：<span class=\"katex-inline\">\\sum_k(h_a(k)-h_b(k))^2/(h_a(k)+h_b(k))<\/span>。<\/p>\n<p>Zernike 矩：球面正交基 <span class=\"katex-inline\">Z_{lm}(\\theta,\\phi)<\/span>，形状函数 <span class=\"katex-inline\">f<\/span> 的系数 <span class=\"katex-inline\">M_{lm}=\\int f Z_{lm}\\,d\\Omega<\/span>；旋转下基按角向阶 <span class=\"katex-inline\">m<\/span> 变换，取模 <span class=\"katex-inline\">\\|M_{lm}\\|<\/span> 得到旋转不变量。阶数 <span class=\"katex-inline\">l<\/span> 越高刻画越细细节，截断阶数决定向量维度与高频细节取舍。<\/p>\n<p>ESG：面片法向 <span class=\"katex-inline\">\\mathbf n_f<\/span> 投到单位球，球面分箱计数；凸曲面法向集中在若干方向，平面法向聚成一点，边缘法向环绕分布。法向定向一致是 ESG 有效的前提，反向法向会投到对趾箱。<\/p>\n<h2>补充展开十六：分割方法的几何依据<\/h2>\n<p>几何相似性依据三类量：法向夹角（相邻面片朝向差）、曲率差（弯曲程度差）、位置距离（邻域远近）。区域生长从种子面片出发，把特征差小于阈值的邻接面片并入；阈值过大并片，过小过碎。谱分割利用邻接图拉普拉斯：图权 <span class=\"katex-inline\">w_{ij}<\/span> 为面片相似度，拉普拉斯特征向量嵌入后 <span class=\"katex-inline\">k<\/span> 维聚类。图割能量 <span class=\"katex-inline\">E=\\sum_j D(j,S_{l(j)})+\\sum_{(i,j)}V(i,j)<\/span>，数据项惩罚归属差异，边界项惩罚跨分割边相似度；最小割解归属。自动分割定类别数，交互分割由种子指定，协同分割跨模型对齐类别。<\/p>\n<h2>补充展开十七：失败现象诊断表<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>现象<\/th><th>诊断方向<\/th><th>处置<\/th><\/tr><\/thead><tbody><tr><td>同类模型检索排名靠后<\/td><td>姿态未对齐或描述子非不变<\/td><td>质心对齐、换不变基<\/td><\/tr><tr><td>局部对应错误率高<\/td><td>邻域半径失当或法向噪声<\/td><td>调半径、先光顺<\/td><\/tr><tr><td>分割片过碎<\/td><td>相似度阈值过小<\/td><td>放宽阈值、合并小片<\/td><\/tr><tr><td>多部件并片<\/td><td>阈值过大或缺语义先验<\/td><td>交互种子、协同分割<\/td><\/tr><tr><td>新类别不可比<\/td><td>学习描述子训练集未覆盖<\/td><td>回退手工描述子<\/td><\/tr><tr><td>缺损区描述子失真<\/td><td>邻域样本不足<\/td><td>降权标记、补采样<\/td><\/tr><\/tbody><\/table><\/div>\n<p>诊断顺序：先查输入网格质量与定向，再查采样口径与参数，末段查描述子类型是否匹配任务。<\/p>\n<h2>补充展开十八：在全书管线中的衔接路径<\/h2>\n<p>上游：c03 配准对齐多片点云；c04 重建输出网格；c05 光顺稳定法向与曲率；c02 提供曲率法向特征；c01 邻接图支撑面片聚类与局部邻域。中游：本章描述子、分割、匹配把网格转成向量与部件结构。下游：c07 简化可在分割区域内分级保留细节；c08 形变按分割部件划分骨骼绑定区域；检索结果回供给模型库与复用；第 8 章学习方法以本章手工特征为基线与对照。管线闭环：扫描输入 → 重建 → 光顺 → 分析 → 编辑/复用。<\/p>\n<h2>补充展开十九：描述子选择决策口径<\/h2>\n<p>先定任务：分类与库检索选全局描述子，部件绑定选局部分割，跨模型迁移选局部匹配加整体验证。再看输入：网格噪声大先光顺；非刚性变形选内蕴描述；姿态未知选不变统计量。末了看资源：库规模大选低维全局向量加近似索引；局部匹配只在候选上计算。没有单一描述子覆盖所有任务，实际系统常组合两层：全局粗筛、局部精配、分割分区。<\/p>\n<h2>补充展开二十：形状分析与重建管线的输入输出<\/h2>\n<p>输入：光顺后网格、法向与曲率统计、可选标注类别；输出：全局/局部描述子向量、部件分割标签、模型间对应与检索排序。描述子计算不改变网格几何；分割标签挂在面片索引上；对应关系存顶点对列表。下游编辑与检索按索引取回结果，不重复计算描述子。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n列举四类全局描述子及其统计量来源。\n<\/li><li>\n描述子构造的预处理与归一化各消除什么影响？\n<\/li><li>\n分割聚类的归类与种子更新怎样交替？\n<\/li><li>\n直方图交距离怎样计算？什么形式的描述子适用？\n<\/li><li>\n局部描述子邻域半径过大与过小各有什么问题？\n<\/li><li>\n非刚性形变模型为什么刚体描述子会失配？\n<\/ol>\n<h2>补充展开一：描述子评价指标的量化口径<\/h2>\n<p>可区分性用类内距离与类间距离比值衡量：类内距离小、类间距离大则描述子好。鲁棒性用加噪、缺损、重采样前后描述子相似度变化衡量。可重复性用同一区域不同采样下描述子最近邻匹配率衡量。检索质量用召回率（同类被检出比例）与准确率（检出中同类比例）评估。指标在标注数据集上统计，不能只看单个样例视觉效果。<\/p>\n<h2>补充展开二：常见全局描述子口径对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>描述子<\/th><th>统计对象<\/th><th>不变性<\/th><th>短板<\/th><\/tr><\/thead><tbody><tr><td>ESG<\/td><td>法向方向球分布<\/td><td>旋转（球口径）<\/td><td>对称形状区分弱<\/td><\/tr><tr><td>形状分布<\/td><td>点对距离直方图<\/td><td>平移旋转尺度<\/td><td>丢失空间布局<\/td><\/tr><tr><td>光场描述子<\/td><td>多视角投影<\/td><td>视角覆盖依赖<\/td><td>计算视角采样<\/td><\/tr><tr><td>Zernike 矩<\/td><td>球面正交基系数<\/td><td>旋转不变<\/td><td>阶数截断丢细节<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>补充展开三：局部匹配的验证流程<\/h2>\n<ol><li>\n局部描述子最近邻初匹配；\n<\/li><li>\n剔除距离超阈值对应；\n<\/li><li>\n用对应点估计刚体或非刚性变换；\n<\/li><li>\n检查内点比例，不一致对应剔除；\n<\/li><li>\n一致对应集作为最终匹配。\n<p>单靠描述子最近邻会有错误对应，几何一致性验证是必要环节。<\/p>\n<\/ol>\n<h2>补充展开四：谱分割与图割口径<\/h2>\n<p>网格邻接图顶点为面片，边权为邻接面片特征相似度。谱方法把图拉普拉斯特征向量嵌入低维空间，在嵌入空间聚类。图割把归属写成能量：区域项惩罚面片与种子差异，边界项惩罚跨分割边的特征差；最小割得到分割边界。两种方法都把几何相似性转成图上优化问题。<\/p>\n<h2>补充展开五：衔接速查与易错口径<\/h2>\n<ul><li>\n衔接：c02 曲率法向进描述子；c01 邻接图支撑分割；c06 参数化对应辅助局部匹配；c05 光顺稳定统计输入。\n<\/li><li>\n易错：把全局描述子当局部对应工具——它没有逐点定位能力。\n<\/li><li>\n易错：把几何分割结果当语义标注——部件名需要先验。\n<\/li><li>\n易错：忽略描述子归一化——点数量与尺度不同时距离比较失真。\n<\/ul>\n<h2>补充展开六：数据驱动几何处理的位置<\/h2>\n<p>第 8 章压缩感知与稀疏学习支撑网格去噪、稀疏正则匹配、字典学习蒙皮；深度学习从低级特征到流形上三维学习、端到端生成模型。形状分析描述子是学习特征的手工基线：学习描述子在标注数据上替代手工统计，但评价口径（不变性、区分度、鲁棒性）与手工描述子一致。<\/p><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：数学基础：网格表示、流形条件与离散微分算子<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化）<\/a><br>检查点：能画出半边结构的指针关系，判断一条边邻接面片数是否满足流形条件，写出余切权离散 Laplace 算子与平均曲率法向表达式<\/li><li class='path-step' id='path-02'><strong>步骤 02：点云管线：配准、显式/隐式重建与曲面光顺<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：点云曲面重建和光顺（配准、显式与隐式重建、曲面光顺）<\/a><br>检查点：能复述 ICP 的最近点对应与刚体变换交替步骤，说明 Voronoi/Delaunay 滤波重建与 Poisson 指示函数重建各自约束了什么，比较基于顶点与基于法向的两类光顺能量<\/li><li class='path-step' id='path-03'><strong>步骤 03：网格处理：参数化、QEM 简化与多分辨率表示<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：网格曲面的参数化和多分辨率表示（参数化、简化、压缩与渐进网格）<\/a><br>检查点：能写出参数化优化模型的形变能量与位置约束，解释 Jacobian 非退化与无翻转条件，按 QEM 定义一条边折叠的二次误差并描述优先队列简化流程<\/li><li class='path-step' id='path-04'><strong>步骤 04：分析与形变：形状描述、网格形变能量与几何处理应用<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4–9 章：重网格化、形状分析、网格形变、弹性模拟与机器学习几何处理<\/a><br>检查点：能区分全局与局部形状描述子，写出梯度域 Poisson 重建方程与 ARAP 式保刚性能量的局部旋转项，说明骨架约束在形变中的作用<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='流形网格（manifold mesh）'>流形网格（manifold mesh） — 拓扑上同胚于二维圆盘（内部点）或半圆碟（边界点）的网格；网格表现为每条边最多邻接两个面片，每个顶点的邻接面片构成闭合或开放的单一扇面 <span class=glossary-ref>（第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化））<\/span><\/li><li data-term='半边数据结构（half-edge data structure）'>半边数据结构（half-edge data structure） — 把每条无向边拆成两条方向相反的半边；每条半边记录起点指针、邻接面指针、同面下一条边指针、对偶半边指针，顶点与面片各挂一条代表半边，用于逆时针遍历邻域 <span class=glossary-ref>（第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化））<\/span><\/li><li data-term='1-环邻域（1-ring neighborhood）'>1-环邻域（1-ring neighborhood） — 顶点 $v_i$ 沿半边环绕一圈所到达的邻接顶点集合 $N(i)$ 及其共享三角形，是离散曲率、Laplace 算子与形变能量定义的局部范围 <span class=glossary-ref>（第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化））<\/span><\/li><li data-term='laplace–beltrami 算子'>Laplace–Beltrami 算子 — 平面 Laplace 算子向曲面流形的推广；三角网格上常用余切权离散格式 $\\Delta v_i=\\frac{1}{2A_i}\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(v_j-v_i)$，其中 $\\alpha_{ij},\\beta_{ij}$ 为共享边 $(i,j)$ 两个三角形的对顶角 <span class=glossary-ref>（第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化））<\/span><\/li><li data-term='平均曲率法向（mean curvature normal）'>平均曲率法向（mean curvature normal） — 连续情形为 $2H\\mathbf n$；离散格式由余切权 Laplace 向量给出，方向沿邻接面法向张成的线性空间，其长度对应平均曲率大小 <span class=glossary-ref>（第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化））<\/span><\/li><li data-term='高斯曲率离散算子'>高斯曲率离散算子 — 基于高斯–博内定理：顶点 $v_i$ 处离散高斯曲率 $K_G(v_i)=(2\\pi-\\sum_{f\\in N(i)}\\theta_f)/A_i$，$\\theta_f$ 为面片在该顶点的顶角，$A_i$ 为 Voronoi 或重心元胞面积 <span class=glossary-ref>（第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化））<\/span><\/li><li data-term='voronoi 图与 delaunay 三角剖分'>Voronoi 图与 Delaunay 三角剖分 — 样本点 $p$ 的 Voronoi 单元是空间中比其他样本点更接近 $p$ 的点集；其对偶图连接相邻单元样本点即 Delaunay 三角剖分，外接圆内不含其他样本点且满足最小角最大化 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺（配准、显式与隐式重建、曲面光顺））<\/span><\/li><li data-term='隐式曲面零水平集'>隐式曲面零水平集 — 把重建曲面表示为三维标量函数 $F(x)$ 取值为 0 的集合 $S=\\{x\\mid F(x)=0\\}$；法向信息约束曲面内外符号，抽取零等值面得到封闭网格 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺（配准、显式与隐式重建、曲面光顺））<\/span><\/li><li data-term='poisson 重建'>Poisson 重建 — 寻找指示函数 $\\chi$ 使其梯度最佳逼近点云法向量场；由散度算子等价为求解 $\\Delta\\chi=\\nabla\\cdot\\mathbf w$，再抽取零等值面得到封闭曲面 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺（配准、显式与隐式重建、曲面光顺））<\/span><\/li><li data-term='参数化扭曲度量'>参数化扭曲度量 — 衡量三维网格到参数域映射局部形变程度的能量密度，可基于 Dirichlet 能量、共形能量、伸缩能量或 Green–Lagrange 能量；配合位置约束最小化整体扭曲 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示（参数化、简化、压缩与渐进网格））<\/span><\/li><li data-term='二次误差度量（qem）'>二次误差度量（QEM） — 边折叠后顶点到折叠前两顶点邻接所有三角形平面距离平方和；写成齐次坐标下二次型 $v^TQv$，QEM 越小该边折叠引起的几何误差越小，用于排优先队列 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示（参数化、简化、压缩与渐进网格））<\/span><\/li><li data-term='渐进网格（progressive mesh）'>渐进网格（Progressive Mesh） — 连续多分辨率表示：记录每一步边折叠操作（顶点编号与合并后坐标）及其逆操作顶点分裂；从最简网格出发逐步分裂即可恢复原网格，相邻层差量编码为局部操作 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示（参数化、简化、压缩与渐进网格））<\/span><\/li><li data-term='保刚性能量（arap 式）'>保刚性能量（ARAP 式） — 对每个局部邻域估计旋转 $R_i$，惩罚边向量经局部旋转后与变形后边向量的偏差 $\\sum w_{ij}\\|R_i(v_i-v_j)-(v&#x27;_i-v&#x27;_j)\\|^2$，在局部标架内保持细节形状 <span class=glossary-ref>（第 4–9 章：重网格化、形状分析、网格形变、弹性模拟与机器学习几何处理）<\/span><\/li><li data-term='形状描述子（shape descriptor）'>形状描述子（shape descriptor） — 把三维模型或局部区域映射为描述子空间向量的特征表达；全局描述子用于分类检索，局部描述子用于对应、配准与分割，好的描述子应具备可区分性、鲁棒性与不变性 <span class=glossary-ref>（第 4–9 章：重网格化、形状分析、网格形变、弹性模拟与机器学习几何处理）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>思维模式库：离散几何处理<\/h1>\n<h2>模式 1：连续对象 → 离散邻域平均<\/h2>\n<p>连续微分几何定义在极限点上，网格只存有限采样。先把连续量改成 1-环邻域上的空间平均：面积分借高斯定理落到边权，点导数换成邻接顶点加权差。检查口径：邻域是否拓扑圆盘、元胞面积是否归一化、采样加密时平均是否收敛到连续值。<\/p>\n<ul><li>\n触发：离散曲率、Laplace 算子、法向估计。\n<\/li><li>\n关键：连续参照 → 分片逼近假设 → 邻域元胞 → 边界积分 → 离散求和。\n<\/ul>\n<h2>模式 2：结构先行于算子<\/h2>\n<p>任何几何算子先问邻接关系存得下来存不下来：边邻接数、顶点扇面是否单一、半边能否唯一配对。结构不合格时先修复拓扑，再谈曲率、参数化、简化；拓扑问题用位置滤波修不好。<\/p>\n<ul><li>\n触发：拿到重建网格准备计算前。\n<\/li><li>\n关键：流形判据 → 半边配对 → 1-环遍历 → 算子输入。\n<\/ul>\n<h2>模式 3：能量驱动 + 约束边界条件<\/h2>\n<p>几何处理问题写成&quot;数据贴合项 + 正则/刚性项 + 位置约束&quot;的目标函数：贴合项对齐观测或交互目标，正则项控制平滑或刚性，约束项钉住边界顶点。二次能量解线性系统，非二次能量拆成局部估计与整体更新交替。<\/p>\n<ul><li>\n触发：参数化、光顺、形变、配准。\n<\/li><li>\n关键：变量分离（固定一类优化另一类）；约束进右端或罚项；权重按区域分级。\n<\/ul>\n<h2>模式 4：贪心队列 + 局部误差代理<\/h2>\n<p>简化不追求全局最优，按局部误差度量排队，每步选当前误差最小的可执行操作，执行后只更新 1-环邻域的误差值。代理度量（QEM 平面距离）不等于最终表面距离，事后要用 Hausdorff 或平均表面距离复核。<\/p>\n<ul><li>\n触发：边折叠简化、渐进网格构造。\n<\/li><li>\n关键：局部二次型可累加；拓扑校验先于执行；队列条目带版本号防懒删除失效。\n<\/ul>\n<h2>模式 5：显式路线 vs 隐式路线分工<\/h2>\n<p>输入稠密低噪声选显式：Delaunay 对偶 + 极点/锥体滤波直接出面片；有噪有缺失选隐式：标量场零水平集，法向定内外符号。路线选择先看采样密度、噪声水平与法向可估计性，不按习惯硬套。<\/p>\n<ul><li>\n触发：点云重建方案选型。\n<\/li><li>\n关键：显式靠几何结构判断表面；隐式靠场拟合补封闭；两类输出都要过拓扑与法向检查。\n<\/ul>\n<h2>模式 6：不变量先于距离比较<\/h2>\n<p>描述子、配准对应先消去刚体变换影响：平移用质心对齐，旋转用不变基或方向球，尺度用归一化；之后才在特征空间算距离。不消除姿态直接比坐标，同类形状距离被姿态差淹没。<\/p>\n<ul><li>\n触发：检索匹配、跨模型对应、配准初值核对。\n<\/li><li>\n关键：不变性口径 → 归一化 → 特征统计 → 距离度量。\n<\/ul>\n<h2>模式 7：反事实剥离条件查边界<\/h2>\n<p>每个格式先列前提：流形、非退化、定向一致、采样密度、初值接近。逐条去掉前提，推演断在哪一步：边权失正、面积分母趋零、对应错配、邻域分裂。失败案例先核对前提是否满足，再调参数。<\/p>\n<ul><li>\n触发：结果发散、局部失真、收敛到坏解。\n<\/li><li>\n关键：前提清单 → 剥离反例 → 失效步骤定位 → 修复路线（修网格/修定向/补采样/换模型）。\n<\/ul>\n<h2>模式 8：局部到整体交替优化<\/h2>\n<p>非二次、耦合问题（ARAP、非刚性配准）拆两步：局部估计（旋转/仿射）闭式解，整体位置二次系统；交替迭代到能量下降趋平。初值取线性解，避免非凸局部最小；每步固定一类变量，保证子问题可解。<\/p>\n<ul><li>\n触发：保刚性形变、非刚性配准、ARAP 参数化。\n<\/li><li>\n关键：局部极分解 → 全局二次解 → 单调不增 → 初值与收敛阈值。\n<\/ul>\n<h2>模式 9：管线顺序不可逆<\/h2>\n<p>扫描 → 配准 → 重建 → 光顺 → 参数化/简化/形变 → 分析复用。上游缺陷向下游放大：噪声尖刺被简化保护、被形变保留、被描述子统计污染。每道工序输出记录参照网格与改动量，便于回溯哪一步引入偏差。<\/p>\n<ul><li>\n触发：定位网格质量问题、安排处理流程。\n<\/li><li>\n关键：工序依赖 → 上游修复优先 → 分层记录 → 事后复核指标。\n<\/ul>", "__cheatsheet__": "<h1>速查表：离散几何处理与应用<\/h1>\n<h2>1. 网格表示与流形判据<\/h2>\n<ul><li>\n网格 <span class=\"katex-inline\">G=(V,E,F)<\/span>：顶点、边、面片三层集合；三角网格每个面片三顶点。\n<\/li><li>\n流形条件：每条边至多邻接两个面片；每个顶点邻接面片构成单一闭合/开放扇面。\n<\/li><li>\n半边四指针：<code>origin<\/code>（起点）、<code>face<\/code>（邻接面）、<code>next<\/code>（同面下一条）、<code>flip<\/code>（对偶半边）。\n<\/li><li>\n遍历：面遍历沿 <code>next<\/code> 回起点；顶点邻域遍历交替 <code>flip<\/code> → <code>next<\/code>。\n<\/li><li>\n计数：封闭三角网格 <span class=\"katex-inline\">3F=2E<\/span>，<span class=\"katex-inline\">V-E+F=2<\/span>；开放圆盘 <span class=\"katex-inline\">V-E+F=1<\/span>。\n<\/ul>\n<h2>2. 离散曲率算子<\/h2>\n<ul><li>\n余切权 Laplace–Beltrami：\n<\/ul>\n<div class=\"katex-block\">\\int_{\\Omega_i}\\Delta z\\,dA=\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(z_j-z_i)<\/div>\n<ul><li>\n平均曲率法向：\n<\/ul>\n<div class=\"katex-block\">H(v_i)\\mathbf n_i=-\\frac{1}{2A_i}\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(v_j-v_i)<\/div>\n<ul><li>\n离散高斯曲率：<span class=\"katex-inline\">K_G(v_i)=(2\\pi-\\sum_{f\\in N(i)}\\theta_f)/A_i<\/span>。\n<\/li><li>\n主曲率反解：<span class=\"katex-inline\">k_{1,2}=H\\pm\\sqrt{H^2-K}<\/span>；判别式 <span class=\"katex-inline\">H^2-K<\/span> 为负说明离散估值不自洽。\n<\/li><li>\n收敛前提：分片逼近、三角形非退化、采样加密、邻域拓扑圆盘。\n<\/ul>\n<h2>3. 点云配准<\/h2>\n<ul><li>\n刚性配准能量：<span class=\"katex-inline\">E(R,t)=\\sum_i\\|y_i-(Rx_i+t)\\|^2<\/span>。\n<\/li><li>\n闭式解：去质心 <span class=\"katex-inline\">\\bar x,\\bar y<\/span>；协方差 <span class=\"katex-inline\">H=\\sum(x_i-\\bar x)(y_i-\\bar y)^\\top<\/span>；SVD <span class=\"katex-inline\">H=U\\Sigma V^\\top<\/span>，<span class=\"katex-inline\">R=VU^\\top<\/span>，反射行列式校正；<span class=\"katex-inline\">t=\\bar y-R\\bar x<\/span>。\n<\/li><li>\nICP 循环：最近点对应 → 刚体闭式解 → 更新点云 → 收敛判断；误差单调不增，依赖初值。\n<\/li><li>\n粗配准：RANSAC 最大内点一致性集；4PCS 用长度、夹角、交点比例不变量筛点对。\n<\/li><li>\nCPD：GMM 后验软对应，E 步后验权重，M 步更新位置参数。\n<\/ul>\n<h2>4. 曲面重建<\/h2>\n<ul><li>\nVoronoi 单元：<span class=\"katex-inline\">V(p)=\\{x\\mid d(x,p)\\le d(x,q),\\forall q\\}<\/span>；Delaunay 对偶空圆性质。\n<\/li><li>\nCrust：取极点 → <span class=\"katex-inline\">P\\cup P&#x27;<\/span> 做 Delaunay → 保留三顶点全属 <span class=\"katex-inline\">P<\/span> 的三角形。\n<\/li><li>\n隐式曲面：<span class=\"katex-inline\">S=\\{x\\mid F(x)=0\\}<\/span>；法向约束内外符号。\n<\/li><li>\nPoisson 链：<span class=\"katex-inline\">\\min\\|\\nabla\\chi-\\mathbf w\\|^2\\Rightarrow\\Delta\\chi=\\nabla\\cdot\\mathbf w<\/span>；<span class=\"katex-inline\">\\mathbf w\\approx\\sum |M_{p_i}|\\phi(x-p_i)\\mathbf m_i<\/span>；八叉树离散后抽零等值面。\n<\/li><li>\n路线对照：SDF 投影距离（怕法向噪声）、RBF 基函数组合（矩阵稠密）、Poisson 指示函数（需定向法向）、MPU 局部二次混合。\n<\/ul>\n<h2>5. 曲面光顺<\/h2>\n<ul><li>\nLaplacian 显式更新：<span class=\"katex-inline\">v_i^{\\text{new}}=v_i+\\lambda(c_i-v_i)<\/span>，<span class=\"katex-inline\">c_i<\/span> 为邻点质心。\n<\/li><li>\n曲率流：<span class=\"katex-inline\">v_i^{\\text{new}}=v_i+h\\,H(v_i)\\mathbf n_i<\/span>。\n<\/li><li>\n距离误差：顶点到邻接滤波平面距离平方和，线性二次型。\n<\/li><li>\n梯度误差：新三角形法向对齐滤波法向，非线性，迭代线性化。\n<\/li><li>\n风险：体积收缩、棱边倒圆、法向未定向平均成零向量、孔洞边界被拉进内部。\n<\/ul>\n<h2>6. 网格参数化<\/h2>\n<ul><li>\n目标：<span class=\"katex-inline\">E_{\\text{param}}=\\sum_t e(\\phi_t)S(t)+\\sum_i\\omega_i\\|u_i-\\bar u_i\\|^2<\/span>。\n<\/li><li>\nJacobian 奇异值 <span class=\"katex-inline\">\\sigma_1,\\sigma_2<\/span>：拉伸比 <span class=\"katex-inline\">\\sigma_1/\\sigma_2<\/span>，面积缩放 <span class=\"katex-inline\">|\\det J|<\/span>。\n<\/li><li>\n能量族：Dirichlet <span class=\"katex-inline\">\\sigma_1^2+\\sigma_2^2<\/span>；共形 <span class=\"katex-inline\">(\\sigma_1-\\sigma_2)^2<\/span>；伸缩分方向；Green–Lagrange <span class=\"katex-inline\">J^\\top J-I<\/span>；ARAP 局部旋转。\n<\/li><li>\n可行性：<span class=\"katex-inline\">\\det J\\neq0<\/span> 单射，<span class=\"katex-inline\">\\det J&gt;0<\/span> 无翻转；闭合曲面先分割成圆盘片。\n<\/ul>\n<h2>7. QEM 简化<\/h2>\n<ul><li>\n平面 <span class=\"katex-inline\">\\mathbf q=(a,b,c,d)<\/span> 归一化；<span class=\"katex-inline\">Q_l=\\mathbf q^\\top\\mathbf q<\/span>（4×4 对称阵）。\n<\/li><li>\n折叠误差：<span class=\"katex-inline\">Q(p)=\\hat p^\\top(Q_a+Q_b)\\hat p<\/span>。\n<\/li><li>\n驻点：<span class=\"katex-inline\">\\mathbf A p=-\\mathbf b<\/span>（分块 <span class=\"katex-inline\">Q=\\begin{pmatrix}\\mathbf A&amp;\\mathbf b\\\\\\mathbf b^\\top&amp;c\\end{pmatrix}<\/span>）；<span class=\"katex-inline\">\\mathbf A<\/span> 奇异回退端点/中点。\n<\/li><li>\n队列：初始化 QEM 入队 → 弹最小边 → 拓扑校验 → 折叠更新 1-环 → 重排队列。\n<\/li><li>\n渐进网格：记录 <span class=\"katex-inline\">ecol<\/span>（<span class=\"katex-inline\">s,t,v_e<\/span>）；逆操作 <span class=\"katex-inline\">vsplit<\/span> 逐层分裂恢复。\n<\/ul>\n<h2>8. 网格形变<\/h2>\n<ul><li>\nPoisson 形变：<span class=\"katex-inline\">\\mathrm{Div}(\\nabla u)=\\mathrm{Div}(\\mathbf w)<\/span>，三坐标分量分别解，约束顶点为边界值。\n<\/li><li>\nARAP 能量：\n<\/ul>\n<div class=\"katex-block\">E_{\\text{arap}}=\\sum_i\\sum_{j\\in N(i)}w_{ij}\\|R_i(v_i-v_j)-(v'_i-v'_j)\\|^2<\/div>\n<ul><li>\n旋转估计：协方差 <span class=\"katex-inline\">H_i=\\sum w_{ij}(v_i-v_j)(v&#x27;_i-v&#x27;_j)^\\top<\/span>，SVD 极分解，反射行列式校正。\n<\/li><li>\n交替：固定位置估 <span class=\"katex-inline\">R_i<\/span> → 固定 <span class=\"katex-inline\">R_i<\/span> 解位置二次系统 → 迭代收敛。\n<\/li><li>\n骨架：采样点 <span class=\"katex-inline\">s_k=\\sum\\alpha_{kl}v_l<\/span>；共线与定长约束。\n<\/ul>\n<h2>9. 形状分析<\/h2>\n<ul><li>\n全局描述子：ESG 法向球分布、形状分布点对距离直方图、光场投影、Zernike 矩系数。\n<\/li><li>\n局部描述子：邻域窗口内法向/曲率/距离方向统计，用于对应与分割。\n<\/li><li>\n不变性：平移质心对齐，旋转不变基或方向球，尺度归一化。\n<\/li><li>\n分割：种子归类 <span class=\"katex-inline\">\\|f_j-s_i\\|<\/span> 最小 → 更新种子 → 边界优化；谱嵌入/图割。\n<\/li><li>\n检索：全局向量距离粗筛，局部描述子精匹配 + 一致性验证。\n<\/ul>\n<h2>10. 高频反事实速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>去掉的条件<\/th><th>后果<\/th><\/tr><\/thead><tbody><tr><td>流形假设<\/td><td>flip 配对断裂，曲率连续对应失效<\/td><\/tr><tr><td>余切权改均匀权<\/td><td>细长三角形方向拉偏，不保证收敛<\/td><\/tr><tr><td>法向全局定向<\/td><td>隐式内外颠倒，等值面翻面<\/td><\/tr><tr><td>无翻转约束<\/td><td>参数域三角形翻面重叠，纹理镜像<\/td><\/tr><tr><td>拓扑校验<\/td><td>折叠产生孤立边/非流形邻接<\/td><\/tr><tr><td>局部旋转更新<\/td><td>大弯折处细节拉伸塌陷<\/td><\/tr><tr><td>描述子旋转不变性<\/td><td>同模型转姿态后匹配失配<\/td><\/tr><\/tbody><\/table><\/div>"}};

/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}

function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）

function updateProgress(){

  const pct = chs? Math.round(done/chs*100) : 0;

function updatePath(){
  const steps = manifest.learningPath||[];
  const passed = steps.filter(s=>(s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))).length;
  const lbl = document.getElementById('path-progress-label');
  if(lbl) lbl.textContent = `${passed}/${steps.length} 步`;
  $$('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);

      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  if(typeof vis !== 'undefined'){ networkLoaded = true; cb(); return; }
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE) { cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库未加载：离线构建请加 <code>--offline all</code>，或联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIndex = null;
let pendingHl = [];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP = new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                        '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                        '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw = q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out = [];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length > 2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low = text.toLowerCase();
  let pos = -1, hit = '';
  for(const t of terms){ const i = low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start = Math.max(0, (pos<0?0:pos) - 60);
  const end = Math.min(text.length, (pos<0?0:pos) + 140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms = pendingHl.slice(); pendingHl = [];
  if(!terms.length) return;
  const root = $('#view'); if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first = null, idx = -1, term = '';
  while((node = walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low = node.nodeValue.toLowerCase();
    for(const t of terms){
      const i = low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){
        first = node; idx = i; term = t;
      }
    }
  }
  if(!first) return;
  try{
    const i = first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range = document.createRange();
    range.setStart(first, i); range.setEnd(first, i+term.length);
    const mark = document.createElement('mark');
    mark.className = 'hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'), 1800);
  }catch(e){}
}
document.addEventListener('click', (e)=>{
  const a = (e.target && e.target.closest) ? e.target.closest('.search-hit a') : null;
  if(a && a.dataset.hl) pendingHl = tokenizeQuery(a.dataset.hl);

function synOf(t){

  for(const g of SYN_GROUPS){ if(g.indexOf(t) >= 0){ for(const x of g){ if(x !== t) out.push(x); } } }

  if(!v){ showPage(routeIdFromHash()); return; }
  const terms = tokenizeQuery(v);
  if(!terms.length){ showPage(routeIdFromHash()); return; }
  const grams = [];
  terms.forEach(t=>{ if(t.length >= 2){ for(let i=0;i+2<=t.length;i++) grams.push(t.slice(i,i+2)); } });
  const qGrams = [...new Set(grams)].slice(0,16);
  const snippetTerms = terms.concat(...terms.map(synOf)).slice(0,24);
  const hits = [];
  buildSearchIndex().forEach(p=>{
    const low = p.text.toLowerCase();
    let tHit = 0, sHit = 0, gHit = 0, first = '', viaSyn = '';
    for(const t of terms){
      if(low.includes(t)){ tHit++; if(!first) first = t; continue; }
      for(const s of synOf(t)){
        if(low.includes(s)){ sHit++; if(!viaSyn) viaSyn = s; if(!first) first = s; break; }
      }
    }
    for(const gm of qGrams){ if(low.includes(gm)) gHit++; }
    if(tHit > 0 || sHit > 0 || gHit >= 4){
      hits.push({p, score: tHit*100 + sHit*30 + Math.min(gHit,20), first, viaSyn});
    }
  });
  hits.sort((a,b)=> b.score-a.score || a.p.text.length-b.p.text.length);
  const top = hits.slice(0,20);
  let body;
  if(top.length){
    const gs = {};
    top.forEach(h=>{
      const k = h.p.chap.key;
      (gs[k] = gs[k] || {label:h.p.chap.label, order:h.p.chap.order, ref:!!h.p.chap.ref, hits:[]}).hits.push(h);
    });
    const eff = g => Math.max(...g.hits.map(x=>x.score)) * (g.ref ? 0.55 : 1);
    const order = Object.values(gs).sort((a,b)=> eff(b)-eff(a));
    body = order.map(g=>{
      const inner = g.hits.sort((a,b)=> b.score-a.score).map(h=>
        `<div class="search-hit"><a href="${h.p.href}" data-hl="${esc(h.first)}">${esc(h.p.label)}</a>${h.viaSyn?`<span class="syn-note">同义命中：${esc(h.viaSyn)}</span>`:''}<br><span class="sub">${hlSnippet(h.p.text, snippetTerms)}</span></div>`).join('');
      return `<div class="search-group"><div class="grp-head">${esc(g.label)}<span class="grp-count">${g.hits.length}</span></div>${inner}</div>`;
    }).join('');
  } else {
    body = '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语，或减少关键词。</div>';
  }
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' + body;
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof mermaid === 'undefined') return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  if(typeof mermaid !== 'undefined'){ boot(); return; }
  const urls=['https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js',
              'https://registry.npmmirror.com/mermaid/10.9.1/files/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js'];
  let ui=0, done=false;
  const tryNext=()=>{
    if(done || ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    const timer=setTimeout(()=>{ if(done) return; s.onload=null; s.onerror=null; s.remove(); tryNext(); }, 4000);
    s.onload=()=>{ done=true; clearTimeout(timer); boot(); };
    s.onerror=()=>{ clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

/* ---------- 句级出处：点击角标弹出原句 ---------- */
let citePop = null;
function closeCite(){ if(citePop){ citePop.remove(); citePop = null; } }
function showCite(id){
  const c = (typeof SOURCES !== 'undefined') ? SOURCES[id] : null;
  if(!c) return;
  closeCite();
  citePop = document.createElement('div');
  citePop.className = 'cite-pop';
  citePop.innerHTML = '<div class="cite-head">出处' + (c.page!=='' && c.page!=null ? (' · p.'+esc(String(c.page))) : '') +
    '<button class="cite-x" aria-label="关闭">×</button></div>' +
    (c.quote ? '<blockquote>'+esc(c.quote)+'</blockquote>' : '') +
    (c.zh ? '<div class="cite-zh">'+esc(c.zh)+'</div>' : '');
  document.body.appendChild(citePop);
  citePop.querySelector('.cite-x').onclick = closeCite;
}
document.addEventListener('click', e=>{
  const t = e.target.closest('.cite');
  if(t){ e.preventDefault(); showCite(t.dataset.cite); return; }
  if(citePop && !e.target.closest('.cite-pop')) closeCite();
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeCite(); });
</script>
<script id="zs-visual-init">
(function(){
  try{
    var B=document.body, H=document.documentElement;
    if(!B.dataset.theme && !H.dataset.theme) B.dataset.theme='dark';
    var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
    var scope=document.querySelectorAll('header, .topbar, .topbar-fixed, #topbar, .sidebar, .tabs, .hdr-right, .card-actions, .card-controls, .section-title, .card .icon, .icon-label');
    for(var i=0;i<scope.length;i++){
      var w=document.createTreeWalker(scope[i],NodeFilter.SHOW_TEXT,null,false), n;
      while(n=w.nextNode()){
        if(EMOJI.test(n.nodeValue)){
          n.nodeValue=n.nodeValue.replace(EMOJI,'').replace(/[ \t]+/g,' ').replace(/^ | $/g,'');
        }
      }
    }
    var btn=document.getElementById('theme-btn')||document.getElementById('theme')||document.getElementById('themeToggle');
    function label(){
      if(!btn) return;
      var light=B.dataset.theme==='light'||H.getAttribute('data-theme')==='light'||B.dataset.theme==='';
      if(btn.textContent.trim()===''||/浅色|深色/.test(btn.textContent)) btn.textContent=light?'深色':'浅色';
    }
    label();
    if(btn){
      new MutationObserver(label).observe(B,{attributes:true,attributeFilter:['data-theme']});
      new MutationObserver(label).observe(H,{attributes:true,attributeFilter:['data-theme']});
      btn.addEventListener('click',function(){setTimeout(label,0);},true);
    }
  }catch(e){}
})();
</script>
