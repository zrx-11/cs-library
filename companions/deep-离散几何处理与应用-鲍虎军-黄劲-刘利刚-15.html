<!DOCTYPE html>

<title>离散几何处理与应用 学习伴侣</title>

<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>

 "difficulty": "高难", "source": {"file": "离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 85}, "prerequisites": ["c02"], "depthFragment": "concepts/c06-depth.md"}, {"id": "c07", "title": "网格简化：二次误差度量（QEM）边折叠与渐进网格多分辨率表示", "file": "concepts/c07.md", "chapterIds": ["ch03"], "difficulty": "进阶", "source": {"file": "离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 103}, "prerequisites": ["c01"], "depthFragment": "concepts/c07-depth.md"}, {"id": "c08", "title": "网格形变：梯度域 Poisson 编辑与保刚性（ARAP 式）局部旋转能量", "file": "concepts/c08.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 203}, "prerequisites": ["c02", "c06"], "depthFragment": "concepts/c08-depth.md"}, {"id": "c09", "title": "三维形状分析：全局与局部形状描述子、模型分割与匹配检索", "file": "concepts/c09.md", "chapterIds": ["ch04"], "difficulty": "基础", "source": {"file": "离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 168}, "prerequisites": ["c02"], "depthFragment": "concepts/c09-depth.md"}], "glossary": [{"term": "流形网格（manifold mesh）", "def": "拓扑上同胚于二维圆盘（内部点）或半圆碟（边界点）的网格；网格表现为每条边最多邻接两个面片，每个顶点的邻接面片构成闭合或开放的单一扇面", "chapterId": "ch01"}, {"term": "半边数据结构（half-edge data structure）", "def": "把每条无向边拆成两条方向相反的半边；每条半边记录起点指针、邻接面指针、同面下一条边指针、对偶半边指针，顶点与面片各挂一条代表半边，用于逆时针遍历邻域", "chapterId": "ch01"}, {"term": "1-环邻域（1-ring neighborhood）", "def": "顶点 $v_i$ 沿半边环绕一圈所到达的邻接顶点集合 $N(i)$ 及其共享三角形，是离散曲率、Laplace 算子与形变能量定义的局部范围", "chapterId": "ch01"}, {"term": "Laplace–Beltrami 算子", "def": "平面 Laplace 算子向曲面流形的推广；三角网格上常用余切权离散格式 $\\Delta v_i=\\frac{1}{2A_i}\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(v_j-v_i)$，其中 $\\alpha_{ij},\\beta_{ij}$ 为共享边 $(i,j)$ 两个三角形的对顶角", "chapterId": "ch01"}, {"term": "平均曲率法向（mean curvature normal）", "def": "连续情形为 $2H\\mathbf n$；离散格式由余切权 Laplace 向量给出，方向沿邻接面法向张成的线性空间，其长度对应平均曲率大小", "chapterId": "ch01"}, {"term": "高斯曲率离散算子", "def": "基于高斯–博内定理：顶点 $v_i$ 处离散高斯曲率 $K_G(v_i)=(2\\pi-\\sum_{f\\in N(i)}\\theta_f)/A_i$，$\\theta_f$ 为面片在该顶点的顶角，$A_i$ 为 Voronoi 或重心元胞面积", "chapterId": "ch01"}, {"term": "Voronoi 图与 Delaunay 三角剖分", "def": "样本点 $p$ 的 Voronoi 单元是空间中比其他样本点更接近 $p$ 的点集；其对偶图连接相邻单元样本点即 Delaunay 三角剖分，外接圆内不含其他样本点且满足最小角最大化", "chapterId": "ch02"}, {"term": "隐式曲面零水平集", "def": "把重建曲面表示为三维标量函数 $F(x)$ 取值为 0 的集合 $S=\\{x\\mid F(x)=0\\}$；法向信息约束曲面内外符号，抽取零等值面得到封闭网格", "chapterId": "ch02"}, {"term": "Poisson 重建", "def": "寻找指示函数 $\\chi$ 使其梯度最佳逼近点云法向量场；由散度算子等价为求解 $\\Delta\\chi=\\nabla\\cdot\\mathbf w$，再抽取零等值面得到封闭曲面", "chapterId": "ch02"}, {"term": "参数化扭曲度量", "def": "衡量三维网格到参数域映射局部形变程度的能量密度，可基于 Dirichlet 能量、共形能量、伸缩能量或 Green–Lagrange 能量；配合位置约束最小化整体扭曲", "chapterId": "ch03"}, {"term": "二次误差度量（QEM）", "def": "边折叠后顶点到折叠前两顶点邻接所有三角形平面距离平方和；写成齐次坐标下二次型 $v^TQv$，QEM 越小该边折叠引起的几何误差越小，用于排优先队列", "chapterId": "ch03"}, {"term": "渐进网格（Progressive Mesh）", "def": "连续多分辨率表示：记录每一步边折叠操作（顶点编号与合并后坐标）及其逆操作顶点分裂；从最简网格出发逐步分裂即可恢复原网格，相邻层差量编码为局部操作", "chapterId": "ch03"}, {"term": "保刚性能量（ARAP 式）", "def": "对每个局部邻域估计旋转 $R_i$，惩罚边向量经局部旋转后与变形后边向量的偏差 $\\sum w_{ij}\\|R_i(v_i-v_j)-(v'_i-v'_j)\\|^2$，在局部标架内保持细节形状", "chapterId": "ch04"}, {"term": "形状描述子（shape descriptor）", "def": "把三维模型或局部区域映射为描述子空间向量的特征表达；全局描述子用于分类检索，局部描述子用于对应、配准与分割，好的描述子应具备可区分性、鲁棒性与不变性", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [], "flashcards": []}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.13<\/div><h1>第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化）<\/h1>\n<blockquote>对应原书第 1 章 §1.1–1.6（PDF 第 13–42 页；章首两处互核：PDF 13 页为印刷页 1，PDF 42 页为印刷页 30）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出多边形网格的顶点集、边集、面片集三层结构，判断一张网格是否满足流形条件；\n<\/li><li>\n描述半边数据结构的五类指针，并推演从一条半边出发遍历一个面或一个顶点 1-环邻域的过程；\n<\/li><li>\n写出连续曲面上切平面、法向、主曲率、平均曲率与高斯曲率的定义关系；\n<\/li><li>\n从连续 Laplace–Beltrami 算子出发，经高斯定理推出余切权离散格式与平均曲率法向；\n<\/li><li>\n解释 Hausdorff 距离的上下界估计思路，以及无约束/带约束优化中搜索方向与步长的选择依据。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>离散几何处理先把连续几何对象变成有限存储的采样表示：网格、点云、隐式场；再把连续微分几何与优化理论映射到这些离散结构上。本章的两条主线是——表示层（网格怎样组织邻接关系）与算子层（曲率、法向、Laplace 量怎样在 1-环邻域上算出来），后续重建、参数化、简化、形变全部建立在这两层之上。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：多边形网格、流形条件与半边数据结构（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。§1.1.1 把网格记为顶点集合 <span class=\"katex-inline\">V<\/span>、边集合 <span class=\"katex-inline\">E<\/span>、面片集合 <span class=\"katex-inline\">F<\/span>（PDF 第 14 页）：每条边连接两个顶点，每个面片由一组成环的边围成。拓扑上网格分流形与非流形：流形网格中每条边最多邻接两个面片，每个顶点的邻接面片构成闭合或开放的单一扇面（PDF 第 16 页）。半边结构把每条边拆成方向相反的两条半边，用起点、邻接面、同面下一条边、对偶半边等指针记录连接关系，使面遍历与 1-环邻域遍历成为常数邻接时间的操作。<\/p>\n<h3>2. 概念 2：连续曲率到离散曲率（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。§1.3.1 在嵌入 <span class=\"katex-inline\">\\mathbb{R}^3<\/span> 的光滑曲面 <span class=\"katex-inline\">S<\/span> 上定义切平面、法向、法曲率、主曲率 <span class=\"katex-inline\">k_1,k_2<\/span>、平均曲率 <span class=\"katex-inline\">H=(k_1+k_2)/2<\/span> 与高斯曲率 <span class=\"katex-inline\">K=k_1k_2<\/span>（PDF 第 27–28 页）。§1.3.2 假定网格只是光滑曲面的分片逼近，把顶点处几何属性定义为邻近有限面积区域上的空间平均；在 Voronoi 元胞或重心元胞上，由高斯定理把 Laplace–Beltrami 算子的面积分化成 1-环邻域的余切权求和，得到平均曲率法向与离散高斯曲率（PDF 第 29–31 页）。<\/p>\n<h3>3. 概念 3：样条表示、计算几何度量与数值优化（背景）<\/h3>\n<p>§1.2 梳理三次样条、Bézier、B-样条与有理样条（NURBS）：样条以少量控制参数刻画形状，精度高但表达任意拓扑复杂细节受限；网格与点云是与之并列的离散表示。§1.4 给出 Hausdorff 距离 <span class=\"katex-inline\">h(A,B)=\\max_{a\\in A}\\min_{b\\in B}d(a,b)<\/span>，并由子集包含关系给出上下界估计：采样子集算下界，细分收紧上界（PDF 第 33–34 页）。§1.5 把优化写成 <span class=\"katex-inline\">\\min f(x)<\/span> 带等式/不等式约束的形式，线搜索先定方向再定步长，信赖域先定半径再在域内求方向；拉格朗日乘子法处理等式约束，ADMM 交替最小化，MPRGP 处理带边界约束的二次规划（PDF 第 37–41 页）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[连续曲面 S] --&gt; B[离散表示: 网格/点云/隐式场]\n    B --&gt; C[邻接结构: 半边与 1-环邻域]\n    C --&gt; D[离散算子: 余切权 Laplace / 曲率 / 法向]\n    D --&gt; E[几何处理能量: 光顺/参数化/简化/形变]\n    F[连续微分几何] --&gt; D\n    G[数值优化: 线搜索/信赖域/约束求解] --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这条依赖链断在 C 就崩——邻接关系存不下来，后面所有 1-环邻域求和都无法定义；断在 D 则能量函数只剩几何坐标而没有曲率与梯度信息。<\/p>\n<h2>推导一（算法推演）：半边结构上的面遍历与顶点邻域遍历<\/h2>\n<p>推演目标：给定网格半边结构，从一条半边 <span class=\"katex-inline\">h<\/span> 出发，遍历所在面片的全部半边，再遍历起点顶点的 1-环邻域。<\/p>\n<ol><li>\n记 <span class=\"katex-inline\">h<\/span> 的指针：<code>origin(h)<\/code> 为起点，<code>face(h)<\/code> 为邻接面，<code>next(h)<\/code> 为同面下一条半边，<code>flip(h)<\/code> 为对偶半边。\n<\/li><li>\n遍历面片：从 <span class=\"katex-inline\">h_0=h<\/span> 开始，令 <span class=\"katex-inline\">h_{k+1}=\\mathrm{next}(h_k)<\/span>；回到 <span class=\"katex-inline\">h_0<\/span> 时停止。面片顶点依次为 <code>origin(h_0)<\/code>, <code>origin(h_1)<\/code>, …，遍历顺序与面片逆时针方向一致（沿外法向）。\n<\/li><li>\n遍历顶点邻域：令当前半边 <span class=\"katex-inline\">a<\/span> 为从该顶点出发的半边；取对偶 <span class=\"katex-inline\">b=\\mathrm{flip}(a)<\/span>，再取同面下一条 <span class=\"katex-inline\">a&#x27;=\\mathrm{next}(b)<\/span>，<span class=\"katex-inline\">a&#x27;<\/span> 即从该顶点出发的下一条半边。重复 <span class=\"katex-inline\">a\\leftarrow a&#x27;<\/span>，直到回到初始半边。沿途 <code>origin(flip(a))<\/code> 给出邻接顶点，<code>face(a)<\/code> 给出邻接面片。\n<\/li><li>\n复杂度：一个面片有 <span class=\"katex-inline\">k<\/span> 条边，面遍历访问 <span class=\"katex-inline\">k<\/span> 条半边；顶点度数为 <span class=\"katex-inline\">d<\/span>，邻域遍历访问 <span class=\"katex-inline\">d<\/span> 条半边，均与访问元素数成正比，不依赖网格总规模。\n<\/ol>\n<p>推演依据：半边结构把连接关系显式存在边上，<code>next<\/code> 与 <code>flip<\/code> 两个指针组合即可推出上一条半边，因此上一条半边指针在原书结构中标为可选。<\/p>\n<h2>推导二（证明/推导）：从连续 Laplace–Beltrami 到余切权离散格式<\/h2>\n<p>推导目标：在三角网格顶点 <span class=\"katex-inline\">v_i<\/span> 的邻域 <span class=\"katex-inline\">\\Omega_i<\/span> 上，把平均曲率法向算子的面积分离散成邻接顶点的余切权线性组合。<\/p>\n<ol><li>\n连续对应：平均曲率算子即曲面流形上的 Laplace–Beltrami 算子。取共形参数 <span class=\"katex-inline\">(u,v)<\/span>，曲面上的 Laplace 算子为 <span class=\"katex-inline\">\\Delta=\\partial_{uu}+\\partial_{vv}<\/span>；对函数 <span class=\"katex-inline\">z<\/span>，面积分 <span class=\"katex-inline\">\\int_{\\Omega_i}\\Delta z\\,dA<\/span> 可借高斯定理化为边界积分。\n<\/li><li>\n网格上每个三角形定义局部曲面度量；对共享边 <span class=\"katex-inline\">(i,j)<\/span> 的两个三角形，记其对顶角为 <span class=\"katex-inline\">\\alpha_{ij}<\/span>、<span class=\"katex-inline\">\\beta_{ij}<\/span>。高斯定理的边界贡献落到每条边上，边 <span class=\"katex-inline\">(i,j)<\/span> 对顶点 <span class=\"katex-inline\">i<\/span> 的权重为 <span class=\"katex-inline\">\\cot\\alpha_{ij}+\\cot\\beta_{ij}<\/span>。\n<\/li><li>\n逐边合并 1-环邻域 <span class=\"katex-inline\">N(i)<\/span> 的贡献，得到离散求和：\n<\/ol>\n<div class=\"katex-block\">\\int_{\\Omega_i}\\Delta z\\,dA=\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(z_j-z_i)<\/div>\n<ol><li>\n除以邻域面积 <span class=\"katex-inline\">A_i<\/span>，得到平均曲率法向算子的离散格式：\n<\/ol>\n<div class=\"katex-block\">H(v_i)\\mathbf n_i=-\\frac{1}{2A_i}\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(v_j-v_i)<\/div>\n<ol><li>\n收敛前提：网格分片逼近光滑曲面，邻域取 Voronoi 元胞或重心元胞且非退化；随局部采样密度增大，顶点处空间平均收敛到连续定义。\n<\/ol>\n<p>推导依据：高斯定理把面积分换成边界周线积分；余切权重来自三角形边与对顶角的局部几何关系；面积归一化使格式与元胞面积无关地趋近连续曲率。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉流形假设<\/strong>：若一条边邻接三个面片，或一个顶点的邻接面片分成两个互不连通的扇面，半边 <code>flip<\/code> 指针无法唯一配对，面遍历与 1-环邻域遍历会出现环断裂或重复访问。此时余切权格式仍能逐三角形写出，但邻域不是拓扑圆盘，平均曲率与高斯曲率的连续对应失去意义，曲率估计可能在非流形接缝处发散。\n<\/li><li>\n<strong>去掉余切权，改用均匀权重<\/strong>：把 <span class=\"katex-inline\">(\\cot\\alpha_{ij}+\\cot\\beta_{ij})<\/span> 换成常数 <span class=\"katex-inline\">1<\/span>，离散格式退化为邻点算术平均的缩放形式。细长三角形占大角度时，对顶角余切值很小，均匀权会把细长三角形的影响与等边三角形等同对待，曲率法向被斜边方向拉偏；网格细化时该格式不保证收敛到连续 Laplace–Beltrami 算子。\n<\/li><li>\n<strong>去掉邻域非退化假设<\/strong>：若三角形面积趋近零，<span class=\"katex-inline\">A_i<\/span> 趋于零，除以 <span class=\"katex-inline\">A_i<\/span> 的曲率法向放大为无穷大；退化面片需要先做重网格化或剔除，再跑算子。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：半边结构像把一张网的每条棱剪成两段单向车道，车道上挂着&quot;本侧目的地（邻接面）&quot;&quot;下一个路口（next）&quot;&quot;对向车道（flip）&quot;四块路牌；绕面与绕顶点就是沿路牌换乘绕圈。\n<\/li><li>\n实例：一个等边三角形顶点 <span class=\"katex-inline\">i<\/span> 有两个邻接三角形共享边 <span class=\"katex-inline\">(i,j)<\/span>，每个对顶角 <span class=\"katex-inline\">\\alpha_{ij}=\\beta_{ij}=60^\\circ<\/span>，<span class=\"katex-inline\">\\cot60^\\circ=1/\\sqrt{3}<\/span>，边权为 <span class=\"katex-inline\">2/\\sqrt{3}<\/span>；若三角形退化为接近平直，对顶角接近 <span class=\"katex-inline\">180^\\circ<\/span>，<span class=\"katex-inline\">\\cot<\/span> 趋于零，该边权重被压低。\n<\/li><li>\n实例：Hausdorff 距离比较两个网格时，撒点采样只能给出近似；按三角形细分逐步收紧上下界，是在精度与遍历开销之间换取可控误差。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n误解 1：网格里只要有三角形就是流形网格。为什么错：流形是拓扑条件，与面片形状无关；三边共边、顶点扇面分裂等情况形状画得规整，拓扑上仍是非流形。\n<\/li><li>\n误解 2：离散曲率就是顶点邻接点的平均坐标位移。为什么错：邻点平均是几何位置平均；曲率算子带余切权与面积归一化，且平均曲率法向是向量，高斯曲率是角度亏损除以面积，二者不能混为一种量。\n<\/li><li>\n误解 3：样条与网格是两种互相替代的表示，选一个即可。为什么错：原书把样条视作 CAD 主流表示，网格视为图形与数值计算核心表示；同一算法不同环节可能在两种表示间转换，§1.1 并列介绍正是这个原因。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n一条边邻接三个面片时，半边结构的哪条指针无法唯一确定？对曲率计算会产生什么影响？\n<\/li><li>\n写出余切权离散 Laplace 格式中各符号的含义：<span class=\"katex-inline\">N(i)<\/span>、<span class=\"katex-inline\">\\alpha_{ij}<\/span>、<span class=\"katex-inline\">\\beta_{ij}<\/span>、<span class=\"katex-inline\">A_i<\/span>。\n<\/li><li>\n为什么均匀权重的 Laplace 平滑在细长三角形区域会把法向拉偏？从对顶角角度解释。\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n流形网格的两条判据：每条边至多邻接两面，每个顶点邻接面片构成单一扇面。\n<\/li><li>\n余切权格式：<span class=\"katex-inline\">H(v_i)\\mathbf n_i=-\\frac{1}{2A_i}\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(v_j-v_i)<\/span>。\n<\/li><li>\n离散算子的收敛依赖分片逼近、邻域非退化与采样密度增大三条前提。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章是全书地基：表示层交给第 2 章点云重建（把扫描点拼成网格）与第 3 章参数化、简化（在网格邻接结构上做映射与删边）；算子层交给第 2 章光顺（沿曲率法向滤波）、第 3 章参数化能量与第 4 章形变（局部旋转约束建立在 1-环邻域上）。第 1 章末尾的数值优化方法，是后面各类变形能量迭代求解的通用工具箱。<\/p>", "kind": "chapter", "title": "第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化）"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.43<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化）<\/a><\/span><\/div><h1>第 2 章：点云曲面重建和光顺（配准、显式与隐式重建、曲面光顺）<\/h1>\n<blockquote>对应原书第 2 章 §2.1–2.5（PDF 第 43–83 页；章首互核：PDF 43 页为印刷页 31，PDF 83 页为印刷页 71）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n把点云配准问题写成刚性变换 <span class=\"katex-inline\">(R,t)<\/span> 的最小二乘误差优化，说出粗配准与精配准的分工；\n<\/li><li>\n推演 ICP 算法&quot;最近点对应—刚体参数估计—更新源点云&quot;的迭代循环，说明其初值依赖；\n<\/li><li>\n比较显式重建（Voronoi/Delaunay 滤波、Crust、Power Crust、Cocone）与隐式重建（符号距离场、RBF、Poisson、MPU）的构造路线与适用条件；\n<\/li><li>\n写出 Poisson 重建从指示函数梯度逼近法向场到求解 <span class=\"katex-inline\">\\Delta\\chi=\\nabla\\cdot\\mathbf w<\/span> 的推导链；\n<\/li><li>\n区分基于顶点距离误差与基于法向梯度误差两类光顺能量，说明特征保持的取舍。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>扫描得到的点云错位、有噪、有缺失，本章按三条管线处理：先配准把多片点云拼到同一坐标系，再重建出网格——显式路线用 Delaunay 三角剖分滤出表面三角形，隐式路线构造标量场抽零等值面，末段用光顺去掉噪声同时尽量保住形状特征。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：点云配准（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。§2.1.1 刚性配准求解 <span class=\"katex-inline\">(R,t)<\/span>，使源点云 <span class=\"katex-inline\">X<\/span> 变换后与目标点云 <span class=\"katex-inline\">Y<\/span> 误差最小：<span class=\"katex-inline\">\\min_{R,t}\\sum_{i=1}^{N}\\|y_i-(Rx_i+t)\\|^2<\/span>（PDF 第 44–45 页）。流程分粗配准与精配准：粗配准代表方法为 RANSAC 随机采样一致性与 4PCS 四点共面集；精配准代表方法为 ICP 迭代最近点与 CPD 相干点漂移（PDF 第 45、48、50 页）。非刚性配准引入局部仿射变换或拟刚体变形，配准误差与刚性正则项加权组合。<\/p>\n<h3>2. 概念 2：显式与隐式曲面重建（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。§2.2 显式重建从点集的 Voronoi 图与 Delaunay 三角剖分出发展开：Voronoi 单元是空间中距该样本点最近的点集，对偶 Delaunay 剖分外接圆内不含其他样本点（PDF 第 58–59 页）。Crust 取样本点的极点加入点集再做 Delaunay，滤除顶点不全属于原样本点的三角形；Power Crust 用加权 Voronoi（Power 图）逼近中轴；Cocone 用极点估计法向、以双锥体筛选 Voronoi 边对应的对偶三角形（PDF 第 61、63 页）。§2.3 隐式重建把曲面写成标量函数零水平集：符号距离场取到邻近切平面的带符号投影距离，RBF 以径向基函数插值或拟合约束，Poisson 重建用指示函数梯度逼近法向场，MPU 用八叉树单元内局部二次函数加权混合（PDF 第 65–66、69、73 页）。<\/p>\n<h3>3. 概念 3：曲面光顺（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。§2.4 分三类：基于顶点的光顺把顶点向滤波后邻域位置移动；基于法向的光顺先滤波面法向，再让更新后三角形贴近滤波法向（PDF 第 80 页）；数据驱动方法用级联网络回归法向滤波算子。基于法向的两类能量中，距离误差最小化让顶点贴近邻域滤波三角形平面，梯度误差最小化让新三角形法向与滤波法向对齐；后者匹配法向更精确、对剖分更鲁棒，计算量稍大。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[多视角扫描点云] --&gt; B[粗配准: RANSAC / 4PCS]\n    B --&gt; C[精配准: ICP / CPD]\n    C --&gt; D{重建路线}\n    D --&gt; E[显式: Voronoi-Delaunay 滤波]\n    D --&gt; F[隐式: 零水平集 SDF / RBF / Poisson / MPU]\n    E --&gt; G[网格曲面]\n    F --&gt; G\n    G --&gt; H[光顺: 顶点距离误差 / 法向梯度误差]\n    H --&gt; I[高质量网格]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：配准环断裂会让两片点云错位，后续重建把错位缝成错误表面；隐式路线缺了法向定向约束，内外符号反转会抽出错内错外的等值面。<\/p>\n<h2>推导一（算法推演）：ICP 的迭代循环与不变量<\/h2>\n<p>推演目标：给定源点云 <span class=\"katex-inline\">X=\\{x_i\\}<\/span> 与目标点云 <span class=\"katex-inline\">Y<\/span>，初值 <span class=\"katex-inline\">(R_0,t_0)<\/span>，迭代逼近最优刚性变换。<\/p>\n<ol><li>\n对应步骤：对当前变换后的源点云 <span class=\"katex-inline\">X_k=R_kX+t_k<\/span>，在 <span class=\"katex-inline\">Y<\/span> 中为每个 <span class=\"katex-inline\">x_i^{(k)}<\/span> 找最近点 <span class=\"katex-inline\">c_i^{(k)}<\/span>，组成对应点集 <span class=\"katex-inline\">C_k<\/span>。\n<\/li><li>\n参数估计步骤：求解最小二乘刚体变换 <span class=\"katex-inline\">(R_k,t_k)<\/span>，使 <span class=\"katex-inline\">\\sum_i\\|c_i^{(k)}-(R_kx_i+t_k)\\|^2<\/span> 最小；旋转部分由对应点去质心后的协方差矩阵奇异值分解得到，平移部分取质心差。\n<\/li><li>\n更新步骤：把 <span class=\"katex-inline\">R_k,t_k<\/span> 作用于源点云得到 <span class=\"katex-inline\">X_{k+1}<\/span>，记录均方误差 <span class=\"katex-inline\">e_k<\/span>。\n<\/li><li>\n收敛判断：相邻两次迭代误差差小于阈值或变换矩阵变化小于阈值时停止；否则回到步骤 1。\n<\/ol>\n<p>推演依据：每一步固定对应关系时，刚体最小二乘有闭式解；固定刚体时最近点对应唯一确定。ICP 的不变量是旋转保距、平移保距，因此对应点间欧氏距离度量在变换中保持定义。局限：最近点对应在两片点云初始错位较大时容易收敛到局部最小，所以 ICP 常接在粗配准结果之后使用。<\/p>\n<h2>推导二（证明/推导）：Poisson 重建的指示函数方程<\/h2>\n<p>推导目标：从&quot;指示函数梯度逼近点云法向量场&quot;出发，推出可离散求解的 Poisson 系统。<\/p>\n<ol><li>\n设定指示函数 <span class=\"katex-inline\">\\chi<\/span>：曲面内部取值 1，外部取值 <span class=\"katex-inline\">-1<\/span>，曲面为零等值面；采样点处 <span class=\"katex-inline\">\\nabla\\chi<\/span> 近似等于曲面内法向 <span class=\"katex-inline\">\\mathbf m<\/span>，其余位置梯度为零向量。\n<\/li><li>\n逼近目标：最小化 <span class=\"katex-inline\">\\|\\nabla\\chi-\\mathbf w\\|^2<\/span>，其中 <span class=\"katex-inline\">\\mathbf w<\/span> 为点云法向构成的向量场。\n<\/li><li>\n变分展开：对泛函求一阶变分，梯度残差的散度形式给出最优性条件——指示函数梯度场的散度等于目标向量场的散度：\n<\/ol>\n<div class=\"katex-block\">\\Delta\\chi=\\nabla\\cdot\\mathbf w<\/div>\n<ol><li>\n离散化：用自适应八叉树表示隐函数，每个节点带节点函数；向量场 <span class=\"katex-inline\">\\mathbf w<\/span> 由采样点内法向按局部面积加权，卷积盒式滤波表达为节点函数的线性求和；代入上式得到稀疏线性方程组 <span class=\"katex-inline\">\\min\\|\\nabla\\mathbf A\\chi-\\mathbf Y\\|^2<\/span> 形式的最小二乘系统。\n<\/li><li>\n抽取等值面：解出 <span class=\"katex-inline\">\\chi<\/span> 在各节点的值，选合适等值面用 Marching Cubes 类方法抽成网格。\n<\/ol>\n<p>推导依据：变分法把泛函极小化的一阶条件写成散度等式；法向场由曲面内法向在局部区域上的积分近似（式 2.36）；八叉树节点函数保证非均匀采样处仍有足够分辨率。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉法向全局定向<\/strong>：隐式重建依赖法向约定曲面内外；若相邻法向一半向内一半向外，向量场 <span class=\"katex-inline\">\\mathbf w<\/span> 互相抵消，Poisson 散度场失真，抽出的等值面局部翻面、孔洞或内外面颠倒。§2.3 用图优化把邻切平面法向点积最大化来统一方向，这一步不能省。\n<\/li><li>\n<strong>去掉采样密度与低噪声假设<\/strong>：显式 Delaunay 滤波在欠采样区域找不到足够邻近三角形，产生孔洞与伪像；噪声点被 Delaunay 四面体带进候选集，滤出细长错误三角形。Tight Cocone 靠标记内外四面体补水密表面，但严重噪声下仍会恶化。\n<\/li><li>\n<strong>去掉对应关系已知这一步<\/strong>：ICP 把&quot;最近点&quot;当对应；若两片点云形变差异大（非刚性场景），最近点并非真实对应，刚体估计把拉伸量误当旋转平移，迭代停在错误配准。这类场景要换 CPD 概率对应或非刚性配准能量。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：显式重建像在散点之间拉三角网再筛掉不属于表面的边；隐式重建像先给空间每个点标一个&quot;内外倾向值&quot;，再沿值为零的地方切片成面。\n<\/li><li>\n实例：Crust 流程中先算样本点集 <span class=\"katex-inline\">P<\/span> 的 Voronoi 图，取距样本最远且分居表面两侧的极点集合 <span class=\"katex-inline\">P&#x27;<\/span>，对 <span class=\"katex-inline\">P\\cup P&#x27;<\/span> 做 Delaunay 剖分，只保留三个顶点都属于 <span class=\"katex-inline\">P<\/span> 的三角形；极点相当于替中轴方向投下的辅助点。\n<\/li><li>\n实例：RBF 重建对带噪点云改用拟合而非严格插值，加入平滑参数 <span class=\"katex-inline\">\\delta<\/span> 平衡数据不光滑性；贪心迭代在误差大的位置补约束点再重算。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n误解 1：显式重建直接把相邻点连成三角形即可。为什么错：裸连接不经过 Voronoi/Delaunay 滤波，会把表面两侧样本连进内部三角形；滤波步骤依据外接圆与极点关系筛边，不是就近连线。\n<\/li><li>\n误解 2：隐式重建不需要点云法向。为什么错：纯位置约束下零等值面的内外符号无法定出；法向是最常用的附加约束，法向估计质量直接决定隐式曲面是否闭合正确。\n<\/li><li>\n误解 3：光顺越强越好。为什么错：基于顶点的低通滤波在去噪同时削平高曲率特征；特征保持要靠法向滤波或数据驱动算子，并在能量里权衡细节保留与噪声去除。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\nICP 每一步固定对应关系时，刚体参数为什么有闭式解？初值不好时会出什么问题？\n<\/li><li>\n写出 Poisson 重建最优性条件的方程，并说明向量场 <span class=\"katex-inline\">\\mathbf w<\/span> 由什么近似得到。\n<\/li><li>\n显式重建与隐式重建在噪声、缺失数据两类缺陷下各自的短板是什么？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n配准管线：粗配准给初值，ICP/CPD 精配准交替更新对应与变换。\n<\/li><li>\n显式靠 Voronoi/Delaunay 滤波，隐式靠标量场零水平集；法向定向是隐式内外的依据。\n<\/li><li>\n两类光顺：距离误差贴近邻域平面，法向误差对齐滤波法向，后者鲁棒但计算更贵。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章接住第 1 章的网格邻接结构与离散算子：配准与重建输出的网格，是第 3 章参数化、简化与压缩的输入；光顺用到的法向与曲率量来自第 1 章离散曲率格式。第 3 章多分辨率简化反过来为重建模型提供不同精度层级，第 4 章形变则在本章光顺后的网格上施加局部变换约束。<\/p>", "kind": "chapter", "title": "第 2 章：点云曲面重建和光顺（配准、显式与隐式重建、曲面光顺）"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.84<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：几何处理的数学基础（曲面表示、样条、微分几何与数值优化）<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：点云曲面重建和光顺（配准、显式与隐式重建、曲面光顺）<\/a><\/span><\/div><h1>第 3 章：网格曲面的参数化和多分辨率表示（参数化、简化、压缩与渐进网格）<\/h1>\n<blockquote>对应原书第 3 章 §3.1–3.3（PDF 第 84–122 页；章首互核：PDF 84 页为印刷页 72，PDF 105 页为印刷页 93）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01、ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n把网格参数化写成&quot;扭曲能量 + 位置约束&quot;的优化模型，说清单射与无翻转两条非退化条件；\n<\/li><li>\n写出映射 Jacobian 矩阵，解释共形、Dirichlet、伸缩等几类形变能量度量的差别；\n<\/li><li>\n定义 QEM 二次误差度量，推导折叠后顶点的二次型误差与最优折叠位置；\n<\/li><li>\n描述边折叠优先队列简化流程，并说明局部拓扑条件怎样约束可折叠边；\n<\/li><li>\n解释渐进网格的分解/重建两步：边折叠记录与顶点分裂逆操作。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>网格拿到后要解决两类降复杂度问题：把三维曲面摊到二维参数域做贴图与对应，这是参数化；把顶点面片数压到更少而少改形状，这是简化与多分辨率表示。两条路线都靠能量驱动：参数化最小化局部扭曲，简化按局部误差贪心删边，压缩则把邻接与坐标信息编码成渐进数据流。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：网格参数化（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。§3.1 把参数化建模为优化：<span class=\"katex-inline\">\\min_\\phi E(\\phi)+\\sum_i\\omega_i\\|u_i-\\bar u_i\\|^2<\/span>，<span class=\"katex-inline\">E(\\phi)<\/span> 为扭曲度量，位置约束以罚项形式给出（PDF 第 85 页）。平面参数化要求映射局部单射 <span class=\"katex-inline\">|J\\phi|\\neq 0<\/span>，且三角形在参数域内保持正定向面积（无翻转条件）。单片参数化把整张开网格映到一片参数域；闭合曲面或高弯曲区域扭曲大，需要分割成与圆盘同胚的多片分别参数化。能量可选 Dirichlet、共形、伸缩、Green–Lagrange、ABF 角度平摊或尽可能刚性（ARAP）能量；二次能量可解线性方程组，非二次能量用逐顶点或局部到整体交替迭代（PDF 第 85–86、92、98 页）。<\/p>\n<h3>2. 概念 2：QEM 简化与渐进网格（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。§3.2.1 简化目标是减少顶点与面片数量而尽量少改形状；方法含面片合并、顶点聚类、顶点删除与边折叠，边折叠法通过不断把一条网格边收缩为单个顶点实现简化，并结合局部误差估计构造优先队列贪心选择（PDF 第 101–102 页）。Garland 等提出的 QEM 定义折叠后顶点到折叠前两顶点邻接全部三角形平面的距离平方和（PDF 第 103 页）。§3.2.2 多分辨率表示分离散与连续两类：连续表示含分解与重建两步，渐进网格把每步边折叠 <span class=\"katex-inline\">ecol<\/span> 与逆操作顶点分裂 <span class=\"katex-inline\">vsplit<\/span> 记录进数据流，从最简网格逐步分裂恢复原网格（PDF 第 105 页）。§3.3 压缩编码包括三角形条带、广义三角形网、单网格压缩、渐进网格压缩与网格序列压缩。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[输入三角网格] --&gt; B[参数化: 扭曲能量 + 位置约束]\n    B --&gt; C[二维参数域: 贴图/对应/重映射]\n    A --&gt; D[QEM 边折叠: 误差优先队列]\n    D --&gt; E[简化网格序列]\n    E --&gt; F[渐进网格: 折叠记录 vsplit 逆操作]\n    F --&gt; G[多分辨率传输与绘制]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：参数化缺了无翻转条件，贴图三角形会翻面重叠；简化缺了局部拓扑校验，边折叠可能把非流形缝、孔洞边界或特征边压坏，后续无法恢复。<\/p>\n<h2>推导一（推演）：参数化能量模型与 Jacobian 扭曲度量<\/h2>\n<p>推演目标：把三维网格到二维参数域的映射 <span class=\"katex-inline\">\\phi<\/span> 写成可优化的形式，并说明扭曲怎样按三角形度量。<\/p>\n<ol><li>\n网格顶点 <span class=\"katex-inline\">v_i<\/span> 映射到参数域坐标 <span class=\"katex-inline\">u_i=(x_i,y_i)<\/span>；约束控制点给定 <span class=\"katex-inline\">\\bar u_i<\/span>，权重 <span class=\"katex-inline\">\\omega_i<\/span> 控制约束强弱。\n<\/li><li>\n目标函数：<span class=\"katex-inline\">E_{\\text{param}}=\\sum_{t\\in F}e(\\phi_t)S(t)+\\sum_i\\omega_i\\|u_i-\\bar u_i\\|^2<\/span>，其中 <span class=\"katex-inline\">e(\\phi_t)<\/span> 是三角形单元内的形变能量密度，<span class=\"katex-inline\">S(t)<\/span> 为单元面积。\n<\/li><li>\n三角形映射的 Jacobian <span class=\"katex-inline\">J<\/span> 由两个参数边向量构成二维矩阵；<span class=\"katex-inline\">J<\/span> 的奇异值刻画局部拉伸方向与比例。共形能量要求两个奇异值相等且夹角保持，Dirichlet 能量用奇异值平方和度量，伸缩能量按方向分别惩罚拉伸与压缩，Green–Lagrange 应变张量用 <span class=\"katex-inline\">J^\\top J-I<\/span> 描述。\n<\/li><li>\n非退化条件：<span class=\"katex-inline\">\\det J\\neq 0<\/span> 保证局部单射；参数域内三角形定向面积为正保证无翻转。违反任一条，映射在该三角形处塌缩或翻面。\n<\/li><li>\n求解：能量对 <span class=\"katex-inline\">u_i<\/span> 二次时，对顶点坐标求导得到线性方程组；非二次能量按局部到整体交替：先固定其余顶点优化局部旋转/仿射，再整体更新坐标。\n<\/ol>\n<p>推演依据：能量密度在三角形上分片定义；Jacobian 把连续变形度量搬到离散三角形；位置约束作为罚项进入同一目标函数。<\/p>\n<h2>推导二（证明/算法推演）：QEM 二次型与边折叠最优位置<\/h2>\n<p>推演目标：对边 <span class=\"katex-inline\">(p_a,p_b)<\/span> 的折叠，写出折叠点 <span class=\"katex-inline\">p<\/span> 的误差二次型，给出使误差最小的位置求解方式与队列流程。<\/p>\n<ol><li>\n邻接平面方程：平面 <span class=\"katex-inline\">P_l<\/span> 写为 <span class=\"katex-inline\">a_lx+b_ly+c_lz+d_l=0<\/span>，且 <span class=\"katex-inline\">a_l^2+b_l^2+c_l^2=1<\/span>。点 <span class=\"katex-inline\">p=(x,y,z)<\/span> 到该平面的距离平方为 <span class=\"katex-inline\">D_l=(a_lx+b_ly+c_lz+d_l)^2<\/span>。\n<\/li><li>\n齐次坐标 <span class=\"katex-inline\">\\hat p=(x,y,z,1)^\\top<\/span>，把距离平方写成二次型 <span class=\"katex-inline\">D_l=\\hat p^\\top Q_l\\hat p<\/span>，系数矩阵\n<\/ol>\n<div class=\"katex-block\">Q_l=\\begin{bmatrix}a_l^2&a_lb_l&a_lc_l&a_ld_l\\\\a_lb_l&b_l^2&b_lc_l&b_ld_l\\\\a_lc_l&b_lc_l&c_l^2&c_ld_l\\\\a_ld_l&b_ld_l&c_ld_l&d_l^2\\end{bmatrix}<\/div>\n<ol><li>\n边 <span class=\"katex-inline\">(p_a,p_b)<\/span> 折叠后，候选点 <span class=\"katex-inline\">p<\/span> 的 QEM 为两顶点邻接平面集合 <span class=\"katex-inline\">N(p_a,p_b)<\/span> 上的求和：<span class=\"katex-inline\">Q(p)=\\sum_{P_l\\in N(p_a,p_b)}\\hat p^\\top Q_l\\hat p=\\hat p^\\top(Q_a+Q_b)\\hat p<\/span>，其中 <span class=\"katex-inline\">Q_a,Q_b<\/span> 分别为两顶点累积的平面矩阵。\n<\/li><li>\n最优折叠位置：对二次型求导并令梯度为零，解线性方程组 <span class=\"katex-inline\">(Q_a+Q_b)<\/span> 的前三维子块给出驻点；二次型正定则驻点为最小误差点，否则回退到端点或约束位置。\n<\/li><li>\n队列流程：初始化遍历所有可折叠边，计算 QEM 并入按值递增的优先队列；弹出最小误差边，校验折叠拓扑条件后执行折叠，更新 1-环邻域内各边 QEM 并调整队列；重复直到达到简化目标或队列空。\n<\/ol>\n<p>推导依据：平面距离平方是坐标的二次多项式，累积后仍为二次型；二次型极小点由一阶必要条件（梯度为零）给出；优先队列保证每步选当前局部误差最小的折叠。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉无翻转条件<\/strong>：不要求参数域三角形定向面积为正，局部映射可以把三角形翻到参数域另一侧；贴图时纹理镜像重叠，对应关系在翻面区域错乱，且后续按参数域采样的重网格化会把正反面混在一起。\n<\/li><li>\n<strong>去掉拓扑校验<\/strong>：折叠前不检查边是否位于孔洞边界、非流形接缝或被约束控制边，折叠后可能产生孤立边、双面共边或违背流形条件的邻接扇面；简化网格再做光顺与参数化时半边遍历会断裂。\n<\/li><li>\n<strong>QEM 只算顶点间距离、不算平面距离<\/strong>：把误差换成 <span class=\"katex-inline\">\\|p-p_a\\|+\\|p-p_b\\|<\/span>，邻接平面的弯曲信息丢失；平坦大三角形与尖棱边被同等对待，折叠后尖棱被削平，视觉误差大于 QEM 估计。\n<\/li><li>\n<strong>去掉采样密度与网格质量前提<\/strong>：简化在细长三角形密集区域仍按几何误差排队，可能留下大量形状差的三角形；模拟计算要求单元规则，需要另行重网格化，单靠 QEM 简化达不到。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：参数化像把一张橡皮膜蒙到三维雕塑表面再揭平铺到桌面上；拉伸、收缩、翻面都是扭曲能量要惩罚的对象。QEM 简化像反复选&quot;折一下最不影响外观&quot;的棱，每折一次记一条改造记录，需要还原时按记录反着撑开。\n<\/li><li>\n实例：等边三角形两邻边参数化后若 Jacobian 两个奇异值均为 1，共形能量为零；若一条边被拉长一倍，奇异值为 2 与 1，伸缩能量在拉长方向产生惩罚。\n<\/li><li>\n实例：渐进网格中第 <span class=\"katex-inline\">i<\/span> 步折叠记录顶点编号 <span class=\"katex-inline\">s,t<\/span> 与合并坐标 <span class=\"katex-inline\">v_e<\/span>；重建时顶点分裂 <span class=\"katex-inline\">vsplit_i<\/span> 凭这些信息把一个顶点拆回 <span class=\"katex-inline\">v_s,v_t<\/span> 并恢复邻接三角形。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n误解 1：参数化只要把三维顶点坐标摊到平面就行。为什么错：摊点不保证三角形不翻转、不重叠；扭曲能量与非退化条件才保证映射可用，位置约束只是钉住边界。\n<\/li><li>\n误解 2：QEM 值越大表示折叠后网格越好看。为什么错：QEM 是折叠造成的几何误差度量，值越大改动越大；队列按值从小到大选边，优先折叠误差小的边。\n<\/li><li>\n误解 3：连续多分辨率模型与一组独立简化模型没有差别。为什么错：离散表示各层独立、切换可能跳变；连续表示保留层间对应与差量 <span class=\"katex-inline\">D_i<\/span>，可在层间平滑插值并做局部多分辨率编辑。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n写出参数化目标函数的两项组成，并说明无翻转条件对应 Jacobian 的哪条性质。\n<\/li><li>\nQEM 矩阵 <span class=\"katex-inline\">Q_l<\/span> 由平面方程系数怎样组装？两顶点邻接平面累积时矩阵如何合并？\n<\/li><li>\n渐进网格分解时记录了哪些信息？重建沿什么逆操作恢复原网格？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n参数化：扭曲能量密度按三角形求和，叠加位置罚项；单射看 <span class=\"katex-inline\">\\det J<\/span>，无翻转看定向面积。\n<\/li><li>\nQEM：折叠误差是邻接平面距离平方和的二次型，最小点由一阶必要条件解出。\n<\/li><li>\n渐进网格：边折叠记录与顶点分裂成对出现，层间差量编码为局部操作。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章上游接住第 2 章重建输出的网格：参数化需要网格具备可用邻接结构与法向，简化在重建网格上抽多分辨率层级。本章下游交给第 4 章：参数化的局部映射与扭曲度量是形变方法的对照，QEM 折叠与渐进网格的局部操作思想，也出现在重网格化与多分辨率编辑中；第 4 章形状分析所用的网格描述，建立在参数化给出的对应关系之上。<\/p>", "kind": "chapter", "title": "第 3 章：网格曲面的参数化和多分辨率表示（参数化、简化、压缩与渐进网格）"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.123<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：网格曲面的参数化和多分辨率表示（参数化、简化、压缩与渐进网格）<\/a><\/span><\/div><h1>第 4–9 章：重网格化、形状分析、网格形变、弹性模拟与机器学习几何处理<\/h1>\n<blockquote>对应原书第 4 章（网格模型的重网格化，PDF 第 123 页起）、第 5 章（三维形状分析，PDF 第 167 页起）、第 6 章（网格曲面的形变，PDF 第 196 页起）；第 7 章弹性运动模拟、第 8 章机器学习几何处理、第 9 章新型几何处理应用作为概览衔接。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明重网格化的两类产出：方向场/标架场驱动的四边形剖分与六面体剖分；\n<\/li><li>\n区分全局形状描述子与局部形状描述子的用途，列举分割与匹配检索的基本思路；\n<\/li><li>\n写出梯度域 Poisson 网格形变的流程：构造导引梯度场、求解 Poisson 方程重建形变网格；\n<\/li><li>\n写出保刚性（ARAP 式）形变能量，说明局部旋转 <span class=\"katex-inline\">R_i<\/span> 与边向量偏差项的交替优化；\n<\/li><li>\n概述弹性运动模拟、碰撞处理、稀疏/低秩学习与深度学习几何处理在全书管线中的位置。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>前三章把网格表示清楚、重建出来、压到合适规模；本章转向&quot;理解形状&quot;与&quot;改变形状&quot;：形状分析用描述子、分割、匹配把网格映射到可比较的语义空间，网格形变在保留局部细节的约束下把用户交互扩散到整张网格，弹性模拟与机器学习方法则是这两条主线在动态行为与数据驱动方向上的延伸。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：三维形状分析（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。第 5 章把形状分析分为描述、理解、分类、匹配与检索（PDF 第 167 页）。§5.1 人工定义描述子分全局与局部：全局描述子把整模型映成向量，代表有扩展高斯图、形状分布、光场描述子、3D Zernike 矩；局部描述子刻画局部区域特征（PDF 第 168、170 页）。§5.2 基于学习的描述子从数据自动提取特征。§5.3 模型分割把网格分解为部件或区块，全自动分割、交互式分割与多形状协同分割并列（PDF 第 178 页）。§5.4 形状匹配与检索在描述子空间度量相似性，完成模型库检索。<\/p>\n<h3>2. 概念 2：网格形变（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。第 6 章形变分插值重构与能量驱动两类（PDF 第 197 页）。插值重构含蒙皮（顶点按骨骼变换加权混合）、自由形变与多分辨率编辑。§6.2 梯度域线性形变：先在三角形上构造带局部旋转缩放的导引梯度场，再由 Poisson 方程重建形变网格顶点（PDF 第 203–205 页）。§6.3 非线性约束优化：把 Laplace 坐标写成邻接面法向的线性组合并固定系数，使坐标表示具备旋转不变性；对骨骼语义区域加入非线性骨架约束，保持直线性与原长（PDF 第 213–214 页）。保刚性能量对每个局部邻域估计旋转 <span class=\"katex-inline\">R_i<\/span>，惩罚变形后边向量与旋转后边向量的偏差。<\/p>\n<h3>3. 背景：重网格化、弹性模拟、机器学习与应用概览<\/h3>\n<p>第 4 章重网格化针对模拟与布局需求重新组织单元：四边形重网格化走方向场驱动、Morse–Smale 复形、周期四维向量场路线；六面体重网格化走局部拓扑操作、三维标架场与全局六面体拓扑、多立方体结构路线（PDF 第 123 页起）。第 7 章弹性运动模拟建立弹性运动方程，用子空间降维或位置投影加速求解，并处理碰撞检测与碰撞响应、运动编辑控制。第 8 章压缩感知与稀疏学习支撑网格去噪、稀疏正则化匹配与变形、字典学习蒙皮；机器学习基础覆盖任务、模型与方法，深度学习分支含低级特征、欧氏空间、流形上三维学习与端到端生成模型。第 9 章把方法落到行走重定向、3D 打印几何处理与机器人扫描重建、场景理解等应用。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[网格模型] --&gt; B[形状分析: 描述子/分割/匹配]\n    A --&gt; C[重网格化: 四边形/六面体]\n    A --&gt; D[网格形变]\n    D --&gt; D1[梯度域 Poisson 线性编辑]\n    D --&gt; D2[保刚性局部旋转能量]\n    D --&gt; D3[骨架非线性约束]\n    D1 --&gt; E[形变后网格]\n    D2 --&gt; E\n    D3 --&gt; E\n    E --&gt; F[弹性运动模拟 / 碰撞处理]\n    B --&gt; G[检索与语义理解]\n    H[稀疏学习/深度学习] -.-&gt; D\n    H -.-&gt; B<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：形变缺了局部旋转估计，Laplace 细节随大旋转被拉偏；形状描述子缺了旋转不变性，同一模型转个角度就匹配不上。<\/p>\n<h2>推导一（算法推演）：梯度域 Poisson 网格形变<\/h2>\n<p>推演目标：用户拖动约束顶点后，由导引梯度场重建整张形变网格。<\/p>\n<ol><li>\n原网格三角形上定义标量场梯度；每个三角形三个梯度向量构成面片局部变换（含旋转与缩放）。\n<\/li><li>\n导引场构造：把约束顶点的局部变换扩散到邻域，得到新的面片梯度场 <span class=\"katex-inline\">\\mathbf w<\/span>；导引场保留原网格的局部细节朝向。\n<\/li><li>\n离散散度：对三角形网格，定义顶点处离散散度 <span class=\"katex-inline\">\\mathrm{Div}(\\mathbf w)<\/span>，由邻接三角形梯度按面积加权求和得到。\n<\/li><li>\n离散 Poisson 方程：未知标量势场 <span class=\"katex-inline\">u<\/span> 满足 <span class=\"katex-inline\">\\mathrm{Div}(\\nabla u)=\\mathrm{Div}(\\mathbf w)<\/span>；网格形变把三个坐标分量分别作为标量势场，约束顶点给定边界值。\n<\/li><li>\n求解与重建：方程写成稀疏线性系统，固定边界约束后解出各顶点新坐标；三个分量分别重建即得形变网格。\n<\/ol>\n<p>推演依据：Poisson 方程解依赖导引场与边界条件；网格上散度与梯度定义在三角形面片上，面积加权使离散格式与第 1 章算子口径一致。<\/p>\n<h2>推导二（推导）：保刚性能量的局部旋转交替优化<\/h2>\n<p>推导目标：写出 ARAP 式形变能量，并说明每轮怎样分离旋转估计与位置更新。<\/p>\n<ol><li>\n对顶点 <span class=\"katex-inline\">i<\/span> 的 1-环邻域，定义局部旋转 <span class=\"katex-inline\">R_i<\/span>（三维为旋转矩阵，二维正交矩阵）；变形前边向量 <span class=\"katex-inline\">v_i-v_j<\/span>，变形后边向量 <span class=\"katex-inline\">v&#x27;_i-v&#x27;_j<\/span>。\n<\/li><li>\n能量写为边偏差加权和：\n<\/ol>\n<div class=\"katex-block\">E_{\\text{arap}}=\\sum_i\\sum_{j\\in N(i)}w_{ij}\\|R_i(v_i-v_j)-(v'_i-v'_j)\\|^2<\/div>\n<p>权重 <span class=\"katex-inline\">w_{ij}<\/span> 常取邻接三角形面积或余切权。<\/p>\n<ol><li>\n交替优化：固定变形后位置 <span class=\"katex-inline\">\\{v&#x27;\\}<\/span>，对每个 <span class=\"katex-inline\">R_i<\/span> 求解正交极分解（SVD）使邻域边向量被旋转后最贴合变形后构型；固定 <span class=\"katex-inline\">R_i<\/span>，能量关于 <span class=\"katex-inline\">\\{v&#x27;\\}<\/span> 是二次的，解线性最小二乘系统得到新位置。\n<\/li><li>\n约束项：交互拖动的控制点作为位置边界条件；骨架约束把骨骼采样点写成网格顶点线性组合，保持采样点共线与间距原长。\n<\/li><li>\n迭代到能量下降小于阈值，输出形变网格。\n<\/ol>\n<p>推导依据：旋转矩阵正交约束下，边向量配准的最优旋转由协方差矩阵 SVD 的极分解给出；位置固定后残差对坐标二次，全局更新仍是线性问题。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉局部旋转，直接固定 Laplace 坐标<\/strong>：传统线性方法把原 Laplace 坐标朝向固定不随旋转更新；大尺度旋转时，固定坐标与新网格面法向方向错位，局部细节被拉伸或塌陷，肢体弯折处出现不自然的褶皱。\n<\/li><li>\n<strong>去掉描述子的旋转/平移不变性<\/strong>：描述子按原始坐标直接统计，同一模型旋转摆放后向量分布改变，最近邻匹配把同一形状判为不同；检索召回率下降。全局矩、方向直方图等设计正是为抵消刚体变换影响。\n<\/li><li>\n<strong>去掉碰撞检测与处理<\/strong>：弹性运动模拟中物体相互穿透，接触力无法正确反馈，形变结果进入非法交叠状态；碰撞处理把穿透距离反解为位置约束或力约束。\n<\/li><li>\n<strong>去掉法向与梯度的面积加权<\/strong>：离散散度在大小三角形间平均分配，大三角形与小三角形贡献相同权重，导引场被小三角形噪声放大，重建网格出现局部抖动。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：梯度域形变像先把每个三角形的&quot;局部朝向与细节&quot;打包成导引场，再把包按相邻关系重新铺开；保刚性约束要求每个局部小包尽量只转不伸缩。\n<\/li><li>\n实例：蒙皮公式 <span class=\"katex-inline\">v=\\sum_i w_iT_i(p_i)<\/span>，<span class=\"katex-inline\">w_i<\/span> 为骨骼 <span class=\"katex-inline\">i<\/span> 对该顶点的影响权重；关节处线性混合会出现体积收缩，融合蒙皮与形状插值方法针对这一缺陷改进。\n<\/li><li>\n实例：形状分割把每个面片 <span class=\"katex-inline\">j<\/span> 归入种子子集 <span class=\"katex-inline\">S_i<\/span>，按距离函数 <span class=\"katex-inline\">\\|s_i-j\\|<\/span> 归类；迭代法则交替更新种子与聚类，模糊边界用最小割原理处理。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n误解 1：形变就是把顶点沿用户拖动方向平移。为什么错：整体平移不保留局部弯曲细节；能量驱动方法在邻域约束下扩散位移，保刚性能量还要求局部邻域只转不伸缩。\n<\/li><li>\n误解 2：全局描述子也能做局部对应。为什么错：全局向量只编码整模型分布，局部区域在全局统计里被淹没；局部对应需要局部描述子在邻域窗口内匹配。\n<\/li><li>\n误解 3：深度学习方法替代了前面所有离散算子。为什么错：第 8 章数据驱动分支仍建立在网格邻接、法向、稀疏编码等离散表示之上；学习得到的去噪、重建、变形算子与传统方法并列使用，按噪声类型与数据条件选择。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n写出保刚性能量的边偏差项，并说明固定位置后怎样求 <span class=\"katex-inline\">R_i<\/span>、固定 <span class=\"katex-inline\">R_i<\/span> 后怎样更新位置。\n<\/li><li>\n梯度域 Poisson 形变中导引场从哪里来？离散 Poisson 方程的两侧分别是什么？\n<\/li><li>\n全局描述子与局部描述子在分割、匹配两类任务中各承担什么角色？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n形变两条路线：插值重构靠控制单元加权扩散，能量驱动靠梯度场重建或局部旋转优化。\n<\/li><li>\n保刚性：邻域只旋转不伸缩，旋转估计与位置更新交替求解。\n<\/li><li>\n形状分析：描述子不变性支撑匹配，分割按距离或图聚类把网格分到子集。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章是全书管线的末端：重网格化消化第 3 章简化留下的单元质量问题；形状分析复用第 1 章曲率、法向与第 3 章参数化对应；网格形变建立在第 1 章 Laplace 算子与第 2 章光顺后的网格上。第 7 章弹性模拟把形变从静态编辑推进到动态方程，第 8、9 章把前述算子交给数据驱动与应用场景，形成&quot;表示—重建—处理—分析—形变—应用&quot;的完整闭环。<\/p>", "kind": "chapter", "title": "第 4–9 章：重网格化、形状分析、网格形变、弹性模拟与机器学习几何处理"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.14<\/div><h1>多边形网格、流形条件与半边数据结构<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书 §1.1.1，PDF 第 14–16 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>多边形网格是顶点集、边集、面片集三层嵌套的离散曲面表示；流形条件约束每条边至多邻接两个面片、每个顶点邻接面片构成单一扇面；半边数据结构把每条边拆成方向相反的两条单向边，用指针记录点、面、邻接半边关系以支持高效遍历。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>三维形体在计算机里不能直接存一张连续曲面，存储有限、计算有限，只能用采样点连成的面片逼近。最朴素的存法是两张表：顶点表存每个顶点的三维坐标（可附带纹理坐标与法向），面片表存每个面片的顶点序号列表。这种表示能把图画出来，但遇到邻接查询就会失效：要找一条边旁边有哪些三角形、要绕一个顶点数一圈邻接面，只能遍历整张面片表逐个比对，网格规模一大，每次查询都是线性扫描。<\/p>\n<p>更严重的问题出在拓扑合法性上。扫描重建、手工拼接、算法删边之后，网格里可能出现一条边被三个三角形共用、一个顶点周围的面片分成两团互不相通、两片表面在同一个顶点处对接等情形。这类非流形结构在图形绘制时未必肉眼可辨，但后续的曲率计算、参数化展开、边折叠简化、布尔求交都会踩坑：半边遍历找不到唯一对偶边，参数化把两团扇面当成一张圆盘展开，简化时一条边折下去产生孤立边。<\/p>\n<p>网格表示要解决的困难有两层：一是怎样把邻接关系存到可以常数步遍历，二是怎样在存之前判别拓扑是不是合格的二维流形。顶点表加面片表回答了&quot;点在哪、面由谁组成&quot;，半边结构回答&quot;相邻关系是什么&quot;，流形条件回答&quot;这张网能不能当连续曲面的分片逼近&quot;。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>三层集合<\/strong>：网格记为 <span class=\"katex-inline\">G=(V,E,F)<\/span>。顶点集 <span class=\"katex-inline\">V=\\{v_i\\}<\/span>，每个顶点带坐标 <span class=\"katex-inline\">p_i=(x_i,y_i,z_i)<\/span>；边集 <span class=\"katex-inline\">E<\/span> 中每条边连接两个顶点；面片集 <span class=\"katex-inline\">F<\/span> 中每个面片是一组首尾成环的顶点。全部由三角形构成的网格称三角网格，是数字几何模型的主要形式。<\/p>\n<p><strong>顶点表与面片表<\/strong>：顶点表逐行记录顶点坐标，行数等于顶点数；面片表逐行记录顶点序号，序号从 1 起计。面片顶点排列顺序对应面片逆时针方向（沿外法线看）。相邻面片共享顶点，一个顶点因此出现在多个面片行中。<\/p>\n<p><strong>流形条件（网格表现形式）<\/strong>：<\/p>\n<ol><li>\n每条边最多邻接两个面片；\n<\/li><li>\n每个顶点的邻接面片构成一个闭合扇面（内部顶点）或开放扇面（边界顶点），扇面内面片沿边依次相接，不分裂成两团。\n<p>拓扑含义：流形曲面上任一点的邻域同胚于二维圆盘（内部点）或半圆碟（边界点）。<\/p>\n<\/ol>\n<p><strong>半边数据结构<\/strong>：每条无向边 <span class=\"katex-inline\">e<\/span> 拆成两条方向相反的半边 <span class=\"katex-inline\">h,h&#x27;<\/span>。每条半边记录五类指针：<\/p>\n<ol><li>\n<code>origin(h)<\/code>：半边起点；\n<\/li><li>\n<code>face(h)<\/code>：邻接面片指针，边界半边无邻接面时记 NULL；\n<\/li><li>\n<code>next(h)<\/code>：同面片内的下一条半边（顺时针方向遍历口径以原书为准）；\n<\/li><li>\n<code>flip(h)<\/code>：同一条边的另一半边，方向相反，位于相邻面片；\n<\/li><li>\n可选 <code>prev(h)<\/code>：同面片上一条半边，可由 next 组合推出。\n<\/ol>\n<p>顶点记录一条从它出发的半边，面片记录环绕它的一条代表半边。<\/p>\n<p><strong>正例<\/strong>：一个四面体四条？不，四面体六条边、四个三角形；每条边邻接两个三角形，每个顶点周围三个三角形连成闭合扇面，是流形三角网格。<\/p>\n<p><strong>反例<\/strong>：两个三角形只共用一个顶点而不共用边，该顶点邻接面片分成两团，非流形；一条边叠三个三角形，边邻接数为三，非流形；面片顶点顺序顺时针写反，外法向方向反转，属于定向错误而非拓扑非流形。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>遍历面片的推演<\/strong>：从半边 <span class=\"katex-inline\">h_0<\/span> 出发，令 <span class=\"katex-inline\">h_{k+1}=\\mathrm{next}(h_k)<\/span>，回到 <span class=\"katex-inline\">h_0<\/span> 停止。沿途顶点为 <span class=\"katex-inline\">o_k=\\mathrm{origin}(h_k)<\/span>。成立依据：<code>next<\/code> 指针按面片环向指向下一条边，环上半边闭合，有限步必然回到起点；面片有 <span class=\"katex-inline\">k<\/span> 条边就访问 <span class=\"katex-inline\">k<\/span> 条半边。<\/p>\n<p><strong>遍历顶点 1-环邻域的推演<\/strong>：设当前半边 <span class=\"katex-inline\">a<\/span> 从顶点 <span class=\"katex-inline\">v<\/span> 出发。取对偶 <span class=\"katex-inline\">b=\\mathrm{flip}(a)<\/span> 跳到相邻面片，再取 <span class=\"katex-inline\">a&#x27;=\\mathrm{next}(b)<\/span>，<span class=\"katex-inline\">a&#x27;<\/span> 是该相邻面片上从 <span class=\"katex-inline\">v<\/span> 出发的下一条半边。重复 <span class=\"katex-inline\">a\\leftarrow a&#x27;<\/span> 直到回到初始半边。沿途：邻接顶点为 <span class=\"katex-inline\">\\mathrm{origin}(\\mathrm{flip}(a))<\/span>，邻接面片为 <span class=\"katex-inline\">\\mathrm{face}(a)<\/span>。<\/p>\n<p>推导链条：半边同时挂在边、面、顶点三个结构上，<code>next<\/code> 负责面内环向，<code>flip<\/code> 负责跨面跳转；两个指针组合足以绕完一个顶点的扇面。这解释了为什么 <code>prev<\/code> 可选——先 flip 再 next 即可得到上一条半边。<\/p>\n<p><strong>流形条件与指针唯一性的对应<\/strong>：流形时每条边恰有两条半边，<code>flip<\/code> 一一配对；边邻接三面时第三条半边找不到配对对象，非流形顶点扇面分裂时，绕顶点一圈会在两团之间断环。指针结构能成立，前提正是边邻接数不超过 2。<\/p>\n<p><strong>定向一致性<\/strong>：同一面片内半边环向统一为逆时针（外法向口径），相邻面片共享边的两条半边方向相反。法向由面片顶点顺序按右手定则确定；环向混乱会让相邻面法向一正一反。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：网格面片内连续可导；边与顶点至少邻接一个面片；半边结构的指针在建模或重建阶段一次性建好，后续遍历只做指针跳转。\n<\/li><li>\n边界 1：非流形网格不能直接套标准半边配对。工程上要么先修复成流形（合并重复顶点、删多余三角形），要么使用支持多边邻接的非流形数据结构。\n<\/li><li>\n边界 2：半边结构存储代价高于两张表。每条边两条半边，半边记录多个指针；大规模点云直连或高度稀疏的多边形集合，用半边结构不划算。\n<\/li><li>\n边界 3：流形是拓扑条件，不保证网格质量。等边三角形组成的非流形拼接拓扑不合格，细长三角形组成的流形网格几何质量差；两件事要分开检查。\n<\/li><li>\n失败案例：把两片只在一个顶点对接的网格喂给参数化算法，按单一扇面展开时第二团面片没有边界环向约束，摊到参数域后位置错乱。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>顶点表/面片表 vs 半边结构<\/strong>：前者只存组成关系，查询邻接要全表扫描；后者把邻接关系显式存在边上，遍历为常数邻接时间。面片表是&quot;面由谁组成&quot;的视角，半边是&quot;相邻关系是什么&quot;的视角，两者可并存：半边指针回到顶点表取坐标。\n<\/li><li>\n<strong>流形 vs 有界（封闭/开放）<\/strong>：流形允许边界边（邻接一个面片），开放网格有边界环；封闭网格无边邻接一面。流形不等于封闭，圆盘网格有边界仍是流形。\n<\/li><li>\n<strong>流形 vs 正则网格<\/strong>：规则四边形网格行列整齐是几何布局；流形只讲邻接拓扑，三角形乱长只要边邻接两面、扇面单一，仍是流形。\n<\/li><li>\n<strong>半边 vs 翼边结构<\/strong>：翼边（winged edge）在边上存左右顶点与左右边指针，信息密度高但指针多；半边把方向拆到两条半边上，每条半边职责单一，遍历口径更直接。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无，本章是全书最底层的表示概念。后继：c02 在 1-环邻域上定义离散 Laplace 算子与曲率，邻接顶点集合 <span class=\"katex-inline\">N(i)<\/span> 由半边遍历得到；c07 边折叠简化在半边结构上执行删边与邻接更新；c03 配准与 c04 重建输出的网格，都要先落到这套点-边-面结构上才能进后续处理。半边结构把&quot;离散曲面到底存了什么&quot;钉死，后面所有算子都建立在邻接可遍历这一前提上。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（多边形网格、流形条件与半边数据结构）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：半边依赖链、邻域遍历推演与小网格逐项核对<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把&quot;网格邻接可遍历&quot;这件事往回追四层，每层写清缺了它上层就站不住的原因：<\/p>\n<ol><li>\n<strong>顶点坐标与面片组成<\/strong>：顶点表给每个点的空间位置，面片表给每个面由哪些顶点围成。没有这一层，半边指针没有可指向的对象，边也无从定义。\n<\/li><li>\n<strong>边与面片的邻接关系<\/strong>：一条边被哪些面共享、一个面由哪些边围成，是从组成关系中提取的连接信息。组成关系只回答&quot;面里有谁&quot;，邻接关系回答&quot;面旁边是谁&quot;。\n<\/li><li>\n<strong>流形合法性判别<\/strong>：边邻接数不超过 2、顶点扇面单一，保证每条边的两条半边可以一一配对，扇面绕得通。拓扑不合格时，邻接关系本身矛盾，存进指针会产生悬空或重复指向。\n<\/li><li>\n<strong>半边指针落地<\/strong>：<code>origin<\/code>、<code>face<\/code>、<code>next<\/code>、<code>flip<\/code> 把连接关系显式存进单向边，面遍历与顶点邻域遍历才成为常数邻接时间操作。\n<\/ol>\n<p>依赖链方向：顶点/面片组成 → 邻接关系 → 流形条件 → 半边指针 → 邻域遍历算子。再往下一层，坐标与组成来自重建或建模，属于第 2 章点云管线的输出；链路上游不在本概念范围内。<\/p>\n<h2>正向推导：从集合定义到遍历规则<\/h2>\n<p><strong>第一步，记网格为 <span class=\"katex-inline\">G=(V,E,F)<\/span>。<\/strong> 顶点 <span class=\"katex-inline\">v_i\\in V<\/span> 带坐标 <span class=\"katex-inline\">p_i=(x_i,y_i,z_i)<\/span>；边 <span class=\"katex-inline\">e=(v_a,v_b)\\in E<\/span>；面片 <span class=\"katex-inline\">f\\in F<\/span> 是成环顶点序列。三角网格每个 <span class=\"katex-inline\">f<\/span> 含三个顶点，多边形网格面片边数可大于三。<\/p>\n<p><strong>第二步，拆半边。<\/strong> 每条无向边 <span class=\"katex-inline\">e<\/span> 对应两条半边 <span class=\"katex-inline\">h^+,h^-<\/span>，方向相反：<span class=\"katex-inline\">h^+<\/span> 从 <span class=\"katex-inline\">v_a<\/span> 指向 <span class=\"katex-inline\">v_b<\/span>，<span class=\"katex-inline\">h^-<\/span> 从 <span class=\"katex-inline\">v_b<\/span> 指向 <span class=\"katex-inline\">v_a<\/span>。定义四条基本指针：<span class=\"katex-inline\">\\mathrm{origin}(h)<\/span> 为起点，<span class=\"katex-inline\">\\mathrm{face}(h)<\/span> 为邻接面片（边界半边为 NULL），<span class=\"katex-inline\">\\mathrm{next}(h)<\/span> 为同面下一条半边，<span class=\"katex-inline\">\\mathrm{flip}(h)<\/span> 为对偶半边。可选的上一条半边 <code>prev<\/code> 不单独存储。<\/p>\n<p><strong>第三步，面环闭合。<\/strong> 面片 <span class=\"katex-inline\">f<\/span> 的半边序列 <span class=\"katex-inline\">h_1,h_2,\\dots,h_k<\/span> 满足 <span class=\"katex-inline\">\\mathrm{next}(h_r)=h_{r+1}<\/span>（下标模 <span class=\"katex-inline\">k<\/span>），且 <span class=\"katex-inline\">\\mathrm{origin}(h_{r+1})<\/span> 等于 <span class=\"katex-inline\">h_r<\/span> 的终点。沿 next 走一圈回到 <span class=\"katex-inline\">h_1<\/span>，沿途顶点序列即面片顶点序列。环向统一为沿外法线看的逆时针；法向由面片顶点顺序按右手定则确定。<\/p>\n<p><strong>第四步，跨面跳转。<\/strong> 共享边两侧的半边互为 flip：<span class=\"katex-inline\">\\mathrm{flip}(\\mathrm{flip}(h))=h<\/span>。从面片 <span class=\"katex-inline\">f<\/span> 跨到邻接面片 <span class=\"katex-inline\">f&#x27;<\/span>，先 flip 到对偶半边，再 next 进入 <span class=\"katex-inline\">f&#x27;<\/span> 的环。两条半边方向相反，正是为了让两侧面片各自保持逆时针环向。<\/p>\n<p><strong>第五步，顶点扇面遍历。<\/strong> 设 <span class=\"katex-inline\">a_0<\/span> 是从 <span class=\"katex-inline\">v<\/span> 出发的半边。令 <span class=\"katex-inline\">b=\\mathrm{flip}(a_0)<\/span>，<span class=\"katex-inline\">a_1=\\mathrm{next}(b)<\/span>；<span class=\"katex-inline\">a_1<\/span> 是邻接面片上从 <span class=\"katex-inline\">v<\/span> 出发的下一条半边。递推 <span class=\"katex-inline\">a_{r+1}=\\mathrm{next}(\\mathrm{flip}(a_r))<\/span>，绕扇面一圈回到 <span class=\"katex-inline\">a_0<\/span>。沿途 <span class=\"katex-inline\">\\mathrm{origin}(\\mathrm{flip}(a_r))<\/span> 给出邻接顶点，<span class=\"katex-inline\">\\mathrm{face}(a_r)<\/span> 给出邻接面片。<\/p>\n<p><strong>第六步，复杂度核对。<\/strong> 面片有 <span class=\"katex-inline\">k<\/span> 条边，面遍历访问 <span class=\"katex-inline\">k<\/span> 条半边；顶点度数为 <span class=\"katex-inline\">d<\/span>（邻接边数），扇面遍历访问 <span class=\"katex-inline\">d<\/span> 条半边。两者都只访问局部元素，不扫描整张表。对照朴素面片表：找 <span class=\"katex-inline\">v_i<\/span> 的邻接顶点要遍历全部 <span class=\"katex-inline\">F<\/span> 个面片，每个面片检查 <span class=\"katex-inline\">k<\/span> 个顶点，代价 <span class=\"katex-inline\">O(Fk)<\/span>；半边结构代价 <span class=\"katex-inline\">O(d)<\/span>。<\/p>\n<p><strong>第七步，流形条件与指针配对的互相约束。<\/strong> 边邻接两面时 flip 配对唯一；邻接三面时第三条半边没有对偶对象；顶点扇面分裂时，递推在第一团与第二团之间断环。数据结构能跑通，以拓扑合格为前提。流形的拓扑表述是：内部点邻域同胚于二维圆盘，边界点邻域同胚于半圆碟；网格表现就是边邻接数不超二、扇面单一。<\/p>\n<p><strong>第八步，<code>prev<\/code> 可省的推导。<\/strong> 想取同面 <span class=\"katex-inline\">h<\/span> 的上一条半边 <span class=\"katex-inline\">p<\/span>，先 flip(<span class=\"katex-inline\">h<\/span>) 到邻接面，再 next 一次回到邻接面里接在 <span class=\"katex-inline\">h<\/span> 对偶半边之后的那条边，再 flip 回来即得 <span class=\"katex-inline\">p<\/span>。三步指针跳转替代存储一条指针，这是原书把上一条半边标为可选的原因。<\/p>\n<h2>数值算例一：四面体上的半边遍历<\/h2>\n<p>取正四面体：顶点 <span class=\"katex-inline\">v_1,v_2,v_3,v_4<\/span>，六条边 <span class=\"katex-inline\">(1,2),(1,3),(1,4),(2,3),(2,4),(3,4)<\/span>，四个三角形 <span class=\"katex-inline\">(1,2,3),(1,3,4),(1,4,2),(2,4,3)<\/span>（环向按外法向统一）。<\/p>\n<ol><li>\n计数：六条边拆成 <span class=\"katex-inline\">6\\times2=12<\/span> 条半边；每个顶点度数为 3，四个顶点共 <span class=\"katex-inline\">4\\times3=12<\/span> 条&quot;出发点&quot;半边，与 12 条半边对得上。三角形数 <span class=\"katex-inline\">F=4<\/span>，每条边两面邻接，边面关联总数 <span class=\"katex-inline\">6\\times2=12<\/span>，等于 <span class=\"katex-inline\">3F=12<\/span>，三角网格边面关联自洽。\n<\/li><li>\n面遍历：三角形 <span class=\"katex-inline\">(1,2,3)<\/span> 的半边序列 <span class=\"katex-inline\">h_{12}:1\\to2<\/span>，<span class=\"katex-inline\">h_{23}:2\\to3<\/span>，<span class=\"katex-inline\">h_{31}:3\\to1<\/span>。next 链 <span class=\"katex-inline\">h_{12}\\to h_{23}\\to h_{31}\\to h_{12}<\/span>，三步入环闭合。\n<\/li><li>\n邻接关系：边 <span class=\"katex-inline\">(1,2)<\/span> 两侧面片为 <span class=\"katex-inline\">(1,2,3)<\/span> 与 <span class=\"katex-inline\">(1,4,2)<\/span>；<span class=\"katex-inline\">h_{12}<\/span> 的 flip 是 <span class=\"katex-inline\">(1,4,2)<\/span> 面上的 <span class=\"katex-inline\">h_{21}:2\\to1<\/span>。\n<\/li><li>\n顶点 <span class=\"katex-inline\">v_1<\/span> 的扇面：出发半边依次为 <span class=\"katex-inline\">h_{12},h_{14},h_{13}<\/span>（按环向排列）。递推：flip(<span class=\"katex-inline\">h_{12}<\/span>) 到面 <span class=\"katex-inline\">(1,4,2)<\/span> 的 <span class=\"katex-inline\">h_{21}<\/span>，next 得 <span class=\"katex-inline\">h_{14}<\/span>；flip(<span class=\"katex-inline\">h_{14}<\/span>) 到面 <span class=\"katex-inline\">(1,3,4)<\/span> 的 <span class=\"katex-inline\">h_{41}<\/span>，next 得 <span class=\"katex-inline\">h_{13}<\/span>；flip(<span class=\"katex-inline\">h_{13}<\/span>) 回面 <span class=\"katex-inline\">(1,2,3)<\/span>，next 得 <span class=\"katex-inline\">h_{12}<\/span>。三步回到起点，邻接顶点为 <span class=\"katex-inline\">v_2,v_4,v_3<\/span>。\n<\/li><li>\n核对：每个顶点三个邻接面、三条邻接边，扇面闭合，满足流形条件。欧拉示性数核对：<span class=\"katex-inline\">V-E+F=4-6+4=2<\/span>，对应封闭球面拓扑，与四面体同胚于球面一致。\n<\/ol>\n<p><strong>带坐标的补充核对<\/strong>：取坐标 <span class=\"katex-inline\">p_1=(1,1,1)<\/span>，<span class=\"katex-inline\">p_2=(-1,-1,1)<\/span>，<span class=\"katex-inline\">p_3=(-1,1,-1)<\/span>，<span class=\"katex-inline\">p_4=(1,-1,-1)<\/span>。三角形 <span class=\"katex-inline\">(1,2,3)<\/span> 的两条边向量 <span class=\"katex-inline\">p_2-p_1=(-2,-2,0)<\/span>，<span class=\"katex-inline\">p_3-p_1=(-2,0,-2)<\/span>，叉积 <span class=\"katex-inline\">(-2,-2,0)\\times(-2,0,-2)=(4,-4,-4)<\/span>，方向朝外；若顶点顺序排成 <span class=\"katex-inline\">(1,3,2)<\/span>，叉积反向，法向翻转而拓扑不变。<\/p>\n<h2>数值算例二：三个小例的判别与修复<\/h2>\n<p><strong>例 A：两边片共点不共边。<\/strong> 三角形 <span class=\"katex-inline\">(1,2,3)<\/span> 与 <span class=\"katex-inline\">(1,4,5)<\/span> 只共享顶点 <span class=\"katex-inline\">v_1<\/span>。<\/p>\n<ol><li>\n看 <span class=\"katex-inline\">v_1<\/span> 邻接面片：第一团为 <span class=\"katex-inline\">(1,2,3)<\/span>，第二团为 <span class=\"katex-inline\">(1,4,5)<\/span>，两团之间没有共享边相接。\n<\/li><li>\n沿递推绕 <span class=\"katex-inline\">v_1<\/span>：在第一团扇面走完半边后，flip/next 找不到通往第二团的边，遍历断裂。\n<\/li><li>\n判别：非流形。修复方式是合并重复顶点、补边把两团缝成单一扇面，或明确拆成两个独立网格分别处理。\n<\/ol>\n<p><strong>例 B：一边三邻面。<\/strong> 边 <span class=\"katex-inline\">(1,2)<\/span> 被三角形 <span class=\"katex-inline\">(1,2,3),(1,2,4),(1,2,5)<\/span> 共用。<\/p>\n<ol><li>\n该边拆出两条半边，却要挂三个邻接面；<code>face<\/code> 指针无法唯一填写。\n<\/li><li>\n判别：非流形。两条半边方向上只能配对两对，第三面悬空。\n<\/li><li>\n修复：删除重复三角形，或在边上引入细分顶点把三个面分到不同边段，使每条边回到至多两面。\n<\/ol>\n<p><strong>例 C：定向错误。<\/strong> 三角形 <span class=\"katex-inline\">(1,3,2)<\/span> 把环向写反，其余面片保持逆时针。该面片边邻接关系仍为两面，拓扑流形成立；但法向按右手定则反向，光照与法向滤波会出错。判别：这是定向问题，不是非流形问题，修复方式是翻转面片顶点顺序，不动边与顶点连接。<\/p>\n<p><strong>例 D：边界开放网格。<\/strong> 圆盘形三角网格外圈边只邻接一个三角形。外圈半边的对偶半边 <code>face<\/code> 记 NULL；绕边界顶点时开放扇面走到边界半边即终止，不要求闭合环。该网格仍是流形，边界点邻域同胚于半圆碟。<\/p>\n<h2>补充推演：三角网格的计数关系<\/h2>\n<p>封闭三角网格中，每条边邻接两个三角形，三角形总边次为 <span class=\"katex-inline\">3F<\/span>，边总次为 <span class=\"katex-inline\">2E<\/span>，二者相等：<span class=\"katex-inline\">3F=2E<\/span>。代入欧拉示性数 <span class=\"katex-inline\">V-E+F=\\chi<\/span>（封闭球面 <span class=\"katex-inline\">\\chi=2<\/span>），可解出 <span class=\"katex-inline\">E=3(V-\\chi)<\/span>，<span class=\"katex-inline\">F=2(V-\\chi)<\/span>。以四面体核对：<span class=\"katex-inline\">V=4,\\chi=2<\/span>，<span class=\"katex-inline\">E=3(4-2)=6<\/span>，<span class=\"katex-inline\">F=2(4-2)=4<\/span>，与实际计数一致。<\/p>\n<p>开放圆盘网格带边界：设边界边数为 <span class=\"katex-inline\">b<\/span>，内部边邻接两面、边界边邻接一面，边面关联总数 <span class=\"katex-inline\">3F=2E-b<\/span>。此时 <span class=\"katex-inline\">V-E+F=1<\/span>。取一个带三条边界边的三角形片：<span class=\"katex-inline\">V=3,E=3,F=1,b=3<\/span>，<span class=\"katex-inline\">3F=3<\/span>，<span class=\"katex-inline\">2E-b=6-3=3<\/span>，等式成立；<span class=\"katex-inline\">V-E+F=3-3+1=1<\/span>，对应圆盘拓扑。<\/p>\n<p>这套计数关系在建完网格后可做自洽检查：程序统计出的 <span class=\"katex-inline\">V,E,F,b<\/span> 不满足 <span class=\"katex-inline\">3F=2E-b<\/span>，说明有重复三角形、遗漏边或边界边计数错误，半边结构的配对关系一定有损坏。<\/p>\n<h2>补充推演：面法向的坐标计算<\/h2>\n<p>三角形顶点 <span class=\"katex-inline\">p_a,p_b,p_c<\/span> 按逆时针环向排列，两条边向量 <span class=\"katex-inline\">e_1=p_b-p_a<\/span>，<span class=\"katex-inline\">e_2=p_c-p_a<\/span>。面法向方向取叉积 <span class=\"katex-inline\">\\mathbf n=e_1\\times e_2<\/span>，归一化后 <span class=\"katex-inline\">\\mathbf n/|\\mathbf n|<\/span>。叉积分量展开：<\/p>\n<div class=\"katex-block\">e_1=(x_b-x_a,y_b-y_a,z_b-z_a),\\quad e_2=(x_c-x_a,y_c-y_a,z_c-z_a)<\/div>\n<div class=\"katex-block\">\\mathbf n=(e_{1y}e_{2z}-e_{1z}e_{2y},\\ e_{1z}e_{2x}-e_{1x}e_{2z},\\ e_{1x}e_{2y}-e_{1y}e_{2x})<\/div>\n<p>环向反序（<span class=\"katex-inline\">b,c<\/span> 交换）时叉积取负，法向反向。邻接面片共享边的两条半边方向相反，正是要让两侧叉积按各自外法向取号一致。法向一致性检查可遍历面片，把相邻面片法向点积与零比较：点积接近负一说明其中一面定向反了。<\/p>\n<h2>补充算例：一个开放三角网格的半边清点<\/h2>\n<p>取两个共边三角形 <span class=\"katex-inline\">(1,2,3)<\/span> 与 <span class=\"katex-inline\">(1,3,4)<\/span>，共享边 <span class=\"katex-inline\">(1,3)<\/span>。顶点 <span class=\"katex-inline\">V=4<\/span>，边：内部边 <span class=\"katex-inline\">(1,3)<\/span>，边界边 <span class=\"katex-inline\">(1,2),(2,3),(3,4),(4,1)<\/span>，共 <span class=\"katex-inline\">E=5<\/span>，边界数 <span class=\"katex-inline\">b=4<\/span>，<span class=\"katex-inline\">F=2<\/span>。<\/p>\n<ol><li>\n计数核对：<span class=\"katex-inline\">3F=6<\/span>，<span class=\"katex-inline\">2E-b=10-4=6<\/span>；<span class=\"katex-inline\">V-E+F=4-5+2=1<\/span>，圆盘拓扑成立。\n<\/li><li>\n半边总数 <span class=\"katex-inline\">2E=10<\/span>；内部边 <span class=\"katex-inline\">(1,3)<\/span> 两条半边都有邻接面，四条边界边各有一条半边 <code>face<\/code> 为 NULL。\n<\/li><li>\n绕共享边 <span class=\"katex-inline\">(1,3)<\/span>：<span class=\"katex-inline\">h_{13}<\/span> 属于面 <span class=\"katex-inline\">(1,2,3)<\/span>，flip 得 <span class=\"katex-inline\">h_{31}<\/span> 属于面 <span class=\"katex-inline\">(1,3,4)<\/span>；两侧环向分别为 <span class=\"katex-inline\">1\\to2\\to3<\/span> 与 <span class=\"katex-inline\">1\\to3\\to4<\/span>，共享边走向相反。\n<\/li><li>\n绕顶点 <span class=\"katex-inline\">v_3<\/span>：邻接边 <span class=\"katex-inline\">(1,2)<\/span> 方向上不经过 <span class=\"katex-inline\">v_3<\/span>，<span class=\"katex-inline\">v_3<\/span> 的邻接顶点为 <span class=\"katex-inline\">v_2,v_1,v_4<\/span>，扇面开放，起点半边沿边界 <span class=\"katex-inline\">(2,3)<\/span> 进入、沿边界 <span class=\"katex-inline\">(3,4)<\/span> 结束。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>去掉流形假设直接建半边。<\/strong> 取例 B 的一边三面网格建结构：为第三条面强行再拆半边，flip 指向已被占用的对偶边，跨面跳转时跳到错误面片；绕顶点扇面时同一邻接面被访问两次。后果：曲率求和把该区域面重复计入，参数化边界环找不到闭合路径，边折叠时一条边压下去产生孤立边。<\/p>\n<p><strong>去掉环向一致性。<\/strong> 面片 next 指针按顺时针与逆时针混用：面遍历顶点序列出现折返，法向方向随面翻转；共享边两条半边方向不再相反，flip 后 next 走到邻接面的错误半边。<\/p>\n<p><strong>只存面片表不存邻接。<\/strong> 要算顶点 <span class=\"katex-inline\">v_i<\/span> 的 1-环邻域，遍历全部面片表，凡面片顶点含 <span class=\"katex-inline\">v_i<\/span> 就提取其余顶点；<span class=\"katex-inline\">F<\/span> 个面片、平均 <span class=\"katex-inline\">k<\/span> 顶点，单次查询 <span class=\"katex-inline\">O(Fk)<\/span>。半边结构对应 <span class=\"katex-inline\">O(d)<\/span>，<span class=\"katex-inline\">d<\/span> 为度数。规模大时差距显著，这也是几何处理系统普遍采用半边或翼边结构的原因。<\/p>\n<p><strong>把流形与网格质量混为一谈。<\/strong> 细长三角形组成的网格只要边邻接两面、扇面单一，拓扑合格；钝角接近 <span class=\"katex-inline\">180^\\circ<\/span> 的三角形会让后续余切权重趋于零、曲率估计不稳。拓扑修复与几何质量修复是两条独立工序。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n卡在&quot;半边为什么要拆成两条&quot;：回到第二步。一条无向边两侧各有一个面，每个面需要自己的环向指针；一条边存一份方向无法同时服务两个面的环向遍历，所以拆成方向相反的两条。\n<\/li><li>\n卡在&quot;next 和 flip 怎么配合绕顶点&quot;：回到第五步。flip 负责离开当前面到相邻面，next 负责在新面里找到从同一顶点出发的下一条边；两个动作交替一次，扇面前进一格。\n<\/li><li>\n卡在&quot;流形条件和数据结构谁先谁后&quot;：回到第七步。先有拓扑判别，再建指针；非流形网格强行套标准半边结构，指针配对这一步就过不去。\n<\/li><li>\n卡在&quot;边界半边怎么办&quot;：边界边只邻接一个面，另一半边的 <code>face<\/code> 记 NULL；绕边界顶点时开放扇面走到边界半边即终止，不要求闭合。\n<\/li><li>\n卡在&quot;欧拉示性数有什么用&quot;：算例一第 5 步用 <span class=\"katex-inline\">V-E+F=2<\/span> 核对封闭网格拓扑；开放圆盘网格该值为 1，带孔洞或亏格更高的网格取其他值，可作为建完结构后的自洽检查。\n<\/ul>\n<h2>补充辨析：半边结构与其他邻接存储方式的对照<\/h2>\n<ul><li>\n<strong>翼边结构<\/strong>：每条边存左右两个顶点、左右两条相邻边，指针数量多于半边；边本身带方向语义，遍历规则依赖翼边配对。半边把方向语义拆到两条半边上，每条半边只挂一个面、一条 next、一条 flip，职责更单一。\n<\/li><li>\n<strong>邻接表直接存面列表<\/strong>：每个顶点挂邻接面片索引数组，内存紧凑，但面片合并、边折叠等拓扑编辑要重排数组；半边结构改指针即可完成局部编辑，代价是每条边两份存储。\n<\/li><li>\n<strong>角结构（corner）<\/strong>：把面片顶点作为独立角记录，角上挂邻角指针；与半边视角等价但以面片顶点为索引单位，参数化与纹理坐标常挂在角上。\n<p>三种方式回答同一个问题：给定一个面或顶点，怎样常数步找到相邻对象。选择取决于编辑频率、内存预算与遍历口径。<\/p>\n<\/ul>\n<h2>边界网格遍历的补充规则<\/h2>\n<p>开放网格绕边界顶点时，扇面不是闭合环：从一条边界半边出发，沿 flip/next 走到另一条边界半边终止。实现遍历要记录起点半边，遇到 <code>face<\/code> 为 NULL 的半边判断它是否为边界出口；边界半边的对偶半边可能不存在或标记为空，不能再做 flip 跳转。封闭网格遍历回到起点即停，开放网格遍历遇到边界出口即停，两条终止规则不能混用。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出半边四类必选指针各自指向什么对象，说明 <code>prev<\/code> 为什么可以省略。\n<\/li><li>\n一个三角网格有 <span class=\"katex-inline\">V<\/span> 个顶点、<span class=\"katex-inline\">E<\/span> 条边、<span class=\"katex-inline\">F<\/span> 个三角形，半边总数是多少？每个顶点度数之和与 <span class=\"katex-inline\">E<\/span> 是什么关系？\n<\/li><li>\n举出两种非流形情形，并说明半边遍历分别在哪一步断裂。\n<\/li><li>\n面片顶点顺序写反属于哪一类问题？它影响法向还是影响边邻接数？\n<\/li><li>\n顶点 1-环邻域遍历的复杂度由哪个量决定？为什么与网格总面片数无关？\n<\/li><li>\n封闭四面体与开放圆盘网格的欧拉示性数各是多少？这个量能检查什么？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "多边形网格、流形条件与半边数据结构"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.29<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">多边形网格、流形条件与半边数据结构<\/a><\/span><\/div><h1>离散曲率与 Laplace–Beltrami 算子：余切权格式、平均曲率法向与高斯曲率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch01（原书 §1.3，PDF 第 27–32 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在三角网格的 1-环邻域上，以邻域面积归一化的余切权求和逼近连续曲面的 Laplace–Beltrami 算子，其向量结果即平均曲率法向；高斯曲率由顶点顶角亏损 <span class=\"katex-inline\">2\\pi-\\sum\\theta_f<\/span> 除以邻域面积得到，两者再由主曲率关系反解 <span class=\"katex-inline\">k_1,k_2<\/span>。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>连续微分几何把曲率定义在光滑可导曲面上：切平面、法向、法截线曲率、主曲率方向都依赖连续参数化与极限过程。网格曲面只在面片内连续可导，顶点处不存在唯一切平面，不能直接套连续公式算导数。若直接取邻点坐标平均当作曲率，得到的只是位置平均，丢掉了弯曲方向与角度信息；在细长三角形上，邻点等权平均会把斜边方向的影响放大，法向被拉偏。<\/p>\n<p>工程上需要在离散网格上回答一组问题：顶点朝哪个方向弯（平均曲率法向）、弯得多厉害（平均曲率大小）、局部是凸凹还是鞍状（高斯曲率符号）、两个主曲率方向落在哪。这些量是光顺去噪、特征检测、参数化扭曲度量、形变 Laplace 坐标的输入。没有一套口径一致的离散算子，后续能量函数的数值性质（非线性程度、收敛性）就无法讨论。<\/p>\n<p>原书参照 Meyer 等 (2003) 的思路：把网格视为光滑曲面的分片逼近，顶点几何属性定义为邻近有限面积区域上的空间平均；在非退化等假设下，随局部采样密度增大，这些平均收敛到连续定义。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>连续量回顾<\/strong>：光滑曲面 <span class=\"katex-inline\">S\\subset\\mathbb R^3<\/span> 上一点，所有过该点曲线的切向量张成二维切平面，其法向为 <span class=\"katex-inline\">\\mathbf n<\/span>。过法向的平面与曲面交出法截线，法曲率为密切圆半径倒数。法曲率的极大、极小值为主曲率 <span class=\"katex-inline\">k_1,k_2<\/span>，对应主方向正交。平均曲率 <span class=\"katex-inline\">H=(k_1+k_2)/2<\/span>，高斯曲率 <span class=\"katex-inline\">K=k_1k_2<\/span>。欧拉公式：<span class=\"katex-inline\">k_N(\\theta)=k_1\\cos^2\\theta+k_2\\sin^2\\theta<\/span>。<\/p>\n<p><strong>离散邻域<\/strong>：取顶点 <span class=\"katex-inline\">v_i<\/span> 周围有限面积区域 <span class=\"katex-inline\">\\Omega_i<\/span>，边界分段线性、穿过网格边中点。两类实现：Voronoi 元胞边界边垂直穿过网格边中点；重心元胞角点取所在三角形重心。面积记 <span class=\"katex-inline\">A_i<\/span>。<\/p>\n<p><strong>余切权 Laplace–Beltrami 格式<\/strong>：<\/p>\n<div class=\"katex-block\">\\int_{\\Omega_i}\\Delta z\\,dA=\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(z_j-z_i)<\/div>\n<p><span class=\"katex-inline\">N(i)<\/span> 为 1-环邻接顶点集；<span class=\"katex-inline\">\\alpha_{ij},\\beta_{ij}<\/span> 是共享边 <span class=\"katex-inline\">(i,j)<\/span> 的两个三角形在对侧顶点处的对顶角。<\/p>\n<p><strong>平均曲率法向<\/strong>：<\/p>\n<div class=\"katex-block\">H(v_i)\\mathbf n_i=-\\frac{1}{2A_i}\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(v_j-v_i)<\/div>\n<p>向量方向落在邻接面法向张成的线性空间内；其长度对应平均曲率大小。<\/p>\n<p><strong>离散高斯曲率<\/strong>：<\/p>\n<div class=\"katex-block\">K_G(v_i)=\\frac{2\\pi-\\sum_{f\\in N(i)}\\theta_f}{A_i}<\/div>\n<p><span class=\"katex-inline\">\\theta_f<\/span> 为面片 <span class=\"katex-inline\">f<\/span> 在顶点 <span class=\"katex-inline\">v_i<\/span> 的顶角；分子是角度亏损，周边面片顶角之和与 <span class=\"katex-inline\">2\\pi<\/span> 的差。<\/p>\n<p><strong>主曲率反解<\/strong>：由离散 <span class=\"katex-inline\">H,K<\/span> 得 <span class=\"katex-inline\">k_{1,2}(v_i)=H(v_i)\\pm\\sqrt{H(v_i)^2-K_G(v_i)}<\/span>。曲率张量可写成对称矩阵 <span class=\"katex-inline\">\\begin{pmatrix}a&amp;b\\\\b&amp;c\\end{pmatrix}<\/span>，其特征向量即主曲率方向。<\/p>\n<p><strong>正例<\/strong>：平坦平面网格，邻点共面，余切权求和向量为零，<span class=\"katex-inline\">H=0<\/span>，顶角和为 <span class=\"katex-inline\">2\\pi<\/span>，<span class=\"katex-inline\">K_G=0<\/span>。<\/p>\n<p><strong>反例<\/strong>：顶点邻域出现钝角接近 <span class=\"katex-inline\">\\pi<\/span> 的三角形，对顶角余切趋于零甚至为负，权重失去正定性；退化小三角形使 <span class=\"katex-inline\">A_i\\to0<\/span>，曲率放大。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>从连续算子到面积分<\/strong>：Laplace–Beltrami 算子是平面 Laplace 算子向流形的推广。取共形参数 <span class=\"katex-inline\">(u,v)<\/span>，局部度量下 <span class=\"katex-inline\">\\Delta=\\partial_{uu}+\\partial_{vv}<\/span>。对函数 <span class=\"katex-inline\">z<\/span>，在邻域 <span class=\"katex-inline\">\\Omega_i<\/span> 上做面积分 <span class=\"katex-inline\">\\int_{\\Omega_i}\\Delta z\\,dA<\/span>。<\/p>\n<p><strong>高斯定理降维<\/strong>：由高斯定理，二维区域上的散度面积分化为区域边界周线积分。网格上 <span class=\"katex-inline\">\\Omega_i<\/span> 边界沿 1-环邻域边中点走，每条共享边 <span class=\"katex-inline\">(i,j)<\/span> 的边界段贡献该边两侧三角形的角度权重。三角形内边 <span class=\"katex-inline\">(i,j)<\/span> 对顶点 <span class=\"katex-inline\">i<\/span> 的贡献系数由对顶角余切给出：<span class=\"katex-inline\">\\cot\\alpha_{ij}+\\cot\\beta_{ij}<\/span>。<\/p>\n<p><strong>逐边合并<\/strong>：把所有邻接边贡献相加，得到 <span class=\"katex-inline\">\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(z_j-z_i)<\/span>。除以 <span class=\"katex-inline\">A_i<\/span> 得逐点算子；向量形式代入 <span class=\"katex-inline\">z=v<\/span>（顶点坐标），得到平均曲率法向。<\/p>\n<p><strong>高斯–博内定理离散化<\/strong>：连续高斯曲率在曲面上的积分与欧拉示性数相连。局部应用到顶点邻域：邻域内高斯曲率积分等于 <span class=\"katex-inline\">2\\pi<\/span> 减去周边顶角之和（边界外角按零计）。除以元胞面积 <span class=\"katex-inline\">A_i<\/span> 得离散 <span class=\"katex-inline\">K_G<\/span>。<\/p>\n<p><strong>主曲率还原<\/strong>：<span class=\"katex-inline\">H=(k_1+k_2)/2<\/span>，<span class=\"katex-inline\">K=k_1k_2<\/span>，<span class=\"katex-inline\">k_1,k_2<\/span> 是二次方程 <span class=\"katex-inline\">k^2-2Hk+K=0<\/span> 的两根，判别式 <span class=\"katex-inline\">H^2-K<\/span>。判别式为负时数值上说明离散估计不稳，需要先修网格质量。<\/p>\n<p><strong>曲率张量拟合<\/strong>：1-环各边方向法曲率 <span class=\"katex-inline\">d_{ij}<\/span> 与投影边方向 <span class=\"katex-inline\">dg_{ij}<\/span> 构成加权最小二乘：<span class=\"katex-inline\">\\min\\sum w_{ij}(dg_{ij}-d_{ij})^2<\/span>，约束张量对称且满足 <span class=\"katex-inline\">ac-b^2=K<\/span>；解出张量后特征向量给出主方向。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：网格是光滑曲面的分片逼近；邻域非退化（三角形面积不趋零）；顶点邻接面片构成单一扇面；采样密度足够使空间平均收敛到连续量。\n<\/li><li>\n边界 1：余切权在钝角三角形上可能为负，格式不再是正权平均；大钝角区域要先重网格化改善三角形形状。\n<\/li><li>\n边界 2：Voronoi 元胞在非 Delaunay 网格上可能溢出三角形边界，重心元胞作为兜底；两类元胞面积口径不同，比较曲率前要固定一种。\n<\/li><li>\n边界 3：离散曲率是空间平均量，不是连续极限本身；粗网格上 <span class=\"katex-inline\">H,K<\/span> 只作近似，收敛性依赖细化假设。\n<\/li><li>\n失败案例：尖点或折痕网格上，曲面本身不光滑，平均曲率法向在折痕两侧方向冲突，离散结果只代表邻域折中，不能当作唯一法向。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>平均曲率法向 vs 面法向平均<\/strong>：面法向平均是邻接面单位法向的算术平均，方向粗略；平均曲率法向带余切权与面积归一化，是 Laplace 向量，量级与曲率相关。两者方向常接近，含义不同。\n<\/li><li>\n<strong>高斯曲率 vs 平均曲率<\/strong>：<span class=\"katex-inline\">K=k_1k_2<\/span> 刻画局部凸凹/鞍状拓扑性质，离散上表现为角度亏损；<span class=\"katex-inline\">H=(k_1+k_2)/2<\/span> 刻画弯曲均值，离散上表现为余切权 Laplace 向量。平面上二者都为零，柱面上 <span class=\"katex-inline\">K=0<\/span> 而 <span class=\"katex-inline\">H\\neq0<\/span>。\n<\/li><li>\n<strong>余切权格式 vs 均匀权 Laplace<\/strong>：均匀权取邻点算术平均，等价于把邻域当成各向同性圆盘；余切权按三角形角度分配权重，几何上对应连续 Laplace 算子的离散化。收敛性证明只对余切权格式成立。\n<\/li><li>\n<strong>离散曲率 vs 曲率张量拟合<\/strong>：标量 <span class=\"katex-inline\">H,K<\/span> 由邻域直接求和得到；张量方法逐边拟合各方向法曲率，能输出主方向，代价是解一个小最小二乘系统。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 提供 1-环邻域 <span class=\"katex-inline\">N(i)<\/span> 与半边遍历；线性代数中的向量叉积、协方差矩阵是法向与张量拟合的计算工具。后继：c05 光顺沿平均曲率法向滤波；c08 形变把 Laplace 坐标当作平均曲率法向的离散近似，在局部标架内保持其朝向；c09 形状描述子使用曲率与法向分布作为特征。本概念把连续微分几何接进离散网格，是全书几何量计算的枢纽。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（离散曲率与 Laplace–Beltrami 算子：余切权格式、平均曲率法向与高斯曲率）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：从连续曲率到余切权离散格式的依赖链、逐项算例与边界复盘<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把离散曲率算子往回追五层，每层写清上游缺口：<\/p>\n<ol><li>\n<strong>连续微分几何定义<\/strong>：切平面、法向、法截线、主曲率、<span class=\"katex-inline\">H<\/span> 与 <span class=\"katex-inline\">K<\/span> 的连续公式。没有连续参照，离散格式没有逼近目标，也谈不上收敛。\n<\/li><li>\n<strong>分片逼近假设<\/strong>：网格被视为光滑曲面的分片逼近，顶点属性用邻域空间平均代替逐点导数。这一步把&quot;极限导数&quot;换成&quot;有限区域平均&quot;。\n<\/li><li>\n<strong>邻域元胞构造<\/strong>：Voronoi 元胞或重心元胞给出平均区域 <span class=\"katex-inline\">\\Omega_i<\/span> 与面积 <span class=\"katex-inline\">A_i<\/span>；元胞边界穿过边中点，是面积分与边界积分的几何口径。\n<\/li><li>\n<strong>散度/高斯定理离散化<\/strong>：连续面积分借高斯定理降为边界周线积分，落到每条共享边上，产生对顶角余切权重。\n<\/li><li>\n<strong>离散算子与主曲率还原<\/strong>：余切权求和构成 Laplace–Beltrami 离散格式，向量结果为平均曲率法向；角度亏损除以面积得高斯曲率；二者二次方程反解 <span class=\"katex-inline\">k_1,k_2<\/span>，张量拟合给出主方向。\n<\/ol>\n<p>依赖链方向：连续曲率定义 → 分片逼近与邻域平均 → 元胞面积 → 高斯定理边权 → 离散 <span class=\"katex-inline\">H,K<\/span> 算子 → 主曲率与方向。<\/p>\n<h2>正向推导：连续量怎样一步一步落到网格上<\/h2>\n<p><strong>第一步，连续曲面局部量。<\/strong> 曲面 <span class=\"katex-inline\">S\\subset\\mathbb R^3<\/span>，点 <span class=\"katex-inline\">p<\/span> 处切空间由两条不共线切向量张成，法向 <span class=\"katex-inline\">\\mathbf n<\/span> 垂直切空间。法平面与曲面交成法截线，法曲率 <span class=\"katex-inline\">k_N<\/span> 为密切圆半径倒数。两个极值主曲率 <span class=\"katex-inline\">k_1,k_2<\/span> 对应正交主方向；欧拉公式 <span class=\"katex-inline\">k_N(\\theta)=k_1\\cos^2\\theta+k_2\\sin^2\\theta<\/span>。平均曲率 <span class=\"katex-inline\">H=(k_1+k_2)/2<\/span>，高斯曲率 <span class=\"katex-inline\">K=k_1k_2<\/span>。<\/p>\n<p><strong>第二步，分片逼近立场。<\/strong> 网格只在面片内连续可导，顶点处无唯一切面。假定网格逼近一张光滑曲面，把顶点 <span class=\"katex-inline\">v_i<\/span> 的几何属性定义为邻域 <span class=\"katex-inline\">\\Omega_i<\/span> 上相应属性的平均；非退化假设下，采样密度增大时平均收敛到连续值。<\/p>\n<p><strong>第三步，元胞选择。<\/strong> <span class=\"katex-inline\">\\Omega_i<\/span> 边界分段线性并穿过边中点。Voronoi 元胞边界边垂直平分共享边；重心元胞角点取三角形重心。面积 <span class=\"katex-inline\">A_i<\/span> 为元胞在三维空间的面积，不是投影到平面的面积。<\/p>\n<p><strong>第四步，Laplace–Beltrami 算子定位。<\/strong> 平均曲率算子本质是从平面 Laplace 推广到流形的 Laplace–Beltrami 算子。共形参数 <span class=\"katex-inline\">(u,v)<\/span> 下局部 <span class=\"katex-inline\">\\Delta=\\partial_{uu}+\\partial_{vv}<\/span>。对函数 <span class=\"katex-inline\">z<\/span> 写邻域面积分 <span class=\"katex-inline\">\\int_{\\Omega_i}\\Delta z\\,dA<\/span>。<\/p>\n<p><strong>第五步，高斯定理降维。<\/strong> 二维散度定理把区域面积分化为边界周线积分。网格元胞边界沿 1-环邻域边中点行走，每条共享边 <span class=\"katex-inline\">(i,j)<\/span> 对应一段边界；该段在两个邻接三角形内分别贡献角度因子。<\/p>\n<p><strong>第六步，余切权重出现。<\/strong> 三角形内边 <span class=\"katex-inline\">(i,j)<\/span> 对顶点 <span class=\"katex-inline\">i<\/span> 的边贡献系数，由该边对侧顶角 <span class=\"katex-inline\">\\alpha_{ij}<\/span> 的余切给出；共享边两侧三角形各贡献一个，合计 <span class=\"katex-inline\">\\cot\\alpha_{ij}+\\cot\\beta_{ij}<\/span>。权重只与三角形角度有关，与边长无关。<\/p>\n<p><strong>第七步，离散求和格式。<\/strong> 合并邻接边贡献：<\/p>\n<div class=\"katex-block\">\\int_{\\Omega_i}\\Delta z\\,dA=\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(z_j-z_i)<\/div>\n<p><span class=\"katex-inline\">N(i)<\/span> 为 1-环邻接顶点集。除以 <span class=\"katex-inline\">A_i<\/span> 得到逐点归一化算子。<\/p>\n<p><strong>第八步，平均曲率法向。<\/strong> 把 <span class=\"katex-inline\">z<\/span> 换成顶点坐标向量 <span class=\"katex-inline\">v<\/span>，代入得：<\/p>\n<div class=\"katex-block\">H(v_i)\\mathbf n_i=-\\frac{1}{2A_i}\\sum_{j\\in N(i)}(\\cot\\alpha_{ij}+\\cot\\beta_{ij})(v_j-v_i)<\/div>\n<p>负号对应 Laplace 算子的曲面约定；向量方向在邻接面法向张成空间内，长度为 <span class=\"katex-inline\">|H|<\/span> 量级。<\/p>\n<p><strong>第九步，离散高斯曲率。<\/strong> 高斯–博内定理局部形式：邻域上高斯曲率积分等于 <span class=\"katex-inline\">2\\pi<\/span> 减去周边顶角之和。离散化：<\/p>\n<div class=\"katex-block\">K_G(v_i)=\\frac{2\\pi-\\sum_{f\\in N(i)}\\theta_f}{A_i}<\/div>\n<p><span class=\"katex-inline\">\\theta_f<\/span> 为面片 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">v_i<\/span> 的顶角。内部顶点周边顶角和趋近 <span class=\"katex-inline\">2\\pi<\/span> 时 <span class=\"katex-inline\">K_G\\to0<\/span>；角亏损为正对应凸起，为负对应鞍状。<\/p>\n<p><strong>第十步，主曲率反解。<\/strong> 由 <span class=\"katex-inline\">H,K<\/span> 解 <span class=\"katex-inline\">k^2-2Hk+K=0<\/span>：<span class=\"katex-inline\">k_{1,2}=H\\pm\\sqrt{H^2-K}<\/span>。曲率张量对称矩阵 <span class=\"katex-inline\">\\begin{pmatrix}a&amp;b\\\\b&amp;c\\end{pmatrix}<\/span> 的特征值对应主曲率，特征向量对应主方向。<\/p>\n<h2>数值算例一：平坦网格上的余切权逐项核算<\/h2>\n<p>取两个共边等边三角形：顶点 <span class=\"katex-inline\">v_1=(0,0,0)<\/span>，<span class=\"katex-inline\">v_2=(1,0,0)<\/span>，<span class=\"katex-inline\">v_3=(1/2,\\sqrt3/2,0)<\/span>，<span class=\"katex-inline\">v_4=(1/2,-\\sqrt3/2,0)<\/span>。边 <span class=\"katex-inline\">(1,2)<\/span> 被三角形 <span class=\"katex-inline\">(1,2,3)<\/span> 与 <span class=\"katex-inline\">(1,4,2)<\/span> 共享。<\/p>\n<ol><li>\n角度：四个三角形边角均为 <span class=\"katex-inline\">60^\\circ<\/span>，<span class=\"katex-inline\">\\cot60^\\circ=1/\\sqrt3\\approx0.577<\/span>。\n<\/li><li>\n边 <span class=\"katex-inline\">(1,j)<\/span> 权重：共享边两侧对顶角各 <span class=\"katex-inline\">60^\\circ<\/span>，<span class=\"katex-inline\">w_{1j}=\\cot60^\\circ+\\cot60^\\circ=2/\\sqrt3\\approx1.155<\/span>。\n<\/li><li>\nLaplace 向量：<span class=\"katex-inline\">v_2-v_1=(1,0,0)<\/span>，<span class=\"katex-inline\">v_3-v_1=(1/2,\\sqrt3/2,0)<\/span>，<span class=\"katex-inline\">v_4-v_1=(1/2,-\\sqrt3/2,0)<\/span>。邻接求和：\n<\/ol>\n<div class=\"katex-block\">w_{12}(v_2-v_1)+w_{13}(v_3-v_1)+w_{14}(v_4-v_1)<\/div>\n<p><span class=\"katex-inline\">y<\/span> 分量：<span class=\"katex-inline\">w({\\sqrt3}/{2})+w({-\\sqrt3}/{2})=0<\/span>；<span class=\"katex-inline\">x<\/span> 分量：<span class=\"katex-inline\">w\\cdot1+w\\cdot1/2+w\\cdot1/2=2w\\neq0<\/span>，但平面上 <span class=\"katex-inline\">v_1<\/span> 位于边界，邻域不是闭合 1-环，边界顶点格式需按开放邻域处理。<\/p>\n<ol><li>\n取内部顶点 <span class=\"katex-inline\">v_3<\/span> 核对平坦性：三条邻边向量在平面内闭合，等角度权重下邻点位置加权和与顶点一致，Laplace 向量为零，<span class=\"katex-inline\">H=0<\/span>。\n<\/li><li>\n高斯曲率：平坦网格内部顶点周边三个 <span class=\"katex-inline\">60^\\circ<\/span> 顶角和为 <span class=\"katex-inline\">\\pi<\/span>（等边三角扇在平面内铺不满 <span class=\"katex-inline\">2\\pi<\/span>，实际平面网格内部顶点通常由六个等边三角形围绕，顶角和 <span class=\"katex-inline\">6\\times60^\\circ=2\\pi<\/span>），角亏损为零，<span class=\"katex-inline\">K_G=0<\/span>。\n<\/ol>\n<h2>数值算例二：球冠顶点的角度亏损与主曲率反解<\/h2>\n<p>取单位球面上一个顶点 <span class=\"katex-inline\">v_i<\/span>，周围 <span class=\"katex-inline\">m<\/span> 个三角形，每个顶角 <span class=\"katex-inline\">\\theta_f=60^\\circ<\/span>，<span class=\"katex-inline\">m=5<\/span>（球冠顶部收缩，五个三角形围绕）。元胞面积 <span class=\"katex-inline\">A_i<\/span> 取邻域投影面积近似 <span class=\"katex-inline\">A_i=0.5<\/span>（平方单位）。<\/p>\n<ol><li>\n顶角和：<span class=\"katex-inline\">\\sum\\theta_f=5\\times60^\\circ=300^\\circ=5\\pi/3<\/span>。\n<\/li><li>\n角度亏损：<span class=\"katex-inline\">2\\pi-5\\pi/3=\\pi/3\\approx1.047<\/span>。\n<\/li><li>\n离散高斯曲率：<span class=\"katex-inline\">K_G=(\\pi/3)/0.5=2\\pi/3\\approx2.094<\/span>。单位球面连续值 <span class=\"katex-inline\">K=1<\/span>，离散估值在粗网格上偏大，符合空间平均的近似性质。\n<\/li><li>\n平均曲率法向：设余切权求和后向量长度估算为 <span class=\"katex-inline\">|H\\mathbf n|=1.2<\/span>，邻域 <span class=\"katex-inline\">A_i=0.5<\/span>，由格式 <span class=\"katex-inline\">|H\\mathbf n|=|2H|<\/span> 口径得 <span class=\"katex-inline\">H\\approx0.6<\/span>（单位球面连续 <span class=\"katex-inline\">H=1<\/span>）。\n<\/li><li>\n主曲率反解：<span class=\"katex-inline\">H^2-K=0.36-2.094&amp;lt;0<\/span>，判别式为负。这说明粗网格离散估计内部不一致：<span class=\"katex-inline\">K<\/span> 估值偏大。处理方式是细化邻域或换重心元胞口径；不能在判别式为负时硬开方取主曲率。\n<\/li><li>\n对照自洽情形：若 <span class=\"katex-inline\">H=1<\/span>，<span class=\"katex-inline\">K=1<\/span>，则 <span class=\"katex-inline\">H^2-K=0<\/span>，<span class=\"katex-inline\">k_1=k_2=1<\/span>，对应球面两个主曲率相等。\n<\/ol>\n<h2>补充推演：曲率张量的加权最小二乘<\/h2>\n<ol><li>\n边方向投影：<span class=\"katex-inline\">dg_{ij}<\/span> 为边 <span class=\"katex-inline\">(i,j)<\/span> 在切平面上的投影方向，<span class=\"katex-inline\">d_{ij}<\/span> 为该方向近似法曲率。\n<\/li><li>\n张量 <span class=\"katex-inline\">\\mathbf T=\\begin{pmatrix}a&amp;b\\\\b&amp;c\\end{pmatrix}<\/span>，边方向单位向量 <span class=\"katex-inline\">\\mathbf e<\/span>，预测法曲率 <span class=\"katex-inline\">\\mathbf e^\\top\\mathbf T\\mathbf e<\/span>。\n<\/li><li>\n目标：<span class=\"katex-inline\">\\min\\sum_{j\\in N(i)}w_{ij}(\\mathbf e_{ij}^\\top\\mathbf T\\mathbf e_{ij}-d_{ij})^2<\/span>，权重 <span class=\"katex-inline\">w_{ij}=(\\cot\\alpha_{ij}+\\cot\\beta_{ij})/A_i<\/span>。\n<\/li><li>\n约束：<span class=\"katex-inline\">ac-b^2=K_G<\/span>，保证张量行列式与高斯曲率一致。\n<\/li><li>\n解出 <span class=\"katex-inline\">\\mathbf T<\/span> 后，两个特征值为主曲率，特征向量为主方向；欠定（邻接面少于三个）时用伪逆取最小范数解。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>钝角三角形使余切为负。<\/strong> 某三角形对顶角接近 <span class=\"katex-inline\">120^\\circ<\/span>，<span class=\"katex-inline\">\\cot120^\\circ=-1/\\sqrt3&amp;lt;0<\/span>，该边权重成为负权；Laplace 向量不再是邻点凸组合，平滑过程可能放大局部振荡。修复：先重网格化把钝角调小，或在格式中对负权做截断并记录失真区域。<\/p>\n<p><strong>退化小三角形使面积趋零。<\/strong> <span class=\"katex-inline\">A_i\\to0<\/span> 时除以 <span class=\"katex-inline\">A_i<\/span> 的 <span class=\"katex-inline\">H,K<\/span> 同时放大；顶点坐标微小抖动被面积分母放大成大曲率尖峰。修复：剔除退化面片、合并短边，再跑算子。<\/p>\n<p><strong>把面法向平均当平均曲率法向。<\/strong> 邻接面法向算术平均不除面积、不带余切权；在大三角形与小三角形混杂的网格上，大三角形法向被等权对待，方向偏到大三角形平面上。两种量混用会让光顺步长方向选错。<\/p>\n<p><strong>在折痕顶点强行算主曲率方向。<\/strong> 折痕两侧切面不连续，主方向不存在唯一解；离散张量拟合得到的两个方向是两侧折中。工程上应先识别特征线，把折痕顶点从平滑曲率统计中单独列出。<\/p>\n<p><strong>元胞口径混用。<\/strong> 同一张网格上一部分顶点用 Voronoi 元胞、一部分用重心元胞，<span class=\"katex-inline\">A_i<\/span> 口径不一致，<span class=\"katex-inline\">H,K<\/span> 横向比较时引入系统偏差。整张网格要固定一种元胞。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n卡在&quot;余切权重为什么是角度而不是边长&quot;：回到第六步。高斯定理边界贡献来自三角形边的角度几何；边长通过元胞面积 <span class=\"katex-inline\">A_i<\/span> 归一化进入分母，边权本身只留角度因子。\n<\/li><li>\n
