卡在&quot;平均曲率法向的负号从哪来&quot;：回到第八步。Laplace 算子约定下，曲面平均曲率向量与 Laplace 向量差一个符号约定；原书格式写负号是与连续 <span class=\"katex-inline\">2H\\mathbf n<\/span> 对齐的口径，实现时要保持全书符号一致。\n<\/li><li>\n卡在&quot;高斯曲率为什么用角度亏损&quot;：回到第九步。高斯–博内定理把局部曲率积分与周边角联系起来；平面顶角和 <span class=\"katex-inline\">2\\pi<\/span> 无亏损，球面凸起顶角和小于 <span class=\"katex-inline\">2\\pi<\/span>，鞍状大于 <span class=\"katex-inline\">2\\pi<\/span>。\n<\/li><li>\n卡在&quot;判别式为负怎么办&quot;：回到算例二第 5 步。<span class=\"katex-inline\">H^2-K&amp;lt;0<\/span> 说明离散 <span class=\"katex-inline\">H,K<\/span> 估值不自洽，先修网格质量，不要强行开方。\n<\/li><li>\n卡在&quot;Voronoi 元胞溢出三角形怎么办&quot;：非 Delaunay 网格上 Voronoi 边界可能落到三角形外，改用重心元胞兜底；两种元胞都满足边界穿边中点的要求。\n<\/ul>\n<h2>补充展开一：单个三角形的角度与余切手算<\/h2>\n<p>三角形三顶点 <span class=\"katex-inline\">p_a,p_b,p_c<\/span>，边长 <span class=\"katex-inline\">l_a=|p_b-p_c|<\/span> 等。顶角 <span class=\"katex-inline\">\\theta_a<\/span> 对边 <span class=\"katex-inline\">l_a<\/span>，由余弦定理 <span class=\"katex-inline\">\\cos\\theta_a=(l_b^2+l_c^2-l_a^2)/(2l_bl_c)<\/span>，<span class=\"katex-inline\">\\sin\\theta_a<\/span> 由面积 <span class=\"katex-inline\">\\Delta=\\frac12|\\cdot|<\/span> 得 <span class=\"katex-inline\">\\sin\\theta_a=2\\Delta/(l_bl_c)<\/span>，于是 <span class=\"katex-inline\">\\cot\\theta_a=\\cos\\theta_a/\\sin\\theta_a=(l_b^2+l_c^2-l_a^2)/(4\\Delta)<\/span>。<\/p>\n<p>取等边三角形边长 1：<span class=\"katex-inline\">\\Delta=\\sqrt3/4<\/span>，<span class=\"katex-inline\">\\cos\\theta=1/2<\/span>，<span class=\"katex-inline\">\\sin\\theta=\\sqrt3/2<\/span>，<span class=\"katex-inline\">\\cot\\theta=1/\\sqrt3\\approx0.577<\/span>。取直角三角形直角边 1、1，斜边 <span class=\"katex-inline\">\\sqrt2<\/span>：锐角 <span class=\"katex-inline\">45^\\circ<\/span>，<span class=\"katex-inline\">\\cot45^\\circ=1<\/span>；直角 <span class=\"katex-inline\">90^\\circ<\/span>，<span class=\"katex-inline\">\\cot90^\\circ=0<\/span>，该边权重在直角顶点处不贡献。取钝角三角形边长 <span class=\"katex-inline\">2,2,3<\/span>：钝角对边 3，<span class=\"katex-inline\">\\cos\\theta=(4+4-9)/8=-1/8<\/span>，<span class=\"katex-inline\">\\sin\\theta&amp;gt;0<\/span>，<span class=\"katex-inline\">\\cot\\theta=-1/4\\div\\sin\\theta&amp;lt;0<\/span>，负权出现。<\/p>\n<h2>补充展开二：均匀权与余切权在细长三角形上的对照<\/h2>\n<p>设顶点 <span class=\"katex-inline\">i<\/span> 邻接两条边：一条来自等边三角形（对顶角 <span class=\"katex-inline\">60^\\circ<\/span>），一条来自细长三角形（对顶角接近 <span class=\"katex-inline\">170^\\circ<\/span>）。余切权：等边边 <span class=\"katex-inline\">\\cot60^\\circ\\approx0.577<\/span>，细长边 <span class=\"katex-inline\">\\cot170^\\circ\\approx-5.67<\/span>，细长边权重绝对值大且为负。均匀权把两条边都取 1：细长三角形被当作与等边三角形同等影响，其斜边方向把 Laplace 向量拉向细长边方向。<\/p>\n<p>几何含义：细长三角形对顶点邻域的贡献本应很小（角度扁平），余切权压低其正贡献或反映其负曲率倾向；均匀权抹掉角度差异。网格细化时余切权格式收敛到连续 Laplace–Beltrami 算子，均匀权不保证这个收敛性质。<\/p>\n<h2>补充展开三：收敛条件逐条落地<\/h2>\n<p>连续对应成立需要四条条件同时满足：<\/p>\n<ol><li>\n分片逼近：网格面片落在光滑曲面附近，不出现大的局部穿入穿出；\n<\/li><li>\n非退化：三角形面积不趋零，角度不趋 <span class=\"katex-inline\">0^\\circ<\/span> 或 <span class=\"katex-inline\">180^\\circ<\/span>；\n<\/li><li>\n采样密度：邻域尺寸随细化趋于零，元胞面积 <span class=\"katex-inline\">A_i<\/span> 同步缩小；\n<\/li><li>\n拓扑合格：邻接面片构成单一扇面，邻域是拓扑圆盘。\n<p>缺第 1 条，逼近对象本身不光滑，曲率无连续极限；缺第 2 条，权重与面积分母失稳；缺第 3 条，空间平均停在粗尺度；缺第 4 条，邻域积分口径不成立。<\/p>\n<\/ol>\n<h2>补充展开四：易错口径纠正<\/h2>\n<ul><li>\n把 <span class=\"katex-inline\">A_i<\/span> 当成三角形面积：<span class=\"katex-inline\">A_i<\/span> 是顶点元胞面积（Voronoi 或重心），不是单个三角形面积；多个三角形分摊到顶点元胞。\n<\/li><li>\n把 <span class=\"katex-inline\">H<\/span> 与 <span class=\"katex-inline\">K<\/span> 标量混作向量：<span class=\"katex-inline\">H\\mathbf n<\/span> 是向量，<span class=\"katex-inline\">H<\/span> 是其长度对应的平均曲率；<span class=\"katex-inline\">K<\/span> 是标量角度亏损密度。\n<\/li><li>\n把主曲率方向当成面法向：主方向在切平面内，法向垂直切平面，二者正交。\n<\/li><li>\n把离散曲率当精确值：粗网格上的 <span class=\"katex-inline\">H,K<\/span> 是邻域平均，误差随细化下降，不能与解析曲率逐点相等。\n<\/ul>\n<h2>补充展开五：与后续概念的衔接速查<\/h2>\n<ul><li>\nc05 光顺：沿 <span class=\"katex-inline\">H\\mathbf n<\/span> 方向移动顶点做曲率流式平滑；法向滤波另走面法向路线。\n<\/li><li>\nc08 形变：Laplace 坐标 <span class=\"katex-inline\">\\delta_i<\/span> 即平均曲率法向的离散近似；保刚性约束要求局部邻域只旋转不伸缩，系数 <span class=\"katex-inline\">\\beta_{ij}<\/span> 在形变中固定。\n<\/li><li>\nc09 描述子：曲率分布、法向直方图是全局/局部描述子的输入特征；曲率符号区分凸凹部件。\n<\/li><li>\nc04 重建：泊松法向场依赖点云法向估计，法向由局部切平面 PCA 给出，与网格面法向口径不同但思想相通。\n<\/ul>\n<h2>补充展开六：算例与角度数值复核<\/h2>\n<p>球冠算例中五个 <span class=\"katex-inline\">60^\\circ<\/span> 顶角和为 <span class=\"katex-inline\">300^\\circ<\/span>：<span class=\"katex-inline\">5\\times\\pi/3=5\\pi/3\\approx5.236<\/span>，<span class=\"katex-inline\">2\\pi\\approx6.283<\/span>，亏损 <span class=\"katex-inline\">\\pi/3\\approx1.047<\/span>，除以 <span class=\"katex-inline\">A_i=0.5<\/span> 得 <span class=\"katex-inline\">2.094<\/span>。若改为六个三角形围绕（平面铺张），顶角和 <span class=\"katex-inline\">2\\pi<\/span>，亏损为零；四个三角形围绕（更尖的冠），顶角和 <span class=\"katex-inline\">4\\pi/3<\/span>，亏损 <span class=\"katex-inline\">2\\pi/3<\/span>，<span class=\"katex-inline\">K_G<\/span> 估值更大，对应更尖的局部凸起。这套核对可在手绘三角扇上直接验算。<\/p>\n<h2>补充展开七：连续与离散口径的对照清单<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>连续概念<\/th><th>离散对应<\/th><th>离散输入<\/th><\/tr><\/thead><tbody><tr><td>切平面<\/td><td>邻接面法向张成空间<\/td><td>1-环三角形法向<\/td><\/tr><tr><td>法向 <span class=\"katex-inline\">\\mathbf n<\/span><\/td><td>平均曲率法向方向<\/td><td>余切权 Laplace 向量<\/td><\/tr><tr><td>平均曲率 <span class=\"katex-inline\">H<\/span><\/td><td>曲率法向长度除以口径因子<\/td><td>邻域坐标求和与 <span class=\"katex-inline\">A_i<\/span><\/td><\/tr><tr><td>高斯曲率 <span class=\"katex-inline\">K<\/span><\/td><td>角度亏损除以 <span class=\"katex-inline\">A_i<\/span><\/td><td>周边顶角 <span class=\"katex-inline\">\\theta_f<\/span><\/td><\/tr><tr><td>主方向<\/td><td>曲率张量特征向量<\/td><td>边方向法曲率拟合<\/td><\/tr><tr><td>主曲率 <span class=\"katex-inline\">k_1,k_2<\/span><\/td><td>张量特征值 / <span class=\"katex-inline\">H,K<\/span> 反解<\/td><td>离散 <span class=\"katex-inline\">H,K<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>对照使用时注意：连续量定义在极限点上，离散量定义在元胞平均上；两者方向可对齐，数值在粗网格上不必相等。表格左列是逼近目标，右列是网格上可计算的量，中间桥梁是分片逼近与空间平均假设。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出余切权 Laplace 离散格式，说明 <span class=\"katex-inline\">\\alpha_{ij},\\beta_{ij},N(i),A_i<\/span> 各指什么。\n<\/li><li>\n离散高斯曲率的分子为什么是 <span class=\"katex-inline\">2\\pi-\\sum\\theta_f<\/span>？凸起与鞍状顶点的角亏损各是什么符号？\n<\/li><li>\n主曲率由 <span class=\"katex-inline\">H,K<\/span> 怎样反解？判别式为负时说明什么？\n<\/li><li>\n钝角三角形怎样影响余切权重？负权会给平滑算子带来什么后果？\n<\/li><li>\n平均曲率法向与邻接面法向算术平均的差别落在哪几项上？\n<\/li><li>\n曲率张量最小二乘的目标函数与行列式约束分别是什么？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "离散曲率与 Laplace–Beltrami 算子：余切权格式、平均曲率法向与高斯曲率"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.44<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">多边形网格、流形条件与半边数据结构<\/a><\/span><\/div><h1>点云配准：粗配准（RANSAC、4PCS）与精配准（ICP、CPD）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch02（原书 §2.1，PDF 第 44–57 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>点云配准求解两片或多片点云之间的变换，使变换后点云与目标点云对齐：刚性配准估计旋转 <span class=\"katex-inline\">R<\/span> 与平移 <span class=\"katex-inline\">t<\/span> 最小化对应点欧氏距离平方和；粗配准在初值未知时采样一致性或共面四点不变量给近似变换，精配准以最近点对应或概率对应交替迭代逼近最优变换。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>三维扫描仪一次只能拍到物体的一个视角，得到的局部点云各自处于不同坐标系；多片点云之间存在平移错位与旋转错位，缺了配准，拼出来的模型在接缝处断开、重影或整体歪斜。配准是曲面重建与后续几何处理的前置环节：重建算法假设输入点云已经落在同一坐标系下。<\/p>\n<p>困难分两层。初值好的时候，两片点云位置接近，可以基于当前位置找对应点再估变换；初值未知时，两片点云可能间隔大半周，最近点对应完全是错的，直接迭代会陷进局部最小。工程上因此把流程分成粗配准与精配准两步：粗配准解决&quot;从完全未知到近似对齐&quot;，精配准解决&quot;在近似初值上收紧&quot;。<\/p>\n<p>另一类困难是非刚性场景：物体本身有变形，两片点云之间不是刚体关系。把刚性变换套到变形点云上，拉伸与弯曲会被误当成旋转平移，配准误差留在接缝里。这类场景需要局部仿射变换或拟刚体变形模型，配准误差与刚性正则项加权组合。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>刚性变换<\/strong>：<span class=\"katex-inline\">T=(R,t)<\/span>，<span class=\"katex-inline\">R<\/span> 为旋转矩阵（正交、行列式为 1），<span class=\"katex-inline\">t<\/span> 为平移向量。源点云 <span class=\"katex-inline\">X=\\{x_i\\}<\/span>，目标点云 <span class=\"katex-inline\">Y=\\{y_i\\}<\/span>。<\/p>\n<p><strong>刚性配准目标<\/strong>：<\/p>\n<div class=\"katex-block\">E(R,t)=\\sum_{i=1}^{N}\\|y_i-(Rx_i+t)\\|^2<\/div>\n<p><span class=\"katex-inline\">N<\/span> 为对应点对数；对应关系在求解前通常未知，需要先估计。<\/p>\n<p><strong>粗配准<\/strong>：位置关系完全未知时求近似 <span class=\"katex-inline\">(R,t)<\/span>。代表方法：<\/p>\n<ol><li>\nRANSAC（随机采样一致性）：用小采样集估计参数，扩大数据采样集，迭代产生最大一致性数据集，再用该集估算参数；内点为与模型变换一致的点，外点为不一致点。\n<\/li><li>\n4PCS（四点 congruent sets）：取源点云一组共面四点 <span class=\"katex-inline\">\\{a,b,c,d\\}<\/span>；刚性变换保持线段长度 <span class=\"katex-inline\">l_{ab},l_{cd}<\/span>、两线段夹角，以及交点比例 <span class=\"katex-inline\">m_1=|e-a|/|b-a|<\/span>、<span class=\"katex-inline\">m_2=|e-c|/|d-c|<\/span>。按长度与比例在目标点云筛候选点对，按夹角复核，再用近似最近邻统计重合度，选整体重合度最高的变换。\n<\/ol>\n<p><strong>精配准<\/strong>：已知较准初值后收紧。<\/p>\n<ol><li>\nICP（迭代最近点）：每步对当前变换后的源点云在目标点云找最近点组成对应集 <span class=\"katex-inline\">C<\/span>；基于对应集解最小二乘刚体变换；更新源点云，迭代到误差收敛。\n<\/li><li>\nCPD（相干点漂移）：把目标点云视为高斯混合模型（GMM）分量，源点云为观测；含噪声权重 <span class=\"katex-inline\">w<\/span> 的混合密度 <span class=\"katex-inline\">p(z)=w/N+(1-w)\\sum_m P(m)p(z|m)<\/span>；用 EM 算法：E 步算后验对应概率，M 步最小化对数似然更新高斯位置参数。\n<\/ol>\n<p><strong>非刚性配准<\/strong>：局部仿射变换 <span class=\"katex-inline\">T_i<\/span> 作用于局部；拟刚体变形能量 <span class=\"katex-inline\">E_{\\text{arap}}=\\sum w_{ij}\\|R_i(x_i-x_j)-(y_i-y_j)\\|^2<\/span>，约束邻域近似刚性；总能量为配准误差加刚性正则项加权和。<\/p>\n<p><strong>正例<\/strong>：两片同一刚性杯子的扫描点云，姿态差一个绕轴旋转，ICP 从粗配准初值出发几步收敛。<\/p>\n<p><strong>反例<\/strong>：同一布料拉伸前后的两片点云，刚性 ICP 把拉伸方向压成旋转，对应点错位；应走非刚性配准。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>刚性最小二乘的闭式结构<\/strong>：固定对应关系 <span class=\"katex-inline\">\\{(x_i,y_i)\\}<\/span>，目标函数对 <span class=\"katex-inline\">t<\/span> 求导。记质心 <span class=\"katex-inline\">\\bar x=\\frac1N\\sum x_i<\/span>，<span class=\"katex-inline\">\\bar y=\\frac1N\\sum y_i<\/span>。令 <span class=\"katex-inline\">t=\\bar y-R\\bar x<\/span> 可消去平移项；去质心后问题化为求 <span class=\"katex-inline\">R<\/span> 使 <span class=\"katex-inline\">\\sum\\|y_i-\\bar y-R(x_i-\\bar x)\\|^2<\/span> 最小。协方差矩阵 <span class=\"katex-inline\">H=\\sum(x_i-\\bar x)(y_i-\\bar y)^\\top<\/span>，SVD 分解 <span class=\"katex-inline\">H=U\\Sigma V^\\top<\/span>，最优旋转 <span class=\"katex-inline\">R=V\\mathrm{diag}(1,1,\\det(VU^\\top))U^\\top<\/span>，反射情形用行列式校正。<\/p>\n<p><strong>ICP 迭代收敛依据<\/strong>：固定对应时刚体最小二乘目标函数下降；固定刚体时最近点对应唯一确定，残差不增。每步误差单调不增，在初值落入收敛域时停在局部最小。<\/p>\n<p><strong>RANSAC 一致性逻辑<\/strong>：小采样集估计的变换把一部分点映射到目标附近（内点），远离的为外点；选内点集合最大的模型，再用内点重估参数。采样反复进行，概率上 eventually 抽到一组全内点样本。<\/p>\n<p><strong>4PCS 不变量逻辑<\/strong>：刚体保持距离与角度；两相交线段交点分线段的比例在相似与刚体变换下不变。先用长度 <span class=\"katex-inline\">l_{ab},l_{cd}<\/span> 在目标点云筛点对（<span class=\"katex-inline\">O(n^2)<\/span> 点对采样，避免 <span class=\"katex-inline\">O(n^4)<\/span> 四点枚举），再用比例与夹角复核，末了做重合度评分。<\/p>\n<p><strong>CPD 的 EM 结构<\/strong>：E 步按旧参数算后验 <span class=\"katex-inline\">P_{\\text{old}}(m|z_n)<\/span>；M 步固定后验权重，最小化 <span class=\"katex-inline\">\\sum_{n,m}P(m|z_n)\\|z_n-a_R y_m-t\\|^2<\/span> 更新参数。概率对应允许一个源点以权重分给多个目标点，比硬最近点对应更容忍噪声与缺失。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：刚性配准假设两片点云来自同一未变形刚体；有粗配准初值时 ICP 高效；点云有足够重叠区域供对应估计。\n<\/li><li>\n边界 1：ICP 初值偏差大时最近点对应错误，迭代停在局部最小；必须接粗配准结果。\n<\/li><li>\n边界 2：刚性模型不适用可变形物体；拉伸、弯曲需要非刚性配准，且正则权重控制邻域刚性程度。\n<\/li><li>\n边界 3：点云噪声大、缺失多时对应关系模糊；硬对应 ICP 敏感，CPD 概率对应更稳但计算更贵。\n<\/li><li>\n边界 4：4PCS 共面假设依赖四点近似共面；三维一般位置四点的不变量构造不同，重合度评分仍需 ANN 加速。\n<\/li><li>\n失败案例：两片点云重叠区域不足，内点比例低，RANSAC 抽到全内点样本的概率下降，粗配准失败。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>粗配准 vs 精配准<\/strong>：粗配准面向大姿态差，允许粗糙结果，追求全局不跑偏；精配准面向小偏差，追求精度与收敛。顺序不可颠倒：先精后粗在未知初值下没有可靠对应。\n<\/li><li>\n<strong>ICP 硬对应 vs CPD 概率对应<\/strong>：ICP 每点唯一最近点，对应关系硬；CPD 用 GMM 后验权重分配对应，允许软分配。噪声场景 CPD 更鲁棒，实现与迭代成本更高。\n<\/li><li>\n<strong>刚性配准 vs 非刚性配准<\/strong>：刚性只有一个 <span class=\"katex-inline\">(R,t)<\/span>；非刚性每个局部邻域带变换 <span class=\"katex-inline\">T_i<\/span> 或旋转 <span class=\"katex-inline\">R_i<\/span>，加正则项抑制局部自由变形。\n<\/li><li>\n<strong>配准 vs 重建<\/strong>：配准对齐多片点云到同一坐标系；重建从对齐后的点云构造网格。配准误差会被重建放大成接缝错误。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 网格邻接结构是配准后模型的载体；欧氏距离、SVD、质心与协方差是线性代数工具。后继：c04 重建使用配准后的完整点云；c05 光顺处理配准残留噪声；c08 形变中的局部旋转能量与非刚性配准的拟刚体项形式相通。配准处在本书&quot;扫描输入 → 网格管线&quot;的入口位置。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（点云配准：粗配准（RANSAC、4PCS）与精配准（ICP、CPD））<\/summary><div class=\"depth-body\"><h1>c03 深度推导：配准变换的闭式解、ICP 迭代推演与对应关系复盘<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把点云配准往回追四层：<\/p>\n<ol><li>\n<strong>对应关系<\/strong>：两片点云哪些点是同一表面位置，是配准的输入；对应未知时要先估计（最近点、概率后验或采样一致性）。\n<\/li><li>\n<strong>变换模型<\/strong>：刚性 <span class=\"katex-inline\">(R,t)<\/span> 还是非刚性局部变换；模型决定参数个数与正则项形式。\n<\/li><li>\n<strong>误差度量<\/strong>：对应点欧氏距离平方和（刚性最小二乘）或 GMM 对数似然（CPD）；度量定义了最优解的方向。\n<\/li><li>\n<strong>求解策略<\/strong>：粗配准采样估计全局初值，精配准交替优化对应与参数；交替结构要求每步固定一类变量、优化另一类。\n<\/ol>\n<p>依赖链方向：对应关系 → 变换模型 → 误差能量 → 交替迭代求解。上游是扫描点云与噪声模型，下游是重建网格。<\/p>\n<h2>正向推导：刚性配准闭式解逐步展开<\/h2>\n<p><strong>第一步，写能量。<\/strong> 固定对应集 <span class=\"katex-inline\">\\{(x_i,y_i)\\}_{i=1}^N<\/span>，<span class=\"katex-inline\">E(R,t)=\\sum_i\\|y_i-Rx_i-t\\|^2<\/span>，<span class=\"katex-inline\">R^\\top R=I<\/span>，<span class=\"katex-inline\">\\det R=1<\/span>。<\/p>\n<p><strong>第二步，消平移。<\/strong> 对 <span class=\"katex-inline\">t<\/span> 求偏导并令其为零：<span class=\"katex-inline\">\\sum_i(y_i-Rx_i-t)=0<\/span>，得 <span class=\"katex-inline\">t=\\bar y-R\\bar x<\/span>，其中 <span class=\"katex-inline\">\\bar x=\\frac1N\\sum x_i<\/span>，<span class=\"katex-inline\">\\bar y=\\frac1N\\sum y_i<\/span>。代入能量，平移项消去，剩余 <span class=\"katex-inline\">\\sum_i\\|(y_i-\\bar y)-R(x_i-\\bar x)\\|^2<\/span>。<\/p>\n<p><strong>第三步，展开平方范数。<\/strong> 记 <span class=\"katex-inline\">x_i&#x27;=x_i-\\bar x<\/span>，<span class=\"katex-inline\">y_i&#x27;=y_i-\\bar y<\/span>。展开：<\/p>\n<div class=\"katex-block\">\\sum_i\\|y_i'-Rx_i'\\|^2=\\sum_i\\|y_i'\\|^2+\\sum_i\\|Rx_i'\\|^2-2\\sum_i y_i'^\\top R x_i'<\/div>\n<p>旋转保范，<span class=\"katex-inline\">\\|Rx_i&#x27;\\|=\\|x_i&#x27;\\|<\/span>，前两项与 <span class=\"katex-inline\">R<\/span> 无关；最小化能量等价于最大化 <span class=\"katex-inline\">\\sum_i y_i&#x27;^\\top R x_i&#x27;=\\mathrm{tr}(R^\\top H)<\/span>，其中 <span class=\"katex-inline\">H=\\sum_i x_i&#x27;y_i&#x27;^\\top<\/span>。<\/p>\n<p><strong>第四步，SVD 求旋转。<\/strong> 分解 <span class=\"katex-inline\">H=U\\Sigma V^\\top<\/span>。最大化 <span class=\"katex-inline\">\\mathrm{tr}(R^\\top H)<\/span> 的正交矩阵为 <span class=\"katex-inline\">R=VU^\\top<\/span>；若 <span class=\"katex-inline\">\\det(VU^\\top)=-1<\/span>（解出反射），用 <span class=\"katex-inline\">D=\\mathrm{diag}(1,1,-1)<\/span> 校正 <span class=\"katex-inline\">R=VDU^\\top<\/span>，保证行列式为 1。<\/p>\n<p><strong>第五步，回代平移。<\/strong> <span class=\"katex-inline\">t=\\bar y-R\\bar x<\/span>，得到完整刚性变换 <span class=\"katex-inline\">(R,t)<\/span>。<\/p>\n<p><strong>第六步，ICP 交替结构。<\/strong> 初值 <span class=\"katex-inline\">(R_0,t_0)<\/span>：<\/p>\n<ol><li>\n对应步：<span class=\"katex-inline\">C_k=\\{c_i=\\arg\\min_{y\\in Y}\\|y-(R_kx_i+t_k)\\|\\}<\/span>；\n<\/li><li>\n参数步：按第一至五步解 <span class=\"katex-inline\">(R_k,t_k)<\/span> 与均方误差 <span class=\"katex-inline\">e_k<\/span>；\n<\/li><li>\n更新 <span class=\"katex-inline\">X_{k+1}=R_kX+t_k<\/span>，回到对应步；\n<\/li><li>\n收敛判据：<span class=\"katex-inline\">e_k-e_{k-1}<\/span> 小于阈值或矩阵变化小于阈值。\n<\/ol>\n<p><strong>第七步，单调不增依据。<\/strong> 参数步在固定对应下求最小二乘最优解，能量不增；对应步把对应换成最近点，新对应下残差不大于旧对应残差。两步交替，误差序列单调不增。<\/p>\n<h2>数值算例一：二维三点刚性配准闭式解<\/h2>\n<p>源点 <span class=\"katex-inline\">x_1=(0,0)<\/span>，<span class=\"katex-inline\">x_2=(1,0)<\/span>，<span class=\"katex-inline\">x_3=(0,1)<\/span>；目标点 <span class=\"katex-inline\">y_1=(0,0)<\/span>，<span class=\"katex-inline\">y_2=(\\cos\\theta,\\sin\\theta)<\/span>，<span class=\"katex-inline\">y_3=(-\\sin\\theta,\\cos\\theta)<\/span>，取 <span class=\"katex-inline\">\\theta=90^\\circ<\/span>，<span class=\"katex-inline\">\\cos\\theta=0<\/span>，<span class=\"katex-inline\">\\sin\\theta=1<\/span>，即 <span class=\"katex-inline\">y_2=(0,1)<\/span>，<span class=\"katex-inline\">y_3=(-1,0)<\/span>。<\/p>\n<ol><li>\n质心：<span class=\"katex-inline\">\\bar x=(1/3,1/3)<\/span>，<span class=\"katex-inline\">\\bar y=(-1/3,1/3)<\/span>。\n<\/li><li>\n去质心：<span class=\"katex-inline\">x_1&#x27;=(-1/3,-1/3)<\/span>，<span class=\"katex-inline\">x_2&#x27;=(2/3,-1/3)<\/span>，<span class=\"katex-inline\">x_3&#x27;=(-1/3,2/3)<\/span>；<span class=\"katex-inline\">y_1&#x27;=(1/3,-1/3)<\/span>，<span class=\"katex-inline\">y_2&#x27;=(1/3,2/3)<\/span>，<span class=\"katex-inline\">y_3&#x27;=(-2/3,-1/3)<\/span>。\n<\/li><li>\n协方差 <span class=\"katex-inline\">H=\\sum x_i&#x27;y_i&#x27;^\\top<\/span>：\n<ul>\n<li>\n项 1：<span class=\"katex-inline\">(-1/3,-1/3)^\\top(1/3,-1/3)=(-1/9,1/9;-1/9,1/9)<\/span>\n<\/li><li>\n项 2：<span class=\"katex-inline\">(2/3,-1/3)^\\top(1/3,2/3)=(2/9,4/9;-1/9,-2/9)<\/span>\n<\/li><li>\n项 3：<span class=\"katex-inline\">(-1/3,2/3)^\\top(-2/3,-1/3)=(2/9,1/9;-4/9,-2/9)<\/span>\n<\/li><li>\n期望旋转为 <span class=\"katex-inline\">90^\\circ<\/span> 旋转阵 <span class=\"katex-inline\">R=\\begin{pmatrix}0&amp;-1\\\\1&amp;0\\end{pmatrix}<\/span>；回代 <span class=\"katex-inline\">t=\\bar y-R\\bar x<\/span>，<span class=\"katex-inline\">R\\bar x=(-1/3,1/3)<\/span>，<span class=\"katex-inline\">t=(-1/3,1/3)-(-1/3,1/3)=(0,0)<\/span>，与目标坐标系一致。\n<\/li><li>\n核对变换后点：<span class=\"katex-inline\">Rx_2=(0,1)=y_2<\/span>，<span class=\"katex-inline\">Rx_3=(-1,0)=y_3<\/span>，残差为零。\n<p>求和 <span class=\"katex-inline\">H=(3/9,6/9;-6/9,0)=(1/3,2/3;-2/3,0)<\/span>。<\/p>\n<\/ul>\n<\/ol>\n<h2>数值算例二：一轮 ICP 迭代的对应与更新<\/h2>\n<p>源点云当前位置 <span class=\"katex-inline\">x_1=(0,0)<\/span>，<span class=\"katex-inline\">x_2=(2,0)<\/span>；目标点云 <span class=\"katex-inline\">Y=\\{(0.1,0),(1.9,0.2)\\}<\/span>。<\/p>\n<ol><li>\n最近点对应：<span class=\"katex-inline\">x_1<\/span> 最近 <span class=\"katex-inline\">y_1=(0.1,0)<\/span>，<span class=\"katex-inline\">x_2<\/span> 最近 <span class=\"katex-inline\">y_2=(1.9,0.2)<\/span>。\n<\/li><li>\n质心：<span class=\"katex-inline\">\\bar x=(1,0)<\/span>，<span class=\"katex-inline\">\\bar y=(1.0,0.1)<\/span>，平移方向 <span class=\"katex-inline\">\\bar y-\\bar x=(0,0.1)<\/span>。\n<\/li><li>\n去质心：<span class=\"katex-inline\">x_1&#x27;=(-1,0)<\/span>，<span class=\"katex-inline\">x_2&#x27;=(1,0)<\/span>；<span class=\"katex-inline\">y_1&#x27;=(-0.9,-0.1)<\/span>，<span class=\"katex-inline\">y_2&#x27;=(0.9,0.1)<\/span>。\n<\/li><li>\n协方差 <span class=\"katex-inline\">H=(-1,0)(-0.9,-0.1)+(1,0)(0.9,0.1)=(0.9,0.1)+(0.9,0.1)=(1.8,0.2)<\/span>。二维下旋转接近单位阵，本轮平移后 <span class=\"katex-inline\">x_2<\/span> 沿 <span class=\"katex-inline\">y<\/span> 方向靠近 <span class=\"katex-inline\">0.2<\/span>；下一轮最近点对应不再切换，残差收敛。\n<\/li><li>\n若初值把 <span class=\"katex-inline\">x_2<\/span> 对到 <span class=\"katex-inline\">y_1<\/span>：对应错配，刚体估计把两点往一处压，迭代残差停在错位构型；这是初值依赖的数值表现。\n<\/ol>\n<h2>数值算例三：4PCS 不变量筛选<\/h2>\n<p>源侧共面四点 <span class=\"katex-inline\">a,b,c,d<\/span>，线段 <span class=\"katex-inline\">ab<\/span> 与 <span class=\"katex-inline\">cd<\/span> 交于 <span class=\"katex-inline\">e<\/span>。长度 <span class=\"katex-inline\">l_{ab}=|b-a|<\/span>，<span class=\"katex-inline\">l_{cd}=|d-c|<\/span>；比例 <span class=\"katex-inline\">m_1=|e-a|/|b-a|<\/span>，<span class=\"katex-inline\">m_2=|e-c|/|d-c|<\/span>。<\/p>\n<ol><li>\n目标侧枚举点对 <span class=\"katex-inline\">(q_1,q_2)<\/span>，长度落入 <span class=\"katex-inline\">[l_{ab}-\\delta,l_{ab}+\\delta]<\/span> 与 <span class=\"katex-inline\">[l_{cd}-\\delta,l_{cd}+\\delta]<\/span> 区间；点对采样 <span class=\"katex-inline\">O(n^2)<\/span>，不枚举 <span class=\"katex-inline\">O(n^4)<\/span> 四点。\n<\/li><li>\n按比例 <span class=\"katex-inline\">m_1,m_2<\/span> 算中间点 <span class=\"katex-inline\">e_1=q_1+m_1(q_2-q_1)<\/span> 等，两对中间点误差在阈值内才保留。\n<\/li><li>\n刚体保角，再按线段夹角复核；备选四点集用 ANN 统计变换后重合点数，选重合度最高的 <span class=\"katex-inline\">(R,t)<\/span>。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>初值过大直接跑 ICP。<\/strong> 两片点云姿态差 <span class=\"katex-inline\">120^\\circ<\/span>，最近点对应把背面点配到正面点；最小二乘估计出的旋转沿错误对应收敛，迭代后点云叠在错误一侧。修复：先 RANSAC 或 4PCS 粗配准给初值，再 ICP 收紧。<\/p>\n<p><strong>刚性模型套变形点云。<\/strong> 布料弯曲前后两片点云，局部距离差来自弯曲；一个全局 <span class=\"katex-inline\">R,t<\/span> 无法解释，残差留在对应边上，网格拼合出现褶皱。修复：非刚性配准，局部 <span class=\"katex-inline\">R_i<\/span> 或仿射 <span class=\"katex-inline\">T_i<\/span>，加 <span class=\"katex-inline\">E_{\\text{arap}}<\/span> 正则抑制邻域自由变形。<\/p>\n<p><strong>重叠区域不足。<\/strong> 点云只有边缘一小段重叠，内点比例低；RANSAC 采样抽到全内点四点的概率小，粗配准一致性集小，变换估计不稳。修复：补扫视角或扩大采样次数，重合度评分时剔除低重叠候选。<\/p>\n<p><strong>噪声点进入对应集。<\/strong> 游离点被最近点拉进对应，最小二乘被 outlier 拉偏；CPD 用噪声分量 <span class=\"katex-inline\">w/N<\/span> 吸收游离点，后验权重降低其影响。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n卡在&quot;平移为什么能先消掉&quot;：回到第二步。能量对 <span class=\"katex-inline\">t<\/span> 求导得到质心关系；把 <span class=\"katex-inline\">t<\/span> 用质心差表示代回，能量只留旋转部分，这是刚性最小二乘的标准降维。\n<\/li><li>\n卡在&quot;SVD 后为什么要校正行列式&quot;：回到第四步。<span class=\"katex-inline\">VU^\\top<\/span> 可能是反射（行列式 <span class=\"katex-inline\">-1<\/span>），刚体不允许反射；校正矩阵把第三维（二维为第二维）符号翻转回旋转。\n<\/li><li>\n卡在&quot;ICP 为什么会收敛到坏解&quot;：回到算例二第 5 步与失败案例一。最近点对应是硬分配，初值错时对应错，参数步在错对应上求最优，误差单调下降但停在局部最小。\n<\/li><li>\n卡在&quot;CPD 为什么用概率对应&quot;：E 步后验把一个源点按权重分给多个目标点，游离点归到噪声分量；软分配比硬最近点容忍噪声与缺失。\n<\/li><li>\n卡在&quot;4PCS 为什么先采样点对不枚举四点&quot;：四点枚举 <span class=\"katex-inline\">O(n^4)<\/span> 过贵；长度不变量先把候选压到点对级 <span class=\"katex-inline\">O(n^2)<\/span>，再用比例与夹角逐级筛。\n<\/ul>\n<h2>补充展开六：ICP 的复杂度与加速口径<\/h2>\n<p>朴素 ICP 每步对源点云每个点在目标点云找最近点：<span class=\"katex-inline\">N<\/span> 个源点、<span class=\"katex-inline\">M<\/span> 个目标点，暴力最近邻 <span class=\"katex-inline\">O(NM)<\/span>；迭代 <span class=\"katex-inline\">k<\/span> 轮后总复杂度 <span class=\"katex-inline\">O(kNM)<\/span>。加速口径：对目标点云建 <span class=\"katex-inline\">k<\/span>-<span class=\"katex-inline\">d<\/span> 树或近似最近邻（ANN）结构，单次最近邻查询降到 <span class=\"katex-inline\">O(\\log M)<\/span> 量级；对应点筛选剔除距离超阈值的点对，避免 outlier 进入最小二乘。迭代轮数取决于初值精度与收敛阈值，粗配准后初值接近，轮数明显少于从零启动。<\/p>\n<h2>补充展开七：配准质量的度量口径<\/h2>\n<p>配准结果好坏用对应点残差衡量：均方误差 <span class=\"katex-inline\">e=\\frac1N\\sum_i\\|y_i-(Rx_i+t)\\|^2<\/span>。残差小不代表对应正确——错位叠合也可能残差小，因此还要看重合度：变换后源点落在目标点云近邻范围内的比例。粗配准阶段重合度是选模型的主要依据；精配准阶段残差是收敛判据。两片点云重叠区域有限时，只在重叠子集上统计残差，非重叠点不进入误差和。<\/p>\n<h2>补充展开八：纯平移配准小例<\/h2>\n<p>源点 <span class=\"katex-inline\">x_1=(2,3)<\/span>，<span class=\"katex-inline\">x_2=(5,7)<\/span>；目标 <span class=\"katex-inline\">y_1=(2.2,3.1)<\/span>，<span class=\"katex-inline\">y_2=(5.2,7.1)<\/span>。期望无旋转，平移 <span class=\"katex-inline\">t=(0.2,0.1)<\/span>。<\/p>\n<ol><li>\n质心 <span class=\"katex-inline\">\\bar x=(3.5,5)<\/span>，<span class=\"katex-inline\">\\bar y=(3.7,5.1)<\/span>。\n<\/li><li>\n去质心后 <span class=\"katex-inline\">x_1&#x27;=(-1.5,-2)<\/span>，<span class=\"katex-inline\">x_2&#x27;=(1.5,2)<\/span>；<span class=\"katex-inline\">y_1&#x27;=(-1.5,-2)<\/span>，<span class=\"katex-inline\">y_2&#x27;=(1.5,2)<\/span>。\n<\/li><li>\n协方差 <span class=\"katex-inline\">H=x_1&#x27;y_1&#x27;^\\top+x_2&#x27;y_2&#x27;^\\top=2(1.5^2+2^2)<\/span> 方向上为正定对齐，SVD 给出 <span class=\"katex-inline\">R=I<\/span>。\n<\/li><li>\n平移 <span class=\"katex-inline\">t=\\bar y-\\bar x=(0.2,0.1)<\/span>，与期望一致。\n<\/li><li>\n残差核对：<span class=\"katex-inline\">Rx_1+t=(2.2,3.1)=y_1<\/span>，<span class=\"katex-inline\">Rx_2+t=(5.2,7.1)=y_2<\/span>，残差为零。\n<\/ol>\n<h2>补充展开九：概念边界与常见混淆<\/h2>\n<ul><li>\n配准不负责修补点云孔洞：缺失区域由重建管线补；配准只把已有点对齐。\n<\/li><li>\n点云法向定向不属于配准：法向估计在重建隐式管线处理，但刚性配准结果不改变法向朝向。\n<\/li><li>\n蒙皮权重与配准无关：蒙皮是形变章节按骨骼权重混合变换；配准求的是点云之间的全局或局部变换。\n<\/li><li>\n粗配准输出可以是多候选：RANSAC/4PCS 保留若干高分变换，交精配准分别收敛后选终残差最小者，避免单一粗配准候选锁死。\n<\/ul>\n<h2>补充展开十：迭代过程中的状态记录<\/h2>\n<p>一轮完整 ICP 迭代记录四类量：当前对应集 <span class=\"katex-inline\">C_k<\/span>、刚体 <span class=\"katex-inline\">(R_k,t_k)<\/span>、均方误差 <span class=\"katex-inline\">e_k<\/span>、变换后点云 <span class=\"katex-inline\">X_{k+1}<\/span>。实现时保留历史误差序列，用于判断停滞：相邻两轮误差下降小于阈值即停，避免无限迭代。粗配准阶段保留候选变换集合与各自重合度；精配准从最优候选启动。对应集在每步重新计算，不沿用上一轮对应——这是交替结构与一次性匹配的区别。<\/p>\n<h2>补充展开十一：对应点筛选的阈值口径<\/h2>\n<p>最近点距离超过阈值 <span class=\"katex-inline\">\\tau<\/span> 的点对不进入最小二乘：远距离对应多为噪声点或非重叠区域，强行加入会把刚体解拉偏。阈值 <span class=\"katex-inline\">\\tau<\/span> 按点云平均间距与噪声水平设定；迭代中可随残差下降逐步收紧。剔除后的有效点对数记为 <span class=\"katex-inline\">N&#x27;<\/span>，能量按 <span class=\"katex-inline\">N&#x27;<\/span> 归一化，避免点对数变化干扰误差比较。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出刚性配准能量函数，说明固定对应后平移 <span class=\"katex-inline\">t<\/span> 怎样由质心表示。\n<\/li><li>\n协方差矩阵 <span class=\"katex-inline\">H<\/span> 怎样构造？SVD 结果行列式为负时怎样校正？\n<\/li><li>\nICP 每一步固定什么、优化什么？误差序列为什么单调不增？\n<\/li><li>\nRANSAC 的内点、外点与最大一致性数据集各指什么？\n<\/li><li>\n4PCS 利用了哪几类刚体不变量？筛选为什么从点对开始？\n<\/li><li>\nCPD 的 E 步与 M 步各更新什么？噪声权重 <span class=\"katex-inline\">w<\/span> 起什么作用？\n<\/ol>\n<h2>补充展开一：刚性变换的保距性质<\/h2>\n<p>旋转保内积与范数：<span class=\"katex-inline\">(Rx)^\\top(Ry)=x^\\top y<\/span>，<span class=\"katex-inline\">\\|Rx\\|=\\|x\\|<\/span>；平移不改变两点距离：<span class=\"katex-inline\">\\|(x+t)-(y+t)\\|=\\|x-y\\|<\/span>。因此刚性配准中对应点距离度量在变换前后口径一致，能量可以直接用欧氏距离平方和。反射虽保距但改变手性，三维形体镜像不是刚体变换，行列式校正排除这一情形。<\/p>\n<h2>补充展开二：非刚性配准能量的组成<\/h2>\n<p>总能量 <span class=\"katex-inline\">E=w_1E_{\\text{dist}}+w_2E_{\\text{smooth}}+w_3E_{\\text{arap}}<\/span>。<span class=\"katex-inline\">E_{\\text{dist}}<\/span> 为对应点距离误差；<span class=\"katex-inline\">E_{\\text{smooth}}<\/span> 约束相邻局部变换差异平缓；<span class=\"katex-inline\">E_{\\text{arap}}<\/span> 约束邻域边向量经局部旋转后偏差小。权重 <span class=\"katex-inline\">w_1,w_2,w_3<\/span> 平衡贴合程度、平滑程度与刚性保持；变形大的场景降低刚性权重， rigid 物体提高刚性权重。<\/p>\n<h2>补充展开三：粗配准方法对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>方法<\/th><th>采样对象<\/th><th>不变量/准则<\/th><th>复杂度口径<\/th><\/tr><\/thead><tbody><tr><td>RANSAC<\/td><td>小参数样本<\/td><td>最大内点一致性集<\/td><td>采样次数取决于内点比例<\/td><\/tr><tr><td>4PCS<\/td><td>共面四点/点对<\/td><td>长度、夹角、交点比例<\/td><td>点对 <span class=\"katex-inline\">O(n^2)<\/span>，ANN 加速重合度<\/td><\/tr><tr><td>ICP<\/td><td>最近点对<\/td><td>欧氏距离最小二乘<\/td><td>每步最近邻查询 + 闭式解<\/td><\/tr><tr><td>CPD<\/td><td>GMM 软对应<\/td><td>对数似然<\/td><td>EM 迭代，后验权重计算<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>补充展开四：易错口径纠正<\/h2>\n<ul><li>\n把配准当成网格变形：配准对齐的是点云坐标系，不改变点之间的局部形状；非刚性配准才允许局部变形。\n<\/li><li>\n把质心差当平移最终值：质心差只是去质心前的关系，最终 <span class=\"katex-inline\">t=\\bar y-R\\bar x<\/span>，要带旋转作用。\n<\/li><li>\n把最近点当真实对应：最近点是当前变换下的近似对应，迭代中会更新；噪声与遮挡下不保证一一对应。\n<\/ul>\n<h2>补充展开五：衔接速查<\/h2>\n<ul><li>\nc04 重建：配准后的完整点云进 Delaunay 或隐式管线；配准接缝处点云重叠度影响重建水密性。\n<\/li><li>\nc05 光顺：配准残留的错位与噪声作为光顺输入。\n<\/li><li>\nc08 形变：ARAP 边偏差项与非刚性配准的 <span class=\"katex-inline\">E_{\\text{arap}}<\/span> 形式一致，区别是配准对两组点云，形变对同一网格变形前后。\n<\/ul><\/div><\/details>", "kind": "concept", "title": "点云配准：粗配准（RANSAC、4PCS）与精配准（ICP、CPD）"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.58<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">多边形网格、流形条件与半边数据结构<\/a><\/span><\/div><h1>显式与隐式曲面重建：Voronoi/Delaunay 滤波、零水平集、RBF 与 Poisson 重建<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch02（原书 §2.2–2.3，PDF 第 58–73 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>显式重建从点集的 Voronoi 图与 Delaunay 三角剖分出发展滤出贴近表面的三角形网格；隐式重建构造三维标量场，使曲面为其零水平集，法向约束定出内外符号，再由 Marching Cubes 类方法抽取等值面；代表路线含符号距离场、径向基函数、Poisson 指示函数与多层单元剖分。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>扫描点云是一堆离散点，没有面连接，无法直接绘制、贴图或做物理模拟。重建要回答：哪些点之间应当连成表面三角形？孔洞与遮挡缺失的区域怎样补出封闭边界？噪声点怎样不被带进表面？<\/p>\n<p>裸把邻近点连成三角形会出错：表面两侧的样本可能距离更近，连出穿进物体内部的三角形；欠采样区域点稀疏，裸连接留下孔洞；噪声游离点拉出细长错误面片。显式路线借助计算几何结构判断&quot;哪些 Delaunay 三角形贴近表面&quot;，隐式路线绕开逐点连边，先估计空间每点属于内还是外，再沿内外分界抽面，天然能补出封闭曲面。<\/p>\n<p>两条路线对应不同输入条件：采样稠密、噪声低的点云适合显式重建，理论上有 Delaunay 逼近保证；噪声大、有缺失深度数据适合隐式重建，标量场拟合可以平滑掉部分噪声，但依赖法向定向。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>Voronoi 单元<\/strong>：样本点 <span class=\"katex-inline\">p<\/span> 的单元 <span class=\"katex-inline\">V(p)<\/span> 是空间中比其他任何样本点更接近 <span class=\"katex-inline\">p<\/span> 的点集：<span class=\"katex-inline\">V(p)=\\{x\\mid d(x,p)\\le d(x,q),\\ \\forall q\\in P\\}<\/span>。度量用欧氏范数。<\/p>\n<p><strong>Delaunay 三角剖分<\/strong>：Voronoi 图的对偶图，连接相邻单元样本点构成；二维点集在无四点共圆时剖分唯一，三角形外接圆内不含点集中其他点，满足最小角最大化。三维对应 Delaunay 四面体剖分。<\/p>\n<p><strong>极点<\/strong>：样本点 <span class=\"katex-inline\">p<\/span> 的 Voronoi 单元中距 <span class=\"katex-inline\">p<\/span> 最远、分居表面两侧的 Voronoi 顶点；极点方向近似表面法向，位置逼近中轴。<\/p>\n<p><strong>Crust 流程<\/strong>：算 <span class=\"katex-inline\">P<\/span> 的 Voronoi 图取极点集 <span class=\"katex-inline\">P&#x27;<\/span>；对 <span class=\"katex-inline\">P\\cup P&#x27;<\/span> 做 Delaunay 剖分；只保留三个顶点都属于原样本集 <span class=\"katex-inline\">P<\/span> 的三角形。<\/p>\n<p><strong>Power Crust<\/strong>：加权 Voronoi（Power 图）逼近中轴；分内外极点，Power 图单元边界即 Power Crust 表面，连接内部极点的单纯形为 Power Shape 中轴。<\/p>\n<p><strong>Cocone<\/strong>：极点估计法向；样本点处与估计法向成 <span class=\"katex-inline\">\\pi/2-\\theta<\/span> 角的双锥体筛选相交 Voronoi 边，其对偶三角形构成候选集；剔除锐边三角形后深度优先遍历邻接图得到流形表面。Tight Cocone 标记 Delaunay 四面体内外，剥离外部四面体得到水密表面。<\/p>\n<p><strong>隐式曲面<\/strong>：<span class=\"katex-inline\">S=\\{x\\mid F(x)=0,\\ x\\in\\mathbb R^3\\}<\/span>；曲面上点 <span class=\"katex-inline\">F(p_i)=0<\/span>，曲面外点 <span class=\"katex-inline\">F(p_i)\\neq0<\/span>。法向信息约束内外符号。<\/p>\n<p><strong>符号距离场（SDF）<\/strong>：<span class=\"katex-inline\">\\Phi(x)=(x-p_i)\\cdot\\mathbf n_i<\/span>，取到邻近切平面的带符号投影距离；零等值面为重建曲面。<\/p>\n<p><strong>RBF<\/strong>：以径向基函数 <span class=\"katex-inline\">\\phi(\\|x-p_i\\|)<\/span> 线性组合插值或拟合约束点；带噪数据用拟合加平滑参数 <span class=\"katex-inline\">\\delta<\/span>；贪心迭代在误差大处补约束点。<\/p>\n<p><strong>Poisson 重建<\/strong>：指示函数 <span class=\"katex-inline\">\\chi<\/span> 内 1 外 <span class=\"katex-inline\">-1<\/span>；最小化 <span class=\"katex-inline\">\\|\\nabla\\chi-\\mathbf w\\|^2<\/span>，变分条件 <span class=\"katex-inline\">\\Delta\\chi=\\nabla\\cdot\\mathbf w<\/span>；自适应八叉树离散化，解稀疏系统后抽等值面。<\/p>\n<p><strong>MPU<\/strong>：八叉树单元内拟合局部二次形状函数，按距离加权混合成全局隐式场；单元内点不足则增大支撑半径或细分。<\/p>\n<p><strong>正例<\/strong>：稠密扫描的杯子点云，Delaunay 滤波保留表面三角形，抽出网格贴合杯壁。<\/p>\n<p><strong>反例<\/strong>：噪声游离点进入 Delaunay 四面体集合，显式滤波可能保留细长三角形；法向未定向时 Poisson 向量场互相抵消，等值面局部翻面。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>Delaunay 对偶关系<\/strong>：Voronoi 图每条边分隔两个样本单元，对偶到一条连接两样本点的 Delaunay 边；Voronoi 顶点是三个单元的交点，对偶到 Delaunay 三角形。样本稠密落在曲面上时，贴近表面的 Delaunay 三角形其 Voronoi 对偶结构贴近表面，远离表面的三角形对应中轴方向。<\/p>\n<p><strong>Crust 滤波依据<\/strong>：极点替中轴方向投辅助点；加入 <span class=\"katex-inline\">P&#x27;<\/span> 后，纯内部连接的三角形顶点会涉及极点，被&quot;三顶点都属 <span class=\"katex-inline\">P<\/span>&quot;条件滤除；保留下来的三角形即表面片。<\/p>\n<p><strong>Poisson 变分链<\/strong>：指示函数梯度在采样点处近似内法向 <span class=\"katex-inline\">\\mathbf m<\/span>，其余位置为零。目标泛函 <span class=\"katex-inline\">\\|\\nabla\\chi-\\mathbf w\\|^2<\/span> 对 <span class=\"katex-inline\">\\chi<\/span> 求一阶变分，得 <span class=\"katex-inline\">\\nabla\\cdot(\\nabla\\chi-\\mathbf w)=0<\/span>，即 <span class=\"katex-inline\">\\Delta\\chi=\\nabla\\cdot\\mathbf w<\/span>。向量场由采样点内法向按局部面积近似积分：<span class=\"katex-inline\">\\mathbf w(x)\\approx\\sum_{p_i\\in P}|M_{p_i}|\\,\\phi(x-p_i)\\mathbf m_i<\/span>。八叉树节点函数把场表示为节点基函数线性求和，方程离散为稀疏线性系统。<\/p>\n<p><strong>SDF 切平面估计<\/strong>：邻近点集质心为切平面中心 <span class=\"katex-inline\">c_i<\/span>，法向由最小化 <span class=\"katex-inline\">\\sum_{p\\in N(p_i)}(\\mathbf n\\cdot(p-c_i))^2<\/span> 得到；协方差矩阵最小特征值对应特征向量即法向方向，全局定向另由邻切平面法向点积最大化的图优化统一。<\/p>\n<p><strong>RBF 拟合口径<\/strong>：插值要求 <span class=\"katex-inline\">F(p_i)=0<\/span>；拟合放宽为 <span class=\"katex-inline\">|F(p_i)-\\delta|\\le\\delta<\/span> 类容差，平衡数据不光滑性；基函数宽度控制局部影响范围。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：显式重建假设采样相对稠密、噪声较低；隐式重建要求法向可估计并全局定向；两类方法都假设局部曲面光滑可分片逼近。\n<\/li><li>\n边界 1：显式 Delaunay 三维剖分计算开销大，大规模点云效率受限；严重噪声与欠采样下孔洞、伪像增多。\n<\/li><li>\n边界 2：隐式零水平集依赖法向符号；法向方向不一致时内外颠倒，等值面错误。\n<\/li><li>\n边界 3：SDF 对法向误差敏感，细微法向噪声导致距离估计偏差；RBF 全局基函数系数矩阵规模随点数增长。\n<\/li><li>\n边界 4：MPU 混合要求局部基函数符号一致，缺失数据靠外推与邻接形状混合补。\n<\/li><li>\n失败案例：遮挡造成大孔洞时，显式滤波无法跨过空洞连边；隐式方法可由法向场外推闭合，但孔洞形状靠先验假设，不保证还原真实轮廓。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>显式 vs 隐式<\/strong>：显式直接输出三角形面片，贴合采样但封闭性弱；隐式输出标量场、再抽等值面，天然封闭但形状受场拟合控制。\n<\/li><li>\n<strong>Voronoi 滤波 vs 裸最近邻连边<\/strong>：前者按对偶结构与极点关系判断表面，后者只看距离；裸连边会把表面两侧点错误相连。\n<\/li><li>\n<strong>SDF vs Poisson<\/strong>：SDF 逐点投影到局部切平面，构造简单但对法向噪声敏感；Poisson 重建指示函数梯度场，整体解场，能更好处理缺失与噪声，代价是求解泊松系统。\n<\/li><li>\n<strong>RBF 插值 vs 拟合<\/strong>：插值严格过约束点，噪声被带进场；拟合允许残差，平滑程度由参数控制。\n<\/li><li>\n<strong>Crust vs Cocone<\/strong>：Crust 用极点集合重构 Delaunay 再按顶点归属滤边；Cocone 用法向双锥体筛 Voronoi 边，省去部分法向滤波步骤。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 点-边-面结构承接输出网格；c03 配准提供对齐后的完整点云；c02 法向与曲率估计为重建提供几何量。后继：c05 光顺处理重建网格的噪声与锯齿；c06 参数化作用在重建网格上；c07 简化降低重建网格规模。隐式场抽取等值面用的 Marching Cubes 与第 1 章隐式曲面表示一节相接。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（显式与隐式曲面重建：Voronoi/Delaunay 滤波、零水平集、RBF 与 Poisson 重建）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：Voronoi–Delaunay 对偶链、Poisson 变分离散化与重建算例复盘<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把曲面重建往回追五层：<\/p>\n<ol><li>\n<strong>采样点与法向<\/strong>：配准后的点云位置；隐式路线还需要每点法向，法向由局部切平面 PCA 与全局定向得到。\n<\/li><li>\n<strong>几何结构（显式）<\/strong>：Voronoi 单元划分空间，Delaunay 对偶给出候选三角形/四面体；极点逼近中轴并辅助滤波。\n<\/li><li>\n<strong>表面判据<\/strong>：Crust 按顶点归属、Cocone 按法向锥体、Power Crust 按内外单元标记，从候选集中筛出表面片。\n<\/li><li>\n<strong>标量场构造（隐式）<\/strong>：SDF 投影距离、RBF 基函数组合、Poisson 指示函数梯度逼近、MPU 局部二次混合；各自定义约束点上的场值符号。\n<\/li><li>\n<strong>等值面抽取<\/strong>：场在晶格或八叉树节点上离散，Marching Cubes 类方法按符号变化抽三角形，输出网格。\n<\/ol>\n<p>依赖链方向：点云与法向 → 候选几何/标量场 → 表面判据/场求解 → 等值面抽取 → 输出网格。<\/p>\n<h2>正向推导：显式路线的对偶与滤波逐步展开<\/h2>\n<p><strong>第一步，Voronoi 单元定义。<\/strong> 样本集 <span class=\"katex-inline\">P=\\{p_i\\}<\/span>，单元 <span class=\"katex-inline\">V(p_i)=\\{x\\mid d(x,p_i)\\le d(x,p_j),\\forall j\\neq i\\}<\/span>。两个相邻单元的分界是两点连线的垂直平分面；单元交集为 Voronoi 顶点。<\/p>\n<p><strong>第二步，对偶 Delaunay 图。<\/strong> 相邻单元共享分界面对应一条 Delaunay 边连接两样本点；三个单元共点对应一个 Delaunay 三角形；外接圆（三维为外接球）内不含其他样本点。二维无四点共圆时剖分唯一，最小角最大化。<\/p>\n<p><strong>第三步，极点提取。<\/strong> 对样本点 <span class=\"katex-inline\">p<\/span>，在其 Voronoi 单元内取距 <span class=\"katex-inline\">p<\/span> 最远、分居表面两侧的顶点 <span class=\"katex-inline\">p^+,p^-<\/span>；极点连线近似表面法向，极点集合逼近中轴。凸包上样本点的极点规则按边界情形处理。<\/p>\n<p><strong>第四步，Crust 滤波。<\/strong> 构造 <span class=\"katex-inline\">P&#x27;=\\{p^+,p^-\\}<\/span>，对 <span class=\"katex-inline\">P\\cup P&#x27;<\/span> 做 Delaunay 剖分；保留三顶点全属于 <span class=\"katex-inline\">P<\/span> 的三角形。顶点涉及极点的三角形对应内部连接或中轴方向，被滤除。<\/p>\n<p><strong>第五步，Power Crust 加权路线。<\/strong> 给样本点与极点赋权，形成 Power 图（加权 Voronoi）；标定单元内外部性，内外部单元交界为 Power Crust，内部极点连接单纯形为中轴 Power Shape。<\/p>\n<p><strong>第六步，Cocone 锥体筛选。<\/strong> 以极点方向为估计法向，构造与法向成 <span class=\"katex-inline\">\\pi/2-\\theta<\/span> 的双锥体；与锥体相交的 Voronoi 边的对偶三角形进候选集；剔除锐边（相邻三角形夹角大于 <span class=\"katex-inline\">3\\pi/2<\/span> 或单边邻接）后，邻接图深度优先遍历得流形表面。<\/p>\n<h2>正向推导：隐式路线的 Poisson 离散链<\/h2>\n<p><strong>第一步，指示函数设定。<\/strong> <span class=\"katex-inline\">\\chi<\/span> 在实体内部取 1，外部取 <span class=\"katex-inline\">-1<\/span>，曲面为零等值面；采样点处 <span class=\"katex-inline\">\\nabla\\chi\\approx\\mathbf m<\/span>（内法向），其余位置梯度为零。<\/p>\n<p><strong>第二步，逼近泛函。<\/strong> 最小化 <span class=\"katex-inline\">E(\\chi)=\\|\\nabla\\chi-\\mathbf w\\|^2<\/span>，<span class=\"katex-inline\">\\mathbf w<\/span> 为点云法向构成的向量场。<\/p>\n<p><strong>第三步，变分条件。<\/strong> 泛函一阶变分为零：<span class=\"katex-inline\">\\nabla\\cdot(\\nabla\\chi-\\mathbf w)=0<\/span>，即 <span class=\"katex-inline\">\\Delta\\chi=\\nabla\\cdot\\mathbf w<\/span>。这是 Poisson 方程，右侧为法向场散度。<\/p>\n<p><strong>第四步，向量场近似。<\/strong> 已知实体 <span class=\"katex-inline\">M<\/span> 边界 <span class=\"katex-inline\">\\partial M<\/span>，滤波后指示函数梯度满足 <span class=\"katex-inline\">\\nabla*_{\\phi}\\chi_M=\\int_{\\partial M}\\phi(q)\\mathbf m\\,dp<\/span>；点云近似为互不相交局部区域 <span class=\"katex-inline\">M_{p_i}<\/span>：<span class=\"katex-inline\">\\mathbf w(x)\\approx\\sum_{p_i\\in P}|M_{p_i}|\\phi(x-p_i)\\mathbf m_i<\/span>。<\/p>\n<p><strong>第五步，八叉树离散。<\/strong> 自适应八叉树节点 <span class=\"katex-inline\">o<\/span> 带节点函数 <span class=\"katex-inline\">\\phi_o<\/span>；盒式滤波 <span class=\"katex-inline\">m<\/span> 次卷积表达场，<span class=\"katex-inline\">\\mathbf w=\\sum_{p_i}\\sum_{o\\in N_p(p_i)}a_{op_i}\\phi_o\\mathbf m_i<\/span>。非均匀样本加权重函数。<\/p>\n<p><strong>第六步，稀疏求解。<\/strong> 代入方程得 <span class=\"katex-inline\">\\min\\|\\nabla\\mathbf A\\chi-\\mathbf Y\\|^2<\/span> 形式最小二乘系统，<span class=\"katex-inline\">\\chi=\\sum z_o\\phi_o<\/span> 解系数 <span class=\"katex-inline\">z_o<\/span>；选等值面抽 Marching Cubes 网格。Screened Poisson 增加点位置约束项 <span class=\"katex-inline\">\\lambda\\sum\\chi(p_i)^2<\/span>，保持稀疏结构不变。<\/p>\n<h2>数值算例一：二维三点 Voronoi–Delaunay 核对<\/h2>\n<p>取三点 <span class=\"katex-inline\">p_1=(0,0)<\/span>，<span class=\"katex-inline\">p_2=(2,0)<\/span>，<span class=\"katex-inline\">p_3=(1,1.5)<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">p_1,p_2<\/span> 垂直平分线为 <span class=\"katex-inline\">x=1<\/span>；<span class=\"katex-inline\">p_1,p_3<\/span> 中垂线方程由中点 <span class=\"katex-inline\">(0.5,0.75)<\/span> 与连线法向给出。\n<\/li><li>\n外接圆圆心为三边中垂线交点；算得圆心 <span class=\"katex-inline\">(1,0.625)<\/span>，半径约 <span class=\"katex-inline\">1.179<\/span>；圆内无第四点，三角形 <span class=\"katex-inline\">(1,2,3)<\/span> 为合法 Delaunay 三角形。\n<\/li><li>\n对偶：三边各对应一段 Voronoi 边，外接圆圆心为 Voronoi 顶点；Delaunay 三角形与该 Voronoi 顶点对偶。\n<\/li><li>\n若加入第四点落在内接圆内，原三角形不再满足空圆条件，Delaunay 边翻转重剖分。\n<\/ol>\n<h2>数值算例二：两个八叉树节点的 Poisson 场组装<\/h2>\n<p>设采样点 <span class=\"katex-inline\">p_1,p_2<\/span> 各落入邻接节点集；节点函数 <span class=\"katex-inline\">\\phi_1,\\phi_2<\/span>，插值权重 <span class=\"katex-inline\">a_{11},a_{12},a_{21},a_{22}<\/span>，法向 <span class=\"katex-inline\">\\mathbf m_1,\\mathbf m_2<\/span>。<\/p>\n<ol><li>\n场分量 <span class=\"katex-inline\">\\mathbf w=\\sum a_{op_i}\\phi_o\\mathbf m_i<\/span>，节点 1 系数 <span class=\"katex-inline\">w_1=a_{11}\\mathbf m_1+a_{21}\\mathbf m_2<\/span>，节点 2 系数 <span class=\"katex-inline\">w_2=a_{12}\\mathbf m_1+a_{22}\\mathbf m_2<\/span>。\n<\/li><li>\n散度按节点邻接关系组装到右端项；未知系数 <span class=\"katex-inline\">z_1,z_2<\/span> 进入稀疏矩阵 <span class=\"katex-inline\">\\mathbf A<\/span>。\n<\/li><li>\n解最小二乘得 <span class=\"katex-inline\">z_1,z_2<\/span>；等值面取 <span class=\"katex-inline\">\\chi=0<\/span>，节点场值由 <span class=\"katex-inline\">\\sum z_o\\phi_o<\/span> 插值，符号变化的边交点连成三角形。\n<\/li><li>\n法向 <span class=\"katex-inline\">\\mathbf m_1,\\mathbf m_2<\/span> 若方向相反，<span class=\"katex-inline\">w_1,w_2<\/span> 部分抵消，右端散度减弱，抽出的等值面收缩或翻面；定向一致是场组装的前提。\n<\/ol>\n<h2>数值算例三：RBF 三约束小系统<\/h2>\n<p>约束点 <span class=\"katex-inline\">p_1,p_2,p_3<\/span>，基函数 <span class=\"katex-inline\">\\phi(r)=\\exp(-r^2/2)<\/span>，场 <span class=\"katex-inline\">F(x)=\\sum c_k\\phi(\\|x-p_k\\|)+p(x)<\/span>，<span class=\"katex-inline\">p(x)<\/span> 为低次多项式项。<\/p>\n<ol><li>\n插值约束 <span class=\"katex-inline\">F(p_i)=0<\/span> 写成线性方程组 <span class=\"katex-inline\">\\Phi c=b<\/span>，<span class=\"katex-inline\">\\Phi_{ik}=\\phi(\\|p_i-p_k\\|)<\/span>。\n<\/li><li>\n三点三未知可解；点数增大时系数矩阵稠密，求解成本随 <span class=\"katex-inline\">N<\/span> 上升。\n<\/li><li>\n带噪拟合把约束改为 <span class=\"katex-inline\">|F(p_i)|\\le\\delta<\/span>，最小二乘加正则项；贪心流程：先取子集拟合，算剩余点误差 <span class=\"katex-inline\">\\epsilon_j=F(p_j)<\/span>，误差最大处补约束点重算，直到 <span class=\"katex-inline\">\\max\\epsilon_j<\/span> 小于精度。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>噪声点进 Delaunay 候选。<\/strong> 游离点拉大外接圆，细长三角形进入候选集；滤波依据空圆与极点关系难以完全剔除，网格出现尖刺。修复：重建前先点云去噪或离群点剔除。<\/p>\n<p><strong>欠采样区域孔洞。<\/strong> 表面稀疏处 Delaunay 三角形跨过大空洞连接两侧；Cocone 候选集不足，Tight Cocone 靠四面体标记补水密，但轮廓由外推假设决定。<\/p>\n<p><strong>法向未定向。<\/strong> 隐式路线中法向一半向内一半向外，<span class=\"katex-inline\">\\mathbf w<\/span> 抵消，Poisson 散度场失真；SDF 投影距离符号错乱。定向步骤把邻切平面法向点积最大化建成图优化，不能省略。<\/p>\n<p><strong>RBF 全局矩阵规模失控。<\/strong> 点数上万时稠密系数矩阵存储与求解开销大；局部 RBF 或稀疏基函数路线受限域拟合，MPU 用八叉树局部二次函数混合替代全局基函数。<\/p>\n<p><strong>Marching Cubes 模式歧义。<\/strong> 晶格八顶点符号组合存在面片连接不唯一；原书提到利用对称性把 256 种模式缩为 15 种编码，改进工作消除连接歧义。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n卡在&quot;Voronoi 和 Delaunay 谁是谁的对偶&quot;：回到第二步。Voronoi 按距离划分空间单元，Delaunay 连接相邻单元样本点；前者是空间分解，后者是样本点图。\n<\/li><li>\n卡在&quot;极点为什么能辅助滤波&quot;：回到第三步与第四步。极点逼近中轴方向，涉及极点的三角形不贴表面，按顶点归属滤除。\n<\/li><li>\n卡在&quot;Poisson 方程右侧为什么是法向场散度&quot;：回到第三步。变分条件把梯度残度的散度置零，梯度逼近法向场，散度即右端。\n<\/li><li>\n卡在&quot;隐式曲面内外怎样定号&quot;：法向约定内部一侧；指示函数内 1 外 <span class=\"katex-inline\">-1<\/span>，约束点法向指向内部，符号由法向定向保证。\n<\/li><li>\n卡在&quot;显式和隐式怎么选&quot;：看输入条件。稠密低噪声选显式，有噪有缺失选隐式；两类输出都要过光顺与质量检查。\n<\/ul>\n<h2>补充展开七：二维 Crust 流程小例推演<\/h2>\n<p>沿一条闭合曲线稠密采样点列 <span class=\"katex-inline\">p_1,\\dots,p_n<\/span>。Voronoi 图顶点分两类：贴近曲线的与逼近中轴的。取每个样本两侧最远的极点 <span class=\"katex-inline\">p_i^+,p_i^-<\/span> 组成辅助集。对原样本与辅助点一起做 Delaunay 三角剖分：贴近曲线的三角形三顶点都在原样本列上；指向中轴的三角形至少一个顶点是极点。<\/p>\n<ol><li>\n遍历剖分三角形，检查三顶点标记；全属原样本集的保留。\n<\/li><li>\n保留三角形沿样本列邻接成带状结构，即曲线的三角逼近。\n<\/li><li>\n若某段采样稀疏，对应 Voronoi 单元拉长，极点估计不稳，保留三角形出现缺口或尖角；加密该段采样后重跑剖分。\n<\/li><li>\n二维 Crust 是三维算法的原型：三维中轴逼近更困难，所以 Power Crust 用加权图与内外标记替代纯顶点归属判据。\n<\/ol>\n<h2>补充展开八：采样密度与逼近保证口径<\/h2>\n<p>显式重建的理论保证建立在采样密度假设上：样本点间距相对局部特征尺度足够小，噪声幅度低于采样间距。密度充足时，Delaunay 滤波能恢复拓扑正确的表面；密度下降到特征尺度以下，算法不再保证孔洞闭合与三角形朝向正确。工程上判断输入是否满足假设，看三点：局部点间距直方图、离群点比例、欠采样区域可视化。不满足假设时，先补扫或加密，再选重建路线，不能靠调滤波参数硬补理论缺口。<\/p>\n<h2>补充展开九：重建前后的数据衔接<\/h2>\n<p>重建上游是配准点云（位置与可选法向）；输出是三角网格（顶点表、面片表、可选法向与纹理坐标）。显式路线输出面片即插即用，但开口边界要记录；隐式路线先输出场采样，抽等值面后得到网格，场网格分辨率由八叉树深度控制。重建网格进下游光顺前，先检查非流形边、重复顶点、退化三角形；这些拓扑问题在滤波阶段遗留到光顺阶段会被放大。点云法向估计、重建、光顺三段的法向口径要统一，否则相邻步骤法向方向冲突。<\/p>\n<h2>补充展开十：法向在两类重建中的不同角色<\/h2>\n<p>显式重建中，法向是辅助判据：Cocone 用极点方向构造双锥体筛 Voronoi 边，法向不准时锥体角度偏移，候选三角形集合收窄或放宽。显式路线可以在无法向条件下仅靠点位置与极点工作，精度受影响但流程不断。<\/p>\n<p>隐式重建中，法向是场约束的主输入：Poisson 的向量场 <span class=\"katex-inline\">\\mathbf w<\/span> 直接由法向场加权构成，法向未定向时散度右端失真；SDF 投影距离带符号依赖法向方向；RBF 插值只约束零值，附加法向约束可改善零等值面走向。同一批点云，显式法向误差表现为个别三角形错连，隐式法向误差表现为整片内外颠倒或场面收缩，故障量级不同。<\/p>\n<h2>补充展开十一：重建失败类型与对照处置<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>失败现象<\/th><th>常见原因<\/th><th>处置路线<\/th><\/tr><\/thead><tbody><tr><td>表面内部出现细长三角形<\/td><td>游离噪声点进入剖分<\/td><td>重建前去离群点、点云去噪<\/td><\/tr><tr><td>大孔洞跨空洞连边<\/td><td>欠采样遮挡<\/td><td>补扫视角；隐式外推补面<\/td><\/tr><tr><td>等值面局部翻面、内外面颠倒<\/td><td>法向定向不一致<\/td><td>图优化统一法向后重跑场<\/td><\/tr><tr><td>网格尖刺沿法向伸出<\/td><td>法向估计不稳、场约束过强<\/td><td>平滑法向、降低场刚度权重<\/td><\/tr><tr><td>局部轮廓过光滑丢失细节<\/td><td>基函数过宽、八叉树过粗<\/td><td>加密局部节点、收窄基函数<\/td><\/tr><tr><td>系数矩阵求解慢<\/td><td>RBF 全局稠密基<\/td><td>局部 RBF / MPU 八叉树混合<\/td><\/tr><\/tbody><\/table><\/div>\n<p>对照表使用顺序：先区分是拓扑问题（错连、孔洞、非流形）还是场问题（翻面、光滑过头、尖刺），再回到上游修点云或修场参数；下游光顺只能减轻表面锯齿，不能修复错误拓扑。<\/p>\n<h2>补充展开十二：隐式场线性系统的结构<\/h2>\n<p>Poisson 离散后矩阵 <span class=\"katex-inline\">\\mathbf A<\/span> 由八叉树节点邻接关系构成，每行只含邻接节点非零元，结构稀疏。右端 <span class=\"katex-inline\">\\mathbf Y<\/span> 由向量场散度组装；约束点位置项以对角加权加进方程。求解用共轭梯度或稀疏直接法，节点数对应八叉树分辨率。场值系数 <span class=\"katex-inline\">z_o<\/span> 解出后，任意查询点 <span class=\"katex-inline\">x<\/span> 的场值为 <span class=\"katex-inline\">\\sum z_o\\phi_o(x)<\/span>；等值面抽取只需要符号与线性插值，不需要显式存全场网格。<\/p>\n<h2>补充展开十三：与第 1 章隐式表示一节的呼应<\/h2>\n<p>第 1 章把隐式曲面写成 <span class=\"katex-inline\">S=\\{x\\mid F(x)=0\\}<\/span>，列举代数曲面、水平集、距离场、隐式样条等表示；本章隐式重建是这套表示在采样点上的构造过程。代数曲面整体低次，表达复杂细节受限；距离场与水平集靠采样逼近复杂形状；隐式样条分片定义、连续拼接。重建路线选择与表示形式一一对应：SDF 对应距离场，RBF 对应全局样条类组合，MPU 对应分片局部函数混合。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出 Voronoi 单元定义与 Delaunay 空圆性质，说明对偶关系。\n<\/li><li>\nCrust 流程分哪几步？保留三角形的判据是什么？\n<\/li><li>\n写出 Poisson 重建的变分泛函与最优性条件方程。\n<\/li><li>\n向量场 <span class=\"katex-inline\">\\mathbf w<\/span> 怎样由采样点法向与局部面积近似得到？\n<\/li><li>\nSDF、RBF、Poisson、MPU 四类隐式路线各自用什么基函数或场？\n<\/li><li>\n显式重建在噪声与欠采样下分别出现什么失败现象？\n<\/ol>\n<h2>补充展开一：Delaunay 性质逐条核对<\/h2>\n<p>二维 Delaunay 剖分性质：无四点共圆时唯一；外边界为点集凸包；三角形内部不含样本点；外接圆内不含样本点；最小角最大化。三维 Delaunay 四面体剖分对应空球性质。这些性质是显式重建滤波的几何基础——贴近表面的三角形其外接圆/球不被另一侧样本侵入。<\/p>\n<h2>补充展开二：法向估计的 PCA 步骤<\/h2>\n<p>邻近点集 <span class=\"katex-inline\">N(p_i)<\/span>，质心 <span class=\"katex-inline\">c_i<\/span>；协方差矩阵 <span class=\"katex-inline\">C_i=\\sum_{p\\in N(p_i)}(p-c_i)(p-c_i)^\\top<\/span>。特征值 <span class=\"katex-inline\">\\lambda_1\\ge\\lambda_2\\ge\\lambda_3<\/span>，对应特征向量 <span class=\"katex-inline\">\\mathbf e_1,\\mathbf e_2,\\mathbf e_3<\/span>；最小特征值方向 <span class=\"katex-inline\">\\mathbf e_3<\/span> 为法向候选。邻域近似平面时 <span class=\"katex-inline\">\\lambda_3<\/span> 接近零，法向稳定；邻域接近折线或曲面陡峭时 <span class=\"katex-inline\">\\lambda_3<\/span> 不小，法向估计不稳。全局定向以邻切平面为图节点、法向点积为边权，最大化图权值统一内外。<\/p>\n<h2>补充展开三：水密性与封闭边界<\/h2>\n<p>显式重建默认输出开口网格也可接受；某些应用（3D 打印、实体模拟）要求水密：边界为闭合二维流形、无孔洞、非流形边。Tight Cocone 标记四面体内外剥离外部；Poisson 指示函数零等值面天然封闭。开口模型补洞属于重建后处理，不在原始滤波流程内。<\/p>\n<h2>补充展开四：四类隐式路线对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>路线<\/th><th>场构造<\/th><th>优点<\/th><th>短板<\/th><\/tr><\/thead><tbody><tr><td>SDF<\/td><td>到邻近切平面带符号投影<\/td><td>实现简单<\/td><td>对法向噪声敏感<\/td><\/tr><tr><td>RBF<\/td><td>径向基函数线性组合<\/td><td>拟合光滑<\/td><td>稠密矩阵规模大<\/td><\/tr><tr><td>Poisson<\/td><td>指示函数梯度逼近法向场<\/td><td>封闭、抗缺失<\/td><td>需定向法向、解泊松系统<\/td><\/tr><tr><td>MPU<\/td><td>八叉树局部二次函数加权混合<\/td><td>可处理大规模点云<\/td><td>局部基函数符号需一致<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>补充展开五：等值面抽取口径<\/h2>\n<p>晶格八顶点场值符号判定晶格是否与等值面相交；相交边按线性插值算交点；256 种符号模式利用补偿对称与旋转对称缩为 15 种编码。八叉树在曲面附近加密节点，远离区域粗化，控制内存。抽取结果为三角形网格，进入光顺与质量检查环节。<\/p>\n<h2>补充展开六：衔接速查与易错口径<\/h2>\n<ul><li>\n衔接：c03 配准输出完整点云；c05 光顺处理重建网格锯齿；c06 参数化以重建网格为输入；c07 简化抽多分辨率层级。\n<\/li><li>\n易错：把隐式场值当距离场通用——SDF 是带符号距离，Poisson 是指示函数，MPU 是局部距离近似，三者量纲不同，不能混用等值阈值。\n<\/li><li>\n易错：把极点当表面点——极点逼近中轴，不是表面样本；保留三角形时极点不能作为表面顶点。\n<\/li><li>\n易错：认为隐式重建不需要法向——位置约束只能定零值，内外符号仍靠法向。\n<\/ul><\/div><\/details>", "kind": "concept", "title": "显式与隐式曲面重建：Voronoi/Delaunay 滤波、零水平集、RBF 与 Poisson 重建"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.80<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">离散曲率与 Laplace–Beltrami 算子：余切权格式、平均曲率法向与高斯曲率<\/a><\/span><\/div><h1>曲面光顺：基于顶点距离误差与基于法向梯度误差的滤波平滑<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch02（原书 §2.4，PDF 第 80–82 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>曲面光顺在尽量保留形状特征的前提下去除重建网格上的噪声锯齿：基于顶点的方法把顶点向邻域滤波位置移动；基于法向的方法先滤波面法向，再让更新后三角形贴近滤波法向；两类路线分别以顶点距离误差与法向梯度误差为能量，控制平滑强度与特征保持之间的取舍。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>重建网格带有扫描噪声：顶点抖动、面片凹凸、局部尖刺，表面不是一张平顺的曲面。直接拿这种网格做贴图、物理模拟或参数化，噪声沿后续流程扩散：参数化被抖动边拉大扭曲，形变把尖刺当特征保留，描述子统计被局部抖动干扰。光顺要把高频抖动从低频形状中分离出来，同时不能把棱边、转角、凸凹特征一起磨掉。<\/p>\n<p>困难在于噪声与特征在网格上的表现相似：都是邻域方向或位置偏离光滑曲面。只看局部邻域无法区分&quot;噪声抖动&quot;和&quot;真实尖角&quot;；简单的邻点平均会把两类一起抹平。工程上因此分两类处理路线：一类在顶点位置上做滤波，口径直接、实现简单；一类先在法向场上做滤波，再由法向重建顶点位置，对剖分变化更鲁棒。两类能量都要回答平滑强度多大、哪些区域保留特征。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>基于顶点的光顺<\/strong>：滤波作用在顶点坐标上。顶点 <span class=\"katex-inline\">v_i<\/span> 的更新位置由邻域 <span class=\"katex-inline\">N(i)<\/span> 顶点的滤波位置决定；典型 Laplacian 平滑把顶点向邻点质心移动，曲率流沿平均曲率法向方向移动。迭代次数或滤波系数控制强度；过度迭代使体积收缩、棱角钝化。<\/p>\n<p><strong>基于法向的光顺<\/strong>：先对面片法向集合做滤波，得到平滑法向 <span class=\"katex-inline\">\\tilde{\\mathbf n}_f<\/span>；再调整顶点位置，使更新后三角形法向与 <span class=\"katex-inline\">\\tilde{\\mathbf n}_f<\/span> 对齐。法向滤波在面集合上进行，不直接移动顶点。<\/p>\n<p><strong>距离误差能量<\/strong>：顶点到邻接滤波三角形平面的距离误差最小化。设滤波后三角形平面为 <span class=\"katex-inline\">P_l<\/span>，候选顶点 <span class=\"katex-inline\">v_i<\/span>，误差项为到平面距离平方；整体能量累加邻接平面约束。<\/p>\n<p><strong>梯度误差能量<\/strong>：新三角形法向与滤波法向的偏差最小化。法向由三角形边向量叉积给出，能量惩罚叉积方向与滤波法向的夹角；法向匹配更精确，对三角剖分更鲁棒，计算量比距离误差形式更大。<\/p>\n<p><strong>数据驱动光顺<\/strong>：级联网络回归法向滤波算子，从数据学习噪声到平滑法向的映射，保留细节的能力依赖训练样本覆盖。<\/p>\n<p><strong>滤波算子口径<\/strong>：顶点邻域滤波可写成线性卷积形式，权值按余切权、均匀权或距离反比选取；法向滤波对面片集合做邻接平均，邻接关系取共享边或共享顶点的面片集合。两种算子都可用迭代实现，每轮只动一类量（坐标或法向），避免位置与法向同时更新互相干扰。<\/p>\n<p><strong>特征保持口径<\/strong>：高曲率特征区域降低滤波强度；检测到棱边或尖角时，邻点平均范围受限，顶点不跨特征线移动。<\/p>\n<p><strong>正例<\/strong>：低噪声自由曲面网格，顶点滤波几轮后抖动消除，整体曲面平顺。<\/p>\n<p><strong>反例<\/strong>：棱边模型过度平滑，直角倒圆、体积收缩；法向未先定向时，法向滤波把相反法向平均成零向量。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>Laplacian 平滑的位置更新<\/strong>：邻点质心 <span class=\"katex-inline\">c_i=\\frac1{|N(i)|}\\sum_{j\\in N(i)}v_j<\/span>；显式更新 <span class=\"katex-inline\">v_i^{\\text{new}}=v_i+\\lambda(c_i-v_i)<\/span>，<span class=\"katex-inline\">\\lambda<\/span> 为步长。<span class=\"katex-inline\">\\lambda=1<\/span> 时顶点移到质心；反复迭代等价于低通滤波，高频邻域差被衰减。曲率流版本沿平均曲率法向移动：<span class=\"katex-inline\">v_i^{\\text{new}}=v_i+h\\,H(v_i)\\mathbf n_i<\/span>，方向与弯曲方向一致。<\/p>\n<p><strong>距离误差形式展开<\/strong>：平面 <span class=\"katex-inline\">P_l<\/span> 方程 <span class=\"katex-inline\">a_lx+b_ly+c_lz+d_l=0<\/span>，单位法向；点 <span class=\"katex-inline\">v_i<\/span> 到平面距离为 <span class=\"katex-inline\">a_lx_i+b_ly_i+c_lz_i+d_l<\/span>。能量 <span class=\"katex-inline\">E_{\\text{dist}}=\\sum_{l\\in N(i)}(a_lx_i+b_ly_i+c_lz_i+d_l)^2<\/span>，对坐标求导得平面约束叠加的线性方程；固定滤波平面后，位置更新为各平面约束的最小二乘解。<\/p>\n<p><strong>梯度误差形式展开<\/strong>：三角形 <span class=\"katex-inline\">(i,j,k)<\/span> 边向量 <span class=\"katex-inline\">e_1=v_j-v_i<\/span>，<span class=\"katex-inline\">e_2=v_k-v_i<\/span>，法向 <span class=\"katex-inline\">\\mathbf n=\\frac{e_1\\times e_2}{\\|e_1\\times e_2\\|}<\/span>。能量惩罚 <span class=\"katex-inline\">\\mathbf n\\cdot\\tilde{\\mathbf n}_f<\/span> 偏离 1 的程度，或 <span class=\"katex-inline\">\\|\\mathbf n-\\tilde{\\mathbf n}_f\\|^2<\/span>。该能量对顶点坐标非线性（叉积带乘积项），迭代时线性化或按法向重建位置。<\/p>\n<p><strong>法向重建位置<\/strong>：固定滤波法向后，遍历三角形把法向约束写成顶点方程；相邻三角形共享顶点，联立稀疏线性系统解新坐标。法向一致性决定重建表面是否平顺。<\/p>\n<p><strong>滤波强度控制<\/strong>：迭代轮数、步长 <span class=\"katex-inline\">\\lambda<\/span>、邻域半径是主要参数；特征权重在高曲率区调低平滑系数。多尺度滤波先粗尺度去大毛刺，再细尺度修局部抖动。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：网格拓扑合格、法向定向一致；噪声为高频抖动；目标表面局部光滑；特征区域可由曲率或法向变化检测。\n<\/li><li>\n边界 1：纯顶点平均在尖角处跨棱边平均，把特征磨圆；需要特征保持权重或法向路线。\n<\/li><li>\n边界 2：过度平滑导致体积收缩，凸凹幅度下降；闭式 Laplacian 平滑的收缩问题可沿法向补偿或用保体积滤波变体。\n<\/li><li>\n边界 3：法向滤波要求面法向先全局定向；相反法向参与平均会把法向拉向零向量。\n<\/li><li>\n边界 4：强噪声伴随拓扑错误（孤立三角形、非流形边）时，滤波前要先修拓扑，位置滤波不能修复错连。\n<\/li><li>\n失败案例：扫描得到的带孔网格，滤波沿孔洞边界移动顶点，孔洞进一步收缩；边界顶点应固定或单独约束。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>顶点滤波 vs 法向滤波<\/strong>：顶点路线直接改坐标，简单快速，受三角形剖分影响明显；法向路线先改法向再重建坐标，法向匹配精确、对剖分鲁棒，计算更贵。\n<\/li><li>\n<strong>距离误差 vs 梯度误差<\/strong>：距离误差约束顶点贴近邻域平面，形式线性；梯度误差约束三角形法向对齐滤波法向，非线性但形状保持更好。\n<\/li><li>\n<strong>光顺 vs 简化<\/strong>：光顺不改变顶点与面片数量，只调位置与法向；简化减少单元数量，属于第 3 章操作。光顺输出可作为简化输入。\n<\/li><li>\n<strong>光顺 vs 重建补洞<\/strong>：光顺处理已有表面的抖动；孔洞、错连属于重建拓扑问题，不在光顺范围内。\n<\/li><li>\n<strong>Laplacian 平滑 vs 曲率流<\/strong>：Laplacian 平滑把顶点拉向邻点质心，方向是邻域平均位置；曲率流沿平均曲率法向移动，方向由弯曲决定。二者在平面邻域方向接近，在高曲率区域差别明显：前者向邻点质心收，后者沿曲面法向推进。\n<\/li><li>\n<strong>法向平均 vs 位置平均<\/strong>：法向是方向量，平均前要保证定向一致，平均后需重新归一化；位置是向量量，直接加权求和。把法向当位置平均会出现零向量，把位置当法向平均会丢失单位长度口径。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 提供平均曲率法向与离散曲率，曲率流光顺沿 <span class=\"katex-inline\">H\\mathbf n<\/span> 方向；c01 提供 1-环邻域结构；c03 配准残留噪声、c04 重建锯齿是光顺输入。后继：c06 参数化在光顺网格上展开，抖动未除会放大参数扭曲；c07 简化在光顺网格上排误差队列；c08 形变假设输入网格平顺，光顺阶段遗留的尖刺会被形变能量当成局部细节保留。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（曲面光顺：基于顶点距离误差与基于法向梯度误差的滤波平滑）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：滤波能量、顶点更新算例与法向重建链条复盘<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把曲面光顺往回追四层：<\/p>\n<ol><li>\n<strong>输入网格质量<\/strong>：拓扑合格、法向定向一致、顶点面片邻接完整；拓扑错误先修，不进滤波。\n<\/li><li>\n<strong>几何量估计<\/strong>：邻点集合、邻接三角形、面法向、离散曲率；这些量决定滤波方向与特征检测。\n<\/li><li>\n<strong>滤波算子选择<\/strong>：顶点位置滤波或法向场滤波；权值（均匀、余切、距离反比）与强度参数（步长、迭代轮数、邻域半径）。\n<\/li><li>\n<strong>能量与更新<\/strong>：距离误差线性约束或梯度误差法向对齐；固定滤波目标后解位置更新，迭代到强度收敛。\n<\/ol>\n<p>依赖链方向：网格质量 → 几何量 → 滤波算子 → 能量更新。下游承接参数化、简化与形变。<\/p>\n<h2>正向推导：顶点路线逐步展开<\/h2>\n<p><strong>第一步，邻域收集。<\/strong> 由半边结构取顶点 <span class=\"katex-inline\">v_i<\/span> 的 1-环邻域 <span class=\"katex-inline\">N(i)<\/span>：邻接顶点 <span class=\"katex-inline\">j\\in N(i)<\/span>，邻接三角形集合 <span class=\"katex-inline\">T(i)<\/span>。<\/p>\n<p><strong>第二步，邻域滤波位置。<\/strong> 均匀权质心 <span class=\"katex-inline\">c_i=\\frac1{|N(i)|}\\sum_{j\\in N(i)}v_j<\/span>；余切权加权质心按 <span class=\"katex-inline\">w_{ij}<\/span> 归一化。滤波位置是邻域几何的代表点。<\/p>\n<p><strong>第三步，显式更新。<\/strong> <span class=\"katex-inline\">v_i^{\\text{new}}=v_i+\\lambda(c_i-v_i)<\/span>。<span class=\"katex-inline\">\\lambda\\in(0,1]<\/span> 为步长：<span class=\"katex-inline\">\\lambda<\/span> 小则单轮改动小、迭代轮数多；<span class=\"katex-inline\">\\lambda=1<\/span> 一步到质心。<\/p>\n<p><strong>第四步，曲率流变体。<\/strong> 方向换成平均曲率法向：<span class=\"katex-inline\">v_i^{\\text{new}}=v_i+h\\,H(v_i)\\mathbf n_i<\/span>，<span class=\"katex-inline\">h<\/span> 为时间步长。曲率大的区域移动幅度大，平面区域 <span class=\"katex-inline\">H=0<\/span> 不动。<\/p>\n<p><strong>第五步，迭代与强度。<\/strong> 每轮更新全部顶点；轮数与步长共同决定衰减强度。高频邻域差在迭代中衰减，低频形状保留；过度迭代把低频特征也压平。<\/p>\n<p><strong>第六步，特征约束。<\/strong> 检测棱边与高曲率顶点，降低其邻域平均权重或固定位置；跨特征线的邻点不参与平均，避免把棱边两侧拉平。<\/p>\n<h2>正向推导：法向路线逐步展开<\/h2>\n<p><strong>第一步，面法向初值。<\/strong> 三角形 <span class=\"katex-inline\">(i,j,k)<\/span> 边向量 <span class=\"katex-inline\">e_1=v_j-v_i<\/span>，<span class=\"katex-inline\">e_2=v_k-v_i<\/span>，<span class=\"katex-inline\">\\mathbf n=e_1\\times e_2<\/span>，归一化 <span class=\"katex-inline\">\\mathbf n/\\|\\mathbf n\\|<\/span>。<\/p>\n<p><strong>第二步，法向滤波。<\/strong> 邻接面片集合上做加权平均：<span class=\"katex-inline\">\\tilde{\\mathbf n}_f=\\frac{\\sum_{g\\in T(f)}w_{fg}\\mathbf n_g}{\\|\\sum w_{fg}\\mathbf n_g\\|}<\/span>。平均前确认所有 <span class=\"katex-inline\">\\mathbf n_g<\/span> 定向一致。<\/p>\n<p><strong>第三步，距离误差能量。<\/strong> 滤波平面 <span class=\"katex-inline\">P_l<\/span> 单位法向 <span class=\"katex-inline\">\\mathbf n_l<\/span>，平面内点 <span class=\"katex-inline\">p_l<\/span>；顶点到平面距离 <span class=\"katex-inline\">d_l=(\\mathbf n_l^\\top(v_i-p_l))^2<\/span>。<span class=\"katex-inline\">E_{\\text{dist}}=\\sum_{l\\in T(i)}d_l<\/span>，对 <span class=\"katex-inline\">v_i<\/span> 求导得平面约束线性方程，最小二乘解更新位置。<\/p>\n<p><strong>第四步，梯度误差能量。<\/strong> 惩罚新三角形法向偏离滤波法向：<span class=\"katex-inline\">E_{\\text{grad}}=\\sum_f\\|\\mathbf n_f(v&#x27;)-\\tilde{\\mathbf n}_f\\|^2<\/span>（或 <span class=\"katex-inline\">1-\\mathbf n_f^\\top\\tilde{\\mathbf n}_f<\/span>）。<span class=\"katex-inline\">\\mathbf n_f<\/span> 由新坐标叉积给出，能量非线性；迭代时固定上一轮法向线性化，解位置后再更新法向。<\/p>\n<p><strong>第五步，联立重建。<\/strong> 相邻三角形共享顶点，各三角形约束汇集到同一顶点方程，形成稀疏线性系统；解出全部新坐标。<\/p>\n<p><strong>第六步，复核。<\/strong> 重建后重新计算面法向，与滤波法向比较残差；残差大的三角形保留标记，进入下一轮滤波或单独人工检查。<\/p>\n<h2>数值算例一：三轮 Laplacian 显式更新<\/h2>\n<p>顶点 <span class=\"katex-inline\">v_0=(0,0,0)<\/span>，邻点 <span class=\"katex-inline\">v_1=(1,0,0)<\/span>，<span class=\"katex-inline\">v_2=(0,1,0)<\/span>，<span class=\"katex-inline\">v_3=(-1,-1,0)<\/span>，步长 <span class=\"katex-inline\">\\lambda=0.5<\/span>。<\/p>\n<ol><li>\n质心 <span class=\"katex-inline\">c_0=((1+0-1)/3,(0+1-1)/3,0)=(0,0,0)<\/span>。第一轮更新 <span class=\"katex-inline\">v_0^{(1)}=(0,0,0)+0.5((0,0,0)-(0,0,0))=(0,0,0)<\/span>，本例质心与顶点重合，不移动。\n<\/li><li>\n取抖动顶点 <span class=\"katex-inline\">v_0=(0.2,0.1,0.05)<\/span>，邻点同上。质心 <span class=\"katex-inline\">c_0=(0,0,0)<\/span>。第一轮 <span class=\"katex-inline\">v_0^{(1)}=(0.2,0.1,0.05)+0.5(-0.2,-0.1,-0.05)=(0.1,0.05,0.025)<\/span>。\n<\/li><li>\n第二轮按新邻点质心近似不变，<span class=\"katex-inline\">v_0^{(2)}=(0.05,0.025,0.0125)<\/span>；第三轮 <span class=\"katex-inline\">(0.025,0.0125,0.00625)<\/span>。\n<\/li><li>\n每轮残差减半，三轮后抖动分量降为初值的 <span class=\"katex-inline\">1/8<\/span>；这是线性低通的衰减口径。\n<\/li><li>\n若邻点本身带尖角形状，质心把尖角两侧位置平均，尖角被倒圆；特征保持权重在该顶点把 <span class=\"katex-inline\">\\lambda<\/span> 调小。\n<\/ol>\n<h2>数值算例二：法向约束的两点小例<\/h2>\n<p>两三角形共享顶点 <span class=\"katex-inline\">v_0<\/span>，滤波法向 <span class=\"katex-inline\">\\tilde{\\mathbf n}_1=(0,0,1)<\/span>，<span class=\"katex-inline\">\\tilde{\\mathbf n}_2=(0,0,1)<\/span>。<\/p>\n<ol><li>\n平面约束取水平面 <span class=\"katex-inline\">z=0<\/span>；两三角形平面方程均为 <span class=\"katex-inline\">z=0<\/span>，距离误差项为 <span class=\"katex-inline\">z_i^2<\/span>。\n<\/li><li>\n能量最小化把共享顶点 <span class=\"katex-inline\">z<\/span> 坐标推向 0；<span class=\"katex-inline\">x,y<\/span> 方向无约束，由其他三角形或边界条件固定。\n<\/li><li>\n若 <span class=\"katex-inline\">\\tilde{\\mathbf n}_1=(0,0,1)<\/span>，<span class=\"katex-inline\">\\tilde{\\mathbf n}_2=(0,1,0)<\/span>，两平面正交；共享顶点同时贴近两个正交平面，解在交线上；能量残差由两平面距离平方和给出。\n<\/li><li>\n法向未定向情形：<span class=\"katex-inline\">\\tilde{\\mathbf n}_2=(0,0,-1)<\/span>，平均后法向抵消为零向量，滤波目标失效；先做定向统一再平均。\n<\/ol>\n<h2>数值算例三：特征边顶点的约束处理<\/h2>\n<p>棱边两侧三角形法向分别为 <span class=\"katex-inline\">\\mathbf n_L,\\mathbf n_R<\/span>，夹角大。<\/p>\n<ol><li>\n特征检测：相邻法向点积 <span class=\"katex-inline\">\\mathbf n_L^\\top\\mathbf n_R<\/span> 小于阈值，判定为棱边。\n<\/li><li>\n该顶点邻域平均只取同侧邻点；跨棱边邻点不进质心计算。\n<\/li><li>\n滤波步长 <span class=\"katex-inline\">\\lambda<\/span> 在棱边顶点调小，位置更新以约束为主。\n<\/li><li>\n若不做分区：跨边平均把两侧法向与位置折中，棱边在一两轮内被磨成圆弧。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>过度平滑体积收缩。<\/strong> Laplacian 平均把边界顶点向内部拉，凸形体积一轮轮减小，薄边消失。处置：沿法向补偿或用保体积滤波；迭代轮数设上限；关键尺寸加边界约束。<\/p>\n<p><strong>相反法向进入平均。<\/strong> 定向不一致时相邻面片法向反向，法向平均向量趋零，重建表面失去朝向。处置：光顺前跑法向定向流程，与 c04 重建共用定向口径。<\/p>\n<p><strong>孔洞边界顶点被拉进内部。<\/strong> 开口网格边界没有外侧邻点，质心偏向内侧，孔洞收缩。处置：边界顶点固定或单列边界滤波规则。<\/p>\n<p><strong>拓扑错误混进滤波。<\/strong> 孤立三角形、非流形边参与邻域平均，滤波把错误拓扑当形状特征保留。处置：光顺前拓扑检查与修复，c01 流形条件先行。<\/p>\n<p><strong>强噪声下法向滤波模糊特征。<\/strong> 法向邻域半径过大，棱边两侧法向互相平均，特征线消失。处置：分尺度滤波，先大半径去大毛刺，再小半径修局部，特征区收窄邻域。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n卡在&quot;顶点滤波和法向滤波先后关系&quot;：法向路线是先滤波法向、再由法向重建位置；顶点路线直接滤波位置。两条路线不要求串在一起，按输入网格噪声类型选择。\n<\/li><li>\n卡在&quot;距离误差为什么是线性的&quot;：固定滤波平面后，顶点到平面距离是坐标的一次式，平方后为二次型，导数为线性方程；平面本身随迭代更新。\n<\/li><li>\n卡在&quot;梯度误差为什么非线性&quot;：法向由叉积给出，边向量含坐标乘积，法向对坐标非线性；迭代中线性化处理。\n<\/li><li>\n卡在&quot;特征怎样保留&quot;：高曲率/大法向夹角区域降权、分区邻域、降低步长；不是停止滤波，而是限制改动方向与幅度。\n<\/li><li>\n卡在&quot;光顺后还要检查什么&quot;：法向残差、体积变化、边界尺寸、特征线位置；复核不通过的区域回退滤波强度。\n<\/ul>\n<h2>补充展开六：距离误差能量的导数推导<\/h2>\n<p>平面 <span class=\"katex-inline\">P_l<\/span> 由单位法向 <span class=\"katex-inline\">\\mathbf n_l=(a_l,b_l,c_l)^\\top<\/span> 与平面内点 <span class=\"katex-inline\">p_l<\/span> 确定，方程 <span class=\"katex-inline\">a_lx+b_ly+c_lz+d_l=0<\/span>，<span class=\"katex-inline\">d_l=-\\mathbf n_l^\\top p_l<\/span>。顶点 <span class=\"katex-inline\">v=(x,y,z)^\\top<\/span> 到平面带符号距离为 <span class=\"katex-inline\">\\mathbf n_l^\\top v+d_l<\/span>，平方距离 <span class=\"katex-inline\">(\\mathbf n_l^\\top v+d_l)^2<\/span>。<\/p>\n<p>对 <span class=\"katex-inline\">v<\/span> 求梯度：<span class=\"katex-inline\">\\nabla_v(\\mathbf n_l^\\top v+d_l)^2=2(\\mathbf n_l^\\top v+d_l)\\mathbf n_l<\/span>。汇集邻接平面：<span class=\"katex-inline\">\\sum_{l\\in T(i)}2(\\mathbf n_l^\\top v_i+d_l)\\mathbf n_l=0<\/span>，写成 <span class=\"katex-inline\">(\\sum_l \\mathbf n_l\\mathbf n_l^\\top)v_i=-\\sum_l d_l\\mathbf n_l<\/span>。左侧 <span class=\"katex-inline\">3\\times3<\/span> 矩阵正定（平面法向不共面时），解得贴近各平面最小二乘位置。平面共面时矩阵秩不足，位置沿平面内方向需要其他约束补充。<\/p>\n<h2>补充展开七：法向重建的稀疏系统结构<\/h2>\n<p>固定滤波法向后，每个三角形把其三个顶点挂进约束方程。三角形法向约束可表达为顶点坐标的线性关系（固定邻边方向时法向垂直于边）；共享顶点的三角形约束叠加到同一行。系统矩阵每行非零元对应三角形三个顶点，结构稀疏，规模为顶点坐标分量数。右端由滤波法向与固定边界点给出。解系统得到新坐标，再重算法向进入下一轮。边界顶点与特征顶点作为固定边界条件进入方程，不参与自由更新。<\/p>\n<h2>补充展开八：滤波参数调优流程<\/h2>\n<p>先看输入噪声类型：整体凹凸选粗尺度顶点滤波，局部法向毛刺选法向路线。参数起点：步长 <span class=\"katex-inline\">\\lambda=0.3<\/span>，迭代三轮；可视化对比前后网格，记录体积变化与特征线位置。若抖动残留，增加轮数而非加大步长；若特征倒圆，降低特征区权重或收窄邻域。每轮输出残差统计：顶点位移均值、法向残差均值；残差下降趋平即停，避免无效迭代。调参顺序：先定路线（顶点/法向），再定邻域半径，末段调步长与轮数。<\/p>\n<h2>补充展开九：光顺质量评价口径<\/h2>\n<p>定量指标：顶点位移与原始网格的平均距离、体积变化率、特征线偏移量；定性指标：表面平顺度、棱边保留、孔洞边界稳定性。评价时把自由曲面区域与特征区域分开统计：自由区允许较大位移，特征区位移应受约束。只看整体平均距离会掩盖特征区被磨平的问题，也会掩盖边界孔洞收缩。对照基准：保留一个未滤波原始网格作为参照，所有改动量相对原始网格计算。<\/p>\n<h2>补充展开十：常见光顺算法路线对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>路线<\/th><th>作用量<\/th><th>特点<\/th><th>主要风险<\/th><\/tr><\/thead><tbody><tr><td>Laplacian 平滑<\/td><td>顶点位置<\/td><td>实现简单、迭代快<\/td><td>体积收缩、棱角倒圆<\/td><\/tr><tr><td>曲率流<\/td><td>沿曲率法向<\/td><td>方向贴合弯曲<\/td><td>步长过大不稳定<\/td><\/tr><tr><td>Taubin 类双滤波<\/td><td>顶点位置<\/td><td>正负扩散交替缓解收缩<\/td><td>参数两组<\/td><\/tr><tr><td>双边/特征保持滤波<\/td><td>位置+特征权重<\/td><td>棱边两侧不平均<\/td><td>权值检测依赖曲率<\/td><\/tr><tr><td>法向滤波<\/td><td>面法向<\/td><td>对剖分鲁棒、法向匹配准<\/td><td>重建系统非线性<\/td><\/tr><tr><td>数据驱动法向滤波<\/td><td>法向回归<\/td><td>细节保留依赖训练集<\/td><td>样本外泛化受限<\/td><\/tr><\/tbody><\/table><\/div>\n<p>选择口径：自由曲面低噪声用 Laplacian；怕收缩用 Taubin 类；特征模型用双边或法向路线；复杂噪声场景参考数据驱动方法，但要核对训练样本覆盖目标模型类型。<\/p>\n<h2>补充展开十一：边界与开口网格的光顺规则<\/h2>\n<p>开口网格边界环上的顶点只有内侧邻点，质心偏向内部；自由边三角形只有一侧面片，法向估计缺少邻接约束。处置规则：边界顶点位置固定，只更新内部顶点；或对边界顶点单列边界滤波算子，邻域只取环上相邻边界点。法向滤波在自由边上把邻接面片限定为环内面片，不向虚拟外侧补法向。封闭网格无此问题；混合模型（部分开口、部分封闭）要逐边界环标记后再跑滤波，不能套用统一内部邻域。<\/p>\n<h2>补充展开十二：光顺前后的网格记录口径<\/h2>\n<p>每轮滤波记录：顶点位移向量、更新后坐标、法向残差、被固定的特征顶点与边界顶点列表。回退时按记录恢复上一轮状态；参数调优对照多轮结果时，保留每轮网格快照而非只存最终版本。特征顶点名单在滤波前一次性确定并写入记录，后续轮次沿用同一名单，避免特征检测随表面变化漂移。<\/p>\n<h2>补充展开十三：光顺在管线中的位置与时序<\/h2>\n<p>光顺位于重建之后、参数化/简化/形变之前。时序不能颠倒：先光顺再简化，避免噪声尖刺被简化保护；先光顺再参数化，避免抖动顶点拉大扭曲；先光顺再提取描述子，避免高频抖动污染统计。重建刚输出的网格可能带配准残留错位，光顺第一轮优先处理接缝区域；边界与特征区域按单列规则处理，不进入内部邻域平均。光顺输出记录原始网格参照，供后续环节计算改动量。若后续环节反馈局部毛刺残留，回到光顺记录定位是哪一轮滤波强度不足，而不是直接对成品网格二次强滤波。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出 Laplacian 显式更新公式，说明步长 <span class=\"katex-inline\">\\lambda<\/span> 与迭代轮数怎样控制强度。\n<\/li><li>\n曲率流更新方向与 Laplacian 平均方向在平面区域和高曲率区域各有什么差别？\n<\/li><li>\n距离误差能量与梯度误差能量各自约束什么？哪一个对坐标非线性？\n<\/li><li>\n法向滤波前为什么必须先定向？未定向时平均法向会发生什么？\n<\/li><li>\n特征边顶点为什么要分区邻域？跨边平均会造成什么后果？\n<\/li><li>\n体积收缩从哪一步产生？工程上有哪些补偿或约束方式？\n<\/ol>\n<h2>补充展开一：滤波权值口径对照<\/h2>\n<p>均匀权：邻点等权，实现简单，三角形大小混杂时大小三角形影响相同。余切权：按对顶角余切分配，几何上与离散 Laplace 口径一致，钝角区可能出现负权。距离反比：越近的邻点影响越大，适合非均匀采样。三种权值都要归一化，保证邻域代表点落在邻点凸组合范围内；负权区域不保证凸组合性质，需要标记。<\/p>\n<h2>补充展开二：多尺度滤波顺序<\/h2>\n<p>粗尺度：大邻域平均，去除低频大毛刺与整体凹凸偏差；细尺度：小邻域修高频局部抖动。顺序反过来时，细尺度先把局部噪声抹掉，粗尺度再压形状，特征容易被粗尺度轮次一并削弱。特征检测在粗尺度之后、细尺度之前做，依据大尺度曲率识别棱边，再在细尺度保护。<\/p>\n<h2>补充展开三：与曲率算子的衔接<\/h2>\n<p>光顺方向量来自 c02 离散算子：曲率流用平均曲率法向，特征检测用离散高斯曲率符号与法向夹角。光顺轮次过多时曲率估计本身被平滑改变，特征检测要在滤波前先算一遍并记录特征顶点，不能每轮重新检测后跟随被磨掉的特征。<\/p>\n<h2>补充展开四：易错口径纠正<\/h2>\n<ul><li>\n把光顺当简化：光顺不动单元数量；想减顶点走简化路线。\n<\/li><li>\n把法向单位长度丢掉：法向平均后必须重新归一化，否则法向长度随邻域大小变化。\n<\/li><li>\n把边界当内部顶点处理：开口网格边界缺外侧邻点，质心偏内，需要单列规则。\n<\/li><li>\n用一轮强滤波代替多轮弱滤波：大步长改动容易越过目标位置，多轮小步长更稳定。\n<\/ul>\n<h2>补充展开五：下游衔接速查<\/h2>\n<ul><li>\nc06 参数化：抖动顶点会拉大参数扭曲，光顺是参数化前置条件。\n<\/li><li>\nc07 简化：QEM 误差队列基于平顺网格估计，噪声尖刺会被误判为大误差边优先折叠。\n<\/li><li>\nc08 形变：输入网格平顺，局部旋转约束才稳定；尖刺会被 ARAP 邻域当局部细节保留。\n<\/li><li>\nc09 描述子：曲率与法向统计在光顺后提取，避免高频抖动污染特征直方图。\n<\/ul><\/div><\/details>", "kind": "concept", "title": "曲面光顺：基于顶点距离误差与基于法向梯度误差的滤波平滑"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.85<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">离散曲率与 Laplace–Beltrami 算子：余切权格式、平均曲率法向与高斯曲率<\/a><\/span><\/div><h1>网格参数化：映射优化模型、Jacobian 扭曲度量、调和/共形能量与防翻转<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch03（原书 §3.1，PDF 第 85–100 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>网格参数化是把三维曲面网格映射到二维参数域 <span class=\"katex-inline\">\\phi:V\\to\\mathbb R^2<\/span> 的过程，目标函数由局部扭曲能量与位置约束构成；扭曲度量按三角形 Jacobian 的奇异值与角度定义，映射须满足局部单射与无翻转条件，二次能量解线性方程组，非二次能量按局部到整体交替迭代。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>三维网格要贴纹理、做跨模型对应、重采样到规则网格，都需要二维坐标。三维表面本身不是平面，直接摊开必然产生拉伸与压缩；参数化要回答：每个三维顶点落到二维参数域的什么位置，三角形之间怎样摊，才能让局部形变尽量小、纹理不错位、三角形不翻面重叠。<\/p>\n<p>裸把顶点坐标降到二维（比如删去一个坐标）不解决问题：弯曲曲面投影后三角形重叠，不同三维位置映到同一二维位置，纹理镜像错乱。困难来自两方面：一是映射质量，拉伸、压缩、角变形要度量并最小化；二是可行性，映射不能产生翻转与自重叠，否则对应关系在翻面区域失效。<\/p>\n<p>工程上参数化分两类输入：开网格带边界，边界顶点可给定参数域位置；闭合曲面或高弯曲区域无法单片摊平，要先分割成若干与圆盘同胚的片，分别参数化再缝合。能量设计决定映射偏保角、保面积还是保边长；求解方式取决于能量对参数坐标是否二次。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>映射模型<\/strong>：顶点 <span class=\"katex-inline\">v_i<\/span> 映到参数域 <span class=\"katex-inline\">u_i=(x_i,y_i)<\/span>；目标函数<\/p>\n<div class=\"katex-block\">E_{\\text{param}}=\\sum_{t\\in F}e(\\phi_t)S(t)+\\sum_i\\omega_i\\|u_i-\\bar u_i\\|^2<\/div>\n<p><span class=\"katex-inline\">e(\\phi_t)<\/span> 为三角形单元形变能量密度，<span class=\"katex-inline\">S(t)<\/span> 为单元面积；第二项为位置约束，<span class=\"katex-inline\">\\bar u_i<\/span> 为给定参数域位置，<span class=\"katex-inline\">\\omega_i<\/span> 为约束权重。<\/p>\n<p><strong>Jacobian<\/strong>：三角形上映射 <span class=\"katex-inline\">J<\/span> 由两条参数边向量构成二维矩阵；奇异值 <span class=\"katex-inline\">\\sigma_1,\\sigma_2<\/span> 分别刻画两个主拉伸方向与比例。<\/p>\n<p><strong>扭曲能量族<\/strong>：<\/p>\n<ol><li>\nDirichlet 能量：奇异值平方和 <span class=\"katex-inline\">\\sigma_1^2+\\sigma_2^2<\/span>；\n<\/li><li>\n共形能量：两奇异值相等方向夹角保持，<span class=\"katex-inline\">(\\sigma_1-\\sigma_2)^2<\/span> 类度量；\n<\/li><li>\n伸缩能量：分方向惩罚拉伸与压缩；\n<\/li><li>\nGreen–Lagrange 应变张量：<span class=\"katex-inline\">J^\\top J-I<\/span>；\n<\/li><li>\nARAP 能量：邻域只旋转不伸缩；\n<\/li><li>\nABF 类：在参数域平摊三角形角度。\n<\/ol>\n<p><strong>非退化条件<\/strong>：局部单射 <span class=\"katex-inline\">\\det J\\neq0<\/span>；无翻转：参数域三角形定向面积为正，<span class=\"katex-inline\">\\det J&amp;gt;0<\/span>（与三维面片定向一致）。<\/p>\n<p><strong>单片与分片<\/strong>：单片参数化把整张开网格映到一片参数域；闭合或高弯曲网格分割为多片，各片独立参数化，边界对应在缝合时对齐。<\/p>\n<p><strong>求解结构<\/strong>：能量对 <span class=\"katex-inline\">u_i<\/span> 二次时，求导得到稀疏线性方程组；非二次能量局部到整体交替：固定其余顶点优化局部旋转/仿射，再整体更新坐标。<\/p>\n<p><strong>应用口径<\/strong>：纹理贴图把二维图像按参数坐标采样回三维表面；跨模型对应把同一参数域上的坐标作为顶点匹配依据；重网格化在二维规则网格上采样后映回三维；纹理压缩与网格序列化以参数域坐标为中间存储。不同应用对扭曲度量偏好不同：贴图关注角度与局部比例，重采样关注面积均匀，跨模型对应关注边界与特征线对齐。<\/p>\n<p><strong>正例<\/strong>：开网格边界钉住参数域矩形四角，调和映射摊到平面，三角形保持正定向。<\/p>\n<p><strong>反例<\/strong>：闭合球面强行单片参数化，必然出现拉伸集中与翻转；不做防翻转约束，局部三角形翻到参数域另一侧，纹理重叠。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>三角形映射的局部线性化<\/strong>：曲面在三角形内分片线性，映射在三角形内为线性变换；<span class=\"katex-inline\">J<\/span> 由三维边向量到二维边向量的映射矩阵给出。能量密度按三角形定义，单元面积 <span class=\"katex-inline\">S(t)<\/span> 把三维尺度折算进能量。<\/p>\n<p><strong>Dirichlet 能量展开<\/strong>：共形参数下 Dirichlet 能量与 <span class=\"katex-inline\">|J|^2<\/span> 类度量对应；对参数坐标二次，求导后邻接顶点权重构成线性系统，边界约束作为边值条件。<\/p>\n<p><strong>共形条件<\/strong>：<span class=\"katex-inline\">J<\/span> 为相似变换（旋转加均匀缩放）时两奇异值相等、夹角保持；共形能量惩罚偏离相似变换的分量。调和映射在边界给定条件下最小化 Dirichlet 能量，内部光滑扩散边界位置。<\/p>\n<p><strong>Jacobian 与可行性<\/strong>：<span class=\"katex-inline\">\\det J&amp;gt;0<\/span> 保证定向一致，三角形不翻面；<span class=\"katex-inline\">\\det J=0<\/span> 映射塌缩；<span class=\"katex-inline\">\\det J&amp;lt;0<\/span> 翻面。无翻转条件是不等式约束，二次线性求解不天然满足，需要约束加入或迭代中检测修正。<\/p>\n<p><strong>局部到整体交替<\/strong>：非二次能量（ARAP 式）把局部旋转 <span class=\"katex-inline\">R_i<\/span> 与参数位置 <span class=\"katex-inline\">u<\/span> 分开：固定位置估局部旋转，固定旋转解位置二次系统；两步交替到能量收敛。<\/p>\n<p><strong>分片依据<\/strong>：曲面拓扑亏格或弯曲程度超过单片摊平能力时，沿特征线分割；每片边界长度与弯曲度受控，片内扭曲落在可行范围。分割线选择兼顾几何特征与片内扭曲：沿棱边、曲率线或交互指定路径切开，缝合边界在参数域上配对。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：输入为流形三角网格；边界可给定参数域位置或可自由展开；目标扭曲度量与应用匹配（贴图偏共形，重采样偏面积/边长）。\n<\/li><li>\n边界 1：闭合曲面无边界，单片参数化不可行；必须分割或用球面参数化。\n<\/li><li>\n边界 2：强约束位置下内部扭曲集中，边界钉得过死会把拉伸堆到内部三角形。\n<\/li><li>\n边界 3：线性求解不显式防翻转，能量低谷可能位于翻折叠加构型；需要翻转检测与约束回退。\n<\/li><li>\n边界 4：分片缝合处两片参数域边界要对齐，否则纹理跨片断裂。\n<\/li><li>\n失败案例：粗网格上三角形稀疏，Jacobian 估计粗糙，参数域锯齿明显；需先加密网格或在参数域平滑。\n<\/li><li>\n网格质量影响：细长三角形的 Jacobian 条件数大，微小参数坐标扰动被放大成大扭曲；参数化前的网格质量检查与重网格化是前置工序。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>参数化 vs 简化<\/strong>：参数化建立三维到二维的坐标映射，顶点面片数不变；简化减少单元数量。两者可先后使用：先参数化再在二维域重采样简化。\n<\/li><li>\n<strong>共形 vs 保面积<\/strong>：共形保角不保面积，局部均匀缩放允许；保面积限制面积比例但允许角变形。贴图常用共形，纹理密度均匀常用面积保持。\n<\/li><li>\n<strong>调和映射 vs ARAP 参数化<\/strong>：调和映射最小化 Dirichlet 能量，全局解线性系统；ARAP 约束局部邻域只旋转不伸缩，非线性交替优化，细节保持更好。\n<\/li><li>\n<strong>单片 vs 分片<\/strong>：单片无内部缝合缝，但扭曲受拓扑限制；分片扭曲低但引入缝合边界，跨片对应要管理。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 提供网格邻接与定向；c02 曲率与法向辅助分割选线；c05 光顺后的网格减少抖动扭曲。后继：c07 渐进网格与多分辨率可在参数域组织；c08 形变的局部旋转约束与 ARAP 参数化能量形式相通；c09 形状匹配在参数域对应基础上建立描述子比较。参数化是三维网格走向二维处理空间的桥梁。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（网格参数化：映射优化模型、Jacobian 扭曲度量、调和/共形能量与防翻转）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：Jacobian 度量、调和映射线性系统与防翻转算例复盘<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把参数化往回追五层：<\/p>\n<ol><li>\n<strong>网格输入<\/strong>：流形三角网格、顶点三维坐标、面片定向一致；网格质量决定 Jacobian 估计是否稳定。\n<\/li><li>\n<strong>边界条件<\/strong>：边界顶点参数域位置给定（钉边界）或自由展开；闭合曲面先分割成圆盘片。\n<\/li><li>\n<strong>扭曲度量选择<\/strong>：Dirichlet/共形/伸缩/Green–Lagrange/ARAP/ABF，按应用选能量密度。\n<\/li><li>\n<strong>可行性约束<\/strong>：<span class=\"katex-inline\">\\det J&amp;gt;0<\/span> 无翻转、局部单射；约束在求解中检测或加入。\n<\/li><li>\n<strong>求解与输出<\/strong>：二次能量解线性系统，非二次能量局部到整体交替；输出二维坐标与扭曲分布。\n<\/ol>\n<p>依赖链方向：网格 → 边界条件 → 能量度量 → 可行性约束 → 求解输出。<\/p>\n<h2>正向推导：三角形映射与能量度量<\/h2>\n<p><strong>第一步，局部线性映射。<\/strong> 三角形三维顶点 <span class=\"katex-inline\">v_a,v_b,v_c<\/span>，参数域顶点 <span class=\"katex-inline\">u_a,u_b,u_c<\/span>。边向量 <span class=\"katex-inline\">e_1=v_b-v_a<\/span>，<span class=\"katex-inline\">e_2=v_c-v_a<\/span>；参数边 <span class=\"katex-inline\">\\hat e_1=u_b-u_a<\/span>，<span class=\"katex-inline\">\\hat e_2=u_c-u_a<\/span>。映射在三角形内线性，Jacobian 满足 <span class=\"katex-inline\">\\hat E=JE<\/span>，<span class=\"katex-inline\">E=[e_1,e_2]<\/span>，<span class=\"katex-inline\">\\hat E=[\\hat e_1,\\hat e_2]<\/span>。<\/p>\n<p><strong>第二步，奇异值分解。<\/strong> <span class=\"katex-inline\">J=U\\Sigma V^\\top<\/span>，奇异值 <span class=\"katex-inline\">\\sigma_1\\ge\\sigma_2\\ge0<\/span>。<span class=\"katex-inline\">\\sigma_1/\\sigma_2<\/span> 为各向异性拉伸比；<span class=\"katex-inline\">\\det J=\\sigma_1\\sigma_2<\/span> 为面积缩放比；方向由 <span class=\"katex-inline\">U,V<\/span> 给出。<\/p>\n<p><strong>第三步，能量密度定义。<\/strong><\/p>\n<ul><li>\nDirichlet：<span class=\"katex-inline\">e_D=\\sigma_1^2+\\sigma_2^2<\/span>；\n<\/li><li>\n共形：<span class=\"katex-inline\">e_C=(\\sigma_1-\\sigma_2)^2<\/span>（偏离相似变换）；\n<\/li><li>\n伸缩：分别惩罚 <span class=\"katex-inline\">\\sigma_1<\/span>、<span class=\"katex-inline\">\\sigma_2<\/span> 偏离 1；\n<\/li><li>\nGreen–Lagrange：应变张量 <span class=\"katex-inline\">J^\\top J-I<\/span>，元素含边长与角度变化。\n<\/ul>\n<p><strong>第四步，单元求和。<\/strong> 总能量 <span class=\"katex-inline\">E=\\sum_t e(\\phi_t)S(t)<\/span>，<span class=\"katex-inline\">S(t)<\/span> 为三维三角形面积；位置约束项 <span class=\"katex-inline\">\\sum_i\\omega_i\\|u_i-\\bar u_i\\|^2<\/span> 叠加。<\/p>\n<p><strong>第五步，二次情形求导。<\/strong> Dirichlet 类能量对 <span class=\"katex-inline\">u_i<\/span> 二次；对 <span class=\"katex-inline\">u_i<\/span> 求导令其为零，得到邻接顶点线性方程组。边界顶点 <span class=\"katex-inline\">\\bar u_i<\/span> 固定为边值，内部顶点未知量求解。<\/p>\n<p><strong>第六步，非二次情形交替。<\/strong> ARAP 式能量含局部旋转 <span class=\"katex-inline\">R_i<\/span>：固定 <span class=\"katex-inline\">\\{u\\}<\/span> 估计 <span class=\"katex-inline\">R_i<\/span>（正交极分解），固定 <span class=\"katex-inline\">R_i<\/span> 解 <span class=\"katex-inline\">u<\/span> 二次系统；交替到能量下降趋平。<\/p>\n<p><strong>第七步，翻转检测。<\/strong> 每个三角形算 <span class=\"katex-inline\">\\det J<\/span>；小于等于零的三角形标记，回退约束或加密局部网格；参数域相邻三角形重叠按二维邻接检查。<\/p>\n<h2>数值算例一：单个三角形的 Jacobian 与奇异值<\/h2>\n<p>三维三角形 <span class=\"katex-inline\">v_a=(0,0,0)<\/span>，<span class=\"katex-inline\">v_b=(1,0,0)<\/span>，<span class=\"katex-inline\">v_c=(0,1,0)<\/span>。参数域 <span class=\"katex-inline\">u_a=(0,0)<\/span>，<span class=\"katex-inline\">u_b=(2,0)<\/span>，<span class=\"katex-inline\">u_c=(0,1)<\/span>。<\/p>\n<ol><li>\n三维边 <span class=\"katex-inline\">e_1=(1,0,0)<\/span>，<span class=\"katex-inline\">e_2=(0,1,0)<\/span>；参数边 <span class=\"katex-inline\">\\hat e_1=(2,0)<\/span>，<span class=\"katex-inline\">\\hat e_2=(0,1)<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">J=\\begin{pmatrix}2&amp;0\\\\0&amp;1\\end{pmatrix}<\/span>（三维平面到二维的恒等嵌入下）。\n<\/li><li>\n奇异值 <span class=\"katex-inline\">\\sigma_1=2<\/span>，<span class=\"katex-inline\">\\sigma_2=1<\/span>；<span class=\"katex-inline\">\\det J=2&amp;gt;0<\/span>，定向保持。\n<\/li><li>\nDirichlet 能量 <span class=\"katex-inline\">e_D=4+1=5<\/span>；共形偏差 <span class=\"katex-inline\">(\\sigma_1-\\sigma_2)^2=1<\/span>；面积缩放比 2，沿 <span class=\"katex-inline\">e_1<\/span> 方向拉伸一倍。\n<\/li><li>\n若参数域 <span class=\"katex-inline\">u_c=(0,-1)<\/span>：<span class=\"katex-inline\">\\hat e_2=(0,-1)<\/span>，<span class=\"katex-inline\">J=\\mathrm{diag}(2,-1)<\/span>，<span class=\"katex-inline\">\\det J=-2&amp;lt;0<\/span>，三角形翻面，无翻转条件违反。\n<\/ol>\n<h2>数值算例二：三顶点调和映射线性系统<\/h2>\n<p>边界顶点 <span class=\"katex-inline\">u_1=(0,0)<\/span>，<span class=\"katex-inline\">u_3=(1,0)<\/span> 固定；自由顶点 <span class=\"katex-inline\">u_2=(x,y)<\/span>。两个三角形共享边 <span class=\"katex-inline\">(1,3)<\/span>，余切权 <span class=\"katex-inline\">w_{12}=w_{23}=1<\/span>，<span class=\"katex-inline\">w_{13}<\/span> 不进内部顶点方程。<\/p>\n<ol><li>\nDirichlet 调和方程在顶点 2：<span class=\"katex-inline\">w_{12}(u_2-u_1)+w_{23}(u_2-u_3)=0<\/span>。\n<\/li><li>\n代入：<span class=\"katex-inline\">(x,y)-(0,0)+(x,y)-(1,0)=0<\/span>，即 <span class=\"katex-inline\">2x-1=0<\/span>，<span class=\"katex-inline\">2y=0<\/span>。\n<\/li><li>\n解 <span class=\"katex-inline\">u_2=(0.5,0)<\/span>，位于边界两点连线中点；三角形退化为线（二维布局问题，实际邻域有第三方向约束）。\n<\/li><li>\n增加邻接三角形给出 <span class=\"katex-inline\">y<\/span> 方向权重后，<span class=\"katex-inline\">u_2<\/span> 落在二维平面内部；方程结构不变：内部顶点位置为邻接边界点的加权调和平均。\n<\/ol>\n<h2>数值算例三：翻转三角形的定位与回退<\/h2>\n<p>参数域网格遍历三角形 <span class=\"katex-inline\">t<\/span>，算 <span class=\"katex-inline\">\\det J_t<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">\\det J_t&amp;gt;0<\/span>：定向一致，保留；\n<\/li><li>\n<span class=\"katex-inline\">\\det J_t=0<\/span>：面积塌缩，标记退化；\n<\/li><li>\n<span class=\"katex-inline\">\\det J_t&amp;lt;0<\/span>：翻面，记录顶点坐标与邻接关系。\n<p>回退路径：放松局部位置约束、减小边界钉制权重、在该区域加密三角形，重解线性系统；翻面三角形在参数域与相邻三角形重叠时，纹理采样出现镜像。<\/p>\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>闭合球面强行单片展开。<\/strong> 球面与平面不同胚，任何单片映射都存在拓扑极点；极点邻域拉伸集中，出现大奇异值与翻转。处置：分割成圆盘片或用球面参数域。<\/p>\n<p><strong>边界钉得过死。<\/strong> 边界顶点全部固定到矩形，内部可动范围小，拉伸堆到内部三角形；边界扭曲比与内部扭曲比失衡。处置：边界约束权重 <span class=\"katex-inline\">\\omega_i<\/span> 分级，特征边界钉死，自由边界允许调整。<\/p>\n<p><strong>细长三角形进参数化。<\/strong> 大条件数 <span class=\"katex-inline\">J<\/span> 使微小坐标扰动放大；参数域锯齿、局部翻转。处置：先重网格化改善三角形形状。<\/p>\n<p><strong>不做翻转检测直接贴图。<\/strong> 线性求解可能落到翻折叠加构型，翻面区域纹理镜像重叠；下游贴图看不出发酵原因，回溯参数域才发现负行列式。<\/p>\n<p><strong>分片缝合错位。<\/strong> 两片边界参数坐标未配对，缝合线两侧纹理断裂。处置：分割边界顶点成对记录，参数化后对齐边界坐标。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n卡在&quot;Jacobian 为什么在三角形内是常数&quot;：三角形分片线性，映射分片线性，线性变换在单元内不变；<span class=\"katex-inline\">J<\/span> 按三角形定义，不在顶点定义。\n<\/li><li>\n卡在&quot;共形和保面积怎么选&quot;：回到第三步。共形保角、允许均匀缩放；保面积限制面积比、允许角变形。贴图选共形，均匀重采样选面积保持。\n<\/li><li>\n卡在&quot;调和映射为什么是线性系统&quot;：Dirichlet 能量二次，求导后系数矩阵只含邻接权，边界为边值；非二次能量才需要交替迭代。\n<\/li><li>\n卡在&quot;无翻转为为什么线性求解不保证&quot;：<span class=\"katex-inline\">\\det J&amp;gt;0<\/span> 是不等式约束，普通二次优化不把方向符号纳入目标；需显式检测或约束加入。\n<\/li><li>\n卡在&quot;分割线选在哪&quot;：沿棱边、曲率线或交互路径；目标是每片接近圆盘、边界长度受控。\n<\/ul>\n<h2>补充展开六：Dirichlet 能量求导到线性方程<\/h2>\n<p>三角形 <span class=\"katex-inline\">t<\/span> 顶点 <span class=\"katex-inline\">i,j,k<\/span>，二维参数边 <span class=\"katex-inline\">\\hat e_{ij}=u_j-u_i<\/span>。Dirichlet 单元能量对二维坐标可写成邻边二次型。总能量 <span class=\"katex-inline\">E=\\sum_t E_t(u)<\/span> 对内部顶点 <span class=\"katex-inline\">u_i<\/span> 求偏导：<\/p>\n<div class=\"katex-block\">\\frac{\\partial E}{\\partial u_i}=\\sum_{j\\in N(i)}w_{ij}(u_i-u_j)<\/div>\n<p>令导数为零得 <span class=\"katex-inline\">\\sum_{j\\in N(i)}w_{ij}(u_i-u_j)=0<\/span>，即 <span class=\"katex-inline\">u_i=\\frac{\\sum_j w_{ij}u_j}{\\sum_j w_{ij}}<\/span>，顶点位置为邻接顶点加权平均。系数矩阵每行对应一个内部顶点，非零元为邻接权；边界顶点项移到右端。两个坐标分量 <span class=\"katex-inline\">x,y<\/span> 分别组方程，矩阵相同、右端不同。<\/p>\n<h2>补充展开七：分片参数化流程<\/h2>\n<ol><li>\n分割：沿特征线或交互路径把网格切成圆盘片，记录跨片边界顶点配对表。\n<\/li><li>\n片内参数化：每片独立选参数域，固定缝合边界初值，解能量系统。\n<\/li><li>\n缝合对齐：两片共享边界的参数坐标配对比对，调整边界顶点使配对位置一致。\n<\/li><li>\n扭曲复核：逐片统计奇异值分布与翻转三角形；高扭曲片返回分割步骤重切。\n<\/li><li>\n全局拼接：参数域坐标存回顶点，跨片纹理与对应按配对表索引。\n<p>分割不当会让单片扭曲超限；缝合错位会让跨片纹理断裂，两步都要记录顶点配对。<\/p>\n<\/ol>\n<h2>补充展开八：常见参数化路线对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>路线<\/th><th>能量<\/th><th>求解<\/th><th>特点<\/th><\/tr><\/thead><tbody><tr><td>调和映射<\/td><td>Dirichlet<\/td><td>线性系统<\/td><td>光滑扩散、实现简单<\/td><\/tr><tr><td>共形映射<\/td><td>保角偏差<\/td><td>线性/非线性<\/td><td>角度保持、允许缩放<\/td><\/tr><tr><td>角度平摊 ABF<\/td><td>三角形角度偏差<\/td><td>迭代<\/td><td>角度均匀、网格依赖<\/td><\/tr><tr><td>ARAP 参数化<\/td><td>局部旋转不变<\/td><td>局部到整体交替<\/td><td>细节保持、计算贵<\/td><\/tr><tr><td>分片投影<\/td><td>局部平面投影<\/td><td>分片独立<\/td><td>快、缝合需处理<\/td><\/tr><\/tbody><\/table><\/div>\n<p>选择口径：开网格初值用调和；纹理贴图用共形；局部细节要求高用 ARAP；实时预览用分片投影。<\/p>\n<h2>补充展开九：线性系统规模与求解<\/h2>\n<p>内部顶点数为 <span class=\"katex-inline\">n<\/span>，未知量 <span class=\"katex-inline\">2n<\/span>（<span class=\"katex-inline\">x,y<\/span> 分量）。系数矩阵每行非零元对应 1-环邻接边数，结构稀疏对称正定（调和 Dirichlet 口径下）。求解用 Cholesky 分解或共轭梯度；边界约束以边值进入右端。非二次 ARAP 每轮重解一次二次系统，轮数由能量阈值控制。矩阵在网格拓扑不变时可复用分解，参数域调整只改右端。<\/p>\n<h2>补充展开十：扭曲分布评估流程<\/h2>\n<p>参数解出后逐三角形算 <span class=\"katex-inline\">\\sigma_1,\\sigma_2,\\det J<\/span>：<\/p>\n<ol><li>\n统计拉伸比 <span class=\"katex-inline\">\\sigma_1/\\sigma_2<\/span> 的直方图与最大值位置；\n<\/li><li>\n面积缩放 <span class=\"katex-inline\">|\\det J|<\/span> 分布，标记压缩与拉伸集中区；\n<\/li><li>\n角度偏差对照三维面片角；\n<\/li><li>\n翻转三角形清单回退处理；\n<\/li><li>\n扭曲热力图叠回三维网格定位问题区域。\n<p>平均扭曲低不代表局部没问题，局部集中区要单独列出。<\/p>\n<\/ol>\n<h2>补充展开十一：正方形网格调和展开小例<\/h2>\n<p>四顶点四边形分两三角形，边界四角固定到 <span class=\"katex-inline\">(0,0),(1,0),(1,1),(0,1)<\/span>。内部顶点 <span class=\"katex-inline\">u_c<\/span> 邻接四个边界点，调和方程给出 <span class=\"katex-inline\">u_c<\/span> 为四邻点加权平均。均匀权下 <span class=\"katex-inline\">u_c=(0.5,0.5)<\/span>；两三角形 Jacobian 对角元接近 1，面积缩放接近 1，无翻转。边界弯曲时内部位置按权值偏向弯曲侧；权值由三角形角度余切决定，不等权时 <span class=\"katex-inline\">u_c<\/span> 不在几何中点。<\/p>\n<h2>补充展开十二：参数化与网格编辑的边界划分<\/h2>\n<p>参数化输出的二维坐标是静态映射；网格形变在三维空间调整顶点，二者都可用局部旋转能量但用途不同：参数化把曲面摊到二维，形变把三维网格按交互拖动改变形状。参数化坐标可作为形变的初始对应，形变结果可再参数化检查扭曲。把二维坐标当三维位置存储会导致混淆：参数域 <span class=\"katex-inline\">u<\/span> 不保留三维法向与曲率信息。<\/p>\n<h2>补充展开十三：常见失败现象与回溯路径<\/h2>\n<ul><li>\n纹理局部拉伸拉长：该区域 <span class=\"katex-inline\">\\sigma_1<\/span> 偏大，回溯边界约束或分割线。\n<\/li><li>\n图案局部镜像：<span class=\"katex-inline\">\\det J&amp;lt;0<\/span>，翻面三角形清单定位。\n<\/li><li>\n跨片纹理断裂：缝合边界配对错位，核对边界顶点表。\n<\/li><li>\n内部扭曲集中：边界钉制过死，降低 <span class=\"katex-inline\">\\omega_i<\/span> 后重解。\n<\/li><li>\n参数域锯齿：输入网格细长三角形多，先重网格化再参数化。\n<p>回溯顺序：先查网格质量与定向，再查边界约束，末段查能量度量选择。<\/p>\n<\/ul>\n<h2>补充展开十四：参数化数据记录口径<\/h2>\n<p>一次参数化输出记录：每个顶点二维坐标、三角形 Jacobian 与奇异值、翻转清单、边界顶点配对表、所用能量类型与权重参数。后续贴图按顶点索引取二维坐标；跨片对应按配对表检索；扭曲复盘按清单定位三角形。记录缺失时无法回溯问题区域，也不能在同一网格上更换能量后对比结果。<\/p>\n<h2>补充展开十五：参数化常见输入输出记录<\/h2>\n<p>输入记录：网格拓扑、三维坐标、边界顶点标记、选用能量与权重；输出记录：二维坐标、三角形 Jacobian 与奇异值、翻转清单、扭曲热力图、缝合配对表。参数化结果复用时，按顶点索引取二维坐标；换能量方法重解时保留输入网格与边界标记，不重复做分割判定。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出参数化总目标函数两项组成，说明 <span class=\"katex-inline\">e(\\phi_t)<\/span>、<span class=\"katex-inline\">S(t)<\/span>、<span class=\"katex-inline\">\\omega_i<\/span> 的含义。\n<\/li><li>\nJacobian 奇异值刻画哪些局部几何量？<span class=\"katex-inline\">\\det J<\/span> 的正负零各对应什么状态？\n<\/li><li>\nDirichlet、共形、伸缩三类能量分别惩罚什么？\n<\/li><li>\n调和映射线性系统的边界条件与未知量各是什么？\n<\/li><li>\nARAP 参数化的局部到整体交替两步各优化什么？\n<\/li><li>\n闭合曲面为什么不能单片参数化？处置路线有哪些？\n<\/ol>\n<h2>补充展开一：参数域形状选择<\/h2>\n<p>参数域可选平面多边形、圆盘、球面或多片拼接。平面参数域实现简单，适合开网格；圆盘参数化边界为圆周，适合放射状形状；球面参数域对应闭合无边界模型，无需分割但扭曲度量在球面坐标上定义；多片拼接参数域允许各片选域，缝合管理复杂。参数域选择与拓扑、应用目标一起定，不固定用矩形。<\/p>\n<h2>补充展开二：扭曲度量与纹理表现<\/h2>\n<p>共形扭曲表现为纹理局部缩放但角度正确，图案不歪斜；面积扭曲表现为纹理疏密不均；角度扭曲表现为图案歪斜变形。度量值在参数域热力图上可视化：高扭曲区域对应纹理拉伸或压缩集中处。评估参数化质量时三类扭曲分开统计，不用单一平均扭曲掩盖局部集中问题。<\/p>\n<h2>补充展开三：边界约束的权值口径<\/h2>\n<p>位置约束项 <span class=\"katex-inline\">\\omega_i\\|u_i-\\bar u_i\\|^2<\/span> 中 <span class=\"katex-inline\">\\omega_i<\/span> 控制边界锚定强度：<span class=\"katex-inline\">\\omega_i<\/span> 大接近固定边界，<span class=\"katex-inline\">\\omega_i<\/span> 小边界可随能量调整。边界顶点分三类：特征顶点（钉死）、缝合边界（配对固定）、自由边界（低权重）。全部高权重会把内部拉伸放大；全部低权重边界形状不受控。<\/p>\n<h2>补充展开四：局部到整体交替的收敛口径<\/h2>\n<p>ARAP 参数化每轮：位置固定，邻域协方差矩阵 SVD 估旋转；旋转固定，能量二次解位置。能量单调不增，但非凸性决定结果依赖初值。初值可取调和映射解；迭代轮数由能量下降阈值控制。局部旋转估计退化为反射时按行列式校正，与 c03 刚性配准的极分解口径一致。<\/p>\n<h2>补充展开五：衔接速查与易错口径<\/h2>\n<ul><li>\n衔接：c01 邻接结构支撑邻域遍历；c02 曲率辅助分割选线；c05 光顺减少输入抖动；c07 多分辨率在参数域组织层级；c08 形变借用 ARAP 能量形式。\n<\/li><li>\n易错：把三维坐标直接降维当参数化——投影重叠不满足单射；参数化要解能量映射。\n<\/li><li>\n易错：把扭曲能量当顶点距离误差——扭曲定义在三角形 Jacobian 上，不是三维到二维的点对点距离。\n<\/li><li>\n易错：忽略参数域定向——参数边定向要与三维面片一致，否则 <span class=\"katex-inline\">\\det J<\/span> 符号口径混乱。\n<\/ul><\/div><\/details>", "kind": "concept", "title": "网格参数化：映射优化模型、Jacobian 扭曲度量、调和/共形能量与防翻转"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.103<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">多边形网格、流形条件与半边数据结构<\/a><\/span><\/div><h1>网格简化：二次误差度量（QEM）边折叠与渐进网格多分辨率表示<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch03（原书 §3.2，PDF 第 101–108 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>网格简化在尽量少改形状的前提下减少顶点与面片数量；QEM 把边折叠后候选顶点到折叠前邻接全部三角形平面的距离平方和写成齐次坐标二次型 <span class=\"katex-inline\">\\hat p^\\top Q\\hat p<\/span>，按误差值排优先队列贪心折叠；渐进网格记录每步边折叠与逆操作顶点分裂，形成可逐层恢复的连续多分辨率表示。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>重建与参数化后的网格顶点面片数大，远超出绘制、传输、模拟所需。细分曲面逆过程要把高密度网格压成低密度层级；远程传输与 LOD 绘制需要不同精度的多份网格；物理模拟要求单元数量可控。简化要回答：先删哪条边、合并到哪个位置误差最小、删完怎样更新邻接关系、怎样从简网格恢复到原网格。<\/p>\n<p>裸按顶点度数或边长删边不保证形状保真：尖棱被当低连接顶点删掉，大平面上的边却被保留；折叠位置随手选在端点，邻接三角形被拉偏。需要一个可计算的局部误差度量，把&quot;折叠引起的几何偏差&quot;量化成数值，排队选最该删的边。<\/p>\n<p>另一层需求是连续性：独立生成的几份简化网格之间没有对应关系，切换时跳变明显；渐进网格把简化过程记成一串局部操作，最简网格加逆操作即可逐层恢复原网格，层间有明确对应与差量编码。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>简化操作族<\/strong>：面片合并、顶点聚类、顶点删除、边折叠。边折叠把一条边 <span class=\"katex-inline\">(p_a,p_b)<\/span> 收缩为单个顶点 <span class=\"katex-inline\">p<\/span>，两顶点邻接三角形合并到 <span class=\"katex-inline\">p<\/span> 周围。<\/p>\n<p><strong>邻接平面集合<\/strong>：折叠前 <span class=\"katex-inline\">p_a,p_b<\/span> 邻接全部三角形构成平面集合 <span class=\"katex-inline\">N(p_a,p_b)<\/span>。每个平面 <span class=\"katex-inline\">P_l<\/span> 写 <span class=\"katex-inline\">a_lx+b_ly+c_lz+d_l=0<\/span>，系数归一化 <span class=\"katex-inline\">a_l^2+b_l^2+c_l^2=1<\/span>。<\/p>\n<p><strong>平面距离平方<\/strong>：点 <span class=\"katex-inline\">p=(x,y,z)<\/span> 到平面距离平方 <span class=\"katex-inline\">D_l=(a_lx+b_ly+c_lz+d_l)^2<\/span>。<\/p>\n<p><strong>二次型矩阵<\/strong>：齐次坐标 <span class=\"katex-inline\">\\hat p=(x,y,z,1)^\\top<\/span>，<span class=\"katex-inline\">D_l=\\hat p^\\top Q_l\\hat p<\/span>，<\/p>\n<div class=\"katex-block\">Q_l=\\begin{bmatrix}a_l^2&a_lb_l&a_lc_l&a_ld_l\\\\a_lb_l&b_l^2&b_lc_l&b_ld_l\\\\a_lc_l&b_lc_l&c_l^2&c_ld_l\\\\a_ld_l&b_ld_l&c_ld_l&d_l^2\\end{bmatrix}<\/div>\n<p><strong>边折叠 QEM<\/strong>：<span class=\"katex-inline\">Q(p)=\\sum_{P_l\\in N(p_a,p_b)}\\hat p^\\top Q_l\\hat p=\\hat p^\\top(Q_a+Q_b)\\hat p<\/span>，<span class=\"katex-inline\">Q_a,Q_b<\/span> 为两顶点累积平面矩阵。<\/p>\n<p><strong>最优折叠位置<\/strong>：对二次型求导令梯度为零，解线性方程组得驻点；二次型前三维子块正定则驻点为最小误差点，否则回退到端点或中点位置。<\/p>\n<p><strong>优先队列<\/strong>：初始化所有可折叠边，QEM 值入队；弹出最小值边，拓扑校验后折叠，更新 1-环邻域边 QEM 与队列；重复到目标单元数或队列空。<\/p>\n<p><strong>渐进网格<\/strong>：分解记录每步 <span class=\"katex-inline\">ecol<\/span>（边折叠：顶点编号与合并坐标）；重建沿逆操作 <span class=\"katex-inline\">vsplit<\/span>（顶点分裂）从最简网格逐层恢复。<\/p>\n<p><strong>正例<\/strong>：大平面区域边 QEM 小，优先折叠；尖棱边邻接平面夹角大，QEM 值大，保留到高层级。<\/p>\n<p><strong>反例<\/strong>：只按边长排队，细长边在大平面上被先删；不做拓
