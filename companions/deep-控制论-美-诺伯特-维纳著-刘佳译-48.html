把表决结构直接安到神经解剖上：缺对应解剖证据。\n<\/ul>\n<h2>补充推导：两类计算机的精度结构<\/h2>\n<p>模拟计算机以连续刻度测量值表示数据，布什微分分析器用钢轴转动模拟运算；计算尺是日常例子。其精度受刻度构造精度与读数视力限制：十英尺计算尺只比一英尺计算尺高一个小数位，放大尺寸要求每英寸方向同样精确，刚度问题随之加重，精度不能靠加大尺寸等比例提高。 数控设备把数据表示为一系列离散选择集，准确度由三项决定：区分偶然事件的清晰度、每个选择中替代事件数量、给出的选择数量。二值构造时每个选择只有两个替代方案，分辨最容易；高精度工作中数控设备更可取。十进制保留源于历史偶然：印度教徒发现零与位值制时，人的十个手指已决定了记数习惯；机器录入与转写沿用十进制有接口便利。<\/p>\n<h2>补充推导：记忆对应的神经侧细节<\/h2>\n<p>数字机器记录功能决定操作顺序；大脑中最接近的对应物是突触阈值，以及传入神经元精确组合对传出神经元的激活条件。已知阈值随温度变化；没有理由否认其随血液化学性质与其他现象变化，而这些背景变量本身并非全有或全无性质。附录因此提示：在缺乏对全有或全无理论的理智批判、缺少具体实验证据时，研究学习问题应尤为谨慎。 机器记忆分循环存储与长期存储两类；类比到大脑，循环记忆对应活跃状态下保存的循环信息，长期记忆的储存方式本书只能猜测。尸体上无法识别活着时某个突触的阈值，也无法复原交流的神经元与突触链及其概念内容；这一证据缺口直接限制了类比强度。<\/p>\n<h2>补充推导：可靠性类比的位置<\/h2>\n<p>第七章两机制对照、三机制多数表决是工程可靠性方法，推导见本片段第四步。神经系统侧对应被表述为设想：重要消息可能经神经元丛一个或多个替代成员进入下一层次；某些皮层专业化部分可互换性受限，原则较清楚地适用于非专业化联想区域。香农“人是一台非常复杂的机器”的引语在书中注明组织上不同于计算机，属人物观点。<\/p>\n<h2>常见误读对照<\/h2>\n<p>误读一：把功能相似当作实现相同。存储、运算、反馈、容错可类比，神经元物理实现不能按电子元件套用。 误读二：把学习当寄存器写入。突触可塑性涉及化学环境与发育过程。 误读三：把表决结构安到神经解剖上。本书未提供对应解剖证据。<\/p>\n<h2>与本书其他概念的衔接<\/h2>\n<p>c03 信息度量与 c04 反馈结构是机器—神经对照的基础；c08 把类比推进到感知通路；c09 冗余表决与博弈学习机在工程侧展开；c10 追问这套机器能力服务什么目标。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n二进制最优结论建立在什么成本模型上？工程中还有哪些成本未计入？\n<\/li><li>\n两通道对照与三通道表决在纠错能力上的差别在哪一步？\n<\/li><li>\n为什么相关故障会削弱表决收益？\n<\/li><li>\n突触阈值的哪些变化来源不属于全有或全无性质？\n<\/li><li>\n功能层类比与实现层断言的分界标准是什么？\n<\/ol>\n<h2>延伸补充<\/h2>\n<p>模拟机与数字机的精度差别有具体工程来源。布什微分分析器以钢轴转动模拟运算，计算尺靠刻度读数；精度受刻度几何、刚度与视力限制，十英尺计算尺只比一英尺高一个小数位，放大尺寸无法等比例提高精度。数控设备精度由选择清晰度、每选择替代数与选择次数决定，二值选择最易分辨，因此高精度工作优先采用数控二值结构。十进制保留是历史偶然，源于手指与位值制传统，机器录入转写沿用它有接口便利。<\/p>\n<p>记忆对应的神经侧细节限制了类比强度。突触阈值随温度变化，也可能随血液化学等背景变量改变，这些变量连续可调；全有或全无假设需要实验批判。机器循环存储在关机时消失，长期存储方式本书只能猜测；尸体上无法识别存活时的突触阈值，也无法复原突触链及其概念内容。第七章冗余表决是工程方法，神经侧三通道对应物只作为设想提出；香农“人是一台非常复杂的机器”的引语注明组织上不同于计算机，属人物观点。<\/p>\n<h2>延伸推演：计算机—神经系统类比的子条件<\/h2>\n<p>类比成立的范围由四条子条件界定，去掉任一条类比失效。 子条件一：同构只在功能层面。两者都执行信号传输、存储与开关决策，比较的是功能角色，不是物质组成。去掉这条限定，把硅基电路与神经组织当作同类物质，类比在解剖层就不成立。 子条件二：信号表示可对照。继电器、真空管的离散开关与神经元脉冲在“有/无触发”这一层可比；脉冲时序、模拟电位等细节不在同一表示层级。去掉这条，脉冲编码的具体机制差异会破坏对照。 子条件三：规模与连接方式差异已被识别。人工部件早期以串行为主，连接数有限；脑的连接密度与并行规模远大于同期机器。忽略规模差，会把功能对照误读为性能等价。 子条件四：结构可塑性分开处理。机器部件连接在出厂后基本固定，脑可随经验改变连接强度。去掉这条，学习能力的来源在两边对不上。 四条子条件合起来，类比覆盖“信号—存储—决策”的功能骨架；超出骨架的部分属于差异清单。<\/p>\n<h2>第二算例：三通道表决的新故障率<\/h2>\n<p>设单通道故障率 <span class=\"katex-inline\">p=0.001<\/span>，三通道表决，多数通道失效才判系统失效。坏两个或三个通道的概率<\/p>\n<div class=\"katex-block\">P_3=3p^2(1-p)+p^3=3\\times10^{-6}\\times0.999+10^{-9}\\approx2.998\\times10^{-6}.<\/div>\n<p>对照无冗余单通道失效概率 <span class=\"katex-inline\">p=1.0\\times10^{-3}<\/span>；表决后失效概率降到约原来的 <span class=\"katex-inline\">2.998\\times10^{-3}<\/span> 倍。单位核对：概率无量纲。冗余降低的是共因失效之外的独立随机故障；若三通道共用同一设计缺陷或同一环境应力，独立假设不成立，<span class=\"katex-inline\">P_3<\/span> 公式失效。<\/p>\n<h2>对抗性追问：机器能学习，是否等于机器有目的？<\/h2>\n<p>不等于。判据分两边。学习指系统按反馈调整内部结构或参数，使后续响应改善；目的指评价标准由谁设定、目标归属在谁。当前学习机的调整依据是给定的目标函数与奖惩信号，评价标准来自设计者与使用者，机器本身不拥有自主目的。维纳在第九章讨论学习机与自增殖机时，对机器自我延续、自我复制的风险持谨慎态度（转述，第九章），并未声称机器拥有人类意义上的目的。后续发展方面，现代机器学习的目标函数、奖励设计与对齐问题延续了这一区分；自主目标归属仍是哲学与工程共同讨论的问题，本书未给定论。判据落点：可学习性是结构能力，目的性是价值归属；把反馈调整能力读作自主目的，越过了类比边界。<\/p>\n<h2>补充推演：部件表的对照顺序<\/h2>\n<p>类比表应按功能角色逐行对照，而不是按材料逐行对照：输入端对应感受器，开关决策对应神经中继与继电器，存储对应记忆单元与突触强度，输出端对应效应器。每一行先确认两边承担同一功能，再标注实现差异；材料、能量等级、时延量级作为差异列另记。按这一顺序，类比可保留功能骨架，差异不被类比掩盖。<\/p>\n<h2>边界再核<\/h2>\n<p>本书第五章的机器参照是 1940 年代继电器与真空管计算机，规模、能耗与并行度与后世电子计算机不同。引用其类比时，机器一侧应以当代技术更新，神经一侧的机制判断仍需神经科学证据单独核验；本书提供的是功能对照框架，不是脑结构的解剖结论。<\/p><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：控制论 (（美）诺伯特·维纳著；刘佳译) (z-library.sk, 1lib.sk, z-lib.sk).epub<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">计算机与神经系统的类比及其局限<\/a><\/span><\/div><h1>格式塔、感知不变量与多级反馈<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6 章《格式塔与一般概念》 | <strong>原书位置<\/strong>：中译本 epub，无页码，按章名定位\n<\/ul>\n<h2>问题<\/h2>\n<p>同一个人从侧面、四分之三脸、全脸看都能被认出；同一个圆大小不同、远近不同、朝向倾斜仍被识别为圆；云雾或罗夏斑点中能看出人脸与动物。感知输入在几何、光照、角度上不断变化，识别结果却保持稳定。第六章要回答：这种不变量识别由哪些生理通道支撑？视觉信息怎样从视网膜的大量感受器逐级压缩成可保存的形态？<\/p>\n<p>维纳的处理路线是把感知拆成多级反馈：眼肌定位反馈把对象送到标准位置，视网膜收拢减少通道数量，边界强调提取轮廓，皮层逐级压缩。每一层都是可单独观察的机制，格式塔不是凭空的整体直觉。<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n<strong>格式塔（完形）识别<\/strong>：在角度、大小、光照变化下识别同一对象形态的感知能力；问题从视觉延伸到触觉识别硬币圆度、语言表达鸟虫叫声。\n<\/li><li>\n<strong>眼肌反馈<\/strong>：周边视觉捕捉显眼物体后，反射反馈把影像带入视网膜中央凹；从属反馈系统引导双眼对齐、调节晶状体，头部与身体补充动作。\n<\/li><li>\n<strong>标准位置与方向<\/strong>：系统倾向把注意对象置于标准位置方向，使视觉形象在尽可能小的范围内变化，方便后续处理。\n<\/li><li>\n<strong>视网膜通道收拢<\/strong>：中央凹视杆、视锥与视神经纤维几乎一对一；外周一根神经纤维对应十个或更多末梢器官，外周纤维主要服务定心与聚焦导向。\n<\/li><li>\n<strong>轮廓强调<\/strong>：对比边界上注视波动在刺激间交替，增强敏感性；视神经中四分之三纤维仅对光照“闪光”反应，每个视觉图像带有线条画性质。\n<\/li><li>\n<strong>多级压缩<\/strong>：视觉过程大部分阶段逐步减少参与传播的神经元通道数量，使信息更接近使用与记忆保存的形式。\n<\/ul>\n<p>正例：轮廓图颜色光影与实物几乎不相似，却最容易辨认，说明边界信息被单独强调。反例：把格式塔识别当成不可分解的整体直觉，跳过眼肌、视网膜、皮层各层机制，第六章不采用这种解释。<\/p>\n<h2>原理推导<\/h2>\n<p>第一步，识别问题分解。对象变化维度包括视角、距离、朝向、光照；识别要求结果跨这些维度不变。洛克联想原则在第六章被重新追问：毗连原则可归恒定伴随，相似原则需要更详细的机制说明。<\/p>\n<p>第二步，定位反馈层。扁形虫负向光性由两眼点脉冲平衡控制，反馈回躯干肌肉远离光线；人类系统更复杂：瞳孔张合是稳态反馈，周边—中央凹反射是定位反馈，双眼对齐与晶状体聚焦是从属反馈，头身动作是补充反馈。<\/p>\n<p>第三步，通道收拢。中央凹一对一对应保证高分辨；外周多对一收敛，把导向信息汇总。纤维数量从感受器到视神经再到皮层逐级减少。<\/p>\n<p>第四步，边界提取。持续大块刺激使受体调节、敏感性下降；两区域边界上波动产生交替刺激，不耗尽机制甚至增强敏感性。四分之三纤维只对闪光反应，轮廓信息由此被放大。<\/p>\n<p>第五步，非线性对比度增强。类比摄影底片显影与电报式中继器：用尚未超过阈值的模糊印象触发标准锐度的新印象，减少不可使用的信息；皮层不同阶段传输纤维数量减少与此对应。<\/p>\n<p>第六步，不变量形成。多级反馈把变化的原始输入压缩为位置标准、轮廓突出、通道精简的表征，后续联想与记忆在这层表征上进行。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>机制说明适用的条件：视觉系统具备眼肌反馈、视网膜收敛与皮层压缩这些可观察结构；对象在光照与角度可分辨范围内。跨感官代偿（用触摸识别圆度、听觉表达叫声）在第六章作为延伸问题提出，机制细节本书未展开。<\/p>\n<p>边界标注：第六章提供的是生理机制草图；视网膜—皮层各层的精确神经编码在本书时代尚未探明。把某一层直接等同于某个数字电路模块（见 c07）属于类比越界。罗夏斑点中看出图案这类主观知觉，受经验与预期影响，机制解释不能替代心理学测量。<\/p>\n<h2>反例<\/h2>\n<p>扁形虫光避性可由一对光电池、惠斯通电桥与双马达扩压器组合近似实现；维纳指出生物机制空间尺度远小于人工技工方案，而电子技术在速度上超过生物机体。这说明功能可类比，尺度与实现路径不同。<\/p>\n<h2>辨析<\/h2>\n<p>与“整体大于部分之和”的格式塔心理学口号对比：第六章不否认整体现象，但把整体拆成反馈层级与通道压缩步骤；差别在是否给出可检验的中间机制。<\/p>\n<p>与 c07 的分工：c07 对照机器整体结构；本概念专门处理感知通路的反馈层级与不变量形成。<\/p>\n<p>与 c04 的分工：c04 反馈用于稳定物理量；本概念反馈用于稳定感知表征，回路对象从温度、位置变成视觉形象。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：c04 反馈结构；c03 信息压缩与丢失度量。后继：c09 学习机在压缩表征上改进估值；c07 神经类比在感知层的具体落点。本概念把“反馈”从工程回路推进到认知通路。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（格式塔、感知不变量与多级反馈）<\/summary><div class=\"depth-body\"><h1>c08 深度片段：格式塔、感知不变量与多级反馈<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要解释一个跨视角稳定的识别结果，逆推链条：<\/p>\n<ol><li>\n最终问题：变化输入为何得到同一表征？\n<\/li><li>\n上一层：表征是否经过逐级通道压缩与轮廓提取？\n<\/li><li>\n再上一层：对象是否被定位到标准位置与方向？\n<\/li><li>\n再上一层：眼肌、瞳孔、双眼对齐等反馈层是否逐级闭合？\n<\/li><li>\n最底层：外周与中央凹的感受器—纤维对应结构是否提供收拢基础？\n<\/ol>\n<h2>正向推导<\/h2>\n<p>第一步，列变化维度。视角、距离、朝向、光照任一项变化都改变视网膜映像；识别不变量必须在这些维度被补偿后形成。 第二步，定位反馈。周边视觉捕捉运动或对比显著物体 → 反射反馈把影像送入中央凹 → 从属反馈引导双眼对齐同一区域 → 晶状体聚焦 → 头身补充动作。回路逐级闭合，对象进入标准位置。 第三步，通道收拢。中央凹一对一对应维持分辨力；外周一根纤维对应十个以上末梢器官，导向信息汇总上传。设外周每受体组 <span class=\"katex-inline\">k\\ge10<\/span> 个感受器对应 1 根纤维，通道数按 <span class=\"katex-inline\">1/k<\/span> 量级压缩。 第四步，边界提取。持续均匀刺激触发受体调节；边界处波动交替刺激，敏感性不衰减。四分之三视神经纤维只对闪光反应，轮廓成为图像主导成分。 第五步，非线性增强。中继器式机制用模糊印象触发标准锐度新印象，压掉不可用信息；皮层阶段纤维数量继续减少。 第六步，不变量表征。位置标准化、轮廓突出、通道精简后的形态供联想与记忆调用；角度大小差异在前面层级被补偿，识别结果保持稳定。<\/p>\n<h2>算例<\/h2>\n<p>算例 1：收拢比例。外周 1000 个感受器按 10:1 收敛到 100 根纤维；若下一层再按 2:1 收敛，传到 50 根通道。通道数逐级减半量级，信息从原始亮度分布转向导向与轮廓特征。 算例 2：轮廓图辨认。人脸照片含大面积连续亮度区域；轮廓图只保留边界。按第四步机制，边界刺激占主导，连续区域被调节抑制，轮廓图因此易辨认。 算例 3：定位反馈时序。周边捕捉 → 眼动转入中央凹 → 双眼对齐 → 聚焦；任一环节断开，对象停留在周边视野，分辨力下降。 算例 4：跨感官对照。触摸硬币圆度靠手部位置反馈；机制类比视觉定位反馈，但感受器与效应器通道不同。<\/p>\n<h2>边界与失败案例<\/h2>\n<ul><li>\n把格式塔当成不可分解直觉：跳过反馈层级，无法检验各步机制。\n<\/li><li>\n层级等同数字模块：生理通道与电路模块只是功能类比。\n<\/li><li>\n罗夏式主观图案：预期与经验参与知觉，机制解释不等于心理学测量结论。\n<\/ul>\n<h2>补充推导：从扁形虫到人类的反馈层级<\/h2>\n<p>扁形虫负向光性由两个眼点脉冲平衡控制，平衡反馈回躯干肌肉使身体远离光线；加上向前移动的一般脉冲，动物进入附近最暗区域。书中指出，一对光电池加扩音器、惠斯通电桥平衡输出、控制双螺杆马达输入的组合，可以为小船实现充分的负向光性控制；人工机制难以压缩到扁形虫尺寸，但电子技术在速度上超过生物机体。功能可类比，尺度与实现路径不同。 人类眼肌反馈分三类：瞳孔暗光张开、强光闭合是纯稳态反馈；周边视觉经亮度、对比、颜色或运动捕捉显眼物体后，反射反馈把影像带入中央凹；从属反馈系统引导双眼移动使物体落在两视野同一区域、调节晶状体聚焦，头部与身体补充动作。文字、人脸、风景这类熟悉方向的对象，还有机制把对象移动到正确方向。总体倾向是把注意对象置于标准位置方向，使视觉形象在尽可能小范围内变化。<\/p>\n<h2>补充推导：视网膜收拢与轮廓强调的定量结构<\/h2>\n<p>中央凹处视杆细胞、视锥细胞与视神经纤维几乎一对一对应；外周一根纤维对应十个或更多末梢器官，外周纤维主要服务定心与聚焦导向。视网膜受调节影响：持续大块均匀刺激降低受体传输能力；两对比区域边界上，注视点轻微波动在刺激之间交替，不仅不耗尽机制，甚至增强敏感性。书中观察：视神经中四分之三纤维仅对光照闪光反应，因此边界印象最强，每个视觉图像带有线条画性质。 非线性对比度增强类比摄影底片处理与电报式中继器：用尚未超过阈值的模糊印象触发标准锐度的新印象，压掉不可使用的信息；皮层不同阶段传输纤维数量减少与此对应。信息从原始亮度分布逐级转向导向与轮廓特征，最终接近使用与记忆保存的形式。<\/p>\n<h2>补充推导：联想原则与跨感官识别<\/h2>\n<p>第六章从洛克观念关联理论切入：毗连原则、相似原则、因果原则；因果原则被洛克乃至休谟归结为恒定伴随，归入毗连原则，相似原则需要机制说明。跨感官问题并列提出：如何通过触摸识别硬币圆度，如何用语言表达鸟虫叫声。书中把视觉机制草图作为主线索，跨感官代偿只作为延伸方向，细节未展开。罗夏斑点中看出人脸动物属于主观知觉，受经验预期影响，机制草图不能替代心理学测量。<\/p>\n<h2>常见误读对照<\/h2>\n<p>误读一：把格式塔当不可分解整体直觉。第六章要求拆到反馈层级与通道压缩步骤。 误读二：把生理层级等同数字电路模块。两侧只是功能类比。 误读三：认为通道压缩会丢掉识别所需信息。压缩发生在连续区域与冗余亮度上，轮廓与导向信息被保留放大。<\/p>\n<h2>与本书其他概念的衔接<\/h2>\n<p>c04 反馈结构在感知回路中的延伸；c03 信息压缩与丢失度量刻画通道收拢；c07 神经类比在感知层的具体落点；c09 学习机在压缩表征上改进估值。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n中央凹一对一与外周多对一各自服务什么功能？\n<\/li><li>\n轮廓强调在受体调节这一步上如何发生？\n<\/li><li>\n多级反馈依次包含哪些闭合回路？\n<\/li><li>\n通道压缩为什么不会把识别所需信息全部丢掉？\n<\/li><li>\n跨感官代偿在本书中哪些有机制草图，哪些只是延伸问题？\n<\/ol>\n<h2>延伸补充<\/h2>\n<p>感知反馈从低等动物到人类有一条连续草图。扁形虫两眼点脉冲平衡控制避光方向，反馈回躯干肌肉；一对光电池加惠斯通电桥与双马达可近似实现同类光避性，但人工装置尺度远大于生物，电子技术速度则超过生物机体。功能可类比，尺度与实现路径不同。<\/p>\n<p>人类视觉反馈分层闭合：瞳孔张合是稳态反馈；周边捕捉物体后反射反馈送入中央凹；从属反馈引导双眼对齐、晶状体聚焦；头身动作补充。标准位置方向标准化后，后续处理面对的形象变化范围被压缩。视网膜收拢在中央凹一对一、外周十余个感受器对应一根纤维；边界处波动交替刺激增强敏感性，四分之三视神经纤维只对闪光反应，轮廓成为图像主导。中继器式非线性处理把模糊印象触发为标准锐度新印象，压掉不可用信息。<\/p>\n<p>联想原则一侧，第六章追问相似原则的机制基础；因果原则被洛克、休谟归结为恒定伴随，归入毗连原则。跨感官识别（触摸硬币圆度、语言表达叫声）只作为延伸方向提出，机制细节未展开。罗夏斑点中看出图案受经验预期影响，属主观知觉；机制草图不能替代心理学测量，也不能把某一神经层级直接等同于数字电路模块。<\/p>\n<h2>延伸推演：格式塔多级反馈成立的子条件<\/h2>\n<p>知觉整体感由多条通路协作形成，可拆为四条子条件，去掉任一条整体感退化。 子条件一：感受器输入先经层级聚合。外周感受野合并，中央区域保留细分；信息在层级间收拢。去掉聚合，原始刺激直接上送，类别提取缺乏中间表示。 子条件二：不变量被显式提取。形状在位置移动、尺度变化、旋转之下保持同一知觉对象。去掉不变量提取，同一物体换个位置就被当作新对象，再认不成立。 子条件三：高层预期向低层调制。已有类别与预期回送到低级处理环节，影响后续归类。去掉下行通路，知觉只由自下而上刺激决定，语境与经验进不来。 子条件四：类别经学习形成。归类边界由经验与反馈调整。去掉学习，类别固定不变，新经验无法改变知觉划分。 四条子条件中，前两条描述自下而上通路，后两条描述自上而下调制；格式塔现象是两侧共同作用的结果。<\/p>\n<h2>第二算例：感受器到纤维的通道收拢<\/h2>\n<p>设感受器总数 10000。外周部分占 90%，按 10:1 合并：<span class=\"katex-inline\">0.9\\times10000/10=900<\/span> 根纤维；中央凹部分占 10%，按 1:1 直连：<span class=\"katex-inline\">0.1\\times10000=1000<\/span> 根纤维。合计<\/p>\n<div class=\"katex-block\">900+1000=1900\\ \\text{根纤维}.<\/div>\n<p>信息收拢比 <span class=\"katex-inline\">1900/10000=0.19<\/span>，即约 19% 的通道数。单位核对：感受器与纤维均为个数，无量纲比例。对照全部 10:1 合并，纤维数为 1000；中央凹细分保留了局部分辨率，收拢比相应上升。<\/p>\n<h2>对抗性追问：格式塔能否纯靠反馈层解释？<\/h2>\n<p>不能把反馈当作全部解释。判据分两层。反馈层可解释注意调制、预期影响归类与经验边界调整；知觉组织中的邻近、相似、闭合、连续等原则，有其独立于反馈回路的刺激结构基础。维纳在第六章把格式塔与一般概念放在机器类比框架内讨论，给出的是反馈—归类的草图（转述，第六章），未展开知觉组织原则的完整机制。后续发展方面，知觉心理学与神经科学分别从行为实验与神经回路层面细化了整体知觉的来源；这些不属于本书已证结论。判据落点：反馈是知觉形成的参与通路之一，不是充分条件；整体感的解释需要刺激结构、层级聚合与下行调制三方面并列，不能单独归给反馈。<\/p>\n<h2>补充推演：不变量提取的层级位置<\/h2>\n<p>不变量提取不是在某一级一次完成。低层先合并邻近刺激、检测边缘与方向；中层把局部特征组成整体形状；高层对照已有类别完成再认。位置、尺度、旋转等变换在不同层级逐步被吸收，同一对象在变化刺激下保持同一类别。把不变量误放到底层，会要求感受器直接对所有变换形态预置响应，通道数无法承受；误放到高层，则中间层缺少可被对照的形状表示。<\/p>\n<h2>算例对照：直连与合并的分辨率代价<\/h2>\n<p>仍取 10000 感受器。若全部按 10:1 合并，纤维 1000 根，外周与中央分辨率相同；分级方案保留中央凹 1000 根直连，外周 900 根合并，总 1900 根。分级方案用多出的 900 根纤维换取中央区域细分，其余区域仍按合并处理。单位核对：纤维个数无量纲比较，分辨率差异需结合感受野覆盖范围评价，通道数本身不等于信息容量。<\/p>\n<h2>边界再核<\/h2>\n<p>本书第六章的感知类比参照同期机器结构，通道收拢与层级聚合是功能示意。真实视觉系统的感受野拓扑、反馈回路层级与神经编码细节，由后续神经科学证据补充；本章案例中标注为类比或作者论断的部分，不引用为已证生理机制。<\/p><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：控制论 (（美）诺伯特·维纳著；刘佳译) (z-library.sk, 1lib.sk, z-lib.sk).epub<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">格式塔、感知不变量与多级反馈<\/a><\/span><\/div><h1>博弈、学习机与社会的统计控制<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章《信息、语言和社会》、第 9 章《关于学习和自增殖机》、附录《人有人的用处》 | <strong>原书位置<\/strong>：中译本 epub，无页码，按章名定位\n<\/ul>\n<h2>问题<\/h2>\n<p>控制论能否从机器与神经系统推进到社会？第九章先在博弈场景检验机器学习：机器能否根据经验改进策略战术。第八章与附录再把通信、群体信息、博弈论外推到社会事务：观点形成、生产市场、政治决策能否作为统计过程被收集、预测与控制。<\/p>\n<p>本概念必须分层读：博弈倒推是可核的数学步骤；学习机改进估值是工程设想；把社会同化为规则完备的多人博弈、用机器统计控制群体，是维纳基于 1940—1950 年代观察的外推判断。三层证据强度不同，混在一起读会把作者论断当成已证事实。<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n<strong>冯·诺依曼博弈理论<\/strong>：从博弈末端而非开端运用策略；最后一步争取制胜或逼平，对手上一步阻止对方制胜逼平，逐级倒推。\n<\/li><li>\n<strong>极小化极大倒推<\/strong>：己方层取最大估值，对手层取最小估值；截断处用静态估值函数打分。\n<\/li><li>\n<strong>学习机<\/strong>：记录每一场博弈，搜索过去对局找合适玩法，据此改进估值；行为质量受对手水平影响。\n<\/li><li>\n<strong>选择性决定与限制性决定<\/strong>：前者承认其他行为可能性，后者把行为特征永久严格固定；不植入棋规的学习机可能漂移成执行别的任务的机器。\n<\/li><li>\n<strong>群体信息与自主性<\/strong>：社区范围由信息有效传播范围定义；自主性由内部决策与外部进入决策的比例衡量；群体信息量与个体信息量无必然方向关系。\n<\/li><li>\n<strong>国家管理机器设想<\/strong>：杜巴莱修士在评论中提出的设想——收集生产市场信息、确定典型心理函数、协调政治决策；维纳转述并讨论其可能性与危险。\n<\/ul>\n<p>正例：井字棋策略已知，可从开头完整执行；机器评估两三步内逼将或避将。反例：假设完美对手的谨慎策略在对手有失误记录的真实对局中导致优柔寡断，拿破仑与纳尔逊案例即针对这一点。<\/p>\n<h2>原理推导<\/h2>\n<p>第一步，博弈倒推。末端己方层 <span class=\"katex-inline\">V_{\\text{self}}=\\max_a V(a)<\/span>；对手层 <span class=\"katex-inline\">V_{\\text{opp}}=\\min_b V(b)<\/span>；向前一层嵌套 <span class=\"katex-inline\">\\max\\min<\/span>。步数受组合爆炸限制：组合数随步数几何级数增长，50 步对局无法在合理时间算完。<\/p>\n<p>第二步，估值函数。截断局面按棋子、将军、将死步数、棋盘控制、棋子保护等打分；香农改进包括局面不稳定时自动延伸一两步到稳定点。机器记录对局改进估值，构成学习过程。<\/p>\n<p>第三步，完美对手假设的局限。冯·诺依曼框架假设对手使用最佳取胜策略；真实对手有已知失误记录。拿破仑对奥军、纳尔逊对联合舰队的指导因素是对手历史行动统计，而非与完美对手对弈。直接套用理论在这类场景徒劳无功。<strong>标注：两个历史案例为维纳转述的历史解释，本书未提供原始战史数据。<\/strong><\/p>\n<p>第四步，群体信息概念。信息是种族信息还是个体信息，取决于行为能否被其他成员看作独特活动并反过来影响他们。群体自主性按内部/外部决策比例衡量；群体信息可多于或少于个体信息。<\/p>\n<p>第五步，社会外推的条件检查。人类现实不像计算数字那样确定无歧义，机器须概率性思考；人类过程可同化为规则不完整、规则随情境细节与玩家心理反应变化的多人博弈。维纳列出博弈数学稳定的两个条件（作者判断，非定理）：麻痹群体认知使其愚昧；玩家出于善意把决定提交特权玩家。1948 年盖洛普民意调查被引为预测失效例子。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>博弈倒推成立：规则明确、步数可截断、估值可定义。学习机成立：有可记录对局、估值可改进、限制性规则约束任务方向。<\/p>\n<p>社会统计控制的边界：规则不完备且随时间变化；参与者心理反应进入规则本身；信息收集与预测稳定性超出可严格控制范围。<strong>标注：第八章与附录关于通信技术越发达社会越不稳定、国家管理机器风险等表述，属作者时代判断与伦理警告，不是已被社会科学证实的规律；本书未提供相应统计数据。<\/strong><\/p>\n<h2>反例<\/h2>\n<p>杜巴莱设想中的机器被维纳自己评估为过于粗糙，无法展现人类目标性独立行为的千分之一；真正危险是人用它增加对其他群体的控制。另一个反例：学习机与糟糕对手过招会被带坏，说明经验记录本身不保证策略改进，估值方向需要外部约束。<\/p>\n<h2>辨析<\/h2>\n<p>与纯数学博弈论对比：极小化极大是可核框架；“社会可作为多人博弈求解”是模型外推，规则完备性假设在社会场景不成立。<\/p>\n<p>与 c06 的分工：c06 讲生物组织的局部熵减；本概念讲群体通信信息，两者都用信息语言，但社会系统不满足封闭热力学账。<\/p>\n<p>与 c10 的分工：本概念重建博弈与社会外推的论证链；c10 处理这套能力背后的伦理边界与目标选择。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：c03 信息度量；c07 机器结构与学习；c08 表征压缩。后继：c10 伦理边界；本概念是全书从工程走向社会论证的过渡层，证据等级在此逐级下降，需要读者主动分层。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（博弈、学习机与社会的统计控制）<\/summary><div class=\"depth-body\"><h1>c09 深度片段：博弈、学习机与社会的统计控制<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要判断一个社会或对局场景能否用博弈—统计方法控制，逆推链条：<\/p>\n<ol><li>\n最终问题：预测与控制是否有数学稳定性？\n<\/li><li>\n上一层：规则是否完备且不随参与者反应改变？\n<\/li><li>\n再上一层：参与者是否可按稳定统计分布建模？\n<\/li><li>\n再上一层：决策能否分为内部形成与外部进入两类并计数？\n<\/li><li>\n最底层：信息能否有效传播到群体范围并被相互识别？\n<\/ol>\n<h2>正向推导<\/h2>\n<p>第一步，末端倒推。设局面估值 <span class=\"katex-inline\">V<\/span> 越高对己方越有利。最后一步己方选最大：<span class=\"katex-inline\">V_{\\text{self}}=\\max_a V(a)<\/span>；对手选最小：<span class=\"katex-inline\">V_{\\text{opp}}=\\min_b V(b)<\/span>。 第二步，两层嵌套。己方先动、对手回应：<\/p>\n<div class=\"katex-block\">V_{\\text{self}}=\\max_a\\min_b V(a,b).<\/div>\n<p>再向前一层再套一层 <span class=\"katex-inline\">\\min<\/span>。 第三步，截断与估值。机器按设计者给定步数 <span class=\"katex-inline\">n<\/span> 截断；截断处静态估值含棋子、将军、将死步数、棋盘控制、相互保护等项。组合数随层数几何增长，长对局无法穷尽。 第四步，学习闭环。机器记录全部对局，搜索历史局面匹配玩法，更新估值；对手水平差会污染记录，估值被带偏。限制性规则（棋规）固定任务方向，选择性决定保留行为空间。 第五步，群体信息框架。设考察期决策总数 <span class=\"katex-inline\">D=D_{\\text{in}}+D_{\\text{out}}<\/span>，自主性 <span class=\"katex-inline\">A=D_{\\text{in}}/D<\/span>；群体信息量 <span class=\"katex-inline\">I_g<\/span> 与个体平均 <span class=\"katex-inline\">I_i<\/span> 无必然方向关系。 第六步，社会外推检查。规则不完备、规则随情境与心理反应变化时，博弈稳定性条件不成立；维纳给出的两个稳定条件属作者判断，不是数学定理。<\/p>\n<h2>算例<\/h2>\n<p>算例 1：两层倒推。己方可选 <span class=\"katex-inline\">a_1,a_2<\/span>；<span class=\"katex-inline\">a_1<\/span> 下对手回应估值 {3,1}，<span class=\"katex-inline\">a_2<\/span> 下 {4,2}。对手取最小：<span class=\"katex-inline\">a_1<\/span> 价值 1，<span class=\"katex-inline\">a_2<\/span> 价值 2；己方取最大选 <span class=\"katex-inline\">a_2<\/span>，价值 2。 算例 2：组合增长。每步平均 <span class=\"katex-inline\">b<\/span> 个合法动作，<span class=\"katex-inline\">n<\/span> 层后局面数 <span class=\"katex-inline\">b^n<\/span>；<span class=\"katex-inline\">b=30<\/span>，<span class=\"katex-inline\">n=2<\/span> 为 900，<span class=\"katex-inline\">n=3<\/span> 为 27000，<span class=\"katex-inline\">n=50<\/span> 远超合理计算范围。 算例 3：自主性比例。群体 100 项决策中 40 项内部形成、60 项外部进入，<span class=\"katex-inline\">A=0.4<\/span>；<span class=\"katex-inline\">A<\/span> 接近 1 表示内部自治程度高。该指标目前只有概念定义，无可操作识别规则。 算例 4：学习污染。机器连续与弱对手对局，估值偏向弱手失误模式；遇到谨慎熟练棋手时表现下降，对应“千里马被坏骑手骑坏”的书中比喻。<\/p>\n<h2>边界与失败案例<\/h2>\n<ul><li>\n规则完备假设失效：社会规则随情境与心理反应改变，机械预测工具可能彻底失效。\n<\/li><li>\n完美对手假设失效：对手有可统计失误记录时，谨慎倒推导致优柔寡断。\n<\/li><li>\n群体指标误当实测：<span class=\"katex-inline\">A<\/span> 与 <span class=\"katex-inline\">I_g<\/span> 在本书只停留在思路层面。\n<\/li><li>\n历史案例无原始数据：拿破仑、纳尔逊、盖洛普民调均为转述性例证。\n<\/ul>\n<h2>补充推导：个体学习与种族学习的分工<\/h2>\n<p>第九章先区分生命系统两种现象：学习与自我繁殖。个体会在一生中顺应历史环境改变自身；复制产生近似后代，使物种不随时间变化。变异可遗传时成为自然选择原材料；行为模式遗传构成种族学习。人类与部分哺乳动物把个体学习提升到最高点，系统学习很大程度用于构建个体学习的可能性；鸟类与昆虫个体学习弱，复杂行为第一次就能正确执行，更多依赖系统发育学习。博弈机讨论放在个体学习一侧：机器根据对局经验改进估值。<\/p>\n<h2>补充推导：博弈机的搜索深度与估值<\/h2>\n<p>机器在正式博弈时间内评估接下来两到三步所有动作与对手回击；局面估值将死最高、被将死最低，丢子、吃子、将军等按优秀玩家赋值。最后一层取对手回应最低估值，向前一层在对手最小化前提下取己方最大。香农改进包括评估棋盘控制、棋子相互保护，以及局面不稳定时自动延伸一两步到稳定点；机器可记录每场对局，搜索历史局面匹配玩法。维纳判断这样的机器能赢粗心棋手，几乎肯定输给熟练谨慎棋手，水平接近绝大多数人类。 选择性决定承认其他行为可能性，限制性决定把行为特征永久固定；不把棋规作为约束植入学习机，它可能漂移成执行完全不同任务的机器。与糟糕对手连续过招会污染估值，精心设计的机器也可能被带坏。<\/p>\n<h2>补充推导：群体通信与信息尺度<\/h2>\n<p>第八章区分社会性动物交流：蚂蚁交流只涉及几种气味，可区分本巢外巢，行为近乎模式化；人类交流包含语言与文学全部错综复杂性。没有共用语言时，注意力时刻本身可成为信号，观察者通过目光方向与情绪时刻学到重要事情。信息是否属于群体，取决于行为能否被其他成员看作独特活动并反过来影响他们。 群体自主性按内部决策与外部进入决策比例衡量；群体信息可多于个体（有机体多于细胞）也可少于个体（临时聚集群体）。知识积累有过载趋势：图书馆因书籍过多流通不畅，科学专业化后专家在专业之外所知有限；布什建议的机械检索辅助有局限——归类需要有人清楚新书归属何类，跨学科分类需要知识面广泛的人。<\/p>\n<h2>补充推导：社会外推的失效条件<\/h2>\n<p>杜巴莱设想国家管理机器收集生产市场信息、确定典型心理函数、协调政治决策。维纳评估：人类现实不像数字数据那样确定无歧义，机器必须概率性思考；人类过程可同化为规则不完整、规则随情境细节与玩家心理反应变化的多人博弈。数学稳定的两个条件（作者判断，非定理）：麻痹群体认知使其愚昧；玩家出于善意把决定提交特权玩家。1948 年盖洛普民调被引为预测失效例子。博弈论在军事、经济、舆论战中的应用属时代背景评述，本书未提供相应统计数据。<\/p>\n<h2>常见误读对照<\/h2>\n<p>误读一：把极小化极大倒推当社会决策解法。规则完备假设在社会场景不成立。 误读二：把群体自主性指标当可实测社会统计。本书只给概念思路。 误读三：把历史案例当定量证据。拿破仑、纳尔逊、民调均为转述性例证。<\/p>\n<h2>与本书其他概念的衔接<\/h2>\n<p>c03 信息度量支撑群体信息讨论；c07 机器学习结构；c08 表征压缩是估值改进的前提；c10 承接本片段的外推链条，追问目标选择与责任边界。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n极小化极大在己方层与对手层分别取什么极值？\n<\/li><li>\n为什么长对局无法靠加深搜索解决？\n<\/li><li>\n学习机的估值改进受哪些输入质量约束？\n<\/li><li>\n群体自主性指标的概念定义缺哪些可操作规则？\n<\/li><li>\n社会博弈外推在哪两个条件上与数学博弈论分道？\n<\/ol>\n<h2>延伸补充<\/h2>\n<p>个体学习与种族学习在第九章先作分工：个体顺应一生经验改变自身，繁殖产生近似后代使物种延续；可遗传变异成为自然选择原材料，行为模式遗传构成种族学习。人类个体学习提升到最高点，鸟类昆虫更多依赖系统发育学习。博弈机讨论落在个体学习一侧：机器记录对局、改进估值，对应个体经验积累。<\/p>\n<p>博弈机搜索以两到三步为限，局面估值含棋子、将军、将死步数、棋盘控制与棋子保护；香农补充局面不稳定时延伸到稳定点。机器可记录全部对局搜索历史玩法；不植入棋规的纯选择性学习可能漂移任务方向，限制性规则固定任务边界。与糟糕对手过招会污染估值，经验记录本身不保证策略改进。<\/p>\n<p>群体通信一侧，蚂蚁交流限于几种气味，行为模式化；人类交流包含语言文学全部复杂性。群体范围由信息有效传播范围定义，自主性按内部与外部决策比例衡量；群体信息可多于或少于个体信息。图书馆过载与专家专业化提示信息积累存在流通成本，机械检索辅助仍需人判断归类。社会外推的失效条件是规则不完备且随心理反应变化；两个稳定条件与盖洛普民调例子均为作者转述判断，不是统计定理。<\/p>\n<h2>延伸推演：社会统计控制成立的子条件<\/h2>\n<p>把反馈框架用于社会层面，需先核对五条子条件，逐条去掉后结论退化。 子条件一：个体行为可观测且统计上稳定。群体层面可获得足够样本，行为分布不随观测期漂移。去掉这条，统计量没有稳定对象，控制依据落在波动噪声上。 子条件二：规则与激励可建模。个体对信号、价格、规范的响应方式可写成可估计关系。去掉这条，反馈作用方向与强度无法预测。 子条件三：反馈信号可获得。控制端能收回群体响应的测量结果。信号回路断开时，系统开环，纠偏无从发起。 子条件四：群体行为非完全耦合。个体响应之间存在独立成分，统计平均可抑制随机涨落。个体高度同步时，平均不再分散误差，波动以整体形式反弹。 子条件五：控制目的与边界由外部给定。社会控制的目标、可干预范围与权利保留属于价值判断，不来自反馈模型本身。去掉这条限定，模型被误读为自带价值立场。 前四条是工程可核条件，第五条是伦理边界；任何社会控制结论引用前，五条需并列核对。<\/p>\n<h2>第二算例：新矩阵的保守策略<\/h2>\n<p>设己方两个纯策略 <span class=\"katex-inline\">a_1<\/span>、<span class=\"katex-inline\">a_2<\/span>，对手两个策略，收益矩阵<\/p>\n<div class=\"katex-block\">M=\\begin{pmatrix}5&1\\\\2&4\\end{pmatrix}.<\/div>\n<p>保守策略按最小收益取行：<span class=\"katex-inline\">a_1<\/span> 行对手压到 <span class=\"katex-inline\">\\min(5,1)=1<\/span>；<span class=\"katex-inline\">a_2<\/span> 行对手压到 <span class=\"katex-inline\">\\min(2,4)=2<\/span>。己方在两行最小值中取最大：<span class=\"katex-inline\">\\max(1,2)=2<\/span>，选 <span class=\"katex-inline\">a_2<\/span>。单位核对：矩阵元素为收益值，量纲由具体对局规定，本例不设实际单位。对照风险：该策略只保证最差收益不低于 2，不保证获得最高收益 5；对手若改变策略，实际收益在 2 到 4 之间。<\/p>\n<h2>对抗性追问：社会能否被统计地控制？<\/h2>\n<p>判据分成立与不成立两侧。成立侧：在行为可观测、响应可建模、信号回路闭合、个体含独立成分的范围内，宏观统计趋势可被描述和有限调节。不成立侧：规则不完全可知、个体响应随反馈改变、群体耦合反弹、价值目标无法由模型给定，这几条任一突出时，精细社会控制不成立。维纳在第八章与附录中对社会控制持保留态度，强调语言、习俗与社会组织的复杂性，对把工程反馈直接搬到社会层面保持怀疑（转述，第八章、附录）；其社会论述属作者论断与时代判断，不是已证事实。后续发展方面，社会统计、舆情测量与博弈论应用在本书之后扩展了这一话题，但控制论框架不等于社会可被工程化管理的证明。判据落点：统计方法可描述群体趋势，不推出社会整体可被精确控制；引用社会控制结论时逐条标注证据层级。<\/p>\n<h2>补充推演：博弈策略与统计平均的分工<\/h2>\n<p>保守策略（最大最小）处理对手主动对抗的最坏情形；统计平均处理环境随机涨落。两类问题的风险来源不同：前者假设对手按己方最差选择行动，后者假设环境按固定分布产生扰动。社会场景中两者常同时出现，不能用一套指标覆盖。把对抗风险按随机平均处理，会低估最坏情形；把随机涨落按对抗处理，会高估对手意图。<\/p>\n<h2>边界再核<\/h2>\n<p>本书涉及社会的部分，例证多为语言传播、习俗形成与群体行为观察（转述，第八章、附录），未给出可重复的社会实验数据。引用其社会判断时，证据层级标为作者论断；后续社会科学研究的结论需单独核验，不挂在维纳本书名下。<\/p><\/div><\/details>", "c10": "<div class=\"source-badge\">📖 出处：控制论 (（美）诺伯特·维纳著；刘佳译) (z-library.sk, 1lib.sk, z-lib.sk).epub<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">博弈、学习机与社会的统计控制<\/a><\/span><\/div><h1>控制的伦理边界：懂得如何做与懂得做什么<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：附录《人有人的用处：控制论与社会》、第 8 章《信息、语言和社会》 | <strong>原书位置<\/strong>：中译本 epub，无页码，按章名定位\n<\/ul>\n<h2>问题<\/h2>\n<p>控制论给出了通信、反馈、预测、博弈与学习机的技术能力；能力越强，追问越靠前：这些能力应当被用来做什么？谁决定目标？技术放大的是人的判断还是绕过了人的判断？附录《人有人的用处》整本书处理这个问题。维纳区分“懂得如何做”（技术上目标如何实现）与“懂得做什么”（目标本身是否值得追求），并警告研究者与公众都有夸大新成就、为可能事实辩护的道德风险。<\/p>\n<p>本概念要重建维纳的伦理论证结构，同时标明其中哪些是可核的技术观察，哪些是他基于时代处境的价值立场；后者属于作者论断，不冒充定理。<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n<strong>懂得如何做（know-how）<\/strong>：实现既定目标的技术手段；机器设计、信号处理、博弈搜索、预测算法属这一层。\n<\/li><li>\n<strong>懂得做什么（know-what）<\/strong>：目标本身的选择与价值评估；决定哪些结果值得追求、哪些不应当做。\n<\/li><li>\n<strong>机器的次要性<\/strong>：附录主张，在与人相关的价值问题上机器是次要的；机器应服务于人作为人的工作与目的，而不是让人成为未来机器的二流替代品。\n<\/li><li>\n<strong>危险来源定位<\/strong>：危险并非机器自主兴风作浪，而在使用机器的人；政治领袖可用机械技术增加对其他群体的控制，权术可能狭隘冷漠到像机器构思的。\n<\/li><li>\n<strong>跨学科参与<\/strong>：杜巴莱呼吁人类学家、哲学家参与相关工作；科学家需要了解人的本性与内在动机，知道为什么希望控制他人。\n<\/ul>\n<p>正例：自动钢琴例子——工程师购买昂贵自动钢琴是着迷于机械构造而非音乐；手段精致而目标缺席，维纳用它区分技巧展示与真正价值选择。反例：把技术能力直接等同于价值正当性，认为“能造出来”就“应当造出来”，跳过 know-what 层判断。<\/p>\n<h2>原理推导<\/h2>\n<p>第一步，能力与目标分离。工程回答“如何实现”，不回答“是否该实现”；自动钢琴案例中克服机械困难的技巧成熟，不自动产生音乐目的。<\/p>\n<p>第二步，风险的责任位置。附录引塞缪尔·巴特勒《埃瑞璜》的警世之言：机器可能在人操纵下作为附属器官征服人类；维纳同时指出巴特勒身处其时代，言论更接近敏锐修辞而非严格科学评论。危险链条是：人制造机器 → 人用机器控制他人 → 控制技术放大既有目标；机器本身粗糙，无法独立形成人类目的。<\/p>\n<p>第三步，社会统计控制的风险形态。杜巴莱国家管理机器设想被转述后，维纳评估其当前过于粗糙；真正风险是人借助这类技术把群体压向单一可能性。他描述的极端状态：社会处于熵增最后阶段，人类处境可能性可忽略，个体统计差异为零。<strong>标注：这一极端图景是作者的伦理警告与思想实验，不是对未来的预测定理；“通信技术越发达社会越不稳定”同样属作者时代判断。<\/strong><\/p>\n<p>第四步，知识结构的补救。技术问题需要人类学家与哲学家参与：了解人的本性、内在动机与控制他人的理由；仅有技术骨干不足以界定控制的边界。<\/p>\n<p>第五步，本书立场的边界。维纳声明自己的目的不是敦促技术迅速开发，而是解释机器潜力并警告出于利己角度利用这些能力的危险；这一立场是价值选择，读者可以同意或反驳，但不能当作科学结论引用。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>伦理讨论适用的条件：存在可选择的目标与可承担责任的主体；技术手段有替代方案或可约束环节。把伦理判断写成技术结论会越界：附录没有给出控制社会的量化伦理公式，也没有论证某一制度安排必然优劣。<\/p>\n<p>边界标注：附录写于 1950 年代前后，涉及美苏博弈、舆论战、机器管理国家的判断带有其时代背景；引用具体国际局势评述时必须保留时代语境。维纳对昆虫社会与人类社会对比的部分（法西斯主义以蚂蚁社会为模型的批评）是文化立场论述，不是社会学定量结论。<\/p>\n<h2>反例<\/h2>\n<p>原子弹背景下“懂得如何做”被用来决定目标本身：附录批评不仅用技术决定目标如何实现，还用它决定目标是什么。反例的结构是：手段能力溢出到目标层，价值问题被效率问题替代。<\/p>\n<h2>辨析<\/h2>\n<p>与技术决定论对比：维纳不认为机器自主支配社会；他把危险定位在使用者与目标选择上。与纯工程伦理对比：本概念不提供操作守则，而是区分论证层次——技术观察、风险设想、价值立场三者分开陈述。<\/p>\n<p>与 c09 的分工：c09 重建社会控制的技术外推链；本概念检验这条链到达价值判断时的边界与责任位置。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：c09 博弈与社会统计控制；c07 机器能力边界。后继：本概念是全书收口，把前面所有工程与类比结论放回“为谁控制、控制什么”的问题框架；阅读后续技术文献时，可沿用本概念的分层方法区分手段、目标与责任。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（控制的伦理边界：懂得如何做与懂得做什么）<\/summary><div class=\"depth-body\"><h1>c10 深度片段：控制的伦理边界<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要判断一项控制技术的使用是否越过伦理边界，逆推链条：<\/p>\n<ol><li>\n最终问题：目标由谁选择、责任由谁承担？\n<\/li><li>\n上一层：当前论证停在 know-how 层还是 know-what 层？\n<\/li><li>\n再上一层：风险来自机器自主还是使用者的目标与手段组合？\n<\/li><li>\n再上一层：受控制方的可能性空间是否被压缩到单一选项？\n<\/li><li>\n最底层：参与决策的知识结构是否包含对人性与动机的理解，而不仅是技术骨干？\n<\/ol>\n<h2>正向推导<\/h2>\n<p>第一步，区分两层问题。know-how：信号处理、反馈回路、博弈搜索、预测算法如何实现；know-what：这些结果是否值得追求、对谁有利、代价由谁承担。 第二步，分离能力与正当性。能造出机器不等于应当部署机器；自动钢琴案例中机械技巧成熟不产生音乐目的，手段精致不能替代目标选择。 第三步，定位责任。附录论证：机器自身粗糙，无法展现人类独立行为的千分之一；风险链条为人—机器—他人，即人制造并使用机器，机器放大既有目标。巴特勒《埃瑞璜》的机器征服寓言被维纳评为修辞敏锐而非严格科学评论。 第四步，识别风险形态。借助统计收集与预测技术，群体可能被压向单一可能性；极端状态是个体统计差异趋零、处境可能性被忽略。该图景为思想实验与警告，不是预测定理。 第五步，补救结构。技术决策需要人类学家、哲学家等参与，补充对人性、动机与控制理由的理解；跨学科参与对应知识结构缺口。 第六步，立场声明。维纳自述目的是解释潜力并警告利己利用的危险，而非敦促技术加速开发；此为价值立场，引用时与技术结论分开。<\/p>\n<h2>算例（可检验案例与论证对照）<\/h2>\n<p>算例 1：自动钢琴。工程师着迷机械构造而非音乐；技巧问题被当作目的本身。对照结构：手段层完整，目标层缺席。 算例 2：杜巴莱国家机器设想。收集生产市场信息、确定心理函数、协调政治决策；维纳评估其当前粗糙，风险在使用者借机器控制群体。设想属转述，细节见附录原文。 算例 3：1948 年盖洛普民调。作为人类事务预测失效的例子被引用；本书未给出民调方法与误差数据，只能作为转述例证。 算例 4：选择性/限制性决定对照（第九章）。学习机不内置规则会漂移任务方向；伦理层面对应：不约束目标的能力系统会把行为方向交给偶然经验。<\/p>\n<h2>边界与失败案例<\/h2>\n<ul><li>\n把警告当预测定理：极端社会图景是思想实验，不具事实预测地位。\n<\/li><li>\n把时代局势评述当普遍规律：美苏博弈、舆论战段落保留 1950 年代语境。\n<\/li><li>\n用效率论证替代价值论证：“可行”“更快”“更省”回答不了“是否应当”。\n<\/li><li>\n把巴特勒寓言当科学评论：附录自己标明其修辞性质。\n<\/ul>\n<h2>补充推导：附录论证链的逐环复核<\/h2>\n<p>附录开篇先界定讨论对象：通信机器模拟人类行为的能力揭示人类行为可能本质，也显示人类行为相对缓慢低效；作者的目的不是敦促技术开发，而是解释潜力并警告利己利用的危险。这一自我定位先于任何技术结论。 人的定义一节排除两种做法：没有羽毛的两足动物只把人与拔毛鸡、袋鼠归为一类；有灵魂的动物说法无法被行为主义方法证实。附录取“人是会说话的动物”作为出发点：交流冲动强烈到盲聋双重剥夺也不能完全遏制，劳拉·布里奇曼与海伦·凯勒的训练经历是旁证。语言与交流由此成为控制论社会讨论的入口，而不是机器能力的附属品。 模式概念一节给出结构对应判据：两个模式关系结构一一对应，对应项之间顺序关系相似，即为等同；五个便士与五个苹果可逐一对位，整数序列与偶数序列也存在对应。这一层结构同构是机器类比与社会类比共用的形式语言，但同构只保证关系结构对应，不保证价值与目的一致。<\/p>\n<h2>补充推导：风险形态与补救结构复核<\/h2>\n<p>杜巴莱评论转述后，维纳区分两种危险：机器自主控制人类的危险，与使用者借机器增加控制的危险。前者被评估为当前机器过于粗糙，无法展现人类目标性独立行为的千分之一；后者是真实风险——政治权术可能狭隘冷漠到像机器构思出来，机器缺陷在于无法兼顾人类处境的巨大可能性。极端状态描述为社会处于熵增最后阶段、个体统计差异为零；这是思想实验式警告，不是未来预测。 补救结构对应知识缺口：技术骨干之外需要严肃人类学家、对世界事务好奇的哲学家参与；科学家需要了解人的本性、内在动机，知道为什么希望控制他人。附录同时记录巴特勒《埃瑞璜》的机器征服寓言，并标明其时代局限：巴特勒不理解机器行为真正本质，言论更接近敏锐修辞而非严格科学评论。<\/p>\n<h2>补充推导：know-how 溢出 know-what 的案例结构<\/h2>\n<p>自动钢琴案例：工程师购买昂贵自动钢琴，着迷于机械构造而非音乐兴趣；工具不是为创作音乐，而是展示发明家克服困难的技巧。附录把这一态度对中学二年级学生尚可，对决定国家整体文化未来的人则成问题。原子弹背景下的批评是：“懂得如何做”不仅决定目标如何实现，还被用来决定目标是什么。手段能力溢出到目标层，价值问题被效率问题替代，是伦理越界的基本结构。<\/p>\n<h2>常见误读对照<\/h2>\n<p>误读一：把警告当预测定理。极端社会图景是思想实验，不具事实预测地位。 误读二：把时代局势评述当普遍规律。美苏博弈、舆论战段落保留 1950 年代语境。 误读三：用可行、更快、更省回答是否应当。效率论证替代不了价值判断。 误读四：把巴特勒寓言当科学评论。附录自己标明其修辞性质。<\/p>\n<h2>与本书其他概念的衔接<\/h2>\n<p>c09 重建社会控制技术外推链，本片段检验其到达价值判断时的边界；c07 机器能力边界是伦理讨论的技术前提；后续阅读技术文献时，可沿用本片段分层方法区分手段、目标与责任。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nknow-how 与 know-what 各回答什么问题？自动钢琴案例缺的是哪一层？\n<\/li><li>\n维纳为什么把危险定位在使用者而不是机器本身？\n<\/li><li>\n极端社会图景在论证中承担什么角色？它是不是预测结论？\n<\/li><li>\n跨学科参与补救的是知识结构中的哪一类缺口？\n<\/li><li>\n引用附录的国际局势评述时，为什么必须保留时代语境？\n<\/ol>\n<h2>延伸补充<\/h2>\n<p>附录从人的定义切入排除两种窄化：两足无毛动物只做表面分类，灵魂说法无法被行为主义方法证实；“会说话的动物”把交流冲动作为人性出发点，盲聋剥夺也不能完全遏制这一冲动。模式概念给出结构同构判据：一一对应加顺序关系相似即为等同，便士与苹果、整数与偶数序列都可对位。同构只保证关系结构对应，不保证价值与目的一致，这是机器类比与社会类比共用的形式语言边界。<\/p>\n<p>风险定位在使用者一侧。机器当前粗糙到无法展现人类独立行为的千分之一；真实风险是人借机器增加对其他群体的控制，权术狭隘冷漠到像机器构思。极端社会图景（个体统计差异趋零、处境可能性被忽略）是思想实验式警告，不是未来预测。补救结构要求技术骨干之外纳入人类学家与哲学家，补的是人性、动机与控制理由这一知识缺口。巴特勒《埃瑞璜》寓言被标明为时代修辞，不是严格科学评论。<\/p>\n<p>know-how 溢出 know-what 的基本结构是：手段能力被用来决定目标本身，价值问题被效率问题替代。自动钢琴案例中机械技巧成熟而音乐目的缺席；原子弹背景下的批评指向同一结构。引用附录国际局势评述时保留 1950 年代语境，作者论断与技术观察分段陈述，是阅读本章的基本纪律。<\/p>\n<h2>延伸推演：控制伦理边界成立的子条件<\/h2>\n<p>伦理约束能落到实处，依赖五条子条件，去掉任一条边界松动。 子条件一：技术能力可评估。系统能做什么、作用范围多大，有可核对的描述。能力边界说不清时，伦理判断没有对象。 子条件二：用途归属可追溯。谁部署、谁授权、谁承担后果，链条可查。归属不清时，责任在多方之间悬空。 子条件三：反馈回路可被外部监督。控制端能被观察、干预或切断。回路封闭且不受外部检视时，纠偏方向由内部单方决定。 子条件四：价值标准先于部署。目标与可接受范围在系统上线前确定，不由运行中临时追加。事后补标准，已产生的不可逆后果无法收回。 子条件五：不可逆后果可识别。哪些损害不可撤销，先于技术方案标出。把不可逆项当作可逆项处理，边界判断整体失效。 五条子条件中，前两条是事实核对，后三条是制度安排；伦理边界不是一句价值声明，而是可逐项检查的条件清单。<\/p>\n<h2>第二算例：两方案的风险期望对照<\/h2>\n<p>设风险期望为失效概率 <span class=\"katex-inline\">p<\/span> 乘后果量级 <span class=\"katex-inline\">c<\/span>。方案甲：<span class=\"katex-inline\">p=0.05<\/span>，<span class=\"katex-inline\">c=100<\/span>，风险期望 <span class=\"katex-inline\">0.05\\times100=5.0<\/span>。方案乙：<span class=\"katex-inline\">p=0.01<\/span>，<span class=\"katex-inline\">c=1000<\/span>，风险期望 <span class=\"katex-inline\">0.01\\times1000=10.0<\/span>。低概率高后果的方案乙风险期望高于高概率低后果的方案甲。单位核对：<span class=\"katex-inline\">p<\/span> 无量纲，<span class=\"katex-inline\">c<\/span> 为约定后果标度（本例无量纲，实际场景可折算为损失单位），风险期望单位与 <span class=\"katex-inline\">c<\/span> 相同。该对照只说明概率与后果需并列评估；后果量级不可加时，期望数值不能作为唯一取舍依据。<\/p>\n<h2>对抗性追问：技术是中性的吗？<\/h2>\n<p>需要拆开“中性”的两层含义。材料与结构层面，工具本身不自带道德立场；能力层面，特定技术放大某些行动方式、限制另一些方式，部署后会塑造使用场景。维纳在附录与相关论述中把危险指向使用者、目的与部署选择，同时提醒高能力机器带来的责任问题（转述，附录）；其立场属于作者论断，不是技术哲学上已证的中性论命题。后续发展方面，技术伦理中关于工具中性论与能力塑造论的争论在本书之后展开，本书未给出系统立场。判据落点：评价一项控制技术，不能只问工具是否中立，还要核对能力倾向、用途归属与不可逆后果；责任归属在部署链条中，不在机器本身。<\/p>\n<h2>补充推演：责任链条的分段<\/h2>\n<p>控制技术的责任沿链条分段：设计者确定能力边界与目标函数，部署者选择用途与场景，使用者执行具体操作，监督者保留外部干预与切断权。任一段缺位，责任向相邻段挤压；机器本身不承担责任。伦理边界检查按段核对：设计段看能力是否被夸大，部署段看用途是否在授权内，使用段看操作是否符合规则，监督段看回路是否可被外部检视。<\/p>\n<h2>边界再核<\/h2>\n<p>本书成书年代早于现代自动化武器、算法推荐与自主系统，其伦理论述针对当时的机器与社会组织形态。引用其伦理判断时，问题对象需按当代技术更新；本书提供的是“能力—目的—责任”的分析框架，不直接给出当代具体场景的合规结论。<\/p><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：时间与统计：从牛顿可逆世界到统计平衡的时间序列<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1–3 章：牛顿时间、群体统计与时间序列（时间与统计）<\/a><br>检查点：能区分牛顿力学时间可逆与统计过程不可逆，讲清遍历假说成立条件，并写出熵与信息量的对数度量及对应数值例<\/li><li class='path-step' id='path-02'><strong>步骤 02：反馈、振荡与组织：负反馈怎样稳住系统，又怎样因失调变成振荡<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 4、10 章：反馈、振荡与自组织系统（反馈、熵与组织）<\/a><br>检查点：能写出一阶负反馈回路的增益与稳态误差关系，区分线性振荡与张弛振荡，并说清组织作为局部熵减的条件与边界<\/li><li class='path-step' id='path-03'><strong>步骤 03：计算与认知：计算机—神经系统类比、格式塔感知与学习机<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 5、6、9 章：计算机与神经系统、格式塔、学习和自增殖机（计算与认知的类比）<\/a><br>检查点：能列出数字机与模拟机、冗余表决机制在神经侧的对应与不对应处，讲清视觉多级反馈与不变量识别，并标注类比何处是猜想<\/li><li class='path-step' id='path-04'><strong>步骤 04：病理态与社会控制：异常反馈、博弈论外推与控制的伦理边界<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 7、8 章及附录：精神病理学、信息语言与社会（病理态与社会控制）<\/a><br>检查点：能把精神病理学类比放回证据等级，区分博弈论的可核部分与社会外推的作者论断，并陈述维纳对技术控制扩张的伦理警告及其依据<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='遍历假设（各态历经假说）'>遍历假设（各态历经假说） — 吉布斯提出的假设：系统在足够长时间内会经过相空间中所有可达状态区域；维纳援引库普曼斯、冯·诺依曼、伯克霍夫的遍历定理说明时间平均与相位平均在保测变换条件下可互换 <span class=glossary-ref>（第 1–3 章：牛顿时间、群体统计与时间序列（时间与统计））<\/span><\/li><li data-term='时间序列'>时间序列 — 按时间顺序记录的数值序列，从缓慢的温度、股价到高速的电话电压；维纳在统计平衡假设下研究其预测与滤波 <span class=glossary-ref>（第 1–3 章：牛顿时间、群体统计与时间序列（时间与统计））<\/span><\/li><li data-term='信息量'>信息量 — 以事件概率的负对数度量的选择量；两个等可能二选一的决定为一个基本单位，信息在维纳框架内是负熵 <span class=glossary-ref>（第 1–3 章：牛顿时间、群体统计与时间序列（时间与统计））<\/span><\/li><li data-term='熵（统计意义）'>熵（统计意义） — 相空间概率测度对数所度量的无序程度；孤立系统中熵几乎不会自发减少，即热力学第二定律 <span class=glossary-ref>（第 1–3 章：牛顿时间、群体统计与时间序列（时间与统计））<\/span><\/li><li data-term='负反馈'>负反馈 — 把受控量的实际状态返回控制端，用于抵消受控量对设定值偏离的反馈链；温控器、调速器、舵机是书中的机械例子 <span class=glossary-ref>（第 4、10 章：反馈、振荡与自组织系统（反馈、熵与组织））<\/span><\/li><li data-term='反馈链'>反馈链 — 信息从效应器返回控制中心的传递与返回链条；链中可含人工环节（信号员），也可完全由机械或电磁装置构成 <span class=glossary-ref>（第 4、10 章：反馈、振荡与自组织系统（反馈、熵与组织））<\/span><\/li><li data-term='自持（张弛）振荡'>自持（张弛）振荡 — 非线性系统在能量输入与耗散达到平衡后维持的周期性振荡；振幅由系统自身确定，区别于振幅不确定的线性保守振荡 <span class=glossary-ref>（第 4、10 章：反馈、振荡与自组织系统（反馈、熵与组织））<\/span><\/li><li data-term='内环境稳态'>内环境稳态 — 高等动物体温、渗透压、心率、血压等内部参数被反馈机制维持在狭窄范围内的状态；对应书中缓慢的稳态反馈系统 <span class=glossary-ref>（第 4、10 章：反馈、振荡与自组织系统（反馈、熵与组织））<\/span><\/li><li data-term='模拟计算机'>模拟计算机 — 以连续刻度上的测量值表示数据的机器，如布什微分分析器、计算尺；精度由刻度构造精度决定 <span class=glossary-ref>（第 5、6、9 章：计算机与神经系统、格式塔、学习和自增殖机（计算与认知的类比））<\/span><\/li><li data-term='数字（数控）设备'>数字（数控）设备 — 数据由一系列离散选择集表示的机器，按二值原则构造时每个选择给出两个替代方案；高精度工作中比模拟设备更可取 <span class=glossary-ref>（第 5、6、9 章：计算机与神经系统、格式塔、学习和自增殖机（计算与认知的类比））<\/span><\/li><li data-term='格式塔（完形）识别'>格式塔（完形）识别 — 在角度、大小、光照变化下识别同一对象形态的感知能力；书中通过眼肌反馈、视网膜通道压缩与轮廓强调加以机制解释 <span class=glossary-ref>（第 5、6、9 章：计算机与神经系统、格式塔、学习和自增殖机（计算与认知的类比））<\/span><\/li><li data-term='冯·诺依曼博弈理论'>冯·诺依曼博弈理论 — 从博弈末端倒推最优策略的理论框架，假设对手为完美高手；维纳指出在对手有失误记录的真实对局中直接套用并不合理 <span class=glossary-ref>（第 7、8 章及附录：精神病理学、信息语言与社会（病理态与社会控制））<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：先分可核数学、工程事实、作者论断三层<\/h2>\n<p>读维纳式论述，先拆它落在哪一层：可复算的定理与公式（遍历定理、信息对数度量、表决概率）是数学层；已实现或可观察的装置与病例（温控器、调速器、视网膜收拢）是工程事实层；越过证据的全称判断与时代评述（社会不稳定、国家机器风险、病理类比）是作者论断层。引用时只把数学层当结论，工程事实标来源场景，论断层保留证据强度标注。<\/p>\n<h2>模式 2：系统边界先划在熵账之前<\/h2>\n<p>遇到“有序结构违背第二定律”一类说法，先问系统是否孤立。局部熵减必须把环境耦合纳入总账；只统计生物体或气体、漏掉妖与环境，是常见塌账位置。组织、生命、自组织讨论都先划边界再谈熵。<\/p>\n<h2>模式 3：反馈回路按方向、相位、增益三步查稳<\/h2>\n<p>分析一个反馈系统，依次查：返回信号方向是否与偏差相反；回路延迟与惯性在工作频率上是否造成相位反转；增益是否落在稳定边界内。方向反接成正反馈，相位反转使负反馈失效，增益过高压缩稳定余量；三步定位后再谈振荡形态。<\/p>\n<h2>模式 4：类比先标功能层还是实现层<\/h2>\n<p>机器—神经、机器—社会类比出现时，先问对应停留在存储、运算、反馈、容错的功能结构，还是深入到物理实现。功能层相似可作为建模入口；实现层断言需要解剖或实验证据，证据不足时只写“设想”“类比”。<\/p>\n<h2>模式 5：博弈模型先查规则完备性<\/h2>\n<p>把任何多人互动当博弈处理前，先查规则是否明确、是否随参与者反应变化、步数能否截断。规则完备且可估值时倒推有效；规则不完备、随时间漂移时，数学博弈框架只能提供语言，不能给出稳定解。<\/p>\n<h2>模式 6：技术结论与价值判断分开陈述<\/h2>\n<p>写作或引用控制论社会议题时，技术观察（信息传播范围、群体决策比例、机器可靠性）与价值立场（危险来源、目标选择、跨学科参与）分段呈现；作者基于时代背景的判断不升格为普遍规律，思想实验不写成预测定理。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1–3 章 时间与统计<\/strong>：牛顿时间可逆 vs 柏格森时间不可逆 → 吉布斯系综与两种平均 → 遍历假设修正与遍历定理 → 平稳时间序列 → 信息量与熵的负对数度量。\n<\/li><li>\n<strong>第 4、10 章 反馈、振荡与组织<\/strong>：反馈链与负反馈 → 比例增益与稳态误差 → 发散/边界/自持振荡 → 张弛振荡能量收支 → 麦克斯韦妖与亚稳态 → 非线性自组织系统。\n<\/li><li>\n<strong>第 5、6、9 章 计算与认知类比<\/strong>：记录成本与二进制 → 数字机/模拟机 → 功能层对应与实现层边界 → 眼肌定位反馈与视网膜收拢 → 轮廓强调与多级压缩 → 博弈倒推与学习机。\n<\/li><li>\n<strong>第 7、8 章及附录 病理与社会<\/strong>：冗余表决可靠性 → 功能性疾病信息模型（类比设想）→ 群体信息与自主性 → 博弈外推社会及其失效条件 → know-how 与 know-what 的伦理分界。\n<\/ul>\n<h2>原书章节与本伴侣单元对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>原书章节<\/th><th>本单元<\/th><\/tr><\/thead><tbody><tr><td>导言<\/td><td>背景：与罗森布鲁斯等人的跨学科合作<\/td><\/tr><tr><td>第一章 牛顿时间和柏格森时间<\/td><td>ch01<\/td><\/tr><tr><td>第二章 群体与统计力学<\/td><td>ch01（熵、遍历）、ch02（麦克斯韦妖）<\/td><\/tr><tr><td>第三章 时间序列、信息和通信<\/td><td>ch01<\/td><\/tr><tr><td>第四章 反馈和振荡<\/td><td>ch02<\/td><\/tr><tr><td>第五章 计算机和神经系统<\/td><td>ch03<\/td><\/tr><tr><td>第六章 格式塔与一般概念<\/td><td>ch03<\/td><\/tr><tr><td>第七章 控制论和精神病理学<\/td><td>ch04<\/td><\/tr><tr><td>第八章 信息、语言和社会<\/td><td>ch04<\/td><\/tr><tr><td>第九章 关于学习和自增殖机<\/td><td>ch03（博弈学习）、ch04（社会外推）<\/td><\/tr><tr><td>第十章 脑电波和自组织系统<\/td><td>ch02（自组织、非线性反馈）<\/td><\/tr><tr><td>附录 人有人的用处：控制论与社会<\/td><td>ch04<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>证据等级速记<\/h2>\n<ul><li>\n<strong>可核数学<\/strong>：时间反演对称性、遍历定理条件、信息熵公式、稳态误差 <span class=\"katex-inline\">e=r/(1+K)<\/span>、表决坏多数概率、极小化极大倒推。\n<\/li><li>\n<strong>工程/观察事实<\/strong>：温控器、瓦特调速器、舵机、计算尺精度限制、视网膜一对一与多对一、脑电 α 节律约每秒 10 次。\n<\/li><li>\n<strong>作者论断/类比设想<\/strong>：酶是亚稳态麦克斯韦妖、神经系统三通道冗余、功能性疾病信息模型、社会统计控制可行性、通信发达与社会不稳定、国家管理机器风险图景。\n<\/ul>\n<h2>关键公式<\/h2>\n<ul><li>\n信息量：<span class=\"katex-inline\">I=-\\log_2 p<\/span>；信息熵：<span class=\"katex-inline\">H=-\\sum_i p_i\\log_2 p_i<\/span>。\n<\/li><li>\n比例负反馈：<span class=\"katex-inline\">y=\\dfrac{K}{1+K}r<\/span>，<span class=\"katex-inline\">e=\\dfrac{r}{1+K}<\/span>；扰动残留 <span class=\"katex-inline\">\\dfrac{d}{1+K}<\/span>。\n<\/li><li>\n三通道表决坏多数：<span class=\"katex-inline\">P_{\\text{坏}}=3p^2(1-p)+p^3<\/span>。\n<\/li><li>\n博弈倒推：<span class=\"katex-inline\">V_{\\text{self}}=\\max_a\\min_b V(a,b)<\/span>。\n<\/ul>"}};

/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  if(typeof vis !== 'undefined'){ networkLoaded = true; cb(); return; }
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE) { cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库未加载：离线构建请加 <code>--offline all</code>，或联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

function getMastery(cid){
  if(!cid) return 0.5;
  const m = (state.mastery||{})[cid];
  return m !== undefined ? m : 0.3;
}
function updateMastery(cid, delta){
  if(!cid) return;
  if(!state.mastery) state.mastery = {};
  const cur = state.mastery[cid] !== undefined ? state.mastery[cid] : 0.3;
  state.mastery[cid] = Math.max(0, Math.min(1, cur + delta));
  store.set('mastery', state.mastery);
}
function masteryBar(cid){
  const v = Math.round(getMastery(cid)*100);
  return `<div class="mastery-bar"><div style="width:${v}%"></div></div><span class="mastery-label">掌握度 ${v}%</span>`;
}

/* ---------- 搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIndex = null;
let pendingHl = [];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP = new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                        '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                        '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw = q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out = [];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length > 2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low = text.toLowerCase();
  let pos = -1, hit = '';
  for(const t of terms){ const i = low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start = Math.max(0, (pos<0?0:pos) - 60);
  const end = Math.min(text.length, (pos<0?0:pos) + 140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms = pendingHl.slice(); pendingHl = [];
  if(!terms.length) return;
  const root = $('#view'); if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first = null, idx = -1, term = '';
  while((node = walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low = node.nodeValue.toLowerCase();
    for(const t of terms){
      const i = low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){
        first = node; idx = i; term = t;
      }
    }
  }
  if(!first) return;
  try{
    const i = first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range = document.createRange();
    range.setStart(first, i); range.setEnd(first, i+term.length);
    const mark = document.createElement('mark');
    mark.className = 'hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'), 1800);
  }catch(e){}
}
document.addEventListener('click', (e)=>{
  const a = (e.target && e.target.closest) ? e.target.closest('.search-hit a') : null;
  if(a && a.dataset.hl) pendingHl = tokenizeQuery(a.dataset.hl);
});
function searchHref(id){
  const map = {'__path__':'#/path','__diagnosis__':'#/diagnosis','__graph__':'#/graph',
               '__cards__':'#/cards','__glossary__':'#/glossary','__patterns__':'#/patterns',
               '__cheatsheet__':'#/cheatsheet'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '#/quiz/'+id.replace('__quiz_','').replace(/__$/,'');
  if(id.startsWith('__')) return '';
  return '#/'+id;
}
function searchLabel(id){
  if((manifest.chapters||[]).some(c=>c.id===id)) return '章节：'+id;
  if((manifest.concepts||[]).some(c=>c.id===id)) return '概念：'+id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '测验';
  return id;
}
function pageTitle(id){
  const ch = (manifest.chapters||[]).find(c=>c.id===id);
  if(ch) return ch.title || id;
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp) return cp.title || id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')){
    const q = (manifest.quizzes||[]).find(x=>'__quiz_'+x.id===id);
    return q ? '测验 · '+String(q.question||'').slice(0,14) : '测验';
  }
  return id;
}
function chapOf(id){
  const chs = manifest.chapters || [];
  const ci = chs.findIndex(c=>c.id===id);
  if(ci >= 0) return {key:'ch:'+id, label:chs[ci].title||id, order:ci};
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp){
    const chId = (cp.chapterIds||[])[0];
    const i = chs.findIndex(c=>c.id===chId);
    if(i >= 0) return {key:'ch:'+chId, label:chs[i].title||chId, order:i};
    return {key:'zz', label:'未归入章节', order:900};
  }
  return {key:'tools', label:'术语与工具页', order:950, ref:true};
}
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    const href = searchHref(id);
    if(!href) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, href, text, label:pageTitle(id), chap:chapOf(id)});
  });
  return searchIndex;
}
function synOf(t){
  const out = [];
  for(const g of SYN_GROUPS){ if(g.indexOf(t) >= 0){ for(const x of g){ if(x !== t) out.push(x); } } }
  return out.slice(0,6);
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim();
  if(!v){ showPage(routeIdFromHash()); return; }
  const terms = tokenizeQuery(v);
  if(!terms.length){ showPage(routeIdFromHash()); return; }
  const grams = [];
  terms.forEach(t=>{ if(t.length >= 2){ for(let i=0;i+2<=t.length;i++) grams.push(t.slice(i,i+2)); } });
  const qGrams = [...new Set(grams)].slice(0,16);
  const snippetTerms = terms.concat(...terms.map(synOf)).slice(0,24);
  const hits = [];
  buildSearchIndex().forEach(p=>{
    const low = p.text.toLowerCase();
    let tHit = 0, sHit = 0, gHit = 0, first = '', viaSyn = '';
    for(const t of terms){
      if(low.includes(t)){ tHit++; if(!first) first = t; continue; }
      for(const s of synOf(t)){
        if(low.includes(s)){ sHit++; if(!viaSyn) viaSyn = s; if(!first) first = s; break; }
      }
    }
    for(const gm of qGrams){ if(low.includes(gm)) gHit++; }
    if(tHit > 0 || sHit > 0 || gHit >= 4){
      hits.push({p, score: tHit*100 + sHit*30 + Math.min(gHit,20), first, viaSyn});
    }
  });
  hits.sort((a,b)=> b.score-a.score || a.p.text.length-b.p.text.length);
  const top = hits.slice(0,20);
  let body;
  if(top.length){
    const gs = {};
    top.forEach(h=>{
      const k = h.p.chap.key;
      (gs[k] = gs[k] || {label:h.p.chap.label, order:h.p.chap.order, ref:!!h.p.chap.ref, hits:[]}).hits.push(h);
    });
    const eff = g => Math.max(...g.hits.map(x=>x.score)) * (g.ref ? 0.55 : 1);
    const order = Object.values(gs).sort((a,b)=> eff(b)-eff(a));
    body = order.map(g=>{
      const inner = g.hits.sort((a,b)=> b.score-a.score).map(h=>
        `<div class="search-hit"><a href="${h.p.href}" data-hl="${esc(h.first)}">${esc(h.p.label)}</a>${h.viaSyn?`<span class="syn-note">同义命中：${esc(h.viaSyn)}</span>`:''}<br><span class="sub">${hlSnippet(h.p.text, snippetTerms)}</span></div>`).join('');
      return `<div class="search-group"><div class="grp-head">${esc(g.label)}<span class="grp-count">${g.hits.length}</span></div>${inner}</div>`;
    }).join('');
  } else {
    body = '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语，或减少关键词。</div>';
  }
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' + body;
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof mermaid === 'undefined') return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  if(typeof mermaid !== 'undefined'){ boot(); return; }
  const urls=['https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js',
              'https://registry.npmmirror.com/mermaid/10.9.1/files/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js'];
  let ui=0, done=false;
  const tryNext=()=>{
    if(done || ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    const timer=setTimeout(()=>{ if(done) return; s.onload=null; s.onerror=null; s.remove(); tryNext(); }, 4000);
    s.onload=()=>{ done=true; clearTimeout(timer); boot(); };
    s.onerror=()=>{ clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

<script id="zs-visual-init">
(function(){
  try{
    var B=document.body, H=document.documentElement;
    if(!B.dataset.theme && !H.dataset.theme) B.dataset.theme='dark';
    var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
    var scope=document.querySelectorAll('header, .topbar, .topbar-fixed, #topbar, .sidebar, .tabs, .hdr-right, .card-actions, .card-controls, .section-title, .card .icon, .icon-label');
    for(var i=0;i<scope.length;i++){
      var w=document.createTreeWalker(scope[i],NodeFilter.SHOW_TEXT,null,false), n;
      while(n=w.nextNode()){
        if(EMOJI.test(n.nodeValue)){
          n.nodeValue=n.nodeValue.replace(EMOJI,'').replace(/[ \t]+/g,' ').replace(/^ | $/g,'');
        }
      }
    }
    var btn=document.getElementById('theme-btn')||document.getElementById('theme')||document.getElementById('themeToggle');
    function label(){
      if(!btn) return;
      var light=B.dataset.theme==='light'||H.getAttribute('data-theme')==='light'||B.dataset.theme==='';
      if(btn.textContent.trim()===''||/浅色|深色/.test(btn.textContent)) btn.textContent=light?'深色':'浅色';
    }
    label();
    if(btn){
      new MutationObserver(label).observe(B,{attributes:true,attributeFilter:['data-theme']});
      new MutationObserver(label).observe(H,{attributes:true,attributeFilter:['data-theme']});
      btn.addEventListener('click',function(){setTimeout(label,0);},true);
    }
  }catch(e){}
})();
</script>
