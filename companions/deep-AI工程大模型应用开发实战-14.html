ass=\"katex-inline\">k<\/span> 的口径是「<span class=\"katex-inline\">k<\/span> 次尝试中至少一次成功」，反映的是采样机会而非单样本质量；报告单次真实水平要用 pass@1。<\/p>\n<p>无可执行目标时，走参考对照。精确匹配是二元判定，词汇相似度看 n-gram 等表面重叠，语义相似度靠嵌入空间距离。嵌入算法的目标是让同义近距离、异义远距离；质量可由「相似文本嵌入是否更近」检验，也可在分类、检索、聚类等任务上实测，通用基准为 MTEB（PDF 第 156 页）。<\/p>\n<p>相似度度量不只用于评估：检索找相似项、排序按相关度、聚类分组、异常检测、数据去重都复用同一套距离计算（PDF 第 150 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：判断一个任务能否自动评分；为代码/SQL 类任务选功能正确性口径；为翻译/摘要选相似度对照方式。\n<\/li><li>\n边界一：复杂任务常只由 AI 完成一部分，评估部分解决方案比评估最终结果更难；如下棋，看最终输赢容易，评估单步好坏困难（PDF 第 148 页）。\n<\/li><li>\n失败案例一：用 pass@k 高样本数论证单模型质量。<span class=\"katex-inline\">k<\/span> 增大只是增加尝试次数，pass@k 上升不代表单次输出更可靠。\n<\/li><li>\n失败案例二：词汇相似度当语义相似度。表面用词不同但含义一致的翻译，词汇重叠低却应判为好；反过来说，用词接近也可能语义相反。\n<\/li><li>\n边界二：嵌入质量依赖嵌入模型与任务；专用嵌入模型（BERT、CLIP、Sentence Transformers）质量通常高于从通用模型中间层抽取的向量（PDF 第 155 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>功能正确性 vs 相似度<\/strong>：前者看任务是否完成，可执行断言自动判定；后者看输出与参考的接近程度，分词汇与语义两层。\n<\/li><li>\n<strong>精确匹配 vs 词汇相似度<\/strong>：前者二元全对/全错，后者给连续值，容忍部分用词差异。\n<\/li><li>\n<strong>词汇相似度 vs 语义相似度<\/strong>：前者比对表面形式，后者比对含义；多义词、改写、跨语言是前者失效而后后者仍可能有效的场景。\n<\/li><li>\n<strong>有参考 vs 无参考指标<\/strong>：有无标准响应对照；无参考指标适用于缺乏参考数据的生产环境，代价是客观性弱于可执行断言。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c04 的建模指标度量预测难度，本节度量任务结果。后继：c06 的 AI 裁判处理相似度与主观判断难以自动化的部分；c09 检索精度召回复用相似度距离；c12 数据去重复用相似度度量；c07 流水线把这些方法按评估标准组织起来。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（精确评估：功能正确性、pass@k 与基于参考的相似度度量）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：功能正确性口径、pass@k 与相似度度量的适用边界<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清精确评估手段，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先区分判断是否可自动执行<\/strong>。评估要么落到可运行、可断言的目标上，要么只能由人或模型主观比较；两类手段不能混报分数。\n<\/li><li>\n<strong>确认任务有无可测量目标<\/strong>：代码可执行、游戏有得分、调度可算能耗节省；开放式翻译、摘要没有唯一正确输出，只能走参考对照。\n<\/li><li>\n<strong>确认评估对象是最终结果还是中间步骤<\/strong>：端到端输赢容易判，单步动作好坏难判；组件级评估要单独设计。\n<\/li><li>\n<strong>确认参考数据从哪来<\/strong>：人工参考以人类表现为黄金标准，成本高、速度慢；AI 生成参考降低成本，但仍需人工审核把关（PDF 第 149 页）。\n<\/ol>\n<p>依赖链方向：任务目标可测量 → 功能正确性可自动断言 → 无执行目标 → 参考对照（精确/词汇/语义）→ 嵌入作为语义距离的数值基础。<\/p>\n<h2>正向推导：从可执行目标到相似度对照<\/h2>\n<h3>第一步：功能正确性的判定结构<\/h3>\n<p>功能正确性按系统是否实现预期功能评估。以代码生成为例：要求模型写 <code>gcd(num1, num2)<\/code> 求最大公约数；把生成代码送入 Python 解释器，先检查能否运行，再用测试用例核对输出。<code>gcd(15,20)<\/code> 未返回 5，即可判错（PDF 第 147 页）。单元测试在 AI 写代码之前就是软件工程标准实践，LeetCode、HackerRank 等平台一直用这套方法验证提交。<\/p>\n<p>基准测试配套一组测试用例，每个用例含运行场景与预期输出。HumanEval 问题给出多个 assert，逐条核对候选输出；代码类基准（HumanEval、MBPP）与文本转 SQL 基准（Spider、BIRD-SQL、WikiSQL）都依赖功能正确性（PDF 第 147–148 页）。<\/p>\n<h3>第二步：pass@k 的口径推导<\/h3>\n<p>每个问题生成 <span class=\"katex-inline\">k<\/span> 个样本，任一样本通过全部测试用例即视为解决。pass@<span class=\"katex-inline\">k<\/span> = 解决问题数 / 总问题数。设 10 个问题，解决 5 个，pass@3 为 50%（PDF 第 148 页）。由于 <span class=\"katex-inline\">k<\/span> 增大增加尝试次数，解决机会变多，理论上 pass@1 <span class=\"katex-inline\">\\le<\/span> pass@3 <span class=\"katex-inline\">\\le<\/span> pass@10。这一口径衡量「多次尝试能否碰对」，不衡量单次输出质量；对比模型单次表现必须固定 <span class=\"katex-inline\">k<\/span> 并看 pass@1。<\/p>\n<h3>第三步：参考相似度的三层递进<\/h3>\n<p>无可执行目标时，把输出与参考响应比较。参考响应也称真实答案或标准响应，一个输入可对应多个合法参考。相似度由粗到细分四层：评估员人工判断；精确匹配（输出是否与某参考完全一致，二元）；词汇相似度（表面形式重叠，连续值）；语义相似度（含义接近程度，连续值）（PDF 第 150 页）。精确匹配最硬但最脆：合法译法多样，一字之差即判错，会低估质量。<\/p>\n<h3>第四步：嵌入作为语义距离基础<\/h3>\n<p>计算机只处理数字，嵌入把文本转成低维向量。句子「the cat sits on a mat」可表示为 <span class=\"katex-inline\">[0.11,0.02,0.54]<\/span> 这类向量，实际维度常在 100 到 10,000 之间（PDF 第 155 页）。嵌入算法目标：含义相似的文本向量距离更近。检验方式两种：一是看近义文本嵌入是否更近，如猫句应比 AI 研究句更接近狗草地句；二是在分类、检索、聚类等下游任务实测，通用基准 MTEB 评估嵌入在多任务上的质量（PDF 第 156 页）。<\/p>\n<h3>第五步：相似度度量的复用范围<\/h3>\n<p>同一套距离计算不只服务评估：检索找相似项、排序按相关度、聚类分组、异常检测找最不相似项、数据去重移除过近样本（PDF 第 150 页）。因此嵌入质量问题会同时影响检索效果与评估一致性。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：gcd 测试断言<\/h3>\n<p>候选代码对 (15,20) 输出 5 为通过；对 (15,20) 输出其他值判错。一组断言覆盖边界、正常输入、重复值；全部通过才算该样本解决。断言失败的样本不进入解决计数。<\/p>\n<h3>算例 2：pass@k 机会成本<\/h3>\n<p>10 题，模型单样本成功率约 30%。<span class=\"katex-inline\">k=1<\/span> 时期望解决约 3 题；<span class=\"katex-inline\">k=3<\/span> 时每题至少一次成功的概率约 <span class=\"katex-inline\">1-0.7^3=0.657<\/span>，期望解决约 6.57 题；<span class=\"katex-inline\">k=10<\/span> 接近 <span class=\"katex-inline\">1-0.7^{10}\\approx0.972<\/span>。数字上升来自尝试次数，不代表模型单次能力变强。<\/p>\n<h3>算例 3：词汇重叠失效场景<\/h3>\n<p>查询与文档都含词项「transformer」，词项检索可能返回电气变压器、神经网络结构、电影《变形金刚》三类文档；词汇重叠相同，语义完全不同（PDF 第 280 页）。此时需要嵌入语义距离区分，词汇相似度无法承担判断。<\/p>\n<h3>算例 4：嵌入维度口径<\/h3>\n<p>示例向量仅 3 维仅作演示；实际嵌入维度 100–10,000。专用嵌入模型包括开源 BERT、CLIP、Sentence Transformers，也有专有 API 嵌入模型；通用模型中间层可抽向量，但质量通常不如专用嵌入（PDF 第 155 页）。<\/p>\n<h3>算例 5：参考数据生产方式<\/h3>\n<p>人工参考成本高、速度慢；AI 生成参考降低成本，仍需人工审核。审核工作量低于从零写参考，但不能省略——参考若带错，下游评分整体偏移。评估集瓶颈常在参考数据的数量与速度，而不是评分算法。<\/p>\n<h3>算例 6：部分解决方案评估<\/h3>\n<p>国际象棋场景：最终输赢和棋容易判，单步棋好坏难以对照；AI 只完成任务一部分时，评估部分方案比评估端到端结果更难。这类场景需要拆出中间组件，分别设计评估口径（与 c07 流水线组件评估衔接）。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>用 pass@10 论证模型单次可靠<\/strong>：高 <span class=\"katex-inline\">k<\/span> 放大尝试机会，单样本错误率被掩盖；上线后用户一次请求只得到一个输出，真实体验对应 pass@1。\n<\/li><li>\n<strong>精确匹配评开放式生成<\/strong>：合法表达多样，匹配过脆；好译文因用词不同被判错，评估区分度失效。\n<\/li><li>\n<strong>词汇相似度代替语义判断<\/strong>：多义词、改写、跨语言场景下表面重叠与含义脱钩，检索与评分都会偏向字面接近的错误答案。\n<\/li><li>\n<strong>不审核 AI 生成参考<\/strong>：参考错误被当成黄金标准，模型输出偏离错误参考时被误判，整条评估流水线的地基松动。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ol><li>\n功能正确性为什么在代码任务上可以自动化？靠什么执行判定？\n<\/li><li>\npass@k 中 <span class=\"katex-inline\">k<\/span> 增大，分数为什么上升？这说明了什么局限？\n<\/li><li>\n精确匹配、词汇相似度、语义相似度各比对什么？\n<\/li><li>\n嵌入质量的两种检验方式是什么？\n<\/li><li>\n相似度度量还复用在哪些非评估场景？\n<\/ol>\n<h2>补充推演：边界案例与常见疑问<\/h2>\n<h3>案例 A：可执行任务的断言结构<\/h3>\n<p>代码、SQL、规则配置类任务都能转成断言：给定输入，断言输出满足条件。断言覆盖正常输入、边界输入、重复值与异常值；样本通过全部断言才算解决。解释类任务没有可运行目标，断言无法构造，只能走参考对照或裁判评估。判断任务能不能自动评分，先找得到找不到可执行的目标。<\/p>\n<h3>案例 B：pass@k 的口径陷阱<\/h3>\n<p><span class=\"katex-inline\">k<\/span> 增大解决机会变多，pass@k 上升不代表单样本质量提升。对比模型单次真实水平必须看 pass@1；报告 pass@10 只能说明多次尝试的上限。实践中还要固定测试集与生成参数，否则分数差异来自采样口径而非模型能力。<\/p>\n<h3>案例 C：相似度三层的失效位置<\/h3>\n<p>精确匹配全对全错，合法表达多样时最脆；词汇相似度容忍部分用词差异，但多义词、改写、跨语言场景仍失效；语义相似度按含义判断，依赖嵌入模型质量。三层可以串联：先用词汇粗筛，再用嵌入精排，最终必要时人工或裁判复核。<\/p>\n<h3>案例 D：嵌入质量的两条检验路径<\/h3>\n<p>内部检验：近义文本嵌入距离应更近，异义文本更远；外部检验：在分类、检索、聚类等下游任务上实测。MTEB 通用基准汇总多任务表现，可作为选嵌入模型的初筛；自己的任务分布不同，最终仍要在私有查询上复核。<\/p>\n<h3>案例 E：参考数据生产的审核位置<\/h3>\n<p>人工参考慢而贵，AI 生成参考快但需审核。审核成本低于从零写参考，但不能省略：参考带错，下游评分整体偏移。评估集瓶颈常在参考数据的数量与速度，而不是评分算法本身；缺参考数据时才考虑无参考指标或 AI 裁判。<\/p>\n<h3>案例 F：部分解决方案的评估难度<\/h3>\n<p>下棋看输赢容易，评估单步棋好坏困难；AI 只完成任务一部分时，部分方案比端到端结果更难评。这类场景要把任务拆成中间组件，分别设评估口径，而不是用最终成败一个分数盖住全部环节。<\/p>\n<h3>案例 G：评估集与参考数据的组织<\/h3>\n<p>功能正确性评估集由问题与测试用例组成；参考相似度评估集由问题、参考响应与评分口径组成。参考响应可人工编写或 AI 生成后审核；评估集样本最好来自真实用户查询，覆盖主要说法与边界情况。评估集质量决定所有自动评分的上限：参考带错，下游指标整体偏移。<\/p>\n<h3>案例 H：相似度度量的复用场景<\/h3>\n<p>同一套距离计算用于检索找相似项、排序按相关度、聚类分组、异常检测、数据去重。嵌入质量问题会同时影响检索效果与评估一致性；选嵌入模型时既要查通用基准 MTEB，也要在自有任务上实测近义与异义区分度。<\/p>\n<h3>案例 I：可执行任务的扩展边界<\/h3>\n<p>代码、SQL、规则配置可断言；游戏有明确胜负；资源调度可算节省量。解释、创作、开放对话没有唯一正确输出，断言无法构造，只能走参考对照或裁判评估。判断任务评估方式，先找可执行目标，找不到再选主观比较手段。<\/p>\n<h3>案例 J：部分方案评估的拆解<\/h3>\n<p>复杂任务先拆组件，再对每个中间产物设口径：提取环节比对文本相似度，抽取环节比对准确率，最终环节比对功能正确性。只看端到端成败，中间故障被掩盖；组件评估是定位与优化的前提。<\/p>\n<h3>案例 K：评估方法与任务的匹配检查<\/h3>\n<p>先问任务有没有可执行目标：有则功能正确性与 pass@k；没有则参考相似度或 AI 裁判。再问参考数据是否齐备：有参考走对照，无参考走无参考指标。方法错配时，分数再高也不反映任务质量。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n一个任务没有可执行断言，应选功能正确性还是参考相似度？理由是什么？\n<\/li><li>\n报告模型单次输出水平，应看 pass@1 还是 pass@10？为什么？\n<\/li><li>\n词汇重叠高但语义相反的例子，该用哪一层相似度识别？\n<\/li><li>\nAI 生成参考数据为什么仍需人工审核？\n<\/li><li>\n嵌入模型与从通用模型中间层抽向量，质量口径上有什么差别？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "精确评估：功能正确性、pass@k 与基于参考的相似度度量"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.158<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">精确评估：功能正确性、pass@k 与基于参考的相似度度量<\/a><\/span><\/div><h1>AI 当裁判与比较评估：单评、对照、成对排名及其偏差局限<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（原书 3.4 AI 当裁判、3.4.1 为什么用 AI 当裁判、3.4.2 如何用 AI 当裁判、3.4.3 局限性、3.5 使用比较评估对模型进行排名，PDF 第 158–177 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>开放式响应无法用断言自动判分，人工评估又慢、贵、不可扩展；AI 已能完成许多困难任务，能否也用 AI 评估 AI？这个概念回答：AI 裁判有哪三种用法，什么情况下与人类判断相关性高，哪些偏差与局限必须在流程里控制，成对比较评估怎样给模型排名、又踩哪些坑。<\/p>\n<h2>定义<\/h2>\n<p><strong>AI 当裁判（AI as a Judge / LLM 当裁判）<\/strong>：用一个 AI 模型评估另一个 AI 模型输出的方法；承担评估的模型称 AI 裁判（PDF 第 158 页）。2020 年 GPT-3 发布后裁判模型才具备这种能力，如今已是生产环境常用甚至最常用的评估方法之一；LangChain 2023 报告称平台上 58% 的评估由 AI 裁判完成（PDF 第 159 页）。<\/p>\n<p><strong>三种用法<\/strong>（PDF 第 160 页）：独立给单个响应按标准评分；将生成响应与参考响对照判断一致性；把两个响应并排比较，选出更好或预测用户更偏好的那个。<\/p>\n<p><strong>比较评估<\/strong>：通过成对响应排序给模型排名；可用于后训练对齐数据、推理时计算和模型选型（PDF 第 160、171 页）。<\/p>\n<p>正例：裁判提示词写清任务、标准、评分体系并附分值示例；分类判定优于纯数值评分，离散评分优于连续评分，1–5 分制比大范围分值表现好（PDF 第 161–162 页）。反例：让裁判直接给 1–10 连续分且不给示例，评分边界随裁判状态漂移。<\/p>\n<h2>原理推导<\/h2>\n<p>AI 裁判相对人工的优势：速度快、易用、成本较低；无须参考数据即可工作，适用于缺乏参考数据的生产环境；可按正确性、重复性、毒性、健康性、幻觉等任意标准评判，还能解释自己的判断（PDF 第 159 页）。研究显示强裁判与人类评估员相关性可以很高：MT-Bench 上 GPT-4 与人类一致性 85%，高于人类之间 81% 的一致性；AlpacaEval 裁判与人工排行榜相关性近 0.98（PDF 第 159 页）。<\/p>\n<p>裁判是模型加提示词的系统，不是单一模型：改变模型、提示词、采样参数都会改变结果。提示词要写清任务、评估标准、评分体系；语言模型处理文本分类通常优于处理数值；提示词内包含不同分值的示例效果更好（PDF 第 161–162 页）。<\/p>\n<p>局限来自三方面：裁判本身的概率特性使判断不够可靠；AI 评估 AI 像自我验证；裁判带来额外成本与延迟。比较评估的挑战包括顺序偏差（A/B 位置影响选择）、长度偏差（偏好更长响应）、自我偏好（倾向同家族模型）等；原书 3.5.1 节专门讨论比较评估面临的挑战（PDF 第 174 页前后）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：缺乏参考数据、需要快速批量筛选响应；为偏好训练收集比较信号；生产环境持续监控输出质量。\n<\/li><li>\n边界一：AI 判断不总是可信。每个 AI 模型是海量数据聚合，可能反映普遍观点，但个别标准上与人类判断偏离；裁判结果应与小样本人工抽查对照。\n<\/li><li>\n失败案例一：把裁判评分当黄金标准直接进业务决策。裁判未标准化，不同工具的相关性评分可能差异很大，取决于底层模型与提示词（PDF 第 161 页）。\n<\/li><li>\n失败案例二：忽略裁判成本与延迟。裁判调用本身增加推理开销，高并发评估要计入预算；一些团队只在没有其他方法时把 AI 裁判作为备用方案（PDF 第 164 页）。\n<\/li><li>\n边界二：裁判能力受限于其知识与偏好。角色扮演是否贴合、产品图可信度等主观标准，裁判判断需要在自己的任务上验证一致性。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>AI 裁判 vs 功能正确性<\/strong>：前者主观比较，可解释但有偏差；后者可执行断言，明确无歧义。可自动断言的任务不应依赖裁判口味。\n<\/li><li>\n<strong>单评 vs 成对比较<\/strong>：单评给单个响应打分，受评分尺度影响；成对比较只排相对次序，通常更稳，但容易暴露位置与长度偏差。\n<\/li><li>\n<strong>裁判模型 vs 被评模型<\/strong>：裁判负责评估，被评模型负责生成；二者可以不同家族，自我偏好偏差要求跨家族对照。\n<\/li><li>\n<strong>AI 裁判 vs 人工评估<\/strong>：人工慢贵但可作为校准基准；AI 裁判快而广，用于批量覆盖，人工用于抽查与指南校准。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c05 的相似度度量是裁判可调用的工具之一；c04 的分布不确定性影响裁判抽样稳定性。后继：c07 流水线把裁判作为评估方法之一接入；c10 智能体故障统计可借助裁判标注；c12 偏好数据来自成对比较，与比较评估信号同源；c14 反馈收集为裁判与人工对照提供生产样本。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（AI 当裁判与比较评估：单评、对照、成对排名及其偏差局限）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：AI 裁判的用法结构、相关性证据与偏差控制<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清 AI 裁判的位置，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先确认评估对象是否开放式<\/strong>：可执行任务走功能正确性断言；开放式生成没有唯一答案，才需要主观比较手段。\n<\/li><li>\n<strong>再确认人工评估的瓶颈<\/strong>：慢、贵、不可扩展，缺乏参考数据时尤其卡住；AI 裁判的价值正是补批量覆盖能力。\n<\/li><li>\n<strong>区分裁判系统的组成<\/strong>：裁判不是模型单点，而是「模型 + 提示词 + 采样参数」的系统；任一改动都会移动评分结果。\n<\/li><li>\n<strong>预先列出偏差来源<\/strong>：概率性、顺序、长度、自我偏好等偏差在比较环节最易出现；流程设计要主动对冲，而不是拿到分数再解释。\n<\/ol>\n<p>依赖链方向：开放式输出 → 人工评估瓶颈 → AI 裁判三种用法 → 相关性可验证但有偏差 → 裁判作为流水线一环，与人工抽查对照。<\/p>\n<h2>正向推导：从裁判机制到比较评估<\/h2>\n<h3>第一步：裁判能做什么<\/h3>\n<p>AI 裁判按给定标准评判响应：正确性、重复性、毒性、健康性、幻觉、角色贴合度、产品图可信度等。类比人可以对任何事情发表意见，裁判模型也可被要求按任意标准打分；由于模型聚合了海量数据，可能给出反映普遍观点的判断（PDF 第 159 页）。除分数外，裁判还能解释判断依据，便于审查评估结果。<\/p>\n<h3>第二步：三种用法的结构<\/h3>\n<p>其一，独立评分：给定问题与答案，按 1–5 分等体系评价质量，提示词含任务、标准、分值定义。其二，参考对照：给定问题、参考答案、生成答案，判断是否一致，可替代人工相似度度量。其三，成对比较：给定问题与 A、B 两答案，输出更好的一方；这种信号直接服务偏好微调数据、推理时选择与模型排名（PDF 第 160 页）。<\/p>\n<h3>第三步：相关性证据<\/h3>\n<p>原书引用两项研究：MT-Bench 上 GPT-4 与人类评估员一致性 85%，高于人类评估员之间 81% 的一致性；AlpacaEval 裁判与人工 LMSYS Chat Arena 排行榜相关性近 0.98（PDF 第 159 页）。证据说明强裁判在标准明确时可逼近人类判断，但相关性高不等于每项标准都可信；跨任务、跨风格仍要自行验证。<\/p>\n<h3>第四步：提示词与评分体系设计<\/h3>\n<p>裁判提示词要写清三件事：模型执行的任务；评估遵循的标准；评分体系（分类好/坏、相关/不相关；离散数值 1–5；连续值 0–1）。观察口径：语言模型处理文本分类通常优于数值评分；离散评分优于连续评分；分值范围越大表现越差；提示词带不同分值示例及理由效果更好（PDF 第 161–162 页）。Azure 相关性示例提示即包含任务、标准、低分样例与判低分理由。<\/p>\n<h3>第五步：局限与偏差分类<\/h3>\n<p>局限一：裁判概率性。同一系统判断会波动，看起来不够可靠。局限二：自我验证。用 AI 评 AI，存在循环背书问题。局限三：成本延迟。裁判调用增加额外推理开销，部分团队仅把它作为无其他方法时的备用（PDF 第 164 页）。<\/p>\n<p>比较评估的偏差：顺序偏差，A/B 左右位置影响选择；长度偏差，裁判倾向更长响应；自我偏好，倾向同家族模型；标准漂移，裁判模型或提示词变更后分数不可比。3.5.1 节讨论比较评估面临的各类挑战（PDF 第 174 页前后）。对冲手段包括交换位置重复比较、长度归一化、跨家族裁判、固定提示词版本并保留人工校准集。<\/p>\n<h3>第六步：在流水线中的位置<\/h3>\n<p>裁判不替代功能正确性，也不直接进业务决策；它输出候选信号，与断言指标、人工抽查、业务指标并列。模型选型时，比较排名结果还要回到自有评估集复核，公开基准与裁判分数都不能单独定稿。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：裁判一致性对照<\/h3>\n<p>人类评估员之间一致性 81%，GPT-4 裁判与人类一致性 85%（MT-Bench，PDF 第 159 页）。读数口径：这是特定基准上的相关程度，不是裁判在所有任务上的准确率；换领域、换标准，一致性要重测。<\/p>\n<h3>算例 2：评分体系对比<\/h3>\n<p>1–5 离散分通常优于 1–10 连续分；连续值把判断压到小数，模型把握差；大范围分值放大边界模糊。示例提示词里 1 分样例（与参考矛盾）与 5 分样例（信息充分）各配理由，裁判落点更稳。<\/p>\n<h3>算例 3：裁判成本量级<\/h3>\n<p>一次被评响应配一次裁判调用；批量评估 <span class=\"katex-inline\">N<\/span> 条响应就增加 <span class=\"katex-inline\">N<\/span> 次裁判推理。若被评模型输出 200 token，裁判还要读问题、参考、响应并写理由，裁判 token 数常高于被评输出；高并发场景成本与延迟要单列预算。<\/p>\n<h3>算例 4：成对比较的次数<\/h3>\n<p>对比 <span class=\"katex-inline\">m<\/span> 个模型，每对模型在 <span class=\"katex-inline\">Q<\/span> 个查询上比较；总比较次数随模型对数增长。交换 A/B 位置各跑一次可抵消顺序偏差，但比较成本翻倍；实践中按预算抽样关键查询。<\/p>\n<h3>算例 5：自我偏好识别<\/h3>\n<p>裁判与被评模型同一家族时，可能给同家族响应更高分。对照做法：引入第三方家族裁判，或人工抽样核对同家族 vs 跨家族评分差；偏差显著时调整裁判阵容。<\/p>\n<h3>算例 6：工具间评分不可比<\/h3>\n<p>Azure AI Studio 与 MLflow 的相关性评分口径可能差异很大，取决于底层模型与提示词（PDF 第 161 页）。跨工具比较分数前，先核对裁判模型、提示词版本与评分体系，否则数值高低不构成结论。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>可执行任务也交给裁判打分<\/strong>：断言能明确判对错的场景，引入主观口味只会增加噪声；功能正确性应作为主指标，裁判只作补充。\n<\/li><li>\n<strong>裁判提示词只写「回答好不好」<\/strong>：标准缺失导致评分随裁判状态漂移；没有反例与分值样例，不同响应落分边界不一致。\n<\/li><li>\n<strong>直接采用裁判分数做业务取舍<\/strong>：未做人工校准，未控制长度、顺序、自我偏好偏差，高分数可能来自偏差而非质量。\n<\/li><li>\n<strong>把 AI 裁判当唯一评估<\/strong>：批量信号缺少人工基准对照，裁判自身退化或标准漂移无法被发现；人工抽查是校准锚点，不能省略。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ol><li>\nAI 裁判相对人工评估快在哪、省在哪，又缺什么客观保证？\n<\/li><li>\n三种裁判用法各自的输入输出是什么？\n<\/li><li>\n为什么分类评分通常优于连续数值评分？\n<\/li><li>\n比较评估有哪些典型偏差？各用什么手段对冲？\n<\/li><li>\n裁判结果为什么不能直接替代业务指标？\n<\/ol>\n<h2>补充推演：边界案例与常见疑问<\/h2>\n<h3>案例 A：裁判相关性的适用边界<\/h3>\n<p>MT-Bench 上 GPT-4 与人类一致性 85%、人类之间 81%，AlpacaEval 裁判与人工排行榜相关性近 0.98（PDF 第 159 页）。这些数字是特定基准、特定标准上的相关程度，不是裁判在所有任务上的准确率；换领域、换标准、换响应风格，一致性要重测。把基准相关性当通用保证，是裁判使用中最常见的过度外推。<\/p>\n<h3>案例 B：提示词要素与评分体系<\/h3>\n<p>裁判提示词三件事：任务是什么、按什么标准评、用什么体系打分。文本分类比数值估计更稳，离散评分比连续评分稳，分值范围越大表现越差；提示词内附不同分值示例与理由，落点更集中。评分体系设计与第 4 章评估指南同源：标准不清，裁判分数就随状态漂移。<\/p>\n<h3>案例 C：偏差对冲的具体动作<\/h3>\n<p>顺序偏差：A/B 位置交换各跑一次，结果取多数或对照差异。长度偏差：评估时提示裁判区分内容质量与篇幅，必要时对超长响应单独标注。自我偏好：引入跨家族裁判，或人工抽样核对同家族与跨家族评分差。版本控制：固定裁判模型、提示词与采样参数，变更后用校准集复测，保证分数可跨版本比较。<\/p>\n<h3>案例 D：裁判成本进评估预算<\/h3>\n<p>一次被评响应配一次裁判调用；裁判要读问题、参考、响应并写理由，token 数常高于被评输出。批量评估 <span class=\"katex-inline\">N<\/span> 条响应就增加 <span class=\"katex-inline\">N<\/span> 次推理；高并发或大批量场景，裁判成本与延迟要单列。部分团队只在没有其他方法时把 AI 裁判当备用方案，正是成本与可靠性权衡的结果（PDF 第 164 页）。<\/p>\n<h3>案例 E：比较评估信号的回流<\/h3>\n<p>成对比较结果可回流三处：偏好微调训练数据（胜出/落败对）；推理时候选选择；模型选型排名。比较评估与偏好训练信号同源，但用途不同：训练用信号要经审核，选型用排名要在自有评估集复核。裁判偏差在回流前不控制，会被复制进训练数据。<\/p>\n<h3>案例 F：裁判与人工的分工<\/h3>\n<p>人工评估慢、贵、不可扩展，作为校准基准；AI 裁判快而广，承担批量覆盖。分工不是替代关系：人工定期抽查裁判结果，校准指南与偏差；裁判处理日常批量，人工守住标准锚点。只靠裁判或只靠人工，都会在规模或口径上出问题。<\/p>\n<h3>案例 G：裁判提示词落地清单<\/h3>\n<p>写清任务：模型要评判的输入输出是什么；写清标准：按正确性、相关性、忠实性等哪几个维度；写清体系：二元分类、1–5 离散分或连续值；附不同分值示例与理由。语言模型处理分类优于数值，离散优于连续，示例越具体落点越集中。提示词版本固定后，变更要重新校准。<\/p>\n<h3>案例 H：裁判偏差的记录与对冲<\/h3>\n<p>每次批量评估记录裁判模型、提示词版本、采样参数；顺序偏差用位置交换复测对冲，长度偏差在提示中要求区分内容与篇幅，自我偏好引入跨家族裁判。裁判分数与人工抽查对照，偏差显著时调整裁判阵容或收紧评分口径。<\/p>\n<h3>案例 I：裁判适用边界<\/h3>\n<p>可执行断言能判对错的任务，不交给裁判口味；开放式、无参考数据、需要批量覆盖的场景，裁判价值最高。裁判不替代功能正确性，也不直接进业务决策；它输出候选信号，与断言指标、人工抽查、业务指标并列。<\/p>\n<h3>案例 J：比较评估的成本与回流<\/h3>\n<p>成对比较次数随模型对数增长，交换位置复测再翻倍；实践中按预算抽样关键查询。比较结果回流偏好训练前必须审核，裁判偏差会被复制进训练数据；选型排名也要在自有评估集复核，公开基准与裁判分数不单独定稿。<\/p>\n<h3>案例 K：裁判结论的复核路径<\/h3>\n<p>裁判输出先与小样本人工评估对照一致性；偏差明显时回看裁判模型、提示词与采样参数。任何裁判分数进业务决策前，都要能追溯到裁判版本与评分口径。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n开放式生成任务为什么不适合用功能正确性断言评估？\n<\/li><li>\n裁判系统由哪几部分组成？更换其中一项会发生什么？\n<\/li><li>\nMT-Bench 85% 一致性说明了什么、不说明什么？\n<\/li><li>\n成对比较收集的信号可回流到哪些后续环节？\n<\/li><li>\n跨工具、跨版本的裁判分数为什么不能直接横比？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "AI 当裁判与比较评估：单评、对照、成对排名及其偏差局限"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.181<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">AI 当裁判与比较评估：单评、对照、成对排名及其偏差局限<\/a><\/span><\/div><h1>评估标准、模型选择工作流与评估流水线：硬属性、软属性与分层评估<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书 4.1 评估标准、4.1.4 成本和延迟、4.2 模型选择、4.2.1 模型选择工作流、4.3 设计你的评估流水线，PDF 第 180–224 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>应用要证明价值才能部署，但很多团队说不清自己的应用是否有效；模型候选越来越多，凭直觉选模型容易在质量、延迟、成本之间失衡。这个概念回答：评估标准从哪几个维度组织，模型选择怎样按硬属性、软属性走工作流，评估流水线怎样从组件到任务层级搭起来，并把技术指标映射回业务指标。<\/p>\n<h2>定义<\/h2>\n<p><strong>评估驱动开发<\/strong>：在构建之前先定义评估标准，名称借自软件工程的测试驱动开发；企业里真正落地的多是标准明确的应用（PDF 第 180–181 页）。<\/p>\n<p><strong>四类评估标准<\/strong>（PDF 第 181、197 页）：领域特定能力（编程、特定语言理解等受模型配置约束的能力）；生成能力（连贯性、忠实性等响应质量）；指令遵循能力（格式、长度等约束是否满足）；成本和延迟（每次请求费用与等待时间）。<\/p>\n<p><strong>硬属性<\/strong>：无法或难以改变的属性，多为提供商决策结果（许可、训练数据、模型大小）或自身策略（隐私、控制权）；<strong>软属性<\/strong>：可以改进的属性，如准确性、毒性、事实一致性（PDF 第 200 页）。同一属性在不同条件下软硬不同：用 API 时延迟是硬属性，能自托管优化时延迟是软属性。<\/p>\n<p><strong>评估流水线三层级<\/strong>：任务级、轮次级、中间输出级；既要评端到端最终输出，也要评每个组件的中间输出（PDF 第 221 页）。<\/p>\n<p>正例：先剔除许可、隐私不符的模型，再用公开基准缩小范围，然后自有流水线实验，最后生产监控。反例：只追容易衡量的指标，像夜晚只在路灯下找钥匙，错过难以评估但有颠覆潜力的应用（PDF 第 181 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>模型选择工作流四步：剔除硬属性不符的模型；利用公开基准与排行榜平衡质量、成本、延迟缩小范围；用自有评估流水线实验选最合适模型；生产环境持续监控、收集反馈改进（PDF 第 200 页）。流程迭代进行，新信息可回改先前决策。<\/p>\n<p>流水线设计三步。步骤一评估系统所有组件：简历提取雇主信息失败时，要分清 PDF 转文本出错还是雇主抽取出错；分别按相似度、准确率评估中间步骤。步骤二创建评估指南：既写应该做什么，也写不应该做什么；定义评估标准，选评分体系（二元、1–5、连续值），配带示例的评分标准并请人验证可理解性；把评估指标映射到业务指标，定实用性阈值（PDF 第 222–223 页）。步骤三定义评估方法和数据：不同标准配不同方法，如毒性分类器测有害内容，语义相似度测相关性。<\/p>\n<p>成本延迟是实用底线：质量再高，过慢过贵没有实用价值；多目标优化属帕累托优化范畴，先明确哪些目标不可妥协。延迟指标含 TTFT、TPOT、token 间隔、整段响应时间；API 按 token 收费，输入输出越多费用越高；自托管主要成本是计算资源，规模扩大后单 token 成本可能显著降低（PDF 第 197–198 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：新项目立项前定标准；候选模型筛选；排查复杂系统故障环节；把技术评分翻译成业务回报。\n<\/li><li>\n边界一：公开基准不完全可信。基准分数与实际应用表现有差距，只能用于初筛，定稿必须靠自有评估集。\n<\/li><li>\n失败案例一：跳过评估指南直接上线。已部署但无法评估的应用比不部署更糟，维护成本持续、下线成本更高（PDF 第 180 页）。\n<\/li><li>\n失败案例二：只评端到端结果。中间组件故障被黑箱掩盖，定位不到出错环节。\n<\/li><li>\n边界二：指标映射受混淆因素干扰。推荐提升购买量可能来自促销或新品发布，需要 A/B 测试区分各因素影响（PDF 第 181 页注）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>硬属性 vs 软属性<\/strong>：硬属性不可调或难调，先做剔除项；软属性有改进空间，留待实验优化。边界随部署方式变化。\n<\/li><li>\n<strong>领域能力 vs 生成能力<\/strong>：前者是懂不懂专业内容，后者是表达是否连贯忠实；前者偏知识储备，后者偏输出质量。\n<\/li><li>\n<strong>任务级评估 vs 轮次级评估<\/strong>：任务级看是否完成目标、用了多少轮；轮次级看每条输出质量。用户真正关心任务完成度，但任务边界有时难界定（PDF 第 221 页）。\n<\/li><li>\n<strong>技术指标 vs 业务指标<\/strong>：事实一致性 80% 对应能自动处理多少工单，需要建立映射；脱离业务的技术分数无法判断投入回报。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c04–c06 提供评估方法工具箱。后继：c08 提示词迭代挂在指南与评估集上；c09 检索质量、c10 智能体故障都进入组件级评估；c11 微调决策以流水线对比为依据；c13 成本延迟标准落到吞吐与利用率分析；c14 生产监控反馈回流到指南修订。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（评估标准、模型选择工作流与评估流水线：硬属性、软属性与分层评估）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：从评估标准到选择工作流与流水线层级<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清模型选择与流水线设计，先往回追五层前提：<\/p>\n<ol><li>\n<strong>先确认应用要证明什么价值<\/strong>：没有评估标准，部署后无法判断好坏；评估驱动开发把标准写在构建之前。\n<\/li><li>\n<strong>再把标准拆成可测量维度<\/strong>：领域能力、生成能力、指令遵循、成本延迟，四类覆盖专业内容、表达质量、格式约束与资源代价。\n<\/li><li>\n<strong>区分约束条件与可优化项<\/strong>：硬属性先做剔除，软属性进入实验；避免把不可变约束当成可调问题浪费精力。\n<\/li><li>\n<strong>确认评估对象分层<\/strong>：复杂系统含多组件多步骤，只评端到端会掩盖中间故障；任务、轮次、中间输出要分别设口径。\n<\/li><li>\n<strong>最后接通业务语言<\/strong>：技术评分必须映射到业务指标与实用性阈值，否则无法支持投入决策。\n<\/ol>\n<p>依赖链方向：业务目标 → 评估标准四维 → 硬属性剔除/软属性实验 → 组件与任务分层流水线 → 指标映射业务回报 → 生产监控回流。<\/p>\n<h2>正向推导：标准、工作流与流水线逐步展开<\/h2>\n<h3>第一步：为什么先定评估标准<\/h3>\n<p>应用需要证明价值才能部署；投资回报不明确的 AI 应用很常见，原因包括难以评估、使用情况看不清。原书指出，一个已部署但无法评估的应用比从未部署更糟：它持续消耗维护成本，下线成本可能更高（PDF 第 180 页）。评估驱动开发借自测试驱动开发：先写测试再写代码，AI 场景则是先定标准再构建应用。<\/p>\n<h3>第二步：四类标准的分工<\/h3>\n<p>领域特定能力：模型理解编程、特定语言、特定专业内容的水平，受架构、训练数据等配置约束。生成能力：响应连贯性、忠实性等整体质量。指令遵循：输出是否符合要求的格式、长度、结构。成本和延迟：每次请求费用与等待时间；质量再高，过慢过贵就没有实用价值（PDF 第 181、197 页）。四者并列，不能用一类替代另一类：代码能跑不代表回复忠实，格式合规不代表内容正确。<\/p>\n<h3>第三步：硬属性先行剔除<\/h3>\n<p>硬属性是提供商决策结果或许可、训练数据、模型大小，或自身隐私、控制权策略；软属性是准确性、毒性、事实一致性等可改进项。工作流第一步剔除硬属性不符的模型，避免在不可调项上消耗评估资源。软硬边界随部署方式变化：使用第三方 API 时延迟由提供商决定，属硬属性；自托管可调度优化硬件，延迟转为软属性（PDF 第 200 页）。<\/p>\n<h3>第四步：公开信息初筛到自有实验<\/h3>\n<p>第二步用公开基准、排行榜平衡质量、成本、延迟缩小候选；公开基准不完全反映实际表现，只作初筛。第三步在自有评估流水线上实验，找到最合适模型；第四步生产持续监控、收集反馈改进。流程迭代往复：初判要自托管，经公开与私有评估后发现开源模型达不到性能，可转回商业 API（PDF 第 200 页）。<\/p>\n<h3>第五步：流水线分层评估<\/h3>\n<p>现实 AI 应用多组件、多步骤。以简历 PDF 提取当前雇主为例：第一步 PDF 转文本，第二步从文本抽雇主。最终抽取失败时，不单独评估组件就分不清是哪一步出错。PDF 转文本可用提取文本与真实文本的相似度评估；雇主抽取可用给定正确文本后的准确率评估（PDF 第 221 页）。层级上分任务级（是否完成、用多少轮）与轮次级（每条输出质量）；用户最关心任务完成，但任务边界有时难界定，如新查询是追问还是新任务。<\/p>\n<h3>第六步：评估指南与指标映射<\/h3>\n<p>指南先写应该做什么，再写不应该做什么：客服机器人是否回答选举类无关问题，如何识别越界输入、如何回应。标准确定后选评分体系：二元 0/1、1–5 离散、0–1 连续或三元（矛盾/蕴含/中立）。评分标准必须带示例并请他人验证可理解性；人类觉得指南难懂就要继续完善（PDF 第 222 页）。<\/p>\n<p>指标映射业务：事实一致性 80% 可自动处理 30% 工单，90% 处理 50%，98% 处理 90%；达不到实用性阈值（如一致性不足 50%）的产品不予上线。业务侧还看 DAU/WAU/MAU 与参与度；利润与社会责任之间要权衡，避免产品偏向令人上瘾的内容（PDF 第 223 页）。<\/p>\n<h3>第七步：方法与数据配套<\/h3>\n<p>不同标准配不同方法：专用毒性分类器测有害内容，语义相似度测响应与问题相关性，裁判模型做主观比较。评估集样本最好来自真实用户查询；先手工或 AI 生成多版本响应，判断优劣后沉淀为指南案例。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：选择工作流漏斗<\/h3>\n<p>候选 20 个模型。硬属性剔除（许可、隐私、大小不符）后剩 8 个；公开基准与成本延迟初筛剩 4 个；自有流水线实验选定 1–2 个进入生产监控。每层淘汰理由不同，不能把基准排名直接当最终选型。<\/p>\n<h3>算例 2：组件故障定位<\/h3>\n<p>简历抽取任务：端到端准确率 70%。组件一（PDF 转文本）相似度 95%，组件二（雇主抽取）在正确文本上准确率 74%。瓶颈在第二步，优化检索或提示词应针对雇主抽取；若只评端到端 70%，会误判为 PDF 解析问题。<\/p>\n<h3>算例 3：指标到业务的映射表<\/h3>\n<p>一致性 80% → 自动处理 30% 工单；90% → 50%；98% → 90%（PDF 第 223 页口径）。据此可算改进一个百分点一致性带来多少工单自动化回报，再决定投入提示词、检索还是微调。<\/p>\n<h3>算例 4：延迟与成本口径<\/h3>\n<p>TTFT 对应预填充，TPOT 对应解码；整体延迟 = TTFT + TPOT × 输出 token 数。API 按输入输出 token 计费；自托管集群固定后，每天处理 100 万与 10 亿 token，计算成本基本相同，规模不同时 API 与自托管的划算位置会移动（PDF 第 198 页）。<\/p>\n<h3>算例 5：帕累托取舍<\/h3>\n<p>若延迟是不可妥协的硬指标，先剔除所有延迟不达标的模型，再在剩余候选里比质量；反之质量底线明确时先锁质量区间再比成本。多目标优化不能同时压到最优，必须先声明哪些目标不可妥协。<\/p>\n<h3>算例 6：混淆因素排查<\/h3>\n<p>推荐系统提升购买量，可能来自推荐，也可能来自促销或新品发布；不用 A/B 测试拆分，购买量上涨不能记到模型头上。业务指标归因时要排除并行因素（PDF 第 181 页注）。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>先做演示再补评估<\/strong>：产品上线后无法回答是否有效，维护与下线成本累积；演示成功不等于产品成功，0 到 60 容易、60 到 100 困难。\n<\/li><li>\n<strong>只评端到端输出<\/strong>：中间组件故障无法定位，优化方向猜谜；组件级评估缺失会让复杂系统退回黑箱。\n<\/li><li>\n<strong>指南只写正面要求<\/strong>：不定义越界输入与禁止行为，模型在边缘场景随意发挥；评分者之间口径漂移，响应优劣无法复现。\n<\/li><li>\n<strong>拿公开基准分数定稿选型<\/strong>：基准分布与自有任务有差距，高分模型在私有查询上可能失败；基准只承担初筛职责。\n<\/li><li>\n<strong>技术指标不映射业务<\/strong>：一致性、相关性分数无法换算成工单自动化率或留存提升，资源投入缺少决策依据。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ol><li>\n评估驱动开发与测试驱动开发的对应关系是什么？\n<\/li><li>\n四类评估标准各回答什么问题？为什么不能互相替代？\n<\/li><li>\n硬属性与软属性怎样区分？边界为什么会随部署方式变化？\n<\/li><li>\n任务级与轮次级评估各看什么？\n<\/li><li>\n评估指南为什么必须配示例并请他人验证？\n<\/ol>\n<h2>补充推演：边界案例与常见疑问<\/h2>\n<h3>案例 A：四类标准不能互相替代<\/h3>\n<p>领域能力回答「懂不懂专业内容」，生成能力回答「表达是否连贯忠实」，指令遵循回答「格式长度是否合规」，成本延迟回答「等得起用得起吗」。代码能跑不代表回复忠实，格式合规不代表内容正确；选型时四类标准分别打分，避免用一类高分掩盖另一类短板。<\/p>\n<h3>案例 B：硬属性边界随部署方式移动<\/h3>\n<p>使用第三方 API 时，延迟由提供商决定，属硬属性；自托管后可调度硬件优化，延迟转为软属性。许可、训练数据、模型大小通常是硬属性；准确性、毒性、事实一致性是可改进的软属性。判断一项属性软硬，先看部署方式与控制权，再决定是剔除项还是优化项。<\/p>\n<h3>案例 C：公开基准的初筛位置<\/h3>\n<p>基准分数与实际应用表现有差距，只能用于缩小候选范围。定稿必须靠自有评估流水线：基准分布与私有任务不同，高分模型在私有查询上可能失败。工作流顺序是硬属性剔除 → 公开信息初筛 → 自有实验 → 生产监控，公开基准不承担最终选型职责。<\/p>\n<h3>案例 D：组件级评估的定位作用<\/h3>\n<p>端到端失败时，组件级评估区分是上游材料出错还是下游利用出错。PDF 转文本相似度低，问题在解析；正确文本上抽取准确率低，问题在抽取环节。没有组件口径，优化方向只能猜；组件评估与第 6 章检索器、生成器分离评估同源。<\/p>\n<h3>案例 E：指标映射的阈值与混淆因素<\/h3>\n<p>技术指标映射业务指标：一致性 80% 自动处理 30% 工单，90% 处理 50%，98% 处理 90%；达不到实用性阈值的产品不上线。业务指标归因还要排除混淆因素：购买量上涨可能来自促销或新品，需 A/B 测试拆分各因素贡献（PDF 第 181 页注）。脱离业务阈值的技术分数，无法支持投入决策。<\/p>\n<h3>案例 F：指南可理解性验证<\/h3>\n<p>评估指南写清应该做什么、不应该做什么，配分值示例；还要请他人验证能否理解。人类觉得指南难懂，说明标准仍模糊，需要继续完善。指南是裁判、人工、自动化三方共用的口径，口径不稳，后续所有评估结果都不可复现。<\/p>\n<h3>案例 G：标准到流水线的映射顺序<\/h3>\n<p>先定业务目标，拆四类评估标准；硬属性剔除候选，软属性进实验；流水线先评组件中间输出，再评端到端任务；指南配示例并请他人验证；指标映射业务阈值。顺序颠倒会导致：基准分数好看但业务无回报，或端到端失败无法定位环节。<\/p>\n<h3>案例 K：标准缺失的后果<\/h3>\n<p>标准不明确时，演示可以跑通，上线后无法判断是否有效；已部署但不可评估的应用维护成本持续、下线成本更高。先定标准再构建，是评估驱动开发的起点，也是后续模型选型与流水线设计的依据。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n一个候选模型许可协议不符合内部策略，应在工作流哪一步剔除？\n<\/li><li>\n组件级评估如何帮助定位端到端失败？\n<\/li><li>\n事实一致性分数怎样换算成业务回报？需要哪些对照数据？\n<\/li><li>\n公开基准为什么只能初筛？定稿依据是什么？\n<\/li><li>\n延迟不可妥协时，模型选择顺序应怎样安排？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "评估标准、模型选择工作流与评估流水线：硬属性、软属性与分层评估"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.230<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">评估标准、模型选择工作流与评估流水线：硬属性、软属性与分层评估<\/a><\/span><\/div><h1>提示工程与上下文学习：零样本/少样本、系统与用户提示、上下文效率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 5 章（原书 5.1 提示词简介、5.1.1 上下文学习、5.1.2 提示词分类、5.1.3 提示词里的上下文长度、5.2 最佳实践、5.3 防御性提示工程，PDF 第 230–257 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>同一个模型，换一段指令输出质量差别很大；提示词写什么、示例放不放、系统设定与用户输入怎么分，决定模型已有能力能否被调动。这个概念回答：提示词由哪些部分组成，零样本与少样本、系统提示与用户提示的分工，提示工程通用最佳实践有哪些，以及上下文长度与上下文效率为什么不是一回事。<\/p>\n<h2>定义<\/h2>\n<p><strong>提示词（prompt）<\/strong>：发给模型执行任务的指令；通常三部分组成：任务描述、完成任务的示例、具体待处理内容（PDF 第 230–231 页）。<\/p>\n<p><strong>上下文学习（in-context learning）<\/strong>：仅凭提示词中的示例完成任务而不更新模型权重；无示例为零样本（zero-shot），<span class=\"katex-inline\">k<\/span> 个示例为 <span class=\"katex-inline\">k<\/span>-shot 少样本（PDF 第 232 页）。<\/p>\n<p><strong>系统提示词<\/strong>：任务描述与角色设定，应用开发者设定；<strong>用户提示词<\/strong>：用户提供的具体问题和材料（PDF 第 233 页）。许多 API 把两类提示词分开传入；处理游戏脚本时，任务指令、角色、规则放系统提示词，玩家输入放用户提示词。<\/p>\n<p><strong>上下文长度<\/strong>：模型能容纳的 token 上限；<strong>上下文效率<\/strong>：模型利用上下文信息的程度（PDF 第 236 页）。<\/p>\n<p>正例：明确要求「只输出分数，不要解释」；先给 3 个输入输出示例再让模型处理新条目；按角色设定回答。反例：提示词只说「帮我看看这个」，任务目标、格式、可用信息全缺。<\/p>\n<h2>原理推导<\/h2>\n<p>基础模型能力来自预训练与后训练；提示工程是在不动权重的前提下，通过输入组织激活已有能力。任务描述告诉模型做什么，示例演示怎么做，待处理内容提供本次输入。少样本示例把输出格式、口径、风格固化下来，比抽象描述更稳；示例要与真实任务同类，覆盖边界情况。<\/p>\n<p>提示词分类上，系统层稳定设定角色与规则，用户层承载每次变化的输入；分开后规则不被用户消息冲散，也便于版本管理与评估对照。上下文长度是容量上限，效率是利用质量：研究显示模型对开头和结尾的指令理解远好于中间；「大海捞针」测试在长文档中插入查找项检验定位能力；原始输入标记有限制时可借助压缩、摘要与检索补充上下文（PDF 第 236–237 页）。<\/p>\n<p>最佳实践链路：明确无歧义说明任务；要求角色设定；提供示例；指定输出格式；提供充足上下文；把复杂任务拆成子任务；迭代优化并管理提示词版本（PDF 第 239–249 页）。防御性提示工程关注安全与合规：识别越界输入、避免把内部政策写进系统提示词、对敏感信息做处理。<\/p>\n<p>提示词组织还要考虑多轮对话结构：历史消息作为上下文延续任务，新指令与历史的边界要清晰；模型对指令位置敏感，关键约束放首尾更稳。提示词版本与适配模型一并记录，跨模型复用前在评估集复测，避免分隔标记与格式约定带来的行为差异。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：从零组织一段提示词；评估现有提示词缺哪类信息；判断任务是否需要少样本示例；诊断长上下文利用不佳。\n<\/li><li>\n边界一：提示工程不能补充模型未掌握的知识。缺事实时靠检索上下文或工具，不靠指令措辞（与 c09 衔接）。\n<\/li><li>\n失败案例一：示例与真实分布不一致。示例类别、格式、难度偏离线上输入，模型模仿错误模式。\n<\/li><li>\n失败案例二：把长上下文当高利用率。容量够不代表模型读得进去，中间信息被忽略；任务复杂时先拆子任务、缩短单段上下文。\n<\/li><li>\n边界二：提示词效果受模型差异影响。不同模型对指令位置、分隔标记、格式约定敏感度不同，跨模型复用要重新测试。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>零样本 vs 少样本<\/strong>：前者只给指令，后者带示例；少样本用演示替代抽象说明，代价是占用更多上下文 token。\n<\/li><li>\n<strong>系统提示 vs 用户提示<\/strong>：前者稳定的角色与规则，后者变化的输入；分开便于管理规则版本与隔离用户内容。\n<\/li><li>\n<strong>上下文长度 vs 上下文效率<\/strong>：长度是物理上限，效率是实际利用程度；长度大不代表中间段落被使用。\n<\/li><li>\n<strong>提示工程 vs 微调<\/strong>：提示工程不动权重，靠输入组织；微调改权重，提示无法解决行为问题时才进入微调（c11）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c07 的评估指南是提示词迭代的对照基准；c03 的采样分布决定指令之外的随机性。后继：c09 的检索结果作为上下文材料进入提示词；c10 智能体把任务拆成子任务并调用工具；c11 微调是提示与上下文不足时的权重适配；c13 的输入 token 成本与延迟受提示词长度直接影响。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（提示工程与上下文学习：零样本/少样本、系统与用户提示、上下文效率）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：提示词结构、示例组织与上下文利用边界<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清提示工程方法，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先确认模型能力边界<\/strong>：模型已有的语言与任务倾向来自预训练与后训练；提示词只能调动已有能力，不能注入新知识。\n<\/li><li>\n<strong>再确认本次任务的输入结构<\/strong>：指令、示例、待处理内容三类信息缺哪类，模型就在哪类信息上猜测。\n<\/li><li>\n<strong>区分稳定设定与变化输入<\/strong>：规则与角色跨请求不变，用户内容逐次变化；分开承载便于版本管理与隔离。\n<\/li><li>\n<strong>确认上下文是有限资源<\/strong>：长度有上限，且模型对位置敏感；示例数量、材料长度、检索结果都要计入 token 预算。\n<\/ol>\n<p>依赖链方向：模型已有能力 → 指令+示例+材料组织输入 → 系统层/用户层分工 → 上下文容量与利用效率 → 最佳实践逐条落到提示词修订。<\/p>\n<h2>正向推导：从提示词组成到最佳实践<\/h2>\n<h3>第一步：提示词三部分<\/h3>\n<p>任务描述：要模型做什么；示例：完成任务的样例；待处理内容：本次需要模型处理的具体材料（PDF 第 230–231 页）。三部分可分可合：单轮对话在一段提示词内完成，多轮对话则由系统设定与历史消息共同构成。提示词质量直接影响输出质量，是模型应用的第一道组织层。<\/p>\n<h3>第二步：上下文学习的两种口径<\/h3>\n<p>零样本：只给指令，模型凭已学能力完成。少样本：提示词内放 <span class=\"katex-inline\">k<\/span> 个（输入，输出）示例，模型模仿示例格式与口径。少样本把「怎么做」演示出来，比纯抽象指令稳定；示例要覆盖任务主要类别与边界情况，难度与真实输入接近。示例数量增加占用上下文，收益在覆盖主要模式后递减。<\/p>\n<h3>第三步：系统提示与用户提示分工<\/h3>\n<p>系统提示词承担角色设定、任务描述、规则约束；用户提示词承担具体问题与材料。API 分别传入两类，规则不被用户消息冲散。原书游戏脚本示例：任务指令、角色设定、游戏规则写入系统提示词，玩家每次输入写入用户提示词（PDF 第 233 页）。开发侧还应记录提示词版本，便于评估对照与回滚。<\/p>\n<h3>第四步：上下文长度与效率的差别<\/h3>\n<p>上下文长度是模型可容纳 token 上限；上下文效率是模型实际利用这些信息的程度。研究显示模型对开头与结尾指令理解更好，中间段落容易被忽略；「大海捞针」测试在长文档中插入检索项，检查模型能否定位并引用（PDF 第 236–237 页）。原始输入标记不足时，可通过压缩、摘要、检索补充；效率问题不能靠盲目堆长文档解决。<\/p>\n<h3>第五步：最佳实践逐条展开<\/h3>\n<p>其一，明确无歧义说明要做什么：任务目标、输出要求一次说清，避免模型猜测。其二，要求角色设定：以专业身份作答可调动对应表达风格。其三，提供示例：格式、口径、边界用样例固化。其四，指定输出格式：段落、列表、分数、字段名写清。其五，提供充足上下文：任务所需材料一并给出，不靠模型猜背景。其六，复杂任务拆成子任务：分步执行减少单步负担。其七，迭代优化并版本管理：对照评估集逐版改提示词，记录改动与指标（PDF 第 239–249 页）。<\/p>\n<h3>第六步：防御性提示工程<\/h3>\n<p>安全与合规侧：识别越界输入，避免系统提示词内写内部政策；敏感信息在进入外部 API 前处理；对模型可能被诱导绕过规则的路径保持审视。防御性设计与应用防护层（c14）配合：提示词内约束只是第一层，不能替代输入输出检测。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：提示词三部分对照<\/h3>\n<p>写一段评分提示：任务描述「给客服回复打相关性分数」；示例「输入：退款进度询问；参考：如何查询退款；输出：5 分」；待处理内容「本条用户消息：我的订单三天没到」。三部分齐全，模型可直接落分；缺示例则评分口径随模型偏好漂移。<\/p>\n<h3>算例 2：少样本 token 预算<\/h3>\n<p>每条示例含输入 100 token、输出 50 token，<span class=\"katex-inline\">k=3<\/span> 共 450 token；加指令与材料 600 token，单请求输入约 1050 token。<span class=\"katex-inline\">k<\/span> 翻倍到 6，示例部分达 900 token，输入接近 1500 token；示例覆盖主要类别后再加样，边际收益递减而成本线性上升。<\/p>\n<h3>算例 3：位置敏感对照<\/h3>\n<p>同一规则放在提示词开头、中间、结尾，模型遵守程度不同；长文档中间的事实被忽略概率更高。组织上下文时，关键指令与约束放首尾，大段材料放中间并配合检索定位。<\/p>\n<h3>算例 4：零样本与少样本选择<\/h3>\n<p>任务格式简单、模型训练覆盖充分（摘要、翻译），零样本常够用；格式特殊、字段多、口径小众的任务，少样本示例把格式钉住，减少输出偏差。判断依据是评估集上零样本与少样本的对比分数，而非直觉。<\/p>\n<h3>算例 5：上下文补充手段<\/h3>\n<p>原始标记有限时：先压缩冗余表述，再对长材料做摘要，再用检索只取相关片段；三种手段逐层减少送入模型的无关内容，与 c09 RAG 的检索逻辑一致。<\/p>\n<h3>算例 6：跨模型复用成本<\/h3>\n<p>同一提示词在模型甲上格式稳定，换到模型乙可能忽略分隔标记或续写输入。跨模型部署前必须在评估集复测；提示词版本记录里应注明适配的模型与版本号。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>提示词只写模糊目标<\/strong>：模型在任务、格式、口径上各自猜测，输出不稳定，评估分数随随机样本波动。\n<\/li><li>\n<strong>示例类别与线上分布不符<\/strong>：模型模仿错误模式，越明确的示例偏差越固化；示例集要从真实查询中采样校准。\n<\/li><li>\n<strong>用超长文档填满上下文替代检索<\/strong>：中间信息被忽略，成本与延迟上升，相关事实仍可能落在未被利用的段落。\n<\/li><li>\n<strong>把内部政策与规则写进系统提示词后依赖提示隔离<\/strong>：提示词约束可被诱导绕过；敏感策略与数据防护需要独立检测层（c14）。\n<\/li><li>\n<strong>提示词改动不记录版本<\/strong>：指标变好变坏无法归因到具体措辞，迭代失去可复现性。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ol><li>\n提示词通常由哪三部分组成？\n<\/li><li>\n零样本与少样本的差别是什么？示例解决什么问题？\n<\/li><li>\n系统提示词与用户提示词各承载什么内容？\n<\/li><li>\n上下文长度与上下文效率为什么不是一回事？\n<\/li><li>\n最佳实践里「拆子任务」解决什么负担？\n<\/ol>\n<h2>补充推演：边界案例与常见疑问<\/h2>\n<h3>案例 A：提示词三部分缺失的表现<\/h3>\n<p>缺任务描述：模型在做什么上猜测，输出方向随样本波动。缺示例：格式、口径、边界靠抽象描述，模型复现不稳定。缺待处理材料：模型只能凭背景猜测，回答与实际输入脱节。排查提示词问题时，先核对三部分是否齐全，再看措辞是否明确。<\/p>\n<h3>案例 B：少样本示例的选择原则<\/h3>\n<p>示例要与真实任务同类：类别覆盖主要场景，难度接近线上输入，包含边界情况。示例类别偏离线上分布时，模型模仿错误模式，越明确的示例偏差越固化。示例数量在覆盖主要模式后收益递减，而上下文成本线性上升；取舍由评估集对比决定。<\/p>\n<h3>案例 C：系统层与用户层的隔离价值<\/h3>\n<p>规则与角色放系统提示词，用户内容放用户提示词。分开后规则不被用户消息冲散，规则版本可独立管理，用户内容也不会被误当成指令。安全侧还要注意：内部政策不应写进系统提示词后只靠提示隔离，敏感策略需要独立检测层。<\/p>\n<h3>案例 D：位置敏感与长文档组织<\/h3>\n<p>模型对开头结尾指令理解更好，中间段落容易被忽略。关键约束放首尾，大段材料放中间并配合检索定位；长上下文不等于高利用率，「大海捞针」测试用于检验定位能力。任务复杂时先拆子任务、缩短单段上下文，比堆长文档有效。<\/p>\n<h3>案例 E：提示词迭代的版本纪律<\/h3>\n<p>每次改动记录版本、对应评估集分数与改动理由；没有版本记录，指标好坏无法归因到具体措辞。跨模型复用时，不同模型对分隔标记、格式约定、指令位置敏感度不同，必须在目标模型上重新测试，提示词版本应注明适配模型与版本号。<\/p>\n<h3>案例 F：提示工程的能力边界<\/h3>\n<p>提示词只能调动模型已有能力，不能注入未掌握的事实。缺事实时补检索上下文或工具，不靠措辞强化；行为格式无法稳定时才进入微调。把提示词当成万能手段，会在知识缺口上反复改措辞而问题不解决。<\/p>\n<h3>案例 G：提示词诊断清单<\/h3>\n<p>收到输出问题逐项核对：任务描述是否明确无歧义；角色设定是否给出；示例是否覆盖类别与边界；输出格式是否指定；上下文材料是否充足；复杂任务是否拆成子任务；版本是否记录。缺哪项补哪项，再对照评估集看分数变化。<\/p>\n<h3>案例 H：上下文效率的检查方法<\/h3>\n<p>长文档场景用「大海捞针」式测试检查定位能力；关键指令放首尾，材料放中间；冗余表述先压缩，长材料先摘要，相关片段走检索补充。容量够不代表利用率高，中间段落被忽略是常见低效来源。<\/p>\n<h3>案例 I：提示与其他适配手段的分工<\/h3>\n<p>提示工程不动权重，组织指令与材料；检索补外部知识，工具执行动作，微调改权重。提示阶段解决不了的问题，先判断是知识缺口（走检索）还是行为格式问题（再考虑微调）。在提示层反复改措辞补知识缺口，是常见低效路径。<\/p>\n<h3>案例 J：跨模型复用测试<\/h3>\n<p>不同模型对分隔标记、格式约定、指令位置敏感度不同；提示词迁移到新模型前，在评估集上重新测试，版本记录注明适配模型与版本号。提示词不是通用文本，模型差异属于部署约束的一部分。<\/p>\n<h3>案例 K：提示词与评估闭环<\/h3>\n<p>提示词每次迭代都挂在评估集上：改动前后对照同一批查询的指标，记录版本与理由。没有评估对照，提示词优化停留在措辞偏好层面，无法判断哪一版更贴近任务目标。<\/p>\n<h3>案例 L：提示词长度与上下文预算<\/h3>\n<p>指令、示例、材料都计入输入 token；示例翻倍会线性推高输入成本与延迟。覆盖主要模式后再加样，边际收益递减；复杂任务先拆子任务，比在单段提示词里堆叠要求更稳。提示词版本记录应包含模型、参数与评估分数，便于跨版本对照。<\/p>\n<h3>案例 M：提示词失效的排查顺序<\/h3>\n<p>先核对指令是否明确、示例是否对齐线上分布、格式是否指定；再核对上下文材料是否充足；最后看任务是否需要拆子任务。提示词改动不记录版本时，指标波动无法归因；跨模型复用必须复测，分隔标记与指令位置在不同模型上敏感度不同。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n一段提示词缺少示例，可能在哪些方面表现不稳定？\n<\/li><li>\n长上下文里关键指令应放在什么位置？依据是什么？\n<\/li><li>\n提示工程为什么不能补充模型未掌握的事实？该靠什么补？\n<\/li><li>\n少样本示例数量增加，收益与成本各沿什么方向变化？\n<\/li><li>\n跨模型复用提示词前需要做什么验证？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "提示工程与上下文学习：零样本/少样本、系统与用户提示、上下文效率"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.275<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">提示工程与上下文学习：零样本/少样本、系统与用户提示、上下文效率<\/a><\/span><\/div><h1>RAG：检索—生成架构、词项与嵌入检索、精度召回与重排序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6 章（原书 6.1 什么是 RAG、6.1.1 RAG 架构、6.1.2 检索算法、6.1.3 检索优化，PDF 第 273–292 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>模型参数化知识停留在训练截止日期，私有文档、产品规格、合同条款无从引用；把全部材料塞进上下文既不可能也不经济。RAG 用「先检索相关材料、再据此生成」的模式把知识从权重转移到外部记忆。这个概念回答：RAG 系统由哪两个组件构成，词项检索与嵌入检索各按什么匹配，精度召回怎样随 top-k 与分块变化，生产系统用哪些策略优化检索。<\/p>\n<h2>定义<\/h2>\n<p><strong>RAG（检索增强生成）<\/strong>：通过从外部记忆源检索相关信息来增强模型生成的模式；系统含两个组件——检索器负责索引与查询，生成器基于检索结果生成响应（PDF 第 275 页）。<\/p>\n<p><strong>词项检索<\/strong>：按词项匹配打分。TF-IDF 由词频（TF，词在文档中出现频率）与逆文档频率（IDF，词在整个语料中的稀缺程度）相乘；BM25 在 TF-IDF 基础上按文档长度归一化（PDF 第 278 页）。<\/p>\n<p><strong>嵌入检索<\/strong>：把查询与文档映射为稠密向量，按语义相似度排序；含义相近的文本距离更近（PDF 第 280 页，嵌入基础见 c05）。<\/p>\n<p><strong>上下文精度<\/strong>：检索到的文档中相关文档所占百分比；<strong>上下文召回率<\/strong>：数据库中所有相关文档里被检索到的百分比（PDF 第 283 页）。排序质量指标有 NDCG、MAP、MRR。<\/p>\n<p><strong>检索优化四类策略<\/strong>：分块、重排序、查询重写、上下文检索（PDF 第 288 页）。<\/p>\n<p>正例：混合检索先用低成本词项检索取候选，再用高精度机制重排序；RRF 按各检索器排名求和合并结果。反例：只看检索返回数量，不核对精度召回，无关上下文占满窗口后污染生成。<\/p>\n<h2>原理推导<\/h2>\n<p>架构流：文档先拆成块，建立索引；查询进来先过检索器取相关块，生成器把查询与检索块组成提示词再输出。检索器质量决定模型能看到什么材料；生成器质量决定利用材料的方式，两者分别评估、分别优化。<\/p>\n<p>词项检索匹配字面重叠：罕见词 IDF 高，常见停用词被压低；文档越长词频天然偏高，BM25 归一化长度。嵌入检索匹配语义：多义词「transformer」在词项层同时命中电气设备、神经网络结构、电影《变形金刚》；嵌入向量按语义把不同义项分开（PDF 第 280 页）。嵌入不感知上下文词序，同一组词不同顺序可能得到相近向量。<\/p>\n<p>精度召回权衡：设相关文档 <span class=\"katex-inline\">R<\/span> 篇，返回 <span class=\"katex-inline\">k<\/span> 篇中 <span class=\"katex-inline\">r<\/span> 篇相关。<span class=\"katex-inline\">P=r/k<\/span>，<span class=\"katex-inline\">R_{\\mathrm{call}}=r/R<\/span>。<span class=\"katex-inline\">k<\/span> 放大召回上升、精度可能下降；<span class=\"katex-inline\">k<\/span> 缩小上下文更干净但漏检。分块大小同向影响覆盖度与噪声：小块覆盖广但截断语义，大块语义完整但主题混杂。生产组合：词项检索做粗筛，嵌入检索做语义匹配，重排序把候选按相关度二次排序，RRF 融合多检索器排名。<\/p>\n<p>检索失败无法在生成端补救：模型只能利用被检索到的材料，精度召回是生成质量的上游约束。检索器与生成器分别评估、分别优化，端到端失败时先定位材料是否取到，再判断材料是否被利用。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：知识频繁更新、私有文档接入、需要引用来源；查询与材料可按块索引。\n<\/li><li>\n边界一：检索失败无法靠生成弥补。模型看不到检索结果之外的材料，精度召回是生成质量的上游约束。\n<\/li><li>\n失败案例一：分块不切边界。长文档整篇入索引，命中即带入整份材料，无关比例升高。\n<\/li><li>\n失败案例二：只优化检索数量。top-k 越大召回好看，但上下文污染、成本延迟同步上升。\n<\/li><li>\n边界二：嵌入检索依赖嵌入模型质量；语义相近但义项不同的文本仍可能被误拉近，需重排序或过滤复核。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>词项检索 vs 嵌入检索<\/strong>：前者字面重叠、可解释、成本低；后者语义匹配、对改写鲁棒、依赖嵌入模型。\n<\/li><li>\n<strong>精度 vs 召回率<\/strong>：前者看返回结果纯不纯，后者看相关材料漏没漏；两者随候选数反向拉扯。\n<\/li><li>\n<strong>检索器 vs 生成器<\/strong>：前者解决材料选取，后者解决材料利用；端到端失败时先定位检索还是生成环节。\n<\/li><li>\n<strong>RAG vs 参数化记忆<\/strong>：RAG 知识在外部索引，更新改索引即可；参数化记忆在权重里，更新要再训练。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c05 相似度度量与嵌入是检索器基础；c08 提示词接收检索块作为上下文材料。后继：c10 智能体把检索作为只读工具；c12 数据策展影响索引文档质量；c13 输入 token 成本与检索块数量直接相关；c14 架构中上下文增强层即 RAG 组件。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（RAG：检索—生成架构、词项与嵌入检索、精度召回与重排序）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：RAG 架构、检索机制与精度召回权衡链<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清 RAG，先往回追五层前提：<\/p>\n<ol><li>\n<strong>先确认知识来源在哪<\/strong>：参数化知识固定在权重里，更新成本高；外部记忆源随业务更新，RAG 把知识移到索引层。\n<\/li><li>\n<strong>确认材料能否切块索引<\/strong>：文档要可拆分为块，每块可被独立检索；不可切块的长流程描述需要额外组织。\n<\/li><li>\n<strong>区分匹配机制<\/strong>：字面重叠走词项检索，语义接近走嵌入检索；两类机制互补，不是互相替代。\n<\/li><li>\n<strong>定义检索质量口径<\/strong>：精度看返回纯不纯，召回看相关漏没漏；排序质量另由 NDCG/MAP/MRR 衡量。\n<\/li><li>\n<strong>确认检索是生成的上游约束<\/strong>：模型只能利用被检索到的材料，检索漏检无法在生成端补救。\n<\/ol>\n<p>依赖链方向：外部知识需求 → 文档分块建索引 → 查询检索（词项/嵌入）→ 精度召回随 top-k 与分块变化 → 混合检索与重排序优化 → 生成器基于材料作答。<\/p>\n<h2>正向推导：从架构到检索算法<\/h2>\n<h3>第一步：RAG 双组件结构<\/h3>\n<p>检索器负责把文档切块、建索引、按查询取相关块；生成器接收查询与检索块，组织提示词并生成响应（PDF 第 275 页）。两端口可分别评估：检索器看精度召回与排序质量，生成器看基于给定材料的忠实性与相关性。端到端响应失败时，先查检索块是否含答案，再查生成是否利用了答案。<\/p>\n<h3>第二步：词项检索打分<\/h3>\n<p>TF 是词在文档中的出现频率；IDF 衡量词在整个语料中的稀缺程度：常见词（停用词）IDF 低，罕见词 IDF 高。TF-IDF 为两者乘积。BM25 在 TF-IDF 基础上按文档长度归一化，避免长文档因词频天然偏高而占优（PDF 第 278 页）。词项检索可解释：命中了哪些词、词频多少都可复查；代价是对同义改写敏感——换个说法就匹配不上。<\/p>\n<h3>第三步：嵌入检索匹配语义<\/h3>\n<p>嵌入把查询与文档映射为稠密向量，按余弦或距离排序。语义相近文本向量更近，同义改写仍可命中。局限有二：多义词在不同义项间需要向量区分；嵌入不感知词序，同一组词换顺序可能得到相近向量（PDF 第 280 页）。嵌入质量由嵌入模型决定，专用嵌入模型通常优于通用模型中间层抽向量（c05）。<\/p>\n<h3>第四步：精度召回定义与传导<\/h3>\n<p>设相关文档共 <span class=\"katex-inline\">R<\/span> 篇，检索返回 <span class=\"katex-inline\">k<\/span> 篇，其中 <span class=\"katex-inline\">r<\/span> 篇相关。上下文精度 <span class=\"katex-inline\">P=r/k<\/span>；上下文召回率 <span class=\"katex-inline\">R_{\\mathrm{call}}=r/R<\/span>（PDF 第 283 页）。<span class=\"katex-inline\">k<\/span> 增大：<span class=\"katex-inline\">r<\/span> 通常不减，召回上升；分母变大且新增候选多为不相关，精度下降；无关块占用 token、抬高输入成本与延迟、提高上下文污染概率。<span class=\"katex-inline\">k<\/span> 缩小：上下文干净、精度提高，后排相关文档被截断，召回下降。排序质量另看 NDCG、MAP、MRR，它们关注相关文档排在前面的程度。<\/p>\n<h3>第五步：分块大小的权衡<\/h3>\n<p>小块：相同窗口放入块数多，覆盖面广；边界可能截断关键句，块数与向量检索规模翻倍，查询开销上升。大块：单块语义完整；一块混多个主题，命中后带入无关内容更多。分块没有通用最优值，按查询集实验确定；块边界可按段落、标题或固定长度配合重叠设计。<\/p>\n<h3>第六步：生产优化组合<\/h3>\n<p>四类策略（PDF 第 288 页）：分块调整块大小与边界；重排序对初筛候选二次打分；查询重写把口语化查询改写成检索友好形式；上下文检索按任务需要选取检索范围。工程组合常是：低成本词项检索先取候选，高精度嵌入或重排序机制二次筛选；倒数排名融合（RRF）按各检索器排名求和合并，避免不同打分尺度不可比（PDF 第 286–287 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：精度召回计算<\/h3>\n<p>查询相关文档 <span class=\"katex-inline\">R=10<\/span> 篇。返回 <span class=\"katex-inline\">k=5<\/span>，其中 <span class=\"katex-inline\">r=3<\/span> 相关：精度 <span class=\"katex-inline\">3/5=0.6<\/span>，召回 <span class=\"katex-inline\">3/10=0.3<\/span>。<span class=\"katex-inline\">k=20<\/span>，<span class=\"katex-inline\">r=7<\/span> 相关：精度 <span class=\"katex-inline\">7/20=0.35<\/span>，召回 <span class=\"katex-inline\">0.7<\/span>。候选放大后召回从 0.3 升到 0.7，精度从 0.6 降到 0.35。<\/p>\n<h3>算例 2：上下文污染估算<\/h3>\n<p>每块平均 300 token，<span class=\"katex-inline\">k=5<\/span> 输入检索部分 1500 token；<span class=\"katex-inline\">k=10<\/span> 为 3000 token。若其中无关块各 2 块，<span class=\"katex-inline\">k=5<\/span> 无关 600 token，<span class=\"katex-inline\">k=10<\/span> 无关 1200 token。检索成本与污染随 <span class=\"katex-inline\">k<\/span> 线性增长，精度却可能下降。<\/p>\n<h3>算例 3：多义词检索对照<\/h3>\n<p>「transformer」在词项层命中电气变压器、神经网络结构、电影《变形金刚》三类文档；嵌入检索按语义把查询义项拉近对应文档（PDF 第 280 页）。查询含上下文限定（如「attention 机制」）时语义区分更稳；孤立词项仍需重排序过滤。<\/p>\n<h3>算例 4：分块规模<\/h3>\n<p>语料 1000 篇文档，每篇平均 2000 字。按 200 字切块约 10000 块；按 500 字切块约 4000 块。小块向量库规模更大、检索索引与存储成本更高；大块检索粒度粗，单块噪声更多。<\/p>\n<h3>算例 5：RRF 融合<\/h3>\n<p>检索器甲排名（文档 1、3、5），检索器乙排名（文档 3、2、1）。RRF 按排名位置求和，排名靠前的文档得分高；两类检索尺度不同，不直接合并原始分数而合并名次，避免量纲污染。<\/p>\n<h3>算例 6：检索失败定位<\/h3>\n<p>生成回答未引用某规定条款。先检查检索结果：若召回集合不含该条款，问题在检索器（分块、嵌入、查询重写）；若条款在检索块内而回答未用，问题在生成器提示或生成忠实性。定位顺序从上游到下游。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>去掉检索，只靠参数记忆<\/strong>：私有文档、新发布规格无从引用，模型依赖内部不可靠知识，幻觉概率上升。\n<\/li><li>\n<strong>文档不分块整篇索引<\/strong>：长文档撑爆窗口，检索粒度落在整篇，命中即带入整份材料，无关比例升高。\n<\/li><li>\n<strong>只追召回率放宽 top-k<\/strong>：无关上下文占满窗口，模型被噪声带偏，输入成本与延迟同步上升；精度与污染被忽略。\n<\/li><li>\n<strong>嵌入检索不加复核<\/strong>：语义相近但义项不同的文本被误拉近，错误材料进入提示词；重排序或人工过滤是必要对冲。\n<\/li><li>\n<strong>生成端假设检索必含答案<\/strong>：检索漏检时模型仍被要求作答，只能编造；应在检索置信度不足时返回未找到材料的应答。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ol><li>\nRAG 的检索器与生成器各负责什么？\n<\/li><li>\nTF-IDF 与 BM25 各衡量什么？BM25 多解决什么问题？\n<\/li><li>\n精度与召回率分别怎么算？<span class=\"katex-inline\">k<\/span> 放大时两者走向如何？\n<\/li><li>\n小块与大块各有什么代价？\n<\/li><li>\nRRF 为什么合并名次而不是原始分数？\n<\/ol>\n<h2>补充推演：边界案例与常见疑问<\/h2>\n<h3>案例 A：检索器与生成器的评估分工<\/h3>\n<p>检索器质量看精度、召回与排序质量（NDCG、MAP、MRR）；生成器质量看基于给定材料的忠实性与相关性。两端口分别评估、分别优化。端到端回答错误时，先查检索集合是否含答案条款：不含则检索器问题，含而未用则生成器问题。定位顺序从上游到下游，避免把生成问题归到检索或反过来。<\/p>\n<h3>案例 B：两类检索机制的互补位置<\/h3>\n<p>词项检索字面重叠、可解释、成本低，对罕见词与精确匹配友好；嵌入检索语义匹配、对同义改写鲁棒，但依赖嵌入模型且不感知词序。多义词在词项层混义，嵌入按义项区分；孤立词项的歧义仍需重排序复核。生产系统常用混合检索：词项粗筛，嵌入或重排序精排。<\/p>\n<h3>案例 C：top-k 传导链<\/h3>\n<p><span class=\"katex-inline\">k<\/span> 放大：召回上升，精度可能下降，无关块占用 token、抬高成本延迟、提高污染概率。<span class=\"katex-inline\">k<\/span> 缩小：上下文干净，后排相关文档漏检。不存在通用最优 <span class=\"katex-inline\">k<\/span>，按自己的查询集实验；精度召回之外，还要计入上下文污染与延迟代价，不能只追召回率。<\/p>\n<h3>案例 D：分块权衡的两侧<\/h3>\n<p>小块覆盖广、块数多、向量库规模大，边界可能截断关键句；大块语义完整、粒度粗，单块混杂主题。块边界可按段落、标题或固定长度配合重叠设计。分块调整影响检索规模、存储成本与单块噪声，要与 top-k 一起在评估集上核对。<\/p>\n<h3>案例 E：融合策略的量纲问题<\/h3>\n<p>不同检索器原始分数尺度不同，直接合并原始分数会被高分检索器主导；RRF 按排名位置求和，名次可比而量纲无关。融合后仍要重排序复核，避免某检索器的系统性偏差被带进最终上下文。<\/p>\n<h3>案例 F：检索失败的应答边界<\/h3>\n<p>检索置信度不足时，模型不应被要求作答；应返回「未找到相关材料」的应答。假设检索必含答案，模型在漏检场景只能编造，这是幻觉在 RAG 场景的直接来源。检索环节要能给出置信度或未命中信号，交给生成侧决定应答策略。<\/p>\n<h3>案例 G：RAG 上线检查项<\/h3>\n<p>检索集合是否含答案条款；命中块是否被生成使用；分块边界是否截断关键信息；top-k 与精度召回是否在查询集上核对；混合检索与 RRF 融合是否复核量纲。检索置信度不足时返回未命中应答，不要求模型在缺材料时作答。<\/p>\n<h3>案例 K：检索质量与生成质量的隔离<\/h3>\n<p>RAG 系统调试时先固定检索结果检查生成器，再固定生成器检查检索器；两端口混在一起优化，容易把材料问题误判成模型问题。检索侧调分块、嵌入、重写与重排，生成侧调提示与忠实性，分别记录指标。<\/p>\n<h3>案例 L：检索块与上下文窗口<\/h3>\n<p>每块平均长度乘 top-k 即检索占用的上下文；无关块越多，污染与成本越高。分块与 top-k 要一起调：小块覆盖面广但库规模大，大块语义完整但主题混杂。查询重写把口语化说法转成检索友好形式，是补偿词项与嵌入偏差的常用手段。<\/p>\n<h3>案例 M：检索优化四类策略对照<\/h3>\n<p>分块调整块大小与边界；重排序对初筛候选二次打分；查询重写补偿口语化表达；上下文检索限定选取范围。四类策略对应不同瓶颈，先定位是材料没取到、排序靠后还是表达不匹配，再选对应手段。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n端到端回答错误，怎样区分是检索问题还是生成问题？\n<\/li><li>\n嵌入检索相比词项检索，对同义改写与多义词各表现如何？\n<\/li><li>\n给定 <span class=\"katex-inline\">R=12<\/span>、<span class=\"katex-inline\">k=8<\/span>、<span class=\"katex-inline\">r=5<\/span>，写出精度与召回率。\n<\/li><li>\n分块大小调整会影响哪些成本与质量指标？\n<\/li><li>\n四类检索优化策略分别针对什么瓶颈？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "RAG：检索—生成架构、词项与嵌入检索、精度召回与重排序"}, "c10": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.296<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">RAG：检索—生成架构、词项与嵌入检索、精度召回与重排序<\/a><\/span><\/div><h1>智能体：环境—工具—规划、错误累积、故障模式与记忆机制<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6 章（原书 6.2 什么是智能体、6.2.1 智能体简介、6.2.2 工具、6.2.3 规划、6.2.5 智能体故障模式、6.3 记忆，PDF 第 295–325 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>RAG 是单次检索加生成；智能体则在环境中多步行动：感知反馈、调用工具、规划下一步、判断任务是否完成。为什么智能体需要更强模型？多步链条上错误怎样累积？故障分哪几类、各用什么数据记录？这个概念回答智能体的组成要素、错误累积的指数规律、三类故障模式与记忆的承载内容。<\/p>\n<h2>定义<\/h2>\n<p><strong>智能体（agent）<\/strong>：能够感知环境并通过执行器作用于环境的事物；AI 智能体以模型为大脑，处理任务与环境反馈、规划动作序列、判断任务是否完成（PDF 第 296 页）。<\/p>\n<p><strong>工具<\/strong>：智能体作用于环境的动作接口；分只读动作（感知环境，如查天气、检索文档）与写入动作（作用于环境，如发邮件、下单、改日程）（PDF 第 298 页）。工具库决定能力边界；工具越多，理解与使用难度通常越高。<\/p>\n<p><strong>规划<\/strong>：把复杂任务拆成动作序列，根据环境反馈调整后续步骤；原书 6.2.3 节讨论规划与反思机制。<\/p>\n<p><strong>错误累积<\/strong>：多步操作中前一步错误进入后续上下文，后续动作基于错误前提展开；单步可靠性沿链条相乘（PDF 第 298 页）。<\/p>\n<p><strong>故障模式三类<\/strong>（PDF 第 318–320 页）：规划故障（无效工具、参数无效、参数值错误、目标失败、反思错误）；工具故障（工具输出错误、缺正确工具）；效率故障（步数偏多、成本偏高、单步耗时偏长）。<\/p>\n<p><strong>记忆<\/strong>：模型保留和利用信息的机制；智能体记忆存放指令、示例、上下文、工具清单、计划、工具输出与反思（PDF 第 321 页）。<\/p>\n<p>正例：代码智能体按「读仓库 → 定位文件 → 改代码 → 跑测试 → 修复」规划，测试反馈作为下一步依据。反例：工具库不区分只读与写入，故障定位时无法判断是检索出错还是外部动作出错。<\/p>\n<h2>原理推导<\/h2>\n<p>智能体闭环：接收任务 → 规划动作 → 选工具执行 → 读取环境反馈 → 反思并调整 → 判断完成与否。模型在其中承担决策核心，工具是手脚，记忆是工作记录。<\/p>\n<p>需要更强模型的两个原因：一是错误累积。设单步成功率 <span class=\"katex-inline\">p<\/span>，<span class=\"katex-inline\">n<\/span> 步任务整体成功率 <span class=\"katex-inline\">p^n<\/span>；<span class=\"katex-inline\">p=0.95<\/span> 时 10 步约 60%，100 步约 0.6%（PDF 第 298 页）。二是工具使用风险：写入动作出错直接改变外部系统，比只读检索偏差代价高。<\/p>\n<p>故障分类对应评估数据：规划故障记录工具选择与参数问题；工具故障记录输出质量与工具覆盖；效率故障记录步数、成本、耗时。每个故障条目需要（任务，工具清单）二元组，才能区分「没有工具可用」与「选错工具」（PDF 第 319 页）。<\/p>\n<p>记忆机制上，RAG 靠外部记忆扩展上下文；智能体还需短期记忆存放当前任务步骤与反馈，长期记忆跨会话保留用户与任务信息。记忆组织影响规划连续性，也占用上下文预算。<\/p>\n<p>记忆机制上，RAG 靠外部记忆扩展上下文；智能体还需短期记忆存放当前任务步骤与反馈，长期记忆跨会话保留用户与任务信息。记忆组织影响规划连续性，也占用上下文预算；过时反馈不清理会挤压新材料位置。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：任务需要多步决策与外部动作；单次检索生成不足以完成目标；可拆解为可观测的动作序列。\n<\/li><li>\n边界一：步骤越多，对单步可靠性要求越高；缩短链条、关键节点校验比换更强模型更直接改善整体成功率。\n<\/li><li>\n失败案例一：工具库过大且无分类。模型难以区分工具用途，参数与工具错配率上升。\n<\/li><li>\n失败案例二：只记端到端成败。故障归因不到规划、工具还是效率层，优化无从下手。\n<\/li><li>\n边界二：智能体自主程度越高，风险越大；写入动作需要权限约束、人工确认与回退设计（与 c14 防护层衔接）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>智能体 vs RAG 应用<\/strong>：RAG 单次检索后生成；智能体多轮规划行动，反馈回流到下一步决策。\n<\/li><li>\n<strong>只读工具 vs 写入工具<\/strong>：只读出错是回答偏差，写入出错改变外部状态；风险等级与确认要求不同。\n<\/li><li>\n<strong>规划故障 vs 工具故障<\/strong>：前者是模型选择与参数决策问题，后者是工具输出或覆盖问题；评估数据需分开记录。\n<\/li><li>\n<strong>短期记忆 vs 长期记忆<\/strong>：前者服务当前任务连续执行，后者跨会话保留信息；载体与更新策略不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c09 检索是智能体最常用的只读工具；c08 提示工程组织任务指令与工具说明。后继：c11 微调可改善工具选择与参数稳定性；c13 智能体多步链路的延迟与成本由推理指标量化；c14 架构把工具调用、权限防护与反馈记录接入产品闭环。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（智能体：环境—工具—规划、错误累积、故障模式与记忆机制）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：智能体闭环、错误累积与故障归因结构<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清智能体设计，先往回追五层前提：<\/p>\n<ol><li>\n<strong>先确认任务是否需要多步行动<\/strong>：单次检索生成可完成的任务不必上智能体；需要观察反馈、再决定下一步时才进入智能体闭环。\n<\/li><li>\n<strong>确认环境反馈可被读取<\/strong>：工具返回结果要可解析、可作为后续决策依据；反馈不可读，规划无法调整。\n<\/li><li>\n<strong>区分动作的风险等级<\/strong>：只读动作偏差影响回答，写入动作改变外部状态；风险不同，确认与回退要求不同。\n<\/li><li>\n<strong>承认链条上的错误累积<\/strong>：前一步输出进入后续上下文，单步误差沿步数相乘；可靠性要求随链条长度提高。\n<\/li><li>\n<strong>预先设计故障归因口径<\/strong>：规划、工具、效率三类故障分开记录，否则端到端成败无法转化为优化动作。\n<\/ol>\n<p>依赖链方向：多步任务 → 模型决策核心 + 工具集 + 记忆 → 规划—执行—反馈—反思闭环 → 单步成功率沿步数累积 → 故障分类定位优化层。<\/p>\n<h2>正向推导：从闭环结构到故障模式<\/h2>\n<h3>第一步：智能体组成<\/h3>\n<p>感知环境并通过执行器作用于环境的事物即智能体。AI 智能体以模型为大脑：处理任务与环境反馈，规划动作序列，判断任务是否完成（PDF 第 296 页）。除模型外，工具集决定能做什么，记忆存放过程信息，规划机制把任务拆成序列。各部分对应评估对象：模型看决策质量，工具看覆盖与输出，记忆看信息留存。<\/p>\n<h3>第二步：工具分类与风险<\/h3>\n<p>只读动作感知环境：查天气、检索文档、读数据库；写入动作改变环境：发邮件、下单、修改日程、提交代码。工具库决定智能体能力边界；工具越多，模型理解工具用途、选择正确工具、填对参数的难度通常越高（PDF 第 298–299 页）。写入工具出错直接留外部记录，需要权限范围、人工确认与可回退设计。<\/p>\n<h3>第三步：错误累积推导<\/h3>\n<p>设每步动作成功率 <span class=\"katex-inline\">p<\/span>，各步近似独立，<span class=\"katex-inline\">n<\/span> 步整体成功率 <span class=\"katex-inline\">P(n)=p^n<\/span>。<span class=\"katex-inline\">p=0.95<\/span>：10 步 <span class=\"katex-inline\">0.95^{10}\\approx0.599<\/span>，100 步 <span class=\"katex-inline\">0.95^{100}\\approx0.0059<\/span>，原书口径为 10 步约 60%、100 步约 0.6%（PDF 第 298 页）。<span class=\"katex-inline\">p=0.99<\/span>：10 步约 0.904，100 步约 0.366。单步 4 个百分点的差距在长链条上放大为数十个百分点。推论：缩短链条、合并子任务、关键节点加校验，对整体成功率的改善常早于换更强模型；每一步反馈都应可核查，避免错误前提滚到后续动作。<\/p>\n<h3>第四步：规划与反思<\/h3>\n<p>规划把复杂任务拆成动作序列；执行后读取反馈，判断结果是否符合预期，必要时修正计划。规划故障来自模型侧：调用无效工具、参数无效、参数值错误、目标失败、反思判断错误（PDF 第 319 页）。反思错误指模型把失败当成功，或把成功当失败，后续方向被带偏。<\/p>\n<h3>第五步：工具故障与效率故障<\/h3>\n<p>工具故障：工具输出错误（接口返回脏数据）；缺少正确工具（任务需要但工具库未覆盖）。效率故障：步数偏多、成本偏高、单步耗时偏长（PDF 第 320 页）。效率故障不直接造成错误结果，但推高延迟与费用，影响上线可行性。评估数据集需要（任务，工具清单）二元组：没有工具可用属于覆盖问题，有工具而选错属于规划问题，二者不可混为一类。<\/p>\n<h3>第六步：记忆机制<\/h3>\n<p>RAG 靠记忆扩展上下文；智能体记忆内容包括：指令、示例、当前上下文、工具清单、计划、工具输出、反思记录（PDF 第 321 页）。短期记忆服务当前任务连续性，长期记忆跨会话保留用户偏好与历史信息。记忆写入占用上下文预算，检索与遗忘策略影响规划质量；记忆混乱会把过时反馈当作当前依据。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：链条成功率对照<\/h3>\n<p><span class=\"katex-inline\">p=0.95<\/span>：<span class=\"katex-inline\">n=10<\/span> 约 0.599，<span class=\"katex-inline\">n=20<\/span> 约 0.358，<span class=\"katex-inline\">n=100<\/span> 约 0.0059。<span class=\"katex-inline\">p=0.97<\/span>：<span class=\"katex-inline\">n=20<\/span> 约 0.544，<span class=\"katex-inline\">n=100<\/span> 约 0.048。步数翻倍时成功率下降幅度取决于单步 <span class=\"katex-inline\">p<\/span>；提升单步可靠性是长链条的首要杠杆。<\/p>\n<h3>算例 2：故障条目归因<\/h3>\n<p>任务「查询订单并补发邮件」。调用了错误工具（查物流而非查订单）→ 规划故障；工具返回金额字段为空 → 工具输出错误；工具库没有补发邮件接口 → 缺正确工具；完成任务用了 18 步、三轮重试 → 效率故障。每条条目注明任务与可用工具清单，归因才可复核。<\/p>\n<h3>算例 3：工具规模成本<\/h3>\n<p>工具库 10 个工具时，模型选择空间小，参数匹配集中；工具库 100 个时，工具描述与名称占据大量上下文，选错概率上升。工具分类、按任务场景挂接工具子集，是控制规模的常见手段。<\/p>\n<h3>算例 4：写入动作风险账<\/h3>\n<p>只读检索出错：响应偏差，可由下次调用纠正。写入下单出错：订单已生成，需退款取消流程。风险等级不同，确认环节设计不同：高风险动作先出预览、等人确认，再执行写入。<\/p>\n<h3>算例 5：记忆上下文占用<\/h3>\n<p>当前任务记录含计划 200 token、工具输出 800 token、反思 300 token，共 1300 token；多轮累积后不清理会挤压新材料的位置。定期摘要、归档过时反馈，是记忆管理的常规操作。<\/p>\n<h3>算例 6：反思错误代价<\/h3>\n<p>模型把失败的测试结果判为通过，继续进入提交环节；错误反思让后续动作基于「已完成」的前提展开。校验节点把测试断言作为客观依据，不依赖模型自述成败，可对冲反思错误。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>任务一步可完成却套智能体框架<\/strong>：多步环节引入额外错误累积与成本，延迟与费用上升，稳定性反而下降；智能体应留给真正需要闭环的任务。\n<\/li><li>\n<strong>工具库不区分只读与写入<\/strong>：故障归因分不清是检索偏差还是外部改动；风险确认环节无法按动作类型设置。\n<\/li><li>\n<strong>只统计端到端成功率<\/strong>：规划、工具、效率问题混在一起，无法判断该优化模型、补工具还是缩链条。\n<\/li><li>\n<strong>记忆不加清理与摘要<\/strong>：过时反馈占据上下文，模型把历史状态当当前依据，规划被旧信息带偏。\n<\/li><li>\n<strong>高风险写入动作无人工确认<\/strong>：工具参数错误或工具输出错误直接落到外部系统，回退成本高于提示层防护。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ol><li>\n智能体由模型、工具、记忆、规划各承担什么职责？\n<\/li><li>\n只读动作与写入动作的风险差别是什么？\n<\/li><li>\n写出 <span class=\"katex-inline\">p^n<\/span> 成功率公式，说明步数与单步可靠性的关系。\n<\/li><li>\n三类故障模式各包含哪些条目？\n<\/li><li>\n评估数据为什么需要（任务，工具清单）二元组？\n<\/ol>\n<h2>补充推演：边界案例与常见疑问<\/h2>\n<h3>案例 A：智能体与单次 RAG 的分界<\/h3>\n<p>RAG 是一次检索加一次生成，决策在单次上下文内完成；智能体多轮规划行动，环境反馈回流到下一步决策。判断依据是任务是否需要「观察反馈→再决定下一步」。一步可完成的任务套智能体框架，只会引入额外错误累积与成本。<\/p>\n<h3>案例 B：错误累积的杠杆排序<\/h3>\n<p>链条越长，单步可靠性要求越高。改善整体成功率的杠杆顺序：先缩短链条、合并子任务，再在关键节点加客观校验，最后才是换更强模型。单步 <span class=\"katex-inline\">p<\/span> 提升 4 个百分点，在长链条上的收益远大于短链条；这也是智能体需要更强模型的原因之一。<\/p>\n<h3>案例 C：故障归因的数据要求<\/h3>\n<p>每条故障记录注明任务与可用工具清单。有工具而选错属规划故障，没有工具属覆盖不足；工具返回脏数据属工具输出错误；步数多、成本高属效率故障。缺（任务，工具清单）二元组，两类问题无法区分，优化动作落不到对应层。<\/p>\n<h3>案例 D：写入动作的风险设计<\/h3>\n<p>只读检索出错是回答偏差，下次调用可纠正；写入动作出错改变外部状态，需要权限范围、预览确认与可回退流程。风险等级不同，确认环节设计不同：高风险动作不执行自动写入，先出结果等人确认；低风险只读可自动循环。<\/p>\n<h3>案例 E：记忆的上下文预算<\/h3>\n<p>短期记忆存放计划、工具输出、反思记录，长期记忆跨会话保留用户偏好。记忆写入占用上下文预算，过时反馈不清理会挤压新材料位置。摘要与归档是常规记忆管理；记忆混乱时模型把历史状态当当前依据，规划被旧信息带偏。<\/p>\n<h3>案例 F：反思错误的客观对冲<\/h3>\n<p>模型可能把失败判为通过，后续动作基于「已完成」前提展开。校验节点用测试断言、工具返回等客观依据判断成败，不依赖模型自述。反思错误与规划故障相邻，但归因不同：前者是判断环节出错，后者是选择与参数环节出错，记录时分开标注。<\/p>\n<h3>案例 G：智能体上线检查项<\/h3>\n<p>任务是否真需要多步闭环；工具是否分只读与写入；故障记录是否带（任务，工具清单）；关键节点是否有客观校验；记忆是否定期摘要清理。写入动作确认等级与回退流程单独设计；效率故障（步数、成本、耗时）与规划、工具故障分开统计。<\/p>\n<h3>案例 H：规划与反思的校验位置<\/h3>\n<p>规划故障发生在选择工具与填参数环节；反思错误发生在判断成败环节。校验节点用测试断言、工具返回等客观依据，不依赖模型自述。多步链条先缩步骤、加校验，再考虑换模型；单步可靠性是长链条的首要杠杆。<\/p>\n<h3>案例 K：智能体效率与可靠性的平衡<\/h3>\n<p>步数少、成本低、耗时短是效率目标；单步可靠、步骤可控是可靠性目标。两者权衡时先保可靠性底线，再压缩链条与成本；高风险写入动作的确认环节不计入效率压缩范围。<\/p>\n<h3>案例 L：智能体记忆与上下文管理<\/h3>\n<p>计划、工具输出、反思记录都进入短期记忆，长期记忆跨会话保留偏好与历史。记忆不摘要会挤压新材料位置；过时反馈被当成当前依据时，规划方向被带偏。记忆管理与检索缓存共享同一上下文预算，步数越多越需要定期归档。<\/p>\n<h3>案例 M：多步任务的可靠性设计<\/h3>\n<p>缩短链条与合并子任务优先于换模型；关键节点用客观断言校验成败；写入动作单独设置确认与回退；故障记录带任务与工具清单，区分规划、工具、效率三类问题。链条越长，单步成功率的杠杆作用越大。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n一个任务需要先查资料再决定是否发邮件，属于 RAG 单次生成还是智能体闭环？依据是什么？\n<\/li><li>\n<span class=\"katex-inline\">p=0.98<\/span> 时，20 步与 50 步整体成功率各约多少？\n<\/li><li>\n「有工具而选错」与「缺正确工具」分别归哪类故障？\n<\/li><li>\n反思错误怎样被客观校验环节对冲？\n<\/li><li>\n智能体记忆与 RAG 外部记忆在内容与用途上有什么差别？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "智能体：环境—工具—规划、错误累积、故障模式与记忆机制"}, "c11": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.330<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c10\">智能体：环境—工具—规划、错误累积、故障模式与记忆机制<\/a><\/span><\/div><h1>微调决策与内存瓶颈：何时微调、可训练参数、显存估算、PEFT 与模型合并<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 7 章（原书 7.1 什么时候微调、7.2 为什么微调、7.3 内存瓶颈、7.4.1 参数高效微调、7.4.2 模型合并，PDF 第 330–365 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>提示词与上下文仍达不到任务要求时，微调是下一手；但微调受数据、硬件、人才与维护成本约束，启动前必须判断值不值。这个概念回答：微调的理由与不微调的理由，推理与训练显存各由哪些项构成，怎样按参数量与位宽估算，PEFT 怎样压缩可训练参数，模型合并解决什么问题。<\/p>\n<h2>定义<\/h2>\n<p><strong>微调（finetuning）<\/strong>：进一步训练整个模型或其中一部分以适应特定任务；建议先充分尝试提示工程，再考虑微调，两者并不互斥（PDF 第 330 页）。<\/p>\n<p><strong>全量微调<\/strong>：更新模型全部参数；<strong>部分微调<\/strong>：只更新部分层或部分参数。<strong>PEFT（参数高效微调）<\/strong>：用比全量微调少几个数量级的可训练参数，达到接近全量微调的性能（PDF 第 352 页）。路线分基于适配器（adapter、LoRA、BitFit、IA3 等）与基于软提示两类。<\/p>\n<p><strong>模型合并<\/strong>：把多个微调模型组合成一个模型，保留各模型能力；方法包括权重插值、任务算术等（PDF 第 365 页）。<\/p>\n<p><strong>显存构成<\/strong>：推理存权重；训练再加梯度与优化器状态。Adam 为每个可训练参数存梯度加两个状态共 3 个值（PDF 第 342 页）。<\/p>\n<p>正例：130 亿参数模型 FP32 权重 52 GB，2 字节位宽权重 26 GB；70 亿参数全量微调 FP16 合计约 56 GB（PDF 第 339、351 页）。反例：在提示词尚未系统化、评估集未定义时启动微调，把权重训练当成问题的默认解。<\/p>\n<h2>原理推导<\/h2>\n<p>微调理由：补足领域训练不足；引导特定输出结构；缓解偏见（PDF 第 331 页）。不微调理由：提示词与上下文常能达到同样效果；单任务微调可能损害其他任务；前期数据、训练知识、部署维护成本高；微调迭代赶不上基座模型进化速度（PDF 第 332–333 页）。<\/p>\n<p>内存估算先分推理与训练。推理近似占用 <span class=\"katex-inline\">N\\times M\\times1.2<\/span>：<span class=\"katex-inline\">N<\/span> 参数量，<span class=\"katex-inline\">M<\/span> 每参数字节数，1.2 含激活与 KV 向量约 20% 估算（PDF 第 341 页）。训练阶段：权重之外，反向传播存梯度，优化器为 Adam 存两个状态；可训练参数越多，这部分越大。位宽选择：FP32 4 字节、FP16/BF16 2 字节、INT8 1 字节、INT4 约 0.5 字节；位宽下降压缩权重与带宽，但可能损失精度（PDF 第 343 页）。<\/p>\n<p>PEFT 减少可训练参数，直接压缩梯度与优化器状态项；适配器在层间插入小模块训练主干冻结；LoRA 用低秩矩阵近似权重更新；软提示只训练提示向量。模型合并则在多个适配模型之间组合，避免为每个任务维护独立部署。<\/p>\n<p>位宽选择同时影响显存与带宽：量化压缩权重体积，解码阶段读取带宽同步下降，但精度损失要在评估集上实测。激活值随批次与上下文长度增长，长上下文大批量下可能超过权重内存，需要梯度检查点以重算换显存。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：提示与上下文验证后仍不满足；有足量高质量任务数据；具备训练与部署维护能力；微调收益可被评估集量化。\n<\/li><li>\n边界一：微调不能注入模型未掌握的事实；缺知识仍走检索。\n<\/li><li>\n失败案例一：单任务微调损害通用能力。基座模型其他任务表现下降，合并或回滚成本被低估。\n<\/li><li>\n失败案例二：忽略激活值内存。长上下文、大批次下激活值可能远超权重内存；梯度检查点以重算换内存，训练时间延长（PDF 第 342–343 页）。\n<\/li><li>\n边界二：PEFT 性能不总等于全量微调；任务与数据量不同，要在自有评估集上对照。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>提示工程 vs 微调<\/strong>：前者不动权重、改输入；后者改权重、成本高、周期长。顺序上先提示后微调。\n<\/li><li>\n<strong>全量微调 vs PEFT<\/strong>：前者更新全部参数、显存与维护重；后者冻结主干、只训小模块，部署可挂接适配器。\n<\/li><li>\n<strong>适配器 vs 软提示<\/strong>：前者在网络层间插入可训练模块，后者只优化输入提示向量；LoRA 属适配器路线的低秩近似。\n<\/li><li>\n<strong>微调 vs 模型合并<\/strong>：微调产出单一适配模型；合并把多个适配模型组合，兼顾多任务能力。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c08 提示工程、c09 检索是微调之前的优先手段；c07 评估集判断微调是否值得。后继：c12 数据集工程为微调准备格式数据；c13 微调后模型的推理成本由显存与吞吐估算；c14 架构决定微调模型自托管还是经服务调用。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（微调决策与内存瓶颈：何时微调、可训练参数、显存估算、PEFT 与模型合并）<\/summary><div class=\"depth-body\"><h1>c11 深度推导：微调决策条件、显存构成与 PEFT 压缩路径<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清微调决策与显存，先往回追五层前提：<\/p>\n<ol><li>\n<strong>先排除不动权重的手段<\/strong>：提示工程与上下文检索已充分验证仍不达标，才轮到微调；顺序反了会把可由输入解决的问题变成权重训练。\n<\/li><li>\n<strong>确认任务数据是否支撑微调<\/strong>：需要足量、高质量、格式一致的任务样本；数据不足时微调只会放大噪声。\n<\/li><li>\n<strong>拆分推理与训练内存<\/strong>：推理只跑前向，训练还要反向传播与优化器状态；两者显存口径不同，不能混算。\n<\/li><li>\n<strong>确认硬件位宽与可训练参数规模<\/strong>：位宽决定每参数字节数，可训练参数决定梯度与优化器状态大小。\n<\/li><li>\n<strong>预留维护与能力代价<\/strong>：基座模型升级后微调版本要重新对齐；单任务适配可能损害通用能力。\n<\/ol>\n<p>依赖链方向：提示/检索不足 → 微调理由核对 → 数据与硬件门槛 → 推理权重内存 + 训练梯度/优化器内存 → PEFT 压缩可训练参数 → 多任务走模型合并。<\/p>\n<h2>正向推导：从决策条件到显存估算<\/h2>\n<h3>第一步：微调的三类理由<\/h3>\n<p>其一，补足领域训练不足：特定专业领域模型接触少，表现弱。其二，引导特定输出结构：固定格式、字段、风格是提示词难以稳定约束的部分。其三，缓解偏见：用任务数据校正模型倾向（PDF 第 331 页）。每类理由都要能用评估集上的指标差距验证，而不是凭感觉判断模型「不懂这个领域」。<\/p>\n<h3>第二步：不微调的四类理由<\/h3>\n<p>提示词和上下文常能达到同样效果；单任务微调可能损害其他任务能力；前期需要数据标注、训练参数调试、部署维护的投入；模型快速进化，微调版本跟不上基座更新速度（PDF 第 332–333 页）。原书记录的案例中，许多团队在改进提示词流程后即满足需求，微调并不必要。决策口径：先做提示与检索基线，再拿微调收益对比成本。<\/p>\n<h3>第三步：推理显存估算<\/h3>\n<p>设参数量 <span class=\"katex-inline\">N<\/span>，每参数占用 <span class=\"katex-inline\">M<\/span> 字节。推理阶段近似占用 <span class=\"katex-inline\">N\\times M\\times1.2<\/span>，系数 1.2 含激活值与 KV 向量约 20% 的估算（PDF 第 341 页）。130 亿参数：FP32（<span class=\"katex-inline\">M=4<\/span>）权重 <span class=\"katex-inline\">13\\times10^9\\times4=52<\/span> GB；降到 2 字节权重 26 GB，推理总内存约 <span class=\"katex-inline\">26\\times1.2=31.2<\/span> GB。700 亿参数、2 字节位宽仅权重就 140 GB。<\/p>\n<h3>第四步：训练显存构成<\/h3>\n<p>训练比推理多三项来源：梯度（可训练参数每个存一个梯度值）；优化器状态（Adam 为每个可训练参数存两个状态值）；激活值（前向中间结果，长上下文大批次下可能很大）。Adam 口径：每可训练参数共 3 个值（梯度 + 两状态）。130 亿参数全量训练、每值 2 字节，梯度与优化器状态 <span class=\"katex-inline\">13\\times10^9\\times3\\times2=78<\/span> GB；若只训练 10 亿可训练参数，该项降到 <span class=\"katex-inline\">10^9\\times3\\times2=6<\/span> GB（PDF 第 342 页）。<\/p>\n<h3>第五步：位宽与精度权衡<\/h3>\n<p>FP32 每参数 4 字节；FP16/BF16 2 字节；INT8 1 字节；INT4 约 0.5 字节。位宽下降压缩权重体积与内存带宽占用，但数值精度降低，可能影响模型表现；量化损失要在评估集上实测（PDF 第 343 页）。激活值内存与批次大小、上下文长度正相关；梯度检查点丢弃部分激活值、需要时重算，以训练时间换显存。<\/p>\n<h3>第六步：PEFT 与模型合并<\/h3>\n<p>PEFT 路线一基于适配器：在 Transformer 层间插入小型可训练模块，主干权重冻结；LoRA 用低秩矩阵近似权重更新变化；BitFit 只调偏置；IA3 缩放激活。路线二基于软提示：只训练输入提示向量，模型主干冻结。PEFT 可训练参数比全量少几个数量级，部署时可挂接适配器而不必复制整份模型（PDF 第 352–353 页）。模型合并把多个微调模型组合：权重插值、任务算术等方法保留各模型能力，避免为每个任务维护独立服务（PDF 第 365 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：130 亿参数推理对照<\/h3>\n<p>FP32：<span class=\"katex-inline\">N=13\\times10^9<\/span>，<span class=\"katex-inline\">M=4<\/span>，权重 52 GB，推理估算 <span class=\"katex-inline\">52\\times1.2=62.4<\/span> GB。FP16：权重 26 GB，推理估算 31.2 GB。位宽减半，推理内存约减半。<\/p>\n<h3>算例 2：70 亿参数全量微调（原书算例，PDF 第 351 页）<\/h3>\n<p>FP16 权重 14 GB；Adam 全量微调额外 <span class=\"katex-inline\">7\\times10^9\\times3\\times2=42<\/span> GB；合计 56 GB，尚未含激活值。对比多数 12–24 GB 消费级 GPU 与 48 GB 高端卡容量，全量微调需要多卡或压缩方案。<\/p>\n<h3>算例 3：PEFT 可训练参数压缩<\/h3>\n<p>设 70 亿参数主干冻结，可训练参数占 1%（7000 万）。梯度与优化器状态按 2 字节：<span class=\"katex-inline\">7\\times10^7\\times3\\times2=420<\/span> MB；对比全量 42 GB，该项压缩约两个数量级。权重本身仍需加载，但训练新增显存大幅下降。<\/p>\n<h3>算例 4：位宽带宽收益<\/h3>\n<p>权重 <span class=\"katex-inline\">N\\times M<\/span> 同时决定显存占用与每次前向读取的带宽。INT8 相对 FP16 每参数字节减半，带宽读取减半；解码阶段受带宽限制时，吞吐改善与位宽压缩同向（c13）。精度损失按评估集核对，不能只看压缩比例。<\/p>\n<h3>算例 5：激活值规模<\/h3>\n<p>批次 <span class=\"katex-inline\">B<\/span>、上下文长度 <span class=\"katex-inline\">L<\/span>、隐藏维度 <span class=\"katex-inline\">H<\/span> 时，激活值规模大致随 <span class=\"katex-inline\">B\\times L\\times H<\/span> 增长；长上下文大批量下激活值可超过权重内存。梯度检查点丢弃中间激活，需要时重算，训练步数时间上升。<\/p>\n<h3>算例 6：微调维护成本账<\/h3>\n<p>基座模型每数月升级一次；微调版本基于旧基座，能力与漏洞修复滞后。任务数据、评估集、训练流程、部署版本都要随基座更新重跑。启动微调前把这笔维护周期计入成本，而非只算首次训练。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>提示词未调优就启动微调<\/strong>：指令不清、样本不反映真实分布、指标未定义，微调把输入侧缺陷固化进权重，后续回滚困难。\n<\/li><li>\n<strong>全量微调小模型上消费级显卡<\/strong>：56 GB 训练需求超出单卡容量，训练无法启动；PEFT 或量化是先把显存压到硬件范围内的路径。\n<\/li><li>\n<strong>假设微调能补缺失事实<\/strong>：参数更新改变倾向与格式，不创造训练数据里没有的知识；缺事实仍需检索上下文。\n<\/li><li>\n<strong>单任务微调后不回归通用能力<\/strong>：其他任务表现下降未被发现，上线后旧场景失效；微调前后应跑通用与任务两组评估集。\n<\/li><li>\n<strong>只算首次训练成本<\/strong>：忽略基座升级重对齐、适配器维护、故障回退，长期投入被低估。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ol><li>\n微调之前应先验证哪两类不动权重的手段？\n<\/li><li>\n推理显存与训练显存各含哪些项？Adam 每个可训练参数存几个值？\n<\/li><li>\n写出推理显存近似公式并解释系数 1.2。\n<\/li><li>\nPEFT 两条路线各冻结什么、训练什么？\n<\/li><li>\n模型合并解决什么部署问题？\n<\/ol>\n<h2>补充推演：边界案例与常见疑问<\/h2>\n<h3>案例 A：微调理由的验证口径<\/h3>\n<p>三类理由（补领域不足、引导输出结构、缓解偏见）都要能用评估集指标差距验证，而不是凭感觉判断模型不懂领域。提示词与检索基线跑过之后仍存在指标缺口，缺口可归因到行为或结构问题，微调才有明确目标。<\/p>\n<h3>案例 B：全量与 PEFT 的部署差别<\/h3>\n<p>全量微调产出独立权重副本，每个任务一套部署；PEFT 冻结主干，适配器小模块挂接主干，部署时切换适配器即可。主干升级时，PEFT 适配器重训成本通常低于全量副本；但 PEFT 性能不总等于全量，任务与数据量不同，要在自有评估集上对照。<\/p>\n<h3>案例 C：激活值内存的位置<\/h3>\n<p>权重内存固定，激活值随批次与上下文长度增长；长上下文大批量下激活值可超过权重内存。梯度检查点丢弃部分激活、需要时重算，以训练时间换显存。估算训练显存时只算权重与优化器状态，容易低估硬件需求；激活值必须按最大批次与上下文单独核算。<\/p>\n<h3>案例 D：位宽压缩的精度边界<\/h3>\n<p>位宽下降压缩权重体积与带宽读取，但数值精度降低可能影响表现。量化损失按评估集实测，不能只看压缩比例；同一位宽在不同任务上损失不同，敏感任务与格式任务要分别回归。<\/p>\n<h3>案例 E：模型合并的适用场景<\/h3>\n<p>多个适配模型各有专长时，权重插值、任务算术等合并方法保留各模型能力，避免为每个任务维护独立服务。合并不是消除微调代价，而是把多份适配组织成一份部署；合并后仍需跑通用与各任务评估集，确认能力没有互相抵消。<\/p>\n<h3>案例 F：微调维护周期<\/h3>\n<p>基座模型每数月升级一次，旧微调版本能力与漏洞修复滞后；任务数据、评估集、训练流程、部署版本都要随基座重跑。启动微调前把这笔维护周期计入成本，而非只算首次训练算力；这也是「不微调理由」中迭代速度跟不上基座进化的具体含义。<\/p>\n<h3>案例 G：微调启动核对清单<\/h3>\n<p>提示与检索基线是否达标；任务数据是否足量高质；硬件是否覆盖训练显存含激活值；通用能力回归是否安排；维护与基座升级成本是否计入；知识缺口是否应走检索而非微调。任一项不满足，微调收益无法被评估集量化。<\/p>\n<h3>案例 L：PEFT 部署与主干升级<\/h3>\n<p>适配器挂接冻结主干，部署时切换模块而非复制整份模型；主干升级后适配器需要重训验证。PEFT 性能不总等于全量微调，任务数据量不同要在自有评估集上对照，不能默认参数少就一定损失能力。<\/p>\n<h3>案例 M：微调与其他适配手段的次序<\/h3>\n<p>提示工程、上下文检索先跑基线；缺口可归因到行为或结构问题再启动微调；知识缺口仍走检索。微调前后跑通用与任务两组评估，防止单任务适配损害其他场景。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n给定 <span class=\"katex-inline\">N=13\\times10^9<\/span>、<span class=\"katex-inline\">M=2<\/span>，推理估算内存约多少？\n<\/li><li>\n全量微调 70 亿参数 FP16 合计约 56 GB，其中权重与 Adam 状态各多少？\n<\/li><li>\n位宽下降同时压缩哪两项资源？精度风险怎样核对？\n<\/li><li>\n激活值内存随哪些变量增长？梯度检查点用什么换什么？\n<\/li><li>\n什么情况下应考虑模型合并而不是继续单任务微调？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "微调决策与内存瓶颈：何时微调、可训练参数、显存估算、PEFT 与模型合并"}, "c12": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.385<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">微调决策与内存瓶颈：何时微调、可训练参数、显存估算、PEFT 与模型合并<\/a><\/span><\/div><h1>数据集工程：质量、覆盖度、数据量、数据合成与检查去重过滤<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 8 章（原书 8.1 数据策展、8.1.1 质量、8.1.2 覆盖度、8.1.3 数据量、8.2 数据获取、8.2.3 AI 驱动方法、8.3 数据处理，PDF 第 383–418 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>模型质量最终取决于训练数据质量；数据从哪来、怎么判断好坏、合成数据怎么用、检查去重过滤做什么，是数据集工程的基本问题。这个概念回答策展三标准（质量、覆盖度、数据量）的口径，数据格式分类，传统与 AI 驱动的获取方法，以及处理流水线各环节的作用。<\/p>\n<h2>定义<\/h2>\n<p><strong>数据策展三标准<\/strong>：质量、覆盖度、数据量（PDF 第 385 页）。<\/p>\n<p><strong>高质量数据特征<\/strong>：相关性强、符合任务要求、一致性高、格式规范、足够独特、合规（PDF 第 385 页）。一致性指标注员之间口径统一；格式规范指字段类型与书写方式一致；独特性避免重复样本引入偏差；合规涉及版权、隐私与许可。<\/p>\n<p><strong>覆盖度<\/strong>：数据覆盖用户问题的全部表达范围；用户查询的不同说法、场景、边界情况都要有对应样本（PDF 第 387 页）。<\/p>\n<p><strong>数据量<\/strong>：样本规模；与质量权衡，少量高质量数据常优于大量含噪数据（PDF 第 389 页）。<\/p>\n<p><strong>数据格式<\/strong>：自监督序列；监督（指令，响应）；偏好（提示词，胜出响应，落败响应）；训练奖励模型可用（（指令，响应），分数）（PDF 第 383 页）。<\/p>\n<p><strong>数据合成<\/strong>：传统方法基于规则与模板生成；AI 驱动方法用大模型生成样本，蒸馏是用大模型行为训练小模型（PDF 第 396 页前后）。<\/p>\n<p><strong>数据处理<\/strong>：检查、去重、清理过滤、格式化（PDF 第 412 页前后）。<\/p>\n<p>正例：Yi 模型系列发现 1 万条精心设计指令优于几十万条含噪指令；LIMA 用 1000 条精选（提示词，响应）对微调 650 亿参数模型（PDF 第 389 页）。反例：只追样本条数，一致性差、格式混杂的标注批量进入训练集。<\/p>\n<h2>原理推导<\/h2>\n<p>质量决定单条样本能教给模型什么；覆盖度决定模型遇到未见过说法时是否有准备；数据量决定统计稳定性。三者不是越大越好：低质量样本越多，模型学到的错误模式越牢固；覆盖缺口比样本不足更难补救，因为模型会在缺口场景随意发挥。<\/p>\n<p>获取路径按格式组织：自监督序列从文本语料采集；监督对需要人工示范或 AI 生成后审核；偏好对需要成对比较信号。传统合成靠规则模板扩写；AI 合成用强模型生成指令、响应或偏好对，再人工或规则过滤；蒸馏把大模型输出作为小模型训练数据。<\/p>\n<p>处理流水线先检查格式与字段，去重移除近重复样本，清理过滤噪声与违规内容，最后格式化为训练所需结构。数据污染（训练集混入测试样本）会让评估指标虚高，去重与来源隔离是必要环节。<\/p>\n<p>数据获取按格式组织：自监督序列从文本语料采集；监督对靠人工示范或 AI 生成后审核；偏好对需要成对比较信号；奖励模型数据给响应打数值分数。处理流水线先检查字段与类型，再去重移除近重复，然后清理过滤噪声与违规内容，最后格式化为训练结构。训练集与测试集来源隔离，防止测试样本混入导致评估虚高。覆盖度评估按说法类别统计占比，长尾变体与边界场景要有对应样本；数据策展随产品反馈循环更新，不是一次性采集。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：准备微调或偏好训练数据；评估现有数据集缺口；设计合成与处理流程。\n<\/li><li>\n边界一：合成数据依赖生成模型质量；生成模型的偏差会被复制进数据集。\n<\/li><li>\n失败案例一：标注口径不一致。不同标注员对同一类响应判断不同，模型学到矛盾信号。\n<\/li><li>\n失败案例二：重复样本未去重。某类表达被过度采样，模型偏向该模式；训练集与测试集重叠使评估失真。\n<\/li><li>\n边界二：数据量与质量的平衡随任务变化；复杂推理任务需要更多样例，简单格式任务少量样本即可。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>质量 vs 覆盖度<\/strong>：质量看单条样本可靠程度，覆盖度看样本空间是否完整；两者都缺时优先补质量，再扩覆盖。\n<\/li><li>\n<strong>监督数据 vs 偏好数据<\/strong>：前者给正确响应，后者给成对优劣；训练目标不同，格式不可混用。\n<\/li><li>\n<strong>传统合成 vs AI 合成<\/strong>：前者规则可控但多样性有限，后者多样但带生成模型偏差。\n<\/li><li>\n<strong>去重 vs 过滤<\/strong>：去重移除重复近重复样本，过滤移除低质违规样本；环节顺序通常先查重再清理。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 的 SFT 与偏好微调决定数据格式；c07 评估指南沉淀标注口径。后继：c11 微调消耗这些数据；c06 裁判与比较评估可产出偏好信号；c14 反馈回流的生产样本进入下一轮数据策展。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（数据集工程：质量、覆盖度、数据量、数据合成与检查去重过滤）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：策展三标准、数据格式与处理流水线<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清数据集工程，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先确认训练目标对应的格式<\/strong>：自监督、监督、偏好、奖励模型数据格式不同，格式不定无法谈采集与标注。\n<\/li><li>\n<strong>再按策展标准审样本<\/strong>：质量看单条可靠性，覆盖度看样本空间完整度，数据量看统计稳定性；三者顺序不可颠倒。\n<\/li><li>\n<strong>区分数据来源的偏差风险<\/strong>：人工标注带判断口径，AI 合成带生成模型偏差，规则模板带多样性限制；来源不同审核重点不同。\n<\/li><li>\n<strong>确认处理环节的位置<\/strong>：检查、去重、过滤、格式化在进入训练前完成；污染与重复会同时损害模型与评估。\n<\/ol>\n<p>依赖链方向：训练目标 → 数据格式 → 策展三标准筛选 → 人工/传统合成/AI 合成/蒸馏获取 → 检查去重过滤格式化 → 进入训练集与评估隔离。<\/p>\n<h2>正向推导：从标准到处理流程<\/h2>\n<h3>第一步：质量口径<\/h3>\n<p>高质量数据六个特征：相关性强（与任务相关）；符合任务要求；一致性高（标注口径统一）；格式规范（字段类型、书写方式一致）；足够独特（不重复堆砌）；合规（版权、隐私、许可清晰）（PDF 第 385 页）。一致性是最常见缺口：标注员之间对「好响应」理解不同，一列本应浮点的数据被存成整型四舍五入，模型会被这类格式错误困惑（c07 同类案例）。<\/p>\n<h3>第二步：覆盖度口径<\/h3>\n<p>用户问题存在多种表达：同一意图的口语、书面、缩写、反问、纠错说法；不同场景与边界情况。覆盖度要求样本空间包含这些变体。覆盖缺口比样本不足更隐蔽：条数达标但缺口场景缺失，模型在缺口处没有参照，只能随机发挥。补覆盖要从真实查询日志采样，对照高频说法与长尾场景。<\/p>\n<h3>第三步：数据量口径<\/h3>\n<p>数据量与质量权衡。原书引用：Yi 模型系列发现 1 万条精心设计指令优于几十万条含噪指令；LIMA 用 1000 条精选（提示词，响应）对微调 650 亿参数模型（PDF 第 389 页）。推论：低质量样本不会因数量大变成高质量；先清质量再补规模。复杂推理任务样本需求更大，简单格式任务少量精选即可，规模按任务难度与评估集表现定。<\/p>\n<h3>第四步：四类数据格式<\/h3>\n<p>自监督序列：直接用文本语料，预测下一个 token。监督（指令，响应）：示范任务行为，服务 SFT。偏好（提示词，胜出响应，落败响应）：成对优劣，服务偏好微调。奖励模型格式：（（指令，响应），分数），训练打分模型（PDF 第 383 页）。格式与 c02 训练阶段一一对应；混用格式等于给模型错误信号。<\/p>\n<h3>第五步：获取方法<\/h3>\n<p>人工标注：成本高、速度慢，质量取决于标注指南与审核；与 c06 人工评估口径一致。传统合成：规则与模板扩写，可控但多样性有限。AI 驱动方法：强模型生成指令、响应、偏好对，再过滤审核；蒸馏用大模型行为训练小模型，大模型输出作为小模型数据。AI 合成放大数量快，但生成模型的偏差、错误、风格倾向会被复制，必须经质量检查。<\/p>\n<h3>第六步：处理流水线<\/h3>\n<p>检查：字段是否齐全、类型是否正确、格式是否规范。去重：移除完全重复与近重复样本，避免某类表达过度采样。清理过滤：剔除噪声、违规、低相关内容，处理版权隐私问题。格式化：转成训练框架要求的结构与编码。污染防控：训练集与测试集来源隔离，防止测试样本混入训练导致评估虚高。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：质量优先对照<\/h3>\n<p>方案甲：1 万条精选指令，口径一致、格式规范；方案乙：30 万条含噪指令，混有错例与重复。原书口径：甲优于乙（PDF 第 389 页）。数据条数差距 30 倍，质量差距决定最终模型表现。<\/p>\n<h3>算例 2：覆盖度采样<\/h3>\n<p>真实日志 1 万条查询，聚类出 20 类说法。若样本只覆盖前 8 类，长尾 12 类场景无参照；覆盖度评估应统计各类别样本占比，而不是只看总数。<\/p>\n<h3>算例 3：格式一致性检查<\/h3>\n<p>浮点金额字段应保留小数；若部分条目存成整型，训练时模型看到两种口径，学习到的响应不稳定。检查环节按字段类型批量校验，格式错误在去重之前拦截。<\/p>\n<h3>算例 4：AI 合成审核比例<\/h3>\n<p>AI 生成 1 万条候选，规则过滤后剩 6000 条，人工抽检通过 4000 条进入训练。合成放大的是候选规模，不减少审核环节；生成模型偏差高的类别要提高抽检比例。<\/p>\n<h3>算例 5：去重收益<\/h3>\n<p>近重复样本占比 15% 时，某类表达被重复采样，模型偏向该模式；去重后样本分布更接近真实查询分布。训练集与测试集重叠条目也要清除，否则困惑度与任务指标虚高。<\/p>\n<h3>算例 6：蒸馏数据账<\/h3>\n<p>大模型生成响应作为小模型训练数据，小模型学习的是大模型行为而非原始标注；大模型错误进入蒸馏集同样被复制。蒸馏前后应对照评估集核对小模型在任务上的指标，不能默认「大模型输出即正确」。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>只追数据条数<\/strong>：低质量样本越多，错误模式被反复强化；一致性与格式问题随规模放大。\n<\/li><li>\n<strong>样本只覆盖常见说法<\/strong>：长尾变体无参照，模型在缺口场景自由发挥；覆盖度必须对照真实查询日志补齐。\n<\/li><li>\n<strong>AI 合成数据不过滤直接训练<\/strong>：生成模型偏差与错误被复制进数据集，模型继承合成来源的缺陷。\n<\/li><li>\n<strong>训练集与测试集不隔离<\/strong>：测试样本参与训练，评估指标虚高，上线后表现回落；污染排查是数据处理的固定环节。\n<\/li><li>\n<strong>标注指南不写反例与边界<\/strong>：标注员口径漂移，同一条响应在不同批次判断相反，模型收到矛盾信号。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ol><li>\n策展三标准各回答什么问题？\n<\/li><li>\n高质量数据的六个特征是什么？\n<\/li><li>\n监督数据与偏好数据格式有什么差别？\n<\/li><li>\n传统合成与 AI 合成各有什么偏差来源？\n<\/li><li>\n检查、去重、过滤、格式化各做什么？\n<\/ol>\n<h2>补充推演：边界案例与常见疑问<\/h2>\n<h3>案例 A：质量、覆盖度、数据量的顺序<\/h3>\n<p>质量先于覆盖度，覆盖度先于规模。单条样本不可靠时，扩量只会复制错误；样本可靠但覆盖缺口，模型在缺口场景随意发挥；前两项过关后再谈统计稳定性。跳过质量直接追条数，是数据集工程最常见的顺序错误。<\/p>\n<h3>案例 B：格式与训练阶段的对应<\/h3>\n<p>自监督序列对应预训练，（指令，响应）对应 SFT，（提示词，胜出/落败）对应偏好微调，（（指令，响应），分数）对应奖励模型。格式混用等于给模型错误信号；准备数据前先确认目标训练阶段，再组织对应结构。<\/p>\n<h3>案例 C：标注口径一致性<\/h3>\n<p>标注员对「好响应」理解不同，模型收到矛盾信号。指南要写反例与边界，标注后抽样复核口径；字段类型错误（浮点存成整型）这类格式问题，在检查环节批量拦截，不进入去重之后的流程。<\/p>\n<h3>案例 D：合成数据的偏差传递<\/h3>\n<p>AI 合成放大候选数量快，但生成模型的偏差、错误、风格倾向会被复制进数据集。规则过滤先拦明显问题，人工抽检复核高风险类别；生成模型不擅长的类别要提高抽检比例。蒸馏数据也是如此：大模型输出不等于正确，蒸馏前后对照评估集核对小模型指标。<\/p>\n<h3>案例 E：去重与污染防控<\/h3>\n<p>近重复样本让某类表达被过度采样，模型偏向该模式；去重移除完全重复与近重复。训练集与测试集重叠会让评估指标虚高，来源隔离与查重是固定环节。数据处理顺序：检查格式 → 去重 → 清理过滤 → 格式化，污染排查贯穿全程。<\/p>\n<h3>案例 F：覆盖度采样来源<\/h3>\n<p>覆盖度要对照真实查询日志：聚类出说法类别，统计各类别样本占比，补齐长尾变体。只按常见说法准备样本，条数达标但缺口仍在；覆盖缺口比样本不足更隐蔽，因为总数看起来充足。<\/p>\n<h3>案例 G：数据集上线前检查<\/h3>\n<p>格式字段是否齐全、类型是否规范；一致性口径是否经抽样复核；近重复是否去重；低质违规内容是否过滤；训练集与测试集是否隔离；合成数据是否经规则与人工审核。检查、去重、过滤、格式化按顺序进行，污染排查贯穿全程。<\/p>\n<h3>案例 H：数据量与质量的权衡判断<\/h3>\n<p>复杂推理任务需要更多样例，简单格式任务少量精选即可；规模按评估集表现定，不按条数目标定。低质量样本越多，错误模式被强化越牢；先清质量再补覆盖，最后扩规模。Yi 模型与 LIMA 的案例说明精选数据可以替代海量含噪数据（PDF 第 389 页）。<\/p>\n<h3>案例 I：偏好与奖励数据的区别<\/h3>\n<p>偏好数据成对给出胜出与落败响应；奖励模型数据给响应打数值分数。两者服务不同训练阶段，格式不可混用；准备数据前先确认目标阶段，再组织对应结构。<\/p>\n<h3>案例 K：数据质量与模型表现的传导<\/h3>\n<p>数据质量问题沿训练传导：标注矛盾让模型收到冲突信号，格式错误造成行为偏差，重复样本引入偏向。策展环节拦住的问题，到训练后再补救成本更高；数据检查优先于模型调参。<\/p>\n<h3>案例 L：评估集反哺数据策展<\/h3>\n<p>评估集中被点踩、被修正的对话，审核后可进入下一轮数据策展；标注指南从评估案例中沉淀反例。数据策展不是一次性采集，而是随产品反馈循环更新的过程；质量、覆盖度、数据量三条标准在每一轮迭代中重新核对。<\/p>\n<h3>案例 M：数据格式与训练阶段对照<\/h3>\n<p>自监督序列对应预训练；（指令，响应）对应监督微调；（提示词，胜出/落败响应）对应偏好微调；（（指令，响应），分数）对应奖励模型。格式与阶段错位会让训练目标与样本形式对不上。数据策展还要关注合规：版权、隐私、许可在采集与合成环节同步核对，避免上线后返工。<\/p>\n<h3>案例 N：质量问题的传导位置<\/h3>\n<p>标注矛盾让模型收到冲突信号；格式错误造成行为偏差；重复样本引入偏向；训练测试重叠让评估虚高。这些问题在策展环节拦截成本最低，进入训练后再补救需要重新走数据与评估流程。覆盖度缺口比样本不足更隐蔽，要对照真实查询日志逐类核对。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n为什么少量精选数据可以优于大量含噪数据？\n<\/li><li>\n覆盖度缺口为什么比样本不足更隐蔽？\n<\/li><li>\n偏好微调数据与奖励模型数据格式分别怎么组织？\n<\/li><li>\nAI 合成数据为什么仍需人工或规则审核？\n<\/li><li>\n训练集混入测试样本会让哪些评估指标失真？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "数据集工程：质量、覆盖度、数据量、数据合成与检查去重过滤"}, "c13": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.426<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c12\">数据集工程：质量、覆盖度、数据量、数据合成与检查去重过滤<\/a><\/span><\/div><h1>推理优化：延迟/吞吐/利用率、预填充与解码瓶颈、批处理与成本估算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 9 章（原书 9.1 推理概述、9.1.2 性能指标、9.2.1 模型优化、9.2.2 服务优化，PDF 第 421–457 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>模型上线后，质量达标还不够：响应要等得起、服务要扛得住、成本要算得清。推理优化在质量不变的前提下压缩延迟与成本。这个概念回答延迟怎样分解、吞吐与利用率各指什么，预填充与解码为什么瓶颈不同，批处理怎样换取吞吐又推高排队延迟，模型层与服务层优化各有哪些手段。<\/p>\n<h2>定义<\/h2>\n<p><strong>推理服务两类<\/strong>：在线 API 优化延迟，到达即处理；批处理 API 优化成本，允许批量与低成本硬件，原书提到两家提供商批处理成本降约 50%、周转以小时计（PDF 第 425 页）。<\/p>\n<p><strong>延迟分解<\/strong>：整体延迟 <span class=\"katex-inline\">=\\mathrm{TTFT}+\\mathrm{TPOT}\\times<\/span> 输出 token 数。TTFT 为首个 token 生成时间，对应预填充；TPOT 为每个输出 token 的平均生成时间，对应解码（PDF 第 426 页）。Anyscale 实验：100 个输入 token 对延迟的影响约等于 1 个输出 token（PDF 第 427 页）。<\/p>\n<p><strong>吞吐量<\/strong>：单位时间完成 token 数（TPS）或请求数（RPS/RPM）；<strong>有效吞吐量（goodput）<\/strong>：满足 SLO 的请求数；<strong>MFU<\/strong>：实际吞吐占峰值 FLOP/s 理论吞吐比例；<strong>MBU<\/strong>：实际带宽占理论带宽比例，带宽用量 <span class=\"katex-inline\">=<\/span> 参数量 <span class=\"katex-inline\">\\times<\/span> 每参数字节数 <span class=\"katex-inline\">\\times<\/span> 吞吐量（PDF 第 428–430 页）。<\/p>\n<p><strong>模型层优化<\/strong>：量化、蒸馏、剪枝、推测解码；<strong>服务层优化<\/strong>：静态/动态/连续批处理、预填充与解码解耦、提示词缓存（PDF 第 440–456 页）。<\/p>\n<p>正例：LinkedIn 团队口径，愿意牺牲 TTFT 与 TPOT，吞吐量翻倍甚至翻三倍并不罕见（PDF 第 428 页）。反例：只看总吞吐量，忽略尾部延迟与未达标请求比例。<\/p>\n<h2>原理推导<\/h2>\n<p>推理分两阶段：预填充读入输入 token，计算受限；解码逐 token 生成，内存带宽受限。混在同一实例上两类瓶颈互相争用；解耦到不同实例后分别调度，中间状态经高带宽连接传输。<\/p>\n<p>批处理把相近到达的请求合并，复用权重加载与计算批次，提高吞吐与利用率。静态批处理等批次填满才出发；动态批处理设最大等待窗口，坐满或超时先到先处理；连续批处理允许完成响应立即返回并补入新请求，避免短响应等长响应。吞吐上升的代价是排队等待增加，TTFT/TPOT 可能变长。<\/p>\n<p>成本估算：API 按 token 计费，输入输出都计入；自托管固定集群后规模扩大，单 token 成本可能显著降低。带宽用量公式把参数量、位宽与吞吐连起来：<span class=\"katex-inline\">B=N\\times M\\times\\mathrm{TPS}<\/span>；带宽受限场景下，位宽压缩与批次复用直接缓解瓶颈。<\/p>\n<p>模型层优化改模型体积与计算量，服务层优化改调度与缓存，两类手段可叠加；压缩方案上线前必须回到同一评估集回归质量，避免位宽或剪枝带来的精度损失被吞吐收益掩盖。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：上线前延迟预算核算；服务扩容与批处理策略选择；模型压缩方案对比。\n<\/li><li>\n边界一：吞吐优化以排队延迟为代价；SLO 按 p90/p95/p99 尾部延迟考核，平均值会掩盖尾部问题。\n<\/li><li>\n失败案例一：只报总吞吐。每秒完成 10 个请求但仅 3 个达标，goodput 为 3，总吞吐掩盖体验问题。\n<\/li><li>\n失败案例二：批处理无窗口上限。晚到请求拖住整批，首批 TTFT 失控。\n<\/li><li>\n边界二：量化、剪枝等模型压缩可能损失质量，压缩前后必须在评估集上回归。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>延迟 vs 吞吐<\/strong>：延迟是单请求等待时间，吞吐是单位时间处理量；批处理提吞吐常以延迟为代价。\n<\/li><li>\n<strong>MFU vs MBU<\/strong>：前者衡量算力利用，后者衡量带宽利用；解码阶段多为带宽受限，MBU 更贴近瓶颈。\n<\/li><li>\n<strong>预填充 vs 解码<\/strong>：计算受限与带宽受限，瓶颈资源不同，调度策略不同。\n<\/li><li>\n<strong>模型优化 vs 服务优化<\/strong>：前者改模型体积与计算量，后者改调度与缓存；两类手段可叠加。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c11 的位宽与显存决定带宽基线；c07 的成本延迟标准是优化目标。后继：c14 架构中的网关缓存承接提示词缓存；c10 智能体多步链路延迟由 TTFT/TPOT 累加；c12 数据规模影响蒸馏方案选择。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（推理优化：延迟/吞吐/利用率、预填充与解码瓶颈、批处理与成本估算）<\/summary><div class=\"depth-body\"><h1>c13 深度推导：延迟吞吐指标、瓶颈分解与批处理权衡<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清推理优化，先往回追五层前提：<\/p>\n<ol><li>\n<strong>先确认服务形态<\/strong>：在线请求优先延迟，批处理优先成本；形态不同，优化目标与调度方式不同。\n<\/li><li>\n<strong>把延迟拆到阶段<\/strong>：TTFT 对应预填充，TPOT 对应解码；整体延迟由两段相加，定位瓶颈先看哪段占比高。\n<\/li><li>\n<strong>区分资源瓶颈类型<\/strong>：预填充计算受限，解码带宽受限；混部争用资源，解耦可分别调度。\n<\/li><li>\n<strong>承认吞吐与延迟的拉扯<\/strong>：批处理复用资源提吞吐，排队等待推高延迟；goodput 只计达标请求。\n<\/li><li>\n<strong>成本口径随部署方式变化<\/strong>：API 按 token 计费，自托管固定集群摊薄规模成本；两条账不能混算。\n<\/ol>\n<p>依赖链方向：服务形态 → 延迟分解 TTFT/TPOT → 预填充/解码瓶颈 → 批处理调度权衡 → 模型层与服务层优化叠加。<\/p>\n<h2>正向推导：从指标定义到调度策略<\/h2>\n<h3>第一步：两类推理服务<\/h3>\n<p>在线 API：请求到达即处理，优化延迟，面向交互式产品。批处理 API：收集一批后统一处理，可使用低成本硬件，优化成本；原书提到两家提供商批处理成本降低约 50%，周转时间以小时计（PDF 第 425 页）。离线任务（批量摘要、数据标注）适合批处理；聊天、搜索必须走在线。<\/p>\n<h3>第二步：延迟分解<\/h3>\n<p>整体延迟 <span class=\"katex-inline\">=\\mathrm{TTFT}+\\mathrm{TPOT}\\times<\/span> 输出 token 数。TTFT（time to first token）：从请求发起到首个 token 返回；TPOT（time per output token）：每个后续输出 token 的平均耗时。输入越长预填充越久，输出越长解码累积越多。Anyscale 实验口径：100 个输入 token 对延迟的影响约等于 1 个输出 token（PDF 第 427 页）。延迟考核看尾部：p90/p95/p99 反映慢请求体验，平均值被快请求拉高，不能替代尾部指标。<\/p>\n<h3>第三步：吞吐与利用率<\/h3>\n<p>吞吐量以 TPS（每秒 token）或 RPS/RPM（每秒/每分钟请求）计。有效吞吐量（goodput）只统计满足 SLO 的请求：每秒完成 10 个请求仅 3 个达标，goodput 为 3 个/秒（PDF 第 429 页）。MFU（model FLOPs utilization）：实际吞吐占峰值 FLOP/s 理论吞吐的比例。MBU（memory bandwidth utilization）：实际带宽占理论带宽比例；带宽用量 <span class=\"katex-inline\">=<\/span> 参数量 <span class=\"katex-inline\">\\times<\/span> 每参数字节数 <span class=\"katex-inline\">\\times<\/span> 吞吐量（PDF 第 430 页）。解码阶段权重每步都要从显存读一遍，带宽是常见瓶颈。<\/p>\n<h3>第四步：预填充与解码瓶颈<\/h3>\n<p>预填充一次性读入全部输入 token，并行计算注意力与前向，计算量集中，属计算受限。解码逐 token 生成，每步重读权重、增量更新 KV 缓存，计算量小而带宽重复读取，属带宽受限。两类任务混在同一实例，资源争用互相干扰；解耦后预填充实例与解码实例分别调度，生成中间状态经高带宽连接传递（PDF 第 454–455 页）。<\/p>\n<h3>第五步：批处理三档调度<\/h3>\n<p>静态批处理：等批次填满才出发，早到请求被晚到请求拖住，批次利用率高但等待长。动态批处理：设最大时间窗口，坐满或超时先到先处理；批次可能不满，浪费部分算力。连续批处理：响应完成即返回槽位并补入新请求，短响应不必等长响应，吞吐与延迟平衡最好（PDF 第 453–454 页）。LinkedIn 团队口径：愿意牺牲 TTFT 和 TPOT，吞吐量翻倍甚至翻三倍并不罕见（PDF 第 428 页）。取舍前提是 SLO 仍达标。<\/p>\n<h3>第六步：优化手段分层<\/h3>\n<p>模型层：量化降位宽压缩权重与带宽；蒸馏用小模型继承大模型能力；剪枝移除冗余结构；推测解码用小模型草拟、大模型校验提速。服务层：批处理调度；预填充/解码解耦；提示词缓存复用相同前缀的 KV 与计算；KV 缓存管理减少解码读取压力。优化叠加顺序：先定位瓶颈阶段，再选对应层手段；压缩模型后必须回归质量评估。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：延迟构成<\/h3>\n<p>输入 2000 token，输出 150 token。TTFT 0.8 秒，TPOT 0.02 秒/token。整体延迟 <span class=\"katex-inline\">=0.8+0.02\\times150=3.8<\/span> 秒。若输出翻倍到 300 token，整体 <span class=\"katex-inline\">=0.8+6=6.8<\/span> 秒；输出长度是解码延迟的主要杠杆。<\/p>\n<h3>算例 2：输入输出口径<\/h3>\n<p>Anyscale 实验：100 输入 token ≈ 1 输出 token 的延迟影响（PDF 第 427 页）。长输入主要抬高 TTFT，长输出主要累积 TPOT；优化时先判断当前慢在首 token 还是后续 token。<\/p>\n<h3>算例 3：带宽用量对照<\/h3>\n<p>70 亿参数模型，FP16（<span class=\"katex-inline\">M=2<\/span> 字节），TPS=100。带宽用量 <span class=\"katex-inline\">=7\\times10^9\\times2\\times100=1.4\\times10^{12}<\/span> 字节/秒 <span class=\"katex-inline\">=1400<\/span> GB/s；A100-80GB 理论带宽约 2 TB/s，MBU 约 70%（PDF 第 430 页口径）。位宽降到 INT8，相同吞吐带宽用量减半；吞吐翻倍则带宽需求翻倍。<\/p>\n<h3>算例 4：成本估算口径<\/h3>\n<p>API 场景：费用 <span class=\"katex-inline\">=<\/span> 输入 token <span class=\"katex-inline\">\\times<\/span> 输入单价 <span class=\"katex-inline\">+<\/span> 输出 token <span class=\"katex-inline\">\\times<\/span> 输出单价；两家提供商批处理成本约为在线一半，周转小时级。自托管：集群固定，每天处理 100 万与 10 亿 token，计算成本基本相同；规模越大单 token 成本越低（PDF 第 198、425 页）。<\/p>\n<h3>算例 5：goodput 核算<\/h3>\n<p>总吞吐 10 请求/秒，SLO 达标 3 个/秒。总吞吐翻到 16，达标仍为 3，goodput 未改善；只压总吞吐不能提升体验，要按达标率调批大小与窗口。<\/p>\n<h3>算例 6：提示词缓存收益<\/h3>\n<p>多请求共享相同系统提示与文档前缀，前缀计算与 KV 缓存复用；缓存命中时该部分不再重复预填充。重复前缀越长、命中率越高，TTFT 节省越多；缓存策略与 c14 网关缓存衔接。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>在线产品用大批次等待<\/strong>：交互请求排队失控，TTFT 尾部延迟超标；在线场景窗口必须短，批大小受限。\n<\/li><li>\n<strong>只报平均延迟<\/strong>：慢请求被快请求稀释，p99 超时用户看不到；延迟考核必须看尾部分位。\n<\/li><li>\n<strong>量化压缩后不回归质量<\/strong>：位宽损失未被发现，上线后任务指标下滑；压缩前后同一评估集对照不可省。\n<\/li><li>\n<strong>预填充解码混部不分离<\/strong>：两类瓶颈争用资源，互相拖慢；高负载时吞吐与延迟同时恶化。\n<\/li><li>\n<strong>批处理无超时窗口<\/strong>：晚到请求拖住整批，首批响应时间不可控；动态/连续批处理的窗口上限是必要约束。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ol><li>\nTTFT 与 TPOT 各对应哪个阶段？整体延迟公式是什么？\n<\/li><li>\ngoodput 与总吞吐差别在哪？\n<\/li><li>\nMFU 与 MBU 各衡量什么？解码阶段通常哪个更贴近瓶颈？\n<\/li><li>\n静态、动态、连续批处理各有什么取舍？\n<\/li><li>\n模型层与服务层优化分别改什么？\n<\/ol>\n<h2>补充推演：边界案例与常见疑问<\/h2>\n<h3>案例 A：延迟定位先分阶段<\/h3>\n<p>整体延迟高，先区分慢在首 token 还是后续 token。TTFT 高说明预填充瓶颈：输入过长、前缀重复计算或算力不足；TPOT 高说明解码瓶颈：带宽受限、批次调度或模型过大。阶段不同，优化手段不同，混在一起无法定位。<\/p>\n<h3>案例 B：尾部延迟与平均值<\/h3>\n<p>平均延迟被快请求拉高，慢请求体验看不到；在线产品按 p90/p95/p99 考核尾部延迟。批处理提吞吐的前提是 SLO 仍达标，只压总吞吐而忽略尾部，会把超时请求藏在平均值里。<\/p>\n<h3>案例 C：goodput 与总吞吐<\/h3>\n<p>总吞吐统计所有完成请求，goodput 只计满足 SLO 的请求。总吞吐翻番而达标率不变，体验没有改善；扩容与调批大小时，应以 goodput 增长为目标，而不是总 token 数。<\/p>\n<h3>案例 D：两类瓶颈的调度对照<\/h3>\n<p>预填充计算受限，适合并行算力调度；解码带宽受限，权重每步重复读取。混部争用资源，解耦后两类实例分别调度，中间状态经高带宽连接传递。高负载时混部互相拖慢，解耦是吞吐与延迟同时改善的路径之一。<\/p>\n<h3>案例 E：成本口径随部署方式<\/h3>\n<p>API 按输入输出 token 计费，批量任务走批处理渠道成本约低一半、周转小时级；自托管集群固定后，规模越大单 token 成本越低。两条账不能混算：选型时先估算调用量区间，再比较 API 弹性成本与自托管固定成本。<\/p>\n<h3>案例 F：压缩质量回归顺序<\/h3>\n<p>量化、剪枝、蒸馏等模型压缩先在评估集上回归质量，再上服务层优化。压缩损失未核对就上线，格式任务或敏感任务可能下滑；模型层与服务层手段可叠加，但每一层改动都要可回退。<\/p>\n<h3>案例 G：推理指标记录口径<\/h3>\n<p>记录延迟时分 TTFT 与 TPOT；记录吞吐时分总吞吐与 goodput；利用率区分 MFU 与 MBU；成本区分 API token 计费与自托管固定集群。指标按尾部分位记录，避免平均值掩盖慢请求。<\/p>\n<h3>案例 M：优化手段的叠加顺序<\/h3>\n<p>先定位瓶颈阶段（预填充或解码），再选模型层压缩或服务层调度；每层改动可回退。压缩质量回归通过后再叠加批处理与缓存策略，避免多个变量同时改动导致效果无法归因。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n给定 TTFT 0.6 秒、TPOT 0.015 秒、输出 200 token，整体延迟多少？\n<\/li><li>\n带宽用量公式包含哪三个变量？位宽减半对带宽有什么影响？\n<\/li><li>\n预填充为什么是计算受限，解码为什么是带宽受限？\n<\/li><li>\n为什么总吞吐上升而 goodput 可能不变？\n<\/li><li>\n提示词缓存复用了哪部分计算与状态？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "推理优化：延迟/吞吐/利用率、预填充与解码瓶颈、批处理与成本估算"}, "c14": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.462<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c13\">推理优化：延迟/吞吐/利用率、预填充与解码瓶颈、批处理与成本估算<\/a><\/span><\/div><h1>AI 工程架构与反馈循环：上下文增强、防护、网关缓存、显式与隐式反馈<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 10 章（原书 10.1 AI 工程架构、10.1.1 上下文增强、10.1.2 防护、10.1.3 网关与缓存、10.2 用户反馈，PDF 第 462–500 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>前面各章的模型、检索、工具、微调、优化要串成可上线的产品架构；上线之后，用户使用与反馈怎样回流改进模型和产品。这个概念回答最简架构长什么样、按什么顺序逐步加上下文增强、防护、网关与缓存，反馈分哪些类型、怎样提取与设计，专有使用数据为什么构成长期壁垒。<\/p>\n<h2>定义<\/h2>\n<p><strong>最简架构<\/strong>：应用接收查询、发给模型、返回响应；没有上下文增强与防护（PDF 第 462 页）。<\/p>\n<p><strong>上下文增强<\/strong>：接入外部数据源与工具，把检索结果、工具输出作为材料交给模型；对应 c09 RAG 与 c10 工具调用。<\/p>\n<p><strong>防护<\/strong>：输入防护与输出防护；识别越界输入、敏感信息与违规输出，避免机密、隐私、内部政策暴露（PDF 第 464 页前后）。<\/p>\n<p><strong>网关<\/strong>：集中做访问控制、成本管理、限流与故障回退；<strong>系统缓存<\/strong>分精确缓存（完全一致才命中）与语义缓存（语义相似即命中，依赖嵌入质量与阈值）（PDF 第 473–476 页）。<\/p>\n<p><strong>显式反馈<\/strong>：用户直接给出的评价——点赞点踩、评分、明确询问；<strong>隐式反馈<\/strong>：从行为推断——购买、停留、重述、提前终止等（PDF 第 488 页）。<\/p>\n<p><strong>数据飞轮<\/strong>：产品上线后收集使用与反馈数据，回流改进模型与产品，再吸引更多用户与数据；专有使用数据构成竞争壁垒（PDF 第 487 页）。<\/p>\n<p>正例：对话界面从自然语言反馈提取提前终止、错误修正、重新表述等信号。反例：只收集点赞点踩，忽略行为信号，反馈样本量单薄。<\/p>\n<h2>原理推导<\/h2>\n<p>架构演进按风险与收益排序：最简链路验证基本价值；上下文增强补上知识与工具；防护挡住输入输出两侧风险；网关统一治理访问、成本与限流；缓存优化延迟成本；再补复杂逻辑与动作。各组件可独立评估与替换，与 c07 组件级评估对应。<\/p>\n<p>反馈循环分三步：收集（显式评分、隐式行为、对话信号）；提取（从自然语言对话中识别终止、修正、重述）；使用（评估模型、开发个性化、沉淀训练数据）。反馈即用户数据，使用时同样尊重隐私与许可。<\/p>\n<p>反馈设计原则：反馈方式简单、与场景贴合；把反馈纳入指标体系；鼓励高质量反馈；通过提示词与流程设计收集反馈（PDF 第 493 页前后）。自然语言反馈是富信号源：提前终止说明回答不完整或不相关，错误修正暴露误解，重新表述指出理解偏差。<\/p>\n<p>反馈设计原则：反馈方式简单、与场景贴合；把反馈纳入指标体系；鼓励高质量反馈；通过提示词与流程设计收集反馈。自然语言反馈是富信号源：提前终止说明回答不完整或不相关，错误修正暴露误解，重新表述指出理解偏差，追问细节反映方向被部分接受。反馈即用户数据，使用时同样遵守隐私与许可边界。架构各组件可独立评估与替换：检索块质量按精度召回核对，工具输出按故障分类记录，网关与缓存的收益用延迟与命中比例衡量；组件接入顺序按风险与收益安排，避免为堆架构增加链路延迟与故障点。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：规划产品架构分层；设计反馈收集方案；判断缓存与防护的接入位置。\n<\/li><li>\n边界一：架构组件不是越多越好；每层增加延迟、成本与故障点，按风险与优先级接入。\n<\/li><li>\n失败案例一：把内部政策写进系统提示词后只靠提示隔离；敏感策略需要独立检测层。\n<\/li><li>\n失败案例二：反馈数据不回流。生产使用数据停留在日志里，模型与产品改进失去原料，飞轮断在第一环。\n<\/li><li>\n边界二：隐式反馈是推断信号，受场景干扰；行为与评价要结合，不能单凭一次点击下结论。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>上下文增强 vs 防护<\/strong>：前者补充材料提升质量，后者拦截风险；一前一后，不可互相替代。\n<\/li><li>\n<strong>精确缓存 vs 语义缓存<\/strong>：前者字面完全一致命中，后者语义相似命中；后者覆盖广但依赖嵌入与阈值，误命中风险更高。\n<\/li><li>\n<strong>显式反馈 vs 隐式反馈<\/strong>：前者直接表态，后者行为推断；前者样本少口径清，后者样本多需解释。\n<\/li><li>\n<strong>网关 vs 防护<\/strong>：网关管访问、成本、限流与回退；防护管内容合规与风险识别；职责相邻但目标不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c08–c13 各技术组件是架构中的模块；c07 评估标准贯穿组件与产品层。后继：反馈数据进入 c12 下一轮策展；故障与延迟指标回到 c13 推理优化；架构闭环是全书决策链的出口，也指向下一轮迭代。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（AI 工程架构与反馈循环：上下文增强、防护、网关缓存、显式与隐式反馈）<\/summary><div class=\"depth-body\"><h1>c14 深度推导：架构演进顺序、反馈类型与数据飞轮闭环<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清架构与反馈，先往回追五层前提：<\/p>\n<ol><li>\n<strong>先确认最简链路是否跑通<\/strong>：模型能收到查询并返回响应，是后续所有组件的底座；底座未验证就叠加分层，故障定位混乱。\n<\/li><li>\n<strong>按风险与收益排接入顺序<\/strong>：知识缺口先补上上下文增强；内容风险再上防护；治理与性能最后接网关缓存。\n<\/li><li>\n<strong>区分各组件职责<\/strong>：增强补材料、防护拦风险、网关管治理、缓存省重复计算；职责不清会导致组件重复或缺位。\n<\/li><li>\n<strong>反馈先分类再提取<\/strong>：显式表态、隐式行为、对话信号口径不同；提取规则按信号类型设计。\n<\/li><li>\n<strong>确认反馈回流路径<\/strong>：反馈要进入评估、个性化与下一轮数据策展，停留在日志等于没有收集。\n<\/ol>\n<p>依赖链方向：最简架构 → 上下文增强 → 防护 → 网关与缓存 → 反馈收集提取 → 回流改进模型产品 → 数据飞轮。<\/p>\n<h2>正向推导：从最简链路到闭环系统<\/h2>\n<h3>第一步：最简架构<\/h3>\n<p>应用接收用户查询，发给模型，返回响应；无外部数据源、无工具、无防护层（PDF 第 462 页）。这一形态验证最基本的价值假设：模型响应能否被用户接受。组件少、延迟低、故障点少，但知识固定在参数里，风险直接暴露。<\/p>\n<h3>第二步：上下文增强接入<\/h3>\n<p>接入外部数据源与工具：RAG 检索私有文档，工具调用查询天气、数据库、业务系统。检索块与工具输出作为材料进入提示词（c09、c10）。增强解决「模型看不到新材料」的问题；组件输出质量按检索精度召回与工具故障分类单独评估。<\/p>\n<h3>第三步：防护层接入<\/h3>\n<p>输入防护检查越界输入、敏感信息、注入尝试；输出防护检查违规、失实与泄露风险。原书指出，员工可能把公司机密、用户隐私贴进提示词发给第三方 API，内部政策也可能被写进系统提示词；未经检测与掩码，风险随外部调用直接暴露（PDF 第 464 页）。防护是独立于提示约束的一层：提示词可被诱导绕过，检测层需要独立判定。<\/p>\n<h3>第四步：网关与缓存<\/h3>\n<p>网关集中处理访问控制、成本管理、限流与故障回退：不同模型与渠道的路由、配额、超时降级都在网关收口。缓存分两类：精确缓存要求查询完全一致才命中；语义缓存按嵌入相似度判断，语义相似即命中，覆盖更广但依赖嵌入质量与相似度阈值，阈值过松会误命中（PDF 第 473–476 页）。提示词缓存复用相同前缀的计算与 KV 状态，与服务层优化（c13）衔接。<\/p>\n<h3>第五步：反馈类型与提取<\/h3>\n<p>显式反馈：点赞点踩、星级评分、主动询问是否有帮助；样本量小但口径清楚。隐式反馈：购买、停留时长、重新表述、提前终止、复制转发等行为；样本量大，需结合场景解释。对话自然语言反馈可提取：提前终止说明回答不完整或不相关；错误修正暴露模型误解；重新表述指出理解偏差；追问细节反映方向被部分接受（PDF 第 489 页前后）。<\/p>\n<h3>第六步：反馈使用与飞轮<\/h3>\n<p>反馈用于三类用途：评估模型与提示词版本；开发个性化体验；沉淀下一轮训练数据。专有使用数据积累形成竞争壁垒：同类模型能力趋同时，私有场景数据让产品更贴合用户。反馈即用户数据，收集与使用同样遵守隐私与许可边界（PDF 第 487、493 页）。飞轮闭环：上线 → 收集反馈 → 评估与改进 → 产品更好 → 更多用户与数据。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：架构组件延迟叠加<\/h3>\n<p>最简链路延迟 = 模型推理延迟。加检索后加一次查询耗时；加防护输入输出各一次检测；加网关路由与缓存查询。每层都有固定开销；高并发架构必须按组件测延迟，定位哪一层占比最高。<\/p>\n<h3>算例 2：缓存命中率收益<\/h3>\n<p>相同系统提示与高频问题重复出现，缓存命中率 40% 时，命中请求免去对应预填充与推理；未命中部分仍走完整链路。命中率随内容重复度上升；语义缓存误命中会返回错误相似答案，阈值与审核要配套。<\/p>\n<h3>算例 3：反馈样本结构<\/h3>\n<p>1 万次对话：点赞点踩 300 条（显式，3%）；行为信号覆盖全部会话（隐式）；自然语言修正与重述约 500 条。显式样本少但确定，隐式样本多但需解释；评估集应同时纳入两类信号，避免只依据 3% 的表态判断质量。<\/p>\n<h3>算例 4：防护拦截口径<\/h3>\n<p>输入侧拦截：越界话题、机密片段、注入指令；输出侧拦截：违规表述、敏感泄露、无依据断言。拦截记录进入评估集，回看误拦与漏拦；防护规则随新风险类型更新。<\/p>\n<h3>算例 5：反馈到数据策展<\/h3>\n<p>被点踩或被修正的对话经审核后，可进入偏好数据集：正确响应作为胜出，原响应作为落败；这一路径把 c14 反馈与 c12 数据获取、c06 比较评估接成闭环。未审核反馈不直接进训练集，防止噪声固化。<\/p>\n<h3>算例 6：网关治理账<\/h3>\n<p>多模型渠道下，网关按成本、延迟、质量路由；配额超限降级到备用模型；限流保护后端。故障回退把超时、错误转成兜底应答，而不是让用户面对空响应。网关是治理收口，不是业务逻辑层。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>最简链路未验证就叠架构<\/strong>：基础响应不达标时，检索、防护、缓存各自的效果无法评估；先跑通最简价值假设再加层。\n<\/li><li>\n<strong>防护只写在系统提示词里<\/strong>：提示约束可被诱导绕过，机密与隐私风险没有独立拦截；防护必须有检测层。\n<\/li><li>\n<strong>缓存追求语义覆盖放低阈值<\/strong>：相似但不同义的问题被错误命中，返回答案偏差；误命中代价高于未命中，阈值要按场景收紧。\n<\/li><li>\n<strong>反馈只存日志不回流<\/strong>：改进缺少私有数据来源，模型与提示词迭代停留在公开基准；飞轮断在第一环。\n<\/li><li>\n<strong>隐式行为直接当评价结论<\/strong>：一次停留短可能是回答快，也可能是没看懂；行为信号要与显式反馈、对话内容交叉解释。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ol><li>\n最简架构包含哪些环节？缺哪两类保护？\n<\/li><li>\n上下文增强与防护各解决什么问题？\n<\/li><li>\n精确缓存与语义缓存的命中条件各是什么？\n<\/li><li>\n显式反馈与隐式反馈各有哪些例子？\n<\/li><li>\n反馈数据在进入训练集前需要什么处理？\n<\/ol>\n<h2>补充推演：边界案例与常见疑问<\/h2>\n<h3>案例 A：组件堆叠的延迟与故障代价<\/h3>\n<p>每加一层组件都有固定开销与故障点；架构不是组件越多越好。接入顺序按风险与收益：先验证基本价值，再补知识缺口，再拦内容风险，最后做治理与缓存。每层上线前单独评估效果，避免为堆架构而增加链路长度。<\/p>\n<h3>案例 B：防护与提示约束的位置差别<\/h3>\n<p>提示词约束可被诱导绕过，系统提示词里的内部政策也可能随泄露路径暴露；输入输出防护是独立检测层，核对越界话题、敏感信息与违规表述。提示层与防护层不可互相替代：前者引导行为，后者拦截风险。<\/p>\n<h3>案例 C：两类缓存的误命中边界<\/h3>\n<p>精
