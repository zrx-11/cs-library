确缓存要求查询完全一致，命中确定；语义缓存按嵌入相似度判断，覆盖更广但阈值过松会把相似不同义的问题错误命中。误命中代价高于未命中，语义缓存阈值要按场景收紧，并保留未命中回退路径。<\/p>\n<h3>案例 D：反馈信号的交叉解释<\/h3>\n<p>隐式行为是推断信号：停留短可能是回答快，也可能是没看懂；一次复制可能是认可，也可能是要转给他人。行为信号要与显式反馈、对话内容交叉解释，不能单凭一次点击下结论。显式样本少但口径清，隐式样本多但需解释，两类配合使用。<\/p>\n<h3>案例 E：反馈回流的审核位置<\/h3>\n<p>被点踩或被修正的对话经审核后进入偏好数据集：正确响应胜出，原响应落败。未审核反馈不直接进训练集，防止噪声固化；反馈即用户数据，收集使用遵守隐私与许可边界。回流路径是 c14 反馈 → c12 数据策展 → c02/c11 训练适配。<\/p>\n<h3>案例 F：飞轮的闭环条件<\/h3>\n<p>产品上线后收集使用与反馈，改进模型与产品，再吸引更多用户与数据；专有使用数据在同类模型能力趋同时构成壁垒。飞轮断开的常见位置是数据停留在日志不回流，以及反馈不进入评估与下一轮策展。闭环要求反馈可提取、可审核、可回到训练与评估环节。<\/p>\n<h3>案例 G：架构组件检查<\/h3>\n<p>最简链路是否先跑通；上下文增强是否接入检索与工具；防护是否独立于提示约束；网关是否收口访问、成本、限流与回退；缓存命中条件与阈值是否明确；反馈是否可提取、审核并回流。每层组件单独评估效果，故障点与延迟开销计入架构设计。<\/p>\n<h3>案例 K：反馈与架构的闭环位置<\/h3>\n<p>反馈收集在产品入口，提取与审核在数据环节，回流到评估与训练；架构组件为这条闭环服务。脱离反馈闭环的架构只是演示链路，无法支撑产品长期迭代。<\/p>\n<h3>案例 L：网关治理与组件回退<\/h3>\n<p>网关收口访问控制、成本配额、限流与故障回退；超时或错误转兜底应答，不让用户面对空响应。缓存复用重复前缀与高频查询，命中比例随内容重复度上升。每个组件上线前单独评估效果，链路延迟与故障点计入架构取舍。<\/p>\n<h3>案例 M：反馈类型的提取路径<\/h3>\n<p>显式反馈直接记录评分与表态；隐式反馈从购买、停留、重述、终止等行为推断；对话信号从自然语言中提取提前终止、错误修正、重新表述。三类信号口径不同，交叉解释后再进入评估与个性化。反馈数据未审核不直接进训练集，防止噪声固化；隐私与许可边界在收集环节就划定。<\/p>\n<h3>案例 N：架构演进与组件责任<\/h3>\n<p>最简链路验证基本价值；上下文增强补知识与工具；防护独立拦截输入输出风险；网关收口访问、成本、限流与回退；缓存复用重复计算。每层组件单独评估效果，延迟开销与故障点计入取舍。专有使用数据在同类模型能力趋同时构成壁垒，闭环要求反馈可提取、可审核、可回到训练与评估环节。<\/p>\n<h3>案例 M：闭环评估指标<\/h3>\n<p>架构上线后分别记录检索命中、防护拦截、缓存命中与反馈回流比例；每个组件的收益用对应指标核对。反馈闭环断开的早期信号是日志有记录但评估集与训练集未更新，需要在数据流程上固定回流路径。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n架构接入顺序为什么先增强、再防护、后网关缓存？\n<\/li><li>\n网关承担哪些治理职责？与防护层怎么分工？\n<\/li><li>\n自然语言对话里的提前终止、错误修正、重新表述各暴露什么问题？\n<\/li><li>\n专有使用数据为什么构成竞争壁垒？\n<\/li><li>\n反馈回流到评估、个性化、训练数据各经过什么环节？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "AI 工程架构与反馈循环：上下文增强、防护、网关缓存、显式与隐式反馈"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：应用入门与模型原理：AI 工程兴起、基础模型训练流程、采样与概率生成<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1–2 章：基于基础模型构建 AI 应用入门与理解基础模型<\/a><br>检查点：能区分传统 ML 工程与 AI 工程的技术栈分层，说清预训练—监督微调—偏好微调的分工；由 logit、温度与 softmax 推出概率分布如何随温度变化，解释不一致性与幻觉的概率根源<\/li><li class='path-step' id='path-02'><strong>步骤 02：评估：语言建模指标、精确与主观评估、裁判模型、评估标准与流水线<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 3–4 章：评估方法论与评估 AI 系统<\/a><br>检查点：能由熵与 KL 散度推出交叉熵和困惑度的关系；说清功能正确性与 pass@k 的口径，比较词项相似度、语义相似度与 AI 裁判的适用边界；按组件层级、评分指南、方法数据三步设计评估流水线<\/li><li class='path-step' id='path-03'><strong>步骤 03：上下文适配：提示工程、RAG 检索增强、智能体工具规划与记忆<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 5–6 章：提示工程、RAG 与智能体<\/a><br>检查点：能区分系统提示词与用户提示词、零样本与少样本；画出 RAG 检索器—生成器架构，由精度召回定义推 top-k 与分块大小的权衡；按错误累积率推演多步智能体的成功率，并列出规划、工具、效率三类故障<\/li><li class='path-step' id='path-04'><strong>步骤 04：权重适配与工程落地：微调决策、数据集工程、推理优化、架构与反馈循环<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 7–10 章：微调、数据集工程、推理优化与 AI 工程架构<\/a><br>检查点：能依据数据、硬件、专业人才判断是否微调；用参数量×位宽×系数估算推理与训练显存；从 TTFT、TPOT、吞吐量、MBU 推出批处理与解耦的权衡；讲清架构从最简链路到上下文增强、防护、网关缓存的演进，以及显式与隐式反馈如何回流成数据飞轮<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='基础模型（foundation model）'>基础模型（foundation model） — 在大规模数据上预训练、可被适配到多种下游任务的模型，本书涵盖大语言模型（LLM）与多模态大模型（LMM）（原书第 1 章，PDF 第 24 页） <span class=glossary-ref>（第 1–2 章：基于基础模型构建 AI 应用入门与理解基础模型）<\/span><\/li><li data-term='模型即服务（maas, model as a service）'>模型即服务（MaaS, model as a service） — 由少数组织训练大模型并以服务形式提供给其他开发者使用，应用方无须提前投入资源自行开发模型（原书 1.1 节，PDF 第 24 页） <span class=glossary-ref>（第 1–2 章：基于基础模型构建 AI 应用入门与理解基础模型）<\/span><\/li><li data-term='监督微调（sft, supervised finetuning）'>监督微调（SFT, supervised finetuning） — 用（提示词，响应）格式的示范数据进一步训练预训练模型，使其学会以对话方式恰当响应，又称行为克隆（原书 2.3.1 节，PDF 第 102 页） <span class=glossary-ref>（第 1–2 章：基于基础模型构建 AI 应用入门与理解基础模型）<\/span><\/li><li data-term='偏好微调（preference finetuning）'>偏好微调（preference finetuning） — 在监督微调之上进一步对齐人类偏好的步骤，技术路线包括 RLHF、DPO、RLAIF 等（原书 2.3 节，PDF 第 100 页） <span class=glossary-ref>（第 1–2 章：基于基础模型构建 AI 应用入门与理解基础模型）<\/span><\/li><li data-term='温度（temperature）'>温度（temperature） — 在 softmax 之前对 logit 做除法缩放的常数；温度越高概率分布越平、输出越多样，温度越低分布越尖、输出越一致（原书 2.4.2 节，PDF 第 112 页） <span class=glossary-ref>（第 1–2 章：基于基础模型构建 AI 应用入门与理解基础模型）<\/span><\/li><li data-term='幻觉（hallucination）'>幻觉（hallucination） — 模型给出缺乏事实依据的响应；两种主要假设分别为自我欺骗（分不清输入与自身生成内容）和内部知识与标注员知识不匹配（原书 2.4.5 节，PDF 第 128–130 页） <span class=glossary-ref>（第 1–2 章：基于基础模型构建 AI 应用入门与理解基础模型）<\/span><\/li><li data-term='困惑度（ppl, perplexity）'>困惑度（PPL, perplexity） — 熵或交叉熵的指数形式，衡量模型预测下一个 token 时的不确定程度；值越低预测越准（原书 3.2.4 节，PDF 第 143 页） <span class=glossary-ref>（第 3–4 章：评估方法论与评估 AI 系统）<\/span><\/li><li data-term='功能正确性（functional correctness）'>功能正确性（functional correctness） — 按系统是否实现预期功能来评估；代码生成场景中可由单元测试自动判定，对应执行准确性与 pass@k（原书 3.3.1 节，PDF 第 147 页） <span class=glossary-ref>（第 3–4 章：评估方法论与评估 AI 系统）<\/span><\/li><li data-term='ai 当裁判（ai as a judge）'>AI 当裁判（AI as a Judge） — 用一个 AI 模型评估另一个 AI 模型输出的方法，可独立评分、对照参考或成对比较；速度快、成本低、无须参考数据，但受裁判模型与提示词偏差影响（原书 3.4 节，PDF 第 158 页） <span class=glossary-ref>（第 3–4 章：评估方法论与评估 AI 系统）<\/span><\/li><li data-term='上下文学习（in-context learning）'>上下文学习（in-context learning） — 仅凭提示词中的示例引导模型执行任务而不更新权重；无示例为零样本，有 $k$ 个示例为 $k$-shot 少样本（原书 5.1.1 节，PDF 第 232 页） <span class=glossary-ref>（第 5–6 章：提示工程、RAG 与智能体）<\/span><\/li><li data-term='rag（检索增强生成）'>RAG（检索增强生成） — 先从外部记忆源检索与查询相关的信息块，再把检索结果交给生成器产生响应的模式；系统由检索器与生成器两个组件构成（原书 6.1 节，PDF 第 273–275 页） <span class=glossary-ref>（第 5–6 章：提示工程、RAG 与智能体）<\/span><\/li><li data-term='上下文精度与上下文召回率'>上下文精度与上下文召回率 — 精度为检索到的文档中相关文档所占百分比；召回率为所有相关文档中被检索到的百分比（原书 6.1.2 节，PDF 第 283 页） <span class=glossary-ref>（第 5–6 章：提示工程、RAG 与智能体）<\/span><\/li><li data-term='智能体（agent）'>智能体（agent） — 能够感知环境并通过工具作用于环境的事物；AI 智能体以模型为大脑，规划动作序列并判断任务是否完成（原书 6.2.1 节，PDF 第 296 页） <span class=glossary-ref>（第 5–6 章：提示工程、RAG 与智能体）<\/span><\/li><li data-term='peft（参数高效微调）'>PEFT（参数高效微调） — 用比全量微调少几个数量级的可训练参数达到接近全量微调性能的一类方法，包括适配器、LoRA、软提示等路线（原书 7.4.1 节，PDF 第 352–353 页） <span class=glossary-ref>（第 7–10 章：微调、数据集工程、推理优化与 AI 工程架构）<\/span><\/li><li data-term='ttft 与 tpot'>TTFT 与 TPOT — TTFT 为首个 token 生成时间，对应预填充阶段；TPOT 为每个输出 token 的平均生成时间；整体延迟 = TTFT + TPOT × 输出 token 数（原书 9.1.2 节，PDF 第 426 页） <span class=glossary-ref>（第 7–10 章：微调、数据集工程、推理优化与 AI 工程架构）<\/span><\/li><li data-term='数据飞轮（data flywheel）'>数据飞轮（data flywheel） — 产品上线后收集使用与反馈数据，回流改进模型与产品，再吸引更多用户与数据的循环；专有使用数据构成竞争壁垒（原书 10.2 节，PDF 第 487 页） <span class=glossary-ref>（第 7–10 章：微调、数据集工程、推理优化与 AI 工程架构）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库：大模型应用工程中的可复用套路<\/h1>\n<blockquote>从《AI工程：大模型应用开发实战》中抽出的反复出现的工程模式。每个模式给出触发场景、操作步骤、常见陷阱、变式与相邻概念。<\/blockquote>\n<h2>模式 1：先评估后构建<\/h2>\n<p><strong>触发场景<\/strong>：新项目要判断 AI 应用是否值得做、用哪个模型；团队准备直接搭演示产品。<\/p>\n<p><strong>步骤<\/strong>：<\/p>\n<ol><li>\n先定义「好响应」的标准：领域能力、生成能力、指令遵循、成本延迟四类。\n<\/li><li>\n把标准转成可执行或可比较的评估口径，配示例与评分指南。\n<\/li><li>\n再做提示词、检索或模型实验；改动版本对照评估集。\n<\/li><li>\n生产上线后持续监控，反馈回流修订指南。\n<\/ol>\n<p><strong>陷阱<\/strong>：跳过评估直接上线，已部署但无法评估的应用维护成本持续、下线成本更高；只追容易衡量的指标，漏掉难评估但有价值的方向。<\/p>\n<p><strong>变式<\/strong>：测试驱动开发对应到 AI 场景即评估驱动开发；模型选择工作流把硬属性剔除放在软属性实验之前。<\/p>\n<p><strong>联系<\/strong>：c07、c06、c05。<\/p>\n<h2>模式 2：不动权重优先，权重适配在后<\/h2>\n<p><strong>触发场景<\/strong>：模型输出不满足任务要求，考虑要不要微调。<\/p>\n<p><strong>步骤<\/strong>：<\/p>\n<ol><li>\n先系统化提示工程：明确指令、示例、格式、上下文、子任务拆分。\n<\/li><li>\n再补上下文：检索私有材料、接入工具。\n<\/li><li>\n对照评估集确认仍不达标，才准备微调数据与硬件。\n<\/li><li>\n微调前后回归通用能力，防止单任务适配损害其他场景。\n<\/ol>\n<p><strong>陷阱<\/strong>：把微调当默认解；数据、评估、训练知识未就位就启动权重训练；忽略基座升级后的重对齐成本。<\/p>\n<p><strong>变式<\/strong>：PEFT 冻结主干只训小模块；多任务场景用模型合并替代逐任务部署。<\/p>\n<p><strong>联系<\/strong>：c08、c09、c11、c12。<\/p>\n<h2>模式 3：检索—生成两段分离评估<\/h2>\n<p><strong>触发场景<\/strong>：RAG 回答出错，需要定位是材料没取到还是材料没用好。<\/p>\n<p><strong>步骤<\/strong>：<\/p>\n<ol><li>\n先查检索集合是否含答案条款；不含则问题在检索器。\n<\/li><li>\n检索块内含答案而回答未用，问题在生成提示或忠实性。\n<\/li><li>\n检索侧调分块、嵌入、查询重写与重排序；生成侧调提示词与输出约束。\n<\/li><li>\n精度召回与排序指标分别记录，不混在端到端分数里。\n<\/ol>\n<p><strong>陷阱<\/strong>：只看端到端成败，中间故障被黑箱掩盖；top-k 放大只追召回，带入无关上下文污染生成。<\/p>\n<p><strong>变式<\/strong>：混合检索先词项粗筛、嵌入精排；RRF 融合多检索器排名。<\/p>\n<p><strong>联系<\/strong>：c09、c05、c07。<\/p>\n<h2>模式 4：多步链条按单步可靠性算账<\/h2>\n<p><strong>触发场景<\/strong>：智能体或多步流水线任务步骤多，整体成功率不明。<\/p>\n<p><strong>步骤<\/strong>：<\/p>\n<ol><li>\n估计每步成功率 <span class=\"katex-inline\">p<\/span>，按 <span class=\"katex-inline\">P(n)=p^n<\/span> 推整体成功率。\n<\/li><li>\n优先缩短链条、合并子任务，再换更强模型。\n<\/li><li>\n关键节点加客观校验（测试断言、工具返回核对），对冲反思错误。\n<\/li><li>\n故障按规划、工具、效率三类记录，数据集带（任务，工具清单）。\n<\/ol>\n<p><strong>陷阱<\/strong>：步骤越多越依赖单步质量，长链条上 4 个百分点的单步差距被放大成数十个百分点；高风险写入动作缺少确认与回退。<\/p>\n<p><strong>变式<\/strong>：只读工具偏差可下次纠正，写入工具错误直接留外部状态，确认等级不同。<\/p>\n<p><strong>联系<\/strong>：c10、c13、c14。<\/p>\n<h2>模式 5：资源估算先分推理与训练<\/h2>\n<p><strong>触发场景<\/strong>：选硬件、估成本、判断模型能否在目标设备运行。<\/p>\n<p><strong>步骤<\/strong>：<\/p>\n<ol><li>\n推理内存按 <span class=\"katex-inline\">N\\times M\\times1.2<\/span> 估算权重与激活/KV。\n<\/li><li>\n训练再加梯度与优化器状态：Adam 每可训练参数 3 个值。\n<\/li><li>\n位宽选择同时看显存与带宽；压缩后回归质量评估。\n<\/li><li>\n长上下文大批量单独核算激活值，必要时用梯度检查点换内存。\n<\/ol>\n<p><strong>陷阱<\/strong>：把训练显存按推理口径算；忽略激活值在大批次下超过权重；只算首次训练，漏掉维护与重对齐。<\/p>\n<p><strong>变式<\/strong>：PEFT 压缩可训练参数项；量化压缩权重与带宽；蒸馏用小模型继承大模型行为。<\/p>\n<p><strong>联系<\/strong>：c11、c13、c12。<\/p>\n<h2>模式 6：架构分层接入，反馈闭环回流<\/h2>\n<p><strong>触发场景<\/strong>：产品从演示走向上线，需要组织检索、防护、网关、缓存与反馈收集。<\/p>\n<p><strong>步骤<\/strong>：<\/p>\n<ol><li>\n最简链路跑通基本价值，再按风险收益叠加组件。\n<\/li><li>\n上下文增强补知识与工具，防护层独立拦截输入输出风险。\n<\/li><li>\n网关收口访问、成本、限流与回退；缓存复用重复前缀与高频查询。\n<\/li><li>\n收集显式、隐式与对话信号，提取后进入评估、个性化与下一轮数据策展。\n<\/ol>\n<p><strong>陷阱<\/strong>：组件堆叠增加延迟与故障点；防护只写进提示词被诱导绕过；反馈停留在日志不回流，飞轮断在第一环。<\/p>\n<p><strong>变式<\/strong>：精确缓存按字面命中，语义缓存按嵌入相似度命中；反馈数据未审核不直接进训练集。<\/p>\n<p><strong>联系<\/strong>：c14、c09、c13、c12。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表：AI 工程大模型应用开发实战<\/h1>\n<blockquote>配套《AI工程：大模型应用开发实战》。页码为 PDF 实际页（印刷页 = PDF 页 − 1）。公式中 <span class=\"katex-inline\">N<\/span> 参数量、<span class=\"katex-inline\">M<\/span> 每参数字节数、<span class=\"katex-inline\">L<\/span> 上下文长度、<span class=\"katex-inline\">k<\/span> 候选数。<\/blockquote>\n<h2>1. 全书决策链<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>阶段<\/th><th>核心问题<\/th><th>主要手段<\/th><th>对应概念<\/th><\/tr><\/thead><tbody><tr><td>入门与原理<\/td><td>要不要做、模型怎么生成<\/td><td>三层技术栈、采样机制<\/td><td>c01–c03<\/td><\/tr><tr><td>评估<\/td><td>怎么判好坏<\/td><td>建模指标、功能正确性、AI 裁判、流水线<\/td><td>c04–c07<\/td><\/tr><tr><td>上下文适配<\/td><td>不动权重改善输出<\/td><td>提示工程、RAG、智能体<\/td><td>c08–c10<\/td><\/tr><tr><td>权重与落地<\/td><td>微调、数据、推理、架构<\/td><td>PEFT、数据策展、批处理、反馈闭环<\/td><td>c11–c14<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>2. 后训练两段流程<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>阶段<\/th><th>数据格式<\/th><th>训练信号<\/th><th>目标<\/th><\/tr><\/thead><tbody><tr><td>监督微调 SFT<\/td><td>（指令，响应）<\/td><td>正确响应示范<\/td><td>学会对话式恰当行为<\/td><\/tr><tr><td>偏好微调<\/td><td>（提示词，胜出/落败响应）<\/td><td>成对比较<\/td><td>对齐人类偏好<\/td><\/tr><tr><td>奖励模型<\/td><td>（（指令，响应），分数）<\/td><td>数值打分<\/td><td>为偏好优化提供奖励度量<\/td><\/tr><\/tbody><\/table><\/div>\n<p>资源口径：InstructGPT 后训练约占 2% 计算资源，预训练约 98%（PDF 第 100 页）。<\/p>\n<h2>3. 采样参数对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>参数<\/th><th>作用位置<\/th><th>调大<\/th><th>调小<\/th><\/tr><\/thead><tbody><tr><td>温度 <span class=\"katex-inline\">T<\/span><\/td><td>softmax 前缩放 logit<\/td><td>分布变平、更多样<\/td><td>分布变尖、更一致<\/td><\/tr><tr><td>top-k<\/td><td>裁剪候选集合<\/td><td>候选多、长尾干扰增加<\/td><td>候选少、输出单调<\/td><\/tr><tr><td>top-p<\/td><td>按累计概率动态圈定<\/td><td>集合随上下文自适应<\/td><td>同左，<span class=\"katex-inline\">p<\/span> 小则集合收窄<\/td><\/tr><\/tbody><\/table><\/div>\n<p>概率比值：<span class=\"katex-inline\">\\frac{p_i}{p_j}=\\exp((z_i-z_j)/T)<\/span>。<span class=\"katex-inline\">T\\to0<\/span> 退化为 argmax。<\/p>\n<h2>4. 评估指标速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>指标<\/th><th>口径<\/th><th>适用任务<\/th><th>局限<\/th><\/tr><\/thead><tbody><tr><td>交叉熵/困惑度<\/td><td>预测下一个 token 的难度<\/td><td>建模质量<\/td><td>不等价下游任务表现<\/td><\/tr><tr><td>功能正确性<\/td><td>断言是否通过<\/td><td>代码、SQL 等可执行任务<\/td><td>开放式生成难自动化<\/td><\/tr><tr><td>pass@k<\/td><td><span class=\"katex-inline\">k<\/span> 个样本至少一个通过<\/td><td>代码采样评估<\/td><td><span class=\"katex-inline\">k<\/span> 增大只增加尝试机会<\/td><\/tr><tr><td>词汇相似度<\/td><td>表面形式重叠<\/td><td>改写、翻译粗评<\/td><td>多义词失效<\/td><\/tr><tr><td>语义相似度<\/td><td>嵌入空间距离<\/td><td>检索、相关性<\/td><td>依赖嵌入模型质量<\/td><\/tr><tr><td>AI 裁判<\/td><td>模型评模型<\/td><td>开放式批量评估<\/td><td>概率性、顺序/长度/自我偏好偏差<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. RAG 检索权衡<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>变量<\/th><th>放大<\/th><th>缩小<\/th><\/tr><\/thead><tbody><tr><td>top-k<\/td><td>召回上升，精度可能下降，污染与成本上升<\/td><td>上下文干净，漏检增加<\/td><\/tr><tr><td>分块大小<\/td><td>语义完整，主题混杂<\/td><td>覆盖广，边界截断<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>\n精度 <span class=\"katex-inline\">P=r/k<\/span>；召回率 <span class=\"katex-inline\">R_{\\mathrm{call}}=r/R<\/span>。\n<\/li><li>\n词项检索：TF-IDF、BM25，字面重叠、可解释。\n<\/li><li>\n嵌入检索：稠密向量语义匹配，对改写鲁棒。\n<\/li><li>\n融合：RRF 按排名求和，不合并原始分数。\n<\/ul>\n<h2>6. 智能体故障分类<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>类别<\/th><th>条目<\/th><\/tr><\/thead><tbody><tr><td>规划故障<\/td><td>无效工具、参数无效、参数值错误、目标失败、反思错误<\/td><\/tr><tr><td>工具故障<\/td><td>工具输出错误、缺正确工具<\/td><\/tr><tr><td>效率故障<\/td><td>步数偏多、成本偏高、单步耗时偏长<\/td><\/tr><\/tbody><\/table><\/div>\n<p>多步成功率：<span class=\"katex-inline\">P(n)=p^n<\/span>。<span class=\"katex-inline\">p=0.95<\/span> 时 10 步约 0.599，100 步约 0.0059。<\/p>\n<h2>7. 显存与成本估算<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>阶段<\/th><th>构成<\/th><th>估算口径<\/th><\/tr><\/thead><tbody><tr><td>推理<\/td><td>权重 + 激活/KV<\/td><td><span class=\"katex-inline\">N\\times M\\times1.2<\/span><\/td><\/tr><tr><td>训练<\/td><td>权重 + 梯度 + 优化器状态 + 激活<\/td><td>Adam 每可训练参数 3 个值<\/td><\/tr><tr><td>位宽<\/td><td>FP32=4B，FP16/BF16=2B，INT8=1B，INT4≈0.5B<\/td><td>位宽减半压缩权重与带宽<\/td><\/tr><\/tbody><\/table><\/div>\n<p>算例：130 亿参数 FP32 权重 52 GB；FP16 权重 26 GB。70 亿参数全量微调 FP16 合计约 56 GB（PDF 第 339、351 页）。<\/p>\n<h2>8. 推理指标<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>指标<\/th><th>定义<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>TTFT<\/td><td>首个 token 时间<\/td><td>预填充阶段<\/td><\/tr><tr><td>TPOT<\/td><td>每个输出 token 平均耗时<\/td><td>解码阶段<\/td><\/tr><tr><td>整体延迟<\/td><td><span class=\"katex-inline\">\\mathrm{TTFT}+\\mathrm{TPOT}\\times<\/span> 输出 token 数<\/td><td>看 p90/p95/p99 尾部<\/td><\/tr><tr><td>吞吐量<\/td><td>TPS 或 RPS/RPM<\/td><td>goodput 只计达标请求<\/td><\/tr><tr><td>MFU<\/td><td>实际/峰值 FLOP 利用率<\/td><td>算力利用<\/td><\/tr><tr><td>MBU<\/td><td>实际/理论带宽利用率<\/td><td>解码阶段更贴近瓶颈<\/td><\/tr><\/tbody><\/table><\/div>\n<p>带宽用量 <span class=\"katex-inline\">=N\\times M\\times\\mathrm{TPS}<\/span>。批处理三档：静态、动态、连续；预填充与解码可解耦调度。<\/p>\n<h2>9. 微调决策核对表<\/h2>\n<ul><li>\n提示词与上下文是否已充分验证？\n<\/li><li>\n是否有足量高质量任务数据与评估集？\n<\/li><li>\n单任务微调是否损害通用能力？\n<\/li><li>\n训练硬件是否在显存范围内（含激活值）？\n<\/li><li>\n基座升级后重对齐与维护成本是否计入？\n<\/li><li>\n缺知识的场景是否应走检索而非微调？\n<\/ul>\n<h2>10. 反馈类型<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>类型<\/th><th>例子<\/th><th>特点<\/th><\/tr><\/thead><tbody><tr><td>显式反馈<\/td><td>点赞点踩、评分、主动询问<\/td><td>口径清、样本少<\/td><\/tr><tr><td>隐式反馈<\/td><td>购买、停留、重述、提前终止<\/td><td>样本多、需解释<\/td><\/tr><tr><td>对话信号<\/td><td>错误修正、重新表述、追问<\/td><td>富语义，需提取规则<\/td><\/tr><\/tbody><\/table><\/div>\n<p>反馈用途：评估模型版本、个性化、沉淀下一轮训练数据；使用前遵守隐私与许可。<\/p>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/AI工程大模型应用开发实战-14", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1–2 章：基于基础模型构建 AI 应用入门与理解基础模型", "href": "#/chapter/ch01"}, {"label": "第 3–4 章：评估方法论与评估 AI 系统", "href": "#/chapter/ch02"}, {"label": "第 5–6 章：提示工程、RAG 与智能体", "href": "#/chapter/ch03"}, {"label": "第 7–10 章：微调、数据集工程、推理优化与 AI 工程架构", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "基础模型、MaaS 与 AI 工程技术栈三层：应用开发、模型开发与基础设施", "href": "#/concept/c01"}, {"label": "预训练、监督微调与偏好微调：后训练对齐的两段流程", "href": "#/concept/c02"}, {"label": "采样与概率生成：温度、top-k、top-p 与不一致性、幻觉的概率根源", "href": "#/concept/c03"}, {"label": "语言建模指标：熵、交叉熵、困惑度与 BPC/BPB", "href": "#/concept/c04"}, {"label": "精确评估：功能正确性、pass@k 与基于参考的相似度度量", "href": "#/concept/c05"}, {"label": "AI 当裁判与比较评估：单评、对照、成对排名及其偏差局限", "href": "#/concept/c06"}, {"label": "评估标准、模型选择工作流与评估流水线：硬属性、软属性与分层评估", "href": "#/concept/c07"}, {"label": "提示工程与上下文学习：零样本/少样本、系统与用户提示、上下文效率", "href": "#/concept/c08"}, {"label": "RAG：检索—生成架构、词项与嵌入检索、精度召回与重排序", "href": "#/concept/c09"}, {"label": "智能体：环境—工具—规划、错误累积、故障模式与记忆机制", "href": "#/concept/c10"}, {"label": "微调决策与内存瓶颈：何时微调、可训练参数、显存估算、PEFT 与模型合并", "href": "#/concept/c11"}, {"label": "数据集工程：质量、覆盖度、数据量、数据合成与检查去重过滤", "href": "#/concept/c12"}, {"label": "推理优化：延迟/吞吐/利用率、预填充与解码瓶颈、批处理与成本估算", "href": "#/concept/c13"}, {"label": "AI 工程架构与反馈循环：上下文增强、防护、网关缓存、显式与隐式反馈", "href": "#/concept/c14"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1–2 章：基于基础模型构建 AI 应用入门与理解基础模型", "href": "#/quiz/ch01"}, {"label": "测验：第 3–4 章：评估方法论与评估 AI 系统", "href": "#/quiz/ch02"}, {"label": "测验：第 5–6 章：提示工程、RAG 与智能体", "href": "#/quiz/ch03"}, {"label": "测验：第 7–10 章：微调、数据集工程、推理优化与 AI 工程架构", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.24<\/div><h1>第 1–2 章：基于基础模型构建 AI 应用入门与理解基础模型<\/h1>\n<blockquote>对应原书第 1 章「基于基础模型构建 AI 应用入门」、第 2 章「理解基础模型」（PDF 第 24–133 页；印刷页 = PDF 页 − 1）。本章先回答「要不要做、AI 在产品里扮演什么角色」，再进入模型内部：训练数据、架构与规模、后训练对齐、采样生成机制，以及概率性带来的不一致性与幻觉。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 AI 工程与传统 ML 工程的分工差别，把一个 AI 应用落到应用开发层、模型开发层、基础设施层三层技术栈上；\n<\/li><li>\n区分预训练、监督微调、偏好微调各自优化的目标，解释后训练为什么消耗资源远少于预训练；\n<\/li><li>\n写出 logit 经 softmax 转概率的过程，沿温度 <span class=\"katex-inline\">T<\/span>、top-k、top-p 推出采样多样性与可预测性的变化方向；\n<\/li><li>\n用概率特性解释不一致性与幻觉的来源，列出缓解不一致性的可操作手段，并说明两类幻觉假设的分工。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>基础模型是在海量数据上预训练、再经后训练对齐到人类偏好的现成能力体；AI 工程是在它之上用提示词、上下文、工具和权重适配构建产品的过程；模型逐 token 按概率分布采样输出，这一机制同时解释了它的创造性、不一致性和幻觉风险。 本章包含两条完整推导：先把变量与依据逐步展开，再沿链条推演条件变化，并在反事实环节推演去掉条件后的结果。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：基础模型、MaaS 与技术栈三层（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。2020 年后 AI 的关键词是规模：模型变大后能力增强，催生更多应用；而训练大模型所需的数据、算力与人才只有少数组织负担得起，于是模型即服务（MaaS）兴起，模型以服务形式提供给应用方使用（PDF 第 24 页）。原书把 AI 应用的工程技术栈分为三层：应用开发层负责设计提示词、提供上下文与界面；模型开发层提供建模、训练、微调和推理优化框架，并包含数据集工程；基础设施层负责模型服务、数据与计算管理、监控（PDF 第 59 页）。开发应用通常从最上层开始，根据需要再向下推进。<\/p>\n<h3>2. 概念 2：预训练、监督微调与偏好微调（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。预训练用自监督方式从互联网数据中学文本补全，说话方式更像网页而非人类，且可能带有粗鲁或错误内容。后训练一般分两步：监督微调用（提示词，响应）示范数据让模型学会对话式恰当响应；偏好微调再用 RLHF、DPO、RLAIF 等技术让输出符合人类偏好（PDF 第 99–100 页）。预训练优化的是 token 级别的下一个 token 预测质量，用户关心的却是整条响应的整体质量；后训练相当于解锁预训练模型已具备但仅凭提示词难以访问的能力。原书给出资源口径：InstructGPT 的计算资源中只有 2% 用于后训练，98% 用于预训练（PDF 第 100 页）。<\/p>\n<h3>3. 概念 3：采样与概率生成（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。给定输入，神经网络先输出一个 logit 向量，每个 logit 对应词表中的一个 token；logit 本身不是概率，总和不为 1 且可为负，经 softmax 才转成非负、和为 1 的概率分布（PDF 第 111 页）。温度在 softmax 之前把 logit 除以常数 <span class=\"katex-inline\">T<\/span>：<span class=\"katex-inline\">T<\/span> 越大分布越平，常见 token 概率被压低、稀有 token 有机会出现；<span class=\"katex-inline\">T<\/span> 越小分布越尖，输出越一致也越单调（PDF 第 112 页）。top-k 只保留概率最高的 <span class=\"katex-inline\">k<\/span> 个候选再做 softmax；top-p（核采样）按概率从高到低累加，直到累计概率达到 <span class=\"katex-inline\">p<\/span>，候选数量随上下文动态变化（PDF 第 115–116 页）。<\/p>\n<p>概率性带来两类问题：不一致性是相同或略不同的输入给出差异很大的输出；幻觉是响应缺乏事实依据（PDF 第 126–127 页）。缓解不一致性可缓存答案、固定温度/top-p/top-k、固定随机种子；幻觉的两类假设分别是：模型分不清输入数据与自身生成内容（自我欺骗、滚雪球式幻觉），以及监督数据中使用了标注员掌握而模型不具备的知识（PDF 第 129–130 页）。<\/p>\n<h2>推导一：温度如何改变两个候选 token 的概率<\/h2>\n<p>设模型词表中只有两个候选 A、B，最后一层输出 logit 为 <span class=\"katex-inline\">[1, 2]<\/span>。softmax 把 logit <span class=\"katex-inline\">z_i<\/span> 转成概率 <span class=\"katex-inline\">p_i=\\frac{\\exp(z_i/T)}{\\sum_j \\exp(z_j/T)}<\/span>，其中 <span class=\"katex-inline\">T<\/span> 为温度。<\/p>\n<ul><li>\n<strong><span class=\"katex-inline\">T=1<\/span><\/strong>：<span class=\"katex-inline\">\\exp(1)\\approx2.718<\/span>，<span class=\"katex-inline\">\\exp(2)\\approx7.389<\/span>，分母约 10.107，<span class=\"katex-inline\">p_A\\approx0.27<\/span>，<span class=\"katex-inline\">p_B\\approx0.73<\/span>，选 B 的概率 73%（原书算例，PDF 第 113 页）。\n<\/li><li>\n<strong><span class=\"katex-inline\">T=0.5<\/span><\/strong>：先做除法，调整后 logit 为 <span class=\"katex-inline\">[2, 4]<\/span>，<span class=\"katex-inline\">\\exp(2)\\approx7.389<\/span>，<span class=\"katex-inline\">\\exp(4)\\approx54.598<\/span>，分母约 61.987，<span class=\"katex-inline\">p_A\\approx0.12<\/span>，<span class=\"katex-inline\">p_B\\approx0.88<\/span>，选 B 的概率升到 88%。\n<\/li><li>\n<strong><span class=\"katex-inline\">T\\to 0<\/span><\/strong>：比值 <span class=\"katex-inline\">2/T<\/span> 与 <span class=\"katex-inline\">1/T<\/span> 同时放大，两者差距被拉大，<span class=\"katex-inline\">p_B\\to 1<\/span>；实际产品里温度设 0 时模型直接取 logit 最大的 token，即 argmax，不再做 softmax 采样。\n<\/li><li>\n<strong><span class=\"katex-inline\">T<\/span> 增大<\/strong>：两个调整后 logit 的比值 <span class=\"katex-inline\">2/T<\/span> 与 <span class=\"katex-inline\">1/T<\/span> 都趋向 0，指数都趋向 1，<span class=\"katex-inline\">p_A<\/span>、<span class=\"katex-inline\">p_B<\/span> 趋向 0.5，分布接近均匀。\n<\/ul>\n<p>推导依据：softmax 对 logit 差值做指数放大；除以 <span class=\"katex-inline\">T<\/span> 等价于把差值缩放为原来的 <span class=\"katex-inline\">1/T<\/span>。温度压低时分布变尖，抬高时分布变平。需要创造性的场景通常取一个折中温度，具体取值要在自己的任务上实验确定，原书也提醒模型提供商通常把温度限制在 0 到 2 之间（PDF 第 113 页）。<\/p>\n<h2>推导二：多步对话里的不一致性从哪一步进入系统<\/h2>\n<p>把一次模型响应拆成逐 token 生成。设第 <span class=\"katex-inline\">t<\/span> 个 token 的采样分布为 <span class=\"katex-inline\">P(\\cdot\\mid x_1,\\dots,x_{t-1})<\/span>。每一步都按分布随机抽取，抽到低概率 token 的概率虽低但不为零；一旦某一步抽到偏离事实的 token，下一步的条件分布就建立在「已生成序列」之上。<\/p>\n<p>第一步：模型把自身刚生成的内容与用户输入同等对待（PDF 第 129 页），于是前一步的偏离进入后续上下文。第二步：后续 token 的概率分布以这个偏离序列为条件，错误假设被用来合理化，形成滚雪球式幻觉——原书引用的研究指出，最初一个错误假设甚至会让模型在本来能答对的问题上犯错（PDF 第 130 页）。第三步：相同输入两次运行，随机抽取路径不同，输出就不同；输入仅大小写或换行略有差别，条件分布也可能被扰动到不同分支。<\/p>\n<p>由此推出缓解手段的作用位置：缓存答案消除重复请求的随机性；固定采样变量与随机种子缩小每次运行的波动；提示词与上下文约束（后续第 5、6 章）减少偏离分支的概率。需要注意，固定所有变量也不能保证输出完全一致，因为自托管硬件的数值处理差异也会影响结果，API 提供商的硬件控制权不在应用方手中（PDF 第 128 页）。<\/p>\n<h2>反事实：去掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉后训练，只留预训练模型<\/strong>：模型把文本补全当目标，输入「How to make pizza」会继续补句子而非给出步骤；无差别互联网数据带来的粗鲁、歧视与错误内容没有被对齐处理。监督微调与偏好微调两步分别补上对话行为与人类偏好，去掉任一步，对应缺陷会回到输出里。\n<\/li><li>\n<strong>采样改为永远贪心（argmax）<\/strong>：每个位置都取概率最高的 token，输出一致但枯燥，创造性任务里退化成「总是用最常见的词回答」；而纯随机采样又会让连贯性崩塌。温度与 top-p 正是在这两个极端之间调节分布。\n<\/li><li>\n<strong>假设模型能完全区分输入与自身生成内容<\/strong>：自我欺骗类幻觉的前提被拿掉，模型就不会把刚生成的错误句子当事实继续扩展；现实中这一区分能力正是缓解手段（强化学习区分观察与动作、监督学习加入事实与反事实信号）试图补上的缺口（PDF 第 130 页）。\n<\/li><li>\n<strong>不区分 token 级质量与响应级质量<\/strong>：只看预测下一个 token 准不准，无法回答整条响应是否有用；这正是后训练阶段存在的根据，也是第 3、4 章要建立应用层评估的原因。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章是全书的底座：模型怎么训练、怎么生成，决定了后面所有适配与评估动作的边界。下一章（第 3–4 章）进入评估：预训练指标如困惑度只能反映语言建模难度，应用是否可用要靠功能正确性、相似度度量、AI 裁判和流水线评估来判断。第 5 章提示工程、第 6 章上下文与智能体，都是在「模型按概率采样、可能偏离」这一特性之上施加引导；第 7 章微调则是在提示词与上下文不够用时直接调整权重。本章留下的两个问题——输出质量怎么度量、概率性风险怎么控制——分别由评估线和适配线承接。<\/p>", "ch02": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.135<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1–2 章：基于基础模型构建 AI 应用入门与理解基础模型<\/a><\/span><\/div><h1>第 3–4 章：评估方法论与评估 AI 系统<\/h1>\n<blockquote>对应原书第 3 章「评估方法论」、第 4 章「评估 AI 系统」（PDF 第 135–229 页；印刷页 = PDF 页 − 1）。第 3 章讲评估方法本身：语言建模指标、精确评估、相似度度量、AI 当裁判与比较评估；第 4 章把方法落到应用：评估标准、模型选择工作流、自建与购买、评估流水线设计。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n由数据分布熵与 KL 散度推出交叉熵，再推出困惑度，说明四个语言建模指标之间的换算关系；\n<\/li><li>\n区分精确评估与主观评估，说清功能正确性、pass@k 的口径，以及精确匹配、词汇相似度、语义相似度各自能测什么；\n<\/li><li>\n列出 AI 当裁判的三种用法，说明裁判一致性、位置偏差、长度偏差等局限，以及比较评估如何给模型排名；\n<\/li><li>\n按领域特定能力、生成能力、指令遵循、成本延迟四类标准组织评估，走一遍「剔除硬属性 → 公开信息筛选 → 自有流水线实验 → 生产监控」的选择工作流，并按组件层级搭评估流水线。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>评估先于构建：先定义「好响应」的标准，再选方法与数据；语言建模指标只刻画预测难度，开放式输出要靠可自动执行的功能正确性、可解释的相似度度量和受约束的 AI 裁判组合判断，模型选择则是在质量、延迟、成本与硬约束之间反复权衡的迭代过程。 本章包含两条完整推导：先把变量与依据逐步展开，再沿链条推演条件变化，并在反事实环节推演去掉条件后的结果。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 4：语言建模指标（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。自回归语言模型大多用交叉熵或其变体困惑度训练。熵 <span class=\"katex-inline\">H(P)<\/span> 衡量一个 token 平均携带的信息量，即最有效编码时每个 token 平均需要的比特数；分布越容易预测，熵越低（PDF 第 141 页）。设真实分布为 <span class=\"katex-inline\">P<\/span>、模型学到的分布为 <span class=\"katex-inline\">Q<\/span>，交叉熵 <span class=\"katex-inline\">H(P,Q)=H(P)+D_{\\mathrm{KL}}(P\\Vert Q)<\/span>，它同时取决于数据本身的可预测性和两个分布的差异（PDF 第 142 页）。困惑度是交叉熵的指数形式，衡量预测下一个 token 的不确定程度；BPC（每字符比特数）与 BPB（每字节比特数）是按字符、字节归一化后的交叉熵变体（PDF 第 143 页）。这四个指标互相换算，值越低预测越准；但建模指标与下游任务表现只有强相关、不能完全等价。<\/p>\n<h3>2. 概念 5：精确评估与相似度度量（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。精确评估给出明确无歧义的判断，主观评估随评分者变化。功能正确性按系统是否实现预期功能评估，是任何应用的终极指标；代码生成场景可把生成代码送进解释器跑测试用例自动判定，即执行准确性（PDF 第 147 页）。每个问题生成 <span class=\"katex-inline\">k<\/span> 个样本，任一样本通过全部测试用例即视为解决，得分记为 pass@<span class=\"katex-inline\">k<\/span>；样本越多解决机会越大，因此 pass@1 理论上低于 pass@3，再低于 pass@10（PDF 第 148 页）。无法用功能正确性自动评估时，把输出与参考响应比较：精确匹配是二元判定，词汇相似度看表面形式重叠，语义相似度看含义接近程度（PDF 第 149–150 页）。嵌入是把数据映射到低维数值向量的表示，含义相近的文本应有距离更近的嵌入（PDF 第 155 页）。<\/p>\n<h3>3. 概念 6：AI 当裁判与比较评估（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。用 AI 评估 AI 称为 AI 当裁判；与人工相比，裁判模型更快、更易用、成本较低，且无须参考数据即可工作（PDF 第 159 页）。三种用法：独立给单个响应评分；与参考响应对照判断一致性；把两个响应并排比较选出更好者。原书引用研究：MT-Bench 上 GPT-4 与人类评估员一致性 85%，高于人类之间 81% 的一致性（PDF 第 159 页）。局限在于：裁判本身有概率性，结论随裁判模型、提示词、采样参数变化；评分体系上分类通常优于数值评分，离散评分优于连续评分，分值范围越大模型表现越差，提示词里带不同分值示例效果更好（PDF 第 161–162 页）。比较评估把成对响应排序来给模型排名，同样面临裁判偏差与上下文顺序问题（PDF 第 171 页）。<\/p>\n<h3>4. 概念 7：评估标准、选择工作流与流水线（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。评估驱动开发主张在构建之前先定义评估标准；企业里真正落地的多是标准明确的应用（PDF 第 180–181 页）。评估标准一般分四类：领域特定能力（编程、特定语言理解等受模型配置约束的能力）、生成能力（连贯性、忠实性）、指令遵循能力（格式、长度约束）、成本和延迟（PDF 第 181–197 页）。模型选择先分硬属性（许可、训练数据、模型大小、隐私控制权，难以改变）与软属性（准确性、毒性、事实一致性，可以改进），工作流四步：剔除硬属性不符的模型 → 用公开基准与排行榜缩小范围 → 自有评估流水线实验 → 生产持续监控（PDF 第 200 页）。流水线设计先评估系统所有组件的中间输出，再评估端到端任务级结果；接着写清楚「应该做什么、不应该做什么」的评估指南与带示例的评分标准；最后定义评估方法和数据，并把指标映射回业务指标与实用性阈值（PDF 第 221–224 页）。<\/p>\n<h2>推导一：由熵与 KL 散度推出交叉熵和困惑度<\/h2>\n<p>设 <span class=\"katex-inline\">P<\/span> 是数据集上真实的下一个 token 分布，<span class=\"katex-inline\">Q<\/span> 是模型学到的分布。<\/p>\n<p>第一步，熵 <span class=\"katex-inline\">H(P)=-\\sum_i P(i)\\log_2 P(i)<\/span>，表示按 <span class=\"katex-inline\">P<\/span> 编码所需的平均比特数。第二步，两个分布的差异由 KL 散度 <span class=\"katex-inline\">D_{\\mathrm{KL}}(P\\Vert Q)=\\sum_i P(i)\\log_2\\frac{P(i)}{Q(i)}<\/span> 度量。第三步，展开交叉熵定义：<span class=\"katex-inline\">H(P,Q)=-\\sum_i P(i)\\log_2 Q(i)<\/span>，把它拆成 <span class=\"katex-inline\">-\\sum_i P(i)\\log_2 P(i)+\\sum_i P(i)\\log_2\\frac{P(i)}{Q(i)}<\/span>，即 <span class=\"katex-inline\">H(P,Q)=H(P)+D_{\\mathrm{KL}}(P\\Vert Q)<\/span>（PDF 第 142 页）。<\/p>\n<p>推论一：若 <span class=\"katex-inline\">Q=P<\/span>，KL 散度为 0，交叉熵等于数据熵，模型已完美学到训练分布。推论二：模型在同一数据集上的交叉熵不可能低于 <span class=\"katex-inline\">H(P)<\/span>，超出部分就是分布差异的代价。推论三：困惑度 <span class=\"katex-inline\">\\mathrm{PPL}=2^{H(P,Q)}<\/span>（以 2 为底时），交叉熵每增加 1 比特，困惑度翻倍；4 个等概率候选时交叉熵为 2 比特，困惑度为 <span class=\"katex-inline\">2^2=4<\/span>（PDF 第 143 页）。BPC 再按每 token 平均字符数归一，BPB 按字节归一；分词方法不同的模型，按 token 比比特数不可直接比较，要换算到字符或字节口径。<\/p>\n<h2>推导二：top-k 候选数与检索/评估中的精度、召回权衡<\/h2>\n<p>以 RAG 检索为例（指标定义见原书 6.1.2，PDF 第 283 页）：上下文精度 <span class=\"katex-inline\">=\\frac{\\text{检索到的相关文档数}}{\\text{检索到的文档总数}}<\/span>，上下文召回率 <span class=\"katex-inline\">=\\frac{\\text{检索到的相关文档数}}{\\text{数据库中全部相关文档数}}<\/span>。设相关文档共 <span class=\"katex-inline\">R<\/span> 篇，检索返回 <span class=\"katex-inline\">k<\/span> 篇，其中 <span class=\"katex-inline\">r<\/span> 篇相关。<\/p>\n<p>把 <span class=\"katex-inline\">k<\/span> 放大：候选变多，<span class=\"katex-inline\">r<\/span> 通常随 <span class=\"katex-inline\">k<\/span> 增大而增加，召回率上升；但 <span class=\"katex-inline\">k<\/span> 增大也带入更多不相关文档，精度可能下降，且每条无关上下文都占 token、增加延迟成本并提高上下文污染概率。把 <span class=\"katex-inline\">k<\/span> 缩小：上下文更干净、精度提高，但可能漏掉排在后面的相关文档，召回率下降。评估端同样的权衡：候选集越大，pass@<span class=\"katex-inline\">k<\/span> 越高只是采样机会变大的结果，不代表单样本质量提升；因此报告 pass@1 才能反映单次输出的真实水平，比较模型时必须固定 <span class=\"katex-inline\">k<\/span> 与测试集。<\/p>\n<p>这条权衡链落到模型选择：延迟硬性不达标的模型先剔除，再在剩余候选里比质量；评估指南若只写「回答要好」而不给反例与分值样例，不同评分者对同一响应会给出不同分数，流水线无法复现。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>把评估集换成训练集<\/strong>：指标只反映模型见过数据上的拟合程度，分布差异项被掩盖，上线后面对新查询的表现无法预估；这与传统 ML 中用训练集测试模型的错误一致。\n<\/li><li>\n<strong>只评端到端最终结果，不评组件中间输出<\/strong>：简历提取雇主信息失败时，分不清是 PDF 转文本出错还是文本到雇主抽取出错；组件级评估缺失会让故障定位停在黑箱（PDF 第 221 页）。\n<\/li><li>\n<strong>让 AI 裁判直接输出 1–10 连续分且不给示例<\/strong>：语言模型处理文本分类比处理数值更稳，分值范围变大后评分变差；缺少示例时评分边界随裁判状态漂移，评估结果难以复现（PDF 第 161–162 页）。\n<\/li><li>\n<strong>跳过评估指南，先把演示产品推上线<\/strong>：已部署但无法评估的应用比不部署更糟，维护成本持续存在、下线成本更高；业务指标与技术指标之间没有映射，就无法判断质量提升带来多少回报（PDF 第 180、223 页）。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章给全书装上「度量尺」：第 5 章判断提示词好不好，第 6 章判断检索与智能体成败，第 7 章判断微调是否值得，都要复用本章的标准、方法与流水线。上一章讲模型如何按概率生成，本章回答「生成出来怎么判好坏」；下一章进入第一种适配手段——提示工程，它的迭代优化必须挂在本章建立的评估集与指南之上，否则提示词改了哪一版更好没有依据。第 4 章的成本延迟标准则直接接第 9 章推理优化的吞吐、延迟与利用率分析。<\/p>", "ch03": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.230<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 3–4 章：评估方法论与评估 AI 系统<\/a><\/span><\/div><h1>第 5–6 章：提示工程、RAG 与智能体<\/h1>\n<blockquote>对应原书第 5 章「提示工程」、第 6 章「RAG 与智能体」（PDF 第 230–325 页；印刷页 = PDF 页 − 1）。第 5 章讲如何用指令引导模型而不动权重：上下文学习、系统/用户提示、最佳实践、上下文效率与防御性提示工程；第 6 章讲上下文构建的两种主要模式：检索增强生成（RAG）与智能体模式，外加记忆机制。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清提示词的组成部分，区分零样本/少样本、系统提示词/用户提示词，列出提示工程通用最佳实践；\n<\/li><li>\n画出 RAG 的检索器—生成器架构，比较词项检索与嵌入检索的机制，由精度召回定义推 top-k 与分块大小的权衡；\n<\/li><li>\n按环境、工具集、规划三个要素识别一个智能体，用单步成功率推多步任务的整体成功率，并列出规划、工具、效率三类故障；\n<\/li><li>\n解释上下文长度与上下文效率的差别，说明长上下文被模型「用不好」的表现与检索、缓存的关系。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>提示工程用清晰指令和示例激活模型已有的能力；RAG 按每个查询检索相关信息块再生成，把知识从模型权重转移到外部记忆；智能体在环境中调用工具、规划多步动作完成任务，三者都是在不动模型权重的前提下改善输出，差别在于引导信息来自指令、检索结果还是工具反馈。 本章包含两条完整推导：先把变量与依据逐步展开，再沿链条推演条件变化，并在反事实环节推演去掉条件后的结果。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 8：提示工程与上下文学习（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。提示词是发给模型执行任务的指令，通常由任务描述、完成任务的示例、具体待处理内容三部分组成（PDF 第 230–231 页）。仅凭提示词中的示例完成任务而不更新权重，称为上下文学习；无示例是零样本，<span class=\"katex-inline\">k<\/span> 个示例是 <span class=\"katex-inline\">k<\/span>-shot 少样本（PDF 第 232 页）。许多 API 把提示词分为系统提示词（角色设定、任务描述）与用户提示词（具体问题和材料）；应用开发者设定的指令进系统提示词，用户输入进用户提示词（PDF 第 233 页）。最佳实践包括：明确无歧义地说明要做什么、要求角色设定、提供示例、指定输出格式、提供充足上下文、把复杂任务拆成子任务、迭代优化提示词并做版本管理（PDF 第 239–249 页）。上下文长度是模型能容纳的上限；上下文效率则是模型利用这些信息的程度——研究显示模型对开头和结尾的指令理解远好于中间，「大海捞针」测试用于检验长上下文利用能力（PDF 第 236–237 页）。<\/p>\n<h3>2. 概念 9：RAG 检索—生成架构（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。RAG 通过从外部记忆源检索相关信息来增强模型生成；系统含两个组件：检索器负责索引与查询，生成器基于检索结果生成响应（PDF 第 275 页）。文档先拆成块（chunk）再索引；词项检索靠词频（TF）与逆文档频率（IDF）计算 TF-IDF 分数，BM25 在此基础上按文档长度归一化；嵌入检索把查询和文档映射为稠密向量，按语义相似度排序（PDF 第 277–280 页）。检索质量用上下文精度与上下文召回率衡量；排序质量可用 NDCG、MAP、MRR。生产系统常组合两种检索：低成本词项检索先取候选，高精度机制重排序；倒数排名融合（RRF）按各检索器排名求和合并结果（PDF 第 286–287 页）。检索优化四类策略：分块、重排序、查询重写、上下文检索（PDF 第 288 页）。<\/p>\n<h3>3. 概念 10：智能体、工具规划与记忆（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。智能体是能够感知环境并通过执行器作用于环境的事物；AI 智能体以模型为大脑，处理任务与环境反馈、规划动作序列、判断任务是否完成（PDF 第 296 页）。工具分只读动作（感知环境）与写入动作（作用于环境）；工具库决定能力范围，工具越多理解和使用难度通常越高（PDF 第 298–299 页）。智能体需要更强大的模型，原因有二：多步操作带来错误累积，工具使用带来更高风险（PDF 第 298 页）。故障模式分三类：规划故障（无效工具、参数无效、参数值错误、目标失败、反思错误）、工具故障（工具输出错误、缺正确工具）、效率故障（步数、成本、单步耗时偏高）（PDF 第 318–320 页）。记忆是模型保留和利用信息的机制：RAG 靠记忆扩展上下文，智能体需要记忆存放指令、示例、上下文、工具清单、计划、工具输出与反思（PDF 第 321 页）。<\/p>\n<h2>推导一：top-k 与分块大小如何沿精度、召回、上下文污染传导<\/h2>\n<p>设某查询相关文档共 <span class=\"katex-inline\">R<\/span> 篇，检索返回 <span class=\"katex-inline\">k<\/span> 篇，其中 <span class=\"katex-inline\">r<\/span> 篇相关。精度 <span class=\"katex-inline\">P=r/k<\/span>，召回率 <span class=\"katex-inline\">R_{\\mathrm{call}}=r/R<\/span>。<\/p>\n<p>固定分块策略，只放大 <span class=\"katex-inline\">k<\/span>：候选增多，<span class=\"katex-inline\">r<\/span> 单调不减，召回率上升；<span class=\"katex-inline\">k<\/span> 增大使 <span class=\"katex-inline\">r/k<\/span> 的分母变大，当新增候选多为不相关文档时精度下降。同时每条进入上下文的无关块都占用 token，抬高输入成本与延迟，并提高模型关注到错误部分的概率——这就是上下文污染。反向缩小 <span class=\"katex-inline\">k<\/span>：上下文干净、精度提高，但排在后面的相关文档被截断，召回率下降。<\/p>\n<p>固定 <span class=\"katex-inline\">k<\/span> 改变分块大小：块越小，相同上下文窗口能放入的块越多，信息覆盖面更广；但小块可能在边界截断关键信息，且块数翻倍意味着嵌入向量数量与向量检索规模翻倍，查询开销上升。块越大，单块语义完整，但一块里混杂多个主题，检索命中后送入上下文的无关内容更多。推导依据：精度召回定义来自原书 6.1.2 节（PDF 第 283 页），分块权衡来自 6.1.3 节（PDF 第 288 页）；不存在通用最优块大小，必须按自己的查询集实验。<\/p>\n<h2>推导二：由单步成功率推多步智能体的整体成功率<\/h2>\n<p>设智能体每一步动作的成功率为 <span class=\"katex-inline\">p<\/span>，各步成败近似独立，完成 <span class=\"katex-inline\">n<\/span> 步任务的整体成功率为 <span class=\"katex-inline\">P(n)=p^n<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">p=0.95<\/span>：<span class=\"katex-inline\">n=10<\/span> 时 <span class=\"katex-inline\">P=0.95^{10}\\approx0.599<\/span>；<span class=\"katex-inline\">n=100<\/span> 时 <span class=\"katex-inline\">P=0.95^{100}\\approx0.0059<\/span>。原书给出同一量级的结论：每步 95% 准确率，10 步后总体约 60%，100 步后仅约 0.6%（PDF 第 298 页）。\n<\/li><li>\n对比 <span class=\"katex-inline\">p=0.99<\/span>：<span class=\"katex-inline\">n=10<\/span> 时 <span class=\"katex-inline\">P\\approx0.904<\/span>，<span class=\"katex-inline\">n=100<\/span> 时 <span class=\"katex-inline\">P\\approx0.366<\/span>。单步 4 个百分点的提升，在长链条上被放大成数十个百分点的差距。\n<\/li><li>\n推论：步骤越多，对单步可靠性要求越高；缩短链条（合并子任务、减少工具往返）、在关键节点加校验，比单纯换更强的模型更直接改善整体成功率。\n<\/li><li>\n推论二：智能体风险随动作写入能力放大——只读检索出错通常只是回答偏差，写入动作出错可能改动外部系统；评估必须按工具类型分别记录故障频率。\n<\/ul>\n<h2>反事实：去掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉检索，只靠模型参数记忆<\/strong>：模型知识停留在训练截止日期之后的空白处，冷门产品规格、私有合同内容无从引用；缺少上下文时模型只能依赖内部不可靠知识，幻觉概率上升（PDF 第 242、274 页）。反过来，若检索器完全失效，RAG 退化成无上下文的参数化问答。\n<\/li><li>\n<strong>文档不做分块，整篇直接索引<\/strong>：长文档直接进入上下文会撑爆上下文窗口；不分块也让检索粒度落在整篇，命中一篇就带入整份材料，无关内容比例升高。\n<\/li><li>\n<strong>智能体不设工具库约束，允许调用任意外部动作<\/strong>：规划故障里「调用不存在的工具」「参数值错误」没有边界可查；缺工具导致的故障也无法与工具输出错误区分，评估数据集需要（任务，工具清单）二元组才能定位（PDF 第 319 页）。\n<\/li><li>\n<strong>提示词不区分系统设定与用户输入<\/strong>：角色指令散落在用户消息里，模型对指令位置敏感，任务描述放在开头或末尾在不同模型上表现不同；缺少分隔标记时模型还可能续写输入内容而非产出结构化结果（PDF 第 232、241 页）。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章承接第 4 章的评估标准：提示词迭代、检索器质量、智能体故障统计都要挂在评估集与裁判流程上。提示工程与 RAG 都属于不动权重的适配；当指令和上下文仍满足不了任务，就进入第 7 章微调——调整模型权重本身。第 6 章的记忆机制与检索器，是第 8 章数据集工程和第 9 章推理缓存（KV 缓存、提示词缓存）的上游；智能体的多步链路成本，则在第 9 章用延迟、吞吐与利用率指标量化。<\/p>", "ch04": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.327<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 5–6 章：提示工程、RAG 与智能体<\/a><\/span><\/div><h1>第 7–10 章：微调、数据集工程、推理优化与 AI 工程架构<\/h1>\n<blockquote>对应原书第 7 章「微调」、第 8 章「数据集工程」、第 9 章「推理优化」、第 10 章「AI 工程架构与用户反馈」（PDF 第 327–510 页；印刷页 = PDF 页 − 1）。本章覆盖权重适配与数据基础，再到推理侧的成本速度优化，最后把前面所有技术整合成产品架构，并讲用户反馈如何回流成数据飞轮。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n列出微调的理由与不微调的理由，按参数量、位宽、可训练参数估算推理与训练显存，区分全量微调、部分微调与 PEFT；\n<\/li><li>\n说清数据集质量、覆盖度、数据量三条标准，了解数据合成、蒸馏与检查去重过滤流程；\n<\/li><li>\n分解延迟为 TTFT 与 TPOT，区分吞吐量、有效吞吐量、MFU、MBU，推出批处理的吞吐—延迟权衡与预填充/解码解耦的依据；\n<\/li><li>\n描述最简架构逐步加上下文增强、防护、网关、缓存的演进，区分显式与隐式反馈，说明反馈数据如何回流改进模型与产品。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>微调是提示词与上下文不够用时才动用的权重适配，受数据、硬件、人才三重门槛约束；模型质量最终落在数据质量上；推理优化在质量不变的前提下压缩成本与延迟；产品架构把检索、防护、路由、缓存和反馈循环串成闭环，专有使用数据是长期竞争壁垒。 本章包含两条完整推导：先把变量与依据逐步展开，再沿链条推演条件变化，并在反事实环节推演去掉条件后的结果。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 11：微调决策与内存瓶颈（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c11.md\" target=\"_blank\" rel=\"noopener\">概念 c11<\/a>。微调指进一步训练整个模型或其中一部分以适应特定任务；建议先充分尝试提示工程，再考虑微调，两者并不互斥（PDF 第 330 页）。微调的理由包括补足领域训练不足、引导特定输出结构、缓解偏见；不微调的理由包括：提示词和上下文常能达到同样效果，单任务微调可能损害其他任务，前期数据、训练知识、部署维护成本高，且微调迭代赶不上基座模型进化速度（PDF 第 331–333 页）。内存是主要瓶颈：推理只存权重，近似占用 <span class=\"katex-inline\">N\\times M\\times1.2<\/span>（<span class=\"katex-inline\">N<\/span> 参数量，<span class=\"katex-inline\">M<\/span> 每参数字节数，1.2 含激活与 KV 向量约 20% 的估算）；训练还要为梯度和优化器状态分配内存，Adam 每个可训练参数存梯度加两个状态共 3 个值（PDF 第 341–342 页）。PEFT 用少量可训练参数逼近全量微调性能，路线分基于适配器（adapter、LoRA、BitFit、IA3 等）与基于软提示两类；模型合并则把多个微调模型组合起来（PDF 第 352–365 页）。<\/p>\n<h3>2. 概念 12：数据集工程（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c12.md\" target=\"_blank\" rel=\"noopener\">概念 c12<\/a>。数据策展遵循质量、覆盖度、数据量三条标准：高质量数据具备相关性强、符合任务要求、一致性高、格式规范、足够独特、合规六项特征；覆盖度要求数据覆盖用户问题的全部表达范围；数据量则与质量权衡——少量高质量数据常优于大量含噪数据，原书引用 Yi 模型系列发现 1 万条精心设计指令优于几十万条含噪指令，LIMA 用 1000 条精选（提示词，响应）对微调 650 亿参数模型（PDF 第 385–389 页）。数据获取分自监督序列、监督（指令，响应）、偏好（提示词，胜出/落败响应）等格式；数据合成包括传统方法与 AI 驱动方法，蒸馏是用大模型行为训练小模型；数据处理含检查、去重、清理过滤与格式化（PDF 第 396–418 页）。<\/p>\n<h3>3. 概念 13：推理优化（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c13.md\" target=\"_blank\" rel=\"noopener\">概念 c13<\/a>。推理服务分在线 API（优化延迟，到达即处理）与批处理 API（优化成本，允许批量与低成本硬件，原书提到两家提供商批处理成本降低约 50%、周转以小时计）（PDF 第 425 页）。延迟分解为整体延迟 <span class=\"katex-inline\">=\\mathrm{TTFT}+\\mathrm{TPOT}\\times<\/span> 输出 token 数；TTFT 对应预填充，TPOT 对应解码；Anyscale 实验中 100 个输入 token 对延迟的影响约等于 1 个输出 token（PDF 第 426–427 页）。吞吐量以 TPS 或 RPS/RPM 计；有效吞吐量（goodput）统计满足 SLO 的请求数；MFU 是实际吞吐量占峰值 FLOP/s 理论吞吐的比例，MBU 是实际带宽占理论带宽比例，带宽用量 <span class=\"katex-inline\">=<\/span> 参数量 <span class=\"katex-inline\">\\times<\/span> 每参数字节数 <span class=\"katex-inline\">\\times<\/span> 吞吐量（PDF 第 428–430 页）。模型层优化含量化、蒸馏、剪枝、推测解码；服务层优化含静态/动态/连续批处理、预填充与解码解耦、提示词缓存（PDF 第 440–456 页）。<\/p>\n<h3>4. 概念 14：工程架构与反馈循环（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c14.md\" target=\"_blank\" rel=\"noopener\">概念 c14<\/a>。最简架构是应用接收查询、发给模型、返回响应，没有上下文增强与防护（PDF 第 462 页）。演进顺序通常是：接入外部数据源与工具增强上下文；设置输入/输出防护；加路由器与网关；用缓存优化延迟成本；再补复杂逻辑与动作。网关集中做访问控制、成本管理、限流与故障回退；系统缓存分精确缓存（完全一致才命中）与语义缓存（语义相似即命中，依赖嵌入质量与阈值）（PDF 第 473–476 页）。反馈分显式反馈（点赞点踩、评分、明确询问）与隐式反馈（从购买、停留、重述、提前终止等行为推断）；对话界面里自然语言反馈可提取提前终止、错误修正、重新表述等信号（PDF 第 488–489 页）。反馈用于评估、开发与个性化，专有使用数据构成数据飞轮；反馈即用户数据，使用时同样要尊重隐私（PDF 第 487、493 页）。<\/p>\n<h2>推导一：由参数量与位宽估算推理和训练显存<\/h2>\n<p>设模型参数量为 <span class=\"katex-inline\">N<\/span>，每个参数占用 <span class=\"katex-inline\">M<\/span> 字节，推理阶段激活值与 KV 向量按权重内存的 20% 估算，则推理内存约为 <span class=\"katex-inline\">N\\times M\\times1.2<\/span>（PDF 第 341 页）。<\/p>\n<p>以原书 130 亿参数模型为例：FP32 每参数 4 字节，权重 <span class=\"katex-inline\">13\\times10^9\\times4=52<\/span> GB；降到 2 字节，权重 26 GB，推理总内存约 <span class=\"katex-inline\">26\\times1.2=31.2<\/span> GB（PDF 第 339、341 页）。700 亿参数模型每参数 2 字节，仅权重就 140 GB（PDF 第 341 页）。<\/p>\n<p>训练阶段再加梯度与优化器状态：Adam 为每个可训练参数存梯度加两个状态共 3 个值。130 亿参数全量训练、每值 2 字节，梯度与优化器状态为 <span class=\"katex-inline\">13\\times10^9\\times3\\times2=78<\/span> GB；若只训练 10 亿可训练参数，这部分降到 <span class=\"katex-inline\">10^9\\times3\\times2=6<\/span> GB（PDF 第 342 页）。原书 70 亿参数模型算例：FP16 权重 14 GB，Adam 全量微调额外 <span class=\"katex-inline\">7\\times10^9\\times3\\times2=42<\/span> GB，合计 56 GB，尚未含激活值，已超过多数 12–24 GB 消费级 GPU 与 48 GB 高端卡容量（PDF 第 351 页）。<\/p>\n<p>推论：PEFT 减少可训练参数，直接压缩梯度与优化器状态这一项；量化把 <span class=\"katex-inline\">M<\/span> 减半，权重与带宽占用同步下降；激活值在长上下文、大批次下可能远超权重内存，梯度检查点以重算换内存，训练时间相应延长（PDF 第 342–343 页）。<\/p>\n<h2>推导二：批处理如何在吞吐与延迟之间权衡<\/h2>\n<p>单请求独立处理时，加速器在等待某请求解码的间隙空转；批处理把相近时间到达的请求合并，复用权重加载与计算批次，提高吞吐量与资源利用率。静态批处理必须等批次填满才出发，早到请求被晚到请求拖住；动态批处理设最大时间窗口，坐满或超时先到先处理，批次可能不满、浪费算力；连续批处理允许完成的响应立即返回并补入新请求，避免短响应等长响应（PDF 第 453–454 页）。<\/p>\n<p>吞吐上升的代价是排队等待增加，TTFT 与 TPOT 可能变长；原书引用 LinkedIn 团队总结：愿意牺牲 TTFT 和 TPOT，吞吐量翻倍甚至翻三倍并不罕见（PDF 第 428 页）。预填充是计算受限、解码是内存带宽受限，混在同一台机器上互相争用资源；解耦到不同实例后，两类瓶颈分别调度，中间状态经高带宽连接传输，可在满足延迟要求的同时提高吞吐（PDF 第 454–455 页）。有效吞吐量只统计满足 SLO 的请求：每秒完成 10 个请求但只有 3 个达标，goodput 就是 3 个/秒，单纯堆总吞吐可能换来更差的用户体验（PDF 第 429 页）。<\/p>\n<h2>反事实：去掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>项目一开始就选微调<\/strong>：提示词实验尚未系统化，指令不清、样本不反映真实数据、评估指标未定义；数据标注、训练参数调试、部署维护的前期投入先于验证，原书记录不少案例改进提示词流程后即满足需求，微调并不必要（PDF 第 333 页）。\n<\/li><li>\n<strong>数据集只追求数量、不查一致性与格式<\/strong>：标注员之间口径不一致会让模型困惑；一列本应浮点的数据存成整型被四舍五入，会引发难以定位的模型行为偏差（PDF 第 386 页）。重复样本引入偏差并造成数据污染。\n<\/li><li>\n<strong>推理服务只看总吞吐量，不看 SLO 达标率<\/strong>：高吞吐请求里混入超时、超长响应的样本，平均指标掩盖尾部延迟；用户感知的是 p90/p95/p99 延迟，平均值会被异常值带偏（PDF 第 427–429 页）。\n<\/li><li>\n<strong>架构里不设输入防护<\/strong>：员工把公司机密或用户隐私贴进提示词发给第三方 API，或内部政策被写进系统提示词；敏感数据不经检测与掩码，泄露风险随外部调用直接暴露（PDF 第 464 页）。\n<\/li><li>\n<strong>不收集用户反馈<\/strong>：产品上线后无法区分哪些响应好、哪些场景失败，改进缺少专有数据来源；数据飞轮断在第一环，模型后续版本与个性化都失去原料（PDF 第 487 页）。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章是全书的落地收口：第 7 章微调是第 5、6 章不动权重适配的最后手段；第 8 章数据承接第 3、4 章评估指南产出的标注口径；第 9 章推理优化回应第 4 章成本延迟标准；第 10 章架构把检索、防护、网关、缓存与反馈串成闭环，并把使用数据送回第 8 章的数据策展。至此全书形成循环：决策与理解 → 评估 → 提示与上下文适配 → 权重适配与数据 → 推理与产品化 → 反馈回流。<\/p>", "c01": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.59<\/div><h1>基础模型、MaaS 与 AI 工程技术栈三层：应用开发、模型开发与基础设施<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章（原书 1.1 AI 工程的兴起、1.4 AI 工程技术栈，PDF 第 24、58–61 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>在基础模型出现之前，构建 AI 应用意味着自己收集标注数据、训练模型、部署服务；LLM 兴起后，任何人都能调用现成模型做应用，于是新的问题变成：自己这一层到底该做什么、不该做什么？如果分不清技术栈各层职责，容易把精力花在不该自建的环节上（例如重复训练基座模型），又漏掉应用层真正决定体验的工作（提示词、上下文、评估）。这个概念给出一张分层视图，用来判断一项技术决策落在哪一层、与谁耦合。<\/p>\n<h2>定义<\/h2>\n<p><strong>基础模型（foundation model）<\/strong>：在大规模数据上预训练、可被适配到多种下游任务的模型，本书涵盖大语言模型（LLM）与多模态大模型（LMM）（PDF 第 24 页）。<strong>模型即服务（MaaS）<\/strong>：由少数组织训练模型并以服务形式提供，应用方无须提前投入资源自行开发模型（PDF 第 24 页）。<\/p>\n<p><strong>AI 工程技术栈三层<\/strong>（PDF 第 59 页）：<\/p>\n<ol><li>\n<strong>应用开发层<\/strong>：为模型设计提示词、提供必要上下文，做界面设计与严格评估；这是过去两年最活跃、增长最快的一层。\n<\/li><li>\n<strong>模型开发层<\/strong>：建模、训练、微调、推理优化框架，以及处于核心地位的数据集工程；模型开发同样需要严格评估。\n<\/li><li>\n<strong>基础设施层<\/strong>：模型服务、数据与计算管理、监控等工具；模型和应用不断变化，核心基础设施需求保持不变。\n<\/ol>\n<p>正例：用现成 API 做一个客服应用，写提示词、接检索、搭评估集属于应用开发层；若后续微调小模型，微调流程与数据准备进入模型开发层；GPU/推理服务器、日志监控属于基础设施层。反例：把「接入第三方模型 API」当作自建模型开发，或把「模型权重训练」塞进应用层职责，都是层级错位。<\/p>\n<h2>原理推导<\/h2>\n<p>从应用方的需求反推分层。要让模型回答具体问题，先要有可调用的模型能力，这是下层提供的服务；要把通用能力变成具体产品，需要在模型之上组织指令与材料，这是应用层；模型能力本身要有人训练、适配、压缩，这是模型开发层；所有计算与数据要落在机器和监控系统上，这是基础设施层。三层之间靠接口衔接：应用层调用模型层能力，模型层调用基础设施资源。<\/p>\n<p>原书对比了 AI 工程与传统 ML 工程：许多投入生产的原则不变——业务指标与 ML 指标互相映射、系统化实验、追求更快更便宜、构建反馈循环；变化的是实验对象：传统 ML 调超参数，基础模型场景调模型、提示词、检索算法、采样变量（PDF 第 60 页）。AI 工程师与 ML 工程师角色重叠很大，也存在没有 ML 经验转入 AI 工程的人。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：判断一个 AI 应用项目的职责划分、工具归属与自建/购买边界；三层是逻辑划分，小团队可以一人兼任多层。\n<\/li><li>\n边界一：分层不代表技术孤立。应用层提示词效果受模型层能力约束，模型层训练受基础设施容量约束；跨层问题不能只在一层解决。\n<\/li><li>\n失败案例一：只追应用层热点工具，跳过评估与数据，演示能跑、产品不可用；原书提醒好的初步演示不代表最终产品，从 0 到 60 容易，从 60 到 100 极具挑战（PDF 第 56 页）。\n<\/li><li>\n失败案例二：把基础设施当快速变化的潮流追赶。原书 2024 年 3 月 GitHub 星标 500 以上的 AI 仓库统计显示，2023 年增长最快的是应用开发层，基础设施层增长平缓，因为资源管理、服务、监控等需求稳定（PDF 第 60 页）。\n<\/li><li>\n边界二：MaaS 降低了使用门槛，也带来外部依赖：API 价格、可用性、许可与数据控制权都不在应用方手中，这一边界在第 4 章模型选择与第 10 章防护措施中展开。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>基础模型 vs 传统 ML 模型<\/strong>：传统 ML 模型通常为单一任务专门训练；基础模型经大规模预训练后可适配多种任务，应用方主要做适配而非从头训练。\n<\/li><li>\n<strong>应用开发层 vs 模型开发层<\/strong>：前者不改权重，靠提示词、上下文、工具引导；后者直接调整权重或构建模型，需要数据、训练知识与部署能力。\n<\/li><li>\n<strong>AI 工程 vs 全栈工程<\/strong>：全栈工程覆盖前后端与业务系统；AI 工程在其上叠加模型适配、评估与推理成本速度的专门职责，二者在界面与服务层交接。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无，本章起点。后继：c02 讲模型开发层内部的训练与对齐流程；c03 讲模型生成机制；c07 的模型选择工作流区分硬属性与软属性，正是在三层边界上做取舍；c11 微调进入模型开发层；c13 推理优化横跨模型开发层与基础设施层；c14 产品架构把三层组件串成闭环。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（基础模型、MaaS 与 AI 工程技术栈三层：应用开发、模型开发与基础设施）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：从应用需求反推技术栈三层与 MaaS 分工<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把「AI 应用该做什么」讲到可推演，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先分清应用方与模型方<\/strong>。本书讨论的 AI 工程，是基于现成基础模型构建应用的工程；不包含从零预训练基座模型的研究工作。前提不同，分层职责就不同：若你是模型实验室，三层都要自建；若你是应用团队，主要工作集中在应用开发层。\n<\/li><li>\n<strong>先确认模型能力以什么形式交付<\/strong>。模型可以自托管开源权重，也可以经 API 调用第三方服务；两种形式都属于下层提供的模型能力，差别在控制权、成本与延迟，第 4 章展开。\n<\/li><li>\n<strong>再确认应用要给模型什么输入<\/strong>。模型本身只有参数化知识，具体任务需要指令、示例与材料；这些输入的组织方式是应用层的核心工作，对应第 5 章提示工程与第 6 章上下文构建。\n<\/li><li>\n<strong>最后确认资源与监控落在哪<\/strong>。计算、存储、日志、限流、成本管理都需要一套稳定的基础设施；这一层变化最慢，却决定上层能否长期运行。\n<\/ol>\n<p>依赖链方向：应用目标 → 需要可调用的模型能力（模型层/服务层）→ 需要在能力之上组织指令与材料（应用层）→ 需要机器与监控承载一切（基础设施层）。任何一层前提缺失，项目就会出现「要么重复造模型，要么裸调 API 无评估」的错位。<\/p>\n<h2>正向推导：从最小需求推出三层结构<\/h2>\n<h3>第一步：应用要完成一项具体任务<\/h3>\n<p>用户提出一个请求，例如「根据这份合同摘要风险点」。任务能完成，至少需要三样东西：一个具备语言理解与生成能力的模型；一段告诉模型做什么、按什么格式输出的指令；一份供模型读取的合同材料。指令与材料属于应用层组织的内容，模型能力属于下层服务。<\/p>\n<h3>第二步：模型能力从哪里来<\/h3>\n<p>模型能力有两个来源。一是自托管：下载开源权重，在自己的机器上加载运行，模型开发层要负责选型、微调、压缩与推理优化。二是 MaaS：少数组织训练好模型，经 API 按调用提供；应用方不承担训练数据、算力与人才投入，直接调用服务（PDF 第 24 页）。两种来源都把「模型怎么来的」与「应用怎么用模型」分开，这正是分层的根据。<\/p>\n<h3>第三步：应用层在模型之上做什么<\/h3>\n<p>应用层的工作可归为四类：设计提示词与角色设定；收集并组装上下文（检索、文件、工具结果）；建立评估集与裁判流程判断输出好坏；设计界面与交互流程。原书指出应用开发层在过去两年最活跃，因为模型广泛可用后，任何人都能利用模型开发应用（PDF 第 59 页）。这一层的产出不改变模型权重，只改变每次请求送给模型的内容。<\/p>\n<h3>第四步：模型开发层做什么<\/h3>\n<p>当现成模型经提示与上下文仍达不到任务要求，才进入模型层：选择基座模型、准备数据集、监督微调或偏好微调、压缩模型、评估适配后模型。数据集工程在这一层处于核心地位，因为模型质量取决于训练数据质量（PDF 第 59 页，第 8 章展开）。模型开发层同样需要严格评估，标准来自第 3、4 章。<\/p>\n<h3>第五步：基础设施层承载什么<\/h3>\n<p>最底层是模型服务、数据与计算管理、监控工具。推理服务器托管模型并访问硬件资源；数据管理负责训练与使用数据的存储；监控记录请求、延迟、成本与故障。原书统计 GitHub 上星标 500 以上的 AI 仓库：2023 年应用开发层增长最快，基础设施层增长平缓，因为资源管理、服务、监控等核心需求不随模型换代而改变（PDF 第 60 页）。<\/p>\n<h3>第六步：哪些 ML 经验延续到 AI 工程<\/h3>\n<p>原书明确，构建 AI 应用的许多原则并未改变：企业级应用仍要解决业务问题，业务指标与 ML 指标互相映射；仍需系统化实验——传统 ML 试超参数，基础模型场景试模型、提示词、检索算法、采样变量；仍追求更快更便宜；仍要构建反馈循环用生产数据迭代（PDF 第 60 页）。变化的是实验对象，不是工程纪律。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：一个客服应用的三层归属<\/h3>\n<p>设应用目标是自动处理客户工单。应用开发层：意图分类提示词、回复生成提示词、工单历史材料组装、回复质量评估集、对话界面。模型开发层：先用现成 API 验证可行性；若特定工单类型准确率不足，再准备（工单，回复）数据微调小模型。基础设施层：推理服务器或 API 接入、工单数据库、调用日志、延迟与成本监控。逐项核对：写提示词不在模型层，调权重不在应用层，GPU 采购不在模型开发层。<\/p>\n<h3>算例 2：资源投入的层级分布<\/h3>\n<p>小团队三人分工：一人写提示词与评估（应用层），一人接检索与业务系统（应用层/基础设施层），一人管部署、日志与成本（基础设施层）。此时模型开发层暂无投入，因为尚未到微调阶段。若后续启动微调，才需要补数据标注与训练参数调试能力。层级投入随项目阶段移动，不是一次固定。<\/p>\n<h3>算例 3：MaaS 与自托管的成本口径对照<\/h3>\n<p>若用 API，成本随调用量按 token 计费，无须承担硬件折旧；若自托管，主要成本是计算资源，集群固定后每天处理 100 万还是 10 亿 token，计算成本基本相同（原书 4.1.4 节，PDF 第 198 页）。规模不同，API 与自托管的划算位置不同；这一选择横跨模型层与基础设施层，不能只看模型参数大小。<\/p>\n<h3>算例 4：实验对象对照<\/h3>\n<p>传统 ML 实验：换学习率、换正则化系数、换特征组合。基础模型实验：换基座模型、换提示词版本、换检索算法、换温度与 top-p 等采样变量。两类实验都要记录配置、跑评估集、对比指标；差别在于基础模型多了提示词与上下文两类可调节对象。<\/p>\n<h3>算例 5：层级错位的两种失败<\/h3>\n<p>错位一：应用团队试图自行训练基座模型，投入数据、算力与人才，而任务本可用提示词加检索解决；重复建设且周期不可控。错位二：只把 API 调用拼进产品，不做评估与反馈，演示能跑但上线后无法判断回复是否改善体验。前者越界到模型层，后者漏掉应用层职责。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>没有 MaaS，模型必须自建<\/strong>：应用方先要有大规模数据、算力与专业团队，AI 应用门槛回到训练时代；应用层的快速实验与迭代无从谈起。\n<\/li><li>\n<strong>应用层不做评估，只靠模型能力<\/strong>：输出好坏没有记录标准，提示词与模型版本的优劣无法比较，产品改进失去依据；这正是第 4 章评估驱动开发要补的环节。\n<\/li><li>\n<strong>基础设施随每次模型换代重建<\/strong>：监控、服务、数据管理若不能复用，团队精力被消耗在重复搭建上；原书观察到基础设施需求稳定，正是分层复用的根据。\n<\/li><li>\n<strong>三层职责由一人随机兼任且不记录归属<\/strong>：小团队可以兼任，但决策时仍要能说清某项改动属于哪层；否则故障定位时无法判断是提示词问题、模型能力问题还是资源容量问题。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ol><li>\n应用开发层、模型开发层、基础设施层各自产出什么？用自己的话各举一个动作。\n<\/li><li>\nMaaS 把哪部分工作从应用方转移给了模型提供方？应用方保留了什么职责？\n<\/li><li>\n为什么原书说基础设施层增长平缓，而应用开发层增长最快？\n<\/li><li>\n传统 ML 的超参数实验，在基础模型场景对应哪些可调节对象？\n<\/li><li>\n一个「接入 API 拼出聊天界面」的产品，缺了应用层的哪类必备工作？\n<\/ol>\n<h2>补充推演：边界案例与常见疑问<\/h2>\n<h3>案例 A：一个内部知识库问答应用的层级归属<\/h3>\n<p>应用要做的事：员工提问，系统检索制度文档，模型生成答复。应用开发层：检索提示词、答复格式约束、评估集与对话界面；模型开发层：若现成模型在制度表述上不稳，才考虑小模型微调或适配器训练；基础设施层：向量库、推理服务、访问日志与成本监控。逐项核对可以发现，「把制度文档切片入库」属于数据与检索准备，横跨应用层与模型层；「采购 GPU 集群」属于基础设施层，不应记在应用开发工作量里。层级归属清楚后，团队排期与责任划分才不会错位。<\/p>\n<h3>案例 B：MaaS 依赖的边界<\/h3>\n<p>经 API 调用模型时，应用方不承担训练数据与算力，但价格、可用性、许可条款、数据控制权都在提供方一侧。应用方要核对的边界包括：输入数据是否允许发送给第三方；模型变更后行为是否需要回归；服务降级或停用时是否有备用渠道。这些边界在第 4 章模型选择的硬属性里展开：隐私与控制权属于难以由应用方改变的约束。<\/p>\n<h3>案例 C：传统 ML 经验哪些可迁移<\/h3>\n<p>可迁移：业务指标与技术指标互相映射；实验要记录配置并对照指标；追求更快更便宜；用生产反馈迭代。需要更新：实验对象从超参数扩展到模型版本、提示词、检索算法、采样变量；评估集的来源更依赖真实用户查询；反馈闭环直接影响模型与提示词两个层面。把传统 ML 的工程纪律照搬过来，再补齐 AI 特有的调节对象，是迁移成本最低的路径。<\/p>\n<h3>案例 D：三层之间的耦合故障<\/h3>\n<p>应用层提示词效果差，有时根因在模型层能力不足；模型层表现不稳，有时根因在基础设施容量不足导致超时或截断。定位顺序仍从应用层向下：先核对提示词与上下文，再核对模型版本，最后核对资源与监控。反过来，跳过应用层直接调模型参数，是常见的越界排查。<\/p>\n<h3>案例 E：小团队兼任多层的记录方式<\/h3>\n<p>一人兼任多层时，决策记录仍应标注改动属于哪一层：提示词版本改动记应用层，适配器权重改动记模型层，部署脚本与日志配置记基础设施层。记录层级不是为了分工名义，而是为了故障定位时能直接跳到对应环节，不必重新梳理整条链路。<\/p>\n<h3>案例 G：三层接口与后续章节的衔接<\/h3>\n<p>应用层把提示词与上下文交给模型层；模型层把推理结果返回应用层；基础设施层为两层提供资源与监控。接口不清时，常见误判是把模型能力不足归到提示词问题，或把容量超时归到模型质量。后续章节中，c02、c03 落在模型开发层内部，c08、c09 落在应用开发层，c13 横跨模型层与基础设施层；读后续概念时先标注它属于哪一层，能更快看清决策链条上的位置。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n如果一个项目只是调用第三方 API 回答问题，它当前主要落在哪一层？哪些工作提前做了属于越界？\n<\/li><li>\n模型自托管与经 API 调用，在三层职责划分上有什么相同与不同？\n<\/li><li>\n为什么说业务指标与 ML 指标互相映射是延续自传统 ML 工程的原则？\n<\/li><li>\n应用层不改变模型权重，它通过哪些输入影响输出质量？\n<\/li><li>\n基础设施层的哪些需求不随模型换代而改变？\n<\/ol><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.99<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">基础模型、MaaS 与 AI 工程技术栈三层：应用开发、模型开发与基础设施<\/a><\/span><\/div><h1>预训练、监督微调与偏好微调：后训练对齐的两段流程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书 2.3 后训练、2.3.1 监督微调、2.3.2 偏好微调，PDF 第 99–105 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>预训练模型从无差别抓取的互联网数据中学文本补全，它说话像网页而不像人，输出可能带歧视、粗鲁或错误内容；直接拿它对话，模型会把「How to make pizza」继续补成句子而不是给出步骤。需要一套后续流程，把已经具备知识的模型调整成愿意按对话方式响应、且响应符合人类偏好的形态。这个概念回答：后训练分哪两步、每步优化什么目标、用什么数据、与预训练在资源量级上差多少。<\/p>\n<h2>定义<\/h2>\n<p><strong>预训练<\/strong>：用自监督方法从大规模文本数据学习下一个 token 预测，优化 token 级别的预测质量（PDF 第 100 页）。<\/p>\n<p><strong>监督微调（SFT, supervised finetuning）<\/strong>：用（提示词，响应）格式的示范数据训练模型，使其学会以恰当方式响应各类请求；这种做法也称行为克隆（behavior cloning），模型示范什么行为就克隆什么行为（PDF 第 102 页）。示范数据应覆盖问答、摘要、翻译等期望处理的各类请求类型。<\/p>\n<p><strong>偏好微调（preference finetuning）<\/strong>：在监督微调之上进一步微调，使输出符合人类偏好；通常借助强化学习完成。技术路线包括基于人类反馈的强化学习（RLHF，GPT-3.5、Llama 2 使用）、直接偏好优化（DPO，Llama 3 使用）、基于 AI 反馈的强化学习（RLAIF，可能用于 Claude）（PDF 第 100 页）。<\/p>\n<p>正例：输入比萨制作问题，正确响应是给出制作步骤；监督微调用示范数据把模型从「补全句子」拉向「回答问题」，偏好微调再让回答更讨人喜欢。反例：把监督微调当作偏好对齐——只示范响应格式，不等于模型已经学会在多个候选响应中选择人类更偏好的那个。<\/p>\n<h2>原理推导<\/h2>\n<p>预训练目标是预测下一个 token，衡量的是 token 级质量；用户并不关心单个 token，关心的是整条响应的整体质量。后训练就是补上这一段：第一步监督微调，用高质量示范数据让模型行为可被接受；第二步偏好微调，用比较信号（响应 A 比响应 B 好）训练奖励偏好，再据此优化模型。<\/p>\n<p>资源量级上，后训练消耗远少于预训练：原书引用 InstructGPT 的口径，计算资源中只有 2% 用于后训练，98% 用于预训练（PDF 第 100 页）。可以把后训练理解为解锁预训练模型已具备、但用户仅凭提示词难以访问的能力。原书用比喻：预训练像通过阅读获取知识，后训练像学习如何运用这些知识（PDF 第 100 页）。<\/p>\n<p>监督微调的数据口径要与任务匹配：不同请求类型需要不同示范；标注质量对 AI 学习对话行为至关重要，与传统数据标注不同，这类标注常需要领域判断（PDF 第 103 页）。偏好微调的训练信号来自比较，奖励模型只记录 A 更好而不解释为什么 A 更好；更强的奖励函数若能更严厉惩罚虚构行为，理论上有助于缓解幻觉（PDF 第 131 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：解释模型为什么会按对话方式响应、为什么输出带有偏好对齐痕迹；判断应用该在预训练、SFT、偏好微调哪一层提需求。\n<\/li><li>\n边界一：三段组合是当前主流方案，不是唯一方案；模型可以跳过某些步骤，原书明确指出这一点（PDF 第 101 页）。\n<\/li><li>\n失败案例一：把指令微调术语混用。原书提醒有人用 instruction finetuning 单指 SFT，有人同时指 SFT 与偏好微调；本书为避免歧义不使用该术语（PDF 第 100 页）。\n<\/li><li>\n失败案例二：假设 RLHF 一定减少幻觉。OpenAI 内部有 RLHF 有助减少幻觉的观察，但 InstructGPT 论文显示同时使用 RLHF 与 SFT 的模型幻觉更严重；尽管如此，人类标注员总体仍更喜欢 RLHF 模型（PDF 第 131 页）。对齐改善其他方面表现，与幻觉变化方向并不一致。\n<\/li><li>\n边界二：后训练不能凭空加入模型未掌握的知识。若示范响应使用了标注员具备而模型不具备的知识，等于在教模型产生幻觉，这是幻觉第二假设的来源（PDF 第 130 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>预训练 vs 监督微调<\/strong>：前者从随机初始化或大规模文本学通用表示，优化下一个 token；后者从预训练权重出发，学对话响应行为。前者数据规模与算力需求大，后者数据量小但质量要求高。\n<\/li><li>\n<strong>监督微调 vs 偏好微调<\/strong>：SFT 教「怎么响应」，信号是（输入，正确响应）；偏好微调教「哪个响应更可取」，信号是成对比较。前者偏行为克隆，后者偏选择排序。\n<\/li><li>\n<strong>RLHF vs DPO vs RLAIF<\/strong>：三者都是偏好微调路线；RLHF 用人类反馈训奖励模型再强化学习，DPO 直接在偏好数据上优化，RLAIF 把反馈来源换成 AI；差别在偏好信号由谁给出与优化路径，目标都是对齐人类偏好。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的模型开发层分工。后继：c03 的采样机制决定模型在已对齐分布上如何逐 token 取输出；c11 的微调决策与 PEFT 是应用层在权重层面的延续；c12 的数据集工程为 SFT 准备（指令，响应）、为偏好微调准备（提示词，胜出/落败响应）格式数据；c06 的成对比较评估与偏好训练信号形式相通。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（预训练、监督微调与偏好微调：后训练对齐的两段流程）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：后训练两段流程的目标、数据与资源量级<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清 SFT 与偏好微调各自解决什么，先往回追五层前提：<\/p>\n<ol><li>\n<strong>先确认预训练优化的目标函数<\/strong>。预训练是自监督文本补全：给定上文预测下一个 token，衡量的是 token 级预测质量。前提不成立，后训练要补的缺口就无从定义。\n<\/li><li>\n<strong>再确认用户实际关心什么<\/strong>。用户要的是整条响应是否恰当、有用、符合偏好，不是单个 token 像不像训练语料。目标错位是后训练存在的第一推动力。\n<\/li><li>\n<strong>区分行为模仿与偏好选择两类信号<\/strong>。示范数据告诉模型「这样回答」，比较数据告诉模型「这个回答比那个好」；两类信号形式不同，训练步骤也分开。\n<\/li><li>\n<strong>确认资源约束<\/strong>。预训练需要海量数据、算力与人才；后训练是在已有权重上继续训练，资源量级低一个层次。这决定应用方通常不碰预训练，但可能参与后训练适配。\n<\/li><li>\n<strong>确认对齐的边界<\/strong>。后训练只能调动模型已具备的知识与行为倾向，不能注入模型从未见过的事实；超出知识边界的对齐会制造新的幻觉。\n<\/ol>\n<p>依赖链方向：预训练目标（token 预测）→ 与用户目标（响应质量）错位 → SFT 示范对话行为 → 偏好微调选择人类更喜欢的响应 → 后训练只解锁已有能力、不新增知识。<\/p>\n<h2>正向推导：从预训练缺口到两段对齐<\/h2>\n<h3>第一步：观察预训练模型的两个问题<\/h3>\n<p>原书指出，自监督预训练模型通常存在两个问题（PDF 第 99 页）。其一，自监督优化的是文本补全而非对话：输入「How to make pizza」，模型可能补更多上下文、追加后续问题，而不一定给出制作步骤。其二，数据无差别来自互联网，输出可能带种族主义、性别歧视、粗鲁或错误内容。后训练的目标就是分别处理这两类问题。<\/p>\n<h3>第二步：监督微调补上对话行为<\/h3>\n<p>模型会模仿训练数据。要让模型给出恰当响应，就向它展示恰当响应的示例，格式为（提示词，响应）。这种行为克隆的机制是：模型在示范数据上调整参数，遇到同类请求时复现示范中的响应方式。示范数据要覆盖期望处理的各类请求：问答、摘要、翻译等；原书引用 InstructGPT 微调任务类型分布说明不同请求类型都要有对应示范（PDF 第 103 页）。<\/p>\n<p>标注质量在这一步起决定作用。与传统数据标注不同，对话示范常需要判断响应是否得体、结构是否合理；优秀标注员对 AI 学习智能对话的重要性，相当于优秀教师对人类学习的重要性。数据格式上，SFT 需要（指令，响应）对；偏好微调需要（提示词，胜出响应，落败响应）对；训练奖励模型还可用（（指令，响应），分数）格式（PDF 第 383 页）。<\/p>\n<h3>第三步：偏好微调补上选择排序<\/h3>\n<p>SFT 之后，模型能给出像样响应，但多个候选响应之间哪个更可取，仍未经过比较训练。偏好微调收集人类或 AI 的成对比较：响应 A 优于响应 B。奖励模型从比较信号中学到偏好度量，优化过程再据此调整模型，让高分响应概率上升。RLHF 用人类反馈训练奖励模型；DPO 绕过显式奖励模型，直接在偏好对上优化；RLAIF 把反馈来源换成 AI（PDF 第 100 页）。<\/p>\n<h3>第四步：比较两段训练的目标差异<\/h3>\n<p>SFT 的目标是复现示范行为，损失对照的是正确响应；偏好微调的目标是在候选中排序，损失对照的是相对好坏。前者解决「会不会按要求回答」，后者解决「回答得是否讨人喜欢」。预训练优化 token 级质量，用户关心响应级整体质量；后训练把模型从文本补全器拉向对话助手。<\/p>\n<h3>第五步：资源量级对照<\/h3>\n<p>原书引用 InstructGPT 论文：后训练只占 2% 计算资源，预训练占 98%（PDF 第 100 页）。这组数字说明后训练是「解锁已有能力」而非「重新学习知识」：模型的知识容量来自预训练，后训练改变的是调用知识的方式与输出倾向。推论是：应用方做适配时，优先考虑提示与上下文；只有行为或结构不满足要求时才动用微调；微调能改倾向，不能补训练数据里没有的事实。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：比萨请求的三种补全<\/h3>\n<p>输入「How to make pizza」，模型可能补出：补充上下文「for a family of six?」；追加问题「What ingredients do I need?」；直接给出制作步骤。前两种是文本补全，第三种是对话响应。SFT 示范数据把第三种标为目标行为，模型在同类请求上复现该模式；偏好微调再在多个合法响应中选出更清晰、完整的那个。<\/p>\n<h3>算例 2：资源占比口径<\/h3>\n<p>若一次完整模型训练总计算量记为 100 份，预训练约 98 份，后训练约 2 份。应用场景中，微调一个小模型准备数据、调参数、做评估的投入，与从零预训练一个基座模型不在同一量级；但这 2% 仍需要标注成本、训练知识与部署维护，门槛不可忽略（第 7 章展开）。<\/p>\n<h3>算例 3：偏好信号的形式<\/h3>\n<p>成对数据条目：提示词 <span class=\"katex-inline\">q<\/span>，胜出响应 <span class=\"katex-inline\">r^+<\/span>，落败响应 <span class=\"katex-inline\">r^-<\/span>。奖励模型输出 <span class=\"katex-inline\">R(q,r)<\/span>，训练目标让 <span class=\"katex-inline\">R(q,r^+)&gt;R(q,r^-)<\/span>；优化阶段模型倾向生成高奖励响应。与 SFT 的单条正确响应不同，偏好数据本身不含「标准答案长什么样」，只含相对次序。<\/p>\n<h3>算例 4：幻觉假设与对齐数据<\/h3>\n<p>若标注员写出的响应使用了模型不具备的知识，SFT 等于示范模型编造它不知道的内容；这是幻觉第二假设「内部知识与标注员知识不匹配」的机制（PDF 第 130 页）。缓解方向是让模型知道响应依据了哪些知识，或训练中加入事实与反事实信号；现实中逐条核查标注知识来源难以做到。<\/p>\n<h3>算例 5：RLHF 与幻觉的方向对照<\/h3>\n<p>OpenAI 内部观察到 RLHF 有助减少幻觉；InstructGPT 论文却显示 RLHF 加 SFT 模型幻觉更严重，但人类标注员总体更喜欢 RLHF 模型（PDF 第 131 页）。两组现象并不矛盾：偏好对齐改善的是得体性、有用性等综合体验，幻觉变化受数据与流程影响，方向不保证一致。评估时不能用「用户更喜欢」替代「事实更准确」。<\/p>\n<h3>算例 6：术语口径<\/h3>\n<p>有人用 instruction finetuning 单指 SFT，有人同时指 SFT 加偏好微调；本书为避免歧义不使用该术语（PDF 第 100 页）。跨团队沟通时，先确认对方说的「指令微调」覆盖到哪一段，再讨论数据与流程。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>跳过 SFT 直接做偏好微调<\/strong>：模型还不会按对话格式响应，比较信号缺少可比较的合格候选；偏好排序无从建立，对齐效果落空。\n<\/li><li>\n<strong>只做 SFT 不做偏好微调<\/strong>：模型能给出正确格式响应，但多个响应之间的取舍未经人类偏好训练，输出风格、得体性不稳定。\n<\/li><li>\n<strong>后训练数据加入模型未知的事实<\/strong>：行为克隆把缺失知识一并复制，模型学会自信编造；这比没有示范更危险，因为输出形式流畅。\n<\/li><li>\n<strong>假设后训练能替代预训练补知识<\/strong>：在小规模后训练数据上反复调权重，无法获得大规模预训练覆盖的语言与常识；应用缺知识时应走检索上下文，而非指望微调注入事实。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ol><li>\n预训练优化什么目标？用户实际关心什么？两者错位在哪一步？\n<\/li><li>\nSFT 的输入输出数据格式是什么？它模仿的是行为还是偏好排序？\n<\/li><li>\n偏好微调的三类技术路线（RLHF、DPO、RLAIF）差别在反馈来源还是优化路径？\n<\/li><li>\n为什么说后训练是解锁已有能力，而不是新增知识？\n<\/li><li>\nRLHF 减少幻觉与加重幻觉两组观察为什么可以同时成立？\n<\/ol>\n<h2>补充推演：边界案例与常见疑问<\/h2>\n<h3>案例 A：两段后训练在产物上的差别<\/h3>\n<p>SFT 产物是一份能复现示范行为的模型权重：给定指令，输出符合格式与口径的响应。偏好微调产物是在多个候选间排序更符合人类偏好的模型权重：它不指定唯一标准答案，只让高分响应概率上升。评估时两者对照对象不同：SFT 对正确响应算损失，偏好微调对成对响应算排序损失。混淆两段训练的目标，会在数据准备阶段就放错格式。<\/p>\n<h3>案例 B：后训练资源占比的推论口径<\/h3>\n<p>2% 与 98% 的资源对比说明后训练是解锁已有能力，不创造新知识（PDF 第 100 页）。推论一：应用方做适配时优先提示与上下文，微调是权重侧的最后手段。推论二：后训练数据的门槛不在算力而在标注质量与判断口径；投入 2% 的资源仍需要合格标注员与评估指南。推论三：基座模型换代后，后训练版本要重新对齐，旧适配不会自动继承新基座的全部改进。<\/p>\n<h3>案例 C：偏好信号为什么不解释原因<\/h3>\n<p>奖励模型记录 A 优于 B，但不记录「A 好在哪里」。人类标注时通常只给相对次序，理由散落在对话里。这带来一个边界：偏好对齐改善的是整体倾向，不能保证模型理解每条响应的优点；评估时要另设指南与示例，把「哪里好」拆成可核对的维度。<\/p>\n<h3>案例 D：RLHF 与幻觉的方向对照展开<\/h3>\n<p>OpenAI 内部观察到 RLHF 有助减少幻觉；InstructGPT 论文显示 RLHF 加 SFT 模型幻觉更严重，但人类标注员总体更喜欢 RLHF 模型（PDF 第 131 页）。两者不矛盾：偏好对齐的评分维度是得体性、有用性、连贯性等综合体验，幻觉是事实准确性维度；一个维度改善不带动另一个维度。落地评估时，「用户更喜欢」与「事实更准确」必须分别设指标，不能互相替代。<\/p>\n<h3>案例 E：跳过步骤的训练顺序风险<\/h3>\n<p>模型不会对话时直接做偏好排序，候选响应还没有形成稳定格式，比较信号缺少可比较对象；偏好微调反过来要求先有合格候选。现实中两段训练数据可部分复用，但流程顺序不能颠倒。反向边界：部分模型可以省略某一步骤，原书明确三段组合是主流方案而非唯一方案（PDF 第 101 页）；判断省略哪一段，要回到该模型的能力缺口。<\/p>\n<h3>案例 F：监督数据知识边界的后果<\/h3>\n<p>标注员写出模型不具备的知识，行为克隆会把编造习惯复制进模型。缓解方向包括让模型知道响应依据哪些知识、训练中加入事实与反事实信号；现实中逐条核查标注知识来源难以做到。这一边界说明后训练不能消除预训练知识缺口，事实缺口仍要靠检索上下文补。<\/p>\n<h3>案例 G：后训练产物与评估、检索的接口<\/h3>\n<p>后训练完成的模型进入评估环节：SFT 对照正确响应，偏好微调对照成对优劣（c06、c07）。若任务缺事实知识，后训练不补缺口，仍要回到检索上下文（c09）。后训练数据格式与数据集工程一一对应：（指令，响应）与（提示词，胜出/落败）两类样本在 c12 策展。判断一段训练属于哪一步，先看信号是示范正确响应还是比较优劣，再看产物要解决行为问题还是偏好问题。<\/p>\n<h3>案例 H：术语混用的沟通成本<\/h3>\n<p>instruction finetuning 在不同团队口径不同：有人单指 SFT，有人覆盖 SFT 加偏好微调。跨团队讨论时先确认对方术语覆盖到哪一段，再谈数据与流程；本书为避免歧义不使用该术语（PDF 第 100 页）。术语口径不清会导致数据准备错位：把偏好数据当 SFT 示范，或反过来，训练目标与样本形式对不上。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n一个模型只会续写句子、不会回答问题，缺的是 SFT 还是偏好微调？为什么？\n<\/li><li>\n（指令，响应）对与（提示词，胜出响应，落败响应）对分别服务哪一段训练？\n<\/li><li>\n后训练资源占比低，是否意味着应用方可以随意启动微调？还缺哪些条件？\n<\/li><li>\n标注员知识超出模型知识时，SFT 数据会带来什么后果？\n<\/li><li>\n「用户更喜欢」能否作为「事实更准确」的评估依据？还需要什么指标？\n<\/ol><\/div><\/details>", "c03": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.110<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">预训练、监督微调与偏好微调：后训练对齐的两段流程<\/a><\/span><\/div><h1>采样与概率生成：温度、top-k、top-p 与不一致性、幻觉的概率根源<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书 2.4 采样、2.4.1 采样基础、2.4.2 采样策略、2.4.5 AI 的概率特性，PDF 第 110–117、126–132 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>模型生成输出为什么有时一致、有时发散？同一个问题问两遍，答案为什么可能不同？理解输出的概率性质，是解释不一致性与幻觉、选择采样参数的前提。这个概念回答：模型怎样从 logit 得到 token 概率，温度、top-k、top-p 各自改变分布的哪一部分，概率性通过什么路径演变成不一致性和幻觉。<\/p>\n<h2>定义<\/h2>\n<p><strong>logit 向量<\/strong>：给定输入，神经网络输出的向量，每个分量对应词表中一个 token；logit 本身不是概率，总和不为 1 且可为负（PDF 第 111 页）。<strong>softmax<\/strong>：把 logit 转成非负、和为 1 的概率分布的层；第 <span class=\"katex-inline\">i<\/span> 个 token 概率 <span class=\"katex-inline\">p_i=\\frac{\\exp(z_i)}{\\sum_j\\exp(z_j)}<\/span>。<\/p>\n<p><strong>温度 <span class=\"katex-inline\">T<\/span><\/strong>：softmax 之前对 logit 做除法缩放的常数。调整后 logit 为 <span class=\"katex-inline\">z_i/T<\/span>，再做 softmax。<span class=\"katex-inline\">T<\/span> 越高分布越平，常见 token 概率被压低、稀有 token 获得机会；<span class=\"katex-inline\">T<\/span> 越低分布越尖，输出越一致也越单调（PDF 第 112 页）。<\/p>\n<p><strong>top-k<\/strong>：只保留概率最高的 <span class=\"katex-inline\">k<\/span> 个 logit，仅对这 <span class=\"katex-inline\">k<\/span> 个做 softmax；<span class=\"katex-inline\">k<\/span> 通常取 50 到 500，远小于词表大小；<span class=\"katex-inline\">k<\/span> 越小输出越可预测也越单调（PDF 第 115 页）。<\/p>\n<p><strong>top-p（核采样，nucleus sampling）<\/strong>：按概率从高到低累加候选概率，直到累计达到 <span class=\"katex-inline\">p<\/span>，只在该集合内采样；候选数量随上下文动态变化，常用 <span class=\"katex-inline\">p<\/span> 在 0.9 到 0.95 之间（PDF 第 116 页）。<\/p>\n<p><strong>不一致性<\/strong>：相同输入给出不同输出，或输入略有差别导致输出大相径庭。<strong>幻觉<\/strong>：模型给出缺乏事实依据的响应（PDF 第 126–127 页）。<\/p>\n<p>正例：需要创造性的场景取折中温度；需要稳定可复现的场景取低温或 argmax。反例：把温度当成「模型自信程度」的读数——温度是采样调节参数，不直接表示模型对答案的把握。<\/p>\n<h2>原理推导<\/h2>\n<p>分类模型在固定类别上判概率，阈值判定即可；语言模型要逐 token 生成序列，每一步先算词表概率分布，再按分布抽取。贪心采样永远取概率最高 token，输出一致但枯燥；纯按分布采样则保留多样性。温度在指数函数前缩放 logit 差值：<span class=\"katex-inline\">z_i/T<\/span> 使差值被 <span class=\"katex-inline\">1/T<\/span> 倍乘，<span class=\"katex-inline\">T\\to0<\/span> 时差值被放大、分布趋近 one-hot，<span class=\"katex-inline\">T<\/span> 增大时差值被压缩、分布趋近均匀。<\/p>\n<p>top-k 与 top-p 从候选集合侧限制采样：top-k 固定候选数，top-p 按累计概率动态圈定。两者都减少低概率长尾 token 的干扰，同时保留上下文相关的候选范围。<\/p>\n<p>概率性沿两条路径造成问题。一是不一致性：每步随机抽取，路径不同则输出不同；硬件数值差异也会影响结果。二是幻觉：第一步偏离事实的 token 进入后续上下文，模型把自身生成内容与用户输入同等对待，后续分布在偏离序列上继续展开，形成滚雪球式错误（PDF 第 129–130 页）。幻觉第二类假设是监督数据使用了标注员具备而模型不具备的知识，行为克隆把缺失知识复制进模型（PDF 第 130 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：为具体任务选温度、top-k、top-p；解释相同输入两次运行结果不同；判断缓解手段作用在链条哪一环。\n<\/li><li>\n边界一：固定采样变量与随机种子不能保证输出完全一致。自托管硬件执行方式与数值范围有差别；API 提供商的硬件控制权不在应用方（PDF 第 128 页）。\n<\/li><li>\n失败案例一：把低温当万能修复。温度压低只减少采样随机性，不能纠正模型知识错误；事实性问题上，低温输出只是更一致地坚持错误。\n<\/li><li>\n失败案例二：假设模型能自知是否掌握知识。「知道自己知道什么」本身是大胆主张；要求模型「不确定就说不知道」只是提示层缓解，不能替代检索与事实核查（PDF 第 131–132 页）。\n<\/li><li>\n边界二：概率性在创造性任务上是优势。头脑风暴、设计发散需要跳出常规路径；同一特性在事实性任务上才成为风险。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>温度 vs top-k/top-p<\/strong>：温度重塑整个分布的尖锐程度；top-k、top-p 裁剪候选集合。温度影响所有 token 的相对概率，后两者只决定哪些长尾进入候选。\n<\/li><li>\n<strong>贪心采样 vs 低温采样<\/strong>：贪心直接 argmax，不做 softmax 采样；低温是分布趋近 one-hot 的近似，工程上温度设 0 常直接实现为 argmax（PDF 第 113 页）。\n<\/li><li>\n<strong>不一致性 vs 幻觉<\/strong>：不一致性源于采样随机，表现为同输入不同输出；幻觉源于模型把生成内容当事实或知识不匹配，表现为响应缺事实依据。两者可叠加，但成因不同。\n<\/li><li>\n<strong>对数概率 vs 概率<\/strong>：极小概率在数值上下溢被舍入为零，对数尺度缓解该问题；许多提供商只返回前 20 个 token 的对数概率，或不公开（PDF 第 114–115 页）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 的对齐流程决定采样所依据的基础分布。后继：c04 的困惑度从分布不确定性角度度量同一预测过程；c08 提示工程在采样分布之外用指令约束输出；c09 检索通过补充上下文改变条件分布，减少偏离分支；c13 的解码瓶颈与采样逐 token 生成直接相关。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（采样与概率生成：温度、top-k、top-p 与不一致性、幻觉的概率根源）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：从 logit 到采样分布，再到不一致性与幻觉<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清采样机制，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先确认模型输出的原始形式<\/strong>。语言模型最后一层给出的是 logit 向量，分量对应词表 token；logit 可正可负、和不为 1，不能直接当概率。前提不成立，softmax 这一步就无从谈起。\n<\/li><li>\n<strong>再确认生成是逐 token 的序列过程<\/strong>。自回归模型一次出一个 token，下一步条件分布以上文（含已生成 token）为条件；每一步的采样随机性都会进入后续上下文。\n<\/li><li>\n<strong>区分分布形状与候选集合两类调节<\/strong>。温度改变概率分布的尖锐程度，top-k/top-p 改变进入候选的 token 范围；两者作用位置不同，不能互相替代。\n<\/li><li>\n<strong>把输出问题分成两类成因<\/strong>。不一致性来自采样随机；幻觉来自自我欺骗式扩展或知识不匹配。缓解手段必须对准成因，不能用同一招处理两类问题。\n<\/ol>\n<p>依赖链方向：logit 向量 → softmax 概率分布 → 温度缩放与候选裁剪 → 逐 token 采样 → 随机路径造成不一致；偏离 token 进入条件分布 → 滚雪球扩展造成幻觉。<\/p>\n<h2>正向推导：从 logit 到一次输出<\/h2>\n<h3>第一步：logit 到概率<\/h3>\n<p>设词表大小为 <span class=\"katex-inline\">N<\/span>，模型输出 logit 向量 <span class=\"katex-inline\">z=(z_1,\\dots,z_N)<\/span>。softmax 定义 <span class=\"katex-inline\">p_i=\\frac{\\exp(z_i)}{\\sum_{j=1}^N\\exp(z_j)}<\/span>。指数保证非负，分母归一保证 <span class=\"katex-inline\">\\sum_i p_i=1<\/span>。logit 差值决定相对概率：<span class=\"katex-inline\">z_i<\/span> 越大，<span class=\"katex-inline\">p_i<\/span> 越高，但 logit 本身不携带概率含义（PDF 第 111 页）。<\/p>\n<h3>第二步：温度缩放<\/h3>\n<p>采样前先把 logit 除以温度 <span class=\"katex-inline\">T<\/span>：调整后 logit 为 <span class=\"katex-inline\">z_i/T<\/span>，再做 softmax。考察两个候选的比值：<span class=\"katex-inline\">\\frac{p_i}{p_j}=\\exp((z_i-z_j)/T)<\/span>。<span class=\"katex-inline\">T<\/span> 减小，差值 <span class=\"katex-inline\">(z_i-z_j)<\/span> 被放大，比值拉开，分布变尖；<span class=\"katex-inline\">T<\/span> 增大，差值被压缩，比值趋近 1，分布变平。<span class=\"katex-inline\">T\\to0<\/span> 时最高 logit 的概率趋近 1，工程实现上直接取 argmax，跳过 softmax 采样（PDF 第 113 页）。<\/p>\n<h3>第三步：候选集合裁剪<\/h3>\n<p>top-k 在 softmax 前只保留排名前 <span class=\"katex-inline\">k<\/span> 的 logit，其余不参与；<span class=\"katex-inline\">k<\/span> 固定，与上下文无关。top-p 先按概率降序排列，累加直到累计概率达到 <span class=\"katex-inline\">p<\/span>，集合大小随上下文变化：回答 yes/no 时候选可能只有两个，开放问题时候选更多（PDF 第 116 页）。min-p 则设定单个 token 必须达到的最小概率阈值。裁剪的共同效果：压低长尾干扰，同时保留与当前上下文相关的候选。<\/p>\n<h3>第四步：逐 token 采样与不一致性<\/h3>\n<p>每一步按分布抽取，抽到低概率 token 的概率虽低但不为零。相同输入两次运行，随机数路径不同，输出可能不同；输入仅大小写、换行略有差别，条件分布也可能被推到不同分支。原书顾问案例中，三个月客户支持请求里五分之一与模型不一致性有关（PDF 第 127 页）。缓解手段按链条定位：缓存相同请求答案；固定温度、top-p、top-k；固定随机种子，即采样随机数生成器的起点。<\/p>\n<h3>第五步：偏离 token 如何滚成幻觉<\/h3>\n<p>模型不区分用户提供的输入与自身刚生成的内容。若第一步生成一个略偏离事实的句子，后续 token 的条件分布建立在「原问题 + 这句偏离序列」之上；错误假设被后续输出合理化，形成滚雪球式幻觉。原书引用研究：最初错误假设可导致模型在本来能答对的问题上犯错，例如声称 9677 能被 13 整除（PDF 第 130 页）。第二类假设来自监督环节：示范响应使用了标注员知识而模型不具备，行为克隆把编造习惯复制下来（PDF 第 130 页）。<\/p>\n<h3>第六步：概率性的两面<\/h3>\n<p>同一机制在创造性任务上是优势：头脑风暴、设计发散需要探索常规路径之外的可能；在事实性任务上，概率性输出不可接受，需要检索补上下文、提示约束、评估核查共同压制偏离分支。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：两候选温度对照（原书算例，PDF 第 113 页）<\/h3>\n<p>logit 为 <span class=\"katex-inline\">[1,2]<\/span>，候选 A、B。<span class=\"katex-inline\">T=1<\/span>：<span class=\"katex-inline\">\\exp(1)\\approx2.718<\/span>，<span class=\"katex-inline\">\\exp(2)\\approx7.389<\/span>，<span class=\"katex-inline\">p_A\\approx0.27<\/span>，<span class=\"katex-inline\">p_B\\approx0.73<\/span>。<span class=\"katex-inline\">T=0.5<\/span>：调整后 logit <span class=\"katex-inline\">[2,4]<\/span>，<span class=\"katex-inline\">\\exp(2)\\approx7.389<\/span>，<span class=\"katex-inline\">\\exp(4)\\approx54.598<\/span>，<span class=\"katex-inline\">p_A\\approx0.12<\/span>，<span class=\"katex-inline\">p_B\\approx0.88<\/span>。温度减半，B 的概率从 73% 升到 88%。<\/p>\n<h3>算例 2：温度趋向两端<\/h3>\n<p><span class=\"katex-inline\">T\\to0<\/span>：<span class=\"katex-inline\">(z_B-z_A)/T\\to+\\infty<\/span>，<span class=\"katex-inline\">p_B\\to1<\/span>，输出退化为贪心。<span class=\"katex-inline\">T<\/span> 很大：<span class=\"katex-inline\">(z_B-z_A)/T\\to0<\/span>，<span class=\"katex-inline\">p_A,p_B\\to0.5<\/span>，两候选等可能。温度是分布锐度旋钮，不是置信度读数。<\/p>\n<h3>算例 3：top-p 动态候选<\/h3>\n<p>token 概率示例：yes、maybe、no 等候选按概率降序排列。top-p=0.9 时累计到 90% 即停止，只考虑 yes、maybe；top-p=0.99 时再纳入 no（PDF 第 116 页）。对比 top-k：无论上下文如何，候选数恒为 <span class=\"katex-inline\">k<\/span>；top-p 在封闭问题上自动收窄，开放问题上自动放宽。<\/p>\n<h3>算例 4：对数概率与下溢<\/h3>\n<p>词表可达 100,000，许多 token 概率极小，常规浮点表示下溢被舍入为零；对数概率在对数尺度记录概率，缓解该问题。截至原书撰写时，OpenAI API 最多返回概率最高 20 个 token 的对数概率，2023 年 9 月起不再支持任意文本对数概率；Anthropic 未公开对数概率（PDF 第 114–115 页）。<\/p>\n<h3>算例 5：多步随机累积<\/h3>\n<p>设单步抽到偏离 token 的概率为 <span class=\"katex-inline\">q<\/span>，<span class=\"katex-inline\">n<\/span> 步内至少出现一次偏离的概率为 <span class=\"katex-inline\">1-(1-q)^n<\/span>。<span class=\"katex-inline\">q=0.02<\/span> 时，10 步内出现偏离的概率约 <span class=\"katex-inline\">1-0.98^{10}\\approx0.183<\/span>；100 步约 <span class=\"katex-inline\">1-0.98^{100}\\approx0.867<\/span>。链条越长，随机扰动累积越显著，这与智能体错误累积（c10）是同一类指数规律。<\/p>\n<h3>算例 6：不一致性缓解的边界<\/h3>\n<p>固定采样变量后，硬件执行指令的方式与可处理数值范围仍有差别；自托管可在一定程度上控制硬件，API 场景控制权在提供商（PDF 第 128 页）。因此「固定参数 → 输出可复现」只在统计意义上成立，不能当作强保证。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>每步都贪心 argmax<\/strong>：输出一致但枯燥，模型总用最常见词回答，创造性任务失去发散能力；事实性任务上也只是稳定复现错误。\n<\/li><li>\n<strong>完全不做候选裁剪，全词表按分布采样<\/strong>：长尾低概率 token 频繁进入序列，连贯性下降，计算上 softmax 全词表遍历开销也大。\n<\/li><li>\n<strong>模型能严格区分输入与自身生成<\/strong>：自我欺骗类幻觉失去扩展基础；现实中强化学习区分观察与动作、监督学习加入事实信号，正是在补这一区分能力（PDF 第 130 页）。\n<\/li><li>\n<strong>用低温解决事实错误<\/strong>：温度只改变采样随机性，不改变参数化知识；知识缺失时低温输出更一致地错，必须靠检索上下文或事实核查补救。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ol><li>\nlogit 为什么不能直接当概率？softmax 做了哪两件事？\n<\/li><li>\n温度升高和降低，分别把分布推向均匀还是 one-hot？比值公式里哪一项被缩放？\n<\/li><li>\ntop-k 与 top-p 在候选数量是否随上下文变化上有什么差别？\n<\/li><li>\n不一致性与幻觉的成因各是什么？缓解手段为什么不能混用？\n<\/li><li>\n为什么固定随机种子也不能保证两次输出逐字一致？\n<\/ol>\n<h2>补充推演：边界案例与常见疑问<\/h2>\n<h3>案例 A：温度旋钮与置信度的区别<\/h3>\n<p>温度是采样分布的调节参数，不代表模型对答案的把握程度。模型对某答案把握高，体现在最高概率 token 与次高 token 的 logit 差距大；温度只决定抽到高概率 token 的方式。把低温输出读作「更自信」会误判：低温只是减少采样随机，知识错误在低温下被稳定复现。<\/p>\n<h3>案例 B：top-k 与 top-p 的组合使用<\/h3>\n<p>两者可叠加：先按 top-k 限制候选上限，再按 top-p 在剩余候选里动态收窄。固定 top-k 保证长尾可控，top-p 保证开放问题上集合不会被少数 token 卡死。实际参数取值要在自己的任务上实验，原书给出的常用范围是 top-k 50–500、top-p 0.9–0.95（PDF 第 115–116 页），范围不是任务最优值。<\/p>\n<h3>案例 C：不一致性的三层来源<\/h3>\n<p>第一层采样随机：同一输入两次抽取路径不同。第二层输入扰动：大小写、换行、措辞轻微变化改变条件分布。第三层硬件数值：自托管执行指令与数值范围有差别，API 场景控制权在提供方（PDF 第 128 页）。前两层可由固定变量与种子缩小，第三层在 API 场景无法消除；评估时不能把复现性要求写成强保证。<\/p>\n<h3>案例 D：幻觉两条假设的缓解位置<\/h3>\n<p>自我欺骗假设：模型分不清输入与自身生成内容，缓解靠强化学习区分观察与动作、监督学习加入事实信号。知识不匹配假设：示范响应使用了标注员知识而模型不具备，缓解靠核查标注知识来源、训练数据事实约束。两条假设对应不同缓解动作，不能用「降低温度」同时处理。<\/p>\n<h3>案例 E：概率性在任务类型上的取舍<\/h3>\n<p>事实抽取、数据整理要求稳定可复现，低温与裁剪参数优先；头脑风暴、文案发散需要跳出常规路径，温度可抬高。同一模型在不同任务上应配不同采样参数；参数选择挂在第 4 章评估标准上，由评估集分数决定，而不是沿用默认值。<\/p>\n<h3>案例 F：对数概率接口的可得性<\/h3>\n<p>概率极小的 token 在常规浮点表示下溢为零，对数概率在对数尺度缓解该问题。截至原书撰写时，OpenAI API 最多返回概率最高 20 个 token 的对数概率，2023 年 9 月起不再支持任意文本对数概率；Anthropic 未公开对数概率（PDF 第 114–115 页）。依赖逐 token 概率分析的方案，要先确认所用提供商的接口边界。<\/p>\n<h3>案例 G：采样参数在产品配置中的落地<\/h3>\n<p>事实抽取类任务优先低温与候选裁剪，保证输出稳定；创意发散类任务可抬高温度，保留路径多样性；同一模型在不同任务上配不同参数。参数选择挂在评估集上：固定其他变量，对比不同温度、top-k、top-p 下的任务指标，再定默认值。默认参数来自提供商，不代表具体任务最优；上线后仍要按生产反馈回调。<\/p>\n<h3>案例 H：概率性与其他章节的边界<\/h3>\n<p>采样随机性是 c03 的机制层问题；提示词约束（c08）在分布之外引导输出，检索补充（c09）改变条件分布，微调（c11）调整基础分布。四类手段作用位置不同：不能用检索解决采样随机，也不能用低温纠正知识错误。排查输出波动时，先分清是采样路径、输入扰动还是知识缺口，再选对应手段。<\/p>\n<h3>案例 I：对数概率分析的限制<\/h3>\n<p>依赖逐 token 概率做置信度判断的方案，要先确认提供商接口是否返回对数概率；可得性随提供商与版本变化。接口不公开时，只能从输出一致性、人工抽查等间接路径判断，不能假设内部概率可读取。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n给定两候选 logit <span class=\"katex-inline\">[0,3]<\/span>，写出 <span class=\"katex-inline\">T=1<\/span> 与 <span class=\"katex-inline\">T=0.5<\/span> 下概率变化方向。\n<\/li><li>\n回答「只答 yes 或 no」的场景，top-p 相比 top-k 有什么优势？\n<\/li><li>\n幻觉的两类假设分别对应预训练阶段还是监督阶段？\n<\/li><li>\n对数概率为什么能缓解下溢？哪些提供商未公开该接口？\n<\/li><li>\n创造性任务与事实性任务对概率性的容忍度为什么不同？\n<\/ol><\/div><\/details>", "c04": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.140<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">采样与概率生成：温度、top-k、top-p 与不一致性、幻觉的概率根源<\/a><\/span><\/div><h1>语言建模指标：熵、交叉熵、困惑度与 BPC/BPB<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（原书 3.2 理解语言建模指标，3.2.1 熵、3.2.2 交叉熵、3.2.3 BPC 与 BPB、3.2.4 困惑度，PDF 第 140–144 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>评估模型时，论文和模型报告常给困惑度、交叉熵、BPC、BPB 一串数字；它们彼此是什么关系、越低代表什么、能不能跨模型直接比较，需要一套可推导的口径。这个概念解决：从分布不确定性出发，推出熵、交叉熵、困惑度的定义与换算，说明这些建模指标与下游任务表现之间是强相关而非等价。<\/p>\n<h2>定义<\/h2>\n<p><strong>熵 <span class=\"katex-inline\">H(P)<\/span><\/strong>：衡量一个 token 平均携带的信息量，即最有效编码时每个 token 平均所需比特数；分布越容易预测，熵越低（PDF 第 141 页）。Shannon 1951 年论文提出该概念，语言建模指标沿用至今。<\/p>\n<p><strong>交叉熵 <span class=\"katex-inline\">H(P,Q)<\/span><\/strong>：模型学到分布 <span class=\"katex-inline\">Q<\/span> 相对于真实分布 <span class=\"katex-inline\">P<\/span> 的预测难度，<span class=\"katex-inline\">H(P,Q)=H(P)+D_{\\mathrm{KL}}(P\\Vert Q)<\/span>（PDF 第 142 页）。它取决于两个因素：数据本身的可预测性（数据熵 <span class=\"katex-inline\">H(P)<\/span>），以及模型分布与真实分布的差异（KL 散度）。<\/p>\n<p><strong>困惑度 PPL<\/strong>：熵或交叉熵的指数形式，衡量预测下一个 token 时的不确定程度；不确定性越高，可能选项越多，困惑度越高（PDF 第 143 页）。<\/p>\n<p><strong>BPC（bits-per-character，每字符比特数）<\/strong>：按每 token 平均字符数归一的交叉熵；<strong>BPB（bits-per-byte，每字节比特数）<\/strong>：按字节归一的交叉熵（PDF 第 143 页）。<\/p>\n<p>正例：4 个等概率位置的语言，熵为 2 比特，困惑度为 4。反例：把 A 模型的 token 比特数与 B 模型直接比较——分词方法不同，每个 token 包含的字符数不同，token 口径不可比，必须换算到字符或字节。<\/p>\n<h2>原理推导<\/h2>\n<p>熵从编码角度定义：若编码方式最优，描述一个 token 平均要多少比特。只有 2 个 token 的语言用 1 比特即可区分，熵为 1；4 个 token 需要 2 比特，熵为 2；后者每个 token 携带信息更多，也更难预测（PDF 第 141 页）。<\/p>\n<p>交叉熵由两部分拼成：<span class=\"katex-inline\">H(P,Q)=-\\sum_i P(i)\\log_2 Q(i)<\/span>，拆成 <span class=\"katex-inline\">-\\sum_i P(i)\\log_2 P(i)+\\sum_i P(i)\\log_2\\frac{P(i)}{Q(i)}<\/span>，即数据熵加 KL 散度。模型完美学到训练分布时 <span class=\"katex-inline\">Q=P<\/span>，KL 散度为 0，交叉熵等于数据熵；否则交叉熵高出分布差异的代价。训练目标即最小化交叉熵。<\/p>\n<p>困惑度取指数：以 2 为底时 <span class=\"katex-inline\">\\mathrm{PPL}=2^{H(P,Q)}<\/span>。交叉熵每增加 1 比特，困惑度翻倍。BPC 把每 token 比特数除以每 token 平均字符数；BPB 再按字符编码位数换算。BPB 为 3.43 表示用 3.43 比特表示原始数据每字节（8 比特），文本可压到原大小一半以下（PDF 第 143 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：读模型报告时判断建模质量；理解困惑度升降的含义；在评估与数据去重等场景选用指标。\n<\/li><li>\n边界一：建模指标与下游任务表现只有强相关，不能完全等价。原书明确两者存在很强相关性，但语言建模性能并不能完全解释下游任务表现，仍是活跃研究领域（PDF 第 140 页）。\n<\/li><li>\n失败案例一：跨分词方案比 token 比特数。不同模型分词为词、字符或子词，token 口径不同；不换算到 BPC/BPB，比较没有意义。\n<\/li><li>\n失败案例二：在训练数据上报告交叉熵。模型见过的数据上指标偏低，不代表生产数据表现；数据与训练分布越接近，模型表现越好，评测必须面向新数据。\n<\/li><li>\n边界二：交叉熵不对称。<span class=\"katex-inline\">H(P,Q)<\/span> 与 <span class=\"katex-inline\">H(Q,P)<\/span> 不同，不能互换（PDF 第 142 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>熵 vs 交叉熵<\/strong>：熵描述真实分布自身的不确定度；交叉熵描述模型分布预测真实分布的难度，含模型误差项。\n<\/li><li>\n<strong>交叉熵 vs 困惑度<\/strong>：两者同一信息的线性与指数口径；交叉熵单位比特，困惑度等价于「平均候选选项数」。\n<\/li><li>\n<strong>BPC vs BPB<\/strong>：归一分母不同，前者按字符、后者按字节；字符编码方案（ASCII 7 比特、UTF-8 8–32 比特）影响 BPB 换算。\n<\/li><li>\n<strong>建模指标 vs 功能指标<\/strong>：建模指标看预测难度，功能指标看任务是否完成；代码生成看测试通过，翻译看参考相似度，二者不可互相替代。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c03 的概率分布是这些指标的计算对象。后继：c05 的精确评估在建模指标之外补充任务口径；c07 评估标准把建模指标放在领域能力一侧；c12 数据质量可用困惑度等指标辅助判断样本难度；c13 推理吞吐与建模指标无关，但共享同一套 token 计量口径。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（语言建模指标：熵、交叉熵、困惑度与 BPC/BPB）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：熵、交叉熵、困惑度与归一化指标的换算链<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清四个指标的关系，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先确认分布的离散表示<\/strong>。语言模型对词表中每个 token 给出概率，真实分布 <span class=\"katex-inline\">P<\/span> 与模型分布 <span class=\"katex-inline\">Q<\/span> 都是离散概率向量，分量非负、和为 1。\n<\/li><li>\n<strong>再确认度量的是预测难度<\/strong>。指标回答「预测下一个 token 有多难」，不是任务完成与否；任务口径由功能正确性等另一套指标承担。\n<\/li><li>\n<strong>区分数据固有难度与模型误差<\/strong>。交叉熵里既有数据本身的熵，也有模型分布偏离真实分布的代价；把两项拆开，才能解释指标升降来自哪一侧。\n<\/li><li>\n<strong>确认分词口径会影响可比性<\/strong>。token 是分词结果，不同模型分词粒度不同；跨模型比较必须归一到字符或字节。\n<\/ol>\n<p>依赖链方向：离散概率分布 → 编码所需比特（熵）→ 模型预测难度（交叉熵 = 熵 + KL 散度）→ 指数口径（困惑度）→ 按字符/字节归一（BPC/BPB）。<\/p>\n<h2>正向推导：从编码比特到困惑度<\/h2>\n<h3>第一步：熵的编码含义<\/h3>\n<p>Shannon 把熵定义为：以最有效方式把语言转成二进制数字时，每个字母平均所需的二进制数字数量（PDF 第 141 页）。设分布 <span class=\"katex-inline\">P<\/span> 在候选 <span class=\"katex-inline\">i<\/span> 上概率 <span class=\"katex-inline\">P(i)<\/span>，熵 <span class=\"katex-inline\">H(P)=-\\sum_i P(i)\\log_2 P(i)<\/span>。直觉对照：2 个 token 的语言，1 比特即可区分，熵为 1；4 个 token 需要 2 比特，熵为 2。候选越少越容易预测，熵越低；候选越多每个 token 携带信息越多，熵越高。<\/p>\n<h3>第二步：交叉熵的两项分解<\/h3>\n<p>模型分布 <span class=\"katex-inline\">Q<\/span> 对真实分布 <span class=\"katex-inline\">P<\/span> 的交叉熵 <span class=\"katex-inline\">H(P,Q)=-\\sum_i P(i)\\log_2 Q(i)<\/span>。加一项减一项： <span class=\"katex-inline\">H(P,Q)=-\\sum_i P(i)\\log_2 P(i)+\\sum_i P(i)\\log_2\\frac{P(i)}{Q(i)}<\/span>。 第一项是 <span class=\"katex-inline\">H(P)<\/span>，第二项是 KL 散度 <span class=\"katex-inline\">D_{\\mathrm{KL}}(P\\Vert Q)<\/span>。于是 <span class=\"katex-inline\">H(P,Q)=H(P)+D_{\\mathrm{KL}}(P\\Vert Q)<\/span>（PDF 第 142 页）。<\/p>\n<p>推论：<span class=\"katex-inline\">Q=P<\/span> 时 KL 为 0，交叉熵等于数据熵，达到该数据上的下界；<span class=\"katex-inline\">Q<\/span> 偏离 <span class=\"katex-inline\">P<\/span> 越远，KL 越大，交叉熵越高。训练目标就是最小化交叉熵，即缩小分布差异。交叉熵不对称：<span class=\"katex-inline\">H(P,Q)\\neq H(Q,P)<\/span>，两项位置不能互换。<\/p>\n<h3>第三步：困惑度的指数口径<\/h3>\n<p>困惑度定义为交叉熵的指数形式。以 2 为底：<span class=\"katex-inline\">\\mathrm{PPL}=2^{H(P,Q)}<\/span>。若交叉熵 2 比特，PPL <span class=\"katex-inline\">=2^2=4<\/span>，对应 4 个等概率候选的选择难度。交叉熵每增加 1 比特，困惑度翻倍；困惑度可理解为模型预测时面对的「平均候选数」。框架实现常用自然对数为底，此时指数以 <span class=\"katex-inline\">e<\/span> 为底；比特与 nat 口径容易混淆，报告指标时要注明底数（PDF 第 143 页）。<\/p>\n<h3>第四步：BPC 与 BPB 归一化<\/h3>\n<p>不同模型分词不同，token 比特数不可直接比。设每 token 平均含 <span class=\"katex-inline\">c<\/span> 个字符，BPC <span class=\"katex-inline\">=H(P,Q)/c<\/span>。BPB 再按字符编码位数换算：若字符为 7 比特（ASCII），BPB <span class=\"katex-inline\">=\\mathrm{BPC}/(7/8)<\/span>。例：BPC 为 3，BPB <span class=\"katex-inline\">\\approx3/(7/8)\\approx3.43<\/span>（PDF 第 143 页）。BPB 3.43 表示每字节原始数据用 3.43 比特表示，文本可压到原大小一半以下。<\/p>\n<h3>第五步：指标与下游任务的关系<\/h3>\n<p>建模指标与下游表现强相关：模型捕获训练数据分布越好，训练交叉熵越低，下游通常越好。但原书提醒两者不能完全等价，仍是活跃研究领域（PDF 第 140 页）。评测时数据越接近训练分布，表现越好；在训练集上算指标会低估真实难度。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：四位置语言的熵与困惑度<\/h3>\n<p>4 个等概率位置（左上、右上、左下、右下），<span class=\"katex-inline\">P(i)=1/4<\/span>。<span class=\"katex-inline\">H(P)=-4\\times\\frac14\\log_2\\frac14=2<\/span> 比特。完美模型 <span class=\"katex-inline\">Q=P<\/span>，交叉熵 2 比特，PPL <span class=\"katex-inline\">=2^2=4<\/span>（PDF 第 143 页）。若模型把概率集中到错误候选，交叉熵上升，PPL 大于 4。<\/p>\n<h3>算例 2：KL 散度代价<\/h3>\n<p>设 <span class=\"katex-inline\">P=(0.5,0.5)<\/span>，模型 <span class=\"katex-inline\">Q=(0.9,0.1)<\/span>。<span class=\"katex-inline\">H(P)=1<\/span> 比特。<span class=\"katex-inline\">D_{\\mathrm{KL}}(P\\Vert Q)=0.5\\log_2(0.5/0.9)+0.5\\log_2(0.5/0.1)\\approx0.5\\times(-0.848)+0.5\\times2.322\\approx0.737<\/span> 比特。交叉熵 <span class=\"katex-inline\">\\approx1.737<\/span> 比特，PPL <span class=\"katex-inline\">\\approx2^{1.737}\\approx3.34<\/span>。模型偏差把 PPL 从 2 推到 3.34。<\/p>\n<h3>算例 3：比特翻倍对照<\/h3>\n<p>交叉熵 3 比特对应 PPL 8；升到 4 比特 PPL 16；升到 5 比特 PPL 32。线性增加 1 比特，困惑度乘 2，这是指数口径的直接后果。<\/p>\n<h3>算例 4：分词口径不可比<\/h3>\n<p>模型甲按词分词，每 token 平均 1.3 词；模型乙按字符分词。即使两者每 token 比特数接近，每字符信息密度不同；直接比 token 比特会误判优劣。换算 BPC 后再比较，BPB 进一步消除字符编码差异。<\/p>\n<h3>算例 5：压缩率口径<\/h3>\n<p>BPB 3.43，原始字节 8 比特，压缩后占比 <span class=\"katex-inline\">3.43/8\\approx0.43<\/span>，即压到原大小约 43%。BPB 越低，模型压缩文本效率越高；这也是交叉熵在压缩场景的直接解释。<\/p>\n<h3>算例 6：评测数据分布影响<\/h3>\n<p>训练数据熵 <span class=\"katex-inline\">H(P)<\/span> 固定；换到与训练分布差距大的生产数据，<span class=\"katex-inline\">Q<\/span> 偏离新分布，KL 项增大，交叉熵与 PPL 同步上升。因此同一模型在不同评测集上 PPL 不可直接横比，必须注明数据口径。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>把困惑度当任务正确率<\/strong>：PPL 低只说明预测下一个 token 准，不等于代码能跑、翻译通顺；任务口径仍要功能正确性或参考相似度评估。\n<\/li><li>\n<strong>在训练集上报 PPL<\/strong>：模型见过样本，KL 项被压低，指标偏乐观；换到留出集或生产流量，真实难度才显现。\n<\/li><li>\n<strong>跨分词方案直接比 token 比特<\/strong>：分词粒度差异被误当成模型能力差异；归一到 BPC/BPB 后结论可能反转。\n<\/li><li>\n<strong>交换 <span class=\"katex-inline\">P<\/span> 与 <span class=\"katex-inline\">Q<\/span> 位置算交叉熵<\/strong>：KL 散度不对称，<span class=\"katex-inline\">H(Q,P)<\/span> 度量的是反向预测，数值与含义都不同。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ol><li>\n熵衡量什么？2 个候选与 4 个候选的语言熵各是多少？\n<\/li><li>\n交叉熵由哪两项拼成？模型完美拟合时 KL 项是多少？\n<\/li><li>\n交叉熵增加 1 比特，困惑度怎么变？\n<\/li><li>\nBPC 与 BPB 的归一分母分别是什么？为什么跨模型要归一？\n<\/li><li>\n建模指标为什么不能直接代表下游任务表现？\n<\/ol>\n<h2>补充推演：边界案例与常见疑问<\/h2>\n<h3>案例 A：熵为零与熵最大的两端<\/h3>\n<p>分布退化为单点（<span class=\"katex-inline\">P(i)=1<\/span>）时，熵为 0，预测毫无悬念；候选等概率且数量最大时，熵达到该词表上界。模型预测处在两端之间：容易的句子熵低，歧义句熵高。困惑度在单点分布时为 1，等概率 <span class=\"katex-inline\">N<\/span> 候选时为 <span class=\"katex-inline\">N<\/span>。<\/p>\n<h3>案例 B：交叉熵不对称的含义<\/h3>\n<p><span class=\"katex-inline\">H(P,Q)<\/span> 与 <span class=\"katex-inline\">H(Q,P)<\/span> 数值不同：前者用真实分布做权重、模型分布算编码；后者反过来。KL 散度度量的是有方向的差异，不能把两项位置互换。混淆方向会把「模型偏离数据」算成「数据偏离模型」，误差解释完全相反。<\/p>\n<h3>案例 C：分词口径对指标的影响<\/h3>\n<p>按词分词的模型每 token 承载内容多，按字符分词的模型每 token 承载少；直接比每 token 比特数，分词粗的一方天然占优。BPC 除以每 token 平均字符数，BPB 再按字符编码换算，把口径拉回字符与字节。跨模型比较语言质量时，先确认分词方案，再读归一化后的指标。<\/p>\n<h3>案例 D：训练集与评测集的指标差<\/h3>\n<p>模型在训练集上见过样本，KL 项被压低，交叉熵与 PPL 偏乐观；换到留出集或生产流量，分布差距显现，指标回升。因此报告建模质量必须注明评测集来源；同一模型在不同分布评测集上的 PPL 不可横比。<\/p>\n<h3>案例 E：压缩场景的直接解释<\/h3>\n<p>BPB 表示每字节原始数据用多少比特编码，数值即压缩比口径。BPB 3.43 对应压到原大小约 43%；BPB 越低，模型捕获文本规律的效率越高。这一解释只反映压缩效率，不直接代表下游任务表现。<\/p>\n<h3>案例 F：底数与单位口径<\/h3>\n<p>框架实现常以自然对数为底，困惑度指数底数随对数底改变；比特口径以 2 为底，nat 口径以 <span class=\"katex-inline\">e<\/span> 为底。读模型报告时先确认底数，否则「交叉熵 2.3」与「PPL 10」可能对不上。报告指标时单位与底数写清楚，是跨团队比较的前提。<\/p>\n<h3>案例 G：模型报告中指标的读法<\/h3>\n<p>读模型报告先看评测集来源与分词口径，再看交叉熵或 PPL 数值；同一模型在不同分布评测集上的数字不可横比。BPC、BPB 用于跨分词方案比较；底数（2 或 <span class=\"katex-inline\">e<\/span>）决定单位是比特还是 nat。报告只给 token 比特数时，不能直接判断语言质量优劣。<\/p>\n<h3>案例 H：建模指标与任务指标的距离<\/h3>\n<p>建模指标强相关于下游表现，但不等价：困惑度低不代表代码能跑、翻译通顺。任务口径要另设功能正确性或参考相似度（c05）。研究中两者关系仍是活跃领域，不能用建模指标替代应用评估。<\/p>\n<h3>案例 I：指标在数据环节的辅助用途<\/h3>\n<p>困惑度等指标可辅助判断样本难度：高困惑度样本可能是噪声或异常表达，低困惑度样本可能重复套话。数据策展（c12）中可用指标做初筛，但最终保留或剔除仍要看人工审核与任务评估。<\/p>\n<h3>案例 J：压缩解释的适用范围<\/h3>\n<p>BPB 直接对应压缩比口径，只在文本压缩场景解释为存储效率；迁移到生成质量、任务表现时需要另设指标。把压缩效率当成模型综合能力，是指标越界使用。<\/p>\n<h3>案例 K：指标选择的常见误用<\/h3>\n<p>把困惑度低当作模型全面更好，是最常见的指标越界；把不同分词方案的 token 比特数直接比较，是口径错误。选指标前先确认评测集、分词与底数，再解释数值变化来自数据难度还是模型偏差。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出交叉熵分解式，并说明每项对应数据难度还是模型误差。\n<\/li><li>\nPPL=8 对应多少比特交叉熵（以 2 为底）？\n<\/li><li>\n两个模型分词粒度不同，比较语言质量应先换算到哪个指标？\n<\/li><li>\n交叉熵为什么不对称？<span class=\"katex-inline\">H(P,Q)<\/span> 与 <span class=\"katex-inline\">H(Q,P)<\/span> 何时相等？\n<\/li><li>\n生产数据与训练分布差距变大时，交叉熵中哪一项先上升？\n<\/ol><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/agent/AI工程大模型应用开发实战.pdf · p.147<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">语言建模指标：熵、交叉熵、困惑度与 BPC/BPB<\/a><\/span><\/div><h1>精确评估：功能正确性、pass@k 与基于参考的相似度度量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 3 章（原书 3.3 精确评估、3.3.1 功能正确性、3.3.2 与参考数据的相似度度量、3.3.3 嵌入简介，PDF 第 147–157 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>开放式生成任务没有唯一标准答案，评估容易停留在「感觉还行」。需要区分哪些判断可以做到明确无歧义，哪些只能主观比较；也需要知道代码、SQL 这类可执行任务为什么能自动评分，翻译、摘要这类任务又该拿什么和参考响应对照。这个概念把精确评估的两类手段——功能正确性与相似度度量——的口径、适用任务和局限讲清。<\/p>\n<h2>定义<\/h2>\n<p><strong>功能正确性<\/strong>：根据系统是否实现预期功能来评估；它是任何应用的终极指标，因为直接衡量应用是否达成目标，但复杂任务上难以完全自动化（PDF 第 147 页）。代码生成场景中称执行准确性：把生成代码送进解释器，跑测试用例检查是否有效并输出正确结果。<\/p>\n<p><strong>pass@k<\/strong>：每个问题生成 <span class=\"katex-inline\">k<\/span> 个代码样
