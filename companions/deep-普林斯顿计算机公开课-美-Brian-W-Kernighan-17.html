>⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">位、字节与二进制表示：$2^N$ 编码容量与位值展开<\/a><\/span><\/div><h1>错误检测与纠错：奇偶校验、Luhn 算法与冗余位的代价<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（原书 8.8 错误检测与纠错，PDF 第 233–235 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>数据在内存、磁盘、线路和二维码里都可能翻成 0 或 1。没有冗余的编码，错了一位也无从察觉：美国社会安全号 9 位，任意 9 位数都能是一串有法律效力的号码，出了错没法自检（PDF 第 233 页）。这个概念回答三个问题：加多少冗余位能检出错误，不同校验能覆盖哪类错误、漏哪类错误，以及检错和纠错分别要付多大代价。核心思路与压缩相反：压缩去掉冗余，检错纠错是<strong>有意加入受控制的冗余<\/strong>，用少量额外位换取可发现、可修复的能力。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>检错与纠错<\/strong>：通过添加细心控制的冗余部分，对错误进行检测甚至纠正（PDF 第 233 页）。冗余不是随意重复，而是按规则计算出的校验位/校验数。<\/p>\n<p><strong>Luhn 算法（Luhn algorithm）<\/strong>：1954 年 Peter Luhn 在 IBM 发明的十进制校验算法，用于信用卡号、取款机编码这类 16 位编码。可检测单个数位上的错误，以及大多数因错位导致的错误，即哪两位数值互换；这两类是实际生活中最容易出现的错误（PDF 第 233 页）。<\/p>\n<p><strong>Luhn 计算步骤（原书表述）<\/strong>：从最右边一位开始，逐个交替地将数值乘 1 或 2；如果结果比 9 大，减 9；将每个位置最后得出的数值相加，最后的和必须可以被 10 整除（PDF 第 233 页）。<\/p>\n<p><strong>奇偶校验码（parity bit）<\/strong>：应用于位的错误检测的最简单示例。每组位末尾加一个附加的奇偶校验位；该校验位取值使整组中数值为 1 的位数为偶数（偶校验）或奇数（奇校验）（PDF 第 234 页）。<\/p>\n<p><strong>覆盖范围<\/strong>：有一个位出错，接收者看到 1 的数量变成奇数（偶校验前提下），就知道有地方出错；但不能指出具体是哪一位；如果同时有两个位出错，奇偶性又回到偶数，无法发现（PDF 第 234 页）。<\/p>\n<p><strong>纠错<\/strong>：如果使用了更多的位，单个位的错误可以通过编码来纠正（PDF 第 234 页）。存储器用奇偶位检测随机位置上单个位的错误；CD 和 DVD 使用可以纠正长期受损的代码；手机应对短暂噪声；二维码带有扩展纠错机制（图 8-5，PDF 第 235 页）。<\/p>\n<p>正例：偶校验组原本 1 的个数为偶，翻转一位后变奇，接收方检出异常。反例：两位同时翻转，奇偶性不变，检不出；无冗余的社会安全号连一位错都不知道。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>奇偶校验的代数表达：设原组各位 <span class=\"katex-inline\">b_1,\\dots,b_k<\/span>，校验位 <span class=\"katex-inline\">p<\/span>。偶校验要求<\/p>\n<div class=\"katex-block\">(b_1+\\cdots+b_k+p)\\bmod 2=0.<\/div>\n<p>传输中若一位翻转，该位模 2 加 1，总和模 2 变 1，奇偶性改变，检出；若两位翻转，模 2 各加 1，总和模 2 加 2 仍为 0，奇偶性不变，漏检。所以单比特错可检出，两位同时错检不出，且校验位本身不含出错位置信息。<\/p>\n<p>Luhn 模数 10 校验：每位按位置交替乘 1 或 2，乘积大于 9 减 9（等价于十位个位相加），各位结果求和 <span class=\"katex-inline\">S<\/span>，有效号码要求 <span class=\"katex-inline\">S\\bmod 10=0<\/span>。翻转单个数字，<span class=\"katex-inline\">S<\/span> 改变一个非零值，模 10 一般不再为 0，检出；相邻两位互换，若两数乘的系数相同（同为乘 1 或同为乘 2），和不变，这一类互换检不出，故只覆盖「大多数」换位错（PDF 第 233 页）。<\/p>\n<p>原书示例：4417 1234 5678 9112 按算法得到结果 9，卡号不可用；把最后一位改成 3 即可通过校验（PDF 第 233 页）。ISBN 由 10 位或 13 位组成，条码与美国邮政编码也使用类似校验方法（PDF 第 234 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：检错能力与加入的冗余位数成正比；冗余越多，能检出的错误模式越多，甚至能定位并纠正单/多位错。\n<\/li><li>\n边界一：奇偶校验只能检单比特错，且不能定位错位；两位及以上同时翻转漏检。\n<\/li><li>\n边界二：Luhn 面向十进制数字，不是为二进制数据设计；它漏掉系数相同的相邻换位，也不针对连续多位损坏。\n<\/li><li>\n失败案例一：把检错当纠错。奇偶校验只报告「有错」，不告诉你哪一位；要纠错必须加更多冗余位，构成纠错码。\n<\/li><li>\n失败案例二：以为有校验就能挡住所有错误。一些错误太过严重，以至于无法检测或纠正（PDF 第 235 页）；CD 划伤太深、磁盘大面积损坏仍会读不出。\n<\/li><li>\n边界三：冗余有存储和带宽代价。每加一个校验位，就多占一份编码空间；纠错码的冗余比例高于单纯检错码。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>检错 vs 纠错<\/strong>：检错只判定是否出错；纠错靠更多冗余定位出错位并还原。奇偶校验属前者，CD/DVD 纠错码属后者。\n<\/li><li>\n<strong>十进制校验 vs 位校验<\/strong>：Luhn、ISBN、条码面向数字字符，按模 10/模加权求和；奇偶校验面向二进制位，按模 2 统计 1 的个数。\n<\/li><li>\n<strong>偶校验 vs 奇校验<\/strong>：约定整组 1 的个数为偶或为奇；二者都只改变校验位取值，检出能力相同。\n<\/li><li>\n<strong>压缩冗余 vs 检错冗余<\/strong>：压缩删除真实冗余以缩短编码；检错纠错主动加入受控冗余以换取可靠性，方向相反。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 位与字节是校验位附着的载体；模 2、模 10 的求和依赖位值展开。后继：c10 网络协议在 IP/TCP 层各有校验与重传机制；c11 加密解决的是内容保密，不能替代传输检错——加密后出错照样需要校验码发现。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（错误检测与纠错：奇偶校验、Luhn 算法与冗余位的代价）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：校验位的模 2 判定，与 Luhn 模 10 校验的逐项演算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把检错纠错讲成可推演过程，先往回追四层前提：<\/p>\n<ol><li>\n<strong>编码中存在可计算的校验量<\/strong>。一组位或一串数字本身能求和、能取模；冗余位不是随便重复一位，而是由原数据按规则算出。\n<\/li><li>\n<strong>错误表现为有限几种翻转模式<\/strong>。单比特翻转、相邻换位、多位同时损坏，是通信与录入中最常见的错误；校验设计先覆盖高频模式。\n<\/li><li>\n<strong>接收方掌握同一套规则<\/strong>。收发双方按相同约定计算校验值，才能在收到后重新计算并比对；约定不一致则校验失效。\n<\/li><li>\n<strong>检错能力与冗余位数量挂钩<\/strong>。一位冗余只能区分两种状态；要定位错误、纠正错误，需要更多冗余位构成可纠错的编码空间。\n<\/ol>\n<p>依赖链方向：原始数据 → 按规则算校验值 → 附加进编码 → 传输/存储 → 接收重算比对 → 按差异判定错误类型。压缩删除冗余，这条链反向加入受控冗余。<\/p>\n<h2>正向推导一：奇偶校验位的取值与检出<\/h2>\n<h3>第一步：统计原组 1 的个数<\/h3>\n<p>设原组 <span class=\"katex-inline\">k<\/span> 位 <span class=\"katex-inline\">b_1,\\dots,b_k<\/span>，数出其中 1 的个数 <span class=\"katex-inline\">n=\\sum b_i<\/span>。偶校验要求整组（含校验位）1 的个数为偶，奇校验要求为奇。<\/p>\n<h3>第二步：定校验位取值<\/h3>\n<p>偶校验：若 <span class=\"katex-inline\">n<\/span> 为偶，校验位 <span class=\"katex-inline\">p=0<\/span>；若 <span class=\"katex-inline\">n<\/span> 为奇，<span class=\"katex-inline\">p=1<\/span>，使 <span class=\"katex-inline\">n+p<\/span> 为偶。奇校验取相反约定，使 <span class=\"katex-inline\">n+p<\/span> 为奇。<\/p>\n<h3>第三步：用 ASCII 字母演算<\/h3>\n<p>图 8-4 中字母 A 的初始编码 01000001，含两个 1，个数为偶：偶校验码左起闲置位取 0，即 01000001；奇校验码把该位置 1，即 11000001（PDF 第 234 页）。字母 C 初始 01000011 含三个 1，为奇：偶校验码补 1 得 11000011，奇校验码补 0 得 01000011。<\/p>\n<h3>第四步：传输后重算<\/h3>\n<p>接收方统计收到整组中 1 的个数，与约定奇偶性比对：一致判未检出异常，不一致判有错。翻转一位，1 的个数增减 1，奇偶性改变；翻转两位，增减 2，奇偶性不变。<\/p>\n<h3>第五步：纠错所需的额外冗余<\/h3>\n<p>一位校验只能给出「有错/没错」两种结论，无法定位。要定位翻转位，需要把编码排成二维阵列：行校验与列校验各定位一个坐标，交集即出错位；这属于纠错码，冗余位数量明显多于单一位校验。<\/p>\n<h2>正向推导二：Luhn 校验的逐项演算<\/h2>\n<h3>第六步：定位乘 1/乘 2 位置<\/h3>\n<p>从最右边一位开始，逐个交替地将数值乘 1 或 2；相邻位系数不同（PDF 第 233 页）。<\/p>\n<h3>第七步：乘积大于 9 减 9<\/h3>\n<p>某一位乘 2 后若结果大于 9，减去 9。例如数字 7 乘 2 得 14，减 9 得 5；这一步等价于把乘积的十位与个位相加（<span class=\"katex-inline\">1+4=5<\/span>）。<\/p>\n<h3>第八步：求和并模 10 判定<\/h3>\n<p>把各位置最终数值相加得 <span class=\"katex-inline\">S<\/span>；有效号码要求 <span class=\"katex-inline\">S<\/span> 可以被 10 整除，即 <span class=\"katex-inline\">S\\bmod 10=0<\/span>。<\/p>\n<h3>第九步：单错与换位的覆盖情况<\/h3>\n<p>单个数字录入错误改变 <span class=\"katex-inline\">S<\/span> 一个非零量，模 10 一般不再为 0，可检出。相邻两位互换：若两位乘的系数相同（同乘 1 或同乘 2），互换前后和不变，这类换位检不出；系数不同时和改变，可检出。故算法覆盖大多数换位错，不是全部（PDF 第 233 页）。<\/p>\n<h3>第十步：原书示例核对<\/h3>\n<p>广告示例 4417 1234 5678 9112 按算法得到结果 9，卡号不可用；把最后一位改成 3 即可使用（PDF 第 233 页）。ISBN（10 位或 13 位）、条形码、美国邮政编码用同类加权校验，只是模数与权重约定不同（PDF 第 234 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：A 与 C 的校验位<\/h3>\n<p>A：01000001，1 的个数 2（偶），偶校验 <span class=\"katex-inline\">p=0<\/span>，奇校验 <span class=\"katex-inline\">p=1<\/span>。C：01000011，1 的个数 3（奇），偶校验 <span class=\"katex-inline\">p=1<\/span>，奇校验 <span class=\"katex-inline\">p=0<\/span>。一位冗余把整组约束到两种奇偶状态之一。<\/p>\n<h3>算例 2：单错检出<\/h3>\n<p>偶校验组发送 01000001（两个 1）。若第 5 位翻转成 01001001，1 的个数变为 3（奇），与偶约定不符，检出有错；接收方不知道是第 5 位还是其他位翻了。<\/p>\n<h3>算例 3：双错漏检<\/h3>\n<p>同一组另两位同时翻转：1 的个数增减 2，奇偶性仍为偶，重算结果通过校验，错误被掩盖。这是单一位奇偶校验的固有盲区。<\/p>\n<h3>算例 4：冗余比例估算<\/h3>\n<p>8 位字节加 1 位奇偶校验，冗余比例 <span class=\"katex-inline\">1/9\\approx11\\%<\/span>；该比例换取单比特检错能力。纠错码需要的冗余位更多，存储与带宽占用相应上升。<\/p>\n<h3>算例 5：不同载体的纠错强度<\/h3>\n<p>存储器用奇偶位检测随机位置单个位的错误；CD/DVD 使用可纠正长期受损代码的纠错码；手机应对短暂噪声；二维码带扩展纠错机制，局部污损仍可还原（PDF 第 235 页）。载体受损模式越持续、越成片，所需纠错冗余越强。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>编码完全不加冗余<\/strong>：社会安全号式 9 位无冗余结构，任意一位录入错误都产生另一个看似合法的号码，接收方无法发现；错号可能被当成有效号使用。\n<\/li><li>\n<strong>只有一位校验却要求纠错<\/strong>：检错结论只有「奇偶不符」，没有错位坐标；没有行列校验或纠错码，收到错组只能请求重传，不能就地还原。\n<\/li><li>\n<strong>收发双方约定不一致<\/strong>：一端按偶校验、另一端按奇校验，正常传输也会被判为有错；校验规则必须事先固定。\n<\/li><li>\n<strong>把 Luhn 当成万能数字校验<\/strong>：系数相同的相邻换位检不出，连续多位损坏更不在覆盖范围；它针对录入高频错误，不保证所有编码错误都能发现。\n<\/li><li>\n<strong>冗余无限增加<\/strong>：校验位越多纠错越强，但存储和带宽代价同步上升；实际系统按载体错误概率选冗余强度，不盲目堆冗余。\n<\/ul>\n<h2>延伸层：检错在网络栈中的位置<\/h2>\n<p>单段编码的校验只覆盖这一段数据；跨机器传输时，IP 包、TCP 报文段在各自头部带校验字段，检测分段在链路中是否损坏（c10）。加密（c11、c12）保证内容不被窃读，不保证传输不出错；检错纠错与加密各司其职，出错的密文仍要靠校验码发现。二维码的扩展纠错则把检错纠错推向可还原成片污损的方向，是冗余位机制在图像编码上的延伸。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出偶校验位的取值规则，并说明一位翻转与两位翻转后奇偶性各如何变化。\n<\/li><li>\nLuhn 算法的乘 1/乘 2 从哪一端开始？乘积大于 9 时怎么处理？有效号码对总和有什么要求？\n<\/li><li>\n为什么奇偶校验能检单比特错却不能定位出错位？定位需要什么额外信息？\n<\/li><li>\nLuhn 对哪一类相邻换位可能漏检？为什么？\n<\/li><li>\n对比压缩与检错纠错对冗余的相反处理方式。\n<\/ol>\n<h2>再推一层：奇偶校验的模 2 判定，与 Luhn 加权求和的逐项演算<\/h2>\n<h3>偶校验位取值<\/h3>\n<p>原组各位 <span class=\"katex-inline\">b_1,\\dots,b_k<\/span>，1 的个数 <span class=\"katex-inline\">n=\\sum b_i<\/span>。偶校验要求整组（含校验位 <span class=\"katex-inline\">p<\/span>）1 的个数为偶：<span class=\"katex-inline\">n<\/span> 偶则 <span class=\"katex-inline\">p=0<\/span>，<span class=\"katex-inline\">n<\/span> 奇则 <span class=\"katex-inline\">p=1<\/span>，使 <span class=\"katex-inline\">n+p<\/span> 为偶；奇校验取相反约定。图 8-4 中 A 初始 01000001 含两个 1，偶校验码 01000001、奇校验码 11000001；C 初始 01000011 含三个 1，偶校验码 11000011、奇校验码 01000011（PDF 第 234 页）。<\/p>\n<h3>检出与盲区的代数说明<\/h3>\n<p>传输后重算 1 的个数。翻转一位，1 的个数增减 1，奇偶性改变，检出；翻转两位，增减 2，奇偶性不变，漏检。一位校验只给出「有错/没错」两种结论，不含错位坐标；要定位翻转位，需要行校验与列校验各定位一个坐标，交集即出错位，冗余位数量明显多于单一位校验。<\/p>\n<h3>Luhn 步骤复核<\/h3>\n<p>从最右位开始，逐个交替乘 1 或 2；乘积大于 9 减 9（等价于十位个位相加）；各位结果求和 <span class=\"katex-inline\">S<\/span>，有效号码要求 <span class=\"katex-inline\">S\\bmod10=0<\/span>（PDF 第 233 页）。单数码错误改变 <span class=\"katex-inline\">S<\/span> 一个非零值，模 10 一般不再为 0，检出。相邻互换：两数乘的系数相同（同乘 1 或同乘 2）时和不变，这类换位检不出；系数不同时和改变，可检出。示例 4417 1234 5678 9112 结果 9 不可用，末位改 3 即可通过（PDF 第 233 页）。ISBN（10 或 13 位）、条码、邮政编码用同类加权校验，模数与权重约定不同。<\/p>\n<h3>冗余代价与应用分层<\/h3>\n<p>8 位字节加 1 位奇偶校验，冗余比例 <span class=\"katex-inline\">1/9\\approx11\\%<\/span>，换取单比特检错。存储器用奇偶位检测随机单位错误；CD/DVD 使用可纠正长期受损代码的纠错码；手机应对短暂噪声；二维码带扩展纠错机制，局部污损仍可还原（PDF 第 235 页）。载体受损越持续、越成片，所需纠错冗余越强；检错只报告有错，纠错才就地还原。<\/p>\n<h2>再推一层：检错、纠错与冗余度的连算<\/h2>\n<h3>从检错到纠错需要的位距离<\/h3>\n<p>奇偶校验只能检出奇数个错，定位不出错在哪一位，也无法就地还原。要纠正单比特错误，合法码字之间至少要相差 3 位（转述：汉明距离口径）。重复编码把一位数据写成三份 000 或 111，按三取二还原单错，但冗余率 <span class=\"katex-inline\">2/3\\approx67\\%<\/span>；用 8 位数据加 1 位奇偶位，冗余比例 <span class=\"katex-inline\">1/9\\approx11\\%<\/span>，只换单比特检错。纠错能力越强，额外付出的冗余位越多，这是检错纠错方案的成本权衡。<\/p>\n<h3>Luhn 校验连算<\/h3>\n<p>以卡号 4417 1234 5678 9112 为例：从右向左交替对数字乘 1、乘 2，乘积大于 9 时减去 9，所有位求和末位为 0 即通过；该号算得校验位为 9。若把末位从 2 改成 3，整组和不再被 10 整除，校验失败。Luhn 用一位校验位拦下相邻位翻转、数字调换这类常见录入错误，但它不是密码学散列，防不住故意构造的伪卡号。<\/p>\n<h2>补足推导：校验方程不变量、Luhn 模 10 推演与纠错冗余代价<\/h2>\n<h3>检错的不变量<\/h3>\n<p>合法码字满足一个校验方程：奇偶校验位使全部位中 1 的个数为偶（或奇）。单比特翻转打破该方程，接收方检出；两位同时翻转时 1 的个数变化为偶数，方程仍成立，错检漏过。奇偶位只能检不能纠，因为定位不出是哪一位出错。<\/p>\n<h3>Luhn 校验位推演<\/h3>\n<p>从右向左交替对数字乘 1、乘 2；乘积大于 9 时减去 9（等价于十位加个位），所有位求和后要求模 10 为 0。以卡号 4417 1234 5678 9112 为例按规则计算，校验位为 9；若把末位从 2 改成 3，整组和不再被 10 整除，校验失败。Luhn 用一位校验位拦下相邻位翻转、数字调换这类常见录入错误，但它不是密码学散列，防不住故意构造的伪卡号。<\/p>\n<h3>纠错冗余代价<\/h3>\n<p>要纠正单比特错误，合法码字间至少相差 3 位（转述：汉明距离口径）。重复编码把一位写成三份 000 或 111，按三取二还原单错，冗余率 <span class=\"katex-inline\">2/3\\approx67\\%<\/span>；8 位数据加 1 位奇偶位冗余比例 <span class=\"katex-inline\">1/9\\approx11\\%<\/span>，只换单比特检错。纠错能力越强，额外付出的冗余位越多；检错只报告有错，纠错才就地还原。<\/p>\n<h2>补足推导：奇偶位展开算例与校验边界<\/h2>\n<h3>奇偶校验展开<\/h3>\n<p>8 位数据 <code>10110010<\/code> 中 1 的个数为 4（偶），偶校验位取 0；若某一位翻转，1 的个数变为 5（奇），校验不通过。整字节加 1 位冗余，用 9 位传 8 位信息，冗余比例 <span class=\"katex-inline\">1/9\\approx11\\%<\/span>。两位同时翻转时 1 的个数变化为偶数，校验方程仍成立，错检漏过，这是奇偶方案只能检单错的根源。<\/p>\n<h3>检错与加密的分界<\/h3>\n<p>校验码保证传输、存储中能检出意外损坏，但不防故意篡改：攻击者可以同时改动数据和对应校验位，使校验方程仍然成立。防篡改要靠密码学散列与数字签名（见 c12）。检错纠错解决「有没有被噪声弄坏」，安全机制解决「有没有被有意伪造」，两类问题不能互相替代。<\/p><\/div><\/details>", "c10": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.253<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">网络带宽、传播延迟与数据压缩：链路瓶颈、光速限制与无损/有损压缩<\/a><\/span><\/div><h1>因特网协议栈与万维网：域名/IP/路由/TCP、URL/HTML/CSS<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（原书第 9 章 因特网、第 10 章 万维网，PDF 第 252–278 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>两台机器隔着陌生网络通信，要回答：消息怎么分包、包走错或丢了谁管、乱序怎么办；地址栏一串字符各是什么意思，返回页面怎么渲染。这个概念把通信与网页分成两条分层链：下层 IP/TCP 协议栈解决包怎样找到对方、拼成可靠流；上层 URL/HTML/CSS 解决资源定位、页面标记与排版。不看清分层，解释不清「IP 不可靠，为什么浏览网页像一条直连线」。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>协议分层<\/strong>：因特网协议分好几层，每层依赖下一层的服务，并为上一层提供服务。图 9-3 自下而上为物理层、IP、TCP、应用程序（PDF 第 253 页）。<\/p>\n<p><strong>IP（Internet Protocol，因特网协议）<\/strong>：定义单个数据包的格式和传输方式。IP 提供的服务不可靠、无连接：每个 IP 数据包独立、与其他包无关；协议本身没有状态或存储，把包传给下一个网关后不再保留该包信息（PDF 第 254 页）。<\/p>\n<p><strong>尽力而为（best-effort）<\/strong>：IP 不保证传送质量；数据包可能丢失、损坏、乱序、重复或过快过慢到达（PDF 第 254 页）。<\/p>\n<p><strong>包大小与地址<\/strong>：IP 数据包最大约 65KB，超长消息拆成小块分别发送，到远端再组装；IPv6 源目地址都是 128 位（PDF 第 254 页）。<\/p>\n<p><strong>TTL（Time To Live，生存时间）<\/strong>：单字节计数，每过一跳网关减 1，减到 0 就丢弃并回报错包；典型经过 15–20 个网关。TTL 不能消除循环，但能防止包进入循环后永远存在（PDF 第 255 页）。<\/p>\n<p><strong>TCP（Transmission Control Protocol，传输控制协议）<\/strong>：在 IP 不可靠服务之上合成可靠双向数据流，仿佛一条直连线缆（PDF 第 255 页）。字节流切成报文段（segment），报文段头部含序列号，便于接收方了解收到哪一段（PDF 第 255 页）。<\/p>\n<p><strong>UDP（User Datagram Protocol，用户数据报协议）<\/strong>：与 TCP 同层，简单得多；不要求双向流，只要高效率的单包投递。DNS、流媒体、VoIP 和某些在线游戏使用 UDP（PDF 第 253 页）。<\/p>\n<p><strong>URL（统一资源定位符）<\/strong>：<code>http<\/code> 表示普通 HTTP，<code>https<\/code> 表示加密的安全 HTTP；<code>://<\/code> 后是域名；斜线 <code>/<\/code> 后一串字符原样传给服务器；文件名后问号前是程序、问号后是参数（PDF 第 276 页）。URL 字符集有限，集外字符用百分号（%）加两位十六进制代码编码。<\/p>\n<p><strong>HTML（超文本标记语言）<\/strong>：服务器返回的绝大多数文本是 HTML，用标签表示格式、标示页面区域起止。<code>&lt;img&gt;<\/code> 自包含，<code>alt<\/code> 提供图片不可访问时的替代文字；<code>&lt;body&gt;<\/code> 这类标签有始有终（PDF 第 277–278 页）。<\/p>\n<p><strong>CSS（Cascading Style Sheets，层叠样式表）<\/strong>：定义标题格式等样式并实施于所有对象；例如 <code>h2, h3 { color: red; font-style: italic; }<\/code> 让标题显示红色斜体（PDF 第 278 页）。HTML 和 CSS 有正规语法和语义，但没有循环和状态，不能表示算法，不算编程语言。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>一次网页访问的分层路径：应用程序（浏览器）把请求交给 TCP；TCP 切流、加序列号；IP 加源目地址、TTL，逐跳路由；物理层把比特送上链路。IP 不保证送达，TCP 靠序列号、确认与重传在不可靠包服务上重建有序字节流；上层应用只面对信息流，不用操心数据包（PDF 第 253、255 页）。<\/p>\n<p>路由推演：网关为 IP 数据包指路；每种物理网络有自己的包格式，网关在网络格式与 IP 之间来回转换（PDF 第 253 页）。traceroute 可逐跳显示路径，原书记录从普林斯顿到悉尼大学 17 跳、235.266 毫秒（PDF 第 252 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：需要可靠双向流、要求内容按序到达时用 TCP；可容忍少量丢包、换取低延迟和简单投递时用 UDP。\n<\/li><li>\n边界一：IP 的「可靠」是运行层效果，不是协议保证；包丢损时 IP 不会修复（PDF 第 254 页）。\n<\/li><li>\n边界二：HTML/CSS 没有循环和状态，表示算法必须借助真正的编程语言。\n<\/li><li>\n失败案例一：把 IP 当成可靠协议。以为每个包都会按序到达；实际乱序、丢失、重复都可能发生，要靠上层补救。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>IP vs TCP<\/strong>：IP 无连接、不可靠、尽力而为，定义单包格式与路由；TCP 在 IP 之上提供可靠双向流，靠序列号组织报文段。\n<\/li><li>\n<strong>TCP vs UDP<\/strong>：TCP 面向可靠流，机制复杂；UDP 简单高效，面向单包投递，用于 DNS、流媒体、VoIP、在线游戏。\n<\/li><li>\n<strong>域名 vs IP 地址<\/strong>：域名是服务器名字，供人使用；IP 地址是机器路由标识，经域名服务解析后定位包。\n<\/li><li>\n<strong>HTML vs CSS<\/strong>：HTML 标记内容与结构；CSS 定义样式并作用于成组对象；二者都不是编程语言。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c08 的带宽与时延决定协议栈各层的实际表现；c07 的软件分层与协议分层同构。后继：c11、c12 的加密让 <code>https<\/code> 在 TCP/IP 之上提供保密通道；c13 的云服务把应用层数据放到远程服务器，依赖整条协议栈访问。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（因特网协议栈与万维网：域名/IP/路由/TCP、URL/HTML/CSS）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：一次请求穿过协议栈的分层路径，与 URL/HTML 的结构拆解<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把网络与万维网讲成可推演过程，先往回追四层前提：<\/p>\n<ol><li>\n<strong>消息先归成比特再封装<\/strong>。上层字节流要先切成段、包，才能在物理链路上传送；封装每加一层头部，就多一层控制信息（c02、c08）。\n<\/li><li>\n<strong>网络是陌生多跳环境<\/strong>。包从一台网关到下一台网关，路径不可预设；需要地址标识源目，需要跳数限制防止包永远打转。\n<\/li><li>\n<strong>底层不可靠，可靠要在高层补<\/strong>。IP 尽力而为、允许丢损乱序；TCP 在其上用序列号等机制重建有序流，把不可靠包服务包装成可靠字节流。\n<\/li><li>\n<strong>网页是请求—响应结构<\/strong>。浏览器用 URL 定位资源，服务器返回 HTML/CSS，浏览器按标签解析排版；内容、样式、行为分开描述。\n<\/ol>\n<p>依赖链方向：应用请求 → TCP 分段加序列号 → IP 加地址/TTL 路由 → 物理层比特传输；响应沿原路逐层解封装。URL 定位资源 → HTML 标记结构 → CSS 套样式。两条链在「浏览器拿到并渲染页面」处汇合。<\/p>\n<h2>正向推导一：一次请求穿过协议栈<\/h2>\n<h3>第一步：应用层发起请求<\/h3>\n<p>浏览器生成对某资源的请求字符串，交给本层 TCP。应用程序只面对信息流，不需要考虑数据包怎么切、怎么走（PDF 第 253 页）。<\/p>\n<h3>第二步：TCP 切流与编号<\/h3>\n<p>TCP 把字节流切分成报文段（segment）放进 TCP 包；报文段除数据外还有控制信息头部，其中包括序列号，接收方据此知道收到哪一段、如何拼回原序（PDF 第 255 页）。可靠双向流在这一层建立：延迟小、出错率低，仿佛一条直连线缆。<\/p>\n<h3>第三步：IP 封装与寻址<\/h3>\n<p>IP 给报文加上源地址、目标地址等头部信息。IPv4 包头含版本、类型、头长度、总长度、TTL、源地址、目标地址、错误校验、数据（图 9-4，PDF 第 254 页）；IPv6 结构类似，只是源目地址都是 128 位。IP 数据包最大约 65KB，超长消息拆成小块分别发送，到远端再组装。<\/p>\n<h3>第四步：逐跳路由与 TTL 递减<\/h3>\n<p>网关为包指路；每种物理网络有自己的包格式，网关在特定网络格式与 IP 之间来回转换（PDF 第 253 页）。TTL 是单字节，发送方设初始值，每过一跳网关减 1；减到 0 就丢弃包，并给始发者返回报错数据包。典型传包经过 15 到 20 个网关；经过 255 跳的包很可能误入循环，TTL 防止个别包进入循环后永远存在（PDF 第 255 页）。<\/p>\n<h3>第五步：物理层传输<\/h3>\n<p>物理层把比特送上实际链路；包可能丢失、损坏、乱序、重复送达，IP 不修复这些问题（PDF 第 254 页）。到达远端后逐层解封装：IP 还原段，TCP 按序列号排序、确认并重传缺失段，应用层拿到有序信息流。<\/p>\n<h3>第六步：UDP 的简化路径<\/h3>\n<p>若应用选 UDP，则不建立双向可靠流，只做高效率的数据包投递；DNS、流媒体视频、VoIP 和某些在线游戏使用 UDP，容忍少量丢包以换取低延迟（PDF 第 253 页）。<\/p>\n<h2>正向推导二：URL 各字段拆解<\/h2>\n<h3>第七步：协议段<\/h3>\n<p>URL 开头 <code>http<\/code> 表示普通 HTTP；<code>https<\/code> 表示采用经过加密的安全 HTTP（PDF 第 276 页）。协议决定浏览器与服务器用哪套规则对话。<\/p>\n<h3>第八步：域名与路径<\/h3>\n<p><code>://<\/code> 后面是域名（服务器名字）；域名后面跟着斜线 <code>/<\/code> 和一串字符，这串字符原样传给服务器，由服务器决定如何处置。域名后什么都没有、连斜线也没有时，服务器返回默认页面，比如 index.html；域名后有文件名就返回对应文件内容。<\/p>\n<h3>第九步：问号参数<\/h3>\n<p>文件名之后如果有问号，问号前面是程序，服务器运行该程序并把问号后面的部分作为参数传入；这是服务器处理网页表单信息的一种方式。原书示例：<code>http://www.bing.com/search?q=funny+cat+pictures<\/code>，域名 www.bing.com，路径 /search，参数 q=funny cat pictures，加号 <code>+<\/code> 表示空格（PDF 第 276 页）。<\/p>\n<h3>第十步：百分号编码<\/h3>\n<p>URL 只能用有限字符集，不含空格和大多数字母数字之外的字符；需要集外字符时，用前冠百分号（%）的两个十六进制代码表示。例如片段 <code>5%2710%222D6%273%22<\/code> 意味 5&#x27;10&quot;-6&#x27;3&quot;：十六进制 27 是单引号，22 是双引号，2D 是减号（PDF 第 276 页）。<\/p>\n<h2>正向推导三：HTML 与 CSS 解析<\/h2>\n<h3>第十一步：标签标记结构<\/h3>\n<p>HTML 文件用标签表示格式信息，标签描述内容并标示区域起始与结束位置。图 10-1 示例：<code>&lt;title&gt;My Page&lt;/title&gt;<\/code> 定标题；<code>&lt;h2&gt;<\/code> 标二级标题；<code>&lt;p&gt;<\/code> 标段落；<code>&lt;a href=&quot;...&quot;&gt;<\/code> 标链接（PDF 第 277 页）。<\/p>\n<h3>第十二步：自包含标签与替代文字<\/h3>\n<p><code>&lt;img src=&quot;wikipedia.jpg&quot; alt=&quot;Wikipedia&quot;&gt;<\/code> 是自包含标签，没有闭合标签；<code>alt<\/code> 属性在图片无法访问时提供替代展示的文字，浏览器可能在该位置显示「破损」替代图（PDF 第 278 页）。<\/p>\n<h3>第十三步：CSS 套样式<\/h3>\n<p>CSS 定义样式并实施于所有对象；规则 <code>h2, h3 { color: red; font-style: italic; }<\/code> 让所有 h2、h3 标题显示为红色斜体（PDF 第 278 页）。HTML 管内容结构，CSS 管外观样式。<\/p>\n<h3>第十四步：为什么不算编程语言<\/h3>\n<p>HTML 和 CSS 有正规语法和语义，但没有循环和状态，无法利用它们表示算法（PDF 第 278 页）。动态行为由应用层的脚本语言完成。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：包大小与拆分<\/h3>\n<p>IP 包最大约 65KB。一段 1000KB 的网页或下载内容，要拆成约 <span class=\"katex-inline\">1000/65\\approx16<\/span> 个 IP 块分别发送，到远端再组装（PDF 第 254 页）。<\/p>\n<h3>算例 2：地址位数<\/h3>\n<p>IPv6 源目地址各 128 位；<span class=\"katex-inline\">2^{128}<\/span> 是可分配地址的量级基础。IPv4 地址为 32 位，原书未在本节展开。<\/p>\n<h3>算例 3：跳数与 TTL<\/h3>\n<p>典型路径 15–20 跳；TTL 初始值常见为 64、128、255（原书未逐一列举，按通用约定，转述）。包若误入循环，TTL 到 0 被丢弃并回报错包；255 跳仍未到达说明很可能循环了（PDF 第 255 页）。<\/p>\n<h3>算例 4：现实路径实测<\/h3>\n<p>traceroute 记录从普林斯顿到悉尼大学 17 跳、235.266 毫秒（PDF 第 252 页）。跳数对应 TTL 递减次数，毫秒数是各跳延迟累加。<\/p>\n<h3>算例 5：URL 编码还原<\/h3>\n<p><code>%27<\/code> → 单引号，<code>%22<\/code> → 双引号，<code>%2D<\/code> → 减号；空格在查询串里可写为 <code>+<\/code>。解析器先按百分号十六进制还原字符，再把参数交给程序（PDF 第 276 页）。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>IP 承诺可靠送达<\/strong>：若每个包都要协议本身保证到达与按序，网络就要为每条路径维护状态、缓存全部未确认包；这与无连接、不存储包信息的设计相反，扩展性大幅下降。\n<\/li><li>\n<strong>没有 TTL 字段<\/strong>：误入循环的包会在网关间永久打转，持续占用链路；TTL 到 0 丢弃是包在网络中过期的机制保障（PDF 第 255 页）。\n<\/li><li>\n<strong>TCP 不加序列号<\/strong>：乱序到达的报文段无法拼回原序，重复包也无法识别；可靠字节流失去重组依据。\n<\/li><li>\n<strong>浏览器把 HTML/CSS 当算法执行<\/strong>：二者没有循环和状态，无法表达条件分支与迭代；交互逻辑必须由真正的编程语言在应用层提供。\n<\/li><li>\n<strong>URL 不做字符编码<\/strong>：空格、引号、减号等集外字符会破坏域名、路径与参数的分界，服务器无法正确解析请求。\n<\/ul>\n<h2>延伸层：缓存、加密与云访问<\/h2>\n<p>网络通过大量缓存保证数据流动：浏览器缓存最近访问的页面和图片，你看到的可能来自本地缓存而非网络；主要 Web 服务器也靠缓存加快响应，Akamai 一类公司在更靠近接收者的地方缓存内容；搜索引擎爬行时也大量缓存网页（PDF 第 255 页）。<code>https<\/code> 在协议栈之上叠加加密层（c11、c12）；云服务（c13）把应用与数据放在远程服务器，用户仍沿这条分层路径访问。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n画出图 9-3 的四层结构，并说明每层为上层提供什么服务。\n<\/li><li>\nIP 的「无连接」和「不可靠」各指什么？列出包可能出现的几种异常。\n<\/li><li>\nTTL 如何递减？到 0 后发生什么？它为什么不能消除循环？\n<\/li><li>\nTCP 报文段头部为什么带序列号？UDP 用在哪些场景？\n<\/li><li>\n拆解一个带域名、路径、问号参数的 URL，并说明百分号编码规则。\n<\/ol>\n<h2>再推一层：一次请求穿过四层栈的走查，与 URL/HTML 结构拆解<\/h2>\n<h3>应用到物理层的封装顺序<\/h3>\n<p>浏览器生成请求交给 TCP；TCP 把字节流切分成报文段，加含序列号的头部；IP 加源目地址、TTL 等头部；物理层把比特送上链路。IP 不保证送达，TCP 靠序列号、确认与重传在不可靠包服务上重建有序字节流；上层应用只面对信息流，不必操心数据包（PDF 第 253、255 页）。<\/p>\n<h3>IP 头部与 TTL 机制<\/h3>\n<p>IPv4 包头含版本、类型、头长度、总长度、TTL、源地址、目标地址、错误校验、数据（图 9-4，PDF 第 254 页）；IPv6 结构类似，源目地址各 128 位。IP 包最大约 65KB，超长消息拆成小块分别发送、远端组装。TTL 是单字节，发送方设初始值，每过一跳网关减 1；减到 0 丢弃包并给始发者返回报错包。典型传包经过 15～20 个网关；255 跳仍未到达很可能误入循环。TTL 不能消除循环，但防止包进循环后永远存在（PDF 第 255 页）。<\/p>\n<h3>TCP 与 UDP 分工<\/h3>\n<p>TCP 提供可靠双向数据流，一端传到另一端延迟小、出错率低，仿佛直连线缆；报文段含实际数据和控制头部，序列号让接收方知道收到哪一段（PDF 第 255 页）。UDP 与 TCP 同层，简单得多，不要求双向流传输，只要高效率数据包投递；DNS、流媒体视频、VoIP 和某些在线游戏用 UDP（PDF 第 253 页）。traceroute 记录普林斯顿到悉尼大学 17 跳、235.266 毫秒（PDF 第 252 页），跳数对应 TTL 递减次数，毫秒数是各跳延迟累加。<\/p>\n<h3>URL 字段拆解<\/h3>\n<p><code>http<\/code> 为普通 HTTP，<code>https<\/code> 为加密安全 HTTP；<code>://<\/code> 后是域名；域名后斜线与字符串原样传给服务器；域名后无内容时返回默认页面如 index.html；文件名后问号前是程序，问号后作为参数传入。示例 <code>http://www.bing.com/search?q=funny+cat+pictures<\/code>：域名 www.bing.com，路径 /search，参数 q=funny cat pictures，加号表示空格（PDF 第 276 页）。集外字符用前冠百分号的两个十六进制代码编码，%27 单引号、%22 双引号、%2D 减号。<\/p>\n<h3>HTML 与 CSS 的边界<\/h3>\n<p>HTML 用标签描述内容与结构：<code>&lt;title&gt;<\/code> 定标题，<code>&lt;h2&gt;<\/code> 二级标题，<code>&lt;p&gt;<\/code> 段落，<code>&lt;a href&gt;<\/code> 链接；<code>&lt;img&gt;<\/code> 自包含，<code>alt<\/code> 提供图片不可访问时的替代文字（PDF 第 277–278 页）。CSS 定义样式并实施于所有对象，如 <code>h2, h3 { color: red; font-style: italic; }<\/code>。HTML 和 CSS 有正规语法和语义，但没有循环和状态，不能表示算法，不算编程语言（PDF 第 278 页）。<\/p>\n<h2>再推一层：一次网页请求经过的分层路径<\/h2>\n<h3>从域名到回包的逐层流程<\/h3>\n<p>浏览器输入 URL 后，先向 DNS 查询域名对应的 IP 地址；取得 IP 后通过 TCP 三次握手与服务器建立连接；连接上发出 HTTP 请求报文；IP 层把报文分片、逐跳路由，每跳 TTL 减 1；服务器处理后沿反向路径回包；浏览器再解析 HTML 结构，套用 CSS 样式，请求页面引用的图片与脚本。每层只处理本层封装：TCP 保证有序可靠，IP 只负责寻址转发，应用层读最终内容。<\/p>\n<h3>两类延迟分开计量<\/h3>\n<p>链路里有两类互不替代的延迟：传播延迟受光速与物理距离限制，再快的线路也压不掉；带宽延迟决定单位时间能搬多少字节，大文件传输时间主要随数据量和带宽变化。域名解析、TCP 握手、建连往返都会在首字节前叠加往返开销，这也是 c08 把带宽与传播分开计量的意义。UDP 不握手、不保证有序，被用于 DNS、流媒体、语音通话和游戏这类容忍少量丢包、要求低延迟的场景。<\/p><\/div><\/details>", "c11": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.343<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">位、字节与二进制表示：$2^N$ 编码容量与位值展开<\/a><\/span><\/div><h1>对称密钥加密：密钥空间、蛮力攻击与 DES/AES 量级<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书 12.1 加密、12.1.1 密钥加密，PDF 第 340–344 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>Alice 和 Bob 想交换保密消息，但不掩盖正在通信；两人需共享同一套扰乱、再恢复消息的密钥（PDF 第 341 页）。这个概念回答：古典移位密码为何被频率分析攻破，现代对称加密的安全性寄托在什么上，密钥长度怎样决定蛮力攻击量级，以及对称加密留下什么难题。核心判断：现代密码学假定攻击者知道算法，安全性只寄托在密钥上；靠隐藏算法的隐匿式安全终将失败。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>加密（cryptography，密码术）<\/strong>：「秘密书写」的技艺，是抵抗袭击最有效的方法之一；使用恰当时有力灵活，但好的加密复杂精细，也容易因人工错误失败（PDF 第 340 页）。<\/p>\n<p><strong>凯撒密码（Caesar cipher）<\/strong>：把字母向后移动三个位置，A 变 D、B 变 E；「HI JULIUS」变成「KL MXOLXV」（PDF 第 340 页）。rot13 移 13 位，只用于隐藏剧透，并不真加密。<\/p>\n<p><strong>密钥（key）<\/strong>：加密消息的秘密数字或设置。凯撒密码里密钥是移位距离，现代密码系统用巨大的秘密数字作为变换比特流算法的输入；不知道这个数字就不可能还原消息（PDF 第 342 页）。<\/p>\n<p><strong>频率分析<\/strong>：统计密文符号出现频率，可解开凯撒和简单替换密码。要抵御它，加密须让密文符号大致均匀，不留可分析模式（PDF 第 342 页）。<\/p>\n<p><strong>对称密钥加密（secret-key encryption，对称加密）<\/strong>：加密和解密使用相同钥匙；密钥由参与消息交换的各方共享（PDF 第 343 页）。<\/p>\n<p><strong>蛮力攻击（brute force）<\/strong>：假定算法无缺陷，破解的唯一方法是遍历所有可能密钥，直到找出加密所用那把。密钥 <span class=\"katex-inline\">N<\/span> 位，穷举时间与 <span class=\"katex-inline\">2^N<\/span> 成正比（PDF 第 343 页）。<\/p>\n<p><strong>字典攻击<\/strong>：先试短密钥和常见单词、弱数字（如「password」「12345」），针对人类选密钥的习惯；密钥选得偷懒就会被先行命中（PDF 第 343 页）。<\/p>\n<p><strong>DES（Data Encryption Standard，数据加密标准）<\/strong>：1976 年到 21 世纪初最常用的密钥加密算法，IBM 与 NSA 共同开发，固定 56 位密钥；随硬件提速，到 1999 年已可由专用计算机一天内穷举破解（PDF 第 343–344 页）。<\/p>\n<p><strong>AES（Advanced Encryption Standard，高级加密标准）<\/strong>：NIST 公开竞赛选出，德门（Joan Daemen）与赖曼（Vincent Rijmen）的 Rijndael 算法 2002 年成为美国官方标准，归入公有领域；支持 128、192、256 位密钥，密钥数量极大，蛮力难奏效，除非发现算法弱点（PDF 第 344 页）。<\/p>\n<p>正例：密钥长度足够、算法公开无缺陷时，密文在蛮力可及范围之外。反例：密钥选常见单词，字典攻击先命中；密钥位数过短，硬件提速后被一天穷举。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>密钥空间：<span class=\"katex-inline\">N<\/span> 位密钥每位可取 0/1，可能密钥总数 <span class=\"katex-inline\">2^N<\/span>。蛮力攻击平均要试到一半左右命中，期望工作量 <span class=\"katex-inline\">\\sim 2^{N-1}<\/span>，时间与 <span class=\"katex-inline\">2^N<\/span> 成正比。密钥每加一位，搜索空间翻倍；位数增长与破解时间是指数关系。<\/p>\n<p>算力量级核算：GPU 每秒可进行 <span class=\"katex-inline\">10^{13}<\/span> 次计算；一百万个 GPU 每秒可做 <span class=\"katex-inline\">10^{19}<\/span> 次，每年大约 <span class=\"katex-inline\">3\\times10^{26}<\/span> 次，这大概是 <span class=\"katex-inline\">2^{90}<\/span> 次（PDF 第 344 页）。<span class=\"katex-inline\">2^{128}<\/span> 相对 <span class=\"katex-inline\">2^{90}<\/span> 仍遥远：差距 <span class=\"katex-inline\">2^{38}\\approx2.7\\times10^{11}<\/span> 倍，所以即使 AES-128 面对蛮力攻击也很安全。<\/p>\n<p>对称加密的两个遗留难题（PDF 第 344–345 页）：一是<strong>密钥分发<\/strong>——各方必须经绝对安全渠道拿到同一把密钥，渠道里有间谍就无法保证；二是<strong>密钥增生<\/strong>——多方独立会话要为每组会话准备不同密钥，分发按平方增长。这两个难题直接导致公钥加密诞生。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：对称加密适合双方已经安全共享密钥之后的批量数据加密；加解密同一密钥，算法效率高。\n<\/li><li>\n边界一：安全性只寄托在密钥保密上；算法公开、经专家审查是好事，隐匿式安全（假定对手不知道方案）长期会失败（PDF 第 342 页）。\n<\/li><li>\n边界二：密钥长度只对抗蛮力；算法有漏洞、随机数被削弱，长密钥也救不了。\n<\/li><li>\n失败案例：把加密当唯一防线，或用短密钥、弱口令。加密易因人工错误失败；DES 56 位 1999 年被一天穷举，常见口令被字典攻击先行命中（PDF 第 340 页）。\n<\/li><li>\n边界三：对称加密不解决「第一次怎样安全把密钥交出去」；这是协议与分发问题，不是加密算法本身能完成的。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>对称 vs 公钥<\/strong>：对称加解密同一共享密钥；公钥用数学关联的密钥对，免去预先共享秘密（c12）。\n<\/li><li>\n<strong>蛮力 vs 字典攻击<\/strong>：蛮力遍历全部 <span class=\"katex-inline\">2^N<\/span> 空间；字典优先试常见单词、短密钥和弱模式。\n<\/li><li>\n<strong>隐匿式安全 vs 公开算法<\/strong>：前者靠隐藏方案保密，长期会失败；后者假定算法公开，安全只靠密钥与强度。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 位与二进制是密钥位数和 <span class=\"katex-inline\">2^N<\/span> 计数的基础。后继：c12 公钥加密解决本节的分发与增生难题；c10 的 <code>https<\/code> 把对称密钥与会话加密结合；c13 指出云端加密只覆盖传输与存储，不覆盖平台可见性。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（对称密钥加密：密钥空间、蛮力攻击与 DES/AES 量级）<\/summary><div class=\"depth-body\"><h1>c11 深度推导：密钥空间的指数推算，从移位密码到 AES 的量级对照<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把对称加密讲成可推演过程，先往回追四层前提：<\/p>\n<ol><li>\n<strong>消息能映射到可变换的符号流<\/strong>。字母、比特流先归成有限符号集合，加密算法在集合上做可逆变换；符号种类和位数决定可变换空间（c02）。\n<\/li><li>\n<strong>变换必须能被授权方还原<\/strong>。加密与解密互为逆操作；对称系统用同一密钥完成双向变换，密钥丢失则密文不可还原。\n<\/li><li>\n<strong>攻击者掌握算法但拿不到密钥<\/strong>。现代密码学假定对手知道并完全理解工作原理，安全性只寄托在密钥上；分析攻击、频率攻击、选择明文对照都要算法能抵御。\n<\/li><li>\n<strong>破解成本与密钥空间挂钩<\/strong>。穷尽所有可能密钥的工作量决定蛮力攻击时间；密钥位数每加一位，空间翻倍。\n<\/ol>\n<p>依赖链方向：明文 + 密钥 + 算法 → 密文；攻击者拿到密文，在算法已知前提下尝试密钥；密钥空间大小决定穷举时间；分发与增生是算法之外的协议难题。<\/p>\n<h2>正向推导一：古典移位密码的机制与破绽<\/h2>\n<h3>第一步：移位变换<\/h3>\n<p>凯撒密码把原文每个字母向后移动 3 位：A→D、B→E、C→F，依字母表循环。消息「HI JULIUS」变成「KL MXOLXV」（PDF 第 340 页）。移位距离 3 就是密钥；换一个距离就是换一把密钥。<\/p>\n<h3>第二步：逆变换还原<\/h3>\n<p>解密把密文字母向前移 3 位：K→H、L→I、M→J、X→U、O→L、L→I、X→U、V→S，回到「HI JULIUS」。加解密用同一个移位距离。<\/p>\n<h3>第三步：频率特征保留<\/h3>\n<p>移位只是替换字母，不改变字母出现次数的相对分布。英文原文 e、t、a、o、i、n 高频，z、x、q 低频；密文中对应替换字母同样高频。统计密文符号频率并匹配英文频率表，就能还原移位量甚至替换表，这是频率分析（PDF 第 342 页）。<\/p>\n<h3>第四步：现代密码抹平频率<\/h3>\n<p>抵御频率分析的方向：让密文中所有符号以大致相等的机会出现，密文没有模式可供分析。现代分组密码在比特流上做复杂混淆与扩散，单字母对应关系不再保留。<\/p>\n<h3>第五步：其他攻击面<\/h3>\n<p>攻击者可能知道与待破解密文相对应的明文；即使不知道，也可能选取一段明文，诱使被攻击者用待破解密钥加密，两相对照达到破解目的。好算法要有效抵御所有这些攻击（PDF 第 342 页）。<\/p>\n<h2>正向推导二：密钥空间与蛮力攻击量级<\/h2>\n<h3>第六步：计数密钥空间<\/h3>\n<p><span class=\"katex-inline\">N<\/span> 位密钥每位取 0 或 1，可能密钥总数<\/p>\n<div class=\"katex-block\">K=2^N.<\/div>\n<p>蛮力攻击逐一尝试候选密钥，直到某个密钥解出可读明文。最坏情况试完 <span class=\"katex-inline\">K<\/span> 把，平均情况约试到 <span class=\"katex-inline\">K/2<\/span>，期望工作量 <span class=\"katex-inline\">\\sim 2^{N-1}<\/span>，时间与 <span class=\"katex-inline\">2^N<\/span> 成正比（PDF 第 343 页）。<\/p>\n<h3>第七步：每加一位的后果<\/h3>\n<p>密钥长度从 <span class=\"katex-inline\">N<\/span> 增到 <span class=\"katex-inline\">N+1<\/span>，空间从 <span class=\"katex-inline\">2^N<\/span> 增到 <span class=\"katex-inline\">2^{N+1}=2\\cdot2^N<\/span>，穷举量翻倍。对抗算力提升，靠加位数把指数底数抬上去；位数增长与破解时间是指数关系，不是线性关系。<\/p>\n<h3>第八步：DES 的 56 位<\/h3>\n<p>DES 总是使用 56 位密钥，密钥空间 <span class=\"katex-inline\">2^{56}\\approx7.2\\times10^{16}<\/span>。1976 年到 21 世纪初它是最常用密钥加密算法；随计算机运算速度加快，这个长度已经太短；1999 年廉价专业计算机用蛮力攻击穷举一天就能破解 DES 密钥（PDF 第 343–344 页）。<\/p>\n<h3>第九步：AES 的长度与选拔<\/h3>\n<p>AES 来自全球公开竞赛，NIST 赞助；几十个参赛算法经公开评测，德门与赖曼的 Rijndael 胜出，2002 年成为美国政府官方标准，归入公有领域（PDF 第 344 页）。AES 支持 128、192、256 位三种长度。<\/p>\n<h3>第十步：算力对照核算<\/h3>\n<p>GPU 每秒可进行 <span class=\"katex-inline\">10^{13}<\/span> 次计算；一百万个 GPU 每秒可做 <span class=\"katex-inline\">10^{19}<\/span> 次；每年大约 <span class=\"katex-inline\">3\\times10^{26}<\/span> 次，约为 <span class=\"katex-inline\">2^{90}<\/span> 次（PDF 第 344 页）。AES-128 密钥空间 <span class=\"katex-inline\">2^{128}<\/span>，相对年度算力 <span class=\"katex-inline\">2^{90}<\/span> 相差 <span class=\"katex-inline\">2^{38}\\approx2.7\\times10^{11}<\/span> 倍，蛮力在可及时间内没有结果。<\/p>\n<h2>正向推导三：对称加密遗留的两个难题<\/h2>\n<h3>第十一步：密钥分发<\/h3>\n<p>参与秘密通信的每一方必须知道所用密钥，因此必须有绝对安全的渠道把密钥送到通信参与方。这看似像把大家请到家里聚餐；如果来人里有间谍或敌人，分发密钥时的安全性就无法保证（PDF 第 344 页）。<\/p>\n<h3>第十二步：密钥增生<\/h3>\n<p>要保证彼此无关的多方相互独立秘密会话，就要为每组会话准备不同密钥。人数增多时，需要保密分发的密钥配对数随之增长，密钥分发更加困难（PDF 第 345 页）。<\/p>\n<h3>第十三步：难题导向<\/h3>\n<p>算法本身能把消息扰乱到不可读，却不能在不安全的网络上把第一把密钥安全送出去。这个缺口直接导致公钥加密的诞生（c12）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：移位密钥空间<\/h3>\n<p>凯撒移位只有 26 个可能距离（英文小写字母表），试 26 次即可遍历；频率分析甚至不必穷举。相比之下，现代密钥空间是 <span class=\"katex-inline\">2^N<\/span> 的指数量级。<\/p>\n<h3>算例 2：56 位与 128 位对照<\/h3>\n<p><span class=\"katex-inline\">2^{56}\\approx7.2\\times10^{16}<\/span>；<span class=\"katex-inline\">2^{128}\\approx3.4\\times10^{38}<\/span>。两者相差 <span class=\"katex-inline\">2^{72}\\approx4.7\\times10^{21}<\/span> 倍；128 位空间相对 56 位是天文数字级别的扩大。<\/p>\n<h3>算例 3：年度破解能力<\/h3>\n<p><span class=\"katex-inline\">10^6<\/span> 个 GPU，每个每秒 <span class=\"katex-inline\">10^{13}<\/span> 次 → 每秒 <span class=\"katex-inline\">10^{19}<\/span> 次；按一年约 <span class=\"katex-inline\">3.15\\times10^7<\/span> 秒计，年度约 <span class=\"katex-inline\">3.15\\times10^{26}<\/span> 次，原书记为约 <span class=\"katex-inline\">3\\times10^{26}\\approx2^{90}<\/span>（PDF 第 344 页）。对 <span class=\"katex-inline\">2^{128}<\/span>，即便按此算力，穷尽时间远超现实可及范围。<\/p>\n<h3>算例 4：字典攻击优先级<\/h3>\n<p>攻击者先试「password」「12345」这类常见单词和数字形式，再试短密钥、长密钥；用户选密钥偷懒或粗心，弱口令在字典阶段就被命中，不必走蛮力穷举。<\/p>\n<h3>算例 5：密钥增生配对数<\/h3>\n<p><span class=\"katex-inline\">m<\/span> 个参与者两两独立会话，若每对用独立对称密钥，需要 <span class=\"katex-inline\">\\binom{m}{2}=m(m-1)/2<\/span> 把密钥；人数增长时密钥数按平方增长，分发保管负担随之上升（转述：原书定性描述「密钥增生」，此为配对数推算）。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>算法保密、密钥公开<\/strong>：把安全寄托在对手不知道方案上，属于隐匿式安全；方案一旦泄露或被逆向，历史上这类方法往往失败（PDF 第 342 页）。\n<\/li><li>\n<strong>密钥位数减半<\/strong>：搜索空间缩小为原来的 <span class=\"katex-inline\">1/2<\/span>，蛮力时间减半；56 位被提速后的硬件击穿，正是位数跟不上算力增长的结果。\n<\/li><li>\n<strong>允许攻击者选择明文对照<\/strong>：若算法不抵御选择明文攻击，攻击者诱使目标加密选定明文，与密文对照即可缩小密钥空间；好算法必须顶住这类攻击。\n<\/li><li>\n<strong>没有安全分发渠道<\/strong>：对称密钥必须先交送到对方；网络本身不可信，密钥若经不可信中间人传递，密文再强也等于门户大开。\n<\/li><li>\n<strong>每组会话复用同一把密钥<\/strong>：密钥增生问题被绕过，一份密钥泄露牵连所有会话；独立会话需要独立密钥，分发成本又上升。\n<\/ul>\n<h2>延伸层：对称加密在真实协议里的位置<\/h2>\n<p>真实 <code>https<\/code> 链路通常是混合方案：公钥加密（c12）用来安全交换一把临时对称会话密钥，之后批量数据用对称算法高速加密。对称算法负责效率，公钥负责分发，二者分工互补。密钥管理之外，加密只解决内容不被窃读；传输是否出错由检错码（c09）负责，平台方是否可见则属于 c13 的信任边界问题。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">N<\/span> 位密钥的空间大小和平均蛮力工作量；密钥加一位空间怎么变？\n<\/li><li>\n凯撒密码为什么扛不住频率分析？现代密码用什么方向抹平频率特征？\n<\/li><li>\nDES 56 位为何在 1999 年被一天破解？AES-128 的 <span class=\"katex-inline\">2^{128}<\/span> 与年度算力 <span class=\"katex-inline\">2^{90}<\/span> 相差多少倍？\n<\/li><li>\n对称加密的密钥分发和密钥增生各指什么？\n<\/li><li>\n为什么说现代密码学假定攻击者知道算法？安全最终寄托在哪里？\n<\/ol>\n<h2>再推一层：密钥空间指数推算，与对称加密的分发/增生难题展开<\/h2>\n<h3>密钥空间计数<\/h3>\n<p><span class=\"katex-inline\">N<\/span> 位密钥每位取 0/1，可能密钥总数 <span class=\"katex-inline\">K=2^N<\/span>。蛮力攻击逐一尝试候选密钥，最坏试完 <span class=\"katex-inline\">K<\/span> 把，平均约试到 <span class=\"katex-inline\">K/2<\/span>，期望工作量 <span class=\"katex-inline\">\\sim2^{N-1}<\/span>，时间与 <span class=\"katex-inline\">2^N<\/span> 成正比（PDF 第 343 页）。密钥从 <span class=\"katex-inline\">N<\/span> 位增到 <span class=\"katex-inline\">N+1<\/span>，空间从 <span class=\"katex-inline\">2^N<\/span> 增到 <span class=\"katex-inline\">2^{N+1}=2\\cdot2^N<\/span>，穷举量翻倍；对抗算力提升靠加位数把指数底数抬上去。<\/p>\n<h3>DES 与 AES 量级对照<\/h3>\n<p>DES 总是 56 位密钥，空间 <span class=\"katex-inline\">2^{56}\\approx7.2\\times10^{16}<\/span>；1976 年到 21 世纪初最常用，随运算速度加快长度已经太短，1999 年廉价专业计算机蛮力攻击穷举一天可破（PDF 第 343–344 页）。AES 由德门与赖曼的 Rijndael 算法在全球公开竞赛胜出，2002 年成为美国政府官方标准，归入公有领域；支持 128、192、256 位（PDF 第 344 页）。<\/p>\n<h3>算力对照核算<\/h3>\n<p>GPU 每秒 <span class=\"katex-inline\">10^{13}<\/span> 次；一百万个 GPU 每秒 <span class=\"katex-inline\">10^{19}<\/span> 次；每年约 <span class=\"katex-inline\">3\\times10^{26}<\/span> 次，约 <span class=\"katex-inline\">2^{90}<\/span> 次（PDF 第 344 页）。AES-128 空间 <span class=\"katex-inline\">2^{128}<\/span>，相对年度算力 <span class=\"katex-inline\">2^{90}<\/span> 相差 <span class=\"katex-inline\">2^{38}\\approx2.7\\times10^{11}<\/span> 倍，蛮力在可及时间内没有结果。DES 的 <span class=\"katex-inline\">2^{56}<\/span> 在 1999 年专用硬件一天量级可穷尽；56 位在当代算力条件下明显过短。<\/p>\n<h3>攻击路径不止蛮力<\/h3>\n<p>字典攻击先试「password」「12345」这类常见单词和数字形式，再试短密钥、长密钥；选密钥偷懒或粗心就会让这种攻击得手（PDF 第 343 页）。攻击者可能知道对应明文，或选取一段明文诱使目标用待破解密钥加密，两相对照缩小密钥空间。好算法要抵御选择明文等各类攻击。<\/p>\n<h3>两条遗留难题<\/h3>\n<p>密钥分发：参与秘密通信的每一方必须知道所用密钥，必须有绝对安全的渠道把密钥送到参与方；来人里有间谍或敌人，分发安全性就无法保证（PDF 第 344 页）。密钥增生：要保证彼此无关的多方独立秘密会话，就要为每组会话准备不同密钥，分发更加困难。<span class=\"katex-inline\">m<\/span> 个参与者两两独立会话需要 <span class=\"katex-inline\">\\binom{m}{2}=m(m-1)/2<\/span> 把密钥，人数增长时密钥数按平方增长（转述：原书定性描述密钥增生，配对数为推算）。这两个难题直接导致公钥加密诞生。<\/p>\n<h2>再推一层：密钥空间的穷举时间连算<\/h2>\n<h3>穷举规模随密钥位长指数膨胀<\/h3>\n<p><span class=\"katex-inline\">b<\/span> 位密钥的可能取值总数是 <span class=\"katex-inline\">2^b<\/span>。DES 用 56 位密钥，空间 <span class=\"katex-inline\">2^{56}\\approx7.2\\times10^{16}<\/span>，1999 年已可在一天量级内被专用设备遍历；AES-128 的 <span class=\"katex-inline\">2^{128}\\approx3.4\\times10^{38}<\/span>，即便按每秒试 <span class=\"katex-inline\">10^{19}<\/span> 量级（转述：设备速率口径）估算，遍历所需时间也远超可观测宇宙年龄，位长每翻倍，穷举规模平方级放大。密钥强度落在位长上，不靠算法保密本身。<\/p>\n<h3>对称加密的效率与遗留代价<\/h3>\n<p>对称算法在硬件流水下吞吐快，适合大批量数据加密；代价是每一条独立会话都要一把独立密钥，<span class=\"katex-inline\">m<\/span> 个参与者两两通信需要 <span class=\"katex-inline\">m(m-1)/2<\/span> 把密钥，密钥数随人数平方增长。网络不可信时，第一把共享密钥本身没有安全渠道送达，这道分发与增生难题留给了 c12 的公钥方案解决。<\/p>\n<h2>补足推导：密钥空间期望工作量、算力连算与密钥增生计数<\/h2>\n<h3>期望穷举工作量<\/h3>\n<p><span class=\"katex-inline\">N<\/span> 位密钥每位取 0/1，密钥总数 <span class=\"katex-inline\">2^N<\/span>。蛮力攻击平均试到一半左右命中，期望工作量约 <span class=\"katex-inline\">2^{N-1}<\/span>，时间与 <span class=\"katex-inline\">2^N<\/span> 成正比；密钥每加一位，搜索空间翻倍，破解时间指数增长。<\/p>\n<h3>算力与位长连算<\/h3>\n<p>GPU 每秒约 <span class=\"katex-inline\">10^{13}<\/span> 次计算；一百万个 GPU 每秒约 <span class=\"katex-inline\">10^{19}<\/span> 次，每年约 <span class=\"katex-inline\">3\\times10^{26}<\/span> 次，约等于 <span class=\"katex-inline\">2^{90}<\/span> 次。DES 56 位空间 <span class=\"katex-inline\">2^{56}\\approx7.2\\times10^{16}<\/span>，1999 年已可一天内穷举；AES-128 为 <span class=\"katex-inline\">2^{128}\\approx3.4\\times10^{38}<\/span>，相对 <span class=\"katex-inline\">2^{90}<\/span> 差距 <span class=\"katex-inline\">2^{38}\\approx2.7\\times10^{11}<\/span> 倍，按该算力量级远不可遍历。前提是算法无缺陷、随机数生成器不可预测；算法漏洞或弱随机数会让长密钥失效。<\/p>\n<h3>密钥增生计数<\/h3>\n<p><span class=\"katex-inline\">m<\/span> 个参与者两两独立会话，每组会话需要一把独立密钥，配对数 <span class=\"katex-inline\">\\binom{m}{2}=m(m-1)/2<\/span>，密钥数随人数平方增长。对称加密还要先经绝对安全渠道把这把共享密钥送出；渠道里有间谍就无法保证，这道分发难题留给 c12 的公钥方案。<\/p><\/div><\/details>", "c12": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.345<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">对称密钥加密：密钥空间、蛮力攻击与 DES/AES 量级<\/a><\/span><\/div><h1>公钥加密：密钥对、分发问题与对称/非对称分工<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书 12.1.2 公钥加密、12.2 信任问题，PDF 第 345–350 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>对称加密要求双方先安全共享同一把密钥，可网络本身不可信，第一把密钥怎么送出去成了死结（c11）。这个概念给出另一条路线：每人持有一对数学关联的密钥，公钥公开、私钥保密，一把加密的消息只能用另一把解密。公钥方案免去预先商定和密钥交换，通信各方甚至不需要认识。本节同时说明公钥为什么慢、真实协议为什么采用「公钥协商会话密钥 + 对称算法传批量数据」的混合分工，以及数字签名、密钥泄露边界和证书信任问题。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>公钥加密（public-key encryption）<\/strong>：迪菲（Whitfield Diffie）和赫尔曼（Martin Hellman）20 世纪 70 年代中期于斯坦福发明，两人获 2015 年图灵奖；英国 GCHQ 的埃利斯（James Ellis）和柯克斯（Clifford Cocks）早几年独立发现，因保密要求到 1997 年才发表（PDF 第 345 页）。<\/p>\n<p><strong>密钥对（key pair）<\/strong>：每个人有一个公钥和一个私钥，二者是数学上有关联的整数。性质：用其中一个密钥加密过的消息只能用另一个解密，反之亦然。密钥足够长时，蛮力攻击和从一个密钥推算另一个密钥都徒劳；破解时间随密钥加长呈指数型增长（PDF 第 345 页）。<\/p>\n<p><strong>公钥公开、私钥保密<\/strong>：公钥开诚布公，任何人都能拿到，一般公布在网站上；私钥只有密钥对的主人知道（PDF 第 345 页）。<\/p>\n<p><strong>单向通信流程<\/strong>：Alice 取 Bob 公钥加密消息发出；Eve 偷听只能发现通信关系，看不到内容；Bob 用自己私钥解开，也只有这把私钥能解开（图 12-2，PDF 第 346 页）。反向回信同构：Bob 用 Alice 公钥加密，Alice 用私钥解开。<\/p>\n<p><strong>解决分发<\/strong>：公钥放在网站上，任何人都可发秘密消息，不必事先商定或交换共享密钥，各方甚至不需要认识（PDF 第 346 页）。<\/p>\n<p><strong>混合分工<\/strong>：公钥算法比 AES 慢好几个数量级，通常分两步：先用公钥协商临时会话密钥，再用 AES 加密批量数据（PDF 第 347 页）。买书时浏览器生成临时口令，用亚马逊公钥加密传出；私钥解出后双方用该口令在 AES 中传送卡号。<\/p>\n<p><strong>数字签名<\/strong>：Alice 先用自己私钥对消息加密并公布；任何人用 Alice 公钥解密。除 Alice 外没人知道她的私钥，接收者可断定消息由 Alice 加密过；前提是私钥没有泄露（PDF 第 347 页）。既要保密又要认证：Alice 先用 Bob 公钥加密，再用自己私钥签署；Bob 先用 Alice 公钥验证来源，再用自己私钥解开密文。<\/p>\n<p><strong>RSA<\/strong>：最常用的公钥算法，由 Rivest、Shamir、Adleman 于 1978 年发明，RSA 取自三人姓氏首字母，三人获 2002 年图灵奖；可靠性来自巨大合数的因数分解难度。生成一个很大的整数（如约 500 位），由两个质因子相乘；掌握质因子的私钥主人能迅速解密，其他人要解密就得先分解质因子（PDF 第 348 页）。<\/p>\n<p><strong>消息摘要（digest，密码学散列）<\/strong>：公钥算法慢，一般签署从原始文档提取的小得多的文档。散列把任意输入换成固定长度比特流，找不到别的输入生成同样摘要，输入轻微改变约一半位变化；比对双方摘要可检测篡改（PDF 第 349 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>RSA 把密钥对建立在大整数分解难题上：两个大质数相乘容易，得到合数；反过来把合数拆回两个质因子，计算量随数位增长快速上升。私钥掌握质因子可快速解密；攻击者只拿到公钥与合数，分解不可行。密钥越长，分解工作量按指数增长（PDF 第 348–349 页）。<\/p>\n<p>信任边界：买书时如何确定对面是亚马逊而非冒牌货？网站发送由独立权威机构签署的证书证明身份；浏览器用权威机构公钥检查证书，确认它属于亚马逊而不是其他机构（PDF 第 350 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：公钥用于初次通信的密钥协商与身份签名；批量数据交给对称算法换取速度，全量公钥加密不现实。\n<\/li><li>\n边界一：私钥泄露后，此前发给本人的消息形同明文，此前签名也不再可信（PDF 第 348 页）。\n<\/li><li>\n边界二：真正撤销一个密钥（宣布此后失效）很困难，撤销仍需配套机制。\n<\/li><li>\n失败案例：把公钥公开理解成身份无需核实。公钥是否真属于对方要靠证书与权威背书；否则中间人可用自己公钥顶替。\n<\/li><li>\n边界三：前向保密（forward secrecy）让每条独立消息用一次性密码、用过即弃；即使后来拿到私钥也无法破译旧消息（PDF 第 348 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>公钥 vs 私钥<\/strong>：公钥可公开，用于加密给本人的消息或验证本人签名；私钥保密，用于解密收到的消息或签署发出的消息。\n<\/li><li>\n<strong>加密 vs 签名<\/strong>：加密用对方公钥，保证只有对方能读；签名用自己私钥，保证内容出自本人。\n<\/li><li>\n<strong>公钥算法 vs 对称算法<\/strong>：公钥解决分发与认证、速度慢；对称速度快，前提是已共享密钥；真实系统二者分工组合。\n<\/li><li>\n<strong>RSA 因子分解 vs AES 密钥空间<\/strong>：RSA 依托分解大合数的难度；AES 依托密钥空间穷举成本；两类难题性质不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c11 的密钥分发与增生难题是公钥方案的动机；c02 位宽决定密钥长度量级。后继：c10 的 <code>https<\/code> 是混合加密与证书校验的落地；c13 云服务把数据交托给平台时，加密保护传输环节，身份与信任仍依赖证书与第三方机构。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（公钥加密：密钥对、分发问题与对称/非对称分工）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：密钥对的数学关联、混合协议时序，与签名/证书的完整流程<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把公钥加密讲成可推演过程，先往回追四层前提：<\/p>\n<ol><li>\n<strong>对称方案卡在第一把密钥的交付<\/strong>。双方要先共享同一密钥，但网络不可信，直接传密钥等于把门户交给中间人；分发与增生难题在算法内部无解（c11）。\n<\/li><li>\n<strong>存在一个「单向不可逆」的数学难题<\/strong>。从公开信息很难反推秘密信息；难题越难，密钥对越稳。RSA 依托大整数分解难度，是这类难题的代表。\n<\/li><li>\n<strong>两个密钥能互逆配对<\/strong>。一对数学关联的整数，一把锁、一把开；公钥可公开，私钥必须保密。\n<\/li><li>\n<strong>信任需要第三方背书<\/strong>。公钥是否真属于对方，不能靠口头声明；证书由权威机构签署，浏览器用机构公钥核验。\n<\/ol>\n<p>依赖链方向：难题构造 → 密钥对生成 → 公钥分发/私钥保管 → 加密或签名流程 → 混合协议协商会话密钥 → 证书核验身份。链条每一层都回答「谁能解开、谁能签发、凭什么相信」。<\/p>\n<h2>正向推导一：密钥对与单向加密流程<\/h2>\n<h3>第一步：生成密钥对<\/h3>\n<p>算法生成一对数学关联的整数：公钥 <span class=\"katex-inline\">P<\/span> 与私钥 <span class=\"katex-inline\">S<\/span>。性质：用 <span class=\"katex-inline\">P<\/span> 加密的消息只能用 <span class=\"katex-inline\">S<\/span> 解密，用 <span class=\"katex-inline\">S<\/span> 加密的消息只能用 <span class=\"katex-inline\">P<\/span> 解密，反之亦然（PDF 第 345 页）。<\/p>\n<h3>第二步：公钥公开，私钥保管<\/h3>\n<p>公钥公布在网站上，任何人可取；私钥只有主人知道，绝不外传。密钥足够长时，蛮力攻击和从一个密钥推算另一个密钥都徒劳；破解时间随密钥加长呈指数型增长（PDF 第 345 页）。<\/p>\n<h3>第三步：Alice 给 Bob 发保密消息<\/h3>\n<p>Alice 先取 Bob 的公钥 <span class=\"katex-inline\">P_B<\/span>，用它加密消息；密文发到网络。Eve 偷听，只能看到有消息发出、知道通信双方是谁，看不到内容（图 12-2，PDF 第 346 页）。<\/p>\n<h3>第四步：Bob 私钥解密<\/h3>\n<p>Bob 收到密文，用自己的私钥 <span class=\"katex-inline\">S_B<\/span> 解密；只有 <span class=\"katex-inline\">S_B<\/span> 能解开 <span class=\"katex-inline\">P_B<\/span> 加密的消息。私钥不在网络上传输，中间人拿不到。<\/p>\n<h3>第五步：反向回信<\/h3>\n<p>Bob 回信用 Alice 的公钥 <span class=\"katex-inline\">P_A<\/span> 加密；Alice 用自己的私钥 <span class=\"katex-inline\">S_A<\/span> 解开。双方不必事先商定，也不需要交换任何共享密钥，甚至不需要认识对方（PDF 第 346 页）。<\/p>\n<h2>正向推导二：混合协议的时序<\/h2>\n<h3>第六步：公钥协商临时会话密钥<\/h3>\n<p>直接用 AES 不可能：双方之间没有共享密钥。浏览器访问购物网站时，先随机生成一个临时口令（会话密钥），用网站公钥加密后传过去（PDF 第 347 页）。<\/p>\n<h3>第七步：对方私钥解出会话密钥<\/h3>\n<p>网站用私钥解出临时口令；此后浏览器与网站都持有这把对称会话密钥。<\/p>\n<h3>第八步：AES 传批量数据<\/h3>\n<p>双方用这把会话口令在 AES 算法中加密传送信用卡号等批量信息。公钥算法只承担很短的密钥协商片段，批量流量走效率高的对称算法。<\/p>\n<h3>第九步：为什么分工<\/h3>\n<p>公钥算法运算速度比 AES 慢好几个数量级；全量数据走公钥算法不现实。两步走：公钥加密协商临时会话密钥，AES 加密后续批量数据（PDF 第 347 页）。浏览器显示 HTTPS 协议连接和门锁图标，即表示这个连接经过加密。<\/p>\n<h2>正向推导三：数字签名与身份核验<\/h2>\n<h3>第十步：签名方向反转<\/h3>\n<p>Alice 要让收信人确认消息出自本人：先用自己的私钥 <span class=\"katex-inline\">S_A<\/span> 对消息加密，结果公布出去；任何人都能用 Alice 的公钥 <span class=\"katex-inline\">P_A<\/span> 解密。除 Alice 外没人知道她的私钥，能被 <span class=\"katex-inline\">P_A<\/span> 解开就断定消息由 Alice 加密过；前提是她的私钥没有泄露（PDF 第 347 页）。<\/p>\n<h3>第十一步：既保密又认证<\/h3>\n<p>Alice 给 Bob 发私人消息：先用 Bob 公钥 <span class=\"katex-inline\">P_B<\/span> 加密保密，再用自己私钥 <span class=\"katex-inline\">S_A<\/span> 签署加密结果。Eve 只能看到发了信息；Bob 先用 <span class=\"katex-inline\">P_A<\/span> 验证消息确实来自 Alice，再用 <span class=\"katex-inline\">S_B<\/span> 解开密文（PDF 第 348 页）。<\/p>\n<h3>第十二步：摘要替代直接签名<\/h3>\n<p>公钥算法慢，一般不直接对整份文档签名，而是签署从原始文档提取的小得多的文档——消息摘要。散列算法把任意输入比特流变换成固定长度比特流；找不到别的输入生成同样摘要；输入最轻微改变都会让输出约一半位变化；比对双方摘要即可检测篡改（PDF 第 349 页）。<\/p>\n<h3>第十三步：证书核验身份<\/h3>\n<p>买书时要确认对面是亚马逊而非冒牌货。网站发送由独立权威机构签署的证书，证明它的身份；浏览器用权威机构发布的公钥检查网站证书，确认它属于亚马逊而不是其他机构（PDF 第 350 页）。没有这层核验，公钥本身可能被中间人顶替。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：RSA 大数与质因子<\/h3>\n<p>RSA 生成一个很大的整数（原书举例长度约 500 位），由两个质因子相乘得到，每个质因子长度约为乘积的一半；私钥主人掌握这两个质因子，可迅速解密；攻击者要先分解质因子（PDF 第 348 页）。<\/p>\n<h3>算例 2：因子分解竞赛量级<\/h3>\n<p>RSA 实验室分解因式大赛 1991 年办到 2007 年；最小的 100 位合数很快被分解；2007 年停办时分解出的最大合数为 193 位（二进制 640 位），奖金 2 万美元（PDF 第 349 页）。分解难度随数位增长快速上升。<\/p>\n<h3>算例 3：散列长度对照<\/h3>\n<p>MD5 由李维斯特开发，结果 128 位；SHA-1 来自 NIST，结果 160 位；MD5 与 SHA-1 使用中都出现弱点，现在被弃用；SHA-2 没有已知弱点；2015 年公开竞赛获胜算法 SHA-3；SHA-2 与 SHA-3 提供 224～512 位密钥范围（PDF 第 350 页）。<\/p>\n<h3>算例 4：输入微动、输出大变<\/h3>\n<p>ASCII 中字母 x 和 X 只差一个位：八进制 78 与 58，二进制 01111000 与 01011000。MD5 散列后 128 位中有 66 位不同；想找到与任一散列值相同的另一输入基本不可能，也无法从散列值反推最初输入（PDF 第 349–350 页）。<\/p>\n<h3>算例 5：混合协议的数据分工<\/h3>\n<p>协商阶段：一把临时会话密钥，经公钥算法加密传送；批量阶段：整段页面、表单、卡号经 AES 用会话密钥加密。公钥流量占比很小，对称流量占比很大。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>没有公钥方案<\/strong>：初次通信只能先靠不可信渠道送共享密钥；密钥分发难题无解，网络陌生人之间无法建立保密通道。\n<\/li><li>\n<strong>全量数据走公钥算法<\/strong>：公钥比对称算法慢好几个数量级，页面与表单传输拖到不可用；混合分工正是用对称速度换取批量效率。\n<\/li><li>\n<strong>私钥泄露<\/strong>：此前发给本人的消息形同明文，此前的签名也不再可信；密钥必须按有效期管理，并配套撤销机制（PDF 第 348 页）。\n<\/li><li>\n<strong>网站公钥无人背书<\/strong>：中间人可把自己的公钥冒充成网站公钥，对话被转接到冒牌货；证书与权威机构核验是身份防顶替的环节。\n<\/li><li>\n<strong>每条消息长期复用同一密钥<\/strong>：一旦密钥泄露，历史消息全部暴露；前向保密让每条独立消息用一次性密码、用过即弃，即使后来拿到私钥也无法破译旧消息（PDF 第 348 页）。\n<\/ul>\n<h2>延伸层：散列、证书与信任链条<\/h2>\n<p>散列摘要把大文档压成固定长度指纹，支撑签名与完整性检测；MD5/SHA-1 因弱点被弃用，说明密码学方案会随攻击进展换代。证书把「公钥属于谁」托付给权威第三方；浏览器内置机构公钥完成核验。整套体系仍需一定程度信任支撑：信任某权威机构、信任私钥保管、信任协议实现没有人工错误。云服务场景（c13）下，加密保护传输链路，却不免除平台方对数据的可见性与留存。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出密钥对的互逆性质，并说明公钥、私钥各自如何保管。\n<\/li><li>\n描述 Alice→Bob 保密消息的完整流程，Eve 能看到什么、看不到什么。\n<\/li><li>\n混合协议为什么先用公钥协商会话密钥、再用 AES 传批量数据？\n<\/li><li>\n数字签名与保密加密在使用谁的密钥上有何不同？既要保密又要认证时怎么组合？\n<\/li><li>\nRSA 可靠性依托什么数学难题？证书由谁签署、浏览器用什么核验？\n<\/ol>\n<h2>再推一层：密钥对互逆性、混合协议时序，与签名/证书流程<\/h2>\n<h3>密钥对的数学关联<\/h3>\n<p>公钥 <span class=\"katex-inline\">P<\/span> 与私钥 <span class=\"katex-inline\">S<\/span> 是数学关联的整数：用 <span class=\"katex-inline\">P<\/span> 加密的消息只能用 <span class=\"katex-inline\">S<\/span> 解密，用 <span class=\"katex-inline\">S<\/span> 加密的消息只能用 <span class=\"katex-inline\">P<\/span> 解密，反之亦然。密钥足够长时，蛮力攻击和从一个密钥推算另一个密钥都徒劳；破解时间随密钥加长呈指数型增长（PDF 第 345 页）。公钥公布在网站上任何人可取，私钥只有主人知道。<\/p>\n<h3>单向通信走查<\/h3>\n<p>Alice 取 Bob 公钥 <span class=\"katex-inline\">P_B<\/span>，用它把消息 <span class=\"katex-inline\">M<\/span> 加密成密文 <span class=\"katex-inline\">C=E_{P_B}(M)<\/span>；<span class=\"katex-inline\">C<\/span> 经可被窃听的信道发出，Eve 截获 <span class=\"katex-inline\">C<\/span> 但没有 <span class=\"katex-inline\">S_B<\/span>，无法解密；Bob 收到后用 <span class=\"katex-inline\">S_B<\/span> 解密得 <span class=\"katex-inline\">M=D_{S_B}(C)<\/span>。反向回信：Bob 用 Alice 公钥 <span class=\"katex-inline\">P_A<\/span> 加密，Alice 用自己私钥 <span class=\"katex-inline\">S_A<\/span> 解开。双方不必事先商定，也不需要交换任何共享密钥，甚至不需要认识（PDF 第 346 页）。<\/p>\n<h3>混合协议分工<\/h3>\n<p>公钥算法运算速度比 AES 慢好几个数量级，全量数据走公钥不现实。浏览器先随机生成临时会话密钥，用网站公钥加密后传出；网站私钥解出会话密钥；此后双方用这把口令在 AES 中加密批量数据（PDF 第 347 页）。公钥只承担很短的密钥协商片段，批量流量走高效对称算法。浏览器显示 HTTPS 与门锁图标即表示连接经过加密。<\/p>\n<h3>签名与组合用途<\/h3>\n<p>签名方向反转：Alice 先用自己私钥 <span class=\"katex-inline\">S_A<\/span> 对消息加密，结果公布；任何人用 Alice 公钥 <span class=\"katex-inline\">P_A<\/span> 解密。除 Alice 外没人知道她的私钥，能被 <span class=\"katex-inline\">P_A<\/span> 解开就断定消息由 Alice 加密过；前提是私钥没有泄露（PDF 第 347 页）。既要保密又要认证：Alice 先用 Bob 公钥 <span class=\"katex-inline\">P_B<\/span> 加密，再用自己私钥 <span class=\"katex-inline\">S_A<\/span> 签署；Bob 先用 <span class=\"katex-inline\">P_A<\/span> 验证来自 Alice，再用 <span class=\"katex-inline\">S_B<\/span> 解开密文。<\/p>\n<h3>RSA 难题与散列<\/h3>\n<p>RSA 由 Rivest、Shamir、Adleman 于 1978 年发明，三人获 2002 年图灵奖；可靠性来自对巨大合数做因数分解的难度。生成一个很大的整数（如长度约 500 位），由两个质因子相乘，每个质因子约为乘积一半长度；掌握质因子的私钥主人能迅速解密，其他人要解密就得先分解质因子（PDF 第 348 页）。RSA 实验室分解大赛 1991 年办到 2007 年，停办时分解出的最大合数 193 位（二进制 640 位），奖金 2 万美元（PDF 第 349 页）。公钥算法慢，一般签署从原始文档提取的小得多的消息摘要；散列把任意输入换成固定长度比特流，找不到别的输入生成同样摘要，输入轻微改变约一半位变化。MD5 结果 128 位、SHA-1 结果 160 位，二者已现弱点被弃用；SHA-2 无已知弱点，SHA-3 为 2015 年竞赛获胜者，SHA-2/SHA-3 提供 224～512 位范围（PDF 第 350 页）。<\/p>\n<h3>证书核验<\/h3>\n<p>买书时要确定对面是亚马逊而非冒牌货。网站发送由独立权威机构签署的证书证明身份；浏览器用权威机构发布的公钥检查网站证书，确认它属于亚马逊而不是其他机构（PDF 第 350 页）。没有这层核验，公钥可能被中间人顶替。私钥泄露后，此前发给本人的消息形同明文，此前签名也不再可信；密钥撤销很困难，前向保密让每条独立消息用一次性密码、用过即弃。<\/p>\n<h2>补足推导：RSA 模幂链、分解难题与混合加密分工<\/h2>\n<h3>RSA 的参数链<\/h3>\n<p>取两个大质数 <span class=\"katex-inline\">p,q<\/span>，令 <span class=\"katex-inline\">n=pq<\/span>；欧拉函数 <span class=\"katex-inline\">\\varphi(n)=(p-1)(q-1)<\/span>。选公钥指数 <span class=\"katex-inline\">e<\/span> 与 <span class=\"katex-inline\">\\varphi(n)<\/span> 互质，再求私钥指数 <span class=\"katex-inline\">d<\/span> 使 <span class=\"katex-inline\">ed\\equiv1\\pmod{\\varphi(n)}<\/span>。加密 <span class=\"katex-inline\">c\\equiv m^e\\pmod n<\/span>，解密 <span class=\"katex-inline\">m\\equiv c^d\\pmod n<\/span>。掌握 <span class=\"katex-inline\">p,q<\/span> 的私钥主人能算出 <span class=\"katex-inline\">\\varphi(n)<\/span> 与 <span class=\"katex-inline\">d<\/span>；攻击者只拿到公钥 <span class=\"katex-inline\">(e,n)<\/span>，要解密必须先分解 <span class=\"katex-inline\">n<\/span> 得到质因子。<\/p>\n<h3>分解难度与模幂实现<\/h3>\n<p>两个大质数相乘容易，把合数拆回质因子的计算量随数位增长快速上升，密钥越长分解工作量越大。大指数运算不靠直接连乘，而靠反复平方并逐次取模，把指数按二进制分解成平方与相乘步骤；即便如此，公钥算法仍比 AES 慢好几个数量级。<\/p>\n<h3>混合分工的边界<\/h3>\n<p>真实协议分两步：先用公钥协商出临时会话密钥，再用 AES 加密批量数据。这样公钥只解决初次通信的密钥协商与身份签名，大批量吞吐交给对称算法。数字签名方向相反：用自己私钥签署，任何人用公钥验证；前提是私钥未泄露。若拿到的公钥并非对方所有，中间人可用自己公钥顶替，因此公钥归属要靠权威证书背书；分解难题当前无多项式算法、证书链可信任，是整套方案成立的两条外部前提。<\/p><\/div><\/details>", "c13": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.330<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c10\">因特网协议栈与万维网：域名/IP/路由/TCP、URL/HTML/CSS<\/a><\/span><\/div><h1>数据收集、跟踪与云计算：画像机制与信任边界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 4 章（原书第 11 章 数据与信息、11.5 云计算，PDF 第 315–335 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>程序和数据存在本机，跨设备传文件要自己想办法；放到服务器上共享方便，但数据交给了谁、谁能看、何时被调取成了新问题。页面还会从几十个服务器下载 cookie、图片和脚本，第三方据此拼出浏览画像。这个概念分两条线：云计算把计算负载与存储从本机转到服务器端的条件与收益；跟踪、画像、聚合与再识别机制，以及加密只保护传输内容、不保护元数据与平台可见性的边界。落点是说清「信任边界画在哪」。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>本地计算模型<\/strong>：程序及数据保存在自己计算机中；换机器用同一文件得自己传过去，不同平台还要分别购买程序（PDF 第 330 页）。<\/p>\n<p><strong>云计算（cloud computing）<\/strong>：用浏览器访问和操作因特网服务器上保存的信息，信息保存在「云端」即服务商服务器上（图 11-5，PDF 第 331 页）。邮件、社交、网盘、在线日历与在线文档都是云服务。<\/p>\n<p><strong>云成立的条件<\/strong>：个人算力变强，浏览器能高效运行显示程序，客户端语言是解释型 JavaScript；带宽与延迟明显改善；大量数据可放服务器，体系也适用于手机（PDF 第 331 页）。在线文档支持多用户并发与同步更新（PDF 第 332 页）。<\/p>\n<p><strong>cookie 与第三方跟踪<\/strong>：网页可引用任何域的图片，图像 URL 编码进请求页面的标识；取图时提供图片的域知道你访问过哪个页面，可在本机存放该域 cookie；JavaScript 脚本按同样方式运转（PDF 第 315 页）。实验：访问 toyota.com 初始从 79 个服务器下载 200 多个 cookie、图片、脚本，合计超 4MB，部分 cookie 有效期长达几年（图 11-4，PDF 第 315 页）。<\/p>\n<p><strong>网页信标（web bug）<\/strong>：1 像素、无边框、可能透明的图，页面上看不见，唯一用途是跟踪；请求它时跟踪方知道你在读特定页面，可存 cookie，跨站记录浏览特性（PDF 第 316 页）。<\/p>\n<p><strong>浏览器指纹<\/strong>：不靠 cookie，靠操作系统、浏览器版本、语言偏好、字体、插件等特征组合识别；HTML5 画布指纹生成特定字符序列，几个信号即可在无 cookie 下区分个人（PDF 第 318 页）。<\/p>\n<p><strong>画像与推断<\/strong>：访问网页越多，跟踪方对性格爱好的记录越详细，可能推断年龄、婚姻状况、车辆、居住区域和工作单位，从而识别到个人（PDF 第 317 页）。社交网络的显式和隐性连接还可预测性别、性取向和政治倾向。<\/p>\n<p><strong>元数据（metadata）<\/strong>：通信对象、何时拨出、通话时长这类元数据，即使不知道内容，组合后也能披露亲密关系、就医轨迹、联系网络（PDF 第 324 页）。<\/p>\n<p><strong>再识别（re-identification）<\/strong>：删除身份信息可降低识别度，但多来源组合很可能挖掘出更多身份特征；某些来源连提供者自己都不知道（PDF 第 301 页前后）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>云负载转移：客户端 JavaScript 要求浏览器快速刷新图形、响应拖放与服务器端更新；服务器端高带宽承担大量存储与并发同步。浏览器适配判断可放到服务器端，只发适配代码（PDF 第 333 页）。<\/p>\n<p>跟踪链路：页面加载 → 第三方域图片/脚本被请求 → 请求携带页面标识与既有 cookie → 第三方记录访问 → 跨站汇总成画像。广告中介在零点几秒内把浏览者信息连同空位发给客户竞价，胜出广告插入页面（PDF 第 319 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：云服务依赖客户端算力、浏览器能力、JavaScript 执行与带宽延迟改善；跟踪依赖第三方域能嵌入页面、cookie 可持久化、跨站可汇总。\n<\/li><li>\n边界一：加密只保护传输内容。HTTPS 端到端加密保护内容不被检查或修改，但无法隐藏元数据（PDF 第 323 页）。\n<\/li><li>\n边界二：匿名化不等于不可识别。AOL 2006 年公布 65 万用户 2000 万条匿名查询日志，每条带随机唯一标识符，结合搜索内容仍易确定身份（PDF 第 300 页前后）。\n<\/li><li>\n失败案例一：以为关了 cookie 就无法被识别。浏览器指纹、画布指纹不依赖 cookie；匿名模式只清本机历史与 cookie，已存特征再访问仍可匹配（PDF 第 320 页）。\n<\/li><li>\n失败案例二：把云服务当本地存储等价物。云端数据由服务商保管，访问、调取、担责与强制公开属于技术之外的法律与信任问题（PDF 第 334 页）。\n<\/li><li>\n边界三：DNT 只是请求加一条 HTTP 头部，站点可自愿忽视；规避跟踪可关第三方 cookie、用屏蔽插件，但要付兼容性代价（PDF 第 319–320 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>本地 vs 云模型<\/strong>：本地程序数据在本机、跨设备自行传文件；云模型数据在服务器、浏览器访问，软件始终最新，数据实时备份。\n<\/li><li>\n<strong>第一方 vs 第三方 cookie<\/strong>：第一方服务本站登录；第三方由嵌入页面的跟踪域设置，跨站汇总画像，可关闭而不影响多数站点。\n<\/li><li>\n<strong>内容加密 vs 元数据保护<\/strong>：HTTPS 隐藏报文内容，不隐藏通信双方、时间、流量等元数据。\n<\/li><li>\n<strong>匿名化 vs 再识别<\/strong>：去掉直接标识降低单表识别度；多源交叉可重新锁定个人。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c10 协议栈与浏览器加载流程是跟踪嵌入的技术通道；c11、c12 加密保护这条通道的内容段。后继：本章是硬件、软件、网络机制在数据与隐私层面的收口，风险哪些由技术解决、哪些只能靠制度与信任安排。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（数据收集、跟踪与云计算：画像机制与信任边界）<\/summary><div class=\"depth-body\"><h1>c13 深度推导：云负载的转移路径，跟踪画像的拼接链条，与再识别的交叉推算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把数据收集、跟踪和云计算讲成可推演过程，先往回追四层前提：<\/p>\n<ol><li>\n<strong>数据先有存放位置<\/strong>。本地模型把程序和数据放在本机，跨设备要手动传递；云模型把数据放到服务器，经浏览器访问。存放位置决定了谁掌握数据。\n<\/li><li>\n<strong>页面加载会引入第三方资源<\/strong>。网页可引用任何域的图片、脚本；第三方域在被请求时拿到页面标识和 cookie，这是跨站跟踪的技术通道（c10）。\n<\/li><li>\n<strong>识别可以不依赖直接身份<\/strong>。cookie、浏览器特征、画布指纹、元数据、社交连接都是间接信号；多源信号交叉能拼出画像甚至锁定个人。\n<\/li><li>\n<strong>技术能力有其边界<\/strong>。加密保护报文内容，不保护元数据；匿名化降低单表识别度，挡不住多源交叉；平台可见性与调取权限属于法律和信任安排。\n<\/ol>\n<p>依赖链方向：本地/云存放选择 → 浏览器取数 → 第三方嵌入与信号收集 → 跨站汇总画像 → 多源交叉再识别；信任边界在「平台、机构、法律辖区」三处分别划定。<\/p>\n<h2>正向推导一：从本地模型到云模型的转移<\/h2>\n<h3>第一步：本地模型的负担<\/h3>\n<p>本地模型下，文档、账目、照片软件都在自己电脑上运行；改完文件想在另一台机器用，得自己传；Windows PC 与 Mac 要分别购买程序；手机也不属于这些系统（PDF 第 330 页）。<\/p>\n<h3>第二步：云模型的访问方式<\/h3>\n<p>用浏览器访问和操作因特网服务器上保存的信息。邮件不必下载到本地文件系统，存在服务器即可；社交联系和照片存在 Facebook 等服务上，而不是手机里；服务几乎全免费，成本是看邮件或登录动态时看到的广告（PDF 第 330–331 页）。<\/p>\n<h3>第三步：云成立的条件<\/h3>\n<p>个人计算机能力变强；浏览器能高效运行大量显示需求的大型程序，编程语言仍是解释型 JavaScript；服务器到客户机的带宽和延迟相比 10 年前明显改善，快速取回数据有保障；大量数据可放服务器，体系也适用于手机，有时不必再下载应用（PDF 第 331 页）。<\/p>\n<h3>第四步：负载在两端之间分配<\/h3>\n<p>客户端 JavaScript 代码要求浏览器快速刷新图形显示，对拖放等操作和服务器端更新迅速响应；服务器端承担高带宽、大量存储和多用户并发同步。判断客户端浏览器类型这类逻辑可以放服务器，只下发适配代码，保证代码尽可能少、运行尽可能快（PDF 第 333 页）。<\/p>\n<h3>第五步：云办公并发<\/h3>\n<p>Google Docs 含文字处理、电子表格和 PPT，基本可与 Microsoft Office 竞争，支持多用户并发访问和同步更新；文档只有一份，不在多个电脑里保存多个不一致版本（PDF 第 332、334 页）。<\/p>\n<h2>正向推导二：跟踪与画像的拼接链条<\/h2>\n<h3>第六步：第三方资源被请求<\/h3>\n<p>网页引用的图片可来自任何域；图像 URL 把请求页面的标识编码进去。浏览器取图片时，提供图片的域知道你访问过哪个页面，并可在本机存放该域 cookie、收到此前访问生成的 cookie；JavaScript 脚本按同样方式运转（PDF 第 315 页）。<\/p>\n<h3>第七步：像素信标记录访问<\/h3>\n<p><code>&lt;img&gt;<\/code> 标签从跟踪域取一幅长宽各 1 像素、无边框、可能透明的图；页面上看不见。浏览器请求这幅图时，跟踪方知道你正在阅读某特定页面，允许的话存 cookie；访问其他也用该跟踪方的网站时，它开始记录浏览特性（PDF 第 316 页）。<\/p>\n<h3>第八步：跨站汇总成画像<\/h3>\n<p>你访问的网页越多，跟踪方在性格和爱好上的数据库越详细，可能推断出年龄、婚姻状况、车辆、居住区域、工作单位；即便多数公司声称不这么做，从某种程度也能对这个人识别（PDF 第 317 页）。点赞按钮给供应商发送 cookie 的机会，单击后发回偏好信息。<\/p>\n<h3>第九步：广告竞价插入<\/h3>\n<p>请求网页时，发布者通知广告位中介有一个空位待售，连同浏览者信息（年龄段、居住城市、科技和餐馆偏好等）一起发出；广告客户竞价，胜出广告插入页面；整个过程只有零点几秒（PDF 第 319 页）。<\/p>\n<h3>第十步：无 cookie 识别路线<\/h3>\n<p>浏览器指纹结合操作系统、浏览器、版本号、语言偏好、字体和插件等特征，通常独一无二；HTML5 画布指纹生成特定字符序列；拿到几个识别信号，不需要 cookie 也能区分识别某个人（PDF 第 318 页）。<\/p>\n<h2>正向推导三：元数据与多源再识别<\/h2>\n<h3>第十一步：元数据披露关系<\/h3>\n<p>即使不知道双方谈了什么，通信对象、时间、时长这类元数据也能反映关系：深夜频繁通话的两人关系密切，通话减少可能关系结束；一段时间联系一次不如每周联系亲密。一通电话序列可以拼出就医、咨询等故事线（PDF 第 324 页）。<\/p>\n<h3>第十二步：匿名化的局限<\/h3>\n<p>删除直接身份标识能降低单表识别度；但现实信息来源多方面，组合多源数据很可能挖出更多身份特征；某些来源的信息连提供者自己都不知道，将来也未必还能找得到（PDF 第 301 页前后）。<\/p>\n<h3>第十三步：AOL 查询日志案例<\/h3>\n<p>2006 年 8 月，AOL 出于研究目的公开三个多月、65 万用户的 2000 万条查询日志，做了匿名处理。每个查询带随机但唯一的标识符，据此能知道同一个人查过什么；不少人搜过自己的名字、地址、社会保险号，相关性分析暴露的信息比 AOL 以为的多；确定一些人的身份成为可能，日志很快传遍世界（PDF 第 300 页前后）。<\/p>\n<h3>第十四步：Sweeney 体检记录案例<\/h3>\n<p>1997 年，MIT 博士拉坦娅·斯威尼分析马萨诸塞州 135000 名雇员的体检记录，记录做了反识别处理，来源为州保险委员会，可用于研究甚至卖给私人公司。每条记录含生日、性别、邮政编码；她发现 6 个人生日是 1945 年 7 月 31 日，其中 3 个男性，只有 1 人住在坎布里奇；与公开选民登记名单对照，确认此人是时任州长威廉·韦尔德（PDF 第 301 页前后）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：单次页面的跟踪载荷<\/h3>\n<p>解除防御访问 toyota.com：初始访问从 79 个不同服务器下载超过 200 个 cookie、图片、脚本和其他内容，合计超过 4MB；有些 cookie 有效期长达几年（PDF 第 315 页）。启用正常防御后不收任何 cookie 或脚本，屏蔽 3 个 JavaScript 追踪器。<\/p>\n<h3>算例 2：定位特征收窄<\/h3>\n<p>体检记录里生日 1945-07-31 共 6 人 → 男性收窄到 3 人 → 邮编坎布里奇收窄到 1 人。生日、性别、邮编三个准标识符组合，就能对照公开名册锁定个人。<\/p>\n<h3>算例 3：广告过程时间尺度<\/h3>\n<p>广告发布、中介传讯、客户竞价、广告插入整个过程只有零点几秒（PDF 第 319 页）；跟踪与竞价在页面渲染同期完成。<\/p>\n<h3>算例 4：云服务清单<\/h3>\n<p>邮件：Gmail、Outlook；社交：Facebook、Instagram、Twitter、领英；存储：Dropbox；工具：在线日历；办公：Google Docs。数据分别存在对应服务商服务器上（PDF 第 331 页）。<\/p>\n<h3>算例 5：元数据信号种类<\/h3>\n<p>电话号码、何时拨出、通话时长；社交网络的显性和隐性连接；点赞与点击；IP 地址与 cookie；位置服务记录的停留地点。这些不必是内容本身，组合后仍可推断身份与倾向。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>所有数据只存本机<\/strong>：跨设备同步、多人协作、随时访问都要自建传递方案；云的实时备份、单文档多端协作和容量优势无法获得。\n<\/li><li>\n<strong>页面只引用第一方资源<\/strong>：第三方图片和脚本不被加载，跨站跟踪缺少固定身份锚点；但登录态、广告、嵌入内容等依赖第三方的功能也会受限。\n<\/li><li>\n<strong>关闭 cookie 就认为无法被识别<\/strong>：浏览器指纹、画布指纹不依赖 cookie；匿名模式只清本机痕迹，网站已存的特征仍可在再次访问时匹配。\n<\/li><li>\n<strong>匿名化处理后就断定安全<\/strong>：直接标识删除不等于身份不可重建；AOL 日志和体检记录都说明多源交叉可以再识别。\n<\/li><li>\n<strong>以为加密能盖住一切<\/strong>：HTTPS 端到端加密保护内容不被检查或修改，但元数据（通信双方、时间、流量）仍可见；深度包检测下内容与元数据要分开评估。\n<\/ul>\n<h2>延伸层：信任边界与制度安排<\/h2>\n<p>云计算把数据交托给平台，随之出现一组技术之外的问题：谁可以访问保存在云端的数据，什么情况下可以访问；信息意外泄露是否需要担责；谁有权强制公开数据；邮件服务商能否自愿或在法律诉讼胁迫下向政府机关公开通信记录，当事人是否知情（PDF 第 334 页）。这些问题部分涉技术、部分涉法律，答案取决于居住在哪个司法辖区。美国与欧盟对个人数据收集的规定宽严不同。技术能做的边界是：端到端加密保护内容、屏蔽插件减少跟踪、关闭第三方 cookie、匿名模式清理本机痕迹；身份核验、调取权限、数据留存与再识别防护，要靠制度、隐私政策和用户选择共同安排。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n本地模型与云模型在程序、数据存放和跨设备协作上的差别是什么？\n<\/li><li>\n云服务成为现实依赖哪几方面条件成熟？负载如何在客户端与服务器端分配？\n<\/li><li>\n写出第三方图片/脚本被请求时，跟踪方拿到哪些信号？像素信标为什么页面上看不见？\n<\/li><li>\n浏览器指纹不依赖 cookie，靠哪些特征组合识别个人？\n<\/li><li>\n匿名化为什么挡不住再识别？结合 AOL 日志或体检记录案例说明多源交叉的作用。\n<\/ol>\n<h2>再推一层：云负载两端分配，跟踪信号拼接链，与再识别交叉推算<\/h2>\n<h3>本地与云的存放差别<\/h3>\n<p>本地模型下程序和数据都在自己计算机：Word 写文档、表格记账、照片软件管照片；换机器用同一文件得自己传，Windows PC 与 Mac 要分别购买程序，手机也不属于这些系统（PDF 第 330 页）。云模型用浏览器访问服务器保存的信息：邮件存在服务器即可，社交联系和照片存在 Facebook 等服务上而不是手机里；服务几乎全免费，成本是看邮件和动态时看到的广告（PDF 第 330–331 页）。<\/p>\n<h3>云成立的条件与两端分工<\/h3>\n<p>个人计算机能力变强；浏览器能高效运行大量显示需求的大型程序，客户端编程语言仍是解释型 JavaScript；服务器到客户机的带宽和延迟相比 10 年前明显改善，快速取回数据有保障；大量数据可放服务器，体系也适用于手机，有时不必下载应用（PDF 第 331 页）。客户端 JavaScript 要求浏览器快速刷新图形显示，对拖放等操作和服务器端更新迅速响应；服务器端承担高带宽、大量存储和多用户并发同步。判断客户端浏览器类型这类逻辑可放服务器，只下发适配代码，保证代码尽可能少、运行尽可能快（PDF 第 333 页）。Google Docs 含文字处理、电子表格和演示程序，基本可与 Microsoft Office 竞争，支持多用户并发访问和同步更新（PDF 第 332 页）。<\/p>\n<h3>第三方跟踪拼接链<\/h3>\n<p>页面引用的图片可来自任何域，图像 URL 把请求页面的标识编码进去；浏览器取图片时，提供图片的域知道你访问过哪个页面，并可在本机存放该域 cookie、收到此前访问生成的 cookie；JavaScript 脚本按同样方式运转（PDF 第 315 页）。像素信标是长宽各 1 像素、无边框、可能透明的图，唯一用处是跟踪；浏览器请求这幅图时跟踪方知道你在读某页面，允许的话存 cookie，访问其他也用该跟踪方的网站时开始记录浏览特性（PDF 第 316 页）。广告竞价在页面渲染同期完成：发布者把空位连同浏览者信息发给中介，客户竞价，胜出广告插入，整个过程只有零点几秒（PDF 第 319 页）。<\/p>\n<h3>无 cookie 识别与元数据<\/h3>\n<p>浏览器指纹结合操作系统、浏览器、版本号、语言偏好、字体和插件等特征，通常独一无二；HTML5 画布指纹生成特定字符序列，拿到几个识别信号即可在不需要 cookie 的情况下区分个人（PDF 第 318 页）。元数据包括电话号码、何时拨出、通话时长；即使不知道谈了什么，通信对象、时间、频率也能反映亲密关系、就医轨迹和联系网络。社交网络的点赞按钮给供应商发送 cookie 机会，单击后发回偏好信息；显式和隐性连接可用于预测性别、种族背景、性取向和政治倾向。<\/p>\n<h3>再识别两个案例<\/h3>\n<p>AOL 2006 年公开三个多月、65 万用户的 2000 万条查询日志，做了匿名处理；每个查询带随机但唯一标识符，据此能知道同一个人查过什么；不少人搜过自己的名字、地址、社会保险号，相关性分析暴露的信息比预想多，确定身份成为可能，数据早已传遍世界（PDF 第 300 页前后）。1997 年 Sweeney 分析马萨诸塞州 135000 名雇员的体检记录，记录已反识别处理，含生日、性别、邮编；她发现 6 个人生日是 1945 年 7 月 31 日，其中 3 个男性，只有 1 人住坎布里奇；对照公开选民登记名单，确认此人是时任州长 William Weld（PDF 第 301 页前后）。生日、性别、邮编三个准标识符组合就能对照名册锁定个人。<\/p>\n<h3>信任边界划分<\/h3>\n<p>加密保护报文内容不被检查或修改，不隐藏元数据；匿名化降低单表识别度，挡不住多源交叉。云端数据由服务商保管，谁能访问、什么情况访问、泄露是否担责、谁有权强制公开，属于技术之外的法律与信任安排；答案取决于居住在哪个司法辖区。技术手段——端到端加密、屏蔽插件、关闭第三方 cookie、匿名模式——各有明确边界，身份核验、调取权限、留存与再识别防护要靠制度和用户选择共同安排。<\/p><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：硬件与数据表示：计算机部件、位与二进制、模数转换、CPU 执行与缓存<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章）<\/a><br>检查点：能画出 CPU、RAM、二级存储、输入输出经总线相连的结构图，算出 8 位能表示的组合数，沿抽样率与量化位数算一段音频的数据量，走完一条指令的取指—译码—执行循环并解释缓存局部性<\/li><li class='path-step' id='path-02'><strong>步骤 02：软件：算法与复杂度、二分查找、排序、程序设计语言、编译与操作系统<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第二部分 软件：算法、程序设计语言与软件系统（原书第 4–7 章）<\/a><br>检查点：能写出线性遍历的步骤并指出除零等边界，按每次折半推出二分查找的比较次数，估算选择排序与快速排序在 N 个数据上的工作量，说明高级语言到位模式的编译链路，以及操作系统如何调度进程与管理资源<\/li><li class='path-step' id='path-03'><strong>步骤 03：通信：网络带宽与延迟、压缩、错误检测、因特网协议栈与万维网<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第三部分 通信：网络、因特网与万维网（原书第 8–10 章）<\/a><br>检查点：能区分链路瓶颈与光速传播延迟，比较无损与有损压缩；说出奇偶校验与 Luhn 校验覆盖的错误类型；沿域名→IP→路由→IP 包→TCP 流走通一次通信，拆解 URL 各字段并说清 HTML/CSS 与编程语言的差别<\/li><li class='path-step' id='path-04'><strong>步骤 04：数据、隐私与安全：对称加密、公钥加密、数据跟踪与云计算<\/strong><br>阅读：<a href=\"#/chapter/ch04\">数据、隐私与安全：数据与信息、隐私与安全（原书第 11–12 章，含第 10 章网络安全部分）<\/a><br>检查点：能写出密钥空间随位数指数增长的估算式，对比 DES 与 AES 的密钥长度后果；解释公钥/私钥配对关系与分发问题，说出对称与公钥各自适合的场景；梳理搜索、跟踪、画像与云存储把数据交托给了谁，以及加密只解决传输安全的边界<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='cpu（中央处理单元，central processing unit）'>CPU（中央处理单元，Central Processing Unit） — 执行算术运算、数据移动并控制其他组件操作的处理器；按内部时钟节拍工作，速度以赫兹、兆赫或千兆赫计量（原书 1.1.1 节，PDF 第 38–39 页） <span class=glossary-ref>（第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章））<\/span><\/li><li data-term='ram（随机存取存储器，random access memory）'>RAM（随机存取存储器，Random Access Memory） — 存储当前运行程序的指令与数据的初级内存；CPU 可按任意次序快速访问其中任意位置，内容可改写（原书 1.1.2 节，PDF 第 40 页） <span class=glossary-ref>（第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章））<\/span><\/li><li data-term='总线（bus）'>总线（bus） — 把处理器、内存、二级存储与输入输出部件连接在一起、互相传输信息的一组电缆（原书 1.1 节，PDF 第 37 页） <span class=glossary-ref>（第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章））<\/span><\/li><li data-term='位（bit）'>位（bit） — 表示数字信息的最基本单位，取值只有 0 或 1；N 位可表示 $2^N$ 种组合（原书 2.3.1 节，PDF 第 64–65 页） <span class=glossary-ref>（第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章））<\/span><\/li><li data-term='字节（byte）'>字节（byte） — 成组的位，通常 8 位构成一个字节，用来表示一个字符或一段数值（原书 2.3.4 节，PDF 第 69 页前后） <span class=glossary-ref>（第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章））<\/span><\/li><li data-term='模数转换（a/d 转换）'>模数转换（A/D 转换） — 把声音、图像等连续模拟量按固定间隔采样、再量化成离散数值的过程；反向把数值变回模拟量称为数模转换（D/A）（原书 2.2 节，PDF 第 60–61 页） <span class=glossary-ref>（第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章））<\/span><\/li><li data-term='缓存（cache）'>缓存（cache） — 容量较小但速度较快的存储层，保存最近使用的信息及其邻近块，以避免访问更慢的下层存储；依据时间与空间局部性提速（原书 3.3 节，PDF 第 89–90 页） <span class=glossary-ref>（第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章））<\/span><\/li><li data-term='算法（algorithm）'>算法（algorithm） — 用含义完整定义的基本操作写出的一系列步骤，覆盖所有可能输入，并保证在有限步后终止；运算效率随数据量增长的方式是算法分析的核心（原书第 4 章，PDF 第 103 页） <span class=glossary-ref>（第二部分 软件：算法、程序设计语言与软件系统（原书第 4–7 章））<\/span><\/li><li data-term='二分查找（binary search）'>二分查找（binary search） — 在已排序列表中每次比较中点、舍弃一半候选的搜索法；比较次数为以 2 为底 N 的对数（原书 4.2 节，PDF 第 107–108 页） <span class=glossary-ref>（第二部分 软件：算法、程序设计语言与软件系统（原书第 4–7 章））<\/span><\/li><li data-term='编译器（compiler）'>编译器（compiler） — 把高级语言程序翻译为目标处理器汇编指令的翻译程序；常分为负责生成中间形式的前端与负责生成不同体系结构指令的后端（原书 5.2 节，PDF 第 124–126 页） <span class=glossary-ref>（第二部分 软件：算法、程序设计语言与软件系统（原书第 4–7 章））<\/span><\/li><li data-term='操作系统（operating system）'>操作系统（operating system） — 管理计算机硬件资源、调度与协调运行中程序的后台程序；负责 CPU 分配、内存与磁盘管理、设备驱动与文件系统（原书 6.1 节，PDF 第 155–157 页） <span class=glossary-ref>（第二部分 软件：算法、程序设计语言与软件系统（原书第 4–7 章））<\/span><\/li><li data-term='带宽（bandwidth）'>带宽（bandwidth） — 链路每秒能传输的数据量；数据流速度取决于路径上许可速度最低的环节（原书 8.6 节，PDF 第 228–229 页） <span class=glossary-ref>（第三部分 通信：网络、因特网与万维网（原书第 8–10 章））<\/span><\/li><li data-term='奇偶校验位（parity bit）'>奇偶校验位（parity bit） — 附在一组位末尾的冗余位，使整组中 1 的个数为偶或为奇；可检出单个位出错，检不出同时两位出错（原书 8.8 节，PDF 第 234 页） <span class=glossary-ref>（第三部分 通信：网络、因特网与万维网（原书第 8–10 章））<\/span><\/li><li data-term='ip（因特网协议，internet protocol）'>IP（因特网协议，Internet Protocol） — 定义单个数据包格式与传输方式的无连接、不可靠、尽力而为协议；IPv6 源目地址为 128 位；TTL 字段每跳减 1，到 0 丢弃（原书 9.4.1 节，PDF 第 254–255 页） <span class=glossary-ref>（第三部分 通信：网络、因特网与万维网（原书第 8–10 章））<\/span><\/li><li data-term='tcp（传输控制协议，transmission control protocol）'>TCP（传输控制协议，Transmission Control Protocol） — 在不可靠 IP 之上把字节流切分成报文段、附带序列号，提供可靠双向数据流的高层协议（原书 9.4.2 节，PDF 第 255 页） <span class=glossary-ref>（第三部分 通信：网络、因特网与万维网（原书第 8–10 章））<\/span><\/li><li data-term='公钥加密（public-key encryption）'>公钥加密（public-key encryption） — 每个用户持有数学关联的密钥对：公钥公开、私钥保密；一把密钥加密的消息只能用另一把解密，解决对称加密的密钥分发难题（原书 12.1.2 节，PDF 第 345 页） <span class=glossary-ref>（数据、隐私与安全：数据与信息、隐私与安全（原书第 11–12 章，含第 10 章网络安全部分））<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：先按职责对号入座，再谈物理实现<\/h2>\n<p>看一台计算机或一个新设备，先把部件归到处理器、内存、二级存储、输入输出、总线五类职责，再谈芯片工艺、外观和形态差异。手机把键鼠屏融合成一块触摸屏，超算横向放大处理器与内存数量，职责划分不变。跳过职责直接讨论工艺，容易把传感器与输出部件混淆，也解释不了为什么更换 RAM 中的指令就能让同一硬件换一项任务。<\/p>\n<h2>模式 2：容量先归到比特，再做位宽与量级换算<\/h2>\n<p>描述任何数据量先归到比特：图片按像素乘通道乘位深，音频按采样率乘声道乘精度，文本按字符乘字节。换算字节除以 8，对照 2 的幂与 10 的幂两套量级。编码 <span class=\"katex-inline\">M<\/span> 种状态所需最少位数满足 <span class=\"katex-inline\">2^N\\ge M<\/span>；心算数量级时 <span class=\"katex-inline\">2^{10}<\/span> 与 1000 的小幅偏差通常可忽略，但标称频率还是容量、用哪套幂要分清。<\/p>\n<h2>模式 3：沿局部性解释缓存，而不是把缓存当成提速魔法<\/h2>\n<p>缓存提速来自两条可观察的程序规律：时间局部性（最近用过的信息很可能再用）和空间局部性（访问某位置后邻近位置很快被访问）。缓存按连续块加载，容量逐级增大、速度逐级递减。分析慢程序时先判断循环里反复使用的指令和变量是否落在缓存；缓存不能无限增长，旧项目会被剔除。RAM 可作磁盘缓存，浏览器可缓存页面与图片，同一思路下沉到各层存储。<\/p>\n<h2>模式 4：算法先立正确性与终止性，再比较效率<\/h2>\n<p>写步骤先满足四条约束：操作含义完整定义、输入类型给定、所有情况覆盖、有限步终止。空输入、重复值、除零等边界要显式分支；缺了终止条件，「打泡漂洗重复」式循环不构成算法。效率分析只保留随数据量增长的主项，初始化等常数次操作不计入。比较两种算法时先核对前提是否相同：二分查找的对数收益建立在表已排序之上，排序成本要一并核算。<\/p>\n<h2>模式 5：量级对比看增长曲线，不看小规模试跑<\/h2>\n<p>把工作量归到 <span class=\"katex-inline\">\\log N<\/span>、<span class=\"katex-inline\">N<\/span>、<span class=\"katex-inline\">N\\log N<\/span>、<span class=\"katex-inline\">N^2<\/span> 几条曲线上：小规模数据差距有限，<span class=\"katex-inline\">N<\/span> 增大后二次与近线性拉开数量级。规模放大倍数直接代换：<span class=\"katex-inline\">N\\to2N<\/span> 时 <span class=\"katex-inline\">N^2<\/span> 变 4 倍，<span class=\"katex-inline\">N\\to10N<\/span> 变 100 倍。选算法不能只靠小数据试跑的快慢；同量级算法之间还要看每项操作的实际成本与内存访问，量级是分类，不是性能保证。<\/p>\n<h2>模式 6：分层问题逐层定位，每层只依赖下层服务<\/h2>\n<p>软件与网络都是分层结构：应用程序、TCP、IP、物理层，每层依赖下层服务、为上层提供服务。排查通信或程序问题时沿层向下定位：上层面对信息流，不必操心数据包；IP 负责独立包尽力投递，TCP 负责拼成有序流。跨层混用职责（让 IP 保证可靠、让 HTML 承担算法逻辑）会破坏分层抽象。分层也意味着每一层有自己的前提与盲区，不能用一层的能力承诺另一层。<\/p>\n<h2>模式 7：冗余按用途分方向——压缩去冗余，检错加冗余<\/h2>\n<p>压缩与检错纠错都处理冗余，方向相反：压缩删除真实冗余以缩短编码，检错纠错有意加入受控冗余以换取错误可见性。先分清目标是省带宽还是保可靠：频率编码把常见符号变短；校验位按模 2 或模 10 计算。检错能力与加入的冗余位数成正比，一位校验只能判有无错误，定位与纠错要更多冗余。校验只能证明编码自洽，不能证明内容真实存在。<\/p>\n<h2>模式 8：安全问题分清「保护了哪一段」，再画信任边界<\/h2>\n<p>评估一项安全机制先问它保护什么：对称与公钥保护报文内容，校验码保护完整性，证书核验身份归属。传输加密不覆盖元数据，也不免除平台方可见性；匿名化不挡多源交叉再识别；私钥泄露会牵连历史消息与签名。数据放到云端后，谁能访问、什么条件下调取、泄露是否担责、谁有权强制公开，属于技术之外的法律与信任安排。技术手段（端到端加密、屏蔽跟踪、关闭第三方 cookie）有明确边界，超出边界的部分要靠制度与用户选择补。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 硬件<\/strong>：冯·诺依曼结构、位与二进制、模数转换、CPU 执行与多级缓存（原书第 1–3 章，PDF 第 34–94 页）。\n<\/li><li>\n<strong>第 2 章 软件<\/strong>：算法与线性查找、二分查找与排序增长量级、程序设计语言、编译与操作系统（原书第 4–7 章，PDF 第 102–184 页）。\n<\/li><li>\n<strong>第 3 章 通信<\/strong>：带宽与传播延迟、数据压缩、错误检测与纠错、IP/TCP 协议栈、万维网（原书第 8–10 章，PDF 第 212–303 页）。\n<\/li><li>\n<strong>第 4 章 数据、隐私与安全<\/strong>：对称加密、公钥加密、数据跟踪与云计算（原书第 11–12 章，PDF 第 305–359 页）。\n<\/ul>\n<h2>位宽与编码容量<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>项<\/th><th>关系<\/th><th>数值<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">N<\/span> 位组合数<\/td><td><span class=\"katex-inline\">2^N<\/span><\/td><td>2 位 4 种，3 位 8 种<\/td><\/tr><tr><td>字节<\/td><td>8 位<\/td><td><span class=\"katex-inline\">2^8=256<\/span> 种取值<\/td><\/tr><tr><td>2 的幂对照<\/td><td><span class=\"katex-inline\">2^{10}=1024<\/span>，<span class=\"katex-inline\">2^{20}=1\\,048\\,576<\/span>，<span class=\"katex-inline\">2^{30}=1\\,073\\,741\\,824<\/span><\/td><td>心算与 <span class=\"katex-inline\">10^3/10^6/10^9<\/span> 近似<\/td><\/tr><tr><td>十进制量级<\/td><td><span class=\"katex-inline\">10^3<\/span> kilo，<span class=\"katex-inline\">10^6<\/span> mega，<span class=\"katex-inline\">10^9<\/span> giga，<span class=\"katex-inline\">10^{12}<\/span> tera，<span class=\"katex-inline\">10^{15}<\/span> peta<\/td><td>与 2 的幂有小幅近似偏差<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>模数转换的数据量<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>载体<\/th><th>参数<\/th><th>未压缩比特量<\/th><\/tr><\/thead><tbody><tr><td>图片<\/td><td>3000×2000 像素，RGB 三通道<\/td><td>600 万像素，1800 万强度值/通道<\/td><\/tr><tr><td>CD 音频<\/td><td>44100 样本/秒，立体声 2 声道，16 位<\/td><td><span class=\"katex-inline\">44100\\times2\\times16=1\\,411\\,200<\/span> 位/秒<\/td><\/tr><tr><td>精度<\/td><td><span class=\"katex-inline\">1/65536=2^{16}<\/span><\/td><td>量化级数<\/td><\/tr><\/tbody><\/table><\/div>\n<p>抽样率决定可还原频率上限，量化位数决定幅值分辨精度；A/D 与 D/A 双向都有损失。<\/p>\n<h2>存储层级与速度定性次序<\/h2>\n<p>CPU 内部缓存最快 → RAM 次之 → 二级存储（硬盘/SSD）最慢。缓存靠时间局部性（最近用过很可能再用）与空间局部性（按连续块加载）提速；容量逐级增大、速度逐级递减。作者笔记本每核 256KB 二级缓存、4MB 三级缓存（PDF 第 90 页）。<\/p>\n<h2>算法增长量级<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>量级<\/th><th>来源<\/th><th>典型步数<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">O(\\log N)<\/span><\/td><td>二分查找，每次折半<\/td><td>1024 项约 10 次；<span class=\"katex-inline\">10^6<\/span> 约 20 次；<span class=\"katex-inline\">10^9<\/span> 约 30 次<\/td><\/tr><tr><td><span class=\"katex-inline\">O(N)<\/span><\/td><td>线性遍历<\/td><td>比较次数与人数成正比<\/td><\/tr><tr><td><span class=\"katex-inline\">N\\log N<\/span><\/td><td>快速排序分治<\/td><td>16 名 <span class=\"katex-inline\">16\\log_2 16=64<\/span> 次<\/td><\/tr><tr><td><span class=\"katex-inline\">O(N^2)<\/span><\/td><td>选择排序<\/td><td><span class=\"katex-inline\">N(N+1)/2\\approx N^2/2<\/span>；16 名 136 次<\/td><\/tr><\/tbody><\/table><\/div>\n<p>二分前提是表已排序；<span class=\"katex-inline\">N<\/span> 加倍时二次增长约 4 倍，10 倍约 100 倍，1000 倍约 100 万倍。<\/p>\n<h2>网络量级对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>链路<\/th><th>带宽量级（原书列举，含理论值）<\/th><\/tr><\/thead><tbody><tr><td>最早调制解调器<\/td><td>110 bps<\/td><\/tr><tr><td>DSL/电缆<\/td><td>几兆位/秒<\/td><\/tr><tr><td>802.11 无线<\/td><td>理论 600 Mbps<\/td><\/tr><tr><td>以太网<\/td><td>1 Gbps<\/td><\/tr><tr><td>光纤<\/td><td>100 Gbps 以上<\/td><\/tr><tr><td>4G<\/td><td>静止理想 1 Gbps，运动 100 Mbps<\/td><\/tr><\/tbody><\/table><\/div>\n<p>端到端带宽取各段最小值；传播时延 <span class=\"katex-inline\">T_{\\text{prop}}=L/c<\/span>，真空中 <span class=\"katex-inline\">c\\approx3\\times10^8<\/span> 米/秒，约 1 英尺/纳秒；发送时间 <span class=\"katex-inline\">T_{\\text{send}}\\approx D/B<\/span>。<\/p>\n<h2>校验对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>方法<\/th><th>校验对象<\/th><th>覆盖错误<\/th><th>盲区<\/th><\/tr><\/thead><tbody><tr><td>奇偶校验位<\/td><td>二进制位，模 2 统计 1 的个数<\/td><td>单比特翻转可检出<\/td><td>两位同时翻转漏检；不能定位错位<\/td><\/tr><tr><td>Luhn 算法<\/td><td>十进制卡号/取款机编码，模 10 加权求和<\/td><td>单数码错、多数相邻换位错<\/td><td>系数相同的换位检不出；不证明卡号真实存在<\/td><\/tr><tr><td>纠错码<\/td><td>内存、CD/DVD、二维码<\/td><td>可定位并纠正单/多位错<\/td><td>冗余比例高于单纯检错<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>协议分层（图 9-3，自下而上）<\/h2>\n<p>物理层 → IP → TCP → 应用程序。IP 无连接、不可靠、尽力而为；包可丢失、损坏、乱序、重复；IP 包最大约 65KB；IPv6 地址 128 位；TTL 单字节每跳减 1，到 0 丢弃并回报错包。TCP 在 IP 之上提供可靠双向流，报文段带序列号；UDP 简单高效，用于 DNS、流媒体、VoIP、在线游戏。<\/p>\n<h2>加密量级对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>算法<\/th><th>密钥长度<\/th><th>处境<\/th><\/tr><\/thead><tbody><tr><td>DES<\/td><td>56 位<\/td><td>1999 年廉价专用机蛮力一天可破<\/td><\/tr><tr><td>AES<\/td><td>128/192/256 位<\/td><td>密钥空间巨大；AES-128 面对蛮力很安全<\/td><\/tr><tr><td>算力估算<\/td><td>单 GPU <span class=\"katex-inline\">10^{13}<\/span> 次/秒；百万 GPU <span class=\"katex-inline\">10^{19}<\/span> 次/秒；年约 <span class=\"katex-inline\">3\\times10^{26}\\approx2^{90}<\/span><\/td><td>距 <span class=\"katex-inline\">2^{128}<\/span> 差 <span class=\"katex-inline\">2^{38}\\approx2.7\\times10^{11}<\/span> 倍<\/td><\/tr><\/tbody><\/table><\/div>\n<p>对称加密加解密同一共享密钥，快但有密钥分发与密钥增生难题；公钥加密用数学关联的密钥对，公钥加密、私钥解密，解决分发但速度慢好几个数量级。真实 <code>https<\/code> 为混合方案：公钥协商临时会话密钥，AES 传批量数据。<\/p>\n<h2>跟踪与信任边界<\/h2>\n<ul><li>\n信号来源：第三方图片/脚本、1 像素信标、cookie、JavaScript、浏览器指纹与画布指纹、元数据、社交连接、位置服务。\n<\/li><li>\n加密边界：HTTPS 保护报文内容不被检查或修改，不隐藏元数据；匿名化挡不住多源交叉再识别。\n<\/li><li>\n云模型：程序与数据放在服务商服务器，经浏览器访问；谁能访问、何时调取、泄露责任、强制公开权限，属于技术之外的法律与信任安排。\n<\/ul>"}};

/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}
