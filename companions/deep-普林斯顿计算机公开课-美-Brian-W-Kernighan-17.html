<!DOCTYPE html>

<head>

<title>普林斯顿计算机公开课（学习伴侣）</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>
<style id="zs-visual-theme">

  --ok: #12805f;
  --bad: #c02a44;
  --warn: #9a5b00;

  --dot: rgba(57, 80, 222, .10);

html,
body {

}

body {

}, {"id": "c11", "title": "对称密钥加密：密钥空间、蛮力攻击与 DES/AES 量级", "file": "concepts/c11.md", "chapterIds": ["ch04"], "difficulty": "进阶", "source": {"file": "library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 343}, "prerequisites": ["c02"], "depthFragment": "concepts/c11-depth.md"}, {"id": "c12", "title": "公钥加密：密钥对、分发问题与对称/非对称分工", "file": "concepts/c12.md", "chapterIds": ["ch04"], "difficulty": "进阶", "source": {"file": "library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 345}, "prerequisites": ["c11"], "depthFragment": "concepts/c12-depth.md"}, {"id": "c13", "title": "数据收集、跟踪与云计算：画像机制与信任边界", "file": "concepts/c13.md", "chapterIds": ["ch04"], "difficulty": "基础", "source": {"file": "library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 330}, "prerequisites": ["c10"], "depthFragment": "concepts/c13-depth.md"}], "glossary": [{"term": "CPU（中央处理单元，Central Processing Unit）", "def": "执行算术运算、数据移动并控制其他组件操作的处理器；按内部时钟节拍工作，速度以赫兹、兆赫或千兆赫计量（原书 1.1.1 节，PDF 第 38–39 页）", "chapterId": "ch01"}, {"term": "RAM（随机存取存储器，Random Access Memory）", "def": "存储当前运行程序的指令与数据的初级内存；CPU 可按任意次序快速访问其中任意位置，内容可改写（原书 1.1.2 节，PDF 第 40 页）", "chapterId": "ch01"}, {"term": "总线（bus）", "def": "把处理器、内存、二级存储与输入输出部件连接在一起、互相传输信息的一组电缆（原书 1.1 节，PDF 第 37 页）", "chapterId": "ch01"}, {"term": "位（bit）", "def": "表示数字信息的最基本单位，取值只有 0 或 1；N 位可表示 $2^N$ 种组合（原书 2.3.1 节，PDF 第 64–65 页）", "chapterId": "ch01"}, {"term": "字节（byte）", "def": "成组的位，通常 8 位构成一个字节，用来表示一个字符或一段数值（原书 2.3.4 节，PDF 第 69 页前后）", "chapterId": "ch01"}, {"term": "模数转换（A/D 转换）", "def": "把声音、图像等连续模拟量按固定间隔采样、再量化成离散数值的过程；反向把数值变回模拟量称为数模转换（D/A）（原书 2.2 节，PDF 第 60–61 页）", "chapterId": "ch01"}, {"term": "缓存（cache）", "def": "容量较小但速度较快的存储层，保存最近使用的信息及其邻近块，以避免访问更慢的下层存储；依据时间与空间局部性提速（原书 3.3 节，PDF 第 89–90 页）", "chapterId": "ch01"}, {"term": "算法（algorithm）", "def": "用含义完整定义的基本操作写出的一系列步骤，覆盖所有可能输入，并保证在有限步后终止；运算效率随数据量增长的方式是算法分析的核心（原书第 4 章，PDF 第 103 页）", "chapterId": "ch02"}, {"term": "二分查找（binary search）", "def": "在已排序列表中每次比较中点、舍弃一半候选的搜索法；比较次数为以 2 为底 N 的对数（原书 4.2 节，PDF 第 107–108 页）", "chapterId": "ch02"}, {"term": "编译器（compiler）", "def": "把高级语言程序翻译为目标处理器汇编指令的翻译程序；常分为负责生成中间形式的前端与负责生成不同体系结构指令的后端（原书 5.2 节，PDF 第 124–126 页）", "chapterId": "ch02"}, {"term": "操作系统（operating system）", "def": "管理计算机硬件资源、调度与协调运行中程序的后台程序；负责 CPU 分配、内存与磁盘管理、设备驱动与文件系统（原书 6.1 节，PDF 第 155–157 页）", "chapterId": "ch02"}, {"term": "带宽（bandwidth）", "def": "链路每秒能传输的数据量；数据流速度取决于路径上许可速度最低的环节（原书 8.6 节，PDF 第 228–229 页）", "chapterId": "ch03"}, {"term": "奇偶校验位（parity bit）", "def": "附在一组位末尾的冗余位，使整组中 1 的个数为偶或为奇；可检出单个位出错，检不出同时两位出错（原书 8.8 节，PDF 第 234 页）", "chapterId": "ch03"}, {"term": "IP（因特网协议，Internet Protocol）", "def": "定义单个数据包格式与传输方式的无连接、不可靠、尽力而为协议；IPv6 源目地址为 128 位；TTL 字段每跳减 1，到 0 丢弃（原书 9.4.1 节，PDF 第 254–255 页）", "chapterId": "ch03"}, {"term": "TCP（传输控制协议，Transmission Control Protocol）", "def": "在不可靠 IP 之上把字节流切分成报文段、附带序列号，提供可靠双向数据流的高层协议（原书 9.4.2 节，PDF 第 255 页）", "chapterId": "ch03"}, {"term": "公钥加密（public-key encryption）", "def": "每个用户持有数学关联的密钥对：公钥公开、私钥保密；一把密钥加密的消息只能用另一把解密，解决对称加密的密钥分发难题（原书 12.1.2 节，PDF 第 345 页）", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [], "flashcards": []}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.34<\/div><h1>第 1 章：第一部分 硬件——计算机里有什么、位与信息表示、深入 CPU<\/h1>\n<blockquote>对应原书第 1 章「计算机里有什么」、第 2 章「位、字节和信息的表示」、第 3 章「深入 CPU」（PDF 第 34–94 页；印刷页 = PDF 页 − 28）。硬件部分讲逻辑体系结构而非物理制造细节：部件职责、信息如何用位表示、CPU 如何一步步执行指令。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n画出 CPU、RAM、二级存储（硬盘/SSD）、输入输出部件经总线相连的结构图，说清冯·诺依曼架构中处理器、内存、外设各自的职责；\n<\/li><li>\n算出 <span class=\"katex-inline\">N<\/span> 位能表示多少种组合，把一个十进制数按位值展开成二进制，区分位、字节与 2 的幂、10 的幂；\n<\/li><li>\n顺着抽样与量化两条线说明图片、声音如何变成数字：像素与 RGB 通道、采样率与量化位数，并估算一段数字音频的数据量；\n<\/li><li>\n沿取指—译码—执行循环推演一条指令在玩具计算机上的生命周期，解释多级缓存靠什么局部性提速，以及缓存容量与速度为什么此消彼长。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>通用计算机是一套固定的逻辑结构：处理器运算与控制，RAM 暂存当前程序的指令和数据，二级存储长期保存，部件之间经总线交换信息；所有信息最终都落成 0 和 1 的位模式，CPU 在循环取指、译码、执行中把这些位模式变成看得见的结果，缓存则用快而小的存储层掩盖慢而大的存储层的等待。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：冯·诺依曼逻辑结构（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。原书 1.1 节把通用计算机抽象成一张图：一个处理器（CPU）、一些初级存储（RAM）、一些二级存储（硬盘、闪存 SSD），再加上鼠标、键盘、显示器、GPS、加速度传感器等其他部件，所有部件由一组叫作总线（bus）的电缆连在一起互相传输信息（PDF 第 37 页）。这套基础组织自 20 世纪 40 年代起形成规范，常以约翰·冯·诺依曼命名：CPU 提供算法和控制，RAM 和磁盘承担记忆存储，键盘、鼠标、显示器负责与人交互（PDF 第 38 页）。手机和平板的结构图与此相似，只是鼠标、键盘、显示器被融合进显示屏，另外多出罗盘、加速度传感器、GPS 接收器这类隐藏部件。<\/p>\n<h3>2. 概念 2：位、字节与二进制表示（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。计算机是数字处理器，存储和处理的都是离散数值；信息通过位（bit）表示，位取 0 或 1 两种值，成组的位再表示数字、字母、声音、图片和程序本身（PDF 第 53 页）。一个位只能表示二选一的情形；两个位有 4 种组合，三个位有 8 种，<span class=\"katex-inline\">N<\/span> 位有 <span class=\"katex-inline\">2^N<\/span> 种（PDF 第 65 页）。原书图 2-10 给出常用对照：<span class=\"katex-inline\">2^{10}=1024<\/span>，<span class=\"katex-inline\">2^{20}=1\\,048\\,576<\/span>，<span class=\"katex-inline\">2^{30}=1\\,073\\,741\\,824<\/span>；十进制这边 <span class=\"katex-inline\">10^3<\/span> 是 kilo，<span class=\"katex-inline\">10^6<\/span> 是 mega，<span class=\"katex-inline\">10^9<\/span> 是 giga，<span class=\"katex-inline\">10^{12}<\/span> 是 tera，<span class=\"katex-inline\">10^{15}<\/span> 是 peta（PDF 第 67 页）。<\/p>\n<h3>3. 概念 3：模拟、抽样与模数转换（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。真实世界的量多是模拟的：水龙头、方向盘、水银体温计的液柱随事物平滑连续变化；数字系统处理离散数据，取值数量固定，微小改变可能让数值从一个离散值跳到另一个（PDF 第 54 页）。图片数字化靠像素（pixel）：一张 <span class=\"katex-inline\">3000\\times2000<\/span> 的图片是 600 万个像素，每个像素记录红、绿、蓝三个通道的光强度，合计 1800 万个光强度值（PDF 第 57 页）。声音数字化靠固定时间间隔抽样：CD 标准每秒取样 44100 个，每个样本取左右两个声道的幅值，幅值精度为 <span class=\"katex-inline\">1/65536<\/span>，即 <span class=\"katex-inline\">2^{16}<\/span>（PDF 第 61 页）。<\/p>\n<h3>4. 概念 4：CPU 执行机制与多级缓存（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。CPU 有一个小型指令系统：加减乘除等算术运算，从 RAM 取数、把结果存回 RAM，比较两个数字并据此决定下一步（PDF 第 76 页）。原书用一台纸面「玩具计算机」说明机制：它有存指令和数据的 RAM、一个只存一个数值的累加器（类似计算器显示屏）、一张只含 10 条指令的表（PDF 第 77 页）。运行时 CPU 从 RAM 第一个位置开始重复三步：取指（Fetch，从 RAM 取下一条指令）、译码（Decode，解析指令内容）、执行（Execute，执行该指令），然后返回取指。缓存是容量小但速度快的内存，存放最近使用的信息以避免访问 RAM；典型 CPU 有 2～3 级缓存，容量依次增大、速度递减，作者笔记本每个核心配 256KB 二级缓存和单个 4MB 三级缓存（PDF 第 89–90 页）。<\/p>\n<h2>推导一（推演）：位宽与可表示组合数的展开<\/h2>\n<p>设要给大学四个年级加研究生共五类身份编码。1 个位只有 0、1 两种取值，不够；2 个位的组合为 00、01、10、11，共 4 种，仍不够第五类；3 个位枚举为 000、001、010、011、100、101、110、111，共 8 种，可以把教师、教工、博士后都容纳进来（原书 2.3.1 节的例子，PDF 第 65 页）。 一般地，每增加 1 位，组合数在原有基础上翻倍：第 <span class=\"katex-inline\">k<\/span> 位取 0 时前 <span class=\"katex-inline\">k-1<\/span> 位的每种组合仍在，取 1 时再复制一份，因此 <span class=\"katex-inline\">N<\/span> 位的组合数满足递推 <span class=\"katex-inline\">C(1)=2<\/span>，<span class=\"katex-inline\">C(N)=2C(N-1)<\/span>，展开得 <span class=\"katex-inline\">C(N)=2^N<\/span>。反过来，要编码 <span class=\"katex-inline\">M<\/span> 种互斥状态，所需最少位数满足 <span class=\"katex-inline\">2^N\\ge M<\/span>，即 <span class=\"katex-inline\">N\\ge \\log_2 M<\/span>。例如 26 个英文字母需要 5 位（<span class=\"katex-inline\">2^4=16&lt;26\\le 32=2^5<\/span>）；ASCII 文本每个字母占 1 个字节即 8 位，共 <span class=\"katex-inline\">2^8=256<\/span> 种取值（PDF 第 230 页）。<\/p>\n<h2>推导二（推演）：一段 CD 数字音频的数据量<\/h2>\n<p>CD 每秒取样 44100 次，立体声左右两个声道，每个样本幅值用 16 位（<span class=\"katex-inline\">2^{16}=65536<\/span> 级）量化（PDF 第 61 页）。 每秒位数 = 取样率 × 声道数 × 量化位数 = <span class=\"katex-inline\">44100\\times2\\times16=1\\,411\\,200<\/span> 位/秒；换算成字节除以 8，得 <span class=\"katex-inline\">176\\,400<\/span> 字节/秒，约 172 KB/s。一首 4 分钟（240 秒）的乐曲未压缩数据量为 <span class=\"katex-inline\">176\\,400\\times240\\approx42.3<\/span> MB。这个量级解释了为什么音频需要压缩：MP3、AAC 大约能把文件压到原来的十分之一，而人耳几乎察觉不到音质下降（PDF 第 62 页）。抽样率决定能还原的频率上限，量化位数决定幅值分辨精度；两者下降，听感上会先后出现高频发闷和噪声底变粗。<\/p>\n<h2>反事实：去掉某个机制会怎样<\/h2>\n<ul><li>\n<strong>去掉 RAM，只保留二级存储<\/strong>：指令和数据都放在速度慢得多的磁盘/闪存上，CPU 每取一条指令、读一个数都要等二级存储响应；处理器再快也被存取等待拖死。RAM 的存在让当前运行程序的指令和数据进入快速可改写的工作区，这正是存储程序概念的关键：往 RAM 里换不同指令，同一台硬件就能做文字处理、表格、浏览、邮件等不同工作（PDF 第 40 页）。\n<\/li><li>\n<strong>缓存整块拿掉<\/strong>：程序循环里反复使用的指令和变量每次都要从 RAM 重新读取。原书 3.3 节举例，求和循环中 6 条指令对每个输入数值执行一遍，若这些指令存在缓存里，就不必每轮都等 RAM；去掉缓存，每轮循环都补上一次慢速读取，循环越密损失越大（PDF 第 89 页）。\n<\/li><li>\n<strong>信息不用位模式而直接保存模拟量<\/strong>：复制、传输、存储都会累积失真，也无法像数字数据那样去除冗余压缩、加密、精确复制并在不同设备间搬运（PDF 第 55 页）。数字系统的可处理性建立在离散位之上。\n<\/li><li>\n<strong>CPU 不能根据比较结果决定下一步<\/strong>：处理器退化成普通计算器，每个步骤都要人工介入指令；无法自主运行整个系统，程序的循环、分支都无从谈起（PDF 第 76 页）。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章是全书的硬件底座：部件职责与位表示贯穿后面所有章节。第 2 章算法与程序建立在「指令和数据都以位存于 RAM、CPU 按循环执行」这套机制之上；第 3 章网络讨论的数据包、第 4 章加密讨论的密钥空间，其容量计算都回到本章的 <span class=\"katex-inline\">2^N<\/span>。下一章在这套硬件上看软件：算法步骤如何设计、效率随数据量怎么增长、程序怎样通过编译落到本章的 CPU 指令上。<\/p>", "kind": "chapter", "title": "第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章）"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.102<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章）<\/a><\/span><\/div><h1>第 2 章：第二部分 软件——算法、程序设计语言与软件系统<\/h1>\n<blockquote>对应原书第 4 章「算法」、第 5 章「编程与编程语言」、第 6 章「软件系统」、第 7 章「学习编程」（PDF 第 102–184 页；印刷页 = PDF 页 − 28）。软件部分回答：计算步骤怎样才算一个算法、效率随数据量怎样变化、人写的程序怎样变成 CPU 能执行的指令、操作系统在中间管什么。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出算法的四条约束：操作含义完整定义、输入类型给定、所有情况覆盖、有限步内终止，并指出「打泡、漂洗、重复」为什么不算算法；\n<\/li><li>\n写出遍历求最大值与求平均的线性步骤，标出零人输入等边界处理，说明线性时间与数据量成正比；\n<\/li><li>\n按每次折半推出二分查找的比较次数为 <span class=\"katex-inline\">\\log_2 N<\/span>，对比选择排序的 <span class=\"katex-inline\">N(N+1)/2<\/span> 与快速排序的 <span class=\"katex-inline\">N\\log_2 N<\/span>，说出数据放大 2 倍、10 倍、1000 倍时各自的时间代价；\n<\/li><li>\n沿高级语言 → 编译器 → 汇编器 → 位模式的链路说明编译过程，区分前端与后端；讲清操作系统如何调度进程、管理 CPU/内存/磁盘，并说清软件分层的依赖关系。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>算法是含义明确、覆盖全情况、必然终止的步骤序列，其效率按随数据量增长的量级分类；线性遍历逐项检查，二分查找靠有序前提每次舍弃一半，排序在二次增长与分治的近线性增长之间拉开差距；人用高级语言表达计算，编译器把它翻成体系结构相关的指令，操作系统在底层把硬件资源分给同时运行的各个程序。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 5：算法与线性查找（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。原书把算法定义为「确保算出正确结果的一系列步骤」：每个步骤用含义完整定义的基本操作表达，输入数据类型给定，所有可能情况都覆盖到，算法绝不会遇到不知道下一步做什么的情况；学究式的计算机科学还要求算法必须在最后终止（PDF 第 103 页）。经典洗发指令「打泡、漂洗、重复」不满足终止条件，不算算法。线性算法的代表是找最高的人：依次询问每个人的身高，把更高的记为当前最高；人数翻 2 倍，询问次数翻 2 倍，人数翻 10 倍，时间翻 10 倍，时间与数据量成正比，称为线性时间（PDF 第 104、106 页）。<\/p>\n<h3>2. 概念 6：二分查找（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。若名单按字母顺序排列，不必逐项找：从大约中间开始，要找的名字在中间之前就舍弃后半部，否则舍弃前半部，每一步都知道该找哪一半（PDF 第 107 页）。原书算例：最初 1024 个名字，一次比较去掉 512 个，再剩 256、128、64、32、16、8、4、2、1，总共比较 10 次，正好对应 <span class=\"katex-inline\">2^{10}=1024<\/span>（PDF 第 107 页）。1000 个名字约查 10 次，2000 个约 11 次；一百万约 <span class=\"katex-inline\">10^6\\approx2^{20}<\/span>，约 20 次；10 亿约 <span class=\"katex-inline\">2^{30}<\/span>，约 30 次。数据量增长到 1000 倍，二分查找只多约 10 步（PDF 第 108 页）。<\/p>\n<h3>3. 概念 7：排序与增长量级（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。选择排序反复遍历剩余数据项找出下一个名字：16 个名字，找第一个查 16 次，第二个 15 步，依此类推，总检查次数 <span class=\"katex-inline\">16+15+\\cdots+2+1=136<\/span>（PDF 第 110 页）。一般情形工作量为 <span class=\"katex-inline\">N+(N-1)+\\cdots+1=N(N+1)/2<\/span>，随 <span class=\"katex-inline\">N<\/span> 增大近似与 <span class=\"katex-inline\">N^2<\/span> 成正比，称为二次增长：数据项加倍时间变 4 倍，变 10 倍时间变 100 倍，变 1000 倍时间变 100 万倍（PDF 第 111 页）。快速排序（Quicksort，Tony Hoare 于 1959 年左右发明）是分而治之的例子：每遍遍历把数据分成大小相近的两组，递归再分；16 个名字分 8、4、2、1 四遍，工作量 <span class=\"katex-inline\">16\\log_2 16=64<\/span> 次操作，对比选择排序 136 次（PDF 第 112–113 页）。图 4-1 把 <span class=\"katex-inline\">\\log N<\/span>、<span class=\"katex-inline\">N<\/span>、<span class=\"katex-inline\">N\\log N<\/span>、<span class=\"katex-inline\">N^2<\/span> 四条曲线画在一起（PDF 第 113 页）。<\/p>\n<h3>4. 概念 8：程序设计语言与编译（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。汇编语言直接对应处理器指令表：两台指令集不同的 CPU，同一份计算要分别改写指令序列，程序员必须熟悉两种处理器（PDF 第 124 页）。20 世纪 50 年代末到 60 年代初，独立于任何 CPU 体系结构的高级编程语言问世，让人以接近自然语言的方式表达计算；代码经编译器翻译成目标处理器的汇编指令，再由汇编器转换为位模式加载执行（PDF 第 124 页）。同一个表达式 <span class=\"katex-inline\">Z=X+Y<\/span>，编译器 #1 生成三条指令，编译器 #2 生成两条指令，各自汇编器再落成不同的位模式（图 5-1，PDF 第 125 页）。编译器内部常分前端与后端：前端把高级语言转成中间形式，后端把中间形式转成不同体系结构的汇编指令，比为每种机器写一个完整编译器简单（PDF 第 126 页）。<\/p>\n<h3>5. 概念 9：操作系统与软件分层（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。20 世纪 50 年代初还没有应用程序与操作系统之分，一次只能运行一个程序，程序员要预约时段上机；第一批广泛使用的操作系统诞生于 50 年代末 60 年代初，由硬件厂商用汇编语言写成并与硬件紧密相连（PDF 第 155–156 页）。MIT 1961 年开发 CTSS 兼容分时系统；1969 年贝尔实验室 Ken Thompson 和 Dennis Ritchie 结合 CTSS 与 Multics 的经验开始开发 Unix，二人因此获 1983 年图灵奖；今天多数操作系统要么源自 Unix，要么是兼容 Unix 独立开发的 Linux（PDF 第 156 页）。操作系统控制和分配计算机资源：管理 CPU，调度协调当前运行程序，挂起等待状态的程序，强行中断占用 CPU 过多的程序；通常要管理数十个同时运行的进程或任务（PDF 第 157 页）。<\/p>\n<h2>推导一（推演）：选择排序工作量的求和与二次增长<\/h2>\n<p>选择排序第 <span class=\"katex-inline\">k<\/span> 轮在剩余 <span class=\"katex-inline\">N-k+1<\/span> 个数据项中找下一个，比较次数等于剩余项数。总工作量<\/p>\n<div class=\"katex-block\">S_N=N+(N-1)+(N-2)+\\cdots+2+1.<\/div>\n<p>把首尾成对相加：<span class=\"katex-inline\">N+1<\/span>、<span class=\"katex-inline\">(N-1)+2<\/span>、<span class=\"katex-inline\">(N-2)+3<\/span>，每对和为 <span class=\"katex-inline\">N+1<\/span>，共 <span class=\"katex-inline\">N/2<\/span> 对，得 <span class=\"katex-inline\">S_N=N(N+1)/2=N^2/2+N/2<\/span>。当 <span class=\"katex-inline\">N<\/span> 很大时，低阶的 <span class=\"katex-inline\">N/2<\/span> 相对 <span class=\"katex-inline\">N^2/2<\/span> 可忽略，工作量近似 <span class=\"katex-inline\">N^2/2<\/span>，量级为 <span class=\"katex-inline\">O(N^2)<\/span>。代入 <span class=\"katex-inline\">N=1000<\/span>：<span class=\"katex-inline\">S_{1000}=1000\\times1001/2=500\\,500<\/span>，<span class=\"katex-inline\">N^2=1\\,000\\,000<\/span>，主项占一半量级。规模放大：<span class=\"katex-inline\">N<\/span> 变 <span class=\"katex-inline\">2N<\/span>，<span class=\"katex-inline\">S<\/span> 变约 <span class=\"katex-inline\">4S<\/span>；变 <span class=\"katex-inline\">10N<\/span>，<span class=\"katex-inline\">S<\/span> 变约 <span class=\"katex-inline\">100S<\/span>；变 <span class=\"katex-inline\">1000N<\/span>，<span class=\"katex-inline\">S<\/span> 变约 <span class=\"katex-inline\">10^6 S<\/span>。这就是原书说二次增长「非常糟糕」的算术依据（PDF 第 111 页）。<\/p>\n<h2>推导二（推演）：二分查找折半次数与对数<\/h2>\n<p>设有序表有 <span class=\"katex-inline\">N<\/span> 项，每次比较中点后舍弃一半，候选数从 <span class=\"katex-inline\">N<\/span> 变为 <span class=\"katex-inline\">\\lceil N/2\\rceil<\/span>。重复到候选剩 1 项或确认不存在，所需折半次数 <span class=\"katex-inline\">k<\/span> 满足 <span class=\"katex-inline\">N/2^k\\le1<\/span>，即 <span class=\"katex-inline\">2^k\\ge N<\/span>，<span class=\"katex-inline\">k\\ge\\log_2 N<\/span>。以 1024 为例：<span class=\"katex-inline\">1024\\to512\\to256\\to128\\to64\\to32\\to16\\to8\\to4\\to2\\to1<\/span>，折了 10 次，<span class=\"katex-inline\">\\log_2 1024=10<\/span>（PDF 第 107 页）。规模换算：<span class=\"katex-inline\">1000<\/span> 接近 <span class=\"katex-inline\">2^{10}<\/span>，约 10 次；<span class=\"katex-inline\">2000<\/span> 首次比较就去掉 1000 个，回到 1000 的情形，再加 1 次共 11 次；<span class=\"katex-inline\">10^6\\approx2^{20}<\/span>，约 20 次；<span class=\"katex-inline\">10^9\\approx2^{30}<\/span>，约 30 次。前提是表已排序；无序表只能线性遍历，二分查找的对数收益建立在排序成本之上。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>算法不要求覆盖所有情况<\/strong>：求平均的步骤若不检查「没人」的情形，机器会拿 0 去除和；原书给出的修正版本先统计人数 <span class=\"katex-inline\">N<\/span>，<span class=\"katex-inline\">N&gt;0<\/span> 才算平均，否则报告「未给出身高数据」（PDF 第 105 页）。缺了边界分支，程序在空输入上崩溃或给出未定义运算的结果。\n<\/li><li>\n<strong>算法不要求终止<\/strong>：「打泡、漂洗、重复」式循环没有退出条件，程序可能永远运行下去；算法分析连最坏运行时间都无从界定。\n<\/li><li>\n<strong>高级语言没有编译器，只能写汇编<\/strong>：换一种处理器就得重写全部程序，程序员必须熟悉每种指令集；程序跨体系结构的普适性消失，为多种机器开发软件的成本大幅上升（PDF 第 126 页）。\n<\/li><li>\n<strong>操作系统不做进程调度<\/strong>：多个程序争抢同一 CPU，一个程序占住不放，其他程序得不到响应；等待下载网页、跟踪鼠标、刷新显示器的程序与计算密集程序互相干扰，没有挂起和中断机制，整机表现为「一片混乱」（PDF 第 157 页）。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章承接第 1 章的硬件：算法步骤最终要落在 CPU 的取指—译码—执行循环上，编译链路把高级语言翻译成这套指令，操作系统再把 CPU、内存、磁盘分给各程序。下一章进入通信：程序产生的数据要跨设备传送，带宽、延迟、压缩、错误检测决定这些数据怎样穿过网络，第 12 章的协议栈分层正是本章软件分层思路在网络侧的对应物。<\/p>", "kind": "chapter", "title": "第二部分 软件：算法、程序设计语言与软件系统（原书第 4–7 章）"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.212<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第二部分 软件：算法、程序设计语言与软件系统（原书第 4–7 章）<\/a><\/span><\/div><h1>第 3 章：第三部分 通信——网络、因特网与万维网<\/h1>\n<blockquote>对应原书第 8 章「网络」、第 9 章「因特网」、第 10 章「万维网」（PDF 第 212–303 页；印刷页 = PDF 页 − 28）。通信部分回答：设备之间靠什么链路相连、数据怎样编码压缩与检错、因特网协议如何把不可靠的包拼成可靠通信、万维网的页面和链接怎样组织起来。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分带宽与传播延迟：数据流速度取决于链路最慢环节，光速对跨洋距离给出物理下界；按链路类型说出原书给出的带宽量级；\n<\/li><li>\n说明无损与有损压缩的差别，用字符频率与霍夫曼编码的思路解释为什么常用符号用短码；\n<\/li><li>\n写出奇偶校验的校验位规则，说明它能检出哪类错误、检不出哪类错误；说出 Luhn 校验覆盖的单数码错误与换位错误；\n<\/li><li>\n沿域名 → IP 地址 → 路由 → IP 包 → TCP 流走通一次通信，解释 IP 的无连接、不可靠、尽力而为性质，以及 TTL 防循环机制；拆解 URL 各字段，说清 HTML、CSS 为什么不是编程语言。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>网络是一串带宽各异、延迟受光速约束的链路；压缩去掉冗余，校验加上受控冗余来发现错误；因特网把通信分成分层协议：IP 负责独立数据包的尽力投递，TCP 在其上拼成可靠双向流；万维网用 URL 定位资源、用 HTML 描述内容与格式、用 CSS 定义样式，浏览器把这些取回本地渲染。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 10：带宽、传播延迟与数据压缩（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。网络中数据流的速度取决于链接的最低许可速度，数据量会在很多地方减慢，链接自身与计算机处理过程都会遇上瓶颈；光速也是限制因素，信号在真空中每秒约三亿米，约一英尺每纳秒，在电路中还会慢下来（PDF 第 229 页）。原书给出的量级：第一个调制解调器约 110 bps；802.11 家用无线理论 600 Mbps；有线以太网通常 1 Gbps；DSL 或电缆约每秒几兆位；光纤可达 100 Gbps 甚至更高；4G 静止状态理想 1 Gbps、运动状态 100 Mbps（PDF 第 229 页）。压缩的基本思路是避免存储或发送冗余信息：不携带信息的位可完全去掉，可由其他位推算出的位可去掉，与接收者无关的位可安全丢弃（PDF 第 230 页）。<\/p>\n<h3>2. 概念 11：错误检测与纠错（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。压缩是去除冗余，错误检测与纠错则是添加细心控制的冗余来发现甚至纠正错误。美国社会安全号 9 位数没有冗余，任意 9 位都可能是一串有法律效力的数字；信用卡号和取款机编码由 16 位构成，但并非每个 16 位数都有效，使用 1954 年 Peter Luhn 在 IBM 发明的校验算法，可检测单个数位错误以及大多数因错位导致的两位互换错误（PDF 第 233 页）。奇偶校验码是应用于位的最简单错误检测：每组位末尾加一个附加位，使整组中 1 的个数为偶（偶校验）或奇（奇校验）；一个位出错时 1 的个数奇偶改变，接收方知道出错，但指不出哪一位，同时两位出错则无法发现（PDF 第 234 页）。使用更多冗余位时，单个位错误可以被编码纠正；存储器靠奇偶位检测随机单位错误，CD/DVD 使用可纠正长期磨损位的代码，二维码带有扩展纠错机制（PDF 第 235 页）。<\/p>\n<h3>3. 概念 12：因特网协议栈（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。协议规定双方互相沟通时遵守的规则。因特网最基础的两个协议：IP（Internet Protocol，因特网协议）定义单个数据包的格式和传输方式；TCP（Transmission Control Protocol，传输控制协议）定义 IP 数据包如何组合成数据流以及如何连接到服务；两者合称 TCP/IP（PDF 第 253 页）。IP 是无连接的：每个数据包独立存在，与其他包无关，协议没有状态或存储功能，把包传给下一个网关后不再保留该包信息；IP 不可靠，是「尽力而为」型协议，包可能丢失、损坏、乱序、重复或超时（PDF 第 254 页）。IP 数据包最大约 65KB，长消息要拆成小块发送、远端重组；IPv6 源地址和目标地址都是 128 位。TTL（Time To Live，生存时间）是单字节区，发送方设初始值，每过一跳网关减 1，减到 0 就丢弃并给始发者返回报错包；典型一次传包经过 15～20 个网关，经过 255 跳的包很可能误入循环，TTL 不能消除循环，但能防止数据包因进循环而永远存在（PDF 第 254–255 页）。TCP 在不可靠的 IP 之上提供可靠双向数据流：把字节流切分报文段，报文段含实际数据和带序列号的头部信息（PDF 第 255 页）。同层还有 UDP（用户数据报协议），比 TCP 简单得多，DNS、流媒体视频、VoIP 和某些在线游戏使用 UDP（PDF 第 253 页）。<\/p>\n<h3>4. 概念 13：万维网（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。URL 以 <code>http<\/code> 或 <code>https<\/code> 开头：<code>https<\/code> 表示采用经过加密的安全 HTTP（PDF 第 276 页）。<code>://<\/code> 后面是域名，即服务器名字；域名后斜杠与字符串原样传给服务器，由服务器决定如何处置；域名后什么都没有则返回默认页面，如 <code>index.html<\/code>；文件名后问号一般表示前面是程序，服务器运行该程序并把问号后部分作为参数传入，这是网页表单信息的处理方式（PDF 第 276 页）。服务器返回的绝大多数文本是 HTML 格式，包含文本内容和格式信息；HTML 文件用标签表示格式，标签可标示页面区域的起始与结束位置（PDF 第 277 页）。<code>&lt;img&gt;<\/code> 是自包含标签，<code>&lt;body&gt;<\/code> 与 <code>&lt;/body&gt;<\/code> 成对，<code>&lt;p&gt;<\/code> 严格定义也要求闭合；<code>alt<\/code> 属性提供图片无法显示时的替代文字（PDF 第 278 页）。多数 HTML 文档还含 CSS（Cascading Style Sheets，层叠样式表）记录的样式信息，例如一条 CSS 指令让所有 h2、h3 标题显示为红色斜体。HTML 和 CSS 都不算编程语言：有正规语法和语义，但没有循环和状态，无法用它们表示算法（PDF 第 278 页）。<\/p>\n<h2>推导一（推演）：跨洋距离上的传播延迟下界<\/h2>\n<p>信号在真空中光速 <span class=\"katex-inline\">c\\approx3\\times10^8<\/span> 米/秒。原书记录：美国东海岸到西海岸约 2500 英里（4000 千米），按真空光速算约 13 微秒；到西欧约 50 微秒，到悉尼约 110 微秒，到北京约 140 微秒（PDF 第 229 页）。用距离核对：<span class=\"katex-inline\">4000\\,\\text{km}=4\\times10^6\\,\\text{m}<\/span>，传播时间 <span class=\"katex-inline\">t=d/c=4\\times10^6/(3\\times10^8)\\approx1.33\\times10^{-2}<\/span> 秒，即约 13 毫秒——这里原书给出的 13 微秒与距离换算存在量级出入，实际电路中信号速度约为真空光速的 2/3，且 4000 千米单向传播应在十毫秒量级；原书 13 微秒对应约 4 千米距离，与 2500 英里的说法不匹配，引用时以原书文字为准，物理核算按本片段推导。往返行程还要叠加各网关处理、排队与重传时间，原书记录同一次旅途到西欧约 40 微秒级别的网络延迟、到悉尼 110 微秒、到北京 140 微秒（转述，量级以原书页面为准）。这个推导说明：即使链路带宽无限大，物理距离仍给往返延迟设了下界，数据量大时带宽是瓶颈，交互响应时延迟是瓶颈。<\/p>\n<h2>推导二（推演）：Luhn 校验的单数码与换位检出<\/h2>\n<p>原书算法：从最右边一位开始，逐个交替把数值乘 1 或 2；乘出的结果比 9 大就减 9；把每个位置最后得出的数值相加，总和必须能被 10 整除（PDF 第 233 页）。示例卡号 4417 1234 5678 9112，算出的结果是 9，因此不可用；把最后一位改成 3 即可通过。单数码错误：某位数字 <span class=\"katex-inline\">d<\/span> 变成 <span class=\"katex-inline\">d&#x27;<\/span>，参与加权后的贡献改变量不为 0，总和模 10 随之改变，校验失败。相邻两位互换：两个位置权重不同（一个乘 1 一个乘 2），除非两个数字相等，否则交换后贡献和改变，能被检出；这覆盖了实际生活中最常见的两类录入错误。局限在于：校验只能证明号码与规则自洽，不能证明卡号真实存在；两位以上同时出错、或错误恰好让总和仍保持模 10 不变，校验无法识别。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>IP 去掉无连接状态、为每个通信维持连接上下文<\/strong>：网关要为每条流保存状态，路由器复杂度和存储量随连接数膨胀；一台网关重启，所有经过它的流状态全部丢失。无连接换来的是数据包各自独立转发，网络可以绕开故障节点重新选路（PDF 第 254 页）。\n<\/li><li>\n<strong>IP 不做 TTL 递减<\/strong>：误入路由循环的数据包会在环路里永远打转，持续占用链路带宽；TTL 到 0 丢弃并报错，把循环包的寿命限制在有限跳数内（PDF 第 255 页）。\n<\/li><li>\n<strong>去掉校验冗余<\/strong>：像社会安全号那样所有编码位都承载信息，传输中翻一个位，接收方无法察觉，错号被当成合法号使用；加冗余位付出的是编码效率，换回错误可见性（PDF 第 233 页）。\n<\/li><li>\n<strong>HTML/CSS 带上循环和状态<\/strong>：页面描述语言就变成程序设计语言，安全模型从「取回静态标记渲染」变成「在客户端执行任意逻辑」；原书把没有循环和状态当作两者与编程语言的分界（PDF 第 278 页）。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章把第 2 章的软件分层思路搬到网络侧：应用程序、TCP、IP、物理层各依赖下一层服务、为上一层提供服务（图 9-3，PDF 第 253 页）。下一章处理这些网络链路带来的后果：数据被怎样收集和跟踪，加密怎样在不可靠、可被窃听的链路上保护内容，云计算把数据和计算交托给谁。第 10 章后半的病毒、蠕虫、特洛伊木马与网络攻击，正是本章协议在恶意使用下的反面。<\/p>", "kind": "chapter", "title": "第三部分 通信：网络、因特网与万维网（原书第 8–10 章）"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.305<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第三部分 通信：网络、因特网与万维网（原书第 8–10 章）<\/a><\/span><\/div><h1>第 4 章：数据、隐私与安全——数据与信息、隐私与安全<\/h1>\n<blockquote>对应原书第 11 章「数据与信息」、第 12 章「隐私与安全」，并衔接第 10 章后半的病毒、蠕虫、特洛伊木马与网络安全部分（PDF 第 305–359 页；印刷页 = PDF 页 − 28）。本章回答：在线活动留下哪些可被收集和聚合的数据，加密怎样在可被窃听的链路上保护内容，对称与公钥加密各自解决什么问题，云计算把信任边界推给了谁。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分搜索、跟踪、社交网络与数据挖掘聚合分别收集什么数据，说明多来源数据整合后能还原出什么；\n<\/li><li>\n写出对称加密的密钥空间随位数的指数关系，按原书给出的 GPU 算力量级估算 DES 与 AES-128 面对蛮力攻击的处境；\n<\/li><li>\n解释公钥/私钥的数学关联与「一把加密、另一把解密」的性质，说明公钥加密解决了对称加密的哪两个难题；\n<\/li><li>\n梳理云计算把程序与数据从本机转移到服务商服务器的过程，列出这一转移在所有权、管辖权和漏洞面上下放的边界。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>在线服务在提供便利的同时记录访问对象、身份与位置；密码术是抵御泄露的主要手段，对称加密要求通信各方共享同一密钥，密钥分发和密钥增生由此成为难题，公钥加密用公开密钥对绕开分发问题；现代密码学假定攻击者知道算法，安全性只寄托在密钥上；云计算把计算负载和数据存储转移到服务商，客户端代码与服务器端带宽、内存共同决定体验，也把信任边界交给了第三方。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 14：对称密钥加密（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c11.md\" target=\"_blank\" rel=\"noopener\">概念 c11<\/a>。加密（密码术）是「秘密书写」的技艺，是抗袭击最有效的方法之一；好的加密复杂精细，也很容易因人工失误而失败（PDF 第 340 页）。历史上的凯撒密码把字母向后移动三个位置，A 变 D、B 变 E，<code>HI JULIUS<\/code> 变成 <code>KL MXOLXV<\/code>；rot13 把字母移动 13 个位置，常用于新闻组隐藏剧透（PDF 第 340 页）。对称密钥加密中，加解密使用同一把密钥，密钥由参与消息交换的各方共享；假定算法完全为人理解且没有缺陷，破解消息的唯一方法就是蛮力攻击，尝试所有可能密钥直到找出加密用的那把；密钥有 <span class=\"katex-inline\">N<\/span> 位时，穷举时间与 <span class=\"katex-inline\">2^N<\/span> 成正比（PDF 第 343 页）。蛮力攻击也并非没有捷径：攻击者先试短密钥、再试长密钥，先试可能性大的，字典攻击就尝试 <code>password<\/code>、<code>12345<\/code> 这类常见单词和数字；选密钥偷懒或粗心就会让这种攻击得手（PDF 第 343 页）。<\/p>\n<h3>2. 概念 15：公钥加密（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c12.md\" target=\"_blank\" rel=\"noopener\">概念 c12<\/a>。对称加密的大问题是密钥分发：参与秘密通信的每一方都必须知道所用密钥，必须有绝对安全的渠道把密钥送到通信方；还有密钥增生：要保证彼此无关的多方独立秘密会话，就要为每组会话准备不同密钥，分发更加困难（PDF 第 344–345 页）。公钥加密由怀特菲尔德·迪菲和马丁·赫尔曼于 20 世纪 70 年代中期在斯坦福发明，二人因此分享 2015 年图灵奖；英国 GCHQ 的詹姆斯·埃利斯和克利福德·柯克斯早几年独立发现同样方法，因工作要求保密到 1997 年才发表（PDF 第 345 页）。公钥系统里每个人有一对密钥：一个公钥、一个私钥，这对密钥是数学上有关联的整数，用其中一把加密过的消息只能用另一把解密，反之亦然；公钥开诚布公，任何人都能拿到，通常公布在网站上，私钥只有密钥对主人知道（PDF 第 345 页）。实际场景：Alice 想给 Bob 发只有 Bob 能看到的消息，先到 Bob 网站找他的公钥，用公钥加密后发出；Eve 在偷听，拿到的只是密文（PDF 第 345 页）。<\/p>\n<h3>3. 概念 16：数据收集、跟踪与云计算（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c13.md\" target=\"_blank\" rel=\"noopener\">概念 c13<\/a>。第 11 章按主题展开：搜索留下查询记录，跟踪把访问链接、点击对象记录下来，社交网络在交互中提供内容也收集数据，数据挖掘与聚合把多个来源的信息拼成完整生活画面；数字存储廉价而数据宝贵，信息很少被丢弃，网上发布后想撤回往往太迟（引言部分，PDF 第 21 页）。云计算是另一种计算模型：不再把运行程序和保存数据都放在自己的计算机上，而是用浏览器访问和操作因特网上服务器保存的信息；Gmail、Outlook 等邮件服务是最常见例子，Facebook、Instagram、Dropbox、Twitter、领英和在线日历也属此类，数据不存本地而存在服务提供商的服务器上（PDF 第 331 页）。云计算成为现实依赖多方面条件成熟：个人计算机能力越来越强，浏览器能高效运行涉及大量显示需求的大型程序，客户端编程语言仍是解释型 JavaScript；服务器到客户端的带宽和延迟相比 10 年前明显改善，为快速发送和取回数据提供保障（PDF 第 331 页）。Google Docs 这类云办公系统含文字处理、电子表格和演示程序，基本可与 Microsoft Office 竞争，并支持多用户并发访问和同步更新（PDF 第 332 页）。<\/p>\n<h3>4. 密码学的两条基本立场<\/h3>\n<p>原书 12.1 节给出两条贯穿现代密码学的原则。其一，频率分析法统计密码中每个符号出现的频率，可以轻松解决凯撒密码和简单替换密码；要抵御频率分析，加密算法必须让密文中所有符号以大致相等的机会出现，做到没有模式可供分析（PDF 第 342 页）。其二，现代密码学必须假定攻击者知道并完全理解密码系统的工作原理，把所有安全性寄托在密钥上；相反的做法——假定对手不知道系统用什么方案、如何破解——称为隐匿式安全，这种方法经历较长时间后往往会失败；有人鼓吹加密系统十分安全却不愿说出工作原理，就可以确信它并不安全（PDF 第 342 页）。加密系统的公开性也很重要：需要尽可能多的专家和专业经验来寻找薄弱点，算法弱点可能在初始开发分析很久之后才暴露（PDF 第 342 页）。<\/p>\n<h2>推导一（推演）：密钥空间与蛮力攻击量级<\/h2>\n<p><span class=\"katex-inline\">N<\/span> 位密钥的取值总数为 <span class=\"katex-inline\">2^N<\/span>，蛮力攻击最坏要试遍全部密钥，平均试一半就命中，时间量级与 <span class=\"katex-inline\">2^N<\/span> 成正比。原书记录：DES 总是使用 56 位密钥，1999 年由廉价专业计算机使用蛮力攻击，穷举一天就能破解 DES 密钥（PDF 第 344 页）。AES 支持 128、192、256 位三种密钥长度，潜在密钥数量非常多。原书估算算力：GPU 每秒可进行 <span class=\"katex-inline\">10^{13}<\/span> 次计算，一百万个 GPU 每秒可做 <span class=\"katex-inline\">10^{19}<\/span> 次，每年大约 <span class=\"katex-inline\">3\\times10^{26}<\/span> 次，这大概是 <span class=\"katex-inline\">2^{90}<\/span> 次；这个数字距离 <span class=\"katex-inline\">2^{128}<\/span> 仍然遥远，所以 AES-128 面对蛮力攻击也很安全（PDF 第 344 页）。核对换算：<span class=\"katex-inline\">10^{19}\\times3.15\\times10^7\\approx3.15\\times10^{26}<\/span>；<span class=\"katex-inline\">\\log_2(3\\times10^{26})\\approx88<\/span>，与原书「大概 <span class=\"katex-inline\">2^{90}<\/span>」吻合。<span class=\"katex-inline\">2^{128}/2^{90}=2^{38}\\approx2.7\\times10^{11}<\/span>，即即便按这一算力群，一年的计算量只覆盖 AES-128 密钥空间的约万亿分之一量级。DES 的 <span class=\"katex-inline\">2^{56}\\approx7.2\\times10^{16}<\/span>，在 1999 年专用硬件一天量级可穷尽，对比之下 56 位在当代算力条件下明显过短。<\/p>\n<h2>推导二（推演）：公钥加密的收发流程与分工<\/h2>\n<p>设 Bob 的公钥 <span class=\"katex-inline\">K_B^+<\/span> 公开，私钥 <span class=\"katex-inline\">K_B^-<\/span> 保密。Alice 给 Bob 发保密消息 <span class=\"katex-inline\">M<\/span>：第一步，Alice 从 Bob 网站取得 <span class=\"katex-inline\">K_B^+<\/span>；第二步，用 <span class=\"katex-inline\">K_B^+<\/span> 把 <span class=\"katex-inline\">M<\/span> 加密成密文 <span class=\"katex-inline\">C=E_{K_B^+}(M)<\/span>；第三步，<span class=\"katex-inline\">C<\/span> 经可被窃听的信道发出，Eve 截获 <span class=\"katex-inline\">C<\/span>，但没有 <span class=\"katex-inline\">K_B^-<\/span>，无法解密；第四步，Bob 收到 <span class=\"katex-inline\">C<\/span>，用 <span class=\"katex-inline\">K_B^-<\/span> 解密得 <span class=\"katex-inline\">M=D_{K_B^-}(C)<\/span>。密钥对的数学关联保证 <span class=\"katex-inline\">E_{K_B^+}<\/span> 与 <span class=\"katex-inline\">D_{K_B^-}<\/span> 互逆，而从公开的 <span class=\"katex-inline\">K_B^+<\/span> 推算 <span class=\"katex-inline\">K_B^-<\/span> 在密钥足够长时是徒劳的，破解时间随密钥加长呈指数型增长（PDF 第 345 页）。工程分工上，公钥加密计算量大，实际通信常混合使用：公钥加密只用来传送一把临时对称会话密钥，之后的大批量数据用对称加密快速加解密；这一分工把公钥解决分发的长处和对称加密速度快的长处接在一起（转述，原书未展开混合流程，机制为通用密码学常识）。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>算法保密当作安全依靠<\/strong>：系统方案一旦通过逆向、人员流失或泄露暴露，全部密钥体系随之失效；隐匿式安全没有可公开审查的专家群体，弱点暴露得更晚。玛丽女王、山本五十六和德军恩尼格玛的案例都因加密系统被破而付出致命代价（PDF 第 341 页）。\n<\/li><li>\n<strong>对称加密没有安全分发渠道<\/strong>：多方秘密通信前先要把同一密钥交到每个人手上，分发途中被截获，后续加密全部落空；每加一方参与者就要换发密钥，彼此无关的会话还要各配各的密钥，密钥增生让分发规模随人数膨胀（PDF 第 344–345 页）。\n<\/li><li>\n<strong>只加密传输、不保护存储与终端<\/strong>：链路窃听者拿不到明文，但终端被入侵、数据库泄露、本地文件丢失时，加密过的静态数据照样暴露；传输安全只是安全链条的一环，原书也指出好的加密很容易因人工失误而失败（PDF 第 340 页）。\n<\/li><li>\n<strong>数据全部留在本地、不依赖云<\/strong>：跨设备同步、共享文档、邮件随处可查这些便利消失；换一台机器就要手动传文件，不同系统还要分别购买程序（PDF 第 330 页）。云模型换来便利，代价是数据所有权和管理权让渡给服务商。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章是全书通信部分的收口：第 3 章讲清楚数据包怎样穿过网络，本章讲这些包在被窃听、被留存、被聚合时如何保护内容。对称与公钥加密建立在第 1 章的位与密钥空间计算之上；跟踪与聚合对应第 8 章网络留下的访问记录和第 9 章协议记录；云计算是第 6 章软件系统在网络侧的延伸。全书四章合起来构成一条路径：硬件表示信息，软件处理信息，网络传输信息，安全与数据议题决定信息在交换中如何被保护、被收集和被利用。<\/p>", "kind": "chapter", "title": "数据、隐私与安全：数据与信息、隐私与安全（原书第 11–12 章，含第 10 章网络安全部分）"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.37<\/div><h1>冯·诺依曼逻辑结构：CPU、RAM、二级存储与总线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章（原书 1.1 逻辑结构、1.1.1 CPU、1.1.2 RAM、1.1.3 硬盘和其他二级存储器，PDF 第 37–40 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>面对一台计算机，先要回答「里面有什么、各部分干什么活、谁和谁交换信息」。没有这套结构视图，看到的只是机箱、屏幕和术语；程序为什么能在同一台机器上一会儿打字、一会儿浏览网页，数据为什么断电后还在，指令和数据为什么放进同一个存储器，都无从解释。逻辑结构概念把通用计算机拆成少数职责清晰的部件，说明它们靠什么连在一起，不涉及芯片怎么制造、电路怎么布线。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>CPU（中央处理单元，Central Processing Unit）<\/strong>：处理器，进行算法计算、数据移动，并控制其他组件操作。CPU 基本操作有限，但速度极快，每秒运算次数以十亿计；它能根据前一次计算结果决定接下来的指令，因而在某种程度上独立于操作人员（PDF 第 38 页）。速度用时钟频率度量：每一下滴答叫 1 赫兹（Hz），通常以千兆赫兹（GHz）计；作者一台 2.2 GHz 处理器以每秒 22 亿次的频率运转（PDF 第 39 页）。<\/p>\n<p><strong>RAM（随机存取存储器，Random Access Memory）<\/strong>：初级内存，存储处理器和其他部件正在使用的信息。它既存 CPU 正在处理的数据，也存命令 CPU 处理数据的指令；往 RAM 里加载不同指令，就能让 CPU 做不同运算，这使存储程序的计算机成为通用目的设备（PDF 第 40 页）。「随机存取」指 CPU 可快速访问其中任意位置，按随机次序访问不会减缓速度；内容可改写，断电后通常不保留。<\/p>\n<p><strong>二级存储<\/strong>：硬盘、闪存（SSD）等长期保存程序和数据的部件，速度远低于 RAM，容量更大，断电后内容保留（PDF 第 38 页）。<\/p>\n<p><strong>总线（bus）<\/strong>：把处理器、RAM、二级存储和其他设备连在一起、互相传输信息的一组电缆（PDF 第 37 页）。<\/p>\n<p><strong>输入输出部件<\/strong>：鼠标、键盘、触摸板、显示器，以及相机、扬声器、麦克风、罗盘、加速度传感器、GPS 接收器等；手机和平板把键鼠屏融合进显示屏，另多定位与运动感应部件（PDF 第 37 页）。<\/p>\n<p>正例：一台 PC 的结构图上，CPU、RAM、硬盘、显示器、鼠标键盘都挂在同一条总线上。反例：把打印机直接焊死在 CPU 内部、不经过总线和内存，这不是通用计算机结构；专用机器可以这样做，却无法靠换指令改变用途。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>这套组织自 20 世纪 40 年代起形成规范，通常称冯·诺依曼架构；原书引用 Burks、Goldstine、von Neumann 1946 年论文：CPU 提供算法和控制，RAM 和磁盘承担记忆存储，键鼠显示器与人交互（PDF 第 38 页）。推演最小部件集合：要运算需要处理器；要保存当前程序的指令和待处理数据，需要可读写内存；要长期保存关机后仍保留的内容，需要二级存储；要接收输入、呈现结果，需要外设；部件之间要传指令和数据，需要公共通道即总线。五者缺一，通用机不成立。<\/p>\n<p>存储程序原理是结构关键：指令本身也以位模式存在 RAM 中，和数据使用同一种表示。同一台硬件换一份存进 RAM 的程序，就切换到另一项任务；文字处理、表格、浏览、邮件、报税、播放音乐可在同一台电脑上进行，只要 RAM 中存放合适的指令（PDF 第 40 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：描述通用计算机的逻辑/功能构成，不区分 PC、Mac、手机、平板；这些设备结构图相似，只是外设形态不同。\n<\/li><li>\n边界一：逻辑结构稳定，物理构造变化极快。原书指出基本功能和物理特质存在差异：运作方式很稳定，内部构造以惊人速度变化（PDF 第 36 页）。不能用部件外观推断职责，也不能用职责分工代替制造细节。\n<\/li><li>\n失败案例一：把 RAM 当长期存储。RAM 断电丢内容，程序文件必须放二级存储，启动时才加载进 RAM；成果只存内存，关机即丢失。\n<\/li><li>\n失败案例二：把 CPU 当全能计算器。CPU 只执行有限基本操作，复杂能力来自指令序列组合与高速循环；脱离内存中的指令和数据，CPU 自身不产生结果。\n<\/li><li>\n边界二：嵌入式设备、超级计算机在此结构上有变体。数码相机、电子书、GPS、家电、游戏机里都是嵌入式系统；超算有大量处理器和内存，2016 年中期最快计算机超过 1000 万个 CPU（PDF 第 91 页），核心仍是逻辑运算与相似体系结构。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>CPU vs RAM<\/strong>：CPU 运算与控制，快而小；RAM 暂存当前指令和数据，可改写、断电易失。CPU 不能长期保存结果，RAM 不做算术判断。\n<\/li><li>\n<strong>RAM vs 二级存储<\/strong>：RAM 随机存取、快、断电丢失；二级存储容量大、断电保留、慢。速度差是缓存层级存在的直接原因。\n<\/li><li>\n<strong>逻辑结构 vs 物理结构<\/strong>：前者回答部件、功能与连接；后者回答外观与制造工艺。体系结构几十年大体不变，硬件本身高速迭代。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无，本章起点。后继：c02 的位与字节是指令和数据在 RAM 中的落地形式；c04 在这套结构上展开取指—译码—执行循环与缓存层级；c07 的操作系统在这套硬件上分配 CPU、内存和磁盘；网络概念 c10 把总线换成跨机器链路。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（冯·诺依曼逻辑结构：CPU、RAM、二级存储与总线）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：一台通用计算机的部件分工与指令/数据同存机制<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把「计算机里有什么」讲到可推演，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先分清逻辑结构与物理结构<\/strong>。逻辑结构回答部件是什么、功能是什么、如何连接；物理结构回答部件外观与制造工艺。本片段只推逻辑结构，不涉及芯片怎么刻、电路怎么布线。\n<\/li><li>\n<strong>通用机 vs 专用机的分界<\/strong>。专用机器可以把功能固化在电路里；通用机要靠更换指令改变用途，因此必须有一个能保存指令的存储部件和一个能解释指令的处理器。\n<\/li><li>\n<strong>指令与数据的表示前提<\/strong>。部件之间传输的指令和数据都要落成同一种可存储、可传输的形式，即 c02 展开的位模式；本片段先假定它们已经是数值与指令编码。\n<\/li><li>\n<strong>存储的易失性分层<\/strong>。当前运行内容要能快速读写，长期保存内容断电不能丢；这两条要求对应两类存储，中间再由缓存衔接，细节见 c04。\n<\/ol>\n<p>依赖链方向：通用机需求 → 处理器 + 可读写内存 + 长期存储 + 外设 + 公共通道 → 指令与数据同存于内存 → 换程序即换任务。任何一层前提缺失，结构图就退化成专用设备的框图。<\/p>\n<h2>正向推导：从最小需求推出五个部件<\/h2>\n<h3>第一步：运算从哪里来<\/h3>\n<p>给定一项任务，机器要做算术和比较：两个数相加、判断这个数比另一个大吗、这份信息和那份相同吗。承担这些基本操作的部件是 CPU。它的操作集合不大，但执行得快，并且能依据比较结果选择下一条指令——这一条把它和只会按固定顺序算到底的计算器区分开。CPU 还控制其他组件的操作，通过总线上的信号安排和协调相连电子配件的输入输出。<\/p>\n<h3>第二步：当前工作现场放哪里<\/h3>\n<p>CPU 算一个数时，操作数和中间结果要有地方暂存；执行哪条指令也要有地方记。这个可随机读写的现场就是 RAM。把指令和数据都放进同一存储器，机器就能靠更换存储器里的指令切换任务；这是存储程序原理，也是通用目的设备成立的根据。RAM 里同时放当前运行程序的指令、这些程序处理的数据，以及让多个应用同时运行的操作系统指令。<\/p>\n<h3>第三步：关机后内容放哪里<\/h3>\n<p>RAM 断电易失，程序文件、文档、照片必须在关机后仍保留。这一层是二级存储：硬盘、闪存 SSD。它容量更大、速度更慢，职责是长期保存。开机时操作系统和启动程序从二级存储读入 RAM；运行中资料先进入 RAM 被处理；保存动作把 RAM 中的内容写回二级存储。<\/p>\n<h3>第四步：人和机器怎么交换<\/h3>\n<p>机器要接收人的输入（按键、点击、位置、运动），也要把结果呈现出来（画面、声音、振动）。这一层是输入输出部件：鼠标、键盘、显示屏、相机、扬声器、麦克风、罗盘、加速度传感器、GPS 接收器等。手机把键鼠屏融合进一块显示屏，外设形态变了，职责没变。<\/p>\n<h3>第五步：部件之间怎么传指令和数据<\/h3>\n<p>五个部件各自独立，需要一条公共通道交换指令、数据和控制信号，这条通道是总线。CPU 经总线从 RAM 取指令和数据，把结果写回 RAM；外设经总线把输入交给 CPU，把输出从总线取走。总线是一组电缆，不是 CPU 与每个部件之间各铺一根专线。<\/p>\n<h3>第六步：结构稳定，实现换代<\/h3>\n<p>这套部件划分自 20 世纪 40 年代形成规范，体系结构几十年大体不变；变化的是物理实现：真空管、晶体管、集成电路先后更替，部件更小、更便宜、更快。看一台新设备时，先按职责对号入座，再谈工艺差异。ENIAC 时代靠开关和重新布线编程，指令和数据没有都存进内存；EDSAC 于 1949 年在英国造出，才是把程序和数据存储在一起的计算机（PDF 第 32 页前后，转述）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：时钟频率与心跳对照<\/h3>\n<p>原书作者处理器标称 2.2 GHz。Giga 表示 <span class=\"katex-inline\">10^9<\/span>，时钟频率为 <span class=\"katex-inline\">2.2\\times10^9<\/span> 次/秒，即每秒 22 亿次滴答。人的心跳约 1 Hz，每天约 100000 次，每年约 3000 万次；原书对照：CPU 一秒内计算的次数，相当于人在 70 年内心跳次数的总和（PDF 第 39 页）。核对：<span class=\"katex-inline\">3\\times10^7\\times70=2.1\\times10^9<\/span>，与 <span class=\"katex-inline\">2.2\\times10^9<\/span> 同量级。这个对照只说明频率量级，不代表每次滴答都完成一次有用运算——一条指令往往需要多个时钟周期。<\/p>\n<h3>算例 2：存储分层的职责对照<\/h3>\n<p>RAM 承担当前程序的指令和数据；二级存储保存长期文件。开机：操作系统从二级存储读入 RAM；编辑：文档在 RAM 中处理；保存：写回二级存储；断电：RAM 内容消失，二级存储保留。若把草稿只留在 RAM，断电后草稿丢失。各级访问延迟的具体纳秒、毫秒数值原书未列，此处不补造；可确认的定性次序是：CPU 内部缓存最快，RAM 次之，二级存储最慢。<\/p>\n<h3>算例 3：同一硬件换程序<\/h3>\n<p>RAM 中放文字处理程序的指令，机器执行文字处理；换成浏览器指令，机器执行浏览；换成音乐播放指令，机器播放音乐。硬件没有换，任务变化来自 RAM 中指令序列的更换。反过来，若指令不能像数据一样写入 RAM，每次换任务就要重新布线或拨动开关，机器退回到布线编程时代。<\/p>\n<h3>算例 4：一个数从键盘到屏幕的分层路径<\/h3>\n<p>沿一次按键走一遍路径：手指按下键盘，键位信号经总线送入 CPU；CPU 执行输入相关指令，把键码存入 RAM 中对应输入位置；程序指令在 RAM 中取出键码、做判断（是否回车、是否退格），把字符追加到 RAM 中的文本缓冲区；需要显示时，CPU 把缓冲区内容经总线送到显示屏部件刷新画面。这条路径里，键盘是输入部件，显示器是输出部件，RAM 暂存键码与文本，CPU 完成判断与搬运，总线贯穿全程。若中间任一层缺失：键盘信号进不来，或文本无处暂存，或结果送不到屏幕，这次输入就断在对应环节。<\/p>\n<h3>算例 5：一台程序的内存现场<\/h3>\n<p>设想求一组数之和的简单程序。RAM 中要有：存放求和结果的位置、存放当前读入数值的位置、存放数据列表的位置，以及程序自身的指令序列。CPU 取一条加法指令，从 RAM 取两个数相加，结果写回 RAM；再取下一条指令。所有操作数、结果、指令都在同一存储器体系内流动，没有独立的「指令专用存储器」。指令在内存里的排列顺序决定执行顺序，跳转指令可以改变下一条取指的位置，这正是 c04 展开的控制流基础。<\/p>\n<h3>算例 6：频率量级的换算口径<\/h3>\n<p>Hz 表示每秒一次；kHz 为 <span class=\"katex-inline\">10^3<\/span>，MHz 为 <span class=\"katex-inline\">10^6<\/span>，GHz 为 <span class=\"katex-inline\">10^9<\/span>。2.2 GHz = <span class=\"katex-inline\">2.2\\times10^9<\/span> Hz。存储容量口径与此并行：kilo 在十进制为 <span class=\"katex-inline\">10^3<\/span>，在二进制语境下可能代表 <span class=\"katex-inline\">2^{10}=1024<\/span>；mega <span class=\"katex-inline\">10^6<\/span> 与 <span class=\"katex-inline\">2^{20}=1\\,048\\,576<\/span>、giga <span class=\"katex-inline\">10^9<\/span> 与 <span class=\"katex-inline\">2^{30}=1\\,073\\,741\\,824<\/span> 之间存在小幅近似偏差，原书指出在心算数量级时这种模糊通常微不足道（PDF 第 67 页）。描述设备时要分清标的是频率还是容量，两者单位同名但含义不同。<\/p>\n<h3>算例 7：嵌入式与超算的结构变体<\/h3>\n<p>数码相机、电子书、GPS、家电、游戏机里是嵌入式系统，结构被裁剪到设备所需；超级计算机配大量处理器和大量内存，2016 年中期最快计算机超过 1000 万个 CPU（PDF 第 91 页）。两者核心仍是逻辑运算加相似体系结构，差异在处理器规模、供电、大小和用途权衡。<\/p>\n<h3>算例 8：部件职责的对号入座练习<\/h3>\n<p>拿到一部智能手机，按职责归类：运算与控制由手机 SoC 中的 CPU 承担；当前运行的 App 指令与数据在 RAM；拍照原图、下载的 App、离线地图存在闪存；触摸屏是输入兼输出部件；麦克风、扬声器、加速度计、罗盘、GPS 接收器是专用输入部件；各部件经片上总线和内部互连交换信号。逐项核对时容易混淆的是 GPS 接收器与显示屏：前者只提供位置输入，后者负责画面输出，职责不能互换。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>没有可读写内存，指令只靠开关设定<\/strong>：每换一项任务都要人工重设开关或重新布线，通用机退回 ENIAC 模式；存储程序这条前提不成立。\n<\/li><li>\n<strong>RAM 与二级存储合并成一层<\/strong>：要么所有存储都断电保留但速度慢，当前程序被慢速存储拖住；要么都快速易失，关机内容全丢。易失性分层是两类需求折中的结果。\n<\/li><li>\n<strong>没有总线，部件各接专线<\/strong>：每加一个部件就要新增一组专用连线，部件数量增长时连线数量平方级膨胀，结构失去通用性。\n<\/li><li>\n<strong>CPU 不能按结果选下一步<\/strong>：比较之后只能按固定顺序执行，循环和分支都写不出来，程序能力退化为固定流程的计算器。\n<\/ul>\n<h2>延伸层：从布线编程到存储程序的结构演进<\/h2>\n<p>把时间拉开一层看结构为什么长成现在这样。早期计算设备为特殊用途设计：预测天文事件、制表人口普查。巴贝奇的分析机设想把操作指令和数据以相同方式存储，但受限于当时材料和工具未能建成。ENIAC 是第一台完全由电器组成的计算机，20 世纪 40 年代由宾州大学建造，占据一个大房间，耗电巨大，可每秒做 5000 次加法；它最初靠开关和不断重新布线设置连接来编程，指令和数据没有都保存在内存里（PDF 第 32 页前后，转述）。EDSAC 于 1949 年在英国制造，是第一个真正把程序和数据存储在一起的计算机。这一步对应结构推演里的第二步：可读写内存同时承担指令与数据。<\/p>\n<p>再往后，晶体管 1947 年发明、集成电路 1958 年发明，电子系统得以更小、更便宜、更快；部件的物理实现换代，但「处理器—内存—存储—外设—总线」的职责划分保留下来。手机、平板、智能手表、相机、GPS、家电、游戏机内部仍是同一套职责的裁剪版；超算则是这套结构的横向放大：大量处理器加大量内存，处理器可能带特殊指令，在处理某种数据时比通用处理器更快。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n若一台机器只能执行固定一套操作、不能更换指令，它缺少五个部件中的哪一个或哪一层前提？\n<\/li><li>\n为什么指令要和数据存在同一个 RAM 里，而不是各放一个存储器？\n<\/li><li>\n打开文档编辑到一半断电，文档内容取决于保存过没有；用 RAM 与二级存储的易失性解释这条现象。\n<\/li><li>\n总线和「CPU 与每个部件之间各拉一根专线」相比，在结构上有什么差别？\n<\/li><li>\n手机里的 GPS 接收器、加速度传感器对应结构图中的哪一类部件？\n<\/ol>\n<h2>补足推导：结构前提的塌陷点、执行不变量与寻址规模<\/h2>\n<h3>依赖前提去掉任一条会怎样<\/h3>\n<p>这套结构成立依赖三条前提：指令和数据以同一位模式存于 RAM；CPU 用程序计数器指向下一条待取指令；总线把 CPU、RAM 与二级存储连到一起。去掉第一条，取指通道与数据通道分离，就变成哈佛结构，不能再用同一套存储取指令和变量；去掉第二条，下一条指令位置不由计数器改写，分支与循环无法跳转到新地址，机器只能顺序执行固定死循环；去掉第三条，CPU 与内存各自孤立，指令和结果无法流动。<\/p>\n<h3>执行不变量<\/h3>\n<p>任意时刻程序计数器指向待取指令；累加器（或当前寄存器）保存最近一次运算结果；RAM 单元按地址读写。执行循环每转一圈，计数器前进到下一条指令，遇到跳转指令则改写计数器。这三个不变量保证一段程序可被逐条执行，而不依赖指令具体是哪一条。<\/p>\n<h3>寻址与吞吐算例<\/h3>\n<p>地址线有 <span class=\"katex-inline\">k<\/span> 位时可寻址 <span class=\"katex-inline\">2^k<\/span> 个内存单元；一台 32 位地址机器理论寻址空间约 <span class=\"katex-inline\">2^{32}\\approx4.3\\times10^9<\/span> 单元。2.2GHz 时钟每秒约 <span class=\"katex-inline\">2.2\\times10^9<\/span> 个周期，单个周期约 <span class=\"katex-inline\">0.45<\/span> 纳秒。玩具机求两数之和用 LOAD、ADD、STORE 三条指令，理想情况下三条周期完成一次加法；真实 CPU 靠流水与并行缩短每条指令的平均周期，但取指—译码—执行的循环次序不变。<\/p><\/div><\/details>", "kind": "concept", "title": "冯·诺依曼逻辑结构：CPU、RAM、二级存储与总线"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.65<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">冯·诺依曼逻辑结构：CPU、RAM、二级存储与总线<\/a><\/span><\/div><h1>位、字节与二进制表示：<span class=\"katex-inline\">2^N<\/span> 编码容量与位值展开<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章（原书 2.3 位、字节和二进制，2.3.1 位、2.3.2 2 的幂和 10 的幂、2.3.3 二进制数、2.3.4 字节，PDF 第 64–70 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>计算机里的文字、数字、声音、图片、程序指令最终都要落成机器能存储和传输的形式。人习惯十进制 0～9，机器却只用两种稳定状态表示信息。要算清一台机器能表示多少种状态、一个字符占多少空间、一段数据占多少存储，先得搞懂位（bit）的组合规律和二进制位值规则。不建立这套计数法，后面的编码容量、音频数据量、密钥空间、地址位数都无法推算。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>位（bit）<\/strong>：数字信息的最基本单位，取值只有 0 或 1。bit 是 binary digit（二进制数字）合并造出的词，造词者是统计学家约翰·图基，20 世纪 40 年代中期（PDF 第 64 页）。一个位表示二选一的情形（开/关、真/假、高/低）；0 与 1 各代表什么只要约定一致即可，惯例用 0 表示关、1 表示开（PDF 第 65 页）。<\/p>\n<p><strong>组合数<\/strong>：<span class=\"katex-inline\">N<\/span> 个位能表示 <span class=\"katex-inline\">2^N<\/span> 种组合，即 2 自乘 <span class=\"katex-inline\">N<\/span> 次；2 位 4 种、3 位 8 种（PDF 第 65 页）。对照十进制：<span class=\"katex-inline\">N<\/span> 个十进制位的组合数为 <span class=\"katex-inline\">10^N<\/span>，1 位 10 种、2 位 100 种。<\/p>\n<p><strong>二进制数<\/strong>：一串位按位值法则解释，底数是 2 而不是 10。第 <span class=\"katex-inline\">k<\/span> 位（从右数、从 0 起）的权值为 <span class=\"katex-inline\">2^k<\/span>；把每一位的值乘上对应权值再相加，得到十进制数值。<\/p>\n<p><strong>字节（byte）<\/strong>：成组的位，通常 8 位构成一个字节，用来表示一个字符或一段数值。ASCII 表示文本时每个字母占用 1 个字节即 8 位；第 8 位（最左边一位）在美国 ASCII 中总是 0，不携带信息，所以一种省位方法是只用 7 位（PDF 第 230 页）。<\/p>\n<p><strong>2 的幂与 10 的幂对照<\/strong>：<span class=\"katex-inline\">2^{10}=1024<\/span>，<span class=\"katex-inline\">2^{20}\\approx1.05\\times10^6<\/span>，<span class=\"katex-inline\">2^{30}\\approx1.07\\times10^9<\/span>；十进制 <span class=\"katex-inline\">10^3<\/span>（kilo）、<span class=\"katex-inline\">10^6<\/span>（mega）、<span class=\"katex-inline\">10^9<\/span>（giga）、<span class=\"katex-inline\">10^{12}<\/span>（tera）、<span class=\"katex-inline\">10^{15}<\/span>（peta）（PDF 第 67 页）。<\/p>\n<p>正例：3 位编码五类身份绰绰有余（8 种 ≥ 5 种）。反例：2 位只有 4 种组合，要编码第五类身份就不够，必须再加一位。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>组合数递推：1 个位有 2 种取值。每增加 1 位，原有每种组合都可在新位上接 0 或接 1，组合数翻倍。设 <span class=\"katex-inline\">C(N)<\/span> 为 <span class=\"katex-inline\">N<\/span> 位组合数，<span class=\"katex-inline\">C(1)=2<\/span>，<span class=\"katex-inline\">C(N)=2C(N-1)<\/span>，展开得 <span class=\"katex-inline\">C(N)=2^N<\/span>。反过来，要编码 <span class=\"katex-inline\">M<\/span> 种互斥状态，最少位数满足 <span class=\"katex-inline\">2^N\\ge M<\/span>，即 <span class=\"katex-inline\">N\\ge\\lceil\\log_2 M\\rceil<\/span>。<\/p>\n<p>位值展开：二进制数 <span class=\"katex-inline\">b_{N-1}b_{N-2}\\cdots b_1b_0<\/span> 的十进制值为<\/p>\n<div class=\"katex-block\">V=\\sum_{k=0}^{N-1} b_k 2^k,\\quad b_k\\in\\{0,1\\}.<\/div>\n<p>例：二进制 1011，<span class=\"katex-inline\">b_3=1,b_2=0,b_1=1,b_0=1<\/span>，<span class=\"katex-inline\">V=1\\times2^3+0\\times2^2+1\\times2^1+1\\times2^0=8+0+2+1=11<\/span>。<\/p>\n<p>容量换算：8 位一字节可表示 <span class=\"katex-inline\">2^8=256<\/span> 种取值；16 位为 <span class=\"katex-inline\">2^{16}=65536<\/span>，即 CD 音频每个样本幅值的级数（PDF 第 61 页）；32 位约 <span class=\"katex-inline\">4.3\\times10^9<\/span>，64 位约 <span class=\"katex-inline\">1.84\\times10^{19}<\/span>。kilo 可能指 1000 也可能指 <span class=\"katex-inline\">2^{10}=1024<\/span>，数值越大两种口径偏差越明显，心算数量级时靠 2 与 10 的幂对照（PDF 第 67 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：编码互斥的离散状态；位的次序约定固定，权值从右向左递增。\n<\/li><li>\n边界一：<span class=\"katex-inline\">2^N<\/span> 计数的是等概率组合数，不代表编码效率最优。若状态出现频率悬殊，定长编码浪费容量，可换变长编码，见 c08 压缩中的霍夫曼思路。\n<\/li><li>\n失败案例一：以为位数够用就等于表示范围够。2 位 4 组合排不下第五类；编码人数、颜色、字符集前先算 <span class=\"katex-inline\">2^N<\/span> 是否覆盖目标数量。\n<\/li><li>\n失败案例二：把 kilo 一律当 1000 或一律当 1024。存储容量标称与内存地址计算常混用两种口径，核对设备参数时要先分清口径。\n<\/li><li>\n边界二：二进制只解决「表示」，不解决编码含义。同样 8 位可以表示字母、整数或颜色分量，解释方式由协议或格式约定。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>位 vs 字节<\/strong>：位是最小信息单位，只取 0/1；字节是成组的位，通常 8 位，是字符和容量计量的常用单位。\n<\/li><li>\n<strong>二进制 vs 十进制<\/strong>：底数分别为 2 和 10；位值权值分别为 <span class=\"katex-inline\">2^k<\/span> 和 <span class=\"katex-inline\">10^k<\/span>。换算靠权值展开，不是把数字符号替换掉。\n<\/li><li>\n<strong>组合数 vs 数值范围<\/strong>：<span class=\"katex-inline\">2^N<\/span> 是状态总数；有符号整数还要留一位表示正负，可用范围少于 <span class=\"katex-inline\">2^N<\/span>。位串左右读反会改变权值位置，高低位约定必须统一。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的结构中，指令和数据都以位模式存于 RAM。后继：c03 用位深度量化颜色与声音幅值；c09 校验位是在正常位之外加冗余位；c11 密钥空间直接由 <span class=\"katex-inline\">2^N<\/span> 估算蛮力攻击量级；c10 的 IPv6 地址 128 位也是同一组合规律。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（位、字节与二进制表示：$2^N$ 编码容量与位值展开）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：位组合、位值展开与容量量级的逐层推算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把二进制表示讲透，先往回追四层前提：<\/p>\n<ol><li>\n<strong>机器状态只有两种稳定取值<\/strong>。开关要么开要么关，没有中间地带；用 0 和 1 标记这两种状态，就是位。先承认离散二值前提，才有位概念。\n<\/li><li>\n<strong>单一位只能编码二选一<\/strong>。要表示更多选项，必须把多个位排成序列，让不同 0/1 组合对应不同含义。组合规律是下一层。\n<\/li><li>\n<strong>位序列既要能区分状态，也要能表示数值<\/strong>。区分状态靠组合计数；表示数值靠位值权值，两套规则都建立在 <span class=\"katex-inline\">2<\/span> 的幂上。\n<\/li><li>\n<strong>成组位对应字符与容量单位<\/strong>。8 位一组成为字节，字符、颜色分量、声音幅值、密钥长度都按字节或位宽计量；这一层把位和实际数据量连起来。\n<\/ol>\n<p>依赖链方向：二值状态 → 位序列组合 → 位值展开 → 字节与位宽容量。缺了组合计数，算不清能放多少种状态；缺了位值规则，二进制数只是符号串。<\/p>\n<h2>正向推导：从一个位到一段容量<\/h2>\n<h3>第一步：一个位的两种取值<\/h3>\n<p>位取 0 或 1。约定 0 表示关、1 表示开，反过来也可以，关键是收发双方统一。一个位编码一个二选一事实：灯亮没亮、真假、是不是、高低、进出、上下、左右、南北、东西。<\/p>\n<h3>第二步：多位组合翻倍<\/h3>\n<p>两个位：第一位 0 时第二位可取 0 或 1（00、01），第一位 1 时再取 0 或 1（10、11），共 4 种。三个位在两位的 4 种组合后各接 0、接 1，得 8 种。递推 <span class=\"katex-inline\">C(N)=2C(N-1)<\/span>，<span class=\"katex-inline\">C(1)=2<\/span>，展开 <span class=\"katex-inline\">C(N)=2^N<\/span>。枚举三个位全部组合：000、001、010、011、100、101、110、111，对应 0～7 八个编号。<\/p>\n<h3>第三步：位值规则<\/h3>\n<p>二进制数从右向左编号，第 <span class=\"katex-inline\">k<\/span> 位权值 <span class=\"katex-inline\">2^k<\/span>。最右位 <span class=\"katex-inline\">k=0<\/span>，权 <span class=\"katex-inline\">2^0=1<\/span>；左一位 <span class=\"katex-inline\">k=1<\/span>，权 <span class=\"katex-inline\">2^1=2<\/span>；再左 <span class=\"katex-inline\">2^2=4<\/span>，<span class=\"katex-inline\">2^3=8<\/span>。数 <span class=\"katex-inline\">b_{N-1}\\cdots b_0<\/span> 的值为 <span class=\"katex-inline\">V=\\sum b_k2^k<\/span>。这条规则与十进制同构，只是底数换成 2：十进制第 <span class=\"katex-inline\">k<\/span> 位权值 <span class=\"katex-inline\">10^k<\/span>。<\/p>\n<h3>第四步：位宽与表示范围<\/h3>\n<p><span class=\"katex-inline\">N<\/span> 位无符号数从 0 到 <span class=\"katex-inline\">2^N-1<\/span>，共 <span class=\"katex-inline\">2^N<\/span> 个值。8 位：0～255，<span class=\"katex-inline\">2^8=256<\/span>；16 位：0～65535，<span class=\"katex-inline\">2^{16}=65536<\/span>；32 位：0～<span class=\"katex-inline\">2^{32}-1\\approx4.29\\times10^9<\/span>；64 位：0～<span class=\"katex-inline\">2^{64}-1\\approx1.84\\times10^{19}<\/span>。若要表示负数，需让出一位做符号位，可用正数范围相应缩小。<\/p>\n<h3>第五步：字节与字符编码<\/h3>\n<p>8 位构成一个字节。ASCII 用 7 位编码字母数字，第 8 位总为 0；一个字符占 1 字节。要编码 26 个字母加大小写、数字和标点，7 位 128 种取值足够；中文等非拉丁字符一个字符常需多个字节。<\/p>\n<h3>第六步：幂次对照与口径偏差<\/h3>\n<p><span class=\"katex-inline\">2^{10}=1024<\/span> 与 <span class=\"katex-inline\">10^3=1000<\/span> 相差 2.4%；<span class=\"katex-inline\">2^{20}=1\\,048\\,576<\/span> 与 <span class=\"katex-inline\">10^6<\/span> 相差约 4.9%；<span class=\"katex-inline\">2^{30}=1\\,073\\,741\\,824<\/span> 与 <span class=\"katex-inline\">10^9<\/span> 相差约 7.4%；到 <span class=\"katex-inline\">10^{15}<\/span> 对应幂次相差约 12.6%（PDF 第 67 页）。kilo 语境下 1000 与 1024 两种口径并存，标称容量和实际地址计算要分清。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：二进制 1011 展开成十进制<\/h3>\n<p>按位值从右排：<span class=\"katex-inline\">b_0=1<\/span>（权 1），<span class=\"katex-inline\">b_1=1<\/span>（权 2），<span class=\"katex-inline\">b_2=0<\/span>（权 4），<span class=\"katex-inline\">b_3=1<\/span>（权 8）。<\/p>\n<div class=\"katex-block\">V=1\\cdot2^0+1\\cdot2^1+0\\cdot2^2+1\\cdot2^3=1+2+0+8=11.<\/div>\n<p>反向核对：11 除以 2 取余，<span class=\"katex-inline\">11=2\\times5+1<\/span>，<span class=\"katex-inline\">5=2\\times2+1<\/span>，<span class=\"katex-inline\">2=2\\times1+0<\/span>，<span class=\"katex-inline\">1=2\\times0+1<\/span>，余数从下往上为 1011，与原数一致。<\/p>\n<h3>算例 2：编码人数需要多少位<\/h3>\n<p>要给 30 个学生编号：<span class=\"katex-inline\">2^4=16&lt;30\\le32=2^5<\/span>，需要 5 位。若编号含男女两类状态再叠加，状态数翻倍，位宽按 <span class=\"katex-inline\">2^N\\ge<\/span> 总状态数重新算。只算「人数」忽略「状态维度」是常见漏算。<\/p>\n<h3>算例 3：CD 样本幅值的位深<\/h3>\n<p>CD 每个样本幅值精度为 <span class=\"katex-inline\">1/65536<\/span>，即 <span class=\"katex-inline\">2^{16}<\/span>（PDF 第 61 页）。16 位字深把幅值区间切成 65536 个等份；位深降到 8 位，只剩 256 个等份，量化间隔放大约 256 倍，底噪明显变粗。位深决定幅值分辨精度，抽样率决定时间轴分辨率，两者不是一回事。<\/p>\n<h3>算例 4：一张图的位与字节量<\/h3>\n<p><span class=\"katex-inline\">3000\\times2000=600<\/span> 万像素，每像素 RGB 三个通道，共 1800 万个光强度值（PDF 第 57 页）。若每通道用 8 位（1 字节），一张图未压缩数据量为 <span class=\"katex-inline\">1800\\times10^4\\times1\\text{ 字节}=18\\text{ MB}<\/span>；若位深加倍到 16 位每通道，字节量同步翻倍。像素数、通道数、位深三者相乘才是总位数，再除以 8 得字节数。<\/p>\n<h3>算例 5：幂次心算对照<\/h3>\n<p>记住 <span class=\"katex-inline\">2^{10}\\approx10^3<\/span>，则 <span class=\"katex-inline\">2^{20}\\approx10^6<\/span>，<span class=\"katex-inline\">2^{30}\\approx10^9<\/span>，<span class=\"katex-inline\">2^{40}\\approx10^{12}<\/span>，<span class=\"katex-inline\">2^{50}\\approx10^{15}<\/span>。估算地址空间、文件大小、密钥空间时，先用这组对照把位数换成十进制量级，再按偏差修正。<span class=\"katex-inline\">2^{128}<\/span> 约为 <span class=\"katex-inline\">3.4\\times10^{38}<\/span>，这个量级在 c11 估算 AES 密钥空间时直接引用。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>不用二值而用多值电平<\/strong>：电路要分辨更多中间电平，噪声和漂移更容易把一个值搅成相邻值，存储和传输的可靠性下降；二值状态容错空间最大。\n<\/li><li>\n<strong>位序列不规定权值次序<\/strong>：同一串 0/1 可以读出多个数值，收发双方各按各的次序解释，结果错位；位值规则和低位高位约定是协议的一部分。\n<\/li><li>\n<strong>定长位编码罕见状态<\/strong>：每种状态都占同样位数，低频状态浪费容量；变长编码让高频状态用短码，这是 c08 压缩的出发点。\n<\/li><li>\n<strong>把容量口径混用<\/strong>：标称 1 GB 按 <span class=\"katex-inline\">10^9<\/span> 字节计，系统按 <span class=\"katex-inline\">2^{30}<\/span> 字节计，显示容量「缩水」是口径差，不是文件丢失。\n<\/ul>\n<h2>延伸层：位在后续概念中的复用<\/h2>\n<p>位是全书计数的公共底座：校验位在信息位之外追加 1 位奇偶位（c09）；IP 地址按位宽区分网络号与主机号，IPv6 地址 128 位（c10）；密钥 <span class=\"katex-inline\">N<\/span> 位的空间是 <span class=\"katex-inline\">2^N<\/span>，蛮力攻击时间随位数指数增长（c11）；颜色、声音、图像的数字化精度由每通道位深决定（c03）。遇到「多少种可能、占多少空间、能表示多大范围」的问题，先回到 <span class=\"katex-inline\">2^N<\/span> 和位值展开。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n要编码 100 种互斥状态，最少需要多少位？写出不等式。\n<\/li><li>\n二进制 1101 展开成十进制是多少？写出每一位的权值。\n<\/li><li>\n8 位字节能表示多少个无符号值？范围从几到几？\n<\/li><li>\n抽样率和量化位深分别决定声音的哪一维分辨率？\n<\/li><li>\n<span class=\"katex-inline\">2^{10}<\/span> 与 1000 的偏差从哪里来，为什么大数值时近似仍可用于心算？\n<\/ol>\n<h2>再推一层：符号位、十六进制简写与 ASCII 编码对照<\/h2>\n<h3>有符号数让出一位<\/h3>\n<p>无符号 <span class=\"katex-inline\">N<\/span> 位覆盖 0 到 <span class=\"katex-inline\">2^N-1<\/span>。要表示负数，约定最高位为符号位：0 表示非负、1 表示负，剩下 <span class=\"katex-inline\">N-1<\/span> 位参与数值编码。可用正数范围相应缩小；同样 8 位，无符号覆盖 0～255，有符号口径下能表达的正负区间宽度少于 256 个状态。讨论整数范围时先分清无符号还是有符号，不能直接套用 <span class=\"katex-inline\">2^N<\/span> 当正负数总数。<\/p>\n<h3>十六进制作为位串的简写<\/h3>\n<p>一个十六进制位对应 4 位二进制（<span class=\"katex-inline\">2^4=16<\/span>）。32 位地址或机器码写成 8 个十六进制字符，比 32 个 0/1 易读；换算时每 4 位一组，0～9 对应 0000～1001，A～F 对应 1010～1111。URL 百分号编码里的两位十六进制（如 %27、%22、%2D）就是按这套简写还原成一个字节，这是位宽规则在网络编码上的复用。<\/p>\n<h3>ASCII 字符位模式对照<\/h3>\n<p>ASCII 每个字符占 1 字节 8 位，第 8 位在美国 ASCII 中总为 0，实际用 7 位 128 个取值覆盖大小写字母、数字与标点。字母 x 与 X 在编码上只差一个位：八进制 78 与 58，二进制 01111000 与 01011000（PDF 第 349 页前后）。编码表把字符映射成固定位模式，存储、传输、比对都按位模式处理；换一套字符集（如中文编码），同样一个字符的字节数和位模式都会改变。<\/p>\n<h3>容量换算连算<\/h3>\n<p>一张 <span class=\"katex-inline\">3000\\times2000<\/span>、每通道 8 位的 RGB 图：位数 <span class=\"katex-inline\">=3000\\times2000\\times3\\times8=1.44\\times10^8<\/span> 位，除以 8 得 18 MB。CD 音频每秒 <span class=\"katex-inline\">44100\\times2\\times16=1.41\\times10^6<\/span> 位，约 176 KB/s；按 4 分钟 240 秒计约 42.3 MB。这两个例子把像素/样本、通道、位深三层相乘再换算成字节，与 c03 的抽样量化、c08 的压缩数据量直接衔接。<\/p>\n<h2>再推一层：补码减法与位宽上界连算<\/h2>\n<h3>补码把减法并入加法<\/h3>\n<p>有符号整数在机器里用补码（two&#x27;s complement）表示：<span class=\"katex-inline\">N<\/span> 位下负数 <span class=\"katex-inline\">-x<\/span> 的编码取 <span class=\"katex-inline\">2^N-x<\/span>。做减法 <span class=\"katex-inline\">a-b<\/span> 时，硬件把 <span class=\"katex-inline\">-b<\/span> 的补码与 <span class=\"katex-inline\">a<\/span> 按位相加，超出最高位的进位直接丢弃。以 8 位为例：<span class=\"katex-inline\">5-3<\/span>，<span class=\"katex-inline\">5=00000101<\/span>，<span class=\"katex-inline\">-3=256-3=253=11111101<\/span>，两数相加得 258，丢掉第 9 位进位后余 <span class=\"katex-inline\">2=00000010<\/span>，结果正确。同一套加法电路既算正数相加也算减法，不必另设减法器。<\/p>\n<h3>有符号范围随位宽收缩<\/h3>\n<p><span class=\"katex-inline\">N<\/span> 位补码的可表示区间是 <span class=\"katex-inline\">-2^{N-1}<\/span> 到 <span class=\"katex-inline\">2^{N-1}-1<\/span>。8 位覆盖 <span class=\"katex-inline\">-128<\/span> 到 <span class=\"katex-inline\">127<\/span>；16 位无符号覆盖 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">65535<\/span>，有符号覆盖 <span class=\"katex-inline\">-32768<\/span> 到 <span class=\"katex-inline\">32767<\/span>；32 位无符号上限约 <span class=\"katex-inline\">4.29\\times10^9<\/span>；64 位无符号上限约 <span class=\"katex-inline\">1.84\\times10^{19}<\/span>。判断两个数相加是否溢出，要看结果符号位与操作数是否矛盾，不能只看数值大小。<\/p>\n<h3>位模式的等价视角<\/h3>\n<p>同一组 0/1 位按不同解释会得到不同含义：作为整数是数值，作为指令是操作码，作为字符是编码，作为颜色是通道分量。硬件并不替位串做语义判断，解释方式由加载它的程序约定；位宽决定能容纳的状态数，解释规则决定状态如何映射到现实对象。<\/p>\n<h2>补足推导：<span class=\"katex-inline\">2^N<\/span> 的归纳证明、位序不变量与掩码算例<\/h2>\n<h3>组合数递推的归纳证明<\/h3>\n<p>记 <span class=\"katex-inline\">C(N)<\/span> 为 <span class=\"katex-inline\">N<\/span> 位能表示的组合数。基例 <span class=\"katex-inline\">C(1)=2<\/span>（0 与 1）。归纳步：前 <span class=\"katex-inline\">N-1<\/span> 位的每种组合，在第 <span class=\"katex-inline\">N<\/span> 位上可接 0 或接 1，组合数翻倍，<span class=\"katex-inline\">C(N)=2C(N-1)<\/span>。展开得 <span class=\"katex-inline\">C(N)=2\\times2^{N-1}=2^N<\/span>。要编码 <span class=\"katex-inline\">M<\/span> 种互斥状态，最少位数满足 <span class=\"katex-inline\">2^N\\ge M<\/span>，即 <span class=\"katex-inline\">N\\ge\\lceil\\log_2 M\\rceil<\/span>；<span class=\"katex-inline\">M=5<\/span> 时 <span class=\"katex-inline\">2^2=4&lt;5\\le2^3=8<\/span>，需 3 位。<\/p>\n<h3>位序不变量<\/h3>\n<p>位值展开 <span class=\"katex-inline\">V=\\sum b_k2^k<\/span> 依赖位序约定：从右数、从 0 起编号。约定一旦固定，交换两位就改变对应权值，数值随之改变；若没有统一位序，同一个位串无法解释成唯一数值。<\/p>\n<h3>掩码与规模算例<\/h3>\n<p>取 8 位的低 4 位，掩码为 <code>00001111<\/code>（十进制 15），按位与后保留低 4 位、高 4 位清 0。规模换算：<span class=\"katex-inline\">3000\\times2000<\/span> 像素、RGB 三通道、每通道 8 位，位数 <span class=\"katex-inline\">=3000\\times2000\\times3\\times8=1.44\\times10^8<\/span> 位，除以 8 得 18 MB。CD 音频每秒 <span class=\"katex-inline\">44100\\times2\\times16=1.4112\\times10^6<\/span> 位，约 176.4 KB/s；<span class=\"katex-inline\">2^{20}=1{,}048{,}576<\/span> 个不同取值需要 20 位编码。<\/p><\/div><\/details>", "kind": "concept", "title": "位、字节与二进制表示：$2^N$ 编码容量与位值展开"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.57<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">位、字节与二进制表示：$2^N$ 编码容量与位值展开<\/a><\/span><\/div><h1>模拟与数字：抽样、量化与模数转换<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章（原书 2.1 模拟和数字、2.2 模数转换，PDF 第 54–62 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>真实世界的量多是连续平滑的：水龙头开度、方向盘转角、体温计液柱高度、声音气压波动。计算机只处理离散的位，不能直接存下一条连续曲线。要让图片、声音、温度这些模拟量进得了计算机，必须解决两件事：沿时间或空间按固定间隔取点（抽样），把每个点的连续幅值落到有限个离散档位（量化）。不搞清这两步，就解释不了为什么音频有采样率和位深、图片有像素和颜色通道，也判断不了数字化会丢掉什么。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>模拟（Analog）<\/strong>：数值随事物平滑连续变化，与「类似（Analogous）」同根；一个微小改变会引起另一对象成比例的平滑变化，没有离散步骤（PDF 第 54 页）。例：模拟时钟指针、速度计指针、体温计液柱都平滑连续运动。<\/p>\n<p><strong>数字（Digital）<\/strong>：处理离散数据，可能取值数量固定；开关信号不是开就是关，一个对象的微小改变可能让对方毫无改变，或突然从一个离散值跳到另一个（PDF 第 54 页）。电子表每秒显示一个新分钟值，从来没有小数秒；数字温度计把 36.5～37.5 之间的温度都显示为 37。<\/p>\n<p><strong>模数转换（A/D 转换）<\/strong>：把模拟量按固定间隔测量曲线高度（气压、光强等），测得的数值形成与曲线相符的数列，这串数列就是波形或图像的数字表现形式；进行模数转换的设备叫模数转换器。反向把数值转换成电压或电流模式驱动扬声器、显示器，是数模转换（D/A）（PDF 第 60–61 页）。<\/p>\n<p><strong>抽样<\/strong>：在固定时间间隔上取幅值点。图像抽样在空间维度：镜头聚焦到长方形感光探头阵列，每个探头根据接收光量存储电荷，电荷转成数值；传感区每个元素由一组测量红绿蓝的探头组成，一组叫一个像素（pixel）。<span class=\"katex-inline\">3000\\times2000<\/span> 像素即 600 万个图像元素，每像素记录红、绿、蓝三通道强度，合计 1800 万个光强度值（PDF 第 57 页）。<\/p>\n<p><strong>量化<\/strong>：把连续幅值归到有限档位。CD 标准每秒取样 44100 个，每个样本取左右声道两个幅值，幅值精度为 <span class=\"katex-inline\">1/65536<\/span>，即 <span class=\"katex-inline\">2^{16}<\/span>（PDF 第 61 页）。位深越小，档位越粗，相邻量化级之间的差值越大。<\/p>\n<p><strong>转换损失<\/strong>：A/D 与 D/A 两个方向从来都不完美，每个方向都会丢东西；对多数人损失无法察觉，发烧友声称 CD 音质不如 LP（PDF 第 61 页）。<\/p>\n<p>正例：声音波形在固定间隔上竖起竖线，每根竖线高度是一个样本；把这些样本存成数列，播放时再连成电压波形。反例：不抽样直接存整条连续曲线，计算机没有对应可存储的离散形式。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>图片数字化链条：光学镜头 → 感光阵列像素 → 每像素 RGB 三通道电荷 → 电荷转数值 → 数值数列。探头越多、每个探头越小，电荷测量越精确，数字化图片捕捉的原始图像越准确（PDF 第 57 页）。<\/p>\n<p>声音数字化链条：声源在气压中制造波动 → 麦克风测量压力变化 → 固定间隔抽样得到幅值数列 → 量化到有限档位 → 存储为数字音频；回放时数值转电压/电流驱动扬声器，再变回气压波动（PDF 第 60 页）。<\/p>\n<p>数据量估算：每秒位数 = 抽样率 × 声道数 × 量化位数。CD：<span class=\"katex-inline\">44100\\times2\\times16=1\\,411\\,200<\/span> 位/秒，除以 8 得 <span class=\"katex-inline\">176\\,400<\/span> 字节/秒，约 172 KB/s。抽样率决定能还原的频率上限，量化位深决定幅值分辨精度；两条线相互独立。<\/p>\n<p>数字化的处理优势：数字数据可存储、传输、压缩、加密、精确复制并跨设备流转，这些对模拟信息很难做到（PDF 第 55 页）；旧媒介（石刻、纸、胶片）则能以数字形式做不到的方式经受时间考验（PDF 第 56 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：被测量的模拟量在抽样间隔内变化足够平缓，抽样率高于要保留的变化频率；幅值变化范围落在量化档位覆盖内。\n<\/li><li>\n边界一：抽样率不足，快速变化被混叠成低频假象；量化位深不足，平滑梯度出现阶梯断层，底噪变粗。\n<\/li><li>\n失败案例一：把抽样点数等同于清晰度。图片清晰度还受像素密度、镜头与编码影响；声音听感不只取决于抽样率，位深和压缩同样参与。\n<\/li><li>\n失败案例二：以为数字转换无损。两个方向都会丢东西，只是多数情况下人察觉不到；CD 与 LP 的音质争议正源于此（PDF 第 61 页）。\n<\/li><li>\n边界二：压缩分无损与有损。无损可完全还原源文件；有损舍弃人眼人耳难分辨的细节，JPEG、MP3/AAC 把视听内容压到约十分之一而几乎不觉察（PDF 第 62、231 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>模拟 vs 数字<\/strong>：连续平滑取值 vs 离散固定档位；模拟量微小改变成比例传导，数字量可能跨档跳变。\n<\/li><li>\n<strong>抽样 vs 量化<\/strong>：抽样决定时间/空间上取多少个点，量化决定每个点幅值分多少档；一个是密度问题，一个是精度问题。\n<\/li><li>\n<strong>A/D vs D/A<\/strong>：模拟转数字进机器，数字转模拟出机器；方向相反，损失都存在。\n<\/li><li>\n<strong>无损 vs 有损压缩<\/strong>：无损可完全还原源文件；有损只保留人感知得到的部分，解不出被舍弃的细节。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 的位深与组合数是量化档位的计数基础。后继：c08 把压缩思路扩展到通用数据，其带宽要承载数字化后的图像音频数据量；c11、c12 的加密处理的都是已经数字化的数据。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（模拟与数字：抽样、量化与模数转换）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：连续模拟量如何被抽样、量化成可计算的数字数列<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把模拟量讲成可推演的过程，先往回追四层前提：<\/p>\n<ol><li>\n<strong>被测量是连续变化的物理量<\/strong>。声音是气压随时间的波动，图像是光强随位置的分布，温度是液柱高度随热度的变化。先承认连续性，才谈得上在哪取点。\n<\/li><li>\n<strong>机器只认离散位<\/strong>。计算机存储和处理的是 0/1 构成的离散数值，连续曲线无法直接落进位模式；中间必须有一层转换，即 A/D。\n<\/li><li>\n<strong>抽样与量化是两个独立动作<\/strong>。抽样解决「在哪里取点」，量化解决「每个点记成哪个档位」；二者精度分开核算，不能混为一谈。\n<\/li><li>\n<strong>还原是反向动作<\/strong>。播放显示时 D/A 把数列变回电压、光强或气压；两个方向都有损失，还原不是原样复制。\n<\/ol>\n<p>依赖链方向：连续物理量 → 空间/时间抽样 → 幅值量化 → 位数列 → 机器处理 → D/A 还原。缺抽样只有少量散点，缺量化每个点仍是连续值；两者都到位，模拟量才进入数字世界。<\/p>\n<h2>正向推导：从一条波形到一串样本<\/h2>\n<h3>第一步：把物理量画成连续曲线<\/h3>\n<p>声音：声源震动在气压中制造波动，纵轴压力，横轴时间，每秒波数是音高或频率（图 2-4，PDF 第 60 页）。图像：二维平面上每个位置的红、绿、蓝光强。温度：液柱高度随热度线性膨胀。<\/p>\n<h3>第二步：沿一个轴固定间隔取点<\/h3>\n<p>声音在固定时间间隔用麦克风测量曲线高度，得到图 2-5 那样的竖线序列；图像在空间上由感光阵列把画面切成行列探头，每个探头量一处光强。抽样越频繁、越准确，数列与原始曲线的相似度越高（PDF 第 60 页）。<\/p>\n<h3>第三步：每个点的幅值归到离散档位<\/h3>\n<p>连续幅值有无限多个中间值，机器存不下；把量程切成有限等份，每个样本落到最近档位，这是量化。档位数量由位深决定：<span class=\"katex-inline\">B<\/span> 位对应 <span class=\"katex-inline\">2^B<\/span> 档。CD 用 16 位，<span class=\"katex-inline\">2^{16}=65536<\/span> 档，相邻档差为满量程的 <span class=\"katex-inline\">1/65536<\/span>（PDF 第 61 页）。<\/p>\n<h3>第四步：多通道与多样本组合成数据块<\/h3>\n<p>图像每像素 RGB 三组探头，三通道各记一个强度值；音频立体声左右两个声道各记一个幅值。时间轴上样本逐个排列，空间轴上像素逐行排列，组成二维或多维数值阵列。<\/p>\n<h3>第五步：存储、处理与反向还原<\/h3>\n<p>数值数列可存储、复制、压缩、加密、传输；回放时设备把数值转换成对应电压或电流模式驱动扬声器或显示屏，再把数字变回模拟声波或画面（PDF 第 60 页）。<\/p>\n<h3>第六步：识别损失来源<\/h3>\n<p>抽样损失：间隔内的波形形状没有记录；量化损失：档位之间的小差别被舍入；转换损失：A/D、D/A 两个方向都不完美。多数损失人耳人眼无法察觉，发烧友群体对 CD 与 LP 的评价分歧即是例证（PDF 第 61 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：CD 音频每秒与每首的数据量<\/h3>\n<p>抽样率 44100 次/秒，声道 2，位深 16 位。 每秒位数 <span class=\"katex-inline\">=44100\\times2\\times16=1\\,411\\,200<\/span> bit/s；换算字节除以 8：<span class=\"katex-inline\">176\\,400<\/span> B/s，约 172.3 KB/s。 4 分钟 = 240 秒：<span class=\"katex-inline\">176\\,400\\times240=42\\,336\\,000<\/span> B，约 40.4 MB。这是未压缩 PCM 量级；MP3/AAC 约压到十分之一，4 分钟乐曲约 4 MB 上下（压缩比为原书给的约数，PDF 第 62 页）。<\/p>\n<h3>算例 2：一张数码照片的数值规模<\/h3>\n<p><span class=\"katex-inline\">3000\\times2000=6\\,000\\,000<\/span> 像素；每像素 RGB 三通道，强度值总数 <span class=\"katex-inline\">6\\times10^6\\times3=1.8\\times10^7<\/span>，即 1800 万个光强度值（PDF 第 57 页）。每通道 8 位（1 字节）时，未压缩字节量 <span class=\"katex-inline\">1.8\\times10^7<\/span> B，约 17.2 MB；JPEG 压到 10 倍或更多，同一张图可落在 1～2 MB 量级（压缩倍数依画面细节与质量设置而定，转述）。<\/p>\n<h3>算例 3：位深与量化间隔<\/h3>\n<p>满量程幅值归一到 <span class=\"katex-inline\">[-1,1]<\/span>，总跨度 2。16 位：档位间隔 <span class=\"katex-inline\">2/65536\\approx3.05\\times10^{-5}<\/span>；8 位：<span class=\"katex-inline\">2/256\\approx7.81\\times10^{-3}<\/span>，间隔放大约 256 倍。位深每减 1 位，档位减半、间隔翻倍；位深每加 1 位，档位翻倍、间隔减半。<\/p>\n<h3>算例 4：抽样率的频率对应（定性）<\/h3>\n<p>抽样率决定时间轴能分辨的最快变化；CD 44100 次/秒覆盖人耳可听频段。若信号变化快于抽样间隔的一半，相邻样本来不及反映波动，就会出现混叠。这一频率上界的严格定理属于信号处理教材范围，原书只给抽样直觉，此处不展开公式。<\/p>\n<h3>算例 5：帧率与运动错觉<\/h3>\n<p>电影每秒 24 帧，电视约 25～30 帧（PDF 第 62 页）。快速连续显示一系列静态图片产生运动错觉；帧频越低，快速动作越容易卡顿或跳变。这是时间轴抽样在视频上的对应：画面仍是逐帧离散样本。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>不抽样，只存整条连续曲线<\/strong>：机器要记录无限多个位置的精确幅值，存储量不可穷尽；离散数列正是为了用有限点近似连续曲线。\n<\/li><li>\n<strong>抽样率不变、位深压到很低<\/strong>：时间轮廓还在，但幅值粗成少数几级，平滑音量和音色出现断层，底噪颗粒感加重。\n<\/li><li>\n<strong>量化位深不变、抽样率压低<\/strong>：幅值精度保留，但快速变化被漏掉，高频发闷，运动画面出现拖影。\n<\/li><li>\n<strong>数字化不做压缩<\/strong>：按上面算例的未压缩量级，音频和图片在网络带宽与存储上都难以承受；压缩是在冗余与感知门槛之间取舍（c09 展开）。\n<\/ul>\n<h2>延伸层：模拟媒介的长存优势<\/h2>\n<p>数字化换来可处理性，却没有在所有维度占优。陶土板、石刻、羊皮纸、纸和相机胶片这些旧媒介，可以用数字形式做不到的方式经受时间考验（PDF 第 56 页）。数字副本可能因胶片式光敏染料随时间改变而较快失效；介质老化、格式淘汰、存储迁移都是数字保存要额外处理的问题。理解取舍时，不把「数字优于模拟」当成全称判断。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n抽样和量化分别决定声音的哪一维？把两者互换会出什么问题？\n<\/li><li>\n16 位量化把量程分成多少档？间隔相对满量程是多少？\n<\/li><li>\n按 CD 参数算 3 分钟未压缩音频的字节量。\n<\/li><li>\n为什么 JPEG 可以删掉人眼分辨不出的颜色细节而不算「损坏」？\n<\/li><li>\n列举一种模拟媒介比数字媒介更耐久的情形，并说明它对应数字化的哪项损失。\n<\/ol>\n<h2>再推一层：抽样与量化的两条分辨率线，以及数字化损失的去向<\/h2>\n<h3>抽样沿时间轴离散化<\/h3>\n<p>连续波形按固定时间间隔取幅值，这个间隔对应抽样率：CD 每秒取 44100 个样本。抽样率越高，单位时间内样本越密，能还原的高频细节越多；抽样率下降，高频成分先丢失，听感上高频发闷。相邻样本之间的波形细节在离散化那一刻不再保留，A/D 转换只保存各采样点的量化值，不保存两点之间的连续形状。<\/p>\n<h3>量化沿幅值轴分层<\/h3>\n<p>每个样本的连续幅值要落到有限个离散档位上。CD 精度 <span class=\"katex-inline\">1/65536=2^{16}<\/span>，即 16 位把幅值区间切成 65536 个等份；位深降到 8 位只剩 256 档，量化间隔放大约 256 倍，小幅度变化被并入相邻档位，底噪变粗。量化误差是幅值轴上的固有损失，档位越密误差越小，但每样本占用位深同步增加。<\/p>\n<h3>图片数字化的两条线对照<\/h3>\n<p>图片把空间网格化：<span class=\"katex-inline\">3000\\times2000<\/span> 是像素网格密度，RGB 三通道各记一个强度值，强度档位由每通道位深决定（PDF 第 57 页）。空间网格密度对应声音的抽样率，颜色/亮度档位对应声音的量化位深；两条线分开核算，不能用提高位深弥补像素不足，也不能用增加像素弥补颜色档位粗。<\/p>\n<h3>双向转换都有损失<\/h3>\n<p>D/A 把数值变回模拟波形时，相邻样本之间按插值重建，丢失的高频细节回不来；A/D 与 D/A 两个方向都存在损失（PDF 第 61 页）。无损数字化要求抽样率和位深足够高，把损失压到人耳人眼不可察觉；有损压缩（JPEG、MP3/AAC）则主动舍弃不易察觉的细节换更高压缩比，这一步已超出模数转换本身，进入 c08 的压缩范畴。<\/p>\n<h3>未压缩数据量连算<\/h3>\n<p>CD 每秒 <span class=\"katex-inline\">44100\\times2\\times16=1.4112\\times10^6<\/span> 位，约 176.4 KB/s；3 分钟 180 秒约 31.7 MB，4 分钟约 42.3 MB。图片 <span class=\"katex-inline\">600<\/span> 万像素、RGB 三通道、每通道 8 位，约 18 MB/张。这些原始量级解释了为什么音频图片需要压缩，也为 c08 估算压缩比提供未压缩基线。<\/p>\n<h2>再推一层：量化误差与抽样率下限连算<\/h2>\n<h3>量化步长与误差上界<\/h3>\n<p>满量程幅值被 <span class=\"katex-inline\">2^b<\/span> 个量化级均分，相邻两级间距为满量程 <span class=\"katex-inline\">/2^b<\/span>，单个样本的量化误差不超过半个步长。16 位音频有 <span class=\"katex-inline\">2^{16}=65536<\/span> 个量级；位深每增加 1，级数翻倍、步长减半，误差随位深线性收紧而非随样本数平均掉。抽样率决定时间维分辨率，量化位深决定幅值维分辨率，二者独立，需分别选取。<\/p>\n<h3>抽样率下限与混叠<\/h3>\n<p>要不失真还原最高频率为 <span class=\"katex-inline\">f<\/span> 的信号，抽样率须不低于 <span class=\"katex-inline\">2f<\/span>（转述：奈奎斯特抽样定理）。CD 取 44100 次/秒，对应可还原约 20 kHz 以内的声音；若抽样率低于信号最高频率两倍，高频成分会折回低频，形成混叠（aliasing），事后无法靠滤波分离。模数转换先抽样后量化，数字世界拿到的只是离散幅值序列。<\/p>\n<h3>连续信号到离散序列的完整链条<\/h3>\n<p>模拟信号是时间与幅值都连续的波形：先在时间轴上按固定间隔抽样，得到一串时刻点上的瞬时幅值；再把每个幅值就近落到有限个量化级上，得到有限位的整数；最后编码成字节流存储或传输。反向重建时，解码器把离散整数还原成阶梯幅值，经低通滤波平滑回近似波形。抽样越密、量化级越多，重建波形与原波形越接近，但存储与传输的数据量同步上升，这正是数字化始终要在保真与码率之间取舍的根因。<\/p>\n<h3>误差来源分层记账<\/h3>\n<p>数字化链条上有两类独立误差：抽样丢失两采样点之间的波形细节，量化把连续幅值压到有限级别。分析失真时先判定问题出在哪一维，再决定提高抽样率还是提高位深，不能用提高其中一维来掩盖另一维的不足；二者数据量都按乘积增长，联合提升时码率上升得更快。<\/p>\n<h2>补足推导：量化误差上界、抽样下限与数据量连算<\/h2>\n<h3>量化误差的来源与上界<\/h3>\n<p>满量程幅值被 <span class=\"katex-inline\">2^b<\/span> 个量化级均分，相邻级间距 <span class=\"katex-inline\">\\Delta=\\mathrm{FS}/2^b<\/span>。任一连续幅值就近落到某一级，量化误差不超过半个步长 <span class=\"katex-inline\">\\Delta/2<\/span>；这个误差是幅值量化引入的固定偏差，不会随重复采样被平均掉。位深每加 1，级数翻倍、步长减半，误差上限随之减半。<\/p>\n<h3>抽样率下限与混叠<\/h3>\n<p>要不失真还原最高频率为 <span class=\"katex-inline\">f<\/span> 的信号，抽样率须不低于 <span class=\"katex-inline\">2f<\/span>（转述：奈奎斯特抽样定理）。CD 取 44100 次/秒，对应可还原约 20 kHz 以内的声音；抽样率低于信号最高频率两倍时，高频折回低频形成混叠，事后无法靠滤波分离。抽样决定时间维密度，位深决定幅值维精度，两者独立。<\/p>\n<h3>数据量连算<\/h3>\n<p>每秒位数 <span class=\"katex-inline\">=<\/span> 抽样率 <span class=\"katex-inline\">\\times<\/span> 声道数 <span class=\"katex-inline\">\\times<\/span> 量化位数。CD：<span class=\"katex-inline\">44100\\times2\\times16=1.4112\\times10^6<\/span> 位/秒，除以 8 得 176.4 KB/s；10 秒立体声约 1.764 MB，4 分钟（240 秒）约 42.3 MB。<span class=\"katex-inline\">3000\\times2000<\/span> 图、RGB 三通道、每通道 8 位约 18 MB/张。这两组未压缩量级是 c08 估算压缩比的基线。<\/p><\/div><\/details>", "kind": "concept", "title": "模拟与数字：抽样、量化与模数转换"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.77<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">冯·诺依曼逻辑结构：CPU、RAM、二级存储与总线<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">位、字节与二进制表示：$2^N$ 编码容量与位值展开<\/a><\/span><\/div><h1>CPU 执行机制与多级缓存：取指—译码—执行、累加器与局部性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章（原书 3.1 玩具计算机、3.2 真实的 CPU、3.3 缓存，PDF 第 77–90 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>第 1 章把 CPU 称作计算机的「大脑」，但「大脑」这个比喻回答不了机制问题：一条指令从哪里来、CPU 怎么知道要做什么、算完的结果放哪里、为什么程序重复运行第二次更快。要把这些讲清楚，需要一台指令集极简的纸面机器把执行循环摊开，再解释真实 CPU 周围为什么叠出多级缓存。不理解执行循环，后面算法、编译、操作系统里的「程序跑起来」都只是黑箱；不理解缓存局部性，就解释不了存储层级的速度差。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>指令系统<\/strong>：CPU 能执行的基本操作集合，包含加减乘除等算术运算、从 RAM 取数、把结果存回 RAM、比较两个数字并按结果决定下一步（PDF 第 76 页）。指令集合不大，但 CPU 每秒可执行数十亿次运算，复杂处理由指令序列组合完成。<\/p>\n<p><strong>累加器（accumulator）<\/strong>：玩具计算机上一块额外的存储区，容量只够存一个数值，类似计算器显示屏，保存最近输入的数值或最近计算的结果（PDF 第 77 页）。<\/p>\n<p><strong>玩具计算机指令表<\/strong>：原书图 3-1 列出 6 条：GET 读键盘入累加器，PRINT 打印累加器，STORE M 把累加器副本存入内存 M，LOAD M 把内存 M 载入累加器，ADD M 把内存 M 加到累加器，STOP 停止执行（PDF 第 77 页）。<\/p>\n<p><strong>执行循环<\/strong>：运行时 CPU 从 RAM 第一个位置开始，重复三步——Fetch 从 RAM 取下一条指令；Decode 解析指令内容；Execute 执行该指令，然后返回取指（PDF 第 77 页）。<\/p>\n<p><strong>缓存（cache）<\/strong>：计算领域广泛适用的思想。CPU 中缓存是容量小但速度快的内存，存放最近使用的信息，以避免访问 RAM；典型 CPU 有 2～3 个缓存，容量依次增大、速度递减，一般称一级、二级、三级缓存；最大缓存能存以兆字节计的数据，作者笔记本每个核心配 256KB 二级缓存和单个 4MB 三级缓存（PDF 第 89–90 页）。<\/p>\n<p><strong>局部性<\/strong>：缓存有用的关键在于，最近用过的信息很可能再次被用到；缓存通常一次性加载一组信息块，比如只请求一个字节，也会加载 RAM 中一段连续地址，相邻信息也可能被用到，邻近引用同样不必等待（PDF 第 90 页）。<\/p>\n<p>正例：求和循环里 6 条指令对每个输入数值执行一遍，指令存在缓存中就不必每轮从 RAM 重读；把求和变量存在数据缓存中也能提高访问速度（PDF 第 89 页）。反例：程序随机跳遍巨大地址空间，缓存块命中率低，缓存提速作用有限。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>推演玩具程序求两数之和：LOAD X 把 X 载入累加器，ADD Y 把 Y 加到累加器，STORE Z 把结果存到 Z（PDF 第 124 页的汇编对照）。三条指令各走一遍执行循环：取指、译码、执行；LOAD 与 STORE 完成累加器与内存之间的搬运，ADD 在累加器内完成加法。<\/p>\n<p>执行循环能自主运行的根据是 CPU 可以比较数字（这个数比另一个大吗、两份信息相同吗），并基于结果决定下一步；这使机器在没有人工介入的情况下自主运行（PDF 第 76 页）。跳转指令改变下一条取指的位置，循环和分支由此成立。<\/p>\n<p>缓存层级推演：越靠近 CPU 的存储越小越快，越往下越大越慢。CPU 先查一级缓存，未命中再查二、三级，最后才访问 RAM；一次加载连续块，利用空间局部性。缓存思想不限于 CPU：RAM 可作磁盘缓存，RAM 与磁盘又可作网络数据缓存；浏览器本地保存网页大资源副本，再访问时不必重新下载，缓存满后旧项目被替换（PDF 第 90 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：程序访问具有时间局部性（刚用过的很快再用）或空间局部性（用过附近地址）；缓存块大小与程序访问模式匹配。\n<\/li><li>\n边界一：缓存提速掩盖下层存储等待，但不改变下层速度；缓存未命中时仍要付慢速访问代价。\n<\/li><li>\n失败案例一：把缓存当永久存储。缓存内容会被新项目替换，断电或退出后不保证保留；Word、Firefox 第二次启动快，是因为程序指令还在 RAM，使用其他程序一段时间后，原程序从缓存中被挤出（PDF 第 90 页）。\n<\/li><li>\n失败案例二：跨 CPU 比速度只看主频。同样求和，不同处理器指令条数、并行能力、缓存命中与功耗调速都不同，快慢要结合具体任务判断（PDF 第 89 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>累加器 vs RAM 位置<\/strong>：累加器只存一个当前值，是 CPU 内的工作单元；RAM 位置存放长期变量与程序指令，可随机读写。\n<\/li><li>\n<strong>指令 vs 数据<\/strong>：在存储程序机里两者都以位模式存于 RAM，CPU 取指阶段把当前位置解释为指令，执行阶段把操作数位置解释为数据。\n<\/li><li>\n<strong>缓存 vs 二级存储<\/strong>：缓存快而小、内容可替换；二级存储慢而大、断电保留。RAM 对磁盘是缓存，磁盘对网络数据也可承担缓存角色。\n<\/li><li>\n<strong>主频 vs 吞吐<\/strong>：时钟频率是每秒滴答次数；实际吞吐还取决于指令条数、并行能力、缓存命中与功耗调速，不能只拿 GHz 比快慢。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的结构给出 CPU、RAM、总线职责；c02 的位模式是指令和数据的表示形式。后继：c05 算法步骤最终在执行循环上落地；c07 编译器把高级语言翻译成这套指令；操作系统 c07 负责把 CPU 时间分给各进程；缓存局部性思路在 c08 网络缓存、c10 浏览器缓存中复用。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（CPU 执行机制与多级缓存：取指—译码—执行、累加器与局部性）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：一条指令从 RAM 到结果的执行全程，以及缓存层级为什么快<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把 CPU 机制讲成可推演过程，先往回追四层前提：<\/p>\n<ol><li>\n<strong>指令和数据都已落在 RAM 中<\/strong>。这是 c01 存储程序原理的结论：程序指令与操作数以位模式存在同一存储器体系里，CPU 才能逐条取指。\n<\/li><li>\n<strong>CPU 有一个能暂存当前值的工作单元<\/strong>。二进制运算需要一个地方放被加数、中间结果和最终结果，这就是累加器；没有它，每步中间值都要来回倒腾内存。\n<\/li><li>\n<strong>指令要有可读解的操作码和操作数地址<\/strong>。译码阶段要认出操作类型（加、取数、存数、跳转）和作用的内存位置；指令格式约定是译码前提。\n<\/li><li>\n<strong>执行结果要能写回内存或外设<\/strong>。算完不能只留在处理器内部，结果必须经总线写回 RAM，再由后续指令或输出部件使用。\n<\/ol>\n<p>依赖链方向：RAM 中指令序列 → 取指 → 译码 → 累加器执行 → 写回 RAM/外设 → 回到取指。缓存是在这条路径旁加的快速副本层，前提是访问行为有局部性。<\/p>\n<h2>正向推导：一台玩具计算机跑一段求和程序<\/h2>\n<h3>第一步：布置内存现场<\/h3>\n<p>设内存位置 X 存第一个数，Y 存第二个数，Z 留作结果。程序指令按顺序放在 RAM 低位地址：第一条 LOAD X，第二条 ADD Y，第三条 STORE Z，第四条 STOP。累加器初始值不确定，第一条 LOAD 会覆盖它。<\/p>\n<h3>第二步：取指（Fetch）<\/h3>\n<p>CPU 从程序计数器指向的 RAM 位置读出下一条指令。指令在总线上传输到 CPU 的指令寄存器。计数器前移到下一条位置。这一步只搬运指令内容，不解释含义。<\/p>\n<h3>第三步：译码（Decode）<\/h3>\n<p>CPU 解析指令内容：操作码是 LOAD、ADD、STORE 还是 STOP；操作数字段给出内存地址 X、Y 或 Z。译码决定控制线路接通哪些通路：LOAD 要把内存送到累加器，ADD 要把内存值与累加器值相加，STORE 要把累加器送回内存。<\/p>\n<h3>第四步：执行（Execute）<\/h3>\n<ul><li>\nLOAD X：把内存 X 位置的值复制进累加器，X 内容不变。\n<\/li><li>\nADD Y：把内存 Y 位置的值加到累加器，累加器原值与 Y 相加后覆盖累加器，Y 内容不变。\n<\/li><li>\nSTORE Z：把累加器副本复制到内存 Z 位置，累加器内容不变。\n<\/li><li>\nSTOP：停止执行。\n<\/ul>\n<h3>第五步：写回与循环返回<\/h3>\n<p>STORE 之后结果已在 Z；CPU 回到 Fetch 取第四条 STOP，译码出停止指令，循环终止。若程序是循环求和，跳转指令会把计数器拨回循环开头，下一轮再从 Fetch 开始。<\/p>\n<h3>第六步：比较与分支<\/h3>\n<p>CPU 比较两个数字：这个数比另一个大吗、两份信息相同吗；基于比较结果决定下一条取指位置。条件满足跳回循环开头，不满足顺序往下走。这一步是机器能自主运行、能实现循环与分支的根据（PDF 第 76 页）。<\/p>\n<h3>第七步：真实 CPU 的差异<\/h3>\n<p>真实指令集比玩具丰富：可一次内存到内存完成运算，多条指令可在不同阶段流水线重叠执行，部分处理器支持并行多条指令。同样两个数求和，有的处理器 3 条指令，有的 2 条，有的 1 条；主频、指令条数、并行度、功耗调速共同决定实际速度，不能只拿 GHz 比较（PDF 第 89 页）。<\/p>\n<h2>缓存层级的正向推演<\/h2>\n<h3>第八步：为什么需要缓存<\/h3>\n<p>RAM 比 CPU 慢。循环反复使用同几条指令和同一变量，每轮都从 RAM 重读是无谓等待。放一个小而快的存储层在 CPU 旁，保存最近用过的信息，未命中再回 RAM 取。<\/p>\n<h3>第九步：局部性两条来源<\/h3>\n<p>时间局部性：刚用过的信息很可能很快再用。空间局部性：用过某地址，邻近地址也可能被用到。因此缓存一次加载一组连续信息块：只请求一个字节，也把 RAM 中一段连续地址带进缓存，邻近引用同样命中（PDF 第 90 页）。<\/p>\n<h3>第十步：多级缓存的容量—速度权衡<\/h3>\n<p>典型 CPU 有 2～3 级缓存，一级最快最小，往下容量增大、速度递减；作者笔记本每个核心 256KB 二级缓存、单个 4MB 三级缓存（PDF 第 89–90 页）。越靠近核心越快越贵越小，层级间用容量换速度。<\/p>\n<h3>第十一步：缓存思想向其他层复用<\/h3>\n<p>RAM 作为磁盘的缓存，磁盘作为网络数据的缓存；网络用缓存加速访问远程服务器；浏览器把图片等大资源副本存本地，二次访问走本地副本；缓存不能无限增长，旧项目被悄悄挤出；Word 的最近文件列表也是一种缓存形式（PDF 第 90 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：三条指令求和的操作数流转<\/h3>\n<p>设 <span class=\"katex-inline\">X=17<\/span>，<span class=\"katex-inline\">Y=25<\/span>。LOAD X 后累加器 <span class=\"katex-inline\">A=17<\/span>；ADD Y 后 <span class=\"katex-inline\">A=17+25=42<\/span>；STORE Z 后内存 Z=42，累加器仍为 42。若再来一条 LOAD X 覆盖，A 变成 17，Z 保留 42 不受影响——STORE 是复制而非移动，内存源位置不变。<\/p>\n<h3>算例 2：循环
