e\">2^{38}\\approx2.7\\times10^{11}<\/span> 倍，蛮力在可及时间内没有结果。<\/p>\n<h2>正向推导三：对称加密遗留的两个难题<\/h2>\n<h3>第十一步：密钥分发<\/h3>\n<p>参与秘密通信的每一方必须知道所用密钥，因此必须有绝对安全的渠道把密钥送到通信参与方。这看似像把大家请到家里聚餐；如果来人里有间谍或敌人，分发密钥时的安全性就无法保证（PDF 第 344 页）。<\/p>\n<h3>第十二步：密钥增生<\/h3>\n<p>要保证彼此无关的多方相互独立秘密会话，就要为每组会话准备不同密钥。人数增多时，需要保密分发的密钥配对数随之增长，密钥分发更加困难（PDF 第 345 页）。<\/p>\n<h3>第十三步：难题导向<\/h3>\n<p>算法本身能把消息扰乱到不可读，却不能在不安全的网络上把第一把密钥安全送出去。这个缺口直接导致公钥加密的诞生（c12）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：移位密钥空间<\/h3>\n<p>凯撒移位只有 26 个可能距离（英文小写字母表），试 26 次即可遍历；频率分析甚至不必穷举。相比之下，现代密钥空间是 <span class=\"katex-inline\">2^N<\/span> 的指数量级。<\/p>\n<h3>算例 2：56 位与 128 位对照<\/h3>\n<p><span class=\"katex-inline\">2^{56}\\approx7.2\\times10^{16}<\/span>；<span class=\"katex-inline\">2^{128}\\approx3.4\\times10^{38}<\/span>。两者相差 <span class=\"katex-inline\">2^{72}\\approx4.7\\times10^{21}<\/span> 倍；128 位空间相对 56 位是天文数字级别的扩大。<\/p>\n<h3>算例 3：年度破解能力<\/h3>\n<p><span class=\"katex-inline\">10^6<\/span> 个 GPU，每个每秒 <span class=\"katex-inline\">10^{13}<\/span> 次 → 每秒 <span class=\"katex-inline\">10^{19}<\/span> 次；按一年约 <span class=\"katex-inline\">3.15\\times10^7<\/span> 秒计，年度约 <span class=\"katex-inline\">3.15\\times10^{26}<\/span> 次，原书记为约 <span class=\"katex-inline\">3\\times10^{26}\\approx2^{90}<\/span>（PDF 第 344 页）。对 <span class=\"katex-inline\">2^{128}<\/span>，即便按此算力，穷尽时间远超现实可及范围。<\/p>\n<h3>算例 4：字典攻击优先级<\/h3>\n<p>攻击者先试「password」「12345」这类常见单词和数字形式，再试短密钥、长密钥；用户选密钥偷懒或粗心，弱口令在字典阶段就被命中，不必走蛮力穷举。<\/p>\n<h3>算例 5：密钥增生配对数<\/h3>\n<p><span class=\"katex-inline\">m<\/span> 个参与者两两独立会话，若每对用独立对称密钥，需要 <span class=\"katex-inline\">\\binom{m}{2}=m(m-1)/2<\/span> 把密钥；人数增长时密钥数按平方增长，分发保管负担随之上升（转述：原书定性描述「密钥增生」，此为配对数推算）。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>算法保密、密钥公开<\/strong>：把安全寄托在对手不知道方案上，属于隐匿式安全；方案一旦泄露或被逆向，历史上这类方法往往失败（PDF 第 342 页）。\n<\/li><li>\n<strong>密钥位数减半<\/strong>：搜索空间缩小为原来的 <span class=\"katex-inline\">1/2<\/span>，蛮力时间减半；56 位被提速后的硬件击穿，正是位数跟不上算力增长的结果。\n<\/li><li>\n<strong>允许攻击者选择明文对照<\/strong>：若算法不抵御选择明文攻击，攻击者诱使目标加密选定明文，与密文对照即可缩小密钥空间；好算法必须顶住这类攻击。\n<\/li><li>\n<strong>没有安全分发渠道<\/strong>：对称密钥必须先交送到对方；网络本身不可信，密钥若经不可信中间人传递，密文再强也等于门户大开。\n<\/li><li>\n<strong>每组会话复用同一把密钥<\/strong>：密钥增生问题被绕过，一份密钥泄露牵连所有会话；独立会话需要独立密钥，分发成本又上升。\n<\/ul>\n<h2>延伸层：对称加密在真实协议里的位置<\/h2>\n<p>真实 <code>https<\/code> 链路通常是混合方案：公钥加密（c12）用来安全交换一把临时对称会话密钥，之后批量数据用对称算法高速加密。对称算法负责效率，公钥负责分发，二者分工互补。密钥管理之外，加密只解决内容不被窃读；传输是否出错由检错码（c09）负责，平台方是否可见则属于 c13 的信任边界问题。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">N<\/span> 位密钥的空间大小和平均蛮力工作量；密钥加一位空间怎么变？\n<\/li><li>\n凯撒密码为什么扛不住频率分析？现代密码用什么方向抹平频率特征？\n<\/li><li>\nDES 56 位为何在 1999 年被一天破解？AES-128 的 <span class=\"katex-inline\">2^{128}<\/span> 与年度算力 <span class=\"katex-inline\">2^{90}<\/span> 相差多少倍？\n<\/li><li>\n对称加密的密钥分发和密钥增生各指什么？\n<\/li><li>\n为什么说现代密码学假定攻击者知道算法？安全最终寄托在哪里？\n<\/ol>\n<h2>再推一层：密钥空间指数推算，与对称加密的分发/增生难题展开<\/h2>\n<h3>密钥空间计数<\/h3>\n<p><span class=\"katex-inline\">N<\/span> 位密钥每位取 0/1，可能密钥总数 <span class=\"katex-inline\">K=2^N<\/span>。蛮力攻击逐一尝试候选密钥，最坏试完 <span class=\"katex-inline\">K<\/span> 把，平均约试到 <span class=\"katex-inline\">K/2<\/span>，期望工作量 <span class=\"katex-inline\">\\sim2^{N-1}<\/span>，时间与 <span class=\"katex-inline\">2^N<\/span> 成正比（PDF 第 343 页）。密钥从 <span class=\"katex-inline\">N<\/span> 位增到 <span class=\"katex-inline\">N+1<\/span>，空间从 <span class=\"katex-inline\">2^N<\/span> 增到 <span class=\"katex-inline\">2^{N+1}=2\\cdot2^N<\/span>，穷举量翻倍；对抗算力提升靠加位数把指数底数抬上去。<\/p>\n<h3>DES 与 AES 量级对照<\/h3>\n<p>DES 总是 56 位密钥，空间 <span class=\"katex-inline\">2^{56}\\approx7.2\\times10^{16}<\/span>；1976 年到 21 世纪初最常用，随运算速度加快长度已经太短，1999 年廉价专业计算机蛮力攻击穷举一天可破（PDF 第 343–344 页）。AES 由德门与赖曼的 Rijndael 算法在全球公开竞赛胜出，2002 年成为美国政府官方标准，归入公有领域；支持 128、192、256 位（PDF 第 344 页）。<\/p>\n<h3>算力对照核算<\/h3>\n<p>GPU 每秒 <span class=\"katex-inline\">10^{13}<\/span> 次；一百万个 GPU 每秒 <span class=\"katex-inline\">10^{19}<\/span> 次；每年约 <span class=\"katex-inline\">3\\times10^{26}<\/span> 次，约 <span class=\"katex-inline\">2^{90}<\/span> 次（PDF 第 344 页）。AES-128 空间 <span class=\"katex-inline\">2^{128}<\/span>，相对年度算力 <span class=\"katex-inline\">2^{90}<\/span> 相差 <span class=\"katex-inline\">2^{38}\\approx2.7\\times10^{11}<\/span> 倍，蛮力在可及时间内没有结果。DES 的 <span class=\"katex-inline\">2^{56}<\/span> 在 1999 年专用硬件一天量级可穷尽；56 位在当代算力条件下明显过短。<\/p>\n<h3>攻击路径不止蛮力<\/h3>\n<p>字典攻击先试「password」「12345」这类常见单词和数字形式，再试短密钥、长密钥；选密钥偷懒或粗心就会让这种攻击得手（PDF 第 343 页）。攻击者可能知道对应明文，或选取一段明文诱使目标用待破解密钥加密，两相对照缩小密钥空间。好算法要抵御选择明文等各类攻击。<\/p>\n<h3>两条遗留难题<\/h3>\n<p>密钥分发：参与秘密通信的每一方必须知道所用密钥，必须有绝对安全的渠道把密钥送到参与方；来人里有间谍或敌人，分发安全性就无法保证（PDF 第 344 页）。密钥增生：要保证彼此无关的多方独立秘密会话，就要为每组会话准备不同密钥，分发更加困难。<span class=\"katex-inline\">m<\/span> 个参与者两两独立会话需要 <span class=\"katex-inline\">\\binom{m}{2}=m(m-1)/2<\/span> 把密钥，人数增长时密钥数按平方增长（转述：原书定性描述密钥增生，配对数为推算）。这两个难题直接导致公钥加密诞生。<\/p>\n<h2>再推一层：密钥空间的穷举时间连算<\/h2>\n<h3>穷举规模随密钥位长指数膨胀<\/h3>\n<p><span class=\"katex-inline\">b<\/span> 位密钥的可能取值总数是 <span class=\"katex-inline\">2^b<\/span>。DES 用 56 位密钥，空间 <span class=\"katex-inline\">2^{56}\\approx7.2\\times10^{16}<\/span>，1999 年已可在一天量级内被专用设备遍历；AES-128 的 <span class=\"katex-inline\">2^{128}\\approx3.4\\times10^{38}<\/span>，即便按每秒试 <span class=\"katex-inline\">10^{19}<\/span> 量级（转述：设备速率口径）估算，遍历所需时间也远超可观测宇宙年龄，位长每翻倍，穷举规模平方级放大。密钥强度落在位长上，不靠算法保密本身。<\/p>\n<h3>对称加密的效率与遗留代价<\/h3>\n<p>对称算法在硬件流水下吞吐快，适合大批量数据加密；代价是每一条独立会话都要一把独立密钥，<span class=\"katex-inline\">m<\/span> 个参与者两两通信需要 <span class=\"katex-inline\">m(m-1)/2<\/span> 把密钥，密钥数随人数平方增长。网络不可信时，第一把共享密钥本身没有安全渠道送达，这道分发与增生难题留给了 c12 的公钥方案解决。<\/p>\n<h2>补足推导：密钥空间期望工作量、算力连算与密钥增生计数<\/h2>\n<h3>期望穷举工作量<\/h3>\n<p><span class=\"katex-inline\">N<\/span> 位密钥每位取 0/1，密钥总数 <span class=\"katex-inline\">2^N<\/span>。蛮力攻击平均试到一半左右命中，期望工作量约 <span class=\"katex-inline\">2^{N-1}<\/span>，时间与 <span class=\"katex-inline\">2^N<\/span> 成正比；密钥每加一位，搜索空间翻倍，破解时间指数增长。<\/p>\n<h3>算力与位长连算<\/h3>\n<p>GPU 每秒约 <span class=\"katex-inline\">10^{13}<\/span> 次计算；一百万个 GPU 每秒约 <span class=\"katex-inline\">10^{19}<\/span> 次，每年约 <span class=\"katex-inline\">3\\times10^{26}<\/span> 次，约等于 <span class=\"katex-inline\">2^{90}<\/span> 次。DES 56 位空间 <span class=\"katex-inline\">2^{56}\\approx7.2\\times10^{16}<\/span>，1999 年已可一天内穷举；AES-128 为 <span class=\"katex-inline\">2^{128}\\approx3.4\\times10^{38}<\/span>，相对 <span class=\"katex-inline\">2^{90}<\/span> 差距 <span class=\"katex-inline\">2^{38}\\approx2.7\\times10^{11}<\/span> 倍，按该算力量级远不可遍历。前提是算法无缺陷、随机数生成器不可预测；算法漏洞或弱随机数会让长密钥失效。<\/p>\n<h3>密钥增生计数<\/h3>\n<p><span class=\"katex-inline\">m<\/span> 个参与者两两独立会话，每组会话需要一把独立密钥，配对数 <span class=\"katex-inline\">\\binom{m}{2}=m(m-1)/2<\/span>，密钥数随人数平方增长。对称加密还要先经绝对安全渠道把这把共享密钥送出；渠道里有间谍就无法保证，这道分发难题留给 c12 的公钥方案。<\/p><\/div><\/details>", "kind": "concept", "title": "对称密钥加密：密钥空间、蛮力攻击与 DES/AES 量级"}, "c12": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.345<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">对称密钥加密：密钥空间、蛮力攻击与 DES/AES 量级<\/a><\/span><\/div><h1>公钥加密：密钥对、分发问题与对称/非对称分工<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书 12.1.2 公钥加密、12.2 信任问题，PDF 第 345–350 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>对称加密要求双方先安全共享同一把密钥，可网络本身不可信，第一把密钥怎么送出去成了死结（c11）。这个概念给出另一条路线：每人持有一对数学关联的密钥，公钥公开、私钥保密，一把加密的消息只能用另一把解密。公钥方案免去预先商定和密钥交换，通信各方甚至不需要认识。本节同时说明公钥为什么慢、真实协议为什么采用「公钥协商会话密钥 + 对称算法传批量数据」的混合分工，以及数字签名、密钥泄露边界和证书信任问题。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>公钥加密（public-key encryption）<\/strong>：迪菲（Whitfield Diffie）和赫尔曼（Martin Hellman）20 世纪 70 年代中期于斯坦福发明，两人获 2015 年图灵奖；英国 GCHQ 的埃利斯（James Ellis）和柯克斯（Clifford Cocks）早几年独立发现，因保密要求到 1997 年才发表（PDF 第 345 页）。<\/p>\n<p><strong>密钥对（key pair）<\/strong>：每个人有一个公钥和一个私钥，二者是数学上有关联的整数。性质：用其中一个密钥加密过的消息只能用另一个解密，反之亦然。密钥足够长时，蛮力攻击和从一个密钥推算另一个密钥都徒劳；破解时间随密钥加长呈指数型增长（PDF 第 345 页）。<\/p>\n<p><strong>公钥公开、私钥保密<\/strong>：公钥开诚布公，任何人都能拿到，一般公布在网站上；私钥只有密钥对的主人知道（PDF 第 345 页）。<\/p>\n<p><strong>单向通信流程<\/strong>：Alice 取 Bob 公钥加密消息发出；Eve 偷听只能发现通信关系，看不到内容；Bob 用自己私钥解开，也只有这把私钥能解开（图 12-2，PDF 第 346 页）。反向回信同构：Bob 用 Alice 公钥加密，Alice 用私钥解开。<\/p>\n<p><strong>解决分发<\/strong>：公钥放在网站上，任何人都可发秘密消息，不必事先商定或交换共享密钥，各方甚至不需要认识（PDF 第 346 页）。<\/p>\n<p><strong>混合分工<\/strong>：公钥算法比 AES 慢好几个数量级，通常分两步：先用公钥协商临时会话密钥，再用 AES 加密批量数据（PDF 第 347 页）。买书时浏览器生成临时口令，用亚马逊公钥加密传出；私钥解出后双方用该口令在 AES 中传送卡号。<\/p>\n<p><strong>数字签名<\/strong>：Alice 先用自己私钥对消息加密并公布；任何人用 Alice 公钥解密。除 Alice 外没人知道她的私钥，接收者可断定消息由 Alice 加密过；前提是私钥没有泄露（PDF 第 347 页）。既要保密又要认证：Alice 先用 Bob 公钥加密，再用自己私钥签署；Bob 先用 Alice 公钥验证来源，再用自己私钥解开密文。<\/p>\n<p><strong>RSA<\/strong>：最常用的公钥算法，由 Rivest、Shamir、Adleman 于 1978 年发明，RSA 取自三人姓氏首字母，三人获 2002 年图灵奖；可靠性来自巨大合数的因数分解难度。生成一个很大的整数（如约 500 位），由两个质因子相乘；掌握质因子的私钥主人能迅速解密，其他人要解密就得先分解质因子（PDF 第 348 页）。<\/p>\n<p><strong>消息摘要（digest，密码学散列）<\/strong>：公钥算法慢，一般签署从原始文档提取的小得多的文档。散列把任意输入换成固定长度比特流，找不到别的输入生成同样摘要，输入轻微改变约一半位变化；比对双方摘要可检测篡改（PDF 第 349 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>RSA 把密钥对建立在大整数分解难题上：两个大质数相乘容易，得到合数；反过来把合数拆回两个质因子，计算量随数位增长快速上升。私钥掌握质因子可快速解密；攻击者只拿到公钥与合数，分解不可行。密钥越长，分解工作量按指数增长（PDF 第 348–349 页）。<\/p>\n<p>信任边界：买书时如何确定对面是亚马逊而非冒牌货？网站发送由独立权威机构签署的证书证明身份；浏览器用权威机构公钥检查证书，确认它属于亚马逊而不是其他机构（PDF 第 350 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：公钥用于初次通信的密钥协商与身份签名；批量数据交给对称算法换取速度，全量公钥加密不现实。\n<\/li><li>\n边界一：私钥泄露后，此前发给本人的消息形同明文，此前签名也不再可信（PDF 第 348 页）。\n<\/li><li>\n边界二：真正撤销一个密钥（宣布此后失效）很困难，撤销仍需配套机制。\n<\/li><li>\n失败案例：把公钥公开理解成身份无需核实。公钥是否真属于对方要靠证书与权威背书；否则中间人可用自己公钥顶替。\n<\/li><li>\n边界三：前向保密（forward secrecy）让每条独立消息用一次性密码、用过即弃；即使后来拿到私钥也无法破译旧消息（PDF 第 348 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>公钥 vs 私钥<\/strong>：公钥可公开，用于加密给本人的消息或验证本人签名；私钥保密，用于解密收到的消息或签署发出的消息。\n<\/li><li>\n<strong>加密 vs 签名<\/strong>：加密用对方公钥，保证只有对方能读；签名用自己私钥，保证内容出自本人。\n<\/li><li>\n<strong>公钥算法 vs 对称算法<\/strong>：公钥解决分发与认证、速度慢；对称速度快，前提是已共享密钥；真实系统二者分工组合。\n<\/li><li>\n<strong>RSA 因子分解 vs AES 密钥空间<\/strong>：RSA 依托分解大合数的难度；AES 依托密钥空间穷举成本；两类难题性质不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c11 的密钥分发与增生难题是公钥方案的动机；c02 位宽决定密钥长度量级。后继：c10 的 <code>https<\/code> 是混合加密与证书校验的落地；c13 云服务把数据交托给平台时，加密保护传输环节，身份与信任仍依赖证书与第三方机构。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（公钥加密：密钥对、分发问题与对称/非对称分工）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：密钥对的数学关联、混合协议时序，与签名/证书的完整流程<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把公钥加密讲成可推演过程，先往回追四层前提：<\/p>\n<ol><li>\n<strong>对称方案卡在第一把密钥的交付<\/strong>。双方要先共享同一密钥，但网络不可信，直接传密钥等于把门户交给中间人；分发与增生难题在算法内部无解（c11）。\n<\/li><li>\n<strong>存在一个「单向不可逆」的数学难题<\/strong>。从公开信息很难反推秘密信息；难题越难，密钥对越稳。RSA 依托大整数分解难度，是这类难题的代表。\n<\/li><li>\n<strong>两个密钥能互逆配对<\/strong>。一对数学关联的整数，一把锁、一把开；公钥可公开，私钥必须保密。\n<\/li><li>\n<strong>信任需要第三方背书<\/strong>。公钥是否真属于对方，不能靠口头声明；证书由权威机构签署，浏览器用机构公钥核验。\n<\/ol>\n<p>依赖链方向：难题构造 → 密钥对生成 → 公钥分发/私钥保管 → 加密或签名流程 → 混合协议协商会话密钥 → 证书核验身份。链条每一层都回答「谁能解开、谁能签发、凭什么相信」。<\/p>\n<h2>正向推导一：密钥对与单向加密流程<\/h2>\n<h3>第一步：生成密钥对<\/h3>\n<p>算法生成一对数学关联的整数：公钥 <span class=\"katex-inline\">P<\/span> 与私钥 <span class=\"katex-inline\">S<\/span>。性质：用 <span class=\"katex-inline\">P<\/span> 加密的消息只能用 <span class=\"katex-inline\">S<\/span> 解密，用 <span class=\"katex-inline\">S<\/span> 加密的消息只能用 <span class=\"katex-inline\">P<\/span> 解密，反之亦然（PDF 第 345 页）。<\/p>\n<h3>第二步：公钥公开，私钥保管<\/h3>\n<p>公钥公布在网站上，任何人可取；私钥只有主人知道，绝不外传。密钥足够长时，蛮力攻击和从一个密钥推算另一个密钥都徒劳；破解时间随密钥加长呈指数型增长（PDF 第 345 页）。<\/p>\n<h3>第三步：Alice 给 Bob 发保密消息<\/h3>\n<p>Alice 先取 Bob 的公钥 <span class=\"katex-inline\">P_B<\/span>，用它加密消息；密文发到网络。Eve 偷听，只能看到有消息发出、知道通信双方是谁，看不到内容（图 12-2，PDF 第 346 页）。<\/p>\n<h3>第四步：Bob 私钥解密<\/h3>\n<p>Bob 收到密文，用自己的私钥 <span class=\"katex-inline\">S_B<\/span> 解密；只有 <span class=\"katex-inline\">S_B<\/span> 能解开 <span class=\"katex-inline\">P_B<\/span> 加密的消息。私钥不在网络上传输，中间人拿不到。<\/p>\n<h3>第五步：反向回信<\/h3>\n<p>Bob 回信用 Alice 的公钥 <span class=\"katex-inline\">P_A<\/span> 加密；Alice 用自己的私钥 <span class=\"katex-inline\">S_A<\/span> 解开。双方不必事先商定，也不需要交换任何共享密钥，甚至不需要认识对方（PDF 第 346 页）。<\/p>\n<h2>正向推导二：混合协议的时序<\/h2>\n<h3>第六步：公钥协商临时会话密钥<\/h3>\n<p>直接用 AES 不可能：双方之间没有共享密钥。浏览器访问购物网站时，先随机生成一个临时口令（会话密钥），用网站公钥加密后传过去（PDF 第 347 页）。<\/p>\n<h3>第七步：对方私钥解出会话密钥<\/h3>\n<p>网站用私钥解出临时口令；此后浏览器与网站都持有这把对称会话密钥。<\/p>\n<h3>第八步：AES 传批量数据<\/h3>\n<p>双方用这把会话口令在 AES 算法中加密传送信用卡号等批量信息。公钥算法只承担很短的密钥协商片段，批量流量走效率高的对称算法。<\/p>\n<h3>第九步：为什么分工<\/h3>\n<p>公钥算法运算速度比 AES 慢好几个数量级；全量数据走公钥算法不现实。两步走：公钥加密协商临时会话密钥，AES 加密后续批量数据（PDF 第 347 页）。浏览器显示 HTTPS 协议连接和门锁图标，即表示这个连接经过加密。<\/p>\n<h2>正向推导三：数字签名与身份核验<\/h2>\n<h3>第十步：签名方向反转<\/h3>\n<p>Alice 要让收信人确认消息出自本人：先用自己的私钥 <span class=\"katex-inline\">S_A<\/span> 对消息加密，结果公布出去；任何人都能用 Alice 的公钥 <span class=\"katex-inline\">P_A<\/span> 解密。除 Alice 外没人知道她的私钥，能被 <span class=\"katex-inline\">P_A<\/span> 解开就断定消息由 Alice 加密过；前提是她的私钥没有泄露（PDF 第 347 页）。<\/p>\n<h3>第十一步：既保密又认证<\/h3>\n<p>Alice 给 Bob 发私人消息：先用 Bob 公钥 <span class=\"katex-inline\">P_B<\/span> 加密保密，再用自己私钥 <span class=\"katex-inline\">S_A<\/span> 签署加密结果。Eve 只能看到发了信息；Bob 先用 <span class=\"katex-inline\">P_A<\/span> 验证消息确实来自 Alice，再用 <span class=\"katex-inline\">S_B<\/span> 解开密文（PDF 第 348 页）。<\/p>\n<h3>第十二步：摘要替代直接签名<\/h3>\n<p>公钥算法慢，一般不直接对整份文档签名，而是签署从原始文档提取的小得多的文档——消息摘要。散列算法把任意输入比特流变换成固定长度比特流；找不到别的输入生成同样摘要；输入最轻微改变都会让输出约一半位变化；比对双方摘要即可检测篡改（PDF 第 349 页）。<\/p>\n<h3>第十三步：证书核验身份<\/h3>\n<p>买书时要确认对面是亚马逊而非冒牌货。网站发送由独立权威机构签署的证书，证明它的身份；浏览器用权威机构发布的公钥检查网站证书，确认它属于亚马逊而不是其他机构（PDF 第 350 页）。没有这层核验，公钥本身可能被中间人顶替。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：RSA 大数与质因子<\/h3>\n<p>RSA 生成一个很大的整数（原书举例长度约 500 位），由两个质因子相乘得到，每个质因子长度约为乘积的一半；私钥主人掌握这两个质因子，可迅速解密；攻击者要先分解质因子（PDF 第 348 页）。<\/p>\n<h3>算例 2：因子分解竞赛量级<\/h3>\n<p>RSA 实验室分解因式大赛 1991 年办到 2007 年；最小的 100 位合数很快被分解；2007 年停办时分解出的最大合数为 193 位（二进制 640 位），奖金 2 万美元（PDF 第 349 页）。分解难度随数位增长快速上升。<\/p>\n<h3>算例 3：散列长度对照<\/h3>\n<p>MD5 由李维斯特开发，结果 128 位；SHA-1 来自 NIST，结果 160 位；MD5 与 SHA-1 使用中都出现弱点，现在被弃用；SHA-2 没有已知弱点；2015 年公开竞赛获胜算法 SHA-3；SHA-2 与 SHA-3 提供 224～512 位密钥范围（PDF 第 350 页）。<\/p>\n<h3>算例 4：输入微动、输出大变<\/h3>\n<p>ASCII 中字母 x 和 X 只差一个位：八进制 78 与 58，二进制 01111000 与 01011000。MD5 散列后 128 位中有 66 位不同；想找到与任一散列值相同的另一输入基本不可能，也无法从散列值反推最初输入（PDF 第 349–350 页）。<\/p>\n<h3>算例 5：混合协议的数据分工<\/h3>\n<p>协商阶段：一把临时会话密钥，经公钥算法加密传送；批量阶段：整段页面、表单、卡号经 AES 用会话密钥加密。公钥流量占比很小，对称流量占比很大。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>没有公钥方案<\/strong>：初次通信只能先靠不可信渠道送共享密钥；密钥分发难题无解，网络陌生人之间无法建立保密通道。\n<\/li><li>\n<strong>全量数据走公钥算法<\/strong>：公钥比对称算法慢好几个数量级，页面与表单传输拖到不可用；混合分工正是用对称速度换取批量效率。\n<\/li><li>\n<strong>私钥泄露<\/strong>：此前发给本人的消息形同明文，此前的签名也不再可信；密钥必须按有效期管理，并配套撤销机制（PDF 第 348 页）。\n<\/li><li>\n<strong>网站公钥无人背书<\/strong>：中间人可把自己的公钥冒充成网站公钥，对话被转接到冒牌货；证书与权威机构核验是身份防顶替的环节。\n<\/li><li>\n<strong>每条消息长期复用同一密钥<\/strong>：一旦密钥泄露，历史消息全部暴露；前向保密让每条独立消息用一次性密码、用过即弃，即使后来拿到私钥也无法破译旧消息（PDF 第 348 页）。\n<\/ul>\n<h2>延伸层：散列、证书与信任链条<\/h2>\n<p>散列摘要把大文档压成固定长度指纹，支撑签名与完整性检测；MD5/SHA-1 因弱点被弃用，说明密码学方案会随攻击进展换代。证书把「公钥属于谁」托付给权威第三方；浏览器内置机构公钥完成核验。整套体系仍需一定程度信任支撑：信任某权威机构、信任私钥保管、信任协议实现没有人工错误。云服务场景（c13）下，加密保护传输链路，却不免除平台方对数据的可见性与留存。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出密钥对的互逆性质，并说明公钥、私钥各自如何保管。\n<\/li><li>\n描述 Alice→Bob 保密消息的完整流程，Eve 能看到什么、看不到什么。\n<\/li><li>\n混合协议为什么先用公钥协商会话密钥、再用 AES 传批量数据？\n<\/li><li>\n数字签名与保密加密在使用谁的密钥上有何不同？既要保密又要认证时怎么组合？\n<\/li><li>\nRSA 可靠性依托什么数学难题？证书由谁签署、浏览器用什么核验？\n<\/ol>\n<h2>再推一层：密钥对互逆性、混合协议时序，与签名/证书流程<\/h2>\n<h3>密钥对的数学关联<\/h3>\n<p>公钥 <span class=\"katex-inline\">P<\/span> 与私钥 <span class=\"katex-inline\">S<\/span> 是数学关联的整数：用 <span class=\"katex-inline\">P<\/span> 加密的消息只能用 <span class=\"katex-inline\">S<\/span> 解密，用 <span class=\"katex-inline\">S<\/span> 加密的消息只能用 <span class=\"katex-inline\">P<\/span> 解密，反之亦然。密钥足够长时，蛮力攻击和从一个密钥推算另一个密钥都徒劳；破解时间随密钥加长呈指数型增长（PDF 第 345 页）。公钥公布在网站上任何人可取，私钥只有主人知道。<\/p>\n<h3>单向通信走查<\/h3>\n<p>Alice 取 Bob 公钥 <span class=\"katex-inline\">P_B<\/span>，用它把消息 <span class=\"katex-inline\">M<\/span> 加密成密文 <span class=\"katex-inline\">C=E_{P_B}(M)<\/span>；<span class=\"katex-inline\">C<\/span> 经可被窃听的信道发出，Eve 截获 <span class=\"katex-inline\">C<\/span> 但没有 <span class=\"katex-inline\">S_B<\/span>，无法解密；Bob 收到后用 <span class=\"katex-inline\">S_B<\/span> 解密得 <span class=\"katex-inline\">M=D_{S_B}(C)<\/span>。反向回信：Bob 用 Alice 公钥 <span class=\"katex-inline\">P_A<\/span> 加密，Alice 用自己私钥 <span class=\"katex-inline\">S_A<\/span> 解开。双方不必事先商定，也不需要交换任何共享密钥，甚至不需要认识（PDF 第 346 页）。<\/p>\n<h3>混合协议分工<\/h3>\n<p>公钥算法运算速度比 AES 慢好几个数量级，全量数据走公钥不现实。浏览器先随机生成临时会话密钥，用网站公钥加密后传出；网站私钥解出会话密钥；此后双方用这把口令在 AES 中加密批量数据（PDF 第 347 页）。公钥只承担很短的密钥协商片段，批量流量走高效对称算法。浏览器显示 HTTPS 与门锁图标即表示连接经过加密。<\/p>\n<h3>签名与组合用途<\/h3>\n<p>签名方向反转：Alice 先用自己私钥 <span class=\"katex-inline\">S_A<\/span> 对消息加密，结果公布；任何人用 Alice 公钥 <span class=\"katex-inline\">P_A<\/span> 解密。除 Alice 外没人知道她的私钥，能被 <span class=\"katex-inline\">P_A<\/span> 解开就断定消息由 Alice 加密过；前提是私钥没有泄露（PDF 第 347 页）。既要保密又要认证：Alice 先用 Bob 公钥 <span class=\"katex-inline\">P_B<\/span> 加密，再用自己私钥 <span class=\"katex-inline\">S_A<\/span> 签署；Bob 先用 <span class=\"katex-inline\">P_A<\/span> 验证来自 Alice，再用 <span class=\"katex-inline\">S_B<\/span> 解开密文。<\/p>\n<h3>RSA 难题与散列<\/h3>\n<p>RSA 由 Rivest、Shamir、Adleman 于 1978 年发明，三人获 2002 年图灵奖；可靠性来自对巨大合数做因数分解的难度。生成一个很大的整数（如长度约 500 位），由两个质因子相乘，每个质因子约为乘积一半长度；掌握质因子的私钥主人能迅速解密，其他人要解密就得先分解质因子（PDF 第 348 页）。RSA 实验室分解大赛 1991 年办到 2007 年，停办时分解出的最大合数 193 位（二进制 640 位），奖金 2 万美元（PDF 第 349 页）。公钥算法慢，一般签署从原始文档提取的小得多的消息摘要；散列把任意输入换成固定长度比特流，找不到别的输入生成同样摘要，输入轻微改变约一半位变化。MD5 结果 128 位、SHA-1 结果 160 位，二者已现弱点被弃用；SHA-2 无已知弱点，SHA-3 为 2015 年竞赛获胜者，SHA-2/SHA-3 提供 224～512 位范围（PDF 第 350 页）。<\/p>\n<h3>证书核验<\/h3>\n<p>买书时要确定对面是亚马逊而非冒牌货。网站发送由独立权威机构签署的证书证明身份；浏览器用权威机构发布的公钥检查网站证书，确认它属于亚马逊而不是其他机构（PDF 第 350 页）。没有这层核验，公钥可能被中间人顶替。私钥泄露后，此前发给本人的消息形同明文，此前签名也不再可信；密钥撤销很困难，前向保密让每条独立消息用一次性密码、用过即弃。<\/p>\n<h2>补足推导：RSA 模幂链、分解难题与混合加密分工<\/h2>\n<h3>RSA 的参数链<\/h3>\n<p>取两个大质数 <span class=\"katex-inline\">p,q<\/span>，令 <span class=\"katex-inline\">n=pq<\/span>；欧拉函数 <span class=\"katex-inline\">\\varphi(n)=(p-1)(q-1)<\/span>。选公钥指数 <span class=\"katex-inline\">e<\/span> 与 <span class=\"katex-inline\">\\varphi(n)<\/span> 互质，再求私钥指数 <span class=\"katex-inline\">d<\/span> 使 <span class=\"katex-inline\">ed\\equiv1\\pmod{\\varphi(n)}<\/span>。加密 <span class=\"katex-inline\">c\\equiv m^e\\pmod n<\/span>，解密 <span class=\"katex-inline\">m\\equiv c^d\\pmod n<\/span>。掌握 <span class=\"katex-inline\">p,q<\/span> 的私钥主人能算出 <span class=\"katex-inline\">\\varphi(n)<\/span> 与 <span class=\"katex-inline\">d<\/span>；攻击者只拿到公钥 <span class=\"katex-inline\">(e,n)<\/span>，要解密必须先分解 <span class=\"katex-inline\">n<\/span> 得到质因子。<\/p>\n<h3>分解难度与模幂实现<\/h3>\n<p>两个大质数相乘容易，把合数拆回质因子的计算量随数位增长快速上升，密钥越长分解工作量越大。大指数运算不靠直接连乘，而靠反复平方并逐次取模，把指数按二进制分解成平方与相乘步骤；即便如此，公钥算法仍比 AES 慢好几个数量级。<\/p>\n<h3>混合分工的边界<\/h3>\n<p>真实协议分两步：先用公钥协商出临时会话密钥，再用 AES 加密批量数据。这样公钥只解决初次通信的密钥协商与身份签名，大批量吞吐交给对称算法。数字签名方向相反：用自己私钥签署，任何人用公钥验证；前提是私钥未泄露。若拿到的公钥并非对方所有，中间人可用自己公钥顶替，因此公钥归属要靠权威证书背书；分解难题当前无多项式算法、证书链可信任，是整套方案成立的两条外部前提。<\/p><\/div><\/details>", "kind": "concept", "title": "公钥加密：密钥对、分发问题与对称/非对称分工"}, "c13": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.330<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c10\">因特网协议栈与万维网：域名/IP/路由/TCP、URL/HTML/CSS<\/a><\/span><\/div><h1>数据收集、跟踪与云计算：画像机制与信任边界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 4 章（原书第 11 章 数据与信息、11.5 云计算，PDF 第 315–335 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>程序和数据存在本机，跨设备传文件要自己想办法；放到服务器上共享方便，但数据交给了谁、谁能看、何时被调取成了新问题。页面还会从几十个服务器下载 cookie、图片和脚本，第三方据此拼出浏览画像。这个概念分两条线：云计算把计算负载与存储从本机转到服务器端的条件与收益；跟踪、画像、聚合与再识别机制，以及加密只保护传输内容、不保护元数据与平台可见性的边界。落点是说清「信任边界画在哪」。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>本地计算模型<\/strong>：程序及数据保存在自己计算机中；换机器用同一文件得自己传过去，不同平台还要分别购买程序（PDF 第 330 页）。<\/p>\n<p><strong>云计算（cloud computing）<\/strong>：用浏览器访问和操作因特网服务器上保存的信息，信息保存在「云端」即服务商服务器上（图 11-5，PDF 第 331 页）。邮件、社交、网盘、在线日历与在线文档都是云服务。<\/p>\n<p><strong>云成立的条件<\/strong>：个人算力变强，浏览器能高效运行显示程序，客户端语言是解释型 JavaScript；带宽与延迟明显改善；大量数据可放服务器，体系也适用于手机（PDF 第 331 页）。在线文档支持多用户并发与同步更新（PDF 第 332 页）。<\/p>\n<p><strong>cookie 与第三方跟踪<\/strong>：网页可引用任何域的图片，图像 URL 编码进请求页面的标识；取图时提供图片的域知道你访问过哪个页面，可在本机存放该域 cookie；JavaScript 脚本按同样方式运转（PDF 第 315 页）。实验：访问 toyota.com 初始从 79 个服务器下载 200 多个 cookie、图片、脚本，合计超 4MB，部分 cookie 有效期长达几年（图 11-4，PDF 第 315 页）。<\/p>\n<p><strong>网页信标（web bug）<\/strong>：1 像素、无边框、可能透明的图，页面上看不见，唯一用途是跟踪；请求它时跟踪方知道你在读特定页面，可存 cookie，跨站记录浏览特性（PDF 第 316 页）。<\/p>\n<p><strong>浏览器指纹<\/strong>：不靠 cookie，靠操作系统、浏览器版本、语言偏好、字体、插件等特征组合识别；HTML5 画布指纹生成特定字符序列，几个信号即可在无 cookie 下区分个人（PDF 第 318 页）。<\/p>\n<p><strong>画像与推断<\/strong>：访问网页越多，跟踪方对性格爱好的记录越详细，可能推断年龄、婚姻状况、车辆、居住区域和工作单位，从而识别到个人（PDF 第 317 页）。社交网络的显式和隐性连接还可预测性别、性取向和政治倾向。<\/p>\n<p><strong>元数据（metadata）<\/strong>：通信对象、何时拨出、通话时长这类元数据，即使不知道内容，组合后也能披露亲密关系、就医轨迹、联系网络（PDF 第 324 页）。<\/p>\n<p><strong>再识别（re-identification）<\/strong>：删除身份信息可降低识别度，但多来源组合很可能挖掘出更多身份特征；某些来源连提供者自己都不知道（PDF 第 301 页前后）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>云负载转移：客户端 JavaScript 要求浏览器快速刷新图形、响应拖放与服务器端更新；服务器端高带宽承担大量存储与并发同步。浏览器适配判断可放到服务器端，只发适配代码（PDF 第 333 页）。<\/p>\n<p>跟踪链路：页面加载 → 第三方域图片/脚本被请求 → 请求携带页面标识与既有 cookie → 第三方记录访问 → 跨站汇总成画像。广告中介在零点几秒内把浏览者信息连同空位发给客户竞价，胜出广告插入页面（PDF 第 319 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：云服务依赖客户端算力、浏览器能力、JavaScript 执行与带宽延迟改善；跟踪依赖第三方域能嵌入页面、cookie 可持久化、跨站可汇总。\n<\/li><li>\n边界一：加密只保护传输内容。HTTPS 端到端加密保护内容不被检查或修改，但无法隐藏元数据（PDF 第 323 页）。\n<\/li><li>\n边界二：匿名化不等于不可识别。AOL 2006 年公布 65 万用户 2000 万条匿名查询日志，每条带随机唯一标识符，结合搜索内容仍易确定身份（PDF 第 300 页前后）。\n<\/li><li>\n失败案例一：以为关了 cookie 就无法被识别。浏览器指纹、画布指纹不依赖 cookie；匿名模式只清本机历史与 cookie，已存特征再访问仍可匹配（PDF 第 320 页）。\n<\/li><li>\n失败案例二：把云服务当本地存储等价物。云端数据由服务商保管，访问、调取、担责与强制公开属于技术之外的法律与信任问题（PDF 第 334 页）。\n<\/li><li>\n边界三：DNT 只是请求加一条 HTTP 头部，站点可自愿忽视；规避跟踪可关第三方 cookie、用屏蔽插件，但要付兼容性代价（PDF 第 319–320 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>本地 vs 云模型<\/strong>：本地程序数据在本机、跨设备自行传文件；云模型数据在服务器、浏览器访问，软件始终最新，数据实时备份。\n<\/li><li>\n<strong>第一方 vs 第三方 cookie<\/strong>：第一方服务本站登录；第三方由嵌入页面的跟踪域设置，跨站汇总画像，可关闭而不影响多数站点。\n<\/li><li>\n<strong>内容加密 vs 元数据保护<\/strong>：HTTPS 隐藏报文内容，不隐藏通信双方、时间、流量等元数据。\n<\/li><li>\n<strong>匿名化 vs 再识别<\/strong>：去掉直接标识降低单表识别度；多源交叉可重新锁定个人。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c10 协议栈与浏览器加载流程是跟踪嵌入的技术通道；c11、c12 加密保护这条通道的内容段。后继：本章是硬件、软件、网络机制在数据与隐私层面的收口，风险哪些由技术解决、哪些只能靠制度与信任安排。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（数据收集、跟踪与云计算：画像机制与信任边界）<\/summary><div class=\"depth-body\"><h1>c13 深度推导：云负载的转移路径，跟踪画像的拼接链条，与再识别的交叉推算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把数据收集、跟踪和云计算讲成可推演过程，先往回追四层前提：<\/p>\n<ol><li>\n<strong>数据先有存放位置<\/strong>。本地模型把程序和数据放在本机，跨设备要手动传递；云模型把数据放到服务器，经浏览器访问。存放位置决定了谁掌握数据。\n<\/li><li>\n<strong>页面加载会引入第三方资源<\/strong>。网页可引用任何域的图片、脚本；第三方域在被请求时拿到页面标识和 cookie，这是跨站跟踪的技术通道（c10）。\n<\/li><li>\n<strong>识别可以不依赖直接身份<\/strong>。cookie、浏览器特征、画布指纹、元数据、社交连接都是间接信号；多源信号交叉能拼出画像甚至锁定个人。\n<\/li><li>\n<strong>技术能力有其边界<\/strong>。加密保护报文内容，不保护元数据；匿名化降低单表识别度，挡不住多源交叉；平台可见性与调取权限属于法律和信任安排。\n<\/ol>\n<p>依赖链方向：本地/云存放选择 → 浏览器取数 → 第三方嵌入与信号收集 → 跨站汇总画像 → 多源交叉再识别；信任边界在「平台、机构、法律辖区」三处分别划定。<\/p>\n<h2>正向推导一：从本地模型到云模型的转移<\/h2>\n<h3>第一步：本地模型的负担<\/h3>\n<p>本地模型下，文档、账目、照片软件都在自己电脑上运行；改完文件想在另一台机器用，得自己传；Windows PC 与 Mac 要分别购买程序；手机也不属于这些系统（PDF 第 330 页）。<\/p>\n<h3>第二步：云模型的访问方式<\/h3>\n<p>用浏览器访问和操作因特网服务器上保存的信息。邮件不必下载到本地文件系统，存在服务器即可；社交联系和照片存在 Facebook 等服务上，而不是手机里；服务几乎全免费，成本是看邮件或登录动态时看到的广告（PDF 第 330–331 页）。<\/p>\n<h3>第三步：云成立的条件<\/h3>\n<p>个人计算机能力变强；浏览器能高效运行大量显示需求的大型程序，编程语言仍是解释型 JavaScript；服务器到客户机的带宽和延迟相比 10 年前明显改善，快速取回数据有保障；大量数据可放服务器，体系也适用于手机，有时不必再下载应用（PDF 第 331 页）。<\/p>\n<h3>第四步：负载在两端之间分配<\/h3>\n<p>客户端 JavaScript 代码要求浏览器快速刷新图形显示，对拖放等操作和服务器端更新迅速响应；服务器端承担高带宽、大量存储和多用户并发同步。判断客户端浏览器类型这类逻辑可以放服务器，只下发适配代码，保证代码尽可能少、运行尽可能快（PDF 第 333 页）。<\/p>\n<h3>第五步：云办公并发<\/h3>\n<p>Google Docs 含文字处理、电子表格和 PPT，基本可与 Microsoft Office 竞争，支持多用户并发访问和同步更新；文档只有一份，不在多个电脑里保存多个不一致版本（PDF 第 332、334 页）。<\/p>\n<h2>正向推导二：跟踪与画像的拼接链条<\/h2>\n<h3>第六步：第三方资源被请求<\/h3>\n<p>网页引用的图片可来自任何域；图像 URL 把请求页面的标识编码进去。浏览器取图片时，提供图片的域知道你访问过哪个页面，并可在本机存放该域 cookie、收到此前访问生成的 cookie；JavaScript 脚本按同样方式运转（PDF 第 315 页）。<\/p>\n<h3>第七步：像素信标记录访问<\/h3>\n<p><code>&lt;img&gt;<\/code> 标签从跟踪域取一幅长宽各 1 像素、无边框、可能透明的图；页面上看不见。浏览器请求这幅图时，跟踪方知道你正在阅读某特定页面，允许的话存 cookie；访问其他也用该跟踪方的网站时，它开始记录浏览特性（PDF 第 316 页）。<\/p>\n<h3>第八步：跨站汇总成画像<\/h3>\n<p>你访问的网页越多，跟踪方在性格和爱好上的数据库越详细，可能推断出年龄、婚姻状况、车辆、居住区域、工作单位；即便多数公司声称不这么做，从某种程度也能对这个人识别（PDF 第 317 页）。点赞按钮给供应商发送 cookie 的机会，单击后发回偏好信息。<\/p>\n<h3>第九步：广告竞价插入<\/h3>\n<p>请求网页时，发布者通知广告位中介有一个空位待售，连同浏览者信息（年龄段、居住城市、科技和餐馆偏好等）一起发出；广告客户竞价，胜出广告插入页面；整个过程只有零点几秒（PDF 第 319 页）。<\/p>\n<h3>第十步：无 cookie 识别路线<\/h3>\n<p>浏览器指纹结合操作系统、浏览器、版本号、语言偏好、字体和插件等特征，通常独一无二；HTML5 画布指纹生成特定字符序列；拿到几个识别信号，不需要 cookie 也能区分识别某个人（PDF 第 318 页）。<\/p>\n<h2>正向推导三：元数据与多源再识别<\/h2>\n<h3>第十一步：元数据披露关系<\/h3>\n<p>即使不知道双方谈了什么，通信对象、时间、时长这类元数据也能反映关系：深夜频繁通话的两人关系密切，通话减少可能关系结束；一段时间联系一次不如每周联系亲密。一通电话序列可以拼出就医、咨询等故事线（PDF 第 324 页）。<\/p>\n<h3>第十二步：匿名化的局限<\/h3>\n<p>删除直接身份标识能降低单表识别度；但现实信息来源多方面，组合多源数据很可能挖出更多身份特征；某些来源的信息连提供者自己都不知道，将来也未必还能找得到（PDF 第 301 页前后）。<\/p>\n<h3>第十三步：AOL 查询日志案例<\/h3>\n<p>2006 年 8 月，AOL 出于研究目的公开三个多月、65 万用户的 2000 万条查询日志，做了匿名处理。每个查询带随机但唯一的标识符，据此能知道同一个人查过什么；不少人搜过自己的名字、地址、社会保险号，相关性分析暴露的信息比 AOL 以为的多；确定一些人的身份成为可能，日志很快传遍世界（PDF 第 300 页前后）。<\/p>\n<h3>第十四步：Sweeney 体检记录案例<\/h3>\n<p>1997 年，MIT 博士拉坦娅·斯威尼分析马萨诸塞州 135000 名雇员的体检记录，记录做了反识别处理，来源为州保险委员会，可用于研究甚至卖给私人公司。每条记录含生日、性别、邮政编码；她发现 6 个人生日是 1945 年 7 月 31 日，其中 3 个男性，只有 1 人住在坎布里奇；与公开选民登记名单对照，确认此人是时任州长威廉·韦尔德（PDF 第 301 页前后）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：单次页面的跟踪载荷<\/h3>\n<p>解除防御访问 toyota.com：初始访问从 79 个不同服务器下载超过 200 个 cookie、图片、脚本和其他内容，合计超过 4MB；有些 cookie 有效期长达几年（PDF 第 315 页）。启用正常防御后不收任何 cookie 或脚本，屏蔽 3 个 JavaScript 追踪器。<\/p>\n<h3>算例 2：定位特征收窄<\/h3>\n<p>体检记录里生日 1945-07-31 共 6 人 → 男性收窄到 3 人 → 邮编坎布里奇收窄到 1 人。生日、性别、邮编三个准标识符组合，就能对照公开名册锁定个人。<\/p>\n<h3>算例 3：广告过程时间尺度<\/h3>\n<p>广告发布、中介传讯、客户竞价、广告插入整个过程只有零点几秒（PDF 第 319 页）；跟踪与竞价在页面渲染同期完成。<\/p>\n<h3>算例 4：云服务清单<\/h3>\n<p>邮件：Gmail、Outlook；社交：Facebook、Instagram、Twitter、领英；存储：Dropbox；工具：在线日历；办公：Google Docs。数据分别存在对应服务商服务器上（PDF 第 331 页）。<\/p>\n<h3>算例 5：元数据信号种类<\/h3>\n<p>电话号码、何时拨出、通话时长；社交网络的显性和隐性连接；点赞与点击；IP 地址与 cookie；位置服务记录的停留地点。这些不必是内容本身，组合后仍可推断身份与倾向。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>所有数据只存本机<\/strong>：跨设备同步、多人协作、随时访问都要自建传递方案；云的实时备份、单文档多端协作和容量优势无法获得。\n<\/li><li>\n<strong>页面只引用第一方资源<\/strong>：第三方图片和脚本不被加载，跨站跟踪缺少固定身份锚点；但登录态、广告、嵌入内容等依赖第三方的功能也会受限。\n<\/li><li>\n<strong>关闭 cookie 就认为无法被识别<\/strong>：浏览器指纹、画布指纹不依赖 cookie；匿名模式只清本机痕迹，网站已存的特征仍可在再次访问时匹配。\n<\/li><li>\n<strong>匿名化处理后就断定安全<\/strong>：直接标识删除不等于身份不可重建；AOL 日志和体检记录都说明多源交叉可以再识别。\n<\/li><li>\n<strong>以为加密能盖住一切<\/strong>：HTTPS 端到端加密保护内容不被检查或修改，但元数据（通信双方、时间、流量）仍可见；深度包检测下内容与元数据要分开评估。\n<\/ul>\n<h2>延伸层：信任边界与制度安排<\/h2>\n<p>云计算把数据交托给平台，随之出现一组技术之外的问题：谁可以访问保存在云端的数据，什么情况下可以访问；信息意外泄露是否需要担责；谁有权强制公开数据；邮件服务商能否自愿或在法律诉讼胁迫下向政府机关公开通信记录，当事人是否知情（PDF 第 334 页）。这些问题部分涉技术、部分涉法律，答案取决于居住在哪个司法辖区。美国与欧盟对个人数据收集的规定宽严不同。技术能做的边界是：端到端加密保护内容、屏蔽插件减少跟踪、关闭第三方 cookie、匿名模式清理本机痕迹；身份核验、调取权限、数据留存与再识别防护，要靠制度、隐私政策和用户选择共同安排。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n本地模型与云模型在程序、数据存放和跨设备协作上的差别是什么？\n<\/li><li>\n云服务成为现实依赖哪几方面条件成熟？负载如何在客户端与服务器端分配？\n<\/li><li>\n写出第三方图片/脚本被请求时，跟踪方拿到哪些信号？像素信标为什么页面上看不见？\n<\/li><li>\n浏览器指纹不依赖 cookie，靠哪些特征组合识别个人？\n<\/li><li>\n匿名化为什么挡不住再识别？结合 AOL 日志或体检记录案例说明多源交叉的作用。\n<\/ol>\n<h2>再推一层：云负载两端分配，跟踪信号拼接链，与再识别交叉推算<\/h2>\n<h3>本地与云的存放差别<\/h3>\n<p>本地模型下程序和数据都在自己计算机：Word 写文档、表格记账、照片软件管照片；换机器用同一文件得自己传，Windows PC 与 Mac 要分别购买程序，手机也不属于这些系统（PDF 第 330 页）。云模型用浏览器访问服务器保存的信息：邮件存在服务器即可，社交联系和照片存在 Facebook 等服务上而不是手机里；服务几乎全免费，成本是看邮件和动态时看到的广告（PDF 第 330–331 页）。<\/p>\n<h3>云成立的条件与两端分工<\/h3>\n<p>个人计算机能力变强；浏览器能高效运行大量显示需求的大型程序，客户端编程语言仍是解释型 JavaScript；服务器到客户机的带宽和延迟相比 10 年前明显改善，快速取回数据有保障；大量数据可放服务器，体系也适用于手机，有时不必下载应用（PDF 第 331 页）。客户端 JavaScript 要求浏览器快速刷新图形显示，对拖放等操作和服务器端更新迅速响应；服务器端承担高带宽、大量存储和多用户并发同步。判断客户端浏览器类型这类逻辑可放服务器，只下发适配代码，保证代码尽可能少、运行尽可能快（PDF 第 333 页）。Google Docs 含文字处理、电子表格和演示程序，基本可与 Microsoft Office 竞争，支持多用户并发访问和同步更新（PDF 第 332 页）。<\/p>\n<h3>第三方跟踪拼接链<\/h3>\n<p>页面引用的图片可来自任何域，图像 URL 把请求页面的标识编码进去；浏览器取图片时，提供图片的域知道你访问过哪个页面，并可在本机存放该域 cookie、收到此前访问生成的 cookie；JavaScript 脚本按同样方式运转（PDF 第 315 页）。像素信标是长宽各 1 像素、无边框、可能透明的图，唯一用处是跟踪；浏览器请求这幅图时跟踪方知道你在读某页面，允许的话存 cookie，访问其他也用该跟踪方的网站时开始记录浏览特性（PDF 第 316 页）。广告竞价在页面渲染同期完成：发布者把空位连同浏览者信息发给中介，客户竞价，胜出广告插入，整个过程只有零点几秒（PDF 第 319 页）。<\/p>\n<h3>无 cookie 识别与元数据<\/h3>\n<p>浏览器指纹结合操作系统、浏览器、版本号、语言偏好、字体和插件等特征，通常独一无二；HTML5 画布指纹生成特定字符序列，拿到几个识别信号即可在不需要 cookie 的情况下区分个人（PDF 第 318 页）。元数据包括电话号码、何时拨出、通话时长；即使不知道谈了什么，通信对象、时间、频率也能反映亲密关系、就医轨迹和联系网络。社交网络的点赞按钮给供应商发送 cookie 机会，单击后发回偏好信息；显式和隐性连接可用于预测性别、种族背景、性取向和政治倾向。<\/p>\n<h3>再识别两个案例<\/h3>\n<p>AOL 2006 年公开三个多月、65 万用户的 2000 万条查询日志，做了匿名处理；每个查询带随机但唯一标识符，据此能知道同一个人查过什么；不少人搜过自己的名字、地址、社会保险号，相关性分析暴露的信息比预想多，确定身份成为可能，数据早已传遍世界（PDF 第 300 页前后）。1997 年 Sweeney 分析马萨诸塞州 135000 名雇员的体检记录，记录已反识别处理，含生日、性别、邮编；她发现 6 个人生日是 1945 年 7 月 31 日，其中 3 个男性，只有 1 人住坎布里奇；对照公开选民登记名单，确认此人是时任州长 William Weld（PDF 第 301 页前后）。生日、性别、邮编三个准标识符组合就能对照名册锁定个人。<\/p>\n<h3>信任边界划分<\/h3>\n<p>加密保护报文内容不被检查或修改，不隐藏元数据；匿名化降低单表识别度，挡不住多源交叉。云端数据由服务商保管，谁能访问、什么情况访问、泄露是否担责、谁有权强制公开，属于技术之外的法律与信任安排；答案取决于居住在哪个司法辖区。技术手段——端到端加密、屏蔽插件、关闭第三方 cookie、匿名模式——各有明确边界，身份核验、调取权限、留存与再识别防护要靠制度和用户选择共同安排。<\/p><\/div><\/details>", "kind": "concept", "title": "数据收集、跟踪与云计算：画像机制与信任边界"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：硬件与数据表示：计算机部件、位与二进制、模数转换、CPU 执行与缓存<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章）<\/a><br>检查点：能画出 CPU、RAM、二级存储、输入输出经总线相连的结构图，算出 8 位能表示的组合数，沿抽样率与量化位数算一段音频的数据量，走完一条指令的取指—译码—执行循环并解释缓存局部性<\/li><li class='path-step' id='path-02'><strong>步骤 02：软件：算法与复杂度、二分查找、排序、程序设计语言、编译与操作系统<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第二部分 软件：算法、程序设计语言与软件系统（原书第 4–7 章）<\/a><br>检查点：能写出线性遍历的步骤并指出除零等边界，按每次折半推出二分查找的比较次数，估算选择排序与快速排序在 N 个数据上的工作量，说明高级语言到位模式的编译链路，以及操作系统如何调度进程与管理资源<\/li><li class='path-step' id='path-03'><strong>步骤 03：通信：网络带宽与延迟、压缩、错误检测、因特网协议栈与万维网<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第三部分 通信：网络、因特网与万维网（原书第 8–10 章）<\/a><br>检查点：能区分链路瓶颈与光速传播延迟，比较无损与有损压缩；说出奇偶校验与 Luhn 校验覆盖的错误类型；沿域名→IP→路由→IP 包→TCP 流走通一次通信，拆解 URL 各字段并说清 HTML/CSS 与编程语言的差别<\/li><li class='path-step' id='path-04'><strong>步骤 04：数据、隐私与安全：对称加密、公钥加密、数据跟踪与云计算<\/strong><br>阅读：<a href=\"#/chapter/ch04\">数据、隐私与安全：数据与信息、隐私与安全（原书第 11–12 章，含第 10 章网络安全部分）<\/a><br>检查点：能写出密钥空间随位数指数增长的估算式，对比 DES 与 AES 的密钥长度后果；解释公钥/私钥配对关系与分发问题，说出对称与公钥各自适合的场景；梳理搜索、跟踪、画像与云存储把数据交托给了谁，以及加密只解决传输安全的边界<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='cpu（中央处理单元，central processing unit）'>CPU（中央处理单元，Central Processing Unit） — 执行算术运算、数据移动并控制其他组件操作的处理器；按内部时钟节拍工作，速度以赫兹、兆赫或千兆赫计量（原书 1.1.1 节，PDF 第 38–39 页） <span class=glossary-ref>（第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章））<\/span><\/li><li data-term='ram（随机存取存储器，random access memory）'>RAM（随机存取存储器，Random Access Memory） — 存储当前运行程序的指令与数据的初级内存；CPU 可按任意次序快速访问其中任意位置，内容可改写（原书 1.1.2 节，PDF 第 40 页） <span class=glossary-ref>（第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章））<\/span><\/li><li data-term='总线（bus）'>总线（bus） — 把处理器、内存、二级存储与输入输出部件连接在一起、互相传输信息的一组电缆（原书 1.1 节，PDF 第 37 页） <span class=glossary-ref>（第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章））<\/span><\/li><li data-term='位（bit）'>位（bit） — 表示数字信息的最基本单位，取值只有 0 或 1；N 位可表示 $2^N$ 种组合（原书 2.3.1 节，PDF 第 64–65 页） <span class=glossary-ref>（第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章））<\/span><\/li><li data-term='字节（byte）'>字节（byte） — 成组的位，通常 8 位构成一个字节，用来表示一个字符或一段数值（原书 2.3.4 节，PDF 第 69 页前后） <span class=glossary-ref>（第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章））<\/span><\/li><li data-term='模数转换（a/d 转换）'>模数转换（A/D 转换） — 把声音、图像等连续模拟量按固定间隔采样、再量化成离散数值的过程；反向把数值变回模拟量称为数模转换（D/A）（原书 2.2 节，PDF 第 60–61 页） <span class=glossary-ref>（第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章））<\/span><\/li><li data-term='缓存（cache）'>缓存（cache） — 容量较小但速度较快的存储层，保存最近使用的信息及其邻近块，以避免访问更慢的下层存储；依据时间与空间局部性提速（原书 3.3 节，PDF 第 89–90 页） <span class=glossary-ref>（第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章））<\/span><\/li><li data-term='算法（algorithm）'>算法（algorithm） — 用含义完整定义的基本操作写出的一系列步骤，覆盖所有可能输入，并保证在有限步后终止；运算效率随数据量增长的方式是算法分析的核心（原书第 4 章，PDF 第 103 页） <span class=glossary-ref>（第二部分 软件：算法、程序设计语言与软件系统（原书第 4–7 章））<\/span><\/li><li data-term='二分查找（binary search）'>二分查找（binary search） — 在已排序列表中每次比较中点、舍弃一半候选的搜索法；比较次数为以 2 为底 N 的对数（原书 4.2 节，PDF 第 107–108 页） <span class=glossary-ref>（第二部分 软件：算法、程序设计语言与软件系统（原书第 4–7 章））<\/span><\/li><li data-term='编译器（compiler）'>编译器（compiler） — 把高级语言程序翻译为目标处理器汇编指令的翻译程序；常分为负责生成中间形式的前端与负责生成不同体系结构指令的后端（原书 5.2 节，PDF 第 124–126 页） <span class=glossary-ref>（第二部分 软件：算法、程序设计语言与软件系统（原书第 4–7 章））<\/span><\/li><li data-term='操作系统（operating system）'>操作系统（operating system） — 管理计算机硬件资源、调度与协调运行中程序的后台程序；负责 CPU 分配、内存与磁盘管理、设备驱动与文件系统（原书 6.1 节，PDF 第 155–157 页） <span class=glossary-ref>（第二部分 软件：算法、程序设计语言与软件系统（原书第 4–7 章））<\/span><\/li><li data-term='带宽（bandwidth）'>带宽（bandwidth） — 链路每秒能传输的数据量；数据流速度取决于路径上许可速度最低的环节（原书 8.6 节，PDF 第 228–229 页） <span class=glossary-ref>（第三部分 通信：网络、因特网与万维网（原书第 8–10 章））<\/span><\/li><li data-term='奇偶校验位（parity bit）'>奇偶校验位（parity bit） — 附在一组位末尾的冗余位，使整组中 1 的个数为偶或为奇；可检出单个位出错，检不出同时两位出错（原书 8.8 节，PDF 第 234 页） <span class=glossary-ref>（第三部分 通信：网络、因特网与万维网（原书第 8–10 章））<\/span><\/li><li data-term='ip（因特网协议，internet protocol）'>IP（因特网协议，Internet Protocol） — 定义单个数据包格式与传输方式的无连接、不可靠、尽力而为协议；IPv6 源目地址为 128 位；TTL 字段每跳减 1，到 0 丢弃（原书 9.4.1 节，PDF 第 254–255 页） <span class=glossary-ref>（第三部分 通信：网络、因特网与万维网（原书第 8–10 章））<\/span><\/li><li data-term='tcp（传输控制协议，transmission control protocol）'>TCP（传输控制协议，Transmission Control Protocol） — 在不可靠 IP 之上把字节流切分成报文段、附带序列号，提供可靠双向数据流的高层协议（原书 9.4.2 节，PDF 第 255 页） <span class=glossary-ref>（第三部分 通信：网络、因特网与万维网（原书第 8–10 章））<\/span><\/li><li data-term='公钥加密（public-key encryption）'>公钥加密（public-key encryption） — 每个用户持有数学关联的密钥对：公钥公开、私钥保密；一把密钥加密的消息只能用另一把解密，解决对称加密的密钥分发难题（原书 12.1.2 节，PDF 第 345 页） <span class=glossary-ref>（数据、隐私与安全：数据与信息、隐私与安全（原书第 11–12 章，含第 10 章网络安全部分））<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库<\/h1>\n<h2>模式 1：先按职责对号入座，再谈物理实现<\/h2>\n<p>看一台计算机或一个新设备，先把部件归到处理器、内存、二级存储、输入输出、总线五类职责，再谈芯片工艺、外观和形态差异。手机把键鼠屏融合成一块触摸屏，超算横向放大处理器与内存数量，职责划分不变。跳过职责直接讨论工艺，容易把传感器与输出部件混淆，也解释不了为什么更换 RAM 中的指令就能让同一硬件换一项任务。<\/p>\n<h2>模式 2：容量先归到比特，再做位宽与量级换算<\/h2>\n<p>描述任何数据量先归到比特：图片按像素乘通道乘位深，音频按采样率乘声道乘精度，文本按字符乘字节。换算字节除以 8，对照 2 的幂与 10 的幂两套量级。编码 <span class=\"katex-inline\">M<\/span> 种状态所需最少位数满足 <span class=\"katex-inline\">2^N\\ge M<\/span>；心算数量级时 <span class=\"katex-inline\">2^{10}<\/span> 与 1000 的小幅偏差通常可忽略，但标称频率还是容量、用哪套幂要分清。<\/p>\n<h2>模式 3：沿局部性解释缓存，而不是把缓存当成提速魔法<\/h2>\n<p>缓存提速来自两条可观察的程序规律：时间局部性（最近用过的信息很可能再用）和空间局部性（访问某位置后邻近位置很快被访问）。缓存按连续块加载，容量逐级增大、速度逐级递减。分析慢程序时先判断循环里反复使用的指令和变量是否落在缓存；缓存不能无限增长，旧项目会被剔除。RAM 可作磁盘缓存，浏览器可缓存页面与图片，同一思路下沉到各层存储。<\/p>\n<h2>模式 4：算法先立正确性与终止性，再比较效率<\/h2>\n<p>写步骤先满足四条约束：操作含义完整定义、输入类型给定、所有情况覆盖、有限步终止。空输入、重复值、除零等边界要显式分支；缺了终止条件，「打泡漂洗重复」式循环不构成算法。效率分析只保留随数据量增长的主项，初始化等常数次操作不计入。比较两种算法时先核对前提是否相同：二分查找的对数收益建立在表已排序之上，排序成本要一并核算。<\/p>\n<h2>模式 5：量级对比看增长曲线，不看小规模试跑<\/h2>\n<p>把工作量归到 <span class=\"katex-inline\">\\log N<\/span>、<span class=\"katex-inline\">N<\/span>、<span class=\"katex-inline\">N\\log N<\/span>、<span class=\"katex-inline\">N^2<\/span> 几条曲线上：小规模数据差距有限，<span class=\"katex-inline\">N<\/span> 增大后二次与近线性拉开数量级。规模放大倍数直接代换：<span class=\"katex-inline\">N\\to2N<\/span> 时 <span class=\"katex-inline\">N^2<\/span> 变 4 倍，<span class=\"katex-inline\">N\\to10N<\/span> 变 100 倍。选算法不能只靠小数据试跑的快慢；同量级算法之间还要看每项操作的实际成本与内存访问，量级是分类，不是性能保证。<\/p>\n<h2>模式 6：分层问题逐层定位，每层只依赖下层服务<\/h2>\n<p>软件与网络都是分层结构：应用程序、TCP、IP、物理层，每层依赖下层服务、为上层提供服务。排查通信或程序问题时沿层向下定位：上层面对信息流，不必操心数据包；IP 负责独立包尽力投递，TCP 负责拼成有序流。跨层混用职责（让 IP 保证可靠、让 HTML 承担算法逻辑）会破坏分层抽象。分层也意味着每一层有自己的前提与盲区，不能用一层的能力承诺另一层。<\/p>\n<h2>模式 7：冗余按用途分方向——压缩去冗余，检错加冗余<\/h2>\n<p>压缩与检错纠错都处理冗余，方向相反：压缩删除真实冗余以缩短编码，检错纠错有意加入受控冗余以换取错误可见性。先分清目标是省带宽还是保可靠：频率编码把常见符号变短；校验位按模 2 或模 10 计算。检错能力与加入的冗余位数成正比，一位校验只能判有无错误，定位与纠错要更多冗余。校验只能证明编码自洽，不能证明内容真实存在。<\/p>\n<h2>模式 8：安全问题分清「保护了哪一段」，再画信任边界<\/h2>\n<p>评估一项安全机制先问它保护什么：对称与公钥保护报文内容，校验码保护完整性，证书核验身份归属。传输加密不覆盖元数据，也不免除平台方可见性；匿名化不挡多源交叉再识别；私钥泄露会牵连历史消息与签名。数据放到云端后，谁能访问、什么条件下调取、泄露是否担责、谁有权强制公开，属于技术之外的法律与信任安排。技术手段（端到端加密、屏蔽跟踪、关闭第三方 cookie）有明确边界，超出边界的部分要靠制度与用户选择补。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 硬件<\/strong>：冯·诺依曼结构、位与二进制、模数转换、CPU 执行与多级缓存（原书第 1–3 章，PDF 第 34–94 页）。\n<\/li><li>\n<strong>第 2 章 软件<\/strong>：算法与线性查找、二分查找与排序增长量级、程序设计语言、编译与操作系统（原书第 4–7 章，PDF 第 102–184 页）。\n<\/li><li>\n<strong>第 3 章 通信<\/strong>：带宽与传播延迟、数据压缩、错误检测与纠错、IP/TCP 协议栈、万维网（原书第 8–10 章，PDF 第 212–303 页）。\n<\/li><li>\n<strong>第 4 章 数据、隐私与安全<\/strong>：对称加密、公钥加密、数据跟踪与云计算（原书第 11–12 章，PDF 第 305–359 页）。\n<\/ul>\n<h2>位宽与编码容量<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>项<\/th><th>关系<\/th><th>数值<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">N<\/span> 位组合数<\/td><td><span class=\"katex-inline\">2^N<\/span><\/td><td>2 位 4 种，3 位 8 种<\/td><\/tr><tr><td>字节<\/td><td>8 位<\/td><td><span class=\"katex-inline\">2^8=256<\/span> 种取值<\/td><\/tr><tr><td>2 的幂对照<\/td><td><span class=\"katex-inline\">2^{10}=1024<\/span>，<span class=\"katex-inline\">2^{20}=1\\,048\\,576<\/span>，<span class=\"katex-inline\">2^{30}=1\\,073\\,741\\,824<\/span><\/td><td>心算与 <span class=\"katex-inline\">10^3/10^6/10^9<\/span> 近似<\/td><\/tr><tr><td>十进制量级<\/td><td><span class=\"katex-inline\">10^3<\/span> kilo，<span class=\"katex-inline\">10^6<\/span> mega，<span class=\"katex-inline\">10^9<\/span> giga，<span class=\"katex-inline\">10^{12}<\/span> tera，<span class=\"katex-inline\">10^{15}<\/span> peta<\/td><td>与 2 的幂有小幅近似偏差<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>模数转换的数据量<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>载体<\/th><th>参数<\/th><th>未压缩比特量<\/th><\/tr><\/thead><tbody><tr><td>图片<\/td><td>3000×2000 像素，RGB 三通道<\/td><td>600 万像素，1800 万强度值/通道<\/td><\/tr><tr><td>CD 音频<\/td><td>44100 样本/秒，立体声 2 声道，16 位<\/td><td><span class=\"katex-inline\">44100\\times2\\times16=1\\,411\\,200<\/span> 位/秒<\/td><\/tr><tr><td>精度<\/td><td><span class=\"katex-inline\">1/65536=2^{16}<\/span><\/td><td>量化级数<\/td><\/tr><\/tbody><\/table><\/div>\n<p>抽样率决定可还原频率上限，量化位数决定幅值分辨精度；A/D 与 D/A 双向都有损失。<\/p>\n<h2>存储层级与速度定性次序<\/h2>\n<p>CPU 内部缓存最快 → RAM 次之 → 二级存储（硬盘/SSD）最慢。缓存靠时间局部性（最近用过很可能再用）与空间局部性（按连续块加载）提速；容量逐级增大、速度逐级递减。作者笔记本每核 256KB 二级缓存、4MB 三级缓存（PDF 第 90 页）。<\/p>\n<h2>算法增长量级<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>量级<\/th><th>来源<\/th><th>典型步数<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">O(\\log N)<\/span><\/td><td>二分查找，每次折半<\/td><td>1024 项约 10 次；<span class=\"katex-inline\">10^6<\/span> 约 20 次；<span class=\"katex-inline\">10^9<\/span> 约 30 次<\/td><\/tr><tr><td><span class=\"katex-inline\">O(N)<\/span><\/td><td>线性遍历<\/td><td>比较次数与人数成正比<\/td><\/tr><tr><td><span class=\"katex-inline\">N\\log N<\/span><\/td><td>快速排序分治<\/td><td>16 名 <span class=\"katex-inline\">16\\log_2 16=64<\/span> 次<\/td><\/tr><tr><td><span class=\"katex-inline\">O(N^2)<\/span><\/td><td>选择排序<\/td><td><span class=\"katex-inline\">N(N+1)/2\\approx N^2/2<\/span>；16 名 136 次<\/td><\/tr><\/tbody><\/table><\/div>\n<p>二分前提是表已排序；<span class=\"katex-inline\">N<\/span> 加倍时二次增长约 4 倍，10 倍约 100 倍，1000 倍约 100 万倍。<\/p>\n<h2>网络量级对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>链路<\/th><th>带宽量级（原书列举，含理论值）<\/th><\/tr><\/thead><tbody><tr><td>最早调制解调器<\/td><td>110 bps<\/td><\/tr><tr><td>DSL/电缆<\/td><td>几兆位/秒<\/td><\/tr><tr><td>802.11 无线<\/td><td>理论 600 Mbps<\/td><\/tr><tr><td>以太网<\/td><td>1 Gbps<\/td><\/tr><tr><td>光纤<\/td><td>100 Gbps 以上<\/td><\/tr><tr><td>4G<\/td><td>静止理想 1 Gbps，运动 100 Mbps<\/td><\/tr><\/tbody><\/table><\/div>\n<p>端到端带宽取各段最小值；传播时延 <span class=\"katex-inline\">T_{\\text{prop}}=L/c<\/span>，真空中 <span class=\"katex-inline\">c\\approx3\\times10^8<\/span> 米/秒，约 1 英尺/纳秒；发送时间 <span class=\"katex-inline\">T_{\\text{send}}\\approx D/B<\/span>。<\/p>\n<h2>校验对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>方法<\/th><th>校验对象<\/th><th>覆盖错误<\/th><th>盲区<\/th><\/tr><\/thead><tbody><tr><td>奇偶校验位<\/td><td>二进制位，模 2 统计 1 的个数<\/td><td>单比特翻转可检出<\/td><td>两位同时翻转漏检；不能定位错位<\/td><\/tr><tr><td>Luhn 算法<\/td><td>十进制卡号/取款机编码，模 10 加权求和<\/td><td>单数码错、多数相邻换位错<\/td><td>系数相同的换位检不出；不证明卡号真实存在<\/td><\/tr><tr><td>纠错码<\/td><td>内存、CD/DVD、二维码<\/td><td>可定位并纠正单/多位错<\/td><td>冗余比例高于单纯检错<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>协议分层（图 9-3，自下而上）<\/h2>\n<p>物理层 → IP → TCP → 应用程序。IP 无连接、不可靠、尽力而为；包可丢失、损坏、乱序、重复；IP 包最大约 65KB；IPv6 地址 128 位；TTL 单字节每跳减 1，到 0 丢弃并回报错包。TCP 在 IP 之上提供可靠双向流，报文段带序列号；UDP 简单高效，用于 DNS、流媒体、VoIP、在线游戏。<\/p>\n<h2>加密量级对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>算法<\/th><th>密钥长度<\/th><th>处境<\/th><\/tr><\/thead><tbody><tr><td>DES<\/td><td>56 位<\/td><td>1999 年廉价专用机蛮力一天可破<\/td><\/tr><tr><td>AES<\/td><td>128/192/256 位<\/td><td>密钥空间巨大；AES-128 面对蛮力很安全<\/td><\/tr><tr><td>算力估算<\/td><td>单 GPU <span class=\"katex-inline\">10^{13}<\/span> 次/秒；百万 GPU <span class=\"katex-inline\">10^{19}<\/span> 次/秒；年约 <span class=\"katex-inline\">3\\times10^{26}\\approx2^{90}<\/span><\/td><td>距 <span class=\"katex-inline\">2^{128}<\/span> 差 <span class=\"katex-inline\">2^{38}\\approx2.7\\times10^{11}<\/span> 倍<\/td><\/tr><\/tbody><\/table><\/div>\n<p>对称加密加解密同一共享密钥，快但有密钥分发与密钥增生难题；公钥加密用数学关联的密钥对，公钥加密、私钥解密，解决分发但速度慢好几个数量级。真实 <code>https<\/code> 为混合方案：公钥协商临时会话密钥，AES 传批量数据。<\/p>\n<h2>跟踪与信任边界<\/h2>\n<ul><li>\n信号来源：第三方图片/脚本、1 像素信标、cookie、JavaScript、浏览器指纹与画布指纹、元数据、社交连接、位置服务。\n<\/li><li>\n加密边界：HTTPS 保护报文内容不被检查或修改，不隐藏元数据；匿名化挡不住多源交叉再识别。\n<\/li><li>\n云模型：程序与数据放在服务商服务器，经浏览器访问；谁能访问、何时调取、泄露责任、强制公开权限，属于技术之外的法律与信任安排。\n<\/ul>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/普林斯顿计算机公开课-美-Brian-W-Kernighan-17", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章）", "href": "#/chapter/ch01"}, {"label": "第二部分 软件：算法、程序设计语言与软件系统（原书第 4–7 章）", "href": "#/chapter/ch02"}, {"label": "第三部分 通信：网络、因特网与万维网（原书第 8–10 章）", "href": "#/chapter/ch03"}, {"label": "数据、隐私与安全：数据与信息、隐私与安全（原书第 11–12 章，含第 10 章网络安全部分）", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "冯·诺依曼逻辑结构：CPU、RAM、二级存储与总线", "href": "#/concept/c01"}, {"label": "位、字节与二进制表示：$2^N$ 编码容量与位值展开", "href": "#/concept/c02"}, {"label": "模拟与数字：抽样、量化与模数转换", "href": "#/concept/c03"}, {"label": "CPU 执行机制与多级缓存：取指—译码—执行、累加器与局部性", "href": "#/concept/c04"}, {"label": "算法与线性查找：正确性、终止性与 $O(N)$ 线性时间", "href": "#/concept/c05"}, {"label": "二分查找与排序增长量级：$\\log_2 N$、$N^2$ 与 $N\\log N$", "href": "#/concept/c06"}, {"label": "程序设计语言、编译与操作系统分层：汇编到高级语言、前后端与进程调度", "href": "#/concept/c07"}, {"label": "网络带宽、传播延迟与数据压缩：链路瓶颈、光速限制与无损/有损压缩", "href": "#/concept/c08"}, {"label": "错误检测与纠错：奇偶校验、Luhn 算法与冗余位的代价", "href": "#/concept/c09"}, {"label": "因特网协议栈与万维网：域名/IP/路由/TCP、URL/HTML/CSS", "href": "#/concept/c10"}, {"label": "对称密钥加密：密钥空间、蛮力攻击与 DES/AES 量级", "href": "#/concept/c11"}, {"label": "公钥加密：密钥对、分发问题与对称/非对称分工", "href": "#/concept/c12"}, {"label": "数据收集、跟踪与云计算：画像机制与信任边界", "href": "#/concept/c13"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章）", "href": "#/quiz/ch01"}, {"label": "测验：第二部分 软件：算法、程序设计语言与软件系统（原书第 4–7 章）", "href": "#/quiz/ch02"}, {"label": "测验：第三部分 通信：网络、因特网与万维网（原书第 8–10 章）", "href": "#/quiz/ch03"}, {"label": "测验：数据、隐私与安全：数据与信息、隐私与安全（原书第 11–12 章，含第 10 章网络安全部分）", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.34<\/div><h1>第 1 章：第一部分 硬件——计算机里有什么、位与信息表示、深入 CPU<\/h1>\n<blockquote>对应原书第 1 章「计算机里有什么」、第 2 章「位、字节和信息的表示」、第 3 章「深入 CPU」（PDF 第 34–94 页；印刷页 = PDF 页 − 28）。硬件部分讲逻辑体系结构而非物理制造细节：部件职责、信息如何用位表示、CPU 如何一步步执行指令。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n画出 CPU、RAM、二级存储（硬盘/SSD）、输入输出部件经总线相连的结构图，说清冯·诺依曼架构中处理器、内存、外设各自的职责；\n<\/li><li>\n算出 <span class=\"katex-inline\">N<\/span> 位能表示多少种组合，把一个十进制数按位值展开成二进制，区分位、字节与 2 的幂、10 的幂；\n<\/li><li>\n顺着抽样与量化两条线说明图片、声音如何变成数字：像素与 RGB 通道、采样率与量化位数，并估算一段数字音频的数据量；\n<\/li><li>\n沿取指—译码—执行循环推演一条指令在玩具计算机上的生命周期，解释多级缓存靠什么局部性提速，以及缓存容量与速度为什么此消彼长。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>通用计算机是一套固定的逻辑结构：处理器运算与控制，RAM 暂存当前程序的指令和数据，二级存储长期保存，部件之间经总线交换信息；所有信息最终都落成 0 和 1 的位模式，CPU 在循环取指、译码、执行中把这些位模式变成看得见的结果，缓存则用快而小的存储层掩盖慢而大的存储层的等待。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：冯·诺依曼逻辑结构（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。原书 1.1 节把通用计算机抽象成一张图：一个处理器（CPU）、一些初级存储（RAM）、一些二级存储（硬盘、闪存 SSD），再加上鼠标、键盘、显示器、GPS、加速度传感器等其他部件，所有部件由一组叫作总线（bus）的电缆连在一起互相传输信息（PDF 第 37 页）。这套基础组织自 20 世纪 40 年代起形成规范，常以约翰·冯·诺依曼命名：CPU 提供算法和控制，RAM 和磁盘承担记忆存储，键盘、鼠标、显示器负责与人交互（PDF 第 38 页）。手机和平板的结构图与此相似，只是鼠标、键盘、显示器被融合进显示屏，另外多出罗盘、加速度传感器、GPS 接收器这类隐藏部件。<\/p>\n<h3>2. 概念 2：位、字节与二进制表示（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。计算机是数字处理器，存储和处理的都是离散数值；信息通过位（bit）表示，位取 0 或 1 两种值，成组的位再表示数字、字母、声音、图片和程序本身（PDF 第 53 页）。一个位只能表示二选一的情形；两个位有 4 种组合，三个位有 8 种，<span class=\"katex-inline\">N<\/span> 位有 <span class=\"katex-inline\">2^N<\/span> 种（PDF 第 65 页）。原书图 2-10 给出常用对照：<span class=\"katex-inline\">2^{10}=1024<\/span>，<span class=\"katex-inline\">2^{20}=1\\,048\\,576<\/span>，<span class=\"katex-inline\">2^{30}=1\\,073\\,741\\,824<\/span>；十进制这边 <span class=\"katex-inline\">10^3<\/span> 是 kilo，<span class=\"katex-inline\">10^6<\/span> 是 mega，<span class=\"katex-inline\">10^9<\/span> 是 giga，<span class=\"katex-inline\">10^{12}<\/span> 是 tera，<span class=\"katex-inline\">10^{15}<\/span> 是 peta（PDF 第 67 页）。<\/p>\n<h3>3. 概念 3：模拟、抽样与模数转换（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。真实世界的量多是模拟的：水龙头、方向盘、水银体温计的液柱随事物平滑连续变化；数字系统处理离散数据，取值数量固定，微小改变可能让数值从一个离散值跳到另一个（PDF 第 54 页）。图片数字化靠像素（pixel）：一张 <span class=\"katex-inline\">3000\\times2000<\/span> 的图片是 600 万个像素，每个像素记录红、绿、蓝三个通道的光强度，合计 1800 万个光强度值（PDF 第 57 页）。声音数字化靠固定时间间隔抽样：CD 标准每秒取样 44100 个，每个样本取左右两个声道的幅值，幅值精度为 <span class=\"katex-inline\">1/65536<\/span>，即 <span class=\"katex-inline\">2^{16}<\/span>（PDF 第 61 页）。<\/p>\n<h3>4. 概念 4：CPU 执行机制与多级缓存（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。CPU 有一个小型指令系统：加减乘除等算术运算，从 RAM 取数、把结果存回 RAM，比较两个数字并据此决定下一步（PDF 第 76 页）。原书用一台纸面「玩具计算机」说明机制：它有存指令和数据的 RAM、一个只存一个数值的累加器（类似计算器显示屏）、一张只含 10 条指令的表（PDF 第 77 页）。运行时 CPU 从 RAM 第一个位置开始重复三步：取指（Fetch，从 RAM 取下一条指令）、译码（Decode，解析指令内容）、执行（Execute，执行该指令），然后返回取指。缓存是容量小但速度快的内存，存放最近使用的信息以避免访问 RAM；典型 CPU 有 2～3 级缓存，容量依次增大、速度递减，作者笔记本每个核心配 256KB 二级缓存和单个 4MB 三级缓存（PDF 第 89–90 页）。<\/p>\n<h2>推导一（推演）：位宽与可表示组合数的展开<\/h2>\n<p>设要给大学四个年级加研究生共五类身份编码。1 个位只有 0、1 两种取值，不够；2 个位的组合为 00、01、10、11，共 4 种，仍不够第五类；3 个位枚举为 000、001、010、011、100、101、110、111，共 8 种，可以把教师、教工、博士后都容纳进来（原书 2.3.1 节的例子，PDF 第 65 页）。 一般地，每增加 1 位，组合数在原有基础上翻倍：第 <span class=\"katex-inline\">k<\/span> 位取 0 时前 <span class=\"katex-inline\">k-1<\/span> 位的每种组合仍在，取 1 时再复制一份，因此 <span class=\"katex-inline\">N<\/span> 位的组合数满足递推 <span class=\"katex-inline\">C(1)=2<\/span>，<span class=\"katex-inline\">C(N)=2C(N-1)<\/span>，展开得 <span class=\"katex-inline\">C(N)=2^N<\/span>。反过来，要编码 <span class=\"katex-inline\">M<\/span> 种互斥状态，所需最少位数满足 <span class=\"katex-inline\">2^N\\ge M<\/span>，即 <span class=\"katex-inline\">N\\ge \\log_2 M<\/span>。例如 26 个英文字母需要 5 位（<span class=\"katex-inline\">2^4=16&lt;26\\le 32=2^5<\/span>）；ASCII 文本每个字母占 1 个字节即 8 位，共 <span class=\"katex-inline\">2^8=256<\/span> 种取值（PDF 第 230 页）。<\/p>\n<h2>推导二（推演）：一段 CD 数字音频的数据量<\/h2>\n<p>CD 每秒取样 44100 次，立体声左右两个声道，每个样本幅值用 16 位（<span class=\"katex-inline\">2^{16}=65536<\/span> 级）量化（PDF 第 61 页）。 每秒位数 = 取样率 × 声道数 × 量化位数 = <span class=\"katex-inline\">44100\\times2\\times16=1\\,411\\,200<\/span> 位/秒；换算成字节除以 8，得 <span class=\"katex-inline\">176\\,400<\/span> 字节/秒，约 172 KB/s。一首 4 分钟（240 秒）的乐曲未压缩数据量为 <span class=\"katex-inline\">176\\,400\\times240\\approx42.3<\/span> MB。这个量级解释了为什么音频需要压缩：MP3、AAC 大约能把文件压到原来的十分之一，而人耳几乎察觉不到音质下降（PDF 第 62 页）。抽样率决定能还原的频率上限，量化位数决定幅值分辨精度；两者下降，听感上会先后出现高频发闷和噪声底变粗。<\/p>\n<h2>反事实：去掉某个机制会怎样<\/h2>\n<ul><li>\n<strong>去掉 RAM，只保留二级存储<\/strong>：指令和数据都放在速度慢得多的磁盘/闪存上，CPU 每取一条指令、读一个数都要等二级存储响应；处理器再快也被存取等待拖死。RAM 的存在让当前运行程序的指令和数据进入快速可改写的工作区，这正是存储程序概念的关键：往 RAM 里换不同指令，同一台硬件就能做文字处理、表格、浏览、邮件等不同工作（PDF 第 40 页）。\n<\/li><li>\n<strong>缓存整块拿掉<\/strong>：程序循环里反复使用的指令和变量每次都要从 RAM 重新读取。原书 3.3 节举例，求和循环中 6 条指令对每个输入数值执行一遍，若这些指令存在缓存里，就不必每轮都等 RAM；去掉缓存，每轮循环都补上一次慢速读取，循环越密损失越大（PDF 第 89 页）。\n<\/li><li>\n<strong>信息不用位模式而直接保存模拟量<\/strong>：复制、传输、存储都会累积失真，也无法像数字数据那样去除冗余压缩、加密、精确复制并在不同设备间搬运（PDF 第 55 页）。数字系统的可处理性建立在离散位之上。\n<\/li><li>\n<strong>CPU 不能根据比较结果决定下一步<\/strong>：处理器退化成普通计算器，每个步骤都要人工介入指令；无法自主运行整个系统，程序的循环、分支都无从谈起（PDF 第 76 页）。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章是全书的硬件底座：部件职责与位表示贯穿后面所有章节。第 2 章算法与程序建立在「指令和数据都以位存于 RAM、CPU 按循环执行」这套机制之上；第 3 章网络讨论的数据包、第 4 章加密讨论的密钥空间，其容量计算都回到本章的 <span class=\"katex-inline\">2^N<\/span>。下一章在这套硬件上看软件：算法步骤如何设计、效率随数据量怎么增长、程序怎样通过编译落到本章的 CPU 指令上。<\/p>", "ch02": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.102<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第一部分 硬件：计算机里有什么、位与信息表示、深入 CPU（原书第 1–3 章）<\/a><\/span><\/div><h1>第 2 章：第二部分 软件——算法、程序设计语言与软件系统<\/h1>\n<blockquote>对应原书第 4 章「算法」、第 5 章「编程与编程语言」、第 6 章「软件系统」、第 7 章「学习编程」（PDF 第 102–184 页；印刷页 = PDF 页 − 28）。软件部分回答：计算步骤怎样才算一个算法、效率随数据量怎样变化、人写的程序怎样变成 CPU 能执行的指令、操作系统在中间管什么。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出算法的四条约束：操作含义完整定义、输入类型给定、所有情况覆盖、有限步内终止，并指出「打泡、漂洗、重复」为什么不算算法；\n<\/li><li>\n写出遍历求最大值与求平均的线性步骤，标出零人输入等边界处理，说明线性时间与数据量成正比；\n<\/li><li>\n按每次折半推出二分查找的比较次数为 <span class=\"katex-inline\">\\log_2 N<\/span>，对比选择排序的 <span class=\"katex-inline\">N(N+1)/2<\/span> 与快速排序的 <span class=\"katex-inline\">N\\log_2 N<\/span>，说出数据放大 2 倍、10 倍、1000 倍时各自的时间代价；\n<\/li><li>\n沿高级语言 → 编译器 → 汇编器 → 位模式的链路说明编译过程，区分前端与后端；讲清操作系统如何调度进程、管理 CPU/内存/磁盘，并说清软件分层的依赖关系。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>算法是含义明确、覆盖全情况、必然终止的步骤序列，其效率按随数据量增长的量级分类；线性遍历逐项检查，二分查找靠有序前提每次舍弃一半，排序在二次增长与分治的近线性增长之间拉开差距；人用高级语言表达计算，编译器把它翻成体系结构相关的指令，操作系统在底层把硬件资源分给同时运行的各个程序。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 5：算法与线性查找（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。原书把算法定义为「确保算出正确结果的一系列步骤」：每个步骤用含义完整定义的基本操作表达，输入数据类型给定，所有可能情况都覆盖到，算法绝不会遇到不知道下一步做什么的情况；学究式的计算机科学还要求算法必须在最后终止（PDF 第 103 页）。经典洗发指令「打泡、漂洗、重复」不满足终止条件，不算算法。线性算法的代表是找最高的人：依次询问每个人的身高，把更高的记为当前最高；人数翻 2 倍，询问次数翻 2 倍，人数翻 10 倍，时间翻 10 倍，时间与数据量成正比，称为线性时间（PDF 第 104、106 页）。<\/p>\n<h3>2. 概念 6：二分查找（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。若名单按字母顺序排列，不必逐项找：从大约中间开始，要找的名字在中间之前就舍弃后半部，否则舍弃前半部，每一步都知道该找哪一半（PDF 第 107 页）。原书算例：最初 1024 个名字，一次比较去掉 512 个，再剩 256、128、64、32、16、8、4、2、1，总共比较 10 次，正好对应 <span class=\"katex-inline\">2^{10}=1024<\/span>（PDF 第 107 页）。1000 个名字约查 10 次，2000 个约 11 次；一百万约 <span class=\"katex-inline\">10^6\\approx2^{20}<\/span>，约 20 次；10 亿约 <span class=\"katex-inline\">2^{30}<\/span>，约 30 次。数据量增长到 1000 倍，二分查找只多约 10 步（PDF 第 108 页）。<\/p>\n<h3>3. 概念 7：排序与增长量级（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。选择排序反复遍历剩余数据项找出下一个名字：16 个名字，找第一个查 16 次，第二个 15 步，依此类推，总检查次数 <span class=\"katex-inline\">16+15+\\cdots+2+1=136<\/span>（PDF 第 110 页）。一般情形工作量为 <span class=\"katex-inline\">N+(N-1)+\\cdots+1=N(N+1)/2<\/span>，随 <span class=\"katex-inline\">N<\/span> 增大近似与 <span class=\"katex-inline\">N^2<\/span> 成正比，称为二次增长：数据项加倍时间变 4 倍，变 10 倍时间变 100 倍，变 1000 倍时间变 100 万倍（PDF 第 111 页）。快速排序（Quicksort，Tony Hoare 于 1959 年左右发明）是分而治之的例子：每遍遍历把数据分成大小相近的两组，递归再分；16 个名字分 8、4、2、1 四遍，工作量 <span class=\"katex-inline\">16\\log_2 16=64<\/span> 次操作，对比选择排序 136 次（PDF 第 112–113 页）。图 4-1 把 <span class=\"katex-inline\">\\log N<\/span>、<span class=\"katex-inline\">N<\/span>、<span class=\"katex-inline\">N\\log N<\/span>、<span class=\"katex-inline\">N^2<\/span> 四条曲线画在一起（PDF 第 113 页）。<\/p>\n<h3>4. 概念 8：程序设计语言与编译（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。汇编语言直接对应处理器指令表：两台指令集不同的 CPU，同一份计算要分别改写指令序列，程序员必须熟悉两种处理器（PDF 第 124 页）。20 世纪 50 年代末到 60 年代初，独立于任何 CPU 体系结构的高级编程语言问世，让人以接近自然语言的方式表达计算；代码经编译器翻译成目标处理器的汇编指令，再由汇编器转换为位模式加载执行（PDF 第 124 页）。同一个表达式 <span class=\"katex-inline\">Z=X+Y<\/span>，编译器 #1 生成三条指令，编译器 #2 生成两条指令，各自汇编器再落成不同的位模式（图 5-1，PDF 第 125 页）。编译器内部常分前端与后端：前端把高级语言转成中间形式，后端把中间形式转成不同体系结构的汇编指令，比为每种机器写一个完整编译器简单（PDF 第 126 页）。<\/p>\n<h3>5. 概念 9：操作系统与软件分层（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。20 世纪 50 年代初还没有应用程序与操作系统之分，一次只能运行一个程序，程序员要预约时段上机；第一批广泛使用的操作系统诞生于 50 年代末 60 年代初，由硬件厂商用汇编语言写成并与硬件紧密相连（PDF 第 155–156 页）。MIT 1961 年开发 CTSS 兼容分时系统；1969 年贝尔实验室 Ken Thompson 和 Dennis Ritchie 结合 CTSS 与 Multics 的经验开始开发 Unix，二人因此获 1983 年图灵奖；今天多数操作系统要么源自 Unix，要么是兼容 Unix 独立开发的 Linux（PDF 第 156 页）。操作系统控制和分配计算机资源：管理 CPU，调度协调当前运行程序，挂起等待状态的程序，强行中断占用 CPU 过多的程序；通常要管理数十个同时运行的进程或任务（PDF 第 157 页）。<\/p>\n<h2>推导一（推演）：选择排序工作量的求和与二次增长<\/h2>\n<p>选择排序第 <span class=\"katex-inline\">k<\/span> 轮在剩余 <span class=\"katex-inline\">N-k+1<\/span> 个数据项中找下一个，比较次数等于剩余项数。总工作量<\/p>\n<div class=\"katex-block\">S_N=N+(N-1)+(N-2)+\\cdots+2+1.<\/div>\n<p>把首尾成对相加：<span class=\"katex-inline\">N+1<\/span>、<span class=\"katex-inline\">(N-1)+2<\/span>、<span class=\"katex-inline\">(N-2)+3<\/span>，每对和为 <span class=\"katex-inline\">N+1<\/span>，共 <span class=\"katex-inline\">N/2<\/span> 对，得 <span class=\"katex-inline\">S_N=N(N+1)/2=N^2/2+N/2<\/span>。当 <span class=\"katex-inline\">N<\/span> 很大时，低阶的 <span class=\"katex-inline\">N/2<\/span> 相对 <span class=\"katex-inline\">N^2/2<\/span> 可忽略，工作量近似 <span class=\"katex-inline\">N^2/2<\/span>，量级为 <span class=\"katex-inline\">O(N^2)<\/span>。代入 <span class=\"katex-inline\">N=1000<\/span>：<span class=\"katex-inline\">S_{1000}=1000\\times1001/2=500\\,500<\/span>，<span class=\"katex-inline\">N^2=1\\,000\\,000<\/span>，主项占一半量级。规模放大：<span class=\"katex-inline\">N<\/span> 变 <span class=\"katex-inline\">2N<\/span>，<span class=\"katex-inline\">S<\/span> 变约 <span class=\"katex-inline\">4S<\/span>；变 <span class=\"katex-inline\">10N<\/span>，<span class=\"katex-inline\">S<\/span> 变约 <span class=\"katex-inline\">100S<\/span>；变 <span class=\"katex-inline\">1000N<\/span>，<span class=\"katex-inline\">S<\/span> 变约 <span class=\"katex-inline\">10^6 S<\/span>。这就是原书说二次增长「非常糟糕」的算术依据（PDF 第 111 页）。<\/p>\n<h2>推导二（推演）：二分查找折半次数与对数<\/h2>\n<p>设有序表有 <span class=\"katex-inline\">N<\/span> 项，每次比较中点后舍弃一半，候选数从 <span class=\"katex-inline\">N<\/span> 变为 <span class=\"katex-inline\">\\lceil N/2\\rceil<\/span>。重复到候选剩 1 项或确认不存在，所需折半次数 <span class=\"katex-inline\">k<\/span> 满足 <span class=\"katex-inline\">N/2^k\\le1<\/span>，即 <span class=\"katex-inline\">2^k\\ge N<\/span>，<span class=\"katex-inline\">k\\ge\\log_2 N<\/span>。以 1024 为例：<span class=\"katex-inline\">1024\\to512\\to256\\to128\\to64\\to32\\to16\\to8\\to4\\to2\\to1<\/span>，折了 10 次，<span class=\"katex-inline\">\\log_2 1024=10<\/span>（PDF 第 107 页）。规模换算：<span class=\"katex-inline\">1000<\/span> 接近 <span class=\"katex-inline\">2^{10}<\/span>，约 10 次；<span class=\"katex-inline\">2000<\/span> 首次比较就去掉 1000 个，回到 1000 的情形，再加 1 次共 11 次；<span class=\"katex-inline\">10^6\\approx2^{20}<\/span>，约 20 次；<span class=\"katex-inline\">10^9\\approx2^{30}<\/span>，约 30 次。前提是表已排序；无序表只能线性遍历，二分查找的对数收益建立在排序成本之上。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>算法不要求覆盖所有情况<\/strong>：求平均的步骤若不检查「没人」的情形，机器会拿 0 去除和；原书给出的修正版本先统计人数 <span class=\"katex-inline\">N<\/span>，<span class=\"katex-inline\">N&gt;0<\/span> 才算平均，否则报告「未给出身高数据」（PDF 第 105 页）。缺了边界分支，程序在空输入上崩溃或给出未定义运算的结果。\n<\/li><li>\n<strong>算法不要求终止<\/strong>：「打泡、漂洗、重复」式循环没有退出条件，程序可能永远运行下去；算法分析连最坏运行时间都无从界定。\n<\/li><li>\n<strong>高级语言没有编译器，只能写汇编<\/strong>：换一种处理器就得重写全部程序，程序员必须熟悉每种指令集；程序跨体系结构的普适性消失，为多种机器开发软件的成本大幅上升（PDF 第 126 页）。\n<\/li><li>\n<strong>操作系统不做进程调度<\/strong>：多个程序争抢同一 CPU，一个程序占住不放，其他程序得不到响应；等待下载网页、跟踪鼠标、刷新显示器的程序与计算密集程序互相干扰，没有挂起和中断机制，整机表现为「一片混乱」（PDF 第 157 页）。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章承接第 1 章的硬件：算法步骤最终要落在 CPU 的取指—译码—执行循环上，编译链路把高级语言翻译成这套指令，操作系统再把 CPU、内存、磁盘分给各程序。下一章进入通信：程序产生的数据要跨设备传送，带宽、延迟、压缩、错误检测决定这些数据怎样穿过网络，第 12 章的协议栈分层正是本章软件分层思路在网络侧的对应物。<\/p>", "ch03": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.212<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第二部分 软件：算法、程序设计语言与软件系统（原书第 4–7 章）<\/a><\/span><\/div><h1>第 3 章：第三部分 通信——网络、因特网与万维网<\/h1>\n<blockquote>对应原书第 8 章「网络」、第 9 章「因特网」、第 10 章「万维网」（PDF 第 212–303 页；印刷页 = PDF 页 − 28）。通信部分回答：设备之间靠什么链路相连、数据怎样编码压缩与检错、因特网协议如何把不可靠的包拼成可靠通信、万维网的页面和链接怎样组织起来。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分带宽与传播延迟：数据流速度取决于链路最慢环节，光速对跨洋距离给出物理下界；按链路类型说出原书给出的带宽量级；\n<\/li><li>\n说明无损与有损压缩的差别，用字符频率与霍夫曼编码的思路解释为什么常用符号用短码；\n<\/li><li>\n写出奇偶校验的校验位规则，说明它能检出哪类错误、检不出哪类错误；说出 Luhn 校验覆盖的单数码错误与换位错误；\n<\/li><li>\n沿域名 → IP 地址 → 路由 → IP 包 → TCP 流走通一次通信，解释 IP 的无连接、不可靠、尽力而为性质，以及 TTL 防循环机制；拆解 URL 各字段，说清 HTML、CSS 为什么不是编程语言。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>网络是一串带宽各异、延迟受光速约束的链路；压缩去掉冗余，校验加上受控冗余来发现错误；因特网把通信分成分层协议：IP 负责独立数据包的尽力投递，TCP 在其上拼成可靠双向流；万维网用 URL 定位资源、用 HTML 描述内容与格式、用 CSS 定义样式，浏览器把这些取回本地渲染。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 10：带宽、传播延迟与数据压缩（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。网络中数据流的速度取决于链接的最低许可速度，数据量会在很多地方减慢，链接自身与计算机处理过程都会遇上瓶颈；光速也是限制因素，信号在真空中每秒约三亿米，约一英尺每纳秒，在电路中还会慢下来（PDF 第 229 页）。原书给出的量级：第一个调制解调器约 110 bps；802.11 家用无线理论 600 Mbps；有线以太网通常 1 Gbps；DSL 或电缆约每秒几兆位；光纤可达 100 Gbps 甚至更高；4G 静止状态理想 1 Gbps、运动状态 100 Mbps（PDF 第 229 页）。压缩的基本思路是避免存储或发送冗余信息：不携带信息的位可完全去掉，可由其他位推算出的位可去掉，与接收者无关的位可安全丢弃（PDF 第 230 页）。<\/p>\n<h3>2. 概念 11：错误检测与纠错（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。压缩是去除冗余，错误检测与纠错则是添加细心控制的冗余来发现甚至纠正错误。美国社会安全号 9 位数没有冗余，任意 9 位都可能是一串有法律效力的数字；信用卡号和取款机编码由 16 位构成，但并非每个 16 位数都有效，使用 1954 年 Peter Luhn 在 IBM 发明的校验算法，可检测单个数位错误以及大多数因错位导致的两位互换错误（PDF 第 233 页）。奇偶校验码是应用于位的最简单错误检测：每组位末尾加一个附加位，使整组中 1 的个数为偶（偶校验）或奇（奇校验）；一个位出错时 1 的个数奇偶改变，接收方知道出错，但指不出哪一位，同时两位出错则无法发现（PDF 第 234 页）。使用更多冗余位时，单个位错误可以被编码纠正；存储器靠奇偶位检测随机单位错误，CD/DVD 使用可纠正长期磨损位的代码，二维码带有扩展纠错机制（PDF 第 235 页）。<\/p>\n<h3>3. 概念 12：因特网协议栈（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。协议规定双方互相沟通时遵守的规则。因特网最基础的两个协议：IP（Internet Protocol，因特网协议）定义单个数据包的格式和传输方式；TCP（Transmission Control Protocol，传输控制协议）定义 IP 数据包如何组合成数据流以及如何连接到服务；两者合称 TCP/IP（PDF 第 253 页）。IP 是无连接的：每个数据包独立存在，与其他包无关，协议没有状态或存储功能，把包传给下一个网关后不再保留该包信息；IP 不可靠，是「尽力而为」型协议，包可能丢失、损坏、乱序、重复或超时（PDF 第 254 页）。IP 数据包最大约 65KB，长消息要拆成小块发送、远端重组；IPv6 源地址和目标地址都是 128 位。TTL（Time To Live，生存时间）是单字节区，发送方设初始值，每过一跳网关减 1，减到 0 就丢弃并给始发者返回报错包；典型一次传包经过 15～20 个网关，经过 255 跳的包很可能误入循环，TTL 不能消除循环，但能防止数据包因进循环而永远存在（PDF 第 254–255 页）。TCP 在不可靠的 IP 之上提供可靠双向数据流：把字节流切分报文段，报文段含实际数据和带序列号的头部信息（PDF 第 255 页）。同层还有 UDP（用户数据报协议），比 TCP 简单得多，DNS、流媒体视频、VoIP 和某些在线游戏使用 UDP（PDF 第 253 页）。<\/p>\n<h3>4. 概念 13：万维网（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。URL 以 <code>http<\/code> 或 <code>https<\/code> 开头：<code>https<\/code> 表示采用经过加密的安全 HTTP（PDF 第 276 页）。<code>://<\/code> 后面是域名，即服务器名字；域名后斜杠与字符串原样传给服务器，由服务器决定如何处置；域名后什么都没有则返回默认页面，如 <code>index.html<\/code>；文件名后问号一般表示前面是程序，服务器运行该程序并把问号后部分作为参数传入，这是网页表单信息的处理方式（PDF 第 276 页）。服务器返回的绝大多数文本是 HTML 格式，包含文本内容和格式信息；HTML 文件用标签表示格式，标签可标示页面区域的起始与结束位置（PDF 第 277 页）。<code>&lt;img&gt;<\/code> 是自包含标签，<code>&lt;body&gt;<\/code> 与 <code>&lt;/body&gt;<\/code> 成对，<code>&lt;p&gt;<\/code> 严格定义也要求闭合；<code>alt<\/code> 属性提供图片无法显示时的替代文字（PDF 第 278 页）。多数 HTML 文档还含 CSS（Cascading Style Sheets，层叠样式表）记录的样式信息，例如一条 CSS 指令让所有 h2、h3 标题显示为红色斜体。HTML 和 CSS 都不算编程语言：有正规语法和语义，但没有循环和状态，无法用它们表示算法（PDF 第 278 页）。<\/p>\n<h2>推导一（推演）：跨洋距离上的传播延迟下界<\/h2>\n<p>信号在真空中光速 <span class=\"katex-inline\">c\\approx3\\times10^8<\/span> 米/秒。原书记录：美国东海岸到西海岸约 2500 英里（4000 千米），按真空光速算约 13 微秒；到西欧约 50 微秒，到悉尼约 110 微秒，到北京约 140 微秒（PDF 第 229 页）。用距离核对：<span class=\"katex-inline\">4000\\,\\text{km}=4\\times10^6\\,\\text{m}<\/span>，传播时间 <span class=\"katex-inline\">t=d/c=4\\times10^6/(3\\times10^8)\\approx1.33\\times10^{-2}<\/span> 秒，即约 13 毫秒——这里原书给出的 13 微秒与距离换算存在量级出入，实际电路中信号速度约为真空光速的 2/3，且 4000 千米单向传播应在十毫秒量级；原书 13 微秒对应约 4 千米距离，与 2500 英里的说法不匹配，引用时以原书文字为准，物理核算按本片段推导。往返行程还要叠加各网关处理、排队与重传时间，原书记录同一次旅途到西欧约 40 微秒级别的网络延迟、到悉尼 110 微秒、到北京 140 微秒（转述，量级以原书页面为准）。这个推导说明：即使链路带宽无限大，物理距离仍给往返延迟设了下界，数据量大时带宽是瓶颈，交互响应时延迟是瓶颈。<\/p>\n<h2>推导二（推演）：Luhn 校验的单数码与换位检出<\/h2>\n<p>原书算法：从最右边一位开始，逐个交替把数值乘 1 或 2；乘出的结果比 9 大就减 9；把每个位置最后得出的数值相加，总和必须能被 10 整除（PDF 第 233 页）。示例卡号 4417 1234 5678 9112，算出的结果是 9，因此不可用；把最后一位改成 3 即可通过。单数码错误：某位数字 <span class=\"katex-inline\">d<\/span> 变成 <span class=\"katex-inline\">d&#x27;<\/span>，参与加权后的贡献改变量不为 0，总和模 10 随之改变，校验失败。相邻两位互换：两个位置权重不同（一个乘 1 一个乘 2），除非两个数字相等，否则交换后贡献和改变，能被检出；这覆盖了实际生活中最常见的两类录入错误。局限在于：校验只能证明号码与规则自洽，不能证明卡号真实存在；两位以上同时出错、或错误恰好让总和仍保持模 10 不变，校验无法识别。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>IP 去掉无连接状态、为每个通信维持连接上下文<\/strong>：网关要为每条流保存状态，路由器复杂度和存储量随连接数膨胀；一台网关重启，所有经过它的流状态全部丢失。无连接换来的是数据包各自独立转发，网络可以绕开故障节点重新选路（PDF 第 254 页）。\n<\/li><li>\n<strong>IP 不做 TTL 递减<\/strong>：误入路由循环的数据包会在环路里永远打转，持续占用链路带宽；TTL 到 0 丢弃并报错，把循环包的寿命限制在有限跳数内（PDF 第 255 页）。\n<\/li><li>\n<strong>去掉校验冗余<\/strong>：像社会安全号那样所有编码位都承载信息，传输中翻一个位，接收方无法察觉，错号被当成合法号使用；加冗余位付出的是编码效率，换回错误可见性（PDF 第 233 页）。\n<\/li><li>\n<strong>HTML/CSS 带上循环和状态<\/strong>：页面描述语言就变成程序设计语言，安全模型从「取回静态标记渲染」变成「在客户端执行任意逻辑」；原书把没有循环和状态当作两者与编程语言的分界（PDF 第 278 页）。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章把第 2 章的软件分层思路搬到网络侧：应用程序、TCP、IP、物理层各依赖下一层服务、为上一层提供服务（图 9-3，PDF 第 253 页）。下一章处理这些网络链路带来的后果：数据被怎样收集和跟踪，加密怎样在不可靠、可被窃听的链路上保护内容，云计算把数据和计算交托给谁。第 10 章后半的病毒、蠕虫、特洛伊木马与网络攻击，正是本章协议在恶意使用下的反面。<\/p>", "ch04": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.305<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第三部分 通信：网络、因特网与万维网（原书第 8–10 章）<\/a><\/span><\/div><h1>第 4 章：数据、隐私与安全——数据与信息、隐私与安全<\/h1>\n<blockquote>对应原书第 11 章「数据与信息」、第 12 章「隐私与安全」，并衔接第 10 章后半的病毒、蠕虫、特洛伊木马与网络安全部分（PDF 第 305–359 页；印刷页 = PDF 页 − 28）。本章回答：在线活动留下哪些可被收集和聚合的数据，加密怎样在可被窃听的链路上保护内容，对称与公钥加密各自解决什么问题，云计算把信任边界推给了谁。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分搜索、跟踪、社交网络与数据挖掘聚合分别收集什么数据，说明多来源数据整合后能还原出什么；\n<\/li><li>\n写出对称加密的密钥空间随位数的指数关系，按原书给出的 GPU 算力量级估算 DES 与 AES-128 面对蛮力攻击的处境；\n<\/li><li>\n解释公钥/私钥的数学关联与「一把加密、另一把解密」的性质，说明公钥加密解决了对称加密的哪两个难题；\n<\/li><li>\n梳理云计算把程序与数据从本机转移到服务商服务器的过程，列出这一转移在所有权、管辖权和漏洞面上下放的边界。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>在线服务在提供便利的同时记录访问对象、身份与位置；密码术是抵御泄露的主要手段，对称加密要求通信各方共享同一密钥，密钥分发和密钥增生由此成为难题，公钥加密用公开密钥对绕开分发问题；现代密码学假定攻击者知道算法，安全性只寄托在密钥上；云计算把计算负载和数据存储转移到服务商，客户端代码与服务器端带宽、内存共同决定体验，也把信任边界交给了第三方。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 14：对称密钥加密（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c11.md\" target=\"_blank\" rel=\"noopener\">概念 c11<\/a>。加密（密码术）是「秘密书写」的技艺，是抗袭击最有效的方法之一；好的加密复杂精细，也很容易因人工失误而失败（PDF 第 340 页）。历史上的凯撒密码把字母向后移动三个位置，A 变 D、B 变 E，<code>HI JULIUS<\/code> 变成 <code>KL MXOLXV<\/code>；rot13 把字母移动 13 个位置，常用于新闻组隐藏剧透（PDF 第 340 页）。对称密钥加密中，加解密使用同一把密钥，密钥由参与消息交换的各方共享；假定算法完全为人理解且没有缺陷，破解消息的唯一方法就是蛮力攻击，尝试所有可能密钥直到找出加密用的那把；密钥有 <span class=\"katex-inline\">N<\/span> 位时，穷举时间与 <span class=\"katex-inline\">2^N<\/span> 成正比（PDF 第 343 页）。蛮力攻击也并非没有捷径：攻击者先试短密钥、再试长密钥，先试可能性大的，字典攻击就尝试 <code>password<\/code>、<code>12345<\/code> 这类常见单词和数字；选密钥偷懒或粗心就会让这种攻击得手（PDF 第 343 页）。<\/p>\n<h3>2. 概念 15：公钥加密（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c12.md\" target=\"_blank\" rel=\"noopener\">概念 c12<\/a>。对称加密的大问题是密钥分发：参与秘密通信的每一方都必须知道所用密钥，必须有绝对安全的渠道把密钥送到通信方；还有密钥增生：要保证彼此无关的多方独立秘密会话，就要为每组会话准备不同密钥，分发更加困难（PDF 第 344–345 页）。公钥加密由怀特菲尔德·迪菲和马丁·赫尔曼于 20 世纪 70 年代中期在斯坦福发明，二人因此分享 2015 年图灵奖；英国 GCHQ 的詹姆斯·埃利斯和克利福德·柯克斯早几年独立发现同样方法，因工作要求保密到 1997 年才发表（PDF 第 345 页）。公钥系统里每个人有一对密钥：一个公钥、一个私钥，这对密钥是数学上有关联的整数，用其中一把加密过的消息只能用另一把解密，反之亦然；公钥开诚布公，任何人都能拿到，通常公布在网站上，私钥只有密钥对主人知道（PDF 第 345 页）。实际场景：Alice 想给 Bob 发只有 Bob 能看到的消息，先到 Bob 网站找他的公钥，用公钥加密后发出；Eve 在偷听，拿到的只是密文（PDF 第 345 页）。<\/p>\n<h3>3. 概念 16：数据收集、跟踪与云计算（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c13.md\" target=\"_blank\" rel=\"noopener\">概念 c13<\/a>。第 11 章按主题展开：搜索留下查询记录，跟踪把访问链接、点击对象记录下来，社交网络在交互中提供内容也收集数据，数据挖掘与聚合把多个来源的信息拼成完整生活画面；数字存储廉价而数据宝贵，信息很少被丢弃，网上发布后想撤回往往太迟（引言部分，PDF 第 21 页）。云计算是另一种计算模型：不再把运行程序和保存数据都放在自己的计算机上，而是用浏览器访问和操作因特网上服务器保存的信息；Gmail、Outlook 等邮件服务是最常见例子，Facebook、Instagram、Dropbox、Twitter、领英和在线日历也属此类，数据不存本地而存在服务提供商的服务器上（PDF 第 331 页）。云计算成为现实依赖多方面条件成熟：个人计算机能力越来越强，浏览器能高效运行涉及大量显示需求的大型程序，客户端编程语言仍是解释型 JavaScript；服务器到客户端的带宽和延迟相比 10 年前明显改善，为快速发送和取回数据提供保障（PDF 第 331 页）。Google Docs 这类云办公系统含文字处理、电子表格和演示程序，基本可与 Microsoft Office 竞争，并支持多用户并发访问和同步更新（PDF 第 332 页）。<\/p>\n<h3>4. 密码学的两条基本立场<\/h3>\n<p>原书 12.1 节给出两条贯穿现代密码学的原则。其一，频率分析法统计密码中每个符号出现的频率，可以轻松解决凯撒密码和简单替换密码；要抵御频率分析，加密算法必须让密文中所有符号以大致相等的机会出现，做到没有模式可供分析（PDF 第 342 页）。其二，现代密码学必须假定攻击者知道并完全理解密码系统的工作原理，把所有安全性寄托在密钥上；相反的做法——假定对手不知道系统用什么方案、如何破解——称为隐匿式安全，这种方法经历较长时间后往往会失败；有人鼓吹加密系统十分安全却不愿说出工作原理，就可以确信它并不安全（PDF 第 342 页）。加密系统的公开性也很重要：需要尽可能多的专家和专业经验来寻找薄弱点，算法弱点可能在初始开发分析很久之后才暴露（PDF 第 342 页）。<\/p>\n<h2>推导一（推演）：密钥空间与蛮力攻击量级<\/h2>\n<p><span class=\"katex-inline\">N<\/span> 位密钥的取值总数为 <span class=\"katex-inline\">2^N<\/span>，蛮力攻击最坏要试遍全部密钥，平均试一半就命中，时间量级与 <span class=\"katex-inline\">2^N<\/span> 成正比。原书记录：DES 总是使用 56 位密钥，1999 年由廉价专业计算机使用蛮力攻击，穷举一天就能破解 DES 密钥（PDF 第 344 页）。AES 支持 128、192、256 位三种密钥长度，潜在密钥数量非常多。原书估算算力：GPU 每秒可进行 <span class=\"katex-inline\">10^{13}<\/span> 次计算，一百万个 GPU 每秒可做 <span class=\"katex-inline\">10^{19}<\/span> 次，每年大约 <span class=\"katex-inline\">3\\times10^{26}<\/span> 次，这大概是 <span class=\"katex-inline\">2^{90}<\/span> 次；这个数字距离 <span class=\"katex-inline\">2^{128}<\/span> 仍然遥远，所以 AES-128 面对蛮力攻击也很安全（PDF 第 344 页）。核对换算：<span class=\"katex-inline\">10^{19}\\times3.15\\times10^7\\approx3.15\\times10^{26}<\/span>；<span class=\"katex-inline\">\\log_2(3\\times10^{26})\\approx88<\/span>，与原书「大概 <span class=\"katex-inline\">2^{90}<\/span>」吻合。<span class=\"katex-inline\">2^{128}/2^{90}=2^{38}\\approx2.7\\times10^{11}<\/span>，即即便按这一算力群，一年的计算量只覆盖 AES-128 密钥空间的约万亿分之一量级。DES 的 <span class=\"katex-inline\">2^{56}\\approx7.2\\times10^{16}<\/span>，在 1999 年专用硬件一天量级可穷尽，对比之下 56 位在当代算力条件下明显过短。<\/p>\n<h2>推导二（推演）：公钥加密的收发流程与分工<\/h2>\n<p>设 Bob 的公钥 <span class=\"katex-inline\">K_B^+<\/span> 公开，私钥 <span class=\"katex-inline\">K_B^-<\/span> 保密。Alice 给 Bob 发保密消息 <span class=\"katex-inline\">M<\/span>：第一步，Alice 从 Bob 网站取得 <span class=\"katex-inline\">K_B^+<\/span>；第二步，用 <span class=\"katex-inline\">K_B^+<\/span> 把 <span class=\"katex-inline\">M<\/span> 加密成密文 <span class=\"katex-inline\">C=E_{K_B^+}(M)<\/span>；第三步，<span class=\"katex-inline\">C<\/span> 经可被窃听的信道发出，Eve 截获 <span class=\"katex-inline\">C<\/span>，但没有 <span class=\"katex-inline\">K_B^-<\/span>，无法解密；第四步，Bob 收到 <span class=\"katex-inline\">C<\/span>，用 <span class=\"katex-inline\">K_B^-<\/span> 解密得 <span class=\"katex-inline\">M=D_{K_B^-}(C)<\/span>。密钥对的数学关联保证 <span class=\"katex-inline\">E_{K_B^+}<\/span> 与 <span class=\"katex-inline\">D_{K_B^-}<\/span> 互逆，而从公开的 <span class=\"katex-inline\">K_B^+<\/span> 推算 <span class=\"katex-inline\">K_B^-<\/span> 在密钥足够长时是徒劳的，破解时间随密钥加长呈指数型增长（PDF 第 345 页）。工程分工上，公钥加密计算量大，实际通信常混合使用：公钥加密只用来传送一把临时对称会话密钥，之后的大批量数据用对称加密快速加解密；这一分工把公钥解决分发的长处和对称加密速度快的长处接在一起（转述，原书未展开混合流程，机制为通用密码学常识）。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>算法保密当作安全依靠<\/strong>：系统方案一旦通过逆向、人员流失或泄露暴露，全部密钥体系随之失效；隐匿式安全没有可公开审查的专家群体，弱点暴露得更晚。玛丽女王、山本五十六和德军恩尼格玛的案例都因加密系统被破而付出致命代价（PDF 第 341 页）。\n<\/li><li>\n<strong>对称加密没有安全分发渠道<\/strong>：多方秘密通信前先要把同一密钥交到每个人手上，分发途中被截获，后续加密全部落空；每加一方参与者就要换发密钥，彼此无关的会话还要各配各的密钥，密钥增生让分发规模随人数膨胀（PDF 第 344–345 页）。\n<\/li><li>\n<strong>只加密传输、不保护存储与终端<\/strong>：链路窃听者拿不到明文，但终端被入侵、数据库泄露、本地文件丢失时，加密过的静态数据照样暴露；传输安全只是安全链条的一环，原书也指出好的加密很容易因人工失误而失败（PDF 第 340 页）。\n<\/li><li>\n<strong>数据全部留在本地、不依赖云<\/strong>：跨设备同步、共享文档、邮件随处可查这些便利消失；换一台机器就要手动传文件，不同系统还要分别购买程序（PDF 第 330 页）。云模型换来便利，代价是数据所有权和管理权让渡给服务商。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章是全书通信部分的收口：第 3 章讲清楚数据包怎样穿过网络，本章讲这些包在被窃听、被留存、被聚合时如何保护内容。对称与公钥加密建立在第 1 章的位与密钥空间计算之上；跟踪与聚合对应第 8 章网络留下的访问记录和第 9 章协议记录；云计算是第 6 章软件系统在网络侧的延伸。全书四章合起来构成一条路径：硬件表示信息，软件处理信息，网络传输信息，安全与数据议题决定信息在交换中如何被保护、被收集和被利用。<\/p>", "c01": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.37<\/div><h1>冯·诺依曼逻辑结构：CPU、RAM、二级存储与总线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章（原书 1.1 逻辑结构、1.1.1 CPU、1.1.2 RAM、1.1.3 硬盘和其他二级存储器，PDF 第 37–40 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>面对一台计算机，先要回答「里面有什么、各部分干什么活、谁和谁交换信息」。没有这套结构视图，看到的只是机箱、屏幕和术语；程序为什么能在同一台机器上一会儿打字、一会儿浏览网页，数据为什么断电后还在，指令和数据为什么放进同一个存储器，都无从解释。逻辑结构概念把通用计算机拆成少数职责清晰的部件，说明它们靠什么连在一起，不涉及芯片怎么制造、电路怎么布线。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>CPU（中央处理单元，Central Processing Unit）<\/strong>：处理器，进行算法计算、数据移动，并控制其他组件操作。CPU 基本操作有限，但速度极快，每秒运算次数以十亿计；它能根据前一次计算结果决定接下来的指令，因而在某种程度上独立于操作人员（PDF 第 38 页）。速度用时钟频率度量：每一下滴答叫 1 赫兹（Hz），通常以千兆赫兹（GHz）计；作者一台 2.2 GHz 处理器以每秒 22 亿次的频率运转（PDF 第 39 页）。<\/p>\n<p><strong>RAM（随机存取存储器，Random Access Memory）<\/strong>：初级内存，存储处理器和其他部件正在使用的信息。它既存 CPU 正在处理的数据，也存命令 CPU 处理数据的指令；往 RAM 里加载不同指令，就能让 CPU 做不同运算，这使存储程序的计算机成为通用目的设备（PDF 第 40 页）。「随机存取」指 CPU 可快速访问其中任意位置，按随机次序访问不会减缓速度；内容可改写，断电后通常不保留。<\/p>\n<p><strong>二级存储<\/strong>：硬盘、闪存（SSD）等长期保存程序和数据的部件，速度远低于 RAM，容量更大，断电后内容保留（PDF 第 38 页）。<\/p>\n<p><strong>总线（bus）<\/strong>：把处理器、RAM、二级存储和其他设备连在一起、互相传输信息的一组电缆（PDF 第 37 页）。<\/p>\n<p><strong>输入输出部件<\/strong>：鼠标、键盘、触摸板、显示器，以及相机、扬声器、麦克风、罗盘、加速度传感器、GPS 接收器等；手机和平板把键鼠屏融合进显示屏，另多定位与运动感应部件（PDF 第 37 页）。<\/p>\n<p>正例：一台 PC 的结构图上，CPU、RAM、硬盘、显示器、鼠标键盘都挂在同一条总线上。反例：把打印机直接焊死在 CPU 内部、不经过总线和内存，这不是通用计算机结构；专用机器可以这样做，却无法靠换指令改变用途。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>这套组织自 20 世纪 40 年代起形成规范，通常称冯·诺依曼架构；原书引用 Burks、Goldstine、von Neumann 1946 年论文：CPU 提供算法和控制，RAM 和磁盘承担记忆存储，键鼠显示器与人交互（PDF 第 38 页）。推演最小部件集合：要运算需要处理器；要保存当前程序的指令和待处理数据，需要可读写内存；要长期保存关机后仍保留的内容，需要二级存储；要接收输入、呈现结果，需要外设；部件之间要传指令和数据，需要公共通道即总线。五者缺一，通用机不成立。<\/p>\n<p>存储程序原理是结构关键：指令本身也以位模式存在 RAM 中，和数据使用同一种表示。同一台硬件换一份存进 RAM 的程序，就切换到另一项任务；文字处理、表格、浏览、邮件、报税、播放音乐可在同一台电脑上进行，只要 RAM 中存放合适的指令（PDF 第 40 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：描述通用计算机的逻辑/功能构成，不区分 PC、Mac、手机、平板；这些设备结构图相似，只是外设形态不同。\n<\/li><li>\n边界一：逻辑结构稳定，物理构造变化极快。原书指出基本功能和物理特质存在差异：运作方式很稳定，内部构造以惊人速度变化（PDF 第 36 页）。不能用部件外观推断职责，也不能用职责分工代替制造细节。\n<\/li><li>\n失败案例一：把 RAM 当长期存储。RAM 断电丢内容，程序文件必须放二级存储，启动时才加载进 RAM；成果只存内存，关机即丢失。\n<\/li><li>\n失败案例二：把 CPU 当全能计算器。CPU 只执行有限基本操作，复杂能力来自指令序列组合与高速循环；脱离内存中的指令和数据，CPU 自身不产生结果。\n<\/li><li>\n边界二：嵌入式设备、超级计算机在此结构上有变体。数码相机、电子书、GPS、家电、游戏机里都是嵌入式系统；超算有大量处理器和内存，2016 年中期最快计算机超过 1000 万个 CPU（PDF 第 91 页），核心仍是逻辑运算与相似体系结构。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>CPU vs RAM<\/strong>：CPU 运算与控制，快而小；RAM 暂存当前指令和数据，可改写、断电易失。CPU 不能长期保存结果，RAM 不做算术判断。\n<\/li><li>\n<strong>RAM vs 二级存储<\/strong>：RAM 随机存取、快、断电丢失；二级存储容量大、断电保留、慢。速度差是缓存层级存在的直接原因。\n<\/li><li>\n<strong>逻辑结构 vs 物理结构<\/strong>：前者回答部件、功能与连接；后者回答外观与制造工艺。体系结构几十年大体不变，硬件本身高速迭代。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无，本章起点。后继：c02 的位与字节是指令和数据在 RAM 中的落地形式；c04 在这套结构上展开取指—译码—执行循环与缓存层级；c07 的操作系统在这套硬件上分配 CPU、内存和磁盘；网络概念 c10 把总线换成跨机器链路。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（冯·诺依曼逻辑结构：CPU、RAM、二级存储与总线）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：一台通用计算机的部件分工与指令/数据同存机制<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把「计算机里有什么」讲到可推演，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先分清逻辑结构与物理结构<\/strong>。逻辑结构回答部件是什么、功能是什么、如何连接；物理结构回答部件外观与制造工艺。本片段只推逻辑结构，不涉及芯片怎么刻、电路怎么布线。\n<\/li><li>\n<strong>通用机 vs 专用机的分界<\/strong>。专用机器可以把功能固化在电路里；通用机要靠更换指令改变用途，因此必须有一个能保存指令的存储部件和一个能解释指令的处理器。\n<\/li><li>\n<strong>指令与数据的表示前提<\/strong>。部件之间传输的指令和数据都要落成同一种可存储、可传输的形式，即 c02 展开的位模式；本片段先假定它们已经是数值与指令编码。\n<\/li><li>\n<strong>存储的易失性分层<\/strong>。当前运行内容要能快速读写，长期保存内容断电不能丢；这两条要求对应两类存储，中间再由缓存衔接，细节见 c04。\n<\/ol>\n<p>依赖链方向：通用机需求 → 处理器 + 可读写内存 + 长期存储 + 外设 + 公共通道 → 指令与数据同存于内存 → 换程序即换任务。任何一层前提缺失，结构图就退化成专用设备的框图。<\/p>\n<h2>正向推导：从最小需求推出五个部件<\/h2>\n<h3>第一步：运算从哪里来<\/h3>\n<p>给定一项任务，机器要做算术和比较：两个数相加、判断这个数比另一个大吗、这份信息和那份相同吗。承担这些基本操作的部件是 CPU。它的操作集合不大，但执行得快，并且能依据比较结果选择下一条指令——这一条把它和只会按固定顺序算到底的计算器区分开。CPU 还控制其他组件的操作，通过总线上的信号安排和协调相连电子配件的输入输出。<\/p>\n<h3>第二步：当前工作现场放哪里<\/h3>\n<p>CPU 算一个数时，操作数和中间结果要有地方暂存；执行哪条指令也要有地方记。这个可随机读写的现场就是 RAM。把指令和数据都放进同一存储器，机器就能靠更换存储器里的指令切换任务；这是存储程序原理，也是通用目的设备成立的根据。RAM 里同时放当前运行程序的指令、这些程序处理的数据，以及让多个应用同时运行的操作系统指令。<\/p>\n<h3>第三步：关机后内容放哪里<\/h3>\n<p>RAM 断电易失，程序文件、文档、照片必须在关机后仍保留。这一层是二级存储：硬盘、闪存 SSD。它容量更大、速度更慢，职责是长期保存。开机时操作系统和启动程序从二级存储读入 RAM；运行中资料先进入 RAM 被处理；保存动作把 RAM 中的内容写回二级存储。<\/p>\n<h3>第四步：人和机器怎么交换<\/h3>\n<p>机器要接收人的输入（按键、点击、位置、运动），也要把结果呈现出来（画面、声音、振动）。这一层是输入输出部件：鼠标、键盘、显示屏、相机、扬声器、麦克风、罗盘、加速度传感器、GPS 接收器等。手机把键鼠屏融合进一块显示屏，外设形态变了，职责没变。<\/p>\n<h3>第五步：部件之间怎么传指令和数据<\/h3>\n<p>五个部件各自独立，需要一条公共通道交换指令、数据和控制信号，这条通道是总线。CPU 经总线从 RAM 取指令和数据，把结果写回 RAM；外设经总线把输入交给 CPU，把输出从总线取走。总线是一组电缆，不是 CPU 与每个部件之间各铺一根专线。<\/p>\n<h3>第六步：结构稳定，实现换代<\/h3>\n<p>这套部件划分自 20 世纪 40 年代形成规范，体系结构几十年大体不变；变化的是物理实现：真空管、晶体管、集成电路先后更替，部件更小、更便宜、更快。看一台新设备时，先按职责对号入座，再谈工艺差异。ENIAC 时代靠开关和重新布线编程，指令和数据没有都存进内存；EDSAC 于 1949 年在英国造出，才是把程序和数据存储在一起的计算机（PDF 第 32 页前后，转述）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：时钟频率与心跳对照<\/h3>\n<p>原书作者处理器标称 2.2 GHz。Giga 表示 <span class=\"katex-inline\">10^9<\/span>，时钟频率为 <span class=\"katex-inline\">2.2\\times10^9<\/span> 次/秒，即每秒 22 亿次滴答。人的心跳约 1 Hz，每天约 100000 次，每年约 3000 万次；原书对照：CPU 一秒内计算的次数，相当于人在 70 年内心跳次数的总和（PDF 第 39 页）。核对：<span class=\"katex-inline\">3\\times10^7\\times70=2.1\\times10^9<\/span>，与 <span class=\"katex-inline\">2.2\\times10^9<\/span> 同量级。这个对照只说明频率量级，不代表每次滴答都完成一次有用运算——一条指令往往需要多个时钟周期。<\/p>\n<h3>算例 2：存储分层的职责对照<\/h3>\n<p>RAM 承担当前程序的指令和数据；二级存储保存长期文件。开机：操作系统从二级存储读入 RAM；编辑：文档在 RAM 中处理；保存：写回二级存储；断电：RAM 内容消失，二级存储保留。若把草稿只留在 RAM，断电后草稿丢失。各级访问延迟的具体纳秒、毫秒数值原书未列，此处不补造；可确认的定性次序是：CPU 内部缓存最快，RAM 次之，二级存储最慢。<\/p>\n<h3>算例 3：同一硬件换程序<\/h3>\n<p>RAM 中放文字处理程序的指令，机器执行文字处理；换成浏览器指令，机器执行浏览；换成音乐播放指令，机器播放音乐。硬件没有换，任务变化来自 RAM 中指令序列的更换。反过来，若指令不能像数据一样写入 RAM，每次换任务就要重新布线或拨动开关，机器退回到布线编程时代。<\/p>\n<h3>算例 4：一个数从键盘到屏幕的分层路径<\/h3>\n<p>沿一次按键走一遍路径：手指按下键盘，键位信号经总线送入 CPU；CPU 执行输入相关指令，把键码存入 RAM 中对应输入位置；程序指令在 RAM 中取出键码、做判断（是否回车、是否退格），把字符追加到 RAM 中的文本缓冲区；需要显示时，CPU 把缓冲区内容经总线送到显示屏部件刷新画面。这条路径里，键盘是输入部件，显示器是输出部件，RAM 暂存键码与文本，CPU 完成判断与搬运，总线贯穿全程。若中间任一层缺失：键盘信号进不来，或文本无处暂存，或结果送不到屏幕，这次输入就断在对应环节。<\/p>\n<h3>算例 5：一台程序的内存现场<\/h3>\n<p>设想求一组数之和的简单程序。RAM 中要有：存放求和结果的位置、存放当前读入数值的位置、存放数据列表的位置，以及程序自身的指令序列。CPU 取一条加法指令，从 RAM 取两个数相加，结果写回 RAM；再取下一条指令。所有操作数、结果、指令都在同一存储器体系内流动，没有独立的「指令专用存储器」。指令在内存里的排列顺序决定执行顺序，跳转指令可以改变下一条取指的位置，这正是 c04 展开的控制流基础。<\/p>\n<h3>算例 6：频率量级的换算口径<\/h3>\n<p>Hz 表示每秒一次；kHz 为 <span class=\"katex-inline\">10^3<\/span>，MHz 为 <span class=\"katex-inline\">10^6<\/span>，GHz 为 <span class=\"katex-inline\">10^9<\/span>。2.2 GHz = <span class=\"katex-inline\">2.2\\times10^9<\/span> Hz。存储容量口径与此并行：kilo 在十进制为 <span class=\"katex-inline\">10^3<\/span>，在二进制语境下可能代表 <span class=\"katex-inline\">2^{10}=1024<\/span>；mega <span class=\"katex-inline\">10^6<\/span> 与 <span class=\"katex-inline\">2^{20}=1\\,048\\,576<\/span>、giga <span class=\"katex-inline\">10^9<\/span> 与 <span class=\"katex-inline\">2^{30}=1\\,073\\,741\\,824<\/span> 之间存在小幅近似偏差，原书指出在心算数量级时这种模糊通常微不足道（PDF 第 67 页）。描述设备时要分清标的是频率还是容量，两者单位同名但含义不同。<\/p>\n<h3>算例 7：嵌入式与超算的结构变体<\/h3>\n<p>数码相机、电子书、GPS、家电、游戏机里是嵌入式系统，结构被裁剪到设备所需；超级计算机配大量处理器和大量内存，2016 年中期最快计算机超过 1000 万个 CPU（PDF 第 91 页）。两者核心仍是逻辑运算加相似体系结构，差异在处理器规模、供电、大小和用途权衡。<\/p>\n<h3>算例 8：部件职责的对号入座练习<\/h3>\n<p>拿到一部智能手机，按职责归类：运算与控制由手机 SoC 中的 CPU 承担；当前运行的 App 指令与数据在 RAM；拍照原图、下载的 App、离线地图存在闪存；触摸屏是输入兼输出部件；麦克风、扬声器、加速度计、罗盘、GPS 接收器是专用输入部件；各部件经片上总线和内部互连交换信号。逐项核对时容易混淆的是 GPS 接收器与显示屏：前者只提供位置输入，后者负责画面输出，职责不能互换。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>没有可读写内存，指令只靠开关设定<\/strong>：每换一项任务都要人工重设开关或重新布线，通用机退回 ENIAC 模式；存储程序这条前提不成立。\n<\/li><li>\n<strong>RAM 与二级存储合并成一层<\/strong>：要么所有存储都断电保留但速度慢，当前程序被慢速存储拖住；要么都快速易失，关机内容全丢。易失性分层是两类需求折中的结果。\n<\/li><li>\n<strong>没有总线，部件各接专线<\/strong>：每加一个部件就要新增一组专用连线，部件数量增长时连线数量平方级膨胀，结构失去通用性。\n<\/li><li>\n<strong>CPU 不能按结果选下一步<\/strong>：比较之后只能按固定顺序执行，循环和分支都写不出来，程序能力退化为固定流程的计算器。\n<\/ul>\n<h2>延伸层：从布线编程到存储程序的结构演进<\/h2>\n<p>把时间拉开一层看结构为什么长成现在这样。早期计算设备为特殊用途设计：预测天文事件、制表人口普查。巴贝奇的分析机设想把操作指令和数据以相同方式存储，但受限于当时材料和工具未能建成。ENIAC 是第一台完全由电器组成的计算机，20 世纪 40 年代由宾州大学建造，占据一个大房间，耗电巨大，可每秒做 5000 次加法；它最初靠开关和不断重新布线设置连接来编程，指令和数据没有都保存在内存里（PDF 第 32 页前后，转述）。EDSAC 于 1949 年在英国制造，是第一个真正把程序和数据存储在一起的计算机。这一步对应结构推演里的第二步：可读写内存同时承担指令与数据。<\/p>\n<p>再往后，晶体管 1947 年发明、集成电路 1958 年发明，电子系统得以更小、更便宜、更快；部件的物理实现换代，但「处理器—内存—存储—外设—总线」的职责划分保留下来。手机、平板、智能手表、相机、GPS、家电、游戏机内部仍是同一套职责的裁剪版；超算则是这套结构的横向放大：大量处理器加大量内存，处理器可能带特殊指令，在处理某种数据时比通用处理器更快。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n若一台机器只能执行固定一套操作、不能更换指令，它缺少五个部件中的哪一个或哪一层前提？\n<\/li><li>\n为什么指令要和数据存在同一个 RAM 里，而不是各放一个存储器？\n<\/li><li>\n打开文档编辑到一半断电，文档内容取决于保存过没有；用 RAM 与二级存储的易失性解释这条现象。\n<\/li><li>\n总线和「CPU 与每个部件之间各拉一根专线」相比，在结构上有什么差别？\n<\/li><li>\n手机里的 GPS 接收器、加速度传感器对应结构图中的哪一类部件？\n<\/ol>\n<h2>补足推导：结构前提的塌陷点、执行不变量与寻址规模<\/h2>\n<h3>依赖前提去掉任一条会怎样<\/h3>\n<p>这套结构成立依赖三条前提：指令和数据以同一位模式存于 RAM；CPU 用程序计数器指向下一条待取指令；总线把 CPU、RAM 与二级存储连到一起。去掉第一条，取指通道与数据通道分离，就变成哈佛结构，不能再用同一套存储取指令和变量；去掉第二条，下一条指令位置不由计数器改写，分支与循环无法跳转到新地址，机器只能顺序执行固定死循环；去掉第三条，CPU 与内存各自孤立，指令和结果无法流动。<\/p>\n<h3>执行不变量<\/h3>\n<p>任意时刻程序计数器指向待取指令；累加器（或当前寄存器）保存最近一次运算结果；RAM 单元按地址读写。执行循环每转一圈，计数器前进到下一条指令，遇到跳转指令则改写计数器。这三个不变量保证一段程序可被逐条执行，而不依赖指令具体是哪一条。<\/p>\n<h3>寻址与吞吐算例<\/h3>\n<p>地址线有 <span class=\"katex-inline\">k<\/span> 位时可寻址 <span class=\"katex-inline\">2^k<\/span> 个内存单元；一台 32 位地址机器理论寻址空间约 <span class=\"katex-inline\">2^{32}\\approx4.3\\times10^9<\/span> 单元。2.2GHz 时钟每秒约 <span class=\"katex-inline\">2.2\\times10^9<\/span> 个周期，单个周期约 <span class=\"katex-inline\">0.45<\/span> 纳秒。玩具机求两数之和用 LOAD、ADD、STORE 三条指令，理想情况下三条周期完成一次加法；真实 CPU 靠流水与并行缩短每条指令的平均周期，但取指—译码—执行的循环次序不变。<\/p><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.65<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">冯·诺依曼逻辑结构：CPU、RAM、二级存储与总线<\/a><\/span><\/div><h1>位、字节与二进制表示：<span class=\"katex-inline\">2^N<\/span> 编码容量与位值展开<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章（原书 2.3 位、字节和二进制，2.3.1 位、2.3.2 2 的幂和 10 的幂、2.3.3 二进制数、2.3.4 字节，PDF 第 64–70 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>计算机里的文字、数字、声音、图片、程序指令最终都要落成机器能存储和传输的形式。人习惯十进制 0～9，机器却只用两种稳定状态表示信息。要算清一台机器能表示多少种状态、一个字符占多少空间、一段数据占多少存储，先得搞懂位（bit）的组合规律和二进制位值规则。不建立这套计数法，后面的编码容量、音频数据量、密钥空间、地址位数都无法推算。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>位（bit）<\/strong>：数字信息的最基本单位，取值只有 0 或 1。bit 是 binary digit（二进制数字）合并造出的词，造词者是统计学家约翰·图基，20 世纪 40 年代中期（PDF 第 64 页）。一个位表示二选一的情形（开/关、真/假、高/低）；0 与 1 各代表什么只要约定一致即可，惯例用 0 表示关、1 表示开（PDF 第 65 页）。<\/p>\n<p><strong>组合数<\/strong>：<span class=\"katex-inline\">N<\/span> 个位能表示 <span class=\"katex-inline\">2^N<\/span> 种组合，即 2 自乘 <span class=\"katex-inline\">N<\/span> 次；2 位 4 种、3 位 8 种（PDF 第 65 页）。对照十进制：<span class=\"katex-inline\">N<\/span> 个十进制位的组合数为 <span class=\"katex-inline\">10^N<\/span>，1 位 10 种、2 位 100 种。<\/p>\n<p><strong>二进制数<\/strong>：一串位按位值法则解释，底数是 2 而不是 10。第 <span class=\"katex-inline\">k<\/span> 位（从右数、从 0 起）的权值为 <span class=\"katex-inline\">2^k<\/span>；把每一位的值乘上对应权值再相加，得到十进制数值。<\/p>\n<p><strong>字节（byte）<\/strong>：成组的位，通常 8 位构成一个字节，用来表示一个字符或一段数值。ASCII 表示文本时每个字母占用 1 个字节即 8 位；第 8 位（最左边一位）在美国 ASCII 中总是 0，不携带信息，所以一种省位方法是只用 7 位（PDF 第 230 页）。<\/p>\n<p><strong>2 的幂与 10 的幂对照<\/strong>：<span class=\"katex-inline\">2^{10}=1024<\/span>，<span class=\"katex-inline\">2^{20}\\approx1.05\\times10^6<\/span>，<span class=\"katex-inline\">2^{30}\\approx1.07\\times10^9<\/span>；十进制 <span class=\"katex-inline\">10^3<\/span>（kilo）、<span class=\"katex-inline\">10^6<\/span>（mega）、<span class=\"katex-inline\">10^9<\/span>（giga）、<span class=\"katex-inline\">10^{12}<\/span>（tera）、<span class=\"katex-inline\">10^{15}<\/span>（peta）（PDF 第 67 页）。<\/p>\n<p>正例：3 位编码五类身份绰绰有余（8 种 ≥ 5 种）。反例：2 位只有 4 种组合，要编码第五类身份就不够，必须再加一位。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>组合数递推：1 个位有 2 种取值。每增加 1 位，原有每种组合都可在新位上接 0 或接 1，组合数翻倍。设 <span class=\"katex-inline\">C(N)<\/span> 为 <span class=\"katex-inline\">N<\/span> 位组合数，<span class=\"katex-inline\">C(1)=2<\/span>，<span class=\"katex-inline\">C(N)=2C(N-1)<\/span>，展开得 <span class=\"katex-inline\">C(N)=2^N<\/span>。反过来，要编码 <span class=\"katex-inline\">M<\/span> 种互斥状态，最少位数满足 <span class=\"katex-inline\">2^N\\ge M<\/span>，即 <span class=\"katex-inline\">N\\ge\\lceil\\log_2 M\\rceil<\/span>。<\/p>\n<p>位值展开：二进制数 <span class=\"katex-inline\">b_{N-1}b_{N-2}\\cdots b_1b_0<\/span> 的十进制值为<\/p>\n<div class=\"katex-block\">
