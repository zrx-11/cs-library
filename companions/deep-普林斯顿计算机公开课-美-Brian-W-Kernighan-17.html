V=\\sum_{k=0}^{N-1} b_k 2^k,\\quad b_k\\in\\{0,1\\}.<\/div>\n<p>例：二进制 1011，<span class=\"katex-inline\">b_3=1,b_2=0,b_1=1,b_0=1<\/span>，<span class=\"katex-inline\">V=1\\times2^3+0\\times2^2+1\\times2^1+1\\times2^0=8+0+2+1=11<\/span>。<\/p>\n<p>容量换算：8 位一字节可表示 <span class=\"katex-inline\">2^8=256<\/span> 种取值；16 位为 <span class=\"katex-inline\">2^{16}=65536<\/span>，即 CD 音频每个样本幅值的级数（PDF 第 61 页）；32 位约 <span class=\"katex-inline\">4.3\\times10^9<\/span>，64 位约 <span class=\"katex-inline\">1.84\\times10^{19}<\/span>。kilo 可能指 1000 也可能指 <span class=\"katex-inline\">2^{10}=1024<\/span>，数值越大两种口径偏差越明显，心算数量级时靠 2 与 10 的幂对照（PDF 第 67 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：编码互斥的离散状态；位的次序约定固定，权值从右向左递增。\n<\/li><li>\n边界一：<span class=\"katex-inline\">2^N<\/span> 计数的是等概率组合数，不代表编码效率最优。若状态出现频率悬殊，定长编码浪费容量，可换变长编码，见 c08 压缩中的霍夫曼思路。\n<\/li><li>\n失败案例一：以为位数够用就等于表示范围够。2 位 4 组合排不下第五类；编码人数、颜色、字符集前先算 <span class=\"katex-inline\">2^N<\/span> 是否覆盖目标数量。\n<\/li><li>\n失败案例二：把 kilo 一律当 1000 或一律当 1024。存储容量标称与内存地址计算常混用两种口径，核对设备参数时要先分清口径。\n<\/li><li>\n边界二：二进制只解决「表示」，不解决编码含义。同样 8 位可以表示字母、整数或颜色分量，解释方式由协议或格式约定。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>位 vs 字节<\/strong>：位是最小信息单位，只取 0/1；字节是成组的位，通常 8 位，是字符和容量计量的常用单位。\n<\/li><li>\n<strong>二进制 vs 十进制<\/strong>：底数分别为 2 和 10；位值权值分别为 <span class=\"katex-inline\">2^k<\/span> 和 <span class=\"katex-inline\">10^k<\/span>。换算靠权值展开，不是把数字符号替换掉。\n<\/li><li>\n<strong>组合数 vs 数值范围<\/strong>：<span class=\"katex-inline\">2^N<\/span> 是状态总数；有符号整数还要留一位表示正负，可用范围少于 <span class=\"katex-inline\">2^N<\/span>。位串左右读反会改变权值位置，高低位约定必须统一。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的结构中，指令和数据都以位模式存于 RAM。后继：c03 用位深度量化颜色与声音幅值；c09 校验位是在正常位之外加冗余位；c11 密钥空间直接由 <span class=\"katex-inline\">2^N<\/span> 估算蛮力攻击量级；c10 的 IPv6 地址 128 位也是同一组合规律。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（位、字节与二进制表示：$2^N$ 编码容量与位值展开）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：位组合、位值展开与容量量级的逐层推算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把二进制表示讲透，先往回追四层前提：<\/p>\n<ol><li>\n<strong>机器状态只有两种稳定取值<\/strong>。开关要么开要么关，没有中间地带；用 0 和 1 标记这两种状态，就是位。先承认离散二值前提，才有位概念。\n<\/li><li>\n<strong>单一位只能编码二选一<\/strong>。要表示更多选项，必须把多个位排成序列，让不同 0/1 组合对应不同含义。组合规律是下一层。\n<\/li><li>\n<strong>位序列既要能区分状态，也要能表示数值<\/strong>。区分状态靠组合计数；表示数值靠位值权值，两套规则都建立在 <span class=\"katex-inline\">2<\/span> 的幂上。\n<\/li><li>\n<strong>成组位对应字符与容量单位<\/strong>。8 位一组成为字节，字符、颜色分量、声音幅值、密钥长度都按字节或位宽计量；这一层把位和实际数据量连起来。\n<\/ol>\n<p>依赖链方向：二值状态 → 位序列组合 → 位值展开 → 字节与位宽容量。缺了组合计数，算不清能放多少种状态；缺了位值规则，二进制数只是符号串。<\/p>\n<h2>正向推导：从一个位到一段容量<\/h2>\n<h3>第一步：一个位的两种取值<\/h3>\n<p>位取 0 或 1。约定 0 表示关、1 表示开，反过来也可以，关键是收发双方统一。一个位编码一个二选一事实：灯亮没亮、真假、是不是、高低、进出、上下、左右、南北、东西。<\/p>\n<h3>第二步：多位组合翻倍<\/h3>\n<p>两个位：第一位 0 时第二位可取 0 或 1（00、01），第一位 1 时再取 0 或 1（10、11），共 4 种。三个位在两位的 4 种组合后各接 0、接 1，得 8 种。递推 <span class=\"katex-inline\">C(N)=2C(N-1)<\/span>，<span class=\"katex-inline\">C(1)=2<\/span>，展开 <span class=\"katex-inline\">C(N)=2^N<\/span>。枚举三个位全部组合：000、001、010、011、100、101、110、111，对应 0～7 八个编号。<\/p>\n<h3>第三步：位值规则<\/h3>\n<p>二进制数从右向左编号，第 <span class=\"katex-inline\">k<\/span> 位权值 <span class=\"katex-inline\">2^k<\/span>。最右位 <span class=\"katex-inline\">k=0<\/span>，权 <span class=\"katex-inline\">2^0=1<\/span>；左一位 <span class=\"katex-inline\">k=1<\/span>，权 <span class=\"katex-inline\">2^1=2<\/span>；再左 <span class=\"katex-inline\">2^2=4<\/span>，<span class=\"katex-inline\">2^3=8<\/span>。数 <span class=\"katex-inline\">b_{N-1}\\cdots b_0<\/span> 的值为 <span class=\"katex-inline\">V=\\sum b_k2^k<\/span>。这条规则与十进制同构，只是底数换成 2：十进制第 <span class=\"katex-inline\">k<\/span> 位权值 <span class=\"katex-inline\">10^k<\/span>。<\/p>\n<h3>第四步：位宽与表示范围<\/h3>\n<p><span class=\"katex-inline\">N<\/span> 位无符号数从 0 到 <span class=\"katex-inline\">2^N-1<\/span>，共 <span class=\"katex-inline\">2^N<\/span> 个值。8 位：0～255，<span class=\"katex-inline\">2^8=256<\/span>；16 位：0～65535，<span class=\"katex-inline\">2^{16}=65536<\/span>；32 位：0～<span class=\"katex-inline\">2^{32}-1\\approx4.29\\times10^9<\/span>；64 位：0～<span class=\"katex-inline\">2^{64}-1\\approx1.84\\times10^{19}<\/span>。若要表示负数，需让出一位做符号位，可用正数范围相应缩小。<\/p>\n<h3>第五步：字节与字符编码<\/h3>\n<p>8 位构成一个字节。ASCII 用 7 位编码字母数字，第 8 位总为 0；一个字符占 1 字节。要编码 26 个字母加大小写、数字和标点，7 位 128 种取值足够；中文等非拉丁字符一个字符常需多个字节。<\/p>\n<h3>第六步：幂次对照与口径偏差<\/h3>\n<p><span class=\"katex-inline\">2^{10}=1024<\/span> 与 <span class=\"katex-inline\">10^3=1000<\/span> 相差 2.4%；<span class=\"katex-inline\">2^{20}=1\\,048\\,576<\/span> 与 <span class=\"katex-inline\">10^6<\/span> 相差约 4.9%；<span class=\"katex-inline\">2^{30}=1\\,073\\,741\\,824<\/span> 与 <span class=\"katex-inline\">10^9<\/span> 相差约 7.4%；到 <span class=\"katex-inline\">10^{15}<\/span> 对应幂次相差约 12.6%（PDF 第 67 页）。kilo 语境下 1000 与 1024 两种口径并存，标称容量和实际地址计算要分清。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：二进制 1011 展开成十进制<\/h3>\n<p>按位值从右排：<span class=\"katex-inline\">b_0=1<\/span>（权 1），<span class=\"katex-inline\">b_1=1<\/span>（权 2），<span class=\"katex-inline\">b_2=0<\/span>（权 4），<span class=\"katex-inline\">b_3=1<\/span>（权 8）。<\/p>\n<div class=\"katex-block\">V=1\\cdot2^0+1\\cdot2^1+0\\cdot2^2+1\\cdot2^3=1+2+0+8=11.<\/div>\n<p>反向核对：11 除以 2 取余，<span class=\"katex-inline\">11=2\\times5+1<\/span>，<span class=\"katex-inline\">5=2\\times2+1<\/span>，<span class=\"katex-inline\">2=2\\times1+0<\/span>，<span class=\"katex-inline\">1=2\\times0+1<\/span>，余数从下往上为 1011，与原数一致。<\/p>\n<h3>算例 2：编码人数需要多少位<\/h3>\n<p>要给 30 个学生编号：<span class=\"katex-inline\">2^4=16&lt;30\\le32=2^5<\/span>，需要 5 位。若编号含男女两类状态再叠加，状态数翻倍，位宽按 <span class=\"katex-inline\">2^N\\ge<\/span> 总状态数重新算。只算「人数」忽略「状态维度」是常见漏算。<\/p>\n<h3>算例 3：CD 样本幅值的位深<\/h3>\n<p>CD 每个样本幅值精度为 <span class=\"katex-inline\">1/65536<\/span>，即 <span class=\"katex-inline\">2^{16}<\/span>（PDF 第 61 页）。16 位字深把幅值区间切成 65536 个等份；位深降到 8 位，只剩 256 个等份，量化间隔放大约 256 倍，底噪明显变粗。位深决定幅值分辨精度，抽样率决定时间轴分辨率，两者不是一回事。<\/p>\n<h3>算例 4：一张图的位与字节量<\/h3>\n<p><span class=\"katex-inline\">3000\\times2000=600<\/span> 万像素，每像素 RGB 三个通道，共 1800 万个光强度值（PDF 第 57 页）。若每通道用 8 位（1 字节），一张图未压缩数据量为 <span class=\"katex-inline\">1800\\times10^4\\times1\\text{ 字节}=18\\text{ MB}<\/span>；若位深加倍到 16 位每通道，字节量同步翻倍。像素数、通道数、位深三者相乘才是总位数，再除以 8 得字节数。<\/p>\n<h3>算例 5：幂次心算对照<\/h3>\n<p>记住 <span class=\"katex-inline\">2^{10}\\approx10^3<\/span>，则 <span class=\"katex-inline\">2^{20}\\approx10^6<\/span>，<span class=\"katex-inline\">2^{30}\\approx10^9<\/span>，<span class=\"katex-inline\">2^{40}\\approx10^{12}<\/span>，<span class=\"katex-inline\">2^{50}\\approx10^{15}<\/span>。估算地址空间、文件大小、密钥空间时，先用这组对照把位数换成十进制量级，再按偏差修正。<span class=\"katex-inline\">2^{128}<\/span> 约为 <span class=\"katex-inline\">3.4\\times10^{38}<\/span>，这个量级在 c11 估算 AES 密钥空间时直接引用。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>不用二值而用多值电平<\/strong>：电路要分辨更多中间电平，噪声和漂移更容易把一个值搅成相邻值，存储和传输的可靠性下降；二值状态容错空间最大。\n<\/li><li>\n<strong>位序列不规定权值次序<\/strong>：同一串 0/1 可以读出多个数值，收发双方各按各的次序解释，结果错位；位值规则和低位高位约定是协议的一部分。\n<\/li><li>\n<strong>定长位编码罕见状态<\/strong>：每种状态都占同样位数，低频状态浪费容量；变长编码让高频状态用短码，这是 c08 压缩的出发点。\n<\/li><li>\n<strong>把容量口径混用<\/strong>：标称 1 GB 按 <span class=\"katex-inline\">10^9<\/span> 字节计，系统按 <span class=\"katex-inline\">2^{30}<\/span> 字节计，显示容量「缩水」是口径差，不是文件丢失。\n<\/ul>\n<h2>延伸层：位在后续概念中的复用<\/h2>\n<p>位是全书计数的公共底座：校验位在信息位之外追加 1 位奇偶位（c09）；IP 地址按位宽区分网络号与主机号，IPv6 地址 128 位（c10）；密钥 <span class=\"katex-inline\">N<\/span> 位的空间是 <span class=\"katex-inline\">2^N<\/span>，蛮力攻击时间随位数指数增长（c11）；颜色、声音、图像的数字化精度由每通道位深决定（c03）。遇到「多少种可能、占多少空间、能表示多大范围」的问题，先回到 <span class=\"katex-inline\">2^N<\/span> 和位值展开。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n要编码 100 种互斥状态，最少需要多少位？写出不等式。\n<\/li><li>\n二进制 1101 展开成十进制是多少？写出每一位的权值。\n<\/li><li>\n8 位字节能表示多少个无符号值？范围从几到几？\n<\/li><li>\n抽样率和量化位深分别决定声音的哪一维分辨率？\n<\/li><li>\n<span class=\"katex-inline\">2^{10}<\/span> 与 1000 的偏差从哪里来，为什么大数值时近似仍可用于心算？\n<\/ol>\n<h2>再推一层：符号位、十六进制简写与 ASCII 编码对照<\/h2>\n<h3>有符号数让出一位<\/h3>\n<p>无符号 <span class=\"katex-inline\">N<\/span> 位覆盖 0 到 <span class=\"katex-inline\">2^N-1<\/span>。要表示负数，约定最高位为符号位：0 表示非负、1 表示负，剩下 <span class=\"katex-inline\">N-1<\/span> 位参与数值编码。可用正数范围相应缩小；同样 8 位，无符号覆盖 0～255，有符号口径下能表达的正负区间宽度少于 256 个状态。讨论整数范围时先分清无符号还是有符号，不能直接套用 <span class=\"katex-inline\">2^N<\/span> 当正负数总数。<\/p>\n<h3>十六进制作为位串的简写<\/h3>\n<p>一个十六进制位对应 4 位二进制（<span class=\"katex-inline\">2^4=16<\/span>）。32 位地址或机器码写成 8 个十六进制字符，比 32 个 0/1 易读；换算时每 4 位一组，0～9 对应 0000～1001，A～F 对应 1010～1111。URL 百分号编码里的两位十六进制（如 %27、%22、%2D）就是按这套简写还原成一个字节，这是位宽规则在网络编码上的复用。<\/p>\n<h3>ASCII 字符位模式对照<\/h3>\n<p>ASCII 每个字符占 1 字节 8 位，第 8 位在美国 ASCII 中总为 0，实际用 7 位 128 个取值覆盖大小写字母、数字与标点。字母 x 与 X 在编码上只差一个位：八进制 78 与 58，二进制 01111000 与 01011000（PDF 第 349 页前后）。编码表把字符映射成固定位模式，存储、传输、比对都按位模式处理；换一套字符集（如中文编码），同样一个字符的字节数和位模式都会改变。<\/p>\n<h3>容量换算连算<\/h3>\n<p>一张 <span class=\"katex-inline\">3000\\times2000<\/span>、每通道 8 位的 RGB 图：位数 <span class=\"katex-inline\">=3000\\times2000\\times3\\times8=1.44\\times10^8<\/span> 位，除以 8 得 18 MB。CD 音频每秒 <span class=\"katex-inline\">44100\\times2\\times16=1.41\\times10^6<\/span> 位，约 176 KB/s；按 4 分钟 240 秒计约 42.3 MB。这两个例子把像素/样本、通道、位深三层相乘再换算成字节，与 c03 的抽样量化、c08 的压缩数据量直接衔接。<\/p>\n<h2>再推一层：补码减法与位宽上界连算<\/h2>\n<h3>补码把减法并入加法<\/h3>\n<p>有符号整数在机器里用补码（two&#x27;s complement）表示：<span class=\"katex-inline\">N<\/span> 位下负数 <span class=\"katex-inline\">-x<\/span> 的编码取 <span class=\"katex-inline\">2^N-x<\/span>。做减法 <span class=\"katex-inline\">a-b<\/span> 时，硬件把 <span class=\"katex-inline\">-b<\/span> 的补码与 <span class=\"katex-inline\">a<\/span> 按位相加，超出最高位的进位直接丢弃。以 8 位为例：<span class=\"katex-inline\">5-3<\/span>，<span class=\"katex-inline\">5=00000101<\/span>，<span class=\"katex-inline\">-3=256-3=253=11111101<\/span>，两数相加得 258，丢掉第 9 位进位后余 <span class=\"katex-inline\">2=00000010<\/span>，结果正确。同一套加法电路既算正数相加也算减法，不必另设减法器。<\/p>\n<h3>有符号范围随位宽收缩<\/h3>\n<p><span class=\"katex-inline\">N<\/span> 位补码的可表示区间是 <span class=\"katex-inline\">-2^{N-1}<\/span> 到 <span class=\"katex-inline\">2^{N-1}-1<\/span>。8 位覆盖 <span class=\"katex-inline\">-128<\/span> 到 <span class=\"katex-inline\">127<\/span>；16 位无符号覆盖 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">65535<\/span>，有符号覆盖 <span class=\"katex-inline\">-32768<\/span> 到 <span class=\"katex-inline\">32767<\/span>；32 位无符号上限约 <span class=\"katex-inline\">4.29\\times10^9<\/span>；64 位无符号上限约 <span class=\"katex-inline\">1.84\\times10^{19}<\/span>。判断两个数相加是否溢出，要看结果符号位与操作数是否矛盾，不能只看数值大小。<\/p>\n<h3>位模式的等价视角<\/h3>\n<p>同一组 0/1 位按不同解释会得到不同含义：作为整数是数值，作为指令是操作码，作为字符是编码，作为颜色是通道分量。硬件并不替位串做语义判断，解释方式由加载它的程序约定；位宽决定能容纳的状态数，解释规则决定状态如何映射到现实对象。<\/p>\n<h2>补足推导：<span class=\"katex-inline\">2^N<\/span> 的归纳证明、位序不变量与掩码算例<\/h2>\n<h3>组合数递推的归纳证明<\/h3>\n<p>记 <span class=\"katex-inline\">C(N)<\/span> 为 <span class=\"katex-inline\">N<\/span> 位能表示的组合数。基例 <span class=\"katex-inline\">C(1)=2<\/span>（0 与 1）。归纳步：前 <span class=\"katex-inline\">N-1<\/span> 位的每种组合，在第 <span class=\"katex-inline\">N<\/span> 位上可接 0 或接 1，组合数翻倍，<span class=\"katex-inline\">C(N)=2C(N-1)<\/span>。展开得 <span class=\"katex-inline\">C(N)=2\\times2^{N-1}=2^N<\/span>。要编码 <span class=\"katex-inline\">M<\/span> 种互斥状态，最少位数满足 <span class=\"katex-inline\">2^N\\ge M<\/span>，即 <span class=\"katex-inline\">N\\ge\\lceil\\log_2 M\\rceil<\/span>；<span class=\"katex-inline\">M=5<\/span> 时 <span class=\"katex-inline\">2^2=4&lt;5\\le2^3=8<\/span>，需 3 位。<\/p>\n<h3>位序不变量<\/h3>\n<p>位值展开 <span class=\"katex-inline\">V=\\sum b_k2^k<\/span> 依赖位序约定：从右数、从 0 起编号。约定一旦固定，交换两位就改变对应权值，数值随之改变；若没有统一位序，同一个位串无法解释成唯一数值。<\/p>\n<h3>掩码与规模算例<\/h3>\n<p>取 8 位的低 4 位，掩码为 <code>00001111<\/code>（十进制 15），按位与后保留低 4 位、高 4 位清 0。规模换算：<span class=\"katex-inline\">3000\\times2000<\/span> 像素、RGB 三通道、每通道 8 位，位数 <span class=\"katex-inline\">=3000\\times2000\\times3\\times8=1.44\\times10^8<\/span> 位，除以 8 得 18 MB。CD 音频每秒 <span class=\"katex-inline\">44100\\times2\\times16=1.4112\\times10^6<\/span> 位，约 176.4 KB/s；<span class=\"katex-inline\">2^{20}=1{,}048{,}576<\/span> 个不同取值需要 20 位编码。<\/p><\/div><\/details>", "c03": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.57<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">位、字节与二进制表示：$2^N$ 编码容量与位值展开<\/a><\/span><\/div><h1>模拟与数字：抽样、量化与模数转换<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章（原书 2.1 模拟和数字、2.2 模数转换，PDF 第 54–62 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>真实世界的量多是连续平滑的：水龙头开度、方向盘转角、体温计液柱高度、声音气压波动。计算机只处理离散的位，不能直接存下一条连续曲线。要让图片、声音、温度这些模拟量进得了计算机，必须解决两件事：沿时间或空间按固定间隔取点（抽样），把每个点的连续幅值落到有限个离散档位（量化）。不搞清这两步，就解释不了为什么音频有采样率和位深、图片有像素和颜色通道，也判断不了数字化会丢掉什么。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>模拟（Analog）<\/strong>：数值随事物平滑连续变化，与「类似（Analogous）」同根；一个微小改变会引起另一对象成比例的平滑变化，没有离散步骤（PDF 第 54 页）。例：模拟时钟指针、速度计指针、体温计液柱都平滑连续运动。<\/p>\n<p><strong>数字（Digital）<\/strong>：处理离散数据，可能取值数量固定；开关信号不是开就是关，一个对象的微小改变可能让对方毫无改变，或突然从一个离散值跳到另一个（PDF 第 54 页）。电子表每秒显示一个新分钟值，从来没有小数秒；数字温度计把 36.5～37.5 之间的温度都显示为 37。<\/p>\n<p><strong>模数转换（A/D 转换）<\/strong>：把模拟量按固定间隔测量曲线高度（气压、光强等），测得的数值形成与曲线相符的数列，这串数列就是波形或图像的数字表现形式；进行模数转换的设备叫模数转换器。反向把数值转换成电压或电流模式驱动扬声器、显示器，是数模转换（D/A）（PDF 第 60–61 页）。<\/p>\n<p><strong>抽样<\/strong>：在固定时间间隔上取幅值点。图像抽样在空间维度：镜头聚焦到长方形感光探头阵列，每个探头根据接收光量存储电荷，电荷转成数值；传感区每个元素由一组测量红绿蓝的探头组成，一组叫一个像素（pixel）。<span class=\"katex-inline\">3000\\times2000<\/span> 像素即 600 万个图像元素，每像素记录红、绿、蓝三通道强度，合计 1800 万个光强度值（PDF 第 57 页）。<\/p>\n<p><strong>量化<\/strong>：把连续幅值归到有限档位。CD 标准每秒取样 44100 个，每个样本取左右声道两个幅值，幅值精度为 <span class=\"katex-inline\">1/65536<\/span>，即 <span class=\"katex-inline\">2^{16}<\/span>（PDF 第 61 页）。位深越小，档位越粗，相邻量化级之间的差值越大。<\/p>\n<p><strong>转换损失<\/strong>：A/D 与 D/A 两个方向从来都不完美，每个方向都会丢东西；对多数人损失无法察觉，发烧友声称 CD 音质不如 LP（PDF 第 61 页）。<\/p>\n<p>正例：声音波形在固定间隔上竖起竖线，每根竖线高度是一个样本；把这些样本存成数列，播放时再连成电压波形。反例：不抽样直接存整条连续曲线，计算机没有对应可存储的离散形式。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>图片数字化链条：光学镜头 → 感光阵列像素 → 每像素 RGB 三通道电荷 → 电荷转数值 → 数值数列。探头越多、每个探头越小，电荷测量越精确，数字化图片捕捉的原始图像越准确（PDF 第 57 页）。<\/p>\n<p>声音数字化链条：声源在气压中制造波动 → 麦克风测量压力变化 → 固定间隔抽样得到幅值数列 → 量化到有限档位 → 存储为数字音频；回放时数值转电压/电流驱动扬声器，再变回气压波动（PDF 第 60 页）。<\/p>\n<p>数据量估算：每秒位数 = 抽样率 × 声道数 × 量化位数。CD：<span class=\"katex-inline\">44100\\times2\\times16=1\\,411\\,200<\/span> 位/秒，除以 8 得 <span class=\"katex-inline\">176\\,400<\/span> 字节/秒，约 172 KB/s。抽样率决定能还原的频率上限，量化位深决定幅值分辨精度；两条线相互独立。<\/p>\n<p>数字化的处理优势：数字数据可存储、传输、压缩、加密、精确复制并跨设备流转，这些对模拟信息很难做到（PDF 第 55 页）；旧媒介（石刻、纸、胶片）则能以数字形式做不到的方式经受时间考验（PDF 第 56 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：被测量的模拟量在抽样间隔内变化足够平缓，抽样率高于要保留的变化频率；幅值变化范围落在量化档位覆盖内。\n<\/li><li>\n边界一：抽样率不足，快速变化被混叠成低频假象；量化位深不足，平滑梯度出现阶梯断层，底噪变粗。\n<\/li><li>\n失败案例一：把抽样点数等同于清晰度。图片清晰度还受像素密度、镜头与编码影响；声音听感不只取决于抽样率，位深和压缩同样参与。\n<\/li><li>\n失败案例二：以为数字转换无损。两个方向都会丢东西，只是多数情况下人察觉不到；CD 与 LP 的音质争议正源于此（PDF 第 61 页）。\n<\/li><li>\n边界二：压缩分无损与有损。无损可完全还原源文件；有损舍弃人眼人耳难分辨的细节，JPEG、MP3/AAC 把视听内容压到约十分之一而几乎不觉察（PDF 第 62、231 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>模拟 vs 数字<\/strong>：连续平滑取值 vs 离散固定档位；模拟量微小改变成比例传导，数字量可能跨档跳变。\n<\/li><li>\n<strong>抽样 vs 量化<\/strong>：抽样决定时间/空间上取多少个点，量化决定每个点幅值分多少档；一个是密度问题，一个是精度问题。\n<\/li><li>\n<strong>A/D vs D/A<\/strong>：模拟转数字进机器，数字转模拟出机器；方向相反，损失都存在。\n<\/li><li>\n<strong>无损 vs 有损压缩<\/strong>：无损可完全还原源文件；有损只保留人感知得到的部分，解不出被舍弃的细节。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 的位深与组合数是量化档位的计数基础。后继：c08 把压缩思路扩展到通用数据，其带宽要承载数字化后的图像音频数据量；c11、c12 的加密处理的都是已经数字化的数据。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（模拟与数字：抽样、量化与模数转换）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：连续模拟量如何被抽样、量化成可计算的数字数列<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把模拟量讲成可推演的过程，先往回追四层前提：<\/p>\n<ol><li>\n<strong>被测量是连续变化的物理量<\/strong>。声音是气压随时间的波动，图像是光强随位置的分布，温度是液柱高度随热度的变化。先承认连续性，才谈得上在哪取点。\n<\/li><li>\n<strong>机器只认离散位<\/strong>。计算机存储和处理的是 0/1 构成的离散数值，连续曲线无法直接落进位模式；中间必须有一层转换，即 A/D。\n<\/li><li>\n<strong>抽样与量化是两个独立动作<\/strong>。抽样解决「在哪里取点」，量化解决「每个点记成哪个档位」；二者精度分开核算，不能混为一谈。\n<\/li><li>\n<strong>还原是反向动作<\/strong>。播放显示时 D/A 把数列变回电压、光强或气压；两个方向都有损失，还原不是原样复制。\n<\/ol>\n<p>依赖链方向：连续物理量 → 空间/时间抽样 → 幅值量化 → 位数列 → 机器处理 → D/A 还原。缺抽样只有少量散点，缺量化每个点仍是连续值；两者都到位，模拟量才进入数字世界。<\/p>\n<h2>正向推导：从一条波形到一串样本<\/h2>\n<h3>第一步：把物理量画成连续曲线<\/h3>\n<p>声音：声源震动在气压中制造波动，纵轴压力，横轴时间，每秒波数是音高或频率（图 2-4，PDF 第 60 页）。图像：二维平面上每个位置的红、绿、蓝光强。温度：液柱高度随热度线性膨胀。<\/p>\n<h3>第二步：沿一个轴固定间隔取点<\/h3>\n<p>声音在固定时间间隔用麦克风测量曲线高度，得到图 2-5 那样的竖线序列；图像在空间上由感光阵列把画面切成行列探头，每个探头量一处光强。抽样越频繁、越准确，数列与原始曲线的相似度越高（PDF 第 60 页）。<\/p>\n<h3>第三步：每个点的幅值归到离散档位<\/h3>\n<p>连续幅值有无限多个中间值，机器存不下；把量程切成有限等份，每个样本落到最近档位，这是量化。档位数量由位深决定：<span class=\"katex-inline\">B<\/span> 位对应 <span class=\"katex-inline\">2^B<\/span> 档。CD 用 16 位，<span class=\"katex-inline\">2^{16}=65536<\/span> 档，相邻档差为满量程的 <span class=\"katex-inline\">1/65536<\/span>（PDF 第 61 页）。<\/p>\n<h3>第四步：多通道与多样本组合成数据块<\/h3>\n<p>图像每像素 RGB 三组探头，三通道各记一个强度值；音频立体声左右两个声道各记一个幅值。时间轴上样本逐个排列，空间轴上像素逐行排列，组成二维或多维数值阵列。<\/p>\n<h3>第五步：存储、处理与反向还原<\/h3>\n<p>数值数列可存储、复制、压缩、加密、传输；回放时设备把数值转换成对应电压或电流模式驱动扬声器或显示屏，再把数字变回模拟声波或画面（PDF 第 60 页）。<\/p>\n<h3>第六步：识别损失来源<\/h3>\n<p>抽样损失：间隔内的波形形状没有记录；量化损失：档位之间的小差别被舍入；转换损失：A/D、D/A 两个方向都不完美。多数损失人耳人眼无法察觉，发烧友群体对 CD 与 LP 的评价分歧即是例证（PDF 第 61 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：CD 音频每秒与每首的数据量<\/h3>\n<p>抽样率 44100 次/秒，声道 2，位深 16 位。 每秒位数 <span class=\"katex-inline\">=44100\\times2\\times16=1\\,411\\,200<\/span> bit/s；换算字节除以 8：<span class=\"katex-inline\">176\\,400<\/span> B/s，约 172.3 KB/s。 4 分钟 = 240 秒：<span class=\"katex-inline\">176\\,400\\times240=42\\,336\\,000<\/span> B，约 40.4 MB。这是未压缩 PCM 量级；MP3/AAC 约压到十分之一，4 分钟乐曲约 4 MB 上下（压缩比为原书给的约数，PDF 第 62 页）。<\/p>\n<h3>算例 2：一张数码照片的数值规模<\/h3>\n<p><span class=\"katex-inline\">3000\\times2000=6\\,000\\,000<\/span> 像素；每像素 RGB 三通道，强度值总数 <span class=\"katex-inline\">6\\times10^6\\times3=1.8\\times10^7<\/span>，即 1800 万个光强度值（PDF 第 57 页）。每通道 8 位（1 字节）时，未压缩字节量 <span class=\"katex-inline\">1.8\\times10^7<\/span> B，约 17.2 MB；JPEG 压到 10 倍或更多，同一张图可落在 1～2 MB 量级（压缩倍数依画面细节与质量设置而定，转述）。<\/p>\n<h3>算例 3：位深与量化间隔<\/h3>\n<p>满量程幅值归一到 <span class=\"katex-inline\">[-1,1]<\/span>，总跨度 2。16 位：档位间隔 <span class=\"katex-inline\">2/65536\\approx3.05\\times10^{-5}<\/span>；8 位：<span class=\"katex-inline\">2/256\\approx7.81\\times10^{-3}<\/span>，间隔放大约 256 倍。位深每减 1 位，档位减半、间隔翻倍；位深每加 1 位，档位翻倍、间隔减半。<\/p>\n<h3>算例 4：抽样率的频率对应（定性）<\/h3>\n<p>抽样率决定时间轴能分辨的最快变化；CD 44100 次/秒覆盖人耳可听频段。若信号变化快于抽样间隔的一半，相邻样本来不及反映波动，就会出现混叠。这一频率上界的严格定理属于信号处理教材范围，原书只给抽样直觉，此处不展开公式。<\/p>\n<h3>算例 5：帧率与运动错觉<\/h3>\n<p>电影每秒 24 帧，电视约 25～30 帧（PDF 第 62 页）。快速连续显示一系列静态图片产生运动错觉；帧频越低，快速动作越容易卡顿或跳变。这是时间轴抽样在视频上的对应：画面仍是逐帧离散样本。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>不抽样，只存整条连续曲线<\/strong>：机器要记录无限多个位置的精确幅值，存储量不可穷尽；离散数列正是为了用有限点近似连续曲线。\n<\/li><li>\n<strong>抽样率不变、位深压到很低<\/strong>：时间轮廓还在，但幅值粗成少数几级，平滑音量和音色出现断层，底噪颗粒感加重。\n<\/li><li>\n<strong>量化位深不变、抽样率压低<\/strong>：幅值精度保留，但快速变化被漏掉，高频发闷，运动画面出现拖影。\n<\/li><li>\n<strong>数字化不做压缩<\/strong>：按上面算例的未压缩量级，音频和图片在网络带宽与存储上都难以承受；压缩是在冗余与感知门槛之间取舍（c09 展开）。\n<\/ul>\n<h2>延伸层：模拟媒介的长存优势<\/h2>\n<p>数字化换来可处理性，却没有在所有维度占优。陶土板、石刻、羊皮纸、纸和相机胶片这些旧媒介，可以用数字形式做不到的方式经受时间考验（PDF 第 56 页）。数字副本可能因胶片式光敏染料随时间改变而较快失效；介质老化、格式淘汰、存储迁移都是数字保存要额外处理的问题。理解取舍时，不把「数字优于模拟」当成全称判断。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n抽样和量化分别决定声音的哪一维？把两者互换会出什么问题？\n<\/li><li>\n16 位量化把量程分成多少档？间隔相对满量程是多少？\n<\/li><li>\n按 CD 参数算 3 分钟未压缩音频的字节量。\n<\/li><li>\n为什么 JPEG 可以删掉人眼分辨不出的颜色细节而不算「损坏」？\n<\/li><li>\n列举一种模拟媒介比数字媒介更耐久的情形，并说明它对应数字化的哪项损失。\n<\/ol>\n<h2>再推一层：抽样与量化的两条分辨率线，以及数字化损失的去向<\/h2>\n<h3>抽样沿时间轴离散化<\/h3>\n<p>连续波形按固定时间间隔取幅值，这个间隔对应抽样率：CD 每秒取 44100 个样本。抽样率越高，单位时间内样本越密，能还原的高频细节越多；抽样率下降，高频成分先丢失，听感上高频发闷。相邻样本之间的波形细节在离散化那一刻不再保留，A/D 转换只保存各采样点的量化值，不保存两点之间的连续形状。<\/p>\n<h3>量化沿幅值轴分层<\/h3>\n<p>每个样本的连续幅值要落到有限个离散档位上。CD 精度 <span class=\"katex-inline\">1/65536=2^{16}<\/span>，即 16 位把幅值区间切成 65536 个等份；位深降到 8 位只剩 256 档，量化间隔放大约 256 倍，小幅度变化被并入相邻档位，底噪变粗。量化误差是幅值轴上的固有损失，档位越密误差越小，但每样本占用位深同步增加。<\/p>\n<h3>图片数字化的两条线对照<\/h3>\n<p>图片把空间网格化：<span class=\"katex-inline\">3000\\times2000<\/span> 是像素网格密度，RGB 三通道各记一个强度值，强度档位由每通道位深决定（PDF 第 57 页）。空间网格密度对应声音的抽样率，颜色/亮度档位对应声音的量化位深；两条线分开核算，不能用提高位深弥补像素不足，也不能用增加像素弥补颜色档位粗。<\/p>\n<h3>双向转换都有损失<\/h3>\n<p>D/A 把数值变回模拟波形时，相邻样本之间按插值重建，丢失的高频细节回不来；A/D 与 D/A 两个方向都存在损失（PDF 第 61 页）。无损数字化要求抽样率和位深足够高，把损失压到人耳人眼不可察觉；有损压缩（JPEG、MP3/AAC）则主动舍弃不易察觉的细节换更高压缩比，这一步已超出模数转换本身，进入 c08 的压缩范畴。<\/p>\n<h3>未压缩数据量连算<\/h3>\n<p>CD 每秒 <span class=\"katex-inline\">44100\\times2\\times16=1.4112\\times10^6<\/span> 位，约 176.4 KB/s；3 分钟 180 秒约 31.7 MB，4 分钟约 42.3 MB。图片 <span class=\"katex-inline\">600<\/span> 万像素、RGB 三通道、每通道 8 位，约 18 MB/张。这些原始量级解释了为什么音频图片需要压缩，也为 c08 估算压缩比提供未压缩基线。<\/p>\n<h2>再推一层：量化误差与抽样率下限连算<\/h2>\n<h3>量化步长与误差上界<\/h3>\n<p>满量程幅值被 <span class=\"katex-inline\">2^b<\/span> 个量化级均分，相邻两级间距为满量程 <span class=\"katex-inline\">/2^b<\/span>，单个样本的量化误差不超过半个步长。16 位音频有 <span class=\"katex-inline\">2^{16}=65536<\/span> 个量级；位深每增加 1，级数翻倍、步长减半，误差随位深线性收紧而非随样本数平均掉。抽样率决定时间维分辨率，量化位深决定幅值维分辨率，二者独立，需分别选取。<\/p>\n<h3>抽样率下限与混叠<\/h3>\n<p>要不失真还原最高频率为 <span class=\"katex-inline\">f<\/span> 的信号，抽样率须不低于 <span class=\"katex-inline\">2f<\/span>（转述：奈奎斯特抽样定理）。CD 取 44100 次/秒，对应可还原约 20 kHz 以内的声音；若抽样率低于信号最高频率两倍，高频成分会折回低频，形成混叠（aliasing），事后无法靠滤波分离。模数转换先抽样后量化，数字世界拿到的只是离散幅值序列。<\/p>\n<h3>连续信号到离散序列的完整链条<\/h3>\n<p>模拟信号是时间与幅值都连续的波形：先在时间轴上按固定间隔抽样，得到一串时刻点上的瞬时幅值；再把每个幅值就近落到有限个量化级上，得到有限位的整数；最后编码成字节流存储或传输。反向重建时，解码器把离散整数还原成阶梯幅值，经低通滤波平滑回近似波形。抽样越密、量化级越多，重建波形与原波形越接近，但存储与传输的数据量同步上升，这正是数字化始终要在保真与码率之间取舍的根因。<\/p>\n<h3>误差来源分层记账<\/h3>\n<p>数字化链条上有两类独立误差：抽样丢失两采样点之间的波形细节，量化把连续幅值压到有限级别。分析失真时先判定问题出在哪一维，再决定提高抽样率还是提高位深，不能用提高其中一维来掩盖另一维的不足；二者数据量都按乘积增长，联合提升时码率上升得更快。<\/p>\n<h2>补足推导：量化误差上界、抽样下限与数据量连算<\/h2>\n<h3>量化误差的来源与上界<\/h3>\n<p>满量程幅值被 <span class=\"katex-inline\">2^b<\/span> 个量化级均分，相邻级间距 <span class=\"katex-inline\">\\Delta=\\mathrm{FS}/2^b<\/span>。任一连续幅值就近落到某一级，量化误差不超过半个步长 <span class=\"katex-inline\">\\Delta/2<\/span>；这个误差是幅值量化引入的固定偏差，不会随重复采样被平均掉。位深每加 1，级数翻倍、步长减半，误差上限随之减半。<\/p>\n<h3>抽样率下限与混叠<\/h3>\n<p>要不失真还原最高频率为 <span class=\"katex-inline\">f<\/span> 的信号，抽样率须不低于 <span class=\"katex-inline\">2f<\/span>（转述：奈奎斯特抽样定理）。CD 取 44100 次/秒，对应可还原约 20 kHz 以内的声音；抽样率低于信号最高频率两倍时，高频折回低频形成混叠，事后无法靠滤波分离。抽样决定时间维密度，位深决定幅值维精度，两者独立。<\/p>\n<h3>数据量连算<\/h3>\n<p>每秒位数 <span class=\"katex-inline\">=<\/span> 抽样率 <span class=\"katex-inline\">\\times<\/span> 声道数 <span class=\"katex-inline\">\\times<\/span> 量化位数。CD：<span class=\"katex-inline\">44100\\times2\\times16=1.4112\\times10^6<\/span> 位/秒，除以 8 得 176.4 KB/s；10 秒立体声约 1.764 MB，4 分钟（240 秒）约 42.3 MB。<span class=\"katex-inline\">3000\\times2000<\/span> 图、RGB 三通道、每通道 8 位约 18 MB/张。这两组未压缩量级是 c08 估算压缩比的基线。<\/p><\/div><\/details>", "c04": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.77<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">冯·诺依曼逻辑结构：CPU、RAM、二级存储与总线<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">位、字节与二进制表示：$2^N$ 编码容量与位值展开<\/a><\/span><\/div><h1>CPU 执行机制与多级缓存：取指—译码—执行、累加器与局部性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章（原书 3.1 玩具计算机、3.2 真实的 CPU、3.3 缓存，PDF 第 77–90 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>第 1 章把 CPU 称作计算机的「大脑」，但「大脑」这个比喻回答不了机制问题：一条指令从哪里来、CPU 怎么知道要做什么、算完的结果放哪里、为什么程序重复运行第二次更快。要把这些讲清楚，需要一台指令集极简的纸面机器把执行循环摊开，再解释真实 CPU 周围为什么叠出多级缓存。不理解执行循环，后面算法、编译、操作系统里的「程序跑起来」都只是黑箱；不理解缓存局部性，就解释不了存储层级的速度差。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>指令系统<\/strong>：CPU 能执行的基本操作集合，包含加减乘除等算术运算、从 RAM 取数、把结果存回 RAM、比较两个数字并按结果决定下一步（PDF 第 76 页）。指令集合不大，但 CPU 每秒可执行数十亿次运算，复杂处理由指令序列组合完成。<\/p>\n<p><strong>累加器（accumulator）<\/strong>：玩具计算机上一块额外的存储区，容量只够存一个数值，类似计算器显示屏，保存最近输入的数值或最近计算的结果（PDF 第 77 页）。<\/p>\n<p><strong>玩具计算机指令表<\/strong>：原书图 3-1 列出 6 条：GET 读键盘入累加器，PRINT 打印累加器，STORE M 把累加器副本存入内存 M，LOAD M 把内存 M 载入累加器，ADD M 把内存 M 加到累加器，STOP 停止执行（PDF 第 77 页）。<\/p>\n<p><strong>执行循环<\/strong>：运行时 CPU 从 RAM 第一个位置开始，重复三步——Fetch 从 RAM 取下一条指令；Decode 解析指令内容；Execute 执行该指令，然后返回取指（PDF 第 77 页）。<\/p>\n<p><strong>缓存（cache）<\/strong>：计算领域广泛适用的思想。CPU 中缓存是容量小但速度快的内存，存放最近使用的信息，以避免访问 RAM；典型 CPU 有 2～3 个缓存，容量依次增大、速度递减，一般称一级、二级、三级缓存；最大缓存能存以兆字节计的数据，作者笔记本每个核心配 256KB 二级缓存和单个 4MB 三级缓存（PDF 第 89–90 页）。<\/p>\n<p><strong>局部性<\/strong>：缓存有用的关键在于，最近用过的信息很可能再次被用到；缓存通常一次性加载一组信息块，比如只请求一个字节，也会加载 RAM 中一段连续地址，相邻信息也可能被用到，邻近引用同样不必等待（PDF 第 90 页）。<\/p>\n<p>正例：求和循环里 6 条指令对每个输入数值执行一遍，指令存在缓存中就不必每轮从 RAM 重读；把求和变量存在数据缓存中也能提高访问速度（PDF 第 89 页）。反例：程序随机跳遍巨大地址空间，缓存块命中率低，缓存提速作用有限。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>推演玩具程序求两数之和：LOAD X 把 X 载入累加器，ADD Y 把 Y 加到累加器，STORE Z 把结果存到 Z（PDF 第 124 页的汇编对照）。三条指令各走一遍执行循环：取指、译码、执行；LOAD 与 STORE 完成累加器与内存之间的搬运，ADD 在累加器内完成加法。<\/p>\n<p>执行循环能自主运行的根据是 CPU 可以比较数字（这个数比另一个大吗、两份信息相同吗），并基于结果决定下一步；这使机器在没有人工介入的情况下自主运行（PDF 第 76 页）。跳转指令改变下一条取指的位置，循环和分支由此成立。<\/p>\n<p>缓存层级推演：越靠近 CPU 的存储越小越快，越往下越大越慢。CPU 先查一级缓存，未命中再查二、三级，最后才访问 RAM；一次加载连续块，利用空间局部性。缓存思想不限于 CPU：RAM 可作磁盘缓存，RAM 与磁盘又可作网络数据缓存；浏览器本地保存网页大资源副本，再访问时不必重新下载，缓存满后旧项目被替换（PDF 第 90 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：程序访问具有时间局部性（刚用过的很快再用）或空间局部性（用过附近地址）；缓存块大小与程序访问模式匹配。\n<\/li><li>\n边界一：缓存提速掩盖下层存储等待，但不改变下层速度；缓存未命中时仍要付慢速访问代价。\n<\/li><li>\n失败案例一：把缓存当永久存储。缓存内容会被新项目替换，断电或退出后不保证保留；Word、Firefox 第二次启动快，是因为程序指令还在 RAM，使用其他程序一段时间后，原程序从缓存中被挤出（PDF 第 90 页）。\n<\/li><li>\n失败案例二：跨 CPU 比速度只看主频。同样求和，不同处理器指令条数、并行能力、缓存命中与功耗调速都不同，快慢要结合具体任务判断（PDF 第 89 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>累加器 vs RAM 位置<\/strong>：累加器只存一个当前值，是 CPU 内的工作单元；RAM 位置存放长期变量与程序指令，可随机读写。\n<\/li><li>\n<strong>指令 vs 数据<\/strong>：在存储程序机里两者都以位模式存于 RAM，CPU 取指阶段把当前位置解释为指令，执行阶段把操作数位置解释为数据。\n<\/li><li>\n<strong>缓存 vs 二级存储<\/strong>：缓存快而小、内容可替换；二级存储慢而大、断电保留。RAM 对磁盘是缓存，磁盘对网络数据也可承担缓存角色。\n<\/li><li>\n<strong>主频 vs 吞吐<\/strong>：时钟频率是每秒滴答次数；实际吞吐还取决于指令条数、并行能力、缓存命中与功耗调速，不能只拿 GHz 比快慢。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的结构给出 CPU、RAM、总线职责；c02 的位模式是指令和数据的表示形式。后继：c05 算法步骤最终在执行循环上落地；c07 编译器把高级语言翻译成这套指令；操作系统 c07 负责把 CPU 时间分给各进程；缓存局部性思路在 c08 网络缓存、c10 浏览器缓存中复用。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（CPU 执行机制与多级缓存：取指—译码—执行、累加器与局部性）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：一条指令从 RAM 到结果的执行全程，以及缓存层级为什么快<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把 CPU 机制讲成可推演过程，先往回追四层前提：<\/p>\n<ol><li>\n<strong>指令和数据都已落在 RAM 中<\/strong>。这是 c01 存储程序原理的结论：程序指令与操作数以位模式存在同一存储器体系里，CPU 才能逐条取指。\n<\/li><li>\n<strong>CPU 有一个能暂存当前值的工作单元<\/strong>。二进制运算需要一个地方放被加数、中间结果和最终结果，这就是累加器；没有它，每步中间值都要来回倒腾内存。\n<\/li><li>\n<strong>指令要有可读解的操作码和操作数地址<\/strong>。译码阶段要认出操作类型（加、取数、存数、跳转）和作用的内存位置；指令格式约定是译码前提。\n<\/li><li>\n<strong>执行结果要能写回内存或外设<\/strong>。算完不能只留在处理器内部，结果必须经总线写回 RAM，再由后续指令或输出部件使用。\n<\/ol>\n<p>依赖链方向：RAM 中指令序列 → 取指 → 译码 → 累加器执行 → 写回 RAM/外设 → 回到取指。缓存是在这条路径旁加的快速副本层，前提是访问行为有局部性。<\/p>\n<h2>正向推导：一台玩具计算机跑一段求和程序<\/h2>\n<h3>第一步：布置内存现场<\/h3>\n<p>设内存位置 X 存第一个数，Y 存第二个数，Z 留作结果。程序指令按顺序放在 RAM 低位地址：第一条 LOAD X，第二条 ADD Y，第三条 STORE Z，第四条 STOP。累加器初始值不确定，第一条 LOAD 会覆盖它。<\/p>\n<h3>第二步：取指（Fetch）<\/h3>\n<p>CPU 从程序计数器指向的 RAM 位置读出下一条指令。指令在总线上传输到 CPU 的指令寄存器。计数器前移到下一条位置。这一步只搬运指令内容，不解释含义。<\/p>\n<h3>第三步：译码（Decode）<\/h3>\n<p>CPU 解析指令内容：操作码是 LOAD、ADD、STORE 还是 STOP；操作数字段给出内存地址 X、Y 或 Z。译码决定控制线路接通哪些通路：LOAD 要把内存送到累加器，ADD 要把内存值与累加器值相加，STORE 要把累加器送回内存。<\/p>\n<h3>第四步：执行（Execute）<\/h3>\n<ul><li>\nLOAD X：把内存 X 位置的值复制进累加器，X 内容不变。\n<\/li><li>\nADD Y：把内存 Y 位置的值加到累加器，累加器原值与 Y 相加后覆盖累加器，Y 内容不变。\n<\/li><li>\nSTORE Z：把累加器副本复制到内存 Z 位置，累加器内容不变。\n<\/li><li>\nSTOP：停止执行。\n<\/ul>\n<h3>第五步：写回与循环返回<\/h3>\n<p>STORE 之后结果已在 Z；CPU 回到 Fetch 取第四条 STOP，译码出停止指令，循环终止。若程序是循环求和，跳转指令会把计数器拨回循环开头，下一轮再从 Fetch 开始。<\/p>\n<h3>第六步：比较与分支<\/h3>\n<p>CPU 比较两个数字：这个数比另一个大吗、两份信息相同吗；基于比较结果决定下一条取指位置。条件满足跳回循环开头，不满足顺序往下走。这一步是机器能自主运行、能实现循环与分支的根据（PDF 第 76 页）。<\/p>\n<h3>第七步：真实 CPU 的差异<\/h3>\n<p>真实指令集比玩具丰富：可一次内存到内存完成运算，多条指令可在不同阶段流水线重叠执行，部分处理器支持并行多条指令。同样两个数求和，有的处理器 3 条指令，有的 2 条，有的 1 条；主频、指令条数、并行度、功耗调速共同决定实际速度，不能只拿 GHz 比较（PDF 第 89 页）。<\/p>\n<h2>缓存层级的正向推演<\/h2>\n<h3>第八步：为什么需要缓存<\/h3>\n<p>RAM 比 CPU 慢。循环反复使用同几条指令和同一变量，每轮都从 RAM 重读是无谓等待。放一个小而快的存储层在 CPU 旁，保存最近用过的信息，未命中再回 RAM 取。<\/p>\n<h3>第九步：局部性两条来源<\/h3>\n<p>时间局部性：刚用过的信息很可能很快再用。空间局部性：用过某地址，邻近地址也可能被用到。因此缓存一次加载一组连续信息块：只请求一个字节，也把 RAM 中一段连续地址带进缓存，邻近引用同样命中（PDF 第 90 页）。<\/p>\n<h3>第十步：多级缓存的容量—速度权衡<\/h3>\n<p>典型 CPU 有 2～3 级缓存，一级最快最小，往下容量增大、速度递减；作者笔记本每个核心 256KB 二级缓存、单个 4MB 三级缓存（PDF 第 89–90 页）。越靠近核心越快越贵越小，层级间用容量换速度。<\/p>\n<h3>第十一步：缓存思想向其他层复用<\/h3>\n<p>RAM 作为磁盘的缓存，磁盘作为网络数据的缓存；网络用缓存加速访问远程服务器；浏览器把图片等大资源副本存本地，二次访问走本地副本；缓存不能无限增长，旧项目被悄悄挤出；Word 的最近文件列表也是一种缓存形式（PDF 第 90 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：三条指令求和的操作数流转<\/h3>\n<p>设 <span class=\"katex-inline\">X=17<\/span>，<span class=\"katex-inline\">Y=25<\/span>。LOAD X 后累加器 <span class=\"katex-inline\">A=17<\/span>；ADD Y 后 <span class=\"katex-inline\">A=17+25=42<\/span>；STORE Z 后内存 Z=42，累加器仍为 42。若再来一条 LOAD X 覆盖，A 变成 17，Z 保留 42 不受影响——STORE 是复制而非移动，内存源位置不变。<\/p>\n<h3>算例 2：循环次数与指令重复<\/h3>\n<p>求和程序对 <span class=\"katex-inline\">N<\/span> 个输入值累加，循环体内假设 6 条指令（原书 3.3 节例子，PDF 第 89 页）。<span class=\"katex-inline\">N<\/span> 轮共执行 <span class=\"katex-inline\">6N<\/span> 条指令。这 6 条指令每轮重复使用：若它们在缓存中，每轮省去 6 次 RAM 读取；数据变量同样驻留缓存时，访问等待进一步减少。缓存命中的收益随循环密度增大。<\/p>\n<h3>算例 3：缓存容量量级对照<\/h3>\n<p>作者笔记本：每核心 256KB 二级缓存，4MB 三级缓存（PDF 第 90 页）。<span class=\"katex-inline\">256\\text{ KB}=256\\times2^{10}\\text{ B}=262\\,144\\text{ B}<\/span>；<span class=\"katex-inline\">4\\text{ MB}=4\\times2^{20}\\text{ B}=4\\,194\\,304\\text{ B}<\/span>。三级缓存约为二级的 16 倍。具体访问延迟纳秒数原书未列，不补造；可确认的定性次序是一级快于二级、二级快于三级、三级快于 RAM。<\/p>\n<h3>算例 4：主频与心跳的量级对照<\/h3>\n<p>2.2 GHz 处理器每秒 <span class=\"katex-inline\">2.2\\times10^9<\/span> 次滴答；但一条指令往往需要多个时钟周期，主频不等于每秒完成的指令条数。比较两台机器速度时，要结合每条指令周期数、并行度和实际负载，不能用主频直接相除。<\/p>\n<h3>算例 5：缓存挤出过程<\/h3>\n<p>先打开大程序 A，指令和数据填入 RAM 与缓存；再使用其他程序一段时间，RAM 被新程序占满，A 的内容从缓存和 RAM 中被挤出；再次启动 A 时，要从二级存储重新读入，启动速度回到冷启动水平（PDF 第 90 页）。第二次启动快，是因为 A 仍在 RAM，不是因为硬件记住了程序。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>没有执行循环，指令一次全跑完<\/strong>：机器无法按结果选择下一步，循环、分支、重复处理大批数据都写不出来；程序只能是一段固定顺序的直线流程。\n<\/li><li>\n<strong>CPU 没有累加器<\/strong>：每次加法都要在两个内存位置之间来回搬运，指令条数增多，内存通路成为瓶颈；工作单元缺失使运算组织复杂化。\n<\/li><li>\n<strong>去掉缓存<\/strong>：循环反复使用的指令和变量每轮都回 RAM 读取，循环越密等待越长；局部性带来的提速全部落空。\n<\/li><li>\n<strong>缓存不按块加载，只缓存单个字节<\/strong>：空间局部性用不上，邻近地址引用仍要回 RAM；块加载一次带回一片连续地址，正是为了覆盖邻近引用。\n<\/li><li>\n<strong>缓存当永久存储<\/strong>：缓存内容会被新项目替换，退出或断电后不保证保留；把中间结果只放缓存而不写回二级存储，关机即丢。\n<\/ul>\n<h2>延伸层：从玩具计算机到真实体系结构<\/h2>\n<p>玩具计算机与 20 世纪 60 年代末小型机水平相近，指令表只含 10 条基本操作，但具备真实计算机的很多特性（PDF 第 77 页）。真实 CPU 在指令集、流水线、并行度上扩展，执行循环的基本结构没有变：取指、译码、执行、写回、再取指。理解循环后，看真实处理器手册时，可以把复杂指令拆成这套基本动作；c07 的编译器工作，就是把高级语言表达式翻译成这套取指—执行能消化的指令序列。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 Fetch、Decode、Execute 三步各自做什么，并说明循环怎样回到 Fetch。\n<\/li><li>\nSTORE M 与 LOAD M 在源位置内容是否改变上有什么差别？\n<\/li><li>\n时间局部性和空间局部性各举一个程序中的表现。\n<\/li><li>\n为什么缓存容量逐级增大、速度逐级递减？\n<\/li><li>\n只看主频判断两台 CPU 谁更快，忽略了哪些因素？\n<\/ol>\n<h2>再推一层：玩具机指令周期逐拍走查，与缓存命中的成本结构<\/h2>\n<h3>玩具机指令集对照<\/h3>\n<p>纸面玩具计算机有存指令和数据的 RAM、一个只存一个数值的累加器，以及一张只含少量指令的表：GET 读入数值，PRINT 输出，STORE M 把累加器存到 RAM 位置 M，LOAD M 把 M 装入累加器，ADD M 把 M 加到累加器，STOP 结束（PDF 第 77 页）。指令在 RAM 中按顺序排列，CPU 从第一个位置开始重复取指、译码、执行，然后回到取指；跳转类指令可以改变下一条取指位置。<\/p>\n<h3>一条加法指令的生命周期<\/h3>\n<p>设累加器已装 X，要执行 ADD Y：取指阶段从 RAM 读出 ADD Y 的指令位模式；译码阶段识别这是加法指令、操作数地址 Y；执行阶段从 RAM 取出 Y，与累加器相加，结果留在累加器；随后取指下一条。若后续是 STORE Z，执行阶段把累加器写回 RAM 的 Z 位置。一条高级表达式 <span class=\"katex-inline\">Z=X+Y<\/span> 在这台机器上要分解成 LOAD、ADD、STORE 这类若干条指令，编译器生成的指令条数因处理器结构不同而不同：同一表达式两套编译器分别生成 3 条与 2 条指令（PDF 第 125 页）。<\/p>\n<h3>缓存命中与未命中的差别<\/h3>\n<p>CPU 先查最快的一级缓存，命中就直接取用；未命中再查二级、三级，最后访问 RAM。命中时省去一次慢速下层读取；未命中时要把连续块从下层整批载入上层，再取用。循环里反复执行的指令和变量留在缓存中，每轮不必重新等 RAM；这正是时间局部性的收益。空间局部性体现在按连续块加载：访问某位置后邻近位置很快被访问，整批载入后续命中率上升。<\/p>\n<h3>层级容量与速度的权衡<\/h3>\n<p>典型 CPU 有 2～3 级缓存，容量逐级增大、速度逐级递减；作者笔记本每个核心配 256KB 二级缓存、单个 4MB 三级缓存（PDF 第 89–90 页）。越靠近 CPU 的存储越快但越贵越小，越往下越大越慢。缓存不能无限增长，旧项目会被悄悄剔除腾出空间；缓存思想下沉到 RAM 作磁盘缓存、浏览器缓存网页图片等大资源副本。<\/p>\n<h3>主频不能单独决定快慢<\/h3>\n<p>2.2 GHz 是每秒时钟滴答次数，但一条指令往往需要多个周期；不同处理器完成同一任务的指令条数不同，同求和有的 3 条、有的 2 条、有的 1 条（PDF 第 89 页前后）。比较两台机器快慢，要同时看主频、每条指令周期数、指令条数和缓存命中情况，单看主频会得出错误结论。2016 年中期最快超算超过 1000 万个 CPU（PDF 第 91 页），处理器规模与并行度也是整体性能的一部分。<\/p>\n<h2>补足推导：局部性前提、层级延迟阶梯与命中算例<\/h2>\n<h3>去掉局部性假设会怎样<\/h3>\n<p>缓存提速依赖两条经验规律：刚用过的数据很快再用（时间局部性），用过附近地址的数据很可能接着被用（空间局部性）。若程序以随机方式跳遍巨大地址空间，两条规律都不成立，缓存块命中率接近 0，缓存每次都要退回慢速存储，缓存带来的提速基本消失。缓存块大小与访问模式不匹配时，空间局部性也利用不充分。<\/p>\n<h3>层级延迟阶梯<\/h3>\n<p>越靠近 CPU 的存储越小越快：先查一级缓存，未命中再查二级、三级，最后访问 RAM。量级上 L1 缓存约 1 纳秒，主存约 100 纳秒，SSD 约 100 微秒，磁盘约 10 毫秒（转述：书内只明确相邻层级快慢递减，绝对量级为通用参考）。一次加载连续地址块，正是为了把邻近数据一并带入快缓存。<\/p>\n<h3>命中算例<\/h3>\n<p>2.2GHz 单周期约 0.45 纳秒；作者笔记本每核 256KB 二级缓存、单个 4MB 三级缓存。求和循环里的 6 条指令驻留指令缓存，每轮不必从 RAM 重读；累加变量驻留数据缓存，避免每轮访问主存。缓存未命中时仍要支付所在层级的慢速访问代价，缓存只是把多数访问挡住，不改变下层存储本身的速度。<\/p><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.104<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">CPU 执行机制与多级缓存：取指—译码—执行、累加器与局部性<\/a><\/span><\/div><h1>算法与线性查找：正确性、终止性与 <span class=\"katex-inline\">O(N)<\/span> 线性时间<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章（原书 4.1 线性算法，PDF 第 103–106 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>面对一批数据，人凭直觉就能「找最高的人」「算平均身高」，但把任务交给不会说话的计算机，步骤必须写得没有歧义：每个操作含义完整、输入类型给定、所有情况都覆盖、走到最后必然停下。算法概念要回答：什么样的步骤序列才算算法，线性遍历的工作量随数据量怎么增长，以及哪些边界情况（空输入、重复值、除零）必须显式处理。不先立住正确性与终止性，后面二分查找、排序的复杂度比较就没有共同基础。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>算法（algorithm）<\/strong>：确保算出正确结果的一系列步骤。每个步骤用基本操作表达，操作含义完整定义，例如「将两个整数相加」；输入数据类型已经给定；所有可能情况已经覆盖；算法绝不会遇到不知道下一步做什么的情况。计算机科学家还增加一条：算法必须在最后终止（PDF 第 103 页）。<\/p>\n<p><strong>线性遍历<\/strong>：逐个检查每一个数据项，每项做一次比较或简单计算。找最高的人：依次询问每个人身高，把更高的记为当前最高；人数翻 2 倍，询问次数翻 2 倍，人数翻 10 倍，时间翻 10 倍，时间与数据量成正比，称为线性时间（PDF 第 104、106 页）。<\/p>\n<p><strong>求平均的步骤<\/strong>：先把和置 0，逐个把身高加到和上，最后用人数除和。人数 <span class=\"katex-inline\">N<\/span> 未知时，求和同时把 <span class=\"katex-inline\">N<\/span> 加 1；结尾检测 <span class=\"katex-inline\">N&gt;0<\/span> 才算平均，否则报告「未给出身高数据」（PDF 第 105 页）。<\/p>\n<p><strong>边界情况<\/strong>：相同身高的重复值要决定记第一个、最后一个、随机一个还是都记下；空输入不能做除以 0；支票写 0 元 00 分、零欠款账单就是没测试好各种情况的失败案例（PDF 第 104–105 页）。<\/p>\n<p>正例：遍历名单找名字，每读一项与目标比较一次，读完即知是否存在。反例：洗发指令「打泡、漂洗、重复」没有退出条件，不满足终止性，不算算法（PDF 第 103 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>线性查找正确性推演：设名单 <span class=\"katex-inline\">a_1,\\dots,a_N<\/span>，目标 <span class=\"katex-inline\">x<\/span>。逐个比较 <span class=\"katex-inline\">a_i<\/span> 与 <span class=\"katex-inline\">x<\/span>：相等则返回找到；扫完所有项仍不等，返回不存在。遍历覆盖全部 <span class=\"katex-inline\">N<\/span> 项，找到与不存在两种结局都有确定出口，步骤终止。<\/p>\n<p>工作量：每项一次比较，初始化（和置 0、最大值置小值、计数置 0）外加结尾处理（打印总和或最高身高、算平均）。若每项运算花费相同时长，最终时间与项目数量成正比（PDF 第 106 页）。量级记为 <span class=\"katex-inline\">O(N)<\/span>：数据量翻倍，操作数翻倍。<\/p>\n<p>求平均的除零防护：<span class=\"katex-inline\">N=0<\/span> 时和也是 0，<span class=\"katex-inline\">0/0<\/span> 是未定义运算；显式分支先判 <span class=\"katex-inline\">N&gt;0<\/span>，再执行除法。没有这条检测，机器不会像人那样意识到无事可做，直接撞上未定义运算（PDF 第 105 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：数据项可逐项枚举；每项处理时长近似恒定；不需要利用数据排列顺序。\n<\/li><li>\n边界一：线性时间是最坏与平均同量级的遍历；若数据已排序且要查特定项，存在更快的二分路线（c06）。\n<\/li><li>\n失败案例一：不处理空输入。人数为 0 时进入除法，得到未定义结果或崩溃。\n<\/li><li>\n失败案例二：重复值不约定取舍规则。并列最高时记谁不明确，不同实现给出不同答案；若要记下所有并列者，需要额外列表存放。\n<\/li><li>\n失败案例三：把「步骤能跑完」当成「结果正确」。操作含义有歧义（如菜谱里「轻轻放平」「至少 30 分钟还是不超过 30 分钟」），机器照执行也得不到一致结果；算法的每个基本操作必须含义完整定义（PDF 第 102 页）。\n<\/li><li>\n边界二：算法效率不只看步骤数，还与每项操作的实际成本有关；原书只做量级对比，不细分常数因子。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>算法 vs 菜谱/税单<\/strong>：菜谱列配料和操作但常模糊有歧义；税单详细说明算什么、从哪行拷到哪行、条件怎么测试、后续计算依赖前面结果。算法是计算机科学版本的税单，操作定义完整（PDF 第 102–103 页）。\n<\/li><li>\n<strong>线性时间 vs 常数时间<\/strong>：常数时间与数据量无关；线性时间操作数随 <span class=\"katex-inline\">N<\/span> 一次增长。\n<\/li><li>\n<strong>正确性 vs 终止性<\/strong>：正确性保证输入合法时结果对；终止性保证有限步后停下。「打泡漂洗重复」可能步骤含义清楚但不终止。\n<\/li><li>\n<strong>遍历 vs 查找前提<\/strong>：无序表只能线性查；有序表才可二分，查找方法受数据排列约束。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c04 的执行循环是算法步骤落地的硬件基础。后继：c06 在有序前提下把线性遍历改进为二分查找；c07 排序的工作量分析沿用本节「逐项计数 + 量级归类」的方法；操作系统 c07 调度进程时也要枚举任务队列。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（算法与线性查找：正确性、终止性与 $O(N)$ 线性时间）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：从直觉步骤到可执行算法，以及线性量级的逐项计数<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把线性查找讲成可推演的算法，先往回追四层前提：<\/p>\n<ol><li>\n<strong>任务能写成基本操作序列<\/strong>。「找最高」「算平均」先要拆成比较、加法、赋值这类含义完整定义的操作；模糊形容不能直接喂给机器。\n<\/li><li>\n<strong>输入类型与规模事先明确<\/strong>。身高是数值，名单是可枚举序列；人数 <span class=\"katex-inline\">N<\/span> 可以事先知道，也可以边遍历边计数。类型不清，操作合法性无从判断。\n<\/li><li>\n<strong>所有结局都有确定出口<\/strong>。找到怎么办、没找到怎么办、输入为空怎么办，都要写成分支；不能让流程停在「不知道下一步」。\n<\/li><li>\n<strong>流程必须能终止<\/strong>。每一步之后状态向前推进，存在退出条件；否则就是循环不收敛的死流程。\n<\/ol>\n<p>依赖链方向：任务描述 → 基本操作拆解 → 输入与边界约定 → 分支出口 → 终止条件 → 操作数随 <span class=\"katex-inline\">N<\/span> 增长的量级。缺正确性分支，结果可能错；缺终止条件，流程可能永不结束。<\/p>\n<h2>正向推导：求最大值算法逐步执行<\/h2>\n<h3>第一步：初始化<\/h3>\n<p>设名单 <span class=\"katex-inline\">a_1,\\dots,a_N<\/span>。把当前最高值 <span class=\"katex-inline\">M<\/span> 置为一个很小的数（或先取 <span class=\"katex-inline\">a_1<\/span>），当前下标 <span class=\"katex-inline\">i=1<\/span>。<\/p>\n<h3>第二步：逐项比较<\/h3>\n<p>取 <span class=\"katex-inline\">a_i<\/span> 与 <span class=\"katex-inline\">M<\/span> 比较：若 <span class=\"katex-inline\">a_i&gt;M<\/span>，把 <span class=\"katex-inline\">M<\/span> 更新为 <span class=\"katex-inline\">a_i<\/span>；否则 <span class=\"katex-inline\">M<\/span> 保持。<span class=\"katex-inline\">i<\/span> 加 1，回到比较，直到 <span class=\"katex-inline\">i&gt;N<\/span>。<\/p>\n<h3>第三步：覆盖全部项<\/h3>\n<p>循环扫过 <span class=\"katex-inline\">a_1<\/span> 到 <span class=\"katex-inline\">a_N<\/span> 每一项。无论目标在什么位置，比较都进行到末尾；找到并列更高者就更新，遍历结束后 <span class=\"katex-inline\">M<\/span> 是全局最大值。<\/p>\n<h3>第四步：处理并列情况<\/h3>\n<p>若存在多个相同最高值，规则要事先约定：记第一个出现者、最后一个出现者、随机一个，还是全部记下。要记全部并列者，需要一个额外列表，每遇相等就追加，而不是只留一个变量。<\/p>\n<h3>第五步：出口与终止<\/h3>\n<p>两种结局：更新过若干次后输出 <span class=\"katex-inline\">M<\/span>；若要求记名字，同时输出对应下标。流程在 <span class=\"katex-inline\">i&gt;N<\/span> 时退出，步数有上界。<\/p>\n<h2>正向推导：求平均算法与除零防护<\/h2>\n<h3>第六步：累加与计数并行<\/h3>\n<p>设和 <span class=\"katex-inline\">S=0<\/span>，人数 <span class=\"katex-inline\">N=0<\/span>。逐个读取身高 <span class=\"katex-inline\">h_i<\/span>：<span class=\"katex-inline\">S\\leftarrow S+h_i<\/span>，<span class=\"katex-inline\">N\\leftarrow N+1<\/span>。人数事先不知道时，这一步同时把规模数出来。<\/p>\n<h3>第七步：先判空再除法<\/h3>\n<p>结尾判断 <span class=\"katex-inline\">N&gt;0<\/span>：成立则平均 <span class=\"katex-inline\">A=S/N<\/span>；不成立则报告「未给出身高数据」。除法放在分支内部，保证 <span class=\"katex-inline\">N=0<\/span> 时不执行 <span class=\"katex-inline\">S/0<\/span>。<\/p>\n<h3>第八步：未定义运算的后果<\/h3>\n<p><span class=\"katex-inline\">0/0<\/span> 没有数学定义，机器不会像人那样意识到无事可做；缺了显式检测，程序要么得到垃圾结果，要么触发除零异常。支票 0 元 00 分、零欠款账单就是边界没测好的现实案例（PDF 第 105 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：最大值遍历计数<\/h3>\n<p>5 个人身高 168、172、165、180、171。初始化 <span class=\"katex-inline\">M=168<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">i=2<\/span>：172&gt;168，<span class=\"katex-inline\">M=172<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">i=3<\/span>：165&lt;172，不变；\n<\/li><li>\n<span class=\"katex-inline\">i=4<\/span>：180&gt;172，<span class=\"katex-inline\">M=180<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">i=5<\/span>：171&lt;180，不变。\n<p>共 5 次比较，<span class=\"katex-inline\">M=180<\/span>。比较次数与人数相等，为 <span class=\"katex-inline\">N<\/span> 次。<\/p>\n<\/ul>\n<h3>算例 2：平均值与除零<\/h3>\n<p>同 5 人：<span class=\"katex-inline\">S=168+172+165+180+171=856<\/span>，<span class=\"katex-inline\">N=5<\/span>，<span class=\"katex-inline\">A=856/5=171.2<\/span>。 空输入：<span class=\"katex-inline\">S=0<\/span>，<span class=\"katex-inline\">N=0<\/span>；分支判 <span class=\"katex-inline\">N&gt;0<\/span> 不成立，不做除法，输出无数据提示。若强行计算 <span class=\"katex-inline\">0/0<\/span>，结果未定义。<\/p>\n<h3>算例 3：线性量级随规模放大<\/h3>\n<p><span class=\"katex-inline\">N=1000<\/span>：遍历比较约 1000 次；<span class=\"katex-inline\">N<\/span> 翻倍到 2000，比较约 2000 次；<span class=\"katex-inline\">N<\/span> 变 10 倍到 10000，比较约 10000 次。操作数与 <span class=\"katex-inline\">N<\/span> 成正比，量级 <span class=\"katex-inline\">O(N)<\/span>。初始化和结尾处理是常数次操作，随 <span class=\"katex-inline\">N<\/span> 增大被摊薄，不计入主项。<\/p>\n<h3>算例 4：重复值处理<\/h3>\n<p>身高 175 出现三次。若规则记第一个，下标固定为首次位置；若记全部，列表追加三次；不同规则输出不同，规则必须在写算法前确定。这不是计算问题，是约定问题。<\/p>\n<h3>算例 5：线性遍历的同类任务<\/h3>\n<p>找最富有的人、名字字母表最靠前的人、生日最接近年底的人，结构与找最高相同：逐项比较、维护当前最优、扫完全部。换比较准则不改变线性量级（PDF 第 104 页）。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>算法不覆盖空输入<\/strong>：人数为 0 时进入除法，撞上未定义运算；程序在合法但少见的输入上失败。\n<\/li><li>\n<strong>不约定并列取舍<\/strong>：多个并列最高时，不同实现各取一个，同一数据给出不同答案，结果不可复现。\n<\/li><li>\n<strong>步骤含义有歧义<\/strong>：菜谱式描述里「轻轻」「至少 30 分钟还是不超过 30 分钟」没有可执行判定标准，机器照做也得不到一致结果；算法基本操作必须定义完整。\n<\/li><li>\n<strong>流程没有退出条件<\/strong>：「打泡、漂洗、重复」式循环永远重复，终止性不成立，不能称为算法；最坏运行时间无从界定。\n<\/li><li>\n<strong>把常数次初始化忽略成主项<\/strong>：初始化只做一次，不随 <span class=\"katex-inline\">N<\/span> 增长；量级分析只保留随数据量增长的主项。\n<\/ul>\n<h2>延伸层：线性查找的适用边界<\/h2>\n<p>线性查找不依赖数据顺序，无序表上只能这么找；它也不假设数据结构额外组织。代价是无论目标是否存在，最坏都要扫完全部项。当数据量很大、查询频繁时，遍历成本成为瓶颈，这正是 c06 引入有序前提和二分查找的动机；排序本身的成本（c06 量级对比）要算进「为二分付出的前置代价」，不能只比较查询阶段。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n算法四条约束（操作定义、输入给定、情况覆盖、必然终止）各举一个违反它的例子。\n<\/li><li>\n写出求平均值的伪代码，并指出除零防护放在哪一步。\n<\/li><li>\n<span class=\"katex-inline\">N<\/span> 个数据线性遍历的比较次数主项是多少？初始化操作为什么不计入主项？\n<\/li><li>\n并列最大值为什么必须事先约定取舍规则？\n<\/li><li>\n线性查找在什么前提下才能被更快的查找取代？\n<\/ol>\n<h2>再推一层：最大值与平均值的完整步骤推演，以及终止性证明<\/h2>\n<h3>最大值算法的不变量<\/h3>\n<p>维护一个不变量：当前变量 <span class=\"katex-inline\">M<\/span> 保存已扫描部分中的最大值。初始取 <span class=\"katex-inline\">a_1<\/span>，此后每读入 <span class=\"katex-inline\">a_i<\/span>，比较 <span class=\"katex-inline\">a_i<\/span> 与 <span class=\"katex-inline\">M<\/span>：<span class=\"katex-inline\">a_i&gt;M<\/span> 则更新 <span class=\"katex-inline\">M\\leftarrow a_i<\/span>，否则保持。扫描到 <span class=\"katex-inline\">i<\/span> 结束时，<span class=\"katex-inline\">M<\/span> 是前 <span class=\"katex-inline\">i<\/span> 项的最大值；扫描完全部 <span class=\"katex-inline\">N<\/span> 项，<span class=\"katex-inline\">M<\/span> 就是全局最大值。不变量在每一步后成立，这是正确性的依据。<\/p>\n<h3>终止性论证<\/h3>\n<p>循环下标 <span class=\"katex-inline\">i<\/span> 从 1 递增到 <span class=\"katex-inline\">N<\/span>，每轮 <span class=\"katex-inline\">i<\/span> 加 1；当 <span class=\"katex-inline\">i&gt;N<\/span> 时循环退出。下标单调增大且有上界 <span class=\"katex-inline\">N<\/span>，因此有限步内必然终止。对照「打泡、漂洗、重复」式描述：没有计数、没有退出条件，重复下去永远不结束，不满足终止性，不能称为算法（PDF 第 103 页）。<\/p>\n<h3>除零防护的位置<\/h3>\n<p>求平均先累计和 <span class=\"katex-inline\">S<\/span> 与人数 <span class=\"katex-inline\">N<\/span>。除法 <span class=\"katex-inline\">S/N<\/span> 必须放在 <span class=\"katex-inline\">N&gt;0<\/span> 分支内部；若 <span class=\"katex-inline\">N=0<\/span>，报告未给出数据，不执行除法。<span class=\"katex-inline\">0/0<\/span> 没有数学定义，机器不会自行意识到无事可做；缺了显式检测，要么得到垃圾结果，要么触发除零异常。支票写 0 元 00 分、零欠款账单就是边界没测好的现实案例（PDF 第 104–105 页）。<\/p>\n<h3>并列值的约定<\/h3>\n<p>相同身高出现多次时，结果记第一个出现者、最后一个出现者、随机一个还是全部记下，要在写算法前约定。要记全部并列者，需要一个额外列表，每遇相等就追加；只留一个变量无法保存多份并列结果。约定不同，同一数据的输出不同，这不是计算问题而是规则问题。<\/p>\n<h3>线性量级逐项计数<\/h3>\n<p>找最高的人依次询问每个人的身高，比较次数等于人数 <span class=\"katex-inline\">N<\/span>。人数翻 2 倍询问翻 2 倍，人数翻 10 倍时间翻 10 倍，时间与数据量成正比，称为线性时间（PDF 第 104、106 页）。求平均的加法计数同样为 <span class=\"katex-inline\">N<\/span> 次；初始化 <span class=\"katex-inline\">S=0<\/span>、<span class=\"katex-inline\">N=0<\/span> 只做常数次，随 <span class=\"katex-inline\">N<\/span> 增大被摊薄，不计入主项。同类任务——找最富有的人、名字字母表最靠前的人、生日最接近年底的人——结构相同，换比较准则不改变线性量级。<\/p>\n<h2>补足推导：线性查找的不变量、最坏/平均步数与规模算例<\/h2>\n<h3>算法成立的三条前提<\/h3>\n<p>线性查找可执行依赖：输入可逐项与目标比较；终止条件明确（命中或扫完）；相等判定可在有限步完成。若缺少明确终止条件，循环可能永不退出；若元素无法比较，逐项判断就无从进行。这些前提不依赖列表是否有序。<\/p>\n<h3>不变量与步数<\/h3>\n<p>扫描到第 <span class=\"katex-inline\">i<\/span> 项时，已检查的前缀 <span class=\"katex-inline\">1\\cdots i-1<\/span> 不含目标，这是循环不变量。最坏情况目标在末尾或不存在，需比较 <span class=\"katex-inline\">N<\/span> 次；目标均匀分布时平均比较 <span class=\"katex-inline\">N/2<\/span> 次；量级记 <span class=\"katex-inline\">O(N)<\/span>。每多一个元素，最坏工作量加一次，不随规模产生平方膨胀。<\/p>\n<h3>规模算例<\/h3>\n<p><span class=\"katex-inline\">N=2^{20}\\approx1.05\\times10^6<\/span>，最坏约 <span class=\"katex-inline\">1.05\\times10^6<\/span> 次比较；若每秒可完成 <span class=\"katex-inline\">10^9<\/span> 次比较，最坏耗时约 1 毫秒。<span class=\"katex-inline\">N=10^9<\/span> 时最坏 <span class=\"katex-inline\">10^9<\/span> 次比较，线性方案在大名单上代价可观，这正是 c06 二分查找要解决的问题。正确性边界：找到返回对应位置，扫完仍未命中返回未命中；它不修改列表，也不依赖排序结果。<\/p>\n<h2>补足推导：量级分界与重复查找代价<\/h2>\n<h3>与常数、对数查找的分界<\/h3>\n<p>线性 <span class=\"katex-inline\">O(N)<\/span> 与常数 <span class=\"katex-inline\">O(1)<\/span>、对数 <span class=\"katex-inline\">O(\\log N)<\/span> 的分界在于是否需要扫描全部候选。常数查找以事先建立的索引或查表结构为前提；对数查找只在有序结构上折半。线性查找不依赖前置组织，代价是随 <span class=\"katex-inline\">N<\/span> 匀速增长，规模上来后最先成为瓶颈。<\/p>\n<h3>重复查找算例<\/h3>\n<p>名单长度 <span class=\"katex-inline\">N=1000<\/span>，目标在首位比较 1 次，在末位或不存在比较 1000 次，平均 500 次；若每秒完成 <span class=\"katex-inline\">10^6<\/span> 次比较，最坏约 1 毫秒。若同一批名单要反复查找 <span class=\"katex-inline\">N<\/span> 次，朴素线性重复的总工作量为 <span class=\"katex-inline\">O(N^2)<\/span>，这时先排序、再用二分或建索引更划算。线性查找的正确性不修改列表，命中返回位置、扫完未命中返回未命中；它不要求输入有序，也不保证找到唯一匹配。<\/p><\/div><\/details>", "c06": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.107<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">算法与线性查找：正确性、终止性与 $O(N)$ 线性时间<\/a><\/span><\/div><h1>二分查找与排序增长量级：<span class=\"katex-inline\">\\log_2 N<\/span>、<span class=\"katex-inline\">N^2<\/span> 与 <span class=\"katex-inline\">N\\log N<\/span><\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书 4.2 二分查找、4.3 排序、4.4 难题与复杂性，PDF 第 107–113 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>线性遍历在大名单上每次都要从头扫到尾。若名单已排好序，能不能不逐项问，直接丢掉一半？排序本身又要付多大代价？不同算法随数据量增长的快慢差距有多大？这个概念用三组具体数字回答：二分查找的折半次数、选择排序的二次增长、快速排序的分治近线性增长，并说明每种量级成立的前提和失效条件。复杂度对比不搞抽象口号，全部落到可算的步数上。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>二分查找（binary search）<\/strong>：在已按字母顺序排列的列表中，从大约中间开始；要找的名字在中间之前就舍弃后半部，否则舍弃前半部；每一步都知道该找哪一半（PDF 第 107 页）。每次比较把数据项一分为二，其中一半今后不再考虑，是分而治之策略的例子。<\/p>\n<p><strong>折半次数<\/strong>：每步舍弃一半候选，步数等于把最初项数反复除以 2 直到剩 1 的次数。1024 个名字折半 10 次到 1，对应 <span class=\"katex-inline\">2^{10}=1024<\/span>（PDF 第 107 页）。<\/p>\n<p><strong>选择排序<\/strong>：反复遍历剩余数据项，每次找出字母表顺序中的下一个名字。16 个名字找第一个查 16 次，第二个 15 步，依此类推（PDF 第 110 页）。<\/p>\n<p><strong>快速排序（Quicksort）<\/strong>：英国计算机科学家 Tony Hoare 于 1959 年左右发明，Hoare 因包括快速排序在内的多项贡献获 1980 年图灵奖；做法是遍历一次把数据分成大小相近的两组，递归再分（PDF 第 112 页）。<\/p>\n<p><strong>增长量级<\/strong>：选择排序工作量 <span class=\"katex-inline\">N(N+1)/2<\/span>，随 <span class=\"katex-inline\">N<\/span> 增大近似与 <span class=\"katex-inline\">N^2<\/span> 成正比，称二次增长；快速排序在每次分割都均匀的假设下工作量 <span class=\"katex-inline\">N\\log_2 N<\/span>。图 4-1 把 <span class=\"katex-inline\">\\log N<\/span>、<span class=\"katex-inline\">N<\/span>、<span class=\"katex-inline\">N\\log N<\/span>、<span class=\"katex-inline\">N^2<\/span> 四条曲线画在一起（PDF 第 111、113 页）。<\/p>\n<p>正例：<span class=\"katex-inline\">N=16<\/span>，选择排序 <span class=\"katex-inline\">16\\times17/2=136<\/span> 次；快速排序 <span class=\"katex-inline\">16\\log_2 16=16\\times4=64<\/span> 次（PDF 第 110、113 页）。反例：名单无序时不能二分，只能线性遍历；快速排序若每次分割极不均匀，退化成接近 <span class=\"katex-inline\">N^2<\/span>。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>二分查找次数：设候选 <span class=\"katex-inline\">N<\/span> 项，每次折半后剩 <span class=\"katex-inline\">\\lceil N/2\\rceil<\/span>，折半 <span class=\"katex-inline\">k<\/span> 次后 <span class=\"katex-inline\">N/2^k\\le1<\/span>，即 <span class=\"katex-inline\">2^k\\ge N<\/span>，<span class=\"katex-inline\">k\\ge\\log_2 N<\/span>。<span class=\"katex-inline\">10^3<\/span> 约 10 次，<span class=\"katex-inline\">10^6\\approx2^{20}<\/span> 约 20 次，<span class=\"katex-inline\">10^9\\approx2^{30}<\/span> 约 30 次；数据量增长 1000 倍，二分只多约 10 步（PDF 第 108 页）。<\/p>\n<p>选择排序求和：<span class=\"katex-inline\">S_N=N+(N-1)+\\cdots+1=N(N+1)/2=N^2/2+N/2<\/span>。<span class=\"katex-inline\">N<\/span> 很大时低阶 <span class=\"katex-inline\">N/2<\/span> 可忽略，主项 <span class=\"katex-inline\">N^2/2<\/span>，量级 <span class=\"katex-inline\">O(N^2)<\/span>。<span class=\"katex-inline\">N=1000<\/span> 时 <span class=\"katex-inline\">S=500\\,500<\/span>，<span class=\"katex-inline\">N^2=1\\,000\\,000<\/span>。规模放大：<span class=\"katex-inline\">N<\/span> 变 <span class=\"katex-inline\">2N<\/span> 时间约 4 倍，变 <span class=\"katex-inline\">10N<\/span> 约 100 倍，变 <span class=\"katex-inline\">1000N<\/span> 约 100 万倍（PDF 第 111 页）。<\/p>\n<p>快速排序分治：每遍遍历当前各组，按中间值把组一分为二；16 个名字分 8、4、2、1 四遍，每遍仍处理全部 16 项，工作量 <span class=\"katex-inline\">16\\times4=64<\/span>。分割层数为 <span class=\"katex-inline\">\\log_2 N<\/span>，每层总处理 <span class=\"katex-inline\">N<\/span> 项，合计 <span class=\"katex-inline\">N\\log_2 N<\/span>，量级 <span class=\"katex-inline\">O(N\\log N)<\/span>（PDF 第 113 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n二分查找前提：列表已排序。无序表上折半无法判断舍弃哪一半；排序成本是二分的前置代价，不能只算查询阶段。\n<\/li><li>\n快速排序前提：每次分割把数据分成大小相近的两组。真实数据要猜中间值，可对少量数据采样估计；分割不均时效率下滑（PDF 第 113 页）。\n<\/li><li>\n失败案例一：把 <span class=\"katex-inline\">O(1)<\/span> 或对数当成无条件保证。二分的对数收益以有序为前提；哈希表的期望常量查找也以哈希均匀为前提，不是承诺。\n<\/li><li>\n失败案例二：只看小数据量选算法。16 个名字时 136 对 64 差距有限；<span class=\"katex-inline\">N<\/span> 增大后 <span class=\"katex-inline\">N^2<\/span> 与 <span class=\"katex-inline\">N\\log N<\/span> 拉开数量级差距（图 4-1）。\n<\/li><li>\n边界一：量级忽略常数因子。同量级算法谁快，还要看每项操作的实际成本、内存访问和实现细节。\n<\/li><li>\n边界二：存在算法很难、随规模指数膨胀的难题（4.4 节），并非所有问题都有近线性解法；本片段只覆盖查找与排序的常见量级。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>线性 <span class=\"katex-inline\">O(N)<\/span> vs 对数 <span class=\"katex-inline\">O(\\log N)<\/span><\/strong>：线性每项都查；对数每次舍弃一半，步数只随位数增长。\n<\/li><li>\n<strong><span class=\"katex-inline\">N^2<\/span> vs <span class=\"katex-inline\">N\\log N<\/span><\/strong>：二次增长来自每轮遍历剩余全部项；分治把问题切块，每层总量 <span class=\"katex-inline\">N<\/span>、层数 <span class=\"katex-inline\">\\log N<\/span>。\n<\/li><li>\n<strong>二分前提 vs 排序成本<\/strong>：二分省下的查询次数，要与事先排序的工作量一起核算。\n<\/li><li>\n<strong>平均情况 vs 最坏情况<\/strong>：快速排序均匀分割是平均/理想划分；最坏分割退化为接近 <span class=\"katex-inline\">N^2<\/span>，算法分析通常按最坏情形保守估计（PDF 第 110 页）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c05 的线性遍历与逐项计数是本节对比的基线。后继：c07 程序与操作系统处理批量数据时，算法量级直接影响响应；c08 压缩与编码查找也依赖数据组织方式；加密概念 c11 的蛮力攻击量级则是另一类指数增长问题。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（二分查找与排序增长量级：$\\log_2 N$、$N^2$ 与 $N\\log N$）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：折半计数、排序求和与分治层数的完整推算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把查找和排序的量级算清楚，先往回追四层前提：<\/p>\n<ol><li>\n<strong>数据排列状态已知<\/strong>。二分能成立，是因为列表按顺序排好；顺序信息让中点比较具备「舍弃一半」的效力。无序表上这条前提不存在。\n<\/li><li>\n<strong>操作可逐项计数<\/strong>。每比较一次、每遍历一项记一次操作；量级分析先数清步数，再忽略常数与低阶项。\n<\/li><li>\n<strong>分治要能把问题切成同类子问题<\/strong>。快速排序把一组分成两组，每组继续按同一规则切；子问题规模相加等于父问题规模，层数才能按对数计。\n<\/li><li>\n<strong>最坏情形作为估算口径<\/strong>。算法分析按悲观假设：输入可能是最不利排列；平均性能另算，不能拿幸运情况当保证。\n<\/ol>\n<p>依赖链方向：排列前提 → 逐项计数 → 折半/分块结构 → 步数求和 → 主项归类量级。缺排列前提，二分退化为线性；缺均匀分割，快排退化为二次。<\/p>\n<h2>正向推导一：二分查找的折半次数<\/h2>\n<h3>第一步：定位中点<\/h3>\n<p>设有序表有 <span class=\"katex-inline\">N<\/span> 项，下标区间 <span class=\"katex-inline\">[l,r]<\/span>。取中点 <span class=\"katex-inline\">m=\\lfloor(l+r)/2\\rfloor<\/span>，比较目标 <span class=\"katex-inline\">x<\/span> 与 <span class=\"katex-inline\">a_m<\/span>。<\/p>\n<h3>第二步：按比较结果舍弃一半<\/h3>\n<p>相等：返回找到；<span class=\"katex-inline\">x&lt;a_m<\/span>：目标只可能在左半，区间缩为 <span class=\"katex-inline\">[l,m-1]<\/span>；<span class=\"katex-inline\">x&gt;a_m<\/span>：目标只可能在右半，区间缩为 <span class=\"katex-inline\">[m+1,r]<\/span>。舍弃的那一半今后不再检查。<\/p>\n<h3>第三步：重复到区间为空或命中<\/h3>\n<p>每次区间长度约减半。设折半 <span class=\"katex-inline\">k<\/span> 次后候选不足 1 项：<span class=\"katex-inline\">N/2^k\\le1<\/span>，即 <span class=\"katex-inline\">2^k\\ge N<\/span>，<span class=\"katex-inline\">k\\ge\\log_2 N<\/span>。<\/p>\n<h3>第四步：对数含义<\/h3>\n<p>对数是底数 2 得到该数所需自乘次数；<span class=\"katex-inline\">\\log_2 1024=10<\/span>，因为 <span class=\"katex-inline\">2^{10}=1024<\/span>（PDF 第 107 页）。查找步数是 <span class=\"katex-inline\">N<\/span> 的对数，不是 <span class=\"katex-inline\">N<\/span> 的线性函数。<\/p>\n<h2>正向推导二：选择排序的工作量求和<\/h2>\n<h3>第一步：逐轮计数<\/h3>\n<p>第 1 轮在 <span class=\"katex-inline\">N<\/span> 项中找第 1 个，比较 <span class=\"katex-inline\">N<\/span> 次；第 2 轮在剩余 <span class=\"katex-inline\">N-1<\/span> 项中找，比较 <span class=\"katex-inline\">N-1<\/span> 次；最后一轮剩 2 项，比较 2 次；末轮剩 1 项无需比较。总步数<\/p>\n<div class=\"katex-block\">S_N=N+(N-1)+\\cdots+2+1.<\/div>\n<h3>第二步：首尾配对求和<\/h3>\n<p>第 <span class=\"katex-inline\">i<\/span> 项与倒数第 <span class=\"katex-inline\">i<\/span> 项配对：<span class=\"katex-inline\">N+1<\/span>、<span class=\"katex-inline\">(N-1)+2<\/span>、<span class=\"katex-inline\">(N-2)+3<\/span>，每对和为 <span class=\"katex-inline\">N+1<\/span>，共 <span class=\"katex-inline\">N/2<\/span> 对，得<\/p>\n<div class=\"katex-block\">S_N=\\frac{N(N+1)}{2}=\\frac{N^2}{2}+\\frac{N}{2}.<\/div>\n<h3>第三步：忽略低阶项<\/h3>\n<p><span class=\"katex-inline\">N<\/span> 很大时 <span class=\"katex-inline\">N/2<\/span> 相对 <span class=\"katex-inline\">N^2/2<\/span> 可忽略，主项 <span class=\"katex-inline\">N^2/2<\/span>，量级 <span class=\"katex-inline\">O(N^2)<\/span>。这是二次增长：工作量与项数平方成正比。<\/p>\n<h3>第四步：规模放大核算<\/h3>\n<p><span class=\"katex-inline\">N\\to2N<\/span>：<span class=\"katex-inline\">S_{2N}\\approx(2N)^2/2=2N^2<\/span>，约为原 <span class=\"katex-inline\">S_N\\approx N^2/2<\/span> 的 4 倍；<span class=\"katex-inline\">N\\to10N<\/span>：约 100 倍；<span class=\"katex-inline\">N\\to1000N<\/span>：约 100 万倍（PDF 第 111 页）。<\/p>\n<h2>正向推导三：快速排序的分治层数<\/h2>\n<h3>第一步：一次分割<\/h3>\n<p>遍历当前组全部项，按所选中间值把组分为 A～M、N～Z 两组；假设分布均匀，每组约一半（PDF 第 112 页）。<\/p>\n<h3>第二步：递归再分<\/h3>\n<p>对每组重复分割：16 个名字 → 8、8 → 4、4、4、4 → 2 一组 → 1 一组。分割层数：<span class=\"katex-inline\">16\\to8\\to4\\to2\\to1<\/span>，共 <span class=\"katex-inline\">\\log_2 16=4<\/span> 层。<\/p>\n<h3>第三步：每层总工作量<\/h3>\n<p>每层遍历处理的项数加起来仍是全部 <span class=\"katex-inline\">N<\/span> 项；分割 <span class=\"katex-inline\">L=\\log_2 N<\/span> 层，总工作量 <span class=\"katex-inline\">N\\cdot L=N\\log_2 N<\/span>，量级 <span class=\"katex-inline\">O(N\\log N)<\/span>。<\/p>\n<h3>第四步：均匀性假设<\/h3>\n<p>结论成立要求每次分割大小相近。真实数据要猜中间值，可对少量数据采样估计；若每次都把最小元切到一边，子问题规模只减 1，层数退化为 <span class=\"katex-inline\">N<\/span>，工作量接近 <span class=\"katex-inline\">N^2<\/span>（PDF 第 113 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：1024 项的二分折半<\/h3>\n<p><span class=\"katex-inline\">1024\\to512\\to256\\to128\\to64\\to32\\to16\\to8\\to4\\to2\\to1<\/span>，折 10 次，<span class=\"katex-inline\">\\log_2 1024=10<\/span>（PDF 第 107 页）。<\/p>\n<h3>算例 2：不同规模的二分步数<\/h3>\n<p><span class=\"katex-inline\">1000<\/span>：<span class=\"katex-inline\">2^{10}=1024<\/span>，约 10 次；<span class=\"katex-inline\">2000<\/span>：首次比较去掉约 1000，回到 1000 的情形，再加 1 次共 11 次；<span class=\"katex-inline\">10^6\\approx2^{20}<\/span>，约 20 次；<span class=\"katex-inline\">10^9\\approx2^{30}<\/span>，约 30 次。规模放大 1000 倍，步数只多约 10（PDF 第 108 页）。<\/p>\n<h3>算例 3：16 个名字两种排序对照<\/h3>\n<p>选择排序：<span class=\"katex-inline\">16+15+\\cdots+1=16\\times17/2=136<\/span> 次（PDF 第 110 页）。快速排序：<span class=\"katex-inline\">16\\log_2 16=16\\times4=64<\/span> 次（PDF 第 113 页）。小数据差距 2 倍上下；<span class=\"katex-inline\">N=1000<\/span> 时选择排序约 50 万次，<span class=\"katex-inline\">N\\log_2 N\\approx10000<\/span> 次量级，差距拉开到数量级。<\/p>\n<h3>算例 4：<span class=\"katex-inline\">N=1000<\/span> 的二次主项<\/h3>\n<p><span class=\"katex-inline\">S_{1000}=1000\\times1001/2=500\\,500<\/span>；<span class=\"katex-inline\">N^2=1\\,000\\,000<\/span>，主项 <span class=\"katex-inline\">N^2/2=500\\,000<\/span>，低阶 <span class=\"katex-inline\">N/2=500<\/span> 占比极小。<\/p>\n<h3>算例 5：现实电话簿实验<\/h3>\n<p>原书记录：224 页、约 20000 人名的哈佛电话簿找 Harry Lewis，从 112 页 Lawrence、168 页 Rivera、140 页 Morita、126 页 Mark，再到 119、115、117、116 页，同页 90 个名字内比较 7 次，全程共比较 14 次（PDF 第 108 页）。这是二分在真实有序目录上的步数量级体现。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>列表无序却套用二分<\/strong>：中点比较无法指示目标在哪一侧，舍弃一半可能正好丢掉目标；只能逐项遍历。\n<\/li><li>\n<strong>快速排序分割极不均匀<\/strong>：每次只切出一个元素，子问题规模减 1，层数回到 <span class=\"katex-inline\">N<\/span>，工作量接近 <span class=\"katex-inline\">N^2<\/span>，分治优势消失。\n<\/li><li>\n<strong>只按小数据比较算法<\/strong>：16 项时两种排序差距有限；规模上去后 <span class=\"katex-inline\">N^2<\/span> 曲线陡升，图 4-1 中 <span class=\"katex-inline\">N^2<\/span> 远在 <span class=\"katex-inline\">N\\log N<\/span> 之上（PDF 第 113 页）。\n<\/li><li>\n<strong>把量级常数因子忽略过头<\/strong>：同是 <span class=\"katex-inline\">O(N\\log N)<\/span>，每项操作的内存访问成本、比较交换开销仍可能让实现快慢不同；量级是分类，不是性能保证。\n<\/li><li>\n<strong>只算查询不算排序成本<\/strong>：二分省下的查找次数要抵扣事先排序的工作量；查询次数少、数据不常变动时，预先排序可能不划算。\n<\/ul>\n<h2>延伸层：复杂度谱系与难题边界<\/h2>\n<p>图 4-1 四条曲线从慢到快是 <span class=\"katex-inline\">\\log N<\/span>、<span class=\"katex-inline\">N<\/span>、<span class=\"katex-inline\">N\\log N<\/span>、<span class=\"katex-inline\">N^2<\/span>（PDF 第 113 页）。<span class=\"katex-inline\">\\log N<\/span> 出现在折半结构，<span class=\"katex-inline\">N<\/span> 出现在线性遍历，<span class=\"katex-inline\">N\\log N<\/span> 出现在分治排序，<span class=\"katex-inline\">N^2<\/span> 出现在逐轮剩余遍历。4.4 节还讨论了难题与复杂性：有些问题找不到近线性解法，规模稍增工作量按指数膨胀；算法分析的任务是把具体问题归到哪条增长曲线上，而不是笼统说「快」或「慢」。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出二分查找区间缩半的条件，并推出 <span class=\"katex-inline\">k\\ge\\log_2 N<\/span>。\n<\/li><li>\n选择排序总步数为什么等于 <span class=\"katex-inline\">N(N+1)/2<\/span>？低阶项在什么条件下可以忽略？\n<\/li><li>\n快速排序每层总处理多少项？层数为什么是 <span class=\"katex-inline\">\\log_2 N<\/span>？\n<\/li><li>\n二分查找成立的前提是什么？排序成本应不应该计入二分方案？\n<\/li><li>\n举出一个分割不均导致快排退化的情形。\n<\/ol>\n<h2>再推一层：折半计数、排序求和与分治层数的手工复核<\/h2>\n<h3>二分查找的下界推导<\/h3>\n<p>设候选 <span class=\"katex-inline\">N<\/span> 项，每轮比较中点后舍弃一半，候选变为 <span class=\"katex-inline\">\\lceil N/2\\rceil<\/span>。折半 <span class=\"katex-inline\">k<\/span> 次后 <span class=\"katex-inline\">N/2^k\\le1<\/span>，即 <span class=\"katex-inline\">2^k\\ge N<\/span>，<span class=\"katex-inline\">k\\ge\\log_2 N<\/span>。1024 折半序列 512、256、128、64、32、16、8、4、2、1，共 10 次，<span class=\"katex-inline\">\\log_2 1024=10<\/span>（PDF 第 107 页）。1000 接近 <span class=\"katex-inline\">2^{10}<\/span> 约 10 次；2000 首轮去掉约 1000，回到 1000 的情形再加 1 次共 11 次；<span class=\"katex-inline\">10^6\\approx2^{20}<\/span> 约 20 次；<span class=\"katex-inline\">10^9\\approx2^{30}<\/span> 约 30 次。数据放大 1000 倍，步数只多约 10（PDF 第 108 页）。<\/p>\n<h3>选择排序求和复核<\/h3>\n<p>第 1 轮在 <span class=\"katex-inline\">N<\/span> 项中找第 1 个，比较 <span class=\"katex-inline\">N<\/span> 次；第 2 轮在剩余 <span class=\"katex-inline\">N-1<\/span> 项中找，比较 <span class=\"katex-inline\">N-1<\/span> 次；末轮剩 1 项无需比较。总步数 <span class=\"katex-inline\">S_N=N+(N-1)+\\cdots+1=N(N+1)/2=N^2/2+N/2<\/span>。<span class=\"katex-inline\">N<\/span> 很大时低阶 <span class=\"katex-inline\">N/2<\/span> 可忽略，主项 <span class=\"katex-inline\">N^2/2<\/span>，量级 <span class=\"katex-inline\">O(N^2)<\/span>。16 名 <span class=\"katex-inline\">S=16\\times17/2=136<\/span>；<span class=\"katex-inline\">N=1000<\/span> 时 <span class=\"katex-inline\">S=500\\,500<\/span>，<span class=\"katex-inline\">N^2=1\\,000\\,000<\/span>。规模放大：<span class=\"katex-inline\">N\\to2N<\/span> 时间约 4 倍，<span class=\"katex-inline\">N\\to10N<\/span> 约 100 倍，<span class=\"katex-inline\">N\\to1000N<\/span> 约 100 万倍（PDF 第 110–111 页）。<\/p>\n<h3>快速排序分治层数复核<\/h3>\n<p>每遍遍历当前组，按中间值把组分入大小相近的两组，递归再分。16 名分 8、4、2、1 四遍，每层遍历处理的项数合计仍是全部 16 项；分割层数 <span class=\"katex-inline\">\\log_2 16=4<\/span>，总工作量 <span class=\"katex-inline\">16\\times4=64<\/span>（PDF 第 113 页）。一般情形每层总量 <span class=\"katex-inline\">N<\/span>，层数 <span class=\"katex-inline\">\\log_2 N<\/span>，合计 <span class=\"katex-inline\">N\\log_2 N<\/span>，量级 <span class=\"katex-inline\">O(N\\log N)<\/span>。快速排序由 Tony Hoare 于 1959 年左右发明，Hoare 因包括快速排序在内的多项贡献获 1980 年图灵奖（PDF 第 112 页）。<\/p>\n<h3>前提与退化<\/h3>\n<p>二分查找成立的前提是表已排序；无序表折半无法判断舍弃哪一半。快速排序结论要求每次分割大小相近；若每次只切出一个元素，子问题规模减 1，层数退回 <span class=\"katex-inline\">N<\/span>，工作量接近 <span class=\"katex-inline\">N^2<\/span>。哈佛电话簿实验：224 页约 2 万人名，找 Harry Lewis 全程比较 14 次（PDF 第 108 页），是二分在真实有序目录上的步数量级体现。<\/p>\n<h2>补足推导：排序下界的决策树论证、二分步数与分治连算<\/h2>\n<h3>比较排序的下界<\/h3>\n<p>一次比较只能输出「小于」或「不小于」两种结果，比较过程可画成一棵二叉决策树。<span class=\"katex-inline\">n<\/span> 个元素共有 <span class=\"katex-inline\">n!<\/span> 种排列，每种排列必须落到一个不同叶子，故叶子数 <span class=\"katex-inline\">\\ge n!<\/span>；深度为 <span class=\"katex-inline\">h<\/span> 的二叉树最多有 <span class=\"katex-inline\">2^h<\/span> 个叶子，<span class=\"katex-inline\">2^h\\ge n!<\/span>，<span class=\"katex-inline\">h\\ge\\log_2(n!)<\/span>。由斯特林近似 <span class=\"katex-inline\">\\log_2(n!)\\approx n\\log_2 n-1.44n<\/span>，故比较排序最坏工作量下界为 <span class=\"katex-inline\">\\Omega(n\\log n)<\/span>，选择排序这类 <span class=\"katex-inline\">O(n^2)<\/span> 算法达不到信息论下界，快速排序在均匀分割下贴近该下界。<\/p>\n<h3>二分查找步数<\/h3>\n<p>候选 <span class=\"katex-inline\">N<\/span> 项每次折半剩 <span class=\"katex-inline\">\\lceil N/2\\rceil<\/span>，折半 <span class=\"katex-inline\">k<\/span> 次后 <span class=\"katex-inline\">N/2^k\\le1<\/span>，<span class=\"katex-inline\">k\\ge\\log_2 N<\/span>。<span class=\"katex-inline\">N=2^{20}<\/span> 需 20 次；<span class=\"katex-inline\">10^6\\approx2^{20}<\/span> 约 20 次，<span class=\"katex-inline\">10^9\\approx2^{30}<\/span> 约 30 次。数据量增长 1000 倍，二分只多约 10 步。前提是列表已排序；无序表上折半无法判断舍弃哪一半。<\/p>\n<h3>排序工作量连算<\/h3>\n<p>选择排序 <span class=\"katex-inline\">S_N=N+(N-1)+\\cdots+1=N(N+1)/2<\/span>，<span class=\"katex-inline\">N=16<\/span> 时 <span class=\"katex-inline\">16\\times17/2=136<\/span>，主项 <span class=\"katex-inline\">N^2/2<\/span>，量级 <span class=\"katex-inline\">O(N^2)<\/span>。快速排序每遍把组一分为二，分割层数 <span class=\"katex-inline\">\\log_2 N<\/span>，每层总处理 <span class=\"katex-inline\">N<\/span> 项，合计 <span class=\"katex-inline\">N\\log_2 N<\/span>；<span class=\"katex-inline\">N=16<\/span> 时 <span class=\"katex-inline\">16\\times4=64<\/span>。分割极不均匀时快排退回接近 <span class=\"katex-inline\">N^2<\/span>，均匀分割是 <span class=\"katex-inline\">O(N\\log N)<\/span> 成立的前提。<\/p><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.124<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">CPU 执行机制与多级缓存：取指—译码—执行、累加器与局部性<\/a><\/span><\/div><h1>程序设计语言、编译与操作系统分层：汇编到高级语言、前后端与进程调度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书 5.1 汇编语言、5.2 高级语言、5.3 软件开发、第 6 章 软件系统，PDF 第 121–157 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>人想表达的计算是「把 X、Y 相加存到 Z」，CPU 认的却是特定指令集和位模式。中间隔着几层翻译和管理：人写的程序怎么变成机器能执行的指令，不同硬件之间怎样复用同一份代码，同时运行的多个程序由谁分配 CPU 和内存。这个概念把链路拆成两段：向上是语言与编译，解决表达和移植；向下是操作系统与软件分层，解决资源管理和硬件抽象。不看清这两层，就解释不清为什么高级语言程序能在不同机器上跑，也看不懂后台程序在管什么。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>汇编语言<\/strong>：直接对应处理器指令表的符号形式。两台指令集不同的 CPU，同一份计算要分别改写指令序列；程序员必须熟悉两种处理器，小心地把程序从一个指令集换到另一个（PDF 第 124 页）。<\/p>\n<p><strong>高级编程语言<\/strong>：20 世纪 50 年代末到 60 年代初问世，独立于任何 CPU 体系结构，让人以接近自然语言的方式表达计算（PDF 第 124 页）。原书列举 Fortran、C、C++、Java、JavaScript 五种最重要的语言作对照（PDF 第 126 页）。<\/p>\n<p><strong>编译器（compiler）<\/strong>：把高级语言代码翻译为目标处理器汇编指令的翻译程序；汇编器再把汇编指令转换为位模式，加载到存储器执行（PDF 第 124 页）。同一个表达式 <span class=\"katex-inline\">Z=X+Y<\/span>，编译器 #1 生成三条指令（LOAD X、ADD Y、STORE Z），编译器 #2 生成两条（COPY X,Z、ADD Y,Z），各自汇编器再落成不同位模式（图 5-1，PDF 第 125 页）。<\/p>\n<p><strong>前端与后端<\/strong>：编译器内部常分前端和后端。前端把高级语言程序转换为中间形式；后端把中间形式转换为不同体系结构的汇编指令。这比为每种机器写一个完整编译器简单（PDF 第 126 页）。<\/p>\n<p><strong>操作系统（operating system）<\/strong>：管理计算机硬件资源、调度和协调当前运行程序的后台程序。所有计算机——笔记本、手机、平板、播放器、手表、相机、穿戴设备和插件——都通过操作系统管理硬件（PDF 第 155 页）。<\/p>\n<p><strong>进程调度<\/strong>：操作系统把 CPU 时间在运行程序间分配；挂起等待状态的程序（如等待点击的对话框）让出资源，一个程序占用 CPU 过多时被强行中断，好让其他任务分到合理资源（PDF 第 157 页）。通常同时管理数十个进程，多数是用户看不到的系统任务。<\/p>\n<p><strong>软件分层<\/strong>：应用程序在最上层，经由操作系统使用硬件；操作系统再通过设备驱动程序控制具体设备。网络协议也分应用程序、TCP、IP、物理层，每层依赖下层服务、为上层提供服务（图 9-3，PDF 第 253 页）。<\/p>\n<p>正例：一份高级语言源码，用对应编译器分别编译到不同体系结构，各自汇编成不同位模式，源码无需修改。反例：只写汇编程序，换一种处理器指令集就要重写全部代码。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>翻译链路：高级语言源码 → 编译器 → 目标汇编指令 → 汇编器 → 位模式 → 载入 RAM → CPU 取指执行。编译环节还为发现拼写错误、语法错误（少写括号、操作数未定义）提供机会，这些错误必须在生成可执行程序前纠正；汇编指令的任何序列都被假定合法，错误在汇编层很难发现（PDF 第 126 页）。<\/p>\n<p>操作系统历史推演：50 年代初一次只能跑一个程序，程序接管整台机器；第一批广泛使用的操作系统诞生于 50 年代末 60 年代初，由硬件厂商用汇编写成、与硬件紧连（PDF 第 155–156 页）。MIT 1961 年开发 CTSS 分时系统；1969 年贝尔实验室 Thompson 与 Ritchie 据此经验开发 Unix，二人获 1983 年图灵奖；今天多数系统源自 Unix 或兼容 Unix 的 Linux（PDF 第 156 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：高级语言跨体系结构复用，前提是目标平台有对应编译器；操作系统抽象硬件，前提是设备有对应驱动接入系统调用。\n<\/li><li>\n边界一：高级语言程序独立于体系结构，但仍需对应编译器为每种机器生成代码；没有后端支持的平台跑不了该程序。\n<\/li><li>\n失败案例一：把编译通过当成程序正确。语法正确的程序仍可能充斥编译器检测不出的语义错误（PDF 第 126 页）。\n<\/li><li>\n失败案例二：以为应用程序直接操控硬件。中间隔着操作系统、驱动和系统调用层；应用申请资源要经系统调用进入内核。\n<\/li><li>\n边界二：iOS 核心是 Unix 变体，安卓等设备多跑 Linux；家族谱系相近不等于源码完全相同（PDF 第 157 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>汇编 vs 高级语言<\/strong>：汇编贴近指令集、移植要重写；高级语言贴近思维、经编译器跨平台。\n<\/li><li>\n<strong>编译器 vs 汇编器<\/strong>：编译器从高级语言到汇编；汇编器从汇编到位模式。前端/后端是编译器内部分工。\n<\/li><li>\n<strong>操作系统 vs 应用程序<\/strong>：应用完成具体任务；操作系统分配资源、管理硬件，是后台支撑程序。\n<\/li><li>\n<strong>分层 vs 扁平直连<\/strong>：分层每层只对下层提需求、为上层供服务；扁平结构中每个程序都要直接面对所有设备细节。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c04 的取指—译码—执行是编译最终落地的硬件循环。后继：c08 网络把分层思路搬到通信栈；c10 协议栈四层与软件分层同构；c13 云计算把本地操作系统承担的部分功能转移到远程服务器。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（程序设计语言、编译与操作系统分层：汇编到高级语言、前后端与进程调度）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：从一行表达式到位模式的翻译链路，与操作系统的资源管理职责<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把语言、编译和操作系统讲成可推演过程，先往回追四层前提：<\/p>\n<ol><li>\n<strong>硬件只认位模式指令<\/strong>。c04 执行循环从 RAM 取指译码；处理器指令集固定，高级写法必须先落到这套指令上。\n<\/li><li>\n<strong>人表达计算的方式与指令集不同<\/strong>。人写 <span class=\"katex-inline\">Z=X+Y<\/span> 这类接近自然语言的表达式，指令集却是 LOAD/ADD/STORE 这类操作；中间需要翻译层。\n<\/li><li>\n<strong>多种硬件指令集互不相同<\/strong>。同一份计算在两台处理器上指令条数和编码都不同；要复用源码，翻译必须按目标平台分别生成。\n<\/li><li>\n<strong>多个程序要共享同一批硬件<\/strong>。CPU、内存、设备不能被一个程序独占；需要一个居中管理者分配资源、隔离冲突。\n<\/ol>\n<p>依赖链方向：源码表达 → 编译翻译 → 汇编编码 → 位模式执行；硬件共享 → 操作系统调度 → 驱动对接设备。两条链在「程序载入 RAM 运行」这一点汇合。<\/p>\n<h2>正向推导一：一行表达式的编译过程<\/h2>\n<h3>第一步：源码表达式<\/h3>\n<p>高级语言写 <span class=\"katex-inline\">Z=X+Y<\/span>。含义：从存储器位置 X 和 Y 取值，相加，结果存到位置 Z。操作符「=」在这里是「代替/存储」，不是数学上的等于（PDF 第 125 页）。<\/p>\n<h3>第二步：前端生成中间形式<\/h3>\n<p>编译器前端解析表达式，识别操作数 X、Y、Z 和加法操作，生成与具体机器无关的中间形式。这一步做拼写、语法检查：少写括号、操作数未定义等疏漏在此暴露，必须在生成可执行程序前纠正（PDF 第 126 页）。<\/p>\n<h3>第三步：后端生成目标汇编<\/h3>\n<p>后端把中间形式映射到目标处理器指令集。同一表达式，后端 #1 生成三条：LOAD X（X 入累加器）、ADD Y（Y 加到累加器）、STORE Z（结果存 Z）；后端 #2 生成两条：COPY X,Z、ADD Y,Z，无需累加器中转（PDF 第 124、125 页）。<\/p>\n<h3>第四步：汇编器编码成位模式<\/h3>\n<p>汇编器把每条汇编指令转成实际指令位模式，为 X、Y、Z 在存储器留出位置；两台计算机的位模式不一样。最终位模式载入 RAM，进入 c04 的取指—译码—执行循环。<\/p>\n<h3>第五步：前后端分工的收益<\/h3>\n<p>若为每种机器写完整编译器，前端语法分析要重复做几遍；分成「一个前端 + 多个后端」后，前端复用，后端只负责中间形式到该体系结构指令的映射（PDF 第 126 页）。<\/p>\n<h2>正向推导二：操作系统为什么出现、管什么<\/h2>\n<h3>第六步：早期一机一程序<\/h3>\n<p>20 世纪 50 年代初没有应用程序与操作系统之分，计算机一次只能运行一个程序，程序接管整台机器；程序员要预约时间段上机，身份普通的学生只能约在半夜（PDF 第 155 页）。硬件能力有限，人工操作员把程序输入计算机、把结果送交程序员。<\/p>\n<h3>第七步：硬件复杂化要求集中管理<\/h3>\n<p>硬件越来越强、越来越复杂，需要集中更多资源控制它们。第一批广泛使用的操作系统诞生于 50 年代末 60 年代初，由硬件厂商用汇编语言写成，与硬件紧密相连；IBM、Digital Equipment、Data General 都为自己硬件开发自有操作系统（PDF 第 156 页）。<\/p>\n<h3>第八步：调度 CPU<\/h3>\n<p>现代计算机同时运行多个程序：有的等下载网页，有的跟踪鼠标、刷新显示器，有的会干扰其他程序（启动新程序时要在拥挤的 RAM 中再腾空间）。操作系统把 CPU 注意力在各程序间转移：挂起等待状态的程序，阻止个别程序多占资源；程序占用 CPU 过久就强行中断，让其他任务分到合理资源（PDF 第 157 页）。<\/p>\n<h3>第九步：管理内存、设备与文件<\/h3>\n<p>操作系统管理内存分配、磁盘空间，通过设备驱动程序对接具体硬件，通过文件系统组织长期存储的文件。应用程序不直接操控设备，而是经系统调用请操作系统代办。<\/p>\n<h3>第十步：软件分层结构<\/h3>\n<p>从上到下：应用程序 → 操作系统（含系统调用、驱动）→ 硬件。网络侧同构：应用程序 → TCP → IP → 物理层，每层依赖下层服务、为上层提供服务（图 9-3，PDF 第 253 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：同一表达式的指令条数对照<\/h3>\n<p><span class=\"katex-inline\">Z=X+Y<\/span>：三指令序列 LOAD X / ADD Y / STORE Z；两指令序列 COPY X,Z / ADD Y,Z。指令条数差异来自处理器有没有累加器结构；条数少不代表每条更便宜，具体成本要看指令实现。<\/p>\n<h3>算例 2：编译能拦住的错误<\/h3>\n<p>源码少写一个右括号、引用了未定义的量，前端在语法分析阶段报错，程序不会生成可执行文件。反过来，语法正确但逻辑错误（如把加号写成减号）编译器检测不出，属于语义错误，要靠测试和审查发现（PDF 第 126 页）。<\/p>\n<h3>算例 3：系统谱系对照<\/h3>\n<p>MIT 1961 年 CTSS；1969 年贝尔实验室 Thompson 与 Ritchie 开发 Unix；二人获 1983 年图灵奖。今天：Windows 家族由微软开发；Mac OS X 及其后代 iOS 核心是 Unix 变体；安卓、电视机、TiVo、Kindle、Nook 跑 Linux（PDF 第 156–157 页）。谱系继承的是设计脉络，不是同一份二进制。<\/p>\n<h3>算例 4：同时运行的进程量级<\/h3>\n<p>操作系统通常管理数十个同时运行的进程或任务；用户启动的程序之外，多数是看不到的系统任务。Mac OS X 的 Activity Monitor、Windows 的任务管理器可查看进程列表（PDF 第 157 页）。<\/p>\n<h3>算例 5：跨平台复用算账<\/h3>\n<p>一份高级语言源码，为每种目标机器各配一个后端编译；若用汇编写，每种机器重写全部代码。平台越多，编译链路省下的重复劳动越大；前提是目标平台存在对应后端。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>没有编译器，只能写汇编<\/strong>：换处理器指令集就要重写全部程序，程序员必须熟悉每种机器指令表，跨平台开发成本大幅上升。\n<\/li><li>\n<strong>编译器不分前后端<\/strong>：每种机器都要重写一遍语法分析和翻译逻辑；新增一种体系结构时重复劳动翻倍。\n<\/li><li>\n<strong>操作系统不做进程调度<\/strong>：多个程序争抢同一 CPU，一个占住不放，其他程序得不到响应；等待下载、跟踪鼠标、刷新显示的程序与计算密集程序互相干扰，整机陷入混乱（PDF 第 157 页）。\n<\/li><li>\n<strong>应用程序直连硬件<\/strong>：每个程序都要为每种设备写控制细节，设备更换就要改应用；分层把设备细节收敛到驱动和操作系统层。\n<\/li><li>\n<strong>把编译通过当程序正确<\/strong>：语法合法不等于语义正确；未经测试的逻辑错误照样在运行时出错。\n<\/ul>\n<h2>延伸层：语言与系统的后续去向<\/h2>\n<p>第 7 章用 JavaScript 演示循环语句、条件语句、库和接口这些程序基本构造；高级语言的能力边界由控制流（循环、条件）、数据结构和库接口决定。操作系统之上跑的应用，最终仍要回到 c04 的执行循环；网络服务（c08、c10）则把单机的程序—硬件分层搬到跨机器的协议分层上理解。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出「源码 → 位模式」的完整翻译链路，标明编译器与汇编器各在哪一步。\n<\/li><li>\n前端和后端各负责什么？为什么这样分工能减少重复？\n<\/li><li>\n操作系统调度 CPU 时，对等待状态和占用过久的程序分别做什么？\n<\/li><li>\n应用程序为什么不能直接操控硬件？中间经过哪些层？\n<\/li><li>\n语法错误和语义错误在编译阶段的可检出性有什么差别？\n<\/ol>\n<h2>再推一层：编译链路逐段对照，与操作系统调度的职责清单<\/h2>\n<h3>汇编到位模式的翻译<\/h3>\n<p>汇编语言直接对应处理器指令表。两台指令集不同的 CPU，同一份计算要分别改写指令序列；程序员必须熟悉两种处理器，把程序从一个指令集换到另一个（PDF 第 124 页）。汇编器把每条汇编指令转成实际指令位模式，为操作数在存储器留出位置；两台计算机的位模式不一样。<\/p>\n<h3>高级语言到汇编的编译<\/h3>\n<p>20 世纪 50 年代末到 60 年代初，独立于任何 CPU 体系结构的高级编程语言问世。表达式 <span class=\"katex-inline\">Z=X+Y<\/span>：编译器 #1 生成三条指令 LOAD X、ADD Y、STORE Z；编译器 #2 生成两条 COPY X,Z、ADD Y,Z，无需累加器中转（图 5-1，PDF 第 125 页）。前端把高级语言转成与机器无关的中间形式，后端把中间形式映射到不同体系结构的汇编；比为每种机器写一个完整编译器简单（PDF 第 126 页）。拼写错误、语法错误在前端暴露；汇编指令的任何序列都被假定合法，错误在汇编层很难发现。<\/p>\n<h3>操作系统为何出现<\/h3>\n<p>20 世纪 50 年代初没有应用程序与操作系统之分，一次只能运行一个程序，程序接管整台机器，程序员要预约时段上机。第一批广泛使用的操作系统诞生于 50 年代末 60 年代初，由硬件厂商用汇编写成、与硬件紧密相连（PDF 第 155–156 页）。MIT 1961 年开发 CTSS 兼容分时系统；1969 年贝尔实验室 Ken Thompson 与 Dennis Ritchie 结合 CTSS 与 Multics 经验开发 Unix，二人因此获 1983 年图灵奖；今天多数操作系统源自 Unix 或兼容 Unix 的 Linux（PDF 第 156 页）。<\/p>\n<h3>调度与资源管理清单<\/h3>\n<p>操作系统管理 CPU：把注意力在各程序间转移，挂起等待状态的程序，阻止个别程序多占资源；程序占用 CPU 过久就强行中断，让其他任务分到合理资源。通常要管理数十个同时运行的进程或任务，多数是用户看不到的系统任务（PDF 第 157 页）。此外管理内存分配、磁盘空间，通过设备驱动对接具体硬件，用文件系统组织长期存储。日常计算机约 90% 由 Windows 管理；iOS 源自 Mac OS X，核心是 Unix 变体；安卓、电视机、TiVo、Kindle、Nook 跑 Linux（PDF 第 157 页）。<\/p>\n<h3>分层依赖关系<\/h3>\n<p>从上到下：应用程序 → 操作系统（系统调用、驱动）→ 硬件。应用申请资源要经系统调用进入内核，不直接操控设备。网络侧同构：应用程序 → TCP → IP → 物理层，每层依赖下层、为上层服务（图 9-3，PDF 第 253 页）。<\/p>\n<h2>再推一层：从源文件到执行的翻译与装载链路<\/h2>\n<h3>编译到运行的五个阶段<\/h3>\n<p>源代码先由编译器（compiler）翻成目标代码：机器指令加上记录变量、函数符号位置的符号表；链接器（linker）把当前目标文件与所需库文件拼到一起，解析跨文件符号引用；加载器把可执行映像装入内存；操作系统安排地址与资源；CPU 按取指—译码—执行逐条运行。源文件中的变量名在这个过程里逐步替换成内存地址或寄存器。<\/p>\n<h3>解释与编译两条实现路线<\/h3>\n<p>解释器（interpreter）读一行源语句就当场翻译、当场执行，反复解释，调试灵活但运行慢；编译器把整份程序一次性翻成机器码后再执行，跑起来快，但改动后要重新编译。操作系统夹在硬件与应用之间：向上给应用提供文件、内存、设备等抽象，向下通过驱动操控硬件，应用不直接读写设备寄存器。<\/p>\n<h2>补足推导：编译链路的依赖断点、前端后端不变量与调度算例<\/h2>\n<h3>翻译链路去掉一环会怎样<\/h3>\n<p>链路为：高级语言源码 → 编译器前端 → 中间表示 → 后端 → 汇编指令 → 汇编器 → 位模式 → 载入 RAM → CPU 执行。去掉后端，中间表示无法翻成不同体系结构的汇编，跨平台复用落空；去掉前端的语法检查，拼写错误、未定义操作数会流入机器码才暴露；去掉加载器，位模式无法进入内存被计数器取指。<\/p>\n<h3>前后端不变量<\/h3>\n<p>同一份中间表示可由不同后端分别编译到不同指令集，源码无需修改。这一分工比为每种机器写一个完整编译器简单：前端只解析语言一次，后端各自生成目标汇编。汇编器再把汇编指令转成位模式，同一份表达式 <span class=\"katex-inline\">Z=X+Y<\/span>，不同编译器可生成三条指令（LOAD X、ADD Y、STORE Z）或两条指令（COPY X,Z、ADD Y,Z）。<\/p>\n<h3>进程调度算例<\/h3>\n<p>操作系统把 CPU 时间在就绪进程间分配：等待点击、等待 I/O 的进程挂起让出资源，占 CPU 过久的进程被中断，其他任务分到合理时间片。系统通常同时管理数十个进程，多数是用户看不到的系统任务。应用申请资源要经系统调用进入内核，不直接操控设备寄存器；设备差异由驱动在底层屏蔽，向上呈现统一抽象。<\/p><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.229<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">模拟与数字：抽样、量化与模数转换<\/a><\/span><\/div><h1>网络带宽、传播延迟与数据压缩：链路速率、光速时延与冗余编码压缩<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（原书 8.2 带宽、8.3 传播时延、8.6 压缩，PDF 第 225–232 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>传一份文件，先要弄清两件事：通道每秒能送多少比特（带宽），信号从一端跑到另一端要多久（传播时延）；文件越大、通道越忙，传输越慢。原始数据里还塞满重复和少见元素，不压缩就只能照原样占带宽。这个概念把两类问题分开：网络侧按链路速率与距离算传输时间；数据侧按冗余和频率把比特压下来。两者经常被混在一起谈——「网速慢」可能是带宽低，也可能是时延大，还可能是文件没压。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>带宽（bandwidth）<\/strong>：通信通道每秒能传输的比特数，单位 bps（bit per second）。通道两端可能各自有速率限制，整体速度由许可速度最低的那一段决定（PDF 第 229 页）。<\/p>\n<p><strong>传播时延<\/strong>：信号以电磁波形式在介质中传播，速度接近光速。真空中光速 <span class=\"katex-inline\">3\\times10^8<\/span> 米/秒，约合每纳秒 1 英尺；介质中略慢（PDF 第 229 页）。距离越远，单程物理时延越大，与带宽无关。<\/p>\n<p><strong>带宽量级（原书列举）<\/strong>：最早调制解调器 110 bps；802.11 无线局域网理论上 600 Mbps；以太网 1 Gbps；DSL/电缆调制解调器几兆位每秒；光纤 100 Gbps 以上；4G 移动网络理想状态静止 1 Gbps、运动中 100 Mbps（PDF 第 229 页，部分为理论值）。<\/p>\n<p><strong>压缩（compression）<\/strong>：去掉数据中的冗余信息，用更少比特表达同样内容。文本重复字词、图片相邻像素、声音相邻样本都含冗余；压缩靠编码规律把常见元素变短、少见元素变长（PDF 第 230 页）。<\/p>\n<p><strong>频率统计与霍夫曼编码<\/strong>：英文文本中 e、t、a、o、i、n 出现频繁，z、x、q 很少。霍夫曼编码按频率给短编码：常见字母短码、少见字母长码；原书以《傲慢与偏见》为例统计字母频率（PDF 第 230 页）。<\/p>\n<p><strong>无损与有损压缩<\/strong>：无损压缩解压后完全恢复原数据（Zip、bzip2 一类文本压缩）；有损压缩舍弃部分不易察觉的信息，解压得到近似副本（JPEG 图片、MP3/AAC 音频）（PDF 第 231 页）。<\/p>\n<p>正例：把常见字母用短二进制码、罕见字母用长码，整段文本平均码长下降。反例：把已随机化的数据再压缩；随机数据没有冗余可去，常见无损算法对它只能膨胀。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>传输时间核算：把大小为 <span class=\"katex-inline\">D<\/span> 比特的文件经带宽 <span class=\"katex-inline\">B<\/span> bps 的通道发送，占用时间 <span class=\"katex-inline\">T_{\\text{send}}\\approx D/B<\/span>；信号还要加传播时延 <span class=\"katex-inline\">T_{\\text{prop}}=L/c<\/span>（<span class=\"katex-inline\">L<\/span> 距离、<span class=\"katex-inline\">c<\/span> 介质中光速）。总时间不是只看其中一项：大文件受带宽限制更明显，小文件经远距离受传播时延限制更明显。<\/p>\n<p>距离—时延对照（原书数据，PDF 第 229 页）：美国东部到西部约 2500 英里/4000 公里，原书记载约 13 微秒；到西欧约 50 微秒；到悉尼约 110 微秒；到北京约 140 微秒。注意：按 <span class=\"katex-inline\">4000\\,\\text{km}/(3\\times10^8\\,\\text{m/s})<\/span> 物理核算量级为毫秒，原书该处数值与物理核算存在量级出入，引用时以原书记载为准、物理推算另列。<\/p>\n<p>压缩推导：以《傲慢与偏见》为例，约 97000 词、550000 字节；空格出现 91000 次以上，e 约 55100 次，t 约 36900 次，a 约 33200 次；Z 仅 3 次，X 仅 1 次（PDF 第 230 页）。按频率编码后，霍夫曼压缩到约 310000 字节（减少 44%），平均每个字母约 4 位；进一步用 Zip 压到约 202000 字节（减少 64%）；bzip2 压到约 145000 字节（PDF 第 230–231 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：压缩收益以数据存在冗余为前提；带宽核算以「最慢链路决定整段速率」为模型；传播时延只随距离和介质变化。\n<\/li><li>\n边界一：压缩比不是固定值。文本、图片、音频、视频冗余结构不同；已压缩格式（JPEG、MP3）再压几乎不缩水。\n<\/li><li>\n边界二：有损压缩只保留可接受的近似。音乐爱好者可能听出 MP3 与原版 CD 的差别，图片放大后能看出 JPEG 伪影。\n<\/li><li>\n失败案例一：把带宽当传播时延。链路再宽，信号跨洋也要跑完全程；时延由距离决定，不能靠扩容消除。\n<\/li><li>\n失败案例二：把理论峰值当实际速率。无线受干扰、网络有拥塞、其他链路有低速率段，实测常低于标称。\n<\/li><li>\n失败案例三：以为压缩可以无限进行。无损压缩受信息熵下限约束；有损压缩继续压就开始伤可辨内容。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>带宽 vs 传播时延<\/strong>：带宽是每秒比特数（容量），时延是信号跑完全程的时间（距离）；大文件先受带宽约束，小文件先受距离约束。\n<\/li><li>\n<strong>无损 vs 有损<\/strong>：无损可完整还原；有损换更高压缩比，换回的是近似。\n<\/li><li>\n<strong>文本压缩 vs 媒体压缩<\/strong>：文本靠频率编码与重复模式；图片靠相邻像素相似，声音/视频靠相邻样本和帧间冗余。\n<\/li><li>\n<strong>链路最低速率 vs 端到端峰值<\/strong>：整条通道由最慢许可段决定，不是把各段速率相加或取最高。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c03 抽样量化决定原始音频图片的比特量，是压缩前的数据大小；c02 位宽与字节换算是速率和文件大小的计算单位。后继：c10 协议栈把带宽与时延放在分组传输里核算；c13 云服务体验受带宽、时延与客户端能力共同约束。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（网络带宽、传播延迟与数据压缩：链路瓶颈、光速限制与无损/有损压缩）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：传输时间的两段拆分，与频率编码压缩的逐项推算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把带宽、时延和压缩讲成可推演过程，先往回追四层前提：<\/p>\n<ol><li>\n<strong>比特是传输与存储的统一计量单位<\/strong>。文件大小先归到比特数；图片按像素乘位深、音频按采样率乘声道乘精度展开，才能和带宽公式对接（c02、c03）。\n<\/li><li>\n<strong>通道由多段链路串联<\/strong>。端到端路径上每一段各有速率，整段能跑多快受许可速度最低的一段约束，不是各段取平均或取最高。\n<\/li><li>\n<strong>信号传播服从物理速度上限<\/strong>。电磁波在介质中接近光速，距离决定单程时延；这段时间与通道每秒能送多少比特相互独立。\n<\/li><li>\n<strong>数据内部存在可编码的规律<\/strong>。重复字词、相近像素、相邻样本造成冗余；压缩靠把规律翻译成更短编码，而不是把信息凭空删掉。\n<\/ol>\n<p>依赖链方向：比特量 → 分段速率取瓶颈 → 发送时间；距离介质 → 传播时延；冗余结构 → 频率/预测编码 → 压缩比。两条链在「端到端多久拿到文件」这个问题上汇合。<\/p>\n<h2>正向推导一：文件传输时间拆成两段<\/h2>\n<h3>第一步：文件大小归到比特<\/h3>\n<p>设文件大小 <span class=\"katex-inline\">D<\/span> 比特。若已知字节数，按 1 字节 8 位换算 <span class=\"katex-inline\">D=8\\times(\\text{字节数})<\/span>。<\/p>\n<h3>第二步：找链路瓶颈带宽<\/h3>\n<p>端到端路径有若干段，各段带宽 <span class=\"katex-inline\">B_1,B_2,\\dots,B_m<\/span> bps。整段许可带宽<\/p>\n<div class=\"katex-block\">B=\\min(B_1,B_2,\\dots,B_m).<\/div>\n<p>一台 1 Gbps 以太网的设备经 56k 调制解调器或低速移动链路上网，整段仍按低速段算。<\/p>\n<h3>第三步：发送时间<\/h3>\n<p>把 <span class=\"katex-inline\">D<\/span> 比特逐位推上链路，占用时间<\/p>\n<div class=\"katex-block\">T_{\\text{send}}\\approx \\frac{D}{B}.<\/div>\n<p>这一段随文件变大线性增长，随瓶颈带宽增大反比下降。<\/p>\n<h3>第四步：传播时延<\/h3>\n<p>信号沿介质跑过距离 <span class=\"katex-inline\">L<\/span>，速度 <span class=\"katex-inline\">c<\/span>（真空 <span class=\"katex-inline\">3\\times10^8<\/span> 米/秒），传播时延<\/p>\n<div class=\"katex-block\">T_{\\text{prop}}=\\frac{L}{c}.<\/div>\n<p>这段只由距离和介质决定，与文件大小无关；链路再宽，信号也不能提前到达。<\/p>\n<h3>第五步：总时间<\/h3>\n<p>端到端拿到文件，近似 <span class=\"katex-inline\">T\\approx T_{\\text{send}}+T_{\\text{prop}}<\/span>。大文件、低带宽场景 <span class=\"katex-inline\">T_{\\text{send}}<\/span> 占主项；小文件、长距离场景 <span class=\"katex-inline\">T_{\\text{prop}}<\/span> 占主项。<\/p>\n<h2>正向推导二：抽样数据的比特量先算清<\/h2>\n<h3>第六步：图片比特量<\/h3>\n<p>3000×2000 像素，每像素 RGB 三通道，每通道一个强度值；共 600 万像素、1800 万强度值（PDF 第 57 页）。若每通道 8 位，未压缩图片比特量 <span class=\"katex-inline\">=6000000\\times24<\/span> 位。<\/p>\n<h3>第七步：音频比特量<\/h3>\n<p>CD 音质每秒 44100 个采样，立体声 2 声道，精度 <span class=\"katex-inline\">1/65536=2^{16}<\/span>，每样本 16 位；每秒比特量 <span class=\"katex-inline\">=44100\\times2\\times16<\/span>（PDF 第 61 页）。<\/p>\n<h3>第八步：压缩在原始比特量上扣减<\/h3>\n<p>这些原始量里相邻像素、相邻样本高度相似，冗余可去；压缩后的比特量才是真正占带宽和存储的部分。CD 约 700MB、DVD 约 5GB 是原书对照的存储量级（PDF 第 62 页）。<\/p>\n<h2>正向推导三：频率编码压缩的推算<\/h2>\n<h3>第九步：统计频率分布<\/h3>\n<p>以《傲慢与偏见》为例：约 97000 词、550000 字节；空格出现 91000 次以上，e 约 55100 次，t 约 36900 次，a 约 33200 次；Z 仅 3 次，X 仅 1 次（PDF 第 230 页）。高频字符占比大，低频字符占比小。<\/p>\n<h3>第十步：按频率分配编码长度<\/h3>\n<p>霍夫曼编码把短码分给高频字符、长码分给低频字符；平均码长由频率加权决定。压缩到约 310000 字节后，平均每个字母约 4 位（PDF 第 231 页）。<\/p>\n<h3>第十一步：多级压缩递进<\/h3>\n<p>霍夫曼结果再经 Zip 压到约 202000 字节（减少约 64% 相对原 550000）；bzip2 进一步压到约 145000 字节（PDF 第 231 页）。不同算法利用的重复模式不同，逐级扣减残余冗余。<\/p>\n<h3>第十二步：无损与有损分界<\/h3>\n<p>无损路线解压后逐位还原原数据；JPEG、MP3/AAC 一类有损压缩舍弃不易察觉的细节，MP3/AAC 可压到约原版 1/10，JPEG 可达 10 倍甚至更多（PDF 第 231 页）。继续压有损文件，先出现可辨的画质音质损失。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：带宽瓶颈<\/h3>\n<p>路径：内部以太网 1 Gbps，接入 DSL 几兆位每秒。<span class=\"katex-inline\">B=\\min(1\\,\\text{Gbps},\\text{几 Mbps})=<\/span> 几 Mbps；1 Gbps 段不会把整段抬到千兆。原书列举的量级：最早调制解调器 110 bps；802.11 理论 600 Mbps；以太网 1 Gbps；光纤 100 Gbps 以上；4G 理想静止 1 Gbps、运动中 100 Mbps（PDF 第 229 页，含理论值）。<\/p>\n<h3>算例 2：发送时间量级<\/h3>\n<p>设文件 <span class=\"katex-inline\">D=10^8<\/span> 比特（约 12.5MB），瓶颈 <span class=\"katex-inline\">B=10<\/span> Mbps <span class=\"katex-inline\">=10^7<\/span> bps，<span class=\"katex-inline\">T_{\\text{send}}=10^8/10^7=10<\/span> 秒。若 <span class=\"katex-inline\">B=1<\/span> Mbps，<span class=\"katex-inline\">T_{\\text{send}}=100<\/span> 秒；带宽降一个数量级，发送时间涨一个数量级。<\/p>\n<h3>算例 3：传播时延对照（原书记载）<\/h3>\n<p>美东到美西约 2500 英里/4000 公里，原书记约 13 微秒；西欧约 50 微秒；悉尼约 110 微秒；北京约 140 微秒（PDF 第 229 页）。注意：按 <span class=\"katex-inline\">4000\\,\\text{km}/(3\\times10^8\\,\\text{m/s})<\/span> 物理核算约 13 毫秒，与原书微秒数值存在量级出入；引用时以原书记载为准，物理推算另列。<\/p>\n<h3>算例 4：文本压缩比<\/h3>\n<p>原 550000 字节 → 霍夫曼约 310000 字节（减 44%）→ Zip 约 202000 字节（减 64%）→ bzip2 约 145000 字节（PDF 第 230–231 页）。相对 550000，bzip2 压缩比约 <span class=\"katex-inline\">550000/145000\\approx3.8<\/span>。<\/p>\n<h3>算例 5：媒体压缩对照<\/h3>\n<p>MP3/AAC 约为 CD 原版 1/10；JPEG 压缩比可达 10 倍或更多；电影约 24 帧/秒，电视约 25–30 帧/秒，帧间冗余是视频压缩的主要来源（PDF 第 62、231 页）。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>去掉冗余压缩<\/strong>：文本按固定等长编码、图片声音按原始采样量原样传输，带宽和存储占用按未压缩比特量计；长距离网页、流媒体在低带宽链路上无法实用。\n<\/li><li>\n<strong>把最慢链路漏掉<\/strong>：若只按高速段估算传输时间，接入段拥塞或低速调制解调器会让实测时间远长于估算；瓶颈决定整段速率。\n<\/li><li>\n<strong>把带宽当传播时延<\/strong>：以为扩容就能消除跨洋延迟；距离造成的物理时延不因链路变宽而缩短，只能靠缩短路径或就近部署缓解。\n<\/li><li>\n<strong>对随机数据强行无损压缩<\/strong>：随机序列没有频率规律和重复模式，短编码没有可分配的高频对象，压缩结果只会膨胀。\n<\/li><li>\n<strong>有损压缩无上限地往下压<\/strong>：越过人眼人耳的可接受阈值后，伪影、失真变得可辨；压缩比受可接受质量约束。\n<\/ul>\n<h2>延伸层：压缩与编码的后续去向<\/h2>\n<p>压缩编码与 c02 的二进制表示直接相关：编码长度由频率决定，位值展开决定一个编码能区分多少符号。网络传输中，压缩后的数据再经 c09 的校验位保护完整性；万维网协议（c10）在传输前协商编码格式；云服务（c13）把压缩、带宽、时延一起纳入远程访问体验。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">T_{\\text{send}}<\/span> 与 <span class=\"katex-inline\">T_{\\text{prop}}<\/span> 的公式，并说明各自由哪些变量决定。\n<\/li><li>\n为什么端到端带宽取各段最小值？举例说明高速段不能抬升整段速率。\n<\/li><li>\n按 3000×2000、RGB 三通道、每通道 8 位，估算未压缩图片比特量。\n<\/li><li>\n霍夫曼编码按什么原则分配编码长度？高频、低频字符各得什么？\n<\/li><li>\n无损与有损压缩在可还原程度上的差别是什么？有损压到更低会出现什么？\n<\/ol>\n<h2>再推一层：发送时间与传播时延分离核算，以及压缩比的逐级对照<\/h2>\n<h3>两段时间的独立来源<\/h3>\n<p>发送时间 <span class=\"katex-inline\">T_{\\text{send}}\\approx D/B<\/span>，随文件大小线性增长、随瓶颈带宽反比下降；传播时延 <span class=\"katex-inline\">T_{\\text{prop}}=L/c<\/span>，只由距离和介质决定。总时间近似 <span class=\"katex-inline\">T\\approx T_{\\text{send}}+T_{\\text{prop}}<\/span>。大文件、低带宽场景发送时间占主项；小文件、长距离场景传播时延占主项。带宽扩容缩短不了物理距离造成的时延，提高距离就近部署也换不来大文件的发送速度。<\/p>\n<h3>带宽瓶颈取最小值<\/h3>\n<p>端到端路径各段带宽 <span class=\"katex-inline\">B_1,\\dots,B_m<\/span>，整段许可带宽 <span class=\"katex-inline\">B=\\min(B_i)<\/span>。一台 1 Gbps 以太网设备经低速接入链路上网，整段仍按低速段算。原书量级：最早调制解调器 110 bps；802.11 理论 600 Mbps；以太网 1 Gbps；DSL/电缆几兆位每秒；光纤 100 Gbps 以上；4G 静止理想 1 Gbps、运动 100 Mbps（PDF 第 229 页，含理论值）。<\/p>\n<h3>距离时延对照与口径出入<\/h3>\n<p>真空中 <span class=\"katex-inline\">c\\approx3\\times10^8<\/span> 米/秒，约 1 英尺/纳秒。原书记载美东到美西约 2500 英里/4000 公里约 13 微秒，西欧约 50 微秒，悉尼约 110 微秒，北京约 140 微秒（PDF 第 229 页）。按 <span class=\"katex-inline\">4000\\,\\text{km}/(3\\times10^8\\,\\text{m/s})<\/span> 物理核算约 13 毫秒，与原书微秒数值存在量级出入；引用以原书记载为准，物理推算另列。<\/p>\n<h3>文本压缩逐级对照<\/h3>\n<p>《傲慢与偏见》约 97000 词、550000 字节；空格 91000 次以上，e 约 55100 次，t 约 36900 次，a 约 33200 次；Z 仅 3 次，X 仅 1 次（PDF 第 230 页）。霍夫曼按频率分配短码长码，压到约 310000 字节（减 44%），平均每字母约 4 位；Zip 压到约 202000 字节（减 64%）；bzip2 压到约 145000 字节（PDF 第 230–231 页）。相对 550000，bzip2 压缩比约 <span class=\"katex-inline\">550000/145000\\approx3.8<\/span>。<\/p>\n<h3>媒体压缩与冗余来源<\/h3>\n<p>图片相邻像素相似，声音、视频相邻样本和帧间冗余高；MP3/AAC 约压到原版 1/10，JPEG 可达 10 倍或更多；电影约 24 帧/秒，电视约 25–30 帧/秒（PDF 第 62、231 页）。无损压缩解压后逐位还原；有损压缩舍弃不易察觉细节，继续压就开始出现可辨伪影和失真。已随机化的数据没有冗余可去，常见无损算法对它只能膨胀。<\/p>\n<h2>补足推导：两类延迟分开计量、传输延迟算例与压缩比口径<\/h2>\n<h3>传播延迟与传输延迟不可混为一谈<\/h3>\n<p>链路里有两类独立延迟：传播延迟由光速与物理距离决定，线路再快也压不掉；传输延迟由数据量与带宽决定，<span class=\"katex-inline\">T_\\mathrm{传输}=\\text{数据量}/\\text{带宽}<\/span>。总耗时还可能叠加排队与处理延迟。把带宽当成「距离近」是常见误判：跨洲链路传播延迟大，本地链路带宽可能很高，两者是不同维度。<\/p>\n<h3>带宽算例<\/h3>\n<p>带宽 1 Mbps <span class=\"katex-inline\">=10^6<\/span> 位/秒；1 MB <span class=\"katex-inline\">=8\\times10^6<\/span> 位，在 1 Mbps 下需 8 秒；同一文件在 100 Mbps 下需 <span class=\"katex-inline\">8\\times10^6/10^8=0.08<\/span> 秒。文件越大、带宽越低，传输延迟占比越高；传播延迟则与文件大小无关，只随距离变化。<\/p>\n<h3>压缩比口径<\/h3>\n<p>未压缩图像约 18 MB，JPEG 压到约 1.8 MB，压缩比 10:1；CD 音频约 176.4 KB/s，MP3/AAC 压到约十分之一码率。压缩收益来自数据中的冗余：统计冗余、重复像素与听觉视觉可分辨性。无损压缩解出与源文件逐位一致的结果；有损压缩舍弃感知不到的细节，被舍部分无法恢复。<\/p><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/普林斯顿计算机公开课 ([美] Brian W. Kernighan) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.233<\/div><div class=\"prereq-bar\"
