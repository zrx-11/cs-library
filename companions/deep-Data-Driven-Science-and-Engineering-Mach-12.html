>u_0<\/span>，下一时刻用新测量重解。模型辨识自 SINDYc/eDMD 时，闭环预测基于数据驱动模型（PDF 第 373–374 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ol><li>\n<strong>LQR 前提<\/strong>：系统可控、全状态可测（或有全状态估计）；<span class=\"katex-inline\">Q,R<\/span> 权重反映真实工程偏好，权重选错最优解偏离意图。\n<\/li><li>\n<strong>LQR 不管约束<\/strong>：作动饱和、速率限制、状态禁区不在二次代价里；硬约束要 MPC 或约束 LQR 扩展。\n<\/li><li>\n<strong>鲁棒性边界<\/strong>：过稳定设计放大噪声增益，小延迟下可能失稳；LQR 给出的是标称模型最优，不含量化的稳定裕度保证（PDF 第 316 页）。\n<\/li><li>\n<strong>MPC 模型精度依赖<\/strong>：预测偏差被滚动优化当最优轨迹放大；模型不确定性要留约束余量，并用闭环数据更新模型。\n<\/li><li>\n<strong>失败案例<\/strong>：高维系统直接做 LQR/MPC。Riccati 方程与 MPC 优化都随状态维数立方级增长，必须先降阶到 c08 的 ROM 再设计控制器。\n<\/li><li>\n<strong>失败案例<\/strong>：数据驱动模型在训练工况外失真，MPC 仍按失真模型预测，约束越界；模型可信度边界等于快照覆盖范围。\n<\/ol>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>LQR vs 极点配置<\/strong>：极点配置只指定闭环位置，不管控制代价；LQR 在二次代价下求最优增益，极点位置是优化结果而非预设。\n<\/li><li>\n<strong>LQR vs MPC<\/strong>：LQR 是常增益、无显式约束、无限时域最优；MPC 是滚动优化、显式处理约束、有限时域重复求解。线性无约束时 MPC 极限趋近 LQR。\n<\/li><li>\n<strong>反馈控制 vs 模型辨识<\/strong>：c05/c06 回答&quot;模型从哪来&quot;，本章回答&quot;模型上怎么设计输入&quot;；DMDc/SINDYc 把辨识与控制接口接上。\n<\/li><li>\n<strong>状态反馈 vs 输出反馈<\/strong>：LQR 假定全状态；只有输出 <span class=\"katex-inline\">y=Cx<\/span> 时需 Kalman 滤波先估计状态，再串 LQR（LQG，第 8.6 节）。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：c08 ROM 把高维系统压到 <span class=\"katex-inline\">r<\/span> 维；c05/c06 提供数据驱动模型；线性系统可控性、可观性。\n<\/li><li>\n后继：第 9 章 Balanced Reduction 从 Gramians 角度做面向控制的降阶；MPC 在线优化依赖低维模型速度；传感器布置（c10）保证状态可估计。\n<\/li><li>\n串联：本章是全书链条的闭环出口——降维、辨识、建模最终都服务于&quot;用最少控制把系统拉回目标&quot;。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（LQR 与 Model Predictive Control (MPC)）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：Riccati 方程推导、标量 LQR 算例与 MPC 滚动结构<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把&quot;代价最优反馈 <span class=\"katex-inline\">u=-K_rx<\/span>&quot;推到底，逐级倒查：<\/p>\n<ol><li>\n最优性来自变分/动态规划配平，倒查到代价函数形式（二次状态、二次控制）与动力学约束。\n<\/li><li>\n反馈是线性常增益，倒查到值函数二次型 ansatz <span class=\"katex-inline\">V=x^*Px<\/span>；只有二次代价配二次值函数才得到线性反馈。\n<\/li><li>\n<span class=\"katex-inline\">P<\/span> 由 Riccati 方程解出，倒查到协态方程与驻点条件；<span class=\"katex-inline\">P<\/span> 存在唯一正定解要求系统可控、<span class=\"katex-inline\">R\\succ0<\/span>。\n<\/li><li>\n闭环稳定性由 <span class=\"katex-inline\">A-BK_r<\/span> 特征值决定，倒查到 c05 线性系统谱判据。\n<\/li><li>\nMPC 显式处理约束，倒查到每步有限时域优化问题；模型精度与状态维数决定在线求解可行性。\n<\/ol>\n<p>链条断掉：状态不可测，LQR 反馈缺输入；<span class=\"katex-inline\">R<\/span> 半正定，控制项无惩罚、最优增益发散；模型在预测时域外失真，滚动优化沿偏差外推。<\/p>\n<h2>正向推导<\/h2>\n<ul><li>\n第一步，问题设定。<span class=\"katex-inline\">\\dot x=Ax+Bu<\/span>，代价 <span class=\"katex-inline\">J=\\int_0^{t_f}\\frac12(x^<em>Qx+u^<\/em>Ru)dt+\\frac12x(t_f)^*Q_fx(t_f)<\/span>，<span class=\"katex-inline\">Q\\succeq0<\/span>，<span class=\"katex-inline\">R\\succ0<\/span>。\n<\/li><li>\n第二步，增广代价。引入协态 <span class=\"katex-inline\">\\lambda<\/span> 强制动力学约束：<span class=\"katex-inline\">J_{\\text{aug}}=\\int[\\frac12(x^<em>Qx+u^<\/em>Ru)+\\lambda^<em>(Ax+Bu-\\dot x)]dt+\\frac12x_f^<\/em>Q_fx_f<\/span>。\n<\/li><li>\n第三步，变分。<span class=\"katex-inline\">\\delta J_{\\text{aug}}=\\int(\\partial L/\\partial x\\,\\delta x+\\partial L/\\partial u\\,\\delta u+\\lambda^<em>A\\delta x+\\lambda^<\/em>B\\delta u-\\lambda^<em>\\delta\\dot x)dt+Q_fx_f\\delta x_f<\/span>；分部积分 <span class=\"katex-inline\">-\\int\\lambda^<\/em>\\delta\\dot x\\,dt<\/span> 得边界项与 <span class=\"katex-inline\">+\\dot\\lambda^*\\delta x<\/span> 项（PDF 第 318 页公式 8.50）。\n<\/li><li>\n第四步，配平系数。<span class=\"katex-inline\">\\delta u<\/span> 系数：<span class=\"katex-inline\">u^<em>R+\\lambda^<\/em>B=0<\/span>，转置 <span class=\"katex-inline\">Ru+B^<em>\\lambda=0<\/span>；<span class=\"katex-inline\">\\delta x<\/span> 系数给出协态方程 <span class=\"katex-inline\">\\dot\\lambda=-(A^<\/em>\\lambda+Qx)<\/span>。\n<\/li><li>\n第五步，Riccati ansatz。设 <span class=\"katex-inline\">\\lambda=Px<\/span>，<span class=\"katex-inline\">P=P^<em><\/span>。代入 <span class=\"katex-inline\">Ru+B^<\/em>Px=0<\/span>，<span class=\"katex-inline\">u=-R^{-1}B^<em>Px=-K_rx<\/span>，<span class=\"katex-inline\">K_r=R^{-1}B^<\/em>P<\/span>。\n<\/li><li>\n第六步，代数 Riccati 方程。协态方程两边对时间求导并代入 <span class=\"katex-inline\">\\dot x=Ax+Bu<\/span>，配平 <span class=\"katex-inline\">x<\/span> 系数：\n<\/ul>\n<div class=\"katex-block\">A^*P+PA-PBR^{-1}B^*P+Q=0<\/div>\n<p>解出 <span class=\"katex-inline\">P\\succ0<\/span>，反馈增益随之确定。<\/p>\n<ul><li>\n第七步，闭环。<span class=\"katex-inline\">\\dot x=(A-BK_r)x<\/span>；可控条件下 Riccati 解使闭环特征值位于左半平面。\n<\/li><li>\n第八步，MPC 结构。时域 <span class=\"katex-inline\">N<\/span> 步，优化序列 <span class=\"katex-inline\">u_{0:N-1}<\/span>：\n<\/ul>\n<div class=\"katex-block\">\\min\\sum_{k=0}^{N-1}(x_k^*Qx_k+u_k^*Ru_k)+x_N^*Q_fx_N<\/div>\n<p>约束 <span class=\"katex-inline\">x_{k+1}=f(x_k,u_k)<\/span>、<span class=\"katex-inline\">u_{\\min}\\le u_k\\le u_{\\max}<\/span>。每步解 QP/NLP，执行首步 <span class=\"katex-inline\">u_0<\/span>，下一时刻以新测量滚动重解。<\/p>\n<ul><li>\n复杂度口径：连续代数 Riccati 方程求解量级 <span class=\"katex-inline\">O(n^3)<\/span>；MPC 每步优化变量 <span class=\"katex-inline\">N\\cdot n_u<\/span>，约束随 <span class=\"katex-inline\">N<\/span> 增长，在线求解时间是实时控制瓶颈；这一步要求状态先降到 c08 的 <span class=\"katex-inline\">r<\/span> 维。\n<\/ul>\n<h2>数值算例：标量 LQR 求解<\/h2>\n<p><strong>已知条件<\/strong>：标量系统 <span class=\"katex-inline\">\\dot x=ax+bu<\/span>，<span class=\"katex-inline\">b=1<\/span>，<span class=\"katex-inline\">Q=1<\/span>，<span class=\"katex-inline\">R=1<\/span>。Riccati 标量化为<\/p>\n<div class=\"katex-block\">2aP-\\frac{P^2b^2}{R}+Q=0<\/div>\n<p><strong>情形一：<span class=\"katex-inline\">a=0<\/span>（积分环节）<\/strong>。方程 <span class=\"katex-inline\">-P^2+1=0<\/span>，正定解 <span class=\"katex-inline\">P=1<\/span>。增益<\/p>\n<div class=\"katex-block\">K_r=R^{-1}bP=1<\/div>\n<p>闭环 <span class=\"katex-inline\">\\dot x=(0-1\\cdot1)x=-x<\/span>，闭环特征值 <span class=\"katex-inline\">-1<\/span>。数值求解 Riccati 方程得 <span class=\"katex-inline\">P=1.0000<\/span>，<span class=\"katex-inline\">K=1.0000<\/span>，闭环特征值 <span class=\"katex-inline\">-1.0000<\/span>，核对一致。<\/p>\n<p><strong>情形二：<span class=\"katex-inline\">a=1<\/span>（不稳定开环）<\/strong>。方程 <span class=\"katex-inline\">2P-P^2+1=0<\/span>，即 <span class=\"katex-inline\">P^2-2P-1=0<\/span>，解<\/p>\n<div class=\"katex-block\">P=\\frac{2+\\sqrt{4+4}}{2}=1+\\sqrt2=2.4142<\/div>\n<p>增益 <span class=\"katex-inline\">K=P=2.4142<\/span>，闭环 <span class=\"katex-inline\">a-bK=1-2.4142=-1.4142=-\\sqrt2<\/span>。数值求解得 <span class=\"katex-inline\">P=2.4142<\/span>，<span class=\"katex-inline\">K=2.4142<\/span>，闭环特征值 <span class=\"katex-inline\">-1.4142<\/span>，核对一致。<\/p>\n<p><strong>权重敏感度对照<\/strong>。<span class=\"katex-inline\">R<\/span> 增大到 4：情形一 Riccati 变为 <span class=\"katex-inline\">-P^2/4+1=0<\/span>，<span class=\"katex-inline\">P=2<\/span>，<span class=\"katex-inline\">K=P/R=0.5<\/span>，闭环 <span class=\"katex-inline\">\\dot x=-0.5x<\/span>，调节变慢、控制变柔；<span class=\"katex-inline\">R<\/span> 减小则增益增大、闭环更激进。<span class=\"katex-inline\">Q<\/span> 增大等价于更重视状态偏差，<span class=\"katex-inline\">P<\/span> 与增益上升。<\/p>\n<p><strong>MPC 对照（解析结构）<\/strong>。标量无约束线性系统、时域 <span class=\"katex-inline\">N<\/span> 步，MPC 滚动解的首步增益在 <span class=\"katex-inline\">N\\to\\infty<\/span> 时趋近 LQR 增益；有限时域末端代价 <span class=\"katex-inline\">Q_f<\/span> 起截断补偿作用。加入 <span class=\"katex-inline\">|u|\\le u_{\\max}<\/span> 后，LQR 无约束解越界时 MPC 把首步输入钳到约束边界，这是 LQR 做不到的部分。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：状态不可测。没有全状态反馈，<span class=\"katex-inline\">u=-K_rx<\/span> 缺输入；需先设计观测器估计状态，估计误差进入反馈。 反例二：作动饱和。LQR 最优解算出 <span class=\"katex-inline\">u&gt;u_{\\max}<\/span>，实际执行钳位，闭环不再是名义 LQR 闭环，可能失稳；约束问题应交 MPC。 反例三：模型偏差大。MPC 按辨识模型预测，真实系统在预测时域内偏离模型，优化出的轨迹建立在偏差上；需鲁棒余量或在线辨识更新。 反例四：高维直接优化。<span class=\"katex-inline\">n<\/span> 大时 Riccati 与 MPC 在线成本不可接受；先 POD 降阶到 <span class=\"katex-inline\">r<\/span> 维再设计控制器。<\/p>\n<h2>与相邻概念的推导衔接<\/h2>\n<p>c08 ROM 提供低维状态 <span class=\"katex-inline\">a<\/span>，LQR/MPC 在 <span class=\"katex-inline\">r<\/span> 维上设计；c05 DMD、c06 SINDYc 提供 MPC 预测模型；c10 传感器布置保证低维状态可观测；第 9 章 Gramians 平衡降阶按可控/可观性排序状态，与 LQR 设计直接相关。<\/p>\n<h2>推导中容易跳过的环节<\/h2>\n<ul><li>\n协态 <span class=\"katex-inline\">\\lambda=Px<\/span> 是 ansatz，不是前提；二次代价下值函数恰为二次型才使该闭合。\n<\/li><li>\nRiccati 方程要取正定解；二次方程另一解不对应稳定闭环。\n<\/li><li>\nMPC 执行首步后滚动重解，不是把整条优化序列一次用完；时序信息每步更新。\n<\/ul>\n<h2>补充推演：可控性前提、分离原理与 MPC 约束结构<\/h2>\n<ul><li>\n可控性前提。Riccati 方程存在正定稳定解，要求 <span class=\"katex-inline\">(A,B)<\/span> 可稳（不稳定模态可控）。不可控方向上的状态偏差无法被输入消除，<span class=\"katex-inline\">Q<\/span> 在该方向的权重只会积累不可达代价；先做可控性分解再设计反馈。\n<\/li><li>\n全状态与输出反馈。LQR 用 <span class=\"katex-inline\">x<\/span> 全状态；实际只有 <span class=\"katex-inline\">y=Cx<\/span> 时，Kalman 滤波先估计 <span class=\"katex-inline\">\\hat x<\/span>，再串 LQR 反馈 <span class=\"katex-inline\">u=-K_r\\hat x<\/span>，构成 LQG。估计器与控制器在分离原理下分别设计（第 8.5、8.6 节）。\n<\/li><li>\n离散时间对照。离散系统 <span class=\"katex-inline\">x_{k+1}=Ax_k+Bu_k<\/span>，有限时域代价 <span class=\"katex-inline\">\\sum(x_k^TQx_k+u_k^TRu_k)<\/span>，离散 Riccati 方程递推黎卡提增益；稳态增益对应离散 LQR。本算例连续时间结论在离散框架下形式对应，谱判据换成 <span class=\"katex-inline\">|\\lambda|&lt;1<\/span>。\n<\/li><li>\nMPC 约束清单。典型约束含作动上下限 <span class=\"katex-inline\">u_{\\min}\\le u_k\\le u_{\\max}<\/span>、状态禁区、速率限制 <span class=\"katex-inline\">\\Delta u_k<\/span>、终端集约束。每步优化是带约束 QP（线性模型）或 NLP（非线性模型）；时域 <span class=\"katex-inline\">N<\/span> 越长预测越准，在线变量与求解时间越大。\n<\/li><li>\n模型来源对照。MPC 模型可来自线性辨识、神经网络、Volterra、ARX/ARMA/NARX/NARMAX；本书案例用 SINDYc 辨识强迫 Lorenz 方程再上 MPC，eDMD 模型也可接入（PDF 第 373–374 页）。模型类型决定预测精度与在线代价。\n<\/li><li>\n鲁棒性边界。LQR 标称最优不含量化稳定裕度；过稳定增益放大高频噪声，小时延下可能失稳。鲁棒控制与频域方法在第 8.8 节补充设计（PDF 第 316 页）。\n<\/li><li>\n数据驱动控制两条途径。机器学习可用于建系统模型，也可直接学控制器；Koopman 控制在 intrinsic coordinates 里套用线性控制方法，SINDYc/DMDc 提供可辨识模型（PDF 第 369–370 页）。\n<\/li><li>\n复杂度补充。Riccati 解 <span class=\"katex-inline\">O(n^3)<\/span>；MPC 每步 QP 变量 <span class=\"katex-inline\">N n_u<\/span>，约束数随时域增长；高维系统必须先 c08 降阶，否则在线求解赶不上控制周期。\n<\/ul>\n<h2>补充推演（二）：Riccati 解选取与 MPC 时域复核<\/h2>\n<ul><li>\nRiccati 二次方程另一解。标量情形 <span class=\"katex-inline\">2aP-P^2b^2/R+Q=0<\/span> 是关于 <span class=\"katex-inline\">P<\/span> 的二次方程，有两个根；闭环稳定要求取使 <span class=\"katex-inline\">A-BR^{-1}B^*P<\/span> 位于左半平面的正定根。情形二 <span class=\"katex-inline\">a=1,b=1,Q=R=1<\/span> 两根为 <span class=\"katex-inline\">1\\pm\\sqrt2<\/span>，负根 <span class=\"katex-inline\">1-\\sqrt2&lt;0<\/span> 不满足 <span class=\"katex-inline\">P\\succ0<\/span>，舍去。\n<\/li><li>\n权重复核。情形一 <span class=\"katex-inline\">Q=R=1<\/span> 得 <span class=\"katex-inline\">P=1,K=1<\/span>；<span class=\"katex-inline\">R=4<\/span> 时方程 <span class=\"katex-inline\">-P^2/4+1=0<\/span> 正定解 <span class=\"katex-inline\">P=2<\/span>，<span class=\"katex-inline\">K=P/R=0.5<\/span>，闭环 <span class=\"katex-inline\">-0.5<\/span>。<span class=\"katex-inline\">R<\/span> 越大控制越柔、调节越慢；<span class=\"katex-inline\">Q<\/span> 越大状态偏差惩罚越重，<span class=\"katex-inline\">P<\/span> 与增益上升。\n<\/li><li>\nLQG 分离结构。状态不可测时 Kalman 滤波估计 <span class=\"katex-inline\">\\hat x<\/span>，反馈 <span class=\"katex-inline\">u=-K_r\\hat x<\/span>；估计器按观测误差设计，控制器按状态反馈设计，分离原理下两者独立配平，估计误差与反馈误差串联进入闭环。\n<\/li><li>\nMPC 时域权衡。时域 <span class=\"katex-inline\">N<\/span> 长则预测覆盖慢模态，但在线变量 <span class=\"katex-inline\">N n_u<\/span> 与约束数同步增长；<span class=\"katex-inline\">N<\/span> 短则末端代价 <span class=\"katex-inline\">Q_f<\/span> 承担截断补偿。时域长度需在预测精度与求解时间之间折中。\n<\/li><li>\n无约束极限。线性无约束系统、<span class=\"katex-inline\">N\\to\\infty<\/span> 时 MPC 首步增益收敛到 LQR 稳态增益；有限时域 <span class=\"katex-inline\">Q_f<\/span> 取 Riccati 终端矩阵可逼近该极限。加入约束后两条路线分叉：MPC 显式钳位，LQR 不处理饱和。\n<\/ul>\n<h2>延伸推演：LQR 与 MPC 前提再拆一层<\/h2>\n<p>最优反馈与滚动优化各自依赖子条件，逐条拆开。<\/p>\n<ul><li>\n子前提一：全状态可测。<span class=\"katex-inline\">u=-K_rx<\/span> 需要 <span class=\"katex-inline\">x<\/span> 全部分量；只有输出 <span class=\"katex-inline\">y=Cx<\/span> 时先靠观测器估计 <span class=\"katex-inline\">\\hat x<\/span>，估计误差进入反馈。\n<\/li><li>\n子前提二：系统可稳。Riccati 方程存在正定稳定解，要求不稳定模态都可控；不可控方向的偏差无法被输入消除，<span class=\"katex-inline\">Q<\/span> 在该方向的权重只积累不可达代价。\n<\/li><li>\n子前提三：<span class=\"katex-inline\">R\\succ0<\/span>。控制项正定惩罚；<span class=\"katex-inline\">R<\/span> 半正时控制方向无代价，最优增益发散。<span class=\"katex-inline\">Q<\/span> 可半正定，但状态未被惩罚的方向闭环稳定性不由 LQR 保证。\n<\/li><li>\n子前提四：模型在预测时域内准确。MPC 按辨识模型预测；真实系统在时域内偏离模型，优化轨迹建立在偏差上，需要鲁棒余量或在线辨识更新。\n<\/li><li>\n子前提五：约束可解。MPC 每个滚动步的 QP/NLP 要有可行解；作动与状态约束过紧、模型误差过大时可行域为空。\n<\/li><li>\n去掉子前提的后果：缺观测器则反馈无输入，不可稳则残差不可消，<span class=\"katex-inline\">R<\/span> 半正定致增益发散，模型失真致预测跑偏，约束过紧致滚动无解。\n<\/ul>\n<h2>第二算例：二维系统 LQR 求解与权重扫描<\/h2>\n<p><strong>已知条件<\/strong>：连续系统<\/p>\n<div class=\"katex-block\">\\dot x=Ax+Bu,\\quad A=\\begin{bmatrix}0&1\\\\-2&-0.5\\end{bmatrix},\\quad B=\\begin{bmatrix}0\\\\1\\end{bmatrix}<\/div>\n<p><span class=\"katex-inline\">Q=I_2<\/span>，<span class=\"katex-inline\">R=1<\/span>。代数 Riccati 方程 <span class=\"katex-inline\">A^<em>P+PA-PBR^{-1}B^<\/em>P+Q=0<\/span>，用连续 ARE 求解器解正定 <span class=\"katex-inline\">P<\/span>，增益 <span class=\"katex-inline\">K_r=R^{-1}B^*P<\/span>。<\/p>\n<pre class=\"lang-python\"><code>import numpy as np\nfrom scipy import linalg\nA = np.array([[0,1],[-2,-0.5]])\nB = np.array([[0],[1.0]])\nQ = np.diag([1,1]); R = np.array([[1.0]])\nP = linalg.solve_continuous_are(A,B,Q,R)\nK = np.linalg.inv(R)@B.T@P\ncl = A-B@K<\/code><\/pre>\n<p><strong>第一步，基准权重求解<\/strong>。实算 Riccati 解<\/p>\n<div class=\"katex-block\">P=\\begin{bmatrix}1.9344&0.2361\\\\0.2361&0.8123\\end{bmatrix}<\/div>\n<p>反馈增益<\/p>\n<div class=\"katex-block\">K_r=[0.2361,\\ 0.8123]<\/div>\n<p>闭环矩阵 <span class=\"katex-inline\">A-BK_r<\/span> 特征值<\/p>\n<div class=\"katex-block\">-0.6562\\pm1.3437i<\/div>\n<p>实部为负，闭环稳定；振荡频率 <span class=\"katex-inline\">1.3437<\/span> rad/s。<\/p>\n<p><strong>第二步，权重扫描<\/strong>。固定 <span class=\"katex-inline\">Q=I<\/span>，改变 <span class=\"katex-inline\">R<\/span>：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><span class=\"katex-inline\">R<\/span><\/th><th><span class=\"katex-inline\">K_r<\/span><\/th><th>闭环特征值<\/th><\/tr><\/thead><tbody><tr><td>4.0<\/td><td><span class=\"katex-inline\">[0.0616,\\ 0.2894]<\/span><\/td><td><span class=\"katex-inline\">-0.3947\\pm1.3805i<\/span><\/td><\/tr><tr><td>1.0<\/td><td><span class=\"katex-inline\">[0.2361,\\ 0.8123]<\/span><\/td><td><span class=\"katex-inline\">-0.6562\\pm1.3437i<\/span><\/td><\/tr><tr><td>0.25<\/td><td><span class=\"katex-inline\">[0.8284,\\ 1.9304]<\/span><\/td><td><span class=\"katex-inline\">-1.2152\\pm1.1626i<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>第三步，权重方向解读<\/strong>。<span class=\"katex-inline\">R<\/span> 从 1 升到 4，增益分量缩小，闭环实部从 <span class=\"katex-inline\">-0.6562<\/span> 抬到 <span class=\"katex-inline\">-0.3947<\/span>，调节变慢、控制变柔；<span class=\"katex-inline\">R<\/span> 降到 0.25，增益放大，闭环实部压到 <span class=\"katex-inline\">-1.2152<\/span>，调节更快但控制量更激进。振荡频率随权重在 <span class=\"katex-inline\">1.16<\/span>–<span class=\"katex-inline\">1.38<\/span> rad/s 间移动。<\/p>\n<ul><li>\nRiccati 求解口径。连续 ARE 是关于 <span class=\"katex-inline\">P<\/span> 的二次矩阵方程，求解器返回正定稳定解；<span class=\"katex-inline\">2\\times2<\/span> 系统 <span class=\"katex-inline\">P<\/span> 有三个独立元素，闭环特征值由 <span class=\"katex-inline\">A-BK<\/span> 决定。对比标量情形，多维 <span class=\"katex-inline\">P<\/span> 的非对角元耦合两个状态，增益 <span class=\"katex-inline\">K<\/span> 同时反馈两个状态分量。\n<\/li><li>\nMPC 变量与约束口径。时域 <span class=\"katex-inline\">N<\/span> 步的优化变量共 <span class=\"katex-inline\">N\\cdot n_u<\/span> 个；本算例 <span class=\"katex-inline\">n_u=1<\/span>，每步决策一个输入。约束含作动上下限、状态禁区与速率限制；线性模型下每步是 QP，非线性模型下是 NLP。时域越长预测越准，在线求解时间随变量数增长，高维系统必须先降到 c08 的 <span class=\"katex-inline\">r<\/span> 维。\n<\/li><li>\n权重与裕度方向。<span class=\"katex-inline\">R<\/span> 增大增益缩小、闭环变慢，对应控制代价优先；<span class=\"katex-inline\">Q<\/span> 增大状态偏差权重上升、增益放大。LQR 标称最优不含量化稳定裕度，过稳定增益放大高频噪声，鲁棒性需另外设计。\n<\/ul>\n<h2>对抗性追问：作动饱和时名义 LQR 闭环还稳定吗<\/h2>\n<p>LQR 解出的 <span class=\"katex-inline\">u<\/span> 越过上界 <span class=\"katex-inline\">u_{\\max}<\/span> 后被执行器钳位，实际输入不再等于 <span class=\"katex-inline\">-K_rx<\/span>，闭环不再是名义 LQR 闭环；大增益下饱和环节可能引入相位滞后，小时延配合饱和可使闭环失稳。判据：先在名义闭环上检查 LQR 的稳定裕度，再把约束仿真进闭环；若状态偏离大时输入长期处于饱和段，名义增益不能保证稳定，应交 MPC 把 <span class=\"katex-inline\">|u|\\le u_{\\max}<\/span> 显式写进每步优化。模型偏差大是同类问题：预测时域内真实对象偏离辨识模型，滚动优化沿偏差外推，需要留鲁棒余量或在线更新模型。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出 LQR 代价函数，<span class=\"katex-inline\">Q<\/span> 与 <span class=\"katex-inline\">R<\/span> 各惩罚什么？<span class=\"katex-inline\">R<\/span> 过大反馈会怎样？\n<\/li><li>\n标量 Riccati 方程在 <span class=\"katex-inline\">a=0,b=1,Q=R=1<\/span> 时 <span class=\"katex-inline\">P<\/span> 是多少？闭环特征值呢？\n<\/li><li>\n为什么 LQR 不能显式处理作动饱和？MPC 在哪一步处理约束？\n<\/li><li>\nMPC 与 LQR 在时域、反馈形式、约束处理上有何差别？\n<\/li><li>\n高维系统为什么必须先降阶再上 LQR/MPC？成本随维数如何增长？\n<\/ol><\/div><\/details>", "c10": "<div class=\"source-badge\">📖 出处：Data-Driven Science and Engineering: Machine Learning, Dynamical Systems, and Control · p.133<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">POD-Galerkin 降阶模型（ROM）<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">压缩感知：incoherence、RIP 与 L1 恢复<\/a><\/span><\/div><h1>c10 传感器/执行器布置与 Gappy POD / DEIM<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch04（3.8 Sparse Sensor Placement，PDF 第 133–135 页；12.1 Gappy POD、12.5 DEIM，PDF 第 427–438 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>ROM 把状态压到 <span class=\"katex-inline\">r<\/span> 维后，物理上不需要测全部 <span class=\"katex-inline\">n<\/span> 个点；反过来，非线性项投影也不必每次回 <span class=\"katex-inline\">n<\/span> 维求值。需要回答：<span class=\"katex-inline\">n<\/span> 个候选位置里挑 <span class=\"katex-inline\">p<\/span> 个传感器（或执行器、插值节点），按什么目标挑，才能让少量测量保持低维系数可辨识、条件数良好；怎么用这些少量点重构全场、近似非线性项。<\/p>\n<p>不做布置优化，随机选点可能在模态变化区域留出大空档，少量测量的伪逆病态，噪声被条件数放大；非线性项每次回原维求值，降阶模型省不下计算。组合枚举 <span class=\"katex-inline\">\\binom{n}{p}<\/span> 在 <span class=\"katex-inline\">n<\/span> 大时不可行，需要贪心近似原则（PDF 第 133–134 页）。<\/p>\n<h2>定义逐句拆解<\/h2>\n<p><strong>稀疏测量与 Gappy POD<\/strong>。测量矩阵 <span class=\"katex-inline\">P\\in\\mathbb{R}^{r\\times n}<\/span> 挑 <span class=\"katex-inline\">r<\/span> 个位置，<span class=\"katex-inline\">\\tilde u=Pu<\/span>；低维系数 <span class=\"katex-inline\">a<\/span> 由少量测量重构，<span class=\"katex-inline\">u\\approx\\Phi a<\/span>（PDF 第 427 页公式 12.1）。Gappy POD 用稀疏采样近似内积，从缺测快照重构模态与系数（PDF 第 427 页）。<\/p>\n<p><strong>布置优化目标<\/strong>。测量后低维方程 <span class=\"katex-inline\">y=Ca=\\Theta a<\/span>，<span class=\"katex-inline\">\\Theta=C\\Phi_r<\/span>；伪逆涉及 <span class=\"katex-inline\">M=\\Theta^T\\Theta<\/span>。可选目标：最小化条件数 <span class=\"katex-inline\">\\kappa(M)<\/span>、最大化最小奇异值、最大化迹或行列式（PDF 第 134、436 页）。<\/p>\n<p><strong>条件数<\/strong>。矩阵条件数是最大/最小奇异值之比；条件数越大，伪逆对输入噪声越敏感，信噪比经映射后按条件数下降（PDF 第 134 页附近）。<\/p>\n<p><strong>pivoted QR 贪心<\/strong>。对基矩阵做列主元 QR：<span class=\"katex-inline\">\\Phi_r\\Phi_r^TC^T=QR<\/span>，主元每步选 2-范数最大的列、减去其余列在该列上的正交投影，近似最小化矩阵体积（行列式绝对值），给出 <span class=\"katex-inline\">r<\/span> 个点传感器（PDF 第 135 页公式 3.22–3.23）。<\/p>\n<p><strong>DEIM（discrete empirical interpolation method）<\/strong>：对非线性项快照先 POD 分解，再用贪心插值指标选少量节点，指定插值式投影，在近似最优 <span class=\"katex-inline\">\\ell_2<\/span> 子空间里逼近非线性项；投影与插值结合，把非线性求值留在低维（PDF 第 427 页）。<\/p>\n<p><strong>正例<\/strong>：已知人脸库时按 <span class=\"katex-inline\">\\Psi_r=\\tilde U<\/span> 优化传感器，相比随机测量大幅减少所需点数；pivoted QR 给出近优点位（PDF 第 133、135 页）。 <strong>反例<\/strong>：20% 随机采样下，点位不同条件数可差两个数量级；最差配置在域中央留大空档，重构误差与条件数同时飙升（PDF 第 436 页图 12.7）。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>前提<\/strong>：POD 基 <span class=\"katex-inline\">\\Phi_r\\in\\mathbb{R}^{n\\times r}<\/span> 已定；从 <span class=\"katex-inline\">n<\/span> 个位置挑 <span class=\"katex-inline\">p<\/span> 个测量。<\/p>\n<ol><li>\n<strong>低维测量方程<\/strong>。<span class=\"katex-inline\">y=Pu=P\\Phi_r a=\\Theta a<\/span>，<span class=\"katex-inline\">\\Theta\\in\\mathbb{R}^{p\\times r}<\/span>。<span class=\"katex-inline\">p=r<\/span> 时要求 <span class=\"katex-inline\">\\Theta<\/span> 方阵可逆；<span class=\"katex-inline\">p&gt;r<\/span> 超定，改善 <span class=\"katex-inline\">M=\\Theta^T\\Theta<\/span> 条件数（PDF 第 134 页）。\n<\/li><li>\n<strong>优化目标<\/strong>。最小化 <span class=\"katex-inline\">\\kappa(\\Theta)<\/span> 等价于最大化最小奇异值；迹、行列式（矩阵体积）也是备选准则。这些组合优化都是 NP-hard，暴力枚举不可行（PDF 第 134 页）。\n<\/li><li>\n<strong>贪心近似<\/strong>。pivoted QR 每步选当前 residual 范数最大的列进入主元集，再从其余列减去该列投影；列主元近似最大化子矩阵体积，从而控制条件数。\n<\/li><li>\n<strong>重构<\/strong>。选中点位构成 <span class=\"katex-inline\">P<\/span>，系数 <span class=\"katex-inline\">a=\\Theta^\\dagger y<\/span>，全场 <span class=\"katex-inline\">u=\\Phi_r a<\/span>；测量数 <span class=\"katex-inline\">p=r<\/span> 唯一解，<span class=\"katex-inline\">p&gt;r<\/span> 最小二乘更稳。\n<\/li><li>\n<strong>非线性项插值<\/strong>。非线性快照 <span class=\"katex-inline\">N(u)<\/span> POD 分解得基 <span class=\"katex-inline\">\\Psi_N<\/span>；DEIM 选 <span class=\"katex-inline\">p_N<\/span> 个插值指标，只在这些节点上算非线性值，再插值重构低维非线性项；避免每次回 <span class=\"katex-inline\">n<\/span> 维求值。\n<\/li><li>\n<strong>与超降阶的关系<\/strong>。Gappy POD 侧重从稀疏测量重构状态/内积，DEIM 侧重非线性项近似；两者都服务于 c08 ROM 的在线效率（PDF 第 427 页）。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ol><li>\n<strong>基已知且覆盖工况<\/strong>：布置按特定库 <span class=\"katex-inline\">\\Phi_r<\/span> 优化；系统工况变化超出训练快照，基与点位同时失效。\n<\/li><li>\n<strong><span class=\"katex-inline\">p<\/span> 与 <span class=\"katex-inline\">r<\/span> 关系<\/strong>：<span class=\"katex-inline\">p&lt;r<\/span> 欠定，系数不可辨识；<span class=\"katex-inline\">p=r<\/span> 刚够但条件数敏感；<span class=\"katex-inline\">p=r+10<\/span> 通常显著改善条件数（PDF 第 134 页附近）。\n<\/li><li>\n<strong>贪心近优而非全局最优<\/strong>：QR 主元近似矩阵体积目标，不保证最小条件数；凸优化/半定规划可更优但要反复 <span class=\"katex-inline\">n\\times n<\/span> 分解，代价高（PDF 第 134 页）。\n<\/li><li>\n<strong>执行器布置对称问题<\/strong>：可控性 Gramians 与可观性 Gramians 分别指导执行器与传感器位置；第 9 章平衡变换把两者统一到同一状态排序（PDF 第 133 页）。\n<\/li><li>\n<strong>失败案例<\/strong>：随机点位在模态节点附近扎堆，<span class=\"katex-inline\">\\Theta<\/span> 列近似相关，条件数接近 <span class=\"katex-inline\">10^{16}<\/span> 数值奇异；重构被噪声主导（PDF 第 134 页附近）。\n<\/li><li>\n<strong>失败案例<\/strong>：DEIM 插值节点落在非线性项变化平缓处，插值近似误差大；节点选择要基于非线性项快照，不能直接复用状态 POD 节点。\n<\/ol>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>传感器布置 vs 执行器布置<\/strong>：传感器由可观性（<span class=\"katex-inline\">W_o<\/span>）指导，执行器由可控性（<span class=\"katex-inline\">W_c<\/span>）指导；目标分别是可辨识状态与可达状态，点位准则对称但不相同。\n<\/li><li>\n<strong>Gappy POD vs DEIM<\/strong>：Gappy POD 用稀疏测量重构状态与内积；DEIM 专门近似非线性项，插值指标来自非线性项 POD 基。\n<\/li><li>\n<strong>随机采样 vs 原则化选点<\/strong>：随机测量通用但条件数方差大；按库贪心选点在特定 ROM 上近优，跨库泛化性弱。\n<\/li><li>\n<strong>测量点 vs 延迟坐标<\/strong>：c10 在空间上挑位置，c07 在时间上取历史窗；两者从不同维度补全测量信息。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：c01 SVD/POD 基；c03 测量矩阵与可辨识条件；c08 ROM 低维方程。\n<\/li><li>\n后继：本章是 ROM 在线效率与闭环状态观测的落地环节；第 12 章参数化 ROM 插值依赖这套稀疏采样；c09 控制器需要可观测的低维状态作为反馈输入。\n<\/li><li>\n串联：布置优化把&quot;少量测量恢复低维系数&quot;从压缩感知的通用随机测量，推进到面向特定数据基的定制采样。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（传感器/执行器布置与 Gappy POD / DEIM）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：测量方程、条件数准则与选点数值算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把&quot;少量传感器可辨识低维系数&quot;推到底，逐级倒查：<\/p>\n<ol><li>\n系数可辨识先要求 <span class=\"katex-inline\">\\Theta=P\\Phi_r<\/span> 列满秩，倒查到测量数 <span class=\"katex-inline\">p\\ge r<\/span> 与基 <span class=\"katex-inline\">\\Phi_r<\/span> 已知。\n<\/li><li>\n辨识稳健性由条件数控制，倒查到伪逆对噪声的放大倍数；条件数大则测量噪声经重构放大。\n<\/li><li>\n最优布置是组合优化，倒查到 NP-hard 性质；实践用贪心 QR 主元近似矩阵体积目标。\n<\/li><li>\n重构全场倒查到 <span class=\"katex-inline\">u=\\Phi_r a<\/span> 的低秩展开；点位选错则系数偏差直接传到全场。\n<\/li><li>\n非线性项近似倒查到 DEIM 在非线性项快照上另选插值节点，与状态传感器点位不是同一组。\n<\/ol>\n<p>链条断掉：<span class=\"katex-inline\">p&lt;r<\/span> 欠定，系数有无穷多解；基未覆盖工况，按旧基选的点位在新工况下失效；贪心目标与真实误差准则不一致，近优点位可能局部次优。<\/p>\n<h2>正向推导<\/h2>\n<ul><li>\n第一步，低维展开。<span class=\"katex-inline\">u\\approx\\Phi_r a<\/span>，<span class=\"katex-inline\">\\Phi_r\\in\\mathbb{R}^{n\\times r}<\/span> 为 POD 基，<span class=\"katex-inline\">a\\in\\mathbb{R}^r<\/span>。\n<\/li><li>\n第二步，稀疏测量。<span class=\"katex-inline\">P\\in\\mathbb{R}^{p\\times n}<\/span> 选 <span class=\"katex-inline\">p<\/span> 个位置，<span class=\"katex-inline\">y=Pu=P\\Phi_ra=\\Theta a<\/span>，<span class=\"katex-inline\">\\Theta=P\\Phi_r<\/span>。\n<\/li><li>\n第三步，系数重构。<span class=\"katex-inline\">p=r<\/span> 时 <span class=\"katex-inline\">a=\\Theta^{-1}y<\/span>；<span class=\"katex-inline\">p&gt;r<\/span> 时 <span class=\"katex-inline\">a=\\Theta^\\dagger y<\/span>，最小二乘解降低噪声敏感度。\n<\/li><li>\n第四步，条件数准则。<span class=\"katex-inline\">\\kappa(\\Theta)=\\sigma_{\\max}/\\sigma_{\\min}<\/span>；测量噪声经伪逆放大的量级与 <span class=\"katex-inline\">\\kappa<\/span> 同阶。优化目标可取最小化 <span class=\"katex-inline\">\\kappa<\/span>、最大化 <span class=\"katex-inline\">\\sigma_{\\min}<\/span>、最大化迹或行列式（矩阵体积）。\n<\/li><li>\n第五步，组合难度。从 <span class=\"katex-inline\">n<\/span> 位置选 <span class=\"katex-inline\">p<\/span> 个有 <span class=\"katex-inline\">\\binom{n}{p}<\/span> 种配置；上述目标均为 NP-hard。凸优化/半定规划可求解但需反复 <span class=\"katex-inline\">n\\times n<\/span> 分解，大规模不实用（PDF 第 134 页）。\n<\/li><li>\n第六步，pivoted QR 贪心。对 <span class=\"katex-inline\">\\Phi_r\\Phi_r^T<\/span>（或 <span class=\"katex-inline\">\\Phi_r<\/span>）做列主元 QR：<span class=\"katex-inline\">\\Phi_r\\Phi_r^TC^T=QR<\/span>。每步选残差 2-范数最大的列为主元，再从其余列减去在主元列上的正交投影；主元序列近似最大化子矩阵行列式绝对值，控制体积与条件数（PDF 第 135 页公式 3.22–3.23）。\n<\/li><li>\n第七步，DEIM 插值。非线性快照 <span class=\"katex-inline\">N<\/span> 做 POD 得基 <span class=\"katex-inline\">\\Psi_N<\/span>；贪心选 <span class=\"katex-inline\">p_N<\/span> 个插值指标，非线性值只在节点上计算，经插值重构低维非线性项；投影与插值结合，近似最优 <span class=\"katex-inline\">\\ell_2<\/span> 子空间（PDF 第 427 页）。\n<\/li><li>\n复杂度口径：枚举 <span class=\"katex-inline\">O(\\binom{n}{p})<\/span>；pivoted QR 对 <span class=\"katex-inline\">n\\times n<\/span> 矩阵 <span class=\"katex-inline\">O(n^3)<\/span>，主元选择在 <span class=\"katex-inline\">r<\/span> 步内完成；在线重构只算 <span class=\"katex-inline\">p<\/span> 个测量与 <span class=\"katex-inline\">r<\/span> 维系数。\n<\/ul>\n<h2>数值算例：两模态基的传感器点位对照<\/h2>\n<p><strong>已知条件<\/strong>：<span class=\"katex-inline\">n=10<\/span> 个候选位置，<span class=\"katex-inline\">r=2<\/span> 个 POD 模态；<span class=\"katex-inline\">\\Phi<\/span> 为 <span class=\"katex-inline\">10\\times2<\/span> 正交基（随机生成后 QR 正交化）。挑 <span class=\"katex-inline\">p=2<\/span> 个传感器，比较随机选点、QR 主元与全局最优/最差配对的条件数。<\/p>\n<p><strong>第一步，测量子矩阵<\/strong>。选点位集合 <span class=\"katex-inline\">S<\/span>，<span class=\"katex-inline\">\\Theta_S=\\Phi_{S,:}<\/span>，条件数 <span class=\"katex-inline\">\\kappa(\\Theta_S)=\\sigma_{\\max}/\\sigma_{\\min}<\/span>。<\/p>\n<p><strong>第二步，随机采样对照<\/strong>。200 次随机两位置采样，条件数中位数 <span class=\"katex-inline\">4.846<\/span>，最小 <span class=\"katex-inline\">1.344<\/span>，最大 <span class=\"katex-inline\">69.103<\/span>。同样两个传感器，点位不同使条件数跨约两个数量级，与本书 20% 采样实验的结论一致（PDF 第 436 页）。<\/p>\n<p><strong>第三步，QR 主元选点<\/strong>。对 <span class=\"katex-inline\">\\Phi\\Phi^T<\/span> 做列主元 QR，主元列 <span class=\"katex-inline\">4,3<\/span>；该配对条件数 <span class=\"katex-inline\">1.344<\/span>。 <strong>第四步，全局枚举核对<\/strong>。遍历全部 <span class=\"katex-inline\">\\binom{10}{2}=45<\/span> 个配对：最优配对 <span class=\"katex-inline\">(3,4)<\/span>，条件数 <span class=\"katex-inline\">1.344<\/span>；最差配对 <span class=\"katex-inline\">(0,1)<\/span>，条件数 <span class=\"katex-inline\">69.103<\/span>。QR 主元选出的 <span class=\"katex-inline\">(3,4)<\/span> 即全局最优配对；本算例规模小，贪心与枚举重合，大规模下 QR 给出近优解。<\/p>\n<p><strong>第五步，误差传导对照<\/strong>。测量噪声 <span class=\"katex-inline\">\\epsilon<\/span> 经伪逆放大后系数误差量级 <span class=\"katex-inline\">\\kappa\\cdot\\|\\epsilon\\|<\/span>：最优配对放大 1.34 倍，最差配对放大 69.1 倍；同样传感器数量，差点位把测量噪声放大五十倍以上。<\/p>\n<p><strong>第六步，超采样对照<\/strong>。<span class=\"katex-inline\">p=r=2<\/span> 刚够可逆，条件数敏感；<span class=\"katex-inline\">p<\/span> 取 <span class=\"katex-inline\">r+10<\/span> 时超定最小二乘平均压低条件数，本书指出 Oversampling 通常显著改善良态（PDF 第 134 页附近）。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：点位扎堆模态节点。两列在基空间内近似线性相关，<span class=\"katex-inline\">\\sigma_{\\min}\\to0<\/span>，条件数接近机器精度倒数；重构系数被噪声淹没。 反例二：基随参数变化。训练参数下选出的点位在新 <span class=\"katex-inline\">\\beta<\/span> 工况落入新模态空档，条件数重新恶化；需要随参数更新点位或多参数库联合选点。 反例三：DEIM 节点复用状态 POD 节点。非线性项空间结构与状态不同，同组节点在非线性平缓区无信息；插值指标应从非线性项快照基选出。 反例四：把条件数当唯一准则。条件数良态不保证重构误差小；还需对照方差、迹等准则与留出重构误差联合判断。<\/p>\n<h2>与相邻概念的推导衔接<\/h2>\n<p>c03 给出测量可辨识的一般条件（incoherence、RIP）；本章把随机测量换成面向特定 POD 库的贪心定制。c08 ROM 是被测量与被投影对象；c09 控制器依赖本章提供的可观测低维状态；c07 时间延迟嵌入与本章空间选点互补。<\/p>\n<h2>推导中容易跳过的环节<\/h2>\n<ul><li>\n<span class=\"katex-inline\">\\Theta=P\\Phi_r<\/span> 的维数：<span class=\"katex-inline\">P<\/span> 是 <span class=\"katex-inline\">p\\times n<\/span>，<span class=\"katex-inline\">\\Phi_r<\/span> 是 <span class=\"katex-inline\">n\\times r<\/span>，乘积 <span class=\"katex-inline\">p\\times r<\/span>；维数对不上说明测量矩阵定义写错。\n<\/li><li>\n条件数是最大/最小奇异值之比，不是行列式；行列式体积只是 QR 贪心的近似目标。\n<\/li><li>\nDEIM 选的是非线性项节点，不是状态传感器；两组点位服务于不同重构任务。\n<\/ul>\n<h2>补充推演：Gappy 重构、执行器布置与 DEIM 流程<\/h2>\n<ul><li>\nGappy 重构方程。已知低维展开 <span class=\"katex-inline\">u=\\Phi_r a<\/span>，稀疏测量 <span class=\"katex-inline\">y=Pu<\/span>；代入得 <span class=\"katex-inline\">y=P\\Phi_ra=\\Theta a<\/span>。<span class=\"katex-inline\">p=r<\/span> 时 <span class=\"katex-inline\">a=\\Theta^{-1}y<\/span>，<span class=\"katex-inline\">p&gt;r<\/span> 时 <span class=\"katex-inline\">a=\\Theta^\\dagger y<\/span>，重构 <span class=\"katex-inline\">\\hat u=\\Phi_ra<\/span>。缺测位置不靠直接测量，靠基系数插值补回。\n<\/li><li>\n内积近似。POD 模态内积原本要在全 <span class=\"katex-inline\">n<\/span> 维积分；gappy POD 用少量测量点加权近似内积，支撑缺测快照上的模态更新（PDF 第 427 页，Everson–Sirovich 原始框架）。\n<\/li><li>\n执行器布置对称问题。传感器由可观性 Gramian <span class=\"katex-inline\">W_o<\/span> 指导：<span class=\"katex-inline\">W_o<\/span> 小的方向测不到；执行器由可控性 Gramian <span class=\"katex-inline\">W_c<\/span> 指导：<span class=\"katex-inline\">W_c<\/span> 小的方向推不动。两类布置目标对称，分别对应第 8.3 节两个 Gramian（PDF 第 315、133 页）。\n<\/li><li>\n超采样收益。<span class=\"katex-inline\">p=r<\/span> 刚可逆，<span class=\"katex-inline\">\\Theta<\/span> 条件数敏感；<span class=\"katex-inline\">p=r+10<\/span> 量级超采样后最小二乘平均压低条件数，本书指出 Oversampling 通常显著改善良态（PDF 第 134 页附近）。\n<\/li><li>\nDEIM 流程。第一步对非线性快照 <span class=\"katex-inline\">N<\/span> 做 POD 得基 <span class=\"katex-inline\">\\Psi_N<\/span>；第二步贪心选插值指标：每步选当前残差最大位置为主元，更新投影；第三步只在主元节点算非线性值，经插值重构低维非线性项。指标来自非线性项基，不复用状态传感器（PDF 第 427 页）。\n<\/li><li>\n误差与收敛。Gappy POD 重构误差随测量数与基模态数下降；条件数是误差放大的中间量，条件数小不直接等于误差小，仍需留出快照核对重构精度（PDF 第 435–436 页）。\n<\/li><li>\n复杂度补充。枚举 <span class=\"katex-inline\">\\binom{n}{p}<\/span> 不可行；pivoted QR 主元选择 <span class=\"katex-inline\">O(n^3)<\/span> 量级，<span class=\"katex-inline\">r<\/span> 步完成；在线只算 <span class=\"katex-inline\">p<\/span> 个测量与 <span class=\"katex-inline\">r<\/span> 维系数。DEIM 在线非线性求值从 <span class=\"katex-inline\">n<\/span> 维降到 <span class=\"katex-inline\">p_N<\/span> 个节点。\n<\/ul>\n<h2>补充推演（二）：误差传导与枚举规模复核<\/h2>\n<ul><li>\n噪声传导链条。测量 <span class=\"katex-inline\">y=\\Theta a+\\epsilon<\/span>，伪逆重构 <span class=\"katex-inline\">\\hat a=\\Theta^\\dagger y=a+\\Theta^\\dagger\\epsilon<\/span>；系数误差上界 <span class=\"katex-inline\">\\|\\hat a-a\\|_2\\le\\|\\Theta^\\dagger\\|_2\\|\\epsilon\\|_2=\\|\\epsilon\\|_2/\\sigma_{\\min}(\\Theta)<\/span>，条件数 <span class=\"katex-inline\">\\kappa=\\sigma_{\\max}/\\sigma_{\\min}<\/span> 把误差放大倍数与基向量尺度一并计入。\n<\/li><li>\n枚举规模复核。<span class=\"katex-inline\">n=10,p=2<\/span> 时配对数 <span class=\"katex-inline\">\\binom{10}{2}=45<\/span>；本算例遍历全部配对，最优 <span class=\"katex-inline\">(3,4)<\/span> 条件数 <span class=\"katex-inline\">1.344<\/span>，最差 <span class=\"katex-inline\">(0,1)<\/span> 条件数 <span class=\"katex-inline\">69.103<\/span>，相差约 <span class=\"katex-inline\">51<\/span> 倍。点位选择对重构精度的影响在小规模枚举上直接可见。\n<\/li><li>\nGramian 对称分工。传感器布置看可观性 Gramian <span class=\"katex-inline\">W_o<\/span>，执行器布置看可控性 Gramian <span class=\"katex-inline\">W_c<\/span>；<span class=\"katex-inline\">W_o<\/span> 小的方向测不到，<span class=\"katex-inline\">W_c<\/span> 小的方向推不动。两类优化目标对称，选点准则各自对应。\n<\/li><li>\n超采样边界。<span class=\"katex-inline\">p=r<\/span> 刚可逆，<span class=\"katex-inline\">\\sigma_{\\min}<\/span> 对点位最敏感；<span class=\"katex-inline\">p&gt;r<\/span> 后最小二乘在多测量上平均噪声，条件数平均压低；超采样收益随 <span class=\"katex-inline\">p<\/span> 递减，需对照传感器成本取舍。\n<\/ul>\n<h2>延伸推演：传感器布置前提再拆一层<\/h2>\n<p>少量传感器辨识低维系数，依赖四条子条件。<\/p>\n<ul><li>\n子前提一：低维基 <span class=\"katex-inline\">\\Phi_r<\/span> 已知。测量方程 <span class=\"katex-inline\">y=P\\Phi_ra=\\Theta a<\/span> 的可辨识性建立在基张成子空间上；基未知时测量矩阵与系数同时待求，问题维度抬高。\n<\/li><li>\n子前提二：测量数 <span class=\"katex-inline\">p\\ge r<\/span>。<span class=\"katex-inline\">p&lt;r<\/span> 时 <span class=\"katex-inline\">\\Theta<\/span> 列数多于行数，系数有无穷多解；<span class=\"katex-inline\">p=r<\/span> 刚够可逆，条件数对点位最敏感，<span class=\"katex-inline\">p&gt;r<\/span> 超定最小二乘平均压低条件数。\n<\/li><li>\n子前提三：基覆盖目标工况。训练参数下选出的点位在新 <span class=\"katex-inline\">\\beta<\/span> 工况落入新模态空档；基随参数变化时，旧点位的条件数重新恶化。\n<\/li><li>\n子前提四：优化准则与真实误差一致。条件数良态不直接等于重构误差小；还需对照方差、迹等准则与留出重构误差，条件数只是误差放大的中间量。\n<\/li><li>\n去掉子前提的后果：基未知致问题不可解，<span class=\"katex-inline\">p&lt;r<\/span> 致欠定，工况漂移致点位失效，准则错配致低条件数高误差。\n<\/ul>\n<h2>第二算例：n=12、r=3 的点位枚举、随机与 QR 对照<\/h2>\n<p><strong>已知条件<\/strong>：<span class=\"katex-inline\">n=12<\/span> 个候选位置，<span class=\"katex-inline\">r=3<\/span> 个 POD 模态；<span class=\"katex-inline\">\\Phi<\/span> 为 <span class=\"katex-inline\">12\\times3<\/span> 正交基（随机生成后 QR 正交化）。挑 <span class=\"katex-inline\">p=3<\/span> 个传感器，测量子矩阵 <span class=\"katex-inline\">\\Theta_S=\\Phi_{S,:}<\/span>，条件数 <span class=\"katex-inline\">\\kappa=\\sigma_{\\max}/\\sigma_{\\min}<\/span>。<\/p>\n<pre class=\"lang-python\"><code>import numpy as np, itertools\nrng = np.random.default_rng(20261128)\nn, r = 12, 3\nPhi,_ = np.linalg.qr(rng.standard_normal((n,r)))\ndef cond(S): return np.linalg.cond(Phi[list(S),:])<\/code><\/pre>\n<p><strong>第一步，全局枚举<\/strong>。遍历 <span class=\"katex-inline\">\\binom{12}{3}=220<\/span> 个配对：<\/p>\n<ul><li>\n最优配对 <span class=\"katex-inline\">(1,3,5)<\/span>，<span class=\"katex-inline\">\\kappa=1.7084<\/span>；\n<\/li><li>\n最差配对 <span class=\"katex-inline\">(2,5,11)<\/span>，<span class=\"katex-inline\">\\kappa=427.0586<\/span>。\n<\/ul>\n<p>同一传感器数量，条件数跨约 <span class=\"katex-inline\">427.06/1.71=250<\/span> 倍。<\/p>\n<p><strong>第二步，随机采样对照<\/strong>。300 次随机三位置采样，条件数中位数 <span class=\"katex-inline\">5.0511<\/span>，最小 <span class=\"katex-inline\">1.7084<\/span>，最大 <span class=\"katex-inline\">427.0586<\/span>。随机点位多数落在良态与病态之间，尾部配对条件数接近机器精度倒数。<\/p>\n<p><strong>第三步，QR 主元选点<\/strong>。对 <span class=\"katex-inline\">\\Phi\\Phi^T<\/span> 做列主元 QR，主元序列前三位 <span class=\"katex-inline\">[11,2,0]<\/span>，该配对条件数 <span class=\"katex-inline\">1.7878<\/span>，接近全局最优 <span class=\"katex-inline\">1.7084<\/span>；本规模下贪心与枚举接近，大规模时 QR 给出近优解。<\/p>\n<p><strong>第四步，误差传导对照<\/strong>。测量噪声 <span class=\"katex-inline\">\\epsilon<\/span> 经伪逆放大，系数误差上界 <span class=\"katex-inline\">\\|\\hat a-a\\|_2\\le\\|\\epsilon\\|_2/\\sigma_{\\min}(\\Theta)<\/span>。最优配对放大倍数 <span class=\"katex-inline\">1.71<\/span>，最差配对放大 <span class=\"katex-inline\">427.06<\/span>；同样三个传感器，差点位把测量噪声放大约 250 倍。<\/p>\n<ul><li>\n枚举规模与在线成本。<span class=\"katex-inline\">n=12,r=3<\/span> 配对数 220，小规模可全枚举；<span class=\"katex-inline\">n<\/span> 增大后 <span class=\"katex-inline\">\\binom{n}{r}<\/span> 组合爆炸，枚举不可行，pivoted QR 主元选择 <span class=\"katex-inline\">O(n^3)<\/span> 量级、<span class=\"katex-inline\">r<\/span> 步完成。在线重构只算 <span class=\"katex-inline\">p<\/span> 个测量与 <span class=\"katex-inline\">r<\/span> 维系数，成本与传感器数量成正比。\n<\/li><li>\n两类布置对称。传感器由可观性 Gramian <span class=\"katex-inline\">W_o<\/span> 指导，<span class=\"katex-inline\">W_o<\/span> 小的方向测不到；执行器由可控性 Gramian <span class=\"katex-inline\">W_c<\/span> 指导，<span class=\"katex-inline\">W_c<\/span> 小的方向推不动。本算例只做传感器侧选点，执行器布置沿同一条件数准则换 <span class=\"katex-inline\">W_c<\/span> 指导。\n<\/ul>\n<h2>对抗性追问：基随参数漂移，旧点位为什么会失效<\/h2>\n<p>训练工况 <span class=\"katex-inline\">\\beta_0<\/span> 下 POD 基 <span class=\"katex-inline\">\\Phi_r(\\beta_0)<\/span> 张成子空间；参数移到 <span class=\"katex-inline\">\\beta_1<\/span>，新快照含 <span class=\"katex-inline\">\\Phi_r(\\beta_0)<\/span> 之外的方向。旧点位在新基空间内的投影列可能近似相关，<span class=\"katex-inline\">\\sigma_{\\min}<\/span> 趋零，条件数重新恶化。判据：在新工况快照上复算 <span class=\"katex-inline\">\\Theta=P\\Phi_r(\\beta_1)<\/span> 的条件数与留出重构误差；若条件数比训练时抬高一个量级以上，说明点位失效。应对方式是多参数快照联合建基后统一选点，或随参数更新点位；DEIM 节点遵循同一规则，必须从非线性项快照基选出，不复用状态传感器位置。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出稀疏测量方程 <span class=\"katex-inline\">y=\\Theta a<\/span> 中 <span class=\"katex-inline\">\\Theta<\/span> 与 <span class=\"katex-inline\">P,\\Phi_r<\/span> 的关系；<span class=\"katex-inline\">p&lt;r<\/span> 为什么不可辨识？\n<\/li><li>\n条件数 <span class=\"katex-inline\">\\kappa(\\Theta)<\/span> 如何放大测量噪声？最小化条件数是哪一类优化问题？\n<\/li><li>\npivoted QR 每一步选列的准则是什么？它近似优化哪个目标？\n<\/li><li>\nDEIM 的插值指标来自状态 POD 基还是非线性项快照基？为什么？\n<\/li><li>\n本算例中最优与最差配对条件数差多少倍？这个差距对重构误差意味着什么？\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：低秩结构：SVD 与 PCA<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：Singular Value Decomposition (SVD) — 低秩近似、PCA 与截断<\/a><br>检查点：能写出 SVD 分解式，说明截断 SVD 为何是 Frobenius 范数下的最优低秩逼近，并用累积能量决定截断阶数<\/li><li class='path-step' id='path-02'><strong>步骤 02：稀疏性：压缩感知与稀疏回归<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 3 章（兼及第 4 章回归部分）：Sparsity and Compressed Sensing 与稀疏回归<\/a><br>检查点：能写出 K-稀疏信号的测量条件（incoherence、RIP、测量数尺度），区分 L1 恢复与 LASSO 回归的目标函数与适用场景<\/li><li class='path-step' id='path-03'><strong>步骤 03：数据驱动动力系统<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 7 章：Data-Driven Dynamical Systems — DMD、Koopman、SINDy 与延迟嵌入<\/a><br>检查点：能从快照矩阵构造 DMD 算子并把特征值对应到增长率与频率，能写出 SINDy 的函数库与稀疏优化目标，说明延迟嵌入解决什么问题<\/li><li class='path-step' id='path-04'><strong>步骤 04：降阶模型与数据驱动控制<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 8、10、11、12 章：数据驱动控制、降阶模型与传感器布置<\/a><br>检查点：能推导 POD-Galerkin 投影方程，写出 LQR 代价函数与 Riccati 反馈结构，说明 MPC 的滚动时域思路与传感器/执行器布置的优化目标<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='svd（singular value decomposition）'>SVD（Singular Value Decomposition） — 任意矩阵 $X=U\\Sigma V^*$ 的酉对角分解，$U,V$ 为酉矩阵，$\\Sigma$ 对角元为非负奇异值并按降序排列（PDF 第 28 页） <span class=glossary-ref>（第 1 章：Singular Value Decomposition (SVD) — 低秩近似、PCA 与截断）<\/span><\/li><li data-term='奇异值（singular value）'>奇异值（singular value） — $\\Sigma$ 对角线上非负、降序排列的 $\\sigma_k$，其个数等于矩阵秩；平方后对应协方差矩阵特征值（PDF 第 28、45 页） <span class=glossary-ref>（第 1 章：Singular Value Decomposition (SVD) — 低秩近似、PCA 与截断）<\/span><\/li><li data-term='pca（principal component analysis）'>PCA（Principal Component Analysis） — 先均值中心化（必要时归一化方差），再对数据矩阵做 SVD/协方差特征分解，得到互不相关、与测量最大相关的主成分方向（PDF 第 44 页） <span class=glossary-ref>（第 1 章：Singular Value Decomposition (SVD) — 低秩近似、PCA 与截断）<\/span><\/li><li data-term='截断与硬阈值（truncation / hard threshold）'>截断与硬阈值（truncation / hard threshold） — 只保留前 $r$ 个主导奇异值与向量；Gavish–Donoho 理论在低秩矩阵加高斯白噪声假设下给出最优阈值 $\\tau=\\lambda(\\beta)\\sqrt{n}\\gamma$（PDF 第 54 页） <span class=glossary-ref>（第 1 章：Singular Value Decomposition (SVD) — 低秩近似、PCA 与截断）<\/span><\/li><li data-term='稀疏性（sparsity）'>稀疏性（sparsity） — 信号在合适基下只有少量非零系数；自然数据在 Fourier、wavelet 或数据自身字典中常可稀疏表示（PDF 第 107 页） <span class=glossary-ref>（第 3 章（兼及第 4 章回归部分）：Sparsity and Compressed Sensing 与稀疏回归）<\/span><\/li><li data-term='rip（restricted isometry property）'>RIP（Restricted Isometry Property） — 测量矩阵与稀疏基的乘积对所有 $K$-稀疏向量近似保距：$(1-\\delta_K)\\|s\\|_2^2\\le\\|\\Theta s\\|_2^2\\le(1+\\delta_K)\\|s\\|_2^2$（PDF 第 120 页） <span class=glossary-ref>（第 3 章（兼及第 4 章回归部分）：Sparsity and Compressed Sensing 与稀疏回归）<\/span><\/li><li data-term='lasso'>LASSO — 带 $\\ell_1$ 惩罚的回归：$x=\\arg\\min\\|Ax-b\\|_2+\\lambda\\|x\\|_1$，$\\ell_1$ 惩罚把部分系数压到零，实现特征选择（PDF 第 124 页） <span class=glossary-ref>（第 3 章（兼及第 4 章回归部分）：Sparsity and Compressed Sensing 与稀疏回归）<\/span><\/li><li data-term='dmd（dynamic mode decomposition）'>DMD（Dynamic Mode Decomposition） — 从成对快照矩阵 $X&#x27;\\approx AX$ 回归最佳拟合线性算子 $A=X&#x27;X^\\dagger$，再取其特征值与模态；每个模态对应增长率与振荡频率（PDF 第 260 页） <span class=glossary-ref>（第 7 章：Data-Driven Dynamical Systems — DMD、Koopman、SINDy 与延迟嵌入）<\/span><\/li><li data-term='koopman 算子'>Koopman 算子 — 1931 年 Koopman 提出的作用在可观测量函数空间上的无穷维线性算子 $\\mathcal{K}_t g(x)=g(F_t(x))$，其谱分解刻画非线性系统行为（PDF 第 280 页） <span class=glossary-ref>（第 7 章：Data-Driven Dynamical Systems — DMD、Koopman、SINDy 与延迟嵌入）<\/span><\/li><li data-term='sindy（sparse identification of nonlinear dynamics）'>SINDy（Sparse Identification of Nonlinear Dynamics） — 先构造候选非线性项函数库 $\\Theta(X)$，再对每行方程做 $\\ell_1$ 稀疏回归 $\\xi_k=\\arg\\min\\|\\dot X_k-\\Theta(X)\\xi&#x27;_k\\|_2+\\lambda\\|\\xi&#x27;_k\\|_1$，挑出活跃项（PDF 第 271 页） <span class=glossary-ref>（第 7 章：Data-Driven Dynamical Systems — DMD、Koopman、SINDy 与延迟嵌入）<\/span><\/li><li data-term='pod（proper orthogonal decomposition）'>POD（Proper Orthogonal Decomposition） — 由快照矩阵 SVD 得到的正交最优模态基，等价于 Hilbert 空间中按能量排序的最优基；在流体力学中称 POD，在统计学中对应 PCA/KLT/EOF（PDF 第 30、397 页） <span class=glossary-ref>（第 8、10、11、12 章：数据驱动控制、降阶模型与传感器布置）<\/span><\/li><li data-term='rom（reduced order model）'>ROM（Reduced Order Model） — 把高维系统投影到 $r\\ll n$ 维 POD 基上得到的低维方程组；POD-Galerkin 投影给出 $\\dot a=\\Phi^TL\\Phi a+\\Phi^TN(\\Phi a,\\beta)$（PDF 第 406 页） <span class=glossary-ref>（第 8、10、11、12 章：数据驱动控制、降阶模型与传感器布置）<\/span><\/li><li data-term='lqr（linear quadratic regulator）'>LQR（Linear Quadratic Regulator） — 全状态可测下最小化 $J=\\int(x^*Qx+u^*Ru)dt$ 的最优反馈 $u=-K_rx$，增益 $K_r$ 由代数 Riccati 方程解出（PDF 第 316–317 页） <span class=glossary-ref>（第 8、10、11、12 章：数据驱动控制、降阶模型与传感器布置）<\/span><\/li><li data-term='mpc（model predictive control）'>MPC（Model Predictive Control） — 在滚动时域上反复求解带约束的最优控制问题，利用辨识得到的模型（如 eDMD、SINDYc）预测未来状态并迭代优化作动输入（PDF 第 373 页） <span class=glossary-ref>（第 8、10、11、12 章：数据驱动控制、降阶模型与传感器布置）<\/span><\/li><li data-term='deim（discrete empirical interpolation method）'>DEIM（Discrete Empirical Interpolation Method） — 在 POD 低维近似上再选少量插值节点逼近非线性项，把非线性求值留在低维空间，避免每次都回到原始 $n$ 维（PDF 第 427 页） <span class=glossary-ref>（第 8、10、11、12 章：数据驱动控制、降阶模型与传感器布置）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：先分解降秩，再在低维上做回归/投影<\/h2>\n<p>拿到高维快照矩阵，第一步永远是 SVD 看奇异值谱：先定有效秩 <span class=\"katex-inline\">r<\/span>，把数据压到 POD 坐标，再在 <span class=\"katex-inline\">r<\/span> 维上回归时间算子（DMD）、投影方程（POD-Galerkin）或选传感器。直接在 <span class=\"katex-inline\">n<\/span> 维上构造算子或求逆，计算量随维数立方增长，且噪声方向会进入模型。秩选择结合能量占比、噪声硬阈值与留出预测误差，不单看奇异值大小。<\/p>\n<h2>模式 2：稀疏性假设先选基，再谈少测量<\/h2>\n<p>压缩感知与稀疏回归都要求信号在某个基下系数少：先确认基（Fourier、wavelet、数据字典、多项式库）覆盖真实结构，再用 <span class=\"katex-inline\">\\ell_1<\/span> 压稀疏。基选错，信号稠密，少测量与特征选择都失效；库的覆盖范围决定方法能力上限，稀疏化不能在库外发明结构。<\/p>\n<h2>模式 3：区分欠定恢复与超定拟合两种 <span class=\"katex-inline\">\\ell_1<\/span> 设定<\/h2>\n<p>欠定、无噪声场景用等式约束 <span class=\"katex-inline\">\\Theta s=y<\/span>，恢复保证靠 RIP 与 incoherence；超定、有噪声场景用残差加惩罚 <span class=\"katex-inline\">\\|Ax-b\\|_2+\\lambda\\|x\\|_1<\/span>，复杂度靠交叉验证选 <span class=\"katex-inline\">\\lambda<\/span>。两者共用 <span class=\"katex-inline\">\\ell_1<\/span> 几何，但条件、准则与失败模式不同；把压缩感知的恢复保证搬到 LASSO 上，或反过来，都是概念错位。<\/p>\n<h2>模式 4：数据驱动模型先标清逼近的是谁<\/h2>\n<p>DMD 拟合的是直接测量子空间上的最佳线性算子，不是状态空间里的非线性方程；Koopman 算子推进可观测量，有限维矩阵只是逼近。写结论时区分：模型是线性回归、本征函数逼近还是方程项辨识；谱是有限样本拟合还是系统内禀谱。带作动的数据必须把输入并入回归（DMDc/SINDYc），否则内部动力学与作动效应混淆。<\/p>\n<h2>模式 5：降阶模型的可信度边界等于快照覆盖范围<\/h2>\n<p>POD 基、ROM 方程、传感器点位都从训练快照构造；未访问的工况、参数与模态不在基内，外推误差随距离增大。交付低维模型时同时交代：覆盖了哪些初值/参数范围、截断阶数、非线性项是否超降阶；超出范围需要补快照、在线校正或参数插值。<\/p>\n<h2>模式 6：控制设计先权衡代价，再处理约束<\/h2>\n<p>LQR 在二次代价下求常增益最优，<span class=\"katex-inline\">Q/R<\/span> 权重反映工程偏好；硬约束（饱和、速率、禁区）不在二次代价里，需要 MPC 滚动优化显式处理。高维系统先降阶再上控制器，Riccati 与 MPC 在线成本都随状态维数增长。模型偏差要留鲁棒余量，并用闭环数据持续更新辨识模型。<\/p>\n<h2>模式 7：空间选点与时间嵌入互补补全测量<\/h2>\n<p>状态信息不足时，空间方向用传感器布置（QR 主元、条件数准则）挑位置，时间方向用延迟嵌入（Hankel 矩阵）取历史窗。两组方法都服务于让低维系数可辨识；点位按当前基优化，基更新后点位要重选。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 SVD<\/strong>：任意矩阵 <span class=\"katex-inline\">X=U\\Sigma V^*<\/span>；截断 SVD 是 Frobenius 最优秩-<span class=\"katex-inline\">r<\/span> 逼近；PCA 是中心化后 SVD（PDF 第 26–69 页）。\n<\/li><li>\n<strong>第 3 章（兼第 4 章）稀疏性<\/strong>：<span class=\"katex-inline\">x=\\Psi s<\/span>，<span class=\"katex-inline\">y=\\Theta s<\/span>；incoherence + RIP + <span class=\"katex-inline\">p\\sim k_1K\\log(n/K)<\/span> 保证 <span class=\"katex-inline\">\\ell_1<\/span> 恢复；LASSO 在超定回归里选变量（PDF 第 107–176 页）。\n<\/li><li>\n<strong>第 7 章数据驱动动力系统<\/strong>：DMD 回归 <span class=\"katex-inline\">X&#x27;\\approx AX<\/span>；Koopman 推进可观测量；SINDy 库内稀疏选方程项；Hankel 延迟嵌入（PDF 第 252–298 页）。\n<\/li><li>\n<strong>第 8/10/11/12 章控制与降阶<\/strong>：POD-Galerkin 投影低维方程；LQR 二次代价 + Riccati 反馈；MPC 滚动时域；QR/DEIM 稀疏选点（PDF 第 299–457 页）。\n<\/ul>\n<h2>核心公式速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>主题<\/th><th>公式<\/th><th>页码<\/th><\/tr><\/thead><tbody><tr><td>SVD<\/td><td><span class=\"katex-inline\">X=U\\Sigma V^*<\/span>，<span class=\"katex-inline\">\\sigma_1\\ge\\cdots\\ge0<\/span><\/td><td>28<\/td><\/tr><tr><td>低秩截断<\/td><td><span class=\"katex-inline\">\\tilde X=\\sum_{k=1}^r\\sigma_ku_kv_k^*<\/span>，残差 <span class=\"katex-inline\">\\sum_{k&gt;r}\\sigma_k^2<\/span><\/td><td>31<\/td><\/tr><tr><td>PCA 协方差<\/td><td><span class=\"katex-inline\">C=\\frac{1}{n-1}B^*B<\/span>，主成分方差 <span class=\"katex-inline\">\\sigma_k^2<\/span><\/td><td>45<\/td><\/tr><tr><td>能量占比<\/td><td><span class=\"katex-inline\">E_r=\\sum_{k=1}^r\\sigma_k^2/\\sum_k\\sigma_k^2<\/span><\/td><td>55<\/td><\/tr><tr><td>测量方程<\/td><td><span class=\"katex-inline\">y=Cx=\\Theta s<\/span>，<span class=\"katex-inline\">\\Theta=C\\Psi<\/span><\/td><td>113<\/td><\/tr><tr><td>incoherence<\/td><td><span class=\"katex-inline\">\\mu(C,\\Psi)=\\sqrt n\\max_{j,k}\\|\\langle c_k,\\psi_j\\rangle\\|<\/span><\/td><td>120<\/td><\/tr><tr><td>RIP<\/td><td><span class=\"katex-inline\">(1-\\delta_K)\\|s\\|_2^2\\le\\|\\Theta s\\|_2^2\\le(1+\\delta_K)\\|s\\|_2^2<\/span><\/td><td>120<\/td><\/tr><tr><td>LASSO<\/td><td><span class=\"katex-inline\">\\arg\\min_x\\|Ax-b\\|_2+\\lambda\\|x\\|_1<\/span><\/td><td>124<\/td><\/tr><tr><td>DMD 回归<\/td><td><span class=\"katex-inline\">A=X&#x27;X^\\dagger<\/span>，<span class=\"katex-inline\">\\tilde A=\\tilde U^*X&#x27;\\tilde V\\tilde\\Sigma^{-1}<\/span><\/td><td>260–261<\/td><\/tr><tr><td>谱换算<\/td><td><span class=\"katex-inline\">s=\\ln\\lambda/\\Delta t<\/span>，增长率 <span class=\"katex-inline\">\\ln\\|\\lambda\\|/\\Delta t<\/span>，频率 <span class=\"katex-inline\">\\arg\\lambda/\\Delta t<\/span><\/td><td>259<\/td><\/tr><tr><td>SINDy<\/td><td><span class=\"katex-inline\">\\xi_k=\\arg\\min\\|\\dot X_k-\\Theta(X)\\xi&#x27;_k\\|_2+\\lambda\\|\\xi&#x27;_k\\|_1<\/span><\/td><td>271<\/td><\/tr><tr><td>Koopman<\/td><td><span class=\"katex-inline\">\\mathcal{K}_tg(x)=g(F_t(x))<\/span><\/td><td>280<\/td><\/tr><tr><td>ROM 投影<\/td><td><span class=\"katex-inline\">\\dot a=\\Phi^TL\\Phi a+\\Phi^TN(\\Phi a,\\beta)<\/span><\/td><td>406<\/td><\/tr><tr><td>LQR 代价<\/td><td><span class=\"katex-inline\">J=\\int(x^<em>Qx+u^<\/em>Ru)dt<\/span>，<span class=\"katex-inline\">u=-K_rx<\/span>，<span class=\"katex-inline\">K_r=R^{-1}B^*P<\/span><\/td><td>316–317<\/td><\/tr><tr><td>Riccati<\/td><td><span class=\"katex-inline\">A^<em>P+PA-PBR^{-1}B^<\/em>P+Q=0<\/span><\/td><td>318<\/td><\/tr><tr><td>稀疏测量<\/td><td><span class=\"katex-inline\">\\tilde u=Pu<\/span>，<span class=\"katex-inline\">a=\\Theta^\\dagger y<\/span>，<span class=\"katex-inline\">\\Theta=P\\Phi_r<\/span><\/td><td>427<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>方法-适用场景对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>方法<\/th><th>解决的问题<\/th><th>关键前提<\/th><th>失败信号<\/th><\/tr><\/thead><tbody><tr><td>截断 SVD<\/td><td>高维矩阵低秩压缩<\/td><td>数据近低秩、噪声模型明确<\/td><td>秩虚高、错位行波<\/td><\/tr><tr><td>PCA<\/td><td>找正交方差方向<\/td><td>线性结构、量纲可比<\/td><td>流形弯曲、方差方向无判别性<\/td><\/tr><tr><td>压缩感知<\/td><td>少测量恢复稀疏系数<\/td><td>信号稀疏、测量不相干、<span class=\"katex-inline\">p<\/span> 够<\/td><td>相干测量、信号稠密<\/td><\/tr><tr><td>LASSO<\/td><td>超定回归选变量<\/td><td>真模型稀疏、样本充足<\/td><td>相关变量组、小样本弱效应<\/td><\/tr><tr><td>DMD<\/td><td>数据驱动模态与谱<\/td><td>快照对齐、秩选择合理<\/td><td>带输入未分离、连续谱<\/td><\/tr><tr><td>SINDy<\/td><td>辨识方程右端项<\/td><td>库覆盖真实项、导数质量好<\/td><td>库缺项、微分噪声大<\/td><\/tr><tr><td>POD-Galerkin<\/td><td>高维方程降阶仿真<\/td><td>快照覆盖工况<\/td><td>工况外推、非线性未超降阶<\/td><\/tr><tr><td>LQR<\/td><td>二次代价最优反馈<\/td><td>可控、全状态可测<\/td><td>约束饱和、模型偏差<\/td><\/tr><tr><td>MPC<\/td><td>带约束滚动控制<\/td><td>预测模型可信、在线可解<\/td><td>模型失真、维数过高<\/td><\/tr><tr><td>DEIM/Gappy<\/td><td>非线性项与状态稀疏重构<\/td><td>基已知、节点匹配结构<\/td><td>节点扎堆、基过时<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>复杂度口径<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>步骤<\/th><th>量级<\/th><th>出处<\/th><\/tr><\/thead><tbody><tr><td>稠密 SVD<\/td><td><span class=\"katex-inline\">O(mn\\min(m,n))<\/span><\/td><td>29、42<\/td><\/tr><tr><td>随机 SVD<\/td><td><span class=\"katex-inline\">O(mn\\log r)<\/span><\/td><td>60<\/td><\/tr><tr><td>对角伪逆求逆<\/td><td><span class=\"katex-inline\">O(n)<\/span>；乘转置 <span class=\"katex-inline\">O(n^2)<\/span>；对比稠密求逆 <span class=\"katex-inline\">O(n^3)<\/span><\/td><td>42<\/td><\/tr><tr><td>LASSO 坐标下降<\/td><td>每轮 <span class=\"katex-inline\">O(n)<\/span> 坐标更新，迭代随路径长度增长<\/td><td>124<\/td><\/tr><tr><td>DMD<\/td><td>一次 SVD 主导，小矩阵分解 <span class=\"katex-inline\">O(r^3)<\/span><\/td><td>261<\/td><\/tr><tr><td>Riccati 求解<\/td><td><span class=\"katex-inline\">O(n^3)<\/span><\/td><td>317<\/td><\/tr><\/tbody><\/table><\/div>"}};

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  if(typeof vis !== 'undefined'){ networkLoaded = true; cb(); return; }
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE) { cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库未加载：离线构建请加 <code>--offline all</code>，或联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 掌握度（简化 BKT） ---------- */
function getMastery(cid){
  if(!cid) return 0.5;
  const m = (state.mastery||{})[cid];
  return m !== undefined ? m : 0.3;
}
function updateMastery(cid, delta){
  if(!cid) return;
  if(!state.mastery) state.mastery = {};
  const cur = state.mastery[cid] !== undefined ? state.mastery[cid] : 0.3;
  state.mastery[cid] = Math.max(0, Math.min(1, cur + delta));
  store.set('mastery', state.mastery);
}
function masteryBar(cid){
  const v = Math.round(getMastery(cid)*100);
  return `<div class="mastery-bar"><div style="width:${v}%"></div></div><span class="mastery-label">掌握度 ${v}%</span>`;
}

/* ---------- 搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIndex = null;
let pendingHl = [];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP = new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                        '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                        '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw = q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out = [];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length > 2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low = text.toLowerCase();
  let pos = -1, hit = '';
  for(const t of terms){ const i = low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start = Math.max(0, (pos<0?0:pos) - 60);
  const end = Math.min(text.length, (pos<0?0:pos) + 140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms = pendingHl.slice(); pendingHl = [];
  if(!terms.length) return;
  const root = $('#view'); if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first = null, idx = -1, term = '';
  while((node = walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low = node.nodeValue.toLowerCase();
    for(const t of terms){
      const i = low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){
        first = node; idx = i; term = t;
      }
    }
  }
  if(!first) return;
  try{
    const i = first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range = document.createRange();
    range.setStart(first, i); range.setEnd(first, i+term.length);
    const mark = document.createElement('mark');
    mark.className = 'hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'), 1800);
  }catch(e){}
}
document.addEventListener('click', (e)=>{
  const a = (e.target && e.target.closest) ? e.target.closest('.search-hit a') : null;
  if(a && a.dataset.hl) pendingHl = tokenizeQuery(a.dataset.hl);
});
function searchHref(id){
  const map = {'__path__':'#/path','__diagnosis__':'#/diagnosis','__graph__':'#/graph',
               '__cards__':'#/cards','__glossary__':'#/glossary','__patterns__':'#/patterns',
               '__cheatsheet__':'#/cheatsheet'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '#/quiz/'+id.replace('__quiz_','').replace(/__$/,'');
  if(id.startsWith('__')) return '';
  return '#/'+id;
}
function searchLabel(id){
  if((manifest.chapters||[]).some(c=>c.id===id)) return '章节：'+id;
  if((manifest.concepts||[]).some(c=>c.id===id)) return '概念：'+id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '测验';
  return id;
}
function pageTitle(id){
  const ch = (manifest.chapters||[]).find(c=>c.id===id);
  if(ch) return ch.title || id;
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp) return cp.title || id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')){
    const q = (manifest.quizzes||[]).find(x=>'__quiz_'+x.id===id);
    return q ? '测验 · '+String(q.question||'').slice(0,14) : '测验';
  }
  return id;
}
function chapOf(id){
  const chs = manifest.chapters || [];
  const ci = chs.findIndex(c=>c.id===id);
  if(ci >= 0) return {key:'ch:'+id, label:chs[ci].title||id, order:ci};
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp){
    const chId = (cp.chapterIds||[])[0];
    const i = chs.findIndex(c=>c.id===chId);
    if(i >= 0) return {key:'ch:'+chId, label:chs[i].title||chId, order:i};
    return {key:'zz', label:'未归入章节', order:900};
  }
  return {key:'tools', label:'术语与工具页', order:950, ref:true};
}
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    const href = searchHref(id);
    if(!href) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, href, text, label:pageTitle(id), chap:chapOf(id)});
  });
  return searchIndex;
}
function synOf(t){
  const out = [];
  for(const g of SYN_GROUPS){ if(g.indexOf(t) >= 0){ for(const x of g){ if(x !== t) out.push(x); } } }
  return out.slice(0,6);
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim();
  if(!v){ showPage(routeIdFromHash()); return; }
  const terms = tokenizeQuery(v);
  if(!terms.length){ showPage(routeIdFromHash()); return; }
  const grams = [];
  terms.forEach(t=>{ if(t.length >= 2){ for(let i=0;i+2<=t.length;i++) grams.push(t.slice(i,i+2)); } });
  const qGrams = [...new Set(grams)].slice(0,16);
  const snippetTerms = terms.concat(...terms.map(synOf)).slice(0,24);
  const hits = [];
  buildSearchIndex().forEach(p=>{
    const low = p.text.toLowerCase();
    let tHit = 0, sHit = 0, gHit = 0, first = '', viaSyn = '';
    for(const t of terms){
      if(low.includes(t)){ tHit++; if(!first) first = t; continue; }
      for(const s of synOf(t)){
        if(low.includes(s)){ sHit++; if(!viaSyn) viaSyn = s; if(!first) first = s; break; }
      }
    }
    for(const gm of qGrams){ if(low.includes(gm)) gHit++; }
    if(tHit > 0 || sHit > 0 || gHit >= 4){
      hits.push({p, score: tHit*100 + sHit*30 + Math.min(gHit,20), first, viaSyn});
    }
  });
  hits.sort((a,b)=> b.score-a.score || a.p.text.length-b.p.text.length);
  const top = hits.slice(0,20);
  let body;
  if(top.length){
    const gs = {};
    top.forEach(h=>{
      const k = h.p.chap.key;
      (gs[k] = gs[k] || {label:h.p.chap.label, order:h.p.chap.order, ref:!!h.p.chap.ref, hits:[]}).hits.push(h);
    });
    const eff = g => Math.max(...g.hits.map(x=>x.score)) * (g.ref ? 0.55 : 1);
    const order = Object.values(gs).sort((a,b)=> eff(b)-eff(a));
    body = order.map(g=>{
      const inner = g.hits.sort((a,b)=> b.score-a.score).map(h=>
        `<div class="search-hit"><a href="${h.p.href}" data-hl="${esc(h.first)}">${esc(h.p.label)}</a>${h.viaSyn?`<span class="syn-note">同义命中：${esc(h.viaSyn)}</span>`:''}<br><span class="sub">${hlSnippet(h.p.text, snippetTerms)}</span></div>`).join('');
      return `<div class="search-group"><div class="grp-head">${esc(g.label)}<span class="grp-count">${g.hits.length}</span></div>${inner}</div>`;
    }).join('');
  } else {
    body = '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语，或减少关键词。</div>';
  }
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' + body;
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof mermaid === 'undefined') return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  if(typeof mermaid !== 'undefined'){ boot(); return; }
  const urls=['https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js',
              'https://registry.npmmirror.com/mermaid/10.9.1/files/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js'];
  let ui=0, done=false;
  const tryNext=()=>{
    if(done || ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    const timer=setTimeout(()=>{ if(done) return; s.onload=null; s.onerror=null; s.remove(); tryNext(); }, 4000);
    s.onload=()=>{ done=true; clearTimeout(timer); boot(); };
    s.onerror=()=>{ clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

<script id="zs-visual-init">
(function(){
  try{
    var B=document.body, H=document.documentElement;
    if(!B.dataset.theme && !H.dataset.theme) B.dataset.theme='dark';
    var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
    var scope=document.querySelectorAll('header, .topbar, .topbar-fixed, #topbar, .sidebar, .tabs, .hdr-right, .card-actions, .card-controls, .section-title, .card .icon, .icon-label');
    for(var i=0;i<scope.length;i++){
      var w=document.createTreeWalker(scope[i],NodeFilter.SHOW_TEXT,null,false), n;
      while(n=w.nextNode()){
        if(EMOJI.test(n.nodeValue)){
          n.nodeValue=n.nodeValue.replace(EMOJI,'').replace(/[ \t]+/g,' ').replace(/^ | $/g,'');
        }
      }
    }
    var btn=document.getElementById('theme-btn')||document.getElementById('theme')||document.getElementById('themeToggle');
    function label(){
      if(!btn) return;
      var light=B.dataset.theme==='light'||H.getAttribute('data-theme')==='light'||B.dataset.theme==='';
      if(btn.textContent.trim()===''||/浅色|深色/.test(btn.textContent)) btn.textContent=light?'深色':'浅色';
    }
    label();
    if(btn){
      new MutationObserver(label).observe(B,{attributes:true,attributeFilter:['data-theme']});
      new MutationObserver(label).observe(H,{attributes:true,attributeFilter:['data-theme']});
      btn.addEventListener('click',function(){setTimeout(label,0);},true);
    }
  }catch(e){}
})();
</script>
