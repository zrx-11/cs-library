个候选位置里挑 <span class=\"katex-inline\">p<\/span> 个传感器（或执行器、插值节点），按什么目标挑，才能让少量测量保持低维系数可辨识、条件数良好；怎么用这些少量点重构全场、近似非线性项。<\/p>\n<p>不做布置优化，随机选点可能在模态变化区域留出大空档，少量测量的伪逆病态，噪声被条件数放大；非线性项每次回原维求值，降阶模型省不下计算。组合枚举 <span class=\"katex-inline\">\\binom{n}{p}<\/span> 在 <span class=\"katex-inline\">n<\/span> 大时不可行，需要贪心近似原则（PDF 第 133–134 页）。<\/p>\n<h2>定义逐句拆解<\/h2>\n<p><strong>稀疏测量与 Gappy POD<\/strong>。测量矩阵 <span class=\"katex-inline\">P\\in\\mathbb{R}^{r\\times n}<\/span> 挑 <span class=\"katex-inline\">r<\/span> 个位置，<span class=\"katex-inline\">\\tilde u=Pu<\/span>；低维系数 <span class=\"katex-inline\">a<\/span> 由少量测量重构，<span class=\"katex-inline\">u\\approx\\Phi a<\/span>（PDF 第 427 页公式 12.1）。Gappy POD 用稀疏采样近似内积，从缺测快照重构模态与系数（PDF 第 427 页）。<\/p>\n<p><strong>布置优化目标<\/strong>。测量后低维方程 <span class=\"katex-inline\">y=Ca=\\Theta a<\/span>，<span class=\"katex-inline\">\\Theta=C\\Phi_r<\/span>；伪逆涉及 <span class=\"katex-inline\">M=\\Theta^T\\Theta<\/span>。可选目标：最小化条件数 <span class=\"katex-inline\">\\kappa(M)<\/span>、最大化最小奇异值、最大化迹或行列式（PDF 第 134、436 页）。<\/p>\n<p><strong>条件数<\/strong>。矩阵条件数是最大/最小奇异值之比；条件数越大，伪逆对输入噪声越敏感，信噪比经映射后按条件数下降（PDF 第 134 页附近）。<\/p>\n<p><strong>pivoted QR 贪心<\/strong>。对基矩阵做列主元 QR：<span class=\"katex-inline\">\\Phi_r\\Phi_r^TC^T=QR<\/span>，主元每步选 2-范数最大的列、减去其余列在该列上的正交投影，近似最小化矩阵体积（行列式绝对值），给出 <span class=\"katex-inline\">r<\/span> 个点传感器（PDF 第 135 页公式 3.22–3.23）。<\/p>\n<p><strong>DEIM（discrete empirical interpolation method）<\/strong>：对非线性项快照先 POD 分解，再用贪心插值指标选少量节点，指定插值式投影，在近似最优 <span class=\"katex-inline\">\\ell_2<\/span> 子空间里逼近非线性项；投影与插值结合，把非线性求值留在低维（PDF 第 427 页）。<\/p>\n<p><strong>正例<\/strong>：已知人脸库时按 <span class=\"katex-inline\">\\Psi_r=\\tilde U<\/span> 优化传感器，相比随机测量大幅减少所需点数；pivoted QR 给出近优点位（PDF 第 133、135 页）。 <strong>反例<\/strong>：20% 随机采样下，点位不同条件数可差两个数量级；最差配置在域中央留大空档，重构误差与条件数同时飙升（PDF 第 436 页图 12.7）。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>前提<\/strong>：POD 基 <span class=\"katex-inline\">\\Phi_r\\in\\mathbb{R}^{n\\times r}<\/span> 已定；从 <span class=\"katex-inline\">n<\/span> 个位置挑 <span class=\"katex-inline\">p<\/span> 个测量。<\/p>\n<ol><li>\n<strong>低维测量方程<\/strong>。<span class=\"katex-inline\">y=Pu=P\\Phi_r a=\\Theta a<\/span>，<span class=\"katex-inline\">\\Theta\\in\\mathbb{R}^{p\\times r}<\/span>。<span class=\"katex-inline\">p=r<\/span> 时要求 <span class=\"katex-inline\">\\Theta<\/span> 方阵可逆；<span class=\"katex-inline\">p&gt;r<\/span> 超定，改善 <span class=\"katex-inline\">M=\\Theta^T\\Theta<\/span> 条件数（PDF 第 134 页）。\n<\/li><li>\n<strong>优化目标<\/strong>。最小化 <span class=\"katex-inline\">\\kappa(\\Theta)<\/span> 等价于最大化最小奇异值；迹、行列式（矩阵体积）也是备选准则。这些组合优化都是 NP-hard，暴力枚举不可行（PDF 第 134 页）。\n<\/li><li>\n<strong>贪心近似<\/strong>。pivoted QR 每步选当前 residual 范数最大的列进入主元集，再从其余列减去该列投影；列主元近似最大化子矩阵体积，从而控制条件数。\n<\/li><li>\n<strong>重构<\/strong>。选中点位构成 <span class=\"katex-inline\">P<\/span>，系数 <span class=\"katex-inline\">a=\\Theta^\\dagger y<\/span>，全场 <span class=\"katex-inline\">u=\\Phi_r a<\/span>；测量数 <span class=\"katex-inline\">p=r<\/span> 唯一解，<span class=\"katex-inline\">p&gt;r<\/span> 最小二乘更稳。\n<\/li><li>\n<strong>非线性项插值<\/strong>。非线性快照 <span class=\"katex-inline\">N(u)<\/span> POD 分解得基 <span class=\"katex-inline\">\\Psi_N<\/span>；DEIM 选 <span class=\"katex-inline\">p_N<\/span> 个插值指标，只在这些节点上算非线性值，再插值重构低维非线性项；避免每次回 <span class=\"katex-inline\">n<\/span> 维求值。\n<\/li><li>\n<strong>与超降阶的关系<\/strong>。Gappy POD 侧重从稀疏测量重构状态/内积，DEIM 侧重非线性项近似；两者都服务于 c08 ROM 的在线效率（PDF 第 427 页）。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ol><li>\n<strong>基已知且覆盖工况<\/strong>：布置按特定库 <span class=\"katex-inline\">\\Phi_r<\/span> 优化；系统工况变化超出训练快照，基与点位同时失效。\n<\/li><li>\n<strong><span class=\"katex-inline\">p<\/span> 与 <span class=\"katex-inline\">r<\/span> 关系<\/strong>：<span class=\"katex-inline\">p&lt;r<\/span> 欠定，系数不可辨识；<span class=\"katex-inline\">p=r<\/span> 刚够但条件数敏感；<span class=\"katex-inline\">p=r+10<\/span> 通常显著改善条件数（PDF 第 134 页附近）。\n<\/li><li>\n<strong>贪心近优而非全局最优<\/strong>：QR 主元近似矩阵体积目标，不保证最小条件数；凸优化/半定规划可更优但要反复 <span class=\"katex-inline\">n\\times n<\/span> 分解，代价高（PDF 第 134 页）。\n<\/li><li>\n<strong>执行器布置对称问题<\/strong>：可控性 Gramians 与可观性 Gramians 分别指导执行器与传感器位置；第 9 章平衡变换把两者统一到同一状态排序（PDF 第 133 页）。\n<\/li><li>\n<strong>失败案例<\/strong>：随机点位在模态节点附近扎堆，<span class=\"katex-inline\">\\Theta<\/span> 列近似相关，条件数接近 <span class=\"katex-inline\">10^{16}<\/span> 数值奇异；重构被噪声主导（PDF 第 134 页附近）。\n<\/li><li>\n<strong>失败案例<\/strong>：DEIM 插值节点落在非线性项变化平缓处，插值近似误差大；节点选择要基于非线性项快照，不能直接复用状态 POD 节点。\n<\/ol>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>传感器布置 vs 执行器布置<\/strong>：传感器由可观性（<span class=\"katex-inline\">W_o<\/span>）指导，执行器由可控性（<span class=\"katex-inline\">W_c<\/span>）指导；目标分别是可辨识状态与可达状态，点位准则对称但不相同。\n<\/li><li>\n<strong>Gappy POD vs DEIM<\/strong>：Gappy POD 用稀疏测量重构状态与内积；DEIM 专门近似非线性项，插值指标来自非线性项 POD 基。\n<\/li><li>\n<strong>随机采样 vs 原则化选点<\/strong>：随机测量通用但条件数方差大；按库贪心选点在特定 ROM 上近优，跨库泛化性弱。\n<\/li><li>\n<strong>测量点 vs 延迟坐标<\/strong>：c10 在空间上挑位置，c07 在时间上取历史窗；两者从不同维度补全测量信息。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：c01 SVD/POD 基；c03 测量矩阵与可辨识条件；c08 ROM 低维方程。\n<\/li><li>\n后继：本章是 ROM 在线效率与闭环状态观测的落地环节；第 12 章参数化 ROM 插值依赖这套稀疏采样；c09 控制器需要可观测的低维状态作为反馈输入。\n<\/li><li>\n串联：布置优化把&quot;少量测量恢复低维系数&quot;从压缩感知的通用随机测量，推进到面向特定数据基的定制采样。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（传感器/执行器布置与 Gappy POD / DEIM）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：测量方程、条件数准则与选点数值算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把&quot;少量传感器可辨识低维系数&quot;推到底，逐级倒查：<\/p>\n<ol><li>\n系数可辨识先要求 <span class=\"katex-inline\">\\Theta=P\\Phi_r<\/span> 列满秩，倒查到测量数 <span class=\"katex-inline\">p\\ge r<\/span> 与基 <span class=\"katex-inline\">\\Phi_r<\/span> 已知。\n<\/li><li>\n辨识稳健性由条件数控制，倒查到伪逆对噪声的放大倍数；条件数大则测量噪声经重构放大。\n<\/li><li>\n最优布置是组合优化，倒查到 NP-hard 性质；实践用贪心 QR 主元近似矩阵体积目标。\n<\/li><li>\n重构全场倒查到 <span class=\"katex-inline\">u=\\Phi_r a<\/span> 的低秩展开；点位选错则系数偏差直接传到全场。\n<\/li><li>\n非线性项近似倒查到 DEIM 在非线性项快照上另选插值节点，与状态传感器点位不是同一组。\n<\/ol>\n<p>链条断掉：<span class=\"katex-inline\">p&lt;r<\/span> 欠定，系数有无穷多解；基未覆盖工况，按旧基选的点位在新工况下失效；贪心目标与真实误差准则不一致，近优点位可能局部次优。<\/p>\n<h2>正向推导<\/h2>\n<ul><li>\n第一步，低维展开。<span class=\"katex-inline\">u\\approx\\Phi_r a<\/span>，<span class=\"katex-inline\">\\Phi_r\\in\\mathbb{R}^{n\\times r}<\/span> 为 POD 基，<span class=\"katex-inline\">a\\in\\mathbb{R}^r<\/span>。\n<\/li><li>\n第二步，稀疏测量。<span class=\"katex-inline\">P\\in\\mathbb{R}^{p\\times n}<\/span> 选 <span class=\"katex-inline\">p<\/span> 个位置，<span class=\"katex-inline\">y=Pu=P\\Phi_ra=\\Theta a<\/span>，<span class=\"katex-inline\">\\Theta=P\\Phi_r<\/span>。\n<\/li><li>\n第三步，系数重构。<span class=\"katex-inline\">p=r<\/span> 时 <span class=\"katex-inline\">a=\\Theta^{-1}y<\/span>；<span class=\"katex-inline\">p&gt;r<\/span> 时 <span class=\"katex-inline\">a=\\Theta^\\dagger y<\/span>，最小二乘解降低噪声敏感度。\n<\/li><li>\n第四步，条件数准则。<span class=\"katex-inline\">\\kappa(\\Theta)=\\sigma_{\\max}/\\sigma_{\\min}<\/span>；测量噪声经伪逆放大的量级与 <span class=\"katex-inline\">\\kappa<\/span> 同阶。优化目标可取最小化 <span class=\"katex-inline\">\\kappa<\/span>、最大化 <span class=\"katex-inline\">\\sigma_{\\min}<\/span>、最大化迹或行列式（矩阵体积）。\n<\/li><li>\n第五步，组合难度。从 <span class=\"katex-inline\">n<\/span> 位置选 <span class=\"katex-inline\">p<\/span> 个有 <span class=\"katex-inline\">\\binom{n}{p}<\/span> 种配置；上述目标均为 NP-hard。凸优化/半定规划可求解但需反复 <span class=\"katex-inline\">n\\times n<\/span> 分解，大规模不实用（PDF 第 134 页）。\n<\/li><li>\n第六步，pivoted QR 贪心。对 <span class=\"katex-inline\">\\Phi_r\\Phi_r^T<\/span>（或 <span class=\"katex-inline\">\\Phi_r<\/span>）做列主元 QR：<span class=\"katex-inline\">\\Phi_r\\Phi_r^TC^T=QR<\/span>。每步选残差 2-范数最大的列为主元，再从其余列减去在主元列上的正交投影；主元序列近似最大化子矩阵行列式绝对值，控制体积与条件数（PDF 第 135 页公式 3.22–3.23）。\n<\/li><li>\n第七步，DEIM 插值。非线性快照 <span class=\"katex-inline\">N<\/span> 做 POD 得基 <span class=\"katex-inline\">\\Psi_N<\/span>；贪心选 <span class=\"katex-inline\">p_N<\/span> 个插值指标，非线性值只在节点上计算，经插值重构低维非线性项；投影与插值结合，近似最优 <span class=\"katex-inline\">\\ell_2<\/span> 子空间（PDF 第 427 页）。\n<\/li><li>\n复杂度口径：枚举 <span class=\"katex-inline\">O(\\binom{n}{p})<\/span>；pivoted QR 对 <span class=\"katex-inline\">n\\times n<\/span> 矩阵 <span class=\"katex-inline\">O(n^3)<\/span>，主元选择在 <span class=\"katex-inline\">r<\/span> 步内完成；在线重构只算 <span class=\"katex-inline\">p<\/span> 个测量与 <span class=\"katex-inline\">r<\/span> 维系数。\n<\/ul>\n<h2>数值算例：两模态基的传感器点位对照<\/h2>\n<p><strong>已知条件<\/strong>：<span class=\"katex-inline\">n=10<\/span> 个候选位置，<span class=\"katex-inline\">r=2<\/span> 个 POD 模态；<span class=\"katex-inline\">\\Phi<\/span> 为 <span class=\"katex-inline\">10\\times2<\/span> 正交基（随机生成后 QR 正交化）。挑 <span class=\"katex-inline\">p=2<\/span> 个传感器，比较随机选点、QR 主元与全局最优/最差配对的条件数。<\/p>\n<p><strong>第一步，测量子矩阵<\/strong>。选点位集合 <span class=\"katex-inline\">S<\/span>，<span class=\"katex-inline\">\\Theta_S=\\Phi_{S,:}<\/span>，条件数 <span class=\"katex-inline\">\\kappa(\\Theta_S)=\\sigma_{\\max}/\\sigma_{\\min}<\/span>。<\/p>\n<p><strong>第二步，随机采样对照<\/strong>。200 次随机两位置采样，条件数中位数 <span class=\"katex-inline\">4.846<\/span>，最小 <span class=\"katex-inline\">1.344<\/span>，最大 <span class=\"katex-inline\">69.103<\/span>。同样两个传感器，点位不同使条件数跨约两个数量级，与本书 20% 采样实验的结论一致（PDF 第 436 页）。<\/p>\n<p><strong>第三步，QR 主元选点<\/strong>。对 <span class=\"katex-inline\">\\Phi\\Phi^T<\/span> 做列主元 QR，主元列 <span class=\"katex-inline\">4,3<\/span>；该配对条件数 <span class=\"katex-inline\">1.344<\/span>。 <strong>第四步，全局枚举核对<\/strong>。遍历全部 <span class=\"katex-inline\">\\binom{10}{2}=45<\/span> 个配对：最优配对 <span class=\"katex-inline\">(3,4)<\/span>，条件数 <span class=\"katex-inline\">1.344<\/span>；最差配对 <span class=\"katex-inline\">(0,1)<\/span>，条件数 <span class=\"katex-inline\">69.103<\/span>。QR 主元选出的 <span class=\"katex-inline\">(3,4)<\/span> 即全局最优配对；本算例规模小，贪心与枚举重合，大规模下 QR 给出近优解。<\/p>\n<p><strong>第五步，误差传导对照<\/strong>。测量噪声 <span class=\"katex-inline\">\\epsilon<\/span> 经伪逆放大后系数误差量级 <span class=\"katex-inline\">\\kappa\\cdot\\|\\epsilon\\|<\/span>：最优配对放大 1.34 倍，最差配对放大 69.1 倍；同样传感器数量，差点位把测量噪声放大五十倍以上。<\/p>\n<p><strong>第六步，超采样对照<\/strong>。<span class=\"katex-inline\">p=r=2<\/span> 刚够可逆，条件数敏感；<span class=\"katex-inline\">p<\/span> 取 <span class=\"katex-inline\">r+10<\/span> 时超定最小二乘平均压低条件数，本书指出 Oversampling 通常显著改善良态（PDF 第 134 页附近）。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：点位扎堆模态节点。两列在基空间内近似线性相关，<span class=\"katex-inline\">\\sigma_{\\min}\\to0<\/span>，条件数接近机器精度倒数；重构系数被噪声淹没。 反例二：基随参数变化。训练参数下选出的点位在新 <span class=\"katex-inline\">\\beta<\/span> 工况落入新模态空档，条件数重新恶化；需要随参数更新点位或多参数库联合选点。 反例三：DEIM 节点复用状态 POD 节点。非线性项空间结构与状态不同，同组节点在非线性平缓区无信息；插值指标应从非线性项快照基选出。 反例四：把条件数当唯一准则。条件数良态不保证重构误差小；还需对照方差、迹等准则与留出重构误差联合判断。<\/p>\n<h2>与相邻概念的推导衔接<\/h2>\n<p>c03 给出测量可辨识的一般条件（incoherence、RIP）；本章把随机测量换成面向特定 POD 库的贪心定制。c08 ROM 是被测量与被投影对象；c09 控制器依赖本章提供的可观测低维状态；c07 时间延迟嵌入与本章空间选点互补。<\/p>\n<h2>推导中容易跳过的环节<\/h2>\n<ul><li>\n<span class=\"katex-inline\">\\Theta=P\\Phi_r<\/span> 的维数：<span class=\"katex-inline\">P<\/span> 是 <span class=\"katex-inline\">p\\times n<\/span>，<span class=\"katex-inline\">\\Phi_r<\/span> 是 <span class=\"katex-inline\">n\\times r<\/span>，乘积 <span class=\"katex-inline\">p\\times r<\/span>；维数对不上说明测量矩阵定义写错。\n<\/li><li>\n条件数是最大/最小奇异值之比，不是行列式；行列式体积只是 QR 贪心的近似目标。\n<\/li><li>\nDEIM 选的是非线性项节点，不是状态传感器；两组点位服务于不同重构任务。\n<\/ul>\n<h2>补充推演：Gappy 重构、执行器布置与 DEIM 流程<\/h2>\n<ul><li>\nGappy 重构方程。已知低维展开 <span class=\"katex-inline\">u=\\Phi_r a<\/span>，稀疏测量 <span class=\"katex-inline\">y=Pu<\/span>；代入得 <span class=\"katex-inline\">y=P\\Phi_ra=\\Theta a<\/span>。<span class=\"katex-inline\">p=r<\/span> 时 <span class=\"katex-inline\">a=\\Theta^{-1}y<\/span>，<span class=\"katex-inline\">p&gt;r<\/span> 时 <span class=\"katex-inline\">a=\\Theta^\\dagger y<\/span>，重构 <span class=\"katex-inline\">\\hat u=\\Phi_ra<\/span>。缺测位置不靠直接测量，靠基系数插值补回。\n<\/li><li>\n内积近似。POD 模态内积原本要在全 <span class=\"katex-inline\">n<\/span> 维积分；gappy POD 用少量测量点加权近似内积，支撑缺测快照上的模态更新（PDF 第 427 页，Everson–Sirovich 原始框架）。\n<\/li><li>\n执行器布置对称问题。传感器由可观性 Gramian <span class=\"katex-inline\">W_o<\/span> 指导：<span class=\"katex-inline\">W_o<\/span> 小的方向测不到；执行器由可控性 Gramian <span class=\"katex-inline\">W_c<\/span> 指导：<span class=\"katex-inline\">W_c<\/span> 小的方向推不动。两类布置目标对称，分别对应第 8.3 节两个 Gramian（PDF 第 315、133 页）。\n<\/li><li>\n超采样收益。<span class=\"katex-inline\">p=r<\/span> 刚可逆，<span class=\"katex-inline\">\\Theta<\/span> 条件数敏感；<span class=\"katex-inline\">p=r+10<\/span> 量级超采样后最小二乘平均压低条件数，本书指出 Oversampling 通常显著改善良态（PDF 第 134 页附近）。\n<\/li><li>\nDEIM 流程。第一步对非线性快照 <span class=\"katex-inline\">N<\/span> 做 POD 得基 <span class=\"katex-inline\">\\Psi_N<\/span>；第二步贪心选插值指标：每步选当前残差最大位置为主元，更新投影；第三步只在主元节点算非线性值，经插值重构低维非线性项。指标来自非线性项基，不复用状态传感器（PDF 第 427 页）。\n<\/li><li>\n误差与收敛。Gappy POD 重构误差随测量数与基模态数下降；条件数是误差放大的中间量，条件数小不直接等于误差小，仍需留出快照核对重构精度（PDF 第 435–436 页）。\n<\/li><li>\n复杂度补充。枚举 <span class=\"katex-inline\">\\binom{n}{p}<\/span> 不可行；pivoted QR 主元选择 <span class=\"katex-inline\">O(n^3)<\/span> 量级，<span class=\"katex-inline\">r<\/span> 步完成；在线只算 <span class=\"katex-inline\">p<\/span> 个测量与 <span class=\"katex-inline\">r<\/span> 维系数。DEIM 在线非线性求值从 <span class=\"katex-inline\">n<\/span> 维降到 <span class=\"katex-inline\">p_N<\/span> 个节点。\n<\/ul>\n<h2>补充推演（二）：误差传导与枚举规模复核<\/h2>\n<ul><li>\n噪声传导链条。测量 <span class=\"katex-inline\">y=\\Theta a+\\epsilon<\/span>，伪逆重构 <span class=\"katex-inline\">\\hat a=\\Theta^\\dagger y=a+\\Theta^\\dagger\\epsilon<\/span>；系数误差上界 <span class=\"katex-inline\">\\|\\hat a-a\\|_2\\le\\|\\Theta^\\dagger\\|_2\\|\\epsilon\\|_2=\\|\\epsilon\\|_2/\\sigma_{\\min}(\\Theta)<\/span>，条件数 <span class=\"katex-inline\">\\kappa=\\sigma_{\\max}/\\sigma_{\\min}<\/span> 把误差放大倍数与基向量尺度一并计入。\n<\/li><li>\n枚举规模复核。<span class=\"katex-inline\">n=10,p=2<\/span> 时配对数 <span class=\"katex-inline\">\\binom{10}{2}=45<\/span>；本算例遍历全部配对，最优 <span class=\"katex-inline\">(3,4)<\/span> 条件数 <span class=\"katex-inline\">1.344<\/span>，最差 <span class=\"katex-inline\">(0,1)<\/span> 条件数 <span class=\"katex-inline\">69.103<\/span>，相差约 <span class=\"katex-inline\">51<\/span> 倍。点位选择对重构精度的影响在小规模枚举上直接可见。\n<\/li><li>\nGramian 对称分工。传感器布置看可观性 Gramian <span class=\"katex-inline\">W_o<\/span>，执行器布置看可控性 Gramian <span class=\"katex-inline\">W_c<\/span>；<span class=\"katex-inline\">W_o<\/span> 小的方向测不到，<span class=\"katex-inline\">W_c<\/span> 小的方向推不动。两类优化目标对称，选点准则各自对应。\n<\/li><li>\n超采样边界。<span class=\"katex-inline\">p=r<\/span> 刚可逆，<span class=\"katex-inline\">\\sigma_{\\min}<\/span> 对点位最敏感；<span class=\"katex-inline\">p&gt;r<\/span> 后最小二乘在多测量上平均噪声，条件数平均压低；超采样收益随 <span class=\"katex-inline\">p<\/span> 递减，需对照传感器成本取舍。\n<\/ul>\n<h2>延伸推演：传感器布置前提再拆一层<\/h2>\n<p>少量传感器辨识低维系数，依赖四条子条件。<\/p>\n<ul><li>\n子前提一：低维基 <span class=\"katex-inline\">\\Phi_r<\/span> 已知。测量方程 <span class=\"katex-inline\">y=P\\Phi_ra=\\Theta a<\/span> 的可辨识性建立在基张成子空间上；基未知时测量矩阵与系数同时待求，问题维度抬高。\n<\/li><li>\n子前提二：测量数 <span class=\"katex-inline\">p\\ge r<\/span>。<span class=\"katex-inline\">p&lt;r<\/span> 时 <span class=\"katex-inline\">\\Theta<\/span> 列数多于行数，系数有无穷多解；<span class=\"katex-inline\">p=r<\/span> 刚够可逆，条件数对点位最敏感，<span class=\"katex-inline\">p&gt;r<\/span> 超定最小二乘平均压低条件数。\n<\/li><li>\n子前提三：基覆盖目标工况。训练参数下选出的点位在新 <span class=\"katex-inline\">\\beta<\/span> 工况落入新模态空档；基随参数变化时，旧点位的条件数重新恶化。\n<\/li><li>\n子前提四：优化准则与真实误差一致。条件数良态不直接等于重构误差小；还需对照方差、迹等准则与留出重构误差，条件数只是误差放大的中间量。\n<\/li><li>\n去掉子前提的后果：基未知致问题不可解，<span class=\"katex-inline\">p&lt;r<\/span> 致欠定，工况漂移致点位失效，准则错配致低条件数高误差。\n<\/ul>\n<h2>第二算例：n=12、r=3 的点位枚举、随机与 QR 对照<\/h2>\n<p><strong>已知条件<\/strong>：<span class=\"katex-inline\">n=12<\/span> 个候选位置，<span class=\"katex-inline\">r=3<\/span> 个 POD 模态；<span class=\"katex-inline\">\\Phi<\/span> 为 <span class=\"katex-inline\">12\\times3<\/span> 正交基（随机生成后 QR 正交化）。挑 <span class=\"katex-inline\">p=3<\/span> 个传感器，测量子矩阵 <span class=\"katex-inline\">\\Theta_S=\\Phi_{S,:}<\/span>，条件数 <span class=\"katex-inline\">\\kappa=\\sigma_{\\max}/\\sigma_{\\min}<\/span>。<\/p>\n<pre class=\"lang-python\"><code>import numpy as np, itertools\nrng = np.random.default_rng(20261128)\nn, r = 12, 3\nPhi,_ = np.linalg.qr(rng.standard_normal((n,r)))\ndef cond(S): return np.linalg.cond(Phi[list(S),:])<\/code><\/pre>\n<p><strong>第一步，全局枚举<\/strong>。遍历 <span class=\"katex-inline\">\\binom{12}{3}=220<\/span> 个配对：<\/p>\n<ul><li>\n最优配对 <span class=\"katex-inline\">(1,3,5)<\/span>，<span class=\"katex-inline\">\\kappa=1.7084<\/span>；\n<\/li><li>\n最差配对 <span class=\"katex-inline\">(2,5,11)<\/span>，<span class=\"katex-inline\">\\kappa=427.0586<\/span>。\n<\/ul>\n<p>同一传感器数量，条件数跨约 <span class=\"katex-inline\">427.06/1.71=250<\/span> 倍。<\/p>\n<p><strong>第二步，随机采样对照<\/strong>。300 次随机三位置采样，条件数中位数 <span class=\"katex-inline\">5.0511<\/span>，最小 <span class=\"katex-inline\">1.7084<\/span>，最大 <span class=\"katex-inline\">427.0586<\/span>。随机点位多数落在良态与病态之间，尾部配对条件数接近机器精度倒数。<\/p>\n<p><strong>第三步，QR 主元选点<\/strong>。对 <span class=\"katex-inline\">\\Phi\\Phi^T<\/span> 做列主元 QR，主元序列前三位 <span class=\"katex-inline\">[11,2,0]<\/span>，该配对条件数 <span class=\"katex-inline\">1.7878<\/span>，接近全局最优 <span class=\"katex-inline\">1.7084<\/span>；本规模下贪心与枚举接近，大规模时 QR 给出近优解。<\/p>\n<p><strong>第四步，误差传导对照<\/strong>。测量噪声 <span class=\"katex-inline\">\\epsilon<\/span> 经伪逆放大，系数误差上界 <span class=\"katex-inline\">\\|\\hat a-a\\|_2\\le\\|\\epsilon\\|_2/\\sigma_{\\min}(\\Theta)<\/span>。最优配对放大倍数 <span class=\"katex-inline\">1.71<\/span>，最差配对放大 <span class=\"katex-inline\">427.06<\/span>；同样三个传感器，差点位把测量噪声放大约 250 倍。<\/p>\n<ul><li>\n枚举规模与在线成本。<span class=\"katex-inline\">n=12,r=3<\/span> 配对数 220，小规模可全枚举；<span class=\"katex-inline\">n<\/span> 增大后 <span class=\"katex-inline\">\\binom{n}{r}<\/span> 组合爆炸，枚举不可行，pivoted QR 主元选择 <span class=\"katex-inline\">O(n^3)<\/span> 量级、<span class=\"katex-inline\">r<\/span> 步完成。在线重构只算 <span class=\"katex-inline\">p<\/span> 个测量与 <span class=\"katex-inline\">r<\/span> 维系数，成本与传感器数量成正比。\n<\/li><li>\n两类布置对称。传感器由可观性 Gramian <span class=\"katex-inline\">W_o<\/span> 指导，<span class=\"katex-inline\">W_o<\/span> 小的方向测不到；执行器由可控性 Gramian <span class=\"katex-inline\">W_c<\/span> 指导，<span class=\"katex-inline\">W_c<\/span> 小的方向推不动。本算例只做传感器侧选点，执行器布置沿同一条件数准则换 <span class=\"katex-inline\">W_c<\/span> 指导。\n<\/ul>\n<h2>对抗性追问：基随参数漂移，旧点位为什么会失效<\/h2>\n<p>训练工况 <span class=\"katex-inline\">\\beta_0<\/span> 下 POD 基 <span class=\"katex-inline\">\\Phi_r(\\beta_0)<\/span> 张成子空间；参数移到 <span class=\"katex-inline\">\\beta_1<\/span>，新快照含 <span class=\"katex-inline\">\\Phi_r(\\beta_0)<\/span> 之外的方向。旧点位在新基空间内的投影列可能近似相关，<span class=\"katex-inline\">\\sigma_{\\min}<\/span> 趋零，条件数重新恶化。判据：在新工况快照上复算 <span class=\"katex-inline\">\\Theta=P\\Phi_r(\\beta_1)<\/span> 的条件数与留出重构误差；若条件数比训练时抬高一个量级以上，说明点位失效。应对方式是多参数快照联合建基后统一选点，或随参数更新点位；DEIM 节点遵循同一规则，必须从非线性项快照基选出，不复用状态传感器位置。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出稀疏测量方程 <span class=\"katex-inline\">y=\\Theta a<\/span> 中 <span class=\"katex-inline\">\\Theta<\/span> 与 <span class=\"katex-inline\">P,\\Phi_r<\/span> 的关系；<span class=\"katex-inline\">p&lt;r<\/span> 为什么不可辨识？\n<\/li><li>\n条件数 <span class=\"katex-inline\">\\kappa(\\Theta)<\/span> 如何放大测量噪声？最小化条件数是哪一类优化问题？\n<\/li><li>\npivoted QR 每一步选列的准则是什么？它近似优化哪个目标？\n<\/li><li>\nDEIM 的插值指标来自状态 POD 基还是非线性项快照基？为什么？\n<\/li><li>\n本算例中最优与最差配对条件数差多少倍？这个差距对重构误差意味着什么？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "传感器/执行器布置与 Gappy POD / DEIM"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：低秩结构：SVD 与 PCA<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：Singular Value Decomposition (SVD) — 低秩近似、PCA 与截断<\/a><br>检查点：能写出 SVD 分解式，说明截断 SVD 为何是 Frobenius 范数下的最优低秩逼近，并用累积能量决定截断阶数<\/li><li class='path-step' id='path-02'><strong>步骤 02：稀疏性：压缩感知与稀疏回归<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 3 章（兼及第 4 章回归部分）：Sparsity and Compressed Sensing 与稀疏回归<\/a><br>检查点：能写出 K-稀疏信号的测量条件（incoherence、RIP、测量数尺度），区分 L1 恢复与 LASSO 回归的目标函数与适用场景<\/li><li class='path-step' id='path-03'><strong>步骤 03：数据驱动动力系统<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 7 章：Data-Driven Dynamical Systems — DMD、Koopman、SINDy 与延迟嵌入<\/a><br>检查点：能从快照矩阵构造 DMD 算子并把特征值对应到增长率与频率，能写出 SINDy 的函数库与稀疏优化目标，说明延迟嵌入解决什么问题<\/li><li class='path-step' id='path-04'><strong>步骤 04：降阶模型与数据驱动控制<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 8、10、11、12 章：数据驱动控制、降阶模型与传感器布置<\/a><br>检查点：能推导 POD-Galerkin 投影方程，写出 LQR 代价函数与 Riccati 反馈结构，说明 MPC 的滚动时域思路与传感器/执行器布置的优化目标<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='svd（singular value decomposition）'>SVD（Singular Value Decomposition） — 任意矩阵 $X=U\\Sigma V^*$ 的酉对角分解，$U,V$ 为酉矩阵，$\\Sigma$ 对角元为非负奇异值并按降序排列（PDF 第 28 页） <span class=glossary-ref>（第 1 章：Singular Value Decomposition (SVD) — 低秩近似、PCA 与截断）<\/span><\/li><li data-term='奇异值（singular value）'>奇异值（singular value） — $\\Sigma$ 对角线上非负、降序排列的 $\\sigma_k$，其个数等于矩阵秩；平方后对应协方差矩阵特征值（PDF 第 28、45 页） <span class=glossary-ref>（第 1 章：Singular Value Decomposition (SVD) — 低秩近似、PCA 与截断）<\/span><\/li><li data-term='pca（principal component analysis）'>PCA（Principal Component Analysis） — 先均值中心化（必要时归一化方差），再对数据矩阵做 SVD/协方差特征分解，得到互不相关、与测量最大相关的主成分方向（PDF 第 44 页） <span class=glossary-ref>（第 1 章：Singular Value Decomposition (SVD) — 低秩近似、PCA 与截断）<\/span><\/li><li data-term='截断与硬阈值（truncation / hard threshold）'>截断与硬阈值（truncation / hard threshold） — 只保留前 $r$ 个主导奇异值与向量；Gavish–Donoho 理论在低秩矩阵加高斯白噪声假设下给出最优阈值 $\\tau=\\lambda(\\beta)\\sqrt{n}\\gamma$（PDF 第 54 页） <span class=glossary-ref>（第 1 章：Singular Value Decomposition (SVD) — 低秩近似、PCA 与截断）<\/span><\/li><li data-term='稀疏性（sparsity）'>稀疏性（sparsity） — 信号在合适基下只有少量非零系数；自然数据在 Fourier、wavelet 或数据自身字典中常可稀疏表示（PDF 第 107 页） <span class=glossary-ref>（第 3 章（兼及第 4 章回归部分）：Sparsity and Compressed Sensing 与稀疏回归）<\/span><\/li><li data-term='rip（restricted isometry property）'>RIP（Restricted Isometry Property） — 测量矩阵与稀疏基的乘积对所有 $K$-稀疏向量近似保距：$(1-\\delta_K)\\|s\\|_2^2\\le\\|\\Theta s\\|_2^2\\le(1+\\delta_K)\\|s\\|_2^2$（PDF 第 120 页） <span class=glossary-ref>（第 3 章（兼及第 4 章回归部分）：Sparsity and Compressed Sensing 与稀疏回归）<\/span><\/li><li data-term='lasso'>LASSO — 带 $\\ell_1$ 惩罚的回归：$x=\\arg\\min\\|Ax-b\\|_2+\\lambda\\|x\\|_1$，$\\ell_1$ 惩罚把部分系数压到零，实现特征选择（PDF 第 124 页） <span class=glossary-ref>（第 3 章（兼及第 4 章回归部分）：Sparsity and Compressed Sensing 与稀疏回归）<\/span><\/li><li data-term='dmd（dynamic mode decomposition）'>DMD（Dynamic Mode Decomposition） — 从成对快照矩阵 $X&#x27;\\approx AX$ 回归最佳拟合线性算子 $A=X&#x27;X^\\dagger$，再取其特征值与模态；每个模态对应增长率与振荡频率（PDF 第 260 页） <span class=glossary-ref>（第 7 章：Data-Driven Dynamical Systems — DMD、Koopman、SINDy 与延迟嵌入）<\/span><\/li><li data-term='koopman 算子'>Koopman 算子 — 1931 年 Koopman 提出的作用在可观测量函数空间上的无穷维线性算子 $\\mathcal{K}_t g(x)=g(F_t(x))$，其谱分解刻画非线性系统行为（PDF 第 280 页） <span class=glossary-ref>（第 7 章：Data-Driven Dynamical Systems — DMD、Koopman、SINDy 与延迟嵌入）<\/span><\/li><li data-term='sindy（sparse identification of nonlinear dynamics）'>SINDy（Sparse Identification of Nonlinear Dynamics） — 先构造候选非线性项函数库 $\\Theta(X)$，再对每行方程做 $\\ell_1$ 稀疏回归 $\\xi_k=\\arg\\min\\|\\dot X_k-\\Theta(X)\\xi&#x27;_k\\|_2+\\lambda\\|\\xi&#x27;_k\\|_1$，挑出活跃项（PDF 第 271 页） <span class=glossary-ref>（第 7 章：Data-Driven Dynamical Systems — DMD、Koopman、SINDy 与延迟嵌入）<\/span><\/li><li data-term='pod（proper orthogonal decomposition）'>POD（Proper Orthogonal Decomposition） — 由快照矩阵 SVD 得到的正交最优模态基，等价于 Hilbert 空间中按能量排序的最优基；在流体力学中称 POD，在统计学中对应 PCA/KLT/EOF（PDF 第 30、397 页） <span class=glossary-ref>（第 8、10、11、12 章：数据驱动控制、降阶模型与传感器布置）<\/span><\/li><li data-term='rom（reduced order model）'>ROM（Reduced Order Model） — 把高维系统投影到 $r\\ll n$ 维 POD 基上得到的低维方程组；POD-Galerkin 投影给出 $\\dot a=\\Phi^TL\\Phi a+\\Phi^TN(\\Phi a,\\beta)$（PDF 第 406 页） <span class=glossary-ref>（第 8、10、11、12 章：数据驱动控制、降阶模型与传感器布置）<\/span><\/li><li data-term='lqr（linear quadratic regulator）'>LQR（Linear Quadratic Regulator） — 全状态可测下最小化 $J=\\int(x^*Qx+u^*Ru)dt$ 的最优反馈 $u=-K_rx$，增益 $K_r$ 由代数 Riccati 方程解出（PDF 第 316–317 页） <span class=glossary-ref>（第 8、10、11、12 章：数据驱动控制、降阶模型与传感器布置）<\/span><\/li><li data-term='mpc（model predictive control）'>MPC（Model Predictive Control） — 在滚动时域上反复求解带约束的最优控制问题，利用辨识得到的模型（如 eDMD、SINDYc）预测未来状态并迭代优化作动输入（PDF 第 373 页） <span class=glossary-ref>（第 8、10、11、12 章：数据驱动控制、降阶模型与传感器布置）<\/span><\/li><li data-term='deim（discrete empirical interpolation method）'>DEIM（Discrete Empirical Interpolation Method） — 在 POD 低维近似上再选少量插值节点逼近非线性项，把非线性求值留在低维空间，避免每次都回到原始 $n$ 维（PDF 第 427 页） <span class=glossary-ref>（第 8、10、11、12 章：数据驱动控制、降阶模型与传感器布置）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库<\/h1>\n<h2>模式 1：先分解降秩，再在低维上做回归/投影<\/h2>\n<p>拿到高维快照矩阵，第一步永远是 SVD 看奇异值谱：先定有效秩 <span class=\"katex-inline\">r<\/span>，把数据压到 POD 坐标，再在 <span class=\"katex-inline\">r<\/span> 维上回归时间算子（DMD）、投影方程（POD-Galerkin）或选传感器。直接在 <span class=\"katex-inline\">n<\/span> 维上构造算子或求逆，计算量随维数立方增长，且噪声方向会进入模型。秩选择结合能量占比、噪声硬阈值与留出预测误差，不单看奇异值大小。<\/p>\n<h2>模式 2：稀疏性假设先选基，再谈少测量<\/h2>\n<p>压缩感知与稀疏回归都要求信号在某个基下系数少：先确认基（Fourier、wavelet、数据字典、多项式库）覆盖真实结构，再用 <span class=\"katex-inline\">\\ell_1<\/span> 压稀疏。基选错，信号稠密，少测量与特征选择都失效；库的覆盖范围决定方法能力上限，稀疏化不能在库外发明结构。<\/p>\n<h2>模式 3：区分欠定恢复与超定拟合两种 <span class=\"katex-inline\">\\ell_1<\/span> 设定<\/h2>\n<p>欠定、无噪声场景用等式约束 <span class=\"katex-inline\">\\Theta s=y<\/span>，恢复保证靠 RIP 与 incoherence；超定、有噪声场景用残差加惩罚 <span class=\"katex-inline\">\\|Ax-b\\|_2+\\lambda\\|x\\|_1<\/span>，复杂度靠交叉验证选 <span class=\"katex-inline\">\\lambda<\/span>。两者共用 <span class=\"katex-inline\">\\ell_1<\/span> 几何，但条件、准则与失败模式不同；把压缩感知的恢复保证搬到 LASSO 上，或反过来，都是概念错位。<\/p>\n<h2>模式 4：数据驱动模型先标清逼近的是谁<\/h2>\n<p>DMD 拟合的是直接测量子空间上的最佳线性算子，不是状态空间里的非线性方程；Koopman 算子推进可观测量，有限维矩阵只是逼近。写结论时区分：模型是线性回归、本征函数逼近还是方程项辨识；谱是有限样本拟合还是系统内禀谱。带作动的数据必须把输入并入回归（DMDc/SINDYc），否则内部动力学与作动效应混淆。<\/p>\n<h2>模式 5：降阶模型的可信度边界等于快照覆盖范围<\/h2>\n<p>POD 基、ROM 方程、传感器点位都从训练快照构造；未访问的工况、参数与模态不在基内，外推误差随距离增大。交付低维模型时同时交代：覆盖了哪些初值/参数范围、截断阶数、非线性项是否超降阶；超出范围需要补快照、在线校正或参数插值。<\/p>\n<h2>模式 6：控制设计先权衡代价，再处理约束<\/h2>\n<p>LQR 在二次代价下求常增益最优，<span class=\"katex-inline\">Q/R<\/span> 权重反映工程偏好；硬约束（饱和、速率、禁区）不在二次代价里，需要 MPC 滚动优化显式处理。高维系统先降阶再上控制器，Riccati 与 MPC 在线成本都随状态维数增长。模型偏差要留鲁棒余量，并用闭环数据持续更新辨识模型。<\/p>\n<h2>模式 7：空间选点与时间嵌入互补补全测量<\/h2>\n<p>状态信息不足时，空间方向用传感器布置（QR 主元、条件数准则）挑位置，时间方向用延迟嵌入（Hankel 矩阵）取历史窗。两组方法都服务于让低维系数可辨识；点位按当前基优化，基更新后点位要重选。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 SVD<\/strong>：任意矩阵 <span class=\"katex-inline\">X=U\\Sigma V^*<\/span>；截断 SVD 是 Frobenius 最优秩-<span class=\"katex-inline\">r<\/span> 逼近；PCA 是中心化后 SVD（PDF 第 26–69 页）。\n<\/li><li>\n<strong>第 3 章（兼第 4 章）稀疏性<\/strong>：<span class=\"katex-inline\">x=\\Psi s<\/span>，<span class=\"katex-inline\">y=\\Theta s<\/span>；incoherence + RIP + <span class=\"katex-inline\">p\\sim k_1K\\log(n/K)<\/span> 保证 <span class=\"katex-inline\">\\ell_1<\/span> 恢复；LASSO 在超定回归里选变量（PDF 第 107–176 页）。\n<\/li><li>\n<strong>第 7 章数据驱动动力系统<\/strong>：DMD 回归 <span class=\"katex-inline\">X&#x27;\\approx AX<\/span>；Koopman 推进可观测量；SINDy 库内稀疏选方程项；Hankel 延迟嵌入（PDF 第 252–298 页）。\n<\/li><li>\n<strong>第 8/10/11/12 章控制与降阶<\/strong>：POD-Galerkin 投影低维方程；LQR 二次代价 + Riccati 反馈；MPC 滚动时域；QR/DEIM 稀疏选点（PDF 第 299–457 页）。\n<\/ul>\n<h2>核心公式速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>主题<\/th><th>公式<\/th><th>页码<\/th><\/tr><\/thead><tbody><tr><td>SVD<\/td><td><span class=\"katex-inline\">X=U\\Sigma V^*<\/span>，<span class=\"katex-inline\">\\sigma_1\\ge\\cdots\\ge0<\/span><\/td><td>28<\/td><\/tr><tr><td>低秩截断<\/td><td><span class=\"katex-inline\">\\tilde X=\\sum_{k=1}^r\\sigma_ku_kv_k^*<\/span>，残差 <span class=\"katex-inline\">\\sum_{k&gt;r}\\sigma_k^2<\/span><\/td><td>31<\/td><\/tr><tr><td>PCA 协方差<\/td><td><span class=\"katex-inline\">C=\\frac{1}{n-1}B^*B<\/span>，主成分方差 <span class=\"katex-inline\">\\sigma_k^2<\/span><\/td><td>45<\/td><\/tr><tr><td>能量占比<\/td><td><span class=\"katex-inline\">E_r=\\sum_{k=1}^r\\sigma_k^2/\\sum_k\\sigma_k^2<\/span><\/td><td>55<\/td><\/tr><tr><td>测量方程<\/td><td><span class=\"katex-inline\">y=Cx=\\Theta s<\/span>，<span class=\"katex-inline\">\\Theta=C\\Psi<\/span><\/td><td>113<\/td><\/tr><tr><td>incoherence<\/td><td><span class=\"katex-inline\">\\mu(C,\\Psi)=\\sqrt n\\max_{j,k}\\|\\langle c_k,\\psi_j\\rangle\\|<\/span><\/td><td>120<\/td><\/tr><tr><td>RIP<\/td><td><span class=\"katex-inline\">(1-\\delta_K)\\|s\\|_2^2\\le\\|\\Theta s\\|_2^2\\le(1+\\delta_K)\\|s\\|_2^2<\/span><\/td><td>120<\/td><\/tr><tr><td>LASSO<\/td><td><span class=\"katex-inline\">\\arg\\min_x\\|Ax-b\\|_2+\\lambda\\|x\\|_1<\/span><\/td><td>124<\/td><\/tr><tr><td>DMD 回归<\/td><td><span class=\"katex-inline\">A=X&#x27;X^\\dagger<\/span>，<span class=\"katex-inline\">\\tilde A=\\tilde U^*X&#x27;\\tilde V\\tilde\\Sigma^{-1}<\/span><\/td><td>260–261<\/td><\/tr><tr><td>谱换算<\/td><td><span class=\"katex-inline\">s=\\ln\\lambda/\\Delta t<\/span>，增长率 <span class=\"katex-inline\">\\ln\\|\\lambda\\|/\\Delta t<\/span>，频率 <span class=\"katex-inline\">\\arg\\lambda/\\Delta t<\/span><\/td><td>259<\/td><\/tr><tr><td>SINDy<\/td><td><span class=\"katex-inline\">\\xi_k=\\arg\\min\\|\\dot X_k-\\Theta(X)\\xi&#x27;_k\\|_2+\\lambda\\|\\xi&#x27;_k\\|_1<\/span><\/td><td>271<\/td><\/tr><tr><td>Koopman<\/td><td><span class=\"katex-inline\">\\mathcal{K}_tg(x)=g(F_t(x))<\/span><\/td><td>280<\/td><\/tr><tr><td>ROM 投影<\/td><td><span class=\"katex-inline\">\\dot a=\\Phi^TL\\Phi a+\\Phi^TN(\\Phi a,\\beta)<\/span><\/td><td>406<\/td><\/tr><tr><td>LQR 代价<\/td><td><span class=\"katex-inline\">J=\\int(x^<em>Qx+u^<\/em>Ru)dt<\/span>，<span class=\"katex-inline\">u=-K_rx<\/span>，<span class=\"katex-inline\">K_r=R^{-1}B^*P<\/span><\/td><td>316–317<\/td><\/tr><tr><td>Riccati<\/td><td><span class=\"katex-inline\">A^<em>P+PA-PBR^{-1}B^<\/em>P+Q=0<\/span><\/td><td>318<\/td><\/tr><tr><td>稀疏测量<\/td><td><span class=\"katex-inline\">\\tilde u=Pu<\/span>，<span class=\"katex-inline\">a=\\Theta^\\dagger y<\/span>，<span class=\"katex-inline\">\\Theta=P\\Phi_r<\/span><\/td><td>427<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>方法-适用场景对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>方法<\/th><th>解决的问题<\/th><th>关键前提<\/th><th>失败信号<\/th><\/tr><\/thead><tbody><tr><td>截断 SVD<\/td><td>高维矩阵低秩压缩<\/td><td>数据近低秩、噪声模型明确<\/td><td>秩虚高、错位行波<\/td><\/tr><tr><td>PCA<\/td><td>找正交方差方向<\/td><td>线性结构、量纲可比<\/td><td>流形弯曲、方差方向无判别性<\/td><\/tr><tr><td>压缩感知<\/td><td>少测量恢复稀疏系数<\/td><td>信号稀疏、测量不相干、<span class=\"katex-inline\">p<\/span> 够<\/td><td>相干测量、信号稠密<\/td><\/tr><tr><td>LASSO<\/td><td>超定回归选变量<\/td><td>真模型稀疏、样本充足<\/td><td>相关变量组、小样本弱效应<\/td><\/tr><tr><td>DMD<\/td><td>数据驱动模态与谱<\/td><td>快照对齐、秩选择合理<\/td><td>带输入未分离、连续谱<\/td><\/tr><tr><td>SINDy<\/td><td>辨识方程右端项<\/td><td>库覆盖真实项、导数质量好<\/td><td>库缺项、微分噪声大<\/td><\/tr><tr><td>POD-Galerkin<\/td><td>高维方程降阶仿真<\/td><td>快照覆盖工况<\/td><td>工况外推、非线性未超降阶<\/td><\/tr><tr><td>LQR<\/td><td>二次代价最优反馈<\/td><td>可控、全状态可测<\/td><td>约束饱和、模型偏差<\/td><\/tr><tr><td>MPC<\/td><td>带约束滚动控制<\/td><td>预测模型可信、在线可解<\/td><td>模型失真、维数过高<\/td><\/tr><tr><td>DEIM/Gappy<\/td><td>非线性项与状态稀疏重构<\/td><td>基已知、节点匹配结构<\/td><td>节点扎堆、基过时<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>复杂度口径<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>步骤<\/th><th>量级<\/th><th>出处<\/th><\/tr><\/thead><tbody><tr><td>稠密 SVD<\/td><td><span class=\"katex-inline\">O(mn\\min(m,n))<\/span><\/td><td>29、42<\/td><\/tr><tr><td>随机 SVD<\/td><td><span class=\"katex-inline\">O(mn\\log r)<\/span><\/td><td>60<\/td><\/tr><tr><td>对角伪逆求逆<\/td><td><span class=\"katex-inline\">O(n)<\/span>；乘转置 <span class=\"katex-inline\">O(n^2)<\/span>；对比稠密求逆 <span class=\"katex-inline\">O(n^3)<\/span><\/td><td>42<\/td><\/tr><tr><td>LASSO 坐标下降<\/td><td>每轮 <span class=\"katex-inline\">O(n)<\/span> 坐标更新，迭代随路径长度增长<\/td><td>124<\/td><\/tr><tr><td>DMD<\/td><td>一次 SVD 主导，小矩阵分解 <span class=\"katex-inline\">O(r^3)<\/span><\/td><td>261<\/td><\/tr><tr><td>Riccati 求解<\/td><td><span class=\"katex-inline\">O(n^3)<\/span><\/td><td>317<\/td><\/tr><\/tbody><\/table><\/div>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/Data-Driven-Science-and-Engineering-Mach-12", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：Singular Value Decomposition (SVD) — 低秩近似、PCA 与截断", "href": "#/chapter/ch01"}, {"label": "第 3 章（兼及第 4 章回归部分）：Sparsity and Compressed Sensing 与稀疏回归", "href": "#/chapter/ch02"}, {"label": "第 7 章：Data-Driven Dynamical Systems — DMD、Koopman、SINDy 与延迟嵌入", "href": "#/chapter/ch03"}, {"label": "第 8、10、11、12 章：数据驱动控制、降阶模型与传感器布置", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "SVD 与最优低秩近似", "href": "#/concept/c01"}, {"label": "PCA 与能量/方差解释", "href": "#/concept/c02"}, {"label": "压缩感知：incoherence、RIP 与 L1 恢复", "href": "#/concept/c03"}, {"label": "稀疏回归（LASSO）与正则化路径", "href": "#/concept/c04"}, {"label": "DMD 与 Koopman 算子", "href": "#/concept/c05"}, {"label": "SINDy：函数库与稀疏化", "href": "#/concept/c06"}, {"label": "延迟嵌入与 Hankel 矩阵（HAVOK）", "href": "#/concept/c07"}, {"label": "POD-Galerkin 降阶模型（ROM）", "href": "#/concept/c08"}, {"label": "LQR 与 Model Predictive Control (MPC)", "href": "#/concept/c09"}, {"label": "传感器/执行器布置与 Gappy POD / DEIM", "href": "#/concept/c10"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：Singular Value Decomposition (SVD) — 低秩近似、PCA 与截断", "href": "#/quiz/ch01"}, {"label": "测验：第 3 章（兼及第 4 章回归部分）：Sparsity and Compressed Sensing 与稀疏回归", "href": "#/quiz/ch02"}, {"label": "测验：第 7 章：Data-Driven Dynamical Systems — DMD、Koopman、SINDy 与延迟嵌入", "href": "#/quiz/ch03"}, {"label": "测验：第 8、10、11、12 章：数据驱动控制、降阶模型与传感器布置", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：Data-Driven Science and Engineering: Machine Learning, Dynamical Systems, and Control · p.26<\/div><h1>第 1 章：Singular Value Decomposition (SVD) — 低秩近似、PCA 与截断<\/h1>\n<ul><li>\n<strong>对应原书<\/strong>：第 1 章 Singular Value Decomposition (SVD)（PDF 第 26–69 页）；第 2 章 Fourier/Wavelet 变换作为稀疏基背景，在第 3 章引用\n<\/li><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：矩阵乘法、正交矩阵、特征值与特征向量、Frobenius 范数\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 SVD 分解式 <span class=\"katex-inline\">X=U\\Sigma V^*<\/span>，说清 <span class=\"katex-inline\">U,V,\\Sigma<\/span> 各自身份、维数与正交性；\n<\/li><li>\n解释 Eckart–Young 定理：为什么保留前 <span class=\"katex-inline\">r<\/span> 个奇异值的截断 SVD 是 Frobenius 范数下最优的秩-<span class=\"katex-inline\">r<\/span> 逼近；\n<\/li><li>\n把 PCA 写成均值中心化后的 SVD，用奇异值平方（累积能量）决定截断阶数；\n<\/li><li>\n说出 SVD 伪逆、去噪、随机 SVD 与 RPCA 各自解决什么问题，以及数据未对齐时秩为何被人为抬高。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>高维观测矩阵虽然维度巨大，自然数据却常落在低维子空间里；SVD 把这种低秩结构按能量从大到小一层层拆开，是全书后续所有降维、回归、模态辨识与降阶模型的地基。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>数据矩阵的摆放<\/h3>\n<p>本书把一组测量排成矩阵 <span class=\"katex-inline\">X\\in\\mathbb{C}^{n\\times m}<\/span>：列 <span class=\"katex-inline\">x_k<\/span> 是一次快照（snapshot），可以是一张展平的图像、某一时刻的流体速度场、一组神经记录；<span class=\"katex-inline\">n<\/span> 是状态维度，<span class=\"katex-inline\">m<\/span> 是快照数。很多科学与工程系统 <span class=\"katex-inline\">n\\gg m<\/span>，形成高瘦矩阵；另一类情形 <span class=\"katex-inline\">n\\ll m<\/span>，形成矮胖矩阵（PDF 第 27–28 页）。<\/p>\n<p>高维不等于信息丰富。图像有几百万像素，可相关的自然图像在整个像素空间里只占极小一片区域；大气、车辆尾流这类流体系统即使离散化后自由度以百万计，真正主导行为的是少数相干结构，例如周期脱落的涡街（PDF 第 27 页）。SVD 提供一条纯数据驱动的途径，从快照本身找出这些主导模式，不依赖专家先验。<\/p>\n<h3>SVD 分解式<\/h3>\n<p>对任意复矩阵 <span class=\"katex-inline\">X\\in\\mathbb{C}^{n\\times m}<\/span>，分解都存在（特征值分解只对正规矩阵保证存在，SVD 没有这个限制）：<\/p>\n<div class=\"katex-block\">X=U\\Sigma V^*<\/div>\n<p>其中 <span class=\"katex-inline\">U\\in\\mathbb{C}^{n\\times n}<\/span>、<span class=\"katex-inline\">V\\in\\mathbb{C}^{m\\times m}<\/span> 是酉矩阵，列向量两两正交；<span class=\"katex-inline\">\\Sigma\\in\\mathbb{R}^{n\\times m}<\/span> 对角元为非负实数、按从大到小排列，其余位置为零；<span class=\"katex-inline\"><em><\/span> 表示共轭转置。<span class=\"katex-inline\">U<\/span> 的列叫左奇异向量，<span class=\"katex-inline\">V<\/span> 的列叫右奇异向量，<span class=\"katex-inline\">\\Sigma<\/span> 对角元叫奇异值 <span class=\"katex-inline\">\\sigma_k<\/span>，矩阵秩等于非零奇异值个数（PDF 第 28 页）。当 <span class=\"katex-inline\">n\\ge m<\/span> 时可用经济尺寸 SVD（economy SVD）<span class=\"katex-inline\">X=\\hat U\\hat\\Sigma V^<\/em><\/span>，只保留非零块，避免构造多余的零列（PDF 第 28 页）。<\/p>\n<h3>从 SVD 到低秩近似<\/h3>\n<p>把 <span class=\"katex-inline\">\\Sigma<\/span> 截断到前 <span class=\"katex-inline\">r<\/span> 个对角元，得到秩-<span class=\"katex-inline\">r<\/span> 近似<\/p>\n<div class=\"katex-block\">\\tilde X=\\tilde U\\tilde\\Sigma\\tilde V^*=\\sum_{k=1}^{r}\\sigma_k u_kv_k^*<\/div>\n<p>这是 dyadic summation（并矢求和）：每一项 <span class=\"katex-inline\">\\sigma_k u_kv_k^*<\/span> 本身是一个秩-1 矩阵，近似矩阵由 <span class=\"katex-inline\">r<\/span> 个秩-1 矩阵相加得到（PDF 第 31 页）。Schmidt 在 Gram–Schmidt 工作中把 SVD 推广到函数空间并建立逼近定理，Eckart 与 Young 后来重新发现该结论，即 Eckart–Young 定理：在最小二乘意义下，截断 SVD 是对 <span class=\"katex-inline\">X<\/span> 的最优秩-<span class=\"katex-inline\">r<\/span> 逼近（PDF 第 30 页）。<\/p>\n<h3>PCA 在 SVD 之上多做了一步预处理<\/h3>\n<p>PCA 与 SVD 的差别主要在数据预处理：先按行（或按列，依文献约定）减去均值 <span class=\"katex-inline\">\\bar x_j=\\frac1n\\sum_i X_{ij}<\/span>，得到中心化矩阵 <span class=\"katex-inline\">B=X-\\bar X<\/span>，再做分解。协方差矩阵 <span class=\"katex-inline\">C=\\frac{1}{n-1}B^<em>B<\/span> 的特征值就是奇异值的平方，第一主成分 <span class=\"katex-inline\">u_1=\\arg\\max_{\\|u_1\\|=1}u_1^<\/em>B^<em>Bu_1<\/span>，即 <span class=\"katex-inline\">B^<\/em>B<\/span> 最大特征值对应的特征向量（PDF 第 44–45 页）。本书提到该理论由 Pearson 于 1901 年提出，Hotelling 在 1930 年代独立发展（PDF 第 44 页）。<\/p>\n<h2>推演一：Eckart–Young 定理的逐步推导<\/h2>\n<p>下面在 Frobenius 范数下推：截断 SVD 给出所有秩-<span class=\"katex-inline\">r<\/span> 矩阵中对 <span class=\"katex-inline\">X<\/span> 误差最小的一个。<\/p>\n<p><strong>前提 A<\/strong>：<span class=\"katex-inline\">X<\/span> 的完整 SVD 为 <span class=\"katex-inline\">X=U\\Sigma V^*<\/span>，奇异值 <span class=\"katex-inline\">\\sigma_1\\ge\\sigma_2\\ge\\cdots\\ge\\sigma_{\\min(n,m)}\\ge0<\/span>。 <strong>前提 B<\/strong>：比较的候选矩阵 <span class=\"katex-inline\">Y<\/span> 满足 <span class=\"katex-inline\">\\operatorname{rank}(Y)\\le r<\/span>，误差度量为 <span class=\"katex-inline\">\\|X-Y\\|_F^2=\\sum_{ij}|X_{ij}-Y_{ij}|^2<\/span>。<\/p>\n<ul><li>\n第一步，利用酉变换不改变 Frobenius 范数。令 <span class=\"katex-inline\">Y=U^*ZV<\/span>，由 <span class=\"katex-inline\">U,V<\/span> 酉正交可得 <span class=\"katex-inline\">\\|X-Y\\|_F=\\|\\Sigma-Z\\|_F<\/span>。这一步依据的是 Frobenius 范数在左乘、右乘酉矩阵下不变：<span class=\"katex-inline\">\\|UA\\|_F=\\|A\\|_F<\/span>，<span class=\"katex-inline\">\\|AV\\|_F=\\|A\\|_F<\/span>。\n<\/li><li>\n第二步，秩在酉变换下保持：<span class=\"katex-inline\">\\operatorname{rank}(Y)=\\operatorname{rank}(Z)<\/span>，所以 <span class=\"katex-inline\">Z<\/span> 也是秩不超过 <span class=\"katex-inline\">r<\/span> 的矩阵。问题转化为在所有秩 <span class=\"katex-inline\">\\le r<\/span> 的 <span class=\"katex-inline\">Z<\/span> 中，最小化 <span class=\"katex-inline\">\\|\\Sigma-Z\\|_F^2<\/span>。\n<\/li><li>\n第三步，<span class=\"katex-inline\">\\Sigma<\/span> 是对角矩阵。展开平方误差：<span class=\"katex-inline\">\\|\\Sigma-Z\\|_F^2=\\sum_i(\\sigma_i-Z_{ii})^2+\\sum_{i\\ne j}|Z_{ij}|^2<\/span>。非对角项 <span class=\"katex-inline\">Z_{ij}<\/span> 只出现在误差里、不进入对角近似，最优时全部取零；对角位上，秩-<span class=\"katex-inline\">r<\/span> 矩阵至多有 <span class=\"katex-inline\">r<\/span> 个非零对角元，把它们放在 <span class=\"katex-inline\">\\sigma_1,\\dots,\\sigma_r<\/span> 这 <span class=\"katex-inline\">r<\/span> 个最大位置上、且取 <span class=\"katex-inline\">Z_{ii}=\\sigma_i<\/span>，后 <span class=\"katex-inline\">r<\/span> 个对角位置取零，损失最小。\n<\/li><li>\n第四步，剩余误差 <span class=\"katex-inline\">\\|X-\\tilde X\\|_F^2=\\sum_{k=r+1}^{\\min(n,m)}\\sigma_k^2<\/span>。也就是说，最优秩-<span class=\"katex-inline\">r<\/span> 逼近的残差能量恰好等于被丢弃奇异值的平方和；这把&quot;截断后还剩多少误差&quot;变成了可直接从奇异值谱上读出的量。\n<\/ul>\n<p>推导保留的限定：定理在 Frobenius 范数（以及谱范数 <span class=\"katex-inline\">\\|\\cdot\\|_2<\/span>）下成立；换一种误差度量，最优性结论不能直接搬用。若 <span class=\"katex-inline\">X<\/span> 本身秩低于 <span class=\"katex-inline\">r<\/span>，尾部奇异值为零，截断仍是精确分解（PDF 第 31 页）。<\/p>\n<h2>推演二：从快照到主成分与能量占比<\/h2>\n<p><strong>前提 C<\/strong>：<span class=\"katex-inline\">m<\/span> 次测量排成矩阵，每行一次实验；先中心化，再分解。<\/p>\n<ul><li>\n第一步，算行均值 <span class=\"katex-inline\">\\bar x_j=\\frac1n\\sum_{i=1}^n X_{ij}<\/span>，构造均值矩阵 <span class=\"katex-inline\">\\bar X<\/span>，中心化 <span class=\"katex-inline\">B=X-\\bar X<\/span>（PDF 第 44 页公式 1.24–1.26）。\n<\/li><li>\n第二步，协方差矩阵 <span class=\"katex-inline\">C=\\frac{1}{n-1}B^*B<\/span>。<span class=\"katex-inline\">C<\/span> 是 Hermitian 矩阵，特征分解 <span class=\"katex-inline\">CV=VD<\/span> 必然存在；<span class=\"katex-inline\">D<\/span> 的对角元是主成分方差，等于奇异值平方（PDF 第 45 页公式 1.27–1.29）。\n<\/li><li>\n第三步，第一主成分方向取 <span class=\"katex-inline\">\\arg\\max_{\\|u_1\\|=1}u_1^<em>B^<\/em>Bu_1<\/span>，即 <span class=\"katex-inline\">B^*B<\/span> 最大特征值对应特征向量；它同时是 <span class=\"katex-inline\">B<\/span> 的最大左奇异向量。第 <span class=\"katex-inline\">k<\/span> 个主成分方差为 <span class=\"katex-inline\">\\sigma_k^2<\/span>。\n<\/li><li>\n第四步，前 <span class=\"katex-inline\">r<\/span> 个模态解释的能量占比为\n<\/ul>\n<div class=\"katex-block\">E_r=\\frac{\\sum_{k=1}^{r}\\sigma_k^2}{\\sum_{k=1}^{\\min(n,m)}\\sigma_k^2}<\/div>\n<p>工程上常取 <span class=\"katex-inline\">E_r=90\\%<\/span> 或 <span class=\"katex-inline\">99\\%<\/span> 作为截断准则（PDF 第 53 页附近）。本章噪声高斯数据示例中，数据在 <span class=\"katex-inline\">x,y<\/span> 方向缩放为 <span class=\"katex-inline\">2<\/span> 与 <span class=\"katex-inline\">0.5<\/span>，SVD 算出的归一化奇异值为 <span class=\"katex-inline\">1.974<\/span> 与 <span class=\"katex-inline\">0.503<\/span>，与缩放比例吻合（PDF 第 46 页 Table 1.1）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[快照矩阵 X n×m] --&gt; B[均值中心化 B]\nB --&gt; C[SVD: B=UΣV*]\nC --&gt; D[奇异值谱 σk]\nD --&gt; E{截断阶数 r}\nE --&gt;|能量准则 90%/99%| F[POD/PCA 模态基 Ũ]\nE --&gt;|硬阈值 Gavish-Donoho| F\nF --&gt; G[低秩近似 X̃=ŨΣ̃Ṽ*]\nC --&gt; H[伪逆 X†=ṼΣ̃⁻¹Ũ*]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>推演三：SVD 的计算与复杂度口径<\/h2>\n<p>标准 SVD 实现成熟，多数语言直接调用接口即可；底层实现多基于 LAPACK，SVD 例程为 DGESVD，被 Armadillo、Eigen 等 C++ 库封装（PDF 第 29 页）。<\/p>\n<ul><li>\n对 <span class=\"katex-inline\">m\\times n<\/span> 矩阵，稠密 SVD 的浮点运算量级为 <span class=\"katex-inline\">O(mn\\min(m,n))<\/span>：经济尺寸分解只算前 <span class=\"katex-inline\">\\min(m,n)<\/span> 个奇异向量，避免构造满尺寸 <span class=\"katex-inline\">U<\/span> 或 <span class=\"katex-inline\">V<\/span>。\n<\/li><li>\n伪逆构造中，乘以转置矩阵是 <span class=\"katex-inline\">O(n^2)<\/span> 操作；<span class=\"katex-inline\">\\tilde\\Sigma^{-1}<\/span> 是对角阵求逆，只需 <span class=\"katex-inline\">O(n)<\/span>；对比稠密方阵求逆的 <span class=\"katex-inline\">O(n^3)<\/span>，用截断 SVD 求伪逆在高瘦/矮胖矩阵上更省（PDF 第 40 页）。\n<\/li><li>\n当矩阵确有低秩结构时，randomized SVD 用随机投影先把矩阵投到 <span class=\"katex-inline\">r+p<\/span> 维子空间再分解，把代价压到 <span class=\"katex-inline\">O(mn\\log r)<\/span> 量级（PDF 第 60 页，1.8 节）。\n<\/ul>\n<h2>反事实分析：改掉条件后低秩近似会怎样<\/h2>\n<ol><li>\n<strong>数据含噪声且秩估计错<\/strong>。本书假设 <span class=\"katex-inline\">X=X_{\\text{true}}+\\gamma X_{\\text{noise}}<\/span>，<span class=\"katex-inline\">X_{\\text{noise}}<\/span> 元素为独立同分布零均值单位方差高斯白噪声（PDF 第 54 页公式 1.30）。若把噪声奇异值也当成结构模态保留，近似矩阵会把噪声一起写进低维模型；若把真实小信号模态连同噪声一起切掉，模型丢失真实慢过程。Gavish–Donoho 硬阈值在该噪声假设下给出 <span class=\"katex-inline\">\\tau=(4/\\sqrt3)\\sqrt n\\gamma<\/span>（方阵）或 <span class=\"katex-inline\">\\tau=\\lambda(\\beta)\\sqrt n\\gamma<\/span>（矩形，<span class=\"katex-inline\">\\beta=m/n<\/span>）（PDF 第 54 页公式 1.31–1.32）。反事实推演：噪声假设从高斯白噪声换成重尾脉冲噪声时，阈值公式不再直接适用，需要先用 RPCA 把稀疏大扰动分离出去。\n<\/li><li>\n<strong>数据未对齐<\/strong>。SVD 依赖行列之间可分离变量；遇到行波、平移或旋转后错位的数据，同一物理结构在不同快照里位置不同，相关矩阵把&quot;位置不同&quot;也算成新模态，造成人为秩膨胀（PDF 第 54、419 页）。反事实推演：若先做配准或在带对称性的模态空间里组织快照，同一结构贡献的奇异值会合并，所需截断阶数下降。\n<\/li><li>\n<strong>把截断基的正交关系误写<\/strong>。截断后 <span class=\"katex-inline\">\\tilde U^<em>\\tilde U=I_{r\\times r}<\/span> 仍成立，但 <span class=\"katex-inline\">\\tilde U\\tilde U^<\/em>\\ne I_{n\\times n}<\/span>；把后者当成恒等矩阵是 SVD 最常见的误用之一（PDF 第 44 页）。反事实推演：若在投影回高维空间时误用 <span class=\"katex-inline\">\\tilde U\\tilde U^*=I<\/span>，重构与伪逆计算都会出现分量丢失。\n<\/ol>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章是 Part I 的地基：第 2 章 Fourier/Wavelet 提供稀疏基视角，解释信号在什么坐标系下系数变少；第 3 章的压缩感知与稀疏回归把&quot;少量系数&quot;这一假设落到测量与优化上。第 7 章 DMD 先用 SVD 做空间降秩再回归时间算子；第 11 章 POD 本质是快照 SVD 在 PDE 场数据上的版本；第 12 章传感器布置与超降阶再建立在 POD 基的条件数之上。读后续章节时，每个方法用到的&quot;主导模态&quot;都可以回溯到本章的奇异值谱。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为 SVD 就是特征值分解。SVD 对任意矩阵保证存在；特征值分解只对可对角化矩阵成立，且非对称矩阵的特征向量不必正交。协方差矩阵 <span class=\"katex-inline\">B^*B<\/span> 的特征分解与 SVD 同源，但两者不是一回事。\n<\/li><li>\n以为奇异值越小的模态越没用。小奇异值可能对应弱而真实的慢过程；截断准则要结合噪声水平与下游任务（预测、控制）判断，不能只看数值大小。\n<\/li><li>\n以为主成分是&quot;原始变量中最重要的几个&quot;。主成分是正交线性组合方向，载荷可能分散在多个原始变量上，选主成分不等于删原始变量。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">X=U\\Sigma V^*<\/span> 中三个矩阵的维数与正交性要求，并说明秩与非零奇异值个数的关系。（答案：见本章&quot;SVD 分解式&quot;，PDF 第 28 页。）\n<\/li><li>\n秩-<span class=\"katex-inline\">r<\/span> 截断的 Frobenius 残差能量由哪部分奇异值决定？（答案：<span class=\"katex-inline\">\\sum_{k=r+1}^{\\min(n,m)}\\sigma_k^2<\/span>，见推演一第四步。）\n<\/li><li>\nPCA 相对原始 SVD 多做了哪一步预处理？主成分方差与奇异值是什么关系？（答案：均值中心化（必要时方差归一化）；主成分方差为 <span class=\"katex-inline\">\\sigma_k^2<\/span>，PDF 第 44–45 页。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nSVD 对任意矩阵存在；<span class=\"katex-inline\">U,V<\/span> 酉正交，<span class=\"katex-inline\">\\Sigma<\/span> 对角元非负降序。\n<\/li><li>\nEckart–Young：截断 SVD 是 Frobenius（与谱）范数下最优秩-<span class=\"katex-inline\">r<\/span> 逼近，残差为尾部奇异值平方和。\n<\/li><li>\nPCA = 中心化后 SVD；能量占比 <span class=\"katex-inline\">E_r<\/span> 决定截断阶数。\n<\/li><li>\n截断基只满足 <span class=\"katex-inline\">\\tilde U^<em>\\tilde U=I<\/span>，不满足 <span class=\"katex-inline\">\\tilde U\\tilde U^<\/em>=I<\/span>。\n<\/li><li>\n噪声模型、数据对齐方式与任务目标共同决定 <span class=\"katex-inline\">r<\/span>；随机 SVD 用于低秩大矩阵的近似分解。\n<\/ul>", "ch02": "<div class=\"source-badge\">📖 出处：Data-Driven Science and Engineering: Machine Learning, Dynamical Systems, and Control · p.107<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：Singular Value Decomposition (SVD) — 低秩近似、PCA 与截断<\/a><\/span><\/div><h1>第 3 章（兼及第 4 章回归部分）：Sparsity and Compressed Sensing 与稀疏回归<\/h1>\n<ul><li>\n<strong>对应原书<\/strong>：第 3 章 Sparsity and Compressed Sensing（PDF 第 107–139 页）；第 4 章 Regression and Model Selection 中的正则化与交叉验证部分（PDF 第 140–153 页）\n<\/li><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章 SVD 与低秩近似；向量范数、欠定/超定线性方程组\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出信号的稀疏表示 <span class=\"katex-inline\">x=\\Psi s<\/span> 与测量方程 <span class=\"katex-inline\">y=Cx=\\Theta s<\/span>，说清稀疏性为什么是压缩感知的前提；\n<\/li><li>\n解释 incoherence 度量 <span class=\"katex-inline\">\\mu(C,\\Psi)<\/span>、RIP 不等式与测量数尺度 <span class=\"katex-inline\">p\\sim k_1K\\log(n/K)<\/span>；\n<\/li><li>\n区分 <span class=\"katex-inline\">\\ell_0<\/span> 组合搜索、<span class=\"katex-inline\">\\ell_1<\/span> 凸松弛恢复与 LASSO 回归三种问题，写出各自目标函数；\n<\/li><li>\n说明 RPCA 如何把低秩背景与稀疏扰动分离，以及坏测量矩阵在什么条件下让信号完全不可见。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>自然数据在合适基下只有少量活跃系数；压缩感知研究&quot;测量要满足什么条件，才能用比 Nyquist 少得多的观测把这少量系数恢复出来&quot;，稀疏回归则把同一 <span class=\"katex-inline\">\\ell_1<\/span> 工具搬到带噪声、超定的拟合问题上做特征选择。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>稀疏表示从哪里来<\/h3>\n<p>本书第 3 章开篇指出：自然数据表现出内在结构，意味着在合适坐标系下 admitting a sparse representation——选一个好基 <span class=\"katex-inline\">\\Psi<\/span>，描述活跃模态及其比例只需要少量参数。所有数据压缩都依赖稀疏性：信号在 Fourier、wavelet 这类通用变换基下用少量系数表示（PDF 第 107 页）。<\/p>\n<p>设信号 <span class=\"katex-inline\">x\\in\\mathbb{R}^n<\/span>，在基 <span class=\"katex-inline\">\\Psi\\in\\mathbb{R}^{n\\times n}<\/span> 下展开为 <span class=\"katex-inline\">x=\\Psi s<\/span>。若 <span class=\"katex-inline\">s<\/span> 只有 <span class=\"katex-inline\">K<\/span> 个非零元，称信号 <span class=\"katex-inline\">K<\/span>-稀疏。测量 <span class=\"katex-inline\">y=Cx<\/span>，<span class=\"katex-inline\">C\\in\\mathbb{R}^{p\\times n}<\/span>，代入得 <span class=\"katex-inline\">y=\\Theta s<\/span>，其中 <span class=\"katex-inline\">\\Theta=C\\Psi<\/span>（PDF 第 113 页图 3.4 附近）。<\/p>\n<h3>为什么是 <span class=\"katex-inline\">\\ell_1<\/span>，不是 <span class=\"katex-inline\">\\ell_2<\/span><\/h3>\n<p>直接找最稀疏解是 <span class=\"katex-inline\">\\min_s\\|s\\|_0<\/span> subject to <span class=\"katex-inline\">\\Theta s=y<\/span>：<span class=\"katex-inline\">\\|s\\|_0<\/span> 数非零元个数。这个组合问题在 <span class=\"katex-inline\">n<\/span> 大时无法直接求解。凸松弛换成 <span class=\"katex-inline\">\\ell_1<\/span> 范数：<\/p>\n<div class=\"katex-block\">\\hat s=\\arg\\min_s\\|s\\|_1,\\quad\\text{subject to }\\Theta s=y<\/div>\n<p><span class=\"katex-inline\">\\ell_1<\/span> 又称 taxicab/Manhattan 范数；几何上 <span class=\"katex-inline\">\\ell_1<\/span> 球是菱形，与约束超平面的交点容易落在坐标轴上，解因而稀疏；<span class=\"katex-inline\">\\ell_2<\/span> 球是圆，交点通常不在轴上，解为稠密向量（PDF 第 113 页图 3.5）。本书 Code 3.1 在 <span class=\"katex-inline\">n=1000,p=200<\/span> 的欠定系统上对照：<span class=\"katex-inline\">\\ell_1<\/span> 最小范数解大部分系数接近零，<span class=\"katex-inline\">\\ell_2<\/span> 最小范数解（伪逆）每个系数都分到一点能量（PDF 第 116 页）。<\/p>\n<h3>恢复成立的两类条件<\/h3>\n<p><span class=\"katex-inline\">\\ell_1<\/span> 最小化以高概率收敛到最稀疏解，需要两个条件（PDF 第 113 页）：<\/p>\n<ol><li>\n测量矩阵 <span class=\"katex-inline\">C<\/span> 与稀疏基 <span class=\"katex-inline\">\\Psi<\/span> 不相关（incoherent）：<span class=\"katex-inline\">C<\/span> 的行与 <span class=\"katex-inline\">\\Psi<\/span> 的列内积小；\n<\/li><li>\n测量数 <span class=\"katex-inline\">p<\/span> 足够大，尺度为 <span class=\"katex-inline\">p\\sim O(K\\log(n/K))=k_1K\\log(n/K)<\/span>。\n<\/ol>\n<p>不相关性的度量为<\/p>\n<div class=\"katex-block\">\\mu(C,\\Psi)=\\sqrt n\\,\\max_{j,k}|\\langle c_k,\\psi_j\\rangle|<\/div>\n<p><span class=\"katex-inline\">\\mu<\/span> 取值范围在 <span class=\"katex-inline\">1<\/span> 到 <span class=\"katex-inline\">\\sqrt n<\/span> 之间（PDF 第 120 页公式 3.13）。RIP 把&quot;近似保距&quot;写成精确不等式：<\/p>\n<div class=\"katex-block\">(1-\\delta_K)\\|s\\|_2^2\\le\\|\\Theta s\\|_2^2\\le(1+\\delta_K)\\|s\\|_2^2<\/div>\n<p><span class=\"katex-inline\">\\delta_K<\/span> 是对所有 <span class=\"katex-inline\">K<\/span>-稀疏向量使不等式成立的最小常数；<span class=\"katex-inline\">\\delta_K<\/span> 越小，<span class=\"katex-inline\">\\Theta<\/span> 在稀疏向量上越接近等距变换。测量数增加通常会压低 <span class=\"katex-inline\">\\delta_K<\/span>（PDF 第 120 页）。<\/p>\n<h3>从恢复问题到回归问题<\/h3>\n<p>统计拟合里观测多于候选变量（overdetermined），测量噪声保证不存在精确稀疏解，标准压缩感知不再直接适用。LASSO 把 <span class=\"katex-inline\">\\ell_1<\/span> 惩罚加进最小二乘：<\/p>\n<div class=\"katex-block\">x=\\arg\\min_{x'}\\|Ax'-b\\|_2+\\lambda\\|x\\|_1<\/div>\n<p><span class=\"katex-inline\">\\lambda<\/span> 是稀疏化旋钮，沿一串取值扫描，用留出数据或交叉验证挑模型；本书示例用 10 折交叉验证取误差最小（绿色点）或最小误差加一倍标准差（蓝色点，Index1SE）对应的模型（PDF 第 124–125 页）。LASSO 由 Tibshirani 1996 年提出，与 Breiman 的 nonnegative garrote、Donoho–Johnstone 的软阈值相关；elastic net 把 <span class=\"katex-inline\">\\ell_1<\/span> 与 <span class=\"katex-inline\">\\ell_2<\/span> 惩罚结合（PDF 第 123 页）。<\/p>\n<h2>推演一：测量数尺度与 RIP 常数的推导链<\/h2>\n<p><strong>前提 A<\/strong>：信号 <span class=\"katex-inline\">K<\/span>-稀疏于 <span class=\"katex-inline\">\\Psi<\/span>，即 <span class=\"katex-inline\">s<\/span> 至多 <span class=\"katex-inline\">K<\/span> 个非零元；测量 <span class=\"katex-inline\">y=\\Theta s<\/span>，<span class=\"katex-inline\">\\Theta=C\\Psi<\/span>。 <strong>前提 B<\/strong>：<span class=\"katex-inline\">\\Theta<\/span> 对所有 <span class=\"katex-inline\">K<\/span>-稀疏向量近似保距，即满足 RIP，常数 <span class=\"katex-inline\">\\delta_K<\/span> 足够小。<\/p>\n<ul><li>\n第一步，恢复要区分任意两个不同的 <span class=\"katex-inline\">K<\/span>-稀疏向量 <span class=\"katex-inline\">s_a,s_b<\/span>。差值 <span class=\"katex-inline\">s_a-s_b<\/span> 至多 <span class=\"katex-inline\">2K<\/span> 个非零元；若 <span class=\"katex-inline\">\\Theta<\/span> 把这一差值压缩到零，两个不同信号给出相同 <span class=\"katex-inline\">y<\/span>，恢复无解。RIP 对 <span class=\"katex-inline\">2K<\/span>-稀疏向量要求 <span class=\"katex-inline\">\\|\\Theta(s_a-s_b)\\|_2<\/span> 与 <span class=\"katex-inline\">\\|s_a-s_b\\|_2<\/span> 同量级，方向才不混淆。\n<\/li><li>\n第二步，随机测量矩阵的统计结论：在高斯随机测量等设定下，存在常数 <span class=\"katex-inline\">k_1<\/span>，当 <span class=\"katex-inline\">p\\ge k_1K\\log(n/K)<\/span> 时，<span class=\"katex-inline\">\\Theta<\/span> 以高概率满足 RIP。<span class=\"katex-inline\">\\log(n/K)<\/span> 来自从 <span class=\"katex-inline\">\\binom{n}{K}<\/span> 个候选稀疏支撑集里逐一满足保距条件所需的并集控制；稀疏度 <span class=\"katex-inline\">K<\/span> 越小，需要的测量数越少（PDF 第 115、119 页）。\n<\/li><li>\n第三步，incoherence 决定常数 <span class=\"katex-inline\">k_1<\/span>。<span class=\"katex-inline\">C<\/span> 的行与 <span class=\"katex-inline\">\\Psi<\/span> 的列内积小，则几乎任何活跃模态都能被多数测量激发；若测量与基模态高度相干，某测量只在该模态活跃时才有信息，活跃模态一旦不出现，该测量近乎无用（PDF 第 119 页）。\n<\/li><li>\n第四步，噪声情形改用约束形式：<span class=\"katex-inline\">\\hat s=\\arg\\min\\|s\\|_1<\/span> subject to <span class=\"katex-inline\">\\|\\Theta s-y\\|_2&lt;\\epsilon<\/span>（PDF 第 115 页公式 3.8）；等价的拉格朗日形式把残差与惩罚写在同一个目标里。\n<\/ul>\n<p>推导保留的限定：压缩感知是统计理论，恢复以高概率成立而非逐例保证；概率在中等规模问题上变得极大，但图像类应用测量数与计算量仍然可观。本书以婴儿 MRI 为典型可行场景：减少儿童保持静止的时间，可避免危险的深度镇静（PDF 第 115 页）。<\/p>\n<h2>推演二：LASSO 目标函数与系数收缩路径<\/h2>\n<p><strong>前提 C<\/strong>：观测矩阵 <span class=\"katex-inline\">A<\/span> 超定，右端 <span class=\"katex-inline\">b<\/span> 含噪声；先验认为真实关系只用到少量预测变量。<\/p>\n<ul><li>\n第一步，普通最小二乘解倾向于给 <span class=\"katex-inline\">A<\/span> 的每一列都配一个非零系数；残差平方对大偏差放大，单个大离群点即可把斜率带偏（PDF 第 121 页）。<span class=\"katex-inline\">\\ell_1<\/span> 回归（LAD）对离群点更稳健，因为残差按绝对值而不是平方计入代价（PDF 第 122 页图 3.12）。\n<\/li><li>\n第二步，LASSO 目标 <span class=\"katex-inline\">\\|Ax&#x27;-b\\|_2+\\lambda\\|x&#x27;\\|_1<\/span> 中，<span class=\"katex-inline\">\\ell_1<\/span> 惩罚在原点附近带尖拐角：坐标下降时弱相关系数被直接压到零，形成特征选择；<span class=\"katex-inline\">\\ell_2<\/span>（ridge/Tikhonov）惩罚只把系数往零缩，不产生精确零（PDF 第 123–124 页）。\n<\/li><li>\n第三步，<span class=\"katex-inline\">\\lambda<\/span> 从大到小扫描：<span class=\"katex-inline\">\\lambda<\/span> 越大，进入模型的项越少；交叉验证在训练/留出集上比较拟合误差，挑既简洁又不过拟合的模型。本书示例交叉验证后保留两个活跃项，系数约为 <span class=\"katex-inline\">0.7037<\/span> 与 <span class=\"katex-inline\">-0.4929<\/span>；LASSO 系数本身有偏，可对保留下来的非零项再做一次最小二乘去偏（de-bias），本书去偏后系数为 <span class=\"katex-inline\">1.0980<\/span> 与 <span class=\"katex-inline\">-1.0671<\/span>（PDF 第 125–126 页）。\n<\/li><li>\n第四步，复杂度口径：LASSO 是凸优化，坐标下降在给定 <span class=\"katex-inline\">\\lambda<\/span> 下每轮扫描全部坐标，迭代次数随变量数与正则化路径长度增长；交叉验证外层还要对一串 <span class=\"katex-inline\">\\lambda<\/span> 重复求解。与 <span class=\"katex-inline\">\\ell_0<\/span> 的组合搜索相比，凸化后问题可在多项式时间内求解，但代价是牺牲无噪声欠定情形下的精确等价性。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\nA[信号 x] --&gt;|x=Ψs| B[稀疏系数 s, K-稀疏]\nC[测量 C] --&gt; D[Θ=CΨ]\nB --&gt;|y=Θs| E[测量 y]\nE --&gt; F{恢复/回归}\nF --&gt;|欠定无噪声| G[ℓ1 最小范数]\nF --&gt;|超定有噪声| H[LASSO: 残差+λ‖x‖1]\nG --&gt; I[RIP/incoherence 保证]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>反事实分析：去掉条件后压缩感知会失败吗<\/h2>\n<ol><li>\n<strong>测量与基相干（坏测量）<\/strong>。本书图 3.11 给出坏例子：<span class=\"katex-inline\">C<\/span> 取稀疏基 <span class=\"katex-inline\">\\Psi<\/span> 的最后 <span class=\"katex-inline\">p<\/span> 列，<span class=\"katex-inline\">\\Theta<\/span> 变成左侧补零的 <span class=\"katex-inline\">p\\times p<\/span> 单位阵。任何活跃项落在前 <span class=\"katex-inline\">n-p<\/span> 个基模态上的信号，都落在 <span class=\"katex-inline\">\\Theta<\/span> 的零空间里，测量完全看不到它（PDF 第 121 页）。反事实推演：此时增加测量数也救不回来，因为新测量仍只盯同一组模态；必须换测量方式（随机、宽带激励，如 delta 函数对 Fourier 模态宽带激发）才能覆盖活跃模态。\n<\/li><li>\n<strong>信号并不稀疏<\/strong>。RIP 只在稀疏向量集合上保距；若 <span class=\"katex-inline\">s<\/span> 是稠密向量，<span class=\"katex-inline\">\\log(n/K)<\/span> 尺度失效，所需测量数回到接近 Nyquist 量级。反事实推演：选错基（信号在该基下不稀疏）时，压缩感知的省测量优势消失，<span class=\"katex-inline\">\\ell_1<\/span> 解也不再稀疏。\n<\/li><li>\n<strong>噪声变大而不放松约束<\/strong>。无噪声精确约束 <span class=\"katex-inline\">\\Theta s=y<\/span> 在白噪声下没有可行稀疏解；若仍用等式约束，优化要么无解，要么把噪声塞进系数。反事实推演：改用残差预算 <span class=\"katex-inline\">\\|\\Theta s-y\\|_2&lt;\\epsilon<\/span> 或 LASSO 形式，恢复对噪声稳健，但代价是解的稀疏度与精度之间要重新权衡。\n<\/li><li>\n<strong>RPCA 视角下的低秩+稀疏分解<\/strong>。当背景是低秩结构、前景是稀疏大扰动（遮挡、阴影、光斑），RPCA 把数据矩阵拆成低秩 <span class=\"katex-inline\">L<\/span> 加稀疏 <span class=\"katex-inline\">S<\/span>：<span class=\"katex-inline\">X=L+S<\/span>（PDF 第 130 页）。反事实推演：若扰动是稠密小噪声而非稀疏大扰动，RPCA 的稀疏项假设不匹配，需要先经 SVD 去噪处理；排名/评分类矩阵补全问题（如 Netflix Prize 场景）与低秩近似同源（PDF 第 131 页）。\n<\/ol>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章承接第 1 章：SVD 给出数据的低秩/正交基视角，本章问&quot;在基已知的前提下，最少测几个点能把系数恢复出来&quot;。第 4 章把回归放到模型选择框架下：Pareto 前沿、交叉验证与信息准则决定复杂度（PDF 第 140–148 页）。第 7 章 SINDy 直接复用本章的 <span class=\"katex-inline\">\\ell_1<\/span> 稀疏回归，在候选函数库里挑活跃项；第 12 章传感器布置与 DEIM 则把&quot;少量测量点恢复低维系数&quot;的思路用于场数据采样。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为压缩感知可以任意少测。测量数随稀疏度 <span class=\"katex-inline\">K<\/span> 与 <span class=\"katex-inline\">n/K<\/span> 对数增长，且要求测量与基不相关；不满足条件时少测等于丢信息。\n<\/li><li>\n以为 <span class=\"katex-inline\">\\ell_1<\/span> 解一定最稀疏。在 RIP 与充分测量下 <span class=\"katex-inline\">\\ell_1<\/span> 高概率等价于 <span class=\"katex-inline\">\\ell_0<\/span>；条件不满足时，<span class=\"katex-inline\">\\ell_1<\/span> 可能选错支撑集。\n<\/li><li>\n以为 LASSO 选出的系数无偏。LASSO 收缩会压低系数幅值，本书建议对保留项再做最小二乘去偏（PDF 第 126 页）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">y=\\Theta s<\/span> 中 <span class=\"katex-inline\">\\Theta<\/span> 与 <span class=\"katex-inline\">C,\\Psi<\/span> 的关系，并说明 <span class=\"katex-inline\">K<\/span>-稀疏的含义。（答案：<span class=\"katex-inline\">\\Theta=C\\Psi<\/span>；<span class=\"katex-inline\">s<\/span> 至多 <span class=\"katex-inline\">K<\/span> 个非零元，PDF 第 113、119 页。）\n<\/li><li>\nRIP 不等式两端各度量什么？<span class=\"katex-inline\">\\delta_K<\/span> 变小意味着什么？（答案：右端 <span class=\"katex-inline\">\\|\\Theta s\\|_2^2<\/span> 是测量后能量，左端 <span class=\"katex-inline\">\\|s\\|_2^2<\/span> 是原稀疏向量能量；<span class=\"katex-inline\">\\delta_K<\/span> 小表示近等距，PDF 第 120 页。）\n<\/li><li>\nLASSO 目标函数里 <span class=\"katex-inline\">\\ell_1<\/span> 与 <span class=\"katex-inline\">\\ell_2<\/span> 惩罚分别产生什么系数形态？（答案：<span class=\"katex-inline\">\\ell_1<\/span> 压出精确零、做特征选择；<span class=\"katex-inline\">\\ell_2<\/span> 只收缩不置零，PDF 第 123–124 页。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n稀疏表示 <span class=\"katex-inline\">x=\\Psi s<\/span>；测量方程 <span class=\"katex-inline\">y=\\Theta s<\/span>，<span class=\"katex-inline\">\\Theta=C\\Psi<\/span>。\n<\/li><li>\n恢复条件：incoherence（<span class=\"katex-inline\">\\mu(C,\\Psi)<\/span>）+ 测量数 <span class=\"katex-inline\">p\\sim k_1K\\log(n/K)<\/span> + RIP 常数小。\n<\/li><li>\n<span class=\"katex-inline\">\\ell_0<\/span> 组合不可解，<span class=\"katex-inline\">\\ell_1<\/span> 凸松弛高概率等价；噪声下用残差预算或拉格朗日形式。\n<\/li><li>\nLASSO = 最小二乘 <span class=\"katex-inline\">+\\lambda\\|x\\|_1<\/span>，交叉验证选 <span class=\"katex-inline\">\\lambda<\/span>，系数可去偏。\n<\/li><li>\nRPCA 拆低秩背景 <span class=\"katex-inline\">L<\/span> 与稀疏扰动 <span class=\"katex-inline\">S<\/span>；坏测量让部分稀疏信号落入零空间。\n<\/ul>", "ch03": "<div class=\"source-badge\">📖 出处：Data-Driven Science and Engineering: Machine Learning, Dynamical Systems, and Control · p.252<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：Singular Value Decomposition (SVD) — 低秩近似、PCA 与截断<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 3 章（兼及第 4 章回归部分）：Sparsity and Compressed Sensing 与稀疏回归<\/a><\/span><\/div><h1>第 7 章：Data-Driven Dynamical Systems — DMD、Koopman、SINDy 与延迟嵌入<\/h1>\n<ul><li>\n<strong>对应原书<\/strong>：第 7 章 Data-Driven Dynamical Systems（PDF 第 252–298 页），含 7.2 DMD、7.3 SINDy、7.4 Koopman Operator Theory、7.5 Data-Driven Koopman Analysis\n<\/li><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 1 章 SVD/PCA；第 2 章稀疏回归；线性系统 <span class=\"katex-inline\">\\dot x=Ax<\/span> 的特征值解\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出连续/离散动力系统形式，说明线性系统解 <span class=\"katex-inline\">x(t)=e^{At}x(t_0)<\/span> 如何由特征值刻画；\n<\/li><li>\n从成对快照矩阵构造 DMD 算子 <span class=\"katex-inline\">A=X&#x27;X^\\dagger<\/span>，经 SVD 降秩得到 <span class=\"katex-inline\">\\tilde A<\/span>，并把特征值 <span class=\"katex-inline\">\\lambda=a+ib<\/span> 对应到增长率 <span class=\"katex-inline\">a<\/span> 与频率 <span class=\"katex-inline\">b<\/span>；\n<\/li><li>\n写出 SINDy 的候选函数库 <span class=\"katex-inline\">\\Theta(X)<\/span> 与逐行稀疏优化目标，说明 STLS 稀疏化流程；\n<\/li><li>\n解释 Koopman 算子作用在可观测量上而非状态上，延迟嵌入/Hankel 矩阵如何为混沌标量序列重构吸引子。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>面对未知、非线性、高维的系统，本章给两条主线：算子论路线把非线性系统换成无穷维线性的 Koopman 算子再取有限维逼近；回归路线用 DMD、SINDy 从快照数据直接拟合时间演化模型。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>动力系统的两种写法<\/h3>\n<p>动力系统用微分方程或迭代映射描述状态随时间演化。连续形式 <span class=\"katex-inline\">\\dot x=f(x)<\/span>，离散形式 <span class=\"katex-inline\">x_{k+1}=F_{\\Delta t}(x_k)<\/span>；流映射 <span class=\"katex-inline\">F_t(x(t_0))=x(t_0)+\\int_{t_0}^{t_0+t}f(x(\\tau))d\\tau<\/span>（PDF 第 255 页公式 7.6）。实验与数字控制常从连续系统采样得到离散序列 <span class=\"katex-inline\">x_k=x(k\\Delta t)<\/span>。<\/p>\n<p>能线性化时优先用线性动力学 <span class=\"katex-inline\">\\dot x=Ax<\/span>，解为 <span class=\"katex-inline\">x(t_0+t)=e^{At}x(t_0)<\/span>，系统行为完全由 <span class=\"katex-inline\">A<\/span> 的特征值与特征向量刻画（PDF 第 255 页公式 7.7–7.8）。特征值 <span class=\"katex-inline\">\\lambda=a+ib<\/span> 对应解 <span class=\"katex-inline\">e^{\\lambda t}=e^{at}(\\cos bt+i\\sin bt)<\/span>：<span class=\"katex-inline\">a&lt;0<\/span> 衰减，<span class=\"katex-inline\">a&gt;0<\/span> 增长，<span class=\"katex-inline\">b<\/span> 给振荡频率（PDF 第 307 页对照说明）。难点在于真实系统大多非线性，且支配方程未知。<\/p>\n<h3>两条现代路线<\/h3>\n<p>本书归纳两类关键方法（PDF 第 258 页）：<\/p>\n<ol><li>\n<strong>算子论表示<\/strong>：用作用在测量函数上的无穷维线性算子表示非线性系统，如 Koopman 算子推进可观测量、Perron–Frobenius 算子推进概率密度；\n<\/li><li>\n<strong>数据驱动回归与机器学习<\/strong>：DMD、SINDy、数据驱动 Koopman 方法，以及遗传规划，直接从数据辨识模型。\n<\/ol>\n<h3>DMD：最佳拟合线性算子<\/h3>\n<p>DMD 可表述为：辨识一个把高维测量向前推进的最佳拟合线性动力系统。成对快照矩阵 <span class=\"katex-inline\">X<\/span>（前一时刻）与 <span class=\"katex-inline\">X&#x27;<\/span>（后一时刻）满足 <span class=\"katex-inline\">X&#x27;\\approx AX<\/span>；最佳拟合算子定义为<\/p>\n<div class=\"katex-block\">A=\\arg\\min_A\\|X'-AX\\|_F=X'X^\\dagger<\/div>\n<p>（PDF 第 260 页公式 7.16）。均匀采样下即 <span class=\"katex-inline\">x_{k+1}\\approx Ax_k<\/span>。DMD 是 SVD 空间降维与 FFT 频率辨识的结合：每个 DMD 模态关联一个特征值 <span class=\"katex-inline\">\\lambda=a+ib<\/span>，<span class=\"katex-inline\">b<\/span> 为振荡频率，<span class=\"katex-inline\">a<\/span> 为增长/衰减率（PDF 第 259 页）。<\/p>\n<p>高维状态下 <span class=\"katex-inline\">A<\/span> 有 <span class=\"katex-inline\">n^2<\/span> 个元素，直接分解不可行。先对 <span class=\"katex-inline\">X<\/span> 做 SVD，取截断秩 <span class=\"katex-inline\">r<\/span>：<span class=\"katex-inline\">X=\\tilde U\\tilde\\Sigma\\tilde V^*<\/span>；把 <span class=\"katex-inline\">A<\/span> 投影到 POD 模态上<\/p>\n<div class=\"katex-block\">\\tilde A=\\tilde U^*A\\tilde U=\\tilde U^*X'\\tilde V\\tilde\\Sigma^{-1}<\/div>\n<p><span class=\"katex-inline\">\\tilde A<\/span> 与完整 <span class=\"katex-inline\">A<\/span> 共享全部非零特征值，只需分解这个 <span class=\"katex-inline\">r\\times r<\/span> 小矩阵（PDF 第 261 页公式 7.18–7.20）。截断秩 <span class=\"katex-inline\">r<\/span> 是 DMD 中最重要也最主观的步骤之一，本书建议用 Gavish–Donoho 硬阈值从噪声数据定 <span class=\"katex-inline\">r<\/span>（PDF 第 261 页）。<\/p>\n<h3>Koopman：算子推进的是函数，不是状态<\/h3>\n<p>1931 年 Koopman 证明：非线性动力系统可以用一个作用在状态测量函数 Hilbert 空间上的无穷维线性算子表示。Koopman 算子推进可观测量 <span class=\"katex-inline\">g<\/span>：<span class=\"katex-inline\">\\mathcal{K}_tg(x)=g(F_t(x))<\/span>；连续时间生成元 <span class=\"katex-inline\">\\mathcal{K}g=\\lim_{t\\to0}(\\mathcal{K}_tg-g)/t=\\lim_{t\\to0}(g\\circ F_t-g)/t<\/span>（PDF 第 280–281 页公式 7.53–7.56）。算子本身线性，但状态作为可观测量在基中表示后，经动力学迭代可能变得复杂；找到 Koopman 本征函数张成的子空间，是有限维逼近的关键（PDF 第 280 页）。<\/p>\n<h3>SINDy：从函数库里稀疏挑项<\/h3>\n<p>许多动力系统 <span class=\"katex-inline\">\\dot x=f(x)<\/span> 的右端 <span class=\"katex-inline\">f<\/span> 在候选函数空间里只有少量活跃项，例如 Lorenz 方程每行只有线性与二次交互项。SINDy 用广义线性模型逼近 <span class=\"katex-inline\">f(x)\\approx\\sum_j\\xi_j\\psi_j(x)<\/span>，构造函数库 <span class=\"katex-inline\">\\Theta(X)<\/span>（常数、<span class=\"katex-inline\">x<\/span>、二次项、三次项等），数据关系写成 <span class=\"katex-inline\">\\dot X=\\Theta(X)\\Xi<\/span>。每行方程单独做稀疏回归：<\/p>\n<div class=\"katex-block\">\\xi_k=\\arg\\min_{\\xi'_k}\\|\\dot X_k-\\Theta(X)\\xi'_k\\|_2+\\lambda\\|\\xi'_k\\|_1<\/div>\n<p>（PDF 第 271 页公式 7.39）。本书推荐 STLS（sequentially thresholded least-squares）：先最小二乘给初值，迭代 10 轮左右把绝对值小于 <span class=\"katex-inline\">\\lambda<\/span> 的系数置零再重拟合（PDF 第 271 页 Code 7.1）。<\/p>\n<h2>推演一：DMD 算法逐步推演与特征值-演化对应<\/h2>\n<p><strong>前提 A<\/strong>：均匀采样快照 <span class=\"katex-inline\">x_0,\\dots,x_m<\/span>，<span class=\"katex-inline\">X=[x_0,\\dots,x_{m-1}]<\/span>，<span class=\"katex-inline\">X&#x27;=[x_1,\\dots,x_m]<\/span>；数据近似秩 <span class=\"katex-inline\">r<\/span>。 <strong>前提 B<\/strong>：先在 POD 基上回归，避免构造 <span class=\"katex-inline\">n\\times n<\/span> 的 <span class=\"katex-inline\">A<\/span>。下面的推导从回归目标出发，逐步推到小矩阵特征值分解。<\/p>\n<ul><li>\n第一步，回归问题 <span class=\"katex-inline\">A=\\arg\\min_A\\|X&#x27;-AX\\|_F<\/span>。对 <span class=\"katex-inline\">X<\/span> 经济 SVD：<span class=\"katex-inline\">X=\\tilde U\\tilde\\Sigma\\tilde V^<em><\/span>，伪逆 <span class=\"katex-inline\">X^\\dagger=\\tilde V\\tilde\\Sigma^{-1}\\tilde U^<\/em><\/span>，于是 <span class=\"katex-inline\">A=X&#x27;\\tilde V\\tilde\\Sigma^{-1}\\tilde U^*<\/span>（PDF 第 261 页公式 7.18）。\n<\/li><li>\n第二步，投影到 POD 坐标：<span class=\"katex-inline\">\\tilde A=\\tilde U^<em>A\\tilde U=\\tilde U^<\/em>X&#x27;\\tilde V\\tilde\\Sigma^{-1}<\/span>。<span class=\"katex-inline\">\\tilde U<\/span> 的列是 POD 模态，满足 <span class=\"katex-inline\">\\tilde U^*\\tilde U=I<\/span>。\n<\/li><li>\n第三步，非零特征值一致性：<span class=\"katex-inline\">\\tilde A=\\tilde U^*A\\tilde U<\/span> 是 <span class=\"katex-inline\">A<\/span> 的压缩表示，<span class=\"katex-inline\">\\tilde A<\/span> 与 <span class=\"katex-inline\">A<\/span> 共享非零特征值；状态在 POD 坐标下满足 <span class=\"katex-inline\">\\tilde x_{k+1}=\\tilde A\\tilde x_k<\/span>，全状态由 <span class=\"katex-inline\">x_k=\\tilde U\\tilde x_k<\/span> 重构（PDF 第 261 页公式 7.19–7.20）。\n<\/li><li>\n第四步，特征值分解 <span class=\"katex-inline\">\\tilde A w_j=\\lambda_j w_j<\/span>。离散时间演化 <span class=\"katex-inline\">x_k\\sim\\sum_j w_j\\lambda_j^k v_j<\/span>；若 <span class=\"katex-inline\">\\lambda_j=a_j+ib_j<\/span>，连续时间增长率为 <span class=\"katex-inline\">\\ln|\\lambda_j|/\\Delta t<\/span>，振荡角频率为 <span class=\"katex-inline\">\\arg(\\lambda_j)/\\Delta t<\/span>。<span class=\"katex-inline\">|\\lambda_j|&gt;1<\/span> 增长，<span class=\"katex-inline\">&lt;1<\/span> 衰减，<span class=\"katex-inline\">=1<\/span> 中性振荡（PDF 第 259 页）。\n<\/li><li>\n第五步，复杂度口径：SVD 对 <span class=\"katex-inline\">n\\times m<\/span> 快照矩阵为 <span class=\"katex-inline\">O(nm\\min(n,m))<\/span>；回归 <span class=\"katex-inline\">\\tilde U^*X&#x27;<\/span> 与小矩阵 <span class=\"katex-inline\">\\tilde A<\/span> 特征值分解只涉及 <span class=\"katex-inline\">r<\/span> 维运算，<span class=\"katex-inline\">r\\ll\\min(n,m)<\/span> 时主导代价仍是一次 SVD。\n<\/ul>\n<h2>推演二：SINDy 函数库构造与稀疏化流程<\/h2>\n<p><strong>前提 C<\/strong>：状态测量 <span class=\"katex-inline\">X<\/span> 与导数 <span class=\"katex-inline\">\\dot X<\/span> 已获得（导数可由有限差分或滤波微分得到）；先验只知道候选项的类型，不知道哪几项活跃。<\/p>\n<ul><li>\n第一步，构造库 <span class=\"katex-inline\">\\Theta(X)<\/span>：按行对每个快照生成常数项、一次项 <span class=\"katex-inline\">x_k<\/span>、二次项 <span class=\"katex-inline\">x_ix_j<\/span>、三次项等。库列数 <span class=\"katex-inline\">p<\/span> 随多项式阶数增长；阶数选太高会让组合空间膨胀并引入共线项。\n<\/li><li>\n第二步，写数据方程 <span class=\"katex-inline\">\\dot X=\\Theta(X)\\Xi<\/span>。<span class=\"katex-inline\">\\Xi<\/span> 第 <span class=\"katex-inline\">k<\/span> 列 <span class=\"katex-inline\">\\xi_k<\/span> 决定第 <span class=\"katex-inline\">k<\/span> 行方程用哪些项；简洁模型在拟合误差小的前提下非零元尽量少（PDF 第 271 页公式 7.38）。\n<\/li><li>\n第三步，逐行求解稀疏回归（公式 7.39）。<span class=\"katex-inline\">\\lambda<\/span> 控制稀疏度；STLS 流程：初始最小二乘 <span class=\"katex-inline\">\\Xi=\\Theta\\backslash\\dot X<\/span>，每轮标记 <span class=\"katex-inline\">|\\Xi|&lt;\\lambda<\/span> 的小系数为待剔除，在剩余列上重算最小二乘，迭代至系数稳定（PDF 第 271 页 Code 7.1）。\n<\/li><li>\n第四步，输出稀疏系数矩阵：活跃项保留、其余置零。本书 Lorenz 示例用三阶多项式库、<span class=\"katex-inline\">\\lambda=0.025<\/span>，辨识出的系数与原方程吻合（PDF 第 272 页）。带控制项时把作动输入并入函数库，即 SINDYc，辨识模型可直接交给 MPC 使用（PDF 第 374 页）。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[成对快照 X, X&#x27;] --&gt; B[SVD 截断秩 r]\nB --&gt; C[POD 模态 Ũ, Σ̃, Ṽ]\nC --&gt; D[Ã=Ũ*X&#x27;ṼΣ̃⁻¹]\nD --&gt; E[特征值 λ=a+ib]\nE --&gt; F[增长率 ln|λ|/Δt, 频率 argλ/Δt]\nA --&gt; G[SINDy: 库 Θ(X)]\nG --&gt; H[逐行 L1/STLS 稀疏回归]\nH --&gt; I[稀疏系数 Ξ: 活跃项]\nJ[标量时间序列] --&gt; K[Hankel 矩阵 H]\nK --&gt; L[SVD 延迟嵌入吸引子]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>推演三：Koopman 谱与有限维逼近的位置<\/h2>\n<p>本推演从算子线性性出发，推导本征可观测量展开与有限子空间逼近的关系。<\/p>\n<ul><li>\n第一步，Koopman 算子在可观测量空间上线性：<span class=\"katex-inline\">\\mathcal{K}_t(ag_1+bg_2)=a\\mathcal{K}_tg_1+b\\mathcal{K}_tg_2<\/span>。本征可观测量 <span class=\"katex-inline\">\\varphi_j<\/span> 满足 <span class=\"katex-inline\">\\mathcal{K}_t\\varphi_j=\\lambda_j\\varphi_j<\/span>；任意可观测量按本征函数展开 <span class=\"katex-inline\">g_i(x)=\\sum_jv_{ij}\\varphi_j(x)<\/span>（PDF 第 283 页公式 7.65–7.66）。\n<\/li><li>\n第二步，DMD 是 Koopman 算子在&quot;直接状态测量 <span class=\"katex-inline\">g(x)=x<\/span>&quot;这一有限函数子空间上的最佳拟合逼近；测量函数选得好（含延迟坐标、观测项），有限维模型更接近真实 Koopman 谱（PDF 第 260、280 页）。\n<\/li><li>\n第三步，数据驱动 Koopman 方法在测量数据上辨识本征函数与本征值；HAVOK 把标量序列堆成 Hankel 矩阵，SVD 得到延迟坐标时间序列，再在延迟坐标上回归线性模型，最后一个坐标作为强迫项刻画混沌中的稀有跳变事件（PDF 第 294 页图 7.12）。\n<\/ul>\n<h2>反事实分析：改动假设后方法会怎样失效<\/h2>\n<ol><li>\n<strong>若 Koopman 谱连续，DMD 还能用吗<\/strong>。DMD 在有限快照上只能给出有限个离散特征值；当吸引子上存在连续谱（连续频率、准周期或混沌连续分解），离散特征值会随采样窗与噪声漂移，模态不对应稳定本征函数。反事实推演：此时 DMD 结果只能解释为有限样本上的最佳线性拟合，不能外推为系统内禀谱；需要延迟嵌入、扩展观测函数或更长数据窗改善有限逼近。\n<\/li><li>\n<strong>若数据含噪声且秩 <span class=\"katex-inline\">r<\/span> 选错<\/strong>。<span class=\"katex-inline\">r<\/span> 取小，真实慢模态被截断，回归算子丢掉主导动力学；<span class=\"katex-inline\">r<\/span> 取大，噪声方向进入 <span class=\"katex-inline\">\\tilde A<\/span>，特征值被噪声扰动，出现虚假增长/衰减模态。反事实推演：硬阈值只在高斯白噪声模型下有最优性保证；非高斯噪声下应结合留一预测误差调整 <span class=\"katex-inline\">r<\/span>。\n<\/li><li>\n<strong>若快照来自带作动系统却直接用 DMD<\/strong>。本书指出：对有控制输入的数据朴素跑 DMD，会把内部动力学效应与作动效应混淆，得到错误模型；DMDc 把控制量并入回归（PDF 第 370 页）。反事实推演：忽略输入通道时，辨识出的&quot;模态&quot;部分是作动信号的响应，不能代表开环动力学。\n<\/li><li>\n<strong>若函数库不含真实项<\/strong>。SINDy 是库内线性组合；真实右端含库外项（如分数阶、非光滑项）时，稀疏回归只能用库内项近似，系数看似稳定但方程结构错误。反事实推演：库的覆盖范围决定模型能力上限，稀疏化只在库内做选择。\n<\/ol>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章用上第 1 章 SVD 做降秩、第 2 章 <span class=\"katex-inline\">\\ell_1<\/span> 稀疏回归做 SINDy 选项；DMD/Koopman 模型在第 8 章接上线性控制理论：在 intrinsic coordinates 里用教科书级线性控制方法控制非线性系统（PDF 第 370 页）；第 10 章把 SINDYc、eDMD 模型交给 MPC；第 11 章 POD 模态与本章 POD 模态同源，区别是本章把模态用于时间动力学辨识，第 11 章用于场方程投影。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为 DMD 直接辨识出非线性方程。DMD 拟合的是线性算子；它对非线性系统的代表能力来自 Koopman 视角下的有限维逼近，不是在状态空间里写出非线性项。\n<\/li><li>\n以为特征值在单位圆内就稳定。离散 <span class=\"katex-inline\">\\lambda<\/span> 与连续 <span class=\"katex-inline\">s=\\ln\\lambda/\\Delta t<\/span> 要经过换算；采样间隔 <span class=\"katex-inline\">\\Delta t<\/span> 改变，增长率与频率解释随之改变。\n<\/li><li>\n以为 SINDy 自动发现真实方程。它只在预设函数库里选稀疏组合；库缺项、噪声微分误差大都会让辨识结果失真。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n写出 DMD 回归目标 <span class=\"katex-inline\">A=\\arg\\min_A\\|X&#x27;-AX\\|_F<\/span> 的解，并说明为何可以只分解小矩阵 <span class=\"katex-inline\">\\tilde A<\/span>。（答案：<span class=\"katex-inline\">A=X&#x27;X^\\dagger<\/span>；<span class=\"katex-inline\">\\tilde A<\/span> 与 <span class=\"katex-inline\">A<\/span> 共享非零特征值，PDF 第 260–261 页。）\n<\/li><li>\nDMD 特征值 <span class=\"katex-inline\">\\lambda=a+ib<\/span> 如何换算连续时间增长率与频率？（答案：增长率 <span class=\"katex-inline\">\\ln|\\lambda|/\\Delta t<\/span>，角频率 <span class=\"katex-inline\">\\arg(\\lambda)/\\Delta t<\/span>，PDF 第 259 页。）\n<\/li><li>\nSINDy 目标函数中 <span class=\"katex-inline\">\\lambda<\/span> 起什么作用？STLS 每轮做什么？（答案：<span class=\"katex-inline\">\\lambda<\/span> 控制稀疏度；每轮把小系数置零后在剩余列上重拟合，PDF 第 271 页。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线性解 <span class=\"katex-inline\">e^{At}x(0)<\/span> 由特征值刻画；非线性系统用算子论或回归两条路线处理。\n<\/li><li>\nDMD：<span class=\"katex-inline\">X&#x27;\\approx AX<\/span>，SVD 降秩后回归 <span class=\"katex-inline\">\\tilde A<\/span>，特征值对应增长/衰减与频率。\n<\/li><li>\nKoopman 算子推进可观测量，线性但无穷维；DMD 是直接测量子空间上的逼近。\n<\/li><li>\nSINDy：建函数库 <span class=\"katex-inline\">\\Theta(X)<\/span>，逐行 <span class=\"katex-inline\">\\ell_1<\/span>/STLS 稀疏回归挑活跃项。\n<\/li><li>\nHAVOK：Hankel 延迟嵌入 + SVD + 延迟坐标回归，末坐标作强迫项。\n<\/ul>", "ch04": "<div class=\"source-badge\">📖 出处：Data-Driven Science and Engineering: Machine Learning, Dynamical Systems, and Control · p.299<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 7 章：Data-Driven Dynamical Systems — DMD、Koopman、SINDy 与延迟嵌入<\/a><\/span><\/div><h1>第 8、10、11、12 章：数据驱动控制、降阶模型与传感器布置<\/h1>\n<ul><li>\n<strong>对应原书<\/strong>：第 8 章 Linear Control Theory（PDF 第 299–343 页）、第 9 章 Balanced Models for Control（PDF 第 344–368 页）、第 10 章 Data-Driven Control（PDF 第 369–395 页）、第 11 章 Reduced Order Models（PDF 第 396–426 页）、第 12 章 Interpolation for Parametric ROMs（PDF 第 427–457 页）；传感器布置另见 3.8（PDF 第 133–135 页）\n<\/li><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 1 章 SVD/POD；第 7 章 DMD/Koopman/SINDy；线性系统可控性、可观性概念\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 LQR 代价函数 <span class=\"katex-inline\">J=\\int(x^<em>Qx+u^<\/em>Ru)dt<\/span>，说明 <span class=\"katex-inline\">Q,R<\/span> 权衡什么，最优反馈 <span class=\"katex-inline\">u=-K_rx<\/span> 的增益由 Riccati 方程解出；\n<\/li><li>\n推导 POD-Galerkin 投影方程 <span class=\"katex-inline\">\\dot a=\\Phi^TL\\Phi a+\\Phi^TN(\\Phi a,\\beta)<\/span>，说明 ROM 把高维系统压到 <span class=\"katex-inline\">r\\ll n<\/span> 维的过程；\n<\/li><li>\n描述 MPC 滚动时域优化结构，以及 eDMD/SINDYc 辨识模型如何进入控制回路；\n<\/li><li>\n说明传感器/执行器布置的优化目标（条件数、矩阵体积、最小奇异值）与 pivoted QR、Gappy POD、DEIM 的思路。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>数据驱动建模的终点是感知、预测、估计与控制；本章把第 1、7 章得到的低维模态接进反馈回路：先用 POD 把高维方程投影成小系统，再用 LQR/MPC 在小系统上设计反馈，最后用少量传感器与插值节点把测量和非线性求值压回低维。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>从刻画系统到操控系统<\/h3>\n<p>第 8 章开篇指出：本书前面章节主要通过降维、稀疏采样与动力学建模刻画复杂系统；而许多系统的最终目标是主动操控行为以达成工程指标。控制理论是应用数学与工程实践交界最成功的领域之一，且与数据方法不可分割（PDF 第 299 页）。<\/p>\n<p>线性时不变系统写成 <span class=\"katex-inline\">\\dot x=Ax+Bu<\/span>，<span class=\"katex-inline\">y=Cx<\/span>。特征值 <span class=\"katex-inline\">\\lambda=a+ib<\/span> 给出 <span class=\"katex-inline\">e^{\\lambda t}=e^{at}(\\cos bt+i\\sin bt)<\/span>：全部 <span class=\"katex-inline\">a&lt;0<\/span> 时状态衰减到零，任一个 <span class=\"katex-inline\">a&gt;0<\/span> 则沿对应不稳定方向发散（PDF 第 307 页）。可控性判断&quot;作动能否到达所有状态方向&quot;，可观性判断&quot;测量能否推断全部状态&quot;；可控性/可观性 Gramians 由 Lyapunov 方程 <span class=\"katex-inline\">AW_c+W_cA^<em>+BB^<\/em>=0<\/span> 与 <span class=\"katex-inline\">A^<em>W_o+W_oA+C^<\/em>C=0<\/span> 解出（PDF 第 315 页公式 8.42–8.43）。<\/p>\n<h3>LQR：在稳定与控制代价之间权衡<\/h3>\n<p>给定可控系统与全状态测量（或可观系统加全状态估计），反馈律 <span class=\"katex-inline\">u=-Kx<\/span> 可把闭环矩阵 <span class=\"katex-inline\">A-BK<\/span> 的特征值放到左半平面。但把极点压得过头需要极大控制量，还会让控制器对高频噪声过度反应，时延或未建模动态下反而降低鲁棒性（PDF 第 316 页）。<\/p>\n<p>LQR 用二次代价平衡状态调节与控制消耗：<\/p>\n<div class=\"katex-block\">J(t)=\\int_0^t\\left(x(\\tau)^*Qx(\\tau)+u(\\tau)^*Ru(\\tau)\\right)d\\tau<\/div>\n<p><span class=\"katex-inline\">Q<\/span> 惩罚状态偏差，<span class=\"katex-inline\">R<\/span> 惩罚控制能量（PDF 第 316 页公式 8.44）。最优控制器是比例反馈 <span class=\"katex-inline\">u=-K_rx<\/span>，<span class=\"katex-inline\">K_r<\/span> 由代数 Riccati 方程解出；在所有可能控制律（含非线性）中，该线性反馈对这个二次代价最优（PDF 第 317 页图 8.9 与说明）。<\/p>\n<h3>高维系统为什么需要 ROM<\/h3>\n<p>流体动力学离散化后自由度可达百万乃至十亿级，仿真本身昂贵，控制回路的计算时延还会削弱鲁棒性（PDF 第 344 页）。ROM 用少量状态捕捉最相关机制，适合反馈控制。第 11 章区分两类降维：数值离散带来的高维可通过更粗网格缓解；渐近降维则用一组更简单、 preferably 线性的方程替换复杂原系统（PDF 第 399 页附近）。<\/p>\n<h3>POD-Galerkin 投影<\/h3>\n<p>快照 SVD 得到 POD 模态基 <span class=\"katex-inline\">\\Phi=[\\phi_1,\\dots,\\phi_r]<\/span>，把解展开 <span class=\"katex-inline\">u(x,t)\\approx\\sum_{k=1}^ra_k(t)\\phi_k(x)=\\Phi a(t)<\/span>。代入支配方程并乘以 <span class=\"katex-inline\">\\Phi^T<\/span> 做 Galerkin 投影，得低维演化（PDF 第 406 页公式 11.21）：<\/p>\n<div class=\"katex-block\">\\frac{da(t)}{dt}=\\Phi^TL\\Phi a(t)+\\Phi^TN(\\Phi a(t),\\beta)<\/div>\n<p>线性项 <span class=\"katex-inline\">\\Phi^TL\\Phi<\/span> 与非线性项 <span class=\"katex-inline\">\\Phi^TN(\\Phi a,\\beta)<\/span> 都在 <span class=\"katex-inline\">r<\/span> 维上计算。关键难点：非线性项若每次都回到原始 <span class=\"katex-inline\">n<\/span> 维求值，降维收益被抵消；这正是第 12 章 Gappy POD 与 DEIM 要解决的超降阶（hyper-reduction）问题（PDF 第 406 页）。<\/p>\n<h3>数据驱动控制与 MPC<\/h3>\n<p>第 10 章两条途径：用机器学习建系统模型，或直接学控制器（PDF 第 369 页图 10.1）。Koopman 控制在 intrinsic coordinates 里用教科书线性控制方法控制非线性系统；SINDYc 把作动变量并入函数库辨识模型（PDF 第 370 页）。MPC 是现代过程控制的基石：在滚动时域上反复优化作动输入，处理强非线性、约束、时延、非最小相位与不稳定；模型可来自线性系统辨识、神经网络、Volterra 级数或自回归模型，本书案例用 SINDYc 辨识强迫 Lorenz 方程再上 MPC（PDF 第 373–374 页）。<\/p>\n<h3>少量传感器怎么放<\/h3>\n<p>第 3.8 节指出：若已知要重构的是特定人脸这类对象，可针对该特征库 <span class=\"katex-inline\">\\Psi_r=\\tilde U<\/span> 优化传感器位置，相比随机测量大幅减少所需传感器数（PDF 第 133 页）。从 <span class=\"katex-inline\">n<\/span> 个位置挑 <span class=\"katex-inline\">p<\/span> 个传感器是组合搜索：优化最小奇异值、迹或行列式都属 NP-hard；实践用贪心近似。pivoted QR 分解 <span class=\"katex-inline\">A C^T=QR<\/span>，列主元每步选 2-范数最大的列、减去其余列在该列上的正交投影，近似最小化矩阵体积（行列式绝对值），给出 <span class=\"katex-inline\">r<\/span> 个点传感器采样 <span class=\"katex-inline\">r<\/span> 个基模态（PDF 第 135 页公式 3.22–3.23）。<\/p>\n<h2>推演一：LQR 代价结构与 Riccati 反馈推导链<\/h2>\n<p><strong>前提 A<\/strong>：线性系统 <span class=\"katex-inline\">\\dot x=Ax+Bu<\/span>，全状态可测；<span class=\"katex-inline\">Q=Q^<em>\\succeq0<\/span>，<span class=\"katex-inline\">R=R^<\/em>\\succ0<\/span>。 <strong>前提 B<\/strong>：在所有可测状态反馈律中最小化二次积分代价 <span class=\"katex-inline\">J<\/span>。<\/p>\n<ul><li>\n第一步，代价拆成状态项 <span class=\"katex-inline\">x^<em>Qx<\/span> 与控制项 <span class=\"katex-inline\">u^<\/em>Ru<\/span>。<span class=\"katex-inline\">Q<\/span> 对角元对应各状态偏差的权重，<span class=\"katex-inline\">R<\/span> 对角元对应各作动通道的能量权重；<span class=\"katex-inline\">R<\/span> 太小会让控制量激进，<span class=\"katex-inline\">R<\/span> 太大则状态调节迟缓（PDF 第 316 页）。\n<\/li><li>\n第二步，变分法/动态规划引入值函数 <span class=\"katex-inline\">V(x)=x^<em>Px<\/span>，<span class=\"katex-inline\">P<\/span> 待定对称矩阵。沿闭环轨迹对 <span class=\"katex-inline\">V<\/span> 求时间导数，代入 <span class=\"katex-inline\">\\dot x=Ax+Bu<\/span>，并与被积函数 <span class=\"katex-inline\">x^<\/em>Qx+u^*Ru<\/span> 配平，得到关于 <span class=\"katex-inline\">P<\/span> 的代数 Riccati 方程。\n<\/li><li>\n第三步，对 <span class=\"katex-inline\">u<\/span> 配平方后，最优控制出现在控制项导数为零处：<span class=\"katex-inline\">u^<em>=-R^{-1}B^<\/em>Px<\/span>，即 <span class=\"katex-inline\">u=-K_rx<\/span>，<span class=\"katex-inline\">K_r=R^{-1}B^*P<\/span>。<span class=\"katex-inline\">P<\/span> 由 Riccati 方程解出后反馈增益是常数矩阵（PDF 第 317 页图 8.9）。\n<\/li><li>\n第四步，闭环矩阵 <span class=\"katex-inline\">A-BK_r<\/span> 的特征值决定闭环稳定性；LQR 在二次代价意义下最优，但不直接保证鲁棒性——时延、未建模动态与噪声仍需第 8.8 节鲁棒控制与频域方法处理（PDF 第 316 页）。\n<\/li><li>\n复杂度口径：Riccati 方程是 <span class=\"katex-inline\">n\\times n<\/span> 矩阵代数方程，求解代价随 <span class=\"katex-inline\">n^3<\/span> 量级；高维系统直接做 LQR 不现实，这也是先 ROM 降维、再在 <span class=\"katex-inline\">r<\/span> 维上设计控制器的原因（PDF 第 317 页）。\n<\/ul>\n<h2>推演二：POD-Galerkin 投影推导<\/h2>\n<p><strong>前提 C<\/strong>：高维 PDE/ODE 写为 <span class=\"katex-inline\">\\dot u=Lu+N(u,\\beta)<\/span>；快照矩阵 SVD 给出正交基 <span class=\"katex-inline\">\\Phi\\in\\mathbb{R}^{n\\times r}<\/span>，<span class=\"katex-inline\">\\Phi^T\\Phi=I<\/span>。 <strong>前提 D<\/strong>：解在基上展开 <span class=\"katex-inline\">u\\approx\\Phi a(t)<\/span>，<span class=\"katex-inline\">a\\in\\mathbb{R}^r<\/span>，<span class=\"katex-inline\">r\\ll n<\/span>。<\/p>\n<ul><li>\n第一步，代入方程：<span class=\"katex-inline\">\\Phi\\dot a=L\\Phi a+N(\\Phi a,\\beta)<\/span>。\n<\/li><li>\n第二步，两边左乘 <span class=\"katex-inline\">\\Phi^T<\/span>（Galerkin 投影）：利用 <span class=\"katex-inline\">\\Phi^T\\Phi=I<\/span>，左端得 <span class=\"katex-inline\">\\dot a<\/span>；右端线性项 <span class=\"katex-inline\">\\Phi^TL\\Phi a<\/span>，非线性项 <span class=\"katex-inline\">\\Phi^TN(\\Phi a,\\beta)<\/span>。\n<\/li><li>\n第三步，得到 <span class=\"katex-inline\">r<\/span> 维方程组（公式 11.21）。模态间耦合由非线性项 <span class=\"katex-inline\">N(\\cdot)<\/span> 决定；非线性的标志正是产生模态混合（PDF 第 401 页公式 11.10 附近）。\n<\/li><li>\n第四步，残差正交性：Galerkin 投影要求残差与基张成子空间正交；若真实解不在该子空间内，投影误差随截断阶数 <span class=\"katex-inline\">r<\/span> 增大而减小，但也受数据覆盖的参数/工况范围限制。\n<\/li><li>\n第五步，超降阶问题：<span class=\"katex-inline\">N(\\Phi a,\\beta)<\/span> 仍可能要求在 <span class=\"katex-inline\">n<\/span> 维状态上求值。Navier–Stokes 这类二次非线性项部分可离线预计算；参数化系统随 <span class=\"katex-inline\">\\beta<\/span> 改变模态，需要反复求值，DEIM/Gappy POD 用少量插值节点近似非线性项（PDF 第 406、427 页）。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[高维快照] --&gt; B[POD/SVD 模态 Φ]\nB --&gt; C[Galerkin 投影]
