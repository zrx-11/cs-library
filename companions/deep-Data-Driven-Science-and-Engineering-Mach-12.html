n class=\"katex-inline\">x_2<\/span><\/th><th><span class=\"katex-inline\">x_3<\/span><\/th><th>残差 <span class=\"katex-inline\">\\|Ax-b\\|_2<\/span><\/th><th><span class=\"katex-inline\">\\|x\\|_1<\/span><\/th><\/tr><\/thead><tbody><tr><td>0.6<\/td><td>0.2500<\/td><td>0.7250<\/td><td>2.2250<\/td><td>1.2104<\/td><td>3.2000<\/td><\/tr><tr><td>1.5<\/td><td>0.2500<\/td><td>0.5000<\/td><td>2.0000<\/td><td>1.3919<\/td><td>2.7500<\/td><\/tr><tr><td>3.0<\/td><td>0.2500<\/td><td>0.1250<\/td><td>1.6250<\/td><td>1.9039<\/td><td>2.0000<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>第三步，路径解读<\/strong>。<span class=\"katex-inline\">\\lambda<\/span> 从 0.6 升到 3.0，第二、第三系数同向收缩，<span class=\"katex-inline\">\\|x\\|_1<\/span> 从 3.2000 降到 2.0000；残差从 1.2104 升到 1.9039，拟合让位于稀疏。本设计中第一列与第三列在第 1、第 5 行部分重叠，<span class=\"katex-inline\">\\lambda<\/span> 加大时第三列先被压缩；该组数据没有系数被压到精确零，说明列间相关性不足以触发坐标轴顶点选择。<\/p>\n<p><strong>第四步，去偏对照<\/strong>。若某档保留活跃集 <span class=\"katex-inline\">S<\/span>，在 <span class=\"katex-inline\">A_S<\/span> 上重跑最小二乘可消除收缩偏差；被压零的列不进入去偏子矩阵。去偏后方差随 <span class=\"katex-inline\">A_S^*A_S<\/span> 条件数上升。<\/p>\n<ul><li>\n迭代口径。坐标下降每轮扫描 <span class=\"katex-inline\">p<\/span> 个坐标，单坐标更新代价与列内积有关；5000 轮收敛后系数变动小于阈值。<span class=\"katex-inline\">\\lambda<\/span> 路径由大到小扫描时上一档解热启动，整条路径求解低于每档独立初始化。交叉验证外层把同一求解重复 <span class=\"katex-inline\">K<\/span> 折，计算量随折数放大。\n<\/ul>\n<h2>对抗性追问：两列高度相关时 LASSO 会把哪个留下<\/h2>\n<p>设 <span class=\"katex-inline\">A_2=A_1+\\delta e<\/span>，<span class=\"katex-inline\">\\delta<\/span> 很小。最小二乘把效应分摊到两列，软阈值按各自内积大小选其一；<span class=\"katex-inline\">\\delta<\/span> 方向上的微小扰动可能翻转选择对象。判据：计算设计列的相关矩阵，接近 1 的列对属于不稳定组；此时看交叉验证误差在不同折上活跃集是否一致，不一致就换 elastic net（<span class=\"katex-inline\">\\ell_1+\\alpha\\ell_2<\/span>）让相关列成组保留，或先做变量聚类合并冗余列。LASSO 给的是一个稀疏代表，不保证选出的列就是真实成因。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出 LASSO 与 ridge 的目标函数，指出两者系数形态差别。\n<\/li><li>\n正交设计下软阈值公式是什么？阈值以内的系数如何处理？\n<\/li><li>\nIndex1SE 准则相对最小误差准则偏向什么？为什么这样选？\n<\/li><li>\n为什么 LASSO 系数有偏？去偏步骤在哪些列上重估？\n<\/li><li>\n预测变量高度相关时 <span class=\"katex-inline\">\\ell_1<\/span> 选择为什么不稳定？哪种惩罚组合缓解？\n<\/ol><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：Data-Driven Science and Engineering: Machine Learning, Dynamical Systems, and Control · p.259<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">SVD 与最优低秩近似<\/a><\/span><\/div><h1>c05 DMD 与 Koopman 算子<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch03（7.2 Dynamic Mode Decomposition，PDF 第 259–265 页；7.4 Koopman Operator Theory，PDF 第 280–285 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>实验或仿真拿到一串高维快照，支配方程未知、系统可能非线性。需要回答：能不能不写方程，直接从数据里找出一组随时间指数演化的模态，每个模态带自己的增长率和振荡频率？这些模态与非线性系统的内在谱是什么关系？<\/p>\n<p>不做这一层，高维时间序列只能逐点观测，无法外推预测；直接拟合 <span class=\"katex-inline\">n\\times n<\/span> 状态算子在 <span class=\"katex-inline\">n<\/span> 大时不可行，且把非线性系统硬套线性模型需要说明逼近的是谁。DMD 给数据驱动的线性模态分解，Koopman 理论给&quot;非线性系统可被线性算子刻画&quot;的严格视角（PDF 第 258–259 页）。<\/p>\n<h2>定义逐句拆解<\/h2>\n<p><strong>DMD（dynamic mode decomposition）<\/strong>：从成对快照矩阵回归最佳拟合线性算子<\/p>\n<div class=\"katex-block\">X'\\approx AX,\\quad A=\\arg\\min_A\\|X'-AX\\|_F=X'X^\\dagger<\/div>\n<p>均匀采样下即 <span class=\"katex-inline\">x_{k+1}\\approx Ax_k<\/span>（PDF 第 260 页公式 7.15–7.16）。<\/p>\n<p>逐句拆开：<\/p>\n<ul><li>\n&quot;成对快照&quot;：<span class=\"katex-inline\">X=[x_0,\\dots,x_{m-1}]<\/span>，<span class=\"katex-inline\">X&#x27;=[x_1,\\dots,x_m]<\/span>，相邻时刻对齐。\n<\/li><li>\n&quot;最佳拟合&quot;：在 Frobenius 范数下最小化一步预测误差；<span class=\"katex-inline\">X^\\dagger<\/span> 是伪逆。\n<\/li><li>\n&quot;模态与谱&quot;：<span class=\"katex-inline\">A<\/span> 的特征值 <span class=\"katex-inline\">\\lambda_j=a_j+ib_j<\/span>，每个 DMD 模态关联一个增长率与一个频率（PDF 第 259 页）。\n<\/li><li>\n&quot;POD 降秩&quot;：先对 <span class=\"katex-inline\">X<\/span> 截断 SVD 取秩 <span class=\"katex-inline\">r<\/span>，在 POD 坐标下回归 <span class=\"katex-inline\">\\tilde A=\\tilde U^*X&#x27;\\tilde V\\tilde\\Sigma^{-1}<\/span>，<span class=\"katex-inline\">\\tilde A<\/span> 与 <span class=\"katex-inline\">A<\/span> 共享非零特征值（PDF 第 261 页公式 7.19）。\n<\/ul>\n<p><strong>Koopman 算子<\/strong>：1931 年 Koopman 提出，作用在状态测量函数（observable）Hilbert 空间上的无穷维线性算子<\/p>\n<div class=\"katex-block\">\\mathcal{K}_t g(x)=g(F_t(x))<\/div>\n<p>连续时间生成元 <span class=\"katex-inline\">\\mathcal{K}g=\\lim_{t\\to0}(g\\circ F_t-g)/t<\/span>（PDF 第 280–281 页公式 7.53–7.56）。算子线性，但其谱无穷维；有限维矩阵逼近是当前研究目标。<\/p>\n<p><strong>DMD 与 Koopman 的关系<\/strong>：当测量取直接状态 <span class=\"katex-inline\">g(x)=x<\/span> 时，DMD 算子是 Koopman 算子在这一有限测量子空间上的最佳拟合逼近（PDF 第 260 页）。<\/p>\n<p><strong>正例<\/strong>：流体尾流的周期涡街，DMD 分解出衰减/中性模态，频率对应涡脱落频率；快照含实验与仿真数据均可，不依赖支配方程（PDF 第 259 页）。 <strong>反例<\/strong>：系统带作动输入却直接跑 DMD，内部动力学与作动效应被混淆，模型错误；需用 DMDc 把控制量并入回归（PDF 第 370 页）。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>前提<\/strong>：快照均匀采样 <span class=\"katex-inline\">\\Delta t<\/span>；<span class=\"katex-inline\">X<\/span> 近似秩 <span class=\"katex-inline\">r<\/span>；先在 POD 基上回归。<\/p>\n<ol><li>\n<strong>回归解<\/strong>。<span class=\"katex-inline\">\\min_A\\|X&#x27;-AX\\|_F<\/span> 的正规方程解为 <span class=\"katex-inline\">A=X&#x27;X^\\dagger<\/span>。<span class=\"katex-inline\">X<\/span> 经济 SVD <span class=\"katex-inline\">X=\\tilde U\\tilde\\Sigma\\tilde V^<em><\/span>，伪逆 <span class=\"katex-inline\">X^\\dagger=\\tilde V\\tilde\\Sigma^{-1}\\tilde U^<\/em><\/span>，故 <span class=\"katex-inline\">A=X&#x27;\\tilde V\\tilde\\Sigma^{-1}\\tilde U^*<\/span>（PDF 第 261 页公式 7.18）。\n<\/li><li>\n<strong>压缩表示<\/strong>。全 <span class=\"katex-inline\">A<\/span> 是 <span class=\"katex-inline\">n\\times n<\/span>，不可直接分解。投影到 POD 坐标：<span class=\"katex-inline\">\\tilde A=\\tilde U^<em>A\\tilde U=\\tilde U^<\/em>X&#x27;\\tilde V\\tilde\\Sigma^{-1}<\/span>。<span class=\"katex-inline\">\\tilde U^*\\tilde U=I<\/span>，<span class=\"katex-inline\">\\tilde A<\/span> 是 <span class=\"katex-inline\">r\\times r<\/span>。\n<\/li><li>\n<strong>非零特征值一致<\/strong>。<span class=\"katex-inline\">\\tilde A=\\tilde U^<em>A\\tilde U<\/span> 是 <span class=\"katex-inline\">A<\/span> 在不变/近似不变子空间上的压缩；<span class=\"katex-inline\">\\tilde A<\/span> 与 <span class=\"katex-inline\">A<\/span> 共享全部非零特征值，状态 <span class=\"katex-inline\">\\tilde x_k=\\tilde U^<\/em>x_k<\/span> 满足 <span class=\"katex-inline\">\\tilde x_{k+1}=\\tilde A\\tilde x_k<\/span>（PDF 第 261 页公式 7.19–7.20）。\n<\/li><li>\n<strong>谱到演化<\/strong>。特征分解 <span class=\"katex-inline\">\\tilde A w_j=\\lambda_jw_j<\/span>，离散演化 <span class=\"katex-inline\">x_k\\sim\\sum_jw_j\\lambda_j^k v_j<\/span>。换算连续时间：增长率 <span class=\"katex-inline\">\\ln|\\lambda_j|/\\Delta t<\/span>，角频率 <span class=\"katex-inline\">\\arg(\\lambda_j)/\\Delta t<\/span>。<span class=\"katex-inline\">|\\lambda|&gt;1<\/span> 增长，<span class=\"katex-inline\">&lt;1<\/span> 衰减，<span class=\"katex-inline\">=1<\/span> 中性振荡。\n<\/li><li>\n<strong>Koopman 线性性<\/strong>。<span class=\"katex-inline\">\\mathcal{K}_t(ag_1+bg_2)=a\\mathcal{K}_tg_1+b\\mathcal{K}_tg_2<\/span>，算子本身线性；本征可观测量 <span class=\"katex-inline\">\\varphi_j<\/span> 满足 <span class=\"katex-inline\">\\mathcal{K}_t\\varphi_j=\\lambda_j\\varphi_j<\/span>，任意可观测量按本征函数展开 <span class=\"katex-inline\">g_i(x)=\\sum_jv_{ij}\\varphi_j(x)<\/span>（PDF 第 283 页公式 7.65–7.66）。\n<\/li><li>\n<strong>有限逼近的位置<\/strong>。状态 <span class=\"katex-inline\">g(x)=x<\/span> 经动力学迭代后在 Koopman 基中表示可能极复杂；找到张成有限子空间的本征函数集，才能用矩阵逼近无穷维算子。DMD 只覆盖直接测量子空间，扩展观测函数（延迟坐标、非线性项）得到 eDMD 等改进。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ol><li>\nDMD 是线性拟合；非线性系统的代表能力来自 Koopman 逼近，不代表状态空间内存在线性方程。\n<\/li><li>\n截断秩 <span class=\"katex-inline\">r<\/span> 选择关键：<span class=\"katex-inline\">r<\/span> 小丢模态，<span class=\"katex-inline\">r<\/span> 大纳噪声方向；本书建议 Gavish–Donoho 硬阈值从噪声数据定 <span class=\"katex-inline\">r<\/span>（PDF 第 261 页）。\n<\/li><li>\n采样需时间对齐；Tu 等人的精确 DMD 框架可处理非均匀采样与多段拼接数据（PDF 第 259–260 页）。\n<\/li><li>\nKoopman 谱可能连续：混沌、准周期系统不存在可数本征函数集，有限 DMD 特征值随样本窗漂移。\n<\/li><li>\n<strong>失败案例<\/strong>：带控制系统朴素 DMD。作动信号与状态演化混在同一份快照里，回归出的&quot;模态&quot;部分是作动响应；DMDc 把 <span class=\"katex-inline\">u<\/span> 作为回归输入分离两类效应（PDF 第 370 页）。\n<\/li><li>\n<strong>失败案例<\/strong>：快照时长不足。慢模态增长率与低频频率需要足够长窗分辨；短数据上相邻特征值挤在一起，误差被放大。\n<\/ol>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>DMD vs 标准特征值分解<\/strong>：标准分解需要已知 <span class=\"katex-inline\">A<\/span>；DMD 从 <span class=\"katex-inline\">X,X&#x27;<\/span> 回归 <span class=\"katex-inline\">A<\/span> 再分解，是数据驱动步骤。\n<\/li><li>\n<strong>DMD 模态 vs POD 模态<\/strong>：POD 模态（<span class=\"katex-inline\">\\tilde U<\/span> 列）按空间能量排序，不含时间信息；DMD 模态每个带时间谱（增长率、频率），是在 POD 坐标回归后得到的。\n<\/li><li>\n<strong>Koopman 算子 vs 状态演化方程<\/strong>：Koopman 推进函数 <span class=\"katex-inline\">g<\/span>，不直接推进状态 <span class=\"katex-inline\">x<\/span>；状态只是众多可观测量之一，且其表示迭代后可能复杂。\n<\/li><li>\n<strong>离散 <span class=\"katex-inline\">\\lambda<\/span> vs 连续 <span class=\"katex-inline\">s<\/span><\/strong>：<span class=\"katex-inline\">\\lambda=e^{s\\Delta t}<\/span>，<span class=\"katex-inline\">s=\\ln\\lambda/\\Delta t<\/span>；混用离散增长率与连续增长率会误判稳定边界。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：c01 SVD 降秩与伪逆；线性系统 <span class=\"katex-inline\">\\dot x=Ax<\/span> 的特征值解；c03 稀疏性作为模态选择的可选手段。\n<\/li><li>\n后继：c07 延迟嵌入/Hankel 矩阵扩展 DMD 测量子空间；c06 SINDy 走回归路线辨识非线性右端；c09 在 Koopman/DMD 坐标里接 LQR 与 MPC；c08 POD 模态与 DMD 的 POD 步骤同源。\n<\/li><li>\n串联：DMD 是 SVD 空间分解与 FFT 频率辨识的结合（PDF 第 259 页），上接降维、下接控制。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（DMD 与 Koopman 算子）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：DMD 算子回归、谱换算与二阶振子数值算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把&quot;快照回归出的 <span class=\"katex-inline\">\\tilde A<\/span> 特征值对应真实增长率与频率&quot;推到底，逐级倒查：<\/p>\n<ol><li>\n特征值解释依赖离散演化 <span class=\"katex-inline\">x_{k+1}=Ax_k<\/span> 与连续系统 <span class=\"katex-inline\">\\dot x=Ax<\/span> 的换算关系，倒查到 <span class=\"katex-inline\">A_d=e^{A_c\\Delta t}<\/span>。\n<\/li><li>\n回归出 <span class=\"katex-inline\">A=X&#x27;X^\\dagger<\/span> 依赖伪逆存在；快照矩阵秩不足时用截断 SVD 的伪逆，倒查到 c01 的经济 SVD 与 <span class=\"katex-inline\">\\tilde U^*\\tilde U=I<\/span>。\n<\/li><li>\n只分解 <span class=\"katex-inline\">r\\times r<\/span> 的 <span class=\"katex-inline\">\\tilde A<\/span> 依赖其与全 <span class=\"katex-inline\">A<\/span> 共享非零特征值，倒查到投影子空间的不变性。\n<\/li><li>\n增长率/频率解释依赖特征值在单位圆上的几何：模长给衰减/增长，辐角给振荡。\n<\/li><li>\n该线性模型代表非线性系统，倒查到 Koopman 算子视角：DMD 是直接测量子空间上的有限逼近，逼近范围受观测函数选择限制。\n<\/ol>\n<p>链条断掉：采样间隔 <span class=\"katex-inline\">\\Delta t<\/span> 未记录，谱换算无法进行；快照带控制输入未分离，回归混入作动效应；观测子空间不含本征函数，有限逼近偏离真实谱。<\/p>\n<h2>正向推导<\/h2>\n<ul><li>\n第一步，快照排列。<span class=\"katex-inline\">X=[x_0,\\dots,x_{m-1}]<\/span>，<span class=\"katex-inline\">X&#x27;=[x_1,\\dots,x_m]<\/span>。回归目标 <span class=\"katex-inline\">A=\\arg\\min_A\\|X&#x27;-AX\\|_F<\/span>。\n<\/li><li>\n第二步，伪逆解。对固定 <span class=\"katex-inline\">X<\/span>，正规方程给出 <span class=\"katex-inline\">A=X&#x27;X^\\dagger<\/span>。<span class=\"katex-inline\">X<\/span> 经济 SVD <span class=\"katex-inline\">X=\\tilde U\\tilde\\Sigma\\tilde V^<em><\/span>，<span class=\"katex-inline\">X^\\dagger=\\tilde V\\tilde\\Sigma^{-1}\\tilde U^<\/em><\/span>，代入 <span class=\"katex-inline\">A=X&#x27;\\tilde V\\tilde\\Sigma^{-1}\\tilde U^*<\/span>。\n<\/li><li>\n第三步，POD 坐标投影。<span class=\"katex-inline\">\\tilde A=\\tilde U^<em>A\\tilde U=\\tilde U^<\/em>X&#x27;\\tilde V\\tilde\\Sigma^{-1}<\/span>。<span class=\"katex-inline\">\\tilde U<\/span> 列正交 <span class=\"katex-inline\">\\tilde U^<em>\\tilde U=I<\/span>；坐标 <span class=\"katex-inline\">\\tilde x=\\tilde U^<\/em>x<\/span>，演化 <span class=\"katex-inline\">\\tilde x_{k+1}=\\tilde A\\tilde x_k<\/span>，全状态 <span class=\"katex-inline\">x_k=\\tilde U\\tilde x_k<\/span> 重构。\n<\/li><li>\n第四步，谱一致性。设 <span class=\"katex-inline\">A w=\\lambda w<\/span>，左乘 <span class=\"katex-inline\">\\tilde U^<em><\/span>：<span class=\"katex-inline\">\\tilde U^<\/em>Aw=\\lambda\\tilde U^<em>w<\/span>；在 POD 子空间内 <span class=\"katex-inline\">\\tilde A(\\tilde U^<\/em>w)=\\lambda(\\tilde U^*w)<\/span>。非零特征值在压缩表示中保留，只需分解 <span class=\"katex-inline\">\\tilde A<\/span>。\n<\/li><li>\n第五步，离散到连续换算。离散系统 <span class=\"katex-inline\">x_{k+1}=A_dx_k<\/span>，连续系统 <span class=\"katex-inline\">\\dot x=A_cx<\/span>，<span class=\"katex-inline\">A_d=e^{A_c\\Delta t}<\/span>。特征值对应 <span class=\"katex-inline\">\\lambda=e^{s\\Delta t}<\/span>，反解\n<\/ul>\n<div class=\"katex-block\">s=\\frac{\\ln\\lambda}{\\Delta t}=\\frac{\\ln|\\lambda|}{\\Delta t}+i\\frac{\\arg\\lambda}{\\Delta t}<\/div>\n<p>实部为增长率，虚部为角频率；<span class=\"katex-inline\">|\\lambda|=e^{\\operatorname{Re}(s)\\Delta t}<\/span>，<span class=\"katex-inline\">\\arg\\lambda=\\operatorname{Im}(s)\\Delta t<\/span>。<\/p>\n<ul><li>\n第六步，Koopman 对接。<span class=\"katex-inline\">\\mathcal{K}_tg(x)=g(F_t(x))<\/span>，线性作用于函数空间；DMD 取 <span class=\"katex-inline\">g(x)=x<\/span>，在该有限函数子空间上最佳拟合 <span class=\"katex-inline\">\\mathcal{K}_{\\Delta t}<\/span>。测量函数扩展为 <span class=\"katex-inline\">g(x)=(x,\\ x^2,\\ \\text{延迟坐标},\\dots)<\/span> 时，逼近子空间扩大，对应 eDMD 等方法。\n<\/li><li>\n复杂度口径：SVD 对 <span class=\"katex-inline\">n\\times m<\/span> 快照矩阵 <span class=\"katex-inline\">O(nm\\min(n,m))<\/span>；构造 <span class=\"katex-inline\">\\tilde U^*X&#x27;<\/span> 为 <span class=\"katex-inline\">O(nmr)<\/span>，<span class=\"katex-inline\">\\tilde A<\/span> 特征分解 <span class=\"katex-inline\">O(r^3)<\/span>；<span class=\"katex-inline\">r\\ll\\min(n,m)<\/span> 时主导代价是一次 SVD。\n<\/ul>\n<h2>数值算例：二阶无阻尼振子的 DMD<\/h2>\n<p><strong>已知条件<\/strong>：连续系统<\/p>\n<div class=\"katex-block\">\\dot x=A_cx,\\quad A_c=\\begin{bmatrix}0&1\\\\-\\omega^2&0\\end{bmatrix},\\quad \\omega=2\\ \\text{rad/s},\\quad \\Delta t=0.05\\text{ s}<\/div>\n<p><strong>第一步，精确离散化<\/strong>。<span class=\"katex-inline\">A_d=e^{A_c\\Delta t}<\/span>，数值计算<\/p>\n<div class=\"katex-block\">A_d=\\begin{bmatrix}0.9950&0.0499\\\\-0.1997&0.9950\\end{bmatrix}<\/div>\n<p>初值 <span class=\"katex-inline\">x_0=(1,0)^T<\/span>，迭代得前三个快照<\/p>\n<div class=\"katex-block\">x_1=\\begin{bmatrix}0.9950\\\\-0.1997\\end{bmatrix},\\quad x_2=\\begin{bmatrix}0.9801\\\\-0.3973\\end{bmatrix}<\/div>\n<p><strong>第二步，构造成对快照<\/strong>。取 <span class=\"katex-inline\">X=[x_0,x_1]<\/span>，<span class=\"katex-inline\">X&#x27;=[x_1,x_2]<\/span>，回归 <span class=\"katex-inline\">A_{\\text{DMD}}=X&#x27;X^\\dagger<\/span>。两维两快照满秩，伪逆即逆；数值上回归矩阵与 <span class=\"katex-inline\">A_d<\/span> 吻合。 <strong>第三步，特征值分解<\/strong>。<span class=\"katex-inline\">A_{\\text{DMD}}<\/span> 特征值<\/p>\n<div class=\"katex-block\">\\lambda_{1,2}=0.9950\\pm0.0998i<\/div>\n<p>模长 <span class=\"katex-inline\">|\\lambda|=1.000<\/span>，辐角 <span class=\"katex-inline\">\\arg\\lambda=\\pm0.0997<\/span> rad。 <strong>第四步，换算连续时间量<\/strong>。<\/p>\n<div class=\"katex-block\">\\text{增长率}=\\frac{\\ln|\\lambda|}{\\Delta t}=0.000,\\quad \\text{角频率}=\\frac{|\\arg\\lambda|}{\\Delta t}=\\frac{0.0997}{0.05}=2.00\\ \\text{rad/s}<\/div>\n<p>频率 <span class=\"katex-inline\">f=\\omega/(2\\pi)=2/6.283=0.3183<\/span> Hz。与真实 <span class=\"katex-inline\">\\omega=2<\/span>、无阻尼增长率 0 核对一致。 <strong>第五步，模态解释<\/strong>。共轭特征值对对应一个中性振荡模态：模长为 1 不增不减，辐角给出振荡周期 <span class=\"katex-inline\">T=2\\pi/\\omega=3.14<\/span> s。若噪声使 <span class=\"katex-inline\">|\\lambda|&gt;1<\/span>，DMD 会误判为增长模态；若截断把该模态丢掉，预测转为衰减。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：连续谱系统。混沌吸引子上 Koopman 谱连续，有限快照给出的离散特征值随窗长与噪声漂移，不能当作稳定本征函数。 反例二：<span class=\"katex-inline\">r<\/span> 选错。<span class=\"katex-inline\">r<\/span> 小截断真实慢模态；<span class=\"katex-inline\">r<\/span> 大把噪声方向纳入 <span class=\"katex-inline\">\\tilde A<\/span>，特征值模长与辐角被扰动，出现虚假增长模态。 反例三：采样间隔过大。<span class=\"katex-inline\">\\arg\\lambda<\/span> 卷叠，频率超过 Nyquist 频率 <span class=\"katex-inline\">\\pi/\\Delta t<\/span> 时发生混叠；本算例 <span class=\"katex-inline\">\\omega=2&lt;\\pi/0.05=62.8<\/span>，无混叠。 反例四：带作动数据。回归 <span class=\"katex-inline\">X&#x27;\\approx AX<\/span> 把 <span class=\"katex-inline\">u<\/span> 的效应也算进 <span class=\"katex-inline\">A<\/span>，DMDc 形式为 <span class=\"katex-inline\">X&#x27;\\approx AX+Bu<\/span> 才能分离。<\/p>\n<h2>与相邻概念的推导衔接<\/h2>\n<p>c01 SVD 提供 <span class=\"katex-inline\">\\tilde U,\\tilde\\Sigma,\\tilde V<\/span> 与伪逆；c07 Hankel 延迟嵌入把标量序列扩成多坐标快照，扩大 DMD 测量子空间；c06 SINDy 从同一批数据走另一条路，直接辨识右端函数；c09 在 DMD/Koopman 坐标上设计反馈，线性控制理论工具可直接套用。<\/p>\n<h2>推导中容易跳过的环节<\/h2>\n<ul><li>\n<span class=\"katex-inline\">\\tilde A<\/span> 与 <span class=\"katex-inline\">A<\/span> 共享非零特征值要通过左乘 <span class=\"katex-inline\">\\tilde U^*<\/span> 的特征方程推导，不能直接宣称小矩阵等价于大矩阵。\n<\/li><li>\n<span class=\"katex-inline\">\\ln\\lambda<\/span> 是复对数，辐角要按主值取；离散模长与连续实部的指数关系不能漏 <span class=\"katex-inline\">\\Delta t<\/span>。\n<\/li><li>\nKoopman 算子作用对象是函数，<span class=\"katex-inline\">g(x)=x<\/span> 只是一个可观测量；把 DMD 谱等同于 Koopman 全谱是越界。\n<\/ul>\n<h2>补充推演：回归解的正规方程、变体与噪声敏感性<\/h2>\n<ul><li>\n正规方程推导。<span class=\"katex-inline\">\\min_A\\|X&#x27;-AX\\|_F^2<\/span> 对 <span class=\"katex-inline\">A<\/span> 求导，梯度为 <span class=\"katex-inline\">-2(X&#x27;-AX)X^<em><\/span>，置零得 <span class=\"katex-inline\">AX X^<\/em>=X&#x27;X^*<\/span>；<span class=\"katex-inline\">X<\/span> 满行/列秩时 <span class=\"katex-inline\">A=X&#x27;X^\\dagger<\/span>。<span class=\"katex-inline\">X<\/span> 亏秩时用截断 SVD 伪逆，避免小奇异值放大噪声。\n<\/li><li>\n精确 DMD 与优化 DMD。Tu 等人的精确 DMD 框架给出严格数学定义，可处理非均匀采样与多段拼接；优化 DMD 把回归推广到指数时间动力学拟合，改善模态与特征值计算（PDF 第 259–260 页）。\n<\/li><li>\n扩展测量 eDMD。测量函数从 <span class=\"katex-inline\">g(x)=x<\/span> 扩到含非线性项、延迟坐标的向量，逼近子空间扩大，有限维模型更接近真实 Koopman 谱；测量函数选择是方法精度的主要杠杆。\n<\/li><li>\n噪声对谱的扰动。快照含噪时 SVD 截断把噪声方向挡在 <span class=\"katex-inline\">\\tilde U<\/span> 外；若 <span class=\"katex-inline\">r<\/span> 取大，噪声方向进入 <span class=\"katex-inline\">\\tilde A<\/span>，特征值模长与辐角被扰动，出现虚假增长模态。增长率由 <span class=\"katex-inline\">\\ln|\\lambda|/\\Delta t<\/span> 给出，模长的小偏差经对数放大为增长率偏差。\n<\/li><li>\n采样与混叠。特征值辐角主值在 <span class=\"katex-inline\">(-\\pi,\\pi]<\/span>；连续频率超过 Nyquist 频率 <span class=\"katex-inline\">\\pi/\\Delta t<\/span> 时离散谱卷叠，DMD 给出混叠频率。\n<\/li><li>\n流式与多分辨率扩展。高分辨率数据用增量 SVD、快照 SVD 秩一更新做流式 DMD；多尺度瞬态现象用 mrDMD 分时间尺度分解（PDF 第 267–268 页）。\n<\/li><li>\n本算例补充。振子算例 <span class=\"katex-inline\">\\Delta t=0.05<\/span>，Nyquist 频率 <span class=\"katex-inline\">\\pi/\\Delta t=62.8<\/span> rad/s，真实 <span class=\"katex-inline\">\\omega=2<\/span> 远在带内；<span class=\"katex-inline\">|\\lambda|=1<\/span> 对应无阻尼，若数据加阻尼 <span class=\"katex-inline\">c<\/span>，连续增长率应为 <span class=\"katex-inline\">-c/2<\/span>，模长 <span class=\"katex-inline\">e^{-c\\Delta t/2}<\/span>。\n<\/ul>\n<h2>补充推演（二）：离散化指数与谱扰动复核<\/h2>\n<ul><li>\n<span class=\"katex-inline\">A_d<\/span> 元素核对。连续二阶振子 <span class=\"katex-inline\">A_c=\\begin{bmatrix}0&amp;1\\\\-\\omega^2&amp;0\\end{bmatrix}<\/span>，指数化 <span class=\"katex-inline\">e^{A_c\\Delta t}<\/span> 展开为 <span class=\"katex-inline\">\\cos(\\omega\\Delta t)I+\\sin(\\omega\\Delta t)A_c/\\omega<\/span>。<span class=\"katex-inline\">\\omega=2,\\Delta t=0.05<\/span>，<span class=\"katex-inline\">\\omega\\Delta t=0.1<\/span>：<span class=\"katex-inline\">\\cos0.1=0.9950<\/span>，<span class=\"katex-inline\">\\sin0.1/\\omega=0.0998/2=0.0499<\/span>，<span class=\"katex-inline\">-\\omega\\sin0.1=-1.997<\/span>；矩阵元素与算例 <span class=\"katex-inline\">A_d=[[0.9950,0.0499],[-0.1997,0.9950]]<\/span> 逐项吻合。\n<\/li><li>\n状态迭代复核。<span class=\"katex-inline\">x_1=A_dx_0=(0.9950,-0.1997)<\/span>；<span class=\"katex-inline\">x_2=A_dx_1<\/span>，第一分量 <span class=\"katex-inline\">0.9950\\times0.9950+0.0499\\times(-0.1997)=0.9801<\/span>，第二分量 <span class=\"katex-inline\">-0.1997\\times0.9950+0.9950\\times(-0.1997)=-0.3973<\/span>，与算例一致。\n<\/li><li>\n复对数主值。<span class=\"katex-inline\">\\lambda=0.9950+0.0998i<\/span> 的辐角按主值取 <span class=\"katex-inline\">\\arg\\lambda=0.0997<\/span> rad；辐角超出 <span class=\"katex-inline\">(-\\pi,\\pi]<\/span> 时离散谱卷叠，连续频率换算失真，需回到采样间隔判断混叠。\n<\/li><li>\n噪声放大路径。增长率 <span class=\"katex-inline\">\\operatorname{Re}(s)=\\ln|\\lambda|/\\Delta t<\/span>；模长偏差 <span class=\"katex-inline\">\\delta|\\lambda|<\/span> 经对数近似为 <span class=\"katex-inline\">\\delta|\\lambda|/|\\lambda|<\/span>，再除以 <span class=\"katex-inline\">\\Delta t<\/span>，小采样间隔把模长误差放大成增长率误差。特征向量方向扰动不直接进频率读数，但会改变模态重构幅值。\n<\/li><li>\n谱一致性边界。<span class=\"katex-inline\">\\tilde A<\/span> 保留全 <span class=\"katex-inline\">A<\/span> 的非零特征值，零特征值方向被压缩；快照矩阵秩不足时被截断的方向在回归中不可见，DMD 谱不包含这些方向的信息。\n<\/ul>\n<h2>延伸推演：DMD 成立前提再拆一层<\/h2>\n<p>DMD 从快照回归出线性算子，谱解释为增长率与频率，依赖四条子条件。<\/p>\n<ul><li>\n子前提一：快照由时不变线性（或 Koopman 线性化）生成。回归 <span class=\"katex-inline\">X&#x27;\\approx AX<\/span> 假设相邻快照由同一个 <span class=\"katex-inline\">A<\/span> 推进；系统参数随时间变化时，单一 <span class=\"katex-inline\">A<\/span> 平均掉不同时段的动力学，特征值是各时段的混合。\n<\/li><li>\n子前提二：采样均匀且间隔满足谱分辨要求。<span class=\"katex-inline\">\\Delta t<\/span> 固定才能用 <span class=\"katex-inline\">A_d=e^{A_c\\Delta t}<\/span> 换算；频率超过 Nyquist 频率 <span class=\"katex-inline\">\\pi/\\Delta t<\/span> 时辐角卷叠，读出的频率是混叠值。\n<\/li><li>\n子前提三：快照覆盖可观子空间。测量函数 <span class=\"katex-inline\">g(x)=x<\/span> 张成的方向包含目标模态；本征函数不在直接测量子空间内时，有限维模型看不到该模态。\n<\/li><li>\n子前提四：秩截断合适。<span class=\"katex-inline\">r<\/span> 小截断真实慢模态，<span class=\"katex-inline\">r<\/span> 大把噪声方向纳入 <span class=\"katex-inline\">\\tilde A<\/span>；截断位置由奇异值谱膝点与留出预测误差共同判断。\n<\/li><li>\n去掉子前提的后果：时变致谱漂移，采样过疏致混叠，观测不足致模态缺失，截断失当致虚假增长或衰减。\n<\/ul>\n<h2>第二算例：带阻尼二阶振子的 DMD 辨识<\/h2>\n<p><strong>已知条件<\/strong>：连续系统<\/p>\n<div class=\"katex-block\">\\dot x=A_cx,\\quad A_c=\\begin{bmatrix}0&1\\\\-\\omega^2&-2\\zeta\\omega\\end{bmatrix},\\quad \\omega=3.0\\ \\text{rad/s},\\ \\zeta=0.15,\\ \\Delta t=0.05\\text{ s}<\/div>\n<p>阻尼系数 <span class=\"katex-inline\">2\\zeta\\omega=0.9<\/span>，<span class=\"katex-inline\">A_c=[[0,1],[-9,-0.9]]<\/span>。初值 <span class=\"katex-inline\">x_0=(1,0)^T<\/span>，迭代 20 步排成成对快照。<\/p>\n<pre class=\"lang-python\"><code>import numpy as np\nfrom scipy import linalg\nw, zeta, dt = 3.0, 0.15, 0.05\nAc = np.array([[0,1],[-w**2,-2*zeta*w]])\nAd = linalg.expm(Ac*dt)\n# 迭代生成轨迹后回归\nAdmd = Xp @ np.linalg.pinv(X)\nev = np.linalg.eigvals(Admd)<\/code><\/pre>\n<p><strong>第一步，精确离散化<\/strong>。<span class=\"katex-inline\">A_d=e^{A_c\\Delta t}<\/span> 实算<\/p>\n<div class=\"katex-block\">A_d=\\begin{bmatrix}0.9889&0.0487\\\\-0.4384&0.9451\\end{bmatrix}<\/div>\n<p><strong>第二步，DMD 回归<\/strong>。<span class=\"katex-inline\">X=[x_0,\\dots,x_{18}]<\/span>，<span class=\"katex-inline\">X&#x27;=[x_1,\\dots,x_{19}]<\/span>，<span class=\"katex-inline\">A_{\\text{DMD}}=X&#x27;X^\\dagger<\/span>。满秩下伪逆即逆，实算 <span class=\"katex-inline\">A_{\\text{DMD}}<\/span> 与 <span class=\"katex-inline\">A_d<\/span> 逐项吻合。<\/p>\n<p><strong>第三步，特征值与谱换算<\/strong>。<\/p>\n<div class=\"katex-block\">\\lambda_{1,2}=0.9670\\pm0.1445i,\\quad |\\lambda|=0.9778,\\quad |\\arg\\lambda|=0.1483\\text{ rad}<\/div>\n<p>换算连续时间量：<\/p>\n<div class=\"katex-block\">\\text{增长率}=\\frac{\\ln|\\lambda|}{\\Delta t}=\\frac{\\ln 0.9778}{0.05}=-0.4500,\\quad \\omega=\\frac{|\\arg\\lambda|}{\\Delta t}=2.9661\\text{ rad/s}<\/div>\n<p><strong>第四步，与真值核对<\/strong>。连续阻尼振子真值增长率 <span class=\"katex-inline\">-\\zeta\\omega=-0.15\\times3=-0.4500<\/span>，固有频率 <span class=\"katex-inline\">\\omega=3.000<\/span> rad/s。DMD 增长率误差 <span class=\"katex-inline\">0.0000<\/span>，频率误差 <span class=\"katex-inline\">|2.9661-3.000|=0.0339<\/span> rad/s，偏差来自 20 步有限快照与离散化近似；模长 <span class=\"katex-inline\">0.9778&lt;1<\/span> 对应衰减，与 <span class=\"katex-inline\">\\zeta&gt;0<\/span> 一致。<\/p>\n<ul><li>\n快照长度与谱方差。本算例 20 步快照，频率误差 0.0339 rad/s；快照加长后轨迹覆盖更多周期，特征值辐角估计方差下降。增长率由模长取对数得到，短窗内模长的小偏差经 <span class=\"katex-inline\">\\ln/\\Delta t<\/span> 放大，阻尼弱的模态增长率读数尤其敏感。\n<\/li><li>\n回归矩阵维度口径。两维系统满秩，伪逆即逆；高维快照先截断 SVD 取 <span class=\"katex-inline\">\\tilde U<\/span>，在 <span class=\"katex-inline\">r\\times r<\/span> 的 <span class=\"katex-inline\">\\tilde A<\/span> 上分解，非零特征值与全 <span class=\"katex-inline\">A<\/span> 共享。本算例维数等于截断阶数，投影步骤不带来压缩损失。\n<\/li><li>\n采样间隔复核。<span class=\"katex-inline\">\\omega=3<\/span> rad/s 对应 Nyquist 频率 <span class=\"katex-inline\">\\pi/\\Delta t=62.8<\/span> rad/s，远在带内；换更快的振荡或更疏的采样，辐角卷叠后频率读数不可信。\n<\/ul>\n<h2>对抗性追问：Koopman 谱连续时 DMD 特征值能当本征模态吗<\/h2>\n<p>混沌吸引子上 Koopman 谱连续，有限快照给出的离散特征值随窗口长度、初值段与噪声水平漂移，没有稳定的复本征函数。判据：把轨迹切成若干段分别跑 DMD，若对应特征值的模长与辐角在段间明显移动，说明谱是连续谱上的有限采样，不能写成稳定模态；此时用延迟坐标扩大子空间（c07）或接受 DMD 作为短期预测模型，不把特征值解释为长期本征结构。系统带强非线性时，直接测量子空间外的本征函数缺失，DMD 谱偏离全谱是子空间限制，不是算法误差。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出 DMD 回归目标与其伪逆解，说明为何先做截断 SVD。\n<\/li><li>\n<span class=\"katex-inline\">\\tilde A<\/span> 与全 <span class=\"katex-inline\">A<\/span> 的特征值有哪些相同、哪些不一定相同？\n<\/li><li>\n离散特征值 <span class=\"katex-inline\">\\lambda=0.995+0.0998i<\/span>，<span class=\"katex-inline\">\\Delta t=0.05<\/span>，增长率与角频率各是多少？\n<\/li><li>\nDMD 为什么说是 Koopman 算子在直接测量子空间上的逼近？扩大子空间有哪些途径？\n<\/li><li>\n带作动系统直接跑 DMD 会混淆哪两类效应？正确回归形式是什么？\n<\/ol><\/div><\/details>", "c06": "<div class=\"source-badge\">📖 出处：Data-Driven Science and Engineering: Machine Learning, Dynamical Systems, and Control · p.270<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">稀疏回归（LASSO）与正则化路径<\/a><\/span><\/div><h1>c06 SINDy：函数库与稀疏化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch03（7.3 Sparse Identification of Nonlinear Dynamics，PDF 第 270–276 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>从数据发现动力学方程，传统路径要么靠先验约束方程形式再做 Galerkin 投影，要么枚举少量启发式模型调参数。候选方程结构在组合上爆炸：<span class=\"katex-inline\">n<\/span> 个状态、库内 <span class=\"katex-inline\">p<\/span> 个候选项，每行方程选哪些项有 <span class=\"katex-inline\">2^p<\/span> 种组合。需要回答：能不能不靠专家猜结构，从测量数据里稀疏地挑出右端真正活跃的少数项，同时估出系数。<\/p>\n<p>不做这一层，要么把所有候选项都塞进方程，模型臃肿、共线项分摊系数、样本外失效；要么陷入组合搜索，计算量随库项数指数增长。SINDy 利用&quot;多数动力系统右端在候选函数空间里只有少量活跃项&quot;这一事实，把结构辨识变成稀疏回归问题（PDF 第 270 页）。<\/p>\n<h2>定义逐句拆解<\/h2>\n<p><strong>SINDy（sparse identification of nonlinear dynamics）<\/strong>：对系统 <span class=\"katex-inline\">\\dot x=f(x)<\/span>，先构造候选函数库 <span class=\"katex-inline\">\\Theta(X)<\/span>，再对每行方程做 <span class=\"katex-inline\">\\ell_1<\/span> 稀疏回归挑活跃项。<\/p>\n<p>逐句拆开：<\/p>\n<ul><li>\n&quot;候选函数库 <span class=\"katex-inline\">\\Theta(X)<\/span>&quot;：对每个快照生成常数项、一次项 <span class=\"katex-inline\">x_k<\/span>、二次项 <span class=\"katex-inline\">x_ix_j<\/span>、三次项等；本书示例用三阶多项式库 <code>poolData(x,n,3)<\/code>（PDF 第 272 页）。\n<\/li><li>\n&quot;数据方程 <span class=\"katex-inline\">\\dot X=\\Theta(X)\\Xi<\/span>&quot;：<span class=\"katex-inline\">\\dot X<\/span> 是状态导数快照矩阵，<span class=\"katex-inline\">\\Xi<\/span> 第 <span class=\"katex-inline\">k<\/span> 列 <span class=\"katex-inline\">\\xi_k<\/span> 决定第 <span class=\"katex-inline\">k<\/span> 行方程用哪些项（PDF 第 271 页公式 7.38）。\n<\/li><li>\n&quot;逐行稀疏回归&quot;：\n<\/ul>\n<div class=\"katex-block\">\\xi_k=\\arg\\min_{\\xi'_k}\\|\\dot X_k-\\Theta(X)\\xi'_k\\|_2+\\lambda\\|\\xi'_k\\|_1<\/div>\n<p><span class=\"katex-inline\">\\dot X_k<\/span> 是 <span class=\"katex-inline\">\\dot X<\/span> 第 <span class=\"katex-inline\">k<\/span> 列，<span class=\"katex-inline\">\\lambda<\/span> 为稀疏化旋钮（PDF 第 271 页公式 7.39）。<\/p>\n<ul><li>\n&quot;STLS 稀疏化&quot;：sequentially thresholded least-squares，先最小二乘给初值，迭代把绝对值小于 <span class=\"katex-inline\">\\lambda<\/span> 的系数置零，在剩余列上重拟合（PDF 第 271 页 Code 7.1）。\n<\/ul>\n<p><strong>正例<\/strong>：Lorenz 方程每行只有线性与二次交互项；SINDy 三阶库加 <span class=\"katex-inline\">\\lambda=0.025<\/span> 辨识出的系数与原方程吻合（PDF 第 272 页）。 <strong>反例<\/strong>：真实右端含分数阶、非光滑或库外函数，稀疏回归只能用库内项近似，系数看似稳定但方程结构错误。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>前提<\/strong>：状态测量 <span class=\"katex-inline\">X<\/span> 与导数 <span class=\"katex-inline\">\\dot X<\/span> 已获得；先验只限定候选项类型，不知道活跃项。<\/p>\n<ol><li>\n<strong>广义线性模型逼近<\/strong>。设 <span class=\"katex-inline\">f(x)\\approx\\sum_j\\xi_j\\psi_j(x)<\/span>，<span class=\"katex-inline\">\\psi_j<\/span> 为库函数。线性组合覆盖库内一切结构，非线性来自库函数本身而非系数交互。\n<\/li><li>\n<strong>库矩阵构造<\/strong>。对快照 <span class=\"katex-inline\">x_i<\/span> 逐行生成 <span class=\"katex-inline\">\\psi_j(x_i)<\/span>，排成 <span class=\"katex-inline\">\\Theta\\in\\mathbb{R}^{m\\times p}<\/span>；导数矩阵 <span class=\"katex-inline\">\\dot X\\in\\mathbb{R}^{m\\times n}<\/span>。方程 <span class=\"katex-inline\">\\dot X=\\Theta\\Xi<\/span>，<span class=\"katex-inline\">\\Xi\\in\\mathbb{R}^{p\\times n}<\/span>。\n<\/li><li>\n<strong>逐行解耦<\/strong>。每行状态方程独立：<span class=\"katex-inline\">\\dot X_k=\\Theta\\xi_k+\\epsilon_k<\/span>。稀疏回归对每列 <span class=\"katex-inline\">\\xi_k<\/span> 单独求解，避免不同行方程互相分摊系数。\n<\/li><li>\n<strong>稀疏目标<\/strong>。残差项度量拟合不足，<span class=\"katex-inline\">\\ell_1<\/span> 惩罚把弱项压零；<span class=\"katex-inline\">\\lambda<\/span> 越大保留项越少。STLS 流程：初始最小二乘 <span class=\"katex-inline\">\\Xi=\\Theta\\backslash\\dot X<\/span>；每轮标记 <span class=\"katex-inline\">|\\Xi|&lt;\\lambda<\/span> 的小系数为待剔除，在剩余列上重算最小二乘，迭代约 10 轮至系数稳定（PDF 第 271 页 Code 7.1）。\n<\/li><li>\n<strong>输出方程<\/strong>。非零系数对应活跃项，逐行写成 <span class=\"katex-inline\">\\dot x_k=\\sum_{j\\in S_k}\\xi_{kj}\\psi_j(x)<\/span>；稀疏系数矩阵 <span class=\"katex-inline\">\\Xi<\/span> 即辨识结果。\n<\/li><li>\n<strong>带控制扩展<\/strong>。作动变量并入函数库，得 SINDYc；辨识模型可直接交给 MPC 做闭环控制（PDF 第 370、374 页）。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ol><li>\n<strong>库的覆盖决定上限<\/strong>：SINDy 只在预设库内选择；库缺项时模型能力被卡死，稀疏化不能凭空发明库外结构。\n<\/li><li>\n<strong>导数质量<\/strong>：<span class=\"katex-inline\">\\dot X<\/span> 来自有限差分或滤波微分；噪声放大微分误差，库项共线时系数不稳。本书建议对噪声过定问题用稀疏回归提高稳健性，区别于早期直接用压缩感知的方法（PDF 第 271 页）。\n<\/li><li>\n<strong><span class=\"katex-inline\">\\lambda<\/span> 选择<\/strong>：过大丢真实项，过小留噪声项；靠预测误差与模型简洁度权衡，交叉验证思路与 c04 相同。\n<\/li><li>\n<strong>数据覆盖<\/strong>：辨识出的方程只在快照访问过的状态邻域可信；外推到未探索区域，库内近似可能失效。\n<\/li><li>\n<strong>失败案例<\/strong>：库内含高度共线项（如 <span class=\"katex-inline\">x^2<\/span> 与 <span class=\"katex-inline\">xy<\/span> 在特定轨迹上近似线性相关），系数在相关项间分配不稳；需要扩大轨迹覆盖或正则化。\n<\/li><li>\n<strong>失败案例<\/strong>：微分误差大时，STLS 把导数噪声误判为活跃项，残差小但方程不对应真实物理过程。\n<\/ol>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>SINDy vs DMD<\/strong>：DMD 拟合线性算子，模态带增长率/频率；SINDy 在非线性函数库里稀疏选择右端项，输出可解释方程。前者走算子回归，后者走结构辨识。\n<\/li><li>\n<strong>SINDy vs 全多项式拟合<\/strong>：全库最小二乘系数稠密、共线分摊；SINDy 稀疏化后只留活跃项，模型可读、外推更稳。\n<\/li><li>\n<strong><span class=\"katex-inline\">\\ell_1<\/span> LASSO vs STLS<\/strong>：LASSO 一次凸优化给出收缩解；STLS 交替阈值与最小二乘，非零项上不收缩幅值，便于直接写方程系数。\n<\/li><li>\n<strong>库内选择 vs 遗传规划<\/strong>：遗传规划从零构造函数形式，搜索空间开放但代价高；SINDy 库内选择，结构受库限制但多项式可解。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：c04 LASSO/STLS 稀疏回归；c01 快照矩阵组织；微分与时间序列基础。\n<\/li><li>\n后继：c05 DMD/Koopman 是平行的算子路线；SINDYc 模型进入 c09 MPC 闭环；辨识方程可作为 c08 ROM 的右端再投影。\n<\/li><li>\n串联：SINDy 把静态稀疏回归搬到时间导数上，是&quot;数据驱动发现方程&quot;这条主线的代表方法。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（SINDy：函数库与稀疏化）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：SINDy 库构造、STLS 迭代与一维方程辨识算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把&quot;从快照数据稀疏辨识出右端方程&quot;推到底，逐级倒查：<\/p>\n<ol><li>\n右端项可写成库函数线性组合，倒查到候选库覆盖真实右端；库外项无法被表示。\n<\/li><li>\n系数向量逐行可解耦，倒查到方程 <span class=\"katex-inline\">\\dot X=\\Theta\\Xi<\/span> 按列独立，每行回归只依赖本列导数。\n<\/li><li>\n稀疏解来自 <span class=\"katex-inline\">\\ell_1<\/span>/阈值机制，倒查到 c04 的 LASSO/STLS 收缩几何。\n<\/li><li>\n导数矩阵 <span class=\"katex-inline\">\\dot X<\/span> 可得，倒查到有限差分或滤波微分；噪声经微分放大是误差源头。\n<\/li><li>\n辨识模型可外推到未观测区域，倒查到快照状态覆盖范围与库的泛化能力；超出范围模型不保证成立。\n<\/ol>\n<p>链条断掉：库缺项，稀疏化只是在错集合里挑最优；导数噪声大，回归把误差学成系数；轨迹只走单邻域，共线项无法区分。<\/p>\n<h2>正向推导<\/h2>\n<ul><li>\n第一步，状态与导数快照。采样 <span class=\"katex-inline\">x_i=x(i\\Delta t)<\/span>，排成 <span class=\"katex-inline\">X\\in\\mathbb{R}^{m\\times n}<\/span>；导数 <span class=\"katex-inline\">\\dot X<\/span> 由差分/滤波得到。\n<\/li><li>\n第二步，建库。<span class=\"katex-inline\">\\Theta_{ij}=\\psi_j(x_i)<\/span>，多项式库典型项为 <span class=\"katex-inline\">1,x_1,\\dots,x_n,x_1^2,x_1x_2,\\dots,x_n^2,\\dots<\/span>。三阶二元库项数随阶数组合增长，库列数 <span class=\"katex-inline\">p<\/span> 是稀疏化要面对的搜索空间大小。\n<\/li><li>\n第三步，写矩阵方程。<span class=\"katex-inline\">\\dot X=\\Theta\\Xi<\/span>，<span class=\"katex-inline\">\\Xi\\in\\mathbb{R}^{p\\times n}<\/span>。第 <span class=\"katex-inline\">k<\/span> 行状态方程 <span class=\"katex-inline\">\\dot x_k=\\sum_j\\Xi_{jk}\\psi_j(x)<\/span>。\n<\/li><li>\n第四步，逐行稀疏回归。目标 <span class=\"katex-inline\">\\min_{\\xi_k}\\|\\dot X_k-\\Theta\\xi_k\\|_2+\\lambda\\|\\xi_k\\|_1<\/span>。残差项保拟合，<span class=\"katex-inline\">\\ell_1<\/span> 压稀疏；<span class=\"katex-inline\">\\lambda<\/span> 控制活跃集大小。\n<\/li><li>\n第五步，STLS 迭代。初始 <span class=\"katex-inline\">\\Xi^{(0)}=\\Theta^\\dagger\\dot X<\/span>（最小二乘）；每轮：标记 <span class=\"katex-inline\">|\\Xi^{(q)}_{jk}|&lt;\\lambda<\/span> 的项为非活跃；在剩余列 <span class=\"katex-inline\">S<\/span> 上重拟合 <span class=\"katex-inline\">\\Xi_S^{(q+1)}=\\Theta_S^\\dagger\\dot X<\/span>；非活跃位置置零。迭代到活跃集稳定。\n<\/li><li>\n第六步，写回方程。活跃集 <span class=\"katex-inline\">S_k<\/span> 上 <span class=\"katex-inline\">\\dot x_k=\\sum_{j\\in S_k}\\Xi_{jk}\\psi_j(x)<\/span>；系数量级可对照已知物理量纲检查。\n<\/li><li>\n复杂度口径：最小二乘每步 <span class=\"katex-inline\">O(mp^2)<\/span>（超定 <span class=\"katex-inline\">m&gt;p<\/span>）或 <span class=\"katex-inline\">O(m^2p)<\/span>；迭代轮数固定约 10 轮；库列数 <span class=\"katex-inline\">p<\/span> 随多项式阶数组合膨胀，是主要计算压力。对比 <span class=\"katex-inline\">\\ell_0<\/span> 枚举 <span class=\"katex-inline\">2^p<\/span> 结构，STLS 把搜索压成多项式迭代。\n<\/ul>\n<h2>数值算例：一维三次方程辨识<\/h2>\n<p><strong>已知条件<\/strong>：真实系统<\/p>\n<div class=\"katex-block\">\\dot x=2x-x^3<\/div>\n<p>在 <span class=\"katex-inline\">t\\in[0,3]<\/span> 上取 301 个等距快照，初值 <span class=\"katex-inline\">x(0)=0.5<\/span>；库取 <span class=\"katex-inline\">\\psi(x)=[1,\\ x,\\ x^2,\\ x^3]<\/span>，阈值 <span class=\"katex-inline\">\\lambda=0.05<\/span>。<\/p>\n<p><strong>第一步，生成数据与导数<\/strong>。数值积分得 <span class=\"katex-inline\">x(t)<\/span> 序列，数值梯度得 <span class=\"katex-inline\">\\dot x(t)<\/span>。库矩阵<\/p>\n<div class=\"katex-block\">\\Theta=\\begin{bmatrix}1&x_1&x_1^2&x_1^3\\\\\\vdots&\\vdots&\\vdots&\\vdots\\end{bmatrix}<\/div>\n<p><strong>第二步，全库最小二乘<\/strong>。不解稀疏化直接回归，系数<\/p>\n<div class=\"katex-block\">\\xi_{\\text{LS}}=(0.0086,\\ 1.9736,\\ 0.0257,\\ -1.0080)<\/div>\n<p>常数项与二次项有小的非零残差，来自数值积分、差分误差与轨迹未覆盖区域；一次项 1.9736、三次项 <span class=\"katex-inline\">-1.0080<\/span> 已接近真值 <span class=\"katex-inline\">2<\/span> 与 <span class=\"katex-inline\">-1<\/span>，但四个系数全非零，方程不简洁。<\/p>\n<p><strong>第三步，STLS 阈值迭代<\/strong>。首轮标记 <span class=\"katex-inline\">|\\xi|&lt;0.05<\/span> 的常数项（0.0086）与二次项（0.0257）；在 <span class=\"katex-inline\">[x,x^3]<\/span> 两列上重拟合。迭代后系数<\/p>\n<div class=\"katex-block\">\\xi_{\\text{STLS}}=(0,\\ 2.0000,\\ 0,\\ -1.0000)<\/div>\n<p>辨识方程<\/p>\n<div class=\"katex-block\">\\dot x=2x-x^3<\/div>\n<p>与真实右端逐项一致；被剔除的常数、二次项系数精确归零。<\/p>\n<p><strong>第四步，阈值敏感度对照<\/strong>。<span class=\"katex-inline\">\\lambda<\/span> 取更大值时，弱一次项可能被一并压零，方程退化为 <span class=\"katex-inline\">\\dot x=-x^3<\/span>；<span class=\"katex-inline\">\\lambda<\/span> 取更小值时二次项小系数保留，模型多一个噪声项。阈值选择需要对照留出轨迹预测误差。<\/p>\n<p><strong>第五步，书内案例对照<\/strong>。本书 Lorenz 示例用三阶多项式库、<span class=\"katex-inline\">\\lambda=0.025<\/span>，辨识输出稀疏系数矩阵，活跃项与 Lorenz 原方程对应（PDF 第 272 页）；流程与本算例相同，差别在状态维度与库项类型。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：库缺真实项。真实右端含 <span class=\"katex-inline\">\\sin x<\/span>，库只有多项式，稀疏回归用高次多项式逼近正弦，系数非零但结构错误。 反例二：轨迹覆盖不足。若 <span class=\"katex-inline\">x<\/span> 始终在 0 附近，<span class=\"katex-inline\">x^2<\/span> 与 <span class=\"katex-inline\">x^3<\/span> 量级都很小且近似共线，STLS 在两项间分配系数不稳；扩大初值与参数范围才能区分。 反例三：强噪声微分。<span class=\"katex-inline\">\\dot X<\/span> 误差大时，阈值把噪声峰当活跃项；应先滤波平滑再差分，或用积分形式弱辨识避免直接微分。 反例四：控制输入未入库。强迫系统的作动项出现在右端，SINDy 库不含 <span class=\"katex-inline\">u<\/span> 时，回归把作动效应分摊到状态项上；SINDYc 把 <span class=\"katex-inline\">u<\/span> 并入库（PDF 第 374 页）。<\/p>\n<h2>与相邻概念的推导衔接<\/h2>\n<p>c04 提供 LASSO/STLS 稀疏回归机制；c05 DMD 是平行路线，输出线性模态而非方程项；c07 延迟嵌入为库提供历史坐标；辨识出的 SINDYc 模型在 c09 进入 MPC 滚动优化。<\/p>\n<h2>推导中容易跳过的环节<\/h2>\n<ul><li>\n库矩阵每行对应一个快照、每列对应一个候选项；<span class=\"katex-inline\">\\Xi<\/span> 转置方向容易写反，核对 <span class=\"katex-inline\">\\dot X=\\Theta\\Xi<\/span> 的维数即可。\n<\/li><li>\nSTLS 重拟合只在剩余列上做，被剔除列不参与本轮最小二乘；不能在全库上重复软阈值后直接写方程。\n<\/li><li>\n系数符号与量纲要和方程逐项核对；稀疏不等于正确，残差小也可能是库内过拟合。\n<\/ul>\n<h2>补充推演：库规模、导数质量与辨识稳健性<\/h2>\n<ul><li>\n库列数估算。<span class=\"katex-inline\">n<\/span> 个状态、多项式阶数 <span class=\"katex-inline\">d<\/span>，单项式数量为组合数 <span class=\"katex-inline\">\\binom{n+d}{d}<\/span>；二元三阶库含常数、一次、二次、三次项，列数随阶数组合膨胀。库越大，共线性与过拟合风险越高，稀疏化压力越大。\n<\/li><li>\n导数获取。<span class=\"katex-inline\">\\dot X<\/span> 可由有限差分 <span class=\"katex-inline\">\\dot x_k\\approx(x_{k+1}-x_{k-1})/(2\\Delta t)<\/span> 得到；噪声经差分放大一倍除以 <span class=\"katex-inline\">\\Delta t<\/span>，实践中先对轨迹滤波平滑再求导，或用积分形式弱辨识避免直接微分。\n<\/li><li>\n共线性处理。库内两项在轨迹上近似线性相关时，系数在两项间分摊；扩大轨迹覆盖范围、剔除近重复项或加 <span class=\"katex-inline\">\\ell_2<\/span> 惩罚可缓解。\n<\/li><li>\n<span class=\"katex-inline\">\\lambda<\/span> 选择对照。<span class=\"katex-inline\">\\lambda<\/span> 过小保留噪声项，残差小但方程臃肿；过大丢真实项，残差上升。用留出轨迹预测误差与项数联合判断，思路与 c04 交叉验证相同。\n<\/li><li>\n辨识结构检验。系数符号、量纲应与物理方程一致；同一模型在多段初始条件下复现，才认为结构被辨识出来。单段轨迹上的稀疏系数可能只在该邻域成立。\n<\/li><li>\nSINDYc 接口。作动变量 <span class=\"katex-inline\">u<\/span> 并入库列，辨识 <span class=\"katex-inline\">\\dot x=f(x,u)<\/span>；模型可直接进入 MPC 闭环预测（PDF 第 370、374 页）。控制项缺失时，回归把 <span class=\"katex-inline\">u<\/span> 的效应分摊到状态项，结构失真。\n<\/li><li>\n复杂度补充。每轮最小二乘 <span class=\"katex-inline\">O(mp^2)<\/span>（<span class=\"katex-inline\">m&gt;p<\/span>）；STLS 固定约 10 轮；库列数 <span class=\"katex-inline\">p<\/span> 是主要成本。对比遗传规划从零构造表达式，SINDy 搜索空间封闭在库内，代价可控但受库限制。\n<\/ul>\n<h2>补充推演（二）：库规模估算与弱辨识复核<\/h2>\n<ul><li>\n库列数组合估算。<span class=\"katex-inline\">n<\/span> 个状态变量、多项式阶数 <span class=\"katex-inline\">d<\/span>，单项式个数为 <span class=\"katex-inline\">\\binom{n+d}{d}<\/span>；二元三阶库含常数、一次、二次、三次项，列数随阶数组合膨胀。库列数 <span class=\"katex-inline\">p<\/span> 直接决定最小二乘代价 <span class=\"katex-inline\">O(mp^2)<\/span> 与共线性风险，扩库前先估算项数。\n<\/li><li>\n本算例系数复核。LS 解 <span class=\"katex-inline\">(0.0086,1.9736,0.0257,-1.0080)<\/span>：真值 <span class=\"katex-inline\">(0,2,0,-1)<\/span>，一次项偏差 <span class=\"katex-inline\">-0.0264<\/span>、三次项偏差 <span class=\"katex-inline\">-0.0080<\/span>，来自差分噪声与积分步长；STLS 剔除常数、二次项后在 <span class=\"katex-inline\">[x,x^3]<\/span> 两列重拟合，系数回到 <span class=\"katex-inline\">(2.0000,-1.0000)<\/span>。\n<\/li><li>\n弱辨识路线。直接微分把噪声放大 <span class=\"katex-inline\">1/\\Delta t<\/span>；积分形式把方程两边对时间积分，用轨迹积分项替代导数项，噪声在积分中平滑，适合强噪声数据。代价是库项也要写成积分形式。\n<\/li><li>\nSTLS 收敛。活跃集每轮只减不增，有限个候选子集下迭代必停；停在哪个子集由阈值 <span class=\"katex-inline\">\\lambda<\/span> 决定，不保证是最优稀疏结构。\n<\/li><li>\n量纲核对。活跃项系数的单位应与右端方程一致；一次项系数对应 <span class=\"katex-inline\">1/\\text{时间}<\/span>，三次项系数对应 <span class=\"katex-inline\">1/(\\text{时间}\\cdot\\text{量纲}^2)<\/span>；量纲不符说明库项或系数有误。\n<\/ul>\n<h2>延伸推演：SINDy 成立前提再拆一层<\/h2>\n<p>从快照稀疏辨识右端方程，依赖四条子条件。<\/p>\n<ul><li>\n子前提一：函数库覆盖真实右端。库 <span class=\"katex-inline\">\\Theta(X)<\/span> 的列张成真实 <span class=\"katex-inline\">f(x)<\/span>；库外项无法被任何系数组合表示，稀疏化只是在错集合里挑最优。\n<\/li><li>\n子前提二：导数矩阵 <span class=\"katex-inline\">\\dot X<\/span> 可得且噪声可控。有限差分把噪声放大 <span class=\"katex-inline\">1/\\Delta t<\/span>；导数误差大时阈值把噪声峰当活跃项，需要先滤波平滑或走积分形式弱辨识。\n<\/li><li>\n子前提三：轨迹覆盖候选项的取值范围。<span class=\"katex-inline\">x<\/span> 始终在 0 附近时 <span class=\"katex-inline\">x^2<\/span> 与 <span class=\"katex-inline\">x^3<\/span> 量级小且近似共线，STLS 在两项间分配不稳；扩大初值与参数范围才能区分共线项。\n<\/li><li>\n子前提四：阈值与噪声水平匹配。<span class=\"katex-inline\">\\lambda<\/span> 过小保留噪声项、方程臃肿；过大丢真实项、残差上升。阈值选择对照留出轨迹预测误差与项数，不能只看训练残差。\n<\/li><li>\n去掉子前提的后果：库缺项致结构错误，导数噪声致虚假活跃项，覆盖不足致共线不可分，阈值失配致过稀疏或过拟合。\n<\/ul>\n<h2>第二算例：<span class=\"katex-inline\">\\dot x=-x+0.5x^2<\/span> 的阈值扫描<\/h2>\n<p><strong>已知条件<\/strong>：真实系统<\/p>\n<div class=\"katex-block\">\\dot x=-x+0.5x^2<\/div>\n<p><span class=\"katex-inline\">t\\in[0,2.5]<\/span> 取 251 个等距快照，初值 <span class=\"katex-inline\">x(0)=0.8<\/span>；库取 <span class=\"katex-inline\">\\psi(x)=[1,\\ x,\\ x^2,\\ x^3]<\/span>，导数由数值梯度得到。<\/p>\n<pre class=\"lang-python\"><code>import numpy as np\nfrom scipy.integrate import solve_ivp\nsol = solve_ivp(lambda t,x: [-x[0]+0.5*x[0]**2],\n                [0,2.5],[0.8], t_eval=np.linspace(0,2.5,251))\nxs, t = sol.y[0], sol.t\ndx = np.gradient(xs, t)\nTheta = np.column_stack([np.ones_like(xs), xs, xs**2, xs**3])\nxi_ls = np.linalg.lstsq(Theta, dx, rcond=None)[0]<\/code><\/pre>\n<p><strong>第一步，全库最小二乘<\/strong>。实算系数<\/p>\n<div class=\"katex-block\">\\xi_{\\text{LS}}=(0.0003,\\ -1.0031,\\ 0.5075,\\ -0.0050)<\/div>\n<p>真值为 <span class=\"katex-inline\">(0,\\ -1,\\ 0.5,\\ 0)<\/span>；一次项偏差 <span class=\"katex-inline\">-0.0031<\/span>、二次项偏差 <span class=\"katex-inline\">+0.0075<\/span>，来自差分噪声与有限步长；常数项 0.0003、三次项 <span class=\"katex-inline\">-0.0050<\/span> 是小残差，但四个系数全非零。<\/p>\n<p><strong>第二步，STLS 阈值扫描<\/strong>。初始解取 LS，每轮标记 <span class=\"katex-inline\">|\\xi|&lt;\\lambda<\/span> 为非活跃，在剩余列重拟合，迭代到活跃集稳定。三档阈值实算：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><span class=\"katex-inline\">\\lambda<\/span><\/th><th>常数<\/th><th><span class=\"katex-inline\">x<\/span><\/th><th><span class=\"katex-inline\">x^2<\/span><\/th><th><span class=\"katex-inline\">x^3<\/span><\/th><\/tr><\/thead><tbody><tr><td>0.02<\/td><td>0<\/td><td>-1.0005<\/td><td>0.5007<\/td><td>0<\/td><\/tr><tr><td>0.05<\/td><td>0<\/td><td>-1.0005<\/td><td>0.5007<\/td><td>0<\/td><\/tr><tr><td>0.10<\/td><td>0<\/td><td>-1.0005<\/td><td>0.5007<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div>\n<p>三档均辨识出<\/p>\n<div class=\"katex-block\">\\dot x=-1.0005\\,x+0.5007\\,x^2<\/div>\n<p>与真值 <span class=\"katex-inline\">-x+0.5x^2<\/span> 逐项对应；常数项与三次项被精确剔除。本轨迹上一次、二次项量级差得开，阈值在 0.02–0.10 区间稳定；若轨迹范围缩小、两项共线加重，三档结果会出现分歧。<\/p>\n<ul><li>\n库规模与成本口径。一维三阶库列数 4；状态维数 <span class=\"katex-inline\">n<\/span> 增大、多项式阶数 <span class=\"katex-inline\">d<\/span> 提高，库列数按组合数 <span class=\"katex-inline\">\\binom{n+d}{d}<\/span> 膨胀。每轮最小二乘 <span class=\"katex-inline\">O(mp^2)<\/span>，STLS 固定约 10 轮；本算例 <span class=\"katex-inline\">m=251,p=4<\/span>，代价很小，扩库后成本主要压在 <span class=\"katex-inline\">p<\/span> 上。\n<\/li><li>\n导数口径。251 点等距采样，数值梯度用中心差分；噪声经差分放大 <span class=\"katex-inline\">1/\\Delta t<\/span>。轨迹从 0.8 演化到收束段，<span class=\"katex-inline\">x^2<\/span> 项在中段量级足够，两项可分；初值若压在 0 附近，二次项与三次项共线，阈值扫描结果会分歧。\n<\/ul>\n<h2>对抗性追问：库缺三角函数项，多项式会怎样逼近<\/h2>\n<p>设真实右端含 <span class=\"katex-inline\">\\sin x<\/span>，库只有 <span class=\"katex-inline\">1,x,x^2,x^3<\/span>。多项式在小邻域是正弦的泰勒近似，稀疏回归会选出若干高次项拼出局部正弦形状；残差小但结构错误，系数符号与量纲不对应任何真实物理项。判据：把辨识模型放到留出初值上积分，若轨迹短时贴合、稍长时间偏离，且库内多项式项无法解释振荡，说明库缺项；此时向库加入 <span class=\"katex-inline\">\\sin x,\\cos x<\/span> 等候选项重跑，而不是靠提高多项式阶数硬凑。稀疏不等于正确，残差小也可能是库内过拟合。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出 SINDy 逐行稀疏优化目标，说明 <span class=\"katex-inline\">\\lambda<\/span> 控制什么。\n<\/li><li>\nSTLS 每轮做哪两件事？初始解从哪里来？\n<\/li><li>\n为什么说库的覆盖范围决定 SINDy 的能力上限？\n<\/li><li>\n导数噪声通过什么途径影响辨识结果？有哪些缓解手段？\n<\/li><li>\n带作动系统做 SINDy 时，库需要加入什么变量？对应方法叫什么？\n<\/ol><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：Data-Driven Science and Engineering: Machine Learning, Dynamical Systems, and Control · p.293<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">DMD 与 Koopman 算子<\/a><\/span><\/div><h1>c07 延迟嵌入与 Hankel 矩阵（HAVOK）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch03（7.2 Delay measurements，PDF 第 268 页；7.5 Data-Driven Koopman Analysis / HAVOK，PDF 第 293–295 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>实际测量常常不完整：极端情形只有一个标量时间序列（传感器读数、神经记录、气候指标）。单看这一条曲线，相位信息藏不进数据矩阵的秩里，DMD 提取不出共轭复特征值对；混沌系统的吸引子也无法从单条标量轨迹重建。需要回答：能不能只用历史值构造延迟坐标，把标量序列扩成高维嵌入，让隐藏的状态结构在嵌入空间里显现，再在延迟坐标上做线性回归与模态分解。<\/p>\n<p>不做延迟嵌入，单变量序列秩不足，振荡被误判为实特征值；混沌吸引子在一维线上自交，无法区分不同状态。Hankel 矩阵把时间延迟堆成快照矩阵，是连接标量测量与 Koopman/DMD 分析的桥梁（PDF 第 268、294 页）。<\/p>\n<h2>定义逐句拆解<\/h2>\n<p><strong>延迟坐标（delay coordinates）<\/strong>：用当前值与历史值构造向量<\/p>\n<div class=\"katex-block\">v(t_k)=[x(t_k),\\ x(t_k-\\Delta t),\\ \\dots,\\ x(t_k-(m-1)\\Delta t)]^T<\/div>\n<p>每个时刻的状态由一段历史窗口表示；延迟数 <span class=\"katex-inline\">m<\/span> 与间隔 <span class=\"katex-inline\">\\Delta t<\/span> 是嵌入参数。<\/p>\n<p><strong>Hankel 矩阵<\/strong>：把时间序列按延迟窗口堆叠<\/p>\n<div class=\"katex-block\">H=\\begin{bmatrix}x(t_1)&Kx(t_1)&\\cdots&K^{m_c-1}x(t_1)\\\\Kx(t_1)&K^2x(t_1)&\\cdots&K^{m_c}x(t_1)\\\\\\vdots&\\vdots&&\\vdots\\\\K^{m_o-1}x(t_1)&K^{m_o}x(t_1)&\\cdots&K^{m-1}x(t_1)\\end{bmatrix}<\/div>\n<p>（PDF 第 294 页公式 7.98）。每行是一段延迟窗口，相邻行平移一个时间步；列是不同延迟深度下的时间序列。<\/p>\n<p><strong>HAVOK（Hankel alternative view of Koopman）<\/strong>：对 <span class=\"katex-inline\">H<\/span> 做 SVD 得到本征时间序列（延迟嵌入吸引子）；在延迟坐标 <span class=\"katex-inline\">v<\/span> 上回归线性模型，前 <span class=\"katex-inline\">r-1<\/span> 个坐标线性拟合良好，最后一个坐标 <span class=\"katex-inline\">v_r<\/span> 不被线性解释，作为强迫项驱动前 <span class=\"katex-inline\">r-1<\/span> 个变量；稀有强迫事件对应混沌中的 lobe switching（PDF 第 294 页图 7.12）。<\/p>\n<p><strong>正例<\/strong>：Lorenz 混沌标量序列堆成 Hankel 矩阵，SVD 前三个右奇异向量张成嵌入吸引子；末坐标刻画稀有跳变事件（PDF 第 294 页）。 <strong>反例<\/strong>：延迟数太少，嵌入空间仍自交，状态不可分；延迟数太多，相邻坐标高度相关，矩阵秩虚高、回归不稳。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>前提<\/strong>：标量序列 <span class=\"katex-inline\">x(t)<\/span> 等间隔采样；系统状态由一段历史可近似重构。<\/p>\n<ol><li>\n<strong>单序列秩不足的困难<\/strong>。<span class=\"katex-inline\">x(t)=\\sin(\\omega t)<\/span> 单列快照矩阵秩为 1，DMD 只能给出实特征值，提取不出 <span class=\"katex-inline\">\\pm i\\omega<\/span> 共轭对；相位信息需要至少两个相差四分之一周期的坐标才能显现（PDF 第 268 页）。\n<\/li><li>\n<strong>堆叠延迟增秩<\/strong>。Hankel 矩阵每行含 <span class=\"katex-inline\">m<\/span> 个历史值，同一时刻的相位信息分散在延迟坐标中；矩阵秩随嵌入维数提高，复共轭特征值对可被分解出来。\n<\/li><li>\n<strong>SVD 分解嵌入<\/strong>。<span class=\"katex-inline\">H=U\\Sigma V^*<\/span>：<span class=\"katex-inline\">U<\/span> 列是延迟坐标方向（本征延迟模态），<span class=\"katex-inline\">V<\/span> 列是各模态随时间的幅值序列；前几列 <span class=\"katex-inline\">V<\/span> 画出嵌入吸引子（PDF 第 294 页）。\n<\/li><li>\n<strong>延迟坐标上回归<\/strong>。在 <span class=\"katex-inline\">V<\/span> 的时间序列上拟合线性模型。近似 Koopman 不变的测量系统中，前 <span class=\"katex-inline\">r-1<\/span> 个坐标可线性演化；混沌系统存在不可线性化的强迫分量，落在末坐标 <span class=\"katex-inline\">v_r<\/span>。\n<\/li><li>\n<strong>强迫项解释<\/strong>。<span class=\"katex-inline\">v_r<\/span> 不作为状态变量纳入线性齐次模型，而作为输入驱动 <span class=\"katex-inline\">\\dot v_{1:r-1}=Av_{1:r-1}+Bv_r<\/span>；<span class=\"katex-inline\">v_r<\/span> 上的稀有尖峰对应吸引子在两叶之间切换的事件。\n<\/li><li>\n<strong>与 Koopman 的联系<\/strong>。延迟坐标是一组可观测量；扩大测量子空间后，有限维线性逼近更接近真实 Koopman 谱。HAVOK 把&quot;线性部分加稀疏强迫&quot;作为混沌的可解释分解（PDF 第 294 页）。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ol><li>\n<strong>嵌入维数与间隔<\/strong>：延迟不足则吸引子自交，延迟过大则坐标相关；参数选择需要看嵌入轨迹是否展开、回归是否稳定。\n<\/li><li>\n<strong>采样率<\/strong>：延迟间隔 <span class=\"katex-inline\">\\Delta t<\/span> 与采样率配合，相邻延迟既不重复同一信息，也不错过相位变化。\n<\/li><li>\n<strong>噪声传播<\/strong>：Hankel 矩阵把同一噪声复制到多个延迟行，SVD 对延迟结构中的噪声敏感；前置滤波平滑有帮助。\n<\/li><li>\n<strong>线性部分边界<\/strong>：HAVOK 的线性模型只覆盖前 <span class=\"katex-inline\">r-1<\/span> 坐标；末坐标强迫本身需要单独建模或观测，不能把整套混沌都当成线性系统。\n<\/li><li>\n<strong>失败案例<\/strong>：序列含趋势漂移或非平稳分段，延迟嵌入把趋势也编进坐标，回归模态对应漂移而非动力学。\n<\/li><li>\n<strong>失败案例<\/strong>：延迟数 <span class=\"katex-inline\">m<\/span> 过大导致 Hankel 矩阵列间强相关，奇异值谱平滑下降，截断阶数难以判断。\n<\/ol>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>Hankel 矩阵 vs 普通快照矩阵<\/strong>：普通快照列是不同空间测量；Hankel 列是同一信号的不同延迟深度，行是滑动窗口。增秩靠时间历史，不靠空间传感器。\n<\/li><li>\n<strong>延迟嵌入 vs 状态观测<\/strong>：延迟坐标是重构吸引子的数学构造，不直接等于物理状态；嵌入坐标与真实状态的对应需要 Koopman 本征函数支撑。\n<\/li><li>\n<strong>HAVOK vs 标准 DMD<\/strong>：标准 DMD 在全状态快照上回归齐次线性算子；HAVOK 在延迟坐标上回归，并把不可线性化分量显式留作强迫输入。\n<\/li><li>\n<strong>延迟坐标 vs 神经网络嵌入<\/strong>：两者都扩大测量子空间；延迟坐标透明可解释，网络嵌入靠学习得到、结构不可读（PDF 第 242 页附近神经网络 Koopman 方向）。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：c05 DMD 回归与谱换算；c01 SVD 分解；时间序列采样基础。\n<\/li><li>\n后继：c09 在嵌入/ Koopman 坐标里接控制；延迟坐标可作为 c06 SINDy 库的历史项；c10 传感器布置回答&quot;空间上放几个点&quot;，延迟嵌入回答&quot;时间上取多长历史&quot;。\n<\/li><li>\n串联：延迟嵌入是把不完备测量补成可建模状态的通用手段，贯穿 DMD 扩展、Koopman 数据驱动分析与时间序列辨识。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（延迟嵌入与 Hankel 矩阵（HAVOK））<\/summary><div class=\"depth-body\"><h1>c07 深度推导：Hankel 增秩、嵌入吸引子与正弦序列数值算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把&quot;延迟堆叠让单序列可辨识振荡谱&quot;推到底，逐级倒查：<\/p>\n<ol><li>\nDMD 提取复特征值对，先要求快照矩阵秩至少为 2；单序列单列秩为 1，倒查到矩阵秩与列空间维数。\n<\/li><li>\n秩不足来自测量维度不够，倒查到可观测量选择；延迟坐标是扩充测量子空间的一种方式。\n<\/li><li>\n延迟窗口内坐标携带相位信息，倒查到正弦序列在相邻时刻的取值差由相位决定；单值只给幅值。\n<\/li><li>\nSVD 把 Hankel 矩阵拆成延迟模态 <span class=\"katex-inline\">U<\/span> 与时间幅值 <span class=\"katex-inline\">V<\/span>，倒查到 c01 分解式；嵌入吸引子由 <span class=\"katex-inline\">V<\/span> 的时间序列张成。\n<\/li><li>\n末坐标作为强迫项，倒查到混沌系统存在不可线性化分量；线性回归只能覆盖 Koopman 不变子空间内部分。\n<\/ol>\n<p>链条断掉：延迟间隔与序列周期不匹配，相位差太小坐标重复；嵌入维数不足，吸引子自交；噪声未平滑，延迟行复制同一扰动。<\/p>\n<h2>正向推导<\/h2>\n<ul><li>\n第一步，单序列快照。<span class=\"katex-inline\">x_k=x(k\\Delta t)<\/span>，单列矩阵 <span class=\"katex-inline\">X=[x_0,\\dots,x_{m-1}]^T<\/span>。对 <span class=\"katex-inline\">x(t)=\\sin(\\omega t)<\/span>，单列只能表示幅值轨迹，矩阵秩为 1。\n<\/li><li>\n第二步，DMD 秩约束。<span class=\"katex-inline\">X&#x27;\\approx AX<\/span> 回归出的算子作用在一维列空间；一维算子只有实特征值，无法给出 <span class=\"katex-inline\">\\pm i\\omega<\/span> 共轭对。这就是本书记录的单正弦悖论（PDF 第 267–268 页）。\n<\/li><li>\n第三步，构造延迟向量。<span class=\"katex-inline\">v_k=[x_k,x_{k-1},\\dots,x_{k-m+1}]^T<\/span>，<span class=\"katex-inline\">m<\/span> 为延迟数。Hankel 矩阵 <span class=\"katex-inline\">H<\/span> 第 <span class=\"katex-inline\">i<\/span> 行 <span class=\"katex-inline\">v_i^T<\/span>，相邻行平移一步。\n<\/li><li>\n第四步，增秩。<span class=\"katex-inline\">v_k<\/span> 含不同相位的采样值，列空间从一维扩到 <span class=\"katex-inline\">m<\/span> 维；正弦序列的状态（幅值加相位）可由两个正交延迟坐标表示，秩升到 2。\n<\/li><li>\n第五步，SVD 嵌入。<span class=\"katex-inline\">H=U\\Sigma V^*<\/span>：<span class=\"katex-inline\">U<\/span> 列是延迟坐标方向，<span class=\"katex-inline\">V<\/span> 列是各方向时间幅值；前几列 <span class=\"katex-inline\">V<\/span> 画出延迟嵌入吸引子（PDF 第 294 页）。\n<\/li><li>\n第六步，延迟坐标回归。<span class=\"katex-inline\">V<\/span> 的时间序列成对排列，回归 <span class=\"katex-inline\">\\tilde A<\/span>；前 <span class=\"katex-inline\">r-1<\/span> 坐标线性演化良好，末坐标 <span class=\"katex-inline\">v_r<\/span> 作为强迫输入。HAVOK 模型\n<\/ul>\n<div class=\"katex-block\">\\dot v_{1:r-1}=Av_{1:r-1}+Bv_r<\/div>\n<p>稀有强迫事件对应混沌叶间切换（PDF 第 294 页图 7.12）。<\/p>\n<ul><li>\n复杂度口径：Hankel 构造 <span class=\"katex-inline\">O(mL)<\/span>，<span class=\"katex-inline\">L<\/span> 为序列长度；SVD 对 <span class=\"katex-inline\">L\\times m<\/span> 矩阵 <span class=\"katex-inline\">O(Lm\\min(L,m))<\/span>；延迟数 <span class=\"katex-inline\">m<\/span> 增大，矩阵变宽，SVD 代价上升。\n<\/ul>\n<h2>数值算例：正弦序列的延迟增秩与频率恢复<\/h2>\n<p><strong>已知条件<\/strong>：<span class=\"katex-inline\">x(t)=\\sin(2\\pi\\cdot0.3\\,t)<\/span>，采样 <span class=\"katex-inline\">\\Delta t=0.05<\/span> s，时长 10 s，共 200 点；真实频率 <span class=\"katex-inline\">f=0.3<\/span> Hz，<span class=\"katex-inline\">\\omega=2\\pi\\cdot0.3\\approx1.885<\/span> rad/s。<\/p>\n<p><strong>第一步，无延迟（<span class=\"katex-inline\">m=1<\/span>）<\/strong>。Hankel 即单列，形状 <span class=\"katex-inline\">200\\times1<\/span>，数值秩 1，奇异值 <span class=\"katex-inline\">10.000<\/span>。DMD 回归一维算子，特征值<\/p>\n<div class=\"katex-block\">\\lambda=0.9957\\quad\\text{（实数）}<\/div>\n<p>没有共轭对，频率无法从辐角恢复；与本书记录的悖论一致：单列数据秩不足，复特征值对提取不出来（PDF 第 267–268 页）。<\/p>\n<p><strong>第二步，两延迟（<span class=\"katex-inline\">m=2<\/span>）<\/strong>。矩阵形状 <span class=\"katex-inline\">199\\times2<\/span>，数值秩 2，奇异值 <span class=\"katex-inline\">14.1263,\\ 0.6629<\/span>。两个延迟坐标已能承载相位差。<\/p>\n<p><strong>第三步，四延迟（<span class=\"katex-inline\">m=4<\/span>）<\/strong>。矩阵形状 <span class=\"katex-inline\">197\\times4<\/span>，数值秩 2，奇异值 <span class=\"katex-inline\">19.8869,\\ 2.0696,\\ 0,\\ 0<\/span>；后两个方向为数值零，说明四个延迟坐标张成的有效子空间仍是二维。DMD 特征值<\/p>\n<div class=\"katex-block\">\\lambda_{1,2}=0.9956\\pm0.0941i<\/div>\n<p>辐角 <span class=\"katex-inline\">|\\arg\\lambda|=0.0941<\/span>，换算频率<\/p>\n<div class=\"katex-block\">f=\\frac{|\\arg\\lambda|}{2\\pi\\Delta t}=\\frac{0.0941}{2\\pi\\cdot0.05}=0.300\\ \\text{Hz}<\/div>\n<p>与真实 <span class=\"katex-inline\">0.3<\/span> Hz 核对一致；模长 <span class=\"katex-inline\">0.9956\\approx1<\/span>，对应中性振荡。 <strong>第四步，延迟数对照<\/strong>。<span class=\"katex-inline\">m=4<\/span> 时后两维奇异值为零，说明超过有效秩的延迟坐标是冗余方向；继续加大 <span class=\"katex-inline\">m<\/span> 不会提高谱精度，只会增加列间相关与计算量。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：延迟间隔过大。相邻延迟坐标跳过多个周期，相位差卷叠，嵌入轨迹重叠；间隔过小则坐标近似相等，秩不增。 反例二：混沌序列延迟不足。吸引子在低维嵌入中自交，不同状态映射到同一延迟向量，回归模型混淆轨迹分支。 反例三：非平稳趋势。序列含线性漂移，Hankel SVD 第一模态对准趋势，动力学模态被挤到后面；应先去趋势再嵌入。 反例四：把末强迫坐标当状态。HAVOK 中 <span class=\"katex-inline\">v_r<\/span> 不可线性化，纳入齐次线性模型会得到错误增长/衰减结论。<\/p>\n<h2>与相邻概念的推导衔接<\/h2>\n<p>c05 DMD 是回归主体，延迟堆叠解决其测量维度不足；c06 SINDy 库可加入延迟项作为历史坐标；c08 POD 对 Hankel 矩阵做 SVD 与本章步骤相同，区别在后续投影对象是场方程还是时间回归；c10 空间传感器布置与时间延迟嵌入从两个方向补全测量。<\/p>\n<h2>推导中容易跳过的环节<\/h2>\n<ul><li>\n秩从 1 升到 2 是因为延迟列携带独立相位信息，不是单纯把矩阵加宽；列间相关时加宽不增秩。\n<\/li><li>\nDMD 频率换算仍要除以 <span class=\"katex-inline\">\\Delta t<\/span>，延迟间隔不改变采样步长。\n<\/li><li>\nHAVOK 末坐标是强迫输入，其事件统计需要单独分析，不能并入 <span class=\"katex-inline\">A<\/span> 的齐次演化。\n<\/ul>\n<h2>补充推演：嵌入维数选择、HAVOK 回归结构与噪声传播<\/h2>\n<ul><li>\n嵌入为何能重构状态。单条标量序列是状态在某个可观测量上的投影；延迟坐标用不同时刻的同一测量拼出多维向量，在合适维数下与原状态微分同胚地展开吸引子。嵌入维数不足时轨迹自交，不同历史落到同一向量；维数过高时相邻延迟强相关，有效秩不增。\n<\/li><li>\n延迟间隔配合采样。间隔 <span class=\"katex-inline\">\\Delta t_d<\/span> 与序列周期配合：太小则延迟坐标近似相等，相位差不足；太大则相隔太远，动力学关联变弱。实践上看嵌入轨迹是否展开、坐标间相关是否适中。\n<\/li><li>\nHAVOK 回归细节。SVD 后坐标 <span class=\"katex-inline\">v<\/span>，前 <span class=\"katex-inline\">r-1<\/span> 个变量回归线性系统 <span class=\"katex-inline\">\\dot v_{1:r-1}=Av_{1:r-1}+Bv_r<\/span>；<span class=\"katex-inline\">v_r<\/span> 作为强迫输入，其稀有尖峰对应叶间切换。<span class=\"katex-inline\">v_r<\/span> 不纳入齐次状态，因为线性模型无法解释这一分量（PDF 第 294 页图 7.12）。\n<\/li><li>\n噪声在延迟矩阵中的传播。同一测量噪声被复制到多个延迟行，Hankel 矩阵列间共享噪声结构；SVD 第一模态可能对准噪声平滑方向。前置滤波、增加样本数可压低噪声分量占比。\n<\/li><li>\n与 DMD 的衔接。延迟坐标向量作为 DMD 快照，回归 <span class=\"katex-inline\">\\tilde A<\/span>；增秩后复特征值对可被提取。c05 算例中 <span class=\"katex-inline\">m=1<\/span> 秩 1 只给实特征值，<span class=\"katex-inline\">m=4<\/span> 后共轭对出现，增秩是前提。\n<\/li><li>\n复杂度补充。Hankel 矩阵形状 <span class=\"katex-inline\">(L-m+1)\\times m<\/span>；SVD 代价 <span class=\"katex-inline\">O(Lm\\min(L,m))<\/span>。<span class=\"katex-inline\">m<\/span> 增大矩阵变宽，奇异值谱在后段趋于平滑，有效秩需结合尾部奇异值判断。\n<\/li><li>\n边界补充。非平稳序列的趋势漂移会被嵌入坐标编进第一模态；先去趋势再延迟。多频混合序列需要足够长的窗口覆盖最慢周期，否则低频分量在嵌入中分辨不出。\n<\/ul>\n<h2>补充推演（二）：嵌入维数与本算例谱复核<\/h2>\n<ul><li>\n嵌入维数下界陈述。延迟向量维数 <span class=\"katex-inline\">m<\/span> 需足够大以展开 <span class=\"katex-inline\">d<\/span> 维吸引子；嵌入不足时轨迹自交，不同历史落到同一延迟向量。<span class=\"katex-inline\">m<\/span> 取大后相邻延迟强相关，有效秩不增，尾部奇异值趋于零。\n<\/li><li>\nHankel 形状与秩。序列长度 <span class=\"katex-inline\">L<\/span>、延迟数 <span class=\"katex-inline\">m<\/span>，Hankel 形状 <span class=\"katex-inline\">(L-m+1)\\times m<\/span>；正弦信号有效秩为 2，<span class=\"katex-inline\">m&gt;2<\/span> 时多出的列是已有两个方向的线性组合，奇异值落到数值零。本算例 <span class=\"katex-inline\">m=4<\/span> 奇异值 <span class=\"katex-inline\">19.8869,2.0696,0,0<\/span>，后两零方向即冗余延迟。\n<\/li><li>\n频率换算复核。<span class=\"katex-inline\">\\arg\\lambda=0.0941<\/span>，<span class=\"katex-inline\">f=0.0941/(2\\pi\\times0.05)=0.300<\/span> Hz；<span class=\"katex-inline\">\\omega=2\\pi f=1.885<\/span> rad/s，与构造频率一致。<span class=\"katex-inline\">m=1<\/span> 单列 <span class=\"katex-inline\">\\lambda=0.9957<\/span> 为实数，辐角零，频率读数缺失。\n<\/li><li>\n窗口长度要求。多频混合序列的嵌入窗口需覆盖最慢周期；窗口短于慢周期时低频分量在延迟坐标上分辨不出，SVD 把慢模态挤进第一方向。\n<\/li><li>\n延迟间隔与采样间隔区分。Hankel 相邻行平移一个采样步长 <span class=\"katex-inline\">\\Delta t<\/span>；延迟间隔 <span class=\"katex-inline\">\\Delta t_d<\/span> 可以取若干个采样点，间隔选择配合序列相位，不改变 DMD 谱换算中使用的 <span class=\"katex-inline\">\\Delta t<\/span>。\n<\/li><li>\n噪声复制结构。同一测量噪声进入多个延迟行，列间共享噪声；前置滤波与加长序列压低噪声分量占比，否则第一延迟模态可能对准噪声平滑方向。\n<\/ul>\n<h2>延伸推演：延迟嵌入前提再拆一层<\/h2>\n<p>延迟堆叠把标量序列扩成多坐标快照，嵌入能重构状态依赖四条子条件。<\/p>\n<ul><li>\n子前提一：延迟间隔与序列周期配合。间隔太小，相邻延迟坐标近似相等，相位差不足，秩不增；间隔太大，相隔时刻动力学关联变弱，嵌入轨迹散开。间隔选择看嵌入轨迹是否展开、坐标间相关是否适中。\n<\/li><li>\n子前提二：嵌入维数足够展开吸引子。维数不足时轨迹自交，不同历史落到同一延迟向量；维数过高时相邻延迟强相关，有效秩不增，尾部奇异值趋于零。\n<\/li><li>\n子前提三：序列平稳。非平稳趋势被延迟坐标编进第一模态，动力学模态被挤到后面；嵌入前先去趋势。\n<\/li><li>\n子前提四：窗口长度覆盖最慢周期。多频混合时窗口短于慢周期，低频分量在延迟坐标上分辨不出；序列长度要由最慢分量的周期决定下限。\n<\/li><li>\n去掉子前提的后果：间隔失配致坐标重复或脱节，维数不足致自交，非平稳污染第一模态，窗长不足致低频丢失。\n<\/ul>\n<h2>第二算例：双频正弦叠加的 Hankel 增秩与频率恢复<\/h2>\n<p><strong>已知条件<\/strong>：合成信号<\/p>\n<div class=\"katex-block\">x(t)=\\sin(2\\pi\\cdot0.2\\,t)+0.7\\sin(2\\pi\\cdot0.45\\,t)<\/div>\n<p>采样 <span class=\"katex-inline\">\\Delta t=0.05<\/span> s，共 <span class=\"katex-inline\">L=240<\/span> 点；真实频率 <span class=\"katex-inline\">f_1=0.20<\/span> Hz、<span class=\"katex-inline\">f_2=0.45<\/span> Hz。<\/p>\n<pre class=\"lang-python\"><code>import numpy as np\ndt, L = 0.05, 240\ntt = np.arange(L)*dt\nsig = np.sin(2*np.pi*0.2*tt) + 0.7*np.sin(2*np.pi*0.45*tt)\ndef hankel(sig, m):\n    return np.array([sig[i:i+L-m+1] for i in range(m)]).T<\/code><\/pre>\n<p><strong>第一步，无延迟（<span class=\"katex-inline\">m=1<\/span>）<\/strong>。Hankel 即单列，形状 <span class=\"katex-inline\">240\\times1<\/span>，唯一奇异值 <span class=\"katex-inline\">13.6436<\/span>，数值秩 1；一维回归只给实特征值，两个频率都读不出来。<\/p>\n<p><strong>第二步，五延迟（<span class=\"katex-inline\">m=5<\/span>）<\/strong>。矩阵形状 <span class=\"katex-inline\">236\\times5<\/span>，奇异值<\/p>\n<div class=\"katex-block\">30.0014,\\ 3.8544,\\ 0.1886,\\ 0.0059,\\ 0.0000<\/div>\n<p>前两个大奇异值对应主频对，第三、第四已落到小量级；双频信号的有效维度是 4（每频一个共轭对），<span class=\"katex-inline\">m=5<\/span> 留出一个冗余方向。<\/p>\n<p><strong>第三步，DMD 谱换算<\/strong>。在 <span class=\"katex-inline\">r=4<\/span> 截断子空间回归 <span class=\"katex-inline\">\\tilde A<\/span>，特征值<\/p>\n<div class=\"katex-block\">0.9900\\pm0.1409i,\\quad 0.9980\\pm0.0628i<\/div>\n<p>频率换算 <span class=\"katex-inline\">f=|\\arg\\lambda|/(2\\pi\\Delta t)<\/span>：<\/p>\n<div class=\"katex-block\">f_{2}=\\frac{0.1409}{2\\pi\\cdot0.05}=0.450\\text{ Hz},\\quad f_{1}=\\frac{0.0628}{2\\pi\\cdot0.05}=0.200\\text{ Hz}<\/div>\n<p>与真值 0.45、0.20 Hz 逐项吻合；两个模长都接近 1，对应中性振荡。<\/p>\n<p><strong>第四步，延迟数对照<\/strong>。<span class=\"katex-inline\">m=1<\/span> 秩 1 无共轭对；<span class=\"katex-inline\">m=5<\/span> 四个有效方向承载两个频率。继续加大 <span class=\"katex-inline\">m<\/span>，多出的延迟列是已有方向的线性组合，尾部奇异值不增，谱精度不再提高。<\/p>\n<ul><li>\n窗长与频率下限复核。240 点、<span class=\"katex-inline\">\\Delta t=0.05<\/span>，窗口长度 12 s；最慢分量 <span class=\"katex-inline\">f_1=0.20<\/span> Hz 周期 5 s，窗口覆盖约 2.4 个周期，低频分量可分辨。若窗口短于一个慢周期，0.20 Hz 方向在延迟坐标上展不开，奇异值谱里挤不出第二个共轭对。\n<\/li><li>\n延迟间隔口径。本算例相邻延迟平移一个采样步长 <span class=\"katex-inline\">\\Delta t=0.05<\/span> s；两频周期分别 5 s 与 2.22 s，步长只占周期的 1%–2%，相位差充足。加大延迟间隔到若干步，坐标关联变弱；间隔与周期的配合从嵌入轨迹展开程度判断。\n<\/li><li>\n双频有效维度。两个正弦各占一个共轭对，有效秩 4；<span class=\"katex-inline\">m=5<\/span> 时第五方向是冗余，奇异值落到数值零。频率差越小，两对模态的奇异值越接近，区分所需延迟数与样本长度都要增加。\n<\/li><li>\n噪声复制结构。同一测量噪声进入多个延迟行，列间共享噪声；前置滤波与加长序列压低噪声分量占比，否则第一延迟模态对准噪声平滑方向，主频特征值被扰动。\n<\/ul>\n<h2>对抗性追问：混沌序列嵌入维数不够会怎样<\/h2>\n<p>混沌吸引子维度高于嵌入维数时，不同叶瓣上的状态映射到同一延迟向量，回归模型把两段轨迹混在一起；表现为 DMD 特征值在短窗内漂移、重构轨迹在分叉点附近偏离。判据：逐步加大 <span class=\"katex-inline\">m<\/span>，看嵌入轨迹是否还有自交点、奇异值谱是否出现新的膝点；若加大 <span class=\"katex-inline\">m<\/span> 后谱仍不稳，吸引子维度超过当前嵌入能力，需要更多延迟坐标或换可观测量。HAVOK 把末坐标留作强迫项，正是承认这一分量不可被齐次线性模型覆盖。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n单正弦序列为什么 DMD 只能给出实特征值？延迟堆叠解决了哪一步？\n<\/li><li>\n写出 Hankel 矩阵一行的延迟向量，说明相邻行的关系。\n<\/li><li>\nSVD 后 <span class=\"katex-inline\">U<\/span> 与 <span class=\"katex-inline\">V<\/span> 各承担什么角色？嵌入吸引子由哪一侧的时间序列画出？\n<\/li><li>\nHAVOK 为什么把最后一个坐标留作强迫项？纳入齐次模型会出什么问题？\n<\/li><li>\n延迟数过大时 Hankel 矩阵会出现什么现象？如何从奇异值谱判断有效秩？\n<\/ol><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：Data-Driven Science and Engineering: Machine Learning, Dynamical Systems, and Control · p.401<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">SVD 与最优低秩近似<\/a><\/span><\/div><h1>c08 POD-Galerkin 降阶模型（ROM）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch04（第 11 章 Reduced Order Models，PDF 第 396–426 页；POD 与 SVD 关系见 PDF 第 30、398 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>PDE 离散化后自由度可达百万乃至十亿级，仿真昂贵，更无法支撑实时控制、Monte Carlo 分析与参数优化。需要回答：能不能从已有快照里找出一组按能量排序的正交空间模态，把高维状态展开成少数模态系数，再把支配方程投影到这组模态上，得到一个小到可以快速积分的低维方程组。<\/p>\n<p>不做降阶，高维系统每步积分成本随自由度增长，闭环控制的计算时延会削弱鲁棒性；随机挑一组基做投影，同样模态数下残差更大。POD 用数据驱动的最优能量基解决&quot;基怎么选&quot;，Galerkin 投影解决&quot;方程怎么降&quot;（PDF 第 398、344 页）。<\/p>\n<h2>定义逐句拆解<\/h2>\n<p><strong>POD（proper orthogonal decomposition）<\/strong>：本书定义为&quot;应用于 PDE 的 SVD 算法&quot;（PDF 第 398 页）。快照矩阵由时空场数据排列，SVD 得到正交模态基；在流体力学称 POD，气候学称 EOF，统计学对应 PCA/KLT，各领域独立提出，差别主要在数据收集与预处理（PDF 第 30 页）。<\/p>\n<p><strong>ROM（reduced order model）<\/strong>：用 POD 模态把 PDE 动态投影到低秩子空间，得到可快速求值的低维模型，支撑 Monte Carlo、参数优化与实时控制（PDF 第 398 页）。<\/p>\n<p><strong>POD-Galerkin 投影<\/strong>：高维方程 <span class=\"katex-inline\">\\dot u=Lu+N(u,\\beta)<\/span>，模态展开 <span class=\"katex-inline\">u(x,t)\\approx\\Phi a(t)<\/span>，<span class=\"katex-inline\">\\Phi\\in\\mathbb{R}^{n\\times r}<\/span>，<span class=\"katex-inline\">r\\ll n<\/span>；左乘 <span class=\"katex-inline\">\\Phi^T<\/span> 投影得<\/p>\n<div class=\"katex-block\">\\dot a(t)=\\Phi^TL\\Phi a(t)+\\Phi^TN(\\Phi a(t),\\beta)<\/div>\n<p>（PDF 第 406 页公式 11.21）。<\/p>\n<p>逐句拆开：<\/p>\n<ul><li>\n&quot;<span class=\"katex-inline\">\\Phi<\/span> 正交&quot;：<span class=\"katex-inline\">\\Phi^T\\Phi=I<\/span>，模态两两正交，系数 <span class=\"katex-inline\">a<\/span> 是状态在基上的坐标。\n<\/li><li>\n&quot;线性项投影&quot;：<span class=\"katex-inline\">\\Phi^TL\\Phi<\/span> 是 <span class=\"katex-inline\">r\\times r<\/span> 线性降维算子。\n<\/li><li>\n&quot;非线性项投影&quot;：<span class=\"katex-inline\">\\Phi^TN(\\Phi a,\\beta)<\/span> 把非线性交互折进低维；非线性的标志是产生模态间耦合（PDF 第 401 页）。\n<\/li><li>\n&quot;<span class=\"katex-inline\">r\\ll n<\/span>&quot;：截断阶数按快照能量占比确定，与 c01、c02 的奇异值准则一致。\n<\/ul>\n<p><strong>正例<\/strong>：湍流尾流用前几十个 POD 模态重构主导相干结构，低维模型可做实时反馈控制。 <strong>反例<\/strong>：快照只覆盖单一工况，参数 <span class=\"katex-inline\">\\beta<\/span> 改变后模态不含新结构，投影方程在外推工况上失真。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>前提<\/strong>：快照矩阵 SVD 给出 <span class=\"katex-inline\">\\Phi=[\\phi_1,\\dots,\\phi_r]<\/span>；高维系统 <span class=\"katex-inline\">\\dot u=Lu+N(u,\\beta)<\/span>；<span class=\"katex-inline\">\\Phi^T\\Phi=I<\/span>。<\/p>\n<ol><li>\n<strong>快照与模态<\/strong>。把各时刻场快照排成矩阵，SVD 左奇异向量即 POD 模态；模态按能量（奇异值平方）降序，前 <span class=\"katex-inline\">r<\/span> 个覆盖大部分变化。\n<\/li><li>\n<strong>模态展开<\/strong>。<span class=\"katex-inline\">u\\approx\\Phi a(t)<\/span>，<span class=\"katex-inline\">a\\in\\mathbb{R}^r<\/span>；状态完全由少数系数描述。\n<\/li><li>\n<strong>代入方程<\/strong>。<span class=\"katex-inline\">\\Phi\\dot a=L\\Phi a+N(\\Phi a,\\beta)<\/span>。\n<\/li><li>\n<strong>Galerkin 投影<\/strong>。两边左乘 <span class=\"katex-inline\">\\Phi^T<\/span>：左端 <span class=\"katex-inline\">\\Phi^T\\Phi\\dot a=\\dot a<\/span>；右端线性项 <span class=\"katex-inline\">\\Phi^TL\\Phi a<\/span>，非线性项 <span class=\"katex-inline\">\\Phi^TN(\\Phi a,\\beta)<\/span>。投影要求残差与基张成子空间正交。\n<\/li><li>\n<strong>低维方程<\/strong>。<span class=\"katex-inline\">\\dot a=\\Phi^TL\\Phi a+\\Phi^TN(\\Phi a,\\beta)<\/span>，在 <span class=\"katex-inline\">r<\/span> 维上积分；重构 <span class=\"katex-inline\">u=\\Phi a<\/span>。\n<\/li><li>\n<strong>非线性求值瓶颈<\/strong>。<span class=\"katex-inline\">\\Phi^TN(\\Phi a,\\beta)<\/span> 仍可能需要在原始 <span class=\"katex-inline\">n<\/span> 维上算 <span class=\"katex-inline\">N<\/span> 再内积；二次非线性（如 Navier–Stokes 部分项）可离线预计算，参数化系统随 <span class=\"katex-inline\">\\beta<\/span> 变模态，必须反复求值，这是 hyper-reduction（Gappy POD/DEIM）要解决的问题（PDF 第 406 页）。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ol><li>\n<strong>快照覆盖<\/strong>：POD 基是数据驱动的，只张成快照访问过的状态子空间；未出现的工况、模态不在基内。\n<\/li><li>\n<strong>截断阶数<\/strong>：<span class=\"katex-inline\">r<\/span> 小丢慢模态与精细结构，<span class=\"katex-inline\">r<\/span> 大纳噪声模态、低维方程刚度上升；按能量占比与预测误差联合确定。\n<\/li><li>\n<strong>非线性保持<\/strong>：Galerkin 投影不一定保持原系统的能量守恒等结构；二次非线性的模态耦合可能在低维方程中产生虚假能量增长。\n<\/li><li>\n<strong>对称性破坏<\/strong>：POD/SVD 不天然处理平移、旋转不变性；行波数据未对齐时秩虚高（PDF 第 419 页）。\n<\/li><li>\n<strong>失败案例<\/strong>：参数化系统在训练 <span class=\"katex-inline\">\\beta<\/span> 范围外运行，POD 基不含该工况结构，非线性项误差被放大；需要补快照或参数插值 ROM（第 12 章）。\n<\/li><li>\n<strong>失败案例<\/strong>：非线性项不做超降阶，每次回 <span class=\"katex-inline\">n<\/span> 维求值，低维积分省下的时间被非线性计算抵消，ROM 无实际加速。\n<\/ol>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>POD vs PCA<\/strong>：同一 SVD 分解在时空场数据上称 POD，在统计样本上称 PCA；POD 模态是空间函数，PCA 主成分是变量方向。\n<\/li><li>\n<strong>Galerkin 投影 vs 点配置投影<\/strong>：Galerkin 用内积正交条件投影；配置法选节点代入方程。两者基相同，投影条件不同。\n<\/li><li>\n<strong>ROM vs 渐近降阶<\/strong>：渐近方法在 1960 年代计算普及前是应用数学主干，用解析近似把 PDE 化简；ROM 是数据计算方法，从快照构造低维模型（PDF 第 399 页）。\n<\/li><li>\n<strong>POD 模态 vs DMD 模态<\/strong>：POD 模态按空间能量排序、不含时间谱；DMD 模态每个带增长率与频率。ROM 用 POD 基承载方程，DMD 在坐标上辨识时间演化。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：c01 SVD 低秩近似；c02 能量占比；线性/非线性 ODE、内积与投影基础。\n<\/li><li>\n后继：c09 控制器在 <span class=\"katex-inline\">r<\/span> 维 ROM 上设计；c10 Gappy POD/DEIM 解决非线性项超降阶与少量测量重构；c05 DMD 可作为 ROM 坐标下的时间辨识。\n<\/li><li>\n串联：ROM 把第 1 章的空间降维与第 7 章的动力学建模接成可仿真、可控制的低维系统。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（POD-Galerkin 降阶模型（ROM））<\/summary><div class=\"depth-body\"><h1>c08 深度推导：POD 基构造、Galerkin 投影与小系统数值算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把&quot;高维方程投影成 <span class=\"katex-inline\">r<\/span> 维 ROM&quot;推到底，逐级倒查：<\/p>\n<ol><li>\n低维基 <span class=\"katex-inline\">\\Phi<\/span> 来自快照 SVD，倒查到 c01 分解存在性与能量排序；基张成快照访问过的子空间。\n<\/li><li>\n投影方程要在低维坐标下闭合，倒查到 <span class=\"katex-inline\">\\Phi^T\\Phi=I<\/span> 的正交性；非正交基投影多出度量矩阵。\n<\/li><li>\n线性项降维成 <span class=\"katex-inline\">\\Phi^TL\\Phi<\/span>，倒查到矩阵乘法与子空间不变性；非线性项折成 <span class=\"katex-inline\">\\Phi^TN(\\Phi a,\\beta)<\/span>。\n<\/li><li>\n低维模型精度受快照覆盖范围限制，倒查到数据驱动基的外推边界。\n<\/li><li>\n非线性求值若回原维，加速收益被抵消，倒查到 hyper-reduction 的必要性（c10）。\n<\/ol>\n<p>链条断掉：基不正交，投影坐标与状态重构不闭合；快照缺工况，基外结构无模态承载；非线性不超降阶，ROM 只是形式上变小。<\/p>\n<h2>正向推导<\/h2>\n<ul><li>\n第一步，快照排列。各时刻场 <span class=\"katex-inline\">u_k\\in\\mathbb{R}^n<\/span> 排成 <span class=\"katex-inline\">X=[u_0,\\dots,u_{m-1}]<\/span>；SVD <span class=\"katex-inline\">X=U\\Sigma V^*<\/span>，取前 <span class=\"katex-inline\">r<\/span> 列 <span class=\"katex-inline\">\\Phi=U_{:,1:r}<\/span>。\n<\/li><li>\n第二步，模态展开。<span class=\"katex-inline\">u(t)\\approx\\Phi a(t)<\/span>，<span class=\"katex-inline\">a\\in\\mathbb{R}^r<\/span>；<span class=\"katex-inline\">\\Phi^T\\Phi=I<\/span>，坐标 <span class=\"katex-inline\">a=\\Phi^Tu<\/span>。\n<\/li><li>\n第三步，代入高维方程。<span class=\"katex-inline\">\\dot u=Lu+N(u,\\beta)<\/span>，得 <span class=\"katex-inline\">\\Phi\\dot a=L\\Phi a+N(\\Phi a,\\beta)<\/span>。\n<\/li><li>\n第四步，Galerkin 投影。左乘 <span class=\"katex-inline\">\\Phi^T<\/span>：<span class=\"katex-inline\">\\Phi^T\\Phi\\dot a=\\Phi^TL\\Phi a+\\Phi^TN(\\Phi a,\\beta)<\/span>，左端单位阵消去，得\n<\/ul>\n<div class=\"katex-block\">\\dot a=\\Phi^TL\\Phi a+\\Phi^TN(\\Phi a,\\beta)<\/div>\n<ul><li>\n第五步，残差正交条件。Galerkin 要求投影残差 <span class=\"katex-inline\">r(u)=\\dot u-Lu-N(u,\\beta)<\/span> 与基子空间正交：<span class=\"katex-inline\">\\Phi^Tr=0<\/span>；真实解不在子空间内时，投影是子空间内最优近似。\n<\/li><li>\n第六步，离线/在线分工。POD 基与线性项矩阵 <span class=\"katex-inline\">\\Phi^TL\\Phi<\/span> 可离线算好；在线只积分 <span class=\"katex-inline\">r<\/span> 维方程。非线性项若依赖 <span class=\"katex-inline\">\\beta<\/span> 且不可预计算，每次在线回 <span class=\"katex-inline\">n<\/span> 维求值，需要 DEIM/Gappy POD 选节点近似。\n<\/li><li>\n复杂度口径：SVD 对 <span class=\"katex-inline\">n\\times m<\/span> 快照 <span class=\"katex-inline\">O(nm\\min(n,m))<\/span>；投影矩阵 <span class=\"katex-inline\">\\Phi^TL\\Phi<\/span> 为 <span class=\"katex-inline\">O(nr^2)<\/span>；在线积分从 <span class=\"katex-inline\">O(n)<\/span> 每步降到 <span class=\"katex-inline\">O(r)<\/span>，非线性项例外。\n<\/ul>\n<h2>数值算例：六维线性系统的两模态截断<\/h2>\n<p><strong>已知条件<\/strong>：构造 <span class=\"katex-inline\">n=6<\/span> 线性系统 <span class=\"katex-inline\">\\dot u=Lu<\/span>，谱含一对慢振荡模态 <span class=\"katex-inline\">-0.2\\pm i<\/span>、一个慢衰减 <span class=\"katex-inline\">-0.5<\/span> 与三个快衰减 <span class=\"katex-inline\">-2,-3,-4<\/span>。<span class=\"katex-inline\">\\Delta t=0.05<\/span>，积分 40 步排成快照矩阵。<\/p>\n<p><strong>第一步，快照 SVD<\/strong>。奇异值<\/p>\n<div class=\"katex-block\">\\sigma_1=5.7842,\\ \\sigma_2=2.7438,\\ \\sigma_3=0.2604,\\ \\sigma_4=0.0341,\\ \\sigma_5=0.0028,\\ \\sigma_6\\approx0<\/div>\n<p>前两个模态占主导，第三项起已接近噪声/快衰减量级。<\/p>\n<p><strong>第二步，<span class=\"katex-inline\">r=2<\/span> 截断残差<\/strong>。重构 <span class=\"katex-inline\">u_r=U_{:,1:2}\\Sigma_{1:2}V_{1:2,:}^*<\/span>，Frobenius 残差<\/p>\n<div class=\"katex-block\">\\|u-u_r\\|_F=0.2627\\approx\\sigma_3=0.2604<\/div>\n<p>核对 Eckart–Young：残差能量由尾部奇异值决定。<\/p>\n<p><strong>第三步，投影降维算子<\/strong>。<span class=\"katex-inline\">\\Phi=U_{:,1:2}<\/span>，<span class=\"katex-inline\">A_r=\\Phi^TL\\Phi<\/span>。数值特征值<\/p>\n<div class=\"katex-block\">-0.215-0.038i,\\ -3.155<\/div>\n<p>慢振荡模态（真值 <span class=\"katex-inline\">-0.2\\pm i<\/span>）被近似保留；快模态在两模态子空间内被压缩成一个等效衰减方向。 <strong>第四步，<span class=\"katex-inline\">r=3<\/span> 对照<\/strong>。再保留第三模态，<span class=\"katex-inline\">A_r<\/span> 特征值 <span class=\"katex-inline\">-0.202-0.038i,\\ -2.647,\\ -3.644<\/span>，慢模态实部更接近 <span class=\"katex-inline\">-0.2<\/span>，快衰减方向也部分恢复；<span class=\"katex-inline\">r<\/span> 增大，低维谱向全维谱靠拢。 <strong>第五步，全维谱对照<\/strong>。完整 <span class=\"katex-inline\">L<\/span> 特征值 <span class=\"katex-inline\">-0.2\\pm i,\\ -0.5,\\ -2,\\ -3,\\ -4<\/span>。<span class=\"katex-inline\">r=2<\/span> 无法分辨三个快衰减方向，这是子空间截断的固有损失；控制设计若只关心慢闭环行为，两模态近似可用。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：快照单工况。训练快照全在 <span class=\"katex-inline\">\\beta=\\beta_0<\/span> 附近，<span class=\"katex-inline\">\\Phi<\/span> 不含其他参数方向；换参数后投影方程误差随参数距离增大。 反例二：非线性能量串级。湍流中能量从大模态串到小模态，截断丢掉的小模态反向反馈大模态，低维方程可能出现虚假增长或衰减。 反例三：行波未对齐。同一结构在快照间平移，POD 把位置变化拆成多个模态，有效秩抬高；先配准再分解。 反例四：非线性项回原维求值。<span class=\"katex-inline\">N(\\Phi a,\\beta)<\/span> 每次在 <span class=\"katex-inline\">n<\/span> 维算内积，在线成本不降，ROM 失去实时意义。<\/p>\n<h2>与相邻概念的推导衔接<\/h2>\n<p>c01 提供 SVD 基与残差公式；c02 能量占比决定 <span class=\"katex-inline\">r<\/span>；c05 DMD 在 ROM 坐标上辨识时间算子；c09 LQR/MPC 在 <span class=\"katex-inline\">r<\/span> 维方程上设计反馈；c10 DEIM/Gappy POD 为非线性项选插值节点。<\/p>\n<h2>推导中容易跳过的环节<\/h2>\n<ul><li>\n<span class=\"katex-inline\">\\Phi^T\\Phi=I<\/span> 要从 SVD 左奇异向量正交性推出；非正交基投影式多出基度量矩阵 <span class=\"katex-inline\">G=\\Phi^T\\Phi<\/span>。\n<\/li><li>\n投影残差正交是 Galerkin 条件，不代表残差为零；真实解在子空间外时仍有截断误差。\n<\/li><li>\n非线性项 <span class=\"katex-inline\">\\Phi^TN(\\Phi a,\\beta)<\/span> 不能像线性项那样拆成常系数矩阵，除非 <span class=\"katex-inline\">N<\/span> 是二次且可离线预计算张量。\n<\/ul>\n<h2>补充推演：POD 最优性、模态耦合与参数化扩展<\/h2>\n<ul><li>\nPOD 基的最优性。快照 SVD 的左奇异向量是给定快照集合上使投影均方误差最小的正交基；这与 c01 Eckart–Young 同源：前 <span class=\"katex-inline\">r<\/span> 模态保留最大能量方向。POD 不保证对未来新快照最优，只对训练快照最优。\n<\/li><li>\n模态耦合来源。非线性项 <span class=\"katex-inline\">N(\\Phi a,\\beta)<\/span> 展开后含不同模态系数乘积，低维方程里模态间互相驱动；线性系统 <span class=\"katex-inline\">N=0<\/span> 时 <span class=\"katex-inline\">\\Phi^TL\\Phi<\/span> 是常矩阵，模态解耦程度由 <span class=\"katex-inline\">L<\/span> 决定。\n<\/li><li>\n能量保持问题。Galerkin 投影不一定继承原系统的二次守恒律；截断后小模态携带的能量被丢弃，非线性串级可能在低维方程中表现为虚假增长或衰减。带守恒约束的投影格式是改进方向。\n<\/li><li>\n参数化 ROM。<span class=\"katex-inline\">\\beta<\/span> 变化时快照集合改变，POD 基随之变化；第 12 章在多参数快照上建基，用插值组合不同工况的低维模型。单工况基不能覆盖参数区间。\n<\/li><li>\n与平衡降阶的分工。第 9 章 Gramians 平衡按&quot;易观测且易控制&quot;排序状态，面向控制设计；POD 按能量排序模态，面向场数据重构。两条降阶路线在控制器设计前汇合（PDF 第 344 页）。\n<\/li><li>\n残差与阶数选择。本算例 <span class=\"katex-inline\">r=2<\/span> 残差 <span class=\"katex-inline\">0.2627\\approx\\sigma_3<\/span>；<span class=\"katex-inline\">r<\/span> 增大残差按尾部奇异值平方和下降。实际选 <span class=\"katex-inline\">r<\/span> 时对照留出快照重构误差与低维方程预测误差，不只看能量占比。\n<\/li><li>\n离线/在线分工补充。基 <span class=\"katex-inline\">\\Phi<\/span>、线性矩阵 <span class=\"katex-inline\">\\Phi^TL\\Phi<\/span> 离线算好；在线积分 <span class=\"katex-inline\">r<\/span> 维方程。非线性项若可离线预计算张量（二次项情形），在线代价也压到 <span class=\"katex-inline\">O(r^2)<\/span>；否则必须超降阶。\n<\/ul>\n<h2>补充推演（二）：投影残差与非正交基复核<\/h2>\n<ul><li>\nGalerkin 残差正交代数。代入后高维残差 <span class=\"katex-inline\">r=\\Phi\\dot a-L\\Phi a-N(\\Phi a,\\beta)<\/span>；左乘 <span class=\"katex-inline\">\\Phi^T<\/span> 置零得 <span class=\"katex-inline\">\\Phi^Tr=0<\/span>。这只要求残差在基张成子空间内分量为零，子空间外分量不被约束；真实解不在子空间内时截断误差存在。\n<\/li><li>\n非正交基度量矩阵。基 <span class=\"katex-inline\">\\Phi<\/span> 不正交时 <span class=\"katex-inline\">\\Phi^T\\Phi=G\\ne I<\/span>，投影方程为 <span class=\"katex-inline\">G\\dot a=\\Phi^TL\\Phi a+\\Phi^TN(\\Phi a,\\beta)<\/span>，求解前要在 <span class=\"katex-inline\">G<\/span> 上配平；SVD 基天然正交，<span class=\"katex-inline\">G=I<\/span> 是 c08 走 Galerkin 投影的前提。\n<\/li><li>\n本算例残差复核。<span class=\"katex-inline\">r=2<\/span> 截断 Frobenius 残差 <span class=\"katex-inline\">0.2627<\/span>，尾部首个奇异值 <span class=\"katex-inline\">\\sigma_3=0.2604<\/span>；残差略大于 <span class=\"katex-inline\">\\sigma_3<\/span>，差值来自 <span class=\"katex-inline\">\\sigma_4,\\sigma_5<\/span> 的小贡献，Eckart–Young 上界 <span class=\"katex-inline\">\\sqrt{\\sigma_3^2+\\sigma_4^2+\\sigma_5^2}<\/span> 覆盖该值。\n<\/li><li>\n二次非线性离线张量。<span class=\"katex-inline\">N<\/span> 为二次型时 <span class=\"katex-inline\">\\Phi^TN(\\Phi a)<\/span> 可预计算为三阶张量，在线按 <span class=\"katex-inline\">a<\/span> 的分量乘积求值，代价 <span class=\"katex-inline\">O(r^2)<\/span>；一般非线性项每次回 <span class=\"katex-inline\">n<\/span> 维求值，需要 c10 超降阶。\n<\/li><li>\n模态截断与谱偏离。<span class=\"katex-inline\">r=2<\/span> 低维谱 <span class=\"katex-inline\">-0.215-0.038i,-3.155<\/span>；慢模态实部 <span class=\"katex-inline\">-0.215<\/span> 偏离真值 <span class=\"katex-inline\">-0.2<\/span>，虚部被快模态耦合压缩；<span class=\"katex-inline\">r=3<\/span> 后实部 <span class=\"katex-inline\">-0.202<\/span> 更接近真值，截断方向数随 <span class=\"katex-inline\">r<\/span> 恢复。\n<\/ul>\n<h2>延伸推演：Galerkin 投影前提再拆一层<\/h2>\n<p>高维方程投影成 <span class=\"katex-inline\">r<\/span> 维 ROM，依赖四条子条件。<\/p>\n<ul><li>\n子前提一：POD 基正交。SVD 左奇异向量满足 <span class=\"katex-inline\">\\Phi^T\\Phi=I<\/span>，投影方程左端单位阵消去；基不正交时多出度量矩阵 <span class=\"katex-inline\">G=\\Phi^T\\Phi<\/span>，低维方程要在 <span class=\"katex-inline\">G<\/span> 上配平。\n<\/li><li>\n子前提二：快照子空间近不变。真实轨迹大部分时间停在快照张成的子空间附近；子空间外的分量在投影残差里，子前提失效时截断误差随时间累积。\n<\/li><li>\n子前提三：快照覆盖工况范围。训练快照全在单一参数附近，<span class=\"katex-inline\">\\Phi<\/span> 不含其他方向；换参数后投影误差随参数距离增大，多参数 ROM 需要多工况快照建基。\n<\/li><li>\n子前提四：非线性项可超降阶。非线性求值若每次回 <span class=\"katex-inline\">n<\/span> 维，在线成本不降；二次项可离线预计算张量，一般非线性项必须靠 DEIM/Gappy POD 选节点近似。\n<\/li><li>\n去掉子前提的后果：基非正交出度量矩阵，子空间不变性失效致残差累积，覆盖不足致外推误差，非线性不超降阶抵消加速收益。\n<\/ul>\n<h2>第二算例：五维线性系统的两级截断谱对照<\/h2>\n<p><strong>已知条件<\/strong>：构造 <span class=\"katex-inline\">n=5<\/span> 线性系统 <span class=\"katex-inline\">\\dot u=Lu<\/span>，全维谱为一对慢振荡 <span class=\"katex-inline\">-1\\pm0.8i<\/span>、三个衰减方向 <span class=\"katex-inline\">-1.5,-3,-5<\/span>。先在实正交基下把谱写成实块对角阵，再经正交相似得到 <span class=\"katex-inline\">L<\/span>；<span class=\"katex-inline\">\\Delta t=0.05<\/span>，积分 40 步排快照。<\/p>\n<pre class=\"lang-python\"><code>import numpy as np\nfrom scipy import linalg\nJ = np.zeros((5,5))\nJ[:2,:2] = [[-1,0.8],[-0.8,-1]]\nJ[2,2], J[3,3], J[4,4] = -1.5, -3, -5\nQ,_ = np.linalg.qr(rng.standard_normal((5,5)))\nL = Q@J@Q.T\n# 积分排快照后 SVD\nU,S,Vt = np.linalg.svd(X, full_matrices=False)<\/code><\/pre>\n<p><strong>第一步，快照奇异值<\/strong>。实算<\/p>\n<div class=\"katex-block\">\\sigma_1=3.3337,\\ \\sigma_2=1.1443,\\ \\sigma_3=0.3075,\\ \\sigma_4=0.0378,\\ \\sigma_5=0.0001<\/div>\n<p>前两个方向占主导，第三项起进入尾部。<\/p>\n<p><strong>第二步，<span class=\"katex-inline\">r=2<\/span> 截断<\/strong>。Frobenius 残差<\/p>\n<div class=\"katex-block\">\\|X-X_2\\|_F=0.3098\\approx\\sigma_3=0.3075<\/div>\n<p>投影算子 <span class=\"katex-inline\">A_2=\\Phi_2^TL\\Phi_2<\/span> 特征值<\/p>\n<div class=\"katex-block\">-1.4726\\pm0.4077i<\/div>\n<p>慢振荡对被近似保留，但实部偏左（真值 <span class=\"katex-inline\">-1.0<\/span>）、虚部被压缩（真值 <span class=\"katex-inline\">\\pm0.8<\/span>）；三个快衰减方向在二维子空间里压成一个等效方向。<\/p>\n<p><strong>第三步，<span class=\"katex-inline\">r=3<\/span> 对照<\/strong>。残差 <span class=\"katex-inline\">0.0378\\approx\\sigma_4=0.0378<\/span>；<span class=\"katex-inline\">A_3<\/span> 特征值<\/p>\n<div class=\"katex-block\">-3.6125,\\ -1.0343\\pm0.7893i<\/div>\n<p>慢振荡对实部 <span class=\"katex-inline\">-1.0343<\/span>、虚部 <span class=\"katex-inline\">\\pm0.7893<\/span> 更接近真值 <span class=\"katex-inline\">-1\\pm0.8i<\/span>；一个快衰减方向 <span class=\"katex-inline\">-3.61<\/span> 部分恢复，<span class=\"katex-inline\">-1.5<\/span> 与 <span class=\"katex-inline\">-5<\/span> 仍被压缩。<\/p>\n<p><strong>第四步，全维谱对照<\/strong>。完整 <span class=\"katex-inline\">L<\/span> 特征值 <span class=\"katex-inline\">-5,-3,-1.5,-1\\pm0.8i<\/span>。截断方向数随 <span class=\"katex-inline\">r<\/span> 恢复；<span class=\"katex-inline\">r=2<\/span> 无法分辨三个快方向，这是子空间截断的固有损失，控制设计只关心慢闭环行为时两模态近似可用。<\/p>\n<ul><li>\n离线/在线分工复核。基 <span class=\"katex-inline\">\\Phi<\/span> 与投影矩阵 <span class=\"katex-inline\">\\Phi^TL\\Phi<\/span> 离线算好；本算例线性系统 <span class=\"katex-inline\">N=0<\/span>，在线只积分 <span class=\"katex-inline\">r<\/span> 维方程。奇异值 <span class=\"katex-inline\">0.0378<\/span> 以下方向在快照中能量占比已不足 1%，截断后残差被尾部奇异值平方和约束。\n<\/ul>\n<h2>对抗性追问：非线性能量串级时低维模型会假增长吗<\/h2>\n<p>湍流中能量从大模态串到小模态，截断丢掉的小模态反向反馈大模态；Galerkin 投影不继承原系统二次守恒律，低维方程可能出现虚假增长或衰减。判据：把 ROM 长时间积分，对比高维参考解的能量轨迹；若低维模型幅值持续发散而参考解有界，说明截断切断了能量回流通道。改进方向是带守恒约束的投影格式，或在截断基中保留携带回流信息的模态；单看快照能量占比，识别不出这种串级损失。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出 POD-Galerkin 低维方程，说明每一项的来源。\n<\/li><li>\n为什么快照覆盖范围决定 ROM 的可信边界？\n<\/li><li>\n线性项 <span class=\"katex-inline\">\\Phi^TL\\Phi<\/span> 与非线性项 <span class=\"katex-inline\">\\Phi^TN(\\Phi a,\\beta)<\/span> 在离线/在线计算上有何差别？\n<\/li><li>\n截断残差与被丢弃奇异值是什么关系？<span class=\"katex-inline\">r<\/span> 增大时低维谱如何变化？\n<\/li><li>\n平移不变数据为何让 POD 有效秩虚高？缓解手段是什么？\n<\/ol><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：Data-Driven Science and Engineering: Machine Learning, Dynamical Systems, and Control · p.316<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">POD-Galerkin 降阶模型（ROM）<\/a><\/span><\/div><h1>c09 LQR 与 Model Predictive Control (MPC)<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（8.4 Optimal Full-State Control: LQR，PDF 第 316–318 页；10.2 Machine Learning Control、MPC 案例，PDF 第 369–374 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>系统建模之后，目标是主动操控行为。全状态可测时，反馈律 <span class=\"katex-inline\">u=-Kx<\/span> 可以把闭环极点放到左半平面，但极点压得过头需要极大控制量、放大噪声与时延敏感。需要回答：如何在&quot;状态调节得好&quot;与&quot;控制能量省&quot;之间求最优权衡，给出常数反馈增益；对带约束、时延与强非线性的系统，LQR 这类全局线性反馈不够用时，滚动时域优化如何工作，数据驱动模型（eDMD、SINDYc）怎么进入回路。<\/p>\n<p>不做最优权衡，极点配置凭经验：要么反馈太弱、状态收敛慢，要么太激进、控制饱和且鲁棒性下降；不做滚动优化，硬约束（作动幅值、速率）无法在反馈律里显式处理。<\/p>\n<h2>定义逐句拆解<\/h2>\n<p><strong>LQR（linear quadratic regulator）<\/strong>：全状态可测下，最小化二次积分代价的最优状态反馈。代价函数<\/p>\n<div class=\"katex-block\">J(t)=\\int_0^t\\left(x(\\tau)^*Qx(\\tau)+u(\\tau)^*Ru(\\tau)\\right)d\\tau<\/div>\n<p><span class=\"katex-inline\">Q=Q^<em>\\succeq0<\/span> 惩罚状态偏差，<span class=\"katex-inline\">R=R^<\/em>\\succ0<\/span> 惩罚控制能量（PDF 第 316 页公式 8.44）。<\/p>\n<p>逐句拆开：<\/p>\n<ul><li>\n&quot;全状态可测&quot;：<span class=\"katex-inline\">y=x<\/span>；状态不可测时需先靠可观性构造全状态估计（Kalman 滤波，第 8.5 节）。\n<\/li><li>\n&quot;二次代价&quot;：状态与控制都按平方计入，大偏差被加权但不出现离群式惩罚。\n<\/li><li>\n&quot;最优反馈&quot;：<span class=\"katex-inline\">u=-K_rx<\/span>，<span class=\"katex-inline\">K_r<\/span> 由代数 Riccati 方程解出；在所有含非线性的控制律中，该线性反馈对这个二次代价最优（PDF 第 317 页图 8.9）。\n<\/ul>\n<p><strong>MPC（model predictive control）<\/strong>：在滚动时域上反复求解带约束的最优控制问题：每步用当前模型预测未来 <span class=\"katex-inline\">N<\/span> 步状态，优化序列作动输入，只执行第一步，下一时刻滚动重解（PDF 第 373–374 页图 10.2）。<\/p>\n<ul><li>\n模型可来自线性系统辨识、神经网络、Volterra 级数、ARX/ARMA/NARX/NARMAX，或本书的 eDMD、SINDYc（PDF 第 373 页）。\n<\/li><li>\n处理强非线性、约束、时延、非最小相位与不稳定；是现代过程控制的基石。\n<\/ul>\n<p><strong>正例<\/strong>：LQR 调节倒立摆/小车，<span class=\"katex-inline\">Q<\/span> 加权位置与角度、<span class=\"katex-inline\">R<\/span> 加权作动力，Riccati 解出常增益反馈。 <strong>反例<\/strong>：作动幅值有硬上限却只调 <span class=\"katex-inline\">R<\/span>，LQR 最优解可能算出饱和外的控制量；约束需要 MPC 显式处理。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>前提<\/strong>：线性系统 <span class=\"katex-inline\">\\dot x=Ax+Bu<\/span>，全状态可测；<span class=\"katex-inline\">Q\\succeq0<\/span>，<span class=\"katex-inline\">R\\succ0<\/span>。<\/p>\n<ol><li>\n<strong>代价结构<\/strong>。<span class=\"katex-inline\">x^<em>Qx<\/span> 度量偏离原点的程度，<span class=\"katex-inline\">u^<\/em>Ru<\/span> 度量消耗的控制能量；<span class=\"katex-inline\">Q<\/span> 对角元对应各状态权重，<span class=\"katex-inline\">R<\/span> 对角元对应各作动通道权重。<span class=\"katex-inline\">R<\/span> 太小鼓励激进反馈，<span class=\"katex-inline\">R<\/span> 太大调节迟缓（PDF 第 316 页）。\n<\/li><li>\n<strong>增广代价与协态<\/strong>。加终端成本、引入 <span class=\"katex-inline\">1/2<\/span> 因子，拉格朗日乘子 <span class=\"katex-inline\">\\lambda<\/span>（co-state）强制动力学约束：<span class=\"katex-inline\">J_{\\text{aug}}=\\int[\\frac12(x^<em>Qx+u^<\/em>Ru)+\\lambda^<em>(Ax+Bu-\\dot x)]d\\tau+\\frac12x(t_f)^<\/em>Q_fx(t_f)<\/span>（PDF 第 318 页公式 8.49）。\n<\/li><li>\n<strong>变分取极值<\/strong>。对增广代价取变分，分部积分处理 <span class=\"katex-inline\">-\\lambda^<em>\\delta\\dot x<\/span>；配平 <span class=\"katex-inline\">\\delta x,\\delta u<\/span> 系数得协态方程与驻点条件。<span class=\"katex-inline\">\\partial L/\\partial x=x^<\/em>Q<\/span>，<span class=\"katex-inline\">\\partial L/\\partial u=u^*R<\/span>（PDF 第 318 页公式 8.50）。\n<\/li><li>\n<strong>Riccati  ansatz<\/strong>。设值函数 <span class=\"katex-inline\">V(x)=x^<em>Px<\/span>，<span class=\"katex-inline\">P<\/span> 对称正定；协态 <span class=\"katex-inline\">\\lambda=Px<\/span>。代入驻点条件，对 <span class=\"katex-inline\">u<\/span> 求导得 <span class=\"katex-inline\">Ru+B^<\/em>\\lambda=0<\/span>，即 <span class=\"katex-inline\">u=-R^{-1}B^<em>Px=-K_rx<\/span>，<span class=\"katex-inline\">K_r=R^{-1}B^<\/em>P<\/span>。\n<\/li><li>\n<strong>代数 Riccati 方程<\/strong>。配平后 <span class=\"katex-inline\">P<\/span> 满足 <span class=\"katex-inline\">A^<em>P+PA-PBR^{-1}B^<\/em>P+Q=0<\/span>；解出 <span class=\"katex-inline\">P<\/span> 即得常增益 <span class=\"katex-inline\">K_r<\/span>。\n<\/li><li>\n<strong>闭环与边界<\/strong>。闭环矩阵 <span class=\"katex-inline\">A-BK_r<\/span> 特征值决定稳定性；LQR 对二次代价最优，但不直接保证鲁棒性，时延、未建模动态与噪声需鲁棒控制与频域方法补充（PDF 第 316 页）。\n<\/li><li>\n<strong>MPC 滚动优化<\/strong>。每步在预测时域 <span class=\"katex-inline\">[t,t+N\\Delta t]<\/span> 上解\n<\/ol>\n<div class=\"katex-block\">\\min_{u_{0:N-1}}\\sum_{k=0}^{N-1}(x_k^*Qx_k+u_k^*Ru_k)+x_N^*Q_fx_N<\/div>\n<p>subject to <span class=\"katex-inline\">x_{k+1}=f(x_k,u_k)<\/span> 与约束 <span class=\"katex-inline\">u_{\\min}\\le u_k\\le u_{\\max}<\/span>；执行 <span class=\"katex-inline\"
