*x = 0<\/code> 先读出外部地址，再按地址写回本体，外部变量被改掉。传引用生成的指令与传指针完全相同，属于语法糖。寄存器装不下的复杂参数改走堆栈，载体不同、原理一致。<\/p>\n<p>3.2 节拆函数括号：push rbp 存主调基准，mov rbp, rsp 对齐基准线，sub 下压栈顶给局部变量分配空间。本书 msvc 示例两个 int 局部变量相对基准偏移 4 和 8。3.3 节跟完整往返：call 先压返回地址再跳转；结语 mov esp, ebp 把栈顶降回基准，pop rbp 恢复旧基准，ret 把返回地址送 rip，跳回主调打断点。<\/p>\n<p>栈帧布局按本书示例自上而下（低地址方向）：局部变量区 → 保存的旧 rbp → 返回地址。理解这条顺序，才能判断越界写先踩到哪一层。<\/p>\n<h2>算例<\/h2>\n<p>自拟栈帧推算：函数内 <code>long a[2];<\/code> 局部区 16 字节；序言压入旧 rbp 8 字节，call 压入返回地址 8 字节。整帧从局部变量区到返回地址共 32 字节（不含对齐）。若局部变量 a 基址 0x5000，a[0]=0x5000、a[1]=0x5008，旧 rbp 在 0x5010，返回地址在 0x5018。 自拟传参判断：<code>void f(int x) { x = 9; }<\/code> 调用 <code>f(n);<\/code> 后 n 不变，因为 x 是帧上副本；<code>void g(int<em> p) { <\/em>p = 9; }<\/code> 调用 <code>g(&amp;n);<\/code> 后 n 变 9，因为按地址写回本体。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：以为传引用是独立第三种机制；机器层面与传指针同一路径。反例二：以为形参与实参共享一份存储；传值时帧上是独立副本。反例三：以为函数返回后栈帧内容还能安全使用；帧空间随之回收，悬挂指针指向已回收区域。 边界：寄存器传参顺序与名称是本书 x86-64 约定；Windows x64 或 ARM 平台传参寄存器不同，读汇编先确认调用约定。栈帧偏移随局部变量数量和类型宽度变化，示例偏移不能套到别的函数。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n前三个参数在示例中走哪三个寄存器？（答案：rdi、rsi、rdx。）\n<\/li><li>\n传值为什么改不动外部实参？（答案：函数内改的是栈帧副本，本体在主调栈帧。）\n<\/li><li>\n栈帧序言三条关键指令？（答案：push rbp；mov rbp, rsp；sub rsp, N。）\n<\/li><li>\nret 从哪里取返回地址？（答案：栈顶保存的返回地址，送入 rip。）\n<\/ol>\n<h2>推演延伸：栈帧字节估算与传参对照<\/h2>\n<p>估算一帧：局部变量按宽度叠加，加上 call 压入的返回地址 8 字节、序言保存的旧 rbp 8 字节，再算对齐填充。示例 <code>long a[2]<\/code> 局部区 16 字节，整帧至少 32 字节；若再加一个 int 参数副本，帧上再占 4 字节（可能对齐到 8）。<\/p>\n<p>传值与传指针对照成表：传值送变量值，帧上建副本，函数内改动隔离在副本；传指针送变量地址，帧上存地址，* 操作沿地址写回本体；传引用生成代码同传指针，语法层提供别名约束。复杂参数（大对象）寄存器装不下时走堆栈，本质仍是在主调与被调之间传递信息载体。<\/p>\n<p>调用约定边界：本书示例是 x86-64 System V 风格，前三个参数 rdi、rsi、rdx；Windows x64 用 rcx、rdx、r8、r9；ARM 用 r0–r3。读别人汇编先确认平台约定，不要把寄存器名字当成通用规则。栈帧偏移也随变量数量、类型、对齐变化，示例偏移只对示例代码成立。<\/p>\n<h2>推演延伸：栈帧估算与调用约定边界<\/h2>\n<p>帧大小粗算：返回地址 8 字节 + 旧 rbp 8 字节 + 局部变量与参数副本按宽度叠加，再补对齐填充。示例 long a[2] 局部区 16 字节，整帧至少 32 字节；再加参数副本时按各自宽度逐格叠加。<\/p>\n<p>传参寄存器不够用时：超出约定数量的参数走栈，主调在栈上留出位置，被调从栈上读取；返回值放约定寄存器，超大返回对象可能经隐藏指针回写到主调提供的空间。<\/p>\n<p>失败对照：跨调用约定混编，比如按另一种约定调用本平台函数，会导致栈上参数错位、栈顶不平，返回后地址错乱；保持调用两边同一套约定是栈帧能对上的前提。平台之间寄存器名字、栈清理责任方都可能不同。<\/p>\n<h2>正向推导细化：参数从寄存器到栈帧副本<\/h2>\n<p>以 <code>func1(long x, long y, long z)<\/code> 为底，按本书 x86-64 示例推演：<\/p>\n<ol><li>\n调用前：参数经 mov 送进 rdi、rsi、rdx（低 32 位 edi、esi、edx）；传值送变量值，传指针送变量地址。\n<\/li><li>\n进函数序言后，寄存器要留作他用，参数被拷进栈帧：x → [rbp-8]，y → [rbp-16]，z → [rbp-24]。\n<\/li><li>\n函数内改形参：只动这些副本；传值时主调栈帧里的本体不被触碰。\n<\/li><li>\n传指针时：副本里存的是外部地址，<code>*x = 0<\/code> 先读副本得地址，再按地址写回本体。\n<\/li><li>\n返回值放 rax；帧收尾把栈顶降回基准，pop rbp，ret 跳回。\n<p>参数先进寄存器暂存，再落栈帧副本；栈帧上每个参数副本占一个 long（8 字节）格位。<\/p>\n<\/ol>\n<h2>完整算例：三参数函数栈帧表（自拟）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>偏移（相对 rbp）<\/th><th>内容<\/th><th>谁写入<\/th><\/tr><\/thead><tbody><tr><td>rbp+8<\/td><td>返回地址<\/td><td>call 压入<\/td><\/tr><tr><td>rbp+0<\/td><td>保存的旧 rbp<\/td><td>push rbp<\/td><\/tr><tr><td>rbp-8<\/td><td>形参 x 副本<\/td><td>序言从 rdi 拷入<\/td><\/tr><tr><td>rbp-16<\/td><td>形参 y 副本<\/td><td>序言从 rsi 拷入<\/td><\/tr><tr><td>rbp-24<\/td><td>形参 z 副本<\/td><td>序言从 rdx 拷入<\/td><\/tr><\/tbody><\/table><\/div>\n<p>帧大小粗算：返回地址 8 + 旧 rbp 8 + 三个 long 副本 24 = 40 字节，再加局部变量与对齐填充。参数超出寄存器约定数量时，多余参数走栈传递。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“形参和实参是同一个变量”<\/strong>：反例——传值时栈帧里是独立副本，改副本不影响本体；两者在主调和被调两个帧上，位置不重叠。\n<\/li><li>\n<strong>“所有参数都走寄存器”<\/strong>：反例——超出约定寄存器数量、或尺寸过大的参数改走堆栈，载体不同但传递原理一致。\n<\/li><li>\n<strong>“栈帧大小就是局部变量字节数之和”<\/strong>：反例——还要加返回地址、旧 rbp 保存区和对齐填充，只加局部变量会算小一帧。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n传引用生成的代码和哪种传递相同？（答案：传指针；差别只在语法约束，不在机器动作。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "参数传递与栈帧"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.105<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">参数传递与栈帧<\/a><\/span><\/div><h1>堆与栈的区别<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>问题<\/h2>\n<p>栈和栈上变量大家都写过，堆也常听，二者到底差在哪？为什么栈调用完自动回收，堆却要 free/delete？递归太深打爆的是哪一块？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n栈（stack）是线程私有、随函数调用自动伸缩的内存，生长方向由高地址向低地址。\n<\/li><li>\n堆（heap）是程序员手动申请释放、可多线程共享的内存，生长方向由低地址向高地址。\n<\/li><li>\n栈记录函数返回地址、提供临时变量空间；申请释放只需移动 rsp，往往一条指令完成。\n<\/li><li>\n堆靠 malloc、calloc、realloc、new 申请，free、delete 释放；多次分配释放后会出现内存碎片，忘记释放即内存泄漏。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 3.6 节先厘清命名：stack 译“栈”，heap 译“堆”，二者不是一回事。每个线程都有自己的栈：主线程一个栈，新建线程由操作系统准备同等大小的栈内存。栈上记录返回地址、放临时变量；函数调用时申请栈内存，返回时释放，只移动 rsp。递归示例中局部变量 a 的地址逐层降低，变量间隔固定 32（0x20）字节，验证栈由高地址向低地址生长。<\/p>\n<p>堆空间通常大得多，用来放较大数据。申请是显式的：malloc/calloc/realloc 或 new 拿到块地址，free/delete 归还；块可被多个线程访问。堆由低地址向高地址生长；malloc/free 本身是复杂管理函数，多次分配释放后大块完整堆内存会变得支离破碎，即内存碎片。本书把忘记 free 比作借债不还。<\/p>\n<p>栈空间一般较小，深递归或栈上分配过大会爆栈（stack overflow）；堆分配释放只能由程序员按代码安排。没有操作系统的环境（如单片机），堆和栈都要手动划分。本书还观察到：两个线程调用同一 func，函数内局部变量 a 分别存在各自线程栈里，互不干扰；static 变量另算，不在栈上。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n栈大小由操作系统决定，常见从几十 KB 到几 MB 量级；具体值随平台和线程配置变化。\n<\/li><li>\n堆可共享指的是分配块的地址可被多线程访问；共享时的数据互斥要靠锁等机制保证。\n<\/li><li>\n条件去掉会怎样：如果堆也随函数返回自动回收，就没有泄漏概念；如果栈可被多线程随意写入，线程隔离就不成立。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：以为堆和栈都自动回收；栈自动，堆必须显式释放。\n<\/li><li>\n反例二：以为二者生长方向相同；栈向下长，堆向上长。\n<\/li><li>\n反例三：以为栈上能放长期存活的大块数据；栈随帧回收，长期数据应放堆或数据段。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n栈 vs 堆：私有 vs 共享；自动伸缩 vs 手动管理；一条指令 vs 管理函数；小而快 vs 大而慢。\n<\/li><li>\n内存泄漏 vs 栈溢出：前者堆块忘记归还，后者栈空间被递归/大数组耗尽。\n<\/li><li>\n数据结构书的“堆（优先队列）” vs 本书 heap：原理可相通，使用场景不同，不要混为一谈。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：参数传递与栈帧。\n<\/li><li>\n后置：虚拟内存与地址映射、存储期 static/global/local。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（堆与栈的区别）<\/summary><div class=\"depth-body\"><h1>堆与栈的区别 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要分清堆和栈，先得会：栈帧结构与返回地址位置；函数调用时局部变量放在哪；寄存器 rsp 如何标识栈顶。再往前需要理解：生存期由存储位置决定，自动回收还是手动释放，是两类内存最根本的分界。<\/p>\n<h2>正向推导<\/h2>\n<p>本书 3.6 节先厘清命名：stack 译“栈”，heap 译“堆”，二者不是一回事。每个线程都有自己的栈：主线程一个栈，新建线程由操作系统准备同等大小的栈内存。栈记录返回地址、放临时变量；函数调用时申请栈内存，返回时释放，只移动 rsp，往往一条指令完成。递归示例中局部变量 a 的地址逐层降低，变量间隔固定 32（0x20）字节，验证栈由高地址向低地址生长。<\/p>\n<p>堆空间通常大得多，用来放较大数据。申请是显式的：malloc、calloc、realloc 或 new 拿到块地址，free、delete 归还；块可被多个线程访问。堆由低地址向高地址生长。malloc/free 本身是复杂管理函数，多次分配释放后大块完整堆内存会变得支离破碎，即内存碎片。本书把忘记 free 比作借债不还。<\/p>\n<p>栈空间一般较小，深递归或栈上分配过大会爆栈（stack overflow）；堆分配释放只能由程序员按代码安排。没有操作系统的环境（如单片机），堆和栈都要手动划分。本书还观察到：两个线程调用同一 func，函数内局部变量 a 分别存在各自线程栈里，互不干扰；static 变量另算，不在栈上。<\/p>\n<p>对照两条故障路径：内存泄漏是堆块忘记归还，长期累积耗尽内存；栈溢出是递归过深或栈上数组过大，把线程私有栈打满。前者回收责任在程序员，后者往往由调用深度或局部块尺寸触发。<\/p>\n<h2>算例<\/h2>\n<p>自拟生长方向推算：栈上连续两次函数调用，局部变量地址从高到低排列；堆上连续四次 malloc，返回地址从低到高排列。 自拟容量判断：线程栈常见几十 KB 到几 MB 量级（具体由操作系统决定），在栈上放一个百万级 int 数组（约 4MB）大概率爆栈；同样数据放堆上，只要进程虚拟空间和物理内存允许即可存活。 自拟共享判断：栈上局部变量线程间不可见；堆块地址可传给另一线程访问，但并发读写要加锁保护。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：以为堆和栈都自动回收；栈自动，堆必须显式释放。反例二：以为二者生长方向相同；栈向下长，堆向上长。反例三：以为栈上能放长期存活的大块数据；栈随帧回收，长期数据应放堆或数据段。 边界：栈大小由操作系统和线程配置决定，不是固定值；堆“可共享”指分配块地址可被多线程使用，共享数据的互斥仍需锁等机制。数据结构书里的“堆（优先队列）”与本书 heap 原理可相通，但使用场景不同，不要混称。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n栈和堆各自的生长方向？（答案：栈高地址→低地址；堆低地址→高地址。）\n<\/li><li>\n栈的申请释放为什么快？（答案：只移动 rsp，一条指令完成，编译器高度优化。）\n<\/li><li>\n内存泄漏对应哪类内存？（答案：堆块 malloc/new 后忘记 free/delete。）\n<\/li><li>\n爆栈由什么触发？（答案：深递归或栈上分配过大，栈空间耗尽。）\n<\/ol>\n<h2>推演延伸：故障形态与选择依据<\/h2>\n<p>两类故障对照：内存泄漏是堆块申请后忘记归还，进程长期运行把可用堆内存耗尽，常见于长驻服务；栈溢出是递归过深或栈上数组过大，把线程私有栈打满，通常触发即崩溃。前者慢性累积，后者急性爆发。<\/p>\n<p>选择存储位置的依据：生存期贯穿全程的常量/静态数据放数据段；函数内临时量放栈；尺寸大、需要跨函数持有或动态伸缩的数据放堆。栈快但小，堆慢但大；线程私有栈保证局部变量不被其他线程踩到，共享堆块则必须配合锁保护并发读写。<\/p>\n<p>再推生长方向：栈从高地址向低地址延伸，递归越深地址越低；堆从低地址向高地址增长，连续申请的块地址依次升高。分配器在 free 后合并相邻空闲块，反复申请释放会留下无法利用的碎片。没有操作系统的裸机环境，堆和栈都要程序员手动划定边界，这是单片机开发常见做法。<\/p>\n<h2>推演延伸：栈堆选择与故障定位<\/h2>\n<p>生存期对照：栈变量离开函数即不可再用，返回栈上局部变量地址得到的是悬挂指针；堆块只要不释放就一直有效，但忘记释放造成泄漏；数据段变量全程有效。判断“这个值还能不能用”，先定位它住在哪块内存。<\/p>\n<p>故障定位：爆栈通常伴随调用链极深或栈上大数组，看递归层数和局部大块占用；泄漏看进程常驻内存是否持续增长，长驻服务每请求分配一块忘了 free 最典型。两类故障一个急性、一个慢性，排查路径不同。<\/p>\n<p>碎片：反复申请释放不同大小块，空闲块被已用块切碎，大块连续空间找不到；分配器合并相邻空闲块缓解，但不能复原被切碎的布局。线程模型上每个线程独立栈，局部变量天然隔离；共享堆块跨线程可见，读写竞争要靠锁。无操作系统环境里堆栈边界手动划分，越界会直接踩进对方区域。<\/p>\n<h2>正向推导细化：栈帧伸缩与堆块分配对照<\/h2>\n<p>栈侧逐条推演：<\/p>\n<ol><li>\n调用函数：call 压返回地址，序言 push rbp、mov rbp,rsp、sub rsp,N 向下分空间。\n<\/li><li>\n局部变量在分好的区间内；返回时栈顶降回基准，pop rbp，ret 跳回，整帧归还。\n<\/li><li>\n栈申请释放只移动 rsp，往往一条指令完成；线程私有，局部变量不被其他线程踩到。\n<\/li><li>\nmalloc/calloc/realloc/new 在堆上查找空闲块，返回块首地址；块由分配器管理，地址不连续对应源码顺序。\n<\/li><li>\nfree/delete 归还块；多次申请释放后大块被切碎，形成碎片。\n<\/li><li>\n堆可被多线程访问，共享块的并发读写要另加锁；堆没有“帧”这一随调用自动回收的单位。\n<p>堆侧对照：<\/p>\n<\/ol>\n<h2>完整算例：两类内存的地址与生存期对照（自拟）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>栈<\/th><th>堆<\/th><\/tr><\/thead><tbody><tr><td>生长方向<\/td><td>高地址 → 低地址<\/td><td>低地址 → 高地址<\/td><\/tr><tr><td>分配方式<\/td><td>调用时自动压帧，返回自动退帧<\/td><td>malloc/new 显式申请<\/td><\/tr><tr><td>释放方式<\/td><td>随帧自动回收<\/td><td>free/delete 显式归还<\/td><\/tr><tr><td>归属<\/td><td>线程私有<\/td><td>可多线程共享<\/td><\/tr><tr><td>故障形态<\/td><td>深递归/大块局部 → 爆栈<\/td><td>忘记归还 → 泄漏；反复切分 → 碎片<\/td><\/tr><\/tbody><\/table><\/div>\n<p>自拟判断：函数内定义百万级 int 数组放栈上大概率爆栈；同样数据放堆上，只要虚拟空间和物理内存允许即可跨函数持有。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“局部变量一定在栈上”<\/strong>：反例——加 static 的局部变量在数据段；堆上由指针指向的对象也不在栈上。“局部”是作用域说法，不等于栈位置。\n<\/li><li>\n<strong>“malloc 的内存就在栈后面接着”<\/strong>：反例——堆是独立区域、向高地址生长，与栈不相邻；块地址由分配器在空闲空间里决定。\n<\/li><li>\n<strong>“堆会在函数返回时自动回收”<\/strong>：反例——堆必须 free/delete，忘记归还就是内存泄漏；自动回收只属于栈。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n内存泄漏对应哪类内存没归还？（答案：堆块 malloc/new 之后忘记 free/delete。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "堆与栈的区别"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.120<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">参数传递与栈帧<\/a><\/span><\/div><h1>对象模型：this 与虚函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>问题<\/h2>\n<p>this 指针像幽灵，成员函数不写它却到处在用；虚函数和普通成员函数在调用时差在哪一步？多态落到机器层面到底查的是什么？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n成员函数藏了一个默认参数 this，即对象内存地址，通过 rdi 寄存器传入。\n<\/li><li>\n普通成员函数在编译期静态绑定：call 目标地址编译阶段就确定。\n<\/li><li>\n虚函数运行时动态绑定：按对象里的虚表指针查虚表，再取对应函数地址。\n<\/li><li>\n含虚函数的类，对象里藏有指向虚函数表的成员，通常位于对象内存首地址附近。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 4.1 节对照成员函数 mFunc 和普通函数 func：两者汇编指令完全相同。成员函数必备的默认参数就是 this；调用时对象把自身内存地址经 rdi 传给成员函数。<code>A a; a.mFunc();<\/code> 与 <code>func((long*)&amp;a);<\/code> 生成的调用指令一致，传入的都是对象 a 的地址。<\/p>\n<p>4.2 节：构造函数同样带隐形 this；派生类构造函数先调用基类构造函数；含虚函数的类，构造函数把虚函数表地址记到对象隐藏成员里。<\/p>\n<p>4.3 节比较普通成员函数与虚函数：函数体都带 this，差别在调用处。普通函数编译阶段就确定 call 哪个地址；虚函数的 call 只能依据寄存器（本书示例 rdx）中的值定位——运行时先读对象虚表指针，再到虚表中取对应函数地址。4.4 节多态在机器层面就是同一调用接口，按对象实际类型查到不同虚表项。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\nthis 经 rdi 传递是本书 x86-64 示例的约定；其他调用约定下传参寄存器不同，但“对象地址作为隐式参数”的模型不变。\n<\/li><li>\n静态绑定/动态绑定的区分针对成员函数调用；自由函数不存在虚表解析。\n<\/li><li>\n条件去掉会怎样：如果虚函数也编译期定址，基类指针指向派生类对象时无法在运行时区分类型，多态落不了地。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：以为成员函数是 C++ 独有调用形式；机器层面只是多传一个 this 参数。\n<\/li><li>\n反例二：以为虚函数地址编译期就能写死；具体类型要到运行时才确定。\n<\/li><li>\n反例三：以为构造函数不收 this；它同样接收隐形 this，并负责安置虚表指针。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n静态绑定 vs 动态绑定：编译期 call 定址 vs 运行时查虚表。\n<\/li><li>\nthis vs 普通参数：this 由语法隐藏，调用处仍走寄存器传参路径。\n<\/li><li>\n虚表 vs 对象成员：虚表是类级别共享的一张函数地址表，对象里只存指向它的指针。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：参数传递与栈帧。\n<\/li><li>\n后置：堆与栈的区别、存储期 static/global/local。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（对象模型：this 与虚函数）<\/summary><div class=\"depth-body\"><h1>对象模型：this 与虚函数 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要理解对象机制，先得会：函数调用靠寄存器传参；栈帧与隐式参数概念；指针保存对象地址。再往前需要区分：编译期就能定死的调用目标，和必须等到运行时才能确定的调用目标，二者走两条解析路径。<\/p>\n<h2>正向推导<\/h2>\n<p>本书 4.1 节对照成员函数 mFunc 和普通函数 func：两者汇编指令完全相同。成员函数必备的默认参数就是 this；调用时对象把自身内存地址经 rdi 传给成员函数。<code>A a; a.mFunc();<\/code> 与 <code>func((long*)&amp;a);<\/code> 生成的调用指令一致，传入的都是对象 a 的地址。this 不是语言魔法，而是被 C++ 语法隐藏的普通参数。<\/p>\n<p>4.2 节推演构造函数：它同样带隐形 this；派生类构造函数先调用基类构造函数；含虚函数的类，构造函数把虚函数表地址记到对象隐藏成员里，这个成员通常位于对象内存首地址附近。<\/p>\n<p>4.3 节比较普通成员函数与虚函数：函数体都带 this，差别在调用处。普通函数编译阶段就确定 call 哪个地址，即静态绑定；虚函数的 call 只能依据寄存器（本书示例 rdx）中的值定位——运行时先读对象虚表指针，再到虚表中取对应函数地址，即动态绑定。4.4 节多态在机器层面就是同一调用接口，按对象实际类型查到不同虚表项。<\/p>\n<p>把链路写清楚：对象实例 → 首地址附近藏虚表指针 → 指向类共享的虚表 → 表项里是各虚函数地址 → call 经表项跳转。普通成员函数没有这层查表，call 目标在编译链接后已固定。<\/p>\n<h2>算例<\/h2>\n<p>自拟绑定判断：基类 B<em> p 指向派生类 D 对象；调用普通成员函数时，call 地址在编译期按 B 的函数定死；调用虚函数时，运行时从 <\/em>p 读虚表指针，进表取 D 覆写后的函数地址再跳转。 自拟参数推演：成员函数 <code>void m(int x)<\/code> 编译后等价于 <code>void m(A* this, int x)<\/code>；调用 <code>a.m(3)<\/code> 时 rdi 传 &amp;a，rsi 传 3（示例约定）。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：以为成员函数是 C++ 独有调用形式；机器层面只是多传一个 this 参数。反例二：以为虚函数地址编译期就能写死；具体类型要到运行时才确定。反例三：以为构造函数不收 this；它同样接收隐形 this，并负责安置虚表指针。 边界：this 经 rdi 传递是本书 x86-64 示例约定；其他调用约定下传参寄存器不同，但“对象地址作隐式参数”的模型不变。静态/动态绑定区分针对成员函数调用，自由函数不存在虚表解析。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nthis 指针在示例中通过哪个寄存器传入？（答案：rdi。）\n<\/li><li>\n静态绑定和动态绑定差在哪一步？（答案：前者编译期 call 定址；后者运行时查虚表。）\n<\/li><li>\n对象里藏的虚表指针指向什么？（答案：类共享的虚函数地址表。）\n<\/li><li>\n派生类构造函数先做什么？（答案：先调用基类构造函数。）\n<\/ol>\n<h2>推演延伸：虚表链路与绑定时机<\/h2>\n<p>对象到函数地址的链路：实例内存首地址附近藏虚表指针 → 指向类共享虚表 → 表项记录各虚函数地址 → call 经表项取地址跳转。普通成员函数没有这层查表，call 目标在编译链接后固定，运行时直接跳转。<\/p>\n<p>构造时机推演：派生类构造先调基类构造，安置基类子对象和虚表指针，再执行派生类自身初始化。虚表是类级别共享的，同一类所有对象指向同一张表；对象里存的只是表指针，不存函数本体。<\/p>\n<p>绑定时机决定灵活性：静态绑定在编译期完成，调用目标确定、省去查表开销；动态绑定推迟到运行时，代价是一次间接查表，换来同一接口按实际类型分发。把基类指针指向派生类对象时，编译器无法静态预知对象类型，只能留到运行时查虚表——这是多态的机器落点。<\/p>\n<h2>推演延伸：构造顺序与对象布局<\/h2>\n<p>构造顺序：派生类构造先跑基类构造，安置基类子对象和虚表指针，再执行派生类自身初始化；析构顺序相反，先派生后基类。对象生命周期的头尾都按这个嵌套顺序走。<\/p>\n<p>对象布局：实例内存里藏虚表指针，函数本体不在对象内；同一类所有对象共享一张虚表，表项记录各虚函数地址。不含虚函数的类对象里没有这一隐藏成员，对象尺寸也相应更小。<\/p>\n<p>失败对照：构造函数里调用虚函数，此时虚表指针尚未完全指向派生类版本，查到的往往是基类实现；这是动态绑定时机带来的边界，不是虚表机制失效。虚函数在析构阶段也是同一道理，析构到基类时派生部分已被销毁。<\/p>\n<h2>正向推导细化：this 传递与虚表查表链路<\/h2>\n<p>普通成员函数路径：<\/p>\n<ol><li>\n<code>A a; a.mFunc();<\/code> 编译后等价调用 <code>func(&amp;a)<\/code>；对象地址作为 this 经 rdi 传入。\n<\/li><li>\n函数体通过 this 找到当前对象的数据；调用目标在编译期写进 call，即静态绑定。\n<\/li><li>\n对象首地址附近藏虚表指针；构造函数把类虚表地址记进这个隐藏成员。\n<\/li><li>\n调用虚函数时，先从对象读出虚表指针，再按函数槽位进虚表取函数地址。\n<\/li><li>\ncall 经表项间接跳转；具体目标由运行时对象类型决定，即动态绑定。\n<\/li><li>\n派生类构造先调基类构造安置基类子对象和虚表指针，再跑派生类初始化。\n<p>虚函数路径：<\/p>\n<\/ol>\n<h2>完整算例：基类指针指向派生对象的调用落点（自拟）<\/h2>\n<pre><code>B* p = new D;\np-&gt;vfunc();<\/code><\/pre>\n<ol><li>\nrdi 传 this = D 对象地址；\n<\/li><li>\n读 *(this) 得 D 的虚表指针；\n<\/li><li>\n虚表第 0 槽位存 D::vfunc 地址；\n<\/li><li>\ncall 跳到 D::vfunc。\n<p>若 p 指向 B 对象，同一槽位取到 B::vfunc；普通成员函数则无论指向谁，call 地址都按编译期类型定死。<\/p>\n<\/ol>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“成员函数是 C++ 独有的调用形式”<\/strong>：反例——机器层面只是多传 this 一个指针参数，和带指针参数的普通函数走同一套 call/ret。\n<\/li><li>\n<strong>“虚函数地址编译期就能定死”<\/strong>：反例——基类指针可能指向派生对象，具体类型运行时才确定，只能查虚表解析。\n<\/li><li>\n<strong>“对象里存着函数本体”<\/strong>：反例——对象只藏虚表指针，函数本体在代码段，同一类所有对象共享一张虚表。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n派生类构造函数先做什么？（答案：先调用基类构造函数，安置基类子对象和虚表指针。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "对象模型：this 与虚函数"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.156<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">堆与栈的区别<\/a><\/span><\/div><h1>虚拟内存与地址映射<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>问题<\/h2>\n<p>程序打印出的变量地址为什么大过物理内存？这套地址怎么落到真实内存条上？系统调用前后 CPU 换了哪块内存空间？大小端摆放的到底是什么？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n程序看到的是一套独立虚拟地址空间；虚拟地址由 MMU 配合操作系统映射到物理内存。\n<\/li><li>\n32 位 CPU 虚拟空间约 4GB，64 位 CPU 空间更大；映射有硬件加持，对程序员无感。\n<\/li><li>\n用户态代码跑在用户内存空间，syscall 后跳到内核内存空间运行预设代码，两种状态相互隔离。\n<\/li><li>\n小端序指数值低位字节存低地址、高位字节存高地址（x86）；大端与之相反。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 5.1 节：变量地址示例 0x7ffcd930e8fc 超出普通物理内存上限，它不是物理地址而是虚拟内存地址。每个进程都以为自己独占一套大地址空间。CPU 在这套虚拟地址上读写，真实数据最终仍存在物理 RAM；内存管理单元 MMU 和操作系统配合，完成虚拟地址到物理地址的映射。映射由硬件参与，对程序员透明，也不拖慢 CPU 运行效率。<\/p>\n<p>5.6 节系统调用：用户态程序出错被隔离在内核之外，即使崩溃也不会拖垮整个计算机系统；内核态代码（操作、驱动程序）经过千锤百炼，一旦出错往往直接蓝屏。syscall 指令是用户空间进入内核空间的边界动作。<\/p>\n<p>5.7 节大小端：x86 把一个 8 字节长整按字符打印会得到倒序字符串。原因是 CPU 把数值低位字节写在内存低地址、高位字节写在高地址；人书写高位在前的习惯对应大端模式。倒序观感来自多字节数值的字节摆放，不是字符串本身反着存。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n4GB 是 32 位地址空间结论；64 位虚拟空间大小取决于实现位数和系统配置，不按 32 位数字套。\n<\/li><li>\nMMU 映射是现代带存储管理的系统特征；早期无 MMU 的单片机/DOS 环境程序可直接扫内存，没有这层隔离。\n<\/li><li>\n条件去掉会怎样：没有虚拟内存隔离，一个野指针就能改整机内存；没有 MMU 硬件配合，全靠软件查表会拖慢每次访存。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：以为程序地址就是内存条物理位置；那是虚拟地址，要经映射落地。\n<\/li><li>\n反例二：以为虚拟内存靠纯软件查表、很慢；MMU 硬件加持，程序无感。\n<\/li><li>\n反例三：以为小端把字符串倒序存放；字符串顺序不变，倒序来自数值字节规则。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n虚拟地址 vs 物理地址：前者进程视角，后者 RAM 实际单元，中间隔 MMU 与页表。\n<\/li><li>\n用户态 vs 内核态：运行代码和内存空间不同，隔离目的是保护系统稳定。\n<\/li><li>\n大端 vs 小端：多字节数值的字节摆放顺序，与字符串编码无关。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：堆与栈的区别。\n<\/li><li>\n后置：对象模型 this 与虚函数、存储期 static/global/local。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（虚拟内存与地址映射）<\/summary><div class=\"depth-body\"><h1>虚拟内存与地址映射 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要理解虚拟内存，先得会：程序里看到的变量地址只是编号；CPU 读写内存要经过地址与数据两条路径；用户程序与操作系统内核是两套执行环境。再往前需要建立：进程以为自己独占一套空间，实际中间隔了一层硬件加软件的映射。<\/p>\n<h2>正向推导<\/h2>\n<p>本书 5.1 节推演：变量地址示例 0x7ffcd930e8fc 超出普通物理内存上限，它不是物理地址，而是虚拟内存地址。每个进程都以为自己独占一套大地址空间；32 位 CPU 虚拟空间约 4GB，64 位 CPU 空间更大。CPU 在这套虚拟地址上读写，真实数据最终仍存在物理 RAM。<\/p>\n<p>映射链路：虚拟地址先经 MMU（内存管理单元）硬件查页表，配合操作系统管理的表项，换算出物理内存单元。映射由硬件参与，对程序员透明，也不拖慢 CPU 运行效率。现代系统靠这层隔离把各进程关在各自地址空间里，一个程序的野指针不能直接扫改整机内存。<\/p>\n<p>5.6 节推演系统调用边界：用户态代码跑在用户内存空间，执行 syscall 后 CPU 跳到内核内存空间运行操作系统预设代码。内核态代码（操作、驱动程序）经过千锤百炼，一旦出错往往直接蓝屏；用户态程序出错被隔离在内核之外，不会拖垮整个计算机系统。系统调用接口编号固定，便于各种库函数开发和软件标准化。<\/p>\n<p>5.7 节推演大小端：x86 把一个 8 字节长整按字符打印会得到倒序字符串。原因是 CPU 把数值低位字节写在内存低地址、高位字节写在高地址，即小端模式；人书写高位在前的习惯对应大端模式。倒序观感来自多字节数值的字节摆放，字符串本身并没有反着存。<\/p>\n<h2>算例<\/h2>\n<p>自拟字节摆放：32 位数值 0x12345678 在小端内存中，从低地址到高地址依次存 0x78、0x56、0x34、0x12；大端则相反，存 0x12、0x34、0x56、0x78。 自拟空间推算：32 位地址线可寻址 2^32 = 4GB 空间；64 位实现按实际可用位数决定空间大小，不能直接套 32 位数字。 自拟隔离判断：用户态程序访问非法地址触发段错误，被内核捕获终止自身进程，内核与其他进程继续运行，这就是隔离效果。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：以为程序地址就是内存条物理位置；那是虚拟地址，要经映射落地。反例二：以为虚拟内存靠纯软件查表、很慢；MMU 硬件加持，程序无感。反例三：以为小端把字符串倒序存放；字符串顺序不变，倒序来自数值字节规则。 边界：4GB 是 32 位结论；64 位空间大小取决于实现位数和系统配置。MMU 映射是现代带存储管理系统的特征；早期无 MMU 的单片机/DOS 环境程序可直接扫内存，没有这层隔离。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n虚拟地址靠什么落到物理内存？（答案：MMU 配合操作系统页表映射。）\n<\/li><li>\n32 位 CPU 虚拟空间约多大？（答案：4GB。）\n<\/li><li>\nsyscall 前后 CPU 进入什么不同空间？（答案：用户内存空间跳到内核内存空间。）\n<\/li><li>\nx86 小端怎么摆字节？（答案：低位字节存低地址，高位字节存高地址。）\n<\/ol>\n<h2>推演延伸：映射链路与隔离边界<\/h2>\n<p>访存链路：CPU 给出虚拟地址 → MMU 查页表项 → 换算物理地址 → 读写物理 RAM。页表由操作系统维护，MMU 硬件加速查询，所以映射对程序透明。进程之间地址空间各自独立，同一个虚拟地址在不同进程映射到不同物理单元，互不干扰。<\/p>\n<p>系统调用边界再推：用户态代码只能访问用户空间，需要内核服务（读写文件、申请内存、发网络包）时通过 syscall 进入内核；内核代码出错影响面大，因此经过严格验证；用户程序崩溃被隔离，不拖垮整机。接口编号固定下来，库函数才能稳定封装系统能力。<\/p>\n<p>端序边界：端序只描述多字节数值在内存的字节顺序，不影响单字节字符和字符串。跨设备交换二进制数据时必须约定端序，否则同一串字节两边解释出不同数值。x86 是小端，网络字节序通常按大端传输，收发时需要做字节序转换。<\/p>\n<h2>推演延伸：映射过程与端序边界<\/h2>\n<p>地址翻译：虚拟地址拆成页内偏移和页号，MMU 按页号查页表项得到物理页号，拼上偏移访问 RAM；页表项缺失或越界会触发缺页异常，由操作系统介入处理后再回到程序。<\/p>\n<p>隔离效果：进程 A 的虚拟地址 0x4000 与进程 B 的 0x4000 映射到不同物理单元；一个进程写自己的地址空间，不会碰到另一个进程的内存。虚拟地址相同不代表物理位置相同。<\/p>\n<p>端序边界：跨网络或跨设备传二进制要先固定字节序；x86 是小端，网络字节序通常按大端，收发时做字节转换。单字节字符不受端序影响。自拟算例：0x12345678 小端内存从低到高存 78、56、34、12，按字节打印得到逆序观感；字符串 &quot;abc&quot; 在内存仍是 61、62、63，顺序不变。<\/p>\n<h2>正向推导细化：虚拟地址到物理地址的翻译<\/h2>\n<ol><li>\nCPU 给出虚拟地址；该地址超出普通物理内存上限，说明它不是物理编号。\n<\/li><li>\n虚拟地址拆成页号和页内偏移；MMU 按页号查页表项，得到物理页号。\n<\/li><li>\n物理页号拼上页内偏移，形成物理地址，再读写物理 RAM。\n<\/li><li>\n页表由操作系统维护，MMU 硬件加速查询；映射对程序透明，不拖慢 CPU。\n<\/li><li>\n页表项缺失或越界触发缺页异常，由操作系统介入处理后再回到程序。\n<\/li><li>\nsyscall 是另一道边界：用户空间代码执行 syscall 后跳到内核空间运行预设代码；用户态崩溃被隔离在内核之外。\n<\/ol>\n<h2>完整算例：地址隔离与字节摆放（自拟）<\/h2>\n<p>隔离对照：进程 A 的虚拟地址 0x4000 与进程 B 的 0x4000 映射到不同物理单元；同名虚拟地址不代表同一物理位置。<\/p>\n<p>小端字节算例：32 位数值 0x12345678，小端内存从低地址到高地址依次存 0x78、0x56、0x34、0x12；按字节打印得到倒序观感。字符串 &quot;abc&quot; 在内存仍是 0x61、0x62、0x63，顺序不变。跨设备交换二进制要先约定端序。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“程序打印的地址就是内存条物理位置”<\/strong>：反例——那是虚拟地址，要经 MMU 和操作系统映射才落到物理 RAM。\n<\/li><li>\n<strong>“虚拟内存靠纯软件查表、所以很慢”<\/strong>：反例——MMU 硬件参与加速，程序访问无感，效率由硬件保证。\n<\/li><li>\n<strong>“小端就是字符串倒序存放”<\/strong>：反例——字符串本身按顺序放，倒序观感只来自多字节数值的字节摆放规则。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n32 位 CPU 的虚拟地址空间约多大？（答案：约 4GB。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "虚拟内存与地址映射"}, "c10": {"html": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.214<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">变量与类型宽度<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">堆与栈的区别<\/a><\/span><\/div><h1>存储期：static、global 与 local<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>问题<\/h2>\n<p>全局变量、静态变量、局部变量到底住在内存哪一块？为什么 static 变量函数返回后值不丢？作用域限制和内存位置是不是一回事？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n全局变量与静态变量同处一块数据段，编译期位置固定；局部变量在栈帧上随调用伸缩。\n<\/li><li>\n作用域限制是编译器给的可见范围，不等于内存隔离。\n<\/li><li>\nthread_local 修饰的变量每个线程各持一份拷贝，属于线程局部存储。\n<\/li><li>\n字符串常量也存数据段；栈上一维数组可存多个字符串首地址，64 位下每个地址 8 字节。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 6.1 节定义全局变量 a、函数内静态变量 b、main 内局部变量 c。func1 的汇编里对静态变量 b 没有任何初始化动作，因为它在编译期就已安排进数据段。打印地址可见 b（0x404034）与 a（0x404030）相邻 4 字节，同属数据区域；编译器只在作用域上限制 b 的可见范围。知道 b 的地址后，同样可以绕开作用域按地址读写。<\/p>\n<p>对照三种位置：全局/静态变量在数据段，地址运行期不变；局部变量在栈帧上，随函数调用分配、返回回收；malloc/new 申请的大块在堆上。6.5 节 thread_local 变量每线程一份，呼应 3.6 节线程私有栈模型。<\/p>\n<p>6.2 节双重指针题：字符串常量存在数据段；栈上一维数组 a 的三个元素分别存三个字符串首地址，64 位下每个地址 8 字节；<code>a[2][1]<\/code> 等价 <code>*(a[2] + 1)<\/code>，数组 a 是一维数组，不是二维数组。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n数据段、栈、堆的划分以本书 x86-64 示例为准；具体段名和布局随链接脚本、编译器变化。\n<\/li><li>\n静态变量“值保留”指脱离函数调用周期仍保留；它不在线程私有栈里，多线程访问仍需同步。\n<\/li><li>\n条件去掉会怎样：如果 static 也放栈帧，函数返回后值就被回收；如果作用域等于内存隔离，拿到地址也无法越界访问，实际硬件并不提供这种隔离。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：以为 static 变量存在栈上；它和全局变量同在数据段。\n<\/li><li>\n反例二：以为作用域限制等于硬件隔离；位置不隔离，只是编译器限制可见性。\n<\/li><li>\n反例三：以为静态变量每次调用重新初始化；它编译期安排一次，之后保留上次的值。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n全局 vs 静态：内存位置相同，差别在作用域可见范围。\n<\/li><li>\n数据段 vs 栈：固定生存期 vs 随帧伸缩。\n<\/li><li>\n普通局部 vs thread_local：单份栈帧拷贝 vs 每线程各一份。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：变量与类型宽度、堆与栈的区别。\n<\/li><li>\n后置：综合理解程序内存布局。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（存储期：static、global 与 local）<\/summary><div class=\"depth-body\"><h1>存储期：static、global 与 local · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要判断变量住在哪块内存，先得会：数据段、栈帧、堆三块区域的划分；全局/静态地址固定性；栈变量随帧伸缩。再往前需要分清：作用域是编译器给的可见范围，内存位置是硬件布局，两者不是一回事。<\/p>\n<h2>正向推导<\/h2>\n<p>本书 6.1 节推演：定义全局变量 a、函数内静态变量 b、main 内局部变量 c。func1 的汇编里对静态变量 b 没有任何初始化动作，因为它在编译期就已安排进数据段。打印地址可见 b（0x404034）与 a（0x404030）相邻 4 字节，同属数据区域；编译器只在作用域上限制 b 的可见范围。知道 b 的地址后，同样可以绕开作用域按地址读写——说明作用域限制不等于硬件隔离。<\/p>\n<p>对照三种位置：全局/静态变量在数据段，地址运行期不变；局部变量在栈帧上，随函数调用分配、返回回收；malloc/new 申请的大块在堆上。生存期由位置决定：数据段变量贯穿程序全程，栈变量随帧消亡，堆块靠手动释放。<\/p>\n<p>6.5 节推演 thread_local：修饰的变量每个线程各持一份拷贝，呼应 3.6 节线程私有栈模型。普通局部变量在各自栈帧里互不干扰；thread_local 把“每线程一份”提升到存储类别层面，多线程访问各自副本，不需要为这份变量互斥。<\/p>\n<p>6.2 节双重指针题补出数据段另一类内容：字符串常量存在数据段；栈上一维数组 a 的三个元素分别存三个字符串首地址，64 位下每个地址 8 字节；<code>a[2][1]<\/code> 等价 <code>*(a[2] + 1)<\/code>，数组 a 是一维数组，不是二维数组。<\/p>\n<h2>算例<\/h2>\n<p>自拟地址推算：全局 a 在 0x404030，静态 b 在 0x404034，相邻 4 字节，同属数据段；若再加一个 int 全局 c，下一个相邻地址为 0x404038。 自拟生存期判断：函数内 <code>static int cnt = 0; cnt++;<\/code> 每次调用保留上次值，因为 cnt 不在栈帧；普通局部 int 每次进入函数重新分配，上一次值不保留。 自拟线程判断：thread_local int tls; 线程 A 改 tls 不影响线程 B 的 tls，两份拷贝各自独立；普通全局变量则是所有线程共享同一份。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：以为 static 变量存在栈上；它和全局变量同在数据段。反例二：以为作用域限制等于内存隔离；位置不隔离，只是编译器限制可见性。反例三：以为静态变量每次调用重新初始化；它编译期安排一次，之后保留上次的值。 边界：数据段、栈、堆的划分以本书 x86-64 示例为准；具体段名和布局随链接脚本、编译器变化。静态变量值虽脱离函数周期保留，但多线程访问仍需同步，线程私有性要靠 thread_local 明确声明。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n静态变量和谁同处数据段？（答案：全局变量。）\n<\/li><li>\n函数返回后 static 值为什么不丢？（答案：它不在栈帧，在数据段，空间不回收。）\n<\/li><li>\n作用域限制和内存隔离是不是一回事？（答案：不是；作用域是编译器可见范围，硬件不替你守边界。）\n<\/li><li>\nthread_local 变量的拷贝份数？（答案：每个线程各持一份。）\n<\/ol>\n<h2>推演延伸：生存期、线程可见性与地址归属<\/h2>\n<p>三类变量生存期对照：数据段变量贯穿程序全程，函数返回后值保留；栈变量随帧申请回收，返回后悬挂；堆块手动释放，忘记归还即泄漏。判断变量归属先看存储位置，再看作用域规则，两者不要混为一谈。<\/p>\n<p>线程可见性推演：普通局部变量在栈帧，天然线程私有；全局/静态变量在数据段，所有线程共享，并发访问要同步；thread_local 把存储类别提升为每线程一份，各线程改自己的拷贝，互斥压力最小。C++ 的 thread_local、C 语言的 _Thread_local 都属这一类别。<\/p>\n<p>地址归属再补：字符串常量也在数据段，只读共享；栈上数组存的是这些串的首地址，64 位每地址 8 字节。双重指针题中 <code>a[2][1]<\/code> 拆成 <code>*(a[2]+1)<\/code>：先取 a[2] 的串地址，加一进一个字符单元，再读该字符。数组 a 是一维数组，元素是字符指针，不是二维字符数组。<\/p>\n<h2>推演延伸：存储期判断流程<\/h2>\n<p>判断顺序：先看定义位置——函数外定义是全局；函数内加 static 是静态；函数内普通局部在栈；new/malloc 申请在堆。再看生存期：数据段变量贯穿程序全程，栈变量随帧申请回收，堆块靠手动释放归还。<\/p>\n<p>线程可见性推演：普通局部变量在栈帧里天然私有；全局/静态变量在数据段，所有线程共享，并发访问要同步；thread_local 把存储类别提升为每线程一份，各线程改自己的拷贝，不需要为这份变量互斥。区分“变量住在哪”和“谁能看见它”，是两个独立问题。<\/p>\n<h2>正向推导细化：三类变量在地址空间里的位置<\/h2>\n<ol><li>\n全局变量：定义在函数外，编译期安排进数据段，链接后地址固定，运行期不移动。\n<\/li><li>\n静态变量：函数内加 static，同样进数据段；编译器只在作用域上限制可见范围，地址与全局变量邻近。\n<\/li><li>\n局部变量：普通局部在栈帧上，随调用分配、返回回收，地址随栈帧伸缩变化。\n<\/li><li>\n堆块：malloc/new 申请，地址由分配器运行时决定，跨函数持有。\n<\/li><li>\n生存期由位置决定：数据段全程有效，栈随帧消亡，堆手动释放；作用域是编译器给的可见范围，和内存位置是两件事。\n<\/li><li>\nthread_local：存储类别提升为每线程一份拷贝；普通局部私有在栈帧，全局/静态共享在数据段。\n<\/ol>\n<h2>完整算例：地址与生存期对照（自拟，本书示例 a=0x404030、b=0x404034）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>类别<\/th><th>位置<\/th><th>地址特点<\/th><th>生存期<\/th><\/tr><\/thead><tbody><tr><td>全局 a<\/td><td>数据段<\/td><td>0x404030，固定<\/td><td>全程<\/td><\/tr><tr><td>静态 b<\/td><td>数据段<\/td><td>0x404034，与 a 相邻<\/td><td>全程，函数返回后保留<\/td><\/tr><tr><td>局部 c<\/td><td>栈帧<\/td><td>随帧移动<\/td><td>随帧消亡<\/td><\/tr><tr><td>malloc 块<\/td><td>堆<\/td><td>分配器返回<\/td><td>手动释放<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>static int cnt = 0; cnt++;<\/code> 每次调用保留上次值，因为 cnt 不在栈帧；普通局部 int 每次进函数重新分配，上次值不保留。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“static 变量存在栈上”<\/strong>：反例——它和全局变量同在数据段，函数返回后空间不回收，下次调用仍保留上次的值。\n<\/li><li>\n<strong>“作用域限制等于内存隔离”<\/strong>：反例——知道静态变量地址后可绕开作用域按地址读写；作用域是编译器可见范围，硬件不替你守边界。\n<\/li><li>\n<strong>“全局变量每个线程一份”<\/strong>：反例——全局/静态所有线程共享同一份；每线程一份要靠 thread_local 明确声明。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\nthread_local 变量有几份拷贝？（答案：每个线程各持一份。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "存储期：static、global 与 local"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：预备知识：程序在 CPU 上怎么跑<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：预备知识——CPU 眼里的程序运行与汇编语言<\/a><br>检查点：能认出 rax/rbp/rsp 的分工，说清 push/mov/pop 各自对应的内存动作<\/li><li class='path-step' id='path-02'><strong>步骤 02：基础语法：变量、指针与数组的内存样子<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：基础语法——变量、流程控制、指针与数组在内存里的样子<\/a><br>检查点：能解释变量地址、指针两步读写、数组传参和越界改写了什么<\/li><li class='path-step' id='path-03'><strong>步骤 03：函数原理：传参、栈帧与堆和栈<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈<\/a><br>检查点：能按 call/push/sub/pop/ret 复述一次调用往返，区分栈与堆的存储期和生长方向<\/li><li class='path-step' id='path-04'><strong>步骤 04：C++ 特性与高级编程：对象模型、虚拟内存与并发基础<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础<\/a><br>检查点：能说清 this 隐式传参、静态/动态绑定、虚拟内存映射、大小端与静态变量存储期<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px ut type='radio' name='q04' value='0'> 函数内的局部变量<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 全局变量与静态变量<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 每次递归新建的临时变量<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 传值参数的栈上副本<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c04' data-chapter='ch02'><p class='quiz-q'><b>Q5.<\/b> 执行 *p = 2 时，第一步做什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 直接把 2 写入 p 自己的内存<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 从 p 中读出目标地址，再按该地址写入 2<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 先把 p 的值加 2<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 把 2 压入栈顶<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='blank' data-concept='c05' data-chapter='ch02'><p class='quiz-q'><b>Q6.<\/b> 数组作为函数参数传递时，编译器不会在栈上构建临时数组，而是传递数组的 ______。（填两个字：首地址）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c05' data-chapter='ch02'><p class='quiz-q'><b>Q7.<\/b> 本书 2.7 节的实验里，数组向高端越界后写入恶意函数地址，func1 不再回到 main，是因为改写了栈上的哪一项？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 局部变量 a 的初值<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 保存的返回地址<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 栈顶指针 rsp<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 字符串常量<\/label><\/div><div clas ck'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c04' data-chapter='ch02'><p class='quiz-q'><b>Q3.<\/b> 执行 *p = 2 时，第一步做什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 直接把 2 写入 p 自己的内存<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 从 p 中读出目标地址，再按该地址写入 2<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 先把 p 的值加 2<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 把 2 压入栈顶<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='blank' data-concept='c05' data-chapter='ch02'><p class='quiz-q'><b>Q4.<\/b> 数组作为函数参数传递时，编译器不会在栈上构建临时数组，而是传递数组的 ______。（填两个字：首地址）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c05' data-chapter='ch02'><p class='quiz-q'><b>Q5.<\/b> 本书 2.7 节的实验里，数组向高端越界后写入恶意函数地址，func1 不再回到 main，是因为改写了栈上的哪一项？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 局部变量 a 的初值<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 保存的返回地址<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 栈顶指针 rsp<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 字符串常量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c03' data-chapter='ch02'><p class='quiz-q'><b>Q6.<\/b> 代码：char a = 0xff; if (a == 0xff)。按本书 2.10 节的分析，这段比较的结果与原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> same，两边都是 0xff<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> different：有符号 char 的 0xff 按补码解释为 -1，与无符号 255 不相等<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> different：char 只能存正数<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> same：编译器会自动把 0xff 改成 -1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single' data-concept='c04' data-chapter='ch02'><p class='quiz-q'><b>Q7.<\/b> （自拟，依据本书 2.6 节的元素间隔）int *p 指向一个 int 数组，执行 p + 1 后，地址向前移动几个字节？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 1 字节<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 2 字节<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 4 字节<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 8 字节<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈<\/h1><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c06' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 传值方式调用函数，在函数内部修改形参，外部实参的值会怎样？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 被一并修改<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 不受影响，函数内改的是栈上副本<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 视编译器而定<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 只有 int 类型会被修改<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='blank' data-concept='c06' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> （自拟，按本书栈帧模型推算）x86-64 下函数内定义 long a[2]，仅算局部变量区，这个数组在栈上占用多少字节？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q3.<\/b> 关于堆和栈，下列哪条与本书 3.6 节一致？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 栈可被多个线程共享，栈上数据需要手动 free<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 栈是线程私有的，堆内存可被多个线程访问<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 堆随函数返回自动回收，栈需要手动 delete<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 堆和栈的生长方向都是由高地址向低地址<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础<\/h1><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 普通成员函数在编译期就确定了 call 哪个地址；虚函数的被调位置在什么时候确定？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 编译链接期写死<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 运行时按对象虚表中的指针查找<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 预处理期确定<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 由宏展开确定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q13' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> x86 上的小端序是指什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 数值的高位字节存低地址<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> 数值的低位字节存低地址<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> 字符串按倒序存放<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 地址从大到小编号<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='blank' data-concept='c10' data-chapter='ch04'><p class='quiz-q'><b>Q3.<\/b> 按本书 6.1 节的观察，函数内定义的 static 变量与哪一类变量处在同一块数据区域？（填两个字：全局）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q16' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q4.<\/b> 本书 4.1 节中，对象调用成员函数时，this 指针（对象内存地址）通过哪个寄存器传入成员函数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> rax<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> rdi<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> rsp<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> rbp<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='寄存器'>寄存器 — CPU 内部高速存储位置，rax 这类放数值，rbp/rsp 这类存放内存地址 <span class=glossary-ref>（第 1 章：预备知识——CPU 眼里的程序运行与汇编语言）<\/span><\/li><li data-term='栈帧'>栈帧 — 一次函数调用在栈上占用的一片区域，保存返回地址、旧栈帧基准与本函数局部变量 <span class=glossary-ref>（第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈）<\/span><\/li><li data-term='返回地址'>返回地址 — call 指令压入栈中的下一条指令地址，ret 据此跳回主调函数被打断的位置 <span class=glossary-ref>（第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈）<\/span><\/li><li data-term='栈（stack）'>栈（stack） — 线程私有、随函数调用自动申请与回收的内存，生长方向由高地址向低地址 <span class=glossary-ref>（第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈）<\/span><\/li><li data-term='堆（heap）'>堆（heap） — 由 malloc/calloc/realloc/new 申请、free/delete 释放的内存，可被多个线程共享，生长方向由低地址向高地址 <span class=glossary-ref>（第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈）<\/span><\/li><li data-term='指针'>指针 — 保存内存地址的变量；对它做 * 操作就是按该地址读写内存 <span class=glossary-ref>（第 2 章：基础语法——变量、流程控制、指针与数组在内存里的样子）<\/span><\/li><li data-term='引用'>引用 — C++ 语法层的别名机制，底层实现与指针相同，相当于不能改绑的指针常量 <span class=glossary-ref>（第 2 章：基础语法——变量、流程控制、指针与数组在内存里的样子）<\/span><\/li><li data-term='数组越界'>数组越界 — 访问了数组边界之外的内存；向高端越界可能改写栈帧关键数据，导致崩溃或被劫持 <span class=glossary-ref>（第 2 章：基础语法——变量、流程控制、指针与数组在内存里的样子）<\/span><\/li><li data-term='栈溢出（stack overflow）'>栈溢出（stack overflow） — 递归过深或栈上分配过大，栈空间被耗尽的故障 <span class=glossary-ref>（第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈）<\/span><\/li><li data-term='补码'>补码 — 有符号整数的机器表示方式；最高位为 1 时同一个二进制串可被解释成负数，也可被解释成很大的正数 <span class=glossary-ref>（第 2 章：基础语法——变量、流程控制、指针与数组在内存里的样子）<\/span><\/li><li data-term='静态变量'>静态变量 — 与全局变量同处一块数据区域的变量，编译器只在作用域上限制它的可见范围 <span class=glossary-ref>（第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础）<\/span><\/li><li data-term='虚拟内存'>虚拟内存 — 每个进程看到的一套独立地址空间，由 MMU 与操作系统映射到真实物理内存 <span class=glossary-ref>（第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础）<\/span><\/li><li data-term='mmu'>MMU — 内存管理单元，配合操作系统完成虚拟地址到物理地址的映射，映射对程序员无感 <span class=glossary-ref>（第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础）<\/span><\/li><li data-term='虚函数表'>虚函数表 — 存有类虚函数地址的一张表，对象里藏有指向它的指针；运行时据此确定调用哪个函数 <span class=glossary-ref>（第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础）<\/span><\/li><li data-term='小端序'>小端序 — x86 的字节存放方式：数值的低位字节放在低地址，高位字节放在高地址 <span class=glossary-ref>（第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础）<\/span><\/li><li data-term='线程局部存储'>线程局部存储 — 每个线程各持一份拷贝的存储类别，thread_local 修饰的变量属于这一类 <span class=glossary-ref>（第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库<\/h1>\n<h2>模式 1：先找地址，再看读写<\/h2>\n<p>遇到变量、指针、成员访问，先问“它的地址在哪、值存在哪”，再看这条语句读写了哪个内存。脱离地址谈语法，容易背混规则。<\/p>\n<h2>模式 2：高级语句拆成两条内存动作<\/h2>\n<p>指针 * 操作拆成“取目标地址—读写目标地址”；add 拆成“读出—运算—写回”；函数调用拆成“压返回地址—跳转—恢复—返回”。拆到寄存器/内存动作这一层，指令名不再吓人。<\/p>\n<h2>模式 3：按存储期归类变量<\/h2>\n<p>看一个变量先定位置：数据段（全局/静态）、栈（局部）、堆（手动申请）。位置决定生存期、地址是否固定、谁负责释放。<\/p>\n<h2>模式 4：越界先查栈帧布局<\/h2>\n<p>数组异常、返回错乱、跳到奇怪函数时，按“局部变量 → 保存的 rbp → 返回地址”的栈帧顺序排查，判断踩中了哪一层数据。<\/p>\n<h2>模式 5：绑定时机区分对象机制<\/h2>\n<p>普通函数编译期定址，虚函数运行时查表；凡是“同一接口、按实际类型走不同实现”的机制，先想动态绑定和虚表。<\/p>\n<h2>模式 6：争议比较先统一类型<\/h2>\n<p>看到有符号/无符号混比、补码最高位为 1 的数值，先把两边类型统一，再判断相等关系；警告不要当噪音忽略。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>寄存器分工（本书 x86-64 示例）<\/h2>\n<ul><li>\nrax：存放数值，常作函数返回值；eax 是其低 32 位。\n<\/li><li>\nrbp：当前栈帧基准地址；rsp：栈顶地址。\n<\/li><li>\nrdi、rsi、rdx：传递前三个参数的寄存器（低 32 位 edi、esi、edx）。\n<\/li><li>\nrip：存放下一条指令地址。\n<\/ul>\n<h2>类型宽度（本书示例）<\/h2>\n<ul><li>\nchar 1 字节；short 2 字节；int 4 字节；long 8 字节；64 位指针 8 字节。\n<\/ul>\n<h2>一次函数调用往返<\/h2>\n<ol><li>\ncall：压入返回地址，跳函数首地址。\n<\/li><li>\n序言：push rbp；mov rbp, rsp；sub rsp, N 分配局部空间。\n<\/li><li>\n函数体：读写形参副本与局部变量。\n<\/li><li>\n结语：pop rbp 恢复基准；ret 按返回地址送 rip 跳回。\n<\/ol>\n<h2>传参对照<\/h2>\n<ul><li>\n传值：送变量值，帧上是副本，改副本不动本体。\n<\/li><li>\n传指针：送变量地址，* 操作写回本体。\n<\/li><li>\n传引用：汇编同传指针，语法层不能赋 NULL、不能改绑、无引用的引用。\n<\/ul>\n<h2>堆 vs 栈<\/h2>\n<ul><li>\n栈：线程私有；调用申请、返回释放；高地址→低地址生长；一条指令移动 rsp。\n<\/li><li>\n堆：手动 malloc/calloc/realloc/new 申请，free/delete 释放；可共享；低地址→高地址生长；有碎片与泄漏。\n<\/ul>\n<h2>内存区域速查<\/h2>\n<ul><li>\n数据段：全局变量、静态变量、字符串常量，地址编译后固定。\n<\/li><li>\n栈：局部变量、形参副本、返回地址。\n<\/li><li>\n堆：手动申请的大块内存。\n<\/li><li>\n虚拟地址经 MMU + OS 映射到物理内存。\n<\/ul>\n<h2>易错判断<\/h2>\n<ul><li>\n数组传参：传首地址，不复制数组。\n<\/li><li>\n多维数组：物理上一维连续。\n<\/li><li>\n有符号 char 0xff：补码解释为 -1，不等于无符号 255。\n<\/li><li>\nx86 小端：低位字节存低地址。\n<\/li><li>\n虚函数：运行时查虚表动态绑定；普通成员函数编译期静态绑定。\n<\/ul>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/cpu-ccpp", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：预备知识——CPU 眼里的程序运行与汇编语言", "href": "#/chapter/ch01"}, {"label": "第 2 章：基础语法——变量、流程控制、指针与数组在内存里的样子", "href": "#/chapter/ch02"}, {"label": "第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈", "href": "#/chapter/ch03"}, {"label": "第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "寄存器与内存地址", "href": "#/concept/c01"}, {"label": "汇编指令与栈帧雏形", "href": "#/concept/c02"}, {"label": "变量与类型宽度", "href": "#/concept/c03"}, {"label": "指针与引用的本质", "href": "#/concept/c04"}, {"label": "数组与数组越界", "href": "#/concept/c05"}, {"label": "参数传递与栈帧", "href": "#/concept/c06"}, {"label": "堆与栈的区别", "href": "#/concept/c07"}, {"label": "对象模型：this 与虚函数", "href": "#/concept/c08"}, {"label": "虚拟内存与地址映射", "href": "#/concept/c09"}, {"label": "存储期：static、global 与 local", "href": "#/concept/c10"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：预备知识——CPU 眼里的程序运行与汇编语言", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：基础语法——变量、流程控制、指针与数组在内存里的样子", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈", "href": "#/quiz/ch03"}, {"label": "测验：第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.13<\/div><h1>第 1 章：预备知识——CPU 眼里的程序运行与汇编语言<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：会写最简单的 main 函数\n<\/li><li>\n<strong>对应原书<\/strong>：第 1 章 预备知识（1.1 工具介绍、1.2 CPU 眼里的程序运行、1.3 CPU 眼里的汇编语言）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清从源码到可执行文件再到 CPU 执行的大致链路；\n<\/li><li>\n认出 rax、rbp、rsp 三类寄存器各自存什么；\n<\/li><li>\n读懂 push、mov、add、pop 背后对应的内存读写动作。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>CPU 不懂 C/C++ 的语法规则，它只认寄存器读写和内存读写；高级语言里那些“复杂语法”，落到机器层面都是几条简单指令的组合。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：寄存器与内存地址<\/h3>\n<p>本书 1.2 节先做了一个对照实验：定义全局变量 a、局部变量 b、再 malloc 一段内存赋给 c，打印三者和 main 函数的地址。三个变量虽然在源码里连续定义，内存地址却相隔很远，因为它们分别存放在不同的内存区域。<\/p>\n<p>内存上有两类重要信号线：数据信号线负责在 CPU 和内存之间传递读写的内容；地址信号线负责指明要读写哪一块内存。在读写任何数据之前，必须先给出内存地址——地址是一切内存读写的前提。指针变量专门用来保存这种内存地址。<\/p>\n<p>寄存器层面，本书示例把寄存器分成两类：rax 这类一般存放数值，相当于 C 语言里的普通变量；rbp、rsp 这类存放内存地址，相当于指针变量。rsp 标识栈顶位置，rbp 标识当前栈帧的基准位置。<\/p>\n<h3>概念 2：汇编指令与栈帧雏形<\/h3>\n<p>本书 1.3 节用一个自加函数 test() 跟踪汇编：函数进入时先执行 push rbp，它包含两个微操作——先把 rbp 的值存放到 rsp 指向的内存下方，再让 rsp 减 8，向低地址方向生长；随后 mov rbp, rsp 把栈帧基准线对齐到栈顶。<\/p>\n<p>接下来的 mov 指令把数值 1 写入变量 a 所在内存，对应 C 语言写法 <code><em>(rbp - 8) = 1<\/code>；add 指令先通过 <\/em> 读出 a 的值、加 2，再把结果写回原地址；<code>rax = *(rbp - 8)<\/code> 则是把内存值读进寄存器。函数结束时 pop 是 push 的反向操作，把栈顶值还给 rbp，最后 ret 回到调用处。除了存放返回值的 rax，其余寄存器都恢复到调用前的状态。<\/p>\n<p>本书统计过一个粗略观察：一次简单的 +2 运算，至少伴随 5 次内存读写，内存读写占比很高；有观点认为 CPU 的内存读写占据约九成工作负荷。这也是理解后面所有章节的背景——变量、参数、对象，本质上都是在寄存器和内存之间搬数据。<\/p>\n<p>顺着执行时序推演：先推演序言如何搭起栈帧，再推演主体指令如何反复读写同一处内存，最后看结语如何把现场还原。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[C/C++ 源码] --&gt; B[编译器/汇编器]\nB --&gt; C[汇编指令]\nC --&gt; D[寄存器读写]\nC --&gt; E[内存读写]\nD --&gt; F[CPU 执行]\nE --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：源码经过编译变成汇编指令，汇编指令再拆成寄存器动作和内存动作；本书反复使用 Compiler Explorer 这类工具，把每行源码和右侧汇编指令一一对上。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：寄存器像 CPU 手边的工作台面，内存像仓库；台面位置少、取放快，仓库大但每次都要报地址取货。\n<\/li><li>\n实例（本书 1.1 节）：Compiler Explorer 可以把 C/C++ 源码翻译成汇编指令，也支持 RUST、GO、Swift、Python、Java 等语言的汇编或字节码查看；勾选“Compiler to binary”还能同时看到机器码和存放地址。\n<\/li><li>\n实例（本书 1.2 节）：编译出的可执行文件 a.out 里能找到对应的汇编指令，连源码中的字符串 &quot;password&quot; 也原样留在文件中。\n<\/ul>\n<h2>为什么<\/h2>\n<ul><li>\n<strong>为什么要从 CPU 视角回看语法<\/strong>：CPU 本身没有那么多语法规则，理解这些简单规则之后，才能客观还原程序运行原理，而不是背语法条文。\n<\/li><li>\n<strong>为什么必须有栈<\/strong>：线程通过调用函数运行，临时变量和函数返回地址都要有地方存放，栈就是为这两件事准备的内存结构。\n<\/li><li>\n<strong>为什么单独看每条汇编会觉得乏味<\/strong>：脱离编译器意图和源码上下文，指令只是孤立的搬数动作；要结合它服务的高级语言意图来读。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“学 C/C++ 必须先精通汇编”——本书明确说不要求读者熟悉或精通汇编，每条指令意义相对简单，结合源码大多能直接猜出。\n<\/li><li>\n别以为“普通变量操作跟指针无关”——在 CPU 眼里，万物皆有地址，普通变量的读写同样基于地址完成（详见第 2 章指针一节）。\n<\/li><li>\n别把 eax 和 rax 当成两个无关寄存器：eax 是 32 位寄存器名，rax 是对应的 64 位寄存器，eax 只是 rax 的低 32 位。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判断：rbp、rsp 用来存放内存地址，角色接近指针变量。（答案：是；本书 1.3 节。）\n<\/li><li>\npush rbp 之后 rsp 增大还是减小？（答案：减小 8，栈向低地址生长。）\n<\/li><li>\n函数返回后，除返回值寄存器外，其他寄存器为什么像没被调用过？（答案：序言/结语成对保护与恢复，rbp、rsp 等都回到调用前状态。）\n<\/ol>\n<h2>完整推导 1：从 <code>return 0;<\/code> 到三条汇编指令<\/h2>\n<ol><li>\n编译器先看源码意图：main 要把数值 0 作为函数返回值交回调用方。\n<\/li><li>\n返回值约定放在 rax，于是生成 <code>mov eax, 0<\/code>（64 位下即 rax 置 0）。\n<\/li><li>\n函数收尾要恢复主调现场：<code>pop rbp<\/code> 把旧栈帧基准还给 rbp。\n<\/li><li>\n最后 <code>ret<\/code>：栈顶返回地址送入 rip，CPU 跳回主调被打断的位置。\n<\/li><li>\n对照本书图 1-1：左边 <code>return 0;<\/code> 与右侧 <code>mov eax, 0 / pop rbp / ret<\/code> 一一对应；看不到任何“main 特殊待遇”的指令。\n<\/ol>\n<h2>完整推导 2：自加函数 <code>a += 2<\/code> 的内存读写链<\/h2>\n<ol><li>\n进入函数后 <code>push rbp<\/code> 保存主调基准，<code>mov rbp, rsp<\/code> 对齐新栈帧基准。\n<\/li><li>\n<code>mov QWORD PTR [rbp-8], 1<\/code>：把 1 写入 a 所在内存，对应 <code>*(rbp - 8) = 1<\/code>。\n<\/li><li>\n<code>add QWORD PTR [rbp-8], 2<\/code>：先按 * 读出 a 的值，与 2 做加法，再把结果写回同一地址。\n<\/li><li>\n<code>mov rax, [rbp-8]<\/code>：把内存里的最终值读进 rax 作返回值。\n<\/li><li>\n<code>pop rbp<\/code> 恢复基准，<code>ret<\/code> 返回；除 rax 外寄存器都回到调用前状态。\n<\/li><li>\n本书统计：这一次 +2 至少伴随 5 次内存读写，内存读写在 CPU 负荷中占比很高。\n<\/ol>\n<h2>反事实分析<\/h2>\n<ul><li>\n如果没有栈：函数返回地址和临时变量就没有统一存放位置，函数调用结束后无法找到回来的路，临时变量也无处安放。栈正是为“记返回地址 + 存临时变量”这两件事准备的。\n<\/li><li>\n如果 CPU 可以直接拿裸地址访问内存：指令集就不需要寄存器配合方括号的间接寻址；本书 2.2 节指出 x86 必须通过寄存器间接访问内存，这条限制决定了后续所有指针操作的汇编形态。\n<\/li><li>\n如果不需要保护现场：函数嵌套调用时 rbp、rsp 会互相覆盖，返回后主调函数的栈帧基准就找不回来。\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n地址是内存读写的前提；指针变量保存地址。\n<\/li><li>\nrax 放数值，rbp/rsp 放栈上地址。\n<\/li><li>\npush 存值并减 8，pop 反向恢复；mov 读写内存，add 先读后写。\n<\/ul>", "ch02": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.32<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：预备知识——CPU 眼里的程序运行与汇编语言<\/a><\/span><\/div><h1>第 2 章：基础语法——变量、流程控制、指针与数组在内存里的样子<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章寄存器与汇编基础\n<\/li><li>\n<strong>对应原书<\/strong>：第 2 章 基础语法（2.1 main、2.2 变量、2.3 goto/if else、2.4 指针变量、2.5 指针本质和风险、2.6 数组、2.7 数组越界、2.8 引用、2.9 i++ 与 ++i、2.10 类型转换）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n解释变量、类型宽度与内存地址的关系；\n<\/li><li>\n把指针的 * 操作拆成“取地址—读写目标地址”两步；\n<\/li><li>\n说清数组传参的本质、数组越界会改写什么，以及有符号/无符号比较为什么会出争议。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>在 CPU 眼里，变量是内存地址的别名，指针存的是地址，数组是一段连续内存；流程控制最后都落到跳转指令，而越界和类型争议都是在内存层面露出的马脚。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：变量与类型宽度<\/h3>\n<p>本书 2.1 节先对比了 main 函数和一个普通函数：二者汇编指令完全相同。main 之所以是程序起点，是系统启动链路默认指定了它；用 GCC 的 <code>-efunc<\/code> 选项可以把起点改成任意函数，嵌入式平台做完堆栈、中断向量表和硬件初始化后再跳转到应用入口，入口名也可以改。<\/p>\n<p>2.2 节把变量落到内存：每个变量对应一个内存地址，变量类型决定它占用内存的长度。本书示例中 int 占 4 字节、short 占 2 字节、char 占 1 字节。CPU（x86 为例）不能直接拿裸地址访问内存，要通过寄存器配合方括号间接访问；rip 存放下一条指令的地址，全局/静态变量的偏移量在编译后固定，所以它们地址不变；栈变量的地址则随程序运行变化。<\/p>\n<h3>概念 2：指针与引用的本质<\/h3>\n<p>2.4 节比较了普通变量、char<em>、short<\/em>、数组指针、指针的指针：对指针变量的读写操作，汇编上跟普通变量没有区别；所谓“指向”，描述的是指针里存的值是某个内存地址。64 位 CPU 上一个内存地址占 8 字节，所以各类指针变量宽度都是 8 字节。<\/p>\n<p>对指针做 <em> 操作分两步：先锁定目标地址，把指针变量的值读出来作为目标地址；再把数值写入（或读出）这个目标地址。2.5 节进一步指出：指针操作不是指针变量的专利，普通变量甚至立即数都可以做指针操作；只要知道变量地址，就能 <code><\/em>(int*)&amp;a = 1<\/code> 这样直接赋值。类对象的 <code>.<\/code> 操作和 <code>-&gt;<\/code> 操作，本质上也是同一套地址读写。<\/p>\n<p>2.8 节对比引用和指针：两者汇编指令完全相同，读改写引用变量，实际就是在读写对应的指针。语法层面的区别主要有四条：引用写法更简洁、不用加 *；引用不能赋 NULL；引用不能改绑到另一个变量；不存在“引用的引用”。本书把引用总结为指针常量一类的机制。<\/p>\n<h3>概念 3：数组与数组越界<\/h3>\n<p>2.6 节：数组是一段连续内存，int 数组元素间隔 4 字节，char 数组间隔 1 字节。数组作为参数传递时，编译器不会在栈上构建一个相同大小的临时数组，而是简单传递首地址，跟传指针一样；函数内改数组元素会影响外部数组。一维、二维、三维数组在 CPU 眼里都是一维连续内存，只是索引方式不同。<\/p>\n<p>2.7 节用实验看越界：向低地址方向越界，若越界区域是“无主之地”，程序暂时可能正常；向高地址方向越界，栈上方保存着主调函数的栈帧和返回地址。本书实验把数组第 3 个元素写成恶意函数地址后，func1 返回时不再回到 main，而是跳去执行恶意代码。即使不写地址、只写非法数值，CPU 跳到不存在合法指令的内存处，也容易触发 Segmentation Fault。strcpy、strcat、memcpy、memmove 以及按下标写全局数组，都是越界重灾区。<\/p>\n<p>2.10 节的类型转换陷阱：<code>char a = 0xff;<\/code> 中 a 是有符号数，最高位为 1，按补码表示的是 -1；与右边无符号 0xff 比较前要先统一类型，-1（0xffffffff）不等于 255（0x000000ff），输出 different。补码下同一个二进制串既可解释成负数、也可解释成大正数，规避办法是比较前统一两边类型。<\/p>\n<p>顺着补码规则推演：先推演最高位如何决定符号，再推演类型统一后两个字面量怎么变成不同整数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\nA[变量名] --&gt; B[内存地址别名]\nB --&gt; C{类型决定宽度}\nD[指针变量] --&gt; E[保存内存地址]\nE --&gt; F[* 操作: 取地址再读写]\nG[数组] --&gt; H[连续内存]\nH --&gt; I[传参只传首地址]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：变量、指针、数组三条线最后都汇到“地址 + 读写动作”，差异只在保存的内容和访问方式。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：变量名像收货人名，地址才是仓库坐标；指针就是写着坐标的纸条，照着纸条才能找到货架。\n<\/li><li>\n实例（本书 2.3 节）：for 循环、while、if…else、switch 编译后都落到 jmp、jle、jne 这类跳转指令；jmp 改变程序执行位置，条件跳转根据前面 cmp 的结果决定跳不跳。Linux 内核里检查到参数异常或返回值错误时，常用 goto 跳到统一的 error 处理段。\n<\/li><li>\n实例（本书 2.9 节）：单独执行 ++i 和 i++，汇编完全相同；当表达式要取用自加前/后的值时，前加（++i）对应指令更少，后加（i++）要多保留一份旧值。\n<\/li><li>\n自拟练习：int 指针 p 指向 int 数组，p+1 前进 4 字节；char 指针 q 前进 1 字节。指针步进按指向类型的宽度计算。\n<\/ul>\n<h2>为什么<\/h2>\n<ul><li>\n<strong>为什么局部变量地址会变、全局变量地址不变<\/strong>：全局/静态变量在编译后的二进制数据段里位置固定；栈变量随每次函数调用在栈帧里分配，栈帧位置一动，地址就跟着动。\n<\/li><li>\n<strong>为什么指针给变量多了一个读写渠道<\/strong>：变量名读写走编译器规定的路径，指针读写直接按地址来；渠道多了，出 bug 时就不容易定位。\n<\/li><li>\n<strong>为什么越界有时不崩、有时立刻崩<\/strong>：越界写到空闲内存暂时不影响别人；一旦写到返回地址、栈帧基准这类关键数据，控制流就被篡改，崩溃或劫持只是早晚。\n<\/li><li>\n<strong>为什么有符号比较容易出隐蔽 bug<\/strong>：日常多用正数比较，编译器警告常被忽略；补码的二义性只有在碰到 0xff 这类最高位为 1 的串时才暴露。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“指针是 C 语言独有的特殊机制”——本书指出普通变量读写本质也是基于地址，指针只是把地址显式拿出来操作。\n<\/li><li>\n别以为“引用和指针是两套底层实现”——汇编层面二者完全相同，差别主要在语法约束上。\n<\/li><li>\n别以为“二维数组在内存里排成表格”——内存条是一维的，多维数组只是按索引规则折成一维存放。\n<\/li><li>\n别以为“数组传参会复制整个数组”——传的只是首地址，函数内改动会落到原数组上。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n64 位 CPU 上 char<em>、int<\/em>、int** 各占几字节？（答案：都是 8 字节，都存内存地址。）\n<\/li><li>\n数组作参数传递时栈上会建临时数组吗？（答案：不会，只传首地址。）\n<\/li><li>\n<code>char a = 0xff;<\/code> 按有符号补码，a 解释成多少？（答案：-1；与无符号 255 比较不相等。）\n<\/li><li>\n引用和指针在汇编层面有区别吗？（答案：没有，完全相同；区别在语法层。）\n<\/ol>\n<h2>完整推导 1：<code>*p = 2<\/code> 的两步内存动作<\/h2>\n<ol><li>\n定义 <code>int* p = &amp;a;<\/code>：把变量 a 的内存地址（本书示例 0x1234）写入 p 自己所在的内存（0x1238）。\n<\/li><li>\n执行 <code>*p = 2<\/code> 第一步：锁定目标地址，从 p 所在内存读出 0x1234，这就是要读写的目标位置。\n<\/li><li>\n第二步：把数值 2 写入 0x1234 指向的内存，即改写变量 a。\n<\/li><li>\n对照本书图 2-18 至 2-21：先画地址栏与值栏，再看 p 里存的是地址、* 操作沿地址落到目标单元。\n<\/li><li>\n反向操作 <code>rax = *p<\/code> 按同样方式：先读目标地址的值，再搬进寄存器。\n<\/ol>\n<h2>完整推导 2：<code>char a = 0xff; a == 0xff<\/code> 为什么输出 different<\/h2>\n<ol><li>\n左侧 a 是有符号 char，二进制 0xff 最高位为 1，按补码规则表示负数 -1。\n<\/li><li>\n比较前先统一类型：a 转成 int 后是 0xffffffff，即 -1。\n<\/li><li>\n右侧 0xff 是无符号 int 字面量，转成 int 是 0x000000ff，即 255。\n<\/li><li>\n比较 -1 与 255，二者不相等，所以输出 different。\n<\/li><li>\n规避办法：比较前把两边类型统一，例如写成 <code>(unsigned char)a == 0xff<\/code>，或把右边也转成 char。补码下同一个二进制串既可解释成负数、也可解释成大正数，这是争议来源。\n<\/ol>\n<h2>反事实分析<\/h2>\n<ul><li>\n如果数组传参时复制整个数组：大数组每次调用都要在栈上拷贝一份，栈空间和拷贝开销都难以承受；本书 2.6 节的做法是只传首地址，函数内读写直接落回原数组。\n<\/li><li>\n如果引用在底层是另一套实现：引用参数就需要独立于指针的传递约定；本书 2.8 节对照汇编发现两者指令完全相同，引用只是语法层的别名约束。\n<\/li><li>\n如果有符号/无符号比较前不做类型统一：补码二义性会一直留在代码里，日常正数比较掩盖问题，碰到最高位为 1 的数值才暴露。\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n变量 = 地址别名；类型决定宽度；全局/静态地址固定，栈地址随运行变化。\n<\/li><li>\n* 操作两步：取指针值作目标地址，再读写该地址。\n<\/li><li>\n数组连续存放，传参传首地址；高端越界改写返回地址最危险。\n<\/li><li>\n补码二进制有正负二义性，比较前先统一类型。\n<\/ul>", "ch03": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.76<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：基础语法——变量、流程控制、指针与数组在内存里的样子<\/a><\/span><\/div><h1>第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 2 章变量、指针与数组\n<\/li><li>\n<strong>对应原书<\/strong>：第 3 章 函数原理（3.1 参数传递、3.2 函数括号 {}、3.3 调用和返回、3.4 函数指针、3.5 函数返回值、3.6 堆和栈、3.7 函数实验回溯函数调用关系）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清传值、传指针、传引用在寄存器层面的相同与不同；\n<\/li><li>\n按 call、push、mov、sub、pop、ret 复述一次函数调用往返；\n<\/li><li>\n区分栈与堆的归属、生长方向、分配释放方式和故障形态。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>函数调用就是主调函数把数值送进寄存器、被调函数在自己的栈帧里干活，再靠栈上的返回地址跳回去；栈随调用自动伸缩，堆要手动申请释放。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：参数传递与栈帧<\/h3>\n<p>本书 3.1 节对比两类函数：形参为数值型的 func1(long x, long y, long z)，和形参为指针型的 func2(long<em> x, long<\/em> y, long* z)。调用前，参数通过 mov 指令送进寄存器——本书示例用 rdi、rsi、rdx（低 32 位对应 edi、esi、edx）。传值时送进去的是变量的值；传指针时送进去的是变量的内存地址。<\/p>\n<p>进入被调函数后，寄存器还要留作他用，所以参数先被拷贝到栈帧里，对应地址是 [rbp-8]、[rbp-16]、[rbp-24]，也就是形式参数（参数克隆体）。传值方式下，函数内改的是这个克隆体，外部实参不受影响；传指针时，栈里存的是外部变量地址，* 操作顺着地址写回本体，外部变量就被改掉。传引用在生成代码上和传指针完全相同，属于语法糖。参数复杂到寄存器装不下时，会改用堆栈传递载体，但工作原理一致。<\/p>\n<p>3.2 节拆函数括号 {}：序言先是 push rbp 保存主调栈帧基准，再 mov rbp, rsp 让基准线对齐栈顶；随后 sub 指令抬高（本书图示为下压）栈顶，给局部变量分配空间。本书 msvc 示例里两个 int 局部变量相对基准线的偏移分别是 4 和 8。结语把栈顶降回基准线，pop rbp 恢复旧基准，再 ret。<\/p>\n<p>3.3 节跟完整往返：call 指令做两件事——把下一条指令地址（返回地址 0x401105e 这类）压入栈，再跳转到被调函数首地址。函数结束时 pop rbp 恢复基准，ret 把栈顶返回地址传给 rip，CPU 跳回主调被打断的位置，栈帧干干净净归还。<\/p>\n<p>顺着一次往返推演：先推演 call 如何在栈上留下归路，再推演 ret 如何按归路跳回主调被打断的位置。<\/p>\n<h3>概念 2：堆与栈的区别<\/h3>\n<p>3.6 节先厘清命名：stack 译“栈”，heap 译“堆”，二者不是一回事。<\/p>\n<p>栈由操作系统分配给每个任务（线程）私有：主线程一个栈，新建线程也会得到一块同等大小的栈内存。栈上记录函数返回地址、提供临时变量空间；函数调用时申请栈内存，返回时释放，只需移动 rsp，往往一条指令完成。递归调用时局部变量地址逐层降低，验证栈由高地址向低地址生长；本书递归示例中每个变量 a 的地址间隔固定为 32（0x20）字节。<\/p>\n<p>堆同样由操作系统提供，但空间通常大得多，用来存放较大的数据。堆的使用是显式的：malloc、calloc、realloc 或 new 申请，free 或 delete 释放；申请到的块可以被多个线程访问。堆由低地址向高地址生长；malloc/free 本身是复杂的管理函数，多次分配释放后大块完整堆内存会变得支离破碎，即内存碎片。忘记 free 就是内存泄漏，本书比作“借债不还”。<\/p>\n<p>栈空间一般较小，递归过深或栈上分配过大就会爆栈（stack overflow）；堆内存空间大，但分配释放要程序员自己安排。没有操作系统的环境里，堆和栈都要程序员手动划分。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">sequenceDiagram\nparticipant M as 主调 main\nparticipant R as 返回地址(栈)\nparticipant F as 被调 func\nM-&gt;&gt;F: call: 压入返回地址, 跳转首地址\nF-&gt;&gt;F: push rbp; mov rbp,rsp; sub rsp,N 建栈帧\nF-&gt;&gt;F: 读写形参副本与局部变量\nF-&gt;&gt;R: pop rbp 恢复基准\nR-&gt;&gt;M: ret: 返回地址送入 rip, 跳回打断点<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：调用与返回成对出现，栈上的返回地址是回主调函数的唯一凭据。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：栈像餐厅翻台的托盘，上一道菜收一张，进出自动；堆像自助仓库，自己登记取件、用完归还，忘了登记就一直占着。\n<\/li><li>\n实例（本书 3.1 节）：func1(1, 2, 3) 直接把常量送寄存器；func1(a, b, c) 要先读变量值再送寄存器，效果相同。\n<\/li><li>\n实例（本书 3.6 节）：两个线程调用同一个 func，函数内局部变量 a 分别存在各自线程的栈里，互不干扰；若 a 是 static，就另当别论（见第 4 章存储期一节）。\n<\/li><li>\n补充说明：函数指针保存的是函数代码的内存地址，调用它和调用普通函数走同一套 call/ret 流程；本书 3.4、3.5 节分别展开函数指针与返回值的接收方式。\n<\/ul>\n<h2>为什么<\/h2>\n<ul><li>\n<strong>为什么传值改不动外部变量<\/strong>：形参在被调栈帧里是独立副本，本体在主调栈帧，两个位置不重叠。\n<\/li><li>\n<strong>为什么返回地址必须存在栈上<\/strong>：call 之后 CPU 要记得回来找哪条指令，这个“归路”只能随调用现场一起保存；它离临时变量近，既是设计简洁的来源，也是安全隐患。\n<\/li><li>\n<strong>为什么栈效率高、堆慢<\/strong>：栈的申请释放只是移动 rsp，编译器高度优化；堆每次要经过管理函数查找、切分、合并块，开销和碎片都来自这里。\n<\/li><li>\n<strong>为什么深递归会爆栈<\/strong>：每深入一层就压一帧，栈空间有上限，递归深度超过上限就耗尽栈内存。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“传引用是第三种传递机制”——CPU 层面和传指针相同，只是语法约束不同。\n<\/li><li>\n别以为“堆和栈都是自动回收”——栈随函数返回自动回收，堆必须显式释放。\n<\/li><li>\n别以为“同一函数里的局部变量会被所有调用共享”——非 static 局部变量在各自栈帧里，线程间、调用间互不影响。\n<\/li><li>\n别把数据结构书里讲的“堆（优先队列）”和这里的 heap 混为一谈，二者原理相通但使用场景不同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n传指针为什么能改外部变量？（答案：栈里存的是外部变量地址，* 操作按地址写回本体。）\n<\/li><li>\ncall 指令的两个动作是什么？（答案：压入返回地址；跳转到函数首地址。）\n<\/li><li>\n栈和堆各自的生长方向？（答案：栈高地址→低地址；堆低地址→高地址。）\n<\/li><li>\n内存泄漏对应本书的什么比喻？（答案：借债不还，malloc 后忘记 free。）\n<\/ol>\n<h2>完整推导 1：一次函数调用的栈帧往返<\/h2>\n<ol><li>\n主调执行 <code>call func<\/code>：先把下一条指令地址（返回地址，本书示例 0x401105e）压入栈，再跳转到 func 首地址。\n<\/li><li>\n被调序言：<code>push rbp<\/code> 把主调 rbp 存到栈顶下方，rsp 减 8；<code>mov rbp, rsp<\/code> 让基准线对齐栈顶。\n<\/li><li>\n<code>sub rsp, N<\/code> 下压栈顶，为局部变量分配空间；本书 msvc 示例两个 int 局部变量相对基准偏移 4 和 8。\n<\/li><li>\n函数体读写形参副本与局部变量；结语 <code>mov esp, ebp<\/code>（等价把栈顶降回基准），<code>pop rbp<\/code> 恢复旧基准。\n<\/li><li>\n<code>ret<\/code> 把栈顶返回地址送入 rip，CPU 跳回主调被打断的位置，栈帧归还，不增不减。\n<\/ol>\n<h2>完整推导 2：传值与传指针为什么结果不同<\/h2>\n<ol><li>\n调用 func1(a, b, c)：参数 1、2、3 经 mov 送进 rdi、rsi、rdx，再拷进被调栈帧 [rbp-8]、[rbp-16]、[rbp-24]，这是形参克隆体。\n<\/li><li>\n函数内改克隆体：只动栈帧副本，主调栈帧里的本体没有触碰，返回后外部实参不变。\n<\/li><li>\n调用 func2(&amp;a, &amp;b, &amp;c)：寄存器里送的是外部变量地址；栈帧副本保存这些地址。\n<\/li><li>\n<code>*x = 0<\/code>：先从副本读出外部地址，再按地址写回本体，外部变量被改掉。\n<\/li><li>\n传引用生成的指令与传指针一致；差别只在语法约束，不在机器动作。\n<\/ol>\n<h2>反事实分析<\/h2>\n<ul><li>\n如果返回地址不压栈：函数执行完无法知道回到主调哪一条指令，调用链就断了；call 把返回地址留在栈上，正是为 ret 提供归路。\n<\/li><li>\n如果堆也随函数返回自动回收：就不需要 free/delete，也不会有内存泄漏；本书 3.6 节明确堆必须程序员手动申请释放，代价是碎片和泄漏都要自己管。\n<\/li><li>\n如果栈可以被多线程共享：一个线程的临时变量就会被别的线程踩到，线程间隔离无从谈起；栈因此按线程私有分配，各自记录返回地址和局部变量。\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n参数先进 rdi/rsi/rdx，再拷进栈帧副本；传值改副本，传指针写本体。\n<\/li><li>\n栈帧：call 压返回地址 → push rbp → mov rbp,rsp → sub rsp 分配 → pop rbp → ret。\n<\/li><li>\n栈线程私有、自动伸缩、向低地址长；堆共享、手动管理、向高地址长，有碎片和泄漏。\n<\/ul>", "ch04": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.120<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈<\/a><\/span><\/div><h1>第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 3 章函数与栈帧\n<\/li><li>\n<strong>对应原书<\/strong>：第 4 章 C++ 特性（4.1 this、4.2 构造函数、4.3 虚函数、4.4 多态、4.5 模板、4.6 malloc 和 new、4.7 依赖反转）；第 5 章 高级编程（5.1 虚拟内存、5.2 进程、5.3 地址映射、5.4 volatile、5.5 常量、5.6 系统调用、5.7 大端小端、5.8 上下文、5.9 锁）；第 6 章 面试挑战（6.1 static/global/local、6.2 数组和双重指针、6.3 指针为什么这么难、6.4 auto、6.5 thread_local、6.6 面试技巧）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 this 指针的隐式传参路径，区分静态绑定与动态绑定；\n<\/li><li>\n描述虚拟内存如何经 MMU 映射到物理内存，以及大小端的字节摆放；\n<\/li><li>\n区分全局、静态、局部变量的存储位置，知道线程局部存储解决什么问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>C++ 的对象特性没有发明新机器规则：this 是隐藏参数，虚函数多一层查表；进程看到的地址是虚拟地址，最终由 MMU 和操作系统映射到物理内存；存储期差异落到数据段、栈和堆的不同位置。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：对象模型——this 与虚函数<\/h3>\n<p>本书 4.1 节对比成员函数 mFunc 和普通函数 func：两者汇编指令完全相同。成员函数其实藏了一个默认参数——this 指针；调用成员函数时，对象把自己的内存地址通过 rdi 寄存器传给成员函数，这和调用带指针参数的普通函数没有区别。<\/p>\n<p>4.2 节：构造函数跟普通函数一样带隐形 this；派生类构造函数会先调用基类构造函数；含有虚函数的类，构造函数会把虚函数表地址记到对象里藏着的一个成员变量中，这个隐藏成员往往位于对象内存首地址处。<\/p>\n<p>4.3 节比较普通成员函数与虚函数：二者函数体都带 this 隐藏参数，差别在调用处。普通成员函数在编译阶段就确定 call 哪个函数地址，即静态绑定；虚函数的 call 只能根据寄存器（本书示例 rdx）里的值确定位置——运行时顺着对象里的虚表指针查到虚表，再取对应函数地址，即动态绑定。4.4 节的多态，落到机器层面就是同一套调用接口，按对象实际类型查到不同虚表项。<\/p>\n<h3>概念 2：虚拟内存与地址映射<\/h3>\n<p>5.1 节：程序打印出来的变量地址（如 0x7ffcd930e8fc）远超普通物理内存上限，它不是真实物理地址，而是虚拟内存地址。无论手机 App 还是 Hello World，都认为自己独占一套大地址空间：32 位 CPU 虚拟空间约 4GB，64 位 CPU 空间更大。<\/p>\n<p>虚拟内存建立在物理内存之上，为每个进程营造一套更庞大的地址空间。真实数据最终仍存在物理内存里，需要内存管理单元 MMU 和操作系统配合，完成虚拟地址到物理地址的映射；这种映射有硬件加持，对程序员无感，也不影响 CPU 运行效率。5.2、5.3 节在此基础上展开进程视角与地址映射过程。<\/p>\n<p>顺着访存链路推演：先推演虚拟地址如何送进 MMU 查表，再推演查表得到的物理地址如何落地读写 RAM。<\/p>\n<p>5.6 节系统调用：用户态代码运行在用户内存空间，执行 syscall 后 CPU 跳转到内核内存空间运行操作系统预设代码；内核态代码（操作、驱动程序）出错往往蓝屏崩溃，经过千锤百炼，用户态程序出错不会拖垮整个系统，这就是用户态与内核态隔离的意义。<\/p>\n<p>5.7 节大小端：x86 上把一个 8 字节长整按字符打印会得到倒序字符串。原因是 CPU 把数值低位字节写在低地址、高位字节写在高地址，这是小端模式；人书写习惯高位在前，对应大端模式。<\/p>\n<h3>概念 3：存储期——static、global 与 local<\/h3>\n<p>6.1 节定义全局变量 a、函数内静态变量 b 和 main 内局部变量 c：函数 func1 的汇编里对静态变量 b 没有任何初始化动作，因为它在编译期就已安排进数据段。打印地址可见，静态变量 b 和全局变量 a 内存地址相互邻近，属于同一块数据区域；编译器只在作用域上限制静态变量的可见范围。知道静态变量地址后，同样可以绕开作用域限制按地址读写。<\/p>\n<p>6.5 节 thread_local（线程局部存储）：修饰的变量每个线程各持一份拷贝，呼应 3.6 节线程私有栈的模型。6.2 节双重指针题中，字符串常量存在数据段，栈上一维数组 a 的三个元素分别存三个字符串首地址，64 位下每个地址 8 字节；<code>a[2][1]<\/code> 等价于 <code>*(a[2] + 1)<\/code>，数组 a 是一维数组，不是二维数组。<\/p>\n<p>第 5 章其余条目按目录对照：volatile 阻止编译器过度优化对特定内存的读写；常量在编译/链接阶段定型；上下文记录寄存器与栈状态，供切换线程时恢复；锁用于多线程共享数据时的互斥访问。这些概念在本书中均以 CPU 视角展开，可在通读本章后回原书对应小节查证。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[对象调用成员函数] --&gt; B[rdi 传入 this=对象地址]\nB --&gt; C{函数种类}\nC --&gt;|普通成员函数| D[编译期静态绑定 call 定址]\nC --&gt;|虚函数| E[运行时查虚表动态绑定]\nF[程序看到虚拟地址] --&gt; G[MMU + OS 映射]\nG --&gt; H[物理内存]\nI[全局/静态变量] --&gt; J[数据段, 地址固定]\nK[局部变量] --&gt; L[栈, 随调用伸缩]\nM[malloc/new 块] --&gt; N[堆, 手动释放]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：对象模型、地址映射、存储期三条线，最终都落到“哪个地址、哪段内存、什么时候释放”。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：this 像进房间时递给门卫的房牌号，成员函数靠这个号码找到是哪个对象在调用它。\n<\/li><li>\n实例（本书 4.1 节）：<code>A a; a.mFunc();<\/code> 与 <code>func((long*)&amp;a);<\/code> 生成的调用指令完全一致，传入的都是对象 a 的内存地址。\n<\/li><li>\n实例（本书 6.1 节）：全局变量 a 在 0x404030，静态变量 b 在 0x404034，相邻 4 字节，同处数据段。\n<\/li><li>\n补充说明：模板（4.5）在编译期按实参类型生成对应代码；malloc 与 new 的差别在于 new 会额外触发构造函数、delete 会触发析构函数，本书 4.6 节展开。\n<\/ul>\n<h2>为什么<\/h2>\n<ul><li>\n<strong>为什么 this 不像显式参数却必须存在<\/strong>：成员函数要区分“正在操作哪个对象”，对象地址总得有个传递路径；C++ 语法把它隐藏了，机器层面仍是一个普通参数。\n<\/li><li>\n<strong>为什么虚函数不能在编译期定死地址<\/strong>：基类指针可能指向派生类对象，具体类型要到运行时才确定，只能查虚表解析调用目标。\n<\/li><li>\n<strong>为什么要有虚拟内存<\/strong>：每个进程都以为独占一套大地址空间，进程间互不干扰；MMU 硬件映射让这种隔离对程序透明。\n<\/li><li>\n<strong>为什么静态变量不随函数调用重置<\/strong>：它不在栈帧里，而在数据段，函数返回后空间不回收，下次调用仍保留上次的值。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“成员函数和普通函数是两套调用机制”——汇编上只是多传了 this 这一个参数。\n<\/li><li>\n别以为“程序里的地址就是物理内存条上的位置”——那是虚拟地址，要经映射才落到物理内存。\n<\/li><li>\n别以为“static 变量存在栈上”——它和全局变量同在数据段，作用域限制是编译器给的，不是内存位置给的。\n<\/li><li>\n别把小端当成“字符串倒序存储”——字符串本身按顺序放，倒序观感来自多字节数值的字节摆放规则。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nthis 指针通过哪个寄存器传入成员函数？（答案：rdi，本书 4.1 节。）\n<\/li><li>\n静态绑定和动态绑定的区别？（答案：前者编译期 call 定址；后者运行时按虚表查函数位置。）\n<\/li><li>\n32 位 CPU 的虚拟地址空间约多大？（答案：4GB。）\n<\/li><li>\n函数内 static 变量和谁同处数据段？（答案：全局变量。）\n<\/ol>\n<h2>完整推导 1：成员调用的 this 传递与虚表查表<\/h2>\n<ol><li>\n<code>A a; a.mFunc();<\/code> 编译后与 <code>func((long*)&amp;a);<\/code> 的调用指令对照：两者都把对象 a 的内存地址送进 rdi。\n<\/li><li>\n这个地址就是 this 指针；成员函数体通过 this 找到当前操作的对象数据。\n<\/li><li>\n普通成员函数：编译阶段就确定 call 的目标函数地址，即静态绑定。\n<\/li><li>\n虚函数：call 只能依据寄存器（本书示例 rdx）中的值定位；运行时先读对象里的虚表指针，再到虚表中取对应函数地址，即动态绑定。\n<\/li><li>\n多态在机器层面就是同一调用接口，按对象实际类型查到不同虚表项；含虚函数的类，对象首地址附近藏有虚表指针成员。\n<\/ol>\n<h2>完整推导 2：虚拟地址到物理内存的映射<\/h2>\n<ol><li>\n程序打印变量地址得到 0x7ffcd930e8fc 这类值，它超出普通物理内存上限，是虚拟地址而非物理地址。\n<\/li><li>\n每个进程以为自己独占一套大地址空间：32 位 CPU 约 4GB，64 位 CPU 空间更大。\n<\/li><li>\nCPU 在这套虚拟地址上读写；真实数据最终仍落在物理 RAM。\n<\/li><li>\nMMU 硬件配合操作系统页表，把虚拟地址逐条映射到物理地址；映射有硬件加持，对程序员无感，也不拖慢 CPU。\n<\/li><li>\n系统调用是另一道边界：syscall 后 CPU 从用户内存空间跳到内核内存空间运行预设代码，用户态崩溃被隔离在内核之外。\n<\/ol>\n<h2>反事实分析<\/h2>\n<ul><li>\n如果虚函数也在编译期定址：基类指针指向哪个派生类对象就无法在运行时区分，多态的“同一接口不同实现”落不了地；动态绑定正是为类型要到运行时才确定而存在。\n<\/li><li>\n如果没有 MMU 和地址隔离：一个程序的野指针就能扫改整机内存，早期无 MMU 的单片机/DOS 环境确实可以这样做；现代系统靠虚拟内存把各进程关在各自地址空间里。\n<\/li><li>\n如果去掉 volatile 修饰：编译器可能把对特定内存的读写优化成寄存器缓存，不再每次访问原内存；本书 5.4 节用 volatile 阻止这类过度优化，条件去掉后硬件相关场景可能读到陈旧值。\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\nthis = 对象地址，隐藏参数走 rdi；虚函数运行时查虚表。\n<\/li><li>\n虚拟地址经 MMU + OS 映射到物理内存；x86 是小端序。\n<\/li><li>\n全局/静态在数据段，局部在栈，堆上手动申请释放；thread_local 每线程一份。\n<\/ul>", "c01": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.23<\/div><h1>寄存器与内存地址<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>问题<\/h2>\n<p>写过程序的人都知道变量存在内存里，但 CPU 干活时先碰到的是寄存器。为什么本书要先区分“数值寄存器”和“地址寄存器”？内存地址在读写动作里扮演什么角色？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n寄存器是 CPU 内部的高速存储位置，容量很小、取放很快。\n<\/li><li>\n本书示例把寄存器分两类：rax 一类存放数值，角色接近 C 语言普通变量；rbp、rsp 一类存放内存地址，角色接近指针变量。\n<\/li><li>\n内存上有两类信号线：数据信号线传递读写内容，地址信号线指明读写哪一块内存。\n<\/li><li>\n任何内存读写之前，必须先给出地址；指针变量的用途就是保存这个内存地址。\n<\/li><li>\nrsp 标识栈顶位置，rbp 标识当前栈帧基准位置。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 1.2 节做对照实验：定义全局变量 a、局部变量 b，再 malloc 一段内存赋给 c，打印三者和 main 的地址。三个变量在源码里连续定义，内存地址却相隔很远，因为它们分属不同内存区域。这说明“变量名连续”不代表“内存连续”，决定位置的是存储区域。<\/p>\n<p>本书 1.3 节跟踪自加函数：函数进入时 push rbp，把 rbp 值存到 rsp 指向的内存下方，再让 rsp 减 8；mov rbp, rsp 把栈帧基准对齐栈顶。随后 mov、add 指令围绕 [rbp-8] 这类地址读写局部变量；<code>mov rax, [rbp-8]<\/code> 把内存值读进 rax 作返回值。整个过程里，rax 装数值，rbp/rsp 装栈上地址，两类寄存器分工清楚。<\/p>\n<p>补充一条寄存器命名关系：eax 是 32 位寄存器名，rax 是对应的 64 位寄存器，eax 只是 rax 的低 32 位，二者不是两个无关寄存器。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n上述分工以本书示例的 x86-64 调用约定为背景；不同架构（ARM、RISC-V）寄存器命名和传参寄存器不同，但“数值寄存器/地址寄存器”的区分思路通用。\n<\/li><li>\n地址是内存读写的前提，这条在任何有内存的架构上都成立；裸地址不能被 x86 指令直接访问，必须经寄存器配合方括号间接寻址。\n<\/li><li>\n条件去掉会怎样：如果读写前不给出地址，内存不知道往哪块单元写，数据信号线就没有落点。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：把 rbp 当成装数值的普通变量去做算术，就会破坏栈帧基准，后续局部变量寻址全部错位。\n<\/li><li>\n反例二：以为 CPU 可以直接写 <code>mov 0x1234, 1<\/code> 这类裸地址指令；本书 2.2 节指出 x86 做不到，必须先把地址放进寄存器，再用方括号间接访问。\n<\/li><li>\n反例三：把 eax 和 rax 当成两套独立存储，误以为写 eax 不影响 rax；实际上 eax 就是 rax 的低 32 位。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n寄存器 vs 内存：寄存器在 CPU 内部、容量极小、速度最快；内存容量大，每次访问都要报地址。\n<\/li><li>\n数值寄存器 vs 地址寄存器：前者装参与运算的数，后者装“数放在哪”的坐标；后者对应 C 语言里的指针角色。\n<\/li><li>\n地址 vs 数据：地址回答“在哪”，数据回答“是什么”；信号线也分地址线和数据线两条路径。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n上接：汇编指令与栈帧雏形（push/mov/pop 怎么用这些寄存器）。\n<\/li><li>\n下连：变量与类型宽度（变量名是地址别名）、指针与引用的本质（指针存地址）。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（寄存器与内存地址）<\/summary><div class=\"depth-body\"><h1>寄存器与内存地址 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要真正看懂寄存器分工，先得会三件事：第一，知道内存按地址编号，读写任何单元都要先报地址；第二，知道 CPU 内部有一批比内存更快的小存储位置，即寄存器；第三，能区分“参与运算的数”和“数所在的坐标”。再往前追，需要理解高级语言语句最终要翻译成机器能执行的搬数动作。如果这三层有缺口，直接背 rax、rbp、rsp 的名字只会记混。<\/p>\n<h2>正向推导<\/h2>\n<p>从内存模型开始推演。内存条对外有两组信号线：地址信号线指明本次访问哪一块单元，数据信号线在 CPU 和内存之间传递读写内容。没有地址，数据线不知道往哪落；没有数据，地址本身不携带内容。所以任何一次内存读写都拆成两步：先给地址，再走数据。<\/p>\n<p>CPU 内部的寄存器按用途分两类。一类装参与运算的数值，本书示例用 rax，角色接近 C 语言里的普通变量；另一类装内存地址，本书示例用 rbp、rsp，角色接近指针变量。rbp 记录当前栈帧的基准位置，rsp 记录栈顶位置，二者配合才能在栈上找到局部变量。<\/p>\n<p>再看指令访问方式。x86 指令不能把裸地址直接写进操作数，必须先把地址放进寄存器，再用方括号间接访问，例如 <code>mov QWORD PTR [rbp-8], 1<\/code>。方括号里的表达式算出来是目标地址，指令再把数值写进去。这条限制决定了后面所有指针、数组、栈帧代码的汇编形态：凡是“按地址读写”，机器上都要出现寄存器加方括号的形式。<\/p>\n<p>补充寄存器命名关系：eax 是 32 位寄存器名，rax 是对应的 64 位寄存器，eax 只是 rax 的低 32 位。写 eax 会影响 rax 低半段，读 rax 包含完整 64 位。<\/p>\n<h2>算例<\/h2>\n<p>假设一段函数里出现三条动作：把 5 写入变量 a；把 a 加 3；把 a 的值送返回值寄存器。推演对应机器路径：写入动作经寄存器间接寻址落到 a 的内存单元；加法先读 a、运算、写回；返回值最后进 rax。 自拟小算例：64 位环境下，一个指针变量占 8 字节；若有三个指针并排存放，相邻指针地址间隔 8 字节。若基址为 0x1000，三个地址依次是 0x1000、0x1008、0x1010。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：把 rbp 当数值寄存器做算术，栈帧基准被覆盖，后续局部变量寻址全部错位。反例二：以为可以写 <code>mov 0x1234, 1<\/code> 这类裸地址指令，x86 不支持，必须经寄存器间接访问。反例三：把 eax 和 rax 当成两套独立存储，忽略低 32 位重叠关系。 边界说明：分工描述以本书 x86-64 示例为背景；ARM、RISC-V 寄存器命名和传参规则不同，但“数值寄存器/地址寄存器”的区分思路通用。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n内存访问前必须先给出什么？（答案：内存地址，地址是读写前提。）\n<\/li><li>\nrax 与 rbp 各自装什么？（答案：rax 装数值，rbp 装栈帧基准地址。）\n<\/li><li>\neax 和 rax 是什么关系？（答案：eax 是 rax 的低 32 位，不是两个无关寄存器。）\n<\/li><li>\nx86 指令能不能直接用裸地址访问内存？（答案：不能，要经寄存器配合方括号间接访问。）\n<\/ol>\n<h2>推演延伸：寻址方式与地址形态<\/h2>\n<p>回到本书 2.2 节的写操作 <code>mov DWORD PTR [rip+0x2f18], 0x1<\/code>，方括号内是基址加偏移：rip 指向下一条指令，0x2f18 是相对偏移，相加得到目标内存单元。对照 1.3 节的 <code>[rbp-8]<\/code>，这是寄存器相对寻址：rbp 是栈帧基准，-8 指向本帧第一个局部变量。两种写法形式不同，本质都是“寄存器算出地址，再走数据信号线读写”。<\/p>\n<p>把三类变量的地址形态并排看：全局/静态变量在数据段，链接期地址固定；局部变量在栈帧，地址随 rsp/rbp 移动；堆块地址由 malloc 返回。地址本身都是 64 位编号，所以保存地址的指针变量在 64 位机器上占 8 字节。理解这一层，后面看到 <code>[rbp-16]<\/code>、<code>[rdi]<\/code>、<code>QWORD PTR [rax+8]<\/code> 就不会被方括号吓住：括号里算地址，括号外走数据。<\/p>\n<p>再推一层为什么 CPU 要分数值寄存器和地址寄存器：运算单元对数值做加减乘除，访存单元对地址做偏移计算；两类值流过的路径不同，长期使用中形成分工。rax 装返回值和临时数值，rbp/rsp 跟踪栈位置，rsi/rdx 参与传参和串操作。换个架构寄存器名会变，但“装数”和“装地址”的两类职责不会消失。<\/p>\n<h2>推演延伸：寄存器分工与信号线落地<\/h2>\n<p>反面对照看分工约定：如果用 rbp 这类地址寄存器去装临时运算结果、用 rax 去跟踪栈位置，指令流不会立刻报错，但后续访存会按错误地址取值，现场被打乱。寄存器分工不是硬件逐位强制，是调用约定和编译器长期形成的映射；换到别的平台，寄存器名字和分工映射会变，“装数”和“装地址”两类职责仍保留。<\/p>\n<p>信号线再拆一层：读内存时地址线先送达目标编号，数据线随后返回该单元内容；写内存时地址线与数据线同时就位，写脉冲生效。源码里的变量名被编译器翻译成编号，编号经地址线落地，数据线搬运的才是值。<\/p>\n<p>地址宽度决定指针宽度：64 位环境地址编号占 8 字节，所以指针变量 8 字节；32 位环境地址 4 字节，指针随之 4 字节。同一程序移植到不同位数环境，指针宽度跟着环境走，不能按位数写死。<\/p>\n<h2>正向推导细化：逐条指令对寄存器与栈偏移的影响<\/h2>\n<p>以本书示例函数 <code>int f(){ int a=1; a=a+3; return a; }<\/code> 为底，按执行顺序逐条列出寄存器与内存变化（x86-64，栈向低地址生长）：<\/p>\n<ol><li>\n<code>push rbp<\/code>：把当前 rbp 的旧值写到 rsp 指向单元的下方，随后 rsp 减 8；rbp 本身此刻尚未改。\n<\/li><li>\n<code>mov rbp, rsp<\/code>：rbp 取当前 rsp 的值，栈帧基准线对齐到栈顶；此后局部变量一律用 rbp 加负偏移定位。\n<\/li><li>\n<code>mov DWORD PTR [rbp-8], 1<\/code>：目标地址 = rbp-8，数据线把 1 写入该单元；rbp、rsp、rax 都不变。\n<\/li><li>\n<code>add DWORD PTR [rbp-8], 3<\/code>：先按地址 rbp-8 读出 a 的值进临时寄存器，加 3，再写回同一单元；rsp 不变。\n<\/li><li>\n<code>mov eax, [rbp-8]<\/code>：把单元值读进 rax 的低 32 位（eax），作为返回值。\n<\/li><li>\n<code>pop rbp<\/code>：从栈顶读出旧基准写回 rbp，rsp 加 8。\n<\/li><li>\n<code>ret<\/code>：栈顶返回地址送入 rip，rsp 再加 8，跳回主调被打断的位置。\n<\/ol>\n<h2>完整算例：栈帧布局表（自拟，按本书模型）<\/h2>\n<p>函数 f 一帧内，以 rbp 为基准的偏移：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>偏移<\/th><th>内容<\/th><th>谁写入<\/th><\/tr><\/thead><tbody><tr><td>rbp+8<\/td><td>返回地址<\/td><td>call 指令压入<\/td><\/tr><tr><td>rbp+0<\/td><td>保存的旧 rbp<\/td><td>push rbp 写入，pop rbp 读回<\/td><\/tr><tr><td>rbp-8<\/td><td>局部变量 a（int，4 字节）<\/td><td>mov/add 指令<\/td><\/tr><\/tbody><\/table><\/div>\n<p>偏移怎么算：返回地址在 call 时压栈，位于旧 rbp 之上（高地址方向）；旧 rbp 由序言保存；局部变量从 rbp-8 向下（低地址方向）逐个排。int 占 4 字节，本例 a 占 [rbp-8, rbp-5]，[rbp-4, rbp-1] 为对齐填充（自拟，具体填充随目标 ABI）。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“寄存器就是速度很快的内存”<\/strong>：反例——通用寄存器数量只有十几个量级，放不下的临时值仍要落内存；寄存器不能按编号随机索引，和可按地址访问的内存不是一回事。\n<\/li><li>\n<strong>“地址就是普通数值，可以随便参与运算”<\/strong>：反例——地址是访存坐标，x86 不支持裸地址直接作操作数；对未映射地址解引用会触发段错误。\n<\/li><li>\n<strong>“rax 改了，别的寄存器会跟着变”<\/strong>：反例——各寄存器独立存储；写 eax 只覆盖 rax 低 32 位，按 x86-64 约定高 32 位清零，不会牵连 rbp、rsp。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n读写内存前为什么先走地址信号线？（答案：地址定位到具体单元，数据线才知道往哪落、从哪取。）\n<\/ol><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.24<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">寄存器与内存地址<\/a><\/span><\/div><h1>汇编指令与栈帧雏形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>问题<\/h2>\n<p>一条 <code>a += 2<\/code> 在机器上到底变成哪几步？为什么本书说不必精通汇编，却要能读懂这些指令的内存动作？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n函数在汇编层面由 push、mov、add、pop、ret 等指令构成。\n<\/li><li>\npush 保存旧栈帧并让栈顶向低地址生长；pop 是 push 的反向操作。\n<\/li><li>\nmov 负责把数值写入内存，或把内存值读进寄存器。\n<\/li><li>\nadd 先读出目标值、做加法，再把结果写回原地址。\n<\/li><li>\nret 把栈顶返回地址送入 rip，CPU 跳回主调函数被打断的位置。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 1.3 节用自加函数 test() 逐条对照：<\/p>\n<pre class=\"lang-c\"><code>long test()\n{\n    long a = 11;\n    a += 2;\n    return a;\n}<\/code><\/pre>\n<ol><li>\n<code>push rbp<\/code>：先把 rbp 的值存放到 rsp 指向的内存下方，再让 rsp 减 8（64 位下一个存储单元 8 字节），栈向低地址生长。\n<\/li><li>\n<code>mov rbp, rsp<\/code>：栈帧基准线对齐到栈顶，主调栈帧保护完成。\n<\/li><li>\n<code>mov QWORD PTR [rbp-8], 1<\/code>：把 1 写入变量 a 的内存，对应 C 写法 <code>*(rbp - 8) = 1<\/code>；QWORD 指明数值占 8 字节。\n<\/li><li>\n<code>add QWORD PTR [rbp-8], 2<\/code>：先用 * 读出 a 的值，与 2 相加，再把结果写回同一地址。\n<\/li><li>\n<code>mov rax, [rbp-8]<\/code>：把内存里的最终值读进 rax，作为函数返回值。\n<\/li><li>\n<code>pop rbp<\/code>：把栈顶值还给 rbp，恢复旧基准；<code>ret<\/code> 按返回地址跳回调用处。除返回值 rax 外，其余寄存器都恢复到调用前状态。\n<\/ol>\n<p>本书统计观察：一次简单 +2 至少伴随 5 次内存读写，内存读写在 CPU 工作负荷中占比很高；这也是后面所有章节反复回到“寄存器—内存”搬数动作的背景。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n指令读法以本书 x86-64 示例为准；指令名在其他汇编语法下可能不同，但“序言保护基准、分配局部空间、结语恢复返回”的骨架通用。\n<\/li><li>\n栈帧雏形只覆盖单函数内的指令动作；参数传递、完整栈帧布局在第 3 章展开。\n<\/li><li>\n条件去掉会怎样：如果序言不保存旧 rbp，函数返回后主调基准丢失；如果结语不恢复 rsp，栈顶水位无法归还。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：看到 push 就以为只是“存个数”，忽略 rsp 同步减 8；栈顶水位不更新，后续写入会踩错单元。\n<\/li><li>\n反例二：把 add 当成只写不读；实际上 add 必须先读原值，否则加法没有输入。\n<\/li><li>\n反例三：以为函数返回后寄存器是随机垃圾值；保护/恢复成对出现，除返回值外都回到调用前。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\npush vs pop：方向相反，push 压入并减栈顶，pop 弹出并升栈顶。\n<\/li><li>\nmov 读 vs mov 写：<code>mov 寄存器, [地址]<\/code> 是内存读进寄存器；<code>mov [地址], 数值<\/code> 是写入内存。\n<\/li><li>\n汇编指令 vs 高级语句：一条高级语句常拆成多条指令，指令是动作，语句是意图。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：寄存器与内存地址。\n<\/li><li>\n后置：参数传递与栈帧（序言/结语的完整版）、堆与栈的区别。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（汇编指令与栈帧雏形）<\/summary><div class=\"depth-body\"><h1>汇编指令与栈帧雏形 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要看懂 push、mov、add、pop、ret 这组指令，先得会：寄存器分工（rax 装数值、rbp/rsp 装地址）；栈向低地址生长；函数调用结束要回到主调打断点。再往前需要理解：高级语句是意图，汇编指令是拆出来的动作。如果不先建立“序言保护基准、结语恢复现场”的骨架，单看每条指令会觉得零散。<\/p>\n<h2>正向推导<\/h2>\n<p>以本书自加函数为蓝本推演：<\/p>\n<pre class=\"lang-c\"><code>long test()\n{\n    long a = 11;\n    a += 2;\n    return a;\n}<\/code><\/pre>\n<p>第一步进入函数：<code>push rbp<\/code> 包含两个微操作。先把 rbp 的值存放到 rsp 指向的内存下方，再让 rsp 减 8。64 位下一个存储单元 8 字节，栈向低地址生长，所以压栈后栈顶水位下降。第二步 <code>mov rbp, rsp<\/code> 把栈帧基准线对齐到当前栈顶，主调栈帧保护完成。<\/p>\n<p>第三步赋值：<code>mov QWORD PTR [rbp-8], 1<\/code> 把 1 写入 a 所在内存，对应 C 写法 <code><em>(rbp - 8) = 1<\/code>。QWORD 指明这次写入占 8 字节。第四步自加：<code>add QWORD PTR [rbp-8], 2<\/code> 先按 <\/em> 读出 a 的值，与 2 相加，再把结果写回同一地址；add 不是只写不读，它必须先有输入。第五步 <code>mov rax, [rbp-8]<\/code> 把内存最终值读进 rax，作为函数返回值。<\/p>\n<p>收尾阶段：<code>pop rbp<\/code> 是 push 的反向操作，把栈顶值还给 rbp，恢复旧基准；<code>ret<\/code> 把栈顶返回地址送入 rip，CPU 跳回主调被打断的位置。除返回值 rax 外，其余寄存器都恢复到调用前状态，就像函数没被调用过。<\/p>\n<p>本书统计观察：一次简单 +2 至少伴随 5 次内存读写，内存读写在 CPU 工作负荷中占比很高。这解释了为什么后续章节反复回到“寄存器—内存”搬数动作，而不是停在语法层。<\/p>\n<h2>算例<\/h2>\n<p>自拟栈帧字节推算：函数内定义两个 long 局部变量，每个 8 字节，局部区共 16 字节；加上 call 压入的返回地址 8 字节、序言保存的旧 rbp 8 字节，该函数完整栈帧至少 32 字节（不含对齐填充）。 自拟指令配对：push rbp 对应结语 pop rbp；mov rbp, rsp 建立基准；sub rsp, N 分配局部空间；ret 取返回地址跳回。把这几条按顺序排，就是一个最小可返回的函数骨架。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：看到 push 只当“存个数”，漏掉 rsp 同步减 8，栈顶水位不更新，后续写入踩错单元。反例二：
