<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>CPU眼里的C/C++（学习伴侣）</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>
<style id="zs-visual-theme">

  --font-body: "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;

  --accent-strong: #2f43c9;

  --accent3: #12805f;
  --accent-soft: #dbe4ff;
  --ok: #12805f;
  --bad: #c02a44;
  --warn: #9a5b00;
  --danger: #c02a44;
  --code-bg: #eef2f9;
  --dot: rgba(57, 80, 222, .10);
  --ink: #111827;
  --ink-2: #26324a;
  --ink-3: #5b6b86;

  --paper-2: #f9fbff;

  --line-soft: #dbe4f2;
}

html,
body {
  background-color: var(--bg) !important;
  color: var(--text) !important;
}

body {
  font-family: var(--font-body) !important;
  background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.2px);
  background-size: 26px 26px;

ptId": "c02"}, {"id": "q03", "chapterId": "ch02", "type": "single", "question": "按本书 2.2 节给出的类型宽度，short 类型数组相邻两个元素的内存地址间隔是多少字节？", "options": ["1 字节", "2 字节", "4 字节", "8 字节"], "answer": 1, "explain": "本书 2.2 节：int 占 4 字节、short 占 2 字节、char 占 1 字节，元素间隔等于自身类型宽度。", "relatedConceptId": "c03"}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "下列哪一类变量的内存地址在整个程序运行过程中固定不变？", "options": ["函数内的局部变量", "全局变量与静态变量", "每次递归新建的临时变量", "传值参数的栈上副本"], "answer": 1, "explain": "本书 2.2 节：全局变量和静态变量的地址编译完成后即固定；栈变量的地址会随程序运行而变化。", "relatedConceptId": "c03"}, {"id": "q05", "chapterId": "ch02", "type": "single", "question": "执行 *p = 2 时，第一步做什么？", "options": ["直接把 2 写入 p 自己的内存", "从 p 中读出目标地址，再按该地址写入 2", "先把 p 的值加 2", "把 2 压入栈顶"], "answer": 1, "explain": "本书 2.4 节：* 操作分两步——先取指针变量的值作为目标地址，再把数值写入该目标地址。", "relatedConceptId": "c04"}, {"id": "q06", "chapterId": "ch02", "type": "blank", "question": "数组作为函数参数传递时，编译器不会在栈上构建临时数组，而是传递数组的 ______。（填两个字：首地址）", "answer": "首地址", "explain": "本书 2.6 节：传数组参数本质是传递内存首地址，和传指针变量一样；函数内对数组元素的读写等价于指针的 * 操作。", "relatedConceptId": "c05"}, {"id": "q07", "chapterId": "ch02", "type": "single", "question": "本书 2.7 节的实验里，数组向高端越界后写入恶意函数地址，func1 不再回到 main，是因为改写了栈上的哪一项？", "options": ["局部变量 a 的初值", "保存的返回地址", "栈顶指针 rsp", "字符串常量"], "answer": 1, "explain": "本书 2.7、3.3 节：返回地址就在临时变量附近；越界改写返回地址后，ret 会按被篡改的地址跳走，CPU 转而执行恶意代码。", "relatedConceptId": "c05"}, {"id": "q08", "chapterId": "ch02", "type": "single", "question": "代码：char a = 0xff; if (a == 0xff)。按本书 2.10 节的分析，这段比较的结果与原因是？", "options": ["same，两边都是 0xff", "different：有符号 char 的 0xff 按补码解释为 -1，与无符号 255 不相等", "different：char 只能存正数", "same：编译器会自动把 0xff 改成 -1"], "answer": 1, "explain": "本书 2.10 节：char 是有符号数，最高位为 1 时表示负数，0xff 转成 int 是 -1（0xffffffff）；右边 0xff 转成 int 是 255（0x000000ff），二者不等。比较前应统一两边类型。", "relatedConceptId": "c03"}, {"id": "q09", "chapterId": "ch03", "type": "single", "question": "传值方式调用函数，在函数内部修改形参，外部实参的值会怎样？", "options": ["被一并修改", "不受影响，函数内改的是栈上副本", "视编译器而定", "只有 int 类型会被修改"], "answer": 1, "explain": "本书 3.1 节：传值时参数被拷贝到被调函数栈帧的形式参数位置，函数内改的是这个克隆体，本体（实参）不变。", "relatedConceptId": "c06"}, {"id": "q10", "chapterId": "ch03", "type": "blank", "question": "（自拟，按本书栈帧模型推算）x86-64 下函数内定义 long a[2]，仅算局部变量区，这个数组在栈上占用多少字节？", "answer": "16", "explain": "long 在 64 位示例宽度为 8 字节，两个元素共 16 字节；栈帧里另外还要留出返回地址与旧 rbp 的位置。题目数值为自拟，宽度依据本书 2.2、3.2 节。", "relatedConceptId": "c06"}, {"id": "q11", "chapterId": "ch03", "type": "single", "question": "关于堆和栈，下列哪条与本书 3.6 节一致？", "options": ["栈可被多个线程共享，栈上数据需要手动 free", "栈是线程私有的，堆内存可被多个线程访问", "堆随函数返回自动回收，栈需要手动 delete", "堆和栈的生长方向都是由高地址向低地址"], "answer": 1, "explain": "本书 3.6 节：栈由操作系统分配给每个线程私有；堆可被多个任务（线程）共享。栈随调用自动申请释放，堆要程序员手动申请释放；栈向低地址生长，堆向高地址生长。", "relatedConceptId": "c07"}, {"id": "q12", "chapterId": "ch04", "type": "single", "question": "普通成员函数在编译期就确定了 call 哪个地址；虚函数的被调位置在什么时候确定？", "options": ["编译链接期写死", "运行时按对象虚表中的指针查找", "预处理期确定", "由宏展开确定"], "answer": 1, "explain": "本书 4.3 节：普通成员函数是静态绑定，编译阶段即确定函数地址；虚函数调用只能根据寄存器（本书示例 rdx）中的虚表信息在运行时确定位置，即动态绑定。", "relatedConceptId": "c08"}, {"id": "q13", "chapterId": "ch04", "type": "single", "question": "x86 上的小端序是指什么？", "options": ["数值的高位字节存低地址", "数值的低位字节存低地址", "字符串按倒序存放", "地址从大到小编号"], "answer": 1, "explain": "本书 5.7 节：CPU 把数值的低位字节写在内存低地址、高位字节写在高地址，这就是小端模式；所以把长整数按字节当字符串打印会得到倒序字符。", "relatedConceptId": "c09"}, {"id": "q14", "chapterId": "ch04", "type": "blank", "question": "按本书 6.1 节的观察，函数内定义的 static 变量与哪一类变量处在同一块数据区域？（填两个字：全局）", "answer": "全局", "explain": "本书 6.1 节：静态变量与全局变量内存地址相互邻近，属于同一块数据区域；编译器只在作用域上限制静态变量的可见范围。", "relatedConceptId": "c10"}, {"id": "q15", "chapterId": "ch02", "type": "single", "question": "（自拟，依据本书 2.6 节的元素间隔）int *p 指向一个 int 数组，执行 p + 1 后，地址向前移动几个字节？", "options": ["1 字节", "2 字节", "4 字节", "8 字节"], "answer": 2, "explain": "指针加法按指向类型的宽度步进；int 在本书示例中占 4 字节，所以 p+1 前进 4 字节。题目为自拟练习，类型宽度依据本书 2.2 节。", "relatedConceptId": "c04"}, {"id": "q16", "chapterId": "ch04", "type": "single", "question": "本书 4.1 节中，对象调用成员函数时，this 指针（对象内存地址）通过哪个寄存器传入成员函数？", "options": ["rax", "rdi", "rsp", "rbp"], "answer": 1, "explain": "本书 4.1 节：调用成员函数与调用普通函数的 CPU 指令完全一致，对象把自己的内存地址即 this 指针通过 rdi 寄存器传给成员函数。", "relatedConceptId": "c08"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "栈的两个职责", "back": "记录函数返回地址；为临时变量提供内存空间", "tags": ["定义"]}, {"id": "f02", "chapterId": "ch01", "front": "push 的两个微操作", "back": "把寄存器值存到 rsp 指向的内存下方；rsp 减 8（向低地址生长）", "tags": ["指令"]}, {"id": "f03", "chapterId": "ch02", "front": "变量与地址的关系", "back": "变量名是内存地址的别名，类型决定该变量占用的内存长度", "tags": ["定义"]}, {"id": "f04", "chapterId": "ch02", "front": "64 位下指针变量宽度", "back": "8 字节；各种类型指针在同一 CPU 上宽度一致，因为都存内存地址", "tags": ["数值"]}, {"id": "f05", "chapterId": "ch02", "front": "数组传参的本质", "back": "传递数组首地址（指针），不在栈上构建临时数组；多维数组本质也是一维连续内存", "tags": ["规则"]}, {"id": "f06", "chapterId": "ch02", "front": "引用在 CPU 眼里是什么", "back": "与指针实现完全相同；可理解为不能改绑的指针常量", "tags": ["本质"]}, {"id": "f07", "chapterId": "ch03", "front": "call 指令做两件事", "back": "把下一条指令地址（返回地址）压入栈；跳转到被调函数首地址", "tags": ["指令"]}, {"id": "f08", "chapterId": "ch03", "front": "栈的生长方向", "back": "由高地址向低地址；递归越深，局部变量地址逐层降低", "tags": ["规则"]}, {"id": "f09", "chapterId": "ch03", "front": "堆的生长方向", "back": "由低地址向高地址；申请释放由程序员手动完成，多次分配释放后可能出现内存碎片", "tags": ["规则"]}, {"id": "f10", "chapterId": "ch04", "front": "静态绑定 vs 动态绑定", "back": "普通成员函数编译期 call 定址；虚函数运行时按虚表指针查函数位置", "tags": ["对比"]}, {"id": "f11", "chapterId": "ch04", "front": "小端序", "back": "低位字节存低地址，高位字节存高地址（x86）", "tags": ["定义"]}, {"id": "f12", "chapterId": "ch04", "front": "虚拟内存靠什么落到物理内存", "back": "MMU 配合操作系统完成虚拟地址到物理地址的映射，对程序员无感", "tags": ["原理"]}]}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.13<\/div><h1>第 1 章：预备知识——CPU 眼里的程序运行与汇编语言<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：会写最简单的 main 函数\n<\/li><li>\n<strong>对应原书<\/strong>：第 1 章 预备知识（1.1 工具介绍、1.2 CPU 眼里的程序运行、1.3 CPU 眼里的汇编语言）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清从源码到可执行文件再到 CPU 执行的大致链路；\n<\/li><li>\n认出 rax、rbp、rsp 三类寄存器各自存什么；\n<\/li><li>\n读懂 push、mov、add、pop 背后对应的内存读写动作。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>CPU 不懂 C/C++ 的语法规则，它只认寄存器读写和内存读写；高级语言里那些“复杂语法”，落到机器层面都是几条简单指令的组合。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：寄存器与内存地址<\/h3>\n<p>本书 1.2 节先做了一个对照实验：定义全局变量 a、局部变量 b、再 malloc 一段内存赋给 c，打印三者和 main 函数的地址。三个变量虽然在源码里连续定义，内存地址却相隔很远，因为它们分别存放在不同的内存区域。<\/p>\n<p>内存上有两类重要信号线：数据信号线负责在 CPU 和内存之间传递读写的内容；地址信号线负责指明要读写哪一块内存。在读写任何数据之前，必须先给出内存地址——地址是一切内存读写的前提。指针变量专门用来保存这种内存地址。<\/p>\n<p>寄存器层面，本书示例把寄存器分成两类：rax 这类一般存放数值，相当于 C 语言里的普通变量；rbp、rsp 这类存放内存地址，相当于指针变量。rsp 标识栈顶位置，rbp 标识当前栈帧的基准位置。<\/p>\n<h3>概念 2：汇编指令与栈帧雏形<\/h3>\n<p>本书 1.3 节用一个自加函数 test() 跟踪汇编：函数进入时先执行 push rbp，它包含两个微操作——先把 rbp 的值存放到 rsp 指向的内存下方，再让 rsp 减 8，向低地址方向生长；随后 mov rbp, rsp 把栈帧基准线对齐到栈顶。<\/p>\n<p>接下来的 mov 指令把数值 1 写入变量 a 所在内存，对应 C 语言写法 <code><em>(rbp - 8) = 1<\/code>；add 指令先通过 <\/em> 读出 a 的值、加 2，再把结果写回原地址；<code>rax = *(rbp - 8)<\/code> 则是把内存值读进寄存器。函数结束时 pop 是 push 的反向操作，把栈顶值还给 rbp，最后 ret 回到调用处。除了存放返回值的 rax，其余寄存器都恢复到调用前的状态。<\/p>\n<p>本书统计过一个粗略观察：一次简单的 +2 运算，至少伴随 5 次内存读写，内存读写占比很高；有观点认为 CPU 的内存读写占据约九成工作负荷。这也是理解后面所有章节的背景——变量、参数、对象，本质上都是在寄存器和内存之间搬数据。<\/p>\n<p>顺着执行时序推演：先推演序言如何搭起栈帧，再推演主体指令如何反复读写同一处内存，最后看结语如何把现场还原。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[C/C++ 源码] --&gt; B[编译器/汇编器]\nB --&gt; C[汇编指令]\nC --&gt; D[寄存器读写]\nC --&gt; E[内存读写]\nD --&gt; F[CPU 执行]\nE --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：源码经过编译变成汇编指令，汇编指令再拆成寄存器动作和内存动作；本书反复使用 Compiler Explorer 这类工具，把每行源码和右侧汇编指令一一对上。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：寄存器像 CPU 手边的工作台面，内存像仓库；台面位置少、取放快，仓库大但每次都要报地址取货。\n<\/li><li>\n实例（本书 1.1 节）：Compiler Explorer 可以把 C/C++ 源码翻译成汇编指令，也支持 RUST、GO、Swift、Python、Java 等语言的汇编或字节码查看；勾选“Compiler to binary”还能同时看到机器码和存放地址。\n<\/li><li>\n实例（本书 1.2 节）：编译出的可执行文件 a.out 里能找到对应的汇编指令，连源码中的字符串 &quot;password&quot; 也原样留在文件中。\n<\/ul>\n<h2>为什么<\/h2>\n<ul><li>\n<strong>为什么要从 CPU 视角回看语法<\/strong>：CPU 本身没有那么多语法规则，理解这些简单规则之后，才能客观还原程序运行原理，而不是背语法条文。\n<\/li><li>\n<strong>为什么必须有栈<\/strong>：线程通过调用函数运行，临时变量和函数返回地址都要有地方存放，栈就是为这两件事准备的内存结构。\n<\/li><li>\n<strong>为什么单独看每条汇编会觉得乏味<\/strong>：脱离编译器意图和源码上下文，指令只是孤立的搬数动作；要结合它服务的高级语言意图来读。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“学 C/C++ 必须先精通汇编”——本书明确说不要求读者熟悉或精通汇编，每条指令意义相对简单，结合源码大多能直接猜出。\n<\/li><li>\n别以为“普通变量操作跟指针无关”——在 CPU 眼里，万物皆有地址，普通变量的读写同样基于地址完成（详见第 2 章指针一节）。\n<\/li><li>\n别把 eax 和 rax 当成两个无关寄存器：eax 是 32 位寄存器名，rax 是对应的 64 位寄存器，eax 只是 rax 的低 32 位。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判断：rbp、rsp 用来存放内存地址，角色接近指针变量。（答案：是；本书 1.3 节。）\n<\/li><li>\npush rbp 之后 rsp 增大还是减小？（答案：减小 8，栈向低地址生长。）\n<\/li><li>\n函数返回后，除返回值寄存器外，其他寄存器为什么像没被调用过？（答案：序言/结语成对保护与恢复，rbp、rsp 等都回到调用前状态。）\n<\/ol>\n<h2>完整推导 1：从 <code>return 0;<\/code> 到三条汇编指令<\/h2>\n<ol><li>\n编译器先看源码意图：main 要把数值 0 作为函数返回值交回调用方。\n<\/li><li>\n返回值约定放在 rax，于是生成 <code>mov eax, 0<\/code>（64 位下即 rax 置 0）。\n<\/li><li>\n函数收尾要恢复主调现场：<code>pop rbp<\/code> 把旧栈帧基准还给 rbp。\n<\/li><li>\n最后 <code>ret<\/code>：栈顶返回地址送入 rip，CPU 跳回主调被打断的位置。\n<\/li><li>\n对照本书图 1-1：左边 <code>return 0;<\/code> 与右侧 <code>mov eax, 0 / pop rbp / ret<\/code> 一一对应；看不到任何“main 特殊待遇”的指令。\n<\/ol>\n<h2>完整推导 2：自加函数 <code>a += 2<\/code> 的内存读写链<\/h2>\n<ol><li>\n进入函数后 <code>push rbp<\/code> 保存主调基准，<code>mov rbp, rsp<\/code> 对齐新栈帧基准。\n<\/li><li>\n<code>mov QWORD PTR [rbp-8], 1<\/code>：把 1 写入 a 所在内存，对应 <code>*(rbp - 8) = 1<\/code>。\n<\/li><li>\n<code>add QWORD PTR [rbp-8], 2<\/code>：先按 * 读出 a 的值，与 2 做加法，再把结果写回同一地址。\n<\/li><li>\n<code>mov rax, [rbp-8]<\/code>：把内存里的最终值读进 rax 作返回值。\n<\/li><li>\n<code>pop rbp<\/code> 恢复基准，<code>ret<\/code> 返回；除 rax 外寄存器都回到调用前状态。\n<\/li><li>\n本书统计：这一次 +2 至少伴随 5 次内存读写，内存读写在 CPU 负荷中占比很高。\n<\/ol>\n<h2>反事实分析<\/h2>\n<ul><li>\n如果没有栈：函数返回地址和临时变量就没有统一存放位置，函数调用结束后无法找到回来的路，临时变量也无处安放。栈正是为“记返回地址 + 存临时变量”这两件事准备的。\n<\/li><li>\n如果 CPU 可以直接拿裸地址访问内存：指令集就不需要寄存器配合方括号的间接寻址；本书 2.2 节指出 x86 必须通过寄存器间接访问内存，这条限制决定了后续所有指针操作的汇编形态。\n<\/li><li>\n如果不需要保护现场：函数嵌套调用时 rbp、rsp 会互相覆盖，返回后主调函数的栈帧基准就找不回来。\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n地址是内存读写的前提；指针变量保存地址。\n<\/li><li>\nrax 放数值，rbp/rsp 放栈上地址。\n<\/li><li>\npush 存值并减 8，pop 反向恢复；mov 读写内存，add 先读后写。\n<\/ul>", "kind": "chapter", "title": "第 1 章：预备知识——CPU 眼里的程序运行与汇编语言"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.32<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：预备知识——CPU 眼里的程序运行与汇编语言<\/a><\/span><\/div><h1>第 2 章：基础语法——变量、流程控制、指针与数组在内存里的样子<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章寄存器与汇编基础\n<\/li><li>\n<strong>对应原书<\/strong>：第 2 章 基础语法（2.1 main、2.2 变量、2.3 goto/if else、2.4 指针变量、2.5 指针本质和风险、2.6 数组、2.7 数组越界、2.8 引用、2.9 i++ 与 ++i、2.10 类型转换）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n解释变量、类型宽度与内存地址的关系；\n<\/li><li>\n把指针的 * 操作拆成“取地址—读写目标地址”两步；\n<\/li><li>\n说清数组传参的本质、数组越界会改写什么，以及有符号/无符号比较为什么会出争议。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>在 CPU 眼里，变量是内存地址的别名，指针存的是地址，数组是一段连续内存；流程控制最后都落到跳转指令，而越界和类型争议都是在内存层面露出的马脚。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：变量与类型宽度<\/h3>\n<p>本书 2.1 节先对比了 main 函数和一个普通函数：二者汇编指令完全相同。main 之所以是程序起点，是系统启动链路默认指定了它；用 GCC 的 <code>-efunc<\/code> 选项可以把起点改成任意函数，嵌入式平台做完堆栈、中断向量表和硬件初始化后再跳转到应用入口，入口名也可以改。<\/p>\n<p>2.2 节把变量落到内存：每个变量对应一个内存地址，变量类型决定它占用内存的长度。本书示例中 int 占 4 字节、short 占 2 字节、char 占 1 字节。CPU（x86 为例）不能直接拿裸地址访问内存，要通过寄存器配合方括号间接访问；rip 存放下一条指令的地址，全局/静态变量的偏移量在编译后固定，所以它们地址不变；栈变量的地址则随程序运行变化。<\/p>\n<h3>概念 2：指针与引用的本质<\/h3>\n<p>2.4 节比较了普通变量、char<em>、short<\/em>、数组指针、指针的指针：对指针变量的读写操作，汇编上跟普通变量没有区别；所谓“指向”，描述的是指针里存的值是某个内存地址。64 位 CPU 上一个内存地址占 8 字节，所以各类指针变量宽度都是 8 字节。<\/p>\n<p>对指针做 <em> 操作分两步：先锁定目标地址，把指针变量的值读出来作为目标地址；再把数值写入（或读出）这个目标地址。2.5 节进一步指出：指针操作不是指针变量的专利，普通变量甚至立即数都可以做指针操作；只要知道变量地址，就能 <code><\/em>(int*)&amp;a = 1<\/code> 这样直接赋值。类对象的 <code>.<\/code> 操作和 <code>-&gt;<\/code> 操作，本质上也是同一套地址读写。<\/p>\n<p>2.8 节对比引用和指针：两者汇编指令完全相同，读改写引用变量，实际就是在读写对应的指针。语法层面的区别主要有四条：引用写法更简洁、不用加 *；引用不能赋 NULL；引用不能改绑到另一个变量；不存在“引用的引用”。本书把引用总结为指针常量一类的机制。<\/p>\n<h3>概念 3：数组与数组越界<\/h3>\n<p>2.6 节：数组是一段连续内存，int 数组元素间隔 4 字节，char 数组间隔 1 字节。数组作为参数传递时，编译器不会在栈上构建一个相同大小的临时数组，而是简单传递首地址，跟传指针一样；函数内改数组元素会影响外部数组。一维、二维、三维数组在 CPU 眼里都是一维连续内存，只是索引方式不同。<\/p>\n<p>2.7 节用实验看越界：向低地址方向越界，若越界区域是“无主之地”，程序暂时可能正常；向高地址方向越界，栈上方保存着主调函数的栈帧和返回地址。本书实验把数组第 3 个元素写成恶意函数地址后，func1 返回时不再回到 main，而是跳去执行恶意代码。即使不写地址、只写非法数值，CPU 跳到不存在合法指令的内存处，也容易触发 Segmentation Fault。strcpy、strcat、memcpy、memmove 以及按下标写全局数组，都是越界重灾区。<\/p>\n<p>2.10 节的类型转换陷阱：<code>char a = 0xff;<\/code> 中 a 是有符号数，最高位为 1，按补码表示的是 -1；与右边无符号 0xff 比较前要先统一类型，-1（0xffffffff）不等于 255（0x000000ff），输出 different。补码下同一个二进制串既可解释成负数、也可解释成大正数，规避办法是比较前统一两边类型。<\/p>\n<p>顺着补码规则推演：先推演最高位如何决定符号，再推演类型统一后两个字面量怎么变成不同整数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\nA[变量名] --&gt; B[内存地址别名]\nB --&gt; C{类型决定宽度}\nD[指针变量] --&gt; E[保存内存地址]\nE --&gt; F[* 操作: 取地址再读写]\nG[数组] --&gt; H[连续内存]\nH --&gt; I[传参只传首地址]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：变量、指针、数组三条线最后都汇到“地址 + 读写动作”，差异只在保存的内容和访问方式。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：变量名像收货人名，地址才是仓库坐标；指针就是写着坐标的纸条，照着纸条才能找到货架。\n<\/li><li>\n实例（本书 2.3 节）：for 循环、while、if…else、switch 编译后都落到 jmp、jle、jne 这类跳转指令；jmp 改变程序执行位置，条件跳转根据前面 cmp 的结果决定跳不跳。Linux 内核里检查到参数异常或返回值错误时，常用 goto 跳到统一的 error 处理段。\n<\/li><li>\n实例（本书 2.9 节）：单独执行 ++i 和 i++，汇编完全相同；当表达式要取用自加前/后的值时，前加（++i）对应指令更少，后加（i++）要多保留一份旧值。\n<\/li><li>\n自拟练习：int 指针 p 指向 int 数组，p+1 前进 4 字节；char 指针 q 前进 1 字节。指针步进按指向类型的宽度计算。\n<\/ul>\n<h2>为什么<\/h2>\n<ul><li>\n<strong>为什么局部变量地址会变、全局变量地址不变<\/strong>：全局/静态变量在编译后的二进制数据段里位置固定；栈变量随每次函数调用在栈帧里分配，栈帧位置一动，地址就跟着动。\n<\/li><li>\n<strong>为什么指针给变量多了一个读写渠道<\/strong>：变量名读写走编译器规定的路径，指针读写直接按地址来；渠道多了，出 bug 时就不容易定位。\n<\/li><li>\n<strong>为什么越界有时不崩、有时立刻崩<\/strong>：越界写到空闲内存暂时不影响别人；一旦写到返回地址、栈帧基准这类关键数据，控制流就被篡改，崩溃或劫持只是早晚。\n<\/li><li>\n<strong>为什么有符号比较容易出隐蔽 bug<\/strong>：日常多用正数比较，编译器警告常被忽略；补码的二义性只有在碰到 0xff 这类最高位为 1 的串时才暴露。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“指针是 C 语言独有的特殊机制”——本书指出普通变量读写本质也是基于地址，指针只是把地址显式拿出来操作。\n<\/li><li>\n别以为“引用和指针是两套底层实现”——汇编层面二者完全相同，差别主要在语法约束上。\n<\/li><li>\n别以为“二维数组在内存里排成表格”——内存条是一维的，多维数组只是按索引规则折成一维存放。\n<\/li><li>\n别以为“数组传参会复制整个数组”——传的只是首地址，函数内改动会落到原数组上。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n64 位 CPU 上 char<em>、int<\/em>、int** 各占几字节？（答案：都是 8 字节，都存内存地址。）\n<\/li><li>\n数组作参数传递时栈上会建临时数组吗？（答案：不会，只传首地址。）\n<\/li><li>\n<code>char a = 0xff;<\/code> 按有符号补码，a 解释成多少？（答案：-1；与无符号 255 比较不相等。）\n<\/li><li>\n引用和指针在汇编层面有区别吗？（答案：没有，完全相同；区别在语法层。）\n<\/ol>\n<h2>完整推导 1：<code>*p = 2<\/code> 的两步内存动作<\/h2>\n<ol><li>\n定义 <code>int* p = &amp;a;<\/code>：把变量 a 的内存地址（本书示例 0x1234）写入 p 自己所在的内存（0x1238）。\n<\/li><li>\n执行 <code>*p = 2<\/code> 第一步：锁定目标地址，从 p 所在内存读出 0x1234，这就是要读写的目标位置。\n<\/li><li>\n第二步：把数值 2 写入 0x1234 指向的内存，即改写变量 a。\n<\/li><li>\n对照本书图 2-18 至 2-21：先画地址栏与值栏，再看 p 里存的是地址、* 操作沿地址落到目标单元。\n<\/li><li>\n反向操作 <code>rax = *p<\/code> 按同样方式：先读目标地址的值，再搬进寄存器。\n<\/ol>\n<h2>完整推导 2：<code>char a = 0xff; a == 0xff<\/code> 为什么输出 different<\/h2>\n<ol><li>\n左侧 a 是有符号 char，二进制 0xff 最高位为 1，按补码规则表示负数 -1。\n<\/li><li>\n比较前先统一类型：a 转成 int 后是 0xffffffff，即 -1。\n<\/li><li>\n右侧 0xff 是无符号 int 字面量，转成 int 是 0x000000ff，即 255。\n<\/li><li>\n比较 -1 与 255，二者不相等，所以输出 different。\n<\/li><li>\n规避办法：比较前把两边类型统一，例如写成 <code>(unsigned char)a == 0xff<\/code>，或把右边也转成 char。补码下同一个二进制串既可解释成负数、也可解释成大正数，这是争议来源。\n<\/ol>\n<h2>反事实分析<\/h2>\n<ul><li>\n如果数组传参时复制整个数组：大数组每次调用都要在栈上拷贝一份，栈空间和拷贝开销都难以承受；本书 2.6 节的做法是只传首地址，函数内读写直接落回原数组。\n<\/li><li>\n如果引用在底层是另一套实现：引用参数就需要独立于指针的传递约定；本书 2.8 节对照汇编发现两者指令完全相同，引用只是语法层的别名约束。\n<\/li><li>\n如果有符号/无符号比较前不做类型统一：补码二义性会一直留在代码里，日常正数比较掩盖问题，碰到最高位为 1 的数值才暴露。\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n变量 = 地址别名；类型决定宽度；全局/静态地址固定，栈地址随运行变化。\n<\/li><li>\n* 操作两步：取指针值作目标地址，再读写该地址。\n<\/li><li>\n数组连续存放，传参传首地址；高端越界改写返回地址最危险。\n<\/li><li>\n补码二进制有正负二义性，比较前先统一类型。\n<\/ul>", "kind": "chapter", "title": "第 2 章：基础语法——变量、流程控制、指针与数组在内存里的样子"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.76<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：基础语法——变量、流程控制、指针与数组在内存里的样子<\/a><\/span><\/div><h1>第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 2 章变量、指针与数组\n<\/li><li>\n<strong>对应原书<\/strong>：第 3 章 函数原理（3.1 参数传递、3.2 函数括号 {}、3.3 调用和返回、3.4 函数指针、3.5 函数返回值、3.6 堆和栈、3.7 函数实验回溯函数调用关系）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清传值、传指针、传引用在寄存器层面的相同与不同；\n<\/li><li>\n按 call、push、mov、sub、pop、ret 复述一次函数调用往返；\n<\/li><li>\n区分栈与堆的归属、生长方向、分配释放方式和故障形态。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>函数调用就是主调函数把数值送进寄存器、被调函数在自己的栈帧里干活，再靠栈上的返回地址跳回去；栈随调用自动伸缩，堆要手动申请释放。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：参数传递与栈帧<\/h3>\n<p>本书 3.1 节对比两类函数：形参为数值型的 func1(long x, long y, long z)，和形参为指针型的 func2(long<em> x, long<\/em> y, long* z)。调用前，参数通过 mov 指令送进寄存器——本书示例用 rdi、rsi、rdx（低 32 位对应 edi、esi、edx）。传值时送进去的是变量的值；传指针时送进去的是变量的内存地址。<\/p>\n<p>进入被调函数后，寄存器还要留作他用，所以参数先被拷贝到栈帧里，对应地址是 [rbp-8]、[rbp-16]、[rbp-24]，也就是形式参数（参数克隆体）。传值方式下，函数内改的是这个克隆体，外部实参不受影响；传指针时，栈里存的是外部变量地址，* 操作顺着地址写回本体，外部变量就被改掉。传引用在生成代码上和传指针完全相同，属于语法糖。参数复杂到寄存器装不下时，会改用堆栈传递载体，但工作原理一致。<\/p>\n<p>3.2 节拆函数括号 {}：序言先是 push rbp 保存主调栈帧基准，再 mov rbp, rsp 让基准线对齐栈顶；随后 sub 指令抬高（本书图示为下压）栈顶，给局部变量分配空间。本书 msvc 示例里两个 int 局部变量相对基准线的偏移分别是 4 和 8。结语把栈顶降回基准线，pop rbp 恢复旧基准，再 ret。<\/p>\n<p>3.3 节跟完整往返：call 指令做两件事——把下一条指令地址（返回地址 0x401105e 这类）压入栈，再跳转到被调函数首地址。函数结束时 pop rbp 恢复基准，ret 把栈顶返回地址传给 rip，CPU 跳回主调被打断的位置，栈帧干干净净归还。<\/p>\n<p>顺着一次往返推演：先推演 call 如何在栈上留下归路，再推演 ret 如何按归路跳回主调被打断的位置。<\/p>\n<h3>概念 2：堆与栈的区别<\/h3>\n<p>3.6 节先厘清命名：stack 译“栈”，heap 译“堆”，二者不是一回事。<\/p>\n<p>栈由操作系统分配给每个任务（线程）私有：主线程一个栈，新建线程也会得到一块同等大小的栈内存。栈上记录函数返回地址、提供临时变量空间；函数调用时申请栈内存，返回时释放，只需移动 rsp，往往一条指令完成。递归调用时局部变量地址逐层降低，验证栈由高地址向低地址生长；本书递归示例中每个变量 a 的地址间隔固定为 32（0x20）字节。<\/p>\n<p>堆同样由操作系统提供，但空间通常大得多，用来存放较大的数据。堆的使用是显式的：malloc、calloc、realloc 或 new 申请，free 或 delete 释放；申请到的块可以被多个线程访问。堆由低地址向高地址生长；malloc/free 本身是复杂的管理函数，多次分配释放后大块完整堆内存会变得支离破碎，即内存碎片。忘记 free 就是内存泄漏，本书比作“借债不还”。<\/p>\n<p>栈空间一般较小，递归过深或栈上分配过大就会爆栈（stack overflow）；堆内存空间大，但分配释放要程序员自己安排。没有操作系统的环境里，堆和栈都要程序员手动划分。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">sequenceDiagram\nparticipant M as 主调 main\nparticipant R as 返回地址(栈)\nparticipant F as 被调 func\nM-&gt;&gt;F: call: 压入返回地址, 跳转首地址\nF-&gt;&gt;F: push rbp; mov rbp,rsp; sub rsp,N 建栈帧\nF-&gt;&gt;F: 读写形参副本与局部变量\nF-&gt;&gt;R: pop rbp 恢复基准\nR-&gt;&gt;M: ret: 返回地址送入 rip, 跳回打断点<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：调用与返回成对出现，栈上的返回地址是回主调函数的唯一凭据。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：栈像餐厅翻台的托盘，上一道菜收一张，进出自动；堆像自助仓库，自己登记取件、用完归还，忘了登记就一直占着。\n<\/li><li>\n实例（本书 3.1 节）：func1(1, 2, 3) 直接把常量送寄存器；func1(a, b, c) 要先读变量值再送寄存器，效果相同。\n<\/li><li>\n实例（本书 3.6 节）：两个线程调用同一个 func，函数内局部变量 a 分别存在各自线程的栈里，互不干扰；若 a 是 static，就另当别论（见第 4 章存储期一节）。\n<\/li><li>\n补充说明：函数指针保存的是函数代码的内存地址，调用它和调用普通函数走同一套 call/ret 流程；本书 3.4、3.5 节分别展开函数指针与返回值的接收方式。\n<\/ul>\n<h2>为什么<\/h2>\n<ul><li>\n<strong>为什么传值改不动外部变量<\/strong>：形参在被调栈帧里是独立副本，本体在主调栈帧，两个位置不重叠。\n<\/li><li>\n<strong>为什么返回地址必须存在栈上<\/strong>：call 之后 CPU 要记得回来找哪条指令，这个“归路”只能随调用现场一起保存；它离临时变量近，既是设计简洁的来源，也是安全隐患。\n<\/li><li>\n<strong>为什么栈效率高、堆慢<\/strong>：栈的申请释放只是移动 rsp，编译器高度优化；堆每次要经过管理函数查找、切分、合并块，开销和碎片都来自这里。\n<\/li><li>\n<strong>为什么深递归会爆栈<\/strong>：每深入一层就压一帧，栈空间有上限，递归深度超过上限就耗尽栈内存。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“传引用是第三种传递机制”——CPU 层面和传指针相同，只是语法约束不同。\n<\/li><li>\n别以为“堆和栈都是自动回收”——栈随函数返回自动回收，堆必须显式释放。\n<\/li><li>\n别以为“同一函数里的局部变量会被所有调用共享”——非 static 局部变量在各自栈帧里，线程间、调用间互不影响。\n<\/li><li>\n别把数据结构书里讲的“堆（优先队列）”和这里的 heap 混为一谈，二者原理相通但使用场景不同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n传指针为什么能改外部变量？（答案：栈里存的是外部变量地址，* 操作按地址写回本体。）\n<\/li><li>\ncall 指令的两个动作是什么？（答案：压入返回地址；跳转到函数首地址。）\n<\/li><li>\n栈和堆各自的生长方向？（答案：栈高地址→低地址；堆低地址→高地址。）\n<\/li><li>\n内存泄漏对应本书的什么比喻？（答案：借债不还，malloc 后忘记 free。）\n<\/ol>\n<h2>完整推导 1：一次函数调用的栈帧往返<\/h2>\n<ol><li>\n主调执行 <code>call func<\/code>：先把下一条指令地址（返回地址，本书示例 0x401105e）压入栈，再跳转到 func 首地址。\n<\/li><li>\n被调序言：<code>push rbp<\/code> 把主调 rbp 存到栈顶下方，rsp 减 8；<code>mov rbp, rsp<\/code> 让基准线对齐栈顶。\n<\/li><li>\n<code>sub rsp, N<\/code> 下压栈顶，为局部变量分配空间；本书 msvc 示例两个 int 局部变量相对基准偏移 4 和 8。\n<\/li><li>\n函数体读写形参副本与局部变量；结语 <code>mov esp, ebp<\/code>（等价把栈顶降回基准），<code>pop rbp<\/code> 恢复旧基准。\n<\/li><li>\n<code>ret<\/code> 把栈顶返回地址送入 rip，CPU 跳回主调被打断的位置，栈帧归还，不增不减。\n<\/ol>\n<h2>完整推导 2：传值与传指针为什么结果不同<\/h2>\n<ol><li>\n调用 func1(a, b, c)：参数 1、2、3 经 mov 送进 rdi、rsi、rdx，再拷进被调栈帧 [rbp-8]、[rbp-16]、[rbp-24]，这是形参克隆体。\n<\/li><li>\n函数内改克隆体：只动栈帧副本，主调栈帧里的本体没有触碰，返回后外部实参不变。\n<\/li><li>\n调用 func2(&amp;a, &amp;b, &amp;c)：寄存器里送的是外部变量地址；栈帧副本保存这些地址。\n<\/li><li>\n<code>*x = 0<\/code>：先从副本读出外部地址，再按地址写回本体，外部变量被改掉。\n<\/li><li>\n传引用生成的指令与传指针一致；差别只在语法约束，不在机器动作。\n<\/ol>\n<h2>反事实分析<\/h2>\n<ul><li>\n如果返回地址不压栈：函数执行完无法知道回到主调哪一条指令，调用链就断了；call 把返回地址留在栈上，正是为 ret 提供归路。\n<\/li><li>\n如果堆也随函数返回自动回收：就不需要 free/delete，也不会有内存泄漏；本书 3.6 节明确堆必须程序员手动申请释放，代价是碎片和泄漏都要自己管。\n<\/li><li>\n如果栈可以被多线程共享：一个线程的临时变量就会被别的线程踩到，线程间隔离无从谈起；栈因此按线程私有分配，各自记录返回地址和局部变量。\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\n参数先进 rdi/rsi/rdx，再拷进栈帧副本；传值改副本，传指针写本体。\n<\/li><li>\n栈帧：call 压返回地址 → push rbp → mov rbp,rsp → sub rsp 分配 → pop rbp → ret。\n<\/li><li>\n栈线程私有、自动伸缩、向低地址长；堆共享、手动管理、向高地址长，有碎片和泄漏。\n<\/ul>", "kind": "chapter", "title": "第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.120<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈<\/a><\/span><\/div><h1>第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 3 章函数与栈帧\n<\/li><li>\n<strong>对应原书<\/strong>：第 4 章 C++ 特性（4.1 this、4.2 构造函数、4.3 虚函数、4.4 多态、4.5 模板、4.6 malloc 和 new、4.7 依赖反转）；第 5 章 高级编程（5.1 虚拟内存、5.2 进程、5.3 地址映射、5.4 volatile、5.5 常量、5.6 系统调用、5.7 大端小端、5.8 上下文、5.9 锁）；第 6 章 面试挑战（6.1 static/global/local、6.2 数组和双重指针、6.3 指针为什么这么难、6.4 auto、6.5 thread_local、6.6 面试技巧）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 this 指针的隐式传参路径，区分静态绑定与动态绑定；\n<\/li><li>\n描述虚拟内存如何经 MMU 映射到物理内存，以及大小端的字节摆放；\n<\/li><li>\n区分全局、静态、局部变量的存储位置，知道线程局部存储解决什么问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>C++ 的对象特性没有发明新机器规则：this 是隐藏参数，虚函数多一层查表；进程看到的地址是虚拟地址，最终由 MMU 和操作系统映射到物理内存；存储期差异落到数据段、栈和堆的不同位置。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：对象模型——this 与虚函数<\/h3>\n<p>本书 4.1 节对比成员函数 mFunc 和普通函数 func：两者汇编指令完全相同。成员函数其实藏了一个默认参数——this 指针；调用成员函数时，对象把自己的内存地址通过 rdi 寄存器传给成员函数，这和调用带指针参数的普通函数没有区别。<\/p>\n<p>4.2 节：构造函数跟普通函数一样带隐形 this；派生类构造函数会先调用基类构造函数；含有虚函数的类，构造函数会把虚函数表地址记到对象里藏着的一个成员变量中，这个隐藏成员往往位于对象内存首地址处。<\/p>\n<p>4.3 节比较普通成员函数与虚函数：二者函数体都带 this 隐藏参数，差别在调用处。普通成员函数在编译阶段就确定 call 哪个函数地址，即静态绑定；虚函数的 call 只能根据寄存器（本书示例 rdx）里的值确定位置——运行时顺着对象里的虚表指针查到虚表，再取对应函数地址，即动态绑定。4.4 节的多态，落到机器层面就是同一套调用接口，按对象实际类型查到不同虚表项。<\/p>\n<h3>概念 2：虚拟内存与地址映射<\/h3>\n<p>5.1 节：程序打印出来的变量地址（如 0x7ffcd930e8fc）远超普通物理内存上限，它不是真实物理地址，而是虚拟内存地址。无论手机 App 还是 Hello World，都认为自己独占一套大地址空间：32 位 CPU 虚拟空间约 4GB，64 位 CPU 空间更大。<\/p>\n<p>虚拟内存建立在物理内存之上，为每个进程营造一套更庞大的地址空间。真实数据最终仍存在物理内存里，需要内存管理单元 MMU 和操作系统配合，完成虚拟地址到物理地址的映射；这种映射有硬件加持，对程序员无感，也不影响 CPU 运行效率。5.2、5.3 节在此基础上展开进程视角与地址映射过程。<\/p>\n<p>顺着访存链路推演：先推演虚拟地址如何送进 MMU 查表，再推演查表得到的物理地址如何落地读写 RAM。<\/p>\n<p>5.6 节系统调用：用户态代码运行在用户内存空间，执行 syscall 后 CPU 跳转到内核内存空间运行操作系统预设代码；内核态代码（操作、驱动程序）出错往往蓝屏崩溃，经过千锤百炼，用户态程序出错不会拖垮整个系统，这就是用户态与内核态隔离的意义。<\/p>\n<p>5.7 节大小端：x86 上把一个 8 字节长整按字符打印会得到倒序字符串。原因是 CPU 把数值低位字节写在低地址、高位字节写在高地址，这是小端模式；人书写习惯高位在前，对应大端模式。<\/p>\n<h3>概念 3：存储期——static、global 与 local<\/h3>\n<p>6.1 节定义全局变量 a、函数内静态变量 b 和 main 内局部变量 c：函数 func1 的汇编里对静态变量 b 没有任何初始化动作，因为它在编译期就已安排进数据段。打印地址可见，静态变量 b 和全局变量 a 内存地址相互邻近，属于同一块数据区域；编译器只在作用域上限制静态变量的可见范围。知道静态变量地址后，同样可以绕开作用域限制按地址读写。<\/p>\n<p>6.5 节 thread_local（线程局部存储）：修饰的变量每个线程各持一份拷贝，呼应 3.6 节线程私有栈的模型。6.2 节双重指针题中，字符串常量存在数据段，栈上一维数组 a 的三个元素分别存三个字符串首地址，64 位下每个地址 8 字节；<code>a[2][1]<\/code> 等价于 <code>*(a[2] + 1)<\/code>，数组 a 是一维数组，不是二维数组。<\/p>\n<p>第 5 章其余条目按目录对照：volatile 阻止编译器过度优化对特定内存的读写；常量在编译/链接阶段定型；上下文记录寄存器与栈状态，供切换线程时恢复；锁用于多线程共享数据时的互斥访问。这些概念在本书中均以 CPU 视角展开，可在通读本章后回原书对应小节查证。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[对象调用成员函数] --&gt; B[rdi 传入 this=对象地址]\nB --&gt; C{函数种类}\nC --&gt;|普通成员函数| D[编译期静态绑定 call 定址]\nC --&gt;|虚函数| E[运行时查虚表动态绑定]\nF[程序看到虚拟地址] --&gt; G[MMU + OS 映射]\nG --&gt; H[物理内存]\nI[全局/静态变量] --&gt; J[数据段, 地址固定]\nK[局部变量] --&gt; L[栈, 随调用伸缩]\nM[malloc/new 块] --&gt; N[堆, 手动释放]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：对象模型、地址映射、存储期三条线，最终都落到“哪个地址、哪段内存、什么时候释放”。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：this 像进房间时递给门卫的房牌号，成员函数靠这个号码找到是哪个对象在调用它。\n<\/li><li>\n实例（本书 4.1 节）：<code>A a; a.mFunc();<\/code> 与 <code>func((long*)&amp;a);<\/code> 生成的调用指令完全一致，传入的都是对象 a 的内存地址。\n<\/li><li>\n实例（本书 6.1 节）：全局变量 a 在 0x404030，静态变量 b 在 0x404034，相邻 4 字节，同处数据段。\n<\/li><li>\n补充说明：模板（4.5）在编译期按实参类型生成对应代码；malloc 与 new 的差别在于 new 会额外触发构造函数、delete 会触发析构函数，本书 4.6 节展开。\n<\/ul>\n<h2>为什么<\/h2>\n<ul><li>\n<strong>为什么 this 不像显式参数却必须存在<\/strong>：成员函数要区分“正在操作哪个对象”，对象地址总得有个传递路径；C++ 语法把它隐藏了，机器层面仍是一个普通参数。\n<\/li><li>\n<strong>为什么虚函数不能在编译期定死地址<\/strong>：基类指针可能指向派生类对象，具体类型要到运行时才确定，只能查虚表解析调用目标。\n<\/li><li>\n<strong>为什么要有虚拟内存<\/strong>：每个进程都以为独占一套大地址空间，进程间互不干扰；MMU 硬件映射让这种隔离对程序透明。\n<\/li><li>\n<strong>为什么静态变量不随函数调用重置<\/strong>：它不在栈帧里，而在数据段，函数返回后空间不回收，下次调用仍保留上次的值。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“成员函数和普通函数是两套调用机制”——汇编上只是多传了 this 这一个参数。\n<\/li><li>\n别以为“程序里的地址就是物理内存条上的位置”——那是虚拟地址，要经映射才落到物理内存。\n<\/li><li>\n别以为“static 变量存在栈上”——它和全局变量同在数据段，作用域限制是编译器给的，不是内存位置给的。\n<\/li><li>\n别把小端当成“字符串倒序存储”——字符串本身按顺序放，倒序观感来自多字节数值的字节摆放规则。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nthis 指针通过哪个寄存器传入成员函数？（答案：rdi，本书 4.1 节。）\n<\/li><li>\n静态绑定和动态绑定的区别？（答案：前者编译期 call 定址；后者运行时按虚表查函数位置。）\n<\/li><li>\n32 位 CPU 的虚拟地址空间约多大？（答案：4GB。）\n<\/li><li>\n函数内 static 变量和谁同处数据段？（答案：全局变量。）\n<\/ol>\n<h2>完整推导 1：成员调用的 this 传递与虚表查表<\/h2>\n<ol><li>\n<code>A a; a.mFunc();<\/code> 编译后与 <code>func((long*)&amp;a);<\/code> 的调用指令对照：两者都把对象 a 的内存地址送进 rdi。\n<\/li><li>\n这个地址就是 this 指针；成员函数体通过 this 找到当前操作的对象数据。\n<\/li><li>\n普通成员函数：编译阶段就确定 call 的目标函数地址，即静态绑定。\n<\/li><li>\n虚函数：call 只能依据寄存器（本书示例 rdx）中的值定位；运行时先读对象里的虚表指针，再到虚表中取对应函数地址，即动态绑定。\n<\/li><li>\n多态在机器层面就是同一调用接口，按对象实际类型查到不同虚表项；含虚函数的类，对象首地址附近藏有虚表指针成员。\n<\/ol>\n<h2>完整推导 2：虚拟地址到物理内存的映射<\/h2>\n<ol><li>\n程序打印变量地址得到 0x7ffcd930e8fc 这类值，它超出普通物理内存上限，是虚拟地址而非物理地址。\n<\/li><li>\n每个进程以为自己独占一套大地址空间：32 位 CPU 约 4GB，64 位 CPU 空间更大。\n<\/li><li>\nCPU 在这套虚拟地址上读写；真实数据最终仍落在物理 RAM。\n<\/li><li>\nMMU 硬件配合操作系统页表，把虚拟地址逐条映射到物理地址；映射有硬件加持，对程序员无感，也不拖慢 CPU。\n<\/li><li>\n系统调用是另一道边界：syscall 后 CPU 从用户内存空间跳到内核内存空间运行预设代码，用户态崩溃被隔离在内核之外。\n<\/ol>\n<h2>反事实分析<\/h2>\n<ul><li>\n如果虚函数也在编译期定址：基类指针指向哪个派生类对象就无法在运行时区分，多态的“同一接口不同实现”落不了地；动态绑定正是为类型要到运行时才确定而存在。\n<\/li><li>\n如果没有 MMU 和地址隔离：一个程序的野指针就能扫改整机内存，早期无 MMU 的单片机/DOS 环境确实可以这样做；现代系统靠虚拟内存把各进程关在各自地址空间里。\n<\/li><li>\n如果去掉 volatile 修饰：编译器可能把对特定内存的读写优化成寄存器缓存，不再每次访问原内存；本书 5.4 节用 volatile 阻止这类过度优化，条件去掉后硬件相关场景可能读到陈旧值。\n<\/ul>\n<h2>复习锚点<\/h2>\n<ul><li>\nthis = 对象地址，隐藏参数走 rdi；虚函数运行时查虚表。\n<\/li><li>\n虚拟地址经 MMU + OS 映射到物理内存；x86 是小端序。\n<\/li><li>\n全局/静态在数据段，局部在栈，堆上手动申请释放；thread_local 每线程一份。\n<\/ul>", "kind": "chapter", "title": "第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.23<\/div><h1>寄存器与内存地址<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>问题<\/h2>\n<p>写过程序的人都知道变量存在内存里，但 CPU 干活时先碰到的是寄存器。为什么本书要先区分“数值寄存器”和“地址寄存器”？内存地址在读写动作里扮演什么角色？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n寄存器是 CPU 内部的高速存储位置，容量很小、取放很快。\n<\/li><li>\n本书示例把寄存器分两类：rax 一类存放数值，角色接近 C 语言普通变量；rbp、rsp 一类存放内存地址，角色接近指针变量。\n<\/li><li>\n内存上有两类信号线：数据信号线传递读写内容，地址信号线指明读写哪一块内存。\n<\/li><li>\n任何内存读写之前，必须先给出地址；指针变量的用途就是保存这个内存地址。\n<\/li><li>\nrsp 标识栈顶位置，rbp 标识当前栈帧基准位置。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 1.2 节做对照实验：定义全局变量 a、局部变量 b，再 malloc 一段内存赋给 c，打印三者和 main 的地址。三个变量在源码里连续定义，内存地址却相隔很远，因为它们分属不同内存区域。这说明“变量名连续”不代表“内存连续”，决定位置的是存储区域。<\/p>\n<p>本书 1.3 节跟踪自加函数：函数进入时 push rbp，把 rbp 值存到 rsp 指向的内存下方，再让 rsp 减 8；mov rbp, rsp 把栈帧基准对齐栈顶。随后 mov、add 指令围绕 [rbp-8] 这类地址读写局部变量；<code>mov rax, [rbp-8]<\/code> 把内存值读进 rax 作返回值。整个过程里，rax 装数值，rbp/rsp 装栈上地址，两类寄存器分工清楚。<\/p>\n<p>补充一条寄存器命名关系：eax 是 32 位寄存器名，rax 是对应的 64 位寄存器，eax 只是 rax 的低 32 位，二者不是两个无关寄存器。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n上述分工以本书示例的 x86-64 调用约定为背景；不同架构（ARM、RISC-V）寄存器命名和传参寄存器不同，但“数值寄存器/地址寄存器”的区分思路通用。\n<\/li><li>\n地址是内存读写的前提，这条在任何有内存的架构上都成立；裸地址不能被 x86 指令直接访问，必须经寄存器配合方括号间接寻址。\n<\/li><li>\n条件去掉会怎样：如果读写前不给出地址，内存不知道往哪块单元写，数据信号线就没有落点。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：把 rbp 当成装数值的普通变量去做算术，就会破坏栈帧基准，后续局部变量寻址全部错位。\n<\/li><li>\n反例二：以为 CPU 可以直接写 <code>mov 0x1234, 1<\/code> 这类裸地址指令；本书 2.2 节指出 x86 做不到，必须先把地址放进寄存器，再用方括号间接访问。\n<\/li><li>\n反例三：把 eax 和 rax 当成两套独立存储，误以为写 eax 不影响 rax；实际上 eax 就是 rax 的低 32 位。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n寄存器 vs 内存：寄存器在 CPU 内部、容量极小、速度最快；内存容量大，每次访问都要报地址。\n<\/li><li>\n数值寄存器 vs 地址寄存器：前者装参与运算的数，后者装“数放在哪”的坐标；后者对应 C 语言里的指针角色。\n<\/li><li>\n地址 vs 数据：地址回答“在哪”，数据回答“是什么”；信号线也分地址线和数据线两条路径。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n上接：汇编指令与栈帧雏形（push/mov/pop 怎么用这些寄存器）。\n<\/li><li>\n下连：变量与类型宽度（变量名是地址别名）、指针与引用的本质（指针存地址）。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（寄存器与内存地址）<\/summary><div class=\"depth-body\"><h1>寄存器与内存地址 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要真正看懂寄存器分工，先得会三件事：第一，知道内存按地址编号，读写任何单元都要先报地址；第二，知道 CPU 内部有一批比内存更快的小存储位置，即寄存器；第三，能区分“参与运算的数”和“数所在的坐标”。再往前追，需要理解高级语言语句最终要翻译成机器能执行的搬数动作。如果这三层有缺口，直接背 rax、rbp、rsp 的名字只会记混。<\/p>\n<h2>正向推导<\/h2>\n<p>从内存模型开始推演。内存条对外有两组信号线：地址信号线指明本次访问哪一块单元，数据信号线在 CPU 和内存之间传递读写内容。没有地址，数据线不知道往哪落；没有数据，地址本身不携带内容。所以任何一次内存读写都拆成两步：先给地址，再走数据。<\/p>\n<p>CPU 内部的寄存器按用途分两类。一类装参与运算的数值，本书示例用 rax，角色接近 C 语言里的普通变量；另一类装内存地址，本书示例用 rbp、rsp，角色接近指针变量。rbp 记录当前栈帧的基准位置，rsp 记录栈顶位置，二者配合才能在栈上找到局部变量。<\/p>\n<p>再看指令访问方式。x86 指令不能把裸地址直接写进操作数，必须先把地址放进寄存器，再用方括号间接访问，例如 <code>mov QWORD PTR [rbp-8], 1<\/code>。方括号里的表达式算出来是目标地址，指令再把数值写进去。这条限制决定了后面所有指针、数组、栈帧代码的汇编形态：凡是“按地址读写”，机器上都要出现寄存器加方括号的形式。<\/p>\n<p>补充寄存器命名关系：eax 是 32 位寄存器名，rax 是对应的 64 位寄存器，eax 只是 rax 的低 32 位。写 eax 会影响 rax 低半段，读 rax 包含完整 64 位。<\/p>\n<h2>算例<\/h2>\n<p>假设一段函数里出现三条动作：把 5 写入变量 a；把 a 加 3；把 a 的值送返回值寄存器。推演对应机器路径：写入动作经寄存器间接寻址落到 a 的内存单元；加法先读 a、运算、写回；返回值最后进 rax。 自拟小算例：64 位环境下，一个指针变量占 8 字节；若有三个指针并排存放，相邻指针地址间隔 8 字节。若基址为 0x1000，三个地址依次是 0x1000、0x1008、0x1010。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：把 rbp 当数值寄存器做算术，栈帧基准被覆盖，后续局部变量寻址全部错位。反例二：以为可以写 <code>mov 0x1234, 1<\/code> 这类裸地址指令，x86 不支持，必须经寄存器间接访问。反例三：把 eax 和 rax 当成两套独立存储，忽略低 32 位重叠关系。 边界说明：分工描述以本书 x86-64 示例为背景；ARM、RISC-V 寄存器命名和传参规则不同，但“数值寄存器/地址寄存器”的区分思路通用。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n内存访问前必须先给出什么？（答案：内存地址，地址是读写前提。）\n<\/li><li>\nrax 与 rbp 各自装什么？（答案：rax 装数值，rbp 装栈帧基准地址。）\n<\/li><li>\neax 和 rax 是什么关系？（答案：eax 是 rax 的低 32 位，不是两个无关寄存器。）\n<\/li><li>\nx86 指令能不能直接用裸地址访问内存？（答案：不能，要经寄存器配合方括号间接访问。）\n<\/ol>\n<h2>推演延伸：寻址方式与地址形态<\/h2>\n<p>回到本书 2.2 节的写操作 <code>mov DWORD PTR [rip+0x2f18], 0x1<\/code>，方括号内是基址加偏移：rip 指向下一条指令，0x2f18 是相对偏移，相加得到目标内存单元。对照 1.3 节的 <code>[rbp-8]<\/code>，这是寄存器相对寻址：rbp 是栈帧基准，-8 指向本帧第一个局部变量。两种写法形式不同，本质都是“寄存器算出地址，再走数据信号线读写”。<\/p>\n<p>把三类变量的地址形态并排看：全局/静态变量在数据段，链接期地址固定；局部变量在栈帧，地址随 rsp/rbp 移动；堆块地址由 malloc 返回。地址本身都是 64 位编号，所以保存地址的指针变量在 64 位机器上占 8 字节。理解这一层，后面看到 <code>[rbp-16]<\/code>、<code>[rdi]<\/code>、<code>QWORD PTR [rax+8]<\/code> 就不会被方括号吓住：括号里算地址，括号外走数据。<\/p>\n<p>再推一层为什么 CPU 要分数值寄存器和地址寄存器：运算单元对数值做加减乘除，访存单元对地址做偏移计算；两类值流过的路径不同，长期使用中形成分工。rax 装返回值和临时数值，rbp/rsp 跟踪栈位置，rsi/rdx 参与传参和串操作。换个架构寄存器名会变，但“装数”和“装地址”的两类职责不会消失。<\/p>\n<h2>推演延伸：寄存器分工与信号线落地<\/h2>\n<p>反面对照看分工约定：如果用 rbp 这类地址寄存器去装临时运算结果、用 rax 去跟踪栈位置，指令流不会立刻报错，但后续访存会按错误地址取值，现场被打乱。寄存器分工不是硬件逐位强制，是调用约定和编译器长期形成的映射；换到别的平台，寄存器名字和分工映射会变，“装数”和“装地址”两类职责仍保留。<\/p>\n<p>信号线再拆一层：读内存时地址线先送达目标编号，数据线随后返回该单元内容；写内存时地址线与数据线同时就位，写脉冲生效。源码里的变量名被编译器翻译成编号，编号经地址线落地，数据线搬运的才是值。<\/p>\n<p>地址宽度决定指针宽度：64 位环境地址编号占 8 字节，所以指针变量 8 字节；32 位环境地址 4 字节，指针随之 4 字节。同一程序移植到不同位数环境，指针宽度跟着环境走，不能按位数写死。<\/p>\n<h2>正向推导细化：逐条指令对寄存器与栈偏移的影响<\/h2>\n<p>以本书示例函数 <code>int f(){ int a=1; a=a+3; return a; }<\/code> 为底，按执行顺序逐条列出寄存器与内存变化（x86-64，栈向低地址生长）：<\/p>\n<ol><li>\n<code>push rbp<\/code>：把当前 rbp 的旧值写到 rsp 指向单元的下方，随后 rsp 减 8；rbp 本身此刻尚未改。\n<\/li><li>\n<code>mov rbp, rsp<\/code>：rbp 取当前 rsp 的值，栈帧基准线对齐到栈顶；此后局部变量一律用 rbp 加负偏移定位。\n<\/li><li>\n<code>mov DWORD PTR [rbp-8], 1<\/code>：目标地址 = rbp-8，数据线把 1 写入该单元；rbp、rsp、rax 都不变。\n<\/li><li>\n<code>add DWORD PTR [rbp-8], 3<\/code>：先按地址 rbp-8 读出 a 的值进临时寄存器，加 3，再写回同一单元；rsp 不变。\n<\/li><li>\n<code>mov eax, [rbp-8]<\/code>：把单元值读进 rax 的低 32 位（eax），作为返回值。\n<\/li><li>\n<code>pop rbp<\/code>：从栈顶读出旧基准写回 rbp，rsp 加 8。\n<\/li><li>\n<code>ret<\/code>：栈顶返回地址送入 rip，rsp 再加 8，跳回主调被打断的位置。\n<\/ol>\n<h2>完整算例：栈帧布局表（自拟，按本书模型）<\/h2>\n<p>函数 f 一帧内，以 rbp 为基准的偏移：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>偏移<\/th><th>内容<\/th><th>谁写入<\/th><\/tr><\/thead><tbody><tr><td>rbp+8<\/td><td>返回地址<\/td><td>call 指令压入<\/td><\/tr><tr><td>rbp+0<\/td><td>保存的旧 rbp<\/td><td>push rbp 写入，pop rbp 读回<\/td><\/tr><tr><td>rbp-8<\/td><td>局部变量 a（int，4 字节）<\/td><td>mov/add 指令<\/td><\/tr><\/tbody><\/table><\/div>\n<p>偏移怎么算：返回地址在 call 时压栈，位于旧 rbp 之上（高地址方向）；旧 rbp 由序言保存；局部变量从 rbp-8 向下（低地址方向）逐个排。int 占 4 字节，本例 a 占 [rbp-8, rbp-5]，[rbp-4, rbp-1] 为对齐填充（自拟，具体填充随目标 ABI）。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“寄存器就是速度很快的内存”<\/strong>：反例——通用寄存器数量只有十几个量级，放不下的临时值仍要落内存；寄存器不能按编号随机索引，和可按地址访问的内存不是一回事。\n<\/li><li>\n<strong>“地址就是普通数值，可以随便参与运算”<\/strong>：反例——地址是访存坐标，x86 不支持裸地址直接作操作数；对未映射地址解引用会触发段错误。\n<\/li><li>\n<strong>“rax 改了，别的寄存器会跟着变”<\/strong>：反例——各寄存器独立存储；写 eax 只覆盖 rax 低 32 位，按 x86-64 约定高 32 位清零，不会牵连 rbp、rsp。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n读写内存前为什么先走地址信号线？（答案：地址定位到具体单元，数据线才知道往哪落、从哪取。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "寄存器与内存地址"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.24<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">寄存器与内存地址<\/a><\/span><\/div><h1>汇编指令与栈帧雏形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>问题<\/h2>\n<p>一条 <code>a += 2<\/code> 在机器上到底变成哪几步？为什么本书说不必精通汇编，却要能读懂这些指令的内存动作？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n函数在汇编层面由 push、mov、add、pop、ret 等指令构成。\n<\/li><li>\npush 保存旧栈帧并让栈顶向低地址生长；pop 是 push 的反向操作。\n<\/li><li>\nmov 负责把数值写入内存，或把内存值读进寄存器。\n<\/li><li>\nadd 先读出目标值、做加法，再把结果写回原地址。\n<\/li><li>\nret 把栈顶返回地址送入 rip，CPU 跳回主调函数被打断的位置。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 1.3 节用自加函数 test() 逐条对照：<\/p>\n<pre class=\"lang-c\"><code>long test()\n{\n    long a = 11;\n    a += 2;\n    return a;\n}<\/code><\/pre>\n<ol><li>\n<code>push rbp<\/code>：先把 rbp 的值存放到 rsp 指向的内存下方，再让 rsp 减 8（64 位下一个存储单元 8 字节），栈向低地址生长。\n<\/li><li>\n<code>mov rbp, rsp<\/code>：栈帧基准线对齐到栈顶，主调栈帧保护完成。\n<\/li><li>\n<code>mov QWORD PTR [rbp-8], 1<\/code>：把 1 写入变量 a 的内存，对应 C 写法 <code>*(rbp - 8) = 1<\/code>；QWORD 指明数值占 8 字节。\n<\/li><li>\n<code>add QWORD PTR [rbp-8], 2<\/code>：先用 * 读出 a 的值，与 2 相加，再把结果写回同一地址。\n<\/li><li>\n<code>mov rax, [rbp-8]<\/code>：把内存里的最终值读进 rax，作为函数返回值。\n<\/li><li>\n<code>pop rbp<\/code>：把栈顶值还给 rbp，恢复旧基准；<code>ret<\/code> 按返回地址跳回调用处。除返回值 rax 外，其余寄存器都恢复到调用前状态。\n<\/ol>\n<p>本书统计观察：一次简单 +2 至少伴随 5 次内存读写，内存读写在 CPU 工作负荷中占比很高；这也是后面所有章节反复回到“寄存器—内存”搬数动作的背景。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n指令读法以本书 x86-64 示例为准；指令名在其他汇编语法下可能不同，但“序言保护基准、分配局部空间、结语恢复返回”的骨架通用。\n<\/li><li>\n栈帧雏形只覆盖单函数内的指令动作；参数传递、完整栈帧布局在第 3 章展开。\n<\/li><li>\n条件去掉会怎样：如果序言不保存旧 rbp，函数返回后主调基准丢失；如果结语不恢复 rsp，栈顶水位无法归还。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：看到 push 就以为只是“存个数”，忽略 rsp 同步减 8；栈顶水位不更新，后续写入会踩错单元。\n<\/li><li>\n反例二：把 add 当成只写不读；实际上 add 必须先读原值，否则加法没有输入。\n<\/li><li>\n反例三：以为函数返回后寄存器是随机垃圾值；保护/恢复成对出现，除返回值外都回到调用前。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\npush vs pop：方向相反，push 压入并减栈顶，pop 弹出并升栈顶。\n<\/li><li>\nmov 读 vs mov 写：<code>mov 寄存器, [地址]<\/code> 是内存读进寄存器；<code>mov [地址], 数值<\/code> 是写入内存。\n<\/li><li>\n汇编指令 vs 高级语句：一条高级语句常拆成多条指令，指令是动作，语句是意图。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：寄存器与内存地址。\n<\/li><li>\n后置：参数传递与栈帧（序言/结语的完整版）、堆与栈的区别。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（汇编指令与栈帧雏形）<\/summary><div class=\"depth-body\"><h1>汇编指令与栈帧雏形 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要看懂 push、mov、add、pop、ret 这组指令，先得会：寄存器分工（rax 装数值、rbp/rsp 装地址）；栈向低地址生长；函数调用结束要回到主调打断点。再往前需要理解：高级语句是意图，汇编指令是拆出来的动作。如果不先建立“序言保护基准、结语恢复现场”的骨架，单看每条指令会觉得零散。<\/p>\n<h2>正向推导<\/h2>\n<p>以本书自加函数为蓝本推演：<\/p>\n<pre class=\"lang-c\"><code>long test()\n{\n    long a = 11;\n    a += 2;\n    return a;\n}<\/code><\/pre>\n<p>第一步进入函数：<code>push rbp<\/code> 包含两个微操作。先把 rbp 的值存放到 rsp 指向的内存下方，再让 rsp 减 8。64 位下一个存储单元 8 字节，栈向低地址生长，所以压栈后栈顶水位下降。第二步 <code>mov rbp, rsp<\/code> 把栈帧基准线对齐到当前栈顶，主调栈帧保护完成。<\/p>\n<p>第三步赋值：<code>mov QWORD PTR [rbp-8], 1<\/code> 把 1 写入 a 所在内存，对应 C 写法 <code><em>(rbp - 8) = 1<\/code>。QWORD 指明这次写入占 8 字节。第四步自加：<code>add QWORD PTR [rbp-8], 2<\/code> 先按 <\/em> 读出 a 的值，与 2 相加，再把结果写回同一地址；add 不是只写不读，它必须先有输入。第五步 <code>mov rax, [rbp-8]<\/code> 把内存最终值读进 rax，作为函数返回值。<\/p>\n<p>收尾阶段：<code>pop rbp<\/code> 是 push 的反向操作，把栈顶值还给 rbp，恢复旧基准；<code>ret<\/code> 把栈顶返回地址送入 rip，CPU 跳回主调被打断的位置。除返回值 rax 外，其余寄存器都恢复到调用前状态，就像函数没被调用过。<\/p>\n<p>本书统计观察：一次简单 +2 至少伴随 5 次内存读写，内存读写在 CPU 工作负荷中占比很高。这解释了为什么后续章节反复回到“寄存器—内存”搬数动作，而不是停在语法层。<\/p>\n<h2>算例<\/h2>\n<p>自拟栈帧字节推算：函数内定义两个 long 局部变量，每个 8 字节，局部区共 16 字节；加上 call 压入的返回地址 8 字节、序言保存的旧 rbp 8 字节，该函数完整栈帧至少 32 字节（不含对齐填充）。 自拟指令配对：push rbp 对应结语 pop rbp；mov rbp, rsp 建立基准；sub rsp, N 分配局部空间；ret 取返回地址跳回。把这几条按顺序排，就是一个最小可返回的函数骨架。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：看到 push 只当“存个数”，漏掉 rsp 同步减 8，栈顶水位不更新，后续写入踩错单元。反例二：把 add 当成纯写指令，忽略先读原值；没有输入加法无法成立。反例三：以为函数返回后寄存器是随机垃圾值，实际保护与恢复成对出现。 边界：指令读法以本书 x86-64 示例为准；其他汇编语法指令名可能不同，但“序言保护基准、分配局部空间、结语恢复返回”的骨架通用。参数传递和完整栈帧布局在第 3 章展开，本节只看单函数雏形。<\/p>\n<h2>自检<\/h2>\n<ol><li>\npush rbp 做了哪两件事？（答案：存旧 rbp 到栈顶下方；rsp 减 8。）\n<\/li><li>\n<code>*(rbp - 8) = 1<\/code> 对应哪条汇编？（答案：mov QWORD PTR [rbp-8], 1。）\n<\/li><li>\nadd 指令为什么必须先读内存？（答案：要先取出原值参与加法，再写回结果。）\n<\/li><li>\nret 依据什么跳回主调？（答案：栈顶保存的返回地址送入 rip。）\n<\/ol>\n<h2>推演延伸：最小可返回函数的完整闭环<\/h2>\n<p>把序言、主体、结语连成闭环看：call 压入返回地址后进入被调函数；push rbp 保存主调基准；mov rbp, rsp 立基准；sub rsp, N 分配局部空间；主体 mov/add 读写局部变量；结语把栈顶降回基准，pop rbp 恢复旧基准；ret 按返回地址跳回。每一步都有配对：push 对 pop，立基准对恢复基准，分配空间对归还栈顶。<\/p>\n<p>本书观察一次 +2 至少 5 次内存读写，内存读写在 CPU 负荷中占比很高。推到工程含义：高性能代码优化的重点往往不是少算几次算术，而是减少访存次数；寄存器能放下的临时值就不要反复写回内存。这也解释本书为什么说不必精通汇编：每条指令意义相对简单，结合源码大多能猜出动作，学习目标是读懂“源码—指令—内存”的对应，而不是手写汇编程序。<\/p>\n<p>再看寄存器恢复：除 rax 放返回值外，rbp、rsp、rbx 等在结语后回到调用前状态，这是调用约定的一部分——被调函数不能留下破坏现场的痕迹。如果某条指令改了 callee-saved 寄存器却不恢复，主调函数后续计算就会拿到错乱的值。<\/p>\n<h2>推演延伸：陌生汇编的读码顺序<\/h2>\n<p>读一段不熟悉的函数汇编，先找序言 push rbp、mov rbp,rsp，再找结语 pop rbp、ret，先把函数范围框出来；中间 mov 是搬数，add/sub 是算偏移或改值，call 跳到别的函数，lea 只算地址不取值。<\/p>\n<p>指令与 C 语句对照：<code>int a = 1;<\/code> 对应一次 mov 写栈帧单元；<code>a = a + 2;<\/code> 对应先读后写的 add；<code>return a;<\/code> 对应把值 mov 进 rax。顺着这条对照读，每条指令都能落回一句源码意图。<\/p>\n<p>失败对照：把内存地址当成普通数值直接参与运算，或把数值当地址解引用，都属越界风险；汇编层面能看清读写落到哪个单元，正是定位这类错误的线索。脱离上下文硬记指令助记符意义不大，要结合它服务的源码语句读。<\/p>\n<h2>正向推导细化：序言、主体、结语逐段对栈的影响<\/h2>\n<p>以本书自加函数 test() 为底，把每条指令对 rbp、rsp 和目标单元的影响拆开：<\/p>\n<ol><li>\n<code>push rbp<\/code>：旧 rbp 存入栈顶下方单元，rsp -= 8；这一步为恢复主调基准留好备份。\n<\/li><li>\n<code>mov rbp, rsp<\/code>：rbp = rsp，基准线固定；从这一步起，本帧局部变量都以 rbp 为锚点算偏移。\n<\/li><li>\n<code>mov QWORD PTR [rbp-8], 1<\/code>：地址 rbp-8 算出后写 1；rsp 不动。\n<\/li><li>\n<code>add QWORD PTR [rbp-8], 2<\/code>：先读 [rbp-8]，加 2，写回；一次加法伴随先读后写两次访存。\n<\/li><li>\n<code>mov rax, [rbp-8]<\/code>：最终值读进 rax 作返回值。\n<\/li><li>\n<code>mov esp, ebp<\/code>（等价把栈顶降回基准）：rsp 回到 rbp 位置，局部空间整体归还。\n<\/li><li>\n<code>pop rbp<\/code>：旧基准从栈顶读回 rbp，rsp += 8。\n<\/li><li>\n<code>ret<\/code>：返回地址进 rip，rsp += 8，跳回主调。\n<p>每一步都能在栈上指到具体单元；序言做的“保存基准、立基准、分空间”，结语逐条反向撤销。<\/p>\n<\/ol>\n<h2>完整算例：栈帧布局表（自拟）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>偏移<\/th><th>内容<\/th><th>谁写入<\/th><\/tr><\/thead><tbody><tr><td>rbp+8<\/td><td>返回地址（本书示例 0x401105e 一类）<\/td><td>call 压入<\/td><\/tr><tr><td>rbp+0<\/td><td>保存的旧 rbp<\/td><td>push rbp<\/td><\/tr><tr><td>rbp-8<\/td><td>局部变量 a（QWORD，8 字节）<\/td><td>mov/add<\/td><\/tr><\/tbody><\/table><\/div>\n<p>偏移计算：call 先压返回地址，push rbp 再把旧基准压在返回地址下方；mov rbp,rsp 后基准线落在旧基准位置；a 从 rbp-8 向下排，占 8 字节。两帧之间靠 rsp 递减衔接，递归越深，地址越低。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“每条汇编指令对应一行源码”<\/strong>：反例——<code>a += 2<\/code> 拆成读、加、写回多条指令；有的源码语句生成一串指令，也有几条指令合起来才表达一句源码。\n<\/li><li>\n<strong>“函数序言可有可无”<\/strong>：反例——没有 push rbp 和 mov rbp,rsp，局部变量和返回基准找不到锚点，嵌套调用的栈帧会互相覆盖。\n<\/li><li>\n<strong>“ret 负责逐条擦除局部变量”<\/strong>：反例——ret 只取返回地址跳转；局部空间靠栈顶指针回落自动让出，内存内容并不会被逐条清零。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n序言和结语为什么必须成对出现？（答案：push 对 pop、立基准对恢复基准、分空间对归还栈顶，不成对现场无法还原。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "汇编指令与栈帧雏形"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.35<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">寄存器与内存地址<\/a><\/span><\/div><h1>变量与类型宽度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>问题<\/h2>\n<p>变量在源码里是一个名字，到了 CPU 面前它到底是什么？为什么 int、short、char 相邻存放时间隔不一样？哪些变量地址固定，哪些会漂？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n变量是内存地址的别名：给一块内存起个名字，方便程序员记和用。\n<\/li><li>\n变量类型决定这块内存占用多长：本书示例 int 4 字节、short 2 字节、char 1 字节。\n<\/li><li>\n全局变量与静态变量的地址编译完成后固定；栈变量地址随函数调用伸缩而变化。\n<\/li><li>\n写内存指令通过寄存器配合方括号间接访问；rip 存放下一条指令地址。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 2.2 节先看内存结构：内存有数据信号线和地址信号线，读写前必须先报地址，地址是一切内存读写的前提。再看写操作汇编，如 <code>mov DWORD PTR [rip+0x2f18], 0x1<\/code>，方括号里是目标内存地址；x86 不能拿裸地址访问内存，要经寄存器间接寻址，rip 指向下一条指令，偏移量 0x2f18 是相对 rip 的距离。<\/p>\n<p>多个全局/静态变量并排定义时，地址按类型宽度相隔：本书示例 int a、int b、static int c 的地址 0x40402c、0x404030、0x404034，两两相隔 4 字节；改成 short 后间隔 2 字节，改成 char 后间隔 1 字节。类型宽度直接体现在内存布局上。<\/p>\n<p>地址固定性分两类：编译加载后，全局变量、静态变量的内存地址与指令偏移都固定，运行过程中不变；局部栈变量在栈帧里分配，栈帧一动地址就跟着动。<\/p>\n<p>2.10 节补出类型的另一层事实：补码表示下，有符号 char 的 0xff 最高位为 1，解释为 -1；同一二进制串也可被解释成无符号大数。比较前若类型不统一，就会出现 -1（0xffffffff）不等于 255（0x000000ff）的争议结果。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n类型字节数以本书示例的 x86-64 平台为准；不同架构或编译器下 long 宽度可能不同，判断时以目标平台 ABI 为准。\n<\/li><li>\n“全局/静态地址固定”指编译期确定、运行期不变；栈变量位置随调用链变化，不代表每次都随机。\n<\/li><li>\n条件去掉会怎样：如果不按类型宽度留间隔，元素边界互相咬尾，读写就会串味；如果比较前不统一类型，补码二义性会留在代码里。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：以为 char 0xff 就是 255；在有符号 char 上它是 -1，与无符号 255 比较不相等。\n<\/li><li>\n反例二：以为局部变量地址和全局变量一样写死在二进制里；栈变量位置要等运行时栈帧搭起来才确定。\n<\/li><li>\n反例三：以为类型只是语法检查标签；拿掉类型宽度，元素间隔、指针步进、栈帧大小全都算不准。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n变量名 vs 变量值：名字挂在地址上，值存在地址指向的内存里；名字不占运行时内存。\n<\/li><li>\n数据段变量 vs 栈变量：前者地址固定、生存期贯穿程序；后者随帧申请回收。\n<\/li><li>\n有符号 vs 无符号：同一串二进制，最高位解释方式不同，得出的数可正可负。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：寄存器与内存地址。\n<\/li><li>\n后置：指针与引用的本质、存储期 static/global/local。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（变量与类型宽度）<\/summary><div class=\"depth-body\"><h1>变量与类型宽度 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要把变量落到内存模型上，先得会：内存按地址编号、读写先报地址；寄存器与内存的分工；补码表示有符号整数的基本规则。再往前需要理解：变量名只是给地址起的别名，运行时不占内存。如果这些缺口没补上，类型宽度、地址固定性、符号争议都会背成条文。<\/p>\n<h2>正向推导<\/h2>\n<p>从内存结构推演。内存条有数据信号线和地址信号线：前者传读写内容，后者指明访问单元。读写前必须先报地址，这是一切内存操作的前提。本书 2.2 节写操作示例 <code>mov DWORD PTR [rip+0x2f18], 0x1<\/code>，方括号内算出目标地址；x86 不能拿裸地址访问内存，rip 存下一条指令地址，0x2f18 是相对 rip 的偏移。<\/p>\n<p>类型宽度决定间隔。本书示例：int 占 4 字节，short 占 2 字节，char 占 1 字节。多个全局/静态变量并排定义时，地址按类型宽度相隔。示例中 int a、int b、static int c 地址为 0x40402c、0x404030、0x404034，两两间隔 4 字节；改成 short 后间隔 2 字节，改成 char 后间隔 1 字节。宽度不是语法标签，它直接写进内存布局。<\/p>\n<p>地址固定性分两类。编译加载后，全局变量和静态变量的地址、指令偏移都固定，运行过程中不变；局部栈变量在栈帧里分配，栈帧随调用链伸缩，地址跟着变。判断一个变量地址是否固定，先看它在数据段还是栈上。<\/p>\n<p>符号争议推演：补码下最高位为 1 的二进制串既可解释成负数，也可解释成无符号大数。有符号 char 的 0xff 最高位为 1，表示 -1；比较前类型统一后，-1（0xffffffff）不等于无符号 255（0x000000ff）。日常多用正数比较，警告常被忽略，碰到最高位为 1 的数值才暴露。<\/p>\n<h2>算例<\/h2>\n<p>自拟间隔推算：int 数组基址 0x2000，元素 0、1、2 的地址依次为 0x2000、0x2004、0x2008；short 数组同基址则为 0x2000、0x2002、0x2004；char 数组为 0x2000、0x2001、0x2002。 自拟符号判断：<code>char x = 0x80;<\/code> 在有符号 char 上最高位为 1，解释为负数 -128；若按 unsigned char 读则是 128。比较前不统一类型，就可能得到与直觉相反的相等判断。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：以为 char 0xff 就是 255；有符号 char 上它是 -1，与无符号 255 不相等。反例二：以为局部变量地址和全局变量一样写死在二进制里；栈变量位置要等栈帧搭起来才确定。反例三：以为类型只服务语法检查；拿掉宽度，元素间隔、指针步进、栈帧大小都算不准。 边界：字节宽度以本书 x86-64 示例为准；long 在不同平台宽度可能不同，判断时以目标平台 ABI 为准。“全局/静态地址固定”指编译期确定、运行期不变，不代表每次进程启动地址完全相同（开启地址随机化时基址会变，相对位置不变）。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nint、short、char 在本书示例中各占几字节？（答案：4、2、1。）\n<\/li><li>\n哪类变量地址编译后固定，哪类随运行变化？（答案：全局/静态固定；栈变量随帧伸缩。）\n<\/li><li>\n有符号 char 0xff 解释成多少？（答案：补码下为 -1。）\n<\/li><li>\n比较两类不同类型数值前应先做什么？（答案：统一两边类型，消除符号二义性。）\n<\/ol>\n<h2>推演延伸：宽度、间隔与符号判断合起来算<\/h2>\n<p>把类型宽度用在数组布局上：int 数组基址 B，元素 i 地址 B+4i；short 数组 B+2i；char 数组 B+i。指针步进按同一规则：类型宽度是多少，加一就前进多少字节。栈帧大小估算也靠宽度：局部变量逐个按自身宽度叠加，再考虑对齐填充（本书示例未展开对齐规则，实际工程需查目标平台 ABI）。<\/p>\n<p>符号判断再走一遍：有符号数最高位是符号位，补码下最高位 1 表示负数。char a=0xff，二进制 11111111，按补码反推：取反加一得 1，所以是 -1；右侧字面量 0xff 按无符号 int 处理为 255。统一类型后比较 -1 与 255，不等。若把 a 改成 unsigned char，同一二进制串解释成 255，比较就相等。争议不在数值本身，而在解释规则。<\/p>\n<p>地址固定性延伸：编译后的二进制里，全局/静态变量偏移写死在指令中；加载进进程后，整套数据段按基址加偏移摆放，开启地址随机化时基址变化，相对间隔不变。栈变量没有编译期固定地址，因为栈帧位置随调用链伸缩；堆块地址由分配器运行时决定。判断“地址会不会变”，先定位变量在数据段、栈还是堆。<\/p>\n<h2>推演延伸：宽度与符号的边界<\/h2>\n<p>类型宽度是平台 ABI 约定：本书示例 int 4 字节、short 2 字节、char 1 字节；换到其他平台 int 宽度可能不同，跨平台代码不能把宽度写死，需要按固定宽度类型声明位宽敏感的数据。<\/p>\n<p>有符号/无符号转换本质是位模式重解释：位串本身不变，变的是最高位的含义。比较前统一类型，就是避免编译器按两种解释规则各算一遍，最后得出互相矛盾的结论。<\/p>\n<p>自拟算例：unsigned char u = 255，整数提升后是 255，与 0xff 相等；有符号 char s = 0xff，整数提升后是 -1，与 0xff 不等。同一位串，差别只在解释规则，不在二进制内容。<\/p>\n<h2>正向推导细化：宽度如何决定偏移与步进<\/h2>\n<p>类型宽度在机器上直接变成地址间隔。逐条推演：<\/p>\n<ol><li>\n定义 <code>int a;<\/code>：编译器按 int 宽度 4 字节在帧上留出 4 字节；相邻变量偏移按宽度累加。\n<\/li><li>\n定义 <code>short b;<\/code>：占 2 字节；<code>char c;<\/code>：占 1 字节。\n<\/li><li>\n数组 stride：int 数组元素间隔 4，short 间隔 2，char 间隔 1；下标 i 的地址 = 基址 + i×宽度。\n<\/li><li>\n指针步进：指针加一前进“指向类型宽度”个字节，不是前进 1 字节。\n<\/li><li>\n对齐填充：相邻字段放不下对齐要求时，中间补填充字节；偏移表要把填充算进去，不能只累加字段宽度。\n<\/li><li>\n符号解释：位串摆好后，最高位按有符号/无符号规则解释；宽度决定占几格，解释规则决定这串二进制读作什么。\n<\/ol>\n<h2>完整算例：一段局部变量的帧内偏移（自拟）<\/h2>\n<p>C 代码：<code>void f(){ short x; char y; int z; }<\/code>（按本书宽度 short 2、char 1、int 4；对齐为自拟 ABI）。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>变量<\/th><th>宽度<\/th><th>偏移（相对 rbp，自拟）<\/th><th>占用<\/th><\/tr><\/thead><tbody><tr><td>z<\/td><td>4<\/td><td>rbp-4<\/td><td>4 字节<\/td><\/tr><tr><td>x<\/td><td>2<\/td><td>rbp-6<\/td><td>2 字节<\/td><\/tr><tr><td>y<\/td><td>1<\/td><td>rbp-7<\/td><td>1 字节<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>rbp-8<\/td><td>1 字节对齐<\/td><\/tr><\/tbody><\/table><\/div>\n<p>帧内局部区粗算 8 字节；真实偏移由编译器按对齐规则排列，顺序可能与源码不同。类型宽度决定每格多大，但“放哪一格”还要再过一遍对齐规则。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“char 一定是 1 字节且一定有符号”<\/strong>：反例——1 字节是本书示例宽度；char 默认有/无符号由平台 ABI 决定，同一位串按 unsigned char 解释结果不同。\n<\/li><li>\n<strong>“类型决定变量存在哪块内存”<\/strong>：反例——类型只决定宽度和解释规则；存放位置由存储期决定，int 可以在栈、数据段或堆上。\n<\/li><li>\n<strong>“short 数组相邻元素间隔 4 字节”<\/strong>：反例——间隔等于自身宽度 2 字节；把 int 的宽度套到 short 上，算出来的地址会整体错位。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n同一二进制串读作 -1 还是 255，由什么决定？（答案：有符号/无符号解释规则，位串本身不变。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "变量与类型宽度"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.43<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">变量与类型宽度<\/a><\/span><\/div><h1>指针与引用的本质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>问题<\/h2>\n<p>指针为什么被当成 C/C++ 最难的部分？把“指向”翻译成机器动作，指针和引用到底分别是什么？它们的风险出在哪一步？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n指针变量保存内存地址；对指针做 * 操作，就是按该地址读写内存。\n<\/li><li>\n64 位 CPU 上内存地址占 8 字节，所以各类指针变量宽度都是 8 字节。\n<\/li><li>\n引用在底层实现上与指针完全相同，可理解为不能改绑的指针常量。\n<\/li><li>\n指针操作不是指针变量专利：普通变量、立即数地址都可以做 * 操作。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 2.4 节比较普通变量、char<em>、short<\/em>、int (*a)[3]、int**：各类指针变量的读写汇编与普通变量没有区别；所谓“指向”，描述的是指针里存的值是某个内存地址。地址宽度 8 字节，所以 char<em>、int<\/em>、int** 占同样长度。<\/p>\n<ul><li>\n操作分两步。以 <code>int<em> p = &amp;a; <\/em>p = 2;<\/code> 为例：第一步锁定目标地址，从 p 所在内存读出 0x1234，这就是目标位置；第二步把 2 写入 0x1234。读操作 <code>rax = *p<\/code> 按同样路径，先读目标地址的值，再搬进寄存器。\n<\/ul>\n<p>2.5 节进一步推演：只要知道变量地址，就能 <code><em>(int<\/em>)&amp;a = 1<\/code> 直接赋值；类对象的 <code>. <\/code> 操作和 <code>-&gt;<\/code> 操作，本质也是同一套地址读写。风险链条是：拿到私有变量地址后，可不受语法限制读写；无 MMU 的环境（早期 DOS、部分单片机）里程序能扫描整个内存。本书因此提到 C#、Java、JavaScript、Python、Rust 干脆禁用裸内存地址和指针。<\/p>\n<p>2.8 节对照引用与指针：引用变量 r 实际定义了一个指向 a 的指针 p，对 r 的读改写就是对 p 的 <em> 读写，两者汇编指令完全相同。语法层区别有四条：引用写法简洁、不用加 <\/em>；引用不能赋 NULL；引用不能改绑到另一个变量；不存在“引用的引用”。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n指针 8 字节是 64 位平台结论；32 位平台地址 4 字节，宽度随地址总线变化。\n<\/li><li>\n“普通变量也能做指针操作”是机器能力描述，不代表工程上应该绕过封装；私有属性的访问限制在语法层，地址一旦泄露限制就落空。\n<\/li><li>\n条件去掉会怎样：如果 * 操作不分两步，先取地址再读写，地址和数据就会混在一个动作里；如果引用底层另搞一套传递约定，调用机制就要多一套规则。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：以为指针存的是它指向的值；指针存的是坐标，值要再沿坐标读一次。\n<\/li><li>\n反例二：以为引用和指针是两套底层实现；本书对照汇编，两者指令完全相同。\n<\/li><li>\n反例三：以为有了指针更安全；它只是多一条绕过语法约束的读写渠道，出 bug 时更难定位。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n指针 vs 数组：指针保存地址，数组是一段连续内存；数组传参时退化为首地址（见数组与越界）。\n<\/li><li>\n传值 vs 传指针：前者送值、改副本；后者送地址、按地址写回本体。\n<\/li><li>\n引用 vs 指针：底层相同，差别全在语法约束（NULL、改绑、多层级）。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：变量与类型宽度。\n<\/li><li>\n后置：数组与数组越界、参数传递与栈帧。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（指针与引用的本质）<\/summary><div class=\"depth-body\"><h1>指针与引用的本质 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要拆解指针，先得会：变量是地址别名；类型宽度与内存间隔；寄存器间接寻址的方括号写法。再往前需要理解：* 操作是“取地址—读写目标”两个独立动作。如果把指针当成一种特殊变量类型去背，就会忽略它存的就是普通地址这一事实。<\/p>\n<h2>正向推导<\/h2>\n<p>本书 2.4 节对比普通变量、char<em>、short<\/em>、int (*a)[3]、int**：各类指针变量的读写汇编与普通变量没有区别。所谓“指向”，描述的是指针里存的值是某个内存地址。64 位下内存地址占 8 字节，所以无论哪种指针，宽度都是 8 字节；32 位平台则是 4 字节。<\/p>\n<ul><li>\n操作分两步。以 <code>int<em> p = &amp;a; <\/em>p = 2;<\/code> 为例：第一步锁定目标地址，从 p 所在内存读出 0x1234，这就是要访问的目标位置；第二步把 2 写入 0x1234。读操作 <code>rax = *p<\/code> 按同样路径，先读目标地址的值，再搬进寄存器。把两步拆开看，指针没有魔法，就是地址中转一次。\n<\/ul>\n<p>2.5 节推演更一般的情况：只要知道变量地址，就能 <code><em>(int<\/em>)&amp;a = 1<\/code> 直接赋值，甚至可以对立即数地址操作；类对象的 <code>. <\/code> 与 <code>-&gt;<\/code> 本质也是同一套地址读写。风险链条随之展开：拿到私有变量地址后，可不受语法限制读写；无 MMU 环境（早期 DOS、部分单片机）程序能扫描整个内存。本书因此提到 C#、Java、JavaScript、Python、Rust 禁用裸内存地址和指针。<\/p>\n<p>2.8 节对照引用：引用变量 r 实际定义了一个指向 a 的指针 p，对 r 的读改写就是对 p 的 <em> 读写，汇编指令完全相同。语法层四条区别：引用不用加 <\/em>，写法简洁；引用不能赋 NULL；引用不能改绑到另一个变量；不存在“引用的引用”。本书把引用总结为指针常量一类机制。<\/p>\n<h2>算例<\/h2>\n<p>自拟指针步进：int<em> p 指向 int 数组，p+1 前进 4 字节；char<\/em> q 前进 1 字节；long<em> r 前进 8 字节。基址 0x3000 时，int<\/em> 下一步在 0x3004，char<em> 下一步在 0x3001。 自拟双重访问：<code>int x = 5; int<\/em> px = &amp;x; int<strong> ppx = &amp;px;<\/code> 读 <\/strong>ppx 的路径是：ppx 里存 px 的地址 → 从该地址读出 px 的值（x 的地址）→ 再按 x 地址读出 5。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：以为指针存的是指向的值；指针存坐标，值要再沿坐标读一次。反例二：以为引用和指针是两套底层实现；对照汇编，两者指令完全相同。反例三：以为有指针就更安全；它只是多一条绕过语法约束的读写渠道，出 bug 更难定位。 边界：8 字节宽度是 64 位结论；“普通变量也能做指针操作”是机器能力描述，不等于工程上应绕过封装。私有属性限制在语法层，地址一旦泄露，硬件并不替你守住访问边界。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n*p = 2 的两步是什么？（答案：先读出 p 中目标地址，再把 2 写入该地址。）\n<\/li><li>\n64 位下 char* 和 int** 各占几字节？（答案：都是 8 字节。）\n<\/li><li>\n引用与指针在汇编层面是否相同？（答案：相同；差别在语法约束。）\n<\/li><li>\n引用有哪三条语法限制？（答案：不能赋 NULL；不能改绑；没有引用的引用。）\n<\/ol>\n<h2>推演延伸：两层间接与地址泄露后果<\/h2>\n<p>顺着指针链推：<code>int x=5; int* px=&amp;x; int<strong> ppx=&amp;px;<\/code> 读 <\/strong>ppx 要走两层——ppx 存 px 的地址，读出 px 后再取 px 里 x 的地址，最后读 x 的值。多层指针只是把“取地址再读写”重复多次，每层都遵守同一条规则。<\/p>\n<p>地址泄露的后果按链条展开：拿到私有变量地址，语法层的 private 限制失效，可直接按地址读写；拿到栈上局部变量地址，可沿栈帧回溯相邻单元；无 MMU 环境下程序能扫遍整个内存。本书据此说明现代语言为何禁用裸指针：把地址暴露给程序员，等于给绕过封装、越界改写留了入口。<\/p>\n<p>引用侧再补一条：引用初始化后绑定对象不变，编译器在需要时把它落成指针常量——地址值不可改，所指内容可读可写。这解释引用三条语法限制的机器根源：不能赋 NULL 是因为必须绑定合法对象；不能改绑是因为常量地址不重写；没有引用的引用是因为不存在“指向常量指针的指针”这层对应物。<\/p>\n<h2>推演延伸：指针运算与多层间接的边界<\/h2>\n<p>指针加一按指向类型的宽度步进，不是加一个字节；void* 没有类型宽度，不能直接做加法。两个同类型指针相减得到元素个数，单位是元素而不是字节，乘以宽度才是字节距离。<\/p>\n<p>多层解引用每一层都先取地址再访问；断掉其中一层（存了野地址），后续读写全部落在非法单元。顺着链往上回溯，先检查最外层地址是否合法，再一层层往里走。<\/p>\n<p>引用边界：引用必须在定义处绑定，之后不能改指别处；对引用取地址得到所指对象的地址。const 引用绑定后不能经它改对象，但所指对象可由其他途径修改。自拟对照：<code>int a=3, b=5; int* p=&amp;a; p=&amp;b;<\/code> 指针可以改绑；<code>int&amp; r=a; r=b;<\/code> 是把 b 的值写入 a，不是让 r 改绑到 b。<\/p>\n<h2>正向推导细化：解引用两步在寄存器上的轨迹<\/h2>\n<p>以 <code>int a = 5; int<em> p = &amp;a; <\/em>p = 2;<\/code> 为底，逐寄存器推演：<\/p>\n<ol><li>\n<code>lea<\/code>/取地址：a 的内存编号（本书示例 0x1234）被算出，写入 p 自己所在单元（示例 0x1238）。\n<\/li><li>\n执行 <code>*p = 2<\/code> 第一步：从 p 的单元读出 0x1234，放进某寄存器作为目标地址。\n<\/li><li>\n第二步：把数值 2 写入 0x1234 指向的单元，即改写 a；p 里存的地址值本身不变。\n<\/li><li>\n读操作 <code>rax = *p<\/code>：先从 p 读出目标地址，再按地址把值读进 rax。\n<\/li><li>\n引用路径：<code>int&amp; r = a; r = 2;<\/code> 生成代码与指针相同——r 背后落一个指针常量，写 r 就是按该地址写 a。\n<p>每一层间接都重复“先取地址，再读写目标”；地址中转一次，机器上就是一条读指针加一条按地址访存。<\/p>\n<\/ol>\n<h2>完整算例：两层指针的地址轨迹（自拟）<\/h2>\n<p>C 代码：<code>int x = 5; int* px = &amp;x; int** ppx = &amp;px;<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>层级<\/th><th>单元<\/th><th>存放内容<\/th><th>地址（示例）<\/th><\/tr><\/thead><tbody><tr><td>x<\/td><td>普通变量<\/td><td>值 5<\/td><td>0x1000<\/td><\/tr><tr><td>px<\/td><td>指针<\/td><td>&amp;x = 0x1000<\/td><td>0x1008<\/td><\/tr><tr><td>ppx<\/td><td>双重指针<\/td><td>&amp;px = 0x1008<\/td><td>0x1010<\/td><\/tr><\/tbody><\/table><\/div>\n<p>读 <code>**ppx<\/code>：先从 0x1010 读出 0x1008，再从 0x1008 读出 0x1000，最后从 0x1000 读出 5。断在任何一层，后续都落到非法单元。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“数组名就是指针”<\/strong>：反例——数组名在 sizeof、取地址时表现为整段数组；只有作函数参数时才退化为首地址，两种场合行为不同。\n<\/li><li>\n<strong>“引用是底层新建的第三套别名存储”<\/strong>：反例——对照汇编，引用与指针指令完全相同，通常落成不能改绑的指针常量，没有独立机器机制。\n<\/li><li>\n<strong>“指针可以随便指向一个不存在的地址”<\/strong>：反例——未映射地址读写触发段错误；保存野地址不代表那里有合法对象。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n多层指针解引用每一步做什么？（答案：每层先读出所存地址，再按该地址访问目标单元。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "指针与引用的本质"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.54<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">指针与引用的本质<\/a><\/span><\/div><h1>数组与数组越界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>问题<\/h2>\n<p>数组语法看起来和普通变量差不多，为什么它是越界故障和栈攻击的重灾区？传数组给函数时，编译器到底复制了什么？越界踩到不同方向的内存，后果为什么不一样？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n数组是一段连续内存；元素间隔等于自身类型宽度：int 间隔 4 字节，char 间隔 1 字节。\n<\/li><li>\n数组作参数传递时，不构建临时数组，只传递首地址；函数内读写等价于指针 * 操作。\n<\/li><li>\n多维数组在物理内存条上仍是一维连续内存，只是索引方式不同。\n<\/li><li>\n向低端越界可能暂写“无主之地”；向高端越界会踩到主调栈帧和返回地址，风险最高。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 2.6 节：一维数组按类型宽度连续摆放，int 数组元素间隔 4 字节，char 数组间隔 1 字节。把数组作函数参数时，编译器不会在栈上复制一份相同大小的数组，而是把首地址传给被调函数；函数内改元素会落回原数组。操作系统、协议栈等开源软件也用这种传指针形式，通常另带一个长度参数防越界。二维、三维数组在 CPU 眼里都按一维连续块处理，索引折成一维下标。<\/p>\n<p>2.7 节用实验推演越界方向。<code>long a[2];<\/code> 向下标 -1、-2 赋值，属于向低地址越界；若越界区域是“无主之地”，读写不影响别人，程序暂时无恙。向高地址方向越界时，栈上方就是主调 main 的栈帧和返回地址；本书把 a[3] 写成恶意函数地址后，func1 返回时不再回 main，转而执行恶意代码。若越界写入的是非法数值，CPU 跳到没有合法指令的内存处，通常触发 Segmentation Fault。<\/p>\n<p>工程上越界很隐蔽：strcpy、strcat、memcpy、memmove，以及按下标写全局变量，都是高发位置。本书编程轶事提到一个随机、不可复现的故障，全部门花一个多月才定位到数组越界。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n连续内存布局以本书 x86-64 示例为准；元素宽度随平台类型变化，但“间隔=类型宽度”的规则通用。\n<\/li><li>\n数组名在传参场景退化为首地址；单独在定义数组的函数里，数组名仍代表整块连续内存。\n<\/li><li>\n条件去掉会怎样：如果传参复制整个数组，大数组每次调用都要在栈上拷贝，栈空间和耗时都难以承受；如果越界边界有硬件检查，这类故障会当场暴露而不是潜伏。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：以为数组传参会复制整个数组；实际只传首地址，函数内改动直接影响原数组。\n<\/li><li>\n反例二：以为越界立刻崩溃；踩空闲内存时可能长期静默，踩到返回地址才爆发。\n<\/li><li>\n反例三：以为二维数组在内存里排成表格；物理上仍是一维块，表格是索引视角。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n数组 vs 指针：数组是连续内存块，指针存地址；传参时数组名退化成首地址指针。\n<\/li><li>\n低端越界 vs 高端越界：前者踩低方向空闲内存，暂时可能安全；后者踩主调栈帧和返回地址，直接威胁控制流。\n<\/li><li>\n越界读 vs 越界写：读越界可能泄露数据，写越界才会篡改布局；二者风险等级不同。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：指针与引用的本质。\n<\/li><li>\n后置：参数传递与栈帧、堆与栈的区别。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（数组与数组越界）<\/summary><div class=\"depth-body\"><h1>数组与数组越界 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要推演数组布局与越界后果，先得会：连续内存按类型宽度间隔；指针保存首地址、* 操作按地址读写；栈帧上局部变量、保存的 rbp、返回地址的排列顺序。再往前需要理解：传数组参数不传整块，只传坐标。<\/p>\n<h2>正向推导<\/h2>\n<p>本书 2.6 节推演一维数组：元素按类型宽度连续摆放，int 间隔 4 字节，char 间隔 1 字节。数组作函数参数时，编译器不在栈上复制相同大小的临时数组，而是把首地址传给被调函数；函数内改元素落回原数组。操作系统、协议栈等开源软件也用这种传指针形式，通常另带长度参数防越界。二维、三维数组在内存条上仍是一维连续块，多维只是索引折成一维下标的方式。<\/p>\n<p>2.7 节按方向推演越界。<code>long a[2];<\/code> 向下标 -1、-2 赋值，是向低地址越界；若踩中的是“无主之地”，读写不影响别人，程序暂时无恙。向高地址方向越界时，栈上方就是主调 main 的栈帧和返回地址。本书把 a[3] 写成恶意函数地址后，func1 返回时不再回 main，转而执行恶意代码。链路是：越界写覆盖返回地址 → ret 取被篡改地址 → rip 跳到恶意代码。若越界写入非法数值，CPU 跳到没有合法指令的内存处，通常触发 Segmentation Fault。<\/p>\n<p>工程层面，越界隐蔽且难定位：strcpy、strcat、memcpy、memmove，以及按下标写全局变量都是高发位置。本书轶事里一个随机、不可复现的故障，全部门花一个多月才追到数组越界。越界读可能泄露数据，越界写才会篡改布局，二者风险等级不同。<\/p>\n<h2>算例<\/h2>\n<p>自拟布局推算：<code>long a[2];<\/code> 每个 long 8 字节，数组局部区 16 字节；栈帧向上依次是保存的旧 rbp（8 字节）、返回地址（8 字节）。若 a 基址为 0x5000，a[0] 在 0x5000、a[1] 在 0x5008；a[2] 已越过数组边界，再往上就是旧 rbp 与返回地址所在单元。 自拟传参推演：<code>void f(int a[]) { a[1] = 9; }<\/code> 内的 <code>a[1]<\/code> 等价 <code>*(a + 1)<\/code>，a 是首地址，步进 4 字节；调用方原数组第二个元素被改写。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：以为数组传参会复制整个数组；实际只传首地址，函数内改动直接影响原数组。反例二：以为越界立刻崩溃；踩空闲内存时可能长期静默，踩到返回地址才爆发。反例三：以为二维数组内存排成表格；物理上仍是一维块。 边界：连续布局以本书 x86-64 示例为准；元素宽度随平台类型变化，但“间隔=类型宽度”规则通用。数组名在定义它的函数里代表整块内存，进入传参场景后退化为首地址指针。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n数组传参传递的是什么？（答案：数组首地址，不建临时数组。）\n<\/li><li>\n高端越界为什么比低端越界危险？（答案：上方是主调栈帧和返回地址，改写后控制流可被劫持。）\n<\/li><li>\n多维数组在物理内存里是什么形态？（答案：一维连续内存，索引方式不同。）\n<\/li><li>\n越界写返回地址后，ret 会发生什么？（答案：按被篡改地址送 rip，跳到非预期代码。）\n<\/ol>\n<h2>推演延伸：越界方向与栈帧层级<\/h2>\n<p>按栈帧从上到下（低地址方向）排：局部变量区、保存的旧 rbp、返回地址。低端越界往局部变量下方空闲区走，高端越界往旧 rbp 和返回地址方向走。本书实验里 a[3] 越过 a[1] 后先碰到旧 rbp 区域，再往上就是返回地址；改写返回地址后，ret 取被篡改值送 rip，控制流离开原路径。<\/p>\n<p>传参本质再推：数组名在函数参数位置退化为首地址，sizeof 拿到的是指针宽度而不是整块数组长度；所以 C 语言数组传参常另带 length 参数，就是弥补长度信息丢失。多维数组传参时，第一维可以省略，后续维度必须写定，因为编译器算下标要知道每行宽度。<\/p>\n<p>越界隐蔽性来自两点：一是踩空闲内存时结果“看起来正常”，故障要等冲突才爆发；二是越界写破坏的可能是返回地址、相邻变量等多处，现场被覆盖后难以回溯。本书轶事里一个多月才定位的故障，正说明靠猜排越界效率极低，要靠边界检查、安全字符串函数和编译器防护工具缩小入口。<\/p>\n<h2>推演延伸：数组布局与越界方向补算<\/h2>\n<p>多维数组按行折成一维：2×3 的 int 数组，行 i 列 j 的元素偏移是 (i<em>3+j)<\/em>4 字节；下标运算先折行再折列，编译器据此把二维下标换算成一维地址。<\/p>\n<p>越界方向按栈帧层级看：低地址一侧通常通向栈帧更深处，高地址一侧先碰到旧 rbp 和返回地址；谁在上谁在下由栈向低地址生长的方向确定。本书实验高端越界先碰栈帧基准区域，再往上就是返回地址。<\/p>\n<p>失败对照：字符串越界写可能覆盖相邻字符串或返回地址；C 标准库这类函数不自带长度检查，调用方必须保证缓冲区够大。自拟算例：int a[4] 基址 0x1000，元素地址依次 0x1000、0x1004、0x1008、0x100c；a[4] 越界单元是 0x1010，再往上属于相邻栈帧数据。<\/p>\n<h2>正向推导细化：数组下标到偏移的换算<\/h2>\n<p>以 <code>int a[2];<\/code> 为底，按本书模型推演：<\/p>\n<ol><li>\n基址记为 B；int 宽度 4，元素 0 地址 B，元素 1 地址 B+4。\n<\/li><li>\n下标 i 地址 = B + i×4；编译器把 <code>a[i]<\/code> 翻译成基址加偏移的访存。\n<\/li><li>\n传参后退化为首地址：函数内拿到的是 B，整段数组长度信息丢失，sizeof 拿到的是指针宽度。\n<\/li><li>\n越界方向：低端（更低地址）通向栈帧深处；高端先碰旧 rbp，再往上是返回地址。\n<\/li><li>\n越界写 a[2]、a[3] 依次落到相邻栈帧数据；改写返回地址后，ret 按被篡改值送 rip。\n<p>偏移换算和指针步进是同一条规则：下标乘宽度，再加基址。<\/p>\n<\/ol>\n<h2>完整算例：越界落点表（自拟，基址 0x2000）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>下标<\/th><th>地址<\/th><th>落点<\/th><\/tr><\/thead><tbody><tr><td>a[0]<\/td><td>0x2000<\/td><td>数组第 0 元素<\/td><\/tr><tr><td>a[1]<\/td><td>0x2004<\/td><td>数组第 1 元素<\/td><\/tr><tr><td>a[2]<\/td><td>0x2008<\/td><td>越界：相邻栈帧数据<\/td><\/tr><tr><td>a[3]<\/td><td>0x200c<\/td><td>越界：旧 rbp / 返回地址区域<\/td><\/tr><\/tbody><\/table><\/div>\n<p>int 宽度 4，间隔 4 字节；高端越界先碰栈帧基准，再碰返回地址。字符串类函数不自带长度检查，缓冲区够不够大由调用方保证。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“越界写一定会立刻崩溃”<\/strong>：反例——写到无主空闲内存时程序暂时正常；踩到返回地址、旧 rbp 等关键数据后才出故障，故障可能延迟爆发。\n<\/li><li>\n<strong>“二维数组在内存里排成表格”<\/strong>：反例——内存条是一维的，多维数组按行折成连续存放，靠下标规则换算偏移。\n<\/li><li>\n<strong>“数组传参时编译器复制了一份”<\/strong>：反例——只传首地址，函数内改动直接落回原数组，栈上不建临时副本。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n数组作参数为什么常要另传长度？（答案：传参退化为首地址，数组长度信息在函数内丢失。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "数组与数组越界"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.81<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">汇编指令与栈帧雏形<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">数组与数组越界<\/a><\/span><\/div><h1>参数传递与栈帧<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>问题<\/h2>\n<p>传值、传指针、传引用在写法上不同，CPU 层面差别在哪？一次函数调用前后，栈上先后压入和弹出了什么？返回地址为什么是栈上最敏感的数据？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n传值、传指针、传引用在 CPU 层面都是把数值送进寄存器；被调函数在栈帧里保存参数副本与局部变量。\n<\/li><li>\nx86-64 示例前三个参数走 rdi、rsi、rdx（低 32 位 edi、esi、edx）。\n<\/li><li>\n栈帧序言：push rbp 保存主调基准，mov rbp, rsp 对齐基准，sub rsp, N 分配局部空间。\n<\/li><li>\n结语：pop rbp 恢复基准，ret 按栈顶返回地址送入 rip，跳回主调打断点。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 3.1 节对比两类函数：func1(long x, long y, long z) 形参为数值，func2(long<em> x, long<\/em> y, long* z) 形参为指针。调用前参数经 mov 进寄存器：传值送变量值，传指针送变量地址。进入函数后寄存器还要留作他用，参数先拷进栈帧 [rbp-8]、[rbp-16]、[rbp-24]，即形式参数克隆体。<\/p>\n<p>传值路径：函数内改克隆体，只动栈帧副本，主调栈帧里的本体没被触碰，返回后外部实参不变。传指针路径：栈帧副本保存外部变量地址，<code>*x = 0<\/code> 先读出外部地址，再按地址写回本体，外部变量被改掉。传引用生成的指令与传指针完全相同，属于语法糖。寄存器装不下的复杂参数改走堆栈，载体不同、原理一致。<\/p>\n<p>3.2 节拆函数括号：push rbp 存主调基准，mov rbp, rsp 对齐基准线，sub 下压栈顶给局部变量分配空间；本书 msvc 示例两个 int 局部变量相对基准偏移 4 和 8。3.3 节跟完整往返：call 先压返回地址再跳转；结语 mov esp, ebp 把栈顶降回基准，pop rbp 恢复旧基准，ret 把返回地址送 rip。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n寄存器传参顺序与名称是 x86-64 System V / 本书示例约定；Windows x64 或 ARM 平台的传参寄存器不同，读汇编时先确认调用约定。\n<\/li><li>\n栈帧偏移随局部变量数量和类型宽度变化；示例偏移只对应示例代码，不能套到别的函数。\n<\/li><li>\n条件去掉会怎样：如果序言不保旧 rbp，返回后主调基准丢失；如果返回地址不压栈，ret 找不到归路；如果参数不拷副本，寄存器后续使用就会冲掉实参。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：以为传引用是独立第三种机制；机器层面与传指针同一条路径。\n<\/li><li>\n反例二：以为形参与实参共享一份存储；传值时帧上是独立副本。\n<\/li><li>\n反例三：以为函数返回后栈帧内容还能安全使用；帧空间随之回收，悬挂指针指向已回收区域。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n传值 vs 传指针：送值还是送地址，决定函数内能不能改到本体。\n<\/li><li>\n形参副本 vs 本体：副本在被调栈帧，本体在主调栈帧，两个位置不重叠。\n<\/li><li>\n栈帧 vs 寄存器：寄存器暂存快值，栈帧保存需要回看或跨指令保留的状态。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：汇编指令与栈帧雏形、数组与数组越界。\n<\/li><li>\n后置：堆与栈的区别、对象模型 this 与虚函数。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（参数传递与栈帧）<\/summary><div class=\"depth-body\"><h1>参数传递与栈帧 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要还原一次函数调用的栈帧，先得会：寄存器传参路径；栈向低地址生长；push/mov/sub/pop/ret 的基本动作；局部变量相对 rbp 寻址。再往前需要分清：形参副本在被调栈帧，实参本体在主调栈帧，两个位置不重叠。<\/p>\n<h2>正向推导<\/h2>\n<p>本书 3.1 节对比两类函数：func1(long x, long y, long z) 形参为数值，func2(long<em> x, long<\/em> y, long* z) 形参为指针。调用前参数经 mov 进寄存器：x86-64 示例前三个走 rdi、rsi、rdx（低 32 位 edi、esi、edx）。传值送变量值，传指针送变量地址。<\/p>\n<p>进入函数后寄存器还要留作他用，参数先拷进栈帧 [rbp-8]、[rbp-16]、[rbp-24]，即形式参数克隆体。传值路径：函数内改克隆体，只动栈帧副本，主调栈帧本体没被触碰，返回后外部实参不变。传指针路径：栈帧副本保存外部变量地址，<code>
