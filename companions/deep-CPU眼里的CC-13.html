把 add 当成纯写指令，忽略先读原值；没有输入加法无法成立。反例三：以为函数返回后寄存器是随机垃圾值，实际保护与恢复成对出现。 边界：指令读法以本书 x86-64 示例为准；其他汇编语法指令名可能不同，但“序言保护基准、分配局部空间、结语恢复返回”的骨架通用。参数传递和完整栈帧布局在第 3 章展开，本节只看单函数雏形。<\/p>\n<h2>自检<\/h2>\n<ol><li>\npush rbp 做了哪两件事？（答案：存旧 rbp 到栈顶下方；rsp 减 8。）\n<\/li><li>\n<code>*(rbp - 8) = 1<\/code> 对应哪条汇编？（答案：mov QWORD PTR [rbp-8], 1。）\n<\/li><li>\nadd 指令为什么必须先读内存？（答案：要先取出原值参与加法，再写回结果。）\n<\/li><li>\nret 依据什么跳回主调？（答案：栈顶保存的返回地址送入 rip。）\n<\/ol>\n<h2>推演延伸：最小可返回函数的完整闭环<\/h2>\n<p>把序言、主体、结语连成闭环看：call 压入返回地址后进入被调函数；push rbp 保存主调基准；mov rbp, rsp 立基准；sub rsp, N 分配局部空间；主体 mov/add 读写局部变量；结语把栈顶降回基准，pop rbp 恢复旧基准；ret 按返回地址跳回。每一步都有配对：push 对 pop，立基准对恢复基准，分配空间对归还栈顶。<\/p>\n<p>本书观察一次 +2 至少 5 次内存读写，内存读写在 CPU 负荷中占比很高。推到工程含义：高性能代码优化的重点往往不是少算几次算术，而是减少访存次数；寄存器能放下的临时值就不要反复写回内存。这也解释本书为什么说不必精通汇编：每条指令意义相对简单，结合源码大多能猜出动作，学习目标是读懂“源码—指令—内存”的对应，而不是手写汇编程序。<\/p>\n<p>再看寄存器恢复：除 rax 放返回值外，rbp、rsp、rbx 等在结语后回到调用前状态，这是调用约定的一部分——被调函数不能留下破坏现场的痕迹。如果某条指令改了 callee-saved 寄存器却不恢复，主调函数后续计算就会拿到错乱的值。<\/p>\n<h2>推演延伸：陌生汇编的读码顺序<\/h2>\n<p>读一段不熟悉的函数汇编，先找序言 push rbp、mov rbp,rsp，再找结语 pop rbp、ret，先把函数范围框出来；中间 mov 是搬数，add/sub 是算偏移或改值，call 跳到别的函数，lea 只算地址不取值。<\/p>\n<p>指令与 C 语句对照：<code>int a = 1;<\/code> 对应一次 mov 写栈帧单元；<code>a = a + 2;<\/code> 对应先读后写的 add；<code>return a;<\/code> 对应把值 mov 进 rax。顺着这条对照读，每条指令都能落回一句源码意图。<\/p>\n<p>失败对照：把内存地址当成普通数值直接参与运算，或把数值当地址解引用，都属越界风险；汇编层面能看清读写落到哪个单元，正是定位这类错误的线索。脱离上下文硬记指令助记符意义不大，要结合它服务的源码语句读。<\/p>\n<h2>正向推导细化：序言、主体、结语逐段对栈的影响<\/h2>\n<p>以本书自加函数 test() 为底，把每条指令对 rbp、rsp 和目标单元的影响拆开：<\/p>\n<ol><li>\n<code>push rbp<\/code>：旧 rbp 存入栈顶下方单元，rsp -= 8；这一步为恢复主调基准留好备份。\n<\/li><li>\n<code>mov rbp, rsp<\/code>：rbp = rsp，基准线固定；从这一步起，本帧局部变量都以 rbp 为锚点算偏移。\n<\/li><li>\n<code>mov QWORD PTR [rbp-8], 1<\/code>：地址 rbp-8 算出后写 1；rsp 不动。\n<\/li><li>\n<code>add QWORD PTR [rbp-8], 2<\/code>：先读 [rbp-8]，加 2，写回；一次加法伴随先读后写两次访存。\n<\/li><li>\n<code>mov rax, [rbp-8]<\/code>：最终值读进 rax 作返回值。\n<\/li><li>\n<code>mov esp, ebp<\/code>（等价把栈顶降回基准）：rsp 回到 rbp 位置，局部空间整体归还。\n<\/li><li>\n<code>pop rbp<\/code>：旧基准从栈顶读回 rbp，rsp += 8。\n<\/li><li>\n<code>ret<\/code>：返回地址进 rip，rsp += 8，跳回主调。\n<p>每一步都能在栈上指到具体单元；序言做的“保存基准、立基准、分空间”，结语逐条反向撤销。<\/p>\n<\/ol>\n<h2>完整算例：栈帧布局表（自拟）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>偏移<\/th><th>内容<\/th><th>谁写入<\/th><\/tr><\/thead><tbody><tr><td>rbp+8<\/td><td>返回地址（本书示例 0x401105e 一类）<\/td><td>call 压入<\/td><\/tr><tr><td>rbp+0<\/td><td>保存的旧 rbp<\/td><td>push rbp<\/td><\/tr><tr><td>rbp-8<\/td><td>局部变量 a（QWORD，8 字节）<\/td><td>mov/add<\/td><\/tr><\/tbody><\/table><\/div>\n<p>偏移计算：call 先压返回地址，push rbp 再把旧基准压在返回地址下方；mov rbp,rsp 后基准线落在旧基准位置；a 从 rbp-8 向下排，占 8 字节。两帧之间靠 rsp 递减衔接，递归越深，地址越低。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“每条汇编指令对应一行源码”<\/strong>：反例——<code>a += 2<\/code> 拆成读、加、写回多条指令；有的源码语句生成一串指令，也有几条指令合起来才表达一句源码。\n<\/li><li>\n<strong>“函数序言可有可无”<\/strong>：反例——没有 push rbp 和 mov rbp,rsp，局部变量和返回基准找不到锚点，嵌套调用的栈帧会互相覆盖。\n<\/li><li>\n<strong>“ret 负责逐条擦除局部变量”<\/strong>：反例——ret 只取返回地址跳转；局部空间靠栈顶指针回落自动让出，内存内容并不会被逐条清零。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n序言和结语为什么必须成对出现？（答案：push 对 pop、立基准对恢复基准、分空间对归还栈顶，不成对现场无法还原。）\n<\/ol><\/div><\/details>", "c03": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.35<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">寄存器与内存地址<\/a><\/span><\/div><h1>变量与类型宽度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>问题<\/h2>\n<p>变量在源码里是一个名字，到了 CPU 面前它到底是什么？为什么 int、short、char 相邻存放时间隔不一样？哪些变量地址固定，哪些会漂？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n变量是内存地址的别名：给一块内存起个名字，方便程序员记和用。\n<\/li><li>\n变量类型决定这块内存占用多长：本书示例 int 4 字节、short 2 字节、char 1 字节。\n<\/li><li>\n全局变量与静态变量的地址编译完成后固定；栈变量地址随函数调用伸缩而变化。\n<\/li><li>\n写内存指令通过寄存器配合方括号间接访问；rip 存放下一条指令地址。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 2.2 节先看内存结构：内存有数据信号线和地址信号线，读写前必须先报地址，地址是一切内存读写的前提。再看写操作汇编，如 <code>mov DWORD PTR [rip+0x2f18], 0x1<\/code>，方括号里是目标内存地址；x86 不能拿裸地址访问内存，要经寄存器间接寻址，rip 指向下一条指令，偏移量 0x2f18 是相对 rip 的距离。<\/p>\n<p>多个全局/静态变量并排定义时，地址按类型宽度相隔：本书示例 int a、int b、static int c 的地址 0x40402c、0x404030、0x404034，两两相隔 4 字节；改成 short 后间隔 2 字节，改成 char 后间隔 1 字节。类型宽度直接体现在内存布局上。<\/p>\n<p>地址固定性分两类：编译加载后，全局变量、静态变量的内存地址与指令偏移都固定，运行过程中不变；局部栈变量在栈帧里分配，栈帧一动地址就跟着动。<\/p>\n<p>2.10 节补出类型的另一层事实：补码表示下，有符号 char 的 0xff 最高位为 1，解释为 -1；同一二进制串也可被解释成无符号大数。比较前若类型不统一，就会出现 -1（0xffffffff）不等于 255（0x000000ff）的争议结果。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n类型字节数以本书示例的 x86-64 平台为准；不同架构或编译器下 long 宽度可能不同，判断时以目标平台 ABI 为准。\n<\/li><li>\n“全局/静态地址固定”指编译期确定、运行期不变；栈变量位置随调用链变化，不代表每次都随机。\n<\/li><li>\n条件去掉会怎样：如果不按类型宽度留间隔，元素边界互相咬尾，读写就会串味；如果比较前不统一类型，补码二义性会留在代码里。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：以为 char 0xff 就是 255；在有符号 char 上它是 -1，与无符号 255 比较不相等。\n<\/li><li>\n反例二：以为局部变量地址和全局变量一样写死在二进制里；栈变量位置要等运行时栈帧搭起来才确定。\n<\/li><li>\n反例三：以为类型只是语法检查标签；拿掉类型宽度，元素间隔、指针步进、栈帧大小全都算不准。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n变量名 vs 变量值：名字挂在地址上，值存在地址指向的内存里；名字不占运行时内存。\n<\/li><li>\n数据段变量 vs 栈变量：前者地址固定、生存期贯穿程序；后者随帧申请回收。\n<\/li><li>\n有符号 vs 无符号：同一串二进制，最高位解释方式不同，得出的数可正可负。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：寄存器与内存地址。\n<\/li><li>\n后置：指针与引用的本质、存储期 static/global/local。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（变量与类型宽度）<\/summary><div class=\"depth-body\"><h1>变量与类型宽度 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要把变量落到内存模型上，先得会：内存按地址编号、读写先报地址；寄存器与内存的分工；补码表示有符号整数的基本规则。再往前需要理解：变量名只是给地址起的别名，运行时不占内存。如果这些缺口没补上，类型宽度、地址固定性、符号争议都会背成条文。<\/p>\n<h2>正向推导<\/h2>\n<p>从内存结构推演。内存条有数据信号线和地址信号线：前者传读写内容，后者指明访问单元。读写前必须先报地址，这是一切内存操作的前提。本书 2.2 节写操作示例 <code>mov DWORD PTR [rip+0x2f18], 0x1<\/code>，方括号内算出目标地址；x86 不能拿裸地址访问内存，rip 存下一条指令地址，0x2f18 是相对 rip 的偏移。<\/p>\n<p>类型宽度决定间隔。本书示例：int 占 4 字节，short 占 2 字节，char 占 1 字节。多个全局/静态变量并排定义时，地址按类型宽度相隔。示例中 int a、int b、static int c 地址为 0x40402c、0x404030、0x404034，两两间隔 4 字节；改成 short 后间隔 2 字节，改成 char 后间隔 1 字节。宽度不是语法标签，它直接写进内存布局。<\/p>\n<p>地址固定性分两类。编译加载后，全局变量和静态变量的地址、指令偏移都固定，运行过程中不变；局部栈变量在栈帧里分配，栈帧随调用链伸缩，地址跟着变。判断一个变量地址是否固定，先看它在数据段还是栈上。<\/p>\n<p>符号争议推演：补码下最高位为 1 的二进制串既可解释成负数，也可解释成无符号大数。有符号 char 的 0xff 最高位为 1，表示 -1；比较前类型统一后，-1（0xffffffff）不等于无符号 255（0x000000ff）。日常多用正数比较，警告常被忽略，碰到最高位为 1 的数值才暴露。<\/p>\n<h2>算例<\/h2>\n<p>自拟间隔推算：int 数组基址 0x2000，元素 0、1、2 的地址依次为 0x2000、0x2004、0x2008；short 数组同基址则为 0x2000、0x2002、0x2004；char 数组为 0x2000、0x2001、0x2002。 自拟符号判断：<code>char x = 0x80;<\/code> 在有符号 char 上最高位为 1，解释为负数 -128；若按 unsigned char 读则是 128。比较前不统一类型，就可能得到与直觉相反的相等判断。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：以为 char 0xff 就是 255；有符号 char 上它是 -1，与无符号 255 不相等。反例二：以为局部变量地址和全局变量一样写死在二进制里；栈变量位置要等栈帧搭起来才确定。反例三：以为类型只服务语法检查；拿掉宽度，元素间隔、指针步进、栈帧大小都算不准。 边界：字节宽度以本书 x86-64 示例为准；long 在不同平台宽度可能不同，判断时以目标平台 ABI 为准。“全局/静态地址固定”指编译期确定、运行期不变，不代表每次进程启动地址完全相同（开启地址随机化时基址会变，相对位置不变）。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nint、short、char 在本书示例中各占几字节？（答案：4、2、1。）\n<\/li><li>\n哪类变量地址编译后固定，哪类随运行变化？（答案：全局/静态固定；栈变量随帧伸缩。）\n<\/li><li>\n有符号 char 0xff 解释成多少？（答案：补码下为 -1。）\n<\/li><li>\n比较两类不同类型数值前应先做什么？（答案：统一两边类型，消除符号二义性。）\n<\/ol>\n<h2>推演延伸：宽度、间隔与符号判断合起来算<\/h2>\n<p>把类型宽度用在数组布局上：int 数组基址 B，元素 i 地址 B+4i；short 数组 B+2i；char 数组 B+i。指针步进按同一规则：类型宽度是多少，加一就前进多少字节。栈帧大小估算也靠宽度：局部变量逐个按自身宽度叠加，再考虑对齐填充（本书示例未展开对齐规则，实际工程需查目标平台 ABI）。<\/p>\n<p>符号判断再走一遍：有符号数最高位是符号位，补码下最高位 1 表示负数。char a=0xff，二进制 11111111，按补码反推：取反加一得 1，所以是 -1；右侧字面量 0xff 按无符号 int 处理为 255。统一类型后比较 -1 与 255，不等。若把 a 改成 unsigned char，同一二进制串解释成 255，比较就相等。争议不在数值本身，而在解释规则。<\/p>\n<p>地址固定性延伸：编译后的二进制里，全局/静态变量偏移写死在指令中；加载进进程后，整套数据段按基址加偏移摆放，开启地址随机化时基址变化，相对间隔不变。栈变量没有编译期固定地址，因为栈帧位置随调用链伸缩；堆块地址由分配器运行时决定。判断“地址会不会变”，先定位变量在数据段、栈还是堆。<\/p>\n<h2>推演延伸：宽度与符号的边界<\/h2>\n<p>类型宽度是平台 ABI 约定：本书示例 int 4 字节、short 2 字节、char 1 字节；换到其他平台 int 宽度可能不同，跨平台代码不能把宽度写死，需要按固定宽度类型声明位宽敏感的数据。<\/p>\n<p>有符号/无符号转换本质是位模式重解释：位串本身不变，变的是最高位的含义。比较前统一类型，就是避免编译器按两种解释规则各算一遍，最后得出互相矛盾的结论。<\/p>\n<p>自拟算例：unsigned char u = 255，整数提升后是 255，与 0xff 相等；有符号 char s = 0xff，整数提升后是 -1，与 0xff 不等。同一位串，差别只在解释规则，不在二进制内容。<\/p>\n<h2>正向推导细化：宽度如何决定偏移与步进<\/h2>\n<p>类型宽度在机器上直接变成地址间隔。逐条推演：<\/p>\n<ol><li>\n定义 <code>int a;<\/code>：编译器按 int 宽度 4 字节在帧上留出 4 字节；相邻变量偏移按宽度累加。\n<\/li><li>\n定义 <code>short b;<\/code>：占 2 字节；<code>char c;<\/code>：占 1 字节。\n<\/li><li>\n数组 stride：int 数组元素间隔 4，short 间隔 2，char 间隔 1；下标 i 的地址 = 基址 + i×宽度。\n<\/li><li>\n指针步进：指针加一前进“指向类型宽度”个字节，不是前进 1 字节。\n<\/li><li>\n对齐填充：相邻字段放不下对齐要求时，中间补填充字节；偏移表要把填充算进去，不能只累加字段宽度。\n<\/li><li>\n符号解释：位串摆好后，最高位按有符号/无符号规则解释；宽度决定占几格，解释规则决定这串二进制读作什么。\n<\/ol>\n<h2>完整算例：一段局部变量的帧内偏移（自拟）<\/h2>\n<p>C 代码：<code>void f(){ short x; char y; int z; }<\/code>（按本书宽度 short 2、char 1、int 4；对齐为自拟 ABI）。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>变量<\/th><th>宽度<\/th><th>偏移（相对 rbp，自拟）<\/th><th>占用<\/th><\/tr><\/thead><tbody><tr><td>z<\/td><td>4<\/td><td>rbp-4<\/td><td>4 字节<\/td><\/tr><tr><td>x<\/td><td>2<\/td><td>rbp-6<\/td><td>2 字节<\/td><\/tr><tr><td>y<\/td><td>1<\/td><td>rbp-7<\/td><td>1 字节<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>rbp-8<\/td><td>1 字节对齐<\/td><\/tr><\/tbody><\/table><\/div>\n<p>帧内局部区粗算 8 字节；真实偏移由编译器按对齐规则排列，顺序可能与源码不同。类型宽度决定每格多大，但“放哪一格”还要再过一遍对齐规则。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“char 一定是 1 字节且一定有符号”<\/strong>：反例——1 字节是本书示例宽度；char 默认有/无符号由平台 ABI 决定，同一位串按 unsigned char 解释结果不同。\n<\/li><li>\n<strong>“类型决定变量存在哪块内存”<\/strong>：反例——类型只决定宽度和解释规则；存放位置由存储期决定，int 可以在栈、数据段或堆上。\n<\/li><li>\n<strong>“short 数组相邻元素间隔 4 字节”<\/strong>：反例——间隔等于自身宽度 2 字节；把 int 的宽度套到 short 上，算出来的地址会整体错位。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n同一二进制串读作 -1 还是 255，由什么决定？（答案：有符号/无符号解释规则，位串本身不变。）\n<\/ol><\/div><\/details>", "c04": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.43<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">变量与类型宽度<\/a><\/span><\/div><h1>指针与引用的本质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>问题<\/h2>\n<p>指针为什么被当成 C/C++ 最难的部分？把“指向”翻译成机器动作，指针和引用到底分别是什么？它们的风险出在哪一步？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n指针变量保存内存地址；对指针做 * 操作，就是按该地址读写内存。\n<\/li><li>\n64 位 CPU 上内存地址占 8 字节，所以各类指针变量宽度都是 8 字节。\n<\/li><li>\n引用在底层实现上与指针完全相同，可理解为不能改绑的指针常量。\n<\/li><li>\n指针操作不是指针变量专利：普通变量、立即数地址都可以做 * 操作。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 2.4 节比较普通变量、char<em>、short<\/em>、int (*a)[3]、int**：各类指针变量的读写汇编与普通变量没有区别；所谓“指向”，描述的是指针里存的值是某个内存地址。地址宽度 8 字节，所以 char<em>、int<\/em>、int** 占同样长度。<\/p>\n<ul><li>\n操作分两步。以 <code>int<em> p = &amp;a; <\/em>p = 2;<\/code> 为例：第一步锁定目标地址，从 p 所在内存读出 0x1234，这就是目标位置；第二步把 2 写入 0x1234。读操作 <code>rax = *p<\/code> 按同样路径，先读目标地址的值，再搬进寄存器。\n<\/ul>\n<p>2.5 节进一步推演：只要知道变量地址，就能 <code><em>(int<\/em>)&amp;a = 1<\/code> 直接赋值；类对象的 <code>. <\/code> 操作和 <code>-&gt;<\/code> 操作，本质也是同一套地址读写。风险链条是：拿到私有变量地址后，可不受语法限制读写；无 MMU 的环境（早期 DOS、部分单片机）里程序能扫描整个内存。本书因此提到 C#、Java、JavaScript、Python、Rust 干脆禁用裸内存地址和指针。<\/p>\n<p>2.8 节对照引用与指针：引用变量 r 实际定义了一个指向 a 的指针 p，对 r 的读改写就是对 p 的 <em> 读写，两者汇编指令完全相同。语法层区别有四条：引用写法简洁、不用加 <\/em>；引用不能赋 NULL；引用不能改绑到另一个变量；不存在“引用的引用”。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n指针 8 字节是 64 位平台结论；32 位平台地址 4 字节，宽度随地址总线变化。\n<\/li><li>\n“普通变量也能做指针操作”是机器能力描述，不代表工程上应该绕过封装；私有属性的访问限制在语法层，地址一旦泄露限制就落空。\n<\/li><li>\n条件去掉会怎样：如果 * 操作不分两步，先取地址再读写，地址和数据就会混在一个动作里；如果引用底层另搞一套传递约定，调用机制就要多一套规则。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：以为指针存的是它指向的值；指针存的是坐标，值要再沿坐标读一次。\n<\/li><li>\n反例二：以为引用和指针是两套底层实现；本书对照汇编，两者指令完全相同。\n<\/li><li>\n反例三：以为有了指针更安全；它只是多一条绕过语法约束的读写渠道，出 bug 时更难定位。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n指针 vs 数组：指针保存地址，数组是一段连续内存；数组传参时退化为首地址（见数组与越界）。\n<\/li><li>\n传值 vs 传指针：前者送值、改副本；后者送地址、按地址写回本体。\n<\/li><li>\n引用 vs 指针：底层相同，差别全在语法约束（NULL、改绑、多层级）。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：变量与类型宽度。\n<\/li><li>\n后置：数组与数组越界、参数传递与栈帧。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（指针与引用的本质）<\/summary><div class=\"depth-body\"><h1>指针与引用的本质 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要拆解指针，先得会：变量是地址别名；类型宽度与内存间隔；寄存器间接寻址的方括号写法。再往前需要理解：* 操作是“取地址—读写目标”两个独立动作。如果把指针当成一种特殊变量类型去背，就会忽略它存的就是普通地址这一事实。<\/p>\n<h2>正向推导<\/h2>\n<p>本书 2.4 节对比普通变量、char<em>、short<\/em>、int (*a)[3]、int**：各类指针变量的读写汇编与普通变量没有区别。所谓“指向”，描述的是指针里存的值是某个内存地址。64 位下内存地址占 8 字节，所以无论哪种指针，宽度都是 8 字节；32 位平台则是 4 字节。<\/p>\n<ul><li>\n操作分两步。以 <code>int<em> p = &amp;a; <\/em>p = 2;<\/code> 为例：第一步锁定目标地址，从 p 所在内存读出 0x1234，这就是要访问的目标位置；第二步把 2 写入 0x1234。读操作 <code>rax = *p<\/code> 按同样路径，先读目标地址的值，再搬进寄存器。把两步拆开看，指针没有魔法，就是地址中转一次。\n<\/ul>\n<p>2.5 节推演更一般的情况：只要知道变量地址，就能 <code><em>(int<\/em>)&amp;a = 1<\/code> 直接赋值，甚至可以对立即数地址操作；类对象的 <code>. <\/code> 与 <code>-&gt;<\/code> 本质也是同一套地址读写。风险链条随之展开：拿到私有变量地址后，可不受语法限制读写；无 MMU 环境（早期 DOS、部分单片机）程序能扫描整个内存。本书因此提到 C#、Java、JavaScript、Python、Rust 禁用裸内存地址和指针。<\/p>\n<p>2.8 节对照引用：引用变量 r 实际定义了一个指向 a 的指针 p，对 r 的读改写就是对 p 的 <em> 读写，汇编指令完全相同。语法层四条区别：引用不用加 <\/em>，写法简洁；引用不能赋 NULL；引用不能改绑到另一个变量；不存在“引用的引用”。本书把引用总结为指针常量一类机制。<\/p>\n<h2>算例<\/h2>\n<p>自拟指针步进：int<em> p 指向 int 数组，p+1 前进 4 字节；char<\/em> q 前进 1 字节；long<em> r 前进 8 字节。基址 0x3000 时，int<\/em> 下一步在 0x3004，char<em> 下一步在 0x3001。 自拟双重访问：<code>int x = 5; int<\/em> px = &amp;x; int<strong> ppx = &amp;px;<\/code> 读 <\/strong>ppx 的路径是：ppx 里存 px 的地址 → 从该地址读出 px 的值（x 的地址）→ 再按 x 地址读出 5。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：以为指针存的是指向的值；指针存坐标，值要再沿坐标读一次。反例二：以为引用和指针是两套底层实现；对照汇编，两者指令完全相同。反例三：以为有指针就更安全；它只是多一条绕过语法约束的读写渠道，出 bug 更难定位。 边界：8 字节宽度是 64 位结论；“普通变量也能做指针操作”是机器能力描述，不等于工程上应绕过封装。私有属性限制在语法层，地址一旦泄露，硬件并不替你守住访问边界。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n*p = 2 的两步是什么？（答案：先读出 p 中目标地址，再把 2 写入该地址。）\n<\/li><li>\n64 位下 char* 和 int** 各占几字节？（答案：都是 8 字节。）\n<\/li><li>\n引用与指针在汇编层面是否相同？（答案：相同；差别在语法约束。）\n<\/li><li>\n引用有哪三条语法限制？（答案：不能赋 NULL；不能改绑；没有引用的引用。）\n<\/ol>\n<h2>推演延伸：两层间接与地址泄露后果<\/h2>\n<p>顺着指针链推：<code>int x=5; int* px=&amp;x; int<strong> ppx=&amp;px;<\/code> 读 <\/strong>ppx 要走两层——ppx 存 px 的地址，读出 px 后再取 px 里 x 的地址，最后读 x 的值。多层指针只是把“取地址再读写”重复多次，每层都遵守同一条规则。<\/p>\n<p>地址泄露的后果按链条展开：拿到私有变量地址，语法层的 private 限制失效，可直接按地址读写；拿到栈上局部变量地址，可沿栈帧回溯相邻单元；无 MMU 环境下程序能扫遍整个内存。本书据此说明现代语言为何禁用裸指针：把地址暴露给程序员，等于给绕过封装、越界改写留了入口。<\/p>\n<p>引用侧再补一条：引用初始化后绑定对象不变，编译器在需要时把它落成指针常量——地址值不可改，所指内容可读可写。这解释引用三条语法限制的机器根源：不能赋 NULL 是因为必须绑定合法对象；不能改绑是因为常量地址不重写；没有引用的引用是因为不存在“指向常量指针的指针”这层对应物。<\/p>\n<h2>推演延伸：指针运算与多层间接的边界<\/h2>\n<p>指针加一按指向类型的宽度步进，不是加一个字节；void* 没有类型宽度，不能直接做加法。两个同类型指针相减得到元素个数，单位是元素而不是字节，乘以宽度才是字节距离。<\/p>\n<p>多层解引用每一层都先取地址再访问；断掉其中一层（存了野地址），后续读写全部落在非法单元。顺着链往上回溯，先检查最外层地址是否合法，再一层层往里走。<\/p>\n<p>引用边界：引用必须在定义处绑定，之后不能改指别处；对引用取地址得到所指对象的地址。const 引用绑定后不能经它改对象，但所指对象可由其他途径修改。自拟对照：<code>int a=3, b=5; int* p=&amp;a; p=&amp;b;<\/code> 指针可以改绑；<code>int&amp; r=a; r=b;<\/code> 是把 b 的值写入 a，不是让 r 改绑到 b。<\/p>\n<h2>正向推导细化：解引用两步在寄存器上的轨迹<\/h2>\n<p>以 <code>int a = 5; int<em> p = &amp;a; <\/em>p = 2;<\/code> 为底，逐寄存器推演：<\/p>\n<ol><li>\n<code>lea<\/code>/取地址：a 的内存编号（本书示例 0x1234）被算出，写入 p 自己所在单元（示例 0x1238）。\n<\/li><li>\n执行 <code>*p = 2<\/code> 第一步：从 p 的单元读出 0x1234，放进某寄存器作为目标地址。\n<\/li><li>\n第二步：把数值 2 写入 0x1234 指向的单元，即改写 a；p 里存的地址值本身不变。\n<\/li><li>\n读操作 <code>rax = *p<\/code>：先从 p 读出目标地址，再按地址把值读进 rax。\n<\/li><li>\n引用路径：<code>int&amp; r = a; r = 2;<\/code> 生成代码与指针相同——r 背后落一个指针常量，写 r 就是按该地址写 a。\n<p>每一层间接都重复“先取地址，再读写目标”；地址中转一次，机器上就是一条读指针加一条按地址访存。<\/p>\n<\/ol>\n<h2>完整算例：两层指针的地址轨迹（自拟）<\/h2>\n<p>C 代码：<code>int x = 5; int* px = &amp;x; int** ppx = &amp;px;<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>层级<\/th><th>单元<\/th><th>存放内容<\/th><th>地址（示例）<\/th><\/tr><\/thead><tbody><tr><td>x<\/td><td>普通变量<\/td><td>值 5<\/td><td>0x1000<\/td><\/tr><tr><td>px<\/td><td>指针<\/td><td>&amp;x = 0x1000<\/td><td>0x1008<\/td><\/tr><tr><td>ppx<\/td><td>双重指针<\/td><td>&amp;px = 0x1008<\/td><td>0x1010<\/td><\/tr><\/tbody><\/table><\/div>\n<p>读 <code>**ppx<\/code>：先从 0x1010 读出 0x1008，再从 0x1008 读出 0x1000，最后从 0x1000 读出 5。断在任何一层，后续都落到非法单元。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“数组名就是指针”<\/strong>：反例——数组名在 sizeof、取地址时表现为整段数组；只有作函数参数时才退化为首地址，两种场合行为不同。\n<\/li><li>\n<strong>“引用是底层新建的第三套别名存储”<\/strong>：反例——对照汇编，引用与指针指令完全相同，通常落成不能改绑的指针常量，没有独立机器机制。\n<\/li><li>\n<strong>“指针可以随便指向一个不存在的地址”<\/strong>：反例——未映射地址读写触发段错误；保存野地址不代表那里有合法对象。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n多层指针解引用每一步做什么？（答案：每层先读出所存地址，再按该地址访问目标单元。）\n<\/ol><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.54<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">指针与引用的本质<\/a><\/span><\/div><h1>数组与数组越界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>问题<\/h2>\n<p>数组语法看起来和普通变量差不多，为什么它是越界故障和栈攻击的重灾区？传数组给函数时，编译器到底复制了什么？越界踩到不同方向的内存，后果为什么不一样？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n数组是一段连续内存；元素间隔等于自身类型宽度：int 间隔 4 字节，char 间隔 1 字节。\n<\/li><li>\n数组作参数传递时，不构建临时数组，只传递首地址；函数内读写等价于指针 * 操作。\n<\/li><li>\n多维数组在物理内存条上仍是一维连续内存，只是索引方式不同。\n<\/li><li>\n向低端越界可能暂写“无主之地”；向高端越界会踩到主调栈帧和返回地址，风险最高。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 2.6 节：一维数组按类型宽度连续摆放，int 数组元素间隔 4 字节，char 数组间隔 1 字节。把数组作函数参数时，编译器不会在栈上复制一份相同大小的数组，而是把首地址传给被调函数；函数内改元素会落回原数组。操作系统、协议栈等开源软件也用这种传指针形式，通常另带一个长度参数防越界。二维、三维数组在 CPU 眼里都按一维连续块处理，索引折成一维下标。<\/p>\n<p>2.7 节用实验推演越界方向。<code>long a[2];<\/code> 向下标 -1、-2 赋值，属于向低地址越界；若越界区域是“无主之地”，读写不影响别人，程序暂时无恙。向高地址方向越界时，栈上方就是主调 main 的栈帧和返回地址；本书把 a[3] 写成恶意函数地址后，func1 返回时不再回 main，转而执行恶意代码。若越界写入的是非法数值，CPU 跳到没有合法指令的内存处，通常触发 Segmentation Fault。<\/p>\n<p>工程上越界很隐蔽：strcpy、strcat、memcpy、memmove，以及按下标写全局变量，都是高发位置。本书编程轶事提到一个随机、不可复现的故障，全部门花一个多月才定位到数组越界。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n连续内存布局以本书 x86-64 示例为准；元素宽度随平台类型变化，但“间隔=类型宽度”的规则通用。\n<\/li><li>\n数组名在传参场景退化为首地址；单独在定义数组的函数里，数组名仍代表整块连续内存。\n<\/li><li>\n条件去掉会怎样：如果传参复制整个数组，大数组每次调用都要在栈上拷贝，栈空间和耗时都难以承受；如果越界边界有硬件检查，这类故障会当场暴露而不是潜伏。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：以为数组传参会复制整个数组；实际只传首地址，函数内改动直接影响原数组。\n<\/li><li>\n反例二：以为越界立刻崩溃；踩空闲内存时可能长期静默，踩到返回地址才爆发。\n<\/li><li>\n反例三：以为二维数组在内存里排成表格；物理上仍是一维块，表格是索引视角。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n数组 vs 指针：数组是连续内存块，指针存地址；传参时数组名退化成首地址指针。\n<\/li><li>\n低端越界 vs 高端越界：前者踩低方向空闲内存，暂时可能安全；后者踩主调栈帧和返回地址，直接威胁控制流。\n<\/li><li>\n越界读 vs 越界写：读越界可能泄露数据，写越界才会篡改布局；二者风险等级不同。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：指针与引用的本质。\n<\/li><li>\n后置：参数传递与栈帧、堆与栈的区别。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（数组与数组越界）<\/summary><div class=\"depth-body\"><h1>数组与数组越界 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要推演数组布局与越界后果，先得会：连续内存按类型宽度间隔；指针保存首地址、* 操作按地址读写；栈帧上局部变量、保存的 rbp、返回地址的排列顺序。再往前需要理解：传数组参数不传整块，只传坐标。<\/p>\n<h2>正向推导<\/h2>\n<p>本书 2.6 节推演一维数组：元素按类型宽度连续摆放，int 间隔 4 字节，char 间隔 1 字节。数组作函数参数时，编译器不在栈上复制相同大小的临时数组，而是把首地址传给被调函数；函数内改元素落回原数组。操作系统、协议栈等开源软件也用这种传指针形式，通常另带长度参数防越界。二维、三维数组在内存条上仍是一维连续块，多维只是索引折成一维下标的方式。<\/p>\n<p>2.7 节按方向推演越界。<code>long a[2];<\/code> 向下标 -1、-2 赋值，是向低地址越界；若踩中的是“无主之地”，读写不影响别人，程序暂时无恙。向高地址方向越界时，栈上方就是主调 main 的栈帧和返回地址。本书把 a[3] 写成恶意函数地址后，func1 返回时不再回 main，转而执行恶意代码。链路是：越界写覆盖返回地址 → ret 取被篡改地址 → rip 跳到恶意代码。若越界写入非法数值，CPU 跳到没有合法指令的内存处，通常触发 Segmentation Fault。<\/p>\n<p>工程层面，越界隐蔽且难定位：strcpy、strcat、memcpy、memmove，以及按下标写全局变量都是高发位置。本书轶事里一个随机、不可复现的故障，全部门花一个多月才追到数组越界。越界读可能泄露数据，越界写才会篡改布局，二者风险等级不同。<\/p>\n<h2>算例<\/h2>\n<p>自拟布局推算：<code>long a[2];<\/code> 每个 long 8 字节，数组局部区 16 字节；栈帧向上依次是保存的旧 rbp（8 字节）、返回地址（8 字节）。若 a 基址为 0x5000，a[0] 在 0x5000、a[1] 在 0x5008；a[2] 已越过数组边界，再往上就是旧 rbp 与返回地址所在单元。 自拟传参推演：<code>void f(int a[]) { a[1] = 9; }<\/code> 内的 <code>a[1]<\/code> 等价 <code>*(a + 1)<\/code>，a 是首地址，步进 4 字节；调用方原数组第二个元素被改写。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：以为数组传参会复制整个数组；实际只传首地址，函数内改动直接影响原数组。反例二：以为越界立刻崩溃；踩空闲内存时可能长期静默，踩到返回地址才爆发。反例三：以为二维数组内存排成表格；物理上仍是一维块。 边界：连续布局以本书 x86-64 示例为准；元素宽度随平台类型变化，但“间隔=类型宽度”规则通用。数组名在定义它的函数里代表整块内存，进入传参场景后退化为首地址指针。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n数组传参传递的是什么？（答案：数组首地址，不建临时数组。）\n<\/li><li>\n高端越界为什么比低端越界危险？（答案：上方是主调栈帧和返回地址，改写后控制流可被劫持。）\n<\/li><li>\n多维数组在物理内存里是什么形态？（答案：一维连续内存，索引方式不同。）\n<\/li><li>\n越界写返回地址后，ret 会发生什么？（答案：按被篡改地址送 rip，跳到非预期代码。）\n<\/ol>\n<h2>推演延伸：越界方向与栈帧层级<\/h2>\n<p>按栈帧从上到下（低地址方向）排：局部变量区、保存的旧 rbp、返回地址。低端越界往局部变量下方空闲区走，高端越界往旧 rbp 和返回地址方向走。本书实验里 a[3] 越过 a[1] 后先碰到旧 rbp 区域，再往上就是返回地址；改写返回地址后，ret 取被篡改值送 rip，控制流离开原路径。<\/p>\n<p>传参本质再推：数组名在函数参数位置退化为首地址，sizeof 拿到的是指针宽度而不是整块数组长度；所以 C 语言数组传参常另带 length 参数，就是弥补长度信息丢失。多维数组传参时，第一维可以省略，后续维度必须写定，因为编译器算下标要知道每行宽度。<\/p>\n<p>越界隐蔽性来自两点：一是踩空闲内存时结果“看起来正常”，故障要等冲突才爆发；二是越界写破坏的可能是返回地址、相邻变量等多处，现场被覆盖后难以回溯。本书轶事里一个多月才定位的故障，正说明靠猜排越界效率极低，要靠边界检查、安全字符串函数和编译器防护工具缩小入口。<\/p>\n<h2>推演延伸：数组布局与越界方向补算<\/h2>\n<p>多维数组按行折成一维：2×3 的 int 数组，行 i 列 j 的元素偏移是 (i<em>3+j)<\/em>4 字节；下标运算先折行再折列，编译器据此把二维下标换算成一维地址。<\/p>\n<p>越界方向按栈帧层级看：低地址一侧通常通向栈帧更深处，高地址一侧先碰到旧 rbp 和返回地址；谁在上谁在下由栈向低地址生长的方向确定。本书实验高端越界先碰栈帧基准区域，再往上就是返回地址。<\/p>\n<p>失败对照：字符串越界写可能覆盖相邻字符串或返回地址；C 标准库这类函数不自带长度检查，调用方必须保证缓冲区够大。自拟算例：int a[4] 基址 0x1000，元素地址依次 0x1000、0x1004、0x1008、0x100c；a[4] 越界单元是 0x1010，再往上属于相邻栈帧数据。<\/p>\n<h2>正向推导细化：数组下标到偏移的换算<\/h2>\n<p>以 <code>int a[2];<\/code> 为底，按本书模型推演：<\/p>\n<ol><li>\n基址记为 B；int 宽度 4，元素 0 地址 B，元素 1 地址 B+4。\n<\/li><li>\n下标 i 地址 = B + i×4；编译器把 <code>a[i]<\/code> 翻译成基址加偏移的访存。\n<\/li><li>\n传参后退化为首地址：函数内拿到的是 B，整段数组长度信息丢失，sizeof 拿到的是指针宽度。\n<\/li><li>\n越界方向：低端（更低地址）通向栈帧深处；高端先碰旧 rbp，再往上是返回地址。\n<\/li><li>\n越界写 a[2]、a[3] 依次落到相邻栈帧数据；改写返回地址后，ret 按被篡改值送 rip。\n<p>偏移换算和指针步进是同一条规则：下标乘宽度，再加基址。<\/p>\n<\/ol>\n<h2>完整算例：越界落点表（自拟，基址 0x2000）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>下标<\/th><th>地址<\/th><th>落点<\/th><\/tr><\/thead><tbody><tr><td>a[0]<\/td><td>0x2000<\/td><td>数组第 0 元素<\/td><\/tr><tr><td>a[1]<\/td><td>0x2004<\/td><td>数组第 1 元素<\/td><\/tr><tr><td>a[2]<\/td><td>0x2008<\/td><td>越界：相邻栈帧数据<\/td><\/tr><tr><td>a[3]<\/td><td>0x200c<\/td><td>越界：旧 rbp / 返回地址区域<\/td><\/tr><\/tbody><\/table><\/div>\n<p>int 宽度 4，间隔 4 字节；高端越界先碰栈帧基准，再碰返回地址。字符串类函数不自带长度检查，缓冲区够不够大由调用方保证。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“越界写一定会立刻崩溃”<\/strong>：反例——写到无主空闲内存时程序暂时正常；踩到返回地址、旧 rbp 等关键数据后才出故障，故障可能延迟爆发。\n<\/li><li>\n<strong>“二维数组在内存里排成表格”<\/strong>：反例——内存条是一维的，多维数组按行折成连续存放，靠下标规则换算偏移。\n<\/li><li>\n<strong>“数组传参时编译器复制了一份”<\/strong>：反例——只传首地址，函数内改动直接落回原数组，栈上不建临时副本。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n数组作参数为什么常要另传长度？（答案：传参退化为首地址，数组长度信息在函数内丢失。）\n<\/ol><\/div><\/details>", "c06": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.81<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">汇编指令与栈帧雏形<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">数组与数组越界<\/a><\/span><\/div><h1>参数传递与栈帧<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>问题<\/h2>\n<p>传值、传指针、传引用在写法上不同，CPU 层面差别在哪？一次函数调用前后，栈上先后压入和弹出了什么？返回地址为什么是栈上最敏感的数据？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n传值、传指针、传引用在 CPU 层面都是把数值送进寄存器；被调函数在栈帧里保存参数副本与局部变量。\n<\/li><li>\nx86-64 示例前三个参数走 rdi、rsi、rdx（低 32 位 edi、esi、edx）。\n<\/li><li>\n栈帧序言：push rbp 保存主调基准，mov rbp, rsp 对齐基准，sub rsp, N 分配局部空间。\n<\/li><li>\n结语：pop rbp 恢复基准，ret 按栈顶返回地址送入 rip，跳回主调打断点。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 3.1 节对比两类函数：func1(long x, long y, long z) 形参为数值，func2(long<em> x, long<\/em> y, long* z) 形参为指针。调用前参数经 mov 进寄存器：传值送变量值，传指针送变量地址。进入函数后寄存器还要留作他用，参数先拷进栈帧 [rbp-8]、[rbp-16]、[rbp-24]，即形式参数克隆体。<\/p>\n<p>传值路径：函数内改克隆体，只动栈帧副本，主调栈帧里的本体没被触碰，返回后外部实参不变。传指针路径：栈帧副本保存外部变量地址，<code>*x = 0<\/code> 先读出外部地址，再按地址写回本体，外部变量被改掉。传引用生成的指令与传指针完全相同，属于语法糖。寄存器装不下的复杂参数改走堆栈，载体不同、原理一致。<\/p>\n<p>3.2 节拆函数括号：push rbp 存主调基准，mov rbp, rsp 对齐基准线，sub 下压栈顶给局部变量分配空间；本书 msvc 示例两个 int 局部变量相对基准偏移 4 和 8。3.3 节跟完整往返：call 先压返回地址再跳转；结语 mov esp, ebp 把栈顶降回基准，pop rbp 恢复旧基准，ret 把返回地址送 rip。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n寄存器传参顺序与名称是 x86-64 System V / 本书示例约定；Windows x64 或 ARM 平台的传参寄存器不同，读汇编时先确认调用约定。\n<\/li><li>\n栈帧偏移随局部变量数量和类型宽度变化；示例偏移只对应示例代码，不能套到别的函数。\n<\/li><li>\n条件去掉会怎样：如果序言不保旧 rbp，返回后主调基准丢失；如果返回地址不压栈，ret 找不到归路；如果参数不拷副本，寄存器后续使用就会冲掉实参。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：以为传引用是独立第三种机制；机器层面与传指针同一条路径。\n<\/li><li>\n反例二：以为形参与实参共享一份存储；传值时帧上是独立副本。\n<\/li><li>\n反例三：以为函数返回后栈帧内容还能安全使用；帧空间随之回收，悬挂指针指向已回收区域。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n传值 vs 传指针：送值还是送地址，决定函数内能不能改到本体。\n<\/li><li>\n形参副本 vs 本体：副本在被调栈帧，本体在主调栈帧，两个位置不重叠。\n<\/li><li>\n栈帧 vs 寄存器：寄存器暂存快值，栈帧保存需要回看或跨指令保留的状态。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：汇编指令与栈帧雏形、数组与数组越界。\n<\/li><li>\n后置：堆与栈的区别、对象模型 this 与虚函数。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（参数传递与栈帧）<\/summary><div class=\"depth-body\"><h1>参数传递与栈帧 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要还原一次函数调用的栈帧，先得会：寄存器传参路径；栈向低地址生长；push/mov/sub/pop/ret 的基本动作；局部变量相对 rbp 寻址。再往前需要分清：形参副本在被调栈帧，实参本体在主调栈帧，两个位置不重叠。<\/p>\n<h2>正向推导<\/h2>\n<p>本书 3.1 节对比两类函数：func1(long x, long y, long z) 形参为数值，func2(long<em> x, long<\/em> y, long* z) 形参为指针。调用前参数经 mov 进寄存器：x86-64 示例前三个走 rdi、rsi、rdx（低 32 位 edi、esi、edx）。传值送变量值，传指针送变量地址。<\/p>\n<p>进入函数后寄存器还要留作他用，参数先拷进栈帧 [rbp-8]、[rbp-16]、[rbp-24]，即形式参数克隆体。传值路径：函数内改克隆体，只动栈帧副本，主调栈帧本体没被触碰，返回后外部实参不变。传指针路径：栈帧副本保存外部变量地址，<code>*x = 0<\/code> 先读出外部地址，再按地址写回本体，外部变量被改掉。传引用生成的指令与传指针完全相同，属于语法糖。寄存器装不下的复杂参数改走堆栈，载体不同、原理一致。<\/p>\n<p>3.2 节拆函数括号：push rbp 存主调基准，mov rbp, rsp 对齐基准线，sub 下压栈顶给局部变量分配空间。本书 msvc 示例两个 int 局部变量相对基准偏移 4 和 8。3.3 节跟完整往返：call 先压返回地址再跳转；结语 mov esp, ebp 把栈顶降回基准，pop rbp 恢复旧基准，ret 把返回地址送 rip，跳回主调打断点。<\/p>\n<p>栈帧布局按本书示例自上而下（低地址方向）：局部变量区 → 保存的旧 rbp → 返回地址。理解这条顺序，才能判断越界写先踩到哪一层。<\/p>\n<h2>算例<\/h2>\n<p>自拟栈帧推算：函数内 <code>long a[2];<\/code> 局部区 16 字节；序言压入旧 rbp 8 字节，call 压入返回地址 8 字节。整帧从局部变量区到返回地址共 32 字节（不含对齐）。若局部变量 a 基址 0x5000，a[0]=0x5000、a[1]=0x5008，旧 rbp 在 0x5010，返回地址在 0x5018。 自拟传参判断：<code>void f(int x) { x = 9; }<\/code> 调用 <code>f(n);<\/code> 后 n 不变，因为 x 是帧上副本；<code>void g(int<em> p) { <\/em>p = 9; }<\/code> 调用 <code>g(&amp;n);<\/code> 后 n 变 9，因为按地址写回本体。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：以为传引用是独立第三种机制；机器层面与传指针同一路径。反例二：以为形参与实参共享一份存储；传值时帧上是独立副本。反例三：以为函数返回后栈帧内容还能安全使用；帧空间随之回收，悬挂指针指向已回收区域。 边界：寄存器传参顺序与名称是本书 x86-64 约定；Windows x64 或 ARM 平台传参寄存器不同，读汇编先确认调用约定。栈帧偏移随局部变量数量和类型宽度变化，示例偏移不能套到别的函数。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n前三个参数在示例中走哪三个寄存器？（答案：rdi、rsi、rdx。）\n<\/li><li>\n传值为什么改不动外部实参？（答案：函数内改的是栈帧副本，本体在主调栈帧。）\n<\/li><li>\n栈帧序言三条关键指令？（答案：push rbp；mov rbp, rsp；sub rsp, N。）\n<\/li><li>\nret 从哪里取返回地址？（答案：栈顶保存的返回地址，送入 rip。）\n<\/ol>\n<h2>推演延伸：栈帧字节估算与传参对照<\/h2>\n<p>估算一帧：局部变量按宽度叠加，加上 call 压入的返回地址 8 字节、序言保存的旧 rbp 8 字节，再算对齐填充。示例 <code>long a[2]<\/code> 局部区 16 字节，整帧至少 32 字节；若再加一个 int 参数副本，帧上再占 4 字节（可能对齐到 8）。<\/p>\n<p>传值与传指针对照成表：传值送变量值，帧上建副本，函数内改动隔离在副本；传指针送变量地址，帧上存地址，* 操作沿地址写回本体；传引用生成代码同传指针，语法层提供别名约束。复杂参数（大对象）寄存器装不下时走堆栈，本质仍是在主调与被调之间传递信息载体。<\/p>\n<p>调用约定边界：本书示例是 x86-64 System V 风格，前三个参数 rdi、rsi、rdx；Windows x64 用 rcx、rdx、r8、r9；ARM 用 r0–r3。读别人汇编先确认平台约定，不要把寄存器名字当成通用规则。栈帧偏移也随变量数量、类型、对齐变化，示例偏移只对示例代码成立。<\/p>\n<h2>推演延伸：栈帧估算与调用约定边界<\/h2>\n<p>帧大小粗算：返回地址 8 字节 + 旧 rbp 8 字节 + 局部变量与参数副本按宽度叠加，再补对齐填充。示例 long a[2] 局部区 16 字节，整帧至少 32 字节；再加参数副本时按各自宽度逐格叠加。<\/p>\n<p>传参寄存器不够用时：超出约定数量的参数走栈，主调在栈上留出位置，被调从栈上读取；返回值放约定寄存器，超大返回对象可能经隐藏指针回写到主调提供的空间。<\/p>\n<p>失败对照：跨调用约定混编，比如按另一种约定调用本平台函数，会导致栈上参数错位、栈顶不平，返回后地址错乱；保持调用两边同一套约定是栈帧能对上的前提。平台之间寄存器名字、栈清理责任方都可能不同。<\/p>\n<h2>正向推导细化：参数从寄存器到栈帧副本<\/h2>\n<p>以 <code>func1(long x, long y, long z)<\/code> 为底，按本书 x86-64 示例推演：<\/p>\n<ol><li>\n调用前：参数经 mov 送进 rdi、rsi、rdx（低 32 位 edi、esi、edx）；传值送变量值，传指针送变量地址。\n<\/li><li>\n进函数序言后，寄存器要留作他用，参数被拷进栈帧：x → [rbp-8]，y → [rbp-16]，z → [rbp-24]。\n<\/li><li>\n函数内改形参：只动这些副本；传值时主调栈帧里的本体不被触碰。\n<\/li><li>\n传指针时：副本里存的是外部地址，<code>*x = 0<\/code> 先读副本得地址，再按地址写回本体。\n<\/li><li>\n返回值放 rax；帧收尾把栈顶降回基准，pop rbp，ret 跳回。\n<p>参数先进寄存器暂存，再落栈帧副本；栈帧上每个参数副本占一个 long（8 字节）格位。<\/p>\n<\/ol>\n<h2>完整算例：三参数函数栈帧表（自拟）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>偏移（相对 rbp）<\/th><th>内容<\/th><th>谁写入<\/th><\/tr><\/thead><tbody><tr><td>rbp+8<\/td><td>返回地址<\/td><td>call 压入<\/td><\/tr><tr><td>rbp+0<\/td><td>保存的旧 rbp<\/td><td>push rbp<\/td><\/tr><tr><td>rbp-8<\/td><td>形参 x 副本<\/td><td>序言从 rdi 拷入<\/td><\/tr><tr><td>rbp-16<\/td><td>形参 y 副本<\/td><td>序言从 rsi 拷入<\/td><\/tr><tr><td>rbp-24<\/td><td>形参 z 副本<\/td><td>序言从 rdx 拷入<\/td><\/tr><\/tbody><\/table><\/div>\n<p>帧大小粗算：返回地址 8 + 旧 rbp 8 + 三个 long 副本 24 = 40 字节，再加局部变量与对齐填充。参数超出寄存器约定数量时，多余参数走栈传递。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“形参和实参是同一个变量”<\/strong>：反例——传值时栈帧里是独立副本，改副本不影响本体；两者在主调和被调两个帧上，位置不重叠。\n<\/li><li>\n<strong>“所有参数都走寄存器”<\/strong>：反例——超出约定寄存器数量、或尺寸过大的参数改走堆栈，载体不同但传递原理一致。\n<\/li><li>\n<strong>“栈帧大小就是局部变量字节数之和”<\/strong>：反例——还要加返回地址、旧 rbp 保存区和对齐填充，只加局部变量会算小一帧。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n传引用生成的代码和哪种传递相同？（答案：传指针；差别只在语法约束，不在机器动作。）\n<\/ol><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.105<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">参数传递与栈帧<\/a><\/span><\/div><h1>堆与栈的区别<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>问题<\/h2>\n<p>栈和栈上变量大家都写过，堆也常听，二者到底差在哪？为什么栈调用完自动回收，堆却要 free/delete？递归太深打爆的是哪一块？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n栈（stack）是线程私有、随函数调用自动伸缩的内存，生长方向由高地址向低地址。\n<\/li><li>\n堆（heap）是程序员手动申请释放、可多线程共享的内存，生长方向由低地址向高地址。\n<\/li><li>\n栈记录函数返回地址、提供临时变量空间；申请释放只需移动 rsp，往往一条指令完成。\n<\/li><li>\n堆靠 malloc、calloc、realloc、new 申请，free、delete 释放；多次分配释放后会出现内存碎片，忘记释放即内存泄漏。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 3.6 节先厘清命名：stack 译“栈”，heap 译“堆”，二者不是一回事。每个线程都有自己的栈：主线程一个栈，新建线程由操作系统准备同等大小的栈内存。栈上记录返回地址、放临时变量；函数调用时申请栈内存，返回时释放，只移动 rsp。递归示例中局部变量 a 的地址逐层降低，变量间隔固定 32（0x20）字节，验证栈由高地址向低地址生长。<\/p>\n<p>堆空间通常大得多，用来放较大数据。申请是显式的：malloc/calloc/realloc 或 new 拿到块地址，free/delete 归还；块可被多个线程访问。堆由低地址向高地址生长；malloc/free 本身是复杂管理函数，多次分配释放后大块完整堆内存会变得支离破碎，即内存碎片。本书把忘记 free 比作借债不还。<\/p>\n<p>栈空间一般较小，深递归或栈上分配过大会爆栈（stack overflow）；堆分配释放只能由程序员按代码安排。没有操作系统的环境（如单片机），堆和栈都要手动划分。本书还观察到：两个线程调用同一 func，函数内局部变量 a 分别存在各自线程栈里，互不干扰；static 变量另算，不在栈上。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n栈大小由操作系统决定，常见从几十 KB 到几 MB 量级；具体值随平台和线程配置变化。\n<\/li><li>\n堆可共享指的是分配块的地址可被多线程访问；共享时的数据互斥要靠锁等机制保证。\n<\/li><li>\n条件去掉会怎样：如果堆也随函数返回自动回收，就没有泄漏概念；如果栈可被多线程随意写入，线程隔离就不成立。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：以为堆和栈都自动回收；栈自动，堆必须显式释放。\n<\/li><li>\n反例二：以为二者生长方向相同；栈向下长，堆向上长。\n<\/li><li>\n反例三：以为栈上能放长期存活的大块数据；栈随帧回收，长期数据应放堆或数据段。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n栈 vs 堆：私有 vs 共享；自动伸缩 vs 手动管理；一条指令 vs 管理函数；小而快 vs 大而慢。\n<\/li><li>\n内存泄漏 vs 栈溢出：前者堆块忘记归还，后者栈空间被递归/大数组耗尽。\n<\/li><li>\n数据结构书的“堆（优先队列）” vs 本书 heap：原理可相通，使用场景不同，不要混为一谈。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：参数传递与栈帧。\n<\/li><li>\n后置：虚拟内存与地址映射、存储期 static/global/local。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（堆与栈的区别）<\/summary><div class=\"depth-body\"><h1>堆与栈的区别 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要分清堆和栈，先得会：栈帧结构与返回地址位置；函数调用时局部变量放在哪；寄存器 rsp 如何标识栈顶。再往前需要理解：生存期由存储位置决定，自动回收还是手动释放，是两类内存最根本的分界。<\/p>\n<h2>正向推导<\/h2>\n<p>本书 3.6 节先厘清命名：stack 译“栈”，heap 译“堆”，二者不是一回事。每个线程都有自己的栈：主线程一个栈，新建线程由操作系统准备同等大小的栈内存。栈记录返回地址、放临时变量；函数调用时申请栈内存，返回时释放，只移动 rsp，往往一条指令完成。递归示例中局部变量 a 的地址逐层降低，变量间隔固定 32（0x20）字节，验证栈由高地址向低地址生长。<\/p>\n<p>堆空间通常大得多，用来放较大数据。申请是显式的：malloc、calloc、realloc 或 new 拿到块地址，free、delete 归还；块可被多个线程访问。堆由低地址向高地址生长。malloc/free 本身是复杂管理函数，多次分配释放后大块完整堆内存会变得支离破碎，即内存碎片。本书把忘记 free 比作借债不还。<\/p>\n<p>栈空间一般较小，深递归或栈上分配过大会爆栈（stack overflow）；堆分配释放只能由程序员按代码安排。没有操作系统的环境（如单片机），堆和栈都要手动划分。本书还观察到：两个线程调用同一 func，函数内局部变量 a 分别存在各自线程栈里，互不干扰；static 变量另算，不在栈上。<\/p>\n<p>对照两条故障路径：内存泄漏是堆块忘记归还，长期累积耗尽内存；栈溢出是递归过深或栈上数组过大，把线程私有栈打满。前者回收责任在程序员，后者往往由调用深度或局部块尺寸触发。<\/p>\n<h2>算例<\/h2>\n<p>自拟生长方向推算：栈上连续两次函数调用，局部变量地址从高到低排列；堆上连续四次 malloc，返回地址从低到高排列。 自拟容量判断：线程栈常见几十 KB 到几 MB 量级（具体由操作系统决定），在栈上放一个百万级 int 数组（约 4MB）大概率爆栈；同样数据放堆上，只要进程虚拟空间和物理内存允许即可存活。 自拟共享判断：栈上局部变量线程间不可见；堆块地址可传给另一线程访问，但并发读写要加锁保护。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：以为堆和栈都自动回收；栈自动，堆必须显式释放。反例二：以为二者生长方向相同；栈向下长，堆向上长。反例三：以为栈上能放长期存活的大块数据；栈随帧回收，长期数据应放堆或数据段。 边界：栈大小由操作系统和线程配置决定，不是固定值；堆“可共享”指分配块地址可被多线程使用，共享数据的互斥仍需锁等机制。数据结构书里的“堆（优先队列）”与本书 heap 原理可相通，但使用场景不同，不要混称。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n栈和堆各自的生长方向？（答案：栈高地址→低地址；堆低地址→高地址。）\n<\/li><li>\n栈的申请释放为什么快？（答案：只移动 rsp，一条指令完成，编译器高度优化。）\n<\/li><li>\n内存泄漏对应哪类内存？（答案：堆块 malloc/new 后忘记 free/delete。）\n<\/li><li>\n爆栈由什么触发？（答案：深递归或栈上分配过大，栈空间耗尽。）\n<\/ol>\n<h2>推演延伸：故障形态与选择依据<\/h2>\n<p>两类故障对照：内存泄漏是堆块申请后忘记归还，进程长期运行把可用堆内存耗尽，常见于长驻服务；栈溢出是递归过深或栈上数组过大，把线程私有栈打满，通常触发即崩溃。前者慢性累积，后者急性爆发。<\/p>\n<p>选择存储位置的依据：生存期贯穿全程的常量/静态数据放数据段；函数内临时量放栈；尺寸大、需要跨函数持有或动态伸缩的数据放堆。栈快但小，堆慢但大；线程私有栈保证局部变量不被其他线程踩到，共享堆块则必须配合锁保护并发读写。<\/p>\n<p>再推生长方向：栈从高地址向低地址延伸，递归越深地址越低；堆从低地址向高地址增长，连续申请的块地址依次升高。分配器在 free 后合并相邻空闲块，反复申请释放会留下无法利用的碎片。没有操作系统的裸机环境，堆和栈都要程序员手动划定边界，这是单片机开发常见做法。<\/p>\n<h2>推演延伸：栈堆选择与故障定位<\/h2>\n<p>生存期对照：栈变量离开函数即不可再用，返回栈上局部变量地址得到的是悬挂指针；堆块只要不释放就一直有效，但忘记释放造成泄漏；数据段变量全程有效。判断“这个值还能不能用”，先定位它住在哪块内存。<\/p>\n<p>故障定位：爆栈通常伴随调用链极深或栈上大数组，看递归层数和局部大块占用；泄漏看进程常驻内存是否持续增长，长驻服务每请求分配一块忘了 free 最典型。两类故障一个急性、一个慢性，排查路径不同。<\/p>\n<p>碎片：反复申请释放不同大小块，空闲块被已用块切碎，大块连续空间找不到；分配器合并相邻空闲块缓解，但不能复原被切碎的布局。线程模型上每个线程独立栈，局部变量天然隔离；共享堆块跨线程可见，读写竞争要靠锁。无操作系统环境里堆栈边界手动划分，越界会直接踩进对方区域。<\/p>\n<h2>正向推导细化：栈帧伸缩与堆块分配对照<\/h2>\n<p>栈侧逐条推演：<\/p>\n<ol><li>\n调用函数：call 压返回地址，序言 push rbp、mov rbp,rsp、sub rsp,N 向下分空间。\n<\/li><li>\n局部变量在分好的区间内；返回时栈顶降回基准，pop rbp，ret 跳回，整帧归还。\n<\/li><li>\n栈申请释放只移动 rsp，往往一条指令完成；线程私有，局部变量不被其他线程踩到。\n<\/li><li>\nmalloc/calloc/realloc/new 在堆上查找空闲块，返回块首地址；块由分配器管理，地址不连续对应源码顺序。\n<\/li><li>\nfree/delete 归还块；多次申请释放后大块被切碎，形成碎片。\n<\/li><li>\n堆可被多线程访问，共享块的并发读写要另加锁；堆没有“帧”这一随调用自动回收的单位。\n<p>堆侧对照：<\/p>\n<\/ol>\n<h2>完整算例：两类内存的地址与生存期对照（自拟）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>栈<\/th><th>堆<\/th><\/tr><\/thead><tbody><tr><td>生长方向<\/td><td>高地址 → 低地址<\/td><td>低地址 → 高地址<\/td><\/tr><tr><td>分配方式<\/td><td>调用时自动压帧，返回自动退帧<\/td><td>malloc/new 显式申请<\/td><\/tr><tr><td>释放方式<\/td><td>随帧自动回收<\/td><td>free/delete 显式归还<\/td><\/tr><tr><td>归属<\/td><td>线程私有<\/td><td>可多线程共享<\/td><\/tr><tr><td>故障形态<\/td><td>深递归/大块局部 → 爆栈<\/td><td>忘记归还 → 泄漏；反复切分 → 碎片<\/td><\/tr><\/tbody><\/table><\/div>\n<p>自拟判断：函数内定义百万级 int 数组放栈上大概率爆栈；同样数据放堆上，只要虚拟空间和物理内存允许即可跨函数持有。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“局部变量一定在栈上”<\/strong>：反例——加 static 的局部变量在数据段；堆上由指针指向的对象也不在栈上。“局部”是作用域说法，不等于栈位置。\n<\/li><li>\n<strong>“malloc 的内存就在栈后面接着”<\/strong>：反例——堆是独立区域、向高地址生长，与栈不相邻；块地址由分配器在空闲空间里决定。\n<\/li><li>\n<strong>“堆会在函数返回时自动回收”<\/strong>：反例——堆必须 free/delete，忘记归还就是内存泄漏；自动回收只属于栈。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n内存泄漏对应哪类内存没归还？（答案：堆块 malloc/new 之后忘记 free/delete。）\n<\/ol><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.120<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">参数传递与栈帧<\/a><\/span><\/div><h1>对象模型：this 与虚函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>问题<\/h2>\n<p>this 指针像幽灵，成员函数不写它却到处在用；虚函数和普通成员函数在调用时差在哪一步？多态落到机器层面到底查的是什么？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n成员函数藏了一个默认参数 this，即对象内存地址，通过 rdi 寄存器传入。\n<\/li><li>\n普通成员函数在编译期静态绑定：call 目标地址编译阶段就确定。\n<\/li><li>\n虚函数运行时动态绑定：按对象里的虚表指针查虚表，再取对应函数地址。\n<\/li><li>\n含虚函数的类，对象里藏有指向虚函数表的成员，通常位于对象内存首地址附近。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 4.1 节对照成员函数 mFunc 和普通函数 func：两者汇编指令完全相同。成员函数必备的默认参数就是 this；调用时对象把自身内存地址经 rdi 传给成员函数。<code>A a; a.mFunc();<\/code> 与 <code>func((long*)&amp;a);<\/code> 生成的调用指令一致，传入的都是对象 a 的地址。<\/p>\n<p>4.2 节：构造函数同样带隐形 this；派生类构造函数先调用基类构造函数；含虚函数的类，构造函数把虚函数表地址记到对象隐藏成员里。<\/p>\n<p>4.3 节比较普通成员函数与虚函数：函数体都带 this，差别在调用处。普通函数编译阶段就确定 call 哪个地址；虚函数的 call 只能依据寄存器（本书示例 rdx）中的值定位——运行时先读对象虚表指针，再到虚表中取对应函数地址。4.4 节多态在机器层面就是同一调用接口，按对象实际类型查到不同虚表项。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\nthis 经 rdi 传递是本书 x86-64 示例的约定；其他调用约定下传参寄存器不同，但“对象地址作为隐式参数”的模型不变。\n<\/li><li>\n静态绑定/动态绑定的区分针对成员函数调用；自由函数不存在虚表解析。\n<\/li><li>\n条件去掉会怎样：如果虚函数也编译期定址，基类指针指向派生类对象时无法在运行时区分类型，多态落不了地。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：以为成员函数是 C++ 独有调用形式；机器层面只是多传一个 this 参数。\n<\/li><li>\n反例二：以为虚函数地址编译期就能写死；具体类型要到运行时才确定。\n<\/li><li>\n反例三：以为构造函数不收 this；它同样接收隐形 this，并负责安置虚表指针。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n静态绑定 vs 动态绑定：编译期 call 定址 vs 运行时查虚表。\n<\/li><li>\nthis vs 普通参数：this 由语法隐藏，调用处仍走寄存器传参路径。\n<\/li><li>\n虚表 vs 对象成员：虚表是类级别共享的一张函数地址表，对象里只存指向它的指针。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：参数传递与栈帧。\n<\/li><li>\n后置：堆与栈的区别、存储期 static/global/local。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（对象模型：this 与虚函数）<\/summary><div class=\"depth-body\"><h1>对象模型：this 与虚函数 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要理解对象机制，先得会：函数调用靠寄存器传参；栈帧与隐式参数概念；指针保存对象地址。再往前需要区分：编译期就能定死的调用目标，和必须等到运行时才能确定的调用目标，二者走两条解析路径。<\/p>\n<h2>正向推导<\/h2>\n<p>本书 4.1 节对照成员函数 mFunc 和普通函数 func：两者汇编指令完全相同。成员函数必备的默认参数就是 this；调用时对象把自身内存地址经 rdi 传给成员函数。<code>A a; a.mFunc();<\/code> 与 <code>func((long*)&amp;a);<\/code> 生成的调用指令一致，传入的都是对象 a 的地址。this 不是语言魔法，而是被 C++ 语法隐藏的普通参数。<\/p>\n<p>4.2 节推演构造函数：它同样带隐形 this；派生类构造函数先调用基类构造函数；含虚函数的类，构造函数把虚函数表地址记到对象隐藏成员里，这个成员通常位于对象内存首地址附近。<\/p>\n<p>4.3 节比较普通成员函数与虚函数：函数体都带 this，差别在调用处。普通函数编译阶段就确定 call 哪个地址，即静态绑定；虚函数的 call 只能依据寄存器（本书示例 rdx）中的值定位——运行时先读对象虚表指针，再到虚表中取对应函数地址，即动态绑定。4.4 节多态在机器层面就是同一调用接口，按对象实际类型查到不同虚表项。<\/p>\n<p>把链路写清楚：对象实例 → 首地址附近藏虚表指针 → 指向类共享的虚表 → 表项里是各虚函数地址 → call 经表项跳转。普通成员函数没有这层查表，call 目标在编译链接后已固定。<\/p>\n<h2>算例<\/h2>\n<p>自拟绑定判断：基类 B<em> p 指向派生类 D 对象；调用普通成员函数时，call 地址在编译期按 B 的函数定死；调用虚函数时，运行时从 <\/em>p 读虚表指针，进表取 D 覆写后的函数地址再跳转。 自拟参数推演：成员函数 <code>void m(int x)<\/code> 编译后等价于 <code>void m(A* this, int x)<\/code>；调用 <code>a.m(3)<\/code> 时 rdi 传 &amp;a，rsi 传 3（示例约定）。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：以为成员函数是 C++ 独有调用形式；机器层面只是多传一个 this 参数。反例二：以为虚函数地址编译期就能写死；具体类型要到运行时才确定。反例三：以为构造函数不收 this；它同样接收隐形 this，并负责安置虚表指针。 边界：this 经 rdi 传递是本书 x86-64 示例约定；其他调用约定下传参寄存器不同，但“对象地址作隐式参数”的模型不变。静态/动态绑定区分针对成员函数调用，自由函数不存在虚表解析。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nthis 指针在示例中通过哪个寄存器传入？（答案：rdi。）\n<\/li><li>\n静态绑定和动态绑定差在哪一步？（答案：前者编译期 call 定址；后者运行时查虚表。）\n<\/li><li>\n对象里藏的虚表指针指向什么？（答案：类共享的虚函数地址表。）\n<\/li><li>\n派生类构造函数先做什么？（答案：先调用基类构造函数。）\n<\/ol>\n<h2>推演延伸：虚表链路与绑定时机<\/h2>\n<p>对象到函数地址的链路：实例内存首地址附近藏虚表指针 → 指向类共享虚表 → 表项记录各虚函数地址 → call 经表项取地址跳转。普通成员函数没有这层查表，call 目标在编译链接后固定，运行时直接跳转。<\/p>\n<p>构造时机推演：派生类构造先调基类构造，安置基类子对象和虚表指针，再执行派生类自身初始化。虚表是类级别共享的，同一类所有对象指向同一张表；对象里存的只是表指针，不存函数本体。<\/p>\n<p>绑定时机决定灵活性：静态绑定在编译期完成，调用目标确定、省去查表开销；动态绑定推迟到运行时，代价是一次间接查表，换来同一接口按实际类型分发。把基类指针指向派生类对象时，编译器无法静态预知对象类型，只能留到运行时查虚表——这是多态的机器落点。<\/p>\n<h2>推演延伸：构造顺序与对象布局<\/h2>\n<p>构造顺序：派生类构造先跑基类构造，安置基类子对象和虚表指针，再执行派生类自身初始化；析构顺序相反，先派生后基类。对象生命周期的头尾都按这个嵌套顺序走。<\/p>\n<p>对象布局：实例内存里藏虚表指针，函数本体不在对象内；同一类所有对象共享一张虚表，表项记录各虚函数地址。不含虚函数的类对象里没有这一隐藏成员，对象尺寸也相应更小。<\/p>\n<p>失败对照：构造函数里调用虚函数，此时虚表指针尚未完全指向派生类版本，查到的往往是基类实现；这是动态绑定时机带来的边界，不是虚表机制失效。虚函数在析构阶段也是同一道理，析构到基类时派生部分已被销毁。<\/p>\n<h2>正向推导细化：this 传递与虚表查表链路<\/h2>\n<p>普通成员函数路径：<\/p>\n<ol><li>\n<code>A a; a.mFunc();<\/code> 编译后等价调用 <code>func(&amp;a)<\/code>；对象地址作为 this 经 rdi 传入。\n<\/li><li>\n函数体通过 this 找到当前对象的数据；调用目标在编译期写进 call，即静态绑定。\n<\/li><li>\n对象首地址附近藏虚表指针；构造函数把类虚表地址记进这个隐藏成员。\n<\/li><li>\n调用虚函数时，先从对象读出虚表指针，再按函数槽位进虚表取函数地址。\n<\/li><li>\ncall 经表项间接跳转；具体目标由运行时对象类型决定，即动态绑定。\n<\/li><li>\n派生类构造先调基类构造安置基类子对象和虚表指针，再跑派生类初始化。\n<p>虚函数路径：<\/p>\n<\/ol>\n<h2>完整算例：基类指针指向派生对象的调用落点（自拟）<\/h2>\n<pre><code>B* p = new D;\np-&gt;vfunc();<\/code><\/pre>\n<ol><li>\nrdi 传 this = D 对象地址；\n<\/li><li>\n读 *(this) 得 D 的虚表指针；\n<\/li><li>\n虚表第 0 槽位存 D::vfunc 地址；\n<\/li><li>\ncall 跳到 D::vfunc。\n<p>若 p 指向 B 对象，同一槽位取到 B::vfunc；普通成员函数则无论指向谁，call 地址都按编译期类型定死。<\/p>\n<\/ol>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“成员函数是 C++ 独有的调用形式”<\/strong>：反例——机器层面只是多传 this 一个指针参数，和带指针参数的普通函数走同一套 call/ret。\n<\/li><li>\n<strong>“虚函数地址编译期就能定死”<\/strong>：反例——基类指针可能指向派生对象，具体类型运行时才确定，只能查虚表解析。\n<\/li><li>\n<strong>“对象里存着函数本体”<\/strong>：反例——对象只藏虚表指针，函数本体在代码段，同一类所有对象共享一张虚表。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n派生类构造函数先做什么？（答案：先调用基类构造函数，安置基类子对象和虚表指针。）\n<\/ol><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.156<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">堆与栈的区别<\/a><\/span><\/div><h1>虚拟内存与地址映射<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>问题<\/h2>\n<p>程序打印出的变量地址为什么大过物理内存？这套地址怎么落到真实内存条上？系统调用前后 CPU 换了哪块内存空间？大小端摆放的到底是什么？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n程序看到的是一套独立虚拟地址空间；虚拟地址由 MMU 配合操作系统映射到物理内存。\n<\/li><li>\n32 位 CPU 虚拟空间约 4GB，64 位 CPU 空间更大；映射有硬件加持，对程序员无感。\n<\/li><li>\n用户态代码跑在用户内存空间，syscall 后跳到内核内存空间运行预设代码，两种状态相互隔离。\n<\/li><li>\n小端序指数值低位字节存低地址、高位字节存高地址（x86）；大端与之相反。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 5.1 节：变量地址示例 0x7ffcd930e8fc 超出普通物理内存上限，它不是物理地址而是虚拟内存地址。每个进程都以为自己独占一套大地址空间。CPU 在这套虚拟地址上读写，真实数据最终仍存在物理 RAM；内存管理单元 MMU 和操作系统配合，完成虚拟地址到物理地址的映射。映射由硬件参与，对程序员透明，也不拖慢 CPU 运行效率。<\/p>\n<p>5.6 节系统调用：用户态程序出错被隔离在内核之外，即使崩溃也不会拖垮整个计算机系统；内核态代码（操作、驱动程序）经过千锤百炼，一旦出错往往直接蓝屏。syscall 指令是用户空间进入内核空间的边界动作。<\/p>\n<p>5.7 节大小端：x86 把一个 8 字节长整按字符打印会得到倒序字符串。原因是 CPU 把数值低位字节写在内存低地址、高位字节写在高地址；人书写高位在前的习惯对应大端模式。倒序观感来自多字节数值的字节摆放，不是字符串本身反着存。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n4GB 是 32 位地址空间结论；64 位虚拟空间大小取决于实现位数和系统配置，不按 32 位数字套。\n<\/li><li>\nMMU 映射是现代带存储管理的系统特征；早期无 MMU 的单片机/DOS 环境程序可直接扫内存，没有这层隔离。\n<\/li><li>\n条件去掉会怎样：没有虚拟内存隔离，一个野指针就能改整机内存；没有 MMU 硬件配合，全靠软件查表会拖慢每次访存。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：以为程序地址就是内存条物理位置；那是虚拟地址，要经映射落地。\n<\/li><li>\n反例二：以为虚拟内存靠纯软件查表、很慢；MMU 硬件加持，程序无感。\n<\/li><li>\n反例三：以为小端把字符串倒序存放；字符串顺序不变，倒序来自数值字节规则。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n虚拟地址 vs 物理地址：前者进程视角，后者 RAM 实际单元，中间隔 MMU 与页表。\n<\/li><li>\n用户态 vs 内核态：运行代码和内存空间不同，隔离目的是保护系统稳定。\n<\/li><li>\n大端 vs 小端：多字节数值的字节摆放顺序，与字符串编码无关。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：堆与栈的区别。\n<\/li><li>\n后置：对象模型 this 与虚函数、存储期 static/global/local。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（虚拟内存与地址映射）<\/summary><div class=\"depth-body\"><h1>虚拟内存与地址映射 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要理解虚拟内存，先得会：程序里看到的变量地址只是编号；CPU 读写内存要经过地址与数据两条路径；用户程序与操作系统内核是两套执行环境。再往前需要建立：进程以为自己独占一套空间，实际中间隔了一层硬件加软件的映射。<\/p>\n<h2>正向推导<\/h2>\n<p>本书 5.1 节推演：变量地址示例 0x7ffcd930e8fc 超出普通物理内存上限，它不是物理地址，而是虚拟内存地址。每个进程都以为自己独占一套大地址空间；32 位 CPU 虚拟空间约 4GB，64 位 CPU 空间更大。CPU 在这套虚拟地址上读写，真实数据最终仍存在物理 RAM。<\/p>\n<p>映射链路：虚拟地址先经 MMU（内存管理单元）硬件查页表，配合操作系统管理的表项，换算出物理内存单元。映射由硬件参与，对程序员透明，也不拖慢 CPU 运行效率。现代系统靠这层隔离把各进程关在各自地址空间里，一个程序的野指针不能直接扫改整机内存。<\/p>\n<p>5.6 节推演系统调用边界：用户态代码跑在用户内存空间，执行 syscall 后 CPU 跳到内核内存空间运行操作系统预设代码。内核态代码（操作、驱动程序）经过千锤百炼，一旦出错往往直接蓝屏；用户态程序出错被隔离在内核之外，不会拖垮整个计算机系统。系统调用接口编号固定，便于各种库函数开发和软件标准化。<\/p>\n<p>5.7 节推演大小端：x86 把一个 8 字节长整按字符打印会得到倒序字符串。原因是 CPU 把数值低位字节写在内存低地址、高位字节写在高地址，即小端模式；人书写高位在前的习惯对应大端模式。倒序观感来自多字节数值的字节摆放，字符串本身并没有反着存。<\/p>\n<h2>算例<\/h2>\n<p>自拟字节摆放：32 位数值 0x12345678 在小端内存中，从低地址到高地址依次存 0x78、0x56、0x34、0x12；大端则相反，存 0x12、0x34、0x56、0x78。 自拟空间推算：32 位地址线可寻址 2^32 = 4GB 空间；64 位实现按实际可用位数决定空间大小，不能直接套 32 位数字。 自拟隔离判断：用户态程序访问非法地址触发段错误，被内核捕获终止自身进程，内核与其他进程继续运行，这就是隔离效果。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：以为程序地址就是内存条物理位置；那是虚拟地址，要经映射落地。反例二：以为虚拟内存靠纯软件查表、很慢；MMU 硬件加持，程序无感。反例三：以为小端把字符串倒序存放；字符串顺序不变，倒序来自数值字节规则。 边界：4GB 是 32 位结论；64 位空间大小取决于实现位数和系统配置。MMU 映射是现代带存储管理系统的特征；早期无 MMU 的单片机/DOS 环境程序可直接扫内存，没有这层隔离。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n虚拟地址靠什么落到物理内存？（答案：MMU 配合操作系统页表映射。）\n<\/li><li>\n32 位 CPU 虚拟空间约多大？（答案：4GB。）\n<\/li><li>\nsyscall 前后 CPU 进入什么不同空间？（答案：用户内存空间跳到内核内存空间。）\n<\/li><li>\nx86 小端怎么摆字节？（答案：低位字节存低地址，高位字节存高地址。）\n<\/ol>\n<h2>推演延伸：映射链路与隔离边界<\/h2>\n<p>访存链路：CPU 给出虚拟地址 → MMU 查页表项 → 换算物理地址 → 读写物理 RAM。页表由操作系统维护，MMU 硬件加速查询，所以映射对程序透明。进程之间地址空间各自独立，同一个虚拟地址在不同进程映射到不同物理单元，互不干扰。<\/p>\n<p>系统调用边界再推：用户态代码只能访问用户空间，需要内核服务（读写文件、申请内存、发网络包）时通过 syscall 进入内核；内核代码出错影响面大，因此经过严格验证；用户程序崩溃被隔离，不拖垮整机。接口编号固定下来，库函数才能稳定封装系统能力。<\/p>\n<p>端序边界：端序只描述多字节数值在内存的字节顺序，不影响单字节字符和字符串。跨设备交换二进制数据时必须约定端序，否则同一串字节两边解释出不同数值。x86 是小端，网络字节序通常按大端传输，收发时需要做字节序转换。<\/p>\n<h2>推演延伸：映射过程与端序边界<\/h2>\n<p>地址翻译：虚拟地址拆成页内偏移和页号，MMU 按页号查页表项得到物理页号，拼上偏移访问 RAM；页表项缺失或越界会触发缺页异常，由操作系统介入处理后再回到程序。<\/p>\n<p>隔离效果：进程 A 的虚拟地址 0x4000 与进程 B 的 0x4000 映射到不同物理单元；一个进程写自己的地址空间，不会碰到另一个进程的内存。虚拟地址相同不代表物理位置相同。<\/p>\n<p>端序边界：跨网络或跨设备传二进制要先固定字节序；x86 是小端，网络字节序通常按大端，收发时做字节转换。单字节字符不受端序影响。自拟算例：0x12345678 小端内存从低到高存 78、56、34、12，按字节打印得到逆序观感；字符串 &quot;abc&quot; 在内存仍是 61、62、63，顺序不变。<\/p>\n<h2>正向推导细化：虚拟地址到物理地址的翻译<\/h2>\n<ol><li>\nCPU 给出虚拟地址；该地址超出普通物理内存上限，说明它不是物理编号。\n<\/li><li>\n虚拟地址拆成页号和页内偏移；MMU 按页号查页表项，得到物理页号。\n<\/li><li>\n物理页号拼上页内偏移，形成物理地址，再读写物理 RAM。\n<\/li><li>\n页表由操作系统维护，MMU 硬件加速查询；映射对程序透明，不拖慢 CPU。\n<\/li><li>\n页表项缺失或越界触发缺页异常，由操作系统介入处理后再回到程序。\n<\/li><li>\nsyscall 是另一道边界：用户空间代码执行 syscall 后跳到内核空间运行预设代码；用户态崩溃被隔离在内核之外。\n<\/ol>\n<h2>完整算例：地址隔离与字节摆放（自拟）<\/h2>\n<p>隔离对照：进程 A 的虚拟地址 0x4000 与进程 B 的 0x4000 映射到不同物理单元；同名虚拟地址不代表同一物理位置。<\/p>\n<p>小端字节算例：32 位数值 0x12345678，小端内存从低地址到高地址依次存 0x78、0x56、0x34、0x12；按字节打印得到倒序观感。字符串 &quot;abc&quot; 在内存仍是 0x61、0x62、0x63，顺序不变。跨设备交换二进制要先约定端序。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“程序打印的地址就是内存条物理位置”<\/strong>：反例——那是虚拟地址，要经 MMU 和操作系统映射才落到物理 RAM。\n<\/li><li>\n<strong>“虚拟内存靠纯软件查表、所以很慢”<\/strong>：反例——MMU 硬件参与加速，程序访问无感，效率由硬件保证。\n<\/li><li>\n<strong>“小端就是字符串倒序存放”<\/strong>：反例——字符串本身按顺序放，倒序观感只来自多字节数值的字节摆放规则。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\n32 位 CPU 的虚拟地址空间约多大？（答案：约 4GB。）\n<\/ol><\/div><\/details>", "c10": "<div class=\"source-badge\">📖 出处：CPU眼里的CC++.pdf · p.214<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">变量与类型宽度<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">堆与栈的区别<\/a><\/span><\/div><h1>存储期：static、global 与 local<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>问题<\/h2>\n<p>全局变量、静态变量、局部变量到底住在内存哪一块？为什么 static 变量函数返回后值不丢？作用域限制和内存位置是不是一回事？<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n全局变量与静态变量同处一块数据段，编译期位置固定；局部变量在栈帧上随调用伸缩。\n<\/li><li>\n作用域限制是编译器给的可见范围，不等于内存隔离。\n<\/li><li>\nthread_local 修饰的变量每个线程各持一份拷贝，属于线程局部存储。\n<\/li><li>\n字符串常量也存数据段；栈上一维数组可存多个字符串首地址，64 位下每个地址 8 字节。\n<\/ul>\n<h2>推导<\/h2>\n<p>本书 6.1 节定义全局变量 a、函数内静态变量 b、main 内局部变量 c。func1 的汇编里对静态变量 b 没有任何初始化动作，因为它在编译期就已安排进数据段。打印地址可见 b（0x404034）与 a（0x404030）相邻 4 字节，同属数据区域；编译器只在作用域上限制 b 的可见范围。知道 b 的地址后，同样可以绕开作用域按地址读写。<\/p>\n<p>对照三种位置：全局/静态变量在数据段，地址运行期不变；局部变量在栈帧上，随函数调用分配、返回回收；malloc/new 申请的大块在堆上。6.5 节 thread_local 变量每线程一份，呼应 3.6 节线程私有栈模型。<\/p>\n<p>6.2 节双重指针题：字符串常量存在数据段；栈上一维数组 a 的三个元素分别存三个字符串首地址，64 位下每个地址 8 字节；<code>a[2][1]<\/code> 等价 <code>*(a[2] + 1)<\/code>，数组 a 是一维数组，不是二维数组。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n数据段、栈、堆的划分以本书 x86-64 示例为准；具体段名和布局随链接脚本、编译器变化。\n<\/li><li>\n静态变量“值保留”指脱离函数调用周期仍保留；它不在线程私有栈里，多线程访问仍需同步。\n<\/li><li>\n条件去掉会怎样：如果 static 也放栈帧，函数返回后值就被回收；如果作用域等于内存隔离，拿到地址也无法越界访问，实际硬件并不提供这种隔离。\n<\/ul>\n<h2>反例<\/h2>\n<ul><li>\n反例一：以为 static 变量存在栈上；它和全局变量同在数据段。\n<\/li><li>\n反例二：以为作用域限制等于硬件隔离；位置不隔离，只是编译器限制可见性。\n<\/li><li>\n反例三：以为静态变量每次调用重新初始化；它编译期安排一次，之后保留上次的值。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n全局 vs 静态：内存位置相同，差别在作用域可见范围。\n<\/li><li>\n数据段 vs 栈：固定生存期 vs 随帧伸缩。\n<\/li><li>\n普通局部 vs thread_local：单份栈帧拷贝 vs 每线程各一份。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：变量与类型宽度、堆与栈的区别。\n<\/li><li>\n后置：综合理解程序内存布局。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（存储期：static、global 与 local）<\/summary><div class=\"depth-body\"><h1>存储期：static、global 与 local · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要判断变量住在哪块内存，先得会：数据段、栈帧、堆三块区域的划分；全局/静态地址固定性；栈变量随帧伸缩。再往前需要分清：作用域是编译器给的可见范围，内存位置是硬件布局，两者不是一回事。<\/p>\n<h2>正向推导<\/h2>\n<p>本书 6.1 节推演：定义全局变量 a、函数内静态变量 b、main 内局部变量 c。func1 的汇编里对静态变量 b 没有任何初始化动作，因为它在编译期就已安排进数据段。打印地址可见 b（0x404034）与 a（0x404030）相邻 4 字节，同属数据区域；编译器只在作用域上限制 b 的可见范围。知道 b 的地址后，同样可以绕开作用域按地址读写——说明作用域限制不等于硬件隔离。<\/p>\n<p>对照三种位置：全局/静态变量在数据段，地址运行期不变；局部变量在栈帧上，随函数调用分配、返回回收；malloc/new 申请的大块在堆上。生存期由位置决定：数据段变量贯穿程序全程，栈变量随帧消亡，堆块靠手动释放。<\/p>\n<p>6.5 节推演 thread_local：修饰的变量每个线程各持一份拷贝，呼应 3.6 节线程私有栈模型。普通局部变量在各自栈帧里互不干扰；thread_local 把“每线程一份”提升到存储类别层面，多线程访问各自副本，不需要为这份变量互斥。<\/p>\n<p>6.2 节双重指针题补出数据段另一类内容：字符串常量存在数据段；栈上一维数组 a 的三个元素分别存三个字符串首地址，64 位下每个地址 8 字节；<code>a[2][1]<\/code> 等价 <code>*(a[2] + 1)<\/code>，数组 a 是一维数组，不是二维数组。<\/p>\n<h2>算例<\/h2>\n<p>自拟地址推算：全局 a 在 0x404030，静态 b 在 0x404034，相邻 4 字节，同属数据段；若再加一个 int 全局 c，下一个相邻地址为 0x404038。 自拟生存期判断：函数内 <code>static int cnt = 0; cnt++;<\/code> 每次调用保留上次值，因为 cnt 不在栈帧；普通局部 int 每次进入函数重新分配，上一次值不保留。 自拟线程判断：thread_local int tls; 线程 A 改 tls 不影响线程 B 的 tls，两份拷贝各自独立；普通全局变量则是所有线程共享同一份。<\/p>\n<h2>反例与边界<\/h2>\n<p>反例一：以为 static 变量存在栈上；它和全局变量同在数据段。反例二：以为作用域限制等于内存隔离；位置不隔离，只是编译器限制可见性。反例三：以为静态变量每次调用重新初始化；它编译期安排一次，之后保留上次的值。 边界：数据段、栈、堆的划分以本书 x86-64 示例为准；具体段名和布局随链接脚本、编译器变化。静态变量值虽脱离函数周期保留，但多线程访问仍需同步，线程私有性要靠 thread_local 明确声明。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n静态变量和谁同处数据段？（答案：全局变量。）\n<\/li><li>\n函数返回后 static 值为什么不丢？（答案：它不在栈帧，在数据段，空间不回收。）\n<\/li><li>\n作用域限制和内存隔离是不是一回事？（答案：不是；作用域是编译器可见范围，硬件不替你守边界。）\n<\/li><li>\nthread_local 变量的拷贝份数？（答案：每个线程各持一份。）\n<\/ol>\n<h2>推演延伸：生存期、线程可见性与地址归属<\/h2>\n<p>三类变量生存期对照：数据段变量贯穿程序全程，函数返回后值保留；栈变量随帧申请回收，返回后悬挂；堆块手动释放，忘记归还即泄漏。判断变量归属先看存储位置，再看作用域规则，两者不要混为一谈。<\/p>\n<p>线程可见性推演：普通局部变量在栈帧，天然线程私有；全局/静态变量在数据段，所有线程共享，并发访问要同步；thread_local 把存储类别提升为每线程一份，各线程改自己的拷贝，互斥压力最小。C++ 的 thread_local、C 语言的 _Thread_local 都属这一类别。<\/p>\n<p>地址归属再补：字符串常量也在数据段，只读共享；栈上数组存的是这些串的首地址，64 位每地址 8 字节。双重指针题中 <code>a[2][1]<\/code> 拆成 <code>*(a[2]+1)<\/code>：先取 a[2] 的串地址，加一进一个字符单元，再读该字符。数组 a 是一维数组，元素是字符指针，不是二维字符数组。<\/p>\n<h2>推演延伸：存储期判断流程<\/h2>\n<p>判断顺序：先看定义位置——函数外定义是全局；函数内加 static 是静态；函数内普通局部在栈；new/malloc 申请在堆。再看生存期：数据段变量贯穿程序全程，栈变量随帧申请回收，堆块靠手动释放归还。<\/p>\n<p>线程可见性推演：普通局部变量在栈帧里天然私有；全局/静态变量在数据段，所有线程共享，并发访问要同步；thread_local 把存储类别提升为每线程一份，各线程改自己的拷贝，不需要为这份变量互斥。区分“变量住在哪”和“谁能看见它”，是两个独立问题。<\/p>\n<h2>正向推导细化：三类变量在地址空间里的位置<\/h2>\n<ol><li>\n全局变量：定义在函数外，编译期安排进数据段，链接后地址固定，运行期不移动。\n<\/li><li>\n静态变量：函数内加 static，同样进数据段；编译器只在作用域上限制可见范围，地址与全局变量邻近。\n<\/li><li>\n局部变量：普通局部在栈帧上，随调用分配、返回回收，地址随栈帧伸缩变化。\n<\/li><li>\n堆块：malloc/new 申请，地址由分配器运行时决定，跨函数持有。\n<\/li><li>\n生存期由位置决定：数据段全程有效，栈随帧消亡，堆手动释放；作用域是编译器给的可见范围，和内存位置是两件事。\n<\/li><li>\nthread_local：存储类别提升为每线程一份拷贝；普通局部私有在栈帧，全局/静态共享在数据段。\n<\/ol>\n<h2>完整算例：地址与生存期对照（自拟，本书示例 a=0x404030、b=0x404034）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>类别<\/th><th>位置<\/th><th>地址特点<\/th><th>生存期<\/th><\/tr><\/thead><tbody><tr><td>全局 a<\/td><td>数据段<\/td><td>0x404030，固定<\/td><td>全程<\/td><\/tr><tr><td>静态 b<\/td><td>数据段<\/td><td>0x404034，与 a 相邻<\/td><td>全程，函数返回后保留<\/td><\/tr><tr><td>局部 c<\/td><td>栈帧<\/td><td>随帧移动<\/td><td>随帧消亡<\/td><\/tr><tr><td>malloc 块<\/td><td>堆<\/td><td>分配器返回<\/td><td>手动释放<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>static int cnt = 0; cnt++;<\/code> 每次调用保留上次值，因为 cnt 不在栈帧；普通局部 int 每次进函数重新分配，上次值不保留。<\/p>\n<h2>结构体对齐 sizeof 算例（自拟，x86-64 常见 ABI）<\/h2>\n<p>规则：每个字段放在自身对齐值整数倍的偏移处；结构体整体大小凑到最大对齐值的整数倍；字段之间与尾部按需要填充。<\/p>\n<p>字段顺序 A：<code>struct A { char c; int i; short s; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>类型宽度<\/th><th>对齐值<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>c<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>填充<\/td><td>—<\/td><td>—<\/td><td>1–3<\/td><td>3<\/td><\/tr><tr><td>i<\/td><td>4<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>2<\/td><td>2<\/td><td>8<\/td><td>2<\/td><\/tr><tr><td>尾部填充<\/td><td>—<\/td><td>—<\/td><td>10–11<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最大对齐值为 4，总大小凑到 4 的倍数：sizeof(A) = 12。<\/p>\n<p>调换顺序 B：<code>struct B { int i; short s; char c; };<\/code><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>偏移<\/th><th>占用字节<\/th><\/tr><\/thead><tbody><tr><td>i<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>s<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>c<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>尾部填充<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>sizeof(B) = 8。字段集合不变，仅调换顺序就从 12 降到 8，省下 4 字节填充。本书正文未展开对齐规则，以上计算为自拟；平台 ABI 不同时对齐值可能变化。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>“static 变量存在栈上”<\/strong>：反例——它和全局变量同在数据段，函数返回后空间不回收，下次调用仍保留上次的值。\n<\/li><li>\n<strong>“作用域限制等于内存隔离”<\/strong>：反例——知道静态变量地址后可绕开作用域按地址读写；作用域是编译器可见范围，硬件不替你守边界。\n<\/li><li>\n<strong>“全局变量每个线程一份”<\/strong>：反例——全局/静态所有线程共享同一份；每线程一份要靠 thread_local 明确声明。\n<\/ol>\n<h2>自检补充<\/h2>\n<ol><li>\nthread_local 变量有几份拷贝？（答案：每个线程各持一份。）\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：预备知识：程序在 CPU 上怎么跑<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：预备知识——CPU 眼里的程序运行与汇编语言<\/a><br>检查点：能认出 rax/rbp/rsp 的分工，说清 push/mov/pop 各自对应的内存动作<\/li><li class='path-step' id='path-02'><strong>步骤 02：基础语法：变量、指针与数组的内存样子<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：基础语法——变量、流程控制、指针与数组在内存里的样子<\/a><br>检查点：能解释变量地址、指针两步读写、数组传参和越界改写了什么<\/li><li class='path-step' id='path-03'><strong>步骤 03：函数原理：传参、栈帧与堆和栈<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈<\/a><br>检查点：能按 call/push/sub/pop/ret 复述一次调用往返，区分栈与堆的存储期和生长方向<\/li><li class='path-step' id='path-04'><strong>步骤 04：C++ 特性与高级编程：对象模型、虚拟内存与并发基础<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础<\/a><br>检查点：能说清 this 隐式传参、静态/动态绑定、虚拟内存映射、大小端与静态变量存储期<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel) ck'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q3.<\/b> 关于堆和栈，下列哪条与本书 3.6 节一致？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 栈可被多个线程共享，栈上数据需要手动 free<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 栈是线程私有的，堆内存可被多个线程访问<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 堆随函数返回自动回收，栈需要手动 delete<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 堆和栈的生长方向都是由高地址向低地址<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础<\/h1><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 普通成员函数在编译期就确定了 call 哪个地址；虚函数的被调位置在什么时候确定？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 编译链接期写死<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 运行时按对象虚表中的指针查找<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 预处理期确定<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 由宏展开确定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q13' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> x86 上的小端序是指什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 数值的高位字节存低地址<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> 数值的低位字节存低地址<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> 字符串按倒序存放<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 地址从大到小编号<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='blank' data-concept='c10' data-chapter='ch04'><p class='quiz-q'><b>Q3.<\/b> 按本书 6.1 节的观察，函数内定义的 static 变量与哪一类变量处在同一块数据区域？（填两个字：全局）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q16' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q4.<\/b> 本书 4.1 节中，对象调用成员函数时，this 指针（对象内存地址）通过哪个寄存器传入成员函数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> rax<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> rdi<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> rsp<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> rbp<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='寄存器'>寄存器 — CPU 内部高速存储位置，rax 这类放数值，rbp/rsp 这类存放内存地址 <span class=glossary-ref>（第 1 章：预备知识——CPU 眼里的程序运行与汇编语言）<\/span><\/li><li data-term='栈帧'>栈帧 — 一次函数调用在栈上占用的一片区域，保存返回地址、旧栈帧基准与本函数局部变量 <span class=glossary-ref>（第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈）<\/span><\/li><li data-term='返回地址'>返回地址 — call 指令压入栈中的下一条指令地址，ret 据此跳回主调函数被打断的位置 <span class=glossary-ref>（第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈）<\/span><\/li><li data-term='栈（stack）'>栈（stack） — 线程私有、随函数调用自动申请与回收的内存，生长方向由高地址向低地址 <span class=glossary-ref>（第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈）<\/span><\/li><li data-term='堆（heap）'>堆（heap） — 由 malloc/calloc/realloc/new 申请、free/delete 释放的内存，可被多个线程共享，生长方向由低地址向高地址 <span class=glossary-ref>（第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈）<\/span><\/li><li data-term='指针'>指针 — 保存内存地址的变量；对它做 * 操作就是按该地址读写内存 <span class=glossary-ref>（第 2 章：基础语法——变量、流程控制、指针与数组在内存里的样子）<\/span><\/li><li data-term='引用'>引用 — C++ 语法层的别名机制，底层实现与指针相同，相当于不能改绑的指针常量 <span class=glossary-ref>（第 2 章：基础语法——变量、流程控制、指针与数组在内存里的样子）<\/span><\/li><li data-term='数组越界'>数组越界 — 访问了数组边界之外的内存；向高端越界可能改写栈帧关键数据，导致崩溃或被劫持 <span class=glossary-ref>（第 2 章：基础语法——变量、流程控制、指针与数组在内存里的样子）<\/span><\/li><li data-term='栈溢出（stack overflow）'>栈溢出（stack overflow） — 递归过深或栈上分配过大，栈空间被耗尽的故障 <span class=glossary-ref>（第 3 章：函数原理——参数传递、栈帧、调用返回与堆和栈）<\/span><\/li><li data-term='补码'>补码 — 有符号整数的机器表示方式；最高位为 1 时同一个二进制串可被解释成负数，也可被解释成很大的正数 <span class=glossary-ref>（第 2 章：基础语法——变量、流程控制、指针与数组在内存里的样子）<\/span><\/li><li data-term='静态变量'>静态变量 — 与全局变量同处一块数据区域的变量，编译器只在作用域上限制它的可见范围 <span class=glossary-ref>（第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础）<\/span><\/li><li data-term='虚拟内存'>虚拟内存 — 每个进程看到的一套独立地址空间，由 MMU 与操作系统映射到真实物理内存 <span class=glossary-ref>（第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础）<\/span><\/li><li data-term='mmu'>MMU — 内存管理单元，配合操作系统完成虚拟地址到物理地址的映射，映射对程序员无感 <span class=glossary-ref>（第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础）<\/span><\/li><li data-term='虚函数表'>虚函数表 — 存有类虚函数地址的一张表，对象里藏有指向它的指针；运行时据此确定调用哪个函数 <span class=glossary-ref>（第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础）<\/span><\/li><li data-term='小端序'>小端序 — x86 的字节存放方式：数值的低位字节放在低地址，高位字节放在高地址 <span class=glossary-ref>（第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础）<\/span><\/li><li data-term='线程局部存储'>线程局部存储 — 每个线程各持一份拷贝的存储类别，thread_local 修饰的变量属于这一类 <span class=glossary-ref>（第 4–6 章：C++ 特性与高级编程——对象模型、内存管理、虚拟内存与并发基础）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：先找地址，再看读写<\/h2>\n<p>遇到变量、指针、成员访问，先问“它的地址在哪、值存在哪”，再看这条语句读写了哪个内存。脱离地址谈语法，容易背混规则。<\/p>\n<h2>模式 2：高级语句拆成两条内存动作<\/h2>\n<p>指针 * 操作拆成“取目标地址—读写目标地址”；add 拆成“读出—运算—写回”；函数调用拆成“压返回地址—跳转—恢复—返回”。拆到寄存器/内存动作这一层，指令名不再吓人。<\/p>\n<h2>模式 3：按存储期归类变量<\/h2>\n<p>看一个变量先定位置：数据段（全局/静态）、栈（局部）、堆（手动申请）。位置决定生存期、地址是否固定、谁负责释放。<\/p>\n<h2>模式 4：越界先查栈帧布局<\/h2>\n<p>数组异常、返回错乱、跳到奇怪函数时，按“局部变量 → 保存的 rbp → 返回地址”的栈帧顺序排查，判断踩中了哪一层数据。<\/p>\n<h2>模式 5：绑定时机区分对象机制<\/h2>\n<p>普通函数编译期定址，虚函数运行时查表；凡是“同一接口、按实际类型走不同实现”的机制，先想动态绑定和虚表。<\/p>\n<h2>模式 6：争议比较先统一类型<\/h2>\n<p>看到有符号/无符号混比、补码最高位为 1 的数值，先把两边类型统一，再判断相等关系；警告不要当噪音忽略。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>寄存器分工（本书 x86-64 示例）<\/h2>\n<ul><li>\nrax：存放数值，常作函数返回值；eax 是其低 32 位。\n<\/li><li>\nrbp：当前栈帧基准地址；rsp：栈顶地址。\n<\/li><li>\nrdi、rsi、rdx：传递前三个参数的寄存器（低 32 位 edi、esi、edx）。\n<\/li><li>\nrip：存放下一条指令地址。\n<\/ul>\n<h2>类型宽度（本书示例）<\/h2>\n<ul><li>\nchar 1 字节；short 2 字节；int 4 字节；long 8 字节；64 位指针 8 字节。\n<\/ul>\n<h2>一次函数调用往返<\/h2>\n<ol><li>\ncall：压入返回地址，跳函数首地址。\n<\/li><li>\n序言：push rbp；mov rbp, rsp；sub rsp, N 分配局部空间。\n<\/li><li>\n函数体：读写形参副本与局部变量。\n<\/li><li>\n结语：pop rbp 恢复基准；ret 按返回地址送 rip 跳回。\n<\/ol>\n<h2>传参对照<\/h2>\n<ul><li>\n传值：送变量值，帧上是副本，改副本不动本体。\n<\/li><li>\n传指针：送变量地址，* 操作写回本体。\n<\/li><li>\n传引用：汇编同传指针，语法层不能赋 NULL、不能改绑、无引用的引用。\n<\/ul>\n<h2>堆 vs 栈<\/h2>\n<ul><li>\n栈：线程私有；调用申请、返回释放；高地址→低地址生长；一条指令移动 rsp。\n<\/li><li>\n堆：手动 malloc/calloc/realloc/new 申请，free/delete 释放；可共享；低地址→高地址生长；有碎片与泄漏。\n<\/ul>\n<h2>内存区域速查<\/h2>\n<ul><li>\n数据段：全局变量、静态变量、字符串常量，地址编译后固定。\n<\/li><li>\n栈：局部变量、形参副本、返回地址。\n<\/li><li>\n堆：手动申请的大块内存。\n<\/li><li>\n虚拟地址经 MMU + OS 映射到物理内存。\n<\/ul>\n<h2>易错判断<\/h2>\n<ul><li>\n数组传参：传首地址，不复制数组。\n<\/li><li>\n多维数组：物理上一维连续。\n<\/li><li>\n有符号 char 0xff：补码解释为 -1，不等于无符号 255。\n<\/li><li>\nx86 小端：低位字节存低地址。\n<\/li><li>\n虚函数：运行时查虚表动态绑定；普通成员函数编译期静态绑定。\n<\/ul>"}};

/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}
