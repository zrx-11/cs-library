<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>编译器设计 第2版（学习伴侣）</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>
<style id="zs-visual-theme">
/* 知枢 · 深色视觉层 · 只改样式，不改结构
   适用：知枢多书总入口 / 单书伴侣 / 旧版从零推导页。
   设计口径：深色底、钴蓝+鲸青、衬线标题、点阵底纹、无玻璃拟态。 */

:root,
html[data-theme="dark"],
body[data-theme="dark"] {
  --bg: #080d1a;
  --bg-soft: #0b1222;
  --bg2: #0b1222;
  --bg3: #16213b;
  --panel: #101a2f;
  --panel-2: #16213b;
  --card: #101a2f;
  --text: #f1f5ff;
  --text2: #c7d0e5;
  --text3: #8494b4;
  --muted: #8494b4;
  --border: #253252;
  --accent: #5c7cff;
  --accent-strong: #4d6bff;
  --accent2: #16c7d9;
  --accent3: #2bd9a5;
  --accent-soft: #18264a;
  --ok: #2bd9a5;
  --bad: #ff7088;
  --warn: #f5b35c;
  --danger: #ff7088;
  --code-bg: #0a1120;
  --dot: rgba(92, 124, 255, .12);
  --radius: 10px;
  --font-display: "Noto Serif CJK SC", "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
  --font-body: "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --ink: #f1f5ff;
  --ink-2: #c7d0e5;
  --ink-3: #8494b4;
  --paper: #080d1a;
  --paper-2: #101a2f;
  --wash: #0b1222;
  --line: #253252;
  --line-soft: #1b2742;
}

html[data-theme="light"],
body[data-theme="light"],
body[data-theme=""] {
  --bg: #edf1f8;
  --bg-soft: #e4eaf5;
  --bg2: #e4eaf5;
  --bg3: #dbe4f2;
  --panel: #f9fbff;
  --panel-2: #f1f5fc;
  --card: #f9fbff;
  --text: #111827;
  --text2: #26324a;
  --text3: #5b6b86;
  --muted: #5b6b86;
  --border: #c9d4e8;
  --accent: #3950de;
  --accent-strong: #2f43c9;
  --accent2: #0e8fa4;
  --accent3: #12805f;
  --accent-soft: #dbe4ff;
  --ok: #12805f;
  --bad: #c02a44;
  --warn: #9a5b00;
  --danger: #c02a44;
  --code-bg: #eef2f9;
  --dot: rgba(57, 80, 222, .10);
  --ink: #111827;
  --ink-2: #26324a;
  --ink-3: #5b6b86;
  --paper: #edf1f8;
  --paper-2: #f9fbff;
  --wash: #e4eaf5;
  --line: #c9d4e8;
  --line-soft: #dbe4f2;
}

html,
body {
  background-color: var(--bg) !important;
  color: var(--text) !important;
}

body {
  font-family: var(--font-body) !important;
  background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.2px);
  background-size: 26px 26px;
  background-attachment: fixed;
  font-size: 16px;
  line-height: 1.72;
}

h1, h2, h3, h4, h5,
.page h1, .page h2, .page h3,
.brand, .hero-title, .title {
  font-family: var(--font-display) !important;
  letter-spacing: -.012em;
}

h1, h2, h3, h4, h5,
.page h1, .page h2, .page h3 {
  color: var(--text) !important;
}

header,
.topbar,
.topbar-fixed,
#topbar,
.site-header {
  background: var(--bg) !important;
  border-color: var(--border) !important;
  color: var(--text) !important;
}

header,
.topbar,
.topbar-fixed,
#topbar {
  box-shadow: 0 1px 0 var(--border);
}

/* 通用 hero / 页头：旧版单页常用 .header 或 .hero，不是 header 标签 */
.hero,
.header,
.page-header,
.hero-block {
  background: var(--bg) !important;
  color: var(--text) !important;
  border-bottom: 1px solid var(--border);
  box-shadow: none !important;
}

.hero h1,
.header h1,
.page-header h1,
.hero p,
.header p,
.page-header p {
  color: var(--text) !important;
}

.section-title {
  border-left-color: var(--accent) !important;
  color: var(--text) !important;
}

.stat .num,
.metric .num,
.kpi .value {
  color: var(--accent2) !important;
}


.brand span,
.sub,
.meta,
.muted,
.text-muted,
.card .meta,
.book-card .meta {
  color: var(--muted) !important;
}

.sidebar,
aside.sidebar,
#sidebar,
.rail {
  background: var(--bg-soft) !important;

}

#view,
.view {
  background: transparent !important;
  color: var(--text) !important;
}

.page,

  border-color: var(--border);
}

.page h1 {

}

a {

}

a:hover {
  color: var(--accent2) !important;
}

.tab,
.tabs button,
.tabs .tab,
.nav-item,

#nav-toggle,
button {

  background: var(--panel) !important;
  border-color: var(--border) !important;
}

.tab:hover,
.tabs button:hover,
.nav-item:hover,
button:hover {
  background: var(--accent-soft) !important;
}

.tab.active,
.tabs .tab.active,
.nav-item.active,
button.primary,
.btn.primary,
.quiz-check {
  background: var(--accent) !important;

}

.nav-item.active,
.tab.active {

}

.nav-sec,
.nav-label,

}

#progress-bar,
.bar,
.progress {

}

#progress-bar > div,
#progress-fill,

}

input,
select,
textarea,

}

input::placeholder,
textarea::placeholder,

kbd,

html[data-theme="light"] code,

}

body[data-theme="light"] pre,
body[data-theme=""] pre {

07-depth.md"}, {"id": "c08", "title": "SSA 形式与 φ 函数放置", "file": "concepts/c08.md", "chapterIds": ["ch02"], "difficulty": "高难", "source": {"file": "编译器设计 第2版.pdf", "page": 384}, "prerequisites": ["c06"], "depthFragment": "concepts/c08-depth.md"}, {"id": "c09", "title": "常量传播、死代码消除与优化的可观察行为边界", "file": "concepts/c09.md", "chapterIds": ["ch02"], "difficulty": "进阶", "source": {"file": "编译器设计 第2版.pdf", "page": 413}, "prerequisites": ["c07", "c08"], "depthFragment": "concepts/c09-depth.md"}, {"id": "c10", "title": "图着色寄存器分配与溢出代价", "file": "concepts/c10.md", "chapterIds": ["ch03"], "difficulty": "高难", "source": {"file": "编译器设计 第2版.pdf", "page": 528}, "prerequisites": ["c07"], "depthFragment": "concepts/c10-depth.md"}, {"id": "c11", "title": "指令选择：树模式匹配与动态规划覆盖", "file": "concepts/c11.md", "chapterIds": ["ch03"], "difficulty": "进阶", "source": {"file": "编译器设计 第2版.pdf", "page": 466}, "prerequisites": ["c05"], "depthFragment": "concepts/c11-depth.md"}, {"id": "c12", "title": "指令调度：表调度与局部/区域顺序重排", "file": "concepts/c12.md", "chapterIds": ["ch03"], "difficulty": "进阶", "source": {"file": "编译器设计 第2版.pdf", "page": 485}, "prerequisites": ["c11"], "depthFragment": "concepts/c12-depth.md"}, {"id": "c13", "title": "属性文法：综合/继承属性与求值顺序", "file": "concepts/c13.md", "chapterIds": ["ch04"], "difficulty": "进阶", "source": {"file": "编译器设计 第2版.pdf", "page": 152}, "prerequisites": ["c04"], "depthFragment": "concepts/c13-depth.md"}], "glossary": [{"term": "编译器（Compiler）", "def": "把一种语言编写的程序转换为另一种语言编写的程序的计算机程序；典型结构含前端、中端与后端，前端做词法与语法分析，中端做中间表示与优化，后端做指令选择、调度与寄存器分配", "chapterId": "ch01"}, {"term": "词法分析器（Scanner）", "def": "编译器前端的第一阶段：读取字符流，按语言规定的词法规则把字符序列切成单词（token），每个单词归入一个语法范畴（词类）；本书第 2 章讨论其正则表达式、自动机与手工实现", "chapterId": "ch01"}, {"term": "正则表达式（Regular Expression, RE）", "def": "定义单词集合的形式化记号：字母与数字是基本 RE，连接、并（|）、闭包（*）由运算符组合；本书 2.3 节给出其符号表示法与形式化定义", "chapterId": "ch01"}, {"term": "NFA（非确定有限自动机）", "def": "带 ε 转移、同一状态对同一输入可有多条转移的有限自动机；由 Thompson 构造从 RE 得到，识别语言与 RE 相同，但执行前需经子集构造转为 DFA", "chapterId": "ch01"}, {"term": "DFA（确定有限自动机）", "def": "每个状态对每个输入符号至多一条转移、无 ε 转移的有限自动机；执行时不需要回溯，本书 2.4.3 节由 NFA 子集构造得到，2.4.4 节用 Hopcroft 算法最小化", "chapterId": "ch01"}, {"term": "FIRST 集合 / FOLLOW 集合", "def": "LL(1) 分析用的两个预测集合：FIRST(A) 是从符号 A 出发能推导出的串首终结符集合；FOLLOW(A) 是文法中紧跟在 A 后面出现的终结符集合；二者决定分析表同一格是否出现多重动作", "chapterId": "ch01"}, {"term": "LR(1) 项与项目集规范族", "def": "LR 分析中形如 [A→α·β, a] 的项记录产生式右部已识别到的位置与前瞻符 a；所有可达项构成项目集规范族，据此填 Action 与 Goto 表", "chapterId": "ch01"}, {"term": "移进-归约冲突 / 归约-归约冲突", "def": "LR 表同一格同时出现移进与归约动作，或同时出现两条归约动作；前者说明文法含左递归或需更长前瞻，后者说明同一串可由两条不同产生式归约", "chapterId": "ch01"}, {"term": "中间表示（IR）", "def": "编译器在源语言与目标语言之间使用的形式化程序表示；本书第 5 章区分图 IR（语法树、图）与线性 IR（堆栈机代码、三地址代码），并由线性代码建立控制流图", "chapterId": "ch02"}, {"term": "三地址代码（Three-Address Code）", "def": "每条指令至多含一个运算符、两个操作数与一个结果的线性 IR，形如 t1 ← 2、t3 ← t1 × t2；本书以 ILOC 作为贯穿各章的底层线性 IR（附录 A）", "chapterId": "ch02"}, {"term": "基本块（Basic Block）", "def": "线性代码中一段顺序执行的指令序列：只有块首一条入口指令，块内无分支跳入跳出，块尾是最后一条转移指令；基本块是控制流图的结点", "chapterId": "ch02"}, {"term": "控制流图（CFG）", "def": "以基本块为结点、块间转移为边的有向图；数据流分析在 CFG 上按边传播定值、活跃性等信息，本书 5.3.4 节由线性代码建立", "chapterId": "ch02"}, {"term": "到达定值（Reaching Definitions）", "def": "一个变量的定值（赋值）能否沿 CFG 路径到达某程序点且中途未被重新赋值；属前向数据流问题，用迭代算法在不动点上收敛", "chapterId": "ch02"}, {"term": "活跃变量（Live Variable）", "def": "在某程序点之后的路径上还会被引用、且在此之前未被重新定值的变量；属后向数据流问题，其结果直接决定寄存器压力与溢出决策", "chapterId": "ch02"}, {"term": "SSA（静态单赋值形式）", "def": "每个变量只被定值一次的 IR 形式；在控制流合并处插入 φ 函数选择各前驱传来的版本，使变量的定义-使用链唯一，简化常量传播与寄存器分配分析", "chapterId": "ch02"}, {"term": "φ 函数", "def": "SSA 在控制流合并块插入的选择运算：v₁ ← φ(v₂, v₃) 表示按来自哪条前驱路径取对应版本；放置位置由支配边界与变量的定义集合算出", "chapterId": "ch02"}, {"term": "寄存器分配 / 指派", "def": "分配决定哪些活动范围占用寄存器，指派决定每个范围落到哪个具体寄存器；本书第 13 章以冲突图为基础做全局分配，度数超过可用寄存器数的活动范围需溢出到内存", "chapterId": "ch03"}, {"term": "活动范围（Live Range）与冲突图", "def": "一个定值从定义到最后一次引用之间的区间称活动范围；两个活动范围生命周期重叠即在冲突图中连边，图的着色问题等价于寄存器分配问题", "chapterId": "ch03"}, {"term": "溢出（Spill）", "def": "寄存器不足时把某些活动范围降级到内存：在使用前插入 load、在定值后插入 store；溢出代价按相关 load/store 的执行频率估算，优先溢出代价最低的范围", "chapterId": "ch03"}, {"term": "树模式匹配指令选择", "def": "把 IR 表达式平铺成抽象语法树，用重写规则（产生式、成本、代码模板）在树上匹配覆盖，自底向上用动态规划求出成本最低的指令序列；本书 11.4 节讨论", "chapterId": "ch03"}, {"term": "表调度（List Scheduling）", "def": "局部指令调度的主算法：维护就绪指令列表，按优先级排序后每次选出一条发射；本书第 12 章讨论前向/后向表调度、平局打破与区域调度", "chapterId": "ch03"}, {"term": "综合属性 / 继承属性", "def": "属性文法中：综合属性由结点本身、其子结点与常量定义；继承属性由结点本身、其兄弟结点与父结点（外加常量）定义；属性依赖图决定求值顺序，成环则无法求值", "chapterId": "ch04"}, {"term": "过程抽象与调用约定", "def": "编译器为过程建立的受控执行环境：形参映射、栈帧布局、返回值传递、调用者/被调用者保存寄存器规则；本书第 6 章讨论 Algol 类与面向对象语言的命名空间与链接约定", "chapterId": "ch04"}, {"term": "可观察行为（Observable Behavior）", "def": "程序运行时外部可感知的结果：输出、输入交互、未定义之外的异常等；编译器优化只能改变内部实现，不能改变等价程序在所有输入下的可观察行为", "chapterId": "ch02"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [], "flashcards": []}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.32<\/div><h1>第 1 章：前端——词法分析与语法分析<\/h1>\n<blockquote>对应原书第 2 章「词法分析器」（PDF 第 32–75 页；印刷页 = PDF 页 − 15，印刷 17–60）与第 3 章「语法分析器」（PDF 第 76–134 页；印刷 61–119）。偏移 k=15 由第 1 章首页 PDF 第 16 页对应印刷第 1 页、第 2 章首页 PDF 第 32 页对应印刷第 17 页等 13 个章首页逐页图核出。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n把一段单词的形式化规则写成正则表达式，再按 Thompson 构造把它画成 NFA 状态图，说清每个运算符对应哪种状态拼接；\n<\/li><li>\n走完子集构造，从 NFA 列出 DFA 的状态集合与转移表，并用等价类划分把 DFA 最小化；\n<\/li><li>\n对一个给定文法算出 FIRST 与 FOLLOW 集合，指出分析表哪一格出现多重动作，判断它是不是 LL(1) 文法；\n<\/li><li>\n构造 LR(1) 项目集规范族，填出 Action/Goto 表，认出移进-归约冲突与归约-归约冲突分别出现在哪一项；\n<\/li><li>\n说明词法分析与语法分析在输入输出、回溯代价、错误恢复粒度上的分工，以及为什么前端要先分词再分析结构。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>前端把字符流分两步变成带结构的语法树：词法分析用正则表达式与有限自动机把字符切成单词，语法分析用上下文无关文法把单词串归约成语法树；两步各自配套一套自动生成技术——RE 经 Thompson 构造、子集构造、最小化得到词法识别器，文法经 FIRST/FOLLOW 或 LR 项目集得到分析表。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 前端为什么要分成词法与语法两层<\/h3>\n<p>编译器处理源程序的第一个阶段是词法分析：读取字符，按规则判断每个字符在源语言中是否合法，给字符序列分配一个词法范畴（词类）或类型（原书 2.1 节，PDF 第 32 页）。词法分析器是编译器中唯一直接接触输入字符的部件；把这层单独切开，一方面是因为词法规则用有限自动机处理速度快、实现规整，另一方面是因为这层的输入在一定程度上比其他各层更易处理。<\/p>\n<p>第二个阶段是语法分析：词法分析器生成的已归类单词流，交给语法分析器推导一个语法结构，把各个单词适配到源程序设计语言的语法模型中（原书 3.1 节，PDF 第 76 页）。语法分析的输入不再是单个字符，而是一个个标了词类的单词；分析器构造的是句子的结构，而不是字符的切分。<\/p>\n<p>两层分开的直接好处是关注点分离：词法层只回答“这串字符是什么单词、属于哪一类”，语法层只回答“这个单词串按文法怎样拼成合法句子”。手写词法分析器在规则简单时可行；规则一多，工具生成的分析器比手写更常见（原书 3.1 节，PDF 第 76 页）。<\/p>\n<h3>2. 概念 1：正则表达式到 NFA 的 Thompson 构造（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。从 RE 到识别器的第一步是造 NFA：单字符 RE 对应一条带标记的转移；连接把两个小 NFA 首尾相接；并在两个小 NFA 外各加一条 ε 转移到新的起始与接受状态；闭包再用 ε 把接受状态接回起始状态。每个由构造得到的 NFA 至多一个起始状态、一个接受状态（原书 2.4.2 节，PDF 第 48 页）。<\/p>\n<h3>3. 概念 2：子集构造到 DFA 与最小化（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。NFA 可以在同一状态对同一输入走多条路，执行时需要记录当前可能处在的状态集合；子集构造把这样的状态集合整体当作 DFA 的一个状态，逐字符扩展转移，得到执行不需要回溯的 DFA。DFA 最小化按“读入相同串后行为相同”把状态分成等价类，Hopcroft 算法用集合划分反复拆分等价类（原书 2.4.3、2.4.4 节，PDF 第 49、54 页）。<\/p>\n<h3>4. 概念 3：LL(1) 的 FIRST/FOLLOW 与冲突（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。自顶向下分析从文法开始符出发推导句子；表驱动 LL(1) 分析器靠 FIRST 集合预测一个候选产生式能否推出当前输入，靠 FOLLOW 集合处理候选推导出 ε 的情形。同一分析表格子里落进两条不同动作，就说明文法对这一步有二义性，LL(1) 分析器无法无回溯地选择（原书 3.3.3 节，PDF 第 98 页）。<\/p>\n<h3>5. 概念 4：LR 项目集与移进-归约冲突（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。自底向上分析把单词串逐步归约到开始符；LR(1) 分析器的关键数据结构是 Action 表与 Goto 表。项写成 <code>[A→α·β, a]<\/code>，圆点记录右部已识别到的位置，a 是前瞻符；所有可达项组成项目集规范族，填表时同一格既允许移进又允许归约，就是移进-归约冲突；同格两条归约是归约-归约冲突（原书 3.4.1、3.4.2 节，PDF 第 104、109 页）。<\/p>\n<h2>推导一（算法推演）：从正则表达式 <code>(a|b)*abb<\/code> 走到 DFA 的状态转移<\/h2>\n<p>第一步，写正则。目标单词是字母表 <code>{a, b}<\/code> 上以 <code>abb<\/code> 结尾的串，正则取 <code>(a|b)*abb<\/code>。<\/p>\n<p>第二步，Thompson 构造。先对单字符 <code>a<\/code>、<code>b<\/code> 各造一条转移；用并规则造出 <code>a|b<\/code> 的小 NFA，外加 ε 转移到新起点与新终点；闭包规则用 ε 把该小 NFA 的终点接回它自己的起点；再按连接规则依次拼上 <code>a<\/code>、<code>b<\/code>、<code>b<\/code> 三段。构造产物是一张带 ε 边的 NFA，起点一个、终点一个，中间状态都可能带多条 ε 出口。<\/p>\n<p>第三步，ε-闭包。子集构造的初始状态是 NFA 起点的 ε-闭包：从起点出发只沿 ε 边能到达的全部状态组成的集合。之后每取一个输入字符，先对当前集合中每个状态找出沿该字符的转移目标，再对这些目标求 ε-闭包，得到下一个 DFA 状态。<\/p>\n<p>第四步，列转移表。设初始 DFA 状态 <span class=\"katex-inline\">S_0 = \\text{closure}(q_0)<\/span>。对 <span class=\"katex-inline\">S_0<\/span> 读 <code>a<\/code>，求所有 <code>a<\/code> 转移目标的 ε-闭包，记 <span class=\"katex-inline\">S_1<\/span>；读 <code>b<\/code> 用同一闭包步骤得 <span class=\"katex-inline\">S_2<\/span>。逐个新状态重复扩展，直到没有新集合产生。凡集合中包含 NFA 接受状态的 DFA 状态，标记为接受状态。<\/p>\n<p>第五步，最小化。把已达接受态与未达接受态先分成两组；对每个组内状态，按“读 <code>a<\/code> 落到哪组、读 <code>b<\/code> 落到哪组”检查行为是否一致，行为不一致的状态拆到新组，反复直到分组不再变化。同一组内的 DFA 状态合并成一个状态（原书 2.4.4 节，PDF 第 54 页）。<\/p>\n<p>这个推导的不变量是：子集构造前后自动机接受的语言不变；最小化合并的只是行为等价的状态，不改变任何输入串的接受与否。<\/p>\n<h2>推导二（算法推演）：对一个文法算 FIRST/FOLLOW，定位 LL(1) 冲突<\/h2>\n<p>给定文法片段（本书 3.4.2 节用于举例的列表文法的简化形式，原书 PDF 第 109 页）：<\/p>\n<pre><code>List → List Pair\nList → Pair\nPair → &#x27;(&#x27; Pair &#x27;)&#x27;\nPair → &#x27;(&#x27; &#x27;)&#x27;<\/code><\/pre>\n<p>第一步，算 FIRST。终结符只有 <code>(<\/code>、<code>)<\/code>。<code>FIRST(Pair) = { ( }<\/code>；<code>Pair<\/code> 能推出以 <code>(<\/code> 开头的串，<code>FIRST(List)<\/code> 经由 <code>List → Pair<\/code> 也得到 <code>{ ( }<\/code>。<\/p>\n<p>第二步，观察左递归。第一条产生式 <code>List → List Pair<\/code> 的右部以左部自身开头，这是直接左递归。LL(1) 自顶向下推导时，面临输入 <code>(<\/code> 要选产生式，先看 <code>List → List Pair<\/code>：右部首符 <code>List<\/code> 的 FIRST 是 <code>{ ( }<\/code>；再看 <code>List → Pair<\/code>：右部首符 <code>Pair<\/code> 的 FIRST 也是 <code>{ ( }<\/code>。<\/p>\n<p>第三步，填表。分析表中 <code>[List, (]<\/code> 这一格同时落进两条产生式：一条来自 <code>List → List Pair<\/code>，一条来自 <code>List → Pair<\/code>。两条候选在同一个前瞻符 <code>(<\/code> 下都可行，分析器无法无回溯地选定其中一条。<\/p>\n<p>第四步，定性。这是自顶向下分析在左递归文法上的典型失败：左递归让候选产生式的 FIRST 集合重叠。消除左递归或改成右递归形式后，两个候选的首符才可能分开；若分开后仍重叠，需要更长前瞻（如 LL(k)）或改用自底向上的 LR 分析（原书 3.3.3 节，PDF 第 98 页）。<\/p>\n<h2>反事实：去掉前端某个条件会怎样<\/h2>\n<ul><li>\n<strong>不算 FIRST/FOLLOW 就选产生式<\/strong>：分析器在候选之间只能靠猜测，选错就要回溯。回溯时已经输出的中间代码、已经推进的单词指针都要回滚；语法错误的位置也只能在回溯失败后才暴露。LL(1) 表存在的意义，就是用两个集合把“此刻该选哪条产生式”在编译期算成查表动作，运行期不猜。\n<\/li><li>\n<strong>词法层不切词，直接把字符流交给语法分析<\/strong>：文法要为每个字符写规则，标识符、常数、关键字的区分全挤进语法层；单词内部的拼写错误被当成结构错误上报，错误恢复粒度落到字符级，分析表体积和回溯代价都会失控。\n<\/li><li>\n<strong>NFA 不做子集构造，直接驱动识别<\/strong>：执行时要同时维护一条可能的状态路径集合，遇到分叉要保留或回溯，输入一长就需要大量试探；子集构造把不确定性提前消除在编译期，运行期每个状态对每个字符只有一条确定转移。\n<\/li><li>\n<strong>DFA 不最小化<\/strong>：功能仍然正确，但多出来的状态会占用内存，词法分析器在高速扫描时的查表步骤随之增加；最小化只合并行为等价的状态，不会改变接受语言（原书 2.4.4 节，PDF 第 54 页）。\n<\/li><li>\n<strong>文法有二义性却硬填 LR 表<\/strong>：同一格出现两个归约动作，分析器不知道按哪条归约；此时即便给冲突加默认优先级，也只是掩盖文法问题，句子的语法结构在不同归约顺序下可能不同。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章产出的单词流与语法树是中端的输入：第 2 章把语法结构翻译成三地址码与控制流图，再在图上做数据流分析与优化。词法层识别出的单词类型，直接决定中端翻译时取用哪个操作数类型；语法分析留下的树或产生式序列，是语法制导翻译挂接属性的骨架（见第 4 章 c13）。LR 分析比 LL 分析能覆盖更大一类文法，代价是分析表更大、构造算法更复杂；这个取舍贯穿编译器前端设计的各个决策点。<\/p>", "kind": "chapter", "title": "第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因）"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.177<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因）<\/a><\/span><\/div><h1>第 2 章：中端——中间表示、数据流分析与优化<\/h1>\n<blockquote>对应原书第 5 章「中间表示」（PDF 第 177–197 页；印刷 162–182）、第 8 章「优化简介」（PDF 第 313–364 页；印刷 298–349）、第 9 章「数据流分析」（PDF 第 365–412 页；印刷 350–397）、第 10 章「标量优化」（PDF 第 413–455 页；印刷 398–440）。印刷页 = PDF 页 − 15。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分图 IR 与线性 IR，把一段三地址码切成基本块并画出控制流图；\n<\/li><li>\n写出到达定值分析的迭代式，对一个带循环的手算流图走完两轮传播到不动点；\n<\/li><li>\n沿后向方向算活跃变量集合，说明一个变量在程序点活跃意味着什么、它怎样变成寄存器压力；\n<\/li><li>\n说清 SSA 形式为什么要求每个变量只定值一次，φ 函数在控制流合并处按什么规则放置；\n<\/li><li>\n判断一项优化是否可靠，区分不改变可观察行为的合法改写与会改变程序结果的不可靠变换。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>中端把前端留下的语法结构翻译成便于分析的中间表示（IR），在控制流图上用迭代数据流算法求出定值的流向、变量的活跃性等事实，再依据这些事实做常量传播、死代码消除、代码移动等标量优化；SSA 是一种让定义-使用链唯一的 IR 变体，它把多个合并版本显式写成 φ 函数，让后续分析更精确。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. IR 在编译器里承担什么角色<\/h3>\n<p>编译器通常不把源代码直接翻译成目标代码，而是先翻译成中间表示。IR 是编译器大多数处理步骤读取并操纵的核心数据结构：IR 的性质决定了改写特定机器指令、查找特定定值或注释的机制（原书 5.1 节，PDF 第 177 页）。本书把 IR 分成图类（与语法相关的树、图）与线性类（堆栈机代码、三地址代码）两类；线性代码再按基本块组织成控制流图（原书 5.2、5.3、5.3.4 节，PDF 第 178、189、191 页）。<\/p>\n<h3>2. 概念 1：三地址码、基本块与 CFG 构造（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。三地址代码每条指令至多一个运算符、两个操作数、一个结果，形如 <code>t3 ← t1 × t2<\/code>。基本块是一段顺序执行的指令序列：块首是唯一入口，块内不发生分支跳入跳出，块尾是转移指令；以块为结点、块间转移为边，得到 CFG。<\/p>\n<h3>3. 概念 2：到达定值分析与不动点（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。到达定值回答：某变量的一次赋值能否沿 CFG 路径到达当前程序点，且中途没被重新赋值。它是前向数据流问题：入口集合已知，沿边传播，汇合处取并集；每轮迭代把新得到的定值并入各块的入口/出口集合，直到某一轮没有集合再变化，到达不动点（原书 9.2 节，PDF 第 365 页）。<\/p>\n<h3>4. 概念 3：活跃变量分析与寄存器压力（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。活跃变量是后向问题：从程序点往后看，该变量的值还会被引用、且在引用前没有被重新定值，它才活跃。活跃集合决定后端哪些定值必须留在寄存器里；同时活跃的定值越多，寄存器压力越大，超出可用寄存器数就必须溢出（原书 9.2.2 节，PDF 第 370 页）。<\/p>\n<h3>5. 概念 4：SSA 形式与 φ 函数（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。SSA 把每个变量的多次定值拆成不同版本，每个版本只被定值一次；在控制流合并处，来自不同前驱的版本汇成一个选择运算 φ 函数。φ 的放置位置由支配边界与变量定义集合算出：若一个块有多个前驱，且变量在不同路径上被定值，合并块就需要插入 φ（原书 9.3.3 节，PDF 第 384 页）。<\/p>\n<h3>6. 概念 5：标量优化的可靠性边界（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。第 10 章把标量优化分成消除无用与不可达代码、代码移动、特化、冗余消除、为其他变换制造时机几类（原书 10.1 节，PDF 第 413 页）。任何改写都必须保证：在所有输入下，改写后程序的可观察行为与改写前一致；依赖编译期无法证明的事实做猜测性删除或替换，就可能改变程序结果。<\/p>\n<h2>推导一（算法推演）：把一段三地址码切成基本块并建 CFG<\/h2>\n<p>给定 ILOC 风格三地址码（编号为指令序号）：<\/p>\n<pre><code>1   i ← 0\n2   j ← 0\n3   t1 ← i &lt; n\n4   if t1 goto 7\n5   t2 ← j + 1\n6   goto 9\n7   t3 ← i + 1\n8   i ← t3\n9   t4 ← i + j\n10  if t4 goto 2\n11  return<\/code><\/pre>\n<p>第一步，找领导者。程序第一条指令是领导者；任何转移指令的目标是领导者；任何紧跟转移或条件转移之后的指令是领导者。这里领导者为：1（首条）、5（<code>goto 9<\/code> 之外，4 的目标 7 是领导者）、7（4 的转移目标）、9（6 的转移目标）、2（10 的转移目标）。<\/p>\n<p>第二步，切块。每个领导者到下一个领导者之前的指令组成一个基本块：<\/p>\n<ul><li>\n<span class=\"katex-inline\">B_1<\/span>：1–4\n<\/li><li>\n<span class=\"katex-inline\">B_2<\/span>：5–6\n<\/li><li>\n<span class=\"katex-inline\">B_3<\/span>：7–8\n<\/li><li>\n<span class=\"katex-inline\">B_4<\/span>：9–10\n<\/li><li>\n<span class=\"katex-inline\">B_5<\/span>：11\n<\/ul>\n<p>第三步，连边。<span class=\"katex-inline\">B_1<\/span> 末尾条件转移到 <span class=\"katex-inline\">B_3<\/span>，顺序后继是 <span class=\"katex-inline\">B_2<\/span>，所以 <span class=\"katex-inline\">B_1 \\to B_2<\/span>、<span class=\"katex-inline\">B_1 \\to B_3<\/span>；<span class=\"katex-inline\">B_2<\/span> 末尾 <code>goto 9<\/code> 到 <span class=\"katex-inline\">B_4<\/span>；<span class=\"katex-inline\">B_3<\/span> 顺序后继 <span class=\"katex-inline\">B_4<\/span>；<span class=\"katex-inline\">B_4<\/span> 末尾条件转移回 <span class=\"katex-inline\">B_2<\/span> 起点 2，顺序后继 <span class=\"katex-inline\">B_5<\/span>。<\/p>\n<p>第四步，校验。每个块只有一个入口领导者，块内指令顺序执行；块间的边全部来自转移目标与顺序后继。这张图就是后续到达定值、活跃变量分析的工作底图（原书 5.3.4 节，PDF 第 191 页）。<\/p>\n<h2>推导二（算法推演）：到达定值在双块流图上两轮迭代到不动点<\/h2>\n<p>取两个块的简化流图：入口块 <span class=\"katex-inline\">B_1<\/span> 含定值 <span class=\"katex-inline\">d_1: x \\leftarrow 1<\/span>；<span class=\"katex-inline\">B_2<\/span> 含 <span class=\"katex-inline\">d_2: x \\leftarrow x + 1<\/span>，<span class=\"katex-inline\">B_1 \\to B_2<\/span>，<span class=\"katex-inline\">B_2<\/span> 有一条回边到 <span class=\"katex-inline\">B_1<\/span> 之后的汇合块 <span class=\"katex-inline\">B_3<\/span>。记定值集合 <span class=\"katex-inline\">D = \\{d_1, d_2\\}<\/span>。<\/p>\n<p>前向迭代式：<\/p>\n<div class=\"katex-block\">\\text{IN}[B] = \\bigcup_{P \\in \\text{pred}(B)} \\text{OUT}[P], \\quad \\text{OUT}[B] = \\text{GEN}[B] \\cup (\\text{IN}[B] - \\text{KILL}[B])<\/div>\n<p>其中 <code>GEN<\/code> 是块内产生的定值，<code>KILL<\/code> 是被该块内同变量定值覆盖的其他定值。<\/p>\n<p>初始：所有 <code>IN<\/code>、<code>OUT<\/code> 置空。<\/p>\n<p>第一轮：<\/p>\n<ul><li>\n<span class=\"katex-inline\">B_1<\/span>：<code>IN[B₁] = ∅<\/code>，<code>GEN[B₁] = {d₁}<\/code>，<code>KILL[B₁] = ∅<\/code>，<code>OUT[B₁] = {d₁}<\/code>。\n<\/li><li>\n<span class=\"katex-inline\">B_2<\/span>：<code>IN[B₂] = OUT[B₁] = {d₁}<\/code>；<code>GEN[B₂] = {d₂}<\/code>，<code>KILL[B₂] = {d₁}<\/code>（<span class=\"katex-inline\">d_2<\/span> 重定义 <span class=\"katex-inline\">x<\/span>，覆盖同变量的 <span class=\"katex-inline\">d_1<\/span>）；<code>OUT[B₂] = {d₂} ∪ ({d₁} − {d₁}) = {d₂}<\/code>。\n<\/li><li>\n<span class=\"katex-inline\">B_3<\/span>：<code>IN[B₃] = OUT[B₂] = {d₂}<\/code>，<code>OUT[B₃] = {d₂}<\/code>。\n<\/ul>\n<p>第二轮：<\/p>\n<ul><li>\n<span class=\"katex-inline\">B_1<\/span> 的 <code>OUT<\/code> 仍为 <code>{d₁}<\/code>；<span class=\"katex-inline\">B_2<\/span> 的 <code>IN<\/code> 仍为 <code>{d₁}<\/code>，<code>OUT<\/code> 仍为 <code>{d₂}<\/code>；<span class=\"katex-inline\">B_3<\/span> 的集合不变。\n<\/ul>\n<p>两轮之后所有集合不再变化，到达不动点。结论：在 <span class=\"katex-inline\">B_2<\/span> 内 <span class=\"katex-inline\">d_1<\/span> 被 <span class=\"katex-inline\">d_2<\/span> 杀死，<span class=\"katex-inline\">x<\/span> 在 <span class=\"katex-inline\">B_2<\/span> 出口只由 <span class=\"katex-inline\">d_2<\/span> 到达；若某条路径绕过 <span class=\"katex-inline\">B_2<\/span> 直接到 <span class=\"katex-inline\">B_3<\/span>，则 <span class=\"katex-inline\">d_1<\/span> 也能到达 <span class=\"katex-inline\">B_3<\/span>，汇合处 <code>IN[B₃]<\/code> 取两路并集。<\/p>\n<h2>反事实：中端某个条件去掉会怎样<\/h2>\n<ul><li>\n<strong>优化不做可靠性证明就删除“看起来没用”的定值<\/strong>：编译器无法证明某变量在所有路径上都不再被引用，就把它的赋值删掉；若某条异常路径、外部输入或回调还会读取该变量，删除后程序输出改变。死代码消除只能删除在数据流分析中确认无引用的定值（原书 10.2 节，PDF 第 413 页起）。\n<\/li><li>\n<strong>不做活跃变量分析就分配寄存器<\/strong>：后端把每个遇到的变量都占一个寄存器，同时活跃的定值数超过寄存器数量时直接装不下；没有活跃集合作为依据，溢出选择只能随机挑变量，可能把循环内反复使用的变量溢到内存，拖慢热路径。\n<\/li><li>\n<strong>SSA 不插 φ 函数<\/strong>：合并块里同一个名字对应几条不同路径传来的不同版本，分析器把它们当成一次定值，常量传播会把来自某条路径的常数误安到另一条路径上；φ 函数把版本选择显式写出来，定义-使用关系才唯一。\n<\/li><li>\n<strong>数据流分析只走一轮就停<\/strong>：循环回边带来的定值还没传播到循环头部，入口集合被当成空；后续优化依据不完整的信息做决策，可能漏掉可消除的冗余或误判定值可达。迭代必须走到集合不再变化。\n<\/li><li>\n<strong>把局部优化当全局优化用<\/strong>：只在单个基本块内成立的事实（块内定值顺序可见），出了块就可能被其他路径改写；跨块复用需要全局数据流分析提供依据，局部信息不能直接推广到全局（原书 8.4、8.5 节，PDF 第 317 页起）。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章的 IR 与分析结果是后端决策的输入：活跃集合与活动范围直接喂给第 3 章的寄存器分配；三地址码与表达式树喂给指令选择；调度器依赖 CFG 上的依赖关系排指令顺序。第 4 章回到全流程：属性文法把前端语法树与中端翻译动作挂接，过程抽象决定栈帧与参数传递这些代码形式决策，而代码形式又反过来影响中端分析能拿到什么信息。<\/p>", "kind": "chapter", "title": "第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化）"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.456<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化）<\/a><\/span><\/div><h1>第 3 章：后端——指令选择、指令调度与寄存器分配<\/h1>\n<blockquote>对应原书第 11 章「指令选择」（PDF 第 456–484 页；印刷 441–469）、第 12 章「指令调度」（PDF 第 485–513 页；印刷 470–498）、第 13 章「寄存器分配」（PDF 第 514–545 页；印刷 499–530）。印刷页 = PDF 页 − 15。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明指令选择在 IR 与目标 ISA 之间做什么映射，区分树模式匹配与窥孔优化两条路线；\n<\/li><li>\n用重写规则对一棵表达式树做自底向上的成本标注，选出覆盖整棵树的成本最低指令序列；\n<\/li><li>\n复述表调度的主循环：就绪列表、优先级排序、每次发射一条指令，说清前向与后向调度、平局打破各解决什么问题；\n<\/li><li>\n由活动范围建立冲突图，按度数解释图着色为什么等价于寄存器分配，区分自顶向下与自底向上着色；\n<\/li><li>\n按 load/store 执行频率估算一个活动范围的溢出代价，说明为什么优先溢出代价最低的范围。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>后端把中端 IR 落到具体处理器：指令选择把 IR 结构匹配成目标机器指令序列，指令调度重排指令顺序以填满流水线停顿，寄存器分配把同时活跃的定值映射到有限的物理寄存器，装不下的范围按溢出代价降级到内存。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 后端三个决策各自面对的约束<\/h3>\n<p>指令选择：为将程序从中间表示（抽象语法树或底层线性代码）转换为可执行形式，编译器必须把每个 IR 结构映射到目标处理器指令集中一个对应且等价的结构（原书 11.1 节，PDF 第 456 页）。选择哪些指令影响编译后代码的体积与速度。<\/p>\n<p>指令调度：一组操作的执行时间严重依赖其执行顺序。调度器试图重排过程中的操作，改进运行时间；本质上，指令调度试图让每个周期执行尽可能多的操作（原书 12.1 节，PDF 第 485 页）。<\/p>\n<p>寄存器分配：处理器最受限制的资源之一是硬件寄存器集合；寄存器分配器确定哪些定值留在寄存器中、哪个寄存器容纳哪些值（原书 13.1 节，PDF 第 514 页）。分配器无法把某个值在整个生命周期都留在寄存器里时，就要在其生命周期的部分或全部时间把值存到内存。<\/p>\n<h3>2. 概念 1：树模式匹配与动态规划覆盖（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c11.md\" target=\"_blank\" rel=\"noopener\">概念 c11<\/a>。编译器把 IR 表达式平铺成抽象语法树；重写规则由产生式、成本与代码模板组成，规则匹配 AST 中的各种结点。自底向上给子树标注可用规则的成本，组合时取成本最小的覆盖方案（原书 11.4.1 节，PDF 第 466 页）。<\/p>\n<h3>3. 概念 2：表调度与局部/区域重排（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c12.md\" target=\"_blank\" rel=\"noopener\">概念 c12<\/a>。局部调度在单个基本块内重排指令；表调度维护就绪列表，指令的操作数都已可用就进入列表，按优先级排序后逐条发射。前向调度从块首往后排，后向调度从块尾往前排；区域调度跨越单个块的边界（原书 12.3、12.4 节，PDF 第 487、485 页）。<\/p>\n<h3>4. 概念 3：图着色分配与溢出代价（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。两个活动范围生命周期重叠，在冲突图中连一条边；给图着色需要的颜色数就是同时活跃范围的上限。可用寄存器数 <span class=\"katex-inline\">k<\/span> 小于图的色数时，必须把某些范围溢出：在使用前插入 load，在定值后插入 store；溢出代价按相关 load/store 的执行频率估算（原书 13.4.3、13.4.2 节，PDF 第 528、527 页）。<\/p>\n<h2>推导一（算法推演）：一棵加法树的规则覆盖与成本选择<\/h2>\n<p>表达式 <code>a + b<\/code> 在 ILOC 平铺后形成一棵小树：根是加法结点，两个叶子分别是名字 <code>a<\/code>、<code>b<\/code>。本书图 11-4 列出的重写规则含 <code>Reg → Num<\/code>（<code>loadI<\/code>，成本 1）、<code>Reg → Reg + Reg<\/code>（<code>add<\/code>，成本 1）等条目，每条规则给出产生式、成本与代码模板（原书 11.4.1 节，PDF 第 466 页）。<\/p>\n<p>第一步，自底向上标注叶子。叶子 <code>a<\/code>、<code>b<\/code> 若在寄存器中，可直接由 <code>Reg → Reg<\/code> 覆盖；若在内存，先用 load 规则载入寄存器。记叶子载入寄存器的成本为 <span class=\"katex-inline\">c_L<\/span>。<\/p>\n<p>第二步，标根结点。加法根可被 <code>Reg → Reg + Reg<\/code> 覆盖，代码模板是一条 <code>add r1, r2 → r3<\/code>，成本 1。整棵树覆盖成本 = 两个叶子载入成本之和 + 1。<\/p>\n<p>第三步，比较备选规则。若 ISA 提供带内存操作数的加法规则（对应树中一个叶子直接接内存），该规则省去一条 load；把备选覆盖方案的总成本逐项相加，取最小值。动态规划在每个子树结点记录“以该结点为根、被某条规则覆盖时的最小成本”，父结点组合子结点的最优值，避免枚举所有指令序列组合。<\/p>\n<p>第四步，回溯所选规则。从根结点选定的规则出发，向下按记录的最优子方案取叶子规则，拼出最终指令序列。覆盖必须无重复、无遗漏地盖住整棵树；漏掉一个子树，结果就缺一段计算。<\/p>\n<h2>推导二（算法推演）：建冲突图并估溢出代价<\/h2>\n<p>第一步，划分活动范围。一个定值从定义点到最后一次引用点之间的区间是一个活动范围 <span class=\"katex-inline\">LR_i<\/span>。遍历 CFG 上的定值与引用，把每个范围的起点、终点标出。<\/p>\n<p>第二步，连冲突边。若两个范围 <span class=\"katex-inline\">LR_1<\/span>、<span class=\"katex-inline\">LR_2<\/span> 在程序中某一操作期间都是活跃的，二者无法同处一个寄存器，在图 <span class=\"katex-inline\">(N, E)<\/span> 中连边 <span class=\"katex-inline\">(LR_1, LR_2)<\/span>；仅当双方活跃区间重叠才连边，生命周期不相交的范围可共用寄存器（原书 13.4.3 节，PDF 第 528 页）。<\/p>\n<p>第三步，算度数。每个结点的度数是与它冲突的范围数；度数大于等于可用寄存器数 <span class=\"katex-inline\">k<\/span> 的范围，着色时必然需要额外颜色。<\/p>\n<p>第四步，估溢出代价。一个范围若包含 load 且没有其他使用，该 load 是死代码；若包含 store 且没有其他使用，该 store 是死代码。活的 load/store 才计入溢出代价：范围溢出后，使用前要插入 load、定值后要插入 store，代价按这些 load/store 在执行路径上的出现频率加权——循环内的访问权重高，循环外的权重低（原书 13.4.2 节，PDF 第 527 页）。<\/p>\n<p>第五步，选溢出对象。着色失败时，优先把溢出代价最低的范围降级到内存：拆分它的活动范围，在必要处插入 load/store，再重新建图着色。代价估算保证被淘汰的范围对性能与代码体积影响最小。<\/p>\n<h2>反事实：后端某个条件去掉会怎样<\/h2>\n<ul><li>\n<strong>寄存器不够却不做溢出<\/strong>：分配器把超过 <span class=\"katex-inline\">k<\/span> 个同时活跃的范围硬塞进 <span class=\"katex-inline\">k<\/span> 个寄存器，后分配的范围覆盖先分配者的寄存器值；引用被覆盖的定值时读到错误数据，程序算错且故障位置远离出错指令。\n<\/li><li>\n<strong>只按静态出现次数估溢出代价<\/strong>：循环体内执行多次的 load/store 与循环外执行一次的访问被同等对待，可能把热路径上的变量溢到内存、把冷路径变量留在寄存器；按执行频率加权正是为了让溢出决策落在真正拖慢运行时的位置。\n<\/li><li>\n<strong>指令选择只做语法树自底向上遍历，不比较规则成本<\/strong>：每个结点独立选第一条匹配规则，漏掉“用一条复杂指令替代多条简单指令”的更优覆盖；代码体积与指令数都偏高。树模式动态规划的价值是在子树组合层面取最小成本。\n<\/li><li>\n<strong>不做指令调度，按 IR 原始顺序发射<\/strong>：操作数尚未就绪的指令进入流水线后停顿等待，除法、内存访问这类长延迟操作后面的空闲周期被浪费；重排把不依赖该结果的指令提前发射，填满停顿（原书 12.1 节，PDF 第 485 页）。\n<\/li><li>\n<strong>调度时不查依赖关系<\/strong>：把写某寄存器的指令排到读该寄存器的指令之前，或把分支排到条件计算之前，流水线取到的操作数还是旧值；调度只能在不改变依赖顺序的前提下重排，优先级排序不能越过真实数据依赖。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>后端的输入全部来自中端：CFG 上的活跃集合变成活动范围，喂给冲突图；三地址码与表达式树喂给指令选择；数据依赖关系来自数据流分析。第 4 章把这条链路放回全流程：过程抽象与调用约定决定哪些寄存器由调用者保存、哪些由被调用者保存，这直接影响活动范围的边界与溢出代价估算；代码形式的选择也限制了指令选择与调度能拿到的 IR 粒度。<\/p>", "kind": "chapter", "title": "第 3 章：后端——指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出）"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.16<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：后端——指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出）<\/a><\/span><\/div><h1>第 4 章：全流程贯通——编译概览、上下文相关分析、过程抽象与代码形式<\/h1>\n<blockquote>对应原书第 1 章「编译概观」（PDF 第 16–31 页；印刷 1–16）、第 4 章「上下文相关分析」（PDF 第 135–176 页；印刷 120–161）、第 6 章「过程抽象」（PDF 第 213–259 页；印刷 198–244）、第 7 章「代码形式」（PDF 第 260–312 页；印刷 245–297），并参照附录 A「ILOC」（PDF 第 546–554 页；印刷 531–539）。印刷页 = PDF 页 − 15。原书第 2、3、5、8–13 章已分别并入本伴侣第 1–3 章，本章只做贯通与衔接。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按顺序复述一次编译从字符流到目标代码的完整流程，标出每个阶段的输入、输出与配套算法；\n<\/li><li>\n区分语法正确与上下文合法：词法、语法通过之后，类型检查、作用域、声明一致性这类检查为什么还必须做；\n<\/li><li>\n画出属性依赖图，区分综合属性与继承属性，说明依赖图成环时为什么无法求值；\n<\/li><li>\n说清过程抽象在编译器里落实为哪些决策：形参映射、栈帧布局、返回值、调用者/被调用者保存寄存器；\n<\/li><li>\n说明代码形式（寄存器 vs 内存、值的编码方式、数组与记录布局）怎样限制中端分析与后端生成的选择空间。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>把前端分词与语法树、中端 IR 与数据流优化、后端指令与分配串起来，中间还夹着一层上下文相关分析：语法正确的程序仍可能含类型、作用域与声明错误；属性文法为这层检查提供挂接框架，过程抽象与代码形式则把语言语义落成编译器可操作的栈帧、命名空间与存储布局决策。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 编译流程的四个部分<\/h3>\n<p>本书把内容分为篇幅大致相等的四部分：第一部分（第 2–4 章）涵盖编译器前端及建立前端所用工具；第二部分（第 5–7 章）探讨从源代码到编译器中间形式的映射；第三部分（第 8–10 章）介绍代码优化；第四部分（第 11–13 章）专注编译器后端使用的算法（原书前言，PDF 第 9 页）。第 1 章从概念上概述现代编译器的所有主要组件（原书 1.1 节，PDF 第 16 页）。<\/p>\n<h3>2. 概念 1：属性文法与求值顺序（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c13.md\" target=\"_blank\" rel=\"noopener\">概念 c13<\/a>。语法正确的输入程序仍可能包含严重错误，导致编译无法完成；检测这类错误需要更深入的检查，把每条语句放到实际上下文中进行考虑。属性文法用综合属性、继承属性两类属性描述上下文信息，属性之间的依赖关系构成依赖图，图上的求值顺序由依赖关系决定（原书 4.1、4.3 节，PDF 第 135、152 页）。<\/p>\n<h3>3. 过程抽象：命名空间、形参与调用约定<\/h3>\n<p>过程是大多数现代程序设计语言底层的核心抽象之一。过程建立一个受控的执行环境，每个过程都具有自有的命名存储空间（局部变量）；过程帮助定义组件之间的接口，跨组件组合成程序后成为生成代码的基础（原书 6.1 节，PDF 第 213 页）。编译器要为源语言支持的每种抽象映射出目标处理器上的操作和数据结构：形参与实参的绑定、返回值的传递、调用者与被调用者之间哪些寄存器需要保存，都属于过程抽象的落地决策。<\/p>\n<h3>4. 代码形式：值、数据结构与存储布局<\/h3>\n<p>源代码结构到目标机器操作的转换是编译过程中的根本操作。编译前端生成 IR 时，以及后端针对真实处理器产生汇编代码时，会遇到许多问题：变量标量是存放在虚拟寄存器中，还是降级到内存；数组元素、记录字段如何布局；表达式运算结果放在哪里（原书 7.1 节，PDF 第 260 页）。这些决策在转换过程中做出，记录在 IR 的命名空间里，供后续分析与生成使用。本书各章使用的底层线性 IR 是 ILOC：一种抽象 RISC 机器的汇编代码，三地址形式，假设只有有限种数据类型、未指定具体位数（原书附录 A，PDF 第 546 页）。<\/p>\n<h2>推导一（流程推演）：一个源程序走完一次编译的各阶段<\/h2>\n<p>第一步，词法分析。字符流进入词法分析器，正则表达式与有限自动机把字符序列切成带词类的单词；非法字符在此阶段报出。<\/p>\n<p>第二步，语法分析。单词流进入 LL 或 LR 分析器，按上下文无关文法归约成语法树或产生式序列；结构不合法的句子在此阶段报出。<\/p>\n<p>第三步，上下文相关分析。沿语法树挂接属性计算：类型检查、作用域查找、声明与使用的一致性、存储类别检查；语法合法但类型不符、名字未声明之类的错误在此阶段暴露（原书第 4 章，PDF 第 135 页起）。<\/p>\n<p>第四步，翻译成 IR。语法结构与属性结果被翻译成三地址码或图 IR；线性 IR 再切成基本块、建成 CFG。<\/p>\n<p>第五步，中端优化。在 CFG 上跑数据流分析：到达定值、活跃变量、支配性；按分析结果做常量传播、死代码消除、冗余消除、代码移动；需要时把 IR 转成 SSA 形式简化分析。<\/p>\n<p>第六步，后端生成。指令选择把 IR 结构匹配成目标指令；指令调度重排顺序填流水线停顿；寄存器分配把活动范围映射到物理寄存器，溢出范围插入 load/store；最终产出可重定位目标代码。<\/p>\n<p>第七步，衔接与链接。过程抽象留下的调用约定、命名空间与外部引用，在链接阶段与其他编译单元、库代码拼合（原书第 6 章讨论的命名空间与链接，PDF 第 213 页起）。<\/p>\n<h2>推导二（推演）：属性依赖图怎样决定求值顺序<\/h2>\n<p>取一个赋值语句 <code>x = a + b<\/code> 的语法树：根是赋值结点，右孩子是加法结点，加法的两个孩子是名字 <code>a<\/code>、<code>b<\/code>。<\/p>\n<p>第一步，标综合属性。名字结点的类型由符号表查得；加法结点的类型由两个操作数类型推出；赋值结点检查左右类型是否兼容。这类由结点本身与子结点算出的属性是综合属性，求值方向自底向上。<\/p>\n<p>第二步，标继承属性。若外层语句把期望类型传给表达式结点，表达式再传给子表达式，这类由父结点、兄弟结点传来的属性是继承属性，求值方向自顶向下。<\/p>\n<p>第三步，建依赖图。每个属性是一个结点；属性 A 的计算用到属性 B，就画一条从 B 到 A 的边。求值必须沿边的方向进行：被依赖的属性先算，依赖方后算。<\/p>\n<p>第四步，检查成环。若某条规则定义的属性依赖于自身，或依赖图中出现回路，不存在任何顺序能把所有属性算出；此时属性文法对该输入无法求值，需要改写规则或换用循环求值方式（原书 4.3 节，PDF 第 152 页）。<\/p>\n<h2>反事实：贯通链路里某一层缺失会怎样<\/h2>\n<ul><li>\n<strong>跳过上下文相关分析直接出 IR<\/strong>：类型不符的运算、未声明的名字、作用域错误被带到中端与后端，错误在生成代码后才以崩溃或错误结果形式暴露，定位要回溯多个编译阶段；这层检查把语义错误拦在结构分析之后、代码生成之前。\n<\/li><li>\n<strong>属性依赖图允许成环还硬求值<\/strong>：属性互相等待对方先算，程序顺序上不存在合法求值次序；强行按某个固定顺序算，用到的属性还是未定义值。综合/继承属性的规则设计必须保证依赖图无环。\n<\/li><li>\n<strong>过程调用约定不统一<\/strong>：形参、返回值、保存寄存器在调用者与被调用者之间各执一套约定，跨过程调用后寄存器值被覆盖、返回值取错位置；调用约定是编译器与库代码、其他编译单元之间的接口契约。\n<\/li><li>\n<strong>代码形式决策推迟到指令选择阶段<\/strong>：前端生成 IR 时不记录值放在寄存器还是内存、数组如何布局，后端面对同一个 IR 结构要反复猜测存储方式；布局信息提前记录在 IR 命名空间里，后续各阶段才能直接取用（原书 7.1 节，PDF 第 260 页）。\n<\/li><li>\n<strong>把局部语言规则当成全局规则套用<\/strong>：单个过程内成立的命名规则，遇到外部链接、全局命名空间就失效；过程抽象与链接约定正是为了界定每个抽象的作用域边界。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章是前三章的回环：第 1 章前端的单词流与语法树，是属性挂接的骨架；第 2 章中端的 IR 与数据流，是上下文检查结果落地的载体；第 3 章后端的指令与分配，受代码形式与调用约定约束。读完这条链路，再回看任何一个编译教材中的具体算法，都能先定位它处于流程的哪一段、输入输出是什么、失效时故障会在哪一层暴露。<\/p>", "kind": "chapter", "title": "第 4 章：全流程贯通——编译概览、上下文相关分析、过程抽象与代码形式"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.48<\/div><h1>正则表达式到 NFA：Thompson 构造法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章（原书第 2 章 2.4.2 节，PDF 第 48 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>词法分析器把字符流变换为单词流，每个单词归入一个语法范畴。单词种类少时手写试探程序可行；关键字、标识符、常数、运算符增多后，规则的拼接、选择与重复关系难以用过程代码清晰表达。需要一种形式化记号先把单词集合写下来，再由确定的机械步骤转成识别器。正则表达式（RE）承担记号角色，Thompson 构造承担“记号→自动机”的第一步转换。没有这一步，词法规则与识别代码绑在一起，改一个关键字就要重写扫描逻辑。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>RE 的基本元素<\/strong>：字母表 <span class=\"katex-inline\">\\Sigma<\/span> 中的单个字符是基本 RE；空串 <span class=\"katex-inline\">\\varepsilon<\/span> 是 RE；用连接、并（<code>|<\/code>）、闭包（<code>*<\/code>）组合已有 RE；括号改变优先级（原书 2.3 节，PDF 第 45 页起）。<\/p>\n<p><strong>NFA（非确定有限自动机）<\/strong>：五元组，含状态集合 <span class=\"katex-inline\">Q<\/span>、字母表 <span class=\"katex-inline\">\\Sigma<\/span>、转移函数 <span class=\"katex-inline\">\\delta<\/span>、起始状态 <span class=\"katex-inline\">q_0<\/span>、接受状态集合 <span class=\"katex-inline\">F<\/span>。非确定性体现在：同一状态对同一字符可有多条转移；允许不读字符的 <span class=\"katex-inline\">\\varepsilon<\/span> 转移。<\/p>\n<p><strong>Thompson 构造五条规则<\/strong>（原书 2.4.2 节，PDF 第 48 页，图 2-4）：<\/p>\n<ol><li>\n单字符 <code>a<\/code>：新状态 <span class=\"katex-inline\">s<\/span> 到新状态 <span class=\"katex-inline\">f<\/span> 一条标记 <code>a<\/code> 的转移。\n<\/li><li>\n连接 <code>AB<\/code>：<code>A<\/code> 的接受用 <span class=\"katex-inline\">\\varepsilon<\/span> 接到 <code>B<\/code> 起始；整体起始取 <code>A<\/code>，接受取 <code>B<\/code>。\n<\/li><li>\n并 <code>A|B<\/code>：新增起始，两条 <span class=\"katex-inline\">\\varepsilon<\/span> 指向 <code>A<\/code>、<code>B<\/code> 起始；新增接受，两侧接受各用 <span class=\"katex-inline\">\\varepsilon<\/span> 指向它。\n<\/li><li>\n闭包 <code>A*<\/code>：新增起始与接受；起始经 <span class=\"katex-inline\">\\varepsilon<\/span> 到 <code>A<\/code> 起始或直接到接受；<code>A<\/code> 接受经 <span class=\"katex-inline\">\\varepsilon<\/span> 回 <code>A<\/code> 起始或到接受。\n<\/li><li>\n括号只规定边界，不产生新结构。\n<\/ol>\n<p>构造不变量：每个小 NFA 至多一个起始、一个接受；闭包是唯一让接受接回起始的规则。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<p>对 <span class=\"katex-inline\">a(b|c)*<\/span> 逐子表达式构造：<\/p>\n<p>第一步，单字符 <code>a<\/code>：<span class=\"katex-inline\">s_0 \\xrightarrow{a} f_0<\/span>。<\/p>\n<p>第二步，并 <code>b|c<\/code>：各造单字符 NFA，<span class=\"katex-inline\">s_b \\xrightarrow{b} f_b<\/span>，<span class=\"katex-inline\">s_c \\xrightarrow{c} f_c<\/span>；新增 <span class=\"katex-inline\">s_u<\/span>、<span class=\"katex-inline\">f_u<\/span>，<span class=\"katex-inline\">\\varepsilon<\/span> 边 <span class=\"katex-inline\">s_u \\to s_b<\/span>、<span class=\"katex-inline\">s_u \\to s_c<\/span>、<span class=\"katex-inline\">f_b \\to f_u<\/span>、<span class=\"katex-inline\">f_c \\to f_u<\/span>。<\/p>\n<p>第三步，闭包 <span class=\"katex-inline\">(b|c)<em><\/span>：新增 <span class=\"katex-inline\">s_<\/em><\/span>、<span class=\"katex-inline\">f_<em><\/span>；<span class=\"katex-inline\">s_<\/em> \\xrightarrow{\\varepsilon} s_u<\/span>，<span class=\"katex-inline\">s_<em> \\xrightarrow{\\varepsilon} f_<\/em><\/span>（零次重复）；<span class=\"katex-inline\">f_u \\xrightarrow{\\varepsilon} s_u<\/span>（重复），<span class=\"katex-inline\">f_u \\xrightarrow{\\varepsilon} f_*<\/span>（退出）。<\/p>\n<p>第四步，连接：<span class=\"katex-inline\">f_0<\/span> 用 <span class=\"katex-inline\">\\varepsilon<\/span> 接到 <span class=\"katex-inline\">s_<em><\/span>；整体起始 <span class=\"katex-inline\">s_0<\/span>，整体接受 <span class=\"katex-inline\">f_<\/em><\/span>。<\/p>\n<p>第五步，核对语言：读一个 <code>a<\/code> 后可在闭包走零次或任意次 <code>b<\/code>/<code>c<\/code>，最后到 <span class=\"katex-inline\">f_*<\/span>；识别的正是以 <code>a<\/code> 开头、后跟若干 <code>b<\/code> 或 <code>c<\/code> 的单词。构造顺序与运算符优先级一致：先括号内层，再闭包，再连接，最后并（原书 2.4.3 节旁注，PDF 第 49 页）。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：单词规则属于正则语言，能用有限次连接、并、闭包描述，且每个子表达式都能切到单字符层。\n<\/li><li>\n<strong>边界 1<\/strong>：NFA 不能直接高效驱动识别。它带 <span class=\"katex-inline\">\\varepsilon<\/span> 边与分叉，执行时要同时维护可能的状态路径集合；这是子集构造要解决的问题（见 c02）。\n<\/li><li>\n<strong>边界 2<\/strong>：RE 表达不了嵌套配对。括号必须成对且嵌套合法的串需要计数或栈，超出正则语言能力，交给语法分析层的上下文无关文法。\n<\/li><li>\n<strong>失败案例：规则歧义<\/strong>。两个 RE 识别的单词有公共前缀时，最长匹配与优先级要在词法规范里另行规定；Thompson 构造只保证每个 RE 对应一个 NFA，不解决两个单词谁先选中。\n<\/li><li>\n<strong>失败案例：构造顺序错<\/strong>。先拼外层并再拼内层闭包，拼接点错位，最终自动机接受的串与原 RE 不一致；构造是递归下降过程，子表达式必须先完成再并入父结构。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>RE 与上下文无关文法<\/strong>：RE 只描述单词内部字符序列，无递归嵌套能力；文法描述单词之间的结构关系。词法层用 RE，语法层用文法。\n<\/li><li>\n<strong>Thompson NFA 与手工 NFA<\/strong>：手工 NFA 可能共享状态；Thompson 产物结构规整，子表达式对应独立状态片段，便于自动生成，代价是状态数偏多。\n<\/li><li>\n<strong>NFA 与 DFA<\/strong>：NFA 允许同字符多转移与 <span class=\"katex-inline\">\\varepsilon<\/span> 边，构造快、状态少；DFA 每个状态对每个字符至多一条转移，运行无需回溯。二者识别能力等价，转换由子集构造完成。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无，是前端最底层的自动机起点。后继：c02 把本节 NFA 经子集构造转成 DFA 并最小化；c03、c04 的文法分析以本节切出的单词流为输入。状态图在词法规范定稿后通常不再改动，编译器开发者调的是 RE 层规则。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（正则表达式到 NFA：Thompson 构造法）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：Thompson 构造的依赖链、状态拼接与完整算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把一个正则表达式变成可执行的词法识别器，先往回追四层前提：<\/p>\n<ol><li>\n词法分析面对的输入是字符流，规则要能描述“哪些字符序列属于哪一类单词”。若规则直接写成过程代码，规则与代码互相缠绕，扩展关键字或常数格式时要在试探循环里改分支；因此先需要一种与执行方式无关的形式化记号，这就是正则表达式。\n<\/li><li>\n记号只是书写层，机器不会直接解释 RE。需要一个机械、可重复的转换步骤，把每个 RE 结构映射成一个状态转移装置。装置必须接受与 RE 完全相同的字符集合，不能凭设计者临场发挥。\n<\/li><li>\n转换第一站选 NFA 而不是 DFA，是因为 NFA 的两条特性正好匹配 RE 的两种结构：分叉转移对应并运算符，<span class=\"katex-inline\">\\varepsilon<\/span> 转移对应连接与闭包的拼接点。若第一步就构造 DFA，子集枚举在构造期就要做，规则组合稍复杂就难以手工跟踪。\n<\/li><li>\n构造过程必须满足结构不变量：每个子表达式生成的小自动机只有一个入口、一个出口。只有入口出口固定，父结构才能按连接、并、闭包三种方式拼接；若子自动机有多个入口，拼接点无法唯一定位。\n<\/ol>\n<p>依赖链方向：字符流分类需求 → RE 记号 → NFA 装置 → 固定入口出口的小自动机片段 → 五条拼接规则 → 完整 NFA。<\/p>\n<h2>正向演算：五条规则的逐步执行<\/h2>\n<h3>规则 1：单字符<\/h3>\n<p>输入 RE 为字符 <span class=\"katex-inline\">a \\in \\Sigma<\/span>。新建起始 <span class=\"katex-inline\">s<\/span>、接受 <span class=\"katex-inline\">f<\/span>；转移 <span class=\"katex-inline\">\\delta(s, a) = \\{f\\}<\/span>。小自动机没有 <span class=\"katex-inline\">\\varepsilon<\/span> 边，也没有其他出边，识别语言为 <span class=\"katex-inline\">\\{a\\}<\/span>。<\/p>\n<h3>规则 2：连接 <code>AB<\/code><\/h3>\n<p>设已构造 <span class=\"katex-inline\">N_A<\/span>（起始 <span class=\"katex-inline\">s_A<\/span>、接受 <span class=\"katex-inline\">f_A<\/span>）与 <span class=\"katex-inline\">N_B<\/span>（起始 <span class=\"katex-inline\">s_B<\/span>、接受 <span class=\"katex-inline\">f_B<\/span>）。新增 <span class=\"katex-inline\">\\varepsilon<\/span> 转移 <span class=\"katex-inline\">f_A \\to s_B<\/span>。整体起始 <span class=\"katex-inline\">s_A<\/span>，整体接受 <span class=\"katex-inline\">f_B<\/span>。执行时先在 <span class=\"katex-inline\">N_A<\/span> 走完，经 <span class=\"katex-inline\">\\varepsilon<\/span> 边进入 <span class=\"katex-inline\">N_B<\/span>，<span class=\"katex-inline\">\\varepsilon<\/span> 边不消耗输入字符。<\/p>\n<h3>规则 3：并 <code>A|B<\/code><\/h3>\n<p>新增起始 <span class=\"katex-inline\">s_u<\/span> 与接受 <span class=\"katex-inline\">f_u<\/span>。四条 <span class=\"katex-inline\">\\varepsilon<\/span> 边：<span class=\"katex-inline\">s_u \\to s_A<\/span>、<span class=\"katex-inline\">s_u \\to s_B<\/span>、<span class=\"katex-inline\">f_A \\to f_u<\/span>、<span class=\"katex-inline\">f_B \\to f_u<\/span>。分支选择发生在 <span class=\"katex-inline\">s_u<\/span>：读下一个字符之前，自动机可以走 <span class=\"katex-inline\">A<\/span> 路或 <span class=\"katex-inline\">B<\/span> 路；两路在 <span class=\"katex-inline\">f_u<\/span> 汇合。<\/p>\n<h3>规则 4：闭包 <code>A*<\/code><\/h3>\n<p>新增起始 <span class=\"katex-inline\">s_<em><\/span> 与接受 <span class=\"katex-inline\">f_<\/em><\/span>。四条 <span class=\"katex-inline\">\\varepsilon<\/span> 边：<span class=\"katex-inline\">s_<em> \\to s_A<\/span>（进入重复），<span class=\"katex-inline\">s_<\/em> \\to f_<em><\/span>（零次重复，直接退出），<span class=\"katex-inline\">f_A \\to s_A<\/span>（至少再重复一次），<span class=\"katex-inline\">f_A \\to f_<\/em><\/span>（退出重复）。<span class=\"katex-inline\">f_A \\to s_A<\/span> 是闭包独有的回边，也是整个构造中唯一从接受侧接回起始侧的转移。<\/p>\n<h3>规则 5：括号<\/h3>\n<p>括号不产生状态与边，只规定子表达式边界；构造时先对最内层 RE 执行规则 1–4，结果再并入外层。<\/p>\n<h3>组合顺序与不变量校验<\/h3>\n<p>按运算符优先级从内向外：先单字符，再闭包，再连接，最后并。每完成一个子表达式，记录它的起始与接受两个状态供父规则取用。构造结束后，整体 NFA 的起始是最外层 RE 的起始，接受是最外层 RE 的接受。每一步拼接前后，小自动机都保持单入口单出口，父规则才能确定往哪里接。<\/p>\n<h2>具体算例：<code>(a|b)*abb<\/code> 的 NFA 状态表<\/h2>\n<p>这是教材用于展示闭包与并组合的典型形式（参照原书图 2-5，PDF 第 49 页），字母表 <span class=\"katex-inline\">\\Sigma = \\{a, b\\}<\/span>。<\/p>\n<p>第一步，造 <code>a<\/code> 与 <code>b<\/code>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">N_a<\/span>：<span class=\"katex-inline\">s_a \\xrightarrow{a} f_a<\/span>\n<\/li><li>\n<span class=\"katex-inline\">N_b<\/span>：<span class=\"katex-inline\">s_b \\xrightarrow{b} f_b<\/span>\n<\/ul>\n<p>第二步，并 <code>a|b<\/code>：新增 <span class=\"katex-inline\">s_u<\/span>、<span class=\"katex-inline\">f_u<\/span>；边 <span class=\"katex-inline\">s_u \\xrightarrow{\\varepsilon} s_a<\/span>，<span class=\"katex-inline\">s_u \\xrightarrow{\\varepsilon} s_b<\/span>，<span class=\"katex-inline\">f_a \\xrightarrow{\\varepsilon} f_u<\/span>，<span class=\"katex-inline\">f_b \\xrightarrow{\\varepsilon} f_u<\/span>。<\/p>\n<p>第三步，闭包 <code>(a|b)<em><\/code>：新增 <span class=\"katex-inline\">s_<\/em><\/span>、<span class=\"katex-inline\">f_<em><\/span>；边 <span class=\"katex-inline\">s_<\/em> \\xrightarrow{\\varepsilon} s_u<\/span>，<span class=\"katex-inline\">s_<em> \\xrightarrow{\\varepsilon} f_<\/em><\/span>，<span class=\"katex-inline\">f_u \\xrightarrow{\\varepsilon} s_u<\/span>，<span class=\"katex-inline\">f_u \\xrightarrow{\\varepsilon} f_*<\/span>。<\/p>\n<p>第四步，连接后缀 <code>abb<\/code>：再造三个单字符小 NFA，依次用 <span class=\"katex-inline\">\\varepsilon<\/span> 边把闭包接受接到第一个 <code>a<\/code> 的起始，第一个 <code>a<\/code> 的接受接到第二个 <code>b<\/code> 的起始，第二个 <code>b<\/code> 的接受接到第三个 <code>b<\/code> 的起始。整体接受是最后一个 <code>b<\/code> 的接受状态。<\/p>\n<p>第五步，读串验证。串 <code>abb<\/code>：从 <span class=\"katex-inline\">s_<em><\/span> 经 <span class=\"katex-inline\">f_<\/em><\/span> 退出零次闭包，再依次读 <code>a<\/code>、<code>b<\/code>、<code>b<\/code> 到达接受。串 <code>bababb<\/code>：闭包内先走 <code>b<\/code>，再走 <code>a<\/code>，退出闭包后读 <code>abb<\/code>。串 <code>aba<\/code>：最后读到 <code>a<\/code> 时后缀第三个位置应为 <code>b<\/code>，无对应转移，拒绝。<\/p>\n<h2>第二算例：特殊 RE 的构造处理<\/h2>\n<ul><li>\n<strong><span class=\"katex-inline\">\\varepsilon<\/span><\/strong>：只含空串的 RE，构造为一条 <span class=\"katex-inline\">s \\xrightarrow{\\varepsilon} f<\/span>，不读任何字符即到接受。\n<\/li><li>\n<strong>空语言<\/strong>：没有串可接受的 RE，构造一个只有起始状态、无接受状态的小自动机，不产生任何出口转移。\n<\/li><li>\n**重复 <code>A+<\/code>（等价于 <span class=\"katex-inline\">AA*<\/span>）**：本书以基础运算符表达，需要时按连接与闭包组合，不额外新增规则。\n<\/ul>\n<h2>延伸推演：状态数与 <span class=\"katex-inline\">\\varepsilon<\/span> 边的后期角色<\/h2>\n<p>按规则计数，一个含 <span class=\"katex-inline\">n<\/span> 个字符与 <span class=\"katex-inline\">n-1<\/span> 个运算符的 RE，构造出的状态数随子表达式数量线性增长：每个单字符贡献两个状态，并与闭包各新增两个状态。与手工直接设计的 NFA 相比，Thompson 产物多出的状态主要来自每个子表达式独立的入口出口，这些冗余在后续 DFA 最小化阶段才被合并。<\/p>\n<p><span class=\"katex-inline\">\\varepsilon<\/span> 边分两类：拼接边（连接、并的汇合点）与回边（闭包重复）。构造阶段保留它们，是为了让每条规则对应清晰的结构片段；进入识别阶段后，<span class=\"katex-inline\">\\varepsilon<\/span> 边意味着“不读字符就能移动状态”，识别器必须把沿 <span class=\"katex-inline\">\\varepsilon<\/span> 边可达的状态一并纳入当前状态集合。子集构造第一步就是求 <span class=\"katex-inline\">\\varepsilon<\/span>-闭包，把这些不耗字符的移动一次性算清（见 c02）。构造阶段不删 <span class=\"katex-inline\">\\varepsilon<\/span> 边，是因为删除会破坏子表达式片段的独立性；删除与合并留到最小化阶段。<\/p>\n<h2>对抗性追问：闭包规则少一条边会怎样<\/h2>\n<p>若闭包漏掉 <span class=\"katex-inline\">s_<em> \\to f_<\/em><\/span>，零次重复的串无法退出闭包，空串与纯后缀串被错误拒绝；若漏掉 <span class=\"katex-inline\">f_A \\to s_A<\/span> 回边，闭包最多重复一次，两次以上重复无法识别；若漏掉 <span class=\"katex-inline\">f_A \\to f_*<\/span>，走完一次 <span class=\"katex-inline\">A<\/span> 后没有出口。四条边各对应一种合法串形，缺一条就缩小接受语言。<\/p>\n<p>再追一层：若连接规则不经过 <span class=\"katex-inline\">\\varepsilon<\/span> 边，而是直接把 <span class=\"katex-inline\">f_A<\/span> 与 <span class=\"katex-inline\">s_B<\/span> 合并成一个状态，<span class=\"katex-inline\">N_A<\/span> 的接受身份与 <span class=\"katex-inline\">N_B<\/span> 的起始身份混在同一状态，<span class=\"katex-inline\">N_A<\/span> 走完时自动机可能误判已经到达整体接受。保留独立状态加 <span class=\"katex-inline\">\\varepsilon<\/span> 边，正是为了把子自动机的接受语义与下一段的进入语义分开。<\/p>\n<h2>第三算例：嵌套运算符的构造次序<\/h2>\n<p>正则 <code>a|bc<em><\/code> 与 <code>(a|b)c<\/em><\/code> 括号不同，构造结果不同。按优先级：先闭包，再连接，最后并。<\/p>\n<ul><li>\n<code>a|bc<em><\/code>：<code>c<\/em><\/code> 先套闭包，再与 <code>b<\/code> 连接成 <code>bc*<\/code>，最后与 <code>a<\/code> 并。接受的串是 <code>a<\/code> 或若干个 <code>b<\/code> 后跟零到多个 <code>c<\/code>。\n<\/li><li>\n<code>(a|b)c<em><\/code>：先并 <code>a|b<\/code>，整体再套 <code>c<\/em><\/code>。接受的串是 <code>a<\/code> 或 <code>b<\/code> 后跟零到多个 <code>c<\/code>。\n<\/ul>\n<p>差别在 <code>b<\/code> 能否单独出现：前者 <code>b<\/code> 后面必须有 <code>c<\/code> 类后缀，后者 <code>b<\/code> 可单独结束。构造次序由括号与优先级固定，次序错了，自动机接受的语言随之改变。<\/p>\n<h2>延伸推演：构造产物与识别执行的分工<\/h2>\n<p>Thompson 构造在编译器构建期完成，产物是 NFA 结构；运行期识别输入的是后续子集构造得到的 DFA。构造期多留的状态与 ε 边不进入扫描热路径，这是 NFA 中间形态的代价可以接受的原因：构造算法规整、可自动生成，冗余状态在最小化阶段合并。<\/p>\n<p>构造规则的正确性可以按语言等价性核对：单字符规则识别 <span class=\"katex-inline\">\\{a\\}<\/span>；连接规则识别两语言串接；并规则识别两语言并集；闭包规则识别 <span class=\"katex-inline\">L^*<\/span>（零次或多次重复）。每条规则保持“构造产物语言 = 子表达式语言组合”，递归到最内层单字符，整体 NFA 语言与原 RE 等价。<\/p>\n<h2>对抗性追问：拼接点状态身份混淆会怎样<\/h2>\n<p>连接规则若把 <span class=\"katex-inline\">N_A<\/span> 的接受状态与 <span class=\"katex-inline\">N_B<\/span> 的起始状态合并为一个状态，<span class=\"katex-inline\">N_A<\/span> 走完时自动机误判已到整体接受；同时 <span class=\"katex-inline\">N_B<\/span> 的进入语义混进 <span class=\"katex-inline\">N_A<\/span> 的终点。保留独立状态加 ε 边，正是为了把子自动机的“完成”与下一段的“开始”分开。并规则照同一原则：两个分支的起点、终点都靠新增状态隔离，不能共用原有状态。<\/p>\n<p>再追一层：单字符规则若误用 ε 边标记转移，该字符就不消耗输入，识别时与空串无法区分；单字符转移必须标具体输入符号，ε 边只承担拼接与重复。<\/p>\n<h2>延伸推演：构造正确性的递归核对与状态计数<\/h2>\n<p>构造规则按语言等价性逐层保持：单字符规则识别 <span class=\"katex-inline\">\\{a\\}<\/span>；连接规则识别两语言串接；并规则识别两语言并集；闭包规则识别 <span class=\"katex-inline\">L^*<\/span>。递归到最内层单字符，整体 NFA 语言与原 RE 等价。核对构造是否正确，就是从最内层子表达式向外，检查每条拼接规则有没有改变子语言的组合方式。<\/p>\n<p>状态计数随子表达式数量线性增长：每个单字符贡献两个状态，并与闭包各新增两个状态。与手工直接设计的 NFA 相比，Thompson 产物多出的状态主要来自每个子表达式独立的入口出口；这些冗余在后续 DFA 最小化阶段合并，构造期不追求状态精简。<\/p>\n<h2>第四算例：识别串在 NFA 上的路径走查<\/h2>\n<p>对 <span class=\"katex-inline\">a(b|c)<em><\/span>，串 <code>acb<\/code>：从 <span class=\"katex-inline\">s_0<\/span> 读 <code>a<\/code> 到 <span class=\"katex-inline\">f_0<\/span>，ε 进闭包起点 <span class=\"katex-inline\">s_<\/em><\/span>；闭包内走 <span class=\"katex-inline\">c<\/span> 分支到 <span class=\"katex-inline\">f_u<\/span>，ε 回 <span class=\"katex-inline\">s_u<\/span> 再走 <span class=\"katex-inline\">b<\/span> 分支到 <span class=\"katex-inline\">f_u<\/span>，ε 退出到 <span class=\"katex-inline\">f_*<\/span>。串 <code>ac<\/code>：闭包走一次 <span class=\"katex-inline\">c<\/span> 后退出。串 <code>ca<\/code>：首字符 <code>c<\/code> 无从 <span class=\"katex-inline\">s_0<\/span> 出发的转移，拒绝。识别路径上每一步的可选分支，在子集构造后折叠为 DFA 状态集合。<\/p>\n<h2>对抗性追问：ε 边与字符边混用会怎样<\/h2>\n<p>单字符转移若误标成 ε，该字符不消耗输入，识别时空串与单字符无法区分；ε 边只承担拼接、汇合与重复，字符边必须标具体输入符号。反过来，拼接点若把两个小自动机的状态直接合并，前一段的接受身份与后一段的进入身份混在同一状态，走完前一段会误判整体接受；保留独立状态加 ε 边正是隔离两种语义。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nThompson 构造中，闭包规则独有的回边从哪个状态接到哪个状态？\n<\/li><li>\n连接规则把两条小自动机的哪两个状态用 <span class=\"katex-inline\">\\varepsilon<\/span> 边接起来？\n<\/li><li>\n并规则新增几个状态、几条 <span class=\"katex-inline\">\\varepsilon<\/span> 边？\n<\/li><li>\n构造产物对每个子表达式保留哪两个固定状态作为拼接点？\n<\/li><li>\n为什么 NFA 阶段保留多余的 <span class=\"katex-inline\">\\varepsilon<\/span> 边，而不在构造时就删掉？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "正则表达式到 NFA：Thompson 构造法"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.49<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">正则表达式到 NFA：Thompson 构造法<\/a><\/span><\/div><h1>子集构造到 DFA 与 DFA 最小化（Hopcroft 算法）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章（原书第 2 章 2.4.3、2.4.4 节，PDF 第 49、54 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>Thompson 构造出的 NFA 带 <span class=\"katex-inline\">\\varepsilon<\/span> 边与分叉转移。识别输入时，同一字符可能把自动机带到多个状态，执行器必须同时记录一条可能的路径集合；遇到分叉要保留备选路径或事后回溯，输入一长就要大量试探。词法分析器在扫描每个源文件时反复运行，识别阶段不能再付回溯代价。子集构造把 NFA 的“状态集合”整体当作 DFA 的一个状态，在编译期消除不确定性；最小化则去掉行为等价的冗余状态，控制识别器的内存与查表开销。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong><span class=\"katex-inline\">\\varepsilon<\/span>-闭包<\/strong>：对 NFA 状态集合 <span class=\"katex-inline\">T<\/span>，<span class=\"katex-inline\">\\text{closure}(T)<\/span> 是从 <span class=\"katex-inline\">T<\/span> 中状态出发、只沿 <span class=\"katex-inline\">\\varepsilon<\/span> 边能到达的全部状态（含 <span class=\"katex-inline\">T<\/span> 本身）。<\/p>\n<p><strong>子集构造<\/strong>：算法把 NFA 的状态子集映射为 DFA 状态。初始 DFA 状态是 NFA 起始状态的 <span class=\"katex-inline\">\\varepsilon<\/span>-闭包；对每个已生成的子集 <span class=\"katex-inline\">S<\/span> 和每个输入字符 <span class=\"katex-inline\">c<\/span>，先取 <span class=\"katex-inline\">S<\/span> 中所有状态沿 <span class=\"katex-inline\">c<\/span> 的转移目标，再求这些目标的 <span class=\"katex-inline\">\\varepsilon<\/span>-闭包，作为 <span class=\"katex-inline\">S<\/span> 经 <span class=\"katex-inline\">c<\/span> 到达的 DFA 状态；重复扩展直到没有新子集产生。子集内含 NFA 接受状态的，标为 DFA 接受状态（原书 2.4.3 节，PDF 第 49 页）。<\/p>\n<p><strong>DFA 等价<\/strong>：两个状态 <span class=\"katex-inline\">p<\/span>、<span class=\"katex-inline\">q<\/span> 等价，当且仅当对任意输入串，从 <span class=\"katex-inline\">p<\/span> 出发与从 <span class=\"katex-inline\">q<\/span> 出发要么都接受、要么都拒绝。等价状态读相同字符后落到等价的下一状态。<\/p>\n<p><strong>Hopcroft 最小化<\/strong>：按行为等价把状态分成集合。初始把接受态与非接受态分为两组；对每个组内状态，按“读各字符分别落到哪个组”检查行为是否一致，行为不一致的拆到新组；反复拆分直到分组不再变化（原书 2.4.4 节，PDF 第 54 页，图 2-9）。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<h3>子集构造五步<\/h3>\n<p>第一步，算初始集 <span class=\"katex-inline\">S_0 = \\text{closure}(\\{q_0\\})<\/span>，放入待处理队列。<\/p>\n<p>第二步，取队列中一个未扩展子集 <span class=\"katex-inline\">S<\/span>。对每个字符 <span class=\"katex-inline\">c \\in \\Sigma<\/span>，求 <span class=\"katex-inline\">M = \\bigcup_{q \\in S} \\delta(q, c)<\/span>；若 <span class=\"katex-inline\">M<\/span> 非空，算 <span class=\"katex-inline\">T = \\text{closure}(M)<\/span>。<\/p>\n<p>第三步，若 <span class=\"katex-inline\">T<\/span> 是新子集，加入 DFA 状态集与队列；记录转移 <span class=\"katex-inline\">S \\xrightarrow{c} T<\/span>。<\/p>\n<p>第四步，重复第二、三步，直到队列为空。<\/p>\n<p>第五步，标记接受态：凡子集与 NFA 接受状态集合 <span class=\"katex-inline\">F<\/span> 相交的 DFA 状态为接受态。<\/p>\n<h3>最小化两步<\/h3>\n<p>第一步，初始划分：接受态一组，非接受态一组。<\/p>\n<p>第二步，拆分迭代。取一个组 <span class=\"katex-inline\">P<\/span>，对其中每个状态按“读 <span class=\"katex-inline\">a<\/span> 落到哪组、读 <span class=\"katex-inline\">b<\/span> 落到哪组”建立行为签名；签名不同的状态不能留在同组，拆出子组。用新子组替换 <span class=\"katex-inline\">P<\/span>，直到某一轮没有组被拆分。同一组内的状态合并为一个 DFA 状态（原书 2.4.4 节，PDF 第 54 页）。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：待转换的是确定的 NFA，转移函数与 <span class=\"katex-inline\">\\varepsilon<\/span> 边已完整列出；输入字母表 <span class=\"katex-inline\">\\Sigma<\/span> 固定。\n<\/li><li>\n<strong>边界 1：状态数可能膨胀<\/strong>。子集构造后 DFA 状态数在最坏情况下随 NFA 状态数指数增长；词法规则通常有限，实际规模可控，但理论上不能假定 DFA 与 NFA 同阶。\n<\/li><li>\n<strong>边界 2：不可达状态要剔除<\/strong>。从初始 DFA 状态沿转移到不了的状态不参与识别，最小化前应先删除，否则划分时它们占独立分组。\n<\/li><li>\n<strong>失败案例：漏算 <span class=\"katex-inline\">\\varepsilon<\/span>-闭包<\/strong>。只取字符转移目标、不补 <span class=\"katex-inline\">\\varepsilon<\/span> 可达状态，下一子集丢掉可经 <span class=\"katex-inline\">\\varepsilon<\/span> 到达的分支，本应接受的串被拒绝。\n<\/li><li>\n<strong>失败案例：按状态编号而非行为分组<\/strong>。最小化时若把“长得像”的状态分在一组，等价状态未合并、不等价状态被混编，DFA 在某些输入上行为错误。拆分依据必须是读字符后的落点组，而不是状态本身的编号。\n<\/li><li>\n<strong>边界 3：最小化不改变语言<\/strong>。合并的只是行为等价状态；任何输入串的接受与否在前后保持一致。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>子集构造与最小化<\/strong>：子集构造解决“不确定→确定”，状态数可能偏多；最小化解决“等价冗余→合并”，两者顺序不能颠倒——先有完整 DFA 才能按行为划分等价类。\n<\/li><li>\n<strong>Hopcroft 与 Brzozowski<\/strong>：本书 2.6.2 节另介绍一种 DFA 最小化方法 Brzozowski 算法；Hopcroft 用集合划分反复拆分等价类，Brzozowski 用两次反转与子集构造达到最小化，两条路线产物同为最小 DFA（原书 2.6.2 节，PDF 第 55 页起）。\n<\/li><li>\n<strong>DFA 与 NFA 识别能力<\/strong>：二者接受同一正则语言；差别只在执行方式。DFA 运行期每步唯一，适合扫描热路径；NFA 构造期生成快，适合工具内部中间形态。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 给出待转换的 Thompson NFA。后继：c03、c04 的语法分析以词法层 DFA 切出的单词流为输入。DFA 一旦在编译工具生成，运行期不再改动；词法规范调整时，整条 RE→NFA→DFA→最小化流水线重跑一遍即可得到新识别器。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（子集构造到 DFA 与 DFA 最小化（Hopcroft 算法））<\/summary><div class=\"depth-body\"><h1>c02 深度推导：子集构造的闭包演算、DFA 状态表与最小化拆分<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>确定化之前先往回追三层前提：<\/p>\n<ol><li>\n识别器运行在扫描热路径上，每个源文件都要反复跑。若识别阶段保留 NFA 的分叉，执行器要在内存里维护一组可能路径，分叉处做选择或回溯；词法分析对速度敏感，运行期不能承担这套试探成本。\n<\/li><li>\n把不确定性挪到编译期处理，需要一个对象把“可能处在哪些状态”打包记录。这个对象就是 NFA 的状态子集；子集之间的转移由字符转移与 <span class=\"katex-inline\">\\varepsilon<\/span> 移动共同决定。\n<\/li><li>\n打包之后还必须去掉冗余状态。完整 DFA 里常有两个状态对所有输入行为一致，保留两份只占内存、增加查表步数；最小化按行为等价合并，不改变接受语言。\n<\/ol>\n<p>依赖链方向：运行期不能回溯 → 状态子集打包 → 闭包与字符转移算 DFA 转移 → 接受态标记 → 行为等价分组 → 最小 DFA。<\/p>\n<h2>正向演算：子集构造的逐步算法<\/h2>\n<h3><span class=\"katex-inline\">\\varepsilon<\/span>-闭包的计算<\/h3>\n<p>给定 NFA 状态集合 <span class=\"katex-inline\">T<\/span>：<\/p>\n<pre><code>closure(T):\n    Stack ← T\n    R ← T\n    while Stack 非空:\n        q ← 弹出 Stack\n        for 每条 q --ε--&gt; p:\n            if p ∉ R:\n                R ← R ∪ {p}\n                压入 Stack\n    return R<\/code><\/pre>\n<p>闭包把不消耗输入字符就能到达的状态全部纳入；后续字符转移只从闭包结果出发。<\/p>\n<h3>子集构造主循环<\/h3>\n<pre><code>S0 ← closure({q0})\nQueue ← {S0}\nDFA_states ← {S0}\nwhile Queue 非空:\n    S ← 弹出 Queue\n    for c ∈ Σ:\n        M ← ⋃_{q ∈ S} δ(q, c)\n        if M = ∅: 继续\n        T ← closure(M)\n        if T ∉ DFA_states:\n            DFA_states ← DFA_states ∪ {T}\n            Queue ← Queue ∪ {T}\n        记录转移 S --c--&gt; T<\/code><\/pre>\n<p>接受态判定：<span class=\"katex-inline\">S \\cap F \\neq \\varnothing<\/span> 的 DFA 状态标为接受。<\/p>\n<h3>最小化的分组算法<\/h3>\n<pre><code>P ← {接受态组, 非接受态组}\nrepeat:\n    for 每个组 G ∈ P:\n        按行为签名 split(G)\n        签名 = 各字符落点所属组的编号序列\n        签名不同的状态拆为不同子组\n    直到 P 不再变化\n合并每个最终组为一个 DFA 状态<\/code><\/pre>\n<p>拆分是稳定的细化过程：只把同组内行为不一致的状态分开，从不把已分开的组合回去；因此有限轮次后必然停止。<\/p>\n<h2>具体算例：一个小 NFA 的 DFA 状态表<\/h2>\n<p>取字母表 <span class=\"katex-inline\">\\{a, b\\}<\/span>，NFA 状态 <span class=\"katex-inline\">q_0, q_1, q_2<\/span>，转移：<span class=\"katex-inline\">q_0 \\xrightarrow{a} q_1<\/span>，<span class=\"katex-inline\">q_1 \\xrightarrow{b} q_2<\/span>，<span class=\"katex-inline\">q_2<\/span> 是接受态；另设 <span class=\"katex-inline\">q_0<\/span> 经 <span class=\"katex-inline\">\\varepsilon<\/span> 可到 <span class=\"katex-inline\">q_1<\/span>。<\/p>\n<p>第一步，初始闭包 <span class=\"katex-inline\">S_0 = \\text{closure}(\\{q_0\\}) = \\{q_0, q_1\\}<\/span>。<\/p>\n<p>第二步，<span class=\"katex-inline\">S_0<\/span> 读 <code>a<\/code>：<span class=\"katex-inline\">M = \\delta(q_0,a) \\cup \\delta(q_1,a) = \\{q_1\\}<\/span>，<span class=\"katex-inline\">T = \\text{closure}(\\{q_1\\}) = \\{q_1\\}<\/span>，记 <span class=\"katex-inline\">S_1 = \\{q_1\\}<\/span>，转移 <span class=\"katex-inline\">S_0 \\xrightarrow{a} S_1<\/span>。<\/p>\n<p>第三步，<span class=\"katex-inline\">S_0<\/span> 读 <code>b<\/code>：<span class=\"katex-inline\">M = \\varnothing<\/span>，无转移。<\/p>\n<p>第四步，<span class=\"katex-inline\">S_1<\/span> 读 <code>a<\/code>：<span class=\"katex-inline\">M = \\varnothing<\/span>；读 <code>b<\/code>：<span class=\"katex-inline\">M = \\{q_2\\}<\/span>，<span class=\"katex-inline\">T = \\{q_2\\}<\/span>，记 <span class=\"katex-inline\">S_2 = \\{q_2\\}<\/span>，转移 <span class=\"katex-inline\">S_1 \\xrightarrow{b} S_2<\/span>。<\/p>\n<p>第五步，<span class=\"katex-inline\">S_2<\/span> 不含新转移；<span class=\"katex-inline\">S_2<\/span> 含接受态 <span class=\"katex-inline\">q_2<\/span>，标为 DFA 接受态。最终 DFA 三个状态 <span class=\"katex-inline\">S_0, S_1, S_2<\/span>，转移表如上。<\/p>\n<h2>第二算例：等价状态合并<\/h2>\n<p>设一个 DFA 有状态 <span class=\"katex-inline\">p, q, r<\/span>：<span class=\"katex-inline\">p<\/span> 非接受，<span class=\"katex-inline\">q<\/span> 非接受，<span class=\"katex-inline\">r<\/span> 接受；<span class=\"katex-inline\">p \\xrightarrow{a} q<\/span>，<span class=\"katex-inline\">q \\xrightarrow{a} p<\/span>，<span class=\"katex-inline\">p \\xrightarrow{b} r<\/span>，<span class=\"katex-inline\">q \\xrightarrow{b} r<\/span>。<\/p>\n<p>第一步，初始分组：<span class=\"katex-inline\">\\{p, q\\}<\/span>（非接受）、<span class=\"katex-inline\">\\{r\\}<\/span>（接受）。<\/p>\n<p>第二步，看 <span class=\"katex-inline\">\\{p, q\\}<\/span> 的行为签名：<span class=\"katex-inline\">p<\/span> 读 <code>a<\/code> 落到 <span class=\"katex-inline\">\\{p,q\\}<\/span> 组，读 <code>b<\/code> 落到 <span class=\"katex-inline\">\\{r\\}<\/span> 组；<span class=\"katex-inline\">q<\/span> 读 <code>a<\/code> 落到 <span class=\"katex-inline\">\\{p,q\\}<\/span> 组，读 <code>b<\/code> 落到 <span class=\"katex-inline\">\\{r\\}<\/span> 组。签名相同，<span class=\"katex-inline\">p<\/span> 与 <span class=\"katex-inline\">q<\/span> 等价，合并为一个状态。<\/p>\n<p>第三步，分组不再变化，最小 DFA 两个状态。合并后读 <code>a<\/code> 在两状态间循环，读 <code>b<\/code> 进入接受态。<\/p>\n<h2>延伸推演：状态数的上界与不可达状态<\/h2>\n<p>子集构造的 DFA 状态数上界是 <span class=\"katex-inline\">2^{|Q|}<\/span>，因为 NFA 的每个状态子集都可能成为一个 DFA 状态。实际词法规则下，多数子集不可达或行为等价；最小化后通常远小于上界。构造完成后应先做一次可达性遍历：从 <span class=\"katex-inline\">S_0<\/span> 沿转移表走一遍，到不了的状态删除，不参与后续分组。<\/p>\n<p>最小化得到的 DFA 在同构意义下唯一：任何两个最小 DFA 若接受同一正则语言，状态之间存在一一对应与对应转移。这也是把最小化作为词法识别器定型步骤的依据。<\/p>\n<h2>对抗性追问：漏算闭包会怎样<\/h2>\n<p>若子集构造时只取字符转移目标、不补 <span class=\"katex-inline\">\\varepsilon<\/span> 可达状态，<span class=\"katex-inline\">q_0<\/span> 经 <span class=\"katex-inline\">\\varepsilon<\/span> 到 <span class=\"katex-inline\">q_1<\/span> 这条免费移动被丢掉；本应从 <span class=\"katex-inline\">q_1<\/span> 继续的分支在 DFA 里消失，某些串在 NFA 里存在接受路径、在 DFA 里被拒绝。闭包必须在初始状态与每次字符转移之后各算一次，两处漏一处都会漏路径。<\/p>\n<p>再追一层：若接受态判定只看子集“等于” <span class=\"katex-inline\">F<\/span> 而不是与 <span class=\"katex-inline\">F<\/span> 相交，多元素子集里夹着一个接受态也不会被标记，接受判定同样出错。<\/p>\n<h2>第三算例：等价状态的拆分迭代<\/h2>\n<p>设 DFA 状态 <span class=\"katex-inline\">p, q, r, s<\/span>：<span class=\"katex-inline\">p, q<\/span> 非接受，<span class=\"katex-inline\">r, s<\/span> 接受。转移：<span class=\"katex-inline\">p \\xrightarrow{a} q<\/span>，<span class=\"katex-inline\">q \\xrightarrow{a} p<\/span>，<span class=\"katex-inline\">p \\xrightarrow{b} r<\/span>，<span class=\"katex-inline\">q \\xrightarrow{b} s<\/span>，<span class=\"katex-inline\">r \\xrightarrow{a} r<\/span>，<span class=\"katex-inline\">s \\xrightarrow{a} s<\/span>。<\/p>\n<p>第一步，初始分组 <span class=\"katex-inline\">G_1 = \\{p, q\\}<\/span>，<span class=\"katex-inline\">G_2 = \\{r, s\\}<\/span>。<\/p>\n<p>第二步，看 <span class=\"katex-inline\">G_1<\/span>：<span class=\"katex-inline\">p<\/span> 读 <code>a<\/code> 落 <span class=\"katex-inline\">G_1<\/span>，读 <code>b<\/code> 落 <span class=\"katex-inline\">G_2<\/span>；<span class=\"katex-inline\">q<\/span> 读 <code>a<\/code> 落 <span class=\"katex-inline\">G_1<\/span>，读 <code>b<\/code> 落 <span class=\"katex-inline\">G_2<\/span>。签名相同，<span class=\"katex-inline\">p, q<\/span> 等价。<\/p>\n<p>第三步，看 <span class=\"katex-inline\">G_2<\/span>：<span class=\"katex-inline\">r<\/span> 读 <code>a<\/code> 落 <span class=\"katex-inline\">G_2<\/span>，<span class=\"katex-inline\">s<\/span> 读 <code>a<\/code> 落 <span class=\"katex-inline\">G_2<\/span>，签名相同，<span class=\"katex-inline\">r, s<\/span> 等价。分组不再变化，最小 DFA 两个状态。<\/p>\n<p>若把转移改成 <span class=\"katex-inline\">q \\xrightarrow{b} r<\/span>、<span class=\"katex-inline\">p \\xrightarrow{b} s<\/span>，签名落点组仍同为 <span class=\"katex-inline\">G_2<\/span>，拆分结论不变；只有当某字符落到不同组，同组状态才需要拆开。<\/p>\n<h2>延伸推演：最小 DFA 的唯一性与构造顺序<\/h2>\n<p>接受同一正则语言的两个最小 DFA，状态之间存在一一对应与对应转移；最小化在同构意义下唯一。这也是把最小化作为词法识别器定型步骤的依据：工具生成的 DFA 经过最小化，状态数不依赖构造过程中的偶然冗余。<\/p>\n<p>构造顺序不能颠倒：先有完整 DFA 才能按读字符后的落点行为划分等价类；子集构造未完成就分组，行为样本不足，等价关系判不准。不可达状态先剔除再分组，否则它们占独立分组却不参与任何识别路径。<\/p>\n<h2>对抗性追问：子集漏算可达状态会怎样<\/h2>\n<p>子集构造时，字符转移目标求闭包漏掉某个 ε 可达状态，下一子集就缺一条分支；NFA 里存在的接受路径在 DFA 上消失，本应接受的串被拒绝。闭包必须覆盖所有不耗字符的移动，初始状态与每次字符转移之后各算一次，两处缺一漏路径。<\/p>\n<p>再追一层：接受态判定按子集等于 <span class=\"katex-inline\">F<\/span> 而非与 <span class=\"katex-inline\">F<\/span> 相交，多元素子集里的接受态不会被标记；判定条件用相交，只要子集含任一接受态即为接受态。起点漏状态、终点漏标记，两类错误都让 DFA 语言窄于 NFA。<\/p>\n<h2>延伸推演：子集构造的正确性与状态膨胀边界<\/h2>\n<p>子集构造保持语言等价：NFA 存在一条接受路径，当且仅当对应 DFA 状态子集含接受态。正向看，NFA 每条路径上的字符转移与 ε 移动，都被闭包与子集转移逐步收录；反向看，DFA 每次转移对应的子集扩展，都能在 NFA 找到同字符路径。两条方向合起来保证接受串集合不变。<\/p>\n<p>状态数上界 <span class=\"katex-inline\">2^{|Q|}<\/span> 来自每个状态子集都可能成为 DFA 状态。实际词法规则下，多数子集不可达或行为等价；最小化后通常远小于上界。工程上词法 DFA 规模可控，是因为单词集合有限、字母表小，而不是因为理论上界低。<\/p>\n<p>构造完成后先做可达性遍历：从初始子集沿转移表走一遍，到不了的子集删除。不可达状态不参与识别，留着只会在最小化分组时占独立分组，增大表体积。<\/p>\n<h2>第四算例：含 ε 回边的 NFA 子集扩展<\/h2>\n<p>NFA：<span class=\"katex-inline\">q_0 \\xrightarrow{a} q_1<\/span>，<span class=\"katex-inline\">q_1 \\xrightarrow{b} q_2<\/span>，<span class=\"katex-inline\">q_2 \\xrightarrow{\\varepsilon} q_1<\/span>，<span class=\"katex-inline\">q_2<\/span> 接受。<\/p>\n<p>第一步，<span class=\"katex-inline\">S_0 = \\text{closure}(\\{q_0\\}) = \\{q_0\\}<\/span>。 第二步，<span class=\"katex-inline\">S_0<\/span> 读 <code>a<\/code>：<span class=\"katex-inline\">M = \\{q_1\\}<\/span>，<span class=\"katex-inline\">T = \\text{closure}(\\{q_1\\}) = \\{q_1\\}<\/span>，记 <span class=\"katex-inline\">S_1<\/span>。 第三步，<span class=\"katex-inline\">S_1<\/span> 读 <code>b<\/code>：<span class=\"katex-inline\">M = \\{q_2\\}<\/span>，<span class=\"katex-inline\">T = \\text{closure}(\\{q_2\\}) = \\{q_2, q_1\\}<\/span>（<span class=\"katex-inline\">q_2<\/span> ε 回 <span class=\"katex-inline\">q_1<\/span>），记 <span class=\"katex-inline\">S_2<\/span>。 第四步，<span class=\"katex-inline\">S_2<\/span> 读 <code>b<\/code>：<span class=\"katex-inline\">M = \\{q_2\\}<\/span>，闭包同为 <span class=\"katex-inline\">\\{q_2, q_1\\} = S_2<\/span>，自环。<span class=\"katex-inline\">S_2<\/span> 含接受态 <span class=\"katex-inline\">q_2<\/span>，标接受。<\/p>\n<p>读法：串 <code>abb<\/code>、<code>abbb<\/code> 都在 <span class=\"katex-inline\">S_2<\/span> 自环接受；单个 <code>a<\/code> 到 <span class=\"katex-inline\">S_1<\/span> 不接受。ε 回边在闭包阶段被折叠进子集，DFA 转移里不再出现 ε 移动。<\/p>\n<h2>第五算例：字符类与可选后缀的 RE 构造<\/h2>\n<p>RE <code>ab?c<\/code>：<code>b?<\/code> 表示 <code>b<\/code> 出现零次或一次。等价展开为 <code>b|ε<\/code>：造 <code>b<\/code> 的 NFA 与只含 ε 的空串 NFA，并起来后再与 <code>a<\/code>、<code>c<\/code> 连接。子集构造时，含 <code>b<\/code> 分支与不含 <code>b<\/code> 分支的路径在同一子集汇合，DFA 在该位置对 <code>b<\/code> 既可进入消费分支也可直接走向 <code>c<\/code>。<\/p>\n<p>核对语言：<code>abc<\/code> 与 <code>ac<\/code> 都接受，<code>abbc<\/code> 拒绝。可选后缀在 NFA 层体现为一条绕开 <code>b<\/code> 的 ε 边；DFA 最小化后，绕开边对应的分叉子集若行为等价会被合并。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n<span class=\"katex-inline\">\\varepsilon<\/span>-闭包在什么时机各计算一次？\n<\/li><li>\n子集构造中，一个 DFA 状态对应 NFA 的什么对象？\n<\/li><li>\n最小化初始分组按什么标准分成两组？\n<\/li><li>\n同组状态行为签名相同指的是什么相同？\n<\/li><li>\n为什么合并等价状态不会改变 DFA 接受的语言？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "子集构造到 DFA 与 DFA 最小化（Hopcroft 算法）"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.98<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">子集构造到 DFA 与 DFA 最小化（Hopcroft 算法）<\/a><\/span><\/div><h1>LL(1) 分析：FIRST/FOLLOW 集合与冲突成因<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 1 章（原书第 3 章 3.3.3 节，PDF 第 98 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>自顶向下语法分析从文法开始符出发，逐步推导出输入单词串。推导过程中，一个非终结符往往对应多条候选产生式；分析器读到当前前瞻单词后，必须选定其中一条。若选错，生成部分语法树后还要回溯，回滚已输出的中间代码与单词指针。表驱动 LL(1) 分析器在编译期用两个预测集合把选择算成查表动作：FIRST 集合预测候选产生式能否以当前单词开头，FOLLOW 集合处理候选推导出空串的情形。同一格落进两条动作，就说明这个文法无法用单前瞻 LL(1) 无回溯分析。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>最左推导<\/strong>：每一步都展开句型中最左边的非终结符。LL(1) 的两个 L 分别表示从左到右扫描输入、采用最左推导，括号里的 1 表示向前看一个单词。<\/p>\n<p><strong>FIRST(A)<\/strong>：从符号 <span class=\"katex-inline\">A<\/span> 出发能推导出的串的首终结符集合；若 <span class=\"katex-inline\">A<\/span> 能推导出 <span class=\"katex-inline\">\\varepsilon<\/span>，<span class=\"katex-inline\">\\varepsilon<\/span> 也记入 FIRST(A)。<\/p>\n<p><strong>FOLLOW(A)<\/strong>：在文法所有句型中，紧跟在 <span class=\"katex-inline\">A<\/span> 后面出现的终结符集合；输入结束标记 <code>$<\/code> 也属于 FOLLOW。<\/p>\n<p><strong>分析表<\/strong>：行是非终结符，列是终结符与 <code>$<\/code>，格子里填该前瞻下选用的产生式；同格若出现两条不同产生式，即为 LL(1) 冲突（原书 3.3.3 节，PDF 第 98 页）。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<h3>FIRST 集合计算<\/h3>\n<ol><li>\n终结符 <span class=\"katex-inline\">t<\/span>：<span class=\"katex-inline\">\\text{FIRST}(t) = \\{t\\}<\/span>。\n<\/li><li>\n产生式 <span class=\"katex-inline\">A \\to B_1 \\dots B_k<\/span>：从左到右加入 <span class=\"katex-inline\">\\text{FIRST}(B_i)<\/span>；<span class=\"katex-inline\">B_i<\/span> 推不出 <span class=\"katex-inline\">\\varepsilon<\/span> 即停，全部推 <span class=\"katex-inline\">\\varepsilon<\/span> 时把 <span class=\"katex-inline\">\\varepsilon<\/span> 加入 FIRST(A)。\n<\/li><li>\n对非终结符迭代到集合不再增长。\n<\/ol>\n<h3>FOLLOW 集合计算<\/h3>\n<ol><li>\n开始符 FOLLOW 先放入 <code>$<\/code>。\n<\/li><li>\n<span class=\"katex-inline\">A \\to \\alpha B \\beta<\/span>：把去 <span class=\"katex-inline\">\\varepsilon<\/span> 的 <span class=\"katex-inline\">\\text{FIRST}(\\beta)<\/span> 加入 FOLLOW(B)；<span class=\"katex-inline\">\\beta<\/span> 推 <span class=\"katex-inline\">\\varepsilon<\/span> 时再加入 FOLLOW(A)。<span class=\"katex-inline\">A \\to \\alpha B<\/span>：加入 FOLLOW(A)。\n<\/li><li>\n迭代到集合稳定。\n<\/ol>\n<h3>填表与冲突判定<\/h3>\n<p>对每条产生式 <span class=\"katex-inline\">A \\to \\alpha<\/span>：若 <span class=\"katex-inline\">t \\in \\text{FIRST}(\\alpha)<\/span>，表格 <span class=\"katex-inline\">[A, t]<\/span> 填该产生式；若 <span class=\"katex-inline\">\\alpha \\Rightarrow^* \\varepsilon<\/span>，对每个 <span class=\"katex-inline\">t \\in \\text{FOLLOW}(A)<\/span>，表格 <span class=\"katex-inline\">[A, t]<\/span> 填该产生式。同一表格已有另一条产生式时，记录为冲突。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：文法已消除左递归、提取左公因子；每个非终结符的各候选产生式 FIRST 集合互不重叠；含 <span class=\"katex-inline\">\\varepsilon<\/span> 的候选与其余候选在 FOLLOW 上不撞列。\n<\/li><li>\n<strong>失败案例 1：直接左递归<\/strong>。<span class=\"katex-inline\">A \\to A\\beta \\mid \\gamma<\/span> 中两个候选的 FIRST 都含 <span class=\"katex-inline\">\\gamma<\/span> 的首符，自顶向下推导时选第一条会立刻又回到 <span class=\"katex-inline\">A<\/span>，陷入循环。左递归必须先改写成右递归形式。\n<\/li><li>\n<strong>失败案例 2：左公因子<\/strong>。<span class=\"katex-inline\">A \\to t\\alpha \\mid t\\beta<\/span>，两个候选都以 <span class=\"katex-inline\">t<\/span> 开头，FIRST 重叠；提取公因子后 <span class=\"katex-inline\">A \\to tA&#x27;<\/span>，<span class=\"katex-inline\">A&#x27; \\to \\alpha \\mid \\beta<\/span>，才能分开预测。\n<\/li><li>\n<strong>边界：LL(1) 覆盖范围有限<\/strong>。需要两个以上前瞻才能分开的文法，单前瞻表必然冲突；这类文法要么改写成 LL(1)，要么改用自底向上的 LR 分析（见 c04）。\n<\/li><li>\n<strong>失败案例：漏算 FOLLOW 传递<\/strong>。候选可推 <span class=\"katex-inline\">\\varepsilon<\/span> 时，若不把 FOLLOW(A) 列入该候选的预测列，遇到 <span class=\"katex-inline\">A<\/span> 后面紧跟的单词会判为语法错误。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>LL 与 LR<\/strong>：LL 自顶向下推导，凭前瞻预测产生式，文法覆盖面较小、分析器结构直观；LR 自底向上归约，在移进过程中累积信息，覆盖面更大，分析表构造更复杂。同一句法结构，LL 冲突的文法往往能被 LR 接受。\n<\/li><li>\n<strong>FIRST 与 FOLLOW<\/strong>：FIRST 看候选往后能推出什么开头，用于非空候选的预测；FOLLOW 看非终结符后面能跟什么，用于 <span class=\"katex-inline\">\\varepsilon<\/span> 候选与归约时机。一个向前看串首，一个向后看后随。\n<\/li><li>\n<strong>递归下降与表驱动 LL(1)<\/strong>：递归下降为每个非终结符写一个过程，过程内按 FIRST 集合分支（原书图 3-10，PDF 第 98 页）；表驱动把分支选择抽成一张分析表，分析器主循环查表执行。二者预测依据相同，只是选择动作落在代码分支还是表格。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 的 DFA 提供单词流；本节预测的单位是单词而非字符。后继：c04 的 LR 分析处理 LL 无法覆盖的文法；c13 的属性求值挂在本节推导出的语法树与产生式序列上。FIRST/FOLLOW 是编译期静态计算，分析表生成后运行期只查表。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（LL(1) 分析：FIRST/FOLLOW 集合与冲突成因）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：FIRST/FOLLOW 逐步演算、分析表填表与冲突定位<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>自顶向下分析要无回溯地选产生式，往回追三层前提：<\/p>\n<ol><li>\n推导是从开始符到输入串的展开过程。每展开一个非终结符，若候选多条，分析器必须在不看后续完整串的情况下选定一条；选错就要回退已展开的子树。\n<\/li><li>\n选择依据只能来自两类信息：候选往后能推出什么开头（往前看串首），以及当前非终结符在句型里后面会跟什么（往后看后随）。这两类信息分别沉淀为 FIRST 与 FOLLOW 集合。\n<\/li><li
