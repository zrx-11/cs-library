\/ul>\n<p>第三步，选溢出对象：溢出 <span class=\"katex-inline\">B<\/span>。<span class=\"katex-inline\">B<\/span> 拆分后，<span class=\"katex-inline\">A<\/span> 与 <span class=\"katex-inline\">C<\/span> 在剩余图中不再两两构成三角形，<span class=\"katex-inline\">k=2<\/span> 可着色：<span class=\"katex-inline\">A<\/span> 用寄存器 <span class=\"katex-inline\">R_1<\/span>，<span class=\"katex-inline\">C<\/span> 用寄存器 <span class=\"katex-inline\">R_2<\/span>。<\/p>\n<p>第四步，补 load/store：<span class=\"katex-inline\">B<\/span> 定值后插 store 到内存槽，<span class=\"katex-inline\">B<\/span> 每次使用前插 load。<span class=\"katex-inline\">B<\/span> 原本占的寄存器释放给 <span class=\"katex-inline\">A<\/span>、<span class=\"katex-inline\">C<\/span>。<\/p>\n<p>读法：若误选 <span class=\"katex-inline\">A<\/span> 溢出，循环内每次读写 <span class=\"katex-inline\">A<\/span> 都落到内存，热路径性能损失最大；代价加权的作用就是避开这类选择。<\/p>\n<h2>第二算例：链状冲突图可正常着色<\/h2>\n<p>范围 <span class=\"katex-inline\">A<\/span>、<span class=\"katex-inline\">B<\/span>、<span class=\"katex-inline\">C<\/span>，冲突边只有 <span class=\"katex-inline\">AB<\/span>、<span class=\"katex-inline\">BC<\/span>，<span class=\"katex-inline\">A<\/span> 与 <span class=\"katex-inline\">C<\/span> 不重叠。<span class=\"katex-inline\">k=2<\/span> 足够：<span class=\"katex-inline\">A<\/span> 颜色 1，<span class=\"katex-inline\">B<\/span> 颜色 2，<span class=\"katex-inline\">C<\/span> 颜色 1。<span class=\"katex-inline\">A<\/span> 与 <span class=\"katex-inline\">C<\/span> 生命周期不相交，共用同一寄存器不发生覆盖。<\/p>\n<h2>延伸推演：两类着色顺序与副本合并<\/h2>\n<p>本书区分自顶向下与自底向上着色（原书 13.4.4、13.4.5 节，PDF 第 530 页起）。自顶向下按全局活动范围优先级安排颜色，优先级高、跨度长的范围先选寄存器；自底向上从局部冲突范围向上合并。两种顺序都在简化失败的结点上判溢出，差别在颜色分配的优先级依据。<\/p>\n<p>副本指令连接的两个范围若不冲突，可合并为一个范围：合并后少一个结点、少若干条冲突边，颜色需求下降。复制合并要先确认两范围生命周期不重叠，否则合并会制造错误覆盖。<\/p>\n<p>图着色的一般形式是 NP 难，编译器算法给出的是可行近似；工程上再通过分寄存器类别、压缩 IR 寿命、拆分长范围等手段压低图的复杂度。<\/p>\n<h2>对抗性追问：寄存器不够却不溢出会怎样<\/h2>\n<p>若三个范围冲突、<span class=\"katex-inline\">k=2<\/span>，分配器把三个范围塞进两个寄存器，后写入的范围覆盖先写入者；被覆盖的定值在后续引用时读到错误值。故障表现通常是计算结果错，出错指令与覆盖指令相隔很远，很难从崩溃位置反推。<\/p>\n<p>再追一层：冲突边漏判，两个实际重叠范围被分到同一寄存器，后果同上；冲突边多判，不重叠范围被强制分开，颜色需求虚高，本可避免的溢出被触发。边的判断依据是活跃区间的精确端点。<\/p>\n<h2>延伸推演：简化过程的度数动态更新<\/h2>\n<p>简化阶段每移除一个度数小于 <span class=\"katex-inline\">k<\/span> 的结点，它的邻居度数各降 1；降后小于 <span class=\"katex-inline\">k<\/span> 的邻居继续可移除。栈记录移除次序，着色时逆序弹出。若简化结束仍留结点（度数都不小于 <span class=\"katex-inline\">k<\/span>），这些是溢出候选：图的色数超过可用寄存器数，不可能全部着色。<\/p>\n<p>着色阶段给结点选寄存器时，先扫邻居已占颜色，挑第一个未占用的物理寄存器；<span class=\"katex-inline\">k<\/span> 个颜色全被邻居占满，标记溢出。溢出范围拆分后重新建图：原范围切成定值后 store、使用前 load 的短子范围，子范围冲突更少，可能重新可着色。<\/p>\n<p>寄存器类别按用途分开：整数、浮点、地址指针往往属不同类别；冲突边只在同类范围之间判断，颜色也在同类寄存器内分配。跨类别范围不能共用颜色，混类建模会低估真实冲突。<\/p>\n<h2>第三算例：副本指令的合并<\/h2>\n<p>范围 <span class=\"katex-inline\">A<\/span> 与 <span class=\"katex-inline\">B<\/span> 由副本指令 <code>mov A, B<\/code> 连接，二者生命周期不重叠。合并后成为一个范围，少一个结点、少若干冲突边，颜色需求下降。合并前置条件：<span class=\"katex-inline\">A<\/span>、<span class=\"katex-inline\">B<\/span> 除这条副本外没有其他冲突；若二者在某点同时活跃，合并会制造错误覆盖。本书 13.4.6 节讨论合并副本以减小度数（原书 PDF 第 533 页起）。<\/p>\n<h2>对抗性追问：近似着色与最优解的差距<\/h2>\n<p>图着色一般形式 NP 难，编译器简化-着色给的是可行解：可能多分配寄存器，也可能溢出本可避免的范围。工程上通过压缩 IR 寿命、缩短长范围、调整指令顺序压低图密度；评估分配质量看溢出 load/store 数量与热路径占用，而不是追求理论最优着色。<\/p>\n<p>再追一层：活动范围端点判错，冲突边随之错。端点偏长，范围虚胖、冲突图变密，触发多余溢出；端点偏短，实际重叠未连边，着色后寄存器覆盖错误。范围端点来自活跃变量分析的定值点与最后引用点，c07 的集合精度直接传到冲突图。<\/p>\n<h2>延伸推演：简化阶段的度数更新与寄存器类别<\/h2>\n<p>简化阶段每移除一个度数小于 <span class=\"katex-inline\">k<\/span> 的结点，邻居度数各降 1；降后小于 <span class=\"katex-inline\">k<\/span> 的邻居继续可移除。栈记录移除次序，着色逆序弹出。简化结束仍留结点（度数都不小于 <span class=\"katex-inline\">k<\/span>），这些是溢出候选：图色数超过可用寄存器数，不可能全部着色。<\/p>\n<p>着色选寄存器时先扫邻居已占颜色，挑第一个未占用物理寄存器；<span class=\"katex-inline\">k<\/span> 个颜色全被邻居占满，标记溢出。溢出范围拆分后重新建图：定值后 store、使用前 load 的短子范围冲突更少，可能重新可着色。<\/p>\n<p>寄存器类别按用途分开：整数、浮点、地址指针往往属不同类别；冲突边只在同类范围之间判断，颜色也在同类寄存器内分配，混类建模会低估真实冲突。副本指令连接且生命周期不重叠的两个范围可合并，合并后少一个结点、少若干冲突边；合并前必须确认二者除副本外无其他冲突。<\/p>\n<p>图着色一般形式 NP 难，编译器简化-着色给的是可行解：可能多分配寄存器，也可能溢出本可避免的范围。工程上通过压缩 IR 寿命、缩短长范围、调整指令顺序压低图密度；分配质量看溢出 load/store 数量与热路径占用，不追求理论最优着色。<\/p>\n<h2>第三算例：冲突图着色与溢出决策<\/h2>\n<p>四个活动范围 <span class=\"katex-inline\">r_1<\/span>–<span class=\"katex-inline\">r_4<\/span>，可用寄存器 3 个。冲突边：<span class=\"katex-inline\">r_1<\/span> 与 <span class=\"katex-inline\">r_2<\/span>、<span class=\"katex-inline\">r_1<\/span> 与 <span class=\"katex-inline\">r_3<\/span>、<span class=\"katex-inline\">r_2<\/span> 与 <span class=\"katex-inline\">r_3<\/span>、<span class=\"katex-inline\">r_3<\/span> 与 <span class=\"katex-inline\">r_4<\/span>。<span class=\"katex-inline\">r_1<\/span>、<span class=\"katex-inline\">r_2<\/span>、<span class=\"katex-inline\">r_3<\/span> 两两冲突构成三角形，三个范围必须占三个不同寄存器；<span class=\"katex-inline\">r_4<\/span> 与 <span class=\"katex-inline\">r_3<\/span> 冲突，可与 <span class=\"katex-inline\">r_1<\/span> 或 <span class=\"katex-inline\">r_2<\/span> 共用。<\/p>\n<p>简化阶段：<span class=\"katex-inline\">r_4<\/span> 度数 1，先移除；剩余三角形各度数 2，小于 3，依次移除。着色逆序：三角形三个范围分占寄存器 0、1、2；<span class=\"katex-inline\">r_4<\/span> 避开 <span class=\"katex-inline\">r_3<\/span> 的颜色，取 0 或 1，着色成功。<\/p>\n<p>若再加范围 <span class=\"katex-inline\">r_5<\/span> 与 <span class=\"katex-inline\">r_1<\/span>、<span class=\"katex-inline\">r_2<\/span>、<span class=\"katex-inline\">r_3<\/span> 都冲突，图中五个范围在 3 寄存器下不可着色；简化后仍留度数不小于 3 的结点，标记溢出。选溢出范围按代价：定值与引用少、不在热路径上的范围先拆，拆出的短子范围重新建图着色。<\/p>\n<h2>延伸推演：分配顺序与副本合并时机<\/h2>\n<p>图着色在指令选择、调度之后进行：范围由定值-引用关系确定，调度顺序影响范围交叠。分配前先合并副本连接的非冲突范围，减少结点数；合并后若两范围仍冲突，回退为两个结点。溢出拆分产生的 load/store 要重新过调度与依赖检查，插入位置不破坏定值顺序。<\/p>\n<p>寄存器类别在冲突图上分开建模：整数范围与浮点范围之间不连冲突边，颜色池各自独立；跨类别移动（整数转浮点）产生一条副本指令，两侧范围按各自类别分配。混类建图会把可共用寄存器的范围误判为冲突，图密度虚高。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n活动范围从哪个点到哪个点？\n<\/li><li>\n冲突图什么时候在两个范围之间加边？\n<\/li><li>\n度数达到多少的结点在简化时不能直接移除？\n<\/li><li>\n溢出代价为什么要按执行频率加权，而不是静态指令条数？\n<\/li><li>\n复制合并适用于什么样的两个范围，合并前要先确认什么？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "图着色寄存器分配与溢出代价"}, "c11": {"html": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.466<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">三地址码、基本块与控制流图（CFG）构造<\/a><\/span><\/div><h1>指令选择：树模式匹配与动态规划覆盖<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（原书第 11 章 11.4.1 节，PDF 第 466 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>后端要把 IR 表达式与三地址片段映射成目标处理器指令。最朴素的做法是自底向上遍历语法树，每个结点选第一条匹配的指令；这样每个结点独立决策，漏掉“一条复杂指令替代多条简单指令”的更优覆盖，指令数与代码体积都偏高。指令选择要在整棵树的层面找一组规则，无重复、无遗漏地盖住全部子树，总成本最低。树模式匹配把 ISA 指令抽象成重写规则，动态规划在子树上标注最小覆盖成本，父结点组合子结点最优方案。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>重写规则<\/strong>：由三部分组成——产生式（树中匹配的结点与子树形态）、成本（该规则覆盖的代价）、代码模板（生成的目标指令片段）。本书图 11-4 用 ILOC 操作平铺成抽象语法树，列出规则的产生式、成本与代码模板（原书 11.4.1 节，PDF 第 466 页）。<\/p>\n<p><strong>树覆盖<\/strong>：一组规则的匹配结果恰好盖住整棵 IR 树，每个子树结点落在某条规则下，不重叠、不遗漏。<\/p>\n<p><strong>动态规划标注<\/strong>：对每个树结点，记录以该结点为根被某条规则覆盖时的最小成本；父结点把子结点的最优成本按规则组合，取最小值。<\/p>\n<p><strong>窥孔优化<\/strong>：另一类指令选择路线，在已生成的指令序列小窗口内替换低效片段，规则针对指令流而非树结构（原书 11.5 节，PDF 第 473 页起）。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<p>第一步，把 IR 表达式平铺成抽象语法树：叶子是名字、常数，内部结点是运算符。<\/p>\n<p>第二步，自底向上遍历：叶子先匹配载入规则（常数用 <code>loadI<\/code>，内存名字先 load 到寄存器）。<\/p>\n<p>第三步，内部结点对每条可匹配规则计算成本：规则成本 + 各子结点所选覆盖方案成本；在该结点记录最小成本与对应规则。<\/p>\n<p>第四步，父结点组合时比较备选规则：拆成多条简单指令，或用一条带内存/复合操作数的指令；取总成本最小的覆盖。<\/p>\n<p>第五步，从根结点回溯所选规则，向下按记录的最优子方案取叶子规则，拼出最终指令序列。<\/p>\n<p>以表达式 <code>a + b <em> c<\/code> 为例：树根是 <code>+<\/code>，左叶 <code>a<\/code>，右子树 <code><\/em><\/code>（叶 <code>b<\/code>、<code>c<\/code>）。先标叶子：<code>b<\/code>、<code>c<\/code> 各一条 load，<code>a<\/code> 一条 load。<code><em><\/code> 结点两条候选：两条 load 后一条乘法（成本记为 <span class=\"katex-inline\">2+c_{\\text{mul}}<\/span>），或用带寄存器间接寻址的复合规则；取较小者。<code>+<\/code> 结点再比较“加法配已算好的 <code><\/em><\/code> 子树”与“拆成多次简单运算”的总成本，根结点记录的最小值决定覆盖。回溯时根选加法规则，子结点按各自记录的最优方案取叶子载入规则。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：IR 结构可表示为树（表达式、三地址片段）；目标 ISA 规则已整理成产生式、成本、模板三元组。\n<\/li><li>\n<strong>边界 1：树覆盖表达不了全部 ISA 语义<\/strong>。跨指令的副作用、流水约束、复杂寻址的组合模式，树模型难以直接覆盖；这类结构配合窥孔优化或专门代码生成处理。\n<\/li><li>\n<strong>边界 2：成本模型影响选择<\/strong>。规则成本按指令数、周期数或代码体积设定；成本估不准，最优覆盖只是模型下的最优。\n<\/li><li>\n<strong>失败案例：贪心逐条选规则<\/strong>。每个结点取第一条匹配规则，不比较子树组合成本，错过复合指令；树的上层结点可能被拆成多余 load 与运算。\n<\/li><li>\n<strong>失败案例：覆盖留洞<\/strong>。某子树没被任何规则盖住，生成代码缺一段计算；回溯时必须核对每个叶子与内部结点都有规则归属。\n<\/li><li>\n<strong>边界 3：规则库完备性<\/strong>。目标 ISA 常用指令都应有对应规则；缺规则的结构只能退回到简单指令序列，或由编译器兜底生成。\n<\/li><li>\n<strong>边界 4：规则重叠时的归属<\/strong>。同一子树被多条规则匹配，动态规划按成本选一条；若两条规则生成的代码副作用时机不同，选择前要确认二者语义等价，不能只比成本。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>树覆盖与窥孔优化<\/strong>：树覆盖在 IR 树结构上做全局规则组合；窥孔在生成后的指令流小窗口内做局部替换。前者偏结构映射，后者偏事后修整，工程上两条路线常配合使用。\n<\/li><li>\n<strong>动态规划与贪心<\/strong>：贪心单步选当前便宜规则；动态规划保留每个子结点的最小成本，父结点组合时才能比较整体方案。二者差别在决策是局部还是跨子树。\n<\/li><li>\n<strong>指令选择与指令调度<\/strong>：选择解决“用哪条指令”，调度解决“指令排成什么顺序”。选择产出的指令序列是调度的输入；调度不改变指令语义，只重排顺序。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c05 三地址码与基本块提供选择对象；c04 归约出的表达式结构是树的来源。后继：c12 表调度在选择后的指令序列上排顺序；c10 分配依据选择结果形成的活动范围安排寄存器。第 4 章代码形式决策决定 IR 中值放在寄存器还是内存，直接影响可选规则集合。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（指令选择：树模式匹配与动态规划覆盖）<\/summary><div class=\"depth-body\"><h1>c11 深度推导：规则覆盖模型、动态规划成本标注与指令序列回溯<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把 IR 落到目标指令，往回追三层前提：<\/p>\n<ol><li>\n同一个表达式在不同 ISA 上有不同指令编码方式；编译器不能为每款机器手写翻译规则，需要一套可扩充的规则表示，把目标指令描述成可匹配的模式。\n<\/li><li>\n指令选择不是单条指令的孤立决定：一条复合指令可能替代多条简单指令，子树怎么覆盖影响父结点可选规则。因此要在整棵树层面比较覆盖方案总成本。\n<\/li><li>\n树结构把表达式层级化：叶子是名字与常数，内部结点是运算。自底向上标注每个子树的最小成本，父结点才能在“拆简单指令”与“用复合规则”之间选整体更便宜的方案。\n<\/ol>\n<p>依赖链方向：ISA 规则表示 → 树模式匹配 → 子树成本标注 → 父结点组合取最小 → 回溯规则拼序列。<\/p>\n<h2>正向演算（逐步走查）：规则结构与 DP 标注<\/h2>\n<h3>规则三元组<\/h3>\n<p>本书图 11-4 的每条规则含：<\/p>\n<ul><li>\n<strong>产生式<\/strong>：<code>左部 → 右部子树形态<\/code>，如 <code>Reg → Reg + Reg<\/code>；\n<\/li><li>\n<strong>成本<\/strong>：该规则覆盖的代价；\n<\/li><li>\n<strong>代码模板<\/strong>：对应生成的 ILOC/目标指令，如 <code>add r1, r2 → r3<\/code>（原书 11.4.1 节，PDF 第 466 页）。\n<\/ul>\n<h3>标注算法<\/h3>\n<pre><code>for 结点 v 自底向上:\n    for 每条匹配 v 子树的规则 R:\n        cost(R) = R.cost + Σ 子结点最优成本\n    v.best = 成本最小的规则与成本<\/code><\/pre>\n<h3>回溯<\/h3>\n<pre><code>从根结点 v 开始:\n    取 v.best.规则 R\n    输出 R 的代码模板\n    对 R 的每个子结点递归回溯<\/code><\/pre>\n<p>覆盖校验：每个叶子与内部结点都归属某条规则，规则之间不重叠。<\/p>\n<h2>具体算例：表达式树的两种覆盖<\/h2>\n<p>表达式 <code>(a + b) × 2<\/code>，树结构：根为乘法结点，左孩子是加法结点，加法叶子为 <code>a<\/code>、<code>b<\/code>，右叶子为常数 <code>2<\/code>。<\/p>\n<p>可用规则：<\/p>\n<ul><li>\n<code>Reg → Num<\/code>：<code>loadI<\/code>，成本 1；\n<\/li><li>\n<code>Reg → Mem<\/code>：load 内存名字到寄存器，成本 1；\n<\/li><li>\n<code>Reg → Reg + Reg<\/code>：<code>add<\/code>，成本 1；\n<\/li><li>\n<code>Reg → Reg × Reg<\/code>：<code>mult<\/code>，成本 1。\n<\/ul>\n<p>第一步，叶子标注：<code>a<\/code>、<code>b<\/code> 经 load 规则成本各 1；常数 <code>2<\/code> 经 <code>loadI<\/code> 成本 1。<\/p>\n<p>第二步，加法结点：规则 <code>Reg → Reg + Reg<\/code> 成本 = 1 + 1 + 1 = 3（加法本身 + 两个叶子载入）。<\/p>\n<p>第三步，乘法结点备选：<\/p>\n<ul><li>\n全拆简单指令：<code>mult<\/code> 规则成本 = 1 + 3（加法子树）+ 1（常数载入）= 5；\n<\/li><li>\n若 ISA 提供“乘立即数”规则，右操作数直接取常数，省去 <code>loadI<\/code>，成本 = 1 + 3 = 4。\n<\/ul>\n<p>第四步，取较小者：选乘立即数规则覆盖根。回溯：根输出乘立即数模板，加法子树按 <code>add<\/code> 规则回溯，<code>a<\/code>、<code>b<\/code> 走 load。<\/p>\n<h2>第二算例：内存操作数规则省一条 load<\/h2>\n<p>表达式 <code>a + b<\/code>。若目标 ISA 的加法允许一个操作数在内存：规则 <code>Reg → Reg + Mem<\/code>，成本 2。<\/p>\n<ul><li>\n全寄存器方案：load <code>b<\/code>（1）+ <code>add<\/code>（1）+ load <code>a<\/code>（1）= 3；\n<\/li><li>\n内存操作数方案：load <code>a<\/code>（1）+ 带内存操作数的 <code>add<\/code>（2）= 3，与前者持平；若内存操作数规则成本为 1，则总成本 2，更优。\n<\/ul>\n<p>动态规划在加法结点把两种备选都算出来比较，而不是先入为主选 load 加 add。<\/p>\n<h2>延伸推演：窥孔优化与选择器生成<\/h2>\n<p>本书 11.5 节讨论通过窥孔优化做指令选择：在已生成指令的小窗口内找可替换模式，如用自增指令替代加 1、合并相邻移位（PDF 第 473 页起）。窥孔面向指令流，适合补树覆盖遗漏的局部低效片段。11.6 节高级主题讨论学习指令模式等更晚近的方法（PDF 第 480 页起）。<\/p>\n<p>工程上，规则库常由工具从机器描述自动生成选择器；工具把规则编译成匹配程序，编译器后端输入 IR 树即可得到指令序列。规则成本模型可按指令数、周期数或代码体积调整；不同模型下最优覆盖可能不同。<\/p>\n<h2>对抗性追问：贪心选第一条匹配规则会怎样<\/h2>\n<p>若每个结点取第一条匹配规则，不比较子树组合成本，上层复合指令机会被错过：本可用一条乘立即数完成的叶子载入与乘法，被拆成 <code>loadI<\/code>、<code>mult<\/code> 多条指令；代码体积与指令数同时偏高。贪心与 DP 的差别就在父结点是否回看子树的备选方案。<\/p>\n<p>再追一层：覆盖留洞时，某个子表达式没有规则归属，生成代码缺这段计算；回溯阶段若不核对每个结点都有规则归属，错误要到运行期才以结果错误暴露。覆盖无遗漏是树选择的硬约束。<\/p>\n<h2>第三算例：三层表达式的成本表逐层回填<\/h2>\n<p>表达式 <code>(a + b) + c<\/code>，树：根 <code>+<\/code>，左孩子 <code>+<\/code>（叶 <code>a<\/code>、<code>b<\/code>），右叶 <code>c<\/code>。规则集与成本：<code>Mem→Reg<\/code> load 成本 1；<code>Reg→Reg+Reg<\/code> add 成本 1；<code>Reg→Reg+Mem<\/code> 成本 2（右操作数留内存）。<\/p>\n<p>叶子层：<code>a<\/code> load 成本 1，<code>b<\/code> load 成本 1，<code>c<\/code> load 成本 1。<\/p>\n<p>下层加法结点（<code>a+b<\/code>）：<\/p>\n<ul><li>\n寄存器规则：1（add）+1+1 = 3；\n<\/li><li>\n内存规则：左操作数须在寄存器，右操作数 <code>b<\/code> 留内存：1（load <code>a<\/code>）+2 = 3。\n<p>取 3，记 add 规则。<\/p>\n<\/ul>\n<p>根结点（<code>(a+b)+c<\/code>）：<\/p>\n<ul><li>\n寄存器规则：1 + 3（左子树）+1（load <code>c<\/code>）= 5；\n<\/li><li>\n内存规则：左子树结果在寄存器，<code>c<\/code> 留内存：2 + 3 = 5。\n<p>两方案持平，回溯时按规则优先级取一条；若内存规则成本降为 1，根成本 4，选内存操作数方案。<\/p>\n<\/ul>\n<p>逐层回填的要点：父结点成本只引用子结点记录的最优成本，不重新展开子树备选；子结点若后来发现更优规则，父结点成本要随之更新，标注必须自底向上一次走完。<\/p>\n<h2>延伸推演：树模型与 DAG、规则匹配顺序的边界<\/h2>\n<p>表达式若有公共子表达式，IR 可能表示为 DAG 而非树：同一子树被多个父结点引用一次。树覆盖把每个引用位置独立选规则，重复生成计算；DAG 覆盖要处理共享结点的定值只算一次、多处使用，模型比树复杂。本书代码形式章节先把值放在寄存器或内存的决策定下来，再谈选择规则（原书第 7 章，PDF 第 260 页起）。<\/p>\n<p>规则匹配顺序影响歧义处理：多条规则匹配同一子树时，成本比较是最终依据；匹配器先按树形态筛出候选，再进入成本计算。若规则产生式重叠且成本相同，选择结果由规则排列顺序决定，这类歧义要在规则库评审时消除。<\/p>\n<p>成本不可简单相加的情形：规则生成的指令改变寄存器分配状态，后续指令的载入成本受影响；纯树内成本模型把跨规则状态忽略，得到的是局部最优。更精细的选择把分配、调度代价一并计入，属于后端联合优化。<\/p>\n<h2>对抗性追问：两条规则语义不等价时只比成本会怎样<\/h2>\n<p>若一条复合规则在寻址时触发内存副作用（如自动增量写回），另一条简单指令序列不写回内存，二者成本相同但可观察行为不同。只按成本选复合规则，程序在依赖内存位置的路径上结果改变。选择前必须核对规则模板与被替换序列的副作用集合一致；成本比较只在语义等价的候选之间进行。<\/p>\n<p>再追一层：常数折叠在选择前完成，表达式里的常数先算成新常数；若折叠被推迟到规则匹配阶段，叶子规则按未折叠的子树标注成本，复合规则机会被漏判。前端到中端的规范化步骤要先于指令选择。<\/p>\n<h2>第四算例：规则成本与指令数、周期数的分歧<\/h2>\n<p>同一子树两条规则：规则甲生成 2 条指令，各 1 周期；规则乙生成 1 条复合指令，延迟 3 周期。按指令数成本，乙更优；按周期数成本，甲两条并行可在 1 周期完成（假设功能单元充足），甲更优。成本模型选哪一种，决定根结点回溯到哪条规则。<\/p>\n<p>后端选模型的依据是优化目标：压缩代码体积用指令数或字节数；缩短执行时间用周期数与延迟。模型切换后，同一 IR 树的最优覆盖可能整体改变；规则库成本标注要与目标模型一致。<\/p>\n<h2>延伸推演：选择器生成与规则冲突排查<\/h2>\n<p>机器描述中的规则经工具编译成匹配程序：匹配程序按树形态筛候选规则，把成本计算交给 DP 标注。规则库评审时排查两类问题：产生式重叠但语义不等价；同一形态多条规则成本标注矛盾。前者靠副作用核对排除，后者靠成本表统一口径。<\/p>\n<p>树覆盖只处理表达式与三地址片段；过程序言、尾声、参数传递等代码形态由调用约定规则单独生成，不进入表达式树选择。两类规则产出的指令在最终序列中按过程结构拼接。<\/p>\n<h2>第五算例：嵌套常数的载入规则选择<\/h2>\n<p>表达式 <code>(a + 1) * b<\/code>，常数 <code>1<\/code> 出现在加法子树。叶子层：<code>a<\/code>、<code>b<\/code> 走 load 各成本 1，常数 <code>1<\/code> 走 <code>loadI<\/code> 成本 1。加法结点：寄存器规则 <code>add<\/code> 成本 1 +1（<code>a<\/code>）+1（<code>loadI 1<\/code>）= 3；若 ISA 加法支持立即数操作数，右操作数直接取常数，省去 <code>loadI<\/code>，成本 1 +1（<code>a<\/code>）= 2。<\/p>\n<p>乘法结点引用加法子树记录的最优成本：全拆方案 <code>mult<\/code> 成本 1 + 3（或 2）+1（load <code>b<\/code>）；若乘法也支持寄存器-立即数形式，右操作数是变量 <code>b<\/code> 不适用。回溯按加法结点已选的立即数加法规则展开，<code>a<\/code> 走 load，常数不生成 <code>loadI<\/code>。<\/p>\n<p>逐层标注保留的是各子树当前最优方案；若加法子树后来因寄存器压力回退到全寄存器方案，乘法父结点成本要按新子树成本重算。标注阶段记录备选成本列表，供后端联合决策回调。<\/p>\n<h2>延伸推演：规则库与代码生成的接口<\/h2>\n<p>指令选择输出的是带操作数占位的指令模板；寄存器分配把占位换成物理寄存器或溢出位置，调度再排发射顺序。选择阶段假定操作数可分配到寄存器，占位与最终物理位置分离，使三类后端任务可分阶段推进。<\/p>\n<p>规则描述中动作码与产生式绑定：匹配命中即生成对应模板片段。匹配程序自底向上读 IR 树，命中规则后在该子树停止向下展开；未命中才落到更细的叶子规则。覆盖完整性核对：根结点归属规则的子结点递归展开后，每个叶子都有规则，不存在规则未覆盖的悬空子树。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n重写规则三元组各记录什么？\n<\/li><li>\n动态规划在每个树结点保留什么信息？\n<\/li><li>\n父结点比较备选规则时，成本由哪两部分组成？\n<\/li><li>\n树覆盖与窥孔优化分别面向什么结构？\n<\/li><li>\n规则成本模型按指令数与按周期数设定，选出的覆盖一定相同吗？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "指令选择：树模式匹配与动态规划覆盖"}, "c12": {"html": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.485<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">指令选择：树模式匹配与动态规划覆盖<\/a><\/span><\/div><h1>指令调度：表调度与局部/区域顺序重排<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（原书第 12 章 12.1、12.3 节，PDF 第 485、493 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>一组操作的执行时间严重依赖执行顺序。处理器按流水线发射指令，操作数尚未就绪的指令进入流水线后要停顿等待；长延迟操作（除法、内存访问）后面的空闲周期若被浪费，整体运行时间被拉长。指令调度重排过程中的操作顺序以改进运行时间，但重排不能越过真实数据依赖与控制依赖。表调度是局部调度的主算法：维护就绪指令列表，按优先级排序后逐条发射，在依赖允许的范围内填满停顿周期。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>依赖关系<\/strong>：数据依赖指后指令引用前指令的结果；控制依赖指分支决定后续指令是否执行；资源冲突指多条指令争用同一功能单元。调度只能在不破坏这些关系的前提下重排。<\/p>\n<p><strong>就绪指令<\/strong>：操作数都已可用、且发射资源满足的指令进入就绪列表。<\/p>\n<p><strong>优先级<\/strong>：就绪列表中多条指令可选时的排序依据，常用关键路径长度、延迟权重等；平局需要打破规则。<\/p>\n<p><strong>局部调度<\/strong>：在单个基本块内重排指令；<strong>区域调度<\/strong>：跨越基本块边界，在循环或区域范围内调度（原书 12.3、12.4 节，PDF 第 493、500 页）。<\/p>\n<p><strong>前向/后向表调度<\/strong>：前向从块首往后排；后向从块尾往前排，两种方向选择停顿填补的位置不同。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<p>第一步，标出块内指令间的数据依赖与资源约束。<\/p>\n<p>第二步，初始化就绪列表：无前置依赖的指令进入列表。<\/p>\n<p>第三步，从就绪列表按优先级选出一条指令发射；优先级相同按预定规则打破平局。<\/p>\n<p>第四步，发射后更新依赖状态：以该指令结果为操作数的其他指令，若前置已满足，加入就绪列表。<\/p>\n<p>第五步，重复第三、四步，直到所有指令发射完毕。前向调度从块首推进，后向调度从块尾回推。<\/p>\n<p>以四条指令的块为例：<code>L1: load x → r1<\/code>，<code>L2: load y → r2<\/code>，<code>A1: add r1,r2 → r3<\/code>，<code>M1: mul r3,r4 → r5<\/code>。<code>A1<\/code> 依赖 <code>L1<\/code>、<code>L2<\/code> 的结果，<code>M1<\/code> 依赖 <code>A1<\/code>。初始就绪列表只有 <code>L1<\/code>、<code>L2<\/code>；先发射 <code>L1<\/code>，再发射 <code>L2<\/code>，两条 load 之间无依赖可并行占用不同访存单元。<code>L2<\/code> 完成后 <code>A1<\/code> 进入就绪列表，发射 <code>A1<\/code>；<code>A1<\/code> 结果就绪后 <code>M1<\/code> 入列发射。若 <code>M1<\/code> 延迟长，可在其等待周期内安排块内其他无依赖指令填补；就绪列表为空才插入停顿。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：指令依赖关系在 IR/目标指令上可见；发射资源与各操作延迟已知。\n<\/li><li>\n<strong>边界 1：重排不能越过依赖<\/strong>。写后读、读后写、写后写冲突都属于不可违反的顺序；把写指令排到读指令之前，流水线取到旧操作数。\n<\/li><li>\n<strong>边界 2：跨块调度保守<\/strong>。基本块边界上的活跃范围与分支条件限制重排；区域调度跨越块时要核对块间依赖。\n<\/li><li>\n<strong>失败案例：只按发射方便排序<\/strong>。不查依赖就把后指令提前，读引用在写之前执行，结果错误。\n<\/li><li>\n<strong>失败案例：忽略资源冲突<\/strong>。多条指令争用同一功能单元，调度只看数据就绪，发射时资源不足仍会停顿；优先级应同时计入资源约束。\n<\/li><li>\n<strong>边界 3：调度不改语义<\/strong>。调度只改变指令顺序，不删除计算、不改定值；与指令选择的分工是选择定指令、调度定顺序。\n<\/li><li>\n<strong>边界 4：长延迟操作的填补受限于块内指令密度<\/strong>。块内无其他就绪指令时，停顿无法靠重排消除；这类停顿要靠循环级调度或代码生成阶段减少依赖链长度。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>调度与指令选择<\/strong>：选择回答“用哪条指令”，产出指令序列；调度回答“指令排成什么顺序”。选择结果是调度输入，调度不替换指令。\n<\/li><li>\n<strong>表调度与轨迹调度<\/strong>：表调度在就绪列表按优先级逐条选；轨迹调度沿最常执行的路径（轨迹）延伸调度，把低频路径留到后面处理。本书 12.5 节高级主题讨论软件流水等更全局的方法（PDF 第 505 页起）。\n<\/li><li>\n<strong>局部与区域调度<\/strong>：局部只在单块内重排，依赖关系简单；区域跨块，需要额外处理块间活跃性与控制依赖。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c11 指令选择产出待调度指令；c05 CFG 提供块边界。后继：c10 寄存器分配依据调度后的定值-引用顺序安排范围；调度插入的 load/store 顺序也要服从分配约束。第 4 章调用约定规定的保存/恢复顺序，是跨过程调度必须保留的边界。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（指令调度：表调度与局部/区域顺序重排）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：表调度主循环、就绪判定与停顿填补算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>指令顺序影响流水线效率，往回追三层前提：<\/p>\n<ol><li>\n处理器把指令执行拆成多级流水，一条指令在操作数未就绪时停顿，占用周期却不产生结果。编译器重排顺序，把不依赖长延迟结果的指令提前发射，填满空闲周期。\n<\/li><li>\n重排有不可越过的底线：数据依赖决定读必须在写之后，控制依赖决定分支后指令的执行前提，资源冲突决定同周期能发射几条。调度只能在这些关系允许的位置之间调整。\n<\/li><li>\n可用指令动态变化：一条指令发射后，以它结果为操作数的其他指令前置才可能满足。调度器要维护就绪列表，每发射一条就更新谁变为就绪。\n<\/ol>\n<p>依赖链方向：流水线停顿问题 → 依赖与资源约束 → 就绪列表 → 优先级选择 → 发射并更新就绪 → 排满无依赖空隙。<\/p>\n<h2>正向演算（逐步走查）：表调度步骤<\/h2>\n<h3>就绪条件<\/h3>\n<p>指令 <span class=\"katex-inline\">i<\/span> 就绪，当且仅当：<\/p>\n<ol><li>\n它的每个源操作数已由先前发射的指令产生；\n<\/li><li>\n所需功能单元与发射槽位当前可用；\n<\/li><li>\n不违反控制依赖顺序。\n<\/ol>\n<h3>主循环<\/h3>\n<pre><code>Ready ← 无前置依赖的指令\nwhile Ready 非空:\n    i ← 按优先级从 Ready 选出一条（平局按打破规则）\n    发射 i\n    for 每条等待 i 结果的指令 j:\n        if j 其余前置已满足:\n            Ready ← Ready ∪ {j}<\/code><\/pre>\n<h3>调度方向<\/h3>\n<ul><li>\n前向：从块首往块尾排，逐条确定发射位置；\n<\/li><li>\n后向：从块尾往块头回推，把延迟压力留给前面的指令安排。\n<\/ul>\n<h2>具体算例： load 后停顿的重排<\/h2>\n<p>原序列（load 延迟 2 周期）：<\/p>\n<pre><code>1  ld  r1, [r2]    /* 载 a */\n2  ld  r3, [r4]    /* 载 b */\n3  add r5, r1, r3  /* 依赖 1、2 */\n4  mul r6, r5, r7  /* 依赖 3 */\n5  st  [r8], r6    /* 依赖 4 */<\/code><\/pre>\n<h3>原顺序的停顿<\/h3>\n<p>第 1 条 load 发出后，第 2 条 load 可同槽位发射；第 3 条 add 要等两个 load 结果，第 1、2 条结果未就绪前，流水线在 add 前停顿。第 4 条 mul 等 add 结果，第 5 条 st 等 mul 结果。<\/p>\n<h3>依赖关系<\/h3>\n<ul><li>\n<code>add<\/code> 依赖 <code>ld r1<\/code>、<code>ld r3<\/code>；\n<\/li><li>\n<code>mul<\/code> 依赖 <code>add<\/code>；\n<\/li><li>\n<code>st<\/code> 依赖 <code>mul<\/code>；\n<\/li><li>\n两条 load 互不依赖。\n<\/ul>\n<h3>调度后顺序<\/h3>\n<pre><code>槽位 1: ld  r1, [r2]\n槽位 2: ld  r3, [r4]\n槽位 3: add r5, r1, r3\n槽位 4: mul r6, r5, r7\n槽位 5: st  [r8], r6<\/code><\/pre>\n<p>两条 load 占据独立发射槽；add 在两个结果就绪后发射；mul、st 沿依赖链顺序推进。若存在另一条与 load 不依赖的独立运算，可填入 load 结果未就绪的停顿槽位，而不必空等。<\/p>\n<h2>第二算例：平局打破与后向调度<\/h2>\n<p>就绪列表同时有两条指令：一条在关键路径上（后续长链等待它），一条不在。优先级按关键路径剩余长度排序，关键路径指令先发射，缩短整条链的完成时间。优先级相同的平局，本书 12.3.4 节讨论在表调度算法中打破平局的方案（PDF 第 496 页）。<\/p>\n<p>后向调度从块尾回推：先排最后必须执行的指令，再往前找能填补其延迟空隙的指令。前向与后向选出的指令顺序可能不同，最终都要满足依赖闭环；跨基本块时，后向调度要核对块尾活跃范围的边界。<\/p>\n<h2>延伸推演：区域调度与软件流水<\/h2>\n<p>局部调度只在单块内可见依赖；循环体等区域跨多个块，区域调度在更大范围重排，处理块间活跃值与分支条件。本书 12.5 节高级主题讨论软件流水：把循环不同迭代的操作重叠起来执行，让功能单元在迭代之间保持忙碌；配套技术包括硬件支持的软件流水策略与软件流水算法（原书 12.5.1、12.5.2 节，PDF 第 505、507 页）。<\/p>\n<p>调度与寄存器分配相互影响：调度把长延迟操作提前，会拉长某些值的存活时间；分配后补的 load/store，其顺序同样要过调度依赖检查。<\/p>\n<h2>对抗性追问：越过依赖提前指令会怎样<\/h2>\n<p>若把写某寄存器的指令排到读该寄存器的指令之前，流水线读到的是旧值；分支条件计算排在分支跳转之前是合法顺序，反过来则跳转依据未定。调度器只在依赖允许的位置之间移动指令，优先级排序不能覆盖数据依赖。<\/p>\n<p>再追一层：只看数据就绪、忽略功能单元冲突，两条乘指令争用同一乘法单元，发射时资源不足仍停顿；调度优先级必须把资源约束计入，而不是单看操作数就绪。<\/p>\n<h2>第三算例：独立运算填补 load 停顿槽位<\/h2>\n<p>块内新增一条与两条 load 都不依赖的指令 <code>sub r9, r10, r11<\/code>。依赖关系上，<code>sub<\/code> 的源操作数 <code>r10<\/code>、<code>r11<\/code> 在块前已就绪，不等待 <code>r1<\/code>、<code>r3<\/code>。<\/p>\n<p>调度过程：<\/p>\n<ul><li>\n槽位 1：就绪列表含 <code>ld r1<\/code>、<code>ld r3<\/code>、<code>sub<\/code>；按关键路径优先级，两条 load 先发射，<code>sub<\/code> 暂留。\n<\/li><li>\n槽位 2：第二条 load 发射；此时 <code>r1<\/code>、<code>r3<\/code> 结果尚未就绪，<code>add<\/code> 未入列。\n<\/li><li>\n槽位 3：<code>sub<\/code> 与等待 load 结果的 <code>add<\/code> 比较，<code>add<\/code> 操作数未就绪，<code>sub<\/code> 就绪，发射 <code>sub<\/code> 填补空隙。\n<\/li><li>\n槽位 4：两个 load 结果就绪，发射 <code>add<\/code>；随后 <code>mul<\/code>、<code>st<\/code> 沿链推进。\n<\/ul>\n<p>对比不填补的顺序：<code>add<\/code> 前空一个槽位等 load，<code>sub<\/code> 排到链尾；填补后空闲周期被独立运算占用，块总周期数下降。填补前提是 <code>sub<\/code> 与被推迟指令之间无数据、控制与内存顺序依赖。<\/p>\n<h2>延伸推演：关键路径优先级与延迟表<\/h2>\n<p>优先级排序的依据是指令所在依赖链的剩余长度：从该指令到块尾最长链上的延迟总和。链长指令先发射，避免它成为后续停顿的根源；不在关键路径上的指令可以后移，代价由自身短链承担。平局打破规则保证同一就绪集合每次选出确定指令，调度结果可复现。<\/p>\n<p>延迟表记录各类操作的发射间隔与结果就绪周期：load、乘法、除法延迟不同，调度器据此判断“再等几轮”指令才就绪。延迟表与目标处理器微架构绑定；换一款处理器，同一指令序列的最优顺序可能改变。<\/p>\n<p>内存访问顺序是一类容易被忽略的依赖：两个访存指令若可能访问同一地址，即使寄存器名不同，也不能交换顺序；别名分析确定二者地址不重叠后，调度器才允许重排。别名不确定时按保守顺序保留。<\/p>\n<h2>对抗性追问：跨块移动指令会漏掉什么<\/h2>\n<p>把块内一条 load 移到前驱块提前发射，收益是隐藏 load 延迟；风险是前驱块可能经分支不执行该路径，load 提前后在未走的路径上触发异常或改写状态。跨块调度必须确认目标路径执行条件覆盖指令使用条件，否则指令在不该执行的块上产生副作用。区域调度在块边界逐对核对依赖，而不是把单块规则直接套到跨块场景。<\/p>\n<p>再追一层：调度改变了指令先后，寄存器压力随之变化。两条值的存活区间因重排交叠变宽，分配阶段需要更多寄存器或溢出；调度与分配不是一次性单向关系，后端常按调度后图密度反馈调整。<\/p>\n<h2>第四算例：关键路径长度决定优先级<\/h2>\n<p>块内两条就绪链：链甲 <code>sub → mul → st<\/code>，剩余延迟 5；链乙 <code>and → or<\/code>，剩余延迟 2。就绪列表中各有一条可发射指令，按关键路径剩余长度，链甲指令先发射；它的结果是长链后续指令的前置，推迟它会把整条链后移。链乙指令短，后移一个槽位不增加块总周期。<\/p>\n<p>优先级表把每条指令到块尾的最长延迟和算出来；发射一条后，更新等待它的指令的剩余长度。平局时按指令编号或原来的程序次序打破，保证调度结果确定可复现。<\/p>\n<h2>延伸推演：调度可行性与后端迭代<\/h2>\n<p>调度后要核对两条边界：发射槽位与功能单元数量满足；重排后访存顺序在别名保守假设下合法。不满足则回退到依赖约束更紧的顺序。调度结果反馈给分配：范围交叠变宽时，分配压力上升；分配插入溢出 load/store 后，新指令再次进入调度列表排依赖位置。<\/p>\n<p>循环体是调度收益最大的区域：跨迭代重叠执行把长延迟操作藏到其他迭代的空隙里；软件流水在循环级重排，局部表调度不处理迭代间重叠。本书 12.5 节把这类全局方法列为高级主题（PDF 第 505 页起）。<\/p>\n<h2>第五算例：分支后指令的调度边界<\/h2>\n<p>块尾条件分支前有一条赋值 <code>c ← a + 1<\/code>，后续块引用 <code>c<\/code>。调度可把 <code>c<\/code> 的计算提前到块内靠前位置；若该计算与分支条件计算争用同一功能单元，提前后资源冲突，仍要按优先级保留顺序。分支本身的发射位置固定在块尾，分支目标块的第一条指令不能排到分支之前。<\/p>\n<p>后向调度从块尾回推：先固定分支与块尾引用，再向前找能填入延迟空隙的指令。后向安排把可晚发的指令留在后面，保证块尾关键指令的发射槽位；与前向调度相比，指令顺序不同但依赖闭环一致。<\/p>\n<h2>延伸推演：调度记录与依赖复核<\/h2>\n<p>调度输出保留原始依赖链与重排后顺序两条记录：分配与代码生成复核时，按原始依赖核对重排没有越过写后读、读后写、写后写。访存指令的别名状态由别名分析标注；标注为可能别名的访存对，顺序保持原状。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n指令进入就绪列表要满足哪三个条件？\n<\/li><li>\n表调度每发射一条指令后，对等待它结果的指令做什么更新？\n<\/li><li>\n前向调度与后向调度的推进方向各是什么？\n<\/li><li>\n调度为什么不能删除计算或改变定值？\n<\/li><li>\n局部调度与区域调度在处理块间依赖上有什么差别？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "指令调度：表调度与局部/区域顺序重排"}, "c13": {"html": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.152<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">LR 项目集、Action/Goto 表与移进-归约冲突<\/a><\/span><\/div><h1>属性文法：综合/继承属性与求值顺序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书第 4 章 4.3 节，PDF 第 152 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>语法正确的输入程序仍可能包含严重错误：类型不符、名字未声明、作用域用错、存储类别冲突。这些错误无法靠上下文无关文法识别，需要把每条语句放到实际上下文中检查。属性文法为这类检查提供挂接框架：在语法树的每个结点上挂属性，属性之间按依赖关系计算；综合属性从子结点传给父结点，继承属性从父结点或兄弟结点传来。属性的计算顺序由依赖图决定，图上出现回路则不存在合法求值次序。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>属性<\/strong>：附着在文法符号或语法树结点上的信息，如类型、名字、存储类别、求值结果。<\/p>\n<p><strong>综合属性<\/strong>：完全根据结点本身、其子结点和常量定义的属性。求值方向自底向上：子结点算出后，父结点取用（原书 4.3 节，PDF 第 152 页）。<\/p>\n<p><strong>继承属性<\/strong>：根据结点本身、其兄弟结点和父结点（外加常量）定义的属性。求值方向自顶向下或横向传递：父结点先算，再传给子结点。<\/p>\n<p><strong>依赖图<\/strong>：每个属性是一个结点；属性 A 的计算用到属性 B，画一条从 B 到 A 的边。求值必须沿边方向进行。<\/p>\n<p><strong>环<\/strong>：依赖图中出现回路，部分属性互相等待对方先算；不存在任何顺序能把全部属性求值出来，该输入无法按静态顺序求值（原书 4.3 节，PDF 第 152 页）。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<p>第一步，按语法分析结果建好语法树，标出每个结点对应的文法产生式。<\/p>\n<p>第二步，标综合属性：名字结点的类型查符号表得到；表达式结点类型由操作数类型与运算符推出；这类属性在树的自底向上遍历中计算。<\/p>\n<p>第三步，标继承属性：外层语句把期望类型传给表达式结点，表达式再传给子表达式；这类属性在自顶向下遍历中下发。<\/p>\n<p>第四步，建依赖图：属性间的数据依赖逐条画边，被依赖属性先算，依赖方后算。<\/p>\n<p>第五步，检查回路：图上有环则属性文法对该输入无法求值；无环则按拓扑顺序算出全部属性，类型检查、作用域核对在属性值上进行。<\/p>\n<p>以赋值语句 <code>x = a + b<\/code> 的语法树为例：<code>a<\/code>、<code>b<\/code> 叶子结点查符号表得到综合属性 <code>type<\/code>；<code>+<\/code> 结点的 <code>type<\/code> 由两个操作数类型与加法规则推出；<code>=<\/code> 结点把左部 <code>x<\/code> 的类型作为继承属性下发给右部表达式，核对右部类型是否与左部匹配。依赖方向上，叶子类型先算，向上到 <code>+<\/code>，再由 <code>=<\/code> 向下核对；若规则写成“<code>+<\/code> 的类型要等 <code>=<\/code> 下发的期望类型才能定”，方向就反了，依赖图可能成环。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：语法树与符号表可用；属性定义规则明确，依赖方向可静态判断。\n<\/li><li>\n<strong>边界 1：环使静态求值失效<\/strong>。规则定义的属性依赖自身，或依赖图成环，固定遍历顺序必然用到未定义值；需要换用循环求值或改写规则（原书 4.3 节，PDF 第 152 页）。\n<\/li><li>\n<strong>边界 2：非终结属性可跨规则传播<\/strong>。一个非终结符在不同产生式下的属性接口要一致，否则父结点下发的继承属性找不到接收方。\n<\/li><li>\n<strong>失败案例：综合与继承方向混用<\/strong>。把应由父结点下发的期望类型写成综合属性，子结点算不出父结点信息；求值方向反了，属性值为空。\n<\/li><li>\n<strong>失败案例：依赖边漏画<\/strong>。属性 A 用到 B 却没建边，拓扑顺序可能把 A 排在 B 前，A 取到未定义属性。\n<\/li><li>\n<strong>边界 3：属性计算与翻译动作一体<\/strong>。语法制导翻译把 IR 生成动作也挂在属性上；属性求值顺序同时决定中间代码生成顺序。\n<\/li><li>\n<strong>边界 4：作用域信息超出单棵子树<\/strong>。名字声明在祖先语句或外层块中，继承属性沿树向下传递作用域表；跨过程的名字解析不属于属性文法单树范围，要靠符号表与过程间分析。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>综合与继承属性<\/strong>：综合属性向上汇总（子→父），继承属性向下或横向传递（父/兄弟→子）。同一结点可同时有两类属性，方向不同不能混算。\n<\/li><li>\n<strong>属性文法与独立类型检查器<\/strong>：属性文法把检查规则挂到文法结构上，随语法树遍历求值；独立检查器在 IR 上单独跑一遍。前者与语法结构耦合紧，后者与前端解耦。\n<\/li><li>\n<strong>语法制导翻译与静态分析<\/strong>：前者在语法/翻译阶段把语义信息写入 IR；后者在中端 CFG 上推断定值流向。属性是前端到中端的信息桥梁。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c04 LR/LL 分析产出的语法树与产生式序列是属性挂接骨架；c03 的文法符号集合为属性接口提供边界。后继：c05 三地址码生成消费属性计算结果；c06 起的数据流分析在翻译好的 IR 上进行。第 4 章流程回环中，上下文相关分析是前端结构与中端 IR 之间的一层检查。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（属性文法：综合/继承属性与求值顺序）<\/summary><div class=\"depth-body\"><h1>c13 深度推导：属性分类、依赖图构造与求值顺序算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>上下文检查要挂到语法结构上，往回追三层前提：<\/p>\n<ol><li>\n文法只回答“句子结构是否合法”，不回答“类型是否匹配、名字是否可见”。后者依赖语句所处的上下文：作用域、已声明类型、存储类别。这些信息不能由单个单词或单个产生式单独给出。\n<\/li><li>\n上下文信息需要一个附着点：语法树结点。每个结点带上若干属性，属性值在遍历树时算出；检查规则读属性、写属性。\n<\/li><li>\n属性之间有先后：父结点的期望类型要先下发，子结点才能核对；子结点的实际类型算出来，父结点才能比较。这层先后关系显式画成依赖图，求值按图上的边方向进行；图上有环就排不出合法顺序。\n<\/ol>\n<p>依赖链方向：上下文检查需求 → 语法树结点 → 综合/继承属性 → 依赖图 → 拓扑求值 → 类型与作用域核对。<\/p>\n<h2>正向演算（逐步走查）：属性标注与依赖图构造<\/h2>\n<h3>属性分类规则<\/h3>\n<ul><li>\n<strong>综合属性<\/strong>：由结点本身、子结点、常量算出；自底向上汇总。\n<\/li><li>\n<strong>继承属性<\/strong>：由结点本身、兄弟结点、父结点、常量算出；自顶向下或横向传递。\n<\/ul>\n<h3>依赖图构造<\/h3>\n<ol><li>\n每个属性在图上建一个结点；\n<\/li><li>\n属性 A 计算读取属性 B 的值，加边 <span class=\"katex-inline\">B \\to A<\/span>；\n<\/li><li>\n被依赖的 B 排在 A 之前求值；\n<\/li><li>\n遍历图检查回路：有环则静态顺序失效，无环则按拓扑序求值。\n<\/ol>\n<h3>求值方向<\/h3>\n<ul><li>\n综合属性随自底向上遍历计算；\n<\/li><li>\n继承属性随自顶向下遍历下发；\n<\/li><li>\n同一结点两类属性并存时，先算可获得的一侧，再沿依赖边推进另一侧。\n<\/ul>\n<h2>具体算例：赋值语句树的属性计算<\/h2>\n<p>语句 <code>x = a + b<\/code>，语法树：根为赋值结点，左孩子名字 <code>x<\/code>，右孩子加法结点；加法叶子为 <code>a<\/code>、<code>b<\/code>。<\/p>\n<h3>综合属性<\/h3>\n<ul><li>\n叶子 <code>a<\/code>、<code>b<\/code>：类型由符号表查得，记为 <span class=\"katex-inline\">\\tau_a<\/span>、<span class=\"katex-inline\">\\tau_b<\/span>；名字结点的类型是综合属性。\n<\/li><li>\n加法结点：类型 <span class=\"katex-inline\">\\tau_{+}<\/span> 由 <span class=\"katex-inline\">\\tau_a<\/span>、<span class=\"katex-inline\">\\tau_b<\/span> 与 <code>+<\/code> 规则推出；若两类型可兼容，结果类型确定，否则记类型冲突。\n<\/li><li>\n赋值结点：核对左值 <code>x<\/code> 的类型 <span class=\"katex-inline\">\\tau_x<\/span> 与右值 <span class=\"katex-inline\">\\tau_{+}<\/span> 是否兼容；兼容则赋值合法，否则报错。\n<\/ul>\n<h3>继承属性<\/h3>\n<p>外层上下文把期望类型传给赋值结点；赋值结点再把期望类型传给加法结点与叶子。若上下文要求表达式结果为整数，加法结点核对操作数能否转到整数；这一路信息是父结点向下传递的继承属性。<\/p>\n<h3>依赖边<\/h3>\n<ul><li>\n<span class=\"katex-inline\">\\tau_a \\to \\tau_{+}<\/span>，<span class=\"katex-inline\">\\tau_b \\to \\tau_{+}<\/span>：加法类型依赖叶子类型；\n<\/li><li>\n<span class=\"katex-inline\">\\tau_{+} \\to<\/span> 赋值核对，<span class=\"katex-inline\">\\tau_x \\to<\/span> 赋值核对：赋值比较依赖两侧类型；\n<\/li><li>\n期望类型（继承）→ 加法结点 → 叶子：下发方向。\n<\/ul>\n<p>图上无回路：叶子综合先算，加法综合随后，赋值综合最后；继承属性由根向下传。<\/p>\n<h2>第二算例：成环的属性规则<\/h2>\n<p>两条规则：<\/p>\n<pre><code>A.s = B.i\nB.i = A.s<\/code><\/pre>\n<p><span class=\"katex-inline\">A<\/span> 的综合属性 <span class=\"katex-inline\">s<\/span> 依赖 <span class=\"katex-inline\">B<\/span> 的继承属性 <span class=\"katex-inline\">i<\/span>，<span class=\"katex-inline\">B<\/span> 的 <span class=\"katex-inline\">i<\/span> 又依赖 <span class=\"katex-inline\">A<\/span> 的 <span class=\"katex-inline\">s<\/span>。依赖图上 <span class=\"katex-inline\">s \\to i<\/span>、<span class=\"katex-inline\">i \\to s<\/span> 构成回路。<\/p>\n<p>不存在先算谁的次序：先算 <span class=\"katex-inline\">s<\/span> 要先有 <span class=\"katex-inline\">i<\/span>，先算 <span class=\"katex-inline\">i<\/span> 要先有 <span class=\"katex-inline\">s<\/span>。静态遍历无论自底向上还是自顶向下，都会取到未定义值。这类规则要么改写，把其中一类信息改成常量或外部查表获得；要么用循环求值在不动点上反复迭代。<\/p>\n<h2>延伸推演：求值方法的大类<\/h2>\n<p>本书 4.3.1 节把属性求值方法分为若干大类（原书 PDF 第 152 页起；扫描件细节以转述为准）：一类在遍历语法树的过程中按方向计算属性；一类基于产生式规则调度求值；对存在回路或相互依赖的属性，采用循环求值反复更新直到稳定。具体选哪类方法，取决于属性依赖图的形状与文法规模。<\/p>\n<p>属性文法与语法制导翻译一体：类型、作用域检查写在属性规则里，IR 生成动作也可挂在同一套求值顺序上。属性算完的结果交给中端，成为三地址码与后续数据流分析的事实来源。<\/p>\n<h2>对抗性追问：有环还按固定顺序硬算会怎样<\/h2>\n<p>依赖图成环时，固定遍历先算到的那个属性，读取的是对方未初始化的值；后续检查基于错误类型信息，可能把类型不兼容的语句放行，或误报合法语句。识别回路后不能靠调换遍历方向解决，必须改规则或换循环求值。<\/p>\n<p>再追一层：依赖边漏画，拓扑排序可能把使用方排在被使用方前面；与成环后果类似，求值取到未定义属性。建图时逐条核对属性读写关系，是求值正确性的前提。<\/p>\n<h2>第三算例：嵌套作用域的继承属性下发<\/h2>\n<p>块语句 <code>{ int a; { b = a; } }<\/code>，语法树两层块。外层块把符号表指针作为继承属性传给内层块；内层名字 <code>b<\/code> 在自身符号表与外层表中逐层查找，<code>a<\/code> 沿继承表链找到外层声明。<\/p>\n<p>求值步骤：<\/p>\n<ol><li>\n外层块结点建表，写入 <code>a<\/code> 的类型与位置；表指针是传给内层块的继承属性。\n<\/li><li>\n内层块继承外层表指针，建自己的表；名字引用查找时先查内层表，未命中沿继承链到外层表。\n<\/li><li>\n<code>b = a<\/code> 赋值核对：<code>b<\/code> 在内层表或外层表查到类型，<code>a<\/code> 沿链查到外层声明，两侧类型比较。\n<\/ol>\n<p>依赖方向：表指针（父→子继承）先于名字查找；类型值（叶子综合）先于赋值核对。若内层表指针漏继承，<code>a<\/code> 在最内层表查不到，未声明错误被误报；若查找方向写成只查当前层，外层可见名字同样丢失。<\/p>\n<h2>延伸推演：遍历求值与规则调度的分工<\/h2>\n<p>遍历求值沿树的固定走向计算属性：自底向上扫一遍收综合属性，自顶向下扫一遍发继承属性；依赖图无环且方向与树走向一致时，两遍遍历即可完成。产生式规则调度则按每条产生式列出属性之间的求值次序，生成器据此排出全局顺序；文法规则多、属性交叉复杂时，比手工指定遍历方向可靠。<\/p>\n<p>两类方法都以无环依赖图为前提。属性值在产生式规则间传递：同一非终结符在不同位置出现，其属性接口在各产生式下保持一致，父结点下发的继承属性才能被子结点规则接收。接口不一致属于文法设计问题，要回到产生式定义层修，不能靠求值顺序补救。<\/p>\n<p>属性计算与符号表更新交织：名字结点查表得到类型，声明结点向表写入条目；写表动作先于同作用域后续引用的查找。这类副作用顺序同样进入依赖图：写条目是后续查找的前置。<\/p>\n<h2>对抗性追问：继承属性跨结点断链会怎样<\/h2>\n<p>父结点到子结点的继承属性要经过中间树结点逐段传递；某层结点规则没把属性接到自己的继承接口，下一层就收不到。表现是子结点属性取空，类型检查跳过或报未定义。排查方向是沿树向下逐结点核对继承属性的入边与出边，而不是先怀疑子结点规则本身。<\/p>\n<p>再追一层：把作用域表做成全局变量随遍历隐式更新，看似省去继承属性，实则树结构一旦重排或并行求值，表的先后顺序失去显式约束；显式继承属性把这条依赖写进图里，求值次序可检查、可重放。<\/p>\n<h2>第四算例：类型兼容性规则的属性合成<\/h2>\n<p>表达式 <code>a + b<\/code>，<span class=\"katex-inline\">\\tau_a<\/span>、<span class=\"katex-inline\">\\tau_b<\/span> 为叶子综合类型。加法规则表规定类型组合：两整数得整数；整数与浮点按提升规则得浮点；不兼容组合记冲突。加法结点综合属性 <span class=\"katex-inline\">\\tau_+<\/span> 查规则表得到。赋值结点再把 <span class=\"katex-inline\">\\tau_+<\/span> 与左值类型 <span class=\"katex-inline\">\\tau_x<\/span> 比较：可赋值则合法，不可赋值报错或插入转换。<\/p>\n<p>依赖顺序：叶子类型先于加法综合，加法综合先于赋值核对；期望类型作为继承属性从外层下发，与实际类型在赋值结点汇合。规则表查找本身是外部动作，不构成树内属性环。<\/p>\n<h2>延伸推演：属性文法在前端流程中的位置<\/h2>\n<p>语法分析产出语法树后，上下文相关分析沿树跑属性求值：符号表建立、类型检查、作用域核对、存储类别检查都挂在属性规则上。求值通过后，翻译动作把类型信息与表达式结构写成三地址码；属性值是 IR 生成时确定类型、选择运算形式的依据。<\/p>\n<p>分析方法上，属性规则既可在语法树遍历中直接执行动作，也可先建依赖图再排拓扑序；前者实现直接，后者便于检查回路与调整求值次序。大型文法下规则交叉多，先建图后排序更稳妥；回路检测在翻译动作执行前完成，避免错误属性值进入 IR。<\/p>\n<p>属性接口与非终结符绑定：一个非终结符在不同产生式中出现，其综合产出与继承接收要对齐；文法扩充新产生式时，同步补齐属性规则，否则该分支求值时属性缺值。<\/p>\n<h2>第五算例：声明条目写入与引用查找的次序<\/h2>\n<p>块语句先执行声明结点的写表动作：把名字、类型、存储类别写入符号表条目；后续引用结点的查找动作在表条目之后。依赖图上写表边指向同作用域内的查找边。若声明出现在引用之后（前向引用受限的语言），规则要在属性层记录“尚未声明”状态，查找动作读到该状态并报错，而不是取空类型。<\/p>\n<p>继承属性沿作用域链传递表指针：外层块表指针传给内层块；内层块表在自身条目之外，沿继承链访问外层条目。写表动作只改当前层表，不改外层表；引用查找按内层到外层的顺序命中。<\/p>\n<h2>延伸推演：属性求值与翻译动作的时序<\/h2>\n<p>IR 生成动作挂在属性规则上：表达式类型确定后才生成对应运算形式的三地址指令；名字地址信息就绪后才生成 load/store 操作数。求值顺序保证动作执行时所需属性已就绪；属性未就绪就生成动作，会在 IR 里留下未确定类型或未绑定名字的占位。<\/p>\n<p>回路检测在动作执行前完成：依赖图有环时，先报告文法规则问题，不进入翻译阶段。无环图按拓扑序遍历，综合属性自底向上、继承属性自顶向下；两类属性在同一结点汇合时，按图上边序确定先后，不固定某一类永远先算。<\/p>\n<p>大型文法下属性规则数量多，产生式之间的属性接口由非终结符签名约束；新增产生式时检查签名是否补齐，避免某分支求值时继承属性缺入边、综合属性缺出边。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n综合属性与继承属性各由哪些结点的信息定义，求值方向分别是什么？\n<\/li><li>\n依赖图上的边从哪个属性指向哪个属性？\n<\/li><li>\n为什么依赖图成环就不存在静态求值次序？\n<\/li><li>\n继承属性从父结点下发到子结点，中间经过哪些树结点？\n<\/li><li>\n属性求值顺序为什么同时决定中间代码的生成顺序？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "属性文法：综合/继承属性与求值顺序"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：前端：词法分析与语法分析（正则→NFA→DFA、LL(1) 与 LR 分析）<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因）<\/a><br>检查点：能画出一个具体正则的 Thompson NFA 状态图，走完子集构造列出 DFA 状态与转移，对给定文法算 FIRST/FOLLOW 并判定是否 LL(1)，构造 LR 项目集并指出冲突项目与冲突类型<\/li><li class='path-step' id='path-02'><strong>步骤 02：中端：中间表示、数据流分析与标量优化（三地址码、CFG、到达定值、活跃变量、SSA）<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化）<\/a><br>检查点：能把一段三地址码切成基本块并画出 CFG，对手算流图两轮迭代写出到达定值与活跃变量集合到不动点，说明 φ 函数放置位置，区分可靠与不可靠优化并解释优化为什么不能改变可观察行为<\/li><li class='path-step' id='path-03'><strong>步骤 03：后端：指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出）<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：后端——指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出）<\/a><br>检查点：能用重写规则对一棵表达式树做动态规划覆盖并选出成本最低指令序列，说清表调度按什么优先级在就绪列里选指令，画出两个活动范围的冲突图并按图着色解释溢出代价从 load/store 次数怎样估出来<\/li><li class='path-step' id='path-04'><strong>步骤 04：全流程贯通：编译概览、上下文相关分析、过程抽象与代码形式<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：全流程贯通——编译概览、上下文相关分析、过程抽象与代码形式<\/a><br>检查点：能把前端、中端、后端串成一次完整编译流程，区分综合属性与继承属性并说明依赖图成环时求值顺序怎样确定，说清过程调用的栈帧、参数传递与活跃寄存器保存，以及代码形式决策怎样影响后续分析<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='编译器（compiler）'>编译器（Compiler） — 把一种语言编写的程序转换为另一种语言编写的程序的计算机程序；典型结构含前端、中端与后端，前端做词法与语法分析，中端做中间表示与优化，后端做指令选择、调度与寄存器分配 <span class=glossary-ref>（第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因））<\/span><\/li><li data-term='词法分析器（scanner）'>词法分析器（Scanner） — 编译器前端的第一阶段：读取字符流，按语言规定的词法规则把字符序列切成单词（token），每个单词归入一个语法范畴（词类）；本书第 2 章讨论其正则表达式、自动机与手工实现 <span class=glossary-ref>（第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因））<\/span><\/li><li data-term='正则表达式（regular expression, re）'>正则表达式（Regular Expression, RE） — 定义单词集合的形式化记号：字母与数字是基本 RE，连接、并（|）、闭包（*）由运算符组合；本书 2.3 节给出其符号表示法与形式化定义 <span class=glossary-ref>（第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因））<\/span><\/li><li data-term='nfa（非确定有限自动机）'>NFA（非确定有限自动机） — 带 ε 转移、同一状态对同一输入可有多条转移的有限自动机；由 Thompson 构造从 RE 得到，识别语言与 RE 相同，但执行前需经子集构造转为 DFA <span class=glossary-ref>（第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因））<\/span><\/li><li data-term='dfa（确定有限自动机）'>DFA（确定有限自动机） — 每个状态对每个输入符号至多一条转移、无 ε 转移的有限自动机；执行时不需要回溯，本书 2.4.3 节由 NFA 子集构造得到，2.4.4 节用 Hopcroft 算法最小化 <span class=glossary-ref>（第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因））<\/span><\/li><li data-term='first 集合 / follow 集合'>FIRST 集合 / FOLLOW 集合 — LL(1) 分析用的两个预测集合：FIRST(A) 是从符号 A 出发能推导出的串首终结符集合；FOLLOW(A) 是文法中紧跟在 A 后面出现的终结符集合；二者决定分析表同一格是否出现多重动作 <span class=glossary-ref>（第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因））<\/span><\/li><li data-term='lr(1) 项与项目集规范族'>LR(1) 项与项目集规范族 — LR 分析中形如 [A→α·β, a] 的项记录产生式右部已识别到的位置与前瞻符 a；所有可达项构成项目集规范族，据此填 Action 与 Goto 表 <span class=glossary-ref>（第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因））<\/span><\/li><li data-term='移进-归约冲突 / 归约-归约冲突'>移进-归约冲突 / 归约-归约冲突 — LR 表同一格同时出现移进与归约动作，或同时出现两条归约动作；前者说明文法含左递归或需更长前瞻，后者说明同一串可由两条不同产生式归约 <span class=glossary-ref>（第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因））<\/span><\/li><li data-term='中间表示（ir）'>中间表示（IR） — 编译器在源语言与目标语言之间使用的形式化程序表示；本书第 5 章区分图 IR（语法树、图）与线性 IR（堆栈机代码、三地址代码），并由线性代码建立控制流图 <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><li data-term='三地址代码（three-address code）'>三地址代码（Three-Address Code） — 每条指令至多含一个运算符、两个操作数与一个结果的线性 IR，形如 t1 ← 2、t3 ← t1 × t2；本书以 ILOC 作为贯穿各章的底层线性 IR（附录 A） <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><li data-term='基本块（basic block）'>基本块（Basic Block） — 线性代码中一段顺序执行的指令序列：只有块首一条入口指令，块内无分支跳入跳出，块尾是最后一条转移指令；基本块是控制流图的结点 <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><li data-term='控制流图（cfg）'>控制流图（CFG） — 以基本块为结点、块间转移为边的有向图；数据流分析在 CFG 上按边传播定值、活跃性等信息，本书 5.3.4 节由线性代码建立 <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><li data-term='到达定值（reaching definitions）'>到达定值（Reaching Definitions） — 一个变量的定值（赋值）能否沿 CFG 路径到达某程序点且中途未被重新赋值；属前向数据流问题，用迭代算法在不动点上收敛 <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><li data-term='活跃变量（live variable）'>活跃变量（Live Variable） — 在某程序点之后的路径上还会被引用、且在此之前未被重新定值的变量；属后向数据流问题，其结果直接决定寄存器压力与溢出决策 <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><li data-term='ssa（静态单赋值形式）'>SSA（静态单赋值形式） — 每个变量只被定值一次的 IR 形式；在控制流合并处插入 φ 函数选择各前驱传来的版本，使变量的定义-使用链唯一，简化常量传播与寄存器分配分析 <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><li data-term='φ 函数'>φ 函数 — SSA 在控制流合并块插入的选择运算：v₁ ← φ(v₂, v₃) 表示按来自哪条前驱路径取对应版本；放置位置由支配边界与变量的定义集合算出 <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><li data-term='寄存器分配 / 指派'>寄存器分配 / 指派 — 分配决定哪些活动范围占用寄存器，指派决定每个范围落到哪个具体寄存器；本书第 13 章以冲突图为基础做全局分配，度数超过可用寄存器数的活动范围需溢出到内存 <span class=glossary-ref>（第 3 章：后端——指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出））<\/span><\/li><li data-term='活动范围（live range）与冲突图'>活动范围（Live Range）与冲突图 — 一个定值从定义到最后一次引用之间的区间称活动范围；两个活动范围生命周期重叠即在冲突图中连边，图的着色问题等价于寄存器分配问题 <span class=glossary-ref>（第 3 章：后端——指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出））<\/span><\/li><li data-term='溢出（spill）'>溢出（Spill） — 寄存器不足时把某些活动范围降级到内存：在使用前插入 load、在定值后插入 store；溢出代价按相关 load/store 的执行频率估算，优先溢出代价最低的范围 <span class=glossary-ref>（第 3 章：后端——指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出））<\/span><\/li><li data-term='树模式匹配指令选择'>树模式匹配指令选择 — 把 IR 表达式平铺成抽象语法树，用重写规则（产生式、成本、代码模板）在树上匹配覆盖，自底向上用动态规划求出成本最低的指令序列；本书 11.4 节讨论 <span class=glossary-ref>（第 3 章：后端——指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出））<\/span><\/li><li data-term='表调度（list scheduling）'>表调度（List Scheduling） — 局部指令调度的主算法：维护就绪指令列表，按优先级排序后每次选出一条发射；本书第 12 章讨论前向/后向表调度、平局打破与区域调度 <span class=glossary-ref>（第 3 章：后端——指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出））<\/span><\/li><li data-term='综合属性 / 继承属性'>综合属性 / 继承属性 — 属性文法中：综合属性由结点本身、其子结点与常量定义；继承属性由结点本身、其兄弟结点与父结点（外加常量）定义；属性依赖图决定求值顺序，成环则无法求值 <span class=glossary-ref>（第 4 章：全流程贯通——编译概览、上下文相关分析、过程抽象与代码形式）<\/span><\/li><li data-term='过程抽象与调用约定'>过程抽象与调用约定 — 编译器为过程建立的受控执行环境：形参映射、栈帧布局、返回值传递、调用者/被调用者保存寄存器规则；本书第 6 章讨论 Algol 类与面向对象语言的命名空间与链接约定 <span class=glossary-ref>（第 4 章：全流程贯通——编译概览、上下文相关分析、过程抽象与代码形式）<\/span><\/li><li data-term='可观察行为（observable behavior）'>可观察行为（Observable Behavior） — 程序运行时外部可感知的结果：输出、输入交互、未定义之外的异常等；编译器优化只能改变内部实现，不能改变等价程序在所有输入下的可观察行为 <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库<\/h1>\n<h2>模式 1：规则先形式化，再机械转成自动机<\/h2>\n<p>词法规则先用正则表达式写成独立记号，再由确定的构造步骤转成 NFA、DFA。人维护的是 RE 层规则，自动机由工具生成；改关键字或运算符只改 RE，不手改状态转移。识别能力等价的两种表示之间，构造顺序固定：RE → NFA → 子集构造 → 最小化，不能跳过闭包计算直接拼 DFA 转移。<\/p>\n<h2>模式 2：预测集合先算全，再填分析表<\/h2>\n<p>语法分析前先把 FIRST、FOLLOW 集合迭代到稳定，再按产生式填表；同一格出现两条产生式即记录冲突。填表依据是集合而非试探：候选首符落在 FIRST，可推 ε 的候选落在 FOLLOW。冲突先回到文法层消左递归、提左公因子；改不动文法再换 LR 分析器，不靠分析器回溯掩盖冲突。<\/p>\n<h2>模式 3：先切块建图，再在图上传播信息<\/h2>\n<p>线性 IR 先按领导者规则切成基本块，块间转移建成 CFG；数据流方程在图结点上迭代，不在逐条指令上就地推断。前向问题从入口沿边传定值，后向问题从出口沿边传活跃性；迭代到各轮集合不再变化才取不动点。切块破坏“块内顺序执行”前提，后续局部推断全部失焦。<\/p>\n<h2>模式 4：分析结果限定在数据流事实支持的范围内做变换<\/h2>\n<p>每一类优化都挂一条数据流事实：死代码消除靠活跃变量，冗余消除靠到达定值，代码移动靠循环不变量与可用性。变换前核对事实覆盖所有路径；事实不足（别名不明、路径未知、定值可能被改写）就保留原代码。优化不能改变可观察行为，宁可少消一处重复，不能放走一个可能被引用的定值。<\/p>\n<h2>模式 5：后端按选择、调度、分配三段串行推进<\/h2>\n<p>指令选择定用哪条指令，调度定指令顺序，分配定寄存器落点；前一段产物是后一段输入。选择阶段只留操作数占位，不绑定物理寄存器；调度按依赖链排顺序，不替换指令；分配在调度后的活动范围上建冲突图。三段之间有反馈：分配溢出产生的 load/store 要回调度复查依赖，调度拉长的存活区间要回分配重估冲突。<\/p>\n<h2>模式 6：冲突图不可着色时先拆范围，再重新建图<\/h2>\n<p>寄存器不足时不硬给超图分配颜色：选代价最低的范围溢出，拆成定值后 store、使用前 load 的短子范围，子范围重新进冲突图参与着色。溢出代价按访存频率估算，热路径上的长范围尽量保留；简化阶段度数小于寄存器数的结点先移除，逆序着色，留下的高密结点才是溢出候选。<\/p>\n<h2>模式 7：语义检查挂在语法树结点上，按依赖图次序求值<\/h2>\n<p>类型、作用域、存储类别检查不在语法分析里做，而在分析产出的语法树结点上挂属性。综合属性自底向上汇总，继承属性自顶向下下发；属性间读写关系画成依赖图，无环按拓扑序求值，成环先改规则。翻译动作（生成 IR）排在属性就绪之后；依赖边漏画或方向反了，动作取到未定义属性，错误要到中端才暴露。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 前端：词法分析与语法分析<\/strong>：正则表达式 → Thompson 构造 NFA → 子集构造 DFA → Hopcroft 最小化；LL(1) 算 FIRST/FOLLOW 填表；LR(1) 建项目集规范族填 Action/Goto。对应原书第 2–3 章（PDF 第 32–134 页；印刷页 = PDF 页 − 15）。\n<\/li><li>\n<strong>第 2 章 中端：中间表示、数据流分析与优化<\/strong>：三地址码切基本块建 CFG；到达定值（前向）、活跃变量（后向）迭代到不动点；SSA 插 φ；常量传播、复制传播、死代码消除。对应原书第 5、8、9、10 章（PDF 第 177–197、313–455 页；印刷页 = PDF 页 − 15）。\n<\/li><li>\n<strong>第 3 章 后端：指令选择、调度与寄存器分配<\/strong>：树覆盖 + 动态规划选指令；表调度按优先级排顺序；冲突图简化-着色分配寄存器，不够用时溢出。对应原书第 11、12、13 章（PDF 第 456–545 页；印刷页 = PDF 页 − 15）。\n<\/li><li>\n<strong>第 4 章 全流程贯通<\/strong>：编译各阶段回环；上下文相关分析挂属性文法；过程抽象与调用约定；代码形式决策如何影响 IR 与后端。对应原书第 1、4、6、7 章与附录 A（PDF 第 16–31、135–176、213–312、546–554 页；印刷页 = PDF 页 − 15）。\n<\/ul>\n<h2>词法层流水线速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>步骤<\/th><th>输入<\/th><th>动作<\/th><th>产物<\/th><\/tr><\/thead><tbody><tr><td>RE 写规则<\/td><td>单词集合<\/td><td>连接、并、闭包组合<\/td><td>正则表达式<\/td><\/tr><tr><td>Thompson 构造<\/td><td>RE<\/td><td>五条规则逐子表达式建自动机<\/td><td>带 ε 边的 NFA<\/td><\/tr><tr><td>子集构造<\/td><td>NFA<\/td><td>ε-闭包 + 字符转移求子集<\/td><td>无 ε 的 DFA<\/td><\/tr><tr><td>最小化<\/td><td>DFA<\/td><td>按行为签名分组合并等价状态<\/td><td>状态数最少的 DFA<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>LL(1) 与 LR 对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>LL(1)<\/th><th>LR（SLR/LR(1)/LALR）<\/th><\/tr><\/thead><tbody><tr><td>推导方向<\/td><td>自顶向下，最左推导<\/td><td>自底向上，归约到开始符<\/td><\/tr><tr><td>预测依据<\/td><td>FIRST、FOLLOW 集合<\/td><td>项目集规范族 + 前瞻<\/td><\/tr><tr><td>冲突类型<\/td><td>同一格两条产生式<\/td><td>移进-归约、归约-归约<\/td><\/tr><tr><td>文法限制<\/td><td>需消左递归、提左公因子<\/td><td>可处理更多左递归文法<\/td><\/tr><tr><td>表体积<\/td><td>小<\/td><td>LR(1) 最大，LALR 压缩<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>数据流问题对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>问题<\/th><th>方向<\/th><th>集合<\/th><th>方程<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td>到达定值<\/td><td>前向<\/td><td>定值集合<\/td><td><span class=\"katex-inline\">\\text{OUT}[B]=\\text{GEN}[B]\\cup(\\text{IN}[B]-\\text{KILL}[B])<\/span>，<span class=\"katex-inline\">\\text{IN}[B]=\\bigcup_{P\\in\\text{pred}(B)}\\text{OUT}[P]<\/span><\/td><td>定值流向、冗余判断<\/td><\/tr><tr><td>活跃变量<\/td><td>后向<\/td><td>变量集合<\/td><td><span class=\"katex-inline\">\\text{LIVE\\_IN}[B]=\\text{USE}[B]\\cup(\\text{LIVE\\_OUT}[B]-\\text{DEF}[B])<\/span>，<span class=\"katex-inline\">\\text{LIVE\\_OUT}[B]=\\bigcup_{S\\in\\text{succ}(B)}\\text{LIVE\\_IN}[S]<\/span><\/td><td>寄存器压力、死代码判断<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>后端三步分工<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>阶段<\/th><th>回答的问题<\/th><th>输入<\/th><th>主要数据结构<\/th><\/tr><\/thead><tbody><tr><td>指令选择<\/td><td>用哪条目标指令<\/td><td>IR 表达式树<\/td><td>重写规则、成本表、覆盖标注<\/td><\/tr><tr><td>指令调度<\/td><td>指令排成什么顺序<\/td><td>选择后的指令序列<\/td><td>就绪列表、优先级、依赖链<\/td><\/tr><tr><td>寄存器分配<\/td><td>哪个值占哪个寄存器<\/td><td>活动范围<\/td><td>冲突图、颜色池、溢出代价<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>关键记号<\/h2>\n<ul><li>\n三地址码：<code>t3 ← t1 × t2<\/code>；ILOC 为贯穿全书的底层线性 IR（附录 A，PDF 第 546 页）。\n<\/li><li>\nLR(1) 项：<span class=\"katex-inline\">[A \\to \\alpha \\cdot \\beta,\\, a]<\/span>，圆点标记已识别位置，<span class=\"katex-inline\">a<\/span> 为前瞻符。\n<\/li><li>\nSSA 汇合选择：<span class=\"katex-inline\">v_1 \\leftarrow \\phi(v_2, v_3)<\/span>，按前驱路径取版本。\n<\/li><li>\n溢出：定值后 <code>store<\/code>、使用前 <code>load<\/code>；代价按相关访存指令的执行频率估算。\n<\/ul>\n<h2>优化可靠性核对清单<\/h2>\n<ol><li>\n被删定值在所有路径上是否都无引用？\n<\/li><li>\n被移动计算的副作用时机是否保持可观察？\n<\/li><li>\n被复用的表达式中间是否未被改写？\n<\/li><li>\n特化假设是否覆盖实际执行路径？\n<\/li><li>\n别名不确定的访存对是否保留原顺序？\n<\/ol>\n<p>任一项不满足，该变换不执行；分析精度不足时宁可少优化。<\/p>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/编译器设计-第2版-2", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因）", "href": "#/chapter/ch01"}, {"label": "第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化）", "href": "#/chapter/ch02"}, {"label": "第 3 章：后端——指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出）", "href": "#/chapter/ch03"}, {"label": "第 4 章：全流程贯通——编译概览、上下文相关分析、过程抽象与代码形式", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "正则表达式到 NFA：Thompson 构造法", "href": "#/concept/c01"}, {"label": "子集构造到 DFA 与 DFA 最小化（Hopcroft 算法）", "href": "#/concept/c02"}, {"label": "LL(1) 分析：FIRST/FOLLOW 集合与冲突成因", "href": "#/concept/c03"}, {"label": "LR 项目集、Action/Goto 表与移进-归约冲突", "href": "#/concept/c04"}, {"label": "三地址码、基本块与控制流图（CFG）构造", "href": "#/concept/c05"}, {"label": "到达定值分析：迭代框架与不动点", "href": "#/concept/c06"}, {"label": "活跃变量分析与寄存器压力", "href": "#/concept/c07"}, {"label": "SSA 形式与 φ 函数放置", "href": "#/concept/c08"}, {"label": "常量传播、死代码消除与优化的可观察行为边界", "href": "#/concept/c09"}, {"label": "图着色寄存器分配与溢出代价", "href": "#/concept/c10"}, {"label": "指令选择：树模式匹配与动态规划覆盖", "href": "#/concept/c11"}, {"label": "指令调度：表调度与局部/区域顺序重排", "href": "#/concept/c12"}, {"label": "属性文法：综合/继承属性与求值顺序", "href": "#/concept/c13"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因）", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化）", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：后端——指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出）", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：全流程贯通——编译概览、上下文相关分析、过程抽象与代码形式", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.32<\/div><h1>第 1 章：前端——词法分析与语法分析<\/h1>\n<blockquote>对应原书第 2 章「词法分析器」（PDF 第 32–75 页；印刷页 = PDF 页 − 15，印刷 17–60）与第 3 章「语法分析器」（PDF 第 76–134 页；印刷 61–119）。偏移 k=15 由第 1 章首页 PDF 第 16 页对应印刷第 1 页、第 2 章首页 PDF 第 32 页对应印刷第 17 页等 13 个章首页逐页图核出。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n把一段单词的形式化规则写成正则表达式，再按 Thompson 构造把它画成 NFA 状态图，说清每个运算符对应哪种状态拼接；\n<\/li><li>\n走完子集构造，从 NFA 列出 DFA 的状态集合与转移表，并用等价类划分把 DFA 最小化；\n<\/li><li>\n对一个给定文法算出 FIRST 与 FOLLOW 集合，指出分析表哪一格出现多重动作，判断它是不是 LL(1) 文法；\n<\/li><li>\n构造 LR(1) 项目集规范族，填出 Action/Goto 表，认出移进-归约冲突与归约-归约冲突分别出现在哪一项；\n<\/li><li>\n说明词法分析与语法分析在输入输出、回溯代价、错误恢复粒度上的分工，以及为什么前端要先分词再分析结构。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>前端把字符流分两步变成带结构的语法树：词法分析用正则表达式与有限自动机把字符切成单词，语法分析用上下文无关文法把单词串归约成语法树；两步各自配套一套自动生成技术——RE 经 Thompson 构造、子集构造、最小化得到词法识别器，文法经 FIRST/FOLLOW 或 LR 项目集得到分析表。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 前端为什么要分成词法与语法两层<\/h3>\n<p>编译器处理源程序的第一个阶段是词法分析：读取字符，按规则判断每个字符在源语言中是否合法，给字符序列分配一个词法范畴（词类）或类型（原书 2.1 节，PDF 第 32 页）。词法分析器是编译器中唯一直接接触输入字符的部件；把这层单独切开，一方面是因为词法规则用有限自动机处理速度快、实现规整，另一方面是因为这层的输入在一定程度上比其他各层更易处理。<\/p>\n<p>第二个阶段是语法分析：词法分析器生成的已归类单词流，交给语法分析器推导一个语法结构，把各个单词适配到源程序设计语言的语法模型中（原书 3.1 节，PDF 第 76 页）。语法分析的输入不再是单个字符，而是一个个标了词类的单词；分析器构造的是句子的结构，而不是字符的切分。<\/p>\n<p>两层分开的直接好处是关注点分离：词法层只回答“这串字符是什么单词、属于哪一类”，语法层只回答“这个单词串按文法怎样拼成合法句子”。手写词法分析器在规则简单时可行；规则一多，工具生成的分析器比手写更常见（原书 3.1 节，PDF 第 76 页）。<\/p>\n<h3>2. 概念 1：正则表达式到 NFA 的 Thompson 构造（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。从 RE 到识别器的第一步是造 NFA：单字符 RE 对应一条带标记的转移；连接把两个小 NFA 首尾相接；并在两个小 NFA 外各加一条 ε 转移到新的起始与接受状态；闭包再用 ε 把接受状态接回起始状态。每个由构造得到的 NFA 至多一个起始状态、一个接受状态（原书 2.4.2 节，PDF 第 48 页）。<\/p>\n<h3>3. 概念 2：子集构造到 DFA 与最小化（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。NFA 可以在同一状态对同一输入走多条路，执行时需要记录当前可能处在的状态集合；子集构造把这样的状态集合整体当作 DFA 的一个状态，逐字符扩展转移，得到执行不需要回溯的 DFA。DFA 最小化按“读入相同串后行为相同”把状态分成等价类，Hopcroft 算法用集合划分反复拆分等价类（原书 2.4.3、2.4.4 节，PDF 第 49、54 页）。<\/p>\n<h3>4. 概念 3：LL(1) 的 FIRST/FOLLOW 与冲突（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。自顶向下分析从文法开始符出发推导句子；表驱动 LL(1) 分析器靠 FIRST 集合预测一个候选产生式能否推出当前输入，靠 FOLLOW 集合处理候选推导出 ε 的情形。同一分析表格子里落进两条不同动作，就说明文法对这一步有二义性，LL(1) 分析器无法无回溯地选择（原书 3.3.3 节，PDF 第 98 页）。<\/p>\n<h3>5. 概念 4：LR 项目集与移进-归约冲突（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。自底向上分析把单词串逐步归约到开始符；LR(1) 分析器的关键数据结构是 Action 表与 Goto 表。项写成 <code>[A→α·β, a]<\/code>，圆点记录右部已识别到的位置，a 是前瞻符；所有可达项组成项目集规范族，填表时同一格既允许移进又允许归约，就是移进-归约冲突；同格两条归约是归约-归约冲突（原书 3.4.1、3.4.2 节，PDF 第 104、109 页）。<\/p>\n<h2>推导一（算法推演）：从正则表达式 <code>(a|b)*abb<\/code> 走到 DFA 的状态转移<\/h2>\n<p>第一步，写正则。目标单词是字母表 <code>{a, b}<\/code> 上以 <code>abb<\/code> 结尾的串，正则取 <code>(a|b)*abb<\/code>。<\/p>\n<p>第二步，Thompson 构造。先对单字符 <code>a<\/code>、<code>b<\/code> 各造一条转移；用并规则造出 <code>a|b<\/code> 的小 NFA，外加 ε 转移到新起点与新终点；闭包规则用 ε 把该小 NFA 的终点接回它自己的起点；再按连接规则依次拼上 <code>a<\/code>、<code>b<\/code>、<code>b<\/code> 三段。构造产物是一张带 ε 边的 NFA，起点一个、终点一个，中间状态都可能带多条 ε 出口。<\/p>\n<p>第三步，ε-闭包。子集构造的初始状态是 NFA 起点的 ε-闭包：从起点出发只沿 ε 边能到达的全部状态组成的集合。之后每取一个输入字符，先对当前集合中每个状态找出沿该字符的转移目标，再对这些目标求 ε-闭包，得到下一个 DFA 状态。<\/p>\n<p>第四步，列转移表。设初始 DFA 状态 <span class=\"katex-inline\">S_0 = \\text{closure}(q_0)<\/span>。对 <span class=\"katex-inline\">S_0<\/span> 读 <code>a<\/code>，求所有 <code>a<\/code> 转移目标的 ε-闭包，记 <span class=\"katex-inline\">S_1<\/span>；读 <code>b<\/code> 用同一闭包步骤得 <span class=\"katex-inline\">S_2<\/span>。逐个新状态重复扩展，直到没有新集合产生。凡集合中包含 NFA 接受状态的 DFA 状态，标记为接受状态。<\/p>\n<p>第五步，最小化。把已达接受态与未达接受态先分成两组；对每个组内状态，按“读 <code>a<\/code> 落到哪组、读 <code>b<\/code> 落到哪组”检查行为是否一致，行为不一致的状态拆到新组，反复直到分组不再变化。同一组内的 DFA 状态合并成一个状态（原书 2.4.4 节，PDF 第 54 页）。<\/p>\n<p>这个推导的不变量是：子集构造前后自动机接受的语言不变；最小化合并的只是行为等价的状态，不改变任何输入串的接受与否。<\/p>\n<h2>推导二（算法推演）：对一个文法算 FIRST/FOLLOW，定位 LL(1) 冲突<\/h2>\n<p>给定文法片段（本书 3.4.2 节用于举例的列表文法的简化形式，原书 PDF 第 109 页）：<\/p>\n<pre><code>List → List Pair\nList → Pair\nPair → &#x27;(&#x27; Pair &#x27;)&#x27;\nPair → &#x27;(&#x27; &#x27;)&#x27;<\/code><\/pre>\n<p>第一步，算 FIRST。终结符只有 <code>(<\/code>、<code>)<\/code>。<code>FIRST(Pair) = { ( }<\/code>；<code>Pair<\/code> 能推出以 <code>(<\/code> 开头的串，<code>FIRST(List)<\/code> 经由 <code>List → Pair<\/code> 也得到 <code>{ ( }<\/code>。<\/p>\n<p>第二步，观察左递归。第一条产生式 <code>List → List Pair<\/code> 的右部以左部自身开头，这是直接左递归。LL(1) 自顶向下推导时，面临输入 <code>(<\/code> 要选产生式，先看 <code>List → List Pair<\/code>：右部首符 <code>List<\/code> 的 FIRST 是 <code>{ ( }<\/code>；再看 <code>List → Pair<\/code>：右部首符 <code>Pair<\/code> 的 FIRST 也是 <code>{ ( }<\/code>。<\/p>\n<p>第三步，填表。分析表中 <code>[List, (]<\/code> 这一格同时落进两条产生式：一条来自 <code>List → List Pair<\/code>，一条来自 <code>List → Pair<\/code>。两条候选在同一个前瞻符 <code>(<\/code> 下都可行，分析器无法无回溯地选定其中一条。<\/p>\n<p>第四步，定性。这是自顶向下分析在左递归文法上的典型失败：左递归让候选产生式的 FIRST 集合重叠。消除左递归或改成右递归形式后，两个候选的首符才可能分开；若分开后仍重叠，需要更长前瞻（如 LL(k)）或改用自底向上的 LR 分析（原书 3.3.3 节，PDF 第 98 页）。<\/p>\n<h2>反事实：去掉前端某个条件会怎样<\/h2>\n<ul><li>\n<strong>不算 FIRST/FOLLOW 就选产生式<\/strong>：分析器在候选之间只能靠猜测，选错就要回溯。回溯时已经输出的中间代码、已经推进的单词指针都要回滚；语法错误的位置也只能在回溯失败后才暴露。LL(1) 表存在的意义，就是用两个集合把“此刻该选哪条产生式”在编译期算成查表动作，运行期不猜。\n<\/li><li>\n<strong>词法层不切词，直接把字符流交给语法分析<\/strong>：文法要为每个字符写规则，标识符、常数、关键字的区分全挤进语法层；单词内部的拼写错误被当成结构错误上报，错误恢复粒度落到字符级，分析表体积和回溯代价都会失控。\n<\/li><li>\n<strong>NFA 不做子集构造，直接驱动识别<\/strong>：执行时要同时维护一条可能的状态路径集合，遇到分叉要保留或回溯，输入一长就需要大量试探；子集构造把不确定性提前消除在编译期，运行期每个状态对每个字符只有一条确定转移。\n<\/li><li>\n<strong>DFA 不最小化<\/strong>：功能仍然正确，但多出来的状态会占用内存，词法分析器在高速扫描时的查表步骤随之增加；最小化只合并行为等价的状态，不会改变接受语言（原书 2.4.4 节，PDF 第 54 页）。\n<\/li><li>\n<strong>文法有二义性却硬填 LR 表<\/strong>：同一格出现两个归约动作，分析器不知道按哪条归约；此时即便给冲突加默认优先级，也只是掩盖文法问题，句子的语法结构在不同归约顺序下可能不同。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章产出的单词流与语法树是中端的输入：第 2 章把语法结构翻译成三地址码与控制流图，再在图上做数据流分析与优化。词法层识别出的单词类型，直接决定中端翻译时取用哪个操作数类型；语法分析留下的树或产生式序列，是语法制导翻译挂接属性的骨架（见第 4 章 c13）。LR 分析比 LL 分析能覆盖更大一类文法，代价是分析表更大、构造算法更复杂；这个取舍贯穿编译器前端设计的各个决策点。<\/p>", "ch02": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.177<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因）<\/a><\/span><\/div><h1>第 2 章：中端——中间表示、数据流分析与优化<\/h1>\n<blockquote>对应原书第 5 章「中间表示」（PDF 第 177–197 页；印刷 162–182）、第 8 章「优化简介」（PDF 第 313–364 页；印刷 298–349）、第 9 章「数据流分析」（PDF 第 365–412 页；印刷 350–397）、第 10 章「标量优化」（PDF 第 413–455 页；印刷 398–440）。印刷页 = PDF 页 − 15。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分图 IR 与线性 IR，把一段三地址码切成基本块并画出控制流图；\n<\/li><li>\n写出到达定值分析的迭代式，对一个带循环的手算流图走完两轮传播到不动点；\n<\/li><li>\n沿后向方向算活跃变量集合，说明一个变量在程序点活跃意味着什么、它怎样变成寄存器压力；\n<\/li><li>\n说清 SSA 形式为什么要求每个变量只定值一次，φ 函数在控制流合并处按什么规则放置；\n<\/li><li>\n判断一项优化是否可靠，区分不改变可观察行为的合法改写与会改变程序结果的不可靠变换。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>中端把前端留下的语法结构翻译成便于分析的中间表示（IR），在控制流图上用迭代数据流算法求出定值的流向、变量的活跃性等事实，再依据这些事实做常量传播、死代码消除、代码移动等标量优化；SSA 是一种让定义-使用链唯一的 IR 变体，它把多个合并版本显式写成 φ 函数，让后续分析更精确。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. IR 在编译器里承担什么角色<\/h3>\n<p>编译器通常不把源代码直接翻译成目标代码，而是先翻译成中间表示。IR 是编译器大多数处理步骤读取并操纵的核心数据结构：IR 的性质决定了改写特定机器指令、查找特定定值或注释的机制（原书 5.1 节，PDF 第 177 页）。本书把 IR 分成图类（与语法相关的树、图）与线性类（堆栈机代码、三地址代码）两类；线性代码再按基本块组织成控制流图（原书 5.2、5.3、5.3.4 节，PDF 第 178、189、191 页）。<\/p>\n<h3>2. 概念 1：三地址码、基本块与 CFG 构造（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。三地址代码每条指令至多一个运算符、两个操作数、一个结果，形如 <code>t3 ← t1 × t2<\/code>。基本块是一段顺序执行的指令序列：块首是唯一入口，块内不发生分支跳入跳出，块尾是转移指令；以块为结点、块间转移为边，得到 CFG。<\/p>\n<h3>3. 概念 2：到达定值分析与不动点（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。到达定值回答：某变量的一次赋值能否沿 CFG 路径到达当前程序点，且中途没被重新赋值。它是前向数据流问题：入口集合已知，沿边传播，汇合处取并集；每轮迭代把新得到的定值并入各块的入口/出口集合，直到某一轮没有集合再变化，到达不动点（原书 9.2 节，PDF 第 365 页）。<\/p>\n<h3>4. 概念 3：活跃变量分析与寄存器压力（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。活跃变量是后向问题：从程序点往后看，该变量的值还会被引用、且在引用前没有被重新定值，它才活跃。活跃集合决定后端哪些定值必须留在寄存器里；同时活跃的定值越多，寄存器压力越大，超出可用寄存器数就必须溢出（原书 9.2.2 节，PDF 第 370 页）。<\/p>\n<h3>5. 概念 4：SSA 形式与 φ 函数（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。SSA 把每个变量的多次定值拆成不同版本，每个版本只被定值一次；在控制流合并处，来自不同前驱的版本汇成一个选择运算 φ 函数。φ 的放置位置由支配边界与变量定义集合算出：若一个块有多个前驱，且变量在不同路径上被定值，合并块就需要插入 φ（原书 9.3.3 节，PDF 第 384 页）。<\/p>\n<h3>6. 概念 5：标量优化的可靠性边界（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。第 10 章把标量优化分成消除无用与不可达代码、代码移动、特化、冗余消除、为其他变换制造时机几类（原书 10.1 节，PDF 第 413 页）。任何改写都必须保证：在所有输入下，改写后程序的可观察行为与改写前一致；依赖编译期无法证明的事实做猜测性删除或替换，就可能改变程序结果。<\/p>\n<h2>推导一（算法推演）：把一段三地址码切成基本块并建 CFG<\/h2>\n<p>给定 ILOC 风格三地址码（编号为指令序号）：<\/p>\n<pre><code>1   i ← 0\n2   j ← 0\n3   t1 ← i &lt; n\n4   if t1 goto 7\n5   t2 ← j + 1\n6   goto 9\n7   t3 ← i + 1\n8   i ← t3\n9   t4 ← i + j\n10  if t4 goto 2\n11  return<\/code><\/pre>\n<p>第一步，找领导者。程序第一条指令是领导者；任何转移指令的目标是领导者；任何紧跟转移或条件转移之后的指令是领导者。这里领导者为：1（首条）、5（<code>goto 9<\/code> 之外，4 的目标 7 是领导者）、7（4 的转移目标）、9（6 的转移目标）、2（10 的转移目标）。<\/p>\n<p>第二步，切块。每个领导者到下一个领导者之前的指令组成一个基本块：<\/p>\n<ul><li>\n<span class=\"katex-inline\">B_1<\/span>：1–4\n<\/li><li>\n<span class=\"katex-inline\">B_2<\/span>：5–6\n<\/li><li>\n<span class=\"katex-inline\">B_3<\/span>：7–8\n<\/li><li>\n<span class=\"katex-inline\">B_4<\/span>：9–10\n<\/li><li>\n<span class=\"katex-inline\">B_5<\/span>：11\n<\/ul>\n<p>第三步，连边。<span class=\"katex-inline\">B_1<\/span> 末尾条件转移到 <span class=\"katex-inline\">B_3<\/span>，顺序后继是 <span class=\"katex-inline\">B_2<\/span>，所以 <span class=\"katex-inline\">B_1 \\to B_2<\/span>、<span class=\"katex-inline\">B_1 \\to B_3<\/span>；<span class=\"katex-inline\">B_2<\/span> 末尾 <code>goto 9<\/code> 到 <span class=\"katex-inline\">B_4<\/span>；<span class=\"katex-inline\">B_3<\/span> 顺序后继 <span class=\"katex-inline\">B_4<\/span>；<span class=\"katex-inline\">B_4<\/span> 末尾条件转移回 <span class=\"katex-inline\">B_2<\/span> 起点 2，顺序后继 <span class=\"katex-inline\">B_5<\/span>。<\/p>\n<p>第四步，校验。每个块只有一个入口领导者，块内指令顺序执行；块间的边全部来自转移目标与顺序后继。这张图就是后续到达定值、活跃变量分析的工作底图（原书 5.3.4 节，PDF 第 191 页）。<\/p>\n<h2>推导二（算法推演）：到达定值在双块流图上两轮迭代到不动点<\/h2>\n<p>取两个块的简化流图：入口块 <span class=\"katex-inline\">B_1<\/span> 含定值 <span class=\"katex-inline\">d_1: x \\leftarrow 1<\/span>；<span class=\"katex-inline\">B_2<\/span> 含 <span class=\"katex-inline\">d_2: x \\leftarrow x + 1<\/span>，<span class=\"katex-inline\">B_1 \\to B_2<\/span>，<span class=\"katex-inline\">B_2<\/span> 有一条回边到 <span class=\"katex-inline\">B_1<\/span> 之后的汇合块 <span class=\"katex-inline\">B_3<\/span>。记定值集合 <span class=\"katex-inline\">D = \\{d_1, d_2\\}<\/span>。<\/p>\n<p>前向迭代式：<\/p>\n<div class=\"katex-block\">\\text{IN}[B] = \\bigcup_{P \\in \\text{pred}(B)} \\text{OUT}[P], \\quad \\text{OUT}[B] = \\text{GEN}[B] \\cup (\\text{IN}[B] - \\text{KILL}[B])<\/div>\n<p>其中 <code>GEN<\/code> 是块内产生的定值，<code>KILL<\/code> 是被该块内同变量定值覆盖的其他定值。<\/p>\n<p>初始：所有 <code>IN<\/code>、<code>OUT<\/code> 置空。<\/p>\n<p>第一轮：<\/p>\n<ul><li>\n<span class=\"katex-inline\">B_1<\/span>：<code>IN[B₁] = ∅<\/code>，<code>GEN[B₁] = {d₁}<\/code>，<code>KILL[B₁] = ∅<\/code>，<code>OUT[B₁] = {d₁}<\/code>。\n<\/li><li>\n<span class=\"katex-inline\">B_2<\/span>：<code>IN[B₂] = OUT[B₁] = {d₁}<\/code>；<code>GEN[B₂] = {d₂}<\/code>，<code>KILL[B₂] = {d₁}<\/code>（<span class=\"katex-inline\">d_2<\/span> 重定义 <span class=\"katex-inline\">x<\/span>，覆盖同变量的 <span class=\"katex-inline\">d_1<\/span>）；<code>OUT[B₂] = {d₂} ∪ ({d₁} − {d₁}) = {d₂}<\/code>。\n<\/li><li>\n<span class=\"katex-inline\">B_3<\/span>：<code>IN[B₃] = OUT[B₂] = {d₂}<\/code>，<code>OUT[B₃] = {d₂}<\/code>。\n<\/ul>\n<p>第二轮：<\/p>\n<ul><li>\n<span class=\"katex-inline\">B_1<\/span> 的 <code>OUT<\/code> 仍为 <code>{d₁}<\/code>；<span class=\"katex-inline\">B_2<\/span> 的 <code>IN<\/code> 仍为 <code>{d₁}<\/code>，<code>OUT<\/code> 仍为 <code>{d₂}<\/code>；<span class=\"katex-inline\">B_3<\/span> 的集合不变。\n<\/ul>\n<p>两轮之后所有集合不再变化，到达不动点。结论：在 <span class=\"katex-inline\">B_2<\/span> 内 <span class=\"katex-inline\">d_1<\/span> 被 <span class=\"katex-inline\">d_2<\/span> 杀死，<span class=\"katex-inline\">x<\/span> 在 <span class=\"katex-inline\">B_2<\/span> 出口只由 <span class=\"katex-inline\">d_2<\/span> 到达；若某条路径绕过 <span class=\"katex-inline\">B_2<\/span> 直接到 <span class=\"katex-inline\">B_3<\/span>，则 <span class=\"katex-inline\">d_1<\/span> 也能到达 <span class=\"katex-inline\">B_3<\/span>，汇合处 <code>IN[B₃]<\/code> 取两路并集。<\/p>\n<h2>反事实：中端某个条件去掉会怎样<\/h2>\n<ul><li>\n<strong>优化不做可靠性证明就删除“看起来没用”的定值<\/strong>：编译器无法证明某变量在所有路径上都不再被引用，就把它的赋值删掉；若某条异常路径、外部输入或回调还会读取该变量，删除后程序输出改变。死代码消除只能删除在数据流分析中确认无引用的定值（原书 10.2 节，PDF 第 413 页起）。\n<\/li><li>\n<strong>不做活跃变量分析就分配寄存器<\/strong>：后端把每个遇到的变量都占一个寄存器，同时活跃的定值数超过寄存器数量时直接装不下；没有活跃集合作为依据，溢出选择只能随机挑变量，可能把循环内反复使用的变量溢到内存，拖慢热路径。\n<\/li><li>\n<strong>SSA 不插 φ 函数<\/strong>：合并块里同一个名字对应几条不同路径传来的不同版本，分析器把它们当成一次定值，常量传播会把来自某条路径的常数误安到另一条路径上；φ 函数把版本选择显式写出来，定义-使用关系才唯一。\n<\/li><li>\n<strong>数据流分析只走一轮就停<\/strong>：循环回边带来的定值还没传播到循环头部，入口集合被当成空；后续优化依据不完整的信息做决策，可能漏掉可消除的冗余或误判定值可达。迭代必须走到集合不再变化。\n<\/li><li>\n<strong>把局部优化当全局优化用<\/strong>：只在单个基本块内成立的事实（块内定值顺序可见），出了块就可能被其他路径改写；跨块复用需要全局数据流分析提供依据，局部信息不能直接推广到全局（原书 8.4、8.5 节，PDF 第 317 页起）。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章的 IR 与分析结果是后端决策的输入：活跃集合与活动范围直接喂给第 3 章的寄存器分配；三地址码与表达式树喂给指令选择；调度器依赖 CFG 上的依赖关系排指令顺序。第 4 章回到全流程：属性文法把前端语法树与中端翻译动作挂接，过程抽象决定栈帧与参数传递这些代码形式决策，而代码形式又反过来影响中端分析能拿到什么信息。<\/p>", "ch03": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.456<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化）<\/a><\/span><\/div><h1>第 3 章：后端——指令选择、指令调度与寄存器分配<\/h1>\n<blockquote>对应原书第 11 章「指令选择」（PDF 第 456–484 页；印刷 441–469）、第 12 章「指令调度」（PDF 第 485–513 页；印刷 470–498）、第 13 章「寄存器分配」（PDF 第 514–545 页；印刷 499–530）。印刷页 = PDF 页 − 15。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明指令选择在 IR 与目标 ISA 之间做什么映射，区分树模式匹配与窥孔优化两条路线；\n<\/li><li>\n用重写规则对一棵表达式树做自底向上的成本标注，选出覆盖整棵树的成本最低指令序列；\n<\/li><li>\n复述表调度的主循环：就绪列表、优先级排序、每次发射一条指令，说清前向与后向调度、平局打破各解决什么问题；\n<\/li><li>\n由活动范围建立冲突图，按度数解释图着色为什么等价于寄存器分配，区分自顶向下与自底向上着色；\n<\/li><li>\n按 load/store 执行频率估算一个活动范围的溢出代价，说明为什么优先溢出代价最低的范围。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>后端把中端 IR 落到具体处理器：指令选择把 IR 结构匹配成目标机器指令序列，指令调度重排指令顺序以填满流水线停顿，寄存器分配把同时活跃的定值映射到有限的物理寄存器，装不下的范围按溢出代价降级到内存。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 后端三个决策各自面对的约束<\/h3>\n<p>指令选择：为将程序从中间表示（抽象语法树或底层线性代码）转换为可执行形式，编译器必须把每个 IR 结构映射到目标处理器指令集中一个对应且等价的结构（原书 11.1 节，PDF 第 456 页）。选择哪些指令影响编译后代码的体积与速度。<\/p>\n<p>指令调度：一组操作的执行时间严重依赖其执行顺序。调度器试图重排过程中的操作，改进运行时间；本质上，指令调度试图让每个周期执行尽可能多的操作（原书 12.1 节，PDF 第 485 页）。<\/p>\n<p>寄存器分配：处理器最受限制的资源之一是硬件寄存器集合；寄存器分配器确定哪些定值留在寄存器中、哪个寄存器容纳哪些值（原书 13.1 节，PDF 第 514 页）。分配器无法把某个值在整个生命周期都留在寄存器里时，就要在其生命周期的部分或全部时间把值存到内存。<\/p>\n<h3>2. 概念 1：树模式匹配与动态规划覆盖（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c11.md\" target=\"_blank\" rel=\"noopener\">概念 c11<\/a>。编译器把 IR 表达式平铺成抽象语法树；重写规则由产生式、成本与代码模板组成，规则匹配 AST 中的各种结点。自底向上给子树标注可用规则的成本，组合时取成本最小的覆盖方案（原书 11.4.1 节，PDF 第 466 页）。<\/p>\n<h3>3. 概念 2：表调度与局部/区域重排（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c12.md\" target=\"_blank\" rel=\"noopener\">概念 c12<\/a>。局部调度在单个基本块内重排指令；表调度维护就绪列表，指令的操作数都已可用就进入列表，按优先级排序后逐条发射。前向调度从块首往后排，后向调度从块尾往前排；区域调度跨越单个块的边界（原书 12.3、12.4 节，PDF 第 487、485 页）。<\/p>\n<h3>4. 概念 3：图着色分配与溢出代价（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。两个活动范围生命周期重叠，在冲突图中连一条边；给图着色需要的颜色数就是同时活跃范围的上限。可用寄存器数 <span class=\"katex-inline\">k<\/span> 小于图的色数时，必须把某些范围溢出：在使用前插入 load，在定值后插入 store；溢出代价按相关 load/store 的执行频率估算（原书 13.4.3、13.4.2 节，PDF 第 528、527 页）。<\/p>\n<h2>推导一（算法推演）：一棵加法树的规则覆盖与成本选择<\/h2>\n<p>表达式 <code>a + b<\/code> 在 ILOC 平铺后形成一棵小树：根是加法结点，两个叶子分别是名字 <code>a<\/code>、<code>b<\/code>。本书图 11-4 列出的重写规则含 <code>Reg → Num<\/code>（<code>loadI<\/code>，成本 1）、<code>Reg → Reg + Reg<\/code>（<code>add<\/code>，成本 1）等条目，每条规则给出产生式、成本与代码模板（原书 11.4.1 节，PDF 第 466 页）。<\/p>\n<p>第一步，自底向上标注叶子。叶子 <code>a<\/code>、<code>b<\/code> 若在寄存器中，可直接由 <code>Reg → Reg<\/code> 覆盖；若在内存，先用 load 规则载入寄存器。记叶子载入寄存器的成本为 <span class=\"katex-inline\">c_L<\/span>。<\/p>\n<p>第二步，标根结点。加法根可被 <code>Reg → Reg + Reg<\/code> 覆盖，代码模板是一条 <code>add r1, r2 → r3<\/code>，成本 1。整棵树覆盖成本 = 两个叶子载入成本之和 + 1。<\/p>\n<p>第三步，比较备选规则。若 ISA 提供带内存操作数的加法规则（对应树中一个叶子直接接内存），该规则省去一条 load；把备选覆盖方案的总成本逐项相加，取最小值。动态规划在每个子树结点记录“以该结点为根、被某条规则覆盖时的最小成本”，父结点组合子结点的最优值，避免枚举所有指令序列组合。<\/p>\n<p>第四步，回溯所选规则。从根结点选定的规则出发，向下按记录的最优子方案取叶子规则，拼出最终指令序列。覆盖必须无重复、无遗漏地盖住整棵树；漏掉一个子树，结果就缺一段计算。<\/p>\n<h2>推导二（算法推演）：建冲突图并估溢出代价<\/h2>\n<p>第一步，划分活动范围。一个定值从定义点到最后一次引用点之间的区间是一个活动范围 <span class=\"katex-inline\">LR_i<\/span>。遍历 CFG 上的定值与引用，把每个范围的起点、终点标出。<\/p>\n<p>第二步，连冲突边。若两个范围 <span class=\"katex-inline\">LR_1<\/span>、<span class=\"katex-inline\">LR_2<\/span> 在程序中某一操作期间都是活跃的，二者无法同处一个寄存器，在图 <span class=\"katex-inline\">(N, E)<\/span> 中连边 <span class=\"katex-inline\">(LR_1, LR_2)<\/span>；仅当双方活跃区间重叠才连边，生命周期不相交的范围可共用寄存器（原书 13.4.3 节，PDF 第 528 页）。<\/p>\n<p>第三步，算度数。每个结点的度数是与它冲突的范围数；度数大于等于可用寄存器数 <span class=\"katex-inline\">k<\/span> 的范围，着色时必然需要额外颜色。<\/p>\n<p>第四步，估溢出代价。一个范围若包含 load 且没有其他使用，该 load 是死代码；若包含 store 且没有其他使用，该 store 是死代码。活的 load/store 才计入溢出代价：范围溢出后，使用前要插入 load、定值后要插入 store，代价按这些 load/store 在执行路径上的出现频率加权——循环内的访问权重高，循环外的权重低（原书 13.4.2 节，PDF 第 527 页）。<\/p>\n<p>第五步，选溢出对象。着色失败时，优先把溢出代价最低的范围降级到内存：拆分它的活动范围，在必要处插入 load/store，再重新建图着色。代价估算保证被淘汰的范围对性能与代码体积影响最小。<\/p>\n<h2>反事实：后端某个条件去掉会怎样<\/h2>\n<ul><li>\n<strong>寄存器不够却不做溢出<\/strong>：分配器把超过 <span class=\"katex-inline\">k<\/span> 个同时活跃的范围硬塞进 <span class=\"katex-inline\">k<\/span> 个寄存器，后分配的范围覆盖先分配者的寄存器值；引用被覆盖的定值时读到错误数据，程序算错且故障位置远离出错指令。\n<\/li><li>\n<strong>只按静态出现次数估溢出代价<\/strong>：循环体内执行多次的 load/store 与循环外执行一次的访问被同等对待，可能把热路径上的变量溢到内存、把冷路径变量留在寄存器；按执行频率加权正是为了让溢出决策落在真正拖慢运行时的位置。\n<\/li><li>\n<strong>指令选择只做语法树自底向上遍历，不比较规则成本<\/strong>：每个结点独立选第一条匹配规则，漏掉“用一条复杂指令替代多条简单指令”的更优覆盖；代码体积与指令数都偏高。树模式动态规划的价值是在子树组合层面取最小成本。\n<\/li><li>\n<strong>不做指令调度，按 IR 原始顺序发射<\/strong>：操作数尚未就绪的指令进入流水线后停顿等待，除法、内存访问这类长延迟操作后面的空闲周期被浪费；重排把不依赖该结果的指令提前发射，填满停顿（原书 12.1 节，PDF 第 485 页）。\n<\/li><li>\n<strong>调度时不查依赖关系<\/strong>：把写某寄存器的指令排到读该寄存器的指令之前，或把分支排到条件计算之前，流水线取到的操作数还是旧值；调度只能在不改变依赖顺序的前提下重排，优先级排序不能越过真实数据依赖。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>后端的输入全部来自中端：CFG 上的活跃集合变成活动范围，喂给冲突图；三地址码与表达式树喂给指令选择；数据依赖关系来自数据流分析。第 4 章把这条链路放回全流程：过程抽象与调用约定决定哪些寄存器由调用者保存、哪些由被调用者保存，这直接影响活动范围的边界与溢出代价估算；代码形式的选择也限制了指令选择与调度能拿到的 IR 粒度。<\/p>", "ch04": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.16<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：后端——指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出）<\/a><\/span><\/div><h1>第 4 章：全流程贯通——编译概览、上下文相关分析、过程抽象与代码形式<\/h1>\n<blockquote>对应原书第 1 章「编译概观」（PDF 第 16–31 页；印刷 1–16）、第 4 章「上下文相关分析」（PDF 第 135–176 页；印刷 120–161）、第 6 章「过程抽象」（PDF 第 213–259 页；印刷 198–244）、第 7 章「代码形式」（PDF 第 260–312 页；印刷 245–297），并参照附录 A「ILOC」（PDF 第 546–554 页；印刷 531–539）。印刷页 = PDF 页 − 15。原书第 2、3、5、8–13 章已分别并入本伴侣第 1–3 章，本章只做贯通与衔接。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按顺序复述一次编译从字符流到目标代码的完整流程，标出每个阶段的输入、输出与配套算法；\n<\/li><li>\n区分语法正确与上下文合法：词法、语法通过之后，类型检查、作用域、声明一致性这类检查为什么还必须做；\n<\/li><li>\n画出属性依赖图，区分综合属性与继承属性，说明依赖图成环时为什么无法求值；\n<\/li><li>\n说清过程抽象在编译器里落实为哪些决策：形参映射、栈帧布局、返回值、调用者/被调用者保存寄存器；\n<\/li><li>\n说明代码形式（寄存器 vs 内存、值的编码方式、数组与记录布局）怎样限制中端分析与后端生成的选择空间。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>把前端分词与语法树、中端 IR 与数据流优化、后端指令与分配串起来，中间还夹着一层上下文相关分析：语法正确的程序仍可能含类型、作用域与声明错误；属性文法为这层检查提供挂接框架，过程抽象与代码形式则把语言语义落成编译器可操作的栈帧、命名空间与存储布局决策。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 编译流程的四个部分<\/h3>\n<p>本书把内容分为篇幅大致相等的四部分：第一部分（第 2–4 章）涵盖编译器前端及建立前端所用工具；第二部分（第 5–7 章）探讨从源代码到编译器中间形式的映射；第三部分（第 8–10 章）介绍代码优化；第四部分（第 11–13 章）专注编译器后端使用的算法（原书前言，PDF 第 9 页）。第 1 章从概念上概述现代编译器的所有主要组件（原书 1.1 节，PDF 第 16 页）。<\/p>\n<h3>2. 概念 1：属性文法与求值顺序（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c13.md\" target=\"_blank\" rel=\"noopener\">概念 c13<\/a>。语法正确的输入程序仍可能包含严重错误，导致编译无法完成；检测这类错误需要更深入的检查，把每条语句放到实际上下文中进行考虑。属性文法用综合属性、继承属性两类属性描述上下文信息，属性之间的依赖关系构成依赖图，图上的求值顺序由依赖关系决定（原书 4.1、4.3 节，PDF 第 135、152 页）。<\/p>\n<h3>3. 过程抽象：命名空间、形参与调用约定<\/h3>\n<p>过程是大多数现代程序设计语言底层的核心抽象之一。过程建立一个受控的执行环境，每个过程都具有自有的命名存储空间（局部变量）；过程帮助定义组件之间的接口，跨组件组合成程序后成为生成代码的基础（原书 6.1 节，PDF 第 213 页）。编译器要为源语言支持的每种抽象映射出目标处理器上的操作和数据结构：形参与实参的绑定、返回值的传递、调用者与被调用者之间哪些寄存器需要保存，都属于过程抽象的落地决策。<\/p>\n<h3>4. 代码形式：值、数据结构与存储布局<\/h3>\n<p>源代码结构到目标机器操作的转换是编译过程中的根本操作。编译前端生成 IR 时，以及后端针对真实处理器产生汇编代码时，会遇到许多问题：变量标量是存放在虚拟寄存器中，还是降级到内存；数组元素、记录字段如何布局；表达式运算结果放在哪里（原书 7.1 节，PDF 第 260 页）。这些决策在转换过程中做出，记录在 IR 的命名空间里，供后续分析与生成使用。本书各章使用的底层线性 IR 是 ILOC：一种抽象 RISC 机器的汇编代码，三地址形式，假设只有有限种数据类型、未指定具体位数（原书附录 A，PDF 第 546 页）。<\/p>\n<h2>推导一（流程推演）：一个源程序走完一次编译的各阶段<\/h2>\n<p>第一步，词法分析。字符流进入词法分析器，正则表达式与有限自动机把字符序列切成带词类的单词；非法字符在此阶段报出。<\/p>\n<p>第二步，语法分析。单词流进入 LL 或 LR 分析器，按上下文无关文法归约成语法树或产生式序列；结构不合法的句子在此阶段报出。<\/p>\n<p>第三步，上下文相关分析。沿语法树挂接属性计算：类型检查、作用域查找、声明与使用的一致性、存储类别检查；语法合法但类型不符、名字未声明之类的错误在此阶段暴露（原书第 4 章，PDF 第 135 页起）。<\/p>\n<p>第四步，翻译成 IR。语法结构与属性结果被翻译成三地址码或图 IR；线性 IR 再切成基本块、建成 CFG。<\/p>\n<p>第五步，中端优化。在 CFG 上跑数据流分析：到达定值、活跃变量、支配性；按分析结果做常量传播、死代码消除、冗余消除、代码移动；需要时把 IR 转成 SSA 形式简化分析。<\/p>\n<p>第六步，后端生成。指令选择把 IR 结构匹配成目标指令；指令调度重排顺序填流水线停顿；寄存器分配把活动范围映射到物理寄存器，溢出范围插入 load/store；最终产出可重定位目标代码。<\/p>\n<p>第七步，衔接与链接。过程抽象留下的调用约定、命名空间与外部引用，在链接阶段与其他编译单元、库代码拼合（原书第 6 章讨论的命名空间与链接，PDF 第 213 页起）。<\/p>\n<h2>推导二（推演）：属性依赖图怎样决定求值顺序<\/h2>\n<p>取一个赋值语句 <code>x = a + b<\/code> 的语法树：根是赋值结点，右孩子是加法结点，加法的两个孩子是名字 <code>a<\/code>、<code>b<\/code>。<\/p>\n<p>第一步，标综合属性。名字结点的类型由符号表查得；加法结点的类型由两个操作数类型推出；赋值结点检查左右类型是否兼容。这类由结点本身与子结点算出的属性是综合属性，求值方向自底向上。<\/p>\n<p>第二步，标继承属性。若外层语句把期望类型传给表达式结点，表达式再传给子表达式，这类由父结点、兄弟结点传来的属性是继承属性，求值方向自顶向下。<\/p>\n<p>第三步，建依赖图。每个属性是一个结点；属性 A 的计算用到属性 B，就画一条从 B 到 A 的边。求值必须沿边的方向进行：被依赖的属性先算，依赖方后算。<\/p>\n<p>第四步，检查成环。若某条规则定义的属性依赖于自身，或依赖图中出现回路，不存在任何顺序能把所有属性算出；此时属性文法对该输入无法求值，需要改写规则或换用循环求值方式（原书 4.3 节，PDF 第 152 页）。<\/p>\n<h2>反事实：贯通链路里某一层缺失会怎样<\/h2>\n<ul><li>\n<strong>跳过上下文相关分析直接出 IR<\/strong>：类型不符的运算、未声明的名字、作用域错误被带到中端与后端，错误在生成代码后才以崩溃或错误结果形式暴露，定位要回溯多个编译阶段；这层检查把语义错误拦在结构分析之后、代码生成之前。\n<\/li><li>\n<strong>属性依赖图允许成环还硬求值<\/strong>：属性互相等待对方先算，程序顺序上不存在合法求值次序；强行按某个固定顺序算，用到的属性还是未定义值。综合/继承属性的规则设计必须保证依赖图无环。\n<\/li><li>\n<strong>过程调用约定不统一<\/strong>：形参、返回值、保存寄存器在调用者与被调用者之间各执一套约定，跨过程调用后寄存器值被覆盖、返回值取错位置；调用约定是编译器与库代码、其他编译单元之间的接口契约。\n<\/li><li>\n<strong>代码形式决策推迟到指令选择阶段<\/strong>：前端生成 IR 时不记录值放在寄存器还是内存、数组如何布局，后端面对同一个 IR 结构要反复猜测存储方式；布局信息提前记录在 IR 命名空间里，后续各阶段才能直接取用（原书 7.1 节，PDF 第 260 页）。\n<\/li><li>\n<strong>把局部语言规则当成全局规则套用<\/strong>：单个过程内成立的命名规则，遇到外部链接、全局命名空间就失效；过程抽象与链接约定正是为了界定每个抽象的作用域边界。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章是前三章的回环：第 1 章前端的单词流与语法树，是属性挂接的骨架；第 2 章中端的 IR 与数据流，是上下文检查结果落地的载体；第 3 章后端的指令与分配，受代码形式与调用约定约束。读完这条链路，再回看任何一个编译教材中的具体算法，都能先定位它处于流程的哪一段、输入输出是什么、失效时故障会在哪一层暴露。<\/p>", "c01": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.48<\/div><h1>正则表达式到 NFA：Thompson 构造法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章（原书第 2 章 2.4.2 节，PDF 第 48 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>词法分析器把字符流变换为单词流，每个单词归入一个语法范畴。单词种类少时手写试探程序可行；关键字、标识符、常数、运算符增多后，规则的拼接、选择与重复关系难以用过程代码清晰表达。需要一种形式化记号先把单词集合写下来，再由确定的机械步骤转成识别器。正则表达式（RE）承担记号角色，Thompson 构造承担“记号→自动机”的第一步转换。没有这一步，词法规则与识别代码绑在一起，改一个关键字就要重写扫描逻辑。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>RE 的基本元素<\/strong>：字母表 <span class=\"katex-inline\">\\Sigma<\/span> 中的单个字符是基本 RE；空串 <span class=\"katex-inline\">\\varepsilon<\/span> 是 RE；用连接、并（<code>|<\/code>）、闭包（<code>*<\/code>）组合已有 RE；括号改变优先级（原书 2.3 节，PDF 第 45 页起）。<\/p>\n<p><strong>NFA（非确定有限自动机）<\/strong>：五元组，含状态集合 <span class=\"katex-inline\">Q<\/span>、字母表 <span class=\"katex-inline\">\\Sigma<\/span>、转移函数 <span class=\"katex-inline\">\\delta<\/span>、起始状态 <span class=\"katex-inline\">q_0<\/span>、接受状态集合 <span class=\"katex-inline\">F<\/span>。非确定性体现在：同一状态对同一字符可有多条转移；允许不读字符的 <span class=\"katex-inline\">\\varepsilon<\/span> 转移。<\/p>\n<p><strong>Thompson 构造五条规则<\/strong>（原书 2.4.2 节，PDF 第 48 页，图 2-4）：<\/p>\n<ol><li>\n单字符 <code>a<\/code>：新状态 <span class=\"katex-inline\">s<\/span> 到新状态 <span class=\"katex-inline\">f<\/span> 一条标记 <code>a<\/code> 的转移。\n<\/li><li>\n连接 <code>AB<\/code>：<code>A<\/code> 的接受用 <span class=\"katex-inline\">\\varepsilon<\/span> 接到 <code>B<\/code> 起始；整体起始取 <code>A<\/code>，接受取 <code>B<\/code>。\n<\/li><li>\n并 <code>A|B<\/code>：新增起始，两条 <span class=\"katex-inline\">\\varepsilon<\/span> 指向 <code>A<\/code>、<code>B<\/code> 起始；新增接受，两侧接受各用 <span class=\"katex-inline\">\\varepsilon<\/span> 指向它。\n<\/li><li>\n闭包 <code>A*<\/code>：新增起始与接受；起始经 <span class=\"katex-inline\">\\varepsilon<\/span> 到 <code>A<\/code> 起始或直接到接受；<code>A<\/code> 接受经 <span class=\"katex-inline\">\\varepsilon<\/span> 回 <code>A<\/code> 起始或到接受。\n<\/li><li>\n括号只规定边界，不产生新结构。\n<\/ol>\n<p>构造不变量：每个小 NFA 至多一个起始、一个接受；闭包是唯一让接受接回起始的规则。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<p>对 <span class=\"katex-inline\">a(b|c)*<\/span> 逐子表达式构造：<\/p>\n<p>第一步，单字符 <code>a<\/code>：<span class=\"katex-inline\">s_0 \\xrightarrow{a} f_0<\/span>。<\/p>\n<p>第二步，并 <code>b|c<\/code>：各造单字符 NFA，<span class=\"katex-inline\">s_b \\xrightarrow{b} f_b<\/span>，<span class=\"katex-inline\">s_c \\xrightarrow{c} f_c<\/span>；新增 <span class=\"katex-inline\">s_u<\/span>、<span class=\"katex-inline\">f_u<\/span>，<span class=\"katex-inline\">\\varepsilon<\/span> 边 <span class=\"katex-inline\">s_u \\to s_b<\/span>、<span class=\"katex-inline\">s_u \\to s_c<\/span>、<span class=\"katex-inline\">f_b \\to f_u<\/span>、<span class=\"katex-inline\">f_c \\to f_u<\/span>。<\/p>\n<p>第三步，闭包 <span class=\"katex-inline\">(b|c)<em><\/span>：新增 <span class=\"katex-inline\">s_<\/em><\/span>、<span class=\"katex-inline\">f_<em><\/span>；<span class=\"katex-inline\">s_<\/em> \\xrightarrow{\\varepsilon} s_u<\/span>，<span class=\"katex-inline\">s_<em> \\xrightarrow{\\varepsilon} f_<\/em><\/span>（零次重复）；<span class=\"katex-inline\">f_u \\xrightarrow{\\varepsilon} s_u<\/span>（重复），<span class=\"katex-inline\">f_u \\xrightarrow{\\varepsilon} f_*<\/span>（退出）。<\/p>\n<p>第四步，连接：<span class=\"katex-inline\">f_0<\/span> 用 <span class=\"katex-inline\">\\varepsilon<\/span> 接到 <span class=\"katex-inline\">s_<em><\/span>；整体起始 <span class=\"katex-inline\">s_0<\/span>，整体接受 <span class=\"katex-inline\">f_<\/em><\/span>。<\/p>\n<p>第五步，核对语言：读一个 <code>a<\/code> 后可在闭包走零次或任意次 <code>b<\/code>/<code>c<\/code>，最后到 <span class=\"katex-inline\">f_*<\/span>；识别的正是以 <code>a<\/code> 开头、后跟若干 <code>b<\/code> 或 <code>c<\/code> 的单词。构造顺序与运算符优先级一致：先括号内层，再闭包，再连接，最后并（原书 2.4.3 节旁注，PDF 第 49 页）。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：单词规则属于正则语言，能用有限次连接、并、闭包描述，且每个子表达式都能切到单字符层。\n<\/li><li>\n<strong>边界 1<\/strong>：NFA 不能直接高效驱动识别。它带 <span class=\"katex-inline\">\\varepsilon<\/span> 边与分叉，执行时要同时维护可能的状态路径集合；这是子集构造要解决的问题（见 c02）。\n<\/li><li>\n<strong>边界 2<\/strong>：RE 表达不了嵌套配对。括号必须成对且嵌套合法的串需要计数或栈，超出正则语言能力，交给语法分析层的上下文无关文法。\n<\/li><li>\n<strong>失败案例：规则歧义<\/strong>。两个 RE 识别的单词有公共前缀时，最长匹配与优先级要在词法规范里另行规定；Thompson 构造只保证每个 RE 对应一个 NFA，不解决两个单词谁先选中。\n<\/li><li>\n<strong>失败案例：构造顺序错<\/strong>。先拼外层并再拼内层闭包，拼接点错位，最终自动机接受的串与原 RE 不一致；构造是递归下降过程，子表达式必须先完成再并入父结构。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>RE 与上下文无关文法<\/strong>：RE 只描述单词内部字符序列，无递归嵌套能力；文法描述单词之间的结构关系。词法层用 RE，语法层用文法。\n<\/li><li>\n<strong>Thompson NFA 与手工 NFA<\/strong>：手工 NFA 可能共享状态；Thompson 产物结构规整，子表达式对应独立状态片段，便于自动生成，代价是状态数偏多。\n<\/li><li>\n<strong>NFA 与 DFA<\/strong>：NFA 允许同字符多转移与 <span class=\"katex-inline\">\\varepsilon<\/span> 边，构造快、状态少；DFA 每个状态对每个字符至多一条转移，运行无需回溯。二者识别能力等价，转换由子集构造完成。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无，是前端最底层的自动机起点。后继：c02 把本节 NFA 经子集构造转成 DFA 并最小化；c03、c04 的文法分析以本节切出的单词流为输入。状态图在词法规范定稿后通常不再改动，编译器开发者调的是 RE 层规则。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（正则表达式到 NFA：Thompson 构造法）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：Thompson 构造的依赖链、状态拼接与完整算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把一个正则表达式变成可执行的词法识别器，先往回追四层前提：<\/p>\n<ol><li>\n词法分析面对的输入是字符流，规则要能描述“哪些字符序列属于哪一类单词”。若规则直接写成过程代码，规则与代码互相缠绕，扩展关键字或常数格式时要在试探循环里改分支；因此先需要一种与执行方式无关的形式化记号，这就是正则表达式。\n<\/li><li>\n记号只是书写层，机器不会直接解释 RE。需要一个机械、可重复的转换步骤，把每个 RE 结构映射成一个状态转移装置。装置必须接受与 RE 完全相同的字符集合，不能凭设计者临场发挥。\n<\/li><li>\n转换第一站选 NFA 而不是 DFA，是因为 NFA 的两条特性正好匹配 RE 的两种结构：分叉转移对应并运算符，<span class=\"katex-inline\">\\varepsilon<\/span> 转移对应连接与闭包的拼接点。若第一步就构造 DFA，子集枚举在构造期就要做，规则组合稍复杂就难以手工跟踪。\n<\/li><li>\n构造过程必须满足结构不变量：每个子表达式生成的小自动机只有一个入口、一个出口。只有入口出口固定，父结构才能按连接、并、闭包三种方式拼接；若子自动机有多个入口，拼接点无法唯一定位。\n<\/ol>\n<p>依赖链方向：字符流分类需求 → RE 记号 → NFA 装置 → 固定入口出口的小自动机片段 → 五条拼接规则 → 完整 NFA。<\/p>\n<h2>正向演算：五条规则的逐步执行<\/h2>\n<h3>规则 1：单字符<\/h3>\n<p>输入 RE 为字符 <span class=\"katex-inline\">a \\in \\Sigma<\/span>。新建起始 <span class=\"katex-inline\">s<\/span>、接受 <span class=\"katex-inline\">f<\/span>；转移 <span class=\"katex-inline\">\\delta(s, a) = \\{f\\}<\/span>。小自动机没有 <span class=\"katex-inline\">\\varepsilon<\/span> 边，也没有其他出边，识别语言为 <span class=\"katex-inline\">\\{a\\}<\/span>。<\/p>\n<h3>规则 2：连接 <code>AB<\/code><\/h3>\n<p>设已构造 <span class=\"katex-inline\">N_A<\/span>（起始 <span class=\"katex-inline\">s_A<\/span>、接受 <span class=\"katex-inline\">f_A<\/span>）与 <span class=\"katex-inline\">N_B<\/span>（起始 <span class=\"katex-inline\">s_B<\/span>、接受 <span class=\"katex-inline\">f_B<\/span>）。新增 <span class=\"katex-inline\">\\varepsilon<\/span> 转移 <span class=\"katex-inline\">f_A \\to s_B<\/span>。整体起始 <span class=\"katex-inline\">s_A<\/span>，整体接受 <span class=\"katex-inline\">f_B<\/span>。执行时先在 <span class=\"katex-inline\">N_A<\/span> 走完，经 <span class=\"katex-inline\">\\varepsilon<\/span> 边进入 <span class=\"katex-inline\">N_B<\/span>，<span class=\"katex-inline\">\\varepsilon<\/span> 边不消耗输入字符。<\/p>\n<h3>规则 3：并 <code>A|B<\/code><\/h3>\n<p>新增起始 <span class=\"katex-inline\">s_u<\/span> 与接受 <span class=\"katex-inline\">f_u<\/span>。四条 <span class=\"katex-inline\">\\varepsilon<\/span> 边：<span class=\"katex-inline\">s_u \\to s_A<\/span>、<span class=\"katex-inline\">s_u \\to s_B<\/span>、<span class=\"katex-inline\">f_A \\to f_u<\/span>、<span class=\"katex-inline\">f_B \\to f_u<\/span>。分支选择发生在 <span class=\"katex-inline\">s_u<\/span>：读下一个字符之前，自动机可以走 <span class=\"katex-inline\">A<\/span> 路或 <span class=\"katex-inline\">B<\/span> 路；两路在 <span class=\"katex-inline\">f_u<\/span> 汇合。<\/p>\n<h3>规则 4：闭包 <code>A*<\/code><\/h3>\n<p>新增起始 <span class=\"katex-inline\">s_<em><\/span> 与接受 <span class=\"katex-inline\">f_<\/em><\/span>。四条 <span class=\"katex-inline\">\\varepsilon<\/span> 边：<span class=\"katex-inline\">s_<em> \\to s_A<\/span>（进入重复），<span class=\"katex-inline\">s_<\/em> \\to f_<em><\/span>（零次重复，直接退出），<span class=\"katex-inline\">f_A \\to s_A<\/span>（至少再重复一次），<span class=\"katex-inline\">f_A \\to f_<\/em><\/span>（退出重复）。<span class=\"katex-inline\">f_A \\to s_A<\/span> 是闭包独有的回边，也是整个构造中唯一从接受侧接回起始侧的转移。<\/p>\n<h3>规则 5：括号<\/h3>\n<p>括号不产生状态与边，只规定子表达式边界；构造时先对最内层 RE 执行规则 1–4，结果再并入外层。<\/p>\n<h3>组合顺序与不变量校验<\/h3>\n<p>按运算符优先级从内向外：先单字符，再闭包，再连接，最后并。每完成一个子表达式，记录它的起始与接受两个状态供父规则取用。构造结束后，整体 NFA 的起始是最外层 RE 的起始，接受是最外层 RE 的接受。每一步拼接前后，小自动机都保持单入口单出口，父规则才能确定往哪里接。<\/p>\n<h2>具体算例：<code>(a|b)*abb<\/code> 的 NFA 状态表<\/h2>\n<p>这是教材用于展示闭包与并组合的典型形式（参照原书图 2-5，PDF 第 49 页），字母表 <span class=\"katex-inline\">\\Sigma = \\{a, b\\}<\/span>。<\/p>\n<p>第一步，造 <code>a<\/code> 与 <code>b<\/code>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">N_a<\/span>：<span class=\"katex-inline\">s_a \\xrightarrow{a} f_a<\/span>\n<\/li><li>\n<span class=\"katex-inline\">N_b<\/span>：<span class=\"katex-inline\">s_b \\xrightarrow{b} f_b<\/span>\n<\/ul>\n<p>第二步，并 <code>a|b<\/code>：新增 <span class=\"katex-inline\">s_u<\/span>、<span class=\"katex-inline\">f_u<\/span>；边 <span class=\"katex-inline\">s_u \\xrightarrow{\\varepsilon} s_a<\/span>，<span class=\"katex-inline\">s_u \\xrightarrow{\\varepsilon} s_b<\/span>，<span class=\"katex-inline\">f_a \\xrightarrow{\\varepsilon} f_u<\/span>，<span class=\"katex-inline\">f_b \\xrightarrow{\\varepsilon} f_u<\/span>。<\/p>\n<p>第三步，闭包 <code>(a|b)<em><\/code>：新增 <span class=\"katex-inline\">s_<\/em><\/span>、<span class=\"katex-inline\">f_<em><\/span>；边 <span class=\"katex-inline\">s_<\/em> \\xrightarrow{\\varepsilon} s_u<\/span>，<span class=\"katex-inline\">s_<em> \\xrightarrow{\\varepsilon} f_<\/em><\/span>，<span class=\"katex-inline\">f_u \\xrightarrow{\\varepsilon} s_u<\/span>，<span class=\"katex-inline\">f_u \\xrightarrow{\\varepsilon} f_*<\/span>。<\/p>\n<p>第四步，连接后缀 <code>abb<\/code>：再造三个单字符小 NFA，依次用 <span class=\"katex-inline\">\\varepsilon<\/span> 边把闭包接受接到第一个 <code>a<\/code> 的起始，第一个 <code>a<\/code> 的接受接到第二个 <code>b<\/code> 的起始，第二个 <code>b<\/code> 的接受接到第三个 <code>b<\/code> 的起始。整体接受是最后一个 <code>b<\/code> 的接受状态。<\/p>\n<p>第五步，读串验证。串 <code>abb<\/code>：从 <span class=\"katex-inline\">s_<em><\/span> 经 <span class=\"katex-inline\">f_<\/em><\/span> 退出零次闭包，再依次读 <code>a<\/code>、<code>b<\/code>、<code>b<\/code> 到达接受。串 <code>bababb<\/code>：闭包内先走 <code>b<\/code>，再走 <code>a<\/code>，退出闭包后读 <code>abb<\/code>。串 <code>aba<\/code>：最后读到 <code>a<\/code> 时后缀第三个位置应为 <code>b<\/code>，无对应转移，拒绝。<\/p>\n<h2>第二算例：特殊 RE 的构造处理<\/h2>\n<ul><li>\n<strong><span class=\"katex-inline\">\\varepsilon<\/span><\/strong>：只含空串的 RE，构造为一条 <span class=\"katex-inline\">s \\xrightarrow{\\varepsilon} f<\/span>，不读任何字符即到接受。\n<\/li><li>\n<strong>空语言<\/strong>：没有串可接受的 RE，构造一个只有起始状态、无接受状态的小自动机，不产生任何出口转移。\n<\/li><li>\n**重复 <code>A+<\/code>（等价于 <span class=\"katex-inline\">AA*<\/span>）**：本书以基础运算符表达，需要时按连接与闭包组合，不额外新增规则。\n<\/ul>\n<h2>延伸推演：状态数与 <span class=\"katex-inline\">\\varepsilon<\/span> 边的后期角色<\/h2>\n<p>按规则计数，一个含 <span class=\"katex-inline\">n<\/span> 个字符与 <span class=\"katex-inline\">n-1<\/span> 个运算符的 RE，构造出的状态数随子表达式数量线性增长：每个单字符贡献两个状态，并与闭包各新增两个状态。与手工直接设计的 NFA 相比，Thompson 产物多出的状态主要来自每个子表达式独立的入口出口，这些冗余在后续 DFA 最小化阶段才被合并。<\/p>\n<p><span class=\"katex-inline\">\\varepsilon<\/span> 边分两类：拼接边（连接、并的汇合点）与回边（闭包重复）。构造阶段保留它们，是为了让每条规则对应清晰的结构片段；
