>\n两个集合在编译期对文法整体算出，固化进分析表；运行期分析器只做查表，不再做文法层面的试探。表中同一格出现两个动作，说明现有前瞻长度不足以分开候选，冲突必须在文法层或分析方法层解决。\n<\/ol>\n<p>依赖链方向：无回溯选择需求 → 串首信息 FIRST → 后随信息 FOLLOW → 静态填表 → 单前瞻可判定性检验。<\/p>\n<h2>正向演算：集合计算与填表规则<\/h2>\n<h3>FIRST 计算规则<\/h3>\n<ul><li>\n终结符 <span class=\"katex-inline\">t<\/span>：<span class=\"katex-inline\">\\text{FIRST}(t) = \\{t\\}<\/span>。\n<\/li><li>\n产生式 <span class=\"katex-inline\">A \\to B_1 B_2 \\dots B_k<\/span>：从 <span class=\"katex-inline\">B_1<\/span> 起逐个考察；<span class=\"katex-inline\">B_i<\/span> 的 FIRST 中去掉 <span class=\"katex-inline\">\\varepsilon<\/span> 的部分并入 FIRST(A)；只有当 <span class=\"katex-inline\">B_i<\/span> 能推 <span class=\"katex-inline\">\\varepsilon<\/span>，才继续考察 <span class=\"katex-inline\">B_{i+1}<\/span>；全部 <span class=\"katex-inline\">B_i<\/span> 都能推 <span class=\"katex-inline\">\\varepsilon<\/span>，把 <span class=\"katex-inline\">\\varepsilon<\/span> 并入 FIRST(A)。\n<\/li><li>\n非终结符集合反复迭代，直到不再增长。\n<\/ul>\n<h3>FOLLOW 计算规则<\/h3>\n<ul><li>\n开始符 FOLLOW 先置 <code>$<\/code>。\n<\/li><li>\n<span class=\"katex-inline\">A \\to \\alpha B \\beta<\/span>：<span class=\"katex-inline\">\\text{FIRST}(\\beta) - \\{\\varepsilon\\}<\/span> 并入 FOLLOW(B)；<span class=\"katex-inline\">\\beta \\Rightarrow^* \\varepsilon<\/span> 时，FOLLOW(A) 并入 FOLLOW(B)。\n<\/li><li>\n<span class=\"katex-inline\">A \\to \\alpha B<\/span>：FOLLOW(A) 并入 FOLLOW(B)。\n<\/li><li>\n迭代到稳定。\n<\/ul>\n<h3>填表规则<\/h3>\n<p>产生式 <span class=\"katex-inline\">A \\to \\alpha<\/span>：<span class=\"katex-inline\">\\text{FIRST}(\\alpha)<\/span> 中每个 <span class=\"katex-inline\">t<\/span> 对应表格 <span class=\"katex-inline\">[A, t]<\/span>；<span class=\"katex-inline\">\\alpha \\Rightarrow^* \\varepsilon<\/span> 时，FOLLOW(A) 中每个 <span class=\"katex-inline\">t<\/span> 也对应表格 <span class=\"katex-inline\">[A, t]<\/span>。一格已有不同产生式即为冲突。<\/p>\n<h2>具体算例：表达式文法的完整集合与分析表<\/h2>\n<p>文法：<\/p>\n<pre><code>E  → T E&#x27;\nE&#x27; → + T E&#x27; | ε\nT  → F T&#x27;\nT&#x27; → * F T&#x27; | ε\nF  → ( E ) | id<\/code><\/pre>\n<h3>第一步，算 FIRST<\/h3>\n<ul><li>\n<span class=\"katex-inline\">\\text{FIRST}(F) = \\{(\\, , \\text{id}\\}<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">\\text{FIRST}(T) = \\text{FIRST}(F) = \\{(\\, , \\text{id}\\}<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">\\text{FIRST}(T&#x27;) = \\{*, \\varepsilon\\}<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">\\text{FIRST}(E) = \\text{FIRST}(T) = \\{(\\, , \\text{id}\\}<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">\\text{FIRST}(E&#x27;) = \\{+, \\varepsilon\\}<\/span>。\n<\/ul>\n<h3>第二步，算 FOLLOW<\/h3>\n<ul><li>\nFOLLOW(E)：E 是开始符先放 <code><span class=\"katex-inline\"><\/code>；又出现在 <code>( E )<\/code> 中，后面跟 <code>)<\/code>，故 FOLLOW(E) = {<code>,<\/code>, <code><\/span><\/code>}。\n<\/li><li>\nFOLLOW(E&#x27;)：产生式 <span class=\"katex-inline\">E \\to T E&#x27;<\/span> 尾部是 <span class=\"katex-inline\">E&#x27;<\/span>，FOLLOW(E) 并入；FOLLOW(E&#x27;) = {<code>,<\/code>, <code>$<\/code>}。\n<\/li><li>\nFOLLOW(T)：<span class=\"katex-inline\">E&#x27; \\to + T E&#x27;<\/span> 中 <span class=\"katex-inline\">T<\/span> 后面是 <span class=\"katex-inline\">E&#x27;<\/span>，<span class=\"katex-inline\">\\text{FIRST}(E&#x27;) - \\{\\varepsilon\\} = \\{+\\}<\/span> 并入；<span class=\"katex-inline\">E&#x27;<\/span> 能推 <span class=\"katex-inline\">\\varepsilon<\/span>，FOLLOW(E&#x27;) 并入；FOLLOW(T) = {+, <code>)<\/code>, <code>$<\/code>}。\n<\/li><li>\nFOLLOW(T&#x27;)：产生式 <span class=\"katex-inline\">T \\to F T&#x27;<\/span> 尾部是 <span class=\"katex-inline\">T&#x27;<\/span>，FOLLOW(T) 并入；FOLLOW(T&#x27;) = {+, <code>)<\/code>, <code>$<\/code>}。\n<\/li><li>\nFOLLOW(F)：<span class=\"katex-inline\">T&#x27; \\to <em> F T&#x27;<\/span> 中 <span class=\"katex-inline\">F<\/span> 后面是 <span class=\"katex-inline\">T&#x27;<\/span>，<span class=\"katex-inline\">\\text{FIRST}(T&#x27;) - \\{\\varepsilon\\} = \\{<\/em>\\}<\/span> 并入；<span class=\"katex-inline\">T&#x27;<\/span> 能推 <span class=\"katex-inline\">\\varepsilon<\/span>，FOLLOW(T&#x27;) 并入；FOLLOW(F) = {*, +, <code>)<\/code>, <code>$<\/code>}。\n<\/ul>\n<h3>第三步，填表（节选）<\/h3>\n<ul><li>\n<span class=\"katex-inline\">E \\to T E&#x27;<\/span>：列 <code>(<\/code>、id。\n<\/li><li>\n<span class=\"katex-inline\">E&#x27; \\to + T E&#x27;<\/span>：列 <code>+<\/code>；<span class=\"katex-inline\">E&#x27; \\to \\varepsilon<\/span>：列 <code>)<\/code>、<code>$<\/code>。\n<\/li><li>\n<span class=\"katex-inline\">T \\to F T&#x27;<\/span>：列 <code>(<\/code>、id。\n<\/li><li>\n<span class=\"katex-inline\">T&#x27; \\to <em> F T&#x27;<\/span>：列 <code><\/em><\/code>；<span class=\"katex-inline\">T&#x27; \\to \\varepsilon<\/span>：列 <code>+<\/code>、<code>)<\/code>、<code>$<\/code>。\n<\/li><li>\n<span class=\"katex-inline\">F \\to ( E )<\/span>：列 <code>(<\/code>；<span class=\"katex-inline\">F \\to \\text{id}<\/span>：列 id。\n<\/ul>\n<p>每个表格只落一条产生式，该文法是 LL(1) 文法。<\/p>\n<h2>第二算例：左递归导致的冲突<\/h2>\n<p>文法：<\/p>\n<pre><code>List → List Pair\nList → Pair\nPair → &#x27;(&#x27; Pair &#x27;)&#x27; | &#x27;(&#x27; &#x27;)&#x27;<\/code><\/pre>\n<p>第一步，FIRST(Pair) = {<code>(<\/code>}；FIRST(List) 经 <code>List → Pair<\/code> 也为 {<code>(<\/code>}。<\/p>\n<p>第二步，看 <span class=\"katex-inline\">List<\/span> 的两条候选：<code>List → List Pair<\/code> 的右部以 <span class=\"katex-inline\">List<\/span> 开头，FIRST 为 {<code>(<\/code>}；<code>List → Pair<\/code> 的 FIRST 也是 {<code>(<\/code>}。表格 <span class=\"katex-inline\">[List, (`]<\/span> 同时落进两条产生式，冲突。<\/p>\n<p>第三步，定性：候选 <code>List → List Pair<\/code> 是直接左递归。自顶向下展开 <span class=\"katex-inline\">List<\/span>，选第一条后句型最左仍是 <span class=\"katex-inline\">List<\/span>，还没读入任何单词就回到原处，推导循环；两条候选在 <code>(<\/code> 列重叠，单前瞻无法分开。先消除左递归：把递归候选改写成 <span class=\"katex-inline\">List \\to Pair\\, List&#x27;<\/span>，<span class=\"katex-inline\">List&#x27; \\to Pair\\, List&#x27; \\mid \\varepsilon<\/span>，再重算 FIRST/FOLLOW。<\/p>\n<h2>延伸推演：左公因子与前瞻长度<\/h2>\n<p>另一类冲突来自左公因子：<span class=\"katex-inline\">A \\to t\\alpha \\mid t\\beta<\/span>，两候选同以 <span class=\"katex-inline\">t<\/span> 开头。提取公因子为 <span class=\"katex-inline\">A \\to t A&#x27;<\/span>，<span class=\"katex-inline\">A&#x27; \\to \\alpha \\mid \\beta<\/span>，FIRST 才能分开。若改写后两个候选仍需看第二个单词才能区分，单前瞻 LL(1) 表必然撞列；此时要么改用 LL(k) 增加前瞻，要么换 LR 分析器在归约阶段积累更多信息再决策。<\/p>\n<h2>对抗性追问：ε 候选漏挂 FOLLOW 会怎样<\/h2>\n<p>若填表时只按 FIRST 挂列，把 <span class=\"katex-inline\">E&#x27; \\to \\varepsilon<\/span> 漏掉 FOLLOW(E&#x27;) 列，输入串在 <code>)<\/code> 或 <code><span class=\"katex-inline\"><\/code> 处要求 <\/span>E&#x27;<span class=\"katex-inline\"> 归约为空，分析表对应格为空，分析器报语法错误；实际文法是合法的。<\/span>\\varepsilon$ 候选的预测列来自 FOLLOW 而非 FIRST，这是两类集合分工最容易出错的位置。<\/p>\n<p>再追一层：FOLLOW 传递若漏掉“<span class=\"katex-inline\">\\beta<\/span> 能推 <span class=\"katex-inline\">\\varepsilon<\/span>”这一支，尾部非终结符拿不到父结点的 FOLLOW，后随单词集合偏小，同样会漏列。<\/p>\n<h2>第三算例：左公因子的提取过程<\/h2>\n<p>文法：<\/p>\n<pre><code>A → t α\nA → t β<\/code><\/pre>\n<p>两候选同以 <span class=\"katex-inline\">t<\/span> 开头，FIRST 都是 <span class=\"katex-inline\">\\{t\\}<\/span>，表格 <span class=\"katex-inline\">[A, t]<\/span> 撞列。提取公因子：<\/p>\n<pre><code>A → t A&#x27;\nA&#x27; → α\nA&#x27; → β<\/code><\/pre>\n<p>重算 FIRST：<span class=\"katex-inline\">\\text{FIRST}(A) = \\{t\\}<\/span>；<span class=\"katex-inline\">\\text{FIRST}(A&#x27;) = \\text{FIRST}(\\alpha) \\cup \\text{FIRST}(\\beta)<\/span>。两个候选首符分开，LL(1) 表可填。若 <span class=\"katex-inline\">\\alpha<\/span>、<span class=\"katex-inline\">\\beta<\/span> 首符仍重叠，说明单前瞻不足以分开，需增加前瞻长度或换 LR 分析。<\/p>\n<h2>延伸推演：FIRST 迭代计算的收敛<\/h2>\n<p>FIRST 集合随非终结符依赖反复更新：终结符 FIRST 已定；含非终结符的产生式，等非终结符 FIRST 稳定后再并入。若产生式右部多个符号都能推 ε，要连续跳过它们取后面符号的 FIRST；全部可推 ε 才把 ε 记入。集合只增不减，有限个终结符保证迭代停止。<\/p>\n<p>LL(1) 是 LL(k) 取 <span class=\"katex-inline\">k=1<\/span> 的特例。文法需要看第二个单词才能选候选时，单前瞻表必然冲突；改写文法能消冲突则改写，不能改写则自底向上 LR 分析在归约阶段积累信息，覆盖面更大。递归下降过程与表驱动 LL(1) 共用同一套 FIRST/FOLLOW 预测依据，差别只在选择动作写在代码分支还是分析表里（原书图 3-10，PDF 第 98 页）。<\/p>\n<h2>对抗性追问：FOLLOW 链传递漏一支会怎样<\/h2>\n<p>产生式 <span class=\"katex-inline\">A \\to \\alpha B<\/span> 中，FOLLOW(A) 必须传给 FOLLOW(B)；漏掉这支尾部传递，<span class=\"katex-inline\">B<\/span> 的后随单词集合偏小，<span class=\"katex-inline\">\\varepsilon<\/span> 候选在相关列留空，合法输入被判语法错误。产生式 <span class=\"katex-inline\">A \\to \\alpha B \\beta<\/span> 中，<span class=\"katex-inline\">\\beta<\/span> 能推 ε 时也要传 FOLLOW(A)；只取 FIRST(β) 不传父结点 FOLLOW，同样漏列。<\/p>\n<p>再追一层：候选可推 ε 时若按 FIRST 挂列而非 FOLLOW，该候选只在 ε 本身出现时被选中，后随单词列全部空缺；ε 候选的预测列来自 FOLLOW，这是两类集合分工最容易错位的地方。<\/p>\n<h2>延伸推演：表驱动 LL(1) 的主循环<\/h2>\n<p>分析表生成后，运行期分析器主循环：栈顶放待展开非终结符，当前单词是前瞻；查表格 <span class=\"katex-inline\">[栈顶, 前瞻]<\/span>，命中产生式则弹出栈顶、把产生式右部逆序压栈；命中 ε 产生式只弹出栈顶；命中接受则结束；表格留空报语法错误。FIRST/FOLLOW 在编译期算完，运行期只做查表与栈操作，不做文法试探。<\/p>\n<p>递归下降为每个非终结符写一个过程，过程内按 FIRST 集合分支；表驱动把分支选择抽成分析表，主循环统一执行。两者预测依据相同，差别在选择动作落在代码分支还是表格。文法改写消除左递归、提取左公因子之后，两个实现都能使用同一张预测表。<\/p>\n<h2>对抗性追问：左公因子不提取的表现<\/h2>\n<p><span class=\"katex-inline\">A \\to t\\alpha \\mid t\\beta<\/span> 不提取公因子，两候选 FIRST 同为 <span class=\"katex-inline\">\\{t\\}<\/span>，分析表 <span class=\"katex-inline\">[A, t]<\/span> 撞列。递归下降实现里，过程面对 <code>t<\/code> 无法判断走哪个分支，只能先试一条、失败回溯；表驱动实现里同一格两条产生式，无回溯选择不可行。提取公因子为 <span class=\"katex-inline\">A \\to tA&#x27;<\/span>、<span class=\"katex-inline\">A&#x27; \\to \\alpha \\mid \\beta<\/span> 后，首符分开，预测列不再重叠。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nFIRST(A) 中 <span class=\"katex-inline\">\\varepsilon<\/span> 什么时候出现？\n<\/li><li>\nFOLLOW(A) 里的 <code>$<\/code> 代表什么，初始属于哪个非终结符？\n<\/li><li>\n含 <span class=\"katex-inline\">\\varepsilon<\/span> 的候选产生式按哪个集合挂分析表列？\n<\/li><li>\n直接左递归为什么会让自顶向下推导循环？\n<\/li><li>\n分析表同一格出现两条产生式，从文法层面有哪些处理方向？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "LL(1) 分析：FIRST/FOLLOW 集合与冲突成因"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.109<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">LL(1) 分析：FIRST/FOLLOW 集合与冲突成因<\/a><\/span><\/div><h1>LR 项目集、Action/Goto 表与移进-归约冲突<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 1 章（原书第 3 章 3.4.1、3.4.2 节，PDF 第 104、109 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>LL 分析凭前瞻预测产生式，遇到左递归、左公因子或需要更长前瞻的文法就冲突。自底向上的 LR 分析换了一个方向：把输入单词逐个移进分析栈，栈顶形成句柄时归约到对应产生式，直到栈中只剩开始符、输入结束。LR 分析在移进过程中累积已识别信息，决策推迟到归约时刻，能覆盖 LL 无法接受的一类文法。它的关键数据结构是 Action 表与 Goto 表；表由项目集规范族填出，同一格出现两个动作就是冲突。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>LR(1) 项<\/strong>：写成 <span class=\"katex-inline\">[A \\to \\alpha \\cdot \\beta,\\, a]<\/span>。圆点 <span class=\"katex-inline\">\\cdot<\/span> 记录产生式右部已识别到的位置；<span class=\"katex-inline\">a<\/span> 是前瞻符，指示该项在后面跟哪个终结符时可归约。<span class=\"katex-inline\">\\beta<\/span> 为空表示右部已全部识别，等待归约（原书 3.4.2 节，PDF 第 109 页）。<\/p>\n<p><strong>项目集规范族<\/strong>：从增广文法 <span class=\"katex-inline\">S&#x27; \\to S<\/span> 的初始项出发，经闭包运算与转移运算生成的全部项目集；每个项目集对应分析栈的一种状态。<\/p>\n<p><strong>Action 表<\/strong>：行是项目集状态，列是终结符与 <code><span class=\"katex-inline\"><\/code>；动作含 <code>shift s<\/code>（移进并转入状态 <\/span>s$）、<code>reduce A→α<\/code>（按产生式归约）、<code>accept<\/code>（接受）、空白（出错）。<\/p>\n<p><strong>Goto 表<\/strong>：行是状态，列是非终结符；记录对某非终结符转移到哪个项目集状态（原书 3.4.1 节，PDF 第 104 页，图 3-15 框架分析器）。<\/p>\n<p><strong>闭包运算<\/strong>：项目集 <span class=\"katex-inline\">I<\/span> 中若有项 <span class=\"katex-inline\">[A \\to \\alpha \\cdot B\\beta, a]<\/span>，把 <span class=\"katex-inline\">B<\/span> 的各产生式项 <span class=\"katex-inline\">[B \\to \\cdot \\gamma, b]<\/span> 加入，<span class=\"katex-inline\">b<\/span> 取自 <span class=\"katex-inline\">\\text{FIRST}(\\beta a)<\/span>；反复直到无新项。<\/p>\n<p><strong>转移运算<\/strong>：<span class=\"katex-inline\">\\text{Goto}(I, X)<\/span> 是把 <span class=\"katex-inline\">I<\/span> 中所有圆点在 <span class=\"katex-inline\">X<\/span> 前的项，圆点移过 <span class=\"katex-inline\">X<\/span> 后求闭包得到的项目集。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<p>第一步，构造初始项目集：增广项 <span class=\"katex-inline\">[S&#x27; \\to \\cdot S, \\<\/span>]$ 求闭包。<\/p>\n<p>第二步，扩展规范族：对当前项目集 <span class=\"katex-inline\">I<\/span> 与每个文法符号 <span class=\"katex-inline\">X<\/span>，算 <span class=\"katex-inline\">\\text{Goto}(I, X)<\/span>；新集合加入规范族，重复直到不再产生新项目集。<\/p>\n<p>第三步，填 Action：<\/p>\n<ul><li>\n项 <span class=\"katex-inline\">[A \\to \\alpha \\cdot a\\beta, b]<\/span>：Action <span class=\"katex-inline\">[I, a]<\/span> = shift 对应 Goto 状态。\n<\/li><li>\n项 <span class=\"katex-inline\">[A \\to \\alpha \\cdot, a]<\/span>（<span class=\"katex-inline\">A \\neq S&#x27;<\/span>）：Action <span class=\"katex-inline\">[I, a]<\/span> = reduce <span class=\"katex-inline\">A \\to \\alpha<\/span>。\n<\/li><li>\n项 <span class=\"katex-inline\">[S&#x27; \\to S \\cdot, \\<\/span>]<span class=\"katex-inline\">：Action <\/span>[I, \\<span class=\"katex-inline\">]<\/span> = accept。\n<\/ul>\n<p>第四步，填 Goto：对非终结符 <span class=\"katex-inline\">B<\/span>，Goto <span class=\"katex-inline\">[I, B]<\/span> = <span class=\"katex-inline\">\\text{Goto}(I, B)<\/span> 对应状态。<\/p>\n<p>第五步，查冲突：同一 Action 格既有 shift 又有 reduce，是移进-归约冲突；同格两条 reduce，是归约-归约冲突。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：文法的项目集规范族中每个 Action 格至多一个动作；分析器按表执行，栈保存已归约的语法树片段。\n<\/li><li>\n<strong>失败案例 1：二义文法<\/strong>。同一串可由两条路径归约，规范族里出现两个归约动作；即使加默认优先级消解冲突，句子结构在不同归约顺序下仍可能不同。\n<\/li><li>\n<strong>失败案例 2：前瞻不足<\/strong>。SLR 用 FOLLOW 集合近似归约前瞻，比 LR(1) 项目少，但在某些状态上会把不该归约的列也填上，引发伪冲突；LR(1) 为每个项带具体前瞻符，项目数随之增大。\n<\/li><li>\n<strong>边界：冲突不等于分析器报错就停<\/strong>。工程实现可按文法规范设定 shift 优先或 reduce 优先消解，但这是对文法二义性的人工裁决，必须记录裁决理由。\n<\/li><li>\n<strong>失败案例：闭包漏加前瞻<\/strong>。圆点后是非终结符 <span class=\"katex-inline\">B<\/span> 时，未按 <span class=\"katex-inline\">\\text{FIRST}(\\beta a)<\/span> 算 <span class=\"katex-inline\">B<\/span> 项的前瞻符，归约时机算宽，误判可归约状态。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>LR 与 LL<\/strong>：LL 从上往下预测产生式，栈里放待展开非终结符；LR 从下往上归约，栈里放已识别片段。LR 文法覆盖面更大，代价是分析表体积与构造算法复杂度更高。\n<\/li><li>\n<strong>移进与归约<\/strong>：移进把当前单词压栈并推进输入指针；归约把栈顶句柄替换成产生式左部，弹出右部符号、压入左部。Action 格的选择取决于栈顶项目圆点位置与前瞻符。\n<\/li><li>\n<strong>SLR、LALR、LR(1)<\/strong>：SLR 用 FOLLOW 近似前瞻，表最小但冲突偏多；LR(1) 每项带精确前瞻，表最大；LALR 合并 LR(1) 中核心相同的项目集，在表体积与精度之间折中（原书 3.4.2 节，PDF 第 109 页起）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c03 的 FIRST/FOLLOW 在 SLR 前瞻近似与闭包计算中继续使用。后继：c05 把 LR 归约过程中得到的产生式序列翻译成三地址码；c13 的属性计算挂在归约出的语法树上。LR 表在编译器构造期生成，运行期分析器只做栈操作与查表。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（LR 项目集、Action/Goto 表与移进-归约冲突）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：项目集闭包与转移、Action/Goto 填表与冲突定位<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>LR 分析要在归约时刻做决策，往回追三层前提：<\/p>\n<ol><li>\n自底向上分析不预测产生式，而是先把输入符号移进栈，等栈顶出现句柄再归约。决策点晚于符号识别，分析器能利用已移进的全部信息，这是 LR 比 LL 覆盖面大的根本原因。\n<\/li><li>\n“栈顶当前处于产生式的哪个位置”需要显式记录。这个记录就是项：产生式右部加圆点位置；再配一个前瞻符，指示该项在什么后续单词下可以归约。\n<\/li><li>\n所有可能的栈位置组成项目集规范族。分析器运行时的状态就是规范族中的一个项目集；表把“在该状态遇某符号做什么动作”预先算好，运行期只做栈操作与查表。\n<\/ol>\n<p>依赖链方向：归约式分析 → 项记录圆点位置 → 闭包与转移生成规范族 → Action/Goto 填表 → 冲突检测与消解。<\/p>\n<h2>正向演算（逐步走查）：规范族构造与填表<\/h2>\n<h3>闭包运算<\/h3>\n<p>设项目集 <span class=\"katex-inline\">I<\/span>：<\/p>\n<pre><code>Closure(I):\n    repeat:\n        for 项 [A → α · Bβ, a] ∈ I:\n            for B 的每个产生式 B → γ:\n                for b ∈ FIRST(βa):\n                    若 [B → ·γ, b] ∉ I: 加入 I\n    until 无新项<\/code><\/pre>\n<p>圆点后面是非终结符 <span class=\"katex-inline\">B<\/span> 时，<span class=\"katex-inline\">B<\/span> 自己的各产生式都可能接下来被展开，因此加入它们的初始项；前瞻 <span class=\"katex-inline\">b<\/span> 由圆点后串 <span class=\"katex-inline\">\\beta<\/span> 与原前瞻 <span class=\"katex-inline\">a<\/span> 的首符决定。<\/p>\n<h3>转移运算<\/h3>\n<pre><code>Goto(I, X):\n    J ← { [A → αX · β, a] | [A → α · Xβ, a] ∈ I }\n    return Closure(J)<\/code><\/pre>\n<p>把 <span class=\"katex-inline\">I<\/span> 中圆点在 <span class=\"katex-inline\">X<\/span> 前的项统一移过 <span class=\"katex-inline\">X<\/span>，再求闭包。<\/p>\n<h3>Action 与 Goto 填表规则<\/h3>\n<ul><li>\n移进：<span class=\"katex-inline\">[A \\to \\alpha \\cdot a\\beta, b]<\/span> → Action <span class=\"katex-inline\">[I, a]<\/span> = shift <span class=\"katex-inline\">s<\/span>，<span class=\"katex-inline\">s<\/span> 是 Goto <span class=\"katex-inline\">(I, a)<\/span>。\n<\/li><li>\n归约：<span class=\"katex-inline\">[A \\to \\alpha \\cdot, a]<\/span>（<span class=\"katex-inline\">A \\neq S&#x27;<\/span>）→ Action <span class=\"katex-inline\">[I, a]<\/span> = reduce <span class=\"katex-inline\">A \\to \\alpha<\/span>。\n<\/li><li>\n接受：<span class=\"katex-inline\">[S&#x27; \\to S \\cdot, \\<\/span>]<span class=\"katex-inline\"> → Action <\/span>[I, \\<span class=\"katex-inline\">]<\/span> = accept。\n<\/li><li>\nGoto：非终结符 <span class=\"katex-inline\">B<\/span> 的列填 Goto <span class=\"katex-inline\">(I, B)<\/span> 状态号。\n<\/ul>\n<h2>具体算例：小文法的项目集规范族<\/h2>\n<p>文法（增广后）：<\/p>\n<pre><code>S&#x27; → S\nS  → a S | b<\/code><\/pre>\n<h3><span class=\"katex-inline\">I_0<\/span>（初始集）<\/h3>\n<p>闭包从 <span class=\"katex-inline\">[S&#x27; \\to \\cdot S, \\<\/span>]<span class=\"katex-inline\"> 开始；圆点后是 <\/span>S<span class=\"katex-inline\">，加入 <\/span>S$ 的产生式项：<\/p>\n<pre><code>[S&#x27; → ·S, $]\n[S  → ·a S, $]\n[S  → ·b,  $]<\/code><\/pre>\n<h3>转移<\/h3>\n<ul><li>\nGoto <span class=\"katex-inline\">(I_0, S)<\/span>：<span class=\"katex-inline\">[S&#x27; \\to S \\cdot, \\<\/span>]<span class=\"katex-inline\">，记 <\/span>I_1$。\n<\/li><li>\nGoto <span class=\"katex-inline\">(I_0, a)<\/span>：圆点移过 <span class=\"katex-inline\">a<\/span>，得 <span class=\"katex-inline\">[S \\to a \\cdot S, \\<\/span>]<span class=\"katex-inline\">，闭包加入 <\/span>S<span class=\"katex-inline\"> 的项，记 <\/span>I_2$。\n<\/li><li>\nGoto <span class=\"katex-inline\">(I_0, b)<\/span>：<span class=\"katex-inline\">[S \\to b \\cdot, \\<\/span>]<span class=\"katex-inline\">，记 <\/span>I_3$。\n<\/ul>\n<h3><span class=\"katex-inline\">I_2<\/span> 继续转移<\/h3>\n<ul><li>\nGoto <span class=\"katex-inline\">(I_2, S)<\/span>：<span class=\"katex-inline\">[S \\to a S \\cdot, \\<\/span>]<span class=\"katex-inline\">，记 <\/span>I_4$。\n<\/ul>\n<h3>填表（节选）<\/h3>\n<ul><li>\n<span class=\"katex-inline\">I_0<\/span>：Action <span class=\"katex-inline\">[a]<\/span> = shift <span class=\"katex-inline\">I_2<\/span>；Action <span class=\"katex-inline\">[b]<\/span> = shift <span class=\"katex-inline\">I_3<\/span>；Goto <span class=\"katex-inline\">[S]<\/span> = <span class=\"katex-inline\">I_1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">I_3<\/span>：Action <span class=\"katex-inline\">[b]<\/span> 列（前瞻 $\\$$）= reduce <span class=\"katex-inline\">S \\to b<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">I_1<\/span>：Action <span class=\"katex-inline\">[\\<\/span>]$ = accept。\n<\/li><li>\n<span class=\"katex-inline\">I_4<\/span>：Action <span class=\"katex-inline\">[\\<\/span>]<span class=\"katex-inline\"> = reduce <\/span>S \\to a S$。\n<\/ul>\n<p>各格至多一个动作，规范族无冲突。<\/p>\n<h2>第二算例：悬空 else 的移进-归约冲突<\/h2>\n<p>文法：<\/p>\n<pre><code>Stmt → if Expr then Stmt\n     | if Expr then Stmt else Stmt\n     | other<\/code><\/pre>\n<p>构造到状态 <span class=\"katex-inline\">I<\/span>：已识别 <code>if Expr then Stmt<\/code>，栈顶项目含两个候选：第二个候选圆点在 <code>else<\/code> 前（可移进 <code>else<\/code>）；第一个候选右部已完整（在 <code>else<\/code> 作为前瞻时可归约）。<\/p>\n<p>于是 Action <span class=\"katex-inline\">[I, \\text{else}]<\/span> 同时出现：<\/p>\n<ul><li>\nshift：移进 <code>else<\/code>，走第二个候选；\n<\/li><li>\nreduce：按 <code>Stmt → if Expr then Stmt<\/code> 归约。\n<\/ul>\n<p>这是移进-归约冲突。语义上 <code>else<\/code> 通常绑定最近的未匹配 <code>if<\/code>，工程默认消解为 shift；但该裁决是人工约定，规范族层面冲突确实存在。同格若出现两条 reduce，则是归约-归约冲突，说明同一短语有两条等价归约路径，文法二义性更直接。<\/p>\n<h2>延伸推演：前瞻精度与表体积<\/h2>\n<p>SLR 把归约前瞻取为 FOLLOW(A)，不区分项所在上下文；LR(1) 为每个项带精确前瞻符，能在不该归约的列留空。代价是 LR(1) 项目集数量显著多于 SLR。LALR 把核心（圆点位置与产生式相同、前瞻不同）的项目集合并，压缩表体积，同时保留大部分 LR(1) 精度。本书 3.4.2 节指出，<span class=\"katex-inline\">k&gt;1<\/span> 的 LR(k) 分析器可接受的语言集合相同，但前瞻编号越大分析表越复杂（PDF 第 109 页）。<\/p>\n<h2>对抗性追问：闭包漏算前瞻会怎样<\/h2>\n<p>若 <span class=\"katex-inline\">[A \\to \\alpha \\cdot B\\beta, a]<\/span> 加入 <span class=\"katex-inline\">B<\/span> 的项时，前瞻只取 <span class=\"katex-inline\">a<\/span> 而不按 <span class=\"katex-inline\">\\text{FIRST}(\\beta a)<\/span> 计算，当 <span class=\"katex-inline\">\\beta<\/span> 能推 <span class=\"katex-inline\">\\varepsilon<\/span> 之外的首符时，<span class=\"katex-inline\">B<\/span> 项在这些首符列上缺失；对应状态遇到这些单词本可归约，表格留空，误报语法错误。反向情形：前瞻算宽，会把不可归约的列填上 reduce，误删合法移进。<\/p>\n<p>再追一层：转移运算若不移过圆点就求闭包，新项目集与原集相同，规范族不再扩展；表中 Goto 指向错误状态，归约后栈顶状态与实际句型不匹配。<\/p>\n<h2>第三算例：归约-归约冲突的形态<\/h2>\n<p>文法：<\/p>\n<pre><code>S → A c\nS → B c\nA → d\nB → d<\/code><\/pre>\n<p>输入 <code>dc<\/code>：<code>d<\/code> 可由 <span class=\"katex-inline\">A \\to d<\/span> 归约，也可由 <span class=\"katex-inline\">B \\to d<\/span> 归约。规范族中对应状态的 Action 格出现两条 reduce 动作，这是归约-归约冲突。与移进-归约冲突不同，它没有“先移进再说”的折中：同一短语两条归约路径选哪条，得到的语法树不同。这类冲突说明文法对同一串有两种结构解释，需要改写文法消除歧义。<\/p>\n<h2>延伸推演：LR 分析栈与归约动作<\/h2>\n<p>LR 分析栈保存已归约的语法树片段与对应状态。移进把当前单词压栈并转入 Goto 状态；归约时弹出右部符号个数，压入左部非终结符，再按 Goto 表回到对应状态。框架分析器主循环：栈顶状态与当前单词查 Action，shift 则压单词转状态，reduce 则按产生式弹栈压左部，accept 则结束（原书图 3-15，PDF 第 104 页）。<\/p>\n<p>三种 LR 变体的取舍：SLR 用 FOLLOW 近似归约前瞻，项目少但伪冲突偏多；LR(1) 每项带精确前瞻，项目集最大；LALR 合并核心相同的 LR(1) 项目集，压缩表体积并保留大部分精度。本书 3.4.2 节指出，<span class=\"katex-inline\">k&gt;1<\/span> 的 LR(k) 可接受语言集合相同，前瞻编号越大表越复杂（PDF 第 109 页）。<\/p>\n<h2>对抗性追问：归约时机算宽会怎样<\/h2>\n<p>闭包加入 <span class=\"katex-inline\">B<\/span> 项时前瞻只取原项前瞻，不按 <span class=\"katex-inline\">\\text{FIRST}(\\beta a)<\/span> 计算；<span class=\"katex-inline\">\\beta<\/span> 首符列上 <span class=\"katex-inline\">B<\/span> 项缺失，可归约状态被判不可归约，合法输入报错。反向情形：前瞻算宽，不可归约列被填上 reduce，误删合法移进，后续栈状态与句型不匹配。<\/p>\n<p>再追一层：转移运算不移过圆点就求闭包，新项目集与原集相同，规范族不再扩展；Goto 指向错误状态，归约后栈顶状态接不上实际句型。闭包与转移两步缺一不可，规范族必须覆盖所有可达状态。<\/p>\n<h2>延伸推演：框架分析器的一次运行走查<\/h2>\n<p>LR 分析栈保存已归约的语法树片段与对应状态。主循环：栈顶状态与当前单词查 Action；shift 则压入单词、转入 Goto 状态；reduce 则按产生式右部长度弹栈，压入左部非终结符，再查 Goto 回到对应状态；accept 结束。本书图 3-15 给出框架 LR(1) 分析器的伪代码（原书 PDF 第 104 页）。<\/p>\n<p>归约动作前后栈内容变化要对上：弹出右部 <span class=\"katex-inline\">|\\alpha|<\/span> 个符号与对应状态，压入左部 <span class=\"katex-inline\">A<\/span> 后，新栈顶状态由 Goto(归约前状态, <span class=\"katex-inline\">A<\/span>) 确定。若 Goto 表漏填，归约后找不到合法后继状态，分析器在句型已部分归约时失败。<\/p>\n<p>三种 LR 变体的表体积取舍：SLR 用 FOLLOW 近似前瞻，项目最少但伪冲突偏多；LR(1) 每项带精确前瞻，项目集最大；LALR 合并核心相同的 LR(1) 项目集，压缩体积并保留大部分精度。工程上遇到冲突，可按文法规范设定 shift 优先或 reduce 优先消解，但这是对二义性的人工裁决，必须记录理由，不能当成文法本身无冲突。<\/p>\n<h2>对抗性追问：项目集漏闭包会怎样<\/h2>\n<p>圆点后是非终结符 <span class=\"katex-inline\">B<\/span> 时，若没把 <span class=\"katex-inline\">B<\/span> 的产生式项加入当前项目集，后续遇到 <span class=\"katex-inline\">B<\/span> 开头的输入，分析栈里没有对应归约候选；该归约路径在规范族中缺失，合法句子被误判错误。闭包要反复加入新项直到无新项，转移后新项目集同样要求闭包完整。<\/p>\n<h2>第四算例：项目集闭包的逐项加入<\/h2>\n<p>文法片段 <span class=\"katex-inline\">E \\to E + T<\/span>，<span class=\"katex-inline\">T \\to \\text{id}<\/span>。初始项目集 <span class=\"katex-inline\">I_0<\/span> 含 <span class=\"katex-inline\">[E \\to \\cdot E + T]<\/span>。闭包规则：圆点后是 <span class=\"katex-inline\">E<\/span>，把 <span class=\"katex-inline\">E<\/span> 的产生式项目加入：<span class=\"katex-inline\">[E \\to \\cdot E + T]<\/span> 本身与 <span class=\"katex-inline\">[E \\to \\cdot T]<\/span>；<span class=\"katex-inline\">[E \\to \\cdot T]<\/span> 圆点后是 <span class=\"katex-inline\">T<\/span>，再加入 <span class=\"katex-inline\">[T \\to \\cdot \\text{id}]<\/span>。<span class=\"katex-inline\">I_0<\/span> 最终三项。<\/p>\n<p>转移：<span class=\"katex-inline\">I_0<\/span> 读 <span class=\"katex-inline\">E<\/span>，圆点越过 <span class=\"katex-inline\">E<\/span> 得 <span class=\"katex-inline\">[E \\to E \\cdot + T]<\/span>，闭包中圆点后是终结符 <code>+<\/code>，不再加入非终结项；读 <span class=\"katex-inline\">T<\/span> 得 <span class=\"katex-inline\">[E \\to T \\cdot]<\/span>；读 <code>id<\/code> 得 <span class=\"katex-inline\">[T \\to \\text{id} \\cdot]<\/span>。新项目集同样先闭包再登记到规范族，与已有项目集比对核心，相同则复用。<\/p>\n<h2>延伸推演：归约时机与句柄识别<\/h2>\n<p>LR 分析在栈上攒出句柄才归约；句柄是产生式右部在当前句型中的出现。项目集里的归约项 <span class=\"katex-inline\">[A \\to \\alpha \\cdot]<\/span> 表示栈顶已凑齐 <span class=\"katex-inline\">\\alpha<\/span>，前瞻满足时归约为 <span class=\"katex-inline\">A<\/span>。SLR 用 FOLLOW(<span class=\"katex-inline\">A<\/span>) 判断哪些前瞻可归约；LR(1) 项目自带前瞻 <span class=\"katex-inline\">a<\/span>，只在 <span class=\"katex-inline\">[A \\to \\alpha \\cdot, a]<\/span> 命中时归约，判断更精确但项目集更大。<\/p>\n<p>冲突登记方式：同一项目集同一前瞻列，既有 shift 项又有 reduce 项是移进-归约冲突；两条 reduce 项对应不同产生式是归约-归约冲突。表上一格两条动作，分析器无法无试探选择，必须回到文法层消除或人工裁决。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nLR(1) 项里圆点与前瞻符各记录什么信息？\n<\/li><li>\n闭包运算在什么条件下加入新产生式的项？\n<\/li><li>\n移进动作与归约动作分别由什么样的项目触发？\n<\/li><li>\n移进-归约冲突与归约-归约冲突在 Action 表里各是什么形态？\n<\/li><li>\nSLR 的前瞻近似与 LR(1) 的精确前瞻相比，表体积与冲突数量有什么取舍？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "LR 项目集、Action/Goto 表与移进-归约冲突"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.189<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">LR 项目集、Action/Goto 表与移进-归约冲突<\/a><\/span><\/div><h1>三地址码、基本块与控制流图（CFG）构造<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章（原书第 5 章 5.3.2、5.3.4 节，PDF 第 189、191 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>前端留下的语法结构直接映射到某款处理器指令，会把编译器绑死在具体 ISA 上：换机器就要重写整套翻译。编译器需要一层与源语言、目标机器都保持距离的中间表示（IR），让多数分析与改写在 IR 上完成。线性 IR 中最常用的是三地址代码：每条指令至多一个运算符、两个操作数、一个结果，形式规整、便于切块与分析。数据流分析不直接在长指令序列上做，而是先把序列切成基本块，再以块为结点、转移为边建成控制流图（CFG）。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>图 IR 与线性 IR<\/strong>：图 IR 含与语法相关的树、表达式图；线性 IR 含堆栈机代码与三地址代码。本书指出 IR 可能有唯一的 IR，也可能在不同阶段使用不同 IR（原书 5.2、5.3 节，PDF 第 178、189 页）。<\/p>\n<p><strong>三地址代码<\/strong>：形如 <span class=\"katex-inline\">t_1 \\leftarrow 2<\/span>、<span class=\"katex-inline\">t_3 \\leftarrow t_1 \\times t_2<\/span>，一条指令一个运算符、两个操作数、一个结果；名字通常由编译器生成，临时名 <span class=\"katex-inline\">t_i<\/span> 只在三地址代码内有效（原书 5.3.2 节，PDF 第 189 页）。本书贯穿各章的底层线性 IR 是 ILOC，附录 A 给出其指令参考（PDF 第 546 页）。<\/p>\n<p><strong>基本块<\/strong>：一段顺序执行的指令序列，块首是唯一入口指令，块内没有分支跳入跳出，块尾是最后一条转移或条件转移指令。<\/p>\n<p><strong>控制流图<\/strong>：结点是基本块，边是块间转移；顺序后继与转移目标各产生一条边。CFG 是到达定值、活跃变量等数据流分析的工作底图（原书 5.3.4 节，PDF 第 191 页）。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<h3>第一步：识别领导者<\/h3>\n<p>领导者是基本块的首指令，三类指令满足任一即领导者：<\/p>\n<ol><li>\n程序第一条指令；\n<\/li><li>\n任何转移指令的目标指令；\n<\/li><li>\n任何紧跟转移或条件转移之后的指令。\n<\/ol>\n<h3>第二步：切块<\/h3>\n<p>每个领导者到下一个领导者之前的指令组成一个基本块：领导者是块首，其后连续指令归入该块，直到下一个领导者出现。<\/p>\n<h3>第三步：连边<\/h3>\n<p>块 <span class=\"katex-inline\">B<\/span> 的末尾若是无条件转移，目标块是其唯一后继；若是条件转移，目标块与顺序后继都是后继；若末尾无转移，顺序后继是后继。调用、异常出口等额外控制流按目标语言规则补边。<\/p>\n<h3>第四步：校验<\/h3>\n<p>每个块只有一个入口领导者；块内指令顺序执行，块内不出现跳转目标；所有边都来自转移目标或顺序后继。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：线性 IR 中指令顺序与执行顺序基本一致，转移目标可静态确定；无条件/条件转移、返回指令都已标出。\n<\/li><li>\n<strong>边界 1：动态跳转目标<\/strong>。经函数指针、间接跳转的目标无法静态确定，CFG 上只能保守地连到可能的目标集合，分析精度随之下降。\n<\/li><li>\n<strong>边界 2：过程间控制流不在本图<\/strong>。过程调用连接的是调用图层面的边；单个过程的 CFG 只描述本过程内部块间顺序。\n<\/li><li>\n<strong>失败案例：漏标转移目标为领导者<\/strong>。跳转目标留在前一块尾部，前一块出现块内跳入，切块边界错误，后续数据流传播路径跟着错。\n<\/li><li>\n<strong>失败案例：把顺序后继漏掉<\/strong>。条件转移只连真分支目标，不连 fall-through 顺序后继，假分支路径在 CFG 上消失，沿该路径的定值与活跃性都算不到。\n<\/li><li>\n<strong>边界 3：图 IR 与线性 IR 互补<\/strong>。树适合表达表达式结构，线性代码适合顺序执行与流水；本书在不同阶段使用不同形式（原书 5.3.4 节，PDF 第 191 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>三地址码与堆栈机代码<\/strong>：堆栈机代码把操作数压入栈，二元运算从栈顶取两个值算完压回，指令不含显式结果名；三地址码显式给出结果临时名，操作数与结果位置清楚，便于重排与寄存器分配。\n<\/li><li>\n<strong>基本块与过程<\/strong>：基本块是过程内一段无分支顺序序列；过程由多个基本块经 CFG 边连接而成。块是数据流分析的最小单位，过程是调用与分配的单位。\n<\/li><li>\n<strong>CFG 与调用图<\/strong>：CFG 描述同一过程内部块间控制流；调用图结点是过程，边是调用关系。活跃范围、活动范围在 CFG 上算，过程间分析才跨调用图。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c04 的 LR 归约产生式序列是生成三地址码的骨架。后继：c06 到达定值、c07 活跃变量在本节 CFG 上迭代传播；c11 指令选择把表达式树与三地址片段匹配成目标指令；c12 调度在块内与跨块重排指令顺序。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（三地址码、基本块与控制流图（CFG）构造）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：IR 选型、基本块切分与 CFG 建图全过程<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要在机器无关层面做分析与优化，往回追三层前提：<\/p>\n<ol><li>\n直接从语法树生成目标指令，翻译规则绑死某款 ISA 的寻址方式与指令格式；换处理器就要重写翻译层。中间表示把“程序做了什么”与“机器怎么执行”分开，分析在 IR 上重复使用。\n<\/li><li>\nIR 分图类与线性类。图类贴近表达式结构，适合翻译阶段；线性类贴近执行顺序，适合切块、流水与数据流分析。三地址代码是线性类里结构最规整的一种：显式结果名，每条指令动作单一。\n<\/li><li>\n长指令序列上做全局分析，路径关系不清。先把序列切成只有一个入口、顺序执行的基本块，再以块为结点连边，控制流就变成一张可遍历的图；数据流沿图的边传播。\n<\/ol>\n<p>依赖链方向：机器无关分析需求 → 线性三地址 IR → 领导者识别 → 基本块切分 → 块间连边 → CFG 数据流底图。<\/p>\n<h2>正向演算（逐步走查）：切块与建图算法<\/h2>\n<h3>领导者识别规则<\/h3>\n<pre><code>leaders ← {第一条指令}\nfor 每条指令 i:\n    if i 是转移指令:\n        leaders ← leaders ∪ {转移目标}\n    if i 是转移或条件转移:\n        leaders ← leaders ∪ {i 的下一条指令}<\/code><\/pre>\n<h3>切块<\/h3>\n<pre><code>按指令序号排序 leaders\nfor 每个领导者 l:\n    块 B_l 含 l 到下一个领导者之前的全部指令<\/code><\/pre>\n<h3>连边<\/h3>\n<pre><code>for 每个块 B:\n    末尾指令为 u\n    if u 是无条件转移 goto t:\n        加边 B → 块(t)\n    elif u 是条件转移:\n        加边 B → 块(t)\n        加边 B → 顺序后继块\n    elif u 是返回:\n        无后继边\n    else:\n        加边 B → 顺序后继块<\/code><\/pre>\n<h3>校验要点<\/h3>\n<p>块首必须是领导者；块内不能出现新的跳转目标；条件转移的两条分支都要连边；入口块是程序第一条指令所在块。<\/p>\n<h2>具体算例：带循环的三地址码切块<\/h2>\n<pre><code>1   i ← 0\n2   j ← 0\n3   t1 ← i &lt; n\n4   if t1 goto 8\n5   t2 ← j + 1\n6   j ← t2\n7   goto 10\n8   t3 ← i + 1\n9   i ← t3\n10  t4 ← i + j\n11  if t4 goto 2\n12  return<\/code><\/pre>\n<p>第一步，标领导者：1（首条）；8（4 的转移目标）；5（紧跟条件转移 4）；10（7 的转移目标）；2（11 的转移目标）；12（紧跟条件转移 11）。<\/p>\n<p>第二步，切块：<\/p>\n<ul><li>\n<span class=\"katex-inline\">B_1<\/span>：1–4\n<\/li><li>\n<span class=\"katex-inline\">B_2<\/span>：5–7\n<\/li><li>\n<span class=\"katex-inline\">B_3<\/span>：8–9\n<\/li><li>\n<span class=\"katex-inline\">B_4<\/span>：10–11\n<\/li><li>\n<span class=\"katex-inline\">B_5<\/span>：12\n<\/ul>\n<p>第三步，连边：<\/p>\n<ul><li>\n<span class=\"katex-inline\">B_1<\/span> 条件转移到 <span class=\"katex-inline\">B_3<\/span>，顺序后继 <span class=\"katex-inline\">B_2<\/span>：<span class=\"katex-inline\">B_1 \\to B_2<\/span>，<span class=\"katex-inline\">B_1 \\to B_3<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">B_2<\/span> 无条件 goto 10：<span class=\"katex-inline\">B_2 \\to B_4<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">B_3<\/span> 顺序后继：<span class=\"katex-inline\">B_3 \\to B_4<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">B_4<\/span> 条件转移到 <span class=\"katex-inline\">B_2<\/span>（回边），顺序后继 <span class=\"katex-inline\">B_5<\/span>：<span class=\"katex-inline\">B_4 \\to B_2<\/span>，<span class=\"katex-inline\">B_4 \\to B_5<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">B_5<\/span> 返回，无后继。\n<\/ul>\n<p>第四步，读图：<span class=\"katex-inline\">B_2<\/span> 经 <span class=\"katex-inline\">B_4<\/span> 回到自身构成循环；<span class=\"katex-inline\">B_1<\/span> 是入口块；<span class=\"katex-inline\">B_5<\/span> 是出口块。后续到达定值分析从 <span class=\"katex-inline\">B_1<\/span> 沿边传播，活跃变量从 <span class=\"katex-inline\">B_5<\/span> 反向回推。<\/p>\n<h2>第二算例：嵌套分支的块划分<\/h2>\n<pre><code>1   if x &lt; 0 goto 4\n2   y ← 1\n3   goto 6\n4   y ← 2\n5   z ← y\n6   w ← y + z<\/code><\/pre>\n<p>领导者：1；4（1 的目标）；2（紧跟 1）；6（3 的目标）；5（紧跟 4）。切块 <span class=\"katex-inline\">B_1<\/span>：1；<span class=\"katex-inline\">B_2<\/span>：2–3；<span class=\"katex-inline\">B_3<\/span>：4–5；<span class=\"katex-inline\">B_4<\/span>：6。边：<span class=\"katex-inline\">B_1 \\to B_2<\/span>、<span class=\"katex-inline\">B_1 \\to B_3<\/span>；<span class=\"katex-inline\">B_2 \\to B_4<\/span>；<span class=\"katex-inline\">B_3 \\to B_4<\/span>。两个分支在 <span class=\"katex-inline\">B_4<\/span> 汇合。<\/p>\n<h2>延伸推演：ILOC 指令与临时名<\/h2>\n<p>本书使用的 ILOC 是抽象 RISC 机器汇编代码：三地址形式，假设有限种数据类型、未指定具体位数；指令含 load/store、算术与分支操作，操作数在操作码后按顺序列出（原书附录 A，PDF 第 546 页）。三地址码的临时名 <span class=\"katex-inline\">t_i<\/span> 由编译器生成，名字只在本过程 IR 内有效；跨过程的值通过参数、返回值与内存位置传递，不直接引用别的过程的临时名。<\/p>\n<p>线性代码建 CFG 之后，图上的循环、汇合点、回边都可静态读出；这些结构是循环优化、区域调度与 SSA 放置的依据。<\/p>\n<h2>对抗性追问：漏一条边会怎样<\/h2>\n<p>若条件转移只连真分支目标、漏掉 fall-through 顺序后继，假分支路径在图上消失：该路径上的定值不会被前向分析看到，该路径上的活跃变量不会被后向分析回推，优化决策基于残缺控制流。反向情形：把不存在的顺序后继连上，分析器会沿不可达路径传播信息，得到过宽的集合。<\/p>\n<p>再追一层：若跳转目标没标成领导者，目标指令被并入前一块尾部，前一块出现块内跳入；块内“顺序执行”前提失效，块内定值顺序的假设不再成立，基于基本块的局部优化会拿到错误前提。<\/p>\n<h2>延伸推演：块边界判断的三类细节<\/h2>\n<p>切块时领导者规则覆盖三种边界情形。其一，程序入口本身是领导者，保证整个过程至少有一个起始块。其二，转移目标成为领导者：无论目标来自条件转移、无条件转移还是循环回边，只要控制流可能跳到该指令，它就必须是块首，否则块内会出现块外跳入。其三，转移之后的指令成为领导者：转移指令本身是前一块的末尾，下一条指令另起一块，避免顺序执行与跳转后继混在同一块内。<\/p>\n<p>调用指令在块划分中按两条规则处理：调用本身不改变本过程 CFG 的块边界，调用连接的跨过程关系记到调用图；若调用可能不返回（如退出过程），其后继边按语言与运行时约定补全。异常出口按同一原则处理，保守地把可能的异常目标列为后继，分析精度按这个保守设定走。<\/p>\n<p>线性代码与图 IR 的分工在这里落地：表达式内部的嵌套关系适合用树表达，翻译阶段按树生成三地址；执行顺序、分支与循环关系适合用线性代码加 CFG 表达，分析阶段按图传播。本书在不同阶段使用不同 IR 形式，切换的接缝就在语法树到三地址码、三地址码到 CFG 这两步（原书 5.3.4 节，PDF 第 191 页）。<\/p>\n<h2>第三算例：多分支段的块划分<\/h2>\n<pre><code>1   switch k\n2   case 0: a ← 1\n3   goto 7\n4   case 1: a ← 2\n5   goto 7\n6   default: a ← 3\n7   b ← a\n8   return<\/code><\/pre>\n<p>领导者：1（入口）；2、4、6（各分支目标）；3、5（紧跟分支内跳转）；7（3、5 的跳转目标）；8（紧跟 7）。切块：<span class=\"katex-inline\">B_1<\/span>：1；<span class=\"katex-inline\">B_2<\/span>：2–3；<span class=\"katex-inline\">B_3<\/span>：4–5；<span class=\"katex-inline\">B_4<\/span>：6；<span class=\"katex-inline\">B_5<\/span>：7–8。边：<span class=\"katex-inline\">B_1<\/span> 分别到 <span class=\"katex-inline\">B_2<\/span>、<span class=\"katex-inline\">B_3<\/span>、<span class=\"katex-inline\">B_4<\/span>；<span class=\"katex-inline\">B_2 \\to B_5<\/span>，<span class=\"katex-inline\">B_3 \\to B_5<\/span>，<span class=\"katex-inline\">B_4 \\to B_5<\/span>；<span class=\"katex-inline\">B_5<\/span> 返回。三个分支在 <span class=\"katex-inline\">B_5<\/span> 汇合，与第二算例的双分支汇合结构同形，只是前驱多两个。<\/p>\n<h2>对抗性追问：块内出现跳转目标会怎样<\/h2>\n<p>若转移目标没标成领导者，目标指令被并入前一块尾部，前一块就出现“块内跳入”：块内指令不再保证顺序执行，基于块内顺序的局部优化前提失效。反过来，把不构成目标的普通指令也标成领导者，块被切得过碎，跨块分析的边数增多，数据流迭代轮次上升。领导者集合取在“恰好覆盖所有入口”的大小，切块才既不错位也不过碎。<\/p>\n<h2>延伸推演：IR 字段、临时名作用域与图的分工<\/h2>\n<p>本书贯穿各章的底层线性 IR 是 ILOC：抽象 RISC 机器汇编代码，三地址形式，假设有限种数据类型、未指定具体位数；指令含 load/store、算术与分支，操作数在操作码后按顺序列出（原书附录 A，PDF 第 546 页）。三地址码的临时名 <span class=\"katex-inline\">t_i<\/span> 由编译器生成，名字只在本过程 IR 内有效；跨过程的值通过参数、返回值与内存位置传递，不直接引用别的过程临时名。<\/p>\n<p>CFG 与调用图分工明确：CFG 描述同一过程内部块间控制流，活跃范围、定值流向在 CFG 上算；调用图结点是过程，边是调用关系，过程间分析才跨调用图。把调用边画进单过程 CFG，会让块划分与数据流范围失焦。<\/p>\n<p>块内“顺序执行”是局部优化的前提：块首唯一入口，块内无跳入跳出。这个前提一旦被跳转目标破坏，块内定值先后顺序的局部推断就不再成立；切块时把所有跳转目标标成领导者，正是为了守住这条前提。<\/p>\n<h2>第三算例：三地址片段到基本块切分<\/h2>\n<p>语句序列：<\/p>\n<pre><code>t1 ← a + b\nt2 ← c * d\nt3 ← t1 + t2\nif t3 &lt; 0 goto L1\nx ← t3\ngoto L2\nL1: x ← 0\nL2: ...<\/code><\/pre>\n<p>领导者：第一条语句；<code>if<\/code> 与 <code>goto<\/code> 的目标标号 <code>L1<\/code>、<code>L2<\/code>；跳转之后的语句。切块后，<code>t1<\/code>、<code>t2<\/code>、<code>t3<\/code> 所在顺序段为一个块，条件跳转收尾；<code>L1<\/code> 起为另一个块。块内三地址指令顺序执行，块间由分支边连接。临时名 <code>t1<\/code>、<code>t2<\/code> 的定值只在本过程 IR 内编号；跨过程传递走参数与返回值。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n哪三类指令是基本块的领导者？\n<\/li><li>\n条件转移块的两条后继边分别连到哪里？\n<\/li><li>\n三地址码一条指令在运算符、操作数、结果上各有什么限制？\n<\/li><li>\nCFG 与调用图分别描述什么层面的控制流？\n<\/li><li>\n间接跳转的目标在 CFG 上为什么只能保守处理？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "三地址码、基本块与控制流图（CFG）构造"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.365<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">三地址码、基本块与控制流图（CFG）构造<\/a><\/span><\/div><h1>到达定值分析：迭代框架与不动点<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2 章（原书第 9 章 9.2 节，PDF 第 365 页起）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>编译器在做常量传播、冗余消除、寄存器分配之前，必须先回答：在程序某个点，变量 <span class=\"katex-inline\">x<\/span> 的值是由程序里哪一次赋值传过来的。若一次赋值的结果在后面所有引用处都还能到达，它可能是冗余计算；若某个定值到不了任何引用，它就是死代码。到达定值分析把“赋值能否沿控制流路径到达某点”算成数据流事实，供后续优化取用。它是最典型的前向数据流问题，迭代框架的做法也被活跃变量、支配性等其他问题复用。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>定值<\/strong>：对一个变量的赋值指令，记为 <span class=\"katex-inline\">d<\/span>。每个定值有唯一编号。<\/p>\n<p><strong>到达定值<\/strong>：在程序点 <span class=\"katex-inline\">p<\/span>，定值 <span class=\"katex-inline\">d<\/span> 到达 <span class=\"katex-inline\">p<\/span>，当且仅当存在一条从 <span class=\"katex-inline\">d<\/span> 所在块到 <span class=\"katex-inline\">p<\/span> 的路径，路径上 <span class=\"katex-inline\">x<\/span> 没有被重新赋值。中途被同变量新定值覆盖，旧定值在该点不再到达。<\/p>\n<p><strong>GEN[B]<\/strong>：块 <span class=\"katex-inline\">B<\/span> 内部产生的定值集合；<strong>KILL[B]<\/strong>：块 <span class=\"katex-inline\">B<\/span> 内定值所覆盖的、同变量的其他定值集合。<\/p>\n<p><strong>IN[B] / OUT[B]<\/strong>：到达块入口/出口的定值集合。前向迭代式：<\/p>\n<div class=\"katex-block\">\\text{IN}[B] = \\bigcup_{P \\in \\text{pred}(B)} \\text{OUT}[P], \\quad \\text{OUT}[B] = \\text{GEN}[B] \\cup (\\text{IN}[B] - \\text{KILL}[B])<\/div>\n<p><strong>不动点<\/strong>：反复按迭代式更新各块集合，直到某一轮所有 IN/OUT 都不再变化；此时的集合就是到达定值的解。本书 9.2 节用迭代数据流分析在控制流图上求这类事实（原书 PDF 第 365、370 页）。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<p>第一步，编号全部定值，列出每个块的 GEN 与 KILL。<\/p>\n<p>第二步，初始化：入口块 IN 为空，其余各块 IN/OUT 置空（或按框架约定置空集）。<\/p>\n<p>第三步，按某个顺序（通常逆后序 RPO，使前向信息尽早传播）逐块计算：先由前驱 OUT 求 IN，再由 GEN、KILL 求 OUT。<\/p>\n<p>第四步，比较新旧集合：若某块 OUT 发生变化，标记该块及其后继待更新；重复第三步。<\/p>\n<p>第五步，某一轮没有任何集合变化，到达不动点；此时各 IN/OUT 即全局到达定值解。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：变量定值与引用在 CFG 上静态可见；同变量的同名定值可按名字区分。\n<\/li><li>\n<strong>边界 1：别名与数组下标<\/strong>。经指针别名、数组下标间接赋值时，编译器不能确定它改写了哪个名字，KILL 只能保守地把同类型定值都杀掉，到达集合偏窄。\n<\/li><li>\n<strong>边界 2：路径不敏感<\/strong>。标准到达定值分析不区分具体路径，汇合处取各前驱并集；某定值只在一条不可行路径上到达，也会被算成到达，结论偏宽。\n<\/li><li>\n<strong>失败案例：KILL 算漏<\/strong>。块内重定义 <span class=\"katex-inline\">x<\/span> 却没把 <span class=\"katex-inline\">x<\/span> 的旧定值列入 KILL，旧定值穿过新定值继续到达后面的引用，分析把过时值当成仍可用。\n<\/li><li>\n<strong>失败案例：只迭代一轮<\/strong>。循环回边带来的定值还没传回循环头部，入口集合被当成空；后续优化依据不完整信息决策，漏掉可消除冗余。\n<\/li><li>\n<strong>边界 3：集合单调增长<\/strong>。前向框架中 IN/OUT 只并入新定值、不删除已并入项，有限个定值保证迭代必然停止（原书 9.2 节，PDF 第 365 页起）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>到达定值与活跃变量<\/strong>：到达定值是前向问题，沿边从定值往引用方向传播；活跃变量是后向问题，从引用往定值方向回推。一个回答“值从哪来”，一个回答“值还会不会被用”。\n<\/li><li>\n<strong>局部与全局分析<\/strong>：局部分析只看单个基本块内的定值顺序；全局分析跨块沿 CFG 传播。块内可见的事实出了块可能被其他路径改写，局部结论不能直接推广。\n<\/li><li>\n<strong>GEN/KILL 与 IN/OUT<\/strong>：GEN/KILL 是块静态属性，构造一次；IN/OUT 是迭代变量，每轮更新。把块静态属性混进迭代更新，会导致回边定值无法正确传播。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c05 的 CFG 是传播底图；c04 归约出的赋值指令成为定值编号来源。后继：c07 活跃变量从同一张 CFG 反向回推；c08 SSA 依据定值的到达与覆盖关系拆版本、插 φ；c09 常量传播与死代码消除以到达定值判断定值是否还有引用。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（到达定值分析：迭代框架与不动点）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：到达定值的迭代框架、两轮手算与不动点论证<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要回答“某点变量的值来自哪次赋值”，往回追三层前提：<\/p>\n<ol><li>\n优化决策必须基于定值的流向：常量传播要知道定值是常数且未被改写，冗余消除要知道同一变量前面是否算过同一表达式，死代码判断要知道定值后面是否还有引用。这些判断都需要先把定值能走到哪些程序点算清楚。\n<\/li><li>\n定值沿控制流路径移动，路径在 CFG 上表达。块是传播单位：块内定值顺序明确，块间靠边连接。因此先有 c05 的 CFG，才有到达定值的传播底图。\n<\/li><li>\n汇合点有多条前驱路径，定值来自哪一路不能预设；分析取各前驱到达集合的并集，保守地把“可能到达”都纳入。迭代反复沿边更新，直到集合不再增长。\n<\/ol>\n<p>依赖链方向：优化需要定值流向 → CFG 路径 → 块内 GEN/KILL → 前向迭代式 → 汇合取并 → 不动点集合。<\/p>\n<h2>正向演算（逐步走查）：框架要素与迭代步骤<\/h2>\n<h3>定值编号与静态集合<\/h3>\n<p>每条赋值记一个定值 <span class=\"katex-inline\">d<\/span>。对块 <span class=\"katex-inline\">B<\/span>：<\/p>\n<ul><li>\n<code>GEN[B]<\/code>：<span class=\"katex-inline\">B<\/span> 内产生的定值；\n<\/li><li>\n<code>KILL[B]<\/code>：被 <span class=\"katex-inline\">B<\/span> 内定值覆盖的同变量其他定值。\n<\/ul>\n<h3>迭代式<\/h3>\n<div class=\"katex-block\">\\text{IN}[B] = \\bigcup_{P \\in \\text{pred}(B)} \\text{OUT}[P]<\/div>\n<div class=\"katex-block\">\\text{OUT}[B] = \\text{GEN}[B] \\cup (\\text{IN}[B] - \\text{KILL}[B])<\/div>\n<h3>执行步骤<\/h3>\n<ol><li>\n入口块 IN 置空，其余 IN/OUT 置空。\n<\/li><li>\n按逆后序逐块算 IN、OUT。\n<\/li><li>\n集合变化则标记后继待更新。\n<\/li><li>\n重复到某轮无集合变化，得到不动点。\n<\/ol>\n<h2>具体算例：三块流图两轮迭代手算<\/h2>\n<p>流图：<span class=\"katex-inline\">B_1 \\to B_2<\/span>，<span class=\"katex-inline\">B_1 \\to B_3<\/span>，<span class=\"katex-inline\">B_2 \\to B_3<\/span>。定值：<\/p>\n<pre><code>B1:  d1: x ← 1\n     d2: y ← x\nB2:  d3: x ← 3\nB3:  d4: y ← x<\/code><\/pre>\n<h3>静态 GEN/KILL<\/h3>\n<ul><li>\n<code>GEN[B1] = {d1, d2}<\/code>，<code>KILL[B1] = ∅<\/code>。\n<\/li><li>\n<code>GEN[B2] = {d3}<\/code>；<span class=\"katex-inline\">d_3<\/span> 重定义 <span class=\"katex-inline\">x<\/span>，杀掉同变量的 <span class=\"katex-inline\">d_1<\/span>，<code>KILL[B2] = {d1}<\/code>。\n<\/li><li>\n<code>GEN[B3] = {d4}<\/code>；<span class=\"katex-inline\">d_4<\/span> 重定义 <span class=\"katex-inline\">y<\/span>，杀掉 <span class=\"katex-inline\">d_2<\/span>，<code>KILL[B3] = {d2}<\/code>。\n<\/ul>\n<h3>第一轮<\/h3>\n<ul><li>\n<span class=\"katex-inline\">B_1<\/span>：<code>IN[B1] = ∅<\/code>；<code>OUT[B1] = {d1, d2} ∪ (∅ − ∅) = {d1, d2}<\/code>。\n<\/li><li>\n<span class=\"katex-inline\">B_2<\/span>：<code>IN[B2] = OUT[B1] = {d1, d2}<\/code>；<code>OUT[B2] = {d3} ∪ ({d1, d2} − {d1}) = {d3, d2}<\/code>。\n<\/li><li>\n<span class=\"katex-inline\">B_3<\/span>：<code>IN[B3] = OUT[B1] ∪ OUT[B2] = {d1, d2, d3}<\/code>；<code>OUT[B3] = {d4} ∪ ({d1, d2, d3} − {d2}) = {d1, d3, d4}<\/code>。\n<\/ul>\n<h3>第二轮<\/h3>\n<ul><li>\n<code>IN[B2]<\/code> 仍为 <code>{d1, d2}<\/code>，<code>OUT[B2]<\/code> 仍为 <code>{d3, d2}<\/code>。\n<\/li><li>\n<code>IN[B3] = {d1, d2} ∪ {d3, d2} = {d1, d2, d3}<\/code>，与第一轮相同；<code>OUT[B3]<\/code> 不变。\n<\/ul>\n<p>第二轮无集合变化，到达不动点。读法：<span class=\"katex-inline\">B_3<\/span> 出口 <span class=\"katex-inline\">d_2<\/span> 已被杀掉，<span class=\"katex-inline\">y<\/span> 的定值是 <span class=\"katex-inline\">d_4<\/span>；<span class=\"katex-inline\">x<\/span> 在 <span class=\"katex-inline\">B_3<\/span> 出口可能来自 <span class=\"katex-inline\">d_1<\/span>（经 <span class=\"katex-inline\">B_1<\/span> 直路）或 <span class=\"katex-inline\">d_3<\/span>（经 <span class=\"katex-inline\">B_2<\/span>），两条路径都保留。<\/p>\n<h2>第二算例：循环回边的第二轮传播<\/h2>\n<p>流图：<span class=\"katex-inline\">B_1 \\to B_2<\/span>，<span class=\"katex-inline\">B_2 \\to B_1<\/span>（回边）。<\/p>\n<pre><code>B1:  d1: x ← 0\nB2:  d2: x ← x + 1<\/code><\/pre>\n<p><code>GEN[B1] = {d1}<\/code>，<code>KILL[B1] = ∅<\/code>；<code>GEN[B2] = {d2}<\/code>，<code>KILL[B2] = {d1}<\/code>。<\/p>\n<p>第一轮：<code>IN[B1] = ∅<\/code>，<code>OUT[B1] = {d1}<\/code>；<code>IN[B2] = {d1}<\/code>，<code>OUT[B2] = {d2}<\/code>。<\/p>\n<p>第二轮：回边把 <code>OUT[B2]<\/code> 传回 <span class=\"katex-inline\">B_1<\/span>，<code>IN[B1] = {d2}<\/code>；<code>OUT[B1] = {d1} ∪ ({d2} − ∅) = {d1, d2}<\/code>。<\/p>\n<p>第三轮：<code>IN[B2] = {d1, d2}<\/code>；<code>OUT[B2] = {d2} ∪ ({d1, d2} − {d1}) = {d2}<\/code>。集合不再变化。读法：循环头部 <span class=\"katex-inline\">x<\/span> 可能来自初值 <span class=\"katex-inline\">d_1<\/span>，也可能来自上一轮迭代的 <span class=\"katex-inline\">d_2<\/span>；<span class=\"katex-inline\">B_2<\/span> 出口 <span class=\"katex-inline\">x<\/span> 只由 <span class=\"katex-inline\">d_2<\/span> 到达。<\/p>\n<h2>延伸推演：不动点为什么必然停止<\/h2>\n<p>前向框架中 IN/OUT 只做并集与差集，定值一旦进入集合不会被移出；全集是有限个定值，集合序列单调不减，上界为全部定值集合，因此迭代有限轮次后必然停止。这也是本书把迭代数据流分析称为不动点算法的原因（原书 9.2 节，PDF 第 365 页）。汇合处取并集对应“可能到达”的保守语义：分析宁可多报可能到达的定值，也不漏报；过宽的结论由后续分析再收紧。<\/p>\n<h2>对抗性追问：KILL 漏算会怎样<\/h2>\n<p>若 <span class=\"katex-inline\">d_3<\/span> 重定义 <span class=\"katex-inline\">x<\/span>，KILL 却没列 <span class=\"katex-inline\">d_1<\/span>，<code>OUT[B2]<\/code> 会同时保留 <span class=\"katex-inline\">d_1<\/span> 与 <span class=\"katex-inline\">d_3<\/span>；后续分析以为 <span class=\"katex-inline\">x<\/span> 在 <span class=\"katex-inline\">B_2<\/span> 出口还可能是初值 <span class=\"katex-inline\">d_1<\/span>，常量传播可能把过时常数安到 <span class=\"katex-inline\">x<\/span> 上，改写后的代码在运行时取到错误值。<\/p>\n<p>再追一层：若汇合处不取并集而取交集，只有所有路径都到达的定值被保留；循环与分支路径下大量合法定值被漏掉，冗余与死代码判断偏窄。框架选并集还是交集，由问题方向（前向/后向）与保守语义决定，不能互换。<\/p>\n<h2>延伸推演：迭代顺序、位向量表示与框架性质<\/h2>\n<p>迭代顺序影响收敛速度。前向问题按逆后序（RPO）遍历，前驱尽量先于后继处理，定值一轮就能沿主路径传多步；顺序不好则要多轮才把回边定值带回头部。本书 9.2 节在支配性计算中使用 RPO 顺序，并指出 RPO 并非对所有图都一轮收敛（原书 PDF 第 370 页）。<\/p>\n<p>集合实现上，每个定值占一个位，GEN、KILL、IN、OUT 都是位向量。并集是按位或，差集是按位与非；一轮迭代就是逐块做位运算。位向量长度等于全程序定值数，集合操作代价低，这也是迭代框架能在编译器里落地的工程原因。<\/p>\n<p>框架单调性的另一面：若某问题方向是后向（如活跃变量），迭代式换成先求 OUT 再求 IN，汇合仍取并集；定值是否被杀死、变量是否还被用，块静态集合分别对应 KILL 与 DEF。前向与后向共用同一套不动点结构，只换传播方向与集合名。<\/p>\n<h2>第三算例：汇合块的并集读法<\/h2>\n<p>流图 <span class=\"katex-inline\">B_1 \\to B_3<\/span>，<span class=\"katex-inline\">B_2 \\to B_3<\/span>，<span class=\"katex-inline\">B_3<\/span> 出口使用 <span class=\"katex-inline\">x<\/span>。<span class=\"katex-inline\">B_1<\/span> 定值 <span class=\"katex-inline\">d_1: x \\leftarrow 1<\/span>，<span class=\"katex-inline\">B_2<\/span> 定值 <span class=\"katex-inline\">d_2: x \\leftarrow 2<\/span>，<span class=\"katex-inline\">B_3<\/span> 内无重定义。<\/p>\n<p><code>IN[B3] = OUT[B1] ∪ OUT[B2] = {d1, d2}<\/code>。<span class=\"katex-inline\">B_3<\/span> 不知道实际走哪条前驱路径，两个定值都保留：沿 <span class=\"katex-inline\">B_1<\/span> 来时 <span class=\"katex-inline\">x<\/span> 是 1，沿 <span class=\"katex-inline\">B_2<\/span> 来时 <span class=\"katex-inline\">x<\/span> 是 2。若分析只取一路定值，另一路径上的赋值就被漏掉；并集是“可能到达”的保守表达。读完汇合点之后，<span class=\"katex-inline\">B_3<\/span> 出口 <span class=\"katex-inline\">x<\/span> 的到达集合仍是 <span class=\"katex-inline\">\\{d_1, d_2\\}<\/span>，直到 <span class=\"katex-inline\">B_3<\/span> 内出现 <span class=\"katex-inline\">x<\/span> 的新定值才覆盖。<\/p>\n<h2>对抗性追问：初始化取值不当会怎样<\/h2>\n<p>若入口块 IN 初始化成全集而非空集，第一轮各块 OUT 直接带上全部定值，不动点被推到过宽的集合；后续虽可能收敛，但中间轮次的错误结论若被即时优化引用，就会产出错误代码。前向框架入口无定值，IN 必须从空集起步。<\/p>\n<p>再追一层：KILL 按变量名匹配时，同名静态变量、形参与全局位置若被混为一谈，误杀合法定值或漏杀被覆盖定值都会发生。定值编号与变量作用域对应清楚，KILL 集合才可靠。<\/p>\n<h2>延伸推演：位向量实现与迭代顺序<\/h2>\n<p>集合实现上每个定值占一位，GEN、KILL、IN、OUT 都是位向量；并集按位或，差集按位与非。一轮迭代就是逐块做位运算，位向量长度等于全程序定值数，操作代价低，这是迭代框架能在编译器落地的工程原因。<\/p>\n<p>迭代顺序影响收敛速度：前向问题按逆后序遍历，前驱尽量先于后继处理，定值一轮沿主路径传多步；顺序不好则要多轮才把回边定值带回头部。本书 9.2 节在支配性计算中使用 RPO 顺序，并指出 RPO 并非对所有图都一轮收敛（原书 PDF 第 370 页）。<\/p>\n<p>前向框架中 IN/OUT 只并入新定值、不删除已并入项；定值全集有限，集合序列单调不减，迭代必然停止。这个单调性是不动点存在的基础：不会出现集合来回摇摆导致算法不终止。<\/p>\n<h2>延伸推演：迭代终止与近似不动点<\/h2>\n<p>前向集合沿合并方向单调增长，定值全集有限，序列不可能无限增大；当某轮所有块的 IN/OUT 都与上一轮相同，迭代到达不动点。不动点是数据流方程的最小解：只保留路径上实际到达的定值，不把未被任何路径证明可达的定值并入。<\/p>\n<p>回边使定值能沿循环传回循环头部；RPO 顺序下主路径一轮传多步，回边定值在下一轮带回头部。图中存在不可达块时，其 IN 保持初值，不参与合并；不可达块的定值不出现在任何 OUT 中。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n<code>GEN[B]<\/code> 与 <code>KILL[B]<\/code> 各记录什么，属于块的静态属性还是迭代变量？\n<\/li><li>\n到达定值是前向还是后向问题，汇合处取并集还是交集？\n<\/li><li>\n一轮迭代后怎样判定已经到达不动点？\n<\/li><li>\n循环回边为什么通常需要第二轮才能把定值传回循环头部？\n<\/li><li>\n指针别名或数组下标间接赋值为什么会让 KILL 变保守？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "到达定值分析：迭代框架与不动点"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.370<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">到达定值分析：迭代框架与不动点<\/a><\/span><\/div><h1>活跃变量分析与寄存器压力<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书第 9 章 9.2.2 节，PDF 第 370 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>后端分配寄存器时，编译器必须知道每个程序点哪些变量的值后面还会被用到。一个定值如果在当前点之后不再被引用，留在寄存器里只是占用资源；如果后面还要引用，就不能随便覆盖。活跃变量分析从引用点往回推，算出每个程序点的活跃集合；同一时刻活跃的值越多，寄存器压力越大，超过可用寄存器数就必须有一部分溢到内存。本书 9.2.2 节把活动变量分析作为迭代数据流分析的第二个实例（原书 PDF 第 370 页）。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>活跃变量<\/strong>：在程序点 <span class=\"katex-inline\">p<\/span> 之后的某条路径上还会被引用，且该引用之前没有被重新定值的变量。若先重定值再引用，旧值在 <span class=\"katex-inline\">p<\/span> 点不活跃。<\/p>\n<p><strong>USE[B] / DEF[B]<\/strong>：块 <span class=\"katex-inline\">B<\/span> 内先于任何定值被引用的变量集合（use）；块 <span class=\"katex-inline\">B<\/span> 内定值过的变量集合（def）。<\/p>\n<p><strong>LIVE_IN[B] / LIVE_OUT[B]<\/strong>：块入口/出口的活跃变量集合。后向迭代式：<\/p>\n<div class=\"katex-block\">\\text{LIVE\\_OUT}[B] = \\bigcup_{S \\in \\text{succ}(B)} \\text{LIVE\\_IN}[S]<\/div>\n<div class=\"katex-block\">\\text{LIVE\\_IN}[B] = \\text{USE}[B] \\cup (\\text{LIVE\\_OUT}[B] - \\text{DEF}[B])<\/div>\n<p><strong>寄存器压力<\/strong>：同一程序点同时活跃的变量数量。压力峰值高于可用寄存器数时，该区间需要溢出。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<p>第一步，列出每个块的 USE 与 DEF：块内第一次出现是引用就进 USE，是定值就进 DEF；同一变量先定值后引用，只进 DEF。<\/p>\n<p>第二步，初始化：各块 LIVE_IN、LIVE_OUT 置空。<\/p>\n<p>第三步，按逆后序的反向（后向分析从出口往入口）逐块计算：先由后继 IN 求 OUT，再由 USE、DEF 求 IN。<\/p>\n<p>第四步，集合变化则标记前驱待更新；重复到无变化，得到活跃集合不动点。<\/p>\n<p>第五步，沿 CFG 标出各点活跃集合，峰值即该过程的寄存器压力上界估计。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：变量引用与定值在 CFG 上静态可见；后向沿边传播，汇合处取并集。\n<\/li><li>\n<strong>边界 1：别名引用<\/strong>。经指针或数组元素间接读取，编译器不能确定读的是哪个名字，保守地把相关变量都视为活跃。\n<\/li><li>\n<strong>边界 2：死存储<\/strong>。一个 store 写内存后该内存位置再无人读，这次定值不产生活跃值；活跃分析基于寄存器值，内存死写要另靠冗余消除处理。\n<\/li><li>\n<strong>失败案例：漏算引用<\/strong>。某变量在后续分支被使用，USE 没列入，入口活跃集合漏掉它；分配时该值被覆盖，分支引用时读到旧值。\n<\/li><li>\n<strong>失败案例：定值后引用未排除旧值<\/strong>。变量先被重定值、重定值后再引用，旧值不应算活跃；DEF 应把旧值从 OUT 中减去，减错就高估活跃范围。\n<\/li><li>\n<strong>边界 3：活跃是“可能被用”的保守结论<\/strong>。某变量在不可行路径上被引用，也会被算成活跃；精确到路径的分析代价更高，标准框架不做路径敏感区分。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>活跃变量与到达定值<\/strong>：活跃变量是后向问题，从引用回推定值，回答“这个值还会不会被用”；到达定值是前向问题，从定值推向引用，回答“这个值从哪次赋值来”。两者在同一张 CFG 上方向相反，汇合都取并集。\n<\/li><li>\n<strong>活跃点与活跃范围<\/strong>：单个程序点的活跃集合是快照；从定值到最后一次引用的连续区间是活跃范围（live range），范围重叠即冲突，供寄存器分配建冲突图（见 c10）。\n<\/li><li>\n<strong>局部与全局活跃<\/strong>：块内活跃顺序局部可推；跨块是否活跃要看后继路径。块内用完即弃的临时变量，全局集合中不出现。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c05 的 CFG 与 c06 的数据流迭代框架；USE/DEF 与 GEN/KILL 是同一套块静态集合在后向问题上的对应物。后继：c10 图着色分配以活跃范围为结点建冲突图，溢出代价按活跃区间上的 load/store 估算；c07 的活跃峰值决定 c10 是否必须溢出；c09 死代码消除删除在活跃集合中无引用的定值。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（活跃变量分析与寄存器压力）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：活跃变量后向迭代、手算集合与寄存器压力估计<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要决定哪些值留在寄存器，往回追三层前提：<\/p>\n<ol><li>\n寄存器是有限资源，分配不能凭出现顺序占满。一个值若后面不再被读，占着寄存器没有收益；若后面还要读，覆盖它就会让引用取到旧值。因此先要有一套方法判定每个程序点“哪些值还会被用”。\n<\/li><li>\n“还会不会被用”只能从引用点反推：引用发生在后面，定值是否需要保留取决于路径上是否先遇到引用。这与到达定值方向相反，是后向数据流问题。\n<\/li><li>\n后向传播同样在 CFG 上做，块作为传播单位。块内先列 USE（先引用的变量）与 DEF（定值过的变量），块间沿后继边回推；汇合多条前驱时取并集，保守地保留任何路径上还会被用的变量。\n<\/ol>\n<p>依赖链方向：寄存器保留决策 → 引用点反推 → USE/DEF 静态集合 → 后向迭代式 → 活跃集合不动点 → 压力峰值与溢出依据。<\/p>\n<h2>正向演算（逐步走查）：后向框架与迭代步骤<\/h2>\n<h3>块静态集合<\/h3>\n<ul><li>\n<code>USE[B]<\/code>：块内在第一次定值之前被引用的变量；\n<\/li><li>\n<code>DEF[B]<\/code>：块内被定值过的变量。\n<\/ul>\n<p>同一变量先定值后引用，只进 DEF；先引用后定值，进 USE 也进 DEF。<\/p>\n<h3>迭代式<\/h3>\n<div class=\"katex-block\">\\text{LIVE\\_OUT}[B] = \\bigcup_{S \\in \\text{succ}(B)} \\text{LIVE\\_IN}[S]<\/div>\n<div class=\"katex-block\">\\text{LIVE\\_IN}[B] = \\text{USE}[B] \\cup (\\text{LIVE\\_OUT}[B] - \\text{DEF}[B])<\/div>\n<h3>执行步骤<\/h3>\n<ol><li>\n各块 LIVE_IN、LIVE_OUT 置空。\n<\/li><li>\n从出口块往入口方向逐块计算：先求 OUT，再求 IN。\n<\/li><li>\n集合变化则标记前驱待更新。\n<\/li><li>\n重复到无集合变化，得到不动点。\n<\/ol>\n<h2>具体算例：四块流图活跃集合手算<\/h2>\n<p>流图：<span class=\"katex-inline\">B_1 \\to B_2<\/span>，<span class=\"katex-inline\">B_1 \\to B_3<\/span>，<span class=\"katex-inline\">B_2 \\to B_4<\/span>，<span class=\"katex-inline\">B_3 \\to B_4<\/span>；<span class=\"katex-inline\">B_4<\/span> 为出口块，返回时使用 <span class=\"katex-inline\">x<\/span>。<\/p>\n<pre><code>B1:  x ← x + y\n     if x = 0 goto B3\nB2:  z ← y\n     goto B4\nB3:  y ← z\nB4:  return   /* 使用 x */<\/code><\/pre>\n<h3>USE/DEF<\/h3>\n<ul><li>\n<code>USE[B1] = {x, y}<\/code>，<code>DEF[B1] = {x}<\/code>。\n<\/li><li>\n<code>USE[B2] = {y}<\/code>，<code>DEF[B2] = {z}<\/code>。\n<\/li><li>\n<code>USE[B3] = {z}<\/code>，<code>DEF[B3] = {y}<\/code>。\n<\/li><li>\n<code>USE[B4] = {x}<\/code>，<code>DEF[B4] = ∅<\/code>。\n<\/ul>\n<h3>第一轮（从出口回推）<\/h3>\n<ul><li>\n<span class=\"katex-inline\">B_4<\/span>：<code>OUT[B4] = ∅<\/code>；<code>IN[B4] = {x} ∪ (∅ − ∅) = {x}<\/code>。\n<\/li><li>\n<span class=\"katex-inline\">B_2<\/span>：<code>OUT[B2] = IN[B4] = {x}<\/code>；<code>IN[B2] = {y} ∪ ({x} − {z}) = {y, x}<\/code>。\n<\/li><li>\n<span class=\"katex-inline\">B_3<\/span>：<code>OUT[B3] = IN[B4] = {x}<\/code>；<code>IN[B3] = {z} ∪ ({x} − {y}) = {z, x}<\/code>。\n<\/li><li>\n<span class=\"katex-inline\">B_1<\/span>：<code>OUT[B1] = IN[B2] ∪ IN[B3] = {x, y, z}<\/code>；<code>IN[B1] = {x, y} ∪ ({x, y, z} − {x}) = {x, y, z}<\/code>。\n<\/ul>\n<h3>第二轮<\/h3>\n<ul><li>\n<code>IN[B2]<\/code>、<code>IN[B3]<\/code> 不变；<code>OUT[B1] = {x, y, z}<\/code> 不变，<code>IN[B1]<\/code> 不变。到达不动点。\n<\/ul>\n<p>读法：<span class=\"katex-inline\">B_1<\/span> 入口 <span class=\"katex-inline\">x,y,z<\/span> 都活跃；<span class=\"katex-inline\">B_2<\/span> 出口只有 <span class=\"katex-inline\">x<\/span> 活跃，<span class=\"katex-inline\">y<\/span> 在 <span class=\"katex-inline\">B_2<\/span> 内用完即弃；<span class=\"katex-inline\">B_3<\/span> 出口只有 <span class=\"katex-inline\">x<\/span> 活跃。<span class=\"katex-inline\">z<\/span> 在 <span class=\"katex-inline\">B_1<\/span> 入口活跃，是因为 <span class=\"katex-inline\">B_3<\/span> 路径上 <span class=\"katex-inline\">y \\leftarrow z<\/span> 要引用它。<\/p>\n<h2>第二算例：循环变量的活跃区间<\/h2>\n<pre><code>B1:  i ← 0\nB2:  t ← i &lt; n\n     i ← i + 1\n     if t goto B2\nB3:  return<\/code><\/pre>\n<p><code>USE[B1] = ∅<\/code>，<code>DEF[B1] = {i}<\/code>；<code>USE[B2] = {i, n}<\/code>，<code>DEF[B2] = {i, t}<\/code>；<code>USE[B3] = ∅<\/code>，<code>DEF[B3] = ∅<\/code>。<\/p>\n<p>回推：<code>IN[B3] = ∅<\/code>；<code>OUT[B2] = IN[B3] ∪ IN[B2]<\/code>（回边自指）；<code>IN[B2] = {i, n} ∪ (OUT[B2] − {i, t})<\/code>。迭代后 <span class=\"katex-inline\">i<\/span> 在 <span class=\"katex-inline\">B_2<\/span> 入口与出口都活跃：循环条件引用 <span class=\"katex-inline\">i<\/span>，回边把 <span class=\"katex-inline\">i<\/span> 的活跃性带回头部。<span class=\"katex-inline\">n<\/span> 在 <span class=\"katex-inline\">B_2<\/span> 入口活跃，循环外不需要保留。<\/p>\n<h2>延伸推演：活跃集合到寄存器压力<\/h2>\n<p>把每个程序点的活跃集合大小沿 CFG 描出曲线，峰值就是该过程对寄存器数量的需求上界估计。峰值高于可用寄存器数 <span class=\"katex-inline\">k<\/span> 的区间，必须把部分活跃值溢到内存；活跃范围（定值到最后引用的区间）重叠越多，冲突图越密，着色越可能失败。活跃分析给出“谁需要留”，分配器再决定“留哪个、溢哪个”。<\/p>\n<p>后向框架同样满足单调性：LIVE_IN/LIVE_OUT 只并入变量，全集有限，迭代必然停止。与前向框架的差别只在传播方向与 USE/DEF 对应物。<\/p>\n<h2>对抗性追问：DEF 减错会怎样<\/h2>\n<p>若 <span class=\"katex-inline\">B_2<\/span> 定值了 <span class=\"katex-inline\">z<\/span>，<code>IN[B2]<\/code> 计算时没把 <span class=\"katex-inline\">z<\/span> 从 OUT 减去，<span class=\"katex-inline\">z<\/span> 会被当成出口仍活跃；分配器给 <span class=\"katex-inline\">z<\/span> 保留寄存器，实际 <span class=\"katex-inline\">z<\/span> 在块内已死，寄存器被白占。反向情形：USE 漏列后续分支引用的变量，活跃集合偏小，分配器覆盖该值，分支引用时读到旧数据。<\/p>\n<p>再追一层：汇合处若取交集，只有所有路径都活跃的变量被保留；某条路径专用的活跃值被误杀，同样导致覆盖错误。后向问题汇合取并集，与前向问题一致。<\/p>\n<h2>延伸推演：后向框架的位向量与范围切分<\/h2>\n<p>活跃集合同样用位向量实现：每个变量一位，USE、DEF、LIVE_IN、LIVE_OUT 按位运算。后向迭代先由后继 IN 求 OUT，再由 USE/DEF 求 IN；汇合处取并集，与前向问题方向相反但结构对称。本书 9.2.2 节把活动变量分析作为迭代数据流的第二个实例，与支配性、其他数据流问题共用框架（原书 PDF 第 370 页）。<\/p>\n<p>活跃集合沿 CFG 描出的曲线可以切成活动范围：定值点起，到最后一次引用点止，区间内该值需要存储位置。范围是寄存器分配的结点单位；两个范围重叠即在冲突图连边。块内用完即弃的临时变量，全局活跃集合中不出现，其范围不跨块。<\/p>\n<h2>第三算例：分支汇合处的活跃回推<\/h2>\n<pre><code>B1:  if c goto B2\nB2:  y ← 1\nB3:  z ← y\nB4:  return   /* 使用 z */<\/code><\/pre>\n<p>边：<span class=\"katex-inline\">B_1 \\to B_2<\/span>，<span class=\"katex-inline\">B_1 \\to B_3<\/span>，<span class=\"katex-inline\">B_2 \\to B_4<\/span>，<span class=\"katex-inline\">B_3 \\to B_4<\/span>。<code>USE[B4] = {z}<\/code>。<\/p>\n<p>回推：<code>IN[B4] = {z}<\/code>；<span class=\"katex-inline\">B_3<\/span> 的 <code>OUT = {z}<\/code>，<code>USE[B3] = {y}<\/code>，<code>DEF[B3] = ∅<\/code>，<code>IN[B3] = {y, z}<\/code>；<span class=\"katex-inline\">B_2<\/span> 的 <code>OUT = {z}<\/code>，<code>USE[B2] = ∅<\/code>，<code>DEF[B2] = {y}<\/code>，<code>IN[B2] = {z}<\/code>；<span class=\"katex-inline\">B_1<\/span> 的 <code>OUT = IN[B2] ∪ IN[B3] = {y, z}<\/code>。<\/p>\n<p>读法：<span class=\"katex-inline\">y<\/span> 只在 <span class=\"katex-inline\">B_3<\/span> 路径活跃，<span class=\"katex-inline\">B_2<\/span> 路径不需要保留 <span class=\"katex-inline\">y<\/span>；但 <span class=\"katex-inline\">B_1<\/span> 作为汇合前驱的上游，<code>OUT<\/code> 取两路并集，<span class=\"katex-inline\">y<\/span> 被纳入。<span class=\"katex-inline\">z<\/span> 两条路径都要传到出口，全程活跃。<\/p>\n<h2>对抗性追问：出口根漏标会怎样<\/h2>\n<p>活跃分析从出口、返回值、外部使用这些“根”反向标记。若出口使用的变量没列入 USE，回推链从出口就断了，前面所有定值被判为不活跃；分配器覆盖这些值，出口引用时取旧数据。反过来，把已死的存储值当成活跃保留，寄存器被白占，压力虚高。<\/p>\n<p>再追一层：后向汇合若取交集，只有所有路径都活跃的变量留下；某条路径专用的活跃值被误杀。后向问题汇合同样取并集，保守保留任何路径上还会被用的变量。<\/p>\n<h2>延伸推演：活跃集合到活动范围的切分<\/h2>\n<p>活跃集合沿 CFG 描出的曲线可以切成活动范围：定值点起到最后一次引用点止，区间内该值需要存储位置。范围是寄存器分配的结点单位；两个范围重叠即在冲突图连边。块内用完即弃的临时变量，全局活跃集合中不出现，其范围不跨块。<\/p>\n<p>后向集合同样用位向量实现，每个变量一位；USE、DEF、LIVE_IN、LIVE_OUT 按位运算。后向迭代先由后继 IN 求 OUT，再由 USE/DEF 求 IN，与前向问题方向相反、结构对称。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nUSE[B] 与 DEF[B] 怎样区分一个变量在块内先被引用还是先被定值？\n<\/li><li>\n活跃变量分析是前向还是后向问题，迭代式先算 OUT 还是先算 IN？\n<\/li><li>\n一个变量先被重定值、重定值后再引用，旧值在该点是否活跃？\n<\/li><li>\n寄存器压力峰值从什么集合的什么量读出？\n<\/li><li>\n指针别名引用为什么会让活跃集合偏保守？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "活跃变量分析与寄存器压力"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.384<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">到达定值分析：迭代框架与不动点<\/a><\/span><\/div><h1>SSA 形式与 φ 函数放置<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2 章（原书第 9 章 9.3.3 节，PDF 第 384 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>普通三地址码里，同一个名字 <span class=\"katex-inline\">x<\/span> 可能在多个块被赋值，后面的引用到底读哪一次定值，要沿 CFG 路径查到达定值。定义-使用链一对多，常量传播、寄存器分配这类分析只能在并集上保守推断。静态单赋值（SSA）形式把每个变量的多次定值拆成不同版本，每个版本只被定值一次；控制流汇合处来自不同前驱的版本，用一个选择运算 φ 函数显式挑出。定义-使用关系变成一对一，后续分析可以直接沿版本号追踪。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>SSA 形式<\/strong>：IR 中每个名字只被定值一次；多次定值产生 <span class=\"katex-inline\">x_1, x_2, \\dots<\/span> 等版本号，引用处按版本对应取值。<\/p>\n<p><strong>φ 函数<\/strong>：写为 <span class=\"katex-inline\">v_0 \\leftarrow \\phi(v_1, v_2)<\/span>，表示按控制流来自哪条前驱路径，选择对应前驱传来的版本；φ 出现在控制流合并块中（原书 9.3.3 节，PDF 第 384 页）。<\/p>\n<p><strong>支配边界<\/strong>：块 <span class=\"katex-inline\">B<\/span> 的支配边界是这样的块集合：<span class=\"katex-inline\">B<\/span> 支配其中某前驱，但 <span class=\"katex-inline\">B<\/span> 不严格支配该块。一个变量在 <span class=\"katex-inline\">B<\/span> 被定值，所有支配边界块都可能需要 φ。<\/p>\n<p><strong>放置依据<\/strong>：若一个块有多个前驱，且变量在不同路径上被定值，合并块就需要插入 φ；本书图 9-9 给出插入 φ 函数的算法，用 Global（全局定值集合）、Varkill（当前块已杀死的变量）、LiveOut 与 Worklist 推进（原书 PDF 第 384 页）。<\/p>\n<p><strong>重命名<\/strong>：插完 φ 后，沿支配树把每个定值版本号传到后续引用，同一版本的定值与引用挂到同一个名字上。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<p>第一步，找全局定值：对每个变量，列出它在哪些基本块被定值。<\/p>\n<p>第二步，迭代放置 φ：取一个含该变量定值的块 <span class=\"katex-inline\">B<\/span>，遍历 <span class=\"katex-inline\">B<\/span> 的支配边界块 <span class=\"katex-inline\">M<\/span>；若 <span class=\"katex-inline\">M<\/span> 还没有该变量的 φ，插入 φ，并把 <span class=\"katex-inline\">M<\/span> 加入工作列表继续向外传播。<\/p>\n<p>第三步，检查 φ 是否必要：若某块中变量已被定值（Varkill 记录），不再向外为它插 φ；LiveOut 记录块出口仍活跃的变量，只对活跃变量插 φ。<\/p>\n<p>第四步，重命名：按支配树顺序遍历，定值处生成新版本号，引用处替换为对应版本；φ 的参数填入各前驱传来的版本。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：标量局部变量；控制流图可静态计算支配关系；变量定值与引用可见。\n<\/li><li>\n<strong>边界 1：内存与数组通常不做 SSA<\/strong>。数组元素、堆对象经别名访问，拆版本会破坏内存语义；SSA 一般只覆盖标量名字。\n<\/li><li>\n<strong>边界 2：φ 是 IR 层选择运算<\/strong>。φ 不对应一条真实机器指令， lowering 回普通 IR 或生成代码时，要把 φ 拆成各路径上的赋值与选择。\n<\/li><li>\n<strong>失败案例：漏插 φ<\/strong>。汇合块里同名变量来自两条路径的不同版本，分析把它们当成一次定值；常量传播把某条路径的常数误安到另一条路径。\n<\/li><li>\n<strong>失败案例：φ 插在非必要块<\/strong>。变量在该块已被定值或出口不活跃，多余 φ 增加 IR 体积，重命名后产生无意义版本复制。\n<\/li><li>\n<strong>边界 3：循环头部天然需要 φ<\/strong>。循环回边带回上一轮迭代版本，头部 φ 在初值与回边版本之间选择；这是 SSA 处理循环变量的标准形态。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>SSA 与三地址码<\/strong>：三地址码是线性 IR 格式，名字可被多次定值；SSA 是在 IR 上施加的单赋值约束与版本拆分。SSA 指令本身仍是三地址形式，只是每个定值名字唯一。\n<\/li><li>\n<strong>φ 函数与普通赋值<\/strong>：普通赋值按一条指令的右部算结果；φ 的右部选择依赖来源路径，不读某个固定操作数。φ 不能在机器上直接执行，是分析期的表示手段。\n<\/li><li>\n<strong>支配边界与前驱集合<\/strong>：前驱集合是 CFG 上直接相连的块；支配边界按支配关系算出，比“有多个前驱”更精确——只有定值影响能传到的汇合块才需要 φ。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c05 的 CFG 提供块与边，c06 的到达定值判断定值覆盖关系；支配性分析在本书 9.2.1 节（PDF 第 367 页起）。后继：c09 常量传播在 SSA 上沿版本一对一传播常数，死代码消除删除无版本引用的定值；c10 寄存器分配可利用 SSA 版本的定义-使用链简化冲突判断。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（SSA 形式与 φ 函数放置）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：φ 放置的支配边界算法、汇合算例与循环形态<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要让定义-使用链一对一，往回追三层前提：<\/p>\n<ol><li>\n普通 IR 里同名多次定值，引用处要沿路径查“值来自哪次赋值”。一对多的到达关系让常量传播只能取并集保守推断：某路径是常数、另一路径不是，并集就不是常数。\n<\/li><li>\n把每次定值拆成独立版本，引用就能直接挂到版本上；前提是控制流汇合处必须显式记录“版本按路径选择”，否则不同前驱的版本在汇合后混在一个名字里。\n<\/li><li>\n哪些汇合块需要这种选择，不能只看“有多个前驱”，要按支配关系算支配边界：定值块能影响到的汇合点才插 φ。支配关系本身来自 CFG 上的必经路径分析。\n<\/ol>\n<p>依赖链方向：多版本定值需求 → CFG 支配关系 → 支配边界定位汇合块 → φ 插入 → 版本重命名 → 一对一使用链。<\/p>\n<h2>正向演算（逐步走查）：φ 放置算法<\/h2>\n<h3>准备集合<\/h3>\n<ul><li>\n<code>Global<\/code>：被该变量定值过的全部块；\n<\/li><li>\n<code>Varkill<\/code>：当前块内已定值该变量的块；\n<\/li><li>\n<code>LiveOut<\/code>：块出口仍活跃的变量；\n<\/li><li>\n<code>Worklist<\/code>：待处理的定值块列表（原书图 9-9，PDF 第 384 页）。\n<\/ul>\n<h3>插入主循环<\/h3>\n<pre><code>for 每个变量 x:\n    Global ← 定义 x 的块集合\n    Worklist ← Global\n    Varkill ← ∅\n    while Worklist 非空:\n        b ← 取出 Worklist 中一块\n        for m ∈ 支配边界(b):\n            if x ∉ φ(m):\n                插入 x ← φ(...) 于 m\n                if m ∉ Varkill:\n                    Worklist ← Worklist ∪ {m}\n            Varkill ← Varkill ∪ {m}<\/code><\/pre>\n<p>φ 插完后做重命名：沿支配树遍历，定值处生成新版本号，引用处替换为对应版本，φ 的参数依次填各前驱传来的版本。<\/p>\n<h3>支配边界的含义<\/h3>\n<p>块 <span class=\"katex-inline\">m<\/span> 在 <span class=\"katex-inline\">b<\/span> 的支配边界上，当且仅当 <span class=\"katex-inline\">b<\/span> 支配 <span class=\"katex-inline\">m<\/span> 的某个前驱，但 <span class=\"katex-inline\">b<\/span> 不严格支配 <span class=\"katex-inline\">m<\/span>。直观上：从 <span class=\"katex-inline\">b<\/span> 的定值出发，控制流在 <span class=\"katex-inline\">m<\/span> 处可能绕过 <span class=\"katex-inline\">b<\/span> 到达，<span class=\"katex-inline\">m<\/span> 是两种来源的汇合点。<\/p>\n<h2>具体算例：双路汇合插 φ<\/h2>\n<pre><code>B1:  x ← 1\nB2:  x ← 2\nB3:  (汇合块)\nB4:  y ← x + 1<\/code><\/pre>\n<p>边：<span class=\"katex-inline\">B_1 \\to B_3<\/span>，<span class=\"katex-inline\">B_2 \\to B_3<\/span>，<span class=\"katex-inline\">B_3 \\to B_4<\/span>。<\/p>\n<p>第一步，定值块 <code>Global = {B1, B2}<\/code>。<\/p>\n<p>第二步，<span class=\"katex-inline\">B_1<\/span> 的支配边界含 <span class=\"katex-inline\">B_3<\/span>（<span class=\"katex-inline\">B_3<\/span> 前驱 <span class=\"katex-inline\">B_1<\/span> 被 <span class=\"katex-inline\">B_1<\/span> 支配，但 <span class=\"katex-inline\">B_1<\/span> 不支配 <span class=\"katex-inline\">B_3<\/span>）；<span class=\"katex-inline\">B_2<\/span> 的支配边界也含 <span class=\"katex-inline\">B_3<\/span>。<\/p>\n<p>第三步，<span class=\"katex-inline\">B_3<\/span> 还没有 <span class=\"katex-inline\">x<\/span> 的 φ，插入 <span class=\"katex-inline\">x_3 \\leftarrow \\phi(x_1, x_2)<\/span>，参数顺序对应前驱 <span class=\"katex-inline\">B_1<\/span>、<span class=\"katex-inline\">B_2<\/span>。<\/p>\n<p>第四步，重命名：<span class=\"katex-inline\">B_1<\/span> 的定值为 <span class=\"katex-inline\">x_1<\/span>，<span class=\"katex-inline\">B_2<\/span> 的定值为 <span class=\"katex-inline\">x_2<\/span>，<span class=\"katex-inline\">B_4<\/span> 中 <span class=\"katex-inline\">x<\/span> 引用替换为 <span class=\"katex-inline\">x_3<\/span>。<\/p>\n<p>读法：<span class=\"katex-inline\">B_3<\/span> 之后 <span class=\"katex-inline\">x<\/span> 是 φ 选择的版本；<span class=\"katex-inline\">x_1<\/span> 只在 <span class=\"katex-inline\">B_1<\/span> 路径有效，<span class=\"katex-inline\">x_2<\/span> 只在 <span class=\"katex-inline\">B_2<\/span> 路径有效，不会混为一次定值。<\/p>\n<h2>第二算例：循环头部的 φ<\/h2>\n<pre><code>B1:  i ← 0\nB2:  i ← φ(i₀, i₁)\n     i₂ ← i + 1\n     if t goto B2\nB3:  ...<\/code><\/pre>\n<p>边：<span class=\"katex-inline\">B_1 \\to B_2<\/span>，<span class=\"katex-inline\">B_2 \\to B_2<\/span>（回边），<span class=\"katex-inline\">B_2 \\to B_3<\/span>。<\/p>\n<p>第一步，定值块含 <span class=\"katex-inline\">B_1<\/span>（<span class=\"katex-inline\">i_0<\/span>）与 <span class=\"katex-inline\">B_2<\/span>（<span class=\"katex-inline\">i_2<\/span>）。<\/p>\n<p>第二步，循环头部 <span class=\"katex-inline\">B_2<\/span> 是 <span class=\"katex-inline\">B_1<\/span> 定值与回边定值的汇合点，插入 <span class=\"katex-inline\">i \\leftarrow \\phi(i_0, i_2)<\/span>：第一参数来自入口 <span class=\"katex-inline\">B_1<\/span> 的初值，第二参数来自回边 <span class=\"katex-inline\">B_2<\/span> 上一轮的 <span class=\"katex-inline\">i_2<\/span>。<\/p>\n<p>第三步，重命名后，循环体条件引用的是 φ 版本 <span class=\"katex-inline\">i<\/span>，自增定值生成新版本 <span class=\"katex-inline\">i_2<\/span>。<\/p>\n<p>读法：循环变量在头部同时承接初值与上一轮值，φ 把两条时序路径（首轮与迭代轮次）分开；没有这个 φ，循环变量的初值与迭代值会被当成同名定值。<\/p>\n<h2>延伸推演：SSA 让哪些分析变精确<\/h2>\n<p>常量传播沿版本一对一追踪：版本定值是常数且唯一可达，引用处就可替换为常数；同名多定值的并集模糊被消除。寄存器分配在 SSA 上可先按版本的定义-使用链估算冲突，再处理 φ 带来的特殊约束。SSA 也便于支配性、范围检查等分析复用同一套版本编号。<\/p>\n<p>需要注意：SSA 是分析期表示， lowering 回普通 IR 或生成目标代码时，φ 要拆回各路径上的实际选择；内存位置、数组与堆对象一般不拆版本，别名关系仍靠别名分析处理。<\/p>\n<h2>对抗性追问：漏插 φ 会怎样<\/h2>\n<p>若 <span class=\"katex-inline\">B_3<\/span> 漏插 <span class=\"katex-inline\">x<\/span> 的 φ，<span class=\"katex-inline\">B_1<\/span> 的 <span class=\"katex-inline\">x_1<\/span> 与 <span class=\"katex-inline\">B_2<\/span> 的 <span class=\"katex-inline\">x_2<\/span> 在 <span class=\"katex-inline\">B_3<\/span> 之后共用一个名字；分析器以为 <span class=\"katex-inline\">x<\/span> 在 <span class=\"katex-inline\">B_3<\/span> 只有一次定值。常量传播看到 <span class=\"katex-inline\">x_1<\/span> 是常数 1，就可能把 <span class=\"katex-inline\">B_4<\/span> 里的 <span class=\"katex-inline\">x<\/span> 替换成 1，而走 <span class=\"katex-inline\">B_2<\/span> 路径时 <span class=\"katex-inline\">x<\/span> 是 2，程序结果被改变。<\/p>\n<p>再追一层：φ 插在变量已被定值的块，重命名后产生无用版本复制；插在出口不活跃的变量上，多余 φ 不会被任何引用消费，增加 IR 体积与后续分配工作量。放置算法用 Varkill 与 LiveOut 正是为了把这两类多余 φ 排除在外。<\/p>\n<h2>延伸推演：支配性与版本命名规则<\/h2>\n<p>支配关系是 φ 放置的结构基础：块 <span class=\"katex-inline\">d<\/span> 支配块 <span class=\"katex-inline\">m<\/span>，当且仅当从入口到 <span class=\"katex-inline\">m<\/span> 的每条路径都经过 <span class=\"katex-inline\">d<\/span>。定值能唯一传到哪些块，先看支配关系；定值块能绕过到达的汇合点，就是支配边界。本书 9.2.1 节讨论支配性，9.3 节在其上构造 SSA（原书 PDF 第 367、384 页）。<\/p>\n<p>版本命名规则：定值处生成新版本号 <span class=\"katex-inline\">x_i<\/span>；φ 结果是新版本；引用沿支配树向上找到对应定值版本。同一物理名字在不同路径上的版本互不混用；重命名完成后，每个版本的定义点与使用点挂在同一编号下，使用链一对一。<\/p>\n<p>SSA  lowered 回普通 IR 时，φ 要拆成各路径上的实际选择：来自前驱路径的版本在该路径副本中赋值给汇合后的名字。这条逆向转换是后端生成代码前的标准步骤，φ 本身不进机器指令流。<\/p>\n<h2>第三算例：嵌套汇合的两层 φ<\/h2>\n<pre><code>B1:  x ← 1\nB2:  x ← 2\nB3:  x ← φ(x1, x2)\nB4:  x ← 3\nB5:  y ← x<\/code><\/pre>\n<p>边：<span class=\"katex-inline\">B_1 \\to B_3<\/span>，<span class=\"katex-inline\">B_2 \\to B_3<\/span>，<span class=\"katex-inline\">B_3 \\to B_5<\/span>，<span class=\"katex-inline\">B_4 \\to B_5<\/span>。<\/p>\n<p>第一层：<span class=\"katex-inline\">B_3<\/span> 是 <span class=\"katex-inline\">B_1<\/span>、<span class=\"katex-inline\">B_2<\/span> 定值的汇合，插入 <span class=\"katex-inline\">x_3 \\leftarrow \\phi(x_1, x_2)<\/span>。第二层：<span class=\"katex-inline\">B_5<\/span> 前驱是 <span class=\"katex-inline\">B_3<\/span> 与 <span class=\"katex-inline\">B_4<\/span>，<span class=\"katex-inline\">x<\/span> 在两路版本不同，插入 <span class=\"katex-inline\">x_5 \\leftarrow \\phi(x_3, x_4)<\/span>。重命名后，<span class=\"katex-inline\">B_5<\/span> 的 <span class=\"katex-inline\">y<\/span> 引用对应 <span class=\"katex-inline\">x_5<\/span>。两层 φ 分别处理路径汇合与时序汇合，缺一层就会把不同版本混名。<\/p>\n<h2>对抗性追问：重命名遗漏版本会怎样<\/h2>\n<p>若插了 φ 却没沿支配树把定值版本传到后续引用，引用处仍写原名字；分析器看到同名多个定值，回到普通 IR 的一对多状态，SSA 带来的精确性丢失。反过来，把不相关的两个定值强行并入一个版本，跨路径串值，常量传播安错常数。<\/p>\n<p>再追一层：φ 参数顺序必须与前驱块顺序一一对应；顺序错位时，选到的版本来自错误路径，汇合后取值与实际控制流不符。填 φ 参数前先固定各前驱在表中的排列次序。<\/p>\n<h2>延伸推演：重命名遍历与 SSA 回退<\/h2>\n<p>插完 φ 后沿支配树遍历重命名：定值处生成新版本号，引用处替换为对应版本，φ 参数依次填各前驱传来的版本。同一物理名字在不同路径上的版本互不混用；重命名完成后，每个版本定义点与使用点挂在同一编号下，使用链一对一。<\/p>\n<p>SSA 是分析期表示，lowering 回普通 IR 或生成目标代码时，φ 要拆成各路径上的实际选择：来自前驱路径的版本在该路径副本中赋值给汇合后的名字。这条逆向转换是后端生成代码前的标准步骤，φ 本身不进机器指令流。<\/p>\n<p>数组元素、堆对象经别名访问，拆版本会破坏内存语义；SSA 一般只覆盖标量名字，别名关系仍靠别名分析处理。循环头部的 φ 在初值与回边版本之间选择，是 SSA 处理循环变量的标准形态。<\/p>\n<h2>延伸推演：φ 放置的支配边界条件<\/h2>\n<p>φ 只在汇合点放置：一个定值在某支配边界之外仍被使用，才在该边界块插 φ。放置沿支配树与支配边界遍历，先收集各定值的使用位置，向上回溯到边界，在边界块登记 φ。漏放 φ 会让某条路径上的使用取到错误版本；多放 φ 不影响正确性，但增加后续重命名与 lowering 的开销。<\/p>\n<p>重命名阶段为每个版本编号：定值点生成新编号，沿支配树向下传播；遇到 φ，各参数按前驱路径填对应版本。循环头部 φ 的初值来自循环外定值，回边参数来自循环内更新；版本号在迭代中递增，保证不同轮次的同名变量不混。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nSSA 中“每个名字只定值一次”具体指版本号还是原名字？\n<\/li><li>\nφ 函数的参数按什么顺序对应前驱块？\n<\/li><li>\n支配边界块与“有多个前驱的块”差别在哪里？\n<\/li><li>\n循环头部为什么天然需要 φ，它在初值与哪个版本之间选择？\n<\/li><li>\n为什么数组元素与堆对象通常不拆成 SSA 版本？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "SSA 形式与 φ 函数放置"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.413<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">活跃变量分析与寄存器压力<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">SSA 形式与 φ 函数放置<\/a><\/span><\/div><h1>常量传播、死代码消除与优化的可观察行为边界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书第 10 章 10.1、10.2 节，PDF 第 413 页起）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>优化编译器改写代码时，手里有两类工具：把已知常数算进使用点的常量传播，把无引用定值删掉的死代码消除。两类改写都可能走得过头：编译器无法证明某定值不再被读，就把它删掉；或把某条路径的常数安到另一条路径上。优化的底线是不改变程序的可观察行为——所有输入下输出、输入交互、异常等外部可感知结果保持一致。判断一项优化是否可靠，依据是数据流分析能否在编译期证明改写安全；证明不了的事实不能靠猜测补。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>常量传播<\/strong>：若某变量的定值是常数，且该定值在使用点唯一到达，使用处可直接替换为该常数；运算结果为常数时继续向后传播。SSA 形式下版本唯一，传播条件最容易判定（见 c08）。<\/p>\n<p><strong>死代码消除（DCE）<\/strong>：删除在数据流分析中确认没有任何引用的定值；不可达代码指控制流永远到不了的指令序列，一并消除（原书 10.2 节，PDF 第 413 页起）。<\/p>\n<p><strong>可观察行为<\/strong>：程序运行时外部可感知的结果：输出、输入交互、约定的异常或终止；内部寄存器分配、指令顺序属于实现细节，可以改变。<\/p>\n<p><strong>可靠优化<\/strong>：改写前后程序在所有合法输入下可观察行为等价；<strong>不可靠优化<\/strong>：依赖编译期无法证明的假设，可能在某类输入下改变结果。<\/p>\n<p><strong>第 10 章的优化分类<\/strong>：消除无用与不可达代码、代码移动、特化、冗余消除、为其他变换制造时机（原书 10.1 节，PDF 第 413 页）。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<h3>常量传播条件<\/h3>\n<ol><li>\n定值右部是常数，或右部各操作数已知为常数，运算结果可在编译期算出；\n<\/li><li>\n到达使用点的该变量定值唯一（或 SSA 版本唯一）；\n<\/li><li>\n中间没有别名写入同一位置。\n<p>满足后把使用点替换为常数，新产生的常数继续检查后续使用。<\/p>\n<\/ol>\n<h3>死代码消除步骤<\/h3>\n<ol><li>\n标记有外部引用或被后续活跃引用的定值；\n<\/li><li>\n从出口、输入、输出、调用等不可删除的“根”出发，沿使用链反向标记；\n<\/li><li>\n未被标记的定值判定为死代码，删除；\n<\/li><li>\n删除后可能产生新的无引用定值，重复标记-清除直到稳定。\n<\/ol>\n<h3>安全性核对<\/h3>\n<p>每处改写前核对：替换或删除是否影响任何路径的可观察结果；涉及副作用、内存写入、外部调用的指令不能按纯算术定值处理。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：定值与引用在 CFG 上可见；别名关系已由分析给出；优化对象是标量或已确认无别名的位置。\n<\/li><li>\n<strong>边界 1：编译器证明不了就不能删<\/strong>。变量可能被回调、信号处理程序或外部组件读取，编译器看不到这条引用链；此时删除 store 会改变外部可见结果。\n<\/li><li>\n<strong>边界 2：副作用不能提前或消除<\/strong>。含 I/O、内存副作用、未定义行为依赖的表达式，其执行时机与效果属于可观察行为，不能按纯计算常量折叠。\n<\/li><li>\n<strong>失败案例：跨路径常数误传<\/strong>。一条路径定值为常数、另一条路径不是，到达并集上不是唯一常数；强行替换常数，走另一路径时取到错误值。\n<\/li><li>\n<strong>失败案例：删除“看起来没用”的存储<\/strong>。store 写内存后本过程无读取，但外部可能读该位置；只看本过程活跃集合会误判为死代码。\n<\/li><li>\n<strong>边界 3：优化幅度与安全性权衡<\/strong>。激进优化可能依赖更强的分析假设；假设不成立时，错误在运行期暴露，定位困难。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>局部与全局优化<\/strong>：局部优化在单个基本块内成立；全局优化跨块沿 CFG 传播事实。块内定值顺序可见的结论出了块可能失效，不能直接套用到全局。\n<\/li><li>\n<strong>可靠变换与猜测性删除<\/strong>：可靠变换有数据流证明支撑；猜测性删除假定“这个值不会被读”，没有分析证据。后者只能在特定运行环境（如受控沙箱）下有限使用。\n<\/li><li>\n<strong>常量传播与复制传播<\/strong>：常量传播传编译期已知的常数；复制传播把一个变量的定值复制到另一个变量的使用点。两者都是把已知定值前移到使用处，区别在传递的是常数还是另一名字的副本。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c06 到达定值判断定值是否唯一到达，c07 活跃变量判断定值是否还有引用，c08 SSA 版本让传播条件精确。后继：c10 寄存器分配依据活跃与版本信息决定保留哪些值；优化产生的冗余指令减少了后端分配与调度压力。第 4 章 c13 的属性计算结果，是中端翻译与优化的事实来源之一。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（常量传播、死代码消除与优化的可观察行为边界）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：常量传播规则、标记-清除 DCE 与不可靠改写反例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>优化改写要守住行为等价底线，往回追三层前提：<\/p>\n<ol><li>\n优化的收益来自减少指令数、缩短执行路径、压低寄存器与内存占用；但每处改写都先回答“改完程序结果会不会变”。编译器不能运行程序试错，安全性只能靠编译期分析证明。\n<\/li><li>\n证明改写安全需要两类事实：定值从哪来（到达定值），定值还有没有被读（活跃变量）。没有这些事实，删除或替换都缺乏依据。\n<\/li><li>\n分析结论有保守边界：别名、回调、外部组件、不可行路径都会让编译器看不到完整引用链。边界之外不能补假设，只能保留原代码或降级为更弱的优化。\n<\/ol>\n<p>依赖链方向：优化收益需求 → 到达与活跃事实 → 传播/删除条件 → 安全性核对 → 保守边界内执行改写。<\/p>\n<h2>正向演算（逐步走查）：常量传播与 DCE 步骤<\/h2>\n<h3>常量传播判定<\/h3>\n<p>定值 <span class=\"katex-inline\">d: x \\leftarrow e<\/span> 可向使用点 <span class=\"katex-inline\">u<\/span> 传播，当且仅当：<\/p>\n<ol><li>\n<span class=\"katex-inline\">e<\/span> 是常数，或 <span class=\"katex-inline\">e<\/span> 的操作数都已知为常数，编译期可算出结果；\n<\/li><li>\n到达 <span class=\"katex-inline\">u<\/span> 的 <span class=\"katex-inline\">x<\/span> 定值唯一（SSA 版本唯一）；\n<\/li><li>\n中间无别名写入该位置。\n<\/ol>\n<p>满足后 <span class=\"katex-inline\">u<\/span> 处替换为常数；新常数沿使用链继续检查。<\/p>\n<h3>标记-清除 DCE<\/h3>\n<ol><li>\n根标记：输入、输出、外部调用、返回值、不可删除的副作用指令先标记；\n<\/li><li>\n反向遍历使用链：被已标记定值引用的定值标记；\n<\/li><li>\n未标记定值删除；\n<\/li><li>\n删除产生新的无引用定值，重复到稳定。\n<\/ol>\n<h2>具体算例：一段代码的传播与删死代码<\/h2>\n<pre><code>1  a ← 2\n2  b ← a × 3\n3  c ← b + d\n4  e ← 0\n5  call print(c)<\/code><\/pre>\n<p>第一步，<span class=\"katex-inline\">d_1<\/span>：<span class=\"katex-inline\">a<\/span> 定值常数 2。 第二步，<span class=\"katex-inline\">d_2<\/span>：<span class=\"katex-inline\">b \\leftarrow a \\times 3<\/span>，<span class=\"katex-inline\">a<\/span> 已知为 2，编译期算得 <span class=\"katex-inline\">b = 6<\/span>，<span class=\"katex-inline\">b<\/span> 的使用在 <span class=\"katex-inline\">d_3<\/span> 唯一到达。 第三步，<span class=\"katex-inline\">d_3<\/span>：<span class=\"katex-inline\">c \\leftarrow b + d<\/span>，<span class=\"katex-inline\">d<\/span> 未知，<span class=\"katex-inline\">c<\/span> 保留；<span class=\"katex-inline\">c<\/span> 被 <span class=\"katex-inline\">d_5<\/span> 的 print 引用，标记为活。 第四步，<span class=\"katex-inline\">d_4<\/span>：<span class=\"katex-inline\">e \\leftarrow 0<\/span>，反向使用链上没有任何指令引用 <span class=\"katex-inline\">e<\/span>，也不是出口根；未被标记，判定死代码删除。 第五步，删除 <span class=\"katex-inline\">d_4<\/span> 后检查无新孤立定值，DCE 结束。<\/p>\n<p>改写后：<\/p>\n<pre><code>1  b ← 6\n2  c ← b + d\n3  call print(c)<\/code><\/pre>\n<p><code>print(c)<\/code> 的外部调用是根，不能删除；<span class=\"katex-inline\">c<\/span> 经它保持活跃。<\/p>\n<h2>第二算例：不可靠改写的反例<\/h2>\n<p>片段：<\/p>\n<pre><code>1  g ← 100\n2  x ← g + 1\n3  ...  /* 本过程内未再读 g */<\/code><\/pre>\n<p>若仅凭本过程活跃集合判断，<span class=\"katex-inline\">g \\leftarrow 100<\/span> 之后本过程无读取，看似死存储。但 <span class=\"katex-inline\">g<\/span> 是全局/静态位置，可能被信号处理程序、回调或其他编译单元读取。编译器看不到这条引用链，删除 <span class=\"katex-inline\">d_1<\/span> 会让外部读到旧值，属于改变可观察行为。可靠做法：全局位置的 store 不按本过程死代码处理；别名分析能证明无外部读取后，才允许消除。<\/p>\n<p>再看跨路径反例：<\/p>\n<pre><code>B1:  x ← 1\nB2:  x ← y\nB3:  z ← x + 1<\/code><\/pre>\n<p><span class=\"katex-inline\">B_3<\/span> 入口 <span class=\"katex-inline\">x<\/span> 的到达定值是 <span class=\"katex-inline\">\\{x_1, x_2\\}<\/span>，不唯一；<span class=\"katex-inline\">x_1<\/span> 是常数 1，但 <span class=\"katex-inline\">x_2<\/span> 依赖未知 <span class=\"katex-inline\">y<\/span>。并集上 <span class=\"katex-inline\">x<\/span> 不是常数，不能把 <span class=\"katex-inline\">z<\/span> 替换成 <span class=\"katex-inline\">1+1<\/span>。<\/p>\n<h2>延伸推演：第 10 章优化分类的定位<\/h2>\n<p>本书把标量优化分成五类（原书 10.1 节，PDF 第 413 页）：<\/p>\n<ol><li>\n消除无用与不可达代码：删除无引用定值与到不了的指令；\n<\/li><li>\n代码移动：把计算移出重复执行的循环或热路径；\n<\/li><li>\n特化：按已知上下文把通用计算收窄为专用版本；\n<\/li><li>\n冗余消除：删除前面已算过且未被改写的重复计算；\n<\/li><li>\n为其他变换制造时机：调整代码形态，让后续优化暴露可识别模式。\n<\/ol>\n<p>每一类执行前都要回到同一道安全性核对：改写是否改变任何合法输入下的输出、输入交互与约定异常。代码移动尤其要核对原位置是否有副作用、移动后定值是否仍在所有路径可用。<\/p>\n<h2>对抗性追问：证明边界外硬删会怎样<\/h2>\n<p>编译器不能证明某变量不再被读，却把它的 store 删掉；运行时外部组件读到该位置，值是删除前的旧数据，输出错误且故障点远离删除指令。这类错误在测试中可能只在特定回调时序下出现，难以复现。<\/p>\n<p>再追一层：常量折叠把含浮点、未定义行为的表达式按纯算术算掉，可能改变语言规定的求值语义；副作用表达式的执行时机本身可观察，不能为了省指令提前或消除。优化只能改变内部实现，不能越过可观察行为这条线。<\/p>\n<h2>延伸推演：各类优化依赖的数据流事实<\/h2>\n<p>五类标量优化各自站在不同分析事实上。消除无用代码依赖活跃变量：定值在所有路径都无引用才可删；不可达代码依赖 CFG 可达性：到不了的块整段消除。代码移动依赖到达定值与循环结构：把循环内重复计算移到循环外，前提是定值在循环内不变且移动后仍所有路径可用。特化依赖上下文已知的类型与值：按已知收窄通用计算。冗余消除依赖到达定值：前面算过同一表达式且中间未改写，重复计算可删。<\/p>\n<p>可靠性核对贯穿每一类：代码移动不改变副作用时机，冗余消除确认中间无改写，特化不把分支专用假设套到通用路径。优化顺序也相互影响：先传播常量可能暴露新的死代码，先删死代码可能让冗余判断更干净；本书 10.6 节讨论为其他变换制造时机的优化（原书 PDF 第 425 页起）。<\/p>\n<h2>第三算例：冗余计算为什么不能直接删<\/h2>\n<pre><code>1  t1 ← a + b\n2  ...\n3  t2 ← a + b<\/code><\/pre>\n<p>删除 <span class=\"katex-inline\">t_2<\/span> 的前提是：从 <span class=\"katex-inline\">t_1<\/span> 到 <span class=\"katex-inline\">t_2<\/span> 的所有路径上，<span class=\"katex-inline\">a<\/span>、<span class=\"katex-inline\">b<\/span> 都没被重新定值，且两表达式操作数逐项相同。若中间某分支改写了 <span class=\"katex-inline\">a<\/span>，<span class=\"katex-inline\">t_1<\/span> 的结果不再可用，<span class=\"katex-inline\">t_2<\/span> 不是冗余；到达定值分析把这种覆盖路径标出。证明不了“中间未改写”，就保留第二次计算。<\/p>\n<p>复制传播与常量传播相邻：<span class=\"katex-inline\">y \\leftarrow x<\/span> 后 <span class=\"katex-inline\">x<\/span> 未改，<span class=\"katex-inline\">y<\/span> 的使用可换成 <span class=\"katex-inline\">x<\/span>；这要求 <span class=\"katex-inline\">x<\/span> 的定值到达 <span class=\"katex-inline\">y<\/span> 的使用点且唯一。两类传播都把已知定值前移，区别只在传递常数还是副本名字。<\/p>\n<h2>对抗性追问：含副作用表达式为什么不能折叠<\/h2>\n<p>浮点运算的舍入、溢出异常，表达式中的 I/O、内存写入，其执行时机与结果属于可观察行为。把这类表达式按纯算术在编译期算掉，可能改变语言规定的求值顺序或异常触发时机；即使数学上等价，编译器也不能越线。未定义行为依赖的表达式更不能用来支撑优化：源码触及未定义行为时，语言规范不保证任何执行结果，编译器不能据此假设某分支必然成立。<\/p>\n<p>再追一层：别名分析证明不了某 store 不被外部读取时，保守做法是保留 store；分析精度不足时宁可少优化，不可改结果。优化器的“稳妥”定义是：改写后程序在所有合法输入下外部行为等价，而不是指令越少越好。<\/p>\n<h2>延伸推演：各类优化站在什么数据流事实上<\/h2>\n<p>消除无用代码依赖活跃变量：定值在所有路径都无引用才可删；不可达代码依赖 CFG 可达性：到不了的块整段消除。代码移动依赖到达定值与循环结构：循环内重复计算移到循环外，前提是定值循环内不变且移动后所有路径可用。特化依赖上下文已知类型与值；冗余消除依赖到达定值：前面算过同一表达式且中间未改写，重复计算可删。<\/p>\n<p>传播链上，常量传播传编译期已知常数，复制传播传另一名字的副本；两者都把已知定值前移到使用处。先传播常量可能暴露新死代码，先删死代码可能让冗余判断更干净，优化顺序相互影响，本书 10.6 节讨论为其他变换制造时机的优化（原书 PDF 第 425 页起）。<\/p>\n<p>可靠性核对贯穿每一类：代码移动不改变副作用时机，冗余消除确认中间无改写，特化不把分支专用假设套到通用路径。编译器证明不了某定值不再被读，就不能删除；分析精度不足时宁可少优化，不可改结果。<\/p>\n<h2>第三算例：常量传播一轮迭代<\/h2>\n<p>基本块内：<\/p>\n<pre><code>a ← 10\nb ← a + 5\nc ← b * 2\nd ← c<\/code><\/pre>\n<p>常量传播逐定值跟踪已知常数：<code>a<\/code> 定值 10；<code>b ← a+5<\/code> 代入得 15；<code>c ← b*2<\/code> 代入得 30；<code>d ← c<\/code> 复制传播得 30。若后续 <code>d<\/code> 只被引用一次且引用处可用常数 30 替换，<code>d<\/code> 的定值成为死代码候选；活跃变量分析确认 <code>d<\/code> 无其他引用后删除。<\/p>\n<p>传播中断条件：定值来自未知输入、函数调用、别名写入，或路径上存在另一未知定值覆盖；此时该变量在该点标记为未知，不强行代入。<\/p>\n<h2>延伸推演：优化可靠性的核对清单<\/h2>\n<p>每类优化落地前核对：定值是否在所有到达路径上一致；被移动计算的副作用是否在原位置与新位置都可观察；被删除代码是否在任何路径都无引用；被特化的假设是否覆盖实际执行路径。清单任一项不满足，变换不执行。<\/p>\n<p>优化按数据流事实分层：局部优化只看单块内定值顺序；全局优化跨块用 CFG 与迭代分析；过程间优化跨调用图。范围越大，分析代价与保守程度越高；编译器先做局部安全变换，再在全局分析支持下做更激进的移动与消除。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n常量传播要求定值在使用点唯一到达，在 SSA 上为什么最容易满足？\n<\/li><li>\nDCE 标记-清除的“根”包含哪些不可删除的对象？\n<\/li><li>\n全局位置的 store 为什么不能只按本过程活跃集合判死？\n<\/li><li>\n到达定值不唯一时，为什么不能把其中常数版本安到使用点？\n<\/li><li>\n代码移动前需要核对哪两类安全性条件？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "常量传播、死代码消除与优化的可观察行为边界"}, "c10": {"html": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.528<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">活跃变量分析与寄存器压力<\/a><\/span><\/div><h1>图着色寄存器分配与溢出代价<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3 章（原书第 13 章 13.4.2、13.4.3、13.4.4 节，PDF 第 527、528、530 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>处理器寄存器数量有限，程序里同时活跃的定值往往超过可用寄存器。寄存器分配要决定哪些活动范围占用寄存器，指派要决定每个范围落到哪个具体寄存器。若所有范围都硬塞进寄存器，后分配的范围覆盖先分配者的值，引用被覆盖定值时读到错误数据。图着色方法把活动范围之间的冲突建成图，着色需要的颜色数对应同时占用的寄存器数；颜色数超过 <span class=\"katex-inline\">k<\/span> 时，代价最低的范围溢出到内存，在使用前插入 load、定值后插入 store。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>活动范围（live range）<\/strong>：一个定值从定义点到最后一次引用点之间的区间；区间内该值需要占用存储位置。<\/p>\n<p><strong>冲突图<\/strong>：图 <span class=\"katex-inline\">(N, E)<\/span>，结点是活动范围；两个范围生命周期重叠，连一条边。同一寄存器不能同时装两个冲突范围（原书 13.4.3 节，PDF 第 528 页）。<\/p>\n<p><strong>度数<\/strong>：结点的边数，即与它冲突的范围数量；度数大于等于可用寄存器数 <span class=\"katex-inline\">k<\/span> 的范围，简单着色无法直接安排。<\/p>\n<p><strong><span class=\"katex-inline\">k<\/span>-着色<\/strong>：给图中每个结点分配颜色，相邻结点颜色不同；颜色对应物理寄存器。图的色数是着色所需最少颜色数。<\/p>\n<p><strong>溢出（spill）<\/strong>：寄存器不足时把部分活动范围降级到内存：定值后插 store，使用前插 load；溢出后拆分范围，重新建图着色。<\/p>\n<p><strong>溢出代价<\/strong>：范围溢出后相关 load/store 按执行频率加权的成本；循环内访问权重高，循环外权重低（原书 13.4.2 节，PDF 第 527 页）。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<p>第一步，由活跃分析结果划分活动范围，标出每个范围的起点、终点。<\/p>\n<p>第二步，建冲突图：逐对检查范围生命周期，重叠即在 <span class=\"katex-inline\">E<\/span> 中加边。<\/p>\n<p>第三步，简化：挑出度数小于 <span class=\"katex-inline\">k<\/span> 的结点压入栈，从图中移除；移除后相邻结点度数下降，可能继续可移除。<\/p>\n<p>第四步，着色：按出栈逆序给结点分配颜色，先试邻居未用的寄存器；邻居颜色占满 <span class=\"katex-inline\">k<\/span> 个，该范围标记溢出候选。<\/p>\n<p>第五步，估代价：溢出范围的 load/store 按执行频率加权；优先溢出代价最低的范围，插入 load/store 后重建冲突图再着色。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：活动范围已由活跃分析划出；目标寄存器类别统一，可用寄存器数 <span class=\"katex-inline\">k<\/span> 已知。\n<\/li><li>\n<strong>边界 1：图着色是 NP 难问题<\/strong>。一般形式下求最优着色困难，编译器用简化-着色等近似算法；近似结果可能多分配寄存器或多溢出。\n<\/li><li>\n<strong>边界 2：寄存器类别限制<\/strong>。浮点、地址、整数可能分属不同寄存器类别，冲突判断与颜色分配按类别分开；跨类别范围不能共用颜色。\n<\/li><li>\n<strong>失败案例：生命周期判错导致漏边<\/strong>。两范围实际重叠却没连边，着色把它们分到同一寄存器，后写覆盖先写，引用取错值。\n<\/li><li>\n<strong>失败案例：溢出代价按静态次数估算<\/strong>。循环内多次执行的访问与循环外一次访问同权，可能溢出错热路径变量；按执行频率加权才把溢出代价落到真实性能影响上。\n<\/li><li>\n<strong>边界 3：复制合并<\/strong>。副本指令连接的两个范围若不冲突，可合并为一个范围，减少颜色需求；本书 13.4.6 节讨论合并副本以减小度数（PDF 第 533 页起）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>分配与指派<\/strong>：分配决定哪些范围进寄存器；指派决定进寄存器的范围各用哪个物理寄存器。先有分配结果，再做寄存器号映射。\n<\/li><li>\n<strong>局部与全局分配<\/strong>：局部分配只看单个基本块内的活跃范围；全局分配跨块沿 CFG 处理活动范围。本书 13.3 节讨论局部分配，13.4 节进入全局分配（PDF 第 502、509 页起）。\n<\/li><li>\n<strong>溢出与死代码<\/strong>：溢出是值仍被使用、只是暂时放内存；死代码是值不再被引用。溢出范围要补 load/store 维持语义，死代码直接删除。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c07 活跃变量分析给出活跃区间与峰值；c08 SSA 版本简化定值与引用的对应。后继：c11 指令选择产出的表达式与三地址片段决定活动范围边界；c12 指令调度重排顺序时要遵守寄存器分配留下的定值-引用约束。第 4 章调用约定规定的调用者/被调用者保存寄存器，直接影响活动范围在调用点的边界。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（图着色寄存器分配与溢出代价）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：冲突图构建、简化着色与溢出代价手算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>寄存器分配要在有限物理寄存器里安排活跃值，往回追三层前提：<\/p>\n<ol><li>\n后端必须知道每个值在哪些点还需要留在寄存器。这个区间来自活跃变量分析：从定值到最后一次引用的连续段就是活动范围。\n<\/li><li>\n两个范围能否共用寄存器，看生命周期是否重叠；重叠即冲突，必须分开。把冲突关系建成图，寄存器分配就转化为图着色：颜色不同代表寄存器不同。\n<\/li><li>\n颜色数不够时不能硬塞，必须选择部分范围降级到内存。降级选择要算代价：哪些 load/store 会被执行、执行多少次，优先动代价最小的范围。\n<\/ol>\n<p>依赖链方向：活跃区间 → 冲突图 → 简化与着色 → 颜色不足判溢出 → 代价估算选溢出对象 → 重建图再着色。<\/p>\n<h2>正向演算（逐步走查）：建图、简化、着色步骤<\/h2>\n<h3>构建冲突图<\/h3>\n<pre><code>LiveOut ← ∅\nfor 每个基本块 b:\n    for 每条操作 op ∈ b:\n        for 每个范围 lr_i ∈ LiveOut:\n            add 边 (lr_i, lr) 于 E\n        remove lr_i 于 LiveOut\n        add lr_i 于 LiveOut<\/code><\/pre>\n<p>同一操作期间都活跃的范围两两连边；生命周期不相交的范围不连边，可共用寄存器（原书图 13-5，PDF 第 530 页）。<\/p>\n<h3>简化与着色<\/h3>\n<ol><li>\n度数小于 <span class=\"katex-inline\">k<\/span> 的结点压栈，从图中移除；移除后邻居度数下降，重复。\n<\/li><li>\n出栈逆序着色：逐个选邻居未占用的寄存器；<span class=\"katex-inline\">k<\/span> 个颜色被邻居占满，标记溢出候选。\n<\/li><li>\n溢出范围拆分：定值后 store，使用前 load，把范围拆成更短的子范围。\n<\/ol>\n<h3>溢出代价估算<\/h3>\n<p>范围 <span class=\"katex-inline\">r<\/span> 溢出后，相关 load/store 按执行路径频率加权：循环内访问乘高权重，循环外乘低权重。无其他使用的死 load 或死 store 不计入代价（原书 13.4.2 节，PDF 第 527 页）。<\/p>\n<h2>具体算例：三角形冲突图与 <span class=\"katex-inline\">k=2<\/span> 溢出选择<\/h2>\n<p>三个活动范围 <span class=\"katex-inline\">A<\/span>、<span class=\"katex-inline\">B<\/span>、<span class=\"katex-inline\">C<\/span>，两两重叠，冲突边 <span class=\"katex-inline\">AB<\/span>、<span class=\"katex-inline\">BC<\/span>、<span class=\"katex-inline\">AC<\/span>，构成三角形。可用寄存器 <span class=\"katex-inline\">k=2<\/span>。<\/p>\n<p>第一步，色数判断：三角形三个结点两两相邻，着色至少需要 3 种颜色；<span class=\"katex-inline\">k=2<\/span> 无法全部装入，必须溢出一个范围。<\/p>\n<p>第二步，估代价：<\/p>\n<ul><li>\n<span class=\"katex-inline\">A<\/span> 在循环体内被反复读写，相关 load/store 执行次数多，代价高；\n<\/li><li>\n<span class=\"katex-inline\">C<\/span> 在循环条件处使用一次，代价中等；\n<\/li><li>\n<span class=\"katex-inline\">B<\/span> 在循环外冷路径使用，代价最低。\n<
