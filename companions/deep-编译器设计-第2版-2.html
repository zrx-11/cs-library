>。汇合块里同名变量来自两条路径的不同版本，分析把它们当成一次定值；常量传播把某条路径的常数误安到另一条路径。\n<\/li><li>\n<strong>失败案例：φ 插在非必要块<\/strong>。变量在该块已被定值或出口不活跃，多余 φ 增加 IR 体积，重命名后产生无意义版本复制。\n<\/li><li>\n<strong>边界 3：循环头部天然需要 φ<\/strong>。循环回边带回上一轮迭代版本，头部 φ 在初值与回边版本之间选择；这是 SSA 处理循环变量的标准形态。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>SSA 与三地址码<\/strong>：三地址码是线性 IR 格式，名字可被多次定值；SSA 是在 IR 上施加的单赋值约束与版本拆分。SSA 指令本身仍是三地址形式，只是每个定值名字唯一。\n<\/li><li>\n<strong>φ 函数与普通赋值<\/strong>：普通赋值按一条指令的右部算结果；φ 的右部选择依赖来源路径，不读某个固定操作数。φ 不能在机器上直接执行，是分析期的表示手段。\n<\/li><li>\n<strong>支配边界与前驱集合<\/strong>：前驱集合是 CFG 上直接相连的块；支配边界按支配关系算出，比“有多个前驱”更精确——只有定值影响能传到的汇合块才需要 φ。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c05 的 CFG 提供块与边，c06 的到达定值判断定值覆盖关系；支配性分析在本书 9.2.1 节（PDF 第 367 页起）。后继：c09 常量传播在 SSA 上沿版本一对一传播常数，死代码消除删除无版本引用的定值；c10 寄存器分配可利用 SSA 版本的定义-使用链简化冲突判断。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（SSA 形式与 φ 函数放置）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：φ 放置的支配边界算法、汇合算例与循环形态<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要让定义-使用链一对一，往回追三层前提：<\/p>\n<ol><li>\n普通 IR 里同名多次定值，引用处要沿路径查“值来自哪次赋值”。一对多的到达关系让常量传播只能取并集保守推断：某路径是常数、另一路径不是，并集就不是常数。\n<\/li><li>\n把每次定值拆成独立版本，引用就能直接挂到版本上；前提是控制流汇合处必须显式记录“版本按路径选择”，否则不同前驱的版本在汇合后混在一个名字里。\n<\/li><li>\n哪些汇合块需要这种选择，不能只看“有多个前驱”，要按支配关系算支配边界：定值块能影响到的汇合点才插 φ。支配关系本身来自 CFG 上的必经路径分析。\n<\/ol>\n<p>依赖链方向：多版本定值需求 → CFG 支配关系 → 支配边界定位汇合块 → φ 插入 → 版本重命名 → 一对一使用链。<\/p>\n<h2>正向演算（逐步走查）：φ 放置算法<\/h2>\n<h3>准备集合<\/h3>\n<ul><li>\n<code>Global<\/code>：被该变量定值过的全部块；\n<\/li><li>\n<code>Varkill<\/code>：当前块内已定值该变量的块；\n<\/li><li>\n<code>LiveOut<\/code>：块出口仍活跃的变量；\n<\/li><li>\n<code>Worklist<\/code>：待处理的定值块列表（原书图 9-9，PDF 第 384 页）。\n<\/ul>\n<h3>插入主循环<\/h3>\n<pre><code>for 每个变量 x:\n    Global ← 定义 x 的块集合\n    Worklist ← Global\n    Varkill ← ∅\n    while Worklist 非空:\n        b ← 取出 Worklist 中一块\n        for m ∈ 支配边界(b):\n            if x ∉ φ(m):\n                插入 x ← φ(...) 于 m\n                if m ∉ Varkill:\n                    Worklist ← Worklist ∪ {m}\n            Varkill ← Varkill ∪ {m}<\/code><\/pre>\n<p>φ 插完后做重命名：沿支配树遍历，定值处生成新版本号，引用处替换为对应版本，φ 的参数依次填各前驱传来的版本。<\/p>\n<h3>支配边界的含义<\/h3>\n<p>块 <span class=\"katex-inline\">m<\/span> 在 <span class=\"katex-inline\">b<\/span> 的支配边界上，当且仅当 <span class=\"katex-inline\">b<\/span> 支配 <span class=\"katex-inline\">m<\/span> 的某个前驱，但 <span class=\"katex-inline\">b<\/span> 不严格支配 <span class=\"katex-inline\">m<\/span>。直观上：从 <span class=\"katex-inline\">b<\/span> 的定值出发，控制流在 <span class=\"katex-inline\">m<\/span> 处可能绕过 <span class=\"katex-inline\">b<\/span> 到达，<span class=\"katex-inline\">m<\/span> 是两种来源的汇合点。<\/p>\n<h2>具体算例：双路汇合插 φ<\/h2>\n<pre><code>B1:  x ← 1\nB2:  x ← 2\nB3:  (汇合块)\nB4:  y ← x + 1<\/code><\/pre>\n<p>边：<span class=\"katex-inline\">B_1 \\to B_3<\/span>，<span class=\"katex-inline\">B_2 \\to B_3<\/span>，<span class=\"katex-inline\">B_3 \\to B_4<\/span>。<\/p>\n<p>第一步，定值块 <code>Global = {B1, B2}<\/code>。<\/p>\n<p>第二步，<span class=\"katex-inline\">B_1<\/span> 的支配边界含 <span class=\"katex-inline\">B_3<\/span>（<span class=\"katex-inline\">B_3<\/span> 前驱 <span class=\"katex-inline\">B_1<\/span> 被 <span class=\"katex-inline\">B_1<\/span> 支配，但 <span class=\"katex-inline\">B_1<\/span> 不支配 <span class=\"katex-inline\">B_3<\/span>）；<span class=\"katex-inline\">B_2<\/span> 的支配边界也含 <span class=\"katex-inline\">B_3<\/span>。<\/p>\n<p>第三步，<span class=\"katex-inline\">B_3<\/span> 还没有 <span class=\"katex-inline\">x<\/span> 的 φ，插入 <span class=\"katex-inline\">x_3 \\leftarrow \\phi(x_1, x_2)<\/span>，参数顺序对应前驱 <span class=\"katex-inline\">B_1<\/span>、<span class=\"katex-inline\">B_2<\/span>。<\/p>\n<p>第四步，重命名：<span class=\"katex-inline\">B_1<\/span> 的定值为 <span class=\"katex-inline\">x_1<\/span>，<span class=\"katex-inline\">B_2<\/span> 的定值为 <span class=\"katex-inline\">x_2<\/span>，<span class=\"katex-inline\">B_4<\/span> 中 <span class=\"katex-inline\">x<\/span> 引用替换为 <span class=\"katex-inline\">x_3<\/span>。<\/p>\n<p>读法：<span class=\"katex-inline\">B_3<\/span> 之后 <span class=\"katex-inline\">x<\/span> 是 φ 选择的版本；<span class=\"katex-inline\">x_1<\/span> 只在 <span class=\"katex-inline\">B_1<\/span> 路径有效，<span class=\"katex-inline\">x_2<\/span> 只在 <span class=\"katex-inline\">B_2<\/span> 路径有效，不会混为一次定值。<\/p>\n<h2>第二算例：循环头部的 φ<\/h2>\n<pre><code>B1:  i ← 0\nB2:  i ← φ(i₀, i₁)\n     i₂ ← i + 1\n     if t goto B2\nB3:  ...<\/code><\/pre>\n<p>边：<span class=\"katex-inline\">B_1 \\to B_2<\/span>，<span class=\"katex-inline\">B_2 \\to B_2<\/span>（回边），<span class=\"katex-inline\">B_2 \\to B_3<\/span>。<\/p>\n<p>第一步，定值块含 <span class=\"katex-inline\">B_1<\/span>（<span class=\"katex-inline\">i_0<\/span>）与 <span class=\"katex-inline\">B_2<\/span>（<span class=\"katex-inline\">i_2<\/span>）。<\/p>\n<p>第二步，循环头部 <span class=\"katex-inline\">B_2<\/span> 是 <span class=\"katex-inline\">B_1<\/span> 定值与回边定值的汇合点，插入 <span class=\"katex-inline\">i \\leftarrow \\phi(i_0, i_2)<\/span>：第一参数来自入口 <span class=\"katex-inline\">B_1<\/span> 的初值，第二参数来自回边 <span class=\"katex-inline\">B_2<\/span> 上一轮的 <span class=\"katex-inline\">i_2<\/span>。<\/p>\n<p>第三步，重命名后，循环体条件引用的是 φ 版本 <span class=\"katex-inline\">i<\/span>，自增定值生成新版本 <span class=\"katex-inline\">i_2<\/span>。<\/p>\n<p>读法：循环变量在头部同时承接初值与上一轮值，φ 把两条时序路径（首轮与迭代轮次）分开；没有这个 φ，循环变量的初值与迭代值会被当成同名定值。<\/p>\n<h2>延伸推演：SSA 让哪些分析变精确<\/h2>\n<p>常量传播沿版本一对一追踪：版本定值是常数且唯一可达，引用处就可替换为常数；同名多定值的并集模糊被消除。寄存器分配在 SSA 上可先按版本的定义-使用链估算冲突，再处理 φ 带来的特殊约束。SSA 也便于支配性、范围检查等分析复用同一套版本编号。<\/p>\n<p>需要注意：SSA 是分析期表示， lowering 回普通 IR 或生成目标代码时，φ 要拆回各路径上的实际选择；内存位置、数组与堆对象一般不拆版本，别名关系仍靠别名分析处理。<\/p>\n<h2>对抗性追问：漏插 φ 会怎样<\/h2>\n<p>若 <span class=\"katex-inline\">B_3<\/span> 漏插 <span class=\"katex-inline\">x<\/span> 的 φ，<span class=\"katex-inline\">B_1<\/span> 的 <span class=\"katex-inline\">x_1<\/span> 与 <span class=\"katex-inline\">B_2<\/span> 的 <span class=\"katex-inline\">x_2<\/span> 在 <span class=\"katex-inline\">B_3<\/span> 之后共用一个名字；分析器以为 <span class=\"katex-inline\">x<\/span> 在 <span class=\"katex-inline\">B_3<\/span> 只有一次定值。常量传播看到 <span class=\"katex-inline\">x_1<\/span> 是常数 1，就可能把 <span class=\"katex-inline\">B_4<\/span> 里的 <span class=\"katex-inline\">x<\/span> 替换成 1，而走 <span class=\"katex-inline\">B_2<\/span> 路径时 <span class=\"katex-inline\">x<\/span> 是 2，程序结果被改变。<\/p>\n<p>再追一层：φ 插在变量已被定值的块，重命名后产生无用版本复制；插在出口不活跃的变量上，多余 φ 不会被任何引用消费，增加 IR 体积与后续分配工作量。放置算法用 Varkill 与 LiveOut 正是为了把这两类多余 φ 排除在外。<\/p>\n<h2>延伸推演：支配性与版本命名规则<\/h2>\n<p>支配关系是 φ 放置的结构基础：块 <span class=\"katex-inline\">d<\/span> 支配块 <span class=\"katex-inline\">m<\/span>，当且仅当从入口到 <span class=\"katex-inline\">m<\/span> 的每条路径都经过 <span class=\"katex-inline\">d<\/span>。定值能唯一传到哪些块，先看支配关系；定值块能绕过到达的汇合点，就是支配边界。本书 9.2.1 节讨论支配性，9.3 节在其上构造 SSA（原书 PDF 第 367、384 页）。<\/p>\n<p>版本命名规则：定值处生成新版本号 <span class=\"katex-inline\">x_i<\/span>；φ 结果是新版本；引用沿支配树向上找到对应定值版本。同一物理名字在不同路径上的版本互不混用；重命名完成后，每个版本的定义点与使用点挂在同一编号下，使用链一对一。<\/p>\n<p>SSA  lowered 回普通 IR 时，φ 要拆成各路径上的实际选择：来自前驱路径的版本在该路径副本中赋值给汇合后的名字。这条逆向转换是后端生成代码前的标准步骤，φ 本身不进机器指令流。<\/p>\n<h2>第三算例：嵌套汇合的两层 φ<\/h2>\n<pre><code>B1:  x ← 1\nB2:  x ← 2\nB3:  x ← φ(x1, x2)\nB4:  x ← 3\nB5:  y ← x<\/code><\/pre>\n<p>边：<span class=\"katex-inline\">B_1 \\to B_3<\/span>，<span class=\"katex-inline\">B_2 \\to B_3<\/span>，<span class=\"katex-inline\">B_3 \\to B_5<\/span>，<span class=\"katex-inline\">B_4 \\to B_5<\/span>。<\/p>\n<p>第一层：<span class=\"katex-inline\">B_3<\/span> 是 <span class=\"katex-inline\">B_1<\/span>、<span class=\"katex-inline\">B_2<\/span> 定值的汇合，插入 <span class=\"katex-inline\">x_3 \\leftarrow \\phi(x_1, x_2)<\/span>。第二层：<span class=\"katex-inline\">B_5<\/span> 前驱是 <span class=\"katex-inline\">B_3<\/span> 与 <span class=\"katex-inline\">B_4<\/span>，<span class=\"katex-inline\">x<\/span> 在两路版本不同，插入 <span class=\"katex-inline\">x_5 \\leftarrow \\phi(x_3, x_4)<\/span>。重命名后，<span class=\"katex-inline\">B_5<\/span> 的 <span class=\"katex-inline\">y<\/span> 引用对应 <span class=\"katex-inline\">x_5<\/span>。两层 φ 分别处理路径汇合与时序汇合，缺一层就会把不同版本混名。<\/p>\n<h2>对抗性追问：重命名遗漏版本会怎样<\/h2>\n<p>若插了 φ 却没沿支配树把定值版本传到后续引用，引用处仍写原名字；分析器看到同名多个定值，回到普通 IR 的一对多状态，SSA 带来的精确性丢失。反过来，把不相关的两个定值强行并入一个版本，跨路径串值，常量传播安错常数。<\/p>\n<p>再追一层：φ 参数顺序必须与前驱块顺序一一对应；顺序错位时，选到的版本来自错误路径，汇合后取值与实际控制流不符。填 φ 参数前先固定各前驱在表中的排列次序。<\/p>\n<h2>延伸推演：重命名遍历与 SSA 回退<\/h2>\n<p>插完 φ 后沿支配树遍历重命名：定值处生成新版本号，引用处替换为对应版本，φ 参数依次填各前驱传来的版本。同一物理名字在不同路径上的版本互不混用；重命名完成后，每个版本定义点与使用点挂在同一编号下，使用链一对一。<\/p>\n<p>SSA 是分析期表示，lowering 回普通 IR 或生成目标代码时，φ 要拆成各路径上的实际选择：来自前驱路径的版本在该路径副本中赋值给汇合后的名字。这条逆向转换是后端生成代码前的标准步骤，φ 本身不进机器指令流。<\/p>\n<p>数组元素、堆对象经别名访问，拆版本会破坏内存语义；SSA 一般只覆盖标量名字，别名关系仍靠别名分析处理。循环头部的 φ 在初值与回边版本之间选择，是 SSA 处理循环变量的标准形态。<\/p>\n<h2>延伸推演：φ 放置的支配边界条件<\/h2>\n<p>φ 只在汇合点放置：一个定值在某支配边界之外仍被使用，才在该边界块插 φ。放置沿支配树与支配边界遍历，先收集各定值的使用位置，向上回溯到边界，在边界块登记 φ。漏放 φ 会让某条路径上的使用取到错误版本；多放 φ 不影响正确性，但增加后续重命名与 lowering 的开销。<\/p>\n<p>重命名阶段为每个版本编号：定值点生成新编号，沿支配树向下传播；遇到 φ，各参数按前驱路径填对应版本。循环头部 φ 的初值来自循环外定值，回边参数来自循环内更新；版本号在迭代中递增，保证不同轮次的同名变量不混。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nSSA 中“每个名字只定值一次”具体指版本号还是原名字？\n<\/li><li>\nφ 函数的参数按什么顺序对应前驱块？\n<\/li><li>\n支配边界块与“有多个前驱的块”差别在哪里？\n<\/li><li>\n循环头部为什么天然需要 φ，它在初值与哪个版本之间选择？\n<\/li><li>\n为什么数组元素与堆对象通常不拆成 SSA 版本？\n<\/ol><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.413<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">活跃变量分析与寄存器压力<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">SSA 形式与 φ 函数放置<\/a><\/span><\/div><h1>常量传播、死代码消除与优化的可观察行为边界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书第 10 章 10.1、10.2 节，PDF 第 413 页起）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>优化编译器改写代码时，手里有两类工具：把已知常数算进使用点的常量传播，把无引用定值删掉的死代码消除。两类改写都可能走得过头：编译器无法证明某定值不再被读，就把它删掉；或把某条路径的常数安到另一条路径上。优化的底线是不改变程序的可观察行为——所有输入下输出、输入交互、异常等外部可感知结果保持一致。判断一项优化是否可靠，依据是数据流分析能否在编译期证明改写安全；证明不了的事实不能靠猜测补。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>常量传播<\/strong>：若某变量的定值是常数，且该定值在使用点唯一到达，使用处可直接替换为该常数；运算结果为常数时继续向后传播。SSA 形式下版本唯一，传播条件最容易判定（见 c08）。<\/p>\n<p><strong>死代码消除（DCE）<\/strong>：删除在数据流分析中确认没有任何引用的定值；不可达代码指控制流永远到不了的指令序列，一并消除（原书 10.2 节，PDF 第 413 页起）。<\/p>\n<p><strong>可观察行为<\/strong>：程序运行时外部可感知的结果：输出、输入交互、约定的异常或终止；内部寄存器分配、指令顺序属于实现细节，可以改变。<\/p>\n<p><strong>可靠优化<\/strong>：改写前后程序在所有合法输入下可观察行为等价；<strong>不可靠优化<\/strong>：依赖编译期无法证明的假设，可能在某类输入下改变结果。<\/p>\n<p><strong>第 10 章的优化分类<\/strong>：消除无用与不可达代码、代码移动、特化、冗余消除、为其他变换制造时机（原书 10.1 节，PDF 第 413 页）。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<h3>常量传播条件<\/h3>\n<ol><li>\n定值右部是常数，或右部各操作数已知为常数，运算结果可在编译期算出；\n<\/li><li>\n到达使用点的该变量定值唯一（或 SSA 版本唯一）；\n<\/li><li>\n中间没有别名写入同一位置。\n<p>满足后把使用点替换为常数，新产生的常数继续检查后续使用。<\/p>\n<\/ol>\n<h3>死代码消除步骤<\/h3>\n<ol><li>\n标记有外部引用或被后续活跃引用的定值；\n<\/li><li>\n从出口、输入、输出、调用等不可删除的“根”出发，沿使用链反向标记；\n<\/li><li>\n未被标记的定值判定为死代码，删除；\n<\/li><li>\n删除后可能产生新的无引用定值，重复标记-清除直到稳定。\n<\/ol>\n<h3>安全性核对<\/h3>\n<p>每处改写前核对：替换或删除是否影响任何路径的可观察结果；涉及副作用、内存写入、外部调用的指令不能按纯算术定值处理。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：定值与引用在 CFG 上可见；别名关系已由分析给出；优化对象是标量或已确认无别名的位置。\n<\/li><li>\n<strong>边界 1：编译器证明不了就不能删<\/strong>。变量可能被回调、信号处理程序或外部组件读取，编译器看不到这条引用链；此时删除 store 会改变外部可见结果。\n<\/li><li>\n<strong>边界 2：副作用不能提前或消除<\/strong>。含 I/O、内存副作用、未定义行为依赖的表达式，其执行时机与效果属于可观察行为，不能按纯计算常量折叠。\n<\/li><li>\n<strong>失败案例：跨路径常数误传<\/strong>。一条路径定值为常数、另一条路径不是，到达并集上不是唯一常数；强行替换常数，走另一路径时取到错误值。\n<\/li><li>\n<strong>失败案例：删除“看起来没用”的存储<\/strong>。store 写内存后本过程无读取，但外部可能读该位置；只看本过程活跃集合会误判为死代码。\n<\/li><li>\n<strong>边界 3：优化幅度与安全性权衡<\/strong>。激进优化可能依赖更强的分析假设；假设不成立时，错误在运行期暴露，定位困难。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>局部与全局优化<\/strong>：局部优化在单个基本块内成立；全局优化跨块沿 CFG 传播事实。块内定值顺序可见的结论出了块可能失效，不能直接套用到全局。\n<\/li><li>\n<strong>可靠变换与猜测性删除<\/strong>：可靠变换有数据流证明支撑；猜测性删除假定“这个值不会被读”，没有分析证据。后者只能在特定运行环境（如受控沙箱）下有限使用。\n<\/li><li>\n<strong>常量传播与复制传播<\/strong>：常量传播传编译期已知的常数；复制传播把一个变量的定值复制到另一个变量的使用点。两者都是把已知定值前移到使用处，区别在传递的是常数还是另一名字的副本。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c06 到达定值判断定值是否唯一到达，c07 活跃变量判断定值是否还有引用，c08 SSA 版本让传播条件精确。后继：c10 寄存器分配依据活跃与版本信息决定保留哪些值；优化产生的冗余指令减少了后端分配与调度压力。第 4 章 c13 的属性计算结果，是中端翻译与优化的事实来源之一。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（常量传播、死代码消除与优化的可观察行为边界）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：常量传播规则、标记-清除 DCE 与不可靠改写反例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>优化改写要守住行为等价底线，往回追三层前提：<\/p>\n<ol><li>\n优化的收益来自减少指令数、缩短执行路径、压低寄存器与内存占用；但每处改写都先回答“改完程序结果会不会变”。编译器不能运行程序试错，安全性只能靠编译期分析证明。\n<\/li><li>\n证明改写安全需要两类事实：定值从哪来（到达定值），定值还有没有被读（活跃变量）。没有这些事实，删除或替换都缺乏依据。\n<\/li><li>\n分析结论有保守边界：别名、回调、外部组件、不可行路径都会让编译器看不到完整引用链。边界之外不能补假设，只能保留原代码或降级为更弱的优化。\n<\/ol>\n<p>依赖链方向：优化收益需求 → 到达与活跃事实 → 传播/删除条件 → 安全性核对 → 保守边界内执行改写。<\/p>\n<h2>正向演算（逐步走查）：常量传播与 DCE 步骤<\/h2>\n<h3>常量传播判定<\/h3>\n<p>定值 <span class=\"katex-inline\">d: x \\leftarrow e<\/span> 可向使用点 <span class=\"katex-inline\">u<\/span> 传播，当且仅当：<\/p>\n<ol><li>\n<span class=\"katex-inline\">e<\/span> 是常数，或 <span class=\"katex-inline\">e<\/span> 的操作数都已知为常数，编译期可算出结果；\n<\/li><li>\n到达 <span class=\"katex-inline\">u<\/span> 的 <span class=\"katex-inline\">x<\/span> 定值唯一（SSA 版本唯一）；\n<\/li><li>\n中间无别名写入该位置。\n<\/ol>\n<p>满足后 <span class=\"katex-inline\">u<\/span> 处替换为常数；新常数沿使用链继续检查。<\/p>\n<h3>标记-清除 DCE<\/h3>\n<ol><li>\n根标记：输入、输出、外部调用、返回值、不可删除的副作用指令先标记；\n<\/li><li>\n反向遍历使用链：被已标记定值引用的定值标记；\n<\/li><li>\n未标记定值删除；\n<\/li><li>\n删除产生新的无引用定值，重复到稳定。\n<\/ol>\n<h2>具体算例：一段代码的传播与删死代码<\/h2>\n<pre><code>1  a ← 2\n2  b ← a × 3\n3  c ← b + d\n4  e ← 0\n5  call print(c)<\/code><\/pre>\n<p>第一步，<span class=\"katex-inline\">d_1<\/span>：<span class=\"katex-inline\">a<\/span> 定值常数 2。 第二步，<span class=\"katex-inline\">d_2<\/span>：<span class=\"katex-inline\">b \\leftarrow a \\times 3<\/span>，<span class=\"katex-inline\">a<\/span> 已知为 2，编译期算得 <span class=\"katex-inline\">b = 6<\/span>，<span class=\"katex-inline\">b<\/span> 的使用在 <span class=\"katex-inline\">d_3<\/span> 唯一到达。 第三步，<span class=\"katex-inline\">d_3<\/span>：<span class=\"katex-inline\">c \\leftarrow b + d<\/span>，<span class=\"katex-inline\">d<\/span> 未知，<span class=\"katex-inline\">c<\/span> 保留；<span class=\"katex-inline\">c<\/span> 被 <span class=\"katex-inline\">d_5<\/span> 的 print 引用，标记为活。 第四步，<span class=\"katex-inline\">d_4<\/span>：<span class=\"katex-inline\">e \\leftarrow 0<\/span>，反向使用链上没有任何指令引用 <span class=\"katex-inline\">e<\/span>，也不是出口根；未被标记，判定死代码删除。 第五步，删除 <span class=\"katex-inline\">d_4<\/span> 后检查无新孤立定值，DCE 结束。<\/p>\n<p>改写后：<\/p>\n<pre><code>1  b ← 6\n2  c ← b + d\n3  call print(c)<\/code><\/pre>\n<p><code>print(c)<\/code> 的外部调用是根，不能删除；<span class=\"katex-inline\">c<\/span> 经它保持活跃。<\/p>\n<h2>第二算例：不可靠改写的反例<\/h2>\n<p>片段：<\/p>\n<pre><code>1  g ← 100\n2  x ← g + 1\n3  ...  /* 本过程内未再读 g */<\/code><\/pre>\n<p>若仅凭本过程活跃集合判断，<span class=\"katex-inline\">g \\leftarrow 100<\/span> 之后本过程无读取，看似死存储。但 <span class=\"katex-inline\">g<\/span> 是全局/静态位置，可能被信号处理程序、回调或其他编译单元读取。编译器看不到这条引用链，删除 <span class=\"katex-inline\">d_1<\/span> 会让外部读到旧值，属于改变可观察行为。可靠做法：全局位置的 store 不按本过程死代码处理；别名分析能证明无外部读取后，才允许消除。<\/p>\n<p>再看跨路径反例：<\/p>\n<pre><code>B1:  x ← 1\nB2:  x ← y\nB3:  z ← x + 1<\/code><\/pre>\n<p><span class=\"katex-inline\">B_3<\/span> 入口 <span class=\"katex-inline\">x<\/span> 的到达定值是 <span class=\"katex-inline\">\\{x_1, x_2\\}<\/span>，不唯一；<span class=\"katex-inline\">x_1<\/span> 是常数 1，但 <span class=\"katex-inline\">x_2<\/span> 依赖未知 <span class=\"katex-inline\">y<\/span>。并集上 <span class=\"katex-inline\">x<\/span> 不是常数，不能把 <span class=\"katex-inline\">z<\/span> 替换成 <span class=\"katex-inline\">1+1<\/span>。<\/p>\n<h2>延伸推演：第 10 章优化分类的定位<\/h2>\n<p>本书把标量优化分成五类（原书 10.1 节，PDF 第 413 页）：<\/p>\n<ol><li>\n消除无用与不可达代码：删除无引用定值与到不了的指令；\n<\/li><li>\n代码移动：把计算移出重复执行的循环或热路径；\n<\/li><li>\n特化：按已知上下文把通用计算收窄为专用版本；\n<\/li><li>\n冗余消除：删除前面已算过且未被改写的重复计算；\n<\/li><li>\n为其他变换制造时机：调整代码形态，让后续优化暴露可识别模式。\n<\/ol>\n<p>每一类执行前都要回到同一道安全性核对：改写是否改变任何合法输入下的输出、输入交互与约定异常。代码移动尤其要核对原位置是否有副作用、移动后定值是否仍在所有路径可用。<\/p>\n<h2>对抗性追问：证明边界外硬删会怎样<\/h2>\n<p>编译器不能证明某变量不再被读，却把它的 store 删掉；运行时外部组件读到该位置，值是删除前的旧数据，输出错误且故障点远离删除指令。这类错误在测试中可能只在特定回调时序下出现，难以复现。<\/p>\n<p>再追一层：常量折叠把含浮点、未定义行为的表达式按纯算术算掉，可能改变语言规定的求值语义；副作用表达式的执行时机本身可观察，不能为了省指令提前或消除。优化只能改变内部实现，不能越过可观察行为这条线。<\/p>\n<h2>延伸推演：各类优化依赖的数据流事实<\/h2>\n<p>五类标量优化各自站在不同分析事实上。消除无用代码依赖活跃变量：定值在所有路径都无引用才可删；不可达代码依赖 CFG 可达性：到不了的块整段消除。代码移动依赖到达定值与循环结构：把循环内重复计算移到循环外，前提是定值在循环内不变且移动后仍所有路径可用。特化依赖上下文已知的类型与值：按已知收窄通用计算。冗余消除依赖到达定值：前面算过同一表达式且中间未改写，重复计算可删。<\/p>\n<p>可靠性核对贯穿每一类：代码移动不改变副作用时机，冗余消除确认中间无改写，特化不把分支专用假设套到通用路径。优化顺序也相互影响：先传播常量可能暴露新的死代码，先删死代码可能让冗余判断更干净；本书 10.6 节讨论为其他变换制造时机的优化（原书 PDF 第 425 页起）。<\/p>\n<h2>第三算例：冗余计算为什么不能直接删<\/h2>\n<pre><code>1  t1 ← a + b\n2  ...\n3  t2 ← a + b<\/code><\/pre>\n<p>删除 <span class=\"katex-inline\">t_2<\/span> 的前提是：从 <span class=\"katex-inline\">t_1<\/span> 到 <span class=\"katex-inline\">t_2<\/span> 的所有路径上，<span class=\"katex-inline\">a<\/span>、<span class=\"katex-inline\">b<\/span> 都没被重新定值，且两表达式操作数逐项相同。若中间某分支改写了 <span class=\"katex-inline\">a<\/span>，<span class=\"katex-inline\">t_1<\/span> 的结果不再可用，<span class=\"katex-inline\">t_2<\/span> 不是冗余；到达定值分析把这种覆盖路径标出。证明不了“中间未改写”，就保留第二次计算。<\/p>\n<p>复制传播与常量传播相邻：<span class=\"katex-inline\">y \\leftarrow x<\/span> 后 <span class=\"katex-inline\">x<\/span> 未改，<span class=\"katex-inline\">y<\/span> 的使用可换成 <span class=\"katex-inline\">x<\/span>；这要求 <span class=\"katex-inline\">x<\/span> 的定值到达 <span class=\"katex-inline\">y<\/span> 的使用点且唯一。两类传播都把已知定值前移，区别只在传递常数还是副本名字。<\/p>\n<h2>对抗性追问：含副作用表达式为什么不能折叠<\/h2>\n<p>浮点运算的舍入、溢出异常，表达式中的 I/O、内存写入，其执行时机与结果属于可观察行为。把这类表达式按纯算术在编译期算掉，可能改变语言规定的求值顺序或异常触发时机；即使数学上等价，编译器也不能越线。未定义行为依赖的表达式更不能用来支撑优化：源码触及未定义行为时，语言规范不保证任何执行结果，编译器不能据此假设某分支必然成立。<\/p>\n<p>再追一层：别名分析证明不了某 store 不被外部读取时，保守做法是保留 store；分析精度不足时宁可少优化，不可改结果。优化器的“稳妥”定义是：改写后程序在所有合法输入下外部行为等价，而不是指令越少越好。<\/p>\n<h2>延伸推演：各类优化站在什么数据流事实上<\/h2>\n<p>消除无用代码依赖活跃变量：定值在所有路径都无引用才可删；不可达代码依赖 CFG 可达性：到不了的块整段消除。代码移动依赖到达定值与循环结构：循环内重复计算移到循环外，前提是定值循环内不变且移动后所有路径可用。特化依赖上下文已知类型与值；冗余消除依赖到达定值：前面算过同一表达式且中间未改写，重复计算可删。<\/p>\n<p>传播链上，常量传播传编译期已知常数，复制传播传另一名字的副本；两者都把已知定值前移到使用处。先传播常量可能暴露新死代码，先删死代码可能让冗余判断更干净，优化顺序相互影响，本书 10.6 节讨论为其他变换制造时机的优化（原书 PDF 第 425 页起）。<\/p>\n<p>可靠性核对贯穿每一类：代码移动不改变副作用时机，冗余消除确认中间无改写，特化不把分支专用假设套到通用路径。编译器证明不了某定值不再被读，就不能删除；分析精度不足时宁可少优化，不可改结果。<\/p>\n<h2>第三算例：常量传播一轮迭代<\/h2>\n<p>基本块内：<\/p>\n<pre><code>a ← 10\nb ← a + 5\nc ← b * 2\nd ← c<\/code><\/pre>\n<p>常量传播逐定值跟踪已知常数：<code>a<\/code> 定值 10；<code>b ← a+5<\/code> 代入得 15；<code>c ← b*2<\/code> 代入得 30；<code>d ← c<\/code> 复制传播得 30。若后续 <code>d<\/code> 只被引用一次且引用处可用常数 30 替换，<code>d<\/code> 的定值成为死代码候选；活跃变量分析确认 <code>d<\/code> 无其他引用后删除。<\/p>\n<p>传播中断条件：定值来自未知输入、函数调用、别名写入，或路径上存在另一未知定值覆盖；此时该变量在该点标记为未知，不强行代入。<\/p>\n<h2>延伸推演：优化可靠性的核对清单<\/h2>\n<p>每类优化落地前核对：定值是否在所有到达路径上一致；被移动计算的副作用是否在原位置与新位置都可观察；被删除代码是否在任何路径都无引用；被特化的假设是否覆盖实际执行路径。清单任一项不满足，变换不执行。<\/p>\n<p>优化按数据流事实分层：局部优化只看单块内定值顺序；全局优化跨块用 CFG 与迭代分析；过程间优化跨调用图。范围越大，分析代价与保守程度越高；编译器先做局部安全变换，再在全局分析支持下做更激进的移动与消除。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n常量传播要求定值在使用点唯一到达，在 SSA 上为什么最容易满足？\n<\/li><li>\nDCE 标记-清除的“根”包含哪些不可删除的对象？\n<\/li><li>\n全局位置的 store 为什么不能只按本过程活跃集合判死？\n<\/li><li>\n到达定值不唯一时，为什么不能把其中常数版本安到使用点？\n<\/li><li>\n代码移动前需要核对哪两类安全性条件？\n<\/ol><\/div><\/details>", "c10": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.528<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">活跃变量分析与寄存器压力<\/a><\/span><\/div><h1>图着色寄存器分配与溢出代价<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3 章（原书第 13 章 13.4.2、13.4.3、13.4.4 节，PDF 第 527、528、530 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>处理器寄存器数量有限，程序里同时活跃的定值往往超过可用寄存器。寄存器分配要决定哪些活动范围占用寄存器，指派要决定每个范围落到哪个具体寄存器。若所有范围都硬塞进寄存器，后分配的范围覆盖先分配者的值，引用被覆盖定值时读到错误数据。图着色方法把活动范围之间的冲突建成图，着色需要的颜色数对应同时占用的寄存器数；颜色数超过 <span class=\"katex-inline\">k<\/span> 时，代价最低的范围溢出到内存，在使用前插入 load、定值后插入 store。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>活动范围（live range）<\/strong>：一个定值从定义点到最后一次引用点之间的区间；区间内该值需要占用存储位置。<\/p>\n<p><strong>冲突图<\/strong>：图 <span class=\"katex-inline\">(N, E)<\/span>，结点是活动范围；两个范围生命周期重叠，连一条边。同一寄存器不能同时装两个冲突范围（原书 13.4.3 节，PDF 第 528 页）。<\/p>\n<p><strong>度数<\/strong>：结点的边数，即与它冲突的范围数量；度数大于等于可用寄存器数 <span class=\"katex-inline\">k<\/span> 的范围，简单着色无法直接安排。<\/p>\n<p><strong><span class=\"katex-inline\">k<\/span>-着色<\/strong>：给图中每个结点分配颜色，相邻结点颜色不同；颜色对应物理寄存器。图的色数是着色所需最少颜色数。<\/p>\n<p><strong>溢出（spill）<\/strong>：寄存器不足时把部分活动范围降级到内存：定值后插 store，使用前插 load；溢出后拆分范围，重新建图着色。<\/p>\n<p><strong>溢出代价<\/strong>：范围溢出后相关 load/store 按执行频率加权的成本；循环内访问权重高，循环外权重低（原书 13.4.2 节，PDF 第 527 页）。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<p>第一步，由活跃分析结果划分活动范围，标出每个范围的起点、终点。<\/p>\n<p>第二步，建冲突图：逐对检查范围生命周期，重叠即在 <span class=\"katex-inline\">E<\/span> 中加边。<\/p>\n<p>第三步，简化：挑出度数小于 <span class=\"katex-inline\">k<\/span> 的结点压入栈，从图中移除；移除后相邻结点度数下降，可能继续可移除。<\/p>\n<p>第四步，着色：按出栈逆序给结点分配颜色，先试邻居未用的寄存器；邻居颜色占满 <span class=\"katex-inline\">k<\/span> 个，该范围标记溢出候选。<\/p>\n<p>第五步，估代价：溢出范围的 load/store 按执行频率加权；优先溢出代价最低的范围，插入 load/store 后重建冲突图再着色。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：活动范围已由活跃分析划出；目标寄存器类别统一，可用寄存器数 <span class=\"katex-inline\">k<\/span> 已知。\n<\/li><li>\n<strong>边界 1：图着色是 NP 难问题<\/strong>。一般形式下求最优着色困难，编译器用简化-着色等近似算法；近似结果可能多分配寄存器或多溢出。\n<\/li><li>\n<strong>边界 2：寄存器类别限制<\/strong>。浮点、地址、整数可能分属不同寄存器类别，冲突判断与颜色分配按类别分开；跨类别范围不能共用颜色。\n<\/li><li>\n<strong>失败案例：生命周期判错导致漏边<\/strong>。两范围实际重叠却没连边，着色把它们分到同一寄存器，后写覆盖先写，引用取错值。\n<\/li><li>\n<strong>失败案例：溢出代价按静态次数估算<\/strong>。循环内多次执行的访问与循环外一次访问同权，可能溢出错热路径变量；按执行频率加权才把溢出代价落到真实性能影响上。\n<\/li><li>\n<strong>边界 3：复制合并<\/strong>。副本指令连接的两个范围若不冲突，可合并为一个范围，减少颜色需求；本书 13.4.6 节讨论合并副本以减小度数（PDF 第 533 页起）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>分配与指派<\/strong>：分配决定哪些范围进寄存器；指派决定进寄存器的范围各用哪个物理寄存器。先有分配结果，再做寄存器号映射。\n<\/li><li>\n<strong>局部与全局分配<\/strong>：局部分配只看单个基本块内的活跃范围；全局分配跨块沿 CFG 处理活动范围。本书 13.3 节讨论局部分配，13.4 节进入全局分配（PDF 第 502、509 页起）。\n<\/li><li>\n<strong>溢出与死代码<\/strong>：溢出是值仍被使用、只是暂时放内存；死代码是值不再被引用。溢出范围要补 load/store 维持语义，死代码直接删除。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c07 活跃变量分析给出活跃区间与峰值；c08 SSA 版本简化定值与引用的对应。后继：c11 指令选择产出的表达式与三地址片段决定活动范围边界；c12 指令调度重排顺序时要遵守寄存器分配留下的定值-引用约束。第 4 章调用约定规定的调用者/被调用者保存寄存器，直接影响活动范围在调用点的边界。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（图着色寄存器分配与溢出代价）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：冲突图构建、简化着色与溢出代价手算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>寄存器分配要在有限物理寄存器里安排活跃值，往回追三层前提：<\/p>\n<ol><li>\n后端必须知道每个值在哪些点还需要留在寄存器。这个区间来自活跃变量分析：从定值到最后一次引用的连续段就是活动范围。\n<\/li><li>\n两个范围能否共用寄存器，看生命周期是否重叠；重叠即冲突，必须分开。把冲突关系建成图，寄存器分配就转化为图着色：颜色不同代表寄存器不同。\n<\/li><li>\n颜色数不够时不能硬塞，必须选择部分范围降级到内存。降级选择要算代价：哪些 load/store 会被执行、执行多少次，优先动代价最小的范围。\n<\/ol>\n<p>依赖链方向：活跃区间 → 冲突图 → 简化与着色 → 颜色不足判溢出 → 代价估算选溢出对象 → 重建图再着色。<\/p>\n<h2>正向演算（逐步走查）：建图、简化、着色步骤<\/h2>\n<h3>构建冲突图<\/h3>\n<pre><code>LiveOut ← ∅\nfor 每个基本块 b:\n    for 每条操作 op ∈ b:\n        for 每个范围 lr_i ∈ LiveOut:\n            add 边 (lr_i, lr) 于 E\n        remove lr_i 于 LiveOut\n        add lr_i 于 LiveOut<\/code><\/pre>\n<p>同一操作期间都活跃的范围两两连边；生命周期不相交的范围不连边，可共用寄存器（原书图 13-5，PDF 第 530 页）。<\/p>\n<h3>简化与着色<\/h3>\n<ol><li>\n度数小于 <span class=\"katex-inline\">k<\/span> 的结点压栈，从图中移除；移除后邻居度数下降，重复。\n<\/li><li>\n出栈逆序着色：逐个选邻居未占用的寄存器；<span class=\"katex-inline\">k<\/span> 个颜色被邻居占满，标记溢出候选。\n<\/li><li>\n溢出范围拆分：定值后 store，使用前 load，把范围拆成更短的子范围。\n<\/ol>\n<h3>溢出代价估算<\/h3>\n<p>范围 <span class=\"katex-inline\">r<\/span> 溢出后，相关 load/store 按执行路径频率加权：循环内访问乘高权重，循环外乘低权重。无其他使用的死 load 或死 store 不计入代价（原书 13.4.2 节，PDF 第 527 页）。<\/p>\n<h2>具体算例：三角形冲突图与 <span class=\"katex-inline\">k=2<\/span> 溢出选择<\/h2>\n<p>三个活动范围 <span class=\"katex-inline\">A<\/span>、<span class=\"katex-inline\">B<\/span>、<span class=\"katex-inline\">C<\/span>，两两重叠，冲突边 <span class=\"katex-inline\">AB<\/span>、<span class=\"katex-inline\">BC<\/span>、<span class=\"katex-inline\">AC<\/span>，构成三角形。可用寄存器 <span class=\"katex-inline\">k=2<\/span>。<\/p>\n<p>第一步，色数判断：三角形三个结点两两相邻，着色至少需要 3 种颜色；<span class=\"katex-inline\">k=2<\/span> 无法全部装入，必须溢出一个范围。<\/p>\n<p>第二步，估代价：<\/p>\n<ul><li>\n<span class=\"katex-inline\">A<\/span> 在循环体内被反复读写，相关 load/store 执行次数多，代价高；\n<\/li><li>\n<span class=\"katex-inline\">C<\/span> 在循环条件处使用一次，代价中等；\n<\/li><li>\n<span class=\"katex-inline\">B<\/span> 在循环外冷路径使用，代价最低。\n<\/ul>\n<p>第三步，选溢出对象：溢出 <span class=\"katex-inline\">B<\/span>。<span class=\"katex-inline\">B<\/span> 拆分后，<span class=\"katex-inline\">A<\/span> 与 <span class=\"katex-inline\">C<\/span> 在剩余图中不再两两构成三角形，<span class=\"katex-inline\">k=2<\/span> 可着色：<span class=\"katex-inline\">A<\/span> 用寄存器 <span class=\"katex-inline\">R_1<\/span>，<span class=\"katex-inline\">C<\/span> 用寄存器 <span class=\"katex-inline\">R_2<\/span>。<\/p>\n<p>第四步，补 load/store：<span class=\"katex-inline\">B<\/span> 定值后插 store 到内存槽，<span class=\"katex-inline\">B<\/span> 每次使用前插 load。<span class=\"katex-inline\">B<\/span> 原本占的寄存器释放给 <span class=\"katex-inline\">A<\/span>、<span class=\"katex-inline\">C<\/span>。<\/p>\n<p>读法：若误选 <span class=\"katex-inline\">A<\/span> 溢出，循环内每次读写 <span class=\"katex-inline\">A<\/span> 都落到内存，热路径性能损失最大；代价加权的作用就是避开这类选择。<\/p>\n<h2>第二算例：链状冲突图可正常着色<\/h2>\n<p>范围 <span class=\"katex-inline\">A<\/span>、<span class=\"katex-inline\">B<\/span>、<span class=\"katex-inline\">C<\/span>，冲突边只有 <span class=\"katex-inline\">AB<\/span>、<span class=\"katex-inline\">BC<\/span>，<span class=\"katex-inline\">A<\/span> 与 <span class=\"katex-inline\">C<\/span> 不重叠。<span class=\"katex-inline\">k=2<\/span> 足够：<span class=\"katex-inline\">A<\/span> 颜色 1，<span class=\"katex-inline\">B<\/span> 颜色 2，<span class=\"katex-inline\">C<\/span> 颜色 1。<span class=\"katex-inline\">A<\/span> 与 <span class=\"katex-inline\">C<\/span> 生命周期不相交，共用同一寄存器不发生覆盖。<\/p>\n<h2>延伸推演：两类着色顺序与副本合并<\/h2>\n<p>本书区分自顶向下与自底向上着色（原书 13.4.4、13.4.5 节，PDF 第 530 页起）。自顶向下按全局活动范围优先级安排颜色，优先级高、跨度长的范围先选寄存器；自底向上从局部冲突范围向上合并。两种顺序都在简化失败的结点上判溢出，差别在颜色分配的优先级依据。<\/p>\n<p>副本指令连接的两个范围若不冲突，可合并为一个范围：合并后少一个结点、少若干条冲突边，颜色需求下降。复制合并要先确认两范围生命周期不重叠，否则合并会制造错误覆盖。<\/p>\n<p>图着色的一般形式是 NP 难，编译器算法给出的是可行近似；工程上再通过分寄存器类别、压缩 IR 寿命、拆分长范围等手段压低图的复杂度。<\/p>\n<h2>对抗性追问：寄存器不够却不溢出会怎样<\/h2>\n<p>若三个范围冲突、<span class=\"katex-inline\">k=2<\/span>，分配器把三个范围塞进两个寄存器，后写入的范围覆盖先写入者；被覆盖的定值在后续引用时读到错误值。故障表现通常是计算结果错，出错指令与覆盖指令相隔很远，很难从崩溃位置反推。<\/p>\n<p>再追一层：冲突边漏判，两个实际重叠范围被分到同一寄存器，后果同上；冲突边多判，不重叠范围被强制分开，颜色需求虚高，本可避免的溢出被触发。边的判断依据是活跃区间的精确端点。<\/p>\n<h2>延伸推演：简化过程的度数动态更新<\/h2>\n<p>简化阶段每移除一个度数小于 <span class=\"katex-inline\">k<\/span> 的结点，它的邻居度数各降 1；降后小于 <span class=\"katex-inline\">k<\/span> 的邻居继续可移除。栈记录移除次序，着色时逆序弹出。若简化结束仍留结点（度数都不小于 <span class=\"katex-inline\">k<\/span>），这些是溢出候选：图的色数超过可用寄存器数，不可能全部着色。<\/p>\n<p>着色阶段给结点选寄存器时，先扫邻居已占颜色，挑第一个未占用的物理寄存器；<span class=\"katex-inline\">k<\/span> 个颜色全被邻居占满，标记溢出。溢出范围拆分后重新建图：原范围切成定值后 store、使用前 load 的短子范围，子范围冲突更少，可能重新可着色。<\/p>\n<p>寄存器类别按用途分开：整数、浮点、地址指针往往属不同类别；冲突边只在同类范围之间判断，颜色也在同类寄存器内分配。跨类别范围不能共用颜色，混类建模会低估真实冲突。<\/p>\n<h2>第三算例：副本指令的合并<\/h2>\n<p>范围 <span class=\"katex-inline\">A<\/span> 与 <span class=\"katex-inline\">B<\/span> 由副本指令 <code>mov A, B<\/code> 连接，二者生命周期不重叠。合并后成为一个范围，少一个结点、少若干冲突边，颜色需求下降。合并前置条件：<span class=\"katex-inline\">A<\/span>、<span class=\"katex-inline\">B<\/span> 除这条副本外没有其他冲突；若二者在某点同时活跃，合并会制造错误覆盖。本书 13.4.6 节讨论合并副本以减小度数（原书 PDF 第 533 页起）。<\/p>\n<h2>对抗性追问：近似着色与最优解的差距<\/h2>\n<p>图着色一般形式 NP 难，编译器简化-着色给的是可行解：可能多分配寄存器，也可能溢出本可避免的范围。工程上通过压缩 IR 寿命、缩短长范围、调整指令顺序压低图密度；评估分配质量看溢出 load/store 数量与热路径占用，而不是追求理论最优着色。<\/p>\n<p>再追一层：活动范围端点判错，冲突边随之错。端点偏长，范围虚胖、冲突图变密，触发多余溢出；端点偏短，实际重叠未连边，着色后寄存器覆盖错误。范围端点来自活跃变量分析的定值点与最后引用点，c07 的集合精度直接传到冲突图。<\/p>\n<h2>延伸推演：简化阶段的度数更新与寄存器类别<\/h2>\n<p>简化阶段每移除一个度数小于 <span class=\"katex-inline\">k<\/span> 的结点，邻居度数各降 1；降后小于 <span class=\"katex-inline\">k<\/span> 的邻居继续可移除。栈记录移除次序，着色逆序弹出。简化结束仍留结点（度数都不小于 <span class=\"katex-inline\">k<\/span>），这些是溢出候选：图色数超过可用寄存器数，不可能全部着色。<\/p>\n<p>着色选寄存器时先扫邻居已占颜色，挑第一个未占用物理寄存器；<span class=\"katex-inline\">k<\/span> 个颜色全被邻居占满，标记溢出。溢出范围拆分后重新建图：定值后 store、使用前 load 的短子范围冲突更少，可能重新可着色。<\/p>\n<p>寄存器类别按用途分开：整数、浮点、地址指针往往属不同类别；冲突边只在同类范围之间判断，颜色也在同类寄存器内分配，混类建模会低估真实冲突。副本指令连接且生命周期不重叠的两个范围可合并，合并后少一个结点、少若干冲突边；合并前必须确认二者除副本外无其他冲突。<\/p>\n<p>图着色一般形式 NP 难，编译器简化-着色给的是可行解：可能多分配寄存器，也可能溢出本可避免的范围。工程上通过压缩 IR 寿命、缩短长范围、调整指令顺序压低图密度；分配质量看溢出 load/store 数量与热路径占用，不追求理论最优着色。<\/p>\n<h2>第三算例：冲突图着色与溢出决策<\/h2>\n<p>四个活动范围 <span class=\"katex-inline\">r_1<\/span>–<span class=\"katex-inline\">r_4<\/span>，可用寄存器 3 个。冲突边：<span class=\"katex-inline\">r_1<\/span> 与 <span class=\"katex-inline\">r_2<\/span>、<span class=\"katex-inline\">r_1<\/span> 与 <span class=\"katex-inline\">r_3<\/span>、<span class=\"katex-inline\">r_2<\/span> 与 <span class=\"katex-inline\">r_3<\/span>、<span class=\"katex-inline\">r_3<\/span> 与 <span class=\"katex-inline\">r_4<\/span>。<span class=\"katex-inline\">r_1<\/span>、<span class=\"katex-inline\">r_2<\/span>、<span class=\"katex-inline\">r_3<\/span> 两两冲突构成三角形，三个范围必须占三个不同寄存器；<span class=\"katex-inline\">r_4<\/span> 与 <span class=\"katex-inline\">r_3<\/span> 冲突，可与 <span class=\"katex-inline\">r_1<\/span> 或 <span class=\"katex-inline\">r_2<\/span> 共用。<\/p>\n<p>简化阶段：<span class=\"katex-inline\">r_4<\/span> 度数 1，先移除；剩余三角形各度数 2，小于 3，依次移除。着色逆序：三角形三个范围分占寄存器 0、1、2；<span class=\"katex-inline\">r_4<\/span> 避开 <span class=\"katex-inline\">r_3<\/span> 的颜色，取 0 或 1，着色成功。<\/p>\n<p>若再加范围 <span class=\"katex-inline\">r_5<\/span> 与 <span class=\"katex-inline\">r_1<\/span>、<span class=\"katex-inline\">r_2<\/span>、<span class=\"katex-inline\">r_3<\/span> 都冲突，图中五个范围在 3 寄存器下不可着色；简化后仍留度数不小于 3 的结点，标记溢出。选溢出范围按代价：定值与引用少、不在热路径上的范围先拆，拆出的短子范围重新建图着色。<\/p>\n<h2>延伸推演：分配顺序与副本合并时机<\/h2>\n<p>图着色在指令选择、调度之后进行：范围由定值-引用关系确定，调度顺序影响范围交叠。分配前先合并副本连接的非冲突范围，减少结点数；合并后若两范围仍冲突，回退为两个结点。溢出拆分产生的 load/store 要重新过调度与依赖检查，插入位置不破坏定值顺序。<\/p>\n<p>寄存器类别在冲突图上分开建模：整数范围与浮点范围之间不连冲突边，颜色池各自独立；跨类别移动（整数转浮点）产生一条副本指令，两侧范围按各自类别分配。混类建图会把可共用寄存器的范围误判为冲突，图密度虚高。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n活动范围从哪个点到哪个点？\n<\/li><li>\n冲突图什么时候在两个范围之间加边？\n<\/li><li>\n度数达到多少的结点在简化时不能直接移除？\n<\/li><li>\n溢出代价为什么要按执行频率加权，而不是静态指令条数？\n<\/li><li>\n复制合并适用于什么样的两个范围，合并前要先确认什么？\n<\/ol><\/div><\/details>", "c11": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.466<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">三地址码、基本块与控制流图（CFG）构造<\/a><\/span><\/div><h1>指令选择：树模式匹配与动态规划覆盖<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（原书第 11 章 11.4.1 节，PDF 第 466 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>后端要把 IR 表达式与三地址片段映射成目标处理器指令。最朴素的做法是自底向上遍历语法树，每个结点选第一条匹配的指令；这样每个结点独立决策，漏掉“一条复杂指令替代多条简单指令”的更优覆盖，指令数与代码体积都偏高。指令选择要在整棵树的层面找一组规则，无重复、无遗漏地盖住全部子树，总成本最低。树模式匹配把 ISA 指令抽象成重写规则，动态规划在子树上标注最小覆盖成本，父结点组合子结点最优方案。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>重写规则<\/strong>：由三部分组成——产生式（树中匹配的结点与子树形态）、成本（该规则覆盖的代价）、代码模板（生成的目标指令片段）。本书图 11-4 用 ILOC 操作平铺成抽象语法树，列出规则的产生式、成本与代码模板（原书 11.4.1 节，PDF 第 466 页）。<\/p>\n<p><strong>树覆盖<\/strong>：一组规则的匹配结果恰好盖住整棵 IR 树，每个子树结点落在某条规则下，不重叠、不遗漏。<\/p>\n<p><strong>动态规划标注<\/strong>：对每个树结点，记录以该结点为根被某条规则覆盖时的最小成本；父结点把子结点的最优成本按规则组合，取最小值。<\/p>\n<p><strong>窥孔优化<\/strong>：另一类指令选择路线，在已生成的指令序列小窗口内替换低效片段，规则针对指令流而非树结构（原书 11.5 节，PDF 第 473 页起）。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<p>第一步，把 IR 表达式平铺成抽象语法树：叶子是名字、常数，内部结点是运算符。<\/p>\n<p>第二步，自底向上遍历：叶子先匹配载入规则（常数用 <code>loadI<\/code>，内存名字先 load 到寄存器）。<\/p>\n<p>第三步，内部结点对每条可匹配规则计算成本：规则成本 + 各子结点所选覆盖方案成本；在该结点记录最小成本与对应规则。<\/p>\n<p>第四步，父结点组合时比较备选规则：拆成多条简单指令，或用一条带内存/复合操作数的指令；取总成本最小的覆盖。<\/p>\n<p>第五步，从根结点回溯所选规则，向下按记录的最优子方案取叶子规则，拼出最终指令序列。<\/p>\n<p>以表达式 <code>a + b <em> c<\/code> 为例：树根是 <code>+<\/code>，左叶 <code>a<\/code>，右子树 <code><\/em><\/code>（叶 <code>b<\/code>、<code>c<\/code>）。先标叶子：<code>b<\/code>、<code>c<\/code> 各一条 load，<code>a<\/code> 一条 load。<code><em><\/code> 结点两条候选：两条 load 后一条乘法（成本记为 <span class=\"katex-inline\">2+c_{\\text{mul}}<\/span>），或用带寄存器间接寻址的复合规则；取较小者。<code>+<\/code> 结点再比较“加法配已算好的 <code><\/em><\/code> 子树”与“拆成多次简单运算”的总成本，根结点记录的最小值决定覆盖。回溯时根选加法规则，子结点按各自记录的最优方案取叶子载入规则。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：IR 结构可表示为树（表达式、三地址片段）；目标 ISA 规则已整理成产生式、成本、模板三元组。\n<\/li><li>\n<strong>边界 1：树覆盖表达不了全部 ISA 语义<\/strong>。跨指令的副作用、流水约束、复杂寻址的组合模式，树模型难以直接覆盖；这类结构配合窥孔优化或专门代码生成处理。\n<\/li><li>\n<strong>边界 2：成本模型影响选择<\/strong>。规则成本按指令数、周期数或代码体积设定；成本估不准，最优覆盖只是模型下的最优。\n<\/li><li>\n<strong>失败案例：贪心逐条选规则<\/strong>。每个结点取第一条匹配规则，不比较子树组合成本，错过复合指令；树的上层结点可能被拆成多余 load 与运算。\n<\/li><li>\n<strong>失败案例：覆盖留洞<\/strong>。某子树没被任何规则盖住，生成代码缺一段计算；回溯时必须核对每个叶子与内部结点都有规则归属。\n<\/li><li>\n<strong>边界 3：规则库完备性<\/strong>。目标 ISA 常用指令都应有对应规则；缺规则的结构只能退回到简单指令序列，或由编译器兜底生成。\n<\/li><li>\n<strong>边界 4：规则重叠时的归属<\/strong>。同一子树被多条规则匹配，动态规划按成本选一条；若两条规则生成的代码副作用时机不同，选择前要确认二者语义等价，不能只比成本。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>树覆盖与窥孔优化<\/strong>：树覆盖在 IR 树结构上做全局规则组合；窥孔在生成后的指令流小窗口内做局部替换。前者偏结构映射，后者偏事后修整，工程上两条路线常配合使用。\n<\/li><li>\n<strong>动态规划与贪心<\/strong>：贪心单步选当前便宜规则；动态规划保留每个子结点的最小成本，父结点组合时才能比较整体方案。二者差别在决策是局部还是跨子树。\n<\/li><li>\n<strong>指令选择与指令调度<\/strong>：选择解决“用哪条指令”，调度解决“指令排成什么顺序”。选择产出的指令序列是调度的输入；调度不改变指令语义，只重排顺序。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c05 三地址码与基本块提供选择对象；c04 归约出的表达式结构是树的来源。后继：c12 表调度在选择后的指令序列上排顺序；c10 分配依据选择结果形成的活动范围安排寄存器。第 4 章代码形式决策决定 IR 中值放在寄存器还是内存，直接影响可选规则集合。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（指令选择：树模式匹配与动态规划覆盖）<\/summary><div class=\"depth-body\"><h1>c11 深度推导：规则覆盖模型、动态规划成本标注与指令序列回溯<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把 IR 落到目标指令，往回追三层前提：<\/p>\n<ol><li>\n同一个表达式在不同 ISA 上有不同指令编码方式；编译器不能为每款机器手写翻译规则，需要一套可扩充的规则表示，把目标指令描述成可匹配的模式。\n<\/li><li>\n指令选择不是单条指令的孤立决定：一条复合指令可能替代多条简单指令，子树怎么覆盖影响父结点可选规则。因此要在整棵树层面比较覆盖方案总成本。\n<\/li><li>\n树结构把表达式层级化：叶子是名字与常数，内部结点是运算。自底向上标注每个子树的最小成本，父结点才能在“拆简单指令”与“用复合规则”之间选整体更便宜的方案。\n<\/ol>\n<p>依赖链方向：ISA 规则表示 → 树模式匹配 → 子树成本标注 → 父结点组合取最小 → 回溯规则拼序列。<\/p>\n<h2>正向演算（逐步走查）：规则结构与 DP 标注<\/h2>\n<h3>规则三元组<\/h3>\n<p>本书图 11-4 的每条规则含：<\/p>\n<ul><li>\n<strong>产生式<\/strong>：<code>左部 → 右部子树形态<\/code>，如 <code>Reg → Reg + Reg<\/code>；\n<\/li><li>\n<strong>成本<\/strong>：该规则覆盖的代价；\n<\/li><li>\n<strong>代码模板<\/strong>：对应生成的 ILOC/目标指令，如 <code>add r1, r2 → r3<\/code>（原书 11.4.1 节，PDF 第 466 页）。\n<\/ul>\n<h3>标注算法<\/h3>\n<pre><code>for 结点 v 自底向上:\n    for 每条匹配 v 子树的规则 R:\n        cost(R) = R.cost + Σ 子结点最优成本\n    v.best = 成本最小的规则与成本<\/code><\/pre>\n<h3>回溯<\/h3>\n<pre><code>从根结点 v 开始:\n    取 v.best.规则 R\n    输出 R 的代码模板\n    对 R 的每个子结点递归回溯<\/code><\/pre>\n<p>覆盖校验：每个叶子与内部结点都归属某条规则，规则之间不重叠。<\/p>\n<h2>具体算例：表达式树的两种覆盖<\/h2>\n<p>表达式 <code>(a + b) × 2<\/code>，树结构：根为乘法结点，左孩子是加法结点，加法叶子为 <code>a<\/code>、<code>b<\/code>，右叶子为常数 <code>2<\/code>。<\/p>\n<p>可用规则：<\/p>\n<ul><li>\n<code>Reg → Num<\/code>：<code>loadI<\/code>，成本 1；\n<\/li><li>\n<code>Reg → Mem<\/code>：load 内存名字到寄存器，成本 1；\n<\/li><li>\n<code>Reg → Reg + Reg<\/code>：<code>add<\/code>，成本 1；\n<\/li><li>\n<code>Reg → Reg × Reg<\/code>：<code>mult<\/code>，成本 1。\n<\/ul>\n<p>第一步，叶子标注：<code>a<\/code>、<code>b<\/code> 经 load 规则成本各 1；常数 <code>2<\/code> 经 <code>loadI<\/code> 成本 1。<\/p>\n<p>第二步，加法结点：规则 <code>Reg → Reg + Reg<\/code> 成本 = 1 + 1 + 1 = 3（加法本身 + 两个叶子载入）。<\/p>\n<p>第三步，乘法结点备选：<\/p>\n<ul><li>\n全拆简单指令：<code>mult<\/code> 规则成本 = 1 + 3（加法子树）+ 1（常数载入）= 5；\n<\/li><li>\n若 ISA 提供“乘立即数”规则，右操作数直接取常数，省去 <code>loadI<\/code>，成本 = 1 + 3 = 4。\n<\/ul>\n<p>第四步，取较小者：选乘立即数规则覆盖根。回溯：根输出乘立即数模板，加法子树按 <code>add<\/code> 规则回溯，<code>a<\/code>、<code>b<\/code> 走 load。<\/p>\n<h2>第二算例：内存操作数规则省一条 load<\/h2>\n<p>表达式 <code>a + b<\/code>。若目标 ISA 的加法允许一个操作数在内存：规则 <code>Reg → Reg + Mem<\/code>，成本 2。<\/p>\n<ul><li>\n全寄存器方案：load <code>b<\/code>（1）+ <code>add<\/code>（1）+ load <code>a<\/code>（1）= 3；\n<\/li><li>\n内存操作数方案：load <code>a<\/code>（1）+ 带内存操作数的 <code>add<\/code>（2）= 3，与前者持平；若内存操作数规则成本为 1，则总成本 2，更优。\n<\/ul>\n<p>动态规划在加法结点把两种备选都算出来比较，而不是先入为主选 load 加 add。<\/p>\n<h2>延伸推演：窥孔优化与选择器生成<\/h2>\n<p>本书 11.5 节讨论通过窥孔优化做指令选择：在已生成指令的小窗口内找可替换模式，如用自增指令替代加 1、合并相邻移位（PDF 第 473 页起）。窥孔面向指令流，适合补树覆盖遗漏的局部低效片段。11.6 节高级主题讨论学习指令模式等更晚近的方法（PDF 第 480 页起）。<\/p>\n<p>工程上，规则库常由工具从机器描述自动生成选择器；工具把规则编译成匹配程序，编译器后端输入 IR 树即可得到指令序列。规则成本模型可按指令数、周期数或代码体积调整；不同模型下最优覆盖可能不同。<\/p>\n<h2>对抗性追问：贪心选第一条匹配规则会怎样<\/h2>\n<p>若每个结点取第一条匹配规则，不比较子树组合成本，上层复合指令机会被错过：本可用一条乘立即数完成的叶子载入与乘法，被拆成 <code>loadI<\/code>、<code>mult<\/code> 多条指令；代码体积与指令数同时偏高。贪心与 DP 的差别就在父结点是否回看子树的备选方案。<\/p>\n<p>再追一层：覆盖留洞时，某个子表达式没有规则归属，生成代码缺这段计算；回溯阶段若不核对每个结点都有规则归属，错误要到运行期才以结果错误暴露。覆盖无遗漏是树选择的硬约束。<\/p>\n<h2>第三算例：三层表达式的成本表逐层回填<\/h2>\n<p>表达式 <code>(a + b) + c<\/code>，树：根 <code>+<\/code>，左孩子 <code>+<\/code>（叶 <code>a<\/code>、<code>b<\/code>），右叶 <code>c<\/code>。规则集与成本：<code>Mem→Reg<\/code> load 成本 1；<code>Reg→Reg+Reg<\/code> add 成本 1；<code>Reg→Reg+Mem<\/code> 成本 2（右操作数留内存）。<\/p>\n<p>叶子层：<code>a<\/code> load 成本 1，<code>b<\/code> load 成本 1，<code>c<\/code> load 成本 1。<\/p>\n<p>下层加法结点（<code>a+b<\/code>）：<\/p>\n<ul><li>\n寄存器规则：1（add）+1+1 = 3；\n<\/li><li>\n内存规则：左操作数须在寄存器，右操作数 <code>b<\/code> 留内存：1（load <code>a<\/code>）+2 = 3。\n<p>取 3，记 add 规则。<\/p>\n<\/ul>\n<p>根结点（<code>(a+b)+c<\/code>）：<\/p>\n<ul><li>\n寄存器规则：1 + 3（左子树）+1（load <code>c<\/code>）= 5；\n<\/li><li>\n内存规则：左子树结果在寄存器，<code>c<\/code> 留内存：2 + 3 = 5。\n<p>两方案持平，回溯时按规则优先级取一条；若内存规则成本降为 1，根成本 4，选内存操作数方案。<\/p>\n<\/ul>\n<p>逐层回填的要点：父结点成本只引用子结点记录的最优成本，不重新展开子树备选；子结点若后来发现更优规则，父结点成本要随之更新，标注必须自底向上一次走完。<\/p>\n<h2>延伸推演：树模型与 DAG、规则匹配顺序的边界<\/h2>\n<p>表达式若有公共子表达式，IR 可能表示为 DAG 而非树：同一子树被多个父结点引用一次。树覆盖把每个引用位置独立选规则，重复生成计算；DAG 覆盖要处理共享结点的定值只算一次、多处使用，模型比树复杂。本书代码形式章节先把值放在寄存器或内存的决策定下来，再谈选择规则（原书第 7 章，PDF 第 260 页起）。<\/p>\n<p>规则匹配顺序影响歧义处理：多条规则匹配同一子树时，成本比较是最终依据；匹配器先按树形态筛出候选，再进入成本计算。若规则产生式重叠且成本相同，选择结果由规则排列顺序决定，这类歧义要在规则库评审时消除。<\/p>\n<p>成本不可简单相加的情形：规则生成的指令改变寄存器分配状态，后续指令的载入成本受影响；纯树内成本模型把跨规则状态忽略，得到的是局部最优。更精细的选择把分配、调度代价一并计入，属于后端联合优化。<\/p>\n<h2>对抗性追问：两条规则语义不等价时只比成本会怎样<\/h2>\n<p>若一条复合规则在寻址时触发内存副作用（如自动增量写回），另一条简单指令序列不写回内存，二者成本相同但可观察行为不同。只按成本选复合规则，程序在依赖内存位置的路径上结果改变。选择前必须核对规则模板与被替换序列的副作用集合一致；成本比较只在语义等价的候选之间进行。<\/p>\n<p>再追一层：常数折叠在选择前完成，表达式里的常数先算成新常数；若折叠被推迟到规则匹配阶段，叶子规则按未折叠的子树标注成本，复合规则机会被漏判。前端到中端的规范化步骤要先于指令选择。<\/p>\n<h2>第四算例：规则成本与指令数、周期数的分歧<\/h2>\n<p>同一子树两条规则：规则甲生成 2 条指令，各 1 周期；规则乙生成 1 条复合指令，延迟 3 周期。按指令数成本，乙更优；按周期数成本，甲两条并行可在 1 周期完成（假设功能单元充足），甲更优。成本模型选哪一种，决定根结点回溯到哪条规则。<\/p>\n<p>后端选模型的依据是优化目标：压缩代码体积用指令数或字节数；缩短执行时间用周期数与延迟。模型切换后，同一 IR 树的最优覆盖可能整体改变；规则库成本标注要与目标模型一致。<\/p>\n<h2>延伸推演：选择器生成与规则冲突排查<\/h2>\n<p>机器描述中的规则经工具编译成匹配程序：匹配程序按树形态筛候选规则，把成本计算交给 DP 标注。规则库评审时排查两类问题：产生式重叠但语义不等价；同一形态多条规则成本标注矛盾。前者靠副作用核对排除，后者靠成本表统一口径。<\/p>\n<p>树覆盖只处理表达式与三地址片段；过程序言、尾声、参数传递等代码形态由调用约定规则单独生成，不进入表达式树选择。两类规则产出的指令在最终序列中按过程结构拼接。<\/p>\n<h2>第五算例：嵌套常数的载入规则选择<\/h2>\n<p>表达式 <code>(a + 1) * b<\/code>，常数 <code>1<\/code> 出现在加法子树。叶子层：<code>a<\/code>、<code>b<\/code> 走 load 各成本 1，常数 <code>1<\/code> 走 <code>loadI<\/code> 成本 1。加法结点：寄存器规则 <code>add<\/code> 成本 1 +1（<code>a<\/code>）+1（<code>loadI 1<\/code>）= 3；若 ISA 加法支持立即数操作数，右操作数直接取常数，省去 <code>loadI<\/code>，成本 1 +1（<code>a<\/code>）= 2。<\/p>\n<p>乘法结点引用加法子树记录的最优成本：全拆方案 <code>mult<\/code> 成本 1 + 3（或 2）+1（load <code>b<\/code>）；若乘法也支持寄存器-立即数形式，右操作数是变量 <code>b<\/code> 不适用。回溯按加法结点已选的立即数加法规则展开，<code>a<\/code> 走 load，常数不生成 <code>loadI<\/code>。<\/p>\n<p>逐层标注保留的是各子树当前最优方案；若加法子树后来因寄存器压力回退到全寄存器方案，乘法父结点成本要按新子树成本重算。标注阶段记录备选成本列表，供后端联合决策回调。<\/p>\n<h2>延伸推演：规则库与代码生成的接口<\/h2>\n<p>指令选择输出的是带操作数占位的指令模板；寄存器分配把占位换成物理寄存器或溢出位置，调度再排发射顺序。选择阶段假定操作数可分配到寄存器，占位与最终物理位置分离，使三类后端任务可分阶段推进。<\/p>\n<p>规则描述中动作码与产生式绑定：匹配命中即生成对应模板片段。匹配程序自底向上读 IR 树，命中规则后在该子树停止向下展开；未命中才落到更细的叶子规则。覆盖完整性核对：根结点归属规则的子结点递归展开后，每个叶子都有规则，不存在规则未覆盖的悬空子树。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n重写规则三元组各记录什么？\n<\/li><li>\n动态规划在每个树结点保留什么信息？\n<\/li><li>\n父结点比较备选规则时，成本由哪两部分组成？\n<\/li><li>\n树覆盖与窥孔优化分别面向什么结构？\n<\/li><li>\n规则成本模型按指令数与按周期数设定，选出的覆盖一定相同吗？\n<\/ol><\/div><\/details>", "c12": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.485<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">指令选择：树模式匹配与动态规划覆盖<\/a><\/span><\/div><h1>指令调度：表调度与局部/区域顺序重排<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（原书第 12 章 12.1、12.3 节，PDF 第 485、493 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>一组操作的执行时间严重依赖执行顺序。处理器按流水线发射指令，操作数尚未就绪的指令进入流水线后要停顿等待；长延迟操作（除法、内存访问）后面的空闲周期若被浪费，整体运行时间被拉长。指令调度重排过程中的操作顺序以改进运行时间，但重排不能越过真实数据依赖与控制依赖。表调度是局部调度的主算法：维护就绪指令列表，按优先级排序后逐条发射，在依赖允许的范围内填满停顿周期。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>依赖关系<\/strong>：数据依赖指后指令引用前指令的结果；控制依赖指分支决定后续指令是否执行；资源冲突指多条指令争用同一功能单元。调度只能在不破坏这些关系的前提下重排。<\/p>\n<p><strong>就绪指令<\/strong>：操作数都已可用、且发射资源满足的指令进入就绪列表。<\/p>\n<p><strong>优先级<\/strong>：就绪列表中多条指令可选时的排序依据，常用关键路径长度、延迟权重等；平局需要打破规则。<\/p>\n<p><strong>局部调度<\/strong>：在单个基本块内重排指令；<strong>区域调度<\/strong>：跨越基本块边界，在循环或区域范围内调度（原书 12.3、12.4 节，PDF 第 493、500 页）。<\/p>\n<p><strong>前向/后向表调度<\/strong>：前向从块首往后排；后向从块尾往前排，两种方向选择停顿填补的位置不同。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<p>第一步，标出块内指令间的数据依赖与资源约束。<\/p>\n<p>第二步，初始化就绪列表：无前置依赖的指令进入列表。<\/p>\n<p>第三步，从就绪列表按优先级选出一条指令发射；优先级相同按预定规则打破平局。<\/p>\n<p>第四步，发射后更新依赖状态：以该指令结果为操作数的其他指令，若前置已满足，加入就绪列表。<\/p>\n<p>第五步，重复第三、四步，直到所有指令发射完毕。前向调度从块首推进，后向调度从块尾回推。<\/p>\n<p>以四条指令的块为例：<code>L1: load x → r1<\/code>，<code>L2: load y → r2<\/code>，<code>A1: add r1,r2 → r3<\/code>，<code>M1: mul r3,r4 → r5<\/code>。<code>A1<\/code> 依赖 <code>L1<\/code>、<code>L2<\/code> 的结果，<code>M1<\/code> 依赖 <code>A1<\/code>。初始就绪列表只有 <code>L1<\/code>、<code>L2<\/code>；先发射 <code>L1<\/code>，再发射 <code>L2<\/code>，两条 load 之间无依赖可并行占用不同访存单元。<code>L2<\/code> 完成后 <code>A1<\/code> 进入就绪列表，发射 <code>A1<\/code>；<code>A1<\/code> 结果就绪后 <code>M1<\/code> 入列发射。若 <code>M1<\/code> 延迟长，可在其等待周期内安排块内其他无依赖指令填补；就绪列表为空才插入停顿。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：指令依赖关系在 IR/目标指令上可见；发射资源与各操作延迟已知。\n<\/li><li>\n<strong>边界 1：重排不能越过依赖<\/strong>。写后读、读后写、写后写冲突都属于不可违反的顺序；把写指令排到读指令之前，流水线取到旧操作数。\n<\/li><li>\n<strong>边界 2：跨块调度保守<\/strong>。基本块边界上的活跃范围与分支条件限制重排；区域调度跨越块时要核对块间依赖。\n<\/li><li>\n<strong>失败案例：只按发射方便排序<\/strong>。不查依赖就把后指令提前，读引用在写之前执行，结果错误。\n<\/li><li>\n<strong>失败案例：忽略资源冲突<\/strong>。多条指令争用同一功能单元，调度只看数据就绪，发射时资源不足仍会停顿；优先级应同时计入资源约束。\n<\/li><li>\n<strong>边界 3：调度不改语义<\/strong>。调度只改变指令顺序，不删除计算、不改定值；与指令选择的分工是选择定指令、调度定顺序。\n<\/li><li>\n<strong>边界 4：长延迟操作的填补受限于块内指令密度<\/strong>。块内无其他就绪指令时，停顿无法靠重排消除；这类停顿要靠循环级调度或代码生成阶段减少依赖链长度。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>调度与指令选择<\/strong>：选择回答“用哪条指令”，产出指令序列；调度回答“指令排成什么顺序”。选择结果是调度输入，调度不替换指令。\n<\/li><li>\n<strong>表调度与轨迹调度<\/strong>：表调度在就绪列表按优先级逐条选；轨迹调度沿最常执行的路径（轨迹）延伸调度，把低频路径留到后面处理。本书 12.5 节高级主题讨论软件流水等更全局的方法（PDF 第 505 页起）。\n<\/li><li>\n<strong>局部与区域调度<\/strong>：局部只在单块内重排，依赖关系简单；区域跨块，需要额外处理块间活跃性与控制依赖。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c11 指令选择产出待调度指令；c05 CFG 提供块边界。后继：c10 寄存器分配依据调度后的定值-引用顺序安排范围；调度插入的 load/store 顺序也要服从分配约束。第 4 章调用约定规定的保存/恢复顺序，是跨过程调度必须保留的边界。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（指令调度：表调度与局部/区域顺序重排）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：表调度主循环、就绪判定与停顿填补算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>指令顺序影响流水线效率，往回追三层前提：<\/p>\n<ol><li>\n处理器把指令执行拆成多级流水，一条指令在操作数未就绪时停顿，占用周期却不产生结果。编译器重排顺序，把不依赖长延迟结果的指令提前发射，填满空闲周期。\n<\/li><li>\n重排有不可越过的底线：数据依赖决定读必须在写之后，控制依赖决定分支后指令的执行前提，资源冲突决定同周期能发射几条。调度只能在这些关系允许的位置之间调整。\n<\/li><li>\n可用指令动态变化：一条指令发射后，以它结果为操作数的其他指令前置才可能满足。调度器要维护就绪列表，每发射一条就更新谁变为就绪。\n<\/ol>\n<p>依赖链方向：流水线停顿问题 → 依赖与资源约束 → 就绪列表 → 优先级选择 → 发射并更新就绪 → 排满无依赖空隙。<\/p>\n<h2>正向演算（逐步走查）：表调度步骤<\/h2>\n<h3>就绪条件<\/h3>\n<p>指令 <span class=\"katex-inline\">i<\/span> 就绪，当且仅当：<\/p>\n<ol><li>\n它的每个源操作数已由先前发射的指令产生；\n<\/li><li>\n所需功能单元与发射槽位当前可用；\n<\/li><li>\n不违反控制依赖顺序。\n<\/ol>\n<h3>主循环<\/h3>\n<pre><code>Ready ← 无前置依赖的指令\nwhile Ready 非空:\n    i ← 按优先级从 Ready 选出一条（平局按打破规则）\n    发射 i\n    for 每条等待 i 结果的指令 j:\n        if j 其余前置已满足:\n            Ready ← Ready ∪ {j}<\/code><\/pre>\n<h3>调度方向<\/h3>\n<ul><li>\n前向：从块首往块尾排，逐条确定发射位置；\n<\/li><li>\n后向：从块尾往块头回推，把延迟压力留给前面的指令安排。\n<\/ul>\n<h2>具体算例： load 后停顿的重排<\/h2>\n<p>原序列（load 延迟 2 周期）：<\/p>\n<pre><code>1  ld  r1, [r2]    /* 载 a */\n2  ld  r3, [r4]    /* 载 b */\n3  add r5, r1, r3  /* 依赖 1、2 */\n4  mul r6, r5, r7  /* 依赖 3 */\n5  st  [r8], r6    /* 依赖 4 */<\/code><\/pre>\n<h3>原顺序的停顿<\/h3>\n<p>第 1 条 load 发出后，第 2 条 load 可同槽位发射；第 3 条 add 要等两个 load 结果，第 1、2 条结果未就绪前，流水线在 add 前停顿。第 4 条 mul 等 add 结果，第 5 条 st 等 mul 结果。<\/p>\n<h3>依赖关系<\/h3>\n<ul><li>\n<code>add<\/code> 依赖 <code>ld r1<\/code>、<code>ld r3<\/code>；\n<\/li><li>\n<code>mul<\/code> 依赖 <code>add<\/code>；\n<\/li><li>\n<code>st<\/code> 依赖 <code>mul<\/code>；\n<\/li><li>\n两条 load 互不依赖。\n<\/ul>\n<h3>调度后顺序<\/h3>\n<pre><code>槽位 1: ld  r1, [r2]\n槽位 2: ld  r3, [r4]\n槽位 3: add r5, r1, r3\n槽位 4: mul r6, r5, r7\n槽位 5: st  [r8], r6<\/code><\/pre>\n<p>两条 load 占据独立发射槽；add 在两个结果就绪后发射；mul、st 沿依赖链顺序推进。若存在另一条与 load 不依赖的独立运算，可填入 load 结果未就绪的停顿槽位，而不必空等。<\/p>\n<h2>第二算例：平局打破与后向调度<\/h2>\n<p>就绪列表同时有两条指令：一条在关键路径上（后续长链等待它），一条不在。优先级按关键路径剩余长度排序，关键路径指令先发射，缩短整条链的完成时间。优先级相同的平局，本书 12.3.4 节讨论在表调度算法中打破平局的方案（PDF 第 496 页）。<\/p>\n<p>后向调度从块尾回推：先排最后必须执行的指令，再往前找能填补其延迟空隙的指令。前向与后向选出的指令顺序可能不同，最终都要满足依赖闭环；跨基本块时，后向调度要核对块尾活跃范围的边界。<\/p>\n<h2>延伸推演：区域调度与软件流水<\/h2>\n<p>局部调度只在单块内可见依赖；循环体等区域跨多个块，区域调度在更大范围重排，处理块间活跃值与分支条件。本书 12.5 节高级主题讨论软件流水：把循环不同迭代的操作重叠起来执行，让功能单元在迭代之间保持忙碌；配套技术包括硬件支持的软件流水策略与软件流水算法（原书 12.5.1、12.5.2 节，PDF 第 505、507 页）。<\/p>\n<p>调度与寄存器分配相互影响：调度把长延迟操作提前，会拉长某些值的存活时间；分配后补的 load/store，其顺序同样要过调度依赖检查。<\/p>\n<h2>对抗性追问：越过依赖提前指令会怎样<\/h2>\n<p>若把写某寄存器的指令排到读该寄存器的指令之前，流水线读到的是旧值；分支条件计算排在分支跳转之前是合法顺序，反过来则跳转依据未定。调度器只在依赖允许的位置之间移动指令，优先级排序不能覆盖数据依赖。<\/p>\n<p>再追一层：只看数据就绪、忽略功能单元冲突，两条乘指令争用同一乘法单元，发射时资源不足仍停顿；调度优先级必须把资源约束计入，而不是单看操作数就绪。<\/p>\n<h2>第三算例：独立运算填补 load 停顿槽位<\/h2>\n<p>块内新增一条与两条 load 都不依赖的指令 <code>sub r9, r10, r11<\/code>。依赖关系上，<code>sub<\/code> 的源操作数 <code>r10<\/code>、<code>r11<\/code> 在块前已就绪，不等待 <code>r1<\/code>、<code>r3<\/code>。<\/p>\n<p>调度过程：<\/p>\n<ul><li>\n槽位 1：就绪列表含 <code>ld r1<\/code>、<code>ld r3<\/code>、<code>sub<\/code>；按关键路径优先级，两条 load 先发射，<code>sub<\/code> 暂留。\n<\/li><li>\n槽位 2：第二条 load 发射；此时 <code>r1<\/code>、<code>r3<\/code> 结果尚未就绪，<code>add<\/code> 未入列。\n<\/li><li>\n槽位 3：<code>sub<\/code> 与等待 load 结果的 <code>add<\/code> 比较，<code>add<\/code> 操作数未就绪，<code>sub<\/code> 就绪，发射 <code>sub<\/code> 填补空隙。\n<\/li><li>\n槽位 4：两个 load 结果就绪，发射 <code>add<\/code>；随后 <code>mul<\/code>、<code>st<\/code> 沿链推进。\n<\/ul>\n<p>对比不填补的顺序：<code>add<\/code> 前空一个槽位等 load，<code>sub<\/code> 排到链尾；填补后空闲周期被独立运算占用，块总周期数下降。填补前提是 <code>sub<\/code> 与被推迟指令之间无数据、控制与内存顺序依赖。<\/p>\n<h2>延伸推演：关键路径优先级与延迟表<\/h2>\n<p>优先级排序的依据是指令所在依赖链的剩余长度：从该指令到块尾最长链上的延迟总和。链长指令先发射，避免它成为后续停顿的根源；不在关键路径上的指令可以后移，代价由自身短链承担。平局打破规则保证同一就绪集合每次选出确定指令，调度结果可复现。<\/p>\n<p>延迟表记录各类操作的发射间隔与结果就绪周期：load、乘法、除法延迟不同，调度器据此判断“再等几轮”指令才就绪。延迟表与目标处理器微架构绑定；换一款处理器，同一指令序列的最优顺序可能改变。<\/p>\n<p>内存访问顺序是一类容易被忽略的依赖：两个访存指令若可能访问同一地址，即使寄存器名不同，也不能交换顺序；别名分析确定二者地址不重叠后，调度器才允许重排。别名不确定时按保守顺序保留。<\/p>\n<h2>对抗性追问：跨块移动指令会漏掉什么<\/h2>\n<p>把块内一条 load 移到前驱块提前发射，收益是隐藏 load 延迟；风险是前驱块可能经分支不执行该路径，load 提前后在未走的路径上触发异常或改写状态。跨块调度必须确认目标路径执行条件覆盖指令使用条件，否则指令在不该执行的块上产生副作用。区域调度在块边界逐对核对依赖，而不是把单块规则直接套到跨块场景。<\/p>\n<p>再追一层：调度改变了指令先后，寄存器压力随之变化。两条值的存活区间因重排交叠变宽，分配阶段需要更多寄存器或溢出；调度与分配不是一次性单向关系，后端常按调度后图密度反馈调整。<\/p>\n<h2>第四算例：关键路径长度决定优先级<\/h2>\n<p>块内两条就绪链：链甲 <code>sub → mul → st<\/code>，剩余延迟 5；链乙 <code>and → or<\/code>，剩余延迟 2。就绪列表中各有一条可发射指令，按关键路径剩余长度，链甲指令先发射；它的结果是长链后续指令的前置，推迟它会把整条链后移。链乙指令短，后移一个槽位不增加块总周期。<\/p>\n<p>优先级表把每条指令到块尾的最长延迟和算出来；发射一条后，更新等待它的指令的剩余长度。平局时按指令编号或原来的程序次序打破，保证调度结果确定可复现。<\/p>\n<h2>延伸推演：调度可行性与后端迭代<\/h2>\n<p>调度后要核对两条边界：发射槽位与功能单元数量满足；重排后访存顺序在别名保守假设下合法。不满足则回退到依赖约束更紧的顺序。调度结果反馈给分配：范围交叠变宽时，分配压力上升；分配插入溢出 load/store 后，新指令再次进入调度列表排依赖位置。<\/p>\n<p>循环体是调度收益最大的区域：跨迭代重叠执行把长延迟操作藏到其他迭代的空隙里；软件流水在循环级重排，局部表调度不处理迭代间重叠。本书 12.5 节把这类全局方法列为高级主题（PDF 第 505 页起）。<\/p>\n<h2>第五算例：分支后指令的调度边界<\/h2>\n<p>块尾条件分支前有一条赋值 <code>c ← a + 1<\/code>，后续块引用 <code>c<\/code>。调度可把 <code>c<\/code> 的计算提前到块内靠前位置；若该计算与分支条件计算争用同一功能单元，提前后资源冲突，仍要按优先级保留顺序。分支本身的发射位置固定在块尾，分支目标块的第一条指令不能排到分支之前。<\/p>\n<p>后向调度从块尾回推：先固定分支与块尾引用，再向前找能填入延迟空隙的指令。后向安排把可晚发的指令留在后面，保证块尾关键指令的发射槽位；与前向调度相比，指令顺序不同但依赖闭环一致。<\/p>\n<h2>延伸推演：调度记录与依赖复核<\/h2>\n<p>调度输出保留原始依赖链与重排后顺序两条记录：分配与代码生成复核时，按原始依赖核对重排没有越过写后读、读后写、写后写。访存指令的别名状态由别名分析标注；标注为可能别名的访存对，顺序保持原状。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n指令进入就绪列表要满足哪三个条件？\n<\/li><li>\n表调度每发射一条指令后，对等待它结果的指令做什么更新？\n<\/li><li>\n前向调度与后向调度的推进方向各是什么？\n<\/li><li>\n调度为什么不能删除计算或改变定值？\n<\/li><li>\n局部调度与区域调度在处理块间依赖上有什么差别？\n<\/ol><\/div><\/details>", "c13": "<div class=\"source-badge\">📖 出处：编译器设计 第2版.pdf · p.152<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">LR 项目集、Action/Goto 表与移进-归约冲突<\/a><\/span><\/div><h1>属性文法：综合/继承属性与求值顺序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书第 4 章 4.3 节，PDF 第 152 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>语法正确的输入程序仍可能包含严重错误：类型不符、名字未声明、作用域用错、存储类别冲突。这些错误无法靠上下文无关文法识别，需要把每条语句放到实际上下文中检查。属性文法为这类检查提供挂接框架：在语法树的每个结点上挂属性，属性之间按依赖关系计算；综合属性从子结点传给父结点，继承属性从父结点或兄弟结点传来。属性的计算顺序由依赖图决定，图上出现回路则不存在合法求值次序。<\/p>\n<h2>定义与逐项拆解<\/h2>\n<p><strong>属性<\/strong>：附着在文法符号或语法树结点上的信息，如类型、名字、存储类别、求值结果。<\/p>\n<p><strong>综合属性<\/strong>：完全根据结点本身、其子结点和常量定义的属性。求值方向自底向上：子结点算出后，父结点取用（原书 4.3 节，PDF 第 152 页）。<\/p>\n<p><strong>继承属性<\/strong>：根据结点本身、其兄弟结点和父结点（外加常量）定义的属性。求值方向自顶向下或横向传递：父结点先算，再传给子结点。<\/p>\n<p><strong>依赖图<\/strong>：每个属性是一个结点；属性 A 的计算用到属性 B，画一条从 B 到 A 的边。求值必须沿边方向进行。<\/p>\n<p><strong>环<\/strong>：依赖图中出现回路，部分属性互相等待对方先算；不存在任何顺序能把全部属性求值出来，该输入无法按静态顺序求值（原书 4.3 节，PDF 第 152 页）。<\/p>\n<h2>原理推导（算法逐步演算）<\/h2>\n<p>第一步，按语法分析结果建好语法树，标出每个结点对应的文法产生式。<\/p>\n<p>第二步，标综合属性：名字结点的类型查符号表得到；表达式结点类型由操作数类型与运算符推出；这类属性在树的自底向上遍历中计算。<\/p>\n<p>第三步，标继承属性：外层语句把期望类型传给表达式结点，表达式再传给子表达式；这类属性在自顶向下遍历中下发。<\/p>\n<p>第四步，建依赖图：属性间的数据依赖逐条画边，被依赖属性先算，依赖方后算。<\/p>\n<p>第五步，检查回路：图上有环则属性文法对该输入无法求值；无环则按拓扑顺序算出全部属性，类型检查、作用域核对在属性值上进行。<\/p>\n<p>以赋值语句 <code>x = a + b<\/code> 的语法树为例：<code>a<\/code>、<code>b<\/code> 叶子结点查符号表得到综合属性 <code>type<\/code>；<code>+<\/code> 结点的 <code>type<\/code> 由两个操作数类型与加法规则推出；<code>=<\/code> 结点把左部 <code>x<\/code> 的类型作为继承属性下发给右部表达式，核对右部类型是否与左部匹配。依赖方向上，叶子类型先算，向上到 <code>+<\/code>，再由 <code>=<\/code> 向下核对；若规则写成“<code>+<\/code> 的类型要等 <code>=<\/code> 下发的期望类型才能定”，方向就反了，依赖图可能成环。<\/p>\n<h2>适用条件与边界（含失败案例）<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：语法树与符号表可用；属性定义规则明确，依赖方向可静态判断。\n<\/li><li>\n<strong>边界 1：环使静态求值失效<\/strong>。规则定义的属性依赖自身，或依赖图成环，固定遍历顺序必然用到未定义值；需要换用循环求值或改写规则（原书 4.3 节，PDF 第 152 页）。\n<\/li><li>\n<strong>边界 2：非终结属性可跨规则传播<\/strong>。一个非终结符在不同产生式下的属性接口要一致，否则父结点下发的继承属性找不到接收方。\n<\/li><li>\n<strong>失败案例：综合与继承方向混用<\/strong>。把应由父结点下发的期望类型写成综合属性，子结点算不出父结点信息；求值方向反了，属性值为空。\n<\/li><li>\n<strong>失败案例：依赖边漏画<\/strong>。属性 A 用到 B 却没建边，拓扑顺序可能把 A 排在 B 前，A 取到未定义属性。\n<\/li><li>\n<strong>边界 3：属性计算与翻译动作一体<\/strong>。语法制导翻译把 IR 生成动作也挂在属性上；属性求值顺序同时决定中间代码生成顺序。\n<\/li><li>\n<strong>边界 4：作用域信息超出单棵子树<\/strong>。名字声明在祖先语句或外层块中，继承属性沿树向下传递作用域表；跨过程的名字解析不属于属性文法单树范围，要靠符号表与过程间分析。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>综合与继承属性<\/strong>：综合属性向上汇总（子→父），继承属性向下或横向传递（父/兄弟→子）。同一结点可同时有两类属性，方向不同不能混算。\n<\/li><li>\n<strong>属性文法与独立类型检查器<\/strong>：属性文法把检查规则挂到文法结构上，随语法树遍历求值；独立检查器在 IR 上单独跑一遍。前者与语法结构耦合紧，后者与前端解耦。\n<\/li><li>\n<strong>语法制导翻译与静态分析<\/strong>：前者在语法/翻译阶段把语义信息写入 IR；后者在中端 CFG 上推断定值流向。属性是前端到中端的信息桥梁。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c04 LR/LL 分析产出的语法树与产生式序列是属性挂接骨架；c03 的文法符号集合为属性接口提供边界。后继：c05 三地址码生成消费属性计算结果；c06 起的数据流分析在翻译好的 IR 上进行。第 4 章流程回环中，上下文相关分析是前端结构与中端 IR 之间的一层检查。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（属性文法：综合/继承属性与求值顺序）<\/summary><div class=\"depth-body\"><h1>c13 深度推导：属性分类、依赖图构造与求值顺序算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>上下文检查要挂到语法结构上，往回追三层前提：<\/p>\n<ol><li>\n文法只回答“句子结构是否合法”，不回答“类型是否匹配、名字是否可见”。后者依赖语句所处的上下文：作用域、已声明类型、存储类别。这些信息不能由单个单词或单个产生式单独给出。\n<\/li><li>\n上下文信息需要一个附着点：语法树结点。每个结点带上若干属性，属性值在遍历树时算出；检查规则读属性、写属性。\n<\/li><li>\n属性之间有先后：父结点的期望类型要先下发，子结点才能核对；子结点的实际类型算出来，父结点才能比较。这层先后关系显式画成依赖图，求值按图上的边方向进行；图上有环就排不出合法顺序。\n<\/ol>\n<p>依赖链方向：上下文检查需求 → 语法树结点 → 综合/继承属性 → 依赖图 → 拓扑求值 → 类型与作用域核对。<\/p>\n<h2>正向演算（逐步走查）：属性标注与依赖图构造<\/h2>\n<h3>属性分类规则<\/h3>\n<ul><li>\n<strong>综合属性<\/strong>：由结点本身、子结点、常量算出；自底向上汇总。\n<\/li><li>\n<strong>继承属性<\/strong>：由结点本身、兄弟结点、父结点、常量算出；自顶向下或横向传递。\n<\/ul>\n<h3>依赖图构造<\/h3>\n<ol><li>\n每个属性在图上建一个结点；\n<\/li><li>\n属性 A 计算读取属性 B 的值，加边 <span class=\"katex-inline\">B \\to A<\/span>；\n<\/li><li>\n被依赖的 B 排在 A 之前求值；\n<\/li><li>\n遍历图检查回路：有环则静态顺序失效，无环则按拓扑序求值。\n<\/ol>\n<h3>求值方向<\/h3>\n<ul><li>\n综合属性随自底向上遍历计算；\n<\/li><li>\n继承属性随自顶向下遍历下发；\n<\/li><li>\n同一结点两类属性并存时，先算可获得的一侧，再沿依赖边推进另一侧。\n<\/ul>\n<h2>具体算例：赋值语句树的属性计算<\/h2>\n<p>语句 <code>x = a + b<\/code>，语法树：根为赋值结点，左孩子名字 <code>x<\/code>，右孩子加法结点；加法叶子为 <code>a<\/code>、<code>b<\/code>。<\/p>\n<h3>综合属性<\/h3>\n<ul><li>\n叶子 <code>a<\/code>、<code>b<\/code>：类型由符号表查得，记为 <span class=\"katex-inline\">\\tau_a<\/span>、<span class=\"katex-inline\">\\tau_b<\/span>；名字结点的类型是综合属性。\n<\/li><li>\n加法结点：类型 <span class=\"katex-inline\">\\tau_{+}<\/span> 由 <span class=\"katex-inline\">\\tau_a<\/span>、<span class=\"katex-inline\">\\tau_b<\/span> 与 <code>+<\/code> 规则推出；若两类型可兼容，结果类型确定，否则记类型冲突。\n<\/li><li>\n赋值结点：核对左值 <code>x<\/code> 的类型 <span class=\"katex-inline\">\\tau_x<\/span> 与右值 <span class=\"katex-inline\">\\tau_{+}<\/span> 是否兼容；兼容则赋值合法，否则报错。\n<\/ul>\n<h3>继承属性<\/h3>\n<p>外层上下文把期望类型传给赋值结点；赋值结点再把期望类型传给加法结点与叶子。若上下文要求表达式结果为整数，加法结点核对操作数能否转到整数；这一路信息是父结点向下传递的继承属性。<\/p>\n<h3>依赖边<\/h3>\n<ul><li>\n<span class=\"katex-inline\">\\tau_a \\to \\tau_{+}<\/span>，<span class=\"katex-inline\">\\tau_b \\to \\tau_{+}<\/span>：加法类型依赖叶子类型；\n<\/li><li>\n<span class=\"katex-inline\">\\tau_{+} \\to<\/span> 赋值核对，<span class=\"katex-inline\">\\tau_x \\to<\/span> 赋值核对：赋值比较依赖两侧类型；\n<\/li><li>\n期望类型（继承）→ 加法结点 → 叶子：下发方向。\n<\/ul>\n<p>图上无回路：叶子综合先算，加法综合随后，赋值综合最后；继承属性由根向下传。<\/p>\n<h2>第二算例：成环的属性规则<\/h2>\n<p>两条规则：<\/p>\n<pre><code>A.s = B.i\nB.i = A.s<\/code><\/pre>\n<p><span class=\"katex-inline\">A<\/span> 的综合属性 <span class=\"katex-inline\">s<\/span> 依赖 <span class=\"katex-inline\">B<\/span> 的继承属性 <span class=\"katex-inline\">i<\/span>，<span class=\"katex-inline\">B<\/span> 的 <span class=\"katex-inline\">i<\/span> 又依赖 <span class=\"katex-inline\">A<\/span> 的 <span class=\"katex-inline\">s<\/span>。依赖图上 <span class=\"katex-inline\">s \\to i<\/span>、<span class=\"katex-inline\">i \\to s<\/span> 构成回路。<\/p>\n<p>不存在先算谁的次序：先算 <span class=\"katex-inline\">s<\/span> 要先有 <span class=\"katex-inline\">i<\/span>，先算 <span class=\"katex-inline\">i<\/span> 要先有 <span class=\"katex-inline\">s<\/span>。静态遍历无论自底向上还是自顶向下，都会取到未定义值。这类规则要么改写，把其中一类信息改成常量或外部查表获得；要么用循环求值在不动点上反复迭代。<\/p>\n<h2>延伸推演：求值方法的大类<\/h2>\n<p>本书 4.3.1 节把属性求值方法分为若干大类（原书 PDF 第 152 页起；扫描件细节以转述为准）：一类在遍历语法树的过程中按方向计算属性；一类基于产生式规则调度求值；对存在回路或相互依赖的属性，采用循环求值反复更新直到稳定。具体选哪类方法，取决于属性依赖图的形状与文法规模。<\/p>\n<p>属性文法与语法制导翻译一体：类型、作用域检查写在属性规则里，IR 生成动作也可挂在同一套求值顺序上。属性算完的结果交给中端，成为三地址码与后续数据流分析的事实来源。<\/p>\n<h2>对抗性追问：有环还按固定顺序硬算会怎样<\/h2>\n<p>依赖图成环时，固定遍历先算到的那个属性，读取的是对方未初始化的值；后续检查基于错误类型信息，可能把类型不兼容的语句放行，或误报合法语句。识别回路后不能靠调换遍历方向解决，必须改规则或换循环求值。<\/p>\n<p>再追一层：依赖边漏画，拓扑排序可能把使用方排在被使用方前面；与成环后果类似，求值取到未定义属性。建图时逐条核对属性读写关系，是求值正确性的前提。<\/p>\n<h2>第三算例：嵌套作用域的继承属性下发<\/h2>\n<p>块语句 <code>{ int a; { b = a; } }<\/code>，语法树两层块。外层块把符号表指针作为继承属性传给内层块；内层名字 <code>b<\/code> 在自身符号表与外层表中逐层查找，<code>a<\/code> 沿继承表链找到外层声明。<\/p>\n<p>求值步骤：<\/p>\n<ol><li>\n外层块结点建表，写入 <code>a<\/code> 的类型与位置；表指针是传给内层块的继承属性。\n<\/li><li>\n内层块继承外层表指针，建自己的表；名字引用查找时先查内层表，未命中沿继承链到外层表。\n<\/li><li>\n<code>b = a<\/code> 赋值核对：<code>b<\/code> 在内层表或外层表查到类型，<code>a<\/code> 沿链查到外层声明，两侧类型比较。\n<\/ol>\n<p>依赖方向：表指针（父→子继承）先于名字查找；类型值（叶子综合）先于赋值核对。若内层表指针漏继承，<code>a<\/code> 在最内层表查不到，未声明错误被误报；若查找方向写成只查当前层，外层可见名字同样丢失。<\/p>\n<h2>延伸推演：遍历求值与规则调度的分工<\/h2>\n<p>遍历求值沿树的固定走向计算属性：自底向上扫一遍收综合属性，自顶向下扫一遍发继承属性；依赖图无环且方向与树走向一致时，两遍遍历即可完成。产生式规则调度则按每条产生式列出属性之间的求值次序，生成器据此排出全局顺序；文法规则多、属性交叉复杂时，比手工指定遍历方向可靠。<\/p>\n<p>两类方法都以无环依赖图为前提。属性值在产生式规则间传递：同一非终结符在不同位置出现，其属性接口在各产生式下保持一致，父结点下发的继承属性才能被子结点规则接收。接口不一致属于文法设计问题，要回到产生式定义层修，不能靠求值顺序补救。<\/p>\n<p>属性计算与符号表更新交织：名字结点查表得到类型，声明结点向表写入条目；写表动作先于同作用域后续引用的查找。这类副作用顺序同样进入依赖图：写条目是后续查找的前置。<\/p>\n<h2>对抗性追问：继承属性跨结点断链会怎样<\/h2>\n<p>父结点到子结点的继承属性要经过中间树结点逐段传递；某层结点规则没把属性接到自己的继承接口，下一层就收不到。表现是子结点属性取空，类型检查跳过或报未定义。排查方向是沿树向下逐结点核对继承属性的入边与出边，而不是先怀疑子结点规则本身。<\/p>\n<p>再追一层：把作用域表做成全局变量随遍历隐式更新，看似省去继承属性，实则树结构一旦重排或并行求值，表的先后顺序失去显式约束；显式继承属性把这条依赖写进图里，求值次序可检查、可重放。<\/p>\n<h2>第四算例：类型兼容性规则的属性合成<\/h2>\n<p>表达式 <code>a + b<\/code>，<span class=\"katex-inline\">\\tau_a<\/span>、<span class=\"katex-inline\">\\tau_b<\/span> 为叶子综合类型。加法规则表规定类型组合：两整数得整数；整数与浮点按提升规则得浮点；不兼容组合记冲突。加法结点综合属性 <span class=\"katex-inline\">\\tau_+<\/span> 查规则表得到。赋值结点再把 <span class=\"katex-inline\">\\tau_+<\/span> 与左值类型 <span class=\"katex-inline\">\\tau_x<\/span> 比较：可赋值则合法，不可赋值报错或插入转换。<\/p>\n<p>依赖顺序：叶子类型先于加法综合，加法综合先于赋值核对；期望类型作为继承属性从外层下发，与实际类型在赋值结点汇合。规则表查找本身是外部动作，不构成树内属性环。<\/p>\n<h2>延伸推演：属性文法在前端流程中的位置<\/h2>\n<p>语法分析产出语法树后，上下文相关分析沿树跑属性求值：符号表建立、类型检查、作用域核对、存储类别检查都挂在属性规则上。求值通过后，翻译动作把类型信息与表达式结构写成三地址码；属性值是 IR 生成时确定类型、选择运算形式的依据。<\/p>\n<p>分析方法上，属性规则既可在语法树遍历中直接执行动作，也可先建依赖图再排拓扑序；前者实现直接，后者便于检查回路与调整求值次序。大型文法下规则交叉多，先建图后排序更稳妥；回路检测在翻译动作执行前完成，避免错误属性值进入 IR。<\/p>\n<p>属性接口与非终结符绑定：一个非终结符在不同产生式中出现，其综合产出与继承接收要对齐；文法扩充新产生式时，同步补齐属性规则，否则该分支求值时属性缺值。<\/p>\n<h2>第五算例：声明条目写入与引用查找的次序<\/h2>\n<p>块语句先执行声明结点的写表动作：把名字、类型、存储类别写入符号表条目；后续引用结点的查找动作在表条目之后。依赖图上写表边指向同作用域内的查找边。若声明出现在引用之后（前向引用受限的语言），规则要在属性层记录“尚未声明”状态，查找动作读到该状态并报错，而不是取空类型。<\/p>\n<p>继承属性沿作用域链传递表指针：外层块表指针传给内层块；内层块表在自身条目之外，沿继承链访问外层条目。写表动作只改当前层表，不改外层表；引用查找按内层到外层的顺序命中。<\/p>\n<h2>延伸推演：属性求值与翻译动作的时序<\/h2>\n<p>IR 生成动作挂在属性规则上：表达式类型确定后才生成对应运算形式的三地址指令；名字地址信息就绪后才生成 load/store 操作数。求值顺序保证动作执行时所需属性已就绪；属性未就绪就生成动作，会在 IR 里留下未确定类型或未绑定名字的占位。<\/p>\n<p>回路检测在动作执行前完成：依赖图有环时，先报告文法规则问题，不进入翻译阶段。无环图按拓扑序遍历，综合属性自底向上、继承属性自顶向下；两类属性在同一结点汇合时，按图上边序确定先后，不固定某一类永远先算。<\/p>\n<p>大型文法下属性规则数量多，产生式之间的属性接口由非终结符签名约束；新增产生式时检查签名是否补齐，避免某分支求值时继承属性缺入边、综合属性缺出边。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n综合属性与继承属性各由哪些结点的信息定义，求值方向分别是什么？\n<\/li><li>\n依赖图上的边从哪个属性指向哪个属性？\n<\/li><li>\n为什么依赖图成环就不存在静态求值次序？\n<\/li><li>\n继承属性从父结点下发到子结点，中间经过哪些树结点？\n<\/li><li>\n属性求值顺序为什么同时决定中间代码的生成顺序？\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：前端：词法分析与语法分析（正则→NFA→DFA、LL(1) 与 LR 分析）<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因）<\/a><br>检查点：能画出一个具体正则的 Thompson NFA 状态图，走完子集构造列出 DFA 状态与转移，对给定文法算 FIRST/FOLLOW 并判定是否 LL(1)，构造 LR 项目集并指出冲突项目与冲突类型<\/li><li class='path-step' id='path-02'><strong>步骤 02：中端：中间表示、数据流分析与标量优化（三地址码、CFG、到达定值、活跃变量、SSA）<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化）<\/a><br>检查点：能把一段三地址码切成基本块并画出 CFG，对手算流图两轮迭代写出到达定值与活跃变量集合到不动点，说明 φ 函数放置位置，区分可靠与不可靠优化并解释优化为什么不能改变可观察行为<\/li><li class='path-step' id='path-03'><strong>步骤 03：后端：指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出）<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：后端——指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出）<\/a><br>检查点：能用重写规则对一棵表达式树做动态规划覆盖并选出成本最低指令序列，说清表调度按什么优先级在就绪列里选指令，画出两个活动范围的冲突图并按图着色解释溢出代价从 load/store 次数怎样估出来<\/li><li class='path-step' id='path-04'><strong>步骤 04：全流程贯通：编译概览、上下文相关分析、过程抽象与代码形式<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：全流程贯通——编译概览、上下文相关分析、过程抽象与代码形式<\/a><br>检查点：能把前端、中端、后端串成一次完整编译流程，区分综合属性与继承属性并说明依赖图成环时求值顺序怎样确定，说清过程调用的栈帧、参数传递与活跃寄存器保存，以及代码形式决策怎样影响后续分析<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='编译器（compiler）'>编译器（Compiler） — 把一种语言编写的程序转换为另一种语言编写的程序的计算机程序；典型结构含前端、中端与后端，前端做词法与语法分析，中端做中间表示与优化，后端做指令选择、调度与寄存器分配 <span class=glossary-ref>（第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因））<\/span><\/li><li data-term='词法分析器（scanner）'>词法分析器（Scanner） — 编译器前端的第一阶段：读取字符流，按语言规定的词法规则把字符序列切成单词（token），每个单词归入一个语法范畴（词类）；本书第 2 章讨论其正则表达式、自动机与手工实现 <span class=glossary-ref>（第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因））<\/span><\/li><li data-term='正则表达式（regular expression, re）'>正则表达式（Regular Expression, RE） — 定义单词集合的形式化记号：字母与数字是基本 RE，连接、并（|）、闭包（*）由运算符组合；本书 2.3 节给出其符号表示法与形式化定义 <span class=glossary-ref>（第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因））<\/span><\/li><li data-term='nfa（非确定有限自动机）'>NFA（非确定有限自动机） — 带 ε 转移、同一状态对同一输入可有多条转移的有限自动机；由 Thompson 构造从 RE 得到，识别语言与 RE 相同，但执行前需经子集构造转为 DFA <span class=glossary-ref>（第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因））<\/span><\/li><li data-term='dfa（确定有限自动机）'>DFA（确定有限自动机） — 每个状态对每个输入符号至多一条转移、无 ε 转移的有限自动机；执行时不需要回溯，本书 2.4.3 节由 NFA 子集构造得到，2.4.4 节用 Hopcroft 算法最小化 <span class=glossary-ref>（第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因））<\/span><\/li><li data-term='first 集合 / follow 集合'>FIRST 集合 / FOLLOW 集合 — LL(1) 分析用的两个预测集合：FIRST(A) 是从符号 A 出发能推导出的串首终结符集合；FOLLOW(A) 是文法中紧跟在 A 后面出现的终结符集合；二者决定分析表同一格是否出现多重动作 <span class=glossary-ref>（第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因））<\/span><\/li><li data-term='lr(1) 项与项目集规范族'>LR(1) 项与项目集规范族 — LR 分析中形如 [A→α·β, a] 的项记录产生式右部已识别到的位置与前瞻符 a；所有可达项构成项目集规范族，据此填 Action 与 Goto 表 <span class=glossary-ref>（第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因））<\/span><\/li><li data-term='移进-归约冲突 / 归约-归约冲突'>移进-归约冲突 / 归约-归约冲突 — LR 表同一格同时出现移进与归约动作，或同时出现两条归约动作；前者说明文法含左递归或需更长前瞻，后者说明同一串可由两条不同产生式归约 <span class=glossary-ref>（第 1 章：前端——词法分析与语法分析（正则→NFA→DFA、LL/LR 冲突的成因））<\/span><\/li><li data-term='中间表示（ir）'>中间表示（IR） — 编译器在源语言与目标语言之间使用的形式化程序表示；本书第 5 章区分图 IR（语法树、图）与线性 IR（堆栈机代码、三地址代码），并由线性代码建立控制流图 <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><li data-term='三地址代码（three-address code）'>三地址代码（Three-Address Code） — 每条指令至多含一个运算符、两个操作数与一个结果的线性 IR，形如 t1 ← 2、t3 ← t1 × t2；本书以 ILOC 作为贯穿各章的底层线性 IR（附录 A） <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><li data-term='基本块（basic block）'>基本块（Basic Block） — 线性代码中一段顺序执行的指令序列：只有块首一条入口指令，块内无分支跳入跳出，块尾是最后一条转移指令；基本块是控制流图的结点 <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><li data-term='控制流图（cfg）'>控制流图（CFG） — 以基本块为结点、块间转移为边的有向图；数据流分析在 CFG 上按边传播定值、活跃性等信息，本书 5.3.4 节由线性代码建立 <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><li data-term='到达定值（reaching definitions）'>到达定值（Reaching Definitions） — 一个变量的定值（赋值）能否沿 CFG 路径到达某程序点且中途未被重新赋值；属前向数据流问题，用迭代算法在不动点上收敛 <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><li data-term='活跃变量（live variable）'>活跃变量（Live Variable） — 在某程序点之后的路径上还会被引用、且在此之前未被重新定值的变量；属后向数据流问题，其结果直接决定寄存器压力与溢出决策 <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><li data-term='ssa（静态单赋值形式）'>SSA（静态单赋值形式） — 每个变量只被定值一次的 IR 形式；在控制流合并处插入 φ 函数选择各前驱传来的版本，使变量的定义-使用链唯一，简化常量传播与寄存器分配分析 <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><li data-term='φ 函数'>φ 函数 — SSA 在控制流合并块插入的选择运算：v₁ ← φ(v₂, v₃) 表示按来自哪条前驱路径取对应版本；放置位置由支配边界与变量的定义集合算出 <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><li data-term='寄存器分配 / 指派'>寄存器分配 / 指派 — 分配决定哪些活动范围占用寄存器，指派决定每个范围落到哪个具体寄存器；本书第 13 章以冲突图为基础做全局分配，度数超过可用寄存器数的活动范围需溢出到内存 <span class=glossary-ref>（第 3 章：后端——指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出））<\/span><\/li><li data-term='活动范围（live range）与冲突图'>活动范围（Live Range）与冲突图 — 一个定值从定义到最后一次引用之间的区间称活动范围；两个活动范围生命周期重叠即在冲突图中连边，图的着色问题等价于寄存器分配问题 <span class=glossary-ref>（第 3 章：后端——指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出））<\/span><\/li><li data-term='溢出（spill）'>溢出（Spill） — 寄存器不足时把某些活动范围降级到内存：在使用前插入 load、在定值后插入 store；溢出代价按相关 load/store 的执行频率估算，优先溢出代价最低的范围 <span class=glossary-ref>（第 3 章：后端——指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出））<\/span><\/li><li data-term='树模式匹配指令选择'>树模式匹配指令选择 — 把 IR 表达式平铺成抽象语法树，用重写规则（产生式、成本、代码模板）在树上匹配覆盖，自底向上用动态规划求出成本最低的指令序列；本书 11.4 节讨论 <span class=glossary-ref>（第 3 章：后端——指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出））<\/span><\/li><li data-term='表调度（list scheduling）'>表调度（List Scheduling） — 局部指令调度的主算法：维护就绪指令列表，按优先级排序后每次选出一条发射；本书第 12 章讨论前向/后向表调度、平局打破与区域调度 <span class=glossary-ref>（第 3 章：后端——指令选择、指令调度与寄存器分配（树覆盖、表调度、图着色与溢出））<\/span><\/li><li data-term='综合属性 / 继承属性'>综合属性 / 继承属性 — 属性文法中：综合属性由结点本身、其子结点与常量定义；继承属性由结点本身、其兄弟结点与父结点（外加常量）定义；属性依赖图决定求值顺序，成环则无法求值 <span class=glossary-ref>（第 4 章：全流程贯通——编译概览、上下文相关分析、过程抽象与代码形式）<\/span><\/li><li data-term='过程抽象与调用约定'>过程抽象与调用约定 — 编译器为过程建立的受控执行环境：形参映射、栈帧布局、返回值传递、调用者/被调用者保存寄存器规则；本书第 6 章讨论 Algol 类与面向对象语言的命名空间与链接约定 <span class=glossary-ref>（第 4 章：全流程贯通——编译概览、上下文相关分析、过程抽象与代码形式）<\/span><\/li><li data-term='可观察行为（observable behavior）'>可观察行为（Observable Behavior） — 程序运行时外部可感知的结果：输出、输入交互、未定义之外的异常等；编译器优化只能改变内部实现，不能改变等价程序在所有输入下的可观察行为 <span class=glossary-ref>（第 2 章：中端——中间表示、数据流分析与优化（三地址码、CFG、到达定值、活跃变量、SSA、标量优化））<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：规则先形式化，再机械转成自动机<\/h2>\n<p>词法规则先用正则表达式写成独立记号，再由确定的构造步骤转成 NFA、DFA。人维护的是 RE 层规则，自动机由工具生成；改关键字或运算符只改 RE，不手改状态转移。识别能力等价的两种表示之间，构造顺序固定：RE → NFA → 子集构造 → 最小化，不能跳过闭包计算直接拼 DFA 转移。<\/p>\n<h2>模式 2：预测集合先算全，再填分析表<\/h2>\n<p>语法分析前先把 FIRST、FOLLOW 集合迭代到稳定，再按产生式填表；同一格出现两条产生式即记录冲突。填表依据是集合而非试探：候选首符落在 FIRST，可推 ε 的候选落在 FOLLOW。冲突先回到文法层消左递归、提左公因子；改不动文法再换 LR 分析器，不靠分析器回溯掩盖冲突。<\/p>\n<h2>模式 3：先切块建图，再在图上传播信息<\/h2>\n<p>线性 IR 先按领导者规则切成基本块，块间转移建成 CFG；数据流方程在图结点上迭代，不在逐条指令上就地推断。前向问题从入口沿边传定值，后向问题从出口沿边传活跃性；迭代到各轮集合不再变化才取不动点。切块破坏“块内顺序执行”前提，后续局部推断全部失焦。<\/p>\n<h2>模式 4：分析结果限定在数据流事实支持的范围内做变换<\/h2>\n<p>每一类优化都挂一条数据流事实：死代码消除靠活跃变量，冗余消除靠到达定值，代码移动靠循环不变量与可用性。变换前核对事实覆盖所有路径；事实不足（别名不明、路径未知、定值可能被改写）就保留原代码。优化不能改变可观察行为，宁可少消一处重复，不能放走一个可能被引用的定值。<\/p>\n<h2>模式 5：后端按选择、调度、分配三段串行推进<\/h2>\n<p>指令选择定用哪条指令，调度定指令顺序，分配定寄存器落点；前一段产物是后一段输入。选择阶段只留操作数占位，不绑定物理寄存器；调度按依赖链排顺序，不替换指令；分配在调度后的活动范围上建冲突图。三段之间有反馈：分配溢出产生的 load/store 要回调度复查依赖，调度拉长的存活区间要回分配重估冲突。<\/p>\n<h2>模式 6：冲突图不可着色时先拆范围，再重新建图<\/h2>\n<p>寄存器不足时不硬给超图分配颜色：选代价最低的范围溢出，拆成定值后 store、使用前 load 的短子范围，子范围重新进冲突图参与着色。溢出代价按访存频率估算，热路径上的长范围尽量保留；简化阶段度数小于寄存器数的结点先移除，逆序着色，留下的高密结点才是溢出候选。<\/p>\n<h2>模式 7：语义检查挂在语法树结点上，按依赖图次序求值<\/h2>\n<p>类型、作用域、存储类别检查不在语法分析里做，而在分析产出的语法树结点上挂属性。综合属性自底向上汇总，继承属性自顶向下下发；属性间读写关系画成依赖图，无环按拓扑序求值，成环先改规则。翻译动作（生成 IR）排在属性就绪之后；依赖边漏画或方向反了，动作取到未定义属性，错误要到中端才暴露。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 前端：词法分析与语法分析<\/strong>：正则表达式 → Thompson 构造 NFA → 子集构造 DFA → Hopcroft 最小化；LL(1) 算 FIRST/FOLLOW 填表；LR(1) 建项目集规范族填 Action/Goto。对应原书第 2–3 章（PDF 第 32–134 页；印刷页 = PDF 页 − 15）。\n<\/li><li>\n<strong>第 2 章 中端：中间表示、数据流分析与优化<\/strong>：三地址码切基本块建 CFG；到达定值（前向）、活跃变量（后向）迭代到不动点；SSA 插 φ；常量传播、复制传播、死代码消除。对应原书第 5、8、9、10 章（PDF 第 177–197、313–455 页；印刷页 = PDF 页 − 15）。\n<\/li><li>\n<strong>第 3 章 后端：指令选择、调度与寄存器分配<\/strong>：树覆盖 + 动态规划选指令；表调度按优先级排顺序；冲突图简化-着色分配寄存器，不够用时溢出。对应原书第 11、12、13 章（PDF 第 456–545 页；印刷页 = PDF 页 − 15）。\n<\/li><li>\n<strong>第 4 章 全流程贯通<\/strong>：编译各阶段回环；上下文相关分析挂属性文法；过程抽象与调用约定；代码形式决策如何影响 IR 与后端。对应原书第 1、4、6、7 章与附录 A（PDF 第 16–31、135–176、213–312、546–554 页；印刷页 = PDF 页 − 15）。\n<\/ul>\n<h2>词法层流水线速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>步骤<\/th><th>输入<\/th><th>动作<\/th><th>产物<\/th><\/tr><\/thead><tbody><tr><td>RE 写规则<\/td><td>单词集合<\/td><td>连接、并、闭包组合<\/td><td>正则表达式<\/td><\/tr><tr><td>Thompson 构造<\/td><td>RE<\/td><td>五条规则逐子表达式建自动机<\/td><td>带 ε 边的 NFA<\/td><\/tr><tr><td>子集构造<\/td><td>NFA<\/td><td>ε-闭包 + 字符转移求子集<\/td><td>无 ε 的 DFA<\/td><\/tr><tr><td>最小化<\/td><td>DFA<\/td><td>按行为签名分组合并等价状态<\/td><td>状态数最少的 DFA<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>LL(1) 与 LR 对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>LL(1)<\/th><th>LR（SLR/LR(1)/LALR）<\/th><\/tr><\/thead><tbody><tr><td>推导方向<\/td><td>自顶向下，最左推导<\/td><td>自底向上，归约到开始符<\/td><\/tr><tr><td>预测依据<\/td><td>FIRST、FOLLOW 集合<\/td><td>项目集规范族 + 前瞻<\/td><\/tr><tr><td>冲突类型<\/td><td>同一格两条产生式<\/td><td>移进-归约、归约-归约<\/td><\/tr><tr><td>文法限制<\/td><td>需消左递归、提左公因子<\/td><td>可处理更多左递归文法<\/td><\/tr><tr><td>表体积<\/td><td>小<\/td><td>LR(1) 最大，LALR 压缩<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>数据流问题对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>问题<\/th><th>方向<\/th><th>集合<\/th><th>方程<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td>到达定值<\/td><td>前向<\/td><td>定值集合<\/td><td><span class=\"katex-inline\">\\text{OUT}[B]=\\text{GEN}[B]\\cup(\\text{IN}[B]-\\text{KILL}[B])<\/span>，<span class=\"katex-inline\">\\text{IN}[B]=\\bigcup_{P\\in\\text{pred}(B)}\\text{OUT}[P]<\/span><\/td><td>定值流向、冗余判断<\/td><\/tr><tr><td>活跃变量<\/td><td>后向<\/td><td>变量集合<\/td><td><span class=\"katex-inline\">\\text{LIVE\\_IN}[B]=\\text{USE}[B]\\cup(\\text{LIVE\\_OUT}[B]-\\text{DEF}[B])<\/span>，<span class=\"katex-inline\">\\text{LIVE\\_OUT}[B]=\\bigcup_{S\\in\\text{succ}(B)}\\text{LIVE\\_IN}[S]<\/span><\/td><td>寄存器压力、死代码判断<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>后端三步分工<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>阶段<\/th><th>回答的问题<\/th><th>输入<\/th><th>主要数据结构<\/th><\/tr><\/thead><tbody><tr><td>指令选择<\/td><td>用哪条目标指令<\/td><td>IR 表达式树<\/td><td>重写规则、成本表、覆盖标注<\/td><\/tr><tr><td>指令调度<\/td><td>指令排成什么顺序<\/td><td>选择后的指令序列<\/td><td>就绪列表、优先级、依赖链<\/td><\/tr><tr><td>寄存器分配<\/td><td>哪个值占哪个寄存器<\/td><td>活动范围<\/td><td>冲突图、颜色池、溢出代价<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>关键记号<\/h2>\n<ul><li>\n三地址码：<code>t3 ← t1 × t2<\/code>；ILOC 为贯穿全书的底层线性 IR（附录 A，PDF 第 546 页）。\n<\/li><li>\nLR(1) 项：<span class=\"katex-inline\">[A \\to \\alpha \\cdot \\beta,\\, a]<\/span>，圆点标记已识别位置，<span class=\"katex-inline\">a<\/span> 为前瞻符。\n<\/li><li>\nSSA 汇合选择：<span class=\"katex-inline\">v_1 \\leftarrow \\phi(v_2, v_3)<\/span>，按前驱路径取版本。\n<\/li><li>\n溢出：定值后 <code>store<\/code>、使用前 <code>load<\/code>；代价按相关访存指令的执行频率估算。\n<\/ul>\n<h2>优化可靠性核对清单<\/h2>\n<ol><li>\n被删定值在所有路径上是否都无引用？\n<\/li><li>\n被移动计算的副作用时机是否保持可观察？\n<\/li><li>\n被复用的表达式中间是否未被改写？\n<\/li><li>\n特化假设是否覆盖实际执行路径？\n<\/li><li>\n别名不确定的访存对是否保留原顺序？\n<\/ol>\n<p>任一项不满足，该变换不执行；分析精度不足时宁可少优化。<\/p>"}};
const pages = DATA.rendered;

const SOURCES = {};
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
const ZS_VERSION = '1.9.0';
/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}
