.prereq-hard .prereq-tag{background:var(--bad);color:#fff}

.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}

.quiz-opts label{display:block;padding:4px 0;cursor:pointer}

isites": ["c04", "c05"]}, {"id": "c07", "title": "成片流程：素材—文案—画面—配音—音乐—导出的顺序决策", "file": "concepts/c07.md", "chapterIds": ["ch03"], "difficulty": "中级", "source": {"file": "AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 94}, "depthFragment": "concepts/c07-depth.md", "prerequisites": []}, {"id": "c08", "title": "字幕识别校对与口播剪辑的对齐成本", "file": "concepts/c08.md", "chapterIds": ["ch03"], "difficulty": "中级", "source": {"file": "AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 105}, "depthFragment": "concepts/c08-depth.md", "prerequisites": ["c07"]}, {"id": "c09", "title": "协同表格与文档：字段约束、多视图与权限继承", "file": "concepts/c09.md", "chapterIds": ["ch04"], "difficulty": "中级", "source": {"file": "AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 120}, "depthFragment": "concepts/c09-depth.md", "prerequisites": []}, {"id": "c10", "title": "扣子智能体与工作流：节点、变量传递、知识库检索与触发条件", "file": "concepts/c10.md", "chapterIds": ["ch04"], "difficulty": "进阶", "source": {"file": "AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 178}, "depthFragment": "concepts/c10-depth.md", "prerequisites": ["c03", "c09"]}], "glossary": [{"term": "提示词框架", "def": "把模糊请求改写成可执行指令的三段式结构：背景定位（角色、品牌、用户画像）、目标明确（动作、成果名称、数量）、要求细化（输出结构与逐项标准），见 PDF 第 19–21 页", "chapterId": "ch01"}, {"term": "结构化输出", "def": "在提示词中约定交付物由哪些部分组成、每部分写什么、用什么分隔，使模型按固定模板产出可直接使用的条目，而不是自由发挥的长段落", "chapterId": "ch01"}, {"term": "多轮对话迭代", "def": "在同一对话中先定义问题、再迭代方案、最后总结复盘；每轮补充或修正上一轮的约束，模型沿上下文继续调整，而不是每次重开一个新对话", "chapterId": "ch01"}, {"term": "图像提示三层", "def": "文生图提示词的组成：主体（画面主角）、环境（场景与氛围）、风格（视觉呈现形式，如摄影写实、二次元卡通、水墨、3D 等），表情包场景用动作情绪替代环境要素，见 PDF 第 49、51 页", "chapterId": "ch02"}, {"term": "图片比例", "def": "生成画面的宽高比，书中给出 16:9 适合壁纸、1:1 适合头像与表情包、3:4 适合竖版海报、9:16 适合手机壁纸；选定比例后尺寸输入会被比例约束，见 PDF 第 50 页", "chapterId": "ch02"}, {"term": "首尾帧", "def": "图生视频时先定结尾画面作为视觉基准，再让首帧参照尾帧生成，使一段视频的人物、场景与风格前后保持一致", "chapterId": "ch02"}, {"term": "智能字幕", "def": "剪映中由语音识别把视频人声转成字幕条并适配时间轴的功能；识别后仍需人工校对错别字，再批量套用字体、字号、颜色等样式，见 PDF 第 105–108 页", "chapterId": "ch03"}, {"term": "智能剪口播", "def": "自动识别口播视频中的语气词、口误与长时间停顿并标记删除片段的功能；粗剪后仍需预览调整被标记片段，再确认删除，见 PDF 第 107 页起", "chapterId": "ch03"}, {"term": "多维表格字段类型", "def": "飞书多维表格中每一列的数据种类（如文本、数字、日期、单选、人员、附件等）；字段类型约束该列能填什么、能否被公式与视图按规则处理", "chapterId": "ch04"}, {"term": "知识库", "def": "在扣子或飞书中上传文档、表格、图片后供智能体检索的私有资料集合；回答时先在库内检索相关条款，检索不到按预设兜底话术回应，见 PDF 第 176–181 页", "chapterId": "ch04"}, {"term": "工作流节点", "def": "扣子工作流画布上的处理单元，如开始、大模型、图像生成、结束；节点之间用连线传递变量，上游节点的输出变量被下游节点引用为输入，见 PDF 第 208–210、215–217 页", "chapterId": "ch04"}, {"term": "触发器", "def": "扣子智能体上按条件自动执行任务的设定，书中案例为定时触发：每天 17:00 由机器人提示推送行业新闻，见 PDF 第 200–201 页", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [], "flashcards": []}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.16<\/div><h1>第 1–2 章：豆包——对话式办公与内容生产<\/h1>\n<blockquote>对应原书第 1 章《新手怕难？3 分钟轻松上手豆包》（PDF 第 16–31 页）、第 2 章《从小白到高手，解锁豆包的 4 个核心功能》（PDF 第 32–45 页）。原书界面基于书中版本，软件界面与入口可能已变。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：会在聊天框输入文字、能上传文档与图片\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n把一句模糊请求改写成背景定位、目标明确、要求细化三段式提示词；\n<\/li><li>\n区分补充关键信息、调整表述方式、限定输出边界三种迭代手段，知道各自挡住哪一类跑偏；\n<\/li><li>\n按任务把 AI 搜索、AI 写作、AI 阅读、AI PPT 四类功能对上对应的办公环节；\n<\/li><li>\n说清多轮对话中“定义问题—迭代方案—总结复盘”三个阶段各自该做什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>豆包给出的答案不合用，多数时候不是模型不会，而是提示词只交代了“做什么”，没交代“为谁做、做到什么程度、按什么结构交”；本章把对话拆成提示词构造、迭代改稿、结构化输出三件可重复操作的事。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：有效提示词的三步骤（c01）<\/h3>\n<p>书中 1.2.1 节把模糊请求转成可用提示词的过程拆成三步：背景定位先把模型从“通用模型”换成特定角色，目标明确说清交付物的动作、名称与数量，要求细化把判断标准写成逐项可执行的清单（PDF 第 19–21 页）。三步的顺序不能换：背景决定视角，目标决定交付物形态，细化决定验收口径。详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。<\/p>\n<h3>概念 2：迭代式改稿与差异指令（c02）<\/h3>\n<p>一份及格方案到优秀方案之间，靠的是多轮追问、补充和修正。书中 1.2.2 节给出三条迭代路径：补充关键信息（成功范例、负面清单、竞争信息）填补认知盲区；调整表述方式（形容词换成动词加方法、角色扮演或风格类比、引导性问题替代模糊命令）；限定输出边界避免过度发挥（PDF 第 22–25 页）。多轮对话沿上下文累计约束，不需要每轮重写全部要求。详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。<\/p>\n<h3>概念 3：结构化输出与模板复用（c03）<\/h3>\n<p>要求细化的落点是输出结构：书中营销方案案例规定每套方案包含主题名称、核心口号、用户洞察、创意故事、渠道建议五个部分，并逐项写清每部分写什么（PDF 第 21 页）。同一份结构约定在同类任务上复用，产出就能直接套用模板检查，不必每次重新沟通格式。详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。<\/p>\n<p>第 2 章的四个功能是上述方法在办公环节上的落地：AI 搜索负责联网取信息并溯源（PDF 第 32–35 页），AI 写作负责长文构思与润色（PDF 第 35–38 页），AI 阅读负责长文提炼与要点总结（PDF 第 39–41 页），AI PPT 负责把整理好的核心信息转成演示文稿（PDF 第 42–44 页，书中版本，界面可能已变）。<\/p>\n<h2>完整推导 1：从一句模糊请求到三段式提示词的推演<\/h2>\n<p>推演对象是书中案例：品牌策划小王要为一款新品饮料构思夏季营销活动创意，原始输入是“为这款饮料想一些夏季营销活动创意”（PDF 第 18 页）。<\/p>\n<p>第一步先拆失效原因。这句话里没有出现品牌调性、目标用户、交付物形态和数量，模型只能按大众化、最安全的知识作答，产出的是一套通用点子，换到任何品类都成立。推演链条：缺角色信息 → 模型以通用视角作答；缺交付物定义 → 模型无法判断该给口号、长文还是方案；缺结构标准 → 模型自行填充章节，用户仍需重排。<\/p>\n<p>第二步按三步骤补全。背景定位补角色定义（顶级 4A 广告公司首席创意官）、品牌信息（主打自然、活力、年轻的新兴饮料品牌）、用户画像（Z 世代和都市年轻白领）。目标明确补动作（构思）、成果名称（营销活动方案）、数量（3 套完全不同方向）。要求细化补输出结构：每套方案含主题名称、核心口号、用户洞察、创意故事、渠道建议五项，并逐项写明写法。<\/p>\n<p>第三步检验补全后的覆盖度。把原请求里的三个失效原因逐条对照：角色缺位由背景定位补上，形态缺位由目标明确补上，标准缺位由要求细化补上。推演结论：提示词的每一段都对应一类具体跑偏，缺哪一段，对应那一类问题就会在输出里复现。<\/p>\n<h2>完整推导 2：三种迭代手段挡住的跑偏类型对比推演<\/h2>\n<p>第一轮方案交上来之后，常见问题有三类：方向对但不够贴合品牌、表述空泛无法执行、附带一堆多余解释。<\/p>\n<p>推演手段一，补充关键信息。模型默认不知道企业内部文化、过往成功经验与需要规避的风险。书中列出三类补充：成功范例定义“好”的参照物（如去年成功活动“城市角落咖啡地图”，关键要素是用户生成内容与社区感）；负面清单划定禁区（如不使用明星代言、不做硬性打折促销）；竞争信息实现差异化（如主打对手未覆盖的日常、轻松、可触及场景）。推演链路：范例 → 风格有参照；禁区 → 排除违规方向；对手格局 → 找到空位。<\/p>\n<p>推演手段二，调整表述方式。“让活动口号更有冲击力”是感觉描述，模型无法直接执行；改成“使用动词加场景的句式，运用排比或对比手法”才是可操作指令。书中另外两条技巧：与其费力描述风格，不如让模型扮演一个具体范例角色；与其下模糊命令，不如拆成几个引导性问题逐个回答。<\/p>\n<p>推演手段三，限定输出边界。模型为表现能力可能额外输出一整段解释，这些格式不符的内容需要手动删除。边界约定的是交付规格：写几条、每条多长、是否给解释、用什么格式排。三类手段分别处理内容贴合度、可执行性与篇幅范围，互不替代。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[模糊请求] --&gt; B[背景定位: 角色/品牌/用户画像]\nB --&gt; C[目标明确: 动作/成果名称/数量]\nC --&gt; D[要求细化: 输出结构逐项标准]\nD --&gt; E[第一轮方案]\nE --&gt; F{是否贴合预期}\nF --&gt;|不贴合| G[补充关键信息: 范例/禁区/竞争]\nF --&gt;|不可执行| H[调整表述: 动词+方法/角色扮演/引导问题]\nF --&gt;|篇幅越界| I[限定输出边界: 条数/格式/篇幅]\nG --&gt; E\nH --&gt; E\nI --&gt; E\nF --&gt;|通过| J[结构化交付]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p>把提示词比作给外包brief：只说“帮我做个活动方案”，外包只能按行业惯例猜；写清你是谁、服务谁、要几套、每套包含哪几项、哪些不能碰，对方才能直接交稿。书中 AI 写作、AI 阅读两个功能走的也是同一条链路：先给背景和目标，再给结构要求，最后在多轮里修订措辞与篇幅。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n误解一：提示词写一次就该出终稿。书中把从及格到优秀的差距放在迭代优化阶段，第一轮方案只是可修改的初稿。\n<\/li><li>\n误解二：把形容词堆上去就是细化。“更感人、更有冲击力”仍是感觉词；细化要落到句式、手法、条目数量这类可检查要求上。\n<\/li><li>\n误解三：多轮对话可以随便开新窗口。上下文累计依赖前几轮补充的约束，新开窗口等于丢掉已经交代过的背景与禁区。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n背景定位包含哪三类信息？（角色定义、品牌信息、用户画像，PDF 第 19 页）\n<\/li><li>\n目标明确要定义哪三个交付要素？（动作、交付成果名称、方案数量，PDF 第 19–20 页）\n<\/li><li>\n补充关键信息有哪三类？（成功范例、负面清单、竞争信息，PDF 第 22–23 页）\n<\/li><li>\n调整表述方式的三个技巧是什么？（形容词换动词加方法、角色扮演或风格类比、引导性问题，PDF 第 24 页）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>反事实一：若不给背景定位，直接进入目标与结构要求，模型会用最大众化的视角作答，输出换到餐饮、服装、电子产品都成立，品牌调性与用户画像两条约束在全篇无着落。 反事实二：若只给目标明确而不给要求细化，模型知道要“3 套方案”，但每套内部章节由它自行决定，口号、洞察、故事、渠道之间可能缺项，检查时仍要逐条补结构。 反事实三：若去掉输出边界，模型可能把一句口号扩写成整段解释，额外篇幅在交付前需要人工删减；删减环节一旦漏掉，不合规格的内容会直接进入后续材料。 反事实四：若迭代时重开新对话，上一轮补充的范例、禁区与竞争信息不进入新上下文，第二轮输出会回到第一轮的通用水平，已完成的约束沟通作废。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章是全书的方法底座：提示词三步骤在第 2 章对应到豆包四个功能，在第 4 章即梦变形成图像提示三层（c04），在第 5 章扣子变形成智能体人设与回复逻辑（c10）。多轮迭代的思路也贯穿后续所有工具的“先生成初稿、再按差异指令修订”流程。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n三步骤：背景定位 → 目标明确 → 要求细化（PDF 第 19–21 页）\n<\/li><li>\n三迭代：补充关键信息、调整表述方式、限定输出边界（PDF 第 22–25 页）\n<\/li><li>\n四功能：AI 搜索、AI 写作、AI 阅读、AI PPT（PDF 第 32–44 页）\n<\/li><li>\n多轮三阶段：定义问题、迭代方案、总结复盘（PDF 第 26–31 页）\n<\/ul>", "kind": "chapter", "title": "第 1–2 章：豆包——对话式办公与内容生产"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.46<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1–2 章：豆包——对话式办公与内容生产<\/a><\/span><\/div><h1>第 3–6 章：即梦——文生图与图生图的提示与参数<\/h1>\n<blockquote>对应原书第 3 章《不会画画？输入文字就能生成图片》（PDF 第 46–54 页）、第 4 章《想拍大片？》（PDF 第 55–67 页）、第 5 章《设计没人帮？电商视觉设计》（PDF 第 68–76 页）、第 6 章《不会做视频？新手也能制作好看视频》（PDF 第 77–89 页）。原书界面基于书中版本，模型名称、比例选项与入口可能已变。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：理解第 1 章提示词三步骤\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用主体—环境—风格三层结构写文生图提示词，并知道表情包场景如何替换要素；\n<\/li><li>\n按二次创作、写真表现、含文字海报三类任务选对模型，按用途选对图片比例；\n<\/li><li>\n说清“再次生成”与“重新编辑”分别改了什么；\n<\/li><li>\n按尾帧基准—首帧参照—首尾帧衔接的流程做出风格一致的图生视频片段。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>图像生成的可控性来自提示分层与参数配对：提示词先把画面拆成主角、场景、风格三层，模型与比例按任务类型配对；视频一致性不靠运气，靠先定尾帧基准、再用参考图约束首帧。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：图像提示的三层结构（c04）<\/h3>\n<p>书中 3.1 节给出提示词公式：主体是画面主角，环境是主体所处的场景与氛围，风格是视觉呈现形式（玻璃质感、摄影写实、二次元卡通、水墨、3D 等）（PDF 第 49 页）。表情包场景把环境要素替换为动作情绪，再加图片布局约束（角色 + 动作情绪 + 风格 + 图片布局），背景尽量纯色避免复杂场景干扰（PDF 第 51 页）。详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。<\/p>\n<h3>概念 2：模型分工与图片参数（c05）<\/h3>\n<p>书中把图片模型按任务分工：图片 4.0 面向二次创作，擅长改画面风格、增删元素、多图保持角色一致与多图合成（书中说明目前支持 6 张图片）；图片 3.1 面向写真与画面表现，场景细节、光影层次、元素质感更鲜活；图片 3.0 面向含文字图片，文字识别与呈现精度更高，可减少文字变形错漏（PDF 第 50 页）。比例方面，16:9 适合壁纸，1:1 适合头像与表情包，3:4 适合竖版海报，9:16 适合手机壁纸；选定比例后尺寸输入会被比例约束（PDF 第 50 页）。详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。<\/p>\n<h3>概念 3：首尾帧与参考图约束下的一致性（c06）<\/h3>\n<p>第 6 章产品宣传与城市宣传案例走同一条链路：先生成尾帧图片作为风格基准，再以尾帧为参考图生成首帧，最后两张图一起进入视频生成衔接过渡画面（PDF 第 82–85、87 页）。参考图对话框中选择【智能参考】（PDF 第 84 页，书中版本，界面可能已变）。详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。<\/p>\n<h2>完整推导 1：三层提示词到画面要素的覆盖推演<\/h2>\n<p>推演对象是书中《千里江山图》案例：原始想法是“画一张千里江山图”，输出难以复现原作画意（PDF 第 49 页）。<\/p>\n<p>逐层拆解失效点。只给主体“千里江山图”时，画面缺场景层次：山的远近、云雾、楼阁没有交代；缺风格约束：模型不知道该出水墨、3D 还是玻璃质感。推演链路：提示词要素不全 → 模型在未约束的维度自行补全 → 补全方向随机，同一提示多次生成差异大。<\/p>\n<p>按三层补全：主体“千里江山图”，环境“层叠的山峦”，风格“玻璃质感”。补全后提示词为“千里江山图，层叠的山峦，玻璃质感”，在图片生成界面选模型与 16:9 比例后提交（PDF 第 49 页）。检验覆盖度：主体回答“画什么”，环境回答“在哪、什么氛围”，风格回答“怎么呈现”；三层各管一个画面维度，任何一层缺位，该维度就交给模型随机补。<\/p>\n<p>表情包是同一公式的变体。九宫格表情包需要至少 9 种表情且角色形象、画风高度一致，因此要素改为角色（一个熊猫，脸部特征，上半身）、动作情绪（欢乐、生气、悲伤、愤怒、思考、拥抱、奔跑、招手等）、风格（可爱动漫插画）、图片布局（3×3 网格图，纯色背景），比例选 1:1（PDF 第 51–52 页）。<\/p>\n<h2>完整推导 2：任务类型到模型与比例的配对推演<\/h2>\n<p>配对推演分两步：先按画面要解决的问题选模型，再按发布位置选比例。<\/p>\n<p>模型分支推演。分支甲，基于已有图片做二次创作：改写实风为水墨风、增删物体、移除背景、多图保持角色一致、多图合成，需要模型对图像做精细化处理与重构，对应图片 4.0（PDF 第 50 页）。分支乙，生成图片或换脸写真，重点是画面表现力、细节、光影与质感层次，对应图片 3.1（PDF 第 50 页）。分支丙，画面含标语、标题等文字，重点是文字识别与呈现精度，对应图片 3.0（PDF 第 50 页）。分支判断依据不是个人偏好，而是画面最容易出错的环节：二次创作出错在结构改不动，写真出错在质感不够，含文字图出错在字变形错漏。<\/p>\n<p>比例分支推演。发布位置决定宽高比：电脑壁纸 16:9，头像与表情包 1:1，竖版海报 3:4，手机壁纸 9:16（PDF 第 50 页）。比例约束的是画幅方向，不是画面内容；选定比例后尺寸输入被比例约束，无法再填任意尺寸。参数配对顺序：先定任务类型选模型，再定发布位置选比例，最后才是提示词措辞。<\/p>\n<p>生成后的两种修正路径也要分清。【再次生成】基于原有提示词重新生成一组全新图片，提示词未改；【重新编辑】手动修改提示词，或借助豆包等 AI 助手继续优化提示词（PDF 第 50 页）。前者换的是采样结果，后者改的是输入条件。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[想法: 一张图/一段视频] --&gt; B{任务类型}\nB --&gt;|二次创作/多图合成| M4[图片 4.0]\nB --&gt;|写真/画面表现| M31[图片 3.1]\nB --&gt;|含文字海报| M30[图片 3.0]\nB --&gt;|图生视频| MV[视频 3.0]\nM4 --&gt; R[按用途选比例]\nM31 --&gt; R\nM30 --&gt; R\nR --&gt; R1[16:9 壁纸 / 1:1 头像表情包 / 3:4 竖版海报 / 9:16 手机壁纸]\nR1 --&gt; G[生成一组图]\nG --&gt;|提示词不变| A2[再次生成: 换采样结果]\nG --&gt;|提示词要改| A3[重新编辑: 改输入条件]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p>写图像提示词像给画师下委托单：只说“画一座山”，画师只能猜季节、光线、画法；写清主角、环境氛围、画风，画师才能按你的方向落墨。第 4 章证件照与主题摄影、第 5 章电商主图与活动海报，都是在三层结构上叠加具体品类要素：证件照约束构图与背景，海报补文案、色彩与布局，字体设计约束字形风格。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n误解一：提示词越长越好。三层各自交代到位即可，堆叠近义词不会增加可控维度，反而稀释关键要素。\n<\/li><li>\n误解二：模型可以随便换。图片 3.0 偏文字呈现，拿去做写真质感会弱；图片 3.1 偏表现，拿去做含文字海报容易出字形问题。\n<\/li><li>\n误解三：再次生成等于重新编辑。再次生成不改提示词，只换一组采样；提示词方向错了，再次生成只会重复同类偏差。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n文生图提示词三层是哪三层？（主体、环境、风格，PDF 第 49 页）\n<\/li><li>\n哪类任务优先选图片 4.0？（二次创作、增删元素、多图保持角色、多图合成，PDF 第 50 页）\n<\/li><li>\n竖版海报与手机壁纸分别用什么比例？（3:4 与 9:16，PDF 第 50 页）\n<\/li><li>\n首尾帧流程的三步是什么？（先生成尾帧基准图，再以尾帧为参考生成首帧，最后两帧衔接生成视频，PDF 第 82–85 页）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>反事实一：若提示词只写主体、不写环境与风格，山、楼阁、云雾等场景层次与画法全部由模型随机补，同一句提示多次生成会出现水墨、3D、写实混杂的结果，挑选成本上升。 反事实二：若含文字海报错选图片 3.1，文字识别与呈现精度不是该模型侧重，标语容易变形、错漏；后期修字的工作量超过一开始选对模型。 反事实三：若首尾帧先凭空各找一张风格相近的图，两张图在色调、质感、构图上的差异没有被提前约束，AI 衔接中间过渡时会在两种风格之间跳变，出现前半段温暖柔和、后半段冷硬粗糙的割裂感（PDF 第 87 页）。 反事实四：若不选比例直接生成，画幅方向由模型默认值决定，用于竖版海报或手机壁纸时需要裁切，主体与文案位置可能被切掉。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章承接第 1 章提示词方法：文字提示词的背景—目标—约束，在图像侧转译为主体—环境—风格。第 3 章剪映把本章生成的图片、视频作为素材导入成片流程；第 4 章扣子工作流中的图像生成节点（视觉设计师）复用本章的模型、比例与提示词约定（PDF 第 217 页）。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n三层：主体、环境、风格；表情包变体为角色 + 动作情绪 + 风格 + 图片布局（PDF 第 49、51 页）\n<\/li><li>\n模型：4.0 二次创作，3.1 写真表现，3.0 含文字（PDF 第 50 页）\n<\/li><li>\n比例：16:9 / 1:1 / 3:4 / 9:16（PDF 第 50 页）\n<\/li><li>\n首尾帧：尾帧基准 → 参考图生成首帧 → 视频生成衔接（PDF 第 82–85、87 页）\n<\/ul>", "kind": "chapter", "title": "第 3–6 章：即梦——文生图与图生图的提示与参数"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.90<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 3–6 章：即梦——文生图与图生图的提示与参数<\/a><\/span><\/div><h1>第 7–8 章：剪映——从素材到成片的流程<\/h1>\n<blockquote>对应原书第 7 章《剪辑太难？AI 帮助你快速剪出好视频》（PDF 第 90–102 页）、第 8 章《视频不专业？包装一下更出彩》（PDF 第 103–119 页）。原书界面基于书中版本，功能入口与参数名称可能已变。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：有可使用的视频素材或讲稿文本\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分模板替换、AI 文字成片、营销成片三条成片路径各自的输入与产出；\n<\/li><li>\n按素材/文案—画面—配音—音乐—字幕—导出的顺序排流程，说清每一步依赖哪一步的产物；\n<\/li><li>\n估算智能字幕识别后的校对成本，说清智能剪口播的标记—预览—删除流程；\n<\/li><li>\n判断一个视频任务该先走模板还是先做粗剪，说出返工成本差异。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>成片质量取决于流程顺序：先把内容骨架（素材或文案）定下来，再配画面、配音、音乐，最后做字幕与包装；顺序颠倒会让后面每一步都跟着前面的返工重做。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：成片流程的顺序决策（c07）<\/h3>\n<p>第 7 章给出三条路径。模板路径：在模板基础上替换素材与文字，沿用模板已有的节奏、转场与配乐（PDF 第 90–93 页）。AI 文字成片路径：粘贴讲稿文本，依次设定画面内容与配音，再由音乐选项卡匹配背景音乐，生成视频后导出（PDF 第 94–97 页）。营销成片路径：导入产品视频素材并填写产品名称与要点，由 AI 创作文案、匹配素材并完成剪辑（PDF 第 98–102 页）。三条路径的共同骨架是内容先行、包装在后。详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。<\/p>\n<h3>概念 2：字幕识别校对与口播剪辑的对齐成本（c08）<\/h3>\n<p>第 8 章智能字幕功能自动识别视频人声，把文字以字幕条形式加到时间轴并适配时长；识别完成后需在字幕列表通读校对错别字，再批量套用字体、字号、颜色等样式（PDF 第 105–108 页）。智能剪口播自动识别语气词、口误重复与长时间停顿并标记无效片段，粗剪后预览调整标记，再确认删除（PDF 第 107 页起）。详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。<\/p>\n<p>第 8 章数字人部分用于无人出镜讲解：选择形象与声音，由文本驱动口型匹配生成讲解视频（PDF 第 112–118 页，书中版本，界面可能已变）。<\/p>\n<h2>完整推导 1：AI 文字成片的步骤依赖推演<\/h2>\n<p>推演对象是 7.2 节微课讲解案例：把一篇企业内训讲稿转成完整教学视频（PDF 第 94–97 页）。<\/p>\n<p>步骤依赖链从输入倒推。最终成片需要画面、配音、字幕、背景音乐四样东西；配音与字幕都依赖讲稿文本，画面匹配也依赖讲稿内容分段。因此第一步必须是输入文字讲稿：在创作窗口左侧文本编辑区粘贴或撰写讲稿（PDF 第 95 页）。讲稿未定，后续画面分段、音色选择、音乐匹配都没有依据。<\/p>\n<p>第二步设定画面内容。在画面选项卡选择素材来源：没有现成素材时选在线素材库，由 AI 按讲稿匹配相关视频和图片；再按发布平台选视频比例，教学视频常用 16:9（PDF 第 95 页）。第三步设定配音：切换到配音选项卡挑选主播音色（如知性女声），调整语速与音量（PDF 第 96 页）。第四步设定音乐：新手直接选智能推荐，由 AI 按文稿内容与所选音色匹配背景音乐（PDF 第 96 页）。第五步生成视频：AI 分析文稿，自动完成分镜、画面匹配、音频与字幕生成（PDF 第 97 页）。第六步导出：确认细节后在导出对话框重命名文件、选择保存格式，再导出（PDF 第 97 页）。<\/p>\n<p>推演顺序检验：讲稿 → 画面 → 配音 → 音乐 → 生成 → 导出，每一步的输入都是上一步的产物。若把音乐选择放到讲稿之前，音乐情绪没有文稿依据；若先导出再补字幕，时间轴已经锁定，字幕对齐要在成片上返工。<\/p>\n<h2>完整推导 2：字幕与口播两类人工成本的对比推演<\/h2>\n<p>两类功能都由 AI 先做粗处理，人工成本集中在校对与确认环节。<\/p>\n<p>字幕流程推演。导入素材并拖入时间轴后，在功能栏选【文本】，左侧面板【智能文本】下选【智能字幕】，单击【开始识别】；剪映自动分析人声，把识别文字逐条加到时间轴并适配时长（PDF 第 105–106 页）。识别不是终稿：AI 偶尔会识别错误，需在界面上方字幕列表从上到下通读，发现错别字直接在对应文本框修改（PDF 第 105 页）。样式批量处理在文本窗格基础面板调整字体、字号、颜色、字间距、行间距，勾选“文本、排列、气泡、花字应用到全部字幕”后，一次修改同步到所有字幕条；也可在模板、花字面板套用预设样式（PDF 第 106–107 页）。成本结构：识别与时间轴对齐由 AI 完成，人工成本是通读校对的时间，加上首次样式设定；单条样式修改若不勾选应用到全部，就要逐条重复操作。<\/p>\n<p>口播流程推演。智能剪口播识别语气词、口误重复与长停顿并标记无效片段；人工先预览被标记片段，确认哪些该删、哪些保留，再执行删除（PDF 第 107 页起）。成本结构：识别标记由 AI 完成，人工成本是逐段预览判断；误删会打断语义，漏删则保留卡顿，判断标准依赖对原话语义的理解。<\/p>\n<p>对比落点：字幕校对改的是文字正确性，错误类型是同音错字与漏字；口播剪辑改的是片段取舍，错误类型是误删与漏删。两者都不能把 AI 标记结果直接当终稿。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[素材或讲稿] --&gt; B{成片路径}\nB --&gt;|有模板| T[替换模板素材与文字]\nB --&gt;|只有讲稿| W[AI 文字成片: 粘贴讲稿]\nB --&gt;|有产品素材| M[营销成片: 导入素材+填产品要点]\nW --&gt; W1[画面: 素材来源+比例]\nW1 --&gt; W2[配音: 音色+语速音量]\nW2 --&gt; W3[音乐: 智能推荐]\nW3 --&gt; G[生成视频]\nM --&gt; G\nT --&gt; G\nG --&gt; S[智能字幕识别→校对→批量美化]\nS --&gt; K[口播粗剪: 标记→预览→删除]\nK --&gt; E[导出: 重命名+保存格式]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p>成片流程像写文章：先定提纲与素材，再填段落，最后排版校对。模板路径相当于套现成范文换内容；文字成片相当于把稿子交给排版系统自动配图配音；营销成片相当于给产品素材配解说与卖点包装。字幕与口播剪辑是成稿后的校对环节，位置靠后，但不能省略。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n误解一：AI 生成的视频可以直接导出。书中流程在生成后仍有确认环节：字幕要校对，口播标记要预览，不满意回到对应环节调整后再导出。\n<\/li><li>\n误解二：字幕样式逐条调更精细。批量美化勾选应用到全部字幕，先统一基础样式，再对个别字幕单独调整；逐条调会重复劳动且风格容易不一致。\n<\/li><li>\n误解三：口播标记可以全删。标记片段包含语气词、口误与停顿，其中停顿可能是语义换气，全删会让语句断裂。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nAI 文字成片在生成前要设定哪三个选项卡内容？（画面、配音、音乐，PDF 第 95–96 页）\n<\/li><li>\n智能字幕识别后人工要做哪两件事？（通读校对错别字、批量设置样式，PDF 第 106–107 页）\n<\/li><li>\n智能剪口播的三个环节是什么？（识别标记、预览调整、确认删除，PDF 第 107 页起）\n<\/li><li>\n教学视频常用的视频比例是多少？（16:9，PDF 第 95 页）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>反事实一：若跳过粗剪直接精剪，素材中的语气词、口误与停顿尚未剔除，精剪阶段要在保留完整语义的前提下逐段判断取舍，时间轴上的片段数量远多于粗剪后；返工成本随素材时长线性上升。 反事实二：若先配音乐再定讲稿，音乐情绪与文稿内容没有对应依据，后期讲稿调整后音乐需要重新匹配，配音与画面也可能跟着重排。 反事实三：若字幕识别后不通读直接套用样式，同音错字会被统一美化放大，错误随批量样式一起进入成片；校对必须在批量美化之前完成。 反事实四：若口播标记不预览直接全删，语义换气点被剪掉，语句衔接生硬；这类问题在成片回放时才暴露，需要回到时间轴逐段恢复。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章素材上游来自第 2 章即梦生成的图片与视频；成片后的协作分发对应第 4 章飞书文档与群聊分享。字幕、配音、数字人这些“把文本转成视频”的环节，与第 1 章 AI 写作的结构化文案互为输入：讲稿质量直接决定成片分镜与配音质量。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n三路径：模板替换、AI 文字成片、营销成片（PDF 第 90–102 页）\n<\/li><li>\n文字成片顺序：讲稿 → 画面 → 配音 → 音乐 → 生成 → 导出（PDF 第 95–97 页）\n<\/li><li>\n字幕：识别 → 校对 → 批量美化（PDF 第 105–108 页）\n<\/li><li>\n口播：标记 → 预览 → 删除（PDF 第 107 页起）\n<\/ul>", "kind": "chapter", "title": "第 7–8 章：剪映——从素材到成片的流程"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.120<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1–2 章：豆包——对话式办公与内容生产<\/a><\/span><\/div><h1>第 9–13 章：飞书与扣子——协同与自动化<\/h1>\n<blockquote>对应原书第 9 章《不会做表？AI 助力轻松搞定》（PDF 第 120–135 页）、第 10 章《写作没思路？多人协作更高效》（PDF 第 136–155 页）、第 11 章《经验难留存？AI 知识库来帮忙》（PDF 第 156–177 页）、第 12 章《想有专属 AI 助手？用扣子定制专属功能》（PDF 第 178–204 页）、第 13 章《工作又多又烦？快交给 AI 自动化》（PDF 第 205–219 页）。原书基于 2025 年 10 月飞书 Windows 客户端 V7.51 与 2025 年 12 月扣子网页版演示，界面可能已变。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3.5 小时 | <strong>前置<\/strong>：第 1 章提示词方法、第 3 章结构化输出\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清多维表格字段类型、多视图与权限继承各自约束了什么；\n<\/li><li>\n按需求分析—建智能体—选模式—写人设—配模型与技能—测试发布的流程搭一个专属智能体；\n<\/li><li>\n画出工作流节点与变量传递链路，区分开始、大模型、图像生成、结束节点的输入输出；\n<\/li><li>\n说清知识库检索流程与检索不到时的兜底分支，判断哪些任务该用智能体、哪些该用工作流。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>协同工具把数据规范交给字段类型、把协作秩序交给权限与版本；自动化工具把职责拆成节点、把知识边界交给知识库与兜底规则——两者都是先定约束，再让 AI 在约束内执行。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：协同表格与文档的字段约束、多视图与权限继承（c09）<\/h3>\n<p>多维表格是存放数据的“仓库”，行叫记录，列叫字段；每个字段的数据类型确定，日期字段只允许规范日期格式，单选字段通过下拉列表快速填写，避免重复录入与格式错误（PDF 第 121、123、126 页）。同一数据源下视图之间可快速转换：表格视图管理后台数据，日历视图把工作事项转成电子日历（PDF 第 121、122 页）。文档侧，报名表格嵌入协作文档后，分享权限需设为【可编辑】成员才能填写；知识库目录分享后子页面默认继承上级权限，也可单独关闭链接分享、不再继承父级权限（PDF 第 150、171–172 页）。详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。<\/p>\n<h3>概念 2：扣子智能体与工作流（c10）<\/h3>\n<p>智能体搭建链路：先分析需求（核心问题、扮演角色、理想输出），创建智能体，选工作模式，写人设与回复逻辑，选模型，配置技能（插件、知识库），优化开场白与预置问题，多轮测试后发布（PDF 第 178–187 页）。工作流在画布上由节点连成链路：开始节点定义输入变量，大模型节点引用上游变量做处理并命名输出变量，图像生成节点接收提示词变量出图，结束节点指定交付变量；节点间连线传递变量（PDF 第 208–210、215–217 页）。知识库先把资料整理成标准单元再分段入库，回答时先检索库内条款，检索不到按预设兜底话术回应（PDF 第 188、193、181 页）。详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。<\/p>\n<h2>完整推导 1：多维表格字段约束到数据规范的推演<\/h2>\n<p>推演对象是 9.1 节电子日历案例：记录日程需要任务名称、任务日期、重要程度三项基础信息（PDF 第 122 页）。<\/p>\n<p>先推字段类型选择。任务名称是自由文本，字段类型选文本；任务日期需要日历选择器录入，字段类型选日期；重要程度是有限档位（重要紧急、重要不紧急、紧急不重要、不重要不紧急），字段类型选单选并添加四个选项（PDF 第 123–125 页）。推演依据：字段类型决定录入方式与可填内容范围。文本类型双击单元格直接录入；日期类型双击弹出日历对话框选标准格式；单选类型从下拉列表选，不能自由打字。<\/p>\n<p>再推约束生效机制。同一列中只允许存在同一种字段类型；日期列若混入文本，后续按日期排序、日历视图生成都会失效。单选列把可选值固定为四个选项，避免“很急”“一般般”这类同义不同写的重复录入。字段约束先在录入环节挡住不规范数据，视图与公式才能在规范数据上运行。<\/p>\n<p>视图推演。表格视图把全部记录以行列形式呈现，适合后台录入与核对；日历视图按日期字段把记录铺到日历上，直观展示任务排期。两个视图读的是同一份数据源，切换视图不复制数据；改一条记录，两个视图同步更新。<\/p>\n<h2>完整推导 2：智能体搭建与工作流变量传递推演<\/h2>\n<p>智能体链路推演以 12.1 公文大师为例。需求分析先写清核心问题（格式与语气有严格规范、费时易错）、扮演角色（公文写作专家，类似资深秘书或办公室主任）、理想输出（结构完整、格式正确、语言专业的公文初稿）（PDF 第 178 页）。需求不清就建智能体，后面人设与模型选择都没有依据。<\/p>\n<p>模式选择推演。单 Agent（自主规划模式）行为由人设与回复逻辑决定，最灵活，适合开放式对话与创意生成；单 Agent（对话流模式）由预先编排的工作流严格控制，输出稳定一致，适合固定步骤的流程化任务；多 Agents 可设多个子智能体，按意图调度，适合复杂集成应用（PDF 第 180 页）。公文写作既要遵循规范框架又要按具体需求灵活成段，不是完全固定流程，选自主规划模式。<\/p>\n<p>人设四段式推演。角色定义身份、背景与专业领域；技能用明确动词分点列出核心能力；示例给一两个输入输出范例；限制设定行为边界（PDF 第 180 页）。模型按场景选：通用场景默认豆包 1.5·Pro·32k；快速响应选 Lite 标签模型；长文本解析选 128k、256k 标签模型；代码生成、角色扮演、逻辑推理、视觉理解各有侧重模型（PDF 第 182 页，书中版本，模型名单可能已更新）。<\/p>\n<p>工作流变量推演以 13.2 营销海报为例。开始节点定义两个输入变量：chanpin（产品）、renqun（人群），类型 str.String（PDF 第 215 页）。市场分析师大模型节点输入引用 chanpin、renqun，系统提示词写岗位职责，用户提示词填“产品名称:{{chanpin}}，目标人群:{{renqun}}”，输出命名 tongdian（痛点）（PDF 第 216 页）。金牌策略师节点输入引用 chanpin、renqun、tongdian，输出 tishici（提示词）（PDF 第 216–217 页）。视觉设计师节点选 Seedream 4.0，比例 9:16，宽 1440、高 2560，最多生成 4 张，输入引用 tishici，提示词填 {{tishici}}（PDF 第 217 页）。结束节点把输出变量改名为 haibao，引用视觉设计师的 data 变量（PDF 第 218 页）。<\/p>\n<p>变量链路检验：上游输出变量名必须与下游引用名一致；任一节点点名对不上，下游拿到空值或报错。试运行先填 chanpin、renqun，逐节点检查痛点分析、提示词、海报图片是否符合预期，不满意回到对应节点系统提示词打磨（PDF 第 218–219 页）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[需求分析: 问题/角色/理想输出] --&gt; B[创建智能体]\nB --&gt; C{工作模式}\nC --&gt;|开放对话/创意| C1[单 Agent 自主规划]\nC --&gt;|固定流程| C2[单 Agent 对话流]\nC --&gt;|复杂集成| C3[多 Agents]\nC1 --&gt; D[人设四段式: 角色/技能/示例/限制]\nD --&gt; E[选模型 + 配技能: 插件/知识库]\nE --&gt; F[开场白 + 预置问题]\nF --&gt; G[多轮测试: 库内问题/库外问题]\nG --&gt;|通过| H[发布]\nG --&gt;|不符预期| D\nI[工作流画布] --&gt; N0[开始节点: 定义输入变量]\nN0 --&gt; N1[大模型节点: 引用变量→输出变量]\nN1 --&gt; N2[大模型节点: 接力处理]\nN2 --&gt; N3[图像生成节点: 接收提示词变量]\nN3 --&gt; N4[结束节点: 指定交付变量]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<p>多维表格像带类型约束的登记表：文本栏写名字，日期栏挑日期，档位栏只能选给定选项；视图是同一张表的不同看法，不是另存一份。扣子智能体像招一位员工：先写岗位说明书（人设），配工具（插件、知识库），培训试岗（测试），再正式上岗（发布）；工作流像流水线工位表，每个工位只处理一道工序，工序之间用单据（变量）交接。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n误解一：字段类型可以事后随便改。日期列混入文本后再改类型，已有不规范数据不会自动变规范，排序与视图先失效。\n<\/li><li>\n误解二：知识库挂上文档就能准确回答。资料格式混乱会影响检索与回答质量；书中先用 AI 把文档整理成“功能模块—问题摘要—详细说明”单元，用“===”分隔再入库（PDF 第 188、193 页）。\n<\/li><li>\n误解三：工作流节点越多越好。每个节点职责单一、变量交接清楚即可；节点之间缺输入引用，链路就在该节点断掉。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n多维表格中记录与字段分别对应传统表格的什么？（行与列，PDF 第 121 页）\n<\/li><li>\n扣子三种智能体模式是什么？（单 Agent 自主规划、单 Agent 对话流、多 Agents，PDF 第 180 页）\n<\/li><li>\n人设四段式是哪四段？（角色、技能、示例、限制，PDF 第 180 页）\n<\/li><li>\n营销海报工作流中，策略师节点输出的变量叫什么、交给哪个节点？（tishici，交给视觉设计师图像生成节点，PDF 第 216–217 页）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>反事实一：若报名表格分享权限保持只读，成员打开链接只能看不能填，报名信息仍要收集人手动汇总；权限级别与协作动作不匹配，协同流程卡在录入环节。 反事实二：若知识库不设兜底限制，库内检索不到答案时模型可能凭通用知识编造产品条款；书中产品专家案例要求检索不到必须回答“抱歉，关于您的问题，我没有查询到相关信息，建议联系人工客服获取更专业的帮助”（PDF 第 181 页）。 反事实三：若工作流中上游输出变量名与下游引用名不一致，下游节点拿到空输入，报错或产出空结果；这类问题在试运行阶段逐节点查看输入输出才能定位。 反事实四：若跳过需求分析直接写人设，角色、技能、限制没有问题边界支撑，智能体回答范围发散；测试阶段发现跑偏，仍要回到需求分析层补约束。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章把第 1 章提示词方法升级为可复用资产：四段式人设是提示词三步骤在智能体上的固化；结构化输出（c03）对应工作流节点间的变量交接。飞书知识库与扣子知识库共用“资料整理—分段入库—检索回答—兜底”的链路；本章生成的日报、海报等产物，分发回飞书群聊与文档完成闭环。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n表格：记录/字段、字段类型、多视图同源（PDF 第 121–126 页）\n<\/li><li>\n权限：链接分享范围、可编辑、知识库继承与单独限制（PDF 第 150、171–172 页）\n<\/li><li>\n智能体：需求分析 → 模式 → 人设 → 模型 → 技能 → 测试发布（PDF 第 178–187 页）\n<\/li><li>\n工作流：开始 → 大模型 → 图像生成 → 结束，变量逐节点传递（PDF 第 208–210、215–217 页）\n<\/ul>", "kind": "chapter", "title": "第 9–13 章：飞书与扣子——协同与自动化"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.19<\/div><h1>有效提示词的三步骤：背景定位、目标明确、要求细化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章 | <strong>原书位置<\/strong>：第 1.2.1 节《提示词结构：构建有效提示词的 3 步骤》（PDF 第 19–21 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>日常对话式使用豆包时，最常见的失败模式是：用户给出一句很短的请求，例如“为这款饮料想一些夏季营销活动创意”，收到的却是一套放到任何品类都成立的通用点子，改了几轮仍不贴合需求。书中把这种现象归因为提示词太模糊：一个粗糙、不包含有效信息的提示词，只能换回一个通用的、低价值的答案（PDF 第 18 页）。<\/p>\n<p>要解决的具体困难有三层。其一，模型默认是通用、无特定身份的，不交代角色与场景，它就用最大众化、最安全的知识作答；其二，“给我一些创意”没有说清交付物是口号、长文还是方案，模型无法判断该交什么；其三，脑中对“好方案”的标准没有写出来，模型只能按自己的理解填充章节。如果不拆这三层，用户会把输出偏差归因于模型能力，反复重开对话，而每一轮都在重复同一组缺失信息。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>书中 1.2.1 节把有效提示词的构造拆成三个先后相连的步骤：背景定位、目标明确、要求细化（PDF 第 19 页）。<\/p>\n<p><strong>背景定位<\/strong>：从“通用模型”到“首席顾问”。这一步包含三项关键信息。角色定义：希望模型扮演谁，这个角色决定它思考问题的视角和高度；品牌信息：你们是谁，品牌核心调性或价值主张是什么；用户画像：服务对象是谁。书中案例的背景定位写成“你是一位顶级的 4A 广告公司首席创意官。我现在正在为一个主打‘自然、活力、年轻’的新兴饮料品牌服务，其核心目标用户是 Z 世代和都市年轻白领”（PDF 第 19 页）。<\/p>\n<p><strong>目标明确<\/strong>：从“给我一些创意”到“给我一套方案”。这一步定义三个交付要素：动作，希望模型执行构思、撰写还是分析；交付成果名称，想要的成果在行业里通常称作什么；数量，需要多少套方案供选择。案例中升级为“现在，请你为即将到来的夏季，构思 3 套完全不同方向的营销活动方案”（PDF 第 19–20 页）。<\/p>\n<p><strong>要求细化<\/strong>：从“你看着办”到“照此执行”。这一步把脑中对完美结果的评判标准，变成模型可逐项执行的任务清单。案例规定每套营销活动方案包含五个部分：主题名称（易于传播的名字）、核心口号（最短语言戳中渴望）、用户洞察（创意基于哪种心理或行为洞察）、创意故事（核心内容与如何展开）、渠道建议（抖音、小红书、B 站、线下活动等渠道）（PDF 第 20 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>推导从模型生成的机制出发。大模型每一轮都在收到的整段输入基础上续写内容；输入里没有约束的维度，模型就按训练语料中的高频默认值补全。背景定位缺位时，视角维度无约束，模型取大众视角；目标明确缺位时，交付物形态维度无约束，模型取最常见的短文形态；要求细化缺位时，结构与标准维度无约束，模型自行安排章节。<\/p>\n<p>三步之间是依赖关系。背景定位先限定视角，视角决定后续思考调用哪一类知识；目标明确再限定交付物，交付物决定篇幅与组织方式；要求细化最后限定验收口径，口径决定每一部分写到什么程度。顺序颠倒不会立刻报错，但后一步失去前一步的依托：先写结构清单而不说品牌与用户，清单条目仍会脱离品牌语境。<\/p>\n<p>把案例请求逐步代入推演。原始请求“想一些夏季营销活动创意”在三个维度上都无约束。补背景定位后，视角从大众换成 4A 创意官，知识调用偏向品牌策划而非泛泛文案；补目标明确后，交付物从“一些创意”变成“3 套不同方向的方案”，数量与方向差异被固定；补要求细化后，每套方案必须出现五个规定条目，检查时可以逐条核对缺项。三步补全后，模型基于三段约束给出三套结构清晰、可直接拿去做内部提案的方案（PDF 第 21 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>这套三步骤适用于需要模型产出具体工作成果的对话：方案、文稿、表格提纲、汇报材料、图像与视频提示词等。任务越接近工作交付，越需要把角色、成果、结构写清；纯闲聊、事实问答类轻量任务不必套用完整三步，过度约束反而拖慢响应。<\/p>\n<p>边界有三条。第一，三步骤只约束模型的作答方向与格式，不保证内容一定符合事实；涉及数据、法规、品牌内部规定时，仍需人工核验。第二，背景定位里的品牌信息、用户画像必须是真实掌握的事实，凭空写角色会让模型沿虚构设定展开。第三，要求细化的条目要在可执行层面，“有感染力”“更专业”这类感觉词仍不可执行，需要换成句式、手法、条目数量等可检查要求。<\/p>\n<h3>反例<\/h3>\n<p>反例一：只写“你是资深策划，帮我写个活动方案”。有角色无目标无结构，模型不知道写几套、每套含什么，产出仍是自由长文。 反例二：写清三套方案与五个条目，但不交代品牌调性与用户画像。条目齐全，洞察部分仍偏向通用年轻人语境，无法落到具体品牌。 反例三：把所有形容词写进细化清单（震撼、感人、高级）。形容词不可执行，模型只能挑高概率修辞堆叠，检查时仍无法判断是否达标。<\/p>\n<h2>辨析<\/h2>\n<p>与“角色设定”的差别：角色只是背景定位三项之一。只给角色名（“你是专家”）不等于完成背景定位，品牌信息与用户画像同样需要交代；角色决定视角，后两项决定视角落点。<\/p>\n<p>与“多轮迭代”的差别：三步骤是单轮提示词的结构，迭代（c02）是在第一轮方案之后补充范例、禁区、竞争信息。三步骤解决“第一轮写什么”，迭代解决“第一轮不够好时改什么”。<\/p>\n<p>与“结构化输出”的差别：要求细化包含输出结构约定，但结构约定只是三步骤的最后一段；背景与目标不交代，结构再完整也会套错语境。<\/p>\n<h2>概念联系<\/h2>\n<p>前置概念：无，这是全书对话方法的入口。后继概念：迭代式改稿（c02）在三步骤初稿上做差异补充；结构化输出与模板复用（c03）把要求细化沉淀成可重复模板；图像提示三层（c04）把背景—目标—约束映射为主体—环境—风格；扣子人设四段式（c10）是三步骤在智能体上的固化版本。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（有效提示词的三步骤：背景定位、目标明确、要求细化）<\/summary><div class=\"depth-body\"><h1>c01 深度片段：三步骤提示词的依赖链、推导与可复现算例<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>从最终交付物倒推所需条件。目标产物是“3 套可直接作为内部提案的营销活动方案，每套含主题名称、核心口号、用户洞察、创意故事、渠道建议”。要得到这个产物，先逆推验收环节：检查者要逐条核对五个条目是否齐全、是否贴合品牌与用户，因此提示词必须先给出条目清单与品牌语境。再逆推条目内容：用户洞察要落到具体人群心理，缺少用户画像就无从落点；创意故事要符合品牌调性，缺少品牌信息就只能写通用情节。最后逆推视角：品牌策划属于专业领域，需要模型调用策划类知识而非日常闲聊语料，因此要先定角色。<\/p>\n<p>逆推得到的依赖顺序为：交付物验收标准 ← 输出结构清单 ← 品牌信息与用户画像 ← 角色定位。这与正向书写顺序（背景定位 → 目标明确 → 要求细化）一致，说明三步骤不是格式偏好，而是把验收条件逐层翻译成输入约束。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，假设模型在无约束状态下按语料高频默认值作答：视角取大众消费者，形态取短篇短文，结构取常见的观点加例子。把这一默认状态与案例要求逐项对照，差值集中在视角、形态、结构三处。<\/p>\n<p>第二步，补背景定位消除视角差值。角色定义为顶级 4A 广告公司首席创意官，知识调用偏向品牌策划；品牌信息限定为自然、活力、年轻的新兴饮料品牌；用户画像限定 Z 世代和都市年轻白领。三项信息合起来，把回答的落点从大众市场收窄到该品牌语境。<\/p>\n<p>第三步，补目标明确消除形态差值。动作定为构思，成果名称定为营销活动方案，数量定为 3 套完全不同方向。模型据此知道要交付三份并列方案，而不是一段口号或一篇长文。<\/p>\n<p>第四步，补要求细化消除结构差值。五个部分逐项写明写法：主题名称给易于传播的名字；核心口号用最短语言戳中渴望；用户洞察交代心理或行为依据；创意故事描述核心内容与展开方式；渠道建议指明抖音、小红书、B 站、线下活动等路径。<\/p>\n<p>第五步，推演生成覆盖度。每一步补入的约束对应一类默认偏差：角色约束视角，目标约束形态，结构约束条目。未补约束的维度仍由模型默认值填充，所以三步骤缺一不可；补全后，模型输出沿三条约束展开，检查时可以按同一清单验收。<\/p>\n<h2>算例<\/h2>\n<p>可复现操作序列（对应书中 PDF 第 19–21 页案例）：<\/p>\n<p>输入第一轮（原始模糊请求）：“为这款饮料想一些夏季营销活动创意。” 第一轮产出（预期偏差）：通用夏季活动点子，不区分品牌与人群，无固定章节，需大改。<\/p>\n<p>输入第二轮（三段式提示词）：<\/p>\n<ol><li>\n背景定位：你是一位顶级的 4A 广告公司首席创意官。我现在正在为一个主打“自然、活力、年轻”的新兴饮料品牌服务，其核心目标用户是 Z 世代和都市年轻白领。\n<\/li><li>\n目标明确：现在，请你为即将到来的夏季，构思 3 套完全不同方向的营销活动方案。\n<\/li><li>\n要求细化：每套方案必须包含以下 5 个部分，并严格按此结构输出。主题名称：给活动起一个易于传播的名字。核心口号：用最短的语言，戳中最深的渴望，让人立刻想动起来。用户洞察：阐述创意基于对年轻人何种心理或行为的洞察。创意故事：详细描述创意的核心内容是什么，它如何展开。渠道建议：建议主要在哪些渠道（如抖音、小红书、B 站、线下活动）进行传播。\n<\/ol>\n<p>第二轮产出（预期）：3 套并列方案，每套五个条目齐全，洞察指向年轻人群，渠道落到具体平台。<\/p>\n<p>耗时与成本量级：写提示词约 5–10 分钟（信息来自手头品牌资料）；第一轮对话生成在常规办公网络下以秒级到十几秒计；三轮方案的篇幅取决于模型默认输出长度，案例中每套方案为结构化短稿。参数层面不涉及图像模型的比例与采样，差异主要在提示词信息密度上。<\/p>\n<p>对比实验式推理：固定同一模型，只改变提示词段数。甲，仅主体请求；乙，补背景定位；丙，补背景加目标；丁，三段齐全。预期偏差递减顺序为甲最大（视角、形态、结构三处随机），乙次之（视角收窄，形态结构仍随机），丙再次（形态收窄，结构仍随机），丁最小。这组对比说明三步骤各自削减一类偏差，而不是某一段单独决定全部质量。<\/p>\n<h2>补充推演：三段约束如何分别改变生成分布<\/h2>\n<p>把模型作答想象成在一个候选答案空间里选落点。无约束时，空间里被选中概率最高的是语料中最常见的通用表达；背景定位把候选范围限定到某类专业视角下的表达，目标明确把候选形态限定到某类交付物，要求细化把候选结构限定到固定条目。三层约束叠加，可行候选集逐层收窄，落在用户预期内的比例随之提高。<\/p>\n<p>逐层分析收窄机制。背景定位收窄的是知识调用方向：角色是首席创意官时，模型调用品牌策划类语料而不是日常闲聊语料；品牌信息与用户画像再把策划方向限定到自然活力的年轻饮料语境。目标明确收窄的是产物形态：三套并列方案意味着模型要组织三个可比较的板块，而不是一段连贯长文。要求细化收窄的是段落职责：五个条目各有写法说明，模型不会把渠道建议写进口号段，也不会在洞察段堆口号。<\/p>\n<p>再推演缺一层时候选集的变化。缺背景定位，知识调用退回大众视角，品牌与人群相关段落最容易出现通用表述；缺目标明确，形态在短文、条目、长文之间摇摆，篇幅不稳定；缺要求细化，条目由模型自行安排，检查时缺项与错位并存。三种缺失可以叠加，偏差不是相加而是互相放大：视角泛化之后，结构约束即使存在也套在泛化内容上。<\/p>\n<p>对比实验的可检验指标。同一模型下，甲乙丙丁四组提示词跑完后，可从三个角度检查：视角是否出现行业术语与品类语境，形态是否符合交付物类型，条目是否与清单一一对应。甲三项都不稳定，乙只在视角项改善，丙视角与形态改善，丁三项达标。这个检查顺序与三步骤顺序一致，说明每段约束对应一类可观察指标，而不是笼统的“变好了”。<\/p>\n<p>边界再细化：三步骤收窄候选集，但不改变模型的事实掌握范围。提示词要求专业口吻，模型仍可能编造数据或案例；背景中的品牌事实必须由用户提供，模型不掌握企业内部信息。角色定位不等于给模型注入真实经验，只是引导它按该角色的表达方式组织内容。<\/p>\n<h2>操作序列复盘与常见卡点<\/h2>\n<p>把三段式提示词落地成可检查清单。背景定位一行内回答三个问题：扮演谁、为哪个品牌服务、面向谁；缺哪个问题就补哪句。目标明确一行内回答：执行什么动作、交付什么名称的成果、要几套；数量不写清时模型常给单份简述。要求细化逐条列出条目名称与写法，每条写法能在产出后打勾判断。<\/p>\n<p>常见卡点一是把背景定位写成空泛头衔。“资深专家”没有领域与场景信息，角色视角仍落不下来；头衔后要接领域、品牌调性、用户画像。卡点二是目标里只写名词不写动作，“营销方案”没有构思还是分析的区分；动作词决定模型调用创作还是拆解。卡点三是细化清单写成感觉要求，“吸引人”无法核对；换成句式、渠道、条目长度等可检查特征。<\/p>\n<p>换场景迁移检验。把饮料品牌方案换成一份会议纪要：背景定位写参会角色与会议背景，目标明确写纪要名称与篇幅，要求细化列议题、决议、待办、负责人等条目。骨架复用，要素替换；迁移时先核对交付物类型是否仍匹配三步骤结构，再填新背景。<\/p>\n<h2>边界补充<\/h2>\n<p>三步骤解决的是表达清晰度，不解决模型知识边界。提示词写得再完整，模型不掌握的企业内部数据、未公开案例仍需用户提供；角色定位只改变回答视角，不注入真实从业经验。涉及数字、法规、承诺类内容，产出后要对照原始资料核验。三步骤也不替代后续迭代：第一轮按三步骤写全，只保证初始约束到位，贴合度与篇幅仍可能需要 c02 的多轮调整。<\/p>\n<p>换工具迁移时，三步骤骨架保留，要素名称随工具变化：文字任务分章节与措辞，图像任务分主体环境风格，智能体任务分角色技能限制。判断骨架是否适用，看交付物是否需要明确角色、形态与结构三项约定。<\/p>\n<h2>与相邻概念的衔接<\/h2>\n<p>三步骤是 c02 迭代与 c03 模板的地基：迭代在三步骤初稿上补差异指令，模板把三步骤中可复用的背景与结构约定抽离。后续图像提示（c04）与扣子人设（c10）都按同一思路把角色、任务、约束分段写清。<\/p>\n<h2>第二算例：中秋助眠灯多平台文案提示词（换任务：从活动方案换到多平台短文案）<\/h2>\n<p>任务背景（依据 PDF 第 36–38 页 AI 写作案例）：市场部要为新品“智能助眠灯”做中秋社交推广。与 A 阶段饮料活动方案不同，这次交付物拆成三种平台形态：口号、小红书图文笔记、短视频脚本。<\/p>\n<p>步骤序列：<\/p>\n<ol><li>\n背景定位：角色写“资深市场策划”；产品信息写清新品为智能助眠灯、中秋主题“月圆之夜，好梦相伴”；目标人群写准备送给父母、伴侣的送礼人群。\n<\/li><li>\n目标明确：动作定为策划；交付清单逐项写数量——3 个活动口号、3 篇小红书图文笔记、2 个 15 秒短视频脚本；清单顺序与最终产出顺序一致。\n<\/li><li>\n要求细化：风格语气定为温馨、多用小表情、侧重使用场景；必含卖点为“智能助眠灯能有效助眠”，所有内容都要突出这一点。笔记段补使用场景（送父母、伴侣助眠）与话题标签要求。\n<\/li><li>\n界面入口：豆包主页左侧导航栏选【帮我写作】（PDF 第 37 页，书中版本，界面可能已变），把组合好的提示词完整粘贴到对话框，发送等待生成。\n<\/li><li>\n产出核对：按清单逐项点数——口号 3 条、笔记 3 篇、脚本 2 个；每篇是否温馨语气、是否出现助眠卖点；缺项回到对应条目补指令。\n<\/ol>\n<p>判断依据与回退：清单数量对不上，先检查目标明确段是否写了数量；卖点缺失，检查要求细化段卖点是否写成“所有内容必须包含”；语气不符，回到风格语气段补场景与表情要求。这一步不做会怎样：不写数量，模型常给单篇简述；不写卖点约束，三篇笔记各自发挥，卖点散落在不同段落；不进【帮我写作】入口而在普通对话里直接问，产出形态不受写作功能的结构化引导。<\/p>\n<h2>延伸推演：三步骤仍要求用户先知道自己要什么<\/h2>\n<p>三步骤把“脑中标准”翻译成输入约束，但翻译的前提是用户脑中已经有标准。把这条前提再拆成三个子条件。<\/p>\n<p>子条件一：知道交付物形态。用户要分得清方案、笔记、脚本、提纲各是什么；形态不明，目标明确段写不出成果名称。去掉这个子条件，卡在目标明确步：模型在短文与长文之间摇摆，产出形态与使用场合错配，用户看到的是“内容有道理但不能直接用”。<\/p>\n<p>子条件二：知道受众与使用场景。人群与送礼/自用场景不清，背景定位段只能写泛化画像；去掉这个子条件，视角收窄失败，文案面向“所有人”，落到任何具体人群身上都不够准。<\/p>\n<p>子条件三：知道必须包含的卖点或条目优先级。核心卖点不明确，要求细化段只能写空泛质量要求；去掉这个子条件，条目齐全但重点偏移，关键信息被次要描述淹没。<\/p>\n<p>三个子条件缺哪一个，对应步骤就从“翻译标准”退回“猜测标准”。补不上这些信息时，先回到资料侧确认产品与人群，而不是把三步骤格式写完整就当约束到位。<\/p>\n<p>子条件之间还有先后顺序：先定交付物形态，再定受众场景，最后定卖点优先级。形态不定，受众描述没有附着对象；受众不清，卖点取舍没有依据。三个子条件可以在写提示词之前列成一张小核对表，逐项标注信息来自哪份资料；某项标不出来源，先去补资料，不在提示词里用假设填充。这条属于补充判断：手册讲三步骤写法，未展开“用户自身需求不清”时的前置确认流程。<\/p>\n<h2>对抗性追问：AI 生成的文案能不能直接拿去发布<\/h2>\n<p>读者反驳：既然三步骤写全、产出结构齐全，文案是否可以不再人工核对直接发布。<\/p>\n<p>手册写了什么：第 2.2.3 节把指导优化分成“保留什么、问题在哪、如何修改、期望结果”四步框架，并设置定向探索在固定边界内出多个版本供挑选（PDF 第 37–38 页）。流程定位是 AI 出初稿、人做把控，没有把生成稿标成可直接发布的终稿。<\/p>\n<p>补充判断（手册未展开）：能否直接用，按三类内容分开判。事实性内容（产品参数、价格、功效承诺、人名地名）必须对照原始资料核验，模型不掌握企业内部数据；风格与结构类问题走迭代指令调整；涉及合规承诺的表述按所在行业要求复核。判据：产出中每一个可核验的事实点都有资料来源，才可进入发布流程；事实点无来源的段落，不因其文字通顺而放行。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n把自己手上一个待办请求拆成三步骤后，背景定位的三项信息（角色、品牌、画像）是否都有事实来源，还是有哪一项是凭空假设？\n<\/li><li>\n目标明确里的动作、成果名称、数量三项，能不能在提示词原文中逐字找到？\n<\/li><li>\n要求细化的每个条目，是否都能在产出后被逐条核对；其中有没有仍属“更感人、更专业”这类感觉词？\n<\/li><li>\n若把背景定位整段删掉，产出会在哪些段落暴露缺失？这些段落对应的是品牌信息还是用户画像？\n<\/li><li>\n这套提示词换到另一个品类时，哪些段落可以保留模板，哪些必须重写？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "有效提示词的三步骤：背景定位、目标明确、要求细化"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.22<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">有效提示词的三步骤：背景定位、目标明确、要求细化<\/a><\/span><\/div><h1>迭代式改稿：补充关键信息、调整表述方式、限定输出边界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章 | <strong>原书位置<\/strong>：第 1.2.2 节《提示词优化：从及格到优秀的迭代技巧》（PDF 第 22–25 页）、第 1.3 节多轮对话（PDF 第 26–31 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>第一轮按三步骤写出的方案往往只是一份及格答卷：方向可用，但贴合度、可执行性与篇幅规格还差一截。书中区分了 80 分方案与 95 分方案的差距：及格方案停在结构完整，优秀方案体现在细节精准度、创意独特性与执行可行性上（PDF 第 22 页）。<\/p>\n<p>不做迭代会出现三类典型问题。一是内容不贴合：模型不知道企业内部文化、过往成功经验与需要规避的风险，方案停在通用层面。二是指令不可执行：用户用感觉词描述要求，模型无法把感觉翻译成具体动作。三是篇幅越界：模型为表现能力额外输出整段解释，格式不符的内容要手动删除。迭代式改稿要解决的，就是在同一对话中沿上下文逐轮补齐这些差值，而不是每轮重开新对话。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>书中 1.2.2 节给出三条迭代路径：补充关键信息、调整表述方式、限定输出边界（PDF 第 22 页）。<\/p>\n<p><strong>补充关键信息<\/strong>：把模型默认知道、但实际一无所知的内部情报和隐性知识明确加进提示词。书中分三类。成功范例定义“好”的参照物，如去年最成功的活动“城市角落咖啡地图”，关键要素是用户生成内容（UGC）和真实社区感，要求新创意体现这两个要素（PDF 第 23 页）。负面清单划定禁区，如品牌从不使用明星代言、避免任何形式硬性打折促销，希望建立情感连接而非价格连接（PDF 第 23 页）。竞争信息实现差异化，如主要对手“活力无限”夏季主打极限运动和音乐节场景，本方方案需侧重日常、轻松、可触及的生活瞬间（PDF 第 23–24 页）。<\/p>\n<p><strong>调整表述方式<\/strong>：把模糊、主观的感受翻译成模型可理解、可执行的客观提示词。书中列三个技巧。其一，把形容词替换为“动词 + 方法”：“让活动口号更有冲击力”换成“请重写活动口号，使用‘动词 + 场景’的句式，并运用排比或对比的修辞手法，营造富有感染力的活动氛围”（PDF 第 24 页）。其二，角色扮演或风格类比：与其费力描述风格，不如让模型扮演一个具体范例角色，如“请扮演一位类似《深夜食堂》老板的角色，以第一人称视角，用充满画面感和生活细节的语言，重述这个创意故事”（PDF 第 25 页）。其三，提出引导性问题而非下达模糊命令：把“渠道建议要更具体”拆成三个问题，小红书最合适图文笔记还是短视频及原因、线下活动核心互动体验是什么、线上线下如何联动（PDF 第 25 页）。<\/p>\n<p><strong>限定输出边界<\/strong>：为产出内容设定交付规格，确保不多不少、格式工整、即拿即用。边界定义最终成品的细节：写几条、每条多长、是否附带解释、用什么格式排列。<\/p>\n<h2>原理推导<\/h2>\n<p>迭代能在同一对话中生效，依赖上下文累计机制：每一轮补充的约束进入本轮上下文，模型在下一轮作答时同时参考原始请求与历次补充。推演链路：第一轮方案基于初始约束生成；第二轮指出偏差并补一条新约束；模型在新旧约束共同作用下调整产出；多轮之后约束集合收敛到可用范围。<\/p>\n<p>三条路径分别作用于不同偏差类型。补充关键信息作用于内容贴合度：范例提供正参照，禁区排除负方向，竞争信息标出空位。调整表述方式作用于可执行性：感觉词缺少可落地点，换成动词、句式、手法、参照角色后，模型有明确动作可执行。限定输出边界作用于篇幅与格式：边界约定交付规格，抑制额外展开。<\/p>\n<p>多轮对话三阶段与迭代对应。定义问题阶段先把任务与背景说清；迭代方案阶段按上述三条路径逐轮修改；总结复盘阶段把定稿的结构与约束沉淀下来，供同类任务复用（PDF 第 26–31 页，书中版本，界面可能已变）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>迭代适合第一轮方向基本正确、局部需要打磨的方案。若第一轮方向整体跑偏，补细节无法救回，应回到背景定位与目标明确层重做。补充信息必须真实：范例、禁区、竞争格局若凭空编写，模型会沿虚构前提继续展开。<\/p>\n<p>边界有两条。其一，迭代轮次存在收益递减：前几轮补的是大缺口，后续轮次改动越来越小，当产出已满足验收清单即可停止，不必无限打磨措辞。其二，上下文长度有限，补充信息应围绕当前缺口，不要把无关历史材料全部贴入；无关信息会稀释关键约束。<\/p>\n<h3>反例<\/h3>\n<p>反例一：连续两轮只说“再改好一点”。没有补范例、禁区或具体手法，模型收到的仍是感觉词，只能在原方案上换近义词。 反例二：把负面清单省略不写。模型不知道品牌不做明星代言与打折促销，方案可能主动提出这类违反品牌价值的方向。 反例三：迭代时重开新对话。上一轮补充的范例、禁区、竞争信息不进入新上下文，产出回到第一轮通用水平。<\/p>\n<h2>辨析<\/h2>\n<p>与三步骤构造（c01）的差别：三步骤在第一轮把已知约束一次写全；迭代处理第一轮之后才暴露的缺口。能在第一轮写清的信息不必留到迭代，但内部范例、禁区这类容易被忽略的隐性知识，常在首轮之后才想起补充。<\/p>\n<p>与结构化输出（c03）的差别：结构化输出约定的是条目骨架；迭代调整的是条目内的措辞、贴合度与篇幅。骨架固定后，逐轮打磨的是内容质量。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：三步骤提示词（c01）。后继：结构化模板复用（c03）把迭代中沉淀的定稿约束固化；扣子智能体的测试—优化循环（c10）沿用同一逻辑：多轮测试发现不符预期，回到人设与回复逻辑调整后再测。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（迭代式改稿：补充关键信息、调整表述方式、限定输出边界）<\/summary><div class=\"depth-body\"><h1>c02 深度片段：迭代改稿的依赖链、推导与可复现算例<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>从一份可交付方案倒推迭代所需的补充项。终稿要同时满足：贴合品牌调性、可直接执行、篇幅与格式合规。先逆推贴合度：模型不知道内部文化、过往成功经验、风险禁区与对手格局，这些只能由用户在迭代中补入，对应补充关键信息路径。再逆推可执行性：方案里的口号、故事、渠道建议若只给方向不给手法，落地时仍要二次改写，对应调整表述方式路径。最后逆推合规性：交付物条目数量、篇幅、是否附带解释需要边界约定，对应限定输出边界路径。<\/p>\n<p>逆推结果：三条迭代路径分别支撑终稿的一项验收标准；缺哪条，终稿就在哪一项上不合格。上下文累计是迭代成立的前提——若每轮新开对话，补充项无法被下一轮引用，逆推链条断裂。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，观察第一轮方案，定位偏差属于哪一类。判断规则：内容与品牌语境对不上，归贴合度问题；建议读完不知道具体怎么做，归可执行性问题；附带多余解释或条目长度失控，归篇幅格式问题。三类问题可同时存在，按路径分别补指令。<\/p>\n<p>第二步，走补充关键信息推演。范例作用机制：模型对“好创意”的理解偏宽，给出具体参照物后，风格、要素与社区感有了落点。禁区作用机制：模型默认会提议常见营销手段（明星代言、打折促销），负面清单提前排除这些方向。竞争信息作用机制：不了解对手时策略容易撞上现有场景，标出对手主打的运动与音乐节后，本方转向日常轻松场景形成空位。<\/p>\n<p>第三步，走调整表述方式推演。形容词不可执行的原因：模型能感知词的情感倾向，但无法把“冲击力”换算成句式与修辞；换成“动词 + 场景”句式、排比或对比手法后，每个词都对应可检查的文字特征。风格类比的作用机制：描述一种风格需要大量特征词，给一个具体角色范例，模型借范例的语料特征迁移表达。引导性问题的作用机制：模糊命令“更具体”没有落点，拆成三个可回答的问题后，每问对应一段可展开内容。<\/p>\n<p>第四步，走限定输出边界推演。边界把交付规格固定下来：条数、单条长度、解释取舍、排列格式。边界抑制的是模型主动加值倾向：为表现能力，模型倾向补充背景说明与延伸建议；明确边界后，这些额外内容不再生成。<\/p>\n<p>第五步，多轮收敛检验。每补一条约束，对照第一轮偏差清单检查对应项是否消除；未消除则判断是约束不够具体，还是方向本身需要回到目标层重做。<\/p>\n<h2>算例<\/h2>\n<p>可复现操作序列（依据书中 PDF 第 22–25 页案例改写）：<\/p>\n<p>初始方案状态：三套营销方案结构齐全，但创意偏通用，口号偏空，渠道建议泛泛。<\/p>\n<p>第二轮指令（补关键信息）：<\/p>\n<ol><li>\n成功范例：作为参考，去年最成功的营销活动是“城市角落咖啡地图”，核心是鼓励用户发现并分享身边有特色的小众咖啡馆，关键要素是用户生成内容（UGC）和真实社区感。请在生成的创意中体现这两个要素。\n<\/li><li>\n负面清单：注意，品牌从不用明星代言，也避免任何形式的硬性打折促销，希望与用户建立情感连接，而非价格连接。\n<\/li><li>\n竞争信息：主要竞争对手“活力无限”今年夏季主打极限运动和音乐节场景，方案需更侧重日常、轻松、可触及的生活瞬间，实现差异化。\n<\/ol>\n<p>第三轮指令（调表述方式）：口号部分，使用“动词 + 场景”的句式，运用排比或对比的修辞手法；故事部分，扮演类似《深夜食堂》老板的角色，第一人称视角，用画面感和生活细节的语言重述；渠道部分，依次回答：①小红书最合适图文笔记还是短视频，为什么；②线下活动核心互动体验是什么；③线上线下如何设计机制联动。<\/p>\n<p>第四轮指令（限边界）：每套方案只保留五个规定条目，口号不超过两句，渠道建议列具体平台与形式，不要附加整体行业背景解释。<\/p>\n<p>产出变化量级：第二轮后创意出现 UGC 与社区要素，不再提议代言与打折；第三轮后口号有句式特征，故事有角色视角，渠道分平台回答；第四轮后篇幅收敛到条目内。耗时：每轮补充信息来自手头品牌资料，单轮提示约 3–8 分钟；生成等待为秒级到十几秒；对比不做迭代的情形，人工后期逐条删改与重写渠道建议的时间显著高于补指令的时间。<\/p>\n<p>对比实验式推理：固定方案初稿，甲不补信息直接交付；乙只补范例；丙补范例加禁区；丁三类信息齐全。预期贴合度递增：甲撞上通用与禁区方向，乙有参照但仍可能提议代言，乙排除部分负方向但差异化不足，丁同时具备参照、禁区与空位。表述路径上也有相同的递增关系：感觉词、动词加方法、角色范例三种指令下，产出可落地程度依次提高。<\/p>\n<h2>补充推演：迭代指令在上下文中的累积机制<\/h2>\n<p>多轮对话里，每一轮新指令与历史轮次共同构成上下文。模型下一轮作答时，同时参考原始请求、第一轮补充、第二轮补充；后补的范例、禁区、竞争信息不会覆盖先前的目标与结构，而是叠加在约束集合上。推演累积过程：第一轮约束集为初始三段式；第二轮加入范例与禁区，约束集扩大；第三轮加入手法与角色类比；第四轮加入篇幅边界。约束只增不减，除非明确要求修改上一条。<\/p>\n<p>三条路径的作用对象分开看。补充关键信息改变的是内容素材参照：范例给正例，禁区给排除项，对手给空位；这些信息模型默认不知道，只能由用户带入。调整表述方式改变的是指令可执行性：感觉词无法落到动作，动词、句式、手法、角色范例把要求翻译成模型可操作的特征。限定输出边界改变的是生成范围：条数、长度、解释取舍，抑制额外展开。<\/p>\n<p>迭代停止条件推演。每轮补充后对照偏差清单检查：贴合度、可执行性、篇幅三项是否达标。前几轮补的是大缺口，改动幅度大；后续轮次只剩措辞微调，收益递减。当产出已能按验收清单逐条通过，即停止迭代；继续打磨措辞的时间不如留到核验内容事实。<\/p>\n<p>上下文容量边界。补充信息应围绕当前缺口，不把无关历史材料全部贴入：无关信息占用上下文后，模型注意力被分散，关键约束的优先级下降。若任务主题已变，应开新对话重写背景，而不是在旧上下文里堆叠新要求。<\/p>\n<h2>迭代指令书写顺序与案例对照<\/h2>\n<p>迭代时先判断偏差类别，再选对应路径写指令，不混在一起堆要求。贴合度问题先补范例或禁区，指令中明确参照对象与排除方向；可执行性问题把感觉词改成动作与手法，或给角色范例；篇幅问题补条数、长度与解释取舍。一条迭代指令只解决一类主要偏差，多类偏差分轮处理，避免新指令与旧约束互相拉扯。<\/p>\n<p>案例对照第一轮补充：范例段写去年活动名称与两个关键要素，要求新创意体现；禁区段写不做代言、不做硬促销；竞争段写对手场景与本方空位。三类信息各有明确落点，模型可分别对应到方案的创意方向、排除项与差异化定位。第三轮表述调整：口号给句式与修辞，故事给角色视角，渠道拆三个问题；每个技巧对应一段产出的可落地特征。<\/p>\n<p>迭代记录建议。每轮补充的范例、禁区、竞争信息属于定稿约束，同类任务下次直接带入模板；措辞手法可沉淀为常用句式库。多轮结束后回看约束集合，区分哪些是本次任务特有、哪些可复用，为 c03 的模板复用做准备。<\/p>\n<h2>与相邻概念的衔接<\/h2>\n<p>迭代改稿的产出是一轮轮修订后的定稿；定稿中的条目骨架沉淀到结构化模板（c03），下次同类任务直接复用。迭代中补入的范例与禁区，若属于岗位长期规则，可移入扣子智能体的限制段（c10），不再每轮对话重复交代。多轮上下文依赖同一对话窗口，新开对话前先把定稿约束抄入新提示词。<\/p>\n<h2>第二算例：助眠灯笔记的指导优化与定向探索（换任务：从营销方案改稿换到单篇笔记润色）<\/h2>\n<p>任务背景（依据 PDF 第 38 页）：AI 写作首轮生成三篇小红书笔记，第一篇切入点可用，但情感铺垫不足，读起来像产品说明书。<\/p>\n<p>步骤序列：<\/p>\n<ol><li>\n先定位偏差类别：第一篇不是结构问题，属贴合度与表述方式问题——视角在产品功能介绍，缺子女对父母的情感表达；走调整表述方式路径。\n<\/li><li>\n按手册四步框架写迭代指令（PDF 第 38 页）：保留什么——“第一篇笔记的切入点很好，保留”；问题在哪——“但情感铺垫不足，像说明书”；如何修改——“把视角切换为‘子女关爱父母’，通过故事表达情感”；期望结果——“目标是让文案更‘催泪’，引发情感共鸣”。\n<\/li><li>\n发送后通读重写稿：检查视角是否换成子女关爱父母，是否出现具体生活细节，情感段是否落在送礼场景上；仍像说明书，再补“少列功能参数，多写睡前使用场景”的指令。\n<\/li><li>\n定向探索分支：口号定稿前，围绕已确定的“月圆，梦圆，人团圆”这句，要求再创作 5 个结构相似但意境不同的版本，供最终挑选（PDF 第 38 页）。这一步不改既定口号方向，只在句式与意象范围内发散。\n<\/li><li>\n收敛判断：五个版本与定稿口号并排比较，选意境与送礼场景最匹配的；其余版本留作备用，不进入最终方案。\n<\/ol>\n<p>判断依据与回退：四步框架缺“保留什么”，重写时可能把已经可用的切入点一起改掉；缺“问题在哪”，模型不知道要修哪一段；只给感觉词“更感人”而不换视角与句式，产出仍停留在原角度。这一步不做会怎样：跳过指导优化直接交付，笔记功能罗列完整但不打动人；跳过定向探索，口号只在单一意象里反复改写，没有可比较的备选。<\/p>\n<h2>延伸推演：迭代成立的三个前置子条件<\/h2>\n<p>多轮改稿不是“开着对话框就能迭代”，把前提再拆一层。<\/p>\n<p>子条件一：上下文仍在同一对话窗口。每轮补充的范例、禁区、竞争信息靠历史轮次引用；新开对话后这些约束不被下一轮看到，迭代链条断裂。断裂后的现象：第二轮补充的禁区没有生效，产出重新提议被排除的方向。<\/p>\n<p>子条件二：偏差能被归到三条路径之一。用户要能判断问题出在贴合度、可执行性还是篇幅格式；归不了类，指令只能写“再改好一点”，模型无法定位修改段。断裂后的现象：多轮补充后问题原地打转，每轮改的都不是同一段。<\/p>\n<p>子条件三：手里有可对照的初稿与验收清单。迭代是在初稿上修，没有初稿就没有偏差对象；没有清单，改完一轮无法判断达标与否。断裂后的现象：指令越堆越多，产出风格被多条新要求拉扯，篇幅与重点失控。<\/p>\n<p>三个子条件对应迭代链的入口：窗口、分类、对照物。任一缺失，先补前置条件再发迭代指令；任务主题已经变化时，按手册多轮对话的总结复盘阶段沉淀约束后另开对话重写背景（PDF 第 26–31 页），而不是在旧上下文里堆叠新要求。<\/p>\n<p>补充说明：上下文窗口不是无限容量。补充信息应围绕当前缺口，无关历史材料全部贴入会占用上下文、分散关键约束的优先级；迭代记录每轮只记偏差类别与处理指令，定稿后再区分本次特有约束与可复用约束，可复用部分沉淀进模板（c03），不留在对话窗口里长期堆积。<\/p>\n<h2>对抗性追问：模型能力升级后，这套迭代技巧会不会失效<\/h2>\n<p>读者反驳：等模型理解能力变强，一轮就能出好稿，补充信息、调表述、限边界这些迭代步骤是否还有必要。<\/p>\n<p>手册写了什么：第 1.2.2 节按当时产品表现给出三条迭代路径，第 1.3 节把多轮对话分为定义问题、迭代方案、总结复盘三阶段（PDF 第 22–31 页，书中版本）。手册没有对模型未来版本做预测。<\/p>\n<p>补充判断（手册未展开）：迭代技巧的必要性随两类因素变化。模型对常见表达的默认把握变好后，表述方式类调整（句式、角色类比）的轮次会减少；但贴合度类调整（内部范例、禁区、竞争信息）不依赖模型能力——这些信息模型默认不知道，必须由用户带入；边界类调整（条数、长度、解释取舍）也不会因模型变强而自动消失。判据：观察首轮产出缺的是“不知道的事实”还是“没翻对的表达”。前者靠补信息，与版本无关；后者随模型能力提升减少。半年后界面与模型名单可能更新，迭代的分类思路保留，具体技巧对照当前版本调整。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n手头这份初稿的偏差，分别属于贴合度、可执行性、篇幅格式中的哪一类？对应走哪条迭代路径？\n<\/li><li>\n补入的范例、禁区、竞争信息，有没有哪一项是自己也不掌握事实、需要先核实的？\n<\/li><li>\n提示词里残留的形容词，能否逐个换成动词、句式、手法或角色范例？\n<\/li><li>\n输出边界是否写清了条数、单条长度与解释取舍？模型有没有可能在边界之外主动展开？\n<\/li><li>\n当前对话上下文是否还保留着前几轮的约束；若新开对话，哪些补充项需要重新写入？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "迭代式改稿：补充关键信息、调整表述方式、限定输出边界"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.21<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">有效提示词的三步骤：背景定位、目标明确、要求细化<\/a><\/span><\/div><h1>结构化输出与模板复用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章 | <strong>原书位置<\/strong>：第 1.2.1 节输出结构（PDF 第 20–21 页）、第 2.2 节 AI 写作（PDF 第 35–38 页）、第 2.4 节 AI PPT（PDF 第 42–44 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>办公场景里拿到 AI 初稿后，常要花大量时间重排格式：段落层级混乱、条目缺失、篇幅失控，同一份内容换个用途就要重新组织。问题出在提示词只描述了主题，没有约定交付物的结构。模型在无结构约束时按语料常见形态自由展开，章节安排、条目数量、详略程度都由模型自行决定，用户验收时只能整段返工。<\/p>\n<p>结构化输出要解决的困难是：把人脑里已经熟悉的交付物骨架，提前写进提示词，让模型按固定条目产出；同类任务重复出现时，骨架沉淀成模板，下一次只换背景与素材，不再重新沟通格式。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>结构化输出包含两层约定。第一层是条目清单：交付物由哪几个部分组成，每个部分叫什么。书中营销方案案例规定每套方案含主题名称、核心口号、用户洞察、创意故事、渠道建议五个部分（PDF 第 20 页）。第二层是条目写法：每个部分写什么、写到什么程度。案例逐项说明：主题名称给易于传播的名字；核心口号用最短语言戳中渴望；用户洞察交代心理或行为依据；创意故事描述核心内容与展开；渠道建议指明传播渠道（PDF 第 20 页）。<\/p>\n<p>模板复用指把经过验收的结构约定保留下来：条目名称、顺序、写法说明固定，下一次同类任务只替换背景信息、品牌素材与具体要求，骨架不变。AI PPT 环节体现了同一思路：先把核心信息整理清楚，再由演示文稿功能按内容组织页面（PDF 第 42–44 页，书中版本，界面可能已变）；信息结构不清，生成的页面也无法直接使用。<\/p>\n<h2>原理推导<\/h2>\n<p>模型生成文本时，输出顺序受提示词中结构约定的引导。提示词列出条目名称与顺序，模型在生成时按条目分段填充；条目写法说明进一步约束每段内容的角度。推演链路：结构约定进入上下文 → 模型按约定分段 → 每段围绕该条目职责展开 → 产出可按同一清单逐条验收。<\/p>\n<p>结构约定降低两类成本。一是检查成本：条目固定后，验收只需要逐条核对有无缺项，不必通读整篇判断章节是否合理。二是返工成本：模型自由发挥多出的段落，在结构约定下不再生成；条目缺失时也能定位到具体条目补充。<\/p>\n<p>模板复用的机制是把一次迭代的成果固化。第一轮打磨出的条目清单经过验收后，条目名称与写法说明属于可迁移部分，背景品牌与用户画像属于每次更换部分。下次同类任务先调模板，再填变动项，避免从零构造提示词。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>结构化输出适合交付物形态稳定、可枚举条目的任务：方案、汇报、纪要、清单、表格提纲、演示文稿大纲。任务形态每次差异很大、需要探索发散时，过细的结构会限制思路，可先自由生成再整理。<\/p>\n<p>边界有三条。第一，结构约定不能替代内容事实：条目齐全不代表条目内的数据、案例准确，仍需核验。第二，条目数量与名称要符合真实交付习惯，硬套不相关的模板会让产出形式化。第三，模板复用前要检查条目是否仍适用于新场景；场景变化时先改结构，再填内容。<\/p>\n<h3>反例<\/h3>\n<p>反例一：只写“输出一份方案”，不列条目。模型自行安排章节，交付后可能缺渠道建议或用户洞察，补写要在长文里找位置插入。 反例二：条目有名称无写法。模型知道要写“用户洞察”，但不清楚该写心理依据还是数据罗列，条目内容偏离预期。 反例三：把上一个行业的模板原样套用。条目骨架可留，行业语境、合规表述与案例类型未更换，产出与新任务对不上。<\/p>\n<h2>辨析<\/h2>\n<p>与要求细化（c01 末段）的关系：要求细化是三步骤中负责结构的一段，结构化输出是这一段的独立展开；前者是构造方法，后者是产出形态与复用资产。<\/p>\n<p>与格式排版的差别：结构化约定的是内容条目与顺序，不是字体、字号、对齐等排版样式；排版在文档或成片工具里另行处理。<\/p>\n<p>与大纲的差别：大纲是写作前的思路划分，结构化输出是对模型交付物的条目约束；大纲服务于人思考，结构约定服务于机器按条目生成。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：三步骤提示词（c01）。后继：扣子工作流节点间的变量交接（c10）沿用结构化思路，每个节点输出命名固定、类型明确；扣子知识库把资料整理成“功能模块—问题摘要—详细说明”单元再分段入库，也是结构化在检索侧的应用（PDF 第 188、193 页）。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（结构化输出与模板复用）<\/summary><div class=\"depth-body\"><h1>c03 深度片段：结构化输出的依赖链、推导与可复现算例<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>从交付验收倒推结构约定。验收一份营销方案时，检查者需要回答：名字是否易传播、口号是否戳中、洞察是否有依据、故事是否完整、渠道是否具体。这五项检查点对应五个条目；若提示词不写条目，模型产出的章节无法与检查点一一对应，验收只能整体评判。继续逆推：每个条目能被检查，前提是写法说明固定了该条目角度；条目角度不清，检查标准也无法固定。再逆推：模板可复用的部分是条目清单与写法说明，每次更换的部分是品牌、人群、活动主题等素材信息。<\/p>\n<p>逆推得到链条：验收检查点 ← 条目清单 ← 条目写法说明 ← 可迁移骨架与每次变动素材。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，确定交付物类型，列出真实交付时必须出现的组成部分。以活动方案为例，参照工作中可直接上报的方案形态，拆出主题、口号、洞察、故事、渠道五项；这一步不依赖模型，依赖对交付场景的了解。<\/p>\n<p>第二步，为每个条目写写法说明。说明要指向可检查的内容特征：主题名称对应传播性，口号对应语言长度与感染力，洞察对应心理或行为依据，故事对应情节展开，渠道对应具体平台。写法说明避免再用感觉词，沿用 c02 的表述原则。<\/p>\n<p>第三步，把条目清单与写法说明放入提示词的要求细化段，明确“严格按此结构输出”。模型生成时按条目分段，条目顺序与提示词一致；每段围绕条目职责填充。<\/p>\n<p>第四步，验收对照。产出后逐条核对：条目是否齐全、写法是否对应、内容是否贴合背景。缺项回到对应条目补指令；条目齐全但内容偏，走迭代路径（c02）调整措辞与贴合度。<\/p>\n<p>第五步，模板沉淀。定稿后把条目名称、顺序、写法说明抽出保存；下次同类任务先复制骨架，替换背景定位与具体素材，再检查条目是否需要按新场景增删。<\/p>\n<h2>算例<\/h2>\n<p>可复现操作序列（结构部分依据 PDF 第 20–21 页案例）：<\/p>\n<p>任务：为新兴饮料品牌出夏季活动方案。 模板条目骨架（可复用）：<\/p>\n<ol><li>\n主题名称：一个易于传播的活动名字。\n<\/li><li>\n核心口号：最短语言戳中渴望，让人想动起来。\n<\/li><li>\n用户洞察：创意基于年轻人哪种心理或行为洞察。\n<\/li><li>\n创意故事：核心内容与展开方式。\n<\/li><li>\n渠道建议：具体平台与传播形式。\n<\/ol>\n<p>本轮填写变动项：品牌主打自然、活力、年轻；用户为 Z 世代与都市年轻白领；季节为夏季；数量 3 套方向。<\/p>\n<p>产出预期：3 套方案并列，每套按五个条目分段；检查时按五条清单逐项打勾。<\/p>\n<p>量级估算：构造模板条目约 10 分钟，来自对交付场景的梳理；每轮生成秒级到十几秒；模板复用后，同类任务首轮提示词只需填变动项，构造时间缩短到几分钟。对比无结构情形：无结构长文交付后，人工找缺项、插入条目、重排段落的时间随篇幅上升；结构化把返工限制在条目内修改。<\/p>\n<p>对比实验式推理：甲，提示词只给主题；乙，给条目清单无写法；丙，条目加写法说明；丁，丙基础上复用历史模板。预期可验收性递增：甲章节随机，乙条目位置固定但内容角度随机，丙条目与角度都固定，丁再省去骨架构造成本。四者内容准确性仍取决于背景信息与人工核验，结构只解决组织方式问题。<\/p>\n<h2>补充推演：条目约定如何降低检查与返工成本<\/h2>\n<p>无结构约定时，验收者要先通读整篇判断章节是否合理，再逐条找缺项；文章越长，定位缺项位置的成本越高。有结构约定后，验收清单与提示词条目一一对应，检查动作变成逐条核对：该条目是否出现、写法是否对应。定位成本从通读全文降到按条目查找。<\/p>\n<p>返工成本推演。无结构时模型自由分段，缺渠道建议要在长文里找插入位置，插入后还要调整上下文衔接；有结构时缺项直接定位到渠道条目，补写只在该条目内完成。额外篇幅上也是同一机制：边界约定条数与长度后，模型不生成清单外段落，人工删多余内容的环节省略。<\/p>\n<p>模板复用的迁移边界推演。可迁移部分是条目骨架与写法说明，因为它们描述交付物类型，不绑定具体品牌；不可迁移部分是背景、人群、案例、行业术语。复用时先判断交付物类型是否相同：方案对方案、纪要对纪要，骨架可留；跨类型任务（从营销方案换成会议纪要）条目要重列。<\/p>\n<p>结构与事实的分工再明确。结构约定解决“分几段、每段写什么”，不解决“段内内容对不对”。条目内的数据、案例、法规表述仍需人工核验；不能因为结构齐全就默认内容可用。模板固化的是组织方式，不是事实来源。<\/p>\n<h2>模板搭建步骤与复用检查<\/h2>\n<p>搭模板分两步。第一步列条目：参照真实交付物目录，把必须出现的组成部分写成条目名称。第二步写条目说明：每条说明该条目回答什么问题、用什么角度写、篇幅大约多长。说明写完后拿一条历史合格产出对照，确认条目能覆盖其内容；覆盖不到的部分补条目，覆盖不了的条目删掉。<\/p>\n<p>复用检查按三项。交付物类型是否相同：方案、纪要、提纲、卡片各自骨架不同。条目是否仍符合本次场景：行业变化后条目可能增删。变动项是否已替换：背景、人群、案例、数据不留在旧模板里。检查顺序先结构后内容，避免新内容套在过期骨架上。<\/p>\n<p>结构化在其他工具中的延伸。表格场景下，结构化体现为字段与选项；知识库场景下体现为知识卡片单元；工作流场景下体现为节点输出变量。共同原则是把交付物拆成固定、可核对的单元，再让模型或流程按单元填充。<\/p>\n<h2>边界补充<\/h2>\n<p>结构化约定不保证条目内事实准确，也不消除发散空间之外的措辞问题。模板复用前要确认本次任务没有新增必须出现的交付部分；场景变化后硬套旧骨架，形式齐全但内容缺位。条目说明写得过细会限制必要发挥，过粗又无法核对，粒度以历史合格产出能被条目覆盖为准。<\/p>\n<p>表格与文档场景中，结构化先于排版：条目骨架对应字段或章节，字体字号等样式另行设置；不要把排版要求混进内容条目清单。模板保存时分开存放骨架部分与本次素材部分，复用时先取骨架再填素材。<\/p>\n<h2>第二算例：会议纪要的结构化条目骨架（换任务：从营销方案换到会议纪要）<\/h2>\n<p>任务背景：一次项目协调会结束后要整理纪要，供参会人核对决议与跟进待办。与方案类交付物不同，纪要的验收点是“决议有没有记全、待办有没有人和期限”，条目按会议流程组织。<\/p>\n<p>步骤序列：<\/p>\n<ol><li>\n列条目：对照真实纪要形态，拆出六个固定条目——会议议题、发言要点、形成决议、待办事项、负责人、截止日期。条目来自会议记录的检查点，不来自模型默认章节。\n<\/li><li>\n写条目说明：会议议题写本次讨论的主题；发言要点写各方主要意见与分歧；形成决议写会上已定的结论；待办事项写要做的动作；负责人写承担人姓名或岗位；截止日期写承诺完成时间。每条说明指向可核对内容，不写“写清楚一点”。\n<\/li><li>\n填入变动项：会议时间、参会人、具体议题与意见作为本轮素材填入；条目骨架与写法说明保留。\n<\/li><li>\n生成后按条验收：六个条目逐条打勾；决议与待办是否一一对应；待办是否都有负责人和日期。缺项定位到条目补指令，不在整篇里临时加段。\n<\/li><li>\n模板沉淀：下次会议先复制六条目骨架，替换会议素材；若新增评审、风险记录等固定环节，再把条目补进骨架。\n<\/ol>\n<p>判断依据与回退：条目对不上验收点，回到第 1 步检查漏了哪个会议检查项；条目出现但内容空泛，检查写法说明是否指向具体角度；同一议题决议与待办脱节，说明条目边界没写清，回去补两条目的职责区分。这一步不做会怎样：不给条目，模型按常见文章分段，决议混在发言记录里，会后找人找结论要通读整篇；条目与素材混存，下次复用时旧会议的人名日期留在模板里。<\/p>\n<h2>延伸推演：结构化成立的三个前置子条件<\/h2>\n<p>固定条目不是套上清单就生效，把前提再拆一层。<\/p>\n<p>子条件一：交付物的组成部分可以枚举。方案、纪要、提纲这类交付物在真实工作中有固定组成；若交付物形态本身还在探索（比如一次没做过的汇报类型），条目列不全，结构约束先空转。去掉这个子条件，卡在列条目步：清单靠猜，生成后才发现缺必备部分。<\/p>\n<p>子条件二：每个条目能写出可检查的写法说明。条目名称只是标题，写法说明规定角度与篇幅；写不出说明，条目变成空标题，模型在标题下自由发挥。去掉这个子条件，条目位置固定但内容角度随机，验收时仍要整体通读判断。<\/p>\n<p>子条件三：骨架与本轮素材分开保存。模板复用依赖条目清单与写法说明可原样抽出；骨架和本次品牌、人群、案例写在同一段提示词里，下次复用要先删素材再填新素材，容易残留旧内容。去掉这个子条件，复用成本接近重写模板。<\/p>\n<p>三个子条件对应结构化链的三步：可枚举、可核对、可分离。任一步不满足，先补前置：交付物形态不明先参照同类历史产出，写法不清先拿一条合格产出对照，素材混杂先拆分存放。<\/p>\n<h2>对抗性追问：条目齐全的产出是否就能直接交付<\/h2>\n<p>读者反驳：只要提示词里把条目列全、模型按条目分段，结构上就没有问题，内容可以直接用。<\/p>\n<p>手册写了什么：结构化输出约定的是条目清单与条目写法（PDF 第 20–21 页）；AI PPT 环节也先要求把核心信息整理清楚，再由演示文稿功能按内容组织页面（PDF 第 42–44 页，书中版本，界面可能已变）。手册流程中生成后仍有人工检查环节。<\/p>\n<p>补充判断（手册未展开）：条目齐全只证明组织方式达标，不证明条目内事实准确。判据分两层：先过结构层，逐条核对条目齐全、写法对应；再过事实层，逐条核对条目内的数据、结论、人名、日期有资料来源。两层都通过才可交付；只过结构层的稿子，条目再整齐，事实错误仍会随条目进入终稿。条目说明写得过细会限制必要发挥，过粗又无法核对，粒度以历史合格产出能被条目覆盖为准。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n当前交付物在真实工作中必须出现哪几个部分？这些部分能否列成固定条目？\n<\/li><li>\n每个条目写法说明是否指向可检查特征，有没有残留“写得好一点”这类表述？\n<\/li><li>\n条目清单与本次品牌素材是否分开保存，模板部分能否原样复用到下一个同类任务？\n<\/li><li>\n新场景与旧模板相比，哪些条目需要增删，哪些只需替换内容？\n<\/li><li>\n产出验收时，能否按条目逐条判断合格与否；若不能，缺的是条目还是写法说明？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "结构化输出与模板复用"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.49<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">有效提示词的三步骤：背景定位、目标明确、要求细化<\/a><\/span><\/div><h1>图像提示的三层结构：主体—环境—风格<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章 | <strong>原书位置<\/strong>：第 3.1 节文字生图提示词公式（PDF 第 49 页）、第 3.2 节表情包提示词（PDF 第 51–52 页）、第 6.4 节城市宣传提示词（PDF 第 87 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>文生图时，“画一张千里江山图”这类短描述难以复现原作意境：模型不知道山的远近层次、云雾楼阁如何安排，也不知道该出水墨、3D 还是玻璃质感。图像模型与语言模型不同，它按提示词中的要素分配画面生成重点；提示词缺一个维度，该维度就由模型按默认风格随机补全，同一提示多次生成差异很大。<\/p>\n<p>三层结构要解决的困难是：把脑中的画面拆成模型可分别响应的要素，先定主角，再定场景氛围，最后定视觉画法，使生成结果落在预期方向上。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>书中 3.1 节给出提示词公式：主体 + 环境 + 风格（PDF 第 49 页）。<\/p>\n<p><strong>主体<\/strong>：画面主角，整个画面的核心。例：千里江山图、窗台上打盹的橘猫。主体回答“画什么”，是构图视线落点。<\/p>\n<p><strong>环境<\/strong>：主体所处的场景与氛围。例：山峦、阁楼、夕阳、太空等。环境回答“在哪、什么氛围”，决定背景层次与光线基调。<\/p>\n<p><strong>风格<\/strong>：图片的视觉呈现形式。例：玻璃质感、摄影写实、二次元卡通、水墨、3D 等。风格回答“怎么画出来”，决定材质、笔触与光影处理方式。<\/p>\n<p>书中案例修改后的提示词为“千里江山图（主体），层叠的山峦（环境），玻璃质感（风格）”，在图片生成界面选择模型与 16:9 比例后提交（PDF 第 49 页）。<\/p>\n<p>表情包是公式的变体：一套可用表情包通常包含至少 9 种表情，且所有表情保持角色形象与画风高度一致；提示词采用“角色 + 动作情绪 + 风格 + 图片布局”结构，其中动作情绪替代一般图像生成中的环境要素，图片布局用于规范画面排列；背景尽量纯色，避免复杂场景干扰主体（PDF 第 51 页）。案例提示词：角色为一个熊猫，脸部特征，上半身；动作情绪为各种表情和动作，欢乐、生气、悲伤、愤怒、思考、拥抱、奔跑、招手等；风格为可爱动漫插画风格；图片布局为 3×3 网格图，纯色背景（PDF 第 52 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>图像模型对提示词中的名词性要素分别响应：主体要素锁定画面中心对象，环境要素填充背景与氛围，风格要素控制材质与画法。推演链路：三层要素进入提示词 → 模型按要素分配生成重点 → 未写要素由默认值补全 → 要素越完整，随机补全范围越小。<\/p>\n<p>三层之间有构图依赖。主体先定，因为环境围绕主体展开；环境后定，因为同一场景在不同主体下位置关系不同；风格最后定，因为材质画法覆盖在主体与环境之上。顺序颠倒不会阻止生成，但环境描述与主体脱节时，画面层次会乱。<\/p>\n<p>表情包变体的机制：九宫格需要多个表情同框，环境要素（具体场景）会分散角色一致性，因此用动作情绪替代，把每格区分点放在表情与动作上；图片布局（3×3 网格）约束排列方式，纯色背景排除多余干扰，角色特征在九格之间保持一致。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>三层结构适合单主体明确、画面可描述的文生图任务：风景、静物、角色、海报画面、表情包。多主体复杂叙事画面，三层之外还需要构图与关系描述；纯风格练习无明确主体时，主体层可弱化，但环境与风格仍需交代。<\/p>\n<p>边界有三条。第一，提示词描述不能替代参考图：主体长相、品牌产品外观需要高度一致时，应结合参考图约束（见 c06）。第二，风格词要具体可辨，“好看”“高级”不是风格；玻璃质感、摄影写实、二次元卡通、水墨、3D 这类可识别画法才是风格要素。第三，三层要素之间不能互相冲突，主体为写实人物却写卡通风格，模型会在两种画法间摇摆。<\/p>\n<h3>反例<\/h3>\n<p>反例一：只写主体“一只猫”。环境与风格随机，可能出现水墨猫、照片猫、卡通猫混杂结果。 反例二：主体明确、环境明确，但风格留空。场景层次有了，材质画法由模型默认，质感与预期不符。 反例三：表情包提示词只写角色与情绪，不写布局与背景。九格排列可能散乱，背景场景干扰表情识别。<\/p>\n<h2>辨析<\/h2>\n<p>与语言提示词三步骤（c01）的对应：背景定位在图像侧对应主体与环境（对象与语境），要求细化对应风格与布局约束；目标明确在图像侧常体现为比例与用途（c05）。差别在于语言约束的是章节与措辞，图像约束的是画面要素。<\/p>\n<p>与参数选择（c05）的差别：三层是提示词文字内容，模型与比例是界面参数；提示词决定画面要素，参数决定模型侧重与画幅方向，两者配对使用。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：提示词构造思路（c01）。后继：模型分工与参数配对（c05）在三层提示词基础上选模型与比例；首尾帧一致性（c06）用参考图把主体与风格跨画面锁定；扣子工作流图像生成节点把三层提示词整理为 tishici 变量传递给视觉设计师节点（PDF 第 217 页）。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（图像提示的三层结构：主体—环境—风格）<\/summary><div class=\"depth-body\"><h1>c04 深度片段：三层图像提示的依赖链、推导与可复现算例<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>从一张合格成图倒推提示词要素。成图要能回答：画面中心是什么、处于什么场景氛围、用什么画法呈现。三问分别对应主体、环境、风格。先逆推风格：材质与画法若不写，模型按训练高频风格补，玻璃质感与水墨两种结果差距最大；再逆推环境：场景层次不写，背景由模型随机填充，主体与背景关系不稳定；最后逆推主体：主角不定，环境与风格无从附着。<\/p>\n<p>表情包场景额外逆推一致性条件：九格同框要求角色长相与画风统一，因此需要角色特征描述固定、背景纯色排除干扰、布局描述固定格数与排列；表情差异由动作情绪承担，而不是靠换场景区分。<\/p>\n<p>逆推链条：成图三问 ← 风格要素 ← 环境要素 ← 主体要素；表情包再加一致性三约束：固定角色特征、纯色背景、网格布局。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，确定主体。主体来自任务要展示的对象：产品、人物、动物、景物。把主体写到可识别程度，必要时补充视角（正视图）、部位（上半身）、数量。<\/p>\n<p>第二步，确定环境。围绕主体想场景：室内或室外、自然或人工、季节天气、光线时段。环境描述给出氛围方向，不堆砌无关景物。<\/p>\n<p>第三步，确定风格。从可识别画法中选：摄影写实、二次元卡通、水墨、玻璃质感、3D 模型质感等。风格词与主体、场景不冲突。<\/p>\n<p>第四步，按“主体 + 环境 + 风格”顺序组织提示词，模型阅读与画面构图都沿此顺序。表情包按“角色 + 动作情绪 + 风格 + 图片布局”组织。<\/p>\n<p>第五步，生成后对照三层检查：主体是否出现且在中心，环境是否符合氛围，风格是否落到材质与画法。哪一层偏差明显，回到对应要素修改，不要整段重写提示词。<\/p>\n<h2>算例<\/h2>\n<p>可复现操作序列（依据 PDF 第 49、52、87 页案例）：<\/p>\n<p>案例 A 风景静物： 输入要素：主体“千里江山图”，环境“层叠的山峦”，风格“玻璃质感”。 提示词：千里江山图，层叠的山峦，玻璃质感。 界面选择：图片生成，模型图片 3.1（书中案例选择），比例 16:9，提交生成。 结果检查：山峦层次是否呈现，材质是否为玻璃质感；不满意可再次生成或重新编辑提示词。<\/p>\n<p>案例 B 表情包九宫格： 输入要素：角色“一个熊猫，脸部特征，上半身”；动作情绪“欢乐、生气、悲伤、愤怒、思考、拥抱、奔跑、招手等”；风格“可爱动漫插画风格”；布局“3×3 网格图，纯色背景”。 模型选择图片 3.0，比例 1:1（PDF 第 52 页）。 结果检查：九格角色是否一致，表情是否区分，背景是否纯色。<\/p>\n<p>案例 C 城市宣传尾帧： 提示词方向：武汉城市地标微缩景观，融合黄鹤楼、江汉关大楼，搭配山水云雾意境，呈现“江城风华”氛围；风格与效果为精致模型质感，光影温暖，古今建筑交融，营造庄重、富有历史底蕴的视觉效果（PDF 第 87 页，书中版本）。 模型图片 3.1，比例 3:2。<\/p>\n<p>量级与对比：单组生成通常一次出 4 张候选（书中再次生成基于原提示词重新生成 4 张全新图片，PDF 第 50 页）；挑选时间随候选数量增加。对比三层缺项：只写主体时，环境与风格随机，4 张候选可能方向分散；三层齐全后，候选之间差异主要在细节，方向一致。<\/p>\n<h2>补充推演：三层要素在画面生成中的分工<\/h2>\n<p>图像模型把提示词中的名词性短语分配到不同生成通道：主体通道决定中心对象的轮廓与位置，环境通道决定背景层次与氛围，风格通道决定材质、笔触与光影处理。三层各有对应通道，缺哪个通道，哪个部分由模型按默认值填充。<\/p>\n<p>逐层推演画面落点。主体不明确时，模型挑常见对象填充中心，画面主角与任务意图不符；环境不明确时，背景取与主体最常见搭配的场景，氛围无法定制；风格不明确时，材质画法取模型高频默认，同一句提示在不同候选间画法摇摆。三层齐全后，主体位置、背景氛围、材质画法都有依据，候选之间差异集中在细节而非方向。<\/p>\n<p>要素冲突的识别方法。检查提示词时看三层是否互相拉扯：主体是写实人物，风格写卡通，两个通道信号矛盾，生成结果在两种画法之间折中；环境写深夜室内，风格写明亮日光，光线信号冲突。冲突不会报错，只会表现为画面不自然。修改时先消除冲突，再补细节。<\/p>\n<p>表情包一致性机制再展开。九格同框要解决两个问题：每格表情不同，角色与画风统一。角色特征描述固定长相，风格描述固定画法，纯色背景排除场景干扰，布局描述固定格数排列；动作情绪承担格间差异。若把环境场景写进每格，背景变化会分散对表情的识别，也增加格间不一致概率。<\/p>\n<p>与文字提示词的映射对照。背景定位在图像侧拆成主体与环境：对象是谁、处于什么语境；要求细化对应风格与布局；目标明确在图像侧常落到比例与用途（见 c05）。文字约束章节与措辞，图像约束对象、场景、画法，映射关系一致但要素名称不同。<\/p>\n<h2>提示词逐层检查清单<\/h2>\n<p>生成前按三层过一遍提示词。主体层：画面主角是否明确，视角、部位、数量是否写清；主体模糊时先补主体。环境层：场景、氛围、光线方向是否交代；环境空缺会导致背景随机。风格层：画法是否为可识别风格词，与主体环境是否冲突；风格空缺或冲突时先修风格。<\/p>\n<p>不同品类的要素增减。风景静物：主体加环境为主，风格定材质画法。角色写真：主体补脸部特征、视角、服饰，环境定场景氛围。海报画面：在三层之外补文案位置、色彩倾向与构图布局（见 c05 比例配对）。表情包：环境替换为动作情绪，补布局与背景约束。<\/p>\n<p>候选挑图对照三层。四张候选逐张检查：主体是否出现且居中，环境是否符合氛围，风格是否落到材质。偏差集中在同一层时，修改该层提示词后重新生成；三层都有偏差，先补最缺的一层。提示词修改记录与对应候选保留，便于对比哪一层调整见效。<\/p>\n<h2>边界补充<\/h2>\n<p>三层提示词约束的是画面方向，不保证主体长相与产品外观精确一致；这类需求要结合参考图（见 c06）。风格词必须可识别，“好看、高级、氛围感”没有对应画法，模型无法落到材质处理。提示词要素之间不能冲突：写实人物配卡通风格、室内场景配日光描述，都会让生成在两套信号间折中。<\/p>\n<p>多层画面（海报、信息图）三层之外还要补构图与布局；纯单主体图三层已够。多主体场景要写清相互位置关系，否则主体排布由模型随机安排。提示词写完先按三层归类检查，归不进任何一层的描述再判断属于布局还是参数需求。<\/p>\n<h2>与相邻概念的衔接<\/h2>\n<p>三层提示词写好后，模型与比例配对见 c05；需要跨画面锁定主体与风格时，进入 c06 的首尾帧与参考图流程。工作流出图时，三层要素由策略师节点整理成提示词变量，交给图像生成节点，提示词结构不变，只是交接方式从对话输入变为变量传递。<\/p>\n<h2>第二算例：课程头像的三层提示词（换任务：从风景静物与表情包换到人物头像写真）<\/h2>\n<p>任务背景：为一门线上课程做方形头像，画面要在小尺寸下仍能认出角色形象。与 A 阶段风景图不同，主体是人，需要补脸部特征、视角与服饰；与表情包不同，单格画面不需要布局约束。<\/p>\n<p>步骤序列：<\/p>\n<ol><li>\n主体层：写清“一位年轻女生，上半身，短发，微笑，正面视角”。视角与部位补到可识别程度；不写正视图时，模型可能给侧脸或全身构图，头像裁切后主体位置不稳。\n<\/li><li>\n环境层：写“纯色浅灰背景，光线柔和均匀”。头像用途要求背景不抢主体；不写环境，模型按人像常见搭配补室内或街景，小尺寸下背景元素分散注意力。\n<\/li><li>\n风格层：选“二次元卡通插画风格”，与主体和背景不冲突。风格词用可识别画法，不写“好看、高级”。\n<\/li><li>\n组织提示词：按主体 + 环境 + 风格顺序连成一句；进图片生成界面，比例选 1:1（头像用途，见 c05），提交生成一组候选。\n<\/li><li>\n挑图按三层核对：主体是否正面上半身、特征稳定；背景是否纯色干净；画法是否为卡通插画。哪一层偏差明显，只改对应层要素后重新生成，不整段重写。\n<\/ol>\n<p>判断依据与回退：四张候选角色长相不一，主体层特征描述不够固定，补发型、脸型等可见特征；背景杂乱，回环境层删场景元素；画法在卡通与写实之间摇摆，回风格层把风格词写明确。这一步不做会怎样：三层缺环境，四张候选背景方向分散；风格用感觉词，材质画法在候选间摇摆；不按用途定比例，头像放进方形展示位后主体被裁。<\/p>\n<h2>延伸推演：三层提示词成立的三个前置子条件<\/h2>\n<p>三层能约束画面方向，依赖三个子条件先成立。<\/p>\n<p>子条件一：风格词对应可识别画法。模型把风格词分配到材质与笔触通道；“好看、高级、氛围感”没有对应画法，通道收窄失败。去掉这个子条件，风格层空缺，材质按模型高频默认填充，同一句提示在不同候选间画法摇摆。<\/p>\n<p>子条件二：三层要素之间不冲突。主体、环境、风格各自信号要一致；写实人物配卡通风格、室内深夜配明亮日光，两个通道信号互相拉扯。去掉这个子条件，画面在两套信号之间折中，表现为不自然，但界面不报错。<\/p>\n<p>子条件三：用途已知，构图与布局需求可判断。单主体图三层已够；海报、信息图还要补文案位置与色彩倾向；多主体场景要写相互位置。去掉这个子条件，主体排布与文案位置由模型随机安排，多层画面返工集中在构图。<\/p>\n<p>三个子条件对应三层的生效前提：风格可辨、信号一致、用途明确。生成前先按三层归类检查提示词，归不进任何一层的描述再判断属于布局还是参数需求（参数配对见 c05）。<\/p>\n<h2>对抗性追问：AI 生图能不能保证商用无风险<\/h2>\n<p>读者反驳：提示词三层写好、挑出满意候选，这张图是否可以直接用于对外发布的商品或宣传物料。<\/p>\n<p>手册写了什么：第 3–6 章讲文生图、图生图、参考图与视频衔接的操作方法（PDF 第 46–89 页），案例用于课程配图、表情包、产品与城市宣传演示；手册未展开生成图片的版权归属、肖像授权与商用范围条款。<\/p>\n<p>补充判断（手册未展开）：本手册操作流程不覆盖商用合规判断。能否商用，要核对所用平台当时的用户协议、生成内容授权条款，以及图中是否出现可识别人物形象、受保护 IP 元素；这些属于法律与平台规则层面的核对，不靠提示词三层解决。判据：用于公开商用物料前，先确认平台授权条款覆盖该用途；涉及人物形象的，另行核对肖像授权；提示词与生成记录留存备查。手册案例中的产品、地标名称为演示素材，不构成对商用结果的保证。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n提示词中主体、环境、风格三类要素能否逐词归类？有没有哪类缺失？\n<\/li><li>\n风格词是否为可识别画法，还是“好看、高级”这类不可辨描述？\n<\/li><li>\n主体、环境、风格之间有没有冲突（如写实人物配卡通风格）？\n<\/li><li>\n多格画面是否写了布局约束与背景处理？角色一致性靠哪一句固定？\n<\/li><li>\n生成结果偏差主要出在哪一层？修改时应调整哪一类要素？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "图像提示的三层结构：主体—环境—风格"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.50<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">图像提示的三层结构：主体—环境—风格<\/a><\/span><\/div><h1>模型分工与图片参数：模型选择、比例、再次生成与重新编辑<\/h1>\n<ul><li>\n<strong>难度<\/strong>：中级 | <strong>涉及章节<\/strong>：第 2 章 | <strong>原书位置<\/strong>：第 3.1 节模型选择与比例（PDF 第 50 页）、再次生成与重新编辑（PDF 第 50 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>文生图结果不合预期时，常见误判是提示词不够长，于是继续堆叠形容词；实际另一个常被忽略的原因是模型与参数配对错误：含文字海报选了偏表现的模型，字形容易变形；写真质感任务选了偏文字的模型，光影层次不够。模型侧的分工、画幅比例、生成后的两种修正路径，都需要按任务类型先判断，再动手调提示词。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>模型选择<\/strong>：书中把图片模型按任务侧重分工（PDF 第 50 页，书中版本，模型名单可能已更新）。<\/p>\n<p>图片 4.0：面向图片二次创作。适用场景包括修改画面风格（如实况风转为水墨风）、增删元素（添加物体、移除背景）、多图保持角色一致、多图合成（书中说明目前支持 6 张图片）。核心优势在对图像的精细化处理与重构，能基于参考图片做复杂调整。<\/p>\n<p>图片 3.1：面向生成图片或换脸写真。核心竞争力是画面表现力，场景细节、光影层次、元素质感更鲜活，山水、人像、概念设计等内容呈现更生动。<\/p>\n<p>图片 3.0：面向包含文字的图片，如带标语的海报、有标题的配图。关键优势是文字识别与呈现精度更高，能有效避免文字变形、错漏。<\/p>\n<p><strong>图片比例<\/strong>：生成画面的宽高比。书中给出：16:9 适合生成计算机壁纸；1:1 适合头像；3:4 适合竖版海报；9:16 适合手机壁纸。选择特定比例后，尺寸输入会被比例约束，无法输入任意尺寸（PDF 第 50 页）。<\/p>\n<p><strong>再次生成<\/strong>：基于原有提示词重新生成一组全新图片。提示词未改，换的是采样结果。<\/p>\n<p><strong>重新编辑<\/strong>：手动编辑提示词，或借助豆包等 AI 助手继续优化提示词后再生成。改的是输入条件（PDF 第 50 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>模型分工的机制是不同模型在训练与优化中侧重的环节不同：二次创作类任务要求理解参考图结构并做局部重构，写真类任务要求材质与光影表现，含文字类任务要求字形识别与排布。按最容易出错的环节选模型，就是把模型侧重对准任务风险点。<\/p>\n<p>比例约束的机制：画幅方向决定构图空间分布。横版适合宽场景并排展开，方图适合单主体居中，竖版适合上下分层内容；选定比例后，宽高输入被锁定在该比例附近，模型按该画幅组织主体位置。<\/p>\n<p>两种修正路径的差别在输入条件是否改变。再次生成不改提示词，偏差来自采样随机性，同方向多抽几张可挑到更好结果；重新编辑改提示词，偏差来自输入要素缺失或冲突，必须先补要素再生成。判断路径的依据：现有提示词方向正确、只是结果随机波动，走再次生成；方向本身有偏差，走重新编辑。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>模型选择先看画面要解决的核心问题：在已有图上改，走 4.0；出写真表现，走 3.1；画面带文字，走 3.0。比例先看发布位置：电脑壁纸、头像、竖版海报、手机壁纸各对应一个比例。<\/p>\n<p>边界有三条。第一，模型分工不是绝对壁垒：书中也说明不同模型侧重区别没有那么大，并非不能更改，用擅长改图的 4.0 生成海报、用侧重文案的 3.0 制作表情包都可尝试；不确定时可选最新版本模型（PDF 第 52 页）。第二，比例选错后裁切会损失主体或文案位置，发布前按用途定比例。第三，再次生成不能修正提示词方向性错误；方向错时重复生成只会得到同类偏差结果。<\/p>\n<h3>反例<\/h3>\n<p>反例一：含标语海报选 3.1。文字呈现不是该模型侧重，标语变形错漏概率上升，后期修字工作量超过一开始选 3.0。 反例二：竖版海报生成时用 16:9。画幅横宽，排上下分层海报时主体与文案位置拥挤，裁切后内容被切。 反例三：提示词方向错了却连续点再次生成。采样结果围绕错误输入展开，多抽几轮仍偏离预期。<\/p>\n<h2>辨析<\/h2>\n<p>模型与风格词的差别：模型分工是界面选项，风格（水墨、写实、卡通等）写在提示词里；模型决定侧重环节，风格词决定画面画法，二者不互相替代。<\/p>\n<p>比例与分辨率的差别：比例是宽高方向，宽高数值是画幅尺寸；比例选定后尺寸输入受约束，画面清晰度另由模型与生成质量决定。<\/p>\n<p>再次生成与重新编辑的差别：前者输入不变、重新采样；后者输入修改、再行生成。两者可组合：先重新编辑提示词，再多次再次生成挑选。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：图像提示三层（c04）。后继：首尾帧一致性（c06）中尾帧与首帧按写真表现选 3.1，视频衔接选视频 3.0（PDF 第 83、85 页）；工作流视觉设计师节点选 Seedream 4.0、9:16、宽 1440 高 2560、最多 4 张（PDF 第 217 页），是模型与参数配对在自动化链路中的复用。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（模型分工与图片参数：模型选择、比例、再次生成与重新编辑）<\/summary><div class=\"depth-body\"><h1>c05 深度片段：模型与参数配对的依赖链、推导与可复现算例<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>从最终发布画面倒推参数选择。发布位置先定画幅方向：壁纸、头像、海报、手机屏各有标准比例，比例错了裁切损失内容。再倒推画面风险点：二次创作最怕结构改不动，写真最怕质感不够，含文字图最怕字形错漏；风险点对应模型侧重。最后倒推修正路径：结果偏差是随机波动还是方向错误，决定再次生成还是重新编辑。<\/p>\n<p>逆推链条：发布位置 ← 比例选择；画面风险点 ← 模型选择；偏差类型 ← 修正路径。提示词三层要素（c04）在参数之前确定，参数不补内容要素。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，判断任务类型。检查输入是否已有参考图：有参考图要改风格、加删元素、保持角色或合成，归二次创作；无参考图要出写真或场景表现，归画面表现；画面包含标语、标题文字，归含文字类型。<\/p>\n<p>第二步，按类型选模型。二次创作选图片 4.0，调用其精细化处理与重构能力；写真表现选图片 3.1，调用细节、光影与质感；含文字选图片 3.0，调用文字识别与呈现精度。<\/p>\n<p>第三步，按发布位置选比例。电脑壁纸 16:9，头像 1:1，竖版海报 3:4，手机壁纸 9:16。比例选定后宽高输入受约束，不再填任意尺寸。<\/p>\n<p>第四步，生成并挑图。每组候选生成后检查：任务风险点是否消除（角色是否保持、质感是否到位、文字是否正确），主体与构图是否落在画幅内。<\/p>\n<p>第五步，按偏差类型选修正路径。提示词方向正确、个别候选有随机波动，再次生成换采样；方向或要素有偏差，重新编辑提示词（可借助 AI 助手优化），再生成。<\/p>\n<h2>算例<\/h2>\n<p>可复现操作序列（依据 PDF 第 50、52、83、217 页）：<\/p>\n<p>算例 A 含文字海报： 任务：带活动标语的竖版海报。 参数配对：模型图片 3.0（文字呈现），比例 3:4（竖版海报）。 提示词按三层写主体、环境、风格，标语文字写入提示词。 检查点：标语字形是否正确无变形，竖版构图是否完整。<\/p>\n<p>算例 B 写真产品图： 任务：产品置于花朵中的正视图尾帧图。 参数配对：模型图片 3.1（画面表现），比例 16:9（PDF 第 83 页）。 检查点：产品质感、花瓣层次、光影是否鲜活。<\/p>\n<p>算例 C 表情包： 任务：九格表情，1:1。 参数配对：书中案例选图片 3.0，比例 1:1，提示词含 3×3 网格与纯色背景（PDF 第 52 页）；不确定模型分工时可选最新版本。<\/p>\n<p>算例 D 工作流出图： 节点：视觉设计师；模型 Seedream 4.0；比例 9:16；宽 1440、高 2560；最多生成 4 张（PDF 第 217 页，书中版本）。<\/p>\n<p>量级对比：一次生成一组候选，书中再次生成基于原提示词重新生成 4 张全新图片；模型与比例在单次任务内选定后不必反复切换。参数配对错误的返工成本：含文字图选错模型后修字，写真图选错模型后重抽质感，均高于一开始选对模型的成本。<\/p>\n<h2>补充推演：任务风险点与模型侧重的配对逻辑<\/h2>\n<p>选模型的依据不是模型名气，而是任务最容易出错的环节。把三类任务的失败形态拆开看。二次创作类失败表现为参考图结构改不动、元素增减不干净、多图角色走样；这类任务要求模型理解参考图结构并做局部重构，对应图片 4.0 的精细化处理与重构能力。写真表现类失败表现为材质平、光影灰、元素塑料感；要求模型在细节层次与质感上发力，对应图片 3.1。含文字类失败表现为字形变形、错字漏字；要求模型识别文字并按版式呈现，对应图片 3.0。<\/p>\n<p>配对顺序推演。先判断失败高发环节，再找侧重该环节的模型；反过来先选模型再找任务，容易把模型长处用不到风险点上。书中也说明模型侧重不是绝对壁垒，跨类尝试可行，但任务风险点明确时，按侧重配对能降低返工概率。<\/p>\n<p>比例与构图的关系推演。画幅方向决定主体可摆放的空间：横版适合宽场景并排，方图适合单主体居中，竖版适合上下分层。比例选错后，模型在错误画幅里安排构图，裁切时主体、文字或边缘景物容易被切；生成前按发布位置定比例，比生成后裁切成本低。<\/p>\n<p>两种修正路径的判定推演。区分随机波动与方向偏差：提示词要素齐全、模型比例配对正确，个别候选仍有差异，属采样随机，再次生成换一组候选即可；提示词缺要素、要素冲突或模型配对错，候选整体偏离方向，重复采样只会围绕错误输入出图，必须重新编辑提示词或改模型。判定依据是看偏差是否在所有候选上重复出现：普遍出现的偏差改输入，个别候选的偏差换采样。<\/p>\n<p>参数与提示词的分工。模型与比例是界面参数，不补充画面要素；提示词三层负责画什么。参数配对不能替代提示词构造，反过来提示词再完整，模型侧重与画幅错配仍会在风险点上失败。<\/p>\n<h2>参数配对检查单<\/h2>\n<p>接到出图任务先填两项判断。任务类型：是改已有图、出写真表现、还是做含文字画面；发布位置：壁纸、头像、海报、手机屏。两项分别对应模型与比例，判断顺序先模型后比例。<\/p>\n<p>模型核对：二次创作（改风格、增删元素、多图保持角色、多图合成）选 4.0；写真与人景物质感选 3.1；标语标题文字选 3.0；分工不确定时可选最新版本模型。比例核对：16:9 横版壁纸，1:1 方图头像表情包，3:4 竖版海报，9:16 手机壁纸。<\/p>\n<p>生成后修正路径判断。浏览候选：偏差在所有候选上重复，提示词或模型配对有问题，走重新编辑；个别候选偏差，提示词方向可用，走再次生成。重新编辑可借助 AI 助手优化提示词；改完提示词后再次生成多组候选挑选。<\/p>\n<p>参数记录习惯。同一类任务把模型与比例组合固定下来，下次直接沿用；换任务类型时先复核模型分工，不沿用上一次参数。多图合成时核对参考图数量是否在模型支持范围内（书中说明目前支持 6 张图片）。<\/p>\n<h2>边界补充<\/h2>\n<p>模型分工是书中版本的侧重归纳，界面模型名单会随版本更新；跨类尝试可行，风险点明确时再按侧重配对。比例只定宽高方向，清晰度与画质由模型与生成质量决定，不在比例选项内调整。再次生成不改提示词，不能修正方向性错误；重新编辑改输入条件，改完仍需多次生成挑选。参数配对与提示词构造缺一不可：提示词缺要素时换模型补不回来，模型错配时提示词再完整也在风险点上失分。<\/p>\n<h2>与相邻概念的衔接<\/h2>\n<p>模型与比例配对结果在首尾帧流程（c06）中复用：尾帧首帧按写真表现选 3.1，视频衔接选视频模型；工作流视觉设计师节点把模型、比例、尺寸、生成数量固定为节点参数，不再每次对话选择。<\/p>\n<h2>第二算例：二次创作：实拍静物转水墨风并调整元素（换任务：从写真与含文字图换到改图合成）<\/h2>\n<p>任务背景：已有一张实拍桌面静物照片，需要改成水墨风格并移除画面边缘杂物，用于系列配图。与 A 阶段出写真、出海报不同，这次输入是已有参考图，动作是改风格与增删元素。<\/p>\n<p>步骤序列：<\/p>\n<ol><li>\n判任务类型：输入带参考图，要改风格、增删元素，归二次创作类，核心风险点是参考图结构能不能保住、改动干不干净。\n<\/li><li>\n选模型：二次创作选图片 4.0（PDF 第 50 页，书中版本，模型名单可能已更新）；不按写真质感或文字呈现去配对。\n<\/li><li>\n选比例：成品作为文章横版配图，选 16:9；若后续改做头像再另选 1:1，比例随发布位置定。\n<\/li><li>\n上传参考图，提示词写清保留部分（桌面主体与构图）与改动部分（转为水墨画风、移除边缘杂物），提交生成一组候选。\n<\/li><li>\n挑图核对：主体结构是否与参考图一致，杂物是否移除干净，风格是否落到水墨笔触；偏差在所有候选上重复，回到提示词或模型配对；个别候选偏差，再次生成换采样。\n<\/li><li>\n多图合成分支：若任务是把多张人物图合成同一画面，核对参考图数量在模型支持范围内；书中说明目前支持 6 张图片（PDF 第 50 页），超出数量先拆分批次。\n<\/ol>\n<p>判断依据与回退：主体走样，说明改动幅度超出模型重构能力，回提示词收紧“保留构图”的描述；杂物残留，检查元素删除要求是否写明确；风格没转过来，核对模型是否选成侧重写真的版本。这一步不做会怎样：选错模型去出风格化改图，结构改动不干净，返工集中在反复重抽；不按发布位置选比例，成品进排版时主体或边缘景物被裁；参考图超数量硬传，合成结果缺图或角色走样。<\/p>\n<h2>延伸推演：参数配对成立的三个前置子条件<\/h2>\n<p>模型与比例选对，依赖三个子条件先明确。<\/p>\n<p>子条件一：发布位置已经确定。比例由最终展示位置反推：电脑壁纸、头像、竖版海报、手机屏各有标准方向；位置未定，比例没有依据，只能按感觉选。去掉这个子条件，卡在比例步：生成后裁切损失主体或文案位置，成本高于生成前定比例。<\/p>\n<p>子条件二：任务风险点可识别。要分得清最容易出错的环节是结构重构、质感表现还是文字呈现；风险点不清，模型侧重无从配对。去掉这个子条件，选模型退回到按界面版本顺序挑，长处用不到风险点上。<\/p>\n<p>子条件三：参考图数量与输入形态在支持范围内。多图合成、参考图传入都有数量与形式限制；任务规模超过支持范围，链路在输入环节就卡住。去掉这个子条件，节点或界面报错前无法判断是素材问题还是配置问题。<\/p>\n<p>三个子条件对应参数链的三步：位置定比例、风险点定模型、输入形态定可行性。参数是界面选项，不补充画面要素；提示词三层（c04）在参数之前确定，两者分工不混用。<\/p>\n<h2>对抗性追问：模型分工归纳半年后还成立吗<\/h2>\n<p>读者反驳：模型版本更新很快，按 4.0 / 3.1 / 3.0 的侧重分工选模型，过几个月名单和强项一变，这套配对表是否就失效。<\/p>\n<p>手册写了什么：书中按当时界面把图片模型分成二次创作、写真表现、含文字三类侧重（PDF 第 50 页，书中版本，模型名单可能已更新），同时说明分工不是绝对壁垒，跨类尝试可行，不确定时可选最新版本模型（PDF 第 52 页）。<\/p>\n<p>补充判断（手册未展开）：失效的是具体型号与侧重标签，不失效的是配对方法。方法保留为：先找本次任务最容易出错的环节（结构、质感、字形），再到当前界面模型列表里核对各模型说明，选侧重该环节的型号；型号换代后，按风险点重新配对，而不是沿用旧表。判据：每次新任务先复核模型说明页，不沿用上一次任务的型号选择；分工不确定时按手册建议选最新版本模型，再用候选结果反查配对是否合适。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n这个任务的核心风险点是结构重构、质感表现还是文字呈现？对应哪个模型？\n<\/li><li>\n成品最终发布在什么位置？宽高方向是否与比例选项一致？\n<\/li><li>\n现有候选偏差是随机波动还是方向错误？该走再次生成还是重新编辑？\n<\/li><li>\n风格词写在提示词里还是模型选项里？两者是否混淆？\n<\/li><li>\n多图合成时参考图数量是否在模型支持范围内（书中说明目前支持 6 张图片）？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "模型分工与图片参数：模型选择、比例、再次生成与重新编辑"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.82<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">图像提示的三层结构：主体—环境—风格<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">模型分工与图片参数：模型选择、比例、再次生成与重新编辑<\/a><\/span><\/div><h1>首尾帧与参考图约束下的画面一致性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：中级 | <strong>涉及章节<\/strong>：第 2 章 | <strong>原书位置<\/strong>：第 6.3 节产品宣传视频（PDF 第 82–85 页）、第 6.4 节城市宣传视频（PDF 第 87–88 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>图生视频最常见的失败是前后风格跳变：首帧温暖柔和，尾帧冷硬粗糙；或人物、场景在两张图之间对不上，AI 衔接出的过渡画面在两种风格之间变形。原因是首尾两张图各自独立生成时，色调、质感、构图没有被同一基准约束，视频模型只能在两个不一致的端点之间补中间帧。<\/p>\n<p>首尾帧流程要解决的困难是：先定一张视觉基准图，再让另一张图参照基准生成，把一致性问题解决在图片阶段，最后再交给视频生成衔接。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>尾帧图片<\/strong>：视频最终亮相的画面，先作为整个视频的“风格基准”生成。后续所有动作都围绕这个基准展开（PDF 第 82 页）。产品案例尾帧提示词为“正视图，小棕瓶包裹在巨大的花朵中”，模型图片 3.1，比例 16:9（PDF 第 83 页）。<\/p>\n<p><strong>首帧图片<\/strong>：视频第一帧画面。生成时不复凭空找一张风格相近的图，而是复用已生成的尾帧作为参照标准；因为尾帧的色调、质感、构图已经确定，用它作参照生成首帧，能最大程度降低首尾不一致风险（PDF 第 83–84 页）。产品案例首帧提示词为“背景干净，去除产品，花朵闭合为花蕾”；在图片生成界面点【+】上传图片，参考图对话框中选择【智能参考】后保存（PDF 第 84 页，书中版本，界面可能已变）。<\/p>\n<p><strong>首尾帧衔接生成视频<\/strong>：两张风格统一的图片作为首帧与尾帧上传到视频生成，AI 自动识别两图风格关联，生成中间过渡画面，把静态首尾帧串成动态成片（PDF 第 85、88 页）。产品案例提示词“花朵绽放，镜头缓慢推进”，视频 3.0，其他参数保持默认（PDF 第 85 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>一致性问题发生在三个维度：色调、质感、构图。独立生成两张图时，三个维度都由模型随机补，两张图重合概率低。先定尾帧基准，相当于把三个维度固定在一张已验收的图上；首帧生成时把尾帧作为参考图传入，参考机制让首帧在色调、质感、构图上向基准对齐，差异只保留在剧情需要变化的部分（产品有无、花朵开合、城市形态）。<\/p>\n<p>视频生成阶段只负责补过渡。首尾已经一致，中间帧在统一风格内插值；若首尾不一致，视频模型没有额外标准消解两端差异，过渡就会出现风格跳变。流程顺序因此固定为：尾帧基准 → 参考生成首帧 → 视频衔接，而不是两张图各自生成后再找风格接近的配对。<\/p>\n<p>城市案例进一步用统一风格词强化基准：首帧和尾帧使用完全一样的风格提示词“精致模型质感，光影温暖”，相当于提前定好贯穿始终的视觉语言；视频生成有了明确风格参照，避免前半段温暖柔和、后半段冷硬粗糙的割裂感（PDF 第 87 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>首尾帧流程适合需要连贯感的图生视频：产品从花蕾到绽放、城市从无到有、人物动作连续等。只有单张图的静态配图任务，不需要走首尾帧。参考图约束适合主体与风格需要延续的场景；主体动作变化过大、两帧内容差异悬殊时，过渡仍可能不自然。<\/p>\n<p>边界有三条。第一，参考图对齐的是风格与主体特征，不保证剧情逻辑完全合理；动作设计要在提示词中写清。第二，首帧提示词仍需描述起点画面，不能只传参考图不写内容。第三，视频模型与图片模型分工不同，图片阶段未解决的一致性问题，不能指望视频阶段自动修正。<\/p>\n<h3>反例<\/h3>\n<p>反例一：首帧凭空另找一张风格相近的图。两张图在色调、质感、构图上的差异未被约束，过渡段出现割裂。 反例二：先生成首帧再反推尾帧。基准图变成首帧，但首帧剧情状态（如花蕾）承载的信息少于尾帧，基准不完整；书中流程以最终亮相画面为基准。 反例三：首尾帧风格词不一致。一端写温暖柔和，另一端写冷硬粗糙，参考机制也无法把两种材质统一。<\/p>\n<h2>辨析<\/h2>\n<p>与图生图参考编辑的差别：参考图在二次创作中用于改局部或重构画面；首尾帧中参考图用于跨画面锁定一致性，两张图分别承担视频起点与终点。<\/p>\n<p>与纯文生视频的差别：纯文生视频只靠文字描述全程，首尾状态不受控；首尾帧用两张图把端点钉住，文字只描述动作与镜头。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：图像提示三层（c04）、模型与参数配对（c05）。后继：剪映成片流程（c07）把生成的首尾帧视频作为素材导入剪辑；扣子工作流图像生成节点（c10）复用参考图与提示词约定，把策略师输出的提示词交给视觉设计师出图。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（首尾帧与参考图约束下的画面一致性）<\/summary><div class=\"depth-body\"><h1>c06 深度片段：首尾帧一致性的依赖链、推导与可复现算例<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>从一段连贯成片倒推图片阶段条件。成片首尾风格统一，需要首帧与尾帧在色调、质感、构图上对齐。先逆推对齐标准：标准必须先存在于一张已验收的图上，即尾帧基准；再逆推首帧生成方式：首帧不能凭空生成，要把尾帧作为参考图传入；最后逆推视频阶段：两图一致后，视频模型只补过渡，不再承担风格统一职责。<\/p>\n<p>逆推链条：成片连贯 ← 首尾三维度对齐 ← 尾帧基准图 ← 参考图约束首帧 ← 视频衔接。剧情需要变化的部分（产品有无、花朵开合）不纳入对齐范围，对齐的是风格维度。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，定尾帧。先想视频最终亮相画面：产品案例是小棕瓶包裹在巨大花朵中，城市案例是地标微缩景观。尾帧提示词写主体、环境与风格，选图片 3.1 与对应比例，生成后挑一张满意的保存。<\/p>\n<p>第二步，定首帧参照。首帧剧情状态与尾帧不同：产品案例花朵闭合为花蕾、去除产品；城市案例云山雾绕、盆地云雾。把尾帧上传为参考图，选择智能参考；首帧提示词只描述起点画面与统一风格，不另起风格方向。<\/p>\n<p>第三步，统一风格词。城市案例首尾共用“精致模型质感，光影温暖”；产品案例同模型同比例，尾帧质感延伸到首帧。风格词一致是跨画面对齐的显式约束，参考图是隐式约束。<\/p>\n<p>第四步，视频衔接。上传首帧与尾帧，提示词只写动作与镜头（花朵绽放、镜头缓慢推进；延时摄影、镜头环绕），选视频 3.0，其他默认，生成。不满意点再次生成，动作或端点偏差大则回到图片阶段调整。<\/p>\n<p>第五步，检查一致性。回放片段：起点与终点色调是否一致，质感是否连续，中间过渡有无风格跳变；问题出在图片阶段就修首尾帧，出在动作描述就修视频提示词。<\/p>\n<h2>算例<\/h2>\n<p>可复现操作序列（依据 PDF 第 82–85、87–88 页）：<\/p>\n<p>算例 A 产品宣传：<\/p>\n<ol><li>\n尾帧：提示词“正视图，小棕瓶包裹在巨大的花朵中”；图片 3.1；16:9；生成后挑图保存。\n<\/li><li>\n首帧：提示词“背景干净，去除产品，花朵闭合为花蕾”；上传尾帧作参考图，参考图对话框选【智能参考】保存；图片 3.1；16:9；挑图保存。\n<\/li><li>\n视频：视频生成，上传两帧；提示词“花朵绽放，镜头缓慢推进”；视频 3.0；其他默认；生成，不满意再次生成。\n<\/ol>\n<p>算例 B 城市宣传：<\/p>\n<ol><li>\n尾帧：武汉城市地标微缩景观，融合黄鹤楼、江汉关大楼，山水云雾意境，“江城风华”氛围；精致模型质感，光影温暖，古今建筑交融；图片 3.1；3:2。\n<\/li><li>\n首帧：云山雾绕，中间盆地云雾，精致模型质感，光影温暖；图片 3.1；3:2；风格词与尾帧一致。\n<\/li><li>\n视频：提示词“延时摄影，镜头环绕，展现城市从无到有的建设过程，一座座建筑物拔地而起”；视频 3.0；默认参数。\n<\/ol>\n<p>量级：图片阶段各生成一组候选挑选；视频生成等待时间按素材复杂度略有延迟；首尾帧各定一张后再进入视频，避免视频阶段反复重抽。对比反事实：两图各自生成后配对，风格对齐靠运气，过渡跳变概率高；参考约束后，偏差集中在剧情状态，风格维度稳定。<\/p>\n<h2>补充推演：一致性维度与参考机制<\/h2>\n<p>跨画面一致性要对齐的维度可拆成三项：色调（明暗、冷暖倾向）、质感（材质精细度、渲染方式）、构图风格（视角、主体位置关系）。独立生成两张图时，三项都由模型随机补；先定尾帧基准，三项在基准图上固化，首帧通过参考图向基准对齐。剧情需要变化的部分（产品有无、花朵开合、建筑形态）不属于对齐范围，对齐只锁风格维度。<\/p>\n<p>参考机制的作用边界。参考图传递的是视觉参照，不是复制内容；首帧提示词仍要写清起点画面。若只传参考图不写内容，模型可能直接复现尾帧状态，起点剧情无法成立。参考强度由界面选项控制（书中案例为【智能参考】，书中版本，界面可能已变），起点与终点剧情差异大时，参考对齐的是风格而非物体位置。<\/p>\n<p>为什么基准选尾帧。尾帧是最终亮相画面，承载完整产品形态或最终场景，信息最完整；以完整状态为基准，往回推起点更容易约束范围。若以首帧为基准，首帧花蕾或初建场景信息少，基准缺质感与构图参照，尾帧生成时对齐依据不足。<\/p>\n<p>视频阶段的职责边界。首尾一致后，视频模型负责在两端之间补过渡帧与动作衔接；它不承担重新统一风格的职责。若图片阶段遗留风格差异，视频过渡会在两端之间插值出中间风格，表现为跳变。因此一致性问题必须在图片阶段解决，不留给视频阶段修正。<\/p>\n<p>风格词共用的推演。城市案例首尾共用“精致模型质感，光影温暖”，显式写出贯穿全程的视觉语言；参考图是隐式参照，共用风格词是显式约束，两者叠加降低两端偏差。首尾风格词不一致时，参考机制无法把两套材质强行统一，过渡割裂感会保留到成片。<\/p>\n<h2>流程卡点与回放检查<\/h2>\n<p>卡点一：首帧生成时忘记上传尾帧作参考。首帧独立生成后风格随机，再与尾帧配对已经晚了；应在首帧生成前完成参考图上传与参考方式选择。卡点二：首尾风格词各写一套。两端风格描述不一致，参考对齐失去显式依据；同一视频的首尾共用风格表述。卡点三：视频提示词写风格要求。风格约束应留在图片阶段，视频提示词只写动作与镜头，重复风格描述反而可能干扰过渡。<\/p>\n<p>回放检查按三段看：起点帧是否符合剧情初始状态，终点帧是否为最终亮相画面，中间过渡是否连续无跳变。跳变发生在两端之间，回图片阶段核对首尾一致性；动作不连贯，回视频提示词调整镜头描述。<\/p>\n<p>适用场景边界。首尾帧流程适合起点终点都能用图片固定的片段；纯氛围转场、无明确端点的画面，可直接文生视频。两帧剧情差异过大时，过渡自然度受模型衔接能力限制，必要时拆成多段分别生成。<\/p>\n<h2>与相邻概念的衔接<\/h2>\n<p>首尾帧产出的图片与视频作为素材进入剪映成片流程（c07）：画面一致性在图像阶段解决，剪辑阶段不再承担风格统一。参考图约束的思路与扣子知识库参照私有资料回答同构：都先用固定基准约束生成范围，再在基准内补变化内容。<\/p>\n<p>流程记录建议：尾帧提示词、首帧提示词、参考图方式、视频提示词分别留存，复做同类短片时替换主体与动作描述即可；风格词沿用上一版基准，保证系列短片视觉统一。<\/p>\n<h2>第二算例：独立配图配对失败后的回退重做（换任务：从正向首尾帧流程换到失败恢复演练）<\/h2>\n<p>任务背景：一段产品短片先分别生成了起点图与终点图，各自挑图后直接上传视频衔接，回放发现两段色调一暖一冷、质感粗细不一，过渡处有明显跳变。本算例走的是发现问题后回到图片阶段重做的分支，与 A 阶段直接定首尾帧的正向流程不同。<\/p>\n<p>步骤序列：<\/p>\n<ol><li>\n定位跳变维度：回放拆三段看——起点帧、终点帧、中间过渡。跳变在两端之间，先核对两张图片的色调（明暗冷暖）、质感（材质精细度）、构图风格（视角与主体位置）哪几项不一致；动作不连贯另归视频提示词问题。\n<\/li><li>\n保留已验收的终点图作为基准。终点图是最终亮相画面，信息最完整；若终点图本身不满意，先重出尾帧并挑定，再往下走。\n<\/li><li>\n重做首帧：把尾帧上传为参考图，参考方式选【智能参考】（PDF 第 84 页，书中版本，界面可能已变）；首帧提示词只描述起点剧情状态与共用风格，不另起一套风格方向。\n<\/li><li>\n核对共用风格词：首尾两段提示词里的风格表述写成同一句；参考图是隐式参照，共用风格词是显式约束，两者叠加。\n<\/li><li>\n重新进入视频衔接：上传新首帧与尾帧，视频提示词只写动作与镜头，不重复风格要求；生成后回放，确认跳变消除再保留。\n<\/li><li>\n回退判断：重做后首帧剧情状态不对，检查首帧提示词是否误写成尾帧内容；风格仍割裂，核对两端风格词是否一致；过渡动作不连贯，回视频提示词调整镜头描述。\n<\/ol>\n<p>这一步不做会怎样：跳过回退、在视频阶段反复重新生成，两端风格差异仍在，视频模型只能在两套材质之间插值，跳变保留到成片；只传参考图不写起点剧情，模型直接复现尾帧状态，起点剧情不成立。<\/p>\n<h2>延伸推演：跨画面对齐成立的四个前置子条件<\/h2>\n<p>首尾帧流程能锁住风格，依赖四个子条件先成立。<\/p>\n<p>子条件一：基准图已经验收。尾帧承载完整产品形态或最终场景，先挑定一张满意的保存；基准未验收就推首帧，首帧对齐到一张还要改的图上，两端一起返工。去掉这个子条件，基准环节空转，后续对齐没有固定参照。<\/p>\n<p>子条件二：首帧提示词只写起点剧情。参考图传递视觉参照，不复制内容；起点画面要由提示词写清。去掉这个子条件，模型可能直接复现尾帧状态，剧情起点无法成立。<\/p>\n<p>子条件三：首尾风格词共用。同一视频两端用同一套材质与光影表述；风格词各写一套，参考机制无法把两套材质强行统一。去掉这个子条件，过渡割裂感保留到成片。<\/p>\n<p>子条件四：一致性问题在图片阶段解决。视频模型只补过渡帧与动作衔接，不承担重新统一风格的职责；图片阶段遗留差异，过渡会在两端之间插值出中间风格。去掉这个子条件，把风格问题留给视频阶段修正，返工距离拉长到整条短片。<\/p>\n<p>四个子条件对应一致性链的四步：基准验收、起点写清、风格共用、阶段归位。剧情需要变化的部分（产品有无、花朵开合、建筑形态）不纳入对齐范围，对齐只锁风格维度。<\/p>\n<h2>对抗性追问：做好首尾帧，是否还需要剪辑阶段精修<\/h2>\n<p>读者反驳：首尾风格已经在图片阶段统一，视频衔接自动生成，成片是否可以直接导出，不用再进剪辑环节调整。<\/p>\n<p>手册写了什么：第 6 章讲首尾帧与视频衔接生成（PDF 第 82–88 页）；第 7–8 章另设成片流程与字幕、口播、包装环节（PDF 第 90–119 页）。两章分工是图像阶段解决画面一致性，剪辑阶段解决节奏、字幕、配音、音乐与导出。<\/p>\n<p>补充判断（手册未展开）：首尾帧统一的是两端风格，不覆盖成片其余判断。判据分三类：画面一致性问题回图片阶段；节奏、镜头取舍、字幕校对、配音与音乐匹配归剪辑阶段；两类问题不互相替代。纯氛围转场、无明确端点的画面可直接文生视频，不套首尾帧流程；两帧剧情差异过大时，过渡自然度受模型衔接能力限制，必要时拆成多段分别生成，再在剪辑阶段拼接。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n哪张图作为风格基准？为什么选最终亮相画面而不是首帧？\n<\/li><li>\n首帧提示词描述的是起点剧情还是新风格？风格是否与尾帧共用表述？\n<\/li><li>\n参考图方式在界面中如何选择（书中为【智能参考】，书中版本，界面可能已变）？\n<\/li><li>\n视频提示词是否只写动作与镜头，把风格约束留在图片阶段？\n<\/li><li>\n回放时风格跳变出现在哪一段？应修首尾帧还是修视频提示词？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "首尾帧与参考图约束下的画面一致性"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.94<\/div><h1>成片流程：素材—文案—画面—配音—音乐—导出的顺序决策<\/h1>\n<ul><li>\n<strong>难度<\/strong>：中级 | <strong>涉及章节<\/strong>：第 3 章 | <strong>原书位置<\/strong>：第 7.1 节企业宣传模板（PDF 第 90–93 页）、第 7.2 节 AI 文字成片（PDF 第 94–97 页）、第 7.3 节营销成片（PDF 第 98–102 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>新手做视频容易一上来就挑音乐、加特效，结果文案改了、素材换了，前面配好的音乐与包装全部作废。视频是一条时间轴上的流水工序：后面环节依赖前面环节的产物，顺序错了，返工不是局部调整，而是整条链倒回上游重做。成片流程要解决的困难是：判断先做什么、后做什么，每条路径的输入是什么、产出什么，哪一步依赖哪一步。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>书中第 7 章给出三条成片路径，共同骨架是内容先行、包装在后。<\/p>\n<p><strong>模板替换路径<\/strong>：在现成模板基础上替换素材与文字，沿用模板已有的节奏、转场与配乐。输入是模板加替换素材与文案，产出是套模板完成的企业宣传片（PDF 第 90–93 页，书中版本，界面可能已变）。<\/p>\n<p><strong>AI 文字成片路径<\/strong>：输入讲稿文本。流程为粘贴讲稿 → 设定画面内容与来源 → 挑选配音音色并调速音量 → 匹配背景音乐 → 生成视频 → 导出（PDF 第 95–97 页）。画面选项卡选素材来源，无现成素材时用在线素材库由 AI 按讲稿匹配；比例按发布平台选，教学视频常用 16:9。配音选项卡挑主播音色（如知性女声），调语速音量。音乐选项卡新手选智能推荐，AI 按文稿内容与音色匹配背景音乐。<\/p>\n<p><strong>营销成片路径<\/strong>：导入产品视频素材，填写产品名称与要点；AI 自动创作文案、匹配素材并完成剪辑，产出卖点清晰的带货短视频（PDF 第 98–102 页）。<\/p>\n<p><strong>导出<\/strong>：确认细节后在导出对话框重命名文件、选择保存格式，再导出成片（PDF 第 97、102 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>工序依赖从时间轴倒推。最终成片包含画面、配音、字幕、音乐；配音与字幕依赖讲稿或口播文本，画面分段依赖文稿内容，音乐情绪依赖文稿与音色。因此内容（素材或文案）必须最先确定。<\/p>\n<p>正向推演文字成片链：讲稿未定，画面分段没有依据；画面未定，配音节奏无法贴合分段；配音未定，音乐情绪没有参照；音乐配好后再改讲稿，三段都要重排。顺序定为讲稿 → 画面 → 配音 → 音乐 → 生成 → 导出，每一步输入来自上一步产物。<\/p>\n<p>模板路径的依赖方向相同：模板已固定节奏与配乐，替换素材与文字必须先对齐模板段落；先替换哪段素材、文案对应哪个画面位，是在模板骨架内填空。营销成片路径把文案创作交给 AI，但产品素材与要点仍是上游输入，素材与要点不齐，AI 生成的卖点文案没有依据。<\/p>\n<p>返工成本沿链条放大：上游改动影响下游全部产物。讲稿在配音之后改动，配音要重录或重选，音乐要重配，已生成的画面匹配要重做；越靠后发现内容问题，回退距离越长。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>三条路径按手头输入选择：有模板可套走模板路径；只有讲稿文本走文字成片；有实拍产品素材走营销成片。流程顺序适用于口播、教学、带货等常规短视频；纯氛围短片无文案时，画面与音乐顺序可按创作需要调整。<\/p>\n<p>边界有三条。第一，AI 生成不替代最终确认：生成后仍要检查画面匹配、音色、音乐与字幕，不满意回到对应环节调整。第二，模板路径受模板结构限制，素材与文案要适配模板段落，不能任意扩展。第三，导出参数（命名、格式）在最后一步处理，提前导出会把未完成版本固化。<\/p>\n<h3>反例<\/h3>\n<p>反例一：先选背景音乐再写讲稿。音乐情绪没有文稿依据，讲稿调整后音乐需重配，配音与画面跟着重排。 反例二：跳过内容梳理直接进精剪。素材中冗余片段未剔除，精剪阶段在大量片段中取舍，时间轴负担加重。 反例三：生成后不检查直接导出。画面错配、音色不当、字幕遗漏随成片导出，回看时需回到对应工序重做。<\/p>\n<h2>辨析<\/h2>\n<p>模板替换与文字成片的差别：模板路径骨架由模板给定，填空为主；文字成片骨架由讲稿分段生成，画面与配音由 AI 匹配。输入分别是素材加模板、讲稿文本。<\/p>\n<p>流程顺序与后期包装的差别：本章流程解决内容工序顺序；第 8 章字幕、口播粗剪、数字人属于成片后的包装与精修环节，位置在生成之后、导出之前。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：无强前置，但文案质量依赖提示词方法（c01、c03）。后继：字幕与口播对齐成本（c08）接在成片生成之后；素材上游来自即梦生成的图片视频（c06）；成片分发对应飞书协同与分享（c09）。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（成片流程：素材—文案—画面—配音—音乐—导出的顺序决策）<\/summary><div class=\"depth-body\"><h1>c07 深度片段：成片工序依赖链、推导与可复现算例<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>从导出成片倒推工序。成片 = 画面 + 配音 + 字幕 + 音乐。字幕与配音都挂在语音或讲稿文本上，画面分段挂在文稿结构上，音乐情绪挂在文稿与音色上。逆推：音乐 ← 配音 ← 画面分段 ← 讲稿/素材要点。再逆推：讲稿或素材要点是整条链最上游，必须先定。<\/p>\n<p>三条路径的输入差异：模板路径上游是模板骨架加替换素材；文字成片上游是讲稿；营销成片上游是实拍素材加产品要点。共同下游是生成与导出。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，判定手头输入。有可套用模板 → 模板路径；只有文本讲稿 → 文字成片；有实拍素材与卖点 → 营销成片。判定依据是上游已有产物，不凭偏好选路径。<\/p>\n<p>第二步，走文字成片链推演。粘贴讲稿后，画面选项卡定素材来源与比例；配音选项卡定音色、语速、音量；音乐选项卡定推荐方式；生成后 AI 自动分镜、画面匹配、音频与字幕生成；最后导出。每步检查上游产物是否就位：讲稿分段不清，先补讲稿；素材来源未定，不进配音。<\/p>\n<p>第三步，走模板链推演。打开模板后逐段替换素材与文字，替换内容对齐模板画面位；模板自带节奏、转场、配乐，不另起结构。<\/p>\n<p>第四步，走营销成片链推演。导入产品素材，填产品名称与要点；AI 据此创作文案、匹配素材、完成剪辑；人工检查卖点是否突出。<\/p>\n<p>第五步，返工定位。成片某段不满意时，沿依赖链回退到对应上游：画面错配回画面来源，音色不当回配音，音乐不合回音乐；内容本身有问题回讲稿或素材要点。<\/p>\n<h2>算例<\/h2>\n<p>可复现操作序列（依据 PDF 第 94–102 页）：<\/p>\n<p>任务：企业内训微课视频。<\/p>\n<ol><li>\n输入：内训讲稿一篇。\n<\/li><li>\n画面选项卡：素材来源选在线素材库（无现成素材）；比例 16:9。\n<\/li><li>\n配音选项卡：音色选知性女声；语速、音量按讲稿调整。\n<\/li><li>\n音乐选项卡：选智能推荐。\n<\/li><li>\n生成视频：AI 分析文稿，自动分镜、匹配画面、生成音频与字幕。\n<\/li><li>\n检查：画面与讲稿段落对应，音色自然，音乐不压人声。\n<\/li><li>\n导出：重命名文件，选保存格式，导出 MP4。\n<\/ol>\n<p>量级：讲稿准备是主要人工投入；AI 生成等待为片刻到数分钟，按文稿长度与素材匹配复杂度变化；导出时长取决于成片时长与分辨率。对比顺序颠倒：先配音乐后写稿，讲稿一改，音乐、配音、画面三段返工；按链顺序，单次改动只回退到对应工序。<\/p>\n<p>营销成片算例：导入产品视频素材，填产品名称与核心要点；AI 生成卖点文案并匹配素材；检查卖点突出度，不满意调整要点后重新生成。<\/p>\n<h2>补充推演：返工成本沿工序链放大的机制<\/h2>\n<p>工序链上每个下游环节都消费上游产物。讲稿是画面分段的依据，画面分段是配音节奏的依据，配音音色是音乐匹配的参照。上游改动后，下游产物失去依据：讲稿改了，原分段画面要重配；画面变了，配音节奏要重对；配音变了，音乐情绪要重选。返工不是替换单个素材，而是回退到上游后沿链重做已完成的下游环节。<\/p>\n<p>成本量级推演。假设各环节人工与等待成本相近，改动发生在讲稿阶段，回退距离为零，只改文稿；改动发生在配音阶段，要回讲稿核对分段、重配画面、重选配音、重配音乐；改动发生在导出前，整条链已完成，回退距离最长。越靠后发现内容问题，回退经过的环节越多。流程顺序的意义就是把内容决策尽量推到上游，在下游产物生成之前定稿。<\/p>\n<p>三条路径的依赖差异。模板路径的骨架由模板给定，上游约束是模板段落；替换素材与文字必须对齐模板画面位，不能随意扩展结构。文字成片路径上游是讲稿，AI 按讲稿分段匹配画面。营销成片路径上游是实拍素材与产品要点，AI 据此创作文案；素材与要点不齐，卖点文案没有依据。三条路径上游不同，下游生成与导出环节一致。<\/p>\n<p>生成后确认环节不可省略。AI 自动完成分镜、匹配、音频与字幕，但自动结果不保证贴合：画面可能错配讲稿段落，音色可能不适合内容，音乐可能压住人声。确认环节按画面、配音、音乐、字幕四项逐项检查；发现问题沿依赖链回退对应工序，而不是在成片上硬改。<\/p>\n<p>路径选择的判断依据。手头输入决定路径：有可套模板走模板，只有文本走文字成片，有实拍素材走营销成片。输入条件变化时路径也要变；反过来说，模板套不上内容结构时，硬套模板会出现素材塞不进段落的问题，应换文字成片或营销成片。<\/p>\n<h2>三条路径的输入产出对照<\/h2>\n<p>模板路径输入：现成模板、替换素材、替换文字。产出：套用模板节奏与配乐的成片。适用：有匹配模板、内容结构与模板段落对应。约束：素材与文案按模板位填空，不扩展结构。<\/p>\n<p>文字成片路径输入：讲稿文本。产出：含画面、配音、字幕、背景音乐的完整教学视频。适用：只有文稿、不出镜讲解。约束：画面由在线素材匹配，配音与音乐按文稿推荐。<\/p>\n<p>营销成片路径输入：产品实拍素材、产品名称与要点。产出：卖点突出的带货短视频。适用：有实拍素材、要突出产品卖点。约束：文案由 AI 依据要点生成，要点齐全度决定文案质量。<\/p>\n<p>路径选择推演：先列手头已有产物，再对路径输入要求。缺讲稿先写讲稿，缺素材先补素材；输入不齐就进生成环节，AI 只能按有限信息补全，成片偏差在下游暴露。<\/p>\n<h2>工序排期与返工定位<\/h2>\n<p>排期上把内容定稿放在前半段：讲稿或素材要点确认后，再进入画面配音音乐；包装美化放在最后。发现问题先判断属于哪个工序：画面错配回画面来源，音色不当回配音，音乐不合回音乐，内容本身问题回讲稿素材。不在错误上游未定的情况下继续下游制作。<\/p>\n<p>导出检查清单：画面与讲稿段落对应，配音音色语速合适，音乐不压人声，字幕无明显错漏，比例符合发布平台。清单逐项通过后再命名导出；提前导出会把未确认版本固化，重新导出覆盖前需确认成片目录。<\/p>\n<h2>与相邻概念的衔接<\/h2>\n<p>成片流程的上游素材来自即梦图片与视频（c04–c06）；讲稿质量依赖豆包写作与结构化输出（c01、c03）。流程走完进入字幕与口播精修（c08），再导出分发到飞书协作文档与群聊（c09）。三条路径产出的成片格式一致，差别只在上游输入与 AI 参与环节。<\/p>\n<p>复盘习惯：每次成片后记录卡在哪个工序、返工回退到哪一步；同类素材反复卡在同一环节时，把该环节的前置检查补进流程清单，避免下游重复返工。<\/p>\n<h2>第二算例：企业宣传模板逐段替换（换任务：从文字成片与营销成片换到模板路径）<\/h2>\n<p>任务背景：要做一支企业宣传片，没有现成讲稿与实拍长素材，但有一批公司照片与产品视频，内容结构与常见企业宣传模板对应。与 A 阶段内训微课不同，这条路径的骨架由模板给定，人工动作是替换素材与文字。<\/p>\n<p>步骤序列（依据 PDF 第 90–93 页，书中版本，界面可能已变）：<\/p>\n<ol><li>\n选模板：打开剪映专业版，左侧工具栏选【模板】，搜索框输入“企业宣传”按回车搜索；鼠标悬停在视频封面上预览效果，选定后单击【使用模板】进入编辑界面。\n<\/li><li>\n核对模板段落：轨道区是一整段完整视频轨道，轨道上方是模板使用的所有素材；先通读模板段落顺序，确认公司素材能对应到各素材位。\n<\/li><li>\n替换素材：选中轨道上的素材，单击素材上的【替换】按钮，从计算机文件夹选择自己的公司照片、产品视频；剪映自动把素材填充到对应模板位置。\n<\/li><li>\n修改文字：选中轨道中的完整视频，界面右上方出现【文本】窗格，列出视频中所有文字；删除原有模板文字，输入自己的宣传文案（案例为“锐意进取·2025”），英文文案也替换成对应内容。\n<\/li><li>\n预览确认：单击播放器播放按钮，从头到尾完整预览一遍，核对素材是否填齐、文字是否替换完、节奏与配乐是否贴合。\n<\/li><li>\n导出：确认无误后单击界面右上角【导出】，在对话框命名（案例“企业宣传片”）、选保存位置，再单击【导出】。\n<\/ol>\n<p>判断依据与回退：素材塞不进模板段落，说明内容结构与模板不对应，换文字成片或营销成片路径；替换后某素材位仍空着，回到素材步逐个核对；文字窗格里找不到某句标语，检查是否选中了轨道完整视频；预览发现节奏不符，模板路径不另起结构，换匹配度更高的模板。这一步不做会怎样：不预览直接导出，未替换的模板文字与空缺素材被固化进成片；素材与文案不对应硬套模板，画面位与内容错位，返工要回到模板选择步。<\/p>\n<h2>延伸推演：成片流程成立的三个前置子条件<\/h2>\n<p>按工序链推进能省时，依赖三个子条件先就位。<\/p>\n<p>子条件一：上游输入齐备。模板路径要备替换素材与文案，文字成片要备讲稿，营销成片要备实拍素材与产品要点；输入不齐就进生成环节，AI 只能按有限信息补全，偏差在下游暴露。去掉这个子条件，卡在对应路径的第一步：素材来源未定不进配音，要点不全卖点文案没有依据。<\/p>\n<p>子条件二：路径与手头输入匹配。有可套模板走模板，只有文本走文字成片，有实拍素材走营销成片；输入条件变化时路径也要变。去掉这个子条件，硬套模板会出现素材塞不进段落的问题，硬走文字成片则浪费已有实拍素材。<\/p>\n<p>子条件三：生成后确认环节保留。AI 自动完成分镜、匹配、音频与字幕，但自动结果不保证贴合；画面错配、音色不当、音乐压人声都要人工逐项检查。去掉这个子条件，问题随导出固化，回退距离是整条工序链。<\/p>\n<p>三个子条件对应流程链的入口：输入齐备、路径匹配、确认不省。内容决策尽量推到上游定稿，包装美化放在最后；越靠后发现内容问题，回退经过的环节越多。<\/p>\n<h2>对抗性追问：AI 自动成片后，人工确认环节能不能省掉<\/h2>\n<p>读者反驳：文字成片与营销成片都由 AI 完成分镜、匹配、配音、字幕，生成结果看起来完整，是否可以不逐项检查直接导出。<\/p>\n<p>手册写了什么：三条路径生成后都设有检查与导出环节（PDF 第 94–102 页）；营销成片路径要求人工检查卖点是否突出，不满意调整要点后重新生成（PDF 第 98–102 页）。手册流程把 AI 生成定位为初稿产出，确认环节在导出之前。<\/p>\n<p>补充判断（手册未展开）：确认环节不可省的原因是自动结果不保证贴合。判据按四项过清单：画面与讲稿段落对应、配音音色语速合适、音乐不压人声、字幕无明显错漏；任一项不达标，沿依赖链回退对应工序，不在成片上硬改。AI 参与程度越高，人工检查越要盯住“内容是否贴合本次任务”，而不是只看画面是否完整；提前导出会把未确认版本固化，重新导出覆盖前需确认成片目录。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n手头已有输入是模板、讲稿还是实拍素材？对应哪条路径？\n<\/li><li>\n当前工序的输入是否来自上一步产物；上一步未定就进入下一步会缺什么？\n<\/li><li>\n哪一步改动会连带下游哪些环节返工？\n<\/li><li>\n生成后检查清单是否覆盖画面、配音、音乐、字幕四项？\n<\/li><li>\n导出前是否还有未确认环节；提前导出会固化什么问题？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "成片流程：素材—文案—画面—配音—音乐—导出的顺序决策"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.105<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">成片流程：素材—文案—画面—配音—音乐—导出的顺序决策<\/a><\/span><\/div><h1>字幕识别校对与口播剪辑的对齐成本<\/h1>\n<ul><li>\n<strong>难度<\/strong>：中级 | <strong>涉及章节<\/strong>：第 3 章 | <strong>原书位置<\/strong>：第 8.1 节智能字幕（PDF 第 103–108 页）、第 8.2 节口播剪辑（PDF 第 107–111 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>手动加字幕要逐字听写、对齐时间轴，过程枯燥且容易出错；手动剪口播要反复播
