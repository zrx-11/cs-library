情包九宫格： 输入要素：角色“一个熊猫，脸部特征，上半身”；动作情绪“欢乐、生气、悲伤、愤怒、思考、拥抱、奔跑、招手等”；风格“可爱动漫插画风格”；布局“3×3 网格图，纯色背景”。 模型选择图片 3.0，比例 1:1（PDF 第 52 页）。 结果检查：九格角色是否一致，表情是否区分，背景是否纯色。<\/p>\n<p>案例 C 城市宣传尾帧： 提示词方向：武汉城市地标微缩景观，融合黄鹤楼、江汉关大楼，搭配山水云雾意境，呈现“江城风华”氛围；风格与效果为精致模型质感，光影温暖，古今建筑交融，营造庄重、富有历史底蕴的视觉效果（PDF 第 87 页，书中版本）。 模型图片 3.1，比例 3:2。<\/p>\n<p>量级与对比：单组生成通常一次出 4 张候选（书中再次生成基于原提示词重新生成 4 张全新图片，PDF 第 50 页）；挑选时间随候选数量增加。对比三层缺项：只写主体时，环境与风格随机，4 张候选可能方向分散；三层齐全后，候选之间差异主要在细节，方向一致。<\/p>\n<h2>补充推演：三层要素在画面生成中的分工<\/h2>\n<p>图像模型把提示词中的名词性短语分配到不同生成通道：主体通道决定中心对象的轮廓与位置，环境通道决定背景层次与氛围，风格通道决定材质、笔触与光影处理。三层各有对应通道，缺哪个通道，哪个部分由模型按默认值填充。<\/p>\n<p>逐层推演画面落点。主体不明确时，模型挑常见对象填充中心，画面主角与任务意图不符；环境不明确时，背景取与主体最常见搭配的场景，氛围无法定制；风格不明确时，材质画法取模型高频默认，同一句提示在不同候选间画法摇摆。三层齐全后，主体位置、背景氛围、材质画法都有依据，候选之间差异集中在细节而非方向。<\/p>\n<p>要素冲突的识别方法。检查提示词时看三层是否互相拉扯：主体是写实人物，风格写卡通，两个通道信号矛盾，生成结果在两种画法之间折中；环境写深夜室内，风格写明亮日光，光线信号冲突。冲突不会报错，只会表现为画面不自然。修改时先消除冲突，再补细节。<\/p>\n<p>表情包一致性机制再展开。九格同框要解决两个问题：每格表情不同，角色与画风统一。角色特征描述固定长相，风格描述固定画法，纯色背景排除场景干扰，布局描述固定格数排列；动作情绪承担格间差异。若把环境场景写进每格，背景变化会分散对表情的识别，也增加格间不一致概率。<\/p>\n<p>与文字提示词的映射对照。背景定位在图像侧拆成主体与环境：对象是谁、处于什么语境；要求细化对应风格与布局；目标明确在图像侧常落到比例与用途（见 c05）。文字约束章节与措辞，图像约束对象、场景、画法，映射关系一致但要素名称不同。<\/p>\n<h2>提示词逐层检查清单<\/h2>\n<p>生成前按三层过一遍提示词。主体层：画面主角是否明确，视角、部位、数量是否写清；主体模糊时先补主体。环境层：场景、氛围、光线方向是否交代；环境空缺会导致背景随机。风格层：画法是否为可识别风格词，与主体环境是否冲突；风格空缺或冲突时先修风格。<\/p>\n<p>不同品类的要素增减。风景静物：主体加环境为主，风格定材质画法。角色写真：主体补脸部特征、视角、服饰，环境定场景氛围。海报画面：在三层之外补文案位置、色彩倾向与构图布局（见 c05 比例配对）。表情包：环境替换为动作情绪，补布局与背景约束。<\/p>\n<p>候选挑图对照三层。四张候选逐张检查：主体是否出现且居中，环境是否符合氛围，风格是否落到材质。偏差集中在同一层时，修改该层提示词后重新生成；三层都有偏差，先补最缺的一层。提示词修改记录与对应候选保留，便于对比哪一层调整见效。<\/p>\n<h2>边界补充<\/h2>\n<p>三层提示词约束的是画面方向，不保证主体长相与产品外观精确一致；这类需求要结合参考图（见 c06）。风格词必须可识别，“好看、高级、氛围感”没有对应画法，模型无法落到材质处理。提示词要素之间不能冲突：写实人物配卡通风格、室内场景配日光描述，都会让生成在两套信号间折中。<\/p>\n<p>多层画面（海报、信息图）三层之外还要补构图与布局；纯单主体图三层已够。多主体场景要写清相互位置关系，否则主体排布由模型随机安排。提示词写完先按三层归类检查，归不进任何一层的描述再判断属于布局还是参数需求。<\/p>\n<h2>与相邻概念的衔接<\/h2>\n<p>三层提示词写好后，模型与比例配对见 c05；需要跨画面锁定主体与风格时，进入 c06 的首尾帧与参考图流程。工作流出图时，三层要素由策略师节点整理成提示词变量，交给图像生成节点，提示词结构不变，只是交接方式从对话输入变为变量传递。<\/p>\n<h2>第二算例：课程头像的三层提示词（换任务：从风景静物与表情包换到人物头像写真）<\/h2>\n<p>任务背景：为一门线上课程做方形头像，画面要在小尺寸下仍能认出角色形象。与 A 阶段风景图不同，主体是人，需要补脸部特征、视角与服饰；与表情包不同，单格画面不需要布局约束。<\/p>\n<p>步骤序列：<\/p>\n<ol><li>\n主体层：写清“一位年轻女生，上半身，短发，微笑，正面视角”。视角与部位补到可识别程度；不写正视图时，模型可能给侧脸或全身构图，头像裁切后主体位置不稳。\n<\/li><li>\n环境层：写“纯色浅灰背景，光线柔和均匀”。头像用途要求背景不抢主体；不写环境，模型按人像常见搭配补室内或街景，小尺寸下背景元素分散注意力。\n<\/li><li>\n风格层：选“二次元卡通插画风格”，与主体和背景不冲突。风格词用可识别画法，不写“好看、高级”。\n<\/li><li>\n组织提示词：按主体 + 环境 + 风格顺序连成一句；进图片生成界面，比例选 1:1（头像用途，见 c05），提交生成一组候选。\n<\/li><li>\n挑图按三层核对：主体是否正面上半身、特征稳定；背景是否纯色干净；画法是否为卡通插画。哪一层偏差明显，只改对应层要素后重新生成，不整段重写。\n<\/ol>\n<p>判断依据与回退：四张候选角色长相不一，主体层特征描述不够固定，补发型、脸型等可见特征；背景杂乱，回环境层删场景元素；画法在卡通与写实之间摇摆，回风格层把风格词写明确。这一步不做会怎样：三层缺环境，四张候选背景方向分散；风格用感觉词，材质画法在候选间摇摆；不按用途定比例，头像放进方形展示位后主体被裁。<\/p>\n<h2>延伸推演：三层提示词成立的三个前置子条件<\/h2>\n<p>三层能约束画面方向，依赖三个子条件先成立。<\/p>\n<p>子条件一：风格词对应可识别画法。模型把风格词分配到材质与笔触通道；“好看、高级、氛围感”没有对应画法，通道收窄失败。去掉这个子条件，风格层空缺，材质按模型高频默认填充，同一句提示在不同候选间画法摇摆。<\/p>\n<p>子条件二：三层要素之间不冲突。主体、环境、风格各自信号要一致；写实人物配卡通风格、室内深夜配明亮日光，两个通道信号互相拉扯。去掉这个子条件，画面在两套信号之间折中，表现为不自然，但界面不报错。<\/p>\n<p>子条件三：用途已知，构图与布局需求可判断。单主体图三层已够；海报、信息图还要补文案位置与色彩倾向；多主体场景要写相互位置。去掉这个子条件，主体排布与文案位置由模型随机安排，多层画面返工集中在构图。<\/p>\n<p>三个子条件对应三层的生效前提：风格可辨、信号一致、用途明确。生成前先按三层归类检查提示词，归不进任何一层的描述再判断属于布局还是参数需求（参数配对见 c05）。<\/p>\n<h2>对抗性追问：AI 生图能不能保证商用无风险<\/h2>\n<p>读者反驳：提示词三层写好、挑出满意候选，这张图是否可以直接用于对外发布的商品或宣传物料。<\/p>\n<p>手册写了什么：第 3–6 章讲文生图、图生图、参考图与视频衔接的操作方法（PDF 第 46–89 页），案例用于课程配图、表情包、产品与城市宣传演示；手册未展开生成图片的版权归属、肖像授权与商用范围条款。<\/p>\n<p>补充判断（手册未展开）：本手册操作流程不覆盖商用合规判断。能否商用，要核对所用平台当时的用户协议、生成内容授权条款，以及图中是否出现可识别人物形象、受保护 IP 元素；这些属于法律与平台规则层面的核对，不靠提示词三层解决。判据：用于公开商用物料前，先确认平台授权条款覆盖该用途；涉及人物形象的，另行核对肖像授权；提示词与生成记录留存备查。手册案例中的产品、地标名称为演示素材，不构成对商用结果的保证。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n提示词中主体、环境、风格三类要素能否逐词归类？有没有哪类缺失？\n<\/li><li>\n风格词是否为可识别画法，还是“好看、高级”这类不可辨描述？\n<\/li><li>\n主体、环境、风格之间有没有冲突（如写实人物配卡通风格）？\n<\/li><li>\n多格画面是否写了布局约束与背景处理？角色一致性靠哪一句固定？\n<\/li><li>\n生成结果偏差主要出在哪一层？修改时应调整哪一类要素？\n<\/ol><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.50<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">图像提示的三层结构：主体—环境—风格<\/a><\/span><\/div><h1>模型分工与图片参数：模型选择、比例、再次生成与重新编辑<\/h1>\n<ul><li>\n<strong>难度<\/strong>：中级 | <strong>涉及章节<\/strong>：第 2 章 | <strong>原书位置<\/strong>：第 3.1 节模型选择与比例（PDF 第 50 页）、再次生成与重新编辑（PDF 第 50 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>文生图结果不合预期时，常见误判是提示词不够长，于是继续堆叠形容词；实际另一个常被忽略的原因是模型与参数配对错误：含文字海报选了偏表现的模型，字形容易变形；写真质感任务选了偏文字的模型，光影层次不够。模型侧的分工、画幅比例、生成后的两种修正路径，都需要按任务类型先判断，再动手调提示词。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>模型选择<\/strong>：书中把图片模型按任务侧重分工（PDF 第 50 页，书中版本，模型名单可能已更新）。<\/p>\n<p>图片 4.0：面向图片二次创作。适用场景包括修改画面风格（如实况风转为水墨风）、增删元素（添加物体、移除背景）、多图保持角色一致、多图合成（书中说明目前支持 6 张图片）。核心优势在对图像的精细化处理与重构，能基于参考图片做复杂调整。<\/p>\n<p>图片 3.1：面向生成图片或换脸写真。核心竞争力是画面表现力，场景细节、光影层次、元素质感更鲜活，山水、人像、概念设计等内容呈现更生动。<\/p>\n<p>图片 3.0：面向包含文字的图片，如带标语的海报、有标题的配图。关键优势是文字识别与呈现精度更高，能有效避免文字变形、错漏。<\/p>\n<p><strong>图片比例<\/strong>：生成画面的宽高比。书中给出：16:9 适合生成计算机壁纸；1:1 适合头像；3:4 适合竖版海报；9:16 适合手机壁纸。选择特定比例后，尺寸输入会被比例约束，无法输入任意尺寸（PDF 第 50 页）。<\/p>\n<p><strong>再次生成<\/strong>：基于原有提示词重新生成一组全新图片。提示词未改，换的是采样结果。<\/p>\n<p><strong>重新编辑<\/strong>：手动编辑提示词，或借助豆包等 AI 助手继续优化提示词后再生成。改的是输入条件（PDF 第 50 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>模型分工的机制是不同模型在训练与优化中侧重的环节不同：二次创作类任务要求理解参考图结构并做局部重构，写真类任务要求材质与光影表现，含文字类任务要求字形识别与排布。按最容易出错的环节选模型，就是把模型侧重对准任务风险点。<\/p>\n<p>比例约束的机制：画幅方向决定构图空间分布。横版适合宽场景并排展开，方图适合单主体居中，竖版适合上下分层内容；选定比例后，宽高输入被锁定在该比例附近，模型按该画幅组织主体位置。<\/p>\n<p>两种修正路径的差别在输入条件是否改变。再次生成不改提示词，偏差来自采样随机性，同方向多抽几张可挑到更好结果；重新编辑改提示词，偏差来自输入要素缺失或冲突，必须先补要素再生成。判断路径的依据：现有提示词方向正确、只是结果随机波动，走再次生成；方向本身有偏差，走重新编辑。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>模型选择先看画面要解决的核心问题：在已有图上改，走 4.0；出写真表现，走 3.1；画面带文字，走 3.0。比例先看发布位置：电脑壁纸、头像、竖版海报、手机壁纸各对应一个比例。<\/p>\n<p>边界有三条。第一，模型分工不是绝对壁垒：书中也说明不同模型侧重区别没有那么大，并非不能更改，用擅长改图的 4.0 生成海报、用侧重文案的 3.0 制作表情包都可尝试；不确定时可选最新版本模型（PDF 第 52 页）。第二，比例选错后裁切会损失主体或文案位置，发布前按用途定比例。第三，再次生成不能修正提示词方向性错误；方向错时重复生成只会得到同类偏差结果。<\/p>\n<h3>反例<\/h3>\n<p>反例一：含标语海报选 3.1。文字呈现不是该模型侧重，标语变形错漏概率上升，后期修字工作量超过一开始选 3.0。 反例二：竖版海报生成时用 16:9。画幅横宽，排上下分层海报时主体与文案位置拥挤，裁切后内容被切。 反例三：提示词方向错了却连续点再次生成。采样结果围绕错误输入展开，多抽几轮仍偏离预期。<\/p>\n<h2>辨析<\/h2>\n<p>模型与风格词的差别：模型分工是界面选项，风格（水墨、写实、卡通等）写在提示词里；模型决定侧重环节，风格词决定画面画法，二者不互相替代。<\/p>\n<p>比例与分辨率的差别：比例是宽高方向，宽高数值是画幅尺寸；比例选定后尺寸输入受约束，画面清晰度另由模型与生成质量决定。<\/p>\n<p>再次生成与重新编辑的差别：前者输入不变、重新采样；后者输入修改、再行生成。两者可组合：先重新编辑提示词，再多次再次生成挑选。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：图像提示三层（c04）。后继：首尾帧一致性（c06）中尾帧与首帧按写真表现选 3.1，视频衔接选视频 3.0（PDF 第 83、85 页）；工作流视觉设计师节点选 Seedream 4.0、9:16、宽 1440 高 2560、最多 4 张（PDF 第 217 页），是模型与参数配对在自动化链路中的复用。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（模型分工与图片参数：模型选择、比例、再次生成与重新编辑）<\/summary><div class=\"depth-body\"><h1>c05 深度片段：模型与参数配对的依赖链、推导与可复现算例<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>从最终发布画面倒推参数选择。发布位置先定画幅方向：壁纸、头像、海报、手机屏各有标准比例，比例错了裁切损失内容。再倒推画面风险点：二次创作最怕结构改不动，写真最怕质感不够，含文字图最怕字形错漏；风险点对应模型侧重。最后倒推修正路径：结果偏差是随机波动还是方向错误，决定再次生成还是重新编辑。<\/p>\n<p>逆推链条：发布位置 ← 比例选择；画面风险点 ← 模型选择；偏差类型 ← 修正路径。提示词三层要素（c04）在参数之前确定，参数不补内容要素。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，判断任务类型。检查输入是否已有参考图：有参考图要改风格、加删元素、保持角色或合成，归二次创作；无参考图要出写真或场景表现，归画面表现；画面包含标语、标题文字，归含文字类型。<\/p>\n<p>第二步，按类型选模型。二次创作选图片 4.0，调用其精细化处理与重构能力；写真表现选图片 3.1，调用细节、光影与质感；含文字选图片 3.0，调用文字识别与呈现精度。<\/p>\n<p>第三步，按发布位置选比例。电脑壁纸 16:9，头像 1:1，竖版海报 3:4，手机壁纸 9:16。比例选定后宽高输入受约束，不再填任意尺寸。<\/p>\n<p>第四步，生成并挑图。每组候选生成后检查：任务风险点是否消除（角色是否保持、质感是否到位、文字是否正确），主体与构图是否落在画幅内。<\/p>\n<p>第五步，按偏差类型选修正路径。提示词方向正确、个别候选有随机波动，再次生成换采样；方向或要素有偏差，重新编辑提示词（可借助 AI 助手优化），再生成。<\/p>\n<h2>算例<\/h2>\n<p>可复现操作序列（依据 PDF 第 50、52、83、217 页）：<\/p>\n<p>算例 A 含文字海报： 任务：带活动标语的竖版海报。 参数配对：模型图片 3.0（文字呈现），比例 3:4（竖版海报）。 提示词按三层写主体、环境、风格，标语文字写入提示词。 检查点：标语字形是否正确无变形，竖版构图是否完整。<\/p>\n<p>算例 B 写真产品图： 任务：产品置于花朵中的正视图尾帧图。 参数配对：模型图片 3.1（画面表现），比例 16:9（PDF 第 83 页）。 检查点：产品质感、花瓣层次、光影是否鲜活。<\/p>\n<p>算例 C 表情包： 任务：九格表情，1:1。 参数配对：书中案例选图片 3.0，比例 1:1，提示词含 3×3 网格与纯色背景（PDF 第 52 页）；不确定模型分工时可选最新版本。<\/p>\n<p>算例 D 工作流出图： 节点：视觉设计师；模型 Seedream 4.0；比例 9:16；宽 1440、高 2560；最多生成 4 张（PDF 第 217 页，书中版本）。<\/p>\n<p>量级对比：一次生成一组候选，书中再次生成基于原提示词重新生成 4 张全新图片；模型与比例在单次任务内选定后不必反复切换。参数配对错误的返工成本：含文字图选错模型后修字，写真图选错模型后重抽质感，均高于一开始选对模型的成本。<\/p>\n<h2>补充推演：任务风险点与模型侧重的配对逻辑<\/h2>\n<p>选模型的依据不是模型名气，而是任务最容易出错的环节。把三类任务的失败形态拆开看。二次创作类失败表现为参考图结构改不动、元素增减不干净、多图角色走样；这类任务要求模型理解参考图结构并做局部重构，对应图片 4.0 的精细化处理与重构能力。写真表现类失败表现为材质平、光影灰、元素塑料感；要求模型在细节层次与质感上发力，对应图片 3.1。含文字类失败表现为字形变形、错字漏字；要求模型识别文字并按版式呈现，对应图片 3.0。<\/p>\n<p>配对顺序推演。先判断失败高发环节，再找侧重该环节的模型；反过来先选模型再找任务，容易把模型长处用不到风险点上。书中也说明模型侧重不是绝对壁垒，跨类尝试可行，但任务风险点明确时，按侧重配对能降低返工概率。<\/p>\n<p>比例与构图的关系推演。画幅方向决定主体可摆放的空间：横版适合宽场景并排，方图适合单主体居中，竖版适合上下分层。比例选错后，模型在错误画幅里安排构图，裁切时主体、文字或边缘景物容易被切；生成前按发布位置定比例，比生成后裁切成本低。<\/p>\n<p>两种修正路径的判定推演。区分随机波动与方向偏差：提示词要素齐全、模型比例配对正确，个别候选仍有差异，属采样随机，再次生成换一组候选即可；提示词缺要素、要素冲突或模型配对错，候选整体偏离方向，重复采样只会围绕错误输入出图，必须重新编辑提示词或改模型。判定依据是看偏差是否在所有候选上重复出现：普遍出现的偏差改输入，个别候选的偏差换采样。<\/p>\n<p>参数与提示词的分工。模型与比例是界面参数，不补充画面要素；提示词三层负责画什么。参数配对不能替代提示词构造，反过来提示词再完整，模型侧重与画幅错配仍会在风险点上失败。<\/p>\n<h2>参数配对检查单<\/h2>\n<p>接到出图任务先填两项判断。任务类型：是改已有图、出写真表现、还是做含文字画面；发布位置：壁纸、头像、海报、手机屏。两项分别对应模型与比例，判断顺序先模型后比例。<\/p>\n<p>模型核对：二次创作（改风格、增删元素、多图保持角色、多图合成）选 4.0；写真与人景物质感选 3.1；标语标题文字选 3.0；分工不确定时可选最新版本模型。比例核对：16:9 横版壁纸，1:1 方图头像表情包，3:4 竖版海报，9:16 手机壁纸。<\/p>\n<p>生成后修正路径判断。浏览候选：偏差在所有候选上重复，提示词或模型配对有问题，走重新编辑；个别候选偏差，提示词方向可用，走再次生成。重新编辑可借助 AI 助手优化提示词；改完提示词后再次生成多组候选挑选。<\/p>\n<p>参数记录习惯。同一类任务把模型与比例组合固定下来，下次直接沿用；换任务类型时先复核模型分工，不沿用上一次参数。多图合成时核对参考图数量是否在模型支持范围内（书中说明目前支持 6 张图片）。<\/p>\n<h2>边界补充<\/h2>\n<p>模型分工是书中版本的侧重归纳，界面模型名单会随版本更新；跨类尝试可行，风险点明确时再按侧重配对。比例只定宽高方向，清晰度与画质由模型与生成质量决定，不在比例选项内调整。再次生成不改提示词，不能修正方向性错误；重新编辑改输入条件，改完仍需多次生成挑选。参数配对与提示词构造缺一不可：提示词缺要素时换模型补不回来，模型错配时提示词再完整也在风险点上失分。<\/p>\n<h2>与相邻概念的衔接<\/h2>\n<p>模型与比例配对结果在首尾帧流程（c06）中复用：尾帧首帧按写真表现选 3.1，视频衔接选视频模型；工作流视觉设计师节点把模型、比例、尺寸、生成数量固定为节点参数，不再每次对话选择。<\/p>\n<h2>第二算例：二次创作：实拍静物转水墨风并调整元素（换任务：从写真与含文字图换到改图合成）<\/h2>\n<p>任务背景：已有一张实拍桌面静物照片，需要改成水墨风格并移除画面边缘杂物，用于系列配图。与 A 阶段出写真、出海报不同，这次输入是已有参考图，动作是改风格与增删元素。<\/p>\n<p>步骤序列：<\/p>\n<ol><li>\n判任务类型：输入带参考图，要改风格、增删元素，归二次创作类，核心风险点是参考图结构能不能保住、改动干不干净。\n<\/li><li>\n选模型：二次创作选图片 4.0（PDF 第 50 页，书中版本，模型名单可能已更新）；不按写真质感或文字呈现去配对。\n<\/li><li>\n选比例：成品作为文章横版配图，选 16:9；若后续改做头像再另选 1:1，比例随发布位置定。\n<\/li><li>\n上传参考图，提示词写清保留部分（桌面主体与构图）与改动部分（转为水墨画风、移除边缘杂物），提交生成一组候选。\n<\/li><li>\n挑图核对：主体结构是否与参考图一致，杂物是否移除干净，风格是否落到水墨笔触；偏差在所有候选上重复，回到提示词或模型配对；个别候选偏差，再次生成换采样。\n<\/li><li>\n多图合成分支：若任务是把多张人物图合成同一画面，核对参考图数量在模型支持范围内；书中说明目前支持 6 张图片（PDF 第 50 页），超出数量先拆分批次。\n<\/ol>\n<p>判断依据与回退：主体走样，说明改动幅度超出模型重构能力，回提示词收紧“保留构图”的描述；杂物残留，检查元素删除要求是否写明确；风格没转过来，核对模型是否选成侧重写真的版本。这一步不做会怎样：选错模型去出风格化改图，结构改动不干净，返工集中在反复重抽；不按发布位置选比例，成品进排版时主体或边缘景物被裁；参考图超数量硬传，合成结果缺图或角色走样。<\/p>\n<h2>延伸推演：参数配对成立的三个前置子条件<\/h2>\n<p>模型与比例选对，依赖三个子条件先明确。<\/p>\n<p>子条件一：发布位置已经确定。比例由最终展示位置反推：电脑壁纸、头像、竖版海报、手机屏各有标准方向；位置未定，比例没有依据，只能按感觉选。去掉这个子条件，卡在比例步：生成后裁切损失主体或文案位置，成本高于生成前定比例。<\/p>\n<p>子条件二：任务风险点可识别。要分得清最容易出错的环节是结构重构、质感表现还是文字呈现；风险点不清，模型侧重无从配对。去掉这个子条件，选模型退回到按界面版本顺序挑，长处用不到风险点上。<\/p>\n<p>子条件三：参考图数量与输入形态在支持范围内。多图合成、参考图传入都有数量与形式限制；任务规模超过支持范围，链路在输入环节就卡住。去掉这个子条件，节点或界面报错前无法判断是素材问题还是配置问题。<\/p>\n<p>三个子条件对应参数链的三步：位置定比例、风险点定模型、输入形态定可行性。参数是界面选项，不补充画面要素；提示词三层（c04）在参数之前确定，两者分工不混用。<\/p>\n<h2>对抗性追问：模型分工归纳半年后还成立吗<\/h2>\n<p>读者反驳：模型版本更新很快，按 4.0 / 3.1 / 3.0 的侧重分工选模型，过几个月名单和强项一变，这套配对表是否就失效。<\/p>\n<p>手册写了什么：书中按当时界面把图片模型分成二次创作、写真表现、含文字三类侧重（PDF 第 50 页，书中版本，模型名单可能已更新），同时说明分工不是绝对壁垒，跨类尝试可行，不确定时可选最新版本模型（PDF 第 52 页）。<\/p>\n<p>补充判断（手册未展开）：失效的是具体型号与侧重标签，不失效的是配对方法。方法保留为：先找本次任务最容易出错的环节（结构、质感、字形），再到当前界面模型列表里核对各模型说明，选侧重该环节的型号；型号换代后，按风险点重新配对，而不是沿用旧表。判据：每次新任务先复核模型说明页，不沿用上一次任务的型号选择；分工不确定时按手册建议选最新版本模型，再用候选结果反查配对是否合适。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n这个任务的核心风险点是结构重构、质感表现还是文字呈现？对应哪个模型？\n<\/li><li>\n成品最终发布在什么位置？宽高方向是否与比例选项一致？\n<\/li><li>\n现有候选偏差是随机波动还是方向错误？该走再次生成还是重新编辑？\n<\/li><li>\n风格词写在提示词里还是模型选项里？两者是否混淆？\n<\/li><li>\n多图合成时参考图数量是否在模型支持范围内（书中说明目前支持 6 张图片）？\n<\/ol><\/div><\/details>", "c06": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.82<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">图像提示的三层结构：主体—环境—风格<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">模型分工与图片参数：模型选择、比例、再次生成与重新编辑<\/a><\/span><\/div><h1>首尾帧与参考图约束下的画面一致性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：中级 | <strong>涉及章节<\/strong>：第 2 章 | <strong>原书位置<\/strong>：第 6.3 节产品宣传视频（PDF 第 82–85 页）、第 6.4 节城市宣传视频（PDF 第 87–88 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>图生视频最常见的失败是前后风格跳变：首帧温暖柔和，尾帧冷硬粗糙；或人物、场景在两张图之间对不上，AI 衔接出的过渡画面在两种风格之间变形。原因是首尾两张图各自独立生成时，色调、质感、构图没有被同一基准约束，视频模型只能在两个不一致的端点之间补中间帧。<\/p>\n<p>首尾帧流程要解决的困难是：先定一张视觉基准图，再让另一张图参照基准生成，把一致性问题解决在图片阶段，最后再交给视频生成衔接。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>尾帧图片<\/strong>：视频最终亮相的画面，先作为整个视频的“风格基准”生成。后续所有动作都围绕这个基准展开（PDF 第 82 页）。产品案例尾帧提示词为“正视图，小棕瓶包裹在巨大的花朵中”，模型图片 3.1，比例 16:9（PDF 第 83 页）。<\/p>\n<p><strong>首帧图片<\/strong>：视频第一帧画面。生成时不复凭空找一张风格相近的图，而是复用已生成的尾帧作为参照标准；因为尾帧的色调、质感、构图已经确定，用它作参照生成首帧，能最大程度降低首尾不一致风险（PDF 第 83–84 页）。产品案例首帧提示词为“背景干净，去除产品，花朵闭合为花蕾”；在图片生成界面点【+】上传图片，参考图对话框中选择【智能参考】后保存（PDF 第 84 页，书中版本，界面可能已变）。<\/p>\n<p><strong>首尾帧衔接生成视频<\/strong>：两张风格统一的图片作为首帧与尾帧上传到视频生成，AI 自动识别两图风格关联，生成中间过渡画面，把静态首尾帧串成动态成片（PDF 第 85、88 页）。产品案例提示词“花朵绽放，镜头缓慢推进”，视频 3.0，其他参数保持默认（PDF 第 85 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>一致性问题发生在三个维度：色调、质感、构图。独立生成两张图时，三个维度都由模型随机补，两张图重合概率低。先定尾帧基准，相当于把三个维度固定在一张已验收的图上；首帧生成时把尾帧作为参考图传入，参考机制让首帧在色调、质感、构图上向基准对齐，差异只保留在剧情需要变化的部分（产品有无、花朵开合、城市形态）。<\/p>\n<p>视频生成阶段只负责补过渡。首尾已经一致，中间帧在统一风格内插值；若首尾不一致，视频模型没有额外标准消解两端差异，过渡就会出现风格跳变。流程顺序因此固定为：尾帧基准 → 参考生成首帧 → 视频衔接，而不是两张图各自生成后再找风格接近的配对。<\/p>\n<p>城市案例进一步用统一风格词强化基准：首帧和尾帧使用完全一样的风格提示词“精致模型质感，光影温暖”，相当于提前定好贯穿始终的视觉语言；视频生成有了明确风格参照，避免前半段温暖柔和、后半段冷硬粗糙的割裂感（PDF 第 87 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>首尾帧流程适合需要连贯感的图生视频：产品从花蕾到绽放、城市从无到有、人物动作连续等。只有单张图的静态配图任务，不需要走首尾帧。参考图约束适合主体与风格需要延续的场景；主体动作变化过大、两帧内容差异悬殊时，过渡仍可能不自然。<\/p>\n<p>边界有三条。第一，参考图对齐的是风格与主体特征，不保证剧情逻辑完全合理；动作设计要在提示词中写清。第二，首帧提示词仍需描述起点画面，不能只传参考图不写内容。第三，视频模型与图片模型分工不同，图片阶段未解决的一致性问题，不能指望视频阶段自动修正。<\/p>\n<h3>反例<\/h3>\n<p>反例一：首帧凭空另找一张风格相近的图。两张图在色调、质感、构图上的差异未被约束，过渡段出现割裂。 反例二：先生成首帧再反推尾帧。基准图变成首帧，但首帧剧情状态（如花蕾）承载的信息少于尾帧，基准不完整；书中流程以最终亮相画面为基准。 反例三：首尾帧风格词不一致。一端写温暖柔和，另一端写冷硬粗糙，参考机制也无法把两种材质统一。<\/p>\n<h2>辨析<\/h2>\n<p>与图生图参考编辑的差别：参考图在二次创作中用于改局部或重构画面；首尾帧中参考图用于跨画面锁定一致性，两张图分别承担视频起点与终点。<\/p>\n<p>与纯文生视频的差别：纯文生视频只靠文字描述全程，首尾状态不受控；首尾帧用两张图把端点钉住，文字只描述动作与镜头。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：图像提示三层（c04）、模型与参数配对（c05）。后继：剪映成片流程（c07）把生成的首尾帧视频作为素材导入剪辑；扣子工作流图像生成节点（c10）复用参考图与提示词约定，把策略师输出的提示词交给视觉设计师出图。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（首尾帧与参考图约束下的画面一致性）<\/summary><div class=\"depth-body\"><h1>c06 深度片段：首尾帧一致性的依赖链、推导与可复现算例<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>从一段连贯成片倒推图片阶段条件。成片首尾风格统一，需要首帧与尾帧在色调、质感、构图上对齐。先逆推对齐标准：标准必须先存在于一张已验收的图上，即尾帧基准；再逆推首帧生成方式：首帧不能凭空生成，要把尾帧作为参考图传入；最后逆推视频阶段：两图一致后，视频模型只补过渡，不再承担风格统一职责。<\/p>\n<p>逆推链条：成片连贯 ← 首尾三维度对齐 ← 尾帧基准图 ← 参考图约束首帧 ← 视频衔接。剧情需要变化的部分（产品有无、花朵开合）不纳入对齐范围，对齐的是风格维度。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，定尾帧。先想视频最终亮相画面：产品案例是小棕瓶包裹在巨大花朵中，城市案例是地标微缩景观。尾帧提示词写主体、环境与风格，选图片 3.1 与对应比例，生成后挑一张满意的保存。<\/p>\n<p>第二步，定首帧参照。首帧剧情状态与尾帧不同：产品案例花朵闭合为花蕾、去除产品；城市案例云山雾绕、盆地云雾。把尾帧上传为参考图，选择智能参考；首帧提示词只描述起点画面与统一风格，不另起风格方向。<\/p>\n<p>第三步，统一风格词。城市案例首尾共用“精致模型质感，光影温暖”；产品案例同模型同比例，尾帧质感延伸到首帧。风格词一致是跨画面对齐的显式约束，参考图是隐式约束。<\/p>\n<p>第四步，视频衔接。上传首帧与尾帧，提示词只写动作与镜头（花朵绽放、镜头缓慢推进；延时摄影、镜头环绕），选视频 3.0，其他默认，生成。不满意点再次生成，动作或端点偏差大则回到图片阶段调整。<\/p>\n<p>第五步，检查一致性。回放片段：起点与终点色调是否一致，质感是否连续，中间过渡有无风格跳变；问题出在图片阶段就修首尾帧，出在动作描述就修视频提示词。<\/p>\n<h2>算例<\/h2>\n<p>可复现操作序列（依据 PDF 第 82–85、87–88 页）：<\/p>\n<p>算例 A 产品宣传：<\/p>\n<ol><li>\n尾帧：提示词“正视图，小棕瓶包裹在巨大的花朵中”；图片 3.1；16:9；生成后挑图保存。\n<\/li><li>\n首帧：提示词“背景干净，去除产品，花朵闭合为花蕾”；上传尾帧作参考图，参考图对话框选【智能参考】保存；图片 3.1；16:9；挑图保存。\n<\/li><li>\n视频：视频生成，上传两帧；提示词“花朵绽放，镜头缓慢推进”；视频 3.0；其他默认；生成，不满意再次生成。\n<\/ol>\n<p>算例 B 城市宣传：<\/p>\n<ol><li>\n尾帧：武汉城市地标微缩景观，融合黄鹤楼、江汉关大楼，山水云雾意境，“江城风华”氛围；精致模型质感，光影温暖，古今建筑交融；图片 3.1；3:2。\n<\/li><li>\n首帧：云山雾绕，中间盆地云雾，精致模型质感，光影温暖；图片 3.1；3:2；风格词与尾帧一致。\n<\/li><li>\n视频：提示词“延时摄影，镜头环绕，展现城市从无到有的建设过程，一座座建筑物拔地而起”；视频 3.0；默认参数。\n<\/ol>\n<p>量级：图片阶段各生成一组候选挑选；视频生成等待时间按素材复杂度略有延迟；首尾帧各定一张后再进入视频，避免视频阶段反复重抽。对比反事实：两图各自生成后配对，风格对齐靠运气，过渡跳变概率高；参考约束后，偏差集中在剧情状态，风格维度稳定。<\/p>\n<h2>补充推演：一致性维度与参考机制<\/h2>\n<p>跨画面一致性要对齐的维度可拆成三项：色调（明暗、冷暖倾向）、质感（材质精细度、渲染方式）、构图风格（视角、主体位置关系）。独立生成两张图时，三项都由模型随机补；先定尾帧基准，三项在基准图上固化，首帧通过参考图向基准对齐。剧情需要变化的部分（产品有无、花朵开合、建筑形态）不属于对齐范围，对齐只锁风格维度。<\/p>\n<p>参考机制的作用边界。参考图传递的是视觉参照，不是复制内容；首帧提示词仍要写清起点画面。若只传参考图不写内容，模型可能直接复现尾帧状态，起点剧情无法成立。参考强度由界面选项控制（书中案例为【智能参考】，书中版本，界面可能已变），起点与终点剧情差异大时，参考对齐的是风格而非物体位置。<\/p>\n<p>为什么基准选尾帧。尾帧是最终亮相画面，承载完整产品形态或最终场景，信息最完整；以完整状态为基准，往回推起点更容易约束范围。若以首帧为基准，首帧花蕾或初建场景信息少，基准缺质感与构图参照，尾帧生成时对齐依据不足。<\/p>\n<p>视频阶段的职责边界。首尾一致后，视频模型负责在两端之间补过渡帧与动作衔接；它不承担重新统一风格的职责。若图片阶段遗留风格差异，视频过渡会在两端之间插值出中间风格，表现为跳变。因此一致性问题必须在图片阶段解决，不留给视频阶段修正。<\/p>\n<p>风格词共用的推演。城市案例首尾共用“精致模型质感，光影温暖”，显式写出贯穿全程的视觉语言；参考图是隐式参照，共用风格词是显式约束，两者叠加降低两端偏差。首尾风格词不一致时，参考机制无法把两套材质强行统一，过渡割裂感会保留到成片。<\/p>\n<h2>流程卡点与回放检查<\/h2>\n<p>卡点一：首帧生成时忘记上传尾帧作参考。首帧独立生成后风格随机，再与尾帧配对已经晚了；应在首帧生成前完成参考图上传与参考方式选择。卡点二：首尾风格词各写一套。两端风格描述不一致，参考对齐失去显式依据；同一视频的首尾共用风格表述。卡点三：视频提示词写风格要求。风格约束应留在图片阶段，视频提示词只写动作与镜头，重复风格描述反而可能干扰过渡。<\/p>\n<p>回放检查按三段看：起点帧是否符合剧情初始状态，终点帧是否为最终亮相画面，中间过渡是否连续无跳变。跳变发生在两端之间，回图片阶段核对首尾一致性；动作不连贯，回视频提示词调整镜头描述。<\/p>\n<p>适用场景边界。首尾帧流程适合起点终点都能用图片固定的片段；纯氛围转场、无明确端点的画面，可直接文生视频。两帧剧情差异过大时，过渡自然度受模型衔接能力限制，必要时拆成多段分别生成。<\/p>\n<h2>与相邻概念的衔接<\/h2>\n<p>首尾帧产出的图片与视频作为素材进入剪映成片流程（c07）：画面一致性在图像阶段解决，剪辑阶段不再承担风格统一。参考图约束的思路与扣子知识库参照私有资料回答同构：都先用固定基准约束生成范围，再在基准内补变化内容。<\/p>\n<p>流程记录建议：尾帧提示词、首帧提示词、参考图方式、视频提示词分别留存，复做同类短片时替换主体与动作描述即可；风格词沿用上一版基准，保证系列短片视觉统一。<\/p>\n<h2>第二算例：独立配图配对失败后的回退重做（换任务：从正向首尾帧流程换到失败恢复演练）<\/h2>\n<p>任务背景：一段产品短片先分别生成了起点图与终点图，各自挑图后直接上传视频衔接，回放发现两段色调一暖一冷、质感粗细不一，过渡处有明显跳变。本算例走的是发现问题后回到图片阶段重做的分支，与 A 阶段直接定首尾帧的正向流程不同。<\/p>\n<p>步骤序列：<\/p>\n<ol><li>\n定位跳变维度：回放拆三段看——起点帧、终点帧、中间过渡。跳变在两端之间，先核对两张图片的色调（明暗冷暖）、质感（材质精细度）、构图风格（视角与主体位置）哪几项不一致；动作不连贯另归视频提示词问题。\n<\/li><li>\n保留已验收的终点图作为基准。终点图是最终亮相画面，信息最完整；若终点图本身不满意，先重出尾帧并挑定，再往下走。\n<\/li><li>\n重做首帧：把尾帧上传为参考图，参考方式选【智能参考】（PDF 第 84 页，书中版本，界面可能已变）；首帧提示词只描述起点剧情状态与共用风格，不另起一套风格方向。\n<\/li><li>\n核对共用风格词：首尾两段提示词里的风格表述写成同一句；参考图是隐式参照，共用风格词是显式约束，两者叠加。\n<\/li><li>\n重新进入视频衔接：上传新首帧与尾帧，视频提示词只写动作与镜头，不重复风格要求；生成后回放，确认跳变消除再保留。\n<\/li><li>\n回退判断：重做后首帧剧情状态不对，检查首帧提示词是否误写成尾帧内容；风格仍割裂，核对两端风格词是否一致；过渡动作不连贯，回视频提示词调整镜头描述。\n<\/ol>\n<p>这一步不做会怎样：跳过回退、在视频阶段反复重新生成，两端风格差异仍在，视频模型只能在两套材质之间插值，跳变保留到成片；只传参考图不写起点剧情，模型直接复现尾帧状态，起点剧情不成立。<\/p>\n<h2>延伸推演：跨画面对齐成立的四个前置子条件<\/h2>\n<p>首尾帧流程能锁住风格，依赖四个子条件先成立。<\/p>\n<p>子条件一：基准图已经验收。尾帧承载完整产品形态或最终场景，先挑定一张满意的保存；基准未验收就推首帧，首帧对齐到一张还要改的图上，两端一起返工。去掉这个子条件，基准环节空转，后续对齐没有固定参照。<\/p>\n<p>子条件二：首帧提示词只写起点剧情。参考图传递视觉参照，不复制内容；起点画面要由提示词写清。去掉这个子条件，模型可能直接复现尾帧状态，剧情起点无法成立。<\/p>\n<p>子条件三：首尾风格词共用。同一视频两端用同一套材质与光影表述；风格词各写一套，参考机制无法把两套材质强行统一。去掉这个子条件，过渡割裂感保留到成片。<\/p>\n<p>子条件四：一致性问题在图片阶段解决。视频模型只补过渡帧与动作衔接，不承担重新统一风格的职责；图片阶段遗留差异，过渡会在两端之间插值出中间风格。去掉这个子条件，把风格问题留给视频阶段修正，返工距离拉长到整条短片。<\/p>\n<p>四个子条件对应一致性链的四步：基准验收、起点写清、风格共用、阶段归位。剧情需要变化的部分（产品有无、花朵开合、建筑形态）不纳入对齐范围，对齐只锁风格维度。<\/p>\n<h2>对抗性追问：做好首尾帧，是否还需要剪辑阶段精修<\/h2>\n<p>读者反驳：首尾风格已经在图片阶段统一，视频衔接自动生成，成片是否可以直接导出，不用再进剪辑环节调整。<\/p>\n<p>手册写了什么：第 6 章讲首尾帧与视频衔接生成（PDF 第 82–88 页）；第 7–8 章另设成片流程与字幕、口播、包装环节（PDF 第 90–119 页）。两章分工是图像阶段解决画面一致性，剪辑阶段解决节奏、字幕、配音、音乐与导出。<\/p>\n<p>补充判断（手册未展开）：首尾帧统一的是两端风格，不覆盖成片其余判断。判据分三类：画面一致性问题回图片阶段；节奏、镜头取舍、字幕校对、配音与音乐匹配归剪辑阶段；两类问题不互相替代。纯氛围转场、无明确端点的画面可直接文生视频，不套首尾帧流程；两帧剧情差异过大时，过渡自然度受模型衔接能力限制，必要时拆成多段分别生成，再在剪辑阶段拼接。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n哪张图作为风格基准？为什么选最终亮相画面而不是首帧？\n<\/li><li>\n首帧提示词描述的是起点剧情还是新风格？风格是否与尾帧共用表述？\n<\/li><li>\n参考图方式在界面中如何选择（书中为【智能参考】，书中版本，界面可能已变）？\n<\/li><li>\n视频提示词是否只写动作与镜头，把风格约束留在图片阶段？\n<\/li><li>\n回放时风格跳变出现在哪一段？应修首尾帧还是修视频提示词？\n<\/ol><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.94<\/div><h1>成片流程：素材—文案—画面—配音—音乐—导出的顺序决策<\/h1>\n<ul><li>\n<strong>难度<\/strong>：中级 | <strong>涉及章节<\/strong>：第 3 章 | <strong>原书位置<\/strong>：第 7.1 节企业宣传模板（PDF 第 90–93 页）、第 7.2 节 AI 文字成片（PDF 第 94–97 页）、第 7.3 节营销成片（PDF 第 98–102 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>新手做视频容易一上来就挑音乐、加特效，结果文案改了、素材换了，前面配好的音乐与包装全部作废。视频是一条时间轴上的流水工序：后面环节依赖前面环节的产物，顺序错了，返工不是局部调整，而是整条链倒回上游重做。成片流程要解决的困难是：判断先做什么、后做什么，每条路径的输入是什么、产出什么，哪一步依赖哪一步。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>书中第 7 章给出三条成片路径，共同骨架是内容先行、包装在后。<\/p>\n<p><strong>模板替换路径<\/strong>：在现成模板基础上替换素材与文字，沿用模板已有的节奏、转场与配乐。输入是模板加替换素材与文案，产出是套模板完成的企业宣传片（PDF 第 90–93 页，书中版本，界面可能已变）。<\/p>\n<p><strong>AI 文字成片路径<\/strong>：输入讲稿文本。流程为粘贴讲稿 → 设定画面内容与来源 → 挑选配音音色并调速音量 → 匹配背景音乐 → 生成视频 → 导出（PDF 第 95–97 页）。画面选项卡选素材来源，无现成素材时用在线素材库由 AI 按讲稿匹配；比例按发布平台选，教学视频常用 16:9。配音选项卡挑主播音色（如知性女声），调语速音量。音乐选项卡新手选智能推荐，AI 按文稿内容与音色匹配背景音乐。<\/p>\n<p><strong>营销成片路径<\/strong>：导入产品视频素材，填写产品名称与要点；AI 自动创作文案、匹配素材并完成剪辑，产出卖点清晰的带货短视频（PDF 第 98–102 页）。<\/p>\n<p><strong>导出<\/strong>：确认细节后在导出对话框重命名文件、选择保存格式，再导出成片（PDF 第 97、102 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>工序依赖从时间轴倒推。最终成片包含画面、配音、字幕、音乐；配音与字幕依赖讲稿或口播文本，画面分段依赖文稿内容，音乐情绪依赖文稿与音色。因此内容（素材或文案）必须最先确定。<\/p>\n<p>正向推演文字成片链：讲稿未定，画面分段没有依据；画面未定，配音节奏无法贴合分段；配音未定，音乐情绪没有参照；音乐配好后再改讲稿，三段都要重排。顺序定为讲稿 → 画面 → 配音 → 音乐 → 生成 → 导出，每一步输入来自上一步产物。<\/p>\n<p>模板路径的依赖方向相同：模板已固定节奏与配乐，替换素材与文字必须先对齐模板段落；先替换哪段素材、文案对应哪个画面位，是在模板骨架内填空。营销成片路径把文案创作交给 AI，但产品素材与要点仍是上游输入，素材与要点不齐，AI 生成的卖点文案没有依据。<\/p>\n<p>返工成本沿链条放大：上游改动影响下游全部产物。讲稿在配音之后改动，配音要重录或重选，音乐要重配，已生成的画面匹配要重做；越靠后发现内容问题，回退距离越长。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>三条路径按手头输入选择：有模板可套走模板路径；只有讲稿文本走文字成片；有实拍产品素材走营销成片。流程顺序适用于口播、教学、带货等常规短视频；纯氛围短片无文案时，画面与音乐顺序可按创作需要调整。<\/p>\n<p>边界有三条。第一，AI 生成不替代最终确认：生成后仍要检查画面匹配、音色、音乐与字幕，不满意回到对应环节调整。第二，模板路径受模板结构限制，素材与文案要适配模板段落，不能任意扩展。第三，导出参数（命名、格式）在最后一步处理，提前导出会把未完成版本固化。<\/p>\n<h3>反例<\/h3>\n<p>反例一：先选背景音乐再写讲稿。音乐情绪没有文稿依据，讲稿调整后音乐需重配，配音与画面跟着重排。 反例二：跳过内容梳理直接进精剪。素材中冗余片段未剔除，精剪阶段在大量片段中取舍，时间轴负担加重。 反例三：生成后不检查直接导出。画面错配、音色不当、字幕遗漏随成片导出，回看时需回到对应工序重做。<\/p>\n<h2>辨析<\/h2>\n<p>模板替换与文字成片的差别：模板路径骨架由模板给定，填空为主；文字成片骨架由讲稿分段生成，画面与配音由 AI 匹配。输入分别是素材加模板、讲稿文本。<\/p>\n<p>流程顺序与后期包装的差别：本章流程解决内容工序顺序；第 8 章字幕、口播粗剪、数字人属于成片后的包装与精修环节，位置在生成之后、导出之前。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：无强前置，但文案质量依赖提示词方法（c01、c03）。后继：字幕与口播对齐成本（c08）接在成片生成之后；素材上游来自即梦生成的图片视频（c06）；成片分发对应飞书协同与分享（c09）。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（成片流程：素材—文案—画面—配音—音乐—导出的顺序决策）<\/summary><div class=\"depth-body\"><h1>c07 深度片段：成片工序依赖链、推导与可复现算例<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>从导出成片倒推工序。成片 = 画面 + 配音 + 字幕 + 音乐。字幕与配音都挂在语音或讲稿文本上，画面分段挂在文稿结构上，音乐情绪挂在文稿与音色上。逆推：音乐 ← 配音 ← 画面分段 ← 讲稿/素材要点。再逆推：讲稿或素材要点是整条链最上游，必须先定。<\/p>\n<p>三条路径的输入差异：模板路径上游是模板骨架加替换素材；文字成片上游是讲稿；营销成片上游是实拍素材加产品要点。共同下游是生成与导出。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，判定手头输入。有可套用模板 → 模板路径；只有文本讲稿 → 文字成片；有实拍素材与卖点 → 营销成片。判定依据是上游已有产物，不凭偏好选路径。<\/p>\n<p>第二步，走文字成片链推演。粘贴讲稿后，画面选项卡定素材来源与比例；配音选项卡定音色、语速、音量；音乐选项卡定推荐方式；生成后 AI 自动分镜、画面匹配、音频与字幕生成；最后导出。每步检查上游产物是否就位：讲稿分段不清，先补讲稿；素材来源未定，不进配音。<\/p>\n<p>第三步，走模板链推演。打开模板后逐段替换素材与文字，替换内容对齐模板画面位；模板自带节奏、转场、配乐，不另起结构。<\/p>\n<p>第四步，走营销成片链推演。导入产品素材，填产品名称与要点；AI 据此创作文案、匹配素材、完成剪辑；人工检查卖点是否突出。<\/p>\n<p>第五步，返工定位。成片某段不满意时，沿依赖链回退到对应上游：画面错配回画面来源，音色不当回配音，音乐不合回音乐；内容本身有问题回讲稿或素材要点。<\/p>\n<h2>算例<\/h2>\n<p>可复现操作序列（依据 PDF 第 94–102 页）：<\/p>\n<p>任务：企业内训微课视频。<\/p>\n<ol><li>\n输入：内训讲稿一篇。\n<\/li><li>\n画面选项卡：素材来源选在线素材库（无现成素材）；比例 16:9。\n<\/li><li>\n配音选项卡：音色选知性女声；语速、音量按讲稿调整。\n<\/li><li>\n音乐选项卡：选智能推荐。\n<\/li><li>\n生成视频：AI 分析文稿，自动分镜、匹配画面、生成音频与字幕。\n<\/li><li>\n检查：画面与讲稿段落对应，音色自然，音乐不压人声。\n<\/li><li>\n导出：重命名文件，选保存格式，导出 MP4。\n<\/ol>\n<p>量级：讲稿准备是主要人工投入；AI 生成等待为片刻到数分钟，按文稿长度与素材匹配复杂度变化；导出时长取决于成片时长与分辨率。对比顺序颠倒：先配音乐后写稿，讲稿一改，音乐、配音、画面三段返工；按链顺序，单次改动只回退到对应工序。<\/p>\n<p>营销成片算例：导入产品视频素材，填产品名称与核心要点；AI 生成卖点文案并匹配素材；检查卖点突出度，不满意调整要点后重新生成。<\/p>\n<h2>补充推演：返工成本沿工序链放大的机制<\/h2>\n<p>工序链上每个下游环节都消费上游产物。讲稿是画面分段的依据，画面分段是配音节奏的依据，配音音色是音乐匹配的参照。上游改动后，下游产物失去依据：讲稿改了，原分段画面要重配；画面变了，配音节奏要重对；配音变了，音乐情绪要重选。返工不是替换单个素材，而是回退到上游后沿链重做已完成的下游环节。<\/p>\n<p>成本量级推演。假设各环节人工与等待成本相近，改动发生在讲稿阶段，回退距离为零，只改文稿；改动发生在配音阶段，要回讲稿核对分段、重配画面、重选配音、重配音乐；改动发生在导出前，整条链已完成，回退距离最长。越靠后发现内容问题，回退经过的环节越多。流程顺序的意义就是把内容决策尽量推到上游，在下游产物生成之前定稿。<\/p>\n<p>三条路径的依赖差异。模板路径的骨架由模板给定，上游约束是模板段落；替换素材与文字必须对齐模板画面位，不能随意扩展结构。文字成片路径上游是讲稿，AI 按讲稿分段匹配画面。营销成片路径上游是实拍素材与产品要点，AI 据此创作文案；素材与要点不齐，卖点文案没有依据。三条路径上游不同，下游生成与导出环节一致。<\/p>\n<p>生成后确认环节不可省略。AI 自动完成分镜、匹配、音频与字幕，但自动结果不保证贴合：画面可能错配讲稿段落，音色可能不适合内容，音乐可能压住人声。确认环节按画面、配音、音乐、字幕四项逐项检查；发现问题沿依赖链回退对应工序，而不是在成片上硬改。<\/p>\n<p>路径选择的判断依据。手头输入决定路径：有可套模板走模板，只有文本走文字成片，有实拍素材走营销成片。输入条件变化时路径也要变；反过来说，模板套不上内容结构时，硬套模板会出现素材塞不进段落的问题，应换文字成片或营销成片。<\/p>\n<h2>三条路径的输入产出对照<\/h2>\n<p>模板路径输入：现成模板、替换素材、替换文字。产出：套用模板节奏与配乐的成片。适用：有匹配模板、内容结构与模板段落对应。约束：素材与文案按模板位填空，不扩展结构。<\/p>\n<p>文字成片路径输入：讲稿文本。产出：含画面、配音、字幕、背景音乐的完整教学视频。适用：只有文稿、不出镜讲解。约束：画面由在线素材匹配，配音与音乐按文稿推荐。<\/p>\n<p>营销成片路径输入：产品实拍素材、产品名称与要点。产出：卖点突出的带货短视频。适用：有实拍素材、要突出产品卖点。约束：文案由 AI 依据要点生成，要点齐全度决定文案质量。<\/p>\n<p>路径选择推演：先列手头已有产物，再对路径输入要求。缺讲稿先写讲稿，缺素材先补素材；输入不齐就进生成环节，AI 只能按有限信息补全，成片偏差在下游暴露。<\/p>\n<h2>工序排期与返工定位<\/h2>\n<p>排期上把内容定稿放在前半段：讲稿或素材要点确认后，再进入画面配音音乐；包装美化放在最后。发现问题先判断属于哪个工序：画面错配回画面来源，音色不当回配音，音乐不合回音乐，内容本身问题回讲稿素材。不在错误上游未定的情况下继续下游制作。<\/p>\n<p>导出检查清单：画面与讲稿段落对应，配音音色语速合适，音乐不压人声，字幕无明显错漏，比例符合发布平台。清单逐项通过后再命名导出；提前导出会把未确认版本固化，重新导出覆盖前需确认成片目录。<\/p>\n<h2>与相邻概念的衔接<\/h2>\n<p>成片流程的上游素材来自即梦图片与视频（c04–c06）；讲稿质量依赖豆包写作与结构化输出（c01、c03）。流程走完进入字幕与口播精修（c08），再导出分发到飞书协作文档与群聊（c09）。三条路径产出的成片格式一致，差别只在上游输入与 AI 参与环节。<\/p>\n<p>复盘习惯：每次成片后记录卡在哪个工序、返工回退到哪一步；同类素材反复卡在同一环节时，把该环节的前置检查补进流程清单，避免下游重复返工。<\/p>\n<h2>第二算例：企业宣传模板逐段替换（换任务：从文字成片与营销成片换到模板路径）<\/h2>\n<p>任务背景：要做一支企业宣传片，没有现成讲稿与实拍长素材，但有一批公司照片与产品视频，内容结构与常见企业宣传模板对应。与 A 阶段内训微课不同，这条路径的骨架由模板给定，人工动作是替换素材与文字。<\/p>\n<p>步骤序列（依据 PDF 第 90–93 页，书中版本，界面可能已变）：<\/p>\n<ol><li>\n选模板：打开剪映专业版，左侧工具栏选【模板】，搜索框输入“企业宣传”按回车搜索；鼠标悬停在视频封面上预览效果，选定后单击【使用模板】进入编辑界面。\n<\/li><li>\n核对模板段落：轨道区是一整段完整视频轨道，轨道上方是模板使用的所有素材；先通读模板段落顺序，确认公司素材能对应到各素材位。\n<\/li><li>\n替换素材：选中轨道上的素材，单击素材上的【替换】按钮，从计算机文件夹选择自己的公司照片、产品视频；剪映自动把素材填充到对应模板位置。\n<\/li><li>\n修改文字：选中轨道中的完整视频，界面右上方出现【文本】窗格，列出视频中所有文字；删除原有模板文字，输入自己的宣传文案（案例为“锐意进取·2025”），英文文案也替换成对应内容。\n<\/li><li>\n预览确认：单击播放器播放按钮，从头到尾完整预览一遍，核对素材是否填齐、文字是否替换完、节奏与配乐是否贴合。\n<\/li><li>\n导出：确认无误后单击界面右上角【导出】，在对话框命名（案例“企业宣传片”）、选保存位置，再单击【导出】。\n<\/ol>\n<p>判断依据与回退：素材塞不进模板段落，说明内容结构与模板不对应，换文字成片或营销成片路径；替换后某素材位仍空着，回到素材步逐个核对；文字窗格里找不到某句标语，检查是否选中了轨道完整视频；预览发现节奏不符，模板路径不另起结构，换匹配度更高的模板。这一步不做会怎样：不预览直接导出，未替换的模板文字与空缺素材被固化进成片；素材与文案不对应硬套模板，画面位与内容错位，返工要回到模板选择步。<\/p>\n<h2>延伸推演：成片流程成立的三个前置子条件<\/h2>\n<p>按工序链推进能省时，依赖三个子条件先就位。<\/p>\n<p>子条件一：上游输入齐备。模板路径要备替换素材与文案，文字成片要备讲稿，营销成片要备实拍素材与产品要点；输入不齐就进生成环节，AI 只能按有限信息补全，偏差在下游暴露。去掉这个子条件，卡在对应路径的第一步：素材来源未定不进配音，要点不全卖点文案没有依据。<\/p>\n<p>子条件二：路径与手头输入匹配。有可套模板走模板，只有文本走文字成片，有实拍素材走营销成片；输入条件变化时路径也要变。去掉这个子条件，硬套模板会出现素材塞不进段落的问题，硬走文字成片则浪费已有实拍素材。<\/p>\n<p>子条件三：生成后确认环节保留。AI 自动完成分镜、匹配、音频与字幕，但自动结果不保证贴合；画面错配、音色不当、音乐压人声都要人工逐项检查。去掉这个子条件，问题随导出固化，回退距离是整条工序链。<\/p>\n<p>三个子条件对应流程链的入口：输入齐备、路径匹配、确认不省。内容决策尽量推到上游定稿，包装美化放在最后；越靠后发现内容问题，回退经过的环节越多。<\/p>\n<h2>对抗性追问：AI 自动成片后，人工确认环节能不能省掉<\/h2>\n<p>读者反驳：文字成片与营销成片都由 AI 完成分镜、匹配、配音、字幕，生成结果看起来完整，是否可以不逐项检查直接导出。<\/p>\n<p>手册写了什么：三条路径生成后都设有检查与导出环节（PDF 第 94–102 页）；营销成片路径要求人工检查卖点是否突出，不满意调整要点后重新生成（PDF 第 98–102 页）。手册流程把 AI 生成定位为初稿产出，确认环节在导出之前。<\/p>\n<p>补充判断（手册未展开）：确认环节不可省的原因是自动结果不保证贴合。判据按四项过清单：画面与讲稿段落对应、配音音色语速合适、音乐不压人声、字幕无明显错漏；任一项不达标，沿依赖链回退对应工序，不在成片上硬改。AI 参与程度越高，人工检查越要盯住“内容是否贴合本次任务”，而不是只看画面是否完整；提前导出会把未确认版本固化，重新导出覆盖前需确认成片目录。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n手头已有输入是模板、讲稿还是实拍素材？对应哪条路径？\n<\/li><li>\n当前工序的输入是否来自上一步产物；上一步未定就进入下一步会缺什么？\n<\/li><li>\n哪一步改动会连带下游哪些环节返工？\n<\/li><li>\n生成后检查清单是否覆盖画面、配音、音乐、字幕四项？\n<\/li><li>\n导出前是否还有未确认环节；提前导出会固化什么问题？\n<\/ol><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.105<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">成片流程：素材—文案—画面—配音—音乐—导出的顺序决策<\/a><\/span><\/div><h1>字幕识别校对与口播剪辑的对齐成本<\/h1>\n<ul><li>\n<strong>难度<\/strong>：中级 | <strong>涉及章节<\/strong>：第 3 章 | <strong>原书位置<\/strong>：第 8.1 节智能字幕（PDF 第 103–108 页）、第 8.2 节口播剪辑（PDF 第 107–111 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>手动加字幕要逐字听写、对齐时间轴，过程枯燥且容易出错；手动剪口播要反复播放、暂停、切割，删掉“嗯”“啊”、口误重复与长停顿，耗时且容易误删语义换气点。AI 工具把识别与标记交给算法，人工成本集中在校对与判断环节；估算这部分成本、知道哪一步不能跳过，是本章要解决的困难。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>智能字幕流程<\/strong>：导入视频素材并拖入时间轴；在主界面上方功能栏选【文本】，左侧面板【智能文本】下选【智能字幕】，单击【开始识别】；剪映自动分析人声，把识别文字逐条以字幕条形式加到时间轴，并适配视频时长（PDF 第 105–106 页）。<\/p>\n<p><strong>校对环节<\/strong>：识别完成后界面上方出现字幕列表，从上到下通读一遍，发现错别字直接在对应文本框修改。AI 偶尔会识别错误，这一步不可省略（PDF 第 105 页）。<\/p>\n<p><strong>批量美化<\/strong>：在文本窗格基础面板调整字体、字号、颜色、字间距、行间距；勾选“文本、排列、气泡、花字应用到全部字幕”后，一次修改同步到所有字幕条；也可在模板、花字面板套用预设样式（PDF 第 106–107 页）。<\/p>\n<p><strong>智能剪口播流程<\/strong>：导入原始口播视频；算法自动识别语气词、口误重复与长时间停顿，标记无效片段；人工先预览被标记片段，确认取舍，再执行删除（PDF 第 107 页起，书中版本，界面可能已变）。<\/p>\n<h2>原理推导<\/h2>\n<p>字幕成本分两段。识别段由算法完成：语音转文字、切分条目、对齐时间轴，这部分替代人工听写与逐句对位。校对段必须人工：语音识别对同音词、专业术语、口音存在误差，算法不能判断哪个字符合上下文语义；人工通读是把识别结果与原话语义核对一遍。<\/p>\n<p>批量美化降低样式成本。若逐条调整字体字号，每条字幕重复同一操作；勾选应用到全部字幕后，基础样式一次设定统一生效，个别字幕再单独微调。样式统一还避免字幕条之间字体字号参差。<\/p>\n<p>口播成本同样分两段。标记段由算法完成：检测停顿长度、重复片段与语气词位置。判断段必须人工：被标记片段中，停顿可能是语义换气，重复可能是强调，全删会打断语句；人工预览逐段确认，区分该删的卡顿与该留的换气。<\/p>\n<p>两类错误方向不同。字幕错误是文字正确性问题：同音错字、漏字；口播错误是片段取舍问题：误删语义、漏删卡顿。校对与预览分别处理这两类，不能用同一标准检查。<\/p>\n<p>成本估算方法。先按素材时长估算字幕条数：正常语速下字幕条数与语音停顿分段相关，校对时间随条数与错字率增长；口播预览时间随标记片段数量增长。录音清晰、术语常见时错字与误标少，人工轮次少；口音重、专业词多时预留额外通读时间。批量样式设定只占首次配置，不随条数重复。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>智能字幕适合有人声旁白或口播的视频；纯背景音乐画面不需要字幕识别。口播剪辑适合单人讲话类素材；多人对话、留白刻意的片段，标记规则需要人工放宽。<\/p>\n<p>边界有三条。第一，识别结果不是终稿：字幕不校对直接套样式，错字被批量放大进入成片。第二，口播标记不直接全删：换气停顿与强调重复保留，判断依据是语义连贯。第三，算法识别质量受录音清晰度影响：噪音大、口音重时错字率与误标率上升，校对时间相应增加。估算成本时把录音质量作为变量纳入，不在录制阶段压缩人声清晰度来换取后期省事。<\/p>\n<h3>反例<\/h3>\n<p>反例一：字幕识别后不通读直接美化。同音错字随批量样式进入成片，观众看到错字。 反例二：口播标记全删。语义换气点被剪掉，语句衔接生硬，回放时才暴露，需回时间轴恢复。 反例三：字幕样式逐条调。重复劳动且风格不一致；应先批量统一基础样式，再个别调整。<\/p>\n<h2>辨析<\/h2>\n<p>字幕校对与文案改稿的差别：字幕校对改的是识别文字与原话是否一致，不改写表达；文案改稿（c02）调整措辞与结构，发生在写稿阶段。<\/p>\n<p>口播粗剪与精剪的差别：智能剪口播是粗剪，剔除明显无效片段；精剪在粗剪后调整节奏、衔接与镜头取舍。粗剪未做直接精剪，片段数量多、判断负担重。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：成片流程（c07）。后继：数字人讲解（第 8.3 节，PDF 第 112–118 页）同样涉及口型与语音对齐；字幕文本可作为文案素材回流到 AI 写作与纪要整理环节。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（字幕识别校对与口播剪辑的对齐成本）<\/summary><div class=\"depth-body\"><h1>c08 深度片段：对齐成本的依赖链、推导与可复现算例<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>从成片字幕与口播状态倒推人工环节。成片字幕要正确且样式统一，先逆推样式：批量美化一次设定；再逆推文字正确性：校对通读；识别转写与时间轴对齐由算法完成。口播成片要流畅且语义完整，先逆推取舍判断：人工预览；片段标记由算法完成。<\/p>\n<p>逆推链条：成片可用 ← 人工校对/预览 ← 算法识别/标记 ← 原始素材。人工成本只出现在判断段，识别段不占人工；判断段跳过，错误随成片放大。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，导入素材到时间轴，确认人声可被识别：录音清晰、无强背景噪音。素材质量影响后续错字率。<\/p>\n<p>第二步，字幕识别。走文本 → 智能文本 → 智能字幕 → 开始识别；等待识别完成，字幕条逐条出现并适配时长。<\/p>\n<p>第三步，校对。从上到下通读字幕列表，对照原话改错别字；专业术语、人名、产品名重点核对。记录修改条数，估算校对时间与素材时长相关。<\/p>\n<p>第四步，批量美化。基础面板定字体、字号、颜色、字间距、行间距；勾选应用到全部字幕；需要时套模板或花字；个别特殊字幕单独调整。<\/p>\n<p>第五步，口播粗剪（口播素材）。算法标记语气词、口误、重复、长停顿；预览标记片段，该删的删除，换气与强调保留；预览回放确认语句连贯。<\/p>\n<p>第六步，导出前整体回看字幕与口播衔接，确认无错字、无断裂。<\/p>\n<h2>算例<\/h2>\n<p>可复现操作序列（依据 PDF 第 105–108 页；字幕校对与美化 105–107，口播剪辑 107 起）：<\/p>\n<p>字幕算例：<\/p>\n<ol><li>\n素材：一段口播讲解视频，已拖入时间轴。\n<\/li><li>\n识别：【文本】→【智能文本】→【智能字幕】→【开始识别】。\n<\/li><li>\n校对：字幕列表通读，修改同音错字与漏字。\n<\/li><li>\n美化：基础面板选字体（书中案例为新青年体）、预设样式第一种；勾选应用到全部字幕。\n<\/li><li>\n导出：重命名，选保存位置与格式，导出。\n<\/ol>\n<p>成本量级：识别与对齐由算法完成，等待时间按视频长度计；人工校对时间与字幕条数、错字率相关，录音清晰时错字少，口音或术语多时通读轮次增加；样式设定一次完成，逐条微调只占个别条目。<\/p>\n<p>口播算例：<\/p>\n<ol><li>\n导入原始口播视频。\n<\/li><li>\n算法标记无效片段。\n<\/li><li>\n预览标记：语气词、口误、重复删除；语义停顿保留。\n<\/li><li>\n确认删除，回放检查连贯。\n<\/ol>\n<p>对比反事实：不通读直接美化，错字进入成片后需回字幕列表逐条找；不预览全删，断裂语句需回时间轴恢复片段。两类返工都发生在导出前，越晚发现回退越长。<\/p>\n<h2>补充推演：两类人工判断的错误类型与拦截位置<\/h2>\n<p>字幕段的错误是文字正确性错误。语音识别把听到的音节转成文字，同音词、近音词、专业术语、人名产品名容易转成高频常用字；算法不知道上下文哪个字正确，只能由人工对照原话核对。拦截位置在校对环节：通读字幕列表，逐条对照语音或讲稿。若跳过校对，错字随字幕条进入成片，观众直接看到错误文字。<\/p>\n<p>口播段的错误是片段取舍错误。算法按停顿长度、重复模式、语气词位置标记片段，但标记不等于删除：语义换气点表现为停顿，可能被标记；强调性重复可能被当成口误。人工判断依据是语句语义：删掉后句子是否完整连贯，保留后是否影响节奏。误删导致语句断裂，漏删保留卡顿；两类错误方向相反，预览时分别检查。<\/p>\n<p>批量美化的成本机制。字幕样式逐条调整时，每条字幕重复同一组字体字号设置；条目数量随视频时长增长，重复劳动线性增加。勾选应用到全部字幕后，基础样式一次设定覆盖全部条目，重复劳动消除；个别需要特殊样式的字幕再单独调整。顺序上先批量统一，再个别微调，避免逐条调整后又统一覆盖掉个别设置。<\/p>\n<p>录音质量对成本的影响推演。识别错字率与录音清晰度相关：噪音大、口音重、多人重叠时，识别置信度下降，错字与漏字增多，校对轮次增加；口播标记在噪音下也容易误判停顿。录制阶段保证人声清晰，是降低后期校对与预览成本的上游手段；后期工具只能部分弥补录音缺陷。<\/p>\n<p>与精剪环节的分工。智能剪口播是粗剪，目标是剔除明显无效片段；粗剪后才进入节奏、衔接、镜头取舍的精剪。粗剪未做时，时间轴上片段数量多，精剪要在完整素材里逐段判断，负担重；粗剪先剔除卡顿，精剪面对的片段已经过一轮筛选。<\/p>\n<h2>字幕与口播操作对照<\/h2>\n<p>字幕操作顺序：素材导入时间轴 → 文本 → 智能文本 → 智能字幕 → 开始识别 → 字幕列表通读校对 → 基础面板批量设置样式并勾选应用到全部字幕 → 个别字幕微调 → 导出。每步产物：识别后有字幕条与时间轴对齐，校对后文字正确，美化后样式统一。<\/p>\n<p>口播操作顺序：导入原始口播 → 算法标记无效片段 → 预览标记片段 → 确认删除/保留 → 回放连贯检查。每步产物：标记后有候选删除片段，预览后有取舍结论，删除后有流畅口播轨。<\/p>\n<p>两类功能可配合使用。先做口播粗剪剔除卡顿，再对保留下来的人声生成字幕；若先出字幕再剪口播，删除片段后对应字幕条要重新对齐。顺序上粗剪在前、字幕在后，减少字幕返工。<\/p>\n<p>成本量级复盘。识别标记段等待时间按素材时长计；人工校对预览时间与条数、标记数相关。批量样式一次配置，不逐条重复。录音清晰时成本主要在通读；录音质量差时，预留补录或额外校对时间比后期硬修更划算。<\/p>\n<h2>边界补充<\/h2>\n<p>智能字幕依赖人声可被识别：纯音乐、无人声画面不需要走字幕流程；多人重叠说话时识别准确率下降。口播标记只适用于单人讲话类素材，刻意留白、停顿表演的片段不适合按标记全删。校对与预览是人工不可省略的两段：算法负责识别与标记，正确性与取舍判断必须人工完成。录音质量是上游变量，后期功能只能部分弥补；噪音、口音、术语密度升高时，人工轮次与预留时间同步增加。<\/p>\n<h2>与相邻概念的衔接<\/h2>\n<p>字幕与口播是成片流程（c07）生成后的精修环节；字幕文本可回流为文稿素材，对接 AI 写作与纪要整理。数字人讲解环节同样处理语音与口型对齐，判断逻辑与字幕校对相近：先自动生成，再人工核对一致性。<\/p>\n<h2>第二算例：数字人讲解视频的字幕生成与后期校对（换任务：从真人口播素材换到数字人讲解素材）<\/h2>\n<p>任务背景：一段不出镜的课程讲解，用数字人形象生成；与 A 阶段真人录音素材不同，人声与口型由数字人功能生成，字幕在生成环节同步产出，后期要核对的是字幕分段、字号与口型表情。<\/p>\n<p>步骤序列（依据 PDF 第 112–118 页，书中版本，界面可能已变）：<\/p>\n<ol><li>\n进入功能：打开剪映专业版，单击【开始创作】进入编辑界面；左上方功能栏找到并单击【数字人】。\n<\/li><li>\n选形象与场景：【形象】选项中浏览挑选符合内容气质的数字人；【远景/中景/近景/特写】定画面大小，讲解类视频选远景或中景；【背景】选颜色或图片背景，形象自带背景可跳过；单击【下一步】进入配音环节。\n<\/li><li>\n准备文案与音色：【输入文案】框粘贴讲解完整文案，或【上传音频】用已录音频；文案也可让 AI 代写，描述主题与篇幅（案例为 200 字左右）；【音色】选项试听挑选，案例选【感性女生】。\n<\/li><li>\n生成：勾选左下角【同时生成字幕】复选框，单击面板右下方【生成】；首次使用弹出【授权提示】，单击【允许】；等待音频生成、口型匹配与表情演算。\n<\/li><li>\n时间轴核对：生成完毕视频自动加到时间轴；主预览窗口播放，检查嘴型与表情是否自然、声音是否清晰。尺寸不对，点预览窗口右下角【比例】，菜单中选适合平台的比例（案例 9:16 抖音）。\n<\/li><li>\n字幕调整：自动字幕分段不合理或字号效果不合适，选中所有字幕，在右上方【字幕】和【文本】窗格中调整；再按字幕校对流程通读一遍，核对同音词、术语与人名产品名。\n<\/li><li>\n导出：后期制作完成后单击右上角【导出】，输入文件名、选保存地址，导出到本地。\n<\/ol>\n<p>判断依据与回退：嘴型对不上语音，回配音环节检查文案与音频是否一致；字幕错字，走校对环节对照原话修改；分段错位，在【字幕】窗格调整分段；音色不贴合内容，回【音色】选项重新试听挑选。这一步不做会怎样：不勾选同时生成字幕，后期要再走一遍智能字幕识别流程；不通读直接美化，错字随字幕条进入成片；不预览嘴型表情，数字人卡顿或口型错位的片段被保留到导出版本。<\/p>\n<h2>延伸推演：对齐成本成立的三个前置子条件<\/h2>\n<p>人工校对与预览成本可估，依赖三个子条件先成立。<\/p>\n<p>子条件一：人声可被识别。录音清晰、无强背景噪音，识别置信度才有基础；噪音大、口音重、多人重叠时错字与漏字增多。去掉这个子条件，校对轮次随错字率上升，后期工具只能部分弥补录音缺陷。<\/p>\n<p>子条件二：素材属于单人讲话类。口播标记按停顿、重复、语气词位置识别无效片段；多人对话、刻意留白或停顿表演的片段，标记逻辑不适用。去掉这个子条件，误删与漏删方向相反，预览判断负担加重。<\/p>\n<p>子条件三：粗剪在前、字幕在后。先做口播粗剪剔除卡顿，再对保留人声生成字幕；先出字幕再剪口播，删除片段后对应字幕条要重新对齐。去掉这个子条件，字幕返工随片段删除重复发生。<\/p>\n<p>三个子条件对应成本链的上游：音质、素材类型、工序顺序。识别与标记由算法完成，等待时间按素材时长计；人工成本只出现在正确性与取舍判断段，这两段不可省略。<\/p>\n<h2>对抗性追问：自动字幕识别能不能完全替代人工校对<\/h2>\n<p>读者反驳：智能字幕已经逐条生成并适配时长，识别准确率看起来够用，通读校对这一步是否可以省略。<\/p>\n<p>手册写了什么：第 8.1 节明确“AI 偶尔会识别错误，这一步不可省略”，识别完成后要从上到下通读字幕列表，发现错别字直接在对应文本框修改（PDF 第 105 页）。手册把校对列为独立人工环节，没有声称自动识别可替代人工。<\/p>\n<p>补充判断（手册未展开）：不可替代的环节是正确性判断。算法把音节转成文字，同音词、近音词、专业术语、人名产品名容易转成高频常用字；上下文哪个字正确，算法不掌握，只能由人工对照原话或讲稿核对。判据：普通口语素材、录音清晰、无专业名词，校对条目少；术语密集、口音重、多人重叠，预留通读轮次。批量美化可以一次设定覆盖全部字幕，但美化不替代校对——样式统一之前，文字必须先正确。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n当前视频有人声吗？是否需要走智能字幕；纯音乐画面能否跳过？\n<\/li><li>\n校对清单是否覆盖同音词、专业术语、人名产品名？\n<\/li><li>\n批量美化勾选了哪些应用范围？个别字幕是否需要单独调整？\n<\/li><li>\n口播标记片段中，哪些是该删的卡顿，哪些是该留的换气或强调？\n<\/li><li>\n录音质量是否会提高错字率？校对轮次要不要预留？\n<\/ol><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.120<\/div><h1>协同表格与文档：字段约束、多视图与权限继承<\/h1>\n<ul><li>\n<strong>难度<\/strong>：中级 | <strong>涉及章节<\/strong>：第 4 章 | <strong>原书位置<\/strong>：第 9.1 节多维表格电子日历（PDF 第 120–131 页）、第 10.3 节线上协同文档（PDF 第 147–155 页）、第 11.3 节知识传播与权限（PDF 第 170–176 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>多人协作时常见两类数据混乱：一是录入格式不一，同一日期出现多种写法，同一档位出现同义不同词，后续排序、统计、视图生成都失效；二是权限不清，该填的人打不开文档，不该看的人拿到了链接。字段类型、视图与权限继承要解决的困难是：在录入环节挡住不规范数据，在同一份数据源上提供不同看法，在分享时把可见范围与编辑权控制清楚。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>字段与记录<\/strong>：多维表格中行叫记录，列叫字段。每个字段的数据类型是确定的；以日期字段为例，字段名左侧有日历图标，该列只允许输入日期格式数据；其他字段各有类型，字段类型保证数据规范性（PDF 第 121、126 页）。<\/p>\n<p><strong>字段类型约束<\/strong>：同一列中只允许存在同一种字段类型。日期类型只允许规范日期格式；单选类型通过下拉列表快速填写，有效避免重复录入，保证录入内容准确一致。案例电子日历三项基础信息：任务名称（文本类型）、任务日期（日期类型）、重要程度（单选类型，选项为重要紧急、重要不紧急、紧急不重要、不重要不紧急）（PDF 第 123–125 页）。<\/p>\n<p><strong>多视图同源<\/strong>：同一数据源下，视图之间可快速转换以满足不同业务场景。表格视图以行列形式展现数据，用于管理后台数据；日历视图把记录按日期铺到电子日历，直观展示任务排期。切换视图不复制数据，改一条记录，各视图同步更新（PDF 第 121–122 页）。<\/p>\n<p><strong>文档协同与权限<\/strong>：报名表格嵌入协作文档后，成员填写需要可编辑权限；文档分享范围可设为互联网获得链接的人，报名表格需在分享设置中把权限设为【可编辑】，获得链接的成员才有编辑权限（PDF 第 150 页）。<\/p>\n<p><strong>知识库权限继承<\/strong>：知识库一级页面分享后，一级页面下的子页面默认继承上级页面权限，链接分享范围与权限随之变更；不希望某些页面跟随对外开放时，可单独关闭该页面链接分享，页面标记“已限制权限，不再继承父级页面的权限”（PDF 第 172 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>规范数据先在录入环节挡住，成本最低。字段类型把可填内容限定在类型范围内：日期列弹日历选择器，单选列给下拉选项，录入动作变成选择而非自由打字。推演链路：类型约束录入方式 → 录入内容落在规范格式内 → 后续排序、筛选、视图生成在规范数据上成立。若类型约束放开，自由文本混入同义不同写，统计时同一档位要先合并，视图按日期分组会出现散值。<\/p>\n<p>多视图的机制是数据与呈现分离。一份记录数据存一份，视图只是不同排列与展示方式；后台录入用表格视图，日程查看用日历视图。分离后改数据只维护一处，避免多份表格互不同步。<\/p>\n<p>权限机制沿目录层级传递。父级页面设定分享范围后，子页面默认跟随；需要例外的子页面单独关闭继承。推演链路：分享设置在一级页面生效 → 子页面继承 → 单独限制覆盖继承。权限级别与协作动作匹配：只读用于查看，可编辑用于填写；报名表格给只读权限，成员无法录入。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>字段类型约束适合需要后续统计、排序、视图转换的结构化记录；纯文本草稿不需要拆字段。多视图适合同一批数据要服务多种查看场景。权限继承适合层级清晰的知识库目录；例外页面单独设置。<\/p>\n<p>边界有三条。第一，字段类型事后更改不会自动清洗已有不规范数据，混入文本的日期列改类型前需先整理历史记录。第二，视图共享的是同一份数据，权限按文档与知识库整体控制，视图本身不单独限定可见范围。第三，对外分享范围扩大前要确认页面内容是否可公开；继承关闭后，子页面对外不可见。<\/p>\n<h3>反例<\/h3>\n<p>反例一：重要程度列用自由文本。“很急”“一般般”“紧急”同义不同写，后续按档位统计无法归类。 反例二：报名文档保持只读。成员打开链接只能查看，报名信息仍需收集人手动汇总。 反例三：知识库子页面跟随父级全部公开。含内部信息的子页面未单独限制，随一级链接对外可见。<\/p>\n<h2>辨析<\/h2>\n<p>字段类型与格式排版的差别：字段类型约束数据内容种类，字体字号等排版样式在文档界面另行设置；前者保证可统计，后者保证可读性。<\/p>\n<p>视图与副本的差别：视图不复制数据；另存副本才产生第二份数据，两份之间不会自动同步。<\/p>\n<p>权限继承与单独授权的差别：继承是默认跟随父级，单独授权是对子页面覆盖设置；先继承后例外，例外优先。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：结构化输出（c03）的条目骨架落到表格字段。后继：扣子知识库（c10）的资料单元与分段建立在规范文档结构之上；工作流收集的表单数据回写到多维表格，由字段类型约束入库内容。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（协同表格与文档：字段约束、多视图与权限继承）<\/summary><div class=\"depth-body\"><h1>c09 深度片段：表格与协同权限的依赖链、推导与可复现算例<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>从协作终态倒推配置项。终态：数据可统计、多人查看场景不同、填写与可见范围受控。先逆推统计可行性：依赖字段类型规范录入；再逆推多场景查看：依赖同一数据源加多个视图；再逆推协作受控：依赖文档权限级别与知识库目录继承。<\/p>\n<p>逆推链条：可统计可协作 ← 字段类型 ← 录入方式选择化；多视图 ← 数据与呈现分离；权限受控 ← 分享范围 + 编辑级别 + 继承例外。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，梳理要记录的信息项。日程案例拆出任务名称、任务日期、重要程度三项；先确定每项内容性质，再配字段类型。<\/p>\n<p>第二步，配字段类型。名称是自由文本 → 文本；日期需要日历选择 → 日期；重要程度是有限档位 → 单选并添加选项。类型决定录入控件：文本双击单元格录入，日期弹日历对话框，单选走下拉列表。<\/p>\n<p>第三步，建视图。默认表格视图用于后台录入；需要日程展示时新建日历视图，按日期字段排布记录。两视图读同一数据源。<\/p>\n<p>第四步，嵌入文档与分享。协作文档中加入报名表格；按协作动作设权限：查看用只读，填写用可编辑；分享范围按参与人员范围选择。<\/p>\n<p>第五步，知识库目录权限。一级页面设定对外分享后检查子页面；需保密的子页面关闭链接分享，脱离继承。<\/p>\n<h2>算例<\/h2>\n<p>可复现操作序列（依据 PDF 第 122–126、150、171–172 页）：<\/p>\n<p>表格算例：<\/p>\n<ol><li>\n新建空白多维表格。\n<\/li><li>\n配置字段：文本字段改名“任务名称”，类型文本；单选字段改名“任务日期”，类型日期（书中操作路径）；日期字段改名“重要程度”，类型单选，添加四个选项：重要紧急、重要不紧急、紧急不重要、不重要不紧急；删除多余附件字段。\n<\/li><li>\n录入记录：任务名称双击录入；日期字段日历选择；重要程度下拉选择。\n<\/li><li>\n切换日历视图查看排期。\n<\/ol>\n<p>权限算例：<\/p>\n<ol><li>\n团建文档内嵌活动报名多维表格，表头依次为姓名、联系方式、前往方式、备注。\n<\/li><li>\n文档右上角【分享】，把文档分享权限设为【可编辑】，获得链接成员可填写。\n<\/li><li>\n知识库：一级页面开启链接分享，子页面默认继承；选中“新人任务”子页面，关闭链接分享，确认“已限制权限，不再继承父级页面权限”。\n<\/ol>\n<p>量级：字段配置一次完成；录入阶段选择式录入减少重复填写；视图切换即时生效。对比无类型约束：自由录入后再清洗同义选项与日期格式，工作量前置到统计阶段，成本高于录入时选择。<\/p>\n<h2>补充推演：类型约束、视图分离与权限继承的连锁影响<\/h2>\n<p>字段类型是数据规范的第一道闸。录入阶段选择化控件把可填内容限制在类型范围内：日期列弹日历，不接受自由文本日期；单选列给固定选项，不接受自造档位。规范在录入时成立，后续统计、排序、视图分组才有一致的取值基础。若类型约束放开，同义不同写进入数据，清洗工作后移到统计阶段，同一档位要先合并归并，日期散值无法直接分组。<\/p>\n<p>历史数据的处理边界。字段类型是对该列取值范围的约束，事后改类型不会自动转换已有内容。日期列里混入“八月底”这类文本，改成日期类型前要先逐条整理为规范日期；不整理就改类型，非法取值要么报错要么保留为异常记录。类型配置应在录入前完成，历史脏数据先清洗再切换。<\/p>\n<p>视图分离的机制再展开。一份记录数据存一处，表格视图与日历视图是两种展示方式：表格视图行列排列适合录入核对，日历视图按日期铺排适合查看排期。切换视图不复制数据，修改一条记录在所有视图同步。若用多份表格分别维护后台记录与日程，两份数据会逐渐不同步；视图分离消除了复制维护成本。<\/p>\n<p>文档嵌入与权限级别。报名表格嵌在协作文档中，成员通过文档链接进入填写。权限级别必须匹配动作：只读允许查看，可编辑允许录入。报名场景给只读，成员看到表格但无法填行，信息回流仍靠收集人手动汇总；可编辑权限下成员直接录入，表格数据实时汇总。分享范围决定谁能拿到链接，编辑级别决定拿到链接后能做什么，两个设置分开判断。<\/p>\n<p>知识库目录继承推演。目录有层级时，一级页面分享设定作用于整棵子树：子页面默认继承链接范围与权限。继承减少逐页重复设置；需要例外的保密子页面单独关闭链接分享，关闭后页面脱离继承，对外不可见。例外设置优先于继承。推演时先按目录分层判断哪些页面可公开，哪些需限制；整棵树开放前检查叶子页面内容。<\/p>\n<p>协同数据与自动化的衔接。表格收集到的结构化记录，字段类型规范后可被后续流程读取；工作流或智能体调用表格数据时，取值一致是可靠输入的前提。权限设置同时约束自动化访问范围：可编辑表格才能被流程写入，只读表格只供读取。<\/p>\n<h2>表格配置与权限设置复盘<\/h2>\n<p>字段配置复盘：先列信息项，再配类型。任务名称是自由文本 → 文本；任务日期需要日历选择 → 日期；重要程度档位有限 → 单选并逐项添加选项。配置完成后用一条测试记录验证控件：文本列可打字，日期列弹日历，单选列只能从选项选；控件行为与类型一致，配置才算生效。<\/p>\n<p>视图复盘：表格视图先用于录入核对；需要日程展示时建日历视图，确认日期字段作为排期依据。切换视图检查同一条记录在两个视图都出现；若某视图缺记录，先查筛选条件而不是重复录入。<\/p>\n<p>权限复盘三步：确认协作者动作（查看或填写）→ 匹配级别（只读或可编辑）→ 确认分享范围（哪些人拿到链接）。文档内嵌表格时，表格权限跟随文档分享设置；单独协作者权限在分享对话框中调整。<\/p>\n<p>知识库权限复盘：一级页面公开后，逐个子页面判断是否可公开；保密页面关闭链接分享并确认提示“已限制权限，不再继承父级页面权限”。对外分享的卡片会标记公开状态，发布前核对标记与预期一致。<\/p>\n<p>常见遗留问题：历史自由文本混入类型列，先清洗再改类型；视图筛选临时隐藏记录，不代表数据删除；子页面关闭继承后，父级重新公开不会自动恢复该子页面。<\/p>\n<h2>边界补充<\/h2>\n<p>字段类型约束的是数据内容种类，不替代文档排版；字体、对齐等样式在界面另行设置。视图共享同一份数据源，视图本身不单独限定可见范围，权限按文档与知识库整体控制。历史脏数据不会随类型切换自动清洗，改类型前先整理。对外分享扩大范围前，逐页确认内容是否可公开；继承关闭后的子页面不会随父级重新公开而自动恢复。<\/p>\n<p>协同表格写入自动化流程前，先确认字段取值规范与表格权限；自由文本列产出的取值不稳定，不宜作为流程读取的结构化输入。<\/p>\n<h2>与相邻概念的衔接<\/h2>\n<p>表格字段与文档结构是扣子知识库（c10）的上游：入库资料先按字段或章节整理成规范单元，分段检索才有完整语义。协同权限思路在智能体发布渠道上同样适用：分享范围与编辑级别按使用动作匹配。<\/p>\n<h2>第二算例：社团活动报名表的字段、视图与权限（换任务：从电子日历任务表换到活动报名表）<\/h2>\n<p>任务背景：一次线下社团活动要收集报名信息，报名表嵌在活动通知文档里，成员点链接自行填写。与 A 阶段日程表不同，这张表的重点是录入选项规范与填写权限，不做日程铺排。<\/p>\n<p>步骤序列：<\/p>\n<ol><li>\n列信息项：报名表要收姓名、联系方式、前往方式、是否住宿、备注五项；先判断每项内容性质，再配字段类型。\n<\/li><li>\n配字段类型：“姓名”“联系方式”“备注”是自由文本，配文本类型；“前往方式”是有限档位，配单选并添加选项：自驾、公交、步行；“是否住宿”配单选，选项：是、否。不把有限档位留成文本，避免同一意思出现多种写法。\n<\/li><li>\n录入方式核对：文本列双击单元格录入；单选列走下拉列表选择；若本次活动有截止时间，另加日期字段，弹日历对话框选择。\n<\/li><li>\n建视图：表格视图用于后台核对报名记录；需要按前往方式统计时，用视图按单选字段分组查看；切换视图不复制数据，改一条记录各视图同步。\n<\/li><li>\n嵌入文档与权限：报名表嵌入活动通知文档；确认协作者动作是填写，把文档分享权限设为【可编辑】，获得链接的成员才能录入；只查看的场景另设只读（PDF 第 150 页）。\n<\/li><li>\n范围核对：分享范围按参与人员范围选择；若报名信息放进知识库目录，一级页面公开后逐个子页面判断，需保密的子页面单独关闭链接分享，确认“已限制权限，不再继承父级页面权限”（PDF 第 172 页）。\n<\/ol>\n<p>判断依据与回退：同一档位出现多种写法，检查单选列是否被改成文本；记录在某个视图缺失，先查视图筛选条件，不重复录入；成员看到表格但填不进去，核对编辑级别是否误设为只读；子页面随父级公开后不可见，检查是否关闭了继承。这一步不做会怎样：字段不设类型，汇总阶段要先归并同义选项；权限给只读，信息回流靠收集人手动汇总；目录层级不先分层，整棵树公开后才发现保密页面已外露。<\/p>\n<h2>延伸推演：协同配置成立的三个前置子条件<\/h2>\n<p>字段、视图、权限能生效，依赖三个子条件先明确。<\/p>\n<p>子条件一：目录与数据表结构先定。知识库权限继承沿目录层级生效，表格字段按信息项配置；结构未定时先搭层级与列项，再设权限与类型。去掉这个子条件，边填边改字段类型与目录归属，已录入记录的归属与取值都要回头整理。<\/p>\n<p>子条件二：协作动作与权限级别匹配。查看对应只读，填写对应可编辑；动作判断错，级别就配错。去掉这个子条件，报名场景给只读导致无法填行，或给过宽编辑导致记录被误改。<\/p>\n<p>子条件三：分享范围与编辑级别分开判断。谁能拿到链接由分享范围定，拿到链接后能做什么由编辑级别定；两个设置混为一谈，容易出现范围对了级别错、或级别对了范围宽。去掉这个子条件，权限配置只过一项判断，例外场景覆盖不到。<\/p>\n<p>三个子条件对应协同链的三步：结构先行、动作配级别、范围与级别分离。历史脏数据不会随类型切换自动清洗，改类型前先整理已有记录。<\/p>\n<h2>对抗性追问：字段类型和权限能不能先放开、事后再补<\/h2>\n<p>读者反驳：先让大家自由填表，录入快；等数据攒起来再补字段类型、再收权限，是否可行。<\/p>\n<p>手册写了什么：多维表格字段类型保证数据规范性，单选通过下拉列表快速填写、避免重复录入（PDF 第 121、126 页）；文档权限按查看与填写分级别，知识库子页面可脱离继承单独限制（PDF 第 150、171–172 页）。手册流程把类型与权限配置放在录入与分享之前。<\/p>\n<p>补充判断（手册未展开）：事后补配置的成本前置到统计阶段。判据分两类：类型补设前，自由文本列已混入同义不同写与非规范日期，改成类型前要逐条清洗，清洗工作量高于录入时选择；权限事后收紧，已扩散的链接与已录入记录范围无法自动收回，公开过的页面要重新核对可见内容。可接受事后补的是展示层设置（视图顺序、样式），不可接受事后补的是数据规范与访问范围。自由文本列产出的取值不稳定，不宜作为后续自动化流程读取的结构化输入。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n每一列记录的信息属于自由文本、日期还是有限档位？字段类型是否匹配？\n<\/li><li>\n哪些视图服务什么查看场景？它们是否共用同一份数据？\n<\/li><li>\n协作者动作是查看还是填写？对应只读还是可编辑？\n<\/li><li>\n知识库子页面哪些应继承父级公开，哪些需单独限制？\n<\/li><li>\n历史数据混入不规范内容时，改字段类型前要先做什么整理？\n<\/ol><\/div><\/details>", "c10": "<div class=\"source-badge\">📖 出处：AI提效手册豆包 即梦 剪映 飞书扣子5合1实操指南 (秋叶 刘晓阳) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.178<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">结构化输出与模板复用<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">协同表格与文档：字段约束、多视图与权限继承<\/a><\/span><\/div><h1>扣子智能体与工作流：节点、变量传递、知识库检索与触发条件<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章 | <strong>原书位置<\/strong>：第 12.1 节公文大师（PDF 第 178–187 页）、第 12.2 节产品专家知识库（PDF 第 187–196 页）、第 12.3 节行业日报触发器（PDF 第 196–204 页）、第 13.1 节情商教练工作流（PDF 第 205–212 页）、第 13.2 节营销海报工作流（PDF 第 212–219 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>通用 AI 工具解决不了岗位特有的业务问题：公文有固定格式规范，产品答疑必须依据私有资料，日报要定时自动收集新闻；重复的沟通与分析又占用大量时间。扣子平台提供两条路径：把提示词、模型、技能固定成专属智能体；把多步处理拆成节点连成工作流。本章要解决的困难是：判断任务该做成智能体还是工作流，节点之间如何交接信息，知识库如何约束回答边界，触发条件如何设定自动执行。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>智能体搭建链路<\/strong>：先分析需求（核心问题、扮演角色、理想输出）；创建智能体；选工作模式；写人设与回复逻辑；选模型；配置技能；优化开场白与预置问题；多轮测试后发布（PDF 第 178–187 页）。<\/p>\n<p><strong>三种工作模式<\/strong>（PDF 第 180 页）：单 Agent（自主规划模式）行为由人设与回复逻辑决定，最灵活，适合开放式对话与创意生成；单 Agent（对话流模式）由预先编排的工作流严格控制，输出稳定一致，适合固定步骤流程化任务；多 Agents 可设多个子智能体，按意图调度，适合复杂集成应用。<\/p>\n<p><strong>人设四段式<\/strong>：角色（身份、背景、专业领域）、技能（明确动词分点列出核心能力）、示例（一两个输入输出范例）、限制（行为边界，不能做什么或必须遵守的规则）（PDF 第 180 页）。<\/p>\n<p><strong>技能<\/strong>：插件是官方或第三方工具，实现联网搜索、图片生成等功能；知识库是上传文档、表格、图片后供智能体基于私有内容回答（PDF 第 169–170、176 页）。<\/p>\n<p><strong>工作流节点与变量<\/strong>：画布默认有开始节点与结束节点；添加大模型节点、图像生成节点后连线。开始节点定义输入变量（名、类型）；大模型节点在输入中引用上游变量，系统提示词写岗位职责，用户提示词用 {{变量名}} 引用，输出命名新变量并定类型；结束节点指定交付变量引用（PDF 第 208–210、215–217 页）。<\/p>\n<p><strong>知识库检索与兜底<\/strong>：资料先整理成标准单元再入库。产品专家案例用提示词把文档整理成知识卡片：每个单元含功能模块、问题摘要、详细说明，单元间用“===”分隔符（PDF 第 188 页）。入库时分段策略选自定义，分段标识符填“===”，分段预览检查切片划分，再完成数据处理（PDF 第 193 页）。人设要求先检索库内条款再回答，检索不到按兜底话术回应，不凭通用知识编造（PDF 第 181 页）。<\/p>\n<p><strong>触发器<\/strong>：定时触发按时间自动执行任务。行业日报案例设定每天 17:00 由机器人提示推送人工智能行业新闻（PDF 第 200–201 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>智能体机制：人设是模型的工作边界，模型在边界内理解用户意图并调度技能；模式决定边界内的自主程度。自主规划留给模型组织流程，对话流把流程固定在工作流里。需求分析先于人设：角色、能力、边界都从核心问题与理想输出推出来。<\/p>\n<p>工作流机制：节点职责单一，变量是节点间交接单据。上游输出变量名必须被下游引用名对上；开始节点把外部输入命名入库，大模型节点把处理结果命名输出，图像节点接收提示词变量出图，结束节点指定交付变量。链路任一节点变量缺失，下游拿到空输入。<\/p>\n<p>知识库机制：私有资料先结构化再分段，检索时按问题匹配切片，回答限定在检索到的条款内。兜底分支处理检索不到的情况：预设话术告知未查询到并引导人工，避免模型用通用知识补全。分段质量影响检索：格式混乱的文档切片后语义不完整，回答质量下降。<\/p>\n<p>智能体与工作流分工：开放式、意图灵活的任务用智能体；步骤固定、职责分段明确的任务用工作流；工作流可绑定到智能体中调用（PDF 第 198、205 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>智能体适合对话式、需求表述有变化的岗位助手；工作流适合输入输出明确、节点可拆的重复流程。知识库适合有私有资料且要求回答可溯源的问答场景；资料需定期更新时存入在线文档便于维护（PDF 第 188–189 页）。<\/p>\n<p>边界有三条。第一，模型选择按场景：通用默认豆包 1.5·Pro·32k，快速响应选 Lite 标签模型，长文本选 128k/256k 标签模型，代码、角色扮演、逻辑推理、视觉理解各有侧重（PDF 第 182 页，书中版本，模型名单可能已更新）。第二，知识库不保证覆盖所有问题，库外问题必须走兜底。第三，工作流试运行通过前不发布；节点提示词不满意回到对应节点打磨，不在错误结果上继续接下游。<\/p>\n<h3>反例<\/h3>\n<p>反例一：需求未分析就写人设。角色技能边界没有问题依据，回答范围发散，测试阶段反复返工。 反例二：工作流变量名上下游对不上。下游引用空值，节点报错或输出空结果，需试运行逐节点定位。 反例三：知识库不设兜底限制。检索不到产品条款时模型凭通用知识作答，答案与私有资料不符。<\/p>\n<h2>辨析<\/h2>\n<p>智能体与工作流的差别：智能体由模型自主组织对话流程；工作流由画布节点固定流程，模型只是其中一类节点。前者灵活，后者稳定可复现。<\/p>\n<p>插件与知识库的差别：插件连接外部工具与实时信息；知识库提供私有静态资料。产品答疑靠知识库，联网新闻靠插件，日报案例两者可配合。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：结构化输出（c03）、协同表格与文档（c09）。后继：智能体与工作流发布后接入飞书群聊与文档闭环；图像生成节点复用即梦模型与参数约定（c05）；知识库资料结构沿用飞书文档规范（c09）。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（扣子智能体与工作流：节点、变量传递、知识库检索与触发条件）<\/summary><div class=\"depth-body\"><h1>c10 深度片段：智能体与工作流的依赖链、推导与可复现算例<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>从上线后的稳定助手倒推配置项。助手回答符合岗位规范，先逆推边界来自人设四段式；人设来自需求分析；能力边界之外由兜底与知识库限制。再倒推自动化链路：工作流交付结果依赖节点变量交接，节点职责依赖系统提示词，输入依赖开始节点定义。定时运行依赖触发器设定。<\/p>\n<p>逆推链条：稳定上线 ← 测试通过 ← 人设/模型/技能/知识库配置 ← 需求分析；工作流结果 ← 结束节点交付变量 ← 各节点输出变量 ← 开始节点输入；自动推送 ← 触发器条件。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，需求分析。写清核心问题（什么任务费时易错）、扮演角色（专家身份类比）、理想输出（结构、格式、专业程度）。需求三项决定后续模式与人设。<\/p>\n<p>第二步，选模式。开放对话、创意生成选自主规划；固定步骤流程化选对话流；多子职能调度选多 Agents。公文写作既要规范框架又要按需求灵活成段，选自主规划（PDF 第 180 页）。<\/p>\n<p>第三步，写人设。角色段定身份领域；技能段动词分点；示例段给输入输出范例；限制段写禁区与规则。产品专家人设额外要求：先检索知识库，回答基于检索内容，引用原文以资料来源开头，检索不到用兜底话术（PDF 第 181 页）。<\/p>\n<p>第四步，选模型与技能。通用问答用默认综合模型；按长文本、代码、推理、视觉等场景另选。需要联网或出图加插件，需要私有资料加知识库。<\/p>\n<p>第五步，配知识库。原始文档汇总后，先用 AI 整理成功能模块—问题摘要—详细说明单元，“===”分隔；创建知识库选文本格式，本地文档或飞书导入；分段策略自定义，标识符“===”；分段预览核对切片；数据处理完成后在人设中引用知识库。<\/p>\n<p>第六步，沟通功能与测试。写开场白与预置问题；预览区多轮测试：库内问题检查准确性与资料来源，库外问题检查兜底话术；不符预期回到人设调整，循环到通过后发布。<\/p>\n<p>第七步，工作流搭建。资源库新建工作流；画布从开始节点起，加大模型节点并连线；开始节点定输入变量；大模型节点引用输入、填系统提示词与用户提示词 {{变量}}、命名输出变量；需要出图加图像生成节点接收提示词变量；结束节点引用交付变量。试运行填输入，逐节点检查输入输出，不满意回对应节点系统提示词打磨；通过后发布并绑定智能体。<\/p>\n<h2>算例<\/h2>\n<p>算例 A 公文大师智能体（PDF 第 178–187 页）：<\/p>\n<ol><li>\n需求：公文格式语气规范、费时易错；角色为公文写作专家；输出结构完整、格式正确的初稿。\n<\/li><li>\n模式：单 Agent 自主规划。\n<\/li><li>\n人设：角色资深办公室主任；技能按请示/报告/纪要分类写作，规范用词，结构完整；示例给上级机关总结范例；限制只输出完整公文初稿，不口语化，不编造政策法规。\n<\/li><li>\n模型：默认豆包 1.5·Pro·32k；无需联网与私有文档，不配技能。\n<\/li><li>\n开场白与预置问题；测试“部门申请采购 5 台新电脑”，检查格式语气；发布可填更新日志，平台审核后上岗。\n<\/ol>\n<p>算例 B 营销海报工作流（PDF 第 214–218 页）：<\/p>\n<ol><li>\n开始节点：chanpin（产品）、renqun（人群），类型 str.String。\n<\/li><li>\n市场分析师大模型：输入引用 chanpin、renqun；用户提示词“产品名称:{{chanpin}}，目标人群:{{renqun}}”；输出 tongdian（痛点）。\n<\/li><li>\n金牌策略师大模型：输入 chanpin、renqun、tongdian；输出 tishici（提示词）。\n<\/li><li>\n视觉设计师图像生成：模型 Seedream 4.0，比例 9:16，宽 1440、高 2560，最多 4 张；输入 tishici，提示词 {{tishici}}。\n<\/li><li>\n结束节点：输出变量 haibao，引用视觉设计师 data。\n<\/li><li>\n试运行：填产品与人群，逐节点检查痛点、提示词、海报；通过后发布绑定智能体。\n<\/ol>\n<p>算例 C 定时日报（PDF 第 196–204 页）：角色行业情报分析师；技能含关键词提取、新闻搜索（getToutiaoNews 插件）、信息筛选、内容提炼、报告撰写；触发器定时触发，每天 17:00，机器人提示推送行业新闻；测试观察是否调用插件，发布到飞书后群聊 @ 使用。<\/p>\n<p>量级：智能体配置与测试为一次性投入；工作流节点搭建后重复运行，每次运行耗时按模型调用与图像生成复杂度变化；知识库整理与分段是入库前一次性工作。<\/p>\n<h2>补充推演：智能体边界、工作流交接与知识库兜底的机制<\/h2>\n<p>智能体自主程度由模式决定。自主规划模式下，模型按人设理解意图、组织回答并调度技能，流程不固定，适合用户表述有变化的对话场景；对话流模式下，流程由工作流预先编排，模型在固定步骤内执行，输出稳定一致；多 Agents 按意图把子任务分给不同子智能体。模式选择对应任务的流程稳定程度：流程越固定，越适合对话流或工作流；意图越开放，越适合自主规划。<\/p>\n<p>人设四段的分工。角色段定身份与领域，决定回答视角；技能段用动词分点列能力，决定能做什么；示例段给输入输出范例，把格式与风格具体化；限制段写禁区与规则，决定不能做什么。四段缺限制时，模型可能回答超出业务范围的内容；缺示例时，格式与风格靠描述猜测。<\/p>\n<p>工作流变量交接机制。开始节点把外部输入命名为变量，类型固定（如 str.String）；大模型节点在输入区引用上游变量，系统提示词写岗位职责，用户提示词用 {{变量名}} 把当前输入传入，输出命名新变量并定类型；下游节点按变量名引用上游输出。变量名是节点间的单据编号：上游输出名与下游引用名一致，单据才能传递；对不上时下游拿到空值。试运行逐节点查看输入输出，就是核对每张单据是否传到、内容是否正确。<\/p>\n<p>知识库检索与兜底机制。私有资料先整理成标准单元，单元内功能模块、问题摘要、详细说明齐备；分段按标识符切分，切片预览确认每个单元完整入库。回答时先检索匹配切片，回答限定在检索内容内，引用标明资料来源。检索不到时，限制段要求按兜底话术回应并引导人工，禁止用通用知识补全。分段质量影响检索：文档格式混乱，切片语义不完整，检索命中后回答也会偏离。<\/p>\n<p>插件与知识库的分工。插件连接外部工具与实时信息（联网搜索、图片生成）；知识库提供私有静态资料。产品答疑依据知识库，新闻收集依据插件；行业日报案例用新闻插件取实时资讯，知识库则用于固定产品条款问答。两者可在同一智能体上并存，按技能段描述调用条件。<\/p>\n<p>触发条件机制。触发器按设定条件自动唤起智能体：定时触发在指定时间由机器人提示执行任务。触发后走的仍是已配置好的人设、技能与流程；触发器解决“什么时候自动做”，不改变“怎么做”。测试时先手动试运行确认流程通过，再挂触发器，避免定时任务按未调好的流程反复执行。<\/p>\n<h2>搭建复盘与发布前检查<\/h2>\n<p>智能体发布前检查清单：需求三项是否写清；模式是否匹配流程稳定程度；人设四段是否齐全；模型是否对应场景；技能（插件/知识库）是否配齐；开场白与预置问题是否引导使用；库内问题回答是否附来源，库外问题是否走兜底。清单逐项通过再发布。<\/p>\n<p>工作流试运行检查：开始节点输入变量名与类型；每个大模型节点输入引用是否来自正确上游，输出变量名是否被下游引用；图像节点是否收到提示词变量；结束节点交付变量是否指向最终产物。逐节点查看输入输出，偏差定位到具体节点修改系统提示词，不跨节点猜测。<\/p>\n<p>知识库入库前检查：资料是否整理成标准单元；分隔符是否与分段策略一致；分段预览切片是否完整；兜底话术是否写入限制段。资料定期更新时维护在线文档版本，避免知识库停留在旧版条款。<\/p>\n<p>上线后迭代方式：收集实际问答与调用记录，回答不符合预期时回到人设或知识库调整；工作流结果偏差回到对应节点提示词；触发器任务先手动试运行通过再挂定时。<\/p>\n<h2>与相邻概念的衔接<\/h2>\n<p>智能体人设四段承接 c01 提示词三步骤与 c03 结构化输出；工作流变量交接承接 c03 的固定条目；知识库资料结构承接 c09 飞书文档规范。发布后产物分发回飞书群聊与文档，形成协同闭环。<\/p>\n<h2>第二算例：“AI 情商教练”单节点工作流（换任务：从多节点营销海报链换到单节点话术分析链）<\/h2>\n<p>任务背景：职场沟通中需要分析一段老板原话的潜在意图与风险，并给出得体回应；输入输出明确、职责可拆成固定三步，适合工作流。与 A 阶段营销海报三节点链不同，这条链只有一个大模型节点，变量交接更短。<\/p>\n<p>工作逻辑（PDF 第 205–206 页）：接收场景对话内容 → “AI 情商教练”分析思考 → 给出分析结果和应对策略。<\/p>\n<p>步骤序列（依据 PDF 第 206–212 页，书中版本，界面可能已变）：<\/p>\n<ol><li>\n建工作流：扣子主页左侧导航栏单击【资源库】，右上角【+ 资源】，下拉菜单选【工作流】；对话框输入名称“EQ_Coach”与工作流描述，单击【确认】；画布默认带【开始】【结束】节点。\n<\/li><li>\n加节点连线：画布下方【+ 添加节点】选【大模型】；鼠标从开始节点输出端口（右侧圆点）拖一条线连到大模型节点输入端口（左侧圆点），再连到结束节点。\n<\/li><li>\n定输入变量：单击【开始】节点，把默认输入名 input 改成 huashu（话术），类型 str.String；这是接收原话的“收件箱”。\n<\/li><li>\n配大模型节点：模型选默认综合能力不错的“豆包·1.5·Pro·32k”；输入区变量名引用开始节点的 huashu；系统提示词粘贴“高情商教练行为准则”，含专家人设、分析框架、优秀案例；用户提示词填“{{huashu}}”，标明要分析的话是什么。\n<\/li><li>\n定输出变量：大模型节点输出命名 fanyi（翻译），类型保持 str.String；【结束】节点输出设置为 str.fanyi，指向大模型分析结果。\n<\/li><li>\n试运行：画布底部中央【试运行】，在 huashu 输入框粘贴老板原话，单击【试运行】；预览对话框查看报告是否含积极解读、风险解读、高情商应对建议；不满意回到大模型节点打磨系统提示词，循环到通过。\n<\/li><li>\n发布绑定：右上角【发布】，填版本描述后确认；再把工作流添加到合适的智能体中，在智能体里调用做话术分析。\n<\/ol>\n<p>判断依据与回退：试运行拿到空值，先核对开始节点输出名与大模型输入引用名是否一致；报告缺解读维度，回系统提示词补分析框架；建议不得体，回系统提示词补行为准则与案例；输出对不上交付物，检查结束节点交付变量是否指向 fanyi。这一步不做会怎样：变量名对不上，下游拿到空值，流程在节点间断单；系统提示词只写“分析一下”，输出停留在字面翻译；试运行未通过就发布，工作流按未调好的流程反复执行；不绑定智能体，工作流只能在画布内手动跑。<\/p>\n<h2>延伸推演：工作流成立的三个前置子条件<\/h2>\n<p>节点链能跑通，依赖三个子条件先满足。<\/p>\n<p>子条件一：变量在同名节点间交接。开始节点命名输入变量并定类型，大模型节点按变量名引用上游输出，输出再命名新变量供下游引用；变量名是节点间的单据编号。去掉这个子条件，上游输出名与下游引用名对不上，下游拿到空值，断点出现在连线后的第一个节点。<\/p>\n<p>子条件二：职责可拆成节点。固定步骤、职责分段明确的任务才适合工作流；每段职责能写成节点系统提示词。去掉这个子条件，任务意图开放、步骤随对话变化，硬拆节点会把灵活判断锁死在固定流程里。<\/p>\n<p>子条件三：试运行通过再发布与挂触发。先手动填输入逐节点检查输入输出，通过后再发布；定时任务先确认流程稳定，再挂触发器。去掉这个子条件，未调好的流程被定时反复执行，错误结果按固定节奏推送。<\/p>\n<p>三个子条件对应自动化链的三步：单据同名、职责可拆、先测后发。触发器解决“什么时候自动做”，不改变“怎么做”；工作流适合重复流程，开放对话仍走智能体自主规划。<\/p>\n<h2>对抗性追问：工作流能不能替代人的判断<\/h2>\n<p>读者反驳：工作流把分析、策略、出图都拆成节点自动执行，流程跑通后，人的判断是否可以退出这条链路。<\/p>\n<p>手册写了什么：第 13 章把重复但必要的事务交给自动化，智能体与工作流分工为：开放式、意图灵活的任务用智能体，步骤固定、输入输出明确的任务用工作流（PDF 第 198、205 页）；产品答疑要求先检索知识库、检索不到走兜底话术，不凭通用知识编造（PDF 第 181 页）。<\/p>\n<p>补充判断（手册未展开）：工作流替代的是固定步骤的执行，不替代环节上的判断。判据按三类分工：流程内的格式、分段、变量交接由节点保证；内容质量判断（建议是否得体、策略是否符合当时情境、产出是否可用）由人在试运行与上线后检查；知识库覆盖之外的问题走兜底并引导人工，不用流程输出补全。情商教练这类分析链，报告是分析参照，最终回应仍由当事人按场合决定；自动化链路收集的是效率，判断责任留在人这一侧。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n任务是开放对话还是固定流程？该选智能体自主规划、对话流还是工作流？\n<\/li><li>\n人设四段是否齐全；限制段写清了哪些不能做？\n<\/li><li>\n工作流每个节点的输入变量来自哪个上游节点，输出变量名是什么？\n<\/li><li>\n知识库切片按什么分隔；库外问题兜底话术是否写入限制？\n<\/li><li>\n试运行逐节点检查了哪些输入输出；哪一环节不满意应回到哪个节点调整？\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：豆包：对话式办公与内容生产<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1–2 章：豆包——对话式办公与内容生产<\/a><br>检查点：能把一句模糊请求改写成背景定位、目标明确、要求细化三段式提示词，说清补充关键信息、调整表述方式、限定输出边界三种迭代手段各自挡住哪类跑偏<\/li><li class='path-step' id='path-02'><strong>步骤 02：即梦：文生图与图生图的提示与参数<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 3–6 章：即梦——文生图与图生图的提示与参数<\/a><br>检查点：能用主体—环境—风格三层写图像提示，按二次创作、写真、含文字海报三类任务选模型，按用途选比例，并说清再次生成与重新编辑的差别<\/li><li class='path-step' id='path-03'><strong>步骤 03：剪映：从素材到成片的流程<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 7–8 章：剪映——从素材到成片的流程<\/a><br>检查点：能按素材/文案—画面—配音—音乐—字幕—导出的顺序排成片流程，估算字幕识别后校对与口播剪辑的人工成本，说清先粗剪后精剪的理由<\/li><li class='path-step' id='path-04'><strong>步骤 04：飞书与扣子：协同与自动化<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 9–13 章：飞书与扣子——协同与自动化<\/a><br>检查点：能区分多维表格字段类型、多视图与权限继承；能按需求分析—建智能体—选模式—写人设—配模型/技能—测试发布的流程搭智能体；能画出工作流节点与变量传递链路，说清知识库检索不到时的兜底分支<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='提示词框架'>提示词框架 — 把模糊请求改写成可执行指令的三段式结构：背景定位（角色、品牌、用户画像）、目标明确（动作、成果名称、数量）、要求细化（输出结构与逐项标准），见 PDF 第 19–21 页 <span class=glossary-ref>（第 1–2 章：豆包——对话式办公与内容生产）<\/span><\/li><li data-term='结构化输出'>结构化输出 — 在提示词中约定交付物由哪些部分组成、每部分写什么、用什么分隔，使模型按固定模板产出可直接使用的条目，而不是自由发挥的长段落 <span class=glossary-ref>（第 1–2 章：豆包——对话式办公与内容生产）<\/span><\/li><li data-term='多轮对话迭代'>多轮对话迭代 — 在同一对话中先定义问题、再迭代方案、最后总结复盘；每轮补充或修正上一轮的约束，模型沿上下文继续调整，而不是每次重开一个新对话 <span class=glossary-ref>（第 1–2 章：豆包——对话式办公与内容生产）<\/span><\/li><li data-term='图像提示三层'>图像提示三层 — 文生图提示词的组成：主体（画面主角）、环境（场景与氛围）、风格（视觉呈现形式，如摄影写实、二次元卡通、水墨、3D 等），表情包场景用动作情绪替代环境要素，见 PDF 第 49、51 页 <span class=glossary-ref>（第 3–6 章：即梦——文生图与图生图的提示与参数）<\/span><\/li><li data-term='图片比例'>图片比例 — 生成画面的宽高比，书中给出 16:9 适合壁纸、1:1 适合头像与表情包、3:4 适合竖版海报、9:16 适合手机壁纸；选定比例后尺寸输入会被比例约束，见 PDF 第 50 页 <span class=glossary-ref>（第 3–6 章：即梦——文生图与图生图的提示与参数）<\/span><\/li><li data-term='首尾帧'>首尾帧 — 图生视频时先定结尾画面作为视觉基准，再让首帧参照尾帧生成，使一段视频的人物、场景与风格前后保持一致 <span class=glossary-ref>（第 3–6 章：即梦——文生图与图生图的提示与参数）<\/span><\/li><li data-term='智能字幕'>智能字幕 — 剪映中由语音识别把视频人声转成字幕条并适配时间轴的功能；识别后仍需人工校对错别字，再批量套用字体、字号、颜色等样式，见 PDF 第 105–108 页 <span class=glossary-ref>（第 7–8 章：剪映——从素材到成片的流程）<\/span><\/li><li data-term='智能剪口播'>智能剪口播 — 自动识别口播视频中的语气词、口误与长时间停顿并标记删除片段的功能；粗剪后仍需预览调整被标记片段，再确认删除，见 PDF 第 107 页起 <span class=glossary-ref>（第 7–8 章：剪映——从素材到成片的流程）<\/span><\/li><li data-term='多维表格字段类型'>多维表格字段类型 — 飞书多维表格中每一列的数据种类（如文本、数字、日期、单选、人员、附件等）；字段类型约束该列能填什么、能否被公式与视图按规则处理 <span class=glossary-ref>（第 9–13 章：飞书与扣子——协同与自动化）<\/span><\/li><li data-term='知识库'>知识库 — 在扣子或飞书中上传文档、表格、图片后供智能体检索的私有资料集合；回答时先在库内检索相关条款，检索不到按预设兜底话术回应，见 PDF 第 176–181 页 <span class=glossary-ref>（第 9–13 章：飞书与扣子——协同与自动化）<\/span><\/li><li data-term='工作流节点'>工作流节点 — 扣子工作流画布上的处理单元，如开始、大模型、图像生成、结束；节点之间用连线传递变量，上游节点的输出变量被下游节点引用为输入，见 PDF 第 208–210、215–217 页 <span class=glossary-ref>（第 9–13 章：飞书与扣子——协同与自动化）<\/span><\/li><li data-term='触发器'>触发器 — 扣子智能体上按条件自动执行任务的设定，书中案例为定时触发：每天 17:00 由机器人提示推送行业新闻，见 PDF 第 200–201 页 <span class=glossary-ref>（第 9–13 章：飞书与扣子——协同与自动化）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：三步骤先于多轮打磨<\/h2>\n<p>首轮提示词先补齐背景、目标、结构三段；方向跑通后再逐轮补范例、禁区与边界。不要在第一轮就堆砌感觉词，也不要方向未明时反复重开对话。<\/p>\n<h2>模式 2：结构骨架与素材分离<\/h2>\n<p>把经过验收的条目清单、写法说明抽成模板固定；每次同类任务只替换品牌、人群、主题等变动项。先检查条目是否适配新场景，再填内容。<\/p>\n<h2>模式 3：任务风险点配对模型<\/h2>\n<p>先判断画面最容易出错的环节（结构重构、质感表现、文字呈现），再选对应模型；比例按发布位置定。提示词方向错误走重新编辑，随机波动才走再次生成。<\/p>\n<h2>模式 4：先定基准再对齐变体<\/h2>\n<p>跨帧、跨画面一致性先定一张基准图，变体图以基准为参考约束；风格词首尾共用。基准未定，变体不独立生成。<\/p>\n<h2>模式 5：内容先行、包装在后<\/h2>\n<p>成片流程先定素材或讲稿，再配画面、配音、音乐，最后做字幕与包装；上游改动会连带下游返工，工序顺序按依赖排列。<\/p>\n<h2>模式 6：AI 粗处理 + 人工判断两段式<\/h2>\n<p>识别、标记由算法完成，校对、取舍由人工确认；校验环节不跳过，错误不在算法段兜底，而在人工段拦截。<\/p>\n<h2>模式 7：字段约束录入，视图分离呈现<\/h2>\n<p>数据先按字段类型规范录入，再多视图服务不同查看场景；维护一份数据源，不在视图间复制数据。<\/p>\n<h2>模式 8：节点职责单一，变量逐段交接<\/h2>\n<p>工作流每个节点只处理一道工序，输入引用上游变量、输出命名新变量；试运行逐节点检查，偏差回到对应节点提示词，不在错误结果上接下游。<\/p>\n<h2>模式 9：知识库先结构化再检索，检索不到走兜底<\/h2>\n<p>私有资料先整理成标准单元分段入库；回答限定在检索条款内，库外按预设兜底话术回应，禁止凭通用知识补全。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>豆包提示词<\/h2>\n<ul><li>\n三步骤：背景定位（角色/品牌/用户画像）→ 目标明确（动作/成果名称/数量）→ 要求细化（条目清单 + 写法说明）\n<\/li><li>\n三迭代：补充关键信息（范例/禁区/竞争）、调整表述（动词+方法/角色类比/引导问题）、限定输出边界\n<\/li><li>\n四功能：AI 搜索、AI 写作、AI 阅读、AI PPT\n<\/li><li>\n多轮三阶段：定义问题 → 迭代方案 → 总结复盘\n<\/ul>\n<h2>即梦出图<\/h2>\n<ul><li>\n三层：主体 + 环境 + 风格；表情包变体：角色 + 动作情绪 + 风格 + 图片布局\n<\/li><li>\n模型：4.0 二次创作/增删元素/多图一致/合成；3.1 写真表现；3.0 含文字\n<\/li><li>\n比例：16:9 壁纸，1:1 头像表情包，3:4 竖版海报，9:16 手机壁纸\n<\/li><li>\n再次生成：提示词不变换采样；重新编辑：改提示词再生成\n<\/li><li>\n首尾帧：尾帧基准 → 参考图生成首帧 → 视频衔接\n<\/ul>\n<h2>剪映成片<\/h2>\n<ul><li>\n三路径：模板替换、AI 文字成片、营销成片\n<\/li><li>\n文字成片顺序：讲稿 → 画面（来源/比例）→ 配音（音色/语速音量）→ 音乐（智能推荐）→ 生成 → 导出\n<\/li><li>\n字幕：识别 → 通读校对 → 批量美化（勾选应用到全部字幕）\n<\/li><li>\n口播：标记 → 预览取舍 → 删除\n<\/ul>\n<h2>飞书协同<\/h2>\n<ul><li>\n记录 = 行，字段 = 列；字段类型约束录入（文本/日期/单选）\n<\/li><li>\n多视图同源：表格视图后台录入，日历视图排期\n<\/li><li>\n权限：查看只读，填写可编辑；知识库子页面默认继承，可单独关闭继承\n<\/ul>\n<h2>扣子搭建<\/h2>\n<ul><li>\n智能体：需求分析 → 选模式 → 人设四段（角色/技能/示例/限制）→ 模型 → 技能（插件/知识库）→ 测试发布\n<\/li><li>\n工作流：开始（输入变量）→ 大模型（引用变量/输出变量）→ 图像生成 → 结束（交付变量）\n<\/li><li>\n知识库：资料整理成单元 → 分段入库 → 检索回答 → 库外兜底\n<\/li><li>\n触发器：定时触发，设定时间与任务执行方式\n<\/ul>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const SYN_GROUPS = [["定义", "含义", "释义", "概念"], ["例题", "算例", "示例", "例子", "案例"], ["习题", "题目", "练习", "测验", "自测"], ["推导", "证明", "论证", "演算"], ["步骤", "流程", "过程", "环节"], ["性质", "特性", "特点", "属性"], ["公式", "表达式", "式子"], ["定理", "定律", "法则", "准则"], ["图像", "图形", "图示", "曲线"], ["计算", "求解", "算出", "求值"], ["平均值", "均值", "平均数"], ["误差", "偏差", "偏离"], ["函数", "映射", "对应关系"], ["导数", "变化率", "切线斜率", "微商"], ["原函数", "不定积分", "反导数"], ["概率", "几率", "可能性"]];
const SOURCES = {};
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
const ZS_VERSION = '1.9.0';
/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  const steps = manifest.learningPath||[];
  const passed = steps.filter(s=>(s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))).length;
  const lbl = document.getElementById('path-progress-label');
  if(lbl) lbl.textContent = `${passed}/${steps.length} 步`;
  $$('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  if(typeof vis !== 'undefined'){ networkLoaded = true; cb(); return; }
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE) { cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库未加载：离线构建请加 <code>--offline all</code>，或联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIndex = null;
let pendingHl = [];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP = new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                        '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                        '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw = q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out = [];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length > 2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low = text.toLowerCase();
  let pos = -1, hit = '';
  for(const t of terms){ const i = low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start = Math.max(0, (pos<0?0:pos) - 60);
  const end = Math.min(text.length, (pos<0?0:pos) + 140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms = pendingHl.slice(); pendingHl = [];
  if(!terms.length) return;
  const root = $('#view'); if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first = null, idx = -1, term = '';
  while((node = walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low = node.nodeValue.toLowerCase();
    for(const t of terms){
      const i = low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){
        first = node; idx = i; term = t;
      }
    }
  }
  if(!first) return;
  try{
    const i = first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range = document.createRange();
    range.setStart(first, i); range.setEnd(first, i+term.length);
    const mark = document.createElement('mark');
    mark.className = 'hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'), 1800);
  }catch(e){}
}
document.addEventListener('click', (e)=>{
  const a = (e.target && e.target.closest) ? e.target.closest('.search-hit a') : null;
  if(a && a.dataset.hl) pendingHl = tokenizeQuery(a.dataset.hl);

function synOf(t){

  for(const g of SYN_GROUPS){ if(g.indexOf(t) >= 0){ for(const x of g){ if(x !== t) out.push(x); } } }
