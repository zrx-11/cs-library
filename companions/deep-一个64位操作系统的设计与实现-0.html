<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}

quisites": ["c06"], "depthFragment": "concepts/c08-depth.md"}, {"id": "c09", "title": "自旋锁、信号量与原子变量（何时用哪个、是否关中断）", "file": "concepts/c09.md", "chapterIds": ["ch03"], "difficulty": "进阶", "source": {"file": "一个64位操作系统的设计与实现.pdf", "page": 512}, "prerequisites": ["c07", "c08"], "depthFragment": "concepts/c09-depth.md"}, {"id": "c10", "title": "物理页框分配与 slab 分配器（内碎片怎么产生）", "file": "concepts/c10.md", "chapterIds": ["ch03"], "difficulty": "高难", "source": {"file": "一个64位操作系统的设计与实现.pdf", "page": 309}, "prerequisites": ["c03", "c08"], "depthFragment": "concepts/c10-depth.md"}, {"id": "c11", "title": "FAT32 目录项与簇链寻址（目录项、FAT 链、簇号算扇区）", "file": "concepts/c11.md", "chapterIds": ["ch04"], "difficulty": "进阶", "source": {"file": "一个64位操作系统的设计与实现.pdf", "page": 529}, "prerequisites": ["c10"], "depthFragment": "concepts/c11-depth.md"}, {"id": "c12", "title": "系统调用从用户态陷入内核的完整路径", "file": "concepts/c12.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "一个64位操作系统的设计与实现.pdf", "page": 195}, "prerequisites": ["c04", "c08"], "depthFragment": "concepts/c12-depth.md"}], "glossary": [{"term": "实模式（Real Mode）", "def": "处理器上电后的 16 位寻址模式，段地址左移 4 位加偏移形成线性地址，只能寻址 1MB 物理空间，无权限保护，不支持分页", "chapterId": "ch01"}, {"term": "保护模式", "def": "引入特权级 0–3、段描述符与分页机制的处理器模式，程序访问段需通过权限检测，分页可把线性地址映射到物理地址", "chapterId": "ch01"}, {"term": "IA-32e 模式（长模式）", "def": "64 位处理器运行模式，含兼容模式与 64 位模式；段基地址与限长被扁平化，采用四级页表，线性地址有效位宽 48 位且必须是 Canonical 地址", "chapterId": "ch01"}, {"term": "GDT（全局描述符表）", "def": "存放段描述符、系统段描述符的内存表，首项为 NULL 描述符，通过 LGDT 指令加载到 GDTR 寄存器；LDT 必须由 GDT 中的描述符管理", "chapterId": "ch01"}, {"term": "段选择子（Selector）", "def": "16 位索引值：高 13 位是描述符索引 Index，第 2 位 TI 指示 GDT/LDT，低 2 位是 RPL 请求特权级；处理器用 Index×8 从描述符表取出描述符", "chapterId": "ch01"}, {"term": "分页机制", "def": "把线性地址空间切成固定大小页面，借助多级页表把线性地址映射到物理地址；CR0.PG 控制开关，CR3 保存顶层页表物理基地址", "chapterId": "ch01"}, {"term": "中断向量号", "def": "标识中断或异常的编号；IDT 前 32 个向量号固定分配给异常，32 号起供外部中断与 INT n 使用", "chapterId": "ch02"}, {"term": "中断门 / 陷阱门", "def": "IDT 中的门描述符；穿过中断门进入处理程序时处理器复位 IF 屏蔽外部中断，穿过陷阱门不复位 IF；IA-32e 下每项 16B", "chapterId": "ch02"}, {"term": "错误码", "def": "部分异常发生时处理器压入栈中的辅助信息，按位域说明引起异常的段选择子、标志位等原因；不是所有异常都产生错误码", "chapterId": "ch02"}, {"term": "PCB（进程控制结构体）", "def": "本书中即 struct task_struct，记录进程状态、标志、PID、优先级、信号、内存空间与执行现场等资源信息，供调度算法决策使用", "chapterId": "ch03"}, {"term": "上下文切换", "def": "把当前进程的通用寄存器与执行现场保存到其 PCB/线程结构，再恢复下一个进程现场的过程；切换依赖共享的内核空间完成", "chapterId": "ch02"}, {"term": "自旋锁", "def": "持锁期间禁止抢占、忙等待的短驻留锁；等待者循环检测锁标志，不挂起；中断处理程序内只能使用自旋锁，不能使用信号量", "chapterId": "ch03"}, {"term": "信号量", "def": "带资源计数与等待队列的休眠锁；无空闲资源时当前进程被挂起加入等待队列并转让处理器，资源释放后再唤醒，适合长时间加锁", "chapterId": "ch03"}, {"term": "slab 分配器", "def": "在物理页之上按固定尺寸对象组织内存池的内核分配机制；struct Slab_cache 管理池，struct Slab 管理单个物理页内的对象与颜色位图，支持构造/析构钩子", "chapterId": "ch03"}, {"term": "物理页框（Page Frame）", "def": "物理内存按固定大小划分的页单元，本书以 struct Page 记录页的属性、引用计数、所属内存区与线性地址；alloc_pages/free_pages 负责申请与释放", "chapterId": "ch03"}, {"term": "FAT 簇链", "def": "FAT 文件系统中文件占用的簇由 FAT 表项串联：目录项记录起始簇号，每个 FAT 表项指向下一簇，直到末尾标志；读取文件需沿链逐簇访问", "chapterId": "ch04"}, {"term": "目录项", "def": "FAT 中 32B 的结构体，记录文件名、属性、时间戳、起始簇号高低字与文件大小；短目录项与长目录项组合描述文件名", "chapterId": "ch04"}, {"term": "系统调用", "def": "用户态程序请求内核服务的入口：应用程序通过寄存器传入向量号与参数，经陷入指令进入内核，由系统调用向量表分发到对应处理函数，再返回用户态", "chapterId": "ch04"}, {"term": "字符设备 / 块设备", "def": "按字节流式传输的设备（键盘、鼠标、串口）称字符设备；按固定大小数据块（扇区）传输的设备（硬盘、软盘、U盘）称块设备", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [], "flashcards": []}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：一个64位操作系统的设计与实现.pdf · p.81<\/div><h1>第 1 章：实模式、保护模式与段页式内存管理<\/h1>\n<blockquote>对应原书第 3 章 3.2.3 节「从实模式进入保护模式再到 IA-32e 模式」（PDF 第 81–89 页）、第 6 章「处理器体系结构」（PDF 第 207–248 页）、第 7 章 7.1 节实模式寻址瓶颈（PDF 第 251 页起）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按顺序复述从实模式进入保护模式、再进入 IA-32e 长模式的每一步：哪条指令改哪个控制寄存器的哪个标志位，哪一步必须靠远跳转刷新流水线；\n<\/li><li>\n拆出段选择子的 Index、TI、RPL 三个位域，用 Index×8 算出描述符在 GDT 中的字节偏移；\n<\/li><li>\n说清保护模式下段管理与页管理的先后顺序：逻辑地址先经段机制得到线性地址，分页再把线性地址映射成物理地址；\n<\/li><li>\n把一个 64 位线性地址拆成 PML4E、PDPTE、PDE、PTE 四级索引与页内偏移，逐级走完查表过程；\n<\/li><li>\n指出常见启动故障分别漏了哪一步：A20 未开、CR0.PE 未置、CR0.PG 未置、远跳转缺失、一致性检测失败。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>处理器上电先跑在 16 位、无保护、只能寻址 1MB 的实模式；操作系统要先在内存里备好 GDT、IDT、页表这些数据结构，再按固定顺序翻转控制寄存器标志位，把处理器一步步切到带特权级保护和分页的长模式；此后程序给出的逻辑地址，先经段描述符折算成线性地址，再经多级页表折算成物理地址。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 三种运行模式解决的三个不同困难<\/h3>\n<p>实模式（Real Mode）是处理器上电后的默认模式：通用寄存器只有 16 位，段寄存器保存段基地址，线性地址按 <code>段基地址 &lt;&lt; 4 + 偏移<\/code> 计算，只能寻址 1MB 物理空间，程序可以操作任何地址，没有权限限制（原书 6.3 节，PDF 第 212 页）。这种模式写引导代码方便，但程序写错就可能踩垮整个系统，且 1MB 寻址远不够用。<\/p>\n<p>保护模式引入了 0、1、2、3 四个特权级：0 级给内核，3 级给应用程序，Linux 实际只用 0 级和 3 级；段寄存器改存段选择子而不是段基地址，处理器再凭选择子去 GDT/LDT 里取描述符；分页机制作为可选项叠加在线性地址之上（原书 6.4.1 节，PDF 第 213–214 页）。<\/p>\n<p>IA-32e 模式（长模式）面向 64 位处理器：段基地址和段限长被强制覆盖到整个线性地址空间，段机制被扁平化；页管理升级为四级页表，线性地址有效位宽 48 位，高 16 位必须是第 47 位的符号扩展（Canonical 地址），否则触发异常（原书 6.5.1 节，PDF 第 237–238 页）。<\/p>\n<h3>2. 概念 1：两次模式切换的标志位与指令（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。实模式进保护模式的关键动作是：<code>CLI<\/code> 关中断 → <code>LGDT<\/code> 加载 GDT → <code>MOV CR0<\/code> 置位 PE → 远跳转刷新流水线；保护模式进长模式的关键动作是：清 PG → 置 CR4.PAE → 加载 CR3 → 置 IA32_EFER.LME → 置 CR0.PG，最后再一条远跳转切到 64 位代码段（原书 3.2.3 节，PDF 第 80、83、87 页）。<\/p>\n<h3>3. 概念 2：段描述符与段选择子（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。选择子是 16 位：15:3 位是 Index，第 2 位 TI 选 GDT 或 LDT，1:0 位是 RPL。处理器用 <code>Index × 8<\/code> 从 GDTR/LDTR 指向的表里取出 8 字节（保护模式）描述符，把基地址、限长、属性载入段寄存器的隐藏缓存区；访问前还要对比 CPL、RPL、DPL 三个特权级（原书 6.4.2 节，PDF 第 214–217 页）。<\/p>\n<h3>4. 概念 3：四级页表与地址转换全过程（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。关闭分页时线性地址直接当物理地址；开启分页后，线性地址被切成若干位域，CR3 指向顶层页表，每一级表项给出下一级表的物理基地址，直到 PTE 给出物理页基地址，加上页内偏移得到物理地址。保护模式的 32 位分页是两级表，IA-32e 是四级表（原书 6.4.4、6.5.4 节，PDF 第 229–230、246–248 页）。<\/p>\n<h2>推导一（推演）：从实模式到长模式，逐步走一遍切换流水线<\/h2>\n<p>第一步，备料。切换前要在内存里创建保护模式下可执行的代码，以及必要的数据结构：带代码段、数据段描述符的 GDT（第一项必须是 NULL 描述符），用 <code>LGDT<\/code> 载入 GDTR；IDT 结构体可以先占位，推迟到开中断前再用 <code>LIDT<\/code> 加载；如果要开分页，至少准备页目录与页表，且两者不能用同一物理页（原书 3.2.3 节，PDF 第 78 页）。<\/p>\n<p>第二步，开 A20。早期处理器只有 20 根地址线，超过 1MB 的寻址只有低 20 位有效；硬件沿用一个开关控制第 20 根地址线（A20），上电默认关闭。本书代码通过 8042 键盘控制器端口 92h 置位 A20 引脚，使高地址线可用（原书 3.2.3 节，PDF 第 69 页）。<\/p>\n<p>第三步，实模式进保护模式。<code>CLI<\/code> 屏蔽可屏蔽外部中断；<code>LGDT [GdtPtr]<\/code> 把 GDT 基地址与长度载入 GDTR；<code>MOV CR0<\/code> 置位 PE（CR0 第 0 位）；紧随其后必须执行一条远跳转或远调用，用新代码段选择子刷新 CS 与指令流水线。书里的对应指令序列是 <code>cli<\/code>、<code>lgdt [GdtPtr]<\/code>、<code>mov eax, cr0 / or eax, 1 / mov cr0, eax<\/code>、<code>jmp dword SelectorCode32:GO_TO_TMP_Protect<\/code>（PDF 第 81 页）。若开启分页，<code>MOV CR0<\/code> 与 <code>JMP/CALL<\/code> 必须位于同一性映射的同一页面内，因为跳转前后线性地址与物理地址重合。<\/p>\n<p>第四步，检测长模式支持。<code>CPUID<\/code> 扩展功能号 <code>0x80000001<\/code> 的 EDX 第 29 位（LM 位）指示处理器是否支持 IA-32e；不支持则进入待机（原书 3.2.3 节，PDF 第 84 页）。<\/p>\n<p>第五步，保护模式进长模式。先复位 CR0.PG 关闭分页；置 CR4.PAE 开启物理地址扩展；把顶层页表 PML4 的物理基地址载入 CR3；通过 <code>RDMSR/WRMSR<\/code> 操作 MSR 地址 <code>0xC0000080<\/code>（IA32_EFER），置位第 8 位 LME；再置位 CR0.PG 开启分页，处理器随后自动置位 EFER.LMA 表示长模式已激活（PDF 第 83、87 页）。<\/p>\n<p>第六步，落进 64 位代码段。此时处理器可能仍跑在兼容模式，CS 还挂着 32 位描述符；必须再执行一条远跳转，把 CS 换成 IA-32e 64 位代码段选择子，才真正进入 64 位模式（PDF 第 87 页）。<\/p>\n<h2>推导二（推演）：一个线性地址怎样逐级查表落到物理地址<\/h2>\n<p>先看保护模式 32 位两级分页的完整过程，书里给了一个算例：线性地址 <code>0x0001200h<\/code>，段基地址为 0，偏移即线性地址（原书 6.4.5 节，PDF 第 236 页）。<\/p>\n<p>32 位分页把 32 位线性地址切成三段：31:22 位是页目录索引（10 位），21:12 位是页表索引（10 位），11:0 位是页内偏移（12 位）。拆 <code>0x0001200h<\/code>：二进制低段为 <code>0000 0000 0000 0001 0010 0000 0000<\/code>。21:12 位取出 <code>0000 0000 01<\/code> 即 <code>01h<\/code>，作为 PT 索引；11:0 位取出 <code>200h<\/code> 作为页内偏移；31:22 位为 0，作为 PDT 第 0 项。<\/p>\n<p>查表顺序：CR3 给出 PDT 物理基地址 → PDT[0] 给出 PT 物理基地址 → PT[1] 给出物理页基地址（书里该页位于 <code>4000h–4FFFH<\/code>）→ 物理地址 = 物理页基地址 <code>0x4000h<\/code> + 页内偏移 <code>0x200h<\/code> = <code>0x4200h<\/code>。每一级表项除了物理页基地址，还带着 P（存在位）、R/W、U/S、A、D 等属性位；访问不存在的页（P=0）触发 <code>#PF<\/code> 缺页异常（原书 6.4.4 节，PDF 第 229–230 页）。<\/p>\n<p>IA-32e 四级分页把同样的思路拉长为 PML4 → PDPT → PD → PT 四级，48 位线性地址低 48 位参与索引，高 16 位做符号检查；算例拆解见 <a href=\"../concepts/c03-depth.md\" target=\"_blank\" rel=\"noopener\">概念 c03 的深度片段<\/a>。<\/p>\n<h2>反事实：去掉切换里的某一步会怎样<\/h2>\n<ul><li>\n<strong>不开 A20 就切保护模式<\/strong>：访问 1MB 以上地址时第 20 位被硬件屏蔽，高位地址被截断到低 20 位，表面上地址在涨，实际落到低 1MB 的折回位置，数据写进错误的物理页，故障表现为内存随机错乱，很难从代码侧定位。\n<\/li><li>\n<strong>置位 CR0.PE 后不做远跳转<\/strong>：流水线里还预取着实模式解码的指令，CS 缓存区仍是旧段信息；不刷新流水线就继续执行，后续指令的取指与段翻译状态不一致，会跑出无法预测的指令地址。\n<\/li><li>\n<strong>长模式一致性检测顺序错<\/strong>：开分页后再使能或禁止 LME、未开 PAE 就使能分页、激活长模式后再禁 PAE、CS 的 L 位已置位又试图激活长模式——这些都会触发 <code>#GP<\/code> 通用保护性异常（原书 3.2.3 节，PDF 第 83 页）。\n<\/li><li>\n<strong>只置 PG 却没先建页表、没载 CR3<\/strong>：分页开关打开后，第一条取指就按 CR3 去查一个未初始化的表项，P 位为 0，直接进入缺页异常；若此时 IDT 也没建好，异常无法被捕获。\n<\/li><li>\n<strong>第四条远跳转缺失<\/strong>：CR0.PG 与 LME 已置位，但 CS 仍是 32 位描述符，处理器停在兼容模式跑 32 位代码，不会自动升级到 64 位模式。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章搭起的是全书的硬件底座：GDT 与特权级是第 2 章中断/异常特权级检查、系统调用跨级切换的前提；页表与 CR3 是第 2 章进程切换换页表、第 3 章物理页分配与 slab 池管理内存的落点。下一章从处理器怎样响应外部中断与内部异常讲起，现场保存与调度决策都要用到本章的段、栈与特权级概念。<\/p>", "kind": "chapter", "title": "第 1 章：实模式、保护模式与段页式内存管理（GDT/LDT、描述符、分页表、地址转换）"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：一个64位操作系统的设计与实现.pdf · p.113<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：实模式、保护模式与段页式内存管理（GDT/LDT、描述符、分页表、地址转换）<\/a><\/span><\/div><h1>第 2 章：中断、异常与进程/线程调度<\/h1>\n<blockquote>对应原书第 4 章 4.4 系统异常（PDF 第 113–117 页）、4.6 中断处理（PDF 第 154–161 页）、4.8 进程管理（PDF 第 167–170 页）、第 10 章 高级中断处理单元（PDF 第 348 页起）、第 12 章 进程管理（PDF 第 475–525 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 1 章（模式、特权级、段栈与页表）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n分清中断与异常的来源，说清 IDT 怎样按向量号索引到门描述符，中断门与陷阱门对 IF 标志位的处理差别；\n<\/li><li>\n按 fault / trap / abort 三类解释异常返回地址为什么指向出错指令或其后一条指令，知道哪些异常带错误码；\n<\/li><li>\n列出一次中断/异常进入时栈上压入的内容，区分特权级不变与特权级切换两种栈帧；\n<\/li><li>\n说清进程上下文切换保存了哪些通用寄存器与现场信息，这些信息在 PCB 的哪个结构体里；\n<\/li><li>\n解释时间片从哪来、调度器在哪些时机决策、进程有哪些状态，以及进程与线程在资源归属上的差别。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>外部设备发中断、处理器执行出错发异常，都经过同一张 IDT 按向量号找门描述符进入处理程序；进入时把被打断现场压进栈，返回时再还原；调度器在时间片到期、中断返回、系统调用返回等时机从就绪队列选下一个进程，切换时把当前现场存进 PCB、把下一个进程的现场从 PCB 恢复回来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 中断和异常走同一条 IDT 入口<\/h3>\n<p>中断多由外部硬件设备（键盘、鼠标、硬盘等）产生，异常由处理器在执行指令、访问内存或越权时内部产生；两者都用 IDT 索引处理程序，只是向量号不同。IDT 前 32 个向量号固定分配给异常，32 号起供外部中断与 <code>INT n<\/code> 使用（原书 4.4 节，PDF 第 116 页）。处理器拿到向量号后，从 IDT 取出门描述符的段选择子与段内偏移，再去 GDT/LDT 取代码段描述符，拼出处理程序入口（PDF 第 114 页）。<\/p>\n<h3>2. 概念 4：中断门、陷阱门与栈切换（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。穿过中断门进入处理程序时，处理器复位 IF 标志位，屏蔽其他外部中断，直到 <code>IRET<\/code> 还原 EFLAGS；陷阱门不复位 IF。IA-32e 模式下 IDT 每项 16B，可通过 IST 字段指定独立中断栈（原书 6.5.3 节，PDF 第 245 页）。<\/p>\n<h3>3. 概念 5：异常分类与错误码（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。错误（fault）可修正，返回地址指向出错指令本身，重新执行该指令；陷阱（trap）返回地址指向下一条指令；终止（abort）报告严重错误，现场不可恢复。部分异常在栈上压入错误码，按位域说明出错原因（原书 4.4.1 节，PDF 第 113 页）。<\/p>\n<h3>4. 概念 6：上下文切换保存了什么（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。中断入口用 <code>SAVE_ALL<\/code> 宏把通用寄存器、段寄存器依次压入当前栈；PCB 内的 <code>thread_struct<\/code> 记录 <code>rsp0<\/code>、<code>rip<\/code>、<code>rsp<\/code>、<code>fs<\/code>、<code>gs<\/code>、<code>cr2<\/code>、<code>trap_nr<\/code>、<code>error_code<\/code> 等现场信息（原书 4.8.2 节，PDF 第 170 页）。进程切换就是把当前现场写进本进程的线程结构，再从下一个进程的线程结构恢复寄存器。<\/p>\n<h3>5. 概念 7：调度器、时间片与时钟（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。任务数远多于处理器数，调度器按优先级与虚拟运行时间选就绪进程上处理器；时间片由定时器中断驱动，本书用 RTC 取墙上时钟、HPET 作系统定时器；抢占让调度不仅发生在时间片到期，中断、异常、系统调用返回时也可以检查是否需要调度（原书 12.3 节，PDF 第 475、480、497–498 页）。<\/p>\n<h2>推导一（推演）：一次中断/异常进入时，栈上按什么顺序压了什么<\/h2>\n<p>先看特权级不变的情况。处理器穿过门描述符进入处理程序时，动作类似一次 <code>CALL<\/code>：先把 EFLAGS、CS、EIP（64 位下为 RFLAGS、CS、RIP）压入被打断程序所在栈；部分异常再压入错误码。书里图 4-7 标注的无特权级变化栈帧，从进入前的 ESP 位置向低地址依次是 EFLAGS、CS、EIP、Error Code（原书 4.4.2 节，PDF 第 115 页）。<\/p>\n<p>再看特权级变化的情况。处理程序代码段特权级更高（数值更小）时，处理器先从 TSS 取出对应特权级的栈段选择子与栈指针，切到新栈；再把旧 SS、旧 ESP 压入新栈，随后压入 EFLAGS、CS、EIP、错误码（PDF 第 114–115 页）。返回时 <code>IRET<\/code> 按相反顺序还原：先弹错误码（若有），再弹 EIP/RIP、CS、EFLAGS；若发生过栈切换，继续弹回旧 ESP、旧 SS。<\/p>\n<p>进入处理程序后，本书 <code>SAVE_ALL<\/code> 宏继续把 <code>rax<\/code>、段寄存器 <code>es/ds<\/code>、<code>rbp<\/code>、<code>rdi<\/code>、<code>rsi<\/code>、<code>rdx<\/code>、<code>rcx<\/code>、<code>rbx<\/code>、<code>r8<\/code>–<code>r15<\/code> 依次压栈，再把内核数据段选择子载入 <code>ds<\/code>、<code>es<\/code>（原书 4.6.2 节，PDF 第 160–161 页）。这套压栈清单就是后面上下文恢复的逆操作清单：保存时先压的后弹，恢复时必须按同一清单反向走，漏掉任何一个通用寄存器，被打断进程回来后寄存器值就是错的。<\/p>\n<h2>推导二（推演）：进程切换的寄存器清单与 PCB 落位<\/h2>\n<p>第一步，中断/异常入口已经用 <code>SAVE_ALL<\/code> 把通用寄存器压在当前内核栈上，栈顶指针由 <code>rsp<\/code> 记录。第二步，调度器选中下一个进程后，当前进程的现场需要落盘到自己的 <code>thread_struct<\/code>：<code>rsp0<\/code> 是内核态栈基地址，<code>rsp<\/code> 保存切换时的栈指针，<code>rip<\/code> 保存切换回来时继续执行的代码地址，<code>fs<\/code>、<code>gs<\/code> 保存段寄存器，<code>cr2<\/code> 记录缺页线性地址，<code>trap_nr<\/code> 与 <code>error_code<\/code> 记录异常编号与错误码（原书 4.8.2 节，PDF 第 170 页）。<\/p>\n<p>第三步，从下一个进程的 <code>thread_struct<\/code> 恢复：先取它的 <code>rsp<\/code> 换上内核栈，栈上已经存着它上次被打断时压入的通用寄存器；再按 <code>SAVE_ALL<\/code> 的逆序弹出寄存器，最后跳到它的 <code>rip<\/code> 继续执行。<code>mm_struct<\/code> 里另有页表基地址与代码段、数据段、动态内存区、用户栈基地址等内存布局信息，切换进程时页表基地址随 PCB 一起换入 CR3（PDF 第 169 页）。<\/p>\n<p>第四步，看调度决策依据。本书 <code>task_struct<\/code> 里有 <code>state<\/code>（运行态、停止态、可中断态、不可中断态、僵死态等）、<code>priority<\/code>、<code>vrun_time<\/code>（虚拟运行时间）等成员；调度器参考 CFS 思路，用虚拟运行时间在就绪队列里选下一个任务，时间片由优先级与虚拟运行时间共同折算（原书 12.3.4 节，PDF 第 498 页）。进程是拥有资源的最小单位，线程是执行的最小单位；线程依附进程存在，同一进程的多个线程共享进程资源，各自带独立执行现场（原书 12.5.3 节，PDF 第 525 页）。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>陷阱门当成中断门用，或者反过来<\/strong>：中断门进入时清 IF，处理期间不被其他外部中断打断；若把需要连续操作硬件的处理程序挂在陷阱门上，IF 保持开启，高优先级中断中途插入可能打断对同一设备的寄存器序列操作，出现寄存器状态交错。反过来，纯查询类处理挂中断门，不必要地拉长了关中断时间，拖低中断响应速度。\n<\/li><li>\n<strong>上下文切换漏存某个通用寄存器<\/strong>：比如压栈清单漏了 <code>rbx<\/code>，下一轮该进程恢复后 <code>rbx<\/code> 里残留着别的进程的值；按这本书的调用约定，被调用者保存的寄存器一旦被踩，函数返回后局部变量取值就会错，故障表现为随机的数据错乱而不是立即崩溃。\n<\/li><li>\n<strong>调度只放在时间片到期检查<\/strong>：高优先级任务就绪后，必须等当前进程时间片耗尽才有机会上处理器，交互响应变慢；本书把调度检查放在中断/异常返回路径上，配合抢占机制，任何中断或系统调用返回点都可以重新决策（PDF 第 497–498 页）。\n<\/li><li>\n<strong>异常没有配 IDT 门描述符就开分页<\/strong>：首个缺页或 <code>#GP<\/code> 发生时，处理器按向量号查表，表项为空或 P=0，无法转入处理程序；内核启动初期最脆弱的阶段，异常无人接管。\n<\/li><li>\n<strong>信号/中断处理里用了休眠锁<\/strong>：信号量等待时会把进程挂起并让出处理器；中断上下文里没有可挂起的进程实体，休眠等待无法被调度唤醒，这也是本书规定中断处理程序内只能用自旋锁的原因（原书 12.5.3 节前后，PDF 第 514 页）。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章把&quot;处理器被打断时怎样保住现场、什么时候换人跑&quot;讲清楚了：现场保存在 PCB 里，调度依据 PCB 里的状态与优先级。第 3 章接着拆 PCB 内部的资源组织、多核共享数据的同步手段，以及内核拿到物理页后怎样用 slab 池切出小块对象。下一章的锁机制要处理的竞争场景，正是本章多进程、多中断并发执行时产生的。<\/p>", "kind": "chapter", "title": "第 2 章：中断、异常与进程/线程调度（IDT、时钟、上下文切换、优先级）"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：一个64位操作系统的设计与实现.pdf · p.309<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：中断、异常与进程/线程调度（IDT、时钟、上下文切换、优先级）<\/a><\/span><\/div><h1>第 3 章：内核对象、同步与内存分配器<\/h1>\n<blockquote>对应原书第 9 章「高级内存管理单元」（PDF 第 309–334 页）、第 12 章 12.4 节「内核同步方法」（PDF 第 509–514 页）、第 4 章 4.8.2 节 PCB 结构（PDF 第 168–170 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 2 章（进程现场、并发与调度时机）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 PCB 怎样把进程独享资源与共享资源分开组织，线程现场在哪个结构体里；\n<\/li><li>\n区分原子变量、自旋锁、信号量三种手段各自锁的是什么，按持锁时长与上下文类型选择；\n<\/li><li>\n复述物理页框申请/释放与 slab 内存池的层级关系，解释 slab 为什么按固定尺寸分池；\n<\/li><li>\n算出固定尺寸对象在一个页内占多少对象、内碎片落在哪一段；\n<\/li><li>\n说明多核并发下不加保护会出现什么样的覆盖顺序问题，以及 <code>LOCK<\/code> 前缀在其中的作用。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>内核先把进程与资源组织成 PCB 这类内核对象；多个处理器、多个中断并发访问共享数据时，用原子变量做单变量自增自减，用自旋锁保护短临界区，用信号量保护长临界区并允许休眠；内存分配分两层，底层按物理页框整页申请释放，上层 slab 在页内按固定尺寸对象反复切分、回收复用，减少碎片与重复初始化开销。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 8：内核对象与 PCB 的资源组织（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。本书第一版 PCB 即 <code>struct task_struct<\/code>：<code>list<\/code> 串起所有进程，<code>state<\/code>、<code>flags<\/code>、<code>pid<\/code>、<code>priority<\/code>、<code>signal<\/code>、<code>counter<\/code> 记录状态与调度信息；<code>mm_struct<\/code> 指向页表与各段地址区间；<code>thread_struct<\/code> 保存切换时的执行现场（原书 4.8.2 节，PDF 第 168–170 页）。从资源角度拆，<code>task_struct<\/code> 实例化成员与 <code>thread_struct<\/code> 属进程独享部分，经指针关联的内存空间属共享部分；多线程进程里，独享现场各持一份，共享资源共用一份（原书 12.5.3 节，PDF 第 525 页）。<\/p>\n<h3>2. 概念 9：自旋锁、信号量与原子变量（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。原子变量是对长整型的二次封装，自增自减靠 <code>LOCK<\/code> 指令前缀锁住前端总线，防止其他处理器同时改内存；自旋锁持锁期间禁止抢占，等待者忙循环；信号量带资源计数与等待队列，无资源时进程休眠入队，释放时唤醒（原书 12.4 节，PDF 第 509–512 页）。<\/p>\n<h3>3. 概念 10：物理页框分配与 slab 分配器（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。<code>alloc_pages<\/code>/<code>free_pages<\/code> 按页框为单位管理 <code>struct Page<\/code>；slab 在物理页之上建 <code>Slab_cache<\/code>（内存池，带构造/析构钩子）与 <code>Slab<\/code>（单页内的对象链表与颜色位图），<code>kmalloc<\/code> 按申请尺寸落到对应尺寸的池里分配对象（原书 9.1、9.2 节，PDF 第 309–319、327 页）。<\/p>\n<h2>推导一（推演）：从一次 <code>kmalloc<\/code> 申请往回追到物理页框<\/h2>\n<p>第一步，确定尺寸档位。本书通用内存池组 <code>kmalloc_cache_size[16]<\/code> 预置 32B、64B、128B……若干档；申请尺寸先向上对齐到最近档位，落入 32B–512B 的小对象区间，或 1KB–1MB 的大对象区间（原书 9.2.1、9.2.2 节，PDF 第 319、327 页）。<\/p>\n<p>第二步，在对应 <code>Slab_cache<\/code> 里找有空闲对象的 <code>Slab<\/code>。<code>struct Slab<\/code> 记录所在 <code>Page<\/code>、线性地址 <code>Vaddress<\/code>、已用对象数 <code>using_count<\/code>、空闲对象数 <code>free_count<\/code>，以及颜色位图 <code>color_map<\/code>：位图每一位对应页内一个对象，1 表示已占用，0 表示空闲（PDF 第 310 页）。<\/p>\n<p>第三步，若池中已无空闲对象，<code>slab_malloc<\/code> 调 <code>alloc_pages(ZONE_NORMAL, 1, 0)<\/code> 申请一个物理页框，初始化 <code>Page<\/code> 属性，再在页尾布置 <code>struct Slab<\/code> 与颜色位图，按页尺寸除以对象尺寸算出可容纳对象数（PDF 第 314 页）。<\/p>\n<p>第四步，分配与回收。在位图里找到第一个空闲位，标记占用，按需调用池的构造函数初始化对象，返回线性地址；回收时执行析构钩子，清位图位；若整页空闲且储备充足，把该 <code>Slab<\/code> 释放回页框分配器（PDF 第 314、317 页）。<\/p>\n<p>第五步，看内碎片从哪来。对象尺寸对齐到档位后，一个对象末尾到下一个对象起始之间的字节就是内部碎片；页内最后一个对象之后、<code>Slab<\/code> 结构与位图之前的剩余空间也是碎片。举例：页大小 2MB，对象档 64B，页内可放 <code>2MB / 64B = 32768<\/code> 个对象；若实际申请对象是 40B，每个对象按 64B 占用，每个对象末尾浪费 24B，这 24B 无法分给同页其他对象，就是内碎片。小对象用 slab 固定尺寸是为了快速分配与复用，代价是档位对齐带来的内碎片；大对象尺寸庞大、位图很短，本书把 <code>struct Slab<\/code> 移出物理页另行分配，减少页内空间浪费（PDF 第 327 页）。<\/p>\n<h2>推导二（推演）：自旋锁加锁路径，以及为什么必须禁止抢占<\/h2>\n<p>第一步，竞争场景。SMP 系统里两个处理器同时操作同一临界区：读共享变量、改共享变量、写回内存。没有保护时，两个处理器可能先后读到同一个旧值，各自在本地改完写回，后写回的覆盖先写回的结果，中间一次更新丢失（原书 12.4 节，PDF 第 509 页）。<\/p>\n<p>第二步，原子变量先解决单变量。<code>atomic_inc<\/code> 的实现是 <code>lock incq<\/code> 修饰内存操作：<code>LOCK<\/code> 前缀让处理器在执行主体指令期间锁住硬件平台前端总线，其他处理器无法访问该内存单元，自增作为一个不可分割的整体完成；普通 <code>inc<\/code> 指令分读、改、写三步，中间可被打断或并行交错（PDF 第 510 页）。<\/p>\n<p>第三步，自旋锁保护多步临界区。本书在 PCB 追加 <code>preempt_count<\/code> 计数变量：加自旋锁时 <code>preempt_count++<\/code>，关抢占；放锁时 <code>preempt_count--<\/code>，恢复抢占。用计数而不是标志位，是因为一个进程可能同时持有多把自旋锁，计数逐层加减才不会提前放开（原书 12.4.3 节，PDF 第 512、514 页）。<\/p>\n<p>第四步，等待方式与适用边界。自旋锁等待者忙循环检测锁标志，不挂起、不转让处理器，适合持锁时间极短的场景；信号量等待者被设为不可中断状态加入等待队列，经 <code>schedule<\/code> 让出处理器，资源释放后由 <code>up<\/code> 唤醒，适合长时间加锁。中断处理程序上下文里没有可挂起的进程实体，因此只能用自旋锁，不能用信号量；自旋锁与信号量不能同时叠加使用（PDF 第 512、514 页）。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>多核下临界区不加锁<\/strong>：两个核心同时改同一个链表指针或引用计数，可能一个核心摘下节点、另一个核心同时改链，链表节点前后指针交错，遍历走到已释放内存；引用计数少加一次或多减一次，对象提前被回收或永不释放。\n<\/li><li>\n<strong>中断上下文使用信号量<\/strong>：等待资源时执行 <code>down<\/code> 会把当前进程挂起并调 <code>schedule<\/code> 转让处理器；中断处理打断的是某个进程现场，此时没有自己的进程实体可入队，休眠后无人唤醒，处理器卡在中断路径里。\n<\/li><li>\n<strong>自旋锁不加 <code>preempt_count<\/code> 关抢占<\/strong>：持锁期间当前进程被高优先级抢占，新进程又申请同一把锁，持锁者不再运行，等待者忙循环，形成死锁式等待；计数为 0 才恢复抢占，正是为了避免持锁期间被换出。\n<\/li><li>\n<strong>大块内存也按小对象 slab 池切<\/strong>：一个 1MB 对象在 2MB 页内只占一个，页内剩余空间无法复用给小对象，位图与 <code>Slab<\/code> 结构反占页内空间；本书大对象分支把 <code>struct Slab<\/code> 移出页外、按整页/多页组织，就是为避免这种浪费（PDF 第 327 页）。\n<\/li><li>\n<strong>回收对象不调析构钩子、不清位图<\/strong>：下次分配拿到的对象残留旧数据；位图位未清，新对象被标记占用，空闲数 <code>free_count<\/code> 只减不增，池子逐步耗尽。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章的页框与 slab 是文件系统缓存、驱动缓冲区、进程描述符的内存来源；同步锁保护的共享数据，正是第 2 章调度器队列、第 4 章文件系统元数据与设备寄存器。下一章把视角从内核内存转到外部存储与用户接口：文件系统怎样在块设备上按簇链组织文件，驱动怎样操作设备端口，用户态程序又通过哪条陷入路径请内核代办这些操作。<\/p>", "kind": "chapter", "title": "第 3 章：内核对象、同步与内存分配器（对象管理、自旋锁/信号量、页框与 slab 分配）"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：一个64位操作系统的设计与实现.pdf · p.528<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：内核对象、同步与内存分配器（对象管理、自旋锁/信号量、页框与 slab 分配）<\/a><\/span><\/div><h1>第 4 章：文件系统、驱动与用户态接口<\/h1>\n<blockquote>对应原书第 5 章「应用层」（PDF 第 183–198 页）、第 11 章「设备驱动程序」（PDF 第 393–420 页）、第 13 章「文件系统」（PDF 第 528–543 页）、第 14 章「系统调用 API 库」（PDF 第 578–582 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 3 章（内存分配、内核对象与同步）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出 FAT32 分区的引导扇区、FAT 表、根目录区、数据区四部分各存什么，读懂 BPB 关键字段；\n<\/li><li>\n从 32B 短目录项里取出文件名、属性、起始簇号高低字与文件大小，沿 FAT 簇链遍历文件占用的簇；\n<\/li><li>\n用 BPB 参数算出某一簇对应的起始扇区，说明簇链遍历的时间复杂度与碎片影响；\n<\/li><li>\n区分字符设备与块设备，说清硬盘驱动通过 ATA 命令与 I/O 端口操作扇区的基本路径；\n<\/li><li>\n走完一次系统调用：用户态寄存器传参 → 陷入指令进入内核 → 向量表分发到处理函数 → 返回用户态，指出各阶段用了哪些寄存器。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>块设备上的文件靠目录项记录起始簇、靠 FAT 表把簇串成链，驱动把簇号翻译成扇区命令交给磁盘控制器；用户态不能直接碰硬件与内核数据，只能通过系统调用陷入内核，由内核按向量号分发到对应处理函数，办完再把结果经寄存器返回用户态。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 11：FAT32 目录项与簇链寻址（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c11.md\" target=\"_blank\" rel=\"noopener\">概念 c11<\/a>。FAT32 分区由引导扇区（保留区）、FAT 表、根目录区、数据区组成；短目录项 32B，记录文件名、属性、时间戳、起始簇号高字 <code>DIR_FstClusHI<\/code>、低字 <code>DIR_FstClusLO<\/code> 与文件大小；FAT 表每项 32 位、低 28 位有效，指向下一簇，末尾为结束标志（原书 13.2 节，PDF 第 529、532、531 页）。<\/p>\n<h3>2. 设备驱动：字符设备与块设备<\/h3>\n<p>键盘、鼠标、串口按字节流式传输，属字符设备；硬盘、软盘、U 盘按固定大小数据块（扇区）传输，属块设备（原书 11.2.1 节，PDF 第 414 页）。处理器不能像访问内存地址一样直接读磁盘扇区，必须经磁盘控制器：本书硬盘驱动走 ATA/ATAPI 规范命令，通过主控制器 I/O 端口 <code>1F0h–1F7h<\/code>、<code>3F6h<\/code>（从控制器 <code>170h–177h<\/code>、<code>376h<\/code>）收发数据、读错误状态、写扇区数与 LBA、发命令（PDF 第 418 页）。硬盘识别信息由 ATA 命令 <code>ECh<\/code> 取回，是 512B 数据块，内含序列号、固件版本、型号、可寻址逻辑扇区数等（PDF 第 419–420 页）。<\/p>\n<h3>3. 概念 12：系统调用陷入内核的完整路径（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c12.md\" target=\"_blank\" rel=\"noopener\">概念 c12<\/a>。应用程序在寄存器里放好系统调用向量号与参数，执行陷入指令进入内核；内核按 <code>RAX<\/code> 里的向量号查 <code>system_call_table<\/code> 分发处理函数，结果经 <code>RAX<\/code> 返回；再由返回指令切回用户态（原书 5.2、5.3、14.2 节，PDF 第 195、197、580 页）。<\/p>\n<h2>推导一（推演）：从路径名到磁盘扇区，沿簇链走完一次文件读取<\/h2>\n<p>第一步，读引导扇区 BPB，拿到定位参数：每扇区字节数 <code>BPB_BytesPerSec<\/code>、每簇扇区数 <code>BPB_SecPerClus<\/code>、保留扇区数 <code>BPB_RsvdSecCnt<\/code>、FAT 份数 <code>BPB_NumFATs<\/code>、每 FAT 扇区数 <code>BPB_FATSz32<\/code>、根目录起始簇号 <code>BPB_RootClus<\/code>（通常为 2）。书里实例参数：每扇区 512B、每簇 8 扇区（簇大小 4096B）、保留 36 扇区、2 份 FAT、每 FAT 2050 扇区、根目录簇号 2、隐藏扇区 2048、总扇区数 2103296（原书 13.2.2 节，PDF 第 536 页）。<\/p>\n<p>第二步，算各区域扇区位置。FAT1 起始扇区 = 隐藏扇区 + 保留扇区；FAT2 起始扇区 = FAT1 起始 + 每 FAT 扇区数；数据区起始扇区 = FAT2 起始 + 每 FAT 扇区数。以实例参数代入：FAT1 起始 = <code>2048 + 36 = 2084<\/code>；FAT2 起始 = <code>2084 + 2050 = 4134<\/code>；数据区起始 = <code>4134 + 2050 = 6184<\/code>。<\/p>\n<p>第三步，定位目录项。根目录在 2 号簇；打开子目录时，目录项里的起始簇号指向子目录所在簇。目录项 32B 一项，遍历目录扇区内的每一项，比对文件名；长文件名由一组连续长目录项加一个短目录项组成，短目录项带校验和（PDF 第 533–534、543 页）。<\/p>\n<p>第四步，取起始簇号。目录项起始簇号拆成高 16 位 <code>DIR_FstClusHI<\/code> 与低 16 位 <code>DIR_FstClusLO<\/code>，拼成 32 位簇号；0、1 号簇保留不用，2 号簇是根目录（PDF 第 532、538 页）。<\/p>\n<p>第五步，簇号算扇区。数据区第 2 号簇对应数据区起始扇区；簇 <code>c<\/code> 的起始扇区为：<\/p>\n<div class=\"katex-block\">\\text{Sector}(c) = D_{\\text{data}} + (c - 2) \\times S_{\\text{PerClus}}<\/div>\n<p>其中 <span class=\"katex-inline\">D_{\\text{data}}<\/span> 是数据区起始扇区，<span class=\"katex-inline\">S_{\\text{PerClus}}<\/span> 是每簇扇区数。代入实例：<code>Sector(2) = 6184<\/code>；<code>Sector(3) = 6184 + (3-2)×8 = 6192<\/code>；<code>Sector(10) = 6184 + (10-2)×8 = 6248<\/code>。<\/p>\n<p>第六步，沿簇链读数据。读目录项记录的起始簇，按上式算扇区、发读扇区命令；再查 FAT 表项：簇 <code>c<\/code> 的 FAT 项位于 FAT 区内偏移 <code>c × 4<\/code> 字节处（FAT32 每项 4B），表值低 28 位若是下一簇号就继续，若是 <code>0x0FFFFFF8h<\/code> 一类结束标志则链到末尾（PDF 第 531 页）。一个 <span class=\"katex-inline\">n<\/span> 簇的文件，最坏要逐簇查一次 FAT、读一簇数据，链遍历随簇数线性增长；文件碎片化后簇号不连续，每跳一簇都可能产生一次寻道，机械硬盘寻道时间占比升高（PDF 第 415 页）。<\/p>\n<h2>推导二（推演）：一次系统调用从用户态到内核再回来<\/h2>\n<p>第一步，用户态准备参数。64 位 C 调用约定下参数可用 <code>RDI<\/code>、<code>RSI<\/code>、<code>RDX<\/code>、<code>RCX<\/code>、<code>R8<\/code>、<code>R9<\/code> 传递；系统调用向量号放 <code>RAX<\/code>。本书早期入口把返回地址放 <code>RDX<\/code>、用户栈指针放 <code>RCX<\/code>，配合 <code>SYSEXIT<\/code> 的硬件要求；升级后改用 <code>R10<\/code>、<code>R11<\/code> 保存返回地址与栈指针，避开 <code>RDX<\/code>/<code>RCX<\/code> 被 <code>SYSEXIT<\/code> 占用的冲突（原书 14.2.2 节，PDF 第 579–580 页）。<\/p>\n<p>第二步，陷入内核。应用程序执行 <code>sysenter<\/code>，处理器从用户态 3 级进入内核 0 级；入口代码先把内核数据段选择子载入 <code>ds<\/code>、<code>es<\/code>，再从栈上取出 <code>RAX<\/code> 里的向量号，以 <code>system_call_table + RAX × 8<\/code> 索引出处理函数地址并 <code>callq<\/code> 跳转（PDF 第 580 页）。向量表默认全部指向 <code>no_system_call<\/code>，已实现的项如 <code>sys_putstring<\/code>、<code>sys_printf<\/code> 替换为对应处理函数；表上限 <code>MAX_SYSTEM_CALL_NR = 128<\/code>（PDF 第 579、581 页）。<\/p>\n<p>第三步，内核处理。处理函数按 <code>pt_regs<\/code> 里的寄存器取值完成实际工作，例如 <code>sys_putstring<\/code> 从 <code>regs-&gt;rdi<\/code> 取字符串指针交给显示函数，返回值经 <code>RAX<\/code> 带回（PDF 第 197 页）。内核侧完成文件、内存、进程等操作后，回到系统调用返回模块。<\/p>\n<p>第四步，返回用户态。返回模块用 <code>sysexit<\/code> 切回 3 级：<code>RCX<\/code> 载入用户态 RSP，<code>RDX<\/code> 载入用户态 RIP；栈上或寄存器里保存的现场恢复，程序从 <code>sysexit_return_address<\/code> 处继续执行，<code>RAX<\/code> 里是内核返回值（PDF 第 185、195 页）。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>起始簇号只拼低 16 位<\/strong>：大于 <code>0xFFFF<\/code> 的簇号高字被丢掉，簇号算错，扇区落到错误位置；读到的是无关簇的数据，目录项却仍显示文件大小正常，排查困难。这也是 FAT32 为兼容旧目录项格式，把 32 位簇号拆高低两段存放的原因（PDF 第 533 页）。\n<\/li><li>\n<strong>不沿 FAT 链连续访问，假设簇号递增<\/strong>：文件被打散成多个不连续簇后，按起始簇号顺推下一簇会越过链指向错误数据；FAT 链正是为记录离散簇的先后顺序而存在。\n<\/li><li>\n<strong>陷入后不清/不管 IF 标志<\/strong>：本书实测发现 <code>SYSENTER<\/code> 会复位 EFLAGS 的 IF 位，进入内核后若不处理，返回用户态后键盘等外部中断不再响应；诊断时 <code>eflags<\/code> 里 IF 位为 0（原书 5.2 节，PDF 第 196 页）。\n<\/li><li>\n<strong>内核处理函数直接解引用用户态指针而不检查<\/strong>：用户态传入的地址可能未映射、越界或指向只读页；内核贸然解引用会触发缺页异常，严重时踩进内核空间。系统调用接口需要在内核侧核对地址合法性与长度。\n<\/li><li>\n<strong>块设备驱动按字节流读写<\/strong>：磁盘以扇区为传输单位，命令里写的是扇区数与 LBA 扇区号；按单字节发命令无法匹配控制器协议，识别信息 512B 数据块也无法成批取回（PDF 第 418–419 页）。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章是前三章的对外出口：文件元数据与缓冲区来自第 3 章的页框与 slab，驱动与文件系统访问共享设备时受第 3 章同步锁保护，系统调用陷入时保存/恢复的现场就是第 2 章的上下文切换结构。至此全书形成闭环：启动切模式 → 建中断与调度 → 管内存与并发 → 落地文件、驱动与用户接口。<\/p>", "kind": "chapter", "title": "第 4 章：文件系统、驱动与用户态接口（文件系统实现、设备驱动、系统调用与加载）"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：一个64位操作系统的设计与实现.pdf · p.81<\/div><h1>实模式到保护模式再到 IA-32e 的模式切换<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章（原书第 3 章 3.2.3、第 6 章、第 7 章 7.1）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>处理器上电默认跑在实模式：16 位寄存器、无特权级隔离、寻址上限 1MB，程序能踩任意物理地址。引导程序要在这种受限环境里把内核送到内存并启动起来，就必须分阶段把处理器切到带保护与分页的 64 位模式。这个概念回答的是：两次切换各翻转哪个标志位、加载哪张表、哪一步必须用远跳转刷新流水线，以及顺序错了会触发哪一类异常。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>实模式<\/strong>：段寄存器存段基地址，线性地址 = 段基地址 <code>&lt;&lt; 4<\/code> + 偏移；通用寄存器 16 位，寻址空间 1MB，无保护、无分页（原书 6.3 节，PDF 第 212 页）。<\/p>\n<p><strong>保护模式切换涉及的寄存器与位域<\/strong>：<\/p>\n<ul><li>\n<code>CR0.PE<\/code>（第 0 位）：保护模式使能位，置 1 后处理器进入保护模式。\n<\/li><li>\n<code>CR0.PG<\/code>（第 31 位）：分页使能位，置 1 后开启分页；长模式切换前先清 0。\n<\/li><li>\n<code>CR4.PAE<\/code>（第 5 位）：物理地址扩展使能位，启用 64 位页表结构前必须置 1。\n<\/li><li>\n<code>CR3<\/code>：顶层页表（PML4/页目录）的物理基地址寄存器。\n<\/li><li>\n<code>IA32_EFER<\/code>（MSR 地址 <code>0xC0000080<\/code>）：第 8 位 <code>LME<\/code> 置 1 表示请求长模式；处理器随后把第 10 位 <code>LMA<\/code> 置 1 表示长模式已激活。\n<\/li><li>\n<code>GDTR<\/code>：由 <code>LGDT<\/code> 指令加载，保存 GDT 基地址与段限长。\n<\/ul>\n<p><strong>切换用到的指令<\/strong>：<code>CLI<\/code> 屏蔽可屏蔽中断；<code>LGDT<\/code> 加载 GDT；<code>MOV CR0<\/code> 写保护/分页位；<code>CPUID 0x80000001<\/code> 检测长模式支持（返回 <code>EDX<\/code> 第 29 位 LM）；<code>RDMSR/WRMSR<\/code> 读写 EFER；远跳转 <code>JMP<\/code> 刷新 CS 与指令流水线。<\/p>\n<p><strong>A20 开关<\/strong>：早期处理器只有 20 根地址线，超过 1MB 的寻址只有低 20 位有效；硬件保留一个开关控制第 20 根地址线，本书代码经 8042 键盘控制器端口 <code>92h<\/code> 置位 A20（原书 3.2.3 节，PDF 第 69 页）。<\/p>\n<p><strong>IA-32e 模式<\/strong>：含兼容模式与 64 位模式；段基地址、限长被扁平化，页表升级为四级，线性地址有效 48 位且高位必须是第 47 位符号扩展（Canonical）。<\/p>\n<h2>执行推导与推演<\/h2>\n<p>第一步，备结构：在内存里建 GDT，第一项为 NULL 描述符，代码段、数据段描述符各一项；<code>GdtPtr<\/code> 结构里存 GDT 线性基地址与段限长。<\/p>\n<p>第二步，开 A20：读端口 <code>92h<\/code>，<code>OR 02h<\/code> 后写回 <code>92h<\/code>，让第 20 根地址线参与寻址。<\/p>\n<p>第三步，进保护模式：<code>CLI<\/code>；<code>LGDT [GdtPtr]<\/code>；<code>MOV EAX, CR0<\/code>，<code>OR EAX, 1<\/code>，<code>MOV CR0, EAX<\/code> 置 PE；紧跟一条远跳转 <code>JMP SelectorCode32:GO_TO_TMP_Protect<\/code>，把 32 位代码段选择子装入 CS，刷新流水线（原书 3.2.3 节，PDF 第 81 页）。<\/p>\n<p>第四步，检测长模式：<code>CPUID<\/code> 扩展号 <code>0x80000001<\/code>，查 <code>EDX<\/code> LM 位；为 0 则待机。<\/p>\n<p>第五步，备长模式页表：清 <code>CR0.PG<\/code>；置 <code>CR4.PAE<\/code>；把 PML4 物理基地址载入 <code>CR3<\/code>；<code>WRMSR<\/code> 置 <code>IA32_EFER.LME<\/code>；置 <code>CR0.PG<\/code>，硬件置位 <code>LMA<\/code>（PDF 第 83、87 页）。<\/p>\n<p>第六步，切 64 位代码段：再一条远跳转把 CS 换成 64 位代码段选择子，处理器才从兼容模式进入 64 位模式。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：引导程序运行在实模式入口，内存中已布置好 GDT、页表；代码段在同一性映射下与物理地址重合。\n<\/li><li>\n失败案例：开分页后再使能或禁止 LME；未开 PAE 就使能分页；激活长模式后再禁 PAE；CS 的 L 位已置位又试图激活长模式——上述情况触发 <code>#GP<\/code> 通用保护性异常（PDF 第 83 页）。\n<\/li><li>\n顺序反例：A20 未开就访问 1MB 以上地址，高位被截断折回低 1MB；PE 置位后不做远跳转，流水线残留实模式解码状态；PG 置位前未建页表、未载 CR3，取指即按空表项查页，P=0 触发 <code>#PF<\/code>。\n<\/li><li>\n边界：本书引导阶段先在保护模式完成内核加载与初启，长模式切换在加载内核前后执行；不同引导方案的切分点可以不同，但标志位依赖顺序不能变。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>保护模式 vs 长模式<\/strong>：保护模式引入特权级、描述符与可选分页，仍是 32 位线性地址；长模式在保护模式基础上扁平化段管理、升级四级页表并支持 64 位寻址。长模式包含兼容模式，兼容模式跑 32 位代码，不是保护模式。\n<\/li><li>\n<strong>PE 位 vs PG 位<\/strong>：PE 控制是否进入保护模式，PG 控制分页是否生效；两者独立，可在保护模式下先不开分页运行。\n<\/li><li>\n<strong>LME vs LMA<\/strong>：LME 是软件请求位，LMA 是硬件激活反馈位；软件置 LME 后，硬件在分页与 PAE 条件齐备时置 LMA。\n<\/li><li>\n<strong>LGDT vs 远跳转<\/strong>：LGDT 只是把表基地址写入 GDTR，不改变 CS；远跳转才真正用新选择子刷新段寄存器与流水线，二者不能互相替代。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无（本章起点）。后继：概念 c02 展开选择子与描述符位域；概念 c03 用到切换后启用的分页机制；概念 c04 的 IDT 门描述符依赖保护模式特权级与 GDT。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（实模式到保护模式再到 IA-32e 的模式切换）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：两次模式切换的依赖链、执行流水线与算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把处理器从实模式切到 64 位长模式，先往回追四层前提：<\/p>\n<ol><li>\n处理器上电后的默认状态是实模式：16 位通用寄存器、段地址左移 4 位拼偏移、无特权级检查、无分页，物理寻址被限制在 1MB 内（原书 6.3 节，PDF 第 212 页）。操作系统必须先在这个状态下完成最早期的引导准备，才能谈保护与分页。\n<\/li><li>\n保护模式的一切检查都以描述符表为依据：段寄存器不再装段基地址，而是装选择子；处理器凭选择子查 GDT/LDT 取描述符。因此切保护模式之前，内存里必须已有一张合法 GDT，且 GDTR 已指向它。\n<\/li><li>\n长模式要求启用物理地址扩展与四级页表：<code>CR4.PAE<\/code> 先开，顶层页表物理基地址先载入 <code>CR3<\/code>，EFER.LME 软件请求，<code>CR0.PG<\/code> 最后置位；缺任何一个前置位，LMA 不会被硬件置位。\n<\/li><li>\n切换的每一步都要落在可执行的代码上。开分页之后，取指按新页表翻译地址；若新旧代码不在同一性映射页面内，<code>CR0.PG<\/code> 置位后的第一条指令就可能取指失败。\n<\/ol>\n<p>依赖链方向：实模式默认状态 → 布置 GDT/IDT/页表等结构 → 置 PE 进保护模式 → 检测 LM、备页表、置 PAE/LME/PG 进长模式 → 远跳转刷新到 64 位代码段。任何一层前提缺失，后一步要么硬件不接受，要么进入异常。<\/p>\n<h2>正向推导：逐步还原两条切换流水线<\/h2>\n<h3>第一段：实模式 → 保护模式<\/h3>\n<p>第一步，中断必须先关掉。实模式下 IDT 还没初始化，若外部中断在切换中途到来，向量号查不到合法门描述符，处理器行为不可预期。<code>CLI<\/code> 复位 EFLAGS.IF，屏蔽可屏蔽外部中断；此时非屏蔽中断与异常仍可能发生，所以 GDT 也应尽早布置。<\/p>\n<p>第二步，写 GDT 内存内容。表首项必须是全零的 NULL 描述符；其后依次放代码段描述符、数据段描述符。<code>GdtPtr<\/code> 是 6 字节结构：2 字节表限长，4 字节 GDT 线性基地址。<code>LGDT [GdtPtr]<\/code> 把这两个值载入 <code>GDTR<\/code>。<\/p>\n<p>第三步，置 PE。<code>MOV EAX, CR0<\/code> 读出当前 <code>CR0<\/code>，<code>OR EAX, 1<\/code> 把第 0 位 PE 置 1，<code>MOV CR0, EAX<\/code> 写回。注意：置 PE 之前处理器按实模式解释指令，置位之后才按保护模式解释；置位瞬间 CS 的隐藏缓存区还保留着实模式段信息。<\/p>\n<p>第四步，远跳转刷新。紧跟 <code>JMP SelectorCode32:GO_TO_TMP_Protect<\/code>：处理器把选择子 <code>SelectorCode32<\/code> 拆成 Index/TI/RPL，查 GDT 取 32 位代码段描述符，载入 CS 隐藏缓存区，RIP 落到 <code>GO_TO_TMP_Protect<\/code>。这条跳转同时清空预取队列，丢掉流水线里实模式解码的旧指令流。<\/p>\n<h3>第二段：保护模式 → IA-32e<\/h3>\n<p>第一步，检测长模式能力。<code>CPUID<\/code> 传入扩展功能号 <code>0x80000001<\/code>，返回 <code>EDX<\/code> 第 29 位 LM：为 1 表示支持 IA-32e；为 0 不能进入长模式，引导流程转入待机或 32 位路径（原书 3.2.3 节，PDF 第 84 页）。<\/p>\n<p>第二步，拆分页。清 <code>CR0.PG<\/code>：长模式的页表结构与 32 位两级分页不兼容，必须先关分页，避免硬件拿旧页表去翻译新结构下的地址。<\/p>\n<p>第三步，开 PAE。置 <code>CR4.PAE<\/code>（第 5 位），启用物理地址扩展与 64 位页表项格式。<\/p>\n<p>第四步，载 <code>CR3<\/code>。把 PML4 表的物理基地址写入 <code>CR3<\/code>；PML4 与下各级表项此时必须已在物理内存中建好，且表项里的存在位与基地址字段合法。<\/p>\n<p>第五步，软件请求长模式。<code>WRMSR<\/code> 写 MSR <code>0xC0000080<\/code>（IA32_EFER），置第 8 位 LME。<\/p>\n<p>第六步，开分页。置 <code>CR0.PG<\/code>（第 31 位）。硬件在 PAE、CR3、LME 条件齐备后，把 EFER 第 10 位 LMA 置 1，反馈长模式已激活。<\/p>\n<p>第七步，进 64 位代码段。此时处理器可能仍处于兼容模式，CS 挂着 32 位描述符；再执行一条远跳转，把 64 位代码段选择子装入 CS，才真正进入 64 位模式。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：由选择子算 GDT 项字节偏移<\/h3>\n<p>本书 3.2.3 节代码里出现两个选择子：<code>SelectorCode32 = 0x0008<\/code>，<code>SelectorData32 = 0x0010<\/code>（PDF 第 81、83 页）。选择子 16 位：15:3 位 Index，第 2 位 TI，1:0 位 RPL。<\/p>\n<ul><li>\n<code>0x0008<\/code> 二进制 <code>0000 0000 0000 1000<\/code>：TI=0（查 GDT），RPL=00，Index = <code>0x0008 &gt;&gt; 3 = 1<\/code>。描述符在 GDT 中的字节偏移 = Index × 8 = <code>1 × 8 = 8<\/code>，即 GDT 第 2 项（第 1 项为 NULL，偏移 0）。\n<\/li><li>\n<code>0x0010<\/code> 二进制 <code>0000 0000 0001 0000<\/code>：TI=0，RPL=00，Index = <code>0x0010 &gt;&gt; 3 = 2<\/code>。字节偏移 = <code>2 × 8 = 16<\/code>，即 GDT 第 3 项。\n<\/ul>\n<p>对照 GDT 布置：偏移 0 是 NULL，偏移 8 是 32 位代码段，偏移 16 是 32 位数据段，与代码里选择子指向一致。<\/p>\n<h3>算例 2：EFER 与 CR0/CR4 位域逐位展开<\/h3>\n<p>设切换前 <code>CR0 = 0x00000001<\/code>（PE 已置），<code>CR4 = 0<\/code>，<code>EFER = 0<\/code>。<\/p>\n<ol><li>\n进长模式第一步清 PG：<code>CR0<\/code> 第 31 位清 0，其余保留，<code>CR0 = 0x00000001<\/code>。\n<\/li><li>\n置 PAE：<code>CR4<\/code> 第 5 位置 1，位 5 对应权值 <span class=\"katex-inline\">2^5 = 32<\/span>，<code>CR4 = 0x00000020<\/code>。\n<\/li><li>\n载 CR3：PML4 物理基地址取 <code>0x90000<\/code>（本书长模式页表示例布局，PDF 第 87 页），<code>CR3 = 0x90000<\/code>。\n<\/li><li>\n置 LME：EFER 第 8 位置 1，权值 <span class=\"katex-inline\">2^8 = 256<\/span>，<code>EFER = 0x00000100<\/code>。\n<\/li><li>\n置 PG：<code>CR0<\/code> 第 31 位置 1，权值 <span class=\"katex-inline\">2^{31}<\/span>，<code>CR0 = 0x80000001<\/code>；硬件随后置 LMA（第 10 位），<code>EFER = 0x00000500<\/code>。\n<\/ol>\n<h3>对抗性追问：如果 PG 先于 LME 置位会怎样<\/h3>\n<p><code>CR0.PG<\/code> 先置位时，PAE 已开但 EFER.LME 为 0，硬件按 32 位 PAE 分页解释 <code>CR3<\/code> 与线性地址；随后再置 LME，页表项格式与地址宽度不一致，属于一致性检测失败，触发 <code>#GP<\/code>。反过来，LME 置位后、PG 未置位时，长模式并未激活，代码仍按兼容模式执行。顺序链是：PAE → CR3 → LME → PG → LMA 反馈。<\/p>\n<h2>延伸推演：实模式寻址瓶颈与保护模式段缓存区<\/h2>\n<h3>实模式为什么必须先被换掉<\/h3>\n<p>实模式下线性地址按 <code>段寄存器 × 16 + 偏移<\/code> 计算。16 位段寄存器最大值 <code>0xFFFF<\/code>，左移 4 位后为 <code>0xFFFF0<\/code>，加上 16 位偏移最大 <code>0xFFFF<\/code>，得到 <code>0x10FFEF<\/code>，略超 1MB；这也是 A20 开关存在的历史背景。实模式段可以任意重叠：同一个物理地址能被多个段:偏移组合访问，段寄存器里装的是可写的基地址，用户程序可以改段寄存器指向任何内存，没有任何特权级拦截。操作系统无法把程序限制在自己的地址区间内，多任务隔离无从谈起。<\/p>\n<p>保护模式把段寄存器的内容换成选择子：段基地址、段限长、属性不再由软件直接写在段寄存器里，而是存到 GDT/LDT 的描述符中；处理器把描述符内容加载到段寄存器的隐藏缓存区，后续地址翻译用缓存区里的基地址与限长，而不是段寄存器原值。软件不能绕过选择子直接改缓存区，访问前还要过 CPL/RPL/DPL 特权级检查与限长检查。这层替换正是 PE 置位与远跳转之后才完成的：<code>LGDT<\/code> 备好描述符表，远跳转把第一项合法描述符载入 CS 缓存区。<\/p>\n<h3>兼容模式在长模式里扮演什么角色<\/h3>\n<p>长模式分 64 位模式与兼容模式两种状态。激活长模式后，CPU 上运行的代码段若按 32 位描述符执行，就处于兼容模式：32 位应用代码的寻址与指令宽度沿用保护模式习惯，只是底层物理地址走四级页表；只有 CS 描述符的 L 位（64 位代码段标志）置位、并经远跳转载入 CS 后，才进入 64 位模式。本书引导流程先在保护模式/兼容模式下完成内核早期初始化，再切换到 64 位内核代码，这个两段式结构就是为了让 32 位引导代码与 64 位内核代码衔接。<\/p>\n<h3>一致性检测覆盖的失败组合<\/h3>\n<p>处理器对长模式激活设置了一组互斥条件，本书 3.2.3 节列出的失败组合包括：开分页后再使能或禁止 LME；未开 PAE 就使能分页；激活长模式后再禁止 PAE；CS 的 L 位已置位又试图激活长模式（PDF 第 83 页）。这些组合的共同特征是页表结构、地址宽度与代码段宽度三者不一致。硬件在置 PG 或加载 CS 描述符的瞬间做一致性检查，失败即送 <code>#GP<\/code>；检查发生在切换路径上，若此时 IDT 尚未加载，异常无法被服务，系统直接停住。这也解释了引导顺序里为什么 IDT 必须在开中断之前用 <code>LIDT<\/code> 就位。<\/p>\n<h2>延伸推演：引导阶段的时序约束<\/h2>\n<h3>开分页前后为什么要求同一性映射<\/h3>\n<p>置 <code>CR0.PG<\/code> 的瞬间，取指地址立即按页表翻译。若代码所在线性地址与物理地址在新页表里不重合，<code>PG<\/code> 置位后的第一条取指就会跳到错误物理位置。因此引导阶段先建同一性（恒等）映射：线性地址 <span class=\"katex-inline\">x<\/span> 映射到物理地址 <span class=\"katex-inline\">x<\/span>，保证开分页前后取指位置不变；内核完全接管后再替换成正式页表。本书长模式引导代码用 2MB 页面恒等映射 0–2MB 区间（PDF 第 87 页），覆盖引导代码与早期内核数据。<\/p>\n<h3>32 位代码到 64 位代码的过渡<\/h3>\n<p>保护模式与兼容模式下指令是 32 位宽度，64 位模式下默认操作数与地址宽度变为 64 位。切换不能靠改一个标志位完成：CS 描述符的 L 位决定代码宽度，必须经远跳转载入新代码段选择子，处理器才切换指令解码宽度。这也是第二次远跳转不可省略的原因——只置 LME/PG 而不换 64 位代码段，CPU 仍在兼容模式跑 32 位指令。<\/p>\n<h3>IDT 为什么不能等开中断后再补<\/h3>\n<p>切换中途若允许外部中断，向量号在尚未配置的 IDT 里查不到合法门，触发二次异常把流程冲乱。引导顺序因此是：先备 GDT/IDT/页表 → 关中断切模式 → 内核初始化完成后再开中断。<code>LIDT<\/code> 加载 IDT 可以早于 <code>STI<\/code>，门描述符先就位，中断一旦被允许就有合法入口。<\/p>\n<h3>对抗性追问：模式顺序能否合并<\/h3>\n<p>理论上能否跳过保护模式直接进长模式？硬件要求长模式激活前必须先开 PAE、建 64 位页表，且 <code>CR0.PE<\/code> 必须为 1（长模式是保护模式的扩展状态）。<code>PE=0<\/code> 时置 LME/PG 属于一致性失败，触发 <code>#GP<\/code>。所以实模式 → 保护模式 → 长模式两段顺序由硬件寄存器依赖关系决定，不能合并。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n实模式下线性地址由哪两部分拼成？（段基地址左移 4 位加偏移，寻址上限 1MB。）\n<\/li><li>\n<code>LGDT<\/code> 写入哪个寄存器？它和远跳转各自负责什么？（写入 GDTR，只登记表位置；远跳转刷新 CS 与流水线。）\n<\/li><li>\n长模式切换时 PAE、CR3、LME、PG 四个动作的先后顺序是什么？（清 PG → 置 PAE → 载 CR3 → 置 LME → 置 PG。）\n<\/li><li>\nLME 与 LMA 哪个是软件写、哪个是硬件置？（LME 软件请求，LMA 硬件激活反馈。）\n<\/li><li>\nA20 未开启时，访问超过 1MB 的地址会落到哪里？（高位被截断，折回低 20 位对应的低 1MB 地址。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "实模式到保护模式再到 IA-32e 的模式切换"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：一个64位操作系统的设计与实现.pdf · p.214<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">实模式到保护模式再到 IA-32e 的模式切换<\/a><\/span><\/div><h1>段描述符与段选择子（GDT/LDT、CPL/DPL/RPL）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章（原书第 6 章 6.4.2 段管理机制）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>实模式下段寄存器直接装段基地址，程序可以随意改段寄存器指向任何内存。保护模式要做两件事：把&quot;段在哪里、有多大、有什么权限&quot;集中存到表结构里；把段寄存器换成一个间接索引，让处理器每次访问都先查表、再做特权级与限长检查。这个概念回答选择子拆成哪几个位域、描述符每一字节存什么、三个特权级各由谁给出。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>GDT（全局描述符表）<\/strong>：存放全局段描述符与系统段描述符的内存表，首项为 NULL 描述符；<code>GDTR<\/code> 保存其基地址与限长。<strong>LDT（局部描述符表）<\/strong>：按进程划分的局部段表，LDT 自身必须由 GDT 中的描述符管理；<code>LDTR<\/code> 保存其基地址、限长与选择子（原书 6.4.2 节，PDF 第 214、219 页）。<\/p>\n<p><strong>段选择子（16 位）位域<\/strong>：<\/p>\n<ul><li>\n<code>Index<\/code>（15:3 位，13 位）：描述符在表中的序号；处理器按 <code>Index × 8<\/code> 取 8 字节描述符。\n<\/li><li>\n<code>TI<\/code>（第 2 位）：0 查 GDT，1 查 LDT。\n<\/li><li>\n<code>RPL<\/code>（1:0 位）：请求特权级，取 0–3。\n<\/ul>\n<p><strong>保护模式段描述符（8 字节）字节布局<\/strong>：<\/p>\n<ul><li>\n字节 0–1：段限长 15:0。\n<\/li><li>\n字节 2–3：段基地址 15:0。\n<\/li><li>\n字节 4：段基地址 23:16。\n<\/li><li>\n字节 5（访问字节）：<code>P<\/code>（存在位）、<code>DPL<\/code>（2 位特权级）、<code>S<\/code>（描述符类型，代码/数据为 1，系统段为 0）、<code>Type<\/code>（4 位类型，区分代码段可读/可写/可执行/一致段等）。\n<\/li><li>\n字节 6：低 4 位为段限长 19:16；高 4 位标志 <code>G<\/code>（粒度）、<code>D/B<\/code>（默认操作数宽度）、<code>L<\/code>（64 位代码段标志）、<code>AVL<\/code>（软件可用位）。\n<\/li><li>\n字节 7：段基地址 31:24。\n<\/ul>\n<p><strong>三个特权级<\/strong>：<code>CPL<\/code> 是当前程序特权级，存于 CS、SS 选择子低 2 位；<code>RPL<\/code> 是选择子携带的请求特权级；<code>DPL<\/code> 是描述符里规定的段权限。访问代码段时处理器比较三者；数据段访问要求 CPL/RPL 优先级不低于 DPL；跨级进入代码段还要经门描述符中转（PDF 第 217 页）。<\/p>\n<h2>执行推导与推演<\/h2>\n<p>给定选择子 <code>0x001B<\/code>：二进制 <code>0000 0000 0001 1011<\/code>。低 2 位 <code>11<\/code> 得 RPL=3；第 2 位 TI=1，指示查 LDT；Index = <code>0x001B &gt;&gt; 3 = 3<\/code>。若该 LDT 基地址为 <code>0x28000<\/code>，描述符字节偏移 = <code>3 × 8 = 24 = 0x18<\/code>，描述符线性地址 = <code>0x28000 + 0x18 = 0x28018<\/code>。<\/p>\n<p>从取出的 8 字节描述符拼基地址：字节 2–3 给基地址 15:0，字节 4 给 23:16，字节 7 给 31:24。若三字节分别为 <code>0x00<\/code>、<code>0x10<\/code>、<code>0x00<\/code>、<code>0x80<\/code>，则基地址 = <code>0x00801000<\/code>。限长由字节 0–1 与字节 6 低 4 位拼成；访问时线性地址落在 <code>[基地址, 基地址+限长]<\/code> 内才合法。<\/p>\n<p>特权级检查示例：CPL=3 的用户程序要进入 DPL=0 的内核代码段，直接拿 RPL=3 的选择子跳转，优先级不满足检查，触发 <code>#GP<\/code>；必须经中断门/系统调用门，由门描述符把目标段选择子转交处理器完成跨级切换。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：运行在保护模式或长模式兼容模式；段选择子 Index 未超出表限长；描述符 <code>P=1<\/code>；目标段类型与访问方式匹配。\n<\/li><li>\n失败案例：Index 越出 GDT/LDT 限长，或描述符 <code>P=0<\/code>（段不存在），触发 <code>#NP<\/code> 段不存在异常；特权级不足触发 <code>#GP<\/code>；数据段被当成可执行段访问触发类型不符异常。\n<\/li><li>\n边界：IA-32e 64 位模式下段基地址与限长被强制扁平化，CS/DS/ES/SS 直接覆盖到整个地址空间，段检查基本退化；但选择子、特权级与门描述符机制仍在，系统调用跨级与中断栈切换仍依赖它们。\n<\/li><li>\n本书第一版引导代码在保护模式阶段使用代码段选择子 <code>0x0008<\/code>、数据段选择子 <code>0x0010<\/code>（PDF 第 81、83 页），对应 GDT 第 2、3 项。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>GDT vs LDT<\/strong>：GDT 全局共享，存内核段、TSS 与各 LDT 自身描述符；LDT 局部于进程，存放进程私有段。TI 位决定查哪张表。\n<\/li><li>\n<strong>CPL vs RPL vs DPL<\/strong>：CPL 是&quot;当前我是谁&quot;，RPL 是&quot;这个选择子以什么身份请求&quot;，DPL 是&quot;段允许谁访问&quot;；三者比较时，取 CPL 与 RPL 中优先级更低（数值更大）的一方去对 DPL。\n<\/li><li>\n<strong>选择子 vs 描述符<\/strong>：选择子是 16 位索引，存放在段寄存器可见位置；描述符是 8 字节（系统段在 IA-32e 下为 16 字节）属性记录，存放在表里。段寄存器的隐藏缓存区保存的是描述符副本。\n<\/li><li>\n<strong>段机制 vs 分页机制<\/strong>：段把逻辑地址先翻译成线性地址；分页再把线性地址翻译成物理地址。保护模式可不开分页直接用线性地址；长模式下段机制被扁平化，隔离职责主要落到分页。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的模式切换建立了 GDT 与保护模式环境。后继：概念 c03 的分页接收段机制产出的线性地址；概念 c04 的门描述符用选择子定位中断处理代码段；概念 c12 系统调用跨级切换复用同一套特权级检查。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（段描述符与段选择子（GDT/LDT、CPL/DPL/RPL））<\/summary><div class=\"depth-body\"><h1>c02 深度推导：选择子查表、描述符拼装与特权级比较<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把选择子翻译成一次合法的段访问，往回追四层前提：<\/p>\n<ol><li>\n处理器必须已进入保护模式以上模式：实模式下段寄存器直接装基地址，不存在选择子查表过程。\n<\/li><li>\n一张合法描述符表已就位：GDT 由 GDTR 指向，LDT 由 LDTR 指向；表项存在位 P、限长与属性由引导代码填好。\n<\/li><li>\n选择子的位域定义先固定：13 位 Index、1 位 TI、2 位 RPL，查表时按 Index×8 取表项宽度。\n<\/li><li>\n特权级模型先固定：CPL 在 CS/SS 低两位，RPL 在选择子低两位，DPL 在描述符访问字节里；比较规则区分数据段访问与代码段跳转两种方向。\n<\/ol>\n<p>依赖链方向：模式切换（c01）→ 表与寄存器就位 → 选择子拆位域 → 取描述符拼基地址/限长/属性 → 特权级与限长检查 → 产出线性地址。任何一层前提变化，查表路径就要重写：长模式扁平化段基地址后，基地址拼装步骤实际被硬件忽略。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：拆选择子<\/h3>\n<p>16 位选择子 <code>sel<\/code>：<\/p>\n<div class=\"katex-block\">\\text{Index} = \\text{sel} \\gg 3,\\quad \\text{TI} = (\\text{sel} \\gg 2) \\,\\&\\, 1,\\quad \\text{RPL} = \\text{sel} \\,\\&\\, 3<\/div>\n<p>TI=0 时表基地址取 <code>GDTR.base<\/code>，TI=1 时取 <code>LDTR.base<\/code>。表项字节偏移 = <code>Index × 8<\/code>（保护模式普通段描述符宽度）；系统段在 IA-32e 下为 16 字节，偏移规则随描述符宽度变化。<\/p>\n<h3>第二步：从表内存取 8 字节描述符<\/h3>\n<p>描述符线性地址 = 表基地址 + <code>Index × 8<\/code>。8 字节按下面顺序还原三个字段：<\/p>\n<ul><li>\n段基地址：<code>byte[2] | byte[3]&lt;&lt;8 | byte[4]&lt;&lt;16 | byte[7]&lt;&lt;24<\/code>。\n<\/li><li>\n段限长：<code>byte[0] | byte[1]&lt;&lt;8 | (byte[6] &amp; 0x0F)&lt;&lt;16<\/code>。\n<\/li><li>\n访问字节 <code>byte[5]<\/code>：<code>P<\/code> 为第 7 位，<code>DPL<\/code> 为第 6:5 位，<code>S<\/code> 为第 4 位，<code>Type<\/code> 为第 3:0 位。\n<\/li><li>\n标志字节 <code>byte[6]<\/code> 高 4 位：<code>G<\/code> 第 7 位，<code>D/B<\/code> 第 6 位，<code>L<\/code> 第 5 位，<code>AVL<\/code> 第 4 位。\n<\/ul>\n<h3>第三步：限长与粒度<\/h3>\n<p><code>G=0<\/code> 时限长按字节计，最大值 <code>0xFFFFF<\/code>（1MB）；<code>G=1<\/code> 时限长按 4KB 页计，硬件把限长左移 12 位并加 <code>0xFFF<\/code>，最大覆盖 <code>0xFFFFF × 4KB<\/code> 量级。<code>D/B<\/code> 决定默认操作数与栈宽度；<code>L=1<\/code> 表示 64 位代码段，此时 <code>D/B<\/code> 必须为 0。<\/p>\n<h3>第四步：特权级检查<\/h3>\n<p>数据段读/写：要求 <code>max(CPL, RPL) ≤ DPL<\/code>（数值越小优先级越高，&quot;≤&quot;表示优先级不低于 DPL）。代码段直接跳转：目标代码段 DPL 必须与 CPL 同级；跨级跳转不能用普通段选择子直跳，必须经门描述符（中断门、陷阱门、调用门），门里记录目标段选择子与偏移，处理器在门处完成特权级移交。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：选择子到描述符地址<\/h3>\n<p>选择子 <code>0x001B<\/code>，LDT 基地址 <code>0x28000<\/code>。<\/p>\n<ul><li>\nRPL = <code>0x1B &amp; 3 = 3<\/code>。\n<\/li><li>\nTI = <code>(0x1B &gt;&gt; 2) &amp; 1 = 1<\/code>，查 LDT。\n<\/li><li>\nIndex = <code>0x1B &gt;&gt; 3 = 3<\/code>。\n<\/li><li>\n表项偏移 = <code>3 × 8 = 24 = 0x18<\/code>。\n<\/li><li>\n描述符线性地址 = <code>0x28000 + 0x18 = 0x28018<\/code>。\n<\/ul>\n<p>对照 GDT 情形：选择子 <code>0x0008<\/code>，GDT 基地址设为 <code>0x90000<\/code>，RPL=0，TI=0，Index=1，偏移 <code>1×8=8<\/code>，描述符地址 <code>0x90008<\/code>；<code>0x0010<\/code> 对应 Index=2，偏移 16，地址 <code>0x90010<\/code>。<\/p>\n<h3>算例 2：从 8 字节拼基地址与限长<\/h3>\n<p>设描述符 8 字节（小端）依次为：<code>00 10 00 10 80 FF 8F 00<\/code>。<\/p>\n<ul><li>\n基地址：byte2=<code>00<\/code>，byte3=<code>10<\/code>，byte4=<code>80<\/code>，byte7=<code>00<\/code> → <code>0x00 &lt;&lt; 0 | 0x10&lt;&lt;8 | 0x80&lt;&lt;16 | 0x00&lt;&lt;24 = 0x801000<\/code>。\n<\/li><li>\n限长低 16 位：byte0=<code>00<\/code>，byte1=<code>10<\/code> → <code>0x1000<\/code>；byte6=<code>8F<\/code>，低 4 位 <code>F<\/code> → 限长高 4 位 <code>0xF<\/code>，拼接限长 = <code>0xF1000<\/code>。\n<\/li><li>\n访问字节 byte5=<code>FF<\/code>：P=1，DPL=3，S=1，Type=<code>0xF<\/code>。\n<\/li><li>\nbyte6=<code>8F<\/code>：G=1（第 7 位），D/B=0，L=0，AVL=0；G=1 时限长按页折算，实际覆盖范围 = 基地址起 <code>(0xF1000 + 1) × 4KB<\/code> 量级。\n<\/ul>\n<h3>算例 3：特权级比较<\/h3>\n<p>CPL=3，选择子 RPL=3，目标数据段 DPL=0：<code>max(3,3)=3<\/code>，<code>3 ≤ 0<\/code> 不成立，访问被拒，触发 <code>#GP<\/code>。CPL=0 的内核代码访问 DPL=0 段：<code>max(0,0)=0 ≤ 0<\/code>，通过。用户态要进内核代码段：直跳时目标 DPL=0 与 CPL=3 不同级，检查失败；走中断门/系统调用门后，处理器以门允许的特权级加载目标选择子，完成跨级。<\/p>\n<h2>延伸推演：LDT、TSS 与 64 位扁平化<\/h2>\n<p>LDT 解决&quot;每个进程私有段放哪里&quot;：GDT 不能无限膨胀装下所有进程私有段，因此每个进程一张 LDT，LDT 的描述符登记在 GDT 里，<code>LDTR<\/code> 指向当前 LDT。切换进程时换 <code>LDTR<\/code>，局部段空间随之切换。TSS（任务状态段）是另一种系统段描述符，保存各级栈指针（<code>rsp0<\/code>/<code>rsp1<\/code>/<code>rsp2<\/code>）与通用寄存器快照；硬件任务切换或特权级压栈时，处理器从 TSS 取目标特权级栈地址。<\/p>\n<p>IA-32e 64 位模式下，段基地址被强制为 0、限长被强制为全段覆盖，段翻译步骤退化；但选择子低两位 CPL、门描述符与 TSS 栈切换仍然有效。本书 PCB 的 <code>thread_struct<\/code> 里 <code>rsp0<\/code> 就对应 TSS 0 级栈指针，中断从用户态进入内核时，处理器按 CPL 从 TSS/线程结构取内核栈地址（原书 4.8.2 节，PDF 第 170 页）。<\/p>\n<h2>延伸推演：段类型、跨级门与 64 位退化<\/h2>\n<h3>代码段的一致与依从属性<\/h3>\n<p>代码段描述符 Type 位区分可读/可执行、一致段（conforming）与非一致段。一致段允许低特权级代码以受控方式进入：跳转后 CPL 不变，段内指令按原特权级执行，常用于库代码；非一致段跨级跳转必须经门，CPL 随目标段改变。数据段分可读、可写，不可写的数据段被写访问触发 <code>#GP<\/code>。段类型与访问方式不符时，检查在取指或访问瞬间失败。<\/p>\n<h3>限长检查怎样触发异常<\/h3>\n<p>地址翻译后，处理器比较偏移与段限长：偏移超出 <code>[0, 限长]<\/code> 范围送 <code>#GP<\/code>（数据/代码段越界）或 <code>#SS<\/code>（栈段越界）。粒度 G=1 时限长按页折算，硬件把限长左移 12 位并加 <code>0xFFF<\/code>；栈段的 ESP 还要经过栈限长检查，栈指针越界触发 <code>#SS<\/code>。栈段必须是可写数据段，加载不可写段到 SS 直接送 <code>#GP<\/code>。<\/p>\n<h3>LDT 切换与 TSS 描述符<\/h3>\n<p>切换进程时 <code>LDTR<\/code> 换成目标进程 LDT 的选择子，LDT 自身描述符登记在 GDT。TSS 是系统段，描述符在 IA-32e 下为 16 字节，记录 TSS 基地址、限长与属性；TSS 内保存 <code>rsp0/rsp1/rsp2<\/code> 与 IST 栈指针。硬件任务切换（任务门）在现代操作系统中基本不用，本书用软件上下文切换（c06），TSS 只承担栈指针提供职责。<\/p>\n<h3>调用门跨级的字段<\/h3>\n<p>调用门描述符记录目标段选择子、偏移与参数个数；用户态经调用门进入内核段时，处理器按门指定的目标段完成特权级移交，栈从 TSS 取目标级栈。系统调用门、中断门、陷阱门同属门描述符体系，差别在触发方式与 IF 处理（c04、c12）。<\/p>\n<h3>64 位模式下的段寄存器实践<\/h3>\n<p>IA-32e 64 位模式下，<code>DS<\/code>、<code>ES<\/code>、<code>SS<\/code> 的段基地址被强制为 0，限长强制全段覆盖；实践中内核常把这些段选择子置为 NULL 或平铺段描述符，段检查基本退化，隔离职责交给分页。<code>CS<\/code> 仍保留 L 位与特权级，<code>FS<\/code>、<code>GS<\/code> 可经 MSR 设置段基地址，用于线程局部存储等场景；本书 <code>thread_struct<\/code> 保存 <code>fs<\/code>/<code>gs<\/code> 正是为切换后恢复这两个段寄存器。<\/p>\n<h3>对抗性追问：选择子 Index 越界会怎样<\/h3>\n<p>Index 乘 8 后的偏移超出 GDTR/LDTR 限长，处理器不读表项，直接送 <code>#GP<\/code>；若表项 P=0 送 <code>#NP<\/code>。这类失败发生在加载段寄存器瞬间，而不是后续访问内存时，故障定位要回看最近一次段选择子加载。<\/p>\n<h2>第二算例与补充推演<\/h2>\n<h3>选择子 RPL 继承算例<\/h3>\n<p>用户态程序持有选择子 <code>0x0027<\/code>：RPL=3，TI=1，Index=<code>0x0027&gt;&gt;3=4<\/code>。内核代用户访问数据段时，若直接用内核选择子（RPL=0）加载段，绕过了用户权限检查；规范做法是把请求段选择子的 RPL 置成与 CPL 一致（RPL 继承），让处理器按用户身份做 DPL 检查。RPL 是选择子自带的&quot;请求身份&quot;，不随当前 CPL 自动改变。<\/p>\n<h3>段加载失败排查顺序<\/h3>\n<p>加载段寄存器失败时，按检查顺序回看：先看 Index 是否越出表限长，再看 P 位是否为 0，再对 CPL/RPL/DPL 做比较，最后看段类型与访问方式是否匹配（代码段不可写、数据段不可执行）。<code>#GP<\/code> 多为特权级/一致性/限长问题，<code>#NP<\/code> 是 P=0，<code>#SS<\/code> 是栈段问题；错误码里的 Index/TI 指回出问题的描述符。<\/p>\n<h3>LDT 描述符与 LDTR<\/h3>\n<p>LDT 本身在 GDT 中有一项系统段描述符：<code>LGDT<\/code> 建好 GDT 后，<code>LLDT<\/code> 把 LDT 选择子载入 LDTR，硬件再从 GDT 取 LDT 的基地址与限长缓存进 LDTR 隐藏区。切换进程换 LDTR 时，旧 LDT 表项仍留在 GDT，只是当前进程不再引用。<\/p>\n<h3>64 位模式下的 NULL 段实践<\/h3>\n<p>长模式 64 位代码中，<code>DS/ES/SS<\/code> 常加载 NULL 选择子（0）：段基地址强制 0、限长全段，段检查退化；此时若段描述符 P=0 也不会在普通数据访问中报错，因为这些段不再参与翻译。<code>CS<\/code> 不能为 NULL，它仍决定 L 位与 CPL；<code>FS/GS<\/code> 经 MSR 配置基地址，线程局部存储常用 GS 指向当前进程结构。<\/p>\n<h3>补充推演：描述符缓存区的更新时机<\/h3>\n<p>描述符内容只在选择子加载进段寄存器时读入隐藏缓存；修改 GDT/LDT 中已被引用的描述符后，缓存不会自动刷新，必须重新加载对应段选择子才能生效。引导代码改描述符表后紧跟远跳转，既是换 CS，也是刷新缓存。<\/p>\n<h3>补充：LDT 何时切换<\/h3>\n<p>进程私有段需要独立 LDT 时，切换进程把目标 LDT 选择子载入 LDTR；无局部段的进程可共用空 LDT。LDT 描述符在 GDT 中登记，其 P、限长、基地址同样受段检查约束；LDTR 加载失败触发 <code>#GP<\/code>。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n选择子 16 位各 bit 段是什么？（15:3 Index，第 2 位 TI，1:0 RPL。）\n<\/li><li>\nTI=1 时处理器查哪张表？（LDT，基地址在 LDTR。）\n<\/li><li>\n描述符访问字节里 P、DPL、S、Type 各占哪几位？（P 第 7，DPL 第 6:5，S 第 4，Type 第 3:0。）\n<\/li><li>\n数据段访问的特权级判据是什么？（<code>max(CPL,RPL) ≤ DPL<\/code>。）\n<\/li><li>\n用户态为什么不能直跳内核代码段？（跨级必须经门描述符移交特权级。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "段描述符与段选择子（GDT/LDT、CPL/DPL/RPL）"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：一个64位操作系统的设计与实现.pdf · p.246<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">段描述符与段选择子（GDT/LDT、CPL/DPL/RPL）<\/a><\/span><\/div><h1>四级页表与虚拟地址拆解：从线性地址到物理地址<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 1 章（原书第 6 章 6.4.4 页管理、6.4.5 地址转换、6.5.4/6.5.5 IA-32e 分页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>段机制只把逻辑地址翻译成线性地址；若线性地址直接等于物理地址，每个程序都能踩全部内存，进程之间没有隔离，多任务下地址布局也无法各自独立。分页机制把线性地址空间切成固定大小页面，用多级页表记录每页到物理页的映射：程序拿到的是虚拟（线性）地址，处理器查表后才落到物理内存。这个概念回答页表分几级、线性地址怎样切成索引与偏移、查表每一级读什么字段、表项属性位起什么作用。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>分页开关与基地址寄存器<\/strong>：<code>CR0.PG<\/code>（第 31 位）控制分页是否启用；<code>CR3<\/code> 保存顶层页表的物理基地址，进程切换时随 PCB 的内存空间一起更换（原书 6.4.4 节，PDF 第 229 页）。<\/p>\n<p><strong>32 位两级分页<\/strong>：32 位线性地址切成三段——31:22 位页目录索引（10 位）、21:12 位页表索引（10 位）、11:0 位页内偏移（12 位）。页目录（PDT）与页表（PT）各 1024 项，每项 4B，整张表 4KB。<\/p>\n<p><strong>IA-32e 四级分页<\/strong>：线性地址低 48 位参与检索，切成 PML4E 索引（47:39，9 位）、PDPTE 索引（38:30，9 位）、PDE 索引（29:21，9 位）、PTE 索引（20:12，9 位）、页内偏移（11:0，12 位）。支持 4KB、2MB、1GB 页面；地址高 16 位必须是第 47 位的符号扩展（Canonical 地址），否则触发异常（原书 6.5.1、6.5.4 节，PDF 第 237–238、246–248 页）。<\/p>\n<p><strong>页表项属性位<\/strong>：<code>P<\/code>（存在位，0 表示页不在内存，触发 <code>#PF<\/code>）、<code>R/W<\/code>（读/写）、<code>U/S<\/code>（用户/内核）、<code>A<\/code>（访问位）、<code>D<\/code>（脏位）；长模式页表项还记录物理页基地址高位与执行权限位。<\/p>\n<p><strong>查表过程<\/strong>：CR3 → 顶层表项 → 下一级表物理基地址 → 逐级取表项 → PTE 给出物理页基地址 → 加页内偏移得物理地址。任一级表项 P=0，处理器停止查表并送 <code>#PF<\/code> 缺页异常。<\/p>\n<h2>执行推导与推演<\/h2>\n<p>本书 32 位算例：线性地址 <code>0x0001200h<\/code>，段基地址为 0（原书 6.4.5 节，PDF 第 236 页）。<\/p>\n<ol><li>\n拆位：<code>0x0001200h<\/code> 低 12 位 = <code>0x200h<\/code>（页内偏移）；21:12 位 = <code>(0x1200 &gt;&gt; 12) &amp; 0x3FF = 1<\/code>（PT 索引 1）；31:22 位 = 0（PDT 索引 0）。\n<\/li><li>\nCR3 给出 PDT 基地址；PDT[0] 给出 PT 物理基地址。\n<\/li><li>\nPT[1] 给出物理页基地址，书里该页位于 <code>4000h–4FFFH<\/code>，基地址 <code>0x4000h<\/code>。\n<\/li><li>\n物理地址 = <code>0x4000h + 0x200h = 0x4200h<\/code>。\n<\/ol>\n<p>长模式算例（自拟表项，过程同书里四级查表规则）：线性地址 <code>0x0000_0000_0041_2340<\/code>。偏移 <code>0x340<\/code>；PTE 索引 <code>0x12<\/code>；PDE 索引 <code>2<\/code>；PDPTE、PML4 索引均为 0。设 PML4E[0] 指向 PDPT <code>0xA0000<\/code>，PDPTE[0] 指向 PD <code>0xB0000<\/code>，PDE[2] 指向 PT <code>0xC0000<\/code>，PTE[0x12] 指向物理页 <code>0x300000<\/code>；物理地址 = <code>0x300000 + 0x340 = 0x300340<\/code>。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：<code>CR0.PG=1<\/code>；<code>CR3<\/code> 指向合法顶层表；各级表项 P=1；线性地址在长模式下为 Canonical 地址。\n<\/li><li>\n失败案例：表项 P=0 访问触发 <code>#PF<\/code>；线性地址高位不是第 47 位符号扩展（非 Canonical）触发异常；未置 PG 却按页表地址解释取指，取指落到错误物理位置；进程切换未换新 CR3，新进程访问到旧进程页表。\n<\/li><li>\n边界：4KB 页面是默认粒度；2MB/1GB 大页由中间级表项直接映射，跳过下级表，减少 TLB 压力。分页只翻译地址，不负责把页面从磁盘换回内存，那是缺页异常处理程序的职责。\n<\/li><li>\n本书长模式引导代码在 <code>0x1000h/0x2000h/0x3000h<\/code> 布置 PML4/PDPT/PD，2MB 页面恒等映射 0–2MB（原书 3.2.3 节，PDF 第 87 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>分段 vs 分页<\/strong>：分段按程序逻辑切分可变长度段，段大小不一，外部碎片来自段间空隙；分页按固定大小页面切分，内部碎片来自页内未用空间。分段产出线性地址，分页把线性地址变物理地址；长模式下段机制扁平化，隔离主要靠分页。\n<\/li><li>\n<strong>线性地址 vs 物理地址<\/strong>：开分页前二者相等；开分页后线性地址是程序视角，物理地址是内存实际单元。\n<\/li><li>\n<strong>PDE vs PTE<\/strong>：32 位两级表里 PT 项直接指向物理页；四级表里 PDE 可指向 PT，也可在大页时直接指向 2MB 物理页。\n<\/li><li>\n<strong>#PF vs #GP<\/strong>：<code>#PF<\/code> 由页表项 P=0 或权限不足引发，属于内存映射问题；<code>#GP<\/code> 由段选择子、特权级、描述符一致性失败引发，属于段/权限问题。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c02 产出线性地址并提供特权级检查。后继：概念 c10 的物理页框分配管理 PTE 指向的物理页；概念 c06 进程切换更换 CR3；概念 c12 系统调用陷入内核后访问的内核内存同样经页表翻译。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（四级页表与虚拟地址拆解：从线性地址到物理地址）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：地址位域拆解、两级/四级查表全过程与算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把一个线性地址算到物理地址，往回追五层前提：<\/p>\n<ol><li>\n段机制已把逻辑地址翻译成线性地址：保护模式下段基地址加偏移得到线性地址；长模式下段基地址扁平化后，线性地址基本等于偏移。\n<\/li><li>\n分页已启用：<code>CR0.PG=1<\/code>，否则线性地址直接当物理地址，不存在查表过程。\n<\/li><li>\n顶层表物理基地址已在 <code>CR3<\/code>：进程自己的页表必须先建好并载入 CR3，切换进程时换 CR3。\n<\/li><li>\n地址位域划分先固定：32 位两级分 10+10+12，IA-32e 四级分 9+9+9+9+12；每级表项宽度与下级表基地址字段先固定。\n<\/li><li>\n表项属性先读懂：P 位决定继续查表还是送 <code>#PF<\/code>，R/W、U/S 决定访问权限，A/D 位记录访问与写脏状态。\n<\/ol>\n<p>依赖链方向：段翻译产出线性地址 → 拆索引与偏移 → CR3 取顶层表项 → 逐级取下级表基地址 → PTE 取物理页基地址 → 加偏移。任何一级表项 P=0，链条中断，进入缺页异常处理路径而不是继续查表。<\/p>\n<h2>正向推导<\/h2>\n<h3>32 位两级查表<\/h3>\n<p>线性地址 <span class=\"katex-inline\">v<\/span>，表项宽度 4B，每级 1024 项：<\/p>\n<div class=\"katex-block\">i_{\\text{PDT}} = (v \\gg 22) \\,\\&\\, 0x3FF,\\quad i_{\\text{PT}} = (v \\gg 12) \\,\\&\\, 0x3FF,\\quad o = v \\,\\&\\, 0xFFF<\/div>\n<p>查表：<code>pdpt = CR3<\/code>；<code>pdte = mem[pdpt + i_PDT×4]<\/code>，取其物理页基地址得到 <code>pt<\/code>；<code>pte = mem[pt + i_PT×4]<\/code>，取物理页基地址 <code>page<\/code>；物理地址 = <code>page + o<\/code>。<\/p>\n<h3>IA-32e 四级查表<\/h3>\n<p>线性地址 48 位有效部分：<\/p>\n<div class=\"katex-block\">i_{\\text{PML4}} = (v \\gg 39) \\,\\&\\, 0x1FF,\\quad i_{\\text{PDPT}} = (v \\gg 30) \\,\\&\\, 0x1FF,\\quad i_{\\text{PD}} = (v \\gg 21) \\,\\&\\, 0x1FF,\\quad i_{\\text{PT}} = (v \\gg 12) \\,\\&\\, 0x1FF,\\quad o = v \\,\\&\\, 0xFFF<\/div>\n<p>查表顺序：<code>pml4 = CR3<\/code> → PML4E[i_PML4] 给 <code>pdpt<\/code> → PDPTE[i_PDPT] 给 <code>pd<\/code> → PDE[i_PD] 给 <code>pt<\/code> → PTE[i_PT] 给 <code>page<\/code> → <code>page + o<\/code>。长模式表项 8B，索引乘 8 定位表项。<\/p>\n<h3>表项属性检查顺序<\/h3>\n<p>硬件先看 P：0 则送 <code>#PF<\/code>，错误码里记录是读还是写、是用户态还是内核态、页是否存在；P=1 再查 R/W 与 U/S：写只读页、用户态访问内核页同样送 <code>#PF<\/code>。A 位在访问时由硬件置位，D 位在写时置位，操作系统据此做页面回收与写回。<\/p>\n<h3>Canonical 检查<\/h3>\n<p>48 位有效地址的 bit 48–63 必须等于 bit 47 的符号扩展：bit 47=0 则高 16 位全 0，bit 47=1 则高 16 位全 1。不满足则处理器在地址翻译前就送异常，不查页表。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：32 位线性地址 0x0001200h（本书算例，PDF 第 236 页）<\/h3>\n<p><span class=\"katex-inline\">v = 0x0001200<\/span>。<\/p>\n<ul><li>\n偏移 <span class=\"katex-inline\">o = 0x1200 \\,\\&amp;\\, 0xFFF = 0x200<\/span>。\n<\/li><li>\nPT 索引 <span class=\"katex-inline\">i_{\\text{PT}} = (0x1200 \\gg 12) \\,\\&amp;\\, 0x3FF = 1<\/span>。\n<\/li><li>\nPDT 索引 <span class=\"katex-inline\">i_{\\text{PDT}} = (0x1200 \\gg 22) \\,\\&amp;\\, 0x3FF = 0<\/span>。\n<\/li><li>\nCR3 → PDT[0] → PT 物理基地址；PT[1] → 物理页 <code>0x4000<\/code>（本书该页位于 <code>4000h–4FFFH<\/code>）。\n<\/li><li>\n物理地址 = <code>0x4000 + 0x200 = 0x4200<\/code>。\n<\/ul>\n<h3>算例 2：64 位线性地址 0x0000_0000_0041_2340<\/h3>\n<p><span class=\"katex-inline\">v = 0x412340<\/span>，二进制低 24 位 <code>0100 0001 0010 0011 0100 0000<\/code>。<\/p>\n<ul><li>\n偏移 <span class=\"katex-inline\">o = 0x412340 \\,\\&amp;\\, 0xFFF = 0x340<\/span>。\n<\/li><li>\nPT 索引：<code>0x412340 &gt;&gt; 12 = 0x412<\/code>，<code>&amp; 0x1FF = 0x012<\/code>。\n<\/li><li>\nPD 索引：<code>0x412340 &gt;&gt; 21 = 2<\/code>（<span class=\"katex-inline\">2^{21}=2097152<\/span>，<code>0x412340 = 4269888<\/code>，商 2），<code>&amp; 0x1FF = 2<\/code>。\n<\/li><li>\nPDPT 索引：<code>v &gt;&gt; 30 = 0<\/code>；PML4 索引：<code>v &gt;&gt; 39 = 0<\/code>。\n<\/li><li>\n设表项（自拟布局）：PML4E[0] → PDPT <code>0xA0000<\/code>；PDPTE[0] → PD <code>0xB0000<\/code>；PDE[2] → PT <code>0xC0000<\/code>；PTE[0x12] → 物理页 <code>0x300000<\/code>。\n<\/li><li>\n物理地址 = <code>0x300000 + 0x340 = 0x300340<\/code>。\n<\/ul>\n<h3>算例 3：2MB 大页跳过下级表<\/h3>\n<p>若 PDE[2] 的大页标志位置位，PDE 直接给出 2MB 物理页基地址，不再访问 PT；偏移改用 21:0 位（2MB 页内偏移）。沿用算例 2，PDE[2] 指向大页 <code>0x2000000<\/code>，页内偏移 = <code>v &amp; 0x1FFFFF = 0x12340<\/code>，物理地址 = <code>0x2000000 + 0x12340 = 0x2012340<\/code>。少查一级 PT，TLB 可缓存大页映射，覆盖更大地址范围。<\/p>\n<h2>延伸推演：缺页时机、TLB 与进程页表隔离<\/h2>\n<p>查表每一步都可能命中 <code>#PF<\/code>：表项不存在、权限不符、Canonical 失败。缺页异常处理程序先判断地址是否合法：合法则从磁盘换入页面、补建页表项后返回复执行出错指令；非法则终止进程。本书 PCB 的 <code>thread_struct<\/code> 里 <code>cr2<\/code> 记录触发缺页的线性地址，正是异常入口交给处理程序定位问题地址的信息（原书 4.8.2 节，PDF 第 170 页）。<\/p>\n<p>TLB（Translation Lookaside Buffer）缓存最近用过的页表项：线性地址到物理地址的映射先查 TLB，命中则不再逐级走内存页表。换页表（进程切换）后旧 TLB 项对新进程无效，处理器通过刷新 TLB 机制使旧缓存失效；本书进程切换更换 CR3 后，旧映射不再可访问。<\/p>\n<p>进程隔离靠页表实现：每个进程有自己的 PML4/页表，CR3 指向自己的表；两个进程虚拟地址相同的页面，经各自页表落到不同物理页。内核页表项在所有进程页表中共享，保证陷入内核后内核内存始终可访问。<\/p>\n<h2>延伸推演：TLB、权限组合与地址隔离算术<\/h2>\n<h3>TLB 命中与刷新<\/h3>\n<p>页表项在内存里，每次查表都要多次访存；TLB 缓存最近使用的线性地址到物理页映射，命中时跳过查表。换页表（进程切换换 CR3）后旧 TLB 项对新进程无效，处理器刷新 TLB；改写页表项后也要刷新对应 TLB 项，否则缓存的旧映射继续生效。TLB 未命中走慢路径逐级查表，命中走快路径，这是分页性能的关键分层。<\/p>\n<h3>权限位组合案例<\/h3>\n<p>PTE 的 R/W 与 U/S 组合：内核页 U/S=0，用户态访问送 <code>#PF<\/code>；只读页 R/W=0，写访问送 <code>#PF<\/code>；代码页通常不可写。<code>#PF<\/code> 错误码记录访问类型：P 位区分页不存在还是权限违规，W/R 区分读/写，U/S 区分用户态/内核态。处理程序据此判断是换页恢复还是违规终止。<\/p>\n<h3>Canonical 非规范地址算例<\/h3>\n<p>48 位地址位 47 为 0 时，位 48–63 必须全 0；若地址 <code>0x0000_8000_0000_0000<\/code>（位 63=0 但位 47=1 高位未全 1），属于非规范地址，处理器在翻译前送异常，不查页表。反过来位 47=1 时高位必须全 1，出现 <code>0x0000_7FFF_FFFF_FFFF<\/code> 以外的高位零填充地址同样非法。<\/p>\n<h3>地址空间隔离算术<\/h3>\n<p>两个进程各自页表中虚拟地址 <code>0x400000<\/code> 可以映射到不同物理页：进程 A PTE 指向 <code>0x300000<\/code>，进程 B PTE 指向 <code>0x500000<\/code>。CR3 不同 → 查表起点不同 → 同一虚拟地址落到不同物理地址。内核页表项在各进程页表中共享映射，保证陷入内核后内核内存始终可达；用户页表项互不相同，实现进程隔离。<\/p>\n<h3>大页与碎片折中<\/h3>\n<p>4KB 页粒度细，页表项数量多；2MB、1GB 大页跳过下级表，减少 TLB 压力与页表占用，但大页内部未用空间形成内碎片。数据库、大型虚拟地址空间倾向大页；通用桌面与小对象场景用 4KB 页。本书引导阶段用 2MB 恒等映射覆盖前 2MB，正式内核算例以 4KB 页表为主。<\/p>\n<h3>对抗性追问：PG 已开但 CR3 指向未初始化表会怎样<\/h3>\n<p>取指或取数第一步按 CR3 查顶层表，表项 P=0，立即送 <code>#PF<\/code>；若 IDT 未就位，异常无法被服务。启动顺序里页表必须先于 PG 置位建好，这与 c01 的切换顺序链一致。<\/p>\n<h2>第二算例与补充推演<\/h2>\n<h3>页表项位域展开<\/h3>\n<p>长模式 8B 页表项：第 0 位 P（存在），第 1 位 R/W（0 只读 1 可写），第 2 位 U/S（0 内核 1 用户），第 3 位 PWT，第 4 位 PCD，第 5 位 A（访问），第 6 位 D（脏，仅 PTE），第 7 位 PS（页大小，中间级置 1 表示大页），第 8 位 G（全局页）；12:51 位为物理页基地址（4KB 页对齐，低 12 位为 0）；高位含执行禁止位。表项低 12 位是属性，高位是页帧号。<\/p>\n<h3>多级页表内存占用算例<\/h3>\n<p>4KB 页、四级表：一张 PML4 表 512 项 ×8B=4KB，每个 PDPT、PD、PT 各 4KB。一个进程若用 1MB 连续虚拟空间（256 个 4KB 页），需要 1 张 PT 覆盖 2MB，再加上级表项；页表只在用到的区间建立，未映射区间不占下级表。大页 2MB 直接由 PDE 映射，省掉 PT 一级表与对应 TLB 项。<\/p>\n<h3>物理页与线性地址对应<\/h3>\n<p>内核直接映射区把物理内存连续映射到一段内核线性地址：物理页帧号 <code>pfn<\/code> 经偏移换算得到内核线性地址，<code>struct Page<\/code> 记录该地址。用户页映射由进程页表维护，物理页可被多个进程映射到不同虚拟地址（共享内存），引用计数记录映射数。<\/p>\n<h3>写回与脏位<\/h3>\n<p>D 位在页被写时由硬件置 1；回收脏页前要先把内容写回块设备，干净页可直接丢弃。A 位记录页面被访问过，回收算法据此判断冷热。页表项本身的修改也要同步到 TLB，否则旧权限与旧映射继续生效。<\/p>\n<h3>补充推演：地址对齐与页内偏移<\/h3>\n<p>4KB 页内偏移 12 位，物理页基地址低 12 位为 0；任意线性地址的物理地址 = 页基地址 + 偏移，偏移不跨页。2MB 大页偏移 21 位，1GB 大页偏移 30 位。计算时先确认页大小，再取对应位数的偏移；用错粒度会把页内偏移算到上级索引里。<\/p>\n<h3>补充：页表项回收<\/h3>\n<p>进程退出时，页表项随地址空间释放：先释放用户页与下级表，再逐级回收 PD/PDPT/PML4 表页；内核页表项不在进程退出时回收。释放页表项后对应 TLB 项也要刷新，避免残留映射指向已释放物理页。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n32 位两级分页三段索引各多少位？（PDT 10、PT 10、偏移 12。）\n<\/li><li>\nIA-32e 四级表各索引多少位？（PML4E/PDPTE/PDE/PTE 各 9 位，偏移 12 位。）\n<\/li><li>\nCR3 存的是什么？进程切换时为什么要换？（顶层页表物理基地址；不换则新进程访问旧进程映射。）\n<\/li><li>\n表项 P=0 时处理器做什么？（停止查表，送 <code>#PF<\/code> 缺页异常。）\n<\/li><li>\nCanonical 地址要求高位满足什么条件？（bit 48–63 是 bit 47 的符号扩展。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "四级页表与虚拟地址拆解：从线性地址到物理地址"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：一个64位操作系统的设计与实现.pdf · p.114<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">段描述符与段选择子（GDT/LDT、CPL/DPL/RPL）<\/a><\/span><\/div><h1>中断门、陷阱门与 IDT（含中断栈切换与 IST）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书第 4 章 4.4、4.6，第 6 章 6.5.3 中断与异常处理机制）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>处理器收到外部中断或内部异常时，只知道一个向量号（0–255），不知道处理程序在哪。内核需要一张按向量号索引的表，把每个向量映射到处理程序入口，同时记录入口段、特权级与进入时是否屏蔽其他中断。这个概念回答 IDT 每项存哪些字段、中断门与陷阱门差在哪、特权级变化时栈怎么切、IST 解决什么问题。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>IDT（中断描述符表）<\/strong>：256 项的门描述符表，前 32 个向量号固定分配给异常，32 号起供外部中断与 <code>INT n<\/code> 使用；<code>IDTR<\/code> 保存表基地址与限长，由 <code>LIDT<\/code> 加载（原书 4.4 节，PDF 第 116 页）。<\/p>\n<p><strong>门描述符字段<\/strong>：<\/p>\n<ul><li>\n目标段选择子：指向 GDT/LDT 中的代码段描述符。\n<\/li><li>\n处理程序段内偏移：定位入口地址；IA-32e 下偏移分两段拼成 64 位。\n<\/li><li>\n<code>P<\/code>（存在位）：门未配置时 P=0，访问触发 <code>#GP<\/code>。\n<\/li><li>\n<code>DPL<\/code>：允许进入该门的特权级；<code>INT n<\/code> 软中断受 DPL 限制，硬件中断不受 DPL 检查。\n<\/li><li>\n<code>Type<\/code>：区分中断门、陷阱门、任务门等。\n<\/li><li>\n<code>IST<\/code>（IA-32e）：中断栈表索引，非 0 时处理器从 TSS 的 IST 栈切到独立栈。\n<\/ul>\n<p><strong>中断门 vs 陷阱门<\/strong>：穿过中断门进入处理程序时，处理器复位 <code>IF<\/code>（屏蔽其他可屏蔽外部中断），直到 <code>IRET<\/code> 还原 EFLAGS；穿过陷阱门不复位 <code>IF<\/code>，处理期间外部中断仍可打断（原书 6.5.3 节，PDF 第 245 页）。IA-32e 模式下 IDT 每项 16B（PDF 第 117 页）。<\/p>\n<p><strong>栈切换<\/strong>：特权级不变时，旧栈上压入 EFLAGS、CS、EIP（64 位为 RFLAGS、CS、RIP），部分异常再压错误码；特权级降低（从 3 级进 0 级）时，先从 TSS 取目标级栈选择子与栈指针，把旧 SS、旧 ESP 压入新栈，再压 EFLAGS、CS、EIP、错误码（原书 4.4.2 节，PDF 第 114–115 页）。<\/p>\n<h2>执行推导与推演<\/h2>\n<p>向量号 <code>n<\/code> 的进入过程：<\/p>\n<ol><li>\n处理器用 <code>n × 16<\/code>（IA-32e）定位 IDT 项；取 P、DPL、Type、目标选择子与偏移。\n<\/li><li>\n检查 P：P=0 送 <code>#GP<\/code>；软中断再检查 CPL/RPL 是否满足 DPL。\n<\/li><li>\n按选择子查 GDT/LDT 取代码段描述符，检查段存在与特权级。\n<\/li><li>\n若目标段优先级更高，从 TSS 取目标级栈，切栈并压入旧 SS、旧 RSP；否则留在当前栈。\n<\/li><li>\n压入 RFLAGS、CS、RIP；中断门再清 IF；跳转到选择子:偏移指向的处理程序。\n<\/ol>\n<p>返回由 <code>IRET<\/code>（64 位 <code>iretq<\/code>）逆序：弹 RIP、CS、RFLAGS；发生过栈切换再弹 RSP、SS。错误码若由处理器压入，处理程序必须先显式弹出错误码再 <code>IRET<\/code>。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：IDT 已用 <code>LIDT<\/code> 就位；门选择子指向合法代码段；处理程序入口在段限长内；中断栈/IST 栈已配置。\n<\/li><li>\n失败案例：向量号对应门 P=0 触发 <code>#GP<\/code>；处理程序漏弹错误码，<code>IRET<\/code> 弹错栈帧，返回地址错误；中断门挂在需要嵌套响应的设备上，不必要地拉长关中断时间；陷阱门用于需要连续操作硬件寄存器的序列，被高优先级中断中途插入。\n<\/li><li>\n边界：硬件中断进入时不检查 DPL，软件 <code>INT n<\/code> 才检查；IA-32e 下任务门基本不再使用，栈切换主要靠 TSS 栈指针与 IST。\n<\/li><li>\n本书 4.6 节中断入口在压栈保存通用寄存器后，按向量号分派处理函数（PDF 第 160–161 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>中断门 vs 陷阱门<\/strong>：唯一实质差别是进入时是否清 IF；中断门串行化同优先级中断，陷阱门允许嵌套。选哪个取决于处理程序是否需要连续占用设备。\n<\/li><li>\n<strong>中断 vs 异常<\/strong>：中断来自处理器外部（设备通知），异步，与当前指令无关；异常来自处理器执行指令时出错，同步，与具体指令关联。两者共用 IDT 与门机制，向量号区间不同。\n<\/li><li>\n<strong>IDT vs GDT<\/strong>：GDT 描述段（内存区域），IDT 描述入口（代码段:偏移 + 特权控制）；IDT 门的选择子仍要回 GDT 取代码段。\n<\/li><li>\n<strong>栈切换 vs IST<\/strong>：常规特权级切换按 CPL 从 TSS 的 <code>rsp0/rsp1/rsp2<\/code> 取栈；IST 是为调试、双错误等关键场景预留的独立栈表项，避免当前栈本身不可用时无处压栈。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c02 的选择子/描述符/特权级检查是门机制的基础。后继：概念 c05 展开异常分类与错误码；概念 c06 的现场保存发生在门压栈之后；概念 c07 时钟中断经 IDT 进入调度路径；概念 c12 系统调用门走同一套跨级切换。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（中断门、陷阱门与 IDT（含中断栈切换与 IST））<\/summary><div class=\"depth-body\"><h1>c04 深度推导：IDT 查表、门类型与两种栈帧布局<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要弄清一次中断/异常怎样进入处理程序，往回追四层前提：<\/p>\n<ol><li>\n模式与特权级模型先成立：处理器在保护模式以上运行，CPL/DPL/RPL 比较规则可用，门描述符才有检查对象。\n<\/li><li>\nIDT 已就位：<code>IDTR<\/code> 指向 256 项表，每项填好选择子、偏移、P、DPL、Type；未配置的向量必须 P=0，避免跳到随机地址。\n<\/li><li>\n目标代码段在 GDT/LDT 中存在：门只存选择子与偏移，段属性仍回段描述符取。\n<\/li><li>\n栈资源已准备：TSS/线程结构里有各级栈指针，IST 栈表项指向独立栈区域；进入内核时不能在不可用的栈上压栈。\n<\/ol>\n<p>依赖链方向：向量号 → IDT 项定位与检查 → 段描述符检查 → 栈选择与压帧 → 跳转入口。任一层失败送异常或停住；IDT 未就位时异常无人接管，是启动早期最危险的状态之一。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：向量号到 IDT 项<\/h3>\n<p>IA-32e 每项 16B，项地址 = <code>IDTR.base + n × 16<\/code>；保护模式每项 8B，<code>n × 8<\/code>。从项内读出：目标选择子（16 位）、偏移（长模式分 16+16+32 位拼成 64 位）、P 位、DPL、Type、IST 索引。<\/p>\n<h3>第二步：门类型与 IF 处理<\/h3>\n<p>Type 编码区分中断门、陷阱门、任务门。进入中断门时，硬件把 RFLAGS.IF 清 0，此后 <code>INTR<\/code> 可屏蔽中断被关，处理程序结束前不会被同级别外部中断打断；<code>STI<\/code> 可在处理程序内重新开中断。进入陷阱门时 IF 保持原值，处理期间允许中断嵌套。两种门压栈与返回流程相同，差别只在 IF。<\/p>\n<h3>第三步：特权级与栈选择<\/h3>\n<p>比较目标代码段 DPL 与 CPL：<\/p>\n<ul><li>\n同级：留在当前栈。压栈顺序（从高地址向低地址）：RFLAGS → CS → RIP；异常带错误码的再压 Error Code。\n<\/li><li>\n跨级（用户 3 级进内核 0 级）：先从 TSS/线程结构取目标级 <code>rsp0<\/code> 与内核段选择子，切到新栈；新栈上依次压入旧 SS、旧 RSP，再压 RFLAGS、CS、RIP、错误码。旧 SS/RSP 记录返回时恢复用户栈所需信息。\n<\/ul>\n<h3>第四步：跳转与返回<\/h3>\n<p>硬件把选择子载入 CS，偏移载入 RIP，开始执行处理程序。处理程序内部若还要保存通用寄存器，由入口宏（本书 <code>SAVE_ALL<\/code>）继续压栈。返回执行 <code>iretq<\/code>：逆序弹出 RIP、CS、RFLAGS；若帧里有旧 RSP/SS，继续弹出恢复旧栈。错误码是处理器压入的，软件必须先 <code>pop<\/code> 掉再返回，否则 <code>iretq<\/code> 会把错误码当成 RIP 弹入。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：定位时钟中断门<\/h3>\n<p>设时钟中断向量号 <code>n = 32<\/code>（硬件中断起始号），IA-32e 门宽 16B。IDT 基地址 <code>0x100000<\/code>：<\/p>\n<ul><li>\n项偏移 = <code>32 × 16 = 512 = 0x200<\/code>。\n<\/li><li>\n门描述符地址 = <code>0x100000 + 0x200 = 0x100200<\/code>。\n<\/li><li>\n从该项读出：选择子 <code>0x0008<\/code>（GDT 第 2 项内核代码段），偏移为时钟处理程序入口，Type=中断门，P=1，DPL=0，IST=0。\n<\/ul>\n<h3>算例 2：跨级栈帧字节布局<\/h3>\n<p>用户态 CPL=3，通过软中断 <code>INT 0x80<\/code>（向量 128）进入 DPL=0 内核门。设内核栈 <code>rsp0 = 0xFFFF_8000_0010_0000<\/code>。<\/p>\n<p>新栈压帧（低地址方向）：<\/p>\n<ol><li>\n旧 SS（用户栈段选择子，8B 对齐占位）。\n<\/li><li>\n旧 RSP（用户栈指针）。\n<\/li><li>\nRFLAGS。\n<\/li><li>\nCS（内核代码段选择子）。\n<\/li><li>\nRIP（返回用户态地址）。\n<\/li><li>\n错误码（该向量无错误码则不压）。\n<\/ol>\n<p>64 位下每个压入寄存器 8B；跨级帧共 5 个 8B 槽（SS、RSP、RFLAGS、CS、RIP），加可能的错误码。返回时 <code>iretq<\/code> 先弹 RIP/CS/RFLAGS，再按帧中旧 RSP、SS 恢复用户栈。<\/p>\n<h3>算例 3：IF 位状态追踪<\/h3>\n<p>进入前用户态 RFLAGS.IF=1。走中断门：进入后 IF=0，处理程序内时钟中断被屏蔽；处理程序末尾 <code>iretq<\/code> 还原 RFLAGS，IF 回到 1。走陷阱门：进入后 IF 仍为 1，处理程序执行到一半可被更高优先级中断打断，嵌套进入另一门压另一套栈帧。<\/p>\n<h2>延伸推演：IST 与双错误栈<\/h2>\n<p>常规跨级切换依赖 TSS 里的 <code>rsp0<\/code>。若故障发生在当前栈指针已经损坏、或栈即将耗尽的场景（例如栈溢出后又触发错误），<code>rsp0<\/code> 指向的栈本身不可靠，再压帧会踩进无效内存。IST 给 IDT 门配 1–7 个独立栈索引：门触发时直接切到 IST 栈，把关键异常（如双错误 <code>#DF<\/code>）放在专用栈上处理。本书 6.5.3 节在 IA-32e 中断机制中列出 IST 字段（PDF 第 245 页）；本书早期引导阶段栈结构简单，未启用多 IST，正式内核可按关键异常场景补充。<\/p>\n<p>DPL 检查分两类：硬件外部中断进入时不检查门 DPL，设备请求优先；软件 <code>INT n<\/code> 进入时检查 CPL/RPL 是否满足 DPL，防止用户态随意调用内核门。这解释了为什么系统调用可以用专用指令（本书 <code>sysenter<\/code>/<code>sysexit<\/code>）而不是把所有内核门 DPL 放开给用户态。<\/p>\n<h2>延伸推演：门宽、嵌套与软硬件中断差异<\/h2>\n<h3>8B 与 16B 门描述符<\/h3>\n<p>保护模式 IDT 项 8B：选择子 2B、偏移高低各 2B、访问字节 1B、保留/标志 1B；IA-32e 模式下每项 16B，偏移扩展为 64 位分四段存放。向量号定位项的偏移乘门宽：保护模式 <code>n×8<\/code>，长模式 <code>n×16<\/code>。门宽判断错一位，后续所有向量的入口地址全部错位。<\/p>\n<h3>中断嵌套与栈帧<\/h3>\n<p>陷阱门不清 IF，高优先级中断可以打断当前处理程序，在另一套栈上压新帧；多层嵌套形成栈帧链。中断门清 IF，同级中断被屏蔽，需要嵌套时处理程序主动 <code>STI<\/code>。嵌套深度受内核栈大小限制，栈耗尽触发 <code>#SS<\/code> 或 <code>#DF<\/code>。本书早期引导阶段中断处理较简单，未展开多中断嵌套模型。<\/p>\n<h3>硬件中断与软件中断的 DPL 差异<\/h3>\n<p>外部设备中断送中断请求，处理器进入门时不检查 DPL；软件 <code>INT n<\/code> 指令进入门时检查 CPL/RPL 是否满足门 DPL。用户态不能把 DPL=0 的内核门开放给自己调用，否则等于给用户态留了随意进入内核的通道。系统调用因此用专用陷入指令或 DPL=3 的专用门，而不是复用内核中断门。<\/p>\n<h3>IST 索引与 TSS 栈表<\/h3>\n<p>IST 字段 3 位，索引 1–7 对应 TSS 中 7 个独立栈表项；0 表示不用 IST，按常规 CPL 栈切换。关键异常（<code>#DF<\/code>、调试断点）配独立栈，即使当前内核栈损坏也有栈可用。本书线程结构 <code>rsp0<\/code> 对应常规 0 级栈；正式内核可把 <code>#DF<\/code> 等异常门绑到 IST 栈。<\/p>\n<h3>任务门的历史位置<\/h3>\n<p>任务门描述符指向 TSS，硬件可在进入门时自动切换任务现场。现代操作系统用软件上下文切换（c06），任务门基本弃用；IDT 类型位仍保留该编码，读门描述符时要能区分中断门、陷阱门、任务门。<\/p>\n<h3>对抗性追问：中断门处理程序需要嵌套响应怎么办<\/h3>\n<p>若挂中断门的设备处理序列必须连续操作寄存器，清 IF 是保护；但若该设备仍需响应更高优先级中断，应改用陷阱门并在关键操作段临时关中断，操作完成后再开。门类型选错的故障表现是：要么关键序列被打断出现寄存器交错，要么低优先级中断长时间延迟。<\/p>\n<h2>第二算例与补充推演<\/h2>\n<h3>门描述符字节布局（IA-32e 16B）<\/h3>\n<p>偏移 0–1：偏移低 16 位；2–3：目标段选择子；4：IST 索引（3 位）与保留位；5：访问字节（P、DPL、S、Type）；6–7：偏移中 16 位；8–11：偏移高 32 位；12–15：保留。定位门时先按向量号乘 16 找项起始，再按字段偏移读选择子与偏移。保护模式 8B 门没有高 32 位偏移段。<\/p>\n<h3>向量号分配边界<\/h3>\n<p>0–31 固定异常；32 起可屏蔽硬件中断由 PIC/APIC 重映射到向量号区间；<code>INT n<\/code> 软中断用自定义号。IDT 256 项全表初始化时，未使用向量默认指向默认处理程序，避免空门 P=0 触发二次 <code>#GP<\/code> 把原始异常盖住。<\/p>\n<h3>中断使能与 IF 的生命周期<\/h3>\n<p><code>CLI<\/code> 清 IF 关可屏蔽中断，<code>STI<\/code> 置 IF 开中断。进入中断门硬件自动清 IF；处理程序需要嵌套时主动 <code>STI<\/code>，返回 <code>iretq<\/code> 还原进入前的 IF。异常（除 NMI 等）不受 IF 屏蔽；IF=0 时外部 IRQ 保持挂起，开中断后才被响应。本书 <code>sysenter<\/code> 路径也会清 IF，返回时需恢复（c12）。<\/p>\n<h3>门类型选择决策<\/h3>\n<p>需要连续操作设备寄存器、防止同优先级打断 → 中断门；处理程序本身要允许嵌套或只是报告事件 → 陷阱门。调试断点常用陷阱门，保证断点返回后 IF 状态不变。选错方向的两类故障：中断门用于可嵌套服务导致响应延迟；陷阱门用于序列操作导致寄存器交错。<\/p>\n<h3>补充推演：栈切换时的段选择子<\/h3>\n<p>跨级进入内核，新栈段选择子来自 TSS 的 <code>ss0<\/code>（0 级栈段），栈指针来自 <code>rsp0<\/code>；旧 SS/RSP 压入新栈。TSS/线程结构里的栈指针必须在进程创建时初始化好，否则首次陷入内核时栈地址无效。返回 <code>iretq<\/code> 检测到帧内有旧 SS/RSP，才执行栈恢复。<\/p>\n<h3>补充：NMI 与异常门的特殊性<\/h3>\n<p>不可屏蔽中断（NMI，向量 2）不受 IF 控制，无论中断是否开启都能进入；调试异常、硬件故障类事件同样需要独立栈保障。NMI 处理程序要尽量短，避免再次嵌套 NMI 造成栈叠加。门描述符的 DPL 对硬件事件不做检查，只约束软件 <code>INT n<\/code>；这意味着设备中断的入口安全依赖内核在配置 IDT 时只填合法处理程序地址，而不是靠 DPL 拦截硬件。<\/p>\n<h3>补充：IDT 初始化时机<\/h3>\n<p>引导阶段先 <code>LIDT<\/code> 加载 IDTR，门描述符逐项填好选择子与偏移；早期可先填默认处理程序，设备驱动初始化时再替换具体向量。IDT 必须早于 <code>STI<\/code> 就位：开中断后第一个外部中断到来时，表项必须合法。长模式切换后 IDT 项宽度变为 16B，保护模式的 8B 门表要重建或转换。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nIDT 前 32 个向量号分配给谁？（异常；32 号起供外部中断与软中断。）\n<\/li><li>\n中断门和陷阱门唯一实质差别是什么？（进入时是否清 IF。）\n<\/li><li>\n跨级进入内核时旧 SS、旧 RSP 压在哪一侧？（压在新栈上，先于 RFLAGS/CS/RIP。）\n<\/li><li>\n处理程序为什么必须先弹错误码再 <code>iretq<\/code>？（不弹则错误码被当成 RIP 弹入，返回地址错乱。）\n<\/li><li>\nIST 解决什么场景？（当前栈不可靠时为关键异常提供独立栈。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "中断门、陷阱门与 IDT（含中断栈切换与 IST）"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：一个64位操作系统的设计与实现.pdf · p.113<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">中断门、陷阱门与 IDT（含中断栈切换与 IST）<\/a><\/span><\/div><h1>异常分类、向量号与错误码（fault / trap / abort）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章（原书第 4 章 4.4 系统异常）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>程序执行一条指令时可能除零、遇到无效操作码、访问不存在的段或缺页。处理器必须把这些内部事件分类编号，让内核知道出了什么事、返回地址该指向出错指令还是下一条指令、还要不要附带错误码。这个概念回答异常分哪三类、各类返回地址指向哪里、哪些异常压错误码、错误码位域怎么读。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>异常来源<\/strong>：由处理器执行指令内部产生，与外部设备异步中断相对；异常经 IDT 对应门进入处理程序，向量号区间固定（原书 4.4.1 节，PDF 第 113 页）。<\/p>\n<p><strong>三类异常<\/strong>：<\/p>\n<ul><li>\n<strong>错误（fault）<\/strong>：可修正的异常。处理程序修正条件后返回复执行同一条指令；栈上返回地址指向出错指令本身。例：缺页 <code>#PF<\/code>、段不存在 <code>#NP<\/code>、栈段错误 <code>#SS<\/code>、通用保护 <code>#GP<\/code>。\n<\/li><li>\n<strong>陷阱（trap）<\/strong>：报告事件后继续往下执行；返回地址指向触发指令的下一条指令。例：断点 <code>#BP<\/code>、溢出 <code>#OF<\/code>。\n<\/li><li>\n<strong>终止（abort）<\/strong>：严重不可恢复错误，现场不可靠，不支持返回到原程序；例：双重错误 <code>#DF<\/code>、硬件故障类异常。\n<\/ul>\n<p><strong>向量号与典型事件<\/strong>（本书 4.4.1 节列出，PDF 第 113 页）：0 除零错误；1
