 调试；3 断点；6 无效操作码；7 协处理器不可用；8 双重错误；10 无效 TSS；11 段不存在；12 栈段错误；13 通用保护错误；14 缺页；16 协处理器错误；17 对齐检查。<\/p>\n<p><strong>错误码<\/strong>：部分异常在压帧时额外压入一个错误码，按位域说明出错原因。位域包括：EXT（是否外部事件触发）、IDT（错误是否与 IDT 门相关）、TI（0 指 GDT、1 指 LDT）、Index（相关段选择子索引）。缺页异常的错误码另记录 P（页是否存在）、W/R（写还是读）、U/S（用户态还是内核态）等信息；<code>CR2<\/code> 保存触发缺页的线性地址（原书 4.4.2 节，PDF 第 114–115 页）。<\/p>\n<h2>执行推导与推演<\/h2>\n<p>以访问不存在的数据段为例：处理器执行一条引用该段寄存器的指令，段描述符 P=0，分类为 fault。进入 IDT 11 号门：压入 RFLAGS、CS、RIP，再压错误码。错误码 TI=1 指示 LDT，Index 给出段选择子索引。处理程序读错误码定位段；若条件可恢复（如段应已加载），修复后 <code>iretq<\/code> 返回 RIP 指向的那条指令重新执行。<\/p>\n<p>以除零为例：向量 0，属 fault 但通常不可恢复；处理程序多直接终止进程。无效操作码向量 6，fault；断点向量 3，trap，返回地址指向下一条指令，调试器据此在断点后继续。<\/p>\n<p>错误码读法：错误码低 14 位拼出选择子索引，第 2 位 TI 判 GDT/LDT，第 1 位 IDT 判是否门描述符，第 0 位 EXT 判外部触发。缺页错误码与 <code>CR2<\/code> 配合：错误码给访问类型与权限信息，<code>CR2<\/code> 给出问题线性地址。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：异常向量在 IDT 中有对应门；处理程序知道本向量是否压错误码，压了就先弹错误码再返回。\n<\/li><li>\n失败案例：处理程序把 fault 的 RIP 当成&quot;下一条指令&quot;直接返回，导致同一条出错指令反复触发；漏弹错误码使栈帧错位，<code>iretq<\/code> 返回错误地址；把 abort 当 fault 处理，试图恢复不可靠现场。\n<\/li><li>\n边界：错误码不是每个异常都有；向量 0、1、3、4、5、6、7、16、17 等不带错误码，10、11、12、13、14 等带错误码。缺页地址在 <code>CR2<\/code> 而不在错误码里。\n<\/li><li>\n本书 4.4 节先在保护模式阶段建立异常处理框架，长模式阶段沿用同一套向量与门机制（PDF 第 112–117 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>fault vs trap<\/strong>：差别在返回地址指向出错指令还是下一条指令，以及是否要求修正后重跑本条指令。\n<\/li><li>\n<strong>中断 vs 异常<\/strong>：中断异步、来自外部；异常同步、由当前指令触发。两者都走 IDT，但异常向量号固定、错误码与现场信息更丰富。\n<\/li><li>\n<strong>错误码 vs CR2<\/strong>：错误码说明&quot;哪种违规、关联哪个选择子&quot;；<code>CR2<\/code> 只在缺页时给出&quot;问题线性地址&quot;。\n<\/li><li>\n<strong>#GP vs #PF<\/strong>：<code>#GP<\/code> 是段/特权级/描述符一致性问题；<code>#PF<\/code> 是页表映射或页权限问题。同一越界访问可能先在段检查失败送 <code>#GP<\/code>，段合法后才到页检查送 <code>#PF<\/code>。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c04 的门压帧与返回流程是错误码压栈位置的基础。后继：概念 c06 的现场保存承接异常入口栈帧；概念 c07 调度器在异常返回路径上检查抢占；缺页异常是概念 c10 页框分配从磁盘换页、补建页表的触发入口。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（异常分类、向量号与错误码（fault / trap / abort））<\/summary><div class=\"depth-body\"><h1>c05 深度推导：异常分类判定、错误码位域解码与返回路径<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要读懂一个异常该怎么处理，往回追四层前提：<\/p>\n<ol><li>\n事件来源先分清：指令执行触发的是异常，设备通知触发的是中断；异常同步关联指令，中断异步关联外部时刻。\n<\/li><li>\n向量号先固定：处理器按向量号查 IDT，前 32 号分配给异常；向量号决定进哪一扇门、跑哪个处理程序。\n<\/li><li>\n分类决定返回语义：fault 重跑本条指令，trap 从下一条继续，abort 不返回；返回地址存栈上 RIP 的含义随分类不同。\n<\/li><li>\n现场信息先就位：错误码、<code>CR2<\/code>、通用寄存器栈帧给出定位线索；处理程序先读懂这些再决定恢复还是终止。\n<\/ol>\n<p>依赖链方向：指令出错 → 处理器归类与编号 → 压帧（含可能的错误码）→ IDT 门进入 → 处理程序按分类与错误码决策。分类判错会直接导致返回路径错误：fault 当成 trap 会跳过未完成的操作，trap 当成 fault 会重复执行已完成的动作。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：处理器判定异常类型<\/h3>\n<p>执行指令过程中，硬件按检查顺序判定：操作数合法性（除零、对齐）→ 指令合法性（无效操作码）→ 段检查（存在位、特权级、限长）→ 页检查（P、R/W、U/S）。检查失败的位置决定异常类别：可通过后续动作弥补的归 fault；仅报告事件的归 trap；现场已损坏无法恢复的归 abort。<\/p>\n<h3>第二步：压帧与错误码<\/h3>\n<p>处理器按 c04 的栈帧规则压入 RFLAGS、CS、RIP。带错误码的向量再压一个错误码；不带错误码的向量栈上没有这个槽。fault 的 RIP 指向当前指令，trap 的 RIP 指向当前指令下一条。处理程序入口必须知道本向量是否带错误码：带错误码的处理函数先 <code>pop<\/code> 错误码再保存寄存器，否则通用寄存器压栈会把错误码当成寄存器值读走。<\/p>\n<h3>第三步：错误码位域解码<\/h3>\n<p>通用段类错误码：<\/p>\n<ul><li>\n第 0 位 EXT：1 表示外部事件（如调试请求）触发；\n<\/li><li>\n第 1 位 IDT：1 表示错误与 IDT 门描述符相关；\n<\/li><li>\n第 2 位 TI：0 指 GDT，1 指 LDT；\n<\/li><li>\n13:3 位 Index：相关段选择子索引。\n<\/ul>\n<p>缺页错误码：第 0 位 P（0=页不存在，1=权限违规）；第 1 位 W/R（0=读，1=写）；第 2 位 U/S（0=内核态，1=用户态）；其后位记录保留位违规、指令取指违规等。问题线性地址由 <code>CR2<\/code> 给出，不在错误码内。<\/p>\n<h3>第四步：处理决策<\/h3>\n<p>fault：处理程序判断地址/段是否合法——合法则补资源（换页、加载段）后返回重跑；非法则终止进程。trap：读取事件信息后继续，RIP 指向下一条。abort：记录严重错误，不尝试恢复原执行流。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：解码段不存在错误码<\/h3>\n<p>错误码 <code>0x0003<\/code>，二进制 <code>0000 0000 0000 0011<\/code>。<\/p>\n<ul><li>\nEXT=1：外部事件触发。\n<\/li><li>\nIDT=1：与 IDT 门相关。\n<\/li><li>\nTI=0：查 GDT。\n<\/li><li>\nIndex = <code>0x0003 &gt;&gt; 3 = 0<\/code>。\n<\/ul>\n<p>即：外部触发、指向 IDT 第 0 项关联的段选择子。若错误码 <code>0x0006<\/code>：TI=1（LDT），Index=<code>0x0006&gt;&gt;3=0<\/code>，IDT=0，EXT=0。<\/p>\n<h3>算例 2：解码缺页错误码<\/h3>\n<p>错误码 <code>0x0002<\/code>：P=0（页不存在），W/R=1（写操作），U/S=0（内核态）。<code>CR2 = 0xFFFF_8000_1234_5678<\/code> 给出被访问线性地址。组合判断：内核态写一个不存在的页——可能是内核栈扩展或缺页未建表。 错误码 <code>0x0005<\/code>：P=1（页存在），W/R=0（读），U/S=1（用户态）：用户态读内核页，权限违规。 错误码 <code>0x0007<\/code>：P=1，写，用户态：用户态写只读页（如代码段或共享只读页）。<\/p>\n<h3>算例 3：向量号查表定位<\/h3>\n<p>访问不存在段：向量 11（<code>0x0B<\/code>），IDT 项偏移 = <code>11 × 16 = 176 = 0xB0<\/code>（IA-32e）。栈帧含错误码。缺页：向量 14（<code>0x0E<\/code>），项偏移 <code>14×16=224=0xE0<\/code>，栈帧含错误码，地址在 <code>CR2<\/code>。除零：向量 0，无错误码；断点：向量 3，无错误码，trap。<\/p>\n<h2>延伸推演：双重错误与异常级联<\/h2>\n<p>双重错误 <code>#DF<\/code>（向量 8）发生在处理器在处理前一个异常时又检出另一个异常的场景：例如缺页异常的栈本身又不可用，段检查同时失败。它归类 abort：现场已经混乱，继续返回原指令没有意义，处理程序只能记录并终止。<code>#DF<\/code> 之后若再出错，处理器无法再压帧，进入关机/复位状态；这也是 IST 为 <code>#DF<\/code> 预留独立栈的原因（见 c04 延伸推演）。<\/p>\n<p>向量区间有保留项：9、15 等在本书异常表中标为保留，软件不应主动使用；未来处理器可能赋予新含义。操作系统注册异常处理时，对未使用向量可统一指向默认终止处理程序，避免空门 P=0 再触发 <code>#GP<\/code> 把原始异常盖住。<\/p>\n<h2>延伸推演：向量全表、错误码组合与异常恢复条件<\/h2>\n<h3>常见异常向量与归类<\/h3>\n<p>向量 0 <code>#DE<\/code> 除零，fault；1 <code>#DB<\/code> 调试，trap/fault 视条件；3 <code>#BP<\/code> 断点，trap；4 <code>#OF<\/code> 溢出，trap；5 <code>#BR<\/code> 边界越界，fault；6 <code>#UD<\/code> 无效操作码，fault；7 <code>#NM<\/code> 协处理器不可用，fault；8 <code>#DF<\/code> 双重错误，abort；10 <code>#TS<\/code> 无效 TSS，fault；11 <code>#NP<\/code> 段不存在，fault；12 <code>#SS<\/code> 栈段错误，fault；13 <code>#GP<\/code> 通用保护，fault；14 <code>#PF<\/code> 缺页，fault；16 <code>#MF<\/code> 协处理器错误，fault；17 <code>#AC<\/code> 对齐检查，fault。向量 9、15 保留，软件不应主动使用。<\/p>\n<h3>段类错误码位域全解<\/h3>\n<p>错误码低 14 位：13:3 位是选择子 Index，第 2 位 TI（0=GDT，1=LDT），第 1 位 IDT（1=引用 IDT 门），第 0 位 EXT（1=外部事件）。错误码本身也是一个选择子格式值，处理程序可按 Index/TI 回表读出引发异常的描述符。异常不带错误码时，栈上没有该槽，处理函数不能按有错误码的方式弹栈。<\/p>\n<h3><code>#PF<\/code> 错误码组合表<\/h3>\n<p>P=0：页不在内存，需要换页或确认地址合法；P=1：页存在，违规来自权限。W/R=1 写访问，0 读访问。U/S=1 用户态，0 内核态。组合举例：P=0、W=1、U=0 内核态写不存在页；P=1、W=0、U=1 用户态读内核页；P=1、W=1、U=1 用户态写只读页。<code>CR2<\/code> 给出问题线性地址，错误码给访问类型，两者配合定位。<\/p>\n<h3>fault 恢复的现场要求<\/h3>\n<p>fault 返回重跑同一条指令，处理程序必须把导致失败的条件修好：缺页则补建页表项并换入页面，段不存在则加载段，权限问题不可恢复则终止进程。若处理程序只返回而条件未变，<code>iretq<\/code> 回到同一条指令会再次触发同一异常，形成异常循环。<\/p>\n<h3>异常级联与不可恢复路径<\/h3>\n<p>处理前一异常时又检出异常：栈不可用、段表同时损坏等情况升级为 <code>#DF<\/code>；<code>#DF<\/code> 再失败无法压帧，处理器进入关机复位。这也是关键异常配 IST 独立栈的原因（c04）。abort 类异常的 PCB 现场不可靠，内核只能记录错误并终止相关任务，不能假设返回原指令流。<\/p>\n<h3>对抗性追问：断点为什么归 trap<\/h3>\n<p>断点指令执行后程序逻辑已经跳转到调试入口，返回时应继续断点后的下一条指令；若按 fault 重跑断点指令，会反复触发断点陷入死循环。分类不是按&quot;严重程度&quot;而是按返回语义：需要重跑本条的归 fault，报告事件后继续的归 trap。<\/p>\n<h2>第二算例与补充推演<\/h2>\n<h3>异常处理程序模板流程<\/h3>\n<p>入口先按向量是否带错误码决定是否弹错误码；再保存通用寄存器；从栈帧/<code>cr2<\/code>/错误码读出问题地址与类型；判断地址合法性：合法则补资源（换页、加载段），非法则标记进程终止；处理结束恢复寄存器，<code>iretq<\/code> 返回。fault 返回前必须确认失败条件已消除，否则重跑同一条指令再次异常。<\/p>\n<h3>错误码弹出顺序<\/h3>\n<p>带错误码的向量进入时，错误码压在 RIP 之上（栈顶方向最后压入）。处理函数若先压通用寄存器，错误码仍在硬件帧顶部；弹栈恢复前必须先显式 <code>pop<\/code> 错误码，再按 <code>iretq<\/code> 流程弹 RIP/CS/RFLAGS。漏弹的直接后果：<code>iretq<\/code> 把错误码数值当成 RIP 弹入，跳到随机地址。<\/p>\n<h3>各向量现场需求对照<\/h3>\n<p>除零、无效操作码：无错误码，RIP 指向出错指令；段不存在、栈段、<code>#GP<\/code>：带错误码，错误码指回相关选择子；缺页：带错误码 + <code>CR2<\/code> 问题地址；断点：无错误码，RIP 指向下一条。处理程序模板要按向量号区分这几种现场布局，不能套用同一套弹栈顺序。<\/p>\n<h3>用户态异常的终止路径<\/h3>\n<p>用户态程序触发不可恢复异常（非法指令、越权访问、段错误）：内核处理程序判定地址非法，不修复现场，把进程标记为僵死/终止，回收其 PCB 与资源；不会 <code>iretq<\/code> 回用户态重跑出错指令。可恢复异常（缺页）才返回原指令重跑。<\/p>\n<h3>补充推演：异常与中断共用 IDT 的边界<\/h3>\n<p>异常向量在 IDT 中同样配中断门或陷阱门；区别在来源与返回语义，不在入口硬件路径。异常处理中若再触发异常，按级联规则升级为 <code>#DF<\/code>；中断处理中触发异常，异常嵌套在中断栈帧之上。两类现场信息（错误码、<code>cr2<\/code>）在 <code>thread_struct<\/code> 中留存，供进程终止时报告原因。<\/p>\n<h3>补充：保留向量与软件自陷<\/h3>\n<p>向量 9、15 在本书异常表中标为保留，处理器不主动使用；未来指令集扩展可能赋予新含义，软件不应占用。<code>INT 0x80<\/code> 这类软中断用自定义向量号走 IDT 门，归类上是主动自陷而非硬件异常；其返回语义按门类型与处理程序约定决定，不套用 fault/trap 的指令重跑规则。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nfault 的 RIP 指向哪里？trap 呢？（fault 指向出错指令，trap 指向下一条指令。）\n<\/li><li>\n哪些异常需要读 <code>CR2<\/code>？（缺页 <code>#PF<\/code>，<code>CR2<\/code> 存问题线性地址。）\n<\/li><li>\n错误码里 TI 位为 1 指哪张表？（LDT。）\n<\/li><li>\n缺页错误码 P=1 表示什么？（页存在，违规来自权限而非不存在。）\n<\/li><li>\n为什么 abort 不支持返回复执行？（现场已损坏，返回路径不可靠。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "异常分类、向量号与错误码（fault / trap / abort）"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：一个64位操作系统的设计与实现.pdf · p.169<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">中断门、陷阱门与 IDT（含中断栈切换与 IST）<\/a><\/span><\/div><h1>任务/进程上下文切换保存了什么（现场清单与栈布局）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2 章（原书第 4 章 4.6.2 中断入口、4.8.2 PCB 结构，第 12 章进程切换）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>一个进程在处理器上跑着，时钟中断、系统调用或调度决策让它停下来，把处理器交给另一个进程。回来时原进程必须从被打断的那条指令、那组寄存器值继续跑，否则函数局部变量、返回地址、指针全部错乱。上下文切换要回答：哪些寄存器必须保存、保存在哪里、新进程现场从哪里恢复、栈指针与页表什么时候换。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>现场分两层<\/strong>：中断/异常入口由硬件压入 RFLAGS、CS、RIP（跨级再加 SS、RSP）；软件入口宏再保存通用寄存器与段寄存器。本书 <code>SAVE_ALL<\/code> 宏依次压入 <code>rax<\/code>、<code>es<\/code>、<code>ds<\/code>、<code>rbp<\/code>、<code>rdi<\/code>、<code>rsi<\/code>、<code>rdx<\/code>、<code>rcx<\/code>、<code>rbx<\/code>、<code>r8<\/code>、<code>r9<\/code>、<code>r10<\/code>、<code>r11<\/code>、<code>r12<\/code>、<code>r13<\/code>、<code>r14<\/code>、<code>r15<\/code>，随后把内核数据段选择子载入 <code>ds<\/code>、<code>es<\/code>（原书 4.6.2 节，PDF 第 160–161 页）。<\/p>\n<p><strong>PCB 线程结构体 <code>thread_struct<\/code> 保存的现场<\/strong>（原书 4.8.2 节，PDF 第 170 页）：<\/p>\n<ul><li>\n<code>rsp0<\/code>：内核态栈基地址；\n<\/li><li>\n<code>rip<\/code>：切换回来继续执行的指令地址；\n<\/li><li>\n<code>rsp<\/code>：切换时的栈指针；\n<\/li><li>\n<code>fs<\/code>、<code>gs<\/code>：段寄存器；\n<\/li><li>\n<code>cr2<\/code>：缺页线性地址；\n<\/li><li>\n<code>trap_nr<\/code>：异常/中断向量号；\n<\/li><li>\n<code>error_code<\/code>：异常错误码。\n<\/ul>\n<p><strong>内存空间结构体 <code>mm_struct<\/code><\/strong>：记录页表基地址、代码段/数据段/动态内存区/用户栈基地址等；切换进程时页表基地址随 PCB 换入 <code>CR3<\/code>（PDF 第 169 页）。<\/p>\n<p><strong>切换发生位置<\/strong>：调度器选中下一个进程后，在进程切换函数里把当前现场落进本进程线程结构，再从下一个进程线程结构恢复寄存器与栈指针。中断返回、系统调用返回是检查并触发调度的常见位置（原书 12.3.4 节，PDF 第 497–498 页）。<\/p>\n<h2>执行推导与推演<\/h2>\n<p>第一步，中断/异常进入。硬件压帧：RFLAGS、CS、RIP（跨级含 SS、RSP）；入口宏 <code>SAVE_ALL<\/code> 把通用寄存器压到当前内核栈，栈顶由 <code>rsp<\/code> 记录。<\/p>\n<p>第二步，现场落盘。若调度决策切换进程，当前内核栈指针保存到本进程 <code>thread_struct.rsp<\/code>；被打断的指令地址保存到 <code>rip<\/code>；<code>fs<\/code>/<code>gs<\/code>、<code>cr2<\/code>、<code>trap_nr<\/code>、<code>error_code<\/code> 一并记录。<\/p>\n<p>第三步，切到新进程。取下一个进程 <code>thread_struct<\/code>：把它的 <code>rsp<\/code> 装入栈指针，栈上已存它上次被打断时压入的通用寄存器；按 <code>SAVE_ALL<\/code> 逆序弹出寄存器；跳到它的 <code>rip<\/code> 继续执行。<code>mm_struct<\/code> 里的页表基地址换入 <code>CR3<\/code>，<code>fs<\/code>/<code>gs<\/code> 从线程结构恢复。<\/p>\n<p>第四步，返回用户态。若进程此前在用户态，栈帧里旧 SS/RSP、RFLAGS、CS、RIP 完整保留，<code>iretq<\/code> 恢复用户栈与用户指令流。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：每个进程有独立 <code>thread_struct<\/code>；内核栈随进程分配；切换时关抢占或持自旋锁，避免现场保存途中被再次调度打断。\n<\/li><li>\n失败案例：漏存被调用者保存寄存器，新进程恢复后局部变量错乱；<code>CR3<\/code> 未换，新进程访问到旧进程页表；栈指针落盘前被抢占，两套现场写到同一栈；错误码/<code>cr2<\/code> 未记录，缺页处理程序拿不到问题地址。\n<\/li><li>\n边界：浮点/向量寄存器（XMM 等）不在本书基础现场清单内，若使用浮点单元需额外保存；本书线程概念依附进程，同一进程多线程共享 <code>mm_struct<\/code>，各自独立 <code>thread_struct<\/code>（原书 12.5.3 节，PDF 第 525 页）。\n<\/li><li>\n本书早期版本 PCB 与线程结构合并在任务结构体内，字段对应关系可对照 4.8.2 节图 4-15（PDF 第 170 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>中断现场 vs 进程上下文<\/strong>：中断现场是某次打断在栈上的硬件帧+寄存器压栈；进程上下文是 PCB 线程结构里跨调度周期保留的现场。中断返回不切换进程时，现场从栈上直接恢复；切换进程时才落盘到线程结构。\n<\/li><li>\n<strong>进程 vs 线程<\/strong>：进程是资源分配单位，持有 <code>mm_struct<\/code>、文件、信号等；线程是执行调度单位，持有独立 <code>thread_struct<\/code>。同进程线程共享内存空间，切换时 <code>CR3<\/code> 不变。\n<\/li><li>\n<strong>保存寄存器 vs 恢复寄存器<\/strong>：压栈清单与弹栈清单必须严格逆序；调用约定中被调用者保存的寄存器若被内核函数踩过，必须在切换路径上完整保存。\n<\/li><li>\n<strong><code>rsp0<\/code> vs <code>rsp<\/code><\/strong>：<code>rsp0<\/code> 是内核态栈基地址，供从用户态跨级进入时取栈；<code>rsp<\/code> 是进程被切换时的栈指针，供切换回来恢复栈。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c04 的压帧规则与概念 c05 的错误码决定入口栈内容。后继：概念 c07 调度器依据 PCB 状态选择被切换进程；概念 c08 展开 PCB 资源组织；概念 c12 系统调用返回路径复用同一现场恢复流程。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（任务/进程上下文切换保存了什么（现场清单与栈布局））<\/summary><div class=\"depth-body\"><h1>c06 深度推导：现场两层保存、栈帧布局与两进程切换追踪<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清切换时该存什么，往回追五层前提：<\/p>\n<ol><li>\n处理器执行状态由哪些部分构成：通用寄存器、段寄存器、指令地址、栈指针、标志寄存器、页表基地址，缺一项进程回来就缺一段现场。\n<\/li><li>\n中断/异常进入时硬件已经压了哪些帧：RFLAGS、CS、RIP，跨级再加 SS、RSP；软件压栈不能覆盖这层。\n<\/li><li>\n调用约定区分寄存器职责：调用者保存寄存器在函数调用中可被踩，被调用者保存寄存器必须由被调用者恢复；内核切换路径踩过的寄存器都要进保存清单。\n<\/li><li>\n进程资源分独享与共享：执行现场独享，内存空间与文件等可共享；线程结构存现场，mm 结构存共享资源。\n<\/li><li>\n切换路径必须不可被再次打断：保存与恢复现场期间要禁止抢占，否则同一进程两套现场交错落盘。\n<\/ol>\n<p>依赖链方向：打断发生 → 硬件压帧 → 软件压通用寄存器 → 现场落盘线程结构 → 换栈换页表 → 恢复另一进程现场。现场清单任何一项缺失，表现都是&quot;回来后随机数据错乱&quot;，而不是立即崩溃。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一层：硬件帧<\/h3>\n<p>进入门时硬件按 c04 规则压栈。同级帧从高地址到低地址：RFLAGS、CS、RIP；跨级帧先压旧 SS、旧 RSP，再压 RFLAGS、CS、RIP；异常带错误码的再压错误码。这层内容对应&quot;返回时回到哪条指令、用哪套标志与栈&quot;。<\/p>\n<h3>第二层：软件寄存器压栈<\/h3>\n<p>本书 <code>SAVE_ALL<\/code> 在硬件帧之后继续压栈（低地址方向）：<code>rax<\/code>、<code>es<\/code>、<code>ds<\/code>、<code>rbp<\/code>、<code>rdi<\/code>、<code>rsi<\/code>、<code>rdx<\/code>、<code>rcx<\/code>、<code>rbx<\/code>、<code>r8<\/code>、<code>r9<\/code>、<code>r10<\/code>、<code>r11<\/code>、<code>r12<\/code>、<code>r13<\/code>、<code>r14<\/code>、<code>r15<\/code>。压栈后入口代码把内核数据段选择子写入 <code>ds<\/code>、<code>es<\/code>，保证后续内核数据访问段正确。弹栈按相反顺序：先 <code>r15<\/code> 后 <code>rax<\/code>，段寄存器最后恢复。<\/p>\n<h3>现场落盘与恢复<\/h3>\n<p>调度决策切换时：当前内核栈 <code>rsp<\/code> 写入 <code>thread_struct.rsp<\/code>；被打断 RIP 写入 <code>rip<\/code>；<code>fs<\/code>、<code>gs<\/code>、<code>cr2<\/code>、<code>trap_nr<\/code>、<code>error_code<\/code> 逐项记录。恢复新进程时：先载入其 <code>rsp<\/code>，栈上就是它上次压入的寄存器帧；逆序弹出；按其 <code>fs<\/code>/<code>gs<\/code> 恢复段寄存器；<code>mm_struct<\/code> 页表基地址载入 CR3；最后跳 <code>rip<\/code>。<\/p>\n<h3>页表与地址空间切换<\/h3>\n<p><code>mm_struct<\/code> 持有页表基地址与各段区间。同进程线程切换不换 CR3；跨进程切换换 CR3，旧 TLB 项随页表切换失效。用户栈、代码段、动态内存区基地址都在 mm 结构里，供加载程序与内存管理使用。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：一次中断的栈布局<\/h3>\n<p>设进入前内核栈 <code>rsp = 0xFFFF_8000_0010_0000<\/code>，同级进入。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>压入顺序<\/th><th>内容<\/th><th>栈地址（向低地址）<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>RFLAGS<\/td><td><code>0xFFFF_8000_000F_FFF8<\/code><\/td><\/tr><tr><td>2<\/td><td>CS<\/td><td><code>0xFFFF_8000_000F_FFF0<\/code><\/td><\/tr><tr><td>3<\/td><td>RIP<\/td><td><code>0xFFFF_8000_000F_FFE8<\/code><\/td><\/tr><tr><td>4<\/td><td>rax<\/td><td><code>0xFFFF_8000_000F_FFE0<\/code><\/td><\/tr><tr><td>5<\/td><td>es<\/td><td><code>0xFFFF_8000_000F_FFD8<\/code><\/td><\/tr><tr><td>6<\/td><td>ds<\/td><td><code>0xFFFF_8000_000F_FFD0<\/code><\/td><\/tr><tr><td>7<\/td><td>rbp<\/td><td><code>0xFFFF_8000_000F_FFC8<\/code><\/td><\/tr><tr><td>8<\/td><td>rdi<\/td><td><code>0xFFFF_8000_000F_FFC0<\/code><\/td><\/tr><tr><td>9<\/td><td>rsi<\/td><td><code>0xFFFF_8000_000F_FFB8<\/code><\/td><\/tr><tr><td>10<\/td><td>rdx<\/td><td><code>0xFFFF_8000_000F_FFB0<\/code><\/td><\/tr><tr><td>11<\/td><td>rcx<\/td><td><code>0xFFFF_8000_000F_FFA8<\/code><\/td><\/tr><tr><td>12<\/td><td>rbx<\/td><td><code>0xFFFF_8000_000F_FFA0<\/code><\/td><\/tr><tr><td>13–17<\/td><td>r8…r12<\/td><td>各占 8B 依次向下<\/td><\/tr><tr><td>18–19<\/td><td>r13、r14<\/td><td>依次向下<\/td><\/tr><tr><td>20<\/td><td>r15<\/td><td>栈顶<\/td><\/tr><\/tbody><\/table><\/div>\n<p>64 位每槽 8B。<code>iretq<\/code> 先弹 RIP/CS/RFLAGS，软件弹栈从 r15 开始逆序。<\/p>\n<h3>算例 2：两进程 A → B 切换追踪<\/h3>\n<p>进程 A 被时钟中断打断：<\/p>\n<ol><li>\n硬件压 A 的 RFLAGS/CS/RIP；<code>SAVE_ALL<\/code> 压 A 通用寄存器到 A 的内核栈。\n<\/li><li>\n调度器选中 B。A 的 <code>thread_struct<\/code>：<code>rsp = A 内核栈当前指针<\/code>，<code>rip = A 被打断指令地址<\/code>，<code>fs/gs/cr2/trap_nr/error_code<\/code> 记录完毕。\n<\/li><li>\n载入 B 的 <code>rsp<\/code>（B 上次被打断时的栈指针），B 栈上保留 B 的寄存器帧；换 B 的 CR3。\n<\/li><li>\n逆序弹 B 寄存器，跳 B 的 <code>rip<\/code>，B 继续运行。\n<\/li><li>\n之后调度回 A：A 的现场仍在 A 线程结构与 A 内核栈，载入 A 的 <code>rsp<\/code> 与 CR3，弹栈回 A 的 RIP。\n<\/ol>\n<h3>算例 3：跨级返回栈帧<\/h3>\n<p>A 此前在用户态：栈帧含旧 SS、旧 RSP（用户栈）、RFLAGS、CS、RIP。切回 A 后 <code>iretq<\/code> 先恢复 RIP/CS/RFLAGS，再弹旧 RSP、旧 SS，回到用户栈继续用户指令；<code>rsp0<\/code> 保留内核栈基地址，供下次陷入使用。<\/p>\n<h2>延伸推演：调用约定与浮点现场<\/h2>\n<p>x86-64 调用约定把寄存器分两组：调用者保存（如 rax、rcx、rdx、rsi、rdi、r8–r11）在函数调用中可被覆盖；被调用者保存（rbx、rbp、r12–r15）由被调用者负责恢复。内核切换函数若踩了被调用者保存寄存器而未保存，被切进程的这些值就被污染。本书 <code>SAVE_ALL<\/code> 把两组一并压栈，是最稳妥的做法；代价是每次中断都有固定压栈开销。<\/p>\n<p>浮点与向量寄存器（XMM/YMM）不在通用现场清单内。若进程使用浮点运算而切换路径不保存，恢复后浮点寄存器残留另一进程的值。常见做法是延迟保存：标记浮点单元归属，真正用到时再切换；本书基础内核未启用浮点上下文，正式内核需补充这部分现场。<\/p>\n<h2>延伸推演：调用约定、栈容量与现场一致性<\/h2>\n<h3>调用约定两组寄存器<\/h3>\n<p>x86-64 中调用者保存寄存器（rax、rcx、rdx、rsi、rdi、r8–r11）在函数调用中可被覆盖，被调用者保存寄存器（rbx、rbp、r12–r15）由被调用者负责恢复。内核切换函数本身也是一段代码，执行期间会踩过这些寄存器；如果只保存调用者保存组，被调用者保存组的值就被切换函数污染。本书 <code>SAVE_ALL<\/code> 两组一并压栈，用固定开销换现场完整。<\/p>\n<h3>内核栈容量与截断检查<\/h3>\n<p>每个进程/线程配一份内核栈，大小固定。中断嵌套、系统调用深层调用、页错误处理叠加使用同一内核栈，栈指针持续向低地址走；栈耗尽会踩到栈边界外的内存，触发 <code>#SS<\/code> 或缺页。正式内核在栈边界放守卫页（guard page），越界访问触发缺页并报告栈溢出；本书基础实现按固定大小内核栈运行，未展开守卫页机制。<\/p>\n<h3>现场保存与恢复的顺序一致性<\/h3>\n<p>压栈清单决定弹栈清单：入口先压的寄存器在栈上高地址，恢复时后弹。顺序错位会把 r15 的值弹进 rax，现场整体错位。实现上通常用同一组寄存器名字对应压栈/弹栈宏，避免手工维护两份清单不一致。段寄存器 es、ds 在入口压栈后被换成内核段选择子，恢复时要从栈上原值弹回，不能留在内核段。<\/p>\n<h3>切换时 mm 与 CR3 的次序<\/h3>\n<p>跨进程切换：先保存当前进程现场，再载入新进程的线程栈与现场，最后换 CR3。若先换 CR3 再保存现场，保存动作访问的是新进程页表，当前进程的内核栈映射可能已不可见。本书切换路径在共享内核空间完成：内核页表在所有进程中常驻，保证切换过程中内核代码与栈始终可访问。<\/p>\n<h3>用户栈与内核栈的分工<\/h3>\n<p>用户态运行时用用户栈，<code>rsp<\/code> 指向用户空间；陷入内核时从 TSS/线程结构 <code>rsp0<\/code> 取内核栈，两套栈分离。用户栈可被用户程序增长与检查，内核栈由内核管理、用户态不可直接访问。线程切换保存的 <code>rsp<\/code> 是内核栈指针；<code>rsp0<\/code> 是内核栈基地址，供下次陷入取栈使用。<\/p>\n<h3>对抗性追问：只保存通用寄存器够不够<\/h3>\n<p>不够。指令地址 RIP、栈指针 RSP、段寄存器 fs/gs、标志 RFLAGS、页表基地址都属于现场；缺 RIP 回来不知从哪继续，缺 RSP 栈错位，缺 fs/gs 线程局部存储失效，缺 CR3 地址空间错。浮点与向量寄存器在使用 FPU 的进程中也是现场，需要额外保存或延迟切换（见正文边界）。<\/p>\n<h2>第二算例与补充推演<\/h2>\n<h3>上下文切换伪流程<\/h3>\n<pre><code>switch_to(prev, next):\n    保存 prev 的 rsp 到 prev.thread.rsp\n    保存当前 rip/寄存器现场到 prev.thread\n    加载 next.thread.rsp 到栈指针\n    恢复 next 的 fs/gs、cr2 等线程字段\n    切换 next.mm 对应的 CR3\n    从 next 栈弹出 next 的通用寄存器\n    跳到 next.thread.rip<\/code><\/pre>\n<p>保存与恢复的寄存器清单一一对应；<code>rip<\/code> 在切换函数返回时由栈上返回地址间接体现，首次启动的线程由入口函数地址显式写入。<\/p>\n<h3>现场完整性核对表<\/h3>\n<p>切换前后逐项核对：通用寄存器 rax/rbx/rcx/rdx/rsi/rdi/rbp/r8–r15；段寄存器 ds/es/fs/gs；指令地址 rip；栈指针 rsp/rsp0；标志 rflags；地址空间 CR3；异常信息 cr2/trap_nr/error_code。缺一项对应一类故障：缺 fs/gs 线程局部数据错，缺 cr2 缺页处理拿不到地址，缺 rflags 返回后标志位错乱。<\/p>\n<h3>线程现场与进程现场的关系<\/h3>\n<p>进程对象里 mm_struct 是共享部分，thread_struct 是独享部分。同进程线程切换：mm 指针与 CR3 不变，只换 thread 现场；跨进程切换：thread 现场与 mm/CR3 一起换。创建线程时新 thread 结构配新内核栈，入口 RIP 指向线程函数；创建进程时 mm 与 thread 都新建或复制。<\/p>\n<h3>现场初始化<\/h3>\n<p>新进程/线程首次被调度时，线程结构不能是随机值：栈上预置好通用寄存器初始值、入口函数 RIP、用户态返回帧；<code>rsp0<\/code> 指向分配好的内核栈。若现场未初始化，第一次切换弹出的寄存器与 RIP 是栈上垃圾值，启动即跑到错误地址。<\/p>\n<h3>补充推演：中断返回与进程切换的衔接<\/h3>\n<p>中断入口保存现场后，调度器可能决定切换到别的进程；此时保存在当前栈上的现场随 prev 线程结构落盘。被切进程下次被调度时，从自己栈上恢复，回到中断返回路径，再 <code>iretq<\/code> 回用户态。切换是在中断/系统调用返回点内部完成的，用户进程感知不到中间换过几轮内核。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n硬件帧压了哪几项？跨级多压哪两项？（RFLAGS/CS/RIP；跨级加旧 SS、旧 RSP。）\n<\/li><li>\n<code>thread_struct<\/code> 里 <code>rsp0<\/code> 与 <code>rsp<\/code> 各存什么？（<code>rsp0<\/code> 内核栈基地址，<code>rsp<\/code> 切换时栈指针。）\n<\/li><li>\n跨进程切换为什么要换 CR3？（页表随进程，不换则访问旧进程映射。）\n<\/li><li>\n同进程线程切换换不换 CR3？（不换，共享 mm 结构与页表。）\n<\/li><li>\n漏存被调用者保存寄存器会出现什么故障？（进程恢复后局部变量/指针值错乱，随机出错。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "任务/进程上下文切换保存了什么（现场清单与栈布局）"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：一个64位操作系统的设计与实现.pdf · p.475<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">任务/进程上下文切换保存了什么（现场清单与栈布局）<\/a><\/span><\/div><h1>调度器、时间片与时钟中断（进程状态、优先级、抢占时机）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书第 12 章 12.3 进程调度器、12.3.2 墙上时钟与定时器、12.3.4 实现进程调度）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>处理器数量远少于任务数量，操作系统必须决定哪个进程什么时候上处理器、跑多久、什么时候被换下。没有调度，进程要么独占处理器直到自己退出，要么排队等待，交互响应与公平性都无法保证。这个概念回答进程有哪些状态、调度依据什么字段选下一个任务、时间片由哪种时钟产生、抢占在哪些时机发生。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>进程状态<\/strong>（本书 <code>task_struct.state<\/code>，原书 12.3.1 节，PDF 第 476 页）：运行态（正在处理器上执行）、就绪态（等待处理器）、停止态、可中断等待态、不可中断等待态、僵死态等。调度器只在就绪态任务中挑选；等待资源的进程进入对应等待态，资源就绪后被唤醒回就绪态。<\/p>\n<p><strong>调度依据字段<\/strong>：<\/p>\n<ul><li>\n<code>priority<\/code>：静态优先级/ nice 值，影响时间片长短；\n<\/li><li>\n<code>counter<\/code>：剩余时间片计数；\n<\/li><li>\n<code>vrun_time<\/code>：虚拟运行时间，本书借鉴 CFS 思路，用红黑树按虚拟运行时间组织就绪队列，选虚拟运行时间最小的任务上处理器（原书 12.3.4 节，PDF 第 479、498 页）；\n<\/li><li>\n<code>state<\/code>、<code>flags<\/code>：状态与标志位，决定能否参与调度。\n<\/ul>\n<p><strong>时钟来源<\/strong>：<\/p>\n<ul><li>\nRTC（实时时钟）：提供墙上时间（年月日时分秒），供系统记录真实时间；\n<\/li><li>\nPIT（可编程间隔定时器）、HPET（高精度事件定时器）、Local APIC 定时器：产生周期性中断，驱动时间片递减与调度检查（原书 12.3.2 节，PDF 第 480 页）。\n<\/ul>\n<p><strong>抢占时机<\/strong>：中断/异常返回前、系统调用返回前，内核检查当前进程是否还应继续运行；时间片耗尽或更高优先级任务就绪时，调用调度器换入新任务（原书 12.3.4 节，PDF 第 497–498 页）。<\/p>\n<h2>执行推导与推演<\/h2>\n<p>第一步，时钟中断周期性进入。定时器中断经 IDT 进入处理程序，更新系统节拍计数，递减当前进程剩余时间片。<\/p>\n<p>第二步，状态推进。进程等待键盘输入时进入可中断等待态，从就绪队列移除；输入事件到达后唤醒函数把它置回就绪态并加入队列。<\/p>\n<p>第三步，决策。调度器遍历/检索就绪队列：按 <code>vrun_time<\/code> 取最小者，结合优先级与剩余时间片判断；当前进程时间片耗尽或被更高优先级任务抢占时，选中下一个任务。<\/p>\n<p>第四步，切换。走概念 c06 的上下文切换：保存当前现场到线程结构，恢复下一个进程现场与页表。<\/p>\n<p>第五步，返回。被选中的进程从中断返回或调度返回点继续执行；时间片由优先级折算，虚拟运行时间随执行时间累加。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：就绪队列维护准确；等待态进程不会被调度选中；时钟中断周期性可达；切换路径已禁止抢占。\n<\/li><li>\n失败案例：时间片只在主动让出时检查，高优先级任务就绪后必须等当前进程自愿让出，交互响应滞后；等待态进程仍留在就绪队列，被重复调度；虚拟运行时间不随执行累加，长任务永远占优或短任务反复饿死。\n<\/li><li>\n边界：本书实现借鉴 CFS 的虚拟运行时间与红黑树组织，但完整 CFS 的权重折算、唤醒补偿、带宽限制未全部展开；多核场景的负载均衡属于进一步扩展（原书 12.5 节前后，PDF 第 503 页起）。\n<\/li><li>\n线程是调度单位：同一进程多线程各自有独立调度现场，共享进程资源（PDF 第 525 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>优先级 vs 时间片<\/strong>：优先级决定调度权重与时间片折算基准；时间片是一次连续执行的时长配额，由优先级与剩余计数共同决定。\n<\/li><li>\n<strong>RTC vs 定时器<\/strong>：RTC 给墙上时间（日历时间），定时器给周期性节拍（调度与时序）；两者用途不同，不能互相替代。\n<\/li><li>\n<strong>协作式 vs 抢占式<\/strong>：协作式调度靠进程主动让出处理器；抢占式调度由内核在中断/返回点强制换人。本书走抢占式路径，检查点在中断与系统调用返回处。\n<\/li><li>\n<strong>就绪态 vs 运行态<\/strong>：就绪态任务具备运行条件但排队等待处理器；运行态任务此刻占用处理器。单核上同一时刻只有一个运行态任务。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c04/c05 的中断异常进入与返回路径是抢占检查点；概念 c06 的现场保存是切换执行动作。后继：概念 c09 的自旋锁/信号量保护就绪队列与等待队列；概念 c08 的 PCB 是调度字段载体；概念 c12 系统调用返回路径同样触发调度检查。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（调度器、时间片与时钟中断（进程状态、优先级、抢占时机））<\/summary><div class=\"depth-body\"><h1>c07 深度推导：状态机、节拍记账、就绪队列选择与时间线追踪<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清调度决策，往回追五层前提：<\/p>\n<ol><li>\n任务集合与资源约束先成立：任务数多于处理器数，才有排队与换人必要；每任务有状态、优先级、现场与内存空间。\n<\/li><li>\n时间基准先成立：周期性定时器产生节拍，墙上时间由 RTC 提供；没有节拍就无法递减时间片、无法累加运行时间。\n<\/li><li>\n调度字段先在 PCB 就位：状态、优先级、剩余计数、虚拟运行时间；选择规则按这些字段定义。\n<\/li><li>\n抢占检查点先确定：中断返回、异常返回、系统调用返回处可以重新决策；纯用户态协作路径只靠主动让出。\n<\/li><li>\n切换执行路径已具备：现场保存恢复（c06）、队列操作有同步保护（c09）。\n<\/ol>\n<p>依赖链方向：时钟节拍 → 状态推进与时间记账 → 就绪队列选择 → 上下文切换 → 返回执行。状态机不闭环（等待态误留就绪队列、唤醒后未回就绪态），调度就会选中错误任务。<\/p>\n<h2>正向推导<\/h2>\n<h3>状态机推进<\/h3>\n<p>运行态：占用处理器，持续累加运行时间。时间片耗尽或被抢占 → 就绪态。 就绪态：在队列中等待处理器，被调度器选中 → 运行态。 可中断等待态：等待事件（键盘、磁盘、信号），事件到达被唤醒 → 就绪态；可被信号打断。 不可中断等待态：等待关键资源，不被信号打断，资源就绪 → 就绪态。 僵死态：进程已结束，等待父进程回收 PCB，不再参与调度。<\/p>\n<h3>节拍记账<\/h3>\n<p>定时器中断每节拍进入处理程序：全局节拍计数加 1；当前进程剩余时间片递减；虚拟运行时间按执行时间累加。剩余时间片为 0 或虚拟运行时间超过阈值时，标记需要重调度。时钟中断返回路径检查重调度标志，决定是否调调度器。<\/p>\n<h3>选择规则<\/h3>\n<p>本书借鉴 CFS 思路：就绪队列按 <code>vrun_time<\/code> 组织（红黑树），取虚拟运行时间最小者上处理器；优先级作为权重影响时间片长短与虚拟运行时间折算。高优先级任务单次配额更长，低优先级任务配额更短；长期未运行的任务虚拟运行时间落后，会被优先选中，避免饿死。<\/p>\n<h3>切换与返回<\/h3>\n<p>调度器选中新任务后走 c06 路径：保存当前现场、换栈换页表、恢复新任务现场。新任务从上次被打断的 <code>rip<\/code> 继续；若它此前在用户态，<code>iretq<\/code> 回到用户指令流。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：三任务时间片轮转<\/h3>\n<p>设任务 A、B、C 就绪，优先级分别为 20、16、16，每节拍时间片基准 1 个单位，高优先级配额翻倍。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>时刻<\/th><th>动作<\/th><th>A 剩余<\/th><th>B 剩余<\/th><th>C 剩余<\/th><\/tr><\/thead><tbody><tr><td>t0<\/td><td>选 A（vrun_time 最小）<\/td><td>2<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>t1<\/td><td>A 跑 1 节拍<\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>t2<\/td><td>A 再跑 1 节拍，耗尽<\/td><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>t3<\/td><td>选 B，跑 1 节拍耗尽<\/td><td>0<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>t4<\/td><td>选 C，跑 1 节拍耗尽<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>t5<\/td><td>三个任务重新分配配额，循环<\/td><td>2<\/td><td>1<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A 优先级高，一次拿 2 个节拍；B、C 各 1 个。若 B 中途等待键盘进入等待态，t3 直接选 C；键盘事件到达后 B 回就绪队列，排在 C 之后。<\/p>\n<h3>算例 2：虚拟运行时间防饿死<\/h3>\n<p>设任务 X 是低优先级后台任务，已累计 <code>vrun_time=100<\/code>；任务 Y 是高优先级交互任务，<code>vrun_time=10<\/code>。新任务 Z 进入队列，<code>vrun_time=0<\/code>。选择顺序：Z（0）→ Y（10）→ X（100）。X 虽落后，但下次 Z、Y 再累计后，X 的相对位置前移；若 X 长期不被选中，其 <code>vrun_time<\/code> 与队列最小值差距拉大，最终在选择时被优先挑出。<\/p>\n<h3>算例 3：抢占检查点时序<\/h3>\n<p>用户进程执行系统调用：陷入内核 → 处理函数 → 返回前检查重调度标志。此时若时钟中断已把当前进程时间片耗尽，检查点调调度器换上另一进程；系统调用返回点不在用户态指令之间，内核借此完成对用户进程的抢占。<\/p>\n<h2>延伸推演：权重折算、唤醒补偿与多核均衡<\/h2>\n<p>完整 CFS 按优先级权重把实际运行时间折算成虚拟运行时间：权重高的任务，同等实际时间折算的虚拟时间增量小，单位时间拿到更多处理器。本书实现取虚拟运行时间排序与优先级配额的简化骨架，权重折算公式未完整展开。<\/p>\n<p>唤醒补偿：任务从等待态唤醒时，其虚拟运行时间落后于队列平均，立即被选中可改善交互响应；但不能让长睡眠任务长期占据处理器，需要在调度周期内逐步追平。多核场景下还要考虑每个核心的就绪队列负载，把任务迁移到空闲核心，避免一核忙一核闲；本书基础实现围绕单核调度展开。<\/p>\n<p>时间片过长，交互任务响应慢；时间片过短，上下文切换开销占比升高。配额大小要在响应性与切换成本之间折中，这也是优先级字段存在的意义：关键任务拿更长配额，后台任务拿短配额。<\/p>\n<h2>延伸推演：配额折算、队列操作与调度延迟来源<\/h2>\n<h3>时间片与虚拟运行时间折算<\/h3>\n<p>优先级高的任务单位时间获得更多配额。简化模型中，时间片基准按优先级档位给整数拍数；完整 CFS 把实际运行时间按权重折算成虚拟运行时间：权重高的任务同样实际耗时折算的虚拟增量小，在红黑树上位置更靠前。本书实现取虚拟运行时间排序与优先级配额的骨架，权重折算公式未完整展开；阅读时先分清&quot;实际跑了多久&quot;与&quot;虚拟记账时间&quot;两个量。<\/p>\n<h3>就绪队列的数据结构<\/h3>\n<p>本书借鉴 CFS 用红黑树按 <code>vrun_time<\/code> 组织就绪任务：插入、取最左（虚拟时间最小）、删除均为对数级；简单轮转可用双向链表，扫描选队首。队列操作要持锁（c09）：入队、出队、改状态在自旋锁或等待队列保护下进行，避免两个核心同时改链表节点。<\/p>\n<h3>睡眠与唤醒路径<\/h3>\n<p>任务等待资源：状态置可中断/不可中断等待，从就绪队列摘除，挂到对应等待队列，调 <code>schedule<\/code> 让出处理器。资源就绪：唤醒函数把任务状态改就绪，挂回就绪队列；可中断等待还可被信号打断提前唤醒。等待队列是信号量、磁盘 I/O、键盘输入共用的挂起结构（c09、c11、c12 都经过这条路径）。<\/p>\n<h3>优先级反转与解决<\/h3>\n<p>低优先级任务持有锁，高优先级任务等待该锁；中优先级任务抢占低优先级任务运行，形成高优先级被间接阻塞。解决思路：持锁者临时继承等待者的高优先级（优先级继承），释放锁后回落；本书基础实现未展开该机制，读源码时注意锁持有者的优先级变化。<\/p>\n<h3>调度延迟来自哪里<\/h3>\n<p>响应延迟 = 从任务就绪到上处理器的时间。来源包括：当前进程时间片剩余、中断返回点检查周期、队列查找耗时、上下文切换本身的现场保存恢复成本。时间片过长则交互延迟升高；过短则切换开销占比升高。可中断等待任务被唤醒后要重新走入队与选择流程，不能直接插队上处理器。<\/p>\n<h3>对抗性追问：为什么空闲任务不能省<\/h3>\n<p>所有就绪任务都阻塞时，处理器需要一个最低优先级的空闲任务循环等待中断；没有空闲任务，调度器在空队列上找不到可运行对象，取指与栈状态不可控。空闲任务不占用户配额，中断到达后再切到真实任务。<\/p>\n<h2>第二算例与补充推演<\/h2>\n<h3>状态转换文字图<\/h3>\n<pre><code>就绪态 ──被调度选中──▶ 运行态\n运行态 ──时间片耗尽/被抢占──▶ 就绪态\n运行态 ──等待资源──▶ 可中断/不可中断等待态\n等待态 ──资源就绪/信号唤醒──▶ 就绪态\n运行态 ──退出──▶ 僵死态 ──父进程回收──▶ 销毁<\/code><\/pre>\n<p>每个箭头对应 PCB 上状态字段的一次改写；等待态进程不在就绪队列，调度器扫描时跳过。<\/p>\n<h3>调度器选择伪流程<\/h3>\n<pre><code>schedule():\n    关抢占/持就绪队列锁\n    从就绪队列选 vrun_time 最小任务 next\n    若 next != current:\n        switch_to(current, next)\n    释放锁<\/code><\/pre>\n<p>选择依据先看状态可运行，再比虚拟运行时间与优先级；当前任务时间片未耗尽且无更高优先级任务时，直接返回不切换。<\/p>\n<h3>时间片记账细节<\/h3>\n<p>每节拍定时器中断：当前进程实际运行时间累加，剩余配额递减；虚拟运行时间按权重折算累加。配额归 0 时重调度标志置位；任务从等待态唤醒时，其虚拟时间落后于队列平均，获得优先调度机会。记账字段都在 PCB（c08），队列操作受锁保护（c09）。<\/p>\n<h3>唤醒时机<\/h3>\n<p>资源就绪事件（键盘输入到达、磁盘扇区读完、信号到达）由事件处理路径调用唤醒函数：改状态、入就绪队列、必要时触发重调度检查。等待队列上的任务按 FIFO 或优先级顺序唤醒；不可中断等待不被信号打断。<\/p>\n<h3>补充推演：调度延迟与时间片折中<\/h3>\n<p>时间片长：切换次数少、吞吐高，交互任务响应慢；时间片短：响应快，上下文切换开销（c06 现场保存恢复）占比升高。配额按任务类型分档：前台交互任务短配额优先响应，后台计算任务长配额减少切换。本书实现围绕单核队列；多核还需考虑每核队列均衡与任务迁移。<\/p>\n<h3>补充：空闲任务与空队列<\/h3>\n<p>就绪队列为空时调度器切换到最低优先级的空闲任务：循环等待中断，不占用户配额。所有任务阻塞等待 I/O 时处理器进入空闲态，时钟或设备中断到达后再唤醒对应任务。空队列上若没有空闲任务，调度器找不到可运行对象，栈与指令流不可控，因此空闲任务是调度器的必要兜底项。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n等待态任务为什么不进调度选择？（不具备运行条件，选中也无法推进。）\n<\/li><li>\nRTC 和 APIC 定时器各解决什么问题？（RTC 墙上时间；定时器周期节拍驱动调度。）\n<\/li><li>\n本书就绪队列按什么字段排序选任务？（<code>vrun_time<\/code> 虚拟运行时间，借鉴 CFS。）\n<\/li><li>\n抢占检查点在哪几处？（中断/异常返回、系统调用返回前。）\n<\/li><li>\n同进程线程切换为什么不换页表？（线程共享 mm 结构与地址空间。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "调度器、时间片与时钟中断（进程状态、优先级、抢占时机）"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：一个64位操作系统的设计与实现.pdf · p.168<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">任务/进程上下文切换保存了什么（现场清单与栈布局）<\/a><\/span><\/div><h1>内核对象与 PCB：进程资源的结构化组织<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 3 章（原书第 4 章 4.8.2 PCB 结构、第 12 章 12.5.1 完善 PCB、12.5.3 关于线程）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>内核要管理成百上千个进程，每个进程有状态、优先级、信号、内存空间、执行现场等一批资源。零散保存这些信息会导致查找、调度、回收都没有统一入口；把它们组织成结构化的内核对象，按 PID 与链表索引，调度、同步、内存回收才能对着同一套数据操作。这个概念回答 PCB 分哪几部分、哪些字段是进程独享、哪些经指针共享，线程与进程在对象结构上差在哪里。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>PCB（本书 <code>struct task_struct<\/code>）<\/strong>：进程在内核中的控制结构体，第一版字段包括（原书 4.8.2 节，PDF 第 168 页）：<\/p>\n<ul><li>\n<code>list<\/code>：链表节点，串起所有进程；\n<\/li><li>\n<code>state<\/code>：进程状态；\n<\/li><li>\n<code>flags<\/code>：标志位；\n<\/li><li>\n<code>pid<\/code>：进程号；\n<\/li><li>\n<code>priority<\/code>：优先级；\n<\/li><li>\n<code>signal<\/code>：待处理信号；\n<\/li><li>\n<code>counter<\/code>：剩余时间片计数。\n<\/ul>\n<p><strong>内存空间结构体 <code>mm_struct<\/code><\/strong>：经指针关联到 PCB，记录页表基地址、代码段/数据段/动态内存区/用户栈基地址等地址空间布局（PDF 第 169 页）。<\/p>\n<p><strong>线程结构体 <code>thread_struct<\/code><\/strong>：保存执行现场：<code>rsp0<\/code>、<code>rip<\/code>、<code>rsp<\/code>、<code>fs<\/code>、<code>gs<\/code>、<code>cr2<\/code>、<code>trap_nr<\/code>、<code>error_code<\/code>（PDF 第 170 页，详见概念 c06）。<\/p>\n<p><strong>对象组织方式<\/strong>：本书以进程链表遍历全部 PCB，<code>pid<\/code> 作为进程标识；后续版本补充信号处理函数、文件与设备上下文等字段（原书 12.5.1 节，PDF 第 503 页起）。需要说明：本书这一版未实现独立的文件句柄表，打开文件的索引管理属于后续可扩展部分；概念上&quot;内核对象 + 索引表&quot;的组织思路与句柄表一致——对象实体在内核，索引供外界引用。<\/p>\n<p><strong>线程结构归属<\/strong>：线程依附进程存在；同一进程的多个线程共享 <code>mm_struct<\/code> 与进程资源，各自持有独立 <code>thread_struct<\/code> 与调度现场（原书 12.5.3 节，PDF 第 525 页）。<\/p>\n<h2>执行推导与推演<\/h2>\n<p>创建进程时：分配一个 <code>task_struct<\/code> 对象，填 PID、默认优先级与状态；初始化 <code>thread_struct<\/code>（内核栈指针、入口 RIP、初始寄存器值）；建立或关联 <code>mm_struct<\/code>，载入代码段/数据段/用户栈地址；把 PCB 挂入进程链表。<\/p>\n<p>调度查找时：按链表遍历或按 PID 定位 PCB，读 <code>state<\/code> 判断是否可调度，读 <code>priority<\/code>、<code>vrun_time<\/code> 参与选择。<\/p>\n<p>退出回收时：状态置僵死态，现场与资源逐步释放；<code>mm_struct<\/code> 指向的地址空间、<code>thread_struct<\/code> 栈、链表节点依次从系统摘除，最后回收 PCB 对象本身。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：每个进程一个 PCB 对象；链表与 PID 唯一；对象生命周期与进程一致；共享资源引用计数清楚，避免共享内存被提前释放。\n<\/li><li>\n失败案例：PCB 未挂入链表，调度器遍历不到；PID 冲突导致对象互指；共享 <code>mm_struct<\/code> 的线程退出时释放地址空间，其他线程随即踩空；现场字段未初始化，新进程首次调度拿到随机寄存器值。\n<\/li><li>\n边界：本书 PCB 字段随章节迭代逐步补齐，早期版本内存管理与信号字段较简；句柄表、文件描述符表等扩展对象结构在本版未展开。\n<\/li><li>\n内核对象不限于 PCB：页框 <code>struct Page<\/code>、slab 池、等待队列项、定时器节点都是同类&quot;实体 + 索引/链表&quot;结构（概念 c10 展开页框与 slab）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>task_struct vs mm_struct vs thread_struct<\/strong>：task_struct 是进程总入口；mm_struct 管共享地址空间；thread_struct 管独享执行现场。三者经指针连成一个进程对象。\n<\/li><li>\n<strong>进程对象 vs 线程对象<\/strong>：进程对象持有资源；线程对象只加一份独立现场，共享进程的 mm 与资源。\n<\/li><li>\n<strong>PID vs 链表节点<\/strong>：PID 是标识编号，用于按号查找；<code>list<\/code> 是遍历手段，用于全队列扫描。两者职责不同，不能互相替代。\n<\/li><li>\n<strong>内核对象 vs 物理资源<\/strong>：PCB 是管理元数据，不是资源本身；它指向页表、栈、文件等实际资源，回收对象时要沿指针释放被指向的资源。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c06 的现场字段决定 <code>thread_struct<\/code> 内容；概念 c07 的调度字段在 PCB 上。后继：概念 c09 的锁保护 PCB 链表与等待队列；概念 c10 分配 PCB 与线程结构所占用的内核内存；概念 c12 系统调用按 PID/PCB 找到当前进程执行操作。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（内核对象与 PCB：进程资源的结构化组织）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：PCB 三层结构、对象生命周期与线程共享追踪<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清内核怎样组织进程对象，往回追五层前提：<\/p>\n<ol><li>\n进程需要被统一查找：按编号找、按队列遍历，对象必须有标识字段与链表节点。\n<\/li><li>\n进程信息分三类：调度与身份信息、共享地址空间、独享执行现场；混在一张表里会导致线程间现场互相污染。\n<\/li><li>\n资源要有归属与释放顺序：对象实体、指向的栈与页表、共享空间分属不同生命周期，退出时按逆序释放。\n<\/li><li>\n并发访问有保护：链表、等待队列、引用计数会被中断与多个进程同时改，需要同步手段（c09）。\n<\/li><li>\n内存来源已就位：PCB、线程栈、mm 结构都由内核分配器从页框/slab 取得（c10）。\n<\/ol>\n<p>依赖链方向：分配对象 → 填身份与调度字段 → 关联共享 mm → 初始化现场 thread → 挂入链表 → 调度/同步访问 → 退出逆序释放。任何一层指针缺失，对象要么遍历不到，要么回收时漏放资源。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一层：task_struct 总入口<\/h3>\n<p>身份与调度字段：<code>pid<\/code>、<code>state<\/code>、<code>flags<\/code>、<code>priority<\/code>、<code>signal<\/code>、<code>counter<\/code>、<code>vrun_time<\/code>；链表节点 <code>list<\/code> 把全部 PCB 串成队列。这一层回答&quot;这是谁、能不能跑、跑多久&quot;。调度器遍历队列时只读这层字段；信号处理、状态推进也先改这层。<\/p>\n<h3>第二层：mm_struct 共享地址空间<\/h3>\n<p>指针指向页表基地址、代码段、数据段、动态内存区、用户栈区间。同进程线程共享这一层；切换线程不换 CR3，切换进程才换。地址空间的创建（程序加载）、扩展（动态内存申请）、释放（进程退出）都作用在 mm 结构上。<\/p>\n<h3>第三层：thread_struct 独享现场<\/h3>\n<p><code>rsp0<\/code>、<code>rip<\/code>、<code>rsp<\/code>、<code>fs<\/code>、<code>gs<\/code>、<code>cr2<\/code>、<code>trap_nr<\/code>、<code>error_code<\/code>。每次上下文切换读写这一层；线程之间各持一份，互不覆盖。内核栈随线程结构分配，<code>rsp0<\/code> 指向栈基地址。<\/p>\n<h3>生命周期<\/h3>\n<p>创建：申请 task_struct → 分配内核栈与 thread_struct → 初始化 mm_struct（或继承父进程）→ 填 PID/优先级/状态 → 挂链表。 运行：调度字段被读写，现场随切换保存恢复。 等待：状态改等待态，从就绪队列摘除，挂到对应等待队列。 唤醒：状态回就绪态，重新入就绪队列。 退出：状态置僵死 → 释放 mm 与地址空间 → 摘链表 → 回收线程栈与 PCB。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：进程 A 对象指针布局<\/h3>\n<p>设进程 A 的 <code>task_struct<\/code> 位于内核线性地址 <code>0xFFFF_8000_0020_1000<\/code>：<\/p>\n<ul><li>\n<code>list.next<\/code>/<code>prev<\/code> 指向队列中前后 PCB；\n<\/li><li>\n<code>pid = 12<\/code>，<code>state = 运行态<\/code>，<code>priority = 20<\/code>；\n<\/li><li>\n<code>mm<\/code> 指针 → <code>mm_struct @ 0xFFFF_8000_0021_0000<\/code>，其中页表基地址（CR3 值）<code>0x90000<\/code>；\n<\/li><li>\n<code>thread<\/code> 嵌入或指针 → <code>thread_struct<\/code>，<code>rsp0 = 0xFFFF_8000_0010_0000<\/code>，<code>rip = 0x401000<\/code>，<code>rsp = 0xFFFF_8000_000F_FF80<\/code>。\n<\/ul>\n<p>按 PID=12 遍历链表定位到该对象后，调度器读 priority/vrun_time，切换时读 thread 现场，内存管理经 mm 指针找页表。<\/p>\n<h3>算例 2：同进程两线程共享追踪<\/h3>\n<p>进程 A 创建线程 T2：<\/p>\n<ol><li>\n新建 <code>task_struct<\/code> 与独立 <code>thread_struct<\/code>、独立内核栈；\n<\/li><li>\n<code>mm<\/code> 指针直接复制指向同一个 <code>mm_struct<\/code>，页表基地址相同；\n<\/li><li>\nT2 挂入线程/进程队列，初始 <code>rip<\/code> 指向线程入口函数。\n<\/ol>\n<p>切换 A→T2：保存 A 的 thread 现场，载入 T2 的 thread 现场；CR3 不换，两线程看到同一地址空间。T2 退出：只释放自己的 thread 现场与栈，mm 空间由进程最后退出时释放；若 T2 退出时误放 mm，A 的内存映射立即失效。<\/p>\n<h3>算例 3：退出释放顺序<\/h3>\n<p>进程退出路径：僵死态标记 → 摘就绪/等待队列 → 释放 mm 指向的页表与地址区间 → 释放 thread 内核栈 → 回收 task_struct。顺序反过来会出现：PCB 先回收，mm 与栈找不到归属；或 mm 先释放但线程仍在用页表。<\/p>\n<h2>延伸推演：对象表、句柄与引用计数<\/h2>\n<p>&quot;内核对象 + 索引表&quot;是通用组织模式：外界拿到一个索引值（句柄），内核在表内查对象指针。本书 PCB 以 PID 作索引、链表作遍历手段，等价于一张进程对象表；文件句柄表、设备句柄表是同一模式在文件与设备上的扩展，本版未实现。<\/p>\n<p>共享资源需要引用计数：mm 结构被多线程共享时，内部记录引用数；线程退出减计数，归零时才释放地址空间。页框与 slab 对象（c10）采用同一规则：分配时加引用，释放时减计数，计数到零才归还分配器。没有引用计数，共享对象要么被提前释放，要么永久占用。<\/p>\n<p>对象类型可以扩展：定时器节点、等待队列项、锁对象都是内核里的实体结构，挂在各自链表上，由对应子系统管理。PCB 是其中生命周期最长、关联资源最多的一类。<\/p>\n<h2>延伸推演：进程创建、标识分配与对象查找<\/h2>\n<h3>创建路径：复制与初始化<\/h3>\n<p>新进程通常从父进程复制 PCB 与地址空间（或按加载映像新建）：复制 mm 映射后按需写时复制，初始化 thread 现场为入口函数与新栈，分配新 PID，挂入进程链表。本书早期版本从内核初始任务结构派生应用进程；子进程继承信号处理、文件上下文等资源，引用计数相应增加。<\/p>\n<h3>PID 分配与回收<\/h3>\n<p>PID 是整数标识，分配时从位图或空闲集合取未用号；进程退出后 PID 回收，经过复用间隔避免与仍在引用旧 PID 的对象混淆。按 PID 查找是遍历链表加比较，或经 PID 哈希表/数组索引；本书基础实现以链表遍历为主，PID 哈希属于扩展优化。<\/p>\n<h3>信号与挂起位<\/h3>\n<p><code>signal<\/code> 字段记录待处理信号位图；信号处理函数指针表在完善版 PCB 中补充。信号到达时置位对应位，进程在返回用户态前检查并投递处理程序。信号字段与状态字段配合：不可中断等待态不被普通信号打断，可中断等待态可被信号唤醒。<\/p>\n<h3>文件与设备上下文的扩展位置<\/h3>\n<p>本版 PCB 未展开文件描述符表；完整对象模型中，PCB 经指针指向打开文件表，表项索引（句柄）对应文件对象、位置偏移与访问模式。设备上下文、工作目录、权限凭据同样挂在 PCB 或其附属结构上。组织模式与线程结构一致：实体在内核，索引供外界引用。<\/p>\n<h3>线程组与资源归属<\/h3>\n<p>同进程线程在任务结构中记录线程组关系：主线程持有 mm 与资源，工作线程共享 mm；线程退出只清自身现场，最后一个线程退出时释放进程资源。引用计数区分&quot;进程整体引用&quot;与&quot;线程个体引用&quot;，避免共享 mm 被提前释放。<\/p>\n<h3>对抗性追问：PCB 漏挂链表会怎样<\/h3>\n<p>对象已分配、现场已初始化，但 <code>list<\/code> 节点未入队：调度器遍历就绪队列找不到它，任务永远不运行；按 PID 查找也走不到该对象。故障表现为进程创建成功却无动作，排查要点是对照创建流程检查入队步骤与状态字段。<\/p>\n<h2>第二算例与补充推演<\/h2>\n<h3>三层结构字段对照<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>层级<\/th><th>结构体<\/th><th>代表字段<\/th><th>归属<\/th><\/tr><\/thead><tbody><tr><td>总入口<\/td><td>task_struct<\/td><td>pid、state、priority、signal、counter、vrun_time、list<\/td><td>进程/线程<\/td><\/tr><tr><td>共享空间<\/td><td>mm_struct<\/td><td>页表基地址、代码/数据/堆/用户栈区间<\/td><td>进程共享<\/td><\/tr><tr><td>独享现场<\/td><td>thread_struct<\/td><td>rsp0、rip、rsp、fs、gs、cr2、trap_nr、error_code<\/td><td>线程独享<\/td><\/tr><\/tbody><\/table><\/div>\n<p>创建对象时三层分别初始化；调度读第一层，切换读写第三层，内存管理经第二层。<\/p>\n<h3>链表组织与遍历<\/h3>\n<p><code>list<\/code> 节点把全部 PCB 串成双向链表：遍历用于按 PID 查找、统计任务数、回收遍历。队列（就绪/等待）是另外的链表或树，节点指针在 PCB 内；同一 PCB 可同时挂在进程总链表与某条等待队列上。摘队列时只摘调度队列节点，不摘进程总链表节点。<\/p>\n<h3>资源释放依赖顺序<\/h3>\n<p>退出时先摘调度/等待队列，再释放 mm 指向的页表与地址区间，再释放 thread 内核栈，最后回收 task_struct。依赖关系：mm 释放前线程不能再访问用户映射；栈释放前现场已保存完毕。顺序颠倒会出现悬空指针或现场丢失。<\/p>\n<h3>对象标识与查找路径<\/h3>\n<p>按 PID 查找：遍历进程总链表比较 <code>pid<\/code>；正式内核可用 PID 哈希表把查找降到平均常数时间。按队列查找：在就绪/等待队列内按状态筛选。PCB 地址是内核虚拟地址，用户态只持有 PID/句柄，经系统调用间接引用。<\/p>\n<h3>补充推演：内核对象的共性<\/h3>\n<p>PCB、页框 <code>struct Page<\/code>、slab 池、等待队列项、定时器节点都是&quot;实体结构 + 链表/索引&quot;模式：结构内记录状态与计数，挂在所属子系统链表上，分配时初始化，回收时复位。理解 PCB 后，其余内核对象的组织方式同构，差别只在字段与所属队列。<\/p>\n<h3>补充：线程组与 PID 关系<\/h3>\n<p>主线程与同组线程在 PCB 中记录线程组关系：组号指向主线程 PID，各工作线程有自己的线程 PID。信号按线程组投递，地址空间按组共享。退出时单个工作线程只释放自身现场；主线程退出或最后一个线程退出时才释放 mm 与进程资源。PID 分配在进程创建时进行，线程可复用组号或另分配线程号，按内核实现约定。<\/p>\n<h3>补充：本书版本字段演进<\/h3>\n<p>本书早期 PCB 字段较简：链表、状态、标志、PID、优先级、信号、计数；后续章节逐步补齐信号处理、内存区间、线程现场与文件上下文。阅读源码时对照 4.8.2 节初版结构与 12.5.1 节完善版结构，字段分阶段加入，不要把后期字段套到早期初始化路径上。<\/p>\n<h2>自检<\/h2>\n<ol><li>\ntask_struct、mm_struct、thread_struct 各管什么？（身份调度字段；共享地址空间；独享执行现场。）\n<\/li><li>\n线程切换为什么不换 CR3？（共享 mm 结构与页表。）\n<\/li><li>\n进程退出释放资源的大致顺序是什么？（摘队列 → 放 mm 与地址空间 → 放线程栈 → 回收 PCB。）\n<\/li><li>\nPID 和链表节点职责有何不同？（PID 按号查找；链表遍历全队列。）\n<\/li><li>\n共享 mm 为什么需要引用计数？（线程退出不能立即释放空间，最后一个退出者才释放。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "内核对象与 PCB：进程资源的结构化组织"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：一个64位操作系统的设计与实现.pdf · p.512<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">调度器、时间片与时钟中断（进程状态、优先级、抢占时机）<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">内核对象与 PCB：进程资源的结构化组织<\/a><\/span><\/div><h1>自旋锁、信号量与原子变量（何时用哪个、是否关中断）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（原书第 12 章 12.4 内核同步方法：原子变量、信号量、完善自旋锁）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>多核处理器、多个中断与多个进程并发访问同一份共享数据（链表、队列、引用计数、设备寄存器）时，读改写三步可以交错执行，后写覆盖先写，更新丢失。内核需要按临界区长短与上下文类型选择同步手段：单变量用原子操作，短临界区用忙等锁，长临界区用可休眠锁。这个概念回答三种手段各保护什么、等待者是忙等还是休眠、加锁时要不要关中断或禁止抢占。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>原子变量<\/strong>：对长整型的二次封装，自增自减由 <code>LOCK<\/code> 指令前缀修饰；原书表述为 LOCK 前缀锁住前端总线、阻止其他处理器访问内存；按现代 x86 口径，缓存命中时通常由缓存一致性协议独占对应缓存行实现原子性，未命中缓存或跨缓存行时才锁总线，读改写作为不可分割的整体完成（原书 12.4.1 节，PDF 第 510 页）。普通 <code>inc<\/code> 指令分读、改、写三步，中间可被并行交错。<\/p>\n<p><strong>自旋锁<\/strong>：持锁期间禁止抢占，等待者忙循环检测锁标志。本书在 PCB 追加 <code>preempt_count<\/code> 计数变量：加锁 <code>preempt_count++<\/code> 关抢占，放锁 <code>preempt_count--<\/code> 恢复；计数为 0 才允许被抢占（原书 12.4.3 节，PDF 第 512、514 页）。用计数而不是标志位，是因为一个进程可能同时持有多把自旋锁。<\/p>\n<p><strong>信号量<\/strong>：带资源计数与等待队列的休眠锁。<code>down<\/code> 申请资源：计数大于 0 则减计数继续；计数为 0 则当前进程置不可中断状态，加入等待队列，经 <code>schedule<\/code> 让出处理器；<code>up<\/code> 释放资源时计数加 1，唤醒等待队列中的进程（原书 12.4.2 节，PDF 第 510–512 页）。<\/p>\n<p><strong>中断上下文约束<\/strong>：中断处理程序打断的是某个进程现场，没有自己的进程实体可挂起；中断上下文里只能用自旋锁，不能用信号量——信号量等待会休眠入队，无人能唤醒。自旋锁与信号量不能叠加使用（PDF 第 514 页）。<\/p>\n<h2>执行推导与推演<\/h2>\n<p>原子自增路径：<code>atomic_inc<\/code> 编译为 <code>lock incq<\/code> 修饰内存操作；独占该单元（缓存命中时锁缓存行，否则锁总线）期间，其他核心对该地址的访问被串行化阻塞；自增完成后释放独占，计数作为整体被更新。<\/p>\n<p>自旋锁加锁路径：检查锁标志 → 空闲则置占用标志，<code>preempt_count++<\/code>；忙则循环重读标志，不挂起。临界区执行期间当前进程不能被抢占换出，否则持锁者不再运行，等待者忙循环形成死锁式等待。放锁：清占用标志，<code>preempt_count--<\/code>，计数归 0 恢复抢占。<\/p>\n<p>信号量申请路径：<code>down<\/code> 读计数 → 大于 0 减计数返回；为 0 则状态置不可中断，挂等待队列，调 <code>schedule<\/code> 切走；被唤醒后重新竞争资源。释放 <code>up<\/code>：计数加 1，唤醒队列等待者。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：临界区持锁时间极短、等待者可以接受忙等 → 自旋锁；临界区可能等待 I/O、持锁时间长 → 信号量；单个计数器增减 → 原子变量。\n<\/li><li>\n失败案例：中断上下文用信号量，进程休眠后无人唤醒；持自旋锁期间允许抢占，持锁者被换出导致死等；自旋锁保护的临界区里调用可能休眠的函数（如内存分配等待换页）；原子变量用于多步复合操作（检查+修改两个变量），单变量原子挡不住交错。\n<\/li><li>\n边界：自旋锁忙等消耗处理器周期，等待时长超过一次上下文切换成本时，信号量更划算；本书基础实现未展开读写锁、RCU 等更细粒度手段。\n<\/li><li>\n关中断与关抢占是两层：关抢占阻止调度换出，关中断阻止中断处理程序进入临界区；共享数据同时被中断程序访问时，持自旋锁还需在本地关中断。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>自旋锁 vs 信号量<\/strong>：等待方式不同——自旋锁忙等不睡眠，信号量休眠入队；适用时长不同——短临界区用自旋锁，长临界区用信号量；上下文限制不同——中断上下文只能用自旋锁。\n<\/li><li>\n<strong>原子变量 vs 自旋锁<\/strong>：原子变量只保证单条读改写指令不可分割；自旋锁保护多条指令组成的临界区。复合操作即使每个变量都原子，整体仍可能交错。\n<\/li><li>\n<strong>关抢占 vs 关中断<\/strong>：关抢占阻止调度器换出当前进程；关中断阻止外部中断进入。持自旋锁防的是同核抢占，共享数据被中断访问时还要额外关中断。\n<\/li><li>\n<strong>计数 vs 标志位<\/strong>：<code>preempt_count<\/code> 用计数支持嵌套持锁；标志位在第二次加锁时会错误清零。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c07 的调度器与等待队列是信号量休眠/唤醒的落点；概念 c08 的 PCB 链表是被保护对象。后继：概念 c10 的页框与 slab 池链表、概念 c11 的文件系统元数据、概念 c12 的系统调用表访问都需要这些同步手段保护。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（自旋锁、信号量与原子变量（何时用哪个、是否关中断））<\/summary><div class=\"depth-body\"><h1>c09 深度推导：总线锁定、忙等与休眠等待的机制对比<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清三种同步手段的分工，往回追五层前提：<\/p>\n<ol><li>\n并发来源先分清：多核同时执行、中断随时插入、进程调度换出；不同来源要求不同防护。\n<\/li><li>\n竞争操作先拆分：单变量读改写 vs 多步临界区；单步可用原子指令，多步必须加锁。\n<\/li><li>\n等待成本先估算：忙等占处理器周期，休眠等待要保存现场、入队、唤醒，两次切换有开销；临界区长短决定选哪种。\n<\/li><li>\n上下文类型先判定：进程上下文可休眠可调度，中断上下文没有可挂起的进程实体。\n<\/li><li>\n抢占模型先成立：持锁期间不能被换出，否则持锁者停止运行，等待者无法等到锁释放。\n<\/ol>\n<p>依赖链方向：识别共享数据与竞争操作 → 按操作粒度选原子/锁 → 按临界区长短与上下文选自旋/信号量 → 加锁路径配套关抢占/关中断 → 放锁路径逆序恢复。手段选错的典型故障：中断里休眠、持锁被抢占、复合操作只靠原子变量。<\/p>\n<h2>正向推导<\/h2>\n<h3>原子变量与总线锁定<\/h3>\n<p>普通自增在处理器内部分三步：从内存读值到寄存器、寄存器加 1、写回内存。两个核心同时读到旧值，各自加 1 写回，只增加一次。<code>LOCK<\/code> 前缀让处理器在执行主体指令期间锁定总线（或缓存一致性协议拦截），期间其他核心不能访问该内存单元；读改写写回作为一个整体完成，计数不丢更新。原子变量封装的就是这种带锁定的单变量操作。<\/p>\n<h3>自旋锁加锁/放锁路径<\/h3>\n<p>加锁：<\/p>\n<ol><li>\n读锁标志；空闲则写占用标志（该检查+置位本身需原子指令或总线锁定）。\n<\/li><li>\n<code>preempt_count++<\/code>，禁止抢占。\n<\/li><li>\n进入临界区；若标志忙，循环重读，不挂起。\n<\/li><li>\n清占用标志。\n<\/li><li>\n<code>preempt_count--<\/code>；计数归 0 才恢复抢占。\n<p>放锁：<\/p>\n<\/ol>\n<p><code>preempt_count<\/code> 用计数：进程持第一把锁计数 1，持第二把锁计数 2；放第一把计数 1，仍处禁止抢占态；放第二把计数 0 才放开。标志位做不到嵌套。<\/p>\n<h3>信号量 down/up 路径<\/h3>\n<p><code>down<\/code>：读资源计数；计数 &gt;0 则减 1 返回；计数 =0 则进程状态置不可中断，挂入信号量等待队列，调 <code>schedule<\/code> 让出处理器。<code>up<\/code>：计数加 1；扫描等待队列，唤醒一个（或若干）等待者，状态回就绪态。信号量保护的临界区可以跨多次调度，持锁期间进程被换出也不影响锁的归属——锁归属是信号量记录的资源计数，不是处理器。<\/p>\n<h3>关中断的位置<\/h3>\n<p>若共享数据同时被中断处理程序访问，仅禁止抢占不够：中断随时插入并进入临界区。此时加锁路径还要在本地关中断（保存 IF 后清 IF），放锁时恢复 IF。关抢占防的是同核调度换出，关中断防的是中断程序闯入；两者针对不同并发来源。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：双核计数竞争<\/h3>\n<p>核心 A、B 同时对计数 <code>cnt=0<\/code> 执行自增：<\/p>\n<ul><li>\n无保护：A 读 0，B 读 0；A 写 1，B 写 1；结果 1，丢一次更新。\n<\/li><li>\n原子 <code>lock incq<\/code>：总线锁定串行化两次自增；A 完成写 1 后 B 才读到 1，结果 2。\n<\/ul>\n<h3>算例 2：preempt_count 嵌套<\/h3>\n<p>进程先获锁 L1：<code>preempt_count 0→1<\/code>；再获锁 L2：<code>1→2<\/code>。临界区退出放 L2：<code>2→1<\/code>，仍禁抢占；放 L1：<code>1→0<\/code>，恢复抢占。若用标志位，放 L2 时标志清零，持 L1 期间就允许抢占，L1 临界区可被打断。<\/p>\n<h3>算例 3：信号量队列<\/h3>\n<p>资源计数 <code>sem=1<\/code>，进程 A 进入临界区计数变 0；B、C 先后 <code>down<\/code>：计数为 0，B 入队排队第 1，C 入队排队第 2，两进程让出处理器。A <code>up<\/code>：计数变 1，唤醒 B；B 减计数进入临界区。C 继续等待，直到下一次 <code>up<\/code>。<\/p>\n<h3>算例 4：中断上下文错用信号量<\/h3>\n<p>时钟中断处理程序里调用 <code>down<\/code>：计数为 0 时把&quot;当前被打断进程&quot;挂起入队并调度；中断返回点的现场属于那个进程，休眠实体与现场错位，且等待队列中的唤醒时机无法保证，处理器卡在中断路径。正确做法：中断内只用自旋锁（必要时本地关中断），可能休眠的操作推迟到进程态下半部。<\/p>\n<h2>延伸推演：死锁条件与更细粒度锁<\/h2>\n<p>死锁四个必要条件：互斥（锁一次只归一个）、持有并等待（持锁再申请新锁）、不可剥夺（锁不能被强行收回）、循环等待（A 等 B 持有的锁，B 等 A 持有的锁）。破坏任一条件可避免死锁：固定加锁顺序破除循环等待，限定持锁时长，避免持锁期间再申请第二把锁。<\/p>\n<p>读写锁把临界区分读者与写者：多个读者可并发持读锁，写者独占；适合读多写少场景。RCU 用延后释放替代读侧加锁，读者无锁访问，写者更新后等待旧读者退出再释放旧数据。本书基础实现以自旋锁/信号量/原子变量为主，这两类属于后续扩展。<\/p>\n<p>中断安全的自旋锁通常封装为&quot;关中断 + 禁抢占 + 忙等&quot;一体：加锁时保存当前 IF、清 IF、加锁；放锁时解锁、恢复 IF、减抢占计数。只在进程态访问的数据不需要关中断，只在中断态访问的数据不需要禁抢占，组合按共享来源定。<\/p>\n<h2>延伸推演：死锁破除、中断保存与锁粒度<\/h2>\n<h3>固定加锁顺序破除循环等待<\/h3>\n<p>多个锁共存时，所有代码按同一顺序申请（先锁 A 再锁 B），循环等待条件被破坏：不会出现 A 等 B、B 等 A 的闭环。若部分路径先 B 后 A，并发交错就可能死锁。代码评审要核对全局加锁顺序，释放顺序则与申请相反。<\/p>\n<h3>中断安全锁的保存语义<\/h3>\n<p>关中断加锁时，先保存当前 IF 到本地变量，再清 IF；放锁时按保存值恢复 IF，而不是直接置位。原因：持锁前可能已经处于关中断状态（如本身就在中断处理里），直接 <code>STI<\/code> 会错误地打开中断。自旋锁封装因此是&quot;保存 IF → 禁抢占 → 忙等&quot;，放锁逆序&quot;解锁 → 减抢占 → 恢复 IF&quot;。<\/p>\n<h3>复合操作为什么单变量原子不够<\/h3>\n<p>检查与修改分属两个变量：先读&quot;是否空闲&quot;再置&quot;占用&quot;，即使每个变量的读写都原子，两步之间另一核心可以插进来。临界区必须整段加锁；原子变量只适合计数器自增自减这类单条读改写。引用计数本身用原子操作，但对象&quot;最后一个引用者负责释放&quot;的判断+释放组合仍需锁或无锁结构保护。<\/p>\n<h3>读写锁轮廓<\/h3>\n<p>读多写少场景：读者共享读锁，写者独占。读者计数用原子变量，写者等待时新读者排队，避免写者饥饿。本书基础实现未提供读写锁；理解自旋锁与信号量后，读写锁是两者的组合变体。<\/p>\n<h3>锁粒度与持锁时长<\/h3>\n<p>粗粒度一把大锁保护整个数据结构，竞争简单但并发度低；细粒度拆成多把锁，并发度高但死锁与顺序约束增多。持锁时长应压缩到临界区必须的步骤内：不能持锁等待 I/O、不能持锁调用可能休眠的分配器。自旋锁尤其要求短持有，忙等成本随等待时长线性放大。<\/p>\n<h3>对抗性追问：信号量能不能当互斥锁用<\/h3>\n<p>计数初始 1 的信号量等价互斥锁，但等待者休眠，上下文切换成本高于自旋锁；适合临界区可能长的场景。中断上下文不能用。反过来自旋锁不能保护可能等待资源的临界区，否则持锁者休眠/被换出，等待者死等。选锁先判上下文，再判持锁时长。<\/p>\n<h2>第二算例与补充推演<\/h2>\n<h3>自旋锁加锁伪代码<\/h3>\n<pre><code>spin_lock(lock):\n    保存 IF，清 IF\n    preempt_count++\n    while 锁标志忙:  忙等\n    置锁标志占用\nspin_unlock(lock):\n    清锁标志占用\n    preempt_count--\n    若 preempt_count==0: 恢复 IF<\/code><\/pre>\n<p>忙等期间不调度、不睡眠；临界区代码不能调可能休眠的函数。<\/p>\n<h3>信号量 down/up 伪代码<\/h3>\n<pre><code>down(sem):\n    关本地抢占\n    if sem.count &gt; 0:\n        sem.count--; 开抢占; 返回\n    当前进程置不可中断状态\n    挂入 sem.wait_queue\n    schedule()  // 让出处理器\nup(sem):\n    关本地抢占\n    sem.count++\n    唤醒 wait_queue 中等待者\n    开抢占<\/code><\/pre>\n<p>等待者被唤醒后重新竞争计数，不一定立即拿到资源。<\/p>\n<h3>原子操作位级语义<\/h3>\n<p><code>lock incq<\/code> 不是给变量加软件锁，而是在指令执行期间通过总线锁定或缓存一致性协议独占该内存单元；其他核心的读改写被串行化。原子操作只覆盖单条指令，复合判断（if 空闲 then 占用）仍需自旋锁保护。<\/p>\n<p><code>LOCK<\/code> 前缀的底层实现分两种情况：操作数已在本地缓存且命中缓存行时，处理器凭借缓存一致性协议（如 MESI）把该行置为独占/修改态，阻止其他核心同时持有可写副本，本地完成读改写后再回写，全程不必对外锁总线；操作数未命中缓存、跨越缓存行对齐边界，或属于不可缓存的设备内存时，才通过总线锁定把相关地址空间锁住。原书按早期写法表述为锁住前端总线，本质目标都是保证这条读改写不被其他核心穿插。判定原子性看指令是否不可分割，不看底层究竟锁的是缓存行还是总线。<\/p>\n<h3>并发场景清单<\/h3>\n<ul><li>\n多核同时改链表：节点指针交错，需自旋锁保护链表操作。\n<\/li><li>\n中断与进程态共享数据：进程态持锁同时本地关中断，防止中断程序闯入。\n<\/li><li>\n多进程等待同一资源：信号量计数 + 等待队列管理排队。\n<\/li><li>\n引用计数增减：原子变量；最后引用者释放对象的判断组合另需保护。\n<\/ul>\n<h3>补充推演：锁与调度的衔接<\/h3>\n<p>信号量等待调 <code>schedule<\/code> 让出处理器，属于进程上下文行为；自旋锁忙等期间 <code>preempt_count&gt;0<\/code>，调度器不会把当前进程换出。中断上下文里 <code>preempt_count<\/code> 与等待队列机制不适用，因此只能自旋。锁持有时长估算：短于一次上下文切换成本用自旋，长于或可能等待 I/O 用信号量。<\/p>\n<h3>补充：锁使用的调试要点<\/h3>\n<p>死锁现场通常表现为两个或多个核心/进程卡在锁忙等循环，调度无法推进。排查顺序：列出持锁者与等待者，核对加锁顺序是否一致，检查持锁临界区内是否调用了可能休眠的函数，确认中断上下文是否误用信号量。<code>preempt_count<\/code> 不为 0 时调度被禁止，持锁者被换出的概率消失；若计数与实际持锁层数不一致，放锁后抢占状态会错乱。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n<code>LOCK<\/code> 前缀解决什么？（单条读改写指令的原子性；缓存命中时锁缓存行，否则才锁总线。）\n<\/li><li>\n自旋锁等待者处于什么状态？（忙循环，不挂起不睡眠。）\n<\/li><li>\n信号量计数为 0 时等待者去哪？（置不可中断状态入等待队列，让出处理器。）\n<\/li><li>\n中断上下文为什么不能用信号量？（没有可挂起的进程实体，休眠后无法被调度唤醒。）\n<\/li><li>\n<code>preempt_count<\/code> 为什么用计数不用标志位？（支持嵌套持锁，逐层加减。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "自旋锁、信号量与原子变量（何时用哪个、是否关中断）"}, "c10": {"html": "<div class=\"source-badge\">📖 出处：一个64位操作系统的设计与实现.pdf · p.309<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">四级页表与虚拟地址拆解：从线性地址到物理地址<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">内核对象与 PCB：进程资源的结构化组织<\/a><\/span><\/div><h1>物理页框分配与 slab 分配器（内碎片怎么产生）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3 章（原书第 9 章 9.1 SLAB 内存池概述、9.2 kmalloc/kfree、9.3 物理页管理、9.4 页表初始化）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>内核既要按整页管理物理内存（页表、内核栈、大块缓冲），又要频繁申请释放几十到几百字节的小对象（PCB、等待队列项、文件控制块）。直接按页分配小对象会浪费整页，直接按字节分配又会产生大量碎片与重复初始化开销。分配器分两层：底层页框分配整页，上层 slab 在页内按固定尺寸对象复用，回答两层各管什么、对象怎样在页内组织、内碎片从哪一段产生。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>物理页框<\/strong>：物理内存按固定大小页划分，本书 <code>struct Page<\/code> 记录页属性、引用计数、所属内存区、线性地址等；<code>alloc_pages<\/code> 申请页框，<code>free_pages<\/code> 释放页框（原书 9.3 节，PDF 第 323 页前后）。<\/p>\n<p><strong>slab 两层结构<\/strong>：<\/p>\n<ul><li>\n<code>struct Slab_cache<\/code>（内存池）：按对象尺寸/类型分池，记录对象尺寸、构造函数与析构函数钩子、指向各 <code>Slab<\/code> 的链表。\n<\/li><li>\n<code>struct Slab<\/code>（单个物理页内的对象管理）：记录所属 <code>Page<\/code>、线性地址 <code>Vaddress<\/code>、已用对象数 <code>using_count<\/code>、空闲对象数 <code>free_count<\/code>、颜色位图 <code>color_map<\/code>（每位对应页内一个对象，1 占用 0 空闲）（原书 9.1 节，PDF 第 309–310 页）。\n<\/ul>\n<p><strong>尺寸档位<\/strong>：本书通用内存池 <code>kmalloc_cache_size[16]<\/code> 预置 32B、64B、128B 等档位；32B–512B 为小对象区间，1KB–1MB 为大对象区间（原书 9.2.1、9.2.2 节，PDF 第 319、327 页）。<\/p>\n<p><strong>分配与回收<\/strong>：<code>kmalloc<\/code> 先对齐到最近尺寸档，在对应池找有空闲对象的 <code>Slab<\/code>；无空闲则 <code>alloc_pages<\/code> 申请新页框，布置位图与对象；回收时调析构钩子、清位图位；整页空闲时释放回页框分配器（PDF 第 314、317 页）。<\/p>\n<p><strong>内碎片来源<\/strong>：对象对齐到档位后，对象末尾到下一个对象起始之间的字节无法分给同页其他对象；页内最后一个对象之后、<code>Slab<\/code> 结构与位图之前的剩余空间也是碎片。<\/p>\n<h2>执行推导与推演<\/h2>\n<p>申请 40B：对齐到 64B 档，进入对应 <code>Slab_cache<\/code>；遍历 <code>Slab<\/code> 链表找 <code>free_count &gt; 0<\/code> 的页；位图扫描第一个 0 位，标记 1，<code>using_count++<\/code>、<code>free_count--<\/code>；调构造钩子初始化对象，返回线性地址。<\/p>\n<p>无空闲页：<code>alloc_pages(ZONE_NORMAL, 1, 0)<\/code> 申请一个页框；填 <code>Page<\/code> 属性；页尾布置 <code>struct Slab<\/code> 与 <code>color_map<\/code>；按 <code>页大小 / 对象尺寸<\/code> 算可容纳对象数，位图全部置 0；把新 <code>Slab<\/code> 挂入池链表。<\/p>\n<p>回收对象：调析构钩子清内容，位图对应位清 0，<code>using_count--<\/code>、<code>free_count++<\/code>；若整页 <code>using_count=0<\/code> 且池储备充足，<code>free_pages<\/code> 归还页框，摘除 <code>Slab<\/code>。<\/p>\n<p>大对象路径：尺寸超过小对象档时按整页/多页组织；本书把大对象的 <code>struct Slab<\/code> 移出物理页另行分配，避免管理结构占页内空间（PDF 第 327 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：对象尺寸可归入固定档位；同类对象反复申请释放；构造/析构可复用初始化状态。\n<\/li><li>\n失败案例：每次申请尺寸都不同且不归类，slab 池数量膨胀；对象大小接近档位上限时内碎片占比升高；回收不清位图，空闲数只减不增，池子耗尽；跨大小对象混用同一池，位图按错误尺寸切分越界。\n<\/li><li>\n边界：slab 解决小对象分配与复用，不负责把页换入换出；大块连续物理内存的申请可能受碎片限制，需页框回收与规整机制补充。本书页表初始化在物理内存布局探明后建立恒等映射（原书 9.4 节，PDF 第 331 页前后）。\n<\/li><li>\n外碎片与内碎片不同：外碎片是空闲页之间不连续、大块申请找不到连续页；内碎片是分配单元内部未用空间。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>页框分配 vs slab 分配<\/strong>：页框分配按整页粒度，服务大块与页表；slab 在页框之上按固定对象粒度切分，服务小对象。slab 申请页框来自页框分配器。\n<\/li><li>\n<strong>内碎片 vs 外碎片<\/strong>：内碎片在分配单元内部，对齐档位产生；外碎片在页框之间，离散空闲产生。\n<\/li><li>\n<strong>Slab_cache vs Slab<\/strong>：Cache 是一类对象的池，跨多个物理页；Slab 是单个页内的对象数组与位图。\n<\/li><li>\n<strong>位图 vs 空闲链表<\/strong>：本书用颜色位图记录占用；位图省空间、扫描找空闲位；空闲链表直接串起空闲对象，分配更快但要占对象空间存链指针。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c03 的页表把物理页映射到内核线性地址；概念 c08 的 PCB、线程结构由 slab/页框分配。后继：概念 c11 文件系统缓冲区、目录项缓存依赖内核内存；概念 c12 系统调用处理函数使用的临时对象走同一分配器。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（物理页框分配与 slab 分配器（内碎片怎么产生））<\/summary><div class=\"depth-body\"><h1>c10 深度推导：两层分配结构、位图数学与碎片算账<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清分配器为什么分两层，往回追五层前提：<\/p>\n<ol><li>\n物理内存使用粒度分两类：页表/大块缓冲按整页要；PCB/队列项等小对象按几十到几百字节要。\n<\/li><li>\n反复申请释放同类小对象：每次从零初始化对象、再把整页归还，重复成本高；池化复用可保留构造好的对象。\n<\/li><li>\n页内组织需要记录每个对象占用状态：位图或空闲链表给出分配与回收依据。\n<\/li><li>\n分配单元有最小粒度：对象尺寸对齐到档位，档位与页大小决定对象数与碎片量。\n<\/li><li>\n内存分区与线性映射先成立：页框要能被内核按线性地址访问，分配出的页才可用（c03 页表、9.4 节页表初始化）。\n<\/ol>\n<p>依赖链方向：页框分配器提供整页 → slab 池在页内切固定对象 → 位图记录占用 → 分配复用/回收复位 → 整页空闲归还页框。层间关系：slab 向上给 <code>kmalloc<\/code>，向下调 <code>alloc_pages/free_pages<\/code>。<\/p>\n<h2>正向推导<\/h2>\n<h3>页框层<\/h3>\n<p><code>struct Page<\/code> 描述一个物理页：属性标志、引用计数、所属内存区、内核线性地址。<code>alloc_pages(zone, order, flags)<\/code> 申请 <code>2^order<\/code> 个连续页框；<code>free_pages<\/code> 释放。页框层负责连续页申请、引用计数与回收，不关心页内怎么切。<\/p>\n<h3>slab 池层<\/h3>\n<p><code>Slab_cache<\/code> 按对象尺寸与类型建池：对象大小、构造钩子、析构钩子、Slab 链表。每个 <code>Slab<\/code> 对应一个页框：<\/p>\n<ul><li>\n<code>Vaddress<\/code>：页内对象起始线性地址；\n<\/li><li>\n<code>using_count<\/code>：已用对象数；\n<\/li><li>\n<code>free_count<\/code>：空闲对象数；\n<\/li><li>\n<code>color_map<\/code>：位图，每对象一位。\n<\/ul>\n<p>页内对象数 <span class=\"katex-inline\">N = \\lfloor (\\text{页大小} - \\text{Slab 管理结构与位图字节}) / \\text{对象尺寸} \\rfloor<\/span>。分配时位图找第一个 0 位，对象地址 = <code>Vaddress + 位序号 × 对象尺寸<\/code>。<\/p>\n<h3>尺寸对齐与档位<\/h3>\n<p>申请尺寸 <span class=\"katex-inline\">s<\/span> 向上对齐到档位表中第一个 <span class=\"katex-inline\">\\ge s<\/span> 的档位。对齐后单对象占用档位大小；<span class=\"katex-inline\">s<\/span> 与档位之差就是单对象内碎片。小对象档覆盖 32B–512B，大对象档覆盖 1KB–1MB；大对象的管理结构移出页外，避免占页内空间。<\/p>\n<h3>回收与整页归还<\/h3>\n<p>回收执行析构钩子复位对象，清位图位，计数更新。<code>using_count<\/code> 归 0 的页可归还页框分配器；池保留一定空闲页储备，避免刚归还又立刻申请。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：2MB 页内 64B 对象<\/h3>\n<p>页大小 2MB = <code>2×1024×1024 = 2097152<\/code> B；对象档 64B。<\/p>\n<ul><li>\n理想对象数 = <code>2097152 / 64 = 32768<\/code> 个。\n<\/li><li>\n若实际申请对象 40B，按 64B 占用：单对象内碎片 = <code>64 - 40 = 24<\/code> B。\n<\/li><li>\n全页内碎片总量（不管理结构占用）≈ <code>32768 × 24 = 786432<\/code> B ≈ 768KB，占页大小约 37.5%。\n<\/li><li>\n位图占用：32768 位 = <code>32768/8 = 4096<\/code> B，位于页尾管理区，不再分给对象。\n<\/ul>\n<h3>算例 2：4KB 页内 128B 对象<\/h3>\n<p>页大小 4096B；对象 128B。<\/p>\n<ul><li>\n对象数 = <code>4096/128 = 32<\/code> 个。\n<\/li><li>\n申请 100B：对齐到 128B 档，单对象碎片 28B；全页碎片 <code>32×28 = 896<\/code> B。\n<\/li><li>\n若申请 129B：对齐到 256B 档，单对象碎片 127B；4KB 页内对象数 <code>4096/256 = 16<\/code>，全页碎片 <code>16×127 = 2032<\/code> B，接近半页。档位跨越越大，碎片跳升越明显。\n<\/ul>\n<h3>算例 3：位图定位对象<\/h3>\n<p>某 Slab <code>Vaddress = 0xFFFF_8000_0030_0000<\/code>，对象 64B，位图第一个空闲位序号 5。<\/p>\n<ul><li>\n对象地址 = <code>0x300000 + 5×64 = 0x300000 + 0x140 = 0x300140<\/code>。\n<\/li><li>\n分配后位图第 5 位置 1，<code>using_count=6<\/code>，<code>free_count=N-6<\/code>。\n<\/li><li>\n回收该对象：位图第 5 位清 0，析构钩子执行，计数回退。\n<\/ul>\n<h3>算例 4：大对象管理结构外置<\/h3>\n<p>申请 512KB 对象：超过小对象档，按整页/多页组织。若 <code>struct Slab<\/code> 仍放页尾，512KB 对象页只剩少量空间给管理结构；本书把大对象的 Slab 结构移出物理页另行分配，页内只放对象本体，管理元数据走独立小对象分配。<\/p>\n<h2>延伸推演：着色、分区与分配器演化<\/h2>\n<p>slab 着色（coloring）解决多页对象地址冲突：同一尺寸对象在不同页内起始位置错开不同偏移，避免多个对象映射到同一缓存行，降低 CPU 缓存争用。本书 <code>color_map<\/code> 名称对应颜色位图概念，基础实现重点在占用记录。<\/p>\n<p>内存区（zone）按地址范围与用途划分：常规内存区 <code>ZONE_NORMAL<\/code> 可直接映射，DMA 区供早期设备寻址。页框申请带 zone 参数，保证关键设备能拿到对应区域的页。<\/p>\n<p>后继分配器 SLUB 简化了 slab 元数据，把空闲指针嵌入对象；SLABOB 面向嵌入式小内存。三者核心不变：页框层整页管理，上层按尺寸池化复用。外碎片规整靠页合并、页回收与内存规整；内碎片靠档位设计压缩，两者手段不同。<\/p>\n<h2>延伸推演：伙伴系统、分区与分配器边界<\/h2>\n<h3>页框层的伙伴合并<\/h3>\n<p>连续空闲页按 2 的幂分组：申请 order 页找不到时拆高一档空闲页；释放时检查相邻&quot;伙伴&quot;页是否空闲，是则合并成高一档页。伙伴系统解决外碎片：大块申请能找到连续页，回收时合并相邻空闲页。本书 <code>alloc_pages/free_pages<\/code> 接口对应这一层，具体伙伴算法实现按内核算例展开。<\/p>\n<h3>内存区划分<\/h3>\n<p>物理内存按用途分区：DMA 区供早期设备寻址，常规内存区 <code>ZONE_NORMAL<\/code> 可直接内核映射，高端内存区处理超过直接映射范围的内存。申请页框带 zone 参数，保证关键设备拿到对应区域。内核线性映射把物理页连续映射到一段内核地址，<code>struct Page<\/code> 的线性地址字段即由此来。<\/p>\n<h3>slab 构造钩子与热对象<\/h3>\n<p><code>Slab_cache<\/code> 可挂构造函数：新页框切出对象时先构造初始化；析构函数在对象回收时复位状态。反复申请释放同一类对象（如 PCB、队列项）时，对象保留初始化状态复用，省去重复建造成本。对象在 slab 间冷热迁移：满页、半空页、空闲页分链管理，分配优先用半空页。<\/p>\n<h3>着色的作用<\/h3>\n<p>同一尺寸对象在不同页内起始偏移错开，避免多个对象落在同一 CPU 缓存行互相挤掉。<code>color_map<\/code> 记录占用位图，颜色值决定页内起始偏移。本书基础实现重点在位图与计数，着色策略属正式优化项。<\/p>\n<h3>kmalloc 与大块分配<\/h3>\n<p><code>kmalloc<\/code> 走 slab 小对象/大对象档；超过档位范围的大块连续内存走页框分配器按整页申请。vmalloc 类接口可映射不连续物理页到连续虚拟地址，适合大缓冲但物理不连续。页表本身、内核栈、进程 PCB 分别来自页框层与 slab 层，选型按对象大小与生命周期。<\/p>\n<h3>对抗性追问：所有小对象都从 slab 申请有没有代价<\/h3>\n<p>slab 池按尺寸分档，申请尺寸归不到现有档位就要建新池；对象尺寸杂乱时池子数量膨胀，每个池保留空闲页储备，占用额外内存。生命周期极短的大对象走 slab 还要付管理结构开销。分配器选型按对象大小、寿命、复用频率综合判断，不是一律走 slab。<\/p>\n<h2>第二算例与补充推演<\/h2>\n<h3>页框编号与线性地址<\/h3>\n<p>物理页帧号 <code>pfn = 物理地址 &gt;&gt; 12<\/code>（4KB 页）。<code>struct Page<\/code> 按物理页索引排列，记录引用计数、标志、所属 zone、内核线性地址。直接映射区内，线性地址 = 物理地址 + 映射偏移；alloc_pages 返回页框后，经线性地址才能被内核代码访问。<\/p>\n<h3>slab 对象头与空闲链表<\/h3>\n<p>对象在页内按固定尺寸排列；空闲对象可在对象头部存空闲链表指针，分配时弹出链表首项；本书基础实现用颜色位图记录占用，位图每位对应一个对象。对象尺寸越小，位图开销占比越低；大对象位图很短，管理结构移到页外。<\/p>\n<h3>尺寸档位对照思路<\/h3>\n<p>申请 <span class=\"katex-inline\">s<\/span>：在档位表找第一个 <span class=\"katex-inline\">\\ge s<\/span> 的档；<span class=\"katex-inline\">s \\le 512<\/span> 走小对象池，<span class=\"katex-inline\">1\\text{KB}–1\\text{MB}<\/span> 走大对象档，超过范围走页框分配。档位间隔按 2 的幂递增：32、64、128、256、512……相邻档位之间的申请都对齐到上一档，这部分差值即内碎片。<\/p>\n<h3>分配与回收完整路径<\/h3>\n<pre><code>kmalloc(size):\n    对齐到档位 → 找对应 Slab_cache\n    在 cache 的 Slab 链找 free_count&gt;0 的页\n    无空闲页: alloc_pages 申请页框, 建 Slab 与位图\n    位图找空闲位 → 构造钩子 → 返回对象地址\nkfree(obj):\n    析构钩子 → 清位图位 → 计数更新\n    整页空闲且储备充足: free_pages 归还<\/code><\/pre>\n<h3>补充推演：碎片两类与回收方向<\/h3>\n<p>内碎片：分配单元内部未用空间，靠档位设计压缩；外碎片：空闲页离散不连续，大块申请找不到连续页，靠伙伴合并与页规整解决。slab 池长期保留空闲页储备，避免反复申请归还页框；储备过多占用内存，过少则分配延迟升高，池大小按负载调整。<\/p>\n<h3>补充：页框储备与回收策略<\/h3>\n<p>slab 池为每类对象保留若干空闲页：分配时优先用半空页，空闲页不足才向页框层申请；回收时整页空闲的页不立即归还，留作储备应对突发分配。储备过高浪费内存，储备过低则申请新页框的延迟升高。页框层回收长时间未用的页框，归还伙伴系统；slab 缓存的热对象因构造成本高，回收策略比普通页框更保守。<\/p>\n<h3>补充：对象尺寸与页内布局算例<\/h3>\n<p>4KB 页、对象档 128B：理想对象数 <code>4096/128=32<\/code>；页尾放 <code>struct Slab<\/code> 与位图，位图 32 位 = 4B，对象区可用空间略小于整页，实际对象数按减去管理结构后计算。对象档 32B：4KB 页理想 128 个对象，位图 128 位 = 16B；对象越小，位图与管理结构占比越低，页内复用率越高。管理结构占用与对象尺寸的比例，是 slab 池设计时要核算的一项。<\/p>\n<h3>补充：内核内存与用户内存的分配差异<\/h3>\n<p>内核对象（PCB、页表、队列项）生命周期与系统运行一致，走 slab/页框长期持有；用户动态内存经系统调用走内核分配器，再映射到用户地址空间。分配器不区分调用者身份，只按尺寸与区选择路径；释放时按对象所在池或页框归还，不能跨池混用释放函数。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n页框层和 slab 层各服务什么粒度？（整页大块；页内固定小对象。）\n<\/li><li>\n内碎片在哪一段？（对象末尾到下一个对象起始，及页尾管理区前剩余空间。）\n<\/li><li>\n位图第 k 位对象地址怎么算？（<code>Vaddress + k × 对象尺寸<\/code>。）\n<\/li><li>\n申请 100B 落哪一档？碎片多少？（128B 档，单对象碎片 28B。）\n<\/li><li>\n整页什么时候归还页框分配器？（<code>using_count<\/code> 归 0 且池储备充足时。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "物理页框分配与 slab 分配器（内碎片怎么产生）"}, "c11": {"html": "<div class=\"source-badge\">📖 出处：一个64位操作系统的设计与实现.pdf · p.529<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c10\">物理页框分配与 slab 分配器（内碎片怎么产生）<\/a><\/span><\/div><h1>FAT32 目录项与簇链寻址（目录项、FAT 链、簇号算扇区）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书第 13 章 13.2 FAT32 文件系统简介、目录项结构、簇链定位）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>磁盘上的文件字节不保证连续存放，操作系统必须在分区里记下：每个文件/目录叫什么、占哪些簇、簇之间什么顺序。FAT32 用引导扇区参数定位各区域，用 32B 目录项记录起始簇号与文件大小，用 FAT 表把簇串成链。这个概念回答 BPB 各字段干什么用、目录项里起始簇号怎么拼、簇号怎样换算成扇区号、沿链遍历一次文件要多少次访问。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>分区四部分<\/strong>（原书 13.2.2 节，PDF 第 529、536 页）：<\/p>\n<ul><li>\n引导扇区/保留区：存 BPB 参数与引导代码；\n<\/li><li>\nFAT 表：每项 32 位，记录簇链下一簇号与结束标志；\n<\/li><li>\n根目录区：根目录目录项所在簇；\n<\/li><li>\n数据区：文件与子目录簇的实际存放区域。\n<\/ul>\n<p><strong>BPB 关键字段<\/strong>（本书实例，PDF 第 536 页表 13-8）：<code>BPB_BytesPerSec=512<\/code>（每扇区字节）、<code>BPB_SecPerClus=8<\/code>（每簇扇区数，簇大小 4096B）、<code>BPB_RsvdSecCnt=36<\/code>（保留扇区数）、<code>BPB_NumFATs=2<\/code>（FAT 份数）、<code>BPB_FATSz32=2050<\/code>（每 FAT 扇区数）、<code>BPB_RootClus=2<\/code>（根目录起始簇号）、<code>BPB_HiddSec=2048<\/code>（隐藏扇区；下文扇区号相对分区起点，绝对 LBA 再加此值）、<code>BPB_TotSec32=2103296<\/code>（总扇区数）。<\/p>\n<p><strong>短目录项（32B）字段<\/strong>：<code>DIR_Name<\/code>（11 字节文件名/扩展名）、<code>DIR_Attr<\/code>（属性）、创建/访问/修改时间与日期、<code>DIR_FstClusHI<\/code>（起始簇号高 16 位）、<code>DIR_FstClusLO<\/code>（起始簇号低 16 位）、<code>DIR_FileSize<\/code>（文件大小）（原书 13.2 节，PDF 第 532–533 页）。<\/p>\n<p><strong>FAT 表项<\/strong>：32 位，低 28 位有效；0、1 号簇保留不用，2 号簇是根目录；表值为下一簇号，达到 <code>0x0FFFFFF8h<\/code> 一类结束标志表示链尾（PDF 第 531、538 页）。长文件名由一组连续长目录项加一个短目录项组成，短目录项带校验和（PDF 第 533、543 页）。<\/p>\n<p><strong>簇号算扇区<\/strong>：数据区起始扇区 <span class=\"katex-inline\">D_{\\text{data}}<\/span> 确定后，簇 <span class=\"katex-inline\">c<\/span> 起始扇区<\/p>\n<div class=\"katex-block\">\\text{Sector}(c) = D_{\\text{data}} + (c - 2) \\times S_{\\text{PerClus}}<\/div>\n<p>FAT 表项定位：簇 <span class=\"katex-inline\">c<\/span> 的表项位于 FAT 区内偏移 <span class=\"katex-inline\">c \\times 4<\/span> 字节处（FAT32 每项 4B）。<\/p>\n<h2>执行推导与推演<\/h2>\n<p>算例以分区起点为 0（<span class=\"katex-inline\">H=0<\/span>）：FAT1 起始 = <code>0 + 36 = 36<\/code>；FAT2 起始 = <code>36 + 2050 = 2086<\/code>；数据区起始 <span class=\"katex-inline\">D_{\\text{data}} = 2086 + 2050 = 4136<\/span>。<\/p>\n<p>根目录在 2 号簇：<code>Sector(2)=4136<\/code>。书中子目录实例起始簇 <code>0x0003<\/code>（PDF 第 542 页）：<code>Sector(3)=4144<\/code>；簇 10：<code>Sector(10)=4200<\/code>。4136/4144/4200 均为分区相对扇区号；绝对 LBA = 相对扇区 + 2048，如 2 号簇为 6184。<\/p>\n<p>打开文件路径：读根目录簇 → 遍历 32B 目录项比对文件名 → 取 <code>FstClusHI/FstClusLO<\/code> 拼成起始簇号 → 按上式算首簇扇区读数据 → 查 FAT 表项取下一簇号 → 重复直到结束标志。文件大小决定末簇读取字节数，不必整簇读完。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：BPB 参数可读；目录项起始簇号在有效簇范围内；FAT 表两份内容一致；簇链未断裂。\n<\/li><li>\n失败案例：只取低 16 位簇号，大于 <code>0xFFFF<\/code> 的簇号高位丢失，扇区算错；把簇号当扇区号直接寻址，跳过 <code>(c-2)×SecPerClus<\/code> 换算；不沿 FAT 链访问，假设文件簇号连续递增；FAT 表项损坏导致链环指向已回收簇。\n<\/li><li>\n边界：FAT32 按簇分配，文件小于一簇也占整簇；短名 11 字节，长名靠长目录项补充。本书后续在 FAT32 之上实现 VFS 抽象层（PDF 第 552 页起）。本例簇大小 8×512B=4KB；簇越大内碎片越多，链访问次数越少。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>目录项 vs FAT 表项<\/strong>：目录项记录文件元数据与起始簇；FAT 表项记录簇链顺序。找文件先读目录项拿起始簇，再查 FAT 找后续簇。\n<\/li><li>\n<strong>簇 vs 扇区<\/strong>：扇区是磁盘最小传输单位（512B）；簇是文件分配单位，由若干扇区组成。读写命令按扇区发，分配按簇计。\n<\/li><li>\n<strong>短目录项 vs 长目录项<\/strong>：短目录项存 8.3 格式名与起始簇、大小；长目录项拆存长文件名，与短项共享校验和。\n<\/li><li>\n<strong>根目录 vs 子目录<\/strong>：FAT32 根目录本身是 2 号簇，可像子目录一样扩展；子目录目录项里 <code>.<\/code> 指向自身簇号，<code>..<\/code> 指向父目录簇号（PDF 第 542 页）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c10 的内存分配器提供目录项缓冲与读簇缓冲区；概念 c09 的锁保护 FAT 表与目录项并发访问。后继：概念 c12 系统调用 <code>open/read/write<\/code> 最终落到本章的目录项检索与簇链读取；块设备驱动把簇号扇区翻译成 ATA 读扇区命令。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（FAT32 目录项与簇链寻址（目录项、FAT 链、簇号算扇区））<\/summary><div class=\"depth-body\"><h1>c11 深度推导：区域定位、目录项拆解与簇链遍历复杂度<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要从路径名走到磁盘扇区，往回追五层前提：<\/p>\n<ol><li>\n分区布局先由 BPB 确定：每扇区字节、每簇扇区数、保留扇区、FAT 份数与大小、根目录簇号；没有这些参数，任何扇区位置都算不出。\n<\/li><li>\n区域顺序先固定：保留区 → FAT1 → FAT2 → 数据区；根目录簇在数据区起始位置。\n<\/li><li>\n目录项格式先固定：32B 一项，起始簇号拆高低两段；文件名比对、属性、大小各占固定偏移。\n<\/li><li>\n簇链规则先固定：FAT 表项指向下一簇，结束标志收尾；0、1 保留，2 是根目录。\n<\/li><li>\n块设备读扇区能力先就位：驱动能按 LBA 扇区号发 ATA 命令（c11 与第 11 章驱动衔接）。\n<\/ol>\n<p>依赖链方向：读 BPB → 算各区域扇区 → 读目录项定位起始簇 → FAT 表逐项取后继簇 → 簇号换算扇区 → 发读扇区命令。链条上任何一段参数读错，扇区落到错误位置。<\/p>\n<h2>正向推导<\/h2>\n<h3>区域扇区定位<\/h3>\n<p>设隐藏扇区 <span class=\"katex-inline\">H<\/span>、保留扇区 <span class=\"katex-inline\">R<\/span>、FAT 份数 <span class=\"katex-inline\">F<\/span>、每 FAT 扇区数 <span class=\"katex-inline\">Z<\/span>：<\/p>\n<div class=\"katex-block\">\\text{FAT1}_{\\text{start}} = H + R<\/div>\n<div class=\"katex-block\">\\text{FAT2}_{\\text{start}} = \\text{FAT1}_{\\text{start}} + Z<\/div>\n<div class=\"katex-block\">D_{\\text{data}} = \\text{FAT2}_{\\text{start}} + Z = H + R + 2Z<\/div>\n<p>（<span class=\"katex-inline\">F=2<\/span> 时；<span class=\"katex-inline\">F<\/span> 份 FAT 时数据区再后移 <span class=\"katex-inline\">(F-2)Z<\/span>。）<\/p>\n<h3>目录项拆解<\/h3>\n<p>目录区按 32B 一项遍历：第 0–10 字节文件名，第 11 字节属性；起始簇号高字在 <code>DIR_FstClusHI<\/code>，低字在 <code>DIR_FstClusLO<\/code>，拼成<\/p>\n<div class=\"katex-block\">\\text{cluster} = (\\text{HI} \\ll 16) \\,|\\, \\text{LO}<\/div>\n<p>文件大小在 <code>DIR_FileSize<\/code>。属性字节区分普通文件、只读、隐藏、系统、卷标、目录、归档；目录项首字节 <code>0xE5<\/code> 表示已删除，<code>0x00<\/code> 表示目录区结束。<\/p>\n<h3>簇链遍历<\/h3>\n<p>起始簇 <span class=\"katex-inline\">c_0<\/span> 来自目录项；循环：<\/p>\n<ol><li>\n算 <span class=\"katex-inline\">\\text{Sector}(c) = D_{\\text{data}} + (c-2) \\times S_{\\text{PerClus}}<\/span>；\n<\/li><li>\n读该簇扇区；\n<\/li><li>\n查 FAT 项：表内偏移 <span class=\"katex-inline\">c \\times 4<\/span>，取低 28 位；\n<\/li><li>\n是结束标志则停；否则 <span class=\"katex-inline\">c \\leftarrow<\/span> 表值，继续。\n<\/ol>\n<p>文件最后一簇按 <code>FileSize<\/code> 对簇大小取余决定实际读取字节数。<\/p>\n<h3>复杂度<\/h3>\n<p><span class=\"katex-inline\">n<\/span> 簇文件：目录项检索 <span class=\"katex-inline\">O(\\text{目录项数})<\/span>；链遍历每簇一次 FAT 查表 + 一次簇读，<span class=\"katex-inline\">O(n)<\/span> 次设备访问。文件连续时寻道少；碎片化后每簇可能分散，机械硬盘寻道时间成为主导。FAT 链无法随机跳到第 <span class=\"katex-inline\">k<\/span> 簇，必须从头沿链走，这是 FAT 相对于索引式文件系统的固有短板。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：区域与簇扇区（<span class=\"katex-inline\">H=0<\/span>，<span class=\"katex-inline\">R=36<\/span>，<span class=\"katex-inline\">Z=2050<\/span>，<span class=\"katex-inline\">S_{\\text{PerClus}}=8<\/span>；扇区号相对分区起点，带隐藏扇区 <span class=\"katex-inline\">H<\/span> 时整体加 <span class=\"katex-inline\">H<\/span>）<\/h3>\n<ul><li>\nFAT1 起始 = <code>0 + 36 = 36<\/code>。\n<\/li><li>\nFAT2 起始 = <code>36 + 2050 = 2086<\/code>。\n<\/li><li>\n数据区起始 <span class=\"katex-inline\">D_{\\text{data}} = 2086 + 2050 = 4136<\/span>。\n<\/li><li>\n簇 2（根目录）：<code>4136 + 0×8 = 4136<\/code>。\n<\/li><li>\n簇 3（书中子目录实例，PDF 第 542 页）：<code>4136 + 1×8 = 4144<\/code>。\n<\/li><li>\n簇 10：<code>4136 + 8×8 = 4200<\/code>。\n<\/li><li>\n簇大小 = <code>8 × 512 = 4096<\/code> B。\n<\/ul>\n<h3>算例 1b：带隐藏扇区 H 的绝对 LBA<\/h3>\n<p>取本书实例 <code>HiddSec=2048<\/code>：相对分区起点的扇区先按上节算出，绝对 LBA 整体加 <span class=\"katex-inline\">H<\/span>。FAT1 绝对起始 = <code>2048+36=2084<\/code>；FAT2 = <code>2048+2086=4134<\/code>；数据区 <span class=\"katex-inline\">D_{\\text{data}}<\/span> 绝对起始 = <code>2048+4136=6184<\/code>。簇 2 绝对 LBA = <code>6184<\/code>；簇 3 = <code>6192<\/code>；簇 10 = <code>6248<\/code>。下发磁盘读写命令的是绝对 LBA；驱动层把分区相对扇区加上分区引导扇区的 LBA 后才交给设备，二者相差的正是隐藏扇区数。<\/p>\n<h3>算例 2：FAT 表项偏移<\/h3>\n<p>簇 3 的 FAT 项位于 FAT1 内偏移 <code>3 × 4 = 12<\/code> 字节，扇区位置 = <code>FAT1_start + 12/512<\/code>（偏移未跨扇区时同扇区）。读 32 位表值，低 28 位为后继簇号；若值 = <code>0x0FFFFFF8<\/code> 则链尾。<\/p>\n<h3>算例 3：起始簇号拼装<\/h3>\n<p>目录项 <code>DIR_FstClusHI = 0x0001<\/code>，<code>DIR_FstClusLO = 0x002A<\/code>：<\/p>\n<ul><li>\ncluster = <code>(0x0001 &lt;&lt; 16) | 0x002A = 0x0001002A = 65578<\/code>。\n<\/li><li>\n若只取低字：<code>0x002A = 42<\/code>，扇区按簇 42 算，落到错误位置。\n<\/li><li>\n该簇扇区 = <code>4136 + (65578-2)×8 = 4136 + 524608 = 528744<\/code>（超总扇区范围则说明簇号非法）。\n<\/ul>\n<h3>算例 4：末簇部分读取<\/h3>\n<p>文件大小 <code>FileSize = 5000B<\/code>，簇大小 4096B：<\/p>\n<ul><li>\n占簇数 = <code>ceil(5000/4096) = 2<\/code> 簇；\n<\/li><li>\n末簇有效字节 = <code>5000 - 4096 = 904B<\/code>；\n<\/li><li>\n读末簇只取前 904B，其余 3192B 是簇内未用空间。\n<\/ul>\n<h2>延伸推演：FAT 双份与 VFS 抽象<\/h2>\n<p>FAT 表存两份（<code>NumFATs=2<\/code>）：一份损坏时可用另一份恢复链结构；正常访问以 FAT1 为准，两份需保持一致。写文件更新簇链时，两份 FAT 都要同步修改，否则断电后链状态不一致。目录项记录的文件大小与 FAT 链占用簇数应相互印证：大小除以簇大小向上取整等于簇数，偏差说明链或目录项有损坏。<\/p>\n<p>VFS 层在 FAT32 之上抽象出统一的文件操作接口：打开、读、写、目录检索不直接暴露 FAT 细节，底层可以换 EXT2、内存文件系统等。本书 13.3 节实现 VFS 抽象（PDF 第 552 页起）：上层系统调用（c12）面向 VFS 接口，VFS 再分派到具体文件系统实现。<\/p>\n<p>碎片产生于多次增删改：文件释放留下离散空闲簇，新文件从空闲位依次占用，链上簇号不连续。整理工具重排文件簇使其连续，以降低寻道。簇大小选择是折中：大簇减少链长度与 FAT 表规模，小文件碎片增大；小簇反之。<\/p>\n<h2>延伸推演：路径检索、长名校验与簇回收<\/h2>\n<h3>路径名逐级检索<\/h3>\n<p>绝对路径按分隔符拆成各级目录名：根目录簇 2 起步；读当前目录簇的目录项，逐项比对文件名；匹配到子目录项则取其起始簇号，进入下一簇继续；直到最后一级匹配文件目录项。每一级都要重新走&quot;读目录簇 → 遍历目录项 → 取起始簇&quot;流程。相对路径先解析当前工作目录，再沿路径段下溯。<\/p>\n<h3>长文件名拆解与校验和<\/h3>\n<p>长文件名由连续若干长目录项 + 一个短目录项组成：长项每项存 13 个字符（分三段 UTF-16），序号标记顺序与末项；短项存 8.3 简写与校验和。校验和由短文件名按位旋转累加公式算出（本书公式 13-3，PDF 第 543 页），每个长项带同一校验和；读取时校验和匹配才认定长短项属于同一文件。短文件名冲突时文件系统追加 <code>~1<\/code>、<code>~2<\/code> 等序号保证目录内唯一。<\/p>\n<h3>簇链删除与回收<\/h3>\n<p>删除文件：目录项首字节标 <code>0xE5<\/code>（已删除）；遍历 FAT 链把各项标记为空闲簇，归还数据区；目录项空间不立即紧凑，新建目录项时优先复用已删除项。簇链断裂或 FAT 项与目录项不一致时，文件大小与实际占用对不上，需要磁盘检查工具修复双份 FAT 与目录项。<\/p>\n<h3>文件创建时的簇分配<\/h3>\n<p>新文件先在父目录找空闲目录项；数据区从 FSinfo 记录的空闲簇起始位置向后扫描 FAT 表项找空闲簇；写入时逐簇分配，FAT 项串联。空间不足时分配失败。目录文件本身也占簇，目录项增多需要扩展目录簇链。<\/p>\n<h3>VFS 层的位置<\/h3>\n<p>VFS 定义通用接口：open/read/write/lseek/mkdir 等；具体 FAT32 实现把这些接口映射到目录项检索、簇链遍历、扇区读写。上层系统调用（c12）只看 VFS 接口，不感知 FAT 簇号与 FAT 表；更换底层文件系统时上层接口不变。<\/p>\n<h3>对抗性追问：目录项起始簇号为 0 代表什么<\/h3>\n<p>根目录 <code>..<\/code> 项的 0 号簇在本书实测中代表根目录（PDF 第 542 页）；普通文件起始簇 0、1 属保留值，不是有效数据簇。把保留簇号当数据簇寻址会落到保留区或错误位置，检索时必须先做簇号范围检查。<\/p>\n<h2>第二算例与补充推演<\/h2>\n<h3>短目录项字节偏移<\/h3>\n<p>0–10：<code>DIR_Name<\/code>（11 字节，文件名 8 + 扩展名 3）；11：<code>DIR_Attr<\/code>；12：保留；13：创建时间/日期；14–15：访问日期；16–17：<code>DIR_FstClusHI<\/code>；18–19：修改时间/日期；20–21：<code>DIR_FstClusLO<\/code>；22–25：<code>DIR_FileSize<\/code>（32 位）。解析目录项按固定偏移取字段，文件名按空格填充处理。<\/p>\n<h3>FAT 结束标志与保留值<\/h3>\n<p>FAT32 表项低 28 位：<code>0x0000000<\/code> 空闲簇；<code>0x0000001<\/code> 保留；<code>0x0000002<\/code> 起为有效簇号；<code>0x0FFFFFF8<\/code>–<code>0x0FFFFFFF<\/code> 为链尾结束标志。0、1 号簇不存数据；根目录固定在 2 号簇。读表项先掩掉高 4 位再判簇号或结束标志。<\/p>\n<h3>簇链读取伪流程<\/h3>\n<pre><code>cluster = 目录项起始簇号\nwhile cluster &lt; 0x0FFFFFF8:\n    sector = D_data + (cluster-2)*SecPerClus\n    读该簇扇区到缓冲区\n    cluster = FAT[cluster] &amp; 0x0FFFFFFF<\/code><\/pre>\n<p>文件大小决定末簇读取字节数；链遍历次数 = 文件占用簇数，每簇一次 FAT 查表 + 一次扇区读。<\/p>\n<h3>碎片对寻道的影响<\/h3>\n<p>连续簇：磁头顺序扫描，寻道次数少；碎片化：簇号离散，每跳一簇可能一次寻道。机械硬盘寻道毫秒级，远高于扇区读写；SSD 无机械寻道，碎片影响主要在并发与写入放大。簇大小 4KB 时，小文件内部碎片 = 簇大小 − 文件大小；大文件链长，碎片概率随文件数增多。<\/p>\n<h3>补充推演：双 FAT 一致性<\/h3>\n<p>写新簇、改链尾时两份 FAT 同步更新；断电可能只写一份，磁盘检查工具比对两份 FAT，以一致项修复链结构。目录项记录的文件大小与 FAT 链簇数应吻合；不一致说明链损坏或目录项被改写。<\/p>\n<h3>补充：路径检索实例推演<\/h3>\n<p>设路径 <code>/SubDIR/A.txt<\/code>：根目录簇 2，读簇 2 的目录扇区，遍历 32B 项找到 <code>SubDIR<\/code> 目录项，取其起始簇 <code>0x0003<\/code>；进入簇 3 读目录项，找到 <code>A.txt<\/code>，取起始簇号与文件大小。每一级目录都要重复&quot;读簇 → 遍历项 → 拼簇号&quot;；目录项数量多的目录要跨多个簇，沿目录自身簇链遍历。文件名比对先按短名匹配，长名文件再用长目录项校验和确认。<\/p>\n<h3>补充：目录项删除与复用<\/h3>\n<p>删除文件时目录项首字节写 <code>0xE5<\/code>，FAT 链簇标记空闲；目录项空间保留，新建文件优先复用 <code>0xE5<\/code> 项或目录区末尾空闲项。已删除项的文件名字段仍残留旧数据，检索时首字节为 <code>0xE5<\/code> 直接跳过；首字节 <code>0x00<\/code> 表示其后无有效目录项，目录遍历到此结束。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n数据区起始扇区公式是什么？（<span class=\"katex-inline\">H+R+2Z<\/span>，两份 FAT 时。）\n<\/li><li>\n簇 <span class=\"katex-inline\">c<\/span> 起始扇区怎么算？（<span class=\"katex-inline\">D_{\\text{data}}+(c-2)S_{\\text{PerClus}}<\/span>。）\n<\/li><li>\n起始簇号由目录项哪两个字段拼成？（<code>DIR_FstClusHI<\/code> 与 <code>DIR_FstClusLO<\/code>。）\n<\/li><li>\nFAT32 一项多少字节？表项有效位多少位？（4B；低 28 位有效。）\n<\/li><li>\n为什么 FAT 读文件不能随机跳第 <span class=\"katex-inline\">k<\/span> 簇？（必须从头沿链逐项查 FAT，无索引表。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "FAT32 目录项与簇链寻址（目录项、FAT 链、簇号算扇区）"}, "c12": {"html": "<div class=\"source-badge\">📖 出处：一个64位操作系统的设计与实现.pdf · p.195<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">中断门、陷阱门与 IDT（含中断栈切换与 IST）<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">内核对象与 PCB：进程资源的结构化组织<\/a><\/span><\/div><h1>系统调用从用户态陷入内核的完整路径<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章（原书第 5 章 5.1 跳转到应用层、5.2 实现系统调用 API、5.3 系统调用处理函数，第 14 章 14.2 系统调用 API 结构）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>用户程序运行在特权级 3，不能直接访问硬件、不能直接改内核数据，需要一种受控方式请内核代办：打印字符串、读写文件、申请内存、创建进程。系统调用就是用户态进入内核的唯一正规入口：寄存器传参 → 陷入指令切特权级 → 向量表分发到处理函数 → 结果返回用户态。这个概念回答各阶段用哪些寄存器、向量号怎样索引表、栈与现场怎样切换、返回指令怎样回到用户程序。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>用户态传参约定<\/strong>：系统调用向量号放 <code>RAX<\/code>；参数按调用约定用 <code>RDI<\/code>、<code>RSI<\/code>、<code>RDX<\/code>、<code>RCX<\/code>、<code>R8<\/code>、<code>R9<\/code> 传递。本书早期入口把返回地址放 <code>RDX<\/code>、用户栈指针放 <code>RCX<\/code> 配合 <code>SYSEXIT<\/code>；升级后改用 <code>R10<\/code>、<code>R11<\/code> 保存返回地址与栈指针，避开 <code>RDX<\/code>/<code>RCX<\/code> 被 <code>SYSEXIT<\/code> 占用的冲突（原书 14.2.2 节，PDF 第 579–580 页）。<\/p>\n<p><strong>陷入与特权级切换<\/strong>：应用程序执行 <code>sysenter<\/code>，处理器从 3 级进入内核 0 级；入口代码把内核数据段选择子载入 <code>ds<\/code>、<code>es<\/code>，保存现场后按向量号分发（PDF 第 580 页）。<\/p>\n<p><strong>向量表分发<\/strong>：<code>system_call_table<\/code> 是处理函数地址数组，以 <code>RAX<\/code> 为索引：处理函数地址 = <code>system_call_table + RAX × 8<\/code>；表默认项指向 <code>no_system_call<\/code>，已实现项如 <code>sys_putstring<\/code>、<code>sys_printf<\/code> 替换为真实处理函数；表上限 <code>MAX_SYSTEM_CALL_NR = 128<\/code>（PDF 第 579、581 页）。<\/p>\n<p><strong>处理函数与返回<\/strong>：处理函数从 <code>pt_regs<\/code> 结构读寄存器参数，完成实际操作，返回值经 <code>RAX<\/code> 带回；返回模块用 <code>sysexit<\/code> 切回 3 级：<code>RCX<\/code> 载入用户态 RSP，<code>RDX<\/code> 载入用户态 RIP，程序从 <code>sysexit_return_address<\/code> 继续（PDF 第 185、195、197 页）。<\/p>\n<p><strong>现场结构 <code>pt_regs<\/code><\/strong>：入口压栈保存的寄存器按结构体排列，处理函数经结构体成员取参数；返回时逆序恢复。<\/p>\n<h2>执行推导与推演<\/h2>\n<p>以 <code>sys_putstring<\/code> 调用为例：<\/p>\n<ol><li>\n用户程序在 <code>RDI<\/code> 放字符串指针，<code>RAX<\/code> 放对应向量号，执行 <code>sysenter<\/code>。\n<\/li><li>\n内核入口：保存现场到 <code>pt_regs<\/code>；载入内核数据段选择子；检查向量号 <code>&lt; 128<\/code>。\n<\/li><li>\n查表：<code>system_call_table[RAX]<\/code> 取出 <code>sys_putstring<\/code> 地址并调用；函数从 <code>regs-&gt;rdi<\/code> 取指针，调显示函数输出。\n<\/li><li>\n返回值写 <code>RAX<\/code>；回到系统调用返回模块。\n<\/li><li>\n<code>sysexit<\/code>：恢复用户栈与用户指令地址，用户程序从 <code>sysenter<\/code> 下一条指令继续，<code>RAX<\/code> 为返回结果。\n<\/ol>\n<p>跳转到应用层的前置步骤：内核先把用户程序映像加载到用户空间内存，建好用户栈，用寄存器/栈把用户入口地址与栈指针交给切换代码；跨级返回后处理器进入 3 级执行用户代码（原书 5.1 节，PDF 第 183 页前后）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：向量号在表范围内；用户指针指向合法用户地址空间；入口栈与内核栈已配置；返回寄存器约定与入口保存一致。\n<\/li><li>\n失败案例：向量号越界落到表外或默认空函数；用户指针未检查，解引用到未映射/越界/只读页触发 <code>#PF<\/code>；<code>sysenter<\/code> 复位 IF 后未恢复，返回用户态后外部中断（键盘等）无响应——本书实测记录该现象，<code>eflags<\/code> 中 IF 位为 0（原书 5.2 节，PDF 第 196 页）；入口保存与返回恢复寄存器清单不一致，用户程序寄存器被污染。\n<\/li><li>\n边界：本书系统调用表围绕字符串输出、文件、内存、进程等基础接口；完整 POSIX 接口集属于扩展。陷入指令在不同架构/年代有 <code>int 0x80<\/code>、<code>syscall<\/code>/<code>sysret<\/code>、<code>sysenter<\/code>/<code>sysexit<\/code> 等变体，本书采用后者（PDF 第 185、580 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>系统调用 vs 普通函数调用<\/strong>：普通函数在同一特权级内跳转；系统调用跨特权级，经陷入指令进入内核，有独立向量表与现场保存恢复。\n<\/li><li>\n<strong>系统调用 vs 中断<\/strong>：中断由外部设备异步触发，向量来自硬件/控制器；系统调用由用户程序主动发起，向量号由程序在 <code>RAX<\/code> 指定。两者都走门/陷入与栈切换流程。\n<\/li><li>\n<strong><code>sysenter<\/code>/<code>sysexit<\/code> vs <code>syscall<\/code>/<code>sysret<\/code><\/strong>：都是快速陷入对，寄存器约定与栈切换细节不同；本书入口早期用 <code>RDX<\/code>/<code>RCX<\/code> 存返回信息，升级后改用 <code>R10<\/code>/<code>R11<\/code>。\n<\/li><li>\n<strong>向量号 vs 处理函数指针<\/strong>：向量号是用户程序给定的编号；表项是内核函数地址。新增系统调用要在表里登记向量号与函数。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c02 的特权级与段切换、概念 c04 的跨级栈切换是陷入硬件基础；概念 c06 的现场保存恢复复用同一套寄存器清单。后继：文件读写类系统调用落到概念 c11 的目录项与簇链；进程类系统调用操作概念 c08 的 PCB；内存类系统调用走概念 c10 的分配器。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（系统调用从用户态陷入内核的完整路径）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：陷入路径寄存器追踪、向量表索引与返回恢复<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推清一次系统调用怎样闭环，往回追六层前提：<\/p>\n<ol><li>\n特权级模型先成立：用户 3 级不能直接碰内核与硬件，跨级必须经受控入口；段/门/TSS 栈切换机制可用（c02、c04）。\n<\/li><li>\n陷入指令先就位：<code>sysenter<\/code>/<code>sysexit<\/code> 提供快速进出内核的硬件路径，入口与返回地址由寄存器指定。\n<\/li><li>\n向量表先登记：每个内核服务有编号与处理函数地址；表项默认指向空处理，越界向量被拦截。\n<\/li><li>\n参数传递约定先固定：向量号与参数落在指定寄存器，入口保存进 <code>pt_regs<\/code>，处理函数从结构体取值。\n<\/li><li>\n现场保存恢复清单先一致：入口压栈哪些寄存器，返回就逆序弹哪些（c06）。\n<\/li><li>\n内核侧资源先可访问：文件系统、内存分配、PCB 操作已就绪，处理函数才能真正代办。\n<\/ol>\n<p>依赖链方向：用户态置寄存器 → <code>sysenter<\/code> 跨级 → 保存现场 → 查表分发 → 处理函数办事 → 结果写 RAX → <code>sysexit<\/code> 恢复用户栈与 RIP。任一环寄存器约定错位，返回后用户程序拿到错误参数或返回地址。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：用户态准备<\/h3>\n<p>用户包装函数把系统调用编号写入 <code>RAX<\/code>，参数依次放 <code>RDI<\/code>、<code>RSI<\/code>、<code>RDX<\/code>、<code>RCX<\/code>、<code>R8<\/code>、<code>R9<\/code>；返回地址与用户栈指针由陷入机制约定寄存器保存。本书升级后用 <code>R10<\/code>、<code>R11<\/code> 承担返回信息，避免与 <code>RCX<\/code>/<code>RDX<\/code> 参数冲突（PDF 第 579–580 页）。<\/p>\n<h3>第二步：陷入跨级<\/h3>\n<p>执行 <code>sysenter<\/code>：处理器切到内核代码段与内核栈；入口汇编先把内核数据段选择子载入 <code>ds<\/code>、<code>es<\/code>，再把通用寄存器压入 <code>pt_regs<\/code> 栈帧。此时用户态现场完整保存在内核栈上，内核可以安全使用寄存器。<\/p>\n<h3>第三步：向量号检查与查表<\/h3>\n<p>取 <code>RAX<\/code> 向量号：先判断是否 <code>&lt; MAX_SYSTEM_CALL_NR<\/code>（128）；越界走默认 <code>no_system_call<\/code>。合法则按 8B 表项索引：<\/p>\n<div class=\"katex-block\">\\text{handler} = \\text{system\\_call\\_table}[v] = *(\\text{system\\_call\\_table} + v \\times 8)<\/div>\n<p><code>callq handler<\/code> 进入 C 处理函数；函数参数从 <code>pt_regs<\/code> 结构体成员读取，如 <code>regs-&gt;rdi<\/code> 对应第一个参数。<\/p>\n<h3>第四步：内核办事与返回值<\/h3>\n<p>处理函数调用文件系统、内存分配器或 PCB 操作完成请求；返回值写入 <code>RAX<\/code>。若请求涉及用户缓冲区，内核先核对地址合法性与长度，再经拷贝函数在用户空间与内核空间之间传数据。<\/p>\n<h3>第五步：返回用户态<\/h3>\n<p>返回模块逆序弹出寄存器；<code>sysexit<\/code> 把 <code>RCX<\/code> 载入用户 RSP、<code>RDX<\/code>（或升级后约定寄存器）载入用户 RIP，切回 3 级；用户程序从 <code>sysenter<\/code> 下一条指令继续，<code>RAX<\/code> 携带返回值。IF 标志在入口被清时，返回路径需按约定恢复，保证用户态中断可用。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：向量号到表项偏移<\/h3>\n<p>设 <code>sys_putstring<\/code> 向量号 <code>v = 4<\/code>，表项宽 8B，表基地址 <code>0xFFFFFFFF_8001_2000<\/code>。<\/p>\n<ul><li>\n表项偏移 = <code>4 × 8 = 32 = 0x20<\/code>。\n<\/li><li>\n处理函数地址 = <code>*(0xFFFFFFFF_8001_2000 + 0x20)<\/code>。\n<\/li><li>\n向量号 <code>127<\/code>：偏移 <code>127×8 = 1016 = 0x3F8<\/code>；<code>128<\/code> 越界，走默认空处理。\n<\/ul>\n<h3>算例 2：putstring 调用寄存器追踪<\/h3>\n<p>用户程序调用 <code>puts(&quot;hello&quot;)<\/code>：<\/p>\n<ol><li>\n包装函数：<code>RDI = 0x402000<\/code>（用户字符串地址），<code>RAX = 4<\/code>，<code>sysenter<\/code>。\n<\/li><li>\n入口压栈：<code>pt_regs.rdi = 0x402000<\/code>，<code>pt_regs.rax = 4<\/code>。\n<\/li><li>\n查表得 <code>sys_putstring<\/code>；函数读 <code>regs-&gt;rdi<\/code>，核对 <code>0x402000<\/code> 在用户地址区间内。\n<\/li><li>\n逐字符显示；返回值（输出字符数或状态）写 <code>RAX<\/code>。\n<\/li><li>\n<code>sysexit<\/code> 回用户态；用户程序 <code>RAX<\/code> 为返回值，<code>RDI<\/code> 等按约定保留或被覆盖。\n<\/ol>\n<h3>算例 3：跨级栈帧与现场<\/h3>\n<p>用户态 RSP=<code>0x7FFFFFFF_FFE0<\/code>，RIP=<code>0x401020<\/code>。陷入内核栈后，<code>pt_regs<\/code> 帧保存用户 SS/RSP、RFLAGS、CS/RIP 与通用寄存器；<code>sysexit<\/code> 用保存的用户 RSP/RIP 恢复。若入口漏存 <code>RDI<\/code>，处理函数读参数拿到的是内核栈上残留值。<\/p>\n<h3>算例 4：IF 位故障对照<\/h3>\n<p>本书实测：<code>sysenter<\/code> 进入后 EFLAGS.IF 被复位；若返回用户态前不恢复 IF，用户态键盘等外部中断不再响应，表现为程序看起来卡住、按键无反应。诊断时读 <code>eflags<\/code>，IF 位为 0 即可定位（PDF 第 196 页）。正确路径：入口保存原 IF，返回时按保存值恢复。<\/p>\n<h2>延伸推演：陷入指令变体与安全检查<\/h2>\n<p>历史与不同架构的陷入方式：<code>int n<\/code> 软中断经 IDT 门进入，受门 DPL 检查；<code>syscall<\/code>/<code>sysret<\/code> 与 <code>sysenter<\/code>/<code>sysexit<\/code> 是专门的快速系统调用指令，减少中断门压栈开销。本书采用 <code>sysenter<\/code>/<code>sysexit<\/code> 对；两套指令的寄存器约定不同，移植时入口汇编与返回约定要一起改。<\/p>\n<p>内核侧安全检查分层：向量号边界检查防越界查表；用户指针检查防解引用非法地址；长度检查防缓冲区越界拷贝；权限检查防用户态操作内核对象。缺任何一层，恶意或错误的系统调用参数都可能让内核踩进非法内存。<\/p>\n<p>系统调用与信号、调度衔接：处理函数执行期间可能触发缺页、等待 I/O，此时走 c07 调度路径让出处理器；返回前再检查是否需要调度。系统调用返回点因此也是抢占检查点之一。<\/p>\n<h2>延伸推演：调用登记、参数校验与并发重入<\/h2>\n<h3>新系统调用的登记流程<\/h3>\n<p>新增一个内核服务：在 <code>system_call_table<\/code> 分配向量号，写处理函数，函数从 <code>pt_regs<\/code> 取参数、返回值写 <code>RAX<\/code>；用户包装函数按约定置寄存器、执行陷入指令。向量号与函数地址在表中一一对应，表上限 128；越界向量走默认 <code>no_system_call<\/code> 返回错误。向量号一旦发布即稳定，用户程序按号调用，不能随意重排。<\/p>\n<h3>用户参数与缓冲区校验<\/h3>\n<p>指针参数先检查地址落在用户空间区间、长度不越界；内核不直接信任用户指针，经专用拷贝函数在用户/内核空间间传数据。拷贝过程中可能触发缺页，走 c05/c07 的缺页处理与调度路径。字符串参数还要检查结尾符，避免内核读越界。<\/p>\n<h3>返回值与错误约定<\/h3>\n<p>成功时 <code>RAX<\/code> 放结果；失败时放负的错误码或约定错误标记，用户包装函数据此设置错误标识。处理函数中途出错要回滚已做的部分操作，避免资源半分配。文件描述符、内存地址等句柄值由内核分配，返回给用户态后经后续调用再引用。<\/p>\n<h3>并发重入与可重入性<\/h3>\n<p>多个进程可同时调用同一系统调用；处理函数访问共享内核数据（文件表、队列、分配器）必须持锁（c09）。处理函数中途可能等待 I/O 或内存而休眠，被切换走后再回来继续；因此不能在栈上保存跨等待期有效的临时指针，共享状态放内核对象并受锁保护。<\/p>\n<h3>应用映像加载与用户栈前置<\/h3>\n<p>陷入路径之前，内核已把可执行映像加载到用户地址空间：代码段、数据段、堆与用户栈区间在 mm 结构中布置好；用户入口地址与栈指针通过初始栈或寄存器传给首次切换代码。系统调用返回用户态时，<code>sysexit<\/code> 恢复的 RIP/RSP 就指向这套已布置好的用户上下文。<\/p>\n<h3>对抗性追问：系统调用能直接调用内核函数指针吗<\/h3>\n<p>不能。用户态传入的函数地址不可信，直接调用会跳到用户可控位置执行内核权限代码。内核只按向量号查自己的系统调用表，表项地址由内核登记，用户态只能选号不能传函数指针。这是陷入机制与普通函数调用的根本安全差别。<\/p>\n<h2>第二算例与补充推演<\/h2>\n<h3>pt_regs 栈帧布局<\/h3>\n<p>入口压栈后，<code>pt_regs<\/code> 结构体按寄存器在栈上的排列对应：通用寄存器 rax/rbx/rcx/rdx/rsi/rdi/rbp/r8–r15，段寄存器 es/ds/fs/gs，外加硬件帧的 RIP/CS/RFLAGS/RSP/SS。处理函数用 <code>regs-&gt;rdi<\/code> 取第一参数，<code>regs-&gt;rax<\/code> 读写向量号与返回值；返回时按结构体逆序恢复。<\/p>\n<h3>系统调用返回伪流程<\/h3>\n<pre><code>system_call_entry:\n    SAVE_ALL 保存现场\n    检查 RAX &lt; 128\n    handler = table[RAX]\n    call handler(regs)\n    结果写入 regs-&gt;rax\n    RESTORE_ALL 恢复现场\n    sysexit  // 恢复用户 RSP/RIP, 回 3 级<\/code><\/pre>\n<p>返回前走调度检查点：需要切换则在返回路径上调度（c07）。<\/p>\n<h3>寄存器约定对照<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>用途<\/th><th>寄存器<\/th><\/tr><\/thead><tbody><tr><td>向量号/返回值<\/td><td>RAX<\/td><\/tr><tr><td>参数 1–6<\/td><td>RDI、RSI、RDX、RCX、R8、R9<\/td><\/tr><tr><td>用户 RSP/RIP（早期约定）<\/td><td>RCX、RDX<\/td><\/tr><tr><td>返回信息（升级后）<\/td><td>R10、R11<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>sysexit<\/code> 硬件占用 RCX/RDX 恢复栈与指令地址，因此参数不能长期留在这两个寄存器里跨陷入边界；升级方案把返回信息挪到 R10/R11 避开冲突。<\/p>\n<h3>常见调用分类<\/h3>\n<p>文件类：打开、读、写、定位、关闭，落到 VFS 与 FAT 簇链（c11）；内存类：申请、释放、映射，走分配器（c10）；进程类：创建、退出、等待，操作 PCB（c08）；设备类：读键盘/硬盘，走驱动接口。每类处理函数内部再调对应子系统，系统调用层只做陷入、分发与参数校验。<\/p>\n<h3>补充推演：陷入与中断的现场差别<\/h3>\n<p>中断现场由外部事件异步产生，寄存器内容是被打断进程的状态；系统调用现场是用户程序主动设置的参数。两者保存恢复清单相同，但系统调用处理函数知道参数在指定寄存器，中断处理函数按向量号读设备状态。返回路径都经过同一套现场恢复与调度检查。<\/p>\n<h3>补充：错误返回与部分失败<\/h3>\n<p>处理函数中途失败：已分配的资源要回滚，避免句柄或内存半分配；返回值经 <code>RAX<\/code> 带回错误标识，用户包装函数据此设置错误状态。文件描述符、内存地址等句柄由内核分配，用户态保存数值，后续调用再传入；内核按句柄查对象，不接受用户态伪造的对象指针。<\/p>\n<h3>补充：系统调用表的组织<\/h3>\n<p>表是函数指针数组，下标即向量号；默认项指向 <code>no_system_call<\/code>，未实现的号调用后返回错误。新增调用要同时改表项、处理函数与用户包装库三处；向量号发布后保持稳定，用户程序按号链接。表上限 128，越界号不查表直接走默认路径，防止数组越界读到内核其他数据。<\/p>\n<h3>补充：陷入前后的地址空间<\/h3>\n<p>陷入内核后仍在当前进程地址空间：内核页表项常驻映射，用户页表项保持不变；处理函数访问用户缓冲区经校验后拷贝，不直接在用户地址上改。返回用户态后页表未换，除非处理过程中触发了进程调度切换。系统调用处理期间可以被中断打断，中断返回后继续系统调用路径，共享数据访问走同步锁保护。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n系统调用向量号放在哪个寄存器？（<code>RAX<\/code>。）\n<\/li><li>\n处理函数地址怎样从向量号算出？（表基地址 + 向量号 × 8，取指针。）\n<\/li><li>\n本书表上限是多少？（<code>MAX_SYSTEM_CALL_NR = 128<\/code>。）\n<\/li><li>\n<code>sysexit<\/code> 用哪两个寄存器恢复用户栈与指令地址？（<code>RCX<\/code> 存用户 RSP，<code>RDX<\/code> 存用户 RIP；升级后改用 R10/R11 约定。）\n<\/li><li>\n<code>sysenter<\/code> 复位 IF 会导致什么现象？（返回用户态后外部中断不响应，按键等无反应。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "系统调用从用户态陷入内核的完整路径"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：模式与内存：实模式、保护模式、IA-32e 与段页式地址转换<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：实模式、保护模式与段页式内存管理（GDT/LDT、描述符、分页表、地址转换）<\/a><br>检查点：能按顺序写出两次模式切换的标志位与指令，用段选择子算出 GDT 项偏移，把一个线性地址按各级索引拆成查表过程并算出物理页<\/li><li class='path-step' id='path-02'><strong>步骤 02：中断、异常与进程线程调度：IDT、现场保存、时间片与优先级<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：中断、异常与进程/线程调度（IDT、时钟、上下文切换、优先级）<\/a><br>检查点：能区分中断门与陷阱门对 IF 的处理，说出 fault/trap/abort 的差别，列出上下文切换保存的寄存器与栈布局，解释调度时机与时间片来源<\/li><li class='path-step' id='path-03'><strong>步骤 03：内核对象、同步与分配器：PCB、自旋锁/信号量、页框与 slab<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：内核对象、同步与内存分配器（对象管理、自旋锁/信号量、页框与 slab 分配）<\/a><br>检查点：能说明 PCB 各部分记录了什么，按临界区持锁时长选择自旋锁或信号量，解释页框分配与 slab 池的层级关系以及内碎片从哪里产生<\/li><li class='path-step' id='path-04'><strong>步骤 04：文件系统、驱动与用户态接口：FAT32 寻址、设备驱动、系统调用陷入<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：文件系统、驱动与用户态接口（文件系统实现、设备驱动、系统调用与加载）<\/a><br>检查点：能从目录项起始簇号沿 FAT 链遍历并算出簇对应扇区，说清字符设备与块设备的差别，复述系统调用从 SYSENTER 到向量表分发再到 SYSEXIT 返回的完整路径<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kin
