ong>：<\/p>\n<div class=\"katex-block\">\\sigma(z)=\\frac{1}{1+e^{-z}}.<\/div>\n<p><span class=\"katex-inline\">z\\rightarrow+\\infty<\/span> 时 <span class=\"katex-inline\">\\sigma\\rightarrow1<\/span>，<span class=\"katex-inline\">z\\rightarrow-\\infty<\/span> 时 <span class=\"katex-inline\">\\sigma\\rightarrow0<\/span>，<span class=\"katex-inline\">\\sigma(0)=0.5<\/span>，曲线单调上升且关于 <span class=\"katex-inline\">(0,0.5)<\/span> 对称。<\/p>\n<p><strong>类别概率<\/strong>：<span class=\"katex-inline\">p=\\sigma(\\mathbf{w}^T\\mathbf{x}+w_0)<\/span>，即模型预测样本属于类别 1 的概率。二元分类通常以 0.5 为阈值：<span class=\"katex-inline\">p&lt;0.5<\/span> 判为 0，<span class=\"katex-inline\">p&gt;0.5<\/span> 判为 1；阈值可按业务代价调整（原书 §2.3，PDF 第 66 页）。<\/p>\n<p><strong>交叉熵（逻辑损失）<\/strong>：单样本<\/p>\n<div class=\"katex-block\">L=-[y\\log p+(1-y)\\log(1-p)].<\/div>\n<p>标签 <span class=\"katex-inline\">y=1<\/span> 时只保留 <span class=\"katex-inline\">-\\log p<\/span> 项，<span class=\"katex-inline\">y=0<\/span> 时只保留 <span class=\"katex-inline\">-\\log(1-p)<\/span>；预测概率离标签越远，损失越大。<\/p>\n<p><strong>更新规则<\/strong>：交叉熵对权重的梯度为 <span class=\"katex-inline\">\\partial L/\\partial w_j=(p-y)x_j<\/span>，偏置梯度为 <span class=\"katex-inline\">p-y<\/span>；迭代更新 <span class=\"katex-inline\">w_j\\leftarrow w_j-\\eta(p-y)x_j<\/span>。<\/p>\n<p>正例：气温预测是否积雪，0 ℃、1 ℃、2 ℃ 概率约 0.12、0.50、0.88（PDF 第 65、67 页）。反例：目标是连续房价时不应使用本模型，分类概率口径与回归数值预测不匹配。<\/p>\n<h2>原理推导<\/h2>\n<p>Sigmoid 的导数有简洁形式：<span class=\"katex-inline\">\\sigma&#x27;(z)=\\sigma(z)(1-\\sigma(z))<\/span>。交叉熵对 <span class=\"katex-inline\">z<\/span> 求导：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial z}=p-y.<\/div>\n<p>推导链条：<span class=\"katex-inline\">L=-y\\log p-(1-y)\\log(1-p)<\/span>，对 <span class=\"katex-inline\">p<\/span> 求导得 <span class=\"katex-inline\">-y/p+(1-y)/(1-p)<\/span>，代入 <span class=\"katex-inline\">p=\\sigma(z)<\/span> 并用 <span class=\"katex-inline\">\\sigma&#x27;(z)=p(1-p)<\/span> 化简，结果为 <span class=\"katex-inline\">p-y<\/span>。再由链式法则，<span class=\"katex-inline\">\\partial L/\\partial w_j=(p-y)x_j<\/span>，<span class=\"katex-inline\">\\partial L/\\partial w_0=p-y<\/span>。<\/p>\n<p>梯度只含预测误差乘特征分量，形式与线性回归更新相似，但误差 <span class=\"katex-inline\">p-y<\/span> 来自概率口径。决策边界是 <span class=\"katex-inline\">p=0.5<\/span> 对应的位置，即 <span class=\"katex-inline\">z=0<\/span> 的直线；平面上逻辑回归边界为直线。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：类别在特征空间中近似线性可分；需要输出可解释的类别概率；样本量足以稳定估计权重。\n<\/li><li>\n边界一：逻辑回归表达不了弯曲边界，复杂结构需增加多项式特征、核方法或换树/近邻模型。\n<\/li><li>\n边界二：概率输出是相对训练分布的估计，训练集类别不均衡时概率会偏向多数类，评估要结合精确率、召回率。\n<\/li><li>\n失败案例：特征高度相关或数量远大于样本量时，权重估计不稳，需正则化约束（c03）。\n<\/li><li>\n失败案例：把 0.5 阈值当成固定最优；漏诊代价高的场景应下调阳性阈值以提高召回，阈值选择属于决策环节而非模型学习。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>逻辑回归 vs 线性回归<\/strong>：前者 Sigmoid 输出概率、交叉熵损失；后者线性输出数值、平方误差损失。名称中的「回归」指内部先做线性加权，不代表任务是回归。\n<\/li><li>\n<strong>概率 vs 类别<\/strong>：<span class=\"katex-inline\">p<\/span> 是连续把握程度，类别是阈值离散化结果；同一概率可按不同阈值落成不同类别。\n<\/li><li>\n<strong>交叉熵 vs 平方误差（分类）<\/strong>：交叉熵在错误严重时梯度大，学习快；平方误差在 Sigmoid 饱和区梯度被压小，容易停滞。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 分类任务判定，c02 加权组合与损失最小化骨架。后继：c05 SVM 同样处理线性分类但换间隔目标；c06 随机森林、c07 kNN 的分类结果都要回到 c10 的混淆矩阵指标评估；逻辑回归的概率输出是阈值调整与召回/精确率权衡的基础。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（逻辑回归：Sigmoid 概率、交叉熵损失与权重更新规则）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：Sigmoid 概率、交叉熵梯度与单步权重更新<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把逻辑回归推到底，往回追六层前提：<\/p>\n<ol><li>\n<strong>任务是二元分类<\/strong>：标签取 0/1，需要先输出类别概率再离散表决；连续回归任务不适用这套口径。\n<\/li><li>\n<strong>先做线性加权<\/strong>：<span class=\"katex-inline\">z=\\mathbf{w}^T\\mathbf{x}+w_0<\/span>，权重与偏置是待学参数，这一骨架与线性回归相同。\n<\/li><li>\n<strong>输出必须落在 (0,1)<\/strong>：概率不能取负或超过 1，需要一个把实数轴压到开区间的函数，即 Sigmoid。\n<\/li><li>\n<strong>损失衡量概率与标签差距<\/strong>：交叉熵在预测偏离标签时给大损失，在接近时给小损失；平方误差在饱和区梯度过小。\n<\/li><li>\n<strong>梯度经链式法则传到权重<\/strong>：先对 <span class=\"katex-inline\">z<\/span> 求导得 <span class=\"katex-inline\">p-y<\/span>，再乘特征分量得到权重梯度。\n<\/li><li>\n<strong>阈值是决策环节<\/strong>：0.5 是常用默认，阈值按漏报/误报代价调整，不在模型拟合中确定。\n<\/ol>\n<p>依赖链方向：分类任务 → 线性组合 → Sigmoid 压缩 → 交叉熵损失 → 链式梯度 → 阈值表决。任何一层错位，比如用平方误差配 Sigmoid，学习速度与收敛性都会出问题。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：Sigmoid 把实数映射为概率<\/h3>\n<div class=\"katex-block\">\\sigma(z)=\\frac{1}{1+e^{-z}}.<\/div>\n<p>两端极限：<span class=\"katex-inline\">z\\rightarrow+\\infty<\/span> 时 <span class=\"katex-inline\">e^{-z}\\rightarrow0<\/span>，<span class=\"katex-inline\">\\sigma\\rightarrow1<\/span>；<span class=\"katex-inline\">z\\rightarrow-\\infty<\/span> 时 <span class=\"katex-inline\">e^{-z}\\rightarrow+\\infty<\/span>，<span class=\"katex-inline\">\\sigma\\rightarrow0<\/span>；<span class=\"katex-inline\">z=0<\/span> 时 <span class=\"katex-inline\">\\sigma=1/2<\/span>。对称性：<span class=\"katex-inline\">\\sigma(-z)=1-\\sigma(z)<\/span>，因为<\/p>\n<div class=\"katex-block\">1-\\sigma(z)=\\frac{e^{-z}}{1+e^{-z}}=\\frac{1}{1+e^{z}}=\\sigma(-z).<\/div>\n<h3>第二步：写出交叉熵损失<\/h3>\n<p>单样本标签 <span class=\"katex-inline\">y\\in\\{0,1\\}<\/span>，模型概率 <span class=\"katex-inline\">p=\\sigma(z)<\/span>：<\/p>\n<div class=\"katex-block\">L=-[y\\log p+(1-y)\\log(1-p)].<\/div>\n<p><span class=\"katex-inline\">y=1<\/span> 时损失为 <span class=\"katex-inline\">-\\log p<\/span>，<span class=\"katex-inline\">p<\/span> 越小损失越大；<span class=\"katex-inline\">y=0<\/span> 时损失为 <span class=\"katex-inline\">-\\log(1-p)<\/span>，<span class=\"katex-inline\">p<\/span> 越大损失越大。对数把概率乘积转成求和，避免连乘下溢。<\/p>\n<h3>第三步：对 z 求导<\/h3>\n<p>先对 <span class=\"katex-inline\">p<\/span> 求导：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial p}=-\\frac{y}{p}+\\frac{1-y}{1-p}.<\/div>\n<p>代入 <span class=\"katex-inline\">p=\\sigma(z)<\/span>，利用 Sigmoid 导数 <span class=\"katex-inline\">\\sigma&#x27;(z)=p(1-p)<\/span>：<\/p>\n<div class=\"katex-block\">=\\left(-\\frac{y}{p}+\\frac{1-y}{1-p}\\right)p(1-p)\\\\=p-y.<\/div>\n<p>中间化简：第一项 <span class=\"katex-inline\">-y(1-p)<\/span>，第二项 <span class=\"katex-inline\">(1-y)p<\/span>，合并得 <span class=\"katex-inline\">p-y<\/span>。这个结果简洁：梯度只由预测误差 <span class=\"katex-inline\">p-y<\/span> 决定。<\/p>\n<h3>第四步：传到权重与偏置<\/h3>\n<p>由链式法则：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_j}=(p-y)x_j,\\qquad \\frac{\\partial L}{\\partial w_0}=p-y.<\/div>\n<p>更新规则：<\/p>\n<div class=\"katex-block\">w_j\\leftarrow w_j-\\eta(p-y)x_j,\\qquad w_0\\leftarrow w_0-\\eta(p-y).<\/div>\n<p>误差为正（预测偏高）时权重沿特征方向下调；误差为负时上调。<span class=\"katex-inline\">\\eta<\/span> 是学习率，控制单步幅度。<\/p>\n<h3>第五步：决策边界<\/h3>\n<p>边界满足 <span class=\"katex-inline\">p=0.5<\/span>，即 <span class=\"katex-inline\">z=0<\/span>：<span class=\"katex-inline\">\\mathbf{w}^T\\mathbf{x}+w_0=0<\/span>。二维平面上这是一条直线；边界一侧 <span class=\"katex-inline\">z&gt;0<\/span> 判类别 1，另一侧判类别 0。特征系数的符号表示该特征对概率的正向或负向影响（原书 §2.3 对鸢尾花特征权重的解释，PDF 第 56 页）。<\/p>\n<h2>数值算例一：Sigmoid 在三个 z 值上的取值<\/h2>\n<p>取 <span class=\"katex-inline\">z=0<\/span>、<span class=\"katex-inline\">z=1<\/span>、<span class=\"katex-inline\">z=-1<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">z=0<\/span>：<span class=\"katex-inline\">\\sigma(0)=1/(1+1)=0.5<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">z=1<\/span>：<span class=\"katex-inline\">e^{-1}\\approx0.3679<\/span>，<span class=\"katex-inline\">\\sigma(1)=1/1.3679\\approx0.731<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">z=-1<\/span>：<span class=\"katex-inline\">e^{1}\\approx2.7183<\/span>，<span class=\"katex-inline\">\\sigma(-1)=1/3.7183\\approx0.269<\/span>。\n<\/li><li>\n对称核对：<span class=\"katex-inline\">\\sigma(-1)=1-\\sigma(1)\\approx1-0.731=0.269<\/span>，与上式一致。\n<\/li><li>\n概率间隔：<span class=\"katex-inline\">z<\/span> 从 -1 到 1，概率从 0.269 升到 0.731；在 <span class=\"katex-inline\">z=0<\/span> 附近曲线最陡，远离零后饱和、概率变化变慢。\n<\/ol>\n<h2>数值算例二：一次逻辑回归权重更新<\/h2>\n<p>初值 <span class=\"katex-inline\">w_1=0<\/span>、<span class=\"katex-inline\">w_0=0<\/span>，训练样本 <span class=\"katex-inline\">x=1<\/span>、<span class=\"katex-inline\">y=1<\/span>，学习率 <span class=\"katex-inline\">\\eta=0.1<\/span>。<\/p>\n<ol><li>\n线性组合：<span class=\"katex-inline\">z=0\\cdot1+0=0<\/span>。\n<\/li><li>\n概率：<span class=\"katex-inline\">p=\\sigma(0)=0.5<\/span>。\n<\/li><li>\n误差：<span class=\"katex-inline\">p-y=0.5-1=-0.5<\/span>。\n<\/li><li>\n权重梯度：<span class=\"katex-inline\">\\partial L/\\partial w_1=(p-y)x_1=-0.5\\cdot1=-0.5<\/span>；偏置梯度 <span class=\"katex-inline\">-0.5<\/span>。\n<\/li><li>\n更新：<span class=\"katex-inline\">w_1\\leftarrow0-0.1\\cdot(-0.5)=0.05<\/span>；<span class=\"katex-inline\">w_0\\leftarrow0-0.1\\cdot(-0.5)=0.05<\/span>。\n<\/li><li>\n更新后回代：<span class=\"katex-inline\">z=0.05\\cdot1+0.05=0.10<\/span>，<span class=\"katex-inline\">p=\\sigma(0.10)=1/(1+e^{-0.10})\\approx1/1.9048\\approx0.525<\/span>，比 0.5 更靠近标签 1。\n<\/li><li>\n多轮观察：单步只移动一小段；若下一轮仍为同一样本，误差从 -0.5 降到 -0.475，梯度随之减小，权重逐步逼近使该样本概率接近 1 的方向。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<ul><li>\n<strong>案例一：用平方误差配 Sigmoid<\/strong>。Sigmoid 饱和区导数 <span class=\"katex-inline\">p(1-p)<\/span> 很小，平方误差梯度被进一步压小，预测严重错误时更新却很慢。修正：分类概率模型用交叉熵，梯度只含 <span class=\"katex-inline\">p-y<\/span>，在错误大时梯度也大。\n<\/li><li>\n<strong>案例二：阈值固定 0.5 用于漏诊场景<\/strong>。恶性漏诊代价高，0.5 阈值下部分恶性样本被判阴性；应下调阳性阈值，让更多样本进入待复查，召回上升而精确率下降。阈值是决策选择，不是模型输出。\n<\/li><li>\n<strong>案例三：类别不均衡下误信概率<\/strong>。训练集多数类占优，模型概率偏向多数类，整体正确率虚高。修正：评估看精确率、召回率、F 值与 AUC，不看单一正确率（c10）。\n<\/li><li>\n<strong>案例四：特征相关或样本过少导致权重漂移<\/strong>。权重在相关特征间摇摆，验证概率不稳。修正：加 L1/L2 正则化（c03），或先降维（c09）。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：Sigmoid 把什么映射到什么？答：实数轴上的线性组合 <span class=\"katex-inline\">z<\/span> 映射到 <span class=\"katex-inline\">(0,1)<\/span> 概率。\n<\/li><li>\n问：交叉熵对 z 的梯度是什么？答：<span class=\"katex-inline\">p-y<\/span>，即预测概率减真实标签。\n<\/li><li>\n问：决策边界对应哪个概率？答：<span class=\"katex-inline\">p=0.5<\/span>，即 <span class=\"katex-inline\">z=0<\/span>。\n<\/li><li>\n问：逻辑回归为什么名字带回归却是分类？答：内部先做线性回归式加权，输出经 Sigmoid 服务于分类任务。\n<\/li><li>\n问：阈值由谁确定？答：训练前或决策环节按业务代价设定，不是拟合出来的参数。\n<\/ul>\n<h2>补充推导：梯度形式与线性回归的对照<\/h2>\n<p>逻辑回归权重梯度 <span class=\"katex-inline\">(p-y)x_j<\/span> 与线性回归梯度 <span class=\"katex-inline\">-(2/n)e_i x_j<\/span> 结构相似：都是误差项乘特征分量。差别在误差定义：线性回归误差是连续残差 <span class=\"katex-inline\">y_i-\\hat y_i<\/span>，逻辑回归误差是概率差 <span class=\"katex-inline\">p-y<\/span>。更新方向判断一致：误差为正就沿特征反方向调权重，误差为负就同向调；步长都由学习率控制。<\/p>\n<p>对照单步规模：线性回归从零初始化时残差为真实标签值，梯度随标签大小变化；逻辑回归初值概率 0.5，初始误差固定在 <span class=\"katex-inline\">\\pm0.5<\/span> 附近，首轮更新幅度稳定。多轮遍历训练集后，两类模型都在各自损失曲面上逼近极值；逻辑回归因交叉熵不可闭式求解，全程依赖迭代。<\/p>\n<h2>多分类与概率输出<\/h2>\n<p>逻辑回归原本处理二元分类，多分类可拆成「一对其余」的多个二元模型，或用 Softmax 把线性组合转成各类概率分布。模型给出的是相对训练分布的概率估计：训练集类别均衡时概率才接近客观频率，不均衡时概率偏向多数类。概率与类别之间隔了一层阈值决策，阈值选择对应业务代价：漏诊代价高就把阳性阈值往下调，让更多样本进入待复查；误报代价高则上调阈值。<\/p>\n<p>概率还支持排序式评估：不必落类别，先按预测概率排序，再看正例是否排在前列，这正是 AUC 指标的口径（c10）。决策边界在二维平面是直线；增加多项式特征后边界变成曲线，但模型内部仍是加权组合加 Sigmoid。<\/p>\n<h2>数值多步更新对照<\/h2>\n<p>沿用算例二的样本 <span class=\"katex-inline\">x=1,y=1<\/span>，初值零，<span class=\"katex-inline\">\\eta=0.1<\/span>。<\/p>\n<ol><li>\n第 1 轮：<span class=\"katex-inline\">p=0.5<\/span>，误差 <span class=\"katex-inline\">-0.5<\/span>，更新后 <span class=\"katex-inline\">w_1=w_0=0.05<\/span>。\n<\/li><li>\n第 2 轮：<span class=\"katex-inline\">z=0.10<\/span>，<span class=\"katex-inline\">p\\approx0.525<\/span>，误差 <span class=\"katex-inline\">-0.475<\/span>；<span class=\"katex-inline\">w_1\\leftarrow0.05+0.1\\cdot0.475=0.0975<\/span>，<span class=\"katex-inline\">w_0<\/span> 同值。\n<\/li><li>\n第 3 轮：<span class=\"katex-inline\">z=0.195<\/span>，<span class=\"katex-inline\">p\\approx0.549<\/span>，误差 <span class=\"katex-inline\">-0.451<\/span>；权重继续向使概率靠近 1 的方向移动。\n<\/li><li>\n观察：误差逐轮减小，梯度随之减小，权重更新步幅收缩；单一样本上反复更新会逐步逼近把该样本概率推到 1 的方向，实际训练中多样本交替更新才不会盯住单点。\n<\/ol>\n<h2>自检问题<\/h2>\n<ol><li>\n计算 <span class=\"katex-inline\">z=2<\/span> 与 <span class=\"katex-inline\">z=-2<\/span> 时的 Sigmoid 值，并核对对称关系。\n<\/li><li>\n写出交叉熵对权重 <span class=\"katex-inline\">w_j<\/span> 的梯度，说明误差项与特征分量各起什么作用。\n<\/li><li>\n为什么交叉熵在预测严重错误时梯度仍较大，而平方误差在饱和区梯度偏小？\n<\/li><li>\n决策边界 <span class=\"katex-inline\">z=0<\/span> 在二维平面上是什么形状？增加多项式特征后边界会怎样变化？\n<\/li><li>\n类别不均衡时，为什么单看正确率会高估模型表现？应补充哪些指标？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "逻辑回归：Sigmoid 概率、交叉熵损失与权重更新规则"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：图解机器学习算法.pdf · p.71<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">逻辑回归：Sigmoid 概率、交叉熵损失与权重更新规则<\/a><\/span><\/div><h1>支持向量机与核方法：间隔最大化、软间隔与核技巧<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch03（原书 §2.4 支持向量机、§2.5 支持向量机（核方法），PDF 第 71–80 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>线性分类边界不止一条：两类样本都能被多条直线分开，哪一条更稳妥？逻辑回归给出线性边界，但它的位置受全体样本概率影响；SVM 要找的是两侧留出最宽走廊的边界，使新来样本落在走廊内时仍有把握判对。核方法进一步解决数据在原空间线性不可分、映射到高维后才可分的问题，同时避免显式构造高维坐标。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>决策边界<\/strong>：线性边界写成 <span class=\"katex-inline\">\\mathbf{w}^T\\mathbf{x}+w_0=0<\/span>。平面上它把样本分成两侧，类别 1 一侧满足 <span class=\"katex-inline\">\\mathbf{w}^T\\mathbf{x}+w_0&gt;0<\/span>，另一侧小于零。<\/p>\n<p><strong>点到边界距离<\/strong>：样本 <span class=\"katex-inline\">\\mathbf{x}<\/span> 到边界的距离为<\/p>\n<div class=\"katex-block\">\\frac{|\\mathbf{w}^T\\mathbf{x}+w_0|}{\\|\\mathbf{w}\\|}.<\/div>\n<p>分子是线性组合绝对值，分母是权重向量模长。<\/p>\n<p><strong>间隔（margin）<\/strong>：离边界最近的样本与边界之间的距离；硬间隔要求所有样本落在间隔外侧，软间隔允许一部分样本进入间隔内侧甚至误分（原书 §2.4，PDF 第 73 页）。最大化间隔的线性 SVM，其间隔宽度为 <span class=\"katex-inline\">2/\\|\\mathbf{w}\\|<\/span>。<\/p>\n<p><strong>支持向量<\/strong>：落在间隔上或间隔内侧的样本；边界由这些样本确定，外侧样本移动位置不改变边界。<\/p>\n<p><strong>核技巧<\/strong>：把数据隐式映射到高维空间，在高维空间做线性划分；不显式写出映射后的坐标，而用核函数 <span class=\"katex-inline\">K(\\mathbf{x}_i,\\mathbf{x}_j)<\/span> 直接计算高维内积，从而处理非线性可分数据（原书 §2.5，PDF 第 76–78 页）。<\/p>\n<p>正例：两类 blob 数据上线性 SVM 得到宽间隔边界。反例：数据严重重叠时强行硬间隔无解，必须引入软间隔松弛。<\/p>\n<h2>原理推导<\/h2>\n<p>最大化间隔等价于在约束 <span class=\"katex-inline\">y_i(\\mathbf{w}^T\\mathbf{x}_i+w_0)\\ge 1<\/span> 下最小化 <span class=\"katex-inline\">\\|\\mathbf{w}\\|^2/2<\/span>。约束要求每个样本的函数间隔不小于 1。间隔宽度 <span class=\"katex-inline\">2/\\|\\mathbf{w}\\|<\/span> 随 <span class=\"katex-inline\">\\|\\mathbf{w}\\|<\/span> 增大而减小，所以缩小权重模长就是加宽走廊。<\/p>\n<p>软间隔引入松弛变量 <span class=\"katex-inline\">\\xi_i\\ge0<\/span>，允许约束被违反：目标在间隔基础上加 <span class=\"katex-inline\">\\sum_i\\xi_i<\/span>，系数 <span class=\"katex-inline\">C<\/span> 权衡间隔宽度与违例惩罚。<span class=\"katex-inline\">C<\/span> 大则惩罚违例重，接近硬间隔；<span class=\"katex-inline\">C<\/span> 小则容忍更多样本进入内侧。<\/p>\n<p>核方法的依据是：高维空间中线性分类器只需样本间的内积 <span class=\"katex-inline\">\\phi(\\mathbf{x}_i)^T\\phi(\\mathbf{x}_j)<\/span>。核函数 <span class=\"katex-inline\">K(\\mathbf{x}_i,\\mathbf{x}_j)<\/span> 直接给出这个内积，不必算出 <span class=\"katex-inline\">\\phi(\\mathbf{x})<\/span>。常用径向基核（RBF）<span class=\"katex-inline\">K(\\mathbf{x}_i,\\mathbf{x}_j)=\\exp(-\\gamma\\|\\mathbf{x}_i-\\mathbf{x}_j\\|^2)<\/span>，按样本距离衰减相似度。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：样本维度不极端大、需要稳健线性边界；核 SVM 在中小规模非线性数据上表现稳定。\n<\/li><li>\n边界一：SVM 对特征尺度敏感，距离类模型要求先标准化；核函数参数 <span class=\"katex-inline\">\\gamma<\/span> 与 <span class=\"katex-inline\">C<\/span> 是超参数，靠验证集选择。\n<\/li><li>\n边界二：SVM 预测代价随支持向量数量增长，大规模样本上训练与推理都偏重。\n<\/li><li>\n失败案例：类别高度重叠时，软间隔再放宽也压不出有用边界，欠拟合信号是训练集指标就偏低。\n<\/li><li>\n失败案例：核参数 <span class=\"katex-inline\">\\gamma<\/span> 过大，边界围绕个别支持向量形成小圈，等价于过拟合；<span class=\"katex-inline\">\\gamma<\/span> 过小则边界近似线性、欠平滑。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>SVM vs 逻辑回归<\/strong>：两者都给线性边界；SVM 只由支持向量决定边界、追求间隔最宽，逻辑回归由全体样本概率拟合。重叠严重时两者接近，边界清晰时 SVM 间隔更稳。\n<\/li><li>\n<strong>硬间隔 vs 软间隔<\/strong>：硬间隔不允许任何样本进入内侧，仅理想可分；软间隔用松弛变量吸收不可分离的样本，现实数据多用后者。\n<\/li><li>\n<strong>核方法 vs 多项式特征<\/strong>：多项式特征显式造出高维坐标，核技巧隐式算内积；后者在高维下省掉坐标存储。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 分类任务，c04 线性分类边界概念。后继：c10 把 <span class=\"katex-inline\">C<\/span>、核参数列为超参数并用交叉验证选择；SVR 是 SVM 在回归上的变体，沿用间隔与松弛思想。核技巧提供的「隐式映射」视角，与 c09 PCA 显式降维形成对照：一个升维找可分空间，一个降维保留方差方向。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（支持向量机与核方法：间隔最大化、软间隔与核技巧）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：间隔最大化条件、软间隔松弛与核内积<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把 SVM 与核方法推到底，往回追七层前提：<\/p>\n<ol><li>\n<strong>任务是二元线性分类<\/strong>：标签 ±1，边界把特征空间分成两侧；多分类要拆成多个二元 SVM。\n<\/li><li>\n<strong>边界是线性超平面<\/strong>：<span class=\"katex-inline\">\\mathbf{w}^T\\mathbf{x}+w_0=0<\/span>，参数为权重向量与偏置。\n<\/li><li>\n<strong>距离用带模长的点到平面公式<\/strong>：分子是线性组合绝对值，分母是 <span class=\"katex-inline\">\\|\\mathbf{w}\\|<\/span>；距离与函数间隔相差一个模长因子。\n<\/li><li>\n<strong>间隔是最近样本到边界的距离<\/strong>：最大化间隔就是让最靠近边界的样本也离得尽可能远。\n<\/li><li>\n<strong>不可分样本需要松弛<\/strong>：现实数据不能全落在外侧，软间隔用 <span class=\"katex-inline\">\\xi_i<\/span> 吸收违例。\n<\/li><li>\n<strong>高维可分性靠映射<\/strong>：原空间弯曲线性不可分，升到高维后常可线性分开。\n<\/li><li>\n<strong>内积可由核函数代算<\/strong>：高维分类只用到样本内积，核函数隐式给出这个值，省去显式坐标。\n<\/ol>\n<p>依赖链方向：分类任务 → 线性边界 → 距离公式 → 间隔准则 → 软间隔松弛 → 高维映射 → 核内积。任何一层断掉，比如把函数间隔当成几何间隔，间隔宽度就会算错。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：写出边界与距离<\/h3>\n<p>边界 <span class=\"katex-inline\">\\mathbf{w}^T\\mathbf{x}+w_0=0<\/span>。样本 <span class=\"katex-inline\">\\mathbf{x}<\/span> 到边界的欧氏距离：<\/p>\n<div class=\"katex-block\">d(\\mathbf{x})=\\frac{|\\mathbf{w}^T\\mathbf{x}+w_0|}{\\|\\mathbf{w}\\|},\\qquad \\|\\mathbf{w}\\|=\\sqrt{\\sum_j w_j^2}.<\/div>\n<p>分子带绝对值表示距离非负；分母把权重缩放带来的函数间隔变化归一掉。<\/p>\n<h3>第二步：间隔与优化目标<\/h3>\n<p>要求类别 <span class=\"katex-inline\">y_i\\in\\{-1,1\\}<\/span> 满足 <span class=\"katex-inline\">y_i(\\mathbf{w}^T\\mathbf{x}_i+w_0)\\ge 1<\/span>，即函数间隔不小于 1。几何间隔（最近样本距离）为 <span class=\"katex-inline\">1/\\|\\mathbf{w}\\|<\/span>，两侧走廊总宽为<\/p>\n<div class=\"katex-block\">\\text{margin}=\\frac{2}{\\|\\mathbf{w}\\|}.<\/div>\n<p>加宽走廊等价于缩小 <span class=\"katex-inline\">\\|\\mathbf{w}\\|<\/span>，于是 SVM 优化问题写成<\/p>\n<div class=\"katex-block\">\\min_{\\mathbf{w},w_0}\\frac{1}{2}\\|\\mathbf{w}\\|^2\\quad\\text{s.t.}\\quad y_i(\\mathbf{w}^T\\mathbf{x}_i+w_0)\\ge1.<\/div>\n<p>二次目标凸，约束线性，这是凸二次规划问题。<\/p>\n<h3>第三步：软间隔松弛<\/h3>\n<p>线性不可分时，硬约束无解。引入松弛变量 <span class=\"katex-inline\">\\xi_i\\ge0<\/span>，约束变为<\/p>\n<div class=\"katex-block\">y_i(\\mathbf{w}^T\\mathbf{x}_i+w_0)\\ge1-\\xi_i,<\/div>\n<p>目标改为<\/p>\n<div class=\"katex-block\">\\min_{\\mathbf{w},w_0,\\xi}\\frac12\\|\\mathbf{w}\\|^2+C\\sum_i\\xi_i.<\/div>\n<p><span class=\"katex-inline\">C<\/span> 权衡间隔宽度与违例代价：<span class=\"katex-inline\">C<\/span> 大，违例惩罚重，接近硬间隔；<span class=\"katex-inline\">C<\/span> 小，容忍更多样本进入内侧。<span class=\"katex-inline\">\\xi_i<\/span> 记录第 <span class=\"katex-inline\">i<\/span> 个样本违反约束的程度。<\/p>\n<h3>第四步：支持向量的作用<\/h3>\n<p>决策边界只由落在间隔上与间隔内侧的样本（支持向量）决定。间隔外侧样本的约束宽松，移动它们不改变最优 <span class=\"katex-inline\">\\mathbf{w}<\/span>。这与逻辑回归不同：后者边界受全体样本概率牵引。<\/p>\n<h3>第五步：核技巧<\/h3>\n<p>设映射 <span class=\"katex-inline\">\\phi(\\mathbf{x})<\/span> 把样本升到高维，高维线性分类器只需内积 <span class=\"katex-inline\">\\phi(\\mathbf{x}_i)^T\\phi(\\mathbf{x}_j)<\/span>。核函数定义<\/p>\n<div class=\"katex-block\">K(\\mathbf{x}_i,\\mathbf{x}_j)=\\phi(\\mathbf{x}_i)^T\\phi(\\mathbf{x}_j),<\/div>\n<p>直接在原空间算出高维内积，不显式构造 <span class=\"katex-inline\">\\phi(\\mathbf{x})<\/span>。RBF 核为<\/p>\n<div class=\"katex-block\">K(\\mathbf{x}_i,\\mathbf{x}_j)=\\exp(-\\gamma\\|\\mathbf{x}_i-\\mathbf{x}_j\\|^2),<\/div>\n<p>样本距离越近内积越大，<span class=\"katex-inline\">\\gamma<\/span> 控制相似度随距离衰减的速度。<\/p>\n<h2>数值算例一：点到边界距离<\/h2>\n<p>边界取 <span class=\"katex-inline\">x_1+x_2-1=0<\/span>，即 <span class=\"katex-inline\">w_1=1<\/span>、<span class=\"katex-inline\">w_2=1<\/span>、<span class=\"katex-inline\">w_0=-1<\/span>，样本 <span class=\"katex-inline\">\\mathbf{x}=(3,4)<\/span>。<\/p>\n<ol><li>\n分子：<span class=\"katex-inline\">|3+4-1|=6<\/span>。\n<\/li><li>\n分母：<span class=\"katex-inline\">\\|\\mathbf{w}\\|=\\sqrt{1^2+1^2}=\\sqrt2\\approx1.414<\/span>。\n<\/li><li>\n距离：<span class=\"katex-inline\">d=6/\\sqrt2=3\\sqrt2\\approx4.243<\/span>。\n<\/li><li>\n对照另一点 <span class=\"katex-inline\">(0,0)<\/span>：分子 <span class=\"katex-inline\">|-1|=1<\/span>，距离 <span class=\"katex-inline\">1/\\sqrt2\\approx0.707<\/span>，更靠近边界。\n<\/li><li>\n若权重整体翻倍为 <span class=\"katex-inline\">(2,2,-2)<\/span>，分子翻倍、分母也翻倍，距离不变；说明边界位置由方向决定，整体缩放权重不改变几何间隔。\n<\/ol>\n<h2>数值算例二：间隔宽度与权重模长<\/h2>\n<p>设最优权重 <span class=\"katex-inline\">\\mathbf{w}=(2,1)<\/span>。<\/p>\n<ol><li>\n模长：<span class=\"katex-inline\">\\|\\mathbf{w}\\|=\\sqrt{4+1}=\\sqrt5\\approx2.236<\/span>。\n<\/li><li>\n间隔宽度：<span class=\"katex-inline\">2/\\|\\mathbf{w}\\|=2/\\sqrt5\\approx0.894<\/span>。\n<\/li><li>\n若权重收缩为 <span class=\"katex-inline\">(1,0.5)<\/span>，模长 <span class=\"katex-inline\">\\sqrt{1.25}\\approx1.118<\/span>，间隔 <span class=\"katex-inline\">2/1.118\\approx1.789<\/span>，走廊变宽；这对应优化目标缩小 <span class=\"katex-inline\">\\|\\mathbf{w}\\|<\/span> 的方向。\n<\/li><li>\n约束核对：设某样本 <span class=\"katex-inline\">y=1<\/span>、<span class=\"katex-inline\">\\mathbf{x}=(1,1)<\/span>，<span class=\"katex-inline\">\\mathbf{w}^T\\mathbf{x}+w_0<\/span> 若等于 1.2，则函数间隔 1.2 不小于 1，满足硬间隔约束；函数间隔 0.6 则违反，需软间隔松弛 <span class=\"katex-inline\">\\xi\\ge0.4<\/span>。\n<\/li><li>\n软间隔代价：<span class=\"katex-inline\">C\\sum\\xi_i<\/span> 进入目标，<span class=\"katex-inline\">\\xi_i<\/span> 越大惩罚越重；<span class=\"katex-inline\">C<\/span> 取小，模型宁愿让样本进内侧换取更宽间隔。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<ul><li>\n<strong>案例一：量纲不齐直接算距离<\/strong>。特征一个 0–1000、一个 0–1，距离被大尺度特征支配，间隔方向被扭曲。修正：训练前标准化各特征。\n<\/li><li>\n<strong>案例二：γ 过大导致边界绕圈<\/strong>。RBF 核 <span class=\"katex-inline\">\\gamma<\/span> 太大，相似度只在极近邻成立，边界围绕个别支持向量形成小圈，验证误差上升。修正：调小 <span class=\"katex-inline\">\\gamma<\/span>，用交叉验证比较。\n<\/li><li>\n<strong>案例三：硬间隔套重叠数据<\/strong>。样本在两类间交叉分布，硬约束找不到可行解；模型直接报错或边界失效。修正：改用软间隔，设合适的 <span class=\"katex-inline\">C<\/span>。\n<\/li><li>\n<strong>案例四：大规模样本硬上核 SVM<\/strong>。支持向量数量多时推理要计算与各支持向量的核值，速度随支持向量数增长。修正：大规模场景考虑线性 SVM 或降维后再建模。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：间隔指什么距离？答：离决策边界最近的样本到边界的几何距离，走廊总宽 <span class=\"katex-inline\">2/\\|\\mathbf{w}\\|<\/span>。\n<\/li><li>\n问：支持向量是哪些样本？答：间隔上与间隔内侧的样本，边界由它们确定。\n<\/li><li>\n问：软间隔松弛变量记录什么？答：样本违反约束的程度 <span class=\"katex-inline\">\\xi_i<\/span>，目标中按 <span class=\"katex-inline\">C<\/span> 加权求和。\n<\/li><li>\n问：核技巧省去了哪一步？答：不显式构造高维坐标，直接用核函数算高维内积。\n<\/li><li>\n问：<span class=\"katex-inline\">C<\/span> 大小的方向？答：<span class=\"katex-inline\">C<\/span> 大惩罚违例、接近硬间隔；<span class=\"katex-inline\">C<\/span> 小容忍内侧样本。\n<\/ul>\n<h2>补充推导：间隔、支持向量与模型复杂度<\/h2>\n<p>硬间隔问题在约束 <span class=\"katex-inline\">y_i(\\mathbf{w}^T\\mathbf{x}_i+w_0)\\ge1<\/span> 下最小化 <span class=\"katex-inline\">\\|\\mathbf{w}\\|^2/2<\/span>。把约束展开，间隔上的样本等号成立，它们对最优解起决定作用；间隔外侧样本的约束宽松，移除它们边界不变。支持向量数量直接影响推理代价：预测新样本要计算与各支持向量的核值，支持向量越多，单次预测越重。<\/p>\n<p>软间隔把违例程度记进松弛变量 <span class=\"katex-inline\">\\xi_i<\/span>，目标中 <span class=\"katex-inline\">C\\sum_i\\xi_i<\/span> 与间隔宽度权衡。<span class=\"katex-inline\">C<\/span> 与 <span class=\"katex-inline\">\\lambda<\/span> 方向相反地控制复杂度：<span class=\"katex-inline\">C<\/span> 越大，违例惩罚越重，模型越贴近训练数据，接近硬间隔；<span class=\"katex-inline\">C<\/span> 越小，模型容忍内侧样本，边界更平缓。<span class=\"katex-inline\">C<\/span> 与核参数 <span class=\"katex-inline\">\\gamma<\/span> 都属超参数，在训练前设定，用验证集比较取值。<\/p>\n<h2>常见核函数对照<\/h2>\n<ul><li>\n线性核：<span class=\"katex-inline\">K(\\mathbf{x}_i,\\mathbf{x}_j)=\\mathbf{x}_i^T\\mathbf{x}_j<\/span>，等价于原空间线性 SVM，边界为直线。\n<\/li><li>\n多项式核：<span class=\"katex-inline\">K=(\\mathbf{x}_i^T\\mathbf{x}_j+1)^d<\/span>，<span class=\"katex-inline\">d<\/span> 控制多项式次数，表达折线边界。\n<\/li><li>\nRBF 核：<span class=\"katex-inline\">K=\\exp(-\\gamma\\|\\mathbf{x}_i-\\mathbf{x}_j\\|^2)<\/span>，按距离衰减，最常用；<span class=\"katex-inline\">\\gamma<\/span> 大则相似性只覆盖极近邻，边界碎。\n<\/li><li>\n核选择匹配数据结构：边界近似直线用线性核；局部弯曲用 RBF；有明确多项式关系时用多项式核。核函数必须满足正定条件，才能保证对应某个高维空间的内积。\n<\/ul>\n<h2>几何对照与 SVR 联系<\/h2>\n<p>点到边界距离公式 <span class=\"katex-inline\">|\\mathbf{w}^T\\mathbf{x}+w_0|/\\|\\mathbf{w}\\|<\/span> 可与算例一互相核对：权重整体缩放不改变距离，因为分子分母同比例变化。间隔宽度 <span class=\"katex-inline\">2/\\|\\mathbf{w}\\|<\/span> 随模长缩小而增大，这解释了优化目标为什么写成 <span class=\"katex-inline\">1/2\\|\\mathbf{w}\\|^2<\/span> 而不是直接写间隔最大化。<\/p>\n<p>SVR（支持向量回归）把同一套间隔思想搬到回归：定义 <span class=\"katex-inline\">\\epsilon<\/span> 管道，管道内残差不惩罚，管道外按松弛计代价，核方法同样适用。本书第 4 章房价对照中 SVR 与线性回归比较 MSE 与 <span class=\"katex-inline\">R^2<\/span>，其边界机制与本章 SVM 一脉相承。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出点到线性边界的距离公式，并说明分子分母各对应什么。\n<\/li><li>\n为什么最大化间隔等价于最小化 <span class=\"katex-inline\">\\|\\mathbf{w}\\|^2/2<\/span>？两者怎样换算？\n<\/li><li>\n硬间隔与软间隔的约束差别在哪？现实数据一般用哪一种？\n<\/li><li>\nRBF 核的 <span class=\"katex-inline\">K<\/span> 随样本距离怎样变化？<span class=\"katex-inline\">\\gamma<\/span> 过大过小各会出现什么边界？\n<\/li><li>\nSVM 边界由哪些样本决定？这一点与逻辑回归的边界来源有何不同？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "支持向量机与核方法：间隔最大化、软间隔与核技巧"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：图解机器学习算法.pdf · p.89<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">机器学习基本概念：监督、无监督、强化学习与建模流程<\/a><\/span><\/div><h1>决策树与随机森林：不纯度、基尼系数与 Bagging 多数表决<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch03（原书 §2.7 算法 7：随机森林，PDF 第 89–93 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>分类需要一套可解释、能处理非线性边界的规则。单条线性边界表达不了「先按年龄分、再按收入分」这类嵌套条件；决策树用一连串是/否分支把样本逐步送进更纯的分组。单棵树容易盯住训练样本的偶然波动，随机森林通过多棵有差异的树投票，压低单棵树的方差，得到更稳的综合预测。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>不纯度<\/strong>：衡量一个节点内标签杂乱程度的数值。组内标签越一致，不纯度越小；标签混杂则不纯度越大。决策树分裂时选择使子节点不纯度下降最多的条件。<\/p>\n<p><strong>基尼系数<\/strong>（本书采用的不纯度指标）：<\/p>\n<div class=\"katex-block\">G=1-\\sum_{i=1}^{c}p_i^2,<\/div>\n<p><span class=\"katex-inline\">c<\/span> 是标签数，<span class=\"katex-inline\">p_i<\/span> 是第 <span class=\"katex-inline\">i<\/span> 类样本占节点总数的比例。纯节点只有一类，<span class=\"katex-inline\">p=1<\/span>，<span class=\"katex-inline\">G=0<\/span>；两类各半时 <span class=\"katex-inline\">G=0.5<\/span>。<\/p>\n<p><strong>加权平均不纯度<\/strong>：父节点按子节点样本数占比加权，<\/p>\n<div class=\"katex-block\">G_{\\text{split}}=\\sum_{v}\\frac{n_v}{n}G_v,<\/div>\n<p>不能对子节点基尼系数取算术平均。<\/p>\n<p><strong>决策树<\/strong>：递归按特征条件分裂，直到节点纯度达标、样本过少或达到深度限制；叶节点给出该组的多数类别。<\/p>\n<p><strong>随机森林<\/strong>：训练多棵决策树，每棵用自助采样样本与随机特征子集生长；分类时各树投票，按多数表决给出最终类别（原书 §2.7，PDF 第 88 页）。<\/p>\n<p><strong>Bagging<\/strong>：对训练集有放回抽样得到多份样本，分别训练模型再综合；样本与特征的随机性保证树之间有差异，多数表决才有降方差意义。<\/p>\n<p>正例：混合类别数据上按不纯度下降选出分裂点，森林表决比单树稳定。反例：所有树完全相同时，表决等价单树，综合收益消失。<\/p>\n<h2>原理推导<\/h2>\n<p>分裂准则的目标是让 <span class=\"katex-inline\">G_{\\text{split}}<\/span> 尽量小于父节点基尼。对候选特征与切分点，遍历计算加权基尼，选下降最多的条件。基尼系数的取值依据：<span class=\"katex-inline\">p_i^2<\/span> 是随机抽两个样本同类的概率，<span class=\"katex-inline\">1-\\sum p_i^2<\/span> 就是抽到异类的概率，均匀混杂时该概率最大。<\/p>\n<p>随机森林降方差的机制：单棵树在训练样本扰动下预测波动大；若各树误差不相关，投票后方差按 <span class=\"katex-inline\">1/T<\/span> 量级缩小。树之间要有差异——样本自助采样、每次分裂随机挑特征子集；若树输出相同，误差相关，投票不能降方差。回归时森林取各树预测均值，分类取多数类别。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：特征与标签存在非线性嵌套关系；需要模型给出特征重要性排序；样本量适中的表格数据。\n<\/li><li>\n边界一：单棵树深度不受限时易过拟合，森林通过集成缓解，但不是消除；树太深仍会记住噪声。\n<\/li><li>\n边界二：决策树对样本扰动敏感，分裂路径小变就可能改变整棵树结构；这正是单树方差高、需要集成的原因。\n<\/li><li>\n失败案例：类别极不均衡时，树倾向押向多数类；需调整采样、类别权重或改用召回导向的评估。\n<\/li><li>\n失败案例：森林树数量增加到一定程度后收益饱和，继续加树只增计算量，不提升表现。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>基尼系数 vs 信息增益<\/strong>：两者都是不纯度准则。基尼基于异类概率，计算快；信息增益基于熵与信息熵下降。本书采用基尼，二者选出的分裂点通常接近。\n<\/li><li>\n<strong>单树 vs 森林<\/strong>：单树可解释、方差高；森林牺牲可解释性换稳定性。森林内部每棵树仍是决策树。\n<\/li><li>\n<strong>Bagging vs Boosting<\/strong>：Bagging 并行训练多份独立样本再平均；Boosting 串行拟合前一轮残差，逐步纠偏。随机森林属于 Bagging 路线。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 分类任务，c07 近邻表决思路对照。后继：c10 用分类指标评估森林与单树；随机森林的特征重要性可作为 c09 降维前的特征筛选参考。树模型的不纯度准则与 SVM 间隔准则、kNN 近邻表决并列，是有监督三大建模路线之一。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（决策树与随机森林：不纯度、基尼系数与 Bagging 多数表决）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：基尼不纯度计算、分裂选择与集成表决<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把决策树与随机森林推到底，往回追六层前提：<\/p>\n<ol><li>\n<strong>任务是分类<\/strong>：叶节点输出多数类别，不纯度衡量节点内标签混杂程度。\n<\/li><li>\n<strong>分裂是条件判断<\/strong>：每个内部节点按一个特征的切分点把样本送入左右子节点。\n<\/li><li>\n<strong>不纯度要有可计算公式<\/strong>：本书用基尼系数，把类别比例转成一个标量。\n<\/li><li>\n<strong>分裂优劣按加权不纯度比较<\/strong>：子节点按样本数占比加权，反映父节点整体混杂度。\n<\/li><li>\n<strong>单树方差高需要集成<\/strong>：树对样本扰动敏感，多棵有差异的树综合可压低方差。\n<\/li><li>\n<strong>多样性是投票有效的前提<\/strong>：树之间误差不相关，多数表决才能降方差；完全相同的树投票无收益。\n<\/ol>\n<p>依赖链方向：分类任务 → 条件分裂 → 不纯度公式 → 加权比较 → 单树局限 → 集成表决。任何一层断掉，比如按算术平均对子节点基尼求和，分裂选择就会被小节点误导。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：基尼系数的含义<\/h3>\n<p>节点内第 <span class=\"katex-inline\">i<\/span> 类比例 <span class=\"katex-inline\">p_i=n_i/n<\/span>。随机抽两个样本，同类概率为 <span class=\"katex-inline\">\\sum_i p_i^2<\/span>，异类概率为<\/p>\n<div class=\"katex-block\">G=1-\\sum_i p_i^2.<\/div>\n<p>纯节点只有一类：<span class=\"katex-inline\">p=1<\/span>，<span class=\"katex-inline\">G=0<\/span>；两类各半：<span class=\"katex-inline\">G=1-0.5^2-0.5^2=0.5<\/span>，达到二分类最大值。<span class=\"katex-inline\">G<\/span> 越大，节点越杂。<\/p>\n<h3>第二步：加权平均不纯度<\/h3>\n<p>一次分裂把子节点记为 <span class=\"katex-inline\">v<\/span>，各含 <span class=\"katex-inline\">n_v<\/span> 个样本，父节点共 <span class=\"katex-inline\">n<\/span> 个。分裂后的不纯度按规模加权：<\/p>\n<div class=\"katex-block\">G_{\\text{split}}=\\sum_v\\frac{n_v}{n}G_v.<\/div>\n<p>权重是子节点样本占比；大节点的不纯度对父节点影响更大。选分裂条件就是遍历候选特征与切分点，取 <span class=\"katex-inline\">G_{\\text{split}}<\/span> 最小的一个。<\/p>\n<h3>第三步：递归分裂与停止<\/h3>\n<p>选定条件后对子节点重复同一过程，直到节点纯度达标、样本数少于阈值，或达到深度限制。叶节点的预测取该组多数类别。训练时不接触验证数据，分裂只在训练集上做。<\/p>\n<h3>第四步：随机森林的样本与特征随机<\/h3>\n<p>每棵树从训练集有放回自助抽样得到一份样本；每次分裂只从随机抽出的特征子集中挑切分点。两层随机使树之间结构有差异，避免盯住同一批噪声。<\/p>\n<h3>第五步：多数表决与方差收缩<\/h3>\n<p>分类时各树给出类别，森林取票数最多的类别；回归时取各树预测均值。若 <span class=\"katex-inline\">T<\/span> 棵树误差互不相关、单树方差为 <span class=\"katex-inline\">\\sigma^2<\/span>，平均后方差约为 <span class=\"katex-inline\">\\sigma^2/T<\/span>；相关性高时收缩幅度减小。这解释了为什么多样性比树数量更关键。<\/p>\n<h2>数值算例一：两种分裂方案的基尼对照<\/h2>\n<p>父节点 6 个样本，A、B 各 3 个。<\/p>\n<ol><li>\n父节点基尼：<span class=\"katex-inline\">G_0=1-(3/6)^2-(3/6)^2=1-0.25-0.25=0.5<\/span>。\n<\/li><li>\n方案甲：左 3 个（1A,2B），右 3 个（2A,1B）。\n<ul>\n<li>\n左：<span class=\"katex-inline\">G_L=1-(1/3)^2-(2/3)^2=1-1/9-4/9=4/9\\approx0.444<\/span>。\n<\/li><li>\n右：<span class=\"katex-inline\">G_R=1-(2/3)^2-(1/3)^2=4/9\\approx0.444<\/span>。\n<\/li><li>\n加权：<span class=\"katex-inline\">G_甲=(3/6)G_L+(3/6)G_R=4/9\\approx0.444<\/span>。\n<\/li><li>\n方案乙：左 2 个（2A,0B），右 4 个（1A,3B）。\n<\/li><li>\n左：纯节点，<span class=\"katex-inline\">G_L&#x27;=1-(2/2)^2-0=0<\/span>。\n<\/li><li>\n右：<span class=\"katex-inline\">G_R&#x27;=1-(1/4)^2-(3/4)^2=1-1/16-9/16=6/16=0.375<\/span>。\n<\/li><li>\n加权：<span class=\"katex-inline\">G_乙=(2/6)\\cdot0+(4/6)\\cdot0.375=0.25<\/span>。\n<\/li><li>\n选择：<span class=\"katex-inline\">G_乙=0.25&lt;G_甲=0.444<\/span>，方案乙不纯度下降更多，优先采用。\n<\/li><li>\n核对权重：若忽略样本占比、对两子节点取算术平均，方案乙平均为 <span class=\"katex-inline\">(0+0.375)/2=0.1875<\/span>，与加权值 0.25 不同；小规模子节点不能和大规模子节点等权看待。\n<\/ul>\n<\/ol>\n<h2>数值算例二：森林多数表决走查<\/h2>\n<p>待分类样本，5 棵树预测依次为 0、1、1、0、1。<\/p>\n<ol><li>\n票数统计：类别 1 得 3 票（第 2、3、5 棵），类别 0 得 2 票（第 1、4 棵）。\n<\/li><li>\n表决结果：类别 1，票数比 3:2。\n<\/li><li>\n单树对照：若只取第 1 棵树，预测为 0，与森林结果相反；单树受样本扰动影响大，森林综合后更稳。\n<\/li><li>\n多样性核对：5 棵树在自助样本与特征子集上生长，预测有分歧；若 5 棵全投同一类，表决只是重复单树结论，方差不收缩。\n<\/li><li>\n回归对照：若 5 棵树回归预测为 2.1、3.0、2.8、2.4、2.7，森林预测取均值 <span class=\"katex-inline\">(2.1+3.0+2.8+2.4+2.7)/5=13.0/5=2.60<\/span>。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<ul><li>\n<strong>案例一：树深不加限制<\/strong>。单棵树把训练样本逐条记住，叶节点纯到 100%，验证集上出现细碎边界。修正：限制深度、叶节点最小样本数，或用森林集成缓解。\n<\/li><li>\n<strong>案例二：树之间没有差异<\/strong>。所有树用同样本、同特征生长，输出一致，多数表决等价单树，方差不降。修正：保留自助采样与特征随机两层随机性。\n<\/li><li>\n<strong>案例三：不均衡数据押多数类<\/strong>。多数类样本占优时分裂持续偏向多数类，少数类召回很低。修正：调整采样比例、类别权重，评估看召回与 F 值而非正确率。\n<\/li><li>\n<strong>案例四：盲目加树数量<\/strong>。树数超过收益饱和点后，验证指标不再上升，训练与推理时间线性增长。修正：按验证曲线确定树数，不为数量堆模型。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：基尼系数衡量什么？答：节点内标签杂乱程度，异类样本被抽到的概率。\n<\/li><li>\n问：纯节点基尼是多少？答：0；两类各半时二分类基尼为 0.5。\n<\/li><li>\n问：加权不纯度按什么加权？答：子节点样本数占比，不是算术平均。\n<\/li><li>\n问：随机森林为什么能降方差？答：多棵误差不相关的树投票平均，方差按约 <span class=\"katex-inline\">1/T<\/span> 收缩。\n<\/li><li>\n问：Bagging 与 Boosting 的差别？答：Bagging 并行独立采样平均；Boosting 串行拟合残差纠偏。\n<\/ul>\n<h2>补充推导：熵与信息增益对照<\/h2>\n<p>基尼系数之外，另一类不纯度是熵<\/p>\n<div class=\"katex-block\">H=-\\sum_i p_i\\log_2 p_i.<\/div>\n<p>信息增益是分裂前后熵的下降量。基尼计算只含平方项，省去对数运算，工程上更快；两者选择的分裂点通常接近。本书采用基尼，理解时可把基尼看作「异类抽样概率」，把熵看作「集合的不确定度」，方向一致：纯节点两者都为零，均匀混杂两者都最大。<\/p>\n<p>分裂选择的完整循环：对每个候选特征，遍历切分点，把样本送入左右子节点；按加权不纯度计算分裂后水平；取下降最多的特征与切分；对子节点递归直到停止条件。停止条件包括节点纯度达标、样本数少于下限、深度达到上限。任一分支样本过少时继续分裂会盯住噪声，因此需要最小叶节点样本数约束。<\/p>\n<h2>预测路径与特征重要性<\/h2>\n<p>单棵树预测一个新样本时，从根节点出发，按每个内部节点的特征条件走向对应分支，直到叶节点；叶节点多数类别即预测。路径上经过的条件序列就是一条可读规则，这是决策树相对黑箱模型的可解释性来源。<\/p>\n<p>随机森林的特征重要性可由各特征在所有树上带来的不纯度下降汇总得到：分裂时使基尼下降越多的特征，重要性越高。这份排序可作为降维前的筛选参考（对照 c09 PCA），但重要性高不等于因果关系，只表示它在训练集分裂中贡献大。<\/p>\n<h2>集成的偏差与方差<\/h2>\n<p>Bagging 路线中，各棵树在自助样本上独立生长，误差互不相关时平均后方差按 <span class=\"katex-inline\">1/T<\/span> 收缩；树越深单树方差越高，集成后收益越明显。若树之间误差相关（同样本、同特征、同分裂），相关性高则方差收缩有限。随机性来自两层：样本自助有放回抽样，每次分裂随机抽特征子集。森林预测分类走多数表决，回归走均值；树数量增加到饱和点后验证指标不再上升，继续加树只增计算量。<\/p>\n<h2>随机森林的预测与局限<\/h2>\n<p>分类时森林输出多数类别，回归时输出各树均值；预测速度随树数量线性增长。森林对特征尺度不敏感（分裂只比较大小，不计算距离），这是它相对 kNN、SVM 的一个实用优势。局限是可解释性弱于单树，高基数类别特征上仍可能偏向多数类；表格数据之外的图像、语音任务，森林通常不如深度模型。理解森林时把它拆成两层：内层是可读的决策树，外层是多样本、多特征随机下的表决综合。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n节点 8 个样本，5 个 A、3 个 B，计算基尼系数。\n<\/li><li>\n一次分裂左 4 个（3A,1B）、右 4 个（1A,3B），分别算子节点基尼与加权平均基尼。\n<\/li><li>\n为什么特征随机子集能增加树之间的差异？去掉这一层会怎样？\n<\/li><li>\n多数表决在什么条件下降方差最明显？树预测高度相关时收缩幅度如何变化？\n<\/li><li>\n决策树可解释性强，随机森林为什么可解释性下降？这一交换换来什么？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "决策树与随机森林：不纯度、基尼系数与 Bagging 多数表决"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：图解机器学习算法.pdf · p.101<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">机器学习基本概念：监督、无监督、强化学习与建模流程<\/a><\/span><\/div><h1>k 近邻（kNN）：距离度量、多数表决与 k 值选择<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch03（原书 §2.9 算法 9：KNN，PDF 第 101–105 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>有些分类问题边界弯曲、没有清晰的线性规律，参数化模型（直线、超平面）压不平这种结构。kNN 走另一条路：不预先拟合一组参数，预测时直接看新样本周围最近的训练样本属于哪类，按邻居多数意见表决。它机制简单，却能拟合复杂边界，代价是预测阶段要算距离、存下全部训练数据。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>懒惰学习<\/strong>：kNN 训练阶段只机械记住全部训练数据，不做参数计算；直到预测新样本时才执行距离比较与表决（原书 §2.9，PDF 第 101 页）。<\/p>\n<p><strong>距离度量<\/strong>：欧氏距离<\/p>\n<div class=\"katex-block\">d(\\mathbf{x},\\mathbf{q})=\\sqrt{\\sum_{j=1}^{d}(x_j-q_j)^2};<\/div>\n<p>曼哈顿距离 <span class=\"katex-inline\">d=\\sum_j|x_j-q_j|<\/span>。距离定义决定「近邻」的含义。<\/p>\n<p><strong>k 近邻<\/strong>：对新样本 <span class=\"katex-inline\">\\mathbf{q}<\/span>，在训练集中找距离最近的 <span class=\"katex-inline\">k<\/span> 个样本。<\/p>\n<p><strong>多数表决<\/strong>：统计 <span class=\"katex-inline\">k<\/span> 个近邻的标签，票数最多的类别作为预测结果。二元分类时常取奇数 <span class=\"katex-inline\">k<\/span>，避免票数持平（PDF 第 102 页）。<\/p>\n<p><strong>k 的选择<\/strong>：<span class=\"katex-inline\">k<\/span> 是超参数。<span class=\"katex-inline\">k=1<\/span> 边界围绕单点形成飞地，易过拟合；<span class=\"katex-inline\">k<\/span> 过大边界过度平滑，局部结构被多数邻居抹平（PDF 第 103 页）。<\/p>\n<p>正例：月亮形曲线数据集上 kNN 给出复杂边界，书中 <span class=\"katex-inline\">k=5<\/span> 时边界平滑可分（PDF 第 102 页）。反例：特征量纲不齐时，大尺度特征支配距离，近邻不再反映各维共同相似性。<\/p>\n<h2>原理推导<\/h2>\n<p>kNN 的决策边界由近邻标签的局部密度决定：新样本落在哪片邻域，就跟随那片邻域的多数类别。距离公式把样本间相似性转成数值排序；<span class=\"katex-inline\">k<\/span> 控制参与表决的邻域大小。<\/p>\n<p>从偏差—方差看：<span class=\"katex-inline\">k<\/span> 小，模型跟随局部细节，方差高、偏差低；<span class=\"katex-inline\">k<\/span> 大，模型被大范围邻居拉平，偏差高、方差低。选择 <span class=\"katex-inline\">k<\/span> 是在两者之间取平衡，用验证集比较不同 <span class=\"katex-inline\">k<\/span> 的表现。<\/p>\n<p>维度升高时，样本在高维空间分布稀疏，任意两点距离趋于接近，距离度量失去区分度，这就是维度灾难；kNN 在高维稀疏数据上效果下降明显。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：边界复杂、样本量适中、特征尺度已对齐；需要直观可解释的局部判断。\n<\/li><li>\n边界一：预测代价随训练样本数增长，每来一个新样本都要与全部样本算距离，大数据集上推理偏重。\n<\/li><li>\n边界二：类别不均衡时，大类别在近邻中天然占优，表决偏向多数类。\n<\/li><li>\n失败案例：未标准化直接算欧氏距离，大尺度特征把小尺度差异淹没，近邻选择失真。\n<\/li><li>\n失败案例：<span class=\"katex-inline\">k<\/span> 取 1 时把噪声点当边界，验证集上出现细碎飞地；<span class=\"katex-inline\">k<\/span> 取到接近样本总数，所有样本都判成多数类。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>kNN vs 决策树<\/strong>：kNN 存数据、预测时算距离；决策树训练时长出分裂规则，预测走分支。两者都能表达非线性边界，但参数化程度相反。\n<\/li><li>\n<strong>欧氏 vs 曼哈顿距离<\/strong>：欧氏看重直线距离，对方向差异敏感；曼哈顿按坐标轴路径求和，对离群尺度更稳健。距离选择要匹配数据含义。\n<\/li><li>\n<strong>kNN vs 聚类<\/strong>：kNN 是有监督表决，邻居带标签；k-means 是无监督分组，没有答案标签。两者都用距离，但目标不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 分类任务与距离直觉。后继：c08 k-means 沿用距离分组但去掉标签；c10 把 <span class=\"katex-inline\">k<\/span> 列为超参数，用交叉验证选择；kNN 的局部表决与 c06 森林多数表决在「综合邻近/多个模型意见」上形成对照。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（k 近邻（kNN）：距离度量、多数表决与 k 值选择）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：距离排序、近邻表决与 k 值偏差方差权衡<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把 kNN 推到底，往回追六层前提：<\/p>\n<ol><li>\n<strong>任务是局部分类<\/strong>：新样本跟随周围带标签样本的类别，不需要全局参数方程。\n<\/li><li>\n<strong>样本可表示为特征向量<\/strong>：每条训练样本与新样本都在同一特征空间，距离才有定义。\n<\/li><li>\n<strong>距离度量把相似性转成数值<\/strong>：欧氏或曼哈顿距离决定「近邻」的排序规则。\n<\/li><li>\n<strong>k 控制表决邻域大小<\/strong>：参与投票的近邻数量是外部设定的超参数。\n<\/li><li>\n<strong>表决规则汇总邻居标签<\/strong>：多数类别胜出，二元分类避免持平取奇数。\n<\/li><li>\n<strong>尺度与维度影响距离有效性<\/strong>：量纲不齐扭曲距离，高维稀疏使距离失去区分度。\n<\/ol>\n<p>依赖链方向：局部分类 → 向量表示 → 距离公式 → 近邻筛选 → 多数表决 → k 与尺度权衡。任何一层断掉，比如距离被大尺度特征支配，近邻集合就不再反映真实相似性。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：计算新样本到各训练样本的距离<\/h3>\n<p>设新样本 <span class=\"katex-inline\">\\mathbf{q}<\/span>，训练样本 <span class=\"katex-inline\">\\mathbf{x}_i<\/span>。欧氏距离<\/p>\n<div class=\"katex-block\">d_i=\\sqrt{\\sum_{j=1}^{d}(x_{ij}-q_j)^2}.<\/div>\n<p>曼哈顿距离为 <span class=\"katex-inline\">d_i=\\sum_j|x_{ij}-q_j|<\/span>。距离越小，样本在该度量下越相似。<\/p>\n<h3>第二步：按距离升序取前 k<\/h3>\n<p>把全部 <span class=\"katex-inline\">d_i<\/span> 排序，取最小的 <span class=\"katex-inline\">k<\/span> 个样本。<span class=\"katex-inline\">k<\/span> 是超参数，训练前确定；二元分类常取奇数，防止 1:1 持平无法落类。<\/p>\n<h3>第三步：多数表决<\/h3>\n<p>统计 <span class=\"katex-inline\">k<\/span> 个近邻标签：<span class=\"katex-inline\">N_c<\/span> 为类别 <span class=\"katex-inline\">c<\/span> 的票数，预测<\/p>\n<div class=\"katex-block\">\\hat y=\\arg\\max_c N_c.<\/div>\n<p>回归场景下取近邻标签均值作为预测；分类场景取多数类别。<\/p>\n<h3>第四步：k 的偏差—方差权衡<\/h3>\n<ul><li>\n<span class=\"katex-inline\">k<\/span> 小：邻域局部，模型跟随细节，方差高、偏差低，边界易出现飞地。\n<\/li><li>\n<span class=\"katex-inline\">k<\/span> 大：邻域扩大，模型被大范围邻居拉平，偏差高、方差低，边界过平滑。\n<\/li><li>\n中间取值在验证集上比较正确率、召回等指标，选泛化最好的一档。\n<\/ul>\n<h3>第五步：距离有效性的两个威胁<\/h3>\n<p>尺度威胁：特征量纲不一致时，大尺度特征的距离差被放大，小尺度差异被忽略。维度威胁：维度升高，样本稀疏，任意两点距离趋同，近邻排序不稳定。前者靠标准化缓解，后者靠降维（c09）或特征筛选缓解。<\/p>\n<h2>数值算例一：五点距离计算与两轮表决<\/h2>\n<p>待分类点 <span class=\"katex-inline\">\\mathbf{q}=(2,2)<\/span>，训练集如下。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>样本<\/th><th>坐标<\/th><th>类别<\/th><th>欧氏距离<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>(1,1)<\/td><td>0<\/td><td><span class=\"katex-inline\">\\sqrt{(1-2)^2+(1-2)^2}=\\sqrt2\\approx1.414<\/span><\/td><\/tr><tr><td>B<\/td><td>(3,1)<\/td><td>1<\/td><td><span class=\"katex-inline\">\\sqrt{(3-2)^2+(1-2)^2}=\\sqrt2\\approx1.414<\/span><\/td><\/tr><tr><td>C<\/td><td>(2,4)<\/td><td>0<\/td><td><span class=\"katex-inline\">\\sqrt{0+2^2}=2<\/span><\/td><\/tr><tr><td>D<\/td><td>(4,3)<\/td><td>1<\/td><td><span class=\"katex-inline\">\\sqrt{2^2+1^2}=\\sqrt5\\approx2.236<\/span><\/td><\/tr><tr><td>E<\/td><td>(0,3)<\/td><td>1<\/td><td><span class=\"katex-inline\">\\sqrt{(-2)^2+1^2}=\\sqrt5\\approx2.236<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<ol><li>\n升序：A、B（1.414）→ C（2.0）→ D、E（2.236）。\n<\/li><li>\n<span class=\"katex-inline\">k=3<\/span>：近邻 A、B、C；类别 0 两票（A、C），类别 1 一票（B），表决预测类别 0。\n<\/li><li>\n<span class=\"katex-inline\">k=5<\/span>：全部参与；类别 0 两票，类别 1 三票（B、D、E），表决预测类别 1。\n<\/li><li>\n结论：同一新样本，<span class=\"katex-inline\">k<\/span> 不同可得到相反类别；<span class=\"katex-inline\">k<\/span> 改变邻域大小，直接改变边界形状。\n<\/li><li>\n边界观察：<span class=\"katex-inline\">k=1<\/span> 时每个训练点周围形成自己的小区域，噪声点被记住；<span class=\"katex-inline\">k=30<\/span> 时局部细节被抹平，大片区域归一类。\n<\/ol>\n<h2>数值算例二：两种距离度量对照<\/h2>\n<p>沿用五点，改用曼哈顿距离 <span class=\"katex-inline\">d=\\sum|x_j-q_j|<\/span>。<\/p>\n<ol><li>\nA：<span class=\"katex-inline\">|1-2|+|1-2|=2<\/span>；B：<span class=\"katex-inline\">|3-2|+|1-2|=2<\/span>；C：<span class=\"katex-inline\">|0|+|4-2|=2<\/span>；D：<span class=\"katex-inline\">|4-2|+|3-2|=3<\/span>；E：<span class=\"katex-inline\">|0-2|+|3-2|=3<\/span>。\n<\/li><li>\n曼哈顿下 A、B、C 并列最近，<span class=\"katex-inline\">k=3<\/span> 表决结果仍为类别 0（A、C 两票对 B 一票）；但并列结构与欧氏不同，度量换了近邻排序就可能变。\n<\/li><li>\n尺度对照：设特征一范围 0–1000、特征二范围 0–1，未标准化时特征一的距离差动辄数百，特征二的 0.1 差异被压到可忽略；标准化后两维方差对齐，距离才反映共同相似性。\n<\/li><li>\n维度对照：若特征从 2 维升到 20 维，每维少量随机差累积后，样本间距离方差变小，最近邻与最远邻距离接近，表决失去局部依据。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<ul><li>\n<strong>案例一：未标准化算距离<\/strong>。大尺度特征支配欧氏距离，选出的近邻只在大尺度维度上接近，小尺度维度差异被忽略。修正：训练前把各特征缩到相近方差。\n<\/li><li>\n<strong>案例二：k=1 记噪声<\/strong>。单点噪声周围形成飞地边界，验证集细碎误分。修正：增大 <span class=\"katex-inline\">k<\/span>，在验证曲线上找偏差方差平衡点。\n<\/li><li>\n<strong>案例三：类别不均衡硬表决<\/strong>。大类别在近邻中数量天然占优，少数类样本被持续误判。修正：加权表决、调整采样，评估看召回与 F 值。\n<\/li><li>\n<strong>案例四：高维稀疏数据硬上 kNN<\/strong>。距离趋同使近邻选择随机，预测不稳。修正：先降维或筛特征，再做近邻分类。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：kNN 训练阶段做什么？答：只存下训练数据，不更新参数；计算推迟到预测时。\n<\/li><li>\n问：欧氏距离公式？答：<span class=\"katex-inline\">d=\\sqrt{\\sum_j(x_j-q_j)^2}<\/span>。\n<\/li><li>\n问：k 小与 k 大各偏向什么？答：k 小跟随局部、方差高；k 大平滑、偏差高。\n<\/li><li>\n问：二元分类为什么常取奇数 k？答：避免票数 1:1 持平无法落类。\n<\/li><li>\n问：维度灾难对 kNN 怎样起作用？答：高维稀疏使样本距离趋同，近邻排序失去区分度。\n<\/ul>\n<h2>补充推导：距离加权与类别不均衡<\/h2>\n<p>基本 kNN 对 <span class=\"katex-inline\">k<\/span> 个近邻等权表决；改进版本按距离加权，近邻权重高、远邻权重低，权重可取 <span class=\"katex-inline\">1/d<\/span> 或 <span class=\"katex-inline\">1/d^2<\/span>。距离越近的样本对新样本类别参考越强，加权表决在边界附近更稳。等权版本在远邻与近邻一视同仁，邻域较大时容易被边缘邻居拉偏。<\/p>\n<p>类别不均衡在 kNN 中有双重表现：训练集多数类样本多，近邻中天然占优；预测时新样本周围若两类稀疏度不同，表决偏向多数类。缓解手段包括距离加权、按类抽样平衡、或在评估时看召回与精确率而非正确率（c10）。<\/p>\n<h2>计算代价与适用边界<\/h2>\n<p>训练阶段 kNN 只存数据，代价是存储全部训练样本；预测阶段每个新样本都要与全部样本算距离、排序，复杂度 <span class=\"katex-inline\">O(n d)<\/span>。样本量大时推理偏重，可借助近邻搜索结构（如 KD 树）减少距离比较次数，但高维下这类结构效率也下降。<\/p>\n<p>适用边界：边界复杂、样本量适中、特征尺度对齐的表格或空间数据效果直观；高维稀疏文本/图像不宜直接用原始距离，需先降维（c09）或改用专门度量。kNN 与决策树同属非线性模型，但参数化程度相反：树在训练时长出规则，kNN 在预测时才算距离；与 k-means 相比，kNN 邻居带标签做监督表决，k-means 无标签做结构分组。<\/p>\n<p>kNN 决策边界是近邻标签密度的直接反映：边界弯曲程度由 <span class=\"katex-inline\">k<\/span> 与样本分布共同决定，不需要预先假设函数形式。理解 kNN 时记住两点：训练阶段零参数计算，预测阶段一次性完成距离比较与表决；它的简单性既是优点（机制直观、无需拟合），也是代价（推理重、高维失效）。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n新样本 (3,3)，训练点 (1,2) 类 0、(4,1) 类 1、(2,4) 类 0，算欧氏距离并给出 k=3 表决结果。\n<\/li><li>\n把上例距离换成曼哈顿距离，排序是否改变？写出计算过程。\n<\/li><li>\n说明 k 增大时偏差与方差各自的变化方向，以及验证集上怎样选 k。\n<\/li><li>\n为什么 kNN 在大规模训练集上推理偏重？可以从哪个环节缓解？\n<\/li><li>\n距离度量、特征尺度、维度三者分别怎样影响近邻质量？各举一个缓解手段。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "k 近邻（kNN）：距离度量、多数表决与 k 值选择"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：图解机器学习算法.pdf · p.130<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">k 近邻（kNN）：距离度量、多数表决与 k 值选择<\/a><\/span><\/div><h1>k-means 聚类：质心更新、簇内平方和与初始化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch04（原书 §3.5 算法 14：k-means 算法，PDF 第 130–135 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>没有答案标签时，需要把相似样本归成组：市场分析中划分用户群，计算机视觉中归纳图像模式。困难在于组的边界不能靠标签判定，只能依据样本间距离。k-means 用簇质心代表一组样本，反复把样本分给最近质心、再按组内均值更新质心，直到归属稳定，得到紧凑的若干簇。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>聚类<\/strong>：按相似性把无标签数据汇总成簇的任务；簇内样本彼此接近，簇间距离较远。<\/p>\n<p><strong>质心（重心）<\/strong>：一个簇的代表点，取簇内各特征坐标的平均值：<\/p>\n<div class=\"katex-block\">\\mu_k=\\frac{1}{n_k}\\sum_{\\mathbf{x}_i\\in C_k}\\mathbf{x}_i.<\/div>\n<p><strong>k-means 四步<\/strong>（原书 §3.5，PDF 第 130–131 页）：<\/p>\n<ol><li>\n随机选 <span class=\"katex-inline\">k<\/span> 个数据点作为初始质心；\n<\/li><li>\n计算各点与质心距离，归入最近质心所在簇；\n<\/li><li>\n求每簇样本均值，作为新质心；\n<\/li><li>\n重复分配与更新，直到样本不再换簇或达到最大步数。\n<\/ol>\n<p><strong>簇内平方和（SSE）<\/strong>：簇内各点到质心距离平方之和，衡量簇的紧凑程度；总 SSE 为各簇 SSE 之和。<\/p>\n<p><strong><span class=\"katex-inline\">k<\/span> 与初始化<\/strong>：簇数 <span class=\"katex-inline\">k<\/span> 是超参数，需训练前设定；初始质心选得不好（如初始质心过近）会使训练陷入局部较差结果，k-means++ 选择彼此尽可能远的点作为起点（PDF 第 131 页）。<\/p>\n<p>正例：二维人工数据分成 3 簇，质心落在各组中心。反例：初始质心重合或过近时，样本被强行拉向同一簇，收敛后簇结构畸形。<\/p>\n<h2>原理推导<\/h2>\n<p>k-means 优化的是簇内平方和<\/p>\n<div class=\"katex-block\">SSE=\\sum_{k=1}^{k}\\sum_{\\mathbf{x}_i\\in C_k}\\|\\mathbf{x}_i-\\mu_k\\|^2.<\/div>\n<p>固定质心时，分配步骤把每点判给最近质心，使该点到质心距离最小；固定归属时，均值是使簇内平方和最小的代表点（离差平方和在均值处取最小）。两步交替分别固定一部分变量优化另一部分，SSE 单调不增，直到归属不再变化。<\/p>\n<p>算法不保证全局最优：SSE 目标非凸，初值不同可能收敛到不同局部解。常用多次随机初始化取 SSE 最低的结果；<span class=\"katex-inline\">k<\/span> 的选择可看 Elbow 曲线——SSE 随 <span class=\"katex-inline\">k<\/span> 下降，拐点处簇数与紧凑度取得平衡。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：簇形近似凸状、规模可比；特征尺度对齐；样本量足以支撑各簇均值估计。\n<\/li><li>\n边界一：k-means 对非凸簇形、密度差异大的簇效果差；球形分离结构之外需换 DBSCAN、混合高斯等方法。\n<\/li><li>\n边界二：质心受离群点拉动，极端样本会偏移整簇中心。\n<\/li><li>\n失败案例：<span class=\"katex-inline\">k=1<\/span> 全部点一簇，SSE 最大；<span class=\"katex-inline\">k<\/span> 等于样本数每点一簇，SSE 为零但无概括结构。簇数不能只看 SSE 单调下降。\n<\/li><li>\n失败案例：未标准化时大尺度特征支配距离，簇沿大尺度维度划分，结构被量纲扭曲。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>k-means vs kNN<\/strong>：k-means 无监督分组，质心是簇代表；kNN 有监督表决，邻居带标签。两者都用距离，但前者找结构、后者做预测。\n<\/li><li>\n<strong>质心 vs 中位数<\/strong>：质心取均值，对平方距离最优；几何中位数对绝对距离稳健。k-means 用均值，故对离群点敏感。\n<\/li><li>\n<strong>聚类簇 vs 真实类别<\/strong>：簇是相对编号，不等同业务类别；簇的含义要事后结合特征解释，不能把簇标签当答案使用。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 无监督任务判定，c07 距离度量直觉。后继：c09 PCA 把高维样本投影到低维后再聚类，可视化更清晰；c10 评估框架说明无监督结果没有标准答案对错，只能用内部紧凑度与业务解释检验。k-means 的「分配—更新」交替优化，是理解 EM 类迭代算法的基础形式。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（k-means 聚类：质心更新、簇内平方和与初始化）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：质心更新规则、SSE 下降与初始化影响<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把 k-means 推到底，往回追六层前提：<\/p>\n<ol><li>\n<strong>任务是无监督聚类<\/strong>：没有答案标签，分组依据只能是样本间距离与紧凑度。\n<\/li><li>\n<strong>样本用特征向量表示<\/strong>：各样本在同一空间，距离与均值才有定义。\n<\/li><li>\n<strong>簇由质心代表<\/strong>：质心是簇内坐标均值，是使簇内平方和最小的代表点。\n<\/li><li>\n<strong>分配步骤固定质心优化归属<\/strong>：每点判给最近质心，局部降低该点距离平方。\n<\/li><li>\n<strong>更新步骤固定归属优化质心<\/strong>：簇内均值使离差平方和取最小。\n<\/li><li>\n<strong>迭代收敛与初值风险<\/strong>：两步交替 SSE 单调不增，但目标非凸，初值影响局部解。\n<\/ol>\n<p>依赖链方向：无监督分组 → 向量空间 → 质心定义 → 分配步 → 更新步 → 收敛与初始化。任何一层断掉，比如质心不用均值而用任取样本，更新步就不再降低簇内平方和。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：写出目标函数<\/h3>\n<p>设簇 <span class=\"katex-inline\">C_k<\/span> 含 <span class=\"katex-inline\">n_k<\/span> 个样本，质心 <span class=\"katex-inline\">\\mu_k<\/span>。簇内平方和<\/p>\n<div class=\"katex-block\">SSE=\\sum_{k=1}^{K}\\sum_{\\mathbf{x}_i\\in C_k}\\|\\mathbf{x}_i-\\mu_k\\|^2.<\/div>\n<p>展开为各维离差平方和。目标是把样本划分成 <span class=\"katex-inline\">K<\/span> 簇，使总 SSE 最小。<\/p>\n<h3>第二步：分配步（固定质心）<\/h3>\n<p>质心 <span class=\"katex-inline\">\\mu_1,\\dots,\\mu_K<\/span> 固定时，对每个样本 <span class=\"katex-inline\">\\mathbf{x}_i<\/span> 选最近质心：<\/p>\n<div class=\"katex-block\">c_i=\\arg\\min_k\\|\\mathbf{x}_i-\\mu_k\\|.<\/div>\n<p>这一步使每个样本到所属质心的距离局部最小，等价于在质心不动条件下优化归属。<\/p>\n<h3>第三步：更新步（固定归属）<\/h3>\n<p>簇归属固定后，质心取簇内均值：<\/p>\n<div class=\"katex-block\">\\mu_k=\\frac{1}{n_k}\\sum_{\\mathbf{x}_i\\in C_k}\\mathbf{x}_i.<\/div>\n<p>依据：离差平方和 <span class=\"katex-inline\">\\sum(x_i-\\mu)^2<\/span> 对 <span class=\"katex-inline\">\\mu<\/span> 求导置零，<span class=\"katex-inline\">2\\sum(x_i-\\mu)=0<\/span>，解出 <span class=\"katex-inline\">\\mu=\\bar x<\/span>。均值是平方距离意义下的最优代表点。<\/p>\n<h3>第四步：收敛性<\/h3>\n<p>分配步与更新步交替，每步都不增大 SSE；样本归属有限种组合，过程必然在有限步内稳定。稳定条件是没有样本换簇，或达到预设最大步数。SSE 单调下降不增，但目标非凸，停在哪个局部解依赖初值。<\/p>\n<h3>第五步：簇数与初始化<\/h3>\n<p><span class=\"katex-inline\">K<\/span> 是超参数。Elbow 方法：画 SSE 随 <span class=\"katex-inline\">K<\/span> 下降曲线，拐点处新增簇带来的紧凑度收益变小，作为簇数参考。初始化用 k-means++：先随机一点，再按与已有质心距离平方成比例的概率选下一个，使初始质心彼此远离，降低陷入坏局部解的概率。<\/p>\n<h2>数值算例一：四点一轮质心更新<\/h2>\n<p>样本 <span class=\"katex-inline\">A(1,1)<\/span>、<span class=\"katex-inline\">B(1,2)<\/span>、<span class=\"katex-inline\">C(8,8)<\/span>、<span class=\"katex-inline\">D(9,8)<\/span>，<span class=\"katex-inline\">K=2<\/span>，初值 <span class=\"katex-inline\">\\mu_1=A<\/span>、<span class=\"katex-inline\">\\mu_2=C<\/span>。<\/p>\n<ol><li>\n距离分配：\n<ul>\n<li>\n<span class=\"katex-inline\">B<\/span> 到 <span class=\"katex-inline\">\\mu_1<\/span> 欧氏距离 <span class=\"katex-inline\">|1-1|+|2-1|=1<\/span>（欧氏同值），到 <span class=\"katex-inline\">\\mu_2<\/span> 距离 <span class=\"katex-inline\">\\sqrt{(8-1)^2+(8-2)^2}=\\sqrt{85}\\approx9.22<\/span>，归入簇 1。\n<\/li><li>\n<span class=\"katex-inline\">D<\/span> 到 <span class=\"katex-inline\">\\mu_2<\/span> 距离 <span class=\"katex-inline\">|9-8|+|8-8|=1<\/span>，到 <span class=\"katex-inline\">\\mu_1<\/span> 距离 <span class=\"katex-inline\">\\sqrt{8^2+7^2}\\approx10.63<\/span>，归入簇 2。\n<\/li><li>\n簇 1：<span class=\"katex-inline\">\\{A,B\\}<\/span>；簇 2：<span class=\"katex-inline\">\\{C,D\\}<\/span>。\n<\/li><li>\n更新质心：\n<\/ul>\n<\/ol>\n<div class=\"katex-block\">\\mu_1'=\\left(\\frac{1+1}{2},\\frac{1+2}{2}\\right)=(1,1.5),<\/div>\n<div class=\"katex-block\">\\mu_2'=\\left(\\frac{8+9}{2},\\frac{8+8}{2}\\right)=(8.5,8).<\/div>\n<ol><li>\n再分配核对：<span class=\"katex-inline\">A<\/span> 到 <span class=\"katex-inline\">\\mu_1&#x27;<\/span> 距离 0.5，<span class=\"katex-inline\">B<\/span> 到 <span class=\"katex-inline\">\\mu_1&#x27;<\/span> 距离 0.5；<span class=\"katex-inline\">C<\/span> 到 <span class=\"katex-inline\">\\mu_2&#x27;<\/span> 距离 0.5，<span class=\"katex-inline\">D<\/span> 到 <span class=\"katex-inline\">\\mu_2&#x27;<\/span> 距离 0.5；无样本换簇，收敛。\n<\/li><li>\n簇内平方和：簇 1 中 <span class=\"katex-inline\">A:(0,-0.5)^2=0.25<\/span>，<span class=\"katex-inline\">B:(0,0.5)^2=0.25<\/span>，合计 0.5；簇 2 中 <span class=\"katex-inline\">C:(-0.5,0)^2=0.25<\/span>，<span class=\"katex-inline\">D:(0.5,0)^2=0.25<\/span>，合计 0.5；总 SSE <span class=\"katex-inline\">=1.0<\/span>。\n<\/li><li>\n均值核对：<span class=\"katex-inline\">\\mu_1&#x27;<\/span> 两坐标正是 A、B 对应坐标平均，满足更新步公式。\n<\/ol>\n<h2>数值算例二：初始化不同导致的结果对照<\/h2>\n<p>同一四点，换一组初值：<span class=\"katex-inline\">\\mu_1=B<\/span>、<span class=\"katex-inline\">\\mu_2=D<\/span>。<\/p>\n<ol><li>\n首轮分配：<span class=\"katex-inline\">A<\/span> 距 <span class=\"katex-inline\">B<\/span> 为 1、距 <span class=\"katex-inline\">D<\/span> 约 <span class=\"katex-inline\">\\sqrt{8^2+6^2}=10<\/span>，归簇 1；<span class=\"katex-inline\">C<\/span> 距 <span class=\"katex-inline\">D<\/span> 为 1、距 <span class=\"katex-inline\">B<\/span> 约 9.22，归簇 2。\n<\/li><li>\n更新后质心与算例一相同：<span class=\"katex-inline\">\\mu_1=(1,1.5)<\/span>、<span class=\"katex-inline\">\\mu_2=(8.5,8)<\/span>，SSE 仍为 1.0。此例两组初值收敛到同一解。\n<\/li><li>\n坏初值情形：若两初始质心都落在左侧两点附近，首轮把 C、D 中的一个拉向左簇，更新后质心偏移，可能形成「一大一小」畸形簇；SSE 高于对称簇解。\n<\/li><li>\n对照策略：多次随机初始化，取最终 SSE 最低的划分；k-means++ 从起点上拉开质心距离，减少这类坏解。\n<\/li><li>\nElbow 读数：设该数据 <span class=\"katex-inline\">K=1<\/span> 时 SSE 约 42.5，<span class=\"katex-inline\">K=2<\/span> 时 1.0，<span class=\"katex-inline\">K=3<\/span> 时 0.8，<span class=\"katex-inline\">K=4<\/span> 时 0。<span class=\"katex-inline\">K<\/span> 从 1 到 2 下降剧烈，2 之后下降变缓，拐点在 <span class=\"katex-inline\">K=2<\/span>，与数据自然簇数一致。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<ul><li>\n<strong>案例一：初始质心过近<\/strong>。两起点挤在同一区域，样本被强行归入一簇，收敛后簇大小悬殊。修正：k-means++ 初始化，多次重启取低 SSE 解。\n<\/li><li>\n<strong>案例二：非凸簇形硬套 k-means<\/strong>。月牙形或环形分布被质心直线切分，簇内混合两种结构。修正：换密度聚类或谱聚类，不能只调 <span class=\"katex-inline\">k<\/span>。\n<\/li><li>\n<strong>案例三：量纲不齐<\/strong>。大尺度特征支配距离，簇沿该维度切开。修正：聚类前标准化各特征。\n<\/li><li>\n<strong>案例四：只按 SSE 定簇数<\/strong>。<span class=\"katex-inline\">K<\/span> 增大 SSE 必然下降，到 <span class=\"katex-inline\">K=n<\/span> 时为零，但没有概括价值。修正：结合 Elbow 拐点与业务可解释性选 <span class=\"katex-inline\">K<\/span>。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：k-means 四步是什么？答：选初始质心、按最近距离分配、按均值更新质心、重复至稳定。\n<\/li><li>\n问：质心怎样计算？答：簇内各特征坐标取平均。\n<\/li><li>\n问：SSE 衡量什么？答：簇内样本到质心距离平方和，紧凑程度。\n<\/li><li>\n问：为什么结果可能依赖初值？答：目标非凸，迭代停在局部解，需多次初始化比较。\n<\/li><li>\n问：簇标签能当真实类别吗？答：不能，簇是相对编号，业务含义事后人工解释。\n<\/ul>\n<h2>补充推导：交替优化与 EM 结构<\/h2>\n<p>k-means 的分配步与更新步是「固定一部分、优化另一部分」的交替优化：固定质心优化归属，固定归属优化质心。这种结构与期望最大化（EM）算法同构——E 步按当前模型分配责任，M 步按责任更新模型参数。混合高斯分布（原书 §3.6）就是 EM 在软分配上的推广，k-means 可看作硬分配、簇形为球形的特例。<\/p>\n<p>每步 SSE 单调不增：分配步把点判给更近质心，该点距离平方下降；更新步用均值替换代表点，簇内平方和进一步减小。样本归属组合有限，过程必在有限步稳定；稳定不代表全局最优，只代表当前初值下的局部收敛。多次初始化取低 SSE 解，是工程上抵消局部解风险的常规做法。<\/p>\n<h2>簇形状、离群点与评估<\/h2>\n<p>k-means 隐含假设簇近似球形、规模可比、方差相近。月牙、环形等非凸结构会被直线切分；密度悬殊的簇会被大簇吞并。质心是均值，对离群点敏感，极端样本拉动整簇中心；稳健场景可考虑中位数代表或先剔除离群点。<\/p>\n<p>聚类没有标准答案对错：内部指标看簇内紧凑度（SSE、轮廓系数），外部解释看簇与业务含义是否对应。簇标签是相对编号，不能当作真实类别回流到监督训练。<span class=\"katex-inline\">K<\/span> 选择结合 Elbow 拐点、业务可分性与后续任务表现，不能只追 SSE 单调下降。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n三点 <span class=\"katex-inline\">(0,0)<\/span>、<span class=\"katex-inline\">(2,0)<\/span>、<span class=\"katex-inline\">(10,1)<\/span> 初始质心为前两点，写出首轮归属与更新后质心。\n<\/li><li>\n推导为什么均值是使簇内平方和最小的代表点（对 <span class=\"katex-inline\">\\mu<\/span> 求导置零）。\n<\/li><li>\n<span class=\"katex-inline\">K=1<\/span> 与 <span class=\"katex-inline\">K=n<\/span> 时 SSE 各是多少？为什么这两个极端都不可取？\n<\/li><li>\nk-means 与 kNN 都用距离，两者在有无标签、目标上有何不同？\n<\/li><li>\n非凸簇形数据上 k-means 会怎样失效？列举两种替代思路。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "k-means 聚类：质心更新、簇内平方和与初始化"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：图解机器学习算法.pdf · p.107<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">线性回归：最小二乘目标函数、正规方程与梯度下降一步<\/a><\/span><\/div><h1>PCA 主成分分析：协方差矩阵、特征值分解与降维投影<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（原书 §3.1 算法 10：PCA，PDF 第 107–111 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>多变量数据中特征之间往往相关，直接分析几十个变量既复杂又冗余。需要在保留数据主要特征的前提下，用少量新变量表示原数据。PCA 走「构造新变量」的降维路线：找一组正交新轴，使数据在第一根轴上方差最大，其后依次取剩余方差最大的正交方向，再把样本投影到这组轴上得到主成分得分。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>降维两种方式<\/strong>：只挑选重要变量舍弃其余；或基于原变量线性组合构造新变量。PCA 属于后者（原书 §3.1，PDF 第 107 页）。<\/p>\n<p><strong>主成分<\/strong>：以原变量线性组合表示的低维新轴；按重要度从高到低称第一主成分、第二主成分。第一主成分方向数据方差最大，包含最多原始特点。<\/p>\n<p><strong>协方差矩阵<\/strong>：对中心化数据，元素 <span class=\"katex-inline\">C_{jj&#x27;}=\\frac1n\\sum_i(x_{ij}-\\bar x_j)(x_{ij&#x27;}-\\bar x_{j&#x27;})<\/span>，对角线是各变量方差，非对角是变量间协方差。<\/p>\n<p><strong>特征值问题<\/strong>：对方阵 <span class=\"katex-inline\">A<\/span>，寻找 <span class=\"katex-inline\">\\lambda<\/span> 与非零向量 <span class=\"katex-inline\">\\mathbf{v}<\/span> 使<\/p>\n<div class=\"katex-block\">A\\mathbf{v}=\\lambda\\mathbf{v}.<\/div>\n<p><span class=\"katex-inline\">\\mathbf{v}<\/span> 是特征向量，<span class=\"katex-inline\">\\lambda<\/span> 是对应特征值；矩阵变换只缩放、不改变该向量方向（PDF 第 108 页）。<\/p>\n<p><strong>投影得分<\/strong>：样本中心化后与主成分方向求内积，得到该主成分上的坐标；取前 <span class=\"katex-inline\">m<\/span> 个主成分即完成降维。<\/p>\n<p><strong>方差解释比<\/strong>：<span class=\"katex-inline\">\\lambda_j/\\sum_l\\lambda_l<\/span>，第 <span class=\"katex-inline\">j<\/span> 个主成分保留的方差比例；前 <span class=\"katex-inline\">m<\/span> 个累计比衡量降维损失。<\/p>\n<p>正例：两个相关变量的斜向散点，PCA 转出沿铺展方向的正交轴。反例：变量量纲不齐时，协方差被大尺度变量支配，主成分反映数值大小而非结构相关，需先标准化。<\/p>\n<h2>原理推导<\/h2>\n<p>PCA 三步（原书 §3.1，PDF 第 108 页）：计算协方差矩阵；对其求解特征值问题得特征向量与特征值；按主成分方向表示数据。<\/p>\n<p>最大化方差的正交轴与协方差特征向量等价：沿单位方向 <span class=\"katex-inline\">\\mathbf{v}<\/span> 的投影方差为 <span class=\"katex-inline\">\\mathbf{v}^TC\\mathbf{v}<\/span>，在 <span class=\"katex-inline\">\\|\\mathbf{v}\\|=1<\/span> 约束下求最大值，拉格朗日条件给出 <span class=\"katex-inline\">C\\mathbf{v}=\\lambda\\mathbf{v}<\/span>。方差最大方向正是最大特征值对应特征向量；次大方向与它正交，对应次大特征值，依此类推。<\/p>\n<p>特征值大小对应该方向方差，特征向量给出方向。投影后各主成分互不相关，原变量间的相关被正交轴吸收。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：变量间存在线性相关，主要结构呈连续铺展；样本量足以稳定估计协方差。\n<\/li><li>\n边界一：PCA 只捕捉线性结构，弯曲的非线性分布用主成分压缩会损失信息，需核 PCA 或流形方法（本书 LLE、t-SNE 属此类）。\n<\/li><li>\n边界二：主成分是线性组合，不可直接解释为「最重要的原变量」；载荷表示各原变量对成分的贡献。\n<\/li><li>\n失败案例：未标准化做 PCA，大尺度变量凭方差占住前几个主成分，降维结果被量纲主导。\n<\/li><li>\n失败案例：保留主成分过少，把有判别信息的方差方向截掉，后续分类或聚类表现下降。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>PCA vs 特征选择<\/strong>：PCA 造新变量（线性组合），特征选择保留原变量子集；前者压缩相关，后者剔除冗余。\n<\/li><li>\n<strong>PCA vs k-means<\/strong>：PCA 沿方差方向旋转坐标系，属降维；k-means 按距离分组，属聚类。两者常配合：先 PCA 可视化，再聚类。\n<\/li><li>\n<strong>特征值 vs 特征向量<\/strong>：特征向量是方向，特征值是该方向方差大小；同一特征向量乘常数仍是同一方向。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 最小二乘的二次型与方差概念，c01 无监督任务。后继：c08 聚类可在 PCA 投影后的低维空间进行；c10 评估中降维是否保留信息，用累计方差解释比衡量。PCA 的协方差—特征值机制，是理解 LSA、NMF 等其他无监督分解的对照基准。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（PCA 主成分分析：协方差矩阵、特征值分解与降维投影）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：协方差矩阵、特征值分解与主成分投影<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把 PCA 推到底，往回追六层前提：<\/p>\n<ol><li>\n<strong>任务是无监督降维<\/strong>：没有标签，压缩依据是数据自身方差与相关结构。\n<\/li><li>\n<strong>数据先中心化<\/strong>：各变量减去自身均值，协方差只刻画围绕中心的离差。\n<\/li><li>\n<strong>相关结构汇总进协方差矩阵<\/strong>：对角线是方差，非对角是协方差。\n<\/li><li>\n<strong>方差最大方向是优化目标<\/strong>：沿单位轴的投影方差要最大化，约束轴长度为 1。\n<\/li><li>\n<strong>极值条件归结为特征值问题<\/strong>：拉格朗日条件给出 <span class=\"katex-inline\">C\\mathbf{v}=\\lambda\\mathbf{v}<\/span>，特征向量即主成分方向。\n<\/li><li>\n<strong>投影得分是样本在主成分上的坐标<\/strong>：取前若干主成分完成降维，累计方差比衡量保留程度。\n<\/ol>\n<p>依赖链方向：无监督压缩 → 中心化 → 协方差矩阵 → 方差最大准则 → 特征分解 → 投影得分。任何一层断掉，比如未中心化就求协方差，均值差异会混入结构方向。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：中心化与协方差矩阵<\/h3>\n<p>样本 <span class=\"katex-inline\">i<\/span> 的第 <span class=\"katex-inline\">j<\/span> 变量为 <span class=\"katex-inline\">x_{ij}<\/span>，变量均值 <span class=\"katex-inline\">\\bar x_j<\/span>，中心化值 <span class=\"katex-inline\">\\tilde x_{ij}=x_{ij}-\\bar x_j<\/span>。协方差矩阵<\/p>\n<div class=\"katex-block\">C_{jj'}=\\frac{1}{n}\\sum_{i=1}^{n}\\tilde x_{ij}\\tilde x_{ij'}.<\/div>\n<p><span class=\"katex-inline\">C_{jj}<\/span> 是第 <span class=\"katex-inline\">j<\/span> 变量方差，<span class=\"katex-inline\">C_{jj&#x27;}<\/span> 是变量 <span class=\"katex-inline\">j,j&#x27;<\/span> 的协方差；<span class=\"katex-inline\">C<\/span> 对称半正定。<\/p>\n<h3>第二步：沿方向的投影方差<\/h3>\n<p>取单位向量 <span class=\"katex-inline\">\\mathbf{v}<\/span>（<span class=\"katex-inline\">\\|\\mathbf{v}\\|=1<\/span>），样本在该方向投影为 <span class=\"katex-inline\">\\mathbf{v}^T\\tilde{\\mathbf{x}}_i<\/span>，投影方差<\/p>\n<div class=\"katex-block\">\\operatorname{Var}(\\mathbf{v})=\\frac1n\\sum_i(\\mathbf{v}^T\\tilde{\\mathbf{x}}_i)^2=\\mathbf{v}^TC\\mathbf{v}.<\/div>\n<p>PCA 要在 <span class=\"katex-inline\">\\|\\mathbf{v}\\|=1<\/span> 下最大化 <span class=\"katex-inline\">\\mathbf{v}^TC\\mathbf{v}<\/span>。<\/p>\n<h3>第三步：极值条件与特征值问题<\/h3>\n<p>拉格朗日函数 <span class=\"katex-inline\">L=\\mathbf{v}^TC\\mathbf{v}-\\lambda(\\mathbf{v}^T\\mathbf{v}-1)<\/span>，对 <span class=\"katex-inline\">\\mathbf{v}<\/span> 求导置零：<\/p>\n<div class=\"katex-block\">C\\mathbf{v}=\\lambda\\mathbf{v}.<\/div>\n<p>这正是特征值问题：<span class=\"katex-inline\">\\mathbf{v}<\/span> 是 <span class=\"katex-inline\">C<\/span> 的特征向量，<span class=\"katex-inline\">\\lambda<\/span> 是特征值。代入目标得 <span class=\"katex-inline\">\\mathbf{v}^TC\\mathbf{v}=\\lambda<\/span>，即该方向方差等于对应特征值。最大方差方向对应最大特征值，次大方向与它正交，对应次大特征值。<\/p>\n<h3>第四步：投影与降维<\/h3>\n<p>中心化样本 <span class=\"katex-inline\">\\tilde{\\mathbf{x}}_i<\/span> 与第 <span class=\"katex-inline\">j<\/span> 主成分方向 <span class=\"katex-inline\">\\mathbf{v}_j<\/span> 内积，得分<\/p>\n<div class=\"katex-block\">s_{ij}=\\mathbf{v}_j^T\\tilde{\\mathbf{x}}_i.<\/div>\n<p>取前 <span class=\"katex-inline\">m<\/span> 个特征向量组成投影矩阵，把原 <span class=\"katex-inline\">d<\/span> 维样本压成 <span class=\"katex-inline\">m<\/span> 维。累计方差解释比<\/p>\n<div class=\"katex-block\">R_m=\\frac{\\sum_{j=1}^{m}\\lambda_j}{\\sum_{l=1}^{d}\\lambda_l}.<\/div>\n<p><span class=\"katex-inline\">R_m<\/span> 越接近 1，降维保留的信息越多。<\/p>\n<h3>第五步：标准化的位置<\/h3>\n<p>各变量量纲不同时，方差被大尺度变量主导。PCA 前先把每个变量标准化为均值 0、方差 1，协方差变成相关系数矩阵，主成分反映结构相关而非数值大小。<\/p>\n<h2>数值算例一：共线三点的协方差与特征值<\/h2>\n<p>样本 <span class=\"katex-inline\">(1,2)<\/span>、<span class=\"katex-inline\">(3,4)<\/span>、<span class=\"katex-inline\">(5,6)<\/span>。<\/p>\n<ol><li>\n均值：<span class=\"katex-inline\">\\bar x=(1+3+5)/3=3<\/span>，<span class=\"katex-inline\">\\bar y=(2+4+6)/3=4<\/span>。\n<\/li><li>\n中心化：<span class=\"katex-inline\">(-2,-2)<\/span>、<span class=\"katex-inline\">(0,0)<\/span>、<span class=\"katex-inline\">(2,2)<\/span>。\n<\/li><li>\n协方差（除以 n）：\n<\/ol>\n<div class=\"katex-block\">C_{xx}=\\frac{4+0+4}{3}=\\frac83,\\quad C_{yy}=\\frac{4+0+4}{3}=\\frac83,\\quad C_{xy}=\\frac{4+0+4}{3}=\\frac83,<\/div>\n<div class=\"katex-block\">C=\\begin{pmatrix}8/3&8/3\\\\8/3&8/3\\end{pmatrix}.<\/div>\n<ol><li>\n特征值：迹 <span class=\"katex-inline\">=16/3<\/span>，行列式 <span class=\"katex-inline\">=(8/3)^2-(8/3)^2=0<\/span>，故 <span class=\"katex-inline\">\\lambda_1=16/3\\approx5.333<\/span>，<span class=\"katex-inline\">\\lambda_2=0<\/span>。\n<\/li><li>\n特征向量：<span class=\"katex-inline\">\\lambda_1<\/span> 对应 <span class=\"katex-inline\">(1,1)/\\sqrt2<\/span>，<span class=\"katex-inline\">\\lambda_2<\/span> 对应 <span class=\"katex-inline\">(1,-1)/\\sqrt2<\/span>，两方向正交。\n<\/li><li>\n投影得分（第一主成分）：<span class=\"katex-inline\">(-2-2)/\\sqrt2=-4/\\sqrt2\\approx-2.828<\/span>，<span class=\"katex-inline\">0<\/span>，<span class=\"katex-inline\">4/\\sqrt2\\approx2.828<\/span>。\n<\/li><li>\n方差解释比：<span class=\"katex-inline\">\\lambda_1/(\\lambda_1+\\lambda_2)=100\\%<\/span>，数据完全落在第一主成分方向，第二主成分无方差。\n<\/ol>\n<h2>数值算例二：对称协方差的特征值与压缩<\/h2>\n<p>设协方差矩阵<\/p>\n<div class=\"katex-block\">C=\\begin{pmatrix}2&1\\\\1&2\\end{pmatrix}.<\/div>\n<ol><li>\n特征方程 <span class=\"katex-inline\">\\det(C-\\lambda I)=(2-\\lambda)^2-1=0<\/span>，解得 <span class=\"katex-inline\">\\lambda_1=3<\/span>，<span class=\"katex-inline\">\\lambda_2=1<\/span>。\n<\/li><li>\n对应特征向量：<span class=\"katex-inline\">\\lambda_1=3<\/span> 为 <span class=\"katex-inline\">(1,1)/\\sqrt2<\/span>，<span class=\"katex-inline\">\\lambda_2=1<\/span> 为 <span class=\"katex-inline\">(1,-1)/\\sqrt2<\/span>。\n<\/li><li>\n累计方差：取第一主成分 <span class=\"katex-inline\">R_1=3/(3+1)=0.75<\/span>；取前两个 <span class=\"katex-inline\">R_2=1<\/span>。\n<\/li><li>\n投影：中心化样本 <span class=\"katex-inline\">\\tilde{\\mathbf{x}}=(a,b)<\/span>，第一成分得分 <span class=\"katex-inline\">(a+b)/\\sqrt2<\/span>，第二成分得分 <span class=\"katex-inline\">(a-b)/\\sqrt2<\/span>。\n<\/li><li>\n压缩判断：若业务允许损失 25% 方差，降到一维即可；要求保留判别信息则需结合下游验证，不能只看方差比。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<ul><li>\n<strong>案例一：未标准化就分解<\/strong>。一个变量范围 0–1000，方差天然占优，前几个主成分跟着大尺度变量走，结构相关被量纲掩盖。修正：先标准化各变量到单位方差。\n<\/li><li>\n<strong>案例二：把主成分当原变量<\/strong>。主成分是线性组合，载荷是各原变量对成分的贡献；直接说「第一主成分就是某原变量」是概念错误。\n<\/li><li>\n<strong>案例三：非线性结构硬压<\/strong>。月牙或环形分布沿曲线铺展，线性主成分把曲线两端压到同一方向，信息损失大。修正：核 PCA、LLE、t-SNE 等非线性降维。\n<\/li><li>\n<strong>案例四：截得过早<\/strong>。只留方差最大的一两个成分，把带判别信息的次大方向删掉，后续分类聚类下降。修正：按累计方差比与下游验证共同确定保留维度。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：PCA 降维属于哪条路线？答：基于原变量线性组合构造新变量，不是直接挑选原变量。\n<\/li><li>\n问：协方差矩阵对角线与非对角各是什么？答：对角线是各变量方差，非对角是变量间协方差。\n<\/li><li>\n问：主成分方向与特征值什么关系？答：方向是特征向量，特征值是该方向投影方差。\n<\/li><li>\n问：方差解释比怎样计算？答：特征值占比 <span class=\"katex-inline\">\\lambda_j/\\sum_l\\lambda_l<\/span>，累计比衡量降维保留程度。\n<\/li><li>\n问：PCA 捕捉哪种结构？答：线性相关结构；非线性弯曲分布需要别的方法。\n<\/ul>\n<h2>补充推导：载荷、重建与信息损失<\/h2>\n<p>主成分向量各分量称载荷，表示原变量对该成分的贡献方向与大小。载荷绝对值大的变量，在该成分上占主导；成分得分是样本在新轴上的坐标。载荷不等于「最重要原变量」，它是线性组合的权重，解读时要连同符号一起看。<\/p>\n<p>降维后可把得分投影回原空间做重建：<span class=\"katex-inline\">\\tilde{\\mathbf{x}}_i\\approx\\sum_{j=1}^{m}s_{ij}\\mathbf{v}_j<\/span>。重建误差等于被截掉的 <span class=\"katex-inline\">d-m<\/span> 个主成分方向上的方差之和；累计方差解释比 <span class=\"katex-inline\">R_m<\/span> 越高，重建越接近原数据。选 <span class=\"katex-inline\">m<\/span> 时对照两条线：累计方差比是否达标，下游分类或聚类表现是否下降；只追方差比可能丢掉判别方向。<\/p>\n<p>PCA 与中心化、标准化的顺序：先减均值消除基准位置，再决定是否按方差标准化。量纲差异大时必须标准化，使协方差矩阵接近相关系数矩阵；各变量同量纲、方差可比时可直接用协方差矩阵。分解得到的主成分互不相关，原变量间的相关被正交轴吸收，这也是 PCA 用于去相关与可视化的依据。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n中心化三点 <span class=\"katex-inline\">(0,0)<\/span>、<span class=\"katex-inline\">(2,2)<\/span>、<span class=\"katex-inline\">(4,4)<\/span>，写出协方差矩阵并求特征值。\n<\/li><li>\n为什么最大化 <span class=\"katex-inline\">\\mathbf{v}^TC\\mathbf{v}<\/span> 的条件归结为 <span class=\"katex-inline\">C\\mathbf{v}=\\lambda\\mathbf{v}<\/span>？写出拉格朗日求导步骤。\n<\/li><li>\n特征值 5、3、2、1 时，保留前两个主成分的累计方差解释比是多少？\n<\/li><li>\n标准化在 PCA 中解决什么问题？不标准化会出现什么偏差？\n<\/li><li>\nPCA 与 k-means 怎样配合使用？各自处理数据的哪个侧面？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "PCA 主成分分析：协方差矩阵、特征值分解与降维投影"}, "c10": {"html": "<div class=\"source-badge\">📖 出处：图解机器学习算法.pdf · p.153<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">线性回归：最小二乘目标函数、正规方程与梯度下降一步<\/a><\/span><\/div><h1>模型评估与过拟合：混淆矩阵、精确率/召回率/F1、交叉验证与超参数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch04（原书 §4.1 评估方法，PDF 第 153–175 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>模型在训练数据上表现好，不等于对新数据可用。需要一套口径判断泛化能力：分类用什么指标、回归用什么指标，怎样划分数据避免自欺，超参数在哪里选。过拟合是训练误差低而验证误差高的现象；评估概念要回答「怎样检验模型对未见数据的预测能力」，并区分学习参数与超参数的分工。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>混淆矩阵<\/strong>（二元分类）：真实与预测交叉的四格表——<span class=\"katex-inline\">TN<\/span> 真阴性、<span class=\"katex-inline\">FP<\/span> 假阳性、<span class=\"katex-inline\">FN<\/span> 假阴性、<span class=\"katex-inline\">TP<\/span> 真阳性（原书 §4.1，PDF 第 154 页）。<\/p>\n<p><strong>分类指标<\/strong>：<\/p>\n<ul><li>\n正确率 <span class=\"katex-inline\">accuracy=(TP+TN)/(TP+TN+FP+FN)<\/span>；\n<\/li><li>\n精确率 <span class=\"katex-inline\">precision=TP/(TP+FP)<\/span>；\n<\/li><li>\n召回率 <span class=\"katex-inline\">recall=TP/(TP+FN)<\/span>；\n<\/li><li>\nF 值 <span class=\"katex-inline\">F_1=2PR/(P+R)<\/span>，精确率与召回率的调和平均。\n<\/ul>\n<p><strong>回归指标<\/strong>：均方误差 <span class=\"katex-inline\">MSE=\\frac1n\\sum_i(y_i-\\hat y_i)^2<\/span>；决定系数 <span class=\"katex-inline\">R^2=1-SSE/SST<\/span>，<span class=\"katex-inline\">SST=\\sum_i(y_i-\\bar y)^2<\/span>，越接近 1 解释能力越强，误差过大时可为负（PDF 第 160–163 页）。<\/p>\n<p><strong>过拟合<\/strong>：模型对训练数据预测很好、对未参与训练的数据表现差的现象；根源常是模型过于复杂。<strong>泛化能力<\/strong>：模型对未知数据的预测表现（PDF 第 167 页）。<\/p>\n<p><strong>训练/验证划分<\/strong>：留出一部分数据不参与训练，专用于验证；常用 7:3 划分，比例无硬性规定（PDF 第 169 页）。<strong>交叉验证<\/strong>：把训练数据切成若干份，轮流一份做验证、其余训练，多轮平均指标估计泛化。<\/p>\n<p><strong>超参数<\/strong>：训练开始前由人设定、不由拟合更新的参数，如 kNN 的 <span class=\"katex-inline\">k<\/span>、k-means 的 <span class=\"katex-inline\">K<\/span>、正则化强度、SVM 的 <span class=\"katex-inline\">C<\/span> 与核参数。学习参数则是算法在训练数据上更新得到的权重、质心等。<\/p>\n<p>正例：乳腺癌数据混淆矩阵算出四类指标，召回低提示漏诊风险。反例：类别不均衡时正确率 0.99 可能只是多数类占优，AUC 与召回更能反映真实表现（PDF 第 159–160 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>指标从混淆矩阵派生的逻辑：正确率回答「整体判对多少」，精确率回答「被判阳性里真阳性多少」，召回率回答「真阳性里被找出多少」。精确率与召回率此消彼长：上调阳性阈值，召回升、精确率降；F1 把两者压成一个折中分数。<\/p>\n<p>回归指标的差别：MSE 带目标变量量纲，目标方差大时 MSE 天然偏大；<span class=\"katex-inline\">R^2<\/span> 把误差相对基准方差归一化，跨数据集可比。基准模型用均值预测，<span class=\"katex-inline\">R^2=0<\/span>；模型等于基准，<span class=\"katex-inline\">R^2&lt;0<\/span> 说明比均值预测还差。<\/p>\n<p>泛化估计的流程：训练集拟合学习参数，验证集选超参数，最终在未见测试集上报告表现。单次随机划分指标有波动，交叉验证用多轮平均压低这种偶然性。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：任何有监督模型上线前都要在留出数据上评估；类别不均衡场景必须补充精确率、召回率、AUC，不能只看正确率。\n<\/li><li>\n边界一：指标选择服从业务代价。漏诊代价高优先召回，误报代价高优先精确率，两者同等重要看 F1。\n<\/li><li>\n边界二：验证集不能参与训练，也不能反复用同一验证集挑超参数后再在其上报告最终表现，否则评估偏乐观。\n<\/li><li>\n失败案例：全量数据训练、不留验证集，过拟合在部署后才暴露；训练误差低被误当成可用。\n<\/li><li>\n失败案例：把超参数放进拟合过程自动优化，模型在训练集上把超参数也调到最优，泛化估计失真。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>精确率 vs 召回率<\/strong>：前者约束「报出来的阳性准不准」，后者约束「真阳性找全没有」；二者权衡方向相反，不能互相替代。\n<\/li><li>\n<strong>MSE vs <span class=\"katex-inline\">R^2<\/span><\/strong>：MSE 有量纲、看绝对误差；<span class=\"katex-inline\">R^2<\/span> 归一化、看相对基准的解释比例。跨数据集比较用 <span class=\"katex-inline\">R^2<\/span>。\n<\/li><li>\n<strong>学习参数 vs 超参数<\/strong>：前者由数据更新（权重、质心），后者训练前外部设定（<span class=\"katex-inline\">k<\/span>、<span class=\"katex-inline\">\\lambda<\/span>、<span class=\"katex-inline\">C<\/span>）；选择路径不同，不能混在同一优化里。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 回归损失，c04 概率输出，c01 训练/验证划分概念。后继：本章是全书算法的验收出口——第 2、3 章各模型表现都要回到本章指标与交叉验证比较；正则化（c03）、<span class=\"katex-inline\">k<\/span> 选择（c07）、簇数（c08）都通过本章的超参数选择流程确定。评估口径反过来影响建模决策：指标选错，模型比较与调参方向都会错。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（模型评估与过拟合：混淆矩阵、精确率/召回率/F1、交叉验证与超参数）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：混淆矩阵指标、回归决定系数与交叉验证流程<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把评估与过拟合讲到底，往回追七层前提：<\/p>\n<ol><li>\n<strong>模型要在未见数据上检验<\/strong>：训练误差只反映见过的数据，泛化表现必须另取数据估计。\n<\/li><li>\n<strong>任务类型决定指标族<\/strong>：分类走混淆矩阵派生指标，回归走误差平方与决定系数。\n<\/li><li>\n<strong>混淆矩阵是计数基础<\/strong>：四格计数是所有分类指标的原材料，先核对计数再算比例。\n<\/li><li>\n<strong>指标各约束不同侧面<\/strong>：正确率看整体，精确率看预测阳性质量，召回看真阳性覆盖。\n<\/li><li>\n<strong>过拟合是训练/验证误差落差<\/strong>：复杂模型记住噪声，验证误差回升；划分数据才能暴露落差。\n<\/li><li>\n<strong>交叉验证压低划分偶然性<\/strong>：多轮轮流验证，平均指标比单次切片稳定。\n<\/li><li>\n<strong>超参数在训练外部选择<\/strong>：学习参数由拟合更新，超参数靠验证比较，两者路径分开。\n<\/ol>\n<p>依赖链方向：泛化检验 → 任务指标族 → 混淆矩阵计数 → 指标派生 → 过拟合识别 → 验证流程 → 超参数选择。任何一层断掉，比如用正确率评估不均衡数据，指标结论就会偏向多数类。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：搭建混淆矩阵<\/h3>\n<p>二元分类四格：<\/p>\n<ul><li>\n<span class=\"katex-inline\">TN<\/span>：真实阴性、预测阴性；\n<\/li><li>\n<span class=\"katex-inline\">FP<\/span>：真实阴性、预测阳性（误报）；\n<\/li><li>\n<span class=\"katex-inline\">FN<\/span>：真实阳性、预测阴性（漏报）；\n<\/li><li>\n<span class=\"katex-inline\">TP<\/span>：真实阳性、预测阳性。\n<\/ul>\n<p>样本总数 <span class=\"katex-inline\">N=TN+FP+FN+TP<\/span>。所有分类指标由这四个计数派生，先核对计数合计再算比例。<\/p>\n<h3>第二步：派生分类指标<\/h3>\n<div class=\"katex-block\">accuracy=\\frac{TP+TN}{N},<\/div>\n<div class=\"katex-block\">precision=\\frac{TP}{TP+FP},\\qquad recall=\\frac{TP}{TP+FN},<\/div>\n<div class=\"katex-block\">F_1=\\frac{2PR}{P+R}.<\/div>\n<p>精确率分母是所有预测为阳性的样本，召回率分母是所有真实为阳性的样本。<span class=\"katex-inline\">F_1<\/span> 是调和平均，对较小的一侧更敏感：任一项趋近零，<span class=\"katex-inline\">F_1<\/span> 趋近零。<\/p>\n<h3>第三步：回归指标<\/h3>\n<div class=\"katex-block\">MSE=\\frac1n\\sum_i(y_i-\\hat y_i)^2.<\/div>\n<p>决定系数<\/p>\n<div class=\"katex-block\">R^2=1-\\frac{SSE}{SST},\\quad SSE=\\sum_i(y_i-\\hat y_i)^2,\\quad SST=\\sum_i(y_i-\\bar y)^2.<\/div>\n<p><span class=\"katex-inline\">SST<\/span> 是基准模型（用均值预测）的误差平方和；<span class=\"katex-inline\">R^2=1<\/span> 表示无误差，<span class=\"katex-inline\">R^2=0<\/span> 等于基准，<span class=\"katex-inline\">R^2&lt;0<\/span> 比基准还差。MSE 带量纲，<span class=\"katex-inline\">R^2<\/span> 归一化到可比尺度。<\/p>\n<h3>第四步：识别过拟合与泛化<\/h3>\n<p>记录训练误差与验证误差：两者都低是合适；训练低、验证高是过拟合；两者都高是欠拟合。泛化能力指未见数据上的预测表现。防止过拟合的手段包括划分留出数据、正则化约束复杂度、选择合适超参数。<\/p>\n<h3>第五步：交叉验证与超参数<\/h3>\n<p>把训练集切成 <span class=\"katex-inline\">K<\/span> 份，轮流用一份验证、其余 <span class=\"katex-inline\">K-1<\/span> 份训练，重复 <span class=\"katex-inline\">K<\/span> 次取平均指标。超参数（<span class=\"katex-inline\">k<\/span>、<span class=\"katex-inline\">K<\/span>、<span class=\"katex-inline\">\\lambda<\/span>、<span class=\"katex-inline\">C<\/span>、核参数）在这一流程中按验证表现比较；选定后再用全量训练数据拟合，最终测试集只报告一次表现。<\/p>\n<h2>数值算例一：乳腺癌混淆矩阵四类指标<\/h2>\n<p>沿用原书结果（PDF 第 154 页）：<span class=\"katex-inline\">TN=341<\/span>，<span class=\"katex-inline\">FP=16<\/span>，<span class=\"katex-inline\">FN=36<\/span>，<span class=\"katex-inline\">TP=176<\/span>。<\/p>\n<ol><li>\n总数：<span class=\"katex-inline\">N=341+16+36+176=569<\/span>。\n<\/li><li>\n正确率：<span class=\"katex-inline\">(176+341)/569=517/569\\approx0.9086<\/span>。\n<\/li><li>\n精确率：<span class=\"katex-inline\">176/(176+16)=176/192\\approx0.9167<\/span>，即预测恶性中真正恶性的比例。\n<\/li><li>\n召回率：<span class=\"katex-inline\">176/(176+36)=176/212\\approx0.8302<\/span>，即真实恶性被找出的比例；36 个 FN 是漏诊恶性。\n<\/li><li>\nF 值：<span class=\"katex-inline\">P\\cdot R\\approx0.9167\\cdot0.8302\\approx0.7611<\/span>；<span class=\"katex-inline\">2PR\\approx1.5222<\/span>；<span class=\"katex-inline\">P+R\\approx1.7469<\/span>；<span class=\"katex-inline\">F_1\\approx1.5222/1.7469\\approx0.8713<\/span>。\n<\/li><li>\n指标取舍：漏诊代价高时优先看召回，本例 0.8302 提示 36 个恶性被漏；可下调阳性阈值换取召回上升，精确率相应下降。\n<\/li><li>\n不均衡核对：若多数类占 99%，全判多数类正确率 0.99 但召回为 0；此时正确率失真，需看召回、精确率与 AUC。\n<\/ol>\n<h2>数值算例二：决定系数手算<\/h2>\n<p>真实值 <span class=\"katex-inline\">y=(3,5,7)<\/span>，预测值 <span class=\"katex-inline\">\\hat y=(2,5,8)<\/span>。<\/p>\n<ol><li>\n残差：<span class=\"katex-inline\">3-2=1<\/span>，<span class=\"katex-inline\">5-5=0<\/span>，<span class=\"katex-inline\">7-8=-1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">SSE=1^2+0^2+(-1)^2=2<\/span>。\n<\/li><li>\n均值 <span class=\"katex-inline\">\\bar y=(3+5+7)/3=5<\/span>；<span class=\"katex-inline\">SST=(3-5)^2+(5-5)^2+(7-5)^2=4+0+4=8<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">R^2=1-SSE/SST=1-2/8=0.75<\/span>。\n<\/li><li>\nMSE：<span class=\"katex-inline\">2/3\\approx0.667<\/span>。\n<\/li><li>\n对照基准：均值预测误差平方和 8，模型压到 2，解释了 75% 的基准方差；若另一模型 <span class=\"katex-inline\">SSE=10<\/span>，则 <span class=\"katex-inline\">R^2=1-10/8=-0.25<\/span>，比均值预测还差。\n<\/li><li>\n跨数据集比较：MSE 随目标量纲变大而变大，<span class=\"katex-inline\">R^2<\/span> 用相对比例，房价数据集与温度数据集的 <span class=\"katex-inline\">R^2<\/span> 可直接对照，MSE 不能。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<ul><li>\n<strong>案例一：全量训练不留验证<\/strong>。模型记住训练细节，训练误差很低，部署后未见数据误差高，过拟合被掩盖。修正：划分训练/验证集，必要时交叉验证。\n<\/li><li>\n<strong>案例二：不均衡数据只看正确率<\/strong>。多数类占优时高正确率对应少数类召回为零。修正：补充精确率、召回率、F1 与 AUC，按业务代价选主指标。\n<\/li><li>\n<strong>案例三：验证集反复用于调参<\/strong>。同一验证集上反复挑超参数，指标被反复「看见」后偏乐观。修正：超参数选择走交叉验证，最终测试集只在报告时使用一次。\n<\/li><li>\n<strong>案例四：超参数交给拟合自动优化<\/strong>。<span class=\"katex-inline\">k<\/span>、<span class=\"katex-inline\">\\lambda<\/span>、<span class=\"katex-inline\">C<\/span> 若随训练集误差更新，模型在训练集上把超参数也调到最优，泛化估计失真。修正：超参数在外部流程按验证表现设定。\n<\/li><li>\n<strong>案例五：回归只报 MSE 跨数据集比较<\/strong>。目标方差不同，MSE 数值不可直接比。修正：比较 <span class=\"katex-inline\">R^2<\/span>，或在同一数据集内对照基准误差。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：FN 与 FP 各指什么？答：FN 真阳性被判阴性（漏报），FP 真阴性被判阳性（误报）。\n<\/li><li>\n问：精确率和召回率分母差别？答：精确率分母是预测阳性数，召回分母是真实阳性数。\n<\/li><li>\n问：<span class=\"katex-inline\">R^2=0<\/span> 和 <span class=\"katex-inline\">R^2&lt;0<\/span> 各意味什么？答：等于基准均值预测；比基准还差。\n<\/li><li>\n问：过拟合怎样被识别？答：训练误差低、验证误差高，两者落差明显。\n<\/li><li>\n问：学习参数与超参数谁在拟合中更新？答：学习参数由数据更新；超参数训练前外部设定。\n<\/ul>\n<h2>补充推导：ROC、AUC 与不均衡数据<\/h2>\n<p>正确率在类别不均衡时失真：多数类占 99% 时全判多数类正确率 0.99，少数类召回为零。这类场景要看排序能力：模型把正例排在负例前面的概率，即 AUC。ROC 曲线以不同阈值下的假阳性率为横轴、召回率为纵轴；AUC 是曲线下面积，1 为完美，0.5 等同随机猜测。本书乳腺癌示例 AUC 约 0.977，接近 1，说明概率排序能力强（PDF 第 159–160 页）。<\/p>\n<p>阈值调整是独立于训练的决策环节：降低阳性阈值，更多样本判阳性，召回升、精确率降；提高阈值则相反。业务代价决定方向——漏诊代价高（恶性漏判）优先保召回，误报代价高（健康人被疑癌）优先保精确率。F1 在两者同等重要时给出折中；若代价不对称，应按代价加权选阈值，而不是固定 0.5。<\/p>\n<h2>过拟合的偏差方差视角<\/h2>\n<p>过拟合对应高方差一侧：模型把训练样本的偶然波动当成规律，训练误差低而验证误差高。欠拟合对应高偏差：模型太简单，训练与验证误差都高。正则化（c03）压低方差，增加特征或模型容量压低偏差；调参过程就是在偏差与方差之间找验证误差最低的位置。判断拟合状态必须同时记录训练与验证两条误差曲线，单看训练误差无法识别过拟合。<\/p>\n<h2>数据划分与交叉验证流程<\/h2>\n<p>标准流程分三层：训练集拟合学习参数，验证集选超参数，测试集只在最终报告时使用一次。单次 7:3 划分的指标随随机切片波动，交叉验证把训练集切 <span class=\"katex-inline\">K<\/span> 份（常用 5 或 10），轮流一份验证、其余训练，<span class=\"katex-inline\">K<\/span> 轮平均指标更稳。代价是训练计算量扩大 <span class=\"katex-inline\">K<\/span> 倍；数据量小时交叉验证价值更高，数据量大时单次留出加一轮复核即可。<\/p>\n<p>超参数搜索在验证环节进行：列出候选取值（如 <span class=\"katex-inline\">k=1,3,5,10<\/span>，<span class=\"katex-inline\">\\lambda<\/span> 取若干档），逐档训练并比较验证指标，选最优档再全量拟合。超参数不能进入拟合过程自动更新，否则模型在训练集上把超参数也调到最优，泛化估计偏乐观。学习参数（权重、质心、分裂规则）由数据更新，超参数（<span class=\"katex-inline\">k<\/span>、<span class=\"katex-inline\">K<\/span>、<span class=\"katex-inline\">\\lambda<\/span>、<span class=\"katex-inline\">C<\/span>、<span class=\"katex-inline\">\\gamma<\/span>）由外部流程设定，两条路径不能混用。<\/p>\n<h2>回归指标补充<\/h2>\n<p>MSE 对大偏差平方惩罚，量纲随目标变量；<span class=\"katex-inline\">R^2<\/span> 把误差相对均值预测的基准方差归一化，取值通常 0 到 1，误差过大可为负。跨数据集比较模型用 <span class=\"katex-inline\">R^2<\/span>，同一数据集内看绝对误差用 MSE。决定系数与线性回归的拟合优度一脉相承（c02），评估口径与建模损失保持一致：回归用平方误差族，分类用概率或间隔族。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n给定 <span class=\"katex-inline\">TN=80,FP=5,FN=10,TP=55<\/span>，计算正确率、精确率、召回率与 F1。\n<\/li><li>\n真实值 (4,6,8)，预测 (5,6,7)，算 SSE、SST 与 <span class=\"katex-inline\">R^2<\/span>。\n<\/li><li>\n为什么召回与精确率此消彼长？调整阈值时两者方向怎样变化？\n<\/li><li>\n交叉验证相对单次训练/验证划分解决什么问题？付出的计算代价是什么？\n<\/li><li>\n列出三个超参数与两个学习参数，分别说明它们在流程中的确定位置。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "模型评估与过拟合：混淆矩阵、精确率/召回率/F1、交叉验证与超参数"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：机器学习基础：问题类型、数据形态与建模流程<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：机器学习基础（问题类型、数据与建模流程）<\/a><br>检查点：能区分有监督、无监督、强化学习，说清特征变量与目标变量的分工，复述从数据到训练再到预测的步骤<\/li><li class='path-step' id='path-02'><strong>步骤 02：监督学习入门：线性回归、正则化与逻辑回归<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章 2.1–2.3：监督学习入门——线性回归、正则化、逻辑回归<\/a><br>检查点：能手算一次最小二乘与一步梯度下降，写出 Ridge 惩罚项，把 Sigmoid 概率与交叉熵梯度更新算到底<\/li><li class='path-step' id='path-03'><strong>步骤 03：更多监督学习：SVM、决策树与随机森林、kNN<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 2 章 2.4–2.9：更多监督学习——SVM 与核方法、朴素贝叶斯、随机森林、神经网络、kNN<\/a><br>检查点：能写出间隔与软间隔定义，算一个节点的基尼系数与加权不纯度，完成 5 个点的 kNN 距离计算与多数表决<\/li><li class='path-step' id='path-04'><strong>步骤 04：无监督学习与评估调参：k-means、PCA、指标与交叉验证<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 3–4 章：无监督学习（PCA、k-means）与模型评估、调参与数据处理<\/a><br>检查点：能手算一轮质心更新与簇内平方和，写出协方差矩阵到特征值的 PCA 流程，由混淆矩阵算出四类指标并说明交叉验证如何评估泛化<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='有监督学习（supervised learning）'>有监督学习（supervised learning） — 训练数据同时含特征变量与作为答案的目标变量，算法据此学到从特征到目标的映射；目标为连续值是回归问题，目标为离散类别是分类问题 <span class=glossary-ref>（第 1 章：机器学习基础（问题类型、数据与建模流程））<\/span><\/li><li data-term='无监督学习（unsupervised learning）'>无监督学习（unsupervised learning） — 训练数据只含特征变量、不带答案，算法按数据本身的结构组织输入，典型任务是聚类与降维 <span class=glossary-ref>（第 1 章：机器学习基础（问题类型、数据与建模流程））<\/span><\/li><li data-term='强化学习（reinforcement learning）'>强化学习（reinforcement learning） — 智能体在环境中按行动获得奖励或惩罚，通过试错调整策略以累积长期收益的学习方式；本书仅作概念区分，未展开算法 <span class=glossary-ref>（第 1 章：机器学习基础（问题类型、数据与建模流程））<\/span><\/li><li data-term='损失函数（损失/误差函数）'>损失函数（损失/误差函数） — 表示预测值与目标值之间差距、并以学习参数为自变量的函数；学习过程即寻找使该函数取值最小的参数组合 <span class=glossary-ref>（第 2 章 2.1–2.3：监督学习入门——线性回归、正则化、逻辑回归）<\/span><\/li><li data-term='均方误差（mse）'>均方误差（MSE） — 回归常用损失，$\\frac{1}{n}\\sum_{i=1}^{n}(y_i-\\hat y_i)^2$；误差平方后取平均，放大较大偏差的影响 <span class=glossary-ref>（第 2 章 2.1–2.3：监督学习入门——线性回归、正则化、逻辑回归）<\/span><\/li><li data-term='正则化（regularization）'>正则化（regularization） — 在损失函数中加入对系数规模的惩罚项，约束模型复杂度，抑制训练误差很低但验证误差很高的过拟合现象 <span class=glossary-ref>（第 2 章 2.1–2.3：监督学习入门——线性回归、正则化、逻辑回归）<\/span><\/li><li data-term='sigmoid 函数'>Sigmoid 函数 — $\\sigma(z)=1/(1+e^{-z})$，把任意实数压缩到 $(0,1)$ 区间；逻辑回归用它把线性组合转成类别概率 <span class=glossary-ref>（第 2 章 2.1–2.3：监督学习入门——线性回归、正则化、逻辑回归）<\/span><\/li><li data-term='间隔（margin）'>间隔（margin） — 训练数据中最接近决策边界的样本与边界之间的距离；线性 SVM 以最大化间隔为目标，落在间隔上的样本称支持向量 <span class=glossary-ref>（第 2 章 2.4–2.9：更多监督学习——SVM 与核方法、朴素贝叶斯、随机森林、神经网络、kNN）<\/span><\/li><li data-term='基尼系数（gini impurity）'>基尼系数（Gini impurity） — 决策树不纯度指标，$1-\\sum_{i=1}^{c}p_i^2$；各类别比例越均匀取值越大，纯节点取值为 0 <span class=glossary-ref>（第 2 章 2.4–2.9：更多监督学习——SVM 与核方法、朴素贝叶斯、随机森林、神经网络、kNN）<\/span><\/li><li data-term='多数表决（majority vote）'>多数表决（majority vote） — 多个模型或近邻各自给出预测，按票数最多的类别作为最终结果；随机森林与 kNN 都采用这一综合方式 <span class=glossary-ref>（第 2 章 2.4–2.9：更多监督学习——SVM 与核方法、朴素贝叶斯、随机森林、神经网络、kNN）<\/span><\/li><li data-term='主成分（principal component）'>主成分（principal component） — PCA 得到的、以原变量线性组合表示的低维新轴；第一主成分取数据方差最大的正交方向，其后依次排列 <span class=glossary-ref>（第 3–4 章：无监督学习（PCA、k-means）与模型评估、调参与数据处理）<\/span><\/li><li data-term='交叉验证（cross validation）'>交叉验证（cross validation） — 把训练数据切成若干份，轮流用一份做验证、其余做训练，用多轮平均指标估计模型对未知数据的泛化能力 <span class=glossary-ref>（第 3–4 章：无监督学习（PCA、k-means）与模型评估、调参与数据处理）<\/span><\/li><li data-term='超参数（hyperparameter）'>超参数（hyperparameter） — 训练开始前由人工设定、不由算法在拟合中更新的参数，如 kNN 的 k、k-means 的簇数、正则化强度与 SVM 的 C 值 <span class=glossary-ref>（第 3–4 章：无监督学习（PCA、k-means）与模型评估、调参与数据处理）<\/span><\/li><li data-term='泛化能力（generalization）'>泛化能力（generalization） — 模型对未参与训练的新数据的预测表现；训练误差很低而验证误差很高的过拟合状态，对应泛化能力低 <span class=glossary-ref>（第 3–4 章：无监督学习（PCA、k-means）与模型评估、调参与数据处理）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>解题思路模式：从《图解机器学习算法》提炼的通用套路<\/h1>\n<h2>模式 1：先判任务类型，再选算法<\/h2>\n<ul><li>\n<strong>触发<\/strong>：拿到一个待解决的数据问题，准备调用任何模型库之前。\n<\/li><li>\n<strong>步骤<\/strong>：① 查训练数据是否带答案标签；② 带标签则查目标变量是连续值还是离散类别；③ 无标签判断是分组还是压缩；④ 锁定对应指标族，再列候选算法。\n<\/li><li>\n<strong>落点<\/strong>：问题类型写在建模决策最前面，损失函数与评价指标随之确定。\n<\/li><li>\n<strong>边界<\/strong>：归类只缩小候选范围，同一类问题的算法表现仍要靠验证数据比较；不能凭印象把分类任务套上回归损失。\n<\/ul>\n<h2>模式 2：定义损失 → 优化参数 → 验证泛化<\/h2>\n<ul><li>\n<strong>触发<\/strong>：有监督模型从数据到预测的完整链路。\n<\/li><li>\n<strong>步骤<\/strong>：① 写出以学习参数为自变量的损失函数（平方误差、交叉熵或间隔准则）；② 用闭式解或梯度下降找使损失最小的参数；③ 留出验证集检查泛化，再用交叉验证估计稳定表现；④ 超参数在验证环节外部选定。\n<\/li><li>\n<strong>落点<\/strong>：每个模型都能拆成「模型形式 + 损失 + 更新规则 + 评估」四段，缺一段就无法检查。\n<\/li><li>\n<strong>边界<\/strong>：训练损失低不等于可用；损失口径必须与任务类型匹配，分类不用平方误差，回归不用表决口径。\n<\/ul>\n<h2>模式 3：距离与邻域决策（kNN / k-means 共用）<\/h2>\n<ul><li>\n<strong>触发<\/strong>：判断样本相似性靠远近关系，无论是带标签表决还是无标签分组。\n<\/li><li>\n<strong>步骤<\/strong>：① 先标准化特征，消除量纲支配；② 选距离度量（欧氏/曼哈顿）；③ kNN 取 <span class=\"katex-inline\">k<\/span> 近邻表决，k-means 按最近质心分配再更新均值；④ 迭代或表决后用紧凑度/指标检查结果。\n<\/li><li>\n<strong>落点<\/strong>：距离类模型的质量取决于尺度对齐与邻域大小；距离定义改变，近邻集合随之改变。\n<\/li><li>\n<strong>边界<\/strong>：高维稀疏数据距离趋同，需先降维；类别不均衡时近邻表决偏向多数类；k-means 假设球形可比簇形。\n<\/ul>\n<h2>模式 4：不纯度分裂与集成表决（决策树 / 随机森林）<\/h2>\n<ul><li>\n<strong>触发<\/strong>：需要嵌套条件规则，或单棵树预测波动大。\n<\/li><li>\n<strong>步骤<\/strong>：① 用基尼或熵计算节点混杂度；② 遍历特征与切分点，取加权不纯度下降最多的分裂；③ 递归生长到停止条件；④ 多棵有差异的树投票或取均值，压低单树方差。\n<\/li><li>\n<strong>落点<\/strong>：树负责可读规则，集成负责稳定表现；多样性来自样本自助采样与特征随机子集。\n<\/li><li>\n<strong>边界<\/strong>：树深不限会记住噪声；树之间完全相同则表决无降方差收益；不均衡数据需调采样或看召回指标。\n<\/ul>\n<h2>模式 5：协方差结构分解（PCA 降维）<\/h2>\n<ul><li>\n<strong>触发<\/strong>：特征多且相关，后续建模或可视化受高维困扰。\n<\/li><li>\n<strong>步骤<\/strong>：① 中心化数据，必要时标准化到单位方差；② 构造协方差矩阵；③ 求解特征值问题，特征向量即主成分方向，特征值即方向方差；④ 取前 <span
