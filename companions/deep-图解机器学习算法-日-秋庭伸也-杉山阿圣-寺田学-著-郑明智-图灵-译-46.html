class=\"katex-inline\">m<\/span> 个成分投影，用累计方差解释比检查保留程度。\n<\/li><li>\n<strong>落点<\/strong>：新轴是原变量线性组合，得分是样本在新轴上的坐标；降维损失等于被截方向的方差。\n<\/li><li>\n<strong>边界<\/strong>：PCA 只捕捉线性结构；未标准化会被大尺度变量主导；保留维度要结合下游任务表现，不能只追方差比。\n<\/ul>\n<h2>模式 6：指标对照与超参数调优<\/h2>\n<ul><li>\n<strong>触发<\/strong>：模型训练完成，判断是否可部署、比较不同算法或调整参数。\n<\/li><li>\n<strong>步骤<\/strong>：① 分类先填混淆矩阵四格，再算正确率、精确率、召回率、F1；② 回归算 MSE 与 <span class=\"katex-inline\">R^2<\/span>；③ 按业务代价选主指标，不均衡场景补 AUC；④ 列超参数候选，交叉验证比较，最优档再全量拟合。\n<\/li><li>\n<strong>落点<\/strong>：指标选择服从代价结构，超参数选择与学习参数更新路径分开。\n<\/li><li>\n<strong>边界<\/strong>：验证集不能反复用于最终报告；超参数不能交给拟合过程自动优化；MSE 跨数据集不可直接比，<span class=\"katex-inline\">R^2<\/span> 才可比。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表：《图解机器学习算法》核心公式与指标<\/h1>\n<h2>一、问题类型与学习路线<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>判断项<\/th><th>是<\/th><th>否<\/th><\/tr><\/thead><tbody><tr><td>训练数据带答案标签<\/td><td>有监督学习<\/td><td>无监督学习<\/td><\/tr><tr><td>目标变量连续取值<\/td><td>回归问题<\/td><td>分类问题（离散标签）<\/td><\/tr><tr><td>反馈为行动—奖励序列<\/td><td>强化学习<\/td><td>对照上述两类<\/td><\/tr><tr><td>模型对未见数据的表现<\/td><td>泛化能力<\/td><td>训练误差只反映见过的数据<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>二、回归与线性模型<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>项目<\/th><th>公式 / 规则<\/th><\/tr><\/thead><tbody><tr><td>一元线性回归<\/td><td><span class=\"katex-inline\">y=w_0+w_1x<\/span><\/td><\/tr><tr><td>均方误差<\/td><td><span class=\"katex-inline\">MSE=\\frac1n\\sum_{i=1}^{n}(y_i-\\hat y_i)^2<\/span><\/td><\/tr><tr><td>最小二乘斜率<\/td><td><span class=\"katex-inline\">w_1=S_{xy}/S_{xx}<\/span>，<span class=\"katex-inline\">w_0=\\bar y-w_1\\bar x<\/span><\/td><\/tr><tr><td>梯度下降更新<\/td><td><span class=\"katex-inline\">w_j\\leftarrow w_j-\\eta\\,\\partial L/\\partial w_j<\/span><\/td><\/tr><tr><td>L2（Ridge）损失<\/td><td><span class=\"katex-inline\">L=\\sum_i e_i^2+\\lambda\\sum_j w_j^2<\/span><\/td><\/tr><tr><td>L1（Lasso）损失<\/td><td><span class=\"katex-inline\">L=\\sum_i e_i^2+\\lambda\\sum_j\\|w_j\\|<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>三、分类模型<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>核心表达式<\/th><th>损失 / 准则<\/th><\/tr><\/thead><tbody><tr><td>逻辑回归<\/td><td><span class=\"katex-inline\">p=\\sigma(\\mathbf{w}^T\\mathbf{x}+w_0)<\/span>，<span class=\"katex-inline\">\\sigma(z)=1/(1+e^{-z})<\/span><\/td><td>交叉熵 <span class=\"katex-inline\">-[\\,y\\log p+(1-y)\\log(1-p)\\,]<\/span><\/td><\/tr><tr><td>逻辑回归梯度<\/td><td><span class=\"katex-inline\">\\partial L/\\partial w_j=(p-y)x_j<\/span><\/td><td>沿负梯度更新<\/td><\/tr><tr><td>线性 SVM<\/td><td>边界 <span class=\"katex-inline\">\\mathbf{w}^T\\mathbf{x}+w_0=0<\/span><\/td><td>最大化间隔 <span class=\"katex-inline\">2/\\|\\mathbf{w}\\|<\/span><\/td><\/tr><tr><td>点到边界距离<\/td><td><span class=\"katex-inline\">\\lvert\\mathbf{w}^T\\mathbf{x}+w_0\\rvert/\\|\\mathbf{w}\\|<\/span><\/td><td>支持向量决定边界<\/td><\/tr><tr><td>RBF 核<\/td><td><span class=\"katex-inline\">K(\\mathbf{x}_i,\\mathbf{x}_j)=\\exp(-\\gamma\\|\\mathbf{x}_i-\\mathbf{x}_j\\|^2)<\/span><\/td><td>隐式高维内积<\/td><\/tr><tr><td>基尼系数<\/td><td><span class=\"katex-inline\">G=1-\\sum_{i=1}^{c}p_i^2<\/span><\/td><td>加权按子节点样本占比<\/td><\/tr><tr><td>kNN<\/td><td>欧氏距离 <span class=\"katex-inline\">d=\\sqrt{\\sum_j(x_j-q_j)^2}<\/span><\/td><td>最近 <span class=\"katex-inline\">k<\/span> 个多数表决<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>四、无监督方法<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>方法<\/th><th>步骤 / 表达式<\/th><\/tr><\/thead><tbody><tr><td>k-means<\/td><td>选初始质心 → 按最近距离分配 → 均值更新质心 → 重复至稳定<\/td><\/tr><tr><td>质心<\/td><td><span class=\"katex-inline\">\\mu_k=\\frac1{n_k}\\sum_{\\mathbf{x}\\in C_k}\\mathbf{x}<\/span><\/td><\/tr><tr><td>簇内平方和<\/td><td><span class=\"katex-inline\">SSE=\\sum_k\\sum_{\\mathbf{x}\\in C_k}\\|\\mathbf{x}-\\mu_k\\|^2<\/span><\/td><\/tr><tr><td>PCA 协方差<\/td><td><span class=\"katex-inline\">C_{jj&#x27;}=\\frac1n\\sum_i\\tilde x_{ij}\\tilde x_{ij&#x27;}<\/span><\/td><\/tr><tr><td>特征值问题<\/td><td><span class=\"katex-inline\">C\\mathbf{v}=\\lambda\\mathbf{v}<\/span>，<span class=\"katex-inline\">\\lambda<\/span> 为该方向方差<\/td><\/tr><tr><td>主成分得分<\/td><td><span class=\"katex-inline\">s_{ij}=\\mathbf{v}_j^T\\tilde{\\mathbf{x}}_i<\/span><\/td><\/tr><tr><td>方差解释比<\/td><td><span class=\"katex-inline\">\\lambda_j/\\sum_l\\lambda_l<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>五、评估指标（分类）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>指标<\/th><th>公式<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>正确率<\/td><td><span class=\"katex-inline\">(TP+TN)/N<\/span><\/td><td>整体判对比例<\/td><\/tr><tr><td>精确率<\/td><td><span class=\"katex-inline\">TP/(TP+FP)<\/span><\/td><td>预测阳性中真阳性比例<\/td><\/tr><tr><td>召回率<\/td><td><span class=\"katex-inline\">TP/(TP+FN)<\/span><\/td><td>真阳性被找出比例<\/td><\/tr><tr><td>F1 值<\/td><td><span class=\"katex-inline\">2PR/(P+R)<\/span><\/td><td>精确率与召回率调和平均<\/td><\/tr><tr><td>AUC<\/td><td>ROC 曲线下面积<\/td><td>正例排在负例前的概率<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>六、评估指标（回归）与调参<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>项目<\/th><th>公式 / 规则<\/th><\/tr><\/thead><tbody><tr><td>决定系数<\/td><td><span class=\"katex-inline\">R^2=1-SSE/SST<\/span>，<span class=\"katex-inline\">SST=\\sum_i(y_i-\\bar y)^2<\/span><\/td><\/tr><tr><td>过拟合<\/td><td>训练误差低、验证误差高<\/td><\/tr><tr><td>数据划分<\/td><td>训练集拟合参数，验证集选超参数，测试集只报一次<\/td><\/tr><tr><td>交叉验证<\/td><td>切 <span class=\"katex-inline\">K<\/span> 份轮流验证，多轮平均指标<\/td><\/tr><tr><td>超参数<\/td><td><span class=\"katex-inline\">k<\/span>、<span class=\"katex-inline\">K<\/span>、<span class=\"katex-inline\">\\lambda<\/span>、<span class=\"katex-inline\">C<\/span>、<span class=\"katex-inline\">\\gamma<\/span>，训练前外部设定<\/td><\/tr><tr><td>学习参数<\/td><td>权重、质心、分裂规则，拟合中由数据更新<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>七、算法选择速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>问题场景<\/th><th>候选算法<\/th><\/tr><\/thead><tbody><tr><td>数值预测、近似线性关系<\/td><td>线性回归、SVR<\/td><\/tr><tr><td>二分类、需概率输出<\/td><td>逻辑回归<\/td><\/tr><tr><td>线性边界、追求间隔稳健<\/td><td>SVM（核 SVM 处理非线性）<\/td><\/tr><tr><td>非线性表格规则、需特征重要性<\/td><td>决策树、随机森林<\/td><\/tr><tr><td>局部复杂边界、样本量适中<\/td><td>kNN<\/td><\/tr><tr><td>无标签分组<\/td><td>k-means、混合高斯<\/td><\/tr><tr><td>相关变量压缩、可视化<\/td><td>PCA（非线性用 LLE、t-SNE）<\/td><\/tr><\/tbody><\/table><\/div>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/ml-algorithms-illustrated", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：机器学习基础（问题类型、数据与建模流程）", "href": "#/chapter/ch01"}, {"label": "第 2 章 2.1–2.3：监督学习入门——线性回归、正则化、逻辑回归", "href": "#/chapter/ch02"}, {"label": "第 2 章 2.4–2.9：更多监督学习——SVM 与核方法、朴素贝叶斯、随机森林、神经网络、kNN", "href": "#/chapter/ch03"}, {"label": "第 3–4 章：无监督学习（PCA、k-means）与模型评估、调参与数据处理", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "机器学习基本概念：监督、无监督、强化学习与建模流程", "href": "#/concept/c01"}, {"label": "线性回归：最小二乘目标函数、正规方程与梯度下降一步", "href": "#/concept/c02"}, {"label": "正则化：L1/L2 惩罚项、系数收缩与过拟合抑制", "href": "#/concept/c03"}, {"label": "逻辑回归：Sigmoid 概率、交叉熵损失与权重更新规则", "href": "#/concept/c04"}, {"label": "支持向量机与核方法：间隔最大化、软间隔与核技巧", "href": "#/concept/c05"}, {"label": "决策树与随机森林：不纯度、基尼系数与 Bagging 多数表决", "href": "#/concept/c06"}, {"label": "k 近邻（kNN）：距离度量、多数表决与 k 值选择", "href": "#/concept/c07"}, {"label": "k-means 聚类：质心更新、簇内平方和与初始化", "href": "#/concept/c08"}, {"label": "PCA 主成分分析：协方差矩阵、特征值分解与降维投影", "href": "#/concept/c09"}, {"label": "模型评估与过拟合：混淆矩阵、精确率/召回率/F1、交叉验证与超参数", "href": "#/concept/c10"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：机器学习基础（问题类型、数据与建模流程）", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章 2.1–2.3：监督学习入门——线性回归、正则化、逻辑回归", "href": "#/quiz/ch02"}, {"label": "测验：第 2 章 2.4–2.9：更多监督学习——SVM 与核方法、朴素贝叶斯、随机森林、神经网络、kNN", "href": "#/quiz/ch03"}, {"label": "测验：第 3–4 章：无监督学习（PCA、k-means）与模型评估、调参与数据处理", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：图解机器学习算法.pdf · p.14<\/div><h1>第 1 章：机器学习基础（问题类型、数据与建模流程）<\/h1>\n<blockquote>对应原书第 1 章「机器学习基础」（§1.1 机器学习概要、§1.2 机器学习的步骤）。PDF 第 14–49 页；印刷页 1–36，偏移 k=13（PDF 页 = 印刷页 + 13），已用章首两处互核。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出机器学习的定义，分清人工智能、机器学习、深度学习三者的包含关系；\n<\/li><li>\n区分有监督学习、无监督学习、强化学习，按数据形态判断属于哪一类；\n<\/li><li>\n判断一个实际问题是回归问题还是分类问题，写出对应的特征变量与目标变量；\n<\/li><li>\n复述机器学习从收集数据、预处理、训练模型到在新数据上预测的完整步骤；\n<\/li><li>\n解释为什么数据质量与划分方式会直接影响模型在未知数据上的表现。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>机器学习是计算机根据给定问题与数据进行学习、再用学习结果解决问题的整套机制；输入数据是否带答案，决定了它属于有监督还是无监督学习，而目标变量是连续数值还是离散类别，决定了任务是回归还是分类。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 c01：机器学习基本概念（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。机器学习指计算机根据给定的问题、课题或环境进行学习，并利用学习结果解决问题或课题的一整套机制（原书 §1.1，PDF 第 15 页）。人工智能是含义很广的综合性系统，机器学习是实现人工智能的一种方法；深度学习又是机器学习算法中的一种，三者是逐层包含的关系，不能把三者当成并列名词混用（PDF 第 15–16 页）。按输入数据的不同，机器学习分为有监督学习、无监督学习、强化学习三类（PDF 第 16 页）。有监督学习把答案告知计算机，训练数据中既含表示特征的数据，也含作为答案的目标数据；例如以身高、体重为特征，以男/女为答案，学出一个预测模型，再用新的身高体重数据预测性别（PDF 第 16–17 页）。<\/p>\n<h3>2. 问题类型：回归与分类<\/h3>\n<p>有监督学习内部还要再分两类。预测性别的类别问题叫作分类问题；把数据分到两个类别中叫二元分类（PDF 第 17 页）。目标变量取连续数值、预测数值大小的问题是回归问题，例如根据面积预测房价、根据房间数预测租金。判断依据只看目标变量：答案是离散标签就走分类，答案是连续数值就走回归。特征变量可以是一个或多个，本书第 2 章的算法都在这一框架内展开。<\/p>\n<h3>3. 建模步骤与数据的位置<\/h3>\n<p>机器学习的步骤围绕数据展开：收集并理解数据、对数据做预处理、用训练数据拟合模型、留出数据验证效果、再对新数据做预测（原书 §1.2，PDF 第 22 页起）。书中用威斯康星州乳腺癌数据集、鸢尾花数据集演示了分类与聚类的完整流程：先查看数据形状与字段含义，再用可视化观察分布，随后交给算法处理（PDF 第 24–43 页）。数据是模型的原料，特征取值的范围、缺失与异常会被模型原样吸收；脱离数据质量谈算法优劣没有意义。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[原始数据] --&gt; B{数据是否带答案标签?}\n    B -- 带答案 --&gt; C[有监督学习]\n    B -- 不带答案 --&gt; D[无监督学习]\n    C --&gt; E{目标变量类型?}\n    E -- 连续数值 --&gt; F[回归问题]\n    E -- 离散类别 --&gt; G[分类问题]\n    D --&gt; H[聚类 / 降维]\n    C --&gt; I[训练: 拟合参数]\n    D --&gt; I\n    I --&gt; J[在新数据上预测或组织结构]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这条依赖链断在第一步——把不带答案的数据硬塞给有监督算法，或者把类别标签当成连续数值做回归，后面再复杂的模型也救不回来。问题类型判断必须在选算法之前完成。<\/p>\n<h2>推导一：从一组身高体重数据推演分类决策<\/h2>\n<p>依据原书 §1.1 的性别分类示例（PDF 第 16–17 页），把一次有监督分类走成可检查的计算链。<\/p>\n<ol><li>\n<strong>数据形态<\/strong>：每条训练样本写成 <span class=\"katex-inline\">(\\mathbf{x}_i, y_i)<\/span>，其中 <span class=\"katex-inline\">\\mathbf{x}_i=(h_i, w_i)<\/span> 是身高、体重组成的特征向量，<span class=\"katex-inline\">y_i\\in\\{0,1\\}<\/span> 是类别标签（0 与 1 分别对应两类性别）。训练集共 <span class=\"katex-inline\">n<\/span> 条样本。\n<\/li><li>\n<strong>学习目标<\/strong>：算法在训练集上找一个映射 <span class=\"katex-inline\">f<\/span>，使 <span class=\"katex-inline\">f(\\mathbf{x}_i)<\/span> 尽量接近 <span class=\"katex-inline\">y_i<\/span>；学习得到的参数或规则就是模型。\n<\/li><li>\n<strong>预测环节<\/strong>：来了新样本 <span class=\"katex-inline\">\\mathbf{x}_{new}<\/span>，把它代入模型得到 <span class=\"katex-inline\">f(\\mathbf{x}_{new})<\/span>，再按规则（类别取 0/1，或概率阈值 0.5）落成预测标签。\n<\/li><li>\n<strong>数值走查<\/strong>：设训练集里 <span class=\"katex-inline\">\\mathbf{x}_1=(170,65)<\/span> 对应 <span class=\"katex-inline\">y_1=1<\/span>，<span class=\"katex-inline\">\\mathbf{x}_2=(155,48)<\/span> 对应 <span class=\"katex-inline\">y_2=0<\/span>。模型对新样本 <span class=\"katex-inline\">\\mathbf{x}_{new}=(160,55)<\/span> 输出类别 0；这个结果是否合理，要靠留出的验证数据统计正确比例，不能只看单个样本的直觉。\n<\/ol>\n<p>这一推演说明：分类流程的每一环都有明确输入输出，问题类型在环节 1 就由标签与目标变量类型确定。<\/p>\n<h2>推导二：回归与分类的判定推演<\/h2>\n<p>判定规则由目标变量的取值集合决定，逐条核对：<\/p>\n<ol><li>\n<strong>列出待预测量<\/strong>：先明确模型最终要回答什么。根据居住面积预测房价（元），待预测量是带单位的数值；根据体检指标判断肿瘤良性/恶性，待预测量是两个标签之一。\n<\/li><li>\n<strong>检查取值性质<\/strong>：房价在实数区间内连续可取，两个数值之间还能插入更多数值，属于连续变量；良/恶性只能取固定标签，类别之间没有大小次序，属于离散变量。\n<\/li><li>\n<strong>归入问题类型<\/strong>：连续目标 → 回归；离散目标 → 分类。同一组特征（体检指标）换一种目标变量，问题类型会变：预测肿瘤直径是回归，预测良恶性是分类。\n<\/li><li>\n<strong>反推算法选择<\/strong>：回归类目标对应线性回归、SVR 等算法；分类类目标对应逻辑回归、SVM、随机森林、kNN 等算法。问题类型先定，算法后选。\n<\/ol>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>改掉「数据带答案」这个前提<\/strong>：如果训练数据只有身高体重、没有性别标签，有监督算法无从拟合映射；这时强行学出的「性别」只是对特征分布的猜测。没有标签的数据只能走无监督路线，按相似性聚成簇，簇的含义需要事后人工解释。\n<\/li><li>\n<strong>改掉目标变量类型<\/strong>：把良/恶性标签编码成 0、1 后，若按回归方式预测连续值并直接把输出当类别，模型会输出 0.4、1.2 这类介于标签之间的数，既不是合法类别也无法直接表决；分类与回归的损失函数、评价指标都不同，混用会让训练目标错位。\n<\/li><li>\n<strong>改掉数据划分方式<\/strong>：如果把全部数据都用于训练、不留验证数据，模型在训练集上误差很低也不能说明对新数据有效；过拟合会在没有对照的情况下被掩盖，这一点在第 4 章评估方法中展开。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p>机器学习像带答案的习题集：有监督学习是做完题对照标准答案订正，无监督学习是把一摞未分类卡片按相似性分拣，强化学习是在试错中按奖惩调整动作。书中乳腺癌数据集的分类、鸢尾花数据集的聚类，分别对应前两类（PDF 第 24–43 页）。可视化是理解数据的前置动作：散点图、直方图能看出类别是否分离、变量是否相关，避免在不合理的数据分布上直接堆算法。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解一：人工智能就是深度学习<\/strong>。深度学习只是机器学习中的一类算法；机器学习本身又是实现人工智能的方法之一。这个包含关系不能倒过来讲（PDF 第 15–16 页）。\n<\/li><li>\n<strong>误解二：算法越复杂，结果越好<\/strong>。本书各算法的选择取决于问题类型与数据形态；数据不分离、特征不含信息时，复杂模型只会把噪声学得更精细。\n<\/li><li>\n<strong>误解三：训练误差低就代表模型可用<\/strong>。训练误差衡量对见过的数据的拟合，未知数据上的表现要靠验证集与交叉检验，第 4 章专门处理这一区别。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n给定一批用户浏览记录与是否购买商品的标签，判断这属于哪一类学习、哪种问题类型，并写出特征与目标变量。\n<\/li><li>\n聚类任务为什么不需要标签？如果事后给簇贴上「高价值用户」的解释，这个标签是算法学出来的还是人工赋予的？\n<\/li><li>\n同一组房屋面积与地段数据，分别预测房价与预测户型档次，两者的问题类型有何不同？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\n机器学习 = 从数据中学习、再用学习结果解决问题的机制；AI ⊃ 机器学习 ⊃ 深度学习。\n<\/li><li>\n数据是否带答案区分有监督/无监督；目标变量连续/离散区分回归/分类。\n<\/li><li>\n建模流程：理解数据 → 预处理 → 训练 → 验证 → 预测新数据。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章是全书的分类框架：第 2 章在有监督框架内先讲回归与概率分类入门算法，再讲间隔、树与近邻类算法；第 3 章进入无监督的聚类与降维；第 4 章回到评估，回答「怎样判断学到的模型在未知数据上好不好」。本章确定的问题类型判定，是后面每一章选算法、选指标的第一道筛子。<\/p>", "ch02": "<div class=\"source-badge\">📖 出处：图解机器学习算法.pdf · p.51<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：机器学习基础（问题类型、数据与建模流程）<\/a><\/span><\/div><h1>第 2 章 2.1–2.3：监督学习入门——线性回归、正则化、逻辑回归<\/h1>\n<blockquote>对应原书第 2 章「有监督学习」2.1 线性回归、2.2 正则化、2.3 逻辑回归。PDF 第 51–70 页；印刷页 38–57，偏移 k=13。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出一元线性回归的模型形式与均方误差损失函数，手算一组数据的最小二乘斜率与截距；\n<\/li><li>\n说明梯度下降中权重更新的方向与步长作用，完成一步权重更新的数值计算；\n<\/li><li>\n写出 L2 与 L1 正则化惩罚项，解释正则化怎样抑制系数规模与过拟合；\n<\/li><li>\n写出 Sigmoid 函数与逻辑回归概率表达式，把线性组合转换为 0 到 1 之间的概率；\n<\/li><li>\n写出交叉熵损失对权重的梯度，完成一次逻辑回归的参数更新，说明决策边界与阈值的关系。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>回归与分类入门算法共享同一个套路：先定义一个以学习参数为自变量的损失函数，再找让损失最小的参数；线性回归用均方误差配直线模型，逻辑回归用交叉熵配 Sigmoid 概率模型，正则化则在损失上加惩罚项来约束模型复杂度。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 c02：线性回归（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。线性回归对「目标变量随特征变量增大而增大或减小」的关联建模，一元回归写成直线 <span class=\"katex-inline\">y=w_0+w_1x<\/span>，<span class=\"katex-inline\">w_1<\/span> 是斜率，<span class=\"katex-inline\">w_0<\/span> 是截距，二者是由数据学到的学习参数（原书 §2.1，PDF 第 51 页）。书中用均方误差比较两条直线：误差是 <span class=\"katex-inline\">y_i-(w_0+w_1x_i)<\/span>，均方误差为误差平方的平均值（PDF 第 52 页）。改变 <span class=\"katex-inline\">w_0,w_1<\/span> 就改变误差函数值，学习就是在各条直线中找使误差函数最小的参数；这套「最小化损失」的思路是其他有监督学习算法的共同出发点（PDF 第 53 页）。<\/p>\n<h3>2. 概念 c03：正则化（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。正则化是配合线性回归等算法使用的防过拟合手段：向损失函数增加惩罚项，对模型复杂度施加制约，以提高泛化能力（原书 §2.2，PDF 第 58 页）。书中用 <span class=\"katex-inline\">y=\\sin(2\\pi x)<\/span> 加高斯噪声生成训练与验证数据，比较不同多项式次数的误差：六次多项式训练误差很低（0.024），验证误差却高达 3.472，这就是过拟合；加入正则化后，次数增加带来的验证误差被抑制（PDF 第 59–61 页）。惩罚项把系数往零的方向压，模型不再用大系数去追逐个别噪声点。<\/p>\n<h3>3. 概念 c04：逻辑回归（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。逻辑回归名字里带「回归」，实际是二元分类算法：先算数据属于各类别的概率，再按阈值分类（原书 §2.3，PDF 第 65 页）。它先对特征向量乘权重向量再加偏置，得到 <span class=\"katex-inline\">z=\\mathbf{w}^{T}\\mathbf{x}+w_0<\/span>；与线性回归不同，输出必须限制在 0 与 1 之间，因此用 Sigmoid 函数 <span class=\"katex-inline\">\\sigma(z)=1/(1+e^{-z})<\/span> 把 <span class=\"katex-inline\">z<\/span> 压成概率 <span class=\"katex-inline\">p=\\sigma(\\mathbf{w}^{T}\\mathbf{x}+w_0)<\/span>（PDF 第 66 页）。二元分类通常以 0.5 为阈值：概率小于 0.5 判为 0，大于 0.5 判为 1；阈值也可按问题调整（PDF 第 66 页）。学习使用逻辑损失（交叉熵），这个损失无法通过式子变形直接求最小值，需要用梯度下降做数值近似求解（PDF 第 66 页）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[训练数据 特征+目标] --&gt; B[选模型形式: 直线 / Sigmoid]\n    B --&gt; C[定义损失: MSE 或交叉熵]\n    C --&gt; D[优化参数: 正规方程 / 梯度下降]\n    D --&gt; E{是否需要约束复杂度?}\n    E -- 需要 --&gt; F[加入正则化惩罚项]\n    E -- 不需要 --&gt; G[输出模型]\n    F --&gt; G\n    G --&gt; H[新数据预测: 回归给数值 / 分类给概率再定类别]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：损失函数把「拟合好坏」变成可计算的标量，优化环节围绕这个标量找参数；惩罚项只在怀疑模型过于复杂时介入。链条中如果跳过损失定义直接调库函数，参数更新的方向就无从检查。<\/p>\n<h2>推导一：最小二乘手算三个点的斜率与截距<\/h2>\n<p>下面把最小二乘这条推演走到底，每一步标注用到的条件。 数据点为 <span class=\"katex-inline\">(x_1,y_1)=(1,1)<\/span>、<span class=\"katex-inline\">(x_2,y_2)=(2,3)<\/span>、<span class=\"katex-inline\">(x_3,y_3)=(3,2)<\/span>，模型为 <span class=\"katex-inline\">y=w_0+w_1x<\/span>。<\/p>\n<ol><li>\n<strong>求均值<\/strong>：<span class=\"katex-inline\">\\bar x=(1+2+3)/3=2<\/span>，<span class=\"katex-inline\">\\bar y=(1+3+2)/3=2<\/span>。\n<\/li><li>\n<strong>计算离差乘积和与离差平方和<\/strong>：\n<\/ol>\n<div class=\"katex-block\">S_{xx}=\\sum_{i=1}^{3}(x_i-\\bar x)^2=(-1)^2+0^2+1^2=2,<\/div>\n<div class=\"katex-block\">S_{xy}=\\sum_{i=1}^{3}(x_i-\\bar x)(y_i-\\bar y)=(-1)(-1)+0\\cdot1+1\\cdot0=1.<\/div>\n<ol><li>\n<strong>斜率<\/strong>：<span class=\"katex-inline\">w_1=S_{xy}/S_{xx}=1/2=0.5<\/span>。依据是最小二乘目标 <span class=\"katex-inline\">\\sum_i(y_i-w_0-w_1x_i)^2<\/span> 对 <span class=\"katex-inline\">w_1<\/span> 求偏导置零后，正规方程给出该比值。\n<\/li><li>\n<strong>截距<\/strong>：直线必须过均值点 <span class=\"katex-inline\">(\\bar x,\\bar y)<\/span>，故 <span class=\"katex-inline\">w_0=\\bar y-w_1\\bar x=2-0.5\\cdot2=1<\/span>。拟合直线为 <span class=\"katex-inline\">y=1+0.5x<\/span>。\n<\/li><li>\n<strong>回代算残差与均方误差<\/strong>：预测值依次为 <span class=\"katex-inline\">1.5<\/span>、<span class=\"katex-inline\">2.0<\/span>、<span class=\"katex-inline\">2.5<\/span>；残差为 <span class=\"katex-inline\">1-1.5=-0.5<\/span>、<span class=\"katex-inline\">3-2.0=1.0<\/span>、<span class=\"katex-inline\">2-2.5=-0.5<\/span>。平方和 <span class=\"katex-inline\">0.25+1.0+0.25=1.5<\/span>，均方误差 <span class=\"katex-inline\">MSE=1.5/3=0.5<\/span>。\n<\/ol>\n<h2>推导二：逻辑回归一步梯度更新<\/h2>\n<p>这次推演从线性组合出发，沿交叉熵梯度传到权重。 设权重初值 <span class=\"katex-inline\">w_1=0<\/span>、<span class=\"katex-inline\">w_0=0<\/span>，取一条训练样本 <span class=\"katex-inline\">x=1<\/span>、<span class=\"katex-inline\">y=1<\/span>，学习率 <span class=\"katex-inline\">\\eta=0.1<\/span>。<\/p>\n<ol><li>\n<strong>线性组合<\/strong>：<span class=\"katex-inline\">z=w_1x+w_0=0<\/span>。\n<\/li><li>\n<strong>Sigmoid 概率<\/strong>：<span class=\"katex-inline\">p=\\sigma(0)=1/(1+e^0)=0.5<\/span>。\n<\/li><li>\n<strong>交叉熵对权重的梯度<\/strong>：单样本下 <span class=\"katex-inline\">\\partial L/\\partial w_j=(p-y)x_j<\/span>，<span class=\"katex-inline\">\\partial L/\\partial w_0=p-y<\/span>（推导依据：交叉熵 <span class=\"katex-inline\">L=-[y\\log p+(1-y)\\log(1-p)]<\/span> 对 <span class=\"katex-inline\">z<\/span> 求导得 <span class=\"katex-inline\">p-y<\/span>，再按链式法则乘特征分量）。\n<\/li><li>\n<strong>代入数值<\/strong>：<span class=\"katex-inline\">p-y=0.5-1=-0.5<\/span>。\n<\/li><li>\n<strong>更新规则<\/strong>：<span class=\"katex-inline\">w_j\\leftarrow w_j-\\eta(p-y)x_j<\/span>，<span class=\"katex-inline\">w_0\\leftarrow w_0-\\eta(p-y)<\/span>。\n<\/ol>\n<div class=\"katex-block\">w_1\\leftarrow 0-0.1\\cdot(-0.5)\\cdot1=0.05,<\/div>\n<div class=\"katex-block\">w_0\\leftarrow 0-0.1\\cdot(-0.5)=0.05.<\/div>\n<ol><li>\n<strong>更新后回看<\/strong>：对同一样本 <span class=\"katex-inline\">z=0.05\\cdot1+0.05=0.10<\/span>，<span class=\"katex-inline\">p=\\sigma(0.10)\\approx0.525<\/span>，比更新前的 0.5 更靠近标签 1；这一步方向正确，但单步不会把概率推到 1，需要多轮遍历训练集。\n<\/ol>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>改掉损失函数<\/strong>：若对回归直接按「残差绝对值之和」优化而不用平方，对大偏差的惩罚不再随偏差平方增长，离群点对直线的拉力变小；模型仍能拟合，但对极端误差不敏感，评价口径也换了一套。\n<\/li><li>\n<strong>去掉正则化惩罚项<\/strong>：在六次多项式场景下，模型会用大系数穿过每个训练点，训练误差下降而验证误差升到 3.472（原书表 2-5，PDF 第 59 页）；惩罚项存在时，同一场景验证误差被压在 0.394 量级（原书表 2-6，PDF 第 60 页）。\n<\/li><li>\n<strong>改掉分类阈值<\/strong>：把阈值从 0.5 调到 0.3，更多样本被判为阳性，召回上升、精确率下降；阈值不是模型学出来的，而是按业务代价设定的决策选择。\n<\/li><li>\n<strong>去掉特征尺度对齐<\/strong>：若某特征取值在千分位、另一特征在个位数，梯度下降中两个权重的更新步调会被数值尺度带偏；正则化惩罚也会对大尺度特征不公平，这是后续数据预处理要处理的问题。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p>线性回归像用一根直线去「贴」散点，贴的标准是纵向距离平方之和最小；正则化像给直线的弯曲幅度上锁，不许它为几个点扭成复杂曲线；逻辑回归像先问「属于某类的把握有几成」，再按把握程度下判断。书中气温与是否积雪的例子给出 0 ℃、1 ℃、2 ℃ 时概率约 0.12、0.50、0.88（PDF 第 65、67 页），对应 Sigmoid 曲线随线性组合单调上升的形状。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解一：逻辑回归是回归算法<\/strong>。它输出的是类别概率，服务于分类任务；名字来自它内部先做线性回归式的加权组合。\n<\/li><li>\n<strong>误解二：损失最小就意味着预测最好<\/strong>。训练集损失最小可能伴随过拟合，泛化表现要在留出数据上衡量；正则化与第 4 章的验证流程就是为这一区别设置的。\n<\/li><li>\n<strong>误解三：梯度下降的步长越大学得越快<\/strong>。步长过大可能越过最优点来回震荡甚至发散；更新方向由梯度符号决定，步长由学习率控制，二者要分开检查。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n用本节三点数据方法，验证若把模型改成 <span class=\"katex-inline\">y=w_1x<\/span>（无截距项），拟合结果会怎样偏离均值点。\n<\/li><li>\n写出 L2 惩罚项 <span class=\"katex-inline\">\\lambda\\sum_j w_j^2<\/span> 对大系数的作用：系数翻倍时惩罚增加几倍？\n<\/li><li>\n逻辑回归在 <span class=\"katex-inline\">z=-2<\/span> 与 <span class=\"katex-inline\">z=2<\/span> 时的概率各是多少？二者关于 0.5 有什么对称关系？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\n线性回归：<span class=\"katex-inline\">y=w_0+w_1x<\/span>，损失为 <span class=\"katex-inline\">MSE=\\frac{1}{n}\\sum_i(y_i-\\hat y_i)^2<\/span>，最小二乘给出 <span class=\"katex-inline\">w_1=S_{xy}/S_{xx}<\/span>。\n<\/li><li>\n正则化在损失上加惩罚项，约束系数规模，抑制过拟合；L2 用平方，L1 用绝对值。\n<\/li><li>\n逻辑回归：<span class=\"katex-inline\">p=\\sigma(\\mathbf{w}^T\\mathbf{x}+w_0)<\/span>，梯度 <span class=\"katex-inline\">(p-y)x_j<\/span>，阈值 0.5 定类别。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章把「损失函数 + 参数更新」的基本套路搭起来：下一章的 SVM 换用间隔最大化作为目标，决策树换用不纯度下降作为分裂准则，kNN 则不在训练阶段更新参数；它们都要回到本章的损失思想来理解。正则化的系数收缩思路，与第 4 章防止过拟合、选择超参数的内容直接衔接；逻辑回归的概率输出，是后面比较分类指标（精确率、召回率）的基础。<\/p>", "ch03": "<div class=\"source-badge\">📖 出处：图解机器学习算法.pdf · p.71<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章 2.1–2.3：监督学习入门——线性回归、正则化、逻辑回归<\/a><\/span><\/div><h1>第 2 章 2.4–2.9：更多监督学习——SVM 与核方法、朴素贝叶斯、随机森林、神经网络、kNN<\/h1>\n<blockquote>对应原书第 2 章「有监督学习」2.4 支持向量机、2.5 支持向量机（核方法）、2.6 朴素贝叶斯、2.7 随机森林、2.8 神经网络、2.9 KNN。PDF 第 71–105 页；印刷页 58–92，偏移 k=13。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 SVM 间隔与点到决策边界距离的表达式，说明硬间隔、软间隔与支持向量的含义；\n<\/li><li>\n解释核方法怎样在不显式构造高维坐标的情况下处理非线性可分数据；\n<\/li><li>\n写出基尼系数公式，手算一个分裂节点的不纯度与加权平均不纯度；\n<\/li><li>\n说明随机森林怎样靠决策树多样性与多数表决降低单棵树的方差；\n<\/li><li>\n完成 kNN 的距离计算、近邻筛选与多数表决，说出 k 取值对决策边界的影响。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>本章算法分成三条路线：SVM 以间隔最大化找稳健边界，决策树与随机森林以不纯度下降做分裂再综合表决，kNN 不训练参数、预测时按近邻标签表决；核方法给前两类线性模型提供了处理非线性结构的通道。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 c05：支持向量机与核方法（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。线性支持向量机以间隔最大化为基准，学习尽可能远离数据的决策边界；它与逻辑回归一样给出线性边界，但在两类都能正确分类时，间隔更大的边界被认为更稳妥（原书 §2.4，PDF 第 71 页）。间隔是训练数据中最接近决策边界的样本与边界之间的距离；不允许数据进入间隔内侧的情形叫硬间隔，允许一部分数据进入间隔内侧的叫软间隔（PDF 第 73 页）。间隔上与间隔内侧的数据被特殊对待，称为支持向量，决策边界由这些样本确定。核方法（§2.5）把数据映射到更高维空间后再做线性划分，核技巧在不显式写出高维坐标的情况下完成这一变换，从而处理非线性可分数据（PDF 第 76–78 页）。<\/p>\n<h3>2. 概念 c06：决策树与随机森林（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。决策树把训练数据按条件分支划分，分裂时使用表示数据杂乱程度的不纯度；分裂后各组标签越一致，不纯度越小（原书 §2.7，PDF 第 89 页）。本书使用基尼系数 <span class=\"katex-inline\">1-\\sum_{i=1}^{c}p_i^2<\/span> 作为不纯度指标，<span class=\"katex-inline\">c<\/span> 是标签数，<span class=\"katex-inline\">p_i<\/span> 是某类样本占总数的比例（PDF 第 89 页）。随机森林用多棵决策树综合预测：每棵树给出输出，通过多数表决得到最终分类结果；要让表决有意义，各棵树必须具备多样性，而不是输出同一个模型（PDF 第 88 页）。<\/p>\n<h3>3. 概念 c07：k 近邻 kNN（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。kNN 在训练阶段机械记住全部训练数据，不做参数计算；预测时才计算未知数据与训练数据的距离，取最近的 <span class=\"katex-inline\">k<\/span> 个点，按标签多数表决（原书 §2.9，PDF 第 101 页）。<span class=\"katex-inline\">k<\/span> 是超参数；二元分类时常取奇数，避免票数持平。kNN 能拟合复杂边界，但 <span class=\"katex-inline\">k=1<\/span> 时容易出现飞地式的过拟合边界，<span class=\"katex-inline\">k<\/span> 过大则边界过度平滑、把局部结构抹平（PDF 第 102–103 页）。<\/p>\n<h3>4. 朴素贝叶斯与神经网络（原书 §2.6、§2.8）<\/h3>\n<p>朴素贝叶斯基于贝叶斯定理，在「特征之间条件独立」的朴素假设下，按各类别下特征出现的概率反推后验类别（PDF 第 81–87 页）。神经网络由多层加权求和与非线性激活堆叠而成，每层把上一层的输出作为输入，通过误差反向传播更新权重；本书只给出单层到多层的结构示意与代码，不展开深层推导（PDF 第 94–100 页）。这两类算法在概念网络中分别对应概率路线与函数逼近路线，与本章三条路线并列。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[待分类新样本] --&gt; B1[SVM 路线: 最大化间隔]\n    A --&gt; B2[树模型路线: 不纯度分裂]\n    A --&gt; B3[近邻路线: 找 k 个最近样本]\n    B1 --&gt; C1[支持向量决定边界]\n    B2 --&gt; C2[多棵树各自表决]\n    C2 --&gt; C3[多数表决出类别]\n    B3 --&gt; C4[近邻标签多数表决]\n    C1 --&gt; D[输出类别]\n    C3 --&gt; D\n    C4 --&gt; D<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条路线在训练阶段是否计算参数上差别最大——SVM 与树模型在训练时确定边界或分裂规则，kNN 训练阶段只存数据；把 kNN 当成「训练出了一组近邻参数」是常见的理解错位。<\/p>\n<h2>推导一：基尼系数与两种分裂方案的加权不纯度<\/h2>\n<p>下面把不纯度计算的推演逐步展开，核对每个子节点比例与权重。 节点共有 6 个样本，类别 A、B 各 3 个。基尼系数定义为 <span class=\"katex-inline\">G=1-\\sum_{i=1}^{c}p_i^2<\/span>。<\/p>\n<ol><li>\n<strong>分裂前节点<\/strong>：<span class=\"katex-inline\">p_A=p_B=3/6=0.5<\/span>，<span class=\"katex-inline\">G_0=1-0.5^2-0.5^2=0.5<\/span>。\n<\/li><li>\n<strong>方案甲<\/strong>：左子节点 3 个（1A, 2B），右子节点 3 个（2A, 1B）。\n<ul>\n<li>\n左：<span class=\"katex-inline\">G_L=1-(1/3)^2-(2/3)^2=1-1/9-4/9=4/9\\approx0.444<\/span>。\n<\/li><li>\n右：<span class=\"katex-inline\">G_R=1-(2/3)^2-(1/3)^2=4/9\\approx0.444<\/span>。\n<\/li><li>\n加权平均：<span class=\"katex-inline\">G_{甲}=\\frac{3}{6}G_L+\\frac{3}{6}G_R=4/9\\approx0.444<\/span>。\n<\/li><li>\n<strong>方案乙<\/strong>：左子节点 2 个（2A, 0B），右子节点 4 个（1A, 3B）。\n<\/li><li>\n左：纯节点，<span class=\"katex-inline\">G_L&#x27;=1-(2/2)^2-0=0<\/span>。\n<\/li><li>\n右：<span class=\"katex-inline\">G_R&#x27;=1-(1/4)^2-(3/4)^2=1-1/16-9/16=6/16=0.375<\/span>。\n<\/li><li>\n加权平均：<span class=\"katex-inline\">G_{乙}=\\frac{2}{6}\\cdot0+\\frac{4}{6}\\cdot0.375=0.25<\/span>。\n<\/li><li>\n<strong>分裂选择<\/strong>：<span class=\"katex-inline\">G_{乙}=0.25 &lt; G_{甲}=0.444<\/span>，方案乙使不纯度下降更多，决策树优先选方案乙。加权时按子节点样本数占比，不能直接对子节点基尼系数取算术平均。\n<\/ul>\n<\/ol>\n<h2>推导二：kNN 距离计算与多数表决<\/h2>\n<p>这次推演先排距离序，再按两轮 k 值分别表决。 待分类点 <span class=\"katex-inline\">q=(2,2)<\/span>，训练集 5 个点：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>样本<\/th><th>坐标<\/th><th>类别<\/th><th>到 q 的欧氏距离<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>(1, 1)<\/td><td>0<\/td><td><span class=\"katex-inline\">\\sqrt{(1-2)^2+(1-2)^2}=\\sqrt2\\approx1.414<\/span><\/td><\/tr><tr><td>B<\/td><td>(3, 1)<\/td><td>1<\/td><td><span class=\"katex-inline\">\\sqrt{(3-2)^2+(1-2)^2}=\\sqrt2\\approx1.414<\/span><\/td><\/tr><tr><td>C<\/td><td>(2, 4)<\/td><td>0<\/td><td><span class=\"katex-inline\">\\sqrt{(2-2)^2+(4-2)^2}=2<\/span><\/td><\/tr><tr><td>D<\/td><td>(4, 3)<\/td><td>1<\/td><td><span class=\"katex-inline\">\\sqrt{(4-2)^2+(3-2)^2}=\\sqrt5\\approx2.236<\/span><\/td><\/tr><tr><td>E<\/td><td>(0, 3)<\/td><td>1<\/td><td><span class=\"katex-inline\">\\sqrt{(0-2)^2+(3-2)^2}=\\sqrt5\\approx2.236<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<ol><li>\n<strong>按距离升序<\/strong>：A、B（1.414）→ C（2.0）→ D、E（2.236）。\n<\/li><li>\n<strong><span class=\"katex-inline\">k=3<\/span><\/strong>：取 A、B、C，类别 0 得 2 票（A、C），类别 1 得 1 票（B），多数表决预测类别 0。\n<\/li><li>\n<strong><span class=\"katex-inline\">k=5<\/span><\/strong>：全部 5 点参与，类别 0 得 2 票，类别 1 得 3 票，多数表决预测类别 1。\n<\/li><li>\n<strong>结论<\/strong>：同一个点，<span class=\"katex-inline\">k<\/span> 取值不同可以得到相反类别；<span class=\"katex-inline\">k<\/span> 的选择改变表决圈定的邻域大小，进而改变边界形状。欧氏距离 <span class=\"katex-inline\">\\sqrt{\\sum_j(x_j-q_j)^2}<\/span> 对各特征尺度敏感，特征量纲不齐时需要先标准化。\n<\/ol>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>把欧氏距离换成曼哈顿距离<\/strong>：距离改为 <span class=\"katex-inline\">\\sum_j|x_j-q_j|<\/span>，近邻排序可能改变。本例中 A、B 到 q 的曼哈顿距离都是 2，C 是 2，三者并列；距离度量换了，最近邻集合与表决结果随之变化，说明 kNN 的预测依赖距离定义。\n<\/li><li>\n<strong>去掉标准化直接算距离<\/strong>：若某特征取值范围是 0–1000，另一特征是 0–1，距离几乎被大尺度特征支配，小尺度特征的差异被压平；近邻不再反映各维度共同的相似性。\n<\/li><li>\n<strong>取消软间隔、退回硬间隔<\/strong>：对线性不可分的数据，硬间隔要求所有样本落在间隔外侧，可行解不存在；软间隔允许少量样本进入间隔内侧甚至误分，才得到可用边界（原书 §2.4，PDF 第 73 页）。\n<\/li><li>\n<strong>让随机森林的各棵树完全相同<\/strong>：树之间没有多样性，多数表决等价于单棵树投票，综合带来的方差降低消失；随机森林的收益来自树之间误差不相关，而不是树的数量本身。\n<\/li><li>\n<strong>把 k 固定为 1<\/strong>：决策边界围绕每个训练点形成小区域，噪声点被完整记住，出现飞地式过拟合；<span class=\"katex-inline\">k<\/span> 增大边界变平滑，但过大时局部细节被多数邻居抹平。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p>SVM 像在两类之间找一条两侧留出最宽走廊的路，走廊宽度就是间隔；决策树像一连串是非题，每道题把混在一起的样本往更纯的分组送；随机森林像召集一群看法有差异的专家投票；kNN 像问周围最近的几位邻居各自属于哪类，按多数意见归类。书中月亮形曲线数据集上 kNN 的拟合结果、随机森林对多棵树输出的汇总示意，分别对应这两种近邻与表决机制（PDF 第 88、102 页）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解一：SVM 的边界由所有样本决定<\/strong>。决策边界由支持向量（间隔上与间隔内侧的样本）确定，远离间隔外侧的样本移动位置不改变边界。\n<\/li><li>\n<strong>误解二：随机森林只是多跑几棵决策树取平均<\/strong>。树的多样性来自样本与特征的随机选取；没有多样性，投票不能降低方差。\n<\/li><li>\n<strong>误解三：kNN 是懒惰学习所以简单无效<\/strong>。它训练阶段不更新参数，但预测代价随样本数增长；在边界复杂、样本量适中的数据上，kNN 能给出其他线性模型表达不了的非线性边界。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n写出点到直线 <span class=\"katex-inline\">w_1x+w_0=0<\/span> 的距离表达式，并说明 SVM 间隔与这个距离的关系。\n<\/li><li>\n对一个纯节点（5 个样本全为类别 A）计算基尼系数；再写出把它错误分裂成两个混合节点后加权基尼的变化方向。\n<\/li><li>\n若把上例 k 取为 2，A、B 票数 1:1 持平，二元分类中通常怎样避免这种局面？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\nSVM：间隔 <span class=\"katex-inline\">2/\\|\\mathbf{w}\\|<\/span>，支持向量决定边界；软间隔允许样本进入内侧，核技巧处理非线性。\n<\/li><li>\n基尼系数 <span class=\"katex-inline\">1-\\sum p_i^2<\/span>，加权按子节点样本占比；随机森林靠多样树 + 多数表决。\n<\/li><li>\nkNN：存数据 → 算距离 → 取 k 近邻 → 表决；k 小易过拟合，k 大欠平滑。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章承接第 2 章的损失思想，但把优化目标换成间隔、不纯度与近邻表决；SVM 的间隔概念在第 4 章回归型 SVR 中复用，决策树的不纯度准则是理解集成方法的基础。下一章离开有监督标签，进入无监督的聚类与降维：k-means 沿用「距离 + 分组」的近邻直觉，但分组对象不再带答案；PCA 则从数据方差出发找新坐标。<\/p>", "ch04": "<div class=\"source-badge\">📖 出处：图解机器学习算法.pdf · p.106<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 2 章 2.4–2.9：更多监督学习——SVM 与核方法、朴素贝叶斯、随机森林、神经网络、kNN<\/a><\/span><\/div><h1>第 3–4 章：无监督学习（PCA、k-means）与模型评估、调参与数据处理<\/h1>\n<blockquote>对应原书第 3 章「无监督学习」（§3.1 PCA、§3.5 k-means 等）与第 4 章「评估方法和各种数据的处理」（§4.1 评估方法、§4.2 文本数据、§4.3 图像数据）。PDF 第 106–183 页；印刷页 93–170，偏移 k=13。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出聚类与降维两类无监督任务的区别，复述 k-means 的四步循环并手算一轮质心更新；\n<\/li><li>\n写出 PCA 从协方差矩阵到特征值分解、再到投影得分的流程，解释主成分方向与方差的关系；\n<\/li><li>\n由混淆矩阵的 TN、FP、FN、TP 算出正确率、精确率、召回率与 F 值；\n<\/li><li>\n区分均方误差与决定系数，说明两者在量纲与可比性上的差别；\n<\/li><li>\n解释过拟合、泛化能力、训练/验证划分与交叉验证的关系，说清超参数与学习参数的分工。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>无监督学习不靠答案标签：k-means 按距离把相似点归成簇并迭代更新质心，PCA 按方差最大方向找正交新坐标；而无论哪类模型，都要靠留出数据与交叉验证评估泛化表现，超参数在训练前设定，学习参数在拟合中更新。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 c08：k-means 聚类（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。把相似数据汇总为簇的方法叫聚类，k-means 是代表性聚类算法，因简单易懂、可用于较大数据集而被广泛应用于市场分析与计算机视觉（原书 §3.5，PDF 第 130 页）。典型步骤：随机选与簇数相同的数据点作为初始质心；计算各点与质心距离，归入最近质心所在簇；求每簇数据平均值作为新质心；重复分配与更新，直到样本不再换簇或达到最大步数（PDF 第 130–131 页）。簇数 <span class=\"katex-inline\">k<\/span> 是超参数；初始质心选得不好（如初始质心过近）会使训练不顺，k-means++ 这类初始化方法选择彼此尽可能远的点作为起点（PDF 第 131 页）。<\/p>\n<h3>2. 概念 c09：PCA 主成分分析（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。PCA 是代表性降维算法，在保留数据特征的前提下用少量变量表示多变量数据（原书 §3.1，PDF 第 107 页）。降维分两种：只挑出重要变量、舍弃其余；或基于原变量构造新变量。PCA 走后一条路：主成分以原变量线性组合的形式组成新轴（PDF 第 107 页）。算法步骤为计算协方差矩阵、对协方差矩阵求解特征值问题得到特征向量与特征值、按主成分方向表示数据（PDF 第 108 页）。第一主成分取方差最大的正交方向，其后依次排列；特征值大小对应各方向的重要度。<\/p>\n<h3>3. 概念 c10：模型评估与过拟合（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。有监督评估分分类与回归两套指标（原书 §4.1，PDF 第 153 页）。分类指标由混淆矩阵算出：正确率 <span class=\"katex-inline\">(TP+TN)/全部<\/span>，精确率 <span class=\"katex-inline\">TP/(TP+FP)<\/span>，召回率 <span class=\"katex-inline\">TP/(TP+FN)<\/span>，F 值为精确率与召回率的调和平均（PDF 第 154 页）。回归指标用均方误差与决定系数：MSE 是误差平方的平均，决定系数 <span class=\"katex-inline\">R^2<\/span> 越接近 1 解释能力越强，误差过大时可能为负（PDF 第 160–163 页）。过拟合指训练数据上效果好、验证数据上表现差的现象；模型对未知数据的预测能力叫泛化能力（PDF 第 167 页）。防止过拟合的代表方法是划分训练/验证数据，并用交叉验证多轮估计泛化表现；超参数（如 SVR 的 C 与 kernel）在训练前由人设定，不由拟合过程更新（PDF 第 166–171 页）。<\/p>\n<h3>4. 文本与图像数据的转换<\/h3>\n<p>文本数据先按单词出现次数转换为向量，再可按 tf-idf 加权；图像数据可直接把像素信息作为数值向量输入模型（原书 §4.2、§4.3，PDF 第 176–181 页）。这两类转换回答「非数值形态的数据怎样变成算法能吃的向量」，是模型输入前的预处理环节。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[数据] --&gt; B{是否带标签?}\n    B -- 不带 --&gt; C[k-means: 距离分配 + 质心更新]\n    B -- 不带 --&gt; D[PCA: 协方差 → 特征值 → 投影]\n    B -- 带标签 --&gt; E[有监督模型]\n    C --&gt; F[簇结构 / 降维坐标]\n    D --&gt; F\n    E --&gt; G[留出验证集评估指标]\n    F --&gt; G\n    G --&gt; H{泛化是否达标?}\n    H -- 否 --&gt; I[调整超参数 / 正则化 / 换模型]\n    I --&gt; E\n    H -- 是 --&gt; J[部署预测新数据]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：评估环节卡在模型与部署之间；跳过验证直接部署，过拟合只在真实使用时暴露。无监督结果没有标准答案对错，簇与主成分的解释需要结合业务含义事后确认。<\/p>\n<h2>推导一：k-means 一轮质心更新与簇内平方和<\/h2>\n<p>下面把分配与更新的推演走一轮，核对质心与 SSE 数值。 四个点：<span class=\"katex-inline\">A(1,1)<\/span>、<span class=\"katex-inline\">B(1,2)<\/span>、<span class=\"katex-inline\">C(8,8)<\/span>、<span class=\"katex-inline\">D(9,8)<\/span>，设簇数 <span class=\"katex-inline\">k=2<\/span>，初始质心 <span class=\"katex-inline\">\\mu_1=A<\/span>、<span class=\"katex-inline\">\\mu_2=C<\/span>。<\/p>\n<ol><li>\n<strong>距离分配<\/strong>：\n<ul>\n<li>\n<span class=\"katex-inline\">B<\/span> 到 <span class=\"katex-inline\">\\mu_1<\/span> 距离 <span class=\"katex-inline\">|1-1|+|2-1|=1<\/span>（欧氏距离同值），到 <span class=\"katex-inline\">\\mu_2<\/span> 距离 <span class=\"katex-inline\">\\sqrt{(8-1)^2+(8-2)^2}=\\sqrt{85}\\approx9.22<\/span>，归入簇 1。\n<\/li><li>\n<span class=\"katex-inline\">D<\/span> 到 <span class=\"katex-inline\">\\mu_2<\/span> 距离 <span class=\"katex-inline\">|9-8|+|8-8|=1<\/span>，到 <span class=\"katex-inline\">\\mu_1<\/span> 距离 <span class=\"katex-inline\">\\sqrt{8^2+7^2}\\approx10.63<\/span>，归入簇 2。\n<\/li><li>\n簇 1：<span class=\"katex-inline\">\\{A,B\\}<\/span>；簇 2：<span class=\"katex-inline\">\\{C,D\\}<\/span>。\n<\/li><li>\n<strong>更新质心<\/strong>（取簇内坐标平均）：\n<\/ul>\n<\/ol>\n<div class=\"katex-block\">\\mu_1'=\\left(\\frac{1+1}{2},\\frac{1+2}{2}\\right)=(1,1.5),<\/div>\n<div class=\"katex-block\">\\mu_2'=\\left(\\frac{8+9}{2},\\frac{8+8}{2}\\right)=(8.5,8).<\/div>\n<ol><li>\n<strong>再分配核对<\/strong>：<span class=\"katex-inline\">B<\/span> 到 <span class=\"katex-inline\">\\mu_1&#x27;<\/span> 距离 0.5，<span class=\"katex-inline\">A<\/span> 到 <span class=\"katex-inline\">\\mu_1&#x27;<\/span> 距离 0.5；<span class=\"katex-inline\">C<\/span> 到 <span class=\"katex-inline\">\\mu_2&#x27;<\/span> 距离 0.5，<span class=\"katex-inline\">D<\/span> 到 <span class=\"katex-inline\">\\mu_2&#x27;<\/span> 距离 0.5；没有样本换簇，算法收敛。\n<\/li><li>\n<strong>簇内平方和（SSE）<\/strong>：簇 1 中 <span class=\"katex-inline\">A:(0,-0.5)^2=0.25<\/span>，<span class=\"katex-inline\">B:(0,0.5)^2=0.25<\/span>，合计 0.5；簇 2 中 <span class=\"katex-inline\">C:(-0.5,0)^2=0.25<\/span>，<span class=\"katex-inline\">D:(0.5,0)^2=0.25<\/span>，合计 0.5；总 SSE <span class=\"katex-inline\">=1.0<\/span>。SSE 随迭代下降，是观察聚类紧凑程度的指标。\n<\/ol>\n<h2>推导二：混淆矩阵四类指标手算<\/h2>\n<p>这次推演从四格计数出发，逐个派生分类指标。 沿用原书乳腺癌数据集结果（PDF 第 154 页）：<span class=\"katex-inline\">TN=341<\/span>，<span class=\"katex-inline\">FP=16<\/span>，<span class=\"katex-inline\">FN=36<\/span>，<span class=\"katex-inline\">TP=176<\/span>。样本总数 <span class=\"katex-inline\">341+16+36+176=569<\/span>。<\/p>\n<ol><li>\n<strong>正确率<\/strong>：<span class=\"katex-inline\">accuracy=(TP+TN)/全部=(176+341)/569=517/569\\approx0.9086<\/span>。\n<\/li><li>\n<strong>精确率<\/strong>：<span class=\"katex-inline\">precision=TP/(TP+FP)=176/(176+16)=176/192\\approx0.9167<\/span>，即预测为恶性的病例中真正恶性的比例。\n<\/li><li>\n<strong>召回率<\/strong>：<span class=\"katex-inline\">recall=TP/(TP+FN)=176/(176+36)=176/212\\approx0.8302<\/span>，即实际恶性病例中被找出的比例；36 个 FN 是被漏诊的恶性患者。\n<\/li><li>\n<strong>F 值<\/strong>：<span class=\"katex-inline\">F_1=2\\cdot(P\\cdot R)/(P+R)<\/span>。先算 <span class=\"katex-inline\">P\\cdot R\\approx0.9167\\cdot0.8302\\approx0.7611<\/span>，<span class=\"katex-inline\">2\\cdot0.7611=1.5222<\/span>，<span class=\"katex-inline\">P+R\\approx1.7469<\/span>，故 <span class=\"katex-inline\">F_1\\approx1.5222/1.7469\\approx0.8713<\/span>。\n<\/li><li>\n<strong>指标取舍<\/strong>：漏诊代价高的场景优先看召回率；误报代价高的场景优先看精确率；两者同等重要时用 F 值。类别不均衡时正确率会失真，需要结合 AUC 等指标（PDF 第 159–160 页）。\n<\/ol>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>改掉簇数 <span class=\"katex-inline\">k<\/span><\/strong>：<span class=\"katex-inline\">k=1<\/span> 时全部点进同一簇，簇内平方和最大；<span class=\"katex-inline\">k<\/span> 等于样本数时每点自成一簇，SSE 为 0 但没有概括结构。簇数要结合 Elbow 方法或业务含义选择，不能只看 SSE 单调下降。\n<\/li><li>\n<strong>去掉数据标准化再做 PCA<\/strong>：协方差矩阵受变量量纲支配，大尺度变量即使相关性弱也会占住主成分方向；标准化后各变量方差对齐，主成分才反映结构相关而非数值大小。\n<\/li><li>\n<strong>把全部数据用于训练、不留验证集<\/strong>：训练误差可以压得很低，但过拟合无法被发现；书中 SVR 在训练集 MSE 约 36.4，换到留出数据上 <span class=\"katex-inline\">R^2<\/span> 为负（PDF 第 166–167 页），说明同一模型在未见数据上失效。\n<\/li><li>\n<strong>用单次随机划分代替交叉验证<\/strong>：验证集恰好落在容易或困难的切片上，指标会随划分波动；交叉验证把数据切多份轮流验证，用多轮平均降低单次划分的偶然性。\n<\/li><li>\n<strong>把超参数当成学习参数在拟合中更新<\/strong>：<span class=\"katex-inline\">k<\/span>、正则化强度、SVM 的 C 值若随梯度自动调整，模型会在训练集上把超参数也优化掉，泛化估计随之失真；超参数必须由训练流程外部给定。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p>k-means 像把一桌子文件按距离远近归成几摞，每摞的平均位置作为新代表，反复挪动直到归属稳定；PCA 像把斜着铺开的点云转一个角度，让第一个新轴沿着铺得最开的方向；交叉验证像把练习题切成多套，轮流拿一套当模拟考、其余当练习，避免只做过的那套题考高分。书中鸢尾花数据上 k-means 得到三个簇质心，波士顿房价数据上线性回归 <span class=\"katex-inline\">R^2<\/span> 约 0.484（PDF 第 131、162 页），都是指标落地的对照实例。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解一：聚类结果等于真实类别<\/strong>。无监督算法只按距离分组，簇标签是相对编号；把簇对应到业务类别需要人工解释，簇内是否同质也要看轮廓与业务检查。\n<\/li><li>\n<strong>误解二：MSE 越小模型一定越好<\/strong>。MSE 带目标变量的量纲，目标变量方差大时 MSE 天然偏大；决定系数把误差相对基准方差归一化，跨数据集比较时更稳妥（PDF 第 163 页）。\n<\/li><li>\n<strong>误解三：主成分就是原变量中最重要的几个<\/strong>。主成分是原变量的线性组合，方向由协方差结构决定，不等于直接挑选原有特征。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n对本节四点数据，若初始质心改为 <span class=\"katex-inline\">\\mu_1=B<\/span>、<span class=\"katex-inline\">\\mu_2=D<\/span>，写出第一轮分配与更新后的质心。\n<\/li><li>\n给定混淆矩阵 <span class=\"katex-inline\">TN=80,FP=5,FN=10,TP=55<\/span>，计算正确率、精确率、召回率与 F 值。\n<\/li><li>\n说明交叉验证为什么比「训练集上算一次误差」更能反映泛化能力；它消耗的计算代价是什么。\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\nk-means：选质心 → 按距离分配 → 更新均值 → 迭代至稳定；<span class=\"katex-inline\">k<\/span> 是超参数，SSE 衡量紧凑度。\n<\/li><li>\nPCA：协方差矩阵 → 特征值/特征向量 → 投影得分；主成分按方差从大到小排列。\n<\/li><li>\n评估：分类看混淆矩阵四指标，回归看 MSE 与 <span class=\"katex-inline\">R^2<\/span>；过拟合靠划分验证与交叉验证识别，超参数训练前设定。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章收束全书：第 1 章的问题类型划分，在这里落到具体指标选择；第 2、3 章各算法的模型表现，都要回到本章的验证流程与指标口径下比较。无监督部分的聚类与降维，为有监督模型提供特征加工与可视化手段；文本、图像的数据转换则是任何算法进入实际项目前的输入环节。读完本章，可以按「问题类型 → 数据形态 → 候选算法 → 验证指标 → 超参数调整」的顺序，独立走完一个机器学习问题的完整流程。<\/p>", "c01": "<div class=\"source-badge\">📖 出处：图解机器学习算法.pdf · p.14<\/div><h1>机器学习基本概念：监督、无监督、强化学习与建模流程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书第 1 章 §1.1–1.2，PDF 第 14–49 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>初学机器学习时，最容易把人工智能、机器学习、深度学习当成三个并列热点词混用，也容易在拿到一个问题时直接翻算法库，跳过「这个问题属于哪一类」的判断。如果不先分清数据是否带答案、待预测量是连续值还是类别值，后面选算法、选指标都会错位：把分类任务当回归做，损失函数与评价口径全错；把无标签数据塞进监督模型，模型没有可拟合的答案。这个概念要解决的具体困难，是给任何一个机器学习问题提供第一道分类筛子，并说清从数据到预测的完整流程。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>机器学习<\/strong>：计算机根据给定的问题、课题或环境进行学习，并利用学习结果解决问题或课题的一整套机制（原书 §1.1，PDF 第 15 页）。拆开看三点：输入是问题与数据，中间环节是「学习」——从样本中总结出规律或参数，输出是能处理新情况的模型或规则。<\/p>\n<p>按输入数据形态，机器学习分为三类：<\/p>\n<ol><li>\n<strong>有监督学习<\/strong>：训练数据中既含表示特征的数据，也含作为答案的目标数据。算法拿到「特征 + 答案」的配对，学到从特征到目标的映射。\n<\/li><li>\n<strong>无监督学习<\/strong>：训练数据只有特征、不带答案，算法按数据本身的相似性或结构组织输入，典型任务是聚类与降维。\n<\/li><li>\n<strong>强化学习<\/strong>：智能体在环境中采取行动，按获得的奖励或惩罚调整策略，通过试错累积长期收益。本书只做概念区分，未展开具体算法。\n<\/ol>\n<p>有监督学习内部再分两类：目标变量取连续数值的是<strong>回归问题<\/strong>，目标变量取离散类别的是<strong>分类问题<\/strong>；只分两个类别叫二元分类。<\/p>\n<p><strong>学习参数<\/strong>与<strong>超参数<\/strong>是两套参数：学习参数由算法在拟合训练数据的过程中更新得到；超参数在训练开始前由人工设定，例如近邻数、簇数、正则化强度。<\/p>\n<p>正例：身高、体重 + 性别标签 → 有监督分类；用户浏览记录向量、无购买标签 → 无监督聚类；棋面对局 + 胜负奖惩 → 强化学习。反例：只有特征没有标签却要求模型「自动给出正确类别」，这不是无监督学习能直接完成的事，簇的业务含义需要事后人工解释。<\/p>\n<h2>原理推导<\/h2>\n<p>机器学习流程可以推成一条可检查的链条。<\/p>\n<ol><li>\n<strong>数据表示<\/strong>：每条样本写成 <span class=\"katex-inline\">(\\mathbf{x}_i, y_i)<\/span>，<span class=\"katex-inline\">\\mathbf{x}_i<\/span> 是特征向量，<span class=\"katex-inline\">y_i<\/span> 是目标变量；无监督样本只写 <span class=\"katex-inline\">\\mathbf{x}_i<\/span>。数据是模型唯一的经验来源，特征取值范围、缺失与异常会被模型吸收。\n<\/li><li>\n<strong>问题归类<\/strong>：先看 <span class=\"katex-inline\">y_i<\/span> 是否存在；存在再看取值性质。连续数值 → 回归；离散标签 → 分类。归类发生在选算法之前。\n<\/li><li>\n<strong>模型与损失<\/strong>：选定模型形式后，定义一个以学习参数为自变量、衡量预测与目标差距的损失函数；学习就是找使损失最小的参数组合。\n<\/li><li>\n<strong>拟合与验证<\/strong>：用训练数据拟合参数，留出不参与训练的数据检查泛化表现；泛化指模型对未见数据的预测能力。\n<\/li><li>\n<strong>预测<\/strong>：把新样本输入模型，回归输出数值，分类输出类别或类别概率。\n<\/ol>\n<p>三类学习的差别可以从数据契约上推：有监督的契约是「特征—答案」配对，模型可对照答案纠错；无监督的契约只有特征，模型只能依据距离、密度、方差等结构量组织数据；强化学习的契约是行动—反馈序列，策略按长期奖励调整而非单次答案对照。<\/p>\n<p>把流程落到原书示例上：乳腺癌数据集每条样本含多项体检特征与良恶性标签，属于有监督分类；鸢尾花数据集在聚类演示中只用花瓣、花萼尺寸向量，属于无监督聚类（原书 §1.2，PDF 第 24–43 页）。书中先做可视化查看散点分布与变量相关，再把数据交给算法，这一步对应流程链条里「理解数据」的环节：可视化能暴露类别是否分离、变量是否偏态、是否存在离群点，避免在不合理的数据分布上直接堆算法。<\/p>\n<p>问题归类的判定可以写成两步检查。第一步查答案：训练样本里有没有与特征配套的目标变量；没有则归入无监督。第二步查目标性质：目标是可连续取值的数值（如房价、温度、时长）则为回归；目标是互斥标签（如良/恶性、猫/狗）则为分类。两步检查都发生在调用任何库函数之前，目的是先锁定损失函数与评价指标的可选范围。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：有监督路线要求训练数据带可靠标签，标签口径前后一致；无监督路线要求特征之间存在可被距离或方差捕捉的结构；强化学习需要环境能给出可计算的反馈信号。\n<\/li><li>\n边界一：问题类型判断不能替代算法比较。归类只缩小候选范围，同一类问题下不同算法的表现仍要靠验证数据比较。\n<\/li><li>\n边界二：机器学习不是实现人工智能的唯一方法，事先定规则做数理统计预测也是传统路线；深度学习只是机器学习中的一类算法（PDF 第 15–16 页）。\n<\/li><li>\n失败案例：把类别标签编码成 0、1 后按回归拟合连续值，输出 0.4、1.2 这类非法类别；根因是损失与任务类型不匹配，而非模型容量不够。\n<\/li><li>\n失败案例：数据量不足或特征不含目标信息时，任何算法都学不出可靠映射，这时应回到数据采集与特征构造，而不是更换更复杂的模型。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>人工智能 vs 机器学习 vs 深度学习<\/strong>：三者逐层包含。人工智能是综合性系统目标，机器学习是实现它的一类方法，深度学习是机器学习中的一类算法。不能倒过来把三者并列。\n<\/li><li>\n<strong>回归 vs 分类<\/strong>：差别在目标变量取值集合，不在特征数量或模型复杂度。房价预测是回归，户型档次预测是分类；同一组特征换目标变量，问题类型随之改变。\n<\/li><li>\n<strong>有监督 vs 无监督<\/strong>：分界线是训练数据是否带答案标签，不是算法是否「聪明」。聚类结果没有标准答案对错，簇标签是相对编号。\n<\/li><li>\n<strong>学习参数 vs 超参数<\/strong>：前者在拟合中由数据更新，后者在训练流程外部设定；把超参数也交给拟合过程自动优化，会让泛化估计失真。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无，本章是全书起点概念。后继：c02 线性回归与 c04 逻辑回归在有监督框架内分别对应回归与分类路线；c05–c07 的间隔、树、近邻算法都是有监督模型的具体形式；c08 k-means 与 c09 PCA 是无监督路线的代表；c10 评估概念回到本章的训练/验证划分，说明怎样检验模型的泛化能力。本章确定的问题类型筛子，贯穿后续每一章的算法选择与指标选择。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（机器学习基本概念：监督、无监督、强化学习与建模流程）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：机器学习问题的分类链条与建模流程拆解<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把「拿到问题先归类、再选模型」讲到底，往回追五层前提：<\/p>\n<ol><li>\n<strong>先承认数据是模型的经验来源<\/strong>。模型不能凭空得到规律，所有可学的内容都来自训练样本中的特征与标签；离开数据质量谈算法优劣没有依据。\n<\/li><li>\n<strong>分清样本的表示形式<\/strong>。一条有监督样本写成 <span class=\"katex-inline\">(\\mathbf{x}_i,y_i)<\/span>，<span class=\"katex-inline\">\\mathbf{x}_i<\/span> 是特征向量，<span class=\"katex-inline\">y_i<\/span> 是目标变量；无监督样本只保留 <span class=\"katex-inline\">\\mathbf{x}_i<\/span>。表示形式决定后面能挂哪一类学习算法。\n<\/li><li>\n<strong>目标变量的取值性质决定任务类型<\/strong>。连续数值与离散标签是两类互不重叠的取值集合，回归与分类的损失函数、指标都按这个区分设计。\n<\/li><li>\n<strong>损失函数把拟合好坏变成标量<\/strong>。任何有监督算法都要先定义衡量预测与目标差距的损失，再找使损失最小的参数；没有损失就没有优化方向。\n<\/li><li>\n<strong>泛化要靠未见数据检验<\/strong>。训练误差只说明见过的数据拟合程度，模型对新数据的表现必须在留出数据上估计；这一步把流程从「拟合」接到「可用」。\n<\/ol>\n<p>依赖链方向：数据表示 → 有无标签 → 目标性质 → 模型与损失 → 拟合验证。任何一层前提缺失，问题归类就退化成凭印象挑算法，后续指标选择也会跟着错位。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：从数据契约判断学习类型<\/h3>\n<p>设训练集共 <span class=\"katex-inline\">n<\/span> 条样本。逐条检查样本中是否存在与特征配套的目标变量 <span class=\"katex-inline\">y_i<\/span>：<\/p>\n<ul><li>\n全部样本都有 <span class=\"katex-inline\">y_i<\/span> → 有监督学习；\n<\/li><li>\n全部样本都没有 <span class=\"katex-inline\">y_i<\/span> → 无监督学习；\n<\/li><li>\n反馈以行动—奖励序列给出、策略按长期收益调整 → 强化学习。\n<p>依据是三类学习的数据契约不同：有监督可对照答案纠错，无监督只能依据结构量组织数据，强化学习按反馈序列调整策略。<\/p>\n<\/ul>\n<h3>第二步：在有监督内部区分回归与分类<\/h3>\n<p>检查 <span class=\"katex-inline\">y_i<\/span> 的取值集合：<\/p>\n<ul><li>\n若 <span class=\"katex-inline\">y_i<\/span> 在某个实数区间内连续可取，两个数值之间还能插入更多数值 → 回归问题；\n<\/li><li>\n若 <span class=\"katex-inline\">y_i<\/span> 只能取互斥的固定标签，标签之间没有大小次序 → 分类问题；只含两个标签的子集为二元分类。\n<p>这一步的依据是损失与指标按任务类型设计：回归用均方误差这类误差平方口径，分类用混淆矩阵派生的正确率、精确率、召回率口径。<\/p>\n<\/ul>\n<h3>第三步：选定模型形式并定义损失<\/h3>\n<p>模型形式把 <span class=\"katex-inline\">\\mathbf{x}_i<\/span> 映射到预测值 <span class=\"katex-inline\">\\hat y_i<\/span>。损失函数 <span class=\"katex-inline\">L(\\mathbf{w})<\/span> 以学习参数 <span class=\"katex-inline\">\\mathbf{w}<\/span> 为自变量，汇总全体样本上的预测差距；优化环节在可行参数范围内找使 <span class=\"katex-inline\">L<\/span> 最小的 <span class=\"katex-inline\">\\mathbf{w}<\/span>。不同算法的差别主要在模型形式与损失定义，最小化损失这一环节是共通的。<\/p>\n<h3>第四步：拟合、验证与预测<\/h3>\n<p>训练数据用于更新学习参数；留出的验证数据不参与拟合，只用于估计泛化表现。验证达标后，新样本输入模型得到预测：回归输出数值，分类输出类别或类别概率。超参数在训练开始前由人设定，不进入拟合更新过程。<\/p>\n<h3>第五步：检查归类是否被后续环节支持<\/h3>\n<p>归类结论要回头核对：损失函数是否与任务类型匹配，评价指标是否选对，数据划分是否保留了验证集。任何一项对不上，说明归类链条在某一步被跳过，需要退回重新判断。<\/p>\n<h2>数值算例一：四个待选任务的归类走查<\/h2>\n<p>给定四个场景，按两步检查逐条归类。<\/p>\n<p>场景 A：1000 条电商记录，每条含浏览时长、点击次数、加购记录，标签为是否成交。检查：有标签 → 有监督；标签取「成交/未成交」两个类别 → 分类问题。候选方向：逻辑回归、SVM、随机森林、kNN。<\/p>\n<p>场景 B：一批手机传感器读数，无使用结果记录，希望按读数模式分组以排查故障类型。检查：无标签 → 无监督；目标是把相似读数归簇 → 聚类任务。候选方向：k-means、混合高斯分布。<\/p>\n<p>场景 C：历史房屋面积、地段数据，目标是预测成交价格。检查：有标签；价格在实数区间连续可取 → 回归问题。候选方向：线性回归、SVR。<\/p>\n<p>场景 D：下棋程序根据当前局面选择落子，每局结束按胜负获得反馈。检查：反馈是行动—奖励序列，策略在试错中调整 → 强化学习。本书未展开该路线的具体算法。<\/p>\n<p>统计口径核对：场景 A 的 1000 条样本中若成交 200 条、未成交 800 条，类别比例为 1:4，属于不均衡数据；这种分布下正确率会偏向多数类，评估时不能只看正确率，需结合精确率、召回率与 AUC。<\/p>\n<h2>数值算例二：一次有监督分类的计算链<\/h2>\n<p>设训练集含两条样本：<span class=\"katex-inline\">\\mathbf{x}_1=(170,65)<\/span>，<span class=\"katex-inline\">y_1=1<\/span>；<span class=\"katex-inline\">\\mathbf{x}_2=(155,48)<\/span>，<span class=\"katex-inline\">y_2=0<\/span>。新样本 <span class=\"katex-inline\">\\mathbf{x}_{new}=(160,55)<\/span>。<\/p>\n<ol><li>\n模型先对 <span class=\"katex-inline\">\\mathbf{x}_{new}<\/span> 给出类别倾向分数，再按阈值落成预测标签；二元分类常用阈值 0.5，倾向分数高于 0.5 判为 1，低于 0.5 判为 0。\n<\/li><li>\n单个样本的预测对错不能作为模型优劣依据；模型水平要在一批验证样本上统计正确比例。\n<\/li><li>\n反查链条：特征是身高、体重，标签是二分类，损失应选分类口径（交叉熵或间隔类目标），指标应看正确率、精确率、召回率；若误用均方误差按回归拟合，输出会落在 0 与 1 之间的连续区间，无法直接表决为合法类别。\n<\/ol>\n<h2>概念在原书脉络中的展开对照<\/h2>\n<p>原书第 1 章先用一句话界定机器学习，再梳理人工智能、机器学习、深度学习的包含关系，随后把机器学习种类分成有监督、无监督、强化学习三类，其后在 §1.2 展开数据重要性、分类与聚类示例、可视化与 pandas 数据处理（PDF 第 15–43 页）。这条叙述顺序与依赖链一致：先定义机制，再分数据契约，再落到流程。本节把叙述顺序还原成可推演的链条，每一步都能回到原书对应页面核对。<\/p>\n<p>有监督分类的书内示例以身高、体重预测性别为载体（PDF 第 16–17 页）：特征是连续量，答案是离散类别。有监督聚类示例用鸢尾花数据，先看花瓣与花萼尺寸的散点分布，再交给分组算法。两类示例对照阅读，可以看清「有无答案标签」是分界线，而不是数据长相的差别。<\/p>\n<h2>失败案例复盘<\/h2>\n<ul><li>\n<strong>案例一：把分类当回归<\/strong>。良/恶性标签编码为 0、1 后用回归模型拟合，模型输出 0.4、1.2 这类介于标签之间的数值；根因是损失口径与任务类型不匹配，模型容量再大也补不回来。修正：先按第二步检查目标性质，分类任务换分类模型与分类指标。\n<\/li><li>\n<strong>案例二：无标签数据硬走监督路线<\/strong>。只有用户行为向量、没有购买标签，却要求模型直接输出「正确类别」；监督模型没有可对照的答案，所谓类别只是对特征分布的猜测。修正：转入聚类，簇的业务含义由人工事后解释。\n<\/li><li>\n<strong>案例三：训练误差低就判定可用<\/strong>。全部数据参与训练，模型记住样本细节，训练误差很低；换到未见数据上表现恶化，这是过拟合。修正：划分训练/验证集，用交叉验证估计泛化，不能把训练误差当部署依据。\n<\/li><li>\n<strong>案例四：超参数交给拟合过程自动调<\/strong>。近邻数、簇数、正则化强度随梯度在训练集上更新，模型在训练集上把超参数也优化掉，泛化估计随之失真。修正：超参数在训练流程外部设定，用验证集比较不同取值。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：三类学习按什么划分？答：按训练数据是否带答案标签，以及反馈形式；带答案是有监督，不带答案是无监督，行动—奖励反馈是强化学习。\n<\/li><li>\n问：回归与分类的分界线在哪？答：在目标变量取值集合；连续数值归回归，离散标签归分类。\n<\/li><li>\n问：学习参数和超参数谁在拟合中更新？答：学习参数由算法在训练数据上更新；超参数训练前由人设定。\n<\/li><li>\n问：训练误差低为什么不等于模型可用？答：训练误差只反映见过的数据，泛化表现要在留出的未见数据上检验。\n<\/li><li>\n问：人工智能、机器学习、深度学习是什么包含关系？答：人工智能 ⊃ 机器学习 ⊃ 深度学习。\n<\/ul>\n<h2>流程数值走查：一份小数据集从归类到验证<\/h2>\n<p>设一份数据集共 12 条记录，字段为年龄、收入、是否购买。其中购买 4 条、未购买 8 条。<\/p>\n<ol><li>\n<strong>归类<\/strong>：字段「是否购买」是配套答案 → 有监督；取值为「买/未买」两个标签 → 二元分类。\n<\/li><li>\n<strong>拆分<\/strong>：按 7:3 划分，训练集约 8 条，验证集约 4 条；划分时标签比例尽量保持接近整体的 1:2，避免验证集全是同一类。\n<\/li><li>\n<strong>训练环节<\/strong>：模型在 8 条训练样本上更新学习参数；训练误差记录这 8 条上的预测偏差。\n<\/li><li>\n<strong>验证环节<\/strong>：用训练好的模型对 4 条验证样本预测，统计正确条数。设验证结果为 3 对 1 错，验证正确率为 <span class=\"katex-inline\">3/4=0.75<\/span>。这个数字只反映这份随机切片上的表现；换一次随机划分，正确率会变动，因此正式评估用交叉验证多轮平均。\n<\/li><li>\n<strong>反查口径<\/strong>：若误用回归口径算均方误差，把标签 0、1 当连续值，误差平方的平均无法回答「类别判对了几条」；分类场景必须回到混淆矩阵口径。\n<\/li><li>\n<strong>超参数位置<\/strong>：候选算法的近邻数、正则化强度在训练前选定，再用验证集比较；它们不随训练样本的梯度更新。\n<\/ol>\n<p>这份走查把依赖链上的每一层前提都落到具体计数：数据表示是 12 条记录的字段结构，有无标签由「是否购买」字段确认，目标性质是二分类，损失与指标按分类选取，泛化由留出的 4 条样本估计。任何一步口径变动，后面的统计量就不能与其他模型直接比较。<\/p>\n<h2>常见疑问的逐条回应<\/h2>\n<ul><li>\n<strong>疑问：无监督学习是不是因为技术弱才不给标签？<\/strong> 不是。无标签往往是采集成本决定的：给海量文本、图像打标签代价高，而结构发现（分组、压缩、可视化）本身可以成为目标。无监督结果的用途是后续加工或辅助理解，不等于有监督预测的替代品。\n<\/li><li>\n<strong>疑问：强化学习与有监督的反馈有何本质不同？<\/strong> 有监督的答案在每条样本上预先给定，模型一次对照一个固定标签；强化学习的奖励延迟在行动序列之后，策略要权衡当前行动对长期奖励的影响，单步行动没有即时对错标签。\n<\/li><li>\n<strong>疑问：特征变量多了是不是就该用深度学习？<\/strong> 模型选择与特征数量没有直接的上下位关系。特征多、样本少时复杂模型更容易记住噪声；深度学习的优势体现在数据规模与结构复杂度匹配的场景，归类阶段不预设模型档次。\n<\/li><li>\n<strong>疑问：流程中可视化排在什么位置？<\/strong> 可视化在模型训练之前，属于理解数据的环节：看类别是否分离、变量是否相关、有无离群点与偏态分布。它不产出模型参数，但影响后续特征构造与算法候选。\n<\/ul>\n<h2>从损失视角看常见模型家族的位置<\/h2>\n<p>有监督算法的共性是「定义损失 → 优化参数」，差别在模型形式与损失口径上。这条线索把后续概念串成一张网。<\/p>\n<ol><li>\n<strong>回归家族<\/strong>：模型输出连续值，损失取误差平方的平均，代表是线性回归。学习参数由最小二乘条件或梯度下降确定，评价用 MSE 与决定系数。\n<\/li><li>\n<strong>概率分类家族<\/strong>：模型输出类别概率，损失取交叉熵，代表是逻辑回归。概率经阈值落成类别，评价看混淆矩阵派生指标。\n<\/li><li>\n<strong>间隔与实例家族<\/strong>：SVM 以间隔最大化为目标，kNN 不训练参数、预测时按近邻表决；二者都不直接套用平方误差，但仍要回答「怎样衡量模型在新数据上的表现」。\n<\/li><li>\n<strong>树与集成家族<\/strong>：决策树按不纯度下降分裂，随机森林把多棵树的表决结果综合；分裂准则是不纯度，最终评价仍回到分类指标。\n<\/li><li>\n<strong>无监督家族<\/strong>：k-means 以簇内距离平方和为紧凑度度量，PCA 以方差最大化为方向准则；没有答案标签，评估只能用内部结构量与事后业务解释。\n<\/ol>\n<p>把这张网记住，后续每学一个新算法，先问三件事：输入有没有标签、目标是连续值还是类别、优化的目标量是什么。三个问题答完，算法在网络中的位置就确定了，再看具体公式与更新规则。<\/p>\n<h2>符号约定与阅读本书公式的入口<\/h2>\n<p>原书前言对记号做了统一约定（PDF 第 18–19 页前后），后续概念都在这套记号下展开，先固定下来避免读公式时卡住。<\/p>\n<ul><li>\n<strong>向量<\/strong>：小写粗斜体表示向量，第 <span class=\"katex-inline\">i<\/span> 个元素记为 <span class=\"katex-inline\">x_i<\/span>，如 <span class=\"katex-inline\">\\mathbf{x}=(x_1,x_2,x_3)^T<\/span>。\n<\/li><li>\n<strong>矩阵<\/strong>：大写粗斜体表示矩阵，第 <span class=\"katex-inline\">i<\/span> 行第 <span class=\"katex-inline\">j<\/span> 列元素记为 <span class=\"katex-inline\">w_{ij}<\/span>。\n<\/li><li>\n<strong>总和<\/strong>：<span class=\"katex-inline\">n<\/span> 个值的求和写成 <span class=\"katex-inline\">\\sum_{i=1}^{n}x_i<\/span>，下标 <span class=\"katex-inline\">i<\/span> 从 1 到 <span class=\"katex-inline\">n<\/span> 遍历。\n<\/li><li>\n<strong>预测值<\/strong>：本书用 <span class=\"katex-inline\">\\hat y_i<\/span> 表示模型对第 <span class=\"katex-inline\">i<\/span> 条样本的预测，<span class=\"katex-inline\">y_i<\/span> 是真实目标，残差为 <span class=\"katex-inline\">y_i-\\hat y_i<\/span>。\n<\/li><li>\n<strong>概率<\/strong>：分类场景中 <span class=\"katex-inline\">p<\/span> 表示模型输出的类别概率，取值落在 <span class=\"katex-inline\">(0,1)<\/span> 区间。\n<\/ul>\n<p>读后续公式时按固定顺序拆：先认自变量是哪个向量或参数，再看求和覆盖哪些样本，再看损失或指标把各项汇总成什么标量。这套拆法对回归损失、分类损失、聚类紧凑度都适用。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n给定一批广告点击数据，特征为投放时段与素材类型，目标是预测点击量（连续数值），写出学习类型与问题类型，并各举一个候选算法。\n<\/li><li>\n聚类得到的簇标签能否直接当作真实类别标签使用？说明理由。\n<\/li><li>\n同一个数据集，分别预测「用户是否续费」与「续费金额」，两者的问题类型与评价指标有何差别？\n<\/li><li>\n为什么问题归类必须在调用算法库之前完成？跳过这一步会在哪两个环节出错？\n<\/li><li>\n强化学习的反馈信号与有监督的标签在数据形态上有什么不同？\n<\/ol><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：图解机器学习算法.pdf · p.51<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">机器学习基本概念：监督、无监督、强化学习与建模流程<\/a><\/span><\/div><h1>线性回归：最小二乘目标函数、正规方程与梯度下降一步<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch02（原书 §2.1 算法 1：线性回归，PDF 第 51–57 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>面对「目标变量随特征变量增大而增大或减小」的关联数据，需要一个能给出数值预测的模型。困难在于：散点通常不在一条直线上，怎样从一堆不共线的点里选出最有代表性的直线？凭视觉挑直线因人而异，必须有一个可计算、可复现的选择标准。线性回归解决的就是这个问题：用一条直线（或超平面）拟合数据，标准是预测值与真实值的误差平方和最小。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>一元线性回归模型写成<\/p>\n<div class=\"katex-block\">y=w_0+w_1x,<\/div>\n<p><span class=\"katex-inline\">x<\/span> 是特征变量，<span class=\"katex-inline\">y<\/span> 是目标变量，<span class=\"katex-inline\">w_1<\/span> 是斜率（权重），<span class=\"katex-inline\">w_0<\/span> 是截距，二者合称学习参数。只有一个特征的叫一元回归；多个特征时模型为 <span class=\"katex-inline\">y=w_0+\\sum_j w_jx_j<\/span>。<\/p>\n<p><strong>均方误差（MSE）<\/strong> 定义为<\/p>\n<div class=\"katex-block\">MSE=\\frac{1}{n}\\sum_{i=1}^{n}\\bigl(y_i-(w_0+w_1x_i)\\bigr)^2.<\/div>\n<p>括号内是残差（真实值减预测值），平方后消除正负抵消，再取平均。使 MSE 最小的 <span class=\"katex-inline\">(w_0,w_1)<\/span> 就是最小二乘解。<\/p>\n<p><strong>正规方程<\/strong>：对损失关于参数求偏导并置零，解出的闭式解为 <span class=\"katex-inline\">w_1=S_{xy}/S_{xx}<\/span>，<span class=\"katex-inline\">w_0=\\bar y-w_1\\bar x<\/span>，其中 <span class=\"katex-inline\">S_{xx}=\\sum_i(x_i-\\bar x)^2<\/span>，<span class=\"katex-inline\">S_{xy}=\\sum_i(x_i-\\bar x)(y_i-\\bar y)<\/span>。<\/p>\n<p><strong>梯度下降<\/strong>：无法或不愿做闭式求解时，沿损失梯度的反方向迭代更新参数；单步更新为 <span class=\"katex-inline\">w_j\\leftarrow w_j-\\eta\\,\\partial L/\\partial w_j<\/span>，<span class=\"katex-inline\">\\eta<\/span> 是学习率。<\/p>\n<p>正例：用房间数预测房价直线拟合。反例：标签是良/恶性类别时不能套线性回归，残差平方口径与分类任务不匹配。<\/p>\n<h2>原理推导<\/h2>\n<p>最小二乘的目标是 <span class=\"katex-inline\">L(w_0,w_1)=\\sum_i(y_i-w_0-w_1x_i)^2<\/span>。对 <span class=\"katex-inline\">w_0<\/span> 求偏导并置零：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_0}=-2\\sum_i(y_i-w_0-w_1x_i)=0,<\/div>\n<p>整理得 <span class=\"katex-inline\">\\bar y=w_0+w_1\\bar x<\/span>，即直线过均值点。对 <span class=\"katex-inline\">w_1<\/span> 求偏导置零，与上式联立消去 <span class=\"katex-inline\">w_0<\/span>，得到 <span class=\"katex-inline\">w_1=S_{xy}/S_{xx}<\/span>。这就是正规方程路径：偏导为零给出极值条件，联立解出参数。<\/p>\n<p>梯度下降路径不从方程出发，而是迭代。损失对权重的偏导为<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_0}=-\\frac{2}{n}\\sum_i e_i,\\qquad \\frac{\\partial L}{\\partial w_1}=-\\frac{2}{n}\\sum_i x_i e_i,<\/div>\n<p>其中 <span class=\"katex-inline\">e_i=y_i-\\hat y_i<\/span>。梯度指向损失上升方向，更新沿反方向走 <span class=\"katex-inline\">\\eta<\/span> 步长。多轮遍历训练集后参数逼近最优点。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：目标与特征之间近似线性关系；残差在各特征取值附近波动均匀；特征尺度不齐时先标准化，否则梯度更新被量纲带偏。\n<\/li><li>\n边界一：线性模型表达不了弯曲关系，强行拟合会出现欠拟合；可通过增加多项式特征缓解，但复杂度上升后需要正则化约束（见 c03）。\n<\/li><li>\n边界二：最小二乘对离群点敏感，单个极端点会明显拉动直线，因为平方误差放大了大偏差。\n<\/li><li>\n失败案例：特征与目标呈周期或分段结构时，直线无论怎么调参数都贴合不上，MSE 再小也只代表在错误模型形式下相对最优。\n<\/li><li>\n失败案例：特征之间高度共线时，正规方程数值不稳定，系数估计方差变大，需要正则化或降维处理。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>线性回归 vs 逻辑回归<\/strong>：前者输出连续值、用平方误差；后者输出类别概率、用交叉熵。名字里的「回归」不代表逻辑回归属于回归任务。\n<\/li><li>\n<strong>最小二乘解 vs 梯度下降解<\/strong>：前者是闭式一步求出，后者是迭代逼近；二者目标函数相同，差别在求解路径与计算规模。样本量很大时迭代法更省内存。\n<\/li><li>\n<strong>截距 vs 权重<\/strong>：截距是直线在 <span class=\"katex-inline\">y<\/span> 轴的落点，对应所有特征为零时的基准值；权重刻画单个特征变动对预测的影响幅度。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的问题类型判定（回归任务）。后继：c03 正则化在最小二乘损失上加惩罚项；c04 逻辑回归沿用「加权组合 + 损失最小化」的骨架，只换输出函数与损失；c09 PCA 的方差最大化在代数上与最小二乘同属二次型优化；c10 用 MSE 与决定系数评价回归模型。线性回归是理解其余监督算法参数更新机制的基准模型。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（线性回归：最小二乘目标函数、正规方程与梯度下降一步）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：最小二乘闭式解与梯度下降单步更新<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把线性回归推到底，往回追六层前提：<\/p>\n<ol><li>\n<strong>任务是回归<\/strong>：目标变量连续可取，损失才能用误差平方口径；若是分类任务，平方误差与类别表决不匹配。\n<\/li><li>\n<strong>模型形式是线性<\/strong>：预测值为 <span class=\"katex-inline\">w_0+\\sum_j w_jx_j<\/span>，参数与预测呈线性关系；形式选错，再优的参数也贴合不上弯曲结构。\n<\/li><li>\n<strong>损失可写成参数的二次函数<\/strong>：残差平方和关于 <span class=\"katex-inline\">w_0,w_1<\/span> 是二次型，存在唯一极小值，求偏导置零可解。\n<\/li><li>\n<strong>极值条件是偏导为零<\/strong>：可导函数取极小值时各偏导数为零；这是正规方程的依据。\n<\/li><li>\n<strong>梯度方向与下降方向相反<\/strong>：梯度指向损失上升最快的方向，更新沿负梯度方向，步长由学习率控制。\n<\/li><li>\n<strong>数据尺度影响优化<\/strong>：特征量纲不齐时，不同权重的更新步调被数值尺度扭曲，迭代前要标准化。\n<\/ol>\n<p>依赖链方向：任务类型 → 模型形式 → 损失二次型 → 极值条件 → 求解路径（闭式或迭代）→ 优化稳定性。任何一层断掉，最小二乘或梯度下降的结论都不成立。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：写出损失函数<\/h3>\n<p>给定 <span class=\"katex-inline\">n<\/span> 条样本 <span class=\"katex-inline\">(x_i,y_i)<\/span>，模型预测 <span class=\"katex-inline\">\\hat y_i=w_0+w_1x_i<\/span>，残差 <span class=\"katex-inline\">e_i=y_i-\\hat y_i<\/span>。平方误差和为<\/p>\n<div class=\"katex-block\">L(w_0,w_1)=\\sum_{i=1}^{n}e_i^2=\\sum_{i=1}^{n}(y_i-w_0-w_1x_i)^2.<\/div>\n<p>取平均与求和只相差常数因子 <span class=\"katex-inline\">1/n<\/span>，不改变最优点。平方的作用是消除正负残差抵消，并对大偏差施加更重惩罚。<\/p>\n<h3>第二步：对截距求偏导并置零<\/h3>\n<p>展开 <span class=\"katex-inline\">L<\/span> 对 <span class=\"katex-inline\">w_0<\/span> 的偏导：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_0}=-2\\sum_{i=1}^{n}(y_i-w_0-w_1x_i).<\/div>\n<p>令其为零：<span class=\"katex-inline\">\\sum_i y_i-nw_0-w_1\\sum_i x_i=0<\/span>，两边除以 <span class=\"katex-inline\">n<\/span> 得<\/p>\n<div class=\"katex-block\">\\bar y=w_0+w_1\\bar x.<\/div>\n<p>这条式子说明拟合直线必过样本均值点 <span class=\"katex-inline\">(\\bar x,\\bar y)<\/span>。<\/p>\n<h3>第三步：对斜率求偏导并联立<\/h3>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_1}=-2\\sum_{i=1}^{n}x_i(y_i-w_0-w_1x_i)=0.<\/div>\n<p>把第二步的 <span class=\"katex-inline\">w_0=\\bar y-w_1\\bar x<\/span> 代入上式，整理得到<\/p>\n<div class=\"katex-block\">w_1=\\frac{\\sum_i(x_i-\\bar x)(y_i-\\bar y)}{\\sum_i(x_i-\\bar x)^2}=\\frac{S_{xy}}{S_{xx}}.<\/div>\n<p>分母 <span class=\"katex-inline\">S_{xx}<\/span> 是特征离差平方和，分子 <span class=\"katex-inline\">S_{xy}<\/span> 是离差乘积和。<span class=\"katex-inline\">S_{xx}=0<\/span> 时所有特征值相同，斜率不可识别，正规方程无解。<\/p>\n<h3>第四步：梯度下降的更新规则<\/h3>\n<p>损失写成平均形式 <span class=\"katex-inline\">L=\\frac1n\\sum_i e_i^2<\/span>，偏导为<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_0}=-\\frac{2}{n}\\sum_i e_i,\\qquad \\frac{\\partial L}{\\partial w_1}=-\\frac{2}{n}\\sum_i x_i e_i.<\/div>\n<p>单步更新：<\/p>\n<div class=\"katex-block\">w_0\\leftarrow w_0-\\eta\\frac{\\partial L}{\\partial w_0},\\qquad w_1\\leftarrow w_1-\\eta\\frac{\\partial L}{\\partial w_1}.<\/div>\n<p><span class=\"katex-inline\">\\eta<\/span> 控制每步沿负梯度走多远。学习率过大可能越过最优点震荡甚至发散；过小则收敛很慢。多轮遍历后参数稳定在最优点附近。<\/p>\n<h3>第五步：解的核对<\/h3>\n<p>闭式解与梯度下降解应落在同一组参数上：前者一步给出最优点，后者逐步逼近。核对时把参数代回损失，比较残差平方和是否达到最小；也可在验证集上看 MSE 是否优于朴素基准（用均值预测）。<\/p>\n<h2>数值算例一：三个点的最小二乘手算<\/h2>\n<p>数据点 <span class=\"katex-inline\">(1,1)<\/span>、<span class=\"katex-inline\">(2,3)<\/span>、<span class=\"katex-inline\">(3,2)<\/span>。<\/p>\n<ol><li>\n均值：<span class=\"katex-inline\">\\bar x=(1+2+3)/3=2<\/span>，<span class=\"katex-inline\">\\bar y=(1+3+2)/3=2<\/span>。\n<\/li><li>\n离差平方和：<span class=\"katex-inline\">S_{xx}=(-1)^2+0^2+1^2=2<\/span>。\n<\/li><li>\n离差乘积和：<span class=\"katex-inline\">S_{xy}=(-1)(-1)+0\\cdot1+1\\cdot0=1<\/span>。\n<\/li><li>\n斜率：<span class=\"katex-inline\">w_1=1/2=0.5<\/span>。\n<\/li><li>\n截距：<span class=\"katex-inline\">w_0=2-0.5\\cdot2=1<\/span>，拟合直线 <span class=\"katex-inline\">y=1+0.5x<\/span>。\n<\/li><li>\n回代预测：<span class=\"katex-inline\">x=1<\/span> 给 <span class=\"katex-inline\">1.5<\/span>，<span class=\"katex-inline\">x=2<\/span> 给 <span class=\"katex-inline\">2.0<\/span>，<span class=\"katex-inline\">x=3<\/span> 给 <span class=\"katex-inline\">2.5<\/span>。\n<\/li><li>\n残差：<span class=\"katex-inline\">1-1.5=-0.5<\/span>，<span class=\"katex-inline\">3-2.0=1.0<\/span>，<span class=\"katex-inline\">2-2.5=-0.5<\/span>。\n<\/li><li>\n平方和 <span class=\"katex-inline\">0.25+1.0+0.25=1.5<\/span>，<span class=\"katex-inline\">MSE=1.5/3=0.5<\/span>。\n<\/li><li>\n核对均值点：<span class=\"katex-inline\">x=2<\/span> 时 <span class=\"katex-inline\">y=1+1=2<\/span>，与 <span class=\"katex-inline\">\\bar y=2<\/span> 一致，满足第二步结论。\n<\/ol>\n<h2>数值算例二：从零初始化的一步梯度下降<\/h2>\n<p>沿用上面三点数据，参数初值 <span class=\"katex-inline\">w_0=0<\/span>、<span class=\"katex-inline\">w_1=0<\/span>，学习率 <span class=\"katex-inline\">\\eta=0.01<\/span>。<\/p>\n<ol><li>\n初值预测全为 0，残差 <span class=\"katex-inline\">e_i=y_i<\/span>：<span class=\"katex-inline\">e_1=1<\/span>，<span class=\"katex-inline\">e_2=3<\/span>，<span class=\"katex-inline\">e_3=2<\/span>。\n<\/li><li>\n残差和：<span class=\"katex-inline\">\\sum e_i=6<\/span>；特征乘残差和：<span class=\"katex-inline\">\\sum x_i e_i=1\\cdot1+2\\cdot3+3\\cdot2=13<\/span>。\n<\/li><li>\n截距梯度：<span class=\"katex-inline\">\\partial L/\\partial w_0=-(2/3)\\cdot6=-4<\/span>。\n<\/li><li>\n斜率梯度：<span class=\"katex-inline\">\\partial L/\\partial w_1=-(2/3)\\cdot13=-26/3\\approx-8.667<\/span>。\n<\/li><li>\n更新：<span class=\"katex-inline\">w_0\\leftarrow0-0.01\\cdot(-4)=0.04<\/span>；<span class=\"katex-inline\">w_1\\leftarrow0-0.01\\cdot(-8.667)\\approx0.0867<\/span>。\n<\/li><li>\n更新后对 <span class=\"katex-inline\">x=1<\/span> 的预测为 <span class=\"katex-inline\">0.04+0.0867=0.1267<\/span>，残差从 1 降到约 0.8733；单步只朝最优方向移动一小段，需多轮迭代才接近闭式解 <span class=\"katex-inline\">(1,0.5)<\/span>。\n<\/li><li>\n步长检查：若 <span class=\"katex-inline\">\\eta<\/span> 取 0.1，<span class=\"katex-inline\">w_1<\/span> 单步变动 0.867，容易越过 <span class=\"katex-inline\">w_1=0.5<\/span> 来回震荡；步长选择要让每轮损失下降而非发散。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<ul><li>\n<strong>案例一：离群点拉偏直线<\/strong>。若四点中混入 <span class=\"katex-inline\">(10,0)<\/span>，最小二乘会为压低这个大偏差平方值调整整条直线，其余三点拟合变差。根因是平方误差对大偏差敏感；应对是检查离群点、改用稳健损失或在建模前清洗。\n<\/li><li>\n<strong>案例二：非线性结构硬套直线<\/strong>。数据呈 <span class=\"katex-inline\">y=\\sin(2\\pi x)<\/span> 形态，一元直线无论参数取何值都贴合不上，MSE 最小也只是错误形式下的相对最优。应对是增加多项式特征或换非线性模型。\n<\/li><li>\n<strong>案例三：共线特征导致系数不稳<\/strong>。两个特征高度相关时，正规方程分母接近奇异，系数估计在两个共线变量间摇摆。应对是正则化（c03）或先降维（c09）。\n<\/li><li>\n<strong>案例四：未标准化就迭代<\/strong>。一个特征取值 0–1000，另一个 0–1，梯度下降在大尺度特征对应权重上步子过大，小尺度特征几乎不动。应对是迭代前把各特征缩到相近方差。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：线性回归的损失量的是什么？答：预测值与真实值残差的平方平均，即 MSE。\n<\/li><li>\n问：正规方程解出的直线必过哪个点？答：样本均值点 <span class=\"katex-inline\">(\\bar x,\\bar y)<\/span>。\n<\/li><li>\n问：<span class=\"katex-inline\">w_1=S_{xy}/S_{xx}<\/span> 中分母为零会怎样？答：特征取值全相同，斜率不可识别，方程无解。\n<\/li><li>\n问：梯度下降为什么沿负梯度更新？答：梯度指向损失上升方向，负梯度方向损失下降最快。\n<\/li><li>\n问：学习率过大有什么表现？答：参数越过最优点震荡，损失不降反升甚至发散。\n<\/ul>\n<h2>矩阵形式与计算代价<\/h2>\n<p>把 <span class=\"katex-inline\">n<\/span> 条样本写成设计矩阵 <span class=\"katex-inline\">X<\/span>（每行一条样本，首列为 1 对应截距），目标向量为 <span class=\"katex-inline\">\\mathbf{y}<\/span>，最小二乘闭式解写成<\/p>\n<div class=\"katex-block\">\\hat{\\mathbf{w}}=(X^TX)^{-1}X^T\\mathbf{y}.<\/div>\n<p>这一形式是 <span class=\"katex-inline\">w_1=S_{xy}/S_{xx}<\/span> 在多特征下的推广。计算代价主要来自矩阵求逆：<span class=\"katex-inline\">X^TX<\/span> 是 <span class=\"katex-inline\">d\\times d<\/span> 矩阵，求逆约 <span class=\"katex-inline\">O(d^3)<\/span>，样本量 <span class=\"katex-inline\">n<\/span> 影响 <span class=\"katex-inline\">X^TX<\/span> 的构造（<span class=\"katex-inline\">O(nd^2)<\/span>）。当特征数 <span class=\"katex-inline\">d<\/span> 很大或 <span class=\"katex-inline\">X^TX<\/span> 接近奇异时，闭式解数值不稳，工程上常用梯度下降或其随机版本，按批次更新参数，内存占用随批次大小增长而非随全量样本增长。<\/p>\n<p>泛化角度看，线性回归的训练误差随模型复杂度上升而下降，但复杂度越过拐点后验证误差回升；欠拟合对应直线压不平结构，过拟合对应高次多项式穿过噪声点。判断拟合程度要看训练误差与验证误差的差距，而不是单看训练 MSE 大小。回归模型的比较口径见 c10：MSE 带目标变量量纲，跨数据集比较时用决定系数 <span class=\"katex-inline\">R^2<\/span>。<\/p>\n<h2>补充推导：残差结构与拟合优度<\/h2>\n<p>最小二乘解有一条可核对的代数性质：拟合直线过均值点，且残差之和为零。由截距最优条件 <span class=\"katex-inline\">\\sum_i(y_i-w_0-w_1x_i)=0<\/span> 直接得到 <span class=\"katex-inline\">\\sum_i e_i=0<\/span>，即正残差与负残差在总和上抵消。残差与特征乘积和也为零：由斜率最优条件 <span class=\"katex-inline\">\\sum_i x_i e_i=0<\/span>，说明残差中不再含有可被特征线性解释的成分。<\/p>\n<p>用两点直线核对这条性质：样本 <span class=\"katex-inline\">(0,0)<\/span>、<span class=\"katex-inline\">(4,2)<\/span>，<span class=\"katex-inline\">\\bar x=2<\/span>，<span class=\"katex-inline\">\\bar y=1<\/span>，<span class=\"katex-inline\">S_{xx}=8<\/span>，<span class=\"katex-inline\">S_{xy}=8<\/span>，<span class=\"katex-inline\">w_1=1<\/span>，<span class=\"katex-inline\">w_0=1-1\\cdot2=-1<\/span>，直线 <span class=\"katex-inline\">y=x-1<\/span>。预测为 <span class=\"katex-inline\">-1<\/span>、<span class=\"katex-inline\">3<\/span>，残差为 <span class=\"katex-inline\">1<\/span>、<span class=\"katex-inline\">-1<\/span>，残差和为 0；残差乘特征：<span class=\"katex-inline\">0\\cdot1+4\\cdot(-1)=-4<\/span>，按斜率条件应为 0，核对显示该式在两点情形同样成立。<\/p>\n<p>拟合优度角度，回归平方和与残差平方和相加等于总离差平方和；<span class=\"katex-inline\">R^2<\/span> 即回归平方和占总离差的比例，与 c10 回归指标口径一致。线性回归模型欠拟合时，残差随特征呈弯曲趋势，平方误差无法靠调系数消除，需要增加多项式特征或换非线性模型。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n对两点 <span class=\"katex-inline\">(0,0)<\/span>、<span class=\"katex-inline\">(4,2)<\/span> 求最小二乘直线，并核对直线过均值点。\n<\/li><li>\n写出 MSE 对 <span class=\"katex-inline\">w_1<\/span> 的偏导表达式，说明每一项来自哪个样本。\n<\/li><li>\n为什么平方误差比绝对误差更看重大偏差？这一特性在离群点场景下是优点还是缺点？\n<\/li><li>\n闭式解与梯度下降解的目标函数是否相同？各自在什么数据规模下更可取？\n<\/li><li>\n特征未标准化时，正则化惩罚为什么对大尺度特征不公平？\n<\/ol><\/div><\/details>", "c03": "<div class=\"source-badge\">📖 出处：图解机器学习算法.pdf · p.58<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">线性回归：最小二乘目标函数、正规方程与梯度下降一步<\/a><\/span><\/div><h1>正则化：L1/L2 惩罚项、系数收缩与过拟合抑制<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch02（原书 §2.2 算法 2：正则化，PDF 第 58–64 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>模型复杂度升高时，训练误差可以压得很低，验证误差却明显变大：模型把训练数据里的个别噪声也记了下来，这就是过拟合。困难在于怎样在不删减特征的前提下约束模型幅度。正则化解决这个问题：在原有损失函数上增加一项对系数规模的惩罚，迫使拟合偏向更平缓、系数更小的模型，以牺牲少量训练拟合为代价换取更好的泛化表现。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>正则化损失<\/strong>以线性回归为例，L2（Ridge）形式为<\/p>\n<div class=\"katex-block\">L=\\sum_{i=1}^{n}(y_i-w_0-\\sum_j w_jx_i_j)^2+\\lambda\\sum_{j}w_j^2.<\/div>\n<p>前半是残差平方和，后半是惩罚项；<span class=\"katex-inline\">\\lambda\\ge 0<\/span> 是正则化强度，控制惩罚比重。<span class=\"katex-inline\">\\lambda=0<\/span> 退回普通最小二乘；<span class=\"katex-inline\">\\lambda<\/span> 越大，系数被压得越小。<\/p>\n<p><strong>L1（Lasso）<\/strong> 惩罚项为 <span class=\"katex-inline\">\\lambda\\sum_j|w_j|<\/span>，对系数取绝对值求和。<\/p>\n<p><strong>系数收缩<\/strong>：惩罚项把权重往零的方向拉。L2 让各系数按比例缩小，特征相关时分担系数；L1 倾向把部分系数压到恰为零，附带特征选择效果。<\/p>\n<p><strong>过拟合<\/strong>：模型在训练数据上误差很低、在未参与训练的数据上误差很高的现象；根源之一是模型过于复杂，正则化是抑制手段之一（原书 §2.2，PDF 第 58 页）。<\/p>\n<p>正例：高次多项式拟合含噪声的正弦数据，加惩罚后曲线不再随个别噪声点剧烈摆动。反例：<span class=\"katex-inline\">\\lambda<\/span> 取过大时所有系数趋近零，模型退化成只看截距，训练与验证误差都偏高，属于欠拟合。<\/p>\n<h2>原理推导<\/h2>\n<p>不加惩罚时，最小二乘只让残差平方和最小，噪声通过大系数进入模型。加入 L2 惩罚后，目标对 <span class=\"katex-inline\">w_j<\/span> 求偏导：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_j}=\\frac{\\partial}{\\partial w_j}\\sum_i e_i^2+2\\lambda w_j.<\/div>\n<p>更新或最优条件中，惩罚项给每个权重一个朝向零的拉力：权重越大，附加梯度越大，收缩越强。L1 的次梯度为 <span class=\"katex-inline\">\\lambda\\,\\operatorname{sign}(w_j)<\/span>，在零附近把小系数推入零值。<\/p>\n<p>从偏差—方差角度看，正则化提高了一点偏差（拟合直线更简单），但显著降低系数估计的方差；当方差下降幅度超过偏差上升幅度，整体泛化误差下降。原书对照实验：六次多项式训练误差 0.024、验证误差 3.472；加入正则化后同复杂度下验证误差被压在较低水平（原书表 2-5、表 2-6，PDF 第 59–60 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：模型容量相对于数据量偏大、特征多而噪声明显；交叉验证显示训练误差与验证误差差距偏大时优先尝试。\n<\/li><li>\n边界一：正则化不创造信息。特征本身不含目标信号时，惩罚只能防止系数乱跳，不能补出缺失规律。\n<\/li><li>\n边界二：<span class=\"katex-inline\">\\lambda<\/span> 需在训练前设定，属于超参数；取值靠验证集或交叉验证比较，不能由拟合过程自动优化。\n<\/li><li>\n失败案例：特征未标准化时，惩罚对大尺度特征不公平——同等惩罚下小尺度特征系数更易被压零，L1 的特征选择结果被量纲扭曲。\n<\/li><li>\n失败案例：<span class=\"katex-inline\">\\lambda<\/span> 过大导致全部系数趋零，模型退化为常数预测，欠拟合信号是训练误差与验证误差同时偏高。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>L2 vs L1<\/strong>：L2 惩罚平方项，解稠密、按比例收缩，适合特征都保留的场景；L1 惩罚绝对值，解稀疏、产生零系数，可做特征选择。两者也可组合为 Elastic Net。\n<\/li><li>\n<strong>正则化 vs 剪枝/降维<\/strong>：正则化在训练中软约束系数规模；降维在建模前舍弃或压缩特征；剪枝是训练后移除部分结构。三者作用阶段不同。\n<\/li><li>\n<strong>惩罚项 vs 损失项<\/strong>：损失项衡量拟合好坏，惩罚项衡量模型幅度；<span class=\"katex-inline\">\\lambda<\/span> 调节两者权重，不是再加一条拟合标准。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 线性回归的最小二乘损失。后继：c04 逻辑回归同样可加 L1/L2 惩罚；c10 把正则化强度与近邻数、核参数并列为超参数，用交叉验证选择；过拟合概念在 c10 评估框架中与训练/验证划分、泛化能力对接。正则化是连接「模型复杂度」与「泛化误差」的直接手段。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（正则化：L1/L2 惩罚项、系数收缩与过拟合抑制）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：惩罚项怎样收缩系数并抑制过拟合<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把正则化讲到底，往回追六层前提：<\/p>\n<ol><li>\n<strong>先有可过拟合的模型<\/strong>：模型容量高于数据复杂度时，大系数可以去贴合个别噪声；没有复杂度余地就谈不上过拟合。\n<\/li><li>\n<strong>原损失是残差平方和<\/strong>：最小二乘只约束拟合程度，不约束系数大小；这是 c02 已经推过的损失形式。\n<\/li><li>\n<strong>惩罚项度量模型幅度<\/strong>：在损失上叠加系数规模项，把「模型复杂」变成可计算的代价。\n<\/li><li>\n<strong>强度 λ 是外部设定<\/strong>：惩罚比重在训练前给定，属于超参数，用验证集比较取值。\n<\/li><li>\n<strong>收缩改变偏差与方差<\/strong>：惩罚抬高少量偏差，压低系数估计方差；泛化误差是两者综合，不是只看拟合。\n<\/li><li>\n<strong>特征尺度必须对齐<\/strong>：惩罚按系数数值作用，量纲不齐会让惩罚偏向大尺度特征，正则化前要标准化。\n<\/ol>\n<p>依赖链方向：模型容量 → 原损失 → 惩罚项 → 收缩机制 → 偏差方差权衡 → 超参数选择。任何一层缺失，正则化要么无处施加，要么收缩方向被量纲扭曲。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：写出带惩罚的目标<\/h3>\n<p>以一元以上线性回归为例，L2 正则化目标为<\/p>\n<div class=\"katex-block\">L=\\sum_{i=1}^{n}(y_i-w_0-\\sum_j w_jx_{ij})^2+\\lambda\\sum_j w_j^2.<\/div>\n<p>截距 <span class=\"katex-inline\">w_0<\/span> 通常不参与惩罚，因为它是基准水平，不代表模型幅度。<span class=\"katex-inline\">\\lambda=0<\/span> 时退回普通最小二乘；<span class=\"katex-inline\">\\lambda<\/span> 增大，惩罚在目标中占比上升。<\/p>\n<h3>第二步：求偏导看收缩方向<\/h3>\n<p>对任一权重 <span class=\"katex-inline\">w_j<\/span>：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_j}=\\frac{\\partial}{\\partial w_j}\\sum_i e_i^2+2\\lambda w_j.<\/div>\n<p>第一项是普通最小二乘梯度，第二项是惩罚带来的附加梯度。最优条件要求两项之和为零：普通梯度被 <span class=\"katex-inline\">2\\lambda w_j<\/span> 抵消一部分，达到最优时权重比无惩罚时更小。权重越大，附加梯度越大，收缩越强，这就是系数收缩的来源。<\/p>\n<h3>第三步：L1 的稀疏机制<\/h3>\n<p>L1 惩罚项为 <span class=\"katex-inline\">\\lambda\\sum_j|w_j|<\/span>，其在 <span class=\"katex-inline\">w_j\\neq0<\/span> 处的次梯度为 <span class=\"katex-inline\">\\lambda\\,\\operatorname{sign}(w_j)<\/span>，在 <span class=\"katex-inline\">w_j=0<\/span> 处是区间 <span class=\"katex-inline\">[-\\lambda,\\lambda]<\/span>。当普通梯度落在这个区间内，权重就被固定在零；小系数容易被推入零值，得到稀疏解。L2 在零附近梯度为零，不会主动把系数压成恰好为零。<\/p>\n<h3>第四步：偏差—方差解释<\/h3>\n<p>无惩罚估计在训练数据上拟合紧，系数随训练样本波动大（高方差）。正则化把系数拉向零，模型更简单：训练偏差上升一点，方差下降更多。泛化误差可分解为偏差平方、方差与不可约噪声；当方差下降幅度超过偏差上升幅度，整体泛化改善。原书正弦噪声对照实验正是这条机制的体现：无正则化的六次多项式训练误差 0.024，验证误差 3.472；加入惩罚后验证误差回落（PDF 第 59–60 页）。<\/p>\n<h3>第五步：λ 的选择位置<\/h3>\n<p><span class=\"katex-inline\">\\lambda<\/span> 不在拟合中更新，需在训练流程外部给定。做法是取一组候选 <span class=\"katex-inline\">\\lambda<\/span>，在验证集或交叉验证上比较验证误差，选泛化最好的一档；选定后再用全量训练数据拟合。<span class=\"katex-inline\">\\lambda<\/span> 太小不起约束，太大全部系数趋零、退化为常数预测。<\/p>\n<h2>数值算例一：Ridge 收缩的闭式对照<\/h2>\n<p>沿用 c02 三点数据：<span class=\"katex-inline\">S_{xx}=2<\/span>，<span class=\"katex-inline\">S_{xy}=1<\/span>。单特征 Ridge 解为<\/p>\n<div class=\"katex-block\">w=\\frac{S_{xy}}{S_{xx}+\\lambda}.<\/div>\n<ol><li>\n无惩罚 <span class=\"katex-inline\">\\lambda=0<\/span>：<span class=\"katex-inline\">w=1/2=0.5<\/span>，即普通最小二乘解。\n<\/li><li>\n取 <span class=\"katex-inline\">\\lambda=1<\/span>：<span class=\"katex-inline\">w=1/(2+1)=1/3\\approx0.333<\/span>，斜率从 0.5 收缩到 0.333。\n<\/li><li>\n截距仍过均值点：<span class=\"katex-inline\">w_0=\\bar y-w\\bar x=2-0.333\\cdot2\\approx1.333<\/span>。\n<\/li><li>\n取 <span class=\"katex-inline\">\\lambda=4<\/span>：<span class=\"katex-inline\">w=1/6\\approx0.167<\/span>，斜率进一步收缩；<span class=\"katex-inline\">\\lambda<\/span> 越大，直线越平缓。\n<\/li><li>\n回代看拟合：<span class=\"katex-inline\">\\lambda=1<\/span> 时预测依次约为 <span class=\"katex-inline\">1.667<\/span>、<span class=\"katex-inline\">2.0<\/span>、<span class=\"katex-inline\">2.333<\/span>，残差 <span class=\"katex-inline\">-0.667<\/span>、<span class=\"katex-inline\">1.0<\/span>、<span class=\"katex-inline\">-0.333<\/span>；平方和约 0.444+1.0+0.111=1.555，比无惩罚的 1.5 略高，训练拟合变差，但系数规模被压低。\n<\/ol>\n<h2>数值算例二：L1 与 L2 惩罚量对照<\/h2>\n<p>设三个权重 <span class=\"katex-inline\">(w_1,w_2,w_3)=(1,0.5,0.2)<\/span>。<\/p>\n<ol><li>\nL2 惩罚：<span class=\"katex-inline\">\\sum w_j^2=1^2+0.5^2+0.2^2=1+0.25+0.04=1.29<\/span>。\n<\/li><li>\nL1 惩罚：<span class=\"katex-inline\">\\sum|w_j|=1+0.5+0.2=1.7<\/span>。\n<\/li><li>\n若把 <span class=\"katex-inline\">w_3<\/span> 从 0.2 压到 0：L2 惩罚减少 <span class=\"katex-inline\">0.04<\/span>，L1 惩罚减少 <span class=\"katex-inline\">0.2<\/span>；L1 对消除小系数的激励更直接，这对应特征选择倾向。\n<\/li><li>\n权重翻倍到 <span class=\"katex-inline\">(2,1,0.4)<\/span>：L2 惩罚变为 <span class=\"katex-inline\">4+1+0.16=5.16<\/span>（按四倍增长），L1 变为 3.4（按两倍增长）；L2 对大系数的惩罚增长更快，抑制大系数的作用更强。\n<\/li><li>\n两种惩罚各有侧重：要保留全部特征、按比例收缩选 L2；要筛掉部分特征、得到稀疏模型选 L1；特征成组相关时可组合为 Elastic Net。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<ul><li>\n<strong>案例一：量纲不齐就加惩罚<\/strong>。一个特征 0–1000，另一个 0–1，同等 <span class=\"katex-inline\">\\lambda<\/span> 下小尺度特征系数更容易被压零，选出的「重要特征」其实是尺度较小的那个。修正：正则化前先标准化各特征到相近方差。\n<\/li><li>\n<strong>案例二：λ 过大造成欠拟合<\/strong>。惩罚把所有权重压向零，模型只剩截距，训练误差与验证误差同时偏高。修正：下调 <span class=\"katex-inline\">\\lambda<\/span>，用交叉验证找两误差都低的区间。\n<\/li><li>\n<strong>案例三：把 λ 交给训练自动优化<\/strong>。若让 <span class=\"katex-inline\">\\lambda<\/span> 随训练集误差更新，模型会在训练集上把惩罚也调到最小，泛化估计失真。修正：<span class=\"katex-inline\">\\lambda<\/span> 作为超参数在外部流程中按验证表现选择。\n<\/li><li>\n<strong>案例四：指望正则化补缺失信息<\/strong>。特征与目标无关时，再强的惩罚也只能让系数趋零，不能凭空学出规律。修正：先回到特征构造与数据采集，再谈约束模型幅度。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：正则化在损失里加了什么？答：对系数规模的惩罚项，L2 用平方和，L1 用绝对值和。\n<\/li><li>\n问：λ 的作用方向？答：λ 越大系数被压得越小，模型越平缓。\n<\/li><li>\n问：L1 为什么能做特征选择？答：次梯度区间把小系数固定在零，得到稀疏解。\n<\/li><li>\n问：正则化改变的是偏差还是方差？答：两者都动，偏差略升、方差大降，目标是泛化误差综合改善。\n<\/li><li>\n问：截距为什么通常不惩罚？答：截距是基准水平，不代表模型幅度复杂度。\n<\/ul>\n<h2>补充推导：惩罚项的几何直觉<\/h2>\n<p>L2 惩罚在参数空间对应圆形约束区域：<span class=\"katex-inline\">\\sum_j w_j^2\\le t<\/span> 是一个球；L1 惩罚对应菱形（高维下的多面体）约束。平方误差等值线与约束边界相切的位置就是正则化解。L1 的菱形在坐标轴上有尖角，等值线容易切到坐标轴，使对应权重为零；L2 的圆形边界光滑，权重按比例缩小但一般不为零。这一几何图像解释了两种惩罚在稀疏性上的差别，也说明惩罚不是「删减特征」，而是在拟合与幅度之间取折中。<\/p>\n<p>偏差—方差分解可写成<\/p>\n<div class=\"katex-block\">\\text{泛化误差}=\\text{偏差}^2+\\text{方差}+\\text{不可约噪声}.<\/div>\n<p>无惩罚模型在训练集上贴合紧，系数随样本扰动摆动大（高方差）；正则化把系数拉向零，模型更简单，偏差略升而方差大降。当方差下降幅度超过偏差上升幅度，泛化误差改善。判断正则化是否有效，要看验证误差是否随 <span class=\"katex-inline\">\\lambda<\/span> 增大先降后升：下降段是在压方差，上升段是引入欠拟合偏差。<\/p>\n<p>数值对照：设无惩罚解权重 <span class=\"katex-inline\">(0.8,0.4)<\/span>，加入 L2 后收缩为 <span class=\"katex-inline\">(0.6,0.3)<\/span>，加入 L1 后其中一个小权重被压成 0。L2 下两权重同比例缩小，相关特征分担系数；L1 下模型给出稀疏解释，只保留少数特征。若业务需要向非技术方说明「哪些特征起作用」，L1 的稀疏解更易解释；若追求预测精度且特征都应保留，L2 通常更稳。<\/p>\n<h2>正则化与其他防过拟合手段的分工<\/h2>\n<p>正则化约束的是系数规模，与减少特征数量、限制模型深度、增加训练数据属于不同环节。降维在建模前压缩相关变量，剪枝在训练后移除结构，交叉验证在评估环节识别过拟合；正则化贯穿训练过程，直接进入损失函数。几种手段可叠加使用：先标准化特征，再在损失上加惩罚，再用验证集选 <span class=\"katex-inline\">\\lambda<\/span>。若数据本身不足，任何正则化都只能缓解拟合波动，补不出缺失的目标规律；这也是数据采集环节优先于调参的原因。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出 L2 正则化的完整目标函数，并指出哪一项不参与惩罚。\n<\/li><li>\n对单特征数据 <span class=\"katex-inline\">S_{xx}=4<\/span>、<span class=\"katex-inline\">S_{xy}=2<\/span>，分别算 <span class=\"katex-inline\">\\lambda=0<\/span> 与 <span class=\"katex-inline\">\\lambda=2<\/span> 时的 Ridge 斜率。\n<\/li><li>\n为什么特征共线时 L2 比 L1 更稳妥？反过来，需要稀疏解释时为什么选 L1？\n<\/li><li>\n训练误差低、验证误差高，调高还是调低 λ？依据是什么？\n<\/li><li>\n说明「正则化不创造信息」这句话的含义，并给出一个它无法补救的数据缺陷例子。\n<\/ol><\/div><\/details>", "c04": "<div class=\"source-badge\">📖 出处：图解机器学习算法.pdf · p.65<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">线性回归：最小二乘目标函数、正规方程与梯度下降一步<\/a><\/span><\/div><h1>逻辑回归：Sigmoid 概率、交叉熵损失与权重更新规则<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch02（原书 §2.3 算法 3：逻辑回归，PDF 第 65–70 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>分类任务需要回答「属于某一类的把握有多大」，再按把握下判断。困难在于线性加权组合的取值覆盖整个实数轴，不能直接当成概率；而直接用平方误差拟合类别标签，在概率远离正确答案时梯度很小，学习缓慢。逻辑回归解决这两个问题：用 Sigmoid 把实数压到 <span class=\"katex-inline\">(0,1)<\/span> 表示概率，用交叉熵衡量概率与标签的差距，再沿梯度方向更新权重。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>线性组合<\/strong>：<span class=\"katex-inline\">z=\\mathbf{w}^T\\mathbf{x}+w_0<\/span>，<span class=\"katex-inline\">\\mathbf{x}<\/span> 是特征向量，<span class=\"katex-inline\">\\mathbf{w}<\/span> 是权重向量，<span class=\"katex-inline\">w_0<\/span> 是偏置。<\/p>\n<p><strong>Sigmoid 函数<\/strong>：<\/p>\n<div class=\"katex-block\">\\sigma(z)=\\frac{1}{1+e^{-z}}.<\/div>\n<p><span class=\"katex-inline\">z\\rightarrow+\\infty<\/span> 时 <span class=\"katex-inline\">\\sigma\\rightarrow1<\/span>，<span class=\"katex-inline\">z\\rightarrow-\\infty<\/span> 时 <span class=\"katex-inline\">\\sigma\\rightarrow0<\/span>，<span class=\"katex-inline\">\\sigma(0)=0.5<\/span>，曲线单调上升且关于 <span class=\"katex-inline\">(0,0.5)<\/span> 对称。<\/p>\n<p><strong>类别概率<\/strong>：<span class=\"katex-inline\">p=\\sigma(\\mathbf{w}^T\\mathbf{x}+w_0)<\/span>，即模型预测样本属于类别 1 的概率。二元分类通常以 0.5 为阈值：<span class=\"katex-inline\">p&lt;0.5<\/span> 判为 0，<span class=\"katex-inline\">p&gt;0.5<\/span> 判为 1；阈值可按业务代价调整（原书 §2.3，PDF 第 66 页）。<\/p>\n<p><strong>交叉熵（逻辑损失）<\/strong>：单样本<\/p>\n<div class=\"katex-block\">L=-[y\\log p+(1-y)\\log(1-p)].<\/div>\n<p>标签 <span class=\"katex-inline\">y=1<\/span> 时只保留 <span class=\"katex-inline\">-\\log p<\/span> 项，<span class=\"katex-inline\">y=0<\/span> 时只保留 <span class=\"katex-inline\">-\\log(1-p)<\/span>；预测概率离标签越远，损失越大。<\/p>\n<p><strong>更新规则<\/strong>：交叉熵对权重的梯度为 <span class=\"katex-inline\">\\partial L/\\partial w_j=(p-y)x_j<\/span>，偏置梯度为 <span class=\"katex-inline\">p-y<\/span>；迭代更新 <span class=\"katex-inline\">w_j\\leftarrow w_j-\\eta(p-y)x_j<\/span>。<\/p>\n<p>正例：气温预测是否积雪，0 ℃、1 ℃、2 ℃ 概率约 0.12、0.50、0.88（PDF 第 65、67 页）。反例：目标是连续房价时不应使用本模型，分类概率口径与回归数值预测不匹配。<\/p>\n<h2>原理推导<\/h2>\n<p>Sigmoid 的导数有简洁形式：<span class=\"katex-inline\">\\sigma&#x27;(z)=\\sigma(z)(1-\\sigma(z))<\/span>。交叉熵对 <span class=\"katex-inline\">z<\/span> 求导：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial z}=p-y.<\/div>\n<p>推导链条：<span class=\"katex-inline\">L=-y\\log p-(1-y)\\log(1-p)<\/span>，对 <span class=\"katex-inline\">p<\/span> 求导得 <span class=\"katex-inline\">-y/p+(1-y)/(1-p)<\/span>，代入 <span class=\"katex-inline\">p=\\sigma(z)<\/span> 并用 <span class=\"katex-inline\">\\sigma&#x27;(z)=p(1-p)<\/span> 化简，结果为 <span class=\"katex-inline\">p-y<\/span>。再由链式法则，<span class=\"katex-inline\">\\partial L/\\partial w_j=(p-y)x_j<\/span>，<span class=\"katex-inline\">\\partial L/\\partial w_0=p-y<\/span>。<\/p>\n<p>梯度只含预测误差乘特征分量，形式与线性回归更新相似，但误差 <span class=\"katex-inline\">p-y<\/span> 来自概率口径。决策边界是 <span class=\"katex-inline\">p=0.5<\/span> 对应的位置，即 <span class=\"katex-inline\">z=0<\/span> 的直线；平面上逻辑回归边界为直线。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：类别在特征空间中近似线性可分；需要输出可解释的类别概率；样本量足以稳定估计权重。\n<\/li><li>\n边界一：逻辑回归表达不了弯曲边界，复杂结构需增加多项式特征、核方法或换树/近邻模型。\n<\/li><li>\n边界二：概率输出是相对训练分布的估计，训练集类别不均衡时概率会偏向多数类，评估要结合精确率、召回率。\n<\/li><li>\n失败案例：特征高度相关或数量远大于样本量时，权重估计不稳，需正则化约束（c03）。\n<\/li><li>\n失败案例：把 0.5 阈值当成固定最优；漏诊代价高的场景应下调阳性阈值以提高召回，阈值选择属于决策环节而非模型学习。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>逻辑回归 vs 线性回归<\/strong>：前者 Sigmoid 输出概率、交叉熵损失；后者线性输出数值、平方误差损失。名称中的「回归」指内部先做线性加权，不代表任务是回归。\n<\/li><li>\n<strong>概率 vs 类别<\/strong>：<span class=\"katex-inline\">p<\/span> 是连续把握程度，类别是阈值离散化结果；同一概率可按不同阈值落成不同类别。\n<\/li><li>\n<strong>交叉熵 vs 平方误差（分类）<\/strong>：交叉熵在错误严重时梯度大，学习快；平方误差在 Sigmoid 饱和区梯度被压小，容易停滞。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 分类任务判定，c02 加权组合与损失最小化骨架。后继：c05 SVM 同样处理线性分类但换间隔目标；c06 随机森林、c07 kNN 的分类结果都要回到 c10 的混淆矩阵指标评估；逻辑回归的概率输出是阈值调整与召回/精确率权衡的基础。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（逻辑回归：Sigmoid 概率、交叉熵损失与权重更新规则）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：Sigmoid 概率、交叉熵梯度与单步权重更新<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把逻辑回归推到底，往回追六层前提：<\/p>\n<ol><li>\n<strong>任务是二元分类<\/strong>：标签取 0/1，需要先输出类别概率再离散表决；连续回归任务不适用这套口径。\n<\/li><li>\n<strong>先做线性加权<\/strong>：<span class=\"katex-inline\">z=\\mathbf{w}^T\\mathbf{x}+w_0<\/span>，权重与偏置是待学参数，这一骨架与线性回归相同。\n<\/li><li>\n<strong>输出必须落在 (0,1)<\/strong>：概率不能取负或超过 1，需要一个把实数轴压到开区间的函数，即 Sigmoid。\n<\/li><li>\n<strong>损失衡量概率与标签差距<\/strong>：交叉熵在预测偏离标签时给大损失，在接近时给小损失；平方误差在饱和区梯度过小。\n<\/li><li>\n<strong>梯度经链式法则传到权重<\/strong>：先对 <span class=\"katex-inline\">z<\/span> 求导得 <span class=\"katex-inline\">p-y<\/span>，再乘特征分量得到权重梯度。\n<\/li><li>\n<strong>阈值是决策环节<\/strong>：0.5 是常用默认，阈值按漏报/误报代价调整，不在模型拟合中确定。\n<\/ol>\n<p>依赖链方向：分类任务 → 线性组合 → Sigmoid 压缩 → 交叉熵损失 → 链式梯度 → 阈值表决。任何一层错位，比如用平方误差配 Sigmoid，学习速度与收敛性都会出问题。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：Sigmoid 把实数映射为概率<\/h3>\n<div class=\"katex-block\">\\sigma(z)=\\frac{1}{1+e^{-z}}.<\/div>\n<p>两端极限：<span class=\"katex-inline\">z\\rightarrow+\\infty<\/span> 时 <span class=\"katex-inline\">e^{-z}\\rightarrow0<\/span>，<span class=\"katex-inline\">\\sigma\\rightarrow1<\/span>；<span class=\"katex-inline\">z\\rightarrow-\\infty<\/span> 时 <span class=\"katex-inline\">e^{-z}\\rightarrow+\\infty<\/span>，<span class=\"katex-inline\">\\sigma\\rightarrow0<\/span>；<span class=\"katex-inline\">z=0<\/span> 时 <span class=\"katex-inline\">\\sigma=1/2<\/span>。对称性：<span class=\"katex-inline\">\\sigma(-z)=1-\\sigma(z)<\/span>，因为<\/p>\n<div class=\"katex-block\">1-\\sigma(z)=\\frac{e^{-z}}{1+e^{-z}}=\\frac{1}{1+e^{z}}=\\sigma(-z).<\/div>\n<h3>第二步：写出交叉熵损失<\/h3>\n<p>单样本标签 <span class=\"katex-inline\">y\\in\\{0,1\\}<\/span>，模型概率 <span class=\"katex-inline\">p=\\sigma(z)<\/span>：<\/p>\n<div class=\"katex-block\">L=-[y\\log p+(1-y)\\log(1-p)].<\/div>\n<p><span class=\"katex-inline\">y=1<\/span> 时损失为 <span class=\"katex-inline\">-\\log p<\/span>，<span class=\"katex-inline\">p<\/span> 越小损失越大；<span class=\"katex-inline\">y=0<\/span> 时损失为 <span class=\"katex-inline\">-\\log(1-p)<\/span>，<span class=\"katex-inline\">p<\/span> 越大损失越大。对数把概率乘积转成求和，避免连乘下溢。<\/p>\n<h3>第三步：对 z 求导<\/h3>\n<p>先对 <span class=\"katex-inline\">p<\/span> 求导：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial p}=-\\frac{y}{p}+\\frac{1-y}{1-p}.<\/div>\n<p>代入 <span class=\"katex-inline\">p=\\sigma(z)<\/span>，利用 Sigmoid 导数 <span class=\"katex-inline\">\\sigma&#x27;(z)=p(1-p)<\/span>：<\/p>\n<div class=\"katex-block\">=\\left(-\\frac{y}{p}+\\frac{1-y}{1-p}\\right)p(1-p)\\\\=p-y.<\/div>\n<p>中间化简：第一项 <span class=\"katex-inline\">-y(1-p)<\/span>，第二项 <span class=\"katex-inline\">(1-y)p<\/span>，合并得 <span class=\"katex-inline\">p-y<\/span>。这个结果简洁：梯度只由预测误差 <span class=\"katex-inline\">p-y<\/span> 决定。<\/p>\n<h3>第四步：传到权重与偏置<\/h3>\n<p>由链式法则：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_j}=(p-y)x_j,\\qquad \\frac{\\partial L}{\\partial w_0}=p-y.<\/div>\n<p>更新规则：<\/p>\n<div class=\"katex-block\">w_j\\leftarrow w_j-\\eta(p-y)x_j,\\qquad w_0\\leftarrow w_0-\\eta(p-y).<\/div>\n<p>误差为正（预测偏高）时权重沿特征方向下调；误差为负时上调。<span class=\"katex-inline\">\\eta<\/span> 是学习率，控制单步幅度。<\/p>\n<h3>第五步：决策边界<\/h3>\n<p>边界满足 <span class=\"katex-inline\">p=0.5<\/span>，即 <span class=\"katex-inline\">z=0<\/span>：<span class=\"katex-inline\">\\mathbf{w}^T\\mathbf{x}+w_0=0<\/span>。二维平面上这是一条直线；边界一侧 <span class=\"katex-inline\">z&gt;0<\/span> 判类别 1，另一侧判类别 0。特征系数的符号表示该特征对概率的正向或负向影响（原书 §2.3 对鸢尾花特征权重的解释，PDF 第 56 页）。<\/p>\n<h2>数值算例一：Sigmoid 在三个 z 值上的取值<\/h2>\n<p>取 <span class=\"katex-inline\">z=0<\/span
