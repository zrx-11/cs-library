nline\">a_j&lt;a_{j+1}<\/span> 会改动过左的位置，得到的后继跳过大段排列，中间样本被漏掉。\n<\/li><li>\n失败案例 2：交换后保留原后缀顺序。后缀交换后仍偏大，下一个排列不是最小的更大排列，顺序被打乱。\n<\/li><li>\n失败案例 3：多重集元素重复。书里提示，当某些值出现次数比其他值多得多时，算法 L 效率下降；重复元素下相等判断要按非严格次序处理。\n<\/li><li>\n边界：算法给出字典序，相邻两次产出常需搬动多项；低改动需求走 c09 的邻接交换路线。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>字典序 vs 邻接交换序<\/strong>：字典序按大小全序推进，相邻排列可能差多个位置；邻接交换每次只换相邻两项，次序不是词典大小序。\n<\/li><li>\n<strong>下一个排列 vs 随机排列<\/strong>：算法 L 沿全序确定推进，覆盖有保证；随机打乱可能重复、遗漏，不适合穷举。\n<\/li><li>\n<strong>支点 <span class=\"katex-inline\">j<\/span> vs 交换对象 <span class=\"katex-inline\">l<\/span><\/strong>：<span class=\"katex-inline\">j<\/span> 定位最右可增位，<span class=\"katex-inline\">l<\/span> 在后缀中找最小可换元素；两个下标职责不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c07 n 元组枚举提供&quot;逐个全覆盖&quot;的枚举范式；字典序思路在 c10 组合生成中沿用。后继：c09 邻接交换算法 P 从另一条路线生成全部排列；c10 组合字典序算法 L、T 是排列 L 在子集上的推广。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（字典序排列生成（Algorithm L）：下一个排列为何不漏不重）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：Algorithm L 四步不变量、全排列手算与复杂度方向<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>证明字典序生成不漏不重，往回追四层：<\/p>\n<ol><li>\n全序定义：排列按字典序排成一线，任意两个排列有大小关系。\n<\/li><li>\n后缀结构：从右往左扫描，非递增后缀是已无可增空间的部分。\n<\/li><li>\n后继构造：支点增大一位、换入最小可换元素、后缀重排到最小，三步得到&quot;最小的更大排列&quot;。\n<\/li><li>\n链路性质：每个排列有唯一后继，从最小排列走到最大排列，覆盖全部 <span class=\"katex-inline\">n!<\/span> 个。\n<\/ol>\n<p>依赖链方向：字典全序 → 非递增后缀识别 → 后继三步构造 → 唯一后继链路 → 全覆盖计数。<\/p>\n<h2>正向推导：四步各自的不变量<\/h2>\n<p><strong>L2 找支点<\/strong>。从 <span class=\"katex-inline\">j=n-1<\/span> 往左扫，维持 <span class=\"katex-inline\">a_{j+1}\\ge a_{j+2}\\ge\\cdots\\ge a_n<\/span> 成立；遇到 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span> 停下。此时后缀 <span class=\"katex-inline\">a_{j+1}\\dots a_n<\/span> 非递增，<span class=\"katex-inline\">j<\/span> 是最右可增大的位置。若扫到 <span class=\"katex-inline\">j=0<\/span> 仍满足 <span class=\"katex-inline\">a_1\\ge a_2<\/span>，整个排列非递增，即最大排列，终止。<\/p>\n<p><strong>L3 找交换对象<\/strong>。后缀非递增，从右往左找第一个 <span class=\"katex-inline\">a_l&gt;a_j<\/span>。后缀右侧元素偏小，左侧偏大；最右的大于 <span class=\"katex-inline\">a_j<\/span> 者，正是后缀中大于 <span class=\"katex-inline\">a_j<\/span> 的最小元素。交换 <span class=\"katex-inline\">a_j<\/span> 与 <span class=\"katex-inline\">a_l<\/span> 后，前缀到 <span class=\"katex-inline\">j<\/span> 位恰好增大到最小值。<\/p>\n<p><strong>L4 反序后缀<\/strong>。交换不改变后缀内部的非递增方向（<span class=\"katex-inline\">a_l<\/span> 换入 <span class=\"katex-inline\">j<\/span> 位，原 <span class=\"katex-inline\">a_j<\/span> 落到 <span class=\"katex-inline\">l<\/span> 位，后缀仍非递增）。反序把非递增变成非递减，后缀取到它能组成的最小排列。合起来，新排列是大于原排列的全体排列中最小的一个——即字典序直接后继。<\/p>\n<p><strong>唯一性<\/strong>：字典序是全序，&quot;最小的更大排列&quot;唯一存在；算法 L 构造出的正是它。每个排列后继唯一，链路无分叉；从最小排列出发不会回到已访问排列（后继严格更大），无回路。<\/p>\n<h2>数值算例：<span class=\"katex-inline\">n=3<\/span> 全排列逐步还原<\/h2>\n<p>初始 <span class=\"katex-inline\">123<\/span>。<\/p>\n<ol><li>\n访问 <span class=\"katex-inline\">123<\/span>。L2：<span class=\"katex-inline\">j=2<\/span>，<span class=\"katex-inline\">a_2=2&lt;a_3=3<\/span>，支点 <span class=\"katex-inline\">j=2<\/span>。L3：后缀 <span class=\"katex-inline\">\\{3\\}<\/span>，<span class=\"katex-inline\">l=3<\/span>，交换得 <span class=\"katex-inline\">132<\/span>。L4：后缀长度 1，反序不变。\n<\/li><li>\n访问 <span class=\"katex-inline\">132<\/span>。L2：<span class=\"katex-inline\">a_2=3\\ge a_3=2<\/span>，<span class=\"katex-inline\">j<\/span> 退到 <span class=\"katex-inline\">1<\/span>，<span class=\"katex-inline\">a_1=1&lt;a_2=3<\/span>，支点 <span class=\"katex-inline\">j=1<\/span>。L3：从右找大于 1 的最右元素，<span class=\"katex-inline\">a_3=2&gt;1<\/span>，<span class=\"katex-inline\">l=3<\/span>；交换 <span class=\"katex-inline\">a_1,a_3<\/span> 得 <span class=\"katex-inline\">231<\/span>。L4：后缀位置 2–3 反序，<span class=\"katex-inline\">31<\/span> 反成 <span class=\"katex-inline\">13<\/span>，得 <span class=\"katex-inline\">213<\/span>。\n<\/li><li>\n访问 <span class=\"katex-inline\">213<\/span>。L2：<span class=\"katex-inline\">j=2<\/span>，<span class=\"katex-inline\">1&lt;3<\/span>；交换位置 2、3 得 <span class=\"katex-inline\">231<\/span>；后缀长度 1。\n<\/li><li>\n访问 <span class=\"katex-inline\">231<\/span>。L2：<span class=\"katex-inline\">3\\ge1<\/span>，退到 <span class=\"katex-inline\">j=1<\/span>，<span class=\"katex-inline\">2&lt;3<\/span>；L3 后缀 <span class=\"katex-inline\">\\{3,1\\}<\/span> 中大于 2 的最右元素是 <span class=\"katex-inline\">a_2=3<\/span>，<span class=\"katex-inline\">l=2<\/span>；交换得 <span class=\"katex-inline\">321<\/span>；后缀位置 2–3 反序，<span class=\"katex-inline\">21<\/span> 反成 <span class=\"katex-inline\">12<\/span>，得 <span class=\"katex-inline\">312<\/span>。\n<\/li><li>\n访问 <span class=\"katex-inline\">312<\/span>。L2：<span class=\"katex-inline\">1&lt;2<\/span>，<span class=\"katex-inline\">j=2<\/span>；交换得 <span class=\"katex-inline\">321<\/span>。\n<\/li><li>\n访问 <span class=\"katex-inline\">321<\/span>。L2：<span class=\"katex-inline\">3\\ge2<\/span>、<span class=\"katex-inline\">2\\ge1<\/span>，<span class=\"katex-inline\">j=0<\/span>，终止。\n<\/ol>\n<p>产出 <span class=\"katex-inline\">123,132,213,231,312,321<\/span>，共 <span class=\"katex-inline\">3!=6<\/span> 个，与计数一致，无重复。<\/p>\n<p><strong>第二算例：<span class=\"katex-inline\">n=4<\/span> 的前缀片段<\/strong>。初始 <span class=\"katex-inline\">1234<\/span>。第一个后继：支点 <span class=\"katex-inline\">j=3<\/span>，交换 <span class=\"katex-inline\">3,4<\/span> 得 <span class=\"katex-inline\">1243<\/span>。再走：<span class=\"katex-inline\">1243<\/span> 支点 <span class=\"katex-inline\">j=2<\/span>（<span class=\"katex-inline\">2&lt;4<\/span>），后缀 <span class=\"katex-inline\">\\{4,3\\}<\/span> 中大于 2 的最右元素是 3，交换得 <span class=\"katex-inline\">1342<\/span>，后缀 <span class=\"katex-inline\">42<\/span> 反序成 <span class=\"katex-inline\">24<\/span>，得 <span class=\"katex-inline\">1324<\/span>。链路继续到 <span class=\"katex-inline\">4321<\/span> 终止，全 <span class=\"katex-inline\">24<\/span> 个排列由算法逐个产出。<\/p>\n<h2>延伸推演：平均改动步数方向<\/h2>\n<p>书里分析：<span class=\"katex-inline\">n!<\/span> 个排列中，恰好有 <span class=\"katex-inline\">n!/2<\/span> 个满足 <span class=\"katex-inline\">a_{n-1}&lt;a_n<\/span>，L2 在这类情形直接找到 <span class=\"katex-inline\">j=n-1<\/span>，不必回退；当元素互不相同时，<span class=\"katex-inline\">j&lt;n-1<\/span> 的概率为 <span class=\"katex-inline\">1/2<\/span>，因此多数情况下 L2、L4 的循环量很小。L3 的回退按相同方式受后缀非递增结构约束。这一方向说明字典序生成在平均意义上接近每个排列常数次改动；最坏情形单个排列可能需要回退到靠前的支点，但均摊代价仍可控。<\/p>\n<p>对照 c07：二进制 n 元组的格雷码相邻差一位；排列字典序相邻之间改动量不定，这是对象结构差异决定的——排列是全排对象，后缀反序常涉及多项。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>支点取最左<\/strong>。若 L2 从左往右找第一个 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span>，对 <span class=\"katex-inline\">132<\/span> 会定 <span class=\"katex-inline\">j=1<\/span> 但跳过了后缀内本可调整的位置；后继构造越过中间排列，链路上出现漏排。正确方向是从右往左，取最右可增位。<\/p>\n<p><strong>交换后不反序<\/strong>。<span class=\"katex-inline\">132<\/span> 交换得 <span class=\"katex-inline\">231<\/span> 后，若保留后缀 <span class=\"katex-inline\">31<\/span>，下一个从 <span class=\"katex-inline\">231<\/span> 继续构造；但 <span class=\"katex-inline\">213<\/span> 本应排在 <span class=\"katex-inline\">231<\/span> 之前，顺序颠倒。反序把后缀压到最小，后继才落在正确位置。<\/p>\n<p><strong>重复元素按严格不等处理<\/strong>。多重集排列中相等元素不应产生新排列；L2、L3 的比较要按非严格方向跳过等值，否则同一多重排列会被重复产出。书里提示重复度高时算法 L 效率下降，需另选生成方法。<\/p>\n<h2>对抗性追问：字典序链路为什么不会成环<\/h2>\n<p>后继构造出的排列严格大于当前排列（支点位置元素增大，后缀再小也不能拉回原值）。排列集合有限，严格递增链不可能回到已访问结点；终止于非递增的最大排列。有限集上的严格递增链必然终止，终止点即字典序末端。<\/p>\n<h2><span class=\"katex-inline\">n=4<\/span> 轨迹续推<\/h2>\n<p>从 <span class=\"katex-inline\">1234<\/span> 出发：<span class=\"katex-inline\">1234 o1243<\/span>（支点 3，交换 3、4）。<span class=\"katex-inline\">1243<\/span>：支点 <span class=\"katex-inline\">j=2<\/span>（<span class=\"katex-inline\">2&lt;4<\/span>），后缀 <span class=\"katex-inline\">\\{4,3\\}<\/span> 中大于 2 的最右元素是 3，交换得 <span class=\"katex-inline\">1342<\/span>，后缀 <span class=\"katex-inline\">42<\/span> 反序成 <span class=\"katex-inline\">24<\/span>，得 <span class=\"katex-inline\">1324<\/span>。<span class=\"katex-inline\">1324<\/span>：支点 <span class=\"katex-inline\">j=3<\/span>（<span class=\"katex-inline\">2&lt;4<\/span>），交换得 <span class=\"katex-inline\">1342<\/span>。继续沿字典序推进，直到最大排列 <span class=\"katex-inline\">4321<\/span> 时 L2 找不到 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span>，<span class=\"katex-inline\">j=0<\/span> 终止。全链路 <span class=\"katex-inline\">4!=24<\/span> 个排列。<\/p>\n<h2>不变量再证：后继确实是最小的更大排列<\/h2>\n<p>设当前排列后缀 <span class=\"katex-inline\">a_{j+1}\\dots a_n<\/span> 非递增。大于当前排列的排列，必须在某个位置 <span class=\"katex-inline\">i\\le j<\/span> 增大；<span class=\"katex-inline\">j<\/span> 以右的后缀已无增大空间，第一个能增大的位置就是 <span class=\"katex-inline\">j<\/span>。<span class=\"katex-inline\">j<\/span> 位换入后缀中大于 <span class=\"katex-inline\">a_j<\/span> 的最小元素，前缀到 <span class=\"katex-inline\">j<\/span> 位只增大最少；后缀反序成非递减，取到该后缀能组成的最小排列。两步合起来，新排列是所有更大排列中最小的一个，字典序直接后继成立。<\/p>\n<h2>平均步数方向<\/h2>\n<p><span class=\"katex-inline\">n!<\/span> 个排列里一半满足 <span class=\"katex-inline\">a_{n-1}&lt;a_n<\/span>，L2 直接定 <span class=\"katex-inline\">j=n-1<\/span>；元素互异时 <span class=\"katex-inline\">j&lt;n-1<\/span> 的概率为 <span class=\"katex-inline\">1/2<\/span>，多数排列只动后缀附近。L3 在非递增后缀里找最小可换元素，回退长度受后缀结构约束。最坏情形回退到靠前支点，但均摊到每个排列的步数保持常数方向。<\/p>\n<h2>终止性链路<\/h2>\n<p>后继构造使排列严格增大（支点位元素换大，后缀再小也拉不回原值）。排列集合有限，严格递增链不能成环；走到非递增的最大排列时 L2 找不到支点，算法终止。有限集 + 严格增大 + 终态可识别，三个条件保证链路走完即停。<\/p>\n<h2>反序后缀的方向核验<\/h2>\n<p>L2 之后后缀 <span class=\"katex-inline\">a_{j+1}\\dots a_n<\/span> 非递增。L3 交换把原 <span class=\"katex-inline\">a_j<\/span> 换入后缀，后缀仍非递增；L4 反序把它翻成非递减。非递减是该后缀能摆出的最小排列次序。若不反序，后缀保持偏大顺序，下一个排列不是最小的更大排列，字典序链条错位。<\/p>\n<h2>唯一后继与全排列覆盖<\/h2>\n<p>字典序是全序，&quot;最小的更大排列&quot;唯一。链路从最小排列出发，每步后继严格更大，不回跳到已访问结点；走到最大排列终止。有限集合上的严格递增链长度有限，终止点覆盖全部排列，个数与 <span class=\"katex-inline\">n!<\/span> 核对。<\/p>\n<h2>多重集注意事项<\/h2>\n<p>元素有重复时，相等元素交换不产生新排列；L2、L3 的比较按非严格方向跳过等值。书里提示某些值出现次数远多于其他值时算法 L 效率下降，多重排列可另选专用生成方法。互不相同是算法 L 最直接的适用情形。<\/p>\n<h2>步下标细节回顾<\/h2>\n<p>L2 从 <span class=\"katex-inline\">j=n-1<\/span> 起向左扫；L3 从 <span class=\"katex-inline\">l=n<\/span> 起向左找大于 <span class=\"katex-inline\">a_j<\/span> 的元素；L4 反序区间 <span class=\"katex-inline\">[j+1,n]<\/span>。三个下标职责不重叠：<span class=\"katex-inline\">j<\/span> 定支点，<span class=\"katex-inline\">l<\/span> 定交换对象，反序区间紧跟支点右侧。写错任一下标，要么找错交换对象，要么反序段越界。<\/p>\n<h2>与组合字典序的同构方向<\/h2>\n<p>排列 L 在全排对象上找下一个字典序；组合 L、T 在子集对象上找下一个字典序。支点定位、增大当前位、后缀重设最小的思路一致，区别是组合只固定选 <span class=\"katex-inline\">t<\/span> 个元素，后缀调整范围受表长限制。两条生成路线可对照阅读。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 L2–L4 各步的下标职责：<span class=\"katex-inline\">j<\/span> 定位什么，<span class=\"katex-inline\">l<\/span> 定位什么，反序哪一段。\n<\/li><li>\n对 <span class=\"katex-inline\">2413<\/span> 求下一个字典序排列，逐步写出支点、交换对象与反序结果。\n<\/li><li>\n为什么交换后后缀仍是非递增？反序起什么作用？\n<\/li><li>\n链路无环的依据是&quot;后继严格更大&quot;，这一点由哪一步构造保证？\n<\/li><li>\n多重集重复元素下，比较式应取严格还是非严格？处理不当会产生什么后果？\n<\/ol><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.282<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">字典序排列生成（Algorithm L）：下一个排列为何不漏不重<\/a><\/span><\/div><h1>邻接交换排列（Algorithm P）：逆序序列与平滑改变<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch03（原书 §7.2.1.2，PDF 第 282–283 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p>字典序生成相邻两个排列之间常要搬动多项；如果应用场景里每换一次排列都有代价（机械转位、盘面切换、状态回退），只换相邻两项的序列更省。困难是：能否仅通过每次交换相邻元素就遍历全部 <span class=\"katex-inline\">n!<\/span> 个排列？怎样用一套辅助计数控制每次交换哪一对？算法 P（平滑改变，plain changes）回答这两点，它借助逆序序列与方向位驱动相邻交换，一次只动一对邻位。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>逆序序列（inversion sequence）<\/strong>：对排列 <span class=\"katex-inline\">a_1\\dots a_n<\/span>，<span class=\"katex-inline\">c_j<\/span> 是比 <span class=\"katex-inline\">j<\/span> 小且处在 <span class=\"katex-inline\">j<\/span> 右边的元素数目；约定<\/p>\n<div class=\"katex-block\">0\\le c_j&lt;j,\\qquad 1\\le j\\le n.<\/div>\n<p>每个合法逆序序列对应唯一排列，遍历所有合法 <span class=\"katex-inline\">c_j<\/span> 即遍历全部排列。<\/p>\n<p><strong>方向位 <span class=\"katex-inline\">o_j<\/span><\/strong>：控制条目 <span class=\"katex-inline\">c_j<\/span> 的改变方向，取 <span class=\"katex-inline\">+1<\/span> 或 <span class=\"katex-inline\">-1<\/span>。<\/p>\n<p><strong>算法 P（平滑改变）<\/strong>，给定不同元素 <span class=\"katex-inline\">a_1\\dots a_n<\/span>，重复交换邻接元素生成全部排列：<\/p>\n<ul><li>\n<strong>P1. 初始化<\/strong>：对 <span class=\"katex-inline\">1\\le j\\le n<\/span> 置 <span class=\"katex-inline\">c_j\\leftarrow0<\/span>，<span class=\"katex-inline\">o_j\\leftarrow1<\/span>。\n<\/li><li>\n<strong>P2. 访问<\/strong>：访问当前排列 <span class=\"katex-inline\">a_1\\dots a_n<\/span>。\n<\/li><li>\n<strong>P3. 准备<\/strong>：置 <span class=\"katex-inline\">j\\leftarrow n,\\ s\\leftarrow0<\/span>；<span class=\"katex-inline\">s<\/span> 是满足 <span class=\"katex-inline\">c_k=0<\/span> 的下标 <span class=\"katex-inline\">k&gt;j<\/span> 的数目。\n<\/li><li>\n<strong>P4. 准备改变了吗<\/strong>：置 <span class=\"katex-inline\">q\\leftarrow c_j+o_j<\/span>；若 <span class=\"katex-inline\">q&lt;0<\/span> 转 P7，若 <span class=\"katex-inline\">q=0<\/span> 转 P6。\n<\/li><li>\n<strong>P5. 改变<\/strong>：交换邻接元素；置 <span class=\"katex-inline\">o_j\\leftarrow-o_j<\/span>，<span class=\"katex-inline\">c_j\\leftarrow q+o_j+s<\/span>，返回 P2。\n<\/li><li>\n<strong>P6. 推进<\/strong>：若 <span class=\"katex-inline\">j=1<\/span> 终止；否则置 <span class=\"katex-inline\">s\\leftarrow s+1<\/span>，<span class=\"katex-inline\">j\\leftarrow j-1<\/span>，返回 P4。\n<\/li><li>\n<strong>P7. 切换方向<\/strong>：若 <span class=\"katex-inline\">j=1<\/span> 终止；否则置 <span class=\"katex-inline\">o_j\\leftarrow-o_j<\/span>，<span class=\"katex-inline\">j\\leftarrow j-1<\/span>，返回 P4。\n<\/ul>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">n=3<\/span> 时相邻交换路线给出 <span class=\"katex-inline\">123\\to132\\to312\\to321\\to231\\to213<\/span> 一类序列，每步只换相邻两项。<\/p>\n<p><strong>反例<\/strong>：放宽成任意位置交换，每次改动位数不固定，丢失平滑改变的价值；逆序序列超出 <span class=\"katex-inline\">0\\le c_j&lt;j<\/span> 不再对应合法排列。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>逆序序列与排列一一对应<\/strong>：<span class=\"katex-inline\">c_j<\/span> 的取值范围 <span class=\"katex-inline\">0,\\dots,j-1<\/span> 共 <span class=\"katex-inline\">j<\/span> 个选择；各 <span class=\"katex-inline\">c_j<\/span> 独立取遍范围，序列总数 <span class=\"katex-inline\">\\prod_{j=1}^n j=n!<\/span>，与排列数相等。由逆序序列可唯一重建排列：从左到右按 <span class=\"katex-inline\">c_j<\/span> 指示的相对位置插入元素，因此遍历合法序列即遍历全部排列。<\/p>\n<p><strong>相邻交换机制<\/strong>：<span class=\"katex-inline\">c_j<\/span> 按方向位 <span class=\"katex-inline\">o_j<\/span> 增减；到达边界（<span class=\"katex-inline\">q&lt;0<\/span> 或 <span class=\"katex-inline\">q=0<\/span>）时切换方向或推进到下一条目。一次 <span class=\"katex-inline\">c_j<\/span> 的有效改变对应排列中一对相邻元素交换，其余元素相对位置不变。<\/p>\n<p><strong>全覆盖<\/strong>：辅助序列从全 0 初值出发，按 P3–P7 遍历所有合法组合；每个辅助状态对应一个排列，访问计数到 <span class=\"katex-inline\">n!<\/span> 时走完。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：元素互不相同；需要相邻改动最小的排列次序。\n<\/li><li>\n失败案例 1：多重集排列。书里指出对 <span class=\"katex-inline\">\\{1,1,2,2\\}<\/span> 这类重复元素，邻接交换路线不总能找到类似格雷码的闭合环，部分重复情形不存在哈密顿路径。\n<\/li><li>\n失败案例 2：把 <span class=\"katex-inline\">c_j<\/span> 范围写成 <span class=\"katex-inline\">0\\le c_j\\le j<\/span>。上界多一个取值，序列总数超过 <span class=\"katex-inline\">n!<\/span>，部分状态无对应排列。\n<\/li><li>\n边界：算法 P 的实现细节比字典序 L 复杂；若不要求低改动，字典序更直观。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>算法 P vs 算法 L<\/strong>：L 按字典全序推进，改动多项；P 沿逆序序列驱动邻接交换，每次一对。两者都覆盖 <span class=\"katex-inline\">n!<\/span> 个排列，次序不同。\n<\/li><li>\n<strong>逆序序列 vs 轮换分解<\/strong>：逆序序列记录右侧更小元素个数，用于生成控制；轮换分解（卷 1 概念）描述置换的循环结构，用途不同。\n<\/li><li>\n<strong>方向位 vs 支点下标<\/strong>：<span class=\"katex-inline\">o_j<\/span> 控制计数增减方向；L 的 <span class=\"katex-inline\">j<\/span> 定位可增位置，两个机制分属两套算法。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c08 字典序排列给出全排枚举的基线；c07 格雷码&quot;相邻差一位&quot;是低改动枚举的元组版本。后继：c10 组合生成可借鉴低改动次序（旋转门）；逆序序列的计数思路与 c11 划分的辅助编码相通。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（邻接交换排列（Algorithm P）：逆序序列与平滑改变）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：逆序序列计数、排列重建与算法 P 状态机推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>理解邻接交换生成，往回追四层：<\/p>\n<ol><li>\n排列计数：<span class=\"katex-inline\">n<\/span> 个不同元素全排共 <span class=\"katex-inline\">n!<\/span> 个，需要一套能枚举全部状态的辅助表示。\n<\/li><li>\n逆序序列：<span class=\"katex-inline\">c_j<\/span> 记录元素 <span class=\"katex-inline\">j<\/span> 右侧比它小的元素个数，范围 <span class=\"katex-inline\">0\\le c_j&lt;j<\/span>。\n<\/li><li>\n一一对应：合法序列总数 <span class=\"katex-inline\">\\prod j=n!<\/span>，与排列数相等；序列可重建排列。\n<\/li><li>\n状态机：方向位 <span class=\"katex-inline\">o_j<\/span> 控制 <span class=\"katex-inline\">c_j<\/span> 增减，边界处换向或推进，每次有效改变对应一次相邻交换。\n<\/ol>\n<p>依赖链方向：排列集合 → 逆序计数 → 序列与排列双射 → 方向位状态推进 → 邻接交换全覆盖。<\/p>\n<h2>正向推导：逆序序列的取值范围与计数<\/h2>\n<p>对元素 <span class=\"katex-inline\">j<\/span>，比它小的元素共有 <span class=\"katex-inline\">j-1<\/span> 个；这些元素在 <span class=\"katex-inline\">j<\/span> 右侧的个数可以是 <span class=\"katex-inline\">0,1,\\dots,j-1<\/span>，所以 <span class=\"katex-inline\">c_j\\in\\{0,1,\\dots,j-1\\}<\/span>，共 <span class=\"katex-inline\">j<\/span> 个取值。<\/p>\n<p>各 <span class=\"katex-inline\">c_j<\/span> 取值独立，合法序列总数：<\/p>\n<div class=\"katex-block\">\\prod_{j=1}^{n} j=1\\cdot2\\cdot3\\cdots n=n!.<\/div>\n<p>这个数与 <span class=\"katex-inline\">n<\/span> 元排列个数相等。要保证一一对应，重建规则把序列还原成唯一排列：按元素编号依次插入，<span class=\"katex-inline\">c_j<\/span> 指示新元素在当前队伍中相对右侧小元素的位置；每个序列给出唯一插入方式，每个排列也唯一读出自己的逆序序列。<\/p>\n<p><strong><span class=\"katex-inline\">n=3<\/span> 的全部合法序列<\/strong>：<span class=\"katex-inline\">c_1=0<\/span>；<span class=\"katex-inline\">c_2\\in\\{0,1\\}<\/span>；<span class=\"katex-inline\">c_3\\in\\{0,1,2\\}<\/span>。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><span class=\"katex-inline\">c_1<\/span><\/th><th><span class=\"katex-inline\">c_2<\/span><\/th><th><span class=\"katex-inline\">c_3<\/span><\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>0<\/td><td>0<\/td><td>2<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>共 6 条，对应 <span class=\"katex-inline\">3!=6<\/span> 个排列。序列状态机遍历这 6 条，即走完排列全集。<\/p>\n<h2>数值算例：从逆序序列到排列的方向核验<\/h2>\n<p>取序列 <span class=\"katex-inline\">(c_1,c_2,c_3)=(0,1,0)<\/span>。<\/p>\n<ol><li>\n元素 1：队伍 <span class=\"katex-inline\">[1]<\/span>。\n<\/li><li>\n元素 2：<span class=\"katex-inline\">c_2=1<\/span>，表示 2 右侧有 1 个比它小的元素；把 2 放在 1 左侧，队伍 <span class=\"katex-inline\">[2,1]<\/span>。\n<\/li><li>\n元素 3：<span class=\"katex-inline\">c_3=0<\/span>，表示 3 右侧没有比它小的元素；把 3 放在队伍最左，队伍 <span class=\"katex-inline\">[3,2,1]<\/span> 方向对应的相对次序由插入位置固定。\n<\/ol>\n<p>反向读出：排列中元素 3 右侧比 3 小的元素个数为 0，<span class=\"katex-inline\">c_3=0<\/span>；元素 2 右侧比 2 小的有 1 个，<span class=\"katex-inline\">c_2=1<\/span>；<span class=\"katex-inline\">c_1=0<\/span>。序列与排列互逆。<\/p>\n<p><strong>第二算例：<span class=\"katex-inline\">n=2<\/span> 状态<\/strong>。<span class=\"katex-inline\">c_1=0<\/span>，<span class=\"katex-inline\">c_2\\in\\{0,1\\}<\/span>。<span class=\"katex-inline\">c_2=0<\/span> 对应 <span class=\"katex-inline\">[1,2]<\/span> 方向；<span class=\"katex-inline\">c_2=1<\/span> 对应 <span class=\"katex-inline\">[2,1]<\/span> 方向。两条序列之间一次相邻交换完成切换，正是算法 P 在最小规模上的动作。<\/p>\n<h2>延伸推演：算法 P 的状态转移分支<\/h2>\n<p>P1 初始化所有 <span class=\"katex-inline\">c_j=0<\/span>、<span class=\"katex-inline\">o_j=1<\/span>。P2 访问当前排列后，P3 从 <span class=\"katex-inline\">j=n<\/span> 向下扫描，<span class=\"katex-inline\">s<\/span> 累计 <span class=\"katex-inline\">k&gt;j<\/span> 中 <span class=\"katex-inline\">c_k=0<\/span> 的条目数。<\/p>\n<p>P4 计算 <span class=\"katex-inline\">q=c_j+o_j<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">q\\ge0<\/span> 且 <span class=\"katex-inline\">q\\ne0<\/span>：走 P5，改变 <span class=\"katex-inline\">c_j<\/span>，翻转 <span class=\"katex-inline\">o_j<\/span>，本次对应一次相邻交换，返回 P2 访问新排列。\n<\/li><li>\n<span class=\"katex-inline\">q=0<\/span>：走 P6，<span class=\"katex-inline\">s<\/span> 加 1，<span class=\"katex-inline\">j<\/span> 减 1，继续向低位条目推进。\n<\/li><li>\n<span class=\"katex-inline\">q&lt;0<\/span>：走 P7，翻转 <span class=\"katex-inline\">o_j<\/span> 改变方向，<span class=\"katex-inline\">j<\/span> 减 1，返回 P4 重新判断。\n<\/ul>\n<p><span class=\"katex-inline\">j=1<\/span> 时两个出口都终止，说明最小编号条目的方向状态已走完一轮。整台状态机按逆序序列的数位进位方式推进：高位条目反复换向，低位条目在高位回卷时改变，与普通进制计数的进位结构同构，但每次有效输出只伴随一对邻接元素交换。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>逆序上界多取 1<\/strong>。若允许 <span class=\"katex-inline\">c_j=j<\/span>，取值数变为 <span class=\"katex-inline\">j+1<\/span>，序列总数 <span class=\"katex-inline\">(n+1)!<\/span> 量级；多出的状态在排列集合中没有对应对象，重建时插入位置越界。上界必须严格小于 <span class=\"katex-inline\">j<\/span>。<\/p>\n<p><strong>重复元素硬套邻接交换<\/strong>。书里以 <span class=\"katex-inline\">\\{1,1,2,2\\}<\/span> 为例：6 个排列尝试沿相邻交换连成一圈，图中不存在哈密顿路径——重复元素使相邻交换的可达关系变稀疏，低改动路线覆盖不了全部多重排列。这时要退回字典序等其他生成方法。<\/p>\n<p><strong>把方向位当排列元素<\/strong>。<span class=\"katex-inline\">o_j<\/span> 是辅助控制位，不出现在排列输出里；输出排列只由 <span class=\"katex-inline\">a_1\\dots a_n<\/span> 决定，<span class=\"katex-inline\">c_j,o_j<\/span> 是内部状态。混淆两者会把控制位误当成交换对象。<\/p>\n<h2>对抗性追问：算法 P 为什么比字典序 L 复杂<\/h2>\n<p>字典序 L 直接在排列上找支点、交换、反序，规则面向排列本身；算法 P 维护一套逆序序列与方向位状态机，相邻交换是状态转移的外部表现。低改动收益换来了辅助状态的管理成本。若应用不要求每次只动一对邻位，字典序的直观性更占优；邻接交换的价值体现在切换代价按位置计费的场景。<\/p>\n<h2><span class=\"katex-inline\">n=3<\/span> 逆序序列与排列对应表<\/h2>\n<p><span class=\"katex-inline\">c_1=0<\/span>，<span class=\"katex-inline\">c_2\\in\\{0,1\\}<\/span>，<span class=\"katex-inline\">c_3\\in\\{0,1,2\\}<\/span>，六条序列按重建方向对应六个排列：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>逆序序列 <span class=\"katex-inline\">(c_1,c_2,c_3)<\/span><\/th><th>重建排列方向<\/th><\/tr><\/thead><tbody><tr><td>000<\/td><td>123<\/td><\/tr><tr><td>001<\/td><td>132<\/td><\/tr><tr><td>002<\/td><td>312<\/td><\/tr><tr><td>010<\/td><td>213<\/td><\/tr><tr><td>011<\/td><td>231<\/td><\/tr><tr><td>012<\/td><td>321<\/td><\/tr><\/tbody><\/table><\/div>\n<p>表里每条序列的 <span class=\"katex-inline\">c_3<\/span> 取值遍历 0、1、2，<span class=\"katex-inline\">c_2<\/span> 交替 0、1；辅助状态空间覆盖全部排列，无遗漏无重复。<\/p>\n<h2>插入重建的完整步骤<\/h2>\n<p>从空队伍开始，按元素编号 1 到 <span class=\"katex-inline\">n<\/span> 依次插入：<\/p>\n<ol><li>\n插入 1：队伍 <span class=\"katex-inline\">[1]<\/span>。\n<\/li><li>\n插入 2：<span class=\"katex-inline\">c_2<\/span> 指示 2 右侧比它小的元素个数；<span class=\"katex-inline\">c_2=0<\/span> 放最右，<span class=\"katex-inline\">c_2=1<\/span> 放最左。\n<\/li><li>\n插入 3：<span class=\"katex-inline\">c_3<\/span> 指示 3 右侧比它小的元素个数，从右往左数相应位置插入。\n<\/li><li>\n后续元素同法处理。\n<\/ol>\n<p>反向读出：对每个元素数其右侧更小元素个数，得到 <span class=\"katex-inline\">c_j<\/span>。读出与插入互逆，序列与排列一一对应。<\/p>\n<h2>状态机分支再核<\/h2>\n<p>P3 置 <span class=\"katex-inline\">j=n<\/span>、<span class=\"katex-inline\">s=0<\/span>，<span class=\"katex-inline\">s<\/span> 累计 <span class=\"katex-inline\">k&gt;j<\/span> 中 <span class=\"katex-inline\">c_k=0<\/span> 的条目数。P4 算 <span class=\"katex-inline\">q=c_j+o_j<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">q&gt;0<\/span>：P5 改变 <span class=\"katex-inline\">c_j<\/span>，翻转 <span class=\"katex-inline\">o_j<\/span>，一次相邻交换后返回 P2 访问新排列。\n<\/li><li>\n<span class=\"katex-inline\">q=0<\/span>：P6 推进，<span class=\"katex-inline\">s<\/span> 加 1，<span class=\"katex-inline\">j<\/span> 减 1，继续向下找可改变条目。\n<\/li><li>\n<span class=\"katex-inline\">q&lt;0<\/span>：P7 翻转 <span class=\"katex-inline\">o_j<\/span>，<span class=\"katex-inline\">j<\/span> 减 1，回到 P4 重判方向。\n<\/ul>\n<p><span class=\"katex-inline\">j=1<\/span> 两出口都终止。整套进位结构与多进制计数同构：高位反复换向，低位在高位回卷时改变；每次有效输出对应一对邻接元素交换。<\/p>\n<h2>历史与重复元素边界<\/h2>\n<p>书里追溯算法 P 的源头到 17 世纪英国敲钟习俗：钟按不同排列次序反复敲击，平滑改变原则对应一次只移动一口钟。多重集情形以 <span class=\"katex-inline\">\\{1,1,2,2\\}<\/span> 为例，6 个排列的相邻交换图不存在哈密顿路径，低改动路线覆盖不了全部多重排列；此时退回字典序生成。<\/p>\n<h2>逆序序列计数再核<\/h2>\n<p><span class=\"katex-inline\">c_j<\/span> 取值 <span class=\"katex-inline\">0,\\dots,j-1<\/span> 共 <span class=\"katex-inline\">j<\/span> 个；各条目独立，总数 <span class=\"katex-inline\">\\prod_{j=1}^n j=n!<\/span>，与排列数相等。若上界写成 <span class=\"katex-inline\">c_j\\le j<\/span>，序列总数多出倍数，多余状态无对应排列；若下界误写成 1，又会漏掉 <span class=\"katex-inline\">c_j=0<\/span> 的状态。范围边界要按&quot;右侧更小元素个数&quot;严格定。<\/p>\n<h2>重建方向的一致性<\/h2>\n<p>插入时 <span class=\"katex-inline\">c_j<\/span> 指示新元素右侧较小元素个数；读出时数右侧更小元素个数。两个方向互逆。同一排列读出的序列唯一，同一序列重建的排列唯一，双射成立。数错左右方向会把排列镜像，序列与排列对应错位。<\/p>\n<h2>算法 P 与算法 L 的产物对照<\/h2>\n<p>两条路线都覆盖 <span class=\"katex-inline\">n!<\/span> 个排列。L 的产物按字典大小排列，相邻产物可能差多项；P 的产物按邻接交换相邻，每次只换一对，但次序不是词典序。应用场景按切换代价选：代价按位置计费选 P，输出要可排序选 L。<\/p>\n<h2>低改动枚举的适用边界<\/h2>\n<p>邻接交换路线在互不相同元素上成立；重复元素集合的交换图可能不存在哈密顿路径。书里 <span class=\"katex-inline\">\\{1,1,2,2\\}<\/span> 例子中 6 个排列连成的图找不到覆盖全图的邻接路径，此时低改动目标无法满足，退回字典序。<\/p>\n<h2><span class=\"katex-inline\">n=4<\/span> 逆序序列范围方向<\/h2>\n<p><span class=\"katex-inline\">c_1=0<\/span>，<span class=\"katex-inline\">c_2\\in\\{0,1\\}<\/span>，<span class=\"katex-inline\">c_3\\in\\{0,1,2\\}<\/span>，<span class=\"katex-inline\">c_4\\in\\{0,1,2,3\\}<\/span>，总数 <span class=\"katex-inline\">1\\cdot2\\cdot3\\cdot4=24=4!<\/span>。<span class=\"katex-inline\">c_j<\/span> 随 <span class=\"katex-inline\">j<\/span> 增大取值范围扩大；状态机进位时高位条目反复换向，低位条目在高位回卷时改变，结构与四进制计数同构。<\/p>\n<h2>方向位退出条件<\/h2>\n<p>P5 改变条目后返回 P2 访问新排列；P6、P7 推进下标继续寻找可改变条目；<span class=\"katex-inline\">j=1<\/span> 时两出口终止。终止发生在最小编号条目走完一轮方向状态，不是排列走到最大字典序——P 的次序不是词典序，退出依据是辅助状态遍历完合法空间。<\/p>\n<h2>邻接交换的代价模型<\/h2>\n<p>每次有效输出只伴随一对相邻元素交换；状态机内部的换向、推进不计入排列间交换次数。若应用按&quot;移动元素距离&quot;计费，邻接交换每步距离为 1；按&quot;生成排列个数&quot;计费，两条路线总量相同。比较两种算法先统一计费口径。<\/p>\n<h2>历史定位<\/h2>\n<p>书里把算法 P 追溯到 17 世纪英国敲钟习俗：钟按排列次序反复敲击，一次只移动一口钟；平滑改变原则对应邻接交换。这套机制后来被系统描述为排列的邻接交换生成法。理解历史背景有助于记住 P 的产物次序不是词典序，而是按交换邻接关系连成的一条通路。<\/p>\n<h2>与格雷码的同构对照<\/h2>\n<p>格雷码在 n 元组上做到相邻差一位；算法 P 在排列上做到相邻差一次邻接交换。两者都是低改动枚举路线，对象不同：位串改一位，排列换一对邻位。c07 的递归覆盖证明与本章的逆序序列遍历证明，分别支撑两套低改动序列的全覆盖性质。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">c_j<\/span> 的取值范围，说明取值个数为何是 <span class=\"katex-inline\">j<\/span>。\n<\/li><li>\n合法逆序序列总数怎样得到 <span class=\"katex-inline\">n!<\/span>？这个等式起什么作用？\n<\/li><li>\nP5、P6、P7 三个分支分别在什么条件下进入？各自做什么？\n<\/li><li>\n为什么重复元素集合上邻接交换可能找不到全覆盖路径？\n<\/li><li>\n方向位 <span class=\"katex-inline\">o_j<\/span> 与排列元素 <span class=\"katex-inline\">a_j<\/span> 的职责怎样区分？\n<\/ol><\/div><\/details>", "c10": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.312<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">字典序排列生成（Algorithm L）：下一个排列为何不漏不重<\/a><\/span><\/div><h1>组合生成：位串与元素表双表示、字典序算法 L 与 T<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch04（原书 §7.2.1.3，PDF 第 309、312 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p>从 <span class=\"katex-inline\">n<\/span> 个对象中选 <span class=\"katex-inline\">t<\/span> 个组成无序子集，共有 <span class=\"katex-inline\">\\binom nt<\/span> 个，要逐个产出不漏不重。困难在表示与次序两个层面：子集既可以列选中元素，也可以用位串标志成员；两种表示要能互相转换。生成次序上，字典序沿元素大小推进，找下一个组合时要定位最右可增大的元素并重设左侧后缀。算法 L 给出通用字典序路线，算法 T 是利用简单情形加速的改进版。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong><span class=\"katex-inline\">(s,t)<\/span> 组合<\/strong>：<span class=\"katex-inline\">n=s+t<\/span> 个对象中选 <span class=\"katex-inline\">t<\/span> 个的无序子集；对称地，也可看成把 <span class=\"katex-inline\">s+t<\/span> 个对象分成大小为 <span class=\"katex-inline\">s<\/span> 与 <span class=\"katex-inline\">t<\/span> 的两个集合。<\/p>\n<p><strong>元素表表示<\/strong>：递减列<\/p>\n<div class=\"katex-block\">n>c_t>\\cdots>c_1\\ge0.<\/div>\n<p><strong>位串表示<\/strong>：<span class=\"katex-inline\">a_{n-1}\\dots a_1a_0<\/span>，恰含 <span class=\"katex-inline\">t<\/span> 个 1，1 的位置对应选中元素；<span class=\"katex-inline\">a_{n-1}+\\cdots+a_0=t<\/span>。<\/p>\n<p><strong>等价对应<\/strong>：元素表 <span class=\"katex-inline\">c_t\\dots c_1<\/span> 与位串一一对应；位串中 1 的下标列出来即元素表。<\/p>\n<p><strong>算法 L（字典序组合）<\/strong>：初始化 <span class=\"katex-inline\">c_j=j-1\\ (1\\le j\\le t)<\/span>，<span class=\"katex-inline\">c_{t+1}=n<\/span>，<span class=\"katex-inline\">c_{t+2}=0<\/span>；L2 访问 <span class=\"katex-inline\">c_t\\dots c_1<\/span>；L3 找最右可增大下标 <span class=\"katex-inline\">j<\/span>；L4 若 <span class=\"katex-inline\">c_j&gt;j<\/span> 则 <span class=\"katex-inline\">c_j\\leftarrow c_j+1<\/span> 返回 L2；L5 否则把 <span class=\"katex-inline\">c_j<\/span> 加 1 并重设左侧元素为最小可能值，返回 L2。<\/p>\n<p><strong>算法 T（字典序组合，改进）<\/strong>：先判最简单情形，<span class=\"katex-inline\">c_1+1&lt;c_2<\/span> 时直接把 <span class=\"katex-inline\">c_1<\/span> 加 1；否则回退到更左的下标调整。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">n=5,t=3<\/span>，元素表 <span class=\"katex-inline\">4,3,2<\/span> 对应位串 <span class=\"katex-inline\">11100<\/span>；<span class=\"katex-inline\">\\binom53=10<\/span> 个组合。<\/p>\n<p><strong>反例<\/strong>：位串 1 的个数不等于 <span class=\"katex-inline\">t<\/span>；元素表出现等值或递增，都不是合法 <span class=\"katex-inline\">(s,t)<\/span> 组合。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>计数依据<\/strong>：从 <span class=\"katex-inline\">n<\/span> 选 <span class=\"katex-inline\">t<\/span> 的子集数为 <span class=\"katex-inline\">\\binom nt=\\frac{n!}{t!(n-t)!}<\/span>；位串视角下是选 <span class=\"katex-inline\">t<\/span> 个位置放 1，与元素表视角一一对应。<\/p>\n<p><strong>字典序后继<\/strong>：从右往左找最右还能增大的 <span class=\"katex-inline\">c_j<\/span>；增大 <span class=\"katex-inline\">c_j<\/span> 后，左侧 <span class=\"katex-inline\">c_{j-1}\\dots c_1<\/span> 重设为最小可能值（紧邻取值），保证得到字典序下一个组合。<\/p>\n<p><strong>平均代价方向<\/strong>：书里给出每次访问组合的平均循环步数方向为<\/p>\n<div class=\"katex-block\">\\frac{s+1}{t}\\cdot\\frac{n-t}{n+1},\\qquad s=n-t.<\/div>\n<p>当 <span class=\"katex-inline\">t\\le s<\/span> 时该比值很小，算法 L 实际非常有效；<span class=\"katex-inline\">t<\/span> 接近 <span class=\"katex-inline\">n<\/span> 而 <span class=\"katex-inline\">s<\/span> 较小时，比值可能放大，算法 T 的简单情形快路在此处减少回退。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：对象编号可排序；子集大小 <span class=\"katex-inline\">t<\/span> 固定。\n<\/li><li>\n失败案例 1：元素表不递减。等值或递增破坏 <span class=\"katex-inline\">c_t&gt;\\cdots&gt;c_1<\/span> 约定，标准化表示失效，同一子集被写成多份。\n<\/li><li>\n失败案例 2：位串 1 数不核对。选中元素个数偏离 <span class=\"katex-inline\">t<\/span>，混入其他大小的子集。\n<\/li><li>\n失败案例 3：<span class=\"katex-inline\">t<\/span> 很小时常套通用回退。<span class=\"katex-inline\">t<\/span> 小、<span class=\"katex-inline\">s<\/span> 大时多数情形只动最右元素；忽略简单情形会多走左侧重设步骤。\n<\/li><li>\n边界：可重组合（多重组合）另有 <span class=\"katex-inline\">d_t\\ge\\cdots\\ge d_1\\ge0<\/span> 的非增表示，与普通组合的严格递减约定不同。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>元素表 vs 位串<\/strong>：表列选中成员，便于输出具体子集；位串标志成员归属，便于按位运算筛选。两者一一对应，可双向转换。\n<\/li><li>\n<strong>算法 L vs 算法 T<\/strong>：L 是通用字典序路线；T 先判最右元素能否直接加 1，简单情形跳过回退，执行更快。\n<\/li><li>\n<strong>普通组合 vs 多重组合<\/strong>：普通组合元素不重复，表严格递减；多重组合允许重复，表非增。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c08 排列字典序是全排路线；组合是选子集，字典序思路从排列推广到子集。后继：c11 划分与集合划分把组合再按分组结构展开；c04 按位与、包含关系用于位串子集筛选。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（组合生成：位串与元素表双表示、字典序算法 L 与 T）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：双表示转换、字典序组合逐步枚举与平均代价推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>组合生成拆成四层：<\/p>\n<ol><li>\n子集定义：<span class=\"katex-inline\">n<\/span> 个对象选 <span class=\"katex-inline\">t<\/span> 个，无序，成员归属用标志位表达。\n<\/li><li>\n两种表示：递减元素表与恰含 <span class=\"katex-inline\">t<\/span> 个 1 的位串，一一对应。\n<\/li><li>\n字典序后继：定位最右可增大元素，增 1，左侧重设为最小组合。\n<\/li><li>\n代价评估：平均回退步数由 <span class=\"katex-inline\">s,t<\/span> 比值控制；<span class=\"katex-inline\">t<\/span> 小时常走简单快路。\n<\/ol>\n<p>依赖链方向：子集集合 → 双表示互译 → 字典后继构造 → 全覆盖链路 → 平均代价方向。<\/p>\n<h2>正向推导：两种表示的逐位转换<\/h2>\n<p>设全集编号 <span class=\"katex-inline\">0,1,\\dots,n-1<\/span>。元素表 <span class=\"katex-inline\">c_t&gt;\\cdots&gt;c_1<\/span>，位串 <span class=\"katex-inline\">a_{n-1}\\dots a_0<\/span>，约定 <span class=\"katex-inline\">a_k=1<\/span> 当且仅当 <span class=\"katex-inline\">k<\/span> 在表中。<\/p>\n<p><strong>表到位串<\/strong>：对每个选中下标 <span class=\"katex-inline\">c_i<\/span>，把对应位置 1，其余置 0。<strong>位串到表<\/strong>：从左到右扫位串，把 1 的下标按递减顺序收集为 <span class=\"katex-inline\">c_t\\dots c_1<\/span>。<\/p>\n<p>计数核验：选 <span class=\"katex-inline\">t<\/span> 个位置放 1 的方式为 <span class=\"katex-inline\">\\binom nt<\/span>；元素表视角是从 <span class=\"katex-inline\">n<\/span> 个数中取 <span class=\"katex-inline\">t<\/span> 个的子集，同一批对象，两式计数相等。<\/p>\n<h2>数值算例：<span class=\"katex-inline\">n=5,t=3<\/span> 的全部组合与双表示<\/h2>\n<p><span class=\"katex-inline\">\\binom53=10<\/span>。字典序列出元素表与对应位串（位序 <span class=\"katex-inline\">a_4a_3a_2a_1a_0<\/span>）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>元素表 <span class=\"katex-inline\">c_3c_2c_1<\/span><\/th><th>位串<\/th><\/tr><\/thead><tbody><tr><td>2,1,0<\/td><td>00111<\/td><\/tr><tr><td>3,1,0<\/td><td>01011<\/td><\/tr><tr><td>3,2,0<\/td><td>01101<\/td><\/tr><tr><td>3,2,1<\/td><td>01110<\/td><\/tr><tr><td>4,1,0<\/td><td>10011<\/td><\/tr><tr><td>4,2,0<\/td><td>10101<\/td><\/tr><tr><td>4,2,1<\/td><td>10110<\/td><\/tr><tr><td>4,3,0<\/td><td>11001<\/td><\/tr><tr><td>4,3,1<\/td><td>11010<\/td><\/tr><tr><td>4,3,2<\/td><td>11100<\/td><\/tr><\/tbody><\/table><\/div>\n<p>逐行核对：每行恰 3 个 1；元素表严格递减；位串 1 的下标倒过来即表。<\/p>\n<p><strong>后继推演<\/strong>：从 <span class=\"katex-inline\">3,1,0<\/span>（01011）出发，最右可增元素是 <span class=\"katex-inline\">c_2=1<\/span>？按字典序下一个为 <span class=\"katex-inline\">3,2,0<\/span>（01101）：<span class=\"katex-inline\">c_1=0<\/span> 已到下限不可增，<span class=\"katex-inline\">c_2=1<\/span> 增到 2，<span class=\"katex-inline\">c_1<\/span> 重设为最小可能值 0。再下一个 <span class=\"katex-inline\">3,2,1<\/span>：<span class=\"katex-inline\">c_1<\/span> 从 0 增到 1。<span class=\"katex-inline\">3,2,1<\/span> 之后 <span class=\"katex-inline\">c_1,c_2<\/span> 都到上限，<span class=\"katex-inline\">c_3=3<\/span> 增到 4，左侧重设为 <span class=\"katex-inline\">2,0<\/span>，得 <span class=\"katex-inline\">4,2,0<\/span> 方向链路。<\/p>\n<h2>延伸推演：平均代价公式的方向<\/h2>\n<p>书里给出访问一个组合时 L3 循环平均执行次数方向：<\/p>\n<div class=\"katex-block\">\\binom{n-1}{t-1}+\\binom{n-2}{t-2}+\\cdots+\\binom{n-t}{0}=\\binom ns,<\/div>\n<p>摊到每个组合：<\/p>\n<div class=\"katex-block\">\\frac{\\binom ns}{\\binom nt}=\\frac{s+1}{t}\\cdot\\frac{n-t}{n+1},\\qquad s=n-t.<\/div>\n<p>当 <span class=\"katex-inline\">t\\le s<\/span>（选中数不超过剩余数）时比值小于 1 量级，多数组合只需动最右元素；<span class=\"katex-inline\">t<\/span> 接近 <span class=\"katex-inline\">n<\/span>、<span class=\"katex-inline\">s<\/span> 小时比值上升，回退到左侧下标变频繁。算法 T 的快路正是利用这一点：先看 <span class=\"katex-inline\">c_1+1&lt;c_2<\/span> 是否成立，成立就只增 <span class=\"katex-inline\">c_1<\/span>，否则才回退 <span class=\"katex-inline\">j<\/span>。<\/p>\n<p>对照 c08 排列：排列字典序每次可能反序整段后缀；组合固定选 <span class=\"katex-inline\">t<\/span> 个元素，后继调整范围受表长 <span class=\"katex-inline\">t<\/span> 限制，平均代价由 <span class=\"katex-inline\">s/t<\/span> 比值主导。<\/p>\n<h2>第二算例：多重组合的差别表示<\/h2>\n<p>允许重复时，<span class=\"katex-inline\">(s,t)<\/span> 多重组合写成非增整数列 <span class=\"katex-inline\">d_t\\ge\\cdots\\ge d_2\\ge d_1\\ge0<\/span>。书里给出与普通组合的转换：<span class=\"katex-inline\">c_i=d_i+t-i<\/span> 一类关系把非多重映射到多重；表 1 在 <span class=\"katex-inline\">s=t=3<\/span> 下列出同一些组合的八种等价形式（位串、位置表、栅栏位置、网格路径等）。普通组合严格递减，多重组合允许等值，两套表示不能混用。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>元素表出现等值<\/strong>。若表写成 <span class=\"katex-inline\">3,3,1<\/span>，两个相同下标对应同一个对象被选两次；普通组合不允许重复，这条表不合法。转换到位串会出现一个位置被记两次，标志位语义冲突。<\/p>\n<p><strong>位串 1 数漏核<\/strong>。生成过程中若只移动 1 而不核对总数，可能得到 2 个或 4 个 1 的位串，混入其他大小的子集；每次访问前应核验 <span class=\"katex-inline\">\\sum a_k=t<\/span>。<\/p>\n<p><strong>忽略简单情形走通用回退<\/strong>。<span class=\"katex-inline\">t<\/span> 很小时多数后继只把最右元素加 1；若每次都从 <span class=\"katex-inline\">c_t<\/span> 开始回退检查，空耗循环。算法 T 的 <span class=\"katex-inline\">c_1+1&lt;c_2<\/span> 判断就是先摘出这类快路。<\/p>\n<h2>对抗性追问：组合位串为什么不能直接套格雷码全覆盖<\/h2>\n<p>格雷码序列覆盖全部 <span class=\"katex-inline\">2^n<\/span> 个位串，其中多数 1 的个数不是 <span class=\"katex-inline\">t<\/span>；固定 <span class=\"katex-inline\">t<\/span> 的子集是位串集合的一个切片。要在切片内做低改动次序，需要旋转门（revolving door）一类专用顺序，每次换入一个元素、换出一个元素；普通格雷码的相邻差一位性质不保证 1 的个数不变。<\/p>\n<h2><span class=\"katex-inline\">n=6,t=2<\/span> 的组合枚举<\/h2>\n<p><span class=\"katex-inline\">\\binom62=15<\/span>。元素表按字典序列出（下标 0–5）：<\/p>\n<pre><code>1,0   2,0   2,1   3,0   3,1   3,2   4,0\n4,1   4,2   4,3   5,0   5,1   5,2   5,3   5,4<\/code><\/pre>\n<p>对应位串各含 2 个 1。后继推演：<span class=\"katex-inline\">3,1<\/span> 的下一个是 <span class=\"katex-inline\">3,2<\/span>（<span class=\"katex-inline\">c_1<\/span> 从 1 增到 2）；<span class=\"katex-inline\">3,2<\/span> 之后 <span class=\"katex-inline\">c_1,c_2<\/span> 到上限，<span class=\"katex-inline\">c_2<\/span> 增到 4 方向，左侧 <span class=\"katex-inline\">c_1<\/span> 重设为最小 0，得 <span class=\"katex-inline\">4,0<\/span>。<\/p>\n<h2>算法 T 快路判定<\/h2>\n<p>T2 访问后先看最右元素能否直接加 1：若 <span class=\"katex-inline\">c_1+1&lt;c_2<\/span>，直接 <span class=\"katex-inline\">c_1\\leftarrow c_1+1<\/span> 返回 T2；否则回退到更左的 <span class=\"katex-inline\">j<\/span> 调整。<span class=\"katex-inline\">t<\/span> 小时多数组合满足 <span class=\"katex-inline\">c_1<\/span> 未贴住 <span class=\"katex-inline\">c_2<\/span>，快路命中；回退只发生在最右元素已到紧邻上限时。<\/p>\n<h2>平均代价公式对照<\/h2>\n<p>摊到每个组合的回退步数方向为 <span class=\"katex-inline\">\\frac{s+1}{t}\\cdot\\frac{n-t}{n+1}<\/span>，<span class=\"katex-inline\">s=n-t<\/span>。<span class=\"katex-inline\">t=2,s=4,n=6<\/span> 时代入 <span class=\"katex-inline\">\\frac{5}{2}\\cdot\\frac{4}{7}\\approx1.43<\/span> 量级；<span class=\"katex-inline\">t<\/span> 越小、<span class=\"katex-inline\">s<\/span> 越大，比值越低。这解释了为什么小 <span class=\"katex-inline\">t<\/span> 组合生成接近常数每组合开销。<\/p>\n<h2>多重组合转换方向<\/h2>\n<p>允许重复时多重组合写成非增列 <span class=\"katex-inline\">d_t\\ge\\cdots\\ge d_1\\ge0<\/span>。普通组合严格递减；两套表示通过下标平移互转：<span class=\"katex-inline\">c_i=d_i+t-i<\/span> 一类关系把非多重映射到多重。表 1 在 <span class=\"katex-inline\">s=t=3<\/span> 下列出同一组合的位串、位置表、栅栏位置、网格路径等八种等价形式，说明组合对象可从多个角度编码。<\/p>\n<h2>低改动路线补充<\/h2>\n<p>普通字典序相邻组合可能换入换出多个元素；旋转门（revolving door）次序每次只换一个元素，适合按位翻转代价高的场景。本书 §7.2.1.3 在字典序算法之外列出这类备选顺序，选择依据仍是相邻改动量与实现复杂度的权衡。<\/p>\n<h2>位串与元素表转换核对步骤<\/h2>\n<ol><li>\n表到位串：选中下标位置 1，其余 0，核对 1 的个数等于 <span class=\"katex-inline\">t<\/span>。\n<\/li><li>\n位串到表：收集所有 1 的下标，按递减排列成 <span class=\"katex-inline\">c_t\\dots c_1<\/span>。\n<\/li><li>\n合法性：表严格递减，位串恰含 <span class=\"katex-inline\">t<\/span> 个 1；两条任一不满足即为非法组合。\n<\/ol>\n<h2>字典序后继的定位方向<\/h2>\n<p>从右往左找最右可增大元素 <span class=\"katex-inline\">c_j<\/span>；增大后左侧 <span class=\"katex-inline\">c_{j-1}\\dots c_1<\/span> 重设为最小紧邻取值。找错方向（从左往右）会跳过中间组合，漏排；不重设左侧后缀，后继次序偏大。<\/p>\n<h2>组合与 n 元组的关系<\/h2>\n<p>n 元组是任意 0/1 位串；组合是 1 的个数固定为 <span class=\"katex-inline\">t<\/span> 的切片。格雷码覆盖全部位串，不保证 1 的个数不变；组合枚举要么走字典序，要么走固定 1 数的旋转门次序。c07 的全覆盖次序不能直接拿来枚举固定大小子集。<\/p>\n<h2>多重组合的表示差别<\/h2>\n<p>普通组合表严格递减；多重组合表非增，允许等值。两套表示通过下标平移互转。读题时先确认元素可否重复，再选递减还是非增约定，避免把重复元素当成两个不同选中对象。<\/p>\n<h2>组合计数与位串选择的等价性<\/h2>\n<p><span class=\"katex-inline\">\\binom nt<\/span> 数的是从 <span class=\"katex-inline\">n<\/span> 位中选 <span class=\"katex-inline\">t<\/span> 个位置放 1 的方式；元素表视角是选 <span class=\"katex-inline\">t<\/span> 个编号子集。两种计数相等，是同一批对象的两种数法。写生成算法时先固定走元素表还是位串表示，后继调整在同一种表示内完成，避免每步来回转换。<\/p>\n<h2>算法 L 与 T 的分工<\/h2>\n<p>L 是通用字典序路线，找最右可增下标并重设左侧；T 先判最简单情形（<span class=\"katex-inline\">c_1+1&lt;c_2<\/span> 直接增 <span class=\"katex-inline\">c_1<\/span>），快路命中时跳过回退。实现上 T 多一个前置判断，换来小 <span class=\"katex-inline\">t<\/span> 情形下更少回退；两种算法产物次序一致，差别在执行速度。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">n=6,t=2<\/span> 时 <span class=\"katex-inline\">\\binom62<\/span> 的值，并列出两个组合的双表示。\n<\/li><li>\n元素表 <span class=\"katex-inline\">5,3,1<\/span> 对应怎样的位串？位串 <span class=\"katex-inline\">100101<\/span> 对应什么递减表？\n<\/li><li>\n字典序后继时，为什么左侧元素要重设为最小可能值？\n<\/li><li>\n平均代价公式里 <span class=\"katex-inline\">s,t<\/span> 各是什么？<span class=\"katex-inline\">t\\le s<\/span> 时算法效率方向如何？\n<\/li><li>\n普通组合与多重组合的元素表次序约定差在哪里？\n<\/ol><\/div><\/details>", "c11": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.339<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c10\">组合生成：位串与元素表双表示、字典序算法 L 与 T<\/a><\/span><\/div><h1>整数划分与集合划分：十二类方式与两类划分的差别<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch04（原书 §7.2.1.4–7.2.1.5，PDF 第 339、360 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p>&quot;划分&quot;一词在组合计数里覆盖两类很不相同的对象：把一个整数拆成若干整数之和，或把一个集合拆成若干互不相交的子集。混在一起会把计数、生成方法全部搞错。这一概念先把两类划分分开定义、各自标准化表示，再放回球与桶带不带标记的十二类方式里定位，说明哪一类对应排列、子集、多重组合、放球入笼等已知对象。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>整数划分（partition）<\/strong>：把正整数 <span class=\"katex-inline\">n<\/span> 写成一组非增正整数之和<\/p>\n<div class=\"katex-block\">n=a_1+a_2+\\cdots+a_m,\\qquad a_1\\ge a_2\\ge\\cdots\\ge a_m>0.<\/div>\n<p>不考虑因子次序；<span class=\"katex-inline\">7<\/span> 的一个划分为 <span class=\"katex-inline\">3+3+1<\/span>，另一个为 <span class=\"katex-inline\">1+1+1+\\cdots<\/span> 方向的单位和。<\/p>\n<p><strong>集合划分（set partition）<\/strong>：把集合 <span class=\"katex-inline\">\\{1,2,\\dots,n\\}<\/span> 分成若干互不相交的非空子集（块）。例：<span class=\"katex-inline\">\\{1,2,3\\}<\/span> 的 5 个集合划分为 <span class=\"katex-inline\">123<\/span>、<span class=\"katex-inline\">12\\mid3<\/span>、<span class=\"katex-inline\">13\\mid2<\/span>、<span class=\"katex-inline\">1\\mid23<\/span>、<span class=\"katex-inline\">1\\mid2\\mid3<\/span>。<\/p>\n<p><strong>标准化约定<\/strong>：块内元素按递增排列；块之间按最小元素递增排列。同一划分只有一种标准写法。<\/p>\n<p><strong>限制增长串（restricted growth string）<\/strong>：集合划分的编码串 <span class=\"katex-inline\">a_1a_2\\dots a_n<\/span>，其中<\/p>\n<div class=\"katex-block\">a_1=0,\\qquad a_{j+1}\\le 1+\\max(a_1,\\dots,a_j).<\/div>\n<p>每个 <span class=\"katex-inline\">a_j<\/span> 记录元素 <span class=\"katex-inline\">j<\/span> 所属块的编号；新块编号不超过已有块数加 1。<\/p>\n<p><strong>十二类方式<\/strong>：球标记/不标记、桶标记/不标记，结合&quot;每桶球数无限制、至少一个、至多一个&quot;等条件，对应 n 元组、n 排列、子集、多重组合、n 划分、<span class=\"katex-inline\">r<\/span> 部分划分、<span class=\"katex-inline\">r<\/span> 部分有序划分、放球入笼等类别。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">4<\/span> 的整数划分含 <span class=\"katex-inline\">3+1<\/span>、<span class=\"katex-inline\">2+2<\/span>、<span class=\"katex-inline\">2+1+1<\/span>、<span class=\"katex-inline\">1+1+1+1<\/span>；集合划分 <span class=\"katex-inline\">12\\mid3<\/span> 与 <span class=\"katex-inline\">3\\mid12<\/span> 是同一个，标准写成 <span class=\"katex-inline\">12\\mid3<\/span>。<\/p>\n<p><strong>反例<\/strong>：把 <span class=\"katex-inline\">2+3<\/span> 与 <span class=\"katex-inline\">3+2<\/span> 当两个整数划分；把相交子集当集合划分；块间不排序导致同一划分多份写法。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>两类划分对象不同<\/strong>：整数划分的元素是数值，块不区分身份；集合划分的元素是集合成员，块有归属关系。计数依据不同：整数划分个数由分拆数给出，集合划分个数由斯特林数第二类方向给出。<\/p>\n<p><strong>标准化消重<\/strong>：整数划分用非增次序吸收因子排列；集合划分用块内递增、块间按最小元递增吸收排列。两条约定分别把同一对象的多种摆放折成一种写法。<\/p>\n<p><strong>限制增长串可行<\/strong>：第 <span class=\"katex-inline\">j+1<\/span> 个元素要么进入已有某块（编号取已有范围），要么新开一块（编号为最大编号加 1），所以 <span class=\"katex-inline\">a_{j+1}\\le1+\\max<\/span>。串与集合划分一一对应。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：整数划分针对正整数；集合划分针对有限集合。\n<\/li><li>\n失败案例 1：整数划分不要求非增。<span class=\"katex-inline\">2+3+1<\/span> 与 <span class=\"katex-inline\">3+2+1<\/span> 被当不同划分，分拆计数重复放大。\n<\/li><li>\n失败案例 2：集合划分允许块相交。两块共享元素时归属不清，子集族不再是划分。\n<\/li><li>\n失败案例 3：把十二类方式混为一谈。球、桶标记与否决定对象是排列还是子集；不先固定标记条件，计数类别会选错。\n<\/li><li>\n边界：集合划分的生成比组合复杂，块数与成员归属同时变化；限制增长串是其标准编码入口。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>整数划分 vs 集合划分<\/strong>：前者拆数、后者拆集合；前者块无身份，后者块由成员确定。\n<\/li><li>\n<strong>集合划分 vs 组合<\/strong>：组合是选一个子集；集合划分是把全集拆完，所有块互不相交且覆盖全集。\n<\/li><li>\n<strong>标记球/桶 vs 不标记<\/strong>：标记时对象可区分，对应排列、有序划分；不标记时同构对象合并，对应子集、无序划分。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c10 组合是集合的一个子集；集合划分是全集的一组不相交子集，组合是其单层构件。后继：c12 树的森林生成建立在集合嵌套结构上；限制增长串的编码思路与 c09 逆序序列同属&quot;用辅助计数枚举对象&quot;。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（整数划分与集合划分：十二类方式与两类划分的差别）<\/summary><div class=\"depth-body\"><h1>c11 深度推导：两类划分计数对照、限制增长串构造与十二类方式定位<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把划分类概念拆开，往回追四层：<\/p>\n<ol><li>\n对象原型：球（被分配的元素）与桶（接收位置）各自带不带标记，决定对象是否可区分。\n<\/li><li>\n两类划分：整数划分拆数值，集合划分拆集合成员；标准化约定各自消除排列重复。\n<\/li><li>\n编码入口：集合划分用限制增长串记录每个成员所属块，串与划分一一对应。\n<\/li><li>\n类别定位：球/桶标记与桶容量条件交叉，对应到排列、子集、组合、放球等已知对象。\n<\/ol>\n<p>依赖链方向：球桶标记 → 两类划分定义 → 标准化与编码 → 十二类方式映射。<\/p>\n<h2>正向推导：整数划分的标准化与枚举<\/h2>\n<p>整数划分把 <span class=\"katex-inline\">n<\/span> 写成非增正整数和。非增约定把因子次序吸收掉：<span class=\"katex-inline\">3+1<\/span> 与 <span class=\"katex-inline\">1+3<\/span> 是同一划分，写时统一成 <span class=\"katex-inline\">3+1<\/span>。<\/p>\n<p><strong><span class=\"katex-inline\">n=4<\/span> 的全部整数划分<\/strong>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">4<\/span>\n<\/li><li>\n<span class=\"katex-inline\">3+1<\/span>\n<\/li><li>\n<span class=\"katex-inline\">2+2<\/span>\n<\/li><li>\n<span class=\"katex-inline\">2+1+1<\/span>\n<\/li><li>\n<span class=\"katex-inline\">1+1+1+1<\/span>\n<\/ul>\n<p>共 5 个。逐行核对非增：<span class=\"katex-inline\">3+1<\/span> 中 <span class=\"katex-inline\">3\\ge1<\/span>；<span class=\"katex-inline\">2+1+1<\/span> 中 <span class=\"katex-inline\">2\\ge1\\ge1<\/span>；末行全为 1。<\/p>\n<p><strong><span class=\"katex-inline\">n=5<\/span> 的方向<\/strong>：<span class=\"katex-inline\">5<\/span>；<span class=\"katex-inline\">4+1<\/span>；<span class=\"katex-inline\">3+2<\/span>；<span class=\"katex-inline\">3+1+1<\/span>；<span class=\"katex-inline\">2+2+1<\/span>；<span class=\"katex-inline\">2+1+1+1<\/span>；<span class=\"katex-inline\">1^5<\/span>。划分按最大项递减、次大项递减排列，生成时从最大项开始固定，再对剩余部分递归划分。<\/p>\n<h2>正向推导：集合划分与限制增长串<\/h2>\n<p>集合 <span class=\"katex-inline\">\\{1,2,3\\}<\/span> 的 5 个划分：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>标准写法<\/th><th>限制增长串 <span class=\"katex-inline\">a_1a_2a_3<\/span><\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">123<\/span><\/td><td>000<\/td><\/tr><tr><td><span class=\"katex-inline\">12\\mid3<\/span><\/td><td>001<\/td><\/tr><tr><td><span class=\"katex-inline\">13\\mid2<\/span><\/td><td>010<\/td><\/tr><tr><td><span class=\"katex-inline\">1\\mid23<\/span><\/td><td>011<\/td><\/tr><tr><td><span class=\"katex-inline\">1\\mid2\\mid3<\/span><\/td><td>012<\/td><\/tr><\/tbody><\/table><\/div>\n<p>构造规则：<span class=\"katex-inline\">a_1=0<\/span>（元素 1 进 0 号块）；对元素 <span class=\"katex-inline\">j+1<\/span>，可进已有块（编号取 <span class=\"katex-inline\">0,\\dots,\\max<\/span>），或新开一块（编号 <span class=\"katex-inline\">\\max+1<\/span>），故 <span class=\"katex-inline\">a_{j+1}\\le1+\\max(a_1,\\dots,a_j)<\/span>。<\/p>\n<p>核验 <span class=\"katex-inline\">011<\/span>：<span class=\"katex-inline\">a_1=0<\/span>；<span class=\"katex-inline\">a_2=1<\/span> 新开 1 号块；<span class=\"katex-inline\">a_3=1<\/span> 进 1 号块，对应 <span class=\"katex-inline\">1\\mid23<\/span>。核验 <span class=\"katex-inline\">012<\/span>：<span class=\"katex-inline\">a_2=1<\/span> 新开，<span class=\"katex-inline\">a_3=2<\/span> 再新开，三块分立。违反约束的串如 <span class=\"katex-inline\">021<\/span>：<span class=\"katex-inline\">a_2=2&gt;1+\\max(0)=1<\/span>，第二个元素不可能直接进 2 号块——此时 2 号块尚不存在。<\/p>\n<h2>数值算例：集合划分与组合的差别<\/h2>\n<p>组合 <span class=\"katex-inline\">\\{1,3\\}<\/span> 是全集的一个子集，剩余元素 <span class=\"katex-inline\">\\{2\\}<\/span> 不被安排；集合划分 <span class=\"katex-inline\">13\\mid2<\/span> 要求成员 1、3 同块，成员 2 独自成块，全集被拆完。同一个元素表 <span class=\"katex-inline\">\\{1,3\\}<\/span> 在组合语境是选中子集，在划分语境只是其中一个块，块外成员另有归属。<\/p>\n<p><strong>第二算例：十二类方式对照方向<\/strong>。书里表 1 按球标记、桶标记、桶内球数限制交叉列出：<\/p>\n<ul><li>\n球标记、桶标记、每桶至多一个：<span class=\"katex-inline\">n<\/span> 排列方向；\n<\/li><li>\n球不标记、桶标记、无限制：<span class=\"katex-inline\">n<\/span> 元素的子集方向；\n<\/li><li>\n球标记、桶不标记：<span class=\"katex-inline\">\\{1,\\dots,n\\}<\/span> 的划分类；\n<\/li><li>\n球不标记、桶不标记：<span class=\"katex-inline\">n<\/span> 的划分类。\n<\/ul>\n<p>先固定球是否可区分、桶是否可区分，再选容量条件，类别才唯一。<\/p>\n<h2>延伸推演：生成集合划分的结构<\/h2>\n<p>限制增长串逐位生长：每加入一个新元素，选项是进已有块或开新块。生成算法沿串枚举：从 <span class=\"katex-inline\">00\\dots0<\/span> 出发，调整最右可改变的条目；开新块对应编号取上限，进旧块对应回退编号。这一结构与 c09 逆序序列的数位推进类似：辅助串的每一位有取值范围，遍历合法串即遍历对象全集。<\/p>\n<p>整数划分的生成则沿非增数列：固定第一项不超过前一项，剩余部分继续拆分；两条生成路线分别适配拆数与拆集合，不能互套。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>整数划分计入因子次序<\/strong>。把 <span class=\"katex-inline\">2+3<\/span> 与 <span class=\"katex-inline\">3+2<\/span> 当两个划分，<span class=\"katex-inline\">n=5<\/span> 的划分个数被放大；非增约定正是为了消除这类重复。生成时若允许后项大于前项，同一分拆会以多种次序重复出现。<\/p>\n<p><strong>集合划分块相交<\/strong>。若块 <span class=\"katex-inline\">\\{1,2\\}<\/span> 与 <span class=\"katex-inline\">\\{2,3\\}<\/span> 共享 2，元素 2 归属两块，划分不满足互不相交；计数时该对象被两个块分别计入，重复且定义失效。<\/p>\n<p><strong>跳过标记条件选类别<\/strong>。球不可区分时仍按排列计数，会把同构分配算成多个不同对象；桶不可区分时仍按有序分块排序，又会把同一划分重复列出。十二类方式的定位必须先回答球、桶两个标记问题。<\/p>\n<h2>对抗性追问：集合划分个数为什么不能用组合数直接给<\/h2>\n<p>组合数 <span class=\"katex-inline\">\\binom nt<\/span> 计数选一个子集；集合划分要把全集拆成若干块，块数从 1 到 <span class=\"katex-inline\">n<\/span> 不等，且块内成员归属同时确定。它对应第二类斯特林数方向的求和（各块数对应的划分个数相加），不是一次选 <span class=\"katex-inline\">t<\/span> 个元素能覆盖的量。c10 的组合是单层选择，集合划分是多层分块，计数层级不同。<\/p>\n<h2><span class=\"katex-inline\">n=4<\/span> 集合划分的限制增长串方向<\/h2>\n<p><span class=\"katex-inline\">a_1=0<\/span>；<span class=\"katex-inline\">a_2\\in\\{0,1\\}<\/span>；<span class=\"katex-inline\">a_3\\in\\{0,1,2\\}<\/span>；<span class=\"katex-inline\">a_4\\in\\{0,1,2,3\\}<\/span>，且 <span class=\"katex-inline\">a_{j+1}\\le1+\\max(a_1\\dots a_j)<\/span>。合法串例如：<\/p>\n<ul><li>\n<span class=\"katex-inline\">0000<\/span>：四块合一，<span class=\"katex-inline\">1234<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">0001<\/span>：<span class=\"katex-inline\">123\\mid4<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">0010<\/span>：<span class=\"katex-inline\">124\\mid3<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">0101<\/span>：<span class=\"katex-inline\">13\\mid24<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">0123<\/span>：四块分立，<span class=\"katex-inline\">1\\mid2\\mid3\\mid4<\/span>。\n<\/ul>\n<p>核验 <span class=\"katex-inline\">0101<\/span>：<span class=\"katex-inline\">a_2=1<\/span> 新开块 1；<span class=\"katex-inline\">a_3=0<\/span> 回块 0；<span class=\"katex-inline\">a_4=1<\/span> 进块 1，块 0 为 <span class=\"katex-inline\">\\{1,3\\}<\/span>，块 1 为 <span class=\"katex-inline\">\\{2,4\\}<\/span>。<\/p>\n<h2>十二类方式定位对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>球<\/th><th>桶<\/th><th>条件方向<\/th><th>对应对象<\/th><\/tr><\/thead><tbody><tr><td>标记<\/td><td>标记<\/td><td>每桶至多一个<\/td><td><span class=\"katex-inline\">n<\/span> 排列<\/td><\/tr><tr><td>不标记<\/td><td>标记<\/td><td>无限制<\/td><td>子集方向<\/td><\/tr><tr><td>标记<\/td><td>不标记<\/td><td>无限制<\/td><td><span class=\"katex-inline\">\\{1,\\dots,n\\}<\/span> 划分<\/td><\/tr><tr><td>不标记<\/td><td>不标记<\/td><td>无限制<\/td><td><span class=\"katex-inline\">n<\/span> 的划分<\/td><\/tr><\/tbody><\/table><\/div>\n<p>先定球、桶是否可区分，再定桶容量（无限制、至少一个、至多一个），类别唯一。球不标记时同构分配合并计数；桶不标记时块的次序被吸收。<\/p>\n<h2>两类划分生成路线<\/h2>\n<p>整数划分沿非增数列：固定第一项不超过前一项，剩余部分递归拆分；生成对象是数值的多重和。集合划分沿限制增长串逐位生长：新元素进已有块或开新块；生成对象是成员归属关系。两条路线不能互套：把集合划分按非增数列排序没有意义，把整数划分按块成员列清单也没有对应对象。<\/p>\n<h2>计数区别再辨<\/h2>\n<p>组合数 <span class=\"katex-inline\">\\binom nt<\/span> 选一个子集；第二类斯特林数方向计数把全集拆成指定块数的集合划分，全部块数求和才是集合划分总数；整数划分计数由分拆数给出。三者计数对象不同，公式不能互相替代。<\/p>\n<h2>限制增长串的合法性条件逐条核<\/h2>\n<ol><li>\n<span class=\"katex-inline\">a_1=0<\/span>：第一个元素归入 0 号块。\n<\/li><li>\n<span class=\"katex-inline\">a_{j+1}\\le1+\\max(a_1\\dots a_j)<\/span>：新元素进已有块，或开编号最大加 1 的新块。\n<\/li><li>\n块编号在标准写法下按最小元素递增排列。\n<\/ol>\n<p>违反第 2 条的串（如 <span class=\"katex-inline\">021<\/span>）跳过尚不存在的块，不能对应划分。<\/p>\n<h2>两类划分的生成不可互套<\/h2>\n<p>整数划分沿非增数列递归拆分；集合划分沿增长串逐位定归属。把集合成员排成非增数列没有意义，把整数拆块列成员清单也没有对象对应。学习时先判断问题拆的是数还是集合，再选生成路线。<\/p>\n<h2>与组合、树的层次关系<\/h2>\n<p>组合是选出一个子集；集合划分是把全集拆成一组不相交子集；树是带嵌套父子层次的结构。组合是划分的单层构件，划分是树的扁平前驱。c12 的森林可以看成集合划分再加上嵌套父子关系。<\/p>\n<h2>块的标准排序两条规则<\/h2>\n<p>块内元素按递增排列；块之间按各自最小元素递增排列。两条规则把同一划分的多种书写折成一份标准形：不排序时 <span class=\"katex-inline\">\\{3,1\\}\\mid\\{2\\}<\/span> 与 <span class=\"katex-inline\">\\{2\\}\\mid\\{1,3\\}<\/span> 看起来不同，标准化后归为同一划分。枚举与计数前先完成标准化，否则重复计数。<\/p>\n<h2>集合划分与等价关系<\/h2>\n<p>书里提示集合划分对应等价关系：自反、对称、传递的二元关系，等价类即块；<span class=\"katex-inline\">j\\equiv k\\pmod{\\Pi}<\/span> 表示 <span class=\"katex-inline\">j,k<\/span> 属同一块。划分把集合分成等价类，块内等价、块间不等价。这一视角把分组结构接到关系代数概念上。<\/p>\n<h2>整数划分的非增约束作用<\/h2>\n<p>非增次序吸收因子排列：<span class=\"katex-inline\">3+1<\/span> 与 <span class=\"katex-inline\">1+3<\/span> 同一划分。生成时第一项不超过前一项，剩余部分递归拆分；若允许后项大于前项，同一分拆以多种次序重复出现，分拆数被放大。非增是计数去重的约定，不是额外限制。<\/p>\n<h2>小结：先分类再计数<\/h2>\n<p>拿到一个分组问题，先回答球是否可区分、桶是否可区分，再判断拆的是数还是集合；类别定下来再选公式与生成路线。跳过分类直接套计数公式，最容易把排列当子集、把集合划分当整数划分，两类对象的个数与生成方法都对不上。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">n=6<\/span> 的整数划分中以最大项 3 开头的全部条目，核对非增。\n<\/li><li>\n限制增长串 <span class=\"katex-inline\">0101<\/span> 对应怎样的集合划分？块内与块间怎样标准化书写？\n<\/li><li>\n为什么 <span class=\"katex-inline\">a_{j+1}<\/span> 不能超过 <span class=\"katex-inline\">1+\\max(a_1,\\dots,a_j)<\/span>？\n<\/li><li>\n组合与集合划分在&quot;剩余元素归属&quot;上差在哪里？\n<\/li><li>\n十二类方式定位前，必须先回答哪两个标记问题？\n<\/ol><\/div><\/details>", "c12": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.382<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">整数划分与集合划分：十二类方式与两类划分的差别<\/a><\/span><\/div><h1>树的生成：嵌套括号串与括号串算法 P<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（原书 §7.2.1.6，PDF 第 381–382 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p>树与森林是组合枚举里结构最复杂的一类对象：结点有父子、兄弟层次，直接列出所有树很难定序。书里用嵌套括号串把树拉平成线性序列：一对括号对应一个结点，嵌套对应子女，并列对应兄弟。生成合法括号串就等于生成对应森林；困难在于界定什么样的串合法，以及怎样按字典序逐个产出全部合法串而不漏不重。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>括号串<\/strong>：含 <span class=\"katex-inline\">n<\/span> 个左括号 &quot;(&quot; 与 <span class=\"katex-inline\">n<\/span> 个右括号 &quot;)&quot; 的串；第 <span class=\"katex-inline\">k<\/span> 个 &quot;(&quot; 与对应 &quot;)&quot; 配对。<\/p>\n<p><strong>合法条件<\/strong>：从左到右扫描，任一前缀中左括号数不少于右括号数；串末两者相等。<\/p>\n<p><strong>森林对应<\/strong>：&quot;(&quot; 见到结点左边，&quot;)&quot; 见到结点右边；嵌套括号是子女，并列括号是兄弟。串外围爬行可重建括号匹配与树结构。<\/p>\n<p><strong>森林与二叉树对应<\/strong>：按卷 1 §2.3.2 的自然对应，森林可换成二叉树表示——左链挂长子，右链挂兄弟。<\/p>\n<p><strong>括号串算法 P（字典序括号串）<\/strong>，整数 <span class=\"katex-inline\">n\\ge2<\/span>：<\/p>\n<ul><li>\n<strong>P1. 初始化<\/strong>：对 <span class=\"katex-inline\">1\\le k\\le n<\/span> 置 <span class=\"katex-inline\">a_{2k-1}=<\/span> &quot;(&quot;，<span class=\"katex-inline\">a_{2k}=<\/span> &quot;)&quot;；另置 <span class=\"katex-inline\">a_0=<\/span> &quot;)&quot;，<span class=\"katex-inline\">m\\leftarrow2n-1<\/span>。\n<\/li><li>\n<strong>P2. 访问<\/strong>：访问串 <span class=\"katex-inline\">a_1a_2\\dots a_{2n}<\/span>。\n<\/li><li>\n<strong>P3. 简单情形<\/strong>：若 <span class=\"katex-inline\">a_{m-1}=<\/span> &quot;(&quot;，置 <span class=\"katex-inline\">a_{m-1}=<\/span> &quot;)&quot;，<span class=\"katex-inline\">a_m\\leftarrow<\/span> &quot;(&quot;，<span class=\"katex-inline\">m\\leftarrow m-1<\/span>，返回 P2。\n<\/li><li>\n<strong>P4. 找置位 <span class=\"katex-inline\">j<\/span><\/strong>：置 <span class=\"katex-inline\">m\\leftarrow m-1<\/span>，<span class=\"katex-inline\">k\\leftarrow2n-1<\/span>；当 <span class=\"katex-inline\">a_j=<\/span> &quot;(&quot; 时 <span class=\"katex-inline\">a_j<\/span> 加 1、<span class=\"katex-inline\">a_k\\leftarrow<\/span> &quot;(&quot;，<span class=\"katex-inline\">j\\leftarrow j-1<\/span>，<span class=\"katex-inline\">k\\leftarrow k-2<\/span>。\n<\/li><li>\n<strong>P5. 追加<\/strong>：若 <span class=\"katex-inline\">j=0<\/span> 终止；否则置 <span class=\"katex-inline\">a_j=<\/span> &quot;(&quot;，<span class=\"katex-inline\">k\\leftarrow2n-1<\/span>，返回 P2。\n<\/ul>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">n=3<\/span> 的合法括号串含 <code>((()))<\/code>、<code>(()())<\/code>、<code>(())()<\/code>、<code>()(())<\/code>、<code>()()()<\/code>，对应 5 棵森林结构。<\/p>\n<p><strong>反例<\/strong>：前缀右括号多于左括号（如 <code>)()<\/code>）无法配对；左右括号数不等不是合法串。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>配对与结构<\/strong>：每个 &quot;(&quot; 开启一个结点，其后嵌套的括号串是其子女序列；同层并列的括号是兄弟。括号匹配唯一确定父子关系，串与森林一一对应。<\/p>\n<p><strong>合法性闸门<\/strong>：前缀计数非负保证不会出现先闭合尚未开始的结点；末位相等保证所有开启的结点都已闭合。两条约束排除悬空边与未闭合结点。<\/p>\n<p><strong>字典序生成<\/strong>：初始串 <code>()()...()<\/code> 方向的哨兵形式；P3 处理相邻可直接交换的简单情形，P4–P5 定位可改下标并重排后缀，沿字典序走到终止。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：生成 <span class=\"katex-inline\">n<\/span> 对括号对应的森林；结点未带额外标记。\n<\/li><li>\n失败案例 1：前缀计数为负。右括号先于匹配的左括号出现，还原出悬空闭合，树结构断裂。\n<\/li><li>\n失败案例 2：括号总数不等。<span class=\"katex-inline\">n<\/span> 对要求左右各 <span class=\"katex-inline\">n<\/span> 个；缺一个右括号则有结点未闭合。\n<\/li><li>\n边界：带标记结点、有序度受限的树另有计数与生成约束；括号串对应普通无序/有序森林的基础结构。串里不保存结点名字，还原后若需要区分结点，还要另挂编号或数据字段。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>括号串 vs 一般位串<\/strong>：n 元组位串任意 0/1 分布；括号串受前缀非负与总数相等双重约束，是合法 Dyck 型序列。\n<\/li><li>\n<strong>森林 vs 二叉树<\/strong>：森林是原结构；二叉树是经长子-兄弟转换的等价表示，两者一一对应但视图不同。\n<\/li><li>\n<strong>括号配对 vs 排列邻接交换<\/strong>：括号串生成沿字典序；c09 的邻接交换服务于排列，对象结构不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c11 集合划分给出集合的分组结构，树是带嵌套层次的分组；c10 位串表示是括号串的无约束版本。后继：树结构在后续卷目的搜索树、遍历、表达式求值中作为基础数据结构；括号匹配思想与栈式遍历直接相关。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（树的生成：嵌套括号串与括号串算法 P）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：括号合法性核验、森林还原与括号串算法 P 推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>树生成沿括号串路线，往回追四层：<\/p>\n<ol><li>\n树结构：结点有父子与兄弟层次，需要一种线性编码把层次关系记下来。\n<\/li><li>\n括号编码：一对括号对应一个结点，嵌套记子女，并列记兄弟。\n<\/li><li>\n合法性约束：前缀左括号数不少于右括号数，末尾两者相等。\n<\/li><li>\n生成路线：字典序括号串算法 P 从哨兵初始串出发，逐次产出全部合法串。\n<\/ol>\n<p>依赖链方向：树的层次 → 括号嵌套编码 → 前缀/总数约束 → 字典序枚举 → 串树互译。<\/p>\n<h2>正向推导：合法性两条约束的必要性<\/h2>\n<p>设串 <span class=\"katex-inline\">a_1\\dots a_{2n}<\/span>，扫描到第 <span class=\"katex-inline\">k<\/span> 位时记左括号数 <span class=\"katex-inline\">L_k<\/span>、右括号数 <span class=\"katex-inline\">R_k<\/span>。<\/p>\n<p><strong>前缀非负<\/strong>：<span class=\"katex-inline\">L_k-R_k\\ge0<\/span> 对所有 <span class=\"katex-inline\">k<\/span> 成立。右括号只能闭合此前已开启的结点；若某前缀 <span class=\"katex-inline\">R_k&gt;L_k<\/span>，出现一个没有对应左括号的右括号，还原时得到悬空闭合边。<\/p>\n<p><strong>末尾相等<\/strong>：<span class=\"katex-inline\">L_{2n}=R_{2n}=n<\/span>。所有开启的结点都必须闭合；左括号剩余意味着有结点未结束，右括号剩余意味着闭合了不存在的结点。<\/p>\n<p>两条合起来：串是合法括号串。满足约束的串与森林一一对应——这是 Dyck 型结构的基本对应。<\/p>\n<h2>数值算例：<span class=\"katex-inline\">n=3<\/span> 的五个合法串核验<\/h2>\n<p>逐个扫描前缀差值 <span class=\"katex-inline\">L-R<\/span>：<\/p>\n<ol><li>\n<code>((()))<\/code>：差值序列 <span class=\"katex-inline\">1,2,3,2,1,0<\/span>，全程非负，末尾 0。\n<\/li><li>\n<code>(()())<\/code>：<span class=\"katex-inline\">1,2,1,2,1,0<\/span>，非负。\n<\/li><li>\n<code>(())()<\/code>：<span class=\"katex-inline\">1,2,1,0,1,0<\/span>，非负。\n<\/li><li>\n<code>()(())<\/code>：<span class=\"katex-inline\">1,0,1,2,1,0<\/span>，非负。\n<\/li><li>\n<code>()()()<\/code>：<span class=\"katex-inline\">1,0,1,0,1,0<\/span>，非负。\n<\/ol>\n<p>不合法示例：<code>)()(<\/code> 首位差值 <span class=\"katex-inline\">-1<\/span>，前缀为负；<code>((()<\/code> 末尾 <span class=\"katex-inline\">L=3,R=1<\/span>，总数不等。<\/p>\n<p><strong>第二算例：串还原森林<\/strong>。取串 <code>(())()<\/code>：<\/p>\n<ol><li>\n第 1 位 &quot;(&quot; 开启结点 A；第 2 位 &quot;(&quot; 开启结点 B（A 的子女）。\n<\/li><li>\n第 3 位 &quot;)&quot; 闭合 B；第 4 位 &quot;)&quot; 闭合 A。\n<\/li><li>\n第 5 位 &quot;(&quot; 开启结点 C（A 的兄弟，森林第二棵根）；第 6 位 &quot;)&quot; 闭合 C。\n<\/ol>\n<p>森林：第一棵根 A 带子女 B；第二棵根 C。括号嵌套关系给出父子，同层并列给出兄弟。<\/p>\n<h2>延伸推演：森林到二叉树的转换方向<\/h2>\n<p>按长子-兄弟表示：每个结点左链挂第一个子女，右链挂下一个兄弟。森林的根之间也用右链相连。反向还原时，左链回长子，右链回下一兄弟（或下一棵根）。括号串先还原成森林，再走这一转换得到二叉树；两条表示保持一一对应，结点集合不变，只是链接方式改变。<\/p>\n<p>计数方向：<span class=\"katex-inline\">n=1<\/span> 一个串 <code>()<\/code>；<span class=\"katex-inline\">n=2<\/span> 两个串 <code>(())<\/code>、<code>()()<\/code>；<span class=\"katex-inline\">n=3<\/span> 五个。该计数序列即卡特兰数方向（此处为组合计数常识，未在本书页内逐字核对编号）。括号串个数随 <span class=\"katex-inline\">n<\/span> 增长快于线性，但仍远小于任意 <span class=\"katex-inline\">2n<\/span> 位位串总数 <span class=\"katex-inline\">2^{2n}<\/span>，合法性约束筛掉了大部分序列。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>前缀出现悬空右括号<\/strong>。串 <code>())(<\/code>：第 3 位右括号使差值降到 <span class=\"katex-inline\">-1<\/span>；此时前两个左括号已闭合，再来右括号没有可闭合的结点。还原树时该右括号找不到父结点，结构断裂。<\/p>\n<p><strong>括号总数不等<\/strong>。串 <code>(()<\/code> 只有两个左括号、一个右括号；末尾差值为 1，有结点停留在开启状态。生成算法必须保证每步左右计数同步，P1 初始化成对布置括号。<\/p>\n<p><strong>把并列当嵌套<\/strong>。<code>()()<\/code> 是两个兄弟根；若误读成一个根带两个子女，会把森林压成单棵树。区分依据：回到差值 0 的层位，该层并列的括号属于兄弟，未回零的嵌套属于子女。<\/p>\n<h2>对抗性追问：括号串为什么比直接列树容易生成<\/h2>\n<p>树的父子兄弟关系是二维层次结构；括号串压成一维序列后，合法性只留两个计数条件，枚举可按字典序在一维串上推进。生成器处理的是字符串的下标与字符，树结构由还原步骤事后重建。代价是：拿到串后还要走一遍配对扫描才能得到树，生成阶段不直接维护结点链接。<\/p>\n<h2><span class=\"katex-inline\">n=2<\/span> 与 <span class=\"katex-inline\">n=4<\/span> 的合法串方向<\/h2>\n<p><span class=\"katex-inline\">n=2<\/span>：<code>(())<\/code>、<code>()()<\/code>，两个串。<span class=\"katex-inline\">n=3<\/span>：五个串见前述。<span class=\"katex-inline\">n=4<\/span> 合法串个数沿卡特兰数方向增长到 14；任意 8 位串共 <span class=\"katex-inline\">2^8=256<\/span> 个，合法性约束筛掉绝大多数。列出 <span class=\"katex-inline\">n=4<\/span> 的部分串：<code>(((())))<\/code>、<code>((()()))<\/code>、<code>((())())<\/code>、<code>(()(()))<\/code>、<code>()((()))<\/code>，每个前缀差值非负、末尾回 0。<\/p>\n<h2>栈匹配过程<\/h2>\n<p>扫描串时维护一个计数栈：遇 &quot;(&quot; 压入一个开启标记，遇 &quot;)&quot; 弹出最近未闭合的 &quot;(&quot;。<\/p>\n<p>以 <code>(()())<\/code> 为例：<\/p>\n<ol><li>\n&quot;(&quot; 压栈，栈深 1。\n<\/li><li>\n&quot;(&quot; 压栈，栈深 2。\n<\/li><li>\n&quot;)&quot; 弹出内层 &quot;(&quot;，栈深 1。\n<\/li><li>\n&quot;(&quot; 压栈，栈深 2。\n<\/li><li>\n&quot;)&quot; 弹出，栈深 1。\n<\/li><li>\n&quot;)&quot; 弹出根 &quot;(&quot;，栈深 0。\n<\/ol>\n<p>栈空且串结束，匹配完成；中途栈空又遇 &quot;)&quot; 即前缀非法。栈的压弹次序直接给出括号配对关系。<\/p>\n<h2>森林到二叉树第二例<\/h2>\n<p>森林：根 A 带子女 B、C；根 D 独立。长子-兄弟转换：A 左链挂长子 B，B 右链挂兄弟 C；A 右链挂下一棵根 D。反向还原：沿左链找长子，沿右链找下一兄弟或下一根。结点集合不变，改变的只是链接指向。<\/p>\n<h2>串与树的互译边界<\/h2>\n<p>括号串保存嵌套与并列关系，不保存结点名与附加数据；还原森林后再挂编号、权重等字段。有序森林与无序森林的差别在括号串层面不直接体现，需要额外约定子女次序。生成算法 P 产出的是合法串全集，树结构由还原步骤事后得到，生成阶段不维护结点指针。<\/p>\n<h2>合法性两条约束的独立作用<\/h2>\n<p>前缀非负排除悬空右括号；末尾相等排除未闭合左括号。只查末尾相等不查前缀，会放过 <code>)(()<\/code> 这类前缀为负的串；只查前缀不查末尾，会放过 <code>((()<\/code> 这类左括号剩余的串。两条约束必须同时核验。<\/p>\n<h2>括号串合法性的手工核验流程<\/h2>\n<ol><li>\n数左右括号总数，必须各为 <span class=\"katex-inline\">n<\/span>。\n<\/li><li>\n从左到右扫，维护差值 <span class=\"katex-inline\">L-R<\/span>，每步核验非负。\n<\/li><li>\n末尾差值回到 0。\n<\/li><li>\n用栈压弹核对配对：遇 &quot;(&quot; 压，遇 &quot;)&quot; 弹最近 &quot;(&quot;，中途栈空遇 &quot;)&quot; 即非法。\n<\/ol>\n<p>四步全过才是合法串；任一不过，还原出的树有悬空边或未闭合结点。<\/p>\n<h2><span class=\"katex-inline\">n=3<\/span> 五串的森林对照<\/h2>\n<ul><li>\n<code>((()))<\/code>：一棵根带两层嵌套子女。\n<\/li><li>\n<code>(()())<\/code>：一根领两个并列子女。\n<\/li><li>\n<code>(())()<\/code>：第一棵根带一子女，第二棵独立根。\n<\/li><li>\n<code>()(())<\/code>：第一棵独立根，第二棵根带一子女。\n<\/li><li>\n<code>()()()<\/code>：三个并列独立根。\n<\/ul>\n<p>差值回到 0 的层位分出兄弟与森林分界；未回零的嵌套分出子女。<\/p>\n<h2>生成与还原的分工<\/h2>\n<p>算法 P 在一维串上按字典序产出合法括号串；树结构由事后配对扫描重建。生成阶段不维护结点指针，还原阶段才搭父子兄弟链接。需要结点名字或附加数据时，在还原后再挂字段，括号串本身不保存这些信息。<\/p>\n<h2>与卷 1 树概念的衔接<\/h2>\n<p>卷 1 讲二叉树定义与三序遍历；本卷括号串给出森林到二叉树的长子-兄弟转换入口。串还原森林，森林转二叉树，之后即可套用先序、中序、后序遍历。括号匹配栈与遍历栈是同一类后进先出结构的两种用途。<\/p>\n<h2>括号配对的栈深度含义<\/h2>\n<p>栈的最大深度对应该森林的嵌套层数；栈深 1 是并列根森林，栈深等于树高。串 <code>((()))<\/code> 栈深 3，<code>()()()<\/code> 栈深 1。还原树时栈深直接给出结点所在层级，可用于校验树高与括号嵌套是否一致。<\/p>\n<h2>合法串计数的增长方向<\/h2>\n<p><span class=\"katex-inline\">n=1<\/span> 一个，<span class=\"katex-inline\">n=2<\/span> 两个，<span class=\"katex-inline\">n=3<\/span> 五个，<span class=\"katex-inline\">n=4<\/span> 十四个，序列沿卡特兰数方向增长；相比任意 <span class=\"katex-inline\">2n<\/span> 位位串总数 <span class=\"katex-inline\">2^{2n}<\/span>，合法串占比随 <span class=\"katex-inline\">n<\/span> 迅速下降。生成算法只遍历合法串，不逐个测试全部位串再筛非法项。<\/p>\n<h2>森林、二叉树与遍历的衔接<\/h2>\n<p>括号串先还原森林，长子-兄弟转换得到二叉树；之后可套用卷 1 的先序、中序、后序遍历。括号匹配栈与遍历栈同属后进先出结构：前者配对括号，后者回溯结点。读到一段括号串时，先定森林结构，再谈遍历次序。<\/p>\n<h2>括号串与表达式树的联系<\/h2>\n<p>算术表达式的运算数与运算符也可用括号结构表示；本卷括号串先对应森林结点，运算符挂在结点上即得到表达式树。栈扫描括号的过程与表达式求值的栈处理同构：遇开括号进栈，遇闭括号退栈汇总。学习时可把树生成与表达式求值的栈机制对照起来看。<\/p>\n<h2>生成边界补充<\/h2>\n<p>括号串算法 P 产出 <span class=\"katex-inline\">n<\/span> 对括号的全部合法串；结点带标记、子女有序度受限、指定树高或指定度数等约束，需要在合法串基础上再加筛选条件。基础路线先覆盖无约束森林，约束枚举在其上叠加过滤或专用生成规则。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <code>(()())<\/code> 每一位的前缀差值，核验全程非负、末尾为 0。\n<\/li><li>\n串 <code>()(())<\/code> 还原出怎样的森林？哪些是兄弟，哪些是子女？\n<\/li><li>\n前缀非负与末尾相等两条约束各排除什么错误？\n<\/li><li>\n长子-兄弟转换中，左链、右链分别挂什么？\n<\/li><li>\n为什么 <code>()()<\/code> 不能读成一个根带两个子女？层位差值在哪一步回到 0？\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：0 与 1：布尔代数、布尔函数与求值网络<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1）<\/a><br>检查点：能写出与/或/非与德摩根定律，按真值表读出一个两变量函数属于哪种运算，说明函数链怎样一步步算出目标函数<\/li><li class='path-step' id='path-02'><strong>步骤 02：位操作与决策结构：按位运算、BDD 及其规模<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 7 章 7.1.3–7.1.4：按位运算的技巧与方法、二元决策图<\/a><br>检查点：能解释包含关系 x⊆y 的三种等价写法，说清 BDD 有序与规约两条约束，判断变量序对 BDD 规模的影响方向<\/li><li class='path-step' id='path-03'><strong>步骤 03：枚举元组与排列：格雷码、字典序与邻接交换<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 7 章 7.2.1.1–7.2.1.2：生成所有 n 元组与所有排列<\/a><br>检查点：能从递归规则画出 3 位格雷码序列，手算 Algorithm L 对给定排列的下一个排列，写出逆序序列并说明 Algorithm P 怎样只交换相邻两项<\/li><li class='path-step' id='path-04'><strong>步骤 04：生成其余组合对象：组合、划分、集合划分与树<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 7 章 7.2.1.3–7.2.1.6：生成组合、划分、集合划分与树<\/a><br>检查点：能在元素表与位串两种表示间转换一个组合，区分整数划分与集合划分，把一个括号串还原成森林并说出对应算法<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='布尔代数（boolean algebra）'>布尔代数（Boolean algebra） — 在值 0 与 1 上定义与、或、非三种基本运算的代数结构；满足交换律、结合律、分配律、吸收律与德摩根律等基本定律 <span class=glossary-ref>（第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1））<\/span><\/li><li data-term='布尔函数 $f(x_1,\\dots,x_n)$'>布尔函数 $f(x_1,\\dots,x_n)$ — 把 $n$ 个二进制输入映射到 0 或 1 的函数；每个输入赋值对应真值表一行，$n$ 变量函数共有 $2^{2^n}$ 个不同函数 <span class=glossary-ref>（第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1））<\/span><\/li><li data-term='真值表（truth table）'>真值表（truth table） — 列出全部 $2^n$ 个输入取值及其函数值的表；两变量函数共有 16 种，每种由真值表中 0、1 的四元序列标识 <span class=glossary-ref>（第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1））<\/span><\/li><li data-term='函数链（chain of functions）'>函数链（chain of functions） — 求值布尔网络的表示：新增结点 $x_i=x_j\\circ x_k$，其中 $j,k&lt;i$，$\\circ$ 为一种二元布尔运算；沿链逐步算出目标函数 <span class=glossary-ref>（第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1））<\/span><\/li><li data-term='按位运算（bitwise operation）'>按位运算（bitwise operation） — 对二进制整数按位施加的与 $x\\&amp;y$、或 $x\\mid y$、异或 $x\\oplus y$ 与非运算；每一位独立参与同一运算 <span class=glossary-ref>（第 7 章 7.1.3–7.1.4：按位运算的技巧与方法、二元决策图）<\/span><\/li><li data-term='包含关系 $x\\subseteq y$'>包含关系 $x\\subseteq y$ — 当且仅当 $x$ 的每个 1 位都在 $y$ 中为 1；等价写法 $x\\&amp;y=x$、$x\\mid y=y$、$x\\&amp;\\bar y=0$ <span class=glossary-ref>（第 7 章 7.1.3–7.1.4：按位运算的技巧与方法、二元决策图）<\/span><\/li><li data-term='二元决策图（bdd）'>二元决策图（BDD） — 表示布尔函数的有向无环图：每个非汇结点带变量 $V$ 与 LO、HI 两条分支，LO 对应变量取 0，HI 对应取 1；要求有序且已规约，共享相同子树 <span class=glossary-ref>（第 7 章 7.1.3–7.1.4：按位运算的技巧与方法、二元决策图）<\/span><\/li><li data-term='格雷码（gray code）'>格雷码（Gray code） — 把 $2^n$ 个 $n$ 位串排成一圈或一列，相邻两个码只差一位；递归构造 $\\Gamma_0=\\epsilon$，$\\Gamma_{n+1}=0\\Gamma_n,\\ 1\\Gamma_n^{R}$ <span class=glossary-ref>（第 7 章 7.2.1.1–7.2.1.2：生成所有 n 元组与所有排列）<\/span><\/li><li data-term='字典序（lexicographic order）'>字典序（lexicographic order） — 类比词典逐位比较大小的排列次序；算法 L 从最小排列 $a_1\\le\\cdots\\le a_n$ 出发，依次生成下一个字典序排列 <span class=glossary-ref>（第 7 章 7.2.1.1–7.2.1.2：生成所有 n 元组与所有排列）<\/span><\/li><li data-term='逆序序列（inversion sequence）'>逆序序列（inversion sequence） — 排列的辅助计数 $c_j$，其中 $c_j$ 是比 $j$ 小且处在 $j$ 右边的元素数目，约定 $0\\le c_j&lt;j$；遍历所有合法逆序序列即可生成全部排列 <span class=glossary-ref>（第 7 章 7.2.1.1–7.2.1.2：生成所有 n 元组与所有排列）<\/span><\/li><li data-term='$(s,t)$ 组合（combination）'>$(s,t)$ 组合（combination） — 从 $n=s+t$ 个对象中选 $t$ 个组成的无序子集；可写成递减元素表 $c_t&gt;\\cdots&gt;c_1$，或写成恰含 $t$ 个 1 的二进制位串 <span class=glossary-ref>（第 7 章 7.2.1.3–7.2.1.6：生成组合、划分、集合划分与树）<\/span><\/li><li data-term='整数划分（partition）'>整数划分（partition） — 把一个正整数 $n$ 写成一组非增正整数之和 $n=a_1+\\cdots+a_m$，不考虑次序；与集合划分是两类不同对象 <span class=glossary-ref>（第 7 章 7.2.1.3–7.2.1.6：生成组合、划分、集合划分与树）<\/span><\/li><li data-term='集合划分（set partition）'>集合划分（set partition） — 把一个集合划分为若干互不相交的非空子集合（块）；块内元素可排序，块间按最小元素递增排序以便标准化表示 <span class=glossary-ref>（第 7 章 7.2.1.3–7.2.1.6：生成组合、划分、集合划分与树）<\/span><\/li><li data-term='括号串（parenthesis string）'>括号串（parenthesis string） — 由 $n$ 个左括号与 $n$ 个右括号组成、前缀计数始终非负的串；与森林一一对应，沿串外围爬行即可重建括号匹配与树结构 <span class=glossary-ref>（第 7 章 7.2.1.3–7.2.1.6：生成组合、划分、集合划分与树）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：布尔表达式先核对取值表，再套定律<\/h2>\n<p>拿到一个布尔式子，先把变量取值逐行列出，确认每步运算用的是与、或、非还是异或；再决定改写方向。与或的吸收、分配可双向使用，异或不满足吸收，不能套取大取小格结构的化简规则。化简前后各取两行典型赋值核验，防止定律误用把式子改错。<\/p>\n<h2>模式 2：判断子集关系走三种按位等式互证<\/h2>\n<p>判断位集合 <span class=\"katex-inline\">x<\/span> 是否包含于 <span class=\"katex-inline\">y<\/span>，不要凭数值大小猜。依次核验 <span class=\"katex-inline\">x\\&amp;y=x<\/span>、<span class=\"katex-inline\">x\\mid y=y<\/span>、<span class=\"katex-inline\">x\\&amp;\\bar y=0<\/span>；三式等价，任一不成立即不包含。位集合子集与整数大小是两条独立规则，报告结论时写明用的是哪一种。<\/p>\n<h2>模式 3：建 BDD 先定变量序，再展开、合并、消冗余<\/h2>\n<p>构造有序规约 BDD 的顺序：固定变量次序 → 逐变量展开分支 → 合并三元值相同的子树 → 消去 LO=HI 的冗余结点。次序未定就展开，后面共享关系无从判断；只展开不合并，结点数退回决策树规模。规模异常膨胀时先回头检查变量序是否把耦合变量拆散。<\/p>\n<h2>模式 4：枚举对象先定计数口径，再选生成次序<\/h2>\n<p>枚举前先回答：对象总数是多少（<span class=\"katex-inline\">2^n<\/span>、<span class=\"katex-inline\">n!<\/span>、<span class=\"katex-inline\">\\binom nt<\/span>、划分数列），要求全覆盖还是低改动。全覆盖可走字典序；相邻切换代价高再考虑格雷码、邻接交换、旋转门一类低改动次序。计数口径与生成次序分开选，不要用低改动路线的产物顺序代替大小全序。<\/p>\n<h2>模式 5：字典序生成沿&quot;支点—交换—后缀重排&quot;三步<\/h2>\n<p>下一个字典序对象的通用构造：从右往左找最右可增大的支点；在后缀中找最小可换元素交换；把后缀重排成最小次序。排列反序后缀，组合重设左侧元素为最小紧邻值。支点找错方向会漏排，后缀不重排会次序偏大，两步都要核。<\/p>\n<h2>模式 6：低改动枚举靠辅助计数驱动，产物与状态分开存<\/h2>\n<p>邻接交换、格雷码这类路线用辅助状态（逆序序列、方向位、递归层级）控制每次改动；输出对象是排列或位串，辅助计数不进入产物。写实现时把状态字段与输出字段分开，遍历合法状态空间即覆盖全部对象；状态范围边界（如 <span class=\"katex-inline\">0\\le c_j&lt;j<\/span>）必须严格，越界状态无对应对象。<\/p>\n<h2>模式 7：分组问题先分球桶标记，再判拆数还是拆集合<\/h2>\n<p>遇到&quot;划分/分组&quot;先问：被分对象可否区分（球标记），接收位置可否区分（桶标记）；再判断拆的是整数还是集合。标记条件决定对象是排列、子集还是划分；拆数走非增数列，拆集合走块归属。分类未定前不套计数公式，避免两类划分混算。<\/p>\n<h2>模式 8：树结构先压成括号串，还原时按栈配对<\/h2>\n<p>树与森林枚举先转成括号串：一对括号一个结点，嵌套记子女，并列记兄弟。合法性两道闸：前缀左括号不少于右括号，末尾两者相等；栈扫描遇 &quot;(&quot; 压、遇 &quot;)&quot; 弹。串还原森林后再做长子-兄弟二叉树转换与遍历，生成阶段不维护结点指针。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 布尔代数与求值<\/strong>：0/1 两值逻辑、与或非定律、真值表与 DNF/CNF、函数链求值（PDF 第 53、55、93 页起；印刷页 = PDF 页 − 15）。\n<\/li><li>\n<strong>第 2 章 位运算与 BDD<\/strong>：按位与/或/异或、包含关系、二元决策图有序规约、规模与变量序、沿图计数采样（PDF 第 125、184、188 页起）。\n<\/li><li>\n<strong>第 3 章 元组与排列<\/strong>：n 元组 <span class=\"katex-inline\">2^n<\/span> 个、格雷码递归与 <span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span>、字典序 Algorithm L、邻接交换 Algorithm P 与逆序序列（PDF 第 249、251、281、283 页起）。\n<\/li><li>\n<strong>第 4 章 组合、划分与树<\/strong>：组合双表示、算法 L/T、整数划分与集合划分、十二类方式、括号串与森林、括号算法 P（PDF 第 309、312、339、360、382 页起）。\n<\/ul>\n<h2>布尔运算速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>运算<\/th><th>记号<\/th><th>取值规则<\/th><th>主要性质<\/th><\/tr><\/thead><tbody><tr><td>与<\/td><td><span class=\"katex-inline\">x\\wedge y<\/span> / <span class=\"katex-inline\">x\\&amp;y<\/span><\/td><td>两者皆 1 为 1<\/td><td>交换、结合、幂等、吸收<\/td><\/tr><tr><td>或<\/td><td><span class=\"katex-inline\">x\\vee y<\/span> / <span class=\"katex-inline\">x\\mid y<\/span><\/td><td>任一为 1 为 1<\/td><td>交换、结合、幂等、吸收<\/td><\/tr><tr><td>异或<\/td><td><span class=\"katex-inline\">x\\oplus y<\/span><\/td><td>两位不同为 1<\/td><td>交换、结合、<span class=\"katex-inline\">x\\oplus x=0<\/span><\/td><\/tr><tr><td>非<\/td><td><span class=\"katex-inline\">\\neg x<\/span><\/td><td>0/1 互换<\/td><td>德摩根律<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>包含关系三等价<\/h2>\n<p><span class=\"katex-inline\">x\\subseteq y\\iff x\\&amp;y=x\\iff x\\mid y=y\\iff x\\&amp;\\bar y=0<\/span>。<\/p>\n<h2>枚举对象计数<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>对象<\/th><th>计数<\/th><th>表示入口<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">n<\/span> 位 n 元组<\/td><td><span class=\"katex-inline\">2^n<\/span><\/td><td>位串<\/td><\/tr><tr><td><span class=\"katex-inline\">n<\/span> 元排列<\/td><td><span class=\"katex-inline\">n!<\/span><\/td><td>字典序 / 邻接交换<\/td><\/tr><tr><td><span class=\"katex-inline\">(s,t)<\/span> 组合<\/td><td><span class=\"katex-inline\">\\binom{n}{t}<\/span>，<span class=\"katex-inline\">n=s+t<\/span><\/td><td>递减元素表 / <span class=\"katex-inline\">t<\/span> 个 1 的位串<\/td><\/tr><tr><td>集合划分<\/td><td>第二类斯特林数方向求和<\/td><td>限制增长串<\/td><\/tr><tr><td>合法括号串<\/td><td>卡特兰数方向<\/td><td>括号串 ↔ 森林<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>排列算法 L 四步<\/h2>\n<ol><li>\nL2 找最右 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span> 的支点 <span class=\"katex-inline\">j<\/span>；找不到终止。\n<\/li><li>\nL3 找后缀中大于 <span class=\"katex-inline\">a_j<\/span> 的最右元素 <span class=\"katex-inline\">l<\/span>，交换。\n<\/li><li>\nL4 反序后缀 <span class=\"katex-inline\">a_{j+1}\\dots a_n<\/span>。\n<\/li><li>\n返回访问。\n<\/ol>\n<h2>格雷码递归<\/h2>\n<p><span class=\"katex-inline\">\\Gamma_0=\\epsilon<\/span>；<span class=\"katex-inline\">\\Gamma_{n+1}=0\\Gamma_n,\\ 1\\Gamma_n^{R}<\/span>；<span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span>；相邻码只差一位。<\/p>\n<h2>两类划分对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th><\/th><th>整数划分<\/th><th>集合划分<\/th><\/tr><\/thead><tbody><tr><td>对象<\/td><td>数值<\/td><td>集合成员<\/td><\/tr><tr><td>表示<\/td><td>非增整数和<\/td><td>不相交非空块<\/td><\/tr><tr><td>去重约定<\/td><td>因子非增<\/td><td>块内递增、块间按最小元递增<\/td><\/tr><tr><td>编码<\/td><td>划分数列<\/td><td>限制增长串 <span class=\"katex-inline\">a_{j+1}\\le1+\\max<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>括号合法性<\/h2>\n<p>前缀 <span class=\"katex-inline\">L-R\\ge0<\/span>；末尾 <span class=\"katex-inline\">L=R=n<\/span>；栈遇 &quot;(&quot; 压、遇 &quot;)&quot; 弹，中途栈空遇 &quot;)&quot; 即非法。<\/p>"}};

    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}
