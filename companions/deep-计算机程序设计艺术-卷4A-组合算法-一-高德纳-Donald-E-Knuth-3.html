.prereq-hard .prereq-tag{background:var(--bad);color:#fff}

.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}

.quiz-opts label{display:block;padding:4px 0;cursor:pointer}

y": "高难", "source": {"file": "计算机程序设计艺术 卷4A：组合算法（一）.pdf", "page": 281}, "prerequisites": ["c07"], "depthFragment": "concepts/c08-depth.md"}, {"id": "c09", "title": "邻接交换排列（Algorithm P）：逆序序列与平滑改变", "file": "concepts/c09.md", "chapterIds": ["ch03"], "difficulty": "高难", "source": {"file": "计算机程序设计艺术 卷4A：组合算法（一）.pdf", "page": 282}, "prerequisites": ["c08"], "depthFragment": "concepts/c09-depth.md"}, {"id": "c10", "title": "组合生成：位串与元素表双表示、字典序算法 L 与 T", "file": "concepts/c10.md", "chapterIds": ["ch04"], "difficulty": "进阶", "source": {"file": "计算机程序设计艺术 卷4A：组合算法（一）.pdf", "page": 312}, "prerequisites": ["c08"], "depthFragment": "concepts/c10-depth.md"}, {"id": "c11", "title": "整数划分与集合划分：十二类方式与两类划分的差别", "file": "concepts/c11.md", "chapterIds": ["ch04"], "difficulty": "进阶", "source": {"file": "计算机程序设计艺术 卷4A：组合算法（一）.pdf", "page": 339}, "prerequisites": ["c10"], "depthFragment": "concepts/c11-depth.md"}, {"id": "c12", "title": "树的生成：嵌套括号串与括号串算法 P", "file": "concepts/c12.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "计算机程序设计艺术 卷4A：组合算法（一）.pdf", "page": 382}, "prerequisites": ["c11"], "depthFragment": "concepts/c12-depth.md"}], "glossary": [{"term": "布尔代数（Boolean algebra）", "def": "在值 0 与 1 上定义与、或、非三种基本运算的代数结构；满足交换律、结合律、分配律、吸收律与德摩根律等基本定律", "chapterId": "ch01"}, {"term": "布尔函数 $f(x_1,\\dots,x_n)$", "def": "把 $n$ 个二进制输入映射到 0 或 1 的函数；每个输入赋值对应真值表一行，$n$ 变量函数共有 $2^{2^n}$ 个不同函数", "chapterId": "ch01"}, {"term": "真值表（truth table）", "def": "列出全部 $2^n$ 个输入取值及其函数值的表；两变量函数共有 16 种，每种由真值表中 0、1 的四元序列标识", "chapterId": "ch01"}, {"term": "函数链（chain of functions）", "def": "求值布尔网络的表示：新增结点 $x_i=x_j\\circ x_k$，其中 $j,k<i$，$\\circ$ 为一种二元布尔运算；沿链逐步算出目标函数", "chapterId": "ch01"}, {"term": "按位运算（bitwise operation）", "def": "对二进制整数按位施加的与 $x\\&y$、或 $x\\mid y$、异或 $x\\oplus y$ 与非运算；每一位独立参与同一运算", "chapterId": "ch02"}, {"term": "包含关系 $x\\subseteq y$", "def": "当且仅当 $x$ 的每个 1 位都在 $y$ 中为 1；等价写法 $x\\&y=x$、$x\\mid y=y$、$x\\&\\bar y=0$", "chapterId": "ch02"}, {"term": "二元决策图（BDD）", "def": "表示布尔函数的有向无环图：每个非汇结点带变量 $V$ 与 LO、HI 两条分支，LO 对应变量取 0，HI 对应取 1；要求有序且已规约，共享相同子树", "chapterId": "ch02"}, {"term": "格雷码（Gray code）", "def": "把 $2^n$ 个 $n$ 位串排成一圈或一列，相邻两个码只差一位；递归构造 $\\Gamma_0=\\epsilon$，$\\Gamma_{n+1}=0\\Gamma_n,\\ 1\\Gamma_n^{R}$", "chapterId": "ch03"}, {"term": "字典序（lexicographic order）", "def": "类比词典逐位比较大小的排列次序；算法 L 从最小排列 $a_1\\le\\cdots\\le a_n$ 出发，依次生成下一个字典序排列", "chapterId": "ch03"}, {"term": "逆序序列（inversion sequence）", "def": "排列的辅助计数 $c_j$，其中 $c_j$ 是比 $j$ 小且处在 $j$ 右边的元素数目，约定 $0\\le c_j<j$；遍历所有合法逆序序列即可生成全部排列", "chapterId": "ch03"}, {"term": "$(s,t)$ 组合（combination）", "def": "从 $n=s+t$ 个对象中选 $t$ 个组成的无序子集；可写成递减元素表 $c_t>\\cdots>c_1$，或写成恰含 $t$ 个 1 的二进制位串", "chapterId": "ch04"}, {"term": "整数划分（partition）", "def": "把一个正整数 $n$ 写成一组非增正整数之和 $n=a_1+\\cdots+a_m$，不考虑次序；与集合划分是两类不同对象", "chapterId": "ch04"}, {"term": "集合划分（set partition）", "def": "把一个集合划分为若干互不相交的非空子集合（块）；块内元素可排序，块间按最小元素递增排序以便标准化表示", "chapterId": "ch04"}, {"term": "括号串（parenthesis string）", "def": "由 $n$ 个左括号与 $n$ 个右括号组成、前缀计数始终非负的串；与森林一一对应，沿串外围爬行即可重建括号匹配与树结构", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [], "flashcards": []}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.53<\/div><h1>第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1）<\/h1>\n<blockquote>对应原书第 7 章 §7.1.1「布尔代数基础」、§7.1.2「布尔函数求值」（PDF 第 53–92 页；印刷页 = PDF 页 − 15）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出与、或、非三种基本运算在 0/1 上的取值规则，列出交换律、结合律、分配律、吸收律与德摩根律；\n<\/li><li>\n对两个变量的 16 种布尔函数，按真值表读出它属于哪种运算；\n<\/li><li>\n把一个给定真值表写成析取范式（最小项之和）与合取范式（最大项之积）；\n<\/li><li>\n读懂一条布尔函数链：每一步新增结点由两个旧结点经一种运算得到，逐步算出目标函数；\n<\/li><li>\n估算 <span class=\"katex-inline\">n<\/span> 变量布尔函数的总数，说明为什么函数个数随 <span class=\"katex-inline\">2^n<\/span> 指数膨胀。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>组合算法先处理最底层的离散对象：只有 0 和 1 两种状态。布尔代数给出在这两个值上做&quot;逻辑组合&quot;的一整套定律；布尔函数把 <span class=\"katex-inline\">n<\/span> 位输入映射成一位输出，真值表是它的完整说明；求值网络则规定怎样用一串中间运算把函数算出来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：两值逻辑与布尔代数基本定律（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。§7.1.1 从两个二进制位 <span class=\"katex-inline\">x,y<\/span> 出发：16 种可能的函数 <span class=\"katex-inline\">f(x,y)<\/span> 把 0/1 对映射成第三个 0/1 值（PDF 第 53 页）。常用运算取与 <span class=\"katex-inline\">\\wedge<\/span>、或 <span class=\"katex-inline\">\\vee<\/span>、非 <span class=\"katex-inline\">\\neg<\/span>。威廉·杰文斯《Pure Logic》(1864) 扩充布尔演算，给出与对或方向的分配 <span class=\"katex-inline\">(x\\vee y)\\wedge z=(x\\wedge z)\\vee(y\\wedge z)<\/span>；对偶方向 <span class=\"katex-inline\">(x\\wedge y)\\vee z=(x\\vee z)\\wedge(y\\vee z)<\/span> 由查尔斯·皮尔斯 (1867) 引入。与普通算术不同，布尔代数里同时存在两个分配律：<span class=\"katex-inline\">\\wedge<\/span> 对 <span class=\"katex-inline\">\\vee<\/span> 分配，<span class=\"katex-inline\">\\vee<\/span> 对 <span class=\"katex-inline\">\\wedge<\/span> 也分配；此外还有吸收律与德摩根律。<\/p>\n<h3>2. 概念 2：布尔函数、真值表与两种标准形式（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。一个 <span class=\"katex-inline\">n<\/span> 变量布尔函数对应一张表：<span class=\"katex-inline\">2^n<\/span> 个输入赋值各占一行，函数值列决定函数本身。函数值为 1 的那些行对应最小项，把最小项取或即得析取范式；函数值为 0 的行对应最大项，取与即得合取范式。两变量情形共有 <span class=\"katex-inline\">2^{2^2}=16<\/span> 个不同函数，表 1 逐一列出名称与新旧记号（PDF 第 54 页）。<\/p>\n<h3>3. 概念 3：求值网络、函数链与函数计数（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。§7.1.2 把求值过程描述成一条链：先有 <span class=\"katex-inline\">x_1,\\dots,x_n<\/span>，再逐步补充 <span class=\"katex-inline\">(x_{n+1},\\dots,x_{n+r})<\/span>，每个新结点 <span class=\"katex-inline\">x_i=x_j\\circ x_k<\/span>，其中 <span class=\"katex-inline\">j,k&lt;i<\/span>，<span class=\"katex-inline\">\\circ<\/span> 是 §7.1.1 的 16 种运算之一（PDF 第 93 页）。多路复用器函数在输入 <span class=\"katex-inline\">x_j<\/span> 为 1 时取 <span class=\"katex-inline\">x_k<\/span>，为 0 时取另一路；链的长度与每步选用的运算类型，决定求值网络的规模代价。<\/p>\n<h2>推导一（证明）：德摩根律怎样从真值表核验<\/h2>\n<p>下面证明分四种赋值逐项核验，每种代入两侧取值。 要证 <span class=\"katex-inline\">\\neg(x\\wedge y)=\\neg x\\vee\\neg y<\/span>，把 <span class=\"katex-inline\">x,y<\/span> 的四种赋值逐一代入两侧。<\/p>\n<ol><li>\n<span class=\"katex-inline\">x=0,y=0<\/span>：左侧 <span class=\"katex-inline\">\\neg(0\\wedge0)=\\neg0=1<\/span>；右侧 <span class=\"katex-inline\">\\neg0\\vee\\neg0=1\\vee1=1<\/span>，两侧相等。\n<\/li><li>\n<span class=\"katex-inline\">x=0,y=1<\/span>：左侧 <span class=\"katex-inline\">\\neg(0\\wedge1)=\\neg0=1<\/span>；右侧 <span class=\"katex-inline\">\\neg0\\vee\\neg1=1\\vee0=1<\/span>，两侧相等。\n<\/li><li>\n<span class=\"katex-inline\">x=1,y=0<\/span>：左侧 <span class=\"katex-inline\">\\neg(1\\wedge0)=\\neg0=1<\/span>；右侧 <span class=\"katex-inline\">\\neg1\\vee\\neg0=0\\vee1=1<\/span>，两侧相等。\n<\/li><li>\n<span class=\"katex-inline\">x=1,y=1<\/span>：左侧 <span class=\"katex-inline\">\\neg(1\\wedge1)=\\neg1=0<\/span>；右侧 <span class=\"katex-inline\">\\neg1\\vee\\neg1=0\\vee0=0<\/span>，两侧相等。\n<\/ol>\n<p>四种赋值覆盖全部输入，两侧每行取值相同，等式成立。另一条 <span class=\"katex-inline\">\\neg(x\\vee y)=\\neg x\\wedge\\neg y<\/span> 用同样方式核验。这条定律的用途：把一层取反整体翻进括号时，与、或互换，每个变量取反。<\/p>\n<h2>推导二（推演）：一条三变量函数链的手算<\/h2>\n<p>参照 §7.1.2 的链结构。输入记 <span class=\"katex-inline\">x_1,x_2,x_3<\/span>，构造两条链计算多路复用器方向的函数：<\/p>\n<pre><code>x4 = x1 ∧ x2\nx5 = x1 ∧ x3\nx6 = x4 ∨ x5<\/code><\/pre>\n<p>这次推演按结点编号顺序逐步展开。逐结点算：<\/p>\n<ol><li>\n<span class=\"katex-inline\">x_4=x_1\\wedge x_2<\/span>：只有 <span class=\"katex-inline\">x_1=x_2=1<\/span> 时为 1，否则为 0。\n<\/li><li>\n<span class=\"katex-inline\">x_5=x_1\\wedge x_3<\/span>：只有 <span class=\"katex-inline\">x_1=x_3=1<\/span> 时为 1，否则为 0。\n<\/li><li>\n<span class=\"katex-inline\">x_6=x_4\\vee x_5<\/span>：<span class=\"katex-inline\">x_4<\/span>、<span class=\"katex-inline\">x_5<\/span> 任一为 1 即为 1。\n<\/ol>\n<p>取赋值 <span class=\"katex-inline\">x_1=1,x_2=0,x_3=1<\/span>：<span class=\"katex-inline\">x_4=1\\wedge0=0<\/span>，<span class=\"katex-inline\">x_5=1\\wedge1=1<\/span>，<span class=\"katex-inline\">x_6=0\\vee1=1<\/span>。链上每个新结点只引用更早编号的旧结点，编号顺序保证求值时被引用者已经算出。<\/p>\n<h2>反事实：改掉前提会怎样<\/h2>\n<ul><li>\n<strong>去掉第二个分配律<\/strong>：普通算术里只有乘法对加法分配，加法不对乘法分配。若把这套直觉带进布尔代数，会漏掉 <span class=\"katex-inline\">\\vee<\/span> 对 <span class=\"katex-inline\">\\wedge<\/span> 的分配；化简含或项与与项交错的表达式时，该展开的地方展不开，范式转换就会卡住。两条分配律同时成立是布尔代数区别于环域运算的关键。\n<\/li><li>\n<strong>允许链结点引用未来结点<\/strong>：若规定 <span class=\"katex-inline\">x_i=x_j\\circ x_k<\/span> 时允许 <span class=\"katex-inline\">j<\/span> 或 <span class=\"katex-inline\">k<\/span> 大于 <span class=\"katex-inline\">i<\/span>，求值顺序就成了循环依赖——算 <span class=\"katex-inline\">x_i<\/span> 要先有 <span class=\"katex-inline\">x_j<\/span>，算 <span class=\"katex-inline\">x_j<\/span> 又回到 <span class=\"katex-inline\">x_i<\/span>，网络不再是有向无环结构，手算与机器求值都无法定序。§7.1.2 用 <span class=\"katex-inline\">j,k&lt;i<\/span> 这条编号约束把依赖方向钉死。\n<\/li><li>\n<strong>用一张未填全的真值表定义函数<\/strong>：只标出两三个赋值的输出就声称函数已确定，其余行被默认成任意值；不同补法会得到不同函数，化简出来的范式也不同。真值表必须覆盖全部 <span class=\"katex-inline\">2^n<\/span> 行才算定义完整。\n<\/ul>\n<h2>与后续章节的衔接<\/h2>\n<p>本章把&quot;一位逻辑值&quot;的表示与运算讲清，是 §7.1.3 按位运算（把位规则并行施加到整串位上）和 §7.1.4 二元决策图（沿变量分支表示同一函数）的地基。求值链的&quot;逐步生成新结点&quot;思路，与第 7.2 节组合对象逐个生成的结构相通：都是在已有对象上按规则补充新对象。<\/p>", "kind": "chapter", "title": "第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1）"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.124<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1）<\/a><\/span><\/div><h1>第 7 章 7.1.3–7.1.4：按位运算的技巧与方法、二元决策图<\/h1>\n<blockquote>对应原书第 7 章 §7.1.3「按位运算的技巧与方法」、§7.1.4「二元决策图」（PDF 第 124–233 页；印刷页 = PDF 页 − 15）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01 布尔代数与布尔函数\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 <span class=\"katex-inline\">x\\&amp;y<\/span>、<span class=\"katex-inline\">x\\mid y<\/span>、<span class=\"katex-inline\">x\\oplus y<\/span> 在二进制逐位上的取值规则，说明三条基本运算各自继承的布尔定律；\n<\/li><li>\n用三种等价写法判断 <span class=\"katex-inline\">x\\subseteq y<\/span>（<span class=\"katex-inline\">x\\&amp;y=x<\/span>、<span class=\"katex-inline\">x\\mid y=y<\/span>、<span class=\"katex-inline\">x\\&amp;\\bar y=0<\/span>）；\n<\/li><li>\n描述一个 BDD 结点的三个字段（变量 <span class=\"katex-inline\">V<\/span>、LO、HI），说清有序与规约两条约束；\n<\/li><li>\n沿 BDD 一条路径读出对应赋值下的函数值；\n<\/li><li>\n解释变量序怎样影响 BDD 规模，理解同一个函数在好序下紧凑、坏序下膨胀。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>按位运算把布尔规则一次施加到一整串位上，是组合算法里筛选集合、提取标志位的基础工具；二元决策图则把布尔函数画成一张共享子树的有向无环图，沿分支取值即可求值，图的规模直接决定这种表示能不能用。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 4：按位运算与包含关系（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。§7.1.3 从整数的二进制记法定义逐位运算：<span class=\"katex-inline\">x\\&amp;y=z<\/span> 等价于每位 <span class=\"katex-inline\">x_k\\wedge y_k=z_k<\/span>，或、异或按相同方式（PDF 第 125 页）。与、或在每位上保持幂等、交换、结合、吸收；异或每位独立，继承交换与结合律，还满足 <span class=\"katex-inline\">x\\oplus x=0<\/span>。<span class=\"katex-inline\">x\\subseteq y<\/span> 定义为 <span class=\"katex-inline\">x<\/span> 每个 1 位在 <span class=\"katex-inline\">y<\/span> 中也是 1，三种写法互相等价。<\/p>\n<h3>2. 概念 5：BDD 的结构约束（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。§7.1.4 把函数表示成决策图：根结点到汇结点 <span class=\"katex-inline\">\\boxed{0}<\/span>、<span class=\"katex-inline\">\\boxed{1}<\/span> 各一条分支；内部结点存变量 <span class=\"katex-inline\">V<\/span>，LO 指变量取 0 的后继，HI 指取 1 的后继（PDF 第 184 页）。有序要求同一条路径上变量下标严格递增；规约要求不浪费空间——相同三元值 <span class=\"katex-inline\">(V,LO,HI)<\/span> 只保留一份，LO 与 HI 不允许相等，每个结点都能从根到达。<\/p>\n<h3>3. 概念 6：规模、变量序与沿图采样（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。同一个布尔函数换一个变量次序，BDD 规模可以差出量级：好序下结点紧凑，坏序下路径交错、子树无法共享，结点数指数膨胀。反过来，沿 BDD 分支计数可以估算满足条件的赋值个数，也可以按比例在图上均匀随机采样一个满足条件的组合对象（PDF 第 188 页）。<\/p>\n<h2>推导一（推演）：位级包含关系的三种写法互相等价<\/h2>\n<p>下面证明三种写法回到同一条逐位条件。设 <span class=\"katex-inline\">x<\/span>、<span class=\"katex-inline\">y<\/span> 为二进制整数，按位记法每位为 <span class=\"katex-inline\">x_k,y_k<\/span>。<\/p>\n<ol><li>\n定义方向：<span class=\"katex-inline\">x\\subseteq y<\/span> 指对每个 <span class=\"katex-inline\">k<\/span>，<span class=\"katex-inline\">x_k=1\\Rightarrow y_k=1<\/span>。\n<\/li><li>\n证 <span class=\"katex-inline\">x\\&amp;y=x<\/span>：若 <span class=\"katex-inline\">x_k=1<\/span>，由定义 <span class=\"katex-inline\">y_k=1<\/span>，则 <span class=\"katex-inline\">x_k\\wedge y_k=1<\/span>；若 <span class=\"katex-inline\">x_k=0<\/span>，<span class=\"katex-inline\">x_k\\wedge y_k=0<\/span>。每位结果都等于 <span class=\"katex-inline\">x_k<\/span>，所以 <span class=\"katex-inline\">x\\&amp;y=x<\/span>。\n<\/li><li>\n证 <span class=\"katex-inline\">x\\mid y=y<\/span>：若 <span class=\"katex-inline\">y_k=1<\/span>，<span class=\"katex-inline\">x_k\\vee y_k=1=y_k<\/span>；若 <span class=\"katex-inline\">y_k=0<\/span>，由定义 <span class=\"katex-inline\">x_k=0<\/span>，<span class=\"katex-inline\">0\\vee0=0=y_k<\/span>。每位结果都等于 <span class=\"katex-inline\">y_k<\/span>，所以 <span class=\"katex-inline\">x\\mid y=y<\/span>。\n<\/li><li>\n证 <span class=\"katex-inline\">x\\&amp;\\bar y=0<\/span>：反着看，若某一位 <span class=\"katex-inline\">x_k=1<\/span> 而 <span class=\"katex-inline\">y_k=0<\/span>，则 <span class=\"katex-inline\">\\bar y_k=1<\/span>，<span class=\"katex-inline\">x_k\\wedge\\bar y_k=1<\/span>，与 <span class=\"katex-inline\">x\\&amp;\\bar y=0<\/span> 矛盾；不存在这样的位，正对应定义里&quot;<span class=\"katex-inline\">x<\/span> 的 1 位都在 <span class=\"katex-inline\">y<\/span> 中&quot;。\n<\/ol>\n<p>三种写法都回到同一条逐位条件，可互相替换使用。<\/p>\n<h2>推导二（证明方向）：BDD 求值路径与函数值对应<\/h2>\n<p>这次推演沿分支收缩顺序展开。对一个有序且规约的 BDD，给定赋值 <span class=\"katex-inline\">x_1,\\dots,x_n<\/span>：<\/p>\n<ol><li>\n从根结点出发；结点变量为 <span class=\"katex-inline\">V=j<\/span>。\n<\/li><li>\n若 <span class=\"katex-inline\">x_j=0<\/span>，沿 LO 分支走；若 <span class=\"katex-inline\">x_j=1<\/span>，沿 HI 分支走。\n<\/li><li>\n到达汇结点 <span class=\"katex-inline\">\\boxed{0}<\/span> 或 <span class=\"katex-inline\">\\boxed{1}<\/span>，该汇结点的值就是函数在这组赋值下的输出。\n<\/ol>\n<p>正确性依据：LO 分支代表&quot;<span class=\"katex-inline\">x_j=0<\/span> 时剩余变量对应的子函数&quot;，HI 分支代表&quot;<span class=\"katex-inline\">x_j=1<\/span> 时的子函数&quot;；每条分支把一个变量固定取值后，问题收缩成更短变量集上的子函数。有序性保证走到的下一个变量尚未固定，规约性保证相同子函数只存一份、不会走到 LO=HI 的冗余结点。走完 <span class=\"katex-inline\">n<\/span> 个变量后必达汇结点，路径长度不超过变量数。<\/p>\n<h2>反事实：改掉前提会怎样<\/h2>\n<ul><li>\n<strong>去掉有序约束<\/strong>：若允许同一条路径上变量下标回跳，同一个变量会被询问两次。第二次询问时取值已经固定，第二次分支要么恒走一侧、要么两侧重复，图里出现冗余询问；不同路径还可能对同一变量给出矛盾结论。有序约束把路径上的变量次序钉死，避免这类重复。\n<\/li><li>\n<strong>取消规约、保留相同子树多份拷贝<\/strong>：两个三元值完全相同的结点各自保留，共享关系断裂；函数稍大，重复子树就把结点数成倍放大，BDD 失去&quot;紧凑表示&quot;的意义。规约正是靠合并相同子树压住规模。\n<\/li><li>\n<strong>把变量序固定成一种而不评估好坏<\/strong>：变量序选错时，原本可共享的子树被路径拆散，结点数从线性量级滑向指数量级；直接拿默认次序建图，可能在中等规模函数上就超出存储。选序是 BDD 表示能否落地的前提步骤，不是可有可无的优化。\n<\/ul>\n<h2>与后续章节的衔接<\/h2>\n<p>位运算在第 7.2 节成为枚举工具：n 元组直接用位串表示，组合用&quot;恰含 <span class=\"katex-inline\">t<\/span> 个 1 的位串&quot;刻画。BDD 的&quot;沿分支计数与采样&quot;思想，也出现在 §7.2.1.6 从决策图生成满足条件的组合对象这一路径上。本章的包含关系 <span class=\"katex-inline\">x\\subseteq y<\/span> 对应集合子集判断，是组合枚举里筛选候选对象的基本动作。<\/p>", "kind": "chapter", "title": "第 7 章 7.1.3–7.1.4：按位运算的技巧与方法、二元决策图"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.249<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1）<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 7 章 7.1.3–7.1.4：按位运算的技巧与方法、二元决策图<\/a><\/span><\/div><h1>第 7 章 7.2.1.1–7.2.1.2：生成所有 n 元组与所有排列<\/h1>\n<blockquote>对应原书第 7 章 §7.2.1.1「生成所有 n 元组」、§7.2.1.2「生成所有排列」（PDF 第 249–308 页；印刷页 = PDF 页 − 15）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01 布尔函数，ch02 位运算与决策结构\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明 <span class=\"katex-inline\">n<\/span> 位二进制 n 元组共有 <span class=\"katex-inline\">2^n<\/span> 个，混合进制下按各分量上限计数；\n<\/li><li>\n按递归规则 <span class=\"katex-inline\">\\Gamma_{n+1}=0\\Gamma_n,\\ 1\\Gamma_n^{R}<\/span> 画出 <span class=\"katex-inline\">n=3<\/span> 的格雷码序列，指出相邻码只差一位；\n<\/li><li>\n用公式 <span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span> 把二进制序号转成格雷码；\n<\/li><li>\n走通字典序排列 Algorithm L 的四个步骤，对给定排列求出下一个字典序排列；\n<\/li><li>\n写出排列的逆序序列 <span class=\"katex-inline\">c_j<\/span>，说明邻接交换算法 P 怎样每次只交换相邻两项生成全部 <span class=\"katex-inline\">n!<\/span> 个排列。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>枚举组合对象要回答三个问题：总数是多少、按什么次序逐个产出、相邻两次产出之间改动多大。n 元组最基础，格雷码用&quot;每步翻一位&quot;的低改动次序重排 <span class=\"katex-inline\">2^n<\/span> 个位串；排列枚举有两条路线：字典序按词典大小逐个推进，邻接交换每次只换相邻两项。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 7：n 元组与格雷码（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。§7.2.1.1 先从 <span class=\"katex-inline\">n<\/span> 位二进制元组入手：<span class=\"katex-inline\">2^n<\/span> 个位串等价于访问所有 <span class=\"katex-inline\">\\{x_1,\\dots,x_n\\}<\/span>，<span class=\"katex-inline\">x_j<\/span> 在串中当且仅当 <span class=\"katex-inline\">a_j=1<\/span>（PDF 第 249 页）。直接从 <span class=\"katex-inline\">(0\\dots0)_2=0<\/span> 数到 <span class=\"katex-inline\">(1\\dots1)_2=2^n-1<\/span> 即可全覆盖；格雷码则把这个序列重排，使相邻两个码只有一位不同。递归构造 <span class=\"katex-inline\">\\Gamma_0=\\epsilon<\/span>，<span class=\"katex-inline\">\\Gamma_{n+1}=0\\Gamma_n<\/span> 后接 <span class=\"katex-inline\">1\\Gamma_n^{R}<\/span>，其中 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 是 <span class=\"katex-inline\">\\Gamma_n<\/span> 的逆序（PDF 第 251 页）。<\/p>\n<h3>2. 概念 8：字典序排列 Algorithm L（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。§7.2.1.2 从非减初始排列 <span class=\"katex-inline\">a_1\\le a_2\\le\\cdots\\le a_n<\/span> 出发，算法 L 依次产出全部字典序排列（PDF 第 280–281 页）。L2 找最右满足 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span> 的下标 <span class=\"katex-inline\">j<\/span>；L3 找最右满足 <span class=\"katex-inline\">a_l&gt;a_j<\/span> 可交换的最小元素；L4 交换后把 <span class=\"katex-inline\">a_{j+1}\\dots a_n<\/span> 反序。字典序的&quot;下一个&quot;由这三步确定，全过程不漏不重。<\/p>\n<h3>3. 概念 9：邻接交换 Algorithm P 与逆序序列（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。字典序排列相邻两次产出常需搬动多项；邻接交换路线追求每次只换相邻两项。算法 P 借助逆序序列 <span class=\"katex-inline\">c_j<\/span>（<span class=\"katex-inline\">0\\le c_j&lt;j<\/span>）与方向位 <span class=\"katex-inline\">o_j<\/span>：<span class=\"katex-inline\">c_j<\/span> 是比 <span class=\"katex-inline\">j<\/span> 小且排在 <span class=\"katex-inline\">j<\/span> 右边的元素数目，遍历所有合法逆序序列即对应全部排列（PDF 第 282–283 页）。P1 置初值，P2 访问当前排列，P3–P7 调整 <span class=\"katex-inline\">c_j<\/span> 与方向位并完成一次相邻交换。<\/p>\n<h2>推导一（证明方向）：格雷码递归构造为何覆盖全部 <span class=\"katex-inline\">2^n<\/span> 个码且相邻只差一位<\/h2>\n<p>下面证明覆盖性与相邻性质都按归纳成立。归纳基础：<span class=\"katex-inline\">\\Gamma_0=\\epsilon<\/span> 只有空串，覆盖 <span class=\"katex-inline\">2^0=1<\/span> 个码。<\/p>\n<p>归纳假设：<span class=\"katex-inline\">\\Gamma_n<\/span> 包含全部 <span class=\"katex-inline\">2^n<\/span> 个 <span class=\"katex-inline\">n<\/span> 位串，且相邻两项只差一位，首尾也满足循环性质。<\/p>\n<p>构造 <span class=\"katex-inline\">\\Gamma_{n+1}=0\\Gamma_n,\\ 1\\Gamma_n^{R}<\/span>：<\/p>\n<ol><li>\n覆盖性：前半每个码前加 0，后半每个码前加 1；<span class=\"katex-inline\">\\Gamma_n<\/span> 覆盖全部 <span class=\"katex-inline\">n<\/span> 位串，补上前缀后覆盖全部 <span class=\"katex-inline\">n+1<\/span> 位串，前后两半前缀不同，互不重复。\n<\/li><li>\n相邻差一位：<span class=\"katex-inline\">\\Gamma_n<\/span> 内部相邻只差一位，前半内部、后半内部各自成立；<span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 只是把序列反转，相邻关系不变。接缝处前半末位为 <span class=\"katex-inline\">0\\Gamma_n<\/span> 的最后一项，后半首项为 <span class=\"katex-inline\">1\\Gamma_n^{R}<\/span> 的第一项，而 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 的首项正是 <span class=\"katex-inline\">\\Gamma_n<\/span> 的末项，二者后 <span class=\"katex-inline\">n<\/span> 位相同，只有前缀位 0 与 1 不同，仍只差一位。\n<\/ol>\n<p>归纳到 <span class=\"katex-inline\">n+1<\/span>，结论成立。<\/p>\n<h2>推导二（推演）：Algorithm L 手算一个完整片段<\/h2>\n<p>这次推演走完整条字典序链路。取 <span class=\"katex-inline\">n=3<\/span>，初始排列 <span class=\"katex-inline\">123<\/span>。算法 L 逐步推进：<\/p>\n<ol><li>\n<span class=\"katex-inline\">123<\/span>：L2 找最右 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span>，<span class=\"katex-inline\">j=2<\/span>（<span class=\"katex-inline\">2&lt;3<\/span>）；L3 在右侧找大于 <span class=\"katex-inline\">a_2=2<\/span> 的最小元素，<span class=\"katex-inline\">l=3<\/span>；交换得 <span class=\"katex-inline\">132<\/span>；右侧反序（长度 1，不变）。\n<\/li><li>\n<span class=\"katex-inline\">132<\/span>：L2 从右看，<span class=\"katex-inline\">3&gt;2<\/span> 不满足，回退到 <span class=\"katex-inline\">1&lt;3<\/span>，<span class=\"katex-inline\">j=1<\/span>；L3 在 <span class=\"katex-inline\">\\{3,2\\}<\/span> 中找大于 <span class=\"katex-inline\">a_1=1<\/span> 的最小元素，<span class=\"katex-inline\">l=3<\/span>（值 2）；交换 <span class=\"katex-inline\">a_1<\/span> 与 <span class=\"katex-inline\">a_3<\/span> 得 <span class=\"katex-inline\">231<\/span>；把位置 2–3 反序得 <span class=\"katex-inline\">213<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">213<\/span>：<span class=\"katex-inline\">j=2<\/span>（<span class=\"katex-inline\">1&lt;3<\/span>），交换位置 2、3 得 <span class=\"katex-inline\">231<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">231<\/span>：<span class=\"katex-inline\">3&gt;1<\/span> 不满足，回退 <span class=\"katex-inline\">2&lt;3<\/span>，<span class=\"katex-inline\">j=1<\/span>；右侧 <span class=\"katex-inline\">\\{3,1\\}<\/span> 中大于 2 的最小元素为 <span class=\"katex-inline\">l=3<\/span>（值 3）；交换得 <span class=\"katex-inline\">321<\/span>；位置 2–3 反序得 <span class=\"katex-inline\">312<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">312<\/span>：<span class=\"katex-inline\">1&lt;2<\/span>，<span class=\"katex-inline\">j=2<\/span>，交换得 <span class=\"katex-inline\">321<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">321<\/span>：L2 找不到 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span>，算法终止。\n<\/ol>\n<p>产出序列 <span class=\"katex-inline\">123,132,213,231,312,321<\/span>，共 <span class=\"katex-inline\">3!=6<\/span> 个，与计数一致。<\/p>\n<h2>反事实：改掉前提会怎样<\/h2>\n<ul><li>\n<strong>把递归构造后半段写成 <span class=\"katex-inline\">1\\Gamma_n<\/span> 而不反转<\/strong>：接缝处前半末位是 <span class=\"katex-inline\">0<\/span> 接 <span class=\"katex-inline\">\\Gamma_n<\/span> 末项，后半首项是 <span class=\"katex-inline\">1<\/span> 接 <span class=\"katex-inline\">\\Gamma_n<\/span> 首项；末项与首项后 <span class=\"katex-inline\">n<\/span> 位不同，接缝跨越多位，格雷码&quot;相邻只差一位&quot;的性质断裂。反转 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 正是为了让接缝两端后 <span class=\"katex-inline\">n<\/span> 位相同。\n<\/li><li>\n<strong>字典序生成时交换后不反序右侧段<\/strong>：L4 要求把 <span class=\"katex-inline\">a_{j+1}\\dots a_n<\/span> 反序。这段在 L2 之后本身是非递增的；若只交换不改序，后续排列仍停留在较大的后缀组合里，字典序顺序被打乱，可能产出比当前排列还小的后继，重复与漏排随之出现。\n<\/li><li>\n<strong>邻接交换允许交换任意两项<\/strong>：若放宽成任意位置交换，每次改动的位数不固定，丢失&quot;平滑改变&quot;的价值；算法 P 存在的理由就是相邻交换这一约束，逆序序列与方向位机制都围绕相邻位置设计。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>n 元组是位串表示的源头：§7.2.1.3 组合直接用&quot;恰含 <span class=\"katex-inline\">t<\/span> 个 1 的位串&quot;枚举。排列生成的字典序思路推广到组合即 §7.2.1.3 的算法 L、T；邻接交换的低改动思想在组合的&quot;旋转门&quot;顺序中也有对应。本章的计数 <span class=\"katex-inline\">2^n<\/span> 与 <span class=\"katex-inline\">n!<\/span> 是第 7.2 节其余对象计数的对照基准。<\/p>", "kind": "chapter", "title": "第 7 章 7.2.1.1–7.2.1.2：生成所有 n 元组与所有排列"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.309<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 7 章 7.2.1.1–7.2.1.2：生成所有 n 元组与所有排列<\/a><\/span><\/div><h1>第 7 章 7.2.1.3–7.2.1.6：生成组合、划分、集合划分与树<\/h1>\n<blockquote>对应原书第 7 章 §7.2.1.3「生成所有组合」、§7.2.1.4「生成所有划分」、§7.2.1.5「生成所有集合划分」、§7.2.1.6「生成所有树」（PDF 第 309–418 页；印刷页 = PDF 页 − 15）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch03 n 元组与排列生成\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n在元素表 <span class=\"katex-inline\">c_t&gt;\\cdots&gt;c_1<\/span> 与位串 <span class=\"katex-inline\">a_{n-1}\\dots a_0<\/span> 两种表示之间互相转换一个 <span class=\"katex-inline\">(s,t)<\/span> 组合；\n<\/li><li>\n走通组合字典序算法 L 的初始化、访问、找最右可增下标步骤，说出算法 T 的简化路径；\n<\/li><li>\n区分整数划分（把 <span class=\"katex-inline\">n<\/span> 拆成非增整数和）与集合划分（把集合拆成互不相交的块）；\n<\/li><li>\n复述十二类方式中球与桶带不带标记对应的组合对象类别；\n<\/li><li>\n把一个括号串还原成森林，说出括号串算法 P 的初始化、配对检查与追加步骤。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>排列解决&quot;全排&quot;问题，组合解决&quot;选子集&quot;问题；划分沿两条不同路线展开：整数划分关心数的拆分，集合划分关心集合的分块；树则通过嵌套括号串与森林一一对应，生成合法括号串就生成了对应的树结构。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 10：组合的双表示与字典序生成（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。§7.2.1.3 把 <span class=\"katex-inline\">(s,t)<\/span> 组合写成 <span class=\"katex-inline\">n=s+t<\/span> 个对象中选 <span class=\"katex-inline\">t<\/span> 个的子集（PDF 第 309 页）。两种表示并存：元素表递减列 <span class=\"katex-inline\">c_t&gt;\\cdots&gt;c_1\\ge0<\/span>；二进制位串 <span class=\"katex-inline\">a_{n-1}\\dots a_0<\/span>，恰含 <span class=\"katex-inline\">t<\/span> 个 1，1 的位置对应选中元素。算法 L 按字典序访问 <span class=\"katex-inline\">c_t\\dots c_1<\/span>；算法 T 是执行速度更快的改进版，先判最简单情形（PDF 第 312 页）。<\/p>\n<h3>2. 概念 11：整数划分与集合划分（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c11.md\" target=\"_blank\" rel=\"noopener\">概念 c11<\/a>。§7.2.1.4 表 1「十二类方式」按球、桶各自带不带标记，结合每桶球数无限制、至少一个、至多一个等条件，对应 n 元组、n 排列、子集、多重组合、n 划分、r 部分划分、r 部分有序划分、放球入笼等类别（PDF 第 339 页）；该页题辞引乔治·安德鲁斯《The Theory of Partitions》(1976)。整数划分把 <span class=\"katex-inline\">n<\/span> 写成 <span class=\"katex-inline\">a_1\\ge a_2\\ge\\cdots<\/span> 的非增正整数之和；集合划分把集合拆成互不相交的非空块，块内排序、块间按最小元素递增排序以标准化表示（PDF 第 360 页）。<\/p>\n<h3>3. 概念 12：括号串与树的生成（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c12.md\" target=\"_blank\" rel=\"noopener\">概念 c12<\/a>。§7.2.1.6 用嵌套括号串对应森林：给定含 <span class=\"katex-inline\">n<\/span> 个左括号与 <span class=\"katex-inline\">n<\/span> 个右括号的串，第 <span class=\"katex-inline\">k<\/span> 个 &quot;(&quot; 与对应的 &quot;)&quot; 配对，括号嵌套关系画出树（PDF 第 381 页）。括号串算法 P 从 <span class=\"katex-inline\">a_{2k-1}=<\/span> &quot;(&quot;、<span class=\"katex-inline\">a_{2k}=<\/span> &quot;)&quot; 的哨兵形式出发，按字典序生成所有合法括号串；P4 找可增下标，P5 追加 &quot;(&quot; 并重置后缀，简单情形直接处理。<\/p>\n<h2>推导一（推演）：组合两种表示互相转换<\/h2>\n<p>下面证明两种表示一一对应。取 <span class=\"katex-inline\">n=5<\/span>，<span class=\"katex-inline\">t=3<\/span>，元素表 <span class=\"katex-inline\">\\{2,3,4\\}<\/span>（下标 <span class=\"katex-inline\">0\\dots4<\/span>）。<\/p>\n<ol><li>\n元素表到位串：位 <span class=\"katex-inline\">4,3,2<\/span> 为 1，位 <span class=\"katex-inline\">1,0<\/span> 为 0，位串 <span class=\"katex-inline\">a_4a_3a_2a_1a_0=11100<\/span>。\n<\/li><li>\n位串回元素表：从左到右扫，1 所在下标依次为 <span class=\"katex-inline\">4,3,2<\/span>，递减列 <span class=\"katex-inline\">c_3=4,c_2=3,c_1=2<\/span>。\n<\/li><li>\n计数核对：<span class=\"katex-inline\">\\binom53=10<\/span>，即这样的位串与元素表各有 10 个，两种表示一一对应。\n<\/ol>\n<p>算法 L 找下一个组合时，先定位最右还能增大的 <span class=\"katex-inline\">c_j<\/span>，把 <span class=\"katex-inline\">c_j<\/span> 加 1，再把左侧元素重设为它们的最小可能值；位串视角下这等价于把最右可移动的 1 向左位邻位推进。<\/p>\n<h2>推导二（证明方向）：括号串与森林的对应保持<\/h2>\n<p>这次推演按括号扫描顺序还原森林。1. 每个左括号 &quot;(&quot; 对应一个新结点开始，右括号 &quot;)&quot; 对应该结点结束；嵌套的 &quot;(&quot; 对应该结点的子女，并列的 &quot;(&quot; 对应兄弟或下一棵根。<\/p>\n<ol><li>\n合法性约束：扫描过程中已出现的左括号数不少于右括号数；到末尾左右括号数相等。这对应森林里每个结点都有完整的开始与结束，不存在悬空的右括号。\n<\/li><li>\n反向还原：沿串外围爬行，遇到 &quot;(&quot; 见到结点的左边，遇到 &quot;)&quot; 见到右边；括号匹配关系直接给出父子与兄弟连接，串与森林一一对应。\n<\/ol>\n<h2>反事实：改掉前提会怎样<\/h2>\n<ul><li>\n<strong>集合划分允许块相交<\/strong>：若两个块共享元素，元素归属出现两个类，块之间不再互不相交；标准化排序无法确定块的归属，枚举时同一集合会被反复计入多种分块方式，计数翻倍且重复。互不相交是集合划分区别于子集族的硬约束。\n<\/li><li>\n<strong>整数划分不要求非增次序<\/strong>：若把 <span class=\"katex-inline\">3+2+1<\/span>、<span class=\"katex-inline\">2+3+1<\/span> 当成不同划分，同一个数的拆分被按排列重复计数；非增约定把因子次序吸收掉，划分只关心哪些数相加，不关心摆放顺序。\n<\/li><li>\n<strong>括号串不做前缀计数检查<\/strong>：允许前缀里右括号多于左括号，会出现先闭合尚未开始的结点；还原出的森林存在悬空边，串与树的对应断裂。前缀非负是合法性的第一道闸门。\n<\/ul>\n<h2>与全书结构的衔接<\/h2>\n<p>本章是卷 4A 第一部分枚举路线的收口：n 元组（ch03）给出位串基础，排列给出全排路线，本章把子集、划分、树逐一接上。§7.2.1.7 的历史与扩展文献把这些算法放回组合生成的发展脉络；卷 4B 及后续卷目在此基础上展开更复杂的组合对象与优化问题。本章的计数与平均代价公式，承接 ch03 对枚举总量的估算思路。<\/p>", "kind": "chapter", "title": "第 7 章 7.2.1.3–7.2.1.6：生成组合、划分、集合划分与树"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.53<\/div><h1>两值逻辑与布尔代数基本定律<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书 §7.1.1，PDF 第 53–54 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p>组合算法处理的对象先落在最底层的离散状态：一位只能取 0 或 1。困难在于，把多位 0/1 组合起来时，需要一套确定的改写规则，否则同一组位状态可以被写成不同表达式，化简与求值都没有共同依据。布尔代数给出在 0、1 两个值上定义与、或、非的代数结构，用一组定律约束表达式之间的等价关系；后面按位运算、真值表、BDD 都建立在这套规则之上。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>两值集合<\/strong>：取值范围只有 <span class=\"katex-inline\">\\{0,1\\}<\/span>，0 对应假、1 对应真；不存在第三值。<\/p>\n<p><strong>三种基本运算<\/strong>：<\/p>\n<ul><li>\n与 <span class=\"katex-inline\">x\\wedge y<\/span>（记作 <span class=\"katex-inline\">x\\&amp;y<\/span> 或 <span class=\"katex-inline\">xy<\/span>）：<span class=\"katex-inline\">x,y<\/span> 都为 1 时结果为 1，否则为 0；真值表 <span class=\"katex-inline\">1100<\/span> 行取值依次为 <span class=\"katex-inline\">0,0,0,1<\/span>。\n<\/li><li>\n或 <span class=\"katex-inline\">x\\vee y<\/span>（记作 <span class=\"katex-inline\">x\\mid y<\/span>）：<span class=\"katex-inline\">x,y<\/span> 至少一个为 1 时结果为 1；真值表取值 <span class=\"katex-inline\">0,1,1,1<\/span>。\n<\/li><li>\n非 <span class=\"katex-inline\">\\neg x<\/span>：把 0 变 1、把 1 变 0。\n<\/ul>\n<p><strong>基本定律<\/strong>（每位独立成立）：<\/p>\n<ol><li>\n交换律：<span class=\"katex-inline\">x\\wedge y=y\\wedge x<\/span>，<span class=\"katex-inline\">x\\vee y=y\\vee x<\/span>。\n<\/li><li>\n结合律：<span class=\"katex-inline\">(x\\wedge y)\\wedge z=x\\wedge(y\\wedge z)<\/span>，或运算按相同方式成立。\n<\/li><li>\n两个分配律：<span class=\"katex-inline\">(x\\vee y)\\wedge z=(x\\wedge z)\\vee(y\\wedge z)<\/span>；<span class=\"katex-inline\">(x\\wedge y)\\vee z=(x\\vee z)\\wedge(y\\vee z)<\/span>。\n<\/li><li>\n吸收律：<span class=\"katex-inline\">(x\\wedge y)\\vee x=x<\/span>，<span class=\"katex-inline\">(x\\vee y)\\wedge x=x<\/span>。\n<\/li><li>\n德摩根律：<span class=\"katex-inline\">\\neg(x\\wedge y)=\\neg x\\vee\\neg y<\/span>，<span class=\"katex-inline\">\\neg(x\\vee y)=\\neg x\\wedge\\neg y<\/span>。\n<\/ol>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">1\\wedge0=0<\/span>，<span class=\"katex-inline\">1\\vee0=1<\/span>，<span class=\"katex-inline\">\\neg0=1<\/span>；由吸收律 <span class=\"katex-inline\">x\\wedge1=x<\/span>，<span class=\"katex-inline\">x\\vee0=x<\/span>。<\/p>\n<p><strong>反例<\/strong>：把算术直觉搬进来会误判——<span class=\"katex-inline\">x\\wedge(x\\vee y)=x<\/span> 成立（吸收），但不能写成 <span class=\"katex-inline\">x+(x\\times y)=x<\/span> 的算术类比；<span class=\"katex-inline\">x\\vee x=x<\/span>（幂等）不是 <span class=\"katex-inline\">x+x=2x<\/span>。<\/p>\n<h2>原理推导：定律为何能逐位成立<\/h2>\n<p>布尔定律在每一位上独立核验。以第二个分配律 <span class=\"katex-inline\">(x\\wedge y)\\vee z=(x\\vee z)\\wedge(y\\vee z)<\/span> 为例，三个变量共 8 种赋值，逐行代入两侧：任取一组赋值，<span class=\"katex-inline\">z=1<\/span> 时两侧都为 1；<span class=\"katex-inline\">z=0<\/span> 时两侧退化为 <span class=\"katex-inline\">x\\wedge y<\/span> 与 <span class=\"katex-inline\">x\\wedge y<\/span>。8 行取值全部相同，等式成立。德摩根律用四行真值表核验：<span class=\"katex-inline\">x=y=0<\/span> 两侧为 1；<span class=\"katex-inline\">x=0,y=1<\/span> 左侧 <span class=\"katex-inline\">\\neg(0\\wedge1)=1<\/span>，右侧 <span class=\"katex-inline\">1\\vee0=1<\/span>；<span class=\"katex-inline\">x=1,y=0<\/span> 两侧同法核验；<span class=\"katex-inline\">x=y=1<\/span> 两侧为 0。四行覆盖两变量全部输入。<\/p>\n<p>推导依据是真值表完备性：两变量函数的输入只有 4 种、三变量只有 8 种，逐行核验即可证明等式对所有赋值成立，不需要另设公理外的假设。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：运算对象是取值 0/1 的位；定律按位独立施加到二进制整数的每一位。\n<\/li><li>\n失败案例 1：把算术分配律的唯一性带进布尔代数。普通数域只有乘法对加法分配；布尔代数两条分配律并存，漏写或对与的分配会在化简与项、或项交错表达式时卡住。\n<\/li><li>\n失败案例 2：混淆幂等与算术加倍。<span class=\"katex-inline\">x\\vee x=x<\/span>、<span class=\"katex-inline\">x\\wedge x=x<\/span>，重复取同一变量不产生&quot;两份&quot;；按 <span class=\"katex-inline\">x+x<\/span> 理解会得到错误结果。\n<\/li><li>\n边界：德摩根律翻括号时与、或互换且每个变量取反；只翻括号不换算子，得到的是错误等式。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>与/或 vs 算术乘/加<\/strong>：记号相近，取值规则不同；<span class=\"katex-inline\">1\\vee1=1<\/span> 而不是 2，<span class=\"katex-inline\">1\\wedge1=1<\/span>。分配律方向也不同，布尔代数双向分配。\n<\/li><li>\n<strong>德摩根律 vs 单纯取反<\/strong>：取反只作用于单个变量；德摩根律作用于复合表达式整体，要求换算子。\n<\/li><li>\n<strong>交换律 vs 结合律<\/strong>：交换律改两个运算对象的次序，结合律改括号的分组；前者不动运算优先级，后者不动次序。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无，本章是全书组合对象表示的最底层。后继：c02 用真值表与范式把函数写成表达式；c04 把这些定律逐位施加到二进制整数上得到按位运算；c05 BDD 结点的分支判断仍以与、或、非规则为取值依据。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（两值逻辑与布尔代数基本定律）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：两值逻辑依赖链、定律逐行核验与表达式化简推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把布尔代数定律用对，往回追四层：<\/p>\n<ol><li>\n取值语义：一位只能取 0 或 1，1 记真、0 记假。这是所有运算取值表的前提。\n<\/li><li>\n基本运算：与、或、非各自的四行（两变量）或一行（非）取值表，决定复合表达式每一步怎么算。\n<\/li><li>\n等价改写：交换、结合、分配、吸收、德摩根律给出&quot;两种写法算同一个值&quot;的依据；没有这些定律，表达式只能逐行求值。\n<\/li><li>\n按位推广：同一套规则逐位施加到整数的每个二进制位，得到 c04 的按位运算。\n<\/ol>\n<p>依赖链方向：两值语义 → 运算真值表 → 代数定律 → 表达式化简 → 逐位推广。<\/p>\n<h2>正向推导：每条定律的成立依据<\/h2>\n<p><strong>交换律<\/strong>。<span class=\"katex-inline\">x\\wedge y<\/span> 在 <span class=\"katex-inline\">x,y<\/span> 同 1 时为 1，与先写谁后写谁无关；<span class=\"katex-inline\">x\\vee y<\/span> 在任一为 1 时为 1，次序同样不影响。四行真值表两侧取值一致。<\/p>\n<p><strong>结合律<\/strong>。先算哪一对不改变结果：以 <span class=\"katex-inline\">(x\\wedge y)\\wedge z<\/span> 为例，结果为 1 当且仅当 <span class=\"katex-inline\">x,y,z<\/span> 全为 1；<span class=\"katex-inline\">x\\wedge(y\\wedge z)<\/span> 为 1 的条件也是三者全 1。8 种赋值下两侧取值一致，或运算按相同方式成立。<\/p>\n<p><strong>第一分配律<\/strong> <span class=\"katex-inline\">(x\\vee y)\\wedge z=(x\\wedge z)\\vee(y\\wedge z)<\/span>。<span class=\"katex-inline\">z=1<\/span> 时左侧为 <span class=\"katex-inline\">x\\vee y<\/span>，右侧为 <span class=\"katex-inline\">x\\vee y<\/span>；<span class=\"katex-inline\">z=0<\/span> 时两侧都为 0。分 <span class=\"katex-inline\">z<\/span> 两种情形覆盖全部 8 行。<\/p>\n<p><strong>第二分配律<\/strong> <span class=\"katex-inline\">(x\\wedge y)\\vee z=(x\\vee z)\\wedge(y\\vee z)<\/span>。<span class=\"katex-inline\">z=1<\/span> 时两侧都为 1；<span class=\"katex-inline\">z=0<\/span> 时两侧退化为 <span class=\"katex-inline\">x\\wedge y<\/span>。这一条是布尔代数区别于普通算术的关键：算术里加法不对乘法分配，布尔代数里或对与也分配。<\/p>\n<p><strong>吸收律<\/strong> <span class=\"katex-inline\">(x\\wedge y)\\vee x=x<\/span>。若 <span class=\"katex-inline\">x=1<\/span>，左侧 <span class=\"katex-inline\">(1\\wedge y)\\vee1=y\\vee1=1=x<\/span>；若 <span class=\"katex-inline\">x=0<\/span>，左侧 <span class=\"katex-inline\">(0\\wedge y)\\vee0=0=x<\/span>。两情形覆盖完毕。另一式 <span class=\"katex-inline\">(x\\vee y)\\wedge x=x<\/span> 对偶成立。<\/p>\n<p><strong>德摩根律<\/strong>。<span class=\"katex-inline\">\\neg(x\\wedge y)=\\neg x\\vee\\neg y<\/span> 四行核验：<span class=\"katex-inline\">00\\to<\/span> 左侧 <span class=\"katex-inline\">\\neg0=1<\/span>，右侧 <span class=\"katex-inline\">1\\vee1=1<\/span>；<span class=\"katex-inline\">01\\to<\/span> 左侧 <span class=\"katex-inline\">\\neg0=1<\/span>，右侧 <span class=\"katex-inline\">1\\vee0=1<\/span>；<span class=\"katex-inline\">10\\to<\/span> 同 <span class=\"katex-inline\">01<\/span>；<span class=\"katex-inline\">11\\to<\/span> 左侧 <span class=\"katex-inline\">\\neg1=0<\/span>，右侧 <span class=\"katex-inline\">0\\vee0=0<\/span>。另一条 <span class=\"katex-inline\">\\neg(x\\vee y)=\\neg x\\wedge\\neg y<\/span> 把或与对调核验。<\/p>\n<h2>数值算例：手算一个三变量表达式<\/h2>\n<p>取表达式 <span class=\"katex-inline\">E=(x\\wedge y)\\vee(\\neg x\\wedge z)<\/span>，赋值 <span class=\"katex-inline\">x=1,y=0,z=1<\/span>。<\/p>\n<ol><li>\n算 <span class=\"katex-inline\">x\\wedge y=1\\wedge0=0<\/span>。\n<\/li><li>\n算 <span class=\"katex-inline\">\\neg x=0<\/span>，<span class=\"katex-inline\">\\neg x\\wedge z=0\\wedge1=0<\/span>。\n<\/li><li>\n算 <span class=\"katex-inline\">0\\vee0=0<\/span>，<span class=\"katex-inline\">E=0<\/span>。\n<\/ol>\n<p>换赋值 <span class=\"katex-inline\">x=0,y=1,z=1<\/span>：<span class=\"katex-inline\">x\\wedge y=0\\wedge1=0<\/span>；<span class=\"katex-inline\">\\neg x=1<\/span>，<span class=\"katex-inline\">\\neg x\\wedge z=1\\wedge1=1<\/span>；<span class=\"katex-inline\">0\\vee1=1<\/span>，<span class=\"katex-inline\">E=1<\/span>。<\/p>\n<p><strong>第二算例：用吸收律化简<\/strong>。<span class=\"katex-inline\">F=(x\\wedge y)\\vee x<\/span>。由吸收律直接得 <span class=\"katex-inline\">F=x<\/span>。核验两行：<span class=\"katex-inline\">x=1<\/span> 时 <span class=\"katex-inline\">(1\\wedge y)\\vee1=1<\/span>；<span class=\"katex-inline\">x=0<\/span> 时 <span class=\"katex-inline\">(0\\wedge y)\\vee0=0<\/span>，与 <span class=\"katex-inline\">x<\/span> 一致，<span class=\"katex-inline\">y<\/span> 在结果中被吸收掉。<\/p>\n<h2>延伸推演：从定律到范式的方向<\/h2>\n<p>c02 要把真值表写成析取范式：函数值为 1 的每个输入行对应一个最小项（变量按行取值取正或取反，再相与），所有最小项相或。定律在范式转换中承担两类工作：分配律把&quot;与的或&quot;展开成标准形，结合律确定多项运算的分组，德摩根律处理取反嵌套。化简时反向使用：吸收律消去被包含的项，幂等律合并重复项。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>只记算术单向分配<\/strong>。写 <span class=\"katex-inline\">(x\\wedge y)\\vee z<\/span> 时想提出 <span class=\"katex-inline\">z<\/span>，按算术直觉无处可提；套第二分配律得 <span class=\"katex-inline\">(x\\vee z)\\wedge(y\\vee z)<\/span>，这才是布尔代数允许的展开方向。漏记第二条分配律，含或领头项的表达式无法拆开。<\/p>\n<p><strong>翻括号不换算子<\/strong>。把 <span class=\"katex-inline\">\\neg(x\\wedge y)<\/span> 写成 <span class=\"katex-inline\">\\neg x\\wedge\\neg y<\/span>，与、或未互换；代入 <span class=\"katex-inline\">x=0,y=1<\/span>：原式 <span class=\"katex-inline\">\\neg0=1<\/span>，误写式 <span class=\"katex-inline\">1\\wedge0=0<\/span>，两侧不等。正确写法是 <span class=\"katex-inline\">\\neg x\\vee\\neg y<\/span>。<\/p>\n<h2>延伸推演：一条复合表达式的逐步化简<\/h2>\n<p>取 <span class=\"katex-inline\">G=(x\\wedge y)\\vee(x\\wedge\\neg y)\\vee z<\/span>，按定律分步化简。<\/p>\n<ol><li>\n前两项提取公共因子 <span class=\"katex-inline\">x<\/span>：<span class=\"katex-inline\">(x\\wedge y)\\vee(x\\wedge\\neg y)=x\\wedge(y\\vee\\neg y)<\/span>，用第一分配律的反向形式。\n<\/li><li>\n<span class=\"katex-inline\">y\\vee\\neg y=1<\/span>（排中方向：一位非 0 即 1），于是 <span class=\"katex-inline\">x\\wedge1=x<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">G=x\\vee z<\/span>。\n<\/ol>\n<p>核验：取 <span class=\"katex-inline\">x=0,y=0,z=1<\/span>，原式 <span class=\"katex-inline\">(0\\wedge0)\\vee(0\\wedge1)\\vee1=1<\/span>，化简式 <span class=\"katex-inline\">0\\vee1=1<\/span>；取 <span class=\"katex-inline\">x=1,y=0,z=0<\/span>，原式 <span class=\"katex-inline\">(1\\wedge0)\\vee(1\\wedge1)\\vee0=1<\/span>，化简式 <span class=\"katex-inline\">1\\vee0=1<\/span>；取 <span class=\"katex-inline\">x=0,y=1,z=0<\/span>，原式 <span class=\"katex-inline\">0\\vee0\\vee0=0<\/span>，化简式 <span class=\"katex-inline\">0<\/span>。三行覆盖原式三个支项的典型取值。<\/p>\n<p><strong>第三算例：异或与基本运算的关系<\/strong>。异或 <span class=\"katex-inline\">x\\oplus y=1<\/span> 当且仅当 <span class=\"katex-inline\">x,y<\/span> 取值不同。写成与或形式：<span class=\"katex-inline\">x\\oplus y=(x\\wedge\\neg y)\\vee(\\neg x\\wedge y)<\/span>。代入四行：<span class=\"katex-inline\">00\\to(0\\wedge1)\\vee(1\\wedge0)=0<\/span>；<span class=\"katex-inline\">01\\to(0\\wedge0)\\vee(1\\wedge1)=1<\/span>；<span class=\"katex-inline\">10\\to(1\\wedge1)\\vee(0\\wedge0)=1<\/span>；<span class=\"katex-inline\">11\\to(1\\wedge0)\\vee(0\\wedge1)=0<\/span>，与异或取值一致。这说明异或可用与、或、非组合出来，基本三运算是完备的一组。<\/p>\n<h2>再推一层：为什么两条分配律能同时成立<\/h2>\n<p>普通算术里 <span class=\"katex-inline\">a\\times(b+c)=ab+ac<\/span>，但 <span class=\"katex-inline\">a+(b\\times c)<\/span> 不能拆成 <span class=\"katex-inline\">(a+b)\\times(a+c)<\/span>。布尔代数的定义域是 <span class=\"katex-inline\">\\{0,1\\}<\/span>，与、或的取值表都满足单调方向：或相当于取大、与相当于取小（在 <span class=\"katex-inline\">0&lt;1<\/span> 的序下）。取大对取小分配、取小对取大分配，两条方向都成立；这正是格结构中分配格的特征。记住&quot;或取大、与取小&quot;这个视角，第二分配律 <span class=\"katex-inline\">(x\\wedge y)\\vee z=(x\\vee z)\\wedge(y\\vee z)<\/span> 可读成：先取小再取大，等于先分别取大再取小，两侧在四个格点上结果相同。<\/p>\n<h2>对抗性追问：真值表核验能不能代替定律记忆<\/h2>\n<p>能核验两变量、三变量的等式，但变量数增大后真值表行数按 <span class=\"katex-inline\">2^n<\/span> 膨胀，逐行枚举不再可行。定律的价值是给出可复用的改写规则：化简长表达式时按定律成块替换，不必每行重算。核验是证明手段，定律是操作工具，两者分工不同。<\/p>\n<h2>第二算例：三变量表达式分步化简<\/h2>\n<p>取 <span class=\"katex-inline\">H=(x\\wedge y)\\vee(x\\wedge z)\\vee(\\neg y\\wedge z)<\/span>。<\/p>\n<ol><li>\n前两项提取公共因子 <span class=\"katex-inline\">x<\/span>：<span class=\"katex-inline\">(x\\wedge y)\\vee(x\\wedge z)=x\\wedge(y\\vee z)<\/span>，用第一分配律反向形式。\n<\/li><li>\n代入得 <span class=\"katex-inline\">H=[x\\wedge(y\\vee z)]\\vee(\\neg y\\wedge z)<\/span>。\n<\/li><li>\n取赋值 <span class=\"katex-inline\">x=0,y=1,z=1<\/span>：第一支 <span class=\"katex-inline\">0\\wedge(1\\vee1)=0<\/span>，第二支 <span class=\"katex-inline\">\\neg1\\wedge1=0<\/span>，<span class=\"katex-inline\">H=0<\/span>。\n<\/li><li>\n取赋值 <span class=\"katex-inline\">x=1,y=0,z=1<\/span>：第一支 <span class=\"katex-inline\">1\\wedge(0\\vee1)=1<\/span>，第二支 <span class=\"katex-inline\">1\\wedge1=1<\/span>，<span class=\"katex-inline\">H=1<\/span>。\n<\/li><li>\n取赋值 <span class=\"katex-inline\">x=1,y=1,z=0<\/span>：第一支 <span class=\"katex-inline\">1\\wedge1=1<\/span>，第二支 <span class=\"katex-inline\">0\\wedge0=0<\/span>，<span class=\"katex-inline\">H=1<\/span>。\n<\/ol>\n<p>三行分别覆盖&quot;两支都灭&quot;&quot;两支都亮&quot;&quot;仅第一支亮&quot;三种典型组合，化简前后取值一致。<\/p>\n<h2>定律与算术对照清单<\/h2>\n<ul><li>\n幂等：<span class=\"katex-inline\">x\\vee x=x<\/span>、<span class=\"katex-inline\">x\\wedge x=x<\/span>；算术里 <span class=\"katex-inline\">x+x=2x<\/span>、<span class=\"katex-inline\">x\\times x=x^2<\/span>，没有对应幂等。\n<\/li><li>\n吸收：<span class=\"katex-inline\">x\\wedge(x\\vee y)=x<\/span>；算术乘法对加法没有吸收关系。\n<\/li><li>\n双向分配：<span class=\"katex-inline\">\\wedge<\/span> 对 <span class=\"katex-inline\">\\vee<\/span> 分配、<span class=\"katex-inline\">\\vee<\/span> 对 <span class=\"katex-inline\">\\wedge<\/span> 分配；算术只有乘法对加法单向分配。\n<\/li><li>\n德摩根：取反把与变或、或变与；算术取负不改变加乘层级。\n<\/ul>\n<p>记这张清单的用途是防止把小学算术习惯直接搬进布尔表达式；每写一步化简，先核对用的是哪条布尔定律。<\/p>\n<h2>延伸一层：基本运算的完备方向<\/h2>\n<p>与、或、非三者可以组合出任意布尔函数（见 c02 范式构造）；只留与、非或只留或、非同样完备。异或不能单独表达与、或，它是另一组基。这也是书里把 16 种两变量函数先列全、再挑基本运算讨论的原因：先看清全部函数空间，再选完备的小运算集合。<\/p>\n<h2>再推一层：为什么两条分配律能共存于格结构<\/h2>\n<p>把 0、1 看成序 <span class=\"katex-inline\">0&lt;1<\/span>，与对应取小、或对应取大。取小对取大分配、取大对取小分配，是格的分配格特征；普通算术的加法不是取大，乘法不是取小，所以只有单向分配。用&quot;取大取小&quot;视角回看第二分配律：<span class=\"katex-inline\">(x\\wedge y)\\vee z<\/span> 是先两组取小再与 <span class=\"katex-inline\">z<\/span> 取大，<span class=\"katex-inline\">(x\\vee z)\\wedge(y\\vee z)<\/span> 是分别与 <span class=\"katex-inline\">z<\/span> 取大后再取小，两侧在四个格点结果相同。这条视角帮助判断一条改写能不能在布尔代数里合法使用。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">x\\wedge y<\/span>、<span class=\"katex-inline\">x\\vee y<\/span> 在四种赋值下的取值表。\n<\/li><li>\n第二分配律与普通算术的乘法对加法分配，差别落在哪一步？\n<\/li><li>\n用吸收律化简 <span class=\"katex-inline\">(x\\vee y)\\wedge x<\/span>，并取两行赋值核验。\n<\/li><li>\n德摩根律翻括号时，与、或和变量取反各自怎样变化？\n<\/li><li>\n为什么 <span class=\"katex-inline\">x\\vee x=x<\/span> 不能按算术理解成 <span class=\"katex-inline\">2x<\/span>？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "两值逻辑与布尔代数基本定律"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.53<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">两值逻辑与布尔代数基本定律<\/a><\/span><\/div><h1>布尔函数、真值表与两种标准形式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch01（原书 §7.1.1–7.1.2，PDF 第 53、55 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p>给定 <span class=\"katex-inline\">n<\/span> 个二进制输入，要把&quot;什么输入组合输出 1&quot;说清楚。只列几个例子不足以定义函数；口头描述还会随说法不同产生歧义。真值表把 <span class=\"katex-inline\">2^n<\/span> 个赋值和对应输出逐行列全，函数由此被唯一确定；两种标准形式（析取范式、合取范式）再把表翻译成可化简、可求值的表达式。组合筛选、位条件判断都要先把布尔条件写成这样的确定形式。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>布尔函数<\/strong> <span class=\"katex-inline\">f(x_1,\\dots,x_n)<\/span>：输入为 <span class=\"katex-inline\">n<\/span> 个 0/1 变量，输出为 0 或 1。<\/p>\n<p><strong>真值表<\/strong>：<span class=\"katex-inline\">2^n<\/span> 行，每行列出一组赋值与函数值。两变量函数共 <span class=\"katex-inline\">2^{2^2}=16<\/span> 个；<span class=\"katex-inline\">n<\/span> 变量函数总数为 <span class=\"katex-inline\">2^{2^n}<\/span>。<\/p>\n<p><strong>最小项（minterm）<\/strong>：对一行赋值，每个变量按该行取值写正写反——取值 1 写原变量，取值 0 写其否定，全部相与。最小项只在这一行赋值下为 1。<\/p>\n<p><strong>析取范式（DNF）<\/strong>：函数值为 1 的所有行对应的最小项相或。<\/p>\n<p><strong>最大项（maxterm）<\/strong>：每个变量按取值取反相正，全部相或；最大项只在这一行赋值下为 0。<\/p>\n<p><strong>合取范式（CNF）<\/strong>：函数值为 0 的所有行对应的最大项相与。<\/p>\n<p><strong>正例<\/strong>：两变量异或 <span class=\"katex-inline\">x\\oplus y<\/span>，值为 1 的行是 <span class=\"katex-inline\">01<\/span>、<span class=\"katex-inline\">10<\/span>；DNF 为 <span class=\"katex-inline\">(\\neg x\\wedge y)\\vee(x\\wedge\\neg y)<\/span>。<\/p>\n<p><strong>反例<\/strong>：把值为 0 的行也收进 DNF 的最小项，会多出恒不为 1 的项；把 CNF 写成最小项相或，两种范式混用，表达式不再是标准形。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>DNF 与函数值一致<\/strong>。任一赋值 <span class=\"katex-inline\">a<\/span>：若 <span class=\"katex-inline\">f(a)=1<\/span>，<span class=\"katex-inline\">a<\/span> 所在行的最小项在 <span class=\"katex-inline\">a<\/span> 下为 1，相或结果为 1；若 <span class=\"katex-inline\">f(a)=0<\/span>，每个最小项只在自己那一行取 1，<span class=\"katex-inline\">a<\/span> 不等于任何取值为 1 的行，所有最小项在 <span class=\"katex-inline\">a<\/span> 下为 0，相或结果为 0。逐行对照，DNF 输出与真值表一致。<\/p>\n<p><strong>CNF 与函数值一致<\/strong>。任取赋值 <span class=\"katex-inline\">a<\/span>：若 <span class=\"katex-inline\">f(a)=0<\/span>，<span class=\"katex-inline\">a<\/span> 所在行的最大项在 <span class=\"katex-inline\">a<\/span> 下为 0，相与结果为 0；若 <span class=\"katex-inline\">f(a)=1<\/span>，<span class=\"katex-inline\">a<\/span> 不等于任何取值为 0 的行，每个最大项在 <span class=\"katex-inline\">a<\/span> 下为 1，相与结果为 1。<\/p>\n<p><strong>计数推导<\/strong>：<span class=\"katex-inline\">n<\/span> 个变量有 <span class=\"katex-inline\">2^n<\/span> 个赋值；每个赋值的输出可独立选 0 或 1，真值表有 <span class=\"katex-inline\">2^n<\/span> 个输出位，不同输出列数为 <span class=\"katex-inline\">2^{2^n}<\/span>。<span class=\"katex-inline\">n=2<\/span> 时 <span class=\"katex-inline\">2^4=16<\/span>，与书里表 1 的 16 种运算对应。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：变量取值限定 0/1；函数对全部 <span class=\"katex-inline\">2^n<\/span> 个赋值有定义。\n<\/li><li>\n失败案例 1：变量数增大后真值表行数指数增长。<span class=\"katex-inline\">n=4<\/span> 已有 16 行，<span class=\"katex-inline\">n=10<\/span> 达 1024 行；表本身不再适合手工展开，需要 BDD 等紧凑结构（见 c05）。\n<\/li><li>\n失败案例 2：范式项重复或遗漏。DNF 漏掉一个值为 1 的行，函数在该行被误判为 0；多收一个值为 0 的行，引入冗余项但不改变函数（可由吸收律消去）。\n<\/li><li>\n边界：DNF、CNF 是等价表示，不唯一；同一函数可先化简再写范式，项数可能大幅减少。范式转换只处理二值输出；多值函数、带外部状态的函数不能直接套这套单行构造。\n<\/li><li>\n读数习惯：真值表行按二进制序号从 0 到 <span class=\"katex-inline\">2^n-1<\/span> 排列，函数值列从 <span class=\"katex-inline\">f(0,\\dots,0)<\/span> 到 <span class=\"katex-inline\">f(1,\\dots,1)<\/span>；读最小项时先对齐行取值，再写正反问变量，避免行号与取值错位。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>DNF vs CNF<\/strong>：DNF 收集输出 1 的行、最小项相或；CNF 收集输出 0 的行、最大项相与。两者行集互补，运算方向相反。\n<\/li><li>\n<strong>真值表 vs 表达式<\/strong>：真值表是函数的完整定义，表达式是一种实现；同一真值表可对应多个等价表达式。\n<\/li><li>\n<strong>函数计数 vs 赋值计数<\/strong>：赋值有 <span class=\"katex-inline\">2^n<\/span> 个；函数有 <span class=\"katex-inline\">2^{2^n}<\/span> 个。两个指数层级别不要混。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的与、或、非定律是范式展开与化简的工具。后继：c03 求值网络按表达式逐步算函数；c05 BDD 是真值表的紧凑图形表示，规避表行指数膨胀；c10 组合位串中&quot;恰含 <span class=\"katex-inline\">t<\/span> 个 1&quot;的条件本身就是一个布尔函数。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（布尔函数、真值表与两种标准形式）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：真值表、范式构造全过程与计数推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把一个布尔函数写成标准形，往回追四层：<\/p>\n<ol><li>\n取值语义：输入与输出都是 0/1，一组赋值是一个长度 <span class=\"katex-inline\">n<\/span> 的位串。\n<\/li><li>\n真值表完备性：<span class=\"katex-inline\">2^n<\/span> 个赋值逐行列全，输出列唯一确定函数。\n<\/li><li>\n最小项/最大项构造：单行赋值翻译成相与的正反问变量，或相或的正反问变量。\n<\/li><li>\n范式合成：按输出 1 行拼 DNF，按输出 0 行拼 CNF；再用 c01 定律化简。\n<\/ol>\n<p>依赖链方向：赋值语义 → 列真值表 → 单行构造项 → 按行集合拼范式 → 化简与计数。<\/p>\n<h2>正向推导：从真值表到两种范式的完整步骤<\/h2>\n<p>设 <span class=\"katex-inline\">n=3<\/span>，函数 <span class=\"katex-inline\">f(x_1,x_2,x_3)<\/span> 的取值规定为：只有当 <span class=\"katex-inline\">x_1=1<\/span> 且 <span class=\"katex-inline\">x_2,x_3<\/span> 不同时输出 1。逐行列 8 行：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>行<\/th><th><span class=\"katex-inline\">x_1x_2x_3<\/span><\/th><th><span class=\"katex-inline\">f<\/span><\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>000<\/td><td>0<\/td><\/tr><tr><td>2<\/td><td>001<\/td><td>0<\/td><\/tr><tr><td>3<\/td><td>010<\/td><td>0<\/td><\/tr><tr><td>4<\/td><td>011<\/td><td>0<\/td><\/tr><tr><td>5<\/td><td>100<\/td><td>1<\/td><\/tr><tr><td>6<\/td><td>101<\/td><td>0<\/td><\/tr><tr><td>7<\/td><td>110<\/td><td>0<\/td><\/tr><tr><td>8<\/td><td>111<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>构造 DNF<\/strong>。取值为 1 的行是行 5（100）与行 8（111）。<\/p>\n<ul><li>\n行 5：<span class=\"katex-inline\">x_1=1<\/span> 写 <span class=\"katex-inline\">x_1<\/span>，<span class=\"katex-inline\">x_2=0<\/span> 写 <span class=\"katex-inline\">\\neg x_2<\/span>，<span class=\"katex-inline\">x_3=0<\/span> 写 <span class=\"katex-inline\">\\neg x_3<\/span>，最小项 <span class=\"katex-inline\">m_5=x_1\\wedge\\neg x_2\\wedge\\neg x_3<\/span>。\n<\/li><li>\n行 8：三变量都为 1，最小项 <span class=\"katex-inline\">m_8=x_1\\wedge x_2\\wedge x_3<\/span>。\n<\/li><li>\nDNF：<span class=\"katex-inline\">f=m_5\\vee m_8<\/span>。\n<\/ul>\n<p><strong>构造 CNF<\/strong>。取值为 0 的行是 1、2、3、4、6、7。逐行写最大项（取值 0 写原变量，取值 1 写否定，全部相或）：<\/p>\n<ul><li>\n行 1（000）：<span class=\"katex-inline\">M_1=\\neg x_1\\vee\\neg x_2\\vee\\neg x_3<\/span>。\n<\/li><li>\n行 2（001）：<span class=\"katex-inline\">M_2=\\neg x_1\\vee\\neg x_2\\vee x_3<\/span>。\n<\/li><li>\n行 3（010）：<span class=\"katex-inline\">M_3=\\neg x_1\\vee x_2\\vee\\neg x_3<\/span>。\n<\/li><li>\n行 4（011）：<span class=\"katex-inline\">M_4=\\neg x_1\\vee x_2\\vee x_3<\/span>。\n<\/li><li>\n行 6（101）：<span class=\"katex-inline\">M_6=x_1\\vee\\neg x_2\\vee x_3<\/span>。\n<\/li><li>\n行 7（110）：<span class=\"katex-inline\">M_7=x_1\\vee x_2\\vee\\neg x_3<\/span>。\n<\/li><li>\nCNF：<span class=\"katex-inline\">f=M_1\\wedge M_2\\wedge M_3\\wedge M_4\\wedge M_6\\wedge M_7<\/span>。\n<\/ul>\n<p><strong>核验一致性<\/strong>。取赋值 100：<span class=\"katex-inline\">m_5=1\\wedge1\\wedge1=1<\/span>，DNF 为 1；CNF 中该行不是任何最大项的专属 0 行，每个最大项在 100 下取值 1，相与为 1。取赋值 011：DNF 两个最小项都为 0，结果 0；<span class=\"katex-inline\">M_4=\\neg0\\vee1\\vee1=1\\vee1\\vee1=1<\/span>？回到 <span class=\"katex-inline\">M_4<\/span> 定义：行 4 专属 0，赋值 011 下 <span class=\"katex-inline\">M_4=0<\/span>，CNF 相与为 0，两侧一致。<\/p>\n<h2>数值算例：两变量 16 个函数的计数<\/h2>\n<p><span class=\"katex-inline\">n=2<\/span>，赋值 4 行；输出列是一个长度 4 的位串，每位可选 0 或 1，共 <span class=\"katex-inline\">2^4=16<\/span> 种。书里表 1 把 16 种逐一命名：恒假 <span class=\"katex-inline\">\\perp<\/span>、与 <span class=\"katex-inline\">\\wedge<\/span>、非与 <span class=\"katex-inline\">\\overline{\\wedge}<\/span>（nand）、左投影、右投影、异或 <span class=\"katex-inline\">\\oplus<\/span>、或 <span class=\"katex-inline\">\\vee<\/span>、非或 <span class=\"katex-inline\">\\overline{\\vee}<\/span>（nor）、等价 <span class=\"katex-inline\">\\equiv<\/span>、右补、左补、蕴含 <span class=\"katex-inline\">\\subset<\/span>、非蕴含、与非方向、恒真 <span class=\"katex-inline\">\\top<\/span>。<\/p>\n<p>取其中蕴含 <span class=\"katex-inline\">x\\subset y<\/span>：真值表 00→1，01→1，10→0，11→1。DNF 收集 1 行：<span class=\"katex-inline\">(\\neg x\\wedge\\neg y)\\vee(\\neg x\\wedge y)\\vee(x\\wedge y)<\/span>。化简：前两项提取 <span class=\"katex-inline\">\\neg x<\/span>，得 <span class=\"katex-inline\">\\neg x\\wedge(\\neg y\\vee y)=\\neg x<\/span>，再加第三项，<span class=\"katex-inline\">f=\\neg x\\vee y<\/span>。这就是蕴含的常见写法，说明范式可经吸收与排中化简到短式。<\/p>\n<p><strong>第二算例：函数个数分层<\/strong>。<span class=\"katex-inline\">n=1<\/span>：赋值 2 个，函数 <span class=\"katex-inline\">2^2=4<\/span> 个（恒 0、恒 1、原变量、否定）。<span class=\"katex-inline\">n=2<\/span>：16 个。<span class=\"katex-inline\">n=3<\/span>：<span class=\"katex-inline\">2^8=256<\/span> 个。层级为 <span class=\"katex-inline\">2^n<\/span> 个赋值、<span class=\"katex-inline\">2^{2^n}<\/span> 个函数，两层指数。<\/p>\n<h2>延伸推演：为什么 DNF 项数会偏多<\/h2>\n<p>DNF 按&quot;输出 1 的行&quot;收集最小项；函数输出 1 的行接近一半时，项数随行数增长。化简靠 c01 的吸收律与合并律：两个最小项只差一个变量的正反问，可合并成消去该变量的一项。异或的 DNF 有两项，合并空间小；多数表决函数的 DNF 项数接近 <span class=\"katex-inline\">\\binom n{\\lfloor n/2\\rfloor}<\/span>，这也是后面需要 BDD 等紧凑表示的原因之一。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>漏行<\/strong>。构造 DNF 时漏掉行 8（111），赋值 111 下 <span class=\"katex-inline\">m_5=1\\wedge0\\wedge0=0<\/span>，DNF 输出 0，而真值表要求 1；函数在该行出错。<\/p>\n<p><strong>项内正反写反<\/strong>。行 5（100）若把 <span class=\"katex-inline\">\\neg x_2<\/span> 写成 <span class=\"katex-inline\">x_2<\/span>，最小项在 110 下也可能取 1，与&quot;只在本行取 1&quot;的定义不符，引入误判为 1 的赋值。<\/p>\n<p><strong>CNF 与 DNF 行集混用<\/strong>。把输出 0 的行写进 DNF，最小项在对应赋值下本应为 0，相或后不影响结果但产生冗余；把输出 1 的行写进 CNF，最大项在该赋值下本应为 1，相与后不影响结果同样冗余。两类错误都靠行集归属核对发现。<\/p>\n<h2>对抗性追问：范式唯一吗<\/h2>\n<p>不唯一。真值表唯一，但表达式不唯一：先化简再写范式，项数可以更少；不同化简路径得到的 DNF 形式也可能不同。范式&quot;标准&quot;指结构规则固定（最小项相或 / 最大项相与），不指项数最少。最小项数最小化是另一个独立问题。<\/p>\n<h2>第二算例：三变量函数的双范式完整展开<\/h2>\n<p>设 <span class=\"katex-inline\">h(x_1,x_2,x_3)<\/span> 在赋值 <span class=\"katex-inline\">001,100,111<\/span> 时为 1，其余为 0。<\/p>\n<p><strong>DNF<\/strong>（收集 1 行）：<\/p>\n<ul><li>\n001：<span class=\"katex-inline\">(\\neg x_1\\wedge\\neg x_2\\wedge x_3)<\/span>\n<\/li><li>\n100：<span class=\"katex-inline\">(x_1\\wedge\\neg x_2\\wedge\\neg x_3)<\/span>\n<\/li><li>\n111：<span class=\"katex-inline\">(x_1\\wedge x_2\\wedge x_3)<\/span>\n<\/ul>\n<p><span class=\"katex-inline\">h=<\/span> 三项相或。<strong>CNF<\/strong>（收集其余 5 行的最大项相与）：000、010、011、101、110 各写一个最大项相或，再全部相与。两条范式描述同一个 <span class=\"katex-inline\">h<\/span>；行数互补，DNF 三项、CNF 五项。<\/p>\n<p><strong>合并方向<\/strong>：DNF 中两个最小项只差一个变量正反，可合并消去该变量。本例三项没有可直接合并的相邻最小项；若函数取值更集中，合并后项数明显下降。<\/p>\n<h2>函数计数分层表<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>变量数 <span class=\"katex-inline\">n<\/span><\/th><th>赋值数 <span class=\"katex-inline\">2^n<\/span><\/th><th>函数数 <span class=\"katex-inline\">2^{2^n}<\/span><\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>2<\/td><td>4<\/td><\/tr><tr><td>2<\/td><td>4<\/td><td>16<\/td><\/tr><tr><td>3<\/td><td>8<\/td><td>256<\/td><\/tr><tr><td>4<\/td><td>16<\/td><td>65536<\/td><\/tr><\/tbody><\/table><\/div>\n<p>两层指数：先数赋值，再给每个赋值独立选输出。报&quot;有多少种布尔函数&quot;时用第二列，报&quot;一张表有多少行&quot;时用第一列。<\/p>\n<h2>范式转换的固定步骤<\/h2>\n<ol><li>\n列全 <span class=\"katex-inline\">2^n<\/span> 行赋值，标出每行函数值。\n<\/li><li>\nDNF：值为 1 的行写最小项（取值 1 写原变量，0 写否定，相与），全部相或。\n<\/li><li>\nCNF：值为 0 的行写最大项（取值 0 写原变量，1 写否定，相或），全部相与。\n<\/li><li>\n化简：用吸收、合并消去冗余项与重复变量。\n<\/ol>\n<p>步骤 2 与步骤 3 的行集互补，做完一侧可对照另一侧检查有没有漏行。<\/p>\n<h2>范式与化简的衔接示例<\/h2>\n<p>取函数 <span class=\"katex-inline\">f=(x\\wedge y)\\vee(x\\wedge\\neg y)<\/span>。DNF 两项：最小项 <span class=\"katex-inline\">xy<\/span> 与 <span class=\"katex-inline\">x\\neg y<\/span>。两项只差 <span class=\"katex-inline\">y<\/span> 的正反，合并消去 <span class=\"katex-inline\">y<\/span>，得 <span class=\"katex-inline\">f=x<\/span>。核验两行：<span class=\"katex-inline\">x=0<\/span> 两项都灭，<span class=\"katex-inline\">f=0<\/span>；<span class=\"katex-inline\">x=1<\/span> 两项随 <span class=\"katex-inline\">y<\/span> 一亮一灭，相或恒为 1。合并后 DNF 从两项压到一项。<\/p>\n<h2>常见读数错误<\/h2>\n<ul><li>\n把最大项写成最小项的相与形式：最大项是相或，相与是最小项结构，混用会把 CNF 写成 DNF。\n<\/li><li>\n行取值对错位：最小项里变量按行取值取反写反，会让该项在别的赋值下也取 1。\n<\/li><li>\n漏看恒假、恒真函数：恒假函数 DNF 为空，恒真函数 CNF 为空；这两种边界函数不能硬凑项。\n<\/ul>\n<h2>函数空间大小的实际含义<\/h2>\n<p><span class=\"katex-inline\">n=3<\/span> 时 256 个函数，手工列真值表尚可；<span class=\"katex-inline\">n=6<\/span> 时函数数达 <span class=\"katex-inline\">2^{64}<\/span> 量级，不可能逐个枚举。这正是 c03 求值网络与 c05 BDD 出现的背景：不在函数空间里逐个找，而是针对给定函数构造紧凑表示。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n<span class=\"katex-inline\">n=3<\/span> 时有多少个赋值、多少个布尔函数？两层指数各是什么？\n<\/li><li>\n写出与函数 <span class=\"katex-inline\">x\\wedge y<\/span> 的 DNF 与 CNF，各收集哪些行？\n<\/li><li>\n最小项为什么只在一行赋值下为 1？最大项为什么只在一行下为 0？\n<\/li><li>\n蕴含 <span class=\"katex-inline\">\\neg x\\vee y<\/span> 的 DNF 经哪一步化简从三项变成两项？\n<\/li><li>\n漏写一个输出 1 的行，函数在该行被误判成什么？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "布尔函数、真值表与两种标准形式"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.93<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">布尔函数、真值表与两种标准形式<\/a><\/span><\/div><h1>布尔函数求值网络：函数链、多路复用器与函数计数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch01（原书 §7.1.2，PDF 第 93 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p>函数写出来之后，机器要按什么顺序把它算出来？直接在真值表上查输出，表行随 <span class=\"katex-inline\">2^n<\/span> 膨胀；把表达式一次整体求值，中间结果没有落点。函数链把求值拆成一串有编号的中间结点，每个新结点只对两个旧结点施加一种运算，既固定了求值顺序，也便于统计网络用了多少步、多少种门。组合算法里的条件判断、集合成员判定，落到机器层都是这类求值网络。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>函数链<\/strong>：初始变量 <span class=\"katex-inline\">x_1,\\dots,x_n<\/span>；逐步补充 <span class=\"katex-inline\">x_{n+1},\\dots,x_{n+r}<\/span>，每个新结点写成<\/p>\n<div class=\"katex-block\">x_i=x_j\\circ x_k,\\qquad 1\\le j,k&lt;i\\le n+r,<\/div>\n<p>其中 <span class=\"katex-inline\">\\circ<\/span> 是 §7.1.1 的 16 种二元运算之一。<\/p>\n<p><strong>编号约束<\/strong>：<span class=\"katex-inline\">j,k&lt;i<\/span>，被引用的结点编号更早；求值时旧结点已算出，新结点才能接着算。<\/p>\n<p><strong>多路复用器（multiplexer）<\/strong>：函数在选择输入 <span class=\"katex-inline\">x_j<\/span> 为 1 时取 <span class=\"katex-inline\">x_k<\/span>，为 0 时取另一路输入；形式上可写成 <span class=\"katex-inline\">(x_j\\wedge x_k)\\vee(\\neg x_j\\wedge x_l)<\/span> 一类的选择结构。<\/p>\n<p><strong>链长与门种<\/strong>：<span class=\"katex-inline\">r<\/span> 为新增结点数；每步选用的运算类型决定网络用到哪些门。§7.1.2 提示，链上可采用简化记号（如 NOTBUT），关键在于无论记号如何，每一步都是两个先前结果的布尔组合。<\/p>\n<p><strong>正例<\/strong>：两条三变量链<\/p>\n<div class=\"katex-block\">x_4=x_1\\wedge x_2,\\quad x_5=x_1\\wedge x_3,\\quad x_6=x_4\\vee x_5,<\/div>\n<p><span class=\"katex-inline\">x_4,x_5<\/span> 引用 <span class=\"katex-inline\">x_1,x_2,x_3<\/span>，<span class=\"katex-inline\">x_6<\/span> 引用更早的 <span class=\"katex-inline\">x_4,x_5<\/span>，编号顺序成立。<\/p>\n<p><strong>反例<\/strong>：写 <span class=\"katex-inline\">x_4=x_2\\wedge x_5<\/span> 而 <span class=\"katex-inline\">x_5<\/span> 编号晚于 <span class=\"katex-inline\">x_4<\/span>，引用了未来结点；求值顺序出现循环依赖，链不再是有向无环结构。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>求值顺序可行<\/strong>：归纳看结点编号。初始 <span class=\"katex-inline\">x_1,\\dots,x_n<\/span> 已知；假设编号小于 <span class=\"katex-inline\">i<\/span> 的结点都已算出，<span class=\"katex-inline\">x_i<\/span> 的两个引用 <span class=\"katex-inline\">j,k&lt;i<\/span> 已在其中，运算可得 <span class=\"katex-inline\">x_i<\/span>。由编号归纳，到 <span class=\"katex-inline\">x_{n+r}<\/span> 时整条链求值完成。<\/p>\n<p><strong>网络规模口径<\/strong>：链长 <span class=\"katex-inline\">r<\/span> 是新增结点数；若只允许使用固定几种运算，所选门种影响实现代价。计数方向：函数总数为 <span class=\"katex-inline\">2^{2^n}<\/span>，而长度 <span class=\"katex-inline\">r<\/span> 的链能构造出的函数数目受限于运算选择空间——网络越短，能表达的函数越有限；要实现任意函数，链长与门种需要足够余量。<\/p>\n<p><strong>多路复用器展开<\/strong>：选择条件 <span class=\"katex-inline\">s<\/span> 为 1 取 <span class=\"katex-inline\">a<\/span>、为 0 取 <span class=\"katex-inline\">b<\/span>，写成 <span class=\"katex-inline\">(s\\wedge a)\\vee(\\neg s\\wedge b)<\/span>。<span class=\"katex-inline\">s=1<\/span> 时第二项为 0、第一项为 <span class=\"katex-inline\">a<\/span>；<span class=\"katex-inline\">s=0<\/span> 时第一项为 0、第二项为 <span class=\"katex-inline\">b<\/span>，两侧取值符合选择语义。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：函数可分解为二元运算的组合；每步两个操作数都是已算结点或原始变量。\n<\/li><li>\n失败案例 1：引用未来结点。<span class=\"katex-inline\">j<\/span> 或 <span class=\"katex-inline\">k<\/span> 大于等于 <span class=\"katex-inline\">i<\/span> 时依赖回绕，手算无法定序，机器执行死锁或重复计算。\n<\/li><li>\n失败案例 2：把链长当函数复杂度下界。同一函数可有长短不同的链；链长是某一实现的规模，不是函数本身的固有复杂度，比较代价要固定门种与计数口径。\n<\/li><li>\n边界：16 种运算可任选时表达力强；限制门种后，某些函数需要更多结点才能拼出。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>函数链 vs 真值表<\/strong>：真值表静态列出全部输入输出；链是动态求值过程，按选定赋值逐步算结果。表是定义，链是实现。\n<\/li><li>\n<strong>链长 vs 变量数<\/strong>：变量数 <span class=\"katex-inline\">n<\/span> 是输入宽度；链长 <span class=\"katex-inline\">r<\/span> 是中间运算步数，两者度量不同。\n<\/li><li>\n<strong>多路复用器 vs 与或门级联<\/strong>：复用器是选择结构的整体称呼；展开后仍是与、或、非的组合。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 运算定律决定每步可选的 <span class=\"katex-inline\">\\circ<\/span>；c02 真值表给出函数目标，链是逼近该函数的一条实现路径。后继：c05 BDD 用图形分支替代逐结点链，共享相同子函数；c04 按位运算把单步布尔组合并行施加到整串位上。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（布尔函数求值网络：函数链、多路复用器与函数计数）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：函数链编号不变量、多路复用器展开与规模边界推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把求值网络拆开看，往回追四层：<\/p>\n<ol><li>\n输入已知：<span class=\"katex-inline\">x_1,\\dots,x_n<\/span> 是原始变量，取值由外部给定。\n<\/li><li>\n结点规则：每个新结点 <span class=\"katex-inline\">x_i=x_j\\circ x_k<\/span>，<span class=\"katex-inline\">j,k&lt;i<\/span>，只引用更早结点。\n<\/li><li>\n编号归纳：按编号从小到大求值，被引用者先算，当前结点后算。\n<\/li><li>\n规模与表达力：链长 <span class=\"katex-inline\">r<\/span>、门种集合决定网络能表达哪些函数；函数总数对照网络表达空间。\n<\/ol>\n<p>依赖链方向：输入集合 → 结点引用规则 → 编号顺序归纳 → 逐步求值 → 规模与计数对照。<\/p>\n<h2>正向推导：编号不变量怎样保证可求值<\/h2>\n<p><strong>不变量<\/strong>：对编号 <span class=\"katex-inline\">i<\/span>，所有引用下标 <span class=\"katex-inline\">j,k<\/span> 都满足 <span class=\"katex-inline\">j,k&lt;i<\/span>。<\/p>\n<p>归纳基础：<span class=\"katex-inline\">i\\le n<\/span> 的结点是原始变量，无需引用，取值已知。<\/p>\n<p>归纳步：假设编号 <span class=\"katex-inline\">1,\\dots,i-1<\/span> 的结点都已求值；<span class=\"katex-inline\">x_i<\/span> 的两个操作数 <span class=\"katex-inline\">x_j,x_k<\/span> 编号小于 <span class=\"katex-inline\">i<\/span>，已在已求值集合内，施加运算 <span class=\"katex-inline\">\\circ<\/span> 即得 <span class=\"katex-inline\">x_i<\/span>。于是编号 <span class=\"katex-inline\">i<\/span> 也可求值。<\/p>\n<p>归纳到 <span class=\"katex-inline\">i=n+r<\/span>，全链求值完成。这条不变量同时排除了循环依赖：若出现 <span class=\"katex-inline\">j\\ge i<\/span> 或 <span class=\"katex-inline\">k\\ge i<\/span>，归纳步无法把该操作数归入已求值集合，链条断裂。<\/p>\n<h2>数值算例：一条完整链的逐结点手算<\/h2>\n<p>设链：<\/p>\n<pre><code>x4 = x1 ∧ x2\nx5 = x1 ∧ x3\nx6 = x4 ∨ x5\nx7 = ¬x6<\/code><\/pre>\n<p>取赋值 <span class=\"katex-inline\">x_1=1,\\ x_2=0,\\ x_3=1<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">x_4=1\\wedge0=0<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">x_5=1\\wedge1=1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">x_6=0\\vee1=1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">x_7=\\neg1=0<\/span>。\n<\/ol>\n<p>再取赋值 <span class=\"katex-inline\">x_1=1,\\ x_2=1,\\ x_3=0<\/span>：<span class=\"katex-inline\">x_4=1\\wedge1=1<\/span>；<span class=\"katex-inline\">x_5=1\\wedge0=0<\/span>；<span class=\"katex-inline\">x_6=1\\vee0=1<\/span>；<span class=\"katex-inline\">x_7=0<\/span>。<\/p>\n<p><strong>第二算例：多路复用器链<\/strong>。选择输入 <span class=\"katex-inline\">s=x_1<\/span>，两路数据 <span class=\"katex-inline\">a=x_2<\/span>、<span class=\"katex-inline\">b=x_3<\/span>，链：<\/p>\n<pre><code>x4 = x1 ∧ x2\nx5 = ¬x1\nx6 = x5 ∧ x3\nx7 = x4 ∨ x6<\/code><\/pre>\n<p><span class=\"katex-inline\">s=1<\/span>（<span class=\"katex-inline\">x_1=1<\/span>）：<span class=\"katex-inline\">x_4=a<\/span>；<span class=\"katex-inline\">x_5=0<\/span>；<span class=\"katex-inline\">x_6=0<\/span>；<span class=\"katex-inline\">x_7=a<\/span>。<span class=\"katex-inline\">s=0<\/span>：<span class=\"katex-inline\">x_4=0<\/span>；<span class=\"katex-inline\">x_5=1<\/span>；<span class=\"katex-inline\">x_6=b<\/span>；<span class=\"katex-inline\">x_7=b<\/span>。选择语义成立，链长 <span class=\"katex-inline\">r=4<\/span>。<\/p>\n<h2>延伸推演：链能表达多少函数（量级方向）<\/h2>\n<p><span class=\"katex-inline\">n<\/span> 变量函数共 <span class=\"katex-inline\">2^{2^n}<\/span> 个。长度为 <span class=\"katex-inline\">r<\/span> 的链，每个新结点从已有结点中选两个操作数、从门种集合中选一种运算；操作数对与门种的选择数随 <span class=\"katex-inline\">r<\/span> 增长。短链能构造的函数数目远小于函数总数，多数函数需要更长链。这一方向解释了为什么 §7.1.2 要讨论求值的有效方法：真值表可直接查输出，但表行随 <span class=\"katex-inline\">2^n<\/span> 膨胀；链用中间结果压缩计算过程，代价是要为每个函数找到短而合理的结点序列。<\/p>\n<p>对照 c02：函数计数是两层指数（<span class=\"katex-inline\">2^n<\/span> 个赋值、<span class=\"katex-inline\">2^{2^n}<\/span> 个函数）；链长是实现度量，不进入函数总数公式。两者分开统计，避免把&quot;有多少函数&quot;与&quot;一个函数要几步算完&quot;混在一起。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>引用未来结点<\/strong>。若把 <span class=\"katex-inline\">x_4=x_2\\wedge x_5<\/span> 写在 <span class=\"katex-inline\">x_5=x_1\\vee x_3<\/span> 之前，<span class=\"katex-inline\">x_5<\/span> 尚未求值；按编号归纳，<span class=\"katex-inline\">j=5\\ge i=4<\/span> 不满足不变量。执行时先算 <span class=\"katex-inline\">x_4<\/span> 取不到 <span class=\"katex-inline\">x_5<\/span>，顺序重排后 <span class=\"katex-inline\">x_5<\/span> 又可能引用 <span class=\"katex-inline\">x_4<\/span>，形成环。<\/p>\n<p><strong>门种记号替换出错<\/strong>。链上可用简化记号（如 NOTBUT 类），替换回标准与、或、非时若漏写一路取反，多路复用器在 <span class=\"katex-inline\">s=0<\/span> 分支取错数据。核验方式：把展开式代回两种 <span class=\"katex-inline\">s<\/span> 取值，分别核对选中的是哪一路。<\/p>\n<p><strong>把链长当固有下界<\/strong>。同一函数可先化简（c01 吸收、合并）再建链，短链可能覆盖长链的功能；报告代价时要写明固定的门种集合与计数口径，否则不同实现之间的 <span class=\"katex-inline\">r<\/span> 不可比。<\/p>\n<h2>对抗性追问：链为什么必须是二元运算<\/h2>\n<p>书里的链规则限定 <span class=\"katex-inline\">x_j\\circ x_k<\/span> 两个操作数。若允许三元门，单步可表达三变量函数，链长下降；但门种集合扩大，硬件实现与代价计数口径都要重定。二元约定把每步动作压到最基本的两个旧结果组合，与 §7.1.1 的二元运算表直接对应。换用多元门属于改变模型，不能在同一链长口径下比较。<\/p>\n<h2>第二算例：另一条三变量链逐结点核验<\/h2>\n<p>设链：<\/p>\n<pre><code>x4 = x2 ∨ x3\nx5 = x1 ∧ x4\nx6 = ¬x5<\/code><\/pre>\n<p>取赋值 <span class=\"katex-inline\">x_1=0,\\ x_2=1,\\ x_3=0<\/span>：<\/p>\n<ol><li>\n<span class=\"katex-inline\">x_4=1\\vee0=1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">x_5=0\\wedge1=0<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">x_6=\\neg0=1<\/span>。\n<\/ol>\n<p>取赋值 <span class=\"katex-inline\">x_1=1,\\ x_2=0,\\ x_3=0<\/span>：<span class=\"katex-inline\">x_4=0\\vee0=0<\/span>；<span class=\"katex-inline\">x_5=1\\wedge0=0<\/span>；<span class=\"katex-inline\">x_6=1<\/span>。取赋值 <span class=\"katex-inline\">x_1=1,\\ x_2=1,\\ x_3=0<\/span>：<span class=\"katex-inline\">x_4=1<\/span>；<span class=\"katex-inline\">x_5=1<\/span>；<span class=\"katex-inline\">x_6=0<\/span>。三条赋值覆盖 <span class=\"katex-inline\">x_4<\/span> 为 0/1、<span class=\"katex-inline\">x_5<\/span> 为 0/1 的分支，链上每步引用的都是更早编号结点。<\/p>\n<h2>多路复用器四组赋值对照<\/h2>\n<p>选择 <span class=\"katex-inline\">s=x_1<\/span>，数据 <span class=\"katex-inline\">a=x_2<\/span>、<span class=\"katex-inline\">b=x_3<\/span>，函数 <span class=\"katex-inline\">M=(s\\wedge a)\\vee(\\neg s\\wedge b)<\/span>。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><span class=\"katex-inline\">s<\/span><\/th><th><span class=\"katex-inline\">a<\/span><\/th><th><span class=\"katex-inline\">b<\/span><\/th><th>输出<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>0<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p><span class=\"katex-inline\">s=0<\/span> 行输出等于 <span class=\"katex-inline\">b<\/span>，<span class=\"katex-inline\">s=1<\/span> 行输出等于 <span class=\"katex-inline\">a<\/span>；选择语义在四组赋值上成立。展开成链需要两个与结点、一个取反结点、一个或结点，共 4 个新增中间结果。<\/p>\n<h2>门种限制对链长的影响<\/h2>\n<p>若只允许与、或、非三种门，异或、蕴含等函数要拆成多个基本门组合，链长上升；若把 16 种运算都列为可选门种，单步可直接用复合运算，链长下降。报告一条链用了多少步时，必须写明门种集合；不同门种下的结点数不能直接比较。这与 c01 的运算基讨论衔接：基本运算选得越少，表达同一函数需要的中间结点越多。<\/p>\n<h2>编号规则再核<\/h2>\n<p><span class=\"katex-inline\">x_i=x_j\\circ x_k<\/span> 中 <span class=\"katex-inline\">j,k&lt;i<\/span> 是硬约束。回看两条算例链：<span class=\"katex-inline\">x_4<\/span> 引用 <span class=\"katex-inline\">x_1,x_2,x_3<\/span>，<span class=\"katex-inline\">x_5<\/span> 引用 <span class=\"katex-inline\">x_1<\/span> 与 <span class=\"katex-inline\">x_4<\/span>，<span class=\"katex-inline\">x_6<\/span> 引用 <span class=\"katex-inline\">x_5<\/span>，被引编号都小于当前编号。若新增结点要引用更晚编号的结果，说明构造顺序写反了，应先把被引用结点排到前面。<\/p>\n<h2>第三条链：异或怎样由基本门拼出<\/h2>\n<p>异或 <span class=\"katex-inline\">x\\oplus y=(x\\wedge\\neg y)\\vee(\\neg x\\wedge y)<\/span>。拆成链：<\/p>\n<pre><code>u1 = ¬x\nu2 = ¬y\nu3 = x ∧ u2\nu4 = u1 ∧ y\nu5 = u3 ∨ u4<\/code><\/pre>\n<p>五处新增结点。代入四行核验：<span class=\"katex-inline\">00\\to u3=0,u4=0,u5=0<\/span>；<span class=\"katex-inline\">01\\to u3=0,u4=1,u5=1<\/span>；<span class=\"katex-inline\">10\\to u3=1,u4=0,u5=1<\/span>；<span class=\"katex-inline\">11\\to u3=0,u4=0,u5=0<\/span>，与异或一致。若门种集合直接包含异或，单步即可；拆成与、或、非则需要上面五条结点。<\/p>\n<h2>链长统计口径复盘<\/h2>\n<p>链长 <span class=\"katex-inline\">r<\/span> 数的是新增中间结点数，不算原始输入结点。比较两条链时，先固定门种集合，再数结点；一条用复合门、一条只用基本门，结点数不可比。书里提示链上可采用简化记号（NOTBUT 类），记号替换回标准门种时不能丢掉取反支路，否则选择函数在某一分支出错。<\/p>\n<h2>求值与查表的分工<\/h2>\n<p>真值表适合小规模函数直接查输出；函数链适合按给定赋值逐步算，中间结果可复用。同一函数两条路线：表是静态定义，链是动态实现。变量数增大后表行膨胀，链的中间结点也可能重复，这为 BDD 的共享结构留出位置。<\/p>\n<h2>编号归纳的边界<\/h2>\n<p><span class=\"katex-inline\">j,k&lt;i<\/span> 保证按编号从小到大可求值；若图结构允许同一后继被多个前驱引用（共享子树），编号仍需满足被引在先。链是线性序列，BDD 是带共享的图，两者引用规则方向一致，都是先有结果再被引用。<\/p>\n<h2>链构造的实际顺序<\/h2>\n<p>写一条链时先列原始变量 <span class=\"katex-inline\">x_1,\\dots,x_n<\/span>，再按编号从小到大补中间结点；每个新结点的两个操作数必须已经在前面出现。构造完成后反向核验：逐个结点检查 <span class=\"katex-inline\">j,k&lt;i<\/span>，找不到未来引用再交付求值。若中途发现某步要引用尚未定义的结果，把该结果结点前移到被引位置。<\/p>\n<h2>求值顺序小结<\/h2>\n<p>链上每个结点只做一次二元运算，结果编号固定；求值按编号升序推进，被引用者先算。写实现时把链存成结点表，逐条记录操作数编号与运算种类，运行时按表顺序取值，不必递归回溯。这一表式结构也是后面 BDD 用字段表表示结点的前驱形态。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出函数链的编号约束 <span class=\"katex-inline\">j,k&lt;i<\/span>，说明它排除了哪类依赖。\n<\/li><li>\n按编号归纳证明：初始变量已知时，全链可逐步求值。\n<\/li><li>\n把选择函数 <span class=\"katex-inline\">(s\\wedge a)\\vee(\\neg s\\wedge b)<\/span> 拆成结点链，标出每个新结点引用哪些旧结点。\n<\/li><li>\n链长 <span class=\"katex-inline\">r<\/span> 与变量数 <span class=\"katex-inline\">n<\/span> 各度量什么？为什么不能互相比大小？\n<\/li><li>\n引用未来结点时，编号归纳在哪一步失效？会形成什么结构？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "布尔函数求值网络：函数链、多路复用器与函数计数"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.125<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">两值逻辑与布尔代数基本定律<\/a><\/span><\/div><h1>按位运算：与/或/异或、包含关系与常用位技巧<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch02（原书 §7.1.3，PDF 第 125 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p>集合用位串表示后，成员判断、子集筛选、元素增减都要在一整串位上同时完成。逐位查循环太慢；按位运算把 c01 的布尔规则一次施加到整数的每一位，用一条机器指令完成整串组合。组合枚举里标记选中元素、提取最低位 1、判断两个位集合是否包含，都依赖这一组运算。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>二进制记法 <span class=\"katex-inline\">x=(\\dots x_2x_1x_0)_2<\/span>，<span class=\"katex-inline\">y=(\\dots y_2y_1y_0)_2<\/span>，<span class=\"katex-inline\">z=(\\dots z_2z_1z_0)_2<\/span>：<\/p>\n<ul><li>\n<strong>与<\/strong>：<span class=\"katex-inline\">x\\&amp;y=z<\/span> 当且仅当每位 <span class=\"katex-inline\">x_k\\wedge y_k=z_k<\/span>。\n<\/li><li>\n<strong>或<\/strong>：<span class=\"katex-inline\">x\\mid y=z<\/span> 当且仅当每位 <span class=\"katex-inline\">x_k\\vee y_k=z_k<\/span>。\n<\/li><li>\n<strong>异或<\/strong>：<span class=\"katex-inline\">x\\oplus y=z<\/span> 当且仅当每位 <span class=\"katex-inline\">x_k\\oplus y_k=z_k<\/span>，即两位不同时该位为 1。\n<\/ul>\n<p><strong>定律继承<\/strong>：与、或在每位上保持交换、结合、幂等、吸收；异或保持交换、结合，且 <span class=\"katex-inline\">x\\oplus x=0<\/span>、<span class=\"katex-inline\">x\\oplus0=x<\/span>。书里提示与、或最好分别记作 <span class=\"katex-inline\">\\wedge<\/span>、<span class=\"katex-inline\">\\vee<\/span> 以避开整数算术记号；<span class=\"katex-inline\">\\oplus<\/span> 有久远历史，描述尼姆游戏中的一种取胜策略。<\/p>\n<p><strong>包含关系<\/strong>：<span class=\"katex-inline\">x\\subseteq y<\/span> 指 <span class=\"katex-inline\">x<\/span> 的每个 1 位都在 <span class=\"katex-inline\">y<\/span> 中为 1。等价写法：<span class=\"katex-inline\">x\\&amp;y=x<\/span>、<span class=\"katex-inline\">x\\mid y=y<\/span>、<span class=\"katex-inline\">x\\&amp;\\bar y=0<\/span>。<\/p>\n<p><strong>常用位技巧方向<\/strong>：提取最低位的 1、清除最低位 1、判断奇偶、统计 1 的个数，都可由基本按位式组合得到。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">5\\&amp;11=1<\/span>（<span class=\"katex-inline\">101_2\\&amp;1011_2=0001_2<\/span>）；<span class=\"katex-inline\">5\\oplus11=14<\/span>（<span class=\"katex-inline\">101_2\\oplus1011_2=1110_2<\/span>）。<\/p>\n<p><strong>反例<\/strong>：把异或当加法——<span class=\"katex-inline\">1\\oplus1=0<\/span> 而不是 <span class=\"katex-inline\">2<\/span>；异或不满足吸收律，<span class=\"katex-inline\">x\\oplus(x\\&amp;y)<\/span> 不能化简成 <span class=\"katex-inline\">x<\/span>。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>逐位独立性<\/strong>：每位 <span class=\"katex-inline\">z_k<\/span> 只由 <span class=\"katex-inline\">x_k,y_k<\/span> 经同一布尔运算决定，位与位之间不进位、不借位。因此 c01 中每位成立的交换律、结合律、分配律原样提升到整数层。<\/p>\n<p><strong>包含等价性<\/strong>：<span class=\"katex-inline\">x\\subseteq y<\/span> 定义为每位 <span class=\"katex-inline\">x_k=1\\Rightarrow y_k=1<\/span>。若该条件成立，<span class=\"katex-inline\">x_k\\&amp;y_k=x_k<\/span>，即 <span class=\"katex-inline\">x\\&amp;y=x<\/span>；<span class=\"katex-inline\">x_k\\mid y_k=y_k<\/span>，即 <span class=\"katex-inline\">x\\mid y=y<\/span>；<span class=\"katex-inline\">x_k\\&amp;\\bar y_k=0<\/span>，即 <span class=\"katex-inline\">x\\&amp;\\bar y=0<\/span>。三式都回到同一条逐位条件，可互相替换。<\/p>\n<p><strong>异或的互补性质<\/strong>：<span class=\"katex-inline\">x\\oplus x=0<\/span> 每位 <span class=\"katex-inline\">x_k\\oplus x_k=0<\/span>；由此 <span class=\"katex-inline\">x\\oplus y=0<\/span> 当且仅当 <span class=\"katex-inline\">x=y<\/span>。连续两次异或同一数还原：<span class=\"katex-inline\">(x\\oplus y)\\oplus y=x<\/span>。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：操作数按无符号二进制位解释；负数在机器上用补码表示，书里提示与、或作用于无限精度数位时，负号位按补码语义延续。\n<\/li><li>\n失败案例 1：把按位或当算术加。<span class=\"katex-inline\">1\\mid1=1<\/span>，<span class=\"katex-inline\">1+1=2<\/span>；两数有重叠位时或结果小于加结果。\n<\/li><li>\n失败案例 2：按位与/或用于需要进位的求和。进位在算术加法中传播，按位运算不处理进位；求和要用算术加或专门的全加器链。\n<\/li><li>\n边界：包含关系判断的是位集合子集，不是整数数值大小；<span class=\"katex-inline\">x\\subseteq y<\/span> 不蕴含 <span class=\"katex-inline\">x\\le y<\/span>。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>异或 vs 或<\/strong>：或在两位任一为 1 时取 1；异或只在两位不同时取 1。<span class=\"katex-inline\">1\\vee1=1<\/span>，<span class=\"katex-inline\">1\\oplus1=0<\/span>。\n<\/li><li>\n<strong>按位运算 vs 算术运算<\/strong>：按位不进位，算术进位传播；运算表与用途都不同。\n<\/li><li>\n<strong>包含关系 vs 数值比较<\/strong>：<span class=\"katex-inline\">x\\subseteq y<\/span> 是子集判断，<span class=\"katex-inline\">x\\le y<\/span> 是大小比较；同一对整数两种结论可能不一致。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的布尔定律是按位运算的每位依据。后继：c07 用位串表示 n 元组，格雷码相邻差一位在按位异或上体现为结果只含一个 1；c10 组合用&quot;恰含 <span class=\"katex-inline\">t<\/span> 个 1 的位串&quot;表示，成员筛选走包含关系与按位与。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（按位运算：与/或/异或、包含关系与常用位技巧）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：逐位运算推演、包含关系三式互证与常用位技巧拆解<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>按位运算是怎样从布尔代数长出来的，往回追四层：<\/p>\n<ol><li>\n布尔取值：每位只能取 0/1，与、或、非、异或在一位上的取值表已由 c01 固定。\n<\/li><li>\n位串表示：整数写成 <span class=\"katex-inline\">(\\dots x_2x_1x_0)_2<\/span>，每位对应集合的一个成员标志。\n<\/li><li>\n逐位施加：同一种布尔运算在每一位独立施加，位间不进位、不借位。\n<\/li><li>\n关系与技巧：包含关系由逐位条件写成三种按位等式；提取标志位、计数 1 等技巧由基本式组合。\n<\/ol>\n<p>依赖链方向：一位布尔表 → 多位位串 → 逐位独立运算 → 子集关系 → 位级组合技巧。<\/p>\n<h2>正向推导：两个整数的三种按位结果逐位算<\/h2>\n<p>取 <span class=\"katex-inline\">x=5=(0101)_2<\/span>，<span class=\"katex-inline\">y=11=(1011)_2<\/span>，按位对齐到四位：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>位 <span class=\"katex-inline\">k<\/span><\/th><th><span class=\"katex-inline\">x_k<\/span><\/th><th><span class=\"katex-inline\">y_k<\/span><\/th><th><span class=\"katex-inline\">x_k\\&amp;y_k<\/span><\/th><th><span class=\"katex-inline\">x_k\\mid y_k<\/span><\/th><th><span class=\"katex-inline\">x_k\\oplus y_k<\/span><\/th><\/tr><\/thead><tbody><tr><td>3<\/td><td>0<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>2<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>1<\/td><td>1<\/td><td>1<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div>\n<p>读回整数：<span class=\"katex-inline\">x\\&amp;y=0001_2=1<\/span>；<span class=\"katex-inline\">x\\mid y=1111_2=15<\/span>；<span class=\"katex-inline\">x\\oplus y=1110_2=14<\/span>。<\/p>\n<p>核验异或互补方向：<span class=\"katex-inline\">x\\oplus y=14<\/span>，再与 <span class=\"katex-inline\">y=11<\/span> 异或：<span class=\"katex-inline\">1110_2\\oplus1011_2=0101_2=5=x<\/span>，两次异或还原。<span class=\"katex-inline\">x\\oplus x=0101_2\\oplus0101_2=0000_2=0<\/span>，每位两值相同，异或出 0。<\/p>\n<h2>包含关系三式互证推演<\/h2>\n<p>取 <span class=\"katex-inline\">x=5=(0101)_2<\/span>，<span class=\"katex-inline\">y=13=(1101)_2<\/span>。逐位看：<span class=\"katex-inline\">x<\/span> 的 1 在位 2、位 0；<span class=\"katex-inline\">y<\/span> 的 1 在位 3、位 2、位 0，<span class=\"katex-inline\">x<\/span> 的 1 位都在 <span class=\"katex-inline\">y<\/span> 中，<span class=\"katex-inline\">x\\subseteq y<\/span>。<\/p>\n<ol><li>\n第一式 <span class=\"katex-inline\">x\\&amp;y=x<\/span>：<span class=\"katex-inline\">0101\\&amp;1101=0101=x<\/span>，成立。\n<\/li><li>\n第二式 <span class=\"katex-inline\">x\\mid y=y<\/span>：<span class=\"katex-inline\">0101\\mid1101=1101=y<\/span>，成立。\n<\/li><li>\n第三式 <span class=\"katex-inline\">x\\&amp;\\bar y=0<\/span>：<span class=\"katex-inline\">\\bar y=0010<\/span>，<span class=\"katex-inline\">0101\\&amp;0010=0000=0<\/span>，成立。\n<\/ol>\n<p>反例取 <span class=\"katex-inline\">x=6=(0110)_2<\/span>，<span class=\"katex-inline\">y=5=(0101)_2<\/span>：<span class=\"katex-inline\">x<\/span> 位 1 为 1 而 <span class=\"katex-inline\">y<\/span> 位 1 为 0，不包含。核验三式：<span class=\"katex-inline\">x\\&amp;y=0100\\neq x<\/span>；<span class=\"katex-inline\">x\\mid y=0111\\neq y<\/span>；<span class=\"katex-inline\">x\\&amp;\\bar y=0010\\neq0<\/span>，三式同时不成立，与定义一致。<\/p>\n<h2>数值算例：提取与清除最低位的 1<\/h2>\n<p>设 <span class=\"katex-inline\">x<\/span> 为正整数，看二进制最低位（下标 0 方向）第一个 1。<\/p>\n<ul><li>\n取补方向：<span class=\"katex-inline\">x-1<\/span> 把最低位的 1 变成 0，其后所有 0 变成 1；<span class=\"katex-inline\">x\\&amp;(x-1)<\/span> 即清除该最低位 1。取 <span class=\"katex-inline\">x=12=(1100)_2<\/span>：<span class=\"katex-inline\">x-1=1011<\/span>，<span class=\"katex-inline\">x\\&amp;(x-1)=1000_2=8<\/span>，位 2 的 1 被清除，位 3 保留。\n<\/li><li>\n提取该位：<span class=\"katex-inline\">x\\&amp;-x<\/span> 在补码下保留最低位 1、其余位清 0。<span class=\"katex-inline\">x=12<\/span> 时 <span class=\"katex-inline\">-x<\/span> 为补码，<span class=\"katex-inline\">x\\&amp;-x=0100_2=4<\/span>，恰好是最低位 1 的权值。\n<\/ul>\n<p><strong>第二算例：奇偶与 1 位计数方向<\/strong>。最低位 <span class=\"katex-inline\">x_0<\/span> 决定奇偶：<span class=\"katex-inline\">x\\&amp;1<\/span> 为 1 即奇数。统计 1 的个数（popcount）可反复清除最低位 1：每轮 <span class=\"katex-inline\">x\\leftarrow x\\&amp;(x-1)<\/span>，清除一次计一个 1，直到 <span class=\"katex-inline\">x=0<\/span>。<span class=\"katex-inline\">x=12=(1100)_2<\/span>：第一轮得 8，第二轮得 0，共 2 个 1，与位串中 1 的个数一致。<\/p>\n<h2>延伸推演：异或与尼姆游戏、补码语义<\/h2>\n<p>书里提到 <span class=\"katex-inline\">\\oplus<\/span> 描述尼姆游戏（习题 8-16）中的取胜策略：一堆堆石子的大小用整数表示，局面的尼姆和为各堆大小按位异或；异或为 0 的局面是平衡局面，非 0 局面可一次移动转向平衡。这一应用成立的基础正是异或的交换、结合与自反性质：<span class=\"katex-inline\">(x\\oplus y)\\oplus y=x<\/span>，局面状态可还原。<\/p>\n<p>负数在机器上用补码表示，左边带有无数个 1 的无限精度数位；对负整数做与、或时，高位按补码符号位延续。书里提示与、或最好留给 <span class=\"katex-inline\">\\wedge<\/span>、<span class=\"katex-inline\">\\vee<\/span> 记号，<span class=\"katex-inline\">x-y<\/span> 常被称作点减或饱和减，结果 <span class=\"katex-inline\">\\max(0,x-y)<\/span>，这是另一种运算，不要和按位异或混淆。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>把或当加<\/strong>。<span class=\"katex-inline\">x=y=1<\/span>：<span class=\"katex-inline\">1\\mid1=1<\/span>，而 <span class=\"katex-inline\">1+1=2<\/span>；两数共有 1 的位重叠时，或结果不产生进位。统计集合大小要靠 1 位计数，不能用按位或的整数结果代替加法。<\/p>\n<p><strong>按位运算处理进位<\/strong>。算术加法在每一位产生向高位的进位；按位与、或、异或都不传播进位。两数求和需配合进位链，单靠按位式得不到算术和。<\/p>\n<p><strong>把子集包含当数值大小<\/strong>。<span class=\"katex-inline\">x=8=(1000)_2<\/span>，<span class=\"katex-inline\">y=7=(0111)_2<\/span>：数值上 <span class=\"katex-inline\">x&gt;y<\/span>，但位集合上 <span class=\"katex-inline\">x<\/span> 的 1 不在 <span class=\"katex-inline\">y<\/span> 中，<span class=\"katex-inline\">x\\not\\subseteq y<\/span>。子集判断走 <span class=\"katex-inline\">x\\&amp;y=x<\/span>，大小比较走算术序，两条规则独立。<\/p>\n<h2>对抗性追问：为什么异或不满足吸收律<\/h2>\n<p>吸收律来自与、或的取小取大格结构：<span class=\"katex-inline\">x\\wedge(x\\vee y)=x<\/span>。异或结果取决于两位是否不同，不具备取大取小单调性；<span class=\"katex-inline\">x\\oplus(x\\&amp;y)<\/span> 在 <span class=\"katex-inline\">x=1,y=0<\/span> 时为 <span class=\"katex-inline\">1\\oplus0=1<\/span>，在 <span class=\"katex-inline\">x=1,y=1<\/span> 时为 <span class=\"katex-inli
