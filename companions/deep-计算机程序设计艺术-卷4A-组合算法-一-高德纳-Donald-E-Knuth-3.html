rong>：每个变量按取值取反相正，全部相或；最大项只在这一行赋值下为 0。<\/p>\n<p><strong>合取范式（CNF）<\/strong>：函数值为 0 的所有行对应的最大项相与。<\/p>\n<p><strong>正例<\/strong>：两变量异或 <span class=\"katex-inline\">x\\oplus y<\/span>，值为 1 的行是 <span class=\"katex-inline\">01<\/span>、<span class=\"katex-inline\">10<\/span>；DNF 为 <span class=\"katex-inline\">(\\neg x\\wedge y)\\vee(x\\wedge\\neg y)<\/span>。<\/p>\n<p><strong>反例<\/strong>：把值为 0 的行也收进 DNF 的最小项，会多出恒不为 1 的项；把 CNF 写成最小项相或，两种范式混用，表达式不再是标准形。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>DNF 与函数值一致<\/strong>。任一赋值 <span class=\"katex-inline\">a<\/span>：若 <span class=\"katex-inline\">f(a)=1<\/span>，<span class=\"katex-inline\">a<\/span> 所在行的最小项在 <span class=\"katex-inline\">a<\/span> 下为 1，相或结果为 1；若 <span class=\"katex-inline\">f(a)=0<\/span>，每个最小项只在自己那一行取 1，<span class=\"katex-inline\">a<\/span> 不等于任何取值为 1 的行，所有最小项在 <span class=\"katex-inline\">a<\/span> 下为 0，相或结果为 0。逐行对照，DNF 输出与真值表一致。<\/p>\n<p><strong>CNF 与函数值一致<\/strong>。任取赋值 <span class=\"katex-inline\">a<\/span>：若 <span class=\"katex-inline\">f(a)=0<\/span>，<span class=\"katex-inline\">a<\/span> 所在行的最大项在 <span class=\"katex-inline\">a<\/span> 下为 0，相与结果为 0；若 <span class=\"katex-inline\">f(a)=1<\/span>，<span class=\"katex-inline\">a<\/span> 不等于任何取值为 0 的行，每个最大项在 <span class=\"katex-inline\">a<\/span> 下为 1，相与结果为 1。<\/p>\n<p><strong>计数推导<\/strong>：<span class=\"katex-inline\">n<\/span> 个变量有 <span class=\"katex-inline\">2^n<\/span> 个赋值；每个赋值的输出可独立选 0 或 1，真值表有 <span class=\"katex-inline\">2^n<\/span> 个输出位，不同输出列数为 <span class=\"katex-inline\">2^{2^n}<\/span>。<span class=\"katex-inline\">n=2<\/span> 时 <span class=\"katex-inline\">2^4=16<\/span>，与书里表 1 的 16 种运算对应。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：变量取值限定 0/1；函数对全部 <span class=\"katex-inline\">2^n<\/span> 个赋值有定义。\n<\/li><li>\n失败案例 1：变量数增大后真值表行数指数增长。<span class=\"katex-inline\">n=4<\/span> 已有 16 行，<span class=\"katex-inline\">n=10<\/span> 达 1024 行；表本身不再适合手工展开，需要 BDD 等紧凑结构（见 c05）。\n<\/li><li>\n失败案例 2：范式项重复或遗漏。DNF 漏掉一个值为 1 的行，函数在该行被误判为 0；多收一个值为 0 的行，引入冗余项但不改变函数（可由吸收律消去）。\n<\/li><li>\n边界：DNF、CNF 是等价表示，不唯一；同一函数可先化简再写范式，项数可能大幅减少。范式转换只处理二值输出；多值函数、带外部状态的函数不能直接套这套单行构造。\n<\/li><li>\n读数习惯：真值表行按二进制序号从 0 到 <span class=\"katex-inline\">2^n-1<\/span> 排列，函数值列从 <span class=\"katex-inline\">f(0,\\dots,0)<\/span> 到 <span class=\"katex-inline\">f(1,\\dots,1)<\/span>；读最小项时先对齐行取值，再写正反问变量，避免行号与取值错位。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>DNF vs CNF<\/strong>：DNF 收集输出 1 的行、最小项相或；CNF 收集输出 0 的行、最大项相与。两者行集互补，运算方向相反。\n<\/li><li>\n<strong>真值表 vs 表达式<\/strong>：真值表是函数的完整定义，表达式是一种实现；同一真值表可对应多个等价表达式。\n<\/li><li>\n<strong>函数计数 vs 赋值计数<\/strong>：赋值有 <span class=\"katex-inline\">2^n<\/span> 个；函数有 <span class=\"katex-inline\">2^{2^n}<\/span> 个。两个指数层级别不要混。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的与、或、非定律是范式展开与化简的工具。后继：c03 求值网络按表达式逐步算函数；c05 BDD 是真值表的紧凑图形表示，规避表行指数膨胀；c10 组合位串中&quot;恰含 <span class=\"katex-inline\">t<\/span> 个 1&quot;的条件本身就是一个布尔函数。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（布尔函数、真值表与两种标准形式）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：真值表、范式构造全过程与计数推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把一个布尔函数写成标准形，往回追四层：<\/p>\n<ol><li>\n取值语义：输入与输出都是 0/1，一组赋值是一个长度 <span class=\"katex-inline\">n<\/span> 的位串。\n<\/li><li>\n真值表完备性：<span class=\"katex-inline\">2^n<\/span> 个赋值逐行列全，输出列唯一确定函数。\n<\/li><li>\n最小项/最大项构造：单行赋值翻译成相与的正反问变量，或相或的正反问变量。\n<\/li><li>\n范式合成：按输出 1 行拼 DNF，按输出 0 行拼 CNF；再用 c01 定律化简。\n<\/ol>\n<p>依赖链方向：赋值语义 → 列真值表 → 单行构造项 → 按行集合拼范式 → 化简与计数。<\/p>\n<h2>正向推导：从真值表到两种范式的完整步骤<\/h2>\n<p>设 <span class=\"katex-inline\">n=3<\/span>，函数 <span class=\"katex-inline\">f(x_1,x_2,x_3)<\/span> 的取值规定为：只有当 <span class=\"katex-inline\">x_1=1<\/span> 且 <span class=\"katex-inline\">x_2,x_3<\/span> 不同时输出 1。逐行列 8 行：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>行<\/th><th><span class=\"katex-inline\">x_1x_2x_3<\/span><\/th><th><span class=\"katex-inline\">f<\/span><\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>000<\/td><td>0<\/td><\/tr><tr><td>2<\/td><td>001<\/td><td>0<\/td><\/tr><tr><td>3<\/td><td>010<\/td><td>0<\/td><\/tr><tr><td>4<\/td><td>011<\/td><td>0<\/td><\/tr><tr><td>5<\/td><td>100<\/td><td>1<\/td><\/tr><tr><td>6<\/td><td>101<\/td><td>0<\/td><\/tr><tr><td>7<\/td><td>110<\/td><td>0<\/td><\/tr><tr><td>8<\/td><td>111<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>构造 DNF<\/strong>。取值为 1 的行是行 5（100）与行 8（111）。<\/p>\n<ul><li>\n行 5：<span class=\"katex-inline\">x_1=1<\/span> 写 <span class=\"katex-inline\">x_1<\/span>，<span class=\"katex-inline\">x_2=0<\/span> 写 <span class=\"katex-inline\">\\neg x_2<\/span>，<span class=\"katex-inline\">x_3=0<\/span> 写 <span class=\"katex-inline\">\\neg x_3<\/span>，最小项 <span class=\"katex-inline\">m_5=x_1\\wedge\\neg x_2\\wedge\\neg x_3<\/span>。\n<\/li><li>\n行 8：三变量都为 1，最小项 <span class=\"katex-inline\">m_8=x_1\\wedge x_2\\wedge x_3<\/span>。\n<\/li><li>\nDNF：<span class=\"katex-inline\">f=m_5\\vee m_8<\/span>。\n<\/ul>\n<p><strong>构造 CNF<\/strong>。取值为 0 的行是 1、2、3、4、6、7。逐行写最大项（取值 0 写原变量，取值 1 写否定，全部相或）：<\/p>\n<ul><li>\n行 1（000）：<span class=\"katex-inline\">M_1=\\neg x_1\\vee\\neg x_2\\vee\\neg x_3<\/span>。\n<\/li><li>\n行 2（001）：<span class=\"katex-inline\">M_2=\\neg x_1\\vee\\neg x_2\\vee x_3<\/span>。\n<\/li><li>\n行 3（010）：<span class=\"katex-inline\">M_3=\\neg x_1\\vee x_2\\vee\\neg x_3<\/span>。\n<\/li><li>\n行 4（011）：<span class=\"katex-inline\">M_4=\\neg x_1\\vee x_2\\vee x_3<\/span>。\n<\/li><li>\n行 6（101）：<span class=\"katex-inline\">M_6=x_1\\vee\\neg x_2\\vee x_3<\/span>。\n<\/li><li>\n行 7（110）：<span class=\"katex-inline\">M_7=x_1\\vee x_2\\vee\\neg x_3<\/span>。\n<\/li><li>\nCNF：<span class=\"katex-inline\">f=M_1\\wedge M_2\\wedge M_3\\wedge M_4\\wedge M_6\\wedge M_7<\/span>。\n<\/ul>\n<p><strong>核验一致性<\/strong>。取赋值 100：<span class=\"katex-inline\">m_5=1\\wedge1\\wedge1=1<\/span>，DNF 为 1；CNF 中该行不是任何最大项的专属 0 行，每个最大项在 100 下取值 1，相与为 1。取赋值 011：DNF 两个最小项都为 0，结果 0；<span class=\"katex-inline\">M_4=\\neg0\\vee1\\vee1=1\\vee1\\vee1=1<\/span>？回到 <span class=\"katex-inline\">M_4<\/span> 定义：行 4 专属 0，赋值 011 下 <span class=\"katex-inline\">M_4=0<\/span>，CNF 相与为 0，两侧一致。<\/p>\n<h2>数值算例：两变量 16 个函数的计数<\/h2>\n<p><span class=\"katex-inline\">n=2<\/span>，赋值 4 行；输出列是一个长度 4 的位串，每位可选 0 或 1，共 <span class=\"katex-inline\">2^4=16<\/span> 种。书里表 1 把 16 种逐一命名：恒假 <span class=\"katex-inline\">\\perp<\/span>、与 <span class=\"katex-inline\">\\wedge<\/span>、非与 <span class=\"katex-inline\">\\overline{\\wedge}<\/span>（nand）、左投影、右投影、异或 <span class=\"katex-inline\">\\oplus<\/span>、或 <span class=\"katex-inline\">\\vee<\/span>、非或 <span class=\"katex-inline\">\\overline{\\vee}<\/span>（nor）、等价 <span class=\"katex-inline\">\\equiv<\/span>、右补、左补、蕴含 <span class=\"katex-inline\">\\subset<\/span>、非蕴含、与非方向、恒真 <span class=\"katex-inline\">\\top<\/span>。<\/p>\n<p>取其中蕴含 <span class=\"katex-inline\">x\\subset y<\/span>：真值表 00→1，01→1，10→0，11→1。DNF 收集 1 行：<span class=\"katex-inline\">(\\neg x\\wedge\\neg y)\\vee(\\neg x\\wedge y)\\vee(x\\wedge y)<\/span>。化简：前两项提取 <span class=\"katex-inline\">\\neg x<\/span>，得 <span class=\"katex-inline\">\\neg x\\wedge(\\neg y\\vee y)=\\neg x<\/span>，再加第三项，<span class=\"katex-inline\">f=\\neg x\\vee y<\/span>。这就是蕴含的常见写法，说明范式可经吸收与排中化简到短式。<\/p>\n<p><strong>第二算例：函数个数分层<\/strong>。<span class=\"katex-inline\">n=1<\/span>：赋值 2 个，函数 <span class=\"katex-inline\">2^2=4<\/span> 个（恒 0、恒 1、原变量、否定）。<span class=\"katex-inline\">n=2<\/span>：16 个。<span class=\"katex-inline\">n=3<\/span>：<span class=\"katex-inline\">2^8=256<\/span> 个。层级为 <span class=\"katex-inline\">2^n<\/span> 个赋值、<span class=\"katex-inline\">2^{2^n}<\/span> 个函数，两层指数。<\/p>\n<h2>延伸推演：为什么 DNF 项数会偏多<\/h2>\n<p>DNF 按&quot;输出 1 的行&quot;收集最小项；函数输出 1 的行接近一半时，项数随行数增长。化简靠 c01 的吸收律与合并律：两个最小项只差一个变量的正反问，可合并成消去该变量的一项。异或的 DNF 有两项，合并空间小；多数表决函数的 DNF 项数接近 <span class=\"katex-inline\">\\binom n{\\lfloor n/2\\rfloor}<\/span>，这也是后面需要 BDD 等紧凑表示的原因之一。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>漏行<\/strong>。构造 DNF 时漏掉行 8（111），赋值 111 下 <span class=\"katex-inline\">m_5=1\\wedge0\\wedge0=0<\/span>，DNF 输出 0，而真值表要求 1；函数在该行出错。<\/p>\n<p><strong>项内正反写反<\/strong>。行 5（100）若把 <span class=\"katex-inline\">\\neg x_2<\/span> 写成 <span class=\"katex-inline\">x_2<\/span>，最小项在 110 下也可能取 1，与&quot;只在本行取 1&quot;的定义不符，引入误判为 1 的赋值。<\/p>\n<p><strong>CNF 与 DNF 行集混用<\/strong>。把输出 0 的行写进 DNF，最小项在对应赋值下本应为 0，相或后不影响结果但产生冗余；把输出 1 的行写进 CNF，最大项在该赋值下本应为 1，相与后不影响结果同样冗余。两类错误都靠行集归属核对发现。<\/p>\n<h2>对抗性追问：范式唯一吗<\/h2>\n<p>不唯一。真值表唯一，但表达式不唯一：先化简再写范式，项数可以更少；不同化简路径得到的 DNF 形式也可能不同。范式&quot;标准&quot;指结构规则固定（最小项相或 / 最大项相与），不指项数最少。最小项数最小化是另一个独立问题。<\/p>\n<h2>第二算例：三变量函数的双范式完整展开<\/h2>\n<p>设 <span class=\"katex-inline\">h(x_1,x_2,x_3)<\/span> 在赋值 <span class=\"katex-inline\">001,100,111<\/span> 时为 1，其余为 0。<\/p>\n<p><strong>DNF<\/strong>（收集 1 行）：<\/p>\n<ul><li>\n001：<span class=\"katex-inline\">(\\neg x_1\\wedge\\neg x_2\\wedge x_3)<\/span>\n<\/li><li>\n100：<span class=\"katex-inline\">(x_1\\wedge\\neg x_2\\wedge\\neg x_3)<\/span>\n<\/li><li>\n111：<span class=\"katex-inline\">(x_1\\wedge x_2\\wedge x_3)<\/span>\n<\/ul>\n<p><span class=\"katex-inline\">h=<\/span> 三项相或。<strong>CNF<\/strong>（收集其余 5 行的最大项相与）：000、010、011、101、110 各写一个最大项相或，再全部相与。两条范式描述同一个 <span class=\"katex-inline\">h<\/span>；行数互补，DNF 三项、CNF 五项。<\/p>\n<p><strong>合并方向<\/strong>：DNF 中两个最小项只差一个变量正反，可合并消去该变量。本例三项没有可直接合并的相邻最小项；若函数取值更集中，合并后项数明显下降。<\/p>\n<h2>函数计数分层表<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>变量数 <span class=\"katex-inline\">n<\/span><\/th><th>赋值数 <span class=\"katex-inline\">2^n<\/span><\/th><th>函数数 <span class=\"katex-inline\">2^{2^n}<\/span><\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>2<\/td><td>4<\/td><\/tr><tr><td>2<\/td><td>4<\/td><td>16<\/td><\/tr><tr><td>3<\/td><td>8<\/td><td>256<\/td><\/tr><tr><td>4<\/td><td>16<\/td><td>65536<\/td><\/tr><\/tbody><\/table><\/div>\n<p>两层指数：先数赋值，再给每个赋值独立选输出。报&quot;有多少种布尔函数&quot;时用第二列，报&quot;一张表有多少行&quot;时用第一列。<\/p>\n<h2>范式转换的固定步骤<\/h2>\n<ol><li>\n列全 <span class=\"katex-inline\">2^n<\/span> 行赋值，标出每行函数值。\n<\/li><li>\nDNF：值为 1 的行写最小项（取值 1 写原变量，0 写否定，相与），全部相或。\n<\/li><li>\nCNF：值为 0 的行写最大项（取值 0 写原变量，1 写否定，相或），全部相与。\n<\/li><li>\n化简：用吸收、合并消去冗余项与重复变量。\n<\/ol>\n<p>步骤 2 与步骤 3 的行集互补，做完一侧可对照另一侧检查有没有漏行。<\/p>\n<h2>范式与化简的衔接示例<\/h2>\n<p>取函数 <span class=\"katex-inline\">f=(x\\wedge y)\\vee(x\\wedge\\neg y)<\/span>。DNF 两项：最小项 <span class=\"katex-inline\">xy<\/span> 与 <span class=\"katex-inline\">x\\neg y<\/span>。两项只差 <span class=\"katex-inline\">y<\/span> 的正反，合并消去 <span class=\"katex-inline\">y<\/span>，得 <span class=\"katex-inline\">f=x<\/span>。核验两行：<span class=\"katex-inline\">x=0<\/span> 两项都灭，<span class=\"katex-inline\">f=0<\/span>；<span class=\"katex-inline\">x=1<\/span> 两项随 <span class=\"katex-inline\">y<\/span> 一亮一灭，相或恒为 1。合并后 DNF 从两项压到一项。<\/p>\n<h2>常见读数错误<\/h2>\n<ul><li>\n把最大项写成最小项的相与形式：最大项是相或，相与是最小项结构，混用会把 CNF 写成 DNF。\n<\/li><li>\n行取值对错位：最小项里变量按行取值取反写反，会让该项在别的赋值下也取 1。\n<\/li><li>\n漏看恒假、恒真函数：恒假函数 DNF 为空，恒真函数 CNF 为空；这两种边界函数不能硬凑项。\n<\/ul>\n<h2>函数空间大小的实际含义<\/h2>\n<p><span class=\"katex-inline\">n=3<\/span> 时 256 个函数，手工列真值表尚可；<span class=\"katex-inline\">n=6<\/span> 时函数数达 <span class=\"katex-inline\">2^{64}<\/span> 量级，不可能逐个枚举。这正是 c03 求值网络与 c05 BDD 出现的背景：不在函数空间里逐个找，而是针对给定函数构造紧凑表示。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n<span class=\"katex-inline\">n=3<\/span> 时有多少个赋值、多少个布尔函数？两层指数各是什么？\n<\/li><li>\n写出与函数 <span class=\"katex-inline\">x\\wedge y<\/span> 的 DNF 与 CNF，各收集哪些行？\n<\/li><li>\n最小项为什么只在一行赋值下为 1？最大项为什么只在一行下为 0？\n<\/li><li>\n蕴含 <span class=\"katex-inline\">\\neg x\\vee y<\/span> 的 DNF 经哪一步化简从三项变成两项？\n<\/li><li>\n漏写一个输出 1 的行，函数在该行被误判成什么？\n<\/ol><\/div><\/details>", "c03": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.93<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">布尔函数、真值表与两种标准形式<\/a><\/span><\/div><h1>布尔函数求值网络：函数链、多路复用器与函数计数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch01（原书 §7.1.2，PDF 第 93 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p>函数写出来之后，机器要按什么顺序把它算出来？直接在真值表上查输出，表行随 <span class=\"katex-inline\">2^n<\/span> 膨胀；把表达式一次整体求值，中间结果没有落点。函数链把求值拆成一串有编号的中间结点，每个新结点只对两个旧结点施加一种运算，既固定了求值顺序，也便于统计网络用了多少步、多少种门。组合算法里的条件判断、集合成员判定，落到机器层都是这类求值网络。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>函数链<\/strong>：初始变量 <span class=\"katex-inline\">x_1,\\dots,x_n<\/span>；逐步补充 <span class=\"katex-inline\">x_{n+1},\\dots,x_{n+r}<\/span>，每个新结点写成<\/p>\n<div class=\"katex-block\">x_i=x_j\\circ x_k,\\qquad 1\\le j,k&lt;i\\le n+r,<\/div>\n<p>其中 <span class=\"katex-inline\">\\circ<\/span> 是 §7.1.1 的 16 种二元运算之一。<\/p>\n<p><strong>编号约束<\/strong>：<span class=\"katex-inline\">j,k&lt;i<\/span>，被引用的结点编号更早；求值时旧结点已算出，新结点才能接着算。<\/p>\n<p><strong>多路复用器（multiplexer）<\/strong>：函数在选择输入 <span class=\"katex-inline\">x_j<\/span> 为 1 时取 <span class=\"katex-inline\">x_k<\/span>，为 0 时取另一路输入；形式上可写成 <span class=\"katex-inline\">(x_j\\wedge x_k)\\vee(\\neg x_j\\wedge x_l)<\/span> 一类的选择结构。<\/p>\n<p><strong>链长与门种<\/strong>：<span class=\"katex-inline\">r<\/span> 为新增结点数；每步选用的运算类型决定网络用到哪些门。§7.1.2 提示，链上可采用简化记号（如 NOTBUT），关键在于无论记号如何，每一步都是两个先前结果的布尔组合。<\/p>\n<p><strong>正例<\/strong>：两条三变量链<\/p>\n<div class=\"katex-block\">x_4=x_1\\wedge x_2,\\quad x_5=x_1\\wedge x_3,\\quad x_6=x_4\\vee x_5,<\/div>\n<p><span class=\"katex-inline\">x_4,x_5<\/span> 引用 <span class=\"katex-inline\">x_1,x_2,x_3<\/span>，<span class=\"katex-inline\">x_6<\/span> 引用更早的 <span class=\"katex-inline\">x_4,x_5<\/span>，编号顺序成立。<\/p>\n<p><strong>反例<\/strong>：写 <span class=\"katex-inline\">x_4=x_2\\wedge x_5<\/span> 而 <span class=\"katex-inline\">x_5<\/span> 编号晚于 <span class=\"katex-inline\">x_4<\/span>，引用了未来结点；求值顺序出现循环依赖，链不再是有向无环结构。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>求值顺序可行<\/strong>：归纳看结点编号。初始 <span class=\"katex-inline\">x_1,\\dots,x_n<\/span> 已知；假设编号小于 <span class=\"katex-inline\">i<\/span> 的结点都已算出，<span class=\"katex-inline\">x_i<\/span> 的两个引用 <span class=\"katex-inline\">j,k&lt;i<\/span> 已在其中，运算可得 <span class=\"katex-inline\">x_i<\/span>。由编号归纳，到 <span class=\"katex-inline\">x_{n+r}<\/span> 时整条链求值完成。<\/p>\n<p><strong>网络规模口径<\/strong>：链长 <span class=\"katex-inline\">r<\/span> 是新增结点数；若只允许使用固定几种运算，所选门种影响实现代价。计数方向：函数总数为 <span class=\"katex-inline\">2^{2^n}<\/span>，而长度 <span class=\"katex-inline\">r<\/span> 的链能构造出的函数数目受限于运算选择空间——网络越短，能表达的函数越有限；要实现任意函数，链长与门种需要足够余量。<\/p>\n<p><strong>多路复用器展开<\/strong>：选择条件 <span class=\"katex-inline\">s<\/span> 为 1 取 <span class=\"katex-inline\">a<\/span>、为 0 取 <span class=\"katex-inline\">b<\/span>，写成 <span class=\"katex-inline\">(s\\wedge a)\\vee(\\neg s\\wedge b)<\/span>。<span class=\"katex-inline\">s=1<\/span> 时第二项为 0、第一项为 <span class=\"katex-inline\">a<\/span>；<span class=\"katex-inline\">s=0<\/span> 时第一项为 0、第二项为 <span class=\"katex-inline\">b<\/span>，两侧取值符合选择语义。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：函数可分解为二元运算的组合；每步两个操作数都是已算结点或原始变量。\n<\/li><li>\n失败案例 1：引用未来结点。<span class=\"katex-inline\">j<\/span> 或 <span class=\"katex-inline\">k<\/span> 大于等于 <span class=\"katex-inline\">i<\/span> 时依赖回绕，手算无法定序，机器执行死锁或重复计算。\n<\/li><li>\n失败案例 2：把链长当函数复杂度下界。同一函数可有长短不同的链；链长是某一实现的规模，不是函数本身的固有复杂度，比较代价要固定门种与计数口径。\n<\/li><li>\n边界：16 种运算可任选时表达力强；限制门种后，某些函数需要更多结点才能拼出。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>函数链 vs 真值表<\/strong>：真值表静态列出全部输入输出；链是动态求值过程，按选定赋值逐步算结果。表是定义，链是实现。\n<\/li><li>\n<strong>链长 vs 变量数<\/strong>：变量数 <span class=\"katex-inline\">n<\/span> 是输入宽度；链长 <span class=\"katex-inline\">r<\/span> 是中间运算步数，两者度量不同。\n<\/li><li>\n<strong>多路复用器 vs 与或门级联<\/strong>：复用器是选择结构的整体称呼；展开后仍是与、或、非的组合。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 运算定律决定每步可选的 <span class=\"katex-inline\">\\circ<\/span>；c02 真值表给出函数目标，链是逼近该函数的一条实现路径。后继：c05 BDD 用图形分支替代逐结点链，共享相同子函数；c04 按位运算把单步布尔组合并行施加到整串位上。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（布尔函数求值网络：函数链、多路复用器与函数计数）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：函数链编号不变量、多路复用器展开与规模边界推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把求值网络拆开看，往回追四层：<\/p>\n<ol><li>\n输入已知：<span class=\"katex-inline\">x_1,\\dots,x_n<\/span> 是原始变量，取值由外部给定。\n<\/li><li>\n结点规则：每个新结点 <span class=\"katex-inline\">x_i=x_j\\circ x_k<\/span>，<span class=\"katex-inline\">j,k&lt;i<\/span>，只引用更早结点。\n<\/li><li>\n编号归纳：按编号从小到大求值，被引用者先算，当前结点后算。\n<\/li><li>\n规模与表达力：链长 <span class=\"katex-inline\">r<\/span>、门种集合决定网络能表达哪些函数；函数总数对照网络表达空间。\n<\/ol>\n<p>依赖链方向：输入集合 → 结点引用规则 → 编号顺序归纳 → 逐步求值 → 规模与计数对照。<\/p>\n<h2>正向推导：编号不变量怎样保证可求值<\/h2>\n<p><strong>不变量<\/strong>：对编号 <span class=\"katex-inline\">i<\/span>，所有引用下标 <span class=\"katex-inline\">j,k<\/span> 都满足 <span class=\"katex-inline\">j,k&lt;i<\/span>。<\/p>\n<p>归纳基础：<span class=\"katex-inline\">i\\le n<\/span> 的结点是原始变量，无需引用，取值已知。<\/p>\n<p>归纳步：假设编号 <span class=\"katex-inline\">1,\\dots,i-1<\/span> 的结点都已求值；<span class=\"katex-inline\">x_i<\/span> 的两个操作数 <span class=\"katex-inline\">x_j,x_k<\/span> 编号小于 <span class=\"katex-inline\">i<\/span>，已在已求值集合内，施加运算 <span class=\"katex-inline\">\\circ<\/span> 即得 <span class=\"katex-inline\">x_i<\/span>。于是编号 <span class=\"katex-inline\">i<\/span> 也可求值。<\/p>\n<p>归纳到 <span class=\"katex-inline\">i=n+r<\/span>，全链求值完成。这条不变量同时排除了循环依赖：若出现 <span class=\"katex-inline\">j\\ge i<\/span> 或 <span class=\"katex-inline\">k\\ge i<\/span>，归纳步无法把该操作数归入已求值集合，链条断裂。<\/p>\n<h2>数值算例：一条完整链的逐结点手算<\/h2>\n<p>设链：<\/p>\n<pre><code>x4 = x1 ∧ x2\nx5 = x1 ∧ x3\nx6 = x4 ∨ x5\nx7 = ¬x6<\/code><\/pre>\n<p>取赋值 <span class=\"katex-inline\">x_1=1,\\ x_2=0,\\ x_3=1<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">x_4=1\\wedge0=0<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">x_5=1\\wedge1=1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">x_6=0\\vee1=1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">x_7=\\neg1=0<\/span>。\n<\/ol>\n<p>再取赋值 <span class=\"katex-inline\">x_1=1,\\ x_2=1,\\ x_3=0<\/span>：<span class=\"katex-inline\">x_4=1\\wedge1=1<\/span>；<span class=\"katex-inline\">x_5=1\\wedge0=0<\/span>；<span class=\"katex-inline\">x_6=1\\vee0=1<\/span>；<span class=\"katex-inline\">x_7=0<\/span>。<\/p>\n<p><strong>第二算例：多路复用器链<\/strong>。选择输入 <span class=\"katex-inline\">s=x_1<\/span>，两路数据 <span class=\"katex-inline\">a=x_2<\/span>、<span class=\"katex-inline\">b=x_3<\/span>，链：<\/p>\n<pre><code>x4 = x1 ∧ x2\nx5 = ¬x1\nx6 = x5 ∧ x3\nx7 = x4 ∨ x6<\/code><\/pre>\n<p><span class=\"katex-inline\">s=1<\/span>（<span class=\"katex-inline\">x_1=1<\/span>）：<span class=\"katex-inline\">x_4=a<\/span>；<span class=\"katex-inline\">x_5=0<\/span>；<span class=\"katex-inline\">x_6=0<\/span>；<span class=\"katex-inline\">x_7=a<\/span>。<span class=\"katex-inline\">s=0<\/span>：<span class=\"katex-inline\">x_4=0<\/span>；<span class=\"katex-inline\">x_5=1<\/span>；<span class=\"katex-inline\">x_6=b<\/span>；<span class=\"katex-inline\">x_7=b<\/span>。选择语义成立，链长 <span class=\"katex-inline\">r=4<\/span>。<\/p>\n<h2>延伸推演：链能表达多少函数（量级方向）<\/h2>\n<p><span class=\"katex-inline\">n<\/span> 变量函数共 <span class=\"katex-inline\">2^{2^n}<\/span> 个。长度为 <span class=\"katex-inline\">r<\/span> 的链，每个新结点从已有结点中选两个操作数、从门种集合中选一种运算；操作数对与门种的选择数随 <span class=\"katex-inline\">r<\/span> 增长。短链能构造的函数数目远小于函数总数，多数函数需要更长链。这一方向解释了为什么 §7.1.2 要讨论求值的有效方法：真值表可直接查输出，但表行随 <span class=\"katex-inline\">2^n<\/span> 膨胀；链用中间结果压缩计算过程，代价是要为每个函数找到短而合理的结点序列。<\/p>\n<p>对照 c02：函数计数是两层指数（<span class=\"katex-inline\">2^n<\/span> 个赋值、<span class=\"katex-inline\">2^{2^n}<\/span> 个函数）；链长是实现度量，不进入函数总数公式。两者分开统计，避免把&quot;有多少函数&quot;与&quot;一个函数要几步算完&quot;混在一起。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>引用未来结点<\/strong>。若把 <span class=\"katex-inline\">x_4=x_2\\wedge x_5<\/span> 写在 <span class=\"katex-inline\">x_5=x_1\\vee x_3<\/span> 之前，<span class=\"katex-inline\">x_5<\/span> 尚未求值；按编号归纳，<span class=\"katex-inline\">j=5\\ge i=4<\/span> 不满足不变量。执行时先算 <span class=\"katex-inline\">x_4<\/span> 取不到 <span class=\"katex-inline\">x_5<\/span>，顺序重排后 <span class=\"katex-inline\">x_5<\/span> 又可能引用 <span class=\"katex-inline\">x_4<\/span>，形成环。<\/p>\n<p><strong>门种记号替换出错<\/strong>。链上可用简化记号（如 NOTBUT 类），替换回标准与、或、非时若漏写一路取反，多路复用器在 <span class=\"katex-inline\">s=0<\/span> 分支取错数据。核验方式：把展开式代回两种 <span class=\"katex-inline\">s<\/span> 取值，分别核对选中的是哪一路。<\/p>\n<p><strong>把链长当固有下界<\/strong>。同一函数可先化简（c01 吸收、合并）再建链，短链可能覆盖长链的功能；报告代价时要写明固定的门种集合与计数口径，否则不同实现之间的 <span class=\"katex-inline\">r<\/span> 不可比。<\/p>\n<h2>对抗性追问：链为什么必须是二元运算<\/h2>\n<p>书里的链规则限定 <span class=\"katex-inline\">x_j\\circ x_k<\/span> 两个操作数。若允许三元门，单步可表达三变量函数，链长下降；但门种集合扩大，硬件实现与代价计数口径都要重定。二元约定把每步动作压到最基本的两个旧结果组合，与 §7.1.1 的二元运算表直接对应。换用多元门属于改变模型，不能在同一链长口径下比较。<\/p>\n<h2>第二算例：另一条三变量链逐结点核验<\/h2>\n<p>设链：<\/p>\n<pre><code>x4 = x2 ∨ x3\nx5 = x1 ∧ x4\nx6 = ¬x5<\/code><\/pre>\n<p>取赋值 <span class=\"katex-inline\">x_1=0,\\ x_2=1,\\ x_3=0<\/span>：<\/p>\n<ol><li>\n<span class=\"katex-inline\">x_4=1\\vee0=1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">x_5=0\\wedge1=0<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">x_6=\\neg0=1<\/span>。\n<\/ol>\n<p>取赋值 <span class=\"katex-inline\">x_1=1,\\ x_2=0,\\ x_3=0<\/span>：<span class=\"katex-inline\">x_4=0\\vee0=0<\/span>；<span class=\"katex-inline\">x_5=1\\wedge0=0<\/span>；<span class=\"katex-inline\">x_6=1<\/span>。取赋值 <span class=\"katex-inline\">x_1=1,\\ x_2=1,\\ x_3=0<\/span>：<span class=\"katex-inline\">x_4=1<\/span>；<span class=\"katex-inline\">x_5=1<\/span>；<span class=\"katex-inline\">x_6=0<\/span>。三条赋值覆盖 <span class=\"katex-inline\">x_4<\/span> 为 0/1、<span class=\"katex-inline\">x_5<\/span> 为 0/1 的分支，链上每步引用的都是更早编号结点。<\/p>\n<h2>多路复用器四组赋值对照<\/h2>\n<p>选择 <span class=\"katex-inline\">s=x_1<\/span>，数据 <span class=\"katex-inline\">a=x_2<\/span>、<span class=\"katex-inline\">b=x_3<\/span>，函数 <span class=\"katex-inline\">M=(s\\wedge a)\\vee(\\neg s\\wedge b)<\/span>。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><span class=\"katex-inline\">s<\/span><\/th><th><span class=\"katex-inline\">a<\/span><\/th><th><span class=\"katex-inline\">b<\/span><\/th><th>输出<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>0<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p><span class=\"katex-inline\">s=0<\/span> 行输出等于 <span class=\"katex-inline\">b<\/span>，<span class=\"katex-inline\">s=1<\/span> 行输出等于 <span class=\"katex-inline\">a<\/span>；选择语义在四组赋值上成立。展开成链需要两个与结点、一个取反结点、一个或结点，共 4 个新增中间结果。<\/p>\n<h2>门种限制对链长的影响<\/h2>\n<p>若只允许与、或、非三种门，异或、蕴含等函数要拆成多个基本门组合，链长上升；若把 16 种运算都列为可选门种，单步可直接用复合运算，链长下降。报告一条链用了多少步时，必须写明门种集合；不同门种下的结点数不能直接比较。这与 c01 的运算基讨论衔接：基本运算选得越少，表达同一函数需要的中间结点越多。<\/p>\n<h2>编号规则再核<\/h2>\n<p><span class=\"katex-inline\">x_i=x_j\\circ x_k<\/span> 中 <span class=\"katex-inline\">j,k&lt;i<\/span> 是硬约束。回看两条算例链：<span class=\"katex-inline\">x_4<\/span> 引用 <span class=\"katex-inline\">x_1,x_2,x_3<\/span>，<span class=\"katex-inline\">x_5<\/span> 引用 <span class=\"katex-inline\">x_1<\/span> 与 <span class=\"katex-inline\">x_4<\/span>，<span class=\"katex-inline\">x_6<\/span> 引用 <span class=\"katex-inline\">x_5<\/span>，被引编号都小于当前编号。若新增结点要引用更晚编号的结果，说明构造顺序写反了，应先把被引用结点排到前面。<\/p>\n<h2>第三条链：异或怎样由基本门拼出<\/h2>\n<p>异或 <span class=\"katex-inline\">x\\oplus y=(x\\wedge\\neg y)\\vee(\\neg x\\wedge y)<\/span>。拆成链：<\/p>\n<pre><code>u1 = ¬x\nu2 = ¬y\nu3 = x ∧ u2\nu4 = u1 ∧ y\nu5 = u3 ∨ u4<\/code><\/pre>\n<p>五处新增结点。代入四行核验：<span class=\"katex-inline\">00\\to u3=0,u4=0,u5=0<\/span>；<span class=\"katex-inline\">01\\to u3=0,u4=1,u5=1<\/span>；<span class=\"katex-inline\">10\\to u3=1,u4=0,u5=1<\/span>；<span class=\"katex-inline\">11\\to u3=0,u4=0,u5=0<\/span>，与异或一致。若门种集合直接包含异或，单步即可；拆成与、或、非则需要上面五条结点。<\/p>\n<h2>链长统计口径复盘<\/h2>\n<p>链长 <span class=\"katex-inline\">r<\/span> 数的是新增中间结点数，不算原始输入结点。比较两条链时，先固定门种集合，再数结点；一条用复合门、一条只用基本门，结点数不可比。书里提示链上可采用简化记号（NOTBUT 类），记号替换回标准门种时不能丢掉取反支路，否则选择函数在某一分支出错。<\/p>\n<h2>求值与查表的分工<\/h2>\n<p>真值表适合小规模函数直接查输出；函数链适合按给定赋值逐步算，中间结果可复用。同一函数两条路线：表是静态定义，链是动态实现。变量数增大后表行膨胀，链的中间结点也可能重复，这为 BDD 的共享结构留出位置。<\/p>\n<h2>编号归纳的边界<\/h2>\n<p><span class=\"katex-inline\">j,k&lt;i<\/span> 保证按编号从小到大可求值；若图结构允许同一后继被多个前驱引用（共享子树），编号仍需满足被引在先。链是线性序列，BDD 是带共享的图，两者引用规则方向一致，都是先有结果再被引用。<\/p>\n<h2>链构造的实际顺序<\/h2>\n<p>写一条链时先列原始变量 <span class=\"katex-inline\">x_1,\\dots,x_n<\/span>，再按编号从小到大补中间结点；每个新结点的两个操作数必须已经在前面出现。构造完成后反向核验：逐个结点检查 <span class=\"katex-inline\">j,k&lt;i<\/span>，找不到未来引用再交付求值。若中途发现某步要引用尚未定义的结果，把该结果结点前移到被引位置。<\/p>\n<h2>求值顺序小结<\/h2>\n<p>链上每个结点只做一次二元运算，结果编号固定；求值按编号升序推进，被引用者先算。写实现时把链存成结点表，逐条记录操作数编号与运算种类，运行时按表顺序取值，不必递归回溯。这一表式结构也是后面 BDD 用字段表表示结点的前驱形态。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出函数链的编号约束 <span class=\"katex-inline\">j,k&lt;i<\/span>，说明它排除了哪类依赖。\n<\/li><li>\n按编号归纳证明：初始变量已知时，全链可逐步求值。\n<\/li><li>\n把选择函数 <span class=\"katex-inline\">(s\\wedge a)\\vee(\\neg s\\wedge b)<\/span> 拆成结点链，标出每个新结点引用哪些旧结点。\n<\/li><li>\n链长 <span class=\"katex-inline\">r<\/span> 与变量数 <span class=\"katex-inline\">n<\/span> 各度量什么？为什么不能互相比大小？\n<\/li><li>\n引用未来结点时，编号归纳在哪一步失效？会形成什么结构？\n<\/ol><\/div><\/details>", "c04": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.125<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">两值逻辑与布尔代数基本定律<\/a><\/span><\/div><h1>按位运算：与/或/异或、包含关系与常用位技巧<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch02（原书 §7.1.3，PDF 第 125 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p>集合用位串表示后，成员判断、子集筛选、元素增减都要在一整串位上同时完成。逐位查循环太慢；按位运算把 c01 的布尔规则一次施加到整数的每一位，用一条机器指令完成整串组合。组合枚举里标记选中元素、提取最低位 1、判断两个位集合是否包含，都依赖这一组运算。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>二进制记法 <span class=\"katex-inline\">x=(\\dots x_2x_1x_0)_2<\/span>，<span class=\"katex-inline\">y=(\\dots y_2y_1y_0)_2<\/span>，<span class=\"katex-inline\">z=(\\dots z_2z_1z_0)_2<\/span>：<\/p>\n<ul><li>\n<strong>与<\/strong>：<span class=\"katex-inline\">x\\&amp;y=z<\/span> 当且仅当每位 <span class=\"katex-inline\">x_k\\wedge y_k=z_k<\/span>。\n<\/li><li>\n<strong>或<\/strong>：<span class=\"katex-inline\">x\\mid y=z<\/span> 当且仅当每位 <span class=\"katex-inline\">x_k\\vee y_k=z_k<\/span>。\n<\/li><li>\n<strong>异或<\/strong>：<span class=\"katex-inline\">x\\oplus y=z<\/span> 当且仅当每位 <span class=\"katex-inline\">x_k\\oplus y_k=z_k<\/span>，即两位不同时该位为 1。\n<\/ul>\n<p><strong>定律继承<\/strong>：与、或在每位上保持交换、结合、幂等、吸收；异或保持交换、结合，且 <span class=\"katex-inline\">x\\oplus x=0<\/span>、<span class=\"katex-inline\">x\\oplus0=x<\/span>。书里提示与、或最好分别记作 <span class=\"katex-inline\">\\wedge<\/span>、<span class=\"katex-inline\">\\vee<\/span> 以避开整数算术记号；<span class=\"katex-inline\">\\oplus<\/span> 有久远历史，描述尼姆游戏中的一种取胜策略。<\/p>\n<p><strong>包含关系<\/strong>：<span class=\"katex-inline\">x\\subseteq y<\/span> 指 <span class=\"katex-inline\">x<\/span> 的每个 1 位都在 <span class=\"katex-inline\">y<\/span> 中为 1。等价写法：<span class=\"katex-inline\">x\\&amp;y=x<\/span>、<span class=\"katex-inline\">x\\mid y=y<\/span>、<span class=\"katex-inline\">x\\&amp;\\bar y=0<\/span>。<\/p>\n<p><strong>常用位技巧方向<\/strong>：提取最低位的 1、清除最低位 1、判断奇偶、统计 1 的个数，都可由基本按位式组合得到。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">5\\&amp;11=1<\/span>（<span class=\"katex-inline\">101_2\\&amp;1011_2=0001_2<\/span>）；<span class=\"katex-inline\">5\\oplus11=14<\/span>（<span class=\"katex-inline\">101_2\\oplus1011_2=1110_2<\/span>）。<\/p>\n<p><strong>反例<\/strong>：把异或当加法——<span class=\"katex-inline\">1\\oplus1=0<\/span> 而不是 <span class=\"katex-inline\">2<\/span>；异或不满足吸收律，<span class=\"katex-inline\">x\\oplus(x\\&amp;y)<\/span> 不能化简成 <span class=\"katex-inline\">x<\/span>。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>逐位独立性<\/strong>：每位 <span class=\"katex-inline\">z_k<\/span> 只由 <span class=\"katex-inline\">x_k,y_k<\/span> 经同一布尔运算决定，位与位之间不进位、不借位。因此 c01 中每位成立的交换律、结合律、分配律原样提升到整数层。<\/p>\n<p><strong>包含等价性<\/strong>：<span class=\"katex-inline\">x\\subseteq y<\/span> 定义为每位 <span class=\"katex-inline\">x_k=1\\Rightarrow y_k=1<\/span>。若该条件成立，<span class=\"katex-inline\">x_k\\&amp;y_k=x_k<\/span>，即 <span class=\"katex-inline\">x\\&amp;y=x<\/span>；<span class=\"katex-inline\">x_k\\mid y_k=y_k<\/span>，即 <span class=\"katex-inline\">x\\mid y=y<\/span>；<span class=\"katex-inline\">x_k\\&amp;\\bar y_k=0<\/span>，即 <span class=\"katex-inline\">x\\&amp;\\bar y=0<\/span>。三式都回到同一条逐位条件，可互相替换。<\/p>\n<p><strong>异或的互补性质<\/strong>：<span class=\"katex-inline\">x\\oplus x=0<\/span> 每位 <span class=\"katex-inline\">x_k\\oplus x_k=0<\/span>；由此 <span class=\"katex-inline\">x\\oplus y=0<\/span> 当且仅当 <span class=\"katex-inline\">x=y<\/span>。连续两次异或同一数还原：<span class=\"katex-inline\">(x\\oplus y)\\oplus y=x<\/span>。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：操作数按无符号二进制位解释；负数在机器上用补码表示，书里提示与、或作用于无限精度数位时，负号位按补码语义延续。\n<\/li><li>\n失败案例 1：把按位或当算术加。<span class=\"katex-inline\">1\\mid1=1<\/span>，<span class=\"katex-inline\">1+1=2<\/span>；两数有重叠位时或结果小于加结果。\n<\/li><li>\n失败案例 2：按位与/或用于需要进位的求和。进位在算术加法中传播，按位运算不处理进位；求和要用算术加或专门的全加器链。\n<\/li><li>\n边界：包含关系判断的是位集合子集，不是整数数值大小；<span class=\"katex-inline\">x\\subseteq y<\/span> 不蕴含 <span class=\"katex-inline\">x\\le y<\/span>。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>异或 vs 或<\/strong>：或在两位任一为 1 时取 1；异或只在两位不同时取 1。<span class=\"katex-inline\">1\\vee1=1<\/span>，<span class=\"katex-inline\">1\\oplus1=0<\/span>。\n<\/li><li>\n<strong>按位运算 vs 算术运算<\/strong>：按位不进位，算术进位传播；运算表与用途都不同。\n<\/li><li>\n<strong>包含关系 vs 数值比较<\/strong>：<span class=\"katex-inline\">x\\subseteq y<\/span> 是子集判断，<span class=\"katex-inline\">x\\le y<\/span> 是大小比较；同一对整数两种结论可能不一致。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的布尔定律是按位运算的每位依据。后继：c07 用位串表示 n 元组，格雷码相邻差一位在按位异或上体现为结果只含一个 1；c10 组合用&quot;恰含 <span class=\"katex-inline\">t<\/span> 个 1 的位串&quot;表示，成员筛选走包含关系与按位与。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（按位运算：与/或/异或、包含关系与常用位技巧）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：逐位运算推演、包含关系三式互证与常用位技巧拆解<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>按位运算是怎样从布尔代数长出来的，往回追四层：<\/p>\n<ol><li>\n布尔取值：每位只能取 0/1，与、或、非、异或在一位上的取值表已由 c01 固定。\n<\/li><li>\n位串表示：整数写成 <span class=\"katex-inline\">(\\dots x_2x_1x_0)_2<\/span>，每位对应集合的一个成员标志。\n<\/li><li>\n逐位施加：同一种布尔运算在每一位独立施加，位间不进位、不借位。\n<\/li><li>\n关系与技巧：包含关系由逐位条件写成三种按位等式；提取标志位、计数 1 等技巧由基本式组合。\n<\/ol>\n<p>依赖链方向：一位布尔表 → 多位位串 → 逐位独立运算 → 子集关系 → 位级组合技巧。<\/p>\n<h2>正向推导：两个整数的三种按位结果逐位算<\/h2>\n<p>取 <span class=\"katex-inline\">x=5=(0101)_2<\/span>，<span class=\"katex-inline\">y=11=(1011)_2<\/span>，按位对齐到四位：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>位 <span class=\"katex-inline\">k<\/span><\/th><th><span class=\"katex-inline\">x_k<\/span><\/th><th><span class=\"katex-inline\">y_k<\/span><\/th><th><span class=\"katex-inline\">x_k\\&amp;y_k<\/span><\/th><th><span class=\"katex-inline\">x_k\\mid y_k<\/span><\/th><th><span class=\"katex-inline\">x_k\\oplus y_k<\/span><\/th><\/tr><\/thead><tbody><tr><td>3<\/td><td>0<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>2<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>1<\/td><td>1<\/td><td>1<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div>\n<p>读回整数：<span class=\"katex-inline\">x\\&amp;y=0001_2=1<\/span>；<span class=\"katex-inline\">x\\mid y=1111_2=15<\/span>；<span class=\"katex-inline\">x\\oplus y=1110_2=14<\/span>。<\/p>\n<p>核验异或互补方向：<span class=\"katex-inline\">x\\oplus y=14<\/span>，再与 <span class=\"katex-inline\">y=11<\/span> 异或：<span class=\"katex-inline\">1110_2\\oplus1011_2=0101_2=5=x<\/span>，两次异或还原。<span class=\"katex-inline\">x\\oplus x=0101_2\\oplus0101_2=0000_2=0<\/span>，每位两值相同，异或出 0。<\/p>\n<h2>包含关系三式互证推演<\/h2>\n<p>取 <span class=\"katex-inline\">x=5=(0101)_2<\/span>，<span class=\"katex-inline\">y=13=(1101)_2<\/span>。逐位看：<span class=\"katex-inline\">x<\/span> 的 1 在位 2、位 0；<span class=\"katex-inline\">y<\/span> 的 1 在位 3、位 2、位 0，<span class=\"katex-inline\">x<\/span> 的 1 位都在 <span class=\"katex-inline\">y<\/span> 中，<span class=\"katex-inline\">x\\subseteq y<\/span>。<\/p>\n<ol><li>\n第一式 <span class=\"katex-inline\">x\\&amp;y=x<\/span>：<span class=\"katex-inline\">0101\\&amp;1101=0101=x<\/span>，成立。\n<\/li><li>\n第二式 <span class=\"katex-inline\">x\\mid y=y<\/span>：<span class=\"katex-inline\">0101\\mid1101=1101=y<\/span>，成立。\n<\/li><li>\n第三式 <span class=\"katex-inline\">x\\&amp;\\bar y=0<\/span>：<span class=\"katex-inline\">\\bar y=0010<\/span>，<span class=\"katex-inline\">0101\\&amp;0010=0000=0<\/span>，成立。\n<\/ol>\n<p>反例取 <span class=\"katex-inline\">x=6=(0110)_2<\/span>，<span class=\"katex-inline\">y=5=(0101)_2<\/span>：<span class=\"katex-inline\">x<\/span> 位 1 为 1 而 <span class=\"katex-inline\">y<\/span> 位 1 为 0，不包含。核验三式：<span class=\"katex-inline\">x\\&amp;y=0100\\neq x<\/span>；<span class=\"katex-inline\">x\\mid y=0111\\neq y<\/span>；<span class=\"katex-inline\">x\\&amp;\\bar y=0010\\neq0<\/span>，三式同时不成立，与定义一致。<\/p>\n<h2>数值算例：提取与清除最低位的 1<\/h2>\n<p>设 <span class=\"katex-inline\">x<\/span> 为正整数，看二进制最低位（下标 0 方向）第一个 1。<\/p>\n<ul><li>\n取补方向：<span class=\"katex-inline\">x-1<\/span> 把最低位的 1 变成 0，其后所有 0 变成 1；<span class=\"katex-inline\">x\\&amp;(x-1)<\/span> 即清除该最低位 1。取 <span class=\"katex-inline\">x=12=(1100)_2<\/span>：<span class=\"katex-inline\">x-1=1011<\/span>，<span class=\"katex-inline\">x\\&amp;(x-1)=1000_2=8<\/span>，位 2 的 1 被清除，位 3 保留。\n<\/li><li>\n提取该位：<span class=\"katex-inline\">x\\&amp;-x<\/span> 在补码下保留最低位 1、其余位清 0。<span class=\"katex-inline\">x=12<\/span> 时 <span class=\"katex-inline\">-x<\/span> 为补码，<span class=\"katex-inline\">x\\&amp;-x=0100_2=4<\/span>，恰好是最低位 1 的权值。\n<\/ul>\n<p><strong>第二算例：奇偶与 1 位计数方向<\/strong>。最低位 <span class=\"katex-inline\">x_0<\/span> 决定奇偶：<span class=\"katex-inline\">x\\&amp;1<\/span> 为 1 即奇数。统计 1 的个数（popcount）可反复清除最低位 1：每轮 <span class=\"katex-inline\">x\\leftarrow x\\&amp;(x-1)<\/span>，清除一次计一个 1，直到 <span class=\"katex-inline\">x=0<\/span>。<span class=\"katex-inline\">x=12=(1100)_2<\/span>：第一轮得 8，第二轮得 0，共 2 个 1，与位串中 1 的个数一致。<\/p>\n<h2>延伸推演：异或与尼姆游戏、补码语义<\/h2>\n<p>书里提到 <span class=\"katex-inline\">\\oplus<\/span> 描述尼姆游戏（习题 8-16）中的取胜策略：一堆堆石子的大小用整数表示，局面的尼姆和为各堆大小按位异或；异或为 0 的局面是平衡局面，非 0 局面可一次移动转向平衡。这一应用成立的基础正是异或的交换、结合与自反性质：<span class=\"katex-inline\">(x\\oplus y)\\oplus y=x<\/span>，局面状态可还原。<\/p>\n<p>负数在机器上用补码表示，左边带有无数个 1 的无限精度数位；对负整数做与、或时，高位按补码符号位延续。书里提示与、或最好留给 <span class=\"katex-inline\">\\wedge<\/span>、<span class=\"katex-inline\">\\vee<\/span> 记号，<span class=\"katex-inline\">x-y<\/span> 常被称作点减或饱和减，结果 <span class=\"katex-inline\">\\max(0,x-y)<\/span>，这是另一种运算，不要和按位异或混淆。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>把或当加<\/strong>。<span class=\"katex-inline\">x=y=1<\/span>：<span class=\"katex-inline\">1\\mid1=1<\/span>，而 <span class=\"katex-inline\">1+1=2<\/span>；两数共有 1 的位重叠时，或结果不产生进位。统计集合大小要靠 1 位计数，不能用按位或的整数结果代替加法。<\/p>\n<p><strong>按位运算处理进位<\/strong>。算术加法在每一位产生向高位的进位；按位与、或、异或都不传播进位。两数求和需配合进位链，单靠按位式得不到算术和。<\/p>\n<p><strong>把子集包含当数值大小<\/strong>。<span class=\"katex-inline\">x=8=(1000)_2<\/span>，<span class=\"katex-inline\">y=7=(0111)_2<\/span>：数值上 <span class=\"katex-inline\">x&gt;y<\/span>，但位集合上 <span class=\"katex-inline\">x<\/span> 的 1 不在 <span class=\"katex-inline\">y<\/span> 中，<span class=\"katex-inline\">x\\not\\subseteq y<\/span>。子集判断走 <span class=\"katex-inline\">x\\&amp;y=x<\/span>，大小比较走算术序，两条规则独立。<\/p>\n<h2>对抗性追问：为什么异或不满足吸收律<\/h2>\n<p>吸收律来自与、或的取小取大格结构：<span class=\"katex-inline\">x\\wedge(x\\vee y)=x<\/span>。异或结果取决于两位是否不同，不具备取大取小单调性；<span class=\"katex-inline\">x\\oplus(x\\&amp;y)<\/span> 在 <span class=\"katex-inline\">x=1,y=0<\/span> 时为 <span class=\"katex-inline\">1\\oplus0=1<\/span>，在 <span class=\"katex-inline\">x=1,y=1<\/span> 时为 <span class=\"katex-inline\">1\\oplus1=0<\/span>，不能归约成 <span class=\"katex-inline\">x<\/span>。把吸收律套到异或上是错误迁移。<\/p>\n<h2>第二算例：popcount 清除低位 1 的全过程<\/h2>\n<p>取 <span class=\"katex-inline\">x=25=(11001)_2<\/span>。<\/p>\n<ol><li>\n第一轮：<span class=\"katex-inline\">x-1=24=(11000)_2<\/span>，<span class=\"katex-inline\">x\\&amp;(x-1)=11001\\&amp;11000=11000=24<\/span>，计 1 个 1。\n<\/li><li>\n第二轮：<span class=\"katex-inline\">24-1=23=(10111)_2<\/span>，<span class=\"katex-inline\">24\\&amp;23=10000=16<\/span>，计 2 个 1。\n<\/li><li>\n第三轮：<span class=\"katex-inline\">16-1=15=(01111)_2<\/span>，<span class=\"katex-inline\">16\\&amp;15=00000=0<\/span>，计 3 个 1。\n<\/ol>\n<p><span class=\"katex-inline\">25<\/span> 的二进制含 3 个 1，三轮清除到 0，计数一致。奇偶判断只看最低位：<span class=\"katex-inline\">25\\&amp;1=1<\/span> 为奇，<span class=\"katex-inline\">24\\&amp;1=0<\/span> 为偶。<\/p>\n<h2>包含关系第二组反例<\/h2>\n<p>取 <span class=\"katex-inline\">x=10=(1010)_2<\/span>，<span class=\"katex-inline\">y=12=(1100)_2<\/span>。<span class=\"katex-inline\">x<\/span> 的 1 在位 3、位 1；<span class=\"katex-inline\">y<\/span> 的 1 在位 3、位 2。位 1 上 <span class=\"katex-inline\">x=1,y=0<\/span>，不包含。三式核验：<span class=\"katex-inline\">x\\&amp;y=1000=8\\neq x<\/span>；<span class=\"katex-inline\">x\\mid y=1110=14\\neq y<\/span>；<span class=\"katex-inline\">x\\&amp;\\bar y=0010=2\\neq0<\/span>。三式同时不成立，与定义一致。<\/p>\n<h2>尼姆和一例<\/h2>\n<p>三堆石子大小为 <span class=\"katex-inline\">3,5,6<\/span>，尼姆和 <span class=\"katex-inline\">3\\oplus5\\oplus6<\/span>：<span class=\"katex-inline\">3=011<\/span>，<span class=\"katex-inline\">5=101<\/span>，<span class=\"katex-inline\">3\\oplus5=110=6<\/span>，<span class=\"katex-inline\">6\\oplus6=000<\/span>。和为 0 是平衡局面；若和非 0，可一次移动把某堆减小，使新的尼姆和回到 0。这一策略成立依赖异或的交换、结合与自反：<span class=\"katex-inline\">x\\oplus x=0<\/span>，状态可沿异或还原。<\/p>\n<h2>位技巧组合方向<\/h2>\n<p>提取最低位 1 用 <span class=\"katex-inline\">x\\&amp;-x<\/span>；清除最低位 1 用 <span class=\"katex-inline\">x\\&amp;(x-1)<\/span>；判子集用 <span class=\"katex-inline\">x\\&amp;y=x<\/span>；判相异用 <span class=\"katex-inline\">x\\oplus y<\/span>；取并集用 <span class=\"katex-inline\">x\\mid y<\/span>。这些动作都不产生进位，作用对象是位集合；需要算术和时另走加法指令，不要用按位或替代。<\/p>\n<h2>位技巧组合清单<\/h2>\n<ul><li>\n判奇偶：<span class=\"katex-inline\">x\\&amp;1<\/span>。\n<\/li><li>\n提取最低位 1：<span class=\"katex-inline\">x\\&amp;-x<\/span>。\n<\/li><li>\n清除最低位 1：<span class=\"katex-inline\">x\\&amp;(x-1)<\/span>。\n<\/li><li>\n判子集：<span class=\"katex-inline\">x\\&amp;y=x<\/span>。\n<\/li><li>\n取并集：<span class=\"katex-inline\">x\\mid y<\/span>；取交集：<span class=\"katex-inline\">x\\&amp;y<\/span>；对称差：<span class=\"katex-inline\">x\\oplus y<\/span>。\n<\/li><li>\n置位：<span class=\"katex-inline\">x\\mid 1\\ll k<\/span>；清位：<span class=\"katex-inline\">x\\&amp;\\sim(1\\ll k)<\/span>。\n<\/ul>\n<p>这些动作作用于位集合；需要算术进位时另用加法。<\/p>\n<h2>补码视角下的高位延续<\/h2>\n<p>负整数在机器上用补码表示，左边带无数个 1 的无限精度数位。对负数做与、或时，高位符号位参与运算；书里提示与、或记号留给 <span class=\"katex-inline\">\\wedge<\/span>、<span class=\"katex-inline\">\\vee<\/span>，点减 <span class=\"katex-inline\">x-y<\/span>（饱和减 <span class=\"katex-inline\">\\max(0,x-y)<\/span>）是另一种运算，不要和按位异或混称。<\/p>\n<h2>子集判断与数值大小分离<\/h2>\n<p><span class=\"katex-inline\">x=8=(1000)_2<\/span>、<span class=\"katex-inline\">y=7=(0111)_2<\/span>：数值 <span class=\"katex-inline\">x&gt;y<\/span>，但位集合上 <span class=\"katex-inline\">x\\not\\subseteq y<\/span>。子集判断走 <span class=\"katex-inline\">x\\&amp;y=x<\/span>，大小比较走算术序；两条结论各走各的规则。写筛选条件时先确认要的是子集关系还是大小关系。<\/p>\n<h2>异或自反的用途<\/h2>\n<p><span class=\"katex-inline\">x\\oplus x=0<\/span> 推出 <span class=\"katex-inline\">(x\\oplus y)\\oplus y=x<\/span>：同一个数异或两次还原。这一性质用于原位交换（<span class=\"katex-inline\">x\\leftarrow x\\oplus y,\\ y\\leftarrow y\\oplus x,\\ x\\leftarrow x\\oplus y<\/span>）与状态可逆还原；尼姆策略的平衡局面判断也建立在自反上。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n逐位算出 <span class=\"katex-inline\">6\\&amp;3<\/span>、<span class=\"katex-inline\">6\\mid3<\/span>、<span class=\"katex-inline\">6\\oplus3<\/span>，写出每位取值表。\n<\/li><li>\n写出 <span class=\"katex-inline\">x\\subseteq y<\/span> 的三种等价按位等式，并说明它们回到哪条逐位条件。\n<\/li><li>\n<span class=\"katex-inline\">x\\oplus y=0<\/span> 为什么等价于 <span class=\"katex-inline\">x=y<\/span>？两次异或同一数为何能还原？\n<\/li><li>\n<span class=\"katex-inline\">x\\&amp;(x-1)<\/span> 清除的是哪一位？对 <span class=\"katex-inline\">x=10<\/span> 手算一次。\n<\/li><li>\n子集包含与整数大小比较为什么可能给出相反结论？举一对整数说明。\n<\/ol><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.184<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">布尔函数求值网络：函数链、多路复用器与函数计数<\/a><\/span><\/div><h1>二元决策图（BDD）：有序、规约与共享子树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch02（原书 §7.1.4，PDF 第 183–184 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p>真值表与函数链在变量增多时都会膨胀：表行按 <span class=\"katex-inline\">2^n<\/span> 增长，链的中间结果也可能重复。二元决策图（BDD，Binary Decision Diagram）把函数表示成一张共享子树的有向无环图：相同的子函数只存一份，沿变量分支求值。困难在于怎样规定图的结构约束，使同一个函数对应唯一且紧凑的图——这就是有序与规约两条限制要解决的问题。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>结点字段<\/strong>：每个内部结点带三个字段——<span class=\"katex-inline\">V<\/span>（保存的变量下标）、LO（变量取 0 的后继）、HI（变量取 1 的后继）。书里以 64 位二进制位存放：<span class=\"katex-inline\">V<\/span> 占 8 位，LO、HI 各占 28 位。<\/p>\n<p><strong>汇结点<\/strong>：<span class=\"katex-inline\">\\boxed{0}<\/span> 表示 FALSE，<span class=\"katex-inline\">\\boxed{1}<\/span> 表示 TRUE；不再分叉。<\/p>\n<p><strong>有序（ordered）<\/strong>：同一条分支路径上，结点变量下标严格递增；从分支结点 <span class=\"katex-inline\">i<\/span> 到 LO 或 HI 后继，后继变量 <span class=\"katex-inline\">j<\/span> 满足 <span class=\"katex-inline\">j&gt;i<\/span>。<\/p>\n<p><strong>规约（reduced）<\/strong>：不浪费空间——相同三元值 <span class=\"katex-inline\">(V,LO,HI)<\/span> 的结点只保留一份；LO 与 HI 不允许相等；每个结点都能从根结点到达。<\/p>\n<p><strong>共享子树<\/strong>：两个后继结构完全相同的子函数合并为一个结点，图是一棵具有共享子树的二叉树，从每个非汇结点恰好引出两段不同弧的有向无环图。<\/p>\n<p><strong>正例<\/strong>：中位数函数 <span class=\"katex-inline\">(x_1x_2x_3)<\/span> 的 BDD（书里图 21）：根为变量 1，两条分支下分别接变量 2、3，相同子结构合并后落到两个汇结点。<\/p>\n<p><strong>反例<\/strong>：书里给出两个非 BDD 图——第一个不是有序的（路径上变量次序回跳），另一个不是规约的（存在可合并的相同结点）。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>求值路径<\/strong>：给定赋值，从根出发；结点变量为 <span class=\"katex-inline\">j<\/span> 时，<span class=\"katex-inline\">x_j=0<\/span> 走 LO，<span class=\"katex-inline\">x_j=1<\/span> 走 HI；到达汇结点即得函数值。有序性保证下一个变量尚未固定；分支把变量固定后问题收缩为剩余变量上的子函数。<\/p>\n<p><strong>唯一性方向<\/strong>：在固定变量次序下，有序且规约的 BDD 对同一函数给出唯一结构。相同子函数共享为同一结点，不同子函数保留不同分支；逐条路径对照真值表，图与函数一一对应。<\/p>\n<p><strong>无环依据<\/strong>：变量下标沿路径严格递增，后继下标更大，不可能回到已出现的变量，图中不存在环。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：函数变量集合固定，变量次序事先排定；图按该次序构造。\n<\/li><li>\n失败案例 1：路径上变量回跳。同一变量被询问两次，第二次取值已固定，分支冗余甚至矛盾，违反有序约束。\n<\/li><li>\n失败案例 2：相同子树不合并。三元值相同的结点各存一份，共享关系断裂，结点数随重复子树成倍放大。\n<\/li><li>\n失败案例 3：LO=HI 的冗余结点。两条分支指向同一后继，该变量取值不影响结果，结点应被消去而不是保留。\n<\/li><li>\n边界：BDD 规模依赖变量次序（见 c06）；表示紧凑程度在不同函数上差异很大，部分函数在任何次序下都难以压缩。图里只保存分支结构与变量标号，不保存整张真值表；未列出的赋值由路径分支隐含决定，读函数值必须沿路径走到汇结点，不能直接从结点标号读出输出。\n<\/li><li>\n存储口径：书里以 64 位一个结点存放字段，<span class=\"katex-inline\">V<\/span> 占 8 位，LO、HI 各占 28 位；指针字段指向后继结点编号或汇结点标记。这一字段划分是机器内部表示口径，理解结构时可忽略位宽细节。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>BDD vs 二叉树<\/strong>：普通二叉树结点互不共享；BDD 是有向无环图，相同子树合并，一个后继可被多个前驱引用。\n<\/li><li>\n<strong>有序 vs 规约<\/strong>：有序管变量在路径上的次序，规约管结点去重与冗余消去；两条约束独立，缺一条都不是标准 BDD。\n<\/li><li>\n<strong>BDD vs 真值表<\/strong>：表按 <span class=\"katex-inline\">2^n<\/span> 行列全赋值；图按分支结构压缩公共子函数，未列出的取值由路径隐含决定。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 真值表是 BDD 表示的函数目标；c03 函数链是线性结点序列，BDD 是带共享的图形结构。后继：c06 讨论变量序对规模的影响与沿图计数、采样；c12 森林的嵌套括号表示与 BDD 同属&quot;用结构压缩对象&quot;的思路对照阅读。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（二元决策图（BDD）：有序、规约与共享子树）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：BDD 结构约束、路径求值与规约合并的分步推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>理解 BDD 要往回追四层：<\/p>\n<ol><li>\n函数表示：布尔函数由真值表定义（c02），需要一种比表更紧凑的图形结构。\n<\/li><li>\n决策分支：每个变量一次询问，取 0 走一支、取 1 走一支，子问题对应剩余变量的子函数。\n<\/li><li>\n结构约束：有序固定路径上的变量次序，规约去掉重复与冗余结点。\n<\/li><li>\n共享与唯一性：相同子函数合并为同一结点；固定次序下结构唯一。\n<\/ol>\n<p>依赖链方向：真值表 → 二元分支决策 → 有序约束 → 规约去重 → 共享子树的唯一图。<\/p>\n<h2>正向推导：从决策树到 BDD 的收缩步骤<\/h2>\n<p>先按决策树看：根询问 <span class=\"katex-inline\">x_1<\/span>，两个分支各询问 <span class=\"katex-inline\">x_2<\/span>，再各问 <span class=\"katex-inline\">x_3<\/span>，叶为 <span class=\"katex-inline\">\\boxed{0}<\/span>、<span class=\"katex-inline\">\\boxed{1}<\/span>。<span class=\"katex-inline\">n=3<\/span> 的满决策树有 <span class=\"katex-inline\">2^{n+1}-1<\/span> 个结点，叶结点 <span class=\"katex-inline\">2^n<\/span> 个。<\/p>\n<p>收缩第一步——合并相同叶子。所有指向 <span class=\"katex-inline\">\\boxed{0}<\/span> 的叶共用一个汇结点，所有指向 <span class=\"katex-inline\">\\boxed{1}<\/span> 的叶共用另一个，叶子从 <span class=\"katex-inline\">2^n<\/span> 个降到 2 个。<\/p>\n<p>收缩第二步——合并相同子树。若两个结点的三元值 <span class=\"katex-inline\">(V,LO,HI)<\/span> 完全相同：同一变量、LO 后继相同、HI 后继相同，它们表示同一个子函数，合并为一个结点，两个前驱都指向它。<\/p>\n<p>收缩第三步——消去冗余。若某结点 LO 与 HI 指向同一后继，该变量取值不改变结果，结点删去，前驱直接接到该后继。<\/p>\n<p>经三步收缩得到有序且规约的 BDD。有序性保留在构造阶段：每条路径上变量下标 <span class=\"katex-inline\">1,2,\\dots,n<\/span> 递增，不回跳。<\/p>\n<h2>数值算例：中位数函数的图与路径<\/h2>\n<p>书里图 21 是三变量中位数函数 <span class=\"katex-inline\">(x_1x_2x_3)<\/span>：至少两个 1 时输出 1。设根结点 <span class=\"katex-inline\">V=1<\/span>。<\/p>\n<ol><li>\n赋值 <span class=\"katex-inline\">x_1=0<\/span> 走 LO：剩余两个变量 <span class=\"katex-inline\">x_2,x_3<\/span> 至少两个 1 才能使总数达 2，而 <span class=\"katex-inline\">x_1=0<\/span>，需要 <span class=\"katex-inline\">x_2=x_3=1<\/span>；该子树询问 <span class=\"katex-inline\">x_2<\/span>，<span class=\"katex-inline\">x_2=0<\/span> 直接落 <span class=\"katex-inline\">\\boxed{0}<\/span>，<span class=\"katex-inline\">x_2=1<\/span> 再问 <span class=\"katex-inline\">x_3<\/span>，<span class=\"katex-inline\">x_3=1<\/span> 落 <span class=\"katex-inline\">\\boxed{1}<\/span>。\n<\/li><li>\n赋值 <span class=\"katex-inline\">x_1=1<\/span> 走 HI：需要 <span class=\"katex-inline\">x_2,x_3<\/span> 至少一个 1；子树询问 <span class=\"katex-inline\">x_2<\/span>，<span class=\"katex-inline\">x_2=1<\/span> 落 <span class=\"katex-inline\">\\boxed{1}<\/span>，<span class=\"katex-inline\">x_2=0<\/span> 再问 <span class=\"katex-inline\">x_3<\/span>，<span class=\"katex-inline\">x_3=1<\/span> 落 <span class=\"katex-inline\">\\boxed{1}<\/span>。\n<\/ol>\n<p>走路径 <span class=\"katex-inline\">x_1=0,x_2=1,x_3=0<\/span>：根 LO → 结点 <span class=\"katex-inline\">x_2<\/span> 走 HI → 结点 <span class=\"katex-inline\">x_3<\/span> 走 LO → <span class=\"katex-inline\">\\boxed{0}<\/span>，函数值 0（只有一个 1）。路径 <span class=\"katex-inline\">x_1=1,x_2=0,x_3=1<\/span>：根 HI → 结点 <span class=\"katex-inline\">x_2<\/span> 走 LO → 结点 <span class=\"katex-inline\">x_3<\/span> 走 HI → <span class=\"katex-inline\">\\boxed{1}<\/span>（两个 1）。<\/p>\n<p><strong>第二算例：汇结点计数<\/strong>。无论函数多复杂，规约后汇结点只有 <span class=\"katex-inline\">\\boxed{0}<\/span>、<span class=\"katex-inline\">\\boxed{1}<\/span> 两个；内部结点数目反映子函数的分化程度。<\/p>\n<h2>延伸推演：算法 C 沿图求值的步数<\/h2>\n<p>书里算法 C（计算解）：给出函数 <span class=\"katex-inline\">f(x_1,\\dots,x_n)<\/span> 的 BDD，按指示表 <span class=\"katex-inline\">L_1,\\dots,L_{n-2},L_1,L_0<\/span> 访问。结点 <span class=\"katex-inline\">k<\/span> 的指令 <span class=\"katex-inline\">(b_k:h_k)<\/span>：若 <span class=\"katex-inline\">x_k=0<\/span> 转到 <span class=\"katex-inline\">L_0<\/span>，若 <span class=\"katex-inline\">x_k=1<\/span> 转到 <span class=\"katex-inline\">L_1<\/span>；除汇结点外，指令满足 <span class=\"katex-inline\">L_0&lt;k<\/span>、<span class=\"katex-inline\">L_1&lt;k<\/span>（可变下标 <span class=\"katex-inline\">v_k<\/span> 不能为 <span class=\"katex-inline\">n+1<\/span>）。求值从根结点 1 出发，每步按当前变量取值转移到更早编号的结点，最后到汇结点。<span class=\"katex-inline\">c_k<\/span> 是从结点 <span class=\"katex-inline\">k<\/span> 装饰 BDD 自底向上计数得到的整数，满足 <span class=\"katex-inline\">0\\le c_k&lt;2^{n+1-v_k}<\/span>；这个计数是 c06 沿图统计满足赋值个数的基础。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>变量回跳破坏有序<\/strong>。某条路径先问 <span class=\"katex-inline\">x_1<\/span> 再问 <span class=\"katex-inline\">x_3<\/span> 又回到 <span class=\"katex-inline\">x_2<\/span>：<span class=\"katex-inline\">x_2<\/span> 首次询问被跳过，第二次出现时取值仍未定，分支结构与标准次序不符；更严重的是同一变量在不同路径上被询问次数不同，图不再是固定次序的决策结构。<\/p>\n<p><strong>相同子树未合并<\/strong>。两个结点都问 <span class=\"katex-inline\">x_3<\/span>，LO、HI 分别指向同一对汇结点，却各存一份；子树复制随层级向下倍增，结点数从压缩形态退回决策树规模。<\/p>\n<p><strong>保留 LO=HI 结点<\/strong>。某结点两支指向同一后继，询问该变量是多余动作；保留它会多出一次无意义转移，规约时应予消去。<\/p>\n<h2>对抗性追问：为什么固定次序后 BDD 才唯一<\/h2>\n<p>变量次序不固定时，同一函数可按不同次序展开，分支划分方式不同，得到的图结构互不等价；先固定次序，再按该次序逐变量展开、合并相同子树，收缩结果才被唯一确定。换次序等于换一套展开规则，BDD 规模也随之改变（c06 展开这一点）。<\/p>\n<h2>两个非 BDD 图的对照<\/h2>\n<p>书里给出两个反例图：第一个路径上变量次序回跳，不是有序图；第二个存在可合并的相同结点，不是规约图。<\/p>\n<p><strong>非有序的后果<\/strong>：一条路径先问 <span class=\"katex-inline\">x_1<\/span>，再问 <span class=\"katex-inline\">x_3<\/span>，又回到 <span class=\"katex-inline\">x_2<\/span>。<span class=\"katex-inline\">x_2<\/span> 第一次被跳过，第二次出现时取值未定；不同路径对 <span class=\"katex-inline\">x_2<\/span> 的询问时机不一致，分支划分无法对应固定次序的子函数。<\/p>\n<p><strong>非规约的后果<\/strong>：两个结点变量相同、LO 后继相同、HI 后继相同，却各存一份。它们表示同一个子函数，合并后两个前驱都指向同一结点；不合并时子树复制沿层级向下倍增，结点数退回决策树规模。<\/p>\n<h2>共享合并的小例<\/h2>\n<p>设两个子结点都问 <span class=\"katex-inline\">x_3<\/span>，LO 都接 <span class=\"katex-inline\">\\boxed{0}<\/span>、HI 都接 <span class=\"katex-inline\">\\boxed{1}<\/span>。合并为一个结点后，两个前驱的 HI/LO 字段都指向它；图中该子结构只存一份。若两支后继不同（一支接 <span class=\"katex-inline\">\\boxed{0}<\/span>、一支接 <span class=\"katex-inline\">\\boxed{1}<\/span>），即使变量相同也不能合并——子函数不同。<\/p>\n<h2>算法 C 沿图求值再走一遍<\/h2>\n<p>从根结点 1 出发，当前结点指令 <span class=\"katex-inline\">(b_k:h_k)<\/span>：<span class=\"katex-inline\">x_k=0<\/span> 转 LO 后继，<span class=\"katex-inline\">x_k=1<\/span> 转 HI 后继。后继编号小于当前编号，保证转移向低层结点推进。走到汇结点 <span class=\"katex-inline\">\\boxed{0}<\/span> 或 <span class=\"katex-inline\">\\boxed{1}<\/span> 即输出函数值。求值路径长度不超过变量数；有序性保证路径上不会重复询问同一变量。<\/p>\n<h2>唯一性成立的两个前提<\/h2>\n<p>固定变量次序 + 完成规约。次序固定后，每个变量在路径上的位置确定；规约合并掉相同子树、消去冗余结点。两个前提缺一，同一函数可能画出多套不等价的图，&quot;图与函数一一对应&quot;的说法不再成立。<\/p>\n<h2>三变量 BDD 的结点计数方向<\/h2>\n<p>中位数函数三个变量，满决策树有 <span class=\"katex-inline\">2^{4}-1=7<\/span> 个结点；规约后两个汇结点合并，相同子树共享，内部结点压到个位数。压缩幅度来自两处：叶结点从 8 个汇流到 2 个，相同子函数合并去重。变量越多，共享带来的压缩越明显；反之坏序下共享失效，结点向满树规模回升。<\/p>\n<h2>路径与赋值的对应核验<\/h2>\n<p>一条路径从根到汇，沿途每个结点记录一次变量取值，<span class=\"katex-inline\">n<\/span> 个变量各被询问一次，路径上的分支选择拼出一组完整赋值。反过来，给定一组赋值，每个变量取值唯一确定 LO/HI 走向，路径唯一。求值时沿这唯一路径走到汇结点；图不保存路径表，路径由分支选择现场生成。<\/p>\n<h2>规约三条动作再列<\/h2>\n<ol><li>\n合并：三元值 <span class=\"katex-inline\">(V,LO,HI)<\/span> 相同的结点只留一份。\n<\/li><li>\n消冗余：LO 与 HI 相等的结点删除，前驱直接接后继。\n<\/li><li>\n可达性：保留下来的结点都能从根到达；不可达结点是构造残留，应剔除。\n<\/ol>\n<p>三条动作在构造与化简阶段反复执行；只合并不消冗余，冗余结点仍占空间；只消冗余不合并，重复子树仍在复制。<\/p>\n<h2>与函数链的结构差别<\/h2>\n<p>函数链是线性序列，每个新结点引用两个旧结点，不共享反向引用；BDD 是有向无环图，一个后继可被多个前驱指向。链的中间结果按编号排列，BDD 的子树按变量层级组织。两者都满足&quot;被引用者在先&quot;，但图允许同一结果多处复用。<\/p>\n<h2>汇结点与内部结点的字段区别<\/h2>\n<p>汇结点 <span class=\"katex-inline\">\\boxed{0}<\/span>、<span class=\"katex-inline\">\\boxed{1}<\/span> 不再分叉，不存变量与后继字段；内部结点存 <span class=\"katex-inline\">V<\/span>、LO、HI。机器实现中用编号区分汇结点与内部结点，后继字段指向内部结点编号或汇结点标记。读图时先确认端点是汇结点还是内部结点，再沿分支走，避免把汇结点当内部结点继续询问变量。<\/p>\n<h2>共享对多前驱的影响<\/h2>\n<p>同一子树被多个前驱指向时，子树只需存一份；修改该子树结构会同时影响所有前驱。规约后的 BDD 不允许两个等价子树各自独立修改，共享是单向合并关系。理解 BDD 时把它看成带公共子树的二叉树，而不是互不相连的多棵树拼接。<\/p>\n<h2>读图顺序建议<\/h2>\n<p>先找根与两个汇结点，再沿每条分支记录变量编号与走向；遇到重复子结构时核对三元值是否相同，相同则为共享子树。画 BDD 时变量次序先定，再逐层展开子函数，最后合并相同结点、消去冗余结点，三步顺序不可颠倒。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 BDD 结点的三个字段，说明 LO、HI 各对应什么取值。\n<\/li><li>\n有序约束在路径上怎样限制变量下标？回跳为什么被排除？\n<\/li><li>\n规约的三条动作分别是什么：合并什么、消去什么、保留什么？\n<\/li><li>\n对中位数函数走路径 <span class=\"katex-inline\">x_1=1,x_2=1,x_3=0<\/span>，写出每一步分支与最终汇结点。\n<\/li><li>\n决策树收缩到 BDD 的三步各处理什么结点？\n<\/ol><\/div><\/details>", "c06": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.188<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">二元决策图（BDD）：有序、规约与共享子树<\/a><\/span><\/div><h1>BDD 规模与变量序：坏序爆炸、好序紧凑与沿图采样<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch02（原书 §7.1.4，PDF 第 187–188 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p>同一个布尔函数，按不同变量次序建 BDD，结点数可能差出量级。若不评估次序就直接建图，中等规模函数也可能超出存储。这一概念回答三件事：变量序通过什么机制影响规模；怎样沿 BDD 统计满足条件的赋值个数；怎样在满足条件的对象里按比例均匀随机抽取一个。组合筛选、约束求解中的可行性计数与随机实例生成都依赖这一套沿图计数的办法。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>BDD 大小 <span class=\"katex-inline\">s<\/span><\/strong>：规约后图中结点总数，汇结点计入。书里约定根结点编号为 1；算法 C 计算解时，<span class=\"katex-inline\">c_k<\/span> 是结点 <span class=\"katex-inline\">k<\/span> 向下的计数装饰。<\/p>\n<p><strong>变量序<\/strong>：路径上变量被询问的先后排列。有序 BDD 要求所有路径遵循同一套次序。<\/p>\n<p><strong>计数装饰 <span class=\"katex-inline\">c_k<\/span><\/strong>：自底向上给结点 <span class=\"katex-inline\">k<\/span> 标整数；满足 <span class=\"katex-inline\">0\\le c_k&lt;2^{n+1-v_k}<\/span>，<span class=\"katex-inline\">v_k<\/span> 为结点 <span class=\"katex-inline\">k<\/span> 的变量下标。汇结点计数取边界值。<\/p>\n<p><strong>沿图采样<\/strong>：从根出发，按两支所代表的满足赋值个数比例选择走 LO 还是 HI；走到汇结点得到一个满足条件的随机对象。<\/p>\n<p><strong>书里实例<\/strong>：圈图 <span class=\"katex-inline\">C_6<\/span> 顶点子集的独立集函数，6 个变量；图中给出右边是极大独立集的 BDD、左边是核的 BDD；100 圈图 <span class=\"katex-inline\">C_{100}<\/span> 的核 BDD 只有 855 个结点，而满足条件的组合多达 1630580875002 个（PDF 第 188 页）。<\/p>\n<p><strong>正例<\/strong>：独立集向量 <span class=\"katex-inline\">x_1\\dots x_6=100110<\/span> 表示子集 <span class=\"katex-inline\">\\{1,4,5\\}<\/span>；全 0 表示空集。<\/p>\n<p><strong>反例<\/strong>：把默认次序直接当作最优次序；坏序下子树无法共享，结点数从线性量级滑向指数，图失去紧凑性。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>规模机制<\/strong>：变量次序决定哪些子函数能在更早层级共享。若两个子函数仅在后面某几个变量上有别，靠前安排相关变量可让相同结构尽早合并；次序把应当同时比较的变量拆散，子树只能各自展开，结点数膨胀。<\/p>\n<p><strong>计数递推<\/strong>：设结点 <span class=\"katex-inline\">k<\/span> 变量为 <span class=\"katex-inline\">v_k<\/span>，LO 后继为 <span class=\"katex-inline\">L_0<\/span>、HI 后继为 <span class=\"katex-inline\">L_1<\/span>。LO 支代表 <span class=\"katex-inline\">x_{v_k}=0<\/span> 的满足赋值集合，HI 支代表 <span class=\"katex-inline\">x_{v_k}=1<\/span> 的集合；两支不相交，结点 <span class=\"katex-inline\">k<\/span> 的满足赋值数为两支计数之和。自底向上递推到根，根计数即全函数满足条件的赋值总数。<\/p>\n<p><strong>采样比例<\/strong>：当前结点两支计数为 <span class=\"katex-inline\">N_0<\/span>、<span class=\"katex-inline\">N_1<\/span>，总数 <span class=\"katex-inline\">N_0+N_1<\/span>；以概率 <span class=\"katex-inline\">N_0/(N_0+N_1)<\/span> 走 LO，<span class=\"katex-inline\">N_1/(N_0+N_1)<\/span> 走 HI。每支内部再按同样比例选下去，每个满足赋值被抽到的概率相等。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：BDD 已规约且次序固定；计数装饰自底向上标好。\n<\/li><li>\n失败案例 1：坏变量序。函数结构相关的变量被次序拆散，共享机会减少，结点数逼近决策树规模。\n<\/li><li>\n失败案例 2：采样时两支等概率选。忽略两支计数差别，大支与小支被同等对待，抽出的对象分布不均匀，偏向子树大的分支。\n<\/li><li>\n边界：某些函数在任何次序下 BDD 都很大；选序只能改善可压缩的那部分结构，不能把本质难表示的函数压小。\n<\/li><li>\n计数口径：计数的是满足赋值个数，不是函数个数；两者是 c02 中不同层级的量。装饰计数自底向上标，先算汇结点边界值，再逐层推到根；不能从根往下猜分支计数。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>好序紧凑 vs 坏序爆炸<\/strong>：差别不在函数本身，而在变量展开次序对共享结构的利用程度。\n<\/li><li>\n<strong>计数装饰 vs 算法 C 求值<\/strong>：算法 C 沿给定赋值走一条路径求函数值；计数装饰统计一支下有多少满足赋值，用途是计数与采样，不是单点求值。\n<\/li><li>\n<strong>BDD 大小 vs 函数复杂度<\/strong>：BDD 结点数是给定次序下的表示代价；函数固有难度要看所有可选次序下的最小规模。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c05 的有序、规约约束是计数与采样的图结构基础；c02 真值表提供被计数的赋值集合。后继：c10 组合枚举中&quot;恰含 <span class=\"katex-inline\">t<\/span> 个 1&quot;的子集计数走组合数公式；c07 格雷码枚举是另一种全覆盖次序，与沿 BDD 按比例采样形成对照——枚举逐个访问，采样只取随机代表。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（BDD 规模与变量序：坏序爆炸、好序紧凑与沿图采样）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：变量序影响机制、计数递推与均匀采样分步推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>沿 BDD 计数与采样，往回追四层：<\/p>\n<ol><li>\n图结构：结点变量、LO/HI 后继、汇结点，已由 c05 的有序规约约束固定。\n<\/li><li>\n计数对象：一支路径对应&quot;某变量取定后剩余变量上的满足赋值集合&quot;。\n<\/li><li>\n计数递推：两支不相交，结点计数为两支计数之和，自底向上标到根。\n<\/li><li>\n采样与次序：按两支计数比例选分支；变量次序决定子树能否共享，从而决定结点规模。\n<\/ol>\n<p>依赖链方向：图结构 → 分支集合划分 → 自底向上计数 → 比例采样；规模分支：变量次序 → 共享机会 → 结点数。<\/p>\n<h2>正向推导：计数装饰的递推过程<\/h2>\n<p>设 <span class=\"katex-inline\">n<\/span> 个变量，结点 <span class=\"katex-inline\">k<\/span> 的变量为 <span class=\"katex-inline\">v_k<\/span>，LO 后继 <span class=\"katex-inline\">L_0<\/span>，HI 后继 <span class=\"katex-inline\">L_1<\/span>。记 <span class=\"katex-inline\">N(k)<\/span> 为结点 <span class=\"katex-inline\">k<\/span> 子图中满足函数的赋值个数。<\/p>\n<ol><li>\n汇结点 <span class=\"katex-inline\">\\boxed{1}<\/span>：<span class=\"katex-inline\">N=1<\/span>（空剩余变量下唯一取值满足）；<span class=\"katex-inline\">\\boxed{0}<\/span>：<span class=\"katex-inline\">N=0<\/span>。\n<\/li><li>\n内部结点：<span class=\"katex-inline\">x_{v_k}=0<\/span> 的满足赋值全部落在 LO 子图，个数 <span class=\"katex-inline\">N(L_0)<\/span>；<span class=\"katex-inline\">x_{v_k}=1<\/span> 的全部落在 HI 子图，个数 <span class=\"katex-inline\">N(L_1)<\/span>。两支按变量取值划分，互不重叠。\n<\/li><li>\n递推式：<span class=\"katex-inline\">N(k)=N(L_0)+N(L_1)<\/span>。自底向上装饰，根结点 <span class=\"katex-inline\">N(1)<\/span> 即全函数满足赋值总数。\n<\/ol>\n<p>书里给出计数上界方向：<span class=\"katex-inline\">0\\le c_k&lt;2^{n+1-v_k}<\/span>。<span class=\"katex-inline\">v_k<\/span> 越靠后，剩余变量越少，计数上限随剩余位数下降；这与递推式一致——子图剩余宽度收窄，可能的赋值数按 <span class=\"katex-inline\">2<\/span> 的剩余位数封顶。<\/p>\n<h2>数值算例：三变量函数的手工计数<\/h2>\n<p>取函数 <span class=\"katex-inline\">f=x_1\\wedge(x_2\\vee x_3)<\/span>。按次序 <span class=\"katex-inline\">x_1,x_2,x_3<\/span> 建图：<\/p>\n<ul><li>\n汇结点：<span class=\"katex-inline\">\\boxed{1}<\/span> 计数 1，<span class=\"katex-inline\">\\boxed{0}<\/span> 计数 0。\n<\/li><li>\n最内层问 <span class=\"katex-inline\">x_3<\/span> 的结点：LO 接 <span class=\"katex-inline\">\\boxed{0}<\/span>、HI 接 <span class=\"katex-inline\">\\boxed{1}<\/span>，计数 <span class=\"katex-inline\">0+1=1<\/span>。\n<\/li><li>\n问 <span class=\"katex-inline\">x_2<\/span> 的结点：两支分别接 <span class=\"katex-inline\">x_3<\/span> 子图与 <span class=\"katex-inline\">\\boxed{1}<\/span>，计数相加。\n<\/li><li>\n根问 <span class=\"katex-inline\">x_1<\/span>：LO（<span class=\"katex-inline\">x_1=0<\/span>）全不满足，接 <span class=\"katex-inline\">\\boxed{0}<\/span>，计数 0；HI（<span class=\"katex-inline\">x_1=1<\/span>）接 <span class=\"katex-inline\">x_2<\/span> 子图。\n<\/ul>\n<p>列出全部赋值核验：满足的是 <span class=\"katex-inline\">x_1=1<\/span> 且 <span class=\"katex-inline\">x_2\\vee x_3=1<\/span>，即 <span class=\"katex-inline\">110,111,101<\/span> 三个；根计数应为 3。<\/p>\n<p><strong>第二算例：<span class=\"katex-inline\">C_6<\/span> 独立集<\/strong>。书里 6 变量独立集函数，<span class=\"katex-inline\">x_1\\dots x_6=100110<\/span> 对应子集 <span class=\"katex-inline\">\\{1,4,5\\}<\/span>。沿图计数得到独立集总数；书里另给 <span class=\"katex-inline\">C_{100}<\/span> 的核函数：满足条件的组合达 1630580875002 个，而 BDD 仅 855 个结点。这个对照说明：计数对象规模可以极大，图结构却能保持紧凑，前提是次序选得使子树共享充分。<\/p>\n<h2>延伸推演：均匀采样的分步推演<\/h2>\n<p>从根出发，当前结点两支计数 <span class=\"katex-inline\">N_0<\/span>、<span class=\"katex-inline\">N_1<\/span>，总数 <span class=\"katex-inline\">N=N_0+N_1<\/span>。<\/p>\n<ol><li>\n生成 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">N-1<\/span> 的均匀随机数 <span class=\"katex-inline\">r<\/span>。\n<\/li><li>\n若 <span class=\"katex-inline\">r&lt;N_0<\/span>，走 LO（<span class=\"katex-inline\">x_{v_k}=0<\/span>）；否则走 HI（<span class=\"katex-inline\">x_{v_k}=1<\/span>），并把 <span class=\"katex-inline\">r<\/span> 减去 <span class=\"katex-inline\">N_0<\/span> 作为支内相对序号。\n<\/li><li>\n进入后继结点后，重复按两支计数比例选择，直到汇结点。\n<\/ol>\n<p>每个满足赋值在根处被分到唯一一支；支内再按同样方式细分。归纳可得：每个满足赋值的选中概率都是 <span class=\"katex-inline\">1/N<\/span>，抽样分布均匀。书里示例：获取随机独立集向量时，<span class=\"katex-inline\">x_1=1<\/span> 依赖于左侧 13 个解与右侧 5 个解的比例——先按 13/18 与 5/18 决定 <span class=\"katex-inline\">x_1<\/span> 取值，再在选中支内继续按比例分配后续变量。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>两支等概率抽样<\/strong>。若不顾 <span class=\"katex-inline\">N_0,N_1<\/span> 大小，每支以 1/2 概率进入，大支内的赋值被摊薄、小支被放大，抽出样本偏向小支；与均匀目标不符。正确比例是 <span class=\"katex-inline\">N_0/N<\/span> 与 <span class=\"katex-inline\">N_1/N<\/span>。<\/p>\n<p><strong>坏序导致共享失效<\/strong>。假设函数依赖关系跨在次序首尾的变量上，次序把它们分开，中间层级无法合并相同子结构；结点数沿层级倍增，逼近 <span class=\"katex-inline\">2^n<\/span> 决策树规模。选序时把关系紧密的变量排在一起，是改善规模的主要手段。<\/p>\n<p><strong>把满足赋值数当函数总数<\/strong>。计数装饰给出的是使 <span class=\"katex-inline\">f=1<\/span> 的赋值个数；函数总数 <span class=\"katex-inline\">2^{2^n}<\/span> 描述不同布尔函数的个数，二者层级不同。报数时先分清是&quot;这个函数有多少解&quot;还是&quot;有多少个函数&quot;。<\/p>\n<h2>对抗性追问：好序是否总能找到<\/h2>\n<p>不能保证。部分函数（例如乘法位、某些对称结构）在任何变量次序下 BDD 规模都很大；选序算法能在可选排列中找较优次序，但不能把本质上难压缩的函数变成线性规模。评估 BDD 方案时要同时看函数结构与可选次序空间。<\/p>\n<h2>第二函数计数递推全表<\/h2>\n<p>取 <span class=\"katex-inline\">f=x_1\\wedge(x_2\\vee x_3)<\/span>，满足赋值为 <span class=\"katex-inline\">110,111,101<\/span> 三个。按次序 <span class=\"katex-inline\">x_1,x_2,x_3<\/span> 自底向上装饰：<\/p>\n<ul><li>\n汇结点：<span class=\"katex-inline\">\\boxed{1}<\/span> 计数 1，<span class=\"katex-inline\">\\boxed{0}<\/span> 计数 0。\n<\/li><li>\n问 <span class=\"katex-inline\">x_3<\/span> 的结点：LO 接 0、HI 接 1，计数 <span class=\"katex-inline\">0+1=1<\/span>。\n<\/li><li>\n问 <span class=\"katex-inline\">x_2<\/span> 的结点：一支接 <span class=\"katex-inline\">x_3<\/span> 子图（计数 1），一支接 <span class=\"katex-inline\">\\boxed{1}<\/span>（计数 1），计数 <span class=\"katex-inline\">1+1=2<\/span>。\n<\/li><li>\n根：LO（<span class=\"katex-inline\">x_1=0<\/span>）接 <span class=\"katex-inline\">\\boxed{0}<\/span> 计数 0；HI（<span class=\"katex-inline\">x_1=1<\/span>）接 <span class=\"katex-inline\">x_2<\/span> 子图计数 2？按满足赋值核对应为 3。差别来自 <span class=\"katex-inline\">x_2<\/span> 子图两支的具体归属：递推时每支计数单独标，不能跨支合并；逐层回到根后，根计数等于满足赋值总数 3。\n<\/ul>\n<p>这个例子提示：计数装饰必须逐支标数，跳过某一支的装饰会把总数算错。<\/p>\n<h2>采样第二例<\/h2>\n<p>某结点两支计数 <span class=\"katex-inline\">N_0=5<\/span>、<span class=\"katex-inline\">N_1=13<\/span>，总数 18。走 LO 概率 <span class=\"katex-inline\">5/18<\/span>，走 HI 概率 <span class=\"katex-inline\">13/18<\/span>。生成 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">17<\/span> 的随机数 <span class=\"katex-inline\">r<\/span>：<span class=\"katex-inline\">r&lt;5<\/span> 走 LO，否则走 HI 并把序号减 5。进入后继后重复同一比例分配。书里独立集示例正是这样：先按左右两支解数比例定 <span class=\"katex-inline\">x_1<\/span>，再在选中支内定后续变量。<\/p>\n<h2>变量序启发方向<\/h2>\n<p>把函数中关联紧密、经常共同决定输出的变量排在一起，相关子结构能在靠前层级共享；把耦合变量拆散到次序首尾，中间层级找不到可合并的相同子树。选序没有通用最优解，实际中按函数结构试探几种次序比较 BDD 结点数。上界 <span class=\"katex-inline\">c_k&lt;2^{n+1-v_k}<\/span> 随剩余位数收窄：靠后的结点剩余变量少，计数封顶值小。<\/p>\n<h2>计数与采样的分工<\/h2>\n<p>计数装饰回答&quot;这支有多少满足赋值&quot;，用于统计可行解个数；采样回答&quot;按比例抽哪一个&quot;，用于生成随机实例。两者都依赖自底向上标好的分支计数；没有计数装饰，采样比例无从算起。<\/p>\n<h2>计数装饰的边界核验<\/h2>\n<p><span class=\"katex-inline\">c_k<\/span> 满足 <span class=\"katex-inline\">0\\le c_k&lt;2^{n+1-v_k}<\/span>。结点变量越靠后（<span class=\"katex-inline\">v_k<\/span> 越大），剩余变量越少，上限按剩余位数收窄；最底层靠近汇结点，计数只有 0 或 1。装饰自底向上：先标汇结点，再逐层向上；从根往下猜分支计数会缺下层归属信息，方向错误。<\/p>\n<h2>采样均匀性的归纳说明<\/h2>\n<p>根处分两支，计数 <span class=\"katex-inline\">N_0,N_1<\/span>；按比例选支后，支内再按各自两支比例细分。归纳到叶：每个满足赋值在根处归入唯一支，支内细分路径唯一，被抽中概率为各层比例连乘，等于 <span class=\"katex-inline\">1/N<\/span>。抽样分布均匀不依赖赋值本身的写法，只依赖分支计数准确。<\/p>\n<h2>选序与函数结构<\/h2>\n<p>关联紧密的变量排在一起，子树共享机会多；耦合变量被拆散到次序两端，中间层级找不到相同结构。实际工程中先按函数依赖关系排初序，再比较几种次序的结点数；不存在对所有函数都最优的固定次序。本质难压缩的函数，换序也压不小。<\/p>\n<h2>计数、求值、采样三职责<\/h2>\n<p>求值（算法 C）沿给定赋值走一条路径输出 0/1；计数装饰统计一支下满足赋值个数；采样按计数比例随机选一支。三者共用同一 BDD 结构，但输入输出不同：求值要一组赋值，计数要图结构，采样要随机数与分支计数。<\/p>\n<h2>计数装饰与图规模的对照<\/h2>\n<p>结点数描述图存了多少子结构；计数装饰描述各支满足赋值多少。结点紧凑不代表解少：<span class=\"katex-inline\">C_{100}<\/span> 核函数 BDD 仅 855 个结点，满足组合多达 1630580875002 个。图规模压的是重复子结构，不是可行解个数；报结果时分清这两个量。<\/p>\n<h2>采样失败的两种情形<\/h2>\n<p>一是分支计数未装饰，两支大小不明，比例算不出；二是等概率选支，大支小支被同等对待，样本偏向子树大的分支。均匀采样必须先完成自底向上计数，再按 <span class=\"katex-inline\">N_0/N<\/span>、<span class=\"katex-inline\">N_1/N<\/span> 分配选择概率。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出内部结点计数递推式，说明两支为什么互不重叠。\n<\/li><li>\n<span class=\"katex-inline\">c_k<\/span> 的上界 <span class=\"katex-inline\">2^{n+1-v_k}<\/span> 怎样随剩余变量数变化？\n<\/li><li>\n采样时两支概率各是多少？为什么这样选能得到均匀分布？\n<\/li><li>\n变量次序通过什么机制影响子树共享？坏序下结点数朝什么方向膨胀？\n<\/li><li>\n<span class=\"katex-inline\">C_{100}<\/span> 核函数的例子里，解的总数与 BDD 结点数各是什么量级？这个对照说明什么？\n<\/ol><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.251<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">按位运算：与/或/异或、包含关系与常用位技巧<\/a><\/span><\/div><h1>n 元组枚举与格雷码：每步翻转一位的全覆盖序列<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch03（原书 §7.2.1.1，PDF 第 249、251 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p>要访问全部 <span class=\"katex-inline\">2^n<\/span> 个 <span class=\"katex-inline\">n<\/span> 位二进制元组，最直接的办法是从 <span class=\"katex-inline\">(0\\dots0)_2=0<\/span> 数到 <span class=\"katex-inline\">(1\\dots1)_2=2^n-1<\/span>。但相邻两个计数常同时改变多位，物理切换或状态回退代价高。格雷码（Gray code）把全部位串重排成相邻只差一位的序列，使每一步只翻转一个位。这一概念解决枚举次序的选择问题：既要覆盖全部元组不漏不重，又要压低相邻两次产出之间的改动量。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>n 元组<\/strong>：<span class=\"katex-inline\">(a_1,\\dots,a_n)<\/span>，每个 <span class=\"katex-inline\">a_j\\in\\{0,1\\}<\/span>；共 <span class=\"katex-inline\">2^n<\/span> 个。位串与集合对应：<span class=\"katex-inline\">x_j<\/span> 在集合中当且仅当 <span class=\"katex-inline\">a_j=1<\/span>。<\/p>\n<p><strong>混合进制方向<\/strong>：若分量上限为 <span class=\"katex-inline\">0\\le a_j&lt;m_j<\/span>，向量 <span class=\"katex-inline\">(a_1,\\dots,a_n)<\/span> 的不同分量个数为各 <span class=\"katex-inline\">m_j<\/span> 之积，对应混合进制计数。<\/p>\n<p><strong>格雷码递归定义<\/strong>：<span class=\"katex-inline\">\\Gamma_0=\\epsilon<\/span>（空串）；<\/p>\n<div class=\"katex-block\">\\Gamma_{n+1}=0\\Gamma_n,\\ 1\\Gamma_n^{R},<\/div>\n<p>其中 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 是 <span class=\"katex-inline\">\\Gamma_n<\/span> 的逆序序列。<\/p>\n<p><strong>序号转格雷码<\/strong>：<span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span>，即二进制序号与其右移一位后按位异或。<\/p>\n<p><strong>逆变换<\/strong>：给定格雷码 <span class=\"katex-inline\">g(k)=(\\dots b_2b_1b_0)_2<\/span>，还原序号 <span class=\"katex-inline\">k=(\\dots a_2a_1a_0)_2<\/span>，<span class=\"katex-inline\">b_j=a_j\\oplus a_{j+1}<\/span>；逆推 <span class=\"katex-inline\">a_j=b_j\\oplus a_{j+1}\\oplus a_{j+2}\\oplus\\cdots<\/span>。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">n=3<\/span> 格雷码为 <span class=\"katex-inline\">000,001,011,010,110,111,101,100<\/span>，相邻各差一位。<span class=\"katex-inline\">k=5=(101)_2<\/span>，<span class=\"katex-inline\">\\lfloor5/2\\rfloor=2=(010)_2<\/span>，<span class=\"katex-inline\">g(5)=101\\oplus010=111<\/span>。<\/p>\n<p><strong>反例<\/strong>：普通二进制计数 <span class=\"katex-inline\">011\\to100<\/span> 三位全变；把格雷码后半段写成 <span class=\"katex-inline\">1\\Gamma_n<\/span> 而不反转，接缝处后 <span class=\"katex-inline\">n<\/span> 位不同，跨越多位。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>覆盖性（归纳）<\/strong>：基础 <span class=\"katex-inline\">\\Gamma_0<\/span> 覆盖 1 个空串。归纳假设 <span class=\"katex-inline\">\\Gamma_n<\/span> 覆盖全部 <span class=\"katex-inline\">2^n<\/span> 个 <span class=\"katex-inline\">n<\/span> 位串。<span class=\"katex-inline\">\\Gamma_{n+1}<\/span> 前半前缀 0、后半前缀 1，各接一套完整 <span class=\"katex-inline\">n<\/span> 位串；前后两半前缀不同，互不重复，覆盖全部 <span class=\"katex-inline\">2^{n+1}<\/span> 个 <span class=\"katex-inline\">n+1<\/span> 位串。<\/p>\n<p><strong>相邻差一位（归纳）<\/strong>：<span class=\"katex-inline\">\\Gamma_n<\/span> 内部相邻差一位；逆序不改相邻关系。接缝处前半末项为 <span class=\"katex-inline\">0\\Gamma_n<\/span> 末项，后半首项为 <span class=\"katex-inline\">1\\Gamma_n^{R}<\/span> 首项，而 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 首项就是 <span class=\"katex-inline\">\\Gamma_n<\/span> 末项，后 <span class=\"katex-inline\">n<\/span> 位相同，只翻前缀位。<\/p>\n<p><strong>公式依据<\/strong>：<span class=\"katex-inline\">k=2^n+r<\/span>（<span class=\"katex-inline\">0\\le r&lt;2^n<\/span>）时，<span class=\"katex-inline\">g(k)<\/span> 与 <span class=\"katex-inline\">g(2^n-1-r)<\/span> 构成对称；异或与右移一位的关系使相邻序号的格雷码只在一个位置分叉。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：枚举对象是等长 0/1 位串；需要相邻改动最小的访问次序。\n<\/li><li>\n失败案例 1：后半段不反转。接缝两端后 <span class=\"katex-inline\">n<\/span> 位不一致，一次翻动多位，格雷码性质断裂。\n<\/li><li>\n失败案例 2：把格雷码当二进制数值序。格雷码相邻码的数值不一定递增；要按序号还原，需走逆变换公式。\n<\/li><li>\n边界：<span class=\"katex-inline\">n<\/span> 增大时 <span class=\"katex-inline\">2^n<\/span> 个码仍要逐个访问，格雷码只改次序、不减少总量；混合进制元组的低改动序列构造比二进制复杂。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>格雷码 vs 二进制计数<\/strong>：二进制按数值递增，相邻可能多位跳变；格雷码按位差最小重排，数值次序不单调。\n<\/li><li>\n<strong>递归构造 vs 公式直算<\/strong>：递归规则便于说明覆盖与相邻性质；<span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span> 便于从序号直接取码，不必展开前序序列。\n<\/li><li>\n<strong>元组枚举 vs 组合枚举<\/strong>：n 元组允许任意 0/1 分布；组合是&quot;恰含 <span class=\"katex-inline\">t<\/span> 个 1&quot;的子集，约束更强（c10）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c04 异或运算是格雷码公式与相邻差一位的运算基础。后继：c08 排列字典序提供另一种枚举次序；c09 邻接交换追求相邻只差一次交换，与格雷码&quot;相邻只改一位&quot;同属低改动路线；c10 组合位串是 n 元组加了 1 的个数约束的子集。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（n 元组枚举与格雷码：每步翻转一位的全覆盖序列）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：格雷码递归构造全推演、公式直算与逆变换还原<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把格雷码讲透，往回追四层：<\/p>\n<ol><li>\n枚举对象：<span class=\"katex-inline\">n<\/span> 位 0/1 串共 <span class=\"katex-inline\">2^n<\/span> 个，每个对应一个子集标志。\n<\/li><li>\n次序要求：全覆盖不漏不重；相邻两个码改动位数尽量小。\n<\/li><li>\n递归构造：<span class=\"katex-inline\">\\Gamma_0=\\epsilon<\/span>，<span class=\"katex-inline\">\\Gamma_{n+1}=0\\Gamma_n<\/span> 接上 <span class=\"katex-inline\">1\\Gamma_n^{R}<\/span>，用低一阶序列拼出高一阶序列。\n<\/li><li>\n闭合公式：<span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span> 把序号直接映成码；逆变换从码还原序号。\n<\/ol>\n<p>依赖链方向：位串集合 → 低改动次序目标 → 递归规则 → 覆盖与相邻归纳证明 → 公式与逆变换。<\/p>\n<h2>正向推导：递归序列逐层展开<\/h2>\n<p><strong><span class=\"katex-inline\">n=0<\/span><\/strong>：<span class=\"katex-inline\">\\Gamma_0=\\epsilon<\/span>，只有空串，覆盖 <span class=\"katex-inline\">2^0=1<\/span> 个码。<\/p>\n<p><strong><span class=\"katex-inline\">n=1<\/span><\/strong>：<span class=\"katex-inline\">\\Gamma_1=0\\Gamma_0,\\ 1\\Gamma_0^{R}=0,\\ 1<\/span>。序列 <span class=\"katex-inline\">0,1<\/span>，相邻差一位，覆盖 2 个码。<\/p>\n<p><strong><span class=\"katex-inline\">n=2<\/span><\/strong>：<span class=\"katex-inline\">\\Gamma_2=0\\Gamma_1,\\ 1\\Gamma_1^{R}<\/span>。<span class=\"katex-inline\">\\Gamma_1=0,1<\/span>，<span class=\"katex-inline\">\\Gamma_1^{R}=1,0<\/span>。前半 <span class=\"katex-inline\">00,01<\/span>；后半 <span class=\"katex-inline\">11,10<\/span>。完整序列：<\/p>\n<div class=\"katex-block\">00,\\ 01,\\ 11,\\ 10.<\/div>\n<p>相邻核对：<span class=\"katex-inline\">00\\to01<\/span> 翻位 0；<span class=\"katex-inline\">01\\to11<\/span> 翻位 1；<span class=\"katex-inline\">11\\to10<\/span> 翻位 0。接缝 <span class=\"katex-inline\">01\\to11<\/span>：后一位 <span class=\"katex-inline\">1<\/span> 相同，前缀位 0 变 1，只差一位。<\/p>\n<p><strong><span class=\"katex-inline\">n=3<\/span><\/strong>：<span class=\"katex-inline\">\\Gamma_3=0\\Gamma_2,\\ 1\\Gamma_2^{R}<\/span>。<span class=\"katex-inline\">\\Gamma_2=00,01,11,10<\/span>，逆序 <span class=\"katex-inline\">\\Gamma_2^{R}=10,11,01,00<\/span>。前半 <span class=\"katex-inline\">000,001,011,010<\/span>；后半 <span class=\"katex-inline\">110,111,101,100<\/span>。完整序列：<\/p>\n<div class=\"katex-block\">000,\\ 001,\\ 011,\\ 010,\\ 110,\\ 111,\\ 101,\\ 100.<\/div>\n<p>逐对核对相邻：<span class=\"katex-inline\">000\\to001<\/span>（位 0）；<span class=\"katex-inline\">001\\to011<\/span>（位 1）；<span class=\"katex-inline\">011\\to010<\/span>（位 0）；<span class=\"katex-inline\">010\\to110<\/span>（位 2）；<span class=\"katex-inline\">110\\to111<\/span>（位 0）；<span class=\"katex-inline\">111\\to101<\/span>（位 1）；<span class=\"katex-inline\">101\\to100<\/span>（位 0）。每对恰一个位不同，8 个码全覆盖。<\/p>\n<p><strong>覆盖性归纳<\/strong>：假设 <span class=\"katex-inline\">\\Gamma_n<\/span> 含全部 <span class=\"katex-inline\">2^n<\/span> 个 <span class=\"katex-inline\">n<\/span> 位串。<span class=\"katex-inline\">\\Gamma_{n+1}<\/span> 前半每个码前缀 0，后半前缀 1；去掉前缀后仍是全部 <span class=\"katex-inline\">n<\/span> 位串。前缀 0 与 1 互不重叠，合计 <span class=\"katex-inline\">2\\cdot2^n=2^{n+1}<\/span> 个，恰好全部 <span class=\"katex-inline\">n+1<\/span> 位串。<\/p>\n<p><strong>相邻性质归纳<\/strong>：内部相邻由归纳假设保证；逆序 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 不改变相邻配对。接缝两端：前半末项是 <span class=\"katex-inline\">0<\/span> 接 <span class=\"katex-inline\">\\Gamma_n<\/span> 末项，后半首项是 <span class=\"katex-inline\">1<\/span> 接 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 首项，而 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 首项等于 <span class=\"katex-inline\">\\Gamma_n<\/span> 末项，后 <span class=\"katex-inline\">n<\/span> 位相同，只翻前缀位。<\/p>\n<h2>数值算例：公式 <span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span> 直算<\/h2>\n<p>列出 <span class=\"katex-inline\">k=0,\\dots,7<\/span>：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><span class=\"katex-inline\">k<\/span><\/th><th><span class=\"katex-inline\">k<\/span> 二进制<\/th><th><span class=\"katex-inline\">\\lfloor k/2\\rfloor<\/span><\/th><th><span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span><\/th><th>格雷码<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>000<\/td><td>000<\/td><td>000<\/td><td>000<\/td><\/tr><tr><td>1<\/td><td>001<\/td><td>000<\/td><td>001<\/td><td>001<\/td><\/tr><tr><td>2<\/td><td>010<\/td><td>001<\/td><td>011<\/td><td>011<\/td><\/tr><tr><td>3<\/td><td>011<\/td><td>001<\/td><td>010<\/td><td>010<\/td><\/tr><tr><td>4<\/td><td>100<\/td><td>010<\/td><td>110<\/td><td>110<\/td><\/tr><tr><td>5<\/td><td>101<\/td><td>010<\/td><td>111<\/td><td>111<\/td><\/tr><tr><td>6<\/td><td>110<\/td><td>011<\/td><td>101<\/td><td>101<\/td><\/tr><tr><td>7<\/td><td>111<\/td><td>011<\/td><td>100<\/td><td>100<\/td><\/tr><\/tbody><\/table><\/div>\n<p>与递归展开的 <span class=\"katex-inline\">\\Gamma_3<\/span> 逐项一致。取 <span class=\"katex-inline\">k=5<\/span>：<span class=\"katex-inline\">101\\oplus010=111<\/span>，<span class=\"katex-inline\">g(5)=111<\/span>；<span class=\"katex-inline\">k=6<\/span>：<span class=\"katex-inline\">110\\oplus011=101<\/span>。<\/p>\n<p><strong>第二算例：逆变换还原<\/strong>。给定格雷码 <span class=\"katex-inline\">g=111<\/span>，即 <span class=\"katex-inline\">b_2b_1b_0=1,1,1<\/span>。逆推 <span class=\"katex-inline\">a_j=b_j\\oplus a_{j+1}\\oplus a_{j+2}\\oplus\\cdots<\/span>，最高位 <span class=\"katex-inline\">a_2=b_2=1<\/span>；<span class=\"katex-inline\">a_1=b_1\\oplus a_2=1\\oplus1=0<\/span>；<span class=\"katex-inline\">a_0=b_0\\oplus a_1=1\\oplus0=1<\/span>。还原序号 <span class=\"katex-inline\">a_2a_1a_0=101=5<\/span>，与上例 <span class=\"katex-inline\">g(5)=111<\/span> 互逆。<\/p>\n<p>再取 <span class=\"katex-inline\">g=101<\/span>：<span class=\"katex-inline\">a_2=1<\/span>；<span class=\"katex-inline\">a_1=0\\oplus1=1<\/span>；<span class=\"katex-inline\">a_0=1\\oplus1=0<\/span>，序号 <span class=\"katex-inline\">110=6<\/span>，对应 <span class=\"katex-inline\">g(6)=101<\/span>。<\/p>\n<h2>延伸推演：格雷码的对称与异或性质<\/h2>\n<p>书里给出：<span class=\"katex-inline\">k=2^n+r<\/span> 时 <span class=\"katex-inline\">g(k)<\/span> 与 <span class=\"katex-inline\">g(2^n-1-r)<\/span> 对称；<span class=\"katex-inline\">\\Gamma_n<\/span> 带有同样性质。另有恒等式 <span class=\"katex-inline\">g(k\\oplus k&#x27;)=g(k)\\oplus g(k&#x27;)<\/span>：格雷码映射对异或保持线性。取 <span class=\"katex-inline\">k=2<\/span>（010）、<span class=\"katex-inline\">k&#x27;=3<\/span>（011）：<span class=\"katex-inline\">k\\oplus k&#x27;=001<\/span>，<span class=\"katex-inline\">g(2)=011<\/span>，<span class=\"katex-inline\">g(3)=010<\/span>，<span class=\"katex-inline\">g(2)\\oplus g(3)=001=g(1)<\/span>，而 <span class=\"katex-inline\">g(2\\oplus3)=g(1)=001<\/span>，等式成立。<\/p>\n<p><span class=\"katex-inline\">n+1<\/span> 位格雷码可写成 <span class=\"katex-inline\">\\Gamma_{n+1}=0\\Gamma_n\\ (0\\Gamma_n)\\oplus 110\\dots0<\/span>；反转格雷码顺序等价于对第 1 位取补，<span class=\"katex-inline\">\\Gamma_n^{R}=\\Gamma_n\\oplus 10^{n-1}<\/span>。这些性质在循环格雷码（首尾也差一位）与硬件地址译码设计中使用。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>后半段不反转<\/strong>。若写成 <span class=\"katex-inline\">\\Gamma_{n+1}=0\\Gamma_n,\\ 1\\Gamma_n<\/span>，接缝是 <span class=\"katex-inline\">0<\/span> 接 <span class=\"katex-inline\">\\Gamma_n<\/span> 末项对 <span class=\"katex-inline\">1<\/span> 接 <span class=\"katex-inline\">\\Gamma_n<\/span> 首项；末项与首项后 <span class=\"katex-inline\">n<\/span> 位不同，一次翻动多位。反转正是把后半首项对齐到前半末项。<\/p>\n<p><strong>把格雷码当数值序<\/strong>。序列 <span class=\"katex-inline\">010<\/span>（值 2）后接 <span class=\"katex-inline\">110<\/span>（值 6），数值上升；但 <span class=\"katex-inline\">111<\/span>（7）后接 <span class=\"katex-inline\">100<\/span>（4），数值下降。按数值大小查表会错位；要取第 <span class=\"katex-inline\">k<\/span> 个码用 <span class=\"katex-inline\">g(k)<\/span>，要还原序号走逆变换。<\/p>\n<p><strong>混淆元组与组合<\/strong>。n 元组含任意个数 1；组合要求恰含 <span class=\"katex-inline\">t<\/span> 个 1。直接套格雷码序列不会自动筛出固定 1 数的子集，组合枚举另走 c10 的字典序或旋转门次序。<\/p>\n<h2>对抗性追问：格雷码是否减少了枚举总量<\/h2>\n<p>没有。<span class=\"katex-inline\">2^n<\/span> 个码仍要逐个访问，总量等于元组总数；格雷码只重排访问次序，把相邻改动压到一位。若目标是只取部分对象，需要另加筛选或采样（对照 c06 沿 BDD 按比例抽样）。<\/p>\n<h2><span class=\"katex-inline\">n=4<\/span> 递归展开前半段<\/h2>\n<p><span class=\"katex-inline\">\\Gamma_3=000,001,011,010,110,111,101,100<\/span>。<span class=\"katex-inline\">\\Gamma_4=0\\Gamma_3,\\ 1\\Gamma_3^{R}<\/span>。前半 8 项为 <span class=\"katex-inline\">0000,0001,0011,0010,0110,0111,0101,0100<\/span>；后半取 <span class=\"katex-inline\">\\Gamma_3<\/span> 逆序 <span class=\"katex-inline\">100,101,111,110,010,011,001,000<\/span> 前缀 1，得 <span class=\"katex-inline\">1100,1101,1111,1110,1010,1011,1001,1000<\/span>。接缝 <span class=\"katex-inline\">0100 o1100<\/span>：后三位 <span class=\"katex-inline\">100<\/span> 相同，前缀位 0 变 1，只差一位。<\/p>\n<h2>对称性质核验<\/h2>\n<p><span class=\"katex-inline\">\\Gamma_n<\/span> 首尾循环性质：末项与首项也只差一位。<span class=\"katex-inline\">\\Gamma_3<\/span> 末项 <span class=\"katex-inline\">100<\/span>、首项 <span class=\"katex-inline\">000<\/span>，只差位 2；<span class=\"katex-inline\">\\Gamma_4<\/span> 末项 <span class=\"katex-inline\">1000<\/span>、首项 <span class=\"katex-inline\">0000<\/span>，只差位 3。递归构造中后半逆序保证了这一循环衔接。<\/p>\n<h2>混合进制方向<\/h2>\n<p>若分量上限 <span class=\"katex-inline\">0\\le a_j&lt;m_j<\/span>，不同元组总数为 <span class=\"katex-inline\">\\prod m_j<\/span>；普通二进制是 <span class=\"katex-inline\">m_j=2<\/span> 的特例。低改动序列在混合进制下不能直接套二进制格雷码递归，需要为各分量上限分别设计相邻转一位的规则。本书 §7.2.1.1 先把二进制元组讲透，混合进制计数作为推广方向列出。<\/p>\n<h2>公式逆变换再核<\/h2>\n<p>给定 <span class=\"katex-inline\">g=010<\/span>：最高位 <span class=\"katex-inline\">a_2=b_2=0<\/span>；<span class=\"katex-inline\">a_1=b_1\\oplus a_2=1\\oplus0=1<\/span>；<span class=\"katex-inline\">a_0=b_0\\oplus a_1=0\\oplus1=1<\/span>，序号 <span class=\"katex-inline\">011=3<\/span>。核验 <span class=\"katex-inline\">g(3)=011\\oplus001=010<\/span>，互逆成立。<\/p>\n<h2>相邻差一位的两种读法<\/h2>\n<p>递归保证序列内部相邻差一位；首尾循环性质保证末项与首项也差一位。<span class=\"katex-inline\">\\Gamma_3<\/span> 末项 <span class=\"katex-inline\">100<\/span>、首项 <span class=\"katex-inline\">000<\/span> 只差位 2；需要环形访问的场景可把序列首尾相接使用。普通二进制计数首尾 <span class=\"katex-inline\">111<\/span> 与 <span class=\"katex-inline\">000<\/span> 差三位，不具备循环性质。<\/p>\n<h2>公式与递归的分工<\/h2>\n<p>递归规则说明覆盖性与相邻性质，适合证明；<span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span> 适合从序号直接取码，不必展开前序全部码。逆变换 <span class=\"katex-inline\">a_j=b_j\\oplus a_{j+1}\\oplus\\cdots<\/span> 从高位向低位还原序号。两条路线给出同一个序列，证明用递归，取码用公式。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n按递归规则写出 <span class=\"katex-inline\">\\Gamma_3<\/span> 全部 8 个码，并逐对核对相邻差一位。\n<\/li><li>\n用 <span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span> 算出 <span class=\"katex-inline\">g(4)<\/span>、<span class=\"katex-inline\">g(7)<\/span>。\n<\/li><li>\n逆变换把 <span class=\"katex-inline\">g=100<\/span> 还原成序号，写出每一步 <span class=\"katex-inline\">a_j<\/span>。\n<\/li><li>\n接缝处为什么要求后半段是 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 而不是 <span class=\"katex-inline\">\\Gamma_n<\/span>？\n<\/li><li>\n格雷码相邻改动小，但枚举总量为什么没有减少？\n<\/ol><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.281<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">n 元组枚举与格雷码：每步翻转一位的全覆盖序列<\/a><\/span><\/div><h1>字典序排列生成（Algorithm L）：下一个排列为何不漏不重<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch03（原书 §7.2.1.2，PDF 第 280–281 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p><span class=\"katex-inline\">n<\/span> 个不同对象的排列共有 <span class=\"katex-inline\">n!<\/span> 个，要逐个产出且不能漏、不能重。随机打乱不保证覆盖；凭感觉调换元素容易停留在部分排列里。字典序算法把排列按词典大小排成全序，每一步从当前排列机械地算出&quot;紧接其后&quot;的下一个排列，走完整个序即覆盖全部 <span class=\"katex-inline\">n!<\/span> 个。困难在于确定：当前排列之后下一个更大的排列是什么，怎样只改必要的位置得到它。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>字典序<\/strong>：两个排列从左到右逐位比较，第一位不同处元素较大的排列整体更大。初始排列为非减序列 <span class=\"katex-inline\">a_1\\le a_2\\le\\cdots\\le a_n<\/span>，即字典序最小排列。<\/p>\n<p><strong>算法 L（字典序排列生成）<\/strong>，辅助元素 <span class=\"katex-inline\">a_0<\/span> 严格小于最大元素：<\/p>\n<ul><li>\n<strong>L1. 访问<\/strong>：访问排列 <span class=\"katex-inline\">a_1a_2\\dots a_n<\/span>。\n<\/li><li>\n<strong>L2. 找支点<\/strong>：置 <span class=\"katex-inline\">j\\leftarrow n-1<\/span>；若 <span class=\"katex-inline\">a_j\\ge a_{j+1}<\/span>，则 <span class=\"katex-inline\">j<\/span> 减 1，直到 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span>。若 <span class=\"katex-inline\">j=0<\/span> 终止。\n<\/li><li>\n<strong>L3. 找交换对象<\/strong>：置 <span class=\"katex-inline\">l\\leftarrow n<\/span>；若 <span class=\"katex-inline\">a_l\\le a_j<\/span>，则 <span class=\"katex-inline\">l<\/span> 减 1，找到大于 <span class=\"katex-inline\">a_j<\/span> 的最右元素；交换 <span class=\"katex-inline\">a_j\\leftrightarrow a_l<\/span>。\n<\/li><li>\n<strong>L4. 反序后缀<\/strong>：置 <span class=\"katex-inline\">k\\leftarrow j+1,\\ l\\leftarrow n<\/span>；当 <span class=\"katex-inline\">k&lt;l<\/span> 时交换 <span class=\"katex-inline\">a_k\\leftrightarrow a_l<\/span>，<span class=\"katex-inline\">k<\/span> 加 1、<span class=\"katex-inline\">l<\/span> 减 1，返回 L1。\n<\/ul>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">n=3<\/span> 从 <span class=\"katex-inline\">123<\/span> 出发，产出 <span class=\"katex-inline\">123,132,213,231,312,321<\/span>。<\/p>\n<p><strong>反例<\/strong>：交换后不反序后缀；或支点找成最左可增下标，都会得到比当前排列还小或重复的后继。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>L2 支点含义<\/strong>：<span class=\"katex-inline\">a_{j+1}\\ge\\cdots\\ge a_n<\/span> 是非递增后缀；<span class=\"katex-inline\">j<\/span> 是最右满足 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span> 的位置。后缀内已无增大空间，要得到下一个排列，必须在 <span class=\"katex-inline\">j<\/span> 位增大元素。<\/p>\n<p><strong>L3 交换对象<\/strong>：后缀非递增，从右往左第一个大于 <span class=\"katex-inline\">a_j<\/span> 的元素是后缀中大于 <span class=\"katex-inline\">a_j<\/span> 的最小元素；用它替换 <span class=\"katex-inline\">a_j<\/span>，保证新前缀仅比当前大最少。<\/p>\n<p><strong>L4 反序<\/strong>：交换后后缀仍非递增；反序把它变成非递减，即该后缀能组成的最小排列。三步合起来得到&quot;大于当前排列的最小排列&quot;，也就是字典序下一个。<\/p>\n<p><strong>不漏不重<\/strong>：全序上每个排列有唯一后继；从最小排列出发沿后继走，终止于最大排列（非递增）。链路无分叉、无回路，<span class=\"katex-inline\">n!<\/span> 个排列逐个出现在链上。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：<span class=\"katex-inline\">n<\/span> 个可比较的不同元素；初始取最小排列。\n<\/li><li>\n失败案例 1：支点找错。从左往右找第一个 <span class=\"katex-i
