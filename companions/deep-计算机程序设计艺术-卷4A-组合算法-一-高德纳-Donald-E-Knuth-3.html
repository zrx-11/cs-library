n> 开始回退检查，空耗循环。算法 T 的 <span class=\"katex-inline\">c_1+1&lt;c_2<\/span> 判断就是先摘出这类快路。<\/p>\n<h2>对抗性追问：组合位串为什么不能直接套格雷码全覆盖<\/h2>\n<p>格雷码序列覆盖全部 <span class=\"katex-inline\">2^n<\/span> 个位串，其中多数 1 的个数不是 <span class=\"katex-inline\">t<\/span>；固定 <span class=\"katex-inline\">t<\/span> 的子集是位串集合的一个切片。要在切片内做低改动次序，需要旋转门（revolving door）一类专用顺序，每次换入一个元素、换出一个元素；普通格雷码的相邻差一位性质不保证 1 的个数不变。<\/p>\n<h2><span class=\"katex-inline\">n=6,t=2<\/span> 的组合枚举<\/h2>\n<p><span class=\"katex-inline\">\\binom62=15<\/span>。元素表按字典序列出（下标 0–5）：<\/p>\n<pre><code>1,0   2,0   2,1   3,0   3,1   3,2   4,0\n4,1   4,2   4,3   5,0   5,1   5,2   5,3   5,4<\/code><\/pre>\n<p>对应位串各含 2 个 1。后继推演：<span class=\"katex-inline\">3,1<\/span> 的下一个是 <span class=\"katex-inline\">3,2<\/span>（<span class=\"katex-inline\">c_1<\/span> 从 1 增到 2）；<span class=\"katex-inline\">3,2<\/span> 之后 <span class=\"katex-inline\">c_1,c_2<\/span> 到上限，<span class=\"katex-inline\">c_2<\/span> 增到 4 方向，左侧 <span class=\"katex-inline\">c_1<\/span> 重设为最小 0，得 <span class=\"katex-inline\">4,0<\/span>。<\/p>\n<h2>算法 T 快路判定<\/h2>\n<p>T2 访问后先看最右元素能否直接加 1：若 <span class=\"katex-inline\">c_1+1&lt;c_2<\/span>，直接 <span class=\"katex-inline\">c_1\\leftarrow c_1+1<\/span> 返回 T2；否则回退到更左的 <span class=\"katex-inline\">j<\/span> 调整。<span class=\"katex-inline\">t<\/span> 小时多数组合满足 <span class=\"katex-inline\">c_1<\/span> 未贴住 <span class=\"katex-inline\">c_2<\/span>，快路命中；回退只发生在最右元素已到紧邻上限时。<\/p>\n<h2>平均代价公式对照<\/h2>\n<p>摊到每个组合的回退步数方向为 <span class=\"katex-inline\">\\frac{s+1}{t}\\cdot\\frac{n-t}{n+1}<\/span>，<span class=\"katex-inline\">s=n-t<\/span>。<span class=\"katex-inline\">t=2,s=4,n=6<\/span> 时代入 <span class=\"katex-inline\">\\frac{5}{2}\\cdot\\frac{4}{7}\\approx1.43<\/span> 量级；<span class=\"katex-inline\">t<\/span> 越小、<span class=\"katex-inline\">s<\/span> 越大，比值越低。这解释了为什么小 <span class=\"katex-inline\">t<\/span> 组合生成接近常数每组合开销。<\/p>\n<h2>多重组合转换方向<\/h2>\n<p>允许重复时多重组合写成非增列 <span class=\"katex-inline\">d_t\\ge\\cdots\\ge d_1\\ge0<\/span>。普通组合严格递减；两套表示通过下标平移互转：<span class=\"katex-inline\">c_i=d_i+t-i<\/span> 一类关系把非多重映射到多重。表 1 在 <span class=\"katex-inline\">s=t=3<\/span> 下列出同一组合的位串、位置表、栅栏位置、网格路径等八种等价形式，说明组合对象可从多个角度编码。<\/p>\n<h2>低改动路线补充<\/h2>\n<p>普通字典序相邻组合可能换入换出多个元素；旋转门（revolving door）次序每次只换一个元素，适合按位翻转代价高的场景。本书 §7.2.1.3 在字典序算法之外列出这类备选顺序，选择依据仍是相邻改动量与实现复杂度的权衡。<\/p>\n<h2>位串与元素表转换核对步骤<\/h2>\n<ol><li>\n表到位串：选中下标位置 1，其余 0，核对 1 的个数等于 <span class=\"katex-inline\">t<\/span>。\n<\/li><li>\n位串到表：收集所有 1 的下标，按递减排列成 <span class=\"katex-inline\">c_t\\dots c_1<\/span>。\n<\/li><li>\n合法性：表严格递减，位串恰含 <span class=\"katex-inline\">t<\/span> 个 1；两条任一不满足即为非法组合。\n<\/ol>\n<h2>字典序后继的定位方向<\/h2>\n<p>从右往左找最右可增大元素 <span class=\"katex-inline\">c_j<\/span>；增大后左侧 <span class=\"katex-inline\">c_{j-1}\\dots c_1<\/span> 重设为最小紧邻取值。找错方向（从左往右）会跳过中间组合，漏排；不重设左侧后缀，后继次序偏大。<\/p>\n<h2>组合与 n 元组的关系<\/h2>\n<p>n 元组是任意 0/1 位串；组合是 1 的个数固定为 <span class=\"katex-inline\">t<\/span> 的切片。格雷码覆盖全部位串，不保证 1 的个数不变；组合枚举要么走字典序，要么走固定 1 数的旋转门次序。c07 的全覆盖次序不能直接拿来枚举固定大小子集。<\/p>\n<h2>多重组合的表示差别<\/h2>\n<p>普通组合表严格递减；多重组合表非增，允许等值。两套表示通过下标平移互转。读题时先确认元素可否重复，再选递减还是非增约定，避免把重复元素当成两个不同选中对象。<\/p>\n<h2>组合计数与位串选择的等价性<\/h2>\n<p><span class=\"katex-inline\">\\binom nt<\/span> 数的是从 <span class=\"katex-inline\">n<\/span> 位中选 <span class=\"katex-inline\">t<\/span> 个位置放 1 的方式；元素表视角是选 <span class=\"katex-inline\">t<\/span> 个编号子集。两种计数相等，是同一批对象的两种数法。写生成算法时先固定走元素表还是位串表示，后继调整在同一种表示内完成，避免每步来回转换。<\/p>\n<h2>算法 L 与 T 的分工<\/h2>\n<p>L 是通用字典序路线，找最右可增下标并重设左侧；T 先判最简单情形（<span class=\"katex-inline\">c_1+1&lt;c_2<\/span> 直接增 <span class=\"katex-inline\">c_1<\/span>），快路命中时跳过回退。实现上 T 多一个前置判断，换来小 <span class=\"katex-inline\">t<\/span> 情形下更少回退；两种算法产物次序一致，差别在执行速度。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">n=6,t=2<\/span> 时 <span class=\"katex-inline\">\\binom62<\/span> 的值，并列出两个组合的双表示。\n<\/li><li>\n元素表 <span class=\"katex-inline\">5,3,1<\/span> 对应怎样的位串？位串 <span class=\"katex-inline\">100101<\/span> 对应什么递减表？\n<\/li><li>\n字典序后继时，为什么左侧元素要重设为最小可能值？\n<\/li><li>\n平均代价公式里 <span class=\"katex-inline\">s,t<\/span> 各是什么？<span class=\"katex-inline\">t\\le s<\/span> 时算法效率方向如何？\n<\/li><li>\n普通组合与多重组合的元素表次序约定差在哪里？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "组合生成：位串与元素表双表示、字典序算法 L 与 T"}, "c11": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.339<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c10\">组合生成：位串与元素表双表示、字典序算法 L 与 T<\/a><\/span><\/div><h1>整数划分与集合划分：十二类方式与两类划分的差别<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch04（原书 §7.2.1.4–7.2.1.5，PDF 第 339、360 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p>&quot;划分&quot;一词在组合计数里覆盖两类很不相同的对象：把一个整数拆成若干整数之和，或把一个集合拆成若干互不相交的子集。混在一起会把计数、生成方法全部搞错。这一概念先把两类划分分开定义、各自标准化表示，再放回球与桶带不带标记的十二类方式里定位，说明哪一类对应排列、子集、多重组合、放球入笼等已知对象。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>整数划分（partition）<\/strong>：把正整数 <span class=\"katex-inline\">n<\/span> 写成一组非增正整数之和<\/p>\n<div class=\"katex-block\">n=a_1+a_2+\\cdots+a_m,\\qquad a_1\\ge a_2\\ge\\cdots\\ge a_m>0.<\/div>\n<p>不考虑因子次序；<span class=\"katex-inline\">7<\/span> 的一个划分为 <span class=\"katex-inline\">3+3+1<\/span>，另一个为 <span class=\"katex-inline\">1+1+1+\\cdots<\/span> 方向的单位和。<\/p>\n<p><strong>集合划分（set partition）<\/strong>：把集合 <span class=\"katex-inline\">\\{1,2,\\dots,n\\}<\/span> 分成若干互不相交的非空子集（块）。例：<span class=\"katex-inline\">\\{1,2,3\\}<\/span> 的 5 个集合划分为 <span class=\"katex-inline\">123<\/span>、<span class=\"katex-inline\">12\\mid3<\/span>、<span class=\"katex-inline\">13\\mid2<\/span>、<span class=\"katex-inline\">1\\mid23<\/span>、<span class=\"katex-inline\">1\\mid2\\mid3<\/span>。<\/p>\n<p><strong>标准化约定<\/strong>：块内元素按递增排列；块之间按最小元素递增排列。同一划分只有一种标准写法。<\/p>\n<p><strong>限制增长串（restricted growth string）<\/strong>：集合划分的编码串 <span class=\"katex-inline\">a_1a_2\\dots a_n<\/span>，其中<\/p>\n<div class=\"katex-block\">a_1=0,\\qquad a_{j+1}\\le 1+\\max(a_1,\\dots,a_j).<\/div>\n<p>每个 <span class=\"katex-inline\">a_j<\/span> 记录元素 <span class=\"katex-inline\">j<\/span> 所属块的编号；新块编号不超过已有块数加 1。<\/p>\n<p><strong>十二类方式<\/strong>：球标记/不标记、桶标记/不标记，结合&quot;每桶球数无限制、至少一个、至多一个&quot;等条件，对应 n 元组、n 排列、子集、多重组合、n 划分、<span class=\"katex-inline\">r<\/span> 部分划分、<span class=\"katex-inline\">r<\/span> 部分有序划分、放球入笼等类别。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">4<\/span> 的整数划分含 <span class=\"katex-inline\">3+1<\/span>、<span class=\"katex-inline\">2+2<\/span>、<span class=\"katex-inline\">2+1+1<\/span>、<span class=\"katex-inline\">1+1+1+1<\/span>；集合划分 <span class=\"katex-inline\">12\\mid3<\/span> 与 <span class=\"katex-inline\">3\\mid12<\/span> 是同一个，标准写成 <span class=\"katex-inline\">12\\mid3<\/span>。<\/p>\n<p><strong>反例<\/strong>：把 <span class=\"katex-inline\">2+3<\/span> 与 <span class=\"katex-inline\">3+2<\/span> 当两个整数划分；把相交子集当集合划分；块间不排序导致同一划分多份写法。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>两类划分对象不同<\/strong>：整数划分的元素是数值，块不区分身份；集合划分的元素是集合成员，块有归属关系。计数依据不同：整数划分个数由分拆数给出，集合划分个数由斯特林数第二类方向给出。<\/p>\n<p><strong>标准化消重<\/strong>：整数划分用非增次序吸收因子排列；集合划分用块内递增、块间按最小元递增吸收排列。两条约定分别把同一对象的多种摆放折成一种写法。<\/p>\n<p><strong>限制增长串可行<\/strong>：第 <span class=\"katex-inline\">j+1<\/span> 个元素要么进入已有某块（编号取已有范围），要么新开一块（编号为最大编号加 1），所以 <span class=\"katex-inline\">a_{j+1}\\le1+\\max<\/span>。串与集合划分一一对应。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：整数划分针对正整数；集合划分针对有限集合。\n<\/li><li>\n失败案例 1：整数划分不要求非增。<span class=\"katex-inline\">2+3+1<\/span> 与 <span class=\"katex-inline\">3+2+1<\/span> 被当不同划分，分拆计数重复放大。\n<\/li><li>\n失败案例 2：集合划分允许块相交。两块共享元素时归属不清，子集族不再是划分。\n<\/li><li>\n失败案例 3：把十二类方式混为一谈。球、桶标记与否决定对象是排列还是子集；不先固定标记条件，计数类别会选错。\n<\/li><li>\n边界：集合划分的生成比组合复杂，块数与成员归属同时变化；限制增长串是其标准编码入口。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>整数划分 vs 集合划分<\/strong>：前者拆数、后者拆集合；前者块无身份，后者块由成员确定。\n<\/li><li>\n<strong>集合划分 vs 组合<\/strong>：组合是选一个子集；集合划分是把全集拆完，所有块互不相交且覆盖全集。\n<\/li><li>\n<strong>标记球/桶 vs 不标记<\/strong>：标记时对象可区分，对应排列、有序划分；不标记时同构对象合并，对应子集、无序划分。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c10 组合是集合的一个子集；集合划分是全集的一组不相交子集，组合是其单层构件。后继：c12 树的森林生成建立在集合嵌套结构上；限制增长串的编码思路与 c09 逆序序列同属&quot;用辅助计数枚举对象&quot;。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（整数划分与集合划分：十二类方式与两类划分的差别）<\/summary><div class=\"depth-body\"><h1>c11 深度推导：两类划分计数对照、限制增长串构造与十二类方式定位<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把划分类概念拆开，往回追四层：<\/p>\n<ol><li>\n对象原型：球（被分配的元素）与桶（接收位置）各自带不带标记，决定对象是否可区分。\n<\/li><li>\n两类划分：整数划分拆数值，集合划分拆集合成员；标准化约定各自消除排列重复。\n<\/li><li>\n编码入口：集合划分用限制增长串记录每个成员所属块，串与划分一一对应。\n<\/li><li>\n类别定位：球/桶标记与桶容量条件交叉，对应到排列、子集、组合、放球等已知对象。\n<\/ol>\n<p>依赖链方向：球桶标记 → 两类划分定义 → 标准化与编码 → 十二类方式映射。<\/p>\n<h2>正向推导：整数划分的标准化与枚举<\/h2>\n<p>整数划分把 <span class=\"katex-inline\">n<\/span> 写成非增正整数和。非增约定把因子次序吸收掉：<span class=\"katex-inline\">3+1<\/span> 与 <span class=\"katex-inline\">1+3<\/span> 是同一划分，写时统一成 <span class=\"katex-inline\">3+1<\/span>。<\/p>\n<p><strong><span class=\"katex-inline\">n=4<\/span> 的全部整数划分<\/strong>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">4<\/span>\n<\/li><li>\n<span class=\"katex-inline\">3+1<\/span>\n<\/li><li>\n<span class=\"katex-inline\">2+2<\/span>\n<\/li><li>\n<span class=\"katex-inline\">2+1+1<\/span>\n<\/li><li>\n<span class=\"katex-inline\">1+1+1+1<\/span>\n<\/ul>\n<p>共 5 个。逐行核对非增：<span class=\"katex-inline\">3+1<\/span> 中 <span class=\"katex-inline\">3\\ge1<\/span>；<span class=\"katex-inline\">2+1+1<\/span> 中 <span class=\"katex-inline\">2\\ge1\\ge1<\/span>；末行全为 1。<\/p>\n<p><strong><span class=\"katex-inline\">n=5<\/span> 的方向<\/strong>：<span class=\"katex-inline\">5<\/span>；<span class=\"katex-inline\">4+1<\/span>；<span class=\"katex-inline\">3+2<\/span>；<span class=\"katex-inline\">3+1+1<\/span>；<span class=\"katex-inline\">2+2+1<\/span>；<span class=\"katex-inline\">2+1+1+1<\/span>；<span class=\"katex-inline\">1^5<\/span>。划分按最大项递减、次大项递减排列，生成时从最大项开始固定，再对剩余部分递归划分。<\/p>\n<h2>正向推导：集合划分与限制增长串<\/h2>\n<p>集合 <span class=\"katex-inline\">\\{1,2,3\\}<\/span> 的 5 个划分：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>标准写法<\/th><th>限制增长串 <span class=\"katex-inline\">a_1a_2a_3<\/span><\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">123<\/span><\/td><td>000<\/td><\/tr><tr><td><span class=\"katex-inline\">12\\mid3<\/span><\/td><td>001<\/td><\/tr><tr><td><span class=\"katex-inline\">13\\mid2<\/span><\/td><td>010<\/td><\/tr><tr><td><span class=\"katex-inline\">1\\mid23<\/span><\/td><td>011<\/td><\/tr><tr><td><span class=\"katex-inline\">1\\mid2\\mid3<\/span><\/td><td>012<\/td><\/tr><\/tbody><\/table><\/div>\n<p>构造规则：<span class=\"katex-inline\">a_1=0<\/span>（元素 1 进 0 号块）；对元素 <span class=\"katex-inline\">j+1<\/span>，可进已有块（编号取 <span class=\"katex-inline\">0,\\dots,\\max<\/span>），或新开一块（编号 <span class=\"katex-inline\">\\max+1<\/span>），故 <span class=\"katex-inline\">a_{j+1}\\le1+\\max(a_1,\\dots,a_j)<\/span>。<\/p>\n<p>核验 <span class=\"katex-inline\">011<\/span>：<span class=\"katex-inline\">a_1=0<\/span>；<span class=\"katex-inline\">a_2=1<\/span> 新开 1 号块；<span class=\"katex-inline\">a_3=1<\/span> 进 1 号块，对应 <span class=\"katex-inline\">1\\mid23<\/span>。核验 <span class=\"katex-inline\">012<\/span>：<span class=\"katex-inline\">a_2=1<\/span> 新开，<span class=\"katex-inline\">a_3=2<\/span> 再新开，三块分立。违反约束的串如 <span class=\"katex-inline\">021<\/span>：<span class=\"katex-inline\">a_2=2&gt;1+\\max(0)=1<\/span>，第二个元素不可能直接进 2 号块——此时 2 号块尚不存在。<\/p>\n<h2>数值算例：集合划分与组合的差别<\/h2>\n<p>组合 <span class=\"katex-inline\">\\{1,3\\}<\/span> 是全集的一个子集，剩余元素 <span class=\"katex-inline\">\\{2\\}<\/span> 不被安排；集合划分 <span class=\"katex-inline\">13\\mid2<\/span> 要求成员 1、3 同块，成员 2 独自成块，全集被拆完。同一个元素表 <span class=\"katex-inline\">\\{1,3\\}<\/span> 在组合语境是选中子集，在划分语境只是其中一个块，块外成员另有归属。<\/p>\n<p><strong>第二算例：十二类方式对照方向<\/strong>。书里表 1 按球标记、桶标记、桶内球数限制交叉列出：<\/p>\n<ul><li>\n球标记、桶标记、每桶至多一个：<span class=\"katex-inline\">n<\/span> 排列方向；\n<\/li><li>\n球不标记、桶标记、无限制：<span class=\"katex-inline\">n<\/span> 元素的子集方向；\n<\/li><li>\n球标记、桶不标记：<span class=\"katex-inline\">\\{1,\\dots,n\\}<\/span> 的划分类；\n<\/li><li>\n球不标记、桶不标记：<span class=\"katex-inline\">n<\/span> 的划分类。\n<\/ul>\n<p>先固定球是否可区分、桶是否可区分，再选容量条件，类别才唯一。<\/p>\n<h2>延伸推演：生成集合划分的结构<\/h2>\n<p>限制增长串逐位生长：每加入一个新元素，选项是进已有块或开新块。生成算法沿串枚举：从 <span class=\"katex-inline\">00\\dots0<\/span> 出发，调整最右可改变的条目；开新块对应编号取上限，进旧块对应回退编号。这一结构与 c09 逆序序列的数位推进类似：辅助串的每一位有取值范围，遍历合法串即遍历对象全集。<\/p>\n<p>整数划分的生成则沿非增数列：固定第一项不超过前一项，剩余部分继续拆分；两条生成路线分别适配拆数与拆集合，不能互套。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>整数划分计入因子次序<\/strong>。把 <span class=\"katex-inline\">2+3<\/span> 与 <span class=\"katex-inline\">3+2<\/span> 当两个划分，<span class=\"katex-inline\">n=5<\/span> 的划分个数被放大；非增约定正是为了消除这类重复。生成时若允许后项大于前项，同一分拆会以多种次序重复出现。<\/p>\n<p><strong>集合划分块相交<\/strong>。若块 <span class=\"katex-inline\">\\{1,2\\}<\/span> 与 <span class=\"katex-inline\">\\{2,3\\}<\/span> 共享 2，元素 2 归属两块，划分不满足互不相交；计数时该对象被两个块分别计入，重复且定义失效。<\/p>\n<p><strong>跳过标记条件选类别<\/strong>。球不可区分时仍按排列计数，会把同构分配算成多个不同对象；桶不可区分时仍按有序分块排序，又会把同一划分重复列出。十二类方式的定位必须先回答球、桶两个标记问题。<\/p>\n<h2>对抗性追问：集合划分个数为什么不能用组合数直接给<\/h2>\n<p>组合数 <span class=\"katex-inline\">\\binom nt<\/span> 计数选一个子集；集合划分要把全集拆成若干块，块数从 1 到 <span class=\"katex-inline\">n<\/span> 不等，且块内成员归属同时确定。它对应第二类斯特林数方向的求和（各块数对应的划分个数相加），不是一次选 <span class=\"katex-inline\">t<\/span> 个元素能覆盖的量。c10 的组合是单层选择，集合划分是多层分块，计数层级不同。<\/p>\n<h2><span class=\"katex-inline\">n=4<\/span> 集合划分的限制增长串方向<\/h2>\n<p><span class=\"katex-inline\">a_1=0<\/span>；<span class=\"katex-inline\">a_2\\in\\{0,1\\}<\/span>；<span class=\"katex-inline\">a_3\\in\\{0,1,2\\}<\/span>；<span class=\"katex-inline\">a_4\\in\\{0,1,2,3\\}<\/span>，且 <span class=\"katex-inline\">a_{j+1}\\le1+\\max(a_1\\dots a_j)<\/span>。合法串例如：<\/p>\n<ul><li>\n<span class=\"katex-inline\">0000<\/span>：四块合一，<span class=\"katex-inline\">1234<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">0001<\/span>：<span class=\"katex-inline\">123\\mid4<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">0010<\/span>：<span class=\"katex-inline\">124\\mid3<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">0101<\/span>：<span class=\"katex-inline\">13\\mid24<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">0123<\/span>：四块分立，<span class=\"katex-inline\">1\\mid2\\mid3\\mid4<\/span>。\n<\/ul>\n<p>核验 <span class=\"katex-inline\">0101<\/span>：<span class=\"katex-inline\">a_2=1<\/span> 新开块 1；<span class=\"katex-inline\">a_3=0<\/span> 回块 0；<span class=\"katex-inline\">a_4=1<\/span> 进块 1，块 0 为 <span class=\"katex-inline\">\\{1,3\\}<\/span>，块 1 为 <span class=\"katex-inline\">\\{2,4\\}<\/span>。<\/p>\n<h2>十二类方式定位对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>球<\/th><th>桶<\/th><th>条件方向<\/th><th>对应对象<\/th><\/tr><\/thead><tbody><tr><td>标记<\/td><td>标记<\/td><td>每桶至多一个<\/td><td><span class=\"katex-inline\">n<\/span> 排列<\/td><\/tr><tr><td>不标记<\/td><td>标记<\/td><td>无限制<\/td><td>子集方向<\/td><\/tr><tr><td>标记<\/td><td>不标记<\/td><td>无限制<\/td><td><span class=\"katex-inline\">\\{1,\\dots,n\\}<\/span> 划分<\/td><\/tr><tr><td>不标记<\/td><td>不标记<\/td><td>无限制<\/td><td><span class=\"katex-inline\">n<\/span> 的划分<\/td><\/tr><\/tbody><\/table><\/div>\n<p>先定球、桶是否可区分，再定桶容量（无限制、至少一个、至多一个），类别唯一。球不标记时同构分配合并计数；桶不标记时块的次序被吸收。<\/p>\n<h2>两类划分生成路线<\/h2>\n<p>整数划分沿非增数列：固定第一项不超过前一项，剩余部分递归拆分；生成对象是数值的多重和。集合划分沿限制增长串逐位生长：新元素进已有块或开新块；生成对象是成员归属关系。两条路线不能互套：把集合划分按非增数列排序没有意义，把整数划分按块成员列清单也没有对应对象。<\/p>\n<h2>计数区别再辨<\/h2>\n<p>组合数 <span class=\"katex-inline\">\\binom nt<\/span> 选一个子集；第二类斯特林数方向计数把全集拆成指定块数的集合划分，全部块数求和才是集合划分总数；整数划分计数由分拆数给出。三者计数对象不同，公式不能互相替代。<\/p>\n<h2>限制增长串的合法性条件逐条核<\/h2>\n<ol><li>\n<span class=\"katex-inline\">a_1=0<\/span>：第一个元素归入 0 号块。\n<\/li><li>\n<span class=\"katex-inline\">a_{j+1}\\le1+\\max(a_1\\dots a_j)<\/span>：新元素进已有块，或开编号最大加 1 的新块。\n<\/li><li>\n块编号在标准写法下按最小元素递增排列。\n<\/ol>\n<p>违反第 2 条的串（如 <span class=\"katex-inline\">021<\/span>）跳过尚不存在的块，不能对应划分。<\/p>\n<h2>两类划分的生成不可互套<\/h2>\n<p>整数划分沿非增数列递归拆分；集合划分沿增长串逐位定归属。把集合成员排成非增数列没有意义，把整数拆块列成员清单也没有对象对应。学习时先判断问题拆的是数还是集合，再选生成路线。<\/p>\n<h2>与组合、树的层次关系<\/h2>\n<p>组合是选出一个子集；集合划分是把全集拆成一组不相交子集；树是带嵌套父子层次的结构。组合是划分的单层构件，划分是树的扁平前驱。c12 的森林可以看成集合划分再加上嵌套父子关系。<\/p>\n<h2>块的标准排序两条规则<\/h2>\n<p>块内元素按递增排列；块之间按各自最小元素递增排列。两条规则把同一划分的多种书写折成一份标准形：不排序时 <span class=\"katex-inline\">\\{3,1\\}\\mid\\{2\\}<\/span> 与 <span class=\"katex-inline\">\\{2\\}\\mid\\{1,3\\}<\/span> 看起来不同，标准化后归为同一划分。枚举与计数前先完成标准化，否则重复计数。<\/p>\n<h2>集合划分与等价关系<\/h2>\n<p>书里提示集合划分对应等价关系：自反、对称、传递的二元关系，等价类即块；<span class=\"katex-inline\">j\\equiv k\\pmod{\\Pi}<\/span> 表示 <span class=\"katex-inline\">j,k<\/span> 属同一块。划分把集合分成等价类，块内等价、块间不等价。这一视角把分组结构接到关系代数概念上。<\/p>\n<h2>整数划分的非增约束作用<\/h2>\n<p>非增次序吸收因子排列：<span class=\"katex-inline\">3+1<\/span> 与 <span class=\"katex-inline\">1+3<\/span> 同一划分。生成时第一项不超过前一项，剩余部分递归拆分；若允许后项大于前项，同一分拆以多种次序重复出现，分拆数被放大。非增是计数去重的约定，不是额外限制。<\/p>\n<h2>小结：先分类再计数<\/h2>\n<p>拿到一个分组问题，先回答球是否可区分、桶是否可区分，再判断拆的是数还是集合；类别定下来再选公式与生成路线。跳过分类直接套计数公式，最容易把排列当子集、把集合划分当整数划分，两类对象的个数与生成方法都对不上。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">n=6<\/span> 的整数划分中以最大项 3 开头的全部条目，核对非增。\n<\/li><li>\n限制增长串 <span class=\"katex-inline\">0101<\/span> 对应怎样的集合划分？块内与块间怎样标准化书写？\n<\/li><li>\n为什么 <span class=\"katex-inline\">a_{j+1}<\/span> 不能超过 <span class=\"katex-inline\">1+\\max(a_1,\\dots,a_j)<\/span>？\n<\/li><li>\n组合与集合划分在&quot;剩余元素归属&quot;上差在哪里？\n<\/li><li>\n十二类方式定位前，必须先回答哪两个标记问题？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "整数划分与集合划分：十二类方式与两类划分的差别"}, "c12": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.382<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">整数划分与集合划分：十二类方式与两类划分的差别<\/a><\/span><\/div><h1>树的生成：嵌套括号串与括号串算法 P<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（原书 §7.2.1.6，PDF 第 381–382 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p>树与森林是组合枚举里结构最复杂的一类对象：结点有父子、兄弟层次，直接列出所有树很难定序。书里用嵌套括号串把树拉平成线性序列：一对括号对应一个结点，嵌套对应子女，并列对应兄弟。生成合法括号串就等于生成对应森林；困难在于界定什么样的串合法，以及怎样按字典序逐个产出全部合法串而不漏不重。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>括号串<\/strong>：含 <span class=\"katex-inline\">n<\/span> 个左括号 &quot;(&quot; 与 <span class=\"katex-inline\">n<\/span> 个右括号 &quot;)&quot; 的串；第 <span class=\"katex-inline\">k<\/span> 个 &quot;(&quot; 与对应 &quot;)&quot; 配对。<\/p>\n<p><strong>合法条件<\/strong>：从左到右扫描，任一前缀中左括号数不少于右括号数；串末两者相等。<\/p>\n<p><strong>森林对应<\/strong>：&quot;(&quot; 见到结点左边，&quot;)&quot; 见到结点右边；嵌套括号是子女，并列括号是兄弟。串外围爬行可重建括号匹配与树结构。<\/p>\n<p><strong>森林与二叉树对应<\/strong>：按卷 1 §2.3.2 的自然对应，森林可换成二叉树表示——左链挂长子，右链挂兄弟。<\/p>\n<p><strong>括号串算法 P（字典序括号串）<\/strong>，整数 <span class=\"katex-inline\">n\\ge2<\/span>：<\/p>\n<ul><li>\n<strong>P1. 初始化<\/strong>：对 <span class=\"katex-inline\">1\\le k\\le n<\/span> 置 <span class=\"katex-inline\">a_{2k-1}=<\/span> &quot;(&quot;，<span class=\"katex-inline\">a_{2k}=<\/span> &quot;)&quot;；另置 <span class=\"katex-inline\">a_0=<\/span> &quot;)&quot;，<span class=\"katex-inline\">m\\leftarrow2n-1<\/span>。\n<\/li><li>\n<strong>P2. 访问<\/strong>：访问串 <span class=\"katex-inline\">a_1a_2\\dots a_{2n}<\/span>。\n<\/li><li>\n<strong>P3. 简单情形<\/strong>：若 <span class=\"katex-inline\">a_{m-1}=<\/span> &quot;(&quot;，置 <span class=\"katex-inline\">a_{m-1}=<\/span> &quot;)&quot;，<span class=\"katex-inline\">a_m\\leftarrow<\/span> &quot;(&quot;，<span class=\"katex-inline\">m\\leftarrow m-1<\/span>，返回 P2。\n<\/li><li>\n<strong>P4. 找置位 <span class=\"katex-inline\">j<\/span><\/strong>：置 <span class=\"katex-inline\">m\\leftarrow m-1<\/span>，<span class=\"katex-inline\">k\\leftarrow2n-1<\/span>；当 <span class=\"katex-inline\">a_j=<\/span> &quot;(&quot; 时 <span class=\"katex-inline\">a_j<\/span> 加 1、<span class=\"katex-inline\">a_k\\leftarrow<\/span> &quot;(&quot;，<span class=\"katex-inline\">j\\leftarrow j-1<\/span>，<span class=\"katex-inline\">k\\leftarrow k-2<\/span>。\n<\/li><li>\n<strong>P5. 追加<\/strong>：若 <span class=\"katex-inline\">j=0<\/span> 终止；否则置 <span class=\"katex-inline\">a_j=<\/span> &quot;(&quot;，<span class=\"katex-inline\">k\\leftarrow2n-1<\/span>，返回 P2。\n<\/ul>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">n=3<\/span> 的合法括号串含 <code>((()))<\/code>、<code>(()())<\/code>、<code>(())()<\/code>、<code>()(())<\/code>、<code>()()()<\/code>，对应 5 棵森林结构。<\/p>\n<p><strong>反例<\/strong>：前缀右括号多于左括号（如 <code>)()<\/code>）无法配对；左右括号数不等不是合法串。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>配对与结构<\/strong>：每个 &quot;(&quot; 开启一个结点，其后嵌套的括号串是其子女序列；同层并列的括号是兄弟。括号匹配唯一确定父子关系，串与森林一一对应。<\/p>\n<p><strong>合法性闸门<\/strong>：前缀计数非负保证不会出现先闭合尚未开始的结点；末位相等保证所有开启的结点都已闭合。两条约束排除悬空边与未闭合结点。<\/p>\n<p><strong>字典序生成<\/strong>：初始串 <code>()()...()<\/code> 方向的哨兵形式；P3 处理相邻可直接交换的简单情形，P4–P5 定位可改下标并重排后缀，沿字典序走到终止。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：生成 <span class=\"katex-inline\">n<\/span> 对括号对应的森林；结点未带额外标记。\n<\/li><li>\n失败案例 1：前缀计数为负。右括号先于匹配的左括号出现，还原出悬空闭合，树结构断裂。\n<\/li><li>\n失败案例 2：括号总数不等。<span class=\"katex-inline\">n<\/span> 对要求左右各 <span class=\"katex-inline\">n<\/span> 个；缺一个右括号则有结点未闭合。\n<\/li><li>\n边界：带标记结点、有序度受限的树另有计数与生成约束；括号串对应普通无序/有序森林的基础结构。串里不保存结点名字，还原后若需要区分结点，还要另挂编号或数据字段。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>括号串 vs 一般位串<\/strong>：n 元组位串任意 0/1 分布；括号串受前缀非负与总数相等双重约束，是合法 Dyck 型序列。\n<\/li><li>\n<strong>森林 vs 二叉树<\/strong>：森林是原结构；二叉树是经长子-兄弟转换的等价表示，两者一一对应但视图不同。\n<\/li><li>\n<strong>括号配对 vs 排列邻接交换<\/strong>：括号串生成沿字典序；c09 的邻接交换服务于排列，对象结构不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c11 集合划分给出集合的分组结构，树是带嵌套层次的分组；c10 位串表示是括号串的无约束版本。后继：树结构在后续卷目的搜索树、遍历、表达式求值中作为基础数据结构；括号匹配思想与栈式遍历直接相关。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（树的生成：嵌套括号串与括号串算法 P）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：括号合法性核验、森林还原与括号串算法 P 推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>树生成沿括号串路线，往回追四层：<\/p>\n<ol><li>\n树结构：结点有父子与兄弟层次，需要一种线性编码把层次关系记下来。\n<\/li><li>\n括号编码：一对括号对应一个结点，嵌套记子女，并列记兄弟。\n<\/li><li>\n合法性约束：前缀左括号数不少于右括号数，末尾两者相等。\n<\/li><li>\n生成路线：字典序括号串算法 P 从哨兵初始串出发，逐次产出全部合法串。\n<\/ol>\n<p>依赖链方向：树的层次 → 括号嵌套编码 → 前缀/总数约束 → 字典序枚举 → 串树互译。<\/p>\n<h2>正向推导：合法性两条约束的必要性<\/h2>\n<p>设串 <span class=\"katex-inline\">a_1\\dots a_{2n}<\/span>，扫描到第 <span class=\"katex-inline\">k<\/span> 位时记左括号数 <span class=\"katex-inline\">L_k<\/span>、右括号数 <span class=\"katex-inline\">R_k<\/span>。<\/p>\n<p><strong>前缀非负<\/strong>：<span class=\"katex-inline\">L_k-R_k\\ge0<\/span> 对所有 <span class=\"katex-inline\">k<\/span> 成立。右括号只能闭合此前已开启的结点；若某前缀 <span class=\"katex-inline\">R_k&gt;L_k<\/span>，出现一个没有对应左括号的右括号，还原时得到悬空闭合边。<\/p>\n<p><strong>末尾相等<\/strong>：<span class=\"katex-inline\">L_{2n}=R_{2n}=n<\/span>。所有开启的结点都必须闭合；左括号剩余意味着有结点未结束，右括号剩余意味着闭合了不存在的结点。<\/p>\n<p>两条合起来：串是合法括号串。满足约束的串与森林一一对应——这是 Dyck 型结构的基本对应。<\/p>\n<h2>数值算例：<span class=\"katex-inline\">n=3<\/span> 的五个合法串核验<\/h2>\n<p>逐个扫描前缀差值 <span class=\"katex-inline\">L-R<\/span>：<\/p>\n<ol><li>\n<code>((()))<\/code>：差值序列 <span class=\"katex-inline\">1,2,3,2,1,0<\/span>，全程非负，末尾 0。\n<\/li><li>\n<code>(()())<\/code>：<span class=\"katex-inline\">1,2,1,2,1,0<\/span>，非负。\n<\/li><li>\n<code>(())()<\/code>：<span class=\"katex-inline\">1,2,1,0,1,0<\/span>，非负。\n<\/li><li>\n<code>()(())<\/code>：<span class=\"katex-inline\">1,0,1,2,1,0<\/span>，非负。\n<\/li><li>\n<code>()()()<\/code>：<span class=\"katex-inline\">1,0,1,0,1,0<\/span>，非负。\n<\/ol>\n<p>不合法示例：<code>)()(<\/code> 首位差值 <span class=\"katex-inline\">-1<\/span>，前缀为负；<code>((()<\/code> 末尾 <span class=\"katex-inline\">L=3,R=1<\/span>，总数不等。<\/p>\n<p><strong>第二算例：串还原森林<\/strong>。取串 <code>(())()<\/code>：<\/p>\n<ol><li>\n第 1 位 &quot;(&quot; 开启结点 A；第 2 位 &quot;(&quot; 开启结点 B（A 的子女）。\n<\/li><li>\n第 3 位 &quot;)&quot; 闭合 B；第 4 位 &quot;)&quot; 闭合 A。\n<\/li><li>\n第 5 位 &quot;(&quot; 开启结点 C（A 的兄弟，森林第二棵根）；第 6 位 &quot;)&quot; 闭合 C。\n<\/ol>\n<p>森林：第一棵根 A 带子女 B；第二棵根 C。括号嵌套关系给出父子，同层并列给出兄弟。<\/p>\n<h2>延伸推演：森林到二叉树的转换方向<\/h2>\n<p>按长子-兄弟表示：每个结点左链挂第一个子女，右链挂下一个兄弟。森林的根之间也用右链相连。反向还原时，左链回长子，右链回下一兄弟（或下一棵根）。括号串先还原成森林，再走这一转换得到二叉树；两条表示保持一一对应，结点集合不变，只是链接方式改变。<\/p>\n<p>计数方向：<span class=\"katex-inline\">n=1<\/span> 一个串 <code>()<\/code>；<span class=\"katex-inline\">n=2<\/span> 两个串 <code>(())<\/code>、<code>()()<\/code>；<span class=\"katex-inline\">n=3<\/span> 五个。该计数序列即卡特兰数方向（此处为组合计数常识，未在本书页内逐字核对编号）。括号串个数随 <span class=\"katex-inline\">n<\/span> 增长快于线性，但仍远小于任意 <span class=\"katex-inline\">2n<\/span> 位位串总数 <span class=\"katex-inline\">2^{2n}<\/span>，合法性约束筛掉了大部分序列。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>前缀出现悬空右括号<\/strong>。串 <code>())(<\/code>：第 3 位右括号使差值降到 <span class=\"katex-inline\">-1<\/span>；此时前两个左括号已闭合，再来右括号没有可闭合的结点。还原树时该右括号找不到父结点，结构断裂。<\/p>\n<p><strong>括号总数不等<\/strong>。串 <code>(()<\/code> 只有两个左括号、一个右括号；末尾差值为 1，有结点停留在开启状态。生成算法必须保证每步左右计数同步，P1 初始化成对布置括号。<\/p>\n<p><strong>把并列当嵌套<\/strong>。<code>()()<\/code> 是两个兄弟根；若误读成一个根带两个子女，会把森林压成单棵树。区分依据：回到差值 0 的层位，该层并列的括号属于兄弟，未回零的嵌套属于子女。<\/p>\n<h2>对抗性追问：括号串为什么比直接列树容易生成<\/h2>\n<p>树的父子兄弟关系是二维层次结构；括号串压成一维序列后，合法性只留两个计数条件，枚举可按字典序在一维串上推进。生成器处理的是字符串的下标与字符，树结构由还原步骤事后重建。代价是：拿到串后还要走一遍配对扫描才能得到树，生成阶段不直接维护结点链接。<\/p>\n<h2><span class=\"katex-inline\">n=2<\/span> 与 <span class=\"katex-inline\">n=4<\/span> 的合法串方向<\/h2>\n<p><span class=\"katex-inline\">n=2<\/span>：<code>(())<\/code>、<code>()()<\/code>，两个串。<span class=\"katex-inline\">n=3<\/span>：五个串见前述。<span class=\"katex-inline\">n=4<\/span> 合法串个数沿卡特兰数方向增长到 14；任意 8 位串共 <span class=\"katex-inline\">2^8=256<\/span> 个，合法性约束筛掉绝大多数。列出 <span class=\"katex-inline\">n=4<\/span> 的部分串：<code>(((())))<\/code>、<code>((()()))<\/code>、<code>((())())<\/code>、<code>(()(()))<\/code>、<code>()((()))<\/code>，每个前缀差值非负、末尾回 0。<\/p>\n<h2>栈匹配过程<\/h2>\n<p>扫描串时维护一个计数栈：遇 &quot;(&quot; 压入一个开启标记，遇 &quot;)&quot; 弹出最近未闭合的 &quot;(&quot;。<\/p>\n<p>以 <code>(()())<\/code> 为例：<\/p>\n<ol><li>\n&quot;(&quot; 压栈，栈深 1。\n<\/li><li>\n&quot;(&quot; 压栈，栈深 2。\n<\/li><li>\n&quot;)&quot; 弹出内层 &quot;(&quot;，栈深 1。\n<\/li><li>\n&quot;(&quot; 压栈，栈深 2。\n<\/li><li>\n&quot;)&quot; 弹出，栈深 1。\n<\/li><li>\n&quot;)&quot; 弹出根 &quot;(&quot;，栈深 0。\n<\/ol>\n<p>栈空且串结束，匹配完成；中途栈空又遇 &quot;)&quot; 即前缀非法。栈的压弹次序直接给出括号配对关系。<\/p>\n<h2>森林到二叉树第二例<\/h2>\n<p>森林：根 A 带子女 B、C；根 D 独立。长子-兄弟转换：A 左链挂长子 B，B 右链挂兄弟 C；A 右链挂下一棵根 D。反向还原：沿左链找长子，沿右链找下一兄弟或下一根。结点集合不变，改变的只是链接指向。<\/p>\n<h2>串与树的互译边界<\/h2>\n<p>括号串保存嵌套与并列关系，不保存结点名与附加数据；还原森林后再挂编号、权重等字段。有序森林与无序森林的差别在括号串层面不直接体现，需要额外约定子女次序。生成算法 P 产出的是合法串全集，树结构由还原步骤事后得到，生成阶段不维护结点指针。<\/p>\n<h2>合法性两条约束的独立作用<\/h2>\n<p>前缀非负排除悬空右括号；末尾相等排除未闭合左括号。只查末尾相等不查前缀，会放过 <code>)(()<\/code> 这类前缀为负的串；只查前缀不查末尾，会放过 <code>((()<\/code> 这类左括号剩余的串。两条约束必须同时核验。<\/p>\n<h2>括号串合法性的手工核验流程<\/h2>\n<ol><li>\n数左右括号总数，必须各为 <span class=\"katex-inline\">n<\/span>。\n<\/li><li>\n从左到右扫，维护差值 <span class=\"katex-inline\">L-R<\/span>，每步核验非负。\n<\/li><li>\n末尾差值回到 0。\n<\/li><li>\n用栈压弹核对配对：遇 &quot;(&quot; 压，遇 &quot;)&quot; 弹最近 &quot;(&quot;，中途栈空遇 &quot;)&quot; 即非法。\n<\/ol>\n<p>四步全过才是合法串；任一不过，还原出的树有悬空边或未闭合结点。<\/p>\n<h2><span class=\"katex-inline\">n=3<\/span> 五串的森林对照<\/h2>\n<ul><li>\n<code>((()))<\/code>：一棵根带两层嵌套子女。\n<\/li><li>\n<code>(()())<\/code>：一根领两个并列子女。\n<\/li><li>\n<code>(())()<\/code>：第一棵根带一子女，第二棵独立根。\n<\/li><li>\n<code>()(())<\/code>：第一棵独立根，第二棵根带一子女。\n<\/li><li>\n<code>()()()<\/code>：三个并列独立根。\n<\/ul>\n<p>差值回到 0 的层位分出兄弟与森林分界；未回零的嵌套分出子女。<\/p>\n<h2>生成与还原的分工<\/h2>\n<p>算法 P 在一维串上按字典序产出合法括号串；树结构由事后配对扫描重建。生成阶段不维护结点指针，还原阶段才搭父子兄弟链接。需要结点名字或附加数据时，在还原后再挂字段，括号串本身不保存这些信息。<\/p>\n<h2>与卷 1 树概念的衔接<\/h2>\n<p>卷 1 讲二叉树定义与三序遍历；本卷括号串给出森林到二叉树的长子-兄弟转换入口。串还原森林，森林转二叉树，之后即可套用先序、中序、后序遍历。括号匹配栈与遍历栈是同一类后进先出结构的两种用途。<\/p>\n<h2>括号配对的栈深度含义<\/h2>\n<p>栈的最大深度对应该森林的嵌套层数；栈深 1 是并列根森林，栈深等于树高。串 <code>((()))<\/code> 栈深 3，<code>()()()<\/code> 栈深 1。还原树时栈深直接给出结点所在层级，可用于校验树高与括号嵌套是否一致。<\/p>\n<h2>合法串计数的增长方向<\/h2>\n<p><span class=\"katex-inline\">n=1<\/span> 一个，<span class=\"katex-inline\">n=2<\/span> 两个，<span class=\"katex-inline\">n=3<\/span> 五个，<span class=\"katex-inline\">n=4<\/span> 十四个，序列沿卡特兰数方向增长；相比任意 <span class=\"katex-inline\">2n<\/span> 位位串总数 <span class=\"katex-inline\">2^{2n}<\/span>，合法串占比随 <span class=\"katex-inline\">n<\/span> 迅速下降。生成算法只遍历合法串，不逐个测试全部位串再筛非法项。<\/p>\n<h2>森林、二叉树与遍历的衔接<\/h2>\n<p>括号串先还原森林，长子-兄弟转换得到二叉树；之后可套用卷 1 的先序、中序、后序遍历。括号匹配栈与遍历栈同属后进先出结构：前者配对括号，后者回溯结点。读到一段括号串时，先定森林结构，再谈遍历次序。<\/p>\n<h2>括号串与表达式树的联系<\/h2>\n<p>算术表达式的运算数与运算符也可用括号结构表示；本卷括号串先对应森林结点，运算符挂在结点上即得到表达式树。栈扫描括号的过程与表达式求值的栈处理同构：遇开括号进栈，遇闭括号退栈汇总。学习时可把树生成与表达式求值的栈机制对照起来看。<\/p>\n<h2>生成边界补充<\/h2>\n<p>括号串算法 P 产出 <span class=\"katex-inline\">n<\/span> 对括号的全部合法串；结点带标记、子女有序度受限、指定树高或指定度数等约束，需要在合法串基础上再加筛选条件。基础路线先覆盖无约束森林，约束枚举在其上叠加过滤或专用生成规则。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <code>(()())<\/code> 每一位的前缀差值，核验全程非负、末尾为 0。\n<\/li><li>\n串 <code>()(())<\/code> 还原出怎样的森林？哪些是兄弟，哪些是子女？\n<\/li><li>\n前缀非负与末尾相等两条约束各排除什么错误？\n<\/li><li>\n长子-兄弟转换中，左链、右链分别挂什么？\n<\/li><li>\n为什么 <code>()()<\/code> 不能读成一个根带两个子女？层位差值在哪一步回到 0？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "树的生成：嵌套括号串与括号串算法 P"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：0 与 1：布尔代数、布尔函数与求值网络<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1）<\/a><br>检查点：能写出与/或/非与德摩根定律，按真值表读出一个两变量函数属于哪种运算，说明函数链怎样一步步算出目标函数<\/li><li class='path-step' id='path-02'><strong>步骤 02：位操作与决策结构：按位运算、BDD 及其规模<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 7 章 7.1.3–7.1.4：按位运算的技巧与方法、二元决策图<\/a><br>检查点：能解释包含关系 x⊆y 的三种等价写法，说清 BDD 有序与规约两条约束，判断变量序对 BDD 规模的影响方向<\/li><li class='path-step' id='path-03'><strong>步骤 03：枚举元组与排列：格雷码、字典序与邻接交换<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 7 章 7.2.1.1–7.2.1.2：生成所有 n 元组与所有排列<\/a><br>检查点：能从递归规则画出 3 位格雷码序列，手算 Algorithm L 对给定排列的下一个排列，写出逆序序列并说明 Algorithm P 怎样只交换相邻两项<\/li><li class='path-step' id='path-04'><strong>步骤 04：生成其余组合对象：组合、划分、集合划分与树<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 7 章 7.2.1.3–7.2.1.6：生成组合、划分、集合划分与树<\/a><br>检查点：能在元素表与位串两种表示间转换一个组合，区分整数划分与集合划分，把一个括号串还原成森林并说出对应算法<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='布尔代数（boolean algebra）'>布尔代数（Boolean algebra） — 在值 0 与 1 上定义与、或、非三种基本运算的代数结构；满足交换律、结合律、分配律、吸收律与德摩根律等基本定律 <span class=glossary-ref>（第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1））<\/span><\/li><li data-term='布尔函数 $f(x_1,\\dots,x_n)$'>布尔函数 $f(x_1,\\dots,x_n)$ — 把 $n$ 个二进制输入映射到 0 或 1 的函数；每个输入赋值对应真值表一行，$n$ 变量函数共有 $2^{2^n}$ 个不同函数 <span class=glossary-ref>（第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1））<\/span><\/li><li data-term='真值表（truth table）'>真值表（truth table） — 列出全部 $2^n$ 个输入取值及其函数值的表；两变量函数共有 16 种，每种由真值表中 0、1 的四元序列标识 <span class=glossary-ref>（第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1））<\/span><\/li><li data-term='函数链（chain of functions）'>函数链（chain of functions） — 求值布尔网络的表示：新增结点 $x_i=x_j\\circ x_k$，其中 $j,k&lt;i$，$\\circ$ 为一种二元布尔运算；沿链逐步算出目标函数 <span class=glossary-ref>（第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1））<\/span><\/li><li data-term='按位运算（bitwise operation）'>按位运算（bitwise operation） — 对二进制整数按位施加的与 $x\\&amp;y$、或 $x\\mid y$、异或 $x\\oplus y$ 与非运算；每一位独立参与同一运算 <span class=glossary-ref>（第 7 章 7.1.3–7.1.4：按位运算的技巧与方法、二元决策图）<\/span><\/li><li data-term='包含关系 $x\\subseteq y$'>包含关系 $x\\subseteq y$ — 当且仅当 $x$ 的每个 1 位都在 $y$ 中为 1；等价写法 $x\\&amp;y=x$、$x\\mid y=y$、$x\\&amp;\\bar y=0$ <span class=glossary-ref>（第 7 章 7.1.3–7.1.4：按位运算的技巧与方法、二元决策图）<\/span><\/li><li data-term='二元决策图（bdd）'>二元决策图（BDD） — 表示布尔函数的有向无环图：每个非汇结点带变量 $V$ 与 LO、HI 两条分支，LO 对应变量取 0，HI 对应取 1；要求有序且已规约，共享相同子树 <span class=glossary-ref>（第 7 章 7.1.3–7.1.4：按位运算的技巧与方法、二元决策图）<\/span><\/li><li data-term='格雷码（gray code）'>格雷码（Gray code） — 把 $2^n$ 个 $n$ 位串排成一圈或一列，相邻两个码只差一位；递归构造 $\\Gamma_0=\\epsilon$，$\\Gamma_{n+1}=0\\Gamma_n,\\ 1\\Gamma_n^{R}$ <span class=glossary-ref>（第 7 章 7.2.1.1–7.2.1.2：生成所有 n 元组与所有排列）<\/span><\/li><li data-term='字典序（lexicographic order）'>字典序（lexicographic order） — 类比词典逐位比较大小的排列次序；算法 L 从最小排列 $a_1\\le\\cdots\\le a_n$ 出发，依次生成下一个字典序排列 <span class=glossary-ref>（第 7 章 7.2.1.1–7.2.1.2：生成所有 n 元组与所有排列）<\/span><\/li><li data-term='逆序序列（inversion sequence）'>逆序序列（inversion sequence） — 排列的辅助计数 $c_j$，其中 $c_j$ 是比 $j$ 小且处在 $j$ 右边的元素数目，约定 $0\\le c_j&lt;j$；遍历所有合法逆序序列即可生成全部排列 <span class=glossary-ref>（第 7 章 7.2.1.1–7.2.1.2：生成所有 n 元组与所有排列）<\/span><\/li><li data-term='$(s,t)$ 组合（combination）'>$(s,t)$ 组合（combination） — 从 $n=s+t$ 个对象中选 $t$ 个组成的无序子集；可写成递减元素表 $c_t&gt;\\cdots&gt;c_1$，或写成恰含 $t$ 个 1 的二进制位串 <span class=glossary-ref>（第 7 章 7.2.1.3–7.2.1.6：生成组合、划分、集合划分与树）<\/span><\/li><li data-term='整数划分（partition）'>整数划分（partition） — 把一个正整数 $n$ 写成一组非增正整数之和 $n=a_1+\\cdots+a_m$，不考虑次序；与集合划分是两类不同对象 <span class=glossary-ref>（第 7 章 7.2.1.3–7.2.1.6：生成组合、划分、集合划分与树）<\/span><\/li><li data-term='集合划分（set partition）'>集合划分（set partition） — 把一个集合划分为若干互不相交的非空子集合（块）；块内元素可排序，块间按最小元素递增排序以便标准化表示 <span class=glossary-ref>（第 7 章 7.2.1.3–7.2.1.6：生成组合、划分、集合划分与树）<\/span><\/li><li data-term='括号串（parenthesis string）'>括号串（parenthesis string） — 由 $n$ 个左括号与 $n$ 个右括号组成、前缀计数始终非负的串；与森林一一对应，沿串外围爬行即可重建括号匹配与树结构 <span class=glossary-ref>（第 7 章 7.2.1.3–7.2.1.6：生成组合、划分、集合划分与树）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库<\/h1>\n<h2>模式 1：布尔表达式先核对取值表，再套定律<\/h2>\n<p>拿到一个布尔式子，先把变量取值逐行列出，确认每步运算用的是与、或、非还是异或；再决定改写方向。与或的吸收、分配可双向使用，异或不满足吸收，不能套取大取小格结构的化简规则。化简前后各取两行典型赋值核验，防止定律误用把式子改错。<\/p>\n<h2>模式 2：判断子集关系走三种按位等式互证<\/h2>\n<p>判断位集合 <span class=\"katex-inline\">x<\/span> 是否包含于 <span class=\"katex-inline\">y<\/span>，不要凭数值大小猜。依次核验 <span class=\"katex-inline\">x\\&amp;y=x<\/span>、<span class=\"katex-inline\">x\\mid y=y<\/span>、<span class=\"katex-inline\">x\\&amp;\\bar y=0<\/span>；三式等价，任一不成立即不包含。位集合子集与整数大小是两条独立规则，报告结论时写明用的是哪一种。<\/p>\n<h2>模式 3：建 BDD 先定变量序，再展开、合并、消冗余<\/h2>\n<p>构造有序规约 BDD 的顺序：固定变量次序 → 逐变量展开分支 → 合并三元值相同的子树 → 消去 LO=HI 的冗余结点。次序未定就展开，后面共享关系无从判断；只展开不合并，结点数退回决策树规模。规模异常膨胀时先回头检查变量序是否把耦合变量拆散。<\/p>\n<h2>模式 4：枚举对象先定计数口径，再选生成次序<\/h2>\n<p>枚举前先回答：对象总数是多少（<span class=\"katex-inline\">2^n<\/span>、<span class=\"katex-inline\">n!<\/span>、<span class=\"katex-inline\">\\binom nt<\/span>、划分数列），要求全覆盖还是低改动。全覆盖可走字典序；相邻切换代价高再考虑格雷码、邻接交换、旋转门一类低改动次序。计数口径与生成次序分开选，不要用低改动路线的产物顺序代替大小全序。<\/p>\n<h2>模式 5：字典序生成沿&quot;支点—交换—后缀重排&quot;三步<\/h2>\n<p>下一个字典序对象的通用构造：从右往左找最右可增大的支点；在后缀中找最小可换元素交换；把后缀重排成最小次序。排列反序后缀，组合重设左侧元素为最小紧邻值。支点找错方向会漏排，后缀不重排会次序偏大，两步都要核。<\/p>\n<h2>模式 6：低改动枚举靠辅助计数驱动，产物与状态分开存<\/h2>\n<p>邻接交换、格雷码这类路线用辅助状态（逆序序列、方向位、递归层级）控制每次改动；输出对象是排列或位串，辅助计数不进入产物。写实现时把状态字段与输出字段分开，遍历合法状态空间即覆盖全部对象；状态范围边界（如 <span class=\"katex-inline\">0\\le c_j&lt;j<\/span>）必须严格，越界状态无对应对象。<\/p>\n<h2>模式 7：分组问题先分球桶标记，再判拆数还是拆集合<\/h2>\n<p>遇到&quot;划分/分组&quot;先问：被分对象可否区分（球标记），接收位置可否区分（桶标记）；再判断拆的是整数还是集合。标记条件决定对象是排列、子集还是划分；拆数走非增数列，拆集合走块归属。分类未定前不套计数公式，避免两类划分混算。<\/p>\n<h2>模式 8：树结构先压成括号串，还原时按栈配对<\/h2>\n<p>树与森林枚举先转成括号串：一对括号一个结点，嵌套记子女，并列记兄弟。合法性两道闸：前缀左括号不少于右括号，末尾两者相等；栈扫描遇 &quot;(&quot; 压、遇 &quot;)&quot; 弹。串还原森林后再做长子-兄弟二叉树转换与遍历，生成阶段不维护结点指针。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 布尔代数与求值<\/strong>：0/1 两值逻辑、与或非定律、真值表与 DNF/CNF、函数链求值（PDF 第 53、55、93 页起；印刷页 = PDF 页 − 15）。\n<\/li><li>\n<strong>第 2 章 位运算与 BDD<\/strong>：按位与/或/异或、包含关系、二元决策图有序规约、规模与变量序、沿图计数采样（PDF 第 125、184、188 页起）。\n<\/li><li>\n<strong>第 3 章 元组与排列<\/strong>：n 元组 <span class=\"katex-inline\">2^n<\/span> 个、格雷码递归与 <span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span>、字典序 Algorithm L、邻接交换 Algorithm P 与逆序序列（PDF 第 249、251、281、283 页起）。\n<\/li><li>\n<strong>第 4 章 组合、划分与树<\/strong>：组合双表示、算法 L/T、整数划分与集合划分、十二类方式、括号串与森林、括号算法 P（PDF 第 309、312、339、360、382 页起）。\n<\/ul>\n<h2>布尔运算速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>运算<\/th><th>记号<\/th><th>取值规则<\/th><th>主要性质<\/th><\/tr><\/thead><tbody><tr><td>与<\/td><td><span class=\"katex-inline\">x\\wedge y<\/span> / <span class=\"katex-inline\">x\\&amp;y<\/span><\/td><td>两者皆 1 为 1<\/td><td>交换、结合、幂等、吸收<\/td><\/tr><tr><td>或<\/td><td><span class=\"katex-inline\">x\\vee y<\/span> / <span class=\"katex-inline\">x\\mid y<\/span><\/td><td>任一为 1 为 1<\/td><td>交换、结合、幂等、吸收<\/td><\/tr><tr><td>异或<\/td><td><span class=\"katex-inline\">x\\oplus y<\/span><\/td><td>两位不同为 1<\/td><td>交换、结合、<span class=\"katex-inline\">x\\oplus x=0<\/span><\/td><\/tr><tr><td>非<\/td><td><span class=\"katex-inline\">\\neg x<\/span><\/td><td>0/1 互换<\/td><td>德摩根律<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>包含关系三等价<\/h2>\n<p><span class=\"katex-inline\">x\\subseteq y\\iff x\\&amp;y=x\\iff x\\mid y=y\\iff x\\&amp;\\bar y=0<\/span>。<\/p>\n<h2>枚举对象计数<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>对象<\/th><th>计数<\/th><th>表示入口<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">n<\/span> 位 n 元组<\/td><td><span class=\"katex-inline\">2^n<\/span><\/td><td>位串<\/td><\/tr><tr><td><span class=\"katex-inline\">n<\/span> 元排列<\/td><td><span class=\"katex-inline\">n!<\/span><\/td><td>字典序 / 邻接交换<\/td><\/tr><tr><td><span class=\"katex-inline\">(s,t)<\/span> 组合<\/td><td><span class=\"katex-inline\">\\binom{n}{t}<\/span>，<span class=\"katex-inline\">n=s+t<\/span><\/td><td>递减元素表 / <span class=\"katex-inline\">t<\/span> 个 1 的位串<\/td><\/tr><tr><td>集合划分<\/td><td>第二类斯特林数方向求和<\/td><td>限制增长串<\/td><\/tr><tr><td>合法括号串<\/td><td>卡特兰数方向<\/td><td>括号串 ↔ 森林<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>排列算法 L 四步<\/h2>\n<ol><li>\nL2 找最右 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span> 的支点 <span class=\"katex-inline\">j<\/span>；找不到终止。\n<\/li><li>\nL3 找后缀中大于 <span class=\"katex-inline\">a_j<\/span> 的最右元素 <span class=\"katex-inline\">l<\/span>，交换。\n<\/li><li>\nL4 反序后缀 <span class=\"katex-inline\">a_{j+1}\\dots a_n<\/span>。\n<\/li><li>\n返回访问。\n<\/ol>\n<h2>格雷码递归<\/h2>\n<p><span class=\"katex-inline\">\\Gamma_0=\\epsilon<\/span>；<span class=\"katex-inline\">\\Gamma_{n+1}=0\\Gamma_n,\\ 1\\Gamma_n^{R}<\/span>；<span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span>；相邻码只差一位。<\/p>\n<h2>两类划分对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th><\/th><th>整数划分<\/th><th>集合划分<\/th><\/tr><\/thead><tbody><tr><td>对象<\/td><td>数值<\/td><td>集合成员<\/td><\/tr><tr><td>表示<\/td><td>非增整数和<\/td><td>不相交非空块<\/td><\/tr><tr><td>去重约定<\/td><td>因子非增<\/td><td>块内递增、块间按最小元递增<\/td><\/tr><tr><td>编码<\/td><td>划分数列<\/td><td>限制增长串 <span class=\"katex-inline\">a_{j+1}\\le1+\\max<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>括号合法性<\/h2>\n<p>前缀 <span class=\"katex-inline\">L-R\\ge0<\/span>；末尾 <span class=\"katex-inline\">L=R=n<\/span>；栈遇 &quot;(&quot; 压、遇 &quot;)&quot; 弹，中途栈空遇 &quot;)&quot; 即非法。<\/p>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/计算机程序设计艺术-卷4A-组合算法-一-高德纳-Donald-E-Knuth-3", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1）", "href": "#/chapter/ch01"}, {"label": "第 7 章 7.1.3–7.1.4：按位运算的技巧与方法、二元决策图", "href": "#/chapter/ch02"}, {"label": "第 7 章 7.2.1.1–7.2.1.2：生成所有 n 元组与所有排列", "href": "#/chapter/ch03"}, {"label": "第 7 章 7.2.1.3–7.2.1.6：生成组合、划分、集合划分与树", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "两值逻辑与布尔代数基本定律", "href": "#/concept/c01"}, {"label": "布尔函数、真值表与两种标准形式", "href": "#/concept/c02"}, {"label": "布尔函数求值网络：函数链、多路复用器与函数计数", "href": "#/concept/c03"}, {"label": "按位运算：与/或/异或、包含关系与常用位技巧", "href": "#/concept/c04"}, {"label": "二元决策图（BDD）：有序、规约与共享子树", "href": "#/concept/c05"}, {"label": "BDD 规模与变量序：坏序爆炸、好序紧凑与沿图采样", "href": "#/concept/c06"}, {"label": "n 元组枚举与格雷码：每步翻转一位的全覆盖序列", "href": "#/concept/c07"}, {"label": "字典序排列生成（Algorithm L）：下一个排列为何不漏不重", "href": "#/concept/c08"}, {"label": "邻接交换排列（Algorithm P）：逆序序列与平滑改变", "href": "#/concept/c09"}, {"label": "组合生成：位串与元素表双表示、字典序算法 L 与 T", "href": "#/concept/c10"}, {"label": "整数划分与集合划分：十二类方式与两类划分的差别", "href": "#/concept/c11"}, {"label": "树的生成：嵌套括号串与括号串算法 P", "href": "#/concept/c12"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1）", "href": "#/quiz/ch01"}, {"label": "测验：第 7 章 7.1.3–7.1.4：按位运算的技巧与方法、二元决策图", "href": "#/quiz/ch02"}, {"label": "测验：第 7 章 7.2.1.1–7.2.1.2：生成所有 n 元组与所有排列", "href": "#/quiz/ch03"}, {"label": "测验：第 7 章 7.2.1.3–7.2.1.6：生成组合、划分、集合划分与树", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.53<\/div><h1>第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1）<\/h1>\n<blockquote>对应原书第 7 章 §7.1.1「布尔代数基础」、§7.1.2「布尔函数求值」（PDF 第 53–92 页；印刷页 = PDF 页 − 15）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出与、或、非三种基本运算在 0/1 上的取值规则，列出交换律、结合律、分配律、吸收律与德摩根律；\n<\/li><li>\n对两个变量的 16 种布尔函数，按真值表读出它属于哪种运算；\n<\/li><li>\n把一个给定真值表写成析取范式（最小项之和）与合取范式（最大项之积）；\n<\/li><li>\n读懂一条布尔函数链：每一步新增结点由两个旧结点经一种运算得到，逐步算出目标函数；\n<\/li><li>\n估算 <span class=\"katex-inline\">n<\/span> 变量布尔函数的总数，说明为什么函数个数随 <span class=\"katex-inline\">2^n<\/span> 指数膨胀。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>组合算法先处理最底层的离散对象：只有 0 和 1 两种状态。布尔代数给出在这两个值上做&quot;逻辑组合&quot;的一整套定律；布尔函数把 <span class=\"katex-inline\">n<\/span> 位输入映射成一位输出，真值表是它的完整说明；求值网络则规定怎样用一串中间运算把函数算出来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：两值逻辑与布尔代数基本定律（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。§7.1.1 从两个二进制位 <span class=\"katex-inline\">x,y<\/span> 出发：16 种可能的函数 <span class=\"katex-inline\">f(x,y)<\/span> 把 0/1 对映射成第三个 0/1 值（PDF 第 53 页）。常用运算取与 <span class=\"katex-inline\">\\wedge<\/span>、或 <span class=\"katex-inline\">\\vee<\/span>、非 <span class=\"katex-inline\">\\neg<\/span>。威廉·杰文斯《Pure Logic》(1864) 扩充布尔演算，给出与对或方向的分配 <span class=\"katex-inline\">(x\\vee y)\\wedge z=(x\\wedge z)\\vee(y\\wedge z)<\/span>；对偶方向 <span class=\"katex-inline\">(x\\wedge y)\\vee z=(x\\vee z)\\wedge(y\\vee z)<\/span> 由查尔斯·皮尔斯 (1867) 引入。与普通算术不同，布尔代数里同时存在两个分配律：<span class=\"katex-inline\">\\wedge<\/span> 对 <span class=\"katex-inline\">\\vee<\/span> 分配，<span class=\"katex-inline\">\\vee<\/span> 对 <span class=\"katex-inline\">\\wedge<\/span> 也分配；此外还有吸收律与德摩根律。<\/p>\n<h3>2. 概念 2：布尔函数、真值表与两种标准形式（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。一个 <span class=\"katex-inline\">n<\/span> 变量布尔函数对应一张表：<span class=\"katex-inline\">2^n<\/span> 个输入赋值各占一行，函数值列决定函数本身。函数值为 1 的那些行对应最小项，把最小项取或即得析取范式；函数值为 0 的行对应最大项，取与即得合取范式。两变量情形共有 <span class=\"katex-inline\">2^{2^2}=16<\/span> 个不同函数，表 1 逐一列出名称与新旧记号（PDF 第 54 页）。<\/p>\n<h3>3. 概念 3：求值网络、函数链与函数计数（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。§7.1.2 把求值过程描述成一条链：先有 <span class=\"katex-inline\">x_1,\\dots,x_n<\/span>，再逐步补充 <span class=\"katex-inline\">(x_{n+1},\\dots,x_{n+r})<\/span>，每个新结点 <span class=\"katex-inline\">x_i=x_j\\circ x_k<\/span>，其中 <span class=\"katex-inline\">j,k&lt;i<\/span>，<span class=\"katex-inline\">\\circ<\/span> 是 §7.1.1 的 16 种运算之一（PDF 第 93 页）。多路复用器函数在输入 <span class=\"katex-inline\">x_j<\/span> 为 1 时取 <span class=\"katex-inline\">x_k<\/span>，为 0 时取另一路；链的长度与每步选用的运算类型，决定求值网络的规模代价。<\/p>\n<h2>推导一（证明）：德摩根律怎样从真值表核验<\/h2>\n<p>下面证明分四种赋值逐项核验，每种代入两侧取值。 要证 <span class=\"katex-inline\">\\neg(x\\wedge y)=\\neg x\\vee\\neg y<\/span>，把 <span class=\"katex-inline\">x,y<\/span> 的四种赋值逐一代入两侧。<\/p>\n<ol><li>\n<span class=\"katex-inline\">x=0,y=0<\/span>：左侧 <span class=\"katex-inline\">\\neg(0\\wedge0)=\\neg0=1<\/span>；右侧 <span class=\"katex-inline\">\\neg0\\vee\\neg0=1\\vee1=1<\/span>，两侧相等。\n<\/li><li>\n<span class=\"katex-inline\">x=0,y=1<\/span>：左侧 <span class=\"katex-inline\">\\neg(0\\wedge1)=\\neg0=1<\/span>；右侧 <span class=\"katex-inline\">\\neg0\\vee\\neg1=1\\vee0=1<\/span>，两侧相等。\n<\/li><li>\n<span class=\"katex-inline\">x=1,y=0<\/span>：左侧 <span class=\"katex-inline\">\\neg(1\\wedge0)=\\neg0=1<\/span>；右侧 <span class=\"katex-inline\">\\neg1\\vee\\neg0=0\\vee1=1<\/span>，两侧相等。\n<\/li><li>\n<span class=\"katex-inline\">x=1,y=1<\/span>：左侧 <span class=\"katex-inline\">\\neg(1\\wedge1)=\\neg1=0<\/span>；右侧 <span class=\"katex-inline\">\\neg1\\vee\\neg1=0\\vee0=0<\/span>，两侧相等。\n<\/ol>\n<p>四种赋值覆盖全部输入，两侧每行取值相同，等式成立。另一条 <span class=\"katex-inline\">\\neg(x\\vee y)=\\neg x\\wedge\\neg y<\/span> 用同样方式核验。这条定律的用途：把一层取反整体翻进括号时，与、或互换，每个变量取反。<\/p>\n<h2>推导二（推演）：一条三变量函数链的手算<\/h2>\n<p>参照 §7.1.2 的链结构。输入记 <span class=\"katex-inline\">x_1,x_2,x_3<\/span>，构造两条链计算多路复用器方向的函数：<\/p>\n<pre><code>x4 = x1 ∧ x2\nx5 = x1 ∧ x3\nx6 = x4 ∨ x5<\/code><\/pre>\n<p>这次推演按结点编号顺序逐步展开。逐结点算：<\/p>\n<ol><li>\n<span class=\"katex-inline\">x_4=x_1\\wedge x_2<\/span>：只有 <span class=\"katex-inline\">x_1=x_2=1<\/span> 时为 1，否则为 0。\n<\/li><li>\n<span class=\"katex-inline\">x_5=x_1\\wedge x_3<\/span>：只有 <span class=\"katex-inline\">x_1=x_3=1<\/span> 时为 1，否则为 0。\n<\/li><li>\n<span class=\"katex-inline\">x_6=x_4\\vee x_5<\/span>：<span class=\"katex-inline\">x_4<\/span>、<span class=\"katex-inline\">x_5<\/span> 任一为 1 即为 1。\n<\/ol>\n<p>取赋值 <span class=\"katex-inline\">x_1=1,x_2=0,x_3=1<\/span>：<span class=\"katex-inline\">x_4=1\\wedge0=0<\/span>，<span class=\"katex-inline\">x_5=1\\wedge1=1<\/span>，<span class=\"katex-inline\">x_6=0\\vee1=1<\/span>。链上每个新结点只引用更早编号的旧结点，编号顺序保证求值时被引用者已经算出。<\/p>\n<h2>反事实：改掉前提会怎样<\/h2>\n<ul><li>\n<strong>去掉第二个分配律<\/strong>：普通算术里只有乘法对加法分配，加法不对乘法分配。若把这套直觉带进布尔代数，会漏掉 <span class=\"katex-inline\">\\vee<\/span> 对 <span class=\"katex-inline\">\\wedge<\/span> 的分配；化简含或项与与项交错的表达式时，该展开的地方展不开，范式转换就会卡住。两条分配律同时成立是布尔代数区别于环域运算的关键。\n<\/li><li>\n<strong>允许链结点引用未来结点<\/strong>：若规定 <span class=\"katex-inline\">x_i=x_j\\circ x_k<\/span> 时允许 <span class=\"katex-inline\">j<\/span> 或 <span class=\"katex-inline\">k<\/span> 大于 <span class=\"katex-inline\">i<\/span>，求值顺序就成了循环依赖——算 <span class=\"katex-inline\">x_i<\/span> 要先有 <span class=\"katex-inline\">x_j<\/span>，算 <span class=\"katex-inline\">x_j<\/span> 又回到 <span class=\"katex-inline\">x_i<\/span>，网络不再是有向无环结构，手算与机器求值都无法定序。§7.1.2 用 <span class=\"katex-inline\">j,k&lt;i<\/span> 这条编号约束把依赖方向钉死。\n<\/li><li>\n<strong>用一张未填全的真值表定义函数<\/strong>：只标出两三个赋值的输出就声称函数已确定，其余行被默认成任意值；不同补法会得到不同函数，化简出来的范式也不同。真值表必须覆盖全部 <span class=\"katex-inline\">2^n<\/span> 行才算定义完整。\n<\/ul>\n<h2>与后续章节的衔接<\/h2>\n<p>本章把&quot;一位逻辑值&quot;的表示与运算讲清，是 §7.1.3 按位运算（把位规则并行施加到整串位上）和 §7.1.4 二元决策图（沿变量分支表示同一函数）的地基。求值链的&quot;逐步生成新结点&quot;思路，与第 7.2 节组合对象逐个生成的结构相通：都是在已有对象上按规则补充新对象。<\/p>", "ch02": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.124<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1）<\/a><\/span><\/div><h1>第 7 章 7.1.3–7.1.4：按位运算的技巧与方法、二元决策图<\/h1>\n<blockquote>对应原书第 7 章 §7.1.3「按位运算的技巧与方法」、§7.1.4「二元决策图」（PDF 第 124–233 页；印刷页 = PDF 页 − 15）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01 布尔代数与布尔函数\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 <span class=\"katex-inline\">x\\&amp;y<\/span>、<span class=\"katex-inline\">x\\mid y<\/span>、<span class=\"katex-inline\">x\\oplus y<\/span> 在二进制逐位上的取值规则，说明三条基本运算各自继承的布尔定律；\n<\/li><li>\n用三种等价写法判断 <span class=\"katex-inline\">x\\subseteq y<\/span>（<span class=\"katex-inline\">x\\&amp;y=x<\/span>、<span class=\"katex-inline\">x\\mid y=y<\/span>、<span class=\"katex-inline\">x\\&amp;\\bar y=0<\/span>）；\n<\/li><li>\n描述一个 BDD 结点的三个字段（变量 <span class=\"katex-inline\">V<\/span>、LO、HI），说清有序与规约两条约束；\n<\/li><li>\n沿 BDD 一条路径读出对应赋值下的函数值；\n<\/li><li>\n解释变量序怎样影响 BDD 规模，理解同一个函数在好序下紧凑、坏序下膨胀。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>按位运算把布尔规则一次施加到一整串位上，是组合算法里筛选集合、提取标志位的基础工具；二元决策图则把布尔函数画成一张共享子树的有向无环图，沿分支取值即可求值，图的规模直接决定这种表示能不能用。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 4：按位运算与包含关系（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。§7.1.3 从整数的二进制记法定义逐位运算：<span class=\"katex-inline\">x\\&amp;y=z<\/span> 等价于每位 <span class=\"katex-inline\">x_k\\wedge y_k=z_k<\/span>，或、异或按相同方式（PDF 第 125 页）。与、或在每位上保持幂等、交换、结合、吸收；异或每位独立，继承交换与结合律，还满足 <span class=\"katex-inline\">x\\oplus x=0<\/span>。<span class=\"katex-inline\">x\\subseteq y<\/span> 定义为 <span class=\"katex-inline\">x<\/span> 每个 1 位在 <span class=\"katex-inline\">y<\/span> 中也是 1，三种写法互相等价。<\/p>\n<h3>2. 概念 5：BDD 的结构约束（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。§7.1.4 把函数表示成决策图：根结点到汇结点 <span class=\"katex-inline\">\\boxed{0}<\/span>、<span class=\"katex-inline\">\\boxed{1}<\/span> 各一条分支；内部结点存变量 <span class=\"katex-inline\">V<\/span>，LO 指变量取 0 的后继，HI 指取 1 的后继（PDF 第 184 页）。有序要求同一条路径上变量下标严格递增；规约要求不浪费空间——相同三元值 <span class=\"katex-inline\">(V,LO,HI)<\/span> 只保留一份，LO 与 HI 不允许相等，每个结点都能从根到达。<\/p>\n<h3>3. 概念 6：规模、变量序与沿图采样（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。同一个布尔函数换一个变量次序，BDD 规模可以差出量级：好序下结点紧凑，坏序下路径交错、子树无法共享，结点数指数膨胀。反过来，沿 BDD 分支计数可以估算满足条件的赋值个数，也可以按比例在图上均匀随机采样一个满足条件的组合对象（PDF 第 188 页）。<\/p>\n<h2>推导一（推演）：位级包含关系的三种写法互相等价<\/h2>\n<p>下面证明三种写法回到同一条逐位条件。设 <span class=\"katex-inline\">x<\/span>、<span class=\"katex-inline\">y<\/span> 为二进制整数，按位记法每位为 <span class=\"katex-inline\">x_k,y_k<\/span>。<\/p>\n<ol><li>\n定义方向：<span class=\"katex-inline\">x\\subseteq y<\/span> 指对每个 <span class=\"katex-inline\">k<\/span>，<span class=\"katex-inline\">x_k=1\\Rightarrow y_k=1<\/span>。\n<\/li><li>\n证 <span class=\"katex-inline\">x\\&amp;y=x<\/span>：若 <span class=\"katex-inline\">x_k=1<\/span>，由定义 <span class=\"katex-inline\">y_k=1<\/span>，则 <span class=\"katex-inline\">x_k\\wedge y_k=1<\/span>；若 <span class=\"katex-inline\">x_k=0<\/span>，<span class=\"katex-inline\">x_k\\wedge y_k=0<\/span>。每位结果都等于 <span class=\"katex-inline\">x_k<\/span>，所以 <span class=\"katex-inline\">x\\&amp;y=x<\/span>。\n<\/li><li>\n证 <span class=\"katex-inline\">x\\mid y=y<\/span>：若 <span class=\"katex-inline\">y_k=1<\/span>，<span class=\"katex-inline\">x_k\\vee y_k=1=y_k<\/span>；若 <span class=\"katex-inline\">y_k=0<\/span>，由定义 <span class=\"katex-inline\">x_k=0<\/span>，<span class=\"katex-inline\">0\\vee0=0=y_k<\/span>。每位结果都等于 <span class=\"katex-inline\">y_k<\/span>，所以 <span class=\"katex-inline\">x\\mid y=y<\/span>。\n<\/li><li>\n证 <span class=\"katex-inline\">x\\&amp;\\bar y=0<\/span>：反着看，若某一位 <span class=\"katex-inline\">x_k=1<\/span> 而 <span class=\"katex-inline\">y_k=0<\/span>，则 <span class=\"katex-inline\">\\bar y_k=1<\/span>，<span class=\"katex-inline\">x_k\\wedge\\bar y_k=1<\/span>，与 <span class=\"katex-inline\">x\\&amp;\\bar y=0<\/span> 矛盾；不存在这样的位，正对应定义里&quot;<span class=\"katex-inline\">x<\/span> 的 1 位都在 <span class=\"katex-inline\">y<\/span> 中&quot;。\n<\/ol>\n<p>三种写法都回到同一条逐位条件，可互相替换使用。<\/p>\n<h2>推导二（证明方向）：BDD 求值路径与函数值对应<\/h2>\n<p>这次推演沿分支收缩顺序展开。对一个有序且规约的 BDD，给定赋值 <span class=\"katex-inline\">x_1,\\dots,x_n<\/span>：<\/p>\n<ol><li>\n从根结点出发；结点变量为 <span class=\"katex-inline\">V=j<\/span>。\n<\/li><li>\n若 <span class=\"katex-inline\">x_j=0<\/span>，沿 LO 分支走；若 <span class=\"katex-inline\">x_j=1<\/span>，沿 HI 分支走。\n<\/li><li>\n到达汇结点 <span class=\"katex-inline\">\\boxed{0}<\/span> 或 <span class=\"katex-inline\">\\boxed{1}<\/span>，该汇结点的值就是函数在这组赋值下的输出。\n<\/ol>\n<p>正确性依据：LO 分支代表&quot;<span class=\"katex-inline\">x_j=0<\/span> 时剩余变量对应的子函数&quot;，HI 分支代表&quot;<span class=\"katex-inline\">x_j=1<\/span> 时的子函数&quot;；每条分支把一个变量固定取值后，问题收缩成更短变量集上的子函数。有序性保证走到的下一个变量尚未固定，规约性保证相同子函数只存一份、不会走到 LO=HI 的冗余结点。走完 <span class=\"katex-inline\">n<\/span> 个变量后必达汇结点，路径长度不超过变量数。<\/p>\n<h2>反事实：改掉前提会怎样<\/h2>\n<ul><li>\n<strong>去掉有序约束<\/strong>：若允许同一条路径上变量下标回跳，同一个变量会被询问两次。第二次询问时取值已经固定，第二次分支要么恒走一侧、要么两侧重复，图里出现冗余询问；不同路径还可能对同一变量给出矛盾结论。有序约束把路径上的变量次序钉死，避免这类重复。\n<\/li><li>\n<strong>取消规约、保留相同子树多份拷贝<\/strong>：两个三元值完全相同的结点各自保留，共享关系断裂；函数稍大，重复子树就把结点数成倍放大，BDD 失去&quot;紧凑表示&quot;的意义。规约正是靠合并相同子树压住规模。\n<\/li><li>\n<strong>把变量序固定成一种而不评估好坏<\/strong>：变量序选错时，原本可共享的子树被路径拆散，结点数从线性量级滑向指数量级；直接拿默认次序建图，可能在中等规模函数上就超出存储。选序是 BDD 表示能否落地的前提步骤，不是可有可无的优化。\n<\/ul>\n<h2>与后续章节的衔接<\/h2>\n<p>位运算在第 7.2 节成为枚举工具：n 元组直接用位串表示，组合用&quot;恰含 <span class=\"katex-inline\">t<\/span> 个 1 的位串&quot;刻画。BDD 的&quot;沿分支计数与采样&quot;思想，也出现在 §7.2.1.6 从决策图生成满足条件的组合对象这一路径上。本章的包含关系 <span class=\"katex-inline\">x\\subseteq y<\/span> 对应集合子集判断，是组合枚举里筛选候选对象的基本动作。<\/p>", "ch03": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.249<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 7 章 7.1.1–7.1.2：布尔代数基础与布尔函数求值（0 与 1）<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 7 章 7.1.3–7.1.4：按位运算的技巧与方法、二元决策图<\/a><\/span><\/div><h1>第 7 章 7.2.1.1–7.2.1.2：生成所有 n 元组与所有排列<\/h1>\n<blockquote>对应原书第 7 章 §7.2.1.1「生成所有 n 元组」、§7.2.1.2「生成所有排列」（PDF 第 249–308 页；印刷页 = PDF 页 − 15）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01 布尔函数，ch02 位运算与决策结构\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明 <span class=\"katex-inline\">n<\/span> 位二进制 n 元组共有 <span class=\"katex-inline\">2^n<\/span> 个，混合进制下按各分量上限计数；\n<\/li><li>\n按递归规则 <span class=\"katex-inline\">\\Gamma_{n+1}=0\\Gamma_n,\\ 1\\Gamma_n^{R}<\/span> 画出 <span class=\"katex-inline\">n=3<\/span> 的格雷码序列，指出相邻码只差一位；\n<\/li><li>\n用公式 <span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span> 把二进制序号转成格雷码；\n<\/li><li>\n走通字典序排列 Algorithm L 的四个步骤，对给定排列求出下一个字典序排列；\n<\/li><li>\n写出排列的逆序序列 <span class=\"katex-inline\">c_j<\/span>，说明邻接交换算法 P 怎样每次只交换相邻两项生成全部 <span class=\"katex-inline\">n!<\/span> 个排列。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>枚举组合对象要回答三个问题：总数是多少、按什么次序逐个产出、相邻两次产出之间改动多大。n 元组最基础，格雷码用&quot;每步翻一位&quot;的低改动次序重排 <span class=\"katex-inline\">2^n<\/span> 个位串；排列枚举有两条路线：字典序按词典大小逐个推进，邻接交换每次只换相邻两项。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 7：n 元组与格雷码（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。§7.2.1.1 先从 <span class=\"katex-inline\">n<\/span> 位二进制元组入手：<span class=\"katex-inline\">2^n<\/span> 个位串等价于访问所有 <span class=\"katex-inline\">\\{x_1,\\dots,x_n\\}<\/span>，<span class=\"katex-inline\">x_j<\/span> 在串中当且仅当 <span class=\"katex-inline\">a_j=1<\/span>（PDF 第 249 页）。直接从 <span class=\"katex-inline\">(0\\dots0)_2=0<\/span> 数到 <span class=\"katex-inline\">(1\\dots1)_2=2^n-1<\/span> 即可全覆盖；格雷码则把这个序列重排，使相邻两个码只有一位不同。递归构造 <span class=\"katex-inline\">\\Gamma_0=\\epsilon<\/span>，<span class=\"katex-inline\">\\Gamma_{n+1}=0\\Gamma_n<\/span> 后接 <span class=\"katex-inline\">1\\Gamma_n^{R}<\/span>，其中 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 是 <span class=\"katex-inline\">\\Gamma_n<\/span> 的逆序（PDF 第 251 页）。<\/p>\n<h3>2. 概念 8：字典序排列 Algorithm L（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。§7.2.1.2 从非减初始排列 <span class=\"katex-inline\">a_1\\le a_2\\le\\cdots\\le a_n<\/span> 出发，算法 L 依次产出全部字典序排列（PDF 第 280–281 页）。L2 找最右满足 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span> 的下标 <span class=\"katex-inline\">j<\/span>；L3 找最右满足 <span class=\"katex-inline\">a_l&gt;a_j<\/span> 可交换的最小元素；L4 交换后把 <span class=\"katex-inline\">a_{j+1}\\dots a_n<\/span> 反序。字典序的&quot;下一个&quot;由这三步确定，全过程不漏不重。<\/p>\n<h3>3. 概念 9：邻接交换 Algorithm P 与逆序序列（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。字典序排列相邻两次产出常需搬动多项；邻接交换路线追求每次只换相邻两项。算法 P 借助逆序序列 <span class=\"katex-inline\">c_j<\/span>（<span class=\"katex-inline\">0\\le c_j&lt;j<\/span>）与方向位 <span class=\"katex-inline\">o_j<\/span>：<span class=\"katex-inline\">c_j<\/span> 是比 <span class=\"katex-inline\">j<\/span> 小且排在 <span class=\"katex-inline\">j<\/span> 右边的元素数目，遍历所有合法逆序序列即对应全部排列（PDF 第 282–283 页）。P1 置初值，P2 访问当前排列，P3–P7 调整 <span class=\"katex-inline\">c_j<\/span> 与方向位并完成一次相邻交换。<\/p>\n<h2>推导一（证明方向）：格雷码递归构造为何覆盖全部 <span class=\"katex-inline\">2^n<\/span> 个码且相邻只差一位<\/h2>\n<p>下面证明覆盖性与相邻性质都按归纳成立。归纳基础：<span class=\"katex-inline\">\\Gamma_0=\\epsilon<\/span> 只有空串，覆盖 <span class=\"katex-inline\">2^0=1<\/span> 个码。<\/p>\n<p>归纳假设：<span class=\"katex-inline\">\\Gamma_n<\/span> 包含全部 <span class=\"katex-inline\">2^n<\/span> 个 <span class=\"katex-inline\">n<\/span> 位串，且相邻两项只差一位，首尾也满足循环性质。<\/p>\n<p>构造 <span class=\"katex-inline\">\\Gamma_{n+1}=0\\Gamma_n,\\ 1\\Gamma_n^{R}<\/span>：<\/p>\n<ol><li>\n覆盖性：前半每个码前加 0，后半每个码前加 1；<span class=\"katex-inline\">\\Gamma_n<\/span> 覆盖全部 <span class=\"katex-inline\">n<\/span> 位串，补上前缀后覆盖全部 <span class=\"katex-inline\">n+1<\/span> 位串，前后两半前缀不同，互不重复。\n<\/li><li>\n相邻差一位：<span class=\"katex-inline\">\\Gamma_n<\/span> 内部相邻只差一位，前半内部、后半内部各自成立；<span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 只是把序列反转，相邻关系不变。接缝处前半末位为 <span class=\"katex-inline\">0\\Gamma_n<\/span> 的最后一项，后半首项为 <span class=\"katex-inline\">1\\Gamma_n^{R}<\/span> 的第一项，而 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 的首项正是 <span class=\"katex-inline\">\\Gamma_n<\/span> 的末项，二者后 <span class=\"katex-inline\">n<\/span> 位相同，只有前缀位 0 与 1 不同，仍只差一位。\n<\/ol>\n<p>归纳到 <span class=\"katex-inline\">n+1<\/span>，结论成立。<\/p>\n<h2>推导二（推演）：Algorithm L 手算一个完整片段<\/h2>\n<p>这次推演走完整条字典序链路。取 <span class=\"katex-inline\">n=3<\/span>，初始排列 <span class=\"katex-inline\">123<\/span>。算法 L 逐步推进：<\/p>\n<ol><li>\n<span class=\"katex-inline\">123<\/span>：L2 找最右 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span>，<span class=\"katex-inline\">j=2<\/span>（<span class=\"katex-inline\">2&lt;3<\/span>）；L3 在右侧找大于 <span class=\"katex-inline\">a_2=2<\/span> 的最小元素，<span class=\"katex-inline\">l=3<\/span>；交换得 <span class=\"katex-inline\">132<\/span>；右侧反序（长度 1，不变）。\n<\/li><li>\n<span class=\"katex-inline\">132<\/span>：L2 从右看，<span class=\"katex-inline\">3&gt;2<\/span> 不满足，回退到 <span class=\"katex-inline\">1&lt;3<\/span>，<span class=\"katex-inline\">j=1<\/span>；L3 在 <span class=\"katex-inline\">\\{3,2\\}<\/span> 中找大于 <span class=\"katex-inline\">a_1=1<\/span> 的最小元素，<span class=\"katex-inline\">l=3<\/span>（值 2）；交换 <span class=\"katex-inline\">a_1<\/span> 与 <span class=\"katex-inline\">a_3<\/span> 得 <span class=\"katex-inline\">231<\/span>；把位置 2–3 反序得 <span class=\"katex-inline\">213<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">213<\/span>：<span class=\"katex-inline\">j=2<\/span>（<span class=\"katex-inline\">1&lt;3<\/span>），交换位置 2、3 得 <span class=\"katex-inline\">231<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">231<\/span>：<span class=\"katex-inline\">3&gt;1<\/span> 不满足，回退 <span class=\"katex-inline\">2&lt;3<\/span>，<span class=\"katex-inline\">j=1<\/span>；右侧 <span class=\"katex-inline\">\\{3,1\\}<\/span> 中大于 2 的最小元素为 <span class=\"katex-inline\">l=3<\/span>（值 3）；交换得 <span class=\"katex-inline\">321<\/span>；位置 2–3 反序得 <span class=\"katex-inline\">312<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">312<\/span>：<span class=\"katex-inline\">1&lt;2<\/span>，<span class=\"katex-inline\">j=2<\/span>，交换得 <span class=\"katex-inline\">321<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">321<\/span>：L2 找不到 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span>，算法终止。\n<\/ol>\n<p>产出序列 <span class=\"katex-inline\">123,132,213,231,312,321<\/span>，共 <span class=\"katex-inline\">3!=6<\/span> 个，与计数一致。<\/p>\n<h2>反事实：改掉前提会怎样<\/h2>\n<ul><li>\n<strong>把递归构造后半段写成 <span class=\"katex-inline\">1\\Gamma_n<\/span> 而不反转<\/strong>：接缝处前半末位是 <span class=\"katex-inline\">0<\/span> 接 <span class=\"katex-inline\">\\Gamma_n<\/span> 末项，后半首项是 <span class=\"katex-inline\">1<\/span> 接 <span class=\"katex-inline\">\\Gamma_n<\/span> 首项；末项与首项后 <span class=\"katex-inline\">n<\/span> 位不同，接缝跨越多位，格雷码&quot;相邻只差一位&quot;的性质断裂。反转 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 正是为了让接缝两端后 <span class=\"katex-inline\">n<\/span> 位相同。\n<\/li><li>\n<strong>字典序生成时交换后不反序右侧段<\/strong>：L4 要求把 <span class=\"katex-inline\">a_{j+1}\\dots a_n<\/span> 反序。这段在 L2 之后本身是非递增的；若只交换不改序，后续排列仍停留在较大的后缀组合里，字典序顺序被打乱，可能产出比当前排列还小的后继，重复与漏排随之出现。\n<\/li><li>\n<strong>邻接交换允许交换任意两项<\/strong>：若放宽成任意位置交换，每次改动的位数不固定，丢失&quot;平滑改变&quot;的价值；算法 P 存在的理由就是相邻交换这一约束，逆序序列与方向位机制都围绕相邻位置设计。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>n 元组是位串表示的源头：§7.2.1.3 组合直接用&quot;恰含 <span class=\"katex-inline\">t<\/span> 个 1 的位串&quot;枚举。排列生成的字典序思路推广到组合即 §7.2.1.3 的算法 L、T；邻接交换的低改动思想在组合的&quot;旋转门&quot;顺序中也有对应。本章的计数 <span class=\"katex-inline\">2^n<\/span> 与 <span class=\"katex-inline\">n!<\/span> 是第 7.2 节其余对象计数的对照基准。<\/p>", "ch04": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.309<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 7 章 7.2.1.1–7.2.1.2：生成所有 n 元组与所有排列<\/a><\/span><\/div><h1>第 7 章 7.2.1.3–7.2.1.6：生成组合、划分、集合划分与树<\/h1>\n<blockquote>对应原书第 7 章 §7.2.1.3「生成所有组合」、§7.2.1.4「生成所有划分」、§7.2.1.5「生成所有集合划分」、§7.2.1.6「生成所有树」（PDF 第 309–418 页；印刷页 = PDF 页 − 15）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch03 n 元组与排列生成\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n在元素表 <span class=\"katex-inline\">c_t&gt;\\cdots&gt;c_1<\/span> 与位串 <span class=\"katex-inline\">a_{n-1}\\dots a_0<\/span> 两种表示之间互相转换一个 <span class=\"katex-inline\">(s,t)<\/span> 组合；\n<\/li><li>\n走通组合字典序算法 L 的初始化、访问、找最右可增下标步骤，说出算法 T 的简化路径；\n<\/li><li>\n区分整数划分（把 <span class=\"katex-inline\">n<\/span> 拆成非增整数和）与集合划分（把集合拆成互不相交的块）；\n<\/li><li>\n复述十二类方式中球与桶带不带标记对应的组合对象类别；\n<\/li><li>\n把一个括号串还原成森林，说出括号串算法 P 的初始化、配对检查与追加步骤。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>排列解决&quot;全排&quot;问题，组合解决&quot;选子集&quot;问题；划分沿两条不同路线展开：整数划分关心数的拆分，集合划分关心集合的分块；树则通过嵌套括号串与森林一一对应，生成合法括号串就生成了对应的树结构。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 10：组合的双表示与字典序生成（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。§7.2.1.3 把 <span class=\"katex-inline\">(s,t)<\/span> 组合写成 <span class=\"katex-inline\">n=s+t<\/span> 个对象中选 <span class=\"katex-inline\">t<\/span> 个的子集（PDF 第 309 页）。两种表示并存：元素表递减列 <span class=\"katex-inline\">c_t&gt;\\cdots&gt;c_1\\ge0<\/span>；二进制位串 <span class=\"katex-inline\">a_{n-1}\\dots a_0<\/span>，恰含 <span class=\"katex-inline\">t<\/span> 个 1，1 的位置对应选中元素。算法 L 按字典序访问 <span class=\"katex-inline\">c_t\\dots c_1<\/span>；算法 T 是执行速度更快的改进版，先判最简单情形（PDF 第 312 页）。<\/p>\n<h3>2. 概念 11：整数划分与集合划分（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c11.md\" target=\"_blank\" rel=\"noopener\">概念 c11<\/a>。§7.2.1.4 表 1「十二类方式」按球、桶各自带不带标记，结合每桶球数无限制、至少一个、至多一个等条件，对应 n 元组、n 排列、子集、多重组合、n 划分、r 部分划分、r 部分有序划分、放球入笼等类别（PDF 第 339 页）；该页题辞引乔治·安德鲁斯《The Theory of Partitions》(1976)。整数划分把 <span class=\"katex-inline\">n<\/span> 写成 <span class=\"katex-inline\">a_1\\ge a_2\\ge\\cdots<\/span> 的非增正整数之和；集合划分把集合拆成互不相交的非空块，块内排序、块间按最小元素递增排序以标准化表示（PDF 第 360 页）。<\/p>\n<h3>3. 概念 12：括号串与树的生成（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c12.md\" target=\"_blank\" rel=\"noopener\">概念 c12<\/a>。§7.2.1.6 用嵌套括号串对应森林：给定含 <span class=\"katex-inline\">n<\/span> 个左括号与 <span class=\"katex-inline\">n<\/span> 个右括号的串，第 <span class=\"katex-inline\">k<\/span> 个 &quot;(&quot; 与对应的 &quot;)&quot; 配对，括号嵌套关系画出树（PDF 第 381 页）。括号串算法 P 从 <span class=\"katex-inline\">a_{2k-1}=<\/span> &quot;(&quot;、<span class=\"katex-inline\">a_{2k}=<\/span> &quot;)&quot; 的哨兵形式出发，按字典序生成所有合法括号串；P4 找可增下标，P5 追加 &quot;(&quot; 并重置后缀，简单情形直接处理。<\/p>\n<h2>推导一（推演）：组合两种表示互相转换<\/h2>\n<p>下面证明两种表示一一对应。取 <span class=\"katex-inline\">n=5<\/span>，<span class=\"katex-inline\">t=3<\/span>，元素表 <span class=\"katex-inline\">\\{2,3,4\\}<\/span>（下标 <span class=\"katex-inline\">0\\dots4<\/span>）。<\/p>\n<ol><li>\n元素表到位串：位 <span class=\"katex-inline\">4,3,2<\/span> 为 1，位 <span class=\"katex-inline\">1,0<\/span> 为 0，位串 <span class=\"katex-inline\">a_4a_3a_2a_1a_0=11100<\/span>。\n<\/li><li>\n位串回元素表：从左到右扫，1 所在下标依次为 <span class=\"katex-inline\">4,3,2<\/span>，递减列 <span class=\"katex-inline\">c_3=4,c_2=3,c_1=2<\/span>。\n<\/li><li>\n计数核对：<span class=\"katex-inline\">\\binom53=10<\/span>，即这样的位串与元素表各有 10 个，两种表示一一对应。\n<\/ol>\n<p>算法 L 找下一个组合时，先定位最右还能增大的 <span class=\"katex-inline\">c_j<\/span>，把 <span class=\"katex-inline\">c_j<\/span> 加 1，再把左侧元素重设为它们的最小可能值；位串视角下这等价于把最右可移动的 1 向左位邻位推进。<\/p>\n<h2>推导二（证明方向）：括号串与森林的对应保持<\/h2>\n<p>这次推演按括号扫描顺序还原森林。1. 每个左括号 &quot;(&quot; 对应一个新结点开始，右括号 &quot;)&quot; 对应该结点结束；嵌套的 &quot;(&quot; 对应该结点的子女，并列的 &quot;(&quot; 对应兄弟或下一棵根。<\/p>\n<ol><li>\n合法性约束：扫描过程中已出现的左括号数不少于右括号数；到末尾左右括号数相等。这对应森林里每个结点都有完整的开始与结束，不存在悬空的右括号。\n<\/li><li>\n反向还原：沿串外围爬行，遇到 &quot;(&quot; 见到结点的左边，遇到 &quot;)&quot; 见到右边；括号匹配关系直接给出父子与兄弟连接，串与森林一一对应。\n<\/ol>\n<h2>反事实：改掉前提会怎样<\/h2>\n<ul><li>\n<strong>集合划分允许块相交<\/strong>：若两个块共享元素，元素归属出现两个类，块之间不再互不相交；标准化排序无法确定块的归属，枚举时同一集合会被反复计入多种分块方式，计数翻倍且重复。互不相交是集合划分区别于子集族的硬约束。\n<\/li><li>\n<strong>整数划分不要求非增次序<\/strong>：若把 <span class=\"katex-inline\">3+2+1<\/span>、<span class=\"katex-inline\">2+3+1<\/span> 当成不同划分，同一个数的拆分被按排列重复计数；非增约定把因子次序吸收掉，划分只关心哪些数相加，不关心摆放顺序。\n<\/li><li>\n<strong>括号串不做前缀计数检查<\/strong>：允许前缀里右括号多于左括号，会出现先闭合尚未开始的结点；还原出的森林存在悬空边，串与树的对应断裂。前缀非负是合法性的第一道闸门。\n<\/ul>\n<h2>与全书结构的衔接<\/h2>\n<p>本章是卷 4A 第一部分枚举路线的收口：n 元组（ch03）给出位串基础，排列给出全排路线，本章把子集、划分、树逐一接上。§7.2.1.7 的历史与扩展文献把这些算法放回组合生成的发展脉络；卷 4B 及后续卷目在此基础上展开更复杂的组合对象与优化问题。本章的计数与平均代价公式，承接 ch03 对枚举总量的估算思路。<\/p>", "c01": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.53<\/div><h1>两值逻辑与布尔代数基本定律<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书 §7.1.1，PDF 第 53–54 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p>组合算法处理的对象先落在最底层的离散状态：一位只能取 0 或 1。困难在于，把多位 0/1 组合起来时，需要一套确定的改写规则，否则同一组位状态可以被写成不同表达式，化简与求值都没有共同依据。布尔代数给出在 0、1 两个值上定义与、或、非的代数结构，用一组定律约束表达式之间的等价关系；后面按位运算、真值表、BDD 都建立在这套规则之上。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>两值集合<\/strong>：取值范围只有 <span class=\"katex-inline\">\\{0,1\\}<\/span>，0 对应假、1 对应真；不存在第三值。<\/p>\n<p><strong>三种基本运算<\/strong>：<\/p>\n<ul><li>\n与 <span class=\"katex-inline\">x\\wedge y<\/span>（记作 <span class=\"katex-inline\">x\\&amp;y<\/span> 或 <span class=\"katex-inline\">xy<\/span>）：<span class=\"katex-inline\">x,y<\/span> 都为 1 时结果为 1，否则为 0；真值表 <span class=\"katex-inline\">1100<\/span> 行取值依次为 <span class=\"katex-inline\">0,0,0,1<\/span>。\n<\/li><li>\n或 <span class=\"katex-inline\">x\\vee y<\/span>（记作 <span class=\"katex-inline\">x\\mid y<\/span>）：<span class=\"katex-inline\">x,y<\/span> 至少一个为 1 时结果为 1；真值表取值 <span class=\"katex-inline\">0,1,1,1<\/span>。\n<\/li><li>\n非 <span class=\"katex-inline\">\\neg x<\/span>：把 0 变 1、把 1 变 0。\n<\/ul>\n<p><strong>基本定律<\/strong>（每位独立成立）：<\/p>\n<ol><li>\n交换律：<span class=\"katex-inline\">x\\wedge y=y\\wedge x<\/span>，<span class=\"katex-inline\">x\\vee y=y\\vee x<\/span>。\n<\/li><li>\n结合律：<span class=\"katex-inline\">(x\\wedge y)\\wedge z=x\\wedge(y\\wedge z)<\/span>，或运算按相同方式成立。\n<\/li><li>\n两个分配律：<span class=\"katex-inline\">(x\\vee y)\\wedge z=(x\\wedge z)\\vee(y\\wedge z)<\/span>；<span class=\"katex-inline\">(x\\wedge y)\\vee z=(x\\vee z)\\wedge(y\\vee z)<\/span>。\n<\/li><li>\n吸收律：<span class=\"katex-inline\">(x\\wedge y)\\vee x=x<\/span>，<span class=\"katex-inline\">(x\\vee y)\\wedge x=x<\/span>。\n<\/li><li>\n德摩根律：<span class=\"katex-inline\">\\neg(x\\wedge y)=\\neg x\\vee\\neg y<\/span>，<span class=\"katex-inline\">\\neg(x\\vee y)=\\neg x\\wedge\\neg y<\/span>。\n<\/ol>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">1\\wedge0=0<\/span>，<span class=\"katex-inline\">1\\vee0=1<\/span>，<span class=\"katex-inline\">\\neg0=1<\/span>；由吸收律 <span class=\"katex-inline\">x\\wedge1=x<\/span>，<span class=\"katex-inline\">x\\vee0=x<\/span>。<\/p>\n<p><strong>反例<\/strong>：把算术直觉搬进来会误判——<span class=\"katex-inline\">x\\wedge(x\\vee y)=x<\/span> 成立（吸收），但不能写成 <span class=\"katex-inline\">x+(x\\times y)=x<\/span> 的算术类比；<span class=\"katex-inline\">x\\vee x=x<\/span>（幂等）不是 <span class=\"katex-inline\">x+x=2x<\/span>。<\/p>\n<h2>原理推导：定律为何能逐位成立<\/h2>\n<p>布尔定律在每一位上独立核验。以第二个分配律 <span class=\"katex-inline\">(x\\wedge y)\\vee z=(x\\vee z)\\wedge(y\\vee z)<\/span> 为例，三个变量共 8 种赋值，逐行代入两侧：任取一组赋值，<span class=\"katex-inline\">z=1<\/span> 时两侧都为 1；<span class=\"katex-inline\">z=0<\/span> 时两侧退化为 <span class=\"katex-inline\">x\\wedge y<\/span> 与 <span class=\"katex-inline\">x\\wedge y<\/span>。8 行取值全部相同，等式成立。德摩根律用四行真值表核验：<span class=\"katex-inline\">x=y=0<\/span> 两侧为 1；<span class=\"katex-inline\">x=0,y=1<\/span> 左侧 <span class=\"katex-inline\">\\neg(0\\wedge1)=1<\/span>，右侧 <span class=\"katex-inline\">1\\vee0=1<\/span>；<span class=\"katex-inline\">x=1,y=0<\/span> 两侧同法核验；<span class=\"katex-inline\">x=y=1<\/span> 两侧为 0。四行覆盖两变量全部输入。<\/p>\n<p>推导依据是真值表完备性：两变量函数的输入只有 4 种、三变量只有 8 种，逐行核验即可证明等式对所有赋值成立，不需要另设公理外的假设。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：运算对象是取值 0/1 的位；定律按位独立施加到二进制整数的每一位。\n<\/li><li>\n失败案例 1：把算术分配律的唯一性带进布尔代数。普通数域只有乘法对加法分配；布尔代数两条分配律并存，漏写或对与的分配会在化简与项、或项交错表达式时卡住。\n<\/li><li>\n失败案例 2：混淆幂等与算术加倍。<span class=\"katex-inline\">x\\vee x=x<\/span>、<span class=\"katex-inline\">x\\wedge x=x<\/span>，重复取同一变量不产生&quot;两份&quot;；按 <span class=\"katex-inline\">x+x<\/span> 理解会得到错误结果。\n<\/li><li>\n边界：德摩根律翻括号时与、或互换且每个变量取反；只翻括号不换算子，得到的是错误等式。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>与/或 vs 算术乘/加<\/strong>：记号相近，取值规则不同；<span class=\"katex-inline\">1\\vee1=1<\/span> 而不是 2，<span class=\"katex-inline\">1\\wedge1=1<\/span>。分配律方向也不同，布尔代数双向分配。\n<\/li><li>\n<strong>德摩根律 vs 单纯取反<\/strong>：取反只作用于单个变量；德摩根律作用于复合表达式整体，要求换算子。\n<\/li><li>\n<strong>交换律 vs 结合律<\/strong>：交换律改两个运算对象的次序，结合律改括号的分组；前者不动运算优先级，后者不动次序。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无，本章是全书组合对象表示的最底层。后继：c02 用真值表与范式把函数写成表达式；c04 把这些定律逐位施加到二进制整数上得到按位运算；c05 BDD 结点的分支判断仍以与、或、非规则为取值依据。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（两值逻辑与布尔代数基本定律）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：两值逻辑依赖链、定律逐行核验与表达式化简推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把布尔代数定律用对，往回追四层：<\/p>\n<ol><li>\n取值语义：一位只能取 0 或 1，1 记真、0 记假。这是所有运算取值表的前提。\n<\/li><li>\n基本运算：与、或、非各自的四行（两变量）或一行（非）取值表，决定复合表达式每一步怎么算。\n<\/li><li>\n等价改写：交换、结合、分配、吸收、德摩根律给出&quot;两种写法算同一个值&quot;的依据；没有这些定律，表达式只能逐行求值。\n<\/li><li>\n按位推广：同一套规则逐位施加到整数的每个二进制位，得到 c04 的按位运算。\n<\/ol>\n<p>依赖链方向：两值语义 → 运算真值表 → 代数定律 → 表达式化简 → 逐位推广。<\/p>\n<h2>正向推导：每条定律的成立依据<\/h2>\n<p><strong>交换律<\/strong>。<span class=\"katex-inline\">x\\wedge y<\/span> 在 <span class=\"katex-inline\">x,y<\/span> 同 1 时为 1，与先写谁后写谁无关；<span class=\"katex-inline\">x\\vee y<\/span> 在任一为 1 时为 1，次序同样不影响。四行真值表两侧取值一致。<\/p>\n<p><strong>结合律<\/strong>。先算哪一对不改变结果：以 <span class=\"katex-inline\">(x\\wedge y)\\wedge z<\/span> 为例，结果为 1 当且仅当 <span class=\"katex-inline\">x,y,z<\/span> 全为 1；<span class=\"katex-inline\">x\\wedge(y\\wedge z)<\/span> 为 1 的条件也是三者全 1。8 种赋值下两侧取值一致，或运算按相同方式成立。<\/p>\n<p><strong>第一分配律<\/strong> <span class=\"katex-inline\">(x\\vee y)\\wedge z=(x\\wedge z)\\vee(y\\wedge z)<\/span>。<span class=\"katex-inline\">z=1<\/span> 时左侧为 <span class=\"katex-inline\">x\\vee y<\/span>，右侧为 <span class=\"katex-inline\">x\\vee y<\/span>；<span class=\"katex-inline\">z=0<\/span> 时两侧都为 0。分 <span class=\"katex-inline\">z<\/span> 两种情形覆盖全部 8 行。<\/p>\n<p><strong>第二分配律<\/strong> <span class=\"katex-inline\">(x\\wedge y)\\vee z=(x\\vee z)\\wedge(y\\vee z)<\/span>。<span class=\"katex-inline\">z=1<\/span> 时两侧都为 1；<span class=\"katex-inline\">z=0<\/span> 时两侧退化为 <span class=\"katex-inline\">x\\wedge y<\/span>。这一条是布尔代数区别于普通算术的关键：算术里加法不对乘法分配，布尔代数里或对与也分配。<\/p>\n<p><strong>吸收律<\/strong> <span class=\"katex-inline\">(x\\wedge y)\\vee x=x<\/span>。若 <span class=\"katex-inline\">x=1<\/span>，左侧 <span class=\"katex-inline\">(1\\wedge y)\\vee1=y\\vee1=1=x<\/span>；若 <span class=\"katex-inline\">x=0<\/span>，左侧 <span class=\"katex-inline\">(0\\wedge y)\\vee0=0=x<\/span>。两情形覆盖完毕。另一式 <span class=\"katex-inline\">(x\\vee y)\\wedge x=x<\/span> 对偶成立。<\/p>\n<p><strong>德摩根律<\/strong>。<span class=\"katex-inline\">\\neg(x\\wedge y)=\\neg x\\vee\\neg y<\/span> 四行核验：<span class=\"katex-inline\">00\\to<\/span> 左侧 <span class=\"katex-inline\">\\neg0=1<\/span>，右侧 <span class=\"katex-inline\">1\\vee1=1<\/span>；<span class=\"katex-inline\">01\\to<\/span> 左侧 <span class=\"katex-inline\">\\neg0=1<\/span>，右侧 <span class=\"katex-inline\">1\\vee0=1<\/span>；<span class=\"katex-inline\">10\\to<\/span> 同 <span class=\"katex-inline\">01<\/span>；<span class=\"katex-inline\">11\\to<\/span> 左侧 <span class=\"katex-inline\">\\neg1=0<\/span>，右侧 <span class=\"katex-inline\">0\\vee0=0<\/span>。另一条 <span class=\"katex-inline\">\\neg(x\\vee y)=\\neg x\\wedge\\neg y<\/span> 把或与对调核验。<\/p>\n<h2>数值算例：手算一个三变量表达式<\/h2>\n<p>取表达式 <span class=\"katex-inline\">E=(x\\wedge y)\\vee(\\neg x\\wedge z)<\/span>，赋值 <span class=\"katex-inline\">x=1,y=0,z=1<\/span>。<\/p>\n<ol><li>\n算 <span class=\"katex-inline\">x\\wedge y=1\\wedge0=0<\/span>。\n<\/li><li>\n算 <span class=\"katex-inline\">\\neg x=0<\/span>，<span class=\"katex-inline\">\\neg x\\wedge z=0\\wedge1=0<\/span>。\n<\/li><li>\n算 <span class=\"katex-inline\">0\\vee0=0<\/span>，<span class=\"katex-inline\">E=0<\/span>。\n<\/ol>\n<p>换赋值 <span class=\"katex-inline\">x=0,y=1,z=1<\/span>：<span class=\"katex-inline\">x\\wedge y=0\\wedge1=0<\/span>；<span class=\"katex-inline\">\\neg x=1<\/span>，<span class=\"katex-inline\">\\neg x\\wedge z=1\\wedge1=1<\/span>；<span class=\"katex-inline\">0\\vee1=1<\/span>，<span class=\"katex-inline\">E=1<\/span>。<\/p>\n<p><strong>第二算例：用吸收律化简<\/strong>。<span class=\"katex-inline\">F=(x\\wedge y)\\vee x<\/span>。由吸收律直接得 <span class=\"katex-inline\">F=x<\/span>。核验两行：<span class=\"katex-inline\">x=1<\/span> 时 <span class=\"katex-inline\">(1\\wedge y)\\vee1=1<\/span>；<span class=\"katex-inline\">x=0<\/span> 时 <span class=\"katex-inline\">(0\\wedge y)\\vee0=0<\/span>，与 <span class=\"katex-inline\">x<\/span> 一致，<span class=\"katex-inline\">y<\/span> 在结果中被吸收掉。<\/p>\n<h2>延伸推演：从定律到范式的方向<\/h2>\n<p>c02 要把真值表写成析取范式：函数值为 1 的每个输入行对应一个最小项（变量按行取值取正或取反，再相与），所有最小项相或。定律在范式转换中承担两类工作：分配律把&quot;与的或&quot;展开成标准形，结合律确定多项运算的分组，德摩根律处理取反嵌套。化简时反向使用：吸收律消去被包含的项，幂等律合并重复项。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>只记算术单向分配<\/strong>。写 <span class=\"katex-inline\">(x\\wedge y)\\vee z<\/span> 时想提出 <span class=\"katex-inline\">z<\/span>，按算术直觉无处可提；套第二分配律得 <span class=\"katex-inline\">(x\\vee z)\\wedge(y\\vee z)<\/span>，这才是布尔代数允许的展开方向。漏记第二条分配律，含或领头项的表达式无法拆开。<\/p>\n<p><strong>翻括号不换算子<\/strong>。把 <span class=\"katex-inline\">\\neg(x\\wedge y)<\/span> 写成 <span class=\"katex-inline\">\\neg x\\wedge\\neg y<\/span>，与、或未互换；代入 <span class=\"katex-inline\">x=0,y=1<\/span>：原式 <span class=\"katex-inline\">\\neg0=1<\/span>，误写式 <span class=\"katex-inline\">1\\wedge0=0<\/span>，两侧不等。正确写法是 <span class=\"katex-inline\">\\neg x\\vee\\neg y<\/span>。<\/p>\n<h2>延伸推演：一条复合表达式的逐步化简<\/h2>\n<p>取 <span class=\"katex-inline\">G=(x\\wedge y)\\vee(x\\wedge\\neg y)\\vee z<\/span>，按定律分步化简。<\/p>\n<ol><li>\n前两项提取公共因子 <span class=\"katex-inline\">x<\/span>：<span class=\"katex-inline\">(x\\wedge y)\\vee(x\\wedge\\neg y)=x\\wedge(y\\vee\\neg y)<\/span>，用第一分配律的反向形式。\n<\/li><li>\n<span class=\"katex-inline\">y\\vee\\neg y=1<\/span>（排中方向：一位非 0 即 1），于是 <span class=\"katex-inline\">x\\wedge1=x<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">G=x\\vee z<\/span>。\n<\/ol>\n<p>核验：取 <span class=\"katex-inline\">x=0,y=0,z=1<\/span>，原式 <span class=\"katex-inline\">(0\\wedge0)\\vee(0\\wedge1)\\vee1=1<\/span>，化简式 <span class=\"katex-inline\">0\\vee1=1<\/span>；取 <span class=\"katex-inline\">x=1,y=0,z=0<\/span>，原式 <span class=\"katex-inline\">(1\\wedge0)\\vee(1\\wedge1)\\vee0=1<\/span>，化简式 <span class=\"katex-inline\">1\\vee0=1<\/span>；取 <span class=\"katex-inline\">x=0,y=1,z=0<\/span>，原式 <span class=\"katex-inline\">0\\vee0\\vee0=0<\/span>，化简式 <span class=\"katex-inline\">0<\/span>。三行覆盖原式三个支项的典型取值。<\/p>\n<p><strong>第三算例：异或与基本运算的关系<\/strong>。异或 <span class=\"katex-inline\">x\\oplus y=1<\/span> 当且仅当 <span class=\"katex-inline\">x,y<\/span> 取值不同。写成与或形式：<span class=\"katex-inline\">x\\oplus y=(x\\wedge\\neg y)\\vee(\\neg x\\wedge y)<\/span>。代入四行：<span class=\"katex-inline\">00\\to(0\\wedge1)\\vee(1\\wedge0)=0<\/span>；<span class=\"katex-inline\">01\\to(0\\wedge0)\\vee(1\\wedge1)=1<\/span>；<span class=\"katex-inline\">10\\to(1\\wedge1)\\vee(0\\wedge0)=1<\/span>；<span class=\"katex-inline\">11\\to(1\\wedge0)\\vee(0\\wedge1)=0<\/span>，与异或取值一致。这说明异或可用与、或、非组合出来，基本三运算是完备的一组。<\/p>\n<h2>再推一层：为什么两条分配律能同时成立<\/h2>\n<p>普通算术里 <span class=\"katex-inline\">a\\times(b+c)=ab+ac<\/span>，但 <span class=\"katex-inline\">a+(b\\times c)<\/span> 不能拆成 <span class=\"katex-inline\">(a+b)\\times(a+c)<\/span>。布尔代数的定义域是 <span class=\"katex-inline\">\\{0,1\\}<\/span>，与、或的取值表都满足单调方向：或相当于取大、与相当于取小（在 <span class=\"katex-inline\">0&lt;1<\/span> 的序下）。取大对取小分配、取小对取大分配，两条方向都成立；这正是格结构中分配格的特征。记住&quot;或取大、与取小&quot;这个视角，第二分配律 <span class=\"katex-inline\">(x\\wedge y)\\vee z=(x\\vee z)\\wedge(y\\vee z)<\/span> 可读成：先取小再取大，等于先分别取大再取小，两侧在四个格点上结果相同。<\/p>\n<h2>对抗性追问：真值表核验能不能代替定律记忆<\/h2>\n<p>能核验两变量、三变量的等式，但变量数增大后真值表行数按 <span class=\"katex-inline\">2^n<\/span> 膨胀，逐行枚举不再可行。定律的价值是给出可复用的改写规则：化简长表达式时按定律成块替换，不必每行重算。核验是证明手段，定律是操作工具，两者分工不同。<\/p>\n<h2>第二算例：三变量表达式分步化简<\/h2>\n<p>取 <span class=\"katex-inline\">H=(x\\wedge y)\\vee(x\\wedge z)\\vee(\\neg y\\wedge z)<\/span>。<\/p>\n<ol><li>\n前两项提取公共因子 <span class=\"katex-inline\">x<\/span>：<span class=\"katex-inline\">(x\\wedge y)\\vee(x\\wedge z)=x\\wedge(y\\vee z)<\/span>，用第一分配律反向形式。\n<\/li><li>\n代入得 <span class=\"katex-inline\">H=[x\\wedge(y\\vee z)]\\vee(\\neg y\\wedge z)<\/span>。\n<\/li><li>\n取赋值 <span class=\"katex-inline\">x=0,y=1,z=1<\/span>：第一支 <span class=\"katex-inline\">0\\wedge(1\\vee1)=0<\/span>，第二支 <span class=\"katex-inline\">\\neg1\\wedge1=0<\/span>，<span class=\"katex-inline\">H=0<\/span>。\n<\/li><li>\n取赋值 <span class=\"katex-inline\">x=1,y=0,z=1<\/span>：第一支 <span class=\"katex-inline\">1\\wedge(0\\vee1)=1<\/span>，第二支 <span class=\"katex-inline\">1\\wedge1=1<\/span>，<span class=\"katex-inline\">H=1<\/span>。\n<\/li><li>\n取赋值 <span class=\"katex-inline\">x=1,y=1,z=0<\/span>：第一支 <span class=\"katex-inline\">1\\wedge1=1<\/span>，第二支 <span class=\"katex-inline\">0\\wedge0=0<\/span>，<span class=\"katex-inline\">H=1<\/span>。\n<\/ol>\n<p>三行分别覆盖&quot;两支都灭&quot;&quot;两支都亮&quot;&quot;仅第一支亮&quot;三种典型组合，化简前后取值一致。<\/p>\n<h2>定律与算术对照清单<\/h2>\n<ul><li>\n幂等：<span class=\"katex-inline\">x\\vee x=x<\/span>、<span class=\"katex-inline\">x\\wedge x=x<\/span>；算术里 <span class=\"katex-inline\">x+x=2x<\/span>、<span class=\"katex-inline\">x\\times x=x^2<\/span>，没有对应幂等。\n<\/li><li>\n吸收：<span class=\"katex-inline\">x\\wedge(x\\vee y)=x<\/span>；算术乘法对加法没有吸收关系。\n<\/li><li>\n双向分配：<span class=\"katex-inline\">\\wedge<\/span> 对 <span class=\"katex-inline\">\\vee<\/span> 分配、<span class=\"katex-inline\">\\vee<\/span> 对 <span class=\"katex-inline\">\\wedge<\/span> 分配；算术只有乘法对加法单向分配。\n<\/li><li>\n德摩根：取反把与变或、或变与；算术取负不改变加乘层级。\n<\/ul>\n<p>记这张清单的用途是防止把小学算术习惯直接搬进布尔表达式；每写一步化简，先核对用的是哪条布尔定律。<\/p>\n<h2>延伸一层：基本运算的完备方向<\/h2>\n<p>与、或、非三者可以组合出任意布尔函数（见 c02 范式构造）；只留与、非或只留或、非同样完备。异或不能单独表达与、或，它是另一组基。这也是书里把 16 种两变量函数先列全、再挑基本运算讨论的原因：先看清全部函数空间，再选完备的小运算集合。<\/p>\n<h2>再推一层：为什么两条分配律能共存于格结构<\/h2>\n<p>把 0、1 看成序 <span class=\"katex-inline\">0&lt;1<\/span>，与对应取小、或对应取大。取小对取大分配、取大对取小分配，是格的分配格特征；普通算术的加法不是取大，乘法不是取小，所以只有单向分配。用&quot;取大取小&quot;视角回看第二分配律：<span class=\"katex-inline\">(x\\wedge y)\\vee z<\/span> 是先两组取小再与 <span class=\"katex-inline\">z<\/span> 取大，<span class=\"katex-inline\">(x\\vee z)\\wedge(y\\vee z)<\/span> 是分别与 <span class=\"katex-inline\">z<\/span> 取大后再取小，两侧在四个格点结果相同。这条视角帮助判断一条改写能不能在布尔代数里合法使用。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">x\\wedge y<\/span>、<span class=\"katex-inline\">x\\vee y<\/span> 在四种赋值下的取值表。\n<\/li><li>\n第二分配律与普通算术的乘法对加法分配，差别落在哪一步？\n<\/li><li>\n用吸收律化简 <span class=\"katex-inline\">(x\\vee y)\\wedge x<\/span>，并取两行赋值核验。\n<\/li><li>\n德摩根律翻括号时，与、或和变量取反各自怎样变化？\n<\/li><li>\n为什么 <span class=\"katex-inline\">x\\vee x=x<\/span> 不能按算术理解成 <span class=\"katex-inline\">2x<\/span>？\n<\/ol><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷4A：组合算法（一）.pdf · p.53<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">两值逻辑与布尔代数基本定律<\/a><\/span><\/div><h1>布尔函数、真值表与两种标准形式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch01（原书 §7.1.1–7.1.2，PDF 第 53、55 页）\n<\/ul>\n<h2>问题：这个概念在组合算法里解决什么具体困难<\/h2>\n<p>给定 <span class=\"katex-inline\">n<\/span> 个二进制输入，要把&quot;什么输入组合输出 1&quot;说清楚。只列几个例子不足以定义函数；口头描述还会随说法不同产生歧义。真值表把 <span class=\"katex-inline\">2^n<\/span> 个赋值和对应输出逐行列全，函数由此被唯一确定；两种标准形式（析取范式、合取范式）再把表翻译成可化简、可求值的表达式。组合筛选、位条件判断都要先把布尔条件写成这样的确定形式。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>布尔函数<\/strong> <span class=\"katex-inline\">f(x_1,\\dots,x_n)<\/span>：输入为 <span class=\"katex-inline\">n<\/span> 个 0/1 变量，输出为 0 或 1。<\/p>\n<p><strong>真值表<\/strong>：<span class=\"katex-inline\">2^n<\/span> 行，每行列出一组赋值与函数值。两变量函数共 <span class=\"katex-inline\">2^{2^2}=16<\/span> 个；<span class=\"katex-inline\">n<\/span> 变量函数总数为 <span class=\"katex-inline\">2^{2^n}<\/span>。<\/p>\n<p><strong>最小项（minterm）<\/strong>：对一行赋值，每个变量按该行取值写正写反——取值 1 写原变量，取值 0 写其否定，全部相与。最小项只在这一行赋值下为 1。<\/p>\n<p><strong>析取范式（DNF）<\/strong>：函数值为 1 的所有行对应的最小项相或。<\/p>\n<p><strong>最大项（maxterm）<\/st
