<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>Agentic Design Patterns（智能体设计模式）</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>
<style id="zs-visual-theme">

   设计口径：深色底、钴蓝+鲸青、衬线标题、点阵底纹、无玻璃拟态。 */

:root,
html[data-theme="dark"],
body[data-theme="dark"] {

  --font-body: "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;

html[data-theme="light"],
body[data-theme="light"],
body[data-theme=""] {

  --bg-soft: #e4eaf5;

  --bg3: #dbe4f2;

  --card: #f9fbff;
  --text: #111827;
  --text2: #26324a;
  --text3: #5b6b86;
  --muted: #5b6b86;
  --border: #c9d4e8;
  --accent: #3950de;
  --accent-strong: #2f43c9;
  --accent2: #0e8fa4;
  --accent3: #12805f;
  --accent-soft: #dbe4ff;
  --ok: #12805f;
  --bad: #c02a44;
  --warn: #9a5b00;
  --danger: #c02a44;
  --code-bg: #eef2f9;
  --dot: rgba(57, 80, 222, .10);
  --ink: #111827;
  --ink-2: #26324a;
  --ink-3: #5b6b86;
  --paper: #edf1f8;
  --paper-2: #f9fbff;
  --wash: #e4eaf5;
  --line: #c9d4e8;
  --line-soft: #dbe4f2;
}

html,
body {
  background-color: var(--bg) !important;
  color: var(--text) !important;
}

body {
  font-family: var(--font-body) !important;
  background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.2px);

  font-size: 16px;

h1, h2, h3, h4, h5,

header,

时"], "answer": 1, "explain": "把人工放在会造成实际影响且不可撤销的动作前。", "relatedConceptId": "c09"}, {"id": "q11", "chapterId": "ch04", "type": "single", "question": "评估智能体为什么不能只看成功率？", "options": ["成功率无法计算", "会鼓励冒险与越权", "成本不重要", "用户不看指标"], "answer": 1, "explain": "还要看合规、成本、延迟。", "relatedConceptId": "c09"}, {"id": "q12", "chapterId": "ch04", "type": "single", "question": "什么任务不适合多智能体？", "options": ["可拆分的并行任务", "需要不同专业视角", "子任务接口不清且强依赖", "大规模文档处理"], "answer": 2, "explain": "接口不清时协调成本高于收益。", "relatedConceptId": "c08"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "链式适用条件", "back": "步骤固定、顺序不可换", "tags": ["模式"]}, {"id": "f02", "chapterId": "ch01", "front": "路由必备", "back": "互斥标签 + 低置信度兜底", "tags": ["模式"]}, {"id": "f03", "chapterId": "ch01", "front": "并行两种用法", "back": "分段并行、投票并行", "tags": ["模式"]}, {"id": "f04", "chapterId": "ch02", "front": "有效反思三件套", "back": "rubric、外部证据、轮次上限", "tags": ["方法"]}, {"id": "f05", "chapterId": "ch02", "front": "工具 schema 原则", "back": "窄、枚举、可读错误、幂等/可回滚", "tags": ["方法"]}, {"id": "f06", "chapterId": "ch02", "front": "重规划触发条件", "back": "检查点失败、工具连续失败、假设被推翻", "tags": ["方法"]}, {"id": "f07", "chapterId": "ch03", "front": "记忆三层", "back": "工作记忆、长期记忆、外部知识", "tags": ["概念"]}, {"id": "f08", "chapterId": "ch03", "front": "RAG 流程", "back": "切块→索引→改写→召回→重排→生成引用", "tags": ["流程"]}, {"id": "f09", "chapterId": "ch04", "front": "护栏三层", "back": "输入、执行、输出", "tags": ["概念"]}, {"id": "f10", "chapterId": "ch04", "front": "多智能体判断标准", "back": "子任务接口清晰、可独立验收", "tags": ["方法"]}]}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.27<\/div><h1>第 1 章：把任务拆开——链式、路由与并行<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：会调用一次大模型 API\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n把一个复合任务拆成有顺序的提示链；\n<\/li><li>\n判断该用路由还是并行；\n<\/li><li>\n画出三种模式的执行图并说明失败点。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>单个提示做不好复杂任务，不是因为模型笨，而是因为<strong>一次只让它做一件事<\/strong>；链式负责顺序，路由负责分诊，并行负责同时开工。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：提示链（Prompt Chaining）<\/h3>\n<p>把任务拆成固定顺序的几步，上一步的输出是下一步的输入。例：先抽取会议纪要的“决议”，再根据决议生成“待办”，最后按负责人分派。链式适合<strong>步骤稳定、顺序不能换<\/strong>的任务。<\/p>\n<p>代价：任何一步出错会向后传播；所以每一步都要有可检查的中间产物，而不是直接要最终答案。<\/p>\n<h3>概念 2：路由（Routing）<\/h3>\n<p>先分类，再把请求送给对应的处理分支。例：用户问题先判为“退货/物流/产品咨询”，分别进入三套提示或三个模型。路由适合<strong>输入类型多、处理方式差异大<\/strong>的场景。<\/p>\n<p>关键设计：分类器要允许“不确定”，并设一个兜底分支；分类错比不分类更贵。<\/p>\n<h3>概念 3：并行（Parallelization）<\/h3>\n<p>相互独立的子任务同时执行，最后汇总。两种用法：<strong>分段并行<\/strong>（长文档分块分别总结）与<strong>投票并行<\/strong>（同一问题多次求解，取多数或交叉验证）。<\/p>\n<p>并行省的是墙钟时间，不省 token；如果子任务之间有依赖，硬并行会得到互相矛盾的中间结果。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nQ[用户请求] --&gt; R{路由分类}\nR --&gt;|类型 A| A[链 A: 抽取 → 校验 → 生成]\nR --&gt;|类型 B| B[链 B: 检索 → 回答]\nR --&gt;|不确定| C[兜底: 追问]\nA --&gt; O[汇总输出]\nB --&gt; O\nQ --&gt; P1[并行子任务 1]\nQ --&gt; P2[并行子任务 2]\nP1 --&gt; O\nP2 --&gt; O<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：路由是“分诊台”，链是“流水线”，并行是“同时开几条流水线”；三者可以嵌套，但嵌套层级越多，排错越难。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：医院先分诊（路由），再按科室流程检查（链），化验与影像可同时做（并行）。\n<\/li><li>\n实例：把 100 页 PDF 分 10 块并行总结，再串一条“合并去重”的链；如果直接让模型一次读 100 页，中间内容会被截断或忽略。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“链越长越强”——每多一步就多一个失败点，能合并的步骤应合并。\n<\/li><li>\n别以为“并行一定更快”——有依赖的步骤并行，只会让你更早拿到错的结果。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n会议纪要转待办，最适合哪种模式？（答案：链式；抽取→生成→分派有严格顺序。）\n<\/li><li>\n客服系统按问题类型走不同提示，用什么？（答案：路由。）\n<\/li><li>\n并行投票的主要作用是什么？（答案：降低单次随机性带来的错误，提高稳健性。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n链式：顺序稳定，逐步校验。\n<\/li><li>\n路由：先分类，留兜底。\n<\/li><li>\n并行：只给独立子任务用。\n<\/ul>", "kind": "chapter", "title": "第 1 章：链式、路由与并行"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.61<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：链式、路由与并行<\/a><\/span><\/div><h1>第 2 章：让智能体会改——反思、工具与规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n设计一个“生成—批评—修订”的反思循环；\n<\/li><li>\n写出工具调用的参数约束与失败处理；\n<\/li><li>\n把开放任务拆成可执行计划并设置重规划条件。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>反思让输出<strong>变好<\/strong>，工具让模型<strong>能做事<\/strong>，规划让多步任务<strong>不迷路<\/strong>；三者共同把“会说话”变成“能交付”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：反思（Reflection）<\/h3>\n<p>让同一模型或另一个模型扮演批评者，按明确标准检查草稿，再据此修订。有效反思的三个条件：有<strong>具体 rubric<\/strong>、有<strong>外部证据<\/strong>（测试结果、检索结果）、有<strong>轮次上限<\/strong>。<\/p>\n<p>无效反思：只说“请改进一下”，模型会改措辞而不改事实。<\/p>\n<h3>概念 2：工具调用（Tool Use / Function Calling）<\/h3>\n<p>模型不直接执行，而是输出一个结构化调用请求，由外部执行后把结果回传。设计要点：<\/p>\n<ul><li>\n参数 schema 要窄，枚举优于自由文本；\n<\/li><li>\n工具要幂等或可回滚；\n<\/li><li>\n失败要返回可读错误，让模型能换参数重试，而不是静默失败。\n<\/ul>\n<h3>概念 3：规划（Planning）<\/h3>\n<p>把目标拆成有序子任务，边执行边检查。计划不是一次性脚本：当观察到“检索不到”“工具报错”“中间结果与预期不符”时，要触发重规划。<\/p>\n<p>好的计划粒度：每一步都有可验证的完成条件；太粗会卡住，太细会耗尽上下文。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\nG[目标] --&gt; P[计划]\nP --&gt; E[执行一步]\nE --&gt; C{结果符合检查点?}\nC --&gt;|是| N[下一步]\nC --&gt;|否| R[反思/重规划]\nR --&gt; P\nN --&gt; C<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：反思不是“再想一遍”，而是拿检查点对照；不符合就回到计划层，而不是在错误结果上继续叠加。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：装修先出施工图（规划），每道工序验收（检查点），发现墙歪了返工（反思），而不是继续贴瓷砖。\n<\/li><li>\n实例：让智能体“把这份 CSV 做成月报”。计划：读表→校验字段→算指标→写结论→生成图表；若字段缺失，触发重规划去问用户，而不是编造列名。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“反思次数越多越好”——没有新证据的反复反思只会让模型自我迎合。\n<\/li><li>\n别以为“工具越多越强”——工具描述不清时，模型会乱选工具，错误率反而上升。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n有效反思必须有什么？（答案：明确标准 + 外部证据 + 轮次上限。）\n<\/li><li>\n工具调用失败时，最差的设计是什么？（答案：静默返回空结果，模型无法判断失败。）\n<\/li><li>\n什么时候该重规划？（答案：检查点不通过、工具连续失败、关键假设被推翻。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n反思靠 rubric 和证据，不靠“再想想”。\n<\/li><li>\n工具 schema 越窄越可靠。\n<\/li><li>\n计划每步都要有验收条件。\n<\/ul>", "kind": "chapter", "title": "第 2 章：反思、工具与规划"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.110<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：反思、工具与规划<\/a><\/span><\/div><h1>第 3 章：记忆、检索与上下文协议<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1–2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分短期上下文、长期记忆与外部知识库；\n<\/li><li>\n设计一个带引用与重排的 RAG 流程；\n<\/li><li>\n说明 MCP 解决的是什么问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>模型本身没有记忆，所谓“记住”都是<strong>把相关信息重新放进上下文<\/strong>；记忆管理就是决定什么该存、什么该取、什么该忘。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：记忆分层<\/h3>\n<ul><li>\n<strong>工作记忆<\/strong>：当前对话窗口，容量有限、随会话消失；\n<\/li><li>\n<strong>长期记忆<\/strong>：向量库或数据库，跨会话保存，需要写入策略与召回策略；\n<\/li><li>\n<strong>外部知识<\/strong>：文档库、API、数据库，按需检索，不进入参数。\n<\/ul>\n<p>写入长期记忆前要过滤：只存稳定偏好与事实，不存一次性指令，否则记忆会被污染。<\/p>\n<h3>概念 2：RAG（检索增强生成）<\/h3>\n<p>流程：切块 → 建索引 → 查询改写 → 召回 → 重排 → 拼接进上下文 → 生成并标注引用。<\/p>\n<p>常见失败不在生成，而在检索：切块切断语义、查询与文档用词不一致、召回太多稀释重点。对策：小块 + 重叠、混合检索（关键词 + 向量）、重排后只留 top-k。<\/p>\n<h3>概念 3：MCP（模型上下文协议）<\/h3>\n<p>MCP 把“模型如何发现和调用外部能力”标准化：工具、资源、提示模板用统一协议暴露，客户端不必为每个服务写一套适配。它解决的是<strong>连接方式的碎片化<\/strong>，不解决工具本身的质量。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\nQ[问题] --&gt; R[查询改写]\nR --&gt; S[混合检索]\nS --&gt; RR[重排 top-k]\nRR --&gt; C[上下文]\nC --&gt; L[生成 + 引用]\nL --&gt; M[(长期记忆)]\nM --&gt; C<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：检索与记忆都只是“往上下文里放材料”；放错材料，再强的模型也只能基于错误材料回答。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：开卷考试。书在书包里（外部知识），你只把相关几页摊在桌上（上下文），记在脑子里的公式是参数化知识。\n<\/li><li>\n实例：问“我们公司退货政策第 3 条”，先检索政策文档，命中后把原文片段与链接放进上下文，回答时逐条引用；检索不到就明说，而不是凭常识编。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“上下文窗口大就不用检索”——无关内容越多，模型越容易抓错重点。\n<\/li><li>\n别以为“存进向量库就叫记忆”——没有召回策略和时效标注，旧记忆会覆盖新事实。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n长期记忆最适合存什么？（答案：稳定偏好、长期事实；不存一次性任务指令。）\n<\/li><li>\nRAG 最常见的失败环节？（答案：检索/切块，而不是生成。）\n<\/li><li>\nMCP 标准化了什么？（答案：模型与外部工具/资源/提示的连接方式。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n记忆 = 写入策略 + 召回策略 + 遗忘策略。\n<\/li><li>\nRAG 先修检索，再谈生成。\n<\/li><li>\nMCP 管连接，不管内容质量。\n<\/ul>", "kind": "chapter", "title": "第 3 章：记忆、检索与上下文协议"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.97<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：记忆、检索与上下文协议<\/a><\/span><\/div><h1>第 4 章：多智能体、人机协作与护栏<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1–3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断一个任务是否真的需要多智能体；\n<\/li><li>\n设计人机协作的审批点；\n<\/li><li>\n为智能体系统设置输入、执行、输出三层护栏与评估指标。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>多智能体不是“更多模型”，而是<strong>角色分工 + 通信协议 + 汇总机制<\/strong>；护栏不是事后过滤，而是<strong>在关键动作前后设置可拦截的检查点<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：多智能体协作<\/h3>\n<p>常见角色：规划者、执行者、批评者、汇总者。收益来自并行与专业化，成本来自通信开销、上下文不一致与责任不清。<\/p>\n<p>判断标准：任务能否拆成<strong>接口清晰、可独立验收<\/strong>的子任务；如果不能，单智能体加工具通常更稳。<\/p>\n<h3>概念 2：人机协作（Human-in-the-Loop）<\/h3>\n<p>在不可逆动作前设审批：付款、发邮件、删数据、对外发布。审批点要给出“将执行什么、影响范围、如何撤销”，而不是只弹一个“是否继续”。<\/p>\n<h3>概念 3：护栏与评估<\/h3>\n<ul><li>\n输入护栏：提示注入检测、敏感信息过滤；\n<\/li><li>\n执行护栏：权限最小化、沙箱、速率限制、危险工具白名单；\n<\/li><li>\n输出护栏：事实核查、格式校验、引用完整性。\n<\/ul>\n<p>评估指标分三层：任务成功率、过程合规率（是否越权/是否留痕）、成本与延迟。只看成功率会鼓励智能体冒险。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nI[输入] --&gt; G1[输入护栏]\nG1 --&gt; A[智能体执行]\nA --&gt; H{不可逆动作?}\nH --&gt;|是| AP[人工审批]\nH --&gt;|否| G2[执行护栏]\nAP --&gt; G2\nG2 --&gt; O[输出]\nO --&gt; G3[输出护栏]\nG3 --&gt; E[评估与留痕]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：护栏分布在全流程，不是一个末端过滤器；审批点只放在不可逆动作前，避免把用户变成每步都点确认的按钮。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：公司报销。输入检查发票真伪，执行限制额度，超过额度要主管审批，输出核对科目；四道关缺一不可。\n<\/li><li>\n实例：让智能体自动给客户发退款邮件。检索订单→计算金额→<strong>人工审批<\/strong>→发送→记录日志；金额超过阈值必须二次审批。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“智能体越多越智能”——角色重叠时会互相等待、重复劳动。\n<\/li><li>\n别以为“加了护栏就一定安全”——护栏本身要有测试，否则只是装饰。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n什么任务不适合多智能体？（答案：子任务接口不清、强顺序依赖、单模型加工具即可完成。）\n<\/li><li>\n审批点应设在哪里？（答案：不可逆、高风险、对外产生实际影响的动作前。）\n<\/li><li>\n评估为什么不能只看成功率？（答案：会鼓励冒险与越权，忽略合规、成本与延迟。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n多智能体看接口，不看数量。\n<\/li><li>\n审批点 = 不可逆动作前。\n<\/li><li>\n护栏三层：输入、执行、输出；评估三层：效果、合规、成本。\n<\/ul>", "kind": "chapter", "title": "第 4 章：多智能体、人机协作与护栏"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.27<\/div><h1>提示链<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把任务拆成固定顺序的多步提示，上一步输出作为下一步输入。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“一次生成”变成“可检查的流水线”，显著降低复杂任务的遗漏率。<\/p>\n<h2>详解<\/h2>\n<p>典型三步：抽取结构化信息 → 校验/补全 → 按模板生成。每一步都要求模型输出可解析的中间格式（JSON、清单），便于程序检查。链式不适合需要来回探索的任务，那种任务要用规划循环。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n链越长越好；实际上每步都可能引入误差。\n<\/li><li>\n中间结果不需要校验；实际上链式的价值就在中间可查。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n路由、反思、规划\n<\/ul>", "kind": "concept", "title": "提示链"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.40<\/div><h1>路由<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>先判断请求类型，再分派给对应的处理分支。<\/p>\n<h2>为什么重要<\/h2>\n<p>不同请求需要不同提示、模型与工具；一套提示包打天下会把简单问题复杂化、把专业问题做浅。<\/p>\n<h2>详解<\/h2>\n<p>分类器输出标签 + 置信度；低置信度走追问或兜底。路由标签要互斥且覆盖真实流量，不要为长尾造几十个分支。路由错误会直接导致后续全错，所以分类评估要单独做。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n只按关键词路由；实际上同一词在不同语境下意图不同。\n<\/li><li>\n不设兜底分支；分类失败时系统直接卡死。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n提示链、并行\n<\/ul>", "kind": "concept", "title": "路由"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.50<\/div><h1>并行化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把互不依赖的子任务同时执行，再汇总结果。<\/p>\n<h2>为什么重要<\/h2>\n<p>缩短墙钟时间；投票式并行还能降低单次生成的随机错误。<\/p>\n<h2>详解<\/h2>\n<p>两种形态：分段并行（长文档切块）与投票并行（同一问题多解）。并行前必须确认子任务无共享状态、无顺序依赖。汇总环节要设去重与冲突解决规则，否则结果互相矛盾。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n并行能省 token；其实总 token 往往更多。\n<\/li><li>\n所有子任务都能并行；有依赖的步骤并行会放大错误。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n提示链、多智能体\n<\/ul>", "kind": "concept", "title": "并行化"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.61<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">提示链<\/a><\/span><\/div><h1>反思<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>按明确标准检查草稿，并据此修订的循环。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“一次成稿”变成“生成—批评—修订”，是提升质量最便宜的手段之一。<\/p>\n<h2>详解<\/h2>\n<p>有效反思需要三件东西：rubric（逐条标准）、证据（测试结果/检索原文/计算结果）、上限（最多两三轮）。没有证据的反思只是让模型换个说法。批评者可以是另一个模型，也可以是人类，但标准必须一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n“请改进”就是反思；没有标准的改进会漂移。\n<\/li><li>\n反思越多越好；无新信息的循环会自我强化错误。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n规划、评估\n<\/ul>", "kind": "concept", "title": "反思"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.73<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">提示链<\/a><\/span><\/div><h1>工具调用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>模型输出结构化调用请求，由外部系统执行并回传结果。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让模型能查数据、算数、操作软件，而不只是生成文本。<\/p>\n<h2>详解<\/h2>\n<p>设计要点：窄 schema、枚举参数、清晰描述、幂等与可回滚、可读错误。工具返回要给模型“下一步能做什么”的信息，例如“缺少参数 date，请补充”。权限按最小化原则配置，危险操作加审批。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n工具越多越好；描述重叠会导致乱选。\n<\/li><li>\n失败返回空值即可；模型无法区分“没有结果”和“调用失败”。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\nMCP、护栏、规划\n<\/ul>", "kind": "concept", "title": "工具调用"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.87<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">反思<\/a><\/span><\/div><h1>规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把目标拆成有序子任务，并在执行中根据观察重规划。<\/p>\n<h2>为什么重要<\/h2>\n<p>多步任务容易迷路；计划提供了路线与验收点。<\/p>\n<h2>详解<\/h2>\n<p>计划粒度以“每步可验收”为准。执行循环：选下一步 → 执行 → 对照检查点 → 通过则继续，不通过则反思/重规划。计划要显式记录假设，假设被推翻时才能知道该改哪一段。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n计划一次定死；实际环境变化时必须重规划。\n<\/li><li>\n计划越细越好；过细会耗尽上下文并降低灵活性。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n反思、工具调用、多智能体\n<\/ul>", "kind": "concept", "title": "规划"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.175<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">工具调用<\/a><\/span><\/div><h1>RAG（检索增强生成）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>先从外部知识库检索相关片段，再把它放进上下文让模型基于材料回答。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让回答可引用、可更新，缓解模型知识过时与幻觉。<\/p>\n<h2>详解<\/h2>\n<p>流程：切块 → 索引 → 查询改写 → 召回 → 重排 → 拼接 → 生成引用。失败多发生在检索：块切得太碎失去上下文，查询与文档措辞不一致，top-k 太大稀释重点。对策：重叠切块、混合检索、重排、限制引用数量。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n有 RAG 就不会幻觉；材料没召回到时照样会编。\n<\/li><li>\n向量检索万能；精确术语与编号用关键词检索更稳。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n记忆、MCP\n<\/ul>", "kind": "concept", "title": "RAG（检索增强生成）"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.97<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">规划<\/a><\/span><\/div><h1>多智能体协作<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>多个带角色的智能体通过消息传递分工完成同一任务。<\/p>\n<h2>为什么重要<\/h2>\n<p>适合可拆分、可并行、需要不同专业视角的任务；也便于把责任边界写清楚。<\/p>\n<h2>详解<\/h2>\n<p>常见角色：规划者、执行者、批评者、汇总者。设计重点是接口：每个智能体输入什么、输出什么格式、谁负责最终汇总。通信要有共享状态与冲突解决规则，否则会重复劳动或互相覆盖。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n智能体数量越多越强；角色重叠会增加协调成本。\n<\/li><li>\n多智能体一定比单智能体准；没有清晰接口时更不稳定。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n并行、规划、人机协作\n<\/ul>", "kind": "concept", "title": "多智能体协作"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.229<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">工具调用<\/a><\/span><\/div><h1>护栏<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在输入、执行、输出三个环节设置的可拦截检查。<\/p>\n<h2>为什么重要<\/h2>\n<p>智能体会产生实际副作用；护栏把“出错”限制在可恢复范围内。<\/p>\n<h2>详解<\/h2>\n<p>输入层查注入与敏感信息；执行层做权限最小化、沙箱、速率限制；输出层查事实、格式、引用。护栏要能被测试：构造攻击样例与误报样例，测量拦截率与误伤率。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n末端过滤就够了；执行中的越权动作已经造成影响。\n<\/li><li>\n加了护栏就安全；未测试的护栏只是心理安慰。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n工具调用、人机协作、评估\n<\/ul>", "kind": "concept", "title": "护栏"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：基础编排：链、路由、并行<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：链式、路由与并行<\/a><br>检查点：能给三个不同任务各画出执行图<\/li><li class='path-step' id='path-02'><strong>步骤 02：自我改进：反思、工具、规划<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：反思、工具与规划<\/a><br>检查点：能写出工具 schema 与重规划条件<\/li><li class='path-step' id='path-03'><strong>步骤 03：上下文：记忆、RAG、MCP<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：记忆、检索与上下文协议<\/a><br>检查点：能设计带引用的检索流程<\/li><li class='path-step' id='path-04'><strong>步骤 04：系统化：多智能体、人、护栏<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：多智能体、人机协作与护栏<\/a><br>检查点：能列出审批点与三层护栏<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 会议纪要转待办最适合？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 路由<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 链式<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 并行投票<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 多智能体<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 客服按问题类型走不同提示，用什么模式？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 链式<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 路由<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 反思<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> RAG<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c03' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> 并行化最适合？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 有强顺序依赖的步骤<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 互不依赖的子任务<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 需要人工审批的动作<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 单轮问答<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c04' data-chapter='ch02'><p class='quiz-q'><b>Q4.<\/b> 有效反思不需要下列哪项？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 明确 rubric<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 外部证据<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 轮次上限<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 更长的提示<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c05' data-chapter='ch02'><p class='quiz-q'><b>Q5.<\/b> 工具调用失败时最好的返回是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 空字符串<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> null<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 可读错误与可尝试的下一步<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 抛出异常终止<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='blank' data-concept='c06' data-chapter='ch02'><p class='quiz-q'><b>Q6.<\/b> 计划每一步都应有可验证的 ______。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q7.<\/b> 长期记忆最适合存？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 一次性任务指令<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 稳定偏好与长期事实<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 完整聊天记录<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 临时变量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q8.<\/b> RAG 最常见的失败环节是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 生成<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 检索与切块<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 用户输入<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 模型选择<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q9.<\/b> MCP 主要解决？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 模型推理速度<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 工具连接方式碎片化<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 训练数据质量<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 前端样式<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q10.<\/b> 审批点应设在哪里？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 每个模型调用前<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 不可逆动作前<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 输出之后<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 只在系统启动时<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q11.<\/b> 评估智能体为什么不能只看成功率？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 成功率无法计算<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 会鼓励冒险与越权<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 成本不重要<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 用户不看指标<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q12.<\/b> 什么任务不适合多智能体？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 可拆分的并行任务<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 需要不同专业视角<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 子任务接口不清且强依赖<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 大规模文档处理<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：链式、路由与并行<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 会议纪要转待办最适合？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 路由<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 链式<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 并行投票<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 多智能体<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 客服按问题类型走不同提示，用什么模式？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 链式<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 路由<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 反思<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> RAG<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c03' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> 并行化最适合？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 有强顺序依赖的步骤<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 互不依赖的子任务<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 需要人工审批的动作<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 单轮问答<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：反思、工具与规划<\/h1><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c04' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 有效反思不需要下列哪项？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 明确 rubric<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 外部证据<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 轮次上限<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 更长的提示<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c05' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 工具调用失败时最好的返回是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 空字符串<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> null<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 可读错误与可尝试的下一步<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 抛出异常终止<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='blank' data-concept='c06' data-chapter='ch02'><p class='quiz-q'><b>Q3.<\/b> 计划每一步都应有可验证的 ______。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：记忆、检索与上下文协议<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 长期记忆最适合存？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 一次性任务指令<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 稳定偏好与长期事实<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 完整聊天记录<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 临时变量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> RAG 最常见的失败环节是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 生成<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 检索与切块<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 用户输入<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 模型选择<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q3.<\/b> MCP 主要解决？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 模型推理速度<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 工具连接方式碎片化<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 训练数据质量<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 前端样式<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：多智能体、人机协作与护栏<\/h1><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 审批点应设在哪里？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 每个模型调用前<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 不可逆动作前<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 输出之后<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 只在系统启动时<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 评估智能体为什么不能只看成功率？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 成功率无法计算<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 会鼓励冒险与越权<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 成本不重要<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 用户不看指标<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q3.<\/b> 什么任务不适合多智能体？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 可拆分的并行任务<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 需要不同专业视角<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 子任务接口不清且强依赖<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 大规模文档处理<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='提示链'>提示链 — 固定顺序的多步提示，上一步输出作为下一步输入 <span class=glossary-ref>（第 1 章：链式、路由与并行）<\/span><\/li><li data-term='路由'>路由 — 先分类再分派到不同处理分支 <span class=glossary-ref>（第 1 章：链式、路由与并行）<\/span><\/li><li data-term='并行化'>并行化 — 互不依赖的子任务同时执行后汇总 <span class=glossary-ref>（第 1 章：链式、路由与并行）<\/span><\/li><li data-term='反思'>反思 — 按明确标准检查并修订输出的循环 <span class=glossary-ref>（第 2 章：反思、工具与规划）<\/span><\/li><li data-term='工具调用'>工具调用 — 模型输出结构化请求，由外部执行并回传结果 <span class=glossary-ref>（第 2 章：反思、工具与规划）<\/span><\/li><li data-term='规划'>规划 — 把目标拆成可验收的子任务并动态调整 <span class=glossary-ref>（第 2 章：反思、工具与规划）<\/span><\/li><li data-term='工作记忆'>工作记忆 — 当前上下文窗口中的信息 <span class=glossary-ref>（第 3 章：记忆、检索与上下文协议）<\/span><\/li><li data-term='长期记忆'>长期记忆 — 跨会话保存、按需召回的事实与偏好 <span class=glossary-ref>（第 3 章：记忆、检索与上下文协议）<\/span><\/li><li data-term='rag'>RAG — 检索外部片段后基于材料生成并引用 <span class=glossary-ref>（第 3 章：记忆、检索与上下文协议）<\/span><\/li><li data-term='mcp'>MCP — 标准化模型与外部工具/资源/提示连接的协议 <span class=glossary-ref>（第 3 章：记忆、检索与上下文协议）<\/span><\/li><li data-term='多智能体'>多智能体 — 多个带角色的智能体通过消息分工完成任务 <span class=glossary-ref>（第 4 章：多智能体、人机协作与护栏）<\/span><\/li><li data-term='人机协作'>人机协作 — 在关键动作前引入人工审批或确认 <span class=glossary-ref>（第 4 章：多智能体、人机协作与护栏）<\/span><\/li><li data-term='护栏'>护栏 — 输入、执行、输出三层的可拦截检查 <span class=glossary-ref>（第 4 章：多智能体、人机协作与护栏）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库<\/h1>\n<h2>模式 1：分诊再流水线<\/h2>\n<p>先路由，再在分支内用链式；不要把所有逻辑塞进一个提示。<\/p>\n<h2>模式 2：生成者与批评者分离<\/h2>\n<p>让批评者只看标准与证据，不看生成者的解释，避免自我附和。<\/p>\n<h2>模式 3：计划—执行—验收循环<\/h2>\n<p>每一步都写检查点；失败回到计划层，不在错误结果上继续。<\/p>\n<h2>模式 4：最小权限工具<\/h2>\n<p>只给完成任务必需的工具与参数范围；危险动作加审批与回滚。<\/p>\n<h2>模式 5：检索先重排<\/h2>\n<p>召回多、进上下文少；引用逐条标注，检索不到就明说。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>选模式<\/h2>\n<ul><li>\n步骤固定有顺序 → 提示链\n<\/li><li>\n输入类型多 → 路由\n<\/li><li>\n子任务独立 → 并行\n<\/li><li>\n质量不够 → 反思\n<\/li><li>\n需要外部动作 → 工具\n<\/li><li>\n多步开放任务 → 规划\n<\/li><li>\n需要可引用知识 → RAG\n<\/li><li>\n可拆分的专业分工 → 多智能体\n<\/ul>\n<h2>设计检查<\/h2>\n<ul><li>\n每步有可验收的中间产物\n<\/li><li>\n工具有窄 schema 与可读错误\n<\/li><li>\n不可逆动作前有人工审批\n<\/li><li>\n输入/执行/输出三层护栏\n<\/li><li>\n评估看成功率、合规率、成本\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n一条超长提示包打天下\n<\/li><li>\n无标准反思\n<\/li><li>\n工具失败静默返回空\n<\/li><li>\n只做事后内容过滤\n<\/ul>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/src/agentic", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：链式、路由与并行", "href": "#/chapter/ch01"}, {"label": "第 2 章：反思、工具与规划", "href": "#/chapter/ch02"}, {"label": "第 3 章：记忆、检索与上下文协议", "href": "#/chapter/ch03"}, {"label": "第 4 章：多智能体、人机协作与护栏", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "提示链", "href": "#/concept/c01"}, {"label": "路由", "href": "#/concept/c02"}, {"label": "并行化", "href": "#/concept/c03"}, {"label": "反思", "href": "#/concept/c04"}, {"label": "工具调用", "href": "#/concept/c05"}, {"label": "规划", "href": "#/concept/c06"}, {"label": "RAG（检索增强生成）", "href": "#/concept/c07"}, {"label": "多智能体协作", "href": "#/concept/c08"}, {"label": "护栏", "href": "#/concept/c09"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：链式、路由与并行", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：反思、工具与规划", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：记忆、检索与上下文协议", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：多智能体、人机协作与护栏", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.27<\/div><h1>第 1 章：把任务拆开——链式、路由与并行<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：会调用一次大模型 API\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n把一个复合任务拆成有顺序的提示链；\n<\/li><li>\n判断该用路由还是并行；\n<\/li><li>\n画出三种模式的执行图并说明失败点。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>单个提示做不好复杂任务，不是因为模型笨，而是因为<strong>一次只让它做一件事<\/strong>；链式负责顺序，路由负责分诊，并行负责同时开工。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：提示链（Prompt Chaining）<\/h3>\n<p>把任务拆成固定顺序的几步，上一步的输出是下一步的输入。例：先抽取会议纪要的“决议”，再根据决议生成“待办”，最后按负责人分派。链式适合<strong>步骤稳定、顺序不能换<\/strong>的任务。<\/p>\n<p>代价：任何一步出错会向后传播；所以每一步都要有可检查的中间产物，而不是直接要最终答案。<\/p>\n<h3>概念 2：路由（Routing）<\/h3>\n<p>先分类，再把请求送给对应的处理分支。例：用户问题先判为“退货/物流/产品咨询”，分别进入三套提示或三个模型。路由适合<strong>输入类型多、处理方式差异大<\/strong>的场景。<\/p>\n<p>关键设计：分类器要允许“不确定”，并设一个兜底分支；分类错比不分类更贵。<\/p>\n<h3>概念 3：并行（Parallelization）<\/h3>\n<p>相互独立的子任务同时执行，最后汇总。两种用法：<strong>分段并行<\/strong>（长文档分块分别总结）与<strong>投票并行<\/strong>（同一问题多次求解，取多数或交叉验证）。<\/p>\n<p>并行省的是墙钟时间，不省 token；如果子任务之间有依赖，硬并行会得到互相矛盾的中间结果。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nQ[用户请求] --&gt; R{路由分类}\nR --&gt;|类型 A| A[链 A: 抽取 → 校验 → 生成]\nR --&gt;|类型 B| B[链 B: 检索 → 回答]\nR --&gt;|不确定| C[兜底: 追问]\nA --&gt; O[汇总输出]\nB --&gt; O\nQ --&gt; P1[并行子任务 1]\nQ --&gt; P2[并行子任务 2]\nP1 --&gt; O\nP2 --&gt; O<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：路由是“分诊台”，链是“流水线”，并行是“同时开几条流水线”；三者可以嵌套，但嵌套层级越多，排错越难。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：医院先分诊（路由），再按科室流程检查（链），化验与影像可同时做（并行）。\n<\/li><li>\n实例：把 100 页 PDF 分 10 块并行总结，再串一条“合并去重”的链；如果直接让模型一次读 100 页，中间内容会被截断或忽略。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“链越长越强”——每多一步就多一个失败点，能合并的步骤应合并。\n<\/li><li>\n别以为“并行一定更快”——有依赖的步骤并行，只会让你更早拿到错的结果。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n会议纪要转待办，最适合哪种模式？（答案：链式；抽取→生成→分派有严格顺序。）\n<\/li><li>\n客服系统按问题类型走不同提示，用什么？（答案：路由。）\n<\/li><li>\n并行投票的主要作用是什么？（答案：降低单次随机性带来的错误，提高稳健性。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n链式：顺序稳定，逐步校验。\n<\/li><li>\n路由：先分类，留兜底。\n<\/li><li>\n并行：只给独立子任务用。\n<\/ul>", "ch02": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.61<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：链式、路由与并行<\/a><\/span><\/div><h1>第 2 章：让智能体会改——反思、工具与规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n设计一个“生成—批评—修订”的反思循环；\n<\/li><li>\n写出工具调用的参数约束与失败处理；\n<\/li><li>\n把开放任务拆成可执行计划并设置重规划条件。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>反思让输出<strong>变好<\/strong>，工具让模型<strong>能做事<\/strong>，规划让多步任务<strong>不迷路<\/strong>；三者共同把“会说话”变成“能交付”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：反思（Reflection）<\/h3>\n<p>让同一模型或另一个模型扮演批评者，按明确标准检查草稿，再据此修订。有效反思的三个条件：有<strong>具体 rubric<\/strong>、有<strong>外部证据<\/strong>（测试结果、检索结果）、有<strong>轮次上限<\/strong>。<\/p>\n<p>无效反思：只说“请改进一下”，模型会改措辞而不改事实。<\/p>\n<h3>概念 2：工具调用（Tool Use / Function Calling）<\/h3>\n<p>模型不直接执行，而是输出一个结构化调用请求，由外部执行后把结果回传。设计要点：<\/p>\n<ul><li>\n参数 schema 要窄，枚举优于自由文本；\n<\/li><li>\n工具要幂等或可回滚；\n<\/li><li>\n失败要返回可读错误，让模型能换参数重试，而不是静默失败。\n<\/ul>\n<h3>概念 3：规划（Planning）<\/h3>\n<p>把目标拆成有序子任务，边执行边检查。计划不是一次性脚本：当观察到“检索不到”“工具报错”“中间结果与预期不符”时，要触发重规划。<\/p>\n<p>好的计划粒度：每一步都有可验证的完成条件；太粗会卡住，太细会耗尽上下文。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\nG[目标] --&gt; P[计划]\nP --&gt; E[执行一步]\nE --&gt; C{结果符合检查点?}\nC --&gt;|是| N[下一步]\nC --&gt;|否| R[反思/重规划]\nR --&gt; P\nN --&gt; C<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：反思不是“再想一遍”，而是拿检查点对照；不符合就回到计划层，而不是在错误结果上继续叠加。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：装修先出施工图（规划），每道工序验收（检查点），发现墙歪了返工（反思），而不是继续贴瓷砖。\n<\/li><li>\n实例：让智能体“把这份 CSV 做成月报”。计划：读表→校验字段→算指标→写结论→生成图表；若字段缺失，触发重规划去问用户，而不是编造列名。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“反思次数越多越好”——没有新证据的反复反思只会让模型自我迎合。\n<\/li><li>\n别以为“工具越多越强”——工具描述不清时，模型会乱选工具，错误率反而上升。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n有效反思必须有什么？（答案：明确标准 + 外部证据 + 轮次上限。）\n<\/li><li>\n工具调用失败时，最差的设计是什么？（答案：静默返回空结果，模型无法判断失败。）\n<\/li><li>\n什么时候该重规划？（答案：检查点不通过、工具连续失败、关键假设被推翻。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n反思靠 rubric 和证据，不靠“再想想”。\n<\/li><li>\n工具 schema 越窄越可靠。\n<\/li><li>\n计划每步都要有验收条件。\n<\/ul>", "ch03": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.110<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：反思、工具与规划<\/a><\/span><\/div><h1>第 3 章：记忆、检索与上下文协议<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1–2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分短期上下文、长期记忆与外部知识库；\n<\/li><li>\n设计一个带引用与重排的 RAG 流程；\n<\/li><li>\n说明 MCP 解决的是什么问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>模型本身没有记忆，所谓“记住”都是<strong>把相关信息重新放进上下文<\/strong>；记忆管理就是决定什么该存、什么该取、什么该忘。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：记忆分层<\/h3>\n<ul><li>\n<strong>工作记忆<\/strong>：当前对话窗口，容量有限、随会话消失；\n<\/li><li>\n<strong>长期记忆<\/strong>：向量库或数据库，跨会话保存，需要写入策略与召回策略；\n<\/li><li>\n<strong>外部知识<\/strong>：文档库、API、数据库，按需检索，不进入参数。\n<\/ul>\n<p>写入长期记忆前要过滤：只存稳定偏好与事实，不存一次性指令，否则记忆会被污染。<\/p>\n<h3>概念 2：RAG（检索增强生成）<\/h3>\n<p>流程：切块 → 建索引 → 查询改写 → 召回 → 重排 → 拼接进上下文 → 生成并标注引用。<\/p>\n<p>常见失败不在生成，而在检索：切块切断语义、查询与文档用词不一致、召回太多稀释重点。对策：小块 + 重叠、混合检索（关键词 + 向量）、重排后只留 top-k。<\/p>\n<h3>概念 3：MCP（模型上下文协议）<\/h3>\n<p>MCP 把“模型如何发现和调用外部能力”标准化：工具、资源、提示模板用统一协议暴露，客户端不必为每个服务写一套适配。它解决的是<strong>连接方式的碎片化<\/strong>，不解决工具本身的质量。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\nQ[问题] --&gt; R[查询改写]\nR --&gt; S[混合检索]\nS --&gt; RR[重排 top-k]\nRR --&gt; C[上下文]\nC --&gt; L[生成 + 引用]\nL --&gt; M[(长期记忆)]\nM --&gt; C<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：检索与记忆都只是“往上下文里放材料”；放错材料，再强的模型也只能基于错误材料回答。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：开卷考试。书在书包里（外部知识），你只把相关几页摊在桌上（上下文），记在脑子里的公式是参数化知识。\n<\/li><li>\n实例：问“我们公司退货政策第 3 条”，先检索政策文档，命中后把原文片段与链接放进上下文，回答时逐条引用；检索不到就明说，而不是凭常识编。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“上下文窗口大就不用检索”——无关内容越多，模型越容易抓错重点。\n<\/li><li>\n别以为“存进向量库就叫记忆”——没有召回策略和时效标注，旧记忆会覆盖新事实。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n长期记忆最适合存什么？（答案：稳定偏好、长期事实；不存一次性任务指令。）\n<\/li><li>\nRAG 最常见的失败环节？（答案：检索/切块，而不是生成。）\n<\/li><li>\nMCP 标准化了什么？（答案：模型与外部工具/资源/提示的连接方式。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n记忆 = 写入策略 + 召回策略 + 遗忘策略。\n<\/li><li>\nRAG 先修检索，再谈生成。\n<\/li><li>\nMCP 管连接，不管内容质量。\n<\/ul>", "ch04": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.97<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：记忆、检索与上下文协议<\/a><\/span><\/div><h1>第 4 章：多智能体、人机协作与护栏<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1–3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断一个任务是否真的需要多智能体；\n<\/li><li>\n设计人机协作的审批点；\n<\/li><li>\n为智能体系统设置输入、执行、输出三层护栏与评估指标。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>多智能体不是“更多模型”，而是<strong>角色分工 + 通信协议 + 汇总机制<\/strong>；护栏不是事后过滤，而是<strong>在关键动作前后设置可拦截的检查点<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：多智能体协作<\/h3>\n<p>常见角色：规划者、执行者、批评者、汇总者。收益来自并行与专业化，成本来自通信开销、上下文不一致与责任不清。<\/p>\n<p>判断标准：任务能否拆成<strong>接口清晰、可独立验收<\/strong>的子任务；如果不能，单智能体加工具通常更稳。<\/p>\n<h3>概念 2：人机协作（Human-in-the-Loop）<\/h3>\n<p>在不可逆动作前设审批：付款、发邮件、删数据、对外发布。审批点要给出“将执行什么、影响范围、如何撤销”，而不是只弹一个“是否继续”。<\/p>\n<h3>概念 3：护栏与评估<\/h3>\n<ul><li>\n输入护栏：提示注入检测、敏感信息过滤；\n<\/li><li>\n执行护栏：权限最小化、沙箱、速率限制、危险工具白名单；\n<\/li><li>\n输出护栏：事实核查、格式校验、引用完整性。\n<\/ul>\n<p>评估指标分三层：任务成功率、过程合规率（是否越权/是否留痕）、成本与延迟。只看成功率会鼓励智能体冒险。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nI[输入] --&gt; G1[输入护栏]\nG1 --&gt; A[智能体执行]\nA --&gt; H{不可逆动作?}\nH --&gt;|是| AP[人工审批]\nH --&gt;|否| G2[执行护栏]\nAP --&gt; G2\nG2 --&gt; O[输出]\nO --&gt; G3[输出护栏]\nG3 --&gt; E[评估与留痕]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：护栏分布在全流程，不是一个末端过滤器；审批点只放在不可逆动作前，避免把用户变成每步都点确认的按钮。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：公司报销。输入检查发票真伪，执行限制额度，超过额度要主管审批，输出核对科目；四道关缺一不可。\n<\/li><li>\n实例：让智能体自动给客户发退款邮件。检索订单→计算金额→<strong>人工审批<\/strong>→发送→记录日志；金额超过阈值必须二次审批。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“智能体越多越智能”——角色重叠时会互相等待、重复劳动。\n<\/li><li>\n别以为“加了护栏就一定安全”——护栏本身要有测试，否则只是装饰。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n什么任务不适合多智能体？（答案：子任务接口不清、强顺序依赖、单模型加工具即可完成。）\n<\/li><li>\n审批点应设在哪里？（答案：不可逆、高风险、对外产生实际影响的动作前。）\n<\/li><li>\n评估为什么不能只看成功率？（答案：会鼓励冒险与越权，忽略合规、成本与延迟。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n多智能体看接口，不看数量。\n<\/li><li>\n审批点 = 不可逆动作前。\n<\/li><li>\n护栏三层：输入、执行、输出；评估三层：效果、合规、成本。\n<\/ul>", "c01": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.27<\/div><h1>提示链<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把任务拆成固定顺序的多步提示，上一步输出作为下一步输入。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“一次生成”变成“可检查的流水线”，显著降低复杂任务的遗漏率。<\/p>\n<h2>详解<\/h2>\n<p>典型三步：抽取结构化信息 → 校验/补全 → 按模板生成。每一步都要求模型输出可解析的中间格式（JSON、清单），便于程序检查。链式不适合需要来回探索的任务，那种任务要用规划循环。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n链越长越好；实际上每步都可能引入误差。\n<\/li><li>\n中间结果不需要校验；实际上链式的价值就在中间可查。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n路由、反思、规划\n<\/ul>", "c02": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.40<\/div><h1>路由<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>先判断请求类型，再分派给对应的处理分支。<\/p>\n<h2>为什么重要<\/h2>\n<p>不同请求需要不同提示、模型与工具；一套提示包打天下会把简单问题复杂化、把专业问题做浅。<\/p>\n<h2>详解<\/h2>\n<p>分类器输出标签 + 置信度；低置信度走追问或兜底。路由标签要互斥且覆盖真实流量，不要为长尾造几十个分支。路由错误会直接导致后续全错，所以分类评估要单独做。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n只按关键词路由；实际上同一词在不同语境下意图不同。\n<\/li><li>\n不设兜底分支；分类失败时系统直接卡死。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n提示链、并行\n<\/ul>", "c03": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.50<\/div><h1>并行化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把互不依赖的子任务同时执行，再汇总结果。<\/p>\n<h2>为什么重要<\/h2>\n<p>缩短墙钟时间；投票式并行还能降低单次生成的随机错误。<\/p>\n<h2>详解<\/h2>\n<p>两种形态：分段并行（长文档切块）与投票并行（同一问题多解）。并行前必须确认子任务无共享状态、无顺序依赖。汇总环节要设去重与冲突解决规则，否则结果互相矛盾。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n并行能省 token；其实总 token 往往更多。\n<\/li><li>\n所有子任务都能并行；有依赖的步骤并行会放大错误。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n提示链、多智能体\n<\/ul>", "c04": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.61<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">提示链<\/a><\/span><\/div><h1>反思<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>按明确标准检查草稿，并据此修订的循环。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“一次成稿”变成“生成—批评—修订”，是提升质量最便宜的手段之一。<\/p>\n<h2>详解<\/h2>\n<p>有效反思需要三件东西：rubric（逐条标准）、证据（测试结果/检索原文/计算结果）、上限（最多两三轮）。没有证据的反思只是让模型换个说法。批评者可以是另一个模型，也可以是人类，但标准必须一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n“请改进”就是反思；没有标准的改进会漂移。\n<\/li><li>\n反思越多越好；无新信息的循环会自我强化错误。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n规划、评估\n<\/ul>", "c05": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.73<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">提示链<\/a><\/span><\/div><h1>工具调用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>模型输出结构化调用请求，由外部系统执行并回传结果。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让模型能查数据、算数、操作软件，而不只是生成文本。<\/p>\n<h2>详解<\/h2>\n<p>设计要点：窄 schema、枚举参数、清晰描述、幂等与可回滚、可读错误。工具返回要给模型“下一步能做什么”的信息，例如“缺少参数 date，请补充”。权限按最小化原则配置，危险操作加审批。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n工具越多越好；描述重叠会导致乱选。\n<\/li><li>\n失败返回空值即可；模型无法区分“没有结果”和“调用失败”。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\nMCP、护栏、规划\n<\/ul>", "c06": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.87<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">反思<\/a><\/span><\/div><h1>规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把目标拆成有序子任务，并在执行中根据观察重规划。<\/p>\n<h2>为什么重要<\/h2>\n<p>多步任务容易迷路；计划提供了路线与验收点。<\/p>\n<h2>详解<\/h2>\n<p>计划粒度以“每步可验收”为准。执行循环：选下一步 → 执行 → 对照检查点 → 通过则继续，不通过则反思/重规划。计划要显式记录假设，假设被推翻时才能知道该改哪一段。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n计划一次定死；实际环境变化时必须重规划。\n<\/li><li>\n计划越细越好；过细会耗尽上下文并降低灵活性。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n反思、工具调用、多智能体\n<\/ul>", "c07": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.175<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">工具调用<\/a><\/span><\/div><h1>RAG（检索增强生成）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>先从外部知识库检索相关片段，再把它放进上下文让模型基于材料回答。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让回答可引用、可更新，缓解模型知识过时与幻觉。<\/p>\n<h2>详解<\/h2>\n<p>流程：切块 → 索引 → 查询改写 → 召回 → 重排 → 拼接 → 生成引用。失败多发生在检索：块切得太碎失去上下文，查询与文档措辞不一致，top-k 太大稀释重点。对策：重叠切块、混合检索、重排、限制引用数量。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n有 RAG 就不会幻觉；材料没召回到时照样会编。\n<\/li><li>\n向量检索万能；精确术语与编号用关键词检索更稳。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n记忆、MCP\n<\/ul>", "c08": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.97<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">规划<\/a><\/span><\/div><h1>多智能体协作<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>多个带角色的智能体通过消息传递分工完成同一任务。<\/p>\n<h2>为什么重要<\/h2>\n<p>适合可拆分、可并行、需要不同专业视角的任务；也便于把责任边界写清楚。<\/p>\n<h2>详解<\/h2>\n<p>常见角色：规划者、执行者、批评者、汇总者。设计重点是接口：每个智能体输入什么、输出什么格式、谁负责最终汇总。通信要有共享状态与冲突解决规则，否则会重复劳动或互相覆盖。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n智能体数量越多越强；角色重叠会增加协调成本。\n<\/li><li>\n多智能体一定比单智能体准；没有清晰接口时更不稳定。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n并行、规划、人机协作\n<\/ul>", "c09": "<div class=\"source-badge\">📖 出处：Agentic Design Patterns · p.229<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">工具调用<\/a><\/span><\/div><h1>护栏<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在输入、执行、输出三个环节设置的可拦截检查。<\/p>\n<h2>为什么重要<\/h2>\n<p>智能体会产生实际副作用；护栏把“出错”限制在可恢复范围内。<\/p>\n<h2>详解<\/h2>\n<p>输入层查注入与敏感信息；执行层做权限最小化、沙箱、速率限制；输出层查事实、格式、引用。护栏要能被测试：构造攻击样例与误报样例，测量拦截率与误伤率。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n末端过滤就够了；执行中的越权动作已经造成影响。\n<\/li><li>\n加了护栏就安全；未测试的护栏只是心理安慰。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n工具调用、人机协作、评估\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：基础编排：链、路由、并行<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：链式、路由与并行<\/a><br>检查点：能给三个不同任务各画出执行图<\/li><li class='path-step' id='path-02'><strong>步骤 02：自我改进：反思、工具、规划<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：反思、工具与规划<\/a><br>检查点：能写出工具 schema 与重规划条件<\/li><li class='path-step' id='path-03'><strong>步骤 03：上下文：记忆、RAG、MCP<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：记忆、检索与上下文协议<\/a><br>检查点：能设计带引用的检索流程<\/li><li class='path-step' id='path-04'><strong>步骤 04：系统化：多智能体、人、护栏<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：多智能体、人机协作与护栏<\/a><br>检查点：能列出审批点与三层护栏<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 会议纪要转待办最适合？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 路由<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 链式<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 并行投票<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 多智能体<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 客服按问题类型走不同提示，用什么模式？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 链式<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 路由<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 反思<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> RAG<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c03' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> 并行化最适合？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 有强顺序依赖的步骤<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 互不依赖的子任务<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 需要人工审批的动作<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 单轮问答<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c04' data-chapter='ch02'><p class='quiz-q'><b>Q4.<\/b> 有效反思不需要下列哪项？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 明确 rubric<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 外部证据<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 轮次上限<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 更长的提示<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c05' data-chapter='ch02'><p class='quiz-q'><b>Q5.<\/b> 工具调用失败时最好的返回是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 空字符串<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> null<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 可读错误与可尝试的下一步<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 抛出异常终止<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='blank' data-concept='c06' data-chapter='ch02'><p class='quiz-q'><b>Q6.<\/b> 计划每一步都应有可验证的 ______。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q7.<\/b> 长期记忆最适合存？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 一次性任务指令<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 稳定偏好与长期事实<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 完整聊天记录<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 临时变量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q8.<\/b> RAG 最常见的失败环节是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 生成<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 检索与切块<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 用户输入<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 模型选择<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q9.<\/b> MCP 主要解决？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 模型推理速度<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 工具连接方式碎片化<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 训练数据质量<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 前端样式<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q10.<\/b> 审批点应设在哪里？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 每个模型调用前<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 不可逆动作前<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 输出之后<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 只在系统启动时<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q11.<\/b> 评估智能体为什么不能只看成功率？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 成功率无法计算<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 会鼓励冒险与越权<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 成本不重要<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 用户不看指标<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q12.<\/b> 什么任务不适合多智能体？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 可拆分的并行任务<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 需要不同专业视角<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 子任务接口不清且强依赖<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 大规模文档处理<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：链式、路由与并行<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 会议纪要转待办最适合？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 路由<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 链式<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 并行投票<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 多智能体<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 客服按问题类型走不同提示，用什么模式？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 链式<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 路由<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 反思<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> RAG<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/d <label class='quiz-opt'><input type='radio' name='q09' value='3'> 前端样式<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：多智能体、人机协作与护栏<\/h1><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 审批点应设在哪里？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 每个模型调用前<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 不可逆动作前<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 输出之后<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 只在系统启动时<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 评估智能体为什么不能只看成功率？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 成功率无法计算<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 会鼓励冒险与越权<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 成本不重要<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 用户不看指标<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q3.<\/b> 什么任务不适合多智能体？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 可拆分的并行任务<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 需要不同专业视角<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 子任务接口不清且强依赖<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 大规模文档处理<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='提示链'>提示链 — 固定顺序的多步提示，上一步输出作为下一步输入 <span class=glossary-ref>（第 1 章：链式、路由与并行）<\/span><\/li><li data-term='路由'>路由 — 先分类再分派到不同处理分支 <span class=glossary-ref>（第 1 章：链式、路由与并行）<\/span><\/li><li data-term='并行化'>并行化 — 互不依赖的子任务同时执行后汇总 <span class=glossary-ref>（第 1 章：链式、路由与并行）<\/span><\/li><li data-term='反思'>反思 — 按明确标准检查并修订输出的循环 <span class=glossary-ref>（第 2 章：反思、工具与规划）<\/span><\/li><li data-term='工具调用'>工具调用 — 模型输出结构化请求，由外部执行并回传结果 <span class=glossary-ref>（第 2 章：反思、工具与规划）<\/span><\/li><li data-term='规划'>规划 — 把目标拆成可验收的子任务并动态调整 <span class=glossary-ref>（第 2 章：反思、工具与规划）<\/span><\/li><li data-term='工作记忆'>工作记忆 — 当前上下文窗口中的信息 <span class=glossary-ref>（第 3 章：记忆、检索与上下文协议）<\/span><\/li><li data-term='长期记忆'>长期记忆 — 跨会话保存、按需召回的事实与偏好 <span class=glossary-ref>（第 3 章：记忆、检索与上下文协议）<\/span><\/li><li data-term='rag'>RAG — 检索外部片段后基于材料生成并引用 <span class=glossary-ref>（第 3 章：记忆、检索与上下文协议）<\/span><\/li><li data-term='mcp'>MCP — 标准化模型与外部工具/资源/提示连接的协议 <span class=glossary-ref>（第 3 章：记忆、检索与上下文协议）<\/span><\/li><li data-term='多智能体'>多智能体 — 多个带角色的智能体通过消息分工完成任务 <span class=glossary-ref>（第 4 章：多智能体、人机协作与护栏）<\/span><\/li><li data-term='人机协作'>人机协作 — 在关键动作前引入人工审批或确认 <span class=glossary-ref>（第 4 章：多智能体、人机协作与护栏）<\/span><\/li><li data-term='护栏'>护栏 — 输入、执行、输出三层的可拦截检查 <span class=glossary-ref>（第 4 章：多智能体、人机协作与护栏）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：分诊再流水线<\/h2>\n<p>先路由，再在分支内用链式；不要把所有逻辑塞进一个提示。<\/p>\n<h2>模式 2：生成者与批评者分离<\/h2>\n<p>让批评者只看标准与证据，不看生成者的解释，避免自我附和。<\/p>\n<h2>模式 3：计划—执行—验收循环<\/h2>\n<p>每一步都写检查点；失败回到计划层，不在错误结果上继续。<\/p>\n<h2>模式 4：最小权限工具<\/h2>\n<p>只给完成任务必需的工具与参数范围；危险动作加审批与回滚。<\/p>\n<h2>模式 5：检索先重排<\/h2>\n<p>召回多、进上下文少；引用逐条标注，检索不到就明说。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>选模式<\/h2>\n<ul><li>\n步骤固定有顺序 → 提示链\n<\/li><li>\n输入类型多 → 路由\n<\/li><li>\n子任务独立 → 并行\n<\/li><li>\n质量不够 → 反思\n<\/li><li>\n需要外部动作 → 工具\n<\/li><li>\n多步开放任务 → 规划\n<\/li><li>\n需要可引用知识 → RAG\n<\/li><li>\n可拆分的专业分工 → 多智能体\n<\/ul>\n<h2>设计检查<\/h2>\n<ul><li>\n每步有可验收的中间产物\n<\/li><li>\n工具有窄 schema 与可读错误\n<\/li><li>\n不可逆动作前有人工审批\n<\/li><li>\n输入/执行/输出三层护栏\n<\/li><li>\n评估看成功率、合规率、成本\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n一条超长提示包打天下\n<\/li><li>\n无标准反思\n<\/li><li>\n工具失败静默返回空\n<\/li><li>\n只做事后内容过滤\n<\/ul>"}};

/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}
