inline\">30<\/span> 上提；左 <span class=\"katex-inline\">X=[10,20]<\/span>，右 <span class=\"katex-inline\">Y=[40,50]<\/span>，各 <span class=\"katex-inline\">t-1=2<\/span> 键。父节点插入 <span class=\"katex-inline\">30<\/span> 后接左右两指针。<\/p>\n<p>对照 <span class=\"katex-inline\">t=2<\/span>：满节点 3 键 <span class=\"katex-inline\">[a,b,c]<\/span>，中间 <span class=\"katex-inline\">b<\/span> 上提，左右各 1 键；分裂粒度更细，树高相应更高。<\/p>\n<h3>算例 2：百万级关键字的高度估算<\/h3>\n<p><span class=\"katex-inline\">n=10^6<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">t=10<\/span>：<span class=\"katex-inline\">h\\approx\\log_{10}10^6=6<\/span>，路径读约 6 个节点。\n<\/li><li>\n<span class=\"katex-inline\">t=100<\/span>：<span class=\"katex-inline\">h\\approx\\log_{100}10^6=3<\/span>，路径读约 3 个节点。\n<\/ul>\n<p>二叉平衡树同规模 <span class=\"katex-inline\">h\\approx\\log_2 10^6\\approx 20<\/span>。宽节点把外存路径 I/O 从二十次量级压到个位数。<\/p>\n<h3>算例 3：节点宽度折算<\/h3>\n<p>页块 4KB（4096 字节），关键字 8 字节，子树指针 8 字节。节点存 <span class=\"katex-inline\">k<\/span> 个键加 <span class=\"katex-inline\">k+1<\/span> 个指针，占用 <span class=\"katex-inline\">8k+8(k+1)=16k+8<\/span> 字节。留页头余量后 <span class=\"katex-inline\">16k\\le 4000<\/span>，<span class=\"katex-inline\">k\\le 250<\/span>；取 <span class=\"katex-inline\">2t-1\\le 250<\/span>，<span class=\"katex-inline\">t\\le 125<\/span>。实际取值还要考虑变长键与块校验，<span class=\"katex-inline\">t<\/span> 按页内可用空间反推。<\/p>\n<h2>对抗性追问<\/h2>\n<p><strong>追问一：B 树节点为什么不全放成一页那么宽？<\/strong> 宽度受上下限双向约束：过窄退回二叉高树，过宽单节点跨块读取；页内可用空间决定 <span class=\"katex-inline\">t<\/span>，超出部分要跨块，缓存与传输代价上升。<\/p>\n<p><strong>追问二：分裂会不会改变已有关键字的相对次序？<\/strong> 不改变。分裂只把满节点切成左右两支并上提中间键，节点内非降序与跨节点区间次序保持；搜索定位路径随分裂调整。<\/p>\n<p><strong>追问三：删除时为什么先借兄弟、再合并？<\/strong> 借兄弟不增加节点总数，父子键旋转即可补足下限；兄弟无富余才合并，合并是兜底手段。顺序反过来会产生不必要的节点合并与后续再分裂。<\/p>\n<h2>延伸推演：搜索路径、分裂上推与合并细节<\/h2>\n<h3>B 树搜索的层内定位<\/h3>\n<p>每层进入节点后，在有序关键字序列中找目标区间，选定下一层子树指针；节点内扫描是线性或二分比较，跨层下降才是磁盘 I/O。搜索路径长度等于树高，节点内比较代价相对 I/O 可忽略，这也是宽节点划算的原因。<\/p>\n<h3>分裂向上传递的边界<\/h3>\n<p>满节点分裂后父节点多一个关键字；父若随之达到 <span class=\"katex-inline\">2t-1<\/span>，继续向上分裂。根分裂时树高增加一层。分裂不改动已有叶层深度，只在满节点处扩出兄弟。<\/p>\n<h3>合并的三种位置<\/h3>\n<p>欠键节点先看两侧兄弟：兄弟富余则旋转一关键字到欠键节点，父中分隔键下沉；兄弟紧则三者合并。父欠键时重复过程，根剩一键时树高减一层。合并保持叶层不变，节点数减少。<\/p>\n<h3>第二算例：<span class=\"katex-inline\">t=3<\/span> 的插入与分裂<\/h3>\n<p>节点上限 <span class=\"katex-inline\">2t-1=5<\/span>，下限 <span class=\"katex-inline\">t-1=2<\/span>。<\/p>\n<p>插入序列向某节点累积：<span class=\"katex-inline\">[5,10,15,20,25]<\/span> 已满。分裂：中间键 <span class=\"katex-inline\">15<\/span> 上提父节点；左节点 <span class=\"katex-inline\">[5,10]<\/span>，右节点 <span class=\"katex-inline\">[20,25]<\/span>，各 2 键达下限。父节点插入 <span class=\"katex-inline\">15<\/span> 后若达 5 键，按同规则继续向上。<\/p>\n<p>对照 <span class=\"katex-inline\">t=2<\/span>：上限 3 键，满节点 <span class=\"katex-inline\">[a,b,c]<\/span> 中间 <span class=\"katex-inline\">b<\/span> 上提，左右各 1 键；分裂粒度细，树高相应更高。<\/p>\n<h3>节点宽度与工程取舍<\/h3>\n<p>页块内除关键字与子指针，还有页头、位示、校验等元数据；<span class=\"katex-inline\">t<\/span> 按可用空间反推。关键字变长时还要留余量。过窄退回二叉高树，过宽跨块读取，两端都有代价，取值落在页内容量区间。<\/p>\n<h3>对抗性追问补充<\/h3>\n<p><strong>追问四：B 树节点为什么不存数据记录本身？<\/strong> 教材 B 树节点存关键字与子指针，记录留在叶层或外部存储；节点保持紧凑，单层能覆盖更多分支。实际数据库索引多为 B 树变体，叶层挂数据指针。<\/p>\n<p><strong>追问五：删除会不会让叶层深度变浅？<\/strong> 普通合并只减节点数，叶层不变；只有根退化到单键时整树高减一层。搜索路径深度由叶层一致性保障。<\/p>\n<h2>逐层推导补遗<\/h2>\n<h3>度数区间的设计理由<\/h3>\n<p>下限 <span class=\"katex-inline\">t-1<\/span> 保证节点不至于过碎：若节点只放一键，分支退化成二叉，树高失控。上限 <span class=\"katex-inline\">2t-1<\/span> 对齐页块容量：节点超宽则单节点跨块读取。上下限配套，插入分裂、删除合并不出区间。子树个数随关键字数加 1，区间 <span class=\"katex-inline\">[t,2t]<\/span>。<\/p>\n<h3>分裂不变式核验<\/h3>\n<p>满节点 <span class=\"katex-inline\">2t-1<\/span> 键，中间第 <span class=\"katex-inline\">t<\/span> 键上提；左留 <span class=\"katex-inline\">t-1<\/span>，右留 <span class=\"katex-inline\">t-1<\/span>。分裂后两节点恰达下限，父多一键未超上限即停。区间划分由上提键隔开：左段全小于它，右段全大于它，搜索路径不重不漏。父满则继续上分裂，根分裂树高加一层。<\/p>\n<h3>合并不变式核验<\/h3>\n<p>欠键节点先借兄弟：兄弟 <span class=\"katex-inline\">\\ge t<\/span> 键时旋转一键过来，父分隔键下沉，次序父子兄弟间调整。兄弟仅 <span class=\"katex-inline\">t-1<\/span> 时三者合并：<span class=\"katex-inline\">(t-1)+1+(t-1)=2t-1<\/span>，父减一键。合并后节点回到上限内，叶层深度不变；父欠键重复，根剩一键树高减一层。<\/p>\n<h3>I/O 度量口径<\/h3>\n<p>树高即路径磁盘块读取次数。<span class=\"katex-inline\">t<\/span> 分支每层，第 <span class=\"katex-inline\">h<\/span> 层叶区间至少 <span class=\"katex-inline\">t^h<\/span>，<span class=\"katex-inline\">n<\/span> 个关键字要求 <span class=\"katex-inline\">t^h\\ge n<\/span>，<span class=\"katex-inline\">h=O(\\log_t n)<\/span>。<span class=\"katex-inline\">t<\/span> 以对数底数身份压低高度；二叉平衡树 <span class=\"katex-inline\">h=O(\\lg_2 n)<\/span>，宽节点把路径 I/O 从二十次量级压到个位数。<\/p>\n<h3>节点宽度折算步骤<\/h3>\n<p>页块容量减去页头、位示、校验等元数据，余留空间分配给 <span class=\"katex-inline\">k<\/span> 个关键字与 <span class=\"katex-inline\">k+1<\/span> 个子指针。关键字长、指针长代入，解出 <span class=\"katex-inline\">k<\/span> 上限，再定 <span class=\"katex-inline\">t<\/span>。变长键还要留余量；实际取值在页内可用空间与分裂频率之间折中。<\/p>\n<h2>边界与常见误读补充<\/h2>\n<p>B 树宽节点在内存中单次扫描比二叉结点略贵，代价被 I/O 次数下降抵消；纯内存场景红黑树可能更划算。节点宽度对齐页块是工程折算，<span class=\"katex-inline\">t<\/span> 还要为变长键与页头元数据留余量。节点过窄退回二叉高树，过宽跨块读取；分裂上推只在满节点发生，合并兜底欠键节点，叶层深度在增删中保持一致。B 树节点存关键字与子指针，数据记录留在叶层或外部存储，节点保持紧凑以覆盖更多分支选择。搜索每层进入节点后在有序关键字序列中找区间，选定下一层指针；节点内比较相对磁盘 I/O 可忽略，宽节点划算的原因正在于此。分裂不改动已有叶层深度，只在满节点处扩出兄弟；合并减节点数，根退化到单键时树高才减一层。<span class=\"katex-inline\">t<\/span> 分支每层，第 <span class=\"katex-inline\">h<\/span> 层叶区间至少 <span class=\"katex-inline\">t^h<\/span>，<span class=\"katex-inline\">n<\/span> 个关键字要求 <span class=\"katex-inline\">t^h\\ge n<\/span>，故 <span class=\"katex-inline\">h=O(\\log_t n)<\/span>；<span class=\"katex-inline\">t<\/span> 以对数底数身份压低路径 I/O 次数。节点宽度折算时先扣页头与校验余量，再把关键字长与子指针长代入解出 <span class=\"katex-inline\">k<\/span> 上限。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出度数 <span class=\"katex-inline\">t<\/span> 约束下节点关键字个数与子树个数区间。\n<\/li><li>\n满节点分裂时中间键去向何处？左右节点各分多少键？\n<\/li><li>\n欠键节点先借兄弟、再三者合并，两种方式各补足多少键？\n<\/li><li>\nB 树高度为什么是 <span class=\"katex-inline\">O(\\log_t n)<\/span>？节点分支数怎样进入树高公式？\n<\/li><li>\n节点宽度对齐磁盘页大小的理由是什么？过窄与过宽各有什么代价？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "B 树的分裂/合并与磁盘 I/O 度量：节点大小为什么按页取"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.356<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">渐近记号：Θ、O、Ω 的定义差异与常见误用<\/a><\/span><\/div><h1>图的 BFS/DFS 与最短路径松弛：Dijkstra 正确性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3 章（原书第 22 章 图的基本表示、22.2 BFS、22.3 DFS，PDF 第 356 页起；第 24 章 24.3 Dijkstra，PDF 第 389 页起）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>图算法先回答两类问题：从起点能到达哪些结点、按什么顺序到达；带权图上起点到各结点的最短距离是多少。遍历靠队列或栈扩展邻接结点，最短路靠反复松弛边距离估计。Dijkstra 是非负权图上的单源最短路算法，它的正确性不能只凭“每次选最近结点”的直觉，要落到已确定集合的不变式与反证链条上。这个概念讲清 BFS/DFS 的遍历结构、松弛规则，以及 Dijkstra 为什么在非负权前提下求出真实最短路。<\/p>\n<h2>定义与符号逐项拆<\/h2>\n<p><strong>图的表示<\/strong>：邻接表为每个结点挂一条出边链表；邻接矩阵用 <span class=\"katex-inline\">n\\times n<\/span> 数组记录边权。稀疏图用邻接表省空间，稠密图邻接矩阵定位快。<\/p>\n<p><strong>BFS（广度优先搜索）<\/strong>：起点入队，反复出队一个结点，把未访问邻结点入队并记录前驱。队列保证结点按距起点的层数顺序被处理。<\/p>\n<p><strong>DFS（深度优先搜索）<\/strong>：从起点沿一条邻接链深入到底，无路可走再回溯；递归栈或显式栈记录路径。DFS 记录发现时间与完成时间，用于拓扑排序、连通分量与环检测。<\/p>\n<p><strong>松弛<\/strong>：对边 <span class=\"katex-inline\">(u,v)<\/span>，当前距离估计 <span class=\"katex-inline\">d[u]<\/span>、<span class=\"katex-inline\">d[v]<\/span>，边权 <span class=\"katex-inline\">w(u,v)<\/span>。若 <span class=\"katex-inline\">d[u]+w(u,v)&amp;lt;d[v]<\/span>，更新 <span class=\"katex-inline\">d[v]=d[u]+w(u,v)<\/span>，记 <span class=\"katex-inline\">v<\/span> 前驱为 <span class=\"katex-inline\">u<\/span>。<\/p>\n<p><strong>Dijkstra<\/strong>：维护未确定结点集合 <span class=\"katex-inline\">V-S<\/span>，每轮选 <span class=\"katex-inline\">d<\/span> 最小的结点 <span class=\"katex-inline\">u<\/span> 加入已确定集合 <span class=\"katex-inline\">S<\/span>，松弛 <span class=\"katex-inline\">u<\/span> 的全部出边，直到 <span class=\"katex-inline\">V-S<\/span> 空。<\/p>\n<h2>原理推导<\/h2>\n<h3>BFS 的层数性质<\/h3>\n<p>BFS 队列按层扩展：第 0 层起点，第 1 层邻接点，第 2 层邻接的邻接点。归纳可得：结点 <span class=\"katex-inline\">v<\/span> 第一次被发现时，队列中的层数等于起点到 <span class=\"katex-inline\">v<\/span> 的无权最短路长度。同层结点距离相同，先入队先扩展。<\/p>\n<h3>DFS 的回溯结构<\/h3>\n<p>DFS 沿未访问邻结点深入；分支走完回到上一层继续选择。发现时间标记结点首次进入，完成时间标记分支退出；父子边、回边、横边在遍历树中分类。DFS 不直接给距离，它给出可达性与结构时序。<\/p>\n<h3>松弛不变式<\/h3>\n<p>初始化 <span class=\"katex-inline\">d[s]=0<\/span>，其余 <span class=\"katex-inline\">d[v]=\\infty<\/span>。任何时刻 <span class=\"katex-inline\">d[v]\\ge\\delta(v)<\/span>，<span class=\"katex-inline\">\\delta(v)<\/span> 为真实最短路长度：每次松弛只在找到更短路径时更新，估计不会低于真实值；松弛反复进行，估计逐步下降逼近 <span class=\"katex-inline\">\\delta(v)<\/span>。<\/p>\n<h3>Dijkstra 正确性反证<\/h3>\n<p>待证：结点加入 <span class=\"katex-inline\">S<\/span> 时 <span class=\"katex-inline\">d[u]=\\delta(u)<\/span>。设 <span class=\"katex-inline\">u<\/span> 是第一个加入 <span class=\"katex-inline\">S<\/span> 时 <span class=\"katex-inline\">d[u]&amp;gt;\\delta(u)<\/span> 的结点。<span class=\"katex-inline\">S<\/span> 内结点由归纳距离已确定。取真实最短路 <span class=\"katex-inline\">s\\leadsto u<\/span>，设路径上第一个不在 <span class=\"katex-inline\">S<\/span> 的结点 <span class=\"katex-inline\">y<\/span>，其前驱 <span class=\"katex-inline\">x\\in S<\/span>。松弛 <span class=\"katex-inline\">(x,y)<\/span> 后 <span class=\"katex-inline\">d[y]\\le d[x]+w(x,y)=\\delta(y)<\/span>。边权非负，<span class=\"katex-inline\">\\delta(y)\\le\\delta(u)<\/span>；选 <span class=\"katex-inline\">u<\/span> 时 <span class=\"katex-inline\">d[u]<\/span> 是 <span class=\"katex-inline\">V-S<\/span> 最小，<span class=\"katex-inline\">d[u]\\le d[y]<\/span>。串联得 <span class=\"katex-inline\">d[u]\\le d[y]\\le\\delta(y)\\le\\delta(u)<\/span>，与 <span class=\"katex-inline\">d[u]&amp;gt;\\delta(u)<\/span> 矛盾。故 <span class=\"katex-inline\">u<\/span> 入 <span class=\"katex-inline\">S<\/span> 时距离正确，归纳覆盖全部结点。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：BFS 用于无权或等权图；Dijkstra 要求所有边权非负；图可有向可无向。<\/p>\n<p>边界一：出现负权边，<span class=\"katex-inline\">\\delta(y)\\le\\delta(u)<\/span> 不再保证，已入 <span class=\"katex-inline\">S<\/span> 结点的距离可能被后续负权边改短，Dijkstra 结论失效；负权场景用 Bellman-Ford 一类允许反复松弛的算法。<\/p>\n<p>边界二：BFS 不能直接用于带权最短路，边权不等时层数不代表距离。<\/p>\n<p>边界三：DFS 递归深度受栈容量限制，大图需显式栈改写；遍历时间 <span class=\"katex-inline\">O(V+E)<\/span> 对两种搜索相同。<\/p>\n<p>失败案例：给含负权环的图跑 Dijkstra，已确定集合不再回头更新，输出距离偏长；或把 BFS 层数当带权距离，忽略边权差异。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>BFS vs DFS<\/strong>：BFS 队列按层，求无权最短路与层序；DFS 栈式深入，求连通结构、拓扑序与环检测。两者遍历时间同为 <span class=\"katex-inline\">O(V+E)<\/span>，用途由遍历顺序决定。\n<\/li><li>\n<strong>松弛 vs 贪心选点<\/strong>：松弛更新距离估计，是局部操作；Dijkstra 的贪心是每轮选最小估计结点收口。松弛在所有最短路算法中通用，选点策略才区分算法。\n<\/li><li>\n<strong>最短路 vs 最小生成树<\/strong>：最短路关心起点到各点的路径长度；MST 关心覆盖全部结点的边集总权最小。两者都用安全边思想，但优化目标与边取舍规则不同。\n<\/li><li>\n<strong>邻接表 vs 邻接矩阵<\/strong>：表省空间、适合稀疏图，矩阵定位 <span class=\"katex-inline\">O(1)<\/span>、适合稠密图；表示选择影响遍历常数，不改变算法阶。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的阶语言陈述 <span class=\"katex-inline\">O(V+E)<\/span> 与对数优先队列操作；概念 c03 堆是 Dijkstra 优先队列的底层实现之一。后继：第 4 章概念 c12 摊还分析针对动态表一类结构的操作均摊；概念 c13 NP 完全性讨论的困难问题，其多项式算法障碍与本章最短路的多项式解法形成对照。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（图的 BFS/DFS 与最短路径松弛：Dijkstra 正确性）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：遍历结构、松弛不变式与 Dijkstra 正确性链条<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把图算法推通，先往回追四层：<\/p>\n<ol><li>\n<strong>图上问题先分遍历与最短路两类<\/strong>。遍历回答可达性与顺序，结构基础是邻接表或邻接矩阵；最短路回答距离，结构基础是距离估计与边松弛。\n<\/li><li>\n<strong>遍历顺序由队列或栈决定<\/strong>：BFS 队列先进先出，按层扩展；DFS 栈后进先出，深入回溯。两种遍历时间同为 <span class=\"katex-inline\">O(V+E)<\/span>，顺序差别决定用途。\n<\/li><li>\n<strong>最短路分析维护一个距离上界不变式<\/strong>：<span class=\"katex-inline\">d[v]\\ge\\delta(v)<\/span>，松弛只在找到更短路径时下压估计；算法终止条件是估计不再下降。\n<\/li><li>\n<strong>Dijkstra 的选点规则要靠非负权托底<\/strong>：每轮选最小估计结点收口，反证链条中“路径前缀不超过后缀”这一步依赖边权非负；前提破裂，正确性证明随之失效。\n<\/ol>\n<p>依赖链方向：图表示 → 遍历结构（BFS/DFS） → 距离估计与松弛 → 非负权下选点收口 → Dijkstra 最短路正确。<\/p>\n<h2>正向推导：从遍历到正确性证明<\/h2>\n<h3>BFS 层序推演<\/h3>\n<p>起点 <span class=\"katex-inline\">s<\/span> 标记已访问并入队。循环：出队 <span class=\"katex-inline\">u<\/span>，扫描每条出边 <span class=\"katex-inline\">(u,v)<\/span>；<span class=\"katex-inline\">v<\/span> 未访问则标记、记前驱、入队。队列性质：第 <span class=\"katex-inline\">k<\/span> 层结点全部在第 <span class=\"katex-inline\">k+1<\/span> 层结点之前出队。<\/p>\n<p>归纳：起点层 0 距离 0；设第 <span class=\"katex-inline\">k<\/span> 层结点距离为 <span class=\"katex-inline\">k<\/span>，其邻接未访问结点进入第 <span class=\"katex-inline\">k+1<\/span> 层，距离 <span class=\"katex-inline\">k+1<\/span>。BFS 首次发现结点的队列层数即无权最短路长度。<\/p>\n<h3>DFS 回溯推演<\/h3>\n<p>递归过程：标记结点发现时间，对每条未访问邻边递归；分支全部退出后记录完成时间。显式栈版本把待扩展邻边压栈，回溯时弹回上层。DFS 遍历树由父子边构成，其余边按方向分为回边、横边、前向边，环检测依赖回边识别。<\/p>\n<h3>松弛规则与不变式<\/h3>\n<p>边 <span class=\"katex-inline\">(u,v)<\/span> 松弛：比较 <span class=\"katex-inline\">d[u]+w(u,v)<\/span> 与 <span class=\"katex-inline\">d[v]<\/span>，更小则更新 <span class=\"katex-inline\">d[v]<\/span> 与前驱。不变式 <span class=\"katex-inline\">d[v]\\ge\\delta(v)<\/span>：初始 <span class=\"katex-inline\">\\infty\\ge\\delta<\/span>；更新后新 <span class=\"katex-inline\">d[v]<\/span> 是某条具体路径长度，真实最短路不劣于它，故 <span class=\"katex-inline\">d[v]<\/span> 仍不低于 <span class=\"katex-inline\">\\delta(v)<\/span>。若算法终止时 <span class=\"katex-inline\">d[v]<\/span> 不再下降，<span class=\"katex-inline\">d[v]=\\delta(v)<\/span>。<\/p>\n<h3>Dijkstra 反证逐步<\/h3>\n<p>记号：<span class=\"katex-inline\">S<\/span> 为已确定最短距离结点集合，<span class=\"katex-inline\">d<\/span> 为当前估计。<\/p>\n<p>第一步，归纳起点：<span class=\"katex-inline\">s<\/span> 入 <span class=\"katex-inline\">S<\/span> 时 <span class=\"katex-inline\">d[s]=0=\\delta(s)<\/span>，成立。<\/p>\n<p>第二步，反证设定：设 <span class=\"katex-inline\">u<\/span> 是第一个入 <span class=\"katex-inline\">S<\/span> 时 <span class=\"katex-inline\">d[u]&amp;gt;\\delta(u)<\/span> 的结点。此前入 <span class=\"katex-inline\">S<\/span> 的结点距离均已正确。<\/p>\n<p>第三步，取真实最短路 <span class=\"katex-inline\">s\\leadsto u<\/span>。沿路径找第一个不在 <span class=\"katex-inline\">S<\/span> 的结点 <span class=\"katex-inline\">y<\/span>，其前驱 <span class=\"katex-inline\">x\\in S<\/span>。<span class=\"katex-inline\">x<\/span> 入 <span class=\"katex-inline\">S<\/span> 时距离正确，松弛 <span class=\"katex-inline\">(x,y)<\/span> 后 <span class=\"katex-inline\">d[y]\\le d[x]+w(x,y)=\\delta(y)<\/span>。<\/p>\n<p>第四步，非负权给出 <span class=\"katex-inline\">\\delta(y)\\le\\delta(u)<\/span>：路径 <span class=\"katex-inline\">s\\leadsto y\\leadsto u<\/span>，边权非负，前缀长度不超过整条长度。<\/p>\n<p>第五步，选点规则给出 <span class=\"katex-inline\">d[u]\\le d[y]<\/span>：<span class=\"katex-inline\">u<\/span> 是本轮 <span class=\"katex-inline\">V-S<\/span> 中 <span class=\"katex-inline\">d<\/span> 最小者，<span class=\"katex-inline\">y<\/span> 也在 <span class=\"katex-inline\">V-S<\/span>。<\/p>\n<p>第六步，串联 <span class=\"katex-inline\">d[u]\\le d[y]\\le\\delta(y)\\le\\delta(u)<\/span>，与设定 <span class=\"katex-inline\">d[u]&amp;gt;\\delta(u)<\/span> 矛盾。故 <span class=\"katex-inline\">u<\/span> 入 <span class=\"katex-inline\">S<\/span> 时距离正确，归纳推及全部结点。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：无权图 BFS 距离<\/h3>\n<p>图：<span class=\"katex-inline\">s<\/span> 连 <span class=\"katex-inline\">a,b<\/span>；<span class=\"katex-inline\">a<\/span> 连 <span class=\"katex-inline\">c<\/span>；<span class=\"katex-inline\">b<\/span> 连 <span class=\"katex-inline\">c<\/span>。<\/p>\n<ul><li>\n初始队列 <span class=\"katex-inline\">[s]<\/span>，<span class=\"katex-inline\">d[s]=0<\/span>。\n<\/li><li>\n出 <span class=\"katex-inline\">s<\/span>：<span class=\"katex-inline\">a,b<\/span> 未访问，<span class=\"katex-inline\">d[a]=d[b]=1<\/span>，队列 <span class=\"katex-inline\">[a,b]<\/span>。\n<\/li><li>\n出 <span class=\"katex-inline\">a<\/span>：<span class=\"katex-inline\">c<\/span> 未访问，<span class=\"katex-inline\">d[c]=2<\/span>，队列 <span class=\"katex-inline\">[b,c]<\/span>。\n<\/li><li>\n出 <span class=\"katex-inline\">b<\/span>：<span class=\"katex-inline\">c<\/span> 已访问跳过；出 <span class=\"katex-inline\">c<\/span> 无新结点。\n<\/ul>\n<p>最终距离 <span class=\"katex-inline\">d=[s:0,a:1,b:1,c:2]<\/span>，与无权最短路一致。<\/p>\n<h3>算例 2：Dijkstra 松弛顺序<\/h3>\n<p>有向图：<span class=\"katex-inline\">s\\to a<\/span> 权 10，<span class=\"katex-inline\">s\\to b<\/span> 权 5，<span class=\"katex-inline\">b\\to a<\/span> 权 3，<span class=\"katex-inline\">a\\to c<\/span> 权 2，<span class=\"katex-inline\">b\\to c<\/span> 权 9。<\/p>\n<ul><li>\n初始：<span class=\"katex-inline\">d[s]=0<\/span>，其余 <span class=\"katex-inline\">\\infty<\/span>。\n<\/li><li>\n选 <span class=\"katex-inline\">s<\/span>：松弛 <span class=\"katex-inline\">s\\to a<\/span>，<span class=\"katex-inline\">d[a]=10<\/span>；<span class=\"katex-inline\">s\\to b<\/span>，<span class=\"katex-inline\">d[b]=5<\/span>。\n<\/li><li>\n选 <span class=\"katex-inline\">b<\/span>（<span class=\"katex-inline\">d=5<\/span>）：松弛 <span class=\"katex-inline\">b\\to a<\/span>，<span class=\"katex-inline\">5+3=8&amp;lt;10<\/span>，<span class=\"katex-inline\">d[a]=8<\/span>；<span class=\"katex-inline\">b\\to c<\/span>，<span class=\"katex-inline\">d[c]=14<\/span>。\n<\/li><li>\n选 <span class=\"katex-inline\">a<\/span>（<span class=\"katex-inline\">d=8<\/span>）：松弛 <span class=\"katex-inline\">a\\to c<\/span>，<span class=\"katex-inline\">8+2=10&amp;lt;14<\/span>，<span class=\"katex-inline\">d[c]=10<\/span>。\n<\/li><li>\n选 <span class=\"katex-inline\">c<\/span>：无出边。\n<\/ul>\n<p>最终 <span class=\"katex-inline\">d=[s:0,b:5,a:8,c:10]<\/span>。路径核验：<span class=\"katex-inline\">s\\to b\\to a\\to c<\/span> 总长 <span class=\"katex-inline\">5+3+2=10<\/span>，为最短路。<\/p>\n<h3>算例 3：负权破坏证明的位置<\/h3>\n<p>同一图加边 <span class=\"katex-inline\">a\\to b<\/span> 权 <span class=\"katex-inline\">-5<\/span>。<span class=\"katex-inline\">b<\/span> 入 <span class=\"katex-inline\">S<\/span> 后，后续 <span class=\"katex-inline\">a<\/span> 经负权边回到 <span class=\"katex-inline\">b<\/span> 可得更短路径，但 <span class=\"katex-inline\">b<\/span> 已在 <span class=\"katex-inline\">S<\/span> 不再更新；反证第四步 <span class=\"katex-inline\">\\delta(y)\\le\\delta(u)<\/span> 在负权下不成立，证明链条断裂。此场景需 Bellman-Ford 反复松弛直到全图收敛。<\/p>\n<h2>对抗性追问<\/h2>\n<p><strong>追问一：BFS 能不能求带权最短路？<\/strong> 不能直接。BFS 层数按边数计，边权不等时层序与距离序不一致；带权最短路需要松弛框架，Dijkstra 或 Bellman-Ford。<\/p>\n<p><strong>追问二：DFS 为什么不记录距离？<\/strong> DFS 优化目标是遍历覆盖与结构时序，一条路径深入到底不代表该路径最短；距离估计要靠松弛下压，DFS 栈结构不维护距离上界不变式。<\/p>\n<p><strong>追问三：Dijkstra 用优先队列选最小估计，队列操作代价怎样进总复杂度？<\/strong> 每边至多松弛一次，每结点一次提取最小；二叉堆实现下提取与更新 <span class=\"katex-inline\">O(\\lg V)<\/span>，总代价 <span class=\"katex-inline\">O((V+E)\\lg V)<\/span>。堆选型影响常数与阶内项，不改变正确性证明。<\/p>\n<h2>延伸推演：表示选择、DFS 时序与松弛框架<\/h2>\n<h3>邻接表与邻接矩阵的适用边界<\/h3>\n<p><span class=\"katex-inline\">|E|<\/span> 远小于 <span class=\"katex-inline\">|V|^2<\/span> 的稀疏图，邻接表省空间，扫描出边 <span class=\"katex-inline\">O(\\deg v)<\/span>；稠密图邻接矩阵定位 <span class=\"katex-inline\">O(1)<\/span>，空间 <span class=\"katex-inline\">O(V^2)<\/span>。表示选择不改变遍历阶：BFS/DFS 都是 <span class=\"katex-inline\">O(V+E)<\/span>（表）或 <span class=\"katex-inline\">O(V^2)<\/span>（矩阵）。<\/p>\n<h3>DFS 时间戳的用途<\/h3>\n<p>发现时间记录结点首次进入，完成时间记录分支退出。父子边构成 DFS 树；回边指向祖先，横边指向已完成分支。拓扑排序取完成时间逆序，连通分量按 DFS 树划分，环检测靠回边识别。DFS 不维护距离估计，它给结构时序。<\/p>\n<h3>松弛是最短路算法的公共骨架<\/h3>\n<p>Bellman-Ford、DAG 最短路、Dijkstra 都反复执行松弛：比较 <span class=\"katex-inline\">d[u]+w(u,v)<\/span> 与 <span class=\"katex-inline\">d[v]<\/span>，更小则更新。差别在选点策略：Bellman-Ford 全图多轮松弛容忍负权；DAG 按拓扑序松弛；Dijkstra 选最小估计收口。松弛不变式 <span class=\"katex-inline\">d[v]\\ge\\delta(v)<\/span> 在各算法中一致。<\/p>\n<h3>与最小生成树的对照<\/h3>\n<p>最短路优化起点到各点路径长度；MST 优化覆盖全部结点的边集总权。两者都借安全边思想：MST 取跨过割的最轻边入树；最短路松弛沿路径下压距离。目标不同，边取舍规则不同。<\/p>\n<h3>第二算例：DFS 时序推演<\/h3>\n<p>有向边：<span class=\"katex-inline\">a\\to b<\/span>，<span class=\"katex-inline\">a\\to c<\/span>，<span class=\"katex-inline\">b\\to d<\/span>，<span class=\"katex-inline\">c\\to d<\/span>，<span class=\"katex-inline\">d\\to a<\/span>。<\/p>\n<ul><li>\n进入 <span class=\"katex-inline\">a<\/span>，记发现时间 1；沿 <span class=\"katex-inline\">a\\to b<\/span> 进入 <span class=\"katex-inline\">b<\/span>，发现 2；<span class=\"katex-inline\">b\\to d<\/span> 进入 <span class=\"katex-inline\">d<\/span>，发现 3；<span class=\"katex-inline\">d\\to a<\/span> 指向已发现祖先 <span class=\"katex-inline\">a<\/span>，记为回边；<span class=\"katex-inline\">d<\/span> 完成 4；回 <span class=\"katex-inline\">b<\/span> 完成 5；回 <span class=\"katex-inline\">a<\/span> 沿 <span class=\"katex-inline\">a\\to c<\/span> 进入 <span class=\"katex-inline\">c<\/span>，发现 6；<span class=\"katex-inline\">c\\to d<\/span> 指向已完成 <span class=\"katex-inline\">d<\/span>，横边；<span class=\"katex-inline\">c<\/span> 完成 7；<span class=\"katex-inline\">a<\/span> 完成 8。\n<\/li><li>\n拓扑序取完成时间逆序：<span class=\"katex-inline\">c,a,b,d<\/span> 一类序列（按实际边方向核验）；环由 <span class=\"katex-inline\">d\\to a<\/span> 回边检出。\n<\/ul>\n<h3>对抗性追问补充<\/h3>\n<p><strong>追问四：BFS 能不能处理边权为正的带权图？<\/strong> 不能直接。层序按边数，边权不等时层数不代表距离；带权正权图走 Dijkstra，无权或等权才用 BFS。<\/p>\n<p><strong>追问五：优先队列实现 Dijkstra 的复杂度怎样进入总代价？<\/strong> 每边至多松弛一次，每结点一次提取最小；二叉堆提取与更新 <span class=\"katex-inline\">O(\\lg V)<\/span>，总 <span class=\"katex-inline\">O((V+E)\\lg V)<\/span>。斐波那契堆可改善摊还界，堆选型影响常数与阶内项，不改正确性证明。<\/p>\n<h2>逐层推导补遗<\/h2>\n<h3>遍历时间口径<\/h3>\n<p>邻接表表示下，每个结点入队/入栈一次，每条出边扫描一次，BFS 与 DFS 同为 <span class=\"katex-inline\">O(V+E)<\/span>。邻接矩阵定位 <span class=\"katex-inline\">O(1)<\/span> 但逐行扫描 <span class=\"katex-inline\">O(V^2)<\/span>。表示选择影响常数与空间，不改变遍历覆盖阶。<\/p>\n<h3>松弛不变式复查<\/h3>\n<p>初始化 <span class=\"katex-inline\">d[s]=0<\/span>，其余 <span class=\"katex-inline\">\\infty<\/span>。不变式 <span class=\"katex-inline\">d[v]\\ge\\delta(v)<\/span>：初始 <span class=\"katex-inline\">\\infty\\ge\\delta<\/span>；松弛只在找到更短路径时更新，新 <span class=\"katex-inline\">d[v]<\/span> 是某条具体路径长度，真实最短路不劣于它，故不低于 <span class=\"katex-inline\">\\delta(v)<\/span>。算法终止时估计不再下降，<span class=\"katex-inline\">d[v]=\\delta(v)<\/span>。<\/p>\n<h3>Dijkstra 反证步骤编号<\/h3>\n<ol><li>\n归纳起点：<span class=\"katex-inline\">s<\/span> 入 <span class=\"katex-inline\">S<\/span> 时 <span class=\"katex-inline\">d[s]=0=\\delta(s)<\/span>。\n<\/li><li>\n反证设定：<span class=\"katex-inline\">u<\/span> 是首个入 <span class=\"katex-inline\">S<\/span> 时 <span class=\"katex-inline\">d[u]&amp;gt;\\delta(u)<\/span> 的结点，此前 <span class=\"katex-inline\">S<\/span> 内结点距离均正确。\n<\/li><li>\n取真实最短路 <span class=\"katex-inline\">s\\leadsto u<\/span>，找首个不在 <span class=\"katex-inline\">S<\/span> 的结点 <span class=\"katex-inline\">y<\/span>，前驱 <span class=\"katex-inline\">x\\in S<\/span>；松弛 <span class=\"katex-inline\">(x,y)<\/span> 后 <span class=\"katex-inline\">d[y]\\le\\delta(y)<\/span>。\n<\/li><li>\n非负权给 <span class=\"katex-inline\">\\delta(y)\\le\\delta(u)<\/span>。\n<\/li><li>\n选点规则给 <span class=\"katex-inline\">d[u]\\le d[y]<\/span>。\n<\/li><li>\n串联 <span class=\"katex-inline\">d[u]\\le d[y]\\le\\delta(y)\\le\\delta(u)<\/span>，矛盾。\n<\/ol>\n<h3>负权破裂位置<\/h3>\n<p>步骤 4 依赖边权非负：路径前缀长度不超过整条长度。负权下边可缩短后续路径，<span class=\"katex-inline\">\\delta(y)\\le\\delta(u)<\/span> 不再保证；已入 <span class=\"katex-inline\">S<\/span> 结点可能被后续负权边改短，Dijkstra 不再回头更新，结论失效。负权场景走 Bellman-Ford 反复松弛。<\/p>\n<h3>最短路与 MST 分工<\/h3>\n<p>最短路优化起点到各点路径长度；MST 优化覆盖全部结点的边集总权。安全边思想两者共用：MST 取跨过割的最轻边；松弛沿路径下压距离。目标与边取舍规则不同，不可混用。<\/p>\n<h2>边界与常见误读补充<\/h2>\n<p>BFS 只适用无权或等权图，边权不等时层数不代表距离；带权正权图走 Dijkstra，负权走 Bellman-Ford。DFS 递归深度受栈容量限制，大图需显式栈改写。Dijkstra 反证链条中“前缀不超过整条”依赖非负权，负权边下已入 S 结点可能被改短而不再回头更新。邻接表省空间适合稀疏图，邻接矩阵定位快适合稠密图，表示选择不改遍历阶。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nBFS 队列按什么顺序扩展？首次发现结点的层数对应什么？\n<\/li><li>\n写出松弛边 <span class=\"katex-inline\">(u,v)<\/span> 的比较式与更新规则。\n<\/li><li>\n不变式 <span class=\"katex-inline\">d[v]\\ge\\delta(v)<\/span> 在初始化与每次松弛后分别怎样维持？\n<\/li><li>\nDijkstra 反证中哪一步依赖边权非负？负权下该步为什么断裂？\n<\/li><li>\n邻接表与邻接矩阵分别适合什么规模的图？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "图的 BFS/DFS 与最短路径松弛：Dijkstra 正确性"}, "c10": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.219<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">分治递归式与主定理：三种情形的套用与边界<\/a><\/span><\/div><h1>动态规划的最优子结构：状态定义、转移与重叠子问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书第 15 章 动态规划，PDF 第 219 页起；15.1 钢条切割、15.3 动态规划原理）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>分治算法把问题拆成互不相交的子问题，递归求解后合并；很多优化问题的子问题反复出现，且整体最优解由子问题最优解拼出。动态规划（DP）针对这类问题：先证明最优子结构，再定义状态、写出转移方程，自底向上填表或带记忆自顶向下求解。这个概念要讲清 DP 成立的两个前提——最优子结构与重叠子问题，状态与转移怎么写，以及 DP 和分治、贪心的分界。<\/p>\n<h2>定义与符号逐项拆<\/h2>\n<p><strong>最优子结构<\/strong>：问题的最优解由其子问题的最优解组合而成。若某子问题取非最优解能拼出更优整体解，与整体最优矛盾，故子问题必须取最优。<\/p>\n<p><strong>重叠子问题<\/strong>：递归求解过程中同一子问题被重复计算多次；记忆化让每个子问题只算一次，后续直接查表。<\/p>\n<p><strong>状态<\/strong>：刻画子问题规模与已决策信息的量，记 <span class=\"katex-inline\">dp[i]<\/span> 或 <span class=\"katex-inline\">dp[i][j]<\/span>。状态取值是该子问题的最优值（最值或方案数）。<\/p>\n<p><strong>转移方程<\/strong>：由更小规模状态推出当前状态的等式，形如 <span class=\"katex-inline\">dp[i]=\\max_{j}(p_j+dp[i-j])<\/span>。方程右端每个 <span class=\"katex-inline\">dp<\/span> 对应一个子问题最优解。<\/p>\n<p><strong>填表顺序<\/strong>：自底向上按子问题规模递增计算；记忆化自顶向下遇到未算状态递归求解、算过即存。<\/p>\n<h2>原理推导<\/h2>\n<h3>钢条切割的状态与转移<\/h3>\n<p>钢条长度 <span class=\"katex-inline\">i<\/span>，售价表 <span class=\"katex-inline\">p_j<\/span>，<span class=\"katex-inline\">r_i<\/span> 为长度 <span class=\"katex-inline\">i<\/span> 的最优售价。最左段长度 <span class=\"katex-inline\">j<\/span>（<span class=\"katex-inline\">1\\le j\\le i<\/span>），售价 <span class=\"katex-inline\">p_j<\/span>，剩余 <span class=\"katex-inline\">i-j<\/span> 按最优切法售 <span class=\"katex-inline\">r_{i-j}<\/span>：<\/p>\n<div class=\"katex-block\">r_i=\\max_{1\\le j\\le i}\\bigl(p_j+r_{i-j}\\bigr),\\qquad r_0=0.<\/div>\n<p>最优子结构核验：若剩余 <span class=\"katex-inline\">i-j<\/span> 存在更优切法，替换后总售价上升，与原方案最优矛盾；因此剩余部分必须取最优，转移方程成立。<\/p>\n<h3>填表推演<\/h3>\n<p><span class=\"katex-inline\">r_0=0<\/span>，按 <span class=\"katex-inline\">i=1,2,\\dots,n<\/span> 递增算。<span class=\"katex-inline\">r_i<\/span> 用到的 <span class=\"katex-inline\">r_{i-j}<\/span> 下标均小于 <span class=\"katex-inline\">i<\/span>，已算好；记录切点可回溯实际方案。复杂度：每个 <span class=\"katex-inline\">r_i<\/span> 枚举 <span class=\"katex-inline\">i<\/span> 个 <span class=\"katex-inline\">j<\/span>，填表 <span class=\"katex-inline\">O(n^2)<\/span>；记忆化只计算必要子问题，同阶。<\/p>\n<h3>最优子结构的证明范式<\/h3>\n<p>DP 问题的标准证明两步：先设整体最优解所包含的子问题解，若它非最优，替换后整体更优，矛盾；故子问题最优可拼出整体最优。再由子问题最优组合枚举当前决策，得到转移方程。<\/p>\n<h3>重叠子问题的收益<\/h3>\n<p>纯递归不记忆，同一长度子问题在不同分支反复求解，重复量随层数指数增长；DP 表把每个子问题存一次，查询 <span class=\"katex-inline\">O(1)<\/span>。子问题重叠越明显，记忆化收益越大。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：问题可分解为同构子问题；整体最优依赖子问题最优；决策满足无后效性——当前状态之后的决策不影响已确定的状态值。<\/p>\n<p>边界一：问题不具备最优子结构时，DP 转移无依据。例如某些博弈或调度问题，局部最优拼不出全局最优，需换搜索或贪心框架。<\/p>\n<p>边界二：状态维度设计不当导致状态数爆炸。子问题规模组合随维数增长，高维 DP 要靠状态压缩或近似方法控制。<\/p>\n<p>边界三：DP 不处理子问题之间需要互相等待的循环依赖；有环依赖要先做拓扑分解或改用迭代松弛。<\/p>\n<p>失败案例：把子问题独立的分治问题硬套 DP 表，记忆化只占空间不换时间；或状态定义漏了必要决策信息，转移方程覆盖不住实际约束，填表结果偏离最优。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>DP vs 分治<\/strong>：分治子问题独立、不重叠，各算各的；DP 子问题重叠，靠记忆化复用。递归式外形相似，判断关键是子问题是否反复出现。\n<\/li><li>\n<strong>DP vs 贪心<\/strong>：DP 枚举当前决策并保留各子问题最优；贪心每步只选当前最优，要求该选择不排斥全局最优。贪心可证的问题通常也有 DP 解法，反之不然。\n<\/li><li>\n<strong>自底向上填表 vs 记忆化自顶向下<\/strong>：前者按规模递推，无递归栈开销；后者只算到达的子问题，状态稀疏时更省。两者状态与转移一致。\n<\/li><li>\n<strong>状态值 vs 方案<\/strong>：DP 表存最优值；要还原方案需另记切点、前驱或选择分支，方案信息不在最值本身里。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c02 的递归式语言描述子问题成本；概念 c01 的阶记号陈述填表复杂度。后继：概念 c11 贪心与 DP 同属设计策略，交换论证判断贪心何时安全；概念 c13 NP 完全性中，许多 DP 可解的多项式问题与 NP 完全问题边界清晰，归约链条区分两者。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（动态规划的最优子结构：状态定义、转移与重叠子问题）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：最优子结构证明、状态转移填表与算例核验<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要搭一个 DP 解法，先往回追四层：<\/p>\n<ol><li>\n<strong>优化问题先看能不能拆成同类子问题<\/strong>。整体方案由若干段决策组成，每段面对规模更小的同构问题；拆不出同构子问题，DP 无从谈起。\n<\/li><li>\n<strong>拆完核验最优子结构<\/strong>。整体最优解里的子问题解必须是子问题最优；若非最优可替换，整体就还能改进，与整体最优矛盾。这一步是转移方程合法的前提。\n<\/li><li>\n<strong>重叠子问题决定记忆化收益<\/strong>。同一子问题重复出现，存一次查表复用；子问题互不相交，记忆化只增加空间。\n<\/li><li>\n<strong>状态与转移是落地环节<\/strong>：状态记子问题规模与必要信息，转移枚举当前决策取子问题最优组合；填表顺序保证算当前状态时所依赖状态已就位。\n<\/ol>\n<p>依赖链方向：可拆分子问题 → 最优子结构证明 → 重叠识别 → 状态定义 → 转移方程 → 填表/记忆化求解。<\/p>\n<h2>正向推导：从证明到填表<\/h2>\n<h3>最优子结构证明范式<\/h3>\n<p>设问题整体最优解 <span class=\"katex-inline\">A<\/span>，其中包含子问题 <span class=\"katex-inline\">P<\/span> 的解 <span class=\"katex-inline\">A_P<\/span>。反证 <span class=\"katex-inline\">A_P<\/span> 非最优：取 <span class=\"katex-inline\">P<\/span> 的更优解 <span class=\"katex-inline\">A_P&#x27;<\/span>，替换 <span class=\"katex-inline\">A_P<\/span> 后整体解变为 <span class=\"katex-inline\">A&#x27;<\/span>，<span class=\"katex-inline\">A&#x27;<\/span> 优于 <span class=\"katex-inline\">A<\/span>，与 <span class=\"katex-inline\">A<\/span> 整体最优矛盾。故 <span class=\"katex-inline\">A_P<\/span> 必为 <span class=\"katex-inline\">P<\/span> 的最优解。<\/p>\n<p>推论：当前问题的最优值，可枚举第一级决策，对每种决策取对应子问题最优值，再选最优组合。转移方程由此写出。<\/p>\n<h3>状态定义要点<\/h3>\n<p>状态要覆盖子问题规模与已决策约束；状态值是该子问题的最优值。状态过少漏掉约束，转移覆盖不住；状态过多组合爆炸。多序列对齐、区间 DP、背包类问题各按约束设二维或多维状态。<\/p>\n<h3>转移方程写法<\/h3>\n<p>对当前状态 <span class=\"katex-inline\">dp[\\text{state}]<\/span>：枚举最后一步（或第一步）决策 <span class=\"katex-inline\">j<\/span>，该决策对应子状态 <span class=\"katex-inline\">dp[\\text{state}_j]<\/span>，加上本轮决策收益；方程<\/p>\n<div class=\"katex-block\">dp[\\text{state}]=\\operatorname{opt}_{j}\\bigl(\\text{收益}_j+dp[\\text{state}_j]\\bigr),<\/div>\n<p><span class=\"katex-inline\">\\operatorname{opt}<\/span> 按问题取 max、min 或求和。边界状态 <span class=\"katex-inline\">dp[\\text{base}]<\/span> 直接给定。<\/p>\n<h3>填表顺序与记忆化<\/h3>\n<p>自底向上：按子问题规模递增，保证 <span class=\"katex-inline\">dp[\\text{state}_j]<\/span> 先于 <span class=\"katex-inline\">dp[\\text{state}]<\/span> 算出。记忆化：递归进入状态先查表，未算则递归求解后存表；两者状态、转移、复杂度一致。<\/p>\n<h3>无后效性<\/h3>\n<p>状态一旦确定，后续决策只能在其基础上扩展，不能回改已确定状态值。若后续选择会改变前面状态含义，状态划分不满足无后效性，需重设状态。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：钢条切割逐项填表<\/h3>\n<p>售价 <span class=\"katex-inline\">p_1=1,p_2=5,p_3=8,p_4=9<\/span>，求长度 4 的最优售价。<\/p>\n<ul><li>\n<span class=\"katex-inline\">r_0=0<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">i=1<\/span>：<span class=\"katex-inline\">r_1=\\max(p_1+r_0)=1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">i=2<\/span>：<span class=\"katex-inline\">r_2=\\max(p_1+r_1=1+1=2,\\ p_2+r_0=5+0=5)=5<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">i=3<\/span>：<span class=\"katex-inline\">r_3=\\max(p_1+r_2=1+5=6,\\ p_2+r_1=5+1=6,\\ p_3+r_0=8)=8<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">i=4<\/span>：<span class=\"katex-inline\">r_4=\\max(p_1+r_3=1+8=9,\\ p_2+r_2=5+5=10,\\ p_3+r_1=8+1=9,\\ p_4+r_0=9)=10<\/span>。\n<\/ul>\n<p>最优切割为 <span class=\"katex-inline\">2+2<\/span>，售价 10。对照不切整根售 9，长切 <span class=\"katex-inline\">1+3<\/span> 售 9，<span class=\"katex-inline\">2+2<\/span> 的组合最优。切点记录：<span class=\"katex-inline\">r_4<\/span> 取 <span class=\"katex-inline\">j=2<\/span>，剩余 <span class=\"katex-inline\">r_2<\/span> 取 <span class=\"katex-inline\">j=2<\/span>，回溯两段各长 2。<\/p>\n<h3>算例 2：矩阵链乘法的状态视角<\/h3>\n<p>矩阵链 <span class=\"katex-inline\">A_1(10\\times101),A_2(101\\times50),A_3(50\\times10)<\/span>。乘 <span class=\"katex-inline\">p\\times q<\/span> 与 <span class=\"katex-inline\">q\\times r<\/span> 代价 <span class=\"katex-inline\">pqr<\/span>。设 <span class=\"katex-inline\">m[i][j]<\/span> 为 <span class=\"katex-inline\">A_i\\dots A_j<\/span> 最少乘法次数，转移 <span class=\"katex-inline\">m[i][j]=\\min_{i\\le k&amp;lt;j}(m[i][k]+m[k+1][j]+p_{i-1}p_k p_j)<\/span>。<\/p>\n<p><span class=\"katex-inline\">m[1][1]=m[2][2]=m[3][3]=0<\/span>。 <span class=\"katex-inline\">m[1][2]=10\\cdot101\\cdot50=50500<\/span>；<span class=\"katex-inline\">m[2][3]=101\\cdot50\\cdot10=50500<\/span>。 <span class=\"katex-inline\">m[1][3]=\\min(m[1][1]+m[2][3]+10\\cdot101\\cdot10=50500+10100=60600,\\ m[1][2]+m[3][3]+10\\cdot50\\cdot10=50500+5000=55500)<\/span>，取 55500。括号顺序 <span class=\"katex-inline\">(A_1(A_2A_3))<\/span> 更省。<\/p>\n<h3>算例 3：重复子问题计数<\/h3>\n<p>朴素递归解钢条切割，<span class=\"katex-inline\">r_4<\/span> 分支调 <span class=\"katex-inline\">r_3,r_2,r_1,r_0<\/span>；<span class=\"katex-inline\">r_3<\/span> 分支又调 <span class=\"katex-inline\">r_2,r_1,r_0<\/span>；<span class=\"katex-inline\">r_2<\/span> 再调 <span class=\"katex-inline\">r_1,r_0<\/span>。<span class=\"katex-inline\">r_1<\/span> 被重复计算 3 次，<span class=\"katex-inline\">r_0<\/span> 重复更多。<span class=\"katex-inline\">n<\/span> 增大时重复量指数增长；DP 表每个 <span class=\"katex-inline\">r_i<\/span> 只存一次，查询直接取表。<\/p>\n<h2>对抗性追问<\/h2>\n<p><strong>追问一：DP 状态为什么不能只记当前决策收益？<\/strong> 子问题最优值依赖规模与约束信息；只记累计收益，缺了“还剩多少规模、用过哪些资源”，后续决策无法比较。状态是子问题全部必要信息的压缩。<\/p>\n<p><strong>追问二：最优子结构在什么问题上失效？<\/strong> 全局最优要求子问题之间妥协或联动时，各子问题局部最优拼不出全局最优。典型如部分调度与博弈问题，单独优化一段会损害另一段，此时 DP 转移无依据。<\/p>\n<p><strong>追问三：自顶向下记忆化会不会比填表慢？<\/strong> 状态稀疏时记忆化只算到达的子问题，更省；状态稠密时填表无递归调用开销，常数更低。两者阶相同，选型看状态分布。<\/p>\n<h2>延伸推演：状态设计、方案回溯与 DP 边界<\/h2>\n<h3>状态维数从约束反推<\/h3>\n<p>状态要覆盖子问题规模与已用资源/已决策位置。背包按剩余容量设维，序列对齐按两序列下标设维，区间 DP 按左右端点设维。维数少漏约束，多则组合爆炸；状态压缩在保持等价下合并冗余维。<\/p>\n<h3>方案信息与最值分开存<\/h3>\n<p>DP 表存最优值；还原方案另记切点、前驱或所选分支。钢条切割记第一刀位置，矩阵链记括号位置，LCS 记对齐方向。只存最值无法回溯路径，方案字段是独立于值表的记录。<\/p>\n<h3>记忆化与填表的取舍<\/h3>\n<p>状态稠密：填表无递归栈开销，常数低；状态稀疏：记忆化只算到达子问题，省空间。两者状态转移一致，选型看状态分布。子问题不重叠时分治各算各的，记忆化只占空间不换时间。<\/p>\n<h3>第二算例：最长公共子序列状态视角<\/h3>\n<p>两序列 <span class=\"katex-inline\">X=x_1\\dots x_m<\/span>，<span class=\"katex-inline\">Y=y_1\\dots y_n<\/span>。<span class=\"katex-inline\">c[i][j]<\/span> 为 <span class=\"katex-inline\">X<\/span> 前 <span class=\"katex-inline\">i<\/span> 个与 <span class=\"katex-inline\">Y<\/span> 前 <span class=\"katex-inline\">j<\/span> 个的 LCS 长度：<\/p>\n<ul><li>\n<span class=\"katex-inline\">x_i=y_j<\/span>：<span class=\"katex-inline\">c[i][j]=c[i-1][j-1]+1<\/span>；\n<\/li><li>\n不等：<span class=\"katex-inline\">c[i][j]=\\max(c[i-1][j],c[i][j-1])<\/span>。\n<\/ul>\n<p>边界 <span class=\"katex-inline\">c[0][j]=c[i][0]=0<\/span>。填表按 <span class=\"katex-inline\">i,j<\/span> 递增；回溯沿相等处走对角线，不等处取较大方向。复杂度 <span class=\"katex-inline\">O(mn)<\/span>。<\/p>\n<h3>DP 失效的典型场景<\/h3>\n<p>子问题需要互相等待形成循环依赖，无拓扑顺序；局部最优损害另一子问题，最优子结构破裂；状态等价类过大无法枚举。这些场景转搜索、贪心或近似框架，硬套 DP 转移无依据。<\/p>\n<h3>对抗性追问补充<\/h3>\n<p><strong>追问四：DP 状态为什么不能只记累计收益？<\/strong> 后续决策还需要剩余规模、已用资源等信息；只记收益缺了决策依据，状态不可比。状态是子问题全部必要信息的压缩。<\/p>\n<p><strong>追问五：自顶向下记忆化会不会重复算同一状态？<\/strong> 不会：进入状态先查表，算过即存；重复命中直接取值。递归调用本身有栈开销，状态极深时要防栈溢出。<\/p>\n<h2>逐层推导补遗<\/h2>\n<h3>最优子结构证明两步<\/h3>\n<p>先设整体最优解 <span class=\"katex-inline\">A<\/span> 含子问题 <span class=\"katex-inline\">P<\/span> 的解 <span class=\"katex-inline\">A_P<\/span>。反证 <span class=\"katex-inline\">A_P<\/span> 非最优：取 <span class=\"katex-inline\">P<\/span> 更优解 <span class=\"katex-inline\">A_P&#x27;<\/span> 替换，整体解 <span class=\"katex-inline\">A&#x27;<\/span> 优于 <span class=\"katex-inline\">A<\/span>，与 <span class=\"katex-inline\">A<\/span> 最优矛盾。故 <span class=\"katex-inline\">A_P<\/span> 必为 <span class=\"katex-inline\">P<\/span> 最优。再枚举第一级决策，各取子问题最优值组合，选最优得转移方程。<\/p>\n<h3>状态与转移的落地顺序<\/h3>\n<p>状态覆盖规模与约束；转移枚举决策 <span class=\"katex-inline\">j<\/span>，<span class=\"katex-inline\">dp[\\text{state}]=\\operatorname{opt}_j(\\text{收益}_j+dp[\\text{state}_j])<\/span>。边界状态直接给定；填表按规模递增，保证子状态先就位。方案回溯另记切点或前驱，最值表本身不含路径。<\/p>\n<h3>无后效性核验<\/h3>\n<p>状态确定后，后续决策只在其基础上扩展，不回改已确定状态值。若后续选择会改变前面状态含义，状态划分失效，需重设。有环依赖先做拓扑分解，不能直接填表。<\/p>\n<h3>DP 与分治的分界<\/h3>\n<p>分治子问题独立不重叠，各算各的；DP 子问题重叠，记忆化复用。递归式外形相似，判断关键是同一子问题是否反复出现。子问题不重叠时记忆化只占空间，分治更直接。<\/p>\n<h2>边界与常见误读补充<\/h2>\n<p>DP 成立要求最优子结构、重叠子问题与无后效性；子问题互相等待成环、局部最优损害另一子问题时，转移无依据。状态维数漏约束会覆盖不住实际决策，维数过多则组合爆炸。DP 表存最值，方案回溯另记切点或前驱；子问题不重叠时分治各算各的，记忆化只占空间不换时间。自顶向下记忆化防递归栈溢出，状态稠密时填表常数更低。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n用反证法说明：整体最优解包含的子问题解为什么必须是子问题最优。\n<\/li><li>\n写出钢条切割的转移方程与边界条件。\n<\/li><li>\n填表顺序由什么决定？为什么 <span class=\"katex-inline\">r_i<\/span> 用到的 <span class=\"katex-inline\">r_{i-j}<\/span> 已算好？\n<\/li><li>\n重叠子问题在朴素递归中造成什么重复？记忆化怎样消除？\n<\/li><li>\n什么是无后效性？后续决策回改已确定状态会带来什么问题？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "动态规划的最优子结构：状态定义、转移与重叠子问题"}, "c11": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.252<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c10\">动态规划的最优子结构：状态定义、转移与重叠子问题<\/a><\/span><\/div><h1>贪心的交换论证与失效反例<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书第 16 章 贪心算法，PDF 第 252 页起；16.1 活动选择、16.2 贪心算法原理、16.4 拟阵和贪心算法）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>贪心算法在每一步选当前看起来最优的决策，寄望局部最优拼出全局最优。这种策略写法简单、运行快，但不是对所有问题成立。判断贪心何时安全，需要一条可核验的论证链：证明存在一个最优解包含贪心选择，且剩余子问题仍有最优子结构。这个概念讲清交换论证的结构、贪心适用的前提条件，以及贪心拿到次优解的典型反例。<\/p>\n<h2>定义与符号逐项拆<\/h2>\n<p><strong>贪心选择性质<\/strong>：全局最优解可以通过先做局部最优选择得到；选出当前决策后，剩余问题独立求解。<\/p>\n<p><strong>最优子结构<\/strong>：选出贪心决策后，剩余子问题的最优解与此前选择组合成整体最优解。这一点与动态规划共享。<\/p>\n<p><strong>交换论证<\/strong>：取任一最优解 <span class=\"katex-inline\">A<\/span>，把其中第一个决策替换为贪心选择 <span class=\"katex-inline\">g<\/span>；说明替换不减少后续可用空间、不降低解的质量，得到另一个包含 <span class=\"katex-inline\">g<\/span> 的最优解。反复交换，贪心解不劣于最优解。<\/p>\n<p><strong>拟阵<\/strong>：一类满足遗传性质与交换性质的独立集结构；在拟阵上贪心选择必然得到最大权独立集（原书 16.4 节，PDF 第 260 页起，转述）。拟阵给出贪心安全的一类充分条件。<\/p>\n<h2>原理推导<\/h2>\n<h3>活动选择的交换论证<\/h3>\n<p>活动集 <span class=\"katex-inline\">S<\/span>，活动 <span class=\"katex-inline\">i<\/span> 有开始 <span class=\"katex-inline\">s_i<\/span>、结束 <span class=\"katex-inline\">f_i<\/span>，要求互不重叠，选最大活动数。贪心：按结束时间排序，选结束最早且不冲突的活动。<\/p>\n<p>第一步，取最优解 <span class=\"katex-inline\">A<\/span>，其第一个活动为 <span class=\"katex-inline\">a_k<\/span>，贪心选择为 <span class=\"katex-inline\">a_1<\/span>（结束最早）。<span class=\"katex-inline\">f(a_1)\\le f(a_k)<\/span>，<span class=\"katex-inline\">A<\/span> 中 <span class=\"katex-inline\">a_k<\/span> 之后的活动都在 <span class=\"katex-inline\">a_k<\/span> 结束后开始，因而也在 <span class=\"katex-inline\">a_1<\/span> 结束后开始。把 <span class=\"katex-inline\">a_k<\/span> 换成 <span class=\"katex-inline\">a_1<\/span>，新解活动数不变，仍为最优。<\/p>\n<p>第二步，对剩余时间段重复交换：贪心在每个子区间选结束最早活动，替换后不产生冲突。归纳得贪心活动集大小不劣于任何最优解，即贪心最优。<\/p>\n<h3>论证成立的两个支点<\/h3>\n<p>一是贪心选择不排斥后续空间：早结束给后面留出余地；二是子问题独立：选完当前活动，剩余时间段内的选择不受已选活动反向约束。两个支点缺一，交换链条走不通。<\/p>\n<h3>贪心失效反例：0-1 背包<\/h3>\n<p>背包容量 <span class=\"katex-inline\">W=50<\/span>，物品不可分割：物品 1 重 10、价值 60，单位重量价值 6；物品 2 重 20、价值 100，单位 5；物品 3 重 30、价值 120，单位 4。<\/p>\n<p>按单位价值贪心：先取物品 1（余 40），再取物品 2（余 20），总价值 160，物品 3 装不下。最优解：物品 2 加物品 3，重 50，总价值 220。贪心按单位排序挤出了两件组合价值更高的物品，局部最优与全局最优不一致。<\/p>\n<p>失效原因：物品之间有体积耦合，选高单位物品占用容量后，剩余容量搭配不出最优组合；交换论证要求“替换不损失后续空间”，背包中替换会改变容量占用结构，该前提不成立。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：问题具备贪心选择性质与最优子结构；拟阵类结构是已知的充分条件；选择之间没有强耦合。<\/p>\n<p>边界一：贪心不保证最优时，它仍是一种启发式；没有交换论证托底，贪心结果可能偏离最优很远。<\/p>\n<p>边界二：可分割物品（分数背包）按单位贪心成立；不可分割物品受整数体积约束，耦合出现，贪心失效。<\/p>\n<p>边界三：多目标优化中“当前最优”按哪个目标排序需要先定义；排序目标选错，贪心方向随之错误。<\/p>\n<p>失败案例：把活动选择的早结束规则搬到资源调度，不核验后续空间是否保留；或在背包类耦合问题上沿用单位价值贪心，得到 160 而非 220。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>贪心 vs 动态规划<\/strong>：DP 枚举当前所有决策并保留各子问题最优；贪心每步只取一个当前最优，论证要求该选择安全。DP 适用面更广，贪心在可证问题上更省。\n<\/li><li>\n<strong>交换论证 vs 概率论证<\/strong>：交换论证是确定性的结构证明，比较最优解与贪心解；概率分析（如快排期望）靠随机源与期望求和，两者工具不同。\n<\/li><li>\n<strong>拟阵条件 vs 一般贪心直觉<\/strong>：拟阵给出可核验的充分条件；仅凭“当前最好”的直觉不构成论证。\n<\/li><li>\n<strong>贪心安全 vs 贪心高效<\/strong>：高效是运行时间属性，安全是最优性属性；贪心即使高效，不满足条件时仍可能次优。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c10 DP 的最优子结构是贪心论证的后半段；两者都先证明子问题最优可组合。后继：概念 c13 NP 完全性中，背包判定类问题属于 NP 完全，而其松弛与贪心近似是工程上的退路；概念 c04 的概率推导展示另一种“平均表现”论证，与本章确定性交换论证对照。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（贪心的交换论证与失效反例）<\/summary><div class=\"depth-body\"><h1>c11 深度推导：交换论证链条、贪心前提拆解与反例构造<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>判断贪心是否可用，先往回追四层：<\/p>\n<ol><li>\n<strong>贪心的写法天然短<\/strong>：每步取当前最优，不枚举备选；短写法要成立，必须补一条“为什么局部最优不毁掉全局”的论证。\n<\/li><li>\n<strong>论证分两段<\/strong>：先证存在一个最优解包含贪心选择（贪心选择性质），再证选完后剩余子问题可独立取最优（最优子结构）。两段合起来，贪心解可逐步替换成最优解而不损失质量。\n<\/li><li>\n<strong>交换是论证手段<\/strong>：拿最优解的第一个决策与贪心决策对调，核对后续空间与解值；对调后仍最优，说明贪心选择可被最优解接受。\n<\/li><li>\n<strong>失效反例定位前提破裂处<\/strong>：贪心出错往往不是排序算错，而是问题中决策相互耦合，替换会改变剩余资源结构，交换前提不成立。\n<\/ol>\n<p>依赖链方向：贪心短写法 → 需最优性论证 → 贪心选择性质 + 最优子结构 → 交换核验后续空间 → 前提破裂处即失效点。<\/p>\n<h2>正向推导：论证结构与适用边界<\/h2>\n<h3>贪心选择性质核验<\/h3>\n<p>设 <span class=\"katex-inline\">g<\/span> 为贪心当前选择，<span class=\"katex-inline\">A<\/span> 为任一最优解。若 <span class=\"katex-inline\">g\\in A<\/span>，性质已满足；若 <span class=\"katex-inline\">g\\notin A<\/span>，把 <span class=\"katex-inline\">A<\/span> 中同位置决策 <span class=\"katex-inline\">a<\/span> 替换为 <span class=\"katex-inline\">g<\/span>。核验两点：替换后解仍合法（不违反约束）；替换后解值不下降。两点成立，得到包含 <span class=\"katex-inline\">g<\/span> 的最优解 <span class=\"katex-inline\">A&#x27;<\/span>。<\/p>\n<h3>最优子结构衔接<\/h3>\n<p>固定 <span class=\"katex-inline\">g<\/span> 后，剩余决策面对独立子问题；由原问题最优子结构，子问题取最优即可与 <span class=\"katex-inline\">g<\/span> 拼成整体最优。对剩余子问题重复贪心选择，归纳出完整贪心解。<\/p>\n<h3>拟阵给出的充分条件<\/h3>\n<p>拟阵 <span class=\"katex-inline\">M=(S,I)<\/span>：独立集族 <span class=\"katex-inline\">I<\/span> 满足遗传性（子集仍独立）与交换性质（两个大小不等独立集之间可移动元素）。权值拟阵上，按权降序贪心跳过不破坏独立性的元素，得到最大权独立集。拟阵条件把“贪心安全”落到可核验的集合性质上；不满足拟阵的问题，贪心是否安全要单独论证。<\/p>\n<h3>与 DP 的分界<\/h3>\n<p>DP 保留每个子问题的最优值，转移枚举决策；贪心只推一条决策链。问题可贪心时，DP 是兜底解法；问题耦合时，DP 仍可建模，贪心不再有最优保证。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：活动选择逐项推演<\/h3>\n<p>活动集（开始, 结束）：<span class=\"katex-inline\">A[1,3]<\/span>，<span class=\"katex-inline\">B[2,5]<\/span>，<span class=\"katex-inline\">C[4,7]<\/span>，<span class=\"katex-inline\">D[6,9]<\/span>，<span class=\"katex-inline\">E[8,10]<\/span>。<\/p>\n<p>按结束时间排序：<span class=\"katex-inline\">A(3),B(5),C(7),D(9),E(10)<\/span>。<\/p>\n<ul><li>\n选 <span class=\"katex-inline\">A<\/span>：结束 3。\n<\/li><li>\n下一个开始 <span class=\"katex-inline\">\\ge3<\/span>：<span class=\"katex-inline\">B<\/span> 开始 2 冲突，跳过；<span class=\"katex-inline\">C<\/span> 开始 4 不冲突，选 <span class=\"katex-inline\">C<\/span>，结束 7。\n<\/li><li>\n下一个开始 <span class=\"katex-inline\">\\ge7<\/span>：<span class=\"katex-inline\">D<\/span> 开始 6 冲突，跳过；<span class=\"katex-inline\">E<\/span> 开始 8 不冲突，选 <span class=\"katex-inline\">E<\/span>。\n<\/li><li>\n贪心结果 <span class=\"katex-inline\">\\{A,C,E\\}<\/span>，共 3 个。\n<\/ul>\n<p>核验最优：<span class=\"katex-inline\">B<\/span> 与 <span class=\"katex-inline\">D<\/span> 一组只 2 个；<span class=\"katex-inline\">A,C,E<\/span> 覆盖时段 1–10，3 个已是上限。交换论证：任一最优解首活动换成 <span class=\"katex-inline\">A<\/span>，<span class=\"katex-inline\">A<\/span> 结束不晚于其他首活动，其后活动仍可接；剩余时间段重复同一交换。<\/p>\n<h3>算例 2：0-1 背包反例逐项<\/h3>\n<p>容量 <span class=\"katex-inline\">W=50<\/span>：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>物品<\/th><th>重量<\/th><th>价值<\/th><th>单位价值<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>10<\/td><td>60<\/td><td>6.0<\/td><\/tr><tr><td>2<\/td><td>20<\/td><td>100<\/td><td>5.0<\/td><\/tr><tr><td>3<\/td><td>30<\/td><td>120<\/td><td>4.0<\/td><\/tr><\/tbody><\/table><\/div>\n<p>贪心按单位降序：取物品 1，余容量 40；取物品 2，余容量 20；物品 3 需 30，装不下。贪心价值 <span class=\"katex-inline\">60+100=160<\/span>。<\/p>\n<p>枚举可行组合：物品 2 加物品 3 重 50，价值 <span class=\"katex-inline\">100+120=220<\/span>；物品 1 加物品 3 重 40，价值 180；单件最大 120。最优 220，贪心 160，差距 60。<\/p>\n<p>破裂点：物品 1 占用 10 容量后，剩余 40 搭配不出物品 2 加物品 3 的组合；交换“高单位物品”会改变剩余容量结构，后续空间不可保留，活动选择那套交换论证在此不适用。<\/p>\n<h3>算例 3：分数背包对照<\/h3>\n<p>同一容量与三件物品，允许分割：按单位全取物品 1（10/10），再取物品 2（20/20），余 20 容量取物品 3 的 20/30，价值 <span class=\"katex-inline\">60+100+120\\cdot(20/30)=240<\/span>。可分割时贪心按单位成立，因为物品可按比例进入，容量占用可精细调整，耦合消失。<\/p>\n<h2>对抗性追问<\/h2>\n<p><strong>追问一：交换论证中替换为什么要求解值不下降而不是不上升？<\/strong> 目标是证明贪心解达到最优。若替换后解值下降，新解劣于原最优，无法说明贪心被最优接受；必须保持不下降，才能把最优解逐步改写成贪心解。<\/p>\n<p><strong>追问二：贪心选择性质与最优子结构缺一段会怎样？<\/strong> 缺贪心选择性质：不存在包含贪心决策的最优解，第一步就选错；缺最优子结构：选完后剩余段不能独立优化，后续贪心无依据。活动选择两段齐备，背包在不可分割时第一段破裂。<\/p>\n<p><strong>追问三：拟阵贪心按权降序，和活动选择按结束时间排序方向为什么不同？<\/strong> 排序依据由问题的安全判据决定：拟阵按权值，活动选择按结束时间；方向本身不关键，关键是排序规则对应可核验的选择性质。<\/p>\n<h2>延伸推演：拟阵条件、DP 兜底与近似定位<\/h2>\n<h3>拟阵两条性质落地<\/h3>\n<p>遗传性：独立集的子集仍独立；交换性质：两个大小不等独立集之间，可把较大集的元素移入较小集保持独立。权值拟阵按权降序扫描，跳过破坏独立性的元素，留下最大权独立集。拟阵把贪心安全变成可核验的集合公理，满足则贪心必然最优。<\/p>\n<h3>贪心与 DP 的求解分工<\/h3>\n<p>可贪心问题通常也有 DP 解法，DP 枚举决策保留各子问题最优；问题耦合时 DP 仍可建模，贪心失去最优保证。工程上先判断贪心选择性质，证不出来就退回 DP 或搜索，不凭直觉沿用贪心排序。<\/p>\n<h3>近似算法在贪心失败处的位置<\/h3>\n<p>NP 难问题的精确 DP 可能指数级；近似算法放弃最优，换可证明近似比。某些贪心改造（如背包松弛取整）带近似保证，区别于无保证启发式；选型要看目标解与最优解的偏差界。<\/p>\n<h3>第二算例：另一组活动选择<\/h3>\n<p>活动：<span class=\"katex-inline\">P[0,2]<\/span>，<span class=\"katex-inline\">Q[1,4]<\/span>，<span class=\"katex-inline\">R[3,5]<\/span>，<span class=\"katex-inline\">S[4,7]<\/span>，<span class=\"katex-inline\">T[6,8]<\/span>。<\/p>\n<p>按结束时间：<span class=\"katex-inline\">P(2),Q(4),R(5),S(7),T(8)<\/span>。选 <span class=\"katex-inline\">P<\/span>；<span class=\"katex-inline\">Q<\/span> 开始 1 冲突，跳过；<span class=\"katex-inline\">R<\/span> 开始 3 不冲突，选 <span class=\"katex-inline\">R<\/span>；<span class=\"katex-inline\">S<\/span> 开始 4 冲突，跳过；<span class=\"katex-inline\">T<\/span> 开始 6 不冲突，选 <span class=\"katex-inline\">T<\/span>。贪心 <span class=\"katex-inline\">\\{P,R,T\\}<\/span>，共 3 个。核验最优：<span class=\"katex-inline\">Q,S<\/span> 一组 2 个，<span class=\"katex-inline\">P,R,T<\/span> 覆盖 0–8，3 个为上限。<\/p>\n<h3>交换论证的失败判定<\/h3>\n<p>替换最优解首活动时，核对两点：新解合法（不违约束）、解值不下降。若替换改变剩余资源结构、使后续可选空间收窄，第二点破裂，贪心前提不成立。背包反例正是容量占用耦合导致后续空间不可保留。<\/p>\n<h3>对抗性追问补充<\/h3>\n<p><strong>追问四：贪心选择最早结束，为什么不选最晚开始？<\/strong> 论证对象是结束时间：早结束给后续留余地；晚开始规则不直接保留后续空间。排序依据必须对应可核验的选择性质，换规则要重走交换论证。<\/p>\n<p><strong>追问五：拟阵贪心按权降序，和活动选择按结束时间排序方向不同，矛盾吗？<\/strong> 不矛盾。排序规则由问题安全判据决定：拟阵按权值，活动按结束时间；方向本身不关键，关键是规则对应已证的选择性质。<\/p>\n<h2>逐层推导补遗<\/h2>\n<h3>交换论证两段拆解<\/h3>\n<p>第一段贪心选择性质：取最优解 <span class=\"katex-inline\">A<\/span>，若贪心选择 <span class=\"katex-inline\">g<\/span> 不在 <span class=\"katex-inline\">A<\/span>，把 <span class=\"katex-inline\">A<\/span> 同位决策 <span class=\"katex-inline\">a<\/span> 换成 <span class=\"katex-inline\">g<\/span>；核验替换后仍合法、解值不下降，得含 <span class=\"katex-inline\">g<\/span> 的最优解 <span class=\"katex-inline\">A&#x27;<\/span>。第二段最优子结构：固定 <span class=\"katex-inline\">g<\/span> 后剩余子问题独立取最优，与 <span class=\"katex-inline\">g<\/span> 拼成整体最优。两段齐备，贪心解不劣于最优解。<\/p>\n<h3>活动选择论证复查<\/h3>\n<p>最优解首活动 <span class=\"katex-inline\">a_k<\/span>，贪心 <span class=\"katex-inline\">a_1<\/span> 结束最早，<span class=\"katex-inline\">f(a_1)\\le f(a_k)<\/span>。<span class=\"katex-inline\">A<\/span> 中 <span class=\"katex-inline\">a_k<\/span> 之后活动都在 <span class=\"katex-inline\">a_k<\/span> 结束后开始，因而也在 <span class=\"katex-inline\">a_1<\/span> 结束后开始；换入 <span class=\"katex-inline\">a_1<\/span> 不产生冲突，活动数不变。剩余时间段重复交换，归纳贪心覆盖全部区间。<\/p>\n<h3>背包反例的破裂点<\/h3>\n<p>0-1 背包物品不可分割，选高单位物品占用容量后，剩余容量搭配不出最优组合。交换“高单位物品”改变剩余容量结构，后续空间不可保留，活动选择那套交换前提不成立。分数背包可按比例进入，容量占用可精细调整，耦合消失，贪心成立。<\/p>\n<h3>拟阵条件与一般贪心<\/h3>\n<p>拟阵独立集族满足遗传性（子集独立）与交换性质（大小不等独立集间可移元素）。权值拟阵按权降序贪心，跳过破坏独立性的元素，得最大权独立集。拟阵把贪心安全落到可核验公理；不满足拟阵的问题，贪心安全性要单独论证。<\/p>\n<h3>贪心失效的识别信号<\/h3>\n<p>决策之间有体积/资源耦合；局部最优挤出两件组合价值更高的选择；交换后剩余空间收窄。出现这些信号，不沿用贪心排序，退回 DP、搜索或带近似比的改造算法。<\/p>\n<h2>边界与常见误读补充<\/h2>\n<p>贪心安全要求贪心选择性质加最优子结构；决策存在体积或资源耦合时，局部最优挤出组合价值更高的选择，交换后剩余空间收窄，论证前提破裂。可分割物品按单位贪心成立，不可分割物品受整数体积约束。拟阵条件给出可核验的充分贪心场景；不满足拟阵的问题，贪心安全性要单独证明。贪心高效是运行时间属性，安全是最优性属性，两者不能互相替代；证不出选择性质就退回 DP、搜索或带近似比的改造算法。活动选择中早结束给后续留余地，晚开始规则不直接保留后续空间；排序依据必须对应已证的选择性质，换规则要重走交换论证。拟阵按权降序扫描，跳过破坏独立性的元素，留下最大权独立集；这是贪心安全的一类充分条件，不满足拟阵的问题不能套用。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n交换论证分哪两段？各核验什么条件？\n<\/li><li>\n活动选择问题中，把最优解首活动换成结束最早活动，后续空间为什么保留？\n<\/li><li>\n0-1 背包反例里贪心得到多少价值、最优是多少？破裂点在容量结构的哪一步？\n<\/li><li>\n分数背包为什么贪心成立？可分割性消除了哪种耦合？\n<\/li><li>\n拟阵的遗传性与交换性质各指什么？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "贪心的交换论证与失效反例"}, "c12": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.273<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">渐近记号：Θ、O、Ω 的定义差异与常见误用<\/a><\/span><\/div><h1>摊还分析三种方法：聚合、记账、势能与动态表<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书第 17 章 摊还分析，PDF 第 273 页起；17.1 聚合分析、17.2 记账分析、17.3 势能分析、17.4 动态表）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>有些数据结构单次操作代价很高，但一串操作下来总代价被多数廉价操作摊薄。动态表就是典型：插入平摊到每次很便宜，偶发的整体扩张要复制全部元素。分析这类结构时，既要避免被单次高代价误导成“操作很贵”，也不能引入概率假设去赌输入分布。摊还分析给一串操作的总代价求平均，结论对所有输入序列成立。这个概念讲清聚合、记账、势能三种方法的口径，以及它们怎样套到动态表上。<\/p>\n<h2>定义与符号逐项拆<\/h2>\n<p><strong>摊还代价<\/strong>：<span class=\"katex-inline\">n<\/span> 次操作总代价 <span class=\"katex-inline\">T(n)<\/span> 除以 <span class=\"katex-inline\">n<\/span>，得到每次操作的平均代价；摊还界是确定性结论，不依赖操作分布。<\/p>\n<p><strong>聚合分析<\/strong>：直接算出 <span class=\"katex-inline\">n<\/span> 次操作的实际总代价上界 <span class=\"katex-inline\">T(n)<\/span>，摊还代价 <span class=\"katex-inline\">T(n)/n<\/span>。路径最短，不区分操作类型。<\/p>\n<p><strong>记账分析<\/strong>：为早期操作预付一笔存款，记在数据结构的“账户”上；后期昂贵操作从账户支取。每次操作分记账代价与实际代价，存款余额始终非负，保证支取不超预付。<\/p>\n<p><strong>势能分析<\/strong>：给数据结构定义势能 <span class=\"katex-inline\">\\Phi<\/span>，类比势能储备。第 <span class=\"katex-inline\">i<\/span> 次操作摊还代价 <span class=\"katex-inline\">\\hat c_i=c_i+\\Phi(D_i)-\\Phi(D_{i-1})<\/span>，即实际代价加势能变化；势能上升抵消高实际代价，势能下降补贴后续操作。总摊还代价与总实际代价只差始末势能。<\/p>\n<p><strong>动态表<\/strong>：数组形式的可扩张表。装满时扩张到约两倍容量，复制旧元素；删空过多时收缩，避免空间浪费。<\/p>\n<h2>原理推导<\/h2>\n<h3>聚合分析套动态表<\/h3>\n<p>设表容量翻倍扩张。第 <span class=\"katex-inline\">i<\/span> 次插入触发扩张时，复制 <span class=\"katex-inline\">i-1<\/span> 个旧元素加插入新元素。扩张发生在容量 <span class=\"katex-inline\">1,2,4,8,\\dots<\/span> 处；<span class=\"katex-inline\">n<\/span> 次插入中，各次扩张复制量合计 <span class=\"katex-inline\">1+2+4+\\dots+n=O(n)<\/span>。加上 <span class=\"katex-inline\">n<\/span> 次普通插入 <span class=\"katex-inline\">O(n)<\/span>，总代价 <span class=\"katex-inline\">T(n)=O(n)<\/span>，摊还每次 <span class=\"katex-inline\">O(1)<\/span>。<\/p>\n<h3>记账分析套动态表<\/h3>\n<p>每次插入收取记账代价 3：1 元付本次插入，1 元存为对应元素的“再复制准备金”，1 元留作扩张时搬运旧元素的预付。表扩张时，已有元素的存款支取出来支付复制；新元素继续储备。记账约束：账户余额任何时刻非负，后期昂贵操作不超早期预付。<\/p>\n<h3>势能分析套动态表<\/h3>\n<p>定义势能 <span class=\"katex-inline\">\\Phi(D_i)=2\\cdot size_i-table_i<\/span>（规模与容量之差的两倍，按教材口径）。插入未扩张时 <span class=\"katex-inline\">size<\/span> 增大，势能上升，吸收后续复制成本；扩张瞬间势能下降，补贴一次性复制。摊还代价 <span class=\"katex-inline\">\\hat c_i=c_i+\\Delta\\Phi<\/span>：廉价操作势能小幅上升，高代价操作势能回落。总摊还代价 <span class=\"katex-inline\">\\sum\\hat c_i=\\sum c_i+\\Phi(D_n)-\\Phi(D_0)<\/span>，始末势能差有界，总摊还界即总实际代价界。<\/p>\n<h3>三种方法的关系<\/h3>\n<p>聚合只给总界；记账按操作类型分配预付；势能用状态函数把储备显性化。同一结构三种方法可达同阶摊还代价，选择看分析便利：结构简单用聚合，需区分操作用记账，有自然储备量用势能。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：操作序列总代价可分层计数；昂贵操作由早期廉价操作支撑；分析目标是一串操作的平均代价。<\/p>\n<p>边界一：摊还 <span class=\"katex-inline\">O(1)<\/span> 不排除某次操作 <span class=\"katex-inline\">O(n)<\/span>。最坏单次代价仍由具体操作决定，摊还界辩护的是整体平均，不是单次实时性。<\/p>\n<p>边界二：势能函数选择不唯一，选错势能可能得不出紧界；势能必须保证始末有界、中间不为负（记账口径）。摊还分析不替代最坏界，实时系统要求单次延迟上界。<\/p>\n<p>失败案例：把动态表插入说成“常数时间且从无复制”，忽略扩张复制；或反过来按扩张时的 <span class=\"katex-inline\">O(n)<\/span> 复制断言插入 <span class=\"katex-inline\">O(n)<\/span>，丢掉聚合后的摊还阶。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>摊还分析 vs 平均情况分析<\/strong>：摊还对所有输入序列成立，无随机假设；平均情况依赖输入分布或随机化算法，最坏单次仍可能很高。两者“平均”的口径不同。\n<\/li><li>\n<strong>聚合 vs 记账 vs 势能<\/strong>：聚合直接求总；记账分配预付额度；势能用状态变化抵消代价。记账可按操作记账目，势能可处理连续储备量。\n<\/li><li>\n<strong>摊还代价 vs 最坏代价<\/strong>：摊还是一串操作的人均；最坏是单次上界。动态表插入摊还 <span class=\"katex-inline\">O(1)<\/span>，最坏单次扩张 <span class=\"katex-inline\">O(n)<\/span>。\n<\/li><li>\n<strong>动态表扩张 vs 收缩<\/strong>：扩张装满翻倍，收缩过空减半；两者都用摊还分析控制搬移代价，收缩阈值防止表在临界尺寸反复抖动。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的阶语言陈述 <span class=\"katex-inline\">O(n)<\/span> 总代价与 <span class=\"katex-inline\">O(1)<\/span> 摊还；概念 c03 堆的操作高度分析是单次口径，可对照本章的序列口径。后继：概念 c09 图算法优先队列的批量操作可借摊还视角看总成本；概念 c13 NP 完全性讨论问题难度时，多项式与指数的分界同样以代价阶为度量。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（摊还分析三种方法：聚合、记账、势能与动态表）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：三方法套动态表与扩张序列算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>理解摊还分析，先往回追四层：<\/p>\n<ol><li>\n<strong>单次代价不能代表一串操作的代价<\/strong>。动态表复制只在装满时发生，多数插入廉价；按最坏单次断言操作很贵，或按多数插入断言从无高代价，都是口径错误。\n<\/li><li>\n<strong>需要一个对所有输入成立的平均口径<\/strong>。不赌输入分布，不引入随机源，只对操作序列总代价求人均；这是摊还分析区别于平均情况分析的位置。\n<\/li><li>\n<strong>总代价可分层计数<\/strong>：普通操作逐层计，昂贵操作沿触发位置展开；把各层求和再除以操作数，得摊还代价。\n<\/li><li>\n<strong>三种方法是同一目标的三条路径<\/strong>：聚合直接求总，记账分配预付，势能用状态储备抵消；总摊还与总实际只差始末势能。\n<\/ol>\n<p>依赖链方向：单次高代价 vs 多数廉价 → 确定性序列平均 → 分层计数求和 → 聚合/记账/势能三路径 → 动态表摊还 <span class=\"katex-inline\">O(1)<\/span>。<\/p>\n<h2>正向推导：三种方法逐步套到动态表<\/h2>\n<h3>聚合分析<\/h3>\n<p>设表容量满时翻倍。<span class=\"katex-inline\">n<\/span> 次插入：普通插入每次常量，合计 <span class=\"katex-inline\">O(n)<\/span>。扩张触发于容量 <span class=\"katex-inline\">1,2,4,\\dots,2^k<\/span>，第 <span class=\"katex-inline\">j<\/span> 次扩张复制 <span class=\"katex-inline\">2^{j-1}<\/span> 个旧元素。复制总量<\/p>\n<div class=\"katex-block\">\\sum_{j=1}^{k}2^{j-1}=2^k-1=O(n).<\/div>\n<p>总代价 <span class=\"katex-inline\">T(n)=O(n)+O(n)=O(n)<\/span>，摊还代价 <span class=\"katex-inline\">T(n)/n=O(1)<\/span>。聚合只给总界，不区分哪种操作贵。<\/p>\n<h3>记账分析<\/h3>\n<p>每次插入记账代价取 3：<\/p>\n<ul><li>\n1 元付本次插入实际操作；\n<\/li><li>\n1 元存入新元素准备金账户，供将来该元素被复制时支取；\n<\/li><li>\n1 元留作扩张搬运旧元素的预付。\n<\/ul>\n<p>扩张时，逐元素取出准备金支付复制；新插入元素继续储备。记账约束：任意时刻账户余额非负，后期复制不超早期预付。若某次支取超储，说明预付额度定低，需调高记账代价。<\/p>\n<h3>势能分析<\/h3>\n<p>设 <span class=\"katex-inline\">size_i<\/span> 为第 <span class=\"katex-inline\">i<\/span> 次插入后表内元素数，<span class=\"katex-inline\">table_i<\/span> 为当前容量。势能定义 <span class=\"katex-inline\">\\Phi(D_i)=2\\cdot size_i-table_i<\/span>（按教材口径的差额势能）。<\/p>\n<p>第 <span class=\"katex-inline\">i<\/span> 次操作摊还代价：<\/p>\n<div class=\"katex-block\">\\hat c_i=c_i+\\Phi(D_i)-\\Phi(D_{i-1})=c_i+\\Delta\\Phi.<\/div>\n<p>未扩张插入：<span class=\"katex-inline\">size<\/span> 加 1，<span class=\"katex-inline\">table<\/span> 不变，<span class=\"katex-inline\">\\Delta\\Phi=2<\/span>，摊还代价常量级；扩张瞬间：容量翻倍，<span class=\"katex-inline\">size<\/span> 不变、<span class=\"katex-inline\">table<\/span> 大增，<span class=\"katex-inline\">\\Delta\\Phi<\/span> 为负，势能回落补贴复制成本。<\/p>\n<p>总摊还与总实际关系：<\/p>\n<div class=\"katex-block\">\\sum_{i=1}^{n}\\hat c_i=\\sum_{i=1}^{n}c_i+\\Phi(D_n)-\\Phi(D_0).<\/div>\n<p>始末势能差有界，总摊还上界即总实际代价上界。势能函数可换，只要满足始末有界、变化方向能抵消高代价操作。<\/p>\n<h3>扩张与收缩的抖动防护<\/h3>\n<p>表删空到一定比例时收缩容量。若阈值设在临界尺寸，表可能在同一容量反复扩张收缩；收缩阈值留区间，配合势能缓冲，避免搬移抖动。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：翻倍扩张的复制量<\/h3>\n<p>表从容量 1 开始，依次插入：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>插入序号<\/th><th>触发动作<\/th><th>复制旧元素数<\/th><th>本次实际代价<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>装入容量 1<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>2<\/td><td>扩张到 2，复制 1<\/td><td>1<\/td><td>2<\/td><\/tr><tr><td>3<\/td><td>装入容量 2<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>4<\/td><td>扩张到 4，复制 2<\/td><td>2<\/td><td>3<\/td><\/tr><tr><td>5–7<\/td><td>装入容量 4<\/td><td>0<\/td><td>各 1<\/td><\/tr><tr><td>8<\/td><td>扩张到 8，复制 4<\/td><td>4<\/td><td>5<\/td><\/tr><\/tbody><\/table><\/div>\n<p>前 8 次插入复制量 <span class=\"katex-inline\">0+1+0+2+0+0+0+4=7<\/span>，普通插入 8 次，总代价 <span class=\"katex-inline\">15<\/span> 量级，人均约 2；<span class=\"katex-inline\">n<\/span> 增大时复制总量 <span class=\"katex-inline\">2^k-1<\/span>，总代价 <span class=\"katex-inline\">O(n)<\/span>，摊还 <span class=\"katex-inline\">O(1)<\/span>。<\/p>\n<h3>算例 2：势能数值核验<\/h3>\n<p>取表容量 <span class=\"katex-inline\">table=4<\/span>，元素 <span class=\"katex-inline\">size=3<\/span>：<span class=\"katex-inline\">\\Phi=2\\cdot3-4=2<\/span>。插入第 4 个元素未扩张：<span class=\"katex-inline\">size=4,table=4<\/span>，<span class=\"katex-inline\">\\Phi=4<\/span>，<span class=\"katex-inline\">\\Delta\\Phi=2<\/span>；摊还代价 <span class=\"katex-inline\">c_i+2<\/span>，<span class=\"katex-inline\">c_i<\/span> 为常量，摊还常量级。 下次插入触发扩张：<span class=\"katex-inline\">size=5,table=8<\/span>，<span class=\"katex-inline\">\\Phi=10-8=2<\/span>，<span class=\"katex-inline\">\\Delta\\Phi=2-4=-2<\/span>；本次复制 4 个元素，高实际代价被负势能变化抵消，摊仍为常量级。<\/p>\n<h3>算例 3：记账余额跟踪<\/h3>\n<p>容量 2 时两元素各存 1 元准备金，账户 2 元。扩张到 4 复制两元素，支取 2 元；新两元素各存 1 元，账户回到 2 元。余额全程非负，复制支付不超预付。<\/p>\n<h2>对抗性追问<\/h2>\n<p><strong>追问一：摊还 <span class=\"katex-inline\">O(1)<\/span> 能不能用于论证实时性？<\/strong> 不能。摊还是序列人均，单次扩张仍 <span class=\"katex-inline\">O(n)<\/span>；硬实时任务要求单次延迟上界，需要最坏界证明，摊还结论放宽不了单次约束。<\/p>\n<p><strong>追问二：势能函数必须取教材那个式子吗？<\/strong> 不必。势能是分析工具，只要始末有界、升降方向能抵消昂贵操作，不同定义可得同阶摊还界；选错势能可能上界偏松。<\/p>\n<p><strong>追问三：记账分析和平均情况分析都在“平均”，差别在哪？<\/strong> 记账的预付由操作序列内部产生，结论对任何输入成立；平均情况假设输入按某分布，或算法本身随机，最坏样本仍可能拉高单次代价。前者确定性，后者带概率口径。<\/p>\n<h2>延伸推演：其他结构的摊还、势能准则与抖动防护<\/h2>\n<h3>二进制计数器的摊还<\/h3>\n<p>增量操作翻转最低位起的连续一串 1。第 <span class=\"katex-inline\">i<\/span> 位每 <span class=\"katex-inline\">2^i<\/span> 次增量翻转一次；<span class=\"katex-inline\">n<\/span> 次增量总翻转次数 <span class=\"katex-inline\">\\sum_{i=0}^{\\lg n} n/2^i=O(n)<\/span>，摊还每次 <span class=\"katex-inline\">O(1)<\/span>。势能可取 1 的个数：增量前势能高，翻转时势能下降补贴操作代价。<\/p>\n<h3>栈操作的多方法对照<\/h3>\n<p>栈推入 <span class=\"katex-inline\">O(1)<\/span>；多重弹出一次弹 <span class=\"katex-inline\">k<\/span> 个，单次 <span class=\"katex-inline\">O(k)<\/span>。聚合：<span class=\"katex-inline\">n<\/span> 次推入配合弹出，元素每入栈一次出栈一次，总代价 <span class=\"katex-inline\">O(n)<\/span>，摊还 <span class=\"katex-inline\">O(1)<\/span>。记账：推入预付弹出费用。势能：栈深即势能，弹出时势能回落抵消弹出代价。<\/p>\n<h3>势能函数选择准则<\/h3>\n<p>势能要始末有界：初始与终了势能差可控；中间势能方向能抵消昂贵操作；定义贴合结构储备量。选偏势能只得松界，不影响摊还结论方向。势能不唯一，同一结构可有多套等价定义。<\/p>\n<h3>收缩阈值与抖动<\/h3>\n<p>表删空到一定比例触发收缩；阈值设在临界尺寸时，表可能反复扩张收缩，搬移抖动。收缩区间留缓冲，配合势能回落，避免同一容量边界来回翻。扩张与收缩对称，都靠摊还控制搬移代价。<\/p>\n<h3>第二算例：计数器翻转次数<\/h3>\n<p><span class=\"katex-inline\">n=8<\/span>，从 0000 增到 1000：<\/p>\n<ul><li>\n第 1 次：翻 1 位（0001）；第 2 次：翻 2 位（0010）；第 3 次：翻 1 位（0011）；第 4 次：翻 3 位（0100）；第 5 次：翻 1 位；第 6 次：翻 2 位；第 7 次：翻 1 位；第 8 次：翻 4 位。\n<\/li><li>\n总翻转 <span class=\"katex-inline\">1+2+1+3+1+2+1+4=15<\/span>，<span class=\"katex-inline\">O(n)<\/span>，人均约 1.9。位 <span class=\"katex-inline\">i<\/span> 翻转频率 <span class=\"katex-inline\">1/2^{i+1}<\/span>，求和 <span class=\"katex-inline\">\\sum n/2^i=2n<\/span> 量级。\n<\/ul>\n<h3>对抗性追问补充<\/h3>\n<p><strong>追问四：摊还界能不能承诺单次延迟？<\/strong> 不能。摊还是序列人均，单次昂贵操作仍可能 <span class=\"katex-inline\">O(n)<\/span>；硬实时调度需要最坏单次上界，摊还结论不放宽单次约束。<\/p>\n<p><strong>追问五：记账分析的存款可以为负吗？<\/strong> 不可以。账户余额任一时点非负是预付约束；后期支取超过早期预付，记账平衡破裂，需要调高单次记账代价。<\/p>\n<h2>逐层推导补遗<\/h2>\n<h3>三方法的核算口径<\/h3>\n<p>聚合：<span class=\"katex-inline\">n<\/span> 次操作实际总代价 <span class=\"katex-inline\">T(n)<\/span>，摊还 <span class=\"katex-inline\">T(n)/n<\/span>，不区分操作类型。记账：每次操作分记账代价与实际代价，早期预付存账户，后期昂贵操作支取，余额全程非负。势能：<span class=\"katex-inline\">\\hat c_i=c_i+\\Phi(D_i)-\\Phi(D_{i-1})<\/span>，势能升降抵消高实际代价。<\/p>\n<h3>动态表聚合求和<\/h3>\n<p>容量翻倍扩张，扩张触发于 <span class=\"katex-inline\">1,2,4,\\dots,2^k<\/span>，第 <span class=\"katex-inline\">j<\/span> 次复制 <span class=\"katex-inline\">2^{j-1}<\/span> 旧元素。复制总量 <span class=\"katex-inline\">\\sum_{j=1}^k 2^{j-1}=2^k-1=O(n)<\/span>；普通插入 <span class=\"katex-inline\">O(n)<\/span>；总代价 <span class=\"katex-inline\">O(n)<\/span>，摊还每次 <span class=\"katex-inline\">O(1)<\/span>。<\/p>\n<h3>势能公式与动态表<\/h3>\n<p><span class=\"katex-inline\">\\Phi(D_i)=2\\cdot size_i-table_i<\/span>（教材口径差额势能）。未扩张插入 <span class=\"katex-inline\">size<\/span> 加 1，<span class=\"katex-inline\">\\Delta\\Phi=2<\/span>；扩张瞬间容量翻倍，<span class=\"katex-inline\">\\Delta\\Phi<\/span> 为负，补贴复制成本。总摊还 <span class=\"katex-inline\">\\sum\\hat c_i=\\sum c_i+\\Phi(D_n)-\\Phi(D_0)<\/span>，始末势能差有界，总摊还界即总实际界。<\/p>\n<h3>摊还与平均情况的分界<\/h3>\n<p>摊还对所有输入序列成立，无随机假设；平均情况依赖输入分布或随机化算法，最坏单次仍可能很高。摊还辩护整体平均，不承诺单次实时延迟；硬实时任务需最坏单次上界。<\/p>\n<h3>收缩抖动防护<\/h3>\n<p>删空到阈值触发收缩，阈值设在临界尺寸会导致表在同一容量反复扩张收缩。收缩区间留缓冲，配合势能回落，避免搬移抖动。扩张与收缩对称，都用摊还控制搬移代价。<\/p>\n<h3>势能函数选取要求<\/h3>\n<p>始末有界：初始终了势能差可控；方向贴合储备量：廉价操作势能小幅上升，昂贵操作势能回落；定义不唯一，选错只得松界，不改摊还方向。<\/p>\n<h2>边界与常见误读补充<\/h2>\n<p>摊还界对所有输入序列成立，无随机假设；平均情况依赖输入分布或随机化算法，最坏单次仍可能很高。摊还是序列人均，不承诺单次实时延迟，硬实时调度需最坏单次上界。势能函数始末必须有界，中间不为负；选错势能只得松界。记账账户余额全程不能为负，后期支取超早期预付则记账平衡破裂。收缩阈值设在临界尺寸会引发扩张收缩抖动，需留缓冲配合势能回落。动态表扩张复制 <span class=\"katex-inline\">2^{j-1}<\/span> 旧元素，复制总量 <span class=\"katex-inline\">2^k-1=O(n)<\/span>，普通插入 <span class=\"katex-inline\">O(n)<\/span>，总代价 <span class=\"katex-inline\">O(n)<\/span>，摊还每次 <span class=\"katex-inline\">O(1)<\/span>。二进制计数器位 <span class=\"katex-inline\">i<\/span> 每 <span class=\"katex-inline\">2^i<\/span> 次翻转一次，总翻转 <span class=\"katex-inline\">\\sum n/2^i=O(n)<\/span>，是另一类摊还样本。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出摊还代价与总实际代价的关系（含始末势能差）。\n<\/li><li>\n动态表 <span class=\"katex-inline\">n<\/span> 次插入的复制总量为什么是 <span class=\"katex-inline\">O(n)<\/span>？按扩张位置求和。\n<\/li><li>\n记账分析中每次插入的 3 元各付什么？账户余额为什么必须非负？\n<\/li><li>\n势能分析里未扩张插入与扩张瞬间的 <span class=\"katex-inline\">\\Delta\\Phi<\/span> 分别朝哪个方向？\n<\/li><li>\n摊还分析与最坏情况分析、平均情况分析三者口径各是什么？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "摊还分析三种方法：聚合、记账、势能与动态表"}, "c13": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.631<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">贪心的交换论证与失效反例<\/a><\/span><\/div><h1>NP 完全性的归约与“承认困难”的意义<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章（原书第 34 章 NP 完全性，PDF 第 631 页起；34.4 NP 完全性的证明、34.5 NP 完全问题）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>有些组合优化问题始终找不到多项式时间算法，工程上写贪心或 DP 又拿不到最优保证。要判断这类问题是“还没找到好算法”还是“问题本身有障碍”，需要一套形式化框架：用多项式时间归约把问题之间的难度挂钩，用 P、NP、NP 完全性给出层级定位。这个概念讲清归约怎样传递难度、NP 完全问题怎么证明，以及承认一个问题难解之后，算法设计转向哪些方向。<\/p>\n<h2>定义与符号逐项拆<\/h2>\n<p><strong>多项式时间<\/strong>：算法代价 <span class=\"katex-inline\">O(n^k)<\/span>，<span class=\"katex-inline\">k<\/span> 为常量；超出多项式的指数、阶乘代价视为难解。<\/p>\n<p><strong>P 类<\/strong>：所有存在多项式时间判定算法的问题。<\/p>\n<p><strong>NP 类<\/strong>：所有解的正确性可在多项式时间内验证的问题；给出一个候选解，能多项式核对是否满足要求。<\/p>\n<p><strong>多项式时间归约<\/strong>：问题 <span class=\"katex-inline\">A<\/span> 的任一输入可在多项式时间内变换成问题 <span class=\"katex-inline\">B<\/span> 的输入，记 <span class=\"katex-inline\">A\\le_p B<\/span>。<span class=\"katex-inline\">A<\/span> 的答案与 <span class=\"katex-inline\">B<\/span> 的答案对应一致。<\/p>\n<p><strong>NP 难（NP-hard）<\/strong>：所有 NP 问题都可多项式归约到它，但它本身不必属于 NP。<\/p>\n<p><strong>NP 完全（NPC）<\/strong>：同时属于 NP 且 NP 难的问题。它是 NP 中难度最高的一层：若任一 NPC 问题有多项式算法，则 P=NP。<\/p>\n<p><strong>Cook 定理<\/strong>：布尔可满足性问题（SAT）是第一个被证明的 NPC 问题；此后新 NPC 问题通过把已知 NPC 问题归约过来链式证明（原书 34.4 节，PDF 第 640 页起，转述）。<\/p>\n<h2>原理推导<\/h2>\n<h3>归约传递难度<\/h3>\n<p>设 <span class=\"katex-inline\">A\\le_p B<\/span>。若 <span class=\"katex-inline\">B<\/span> 有多项式算法，归约变换多项式，复合后 <span class=\"katex-inline\">A<\/span> 也有多项式算法。逆否命题：若 <span class=\"katex-inline\">A<\/span> 不存在多项式算法，则 <span class=\"katex-inline\">B<\/span> 也不存在。归约方向因此是“难的一侧挂到易的一侧”：证明 <span class=\"katex-inline\">A<\/span> 不比 <span class=\"katex-inline\">B<\/span> 易解。<\/p>\n<h3>NPC 的两条准入<\/h3>\n<p>一条在 NP 内：候选解可多项式验证；一条是 NP 难：所有 NP 问题可归约到它。两条齐备才称 NPC。只满足 NP 难而不在 NP 内（如某些优化问题），称 NP 难而非 NPC。<\/p>\n<h3>证明新问题为 NPC 的框架<\/h3>\n<ol><li>\n证明该问题属于 NP：写一个多项式验证算法核对候选解。\n<\/li><li>\n选一个已知 NPC 问题 <span class=\"katex-inline\">L<\/span>。\n<\/li><li>\n构造多项式归约：把 <span class=\"katex-inline\">L<\/span> 的输入变换成目标问题的输入，使两边答案等价。\n<\/li><li>\n归约存在即目标问题 NP 难；加 NP 成员资格，目标为 NPC。\n<\/ol>\n<h3>“承认困难”的工程含义<\/h3>\n<p>NPC 问题在 P≠NP 的前提下不存在已知多项式精确算法。承认困难不等于放弃求解：工程上转三条路——指数规模搜索（小规模实例）、近似算法（可证明的近似比，见原书第 35 章，PDF 第 666 页起）、启发式（无保证的经验规则）。选择哪条取决于实例规模、误差容忍与时间约束。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：讨论对象是判定问题；归约变换必须在多项式时间内完成；问题规模以输入编码长度度量。<\/p>\n<p>边界一：P 与 NP 是否相等尚未证明。NPC 问题目前没有已知多项式算法，但不能在数学上断言它们“不可解”；结论是条件性的。<\/p>\n<p>边界二：NPC 不等于不可计算。问题仍可枚举求解，代价是指数级；难解指不存在已知多项式精确算法。<\/p>\n<p>边界三：归约保持答案等价，不保持优化目标；优化问题要先转成判定版本（给定预算内是否存在解）再纳入 NP 框架。<\/p>\n<p>失败案例：把一个 NP 难优化问题当成多项式问题套贪心，输出无近似保证的结果；或见到 NPC 标记就认为问题“完全没法算”，忽略小规模精确求解与近似路线。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>NPC vs NP 难<\/strong>：NPC 必属 NP 且 NP 难；NP 难只要求所有 NP 问题归约到它，本身可不在 NP。口语中常混用，严格证明时两条要分开核验。\n<\/li><li>\n<strong>多项式 vs 指数<\/strong>：多项式随规模增长平缓，指数在中等规模爆炸；复杂性理论以多项式为可行计算的分界。\n<\/li><li>\n<strong>归约 vs 算法<\/strong>：归约是问题之间的输入变换，不是求解算法；它传递难度，不直接给出答案。\n<\/li><li>\n<strong>最坏情况 vs 平均情况<\/strong>：NP 完全性针对最坏输入；某 NPC 问题在典型分布上可能有实用启发式，平均难度不被 NPC 标记直接刻画。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c05 决策树对比较次数的下界是问题对算法的局部约束；本章是问题层面对多项式算法的全局分界。后继：概念 c11 贪心在可证条件下给最优，背包类耦合问题的判定版本恰是 NPC；概念 c10 DP 可解的多项式问题与 NPC 问题之间的界限，正是归约链条区分的对象。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（NP 完全性的归约与“承认困难”的意义）<\/summary><div class=\"depth-body\"><h1>c13 深度推导：复杂性层级、归约传递链条与 NPC 证明框架<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>理解 NP 完全性，先往回追四层：<\/p>\n<ol><li>\n<strong>算法可行性以多项式时间为分界<\/strong>。<span class=\"katex-inline\">O(n^k)<\/span> 随规模增长可控，指数/阶乘在中等规模失控；先把问题按是否有多项式判定算法分类。\n<\/li><li>\n<strong>可验证性是 NP 的入口<\/strong>。给一个候选解，能多项式核对对错，问题就落在 NP；P 是 NP 中能直接多项式求解的子集，<span class=\"katex-inline\">P\\subseteq NP<\/span>。\n<\/li><li>\n<strong>问题之间靠归约挂钩难度<\/strong>。<span class=\"katex-inline\">A\\le_p B<\/span> 表示 <span class=\"katex-inline\">A<\/span> 输入可多项式变换成 <span class=\"katex-inline\">B<\/span> 输入；<span class=\"katex-inline\">B<\/span> 易解则 <span class=\"katex-inline\">A<\/span> 易解，逆否即 <span class=\"katex-inline\">A<\/span> 难解则 <span class=\"katex-inline\">B<\/span> 难解。\n<\/li><li>\n<strong>NPC 是 NP 的最难层<\/strong>：属 NP 且所有 NP 问题可归约到它。证明新 NPC 问题，从已知 NPC 问题归约过来即可；承认困难后再选近似、指数或启发式路线。\n<\/ol>\n<p>依赖链方向：多项式分界 → P/NP 定义 → 归约传递难度 → NPC 双条件 → 链式证明 → 工程退路选择。<\/p>\n<h2>正向推导：层级与归约逐步展开<\/h2>\n<h3>P 与 NP 的成员判定<\/h3>\n<p>P：存在算法 <span class=\"katex-inline\">A<\/span>，对任意输入 <span class=\"katex-inline\">x<\/span>，<span class=\"katex-inline\">A(x)<\/span> 在 <span class=\"katex-inline\">O(n^k)<\/span> 内给出是/否。 NP：存在验证算法 <span class=\"katex-inline\">V<\/span>，对候选解 <span class=\"katex-inline\">y<\/span>，<span class=\"katex-inline\">V(x,y)<\/span> 在多项式内判断 <span class=\"katex-inline\">y<\/span> 是否为合法解；解存在当且仅当存在这样的 <span class=\"katex-inline\">y<\/span>。 关系：<span class=\"katex-inline\">P\\subseteq NP<\/span>。<span class=\"katex-inline\">P=NP<\/span> 是否成立是开放问题，不能当作已证结论。<\/p>\n<h3>归约的难度传递<\/h3>\n<p>归约 <span class=\"katex-inline\">f<\/span>：<span class=\"katex-inline\">A<\/span> 输入 <span class=\"katex-inline\">x<\/span> 映射为 <span class=\"katex-inline\">B<\/span> 输入 <span class=\"katex-inline\">f(x)<\/span>，<span class=\"katex-inline\">x\\in A\\iff f(x)\\in B<\/span>，<span class=\"katex-inline\">f<\/span> 多项式可算。<\/p>\n<p>正向：<span class=\"katex-inline\">B<\/span> 有多项式算法 <span class=\"katex-inline\">M<\/span>，则 <span class=\"katex-inline\">A<\/span> 算法为“先 <span class=\"katex-inline\">f(x)<\/span> 再 <span class=\"katex-inline\">M(f(x))<\/span>”，两次多项式复合仍多项式。 逆否：若 <span class=\"katex-inline\">A<\/span> 无多项式算法，则 <span class=\"katex-inline\">B<\/span> 无多项式算法；否则 <span class=\"katex-inline\">B<\/span> 的算法经归约可解 <span class=\"katex-inline\">A<\/span>，矛盾。<\/p>\n<p>归约方向记忆：<span class=\"katex-inline\">A\\le_p B<\/span> 读作 <span class=\"katex-inline\">A<\/span> 不比 <span class=\"katex-inline\">B<\/span> 易解；证明 <span class=\"katex-inline\">B<\/span> 难，要把已知难的 <span class=\"katex-inline\">A<\/span> 归约到 <span class=\"katex-inline\">B<\/span>。<\/p>\n<h3>NPC 双条件<\/h3>\n<p>条件一：目标问题在 NP 内，验证算法多项式。 条件二：任一 NP 问题 <span class=\"katex-inline\">L<\/span> 满足 <span class=\"katex-inline\">L\\le_p<\/span> 目标问题（NP 难）。 两条齐备为 NPC。若只满足条件二，称 NP 难；优化问题常属此类，需先转判定版本进 NP。<\/p>\n<h3>链式证明框架<\/h3>\n<ol><li>\n成员资格：写目标问题的多项式验证器。\n<\/li><li>\n选锚点：已知 NPC 问题（如 SAT、3SAT）。\n<\/li><li>\n构造归约：锚点输入 → 目标输入，答案等价；变换规模多项式。\n<\/li><li>\n结论：目标 NP 难；加成员资格，目标 NPC。\n<\/li><li>\n后续问题以新 NPC 为锚点继续归约，形成证明链。\n<\/ol>\n<h3>承认困难后的路线<\/h3>\n<ul><li>\n指数搜索：实例规模小，枚举可接受；\n<\/li><li>\n近似算法：放弃最优，换可证明近似比（原书第 35 章）；\n<\/li><li>\n启发式：经验规则，无最坏保证，靠实测调优。\n<p>路线选择由规模、误差容忍、延迟要求共同决定。<\/p>\n<\/ul>\n<h2>数值算例<\/h2>\n<h3>算例 1：归约链示意<\/h3>\n<p>SAT（合取范式可满足性）是首个 NPC 问题。3SAT（每个子句恰 3 个文字）由 SAT 归约构造：补变量、拆短子句，保持可满足性等价，变换多项式。<\/p>\n<p>3SAT 再归约到团问题（CLIQUE）：对每个文字建结点，同子句结点互连，互补文字结点互连；图中 <span class=\"katex-inline\">k<\/span> 团对应 3SAT 的可满足赋值。归约图结点数随文字数线性，边数多项式。<\/p>\n<p>团问题可继续归约到顶点覆盖、独立集等；每条归约保持答案等价，难度沿链传递。<\/p>\n<h3>算例 2：归约规模核验<\/h3>\n<p>设 3SAT 实例有 <span class=\"katex-inline\">m<\/span> 个子句、<span class=\"katex-inline\">n<\/span> 个变量。构造团图：结点 <span class=\"katex-inline\">3m<\/span>（每子句三文字），同子句全互连，互补文字不互连；边数 <span class=\"katex-inline\">O(m^2)<\/span>。变换时间多项式于 <span class=\"katex-inline\">m,n<\/span>，满足归约的多项式要求。若归约本身要指数枚举，链条不成立。<\/p>\n<h3>算例 3：判定版本与优化版本<\/h3>\n<p>0-1 背包优化版：求最大价值；判定版：容量 <span class=\"katex-inline\">W<\/span> 内是否存在价值 <span class=\"katex-inline\">\\ge K<\/span> 的装法。判定版属 NP（候选装入方案可多项式核对重量与价值）；优化版可由判定版二分价值反推。讨论 NPC 时先落判定版。<\/p>\n<h2>对抗性追问<\/h2>\n<p><strong>追问一：NPC 问题是不是“不可计算”？<\/strong> 不是。可枚举所有候选解核对，代价指数级；难解指不存在已知多项式精确算法。可计算性与复杂性是两层概念。<\/p>\n<p><strong>追问二：P=NP 没证明，凭什么说 NPC 难？<\/strong> NPC 结论是条件性的：若 P≠NP，NPC 无多项式算法；目前无已知多项式算法，工程上按难解处理。不能在表述上写成“NPC 已证明无多项式算法”。<\/p>\n<p><strong>追问三：归约能不能用来求问题的解？<\/strong> 不能直接。归约只变换输入、传递难度；求解仍要靠目标问题的算法或搜索。把归约当算法是方向混淆。<\/p>\n<p><strong>追问四：平均情况容易的 NPC 问题存在吗？<\/strong> 可能存在。NPC 标记针对最坏输入；典型分布上的实用启发式不被该标记否定，平均难度需单独的分布复杂性分析。<\/p>\n<h2>延伸推演：判定版本、归约等价与条件性结论<\/h2>\n<h3>优化问题先转判定版本<\/h3>\n<p>优化问题求最优值（背包最大价值）；判定问题给定预算 <span class=\"katex-inline\">K<\/span>，问是否存在价值 <span class=\"katex-inline\">\\ge K<\/span> 的解。判定版候选解可多项式核对，属 NP；优化版可由判定版二分价值反推。讨论 NPC 时先落判定框架，避免把优化目标混入验证器。<\/p>\n<h3>归约保持答案等价<\/h3>\n<p>归约 <span class=\"katex-inline\">f<\/span> 要求 <span class=\"katex-inline\">x\\in A\\iff f(x)\\in B<\/span>：是答案对应是，否对应否。只变换输入不够，两边解集必须一致；归约时间多项式于输入编码长度。变换若本身指数枚举，难度传递链条不成立。<\/p>\n<h3>P=NP 的条件性位置<\/h3>\n<p>NPC 目前无已知多项式算法，但 <span class=\"katex-inline\">P=NP<\/span> 是否成立未证。表述上只能说“在 P≠NP 前提下不存在已知多项式精确算法”，不能写成“已证明不可解”。复杂性理论的分界是条件结论，工程按难解处理。<\/p>\n<h3>近似路线的误差口径<\/h3>\n<p>近似算法给出解离最优的可证明偏差：近似比 <span class=\"katex-inline\">\\rho<\/span> 表示解值与最优值的倍数差距。启发式无最坏保证，靠实测调优；工程选型按实例规模、误差容忍、延迟要求在指数搜索、近似、启发式间取舍。<\/p>\n<h3>第二算例：团到顶点覆盖的归约示意<\/h3>\n<p>团问题：图 <span class=\"katex-inline\">G<\/span> 是否含 <span class=\"katex-inline\">k<\/span> 团。补图 <span class=\"katex-inline\">\\bar G<\/span> 中，<span class=\"katex-inline\">G<\/span> 的 <span class=\"katex-inline\">k<\/span> 团对应 <span class=\"katex-inline\">\\bar G<\/span> 的 <span class=\"katex-inline\">n-k<\/span> 顶点覆盖：团内结点在补图互不连边，覆盖补图所有边需取团外全部结点。归约构造补图多项式于结点边数，答案等价。已知团为 NPC，归约得顶点覆盖 NPC；反向再从顶点覆盖归约到独立集。<\/p>\n<h3>归约链的传递方向<\/h3>\n<p>锚点 NPC → 新问题：证明新问题 NP 难。新问题再作锚点继续外扩。每一步核验两件事：目标在 NP 内（验证器多项式）；归约多项式且答案等价。链条上任一环节归约超多项式，难度传递中断。<\/p>\n<h3>对抗性追问补充<\/h3>\n<p><strong>追问四：NPC 问题平均情况容易吗？<\/strong> NPC 标记针对最坏输入；某问题在典型分布上可能有实用启发式。平均难度属分布复杂性范畴，不被 NPC 结论直接否定，需单独分析。<\/p>\n<p><strong>追问五：归约能不能用来直接求最优解？<\/strong> 不能。归约变换输入、传递难度，不产出答案；求解仍依赖目标问题算法或搜索。把归约当算法是方向混淆。<\/p>\n<h2>逐层推导补遗<\/h2>\n<h3>层级包含关系<\/h3>\n<p>P：有多项式判定算法。NP：候选解可多项式验证，<span class=\"katex-inline\">P\\subseteq NP<\/span>。NP 难：所有 NP 问题可归约到它，本身不必属 NP。NPC：属 NP 且 NP 难，是 NP 最难层。若任一 NPC 有多项式算法，则 <span class=\"katex-inline\">P=NP<\/span>；该等式目前未证。<\/p>\n<h3>归约传递方向<\/h3>\n<p><span class=\"katex-inline\">A\\le_p B<\/span>：<span class=\"katex-inline\">A<\/span> 输入多项式变换成 <span class=\"katex-inline\">B<\/span> 输入，答案等价。<span class=\"katex-inline\">B<\/span> 有多项式算法 ⇒ <span class=\"katex-inline\">A<\/span> 有多项式算法；逆否：<span class=\"katex-inline\">A<\/span> 无多项式算法 ⇒ <span class=\"katex-inline\">B<\/span> 无。归约挂难度是“难的一侧挂到易的一侧”，证明 <span class=\"katex-inline\">B<\/span> 难要把已知难的 <span class=\"katex-inline\">A<\/span> 归约到 <span class=\"katex-inline\">B<\/span>。<\/p>\n<h3>NPC 证明四步<\/h3>\n<ol><li>\n成员资格：写目标问题多项式验证器。\n<\/li><li>\n选锚点：已知 NPC 问题（SAT、3SAT 等）。\n<\/li><li>\n构造归约：锚点输入 → 目标输入，答案等价，变换多项式。\n<\/li><li>\n目标 NP 难；加成员资格，目标 NPC。后续问题以新 NPC 为锚继续链式外扩。\n<\/ol>\n<h3>判定与优化版本<\/h3>\n<p>优化问题求最优值；判定问题给定预算 <span class=\"katex-inline\">K<\/span> 问是否存在达标解。判定版候选解可多项式核对属 NP；优化版可由判定版二分反推。讨论 NPC 先落判定框架，不把优化目标混入验证器。<\/p>\n<h3>承认困难后的三条路线<\/h3>\n<p>小规模实例走指数枚举；要求质量走近似算法，换取可证明近似比；容忍误差上启发式，无最坏保证。选型由实例规模、误差容忍、延迟约束共同决定。<\/p>\n<h3>条件性表述边界<\/h3>\n<p>NPC 目前无已知多项式算法，但不能写成“已证明不可解”。<span class=\"katex-inline\">P=NP<\/span> 开放，结论是条件性的；工程按难解处理，同时保留若 P=NP 则链条整体翻案的理论余地。<\/p>\n<h2>边界与常见误读补充<\/h2>\n<p>NPC 目前无已知多项式算法，但 <span class=\"katex-inline\">P=NP<\/span> 未证，不能表述成“已证明不可解”；结论是条件性的。归约必须多项式时间且答案等价，变换本身指数枚举则难度传递中断。优化问题先转判定版本再纳入 NP 框架。NPC 标记针对最坏输入，典型分布上可能存在实用启发式，平均难度需单独分析。承认困难后三条路线：小规模指数枚举、带近似比的近似算法、无保证启发式；选型按规模、误差容忍与延迟约束决定。归约链每一步核验两件事：目标在 NP 内，验证器多项式；归约多项式且答案等价。链条任一环节归约超多项式，难度传递中断；锚点从 SAT 出发，经 3SAT 外扩到团、顶点覆盖、独立集等问题。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 P、NP、NP 难、NPC 四个概念的定义与包含关系。\n<\/li><li>\n<span class=\"katex-inline\">A\\le_p B<\/span> 在 <span class=\"katex-inline\">B<\/span> 有多项式算法时推出什么？逆否命题是什么？\n<\/li><li>\n证明一个新问题为 NPC 分哪几步？成员资格条件核验什么？\n<\/li><li>\n归约变换为什么必须在多项式时间内完成？指数归约为什么不传递难度？\n<\/li><li>\n承认 NPC 困难之后，工程上有哪三条求解路线？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "NP 完全性的归约与“承认困难”的意义"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：算法基础与复杂度分析：插入排序/归并排序、渐近记号、递归式与主定理<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：算法基础与复杂度分析（插入排序/归并排序、渐近记号、递归式、主定理）<\/a><br>检查点：能用循环不变式描述插入排序的正确性，区分 Θ/O/Ω 的定义差异，把分治递归式写成 $T(n)=aT(n/b)+f(n)$ 并按主定理三种情形判阶，给出 $\\lg n$ 与 $n^{0.99}$ 的阶比较<\/li><li class='path-step' id='path-02'><strong>步骤 02：排序与顺序统计：堆排序、快速排序、线性时间排序与选择算法<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：排序与顺序统计（堆排序、快速排序、线性时间排序、中位数与顺序统计）<\/a><br>检查点：能用求和上界证明建堆 $O(n)$，用指示变量法推出快速排序期望 $O(n\\lg n)$，用决策树论证比较排序下界 $\\Omega(n\\lg n)$，并说清计数/基数排序凭什么突破该下界、代价是什么<\/li><li class='path-step' id='path-03'><strong>步骤 03：数据结构与图算法：散列表、红黑树、B 树、图遍历、最小生成树与最短路<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：数据结构与图算法（哈希表、红黑树、B 树、图的表示、BFS/DFS、最小生成树、最短路）<\/a><br>检查点：能写出红黑树五条性质与插入后的旋转/变色修复序列，说明 B 树节点大小为什么按磁盘页取，走完 BFS/DFS 与 Dijkstra 的松弛顺序，用已松弛结点集合的不变式说明 Dijkstra 的正确性<\/li><li class='path-step' id='path-04'><strong>步骤 04：算法设计策略与复杂性：动态规划、贪心、摊还分析、NP 完全性与近似算法<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：算法设计策略与复杂性（动态规划、贪心、摊还分析、NP 完全性、近似算法）<\/a><br>检查点：能为一个具体 DP 问题列出状态定义、最优子结构与转移方程，用交换论证判断贪心何时成立并给出失效反例，用聚合/记账/势能三种方法分析动态表，说清多项式时间归约与 NP 完全性的含义<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='渐近记号（θ / o / ω）'>渐近记号（Θ / O / Ω） — 描述函数在输入规模趋于无穷时增长阶的记号：Θ 夹在上下界之间，O 只给上界，Ω 只给下界；定义都要求存在正常量 $c_1,c_2,c_0$ 使不等式对所有 $n\\ge n_0$ 成立 <span class=glossary-ref>（第 1 章：算法基础与复杂度分析（插入排序/归并排序、渐近记号、递归式、主定理））<\/span><\/li><li data-term='循环不变式'>循环不变式 — 在算法每轮迭代开始时都成立的性质；用初始化、保持、终止三步证明算法正确性：初始时成立，每轮保持成立，终止时给出所需结论 <span class=glossary-ref>（第 1 章：算法基础与复杂度分析（插入排序/归并排序、渐近记号、递归式、主定理））<\/span><\/li><li data-term='递归式'>递归式 — 用函数自身在更小输入上的取值来定义函数的等式，如 $T(n)=aT(n/b)+f(n)$；求解途径有代入法、递归树法与主方法 <span class=glossary-ref>（第 1 章：算法基础与复杂度分析（插入排序/归并排序、渐近记号、递归式、主定理））<\/span><\/li><li data-term='主定理（主方法）'>主定理（主方法） — 针对 $T(n)=aT(n/b)+f(n)$ 形式递归式判阶的定理：比较 $f(n)$ 与 $n^{\\log_b a}$ 的阶，落在多项式间隙、同阶或上界间隙三种情形分别得到不同渐近阶 <span class=glossary-ref>（第 1 章：算法基础与复杂度分析（插入排序/归并排序、渐近记号、递归式、主定理））<\/span><\/li><li data-term='堆（二叉堆）'>堆（二叉堆） — 数组表示的完全二叉树，分最大堆与最小堆；最大堆满足每个结点不大于其父结点，堆顶为最大元素；支撑建堆、堆排序与优先队列 <span class=glossary-ref>（第 2 章：排序与顺序统计（堆排序、快速排序、线性时间排序、中位数与顺序统计））<\/span><\/li><li data-term='决策树'>决策树 — 把比较排序算法的比较过程画成二叉树：内部结点是一次比较，叶结点是一种排列；输入不同时走根到叶的路径，最坏比较次数等于树的高度 <span class=glossary-ref>（第 2 章：排序与顺序统计（堆排序、快速排序、线性时间排序、中位数与顺序统计））<\/span><\/li><li data-term='指示变量'>指示变量 — 取值为 0 或 1 的随机变量，事件发生时取 1；期望值等于事件概率，便于把“是否比较”这类计数拆成对每对元素分别取期望再求和 <span class=glossary-ref>（第 2 章：排序与顺序统计（堆排序、快速排序、线性时间排序、中位数与顺序统计））<\/span><\/li><li data-term='散列表（哈希表）'>散列表（哈希表） — 用散列函数把键映射到桶数组下标以支持平均 $O(1)$ 查找的结构；冲突用链接法或开放寻址法解决，负载因子决定平均查找代价 <span class=glossary-ref>（第 3 章：数据结构与图算法（哈希表、红黑树、B 树、图的表示、BFS/DFS、最小生成树、最短路））<\/span><\/li><li data-term='红黑树'>红黑树 — 满足五条着色性质的平衡二叉搜索树：结点红/黑、根黑、叶（NIL）黑、红结点子结点皆黑、任一结点到后代叶路径黑结点数相同；保证高度 $O(\\lg n)$ <span class=glossary-ref>（第 3 章：数据结构与图算法（哈希表、红黑树、B 树、图的表示、BFS/DFS、最小生成树、最短路））<\/span><\/li><li data-term='b 树'>B 树 — 为磁盘存储设计的平衡多叉搜索树，每个节点存多个关键字与子树指针；度数约束节点关键字个数与高度，按页大小决定节点宽度，树高 $O(\\log_t n)$ <span class=glossary-ref>（第 3 章：数据结构与图算法（哈希表、红黑树、B 树、图的表示、BFS/DFS、最小生成树、最短路））<\/span><\/li><li data-term='松弛（relaxation）'>松弛（relaxation） — 最短路算法中对一条边 $(u,v)$ 检查是否经由 $u$ 到达 $v$ 更短，若是则更新 $v$ 的距离估计与前驱；反复松弛直到距离不再下降 <span class=glossary-ref>（第 3 章：数据结构与图算法（哈希表、红黑树、B 树、图的表示、BFS/DFS、最小生成树、最短路））<\/span><\/li><li data-term='最优子结构'>最优子结构 — 问题的最优解由其子问题的最优解组合而成；动态规划先证明局部最优能拼出全局最优，再按子问题规模递推填表 <span class=glossary-ref>（第 4 章：算法设计策略与复杂性（动态规划、贪心、摊还分析、NP 完全性、近似算法））<\/span><\/li><li data-term='摊还分析'>摊还分析 — 对一系列操作的总代价求平均的分析方法，区别于概率平均；含聚合分析、记账分析（存款预付）与势能分析（势能随操作涨落）三种 <span class=glossary-ref>（第 4 章：算法设计策略与复杂性（动态规划、贪心、摊还分析、NP 完全性、近似算法））<\/span><\/li><li data-term='多项式时间归约'>多项式时间归约 — 在多项式时间内把问题 $A$ 的输入变换成问题 $B$ 的输入的映射；若 $B$ 有多项式算法则 $A$ 也有，是判定 NP 完全性的工具 <span class=glossary-ref>（第 4 章：算法设计策略与复杂性（动态规划、贪心、摊还分析、NP 完全性、近似算法））<\/span><\/li><li data-term='np 完全问题'>NP 完全问题 — 属于 NP 且所有 NP 问题都可多项式归约到它的问题；若任一 NP 完全问题有多项式算法，则 P=NP；已知 NP 完全问题在实践中通常按指数或近似方法处理 <span class=glossary-ref>（第 4 章：算法设计策略与复杂性（动态规划、贪心、摊还分析、NP 完全性、近似算法））<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库<\/h1>\n<h2>模式 1：循环不变式三步证明算法正确性<\/h2>\n<p>排序或扫描类循环，先找每轮开始成立的性质：初始化（首轮前成立）、保持（本轮后延续）、终止（终止时给结论）。写代码前先把不变式说清；不变式覆盖不到的环节，正是循环边界错误的高发位置。插入排序、堆修复、树插入都可用这套步骤核验。<\/p>\n<h2>模式 2：分治拆三参数，递归式落主定理<\/h2>\n<p>分治算法先记子问题个数 <span class=\"katex-inline\">a<\/span>、规模缩小倍数 <span class=\"katex-inline\">b<\/span>、合并代价 <span class=\"katex-inline\">f(n)<\/span>，写成 <span class=\"katex-inline\">T(n)=aT(n/b)+f(n)<\/span>。与基准 <span class=\"katex-inline\">n^{\\log_b a}<\/span> 比较选主定理情形；落不进三情形（对数间隙、规模不一致、正则条件破裂），回到递归树逐层求和或代入法归纳。<\/p>\n<h2>模式 3：局部修复沿一条路径下降，代价按高度计<\/h2>\n<p>堆的 MAX-HEAPIFY、红黑树旋转修复、B 树分裂都从违例结点出发，只沿单条路径或局部分支收口；单次代价由子树高度决定。整体建堆再按结点高度分层计数，区分“单操作高度”与“整结构总成本”两个口径。<\/p>\n<h2>模式 4：计数问题拆成对指示变量，期望线性求和<\/h2>\n<p>分析随机算法比较次数，把全局计数拆成两两事件的指示变量；<span class=\"katex-inline\">E[X_{ij}]<\/span> 等于事件概率，期望线性性不要求独立。概率常归结为区间内首基准被选中的可能性，再按区间长度求和，调和级数给出对数因子。<\/p>\n<h2>模式 5：下界论证先抽象决策模型，再数叶子<\/h2>\n<p>证明某类算法的下界，先抽模型（决策树内部结点是一次比较），数模型必须容纳的结论数（<span class=\"katex-inline\">n!<\/span> 排列），由模型规模反解高度。下界只覆盖模型前提；换非比较、按键值结构的算法，模型前提破裂，下界不再约束。<\/p>\n<h2>模式 6：优化问题先验最优子结构，再写状态转移<\/h2>\n<p>DP 落地两步：反证子问题必须取最优，再定义状态、枚举决策写转移。填表顺序保证依赖状态已算好；要还原方案另记切点或前驱。子问题相互独立用分治，反复重叠才值得记忆化。<\/p>\n<h2>模式 7：难解问题先定位层级，再选求解路线<\/h2>\n<p>遇到组合问题先问：候选解能否多项式验证？已知 NPC 问题能否多项式归约过来？定位为 NPC 后，不硬求多项式精确解：小规模走指数搜索，要求质量走近似算法，容忍误差上启发式。近似路线必须带可证明近似比，否则只是经验规则。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 算法基础与复杂度分析<\/strong>：插入/归并排序、循环不变式、Θ/O/Ω、递归式与主定理（原书第 1–4 章，PDF 第 16–79 页）。\n<\/li><li>\n<strong>第 2 章 排序与顺序统计<\/strong>：堆排序、快速排序、线性时间排序、选择算法（原书第 6–9 章，PDF 第 99–143 页）。\n<\/li><li>\n<strong>第 3 章 数据结构与图算法<\/strong>：散列表、红黑树、B 树、BFS/DFS、最小生成树、最短路（原书第 11、13、18、22–24 章，PDF 第 157–413 页）。\n<\/li><li>\n<strong>第 4 章 设计策略与复杂性<\/strong>：动态规划、贪心、摊还分析、NP 完全性、近似算法（原书第 15–17、34–35 章，PDF 第 219–272、631–686 页）。\n<\/ul>\n<h2>渐近记号速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>记号<\/th><th>定义方向<\/th><th>含义<\/th><th>常见误用<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">O(g(n))<\/span><\/td><td><span class=\"katex-inline\">0\\le f\\le cg<\/span><\/td><td>渐近上界<\/td><td>当成“恰好 <span class=\"katex-inline\">g<\/span>”<\/td><\/tr><tr><td><span class=\"katex-inline\">\\Omega(g(n))<\/span><\/td><td><span class=\"katex-inline\">0\\le cg\\le f<\/span><\/td><td>渐近下界<\/td><td>与上界混用<\/td><\/tr><tr><td><span class=\"katex-inline\">\\Theta(g(n))<\/span><\/td><td><span class=\"katex-inline\">c_1g\\le f\\le c_2g<\/span><\/td><td>同阶紧界<\/td><td>只写 O 代替紧界<\/td><\/tr><\/tbody><\/table><\/div>\n<p>层级：<span class=\"katex-inline\">\\lg n \\ll n^{0.01}\\ll n^{0.99}\\ll n^2\\ll 2^n<\/span>；任何正幂次压过对数。<\/p>\n<h2>主定理三情形（<span class=\"katex-inline\">T(n)=aT(n/b)+f(n)<\/span>，基准 <span class=\"katex-inline\">n^{\\log_b a}<\/span>）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>情形<\/th><th><span class=\"katex-inline\">f(n)<\/span> 与基准关系<\/th><th>解<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><span class=\"katex-inline\">f=O(n^{\\log_b a-\\varepsilon})<\/span><\/td><td><span class=\"katex-inline\">\\Theta(n^{\\log_b a})<\/span><\/td><\/tr><tr><td>2<\/td><td><span class=\"katex-inline\">f=\\Theta(n^{\\log_b a})<\/span><\/td><td><span class=\"katex-inline\">\\Theta(n^{\\log_b a}\\lg n)<\/span><\/td><\/tr><tr><td>3<\/td><td><span class=\"katex-inline\">f=\\Omega(n^{\\log_b a+\\varepsilon})<\/span> 且 <span class=\"katex-inline\">af(n/b)\\le cf(n)<\/span><\/td><td><span class=\"katex-inline\">\\Theta(f(n))<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>排序算法对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>算法<\/th><th>最好<\/th><th>平均/期望<\/th><th>最坏<\/th><th>额外空间<\/th><th>关键点<\/th><\/tr><\/thead><tbody><tr><td>插入排序<\/td><td><span class=\"katex-inline\">O(n)<\/span><\/td><td><span class=\"katex-inline\">O(n^2)<\/span><\/td><td><span class=\"katex-inline\">O(n^2)<\/span><\/td><td><span class=\"katex-inline\">O(1)<\/span><\/td><td>循环不变式<\/td><\/tr><tr><td>归并排序<\/td><td><span class=\"katex-inline\">O(n\\lg n)<\/span><\/td><td><span class=\"katex-inline\">O(n\\lg n)<\/span><\/td><td><span class=\"katex-inline\">O(n\\lg n)<\/span><\/td><td><span class=\"katex-inline\">O(n)<\/span><\/td><td>分治合并线性
