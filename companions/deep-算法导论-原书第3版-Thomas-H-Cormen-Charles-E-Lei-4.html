<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}

erIds": ["ch04"], "difficulty": "进阶", "source": {"file": "library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 219}, "prerequisites": ["c02"], "depthFragment": "concepts/c10-depth.md"}, {"id": "c11", "title": "贪心的交换论证与失效反例", "file": "concepts/c11.md", "chapterIds": ["ch04"], "difficulty": "进阶", "source": {"file": "library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 252}, "prerequisites": ["c10"], "depthFragment": "concepts/c11-depth.md"}, {"id": "c12", "title": "摊还分析三种方法：聚合、记账、势能与动态表", "file": "concepts/c12.md", "chapterIds": ["ch04"], "difficulty": "进阶", "source": {"file": "library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 273}, "prerequisites": ["c01"], "depthFragment": "concepts/c12-depth.md"}, {"id": "c13", "title": "NP 完全性的归约与“承认困难”的意义", "file": "concepts/c13.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 631}, "prerequisites": ["c11"], "depthFragment": "concepts/c13-depth.md"}], "glossary": [{"term": "渐近记号（Θ / O / Ω）", "def": "描述函数在输入规模趋于无穷时增长阶的记号：Θ 夹在上下界之间，O 只给上界，Ω 只给下界；定义都要求存在正常量 $c_1,c_2,c_0$ 使不等式对所有 $n\\ge n_0$ 成立", "chapterId": "ch01"}, {"term": "循环不变式", "def": "在算法每轮迭代开始时都成立的性质；用初始化、保持、终止三步证明算法正确性：初始时成立，每轮保持成立，终止时给出所需结论", "chapterId": "ch01"}, {"term": "递归式", "def": "用函数自身在更小输入上的取值来定义函数的等式，如 $T(n)=aT(n/b)+f(n)$；求解途径有代入法、递归树法与主方法", "chapterId": "ch01"}, {"term": "主定理（主方法）", "def": "针对 $T(n)=aT(n/b)+f(n)$ 形式递归式判阶的定理：比较 $f(n)$ 与 $n^{\\log_b a}$ 的阶，落在多项式间隙、同阶或上界间隙三种情形分别得到不同渐近阶", "chapterId": "ch01"}, {"term": "堆（二叉堆）", "def": "数组表示的完全二叉树，分最大堆与最小堆；最大堆满足每个结点不大于其父结点，堆顶为最大元素；支撑建堆、堆排序与优先队列", "chapterId": "ch02"}, {"term": "决策树", "def": "把比较排序算法的比较过程画成二叉树：内部结点是一次比较，叶结点是一种排列；输入不同时走根到叶的路径，最坏比较次数等于树的高度", "chapterId": "ch02"}, {"term": "指示变量", "def": "取值为 0 或 1 的随机变量，事件发生时取 1；期望值等于事件概率，便于把“是否比较”这类计数拆成对每对元素分别取期望再求和", "chapterId": "ch02"}, {"term": "散列表（哈希表）", "def": "用散列函数把键映射到桶数组下标以支持平均 $O(1)$ 查找的结构；冲突用链接法或开放寻址法解决，负载因子决定平均查找代价", "chapterId": "ch03"}, {"term": "红黑树", "def": "满足五条着色性质的平衡二叉搜索树：结点红/黑、根黑、叶（NIL）黑、红结点子结点皆黑、任一结点到后代叶路径黑结点数相同；保证高度 $O(\\lg n)$", "chapterId": "ch03"}, {"term": "B 树", "def": "为磁盘存储设计的平衡多叉搜索树，每个节点存多个关键字与子树指针；度数约束节点关键字个数与高度，按页大小决定节点宽度，树高 $O(\\log_t n)$", "chapterId": "ch03"}, {"term": "松弛（relaxation）", "def": "最短路算法中对一条边 $(u,v)$ 检查是否经由 $u$ 到达 $v$ 更短，若是则更新 $v$ 的距离估计与前驱；反复松弛直到距离不再下降", "chapterId": "ch03"}, {"term": "最优子结构", "def": "问题的最优解由其子问题的最优解组合而成；动态规划先证明局部最优能拼出全局最优，再按子问题规模递推填表", "chapterId": "ch04"}, {"term": "摊还分析", "def": "对一系列操作的总代价求平均的分析方法，区别于概率平均；含聚合分析、记账分析（存款预付）与势能分析（势能随操作涨落）三种", "chapterId": "ch04"}, {"term": "多项式时间归约", "def": "在多项式时间内把问题 $A$ 的输入变换成问题 $B$ 的输入的映射；若 $B$ 有多项式算法则 $A$ 也有，是判定 NP 完全性的工具", "chapterId": "ch04"}, {"term": "NP 完全问题", "def": "属于 NP 且所有 NP 问题都可多项式归约到它的问题；若任一 NP 完全问题有多项式算法，则 P=NP；已知 NP 完全问题在实践中通常按指数或近似方法处理", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [], "flashcards": []}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.16<\/div><h1>第 1 章：算法基础与复杂度分析<\/h1>\n<blockquote>对应原书第 1–4 章（PDF 第 16–79 页；印刷页 = PDF 页 − 15）。第 1 章算法在计算中的作用、第 2 章算法基础（插入排序、归并排序）、第 3 章函数的增长（渐近记号）、第 4 章分治策略（递归式与主定理）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用循环不变式的初始化、保持、终止三步说清插入排序为什么把前缀排好；\n<\/li><li>\n区分 Θ、O、Ω 三个渐近记号的定义边界，指出把 <span class=\"katex-inline\">O(n\\lg n)<\/span> 说成“恰好 <span class=\"katex-inline\">n\\lg n<\/span>”错在哪；\n<\/li><li>\n把一个分治算法的代价写成递归式 <span class=\"katex-inline\">T(n)=aT(n/b)+f(n)<\/span>，用主定理三种情形判阶；\n<\/li><li>\n对 <span class=\"katex-inline\">\\lg n<\/span> 与 <span class=\"katex-inline\">n^{0.99}<\/span>、<span class=\"katex-inline\">n^{0.01}<\/span> 这类函数具体比较增长阶；\n<\/li><li>\n说清递归式在什么条件下主定理套不上，需要换代入法或递归树。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>算法分析先关心输入规模趋于无穷时代价的增长阶，而不是某次运行的秒数；循环不变式把“算法为什么对”拆成三步验证，分治算法把代价写成递归式，再用主定理比较分治部分 <span class=\"katex-inline\">aT(n/b)<\/span> 与合并部分 <span class=\"katex-inline\">f(n)<\/span> 的阶，得到整段算法的渐近复杂度。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 从插入排序看算法与正确性证明<\/h3>\n<p>原书第 2 章从插入排序入手（PDF 第 24 页起）：数组前 <span class=\"katex-inline\">j-1<\/span> 个元素已排好，把第 <span class=\"katex-inline\">j<\/span> 个元素向前插入到正确位置。插入排序最坏与平均代价 <span class=\"katex-inline\">O(n^2)<\/span>，对小规模输入够用，交换次数就是逆序对个数。它的价值不在效率，而在示范“用不变式证明一段循环正确”的标准动作。<\/p>\n<h3>2. 归并排序：分治范式的第一个样本<\/h3>\n<p>归并排序把数组对半拆开，递归排好两半，再在线性时间内合并（原书 2.3 节，PDF 第 31 页起）。它的代价落在递归式 <span class=\"katex-inline\">T(n)=2T(n/2)+O(n)<\/span> 上，解为 <span class=\"katex-inline\">O(n\\lg n)<\/span>。这是后面所有分治分析的模板：先拆出子问题个数 <span class=\"katex-inline\">a<\/span>、子问题规模 <span class=\"katex-inline\">n/b<\/span>，再写合并代价 <span class=\"katex-inline\">f(n)<\/span>。<\/p>\n<h3>3. 概念 1：渐近记号 Θ / O / Ω（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。第 3 章（PDF 第 40 页起）给出三个记号的严格定义：O 是上界，Ω 是下界，Θ 是上下界夹逼。三者都只对足够大的 <span class=\"katex-inline\">n<\/span> 生效，小输入的常数与低频项不在记号管辖范围内。<\/p>\n<h3>4. 概念 2：分治递归式与主定理（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。第 4 章（PDF 第 53 页起）给出主定理：对 <span class=\"katex-inline\">T(n)=aT(n/b)+f(n)<\/span>，比较 <span class=\"katex-inline\">f(n)<\/span> 与 <span class=\"katex-inline\">n^{\\log_b a}<\/span> 的阶，分三种情形得到结果；落在多项式间隙之外、或不满足正则条件时，主方法不直接适用。<\/p>\n<h2>推导一（证明）：插入排序的循环不变式<\/h2>\n<p>待证命题：插入排序结束后整个数组按非降序排列。<\/p>\n<p>算法骨架（伪代码）：<\/p>\n<pre><code>INSERTION-SORT(A)\n  for j = 2 to A.length\n      key = A[j]\n      i = j - 1\n      while i &gt; 0 and A[i] &gt; key\n          A[i+1] = A[i]\n          i = i - 1\n      A[i+1] = key<\/code><\/pre>\n<p>循环不变式取为：<strong>在第 <span class=\"katex-inline\">j<\/span> 轮循环开始前，子数组 <span class=\"katex-inline\">A[1..j-1]<\/span> 由原数组前 <span class=\"katex-inline\">j-1<\/span> 个元素按非降序排列。<\/strong><\/p>\n<p>第一步，初始化。<span class=\"katex-inline\">j=2<\/span> 时子数组 <span class=\"katex-inline\">A[1..1]<\/span> 只有一个元素，单个元素的数组必然有序，不变式成立。<\/p>\n<p>第二步，保持。设第 <span class=\"katex-inline\">j<\/span> 轮开始时 <span class=\"katex-inline\">A[1..j-1]<\/span> 有序。内层 <code>while<\/code> 把所有大于 <code>key<\/code> 的元素 <span class=\"katex-inline\">A[i]<\/span> 逐个右移到 <span class=\"katex-inline\">A[i+1]<\/span>，直到遇到第一个不大于 <code>key<\/code> 的位置 <span class=\"katex-inline\">i<\/span>；此时 <span class=\"katex-inline\">A[1..i]<\/span> 不大于 <code>key<\/code>，右移出去的 <span class=\"katex-inline\">A[i+1..j-1]<\/span> 不小于 <code>key<\/code>。把 <code>key<\/code> 放到 <span class=\"katex-inline\">A[i+1]<\/span> 后，<span class=\"katex-inline\">A[1..j]<\/span> 保持非降序，且元素仍是原来那 <span class=\"katex-inline\">j<\/span> 个。下一轮 <span class=\"katex-inline\">j<\/span> 加 1，不变式延续。<\/p>\n<p>第三步，终止。外层循环走完 <span class=\"katex-inline\">j=2<\/span> 到 <span class=\"katex-inline\">n<\/span>，终止时不变式给出 <span class=\"katex-inline\">A[1..n]<\/span> 有序，元素集合仍是原数组全部元素。正确性结论成立。<\/p>\n<p>代价侧记：最坏情况下每轮内层 <code>while<\/code> 走到 <span class=\"katex-inline\">i=1<\/span>，第 <span class=\"katex-inline\">j<\/span> 轮移动 <span class=\"katex-inline\">j-1<\/span> 次，总代价 <span class=\"katex-inline\">\\sum_{j=2}^{n}(j-1)=n(n-1)/2=O(n^2)<\/span>。<\/p>\n<h2>推导二（推演）：归并排序递归式 <span class=\"katex-inline\">T(n)=2T(n/2)+O(n)<\/span> 的求解<\/h2>\n<p>分治结构：把 <span class=\"katex-inline\">n<\/span> 个元素的数组分成两个规模 <span class=\"katex-inline\">n/2<\/span> 的子数组，各递归排序一次；合并两个有序段用双指针扫描，每个元素被比较与挪动一次，合并代价 <span class=\"katex-inline\">O(n)<\/span>。递归式写成<\/p>\n<div class=\"katex-block\">T(n)=2T(n/2)+O(n),\\qquad T(1)=O(1).<\/div>\n<p>用递归树展开：第 0 层一个节点，代价 <span class=\"katex-inline\">O(n)<\/span>；第 1 层两个节点，每个规模 <span class=\"katex-inline\">n/2<\/span>，合并代价合计 <span class=\"katex-inline\">O(n)<\/span>；第 <span class=\"katex-inline\">k<\/span> 层 <span class=\"katex-inline\">2^k<\/span> 个节点，每个规模 <span class=\"katex-inline\">n/2^k<\/span>，该层合并代价仍是 <span class=\"katex-inline\">2^k\\cdot O(n/2^k)=O(n)<\/span>。树高满足 <span class=\"katex-inline\">n/2^h=1<\/span>，即 <span class=\"katex-inline\">h=\\lg n<\/span>。各层代价相加：<span class=\"katex-inline\">O(n)\\cdot(\\lg n+1)=O(n\\lg n)<\/span>。<\/p>\n<p>套主定理核对：<span class=\"katex-inline\">a=2<\/span>，<span class=\"katex-inline\">b=2<\/span>，<span class=\"katex-inline\">n^{\\log_b a}=n^{\\log_2 2}=n<\/span>；<span class=\"katex-inline\">f(n)=O(n)<\/span> 与 <span class=\"katex-inline\">n^{\\log_b a}<\/span> 同阶，落主定理情形 2，解为 <span class=\"katex-inline\">\\Theta(n\\lg n)<\/span>。两种途径结果一致。<\/p>\n<h2>反事实：去掉哪一步会把结论弄错<\/h2>\n<ul><li>\n<strong>丢掉循环不变式的“保持”环节<\/strong>：只看初始化和终止，会以为“单元素有序 → 整体有序”中间可以直接跳；实际不证明每轮右移后前缀仍有序，就无法排除某轮把 <code>key<\/code> 插到了逆序位置。凭直觉写排序程序，最常见的错误正是内层循环少走一个元素，前缀在中途重新失序。\n<\/li><li>\n<strong>主定理情形 2 误写成情形 1<\/strong>：若把 <span class=\"katex-inline\">f(n)=O(n)<\/span> 当成比 <span class=\"katex-inline\">n^{\\log_b a}<\/span> 低一个多项式阶，会得到 <span class=\"katex-inline\">T(n)=\\Theta(n^{\\log_b a})=\\Theta(n)<\/span> 的错误结论；分治合并代价被低估，树高层数被忽略。\n<\/li><li>\n<strong>递归式只写合并代价、漏掉子问题个数<\/strong>：把 <span class=\"katex-inline\">T(n)=2T(n/2)+O(n)<\/span> 记成 <span class=\"katex-inline\">T(n)=T(n/2)+O(n)<\/span>，解会退成 <span class=\"katex-inline\">O(n)<\/span>；子问题个数 <span class=\"katex-inline\">a<\/span> 直接影响 <span class=\"katex-inline\">n^{\\log_b a}<\/span>，不能省。\n<\/li><li>\n<strong>用小输入的表现推断渐近阶<\/strong>：归并排序在 <span class=\"katex-inline\">n=10<\/span> 时常数开销比插入排序大，若只测小规模样本，会误判两者优劣；渐近记号描述的是 <span class=\"katex-inline\">n<\/span> 趋于无穷后的阶，常数项由实现与硬件决定。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章给的是分析语言：不变式用于后续数据结构的正确性证明（堆、红黑树、B 树），递归式与主定理是排序算法、分治算法、图算法复杂度推导的底座。第 2 章进入具体排序，堆排序与快速排序的代价都要在这套记号和递归框架下展开；第 3 章的数据结构操作高度仍按 <span class=\"katex-inline\">O(\\lg n)<\/span> 度量，用的也是本章的阶语言。<\/p>", "kind": "chapter", "title": "第 1 章：算法基础与复杂度分析（插入排序/归并排序、渐近记号、递归式、主定理）"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.99<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：算法基础与复杂度分析（插入排序/归并排序、渐近记号、递归式、主定理）<\/a><\/span><\/div><h1>第 2 章：排序与顺序统计<\/h1>\n<blockquote>对应原书第 6–9 章（PDF 第 99–143 页；印刷页 = PDF 页 − 15）。第 6 章堆排序、第 7 章快速排序、第 8 章线性时间排序、第 9 章中位数和顺序统计量。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 1 章（渐近记号与递归式）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出最大堆的父子下标关系，说明 MAX-HEAPIFY 修复哪一处违例、建堆为什么是 <span class=\"katex-inline\">O(n)<\/span>；\n<\/li><li>\n用指示变量法推出快速排序期望比较次数为 <span class=\"katex-inline\">O(n\\lg n)<\/span>，说出最坏划分长什么样；\n<\/li><li>\n用决策树模型论证比较排序的下界 <span class=\"katex-inline\">\\Omega(n\\lg n)<\/span>，指明该下界的适用前提；\n<\/li><li>\n解释计数排序与基数排序靠什么信息绕过比较下界，代价是辅助空间与对键的假设；\n<\/li><li>\n区分期望线性时间选择算法与最坏线性时间选择算法的思路差别。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>基于比较的排序被决策树高度卡在 <span class=\"katex-inline\">\\Omega(n\\lg n)<\/span>；堆排序用堆结构把提取最大值与修复堆性质排成 <span class=\"katex-inline\">O(\\lg n)<\/span> 一趟，快速排序靠随机划分把期望比较次数压到 <span class=\"katex-inline\">O(n\\lg n)<\/span>；计数与基数排序不再比较两个键的大小，转而利用键的取值范围，换取线性时间但付出辅助空间和键类型限制。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 3：堆与建堆的线性时间证明（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。堆是数组表示的完全二叉树（原书 6.1 节，PDF 第 99 页起）；MAX-HEAPIFY 沿违例结点向下交换修复，建堆从最后一个内部结点向前逐堆调整。建堆不是 <span class=\"katex-inline\">O(n\\lg n)<\/span>：按结点高度求和，底层结点占多数，每层修复代价被摊薄，总上界是 <span class=\"katex-inline\">O(n)<\/span>。<\/p>\n<h3>2. 概念 4：快速排序期望 <span class=\"katex-inline\">O(n\\lg n)<\/span>（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。快速排序选基准把数组划分为小于、等于、大于基准三段（原书第 7 章，PDF 第 110 页起）。最坏划分每次都把数组切成 1 与 <span class=\"katex-inline\">n-1<\/span>，代价退到 <span class=\"katex-inline\">\\Theta(n^2)<\/span>；随机选基准后，一对元素被比较的概率可由指示变量写出，求和得到期望 <span class=\"katex-inline\">O(n\\lg n)<\/span>。<\/p>\n<h3>3. 概念 5：比较排序下界 <span class=\"katex-inline\">\\Omega(n\\lg n)<\/span>（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。第 8 章 8.1 节（PDF 第 122 页起）把比较排序抽象成二叉决策树：<span class=\"katex-inline\">n!<\/span> 种排列对应 <span class=\"katex-inline\">n!<\/span> 片叶，树高至少 <span class=\"katex-inline\">\\lceil\\lg(n!)\\rceil=\\Omega(n\\lg n)<\/span>，任何基于两两比较的排序最坏比较次数都不低于这个量级。<\/p>\n<h3>4. 概念 6：计数/基数排序（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。计数排序统计每个键出现次数，累加得到每个键应处位置，不再比较两键；基数排序按低位到高位逐位稳定排序。两者突破下界的前提是键可分解成有限位、每位取值范围受限，辅助空间随键域增长。<\/p>\n<h3>5. 中位数与顺序统计<\/h3>\n<p>第 9 章（PDF 第 134 页起）讨论从 <span class=\"katex-inline\">n<\/span> 个数中选第 <span class=\"katex-inline\">i<\/span> 小的元素。最大值与最小值同时找，两两配对比较，至多 <span class=\"katex-inline\">3\\lfloor n/2\\rfloor<\/span> 次比较；期望线性时间选择用随机划分递归落到一侧子数组；最坏线性时间选择把元素分组、取各组中位数再递归求中位数中位数作为基准，保证划分两侧都不会过小。<\/p>\n<h2>推导一（推演）：堆排序一趟提取最大值的过程<\/h2>\n<p>最大堆堆顶是全局最大元素。堆排序循环：<\/p>\n<pre><code>HEAPSORT(A)\n  BUILD-MAX-HEAP(A)\n  for i = A.length down to 2\n      swap A[1] with A[i]\n      A.heap-size = A.heap-size - 1\n      MAX-HEAPIFY(A, 1)<\/code><\/pre>\n<p>每轮把堆顶与当前堆末元素交换，最大值落到已排序段开头；交换后堆顶可能违反“父不小于子”，MAX-HEAPIFY 沿父子较大者向下交换，把违例压到叶结点。<span class=\"katex-inline\">n-1<\/span> 轮提取，每轮修复高度至多 <span class=\"katex-inline\">O(\\lg n)<\/span>，排序主体 <span class=\"katex-inline\">O(n\\lg n)<\/span>；建堆本身 <span class=\"katex-inline\">O(n)<\/span>，整体 <span class=\"katex-inline\">O(n\\lg n)<\/span>。<\/p>\n<p>堆排序的边界：它是原地算法，最坏情况也是 <span class=\"katex-inline\">O(n\\lg n)<\/span>；代价是数据局部性不如快速排序，常数因子偏大。<\/p>\n<h2>推导二（证明）：决策树为什么给出 <span class=\"katex-inline\">\\Omega(n\\lg n)<\/span> 下界<\/h2>\n<p>把任一比较排序算法在某组输入上的执行过程画成二叉树：内部结点写“比较 <span class=\"katex-inline\">A[i]<\/span> 与 <span class=\"katex-inline\">A[j]<\/span>”，左支走小于等于，右支走大于；叶结点写一种最终排列。输入不同，算法从根走到不同叶；<span class=\"katex-inline\">n<\/span> 个元素共有 <span class=\"katex-inline\">n!<\/span> 种排列，决策树至少要有 <span class=\"katex-inline\">n!<\/span> 片叶才能把每种排列区分开。<\/p>\n<p>高为 <span class=\"katex-inline\">h<\/span> 的二叉树最多 <span class=\"katex-inline\">2^h<\/span> 片叶，因此 <span class=\"katex-inline\">2^h\\ge n!<\/span>，取对数得 <span class=\"katex-inline\">h\\ge \\lg(n!)<\/span>。用 Stirling 估计或逐项放大：<span class=\"katex-inline\">\\lg(n!)=\\sum_{k=1}^{n}\\lg k\\ge \\sum_{k=\\lceil n/2\\rceil}^{n}\\lg k\\ge (n/2)\\lg(n/2)=\\Omega(n\\lg n)<\/span>。算法在最坏输入上走到最深叶，比较次数等于树高，故最坏比较次数 <span class=\"katex-inline\">\\Omega(n\\lg n)<\/span>。<\/p>\n<p>这条证明只约束“靠两两比较决定顺序”的算法；排序过程中若直接利用键的数值范围或位结构（计数、基数、桶排序），决策树模型不再覆盖该算法。<\/p>\n<h2>反事实：条件改掉之后结论怎么变<\/h2>\n<ul><li>\n<strong>建堆按每层 <span class=\"katex-inline\">O(n)<\/span>、共 <span class=\"katex-inline\">O(\\lg n)<\/span> 层估算<\/strong>：会得到 <span class=\"katex-inline\">O(n\\lg n)<\/span> 的高估；实际底层结点数量占多数，每层能做修复的结点随高度指数减少，求和后是 <span class=\"katex-inline\">O(n)<\/span>。把高度分布当成均匀分布，就会漏掉这个线性结果。\n<\/li><li>\n<strong>快速排序基准固定取首元素，且输入已有序<\/strong>：每次划分是 1 与 <span class=\"katex-inline\">n-1<\/span>，递归式 <span class=\"katex-inline\">T(n)=T(n-1)+\\Theta(n)<\/span>，解 <span class=\"katex-inline\">\\Theta(n^2)<\/span>；随机化基准把最坏输入的针对性消掉，期望才回到 <span class=\"katex-inline\">O(n\\lg n)<\/span>。\n<\/li><li>\n<strong>以为 <span class=\"katex-inline\">\\Omega(n\\lg n)<\/span> 约束所有排序<\/strong>：下界证明内部结点必须是一次比较；基数排序按位分配、计数排序按值落桶，都没有两键比较环节，下界对它们不成立。反过来，若键是大整数且位数很多，基数排序的“位”代价要按位数重新计，不能直接称线性。\n<\/li><li>\n<strong>选择算法套用排序再取下标<\/strong>：先排序 <span class=\"katex-inline\">O(n\\lg n)<\/span> 再取第 <span class=\"katex-inline\">i<\/span> 个，丢掉了选择问题不需要全部有序这一结构；期望线性选择只递归一侧，代价才压到 <span class=\"katex-inline\">O(n)<\/span>。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章的排序与选择是第 3 章数据结构操作复杂度的参照系：优先队列用堆实现，平衡树的查找/插入高度也按 <span class=\"katex-inline\">O(\\lg n)<\/span> 度量。快速排序的划分思想在图算法与随机化分析里重复出现；决策树下界则是第 4 章判断“问题本身有多难”的早期样本——后面 NP 完全性讨论的是问题层面对多项式算法的障碍，层次比排序下界更深。<\/p>", "kind": "chapter", "title": "第 2 章：排序与顺序统计（堆排序、快速排序、线性时间排序、中位数与顺序统计）"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.157<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：排序与顺序统计（堆排序、快速排序、线性时间排序、中位数与顺序统计）<\/a><\/span><\/div><h1>第 3 章：数据结构与图算法<\/h1>\n<blockquote>对应原书第 11、13、18、22、23、24 章（PDF 第 157–413 页；印刷页 = PDF 页 − 15）。第 11 章散列表、第 13 章红黑树、第 18 章 B 树、第 22 章图的基本表示与 BFS/DFS、第 23 章最小生成树、第 24 章单源最短路径。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 2 章（排序、堆与渐近分析）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明散列表平均 <span class=\"katex-inline\">O(1)<\/span> 查找靠什么成立，冲突用链接法与开放寻址法分别怎么处理；\n<\/li><li>\n写出红黑树五条性质，走完一次插入后的变色与旋转修复序列；\n<\/li><li>\n解释 B 树节点宽度为什么按磁盘页取，分裂与合并怎样维持度数约束；\n<\/li><li>\n区分 BFS 与 DFS 的遍历顺序、各自解决什么问题；\n<\/li><li>\n走完 Dijkstra 的松弛顺序，用已确定最短距离结点集合的不变式说明算法为什么正确，并指出负权边为什么破坏前提。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>内存中的平衡搜索树用着色与旋转把高度压到 <span class=\"katex-inline\">O(\\lg n)<\/span>，外存上的 B 树用宽节点换低树高以减少磁盘 I/O；图算法把问题写成边的松弛或边的取舍：BFS 按层扩展求无权最短路，DFS 深入到底回溯，最小生成树靠安全边判定逐步扩边，Dijkstra 在非负权前提下按距离从小到大确定最短路。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 散列表：平均常数时间查找<\/h3>\n<p>第 11 章（PDF 第 157 页起）用散列函数把键映射到桶数组下标。直接寻址表要求键域不大；散列表把大键域压到小表长，冲突不可避免：链接法把同桶元素挂成链表，开放寻址法按探测序列找空位。负载因子 <span class=\"katex-inline\">\\alpha<\/span> 决定平均探测次数，均匀散列假设下成功查找期望 <span class=\"katex-inline\">O(1+\\alpha)<\/span>。<\/p>\n<h3>2. 概念 7：红黑树性质与旋转（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。第 13 章（PDF 第 189 页起）规定五条着色性质；左旋、右旋在局部改父子指针，保持中序序列不变。插入新结点先染红，再按叔父结点颜色分情形变色或旋转，直到红黑性质恢复。<\/p>\n<h3>3. 概念 8：B 树分裂/合并与磁盘 I/O（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。第 18 章（PDF 第 292 页起）面向磁盘块存储：节点关键字个数在度数 <span class=\"katex-inline\">t<\/span> 约束内，满节点分裂出兄弟，缺关键字节点向兄弟借或合并。树高 <span class=\"katex-inline\">O(\\log_t n)<\/span>，节点宽度对齐页大小，使一次磁盘读入覆盖尽可能多的分支选择。<\/p>\n<h3>4. 概念 9：图遍历与最短路松弛（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。第 22 章（PDF 第 356 页起）用邻接表或邻接矩阵表示图；BFS 队列按层扩展，DFS 栈式深入。第 24 章 Dijkstra（PDF 第 389 页起）反复选距离估计最小的未确定结点，松弛其出边；正确性依赖边权非负。<\/p>\n<h3>5. 最小生成树<\/h3>\n<p>第 23 章（PDF 第 376 页起）的 Kruskal 按边权从小到大选边，用不相交集合判断是否成环；Prim 从任一结点出发，每次跨过割取最小轻边。两者都建立在“安全边”判定上：跨过一个割、且是该割最轻边时，加入它不会破坏某棵最小生成树。<\/p>\n<h2>推导一（推演）：红黑树插入后的修复序列<\/h2>\n<p>插入流程分两段。先按二叉搜索树方式找到叶位置插入，新结点染红，置左右子结点为 NIL。然后检查违例：若父结点是红色，违反“红结点子结点皆黑”，进入修复循环。下面推演三种修复情形各自改动的指针与颜色标记，再核对局部性质是否恢复。<\/p>\n<p>修复按叔父结点颜色分情形：<\/p>\n<ul><li>\n<strong>情形一：叔父结点为红<\/strong>。父与叔父都染红的父辈改黑，祖父染红，违例上移到祖父；继续向上检查。\n<\/li><li>\n<strong>情形二：叔父结点为黑，当前结点与父结点方向不一致<\/strong>（父是祖父左子而当前是右子，或对称）。先在父结点上做一次旋转，把方向对齐，转入情形三。\n<\/li><li>\n<strong>情形三：叔父结点为黑，方向一致<\/strong>。在祖父结点上旋转，父结点改黑、祖父改红，红黑性质在局部恢复，循环终止。\n<\/ul>\n<p>旋转只改三条父子指针与相应颜色标记，中序遍历序列保持不变；修复沿树高向上走，旋转次数至多两次。根结点最终强制为黑。<\/p>\n<h2>推导二（证明）：Dijkstra 为什么在非负权下求出最短路<\/h2>\n<p>记号：<span class=\"katex-inline\">d[v]<\/span> 是当前从源点到 <span class=\"katex-inline\">v<\/span> 的距离估计，<span class=\"katex-inline\">S<\/span> 是已确定最短距离的结点集合。算法每轮从 <span class=\"katex-inline\">V-S<\/span> 中选 <span class=\"katex-inline\">d<\/span> 最小的结点 <span class=\"katex-inline\">u<\/span> 加入 <span class=\"katex-inline\">S<\/span>，再松弛 <span class=\"katex-inline\">u<\/span> 的每条出边 <span class=\"katex-inline\">(u,v)<\/span>：若 <span class=\"katex-inline\">d[u]+w(u,v)&amp;lt;d[v]<\/span>，则更新 <span class=\"katex-inline\">d[v]<\/span>。<\/p>\n<p>待证：结点加入 <span class=\"katex-inline\">S<\/span> 时 <span class=\"katex-inline\">d[u]<\/span> 已是源点到 <span class=\"katex-inline\">u<\/span> 的真实最短路长度。用反证。设 <span class=\"katex-inline\">u<\/span> 是第一个加入 <span class=\"katex-inline\">S<\/span> 时 <span class=\"katex-inline\">d[u]<\/span> 仍大于真实最短路 <span class=\"katex-inline\">\\delta(u)<\/span> 的结点。源点加入 <span class=\"katex-inline\">S<\/span> 时 <span class=\"katex-inline\">d[s]=0=\\delta(s)<\/span>，归纳上 <span class=\"katex-inline\">S<\/span> 内结点距离都已确定。<\/p>\n<p>考虑一条真实最短路 <span class=\"katex-inline\">s\\leadsto u<\/span>，设路径上第一个不在 <span class=\"katex-inline\">S<\/span> 内的结点为 <span class=\"katex-inline\">y<\/span>，其前驱 <span class=\"katex-inline\">x\\in S<\/span>。路径前缀 <span class=\"katex-inline\">s\\leadsto x<\/span> 已是最短路，松弛 <span class=\"katex-inline\">(x,y)<\/span> 后 <span class=\"katex-inline\">d[y]\\le d[x]+w(x,y)=\\delta(y)<\/span>。所有边权非负，<span class=\"katex-inline\">\\delta(y)\\le\\delta(u)<\/span>；而选 <span class=\"katex-inline\">u<\/span> 时 <span class=\"katex-inline\">d[u]<\/span> 是 <span class=\"katex-inline\">V-S<\/span> 中最小，故 <span class=\"katex-inline\">d[u]\\le d[y]<\/span>。连起来：<span class=\"katex-inline\">d[u]\\le d[y]\\le\\delta(y)\\le\\delta(u)<\/span>，与 <span class=\"katex-inline\">d[u]&amp;gt;\\delta(u)<\/span> 矛盾。这一步证明了首个错误入队结点不存在；因此 <span class=\"katex-inline\">u<\/span> 入 <span class=\"katex-inline\">S<\/span> 时距离正确，归纳得所有结点最短路正确。整段证明的支点是 <span class=\"katex-inline\">\\delta(y)\\le\\delta(u)<\/span>，它只在边权非负时成立。<\/p>\n<h2>反事实：去掉前提或某条性质会怎样<\/h2>\n<ul><li>\n<strong>红黑树去掉“红结点子结点皆黑”<\/strong>：允许红结点相邻，一条路径上可串起任意多红结点，树高不再受黑高约束，最坏退化成普通二叉搜索树的 <span class=\"katex-inline\">\\Theta(n)<\/span> 查找；颜色约束的作用正是把红结点当稀疏点缀，防止单侧链化。\n<\/li><li>\n<strong>去掉根结点为黑<\/strong>：根染红本身不直接改变黑高，但插入修复的边界条件失去锚点，向上修复时颜色状态无法在根处收敛。\n<\/li><li>\n<strong>图里出现负权边仍跑 Dijkstra<\/strong>：已加入 <span class=\"katex-inline\">S<\/span> 的结点距离被当作最终值，后续负权边可能给出更短路径却不再回头更新；反证链条中 <span class=\"katex-inline\">\\delta(y)\\le\\delta(u)<\/span> 依赖非负权，负权下该不等式断裂，算法可能输出错误距离。负权场景需要 Bellman-Ford 一类允许反复松弛的算法。\n<\/li><li>\n<strong>B 树节点按单关键字取<\/strong>：树高随 <span class=\"katex-inline\">n<\/span> 线性增长，每次查找多次磁盘寻道；宽节点把同层分支选择收进一次块读取，树高与 I/O 次数同时下降。\n<\/li><li>\n<strong>散列表负载因子失控<\/strong>：表长不变而元素增多，链表变长或探测序列拉长，平均查找退化到接近线性；散列的常数时间前提是负载因子保持在可控范围。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章数据结构是第 4 章设计策略的工具：动态规划填表用数组，贪心选边用优先队列，摊还分析针对表扩张这类动态结构。图算法里的松弛思想与第 1 章的循环不变式同源——维护一个距离估计不变式，逐步把估计逼近真实值。NP 完全性一章讨论的问题，其算法障碍不在数据结构选择，而在问题本身的计算复杂度。<\/p>", "kind": "chapter", "title": "第 3 章：数据结构与图算法（哈希表、红黑树、B 树、图的表示、BFS/DFS、最小生成树、最短路）"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.219<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：数据结构与图算法（哈希表、红黑树、B 树、图的表示、BFS/DFS、最小生成树、最短路）<\/a><\/span><\/div><h1>第 4 章：算法设计策略与复杂性<\/h1>\n<blockquote>对应原书第 15–17、34–35 章（PDF 第 219–272、631–686 页；印刷页 = PDF 页 − 15）。第 15 章动态规划、第 16 章贪心算法、第 17 章摊还分析、第 34 章 NP 完全性、第 35 章近似算法。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 3 章（平衡树、图遍历与松弛）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断一个问题是否具备最优子结构与重叠子问题，写出 DP 的状态定义、转移方程与填表顺序；\n<\/li><li>\n用交换论证说明贪心选择何时安全，举出贪心拿到次优解的反例；\n<\/li><li>\n区分聚合、记账、势能三种摊还分析方法，对动态表写出摊还代价；\n<\/li><li>\n解释多项式时间归约、P、NP、NP 完全性之间的层级关系；\n<\/li><li>\n说清面对 NP 完全问题时，精确算法、指数搜索与近似算法各自的适用位置。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>动态规划把问题拆成带记忆的子问题，靠最优子结构递推填表；贪心在每步选当前最优并论证它不排斥全局最优；摊还分析给一连串操作的总代价求平均，不引入概率假设；NP 完全性划定了一类问题的多项式算法障碍，承认困难之后才谈得上近似算法与指数上界的工程取舍。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 10：动态规划最优子结构（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。第 15 章（PDF 第 219 页起）以钢条切割、矩阵链乘法、最长公共子序列为例：先证明整体最优解由子问题最优解组成，再定义状态、写转移，自底向上填表或带记忆自顶向下求解。分治拆出的子问题相互独立，DP 的子问题反复出现，记忆化才有收益。<\/p>\n<h3>2. 概念 11：贪心交换论证与失效反例（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c11.md\" target=\"_blank\" rel=\"noopener\">概念 c11<\/a>。第 16 章（PDF 第 252 页起）的活动选择问题按结束时间最早贪心选择；论证手段是交换：任一最优解的第一个活动可换成贪心选择而不损失后续空间。贪心不总是成立：背包问题按单位价值贪心会错，必须看物品能否分割。<\/p>\n<h3>3. 概念 12：摊还分析三种方法（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c12.md\" target=\"_blank\" rel=\"noopener\">概念 c12<\/a>。第 17 章（PDF 第 273 页起）对栈操作、二进制计数器、动态表求摊还代价。聚合分析直接算 <span class=\"katex-inline\">n<\/span> 次操作总代价再平均；记账分析为早期操作预付存款；势能分析给数据结构定义势能，用势能升降抵消单次高代价。<\/p>\n<h3>4. 概念 13：NP 完全性归约（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c13.md\" target=\"_blank\" rel=\"noopener\">概念 c13<\/a>。第 34 章（PDF 第 631 页起）给出多项式时间归约框架：若问题 <span class=\"katex-inline\">A<\/span> 可在多项式时间归约到 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 有多项式算法则 <span class=\"katex-inline\">A<\/span> 也有。NP 完全问题是 NP 的“最难”成员；Cook 定理确立第一个 NP 完全问题，此后经归约链式证明。第 35 章（PDF 第 666 页起）在承认难解前提下设计近似算法，用可证明的近似比换取可行时间。<\/p>\n<h2>推导一（推演）：钢条切割的状态定义与转移<\/h2>\n<p>钢条长度 <span class=\"katex-inline\">i<\/span> 的售价表 <span class=\"katex-inline\">p_i<\/span>，求长度 <span class=\"katex-inline\">n<\/span> 的钢条切成若干段后的最大总售价。设 <span class=\"katex-inline\">r_i<\/span> 为长度 <span class=\"katex-inline\">i<\/span> 的最优售价。<\/p>\n<p>第一步，拆第一刀。长度 <span class=\"katex-inline\">i<\/span> 的切割方案中，最左侧一段长度为 <span class=\"katex-inline\">j<\/span>（<span class=\"katex-inline\">1\\le j\\le i<\/span>），售价 <span class=\"katex-inline\">p_j<\/span>，剩余长度 <span class=\"katex-inline\">i-j<\/span> 按最优方案切，售价 <span class=\"katex-inline\">r_{i-j}<\/span>。枚举 <span class=\"katex-inline\">j<\/span> 取最大：<\/p>\n<div class=\"katex-block\">r_i=\\max_{1\\le j\\le i}\\bigl(p_j+r_{i-j}\\bigr),\\qquad r_0=0.<\/div>\n<p>第二步，验证最优子结构。若剩余 <span class=\"katex-inline\">i-j<\/span> 的方案不是最优，把它换成更优方案，总售价会上升，与原方案最优矛盾；因此剩余部分必须取最优，转移方程成立。<\/p>\n<p>第三步，填表顺序。<span class=\"katex-inline\">r_0=0<\/span>，按 <span class=\"katex-inline\">i=1,2,\\dots,n<\/span> 自底向上计算，每个 <span class=\"katex-inline\">r_i<\/span> 用到的 <span class=\"katex-inline\">r_{i-j}<\/span> 下标都小于 <span class=\"katex-inline\">i<\/span>，已算好。存储切点可回溯出实际切割方案。<\/p>\n<p>复杂度：每个 <span class=\"katex-inline\">r_i<\/span> 枚举 <span class=\"katex-inline\">i<\/span> 个 <span class=\"katex-inline\">j<\/span>，填表 <span class=\"katex-inline\">O(n^2)<\/span>；带记忆自顶向下同样只计算必要子问题。<\/p>\n<h2>推导二（证明）：活动选择贪心的交换论证与贪心失效边界<\/h2>\n<p>活动集 <span class=\"katex-inline\">S=\\{a_1,\\dots,a_n\\}<\/span>，每个活动有开始时间 <span class=\"katex-inline\">s_i<\/span> 与结束时间 <span class=\"katex-inline\">f_i<\/span>，要求选出互不重叠的最大活动数。贪心策略：按结束时间排序，每次选结束最早且与已选活动不重叠的活动。<\/p>\n<p>论证取第一个活动。设最优解 <span class=\"katex-inline\">A<\/span> 的第一个活动为 <span class=\"katex-inline\">a_k<\/span>，贪心选择为 <span class=\"katex-inline\">a_1<\/span>（结束最早）。把 <span class=\"katex-inline\">a_k<\/span> 替换成 <span class=\"katex-inline\">a_1<\/span>：<span class=\"katex-inline\">a_1<\/span> 结束不晚于 <span class=\"katex-inline\">a_k<\/span>，<span class=\"katex-inline\">A<\/span> 中 <span class=\"katex-inline\">a_k<\/span> 之后的活动都在 <span class=\"katex-inline\">a_k<\/span> 结束之后开始，因而也在 <span class=\"katex-inline\">a_1<\/span> 结束之后开始，替换不产生重叠。新解活动数与 <span class=\"katex-inline\">A<\/span> 相同，仍是最优解。对剩余时间段重复这一交换，贪心选出的活动集不劣于任何最优解。<\/p>\n<p>失效边界：同一交换链条要求“早结束”不影响后续可选项。0-1 背包按单位重量价值贪心就会失败：某物品单位价值高但体积大，装下它挤掉了两件中价值更高的组合；子问题之间有取舍耦合，局部最优拼不出全局最优。这类问题回到 DP 或搜索求解。<\/p>\n<h2>反事实：策略选错或前提认误会怎样<\/h2>\n<ul><li>\n<strong>把 DP 当分治硬跑<\/strong>：子问题重复计算，指数代价；加上记忆后重复子问题只算一次，才显出 DP 的价值。反过来，子问题相互独立、不重叠时，记忆化只占空间不换时间，分治更直接。\n<\/li><li>\n<strong>把摊还分析当成概率平均<\/strong>：摊还结论对任何输入序列成立，不依赖操作分布；平均分析依赖随机假设或随机化算法，最坏单次代价仍可能很高。动态表若按“平均插入代价”辩护，需要先说明随机来源。\n<\/li><li>\n<strong>以为 NP 完全问题只是“还没找到好算法”<\/strong>：NP 完全性是一类问题之间的归约关系；除非 P=NP，否则不存在已知的多项式精确算法。工程上把 NP 完全问题当多项式问题硬套贪心，得到的是无近似保证的启发式结果。\n<\/li><li>\n<strong>近似算法不看近似比<\/strong>：近似比刻画解离最优解多远；没有保证的启发式在某些实例上可能偏离最优很远。第 35 章的取舍是：放弃求最优，换取可证明的误差上界与可行运行时间。\n<\/li><li>\n<strong>贪心论证跳过交换步骤<\/strong>：只看“当前选择最好”不证明它不排斥全局最优，会把背包类耦合问题误判成可贪心；交换论证的作用正是检查替换后剩余空间是否仍然可用。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章把前几章的工具收拢成设计语言：DP 的状态表是第 2 章排序思想在优化问题上的延伸，贪心选边复用第 3 章优先队列，摊还分析处理第 3 章散列表与动态表的扩张代价。NP 完全性位于全书复杂度讨论的终点：前面各章给出的是具体算法及其代价，本章给出的是问题层面“能否有多项式算法”的分界，近似算法则是越过这条分界后的工程退路。<\/p>", "kind": "chapter", "title": "第 4 章：算法设计策略与复杂性（动态规划、贪心、摊还分析、NP 完全性、近似算法）"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.40<\/div><h1>渐近记号：Θ、O、Ω 的定义差异与常见误用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章（原书第 3 章 函数的增长，PDF 第 40 页起；渐近记号在 2.4 逆序对练习中先出现，PDF 第 39 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>比较两个算法谁快，直接拿秒数对比会被硬件、编程语言、输入规模和常数系数牵着走。同一个算法在 <span class=\"katex-inline\">n=10<\/span> 时的表现可能和 <span class=\"katex-inline\">n=10^6<\/span> 时完全相反。需要一套只描述“输入规模趋于无穷时代价怎么增长”的语言，把常数、低次项、小输入波动排除在外。渐近记号就是这套语言：它回答的是规模翻倍时代价大致乘几倍，而不是某次运行花了多少毫秒。<\/p>\n<h2>定义与符号逐项拆<\/h2>\n<p>记号都定义在从自然数到非负实数的函数上，比较对象是函数 <span class=\"katex-inline\">f(n)<\/span> 与基准函数 <span class=\"katex-inline\">g(n)<\/span>。<\/p>\n<p><strong><span class=\"katex-inline\">O(g(n))<\/span>（渐近上界）<\/strong>：存在正常量 <span class=\"katex-inline\">c<\/span> 和 <span class=\"katex-inline\">n_0<\/span>，使得对所有 <span class=\"katex-inline\">n\\ge n_0<\/span>，有 <span class=\"katex-inline\">0\\le f(n)\\le c\\,g(n)<\/span>。读作“<span class=\"katex-inline\">f<\/span> 是 <span class=\"katex-inline\">g<\/span> 的大 O”。含义是 <span class=\"katex-inline\">g<\/span> 在足够大之后从上方压住 <span class=\"katex-inline\">f<\/span>，压不住的常数系数可以吸收进 <span class=\"katex-inline\">c<\/span>。<\/p>\n<p><strong><span class=\"katex-inline\">\\Omega(g(n))<\/span>（渐近下界）<\/strong>：存在正常量 <span class=\"katex-inline\">c<\/span> 和 <span class=\"katex-inline\">n_0<\/span>，使得对所有 <span class=\"katex-inline\">n\\ge n_0<\/span>，有 <span class=\"katex-inline\">0\\le c\\,g(n)\\le f(n)<\/span>。含义是 <span class=\"katex-inline\">g<\/span> 从下方托住 <span class=\"katex-inline\">f<\/span>。<\/p>\n<p><strong><span class=\"katex-inline\">\\Theta(g(n))<\/span>（渐近紧界）<\/strong>：存在正常量 <span class=\"katex-inline\">c_1,c_2,n_0<\/span>，使得对所有 <span class=\"katex-inline\">n\\ge n_0<\/span>，有 <span class=\"katex-inline\">0\\le c_1 g(n)\\le f(n)\\le c_2 g(n)<\/span>。含义是 <span class=\"katex-inline\">f<\/span> 与 <span class=\"katex-inline\">g<\/span> 同阶，上下都被夹住。<\/p>\n<p>符号逐个说明：<span class=\"katex-inline\">n<\/span> 是输入规模；<span class=\"katex-inline\">n_0<\/span> 是“足够大”的门槛，门槛之前不等式不要求成立；<span class=\"katex-inline\">c,c_1,c_2<\/span> 是与 <span class=\"katex-inline\">n<\/span> 无关的正常量；不等式方向决定记号是上界还是下界。<\/p>\n<p>正例：<span class=\"katex-inline\">f(n)=n^2+3n<\/span>。取 <span class=\"katex-inline\">c_2=2<\/span>，<span class=\"katex-inline\">n_0=3<\/span>，则 <span class=\"katex-inline\">n^2+3n\\le 2n^2<\/span>，故 <span class=\"katex-inline\">f(n)=O(n^2)<\/span>；取 <span class=\"katex-inline\">c_1=1<\/span>，<span class=\"katex-inline\">n_0=1<\/span>，则 <span class=\"katex-inline\">n^2\\le n^2+3n<\/span>，故 <span class=\"katex-inline\">f(n)=\\Omega(n^2)<\/span>；两者同时成立，<span class=\"katex-inline\">f(n)=\\Theta(n^2)<\/span>。<\/p>\n<p>反例：不能说 <span class=\"katex-inline\">n^2=O(n)<\/span>。若存在 <span class=\"katex-inline\">c<\/span> 使 <span class=\"katex-inline\">n^2\\le cn<\/span>，约去 <span class=\"katex-inline\">n<\/span> 得 <span class=\"katex-inline\">n\\le c<\/span>，对任意固定 <span class=\"katex-inline\">c<\/span> 都有更大的 <span class=\"katex-inline\">n<\/span> 违反。<\/p>\n<h2>原理推导<\/h2>\n<p>推导一：验证 <span class=\"katex-inline\">f(n)=n^2+3n<\/span> 属于 <span class=\"katex-inline\">\\Theta(n^2)<\/span>。上界方向，<span class=\"katex-inline\">3n\\le n^2<\/span> 当 <span class=\"katex-inline\">n\\ge 3<\/span>，于是 <span class=\"katex-inline\">n^2+3n\\le 2n^2<\/span>，取 <span class=\"katex-inline\">c_2=2<\/span>、<span class=\"katex-inline\">n_0=3<\/span>。下界方向，<span class=\"katex-inline\">n^2+3n\\ge n^2<\/span>，取 <span class=\"katex-inline\">c_1=1<\/span>、<span class=\"katex-inline\">n_0=1<\/span>。两组常量都存在，夹逼成立。<\/p>\n<p>推导二：比较 <span class=\"katex-inline\">\\lg n<\/span> 与 <span class=\"katex-inline\">n^{0.99}<\/span>。取比值 <span class=\"katex-inline\">\\lg n/n^{0.99}<\/span>。令 <span class=\"katex-inline\">n=2^x<\/span>，比值为 <span class=\"katex-inline\">x/2^{0.99x}<\/span>；指数 <span class=\"katex-inline\">2^{0.99x}<\/span> 随 <span class=\"katex-inline\">x<\/span> 增长快于线性 <span class=\"katex-inline\">x<\/span>，比值趋于 0，因此 <span class=\"katex-inline\">\\lg n=O(n^{0.99})<\/span>，且 <span class=\"katex-inline\">\\lg n\\ne\\Omega(n^{0.99})<\/span>。对照另一个方向：<span class=\"katex-inline\">n^{0.01}<\/span> 与 <span class=\"katex-inline\">\\lg n<\/span> 的比值 <span class=\"katex-inline\">n^{0.01}/\\lg n<\/span> 趋于无穷，故 <span class=\"katex-inline\">n^{0.01}=\\Omega(\\lg n)<\/span>，<span class=\"katex-inline\">n^{0.01}\\ne O(\\lg n)<\/span>。结论是任何正幂次都压过对数，哪怕幂次只有 0.01；对数之间、幂次之间才需要再比较阶。<\/p>\n<p>记号包含关系：<span class=\"katex-inline\">f(n)=\\Theta(g(n))<\/span> 当且仅当 <span class=\"katex-inline\">f(n)=O(g(n))<\/span> 且 <span class=\"katex-inline\">f(n)=\\Omega(g(n))<\/span>；只有上界时 <span class=\"katex-inline\">f<\/span> 可能小得多，只有下界时可能大得多，<span class=\"katex-inline\">\\Theta<\/span> 是两者合取。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：输入规模 <span class=\"katex-inline\">n<\/span> 沿自然数增大，函数非负；比较的是阶而非具体数值。记号允许忽略低次项与常数系数，但不允许改变最高次项的幂或对数结构。<\/p>\n<p>失败案例：把 <span class=\"katex-inline\">O(n\\lg n)<\/span> 读成“运行时间恰好是 <span class=\"katex-inline\">n\\lg n<\/span>”。O 只给上界，算法实际可能是 <span class=\"katex-inline\">0.3n\\lg n+5n<\/span>，也可能是 <span class=\"katex-inline\">n<\/span>；写成 <span class=\"katex-inline\">O(n\\lg n)<\/span> 没有排除任何下界信息。反过来，声称某算法“最坏情况 <span class=\"katex-inline\">O(n^2)<\/span>”却用小样本实测的秒数背书，实测样本没越过 <span class=\"katex-inline\">n_0<\/span>，不构成渐近结论。<\/p>\n<p>边界提醒：渐近分析不区分同阶内的常数实现质量；记号也不处理空间与时间复杂度的换算，两者要分别写。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>Θ vs O<\/strong>：Θ 要求上下夹住，O 只压上方；说“运行时间是 <span class=\"katex-inline\">O(n^2)<\/span>”比“是 <span class=\"katex-inline\">\\Theta(n^2)<\/span>”弱很多。文献里 O 常被借用表达紧界，严格阅读时要核对是否同时有下界。\n<\/li><li>\n<strong>O vs Ω<\/strong>：方向相反。排序最坏比较次数有下界 <span class=\"katex-inline\">\\Omega(n\\lg n)<\/span>，是说任何比较算法低不到哪去；某排序最好情况 <span class=\"katex-inline\">O(n)<\/span>，是说存在输入让它快。\n<\/li><li>\n<strong>渐近阶 vs 平均情况<\/strong>：平均、最坏、最好描述输入情形，渐近记号描述函数阶；“平均 <span class=\"katex-inline\">O(n\\lg n)<\/span>”里 O 仍是上界，平均是取期望的环节。\n<\/li><li>\n<strong>大 O 与小 o<\/strong>：小 o 要求比值趋于 0，比大 O 更松；<span class=\"katex-inline\">n=o(n^2)<\/span> 成立，<span class=\"katex-inline\">n^2=o(n^2)<\/span> 不成立。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无，本章是全书分析语言的起点。后继：概念 c02 主定理用 Θ/O/Ω 陈述三情形；c03 建堆、c04 快排期望阶、c05 比较排序下界都落在这套记号上；平衡树高度 <span class=\"katex-inline\">O(\\lg n)<\/span> 与 NP 完全性的多项式定义同样以渐近阶度量。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（渐近记号：Θ、O、Ω 的定义差异与常见误用）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：渐近记号的依赖链、定义展开与阶比较算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要弄清楚 Θ、O、Ω 怎么用，先往回追四层前提：<\/p>\n<ol><li>\n<strong>比较算法不能只看某次运行的秒数<\/strong>。秒数随 CPU、编译器、语言、输入样本变化；两个算法在小样本上的胜负到了大样本上可能颠倒。因此分析必须把“常数系数、低次项、小输入波动”剥离，只留下规模 <span class=\"katex-inline\">n<\/span> 增大时代价的增长方式。\n<\/li><li>\n<strong>剥离之后需要一套严格的不等式定义<\/strong>。记号不是“差不多大”的口语说法，而是“存在某个常量和某个门槛，使不等式对所有够大的 <span class=\"katex-inline\">n<\/span> 成立”。常量吸收系数，门槛忽略小输入，这两件事是记号成立的机械条件。\n<\/li><li>\n<strong>三个记号分别对应单边压住与双边夹住<\/strong>。O 只给上界，Ω 只给下界，Θ 是两者同时成立。判断一个函数属于哪个记号，要分别检查上下两个方向能否找到常量。\n<\/li><li>\n<strong>比较两个函数的阶，最终落到比值、极限或增长结构<\/strong>。对数、幂次、指数各有层级：对数慢于任何正幂次，正幂次慢于任何底数大于 1 的指数。主定理、堆排序高度、快排期望阶这些后续结论，都要先用这套夹逼语言写出来。\n<\/ol>\n<p>依赖链方向：运行秒数不可比 → 需要增长阶语言 → 记号由不等式与常量定义 → 单边/双边压住分三类 → 函数阶比较靠比值与层级 → 后续复杂度结论挂在这套记号上。<\/p>\n<h2>正向推导：从定义到包含关系<\/h2>\n<h3>定义逐条展开<\/h3>\n<p>以 <span class=\"katex-inline\">O(g(n))<\/span> 为例。定义拆开是四个要素：比较对象 <span class=\"katex-inline\">f(n)<\/span> 与 <span class=\"katex-inline\">g(n)<\/span>；一个正常量 <span class=\"katex-inline\">c<\/span>；一个门槛 <span class=\"katex-inline\">n_0<\/span>；不等式 <span class=\"katex-inline\">0\\le f(n)\\le c g(n)<\/span>。量词顺序是“存在 <span class=\"katex-inline\">c<\/span>、存在 <span class=\"katex-inline\">n_0<\/span>，使对所有 <span class=\"katex-inline\">n\\ge n_0<\/span>”。<span class=\"katex-inline\">c<\/span> 不能随 <span class=\"katex-inline\">n<\/span> 变，<span class=\"katex-inline\">n_0<\/span> 之前的 <span class=\"katex-inline\">n<\/span> 不在管辖范围。<\/p>\n<p><span class=\"katex-inline\">\\Omega(g(n))<\/span> 把不等式翻到另一侧：<span class=\"katex-inline\">0\\le c g(n)\\le f(n)<\/span>。<span class=\"katex-inline\">\\Theta(g(n))<\/span> 同时写两条：<span class=\"katex-inline\">c_1 g(n)\\le f(n)\\le c_2 g(n)<\/span>。注意下界不等式左端也有 <span class=\"katex-inline\">0\\le<\/span> 要求，函数不能取负值再套记号。<\/p>\n<h3>推包含关系<\/h3>\n<p>命题：<span class=\"katex-inline\">f(n)=\\Theta(g(n))<\/span> 当且仅当 <span class=\"katex-inline\">f(n)=O(g(n))<\/span> 且 <span class=\"katex-inline\">f(n)=\\Omega(g(n))<\/span>。<\/p>\n<p>正向：Θ 定义里同时含有上界与下界两条不等式，取上界那条即得 O，取下界那条即得 Ω。反向：若 O 成立，存在 <span class=\"katex-inline\">c_2,n_0&#x27;<\/span> 使 <span class=\"katex-inline\">f\\le c_2 g<\/span>；Ω 成立，存在 <span class=\"katex-inline\">c_1,n_0&#x27;&#x27;<\/span> 使 <span class=\"katex-inline\">c_1 g\\le f<\/span>；取 <span class=\"katex-inline\">n_0=\\max(n_0&#x27;,n_0&#x27;&#x27;)<\/span>，两组不等式在 <span class=\"katex-inline\">n\\ge n_0<\/span> 同时成立，即得 Θ。<\/p>\n<h3>阶比较的通用做法<\/h3>\n<p>比较 <span class=\"katex-inline\">f<\/span> 与 <span class=\"katex-inline\">g<\/span> 的阶，先看比值 <span class=\"katex-inline\">f(n)/g(n)<\/span>：比值有正常量极限 → 同阶 Θ；比值趋于 0 → <span class=\"katex-inline\">f=o(g)<\/span>，自然 <span class=\"katex-inline\">f=O(g)<\/span>；比值趋于无穷 → <span class=\"katex-inline\">f=\\Omega(g)<\/span>。比值不好求时，取对数把乘法变加法，或按已知层级（对数、幂、指数）对号入座。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：<span class=\"katex-inline\">f(n)=3n^2-10n<\/span> 套三个记号<\/h3>\n<p>上界方向：<span class=\"katex-inline\">n\\ge 4<\/span> 时 <span class=\"katex-inline\">10n\\le 2.5n^2<\/span>，故 <span class=\"katex-inline\">3n^2-10n\\le 3n^2<\/span>，取 <span class=\"katex-inline\">c_2=3<\/span>、<span class=\"katex-inline\">n_0=4<\/span>，<span class=\"katex-inline\">f=O(n^2)<\/span>。 下界方向：<span class=\"katex-inline\">n\\ge 5<\/span> 时 <span class=\"katex-inline\">10n\\le 2n^2<\/span>，故 <span class=\"katex-inline\">3n^2-10n\\ge n^2<\/span>，取 <span class=\"katex-inline\">c_1=1<\/span>、<span class=\"katex-inline\">n_0=5<\/span>，<span class=\"katex-inline\">f=\\Omega(n^2)<\/span>。 两方向同时成立，<span class=\"katex-inline\">f=\\Theta(n^2)<\/span>。代入核验：<span class=\"katex-inline\">n=10<\/span>，<span class=\"katex-inline\">f=200<\/span>，<span class=\"katex-inline\">n^2=100<\/span>，比值 2；<span class=\"katex-inline\">n=100<\/span>，<span class=\"katex-inline\">f=29000<\/span>，<span class=\"katex-inline\">n^2=10000<\/span>，比值 2.9；<span class=\"katex-inline\">n=1000<\/span>，比值 2.99，趋于 3，落在两个常量之间。<\/p>\n<h3>算例 2：<span class=\"katex-inline\">\\lg n<\/span> 与 <span class=\"katex-inline\">n^{0.99}<\/span> 的具体比值<\/h3>\n<p>令 <span class=\"katex-inline\">n=2^x<\/span>，<span class=\"katex-inline\">\\lg n=x<\/span>，<span class=\"katex-inline\">n^{0.99}=2^{0.99x}<\/span>，比值 <span class=\"katex-inline\">x/2^{0.99x}<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">x=10<\/span>（<span class=\"katex-inline\">n=1024<\/span>）：比值 <span class=\"katex-inline\">10/2^{9.9}\\approx 10/968\\approx 0.0103<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">x=30<\/span>（<span class=\"katex-inline\">n\\approx 1.07\\times 10^9<\/span>）：比值 <span class=\"katex-inline\">30/2^{29.7}\\approx 30/8.4\\times10^8\\approx 3.6\\times10^{-8}<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">x=60<\/span>：比值 <span class=\"katex-inline\">60/2^{59.4}<\/span>，已是 <span class=\"katex-inline\">10^{-16}<\/span> 量级。\n<\/ul>\n<p>比值一路压向 0，指数函数在深处碾压线性增长，因此 <span class=\"katex-inline\">\\lg n=O(n^{0.99})<\/span>，且找不到常量 <span class=\"katex-inline\">c<\/span> 使 <span class=\"katex-inline\">c\\,n^{0.99}\\le\\lg n<\/span> 对所有够大的 <span class=\"katex-inline\">n<\/span> 成立，故 <span class=\"katex-inline\">\\lg n\\ne\\Omega(n^{0.99})<\/span>。对照 <span class=\"katex-inline\">n^{0.01}<\/span>：<span class=\"katex-inline\">n^{0.01}/\\lg n<\/span> 在 <span class=\"katex-inline\">n=10^{12}<\/span> 时为 <span class=\"katex-inline\">10^{0.12}/12\\approx 1.32/12\\approx 0.11<\/span>，在 <span class=\"katex-inline\">n=10^{60}<\/span> 时为 <span class=\"katex-inline\">10^{0.6}/60\\approx 3.98/60\\approx 0.066<\/span>？此处注意幂次增长慢但不回头，继续增大到 <span class=\"katex-inline\">n=10^{300}<\/span>，比值 <span class=\"katex-inline\">10^3/300\\approx 3.3<\/span>，最终趋于无穷，故 <span class=\"katex-inline\">n^{0.01}=\\Omega(\\lg n)<\/span>。<\/p>\n<h3>算例 3：反例 <span class=\"katex-inline\">n^2=O(n)<\/span> 为什么不成立<\/h3>\n<p>假设存在 <span class=\"katex-inline\">c,n_0<\/span> 使 <span class=\"katex-inline\">n^2\\le cn<\/span> 对所有 <span class=\"katex-inline\">n\\ge n_0<\/span> 成立。两端约去正 <span class=\"katex-inline\">n<\/span>，得 <span class=\"katex-inline\">n\\le c<\/span>。<span class=\"katex-inline\">c<\/span> 是固定常量，取 <span class=\"katex-inline\">n=\\max(n_0,c)+1<\/span> 即违反不等式。矛盾说明大 O 关系不成立。同一反例改写成下界视角：<span class=\"katex-inline\">n=\\Omega(\\sqrt n)<\/span> 成立吗？取 <span class=\"katex-inline\">c=1<\/span>、<span class=\"katex-inline\">n_0=1<\/span>，<span class=\"katex-inline\">n\\ge\\sqrt n<\/span> 对 <span class=\"katex-inline\">n\\ge 1<\/span> 成立，成立；反过来 <span class=\"katex-inline\">\\sqrt n=\\Omega(n)<\/span> 不成立，理由同上。<\/p>\n<h2>对抗性追问<\/h2>\n<p><strong>追问一：<span class=\"katex-inline\">f(n)=O(g(n))<\/span> 能不能推出 <span class=\"katex-inline\">g(n)=\\Omega(f(n))<\/span>？<\/strong> 按定义，<span class=\"katex-inline\">f\\le c g<\/span> 等价于 <span class=\"katex-inline\">g\\ge (1/c)f<\/span>，常量 <span class=\"katex-inline\">1/c<\/span> 仍为正，方向上是可以互推的；但记号习惯上不这么写，因为 Ω 的基准函数通常取阶更低的一侧。真正容易混的是反向：<span class=\"katex-inline\">f=O(g)<\/span> 不代表 <span class=\"katex-inline\">g=O(f)<\/span>，例如 <span class=\"katex-inline\">n=O(n^2)<\/span>，<span class=\"katex-inline\">n^2=O(n)<\/span> 不成立。<\/p>\n<p><strong>追问二：两个函数同阶，是否运行时间就一样快？<\/strong> 不是。同阶只夹住增长结构，常量系数与低次项差别可以很大：<span class=\"katex-inline\">1000n\\lg n<\/span> 与 <span class=\"katex-inline\">0.1n\\lg n<\/span> 同为 <span class=\"katex-inline\">\\Theta(n\\lg n)<\/span>，小样本上前者慢得多。渐近分析回答阶，工程实现回答常数，两层结论不能互相替代。<\/p>\n<p><strong>追问三：算法输入规模是离散的，<span class=\"katex-inline\">n<\/span> 取实数极限有没有问题？<\/strong> 记号定义在自然数上，极限只是判断工具；比值趋于无穷或趋于 0 的结论可以通过对所有足够大自然数成立的不等式来落实，不依赖实数连续性。<\/p>\n<h2>延伸推演：记号在算法分析中的落点<\/h2>\n<h3>渐近阶怎样指导算法选型<\/h3>\n<p>两个候选算法同阶时，常数与低次项决定工程表现；不同阶时，规模增大后阶的差距压倒常数。<span class=\"katex-inline\">O(n\\lg n)<\/span> 与 <span class=\"katex-inline\">O(n^2)<\/span> 在 <span class=\"katex-inline\">n=100<\/span> 时差距可能不明显，<span class=\"katex-inline\">n=10^6<\/span> 时 <span class=\"katex-inline\">n^2<\/span> 已是 <span class=\"katex-inline\">10^{12}<\/span> 次量级，<span class=\"katex-inline\">n\\lg n<\/span> 约 <span class=\"katex-inline\">2\\times10^7<\/span> 次量级。选型判断先看阶是否拉开，再在同阶实现间比常数。<\/p>\n<h3>小输入与低频项为什么不进记号<\/h3>\n<p>定义中的 <span class=\"katex-inline\">n_0<\/span> 之前，函数可以任意波动；低次项在 <span class=\"katex-inline\">n<\/span> 足够大时被最高次项压住。例如 <span class=\"katex-inline\">f(n)=n^2+10^6 n<\/span>，<span class=\"katex-inline\">n<\/span> 小时 <span class=\"katex-inline\">10^6 n<\/span> 占主导，<span class=\"katex-inline\">n<\/span> 超过 <span class=\"katex-inline\">10^6<\/span> 后 <span class=\"katex-inline\">n^2<\/span> 反超。渐近结论描述深处行为，不为小样本背书；实测小样本只能作实现参考，不能反推渐近阶。<\/p>\n<h3>三类常见误用逐条拆<\/h3>\n<p>一是把 <span class=\"katex-inline\">O(n\\lg n)<\/span> 读作精确运行时间：O 只封上界，内部可以是 <span class=\"katex-inline\">0.1n\\lg n<\/span> 也可以是 <span class=\"katex-inline\">n<\/span>。二是双向互推：<span class=\"katex-inline\">f=O(g)<\/span> 推不出 <span class=\"katex-inline\">g=O(f)<\/span>，<span class=\"katex-inline\">n=O(n^2)<\/span> 反例已核验。三是混入口径：最坏、最好、平均描述输入情形，渐近记号描述函数阶；“平均 <span class=\"katex-inline\">O(n\\lg n)<\/span>”里 O 仍是上界，平均是取期望的环节，两者不能互相替换。<\/p>\n<h3>第二算例：两对函数的阶比较<\/h3>\n<p>比较 <span class=\"katex-inline\">\\lg^2 n<\/span> 与 <span class=\"katex-inline\">n^{0.1}<\/span>：取对数口径，<span class=\"katex-inline\">\\lg(\\lg^2 n)=2\\lg\\lg n<\/span>，<span class=\"katex-inline\">\\lg(n^{0.1})=0.1\\lg n<\/span>，后者随 <span class=\"katex-inline\">n<\/span> 增长更快，故 <span class=\"katex-inline\">\\lg^2 n=O(n^{0.1})<\/span>，反向不成立。 比较 <span class=\"katex-inline\">n\\lg n<\/span> 与 <span class=\"katex-inline\">n^{1.1}<\/span>：比值 <span class=\"katex-inline\">n\\lg n/n^{1.1}=\\lg n/n^{0.1}\\to0<\/span>，故 <span class=\"katex-inline\">n\\lg n=O(n^{1.1})<\/span>。对照 <span class=\"katex-inline\">n^{0.99}<\/span> 与 <span class=\"katex-inline\">n\\lg n<\/span>：比值 <span class=\"katex-inline\">n\\lg n/n^{0.99}=n^{0.01}\\lg n\\to\\infty<\/span>，故 <span class=\"katex-inline\">n^{0.99}=O(n\\lg n)<\/span>，反向不成立。幂次与对数相乘仍低于任何高于 1 的幂次。<\/p>\n<h3>对抗性追问补充<\/h3>\n<p><strong>追问四：记号能不能套在空间复杂度上？<\/strong> 能。同一套 Θ/O/Ω 定义用于空间函数，只比较占用规模；时间与空间是两个独立函数，要分别写界，不能用时间上界代替空间结论。<\/p>\n<p><strong>追问五：两个函数同阶，交换顺序调用会不会改变渐近结论？<\/strong> 复合函数 <span class=\"katex-inline\">f(g(n))<\/span> 的阶由内层规模决定；同阶关系在复合下不保持对称。比较复合阶要先写内层增长，再代入外层函数，不能凭表面系数判断。<\/p>\n<h2>逐层推导补遗<\/h2>\n<h3>量词顺序复查<\/h3>\n<p>定义 <span class=\"katex-inline\">O(g(n))<\/span> 的量词链是“存在 <span class=\"katex-inline\">c&amp;gt;0<\/span>，存在 <span class=\"katex-inline\">n_0<\/span>，对所有 <span class=\"katex-inline\">n\\ge n_0<\/span>，<span class=\"katex-inline\">f(n)\\le cg(n)<\/span>”。<span class=\"katex-inline\">c<\/span> 先于 <span class=\"katex-inline\">n<\/span> 选定，因此不能写成“对每个 <span class=\"katex-inline\">n<\/span> 找一个 <span class=\"katex-inline\">c_n<\/span>”；随 <span class=\"katex-inline\">n<\/span> 变化的系数等于没有常数约束。<span class=\"katex-inline\">n_0<\/span> 是门槛，门槛之前函数行为不参与渐近结论。<\/p>\n<h3>极限法判阶的步骤<\/h3>\n<p>比较 <span class=\"katex-inline\">f,g<\/span>：先写比值 <span class=\"katex-inline\">f/g<\/span>；若极限为正常量，两者 <span class=\"katex-inline\">\\Theta<\/span>；极限 0，<span class=\"katex-inline\">f=o(g)<\/span> 且 <span class=\"katex-inline\">f=O(g)<\/span>；极限无穷，<span class=\"katex-inline\">f=\\Omega(g)<\/span>。比值含对数或幂次时，取对数把乘除变加减，再比较最高增长项。极限不好求时，放缩到已知层级（对数、幂、指数）对号入座。<\/p>\n<h3>第三算例：阶位排列<\/h3>\n<p>把下列函数按增长从慢到快排：<span class=\"katex-inline\">\\lg n<\/span>，<span class=\"katex-inline\">n^{0.2}<\/span>，<span class=\"katex-inline\">n\\lg n<\/span>，<span class=\"katex-inline\">n^2<\/span>，<span class=\"katex-inline\">2^n<\/span>，<span class=\"katex-inline\">n!<\/span>。对数最慢；任何正幂次之；<span class=\"katex-inline\">n\\lg n<\/span> 是幂乘对数，落在 <span class=\"katex-inline\">n<\/span> 与 <span class=\"katex-inline\">n^{1+\\varepsilon}<\/span> 之间；<span class=\"katex-inline\">n^2<\/span> 高于 <span class=\"katex-inline\">n\\lg n<\/span>；指数 <span class=\"katex-inline\">2^n<\/span> 高于任何多项式；阶乘 <span class=\"katex-inline\">n!<\/span> 由 Stirling 近似 <span class=\"katex-inline\">n!\\approx(n/e)^n\\sqrt{2\\pi n}<\/span>，增长快于固定底指数 <span class=\"katex-inline\">2^n<\/span>。核验相邻两对：<span class=\"katex-inline\">n\\lg n/n^2=\\lg n/n\\to0<\/span>；<span class=\"katex-inline\">2^n/n^2\\to\\infty<\/span>。<\/p>\n<h3>记号使用的书写规范<\/h3>\n<p>正文比较式里 <code>&lt;<\/code> 写作 <code>&amp;lt;<\/code>；公式用 <code><span class=\"katex-inline\">...<\/span><\/code> 包裹。说“运行时间 <span class=\"katex-inline\">O(n\\lg n)<\/span>”时，主语是算法的代价函数；不要把记号挂在输入或输出规模上。多个函数并列比较时，逐项分别写上下界，不用一个记号覆盖全部。<\/p>\n<h2>边界与常见误读补充<\/h2>\n<p>渐近记号不区分同阶实现的常数质量，也不换算时间与空间；两个 <span class=\"katex-inline\">\\Theta(n\\lg n)<\/span> 算法常数可能差数倍。记号只在 <span class=\"katex-inline\">n\\ge n_0<\/span> 后生效，小样本实测不能反推阶。把 O 当精确运行时间、把双向界互推、把平均与最坏混口径，是三类高频误用；引用结论时先核对记号方向与输入情形。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">O(g(n))<\/span> 定义中的量词顺序，并说明 <span class=\"katex-inline\">c<\/span> 为什么不能随 <span class=\"katex-inline\">n<\/span> 变化。\n<\/li><li>\n<span class=\"katex-inline\">f(n)=n\\lg n+500n<\/span> 属于 <span class=\"katex-inline\">O(n\\lg n)<\/span> 还是 <span class=\"katex-inline\">O(n)<\/span>？分别检查上界与下界方向。\n<\/li><li>\n为什么说 Θ 是 O 与 Ω 的合取？只用 O 会漏掉什么信息？\n<\/li><li>\n判断 <span class=\"katex-inline\">n^{0.1}<\/span> 与 <span class=\"katex-inline\">\\ln n<\/span> 谁是对方的上界、谁是下界，写出比值的走向。\n<\/li><li>\n“某算法实测比另一算法快”为什么不能作为渐近阶结论的依据？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "渐近记号：Θ、O、Ω 的定义差异与常见误用"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.53<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">渐近记号：Θ、O、Ω 的定义差异与常见误用<\/a><\/span><\/div><h1>分治递归式与主定理：三种情形的套用与边界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章（原书第 4 章 分治策略，PDF 第 53 页起；主定理见 PDF 第 68 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>分治算法把一个规模 <span class=\"katex-inline\">n<\/span> 的问题拆成若干规模更小的同类子问题，递归求解后合并。要判断这种算法的渐近代价，需要把“拆成几个子问题、每个子问题多大、合并花多少”写成一个方程，再从方程读出阶。递归式就是这个方程；主定理则是一类常见递归式的现成判阶工具，免去每次画递归树。<\/p>\n<h2>定义与符号逐项拆<\/h2>\n<p>分治递归式标准形式：<\/p>\n<div class=\"katex-block\">T(n)=aT(n/b)+f(n).<\/div>\n<p>符号逐个解释：<span class=\"katex-inline\">a<\/span> 是子问题个数，<span class=\"katex-inline\">a\\ge 1<\/span>；<span class=\"katex-inline\">b<\/span> 是子问题规模相对于原问题的缩小倍数，<span class=\"katex-inline\">b&amp;gt;1<\/span>；<span class=\"katex-inline\">f(n)<\/span> 是拆分与合并阶段的代价（含切分、结果合并）；<span class=\"katex-inline\">T(n)<\/span> 是规模 <span class=\"katex-inline\">n<\/span> 的总代价；<span class=\"katex-inline\">T(1)<\/span> 取常量阶。<\/p>\n<p>主定理（原书定理 4.1，PDF 第 68 页）针对上述形式给出三种情形。记 <span class=\"katex-inline\">n^{\\log_b a}<\/span> 为分治部分的规模基准。<\/p>\n<p><strong>情形 1<\/strong>：<span class=\"katex-inline\">f(n)=O(n^{\\log_b a-\\varepsilon})<\/span>，即合并代价比基准低一个多项式间隙（<span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span>），则 <span class=\"katex-inline\">T(n)=\\Theta(n^{\\log_b a})<\/span>。<\/p>\n<p><strong>情形 2<\/strong>：<span class=\"katex-inline\">f(n)=\\Theta(n^{\\log_b a})<\/span>，合并代价与基准同阶，则 <span class=\"katex-inline\">T(n)=\\Theta(n^{\\log_b a}\\lg n)<\/span>。<\/p>\n<p><strong>情形 3<\/strong>：<span class=\"katex-inline\">f(n)=\\Omega(n^{\\log_b a+\\varepsilon})<\/span>，合并代价高出一个多项式间隙，且满足正则条件 <span class=\"katex-inline\">a f(n/b)\\le c f(n)<\/span> 对某个常量 <span class=\"katex-inline\">c&amp;lt;1<\/span> 成立，则 <span class=\"katex-inline\">T(n)=\\Theta(f(n))<\/span>。<\/p>\n<p><span class=\"katex-inline\">\\varepsilon<\/span> 是正的多项式间隙参数；正则条件要求子问题合并代价按比例收缩，保证深层节点成本不反噬结论。<\/p>\n<h2>原理推导<\/h2>\n<p>递归树展开：第 0 层 1 个节点，成本 <span class=\"katex-inline\">f(n)<\/span>；第 1 层 <span class=\"katex-inline\">a<\/span> 个节点，每个规模 <span class=\"katex-inline\">n/b<\/span>；第 <span class=\"katex-inline\">k<\/span> 层 <span class=\"katex-inline\">a^k<\/span> 个节点，每个规模 <span class=\"katex-inline\">n/b^k<\/span>，该层总成本 <span class=\"katex-inline\">a^k f(n/b^k)<\/span>。叶子层满足 <span class=\"katex-inline\">n/b^h=1<\/span>，<span class=\"katex-inline\">h=\\log_b n<\/span>，叶子数 <span class=\"katex-inline\">a^h=n^{\\log_b a}<\/span>。<\/p>\n<p>树的总成本由两部分竞争：叶子层代价 <span class=\"katex-inline\">n^{\\log_b a}<\/span>，各层合并代价之和 <span class=\"katex-inline\">f(n)+a f(n/b)+\\dots<\/span>。<\/p>\n<ul><li>\n合并代价逐层被叶子基准压过（情形 1）：总成本由叶子决定，<span class=\"katex-inline\">\\Theta(n^{\\log_b a})<\/span>。\n<\/li><li>\n两者同阶（情形 2）：每层同阶、共 <span class=\"katex-inline\">\\lg n<\/span> 层，乘对数因子，<span class=\"katex-inline\">\\Theta(n^{\\log_b a}\\lg n)<\/span>。\n<\/li><li>\n合并代价逐层占优且正则条件成立（情形 3）：总成本由根附近的合并代价决定，<span class=\"katex-inline\">\\Theta(f(n))<\/span>。\n<\/ul>\n<p>三个实例逐个套用：<\/p>\n<p><strong>实例 A<\/strong>：<span class=\"katex-inline\">T(n)=9T(n/3)+n<\/span>。<span class=\"katex-inline\">a=9<\/span>，<span class=\"katex-inline\">b=3<\/span>，<span class=\"katex-inline\">n^{\\log_3 9}=n^2<\/span>。<span class=\"katex-inline\">f(n)=n=O(n^{2-\\varepsilon})<\/span>，取 <span class=\"katex-inline\">\\varepsilon=1<\/span>，落情形 1，<span class=\"katex-inline\">T(n)=\\Theta(n^2)<\/span>。<\/p>\n<p><strong>实例 B<\/strong>：<span class=\"katex-inline\">T(n)=T(2n/3)+1<\/span>。<span class=\"katex-inline\">a=1<\/span>，<span class=\"katex-inline\">b=3/2<\/span>，<span class=\"katex-inline\">n^{\\log_{3/2}1}=n^0=1<\/span>。<span class=\"katex-inline\">f(n)=1=\\Theta(1)<\/span>，落情形 2，<span class=\"katex-inline\">T(n)=\\Theta(\\lg n)<\/span>。<\/p>\n<p><strong>实例 C<\/strong>：<span class=\"katex-inline\">T(n)=3T(n/4)+n\\lg n<\/span>。<span class=\"katex-inline\">a=3<\/span>，<span class=\"katex-inline\">b=4<\/span>，<span class=\"katex-inline\">n^{\\log_4 3}\\approx n^{0.792}<\/span>。<span class=\"katex-inline\">f(n)=n\\lg n=\\Omega(n^{0.792+\\varepsilon})<\/span>；正则条件：<span class=\"katex-inline\">3f(n/4)=3(n/4)\\lg(n/4)\\le (3/4)n\\lg n<\/span>，取 <span class=\"katex-inline\">c=3/4&amp;lt;1<\/span> 成立，落情形 3，<span class=\"katex-inline\">T(n)=\\Theta(n\\lg n)<\/span>。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：递归式为单一支配形式，子问题规模一致，<span class=\"katex-inline\">a\\ge1<\/span>、<span class=\"katex-inline\">b&amp;gt;1<\/span>；<span class=\"katex-inline\">f<\/span> 非负且与基准呈多项式间隙或同阶。<\/p>\n<p>边界一：<span class=\"katex-inline\">f(n)<\/span> 与基准间隙不是多项式（如 <span class=\"katex-inline\">f=n/\\lg n<\/span> 对基准 <span class=\"katex-inline\">n<\/span>），三情形都不套入，需递归树或代入法。<\/p>\n<p>边界二：情形 3 正则条件失效时，深层成本可能比根代价更高，结论不能写 <span class=\"katex-inline\">\\Theta(f(n))<\/span>。<\/p>\n<p>边界三：子问题规模不一致，或递归式带取整、奇偶分支（如快排两侧 <span class=\"katex-inline\">k<\/span> 与 <span class=\"katex-inline\">n-1-k<\/span>），主定理形式不匹配，要走概率分析或代入法。<\/p>\n<p>失败案例：把实例 A 的 <span class=\"katex-inline\">f(n)=n<\/span> 误判成情形 2，会多出 <span class=\"katex-inline\">\\lg n<\/span> 因子；漏掉实例 C 的正则条件直接套情形 3，遇到不满足正则的递归式会给出错误上界。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>主定理 vs 递归树<\/strong>：主定理是递归树成本竞争的现成结论；树画得出来但落不进三情形时，递归树仍可逐层求和，主定理不能硬套。\n<\/li><li>\n<strong>分治 vs 动态规划<\/strong>：分治子问题相互独立；DP 子问题反复重叠，靠记忆化复用。递归式描述代价，不刻画子问题是否共享。\n<\/li><li>\n<strong><span class=\"katex-inline\">a<\/span> 与 <span class=\"katex-inline\">b<\/span> 的角色<\/strong>：<span class=\"katex-inline\">a<\/span> 决定叶子基准 <span class=\"katex-inline\">n^{\\log_b a}<\/span>，<span class=\"katex-inline\">b<\/span> 决定树高；合并代价 <span class=\"katex-inline\">f<\/span> 与基准比较，选落在哪种情形。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的 Θ/O/Ω 定义是主定理三情形的措辞基础。后继：c03 建堆按高度求和，c04 快排期望走概率递归；c10 的 DP 转移方程与分治递归式外形相似，辨析时回到“子问题是否重叠”。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（分治递归式与主定理：三种情形的套用与边界）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：递归树逐层成本、主定理三情形与套例核验<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要会用主定理，先往回追四层：<\/p>\n<ol><li>\n<strong>分治算法的代价必须拆成子问题部分与合并部分<\/strong>。不拆就无法写递归式：子问题个数、子问题规模、合并代价是三个独立参数，缺一个方程立不起来。\n<\/li><li>\n<strong>递归式求解的通用工具是递归树<\/strong>。树的每个节点代表一次子问题调用，节点上写该层合并成本；总成本是各层节点成本之和。主定理只是对一类规整递归式把树求和结果预先做成判据。\n<\/li><li>\n<strong>树成本的竞争双方是叶子基准与各层合并代价<\/strong>。叶子数由 <span class=\"katex-inline\">a,b<\/span> 决定，合并代价由 <span class=\"katex-inline\">f<\/span> 决定；谁占优、是否同阶，对应主定理三种情形。\n<\/li><li>\n<strong>三情形的分界线是多项式间隙<\/strong>。<span class=\"katex-inline\">f<\/span> 与基准 <span class=\"katex-inline\">n^{\\log_b a}<\/span> 之间差一个幂次、同阶、或高出一个幂次，结论分别落在不同支；间隙只是对数因子时定理不直接覆盖。\n<\/ol>\n<p>依赖链方向：分治结构 → 递归式三参数 → 递归树分层求和 → 叶子基准与合并代价竞争 → 三情形判阶 → 落不进定理时回到树或代入法。<\/p>\n<h2>正向推导：逐层还原递归树<\/h2>\n<h3>树的结构<\/h3>\n<p>递归式 <span class=\"katex-inline\">T(n)=aT(n/b)+f(n)<\/span>。根节点代表规模 <span class=\"katex-inline\">n<\/span> 的调用，拆成 <span class=\"katex-inline\">a<\/span> 个规模 <span class=\"katex-inline\">n/b<\/span> 的子节点；每个子节点再拆 <span class=\"katex-inline\">a<\/span> 个，规模 <span class=\"katex-inline\">n/b^2<\/span>。第 <span class=\"katex-inline\">k<\/span> 层节点数 <span class=\"katex-inline\">a^k<\/span>，每个规模 <span class=\"katex-inline\">n/b^k<\/span>。叶子层在 <span class=\"katex-inline\">n/b^h=1<\/span> 处，<span class=\"katex-inline\">h=\\log_b n<\/span>，叶子数 <span class=\"katex-inline\">a^h=a^{\\log_b n}=n^{\\log_b a}<\/span>。<\/p>\n<h3>每层成本<\/h3>\n<p>第 <span class=\"katex-inline\">k<\/span> 层总成本：<span class=\"katex-inline\">a^k f(n/b^k)<\/span>。根层 <span class=\"katex-inline\">k=0<\/span> 成本 <span class=\"katex-inline\">f(n)<\/span>；第 1 层 <span class=\"katex-inline\">a f(n/b)<\/span>；叶层只有子问题基本代价，合计 <span class=\"katex-inline\">a^h\\cdot T(1)=\\Theta(n^{\\log_b a})<\/span>。<\/p>\n<h3>三情形的树内直觉<\/h3>\n<p>情形 1：<span class=\"katex-inline\">f<\/span> 比叶子基准低一个多项式幂次。沿树向下，合并成本占比逐层缩小，总成本由叶子层主导，故 <span class=\"katex-inline\">T(n)=\\Theta(n^{\\log_b a})<\/span>。<\/p>\n<p>情形 2：<span class=\"katex-inline\">f<\/span> 与基准同阶。每层成本同阶，树高 <span class=\"katex-inline\">\\log_b n<\/span>，求和乘对数因子，<span class=\"katex-inline\">T(n)=\\Theta(n^{\\log_b a}\\lg n)<\/span>。<\/p>\n<p>情形 3：<span class=\"katex-inline\">f<\/span> 高出基准一个多项式幂次。根层合并成本最大，向下逐层收缩；正则条件 <span class=\"katex-inline\">a f(n/b)\\le c f(n)<\/span>（<span class=\"katex-inline\">c&amp;lt;1<\/span>）保证收缩率，深层节点成本之和被根层成本控制住，总成本 <span class=\"katex-inline\">\\Theta(f(n))<\/span>。<\/p>\n<h3>正则条件为什么必要<\/h3>\n<p>若不要求收缩率，子问题合并成本可能在深层反弹：例如 <span class=\"katex-inline\">f(n)<\/span> 增长不规则，<span class=\"katex-inline\">a f(n/b)<\/span> 不比 <span class=\"katex-inline\">f(n)<\/span> 小，深层节点叠加后总成本可能超过根层。情形 3 结论写 <span class=\"katex-inline\">\\Theta(f(n))<\/span> 时，必须有这条收缩假设托底。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：<span class=\"katex-inline\">T(n)=9T(n/3)+n<\/span><\/h3>\n<p>参数：<span class=\"katex-inline\">a=9<\/span>，<span class=\"katex-inline\">b=3<\/span>，<span class=\"katex-inline\">\\log_b a=\\log_3 9=2<\/span>，基准 <span class=\"katex-inline\">n^2<\/span>，<span class=\"katex-inline\">f(n)=n<\/span>。<\/p>\n<p>递归树前三层成本：根 <span class=\"katex-inline\">n<\/span>；第 1 层 <span class=\"katex-inline\">9\\cdot(n/3)=3n<\/span>；第 2 层 <span class=\"katex-inline\">9^2\\cdot(n/3)^2=9n<\/span>；第 <span class=\"katex-inline\">k<\/span> 层 <span class=\"katex-inline\">9^k\\cdot n/3^k=3^k n<\/span>。叶子层 <span class=\"katex-inline\">n^2<\/span>。比较：<span class=\"katex-inline\">n=1000<\/span>，根层 1000，叶层 <span class=\"katex-inline\">10^6<\/span>；<span class=\"katex-inline\">n=10^6<\/span>，根层 <span class=\"katex-inline\">10^6<\/span>，叶层 <span class=\"katex-inline\">10^{12}<\/span>。叶子基准远大于合并和，落情形 1（<span class=\"katex-inline\">f=O(n^{2-\\varepsilon})<\/span>，<span class=\"katex-inline\">\\varepsilon=1<\/span>），<span class=\"katex-inline\">T(n)=\\Theta(n^2)<\/span>。<\/p>\n<h3>算例 2：<span class=\"katex-inline\">T(n)=T(2n/3)+1<\/span><\/h3>\n<p>参数：<span class=\"katex-inline\">a=1<\/span>，<span class=\"katex-inline\">b=3/2<\/span>，<span class=\"katex-inline\">\\log_{3/2}1=0<\/span>，基准 <span class=\"katex-inline\">n^0=1<\/span>，<span class=\"katex-inline\">f(n)=1<\/span>。<\/p>\n<p>树每层只有 1 个节点，每层成本 1，树高 <span class=\"katex-inline\">\\log_{3/2}n<\/span>，总成本层数乘常量，落情形 2，<span class=\"katex-inline\">T(n)=\\Theta(\\lg n)<\/span>。核验：<span class=\"katex-inline\">n=9<\/span>，路径规模 <span class=\"katex-inline\">9\\to 6\\to 4\\to 2.7\\to 1<\/span>，约 4 层；<span class=\"katex-inline\">\\log_{3/2}9\\approx 5.4<\/span>，同量级。<\/p>\n<h3>算例 3：<span class=\"katex-inline\">T(n)=3T(n/4)+n\\lg n<\/span><\/h3>\n<p>参数：<span class=\"katex-inline\">a=3<\/span>，<span class=\"katex-inline\">b=4<\/span>，<span class=\"katex-inline\">\\log_4 3\\approx 0.792<\/span>，基准 <span class=\"katex-inline\">n^{0.792}<\/span>，<span class=\"katex-inline\">f(n)=n\\lg n<\/span>。<\/p>\n<p>正则条件核验：<span class=\"katex-inline\">3f(n/4)=3\\cdot(n/4)\\lg(n/4)=(3/4)n(\\lg n-2)<\/span>。对足够大的 <span class=\"katex-inline\">n<\/span>，<span class=\"katex-inline\">(3/4)(\\lg n-2)\\le c\\lg n<\/span>，取 <span class=\"katex-inline\">c=3/4<\/span> 即满足 <span class=\"katex-inline\">a f(n/b)\\le c f(n)<\/span>。<span class=\"katex-inline\">f<\/span> 高出基准 <span class=\"katex-inline\">0.208<\/span> 个幂次，落情形 3，<span class=\"katex-inline\">T(n)=\\Theta(n\\lg n)<\/span>。<\/p>\n<h3>算例 4：定理套不上的例子<\/h3>\n<p><span class=\"katex-inline\">T(n)=T(\\lfloor n/2\\rfloor)+T(\\lceil n/2\\rceil)+n\\lg n<\/span>。子问题规模一致但拆成两半，<span class=\"katex-inline\">a=2<\/span>、<span class=\"katex-inline\">b=2<\/span>，基准 <span class=\"katex-inline\">n<\/span>，<span class=\"katex-inline\">f=n\\lg n<\/span>；<span class=\"katex-inline\">f<\/span> 比基准高对数因子而非幂次，三情形都不直接覆盖。画递归树：第 <span class=\"katex-inline\">k<\/span> 层 <span class=\"katex-inline\">2^k<\/span> 个规模 <span class=\"katex-inline\">n/2^k<\/span> 的节点，该层成本 <span class=\"katex-inline\">2^k\\cdot(n/2^k)\\lg(n/2^k)=n(\\lg n-k)<\/span>；各层求和 <span class=\"katex-inline\">\\sum_{k=0}^{\\lg n} n(\\lg n-k)=\\Theta(n\\lg^2 n)<\/span>。此结果需递归树逐项求和得到，主定理不给现成答案。<\/p>\n<h2>对抗性追问<\/h2>\n<p><strong>追问一：<span class=\"katex-inline\">a=1<\/span> 时基准是什么？<\/strong> <span class=\"katex-inline\">\\log_b 1=0<\/span>，基准 <span class=\"katex-inline\">n^0=1<\/span>。此时树高 <span class=\"katex-inline\">\\log_b n<\/span>，每层一个节点；情形 2 给出 <span class=\"katex-inline\">\\Theta(\\lg n)<\/span>，与二分查找、折半递归的代价一致。<\/p>\n<p><strong>追问二：<span class=\"katex-inline\">f(n)=n^{\\log_b a}\\lg n<\/span> 落哪种情形？<\/strong> <span class=\"katex-inline\">f<\/span> 比基准高一个对数因子，不是多项式间隙；情形 2 只覆盖同阶，情形 3 要求高一个幂次，主定理两侧都不靠。这类递归式需递归树求解，常见结果是基准乘对数平方量级。<\/p>\n<p><strong>追问三：子问题规模是 <span class=\"katex-inline\">n-1<\/span> 而不是 <span class=\"katex-inline\">n/b<\/span> 时，主定理为什么失效？<\/strong> 主定理依赖每层节点规模按固定比例缩小，树高对数；规模每次减 1 时树高线性，节点退化成长链，合并代价累加方式不同（如 <span class=\"katex-inline\">T(n)=T(n-1)+\\Theta(n)<\/span> 解为 <span class=\"katex-inline\">\\Theta(n^2)<\/span>），必须另写递归式分析。<\/p>\n<h2>延伸推演：递归树成本与定理边界细节<\/h2>\n<h3>每层成本的核算口径<\/h3>\n<p>第 <span class=\"katex-inline\">k<\/span> 层节点数 <span class=\"katex-inline\">a^k<\/span>，每个规模 <span class=\"katex-inline\">n/b^k<\/span>，合并成本 <span class=\"katex-inline\">f(n/b^k)<\/span>。层成本 <span class=\"katex-inline\">a^k f(n/b^k)<\/span>。根层 <span class=\"katex-inline\">k=0<\/span> 是 <span class=\"katex-inline\">f(n)<\/span>，叶层 <span class=\"katex-inline\">k=h<\/span> 只剩子问题基本代价。树高 <span class=\"katex-inline\">h=\\log_b n<\/span>，叶数 <span class=\"katex-inline\">a^h=n^{\\log_b a}<\/span>。核算时先数节点，再算单节点合并成本，两层相乘；漏掉节点个数或错写单节点规模，层成本整体偏移。<\/p>\n<h3>三情形边界上的常见误判<\/h3>\n<p>情形 1 要求 <span class=\"katex-inline\">f<\/span> 比基准低一个多项式幂次，不是低一个对数因子。<span class=\"katex-inline\">f(n)=n/\\lg n<\/span> 与基准 <span class=\"katex-inline\">n<\/span> 只差对数，三情形都不收口。情形 3 的正则条件是独立于间隙的第二条要求：即使 <span class=\"katex-inline\">f<\/span> 高出基准幂次，子问题合并代价若收缩不下来，深层节点成本可能反弹，<span class=\"katex-inline\">\\Theta(f(n))<\/span> 结论不能套用。<\/p>\n<h3>代入法与主定理的对照<\/h3>\n<p>主定理给现成阶，代入法先猜阶再归纳验证。例：<span class=\"katex-inline\">T(n)=T(n-1)+n<\/span>，猜 <span class=\"katex-inline\">\\Theta(n^2)<\/span>，归纳假设 <span class=\"katex-inline\">T(n-1)\\le c(n-1)^2<\/span>，代入 <span class=\"katex-inline\">T(n)\\le c(n-1)^2+n<\/span>，选足够大 <span class=\"katex-inline\">c<\/span> 使右端 <span class=\"katex-inline\">\\le cn^2<\/span>，下界同法。代入法不受递归形式限制，定理套不上时作为兜底。<\/p>\n<h3>第二算例：两个补充递归式<\/h3>\n<p><span class=\"katex-inline\">T(n)=2T(n/2)+n^2<\/span>：<span class=\"katex-inline\">a=2,b=2<\/span>，基准 <span class=\"katex-inline\">n<\/span>，<span class=\"katex-inline\">f=n^2=\\Omega(n^{1+\\varepsilon})<\/span>，核验正则 <span class=\"katex-inline\">2f(n/2)=2\\cdot(n/2)^2=n^2/2\\le c n^2<\/span>，<span class=\"katex-inline\">c=1/2<\/span> 成立，落情形 3，<span class=\"katex-inline\">T(n)=\\Theta(n^2)<\/span>。递归树核验：根 <span class=\"katex-inline\">n^2<\/span>，第 1 层 <span class=\"katex-inline\">2\\cdot(n/2)^2=n^2/2<\/span>，逐层减半，总和 <span class=\"katex-inline\">n^2(1+1/2+1/4+\\dots)=2n^2<\/span>，同阶。<\/p>\n<p><span class=\"katex-inline\">T(n)=16T(n/4)+n<\/span>：<span class=\"katex-inline\">a=16,b=4<\/span>，基准 <span class=\"katex-inline\">n^{\\log_4 16}=n^2<\/span>，<span class=\"katex-inline\">f=n=O(n^{2-\\varepsilon})<\/span>，落情形 1，<span class=\"katex-inline\">T(n)=\\Theta(n^2)<\/span>。叶层 <span class=\"katex-inline\">n^2<\/span> 主导，合并和被压过。<\/p>\n<h3>对抗性追问补充<\/h3>\n<p><strong>追问四：子问题规模带取整怎么办？<\/strong> <span class=\"katex-inline\">T(n)=aT(\\lfloor n/b\\rfloor)+f(n)<\/span> 中取整不改变渐近阶；定理套用先忽略取整得阶，再用上下界夹逼核对。若两支规模不同（如快速排序两侧 <span class=\"katex-inline\">k<\/span> 与 <span class=\"katex-inline\">n-1-k<\/span>），定理形式不匹配。<\/p>\n<p><strong>追问五：<span class=\"katex-inline\">a<\/span> 不是整数时有什么影响？<\/strong> 主定理陈述允许 <span class=\"katex-inline\">a\\ge1<\/span> 为实数；实际算法中子问题个数是整数。<span class=\"katex-inline\">b<\/span> 必须大于 1，否则规模不缩小，树高失去对数依据。<\/p>\n<h2>逐层推导补遗<\/h2>\n<h3>递归树层和的闭式求法<\/h3>\n<p>第 <span class=\"katex-inline\">k<\/span> 层成本 <span class=\"katex-inline\">a^k f(n/b^k)<\/span>。若 <span class=\"katex-inline\">f(n)=n^d<\/span>，层成本 <span class=\"katex-inline\">a^k(n/b^k)^d=n^d(a/b^d)^k<\/span>，这是公比 <span class=\"katex-inline\">r=a/b^d<\/span> 的等比数列：<span class=\"katex-inline\">r&amp;lt;1<\/span> 层和收敛于根层量级；<span class=\"katex-inline\">r=1<\/span> 每层同阶共 <span class=\"katex-inline\">\\lg_b n<\/span> 层；<span class=\"katex-inline\">r&amp;gt;1<\/span> 叶层主导。三种公比正好对应主定理三情形，<span class=\"katex-inline\">d<\/span> 与 <span class=\"katex-inline\">\\log_b a<\/span> 的大小关系决定 <span class=\"katex-inline\">r<\/span> 落在哪个区间。<\/p>\n<h3>情形 3 正则条件的展开<\/h3>\n<p>正则条件 <span class=\"katex-inline\">af(n/b)\\le c f(n)<\/span>，<span class=\"katex-inline\">c&amp;lt;1<\/span>。以 <span class=\"katex-inline\">f(n)=n\\lg n<\/span> 核验：<span class=\"katex-inline\">a f(n/b)=a(n/b)(\\lg n-\\lg b)<\/span>，除以 <span class=\"katex-inline\">f(n)=n\\lg n<\/span> 得 <span class=\"katex-inline\">(a/b)(1-\\lg b/\\lg n)<\/span>，大 <span class=\"katex-inline\">n<\/span> 时趋近 <span class=\"katex-inline\">a/b<\/span>；取 <span class=\"katex-inline\">c<\/span> 介于 <span class=\"katex-inline\">a/b<\/span> 与 1 之间即可。若 <span class=\"katex-inline\">f<\/span> 增长不规则，子问题成本不按比例收缩，深层叠加可能超根层，情形 3 结论不成立。<\/p>\n<h3>代入法示例<\/h3>\n<p><span class=\"katex-inline\">T(n)=2T(n/2)+n<\/span>，猜 <span class=\"katex-inline\">T(n)=O(n\\lg n)<\/span>。归纳假设 <span class=\"katex-inline\">T(n/2)\\le c(n/2)\\lg(n/2)<\/span>，代入 <span class=\"katex-inline\">T(n)\\le c n\\lg(n/2)+n=c n\\lg n-c n\\lg 2+n<\/span>，取 <span class=\"katex-inline\">c\\ge 1/\\lg 2<\/span> 使右端 <span class=\"katex-inline\">\\le c n\\lg n<\/span>。下界同法 <span class=\"katex-inline\">\\Omega(n\\lg n)<\/span>。代入法先猜阶再验归纳，不受递归形式限制。<\/p>\n<h3>第三算例：混合递归式<\/h3>\n<p><span class=\"katex-inline\">T(n)=3T(n/3)+n\\lg n<\/span>：<span class=\"katex-inline\">a=3,b=3<\/span>，基准 <span class=\"katex-inline\">n<\/span>，<span class=\"katex-inline\">f=n\\lg n<\/span> 高对数因子；三情形不收口。递归树第 <span class=\"katex-inline\">k<\/span> 层 <span class=\"katex-inline\">3^k(n/3^k)\\lg(n/3^k)=n(\\lg n-k)<\/span>，层和 <span class=\"katex-inline\">\\sum_{k=0}^{\\lg n}n(\\lg n-k)=\\Theta(n\\lg^2 n)<\/span>。此结果只能逐层求和得到，主定理不给现成阶。<\/p>\n<h3>不适用场景清单<\/h3>\n<p>子问题规模不等（划分两侧 <span class=\"katex-inline\">k<\/span> 与 <span class=\"katex-inline\">n-1-k<\/span>）；递归带取整且两支不同；<span class=\"katex-inline\">f<\/span> 与基准只差对数因子；正则条件破裂。遇到任一条，换递归树或代入法，不硬套主定理。<\/p>\n<h2>边界与常见误读补充<\/h2>\n<p>主定理只覆盖单一支配形式：子问题规模一致、<span class=\"katex-inline\">a\\ge1<\/span>、<span class=\"katex-inline\">b&amp;gt;1<\/span>。落到对数间隙、两支规模不同、正则条件破裂时，定理不判阶，需递归树逐层求和或代入法归纳。常见误判是把 <span class=\"katex-inline\">f<\/span> 与基准的对数差当成多项式间隙，多出一个 <span class=\"katex-inline\">\\lg n<\/span> 因子；或漏掉子问题个数 <span class=\"katex-inline\">a<\/span>，把基准 <span class=\"katex-inline\">n^{\\log_b a}<\/span> 算成 <span class=\"katex-inline\">n<\/span>。套用前先核对三参数与间隙类型。递归树层成本为公比 <span class=\"katex-inline\">r=a/b^d<\/span> 的等比数列，<span class=\"katex-inline\">r<\/span> 小于 1 根层主导，等于 1 每层同阶乘层数，大于 1 叶层主导；主定理三情形正对应这三种公比位置。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出递归式 <span class=\"katex-inline\">T(n)=aT(n/b)+f(n)<\/span> 中 <span class=\"katex-inline\">a<\/span>、<span class=\"katex-inline\">b<\/span>、<span class=\"katex-inline\">f(n)<\/span> 各自记录什么。\n<\/li><li>\n叶子层节点数为什么是 <span class=\"katex-inline\">n^{\\log_b a}<\/span>？用对数恒等式推一遍。\n<\/li><li>\n对 <span class=\"katex-inline\">T(n)=2T(n/2)+n^2<\/span> 判断落哪种情形，给出渐近阶。\n<\/li><li>\n情形 3 的正则条件写的是什么不等式？不满足时结论为什么不能照搬？\n<\/li><li>\n举一个 <span class=\"katex-inline\">f<\/span> 与基准只差对数因子、主定理不直接适用的递归式。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "分治递归式与主定理：三种情形的套用与边界"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.99<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">渐近记号：Θ、O、Ω 的定义差异与常见误用<\/a><\/span><\/div><h1>堆与建堆的线性时间证明（求和上界）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书第 6 章 堆排序，PDF 第 99 页起；6.3 建堆）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>堆要同时支持“取最值”和“结构可维护”。朴素想法是往空堆里逐个插入元素，每次插入一次向上修复，总代价容易估成 <span class=\"katex-inline\">O(n\\lg n)<\/span>。但从任意数组整体建成堆，存在更紧的上界：<span class=\"katex-inline\">O(n)<\/span>。这个概念要回答两件事：堆的父子约束是什么，以及为什么自底向上整体建堆的求和上界压在 <span class=\"katex-inline\">O(n)<\/span>，而不是 <span class=\"katex-inline\">n\\lg n<\/span>。<\/p>\n<h2>定义与符号逐项拆<\/h2>\n<p><strong>二叉堆<\/strong>用数组 <span class=\"katex-inline\">A[1..n]<\/span> 表示完全二叉树。下标关系：结点 <span class=\"katex-inline\">i<\/span> 的父结点是 <span class=\"katex-inline\">\\lfloor i/2\\rfloor<\/span>，左孩子 <span class=\"katex-inline\">2i<\/span>，右孩子 <span class=\"katex-inline\">2i+1<\/span>。<\/p>\n<p><strong>最大堆<\/strong>：对每个结点 <span class=\"katex-inline\">i\\ne 1<\/span>，<span class=\"katex-inline\">A[\\text{parent}(i)]\\ge A[i]<\/span>，即父不小于子；堆顶是全局最大元素。<strong>最小堆<\/strong>方向相反，父不大于子，堆顶最小。<\/p>\n<p><strong>结点高度<\/strong>：该结点到叶结点的最长路径边数；<strong>树高<\/strong>：根结点高度。完全二叉树高度 <span class=\"katex-inline\">h=\\lfloor\\lg n\\rfloor<\/span>。<\/p>\n<p><strong>MAX-HEAPIFY(A, i)<\/strong>：假设 <span class=\"katex-inline\">A[i]<\/span> 的左右子树都是堆，<span class=\"katex-inline\">A[i]<\/span> 可能违反父不小于子；算法比较 <span class=\"katex-inline\">i<\/span> 与两孩子，把最大者上移到 <span class=\"katex-inline\">i<\/span> 位置，违例
