s=\"katex-inline\">O(n)<\/span> 针对“一次性从数组构造”。运行期每来一个元素插入一次，单次 <span class=\"katex-inline\">O(\\lg n)<\/span>，<span class=\"katex-inline\">n<\/span> 次仍是 <span class=\"katex-inline\">O(n\\lg n)<\/span>；不能把建堆结论搬到在线插入场景。建堆紧界不改变堆排序整体 <span class=\"katex-inline\">O(n\\lg n)<\/span>，提取阶段 <span class=\"katex-inline\">n-1<\/span> 轮修复不可省。<\/p>\n<h3>第二算例：7 个元素的分层计数<\/h3>\n<p>输入 <span class=\"katex-inline\">[5,3,8,1,9,2,7]<\/span>，<span class=\"katex-inline\">n=7<\/span>。内部结点下标 1–3，叶结点 4–7。<\/p>\n<ul><li>\n高度 0（叶）：4 个结点，单结点代价 <span class=\"katex-inline\">O(1)<\/span>，层成本 <span class=\"katex-inline\">O(4)<\/span>。\n<\/li><li>\n高度 1：结点 2、3，两个结点各修复至多 2 层，层成本 <span class=\"katex-inline\">O(4)<\/span>。\n<\/li><li>\n高度 2：结点 1，修复至多 3 层，层成本 <span class=\"katex-inline\">O(3)<\/span>。\n<\/ul>\n<p>总和 <span class=\"katex-inline\">O(4+4+3)=O(7)<\/span>，与 <span class=\"katex-inline\">n<\/span> 同阶。对照逐个插入路径代价：第 <span class=\"katex-inline\">k<\/span> 次插入向上至多 <span class=\"katex-inline\">\\lg k<\/span> 层，<span class=\"katex-inline\">n=7<\/span> 合计约 <span class=\"katex-inline\">0+1+1+2+2+2+2=10<\/span> 次比较，阶差随 <span class=\"katex-inline\">n<\/span> 拉大。<\/p>\n<h3>对抗性追问补充<\/h3>\n<p><strong>追问四：MAX-HEAPIFY 递归深度过大怎么办？<\/strong> 递归实现沿单路径调用，最坏深度 <span class=\"katex-inline\">\\lg n<\/span>；极端受限栈环境可改循环下调：比较父与两孩子，交换后下移，直到违例消除。修复路径不变。<\/p>\n<p><strong>追问五：堆能不能支持删除任意结点？<\/strong> 可以：把待删结点与堆末交换，下调堆大小，再对该位置执行 MAX-HEAPIFY 或向上修复（看交换后值偏大还是偏小）；代价 <span class=\"katex-inline\">O(\\lg n)<\/span>，不破坏堆序。<\/p>\n<h2>逐层推导补遗<\/h2>\n<h3>下标映射核验<\/h3>\n<p>数组 1 起编：父 <span class=\"katex-inline\">\\lfloor i/2\\rfloor<\/span>，左 <span class=\"katex-inline\">2i<\/span>，右 <span class=\"katex-inline\">2i+1<\/span>。<span class=\"katex-inline\">i=4<\/span>：父 2，左 8，右 9；<span class=\"katex-inline\">i=5<\/span>：父 2，左 10，右 11。完全二叉树按层填充，最后一层不满但左侧对齐；下标关系不依赖结点值。0 起编版本公式平移为父 <span class=\"katex-inline\">\\lfloor(i-1)/2\\rfloor<\/span>，结构分析一致。<\/p>\n<h3>建堆与逐个插入的路径对照<\/h3>\n<p>整体建堆从 <span class=\"katex-inline\">\\lfloor n/2\\rfloor<\/span> 向前调 MAX-HEAPIFY，修复方向向下；逐个插入把新结点放堆末，沿父链向上比较交换。前者按高度分层计数得 <span class=\"katex-inline\">O(n)<\/span>，后者每元素 <span class=\"katex-inline\">\\lg n<\/span> 层得 <span class=\"katex-inline\">O(n\\lg n)<\/span>。两条路径修复方向相反，成本口径不同。<\/p>\n<h3>堆排序代价分解<\/h3>\n<p>建堆 <span class=\"katex-inline\">O(n)<\/span>；提取阶段 <span class=\"katex-inline\">n-1<\/span> 轮，每轮堆顶与堆末交换、堆大小减 1、根处 MAX-HEAPIFY 下调路径，单次 <span class=\"katex-inline\">O(\\lg n)<\/span>，提取合计 <span class=\"katex-inline\">O(n\\lg n)<\/span>。整体 <span class=\"katex-inline\">O(n\\lg n)<\/span>，线性部分只在建堆。堆排序原地工作，额外空间 <span class=\"katex-inline\">O(1)<\/span>，最坏同阶。<\/p>\n<h3>堆序违反的两类位置<\/h3>\n<p>一是父小于孩子（最大堆），MAX-HEAPIFY 沿较大孩子下移；二是新插入结点大于父，沿父链上移。两类违例方向相反，修复算法分别对应下调与上调，终止条件都是局部堆序恢复。<\/p>\n<h2>边界与常见误读补充<\/h2>\n<p>建堆 <span class=\"katex-inline\">O(n)<\/span> 只对应一次性从数组构造；运行期逐个插入仍是 <span class=\"katex-inline\">O(n\\lg n)<\/span>，不能把建堆结论搬到在线场景。堆排序整体仍是 <span class=\"katex-inline\">O(n\\lg n)<\/span>，提取阶段 <span class=\"katex-inline\">n-1<\/span> 轮修复不可省。堆维护父子偏序，不支持按键搜索；找特定元素要遍历，与二叉搜索树的定位能力不同。把高度分布当成均匀分布，会高估建堆成本到 <span class=\"katex-inline\">O(n\\lg n)<\/span>。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出结点 <span class=\"katex-inline\">i<\/span> 的父、左孩子、右孩子下标公式。\n<\/li><li>\nMAX-HEAPIFY 进入调用时的假设是什么？每向下一层不变式怎样维持？\n<\/li><li>\n高度 <span class=\"katex-inline\">h<\/span> 结点个数上界为什么是 <span class=\"katex-inline\">n/2^{h+1}<\/span>？\n<\/li><li>\n级数 <span class=\"katex-inline\">\\sum_{h=0}^{\\infty} h/2^h<\/span> 的值是多少？它在建堆上界里起什么作用？\n<\/li><li>\n建堆 <span class=\"katex-inline\">O(n)<\/span> 与堆排序 <span class=\"katex-inline\">O(n\\lg n)<\/span> 分别对应算法的哪个阶段？\n<\/ol><\/div><\/details>", "c04": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.110<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">渐近记号：Θ、O、Ω 的定义差异与常见误用<\/a><\/span><\/div><h1>快速排序期望 O(n lg n)：指示变量法完整推导<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2 章（原书第 7 章 快速排序，PDF 第 110 页起；7.4.2 期望情况分析）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>快速排序选基准把数组划成小于、等于、大于基准三段，递归排序两侧。最坏划分每次切成 1 与 <span class=\"katex-inline\">n-1<\/span>，递归式退到 <span class=\"katex-inline\">\\Theta(n^2)<\/span>；固定基准还会被已有序输入针对。要说明随机化快排的平均表现，不能靠“大多数划分还行”的直觉，需要把比较次数拆成对每一对元素分别计数，再用期望求和。这个概念给出指示变量法的完整链条：先定义事件，再算事件概率，最后线性期望求和。<\/p>\n<h2>定义与符号逐项拆<\/h2>\n<p><strong>划分过程 PARTITION<\/strong>：取数组末元素（或随机元素）为基准 <span class=\"katex-inline\">x<\/span>，扫描区间，把小于 <span class=\"katex-inline\">x<\/span> 的换到左侧、大于 <span class=\"katex-inline\">x<\/span> 的换到右侧，返回基准最终位置 <span class=\"katex-inline\">q<\/span>。两侧子区间独立递归。<\/p>\n<p><strong>指示变量<\/strong>：对每一对下标 <span class=\"katex-inline\">i&amp;lt;j<\/span>，定义<\/p>\n<div class=\"katex-block\">X_{ij}=\\begin{cases}1,& i\\text{ 与 }j\\text{ 在某次划分中被直接比较},\\\\0,&\\text{否则}.\\end{cases}<\/div>\n<p><span class=\"katex-inline\">X_{ij}<\/span> 只取 0 或 1，其期望 <span class=\"katex-inline\">E[X_{ij}]=\\Pr(X_{ij}=1)<\/span>，即两元素被比较的概率。<\/p>\n<p><strong>总比较次数<\/strong>：<span class=\"katex-inline\">X=\\sum_{1\\le i&amp;lt;j\\le n}X_{ij}<\/span>。一次比较只涉及一对元素，总次数等于各对指示变量之和。<\/p>\n<h2>原理推导<\/h2>\n<h3>一对元素何时被比较<\/h3>\n<p>考虑元素 <span class=\"katex-inline\">i<\/span> 与 <span class=\"katex-inline\">j<\/span>（按排序后位置记，<span class=\"katex-inline\">i&amp;lt;j<\/span>）。在包含二者的最小子区间 <span class=\"katex-inline\">[i,j]<\/span> 上，若最先被选为基准的是 <span class=\"katex-inline\">i<\/span> 或 <span class=\"katex-inline\">j<\/span>，二者在该次划分直接相遇比较；若最先被选的是区间内其他元素 <span class=\"katex-inline\">k<\/span>（<span class=\"katex-inline\">i&amp;lt;k&amp;lt;j<\/span>），<span class=\"katex-inline\">k<\/span> 把区间切成左右两段，<span class=\"katex-inline\">i<\/span> 与 <span class=\"katex-inline\">j<\/span> 分属两段，此后递归不再跨段，二者永远不会比较。<\/p>\n<p>随机选基准时，<span class=\"katex-inline\">[i,j]<\/span> 内 <span class=\"katex-inline\">j-i+1<\/span> 个元素每个最先被选中的概率相等，<span class=\"katex-inline\">i<\/span> 或 <span class=\"katex-inline\">j<\/span> 最先的概率为<\/p>\n<div class=\"katex-block\">\\Pr(X_{ij}=1)=\\frac{2}{j-i+1}.<\/div>\n<h3>期望求和<\/h3>\n<p>由期望线性性：<\/p>\n<div class=\"katex-block\">E[X]=E\\!\\left[\\sum_{i&lt;j}X_{ij}\\right]=\\sum_{i&lt;j}E[X_{ij}]=\\sum_{i&lt;j}\\frac{2}{j-i+1}.<\/div>\n<p>令 <span class=\"katex-inline\">k=j-i<\/span>，对固定 <span class=\"katex-inline\">k<\/span>，满足 <span class=\"katex-inline\">j-i=k<\/span> 的元素对有 <span class=\"katex-inline\">n-k<\/span> 个：<\/p>\n<div class=\"katex-block\">E[X]=\\sum_{k=1}^{n-1}(n-k)\\frac{2}{k+1}\\le 2n\\sum_{k=1}^{n-1}\\frac{1}{k+1}.<\/div>\n<p>调和级数 <span class=\"katex-inline\">H_n=\\sum_{k=1}^{n}1/k=\\ln n+O(1)=\\Theta(\\lg n)<\/span>，因此上界 <span class=\"katex-inline\">E[X]\\le 2nH_n=2n\\ln n+O(n)<\/span>。换算成以 2 为底：<span class=\"katex-inline\">\\ln n=(\\ln 2)\\log_2 n\\approx0.693\\log_2 n<\/span>，故 <span class=\"katex-inline\">2n\\ln n\\approx1.39n\\log_2 n<\/span>，系数来自对数底换算，阶仍是 <span class=\"katex-inline\">O(n\\lg n)<\/span>。<\/p>\n<h3>最坏与最好对照<\/h3>\n<p>最好划分每次对半，递归式 <span class=\"katex-inline\">T(n)=2T(n/2)+\\Theta(n)<\/span>，解 <span class=\"katex-inline\">\\Theta(n\\lg n)<\/span>。最坏划分切出 1 与 <span class=\"katex-inline\">n-1<\/span>，<span class=\"katex-inline\">T(n)=T(n-1)+\\Theta(n)<\/span>，解 <span class=\"katex-inline\">\\Theta(n^2)<\/span>。随机化基准把“最坏输入”的针对性消掉：无论输入排列如何，基准选择是随机的，期望比较次数落在 <span class=\"katex-inline\">O(n\\lg n)<\/span>。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：基准在子区间内均匀随机选取；元素可两两比较；分析的是比较次数这一随机变量的期望。<\/p>\n<p>边界一：期望 <span class=\"katex-inline\">O(n\\lg n)<\/span> 不排除单次运行出现 <span class=\"katex-inline\">\\Theta(n^2)<\/span>。小概率的坏划分仍可能发生，只是期望被多数中等划分拉回。<\/p>\n<p>边界二：推导假设各元素互异；重复元素多的场景，三路划分把相等元素单独成段，比较次数另行估计。<\/p>\n<p>边界三：期望分析不替代最坏界。若运行环境不允许任何长尾巴，需要看最坏保证，不能用期望辩护。<\/p>\n<p>失败案例：把期望 <span class=\"katex-inline\">O(n\\lg n)<\/span> 说成“快排一定 <span class=\"katex-inline\">n\\lg n<\/span>”，忽略最坏 <span class=\"katex-inline\">\\Theta(n^2)<\/span>；或反过来，因存在最坏划分就断言快排不可用，忽略随机化后期望阶。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>期望 vs 最坏情况<\/strong>：最坏界对每个输入成立；期望界对随机基准的所有随机源取平均。两者口径不同，排序算法比较时常并列给出。\n<\/li><li>\n<strong>指示变量法 vs 直接数比较轮次<\/strong>：直接按递归树估比较次数要处理划分位置分布；指示变量把全局计数拆成两两事件，概率只依赖区间长度，求和路径清晰。\n<\/li><li>\n<strong>快排 vs 归并<\/strong>：归并合并阶段线性、拆分对半，最坏也是 <span class=\"katex-inline\">O(n\\lg n)<\/span>；快排原地交换、缓存友好，但最坏退化。两者递归式外形相似，子问题平衡性来源不同。\n<\/li><li>\n<strong>概率分析 vs 随机算法<\/strong>：概率分析假定输入分布随机；随机算法的随机性来自算法本身的基准抽取，输入可以是固定的。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的阶语言陈述 <span class=\"katex-inline\">O(n\\lg n)<\/span> 与 <span class=\"katex-inline\">\\Theta(n^2)<\/span>。后继：概念 c05 决策树下界说明任何比较排序低不过 <span class=\"katex-inline\">\\Omega(n\\lg n)<\/span>，快排期望恰好达到该下界的同阶；第 4 章概念 c11 的交换论证与本章概率推导都在处理“局部选择如何影响全局代价”。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（快速排序期望 O(n lg n)：指示变量法完整推导）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：划分过程、指示变量概率与期望求和核验<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要推出随机快排期望 <span class=\"katex-inline\">O(n\\lg n)<\/span>，先往回追四层：<\/p>\n<ol><li>\n<strong>比较次数是全局计数，直接按递归树难算<\/strong>。划分位置随基准变化，递归树形状不固定，逐层写成本求和会卡在分布上。换个角度：每次比较只涉及一对元素，全局次数等于各对“是否被比较”的指示变量之和。\n<\/li><li>\n<strong>指示变量把计数问题变成概率问题<\/strong>。<span class=\"katex-inline\">X_{ij}\\in\\{0,1\\}<\/span>，期望等于事件概率；期望线性性不要求变量独立，这是拆分能成立的关键。\n<\/li><li>\n<strong>两元素比较与否，取决于包含它们的区间上谁先当基准<\/strong>。区间内其他基准一旦把二者分到两侧，后续递归不再跨段；只有端点元素先被选中，二者才会直接相遇。\n<\/li><li>\n<strong>概率只依赖区间长度<\/strong>：<span class=\"katex-inline\">[i,j]<\/span> 共 <span class=\"katex-inline\">j-i+1<\/span> 个元素，端点占 2 个，概率 <span class=\"katex-inline\">2/(j-i+1)<\/span>。再对所有元素对求和，调和级数给出对数因子。\n<\/ol>\n<p>依赖链方向：全局比较次数 → 拆成对指示变量 → 事件概率归约到区间首基准 → 概率 <span class=\"katex-inline\">2/(j-i+1)<\/span> → 按区间长度求和 → 调和级数得 <span class=\"katex-inline\">O(n\\lg n)<\/span>。<\/p>\n<h2>正向推导：划分与概率链条<\/h2>\n<h3>一轮划分的状态推演<\/h3>\n<p>数组区间 <span class=\"katex-inline\">[p,r]<\/span>，基准 <span class=\"katex-inline\">x=A[r]<\/span>。指针 <span class=\"katex-inline\">i<\/span> 记录小于 <span class=\"katex-inline\">x<\/span> 段的末尾，扫描指针 <span class=\"katex-inline\">j<\/span> 从 <span class=\"katex-inline\">p<\/span> 到 <span class=\"katex-inline\">r-1<\/span>：<\/p>\n<ul><li>\n若 <span class=\"katex-inline\">A[j]\\le x<\/span>，<span class=\"katex-inline\">i<\/span> 加 1，交换 <span class=\"katex-inline\">A[i]<\/span> 与 <span class=\"katex-inline\">A[j]<\/span>；\n<\/li><li>\n若 <span class=\"katex-inline\">A[j]&amp;gt;x<\/span>，跳过。\n<\/ul>\n<p>扫描结束后交换 <span class=\"katex-inline\">A[i+1]<\/span> 与 <span class=\"katex-inline\">A[r]<\/span>，基准落到 <span class=\"katex-inline\">q=i+1<\/span>。结果：<span class=\"katex-inline\">[p,q-1]<\/span> 元素不大于 <span class=\"katex-inline\">x<\/span>，<span class=\"katex-inline\">[q+1,r]<\/span> 元素不小于 <span class=\"katex-inline\">x<\/span>。<\/p>\n<h3>指示变量定义与期望<\/h3>\n<p>对排序后第 <span class=\"katex-inline\">i<\/span> 小与第 <span class=\"katex-inline\">j<\/span> 小的元素（<span class=\"katex-inline\">i&amp;lt;j<\/span>），<span class=\"katex-inline\">X_{ij}=1<\/span> 当二者某次划分直接比较。<span class=\"katex-inline\">E[X_{ij}]=\\Pr(X_{ij}=1)<\/span>。<\/p>\n<h3>概率推导<\/h3>\n<p>在区间 <span class=\"katex-inline\">[i,j]<\/span> 上考察第一次基准抽取。三种情况：<\/p>\n<ul><li>\n抽到 <span class=\"katex-inline\">i<\/span>：<span class=\"katex-inline\">i<\/span> 与 <span class=\"katex-inline\">j<\/span> 在本划分比较，<span class=\"katex-inline\">X_{ij}=1<\/span>。\n<\/li><li>\n抽到 <span class=\"katex-inline\">j<\/span>：<span class=\"katex-inline\">i<\/span> 与 <span class=\"katex-inline\">j<\/span> 在本划分比较，<span class=\"katex-inline\">X_{ij}=1<\/span>。\n<\/li><li>\n抽到 <span class=\"katex-inline\">k<\/span>，<span class=\"katex-inline\">i&amp;lt;k&amp;lt;j<\/span>：<span class=\"katex-inline\">k<\/span> 作基准后，<span class=\"katex-inline\">i<\/span> 落入左段、<span class=\"katex-inline\">j<\/span> 落入右段，两段递归独立，<span class=\"katex-inline\">i,j<\/span> 永不再比，<span class=\"katex-inline\">X_{ij}=0<\/span>。\n<\/ul>\n<p>随机基准下区间内每个元素先被抽中的概率 <span class=\"katex-inline\">1/(j-i+1)<\/span>，两种端点情况合计 <span class=\"katex-inline\">2/(j-i+1)<\/span>。<\/p>\n<h3>期望求和展开<\/h3>\n<div class=\"katex-block\">E[X]=\\sum_{1\\le i&lt;j\\le n}\\frac{2}{j-i+1}.<\/div>\n<p>令 <span class=\"katex-inline\">k=j-i<\/span>。<span class=\"katex-inline\">k<\/span> 固定时，<span class=\"katex-inline\">i<\/span> 可取 <span class=\"katex-inline\">1,\\dots,n-k<\/span>，共 <span class=\"katex-inline\">n-k<\/span> 对：<\/p>\n<div class=\"katex-block\">E[X]=\\sum_{k=1}^{n-1}\\frac{2(n-k)}{k+1}.<\/div>\n<p>上界放大：<span class=\"katex-inline\">n-k\\le n<\/span>，<\/p>\n<div class=\"katex-block\">E[X]\\le 2n\\sum_{k=1}^{n-1}\\frac{1}{k+1}=2n(H_n-1)=O(n\\lg n).<\/div>\n<p>调和级数核验：<span class=\"katex-inline\">H_n=1+1/2+\\dots+1/n<\/span>，积分比较 <span class=\"katex-inline\">H_n\\le 1+\\int_1^n dx/x=1+\\ln n<\/span>，故 <span class=\"katex-inline\">H_n=\\Theta(\\lg n)<\/span>。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：<span class=\"katex-inline\">n=4<\/span> 各元素对的比较概率<\/h3>\n<p>四对区间长度：<\/p>\n<ul><li>\n<span class=\"katex-inline\">(1,2)<\/span>：长度 2，概率 <span class=\"katex-inline\">2/2=1<\/span>。相邻两元素在某层必被比较一次。\n<\/li><li>\n<span class=\"katex-inline\">(2,3)<\/span>：长度 2，概率 1。\n<\/li><li>\n<span class=\"katex-inline\">(3,4)<\/span>：长度 2，概率 1。\n<\/li><li>\n<span class=\"katex-inline\">(1,3)<\/span>：长度 3，概率 <span class=\"katex-inline\">2/3<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">(2,4)<\/span>：长度 3，概率 <span class=\"katex-inline\">2/3<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">(1,4)<\/span>：长度 4，概率 <span class=\"katex-inline\">2/4=1/2<\/span>。\n<\/ul>\n<p>期望比较次数 <span class=\"katex-inline\">E[X]=1+1+1+2/3+2/3+1/2=4.83<\/span>。对照最坏 <span class=\"katex-inline\">T(4)=T(3)+T(1)+4<\/span> 递推得 9 次量级，期望明显偏低。<\/p>\n<h3>算例 2：一轮划分的具体状态<\/h3>\n<p>输入 <span class=\"katex-inline\">[8,3,1,7,5]<\/span>，基准取末位 5。<\/p>\n<ul><li>\n<span class=\"katex-inline\">j=2<\/span>，<span class=\"katex-inline\">A[2]=3\\le5<\/span>，<span class=\"katex-inline\">i=1<\/span>，交换 <span class=\"katex-inline\">A[1],A[2]<\/span>：<span class=\"katex-inline\">[3,8,1,7,5]<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">j=3<\/span>，<span class=\"katex-inline\">A[3]=1\\le5<\/span>，<span class=\"katex-inline\">i=2<\/span>，交换 <span class=\"katex-inline\">A[2],A[3]<\/span>：<span class=\"katex-inline\">[3,1,8,7,5]<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">j=4<\/span>，<span class=\"katex-inline\">A[4]=7&amp;gt;5<\/span>，跳过。\n<\/li><li>\n扫描结束，<span class=\"katex-inline\">i=2<\/span>，交换 <span class=\"katex-inline\">A[3]<\/span> 与 <span class=\"katex-inline\">A[5]<\/span>：<span class=\"katex-inline\">[3,1,5,7,8]<\/span>。\n<\/ul>\n<p>基准 5 落到位置 3，左段 <span class=\"katex-inline\">[3,1]<\/span>，右段 <span class=\"katex-inline\">[7,8]<\/span>，两侧递归。<\/p>\n<h3>算例 3：不同划分的递归式对照<\/h3>\n<p>对半划分：<span class=\"katex-inline\">T(n)=2T(n/2)+cn<\/span>，递归树每层 <span class=\"katex-inline\">cn<\/span>，共 <span class=\"katex-inline\">\\lg n<\/span> 层，<span class=\"katex-inline\">T(n)=c n\\lg n<\/span>。 最坏划分：<span class=\"katex-inline\">T(n)=T(n-1)+cn<\/span>，展开 <span class=\"katex-inline\">cn+c(n-1)+\\dots+c=\\Theta(n^2)<\/span>。 随机划分介于两者之间，期望求和给出 <span class=\"katex-inline\">O(n\\lg n)<\/span>。<\/p>\n<h2>对抗性追问<\/h2>\n<p><strong>追问一：指示变量之间不独立，期望线性性还能用吗？<\/strong> 能用。<span class=\"katex-inline\">E[\\sum X_{ij}]=\\sum E[X_{ij}]<\/span> 对任意随机变量成立，不要求独立。独立性只在算联合分布时才需要，本推导避开了联合分布。<\/p>\n<p><strong>追问二：为什么不能直接说“相邻元素必比较，远的元素少比较”？<\/strong> 定性方向对，但没有概率量化就得不到 <span class=\"katex-inline\">n\\lg n<\/span> 阶。指示变量把“少比较”写成 <span class=\"katex-inline\">2/(j-i+1)<\/span>，区间越长概率越小，求和后对数因子才落得下来。<\/p>\n<p><strong>追问三：重复元素很多时概率推导要改哪里？<\/strong> 大量相等元素让二路划分失衡或退化；三路划分把相等元素单独成段，<span class=\"katex-inline\">X_{ij}<\/span> 的事件定义要按相等/不等分别处理，期望界随划分策略变化。<\/p>\n<h2>延伸推演：划分不变式、随机化口径与递归式对照<\/h2>\n<h3>划分过程的不变式<\/h3>\n<p>扫描指针 <span class=\"katex-inline\">j<\/span> 之后、小于基准段末尾指针 <span class=\"katex-inline\">i<\/span> 之前的元素，均不大于基准；<span class=\"katex-inline\">i<\/span> 之后到 <span class=\"katex-inline\">j<\/span> 之前的元素均不小于基准。扫描结束交换基准到分界点，三段次序固定。不变式保证划分不重不漏，两侧子数组可独立递归。<\/p>\n<h3>随机化算法与概率分析的区别<\/h3>\n<p>概率分析假设输入按某分布随机，算法本身确定；随机算法把随机性放在基准抽取上，输入可以固定。随机快排的期望对所有输入排列成立，随机源是算法选基准的动作；分析时对随机源取期望，不依赖输入分布。<\/p>\n<h3>最好、最坏、期望三条递归式<\/h3>\n<p>最好对半：<span class=\"katex-inline\">T(n)=2T(n/2)+cn<\/span>，递归树每层 <span class=\"katex-inline\">cn<\/span>，<span class=\"katex-inline\">\\lg n<\/span> 层，<span class=\"katex-inline\">\\Theta(n\\lg n)<\/span>。最坏切 1 与 <span class=\"katex-inline\">n-1<\/span>：<span class=\"katex-inline\">T(n)=T(n-1)+cn<\/span>，展开 <span class=\"katex-inline\">cn+c(n-1)+\\dots+c=\\Theta(n^2)<\/span>。期望情形经指示变量求和落 <span class=\"katex-inline\">O(n\\lg n)<\/span>。三者口径不同：最好是最优输入，最坏是最劣输入，期望是随机基准下的平均。<\/p>\n<h3>第二算例：<span class=\"katex-inline\">n=5<\/span> 的比较概率与期望<\/h3>\n<p>五对元素：<\/p>\n<ul><li>\n相邻对 <span class=\"katex-inline\">(1,2),(2,3),(3,4),(4,5)<\/span>：区间长 2，概率 1，共 4。\n<\/li><li>\n间隔一对 <span class=\"katex-inline\">(1,3),(2,4),(3,5)<\/span>：区间长 3，概率 <span class=\"katex-inline\">2/3<\/span>，共 2。\n<\/li><li>\n间隔两对 <span class=\"katex-inline\">(1,4),(2,5)<\/span>：区间长 4，概率 <span class=\"katex-inline\">1/2<\/span>，共 1。\n<\/li><li>\n端点对 <span class=\"katex-inline\">(1,5)<\/span>：区间长 5，概率 <span class=\"katex-inline\">2/5=0.4<\/span>。\n<\/ul>\n<p>期望 <span class=\"katex-inline\">E[X]=4+2\\cdot(2/3)+2\\cdot(1/2)+0.4=4+1.33+1+0.4=6.73<\/span>。最坏链式划分比较次数 <span class=\"katex-inline\">4+3+2+1=10<\/span>，期望明显偏低。<\/p>\n<h3>有序输入上的退化路径<\/h3>\n<p>输入 <span class=\"katex-inline\">[1,2,3,4,5]<\/span>，基准固定取首元素：第一次切出 <span class=\"katex-inline\">\\{1\\}<\/span> 与 <span class=\"katex-inline\">[2,3,4,5]<\/span>；第二次在 <span class=\"katex-inline\">[2,3,4,5]<\/span> 切出 <span class=\"katex-inline\">\\{2\\}<\/span> 与 <span class=\"katex-inline\">[3,4,5]<\/span>；递归式 <span class=\"katex-inline\">T(n)=T(n-1)+\\Theta(n)<\/span>，展开 <span class=\"katex-inline\">\\Theta(n^2)<\/span>。随机基准把这种针对性最坏消除：无论输入次序，基准等概率落在区间内。<\/p>\n<h3>对抗性追问补充<\/h3>\n<p><strong>追问四：指示变量为什么按排序后位置编号，而不是输入下标？<\/strong> 概率只依赖两元素在有序区间中的相对位置；按输入下标编号会混入排列次序，区间长度关系不易写。排序后第 <span class=\"katex-inline\">i<\/span>、<span class=\"katex-inline\">j<\/span> 小的元素，其共同区间就是 <span class=\"katex-inline\">[i,j]<\/span>。<\/p>\n<p><strong>追问五：重复元素多时三路划分改变什么？<\/strong> 相等元素单独成段，避免二路划分把等值元素在两侧反复搬运；<span class=\"katex-inline\">X_{ij}<\/span> 的事件要按不等关系重新定义，期望界随策略变化。<\/p>\n<h2>逐层推导补遗<\/h2>\n<h3>期望线性性不挑独立性<\/h3>\n<p><span class=\"katex-inline\">E[\\sum X_{ij}]=\\sum E[X_{ij}]<\/span> 对任意随机变量成立，联合分布无需知道。这是指示变量法能绕开两两比较联合概率的关键；只有算联合事件概率时才需独立性假设。本推导全程不涉及 <span class=\"katex-inline\">X_{ij}<\/span> 之间是否独立。<\/p>\n<h3>概率 <span class=\"katex-inline\">2/(j-i+1)<\/span> 的来源复查<\/h3>\n<p>区间 <span class=\"katex-inline\">[i,j]<\/span> 共 <span class=\"katex-inline\">j-i+1<\/span> 个元素，随机基准等概率被抽中。两端点 <span class=\"katex-inline\">i,j<\/span> 先被抽中则直接比较，占 2 个名额；内部元素先被抽中则把两侧分开，二者永不再遇。分子 2 是端点个数，分母是区间长度，概率随区间变长递减。<\/p>\n<h3>求和式的阶估计<\/h3>\n<p><span class=\"katex-inline\">E[X]=\\sum_{k=1}^{n-1}(n-k)\\cdot 2/(k+1)\\le 2n\\sum_{k=1}^{n-1}1/(k+1)<\/span>。调和级数 <span class=\"katex-inline\">H_n=\\Theta(\\lg n)<\/span>，积分核验：<span class=\"katex-inline\">H_n\\le 1+\\int_1^n dx/x=1+\\ln n<\/span>，下界 <span class=\"katex-inline\">H_n\\ge\\int_1^{n+1}dx/x=\\ln(n+1)<\/span>，故 <span class=\"katex-inline\">H_n=\\Theta(\\lg n)<\/span>。代入得 <span class=\"katex-inline\">E[X]=O(n\\lg n)<\/span>。<\/p>\n<h3>对数底换算与系数<\/h3>\n<p>上界 <span class=\"katex-inline\">E[X]\\le 2nH_n<\/span>，而 <span class=\"katex-inline\">H_n=\\ln n+O(1)<\/span>，故主项为 <span class=\"katex-inline\">2n\\ln n<\/span>。换成以 2 为底：<span class=\"katex-inline\">\\ln n=(\\ln 2)\\log_2 n<\/span>，<span class=\"katex-inline\">\\ln 2\\approx0.693<\/span>，系数 <span class=\"katex-inline\">2\\cdot0.693\\approx1.39<\/span>，即 <span class=\"katex-inline\">2n\\ln n\\approx1.39n\\log_2 n<\/span>。该系数只是同一阶的常数折算，不改变 <span class=\"katex-inline\">O(n\\lg n)<\/span> 的阶；换算前后调和级数本身的对数阶不变。若把自然对数底数写成 2，系数会跟着变，比较不同来源的快排比较次数上界时先核对对数底。<\/p>\n<h3>三条递归式的适用前提<\/h3>\n<p>对半划分 <span class=\"katex-inline\">T(n)=2T(n/2)+cn<\/span>：子问题等大，最坏也 <span class=\"katex-inline\">O(n\\lg n)<\/span>。单边划分 <span class=\"katex-inline\">T(n)=T(n-1)+cn<\/span>：链状退化，<span class=\"katex-inline\">\\Theta(n^2)<\/span>。随机划分期望介于两者之间，期望界由概率求和得到，不保证单次不退化。<\/p>\n<h3>随机化基准的落点<\/h3>\n<p>随机性在算法选基准的动作上，输入排列可以固定。分析对所有输入取随机源期望；这与“假设输入随机”的概率分析不同，后者随机源在输入侧。<\/p>\n<h2>边界与常见误读补充<\/h2>\n<p>期望 <span class=\"katex-inline\">O(n\\lg n)<\/span> 不排除单次运行出现 <span class=\"katex-inline\">\\Theta(n^2)<\/span>，小概率坏划分仍可能发生；期望界辩护整体平均，不承诺单次实时表现。重复元素占比高时二路划分失衡，需三路划分把相等元素单独成段。指示变量按排序后位置编号，概率只依赖共同区间长度；混输入下标会把区间关系写乱。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出指示变量 <span class=\"katex-inline\">X_{ij}<\/span> 的取值定义与期望含义。\n<\/li><li>\n两元素在什么情况下永远不会被比较？用区间首基准解释。\n<\/li><li>\n概率 <span class=\"katex-inline\">2/(j-i+1)<\/span> 中的分子 2 与分母 <span class=\"katex-inline\">j-i+1<\/span> 各来自什么？\n<\/li><li>\n期望求和怎样从双重求和化成按 <span class=\"katex-inline\">k=j-i<\/span> 的单重求和？\n<\/li><li>\n期望 <span class=\"katex-inline\">O(n\\lg n)<\/span> 为什么不排除某次运行出现 <span class=\"katex-inline\">\\Theta(n^2)<\/span>？\n<\/ol><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.122<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">渐近记号：Θ、O、Ω 的定义差异与常见误用<\/a><\/span><\/div><h1>比较排序的下界 Ω(n lg n)：决策树论证<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书第 8 章 8.1 节 排序算法的下界，PDF 第 122 页起）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>堆排序、归并排序、快速排序都落在 <span class=\"katex-inline\">O(n\\lg n)<\/span> 附近，自然要问：比较排序能不能再快，比如做到线性？决策树模型给出回答：任何只通过两两比较决定顺序的算法，最坏比较次数低不过 <span class=\"katex-inline\">\\Omega(n\\lg n)<\/span>。这条下界是问题对算法的约束，不是某个具体算法的缺陷；它也划出了计数、基数等非比较排序必须绕开的限制。<\/p>\n<h2>定义与符号逐项拆<\/h2>\n<p><strong>决策树<\/strong>：二叉树，用来刻画一个比较排序算法在所有输入上的执行过程。<\/p>\n<ul><li>\n每个<strong>内部结点<\/strong>写一次比较，形如“<span class=\"katex-inline\">A[i]<\/span> 与 <span class=\"katex-inline\">A[j]<\/span> 谁大”；左支对应不大于，右支对应大于。\n<\/li><li>\n每个<strong>叶结点<\/strong>写一种最终排列，即输入经过算法排序后的结果顺序。\n<\/li><li>\n给定一个输入，算法从根结点出发，按比较结果走分支，到达某片叶；不同输入走到不同叶。\n<\/ul>\n<p><strong>树高 <span class=\"katex-inline\">h<\/span><\/strong>：从根到最深叶的边数；算法在最坏输入上的比较次数等于该树高。<span class=\"katex-inline\">n<\/span> 个元素的排列共 <span class=\"katex-inline\">n!<\/span> 种，决策树必须为每种排列留一片叶，否则有两种输入走到同一叶、无法区分。<\/p>\n<h2>原理推导<\/h2>\n<h3>叶数约束<\/h3>\n<p>高为 <span class=\"katex-inline\">h<\/span> 的二叉树最多有 <span class=\"katex-inline\">2^h<\/span> 片叶（每层节点数翻倍，叶层不超过 <span class=\"katex-inline\">2^h<\/span>）。树要容纳 <span class=\"katex-inline\">n!<\/span> 片叶，因此<\/p>\n<div class=\"katex-block\">2^h\\ge n!.<\/div>\n<p>两端取以 2 为底对数：<span class=\"katex-inline\">h\\ge \\lg(n!)<\/span>。<\/p>\n<h3>把 <span class=\"katex-inline\">\\lg(n!)<\/span> 估成 <span class=\"katex-inline\">\\Omega(n\\lg n)<\/span><\/h3>\n<div class=\"katex-block\">\\lg(n!)=\\sum_{k=1}^{n}\\lg k.<\/div>\n<p>放大下界：只取后半段 <span class=\"katex-inline\">k=\\lceil n/2\\rceil,\\dots,n<\/span>，共约 <span class=\"katex-inline\">n/2<\/span> 项，每项 <span class=\"katex-inline\">\\lg k\\ge \\lg(n/2)<\/span>：<\/p>\n<div class=\"katex-block\">\\lg(n!)\\ge \\frac{n}{2}\\lg\\frac{n}{2}=\\Omega(n\\lg n).<\/div>\n<p>于是 <span class=\"katex-inline\">h\\ge\\Omega(n\\lg n)<\/span>。任一比较排序在最坏输入上走到最深叶，比较次数不低于树高，故最坏比较次数 <span class=\"katex-inline\">\\Omega(n\\lg n)<\/span>。<\/p>\n<h3>平均情况的位置<\/h3>\n<p>决策树同样约束平均路径长度：<span class=\"katex-inline\">n!<\/span> 片叶的二叉树，平均深度的阶仍是 <span class=\"katex-inline\">\\Omega(\\lg(n!))=\\Omega(n\\lg n)<\/span>。平均快于该下界的比较排序同样不存在；堆排序、归并排序最坏 <span class=\"katex-inline\">O(n\\lg n)<\/span>，与下界同阶，达到比较排序的最优渐近阶。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：排序过程的决策依据是两个元素的大小比较；算法不读取键的数值范围、位数或分布结构。<\/p>\n<p>边界一：下界不约束非比较排序。计数排序按值落桶、基数排序按位分配，决策树的内部结点（一次比较）在这些算法里不存在，模型不覆盖。<\/p>\n<p>边界二：下界说的是比较次数。非比较排序可能在辅助空间、键类型假设上付出代价；绕过下界不是免费的。<\/p>\n<p>边界三：若输入有特殊结构（近乎有序、取值受限），专门算法可以利用结构降低比较次数；下界针对任意输入上的最坏保证。<\/p>\n<p>失败案例：用决策树给基数排序套下界，得到“基数排序也 <span class=\"katex-inline\">\\Omega(n\\lg n)<\/span>”的错误结论；模型前提是比较结点，基数排序没有该环节。反过来，见到 <span class=\"katex-inline\">O(n)<\/span> 排序就声称打破下界，要先核对它是否利用了键的取值范围。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>下界 vs 上界<\/strong>：上界描述某算法最多花多少，下界证明所有算法至少花多少；<span class=\"katex-inline\">\\Omega(n\\lg n)<\/span> 是比较排序的集体下限，<span class=\"katex-inline\">O(n\\lg n)<\/span> 是归并/堆排序的个体上限。两者同阶意味着比较排序达到最优渐近阶。\n<\/li><li>\n<strong>决策树 vs 递归树<\/strong>：递归树分析单个算法的递归代价分层；决策树抽象所有比较排序的比较结构，用来证下界。树外形相似，用途不同。\n<\/li><li>\n<strong>最坏比较次数 vs 运行时间<\/strong>：下界针对比较操作次数；移动元素、交换、扫描的代价另计，运行时间下界要在比较次数下界之外再看其他操作。\n<\/li><li>\n<strong>比较模型 vs 代数决策树<\/strong>：本模型内部结点只做二元比较；允许算术运算的更强模型有各自不同的下界结论。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 用 Ω 记号陈述下界阶。后继：概念 c06 计数/基数排序说明非比较手段怎样绕开该下界；概念 c04 快排期望 <span class=\"katex-inline\">O(n\\lg n)<\/span> 与本下界同阶。第 4 章 NP 完全性讨论问题层面对多项式算法的障碍，与本章对比较次数的障碍同属“问题约束算法”的论证思路。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（比较排序的下界 Ω(n lg n)：决策树论证）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：决策树建模、叶数约束与阶估计<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要证比较排序下界，先往回追四层：<\/p>\n<ol><li>\n<strong>比较排序的所有决策都来自两两比较<\/strong>。算法在每一步选两个元素比大小，按结果分叉；把所有可能输入的分叉路径画出来，就是一棵二叉树。\n<\/li><li>\n<strong>每种排列必须对应一片可区分的叶<\/strong>。两个不同排列若走到同一片叶，算法在两种输入上输出相同，至少有一种排序错误。因此叶数不少于排列数 <span class=\"katex-inline\">n!<\/span>。\n<\/li><li>\n<strong>二叉树叶数受高度约束<\/strong>。高 <span class=\"katex-inline\">h<\/span> 的二叉树叶层最多 <span class=\"katex-inline\">2^h<\/span> 片，叶多就要求树高足够；反解出 <span class=\"katex-inline\">h\\ge\\lg(n!)<\/span>。\n<\/li><li>\n<strong><span class=\"katex-inline\">\\lg(n!)<\/span> 的阶是 <span class=\"katex-inline\">n\\lg n<\/span><\/strong>。取乘积后半段放大，得到线性乘对数的下界；这一步把排列数的阶翻译成比较次数的阶。\n<\/ol>\n<p>依赖链方向：比较分叉 → 决策树 → 叶数 ≥ <span class=\"katex-inline\">n!<\/span> → <span class=\"katex-inline\">2^h\\ge n!<\/span> → <span class=\"katex-inline\">h\\ge\\lg(n!)<\/span> → <span class=\"katex-inline\">\\lg(n!)=\\Omega(n\\lg n)<\/span>。<\/p>\n<h2>正向推导：模型建立到不等式链条<\/h2>\n<h3>决策树怎样刻画算法<\/h3>\n<p>树的内部结点编号对应一次比较：结点 <span class=\"katex-inline\">(i,j)<\/span> 比较元素 <span class=\"katex-inline\">i,j<\/span>。输入沿分支下行：比较结果为左支走左，为右支走右。到达叶时叶上标注该输入的输出排列。同一算法在不同输入上的路径共享前缀，合并成一棵树。<\/p>\n<h3>叶数与树高关系<\/h3>\n<p>高度 <span class=\"katex-inline\">h<\/span> 的满二叉树：第 0 层 1 节点，第 1 层 2，……，第 <span class=\"katex-inline\">h<\/span> 层 <span class=\"katex-inline\">2^h<\/span>；叶结点只出现在最深层时叶数最大，为 <span class=\"katex-inline\">2^h<\/span>。任何二叉树叶数不超过 <span class=\"katex-inline\">2^h<\/span>。<\/p>\n<p>算法必须区分 <span class=\"katex-inline\">n!<\/span> 种排列，树至少 <span class=\"katex-inline\">n!<\/span> 片叶：<\/p>\n<div class=\"katex-block\">2^h\\ge n!\\quad\\Longrightarrow\\quad h\\ge\\lg(n!).<\/div>\n<h3><span class=\"katex-inline\">\\lg(n!)<\/span> 阶估计<\/h3>\n<div class=\"katex-block\">\\lg(n!)=\\lg(1\\cdot2\\cdots n)=\\sum_{k=1}^{n}\\lg k.<\/div>\n<p>取下半区间放缩：<span class=\"katex-inline\">k<\/span> 从 <span class=\"katex-inline\">\\lceil n/2\\rceil<\/span> 到 <span class=\"katex-inline\">n<\/span>，共 <span class=\"katex-inline\">n-\\lceil n/2\\rceil+1\\ge n/2<\/span> 项，每项 <span class=\"katex-inline\">\\lg k\\ge\\lg(n/2)<\/span>：<\/p>\n<div class=\"katex-block\">\\lg(n!)\\ge\\sum_{k=\\lceil n/2\\rceil}^{n}\\lg k\\ge \\frac{n}{2}\\lg\\frac{n}{2}.<\/div>\n<p>展开 <span class=\"katex-inline\">\\lg(n/2)=\\lg n-1<\/span>，得 <span class=\"katex-inline\">(n/2)\\lg n-n/2<\/span>，主项 <span class=\"katex-inline\">(n/2)\\lg n<\/span>，故 <span class=\"katex-inline\">\\lg(n!)=\\Omega(n\\lg n)<\/span>。<\/p>\n<p>上界对照：<span class=\"katex-inline\">\\lg(n!)\\le n\\lg n<\/span>，所以 <span class=\"katex-inline\">\\lg(n!)=\\Theta(n\\lg n)<\/span>。下界论证用的是下半段放大，上界来自每项不超过 <span class=\"katex-inline\">\\lg n<\/span>。<\/p>\n<h3>最坏与平均路径<\/h3>\n<p>最坏输入走到最深叶，比较次数树高。平均路径长度：<span class=\"katex-inline\">n!<\/span> 片叶的二叉树，按叶深平均；平衡树平均深 <span class=\"katex-inline\">\\lg n<\/span> 量级，任何树的平均深度仍 <span class=\"katex-inline\">\\Omega(\\lg(n!))<\/span>，叶数约束对平均路径同样成立。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：<span class=\"katex-inline\">n=3<\/span> 的决策树<\/h3>\n<p>三个元素排列共 <span class=\"katex-inline\">3!=6<\/span> 种。高 <span class=\"katex-inline\">h<\/span> 二叉树叶数上限 <span class=\"katex-inline\">2^h<\/span>：<span class=\"katex-inline\">h=2<\/span> 最多 4 叶，放不下 6 种；<span class=\"katex-inline\">h=3<\/span> 最多 8 叶，可以容纳。故 <span class=\"katex-inline\">n=3<\/span> 时最坏比较次数至少 3。实际插入排序对逆序三元组比较 3 次，归并排序同量级。<\/p>\n<h3>算例 2：<span class=\"katex-inline\">n=4<\/span> 的叶数与高度<\/h3>\n<p><span class=\"katex-inline\">4!=24<\/span>。<span class=\"katex-inline\">2^4=16&amp;lt;24<\/span>，<span class=\"katex-inline\">2^5=32\\ge24<\/span>，树高至少 5。<span class=\"katex-inline\">\\lg 24\\approx4.585<\/span>，取整高度 5。代入阶估计：<span class=\"katex-inline\">(4/2)\\lg(4/2)=2\\cdot1=2<\/span>，<span class=\"katex-inline\">\\Omega(4\\lg 4)=8<\/span> 的宽松下界方向一致；小样本取整偏差大，渐近阶由大 <span class=\"katex-inline\">n<\/span> 决定。<\/p>\n<h3>算例 3：排列数增长速度<\/h3>\n<p><span class=\"katex-inline\">n=10<\/span>，<span class=\"katex-inline\">10!=3.6\\times10^6<\/span>，<span class=\"katex-inline\">\\lg(10!)\\approx21.8<\/span>；<span class=\"katex-inline\">n=20<\/span>，<span class=\"katex-inline\">20!\\approx2.4\\times10^{18}<\/span>，<span class=\"katex-inline\">\\lg(20!)\\approx61.1<\/span>。比值 <span class=\"katex-inline\">\\lg(n!)/n\\lg n<\/span>：<span class=\"katex-inline\">n=10<\/span> 为 <span class=\"katex-inline\">21.8/33.2=0.66<\/span>，<span class=\"katex-inline\">n=20<\/span> 为 <span class=\"katex-inline\">61.1/86.4=0.71<\/span>，随 <span class=\"katex-inline\">n<\/span> 增大趋于 1，与 <span class=\"katex-inline\">\\Theta(n\\lg n)<\/span> 一致。<\/p>\n<h2>对抗性追问<\/h2>\n<p><strong>追问一：决策树会不会有内部结点不做比较、直接给结论？<\/strong> 若某内部结点不比较就分叉，分叉依据缺失，等价于把两种输入混在一支；这种结点不能帮助区分排列，树模型仍以比较结点为内部结点主体。<\/p>\n<p><strong>追问二：下界为什么管不住堆排序以外的“聪明”比较算法？<\/strong> 管得住。论证不依赖算法名字或策略，只要求决策依据是二元比较；任何比较排序都落入同一棵决策树模型，叶数约束对全体成立。<\/p>\n<p><strong>追问三：随机化比较排序能绕开下界吗？<\/strong> 不能。随机选择改变的是哪条路径，每种排列仍要在树中分到不同叶；随机算法的期望路径长度同样受叶数约束，下界结论对期望比较次数仍成立。<\/p>\n<h2>延伸推演：模型边界、平均路径与下界口径<\/h2>\n<h3>决策树与递归树的分工<\/h3>\n<p>递归树分析单个算法的递归代价分层，节点是子问题调用；决策树抽象所有比较排序的比较结构，节点是一次二元比较。外形都是二叉树，前者算代价，后者证下界。混用会把“某算法递归形状”误当成“所有算法共同约束”。<\/p>\n<h3>平均路径长度的叶数约束<\/h3>\n<p><span class=\"katex-inline\">n!<\/span> 片叶的二叉树，按叶深求平均。平衡树平均深 <span class=\"katex-inline\">\\lg n<\/span> 量级；无论树怎么长，叶数约束使平均深度不可能低于 <span class=\"katex-inline\">\\Omega(\\lg(n!))<\/span>。下界不只压最坏路径，也压平均路径；声称平均快于该阶的比较排序同样不成立。<\/p>\n<h3>下界覆盖不到的算法动作<\/h3>\n<p>决策树内部结点必须是一次两键比较。读取键值范围、按位分配、按桶落位、利用元素代数结构的算法，都没有比较结点，模型不覆盖。检验一个排序是否受下界约束，先找它决策依据是不是两键大小比较。<\/p>\n<h3>第二算例：<span class=\"katex-inline\">n=5<\/span> 的叶数与高度<\/h3>\n<p><span class=\"katex-inline\">5!=120<\/span>。<span class=\"katex-inline\">2^6=64&amp;lt;120<\/span>，<span class=\"katex-inline\">2^7=128\\ge120<\/span>，树高至少 7。<span class=\"katex-inline\">\\lg 120\\approx6.9<\/span>，取整 7。阶估计：<span class=\"katex-inline\">(5/2)\\lg(5/2)=2.5\\times1.32=3.3<\/span>，与 <span class=\"katex-inline\">\\Omega(5\\lg 5)\\approx11.6<\/span> 同向；小样本取整偏差由大 <span class=\"katex-inline\">n<\/span> 渐近行为消除。<\/p>\n<h3>排列数增长对照<\/h3>\n<p><span class=\"katex-inline\">n=8<\/span>，<span class=\"katex-inline\">8!=40320<\/span>，<span class=\"katex-inline\">\\lg\\approx15.3<\/span>；<span class=\"katex-inline\">n=12<\/span>，<span class=\"katex-inline\">12!\\approx4.8\\times10^8<\/span>，<span class=\"katex-inline\">\\lg\\approx28.8<\/span>。<span class=\"katex-inline\">\\lg(n!)/n\\lg n<\/span> 在 <span class=\"katex-inline\">n=8<\/span> 为 <span class=\"katex-inline\">15.3/24=0.64<\/span>，<span class=\"katex-inline\">n=12<\/span> 为 <span class=\"katex-inline\">28.8/43.1=0.67<\/span>，随 <span class=\"katex-inline\">n<\/span> 增大趋 1，与 <span class=\"katex-inline\">\\Theta(n\\lg n)<\/span> 一致。<\/p>\n<h3>对抗性追问补充<\/h3>\n<p><strong>追问四：比较一次能得到多于二元的信息吗？<\/strong> 模型结点按二元分叉；若一次操作读出键的算术值或区间归属，决策不再是二元比较，树模型要换。下界结论依附二元比较前提。<\/p>\n<p><strong>追问五：输入有特殊结构时下界松绑吗？<\/strong> 下界针对任意输入的最坏保证。近乎有序、取值受限等专门输入可利用结构降低比较次数；这不违反一般下界，只是算法吃到了额外结构信息。<\/p>\n<h2>逐层推导补遗<\/h2>\n<h3>决策树的逐输入展开<\/h3>\n<p>同一比较排序在不同输入上的比较路径共享前缀，合并成一棵树。内部结点编号一次比较，左支不大于、右支大于；叶结点标注输出排列。给定输入沿分支下行，到达叶即该输入的排序结果。两种排列若共叶，算法在二者上输出相同，至少一者错误，故叶数不少于排列数。<\/p>\n<h3>叶深与比较次数的对应<\/h3>\n<p>最坏输入走到最深叶，比较次数等于树高 <span class=\"katex-inline\">h<\/span>。叶数上限 <span class=\"katex-inline\">2^h<\/span>，故 <span class=\"katex-inline\">2^h\\ge n!<\/span>，<span class=\"katex-inline\">h\\ge\\lg(n!)<\/span>。平均路径长度由叶深分布决定，叶数约束同样压低平均深度；下界不只服务最坏情形。<\/p>\n<h3><span class=\"katex-inline\">\\lg(n!)<\/span> 的上下界<\/h3>\n<p>上界：每项 <span class=\"katex-inline\">\\lg k\\le\\lg n<\/span>，<span class=\"katex-inline\">\\lg(n!)\\le n\\lg n<\/span>。下界：取后半段 <span class=\"katex-inline\">k=\\lceil n/2\\rceil,\\dots,n<\/span>，共 <span class=\"katex-inline\">\\ge n/2<\/span> 项，每项 <span class=\"katex-inline\">\\ge\\lg(n/2)<\/span>，<span class=\"katex-inline\">\\lg(n!)\\ge(n/2)\\lg(n/2)=\\Omega(n\\lg n)<\/span>。夹逼得 <span class=\"katex-inline\">\\lg(n!)=\\Theta(n\\lg n)<\/span>。<\/p>\n<h3>模型前提核验清单<\/h3>\n<p>判定一个排序是否受本下界约束：决策依据是否为两键二元比较；是否未读取键值范围、位结构或分布信息。两条都满足才落入决策树模型；基数、计数、桶排序各绕开其中一条。<\/p>\n<h3>下界与算法最优性的关系<\/h3>\n<p>归并、堆排序最坏 <span class=\"katex-inline\">O(n\\lg n)<\/span>，与 <span class=\"katex-inline\">\\Omega(n\\lg n)<\/span> 同阶，比较排序达到渐近最优。下界不排除常数改进，只排除阶的跨越；同阶算法之间的优劣由常数、空间、稳定性区分。<\/p>\n<h2>边界与常见误读补充<\/h2>\n<p>决策树下界只覆盖二元两键比较；读键值范围、按位分配、按桶落位的算法没有比较结点，模型不约束。下界针对任意输入的最坏保证，利用近乎有序等专门结构的专门算法可以降低比较次数，不违反一般下界。归并、堆排序与下界同阶，比较排序达到渐近最优；同阶算法之间的优劣由常数、空间、稳定性区分。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n决策树的内部结点和叶结点各标注什么？\n<\/li><li>\n为什么树至少要有 <span class=\"katex-inline\">n!<\/span> 片叶？两种排列走到同一叶会怎样？\n<\/li><li>\n高 <span class=\"katex-inline\">h<\/span> 二叉树最多多少片叶？由 <span class=\"katex-inline\">2^h\\ge n!<\/span> 怎样反解出树高下界？\n<\/li><li>\n写出 <span class=\"katex-inline\">\\lg(n!)\\ge(n/2)\\lg(n/2)<\/span> 的放缩过程。\n<\/li><li>\n这条下界为什么不适用基数排序？模型前提少了哪一项？\n<\/ol><\/div><\/details>", "c06": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.122<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">比较排序的下界 Ω(n lg n)：决策树论证<\/a><\/span><\/div><h1>计数排序与基数排序：突破比较下界的方式与代价<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章（原书第 8 章 8.2 计数排序、8.3 基数排序，PDF 第 122 页起）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>比较排序被决策树下界卡在 <span class=\"katex-inline\">\\Omega(n\\lg n)<\/span>，但工程里大量排序对象是取值范围有限的整数、学号、日期或定长字符串。如果算法不比较两个元素谁大谁小，转而直接读取键的数值或位结构，就可能避开决策树模型。计数排序与基数排序是这条路线的代表：它们用辅助空间和对键类型的假设，换线性或近线性时间。这个概念要讲清它们各步做什么、凭什么绕开下界，以及绕开的代价落在哪。<\/p>\n<h2>定义与符号逐项拆<\/h2>\n<p><strong>计数排序<\/strong>：输入 <span class=\"katex-inline\">A[1..n]<\/span>，键取值范围 <span class=\"katex-inline\">0..k-1<\/span>。<\/p>\n<ol><li>\n频次统计：<span class=\"katex-inline\">C[x]<\/span> 记录键 <span class=\"katex-inline\">x<\/span> 出现次数；\n<\/li><li>\n前缀累加：<span class=\"katex-inline\">C[x]<\/span> 改成键 <span class=\"katex-inline\">x<\/span> 应占据的末尾位置；\n<\/li><li>\n回写输出：从原数组末端向前扫描，按 <span class=\"katex-inline\">C[A[j]]<\/span> 落位，对应位置减 1。\n<\/ol>\n<p><strong>稳定性<\/strong>：相等键在输出中的相对次序与输入一致。计数排序从末端回写、前缀定位，天然保持稳定性。<\/p>\n<p><strong>基数排序<\/strong>：键是 <span class=\"katex-inline\">d<\/span> 位可分解结构（十进制数、定长字符串）。从最低位开始，逐位用稳定排序排一遍；每排完一位，高位排序时低位次序作为并列时的保留次序。<\/p>\n<p><strong>桶排序<\/strong>：把元素按键区间分到桶内，桶内分别排序后串接；性能依赖桶内分布均匀程度。<\/p>\n<h2>原理推导<\/h2>\n<h3>计数排序代价<\/h3>\n<p>频次统计扫描 <span class=\"katex-inline\">n<\/span> 个元素，<span class=\"katex-inline\">O(n)<\/span>；前缀累加遍历 <span class=\"katex-inline\">k<\/span> 个键值，<span class=\"katex-inline\">O(k)<\/span>；回写再扫 <span class=\"katex-inline\">n<\/span> 个元素，<span class=\"katex-inline\">O(n)<\/span>。总代价 <span class=\"katex-inline\">O(n+k)<\/span>。当 <span class=\"katex-inline\">k=O(n)<\/span> 时为 <span class=\"katex-inline\">O(n)<\/span>。<\/p>\n<p>计数排序不比较 <span class=\"katex-inline\">A[i]<\/span> 与 <span class=\"katex-inline\">A[j]<\/span> 谁大，只按键值查频次表与定位表；决策树的比较结点在算法中不存在，概念 c05 的下界模型不约束它。<\/p>\n<h3>基数排序代价<\/h3>\n<p>设键共 <span class=\"katex-inline\">d<\/span> 位，每位取值范围 <span class=\"katex-inline\">0..k-1<\/span>。每趟调用一次稳定排序（通常计数排序），单趟 <span class=\"katex-inline\">O(n+k)<\/span>，共 <span class=\"katex-inline\">d<\/span> 趟，总代价 <span class=\"katex-inline\">O(d(n+k))<\/span>。<span class=\"katex-inline\">d<\/span> 视为常数（机器字长、定长字段）时为 <span class=\"katex-inline\">O(n+k)<\/span>。<\/p>\n<p>低位优先的正确性归纳：第 1 趟按最低位排好；第 <span class=\"katex-inline\">r<\/span> 趟按第 <span class=\"katex-inline\">r<\/span> 位排序时，第 <span class=\"katex-inline\">1..r-1<\/span> 位的次序已在前趟固定，本趟稳定排序不会打乱低位并列时的相对次序；<span class=\"katex-inline\">d<\/span> 趟后高位为主、低位为辅，整体有序。<\/p>\n<h3>突破下界的条件<\/h3>\n<p>两类算法绕过下界靠两点：一是不做两键比较，决策树模型失去内部结点；二是利用键的额外结构——取值有限或可逐位分解。代价是辅助空间随键域 <span class=\"katex-inline\">k<\/span> 增长，且键必须能映射到有限位/有限桶；任意不可比较结构的复杂对象无法直接套用。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：键为整数、定长字符串等可按离散取值处理的类型；键域 <span class=\"katex-inline\">k<\/span> 与位数 <span class=\"katex-inline\">d<\/span> 受控；允许 <span class=\"katex-inline\">O(n+k)<\/span> 辅助空间。<\/p>\n<p>边界一：<span class=\"katex-inline\">k<\/span> 远大于 <span class=\"katex-inline\">n<\/span> 时，计数排序光累加键值表就超线性，反而不如比较排序。<\/p>\n<p>边界二：基数排序要求每位稳定可排；若低位排序不稳定，高位并列时低位次序丢失，整体结果错误。<\/p>\n<p>边界三：重复元素处理。计数排序按频次聚合，相等元素靠稳定性保持原序；基数排序的位序传递依赖前趟稳定。<\/p>\n<p>失败案例：对大整数直接套计数排序，键域取到整数上限，辅助空间爆炸；或把基数排序的“线性”理解成与位数无关，忽略 <span class=\"katex-inline\">d<\/span> 趟成本——位数很多时总代价按 <span class=\"katex-inline\">d<\/span> 线性增长。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>计数排序 vs 基数排序<\/strong>：计数排序一次按完整键值落位，适合键域小；基数排序把长键拆位反复稳定排，适合定长多字段。前者 <span class=\"katex-inline\">O(n+k)<\/span>，后者 <span class=\"katex-inline\">O(d(n+k))<\/span>。\n<\/li><li>\n<strong>基数排序 vs 桶排序<\/strong>：桶排序桶内要各自排序，均匀时近线性；基数排序不做桶内比较，逐位稳定分配。桶排序对分布敏感，基数排序对位数敏感。\n<\/li><li>\n<strong>线性时间 vs 比较下界<\/strong>：线性结论附带假设（键有限、可分解、辅助空间够）；比较排序的 <span class=\"katex-inline\">\\Omega(n\\lg n)<\/span> 是在“只靠比较”前提下的下界，两者前提不同，不构成矛盾。\n<\/li><li>\n<strong>稳定性在两种算法中的角色<\/strong>：计数排序靠稳定性保留相等元素原序；基数排序靠稳定性把低位次序传递到高位趟次。稳定性是基数排序正确性的必要条件。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c05 给出比较排序下界，本章两种算法正是下界之外的路线。后继：第 3 章散列表也利用键的取值做直接定位，与计数排序同属“按键查表”的结构；第 4 章摊还分析讨论动态表扩张的均摊代价，可对照本章辅助空间随键域增长的分析口径。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（计数排序与基数排序：突破比较下界的方式与代价）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：计数排序定位过程、基数排序位序归纳与算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要理解非比较排序怎样绕开下界，先往回追四层：<\/p>\n<ol><li>\n<strong>比较排序的下界来自“两键比大小”这一决策动作<\/strong>。算法每步选一对元素比较，结果分叉成决策树；不做这个动作，树模型就没有内部结点，下界无从附着。\n<\/li><li>\n<strong>键的数值或位结构是额外信息<\/strong>。直接读键值能知道它落在哪一档、哪一位，不需要先和别的键比较；计数与基数排序都在利用这类结构信息。\n<\/li><li>\n<strong>直接定位要付辅助空间<\/strong>。频次表、定位表、输出数组都随键域 <span class=\"katex-inline\">k<\/span> 或位数 <span class=\"katex-inline\">d<\/span> 增长；时间省下的部分换成空间与键类型限制。\n<\/li><li>\n<strong>多位数排序依赖稳定性逐位传递<\/strong>。低位趟次排好的次序，在高位并列时必须保留；稳定排序保证相等键不换位，位序才能从低位传到高位。\n<\/ol>\n<p>依赖链方向：比较动作是下界前提 → 非比较路线读键结构 → 定位需辅助空间 → 多位排序靠稳定性传递位序 → 总代价 <span class=\"katex-inline\">O(n+k)<\/span> 或 <span class=\"katex-inline\">O(d(n+k))<\/span>。<\/p>\n<h2>正向推导：两种算法的步骤与正确性<\/h2>\n<h3>计数排序三步展开<\/h3>\n<p>输入 <span class=\"katex-inline\">A[1..n]<\/span>，键域 <span class=\"katex-inline\">0..k-1<\/span>，输出 <span class=\"katex-inline\">B[1..n]<\/span>。<\/p>\n<p>第一步频次：<span class=\"katex-inline\">C[0..k-1]<\/span> 清零；对每个 <span class=\"katex-inline\">A[j]<\/span>，<span class=\"katex-inline\">C[A[j]]<\/span> 加 1。<span class=\"katex-inline\">C[x]<\/span> 此时是键 <span class=\"katex-inline\">x<\/span> 的出现次数。<\/p>\n<p>第二步前缀：<span class=\"katex-inline\">C[x]\\leftarrow C[x]+C[x-1]<\/span>。累加后 <span class=\"katex-inline\">C[x]<\/span> 是小于等于 <span class=\"katex-inline\">x<\/span> 的元素个数，即键 <span class=\"katex-inline\">x<\/span> 在输出中的末尾位置。<\/p>\n<p>第三步回写：<span class=\"katex-inline\">j<\/span> 从 <span class=\"katex-inline\">n<\/span> 到 1，取 <span class=\"katex-inline\">x=A[j]<\/span>，<span class=\"katex-inline\">B[C[x]]=A[j]<\/span>，<span class=\"katex-inline\">C[x]\\leftarrow C[x]-1<\/span>。从末端扫描配合前缀定位，相等键先进入的排在后，后进入的排在前，相对次序在输出中保留。<\/p>\n<p>正确性：每个键 <span class=\"katex-inline\">x<\/span> 被放到 <span class=\"katex-inline\">C[x]<\/span> 指示的区段内，区段长度等于频次；所有键落位后 <span class=\"katex-inline\">B<\/span> 按非降序排列。代价：扫描 <span class=\"katex-inline\">A<\/span> 两次、扫描 <span class=\"katex-inline\">C<\/span> 一次，<span class=\"katex-inline\">O(n+k)<\/span>。<\/p>\n<h3>基数排序位序归纳<\/h3>\n<p>设键为 <span class=\"katex-inline\">d<\/span> 位，从低位 <span class=\"katex-inline\">r=1<\/span> 到高位 <span class=\"katex-inline\">r=d<\/span> 逐位稳定排序。<\/p>\n<p>归纳假设：完成前 <span class=\"katex-inline\">r-1<\/span> 趟后，按键的低 <span class=\"katex-inline\">r-1<\/span> 位非降。第 <span class=\"katex-inline\">r<\/span> 趟按第 <span class=\"katex-inline\">r<\/span> 位稳定排序：第 <span class=\"katex-inline\">r<\/span> 位不同的键，由本位决定先后；第 <span class=\"katex-inline\">r<\/span> 位相同的键，稳定排序不改变其相对次序，保留低 <span class=\"katex-inline\">r-1<\/span> 位的已有次序。归纳到 <span class=\"katex-inline\">r=d<\/span>，按键的全部位非降。<\/p>\n<p>每趟稳定排序可用计数排序实现，单趟 <span class=\"katex-inline\">O(n+k&#x27;)<\/span>，<span class=\"katex-inline\">k&#x27;<\/span> 为单键位取值数；<span class=\"katex-inline\">d<\/span> 趟合计 <span class=\"katex-inline\">O(d(n+k&#x27;))<\/span>。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：计数排序定位<\/h3>\n<p>输入 <span class=\"katex-inline\">A=[6,0,2,0,1,3,4,6,1,3,2]<\/span>，<span class=\"katex-inline\">n=11<\/span>，键域 <span class=\"katex-inline\">0..6<\/span>。<\/p>\n<p>频次统计：<span class=\"katex-inline\">C=[2,2,2,2,1,0,2]<\/span>（键 0 到 6 各出现次数）。 前缀累加：<span class=\"katex-inline\">C=[2,4,6,8,9,9,11]<\/span>。 回写过程（从末端 <span class=\"katex-inline\">j=11<\/span> 向前）：<\/p>\n<ul><li>\n<span class=\"katex-inline\">A[11]=2<\/span>：<span class=\"katex-inline\">B[6]=2<\/span>，<span class=\"katex-inline\">C[2]=5<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">A[10]=3<\/span>：<span class=\"katex-inline\">B[8]=3<\/span>，<span class=\"katex-inline\">C[3]=7<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">A[9]=1<\/span>：<span class=\"katex-inline\">B[4]=1<\/span>，<span class=\"katex-inline\">C[1]=3<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">A[8]=6<\/span>：<span class=\"katex-inline\">B[11]=6<\/span>，<span class=\"katex-inline\">C[6]=10<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">A[7]=4<\/span>：<span class=\"katex-inline\">B[9]=4<\/span>，<span class=\"katex-inline\">C[4]=8<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">A[6]=3<\/span>：<span class=\"katex-inline\">B[7]=3<\/span>，<span class=\"katex-inline\">C[3]=6<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">A[5]=1<\/span>：<span class=\"katex-inline\">B[3]=1<\/span>，<span class=\"katex-inline\">C[1]=2<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">A[4]=0<\/span>：<span class=\"katex-inline\">B[2]=0<\/span>，<span class=\"katex-inline\">C[0]=1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">A[3]=2<\/span>：<span class=\"katex-inline\">B[5]=2<\/span>，<span class=\"katex-inline\">C[2]=4<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">A[2]=0<\/span>：<span class=\"katex-inline\">B[1]=0<\/span>，<span class=\"katex-inline\">C[0]=0<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">A[1]=6<\/span>：<span class=\"katex-inline\">B[10]=6<\/span>，<span class=\"katex-inline\">C[6]=9<\/span>。\n<\/ul>\n<p>输出 <span class=\"katex-inline\">B=[0,0,1,1,2,2,3,3,4,6,6]<\/span>，非降序；原输入中两个 0、两个 1 等相等元素的相对次序在稳定回写下保留。<\/p>\n<h3>算例 2：基数排序三位数<\/h3>\n<p>自拟输入 <span class=\"katex-inline\">[329,457,657,839,436,720,355]<\/span>，三位十进制。<\/p>\n<ul><li>\n个位趟：按个位稳定分配，结果按个位排：<span class=\"katex-inline\">720(0),355(5),436(6),457(7),657(7),329(9),839(9)<\/span>。\n<\/li><li>\n十位趟：按十位稳定分配：<span class=\"katex-inline\">720(2),329(2),355(5),436(3),457(5),657(5),839(3)<\/span>？按十位值重排：十位 2：720、329；十位 3：436、839；十位 5：355、457、657。序列 <span class=\"katex-inline\">[720,329,436,839,355,457,657]<\/span>。\n<\/li><li>\n百位趟：按百位稳定分配：百位 3：329、355；百位 4：436、457；百位 6：657；百位 7：720；百位 8：839。输出 <span class=\"katex-inline\">[329,355,436,457,657,720,839]<\/span>，整体有序。\n<\/ul>\n<h3>算例 3：代价对照<\/h3>\n<p><span class=\"katex-inline\">n=10^5<\/span>，键域 <span class=\"katex-inline\">k=1000<\/span>：计数排序 <span class=\"katex-inline\">O(10^5+10^3)<\/span>，一趟完成；比较排序 <span class=\"katex-inline\">O(n\\lg n)\\approx 1.7\\times10^6<\/span> 次比较。若键域取到 <span class=\"katex-inline\">10^9<\/span>，计数排序频次表无法承受，非比较路线失效。<\/p>\n<h2>对抗性追问<\/h2>\n<p><strong>追问一：计数排序为什么从末端向前回写，而不是从前端？<\/strong> 从末端扫描配合前缀末尾定位，相等键的相对次序被保持；方向反过来若定位表不调整，稳定性会丢失。稳定性本身不改变排序结果的非降性，但基数排序依赖它传递位序。<\/p>\n<p><strong>追问二：基数排序能先排高位再排低位吗？<\/strong> 先高位后低位时，低位趟次会打乱高位已有的分组；高位并列不再受保护，最终次序错误。低位优先是被位序归纳要求的方向。<\/p>\n<p><strong>追问三：桶排序什么时候退化成比较排序？<\/strong> 元素分布极不均匀时，个别桶内元素很多，桶内排序仍要比较；桶排序的近线性结论以分布均匀为前提，和计数排序的键域假设不同。<\/p>\n<h2>延伸推演：稳定性来源、桶排序对照与键假设<\/h2>\n<h3>计数排序稳定性怎样保持<\/h3>\n<p>回写从原数组末端向前扫描，前缀 <span class=\"katex-inline\">C[x]<\/span> 指示键 <span class=\"katex-inline\">x<\/span> 的末尾位置；相等键先进入输出区段的后部，后进入的占前部，相对次序保留。方向反过来若定位表不配套，稳定性丢失。稳定性不是排序结果非降的必要条件，但基数排序把它当作位序传递的载体。<\/p>\n<h3>桶排序与两种线性排序的差别<\/h3>\n<p>桶排序按键区间分桶，桶内各自排序；分布均匀时近线性，分布偏斜时个别桶退化比较排序。计数排序按完整键值聚合频次，基数排序按位反复稳定分配；桶排序的近线性以均匀分布为前提，假设类型与前两者不同。<\/p>\n<h3>键类型假设落到哪里<\/h3>\n<p>计数排序要求键可枚举到有限 <span class=\"katex-inline\">k<\/span> 档；基数排序要求键可拆成有限 <span class=\"katex-inline\">d<\/span> 位、每位有限取值；辅助空间随 <span class=\"katex-inline\">k<\/span>、<span class=\"katex-inline\">d<\/span> 增长。任意不可比较结构的复杂对象无法直接套用，需先投影成离散键。<\/p>\n<h3>第二算例：两位数基数排序<\/h3>\n<p>输入 <span class=\"katex-inline\">[31,24,13,42,21,35]<\/span>，两位十进制。<\/p>\n<ul><li>\n个位趟（按位稳定分配）：个位 1：21、31；个位 3：13；个位 4：24；个位 2：42；个位 5：35。序列 <span class=\"katex-inline\">[21,31,13,24,42,35]<\/span>。\n<\/li><li>\n十位趟：十位 1：13；十位 2：21、24；十位 3：31、35；十位 4：42。输出 <span class=\"katex-inline\">[13,21,24,31,35,42]<\/span>，整体有序。\n<\/ul>\n<h3>空间与代价对照<\/h3>\n<p><span class=\"katex-inline\">n=10^4<\/span>、键域 <span class=\"katex-inline\">k=100<\/span>：计数排序一趟 <span class=\"katex-inline\">O(n+k)<\/span>，辅助 <span class=\"katex-inline\">O(n+k)<\/span>；比较排序 <span class=\"katex-inline\">O(n\\lg n)\\approx1.3\\times10^5<\/span> 次比较。键域扩到 <span class=\"katex-inline\">10^7<\/span>，频次表无法承受，非比较路线让位。<\/p>\n<h3>对抗性追问补充<\/h3>\n<p><strong>追问四：计数排序能不能原地完成？<\/strong> 标准计数排序需要输出数组与频次表；原地版本要处理键移动冲突，稳定性通常失去。空间换稳定是计数排序的典型取舍。<\/p>\n<p><strong>追问五：基数排序每位为什么用稳定排序而不是任意排序？<\/strong> 低位趟次的次序必须在高位并列时保留；非稳定排序会打乱低位已排顺序，位序归纳断裂。单趟选计数排序正是取其稳定性。<\/p>\n<h2>逐层推导补遗<\/h2>\n<h3>计数排序定位表的含义<\/h3>\n<p>频次 <span class=\"katex-inline\">C[x]<\/span> 是键 <span class=\"katex-inline\">x<\/span> 出现次数；前缀累加后 <span class=\"katex-inline\">C[x]<\/span> 是不超过 <span class=\"katex-inline\">x<\/span> 的元素总数，即 <span class=\"katex-inline\">x<\/span> 在输出中的末尾位置。回写每放一个 <span class=\"katex-inline\">x<\/span>，<span class=\"katex-inline\">C[x]<\/span> 减 1，下一相等元素占前一位置。区段长度与频次对应，落位不重不漏。<\/p>\n<h3>基数排序位序归纳<\/h3>\n<p>第 1 趟按最低位排好；第 <span class=\"katex-inline\">r<\/span> 趟按第 <span class=\"katex-inline\">r<\/span> 位稳定排序，第 <span class=\"katex-inline\">1..r-1<\/span> 位次序在前趟固定。本位并列时稳定排序不改动相对次序，低位次序保留；<span class=\"katex-inline\">d<\/span> 趟后高位为主、低位为辅，整体有序。归纳从低位向高位推进，方向不可反。<\/p>\n<h3>代价结构对比<\/h3>\n<p>计数排序 <span class=\"katex-inline\">O(n+k)<\/span>：扫描 <span class=\"katex-inline\">A<\/span> 两次、<span class=\"katex-inline\">C<\/span> 一次。基数排序 <span class=\"katex-inline\">O(d(n+k&#x27;))<\/span>：<span class=\"katex-inline\">d<\/span> 趟稳定分配。桶排序近线性以分布均匀为前提，桶内可能仍需比较。三者辅助空间随键域或位数增长，键类型假设各有边界。<\/p>\n<h3>突破下界的两点依据<\/h3>\n<p>一是不做两键比较，决策树无内部结点；二是利用键的有限取值或位结构。代价是辅助空间与键类型限制，不是免费绕开比较下界。<\/p>\n<h2>边界与常见误读补充<\/h2>\n<p>计数排序辅助空间随键域 <span class=\"katex-inline\">k<\/span> 增长，<span class=\"katex-inline\">k<\/span> 远大于 <span class=\"katex-inline\">n<\/span> 时累加键值表就超线性；基数排序代价按位数 <span class=\"katex-inline\">d<\/span> 线性，位数很多时不能称与位数无关。稳定性是基数排序位序传递的必要条件，低位趟次序在高位并列时必须保留。非比较路线绕开下界的前提是键可离散枚举或可逐位分解，任意复杂对象需先投影成离散键。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n计数排序三步各扫描哪个数组？前缀累加后 <span class=\"katex-inline\">C[x]<\/span> 表示什么？\n<\/li><li>\n计数排序为什么不落入决策树下界？模型前提缺了哪一项？\n<\/li><li>\n基数排序共 <span class=\"katex-inline\">d<\/span> 位、每位 <span class=\"katex-inline\">k&#x27;<\/span> 个取值，总代价是多少？\n<\/li><li>\n稳定性在基数排序中起什么作用？低位趟次的次序怎样传到高位？\n<\/li><li>\n举一个计数排序辅助空间不可接受的场景。\n<\/ol><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.189<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">堆与建堆的线性时间证明（求和上界）<\/a><\/span><\/div><h1>红黑树性质与旋转：插入后的修复序列<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3 章（原书第 13 章 红黑树，PDF 第 189 页起；13.1 性质、13.2 旋转、13.3 插入）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>普通二叉搜索树按插入顺序生长，逆序或有序输入会把树压成单链，查找退化成 <span class=\"katex-inline\">\\Theta(n)<\/span>。需要一种平衡约束，在每次插入、删除后自动把高度控制在对数范围。红黑树用结点着色加局部旋转实现这件事：着色约束路径上的黑色结点密度，旋转调整父子拓扑，两者配合保证树高 <span class=\"katex-inline\">O(\\lg n)<\/span>。这个概念讲清五条性质各自卡什么、旋转改哪些指针，以及一次插入后修复序列分哪几种情形。<\/p>\n<h2>定义与符号逐项拆<\/h2>\n<p>红黑树是满足下列性质的二叉搜索树（原书 13.1 节，PDF 第 189 页）：<\/p>\n<ol><li>\n每个结点是红色或黑色。\n<\/li><li>\n根结点是黑色。\n<\/li><li>\n每个叶结点（NIL 结点）是黑色。\n<\/li><li>\n若一个红色结点的两个子结点都是黑色；即红结点不与红结点相邻，红结点的孩子必为黑。\n<\/li><li>\n对每个结点，从该结点到其所有后代叶结点的简单路径上，黑色结点数目相同。\n<\/ol>\n<p><strong>黑高<\/strong>：结点 <span class=\"katex-inline\">x<\/span> 的黑高 <span class=\"katex-inline\">bh(x)<\/span> 是该结点到任一后代叶路径上的黑色结点数（不含 <span class=\"katex-inline\">x<\/span> 自身，按教材口径）。NIL 叶黑高为 0。<\/p>\n<p><strong>左旋 RIGHT/LEFT<\/strong>：以结点 <span class=\"katex-inline\">x<\/span> 为支点，把右孩子 <span class=\"katex-inline\">y<\/span> 提到 <span class=\"katex-inline\">x<\/span> 位置；<span class=\"katex-inline\">y<\/span> 的左子树转给 <span class=\"katex-inline\">x<\/span> 当右孩子，<span class=\"katex-inline\">x<\/span> 降为 <span class=\"katex-inline\">y<\/span> 的左孩子。右旋对称。旋转只改三条父子指针与相应父标记，中序遍历序列保持不变。<\/p>\n<h2>原理推导<\/h2>\n<h3>高度为什么是对数<\/h3>\n<p>性质 4 禁止红结点相邻，红结点只能稀疏嵌在黑结点之间；性质 5 保证各路径黑结点数一致。设根黑高为 <span class=\"katex-inline\">h<\/span>，一棵满足性质的子树至少含 <span class=\"katex-inline\">2^h-1<\/span> 个内部结点（每层黑结点各两支），因此 <span class=\"katex-inline\">n\\ge 2^h-1<\/span>，<span class=\"katex-inline\">h=O(\\lg n)<\/span>。红结点只在局部增加高度，不突破黑高约束给的对数上界。<\/p>\n<h3>插入修复的进入状态<\/h3>\n<p>新结点先染红，左右子结点置 NIL。检查违例：若父结点是红色，违反性质 4，进入修复循环。修复按叔父结点颜色与方向分三种情形。<\/p>\n<p><strong>情形一：叔父结点为红<\/strong>。父与叔父同为红，将父、叔父改黑，祖父改红；违例上移到祖父，继续向上检查。<\/p>\n<p><strong>情形二：叔父为黑，当前结点与父结点方向不一致<\/strong>（父是祖父左子而当前是右子，或对称）。先在父结点上做一次旋转，把方向对齐，转入情形三。<\/p>\n<p><strong>情形三：叔父为黑，方向一致<\/strong>。在祖父结点上旋转，父改黑、祖父改红，局部恢复红黑性质，循环终止。<\/p>\n<p>旋转过程中中序序列不变，变色只调整颜色标记；修复沿树高向上走，旋转次数至多两次。根结点循环结束后强制为黑。<\/p>\n<h3>旋转保持搜索树性质<\/h3>\n<p>左旋中：<span class=\"katex-inline\">y<\/span> 原左子树的所有键介于 <span class=\"katex-inline\">x<\/span> 与 <span class=\"katex-inline\">y<\/span> 之间，转给 <span class=\"katex-inline\">x<\/span> 当右孩子后，<span class=\"katex-inline\">x<\/span> 左侧仍小于 <span class=\"katex-inline\">x<\/span>、右侧该子树大于 <span class=\"katex-inline\">x<\/span>；<span class=\"katex-inline\">y<\/span> 提到 <span class=\"katex-inline\">x<\/span> 位后，左侧 <span class=\"katex-inline\">x<\/span> 子树小于 <span class=\"katex-inline\">y<\/span>，右侧不变。二叉搜索树的左小右大约束在旋转前后都成立。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：元素可比较、需要动态插入删除且查询高度对数；红黑树是内存数据结构，操作在内存指针上完成。<\/p>\n<p>边界一：红黑树保证的是渐近平衡，不保证绝对最短高度；AVL 类约束更严，但插入删除旋转代价更高，红黑树在实践中写入友好。<\/p>\n<p>边界二：删除修复与插入修复对称，多一个“双黑”状态向上传递的过程；不能把插入三情形直接套到删除上。<\/p>\n<p>失败案例：去掉性质 4（红不相邻），红结点可沿一条路径串联，黑高约束失效，最坏退化成普通 BST 的 <span class=\"katex-inline\">\\Theta(n)<\/span>；去掉性质 5（黑高一致），各路径黑色密度不均，单侧可长出长枝。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>红黑树 vs 二叉堆<\/strong>：堆维护父子偏序、取最值快，不支持按键搜索；红黑树维护搜索树次序，支持查找、前驱后继、范围遍历。\n<\/li><li>\n<strong>旋转 vs 变色<\/strong>：变色不改拓扑，只调整颜色以满足性质 4；旋转改父子结构以收紧高度。情形一靠变色，情形二、三各含一次旋转。\n<\/li><li>\n<strong>根黑 vs 叶黑<\/strong>：根黑是修复循环的边界锚点；NIL 叶黑保证红孩子判定有统一基准。两条都是边界条件，不参与内部平衡计算。\n<\/li><li>\n<strong>红黑树 vs B 树<\/strong>：两者都是平衡搜索结构；红黑树面向内存指针、二元分叉，B 树面向磁盘块、宽节点低树高（见概念 c08）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c03 堆在另一套约束下把操作高度压到 <span class=\"katex-inline\">O(\\lg n)<\/span>，可对照堆交换修复与红黑树旋转修复。后继：概念 c08 B 树是外存版本的平衡搜索树；概念 c09 图算法的 Prim、Dijkstra 用优先队列，优先队列底层可由堆或平衡树实现。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（红黑树性质与旋转：插入后的修复序列）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：红黑性质作用链、旋转指针改动与插入修复推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把红黑树的平衡机制拆开，先往回追四层：<\/p>\n<ol><li>\n<strong>普通 BST 的退化来自插入顺序<\/strong>。有序输入使树变成单链，查找代价随结点数线性；需要一条不依赖输入顺序的平衡约束。\n<\/li><li>\n<strong>平衡约束通过两类动作维持<\/strong>：颜色标记约束路径上红黑结点密度，旋转调整父子拓扑。只染色不收口高度，只旋转不控制密度，都无法保证对数高度。\n<\/li><li>\n<strong>五条性质分别卡住一个退化方向<\/strong>：颜色二元限制状态空间；根黑、叶黑给边界统一基准；红不相邻禁止红链；黑高一致禁止路径长短悬殊。\n<\/li><li>\n<strong>插入违例沿树向上传递<\/strong>：新结点染红后，唯一可能先违反的是红相邻；修复按叔父颜色与方向分情形，把违例上移或旋转收口。\n<\/ol>\n<p>依赖链方向：BST 退化问题 → 着色加旋转两类动作 → 五性质各司其职 → 插入违例上移 → 三情形修复 → 树高 <span class=\"katex-inline\">O(\\lg n)<\/span>。<\/p>\n<h2>正向推导：性质作用与旋转细节<\/h2>\n<h3>五条性质各自约束什么<\/h3>\n<p>性质 1（红或黑）：结点状态只有两类，颜色判定可机械执行。 性质 2（根黑）：修复循环向上走到根时有确定的终结状态；根不允许保持红色。 性质 3（NIL 叶黑）：所有路径末端颜色一致，红孩子判定、黑高计数有统一基准。 性质 4（红结点子结点皆黑）：一条路径上不能出现红红相邻，红结点只能孤立点缀；这条直接限制红色链长度。 性质 5（到后代叶黑结点数相同）：各路径黑色密度一致，禁止单侧长枝。<\/p>\n<h3>旋转的指针改动<\/h3>\n<p>左旋支点 <span class=\"katex-inline\">x<\/span>，右孩子 <span class=\"katex-inline\">y<\/span>：<\/p>\n<ol><li>\n<span class=\"katex-inline\">y<\/span> 的左子树 <span class=\"katex-inline\">\\beta<\/span> 转给 <span class=\"katex-inline\">x<\/span> 当右孩子；若 <span class=\"katex-inline\">\\beta<\/span> 非空，其父记为 <span class=\"katex-inline\">x<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">x<\/span> 的父改为 <span class=\"katex-inline\">y<\/span>，<span class=\"katex-inline\">y<\/span> 替换 <span class=\"katex-inline\">x<\/span> 在祖父处的位置。\n<\/li><li>\n<span class=\"katex-inline\">y<\/span> 的左孩子记为 <span class=\"katex-inline\">x<\/span>，<span class=\"katex-inline\">x<\/span> 的父记为 <span class=\"katex-inline\">y<\/span>。\n<\/ol>\n<p>右旋对称：<span class=\"katex-inline\">x<\/span> 的左孩子 <span class=\"katex-inline\">y<\/span> 上提，<span class=\"katex-inline\">y<\/span> 的右子树转给 <span class=\"katex-inline\">x<\/span> 当左孩子。旋转前后中序序列不变：被转走的子树键值介于两支之间，换位后左小右大仍成立。<\/p>\n<h3>插入修复序列推演<\/h3>\n<p>进入状态：新结点 <span class=\"katex-inline\">z<\/span> 红，父 <span class=\"katex-inline\">p<\/span> 若为红则违例。记叔父 <span class=\"katex-inline\">u<\/span>，祖父 <span class=\"katex-inline\">g<\/span>。<\/p>\n<p>情形一（<span class=\"katex-inline\">u<\/span> 红）：<span class=\"katex-inline\">p<\/span>、<span class=\"katex-inline\">u<\/span> 改黑，<span class=\"katex-inline\">g<\/span> 改红。原来 <span class=\"katex-inline\">p<\/span> 红触发性质 4 违反，变色后 <span class=\"katex-inline\">p,u<\/span> 变黑；<span class=\"katex-inline\">g<\/span> 变红可能与其父冲突，违例位置上移到 <span class=\"katex-inline\">g<\/span>，循环继续。<\/p>\n<p>情形二（<span class=\"katex-inline\">u<\/span> 黑，方向不一致）：<span class=\"katex-inline\">p<\/span> 是 <span class=\"katex-inline\">g<\/span> 左子而 <span class=\"katex-inline\">z<\/span> 是 <span class=\"katex-inline\">p<\/span> 右子（右左对称）。在 <span class=\"katex-inline\">p<\/span> 上左旋，<span class=\"katex-inline\">z<\/span> 上提代替 <span class=\"katex-inline\">p<\/span> 位于 <span class=\"katex-inline\">g<\/span> 左子位；此时 <span class=\"katex-inline\">z<\/span> 与原 <span class=\"katex-inline\">p<\/span> 方向转为一致，进入情形三。<\/p>\n<p>情形三（<span class=\"katex-inline\">u<\/span> 黑，方向一致）：在 <span class=\"katex-inline\">g<\/span> 上右旋，<span class=\"katex-inline\">p<\/span> 上提代替 <span class=\"katex-inline\">g<\/span> 位置；<span class=\"katex-inline\">p<\/span> 改黑，<span class=\"katex-inline\">g<\/span> 改红。局部红黑性质恢复，循环终止。整段修复旋转不超过两次，其余为变色。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：小树插入的局部修复<\/h3>\n<p>设当前树：根 <span class=\"katex-inline\">g=30<\/span> 黑，左孩子 <span class=\"katex-inline\">p=20<\/span> 红，<span class=\"katex-inline\">p<\/span> 的左孩子 <span class=\"katex-inline\">u=10<\/span> 红（叔父角色，挂在 <span class=\"katex-inline\">g<\/span> 左侧另一支），待插 <span class=\"katex-inline\">z=15<\/span> 为 <span class=\"katex-inline\">p<\/span> 的右孩子。<\/p>\n<ul><li>\n违例检查：<span class=\"katex-inline\">p=20<\/span> 红，<span class=\"katex-inline\">z=15<\/span> 红，红红相邻，违反性质 4。\n<\/li><li>\n叔父 <span class=\"katex-inline\">u=10<\/span> 红，落情形一：<span class=\"katex-inline\">p<\/span> 与 <span class=\"katex-inline\">u<\/span> 改黑，<span class=\"katex-inline\">g=30<\/span> 改红。\n<\/li><li>\n违例上移：<span class=\"katex-inline\">g=30<\/span> 变红，检查其父；若 <span class=\"katex-inline\">g<\/span> 父为黑或 <span class=\"katex-inline\">g<\/span> 已是根，循环终止；根最终强制黑。\n<\/li><li>\n结果：20、10 黑，30 红（或按根约束转黑），15 红挂 20 右下，局部无红红相邻，各路径黑高一致。\n<\/ul>\n<h3>算例 2：黑高与最少结点<\/h3>\n<p>根黑高 <span class=\"katex-inline\">bh=2<\/span>。性质 5 要求根到各叶两条黑结点；黑高 1 的子树至少 1 个内部结点，黑高 2 的树至少 <span class=\"katex-inline\">2^2-1=3<\/span> 个内部结点。归纳：黑高 <span class=\"katex-inline\">h<\/span> 的红黑树至少 <span class=\"katex-inline\">2^h-1<\/span> 个内部结点。反解 <span class=\"katex-inline\">h\\le \\lg(n+1)<\/span>，树高不超过 <span class=\"katex-inline\">2\\lg(n+1)<\/span> 量级，<span class=\"katex-inline\">O(\\lg n)<\/span>。<\/p>\n<h3>算例 3：方向对齐前后<\/h3>\n<p><span class=\"katex-inline\">g=50<\/span>，左子 <span class=\"katex-inline\">p=30<\/span>，<span class=\"katex-inline\">p<\/span> 右子 <span class=\"katex-inline\">z=40<\/span>，叔父黑。<span class=\"katex-inline\">z<\/span> 相对 <span class=\"katex-inline\">p<\/span> 是右、<span class=\"katex-inline\">p<\/span> 相对 <span class=\"katex-inline\">g<\/span> 是左，方向不一致，落情形二。在 <span class=\"katex-inline\">p=30<\/span> 左旋：<span class=\"katex-inline\">z=40<\/span> 上提为 <span class=\"katex-inline\">g<\/span> 左子，<span class=\"katex-inline\">30<\/span> 降为 <span class=\"katex-inline\">40<\/span> 左子，<span class=\"katex-inline\">30<\/span> 原右子树转给 <span class=\"katex-inline\">30<\/span> 当左子。此时 <span class=\"katex-inline\">40<\/span> 与 <span class=\"katex-inline\">30<\/span> 方向一致，再在 <span class=\"katex-inline\">g=50<\/span> 右旋收口。<\/p>\n<h2>对抗性追问<\/h2>\n<p><strong>追问一：插入为什么新结点染红而不是染黑？<\/strong> 染黑一定会破坏性质 5：新结点所在路径多一个黑结点，与其他路径黑高不一致；染红只可能触发红红相邻，违例范围局限在父与祖父一支，修复可向上传递收口。<\/p>\n<p><strong>追问二：旋转会不会改变搜索树的键顺序？<\/strong> 不会。旋转只调整父子层级，中序遍历序列保持；支点两侧子树键值仍满足左小右大。旋转收的是高度，不是顺序。<\/p>\n<p><strong>追问三：五条性质少一条分别退化什么？<\/strong> 少性质 4：红结点可串成红链，单侧高度失控；少性质 5：路径黑密度不均，可长出长枝；少根黑：修复无上移终结锚点；少叶黑：末端颜色判定不统一，黑高计数失真。<\/p>\n<h2>延伸推演：黑高界、删除修复与平衡树对照<\/h2>\n<h3>黑高约束树高的推导<\/h3>\n<p>性质 5 要求根到各叶黑结点数一致；性质 4 禁止红结点相邻，红结点只能嵌在黑结点之间。黑高 <span class=\"katex-inline\">h<\/span> 的子树至少 <span class=\"katex-inline\">2^h-1<\/span> 个内部结点，故 <span class=\"katex-inline\">n\\ge 2^h-1<\/span>，<span class=\"katex-inline\">h\\le\\lg(n+1)<\/span>。红结点至多使路径翻倍，树高 <span class=\"katex-inline\">O(\\lg n)<\/span>。这条界不靠插入删除细节，只由颜色约束推出。<\/p>\n<h3>删除修复与插入修复的对称处<\/h3>\n<p>删除可能造成子树少一个黑结点，出现“双黑”状态沿树向上传递；修复同样按兄弟颜色与方向分情形，变色或旋转收口。插入三情形不能直接套到删除：删除多一层状态上推过程，理解插入时先把变色/旋转两类动作分清。<\/p>\n<h3>与 AVL 类平衡树的取舍<\/h3>\n<p>AVL 按左右子树高度差严格约束，查找友好，插入删除旋转代价更高；红黑树颜色约束较松，写入友好，工程库实现多取红黑树。两者都保证对数高度，平衡严格度与维护代价是交换项。<\/p>\n<h3>第二算例：方向对齐前后的指针变化<\/h3>\n<p><span class=\"katex-inline\">g=50<\/span>，左子 <span class=\"katex-inline\">p=30<\/span>，<span class=\"katex-inline\">p<\/span> 右子 <span class=\"katex-inline\">z=40<\/span>，叔父黑。<\/p>\n<ul><li>\n初始：<span class=\"katex-inline\">g<\/span> 左指针指 <span class=\"katex-inline\">p<\/span>；<span class=\"katex-inline\">p<\/span> 右指针指 <span class=\"katex-inline\">z<\/span>；<span class=\"katex-inline\">z<\/span> 父指 <span class=\"katex-inline\">p<\/span>。\n<\/li><li>\n情形二在 <span class=\"katex-inline\">p<\/span> 左旋：<span class=\"katex-inline\">z<\/span> 上提为 <span class=\"katex-inline\">g<\/span> 左子；<span class=\"katex-inline\">p<\/span> 降为 <span class=\"katex-inline\">z<\/span> 左子；<span class=\"katex-inline\">p<\/span> 原右子树（空）转给 <span class=\"katex-inline\">p<\/span> 当左子。\n<\/li><li>\n情形三在 <span class=\"katex-inline\">g<\/span> 右旋：<span class=\"katex-inline\">z<\/span> 上提替 <span class=\"katex-inline\">g<\/span> 位置；<span class=\"katex-inline\">g<\/span> 降为 <span class=\"katex-inline\">z<\/span> 右子；<span class=\"katex-inline\">z<\/span> 原右子树转给 <span class=\"katex-inline\">g<\/span> 当左子。\n<\/li><li>\n变色：<span class=\"katex-inline\">z<\/span> 改黑，<span class=\"katex-inline\">g<\/span> 改红；局部红黑性质恢复。\n<\/ul>\n<h3>对抗性追问补充<\/h3>\n<p><strong>追问四：红黑树查找走哪条性质？<\/strong> 查找只依赖二叉搜索树左小右大，颜色不参与定位；颜色约束保障高度，查找代价由高度 <span class=\"katex-inline\">O(\\lg n)<\/span> 承接。<\/p>\n<p><strong>追问五：根结点染红会破坏什么？<\/strong> 根红本身不违性质 4，但修复循环失去向上终结锚点；规范流程结束时强制根黑，避免根色状态在后续插入中反复传递。<\/p>\n<h2>逐层推导补遗<\/h2>\n<h3>旋转保持搜索树次序的核验<\/h3>\n<p>左旋支点 <span class=\"katex-inline\">x<\/span>、右孩子 <span class=\"katex-inline\">y<\/span>：<span class=\"katex-inline\">y<\/span> 原左子树 <span class=\"katex-inline\">\\beta<\/span> 的键介于 <span class=\"katex-inline\">x<\/span> 与 <span class=\"katex-inline\">y<\/span> 之间。<span class=\"katex-inline\">\\beta<\/span> 转给 <span class=\"katex-inline\">x<\/span> 当右孩子后，<span class=\"katex-inline\">x<\/span> 左侧仍小于 <span class=\"katex-inline\">x<\/span>、右侧 <span class=\"katex-inline\">\\beta<\/span> 大于 <span class=\"katex-inline\">x<\/span>；<span class=\"katex-inline\">y<\/span> 提位后左侧 <span class=\"katex-inline\">x<\/span> 子树小于 <span class=\"katex-inline\">y<\/span>，右侧不变。换位前后左小右大约束成立，中序序列不变。右旋对称。<\/p>\n<h3>插入修复状态机<\/h3>\n<p>新结点染红后，唯一先违反的是性质 4（父红则红红相邻）。状态沿父—叔父—祖父展开：叔父红走情形一变色上移；叔父黑且方向不一致走情形二先旋转对齐；叔父黑且方向一致走情形三旋转收口。每步动作后重新检查违例位置，循环到根或局部恢复。<\/p>\n<h3>黑高界复查<\/h3>\n<p>性质 5 要求根到各叶黑结点数相同；性质 4 禁止红相邻，红结点只能单点嵌入。黑高 <span class=\"katex-inline\">h<\/span> 的子树最少 <span class=\"katex-inline\">2^h-1<\/span> 内部结点，<span class=\"katex-inline\">n\\ge2^h-1<\/span>，<span class=\"katex-inline\">h=O(\\lg n)<\/span>。红结点不增加黑高，路径长度至多黑高两倍，树高 <span class=\"katex-inline\">O(\\lg n)<\/span>。<\/p>\n<h3>变色与旋转的分工<\/h3>\n<p>变色不改拓扑，只把颜色调到满足性质 4；旋转改父子结构收紧高度。情形一纯变色，情形二、三各含一次旋转。修复整段旋转不超两次，其余为颜色调整；根最终强制黑色。<\/p>\n<h3>与堆修复的对照<\/h3>\n<p>堆 MAX-HEAPIFY 沿单路径下调，修复父小于孩子；红黑树修复沿父链上推，配合旋转改拓扑。两者都把违例限制在局部路径，单次操作对数高度；堆维护偏序，红黑树维护搜索次序加平衡。<\/p>\n<h2>边界与常见误读补充<\/h2>\n<p>红黑树保证渐近平衡，不保证绝对最短高度；AVL 约束更严但旋转代价更高，工程库多取红黑树的写入友好。删除修复带双黑状态上推，不能把插入三情形直接套用。查找只走搜索树左小右大，颜色不参与定位；颜色约束保障的是对数高度。去掉红不相邻性质，红结点可串成红链，单侧高度失控；去掉黑高一致，路径黑密度不均，可长出长枝。旋转只改三条父子指针与颜色标记，中序遍历序列保持不变；修复沿树高向上走，整段旋转不超过两次。红黑树插入新结点先染红，唯一先违反的是红相邻性质；删除修复的双黑状态沿树向上传递，与插入情形不能互套。性质 3 的 NIL 叶黑给红孩子判定与黑高计数统一末端基准；性质 2 的根黑是修复循环向上收敛的锚点。红黑树查找只走搜索树左小右大，颜色不参与定位，颜色约束保障的是对数高度。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n逐条写出红黑树五条性质，并指出哪条禁止红红相邻。\n<\/li><li>\n左旋支点 <span class=\"katex-inline\">x<\/span> 与右孩子 <span class=\"katex-inline\">y<\/span> 之间交换了哪些指针？\n<\/li><li>\n情形一、二、三各自动作是什么？哪种含旋转、哪种只变色？\n<\/li><li>\n为什么黑高 <span class=\"katex-inline\">h<\/span> 的树至少 <span class=\"katex-inline\">2^h-1<\/span> 个内部结点？由此怎样得到树高对数上界？\n<\/li><li>\n插入修复循环中违例位置为什么能向上传递？什么条件下终止？\n<\/ol><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.292<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">红黑树性质与旋转：插入后的修复序列<\/a><\/span><\/div><h1>B 树的分裂/合并与磁盘 I/O 度量：节点大小为什么按页取<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（原书第 18 章 B 树，PDF 第 292 页起；18.1 定义、18.2 基本操作、18.3 删除）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>红黑树这类内存平衡搜索结构每次比较可能沿指针跳转，结点小而分叉少；搬到磁盘或固态硬盘上，每次读取要付出寻道与块传输代价，树高就直接换算成 I/O 次数。B 树针对外存设计：单个节点存多个关键字与多个子树指针，把同一层的分支选择压进一次块读取，用宽节点换低树高。这个概念讲清 B 树的度数约束、插入时分裂与删除时合并怎样维持约束，以及节点宽度为什么对齐磁盘页大小。<\/p>\n<h2>定义与符号逐项拆<\/h2>\n<p><strong>度数 <span class=\"katex-inline\">t<\/span><\/strong>：B 树的最小度数。每个非叶节点：<\/p>\n<ul><li>\n关键字个数 <span class=\"katex-inline\">k<\/span> 满足 <span class=\"katex-inline\">t-1\\le k\\le 2t-1<\/span>；\n<\/li><li>\n子树个数等于 <span class=\"katex-inline\">k+1<\/span>；\n<\/li><li>\n关键字按非降序排列，分隔各子树区间。\n<\/ul>\n<p><strong>叶节点<\/strong>：最底层，不含子树指针，关键字集合与内部节点同约束。所有叶节点位于同一层。<\/p>\n<p><strong>搜索<\/strong>：从根出发，在节点内关键字序列中定位区间，沿对应子树指针下降；过程与二叉搜索树查找同构，差别只在节点内是一次多关键字比较。<\/p>\n<p><strong>分裂<\/strong>：节点已满（<span class=\"katex-inline\">2t-1<\/span> 个关键字）时，取中间关键字上提到父节点，原节点拆成左右两个节点，各分 <span class=\"katex-inline\">t-1<\/span> 个关键字；父节点若随后变满，继续向上分裂。<\/p>\n<p><strong>合并<\/strong>：节点关键字少于 <span class=\"katex-inline\">t-1<\/span> 时，先向相邻兄弟借关键字；兄弟也紧时，把该节点、父中分隔关键字、兄弟三者合并成一个节点，父节点关键字减少，可能继续向上合并。<\/p>\n<h2>原理推导<\/h2>\n<h3>树高与 I/O 次数<\/h3>\n<p>根到叶路径上每个节点对应一次磁盘块读取。<span class=\"katex-inline\">n<\/span> 个关键字、度数 <span class=\"katex-inline\">t<\/span> 的 B 树，高度 <span class=\"katex-inline\">h=O(\\log_t n)<\/span>：每个节点至少 <span class=\"katex-inline\">t<\/span> 个分支，第 <span class=\"katex-inline\">h<\/span> 层至多容纳 <span class=\"katex-inline\">t^h<\/span> 个叶区间，反解 <span class=\"katex-inline\">h\\le \\log_t n<\/span>。对比二叉平衡树 <span class=\"katex-inline\">O(\\lg_2 n)<\/span> 高度，<span class=\"katex-inline\">t<\/span> 越大树高越低，读取节点次数越少。<\/p>\n<h3>节点宽度按页取的理由<\/h3>\n<p>磁盘按块传输，一次 I/O 读入一个页块（常见 4KB–16KB）。节点宽度对齐页大小后，一次读入覆盖该节点全部关键字与子指针，后续区间选择不再二次寻道。若节点只放一两个关键字，每层都要新读一块，宽节点摊薄了路径上的 I/O 次数；若节点超过页块，一次读取要跨块传输，反而增加开销。页大小、关键字长度、指针长度三者共同决定 <span class=\"katex-inline\">t<\/span> 的取值。<\/p>\n<h3>分裂的不变式<\/h3>\n<p>分裂前：满节点 <span class=\"katex-inline\">2t-1<\/span> 关键字，中间第 <span class=\"katex-inline\">t<\/span> 个。上提中间关键字到父；左节点保留前 <span class=\"katex-inline\">t-1<\/span> 个，右节点保留后 <span class=\"katex-inline\">t-1<\/span> 个。分裂后：两节点关键字数都是 <span class=\"katex-inline\">t-1<\/span>，达下限；父节点多一个关键字，未超上限即可停止。搜索路径上的区间划分由上提关键字保证不重不漏。<\/p>\n<h3>合并的不变式<\/h3>\n<p>删除后欠关键字的节点：兄弟富余（≥<span class=\"katex-inline\">t<\/span>）时旋转一个关键字过来，父子关键字调整次序；兄弟同样紧时，三者合并得到 <span class=\"katex-inline\">2t-1<\/span> 个关键字，父减一。合并维持每个节点 <span class=\"katex-inline\">[t-1,2t-1]<\/span> 的区间约束，叶层深度不变。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：数据规模超出内存、按块外存组织；查询以点查和区间扫描为主；关键字与指针长度可预估，用于定节点宽度。<\/p>\n<p>边界一：B 树节点宽，内存中单次节点内扫描比二叉结点比较略贵；这个代价被 I/O 次数下降抵消，纯内存场景红黑树可能更划算。<\/p>\n<p>边界二：节点大小按页取是工程折算，不是定理约束；<span class=\"katex-inline\">t<\/span> 还要留关键字变长、页头元数据的余量。<\/p>\n<p>失败案例：把 B 树当二叉搜索树逐关键字拆分，节点只放一个键，树高退回 <span class=\"katex-inline\">O(\\lg n)<\/span> 以上，外存 I/O 次数失控；反过来节点塞得过宽，单节点读跨多块，缓存局部性下降。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>B 树 vs 红黑树<\/strong>：红黑树内存指针分叉、二元平衡；B 树外存宽节点低树高，节点内多关键字定位。平衡目标相同，存储介质决定结构宽度。\n<\/li><li>\n<strong>分裂 vs 旋转<\/strong>：红黑树旋转改父子拓扑收口高度；B 树分裂把满节点一分为二并上提关键字，约束对象是节点关键字个数区间。\n<\/li><li>\n<strong>B 树搜索 vs 散列表<\/strong>：B 树支持区间扫描与有序遍历，散列表按键直接定位但不保留次序；外存数据库索引用 B 树类结构正是为范围查询。\n<\/li><li>\n<strong>度数 <span class=\"katex-inline\">t<\/span> vs 树高<\/strong>：<span class=\"katex-inline\">t<\/span> 决定分支宽度，树高随 <span class=\"katex-inline\">t<\/span> 增大以对数底数下降；节点关键字上限 <span class=\"katex-inline\">2t-1<\/span> 与下限 <span class=\"katex-inline\">t-1<\/span> 是一对配套约束。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c07 红黑树是内存版平衡搜索树，B 树可对照其平衡动作与高度分析。后继：概念 c09 图算法在大规模图上同样受外存 I/O 约束；散列表（第 3 章概述）是另一种按键定位结构，与 B 树分别服务散列查询与有序查询。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（B 树的分裂/合并与磁盘 I/O 度量：节点大小为什么按页取）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：度数约束、分裂合并推演与 I/O 高度估算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>理解 B 树设计，先往回追四层：<\/p>\n<ol><li>\n<strong>外存与内存的代价结构不同<\/strong>。内存跳转指针廉价，外存每次读块要寻道加传输；平衡树的树高在外存上直接换算成 I/O 次数，必须压低路径节点数。\n<\/li><li>\n<strong>压低树高的手段是加宽节点<\/strong>。二叉树每层一个分叉，宽节点一次保存多个关键字、挂多个子树，同层分支选择在一次块读取内完成。\n<\/li><li>\n<strong>宽节点要维持个数区间约束<\/strong>。节点关键字过少失去宽节点意义，过多则超页块；度数 <span class=\"katex-inline\">t<\/span> 给出上下限 <span class=\"katex-inline\">[t-1,2t-1]<\/span>，插入分裂、删除合并都围绕这条区间。\n<\/li><li>\n<strong>分裂与合并是约束的在线修复<\/strong>。插入可能超上限，分裂上提中间键；删除可能破下限，借兄弟或三者合并。修复前后叶层深度不变。\n<\/ol>\n<p>依赖链方向：外存 I/O 贵 → 宽节点低树高 → 度数区间约束 → 分裂/合并维持约束 → 高度 <span class=\"katex-inline\">O(\\log_t n)<\/span>，节点宽对齐页块。<\/p>\n<h2>正向推导：约束与操作逐步展开<\/h2>\n<h3>度数约束<\/h3>\n<p><span class=\"katex-inline\">t<\/span> 为最小度数。非叶节点关键字数 <span class=\"katex-inline\">k\\in[t-1,2t-1]<\/span>，子树 <span class=\"katex-inline\">k+1<\/span> 个；叶节点同关键字区间。关键字 <span class=\"katex-inline\">k_1&amp;lt;k_2&amp;lt;\\dots&amp;lt;k_k<\/span> 把数轴分成 <span class=\"katex-inline\">k+1<\/span> 段，第 <span class=\"katex-inline\">i<\/span> 段子树内所有键落在 <span class=\"katex-inline\">(k_{i-1},k_i)<\/span>。<\/p>\n<h3>分裂推演<\/h3>\n<p>设满节点 <span class=\"katex-inline\">X<\/span> 含 <span class=\"katex-inline\">2t-1<\/span> 个关键字 <span class=\"katex-inline\">x_1,\\dots,x_{2t-1}<\/span>。<\/p>\n<ol><li>\n取中间键 <span class=\"katex-inline\">x_t<\/span> 上提到父节点 <span class=\"katex-inline\">P<\/span>。\n<\/li><li>\n新建节点 <span class=\"katex-inline\">Y<\/span>，<span class=\"katex-inline\">X<\/span> 保留 <span class=\"katex-inline\">x_1,\\dots,x_{t-1}<\/span>，<span class=\"katex-inline\">Y<\/span> 接 <span class=\"katex-inline\">x_{t+1},\\dots,x_{2t-1}<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">P<\/span> 原指向 <span class=\"katex-inline\">X<\/span> 的子树指针改为指向 <span class=\"katex-inline\">X<\/span> 与 <span class=\"katex-inline\">Y<\/span>，中间键 <span class=\"katex-inline\">x_t<\/span> 插在两指针之间。\n<\/li><li>\n若 <span class=\"katex-inline\">P<\/span> 因此达到 <span class=\"katex-inline\">2t-1<\/span> 键，<span class=\"katex-inline\">P<\/span> 继续向上分裂；根分裂时树高增加一层。\n<\/ol>\n<p>分裂后 <span class=\"katex-inline\">X,Y<\/span> 各 <span class=\"katex-inline\">t-1<\/span> 键，恰达下限；区间划分由 <span class=\"katex-inline\">x_t<\/span> 隔开，左段全部小于 <span class=\"katex-inline\">x_t<\/span>，右段全部大于 <span class=\"katex-inline\">x_t<\/span>。<\/p>\n<h3>合并推演<\/h3>\n<p>删除后节点 <span class=\"katex-inline\">X<\/span> 键数不足 <span class=\"katex-inline\">t-1<\/span>：<\/p>\n<ol><li>\n看相邻兄弟 <span class=\"katex-inline\">Y<\/span>。若 <span class=\"katex-inline\">Y<\/span> 键数 <span class=\"katex-inline\">\\ge t<\/span>，从 <span class=\"katex-inline\">Y<\/span> 旋转一个键到 <span class=\"katex-inline\">X<\/span>，父中分隔键下沉，次序在父子与兄弟间调整。\n<\/li><li>\n若 <span class=\"katex-inline\">Y<\/span> 也只有 <span class=\"katex-inline\">t-1<\/span> 键，把 <span class=\"katex-inline\">X<\/span>、父中分隔键 <span class=\"katex-inline\">k<\/span>、<span class=\"katex-inline\">Y<\/span> 合并为一个节点：键数 <span class=\"katex-inline\">(t-1)+1+(t-1)=2t-1<\/span>，父减一键。\n<\/li><li>\n父欠键时重复上述过程，直到根；根只剩一键时树高减一层。\n<\/ol>\n<p>合并保持节点区间约束，叶层不被改动。<\/p>\n<h3>高度与 I/O<\/h3>\n<p>每层下降读一个节点。节点至少 <span class=\"katex-inline\">t<\/span> 个分支，第 <span class=\"katex-inline\">h<\/span> 层叶区间数至少 <span class=\"katex-inline\">t^h<\/span>；容纳 <span class=\"katex-inline\">n<\/span> 个关键字要求 <span class=\"katex-inline\">t^h\\ge n<\/span>，<span class=\"katex-inline\">h\\ge\\log_t n<\/span>（下界），上限同量级 <span class=\"katex-inline\">O(\\log_t n)<\/span>。路径 I/O 次数等于树高，<span class=\"katex-inline\">t<\/span> 以对数底数身份压低高度。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：<span class=\"katex-inline\">t=2<\/span> 的一次分裂<\/h3>\n<p>节点 <span class=\"katex-inline\">X=[10,20,30,40,50]<\/span>，满（<span class=\"katex-inline\">2t-1=3<\/span>？<span class=\"katex-inline\">t=2<\/span> 上限 3，本例按 <span class=\"katex-inline\">t=3<\/span>，上限 5）。<span class=\"katex-inline\">t=3<\/span>：中间键第 3 个 <span class=\"katex-inline\">30<\/span> 上提；左 <span class=\"katex-inline\">X=[10,20]<\/span>，右 <span class=\"katex-inline\">Y=[40,50]<\/span>，各 <span class=\"katex-inline\">t-1=2<\/span> 键。父节点插入 <span class=\"katex-inline\">30<\/span> 后接左右两指针。<\/p>\n<p>对照 <span class=\"katex-inline\">t=2<\/span>：满节点 3 键 <span class=\"katex-inline\">[a,b,c]<\/span>，中间 <span class=\"katex-inline\">b<\/span> 上提，左右各 1 键；分裂粒度更细，树高相应更高。<\/p>\n<h3>算例 2：百万级关键字的高度估算<\/h3>\n<p><span class=\"katex-inline\">n=10^6<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">t=10<\/span>：<span class=\"katex-inline\">h\\approx\\log_{10}10^6=6<\/span>，路径读约 6 个节点。\n<\/li><li>\n<span class=\"katex-inline\">t=100<\/span>：<span class=\"katex-inline\">h\\approx\\log_{100}10^6=3<\/span>，路径读约 3 个节点。\n<\/ul>\n<p>二叉平衡树同规模 <span class=\"katex-inline\">h\\approx\\log_2 10^6\\approx 20<\/span>。宽节点把外存路径 I/O 从二十次量级压到个位数。<\/p>\n<h3>算例 3：节点宽度折算<\/h3>\n<p>页块 4KB（4096 字节），关键字 8 字节，子树指针 8 字节。节点存 <span class=\"katex-inline\">k<\/span> 个键加 <span class=\"katex-inline\">k+1<\/span> 个指针，占用 <span class=\"katex-inline\">8k+8(k+1)=16k+8<\/span> 字节。留页头余量后 <span class=\"katex-inline\">16k\\le 4000<\/span>，<span class=\"katex-inline\">k\\le 250<\/span>；取 <span class=\"katex-inline\">2t-1\\le 250<\/span>，<span class=\"katex-inline\">t\\le 125<\/span>。实际取值还要考虑变长键与块校验，<span class=\"katex-inline\">t<\/span> 按页内可用空间反推。<\/p>\n<h2>对抗性追问<\/h2>\n<p><strong>追问一：B 树节点为什么不全放成一页那么宽？<\/strong> 宽度受上下限双向约束：过窄退回二叉高树，过宽单节点跨块读取；页内可用空间决定 <span class=\"katex-inline\">t<\/span>，超出部分要跨块，缓存与传输代价上升。<\/p>\n<p><strong>追问二：分裂会不会改变已有关键字的相对次序？<\/strong> 不改变。分裂只把满节点切成左右两支并上提中间键，节点内非降序与跨节点区间次序保持；搜索定位路径随分裂调整。<\/p>\n<p><strong>追问三：删除时为什么先借兄弟、再合并？<\/strong> 借兄弟不增加节点总数，父子键旋转即可补足下限；兄弟无富余才合并，合并是兜底手段。顺序反过来会产生不必要的节点合并与后续再分裂。<\/p>\n<h2>延伸推演：搜索路径、分裂上推与合并细节<\/h2>\n<h3>B 树搜索的层内定位<\/h3>\n<p>每层进入节点后，在有序关键字序列中找目标区间，选定下一层子树指针；节点内扫描是线性或二分比较，跨层下降才是磁盘 I/O。搜索路径长度等于树高，节点内比较代价相对 I/O 可忽略，这也是宽节点划算的原因。<\/p>\n<h3>分裂向上传递的边界<\/h3>\n<p>满节点分裂后父节点多一个关键字；父若随之达到 <span class=\"katex-inline\">2t-1<\/span>，继续向上分裂。根分裂时树高增加一层。分裂不改动已有叶层深度，只在满节点处扩出兄弟。<\/p>\n<h3>合并的三种位置<\/h3>\n<p>欠键节点先看两侧兄弟：兄弟富余则旋转一关键字到欠键节点，父中分隔键下沉；兄弟紧则三者合并。父欠键时重复过程，根剩一键时树高减一层。合并保持叶层不变，节点数减少。<\/p>\n<h3>第二算例：<span class=\"katex-inline\">t=3<\/span> 的插入与分裂<\/h3>\n<p>节点上限 <span class=\"katex-inline\">2t-1=5<\/span>，下限 <span class=\"katex-inline\">t-1=2<\/span>。<\/p>\n<p>插入序列向某节点累积：<span class=\"katex-inline\">[5,10,15,20,25]<\/span> 已满。分裂：中间键 <span class=\"katex-inline\">15<\/span> 上提父节点；左节点 <span class=\"katex-inline\">[5,10]<\/span>，右节点 <span class=\"katex-inline\">[20,25]<\/span>，各 2 键达下限。父节点插入 <span class=\"katex-inline\">15<\/span> 后若达 5 键，按同规则继续向上。<\/p>\n<p>对照 <span class=\"katex-inline\">t=2<\/span>：上限 3 键，满节点 <span class=\"katex-inline\">[a,b,c]<\/span> 中间 <span class=\"katex-inline\">b<\/span> 上提，左右各 1 键；分裂粒度细，树高相应更高。<\/p>\n<h3>节点宽度与工程取舍<\/h3>\n<p>页块内除关键字与子指针，还有页头、位示、校验等元数据；<span class=\"katex-inline\">t<\/span> 按可用空间反推。关键字变长时还要留余量。过窄退回二叉高树，过宽跨块读取，两端都有代价，取值落在页内容量区间。<\/p>\n<h3>对抗性追问补充<\/h3>\n<p><strong>追问四：B 树节点为什么不存数据记录本身？<\/strong> 教材 B 树节点存关键字与子指针，记录留在叶层或外部存储；节点保持紧凑，单层能覆盖更多分支。实际数据库索引多为 B 树变体，叶层挂数据指针。<\/p>\n<p><strong>追问五：删除会不会让叶层深度变浅？<\/strong> 普通合并只减节点数，叶层不变；只有根退化到单键时整树高减一层。搜索路径深度由叶层一致性保障。<\/p>\n<h2>逐层推导补遗<\/h2>\n<h3>度数区间的设计理由<\/h3>\n<p>下限 <span class=\"katex-inline\">t-1<\/span> 保证节点不至于过碎：若节点只放一键，分支退化成二叉，树高失控。上限 <span class=\"katex-inline\">2t-1<\/span> 对齐页块容量：节点超宽则单节点跨块读取。上下限配套，插入分裂、删除合并不出区间。子树个数随关键字数加 1，区间 <span class=\"katex-inline\">[t,2t]<\/span>。<\/p>\n<h3>分裂不变式核验<\/h3>\n<p>满节点 <span class=\"katex-inline\">2t-1<\/span> 键，中间第 <span class=\"katex-inline\">t<\/span> 键上提；左留 <span class=\"katex-inline\">t-1<\/span>，右留 <span class=\"katex-inline\">t-1<\/span>。分裂后两节点恰达下限，父多一键未超上限即停。区间划分由上提键隔开：左段全小于它，右段全大于它，搜索路径不重不漏。父满则继续上分裂，根分裂树高加一层。<\/p>\n<h3>合并不变式核验<\/h3>\n<p>欠键节点先借兄弟：兄弟 <span class=\"katex-inline\">\\ge t<\/span> 键时旋转一键过来，父分隔键下沉，次序父子兄弟间调整。兄弟仅 <span class=\"katex-inline\">t-1<\/span> 时三者合并：<span class=\"katex-inline\">(t-1)+1+(t-1)=2t-1<\/span>，父减一键。合并后节点回到上限内，叶层深度不变；父欠键重复，根剩一键树高减一层。<\/p>\n<h3>I/O 度量口径<\/h3>\n<p>树高即路径磁盘块读取次数。<span class=\"katex-inline\">t<\/span> 分支每层，第 <span class=\"katex-inline\">h<\/span> 层叶区间至少 <span class=\"katex-inline\">t^h<\/span>，<span class=\"katex-inline\">n<\/span> 个关键字要求 <span class=\"katex-inline\">t^h\\ge n<\/span>，<span class=\"katex-inline\">h=O(\\log_t n)<\/span>。<span class=\"katex-inline\">t<\/span> 以对数底数身份压低高度；二叉平衡树 <span class=\"katex-inline\">h=O(\\lg_2 n)<\/span>，宽节点把路径 I/O 从二十次量级压到个位数。<\/p>\n<h3>节点宽度折算步骤<\/h3>\n<p>页块容量减去页头、位示、校验等元数据，余留空间分配给 <span class=\"katex-inline\">k<\/span> 个关键字与 <span class=\"katex-inline\">k+1<\/span> 个子指针。关键字长、指针长代入，解出 <span class=\"katex-inline\">k<\/span> 上限，再定 <span class=\"katex-inline\">t<\/span>。变长键还要留余量；实际取值在页内可用空间与分裂频率之间折中。<\/p>\n<h2>边界与常见误读补充<\/h2>\n<p>B 树宽节点在内存中单次扫描比二叉结点略贵，代价被 I/O 次数下降抵消；纯内存场景红黑树可能更划算。节点宽度对齐页块是工程折算，<span class=\"katex-inline\">t<\/span> 还要为变长键与页头元数据留余量。节点过窄退回二叉高树，过宽跨块读取；分裂上推只在满节点发生，合并兜底欠键节点，叶层深度在增删中保持一致。B 树节点存关键字与子指针，数据记录留在叶层或外部存储，节点保持紧凑以覆盖更多分支选择。搜索每层进入节点后在有序关键字序列中找区间，选定下一层指针；节点内比较相对磁盘 I/O 可忽略，宽节点划算的原因正在于此。分裂不改动已有叶层深度，只在满节点处扩出兄弟；合并减节点数，根退化到单键时树高才减一层。<span class=\"katex-inline\">t<\/span> 分支每层，第 <span class=\"katex-inline\">h<\/span> 层叶区间至少 <span class=\"katex-inline\">t^h<\/span>，<span class=\"katex-inline\">n<\/span> 个关键字要求 <span class=\"katex-inline\">t^h\\ge n<\/span>，故 <span class=\"katex-inline\">h=O(\\log_t n)<\/span>；<span class=\"katex-inline\">t<\/span> 以对数底数身份压低路径 I/O 次数。节点宽度折算时先扣页头与校验余量，再把关键字长与子指针长代入解出 <span class=\"katex-inline\">k<\/span> 上限。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出度数 <span class=\"katex-inline\">t<\/span> 约束下节点关键字个数与子树个数区间。\n<\/li><li>\n满节点分裂时中间键去向何处？左右节点各分多少键？\n<\/li><li>\n欠键节点先借兄弟、再三者合并，两种方式各补足多少键？\n<\/li><li>\nB 树高度为什么是 <span class=\"katex-inline\">O(\\log_t n)<\/span>？节点分支数怎样进入树高公式？\n<\/li><li>\n节点宽度对齐磁盘页大小的理由是什么？过窄与过宽各有什么代价？\n<\/ol><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/算法/算法导论（原书第3版） (Thomas H.Cormen,Charles E.Leiserson etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.356<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">渐近记号：Θ、O、Ω 的定义差异与常见误用<\/a><\/span><\/div><h1>图的 BFS/DFS 与最短路径松弛：Dijkstra 正确性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3 章（原书第 22 章 图的基本表示、22.2 BFS、22.3 DFS，PDF 第 356 页起；第 24 章 24.3 Dijkstra，PDF 第 389 页起）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>图算法先回答两类问题：从起点能到达哪些结点、按什么顺序到达；带权图上起点到各结点的最短距离是多少。遍历靠队列或栈扩展邻接结点，最短路靠反复松弛边距离估计。Dijkstra 是非负权图上的单源最短路算法，它的正确性不能只凭“每次选最近结点”的直觉，要落到已确定集合的不变式与反证链条上。这个概念讲清 BFS/DFS 的遍历结构、松弛规则，以及 Dijkstra 为什么在非负权前提下求出真实最短路。<\/p>\n<h2>定义与符号逐项拆<\/h2>\n<p><strong>图的表示<\/strong>：邻接表为每个结点挂一条出边链表；邻接矩阵用 <span class=\"katex-inline\">n\\times n<\/span> 数组记录边权。稀疏图用邻接表省空间，稠密图邻接矩阵定位快。<\/p>\n<p><strong>BFS（广度优先搜索）<\/strong>：起点入队，反复出队一个结点，把未访问邻结点入队并记录前驱。队列保证结点按距起点的层数顺序被处理。<\/p>\n<p><strong>DFS（深度优先搜索）<\/strong>：从起点沿一条邻接链深入到底，无路可走再回溯；递归栈或显式栈记录路径。DFS 记录发现时间与完成时间，用于拓扑排序、连通分量与环检测。<\/p>\n<p><strong>松弛<\/strong>：对边 <span class=\"katex-inline\">(u,v)<\/span>，当前距离估计 <span class=\"katex-inline\">d[u]<\/span>、<span class=\"katex-inline\">d[v]<\/span>，边权 <span class=\"katex-inline\">w(u,v)<\/span>。若 <span class=\"katex-inline\">d[u]+w(u,v)&amp;lt;d[v]<\/span>，更新 <span class=\"katex-inline\">d[v]=d[u]+w(u,v)<\/span>，记 <span class=\"katex-inline\">v<\/span> 前驱为 <span class=\"katex-inline\">u<\/span>。<\/p>\n<p><strong>Dijkstra<\/strong>：维护未确定结点集合 <span class=\"katex-inline\">V-S<\/span>，每轮选 <span class=\"katex-inline\">d<\/span> 最小的结点 <span class=\"katex-inline\">u<\/span> 加入已确定集合 <span class=\"katex-inline\">S<\/span>，松弛 <span class=\"katex-inline\">u<\/span> 的全部出边，直到 <span class=\"katex-inline\">V-S<\/span> 空。<\/p>\n<h2>原理推导<\/h2>\n<h3>BFS 的层数性质<\/h3>\n<p>BFS 队列按层扩展：第 0 层起点，第 1 层邻接点，第 2 层邻接的邻接点。归纳可得：结点 <span class=\"katex-inline\">v<\/span> 第一次被发现时，队列中的层数等于起点到 <span class=\"katex-inline\">v<\/span> 的无权最短路长度。同层结点距离相同，先入队先扩展。<\/p>\n<h3>DFS 的回溯结构<\/h3>\n<p>DFS 沿未访问邻结点深入；分支走完回到上一层继续选择。发现时间标记结点首次进入，完成时间标记分支退出；父子边、回边、横边在遍历树中分类。DFS 不直接给距离，它给出可达性与结构时序。<\/p>\n<h3>松弛不变式<\/h3>\n<p>初始化 <span class=\"katex-inline\">d[s]=0<\/span>，其余 <span class=\"katex-inline\">d[v]=\\infty<\/span>。任何时刻 <span class=\"katex-inline\">d[v]\\ge\\delta(v)<\/span>，<span class=\"katex-inline\">\\delta(v)<\/span> 为真实最短路长度：每次松弛只在找到更短路径时更新，估计不会低于真实值；松弛反复进行，估计逐步下降逼近 <span class=\"katex-inline\">\\delta(v)<\/span>。<\/p>\n<h3>Dijkstra 正确性反证<\/h3>\n<p>待证：结点加入 <span class=\"katex-inline\">S<\/span> 时 <span class=\"katex-inline\">d[u]=\\delta(u)<\/span>。设 <span class=\"katex-inline\">u<\/span> 是第一个加入 <span class=\"katex-inline\">S<\/span> 时 <span class=\"katex-inline\">d[u]&amp;gt;\\delta(u)<\/span> 的结点。<span class=\"katex-inline\">S<\/span> 内结点由归纳距离已确定。取真实最短路 <span class=\"katex-inline\">s\\leadsto u<\/span>，设路径上第一个不在 <span class=\"katex-inline\">S<\/span> 的结点 <span class=\"katex-inline\">y<\/span>，其前驱 <span class=\"katex-inline\">x\\in S<\/span>。松弛 <span class=\"katex-inline\">(x,y)<\/span> 后 <span class=\"katex-inline\">d[y]\\le d[x]+w(x,y)=\\delta(y)<\/span>。边权非负，<span class=\"katex-inline\">\\delta(y)\\le\\delta(u)<\/span>；选 <span class=\"katex-inline\">u<\/span> 时 <span class=\"katex-inline\">d[u]<\/span> 是 <span class=\"katex-inline\">V-S<\/span> 最小，<span class=\"katex-inline\">d[u]\\le d[y]<\/span>。串联得 <span class=\"katex-inline\">d[u]\\le d[y]\\le\\delta(y)\\le\\delta(u)<\/span>，与 <span class=\"katex-inline\">d[u]&amp;gt;\\delta(u)<\/span> 矛盾。故 <span class=\"katex-inline\">u<\/span> 入 <span class=\"katex-inline\">S<\/span> 时距离正确，归纳覆盖全部结点。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：BFS 用于无权或等权图；Dijkstra 要求所有边权非负；图可有向可无向。<\/p>\n<p>边界一：出现负权边，<span class=\"katex-inline\">\\delta(y)\\le\\delta(u)<\/span> 不再保证，已入 <span class=\"katex-inline\">S<\/span> 结点的距离可能被后续负权边改短，Dijkstra 结论失效；负权场景用 Bellman-Ford 一类允许反复松弛的算法。<\/p>\n<p>边界二：BFS 不能直接用于带权最短路，边权不等时层数不代表距离。<\/p>\n<p>边界三：DFS 递归深度受栈容量限制，大图需显式栈改写；遍历时间 <span class=\"katex-inline\">O(V+E)<\/span> 对两种搜索相同。<\/p>\n<p>失败案例：给含负权环的图跑 Dijkstra，已确定集合不再回头更新，输出距离偏长；或把 BFS 层数当带权距离，忽略边权差异。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>BFS vs DFS<\/strong>：BFS 队列按层，求无权最短路与层序；DFS 栈式深入，求连通结构、拓扑序与环检测。两者遍历时间同为 <span class=\"katex-inline\">O(V+E)<\/span>，用途由遍历顺序决定。\n<\/li><li>\n<strong>松弛 vs 贪心选点<\/strong>：松弛更新距离估计，是局部操作；Dijkstra 的贪心是每轮选最小估计结点收口。松弛在所有最短路算法中通用，选点策略才区分算法。\n<\/li><li>\n<strong>最短路 vs 最小生成树<\/strong>：最短路关心起点到各点的路径长度；MST 关心覆盖全部结点的边集总权最小。两者都用安全边思想，但优化目标与边取舍规则不同。\n<\/li><li>\n<strong>邻接表 vs 邻接矩阵<\/strong>：表省空间、适合稀疏图，矩阵定位 <span class=\"katex-inline\">O(1)<\/span>、适合稠密图；表示选择影响遍历常数，不改变算法阶。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的阶语言陈述 <span class=\"katex-inline\">O(V+E)<\/span> 与对数优先队列操作；概念 c03 堆是 Dijkstra 优先队列的底层实现之一。后继：第 4 章概念 c12 摊还分析针对动态表一类结构的操作均摊；概念 c13 NP 完全性讨论的困难问题，其多项式算法障碍与本章最短路的多项式解法形成对照。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（图的 BFS/DFS 与最短路径松弛：Dijkstra 正确性）<\/summary><div clas
