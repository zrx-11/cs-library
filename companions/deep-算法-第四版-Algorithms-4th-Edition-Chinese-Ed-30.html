M=10^6<\/span> 即 <span class=\"katex-inline\">10^{12}<\/span> 次，平方增长在大规模下直接封死可行性。\n<\/ol>\n<h2>平摊代价口径补充<\/h2>\n<p>路径压缩带来的收益不是单次查找都变快：首次深查找仍要走完整条路径；收益体现在后续访问同一批结点时。平摊分析把一串操作的总代价分摊到每次操作上：压缩动作一次付出，多次读取回收。书里给出的结论方向是，加权加压缩的 union-find 平摊代价增长极慢，实际工程中按近似常数使用；严格的逆阿克曼函数级分析超出本书范围，记住&quot;趋近常数、不是无条件 <span class=\"katex-inline\">O(1)<\/span>&quot;即可。<\/p>\n<h2>API 与用例对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>操作<\/th><th>输入<\/th><th>返回/动作<\/th><th>实现要点<\/th><\/tr><\/thead><tbody><tr><td><code>find(p)<\/code><\/td><td>对象编号<\/td><td>所在分量根<\/td><td>父链上溯；压缩版途经结点挂根<\/td><\/tr><tr><td><code>connected(p,q)<\/code><\/td><td>两对象<\/td><td>布尔，是否同组<\/td><td>两根比较<\/td><\/tr><tr><td><code>union(p,q)<\/code><\/td><td>两对象<\/td><td>合并分量<\/td><td>找根；不同根按大小挂接；分量数减一<\/td><\/tr><tr><td><code>count()<\/code><\/td><td>无<\/td><td>分量个数<\/td><td>初始 <span class=\"katex-inline\">N<\/span>，成功合并减一<\/td><\/tr><\/tbody><\/table><\/div>\n<p>用例流程：读入对象数 <span class=\"katex-inline\">N<\/span> 初始化结构；逐对读入 <span class=\"katex-inline\">(p,q)<\/span>；<code>connected<\/code> 为假则输出该对并 <code>union<\/code>；读完遍历一次，同根对象归入同一分量。<\/p>\n<h2>第二组误解复盘<\/h2>\n<p><strong>误解 1：union-find 能给出两对象之间的路径。<\/strong> 它只记录分量归属，不保存边序列；要还原路径必须另存邻接表并跑遍历。并查集回答&quot;同不同组&quot;，不回答&quot;怎么走过去&quot;。<\/p>\n<p><strong>误解 2：树越矮越好，所以合并时把高树挂矮树。<\/strong> 加权规则比较的是分量大小，不是当前高度；小树挂大树保证规模翻倍次数有界。单纯按高度挂接也能控制高度（按高度合并），是另一种可行规则，但书里标准实现按大小。<\/p>\n<p><strong>误解 3：路径压缩后树是完全平衡的。<\/strong> 压缩只压平被查找过的路径，未访问的分支形状不变；整棵树不保证左右均衡。平衡化目标是控制最坏高度，不是绘制对称树。<\/p>\n<p><strong>误解 4：并查集适合保存键值映射。<\/strong> 它的接口没有存值、取值、范围查询；要按键存值归符号表（第 3 章），并查集只做归属判断。<\/p>\n<h2>背景补充：渗流模型<\/h2>\n<p>书里以物理化学中的渗流作为应用背景：网格每个单元以一定概率打开，上下两侧连通即发生渗流；模拟时把打开的相邻单元并入同一分量，判断顶部分量是否与底部分量连通。这类问题对象数可达网格量级，连接数更大，朴素扫描方案无法承受，union-find 的近常数平摊代价是模拟可行的前提。同一结构在网络连通、电路导通、社交分组、变量名等价等场景复用，接口不变，只换对象编号来源。<\/p>\n<h2>计数口径补充：三代实现访问次数对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>实现<\/th><th>find/connected<\/th><th>union<\/th><th>最坏总量<\/th><th>主要缺陷<\/th><\/tr><\/thead><tbody><tr><td>quick-find<\/td><td>两次访问<\/td><td>扫全数组 <span class=\"katex-inline\">N<\/span> 次<\/td><td><span class=\"katex-inline\">O(MN)<\/span><\/td><td>合并侧平方增长<\/td><\/tr><tr><td>quick-union<\/td><td>沿父链 <span class=\"katex-inline\">O(h)<\/span><\/td><td>两次找根加一次挂接<\/td><td>退化时 <span class=\"katex-inline\">O(MN)<\/span><\/td><td>可能退化成链<\/td><\/tr><tr><td>加权 quick-union<\/td><td><span class=\"katex-inline\">O(\\lg N)<\/span><\/td><td>两次找根加挂接<\/td><td><span class=\"katex-inline\">O(M\\lg N)<\/span><\/td><td>残留长路径可压缩<\/td><\/tr><tr><td>加权 + 路径压缩<\/td><td>平摊近常数<\/td><td>同左<\/td><td>趋近线性<\/td><td>不保存边与路径<\/td><\/tr><\/tbody><\/table><\/div>\n<p>表中 <span class=\"katex-inline\">M<\/span> 为操作次数、<span class=\"katex-inline\">N<\/span> 为对象数。改进链条的方向：把全数组扫描换成链上查找，再用挂接规则压住树高，再用压缩清理残留路径；每一步都对应访问次数的一个下降层级。<\/p>\n<h2>常见追问：并查集与等价类的边界<\/h2>\n<p>并查集维护的是&quot;无向、对称、可传递&quot;的归属关系。若问题带方向（A 信任 B 不等于 B 信任 A）、带权重（关系强度有数值）、需要记录关系产生的路径，union-find 都不够用，要回到图结构与遍历算法。判断用例是否适合并查集，先问三个问题：是否只判同类？是否无向？是否不需要边序列？三个都肯定，再选并查集。<\/p>\n<h2>追问：路径压缩的两种实现口径<\/h2>\n<ul><li>\n<strong>满压缩<\/strong>：<code>find<\/code> 上溯时把经过的全部结点直接挂到根；二次访问这些结点一步到根，压缩最彻底。\n<\/li><li>\n<strong>路径分裂/减半<\/strong>：上溯途中把结点改为挂祖父结点，逐步压平；单次改动少，多次访问后同样趋近平坦。\n<p>两种口径树高量级一致，差别在单次写入次数；书里标准实现配合加权使用，记住压缩对象是父链形状，不是分量归属。<\/p>\n<\/ul>\n<p>并查集初始化与计数规则再核对一遍：<code>id[i]=i<\/code>、<code>sz[i]=1<\/code>，分量计数 <code>count=N<\/code>；每次 <code>union<\/code> 先比较两 find，同根跳过，异根挂接后 <code>count--<\/code>。<code>find<\/code> 返回根结点标识，<code>connected<\/code> 比较两根；标识随合并变化，外部不能缓存旧根。这套规则在 Kruskal 环检测中原样复用：边两端同组则成环，异组则加入树并合并分量。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n等价关系的三条性质各是什么？它们怎样把对象划分成等价类？\n<\/li><li>\nquick-find 的代价集中在哪个操作上？为什么合并一次要扫描整个数组？\n<\/li><li>\n加权 quick-union 为什么把树高压在 <span class=\"katex-inline\">\\lg N<\/span> 以内？归纳论证的基例与合并步各是什么？\n<\/li><li>\n路径压缩与加权分别作用在哪个环节？只做其中一条会留下什么缺陷？\n<\/li><li>\n为什么不能把某次 <code>find<\/code> 返回的根结点缓存为长期标识？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "动态连通性与 union-find：加权 quick-union 与路径压缩"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：算法 第四版 Algorithms (4th Edition).pdf · p.209<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">增长数量级与算法分析的数学模型<\/a><\/span><\/div><h1>归并排序：自顶向下、自底向上与排序复杂度下界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch02（原书 §2.2 归并排序，PDF 第 209 页，印刷 170）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>归并排序是分治排序算法：把数组递归切成两半分别排序，再通过一次线性归并把两个有序段合成一个有序数组；实现分自顶向下（递归分解）与自底向上（按子数组宽度逐层归并）两条路线；最坏与平均代价均为 <span class=\"katex-inline\">N\\lg N<\/span>，需要与 <span class=\"katex-inline\">N<\/span> 成正比的辅助空间，排序结果稳定。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>选择、插入这类初级排序的总代价落在平方级：两层嵌套扫描或逐个相邻交换，<span class=\"katex-inline\">N<\/span> 增大时总量按 <span class=\"katex-inline\">N^2<\/span> 增长。需要一种最坏情形也保证 <span class=\"katex-inline\">N\\lg N<\/span> 的排序方案，并且在相等键较多时保持原有相对次序。<\/p>\n<p>不用分治会卡在两个地方。一是局部优化无法突破全局瓶颈：插入排序每次只消一个逆序对，逆序对上界 <span class=\"katex-inline\">N(N-1)/2<\/span>；要把代价压到 <span class=\"katex-inline\">N\\lg N<\/span>，必须改变组织方式，让大规模子问题先各自整理好再合并。二是合并环节缺乏规范：两个各自有序的段怎样拼成一个有序段，需要一个确定的线性过程，否则分治得到的两半无法衔接。<\/p>\n<p>归并排序给出的答案：归并操作把&quot;合并两个有序序列&quot;写成双指针线性扫描；排序主过程只管切分与递归，合并交给归并。后续快速排序、堆排序都在对照归并的代价与空间取舍。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>归并（merge）<\/strong>：输入两个各自有序的数组段，输出一个包含全部元素的有序数组。双指针分别指向两段起点，每次取两段中较小的元素复制回原数组；一段耗尽后复制另一段剩余部分。<\/p>\n<p><strong>原地归并抽象方法<\/strong>：书里 <code>merge(a, lo, mid, hi)<\/code> 把 <code>a[lo..mid]<\/code> 与 <code>a[mid+1..hi]<\/code> 归并回 <code>a[lo..hi]<\/code>。归并前把副本存入辅助数组 <code>aux[]<\/code>，扫描副本写回原数组；比较、复制过程线性。<\/p>\n<p><strong>自顶向下归并<\/strong>：<code>sort(a, lo, hi)<\/code> 递归：若段长足够小可切回插入排序；取中点 <code>mid=(lo+hi)/2<\/code>；排左半、排右半；调用 <code>merge<\/code> 合并。分解从上到下，合并从下到上。<\/p>\n<p><strong>自底向上归并<\/strong>：不用递归。子数组宽度 <span class=\"katex-inline\">sz<\/span> 从 1 开始，每轮把相邻两个宽度 <span class=\"katex-inline\">sz<\/span> 的段归并；<span class=\"katex-inline\">sz<\/span> 加倍（1,2,4,8,…）直到覆盖整个数组。适合链表实现或对递归深度敏感的场景。<\/p>\n<p><strong>复杂度口径<\/strong>：比较与访问总代价 <span class=\"katex-inline\">N\\lg N<\/span>；辅助数组保存一份副本，额外空间 <span class=\"katex-inline\">\\Theta(N)<\/span>；归并时相等键先取左侧元素，相等键相对次序不变，排序稳定。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">N=8<\/span>，宽度序列 1→2→4→8，三层归并。<strong>反例<\/strong>：把归并理解成&quot;两段分别排序后随便拼起来&quot;是错的，拼接口需要双指针选择，否则整体仍可能无序。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>递推建立<\/strong>：设 <span class=\"katex-inline\">T(N)<\/span> 为排序规模 <span class=\"katex-inline\">N<\/span> 的代价。切分两个子问题各 <span class=\"katex-inline\">T(N/2)<\/span>，合并线性 <span class=\"katex-inline\">cN<\/span>：<\/p>\n<div class=\"katex-block\">T(N)=2T(N/2)+cN,\\quad T(1)=1<\/div>\n<p><strong>分层展开<\/strong>：第 0 层一个规模 <span class=\"katex-inline\">N<\/span> 的问题；第 1 层两个规模 <span class=\"katex-inline\">N/2<\/span>；第 <span class=\"katex-inline\">k<\/span> 层 <span class=\"katex-inline\">2^k<\/span> 个规模 <span class=\"katex-inline\">N/2^k<\/span>。每层合并代价合计 <span class=\"katex-inline\">cN<\/span>；规模降到 1 需要 <span class=\"katex-inline\">\\lg N<\/span> 层。总代价：<\/p>\n<div class=\"katex-block\">T(N)=cN\\lg N+O(N)<\/div>\n<p>归为线性对数级 <span class=\"katex-inline\">N\\lg N<\/span>，最坏与平均同一量级。<\/p>\n<p><strong>合并线性性<\/strong>：归并双指针每比较一次复制一个元素，<span class=\"katex-inline\">N<\/span> 个元素最多 <span class=\"katex-inline\">N<\/span> 次比较加 <span class=\"katex-inline\">N<\/span> 次复制；单段耗尽后剩余元素一次复制。合并不回溯，不重复扫描，代价 <span class=\"katex-inline\">\\Theta(N)<\/span>。<\/p>\n<p><strong>稳定性来源<\/strong>：归并比较时若左段元素等于右段元素，先取左段；相等键在原数组中左段居前，合并后仍居前，相对次序保留。若取右侧优先，稳定性就被破坏。<\/p>\n<p><strong>排序下界对照<\/strong>：书中 §2.2.4 给出比较排序的下界结论：基于比较的排序算法最坏情形至少需要 <span class=\"katex-inline\">\\Omega(N\\lg N)<\/span> 次比较。归并排序达到这个下界方向的代价，比较次数上无法再用比较操作把最坏量级压低；线性时间排序（计数、基数）必须依赖键的附加结构，脱离比较模型。<\/p>\n<p><strong>归并过程中的指针状态<\/strong>：归并前副本在 <code>aux[]<\/code>，原数组段 <code>a[lo..hi]<\/code> 等待写回；左指针 <span class=\"katex-inline\">i<\/span>、右指针 <span class=\"katex-inline\">j<\/span>，输出位置 <span class=\"katex-inline\">k<\/span> 从 <code>lo<\/code> 起。每轮比较后写回 <code>a[k]<\/code> 并推进对应指针；循环条件覆盖两段全部元素，收尾复制剩余段。整轮归并不依赖段外元素。<\/p>\n<p><strong>与排序 API 的衔接<\/strong>：归并排序对所有元素实现 <code>Comparable<\/code> 接口的对象生效；比较统一走 <code>compareTo<\/code>，排序过程不修改元素键值。书中示例用字符串与字符序列演示归并分层，<code>merge<\/code> 方法是自顶向下与自底向上两条路线共用的部件。<\/p>\n<h2>适用条件与边界<\/h2>\n<p><strong>成立条件<\/strong>：<\/p>\n<ol><li>\n元素可通过 <code>compareTo<\/code> 比较大小；\n<\/li><li>\n内存允许分配与原数组等长的辅助空间；\n<\/li><li>\n需要稳定排序或最坏 <span class=\"katex-inline\">N\\lg N<\/span> 保证的场景。\n<\/ol>\n<p><strong>边界与失败案例<\/strong>：<\/p>\n<ul><li>\n空间受限环境：<span class=\"katex-inline\">\\Theta(N)<\/span> 辅助数组可能不可接受，堆排序常数空间更合适。\n<\/li><li>\n极小子数组：递归到底层段长很小时，方法调用开销超过归并收益；标准实现段长低于阈值（如 7）切回插入排序。\n<\/li><li>\n链表数据：归并在链表上只需改指针，不需要连续空间，是链表排序的常用路线。\n<\/li><li>\n外部排序：数据装不进内存时，归并思想用于多路归并外部文件，结构与本书内部归并一致。\n<\/li><li>\n归并不改键值：相等元素次序稳定，但元素内部其他字段不会被排序动作整理。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>归并排序 vs 快速排序<\/strong>：归并最坏 <span class=\"katex-inline\">N\\lg N<\/span>、稳定、空间 <span class=\"katex-inline\">N<\/span>；快排期望 <span class=\"katex-inline\">N\\lg N<\/span>、原地工作、最坏 <span class=\"katex-inline\">N^2<\/span>、不稳定。归并胜在最坏保证与稳定性，快排胜在常数小与空间省。\n<\/li><li>\n<strong>自顶向下 vs 自底向上<\/strong>：前者递归分解，代码直观；后者循环按宽度归并，无递归栈开销，链表实现更顺。两者合并环节相同，代价量级一致。\n<\/li><li>\n<strong>归并排序 vs 插入排序<\/strong>：插入是局部交换消逆序对，最坏平方级、近线性于部分有序输入；归并是分治合并，最坏稳定 <span class=\"katex-inline\">N\\lg N<\/span>，代价对输入分布不敏感。\n<\/li><li>\n<strong>归并 vs 选择排序<\/strong>：选择交换次数少但比较次数固定平方级；归并比较次数 <span class=\"katex-inline\">N\\lg N<\/span>，用合并环节换全局量级下降。\n<\/ul>\n<p><strong>归并与排序下界的关系<\/strong>：书中 §2.2.4 指出比较排序最坏情形至少需要 <span class=\"katex-inline\">\\Omega(N\\lg N)<\/span> 次比较；归并排序的 <span class=\"katex-inline\">N\\lg N<\/span> 落在这个下界方向，在比较模型内量级最优。理解这一点要分清：下界是对所有比较式排序的约束，不是归并独有的性质；要绕开它必须利用键的附加结构（整数范围、定长字符串），走非比较排序路线。<\/p>\n<p><strong>归并用例的输入形态<\/strong>：书里示例以字符序列与字符串数组演示分层合并；实际用例中元素可以是任意实现 <code>Comparable<\/code> 的对象，比较统一走 <code>compareTo<\/code>。归并过程不改动键值，只调整元素位置，因此相等键的次序保护是合并代码的直接结果，不是额外后处理。<\/p>\n<h2>联系<\/h2>\n<p>前置：c01 的频度求和、递推展开与量级归类。后继：c04 快速排序对照归并的分治路线；c05 堆排序提供常数空间的 <span class=\"katex-inline\">N\\lg N<\/span> 方案；第 3 章有序数组二分查找以归并排出的有序数组为前提。归并的&quot;分治 + 线性合并&quot;结构也是外部排序、链表排序的模板。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（归并排序：自顶向下、自底向上与排序复杂度下界）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：归并排序的递推展开、小例推演与下界对照<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要讲清归并排序的代价与性质，往回追五层：<\/p>\n<ol><li>\n<strong>比较模型<\/strong>：元素可比较大小，排序结论由比较结果决定；这是归并比较与稳定性讨论的前提。\n<\/li><li>\n<strong>有序段合并操作<\/strong>：双指针扫描两个有序段，每次取较小者；合并线性是分治成立的关键部件。\n<\/li><li>\n<strong>分治分解<\/strong>：数组切成两半，各自排序后合并；子问题规模减半，问题数量翻倍。\n<\/li><li>\n<strong>递推与分层计数<\/strong>：<span class=\"katex-inline\">T(N)=2T(N/2)+cN<\/span> 按层展开，每层合并代价合计 <span class=\"katex-inline\">cN<\/span>，层数 <span class=\"katex-inline\">\\lg N<\/span>。\n<\/li><li>\n<strong>代价与性质边界<\/strong>：<span class=\"katex-inline\">N\\lg N<\/span> 时间、<span class=\"katex-inline\">N<\/span> 空间、稳定性来源；对照比较排序下界，看清量级还能不能再压。\n<\/ol>\n<p>依赖链方向：可比较元素 → 线性归并 → 分治分解 → 递推分层 → 代价与边界。合并部件不成立，分治只是把无序两半拼在一起；递推不算清，<span class=\"katex-inline\">N\\lg N<\/span> 结论就没有依据。<\/p>\n<h2>正向推导：从归并操作到总代价<\/h2>\n<p><strong>第 1 步：归并单步规则。<\/strong> 设左段 <span class=\"katex-inline\">L[0..l-1]<\/span>、右段 <span class=\"katex-inline\">R[0..r-1]<\/span> 各自有序。指针 <span class=\"katex-inline\">i,j<\/span> 从 0 起：比较 <span class=\"katex-inline\">L[i]<\/span> 与 <span class=\"katex-inline\">R[j]<\/span>，取较小者写入输出；被取一侧指针前进。任一段耗尽，另一侧剩余整体复制。<\/p>\n<p><strong>第 2 步：单次合并代价。<\/strong> 每个元素被复制一次，共 <span class=\"katex-inline\">N=l+r<\/span> 次复制；比较次数不超过 <span class=\"katex-inline\">N-1<\/span>（末元素不再比较）。合并代价 <span class=\"katex-inline\">\\Theta(N)<\/span>，不回溯、不重复扫描。<\/p>\n<p><strong>第 3 步：递归分解。<\/strong> <code>sort(lo,hi)<\/code>：段长小于阈值转插入；中点 <code>mid=(lo+hi)/2<\/code>；<code>sort(lo,mid)<\/code>；<code>sort(mid+1,hi)<\/code>；<code>merge(lo,mid,hi)<\/code>。左右子问题规模约 <span class=\"katex-inline\">N/2<\/span>。<\/p>\n<p><strong>第 4 步：递推展开。<\/strong> <span class=\"katex-inline\">T(N)=2T(N/2)+cN<\/span>。按层：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>层<\/th><th>子问题数<\/th><th>子问题规模<\/th><th>该层合并代价<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>1<\/td><td><span class=\"katex-inline\">N<\/span><\/td><td><span class=\"katex-inline\">cN<\/span><\/td><\/tr><tr><td>1<\/td><td>2<\/td><td><span class=\"katex-inline\">N/2<\/span><\/td><td><span class=\"katex-inline\">cN<\/span><\/td><\/tr><tr><td>2<\/td><td>4<\/td><td><span class=\"katex-inline\">N/4<\/span><\/td><td><span class=\"katex-inline\">cN<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">k<\/span><\/td><td><span class=\"katex-inline\">2^k<\/span><\/td><td><span class=\"katex-inline\">N/2^k<\/span><\/td><td><span class=\"katex-inline\">cN<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>规模降到 1 时 <span class=\"katex-inline\">2^k=N<\/span>，<span class=\"katex-inline\">k=\\lg N<\/span>。总代价 <span class=\"katex-inline\">T(N)=cN\\lg N+O(N)<\/span>，线性对数级。<\/p>\n<p><strong>第 5 步：空间口径。<\/strong> 辅助数组 <code>aux[]<\/code> 与原数组等长，归并时先复制副本再写回；递归调用栈深 <span class=\"katex-inline\">\\lg N<\/span>。额外空间主项 <span class=\"katex-inline\">\\Theta(N)<\/span>，栈空间 <span class=\"katex-inline\">O(\\lg N)<\/span>。<\/p>\n<p><strong>第 6 步：稳定性核验。<\/strong> 比较出现 <span class=\"katex-inline\">L[i]==R[j]<\/span> 时取左侧元素。原数组中左段元素位置靠前，合并后仍靠前；相等键的相对次序保留。若代码写成右侧优先，相等键次序翻转，稳定性丢失。<\/p>\n<h2>数值算例一：两个有序段的逐步归并<\/h2>\n<p>左段 <span class=\"katex-inline\">L=[2,5,8]<\/span>，右段 <span class=\"katex-inline\">R=[3,6,9]<\/span>，输出空。<\/p>\n<ol><li>\n<span class=\"katex-inline\">i=0,j=0<\/span>：<span class=\"katex-inline\">L[0]=2<\/span> 与 <span class=\"katex-inline\">R[0]=3<\/span> 比较，取 2；输出 <span class=\"katex-inline\">[2]<\/span>，<span class=\"katex-inline\">i=1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">L[1]=5<\/span> 与 <span class=\"katex-inline\">R[0]=3<\/span> 比较，取 3；输出 <span class=\"katex-inline\">[2,3]<\/span>，<span class=\"katex-inline\">j=1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">L[1]=5<\/span> 与 <span class=\"katex-inline\">R[1]=6<\/span> 比较，取 5；输出 <span class=\"katex-inline\">[2,3,5]<\/span>，<span class=\"katex-inline\">i=2<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">L[2]=8<\/span> 与 <span class=\"katex-inline\">R[1]=6<\/span> 比较，取 6；输出 <span class=\"katex-inline\">[2,3,5,6]<\/span>，<span class=\"katex-inline\">j=2<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">L[2]=8<\/span> 与 <span class=\"katex-inline\">R[2]=9<\/span> 比较，取 8；输出 <span class=\"katex-inline\">[2,3,5,6,8]<\/span>，<span class=\"katex-inline\">i=3<\/span>，左段耗尽。\n<\/li><li>\n复制右段剩余 9；输出 <span class=\"katex-inline\">[2,3,5,6,8,9]<\/span>。\n<\/ol>\n<p>比较 5 次、复制 6 个元素，符合&quot;比较不超过 <span class=\"katex-inline\">N-1<\/span>、复制 <span class=\"katex-inline\">N<\/span>&quot;的口径。<\/p>\n<h2>数值算例二：<span class=\"katex-inline\">N=8<\/span> 的自顶向下递归树<\/h2>\n<p>输入 <span class=\"katex-inline\">[E,M,R,G,E,S,X,A]<\/span>（按书里归并示例的字母序列）。<\/p>\n<ol><li>\n顶层分 <span class=\"katex-inline\">[E,M,R,G]<\/span> 与 <span class=\"katex-inline\">[E,S,X,A]<\/span>。\n<\/li><li>\n左半再分 <span class=\"katex-inline\">[E,M]<\/span>、<span class=\"katex-inline\">[R,G]<\/span>；<span class=\"katex-inline\">[E,M]<\/span> 归并为 <span class=\"katex-inline\">[E,M]<\/span>，<span class=\"katex-inline\">[R,G]<\/span> 归并为 <span class=\"katex-inline\">[G,R]<\/span>，再合并左半 <span class=\"katex-inline\">[E,G,M,R]<\/span>。\n<\/li><li>\n右半分 <span class=\"katex-inline\">[E,S]<\/span>、<span class=\"katex-inline\">[X,A]<\/span>；归并为 <span class=\"katex-inline\">[E,S]<\/span>、<span class=\"katex-inline\">[A,X]<\/span>，再合并右半 <span class=\"katex-inline\">[A,E,S,X]<\/span>。\n<\/li><li>\n顶层合并两半得完整有序序列。\n<\/li><li>\n层数 <span class=\"katex-inline\">\\lg 8=3<\/span>；每层处理 8 个元素，合并访问合计 <span class=\"katex-inline\">8\\times3=24<\/span> 量级。\n<\/ol>\n<p>自底向上对照：宽度 <span class=\"katex-inline\">sz=1<\/span> 归并相邻单元素对；<span class=\"katex-inline\">sz=2<\/span> 归并相邻双元素段；<span class=\"katex-inline\">sz=4<\/span> 归并四元素段；<span class=\"katex-inline\">sz=8<\/span> 完成。三轮扫描，与递归树层数一致。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：辅助数组复用混乱。<\/strong> 归并时每轮都新建数组，空间开销叠加；标准实现复用同一个 <code>aux[]<\/code>，归并前复制副本。复盘：辅助空间主项是一份等长副本，重复分配会把空间代价抬到多份 <span class=\"katex-inline\">N<\/span>。<\/p>\n<p><strong>案例 2：小子数组仍走递归。<\/strong> 段长 2、3 时递归调用与合并的固定开销超过比较收益；标准实现设阈值（如 7），段内转插入排序。复盘：分治收益在大规模子问题显现，底层小段用简单排序更省。<\/p>\n<p><strong>案例 3：合并取右侧优先破坏稳定性。<\/strong> 相等键先取右段，原居前的左段元素被排到后面；多级排序场景下次键次序被打乱。复盘：稳定性是合并代码的选择方向决定的，不是自动获得。<\/p>\n<p><strong>案例 4：把归并当原地排序宣传。<\/strong> 书里标准归并靠辅助数组完成合并；&quot;原地归并&quot;在原数组内挪动两段，实现复杂且常数代价高。复盘：归并的 <span class=\"katex-inline\">N<\/span> 空间代价是标准路线的组成部分，选型时不能省掉这条。<\/p>\n<p><strong>案例 5：输入已有序仍按全流程递归。<\/strong> 归并对有序输入不做特殊短路，比较次数仍 <span class=\"katex-inline\">N\\lg N<\/span>；插入排序在有序输入上接近线性。复盘：归并代价对分布不敏感，既是稳定保证，也意味着部分有序场景没有额外红利。<\/p>\n<h2>延伸：比较排序下界对照<\/h2>\n<p>基于比较的排序，每次比较只得到&quot;谁大谁小&quot;的分支信息。<span class=\"katex-inline\">N<\/span> 个元素共有 <span class=\"katex-inline\">N!<\/span> 种排列，排序结果要区分这些排列；决策树叶结点至少 <span class=\"katex-inline\">N!<\/span> 个，树高 <span class=\"katex-inline\">h<\/span> 满足 <span class=\"katex-inline\">2^h\\ge N!<\/span>。由斯特林方向估计 <span class=\"katex-inline\">\\lg(N!)\\approx N\\lg N-N<\/span>，故 <span class=\"katex-inline\">h=\\Omega(N\\lg N)<\/span>。<\/p>\n<p>结论：任何比较排序最坏情形比较次数不会低于 <span class=\"katex-inline\">N\\lg N<\/span> 量级。归并排序达到 <span class=\"katex-inline\">N\\lg N<\/span>，在比较模型内量级最优；要突破这个下界，必须利用键的附加结构（如整数范围、字符串长度），走计数排序、基数排序一类非比较路线。<\/p>\n<h2>差生通读检查<\/h2>\n<p><strong>卡点 1：递推式不会展开。<\/strong> 补步骤：先写清每层子问题数与规模，再算每层合并代价；层数由规模降到 1 的倍数次数给出。拿不准就画 <span class=\"katex-inline\">N=8<\/span> 的递归树逐层标数字。<\/p>\n<p><strong>卡点 2：分不清归并的比较与复制。<\/strong> 补步骤：比较发生在两指针之间，每次比较决定取谁；复制是把选中元素写回输出位置。比较次数上界 <span class=\"katex-inline\">N-1<\/span>，复制次数 <span class=\"katex-inline\">N<\/span>，两件事分开计数。<\/p>\n<p><strong>卡点 3：自顶向下与自底向上混为一谈。<\/strong> 补步骤：前者从整段递归拆到小段，再逐层合并；后者从单元素宽度起步，循环加倍归并。合并函数相同，分解方向不同。<\/p>\n<p><strong>卡点 4：稳定性来源找不到。<\/strong> 补步骤：定位合并循环中相等键的分支；规则是相等取左，次序保留。检查自己的实现：相等时有没有偏向右侧。<\/p>\n<h2>算例三：<span class=\"katex-inline\">N=8<\/span> 各轮归并的比较与复制计数<\/h2>\n<p>设输入 8 个元素，自顶向下归并。<\/p>\n<ol><li>\n第 1 层（最底层）：4 对单元素归并，每对比较 1 次、复制 2 个元素；合计比较 4 次、复制 8 个。\n<\/li><li>\n第 2 层：2 对双元素段归并，每段 4 个元素，比较不超过 3 次；合计比较约 6 次、复制 8 个。\n<\/li><li>\n第 3 层：整段 8 元素归并，比较不超过 7 次、复制 8 个。\n<\/li><li>\n比较合计约 <span class=\"katex-inline\">4+6+7=17<\/span> 次量级，复制合计 <span class=\"katex-inline\">8\\times3=24<\/span> 个；层数 <span class=\"katex-inline\">\\lg 8=3<\/span>，每层复制 8 个元素，与分层展开口径一致。\n<\/li><li>\n推广 <span class=\"katex-inline\">N<\/span>：复制总量 <span class=\"katex-inline\">N\\lg N<\/span>，比较总量上界 <span class=\"katex-inline\">N\\lg N<\/span>；实际比较随输入有序程度略低，但量级不变。\n<\/ol>\n<h2>路线属性对照表<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>路线<\/th><th>分解方式<\/th><th>递归栈<\/th><th>典型场景<\/th><th>共同部件<\/th><\/tr><\/thead><tbody><tr><td>自顶向下<\/td><td>递归拆半到小段<\/td><td><span class=\"katex-inline\">\\lg N<\/span><\/td><td>数组排序、教学直观<\/td><td>merge 归并<\/td><\/tr><tr><td>自底向上<\/td><td>宽度 1,2,4,… 循环归并<\/td><td>无递归栈<\/td><td>链表排序、栈深敏感环境<\/td><td>merge 归并<\/td><\/tr><tr><td>链表归并<\/td><td>改指针拼接，不复制元素<\/td><td>视实现<\/td><td>链式结构排序<\/td><td>双指针选择规则<\/td><\/tr><tr><td>外部归并<\/td><td>多路归并磁盘文件<\/td><td>与文件块数相关<\/td><td>数据超内存场景<\/td><td>有序段合并<\/td><\/tr><\/tbody><\/table><\/div>\n<p>表中四条路线共享同一合并规则：双指针取小、耗尽复制剩余；差别只在分解方向与存储介质。<\/p>\n<h2>延伸：归并思想在外部排序中的形态<\/h2>\n<p>数据装不进内存时，外部排序先把文件切成块读入内存，块内用内部排序排好写出；再多路归并这些有序块，逐轮合并成大有序段。归并的线性合并部件不变，只是输入输出从内存数组换成磁盘文件块。归并排序稳定、最坏 <span class=\"katex-inline\">N\\lg N<\/span> 的性质延续到外部场景；代价口径加入磁盘读写次数，不只是内存比较次数。<\/p>\n<h2>第二组复盘：归并与其他排序的边界<\/h2>\n<p><strong>复盘 1：归并不是原地排序。<\/strong> 标准路线靠 <code>aux[]<\/code> 副本合并；若环境只允许原数组内操作，归并的实现复杂度与常数上升，选型应改堆排。复盘时先列空间约束，再谈时间量级。<\/p>\n<p><strong>复盘 2：归并不利用输入有序性。<\/strong> 即使输入已有序，递归与合并流程不短路；插入排序在有序输入上线性。若业务数据长期接近有序，插入或希尔可能更贴合；归并的价值是最坏保证与稳定。<\/p>\n<p><strong>复盘 3：合并稳定性被比较分支决定。<\/strong> 代码中相等键取左则稳定，取右则破坏；审查实现时先定位相等分支，不要默认排序天然稳定。<\/p>\n<p><strong>复盘 4：辅助数组复用不当。<\/strong> 每轮归并新建数组会把空间抬到多份 <span class=\"katex-inline\">N<\/span>；标准实现全程复用一个等长 <code>aux[]<\/code>，归并前复制副本。<\/p>\n<h2>算例四：同一输入两种排序的计数对照<\/h2>\n<p>取数组 <span class=\"katex-inline\">[3,1,4,2]<\/span>。<\/p>\n<p><strong>归并路线<\/strong>：<\/p>\n<ol><li>\n分半：<span class=\"katex-inline\">[3,1]<\/span>、<span class=\"katex-inline\">[4,2]<\/span>；各自归并为 <span class=\"katex-inline\">[1,3]<\/span>、<span class=\"katex-inline\">[2,4]<\/span>。\n<\/li><li>\n顶层合并：<span class=\"katex-inline\">1&lt;2<\/span> 取 1，<span class=\"katex-inline\">3&gt;2<\/span> 取 2，<span class=\"katex-inline\">3&lt;4<\/span> 取 3，取 4；比较 3 次、复制 4 个。\n<\/li><li>\n总比较约 4 次量级，递归两层；最坏与期望同属 <span class=\"katex-inline\">N\\lg N<\/span>。\n<\/ol>\n<p><strong>插入路线<\/strong>：<\/p>\n<ol><li>\n1 就位；3 前插与 1 比较；4 就位；2 与 4、3 各交换一次。\n<\/li><li>\n逆序对：<span class=\"katex-inline\">(3,1),(3,2),(4,2)<\/span> 共 3 个，交换 3 次；最坏情形逆序对上界 <span class=\"katex-inline\">N(N-1)/2<\/span>。\n<\/li><li>\n小规模两者接近；<span class=\"katex-inline\">N<\/span> 增大后归并按 <span class=\"katex-inline\">N\\lg N<\/span> 增长，插入按 <span class=\"katex-inline\">N^2<\/span> 增长，差距拉开。\n<\/ol>\n<h2>递推层级展开表（一般 <span class=\"katex-inline\">N<\/span>）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>层<\/th><th>子问题数<\/th><th>单问题规模<\/th><th>该层合并代价<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>1<\/td><td><span class=\"katex-inline\">N<\/span><\/td><td><span class=\"katex-inline\">cN<\/span><\/td><\/tr><tr><td>1<\/td><td>2<\/td><td><span class=\"katex-inline\">N/2<\/span><\/td><td><span class=\"katex-inline\">cN<\/span><\/td><\/tr><tr><td>2<\/td><td>4<\/td><td><span class=\"katex-inline\">N/4<\/span><\/td><td><span class=\"katex-inline\">cN<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">k<\/span><\/td><td><span class=\"katex-inline\">2^k<\/span><\/td><td><span class=\"katex-inline\">N/2^k<\/span><\/td><td><span class=\"katex-inline\">cN<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\lg N<\/span><\/td><td><span class=\"katex-inline\">N<\/span><\/td><td>1<\/td><td><span class=\"katex-inline\">cN<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>层数由 <span class=\"katex-inline\">N/2^k=1<\/span> 解出 <span class=\"katex-inline\">k=\\lg N<\/span>；每层合并 <span class=\"katex-inline\">N<\/span> 个元素，总代价 <span class=\"katex-inline\">cN\\lg N+O(N)<\/span>。辅助数组一份等长副本，递归栈深 <span class=\"katex-inline\">\\lg N<\/span>。<\/p>\n<h2>排序路线属性复盘补充<\/h2>\n<p><strong>复盘 5：归并在链表上的形态。<\/strong> 链表归并不复制元素副本，改指针拼接；双指针选小结点，把结点挂到合并链尾。链表排序常走归并，正是因为不需要连续数组空间。<\/p>\n<p><strong>复盘 6：归并稳定性的实际用途。<\/strong> 多级排序先按次键排，再按主键排；稳定算法保证第二次排序不破坏第一次的次键次序。若主键排序不稳定，同班同学的学号次序会被打乱，多级排序叠加失效。<\/p>\n<p><strong>复盘 7：自底向上的适用场景。<\/strong> 递归栈敏感的环境、链表实现、外部文件块归并，都按宽度 1,2,4,… 循环归并；合并函数与自顶向下共用，差别只在分解方向。<\/p>\n<h2>归并排序的工程变体口径<\/h2>\n<ul><li>\n<strong>原地归并<\/strong>：不另开辅助数组，在原数组内挪动两段；实现复杂、常数代价高，标准教材路线仍用副本辅助。\n<\/li><li>\n<strong>链表归并<\/strong>：改指针拼接，无需连续空间；双指针选小结点挂到合并链尾，是链表排序常用路线。\n<\/li><li>\n<strong>外部归并<\/strong>：数据超内存时先分块内排序写出，再多路归并有序块；合并部件与内部归并一致，代价口径加入磁盘读写。\n<\/li><li>\n<strong>小规模切换<\/strong>：段长低于阈值转插入排序；递归到底层的方法调用开销超过归并收益，这一改进在快排中同样出现。\n<\/ul>\n<p>变体之间共享同一条合并规则：双指针取小、耗尽复制剩余；差别只在存储介质与分解方向。分析变体代价时，时间量级看分治层数，空间口径看副本或指针开销。<\/p>\n<h2>与插入、希尔的定位对照<\/h2>\n<p>插入排序消逆序对，最坏平方、近线性于部分有序；希尔按间隔分组插入，突破平方瓶颈但不是最坏 <span class=\"katex-inline\">N\\lg N<\/span> 保证；归并以分治换稳定对数级代价。选择排序交换少但比较固定平方级。实际选型：小样本或近有序用插入，通用稳定保证用归并，空间受限用堆排，平均性能优先用快排。归并的稳定性质在多级排序中不可替代：第二次排序不破坏第一次的次键次序。<\/p>\n<h2>复杂度下界与归并位置<\/h2>\n<p>比较排序决策树叶结点至少 <span class=\"katex-inline\">N!<\/span> 个排列；树高 <span class=\"katex-inline\">h<\/span> 满足 <span class=\"katex-inline\">2^h\\ge N!<\/span>，由 <span class=\"katex-inline\">\\lg(N!)\\approx N\\lg N-N<\/span> 得 <span class=\"katex-inline\">h=\\Omega(N\\lg N)<\/span>。归并排序 <span class=\"katex-inline\">N\\lg N<\/span> 落在下界方向，比较模型内量级最优。绕开下界只能利用键附加结构：整数范围走计数排序，定长字符串走基数排序，这些不依赖两两比较。<\/p>\n<p>归并的稳定性质来自合并分支：相等键先取左侧。审查实现时先定位相等分支；若右侧优先，稳定性即被破坏。多级排序场景下，第一次按次键排好的次序必须被第二次主键排序保留，稳定算法是这种叠加的前提。<\/p>\n<p>归并空间口径再记：辅助数组一份等长副本，递归栈深 <span class=\"katex-inline\">\\lg N<\/span>；外部归并把副本换成磁盘块，时间量级仍按分治层数，空间代价加入块读写。<\/p>\n<h2>归并过程的指针状态再核<\/h2>\n<p>归并前副本在 <code>aux[]<\/code>，原数组段等待写回；左指针 <span class=\"katex-inline\">i<\/span>、右指针 <span class=\"katex-inline\">j<\/span>，输出位置 <span class=\"katex-inline\">k<\/span> 从段首起。每轮比较后写回 <code>a[k]<\/code> 并推进对应指针；循环覆盖两段全部元素，收尾复制剩余段。整轮归并不依赖段外元素。自顶向下递归分解，自底向上按宽度循环归并；合并函数两条路线共用。<\/p>\n<p>归并代价对输入分布不敏感：有序输入不短路，比较次数仍按 <span class=\"katex-inline\">N\\lg N<\/span> 口径；插入排序在有序输入上接近线性。这既是稳定保证，也是部分有序场景下没有额外红利的原因。选路线时把稳定性、空间预算、输入形态三项并列权衡。<\/p>\n<p>归并排序的两条实现路线共享合并部件：自顶向下递归拆半，自底向上宽度加倍。底层小段切插入排序降低调用开销；链表归并改指针拼接，外部归并换磁盘块。比较模型内 <span class=\"katex-inline\">N\\lg N<\/span> 达下界方向；非比较排序才可能绕开这个量级。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出归并排序的递推式并分层展开，总代价归入哪一级？\n<\/li><li>\n单次归并的比较次数与复制次数各是什么口径？一段耗尽后剩余元素怎样处理？\n<\/li><li>\n归并排序为什么稳定？代码中哪一个分支决定稳定性？\n<\/li><li>\n自顶向下与自底向上两条路线的差别在哪里？合并环节是否相同？\n<\/li><li>\n比较排序的 <span class=\"katex-inline\">\\Omega(N\\lg N)<\/span> 下界怎样由排列数与决策树推出？非比较排序凭什么绕开它？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "归并排序：自顶向下、自底向上与排序复杂度下界"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：算法 第四版 Algorithms (4th Edition).pdf · p.221<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">归并排序：自顶向下、自底向上与排序复杂度下界<\/a><\/span><\/div><h1>快速排序：切分过程、性能改进与三向切分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch02（原书 §2.3 快速排序，PDF 第 221 页，印刷 182）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>快速排序是原地分治排序：取一个标定元素，通过切分把数组整理成左侧元素不大于标定、右侧元素不小于标定，标定落到最终位置后递归排序两侧；期望代价 <span class=\"katex-inline\">N\\lg N<\/span>，最坏情形 <span class=\"katex-inline\">N^2<\/span>，额外空间为递归栈深 <span class=\"katex-inline\">\\lg N<\/span> 量级；随机打乱、小子数组转插入、三向切分是针对不同缺陷的改进。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>归并排序给出最坏 <span class=\"katex-inline\">N\\lg N<\/span> 保证，但需要与 <span class=\"katex-inline\">N<\/span> 成正比的辅助数组；工程上常需要一种原地工作、常数因子更小的 <span class=\"katex-inline\">N\\lg N<\/span> 方向排序。快速排序把合并环节省掉，改在切分环节整理次序，递归只处理两侧子数组。<\/p>\n<p>不用切分式分治会遇到两类问题。一是原地排序的代价权衡：若仍靠相邻交换消逆序对，总量回到平方级；快排用一次扫描把元素分到标定两侧，让每个元素在切分中只参与常数次比较。二是切分质量不确定：标定若始终落在端点，一侧子问题为空，递推退化；重复键集中时二向切分反复把等值元素左右搬运。快排的改进措施正是围绕这两类问题展开。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>切分（partition）<\/strong>：取 <code>a[lo]<\/code>（或随机元素）作标定 <code>v<\/code>。左指针从 <code>lo+1<\/code> 向右扫，遇到不小于 <code>v<\/code> 停；右指针从 <code>hi<\/code> 向左扫，遇到不大于 <code>v<\/code> 停；两指针停住后交换两元素，继续扫描。两指针相遇时，把标定与相遇点元素交换，标定落位。<\/p>\n<p><strong>落位含义<\/strong>：切分结束后，标定左侧全部 <span class=\"katex-inline\">\\le v<\/span>，右侧全部 <span class=\"katex-inline\">\\ge v<\/span>；标定所在下标就是它在有序数组中的最终位置。后续递归不移动标定。<\/p>\n<p><strong>递归结构<\/strong>：<code>sort(lo,hi)<\/code> 调用 <code>partition<\/code> 得到标定下标 <span class=\"katex-inline\">j<\/span>，再 <code>sort(lo,j-1)<\/code> 与 <code>sort(j+1,hi)<\/code>。子问题互不重叠，标定不再参与后续切分。<\/p>\n<p><strong>期望代价<\/strong>：随机输入下，每次切分把数组分成大小相近的两段，递推与归并同形，期望 <span class=\"katex-inline\">N\\lg N<\/span>；快排内层循环简洁，常数因子通常小于归并。<\/p>\n<p><strong>最坏代价<\/strong>：切分始终一端为空（输入有序且取端点标定），递推 <span class=\"katex-inline\">T(N)=T(N-1)+cN<\/span>，求和得 <span class=\"katex-inline\">N^2/2<\/span> 量级。<\/p>\n<p><strong>三向切分<\/strong>：把数组分成三段——小于 <span class=\"katex-inline\">v<\/span>、等于 <span class=\"katex-inline\">v<\/span>、大于 <span class=\"katex-inline\">v<\/span>；等于标定的元素归在中间，递归只处理两侧。对付大量重复键时避免等值元素反复参与切分比较。<\/p>\n<p><strong>正例<\/strong>：小数组切分后标定两侧各自有序逼近。<strong>反例<\/strong>：切分不检查指针越界，扫描可能跑出段外；标定交换位置写错会留下越界或相等键倒置。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>期望代价的分治口径<\/strong>：随机排列下，标定落到第 <span class=\"katex-inline\">k<\/span> 小位置的概率均等。两侧规模 <span class=\"katex-inline\">k-1<\/span> 与 <span class=\"katex-inline\">N-k<\/span>；所有切分位置平均后，递归树每层合计 <span class=\"katex-inline\">O(N)<\/span> 比较，层数 <span class=\"katex-inline\">\\lg N<\/span>，期望总代价 <span class=\"katex-inline\">cN\\lg N<\/span>。依据：分治两侧规模之和为 <span class=\"katex-inline\">N-1<\/span>，每层扫描总量线性；均衡切分使层数对数增长。<\/p>\n<p><strong>最坏退化推导<\/strong>：若标定始终取端点，一侧规模 <span class=\"katex-inline\">N-1<\/span>、一侧为空。递推：<\/p>\n<div class=\"katex-block\">T(N)=T(N-1)+cN<\/div>\n<p>展开 <span class=\"katex-inline\">T(N)=cN+c(N-1)+\\cdots+c\\cdot1=cN(N+1)/2<\/span>，主导项 <span class=\"katex-inline\">N^2/2<\/span>，归平方级。退化条件是输入有序（或逆序）叠加端点标定；随机打乱使有序输入的概率后果分散，最坏情形不再由固定输入路径触发。<\/p>\n<p><strong>三向切分的收益<\/strong>：二向切分中，等值元素在两侧间反复比较；三向切分把等值段一次分出，递归跳过中间段。重复键越多，省下的比较越多；等值键全相同时，三向切分一次扫描完成，线性级。<\/p>\n<p><strong>栈深口径<\/strong>：递归深度等于切分树高。均衡切分栈深 <span class=\"katex-inline\">\\lg N<\/span>；退化切分栈深 <span class=\"katex-inline\">N<\/span>。实现可优先切分较小一侧、迭代处理另一侧，把栈深压到 <span class=\"katex-inline\">\\lg N<\/span> 量级。<\/p>\n<p><strong>切分的循环不变量<\/strong>：扫描过程中，<code>lo+1..i-1<\/code> 区间元素不大于标定，<code>j+1..hi<\/code> 区间元素不小于标定；相遇点把两侧隔开。不变量保证切分结束后标定左侧、右侧方向正确；指针越界检查是不变量不被破坏的护栏。<\/p>\n<p><strong>快排的内循环特征<\/strong>：切分扫描只做比较与交换，不调用复杂方法，内层循环简洁；这是快排平均常数因子小于归并的直接来源。对照归并每轮要复制一份副本，快排数据始终在原数组内挪动，写入量更小。<\/p>\n<h2>适用条件与边界<\/h2>\n<p><strong>成立条件<\/strong>：<\/p>\n<ol><li>\n元素可比较；排序原地进行，允许递归栈开销；\n<\/li><li>\n输入可在排序前随机打乱，或标定随机选取；\n<\/li><li>\n接受期望保证而非最坏保证。\n<\/ol>\n<p><strong>边界与失败案例<\/strong>：<\/p>\n<ul><li>\n最坏 <span class=\"katex-inline\">N^2<\/span> 不能靠代码消除，只能靠随机化压低触发概率；要求最坏硬保证的场景选归并或堆排。\n<\/li><li>\n不稳定：切分交换会改变相等键相对次序，多级排序慎用。\n<\/li><li>\n重复键少的场景，三向切分额外分组代价收益有限；大量重复键场景收益明显。\n<\/li><li>\n小数组递归调用开销可观，阈值以下转插入排序。\n<\/li><li>\n栈深管理：不限制递归侧选择，退化输入下栈深可达 <span class=\"katex-inline\">N<\/span>。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>快排 vs 归并<\/strong>：快排原地、常数小、期望 <span class=\"katex-inline\">N\\lg N<\/span>、最坏 <span class=\"katex-inline\">N^2<\/span>、不稳定；归并最坏 <span class=\"katex-inline\">N\\lg N<\/span>、稳定、空间 <span class=\"katex-inline\">N<\/span>。原地性与最坏保证二者权衡。\n<\/li><li>\n<strong>二向切分 vs 三向切分<\/strong>：二向分左右两段，等值元素跨两侧搬运；三向分出等值中段，重复键场景代价更低。键分布随机、重复少时两者接近。\n<\/li><li>\n<strong>快排 vs 堆排<\/strong>：堆排最坏 <span class=\"katex-inline\">N\\lg N<\/span>、常数空间；快排期望更快但最坏退化、不稳定。需要最坏保证用堆排，平均性能优先用快排。\n<\/li><li>\n<strong>标定选择<\/strong>：取端点标定对有序输入最坏；随机选标定或打乱输入，使切分位置不可被固定输入针对。\n<\/ul>\n<p><strong>快排的比较模型与随机性<\/strong>：期望分析假设输入排列随机，标定等概率落到各位置；工程上先打乱数组或随机选标定，使固定输入无法定向触发退化。最坏 <span class=\"katex-inline\">N^2<\/span> 是递推上界，不能在代码层消除，只能靠随机化压低触发概率。两个口径必须分开陈述：期望 <span class=\"katex-inline\">N\\lg N<\/span> 回答平均表现，最坏 <span class=\"katex-inline\">N^2<\/span> 回答风险上界。<\/p>\n<p><strong>与插入排序的边界衔接<\/strong>：标准快排在小子数组上切分收益低于递归开销，阈值以下转插入排序；这与 c03 归并的底层处理一致。快排内循环简洁、原地挪动，常数因子通常小于归并；代价是最坏退化与不稳定，选型时按稳定性要求、空间预算、重复键比例权衡。<\/p>\n<p><strong>切分不变量与越界护栏<\/strong>：扫描过程中 <code>lo+1..i-1<\/code> 不大于标定，<code>j+1..hi<\/code> 不小于标定；指针必须检查越界，否则扫描跑出段外。标定落位后两侧子问题互不重叠，标定不再参与后续切分。快排的内循环只做比较与交换，方法调用少，这是其平均常数因子小的直接来源。<\/p>\n<p><strong>三向切分的分组边界<\/strong>：<code>lt<\/code>、<code>i<\/code>、<code>gt<\/code> 把段分为小于、等于、未处理、大于四段；扫描中小于与左边界交换、大于与右边界交换，等于直接前进。等于段一次分出，递归只处理两侧；全同键输入一次扫描完成，线性级。<\/p>\n<h2>联系<\/h2>\n<p>前置：c01 递推展开与量级归类；c03 归并分治结构作对照。后继：c05 堆排序提供最坏 <span class=\"katex-inline\">N\\lg N<\/span> 的另一路线；第 3 章符号表插入/查找的期望分析复用&quot;随机输入下结构形状摊平&quot;的口径。快排切分与 c08 散列的均匀抽样假设都依赖随机化打破固定输入路径。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（快速排序：切分过程、性能改进与三向切分）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：切分推演、退化递推与改进措施对照<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>讲清快速排序，往回追五层：<\/p>\n<ol><li>\n<strong>比较与交换规则<\/strong>：元素可比较，切分靠指针扫描与交换整理次序；这是所有分区动作的基础。\n<\/li><li>\n<strong>切分环节<\/strong>：标定选取、双指针停住条件、相遇交换；一次扫描把元素分到标定两侧。\n<\/li><li>\n<strong>分治递归<\/strong>：标定落位后两侧子问题独立递归；子问题规模由切分位置决定。\n<\/li><li>\n<strong>代价口径<\/strong>：期望 <span class=\"katex-inline\">N\\lg N<\/span> 来自均衡切分的分层扫描；最坏 <span class=\"katex-inline\">N^2<\/span> 来自一端为空的退化切分。\n<\/li><li>\n<strong>改进与边界<\/strong>：随机化打破固定输入路径，阈值转插入降低底层开销，三向切分处理重复键；稳定性与栈深是固有边界。\n<\/ol>\n<p>依赖链方向：比较规则 → 切分扫描 → 分治递归 → 代价分层 → 改进措施。切分环节规则错，递归两侧的结论就不成立；代价口径不分期望与最坏，选型会误读快排保证程度。<\/p>\n<h2>正向推导：切分与递归逐步走<\/h2>\n<p><strong>第 1 步：选标定。<\/strong> 标准实现取段首元素 <code>v=a[lo]<\/code>；随机化路线先打乱数组，或从段内随机取元素换到段首。<\/p>\n<p><strong>第 2 步：左指针扫描。<\/strong> 指针 <span class=\"katex-inline\">i<\/span> 从 <code>lo+1<\/code> 向右，只要 <code>a[i] &lt; v<\/code> 继续前进，遇到 <code>a[i] &gt;= v<\/code> 停住。 <strong>第 3 步：右指针扫描。<\/strong> 指针 <span class=\"katex-inline\">j<\/span> 从 <code>hi<\/code> 向左，只要 <code>a[j] &gt; v<\/code> 继续后退，遇到 <code>a[j] &lt;= v<\/code> 停住。 <strong>第 4 步：交换并继续。<\/strong> <span class=\"katex-inline\">i,j<\/span> 未相遇则交换 <code>a[i]<\/code> 与 <code>a[j]<\/code>，两指针各进一步，重复扫描。 <strong>第 5 步：落位。<\/strong> 两指针交叉相遇，把标定 <code>a[lo]<\/code> 与相遇点元素交换；此时下标 <span class=\"katex-inline\">j<\/span> 左侧 <span class=\"katex-inline\">\\le v<\/span>、右侧 <span class=\"katex-inline\">\\ge v<\/span>，标定进入最终位置。 <strong>第 6 步：递归。<\/strong> <code>sort(lo, j-1)<\/code>、<code>sort(j+1, hi)<\/code>；标定 <span class=\"katex-inline\">j<\/span> 不再参与后续切分。<\/p>\n<p><strong>期望代价推导<\/strong>：随机排列下，标定等概率落到第 <span class=\"katex-inline\">k<\/span> 位。两侧规模 <span class=\"katex-inline\">k-1<\/span> 与 <span class=\"katex-inline\">N-k<\/span>；每轮切分扫描 <span class=\"katex-inline\">N<\/span> 个元素，递归树每层合计 <span class=\"katex-inline\">O(N)<\/span>，层数 <span class=\"katex-inline\">\\lg N<\/span>，期望 <span class=\"katex-inline\">cN\\lg N<\/span>。依据：两侧规模之和固定为 <span class=\"katex-inline\">N-1<\/span>，均衡切分使子问题数量翻倍、规模减半，与归并分层同形。<\/p>\n<p><strong>最坏退化推导<\/strong>：标定始终取端点，一侧为空、一侧规模 <span class=\"katex-inline\">N-1<\/span>：<\/p>\n<div class=\"katex-block\">T(N)=T(N-1)+cN<\/div>\n<p>逐层展开：<\/p>\n<div class=\"katex-block\">T(N)=cN+c(N-1)+\\cdots+c\\cdot1=c\\frac{N(N+1)}{2}<\/div>\n<p>主导项 <span class=\"katex-inline\">N^2/2<\/span>，平方级。触发条件：输入有序（或逆序）且标定取端点；代码无法排除这条路径，只能用随机化让固定输入无法定向触发。<\/p>\n<p><strong>三向切分推导<\/strong>：维护三个边界 <span class=\"katex-inline\">lt<\/span>、<span class=\"katex-inline\">i<\/span>、<span class=\"katex-inline\">gt<\/span>，区间划分为 <span class=\"katex-inline\">[lo,lt)<\/span> 小于 <span class=\"katex-inline\">v<\/span>、<span class=\"katex-inline\">[lt,i)<\/span> 等于 <span class=\"katex-inline\">v<\/span>、<span class=\"katex-inline\">[i,gt]<\/span> 未处理、<span class=\"katex-inline\">(gt,hi]<\/span> 大于 <span class=\"katex-inline\">v<\/span>。扫描 <span class=\"katex-inline\">i<\/span>：<code>a[i]&lt;v<\/code> 与 <span class=\"katex-inline\">lt<\/span> 交换后 <span class=\"katex-inline\">lt,i<\/span> 前进；<code>a[i]&gt;v<\/code> 与 <span class=\"katex-inline\">gt<\/span> 交换后 <span class=\"katex-inline\">gt<\/span> 后退；相等则 <span class=\"katex-inline\">i<\/span> 前进。结束后递归小于段与大于段，等于段跳过。<\/p>\n<h2>数值算例一：小数组切分逐步走<\/h2>\n<p>取数组 <span class=\"katex-inline\">[5,2,7,1,3,6,4]<\/span>，标定 <span class=\"katex-inline\">v=5<\/span>（段首）。<\/p>\n<ol><li>\n<span class=\"katex-inline\">i<\/span> 从 2 出发：<code>2&lt;5<\/code> 过，<code>7&gt;=5<\/code> 停在 7；<span class=\"katex-inline\">j<\/span> 从末位：<code>4&lt;=5<\/code> 停在 4。交换 7 与 4：数组 <span class=\"katex-inline\">[5,2,4,1,3,6,7]<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">i<\/span> 前进到 6：<code>6&gt;=5<\/code> 停；<span class=\"katex-inline\">j<\/span> 后退到 3：<code>3&lt;=5<\/code> 停。交换 6 与 3：<span class=\"katex-inline\">[5,2,4,1,3,6,7]<\/span> 交换后位置变为 <span class=\"katex-inline\">[5,2,4,1,3,6,7]<\/span> 中 <span class=\"katex-inline\">i,j<\/span> 指向元素互换，得 <span class=\"katex-inline\">[5,2,4,1,3,6,7]<\/span> 继续。\n<\/li><li>\n指针相遇后，标定 5 与相遇点交换：落位后左侧 <span class=\"katex-inline\">[2,4,1,3]<\/span>，右侧 <span class=\"katex-inline\">[6,7]<\/span>，5 在最终位置。\n<\/li><li>\n递归两侧：左段 <span class=\"katex-inline\">[2,4,1,3]<\/span> 切分标定 2，右段 <span class=\"katex-inline\">[6,7]<\/span> 切分标定 6。\n<\/li><li>\n对照计数：本轮切分扫描 7 个元素；两侧子问题规模 4 与 2，总代价按递归树累加。\n<\/ol>\n<p>（实操时指针停住条件与交换次序要逐条对照代码；越界保护确保 <span class=\"katex-inline\">i<\/span> 不超过 <code>hi<\/code>、<span class=\"katex-inline\">j<\/span> 不低于 <code>lo<\/code>。）<\/p>\n<h2>数值算例二：最坏递推与三向收益对照<\/h2>\n<p><strong>退化序列<\/strong>：<span class=\"katex-inline\">N=4<\/span> 有序输入 <span class=\"katex-inline\">[1,2,3,4]<\/span>，端点标定。<\/p>\n<ol><li>\n标定 1，切分后右段 <span class=\"katex-inline\">[2,3,4]<\/span>；\n<\/li><li>\n标定 2，切分后右段 <span class=\"katex-inline\">[3,4]<\/span>；\n<\/li><li>\n标定 3，切分后右段 <span class=\"katex-inline\">[4]<\/span>。\n<p>比较次数 <span class=\"katex-inline\">3+2+1=6=N(N-1)/2<\/span>，平方级小例。<span class=\"katex-inline\">N=1000<\/span> 时比较约 <span class=\"katex-inline\">5\\times10^5<\/span> 量级。<\/p>\n<\/ol>\n<p><strong>三向切分的重复键场景<\/strong>：数组 <span class=\"katex-inline\">[2,1,2,2,1,2,1,2]<\/span>，标定 2。<\/p>\n<ol><li>\n扫描后分出小于段 <span class=\"katex-inline\">[1,1,1]<\/span>、等于段 <span class=\"katex-inline\">[2,2,2,2]<\/span>、大于段空；\n<\/li><li>\n递归只处理小于段，等于段不再比较；\n<\/li><li>\n若全数组等值，一次扫描完成，代价线性级。二向切分在同一输入上会把等值元素反复分到两侧，比较次数随切分层累加。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：有序输入叠加端点标定。<\/strong> 切分一端为空，递推退化成链，栈深 <span class=\"katex-inline\">N<\/span>，比较平方级。复盘：随机打乱或随机选标定，让切分位置不被输入次序锁定。<\/p>\n<p><strong>案例 2：重复键集中仍用二向切分。<\/strong> 等值元素跨两侧搬运，切分比较次数虚高。复盘：重复键占比高时改三向切分，等于段一次分出。<\/p>\n<p><strong>案例 3：底层小段仍递归。<\/strong> 段长 2–5 时方法调用与切分固定开销超过收益。复盘：设阈值（如 7），段内转插入排序，递归只处理较大子问题。<\/p>\n<p><strong>案例 4：递归两侧都走迭代。<\/strong> 退化输入下栈深达 <span class=\"katex-inline\">N<\/span>，栈空间溢出。复盘：先切分较小一侧，另一侧迭代处理，栈深压到 <span class=\"katex-inline\">\\lg N<\/span> 量级。<\/p>\n<p><strong>案例 5：把快排当稳定排序用。<\/strong> 切分交换跨段移动相等键，相对次序不保留；先按次键排好的结果会被主键排序打乱。复盘：需要稳定性的多级排序选归并。<\/p>\n<h2>差生通读检查<\/h2>\n<p><strong>卡点 1：指针停住条件记反。<\/strong> 补步骤：左指针找&quot;不小于标定&quot;的元素（<span class=\"katex-inline\">\\ge v<\/span>），右指针找&quot;不大于标定&quot;的元素（<span class=\"katex-inline\">\\le v<\/span>）；停住后交换。画两列：左列待停条件、右列待停条件，对照代码逐行核。<\/p>\n<p><strong>卡点 2：标定落位与普通交换混淆。<\/strong> 补步骤：普通交换换两个待排元素；落位交换把标定从段首换到相遇点，之后标定不再参与递归。落位下标就是标定的最终有序位置。<\/p>\n<p><strong>卡点 3：期望与最坏结论混用。<\/strong> 补步骤：期望 <span class=\"katex-inline\">N\\lg N<\/span> 依赖随机输入假设；最坏 <span class=\"katex-inline\">N^2<\/span> 是退化路径上界。写选型结论时注明口径：快排给的是期望保证，不是最坏硬保证。<\/p>\n<p><strong>卡点 4：三向切分边界下标不确定。<\/strong> 补步骤：先背三段划分——小于段、等于段、大于段；扫描中交换方向：小于与 <span class=\"katex-inline\">lt<\/span> 换，大于与 <span class=\"katex-inline\">gt<\/span> 换；结束后递归两侧，中段跳过。<\/p>\n<h2>延伸：快排与随机化算法的共同口径<\/h2>\n<p>快排的随机化不改变元素比较规则，只改变切分位置的分布。同一思路散列函数（c08）也用均匀抽样打破同类键聚集；随机化把&quot;固定输入触发最坏路径&quot;换成&quot;期望意义下结构均衡&quot;。代价结论因此分两层：平均期望看分治分层，最坏路径看退化递推；两层必须分别陈述。<\/p>\n<h2>算例三：三向切分逐步推演<\/h2>\n<p>取数组 <span class=\"katex-inline\">[B,A,B,C,A,B,A]<\/span>，标定 <span class=\"katex-inline\">v=B<\/span>，边界 <span class=\"katex-inline\">lt=0<\/span>、<span class=\"katex-inline\">i=0<\/span>、<span class=\"katex-inline\">gt=6<\/span>。<\/p>\n<ol><li>\n<code>a[0]=B<\/code> 等于 <span class=\"katex-inline\">v<\/span>：<span class=\"katex-inline\">i<\/span> 前进到 1。\n<\/li><li>\n<code>a[1]=A<\/code> 小于 <span class=\"katex-inline\">v<\/span>：与 <code>a[lt]<\/code> 交换，<span class=\"katex-inline\">lt<\/span> 前进 1，<span class=\"katex-inline\">i<\/span> 前进 1。\n<\/li><li>\n<code>a[2]=B<\/code> 等于：<span class=\"katex-inline\">i<\/span> 前进。\n<\/li><li>\n<code>a[3]=C<\/code> 大于：与 <code>a[gt]<\/code> 交换，<span class=\"katex-inline\">gt<\/span> 后退 1，<span class=\"katex-inline\">i<\/span> 不动，重新检查当前 <span class=\"katex-inline\">i<\/span>。\n<\/li><li>\n<code>a[4]=A<\/code> 小于：与 <code>a[lt]<\/code> 交换，两侧边界各进 1。\n<\/li><li>\n<code>a[5]=B<\/code> 等于：<span class=\"katex-inline\">i<\/span> 前进；<code>a[6]=A<\/code> 小于：交换并推进。\n<\/li><li>\n结束：小于段 <span class=\"katex-inline\">[A,A,A]<\/span>、等于段 <span class=\"katex-inline\">[B,B,B]<\/span>、大于段 <span class=\"katex-inline\">[C]<\/span>；递归只处理小于段与大于段。\n<\/ol>\n<p>等值键集中时，二向切分要把这些 <span class=\"katex-inline\">B<\/span> 反复分到两侧再比较；三向切分一次归集中段，递归规模直接去掉等值部分。<\/p>\n<h2>改进措施对照表<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>缺陷<\/th><th>触发场景<\/th><th>改进措施<\/th><th>作用环节<\/th><\/tr><\/thead><tbody><tr><td>固定输入触发最坏路径<\/td><td>有序/逆序输入叠加端点标定<\/td><td>排序前随机打乱，或随机选标定<\/td><td>切分位置分布<\/td><\/tr><tr><td>底层递归开销大<\/td><td>段长 2–7<\/td><td>阈值以下转插入排序<\/td><td>递归边界<\/td><\/tr><tr><td>重复键反复搬运<\/td><td>大量等值键<\/td><td>三向切分分出等于段<\/td><td>切分分组<\/td><\/tr><tr><td>退化栈深<\/td><td>一侧为空的切分链<\/td><td>先处理较小侧，另一侧迭代<\/td><td>递归栈管理<\/td><\/tr><\/tbody><\/table><\/div>\n<p>表中措施分别对准不同失效点；随机化不消除最坏路径，只压低其触发概率；三向切分不改变均衡切分的 <span class=\"katex-inline\">N\\lg N<\/span> 主代价。<\/p>\n<h2>概率口径补充<\/h2>\n<p>快排期望分析依赖随机排列假设：每个切分位置等概率出现。实际工程中输入可能按业务规律聚集，此时期望结论要配合随机化才能成立。最坏 <span class=\"katex-inline\">N^2<\/span> 是递推上界，不是平均表现；引用快排复杂度时必须写清&quot;期望&quot;还是&quot;最坏&quot;，两个口径不能互相替代。<\/p>\n<p>对照散列（c08）：散列函数也要把键均匀铺到索引，避免同类键聚集；两者都用随机化/均匀假设打破固定输入对结构形状的定向影响。假设破裂时，快排退化链、散列退化链是同类失效。<\/p>\n<h2>第二组复盘：快排选型边界<\/h2>\n<p><strong>复盘 1：把快排用于稳定性要求高的多级排序。<\/strong> 切分交换跨段移动相等键，次键次序不保；先按学号再按班级排序时，同班同学学号次序会被打乱。需要稳定选归并。<\/p>\n<p><strong>复盘 2：只记快排&quot;最快&quot;。<\/strong> 快排平均常数小来自内循环简洁，但最坏 <span class=\"katex-inline\">N^2<\/span> 不能在代码里消除；要求最坏硬保证的内核场景选堆排或归并。<\/p>\n<p><strong>复盘 3：忽略栈深管理。<\/strong> 退化切分链递归深度 <span class=\"katex-inline\">N<\/span>，大数组可能栈溢出；实现优先切小侧、另一侧迭代，栈深压到 <span class=\"katex-inline\">\\lg N<\/span>。<\/p>\n<p><strong>复盘 4：三向切分用在重复键很少的数据。<\/strong> 分组边界维护带来额外开销，收益不明显；二向切分足够。措施按输入特征选用，不是越复杂越好。<\/p>\n<h2>算例四：快排递归树的代价计数<\/h2>\n<p>取 <span class=\"katex-inline\">N=8<\/span> 均衡切分。<\/p>\n<ol><li>\n顶层切分扫描 8 个元素，标定落位；两侧各 4 个。\n<\/li><li>\n第二层两个子问题各扫描 4 个，合计 8；第三层四个子问题各扫描 2 个，合计 8。\n<\/li><li>\n层数 <span class=\"katex-inline\">\\lg 8=3<\/span>，每层扫描合计 8，总比较约 <span class=\"katex-inline\">8\\times3=24<\/span> 量级，与归并分层同形。\n<\/li><li>\n退化对照：<span class=\"katex-inline\">N=8<\/span> 有序端点标定，每层一侧为空，比较 <span class=\"katex-inline\">7+6+\\cdots+1=28<\/span>，平方级小例。\n<\/li><li>\n期望与最坏的差别只在切分位置分布：均衡则层数对数，退化则层数线性；随机化把位置分布摊平。\n<\/ol>\n<h2>递推口径对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>切分形态<\/th><th>递推式<\/th><th>展开结果<\/th><th>量级<\/th><\/tr><\/thead><tbody><tr><td>均衡两半<\/td><td><span class=\"katex-inline\">T(N)=2T(N/2)+cN<\/span><\/td><td><span class=\"katex-inline\">cN\\lg N+O(N)<\/span><\/td><td><span class=\"katex-inline\">N\\lg N<\/span><\/td><\/tr><tr><td>一端为空<\/td><td><span class=\"katex-inline\">T(N)=T(N-1)+cN<\/span><\/td><td><span class=\"katex-inline\">cN(N+1)/2<\/span><\/td><td><span class=\"katex-inline\">N^2<\/span><\/td><\/tr><tr><td>三向全同键<\/td><td>一次扫描分组<\/td><td><span class=\"katex-inline\">cN<\/span><\/td><td><span class=\"katex-inline\">N<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>递推式的差别来自子问题规模怎么拆；快排改进措施分别作用于切分位置随机化、底层切换、等值分组与栈深管理，不改变主递推的均衡方向。<\/p>\n<h2>第二组补充复盘<\/h2>\n<p><strong>复盘 5：标定选择的工程做法。<\/strong> 取端点对有序输入最坏；随机选元素换到段首，或排序前整体打乱。三取样（取首、中、尾中位）也是压低端点退化的做法，目标都是避免标定落在极端位置。<\/p>\n<p><strong>复盘 6：重复键与等值搬运。<\/strong> 二向切分中等于标定的元素在两侧间反复比较；重复键占比越高，额外比较越多。三向切分把等值段一次分出，递归直接跳过中段；键分布随机、重复少时分组开销不划算。<\/p>\n<p><strong>复盘 7：递归栈管理。<\/strong> 若两侧都递归调用，退化输入下栈深可达 <span class=\"katex-inline\">N<\/span>；实现先切较小一侧、另一侧迭代处理，栈深压到 <span class=\"katex-inline\">\\lg N<\/span> 量级。这是与时间代价并列的空间边界。<\/p>\n<h2>快排与归并的结构对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>快速排序<\/th><th>归并排序<\/th><\/tr><\/thead><tbody><tr><td>分治动作<\/td><td>切分整理两侧<\/td><td>递归排序后合并<\/td><\/tr><tr><td>额外空间<\/td><td>递归栈 <span class=\"katex-inline\">\\lg N<\/span> 量级<\/td><td>辅助数组 <span class=\"katex-inline\">N<\/span><\/td><\/tr><tr><td>最坏代价<\/td><td><span class=\"katex-inline\">N^2<\/span><\/td><td><span class=\"katex-inline\">N\\lg N<\/span><\/td><\/tr><tr><td>平均代价<\/td><td>期望 <span class=\"katex-inline\">N\\lg N<\/span><\/td><td><span class=\"katex-inline\">N\\lg N<\/span><\/td><\/tr><tr><td>稳定性<\/td><td>不稳定<\/td><td>稳定<\/td><\/tr><tr><td>常数因子<\/td><td>内循环简洁，偏小<\/td><td>合并有复制开销<\/td><\/tr><\/tbody><\/table><\/div>\n<p>对照读法：快排把省空间作为交换，承担最坏退化风险；归并把空间作为交换，换取最坏保证与稳定。两者递归树分层口径相似，差别在切分位置质量与合并/切分动作。<\/p>\n<h2>切分失败路径汇总<\/h2>\n<ul><li>\n标定端点 + 有序输入：一端为空，递推退化成链，<span class=\"katex-inline\">N^2<\/span>。\n<\/li><li>\n重复键集中：二向切分反复搬运等值元素，比较虚高；三向切分归集中段。\n<\/li><li>\n底层小段递归：调用开销超过收益；阈值转插入。\n<\/li><li>\n递归单侧过深：栈深 <span class=\"katex-inline\">N<\/span>；先切小侧、另一侧迭代。\n<\/li><li>\n相等键次序：切分交换跨段移动，稳定性不保留。\n<\/ul>\n<p>每条失败路径对应一类改进或边界；选型时先列输入特征（有序程度、重复键比例、稳定性要求），再决定是否采用快排及配套措施。<\/p>\n<h2>概率口径与随机化再述<\/h2>\n<p>快排期望分析假设输入排列随机；工程做法是排序前整体打乱，或从段内随机选标定。随机化不改比较规则，只改变切分位置分布。最坏 <span class=\"katex-inline\">N^2<\/span> 是递推上界，代码无法消除，只能压低触发概率。引用快排复杂度时必须注明口径：期望 <span class=\"katex-inline\">N\\lg N<\/span> 是平均表现，最坏 <span class=\"katex-inline\">N^2<\/span> 是风险上界，两者不互相替代。<\/p>\n<p>对照散列均匀假设：两者都靠随机/均匀分布打破固定输入对结构形状的定向影响；假设破裂时，快排退化链与散列退化链是同类失效。选型前先评估输入是否规律聚集，再决定随机化措施是否足够。<\/p>\n<h2>切分过程的不变量再核<\/h2>\n<p>扫描中 <code>lo+1..i-1<\/code> 不大于标定，<code>j+1..hi<\/code> 不小于标定；指针越界检查是不变量护栏。标定落位后两侧互不重叠，标定不再参与后续切分。内循环只做比较与交换，方法调用少，这是快排平均常数因子偏小的直接来源。<\/p>\n<p>三向切分边界：<code>lt<\/code> 到 <code>i<\/code> 等于段，<code>i<\/code> 到 <code>gt<\/code> 未处理，<code>gt<\/code> 右侧大于段；小于与左界换，大于与右界换，等于前进。重复键越多，中段跳过的递归规模越大；全同键一次扫描完成。<\/p>\n<p>快排改进措施分别对准失效点：随机化打破固定路径，阈值切换降底层开销，三向切分处理重复键，小侧优先压栈深。期望与最坏两个口径分开陈述；稳定性缺失决定多级排序场景不能选用。归并对照：归并用空间换最坏保证与稳定，快排用原地与小常数承担退化风险。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出切分的双指针停住条件与落位交换步骤；标定落位后两侧数组满足什么条件？\n<\/li><li>\n期望 <span class=\"katex-inline\">N\\lg N<\/span> 的推导依据是什么？为什么每层合计扫描线性、层数对数？\n<\/li><li>\n最坏退化递推 <span class=\"katex-inline\">T(N)=T(N-1)+cN<\/span> 怎样展开成 <span class=\"katex-inline\">N^2/2<\/span> 量级？触发条件是什么？\n<\/li><li>\n三向切分把数组分成哪三段？大量重复键时它相对二向切分省下了什么？\n<\/li><li>\n快排为什么不稳定？在什么多级排序场景下这一缺陷会造成实际错误？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "快速排序：切分过程、性能改进与三向切分"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：算法 第四版 Algorithms (4th Edition).pdf · p.234<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">归并排序：自顶向下、自底向上与排序复杂度下界<\/a><\/span><\/div><h1>堆、优先队列与堆排序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch02（原书 §2.4 优先队列，PDF 第 234 页，印刷 195）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>优先队列是支持插入键值、删除最大（或最小）键的数据结构；堆是它的数组实现：一棵完全二叉树，最大堆中每个父结点的键不小于其子结点，父结点下标 <span class=\"katex-inline\">k<\/span> 对应子结点 <span class=\"katex-inline\">2k<\/span>、<span class=\"katex-inline\">2k+1<\/span>，通过 swim 上浮与 sink 下沉维持堆序；堆排序在堆上反复取出堆顶换到堆尾并收缩堆，完成 <span class=\"katex-inline\">N\\lg N<\/span> 原地排序。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>许多场景只需要当前最值：动态流中取最大元素、事件调度按优先级处理、MST 与最短路径中取最小边权。若用有序数组维护，插入要挪动 <span class=\"katex-inline\">O(N)<\/span> 个元素；用无序链表，取最值要扫描 <span class=\"katex-inline\">O(N)<\/span>。两种朴素结构都把一个操作压贵。<\/p>\n<p>优先队列要同时支撑两类动作：插入新元素、提取当前最值。堆在两者之间取平衡：插入与删顶都是 <span class=\"katex-inline\">O(\\lg N)<\/span>，建堆可以做到 <span class=\"katex-inline\">O(N)<\/span>；额外空间常数级。对照排序场景，堆排序提供最坏 <span class=\"katex-inline\">N\\lg N<\/span> 且原地工作的方案，补齐归并（空间 <span class=\"katex-inline\">N<\/span>）与快排（最坏 <span class=\"katex-inline\">N^2<\/span>）的边界。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>堆序性质<\/strong>：最大堆中，任意父结点键 <span class=\"katex-inline\">\\ge<\/span> 其子结点键；根结点是全堆最大键。最小堆方向相反，父结点键 <span class=\"katex-inline\">\\le<\/span> 子结点，根为最小。<\/p>\n<p><strong>数组表示<\/strong>：堆存放在数组 <code>pq[1..N]<\/code>（下标 0 留空）。结点 <span class=\"katex-inline\">k<\/span> 的左子结点 <span class=\"katex-inline\">2k<\/span>，右子结点 <span class=\"katex-inline\">2k+1<\/span>，父结点 <span class=\"katex-inline\">\\lfloor k/2\\rfloor<\/span>。完全二叉树形状由下标关系隐含，不需要指针。<\/p>\n<p><strong>swim（上浮）<\/strong>：新元素插到堆尾，若大于父结点就与父结点交换，反复上浮直到堆序恢复。用于插入后调整。<\/p>\n<p><strong>sink（下沉）<\/strong>：堆顶被换走后，把末元素放到堆顶，若小于子结点就与较大子结点（最大堆）交换，反复下沉直到堆序恢复。用于删除堆顶后的调整。<\/p>\n<p><strong>插入<\/strong>：元素加到堆尾，swim 上浮到合适位置。 <strong>删除最大<\/strong>：堆顶与堆尾元素交换，堆大小减一，新堆顶 sink 下沉；返回原堆顶。<\/p>\n<p><strong>堆排序<\/strong>：先把数组建成最大堆；反复把堆顶（当前最大）与堆尾交换，堆大小减一，对新堆顶 sink 调整；堆收缩到 1 时数组按键升序。<\/p>\n<p><strong>建堆口径<\/strong>：从最末一个非叶结点向前逐个 sink，可在线性时间 <span class=\"katex-inline\">O(N)<\/span> 内建堆；逐个插入建堆为 <span class=\"katex-inline\">O(N\\lg N)<\/span>。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">N=7<\/span> 的堆，根最大，两层子结点依次不超过父结点。<strong>反例<\/strong>：堆不要求兄弟间有序，也不要求中序遍历出全序；&quot;堆是排序数组&quot;是误解。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>堆高上界<\/strong>：完全二叉树 <span class=\"katex-inline\">N<\/span> 个结点，高度 <span class=\"katex-inline\">h=\\lfloor\\lg N\\rfloor<\/span>。swim 与 sink 沿一条根叶路径移动，单次操作次数不超过树高，故插入、删顶代价 <span class=\"katex-inline\">O(\\lg N)<\/span>。<\/p>\n<p><strong>建堆线性推导<\/strong>：自底向上逐个 sink。高度为 <span class=\"katex-inline\">h<\/span> 的结点层，结点数约 <span class=\"katex-inline\">N/2^{h+1}<\/span>，每层 sink 代价 <span class=\"katex-inline\">O(h)<\/span>；求和 <span class=\"katex-inline\">\\sum_{h} (N/2^{h+1})\\cdot h<\/span>。级数 <span class=\"katex-inline\">\\sum_{h\\ge1} h/2^h=2<\/span>，总代价 <span class=\"katex-inline\">O(N)<\/span>。依据：大部分结点靠近叶结点，下沉距离短；线性级成立不依赖逐个插入。<\/p>\n<p><strong>堆排序总量<\/strong>：建堆 <span class=\"katex-inline\">O(N)<\/span>；<span class=\"katex-inline\">N-1<\/span> 次删顶，每次 sink <span class=\"katex-inline\">O(\\lg N)<\/span>，总量 <span class=\"katex-inline\">O(N\\lg N)<\/span>。额外空间只存交换用临时变量，<span class=\"katex-inline\">\\Theta(1)<\/span>。<\/p>\n<p><strong>与选择排序对照<\/strong>：选择排序每轮扫描未排区间找最值，比较 <span class=\"katex-inline\">N(N-1)/2<\/span>；堆把&quot;找最值&quot;压进堆序维护，每轮调整沿一条路径 <span class=\"katex-inline\">O(\\lg N)<\/span>，总量从平方级降到 <span class=\"katex-inline\">N\\lg N<\/span>。<\/p>\n<p><strong>优先队列 API 视角<\/strong>：核心方法为 <code>insert(key)<\/code> 插入、<code>delMax()<\/code> 删除并返回最大键；对照最小堆有 <code>delMin()<\/code>。辅助方法 <code>isEmpty()<\/code>、<code>size()<\/code>。用例包括事件调度、Top-K 统计、优先处理任务；与符号表不同，优先队列不提供按键查找与范围遍历。<\/p>\n<p><strong>堆与二叉树的差别<\/strong>：堆是完全二叉树的数组实现，形状固定紧凑；一般二叉树需要左右指针。堆的兄弟结点之间没有大小约束，跨层结点的次序也未规定，这一点与二叉查找树的左小右大约束方向不同。<\/p>\n<h2>适用条件与边界<\/h2>\n<p><strong>成立条件<\/strong>：<\/p>\n<ol><li>\n只需要最值提取与动态插入，不需要按键范围查询；\n<\/li><li>\n接受比较式堆操作；元素可比较大小；\n<\/li><li>\n原地排序或常数空间约束下可用。\n<\/ol>\n<p><strong>边界与失败案例<\/strong>：<\/p>\n<ul><li>\n堆不保留全序：除根最大外，兄弟、跨层结点间大小关系未约束；要遍历全序需导出排序结果。\n<\/li><li>\n相等键不破坏堆序，但交换次序不保证稳定。\n<\/li><li>\n最小堆与最大堆方向相反，sink 选择子结点的规则随方向改变；方向写反会得到错堆顶。\n<\/li><li>\n优先队列若需要合并两个堆（堆合并），普通数组堆不高效，需可合并堆结构。\n<\/li><li>\n索引越界：sink/swim 必须检查子结点下标不超过堆大小。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>堆 vs 有序数组<\/strong>：有序数组查找 <span class=\"katex-inline\">O(\\lg N)<\/span> 但插入 <span class=\"katex-inline\">O(N)<\/span>；堆插入与删顶 <span class=\"katex-inline\">O(\\lg N)<\/span>，不支持二分查找。堆适合动态最值，有序数组适合静态反复查询。\n<\/li><li>\n<strong>堆排序 vs 归并排序<\/strong>：堆排最坏 <span class=\"katex-inline\">N\\lg N<\/span>、空间 <span class=\"katex-inline\">1<\/span>；归并最坏 <span class=\"katex-inline\">N\\lg N<\/span>、空间 <span class=\"katex-inline\">N<\/span>、稳定。堆排省空间但不稳定，归并省空间上吃亏但保稳定。\n<\/li><li>\n<strong>堆排序 vs 快速排序<\/strong>：堆排最坏 <span class=\"katex-inline\">N\\lg N<\/span>；快排期望 <span class=\"katex-inline\">N\\lg N<\/span>、常数更小但最坏 <span class=\"katex-inline\">N^2<\/span>。最坏保证优先选堆排，平均性能优先选快排。\n<\/li><li>\n<strong>堆 vs 二叉查找树<\/strong>：堆约束父与子的大小关系，不约束兄弟次序；BST 约束左小右大并支撑中序遍历与排名操作。堆为最值服务，BST 为查找服务。\n<\/ul>\n<p><strong>堆操作的两类方向<\/strong>：最大堆父 <span class=\"katex-inline\">\\ge<\/span> 子，根为最大，用于删除最大元素；最小堆父 <span class=\"katex-inline\">\\le<\/span> 子，根为最小，用于事件调度与 Dijkstra 距离摘顶。sink 选择子结点的规则随方向反转：最大堆选较大子，最小堆选较小子。两种堆的下标映射、swim/sink 框架相同，不等号方向相反。<\/p>\n<p><strong>堆与 Top-K 场景<\/strong>：流中取最大 <span class=\"katex-inline\">K<\/span> 个元素，维护大小 <span class=\"katex-inline\">K<\/span> 的最小堆；新元素大于堆顶则替换并下沉，遍历结束堆内即 Top-K。堆大小固定 <span class=\"katex-inline\">K<\/span>，单次 <span class=\"katex-inline\">O(\\lg K)<\/span>，不保存全量有序结果。这一用例与优先队列的 API 一致：插入、删顶两个动作覆盖流处理需求。<\/p>\n<p><strong>堆排序的边界<\/strong>：堆不保留全序，除根最大外兄弟与跨层结点次序未约束；相等键交换不保证稳定。建堆有自底向上 sink 的线性路线与逐个 swim 插入的 <span class=\"katex-inline\">O(N\\lg N)<\/span> 路线，大规模建堆优先前者。堆排序最坏 <span class=\"katex-inline\">N\\lg N<\/span>、常数空间，是空间受限场景下对数级排序的主要选择。<\/p>\n<h2>联系<\/h2>\n<p>前置：c01 树高与量级口径；c03 分治排序的代价对照。后继：第 4 章 Prim 算法用优先队列取连接树内外的最小横切边，Dijkstra 用优先队列取当前最短距离顶点；第 3 章符号表的优先队列实现复用同一堆结构。堆的 sink/swim 也是后续树形结构平衡化操作的基础部件。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（堆、优先队列与堆排序）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：堆序维护、建堆线性论证与堆排序推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>讲清堆与堆排序，往回追五层：<\/p>\n<ol><li>\n<strong>优先队列需求<\/strong>：动态插入与最值提取两类动作；朴素有序数组、链表各把一个动作压贵。\n<\/li><li>\n<strong>完全二叉树形状<\/strong>：结点按层填满，下标关系隐含树结构，不需要指针。\n<\/li><li>\n<strong>堆序约束<\/strong>：父结点与子结点的大小方向固定；根为最值，兄弟间不约束次序。\n<\/li><li>\n<strong>调整操作<\/strong>：swim 上浮处理插入，sink 下沉处理删顶；单次沿一条根叶路径移动。\n<\/li><li>\n<strong>代价口径与复用<\/strong>：单次 <span class=\"katex-inline\">O(\\lg N)<\/span>，建堆 <span class=\"katex-inline\">O(N)<\/span>，堆排序 <span class=\"katex-inline\">N\\lg N<\/span>、常数空间；同一结构进入图算法的优先队列用例。\n<\/ol>\n<p>依赖链方向：最值需求 → 树形表示 → 堆序约束 → 上浮/下沉调整 → 代价与复用。堆序方向错，swim/sink 的交换目标就错；树高上界不清，单次操作代价无法归类。<\/p>\n<h2>正向推导：堆的表示与调整规则<\/h2>\n<p><strong>第 1 步：下标映射。<\/strong> 堆存数组 <code>pq[1..N]<\/code>，下标 0 留空。结点 <span class=\"katex-inline\">k<\/span>：父结点 <span class=\"katex-inline\">\\lfloor k/2\\rfloor<\/span>，左子 <span class=\"katex-inline\">2k<\/span>，右子 <span class=\"katex-inline\">2k+1<\/span>。完全二叉树按层编号，父在左子之前、右子紧随。<\/p>\n<p><strong>第 2 步：最大堆堆序。<\/strong> 对每个内部结点 <span class=\"katex-inline\">k<\/span>，<code>pq[k] &gt;= pq[2k]<\/code> 且 <code>pq[k] &gt;= pq[2k+1]<\/code>。根 <code>pq[1]<\/code> 为全堆最大。最小堆把不等号方向反转。<\/p>\n<p><strong>第 3 步：swim 上浮。<\/strong> 新元素置于堆尾 <span class=\"katex-inline\">N<\/span> 处；若 <code>pq[N] &gt; pq[parent]<\/code>，交换两者，指针移到父结点；重复到根或堆序满足。上浮次数不超过树高 <span class=\"katex-inline\">\\lfloor\\lg N\\rfloor<\/span>。<\/p>\n<p><strong>第 4 步：sink 下沉（最大堆）。<\/strong> 待下沉结点 <span class=\"katex-inline\">k<\/span>：取子结点中较大者 <span class=\"katex-inline\">j<\/span>；若 <code>pq[k] &lt; pq[j]<\/code>，交换 <span class=\"katex-inline\">k<\/span> 与 <span class=\"katex-inline\">j<\/span>，指针移到 <span class=\"katex-inline\">j<\/span>；重复到叶或堆序满足。子结点下标超堆大小时停止。<\/p>\n<p><strong>第 5 步：插入与删顶。<\/strong> 插入：堆尾加元素 → swim。删最大：<code>pq[1]<\/code> 与 <code>pq[N]<\/code> 交换 → 堆大小减一 → 新堆顶 sink → 返回原堆顶。<\/p>\n<p><strong>第 6 步：建堆线性论证。<\/strong> 从最末一个非叶结点 <span class=\"katex-inline\">\\lfloor N/2\\rfloor<\/span> 向前逐个 sink。高度 <span class=\"katex-inline\">h<\/span> 层结点数约 <span class=\"katex-inline\">N/2^{h+1}<\/span>，每层 sink 代价 <span class=\"katex-inline\">O(h)<\/span>：<\/p>\n<div class=\"katex-block\">\\text{总代价}=O\\!\\left(N\\sum_{h\\ge1}\\frac{h}{2^h}\\right)=O(N\\cdot 2)=O(N)<\/div>\n<p>级数 <span class=\"katex-inline\">\\sum_{h\\ge1}h/2^h=2<\/span> 是固定常数；多数结点靠近叶层，下沉距离短，建堆不必逐个插入。<\/p>\n<p><strong>第 7 步：堆排序总量。<\/strong> 建堆 <span class=\"katex-inline\">O(N)<\/span>；<span class=\"katex-inline\">N-1<\/span> 次删顶，每次 sink 不超过树高 <span class=\"katex-inline\">\\lg N<\/span>，总量 <span class=\"katex-inline\">O(N\\lg N)<\/span>。交换用临时变量，额外空间 <span class=\"katex-inline\">\\Theta(1)<\/span>。<\/p>\n<h2>数值算例一：插入序列建堆<\/h2>\n<p>依次插入 <span class=\"katex-inline\">3,7,1,9,5,8<\/span>（最大堆）。<\/p>\n<ol><li>\n插 3：<code>[_,3]<\/code>。\n<\/li><li>\n插 7：尾 7 与父 3 交换，<code>[_,7,3]<\/code>。\n<\/li><li>\n插 1：<code>[_,7,3,1]<\/code>，1 不大于父 3，停。\n<\/li><li>\n插 9：尾 9 上浮，先与父 3 交换得 <code>[_,7,9,1,3]<\/code>，再与父 7 交换得 <code>[_,9,7,1,3]<\/code>。\n<\/li><li>\n插 5：尾 5 与父 7 比较，不大于，停；<code>[_,9,7,1,3,5]<\/code>。\n<\/li><li>\n检查堆序：根 9 最大；7 <span class=\"katex-inline\">\\ge<\/span> 1、5；3 为叶。单次插入上浮不超过两层。\n<\/ol>\n<h2>数值算例二：小数组堆排序<\/h2>\n<p>取数组 <span class=\"katex-inline\">[5,2,7,1,3]<\/span>，先建最大堆：<\/p>\n<ol><li>\n自底向上 sink：调整后堆为 <span class=\"katex-inline\">[7,3,5,1,2]<\/span>（根 7，子结点 3、5，叶 1、2）。\n<\/li><li>\n堆顶 7 与堆尾 2 交换，堆大小 4：数组 <span class=\"katex-inline\">[2,3,5,1,7]<\/span>；对堆顶 2 sink，与较大子 5 交换，得 <span class=\"katex-inline\">[5,3,2,1,7]<\/span>。\n<\/li><li>\n堆顶 5 与堆尾 1 交换，堆大小 3：<span class=\"katex-inline\">[1,3,2,5,7]<\/span>；堆顶 1 sink 与 3 交换，得 <span class=\"katex-inline\">[3,1,2,5,7]<\/span>。\n<\/li><li>\n堆顶 3 与堆尾 2 交换，堆大小 2：<span class=\"katex-inline\">[2,1,3,5,7]<\/span>；堆顶 2 sink 无子越界，停。\n<\/li><li>\n堆大小 1，结束；数组升序 <span class=\"katex-inline\">[1,2,3,5,7]<\/span>。\n<\/ol>\n<p>每轮：堆顶换出当前最大值放到堆尾，收缩堆后 sink 恢复堆序；<span class=\"katex-inline\">N-1<\/span> 轮完成排序。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：sink 选错子结点。<\/strong> 最大堆应与较大子结点交换；若选较小子结点，父结点换到小侧，堆序仍可能被破坏。复盘：先比较两子结点大小，取大者再比较父结点。<\/p>\n<p><strong>案例 2：方向写反。<\/strong> 最小堆按最大堆规则下沉，根会变成最小之外的错值。复盘：先确认堆类型，再定不等号方向与子结点选择规则。<\/p>\n<p><strong>案例 3：建堆逐个插入。<\/strong> 可行但代价 <span class=\"katex-inline\">O(N\\lg N)<\/span>；自底向上 sink 建堆为 <span class=\"katex-inline\">O(N)<\/span>。复盘：大规模建堆优先自底向上。<\/p>\n<p><strong>案例 4：把堆当中序有序结构。<\/strong> 查询&quot;第 k 小&quot;靠堆序做不到，要遍历或另选 BST。复盘：堆只为最值服务，不保留全序。<\/p>\n<p><strong>案例 5：越界下沉。<\/strong> 子结点下标超过堆大小时仍比较，读到堆外元素。复盘：sink 每步先检查 <span class=\"katex-inline\">2k\\le<\/span> 堆大小，右子存在再比较。<\/p>\n<h2>差生通读检查<\/h2>\n<p><strong>卡点 1：下标映射记混。<\/strong> 补步骤：父 <span class=\"katex-inline\">\\lfloor k/2\\rfloor<\/span>，左子 <span class=\"katex-inline\">2k<\/span>，右子 <span class=\"katex-inline\">2k+1<\/span>；画一层编号：根 1，子 2、3，孙 4、5、6、7，对照编号推关系。<\/p>\n<p><strong>卡点 2：swim 与 sink 用途对调。<\/strong> 补步骤：插入后新元素在尾部，向上浮；删顶后新堆顶在根部，向下沉。一个管尾到根，一个管根到叶。<\/p>\n<p><strong>卡点 3：建堆线性与逐个插入分不清。<\/strong> 补步骤：自底向上从 <span class=\"katex-inline\">\\lfloor N/2\\rfloor<\/span> 向前 sink 是 <span class=\"katex-inline\">O(N)<\/span>；逐个 swim 插入是 <span class=\"katex-inline\">O(N\\lg N)<\/span>。看建堆入口判断路线。<\/p>\n<p><strong>卡点 4：堆排序交换后忘记收缩堆。<\/strong> 补步骤：每轮交换后堆大小减一，sink 只在收缩后的堆范围内进行；仍按原长度比较会把已排到尾部的元素再纳入调整。<\/p>\n<h2>延伸：图算法中的优先队列<\/h2>\n<p>Prim 维护已选树内顶点与树外顶点之间的横切边，每次取权最小者加入；Dijkstra 维护各顶点当前最短距离，每次取距离最小者确定。两者都把&quot;取最值&quot;交给优先队列：边权或距离作为键，堆顶即下一个选中对象。队列内键值更新（松弛后距离变小）在标准实现中通过插入新条目、旧条目弹出时跳过完成。堆的 <span class=\"katex-inline\">O(\\lg N)<\/span> 单次代价直接决定这两个图算法的复杂度口径。<\/p>\n<h2>算例三：自底向上建堆的 sink 次序<\/h2>\n<p>取数组 <span class=\"katex-inline\">[4,10,3,5,1,8,7]<\/span>，<span class=\"katex-inline\">N=7<\/span>，最末一个非叶结点为 <span class=\"katex-inline\">\\lfloor7/2\\rfloor=3<\/span>。<\/p>\n<ol><li>\n结点 3：键 3，子结点 6（键 8）、7（键 7）；3 小于较大子 8，交换 3 与 8，数组变 <span class=\"katex-inline\">[4,10,8,5,1,3,7]<\/span>。\n<\/li><li>\n结点 2：键 10，子 4（键 5）、5（键 1）；10 大于两子，不交换。\n<\/li><li>\n结点 1：键 4，子 2（键 10）、3（键 8）；4 小于较大子 10，交换 4 与 10，数组变 <span class=\"katex-inline\">[10,4,8,5,1,3,7]<\/span>；结点 2 处 4 再与子 5 比较，不小于 1，停。\n<\/li><li>\n最终堆：根 10，子 4、8，孙 5、1、3、7；堆序满足。\n<\/li><li>\n计数：三次 sink 调整，每次下沉不超过两层；自底向上次序保证子树先堆序，父结点调整时下方已合规。\n<\/ol>\n<h2>结构属性对照表<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>结构<\/th><th>核心约束<\/th><th>单次最值<\/th><th>插入<\/th><th>全序遍历<\/th><th>典型用途<\/th><\/tr><\/thead><tbody><tr><td>无序链表<\/td><td>无<\/td><td><span class=\"katex-inline\">O(N)<\/span> 扫描<\/td><td><span class=\"katex-inline\">O(1)<\/span><\/td><td>顺序遍历<\/td><td>仅追加场景<\/td><\/tr><tr><td>有序数组<\/td><td>按键升序<\/td><td><span class=\"katex-inline\">O(1)<\/span> 取端<\/td><td><span class=\"katex-inline\">O(N)<\/span> 挪动<\/td><td>二分查找<\/td><td>静态查询<\/td><\/tr><tr><td>堆<\/td><td>父 <span class=\"katex-inline\">\\ge<\/span> 子（最大堆）<\/td><td><span class=\"katex-inline\">O(\\lg N)<\/span><\/td><td><span class=\"katex-inline\">O(\\lg N)<\/span><\/td><td>不保留全序<\/td><td>优先队列、堆排序<\/td><\/tr><tr><td>二叉查找树<\/td><td>左小右大<\/td><td>视树高<\/td><td>视树高<\/td><td>中序有序<\/td><td>符号表查找<\/td><\/tr><\/tbody><\/table><\/div>\n<p>对照表读法：每种结构把代价压在不同操作上；堆的取舍是放弃全序与范围查询，换插入和最值提取都对数级。<\/p>\n<h2>延伸：Top-K 与流处理<\/h2>\n<p>从海量元素中取最大的 <span class=\"katex-inline\">K<\/span> 个，维护一个大小 <span class=\"katex-inline\">K<\/span> 的最小堆：新元素比堆顶大则替换堆顶并 sink，遍历结束堆内即 Top-K。堆大小固定 <span class=\"katex-inline\">K<\/span>，单次 <span class=\"katex-inline\">O(\\lg K)<\/span>，总代价 <span class=\"katex-inline\">O(N\\lg K)<\/span>；对照全量排序 <span class=\"katex-inline\">O(N\\lg N)<\/span>，流场景下堆方案不保存全部有序结果。事件调度、延迟任务按到期时间入最小堆，每次取出最近到期事件，是同一部件的另一类用例。<\/p>\n<h2>第二组复盘：堆操作易错点<\/h2>\n<p><strong>复盘 1：插入忘记 swim。<\/strong> 元素加到堆尾后不调整，父结点可能小于新元素，堆序被破坏。复盘：插入路径固定为&quot;加尾 → swim&quot;。<\/p>\n<p><strong>复盘 2：删顶后忘记 sink。<\/strong> 末元素放堆顶直接返回，堆顶不是最值，后续提取出错。复盘：删顶路径固定为&quot;交换 → 缩堆 → sink&quot;。<\/p>\n<p><strong>复盘 3：下标 0 的处理混乱。<\/strong> 标准堆从下标 1 起算，0 留空；若 0 起算，子结点关系改为 <span class=\"katex-inline\">2k+1<\/span>、<span class=\"katex-inline\">2k+2<\/span>，两套映射不能混用。复盘：先定起点下标，再写映射。<\/p>\n<p><strong>复盘 4：用堆做范围查询。<\/strong> 堆不约束兄弟次序，查&quot;键在 <span class=\"katex-inline\">[a,b]<\/span> 之间的全部元素&quot;无法沿堆序剪枝；这类需求归 BST 或符号表实现。<\/p>\n<h2>算例四：插入上浮的逐步核对<\/h2>\n<p>最大堆现有 <span class=\"katex-inline\">[9,7,1,3,5]<\/span>（下标 1–5）。插入 8 到下标 6：<\/p>\n<ol><li>\n父结点 <span class=\"katex-inline\">\\lfloor6/2\\rfloor=3<\/span>，键 1；<span class=\"katex-inline\">8&gt;1<\/span>，交换，位置 3 变 8、位置 6 变 1。\n<\/li><li>\n新位置 3 的父结点 <span class=\"katex-inline\">\\lfloor3/2\\rfloor=1<\/span>，键 9；<span class=\"katex-inline\">8&lt;9<\/span>，停止。\n<\/li><li>\n结果 <span class=\"katex-inline\">[9,7,8,3,5,1]<\/span>；检查堆序：9 <span class=\"katex-inline\">\\ge<\/span> 7、8；7 <span class=\"katex-inline\">\\ge<\/span> 3、5；8 为叶。\n<\/li><li>\n上浮次数两次，不超过树高 <span class=\"katex-inline\">\\lg 6\\approx3<\/span>。对照 sink：堆顶被换走后，末元素下沉，每次与较大子结点比较交换。\n<\/ol>\n<h2>堆排序与选择排序对照<\/h2>\n<p>选择排序每轮扫描未排区间找最值，比较 <span class=\"katex-inline\">N(N-1)/2<\/span> 次；堆排序把最值维护在堆顶，每轮交换后 sink 一条路径 <span class=\"katex-inline\">O(\\lg N)<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">N=8<\/span>：选择比较 <span class=\"katex-inline\">7+6+\\cdots+1=28<\/span>；堆排序建堆 <span class=\"katex-inline\">O(N)<\/span>，7 次删顶各 <span class=\"katex-inline\">O(\\lg 8)=3<\/span> 次量级，合计约 <span class=\"katex-inline\">7\\times3=21<\/span> 量级。\n<\/li><li>\n<span class=\"katex-inline\">N<\/span> 增大后选择停在平方级，堆排进入 <span class=\"katex-inline\">N\\lg N<\/span>；差距来自&quot;找最值&quot;的实现：扫描全区间 vs 堆序路径调整。\n<\/li><li>\n两者都原地工作；堆排额外空间常数，选择排序也是常数空间，差别只在比较次数量级。\n<\/ol>\n<h2>结构选择补充表<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>场景<\/th><th>结构<\/th><th>理由<\/th><\/tr><\/thead><tbody><tr><td>频繁插入 + 取最值<\/td><td>堆<\/td><td>插入、删顶均对数级<\/td><\/tr><tr><td>静态反复按键查询<\/td><td>有序数组<\/td><td>二分查找 <span class=\"katex-inline\">O(\\lg N)<\/span>，无插入挪动<\/td><\/tr><tr><td>动态键值 + 有序范围<\/td><td>红黑 BST<\/td><td>保留键序，支持排名范围<\/td><\/tr><tr><td>流 Top-K<\/td><td>大小 <span class=\"katex-inline\">K<\/span> 的最小堆<\/td><td>固定堆尺寸，单次 <span class=\"katex-inline\">\\lg K<\/span><\/td><\/tr><tr><td>事件到期调度<\/td><td>最小堆<\/td><td>根为最近到期事件<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>第三组复盘：堆实现易错点<\/h2>\n<p><strong>复盘 6：swim 与 sink 的终止条件。<\/strong> swim 到根或父结点更大即停；sink 到叶或不大于子结点即停。缺少终止条件会越界或无限交换。<\/p>\n<p><strong>复盘 7：建堆次序。<\/strong> 自底向上从 <span class=\"katex-inline\">\\lfloor N/2\\rfloor<\/span> 向前 sink，保证子树先合规；从根向下逐个插入是另一路线，代价 <span class=\"katex-inline\">O(N\\lg N)<\/span>。两条路线结果都是堆，建堆代价不同。<\/p>\n<p><strong>复盘 8：相等键处理。<\/strong> 堆序允许父等于子，不破坏约束；相等键交换次序不保证稳定。需要稳定排序的场景不能直接用堆排结果叠加多级次序。<\/p>\n<h2>堆排序与其他排序的代价汇总<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>算法<\/th><th>最坏<\/th><th>平均/期望<\/th><th>额外空间<\/th><th>稳定<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>选择排序<\/td><td><span class=\"katex-inline\">N^2<\/span><\/td><td><span class=\"katex-inline\">N^2<\/span><\/td><td><span class=\"katex-inline\">1<\/span><\/td><td>不稳定<\/td><td>交换少、比较固定<\/td><\/tr><tr><td>插入排序<\/td><td><span class=\"katex-inline\">N^2<\/span><\/td><td>近线性于部分有序<\/td><td><span class=\"katex-inline\">1<\/span><\/td><td>稳定<\/td><td>逆序对决定交换<\/td><\/tr><tr><td>归并排序<\/td><td><span class=\"katex-inline\">N\\lg N<\/span><\/td><td><span class=\"katex-inline\">N\\lg N<\/span><\/td><td><span class=\"katex-inline\">N<\/span><\/td><td>稳定<\/td><td>最坏保证<\/td><\/tr><tr><td>快速排序<\/td><td><span class=\"katex-inline\">N^2<\/span><\/td><td>期望 <span class=\"katex-inline\">N\\lg N<\/span><\/td><td><span class=\"katex-inline\">\\lg N<\/span> 栈<\/td><td>不稳定<\/td><td>常数小<\/td><\/tr><tr><td>堆排序<\/td><td><span class=\"katex-inline\">N\\lg N<\/span><\/td><td><span class=\"katex-inline\">N\\lg N<\/span><\/td><td><span class=\"katex-inline\">1<\/span><\/td><td>不稳定<\/td><td>常数空间对数级<\/td><\/tr><\/tbody><\/table><\/div>\n<p>堆排在表中的位置：以常数空间提供最坏 <span class=\"katex-inline\">N\\lg N<\/span>，代价是不稳定且常数因子高于快排。优先队列用途之外，堆结构在事件调度、Top-K、图算法摘顶中复用同一套 swim/sink 规则。<\/p>\n<h2>堆操作计数再核对<\/h2>\n<ul><li>\n插入：加尾 1 次写，swim 至多 <span class=\"katex-inline\">\\lg N<\/span> 次交换。\n<\/li><li>\n删顶：交换 1 次，缩堆 1 步，sink 至多 <span class=\"katex-inline\">\\lg N<\/span> 次交换。\n<\/li><li>\n建堆（自底向上）：<span class=\"katex-inline\">\\lfloor N/2\\rfloor<\/span> 个非叶结点逐个 sink，级数求和 <span class=\"katex-inline\">O(N)<\/span>。\n<\/li><li>\n堆排序：建堆 <span class=\"katex-inline\">O(N)<\/span>，<span class=\"katex-inline\">N-1<\/span> 次删顶各 <span class=\"katex-inline\">O(\\lg N)<\/span>，总量 <span class=\"katex-inline\">O(N\\lg N)<\/span>。\n<\/ul>\n<p>下标口径再记一次：标准堆从 1 起算，父 <span class=\"katex-inline\">\\lfloor k/2\\rfloor<\/span>，左子 <span class=\"katex-inline\">2k<\/span>，右子 <span class=\"katex-inline\">2k+1<\/span>；0 起算映射改为 <span class=\"katex-inline\">2k+1<\/span>、<span class=\"katex-inline\">2k+2<\/span>，两套不能混用。<\/p>\n<h2>优先队列用例再列<\/h2>\n<ul><li>\n事件调度：最小堆按到期时间摘顶，最近事件先处理。\n<\/li><li>\nTop-K：大小 <span class=\"katex-inline\">K<\/span> 的最小堆，新元素大于堆顶则替换下沉。\n<\/li><li>\n图算法：Prim 取最小横切边，Dijkstra 取最短距离顶点。\n<\/li><li>\n数据流统计：维护当前最大/最小批次元素，不需要全量有序。\n<\/ul>\n<p>优先队列 API 只暴露插入与最值提取；堆是其数组实现，swim/sink 维护堆序。堆不支持按键查找与范围遍历，那是符号表/BST 的职责。<\/p>\n<h2>堆序与下标口径收尾<\/h2>\n<p>最大堆父 <span class=\"katex-inline\">\\ge<\/span> 子，最小堆父 <span class=\"katex-inline\">\\le<\/span> 子；sink 选子规则随方向反转。下标 1 起算：父 <span class=\"katex-inline\">\\lfloor k/2\\rfloor<\/span>，左子 <span class=\"katex-inline\">2k<\/span>，右子 <span class=\"katex-inline\">2k+1<\/span>；0 起算改 <span class=\"katex-inline\">2k+1<\/span>、<span class=\"katex-inline\">2k+2<\/span>。swim 管尾到根，sink 管根到叶；插入加尾后上浮，删顶交换后缩堆下沉。建堆自底向上 sink 为 <span class=\"katex-inline\">O(N)<\/span>，逐个 swim 插入为 <span class=\"katex-inline\">O(N\\lg N)<\/span>。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出结点 <span class=\"katex-inline\">k<\/span> 的父结点、左子、右子下标；最大堆的堆序约束是什么？\n<\/li><li>\nswim 与 sink 各在什么场景调用？单次操作次数为什么不超过 <span class=\"katex-inline\">\\lg N<\/span>？\n<\/li><li>\n自底向上建堆为什么是 <span class=\"katex-inline\">O(N)<\/span>？级数 <span class=\"katex-inline\">\\sum h/2^h<\/span> 起了什么作用？\n<\/li><li>\n堆排序的总量代价与额外空间各是什么量级？它相对快排、归并分别补足了哪条边界？\n<\/li><li>\n堆为什么不能直接回答&quot;第 k 小&quot;？这与堆序约束的哪一条有关？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "堆、优先队列与堆排序"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：算法 第四版 Algorithms (4th Edition).pdf · p.289<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">增长数量级与算法分析的数学模型<\/a><\/span><\/div><h1>符号表与二叉查找树：顺序查找、二分查找与 BST 性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch03（原书 §3.1 符号表、§3.2 二叉查找树，PDF 第 267、289 页，印刷 228、250）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>符号表是键值对容器的抽象结构，支持插入、查找、删除，有序符号表另支持排名、选择、最值与范围查询；二叉查找树（BST）是一种二叉树结构，任一结点键大于左子树全部键、小于右子树全部键，查找与插入沿一条根到叶路径进行，单次操作代价由树高决定。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>程序需要把键映射到值：字典单词到释义、账号到资料、文件名到元数据。朴素存储有两条路线，各有缺陷。无序链表顺序查找：每次 <code>get<\/code> 沿链表逐个比较，<span class=\"katex-inline\">N<\/span> 个键查找平均 <span class=\"katex-inline\">N/2<\/span> 次，<span class=\"katex-inline\">M<\/span> 次查询总量平方级。有序数组二分查找：查找 <span class=\"katex-inline\">\\lg N<\/span> 次，但插入要把后续元素整体挪动，<span class=\"katex-inline\">O(N)<\/span> 次写入。<\/p>\n<p>需要一种结构同时支撑动态插入与较快查找。二叉查找树用树形组织把两者折中：查找路径等于树高，插入只改沿途指针；中序遍历按键升序输出，天然支持排名与范围查询。本章先看清朴素实现的代价来源，再引入 BST；BST 自身的退化问题由 c07 红黑树解决。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>符号表 API<\/strong>：<code>put(key,val)<\/code> 插入或更新；<code>get(key)<\/code> 返回对应值；<code>delete(key)<\/code> 删除；<code>contains(key)<\/code> 判断存在；<code>isEmpty()<\/code>、<code>size()<\/code>。键不重复，重复 <code>put<\/code> 覆盖旧值。<\/p>\n<p><strong>有序符号表 API<\/strong>：<code>rank(key)<\/code> 小于该键的键数；<code>select(k)<\/code> 第 <span class=\"katex-inline\">k<\/span> 小键；<code>min()<\/code>、<code>max()<\/code>；<code>floor(key)<\/code> 不大于该键的最大键；<code>ceiling(key)<\/code> 不小于该键的最小键；<code>keys(lo,hi)<\/code> 范围查询。这些方法依赖键的全序关系。<\/p>\n<p><strong>无序链表顺序查找<\/strong>：结点存键值对，<code>get<\/code> 从头到尾比较键，命中返回值，未命中返回空。插入直接加表头。代价：查找 <span class=\"katex-inline\">O(N)<\/span>，插入 <span class=\"katex-inline\">O(1)<\/span>。<\/p>\n<p><strong>有序数组二分查找<\/strong>：数组按键有序保存；<code>get<\/code> 取中点比较，每轮排除一半；<code>rank<\/code> 与 <code>select<\/code> 可由下标直接得到。查找 <span class=\"katex-inline\">O(\\lg N)<\/span>，插入挪动 <span class=\"katex-inline\">O(N)<\/span>。<\/p>\n<p><strong>BST 键序性质<\/strong>：二叉树每个结点 <span class=\"katex-inline\">k<\/span>，左子树所有键 <span class=\"katex-inline\">&lt; k<\/span>，右子树所有键 <span class=\"katex-inline\">&gt; k<\/span>（相等键归一侧处理）。性质递归成立：左右子树自身也是 BST。<\/p>\n<p><strong>查找过程<\/strong>：从根开始，目标键小于当前结点走左，大于走右，相等命中；走到空指针即未命中。插入与查找同路径，空位挂上含新键的结点。<\/p>\n<p><strong>删除三种情况<\/strong>：叶子结点直接删；单子结点用子树顶替；双子结点用右子树最小结点（后继）顶替，再删除该后继。<\/p>\n<p><strong>正例<\/strong>：根为中等键，左小右大，中序遍历升序。<strong>反例<\/strong>：把 BST 当成排好序的数组是错的，BST 不支持按下标直接定位，定位要走路径。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>中序有序证明<\/strong>：归纳。单结点 BST 中序输出自身；一般树按&quot;左子树 → 根 → 右子树&quot;遍历，由归纳假设左子树输出全部小于根的键，右子树输出全部大于根的键，拼接后整树按键升序。排名、选择方法都以这条有序性为依据。<\/p>\n<p><strong>代价与树高<\/strong>：单次查找/插入比较次数等于路径长度。最好情形树平衡，高 <span class=\"katex-inline\">\\lfloor\\lg N\\rfloor<\/span>，<span class=\"katex-inline\">O(\\lg N)<\/span>；最坏情形插入序列单调有序，树退化成链，高 <span class=\"katex-inline\">N-1<\/span>，<span class=\"katex-inline\">O(N)<\/span>。随机插入下，BST 期望高度约 <span class=\"katex-inline\">2\\ln N<\/span> 量级，成功查找平均代价 <span class=\"katex-inline\">O(\\lg N)<\/span>。<\/p>\n<p><strong>删除后继的正确性<\/strong>：双子结点删除时，右子树最小结点是被删结点的直接后继；用它顶替根位置，左子树仍小于它、右子树仍大于它，BST 性质保持；后继原位置删除后其余结点关系不变。<\/p>\n<h2>适用条件与边界<\/h2>\n<p><strong>成立条件<\/strong>：<\/p>\n<ol><li>\n键可比较，能定义 <code>compareTo<\/code>；\n<\/li><li>\n需要动态插入并保留键序操作；\n<\/li><li>\n接受树高随插入顺序波动，或后续引入平衡机制。\n<\/ol>\n<p><strong>边界与失败案例<\/strong>：<\/p>\n<ul><li>\n有序输入使普通 BST 退化链表；不做平衡保证时，最坏查找线性级。\n<\/li><li>\nBST 不按键的哈希定位，查找必须走比较路径；散列结构不保留键序，两者能力不同。\n<\/li><li>\n重复键处理：约定新值覆盖或归一侧，不能在两侧并存同一键。\n<\/li><li>\n删除双子结点若选错顶替结点（如取左子树最大以外的结点），可能破坏子树大小关系。\n<\/li><li>\n树高不平衡时，递归遍历深度可达 <span class=\"katex-inline\">N<\/span>，注意栈深。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>BST vs 有序数组<\/strong>：有序数组查找快、插入贵；BST 插入改指针、查找走路径，动态场景总量更优。静态多次查询、很少插入，有序数组更省。\n<\/li><li>\n<strong>BST vs 散列表<\/strong>：BST 保留键序，支持排名、范围、最值；散列平均查找常数级但不保留次序。需要有序操作选 BST，只按键取值选散列。\n<\/li><li>\n<strong>顺序查找 vs 二分查找<\/strong>：顺序不要求有序，插入便宜；二分要求有序维护，查找快但插入贵。两者是链表与数组两条朴素路线的代表。\n<\/li><li>\n<strong>BST 查找 vs 平衡树查找<\/strong>：普通 BST 代价由形状决定；平衡树（c07）用不变量把树高锁住，查找代价有对数上界。\n<\/ul>\n<p><strong>有序方法的 BST 落点<\/strong>：<code>min<\/code> 沿左子走到空，<code>max<\/code> 沿右子走到空；<code>floor(key)<\/code> 目标小于根走左，大于根先记根再走右；<code>ceiling<\/code> 方向对称；范围查询在中序序列中过滤区间键。这些方法都以中序有序为前提，换散列表实现则键序信息丢失，整套有序 API 无法提供。<\/p>\n<p><strong>删除操作的细节分支<\/strong>：叶子结点直接断开父指针；单子结点用子树顶替父结点；双子结点取右子树最小结点（后继）顶替，再删除该后继。维护子树大小字段的实现，删除后沿途 <code>sz<\/code> 减一，否则 <code>select<\/code> 与 <code>rank<\/code> 错位。同键 <code>put<\/code> 约定覆盖旧值，不能在两侧并存同一键，否则命中结果不确定。<\/p>\n<p><strong>朴素实现的代价定位<\/strong>：链表路线把代价压在查找侧，插入表头常数次；有序数组路线把代价压在插入侧，查找二分对数级。BST 把两类动作都挂到根叶路径上，动态场景总量折中；它不解决树高退化问题，那是 c07 平衡树的任务。<\/p>\n<p><strong>BST 性能的概率口径<\/strong>：随机插入下树高期望 <span class=\"katex-inline\">2\\ln N<\/span> 量级，成功查找平均 <span class=\"katex-inline\">O(\\lg N)<\/span>；这是概率结论，不构成最坏保证。有序、逆序或按规律构造的输入都能把普通 BST 压成链，单次查找退回 <span class=\"katex-inline\">O(N)<\/span>。区分&quot;期望均衡&quot;与&quot;最坏有界&quot;是理解下一章红黑树的前提：红黑树要补的正是最坏上界这一环。<\/p>\n<p><strong>符号表与集合接口<\/strong>：符号表存键值对，集合只存键；本书 §3.5 给出集合 API 与字典、索引类用例。BST 结构同样可承载集合语义，键序方法（排名、范围）在集合场景照旧成立。<\/p>\n<h2>联系<\/h2>\n<p>前置：c01 的量级与树高口径；ch02 排序中的 <code>compareTo<\/code> 键序比较。后继：c07 红黑树针对普通 BST 的退化路径加平衡不变量；c08 散列表走另一条不保留键序的路线；第 4 章符号图用符号表把字符串顶点名映射为整数索引。BST 的键序性质也是后续范围查询、索引结构的基础。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（符号表与二叉查找树：顺序查找、二分查找与 BST 性质）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：符号表路线对照、BST 性质证明与小例推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>讲清符号表与 BST，往回追五层：<\/p>\n<ol><li>\n<strong>键值映射需求<\/strong>：程序要按键存值、取值、删值；动态插入与查找是两类基本动作。\n<\/li><li>\n<strong>朴素路线代价<\/strong>：链表查找慢、插入快；有序数组查找快、插入慢；两条路线各压贵一个操作。\n<\/li><li>\n<strong>树形折中组织<\/strong>：用二叉树把插入与查找都挂到一条路径上，改指针替代挪动整段。\n<\/li><li>\n<strong>键序性质<\/strong>：左子树全小、右子树全大；中序遍历升序，排名与范围查询由此成立。\n<\/li><li>\n<strong>代价与退化<\/strong>：单次代价等于树高；最好平衡对数、最坏链形成线性；随机输入期望对数级，退化问题交平衡树解决。\n<\/ol>\n<p>依赖链方向：映射需求 → 朴素代价 → 树形组织 → 键序性质 → 高度口径。性质不成立，中序有序与排名方法失去依据；树高口径不清，BST 与散列的选型对照就写不准。<\/p>\n<h2>正向推导：性质、查找与删除逐步展开<\/h2>\n<p><strong>第 1 步：符号表操作口径。<\/strong> <code>put<\/code> 遇同键覆盖旧值，新键挂空位；<code>get<\/code> 沿比较路径找键；<code>delete<\/code> 先定位再按子树情况处理；<code>contains<\/code> 是 <code>get<\/code> 非空判断。<\/p>\n<p><strong>第 2 步：中序有序归纳证明。<\/strong><\/p>\n<ul><li>\n基例：单结点树，中序输出该键，自身有序。\n<\/li><li>\n归纳步：设左右子树中序输出各自有序。按&quot;左 → 根 → 右&quot;遍历，左子树全部键小于根，右子树全部键大于根，拼接后序列为：小于根的键、根、大于根的键，整树升序。\n<\/li><li>\n结论：BST 中序遍历即按键升序；<code>rank<\/code> 统计左子树结点数加一，<code>select<\/code> 按子树大小定位。\n<\/ul>\n<p><strong>第 3 步：查找路径。<\/strong> 从根起：目标 <span class=\"katex-inline\">&lt;<\/span> 当前结点走左，<span class=\"katex-inline\">&gt;<\/span> 走右，<span class=\"katex-inline\">=<\/span> 命中；空指针结束未命中。插入路径相同，空位挂新结点。比较次数等于路径长度。<\/p>\n<p><strong>第 4 步：删除三情况。<\/strong><\/p>\n<ol><li>\n叶子：直接断开父结点指向。\n<\/li><li>\n单子结点：父结点改指该子树。\n<\/li><li>\n双子结点：取右子树最小结点（后继）顶替；在右子树中删除该后继；顶替后左子树小于它、右子树大于它，性质保持。\n<\/ol>\n<p><strong>第 5 步：高度与代价。<\/strong> 最好完全平衡，高 <span class=\"katex-inline\">\\lfloor\\lg N\\rfloor<\/span>；最坏单链，高 <span class=\"katex-inline\">N-1<\/span>。随机插入下期望高度 <span class=\"katex-inline\">2\\ln N<\/span> 量级，成功查找平均 <span class=\"katex-inline\">O(\\lg N)<\/span>。依据：路径长度由树形状决定，形状由插入顺序决定；随机顺序把左右子树规模摊平。<\/p>\n<h2>数值算例一：序列插入得到的 BST<\/h2>\n<p>取键序列 <span class=\"katex-inline\">[S,E,A,R,C,H]<\/span> 依次插入。<\/p>\n<ol><li>\n插 S：根 S。\n<\/li><li>\n插 E：E <span class=\"katex-inline\">&lt;<\/span> S，挂左子。\n<\/li><li>\n插 A：A <span class=\"katex-inline\">&lt;<\/span> S 走左，A <span class=\"katex-inline\">&lt;<\/span> E 再走左，挂 E 左子。\n<\/li><li>\n插 R：R <span class=\"katex-inline\">&lt;<\/span> S 走左，R <span class=\"katex-inline\">&gt;<\/span> E，挂 E 右子。\n<\/li><li>\n插 C：走左到 E，再走左到 A，C <span class=\"katex-inline\">&gt;<\/span> A，挂 A 右子。\n<\/li><li>\n插 H：走左到 E，右到 R，H <span class=\"katex-inline\">&lt;<\/span> R，挂 R 左子。\n<\/li><li>\n中序遍历：<span class=\"katex-inline\">A,C,E,H,R,S<\/span>，升序。查找 H：S→E→R→H，3 次比较；查找未命中键 X：S→E→R→右空，3 步结束。\n<\/ol>\n<p>对照有序序列 <span class=\"katex-inline\">[A,C,E,H,R,S]<\/span> 插入：每个新键挂右子，成右斜链，查找末端需 6 次；同一组键、不同顺序，树高差别从 3 到 6。<\/p>\n<h2>数值算例二：三条路线操作计数对照<\/h2>\n<p><span class=\"katex-inline\">N=1000<\/span>，<span class=\"katex-inline\">M=1000<\/span> 次混合查找与插入。<\/p>\n<ol><li>\n无序链表：每次查找平均 500 次比较，<span class=\"katex-inline\">M<\/span> 次查找约 <span class=\"katex-inline\">5\\times10^5<\/span> 次；插入表头常数次。\n<\/li><li>\n有序数组：查找约 <span class=\"katex-inline\">\\lg 1000\\approx10<\/span> 次，<span class=\"katex-inline\">M<\/span> 次查找 <span class=\"katex-inline\">10^4<\/span> 次；每次插入平均挪动 500 个元素，插入次数多时写入量 <span class=\"katex-inline\">O(N)<\/span> 级。\n<\/li><li>\n随机 BST：查找期望 <span class=\"katex-inline\">O(\\lg N)\\approx10<\/span> 次路径比较，插入改沿途指针；总量介于两者之间，不挪动整段数组。\n<\/li><li>\n口径：链表把代价压在查找，有序数组把代价压在插入，BST 两边都走路径；选型看业务中查找与插入的比例。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：有序输入不做平衡。<\/strong> 单调序列插入成链，查找从对数级退化到线性；百万键规模下末端查找不可接受。复盘：普通 BST 不保证树高，最坏路径必须由平衡机制切断。<\/p>\n<p><strong>案例 2：双子删除选错顶替结点。<\/strong> 若取右子树最大结点以外的任意结点顶替，可能出现新父结点与子树键序冲突；规则是后继（右子最小）或前驱（左子最大），顶替后再删原后继。<\/p>\n<p><strong>案例 3：同键两侧并存。<\/strong> <code>put<\/code> 遇同键不覆盖，新键挂到另一侧，查找命中哪一侧不确定，<code>size<\/code> 与排名口径混乱。复盘：同键约定唯一，覆盖旧值。<\/p>\n<p><strong>案例 4：用 BST 做哈希式定位。<\/strong> 期望靠键值直接算出位置，BST 做不到；它必须走比较路径。需要常数级随机访问归散列结构。<\/p>\n<p><strong>案例 5：递归删除不更新子树大小。<\/strong> 若实现维护 <code>sz<\/code> 字段支持 <code>select<\/code>，删除后沿途子树大小要减一；不更新会导致排名错位。<\/p>\n<h2>差生通读检查<\/h2>\n<p><strong>卡点 1：键序性质方向记反。<\/strong> 补步骤：根在中间，左小右大；画一棵三结点小树，标左、根、右的大小关系，对照遍历顺序验证。<\/p>\n<p><strong>卡点 2：查找与插入路径混淆。<\/strong> 补步骤：两者走同一条比较路径；查找走到空即未命中，插入在空位挂结点。路径方向规则一致，终点动作不同。<\/p>\n<p><strong>卡点 3：删除三种情况对不上号。<\/strong> 补步骤：先数待删结点的子结点个数；0 个直接删，1 个子树顶替，2 个找后继顶替。拿不准就画结点与子树连接。<\/p>\n<p><strong>卡点 4：中序遍历与排名关系不清。<\/strong> 补步骤：中序即升序序列；<code>rank<\/code> 是序列中小于键的元素数，<code>select<\/code> 是序列第 k 个；子树结点数直接转成排名差。<\/p>\n<h2>延伸：有序符号表方法在 BST 上的落点<\/h2>\n<ul><li>\n<code>min<\/code>：沿左子走到空；<code>max<\/code> 沿右子走到空。\n<\/li><li>\n<code>floor<\/code>：目标键小于根走左；大于根则先记根再走右，右子为空时当前根即前驱。\n<\/li><li>\n<code>ceiling<\/code>：方向对称。\n<\/li><li>\n<code>range(lo,hi)<\/code>：中序遍历中过滤区间内键，或按排名剪枝。\n<p>这些方法都建立在中序有序之上；换散列表实现，键序信息丢失，整套有序 API 无法提供。<\/p>\n<\/ul>\n<h2>算例三：有序数组二分查找计数<\/h2>\n<p>取有序数组 <span class=\"katex-inline\">[1,3,5,7,9,11,13]<\/span>，查找 7。<\/p>\n<ol><li>\n中点下标 3，键 7，命中；比较 1 次。\n<\/li><li>\n查找 2：中点 7 大于 2，走左半 <span class=\"katex-inline\">[1,3,5]<\/span>；中点 3 大于 2，走左 <span class=\"katex-inline\">[1]<\/span>；未命中，比较 3 次。\n<\/li><li>\n<span class=\"katex-inline\">N=7<\/span> 时比较上界 <span class=\"katex-inline\">\\lfloor\\lg 7\\rfloor+1=3<\/span>；一般地每轮排除一半，次数 <span class=\"katex-inline\">\\lg N<\/span> 量级。\n<\/li><li>\n对照插入：有序数组插入要把后续元素整体后移，<span class=\"katex-inline\">O(N)<\/span> 次写入；查找快但动态修改贵，这是数组路线的固定取舍。\n<\/ol>\n<h2>算例四：BST 双子删除推演<\/h2>\n<p>取树：根 8，左子 3（左 1、右 5），右子 10。删除根 8。<\/p>\n<ol><li>\n根有两个子结点，取右子树最小结点 10 下方的最小值（本例右子仅 10）；后继为 10。\n<\/li><li>\n用 10 顶替根位置；原右子树删除 10（无子可删）。\n<\/li><li>\n新树：根 10，左子 3（左 1、右 5），右空。核对键序：左子树全部 <span class=\"katex-inline\">&lt;10<\/span>，右子空，性质保持。\n<\/li><li>\n若改取左子树最大结点（前驱）顶替，规则对称；不能取任意结点，否则新父与子树大小关系可能冲突。\n<\/li><li>\n维护 <code>sz<\/code>：删除前后沿途子树大小减一；不更新会导致 <code>select(k)<\/code> 取错第 k 小。\n<\/ol>\n<h2>三条符号表路线对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>路线<\/th><th>查找<\/th><th>插入<\/th><th>有序操作<\/th><th>适用场景<\/th><\/tr><\/thead><tbody><tr><td>无序链表<\/td><td><span class=\"katex-inline\">O(N)<\/span><\/td><td><span class=\"katex-inline\">O(1)<\/span><\/td><td>不支持<\/td><td>只追加、极少查询<\/td><\/tr><tr><td>有序数组<\/td><td><span class=\"katex-inline\">O(\\lg N)<\/span><\/td><td><span class=\"katex-inline\">O(N)<\/span><\/td><td>支持<\/td><td>静态数据、反复查询<\/td><\/tr><tr><td>普通 BST<\/td><td>视树高，随机 <span class=\"katex-inline\">O(\\lg N)<\/span><\/td><td>视树高<\/td><td>支持<\/td><td>动态插入、保留键序<\/td><\/tr><tr><td>红黑树<\/td><td><span class=\"katex-inline\">O(\\lg N)<\/span> 上界<\/td><td><span class=\"katex-inline\">O(\\lg N)<\/span><\/td><td>支持<\/td><td>要求最坏对数保证<\/td><\/tr><tr><td>散列表<\/td><td>平均常数<\/td><td>平均常数<\/td><td>不支持<\/td><td>只按键取值<\/td><\/tr><\/tbody><\/table><\/div>\n<p>对照表读法：每条路线把代价压在不同动作上；BST 与红黑树保留键序，散列放弃次序换常数定位。<\/p>\n<h2>第二组复盘：BST 使用边界<\/h2>\n<p><strong>复盘 1：有序输入退化。<\/strong> 单调序列逐个挂右（左）子，树成链；查找末端 <span class=\"katex-inline\">N<\/span> 次。普通 BST 不提供最坏保证，动态符号表要引入平衡机制。<\/p>\n<p><strong>复盘 2：同键重复插入。<\/strong> 不覆盖旧值而在另一侧新挂，<code>get<\/code> 命中哪一侧不确定，<code>size<\/code> 与排名口径混乱。约定同键唯一，<code>put<\/code> 覆盖值。<\/p>\n<p><strong>复盘 3：把 BST 当哈希定位。<\/strong> 期望由键值直接算位置，BST 只能走比较路径；需要常数随机访问归散列结构。<\/p>\n<p><strong>复盘 4：递归遍历栈深。<\/strong> 退化链状 BST 递归深度 <span class=\"katex-inline\">N<\/span>，大结构需改迭代；平衡化后栈深 <span class=\"katex-inline\">\\lg N<\/span>，递归风险下降。<\/p>\n<h2>延伸：BST 与排序的衔接<\/h2>\n<p>BST 中序遍历即升序序列，这与 ch02 排序成果互相印证：把元素插入 BST 再中序输出，等价于一次排序。<code>rank<\/code> 统计左子树结点数加一，<code>select<\/code> 按子树大小定位；这些有序方法是数据库索引、字典排序、范围统计的结构基础。普通 BST 的形状风险在 c07 由红黑不变量锁住，能力边界（比较路径、键序保留）在平衡化之后不变。<\/p>\n<h2>算例五：有序插入的退化链<\/h2>\n<p>键序列 <span class=\"katex-inline\">[1,2,3,4,5,6,7]<\/span> 依次插入普通 BST。<\/p>\n<ol><li>\n1 为根；2 大于 1 挂右；3 大于 2 挂右；依次形成右斜链。\n<\/li><li>\n查找 7 要走 7 次比较；查找未命中末端也要走完整链。\n<\/li><li>\n对照同一组键随机排列插入：树高约 <span class=\"katex-inline\">2\\ln 7\\approx3.9<\/span>，路径长度 3–4。\n<\/li><li>\n退化原因：BST 只约束键序，不约束左右子树高度；插入顺序决定形状。普通 BST 无法在结构上阻止这种形状，平衡树用不变量锁高度。\n<\/ol>\n<h2>查找路径计数对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>输入形态<\/th><th>树高<\/th><th>单次查找<\/th><th>总量口径<\/th><\/tr><\/thead><tbody><tr><td>完全平衡<\/td><td><span class=\"katex-inline\">\\lfloor\\lg N\\rfloor<\/span><\/td><td><span class=\"katex-inline\">O(\\lg N)<\/span><\/td><td>最优树形<\/td><\/tr><tr><td>随机插入<\/td><td>期望 <span class=\"katex-inline\">2\\ln N<\/span><\/td><td>期望 <span class=\"katex-inline\">O(\\lg N)<\/span><\/td><td>概率均衡<\/td><\/tr><tr><td>单调有序<\/td><td><span class=\"katex-inline\">N-1<\/span><\/td><td><span class=\"katex-inline\">O(N)<\/span><\/td><td>最坏退化<\/td><\/tr><tr><td>规律构造<\/td><td>可定向成链<\/td><td><span class=\"katex-inline\">O(N)<\/span><\/td><td>恶意输入<\/td><\/tr><\/tbody><\/table><\/div>\n<p>表中前三行是 BST 分析的常见口径；选型时不能只引用随机期望，要说明最坏路径由谁承担。<\/p>\n<h2>BST 操作再核对<\/h2>\n<ul><li>\n<code>put<\/code>：走查找路径，空位挂新结点；同键覆盖值，不两侧并存。\n<\/li><li>\n<code>get<\/code>：比较走左/右，命中返回值，空指针未命中。\n<\/li><li>\n<code>delete<\/code>：叶子断开；单子顶替；双子取后继顶替再删后继；<code>sz<\/code> 沿途减一。\n<\/li><li>\n<code>min/max<\/code>：沿一侧走到空。\n<\/li><li>\n<code>floor/ceiling<\/code>：记录候选后走另一侧子树。\n<\/li><li>\n范围查询：中序遍历过滤区间键，或按排名剪枝。\n<\/ul>\n<p>这些方法共享同一套键序性质；中序有序是排名与选择方法的根依据。脱离键序，散列表只能提供取值，有序方法整体缺席。<\/p>\n<h2>第三组复盘：朴素结构与树结构边界<\/h2>\n<p><strong>复盘 1：链表插入快但查找慢。<\/strong> 表头插入常数次，查找逐链比较 <span class=\"katex-inline\">O(N)<\/span>；只追加、不查询的场景才划算。 <strong>复盘 2：有序数组查找快但挪动贵。<\/strong> 二分 <span class=\"katex-inline\">\\lg N<\/span>，插入后移 <span class=\"katex-inline\">O(N)<\/span>；静态数据合适，动态频繁修改不利。 <strong>复盘 3：BST 动态折中但形状风险自担。<\/strong> 插入改指针不挪段，查找走路径；退化问题留给平衡化解决。 <strong>复盘 4：删除后继选错结点。<\/strong> 必须是右子最小（后继）或左子最大（前驱）；任意结点顶替会破坏大小关系。<\/p>\n<h2>符号表 API 与 BST 落点再核<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>API<\/th><th>语义<\/th><th>BST 实现口径<\/th><\/tr><\/thead><tbody><tr><td><code>put(k,v)<\/code><\/td><td>插入/覆盖<\/td><td>查找路径空位挂结点，同键覆盖<\/td><\/tr><tr><td><code>get(k)<\/code><\/td><td>取值<\/td><td>比较走左/右，命中返回<\/td><\/tr><tr><td><code>delete(k)<\/code><\/td><td>删除<\/td><td>叶子/单子/双子三分支<\/td><\/tr><tr><td><code>contains(k)<\/code><\/td><td>存在判断<\/td><td><code>get<\/code> 非空<\/td><\/tr><tr><td><code>rank(k)<\/code><\/td><td>小于键数<\/td><td>左子树大小加一<\/td><\/tr><tr><td><code>select(k)<\/code><\/td><td>第 k 小<\/td><td>按子树大小定位<\/td><\/tr><tr><td><code>min/max<\/code><\/td><td>最值<\/td><td>一侧走到空<\/td><\/tr><tr><td><code>floor/ceiling<\/code><\/td><td>前驱/后继<\/td><td>记候选后走另一侧<\/td><\/tr><tr><td><code>keys(lo,hi)<\/code><\/td><td>范围查询<\/td><td>中序过滤或排名剪枝<\/td><\/tr><\/tbody><\/table><\/div>\n<p>有序方法全部建立在中序有序之上；散列表实现丢失键序，这些方法整体缺席。BST 与普通链表、有序数组的取舍，本质是动态修改代价与查找代价的折中。<\/p>\n<h2>随机 BST 期望高度口径<\/h2>\n<p>随机插入下，各排列等概率，树的左右子树规模被摊平；期望高度约 <span class=\"katex-inline\">2\\ln N<\/span>，成功查找平均
