<span class=\"katex-inline\">O(\\lg N)<\/span>。这是概率结论，不构成最坏保证。规律输入（单调、周期、定向构造）仍可压成链。理解这条区分是进入红黑树的前提：普通 BST 给期望均衡，平衡树补最坏上界。<\/p>\n<h2>第六组复盘：结构选择边界<\/h2>\n<ul><li>\n只追加不查询：链表足够。\n<\/li><li>\n静态反复查询：有序数组二分最省。\n<\/li><li>\n动态插入且要键序：BST 起步，要求最坏对数上界用红黑。\n<\/li><li>\n只按键取值：散列平均常数级。\n<\/li><li>\n删除维护大小字段：沿途 <code>sz<\/code> 必须同步，否则排名错位。\n<\/ul>\n<h2>查找与删除路径再核<\/h2>\n<p>查找：从根比较，小走左、大走右、相等命中，空指针未命中。插入同路径，空位挂新结点。删除三分支：叶子断开父指针；单子树顶替；双子取右子最小后继顶替，再删后继，<code>sz<\/code> 沿途减一。<code>min/max<\/code> 一侧走到空；<code>floor/ceiling<\/code> 记候选后走另一侧。<\/p>\n<p>中序有序是排名与选择的根依据：<code>rank<\/code> 数左子树大小加一，<code>select<\/code> 按子树大小定位。脱离键序，散列表只能取值，有序方法整体缺席。普通 BST 的风险全在形状：期望均衡来自随机排列，最坏路径由平衡树承担。<\/p>\n<p>BST 路线在符号表谱系中的位置：链表查找贵、数组插入贵，BST 把两类动作挂到根叶路径。普通 BST 形状风险自担，红黑补最坏上界；散列走无序定位路线。删除后子树大小必须同步，否则排名错位；同键约定覆盖，不两侧并存。<\/p>\n<p>符号表方法在 BST 上的落点再记：<code>min<\/code> 沿左走空，<code>max<\/code> 沿右走空；<code>floor<\/code> 记候选走右，<code>ceiling<\/code> 记候选走左；范围查询中序过滤。这些方法离开键序就无法实现。普通 BST 的期望高度是概率口径，最坏路径不构成保证；进入红黑树一章的动机，正是给符号表补上对数最坏上界。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\nBST 的键序性质怎样递归表述？中序遍历为什么按键升序？\n<\/li><li>\n普通 BST 单次操作代价由哪个量决定？最好、最坏、随机期望各是什么量级？\n<\/li><li>\n双子结点删除为什么取右子树最小结点顶替？换一个任意结点会出什么问题？\n<\/li><li>\n链表、有序数组、BST 三条路线各把代价压在哪个操作上？\n<\/li><li>\nBST 与散列表在有序操作能力上的差别是什么？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "符号表与二叉查找树：顺序查找、二分查找与 BST 性质"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：算法 第四版 Algorithms (4th Edition).pdf · p.308<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">符号表与二叉查找树：顺序查找、二分查找与 BST 性质<\/a><\/span><\/div><h1>红黑树：2-3 树映射与平衡不变量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch03（原书 §3.3 平衡查找树，PDF 第 308 页，印刷 269）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>红黑树是由 2-3 查找树映射而来的平衡二叉查找树：把 3-结点拆成一条红色链接挂在二叉树中，用结点颜色、旋转与颜色翻转维护不变量——红链接只作左链接、不存在连续两条红链接、根到任意叶的黑色结点数一致；这些约束把树高限制在 <span class=\"katex-inline\">2\\lg N<\/span> 以内，使查找、插入、删除保持对数级。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>普通 BST 的树高随插入顺序波动，有序输入退化成链，查找退回线性级。平衡查找树的目标是：无论插入顺序如何，树高始终锁在对数范围。直接实现 2-3 树需要两种结点类型（2-结点、3-结点），插入时分裂结点、调整兄弟，代码分支多；红黑树把 2-3 树的平衡性质翻译成标准二叉树操作，旋转与变色在二叉树框架内完成，同时保留平衡保证。<\/p>\n<p>不用平衡机制会卡在：动态符号表面对不可控输入顺序，最坏代价无法承诺；只靠随机化期望均衡，不能覆盖恶意或规律输入。红黑树给出确定性的不变量约束，任何插入删除后都可检查、可恢复。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>2-结点<\/strong>：存一个键、两个子结点的普通二叉结点。 <strong>3-结点<\/strong>：存两个键、三个子结点的结点；左子小于小键，中间子介于两键之间，右子大于大键。 <strong>4-结点<\/strong>：存三个键、四个子结点；插入溢出时分裂成 2-结点组合。<\/p>\n<p><strong>2-3 树平衡<\/strong>：插入自底向上分裂溢出结点，所有叶结点位于同一层；树高 <span class=\"katex-inline\">\\lg N<\/span> 量级，查找插入对数级。<\/p>\n<p><strong>红黑映射<\/strong>：3-结点的两个键用一条红链接连接，红链接下方结点记为红色；2-结点之间的链接为黑色。一棵 2-3 树对应一棵带色二叉树，中序次序与原树一致。<\/p>\n<p><strong>左旋/右旋<\/strong>：局部旋转调整父子方向。右旋把右侧父左子关系翻转，左旋对称；旋转只改链接方向，不改键序。旋转后颜色随结点重新指定，恢复局部不变量。<\/p>\n<p><strong>颜色翻转（flipColors）<\/strong>：一个结点左右子都为红时，把两条子链接转黑、当前结点转红；对应 4-结点向上分裂。翻转后红结点上移，继续向上调整。<\/p>\n<p><strong>书里的不变量<\/strong>：<\/p>\n<ol><li>\n红链接均为左链接（标准左倾红黑树）；\n<\/li><li>\n任一结点不会同时有两条红链接；\n<\/li><li>\n根结点为黑色；\n<\/li><li>\n从根到任意叶的路径上黑色结点数相同（黑色平衡）。\n<\/ol>\n<p><strong>树高上界<\/strong>：满足不变量时，一条根叶路径上红结点不连续，黑层数 <span class=\"katex-inline\">\\lg N<\/span>，红层至多与黑层等量，树高不超过 <span class=\"katex-inline\">2\\lg N<\/span>。<\/p>\n<p><strong>正例<\/strong>：3-结点映射为父结点红挂左子；旋转后键序不变、颜色归位。<strong>反例<\/strong>：把红色当成独立于键序的装饰是错的，颜色是 2-3 结构的表示层，不变量才提供平衡保证。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>映射正确性<\/strong>：2-3 树中 3-结点的两键在 BST 中为父子红链；左小右大的键序由 BST 性质保留。插入时先按普通 BST 挂上红结点，再通过旋转、翻转消除违反不变量的局部形状；每次操作后结构对应某棵合法 2-3 树。<\/p>\n<p><strong>树高论证<\/strong>：黑色平衡保证根到叶黑层数相同，记为 <span class=\"katex-inline\">h_b<\/span>；<span class=\"katex-inline\">N<\/span> 个结点的完全平衡树黑层不超过 <span class=\"katex-inline\">\\lg N<\/span>。红结点不能连续，一条路径上红结点数不超过黑结点数，总高 <span class=\"katex-inline\">h\\le 2h_b\\le 2\\lg N<\/span>。查找沿一条路径，代价 <span class=\"katex-inline\">O(\\lg N)<\/span>。<\/p>\n<p><strong>旋转恢复键序<\/strong>：右旋时，父结点 <span class=\"katex-inline\">P<\/span> 与其左子 <span class=\"katex-inline\">Q<\/span> 交换位置，<span class=\"katex-inline\">Q<\/span> 的右子改为 <span class=\"katex-inline\">P<\/span> 的左子；旋转前 <span class=\"katex-inline\">Q &lt; P<\/span>，旋转后 <span class=\"katex-inline\">Q<\/span> 仍在 <span class=\"katex-inline\">P<\/span> 左方，键序不被破坏。左旋对称。旋转解决的是链接方向违规，不重排元素大小。<\/p>\n<p><strong>颜色翻转对应分裂<\/strong>：4-结点含三键，分裂成中间键上浮、左右两键各成 2-结点；红黑表示下子结点转黑、父结点转红，等价于把中间键向上传递，继续向上检查。<\/p>\n<h2>适用条件与边界<\/h2>\n<p><strong>成立条件<\/strong>：<\/p>\n<ol><li>\n键可比较，符号表需要动态插入删除且要求对数最坏保证；\n<\/li><li>\n实现能正确执行旋转与变色，不变量在每次修改后恢复；\n<\/li><li>\n接受红黑树的常数开销：每次比较附带颜色判断与局部调整。\n<\/ol>\n<p><strong>边界与失败案例<\/strong>：<\/p>\n<ul><li>\n红黑树不提供散列式常数定位；查找仍走比较路径。\n<\/li><li>\n删除操作的不变量恢复比插入复杂，需要双红向下传递等处理；实现错误会让黑色平衡失效。\n<\/li><li>\n放松&quot;红链接只作左链接&quot;或&quot;黑高一致&quot;任一条件，树高上界不再成立，可能重新长出长链。\n<\/li><li>\n红黑树与 AVL 都平衡，约束松紧不同：AVL 左右子树高差严格 1，红黑允许更多松弛换插入删除效率。\n<\/li><li>\n颜色字段占额外存储；结点密集场景计入空间开销。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>红黑树 vs 普通 BST<\/strong>：普通 BST 只约束键序，树高随顺序退化；红黑树在键序之外加颜色不变量，把树高锁住。查找方法相同，差别在插入删除后的恢复动作。\n<\/li><li>\n<strong>2-3 树 vs 红黑树<\/strong>：2-3 树是平衡思想原型，结点类型多；红黑树是其二叉树实现，用颜色与旋转翻译 2-3 调整。理解 2-3 结构是理解红黑不变量的前提。\n<\/li><li>\n<strong>红黑树 vs AVL 树<\/strong>：AVL 高差严格，查找更稳但插入删除旋转可能更多；红黑约束松弛，插入删除平均调整更少，适合符号表这类频繁修改场景。\n<\/li><li>\n<strong>红黑树 vs 散列表<\/strong>：红黑保留键序、支持排名范围；散列平均常数但无序。选型问题同 c06，平衡化只解决 BST 退化，不改变能力边界。\n<\/ul>\n<p><strong>插入后的恢复流程<\/strong>：新结点先按普通 BST 挂为红色；沿父链向上检查——出现右红链左旋，连续两红右旋，左右皆红则颜色翻转。每次局部调整后重新核对四条不变量，直到根或违规消除。删除流程多一个向下传递：子结点缺黑时从兄弟借色或合并，规则比插入复杂，实现错误会直接破坏黑色平衡。<\/p>\n<p><strong>红黑表示的存储代价<\/strong>：每个结点多一个颜色字段（布尔即可）；旋转只改链接方向，不改键序。标准左倾红黑树约定红链接在左侧，这是实现约定，不是 2-3 树的固有要求；理解原型时先看 3-结点两键的父子关系，再对照颜色链接。<\/p>\n<p><strong>与平衡目标的关系<\/strong>：红黑树解决的是普通 BST 的退化路径，不改变符号表能力边界——查找仍走比较，不提供散列式直接定位；排名、范围、最值等有序操作与普通 BST 一致。<\/p>\n<p><strong>红黑树的工程定位<\/strong>：语言运行时的有序关联映射常用红黑实现，正是因为插入删除平均调整次数少于严格高差的 AVL；查找路径略长于 AVL，但修改开销更低。外存索引走 B 树/B+ 树多结点路线，内存符号表走红黑；三类平衡结构约束对象不同，不能互换套用。<\/p>\n<p><strong>不变量检查顺序<\/strong>：每次插入删除后，先查红链接方向（是否右红），再查连续红链，再查根色，逐条根叶路径收尾核对核对黑高。颜色是表示层，约束才是平衡保证；脱离不变量谈颜色没有意义。<\/p>\n<p><strong>红黑树的适用判断<\/strong>：符号表需要动态增删且要求对数最坏保证，键可比较；若场景只按键取值、不做有序查询，散列更直接。红黑不解决散列式寻址，也不改变 BST 的能力范围。<\/p>\n<h2>联系<\/h2>\n<p>前置：c06 的 BST 键序性质与高度口径。后继：第 3 章选型对照中，红黑树是有序符号表的平衡实现路线；图算法（第 4 章）的平衡结构思想同源：用不变量约束结构形状，把最坏代价锁进对数范围。红黑树的旋转/变色也是后续了解其他平衡树（AVL、B 树）的对照基础。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（红黑树：2-3 树映射与平衡不变量）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：2-3 映射、旋转翻转与树高上界论证<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>讲清红黑树，往回追五层：<\/p>\n<ol><li>\n<strong>普通 BST 的退化<\/strong>：键序性质只约束左右大小，插入顺序可把树压成链，查找退回线性。\n<\/li><li>\n<strong>平衡目标<\/strong>：无论插入顺序，树高保持对数级；需要确定性不变量，不只靠随机期望。\n<\/li><li>\n<strong>2-3 树原型<\/strong>：2-结点存一键、3-结点存两键，插入分裂溢出结点，叶层同高。\n<\/li><li>\n<strong>红黑映射<\/strong>：3-结点拆成红链父子，2-3 调整翻译成二叉树的旋转与变色。\n<\/li><li>\n<strong>不变量与高度<\/strong>：红不连续、根黑、黑高一致；路径上红结点不超过黑结点，树高压在 <span class=\"katex-inline\">2\\lg N<\/span>。\n<\/ol>\n<p>依赖链方向：退化问题 → 平衡需求 → 2-3 原型 → 颜色映射 → 不变量上界。跳过 2-3 原型直接记红黑规则，旋转与翻转的意图无法判断；不变量说不清，树高保证就没有依据。<\/p>\n<h2>正向推导：从 2-3 结构到红黑操作<\/h2>\n<p><strong>第 1 步：2-3 结点形态。<\/strong> 下面逐步核对三类结点的子区间划分：2-结点一键两子；3-结点两键三子，子区间依次为小于小键、两键之间、大于大键；4-结点三键四子，是插入溢出的临时形态。<\/p>\n<p><strong>第 2 步：映射规则。<\/strong> 3-结点的两键在二叉树中画成父子，连接两键的链接记红色，下方结点标红；其余链接黑色。映射后中序遍历与 2-3 树一致，键序不变。<\/p>\n<p><strong>第 3 步：右旋规则。<\/strong> 父结点 <span class=\"katex-inline\">P<\/span>、左子 <span class=\"katex-inline\">Q<\/span>，<span class=\"katex-inline\">Q<\/span> 的右子 <span class=\"katex-inline\">B<\/span>。右旋后 <span class=\"katex-inline\">Q<\/span> 上移为父，<span class=\"katex-inline\">P<\/span> 降为 <span class=\"katex-inline\">Q<\/span> 右子，<span class=\"katex-inline\">B<\/span> 改为 <span class=\"katex-inline\">P<\/span> 左子。大小关系：<span class=\"katex-inline\">Q&lt;P<\/span> 且 <span class=\"katex-inline\">Q&lt;B&lt;P<\/span>，旋转后 <span class=\"katex-inline\">Q<\/span> 在左、<span class=\"katex-inline\">P<\/span> 在右，键序保持。左旋为镜像操作。<\/p>\n<p><strong>第 4 步：颜色翻转。<\/strong> 结点左右子均为红时，两子链接转黑、当前结点转红。对应 4-结点分裂：中间键上浮到父层，左右键各留本地。翻转后红结点上移，沿父链继续检查。<\/p>\n<p><strong>第 5 步：不变量清单。<\/strong><\/p>\n<ul><li>\n红链接只作左链接（左倾约定）；\n<\/li><li>\n任一结点不同时挂两条红链接；\n<\/li><li>\n根为黑；\n<\/li><li>\n根到叶黑层数相同。\n<\/ul>\n<p><strong>第 6 步：树高上界论证。<\/strong> 设黑层数 <span class=\"katex-inline\">h_b<\/span>。<span class=\"katex-inline\">N<\/span> 个结点平衡树的黑层不超过 <span class=\"katex-inline\">\\lg N<\/span>；红结点不能连续，路径上红结点数 <span class=\"katex-inline\">\\le<\/span> 黑结点数，总高 <span class=\"katex-inline\">h\\le 2h_b\\le 2\\lg N<\/span>。查找沿单路径，代价 <span class=\"katex-inline\">O(\\lg N)<\/span>；插入删除的局部调整次数与路径同阶。<\/p>\n<h2>数值算例一：三键插入与 4-结点分裂<\/h2>\n<p>取键 <span class=\"katex-inline\">A,B,C<\/span> 依次插入左倾红黑树。<\/p>\n<ol><li>\n插 <span class=\"katex-inline\">A<\/span>：根 <span class=\"katex-inline\">A<\/span>，黑。\n<\/li><li>\n插 <span class=\"katex-inline\">B<\/span>：<span class=\"katex-inline\">B&gt;A<\/span> 挂右子，红链接在右侧，违反&quot;红链接只作左链接&quot;；左旋 <span class=\"katex-inline\">A<\/span>，<span class=\"katex-inline\">B<\/span> 上移为根，<span class=\"katex-inline\">A<\/span> 降为左子，链接转红。\n<\/li><li>\n插 <span class=\"katex-inline\">C<\/span>：挂 <span class=\"katex-inline\">B<\/span> 右子红；此时 <span class=\"katex-inline\">B<\/span> 左子 <span class=\"katex-inline\">A<\/span> 红、右子 <span class=\"katex-inline\">C<\/span> 红，触发颜色翻转：<span class=\"katex-inline\">A,C<\/span> 转黑，<span class=\"katex-inline\">B<\/span> 转红；根 <span class=\"katex-inline\">B<\/span> 按规则转黑。\n<\/li><li>\n对应 2-3 视角：<span class=\"katex-inline\">A,B,C<\/span> 先成 3-结点再分裂，中间键 <span class=\"katex-inline\">B<\/span> 上浮，<span class=\"katex-inline\">A,C<\/span> 为下层 2-结点；红黑表示下完成一次等值结构调整。\n<\/li><li>\n检查不变量：无连续红链接，黑高一致，根黑；中序 <span class=\"katex-inline\">A,B,C<\/span> 升序。\n<\/ol>\n<h2>数值算例二：旋转前后键序核对<\/h2>\n<p>设局部结构：父 <span class=\"katex-inline\">P=8<\/span>，左子 <span class=\"katex-inline\">Q=3<\/span>，<span class=\"katex-inline\">Q<\/span> 右子 <span class=\"katex-inline\">B=5<\/span>，<span class=\"katex-inline\">P<\/span> 右子 <span class=\"katex-inline\">R=10<\/span>。<\/p>\n<ol><li>\n右旋：<span class=\"katex-inline\">Q=3<\/span> 上移为根，<span class=\"katex-inline\">P=8<\/span> 降为 <span class=\"katex-inline\">Q<\/span> 右子，<span class=\"katex-inline\">B=5<\/span> 改为 <span class=\"katex-inline\">P<\/span> 左子；<span class=\"katex-inline\">R=10<\/span> 仍为 <span class=\"katex-inline\">P<\/span> 右子。\n<\/li><li>\n核对大小：左子树 <span class=\"katex-inline\">3&lt;5&lt;8<\/span>，右子 <span class=\"katex-inline\">10&gt;8<\/span>；旋转后次序 <span class=\"katex-inline\">3,5,8,10<\/span> 不变。\n<\/li><li>\n颜色：旋转前红链随结构移动，旋转后按规则重指定；目标是消除方向违规，不要求颜色数量不变。\n<\/li><li>\n镜像左旋：父 <span class=\"katex-inline\">P<\/span>、右子 <span class=\"katex-inline\">Q<\/span>，<span class=\"katex-inline\">Q<\/span> 左子改 <span class=\"katex-inline\">P<\/span> 右子，大小关系对称核对。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：放松黑高一致。<\/strong> 允许不同路径黑层数不同，长红链可以在一侧生长，树高失去 <span class=\"katex-inline\">2\\lg N<\/span> 上界，查找退回线性。复盘：黑高是平衡的主约束，变色与旋转后必须复查每条根叶路径。<\/p>\n<p><strong>案例 2：删除路径漏处理双红。<\/strong> 删除比插入多一种向下传递：子结点缺黑时需要从兄弟借色或合并；漏做会让黑高在删除侧下降。复盘：删除实现要沿向下路径检查缺黑情形，不能只复用插入的翻转规则。<\/p>\n<p><strong>案例 3：把红色当装饰字段。<\/strong> 颜色不参与不变量检查，随便赋值；结构可能出现连续红链或右红链，映射到 2-3 树时结点划分非法。复盘：颜色每次修改后对照四条不变量核验。<\/p>\n<p><strong>案例 4：旋转改错方向。<\/strong> 右红链违规则左旋，左红链位置错误则右旋；方向选反会制造新的方向违规。复盘：先定位违规链接在哪一侧，再选镜像旋转。<\/p>\n<p><strong>案例 5：红黑树强行承担散列任务。<\/strong> 期望按键直接定位，红黑仍走比较路径；能力边界与普通 BST 相同，平衡化不增加随机访问。复盘：无序取值场景评估散列表，键序场景才用红黑。<\/p>\n<h2>差生通读检查<\/h2>\n<p><strong>卡点 1：2-结点、3-结点、4-结点分不清。<\/strong> 补步骤：按存键个数数——一键 2-结点，两键 3-结点，三键 4-结点；再数子结点个数（2、3、4）。画三种小图对照映射后的红黑形状。<\/p>\n<p><strong>卡点 2：旋转与翻转用途混淆。<\/strong> 补步骤：旋转改链接方向（左右父子关系），翻转改结点颜色（对应分裂上浮）。方向违规用旋转，颜色分组违规用翻转。<\/p>\n<p><strong>卡点 3：不变量背不全。<\/strong> 补步骤：四条列成清单——红只左、不连续、根黑、黑高一致；每改完一处结构，逐条打勾核验。<\/p>\n<p><strong>卡点 4：树高上界推不出来。<\/strong> 补步骤：先定黑层 <span class=\"katex-inline\">h_b\\le\\lg N<\/span>，再用红不连续得红层 <span class=\"katex-inline\">\\le<\/span> 黑层，总高 <span class=\"katex-inline\">\\le 2h_b<\/span>；两步分开写，不要一步跳到结论。<\/p>\n<h2>延伸：红黑树与其他平衡结构对照<\/h2>\n<ul><li>\n<strong>AVL 树<\/strong>：左右子树高差不超过 1，查找路径更短；插入删除可能需要多次旋转。红黑树约束更松，修改时平均调整更少，适合符号表、关联数组这类频繁增删的实现（如语言运行时的有序映射）。\n<\/li><li>\n<strong>B 树/B+ 树<\/strong>：多结点多键，面向磁盘块；红黑是二叉内存结构。外存索引走 B 树方向，内存符号表走红黑。\n<\/li><li>\n<strong>散列表<\/strong>：平均查找常数级，但无键序；需要排名、范围、最值时回到红黑。两种结构常同时出现在一个系统里，按操作类型选用。\n<\/ul>\n<h2>算例三：2-3 树插入分裂过程<\/h2>\n<p>设 2-3 树已有 3-结点存 <span class=\"katex-inline\">A,B<\/span>，插入 <span class=\"katex-inline\">C<\/span>：<\/p>\n<ol><li>\n临时形成 4-结点，键 <span class=\"katex-inline\">A,B,C<\/span> 四子；分裂为中间键 <span class=\"katex-inline\">B<\/span> 上浮到父层，<span class=\"katex-inline\">A<\/span>、<span class=\"katex-inline\">C<\/span> 各成下层 2-结点。\n<\/li><li>\n若父层也是 3-结点，<span class=\"katex-inline\">B<\/span> 并入后再分裂，继续上浮；直到根层则树高加一。\n<\/li><li>\n映射到红黑表示：3-结点两键为红链父子；4-结点对应左右子皆红，翻转后中间键转红上浮。\n<\/li><li>\n对照红黑操作：颜色翻转就是分裂上浮；旋转处理链接方向；两者配合把 2-3 调整翻译成二叉树局部动作。\n<\/ol>\n<h2>算例四：旋转前后局部结构核对<\/h2>\n<p><strong>右旋前<\/strong>：<span class=\"katex-inline\">P=8<\/span> 为父，左子 <span class=\"katex-inline\">Q=3<\/span>，<span class=\"katex-inline\">Q<\/span> 右子 <span class=\"katex-inline\">B=5<\/span>，<span class=\"katex-inline\">P<\/span> 右子 <span class=\"katex-inline\">R=10<\/span>。<\/p>\n<ol><li>\n右旋后 <span class=\"katex-inline\">Q=3<\/span> 为父，<span class=\"katex-inline\">P=8<\/span> 为 <span class=\"katex-inline\">Q<\/span> 右子，<span class=\"katex-inline\">B=5<\/span> 改为 <span class=\"katex-inline\">P<\/span> 左子，<span class=\"katex-inline\">R=10<\/span> 仍为 <span class=\"katex-inline\">P<\/span> 右子。\n<\/li><li>\n大小次序：<span class=\"katex-inline\">3&lt;5&lt;8&lt;10<\/span>，旋转前后中序一致；键序不被旋转重排。\n<\/li><li>\n颜色随结构移动后按规则重指定：目标是消除方向违规，不要求红黑结点数量不变。\n<\/li><li>\n左旋镜像：父 <span class=\"katex-inline\">P<\/span>、右子 <span class=\"katex-inline\">Q<\/span>，<span class=\"katex-inline\">Q<\/span> 左子改为 <span class=\"katex-inline\">P<\/span> 右子；大小关系同样核对中序不变。\n<\/ol>\n<h2>平衡结构对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>结构<\/th><th>平衡约束<\/th><th>查找<\/th><th>插入删除调整<\/th><th>典型用途<\/th><\/tr><\/thead><tbody><tr><td>普通 BST<\/td><td>仅键序<\/td><td>视树高<\/td><td>挂空位<\/td><td>教学、随机输入<\/td><\/tr><tr><td>AVL<\/td><td>子树高差 <span class=\"katex-inline\">\\le1<\/span><\/td><td>路径短<\/td><td>旋转可能多次<\/td><td>查找密集场景<\/td><\/tr><tr><td>红黑树<\/td><td>红不连续、黑高一致<\/td><td><span class=\"katex-inline\">O(\\lg N)<\/span><\/td><td>平均调整少<\/td><td>符号表、关联映射<\/td><\/tr><tr><td>B 树/B+ 树<\/td><td>多结点多键<\/td><td>按块<\/td><td>结点分裂合并<\/td><td>外存索引<\/td><\/tr><\/tbody><\/table><\/div>\n<p>红黑约束比 AVL 松弛：允许更长的局部路径，换取插入删除时更少的旋转次数；频繁增删的语言运行时映射结构常选红黑。<\/p>\n<h2>第二组复盘：红黑实现易错点<\/h2>\n<p><strong>复盘 1：不变量漏查。<\/strong> 只恢复当前违规处，不回头核对黑高一致；一侧路径悄悄变长。复盘：每次修改后逐条过四条清单——红只左、不连续、根黑、黑高一致。<\/p>\n<p><strong>复盘 2：删除复用插入规则。<\/strong> 删除需要向下借色/合并，直接套用翻转会留下缺黑路径。复盘：删除路径单独处理，兄弟分量判断后再决定借色或合并。<\/p>\n<p><strong>复盘 3：颜色字段当装饰。<\/strong> 颜色不参与约束检查，出现连续红链或右红链；映射回 2-3 树时结点划分非法。复盘：颜色修改必须对应结构规则。<\/p>\n<p><strong>复盘 4：旋转方向选反。<\/strong> 右红链违规则左旋，左链位置错则右旋；方向反了制造新违规。复盘：先定位违规链接在哪一侧，再选镜像旋转。<\/p>\n<p><strong>复盘 5：把红黑当散列。<\/strong> 期望按键直接定位，红黑仍走比较路径；平衡化不增加随机访问能力。无序取值场景评估散列表。<\/p>\n<h2>延伸：从 2-3 到红黑的理解顺序<\/h2>\n<p>先掌握 2-3 树的结点形态与分裂动作，再看红链怎样表示 3-结点；旋转解决方向，翻转解决分裂。脱离原型背规则，遇到删除与复杂插入无法判断调整是否合法。红黑树的树高上界 <span class=\"katex-inline\">2\\lg N<\/span> 来自黑层 <span class=\"katex-inline\">\\lg N<\/span> 加红层不超过黑层；这条论证也是后续学习其他平衡树高度分析的参照：先用不变量定层数，再数附加层。<\/p>\n<h2>算例五：红黑插入的局部调整链<\/h2>\n<p>取依次插入 <span class=\"katex-inline\">E,A,R,C,H<\/span>（沿用书里 BST 示例序列的红黑视角）。<\/p>\n<ol><li>\n<span class=\"katex-inline\">E<\/span> 根，黑；<span class=\"katex-inline\">A<\/span> 挂左红；<span class=\"katex-inline\">R<\/span> 挂右红，出现右红链，左旋 <span class=\"katex-inline\">E<\/span>，<span class=\"katex-inline\">R<\/span> 上移，<span class=\"katex-inline\">E<\/span> 落左子。\n<\/li><li>\n<span class=\"katex-inline\">C<\/span> 挂入左子位置；若与其父形成连续红链，按规则右旋恢复；左右皆红处翻转。\n<\/li><li>\n每步动作定位：方向违规用旋转，分组违规用翻转；调整后回到根方向复查。\n<\/li><li>\n最终形状对应一棵合法 2-3 树：红链表示 3-结点，黑高在各路径一致。\n<\/li><li>\n核对清单：无右红链、无连续两红、根黑、黑高相同；中序次序与普通 BST 一致。\n<\/ol>\n<h2>不变量与违反后果对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>不变量<\/th><th>违反表现<\/th><th>后果<\/th><\/tr><\/thead><tbody><tr><td>红链接只作左链接<\/td><td>出现右红父子<\/td><td>方向违规，映射 3-结点方向错乱<\/td><\/tr><tr><td>不同时两条红链接<\/td><td>红结点连续<\/td><td>单侧路径多出一倍结点<\/td><\/tr><tr><td>根为黑色<\/td><td>根染红<\/td><td>黑高计数口径不稳<\/td><\/tr><tr><td>根叶黑高一致<\/td><td>路径黑层数不同<\/td><td>树高失去 <span class=\"katex-inline\">2\\lg N<\/span> 上界<\/td><\/tr><\/tbody><\/table><\/div>\n<p>四条约束共同把路径长度压住；放松任一条，平衡保证逐层失效。旋转不改键序，只改链接方向；翻转不改结点集合，只改颜色归属。<\/p>\n<h2>高度论证再展开<\/h2>\n<p>设黑层数 <span class=\"katex-inline\">h_b<\/span>。<span class=\"katex-inline\">N<\/span> 个结点的平衡二叉树黑层不超过 <span class=\"katex-inline\">\\lg N<\/span>；红结点不能连续，一条路径上红结点数不超过黑结点数，总高 <span class=\"katex-inline\">h\\le 2h_b\\le 2\\lg N<\/span>。查找沿单路径，代价 <span class=\"katex-inline\">O(\\lg N)<\/span>；插入删除的局部调整次数与路径同阶。<\/p>\n<p>对照普通 BST：形状随插入顺序波动，最坏 <span class=\"katex-inline\">N-1<\/span>；红黑用颜色不变量把最坏路径锁住。对照 AVL：高差严格 1，查找更短但旋转更多；红黑松弛换修改效率。<\/p>\n<h2>第四组复盘：理解与实现分界<\/h2>\n<p><strong>复盘 1：先背红黑规则不懂 2-3 原型。<\/strong> 遇到删除与复杂插入无法判断调整合法性。复盘：先画 2-3 结点与分裂，再映射红链。 <strong>复盘 2：旋转翻转用途混。<\/strong> 方向问题旋转，分裂问题翻转；混用会连续制造新违规。 <strong>复盘 3：颜色当装饰字段。<\/strong> 不参与约束检查，连续红链/右红链无人发现。 <strong>复盘 4：放松黑高不复查。<\/strong> 一侧路径悄悄变长；每次修改后逐条根叶核对。 <strong>复盘 5：红黑承担散列定位。<\/strong> 比较路径不变，平衡化不提供直接寻址；无序取值归散列。<\/p>\n<h2>2-3 树形态与映射对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>2-3 形态<\/th><th>键数<\/th><th>子结点<\/th><th>红黑表示<\/th><\/tr><\/thead><tbody><tr><td>2-结点<\/td><td>1<\/td><td>2<\/td><td>普通黑结点<\/td><\/tr><tr><td>3-结点<\/td><td>2<\/td><td>3<\/td><td>红链父子，红在下侧<\/td><\/tr><tr><td>4-结点<\/td><td>3<\/td><td>4<\/td><td>左右子皆红，翻转分裂<\/td><\/tr><\/tbody><\/table><\/div>\n<p>2-3 树插入自底向上分裂，叶层同高；红黑树把这套动作翻译成二叉树旋转与变色。脱离原型记规则，删除与复杂插入无法判断合法性；先画 2-3 结点，再对照颜色链接，是理解红黑的稳定顺序。<\/p>\n<h2>工程实现注意<\/h2>\n<ul><li>\n颜色字段布尔即可；标准左倾红黑约定红链接在左侧。\n<\/li><li>\n旋转只改链接方向，键序中序不变；翻转只改颜色归属，不改结点集合。\n<\/li><li>\n删除需要向下借色/合并，比插入多一条传递路径；不能直接套用插入翻转。\n<\/li><li>\n每次修改后按清单复查：红只左、不连续、根黑、黑高一致。\n<\/ul>\n<h2>平衡结构再对照<\/h2>\n<p>AVL 高差严格 1，查找路径短但旋转可能多次；红黑约束松弛，增删平均调整更少，适合频繁修改的有序映射。B 树多结点面向磁盘块；内存符号表走红黑。选型先看存储介质与操作频率，再定平衡路线。<\/p>\n<h2>红黑操作链再述<\/h2>\n<p>新结点先挂红；沿父链复查：右红链左旋，连续两红右旋，左右皆红翻转。旋转改链接方向，中序键序不变；翻转改颜色归属，结点集合不变。删除多一条向下借色/合并路径，不能直接套插入翻转。<\/p>\n<p>不变量四条：红只左、不连续、根黑、黑高一致。黑层 <span class=\"katex-inline\">h_b\\le\\lg N<\/span>，红层不超过黑层，总高 <span class=\"katex-inline\">h\\le2\\lg N<\/span>。放松任一条件，树高上界逐层失效。2-3 原型先记结点形态与分裂，再映射红链；脱离原型背规则，复杂插入删除无法判断合法性。<\/p>\n<h2>与其他平衡结构分工<\/h2>\n<p>AVL 高差严格 1，查找短但旋转多；红黑松弛换增删效率，适合频繁修改的有序映射。B 树多结点面向磁盘块，不走二叉内存路线。选型看存储介质与操作频率，红黑不提供散列式直接寻址。<\/p>\n<p>红黑树理解顺序：先 2-3 结点与分裂动作，再看红链映射；旋转处理方向违规，翻转处理分裂上浮。四条不变量逐条复查，树高 <span class=\"katex-inline\">2\\lg N<\/span> 上界由黑层加红层推出。工程上有序映射频繁增删选红黑，查找极短路径选 AVL，外存索引选 B 树；红黑不提供散列寻址，也不扩展 BST 的有序方法集合。<\/p>\n<p>红黑不变量的检查顺序：先查红链接方向，再查连续红链，再查根色，逐条根叶核对黑高收尾。颜色是 2-3 结构的表示层，脱离约束谈颜色没有意义。删除路径比插入多借色与合并环节，实现错误会直接破坏黑色平衡；每次局部调整后回到根方向复查，直到四条约束全部满足。<\/p>\n<p>对照普通 BST：键序约束相同，差别只在颜色不变量锁住树高；对照散列：平衡化不改变比较路径定位，不提供随机寻址。选型先确认是否需要有序操作，再在红黑与散列之间分工；两者共用键比较约定，定位路径不互换；红黑树的有序方法集合与普通 BST 一致，差别只在最坏高度被不变量锁住。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n2-结点、3-结点、4-结点各存几个键、几个子结点？3-结点怎样映射成红黑二叉树？\n<\/li><li>\n右旋前后各子树键序怎样保持？写出 <span class=\"katex-inline\">Q<\/span>、<span class=\"katex-inline\">B<\/span>、<span class=\"katex-inline\">P<\/span> 的位置变化。\n<\/li><li>\n颜色翻转对应 2-3 树的什么动作？翻转后红结点向哪个方向移动？\n<\/li><li>\n四条红黑不变量各是什么？树高 <span class=\"katex-inline\">2\\lg N<\/span> 上界怎样由黑高与红不连续推出？\n<\/li><li>\n红黑树与 AVL 的约束松紧差别是什么？为什么频繁增删场景常选红黑？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "红黑树：2-3 树映射与平衡不变量"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：算法 第四版 Algorithms (4th Edition).pdf · p.332<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">符号表与二叉查找树：顺序查找、二分查找与 BST 性质<\/a><\/span><\/div><h1>散列表：散列函数、拉链法、线性探测与均匀散列假设<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch03（原书 §3.4 散列表，PDF 第 332 页，印刷 293）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>散列表是把键经散列函数映射为数组索引、再处理碰撞的符号表：拉链法在同一索引处挂链表，线性探测法沿索引向后寻找空位；在均匀散列假设下，平均查找长度由装填因子 <span class=\"katex-inline\">\\alpha=N/M<\/span> 决定，趋近常数；散列放弃键序换取接近常数的插入与查找，冲突处理与扩容重散列是维持平均代价的两个部件。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>若键是小整数，可直接作数组下标，一次访问取值。实际键类型多样：字符串、对象、长整数，取值范围远大于可用内存；直接开超大数组不可行。比较结构（BST、红黑树）查找走路径，代价对数级；散列表想把定位压到常数级，途径是算术映射加冲突处理。<\/p>\n<p>不用散列会卡在：有序数组插入贵，BST 查找依赖树高；动态键值场景需要不依赖键序的快速取值。散列的代价是放弃排名、范围、最值等有序操作；冲突不可避免（不同键可能落到同一索引），必须有确定的碰撞处理规则。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>散列函数<\/strong>：把键转成数组 <span class=\"katex-inline\">[0,M-1]<\/span> 区间的整数索引。整数常用除留余数 <code>key % M<\/code>，<span class=\"katex-inline\">M<\/span> 取素数减少规律性聚集；字符串按字符编码加权累加再取模。函数要求：同一键结果恒定，不同键尽量分散。<\/p>\n<p><strong>拉链法（separate chaining）<\/strong>：每个索引挂一条链表；散列到同一索引的键值对挂在链上。查找沿链表比较；插入挂表头；删除在链上定位后摘除。<\/p>\n<p><strong>线性探测法（linear probing）<\/strong>：碰撞后从索引起顺序探测下一个位置，空位存入；查找沿探测序列比较，命中或遇空为止。装填因子升高时探测段变长。<\/p>\n<p><strong>装填因子 <span class=\"katex-inline\">\\alpha<\/span><\/strong>：<span class=\"katex-inline\">\\alpha=N/M<\/span>，键数除以表长。拉链法通常控制 <span class=\"katex-inline\">\\alpha\\le 1<\/span> 量级；线性探测法一般 <span class=\"katex-inline\">\\alpha\\le 2/3<\/span>，超界扩容再散列。<\/p>\n<p><strong>扩容与再散列<\/strong>：<span class=\"katex-inline\">\\alpha<\/span> 超过阈值时新建更长的表，把旧表键逐个重新散列插入；扩容把探测长度压回低水平，代价平摊到后续插入。<\/p>\n<p><strong>均匀散列假设<\/strong>：每个键等概率落到 <span class=\"katex-inline\">M<\/span> 个索引之一，落位相互独立。平均长度公式在这条假设下成立；假设破裂，同类键聚集到少数索引，链表或探测段拉长。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">M=10<\/span>、<span class=\"katex-inline\">N=20<\/span>，<span class=\"katex-inline\">\\alpha=2<\/span>，拉链命中平均约 <span class=\"katex-inline\">1+\\alpha=3<\/span> 次比较。<strong>反例<\/strong>：散列不是加密，不要求不可逆，只要求分布均匀；把散列函数当安全哈希是误用。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>拉链法平均长度<\/strong>：均匀假设下，每条链长期望 <span class=\"katex-inline\">\\alpha=N/M<\/span>。命中查找遍历到目标结点，平均比较 <span class=\"katex-inline\">1+\\alpha<\/span> 量级；未命中遍历整条链，平均长度 <span class=\"katex-inline\">\\alpha<\/span>。表空索引占比期望 <span class=\"katex-inline\">(1-1/M)^N\\approx e^{-\\alpha}<\/span>。<span class=\"katex-inline\">\\alpha<\/span> 固定时表长与键数同比增长，平均长度不变。<\/p>\n<p><strong>线性探测探测长度<\/strong>：碰撞后顺序后移，同类键形成聚集（簇）；平均探测长度高于拉链法，且随 <span class=\"katex-inline\">\\alpha<\/span> 上升加速。书中给出的口径：成功查找平均探测约 <span class=\"katex-inline\">\\frac12(1+1/(1-\\alpha))<\/span> 方向，未命中更长；<span class=\"katex-inline\">\\alpha<\/span> 接近 1 时探测长度发散。<\/p>\n<p><strong>扩容平摊<\/strong>：单次扩容复制 <span class=\"katex-inline\">N<\/span> 个键，间隔多次插入；把扩容代价摊到平摊口径，每次插入分摊常数级别。不扩容则 <span class=\"katex-inline\">\\alpha<\/span> 趋向很大，探测链退化成扫描。<\/p>\n<p><strong>均匀假设的必要性<\/strong>：平均长度公式把落位看成独立等概率抽样；若散列函数把连续键、同类键映到相邻或相同索引，链长分布偏离期望，常数级优势消失。散列质量由函数分布与表长选择共同决定。<\/p>\n<h2>适用条件与边界<\/h2>\n<p><strong>成立条件<\/strong>：<\/p>\n<ol><li>\n只按键取值、插入、删除，不需要排名与范围查询；\n<\/li><li>\n键的散列分布可做到均匀，表长与键数匹配；\n<\/li><li>\n接受平摊口径：扩容瞬间有复制代价。\n<\/ol>\n<p><strong>边界与失败案例<\/strong>：<\/p>\n<ul><li>\n无序能力：不能输出按键升序序列，不能做区间查询、最值排名。\n<\/li><li>\n删除受限：线性探测不能直接置空，否则打断探测序列；需标记删除位或后续整理。\n<\/li><li>\n散列不均：同类键聚集时平均长度上升，极端退回链表扫描。\n<\/li><li>\n表长固定不扩容：<span class=\"katex-inline\">\\alpha<\/span> 升高后探测链持续变长，插入查找同步退化。\n<\/li><li>\n键可变内容：作为散列键的对象若字段可变，散列值与定位会失效；键在表期间应视为不可变。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>散列表 vs BST/红黑树<\/strong>：散列平均常数级、无序；BST 对数级、保留键序。只取值选散列，要有序操作选平衡树。\n<\/li><li>\n<strong>拉链法 vs 线性探测<\/strong>：拉链链表独立，聚集不跨链，删除简单；线性探测连续存放、缓存局部性好，但删除与聚集处理复杂。负载高时拉链更稳，负载低时线性探测空间更紧。\n<\/li><li>\n<strong>散列函数 vs 加密哈希<\/strong>：散列为分布均匀服务，可复算、不保密；加密哈希抗碰撞、不可逆，用于签名与校验。两者目标不同，不能互相替代。\n<\/li><li>\n<strong>散列查找 vs 顺序查找<\/strong>：顺序查找 <span class=\"katex-inline\">O(N)<\/span> 靠逐个比较；散列靠算术定位加短链/短探测，平均常数级；代价差异来自定位方式，不是比较次数的小优化。\n<\/ul>\n<p><strong>散列函数的选取口径<\/strong>：整数键除留余数，表长 <span class=\"katex-inline\">M<\/span> 取素数，避免键的周期倍数映到同一段索引；字符串键按字符编码加权累加，乘系数再取模。同一键散列值必须恒定；函数输出平坦、不规律聚集是均匀假设成立的前提。散列不要求不可逆，与加密哈希目标不同。<\/p>\n<p><strong>删除与键的不可变性<\/strong>：线性探测删除不能直接置空，否则打断后续键的探测序列；需打删除标记或定期整理。作为散列键的对象在表期间应视为不可变，<code>equals<\/code> 与散列函数基于同一组字段；字段修改后散列值变化，原表中定位不到，键值对丢失。<\/p>\n<p><strong>负载与扩容口径<\/strong>：<span class=\"katex-inline\">\\alpha=N/M<\/span> 是键数与表长之比；拉链法通常宽松，线性探测一般压在 <span class=\"katex-inline\">2/3<\/span> 以下。超阈值新建更长表，旧键逐个重散列；扩容代价平摊到多次插入，单次分摊常数级。不扩容则探测链随 <span class=\"katex-inline\">\\alpha<\/span> 升高退化为长扫描。<\/p>\n<p><strong>散列表在符号表谱系中的位置<\/strong>：它与 BST/红黑是两条实现路线，能力边界由放弃键序换来。工程字典、缓存、计数索引常用散列；需要排名、范围、有序遍历时回到平衡树。散列质量看函数分布与表长选择，平均常数级结论只在均匀假设与扩容机制同时成立时有效。<\/p>\n<p><strong>碰撞处理的共同前提<\/strong>：无论拉链还是探测，散列函数先把键压到索引区间；冲突规则只解决同索引落位。删除、扩容、键不可变性是两条路线共同的工程约束，差别在聚集形态与删除复杂度。<\/p>\n<p><strong>散列与有序结构的能力边界<\/strong>：散列平均查找常数级，但排名、选择、范围、有序遍历整体缺席；需要这些操作选平衡树。散列质量受函数分布与表长选择约束，扩容再散列把高负载压回低位；键在表期间不可变，相等判断与散列函数同源。<\/p>\n<h2>联系<\/h2>\n<p>前置：c06 符号表 API 与两条朴素路线；c01 的平均长度与概率口径。后继：第 3 章选型对照把散列与红黑并列为符号表两条实现路线；散列的均匀抽样视角与 c04 快排随机化同源——都用随机/均匀假设打破固定输入对结构的定向影响。工程中字典、缓存、索引常用散列实现，理解冲突处理是读源码的前提。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（散列表：散列函数、拉链法、线性探测与均匀散列假设）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：散列落位、冲突计数与探测长度推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>讲清散列表，往回追五层：<\/p>\n<ol><li>\n<strong>键值定位需求<\/strong>：按键存值、取值；比较结构走路径，散列追求算术直接定位。\n<\/li><li>\n<strong>直接下标不可行<\/strong>：键类型多样、取值范围远超内存，不能把键当下标开数组。\n<\/li><li>\n<strong>散列映射<\/strong>：函数把键压到 <span class=\"katex-inline\">[0,M-1]<\/span> 索引；同一键结果恒定，不同键尽量分散。\n<\/li><li>\n<strong>碰撞处理<\/strong>：拉链挂链表，线性探测找空位；两种路线把同索引冲突隔开。\n<\/li><li>\n<strong>假设与扩容<\/strong>：均匀散列假设给出平均长度；装填因子超阈值就扩容再散列，把探测长度压回低位。\n<\/ol>\n<p>依赖链方向：定位需求 → 映射压缩 → 冲突规则 → 均匀假设 → 扩容维护。跳过均匀假设，平均长度公式只是纸面结论；不讲扩容，高负载下退化路径无法解释。<\/p>\n<h2>正向推导：从函数到平均代价<\/h2>\n<p><strong>第 1 步：散列函数口径。<\/strong> 整数键除留余数：<span class=\"katex-inline\">h(k)=k\\bmod M<\/span>，<span class=\"katex-inline\">M<\/span> 取素数，避免键的规律倍数映到同一索引。字符串键按字符编码加权：<span class=\"katex-inline\">h=(R\\cdot h+c_i)\\bmod M<\/span>，<span class=\"katex-inline\">R<\/span> 取小素数。函数输出必须确定：同键同索引，否则查找无法复现路径。<\/p>\n<p><strong>第 2 步：拉链法计数。<\/strong> 表长 <span class=\"katex-inline\">M<\/span>、键数 <span class=\"katex-inline\">N<\/span>，<span class=\"katex-inline\">\\alpha=N/M<\/span>。均匀假设下每条链长期望 <span class=\"katex-inline\">\\alpha<\/span>。<\/p>\n<ul><li>\n命中查找：遍历到目标结点，平均比较 <span class=\"katex-inline\">1+\\alpha<\/span> 量级；\n<\/li><li>\n未命中：遍历整条链，平均长度 <span class=\"katex-inline\">\\alpha<\/span>；\n<\/li><li>\n空索引比例：<span class=\"katex-inline\">(1-1/M)^N\\approx e^{-\\alpha}<\/span>。\n<p><span class=\"katex-inline\">\\alpha<\/span> 固定时 <span class=\"katex-inline\">M<\/span> 与 <span class=\"katex-inline\">N<\/span> 同比增长，平均长度不随规模上升。<\/p>\n<\/ul>\n<p><strong>第 3 步：线性探测规则。<\/strong> 插入：<span class=\"katex-inline\">h(k)<\/span> 起，空位存入；查找：<span class=\"katex-inline\">h(k)<\/span> 起顺序比较，命中返回，遇空判定不存在；删除不能置空，需标记删除位，否则后续键的探测序列被截断。<\/p>\n<p><strong>第 4 步：探测长度与聚集。<\/strong> 碰撞键向后挤在一起形成簇；簇内查找长度随簇长增加。书中口径：成功查找平均探测约 <span class=\"katex-inline\">\\frac12(1+1/(1-\\alpha))<\/span> 方向，未命中更长；<span class=\"katex-inline\">\\alpha\\to1<\/span> 时分母趋零，探测长度发散。线性探测缓存局部性好，但聚集比拉链敏感。<\/p>\n<p><strong>第 5 步：扩容平摊。<\/strong> <span class=\"katex-inline\">\\alpha<\/span> 超阈值（拉链约 1，线性探测约 2/3）时新建 <span class=\"katex-inline\">M&#x27;<\/span> 表，旧键逐个重新散列。扩容一次复制 <span class=\"katex-inline\">N<\/span> 个键，间隔多次插入；平摊到每次插入为常数级别。不扩容则 <span class=\"katex-inline\">\\alpha<\/span> 持续升高，探测链退化为长扫描。<\/p>\n<p><strong>第 6 步：均匀假设检验。<\/strong> 公式把落位当独立等概率抽样；函数把连续键映到相邻索引、同类键映到同段，链长分布偏离期望。散列质量看两件事：函数分布是否平坦，表长是否避开规律倍数。<\/p>\n<h2>数值算例一：拉链法逐步落位<\/h2>\n<p>取 <span class=\"katex-inline\">M=5<\/span>，键序列 <span class=\"katex-inline\">[7,12,22,17,3,9,14]<\/span>，散列 <span class=\"katex-inline\">h=k\\bmod 5<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">7\\bmod5=2<\/span>：链 2：<span class=\"katex-inline\">[7]<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">12\\bmod5=2<\/span>：链 2：<span class=\"katex-inline\">[12,7]<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">22\\bmod5=2<\/span>：链 2：<span class=\"katex-inline\">[22,12,7]<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">17\\bmod5=2<\/span>：链 2：<span class=\"katex-inline\">[17,22,12,7]<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">3\\bmod5=3<\/span>：链 3：<span class=\"katex-inline\">[3]<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">9\\bmod5=4<\/span>：链 4：<span class=\"katex-inline\">[9]<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">14\\bmod5=4<\/span>：链 4：<span class=\"katex-inline\">[14,9]<\/span>。\n<\/li><li>\n计数：链 2 长 4，链 4 长 2，链 3 长 1，链 0、1 空；<span class=\"katex-inline\">\\alpha=7/5=1.4<\/span>。命中链 2 末端键平均要走 2–3 次比较，高于均匀期望；本例落位集中在链 2，正是分布不均的小样本表现。\n<\/li><li>\n对照均匀情形：7 个键应大致均摊到 5 条链，每链 1–2 个；实际聚集说明小样本下函数与表长选择影响明显。\n<\/ol>\n<h2>数值算例二：线性探测插入与簇形成<\/h2>\n<p>取 <span class=\"katex-inline\">M=7<\/span>，键 <span class=\"katex-inline\">[0,7,14,1,8,15]<\/span>，散列 <span class=\"katex-inline\">h=k\\bmod7<\/span>。<\/p>\n<ol><li>\n0 → 槽 0；7 → 槽 0 碰撞，占槽 1；14 → 槽 0 碰撞，探槽 1 占、槽 2 占，占槽 3。\n<\/li><li>\n1 → 槽 1 碰撞，探槽 2 占，占槽 4；8 → 槽 1 碰撞，探槽 2、3、4 占，占槽 5；15 → 槽 1 碰撞，探到槽 6。\n<\/li><li>\n槽位占用：0:0，1:7，2:14，3:1，4:8，5:15，6 空；已形成两个簇段。\n<\/li><li>\n查找 14：槽 0→1→2，3 次探测；查找 15：槽 0→1→2→3→4→5，5 次探测。簇越长，末端键探测越久。\n<\/li><li>\n<span class=\"katex-inline\">\\alpha=6/7\\approx0.86<\/span>，已接近高负载；若继续插入，簇会合并增长，未命中探测长度显著上升。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：散列函数分布不均。<\/strong> 同类键映到相邻或相同索引，单链/单簇超长，其余索引空闲；平均长度从 <span class=\"katex-inline\">1+\\alpha<\/span> 升到接近 <span class=\"katex-inline\">N<\/span>。复盘：检查函数输出分布，换加权方式或调整表长素数。<\/p>\n<p><strong>案例 2：表长固定不扩容。<\/strong> 键数增加 <span class=\"katex-inline\">\\alpha<\/span> 趋大，探测链持续变长；插入查找同步退化。复盘：设阈值，超界新建表再散列，平摊代价可控。<\/p>\n<p><strong>案例 3：线性探测删除直接置空。<\/strong> 置空打断后续键的探测序列，原本在后面的键查找时遇空误判不存在。复盘：删除位打标记，或定期整理压缩；查找跳过标记位。<\/p>\n<p><strong>案例 4：可变对象作散列键。<\/strong> 对象字段修改后散列值变化，原表中定位不到，键值对丢失。复盘：作键的对象在表期间冻结字段，<code>equals<\/code> 与散列函数基于同一组不可变字段。<\/p>\n<p><strong>案例 5：把散列当加密。<\/strong> 要求散列不可逆、抗碰撞，普通除留余数不满足；复盘：分清均匀分布与安全哈希两类目标。<\/p>\n<h2>差生通读检查<\/h2>\n<p><strong>卡点 1：散列函数与冲突处理混在一起。<\/strong> 补步骤：函数只负责算索引；拉链/探测负责同索引冲突。先定映射规则，再选冲突路线。<\/p>\n<p><strong>卡点 2：装填因子算反。<\/strong> 补步骤：<span class=\"katex-inline\">\\alpha=N/M<\/span>，键数除以表长；<span class=\"katex-inline\">\\alpha<\/span> 大表示拥挤，小表示宽松。扩容方向是增大 <span class=\"katex-inline\">M<\/span> 把 <span class=\"katex-inline\">\\alpha<\/span> 压下来。<\/p>\n<p><strong>卡点 3：拉链与线性探测选择依据不清。<\/strong> 补步骤：链表独立、删除简单、高负载稳；连续存放、缓存好、删除麻烦。按负载预期与删除频率选。<\/p>\n<p><strong>卡点 4：均匀假设找不到落点。<\/strong> 补步骤：平均长度公式的前提是各索引等概率落位；函数或表长破坏这个前提，公式数字就不能引用。<\/p>\n<h2>延伸：符号表选型中的散列位置<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>需求<\/th><th>散列表<\/th><th>平衡树（红黑）<\/th><\/tr><\/thead><tbody><tr><td>按键取值/插入/删除<\/td><td>平均常数级<\/td><td>对数级<\/td><\/tr><tr><td>排名、选择、最值<\/td><td>不支持<\/td><td>支持<\/td><\/tr><tr><td>范围查询<\/td><td>不支持<\/td><td>支持<\/td><\/tr><tr><td>有序遍历输出<\/td><td>不支持<\/td><td>中序输出<\/td><\/tr><tr><td>最坏保证<\/td><td>依赖散列质量<\/td><td>对数上界<\/td><\/tr><\/tbody><\/table><\/div>\n<p>系统设计时常并存两套实现：字典缓存走散列，需要有序索引的场景走树。读源码时先看冲突路线与扩容阈值，再看散列函数基于哪些字段。<\/p>\n<h2>算例三：字符串散列值计算<\/h2>\n<p>取 <span class=\"katex-inline\">R=31<\/span>，字符串 <code>&quot;abc&quot;<\/code>，编码 <span class=\"katex-inline\">a=1,b=2,c=3<\/span>，<span class=\"katex-inline\">M=7<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">h=0<\/span>；<span class=\"katex-inline\">h=(31\\cdot0+1)\\bmod7=1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">h=(31\\cdot1+2)\\bmod7=33\\bmod7=5<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">h=(31\\cdot5+3)\\bmod7=158\\bmod7=4<\/span>。\n<\/li><li>\n索引 4；换一个字符串重算，对照落位是否分散。加权系数 <span class=\"katex-inline\">R<\/span> 取小素数，目的是让相邻字符差异在散列值中散开，避免同类字符串集中。\n<\/ol>\n<h2>算例四：线性探测删除的序列保护<\/h2>\n<p>表 <span class=\"katex-inline\">M=5<\/span>，插入后槽位：0:A，1:B，2:C，3:D，4:E。<\/p>\n<ol><li>\n若删除槽 2 的 C 直接置空，查找 D 时从其散列位探到槽 2 遇空，误判不存在；后续 D、E 全部查不到。\n<\/li><li>\n正确做法：槽 2 打删除标记，查找跳过标记位继续探；插入可复用标记位。定期整理压缩时再重建无标记表。\n<\/li><li>\n拉链法删除无此问题：链表摘除结点不影响其他链，删除实现更直接；代价是每个结点多一个指针字段。\n<\/ol>\n<h2>冲突路线对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>拉链法<\/th><th>线性探测<\/th><\/tr><\/thead><tbody><tr><td>存储<\/td><td>索引挂链表<\/td><td>表内连续槽位<\/td><\/tr><tr><td>聚集<\/td><td>链间独立<\/td><td>同类键形成簇<\/td><\/tr><tr><td>删除<\/td><td>链表摘除即可<\/td><td>需标记，防打断序列<\/td><\/tr><tr><td>缓存局部性<\/td><td>链表结点分散<\/td><td>连续访问较好<\/td><\/tr><tr><td>高负载表现<\/td><td>相对稳<\/td><td>探测长度加速上升<\/td><\/tr><tr><td>空间<\/td><td>链指针额外开销<\/td><td>表内紧凑<\/td><\/tr><\/tbody><\/table><\/div>\n<p>选型：负载高、删除多用拉链；负载低、空间紧、缓存敏感用线性探测。两种路线都依赖均匀散列与阈值扩容。<\/p>\n<h2>第二组复盘：散列表失效场景<\/h2>\n<p><strong>复盘 1：函数分布不均。<\/strong> 连续键或同类键映到相邻/相同索引，单链超长、其余空闲；平均长度从 <span class=\"katex-inline\">1+\\alpha<\/span> 升到接近 <span class=\"katex-inline\">N<\/span>。复盘：检查输出分布，换加权方式或表长素数。<\/p>\n<p><strong>复盘 2：固定表长不扩容。<\/strong> 键数增加 <span class=\"katex-inline\">\\alpha<\/span> 趋大，探测链变长，插入查找同步退化。复盘：设阈值新建表重散列，平摊代价可控。<\/p>\n<p><strong>复盘 3：可变对象作键。<\/strong> 字段改后散列值变，原条目定位丢失。复盘：键字段冻结，<code>equals<\/code> 与散列函数同源。<\/p>\n<p><strong>复盘 4：把散列当加密。<\/strong> 除留余数不抗碰撞、不可逆性不保证；安全签名校验走加密哈希。复盘：分清均匀分布与安全两类目标。<\/p>\n<p><strong>复盘 5：期待范围查询。<\/strong> 散列不保留键序，区间扫描无法沿索引剪枝；需要有序操作归 BST/红黑。复盘：选型先列操作类型，再定结构。<\/p>\n<h2>延伸：散列与随机化的同源口径<\/h2>\n<p>快排随机化把切分位置摊平，散列均匀假设把键落位摊平；两者都用统计分布避免固定输入定向破坏结构。假设破裂时表现同类：快排退化链、散列退化链。读散列源码先看三件事：函数基于哪些字段、冲突走哪条路线、扩容阈值与再散列时机；平均常数级结论只在这三件事合规时成立。<\/p>\n<h2>散列代价推导再核对<\/h2>\n<p><strong>拉链法<\/strong>：均匀假设下每条链长期望 <span class=\"katex-inline\">\\alpha=N/M<\/span>。命中平均比较 <span class=\"katex-inline\">1+\\alpha<\/span> 量级，未命中平均长度 <span class=\"katex-inline\">\\alpha<\/span>；空索引比例 <span class=\"katex-inline\">(1-1/M)^N\\approx e^{-\\alpha}<\/span>。<span class=\"katex-inline\">\\alpha<\/span> 固定，<span class=\"katex-inline\">M<\/span> 与 <span class=\"katex-inline\">N<\/span> 同比增长，平均长度不随规模上升。<\/p>\n<p><strong>线性探测<\/strong>：成功查找平均探测约 <span class=\"katex-inline\">\\frac12(1+1/(1-\\alpha))<\/span> 方向，未命中更长；<span class=\"katex-inline\">\\alpha\\to1<\/span> 分母趋零，探测长度发散。簇内键互相挤压，负载越高聚集越明显。<\/p>\n<p><strong>扩容平摊<\/strong>：一次扩容复制 <span class=\"katex-inline\">N<\/span> 键，间隔多次插入；平摊到每次插入常数级。不扩容则 <span class=\"katex-inline\">\\alpha<\/span> 趋大，链/簇退化为长扫描。<\/p>\n<p><strong>均匀假设必要性<\/strong>：公式把落位当独立等概率抽样；函数把同类键聚到同段，链长分布偏离期望，常数优势消失。检验分布要看各索引落位是否平坦。<\/p>\n<h2>键与相等性口径<\/h2>\n<p>散列表中 <code>equals<\/code> 判断同键，散列函数决定索引；两条规则基于同一组字段。约定：相等键散列值必须相同，散列值不同的键不必相等。对象作键后字段冻结，否则修改后定位不到原条目。自定义类型作键时，<code>equals<\/code> 与散列函数要配套实现，只改其一就会出现查找丢失。<\/p>\n<h2>选型决策顺序<\/h2>\n<ol><li>\n先列操作：只取值/插入/删除，还是需要排名、范围、最值、有序遍历。\n<\/li><li>\n只取值：评估散列；要有序操作：评估 BST/红黑。\n<\/li><li>\n定冲突路线：高负载、删除多用拉链；低负载、缓存敏感用探测。\n<\/li><li>\n定扩容阈值与再散列时机；检查键类型不可变。\n<\/li><li>\n平均结论标注均匀假设；最坏情况依赖散列质量，不承诺对数上界。\n<\/ol>\n<p>这套顺序对应工程字典、缓存、计数索引的常见实现；读源码先看函数字段、冲突路线、扩容三件事。<\/p>\n<h2>散列函数设计要点<\/h2>\n<ul><li>\n整数键：除留余数，表长取素数，避免键的周期倍数落到同段。\n<\/li><li>\n字符串键：字符编码加权累加，乘小系数 <span class=\"katex-inline\">R<\/span> 再取模，让相邻字符差异散开。\n<\/li><li>\n自定义对象：<code>equals<\/code> 与散列基于同一组不可变字段；相等键散列值必须相同。\n<\/li><li>\n分布检验：观察各索引落位计数，平坦才满足均匀假设；聚集说明函数或表长要调整。\n<\/ul>\n<p>散列不要求不可逆，与加密哈希目标不同；加密场景要抗碰撞与单向性，普通散列函数不提供保证。<\/p>\n<h2>两条冲突路线的删除与空间<\/h2>\n<ul><li>\n拉链法：链表摘除结点即可，不影响其他链；每个结点多指针字段。负载高时链表拉长但跨链独立。\n<\/li><li>\n线性探测：连续槽位，缓存局部性好；删除必须打标记，否则打断探测序列。簇随负载合并增长，<span class=\"katex-inline\">\\alpha<\/span> 接近 1 时探测长度发散。\n<\/li><li>\n扩容：超阈值新建更长表，旧键重散列；平摊到每次插入常数级。不扩容则链/簇退化扫描。\n<\/ul>\n<h2>与符号表其他实现的分工<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>需求<\/th><th>结构<\/th><th>原因<\/th><\/tr><\/thead><tbody><tr><td>按键取值、缓存字典<\/td><td>散列<\/td><td>平均常数，无序代价可接受<\/td><\/tr><tr><td>排名、范围、最值<\/td><td>红黑 BST<\/td><td>保留键序<\/td><\/tr><tr><td>静态多次查询<\/td><td>有序数组<\/td><td>二分查找，无挪动<\/td><\/tr><tr><td>动态追加<\/td><td>链表<\/td><td>插入常数次<\/td><\/tr><\/tbody><\/table><\/div>\n<p>散列的常数结论依赖均匀假设；最坏情况由散列质量决定，不提供对数上界承诺。<\/p>\n<h2>散列流程两步再述<\/h2>\n<p>第一步散列函数把键压到 <span class=\"katex-inline\">[0,M-1]<\/span>；第二步处理同索引碰撞。拉链挂链表，探测向后找空位。均匀假设下拉链命中 <span class=\"katex-inline\">1+\\alpha<\/span>、未命中 <span class=\"katex-inline\">\\alpha<\/span>；线性探测成功约 <span class=\"katex-inline\">\\frac12(1+1/(1-\\alpha))<\/span>，<span class=\"katex-inline\">\\alpha<\/span> 近 1 发散。<\/p>\n<p>删除口径：拉链摘除结点；探测必须打标记，置空会打断后续键序列。键不可变：<code>equals<\/code> 与散列同源字段，修改后定位丢失。扩容超阈值新建表重散列，平摊常数级；不扩容则链簇退化扫描。<\/p>\n<h2>能力边界再确认<\/h2>\n<p>散列平均常数级，但排名、选择、范围、有序遍历缺席；需要有序操作归红黑 BST。散列质量看函数分布与表长素数选择；平均结论标注均匀假设，最坏由散列质量决定，不承诺对数上界。工程字典、缓存、计数索引走散列；有序索引走树。<\/p>\n<p>散列选型决策：先列操作类型，只取值评估散列，要有序查询评估树；再定冲突路线，高负载删除多用拉链，低负载缓存敏感用探测；再定扩容阈值与键不可变约束。平均常数级结论以均匀假设为前提，最坏由散列质量决定，不承诺对数上界；读源码先看函数字段、冲突路线、扩容时机三件事。<\/p>\n<p>散列函数与冲突处理分工明确：函数负责把键压进索引区间，拉链或探测负责同索引落位。均匀假设把落位看成独立等概率抽样；函数分布平坦、表长避开规律倍数，平均长度公式才成立。扩容把高负载压回低位，删除在探测路线上必须保护序列完整；键在表期间冻结，相等判断与散列函数同源。<\/p>\n<p>符号表谱系中，散列与红黑是两条并行路线：散列换常数定位放弃键序，红黑保留键序承担对数代价。工程字典、缓存、计数索引走散列；排名、范围、有序遍历回到平衡树。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n散列查找分哪两步？碰撞在第几步处理？\n<\/li><li>\n均匀假设下，拉链法命中与未命中的平均比较长度各是什么口径？\n<\/li><li>\n线性探测为什么不能直接把删除位置置空？正确处理方式是什么？\n<\/li><li>\n装填因子 <span class=\"katex-inline\">\\alpha<\/span> 怎样计算？超阈值后扩容为什么是平摊常数级？\n<\/li><li>\n散列表为什么不能做范围查询？这条边界由什么放弃带来？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "散列表：散列函数、拉链法、线性探测与均匀散列假设"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：算法 第四版 Algorithms (4th Edition).pdf · p.370<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">动态连通性与 union-find：加权 quick-union 与路径压缩<\/a><\/span><\/div><h1>图的搜索：深度优先、广度优先与连通分量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch04（原书 §4.1 无向图、§4.2 有向图，PDF 第 370、403 页，印刷 331、364）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>图搜索沿邻接关系遍历顶点：深度优先搜索（DFS）沿一条分支走到尽头再回退换岔路，广度优先搜索（BFS）用队列按距起点的层数逐层扩展；配合 <code>marked[]<\/code> 标记已访问顶点，DFS 可划分连通分量、检测环，BFS 给出起点到各顶点边数最少的路径；遍历总代价 <span class=\"katex-inline\">O(V+E)<\/span>，<span class=\"katex-inline\">V<\/span> 为顶点数、<span class=\"katex-inline\">E<\/span> 为边数。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>图上的基本问题是&quot;谁能走到谁&quot;：网络是否连通、两点间有无路径、图分几个分量、是否存在环。朴素做法从某点出发逐个邻居试探，不记录已访问顶点时，环上会反复回到同一批顶点，遍历不终止。<\/p>\n<p>需要一套确定的遍历规则：标记机制保证每个顶点只处理一次；扩展顺序决定搜索回答的问题。DFS 沿分支深入，适合连通性、环检测、拓扑结构；BFS 按层扩散，适合最少边数路径。有向图还要处理方向约束：可达性、环与 DAG、强连通分量是无向图概念的有向版本。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>图术语<\/strong>：顶点 <span class=\"katex-inline\">V<\/span>、边 <span class=\"katex-inline\">E<\/span>；邻接指两顶点共边；度是顶点的邻边数；路径是边的序列；环是首尾相同的路径；连通指两点间存在路径。无向图边无方向，有向图边带方向。<\/p>\n<p><strong>图数据类型<\/strong>：邻接表 <code>adj[]<\/code>，每个顶点挂一个邻接顶点集合；API 含 <code>V()<\/code> 顶点数、<code>E()<\/code> 边数、<code>addEdge(v,w)<\/code>、<code>adj(v)<\/code> 邻接迭代。邻接表空间 <span class=\"katex-inline\">O(V+E)<\/span>，稀疏图优于邻接矩阵。<\/p>\n<p><strong>DFS 过程<\/strong>：标记当前顶点；遍历其邻接顶点，未标记则递归深入。递归回退时回到上一岔路继续。<code>marked[]<\/code> 保证每点一次。<\/p>\n<p><strong>BFS 过程<\/strong>：起点入队并标记；出队一个顶点，把未标记邻接点入队、标记、记录前驱。队列按层序排列，先处理近点、后处理远点。<\/p>\n<p><strong>路径记录<\/strong>：<code>edgeTo[]<\/code> 记录每个顶点被谁发现；从目标沿前驱回溯到起点，即得路径。<\/p>\n<p><strong>连通分量<\/strong>：一次 DFS/BFS 标记起点所在全部分量；对未标记顶点反复发起搜索，分量个数即搜索发起次数。<\/p>\n<p><strong>有向图补充<\/strong>：可达性沿边方向；环检测在 DFS 中看是否回到当前递归栈顶点；DAG 是无环有向图；强连通指两顶点互相可达。<\/p>\n<p><strong>正例<\/strong>：小图上 DFS 一条路走到底再回退，BFS 同层顶点先于下一层处理。<strong>反例<\/strong>：把 BFS 栈代替队列不会得到层序；扩展顺序变了，最少边数结论不成立。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>遍历代价<\/strong>：每个顶点入队/递归一次，每条邻接表项被检查一次；顶点处理 <span class=\"katex-inline\">O(V)<\/span>，边检查 <span class=\"katex-inline\">O(E)<\/span>，总代价 <span class=\"katex-inline\">O(V+E)<\/span>。依据：<code>marked[]<\/code> 保证不重复处理，邻接表每条边对应两个表项（无向图）或一个表项（有向图）。<\/p>\n<p><strong>BFS 最少边数证明<\/strong>：记 <span class=\"katex-inline\">d(v)<\/span> 为 BFS 得到的起点到 <span class=\"katex-inline\">v<\/span> 路径边数。归纳：起点 <span class=\"katex-inline\">d(s)=0<\/span>；队首 <span class=\"katex-inline\">u<\/span> 距离已定，邻接点 <span class=\"katex-inline\">v<\/span> 首次发现时路径长 <span class=\"katex-inline\">d(u)+1<\/span>。若存在更短路径到 <span class=\"katex-inline\">v<\/span>，其末端来自距离不大于 <span class=\"katex-inline\">d(u)<\/span> 的顶点，按层序该顶点应先于 <span class=\"katex-inline\">u<\/span> 处理并发现 <span class=\"katex-inline\">v<\/span>，与 <span class=\"katex-inline\">v<\/span> 此刻首次发现矛盾。故 <span class=\"katex-inline\">d(v)<\/span> 即最少边数。<\/p>\n<p><strong>DFS 分量完备性<\/strong>：DFS 从起点出发，凡与起点连通的顶点都沿某条路径被访问；未被访问的顶点不可能与起点连通。反复发起搜索即覆盖全图，每个分量对应一次搜索。<\/p>\n<p><strong>环检测<\/strong>：无向图 DFS 中遇到已标记且非父结点的邻接点，即存在回边，构成环；有向图中检查邻接点是否在当前递归栈上。<\/p>\n<h2>适用条件与边界<\/h2>\n<p><strong>成立条件<\/strong>：<\/p>\n<ol><li>\n顶点可编号，邻接关系可枚举；\n<\/li><li>\n遍历允许 <span class=\"katex-inline\">O(V+E)<\/span> 时间与 <span class=\"katex-inline\">O(V)<\/span> 标记空间；\n<\/li><li>\n无向连通性与有向可达性区分清楚，方向约束不混用。\n<\/ol>\n<p><strong>边界与失败案例<\/strong>：<\/p>\n<ul><li>\nDFS 不保证路径最短；深入分支可能绕远，最少边数要走 BFS。\n<\/li><li>\n邻接表适合稀疏图；稠密图邻接矩阵查询邻接点扫整行，空间 <span class=\"katex-inline\">V^2<\/span>。\n<\/li><li>\n有向图的无向连通结论不能直接搬：互相可达才是强连通，单向可达不算。\n<\/li><li>\n带权最短路径不是边数最少；BFS 只解决无权图边数，带权归 c10 的松弛算法。\n<\/li><li>\n大规模图递归 DFS 可能栈深溢出，需改迭代写法。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>DFS vs BFS<\/strong>：DFS 栈式深入，回答连通、环、拓扑；BFS 队列层序，回答最少边数路径。扩展顺序是两者差别根源，不是代码风格差异。\n<\/li><li>\n<strong>DFS vs union-find<\/strong>：并查集只维护分量归属，不保存边与路径；DFS/BFS 保存遍历过程，可还原路径与邻接细节。判同组用并查集，找路径用遍历。\n<\/li><li>\n<strong>邻接表 vs 邻接矩阵<\/strong>：表结构空间随边数增长，稀疏省；矩阵定位两点是否共边 <span class=\"katex-inline\">O(1)<\/span>，但空间 <span class=\"katex-inline\">V^2<\/span>，稠密图才划算。\n<\/li><li>\n<strong>无向连通 vs 有向强连通<\/strong>：无向边双向等价；有向图 <span class=\"katex-inline\">A\\to B<\/span> 不代表 <span class=\"katex-inline\">B\\to A<\/span>，强连通要求双向可达。\n<\/ul>\n<p><strong>有向图的补充概念<\/strong>：可达性沿边方向判断；环检测在 DFS 中检查邻接点是否落在当前递归栈上；无环有向图（DAG）可按 DFS 逆序得到拓扑序；强连通要求两顶点互相可达，比无向连通多一个方向条件。本书 §4.2 给出这些概念口径，强连通分量算法在 DFS 底座上扩展。<\/p>\n<p><strong>符号图与工程表示<\/strong>：顶点名常是字符串（文件名、地名、账号），用符号表把名字映射为整数索引，邻接表按索引存储；遍历算法不感知名字类型。大规模图递归 DFS 有栈深风险，需改显式栈的迭代写法；BFS 队列本身是迭代结构，无递归栈问题。<\/p>\n<p><strong>遍历复杂度口径<\/strong>：每个顶点处理一次，每条邻接表项检查一次；无向图每条边两个表项，有向图一个表项。标记数组与前驱数组各占 <span class=\"katex-inline\">O(V)<\/span>；这个 <span class=\"katex-inline\">O(V+E)<\/span> 口径是后续带权图算法的底座。<\/p>\n<p><strong>DFS/BFS 与问题类型的匹配<\/strong>：DFS 沿分支深入，适合判断连通性、找环、输出拓扑序；BFS 层序扩散，适合最少边数路径、按层统计。同一幅图两种遍历都覆盖全部可达顶点，差别在扩展顺序与路径保证。并查集只维护分量归属，不保留边与前驱，是更轻量的第三类选择。<\/p>\n<p><strong>遍历实现的状态字段<\/strong>：<code>marked[]<\/code> 防重复进入，<code>edgeTo[]<\/code> 记前驱，<code>count<\/code> 统计分量。工程上顶点名经符号表映射为编号，邻接表按编号存储；递归 DFS 深图改显式栈，避免栈深溢出。<\/p>\n<p><strong>两类搜索的选择依据<\/strong>：问题要连通性、环、拓扑序走 DFS；要最少边数路径、分层统计走 BFS。遍历覆盖范围相同，路径保证不同。并查集只回答同组归属，不保存边与前驱，是三者中最轻量的结构。<\/p>\n<h2>联系<\/h2>\n<p>前置：c02 并查集的分量判断是图遍历的轻量对照；c01 的 <span class=\"katex-inline\">O(V+E)<\/span> 量级口径。后继：c10 最小生成树与最短路径在遍历底座上加入边权优化；符号图把字符串顶点名经符号表映射为编号。DFS/BFS 的标记与扩展规则是网络分析、调度约束、可达性问题的通用入口。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（图的搜索：深度优先、广度优先与连通分量）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：邻接表遍历、BFS 最短路径证明与小例推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>讲清图搜索，往回追五层：<\/p>\n<ol><li>\n<strong>可达性问题<\/strong>：判断两点是否连通、图分几个分量、是否有环；对象是顶点与边的集合。\n<\/li><li>\n<strong>标记机制<\/strong>：<code>marked[]<\/code> 保证每个顶点只处理一次，避免环上反复递归、遍历不终止。\n<\/li><li>\n<strong>扩展顺序<\/strong>：DFS 栈式深入回退，BFS 队列层序扩散；顺序决定算法回答哪类问题。\n<\/li><li>\n<strong>结果记录<\/strong>：<code>edgeTo[]<\/code> 前驱回溯出路径；分量计数由搜索发起次数得到。\n<\/li><li>\n<strong>代价口径<\/strong>：顶点处理 <span class=\"katex-inline\">O(V)<\/span>、边检查 <span class=\"katex-inline\">O(E)<\/span>，总量 <span class=\"katex-inline\">O(V+E)<\/span>；带权最短路径另立松弛算法。\n<\/ol>\n<p>依赖链方向：可达需求 → 标记防重 → 扩展规则 → 路径与分量 → 复杂度。标记层缺失，遍历不收敛；顺序规则不清，DFS 与 BFS 的适用场景会混用。<\/p>\n<h2>正向推导：从图表示到两类搜索<\/h2>\n<p><strong>第 1 步：邻接表表示。<\/strong> 逐步对照两种图型的写入差异：<code>adj[v]<\/code> 保存 <span class=\"katex-inline\">v<\/span> 的全部邻接点；无向图每条边 <span class=\"katex-inline\">(v,w)<\/span> 同时写入 <code>adj[v]<\/code> 与 <code>adj[w]<\/code>，有向图只写方向一侧。空间 <span class=\"katex-inline\">O(V+E)<\/span>，遍历邻接点沿表迭代。<\/p>\n<p><strong>第 2 步：DFS 递归规则。<\/strong><\/p>\n<ol><li>\n标记当前顶点 <span class=\"katex-inline\">v<\/span>；\n<\/li><li>\n对 <code>adj[v]<\/code> 中每个未标记顶点 <span class=\"katex-inline\">u<\/span>，递归进入 <span class=\"katex-inline\">u<\/span>；\n<\/li><li>\n递归返回后继续下一个邻接点。\n<p>回退发生在邻接点全部处理完；<code>marked<\/code> 阻止二次进入。<\/p>\n<\/ol>\n<p><strong>第 3 步：BFS 队列规则。<\/strong><\/p>\n<ol><li>\n起点入队、标记；\n<\/li><li>\n队首出队，遍历邻接点，未标记则标记、记录前驱、入队；\n<\/li><li>\n重复到队空。\n<p>队列先入先出，距离近的顶点先处理。<\/p>\n<\/ol>\n<p><strong>第 4 步：BFS 最少边数归纳证明。<\/strong><\/p>\n<ul><li>\n基例：起点 <span class=\"katex-inline\">s<\/span>，<span class=\"katex-inline\">d(s)=0<\/span>。\n<\/li><li>\n归纳步：设队首 <span class=\"katex-inline\">u<\/span> 的 <span class=\"katex-inline\">d(u)<\/span> 已是最少边数。邻接点 <span class=\"katex-inline\">v<\/span> 首次被发现，经 <span class=\"katex-inline\">u<\/span> 的路径长 <span class=\"katex-inline\">d(u)+1<\/span>。若存在更短路径到 <span class=\"katex-inline\">v<\/span>，其末端来自距离 <span class=\"katex-inline\">\\le d(u)<\/span> 的顶点；按层序该顶点先于 <span class=\"katex-inline\">u<\/span> 处理，应已发现 <span class=\"katex-inline\">v<\/span>，矛盾。故 <span class=\"katex-inline\">d(v)=d(u)+1<\/span> 为最少边数。\n<\/li><li>\n依据：队列层序保证距离非递减；换栈作存储，层序性丢失，最短结论不成立。\n<\/ul>\n<p><strong>第 5 步：分量完备性。<\/strong> DFS/BFS 从起点出发，所有连通顶点沿路径被访问；未访问顶点不可能与起点连通。对全图反复发起未标记顶点搜索，发起次数即分量个数。<\/p>\n<p><strong>第 6 步：环检测。<\/strong> 无向图：DFS 遇到已标记且非父结点的邻接点，回边成环。有向图：检查邻接点是否在当前递归栈上，在栈上即有向环。<\/p>\n<p><strong>第 7 步：代价口径。<\/strong> 每顶点一次入队/递归，每条邻接表项检查一次；<span class=\"katex-inline\">O(V)+O(E)=O(V+E)<\/span>。标记数组 <span class=\"katex-inline\">O(V)<\/span>，前驱数组 <span class=\"katex-inline\">O(V)<\/span>。<\/p>\n<h2>数值算例一：小图邻接表与 DFS 序列<\/h2>\n<p>取无向图顶点 0–4，边 <span class=\"katex-inline\">(0,1),(0,2),(1,3),(2,1),(3,4)<\/span>。<\/p>\n<p>邻接表：<\/p>\n<ul><li>\n<code>adj[0]=[1,2]<\/code>\n<\/li><li>\n<code>adj[1]=[0,3,2]<\/code>\n<\/li><li>\n<code>adj[2]=[0,1]<\/code>\n<\/li><li>\n<code>adj[3]=[1,4]<\/code>\n<\/li><li>\n<code>adj[4]=[3]<\/code>\n<\/ul>\n<p>DFS 从 0 出发：<\/p>\n<ol><li>\n标记 0；邻接 1，进入 1。\n<\/li><li>\n标记 1；邻接 0 已标记，进入 3。\n<\/li><li>\n标记 3；邻接 1 已标记，进入 4。\n<\/li><li>\n标记 4；邻接 3 已标记，回退；3 处理完回退 1；1 邻接 2，进入 2。\n<\/li><li>\n标记 2；邻接 0、1 已标记，回退完毕。\n<p>访问序列：<span class=\"katex-inline\">0,1,3,4,2<\/span>。全图连通，分量数 1。<\/p>\n<\/ol>\n<h2>数值算例二：BFS 层序与前驱回溯<\/h2>\n<p>同一图，BFS 从 0 出发。<\/p>\n<ol><li>\n队列 <span class=\"katex-inline\">[0]<\/span>；出 0，邻接 1、2 入队，<code>edgeTo[1]=0<\/code>、<code>edgeTo[2]=0<\/code>。\n<\/li><li>\n出 1，邻接 0 已标记、3 未标记，3 入队，<code>edgeTo[3]=1<\/code>；邻接 2 已标记。\n<\/li><li>\n出 2，邻接 0、1 已标记。\n<\/li><li>\n出 3，邻接 1 已标记、4 未标记，4 入队，<code>edgeTo[4]=3<\/code>。\n<\/li><li>\n出 4，结束。\n<p>层序：第 0 层 <span class=\"katex-inline\">\\{0\\}<\/span>，第 1 层 <span class=\"katex-inline\">\\{1,2\\}<\/span>，第 2 层 <span class=\"katex-inline\">\\{3\\}<\/span>，第 3 层 <span class=\"katex-inline\">\\{4\\}<\/span>。 回溯 4 到 0：<span class=\"katex-inline\">4\\leftarrow3\\leftarrow1\\leftarrow0<\/span>，路径 <span class=\"katex-inline\">0,1,3,4<\/span>，边数 3，为最少边数路径。<\/p>\n<\/ol>\n<p>对照 DFS 序列可能先深入 3、4 再回退到 2；两者都覆盖全图，但只有 BFS 的路径保证边数最少。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：遍历不标记。<\/strong> 环上顶点反复被重新进入，递归不收敛、队列不排空。复盘：<code>marked<\/code> 在入队/进入时立即标记，不是处理完才标记。<\/p>\n<p><strong>案例 2：BFS 用栈代替队列。<\/strong> 存储结构变栈，扩展顺序退化深入，层序性丢失，得到的路径不保证边数最少。复盘：BFS 的队列是层序保证的组成部分，不能换。<\/p>\n<p><strong>案例 3：有向无向结论混用。<\/strong> 把无向连通判断搬到有向图，忽略方向；<span class=\"katex-inline\">A\\to B<\/span> 单向可达不等于强连通。复盘：有向问题先标方向，强连通要求双向路径。<\/p>\n<p><strong>案例 4：递归 DFS 栈深溢出。<\/strong> 链状图递归深度 <span class=\"katex-inline\">V<\/span>，大数组栈空间不足。复盘：深图改迭代 DFS，显式维护栈。<\/p>\n<p><strong>案例 5：用 BFS 求带权最短路径。<\/strong> BFS 只按边数分层，边权不同时代价最小不等于边数最少。复盘：带权图归 c10 的 Dijkstra/拓扑松弛。<\/p>\n<h2>差生通读检查<\/h2>\n<p><strong>卡点 1：邻接表与邻接矩阵用途混淆。<\/strong> 补步骤：表结构迭代邻居，空间随边数；矩阵查共边快，空间 <span class=\"katex-inline\">V^2<\/span>。稀疏选表，稠密才考虑矩阵。<\/p>\n<p><strong>卡点 2：DFS 回退时机不清。<\/strong> 补步骤：当前顶点邻接点全部处理完才回退；画树状分支，走到叶再退回上一岔路。<\/p>\n<p><strong>卡点 3：前驱回溯方向写反。<\/strong> 补步骤：<code>edgeTo[v]<\/code> 记录谁发现 <span class=\"katex-inline\">v<\/span>；从目标沿 <code>edgeTo<\/code> 回到起点，输出时再反转成起点到目标。<\/p>\n<p><strong>卡点 4：分量计数规则错。<\/strong> 补步骤：初始分量 0；每次从一个未标记顶点发起搜索，分量加一；搜索内部标记多少顶点不计次数。<\/p>\n<h2>延伸：有向图的可达性与强连通<\/h2>\n<p>有向 DFS 回答：从起点能到达哪些顶点；递归栈上顶点用于环检测；无环有向图（DAG）可按 DFS 逆序得到拓扑序。强连通分量要求两顶点互相可达，Kosaraju 或 Tarjan 算法在 DFS 底座上实现；本书 §4.2 给出概念口径，实现细节按课程需要展开。无向图的连通分量是同一思想在无向边下的简化。<\/p>\n<h2>算例三：有向图可达性判断<\/h2>\n<p>设有向边：<span class=\"katex-inline\">0\\to1<\/span>，<span class=\"katex-inline\">0\\to2<\/span>，<span class=\"katex-inline\">2\\to1<\/span>，<span class=\"katex-inline\">1\\to3<\/span>，<span class=\"katex-inline\">3\\to2<\/span>。<\/p>\n<ol><li>\n从 0 出发 DFS：0 → 1 → 3 → 2；可达集 <span class=\"katex-inline\">\\{0,1,2,3\\}<\/span>。\n<\/li><li>\n反向检查：<span class=\"katex-inline\">2\\to0<\/span> 不存在，故 2 不可达 0；<span class=\"katex-inline\">3\\to0<\/span> 不存在。单向可达不等于强连通。\n<\/li><li>\n环检测：<span class=\"katex-inline\">1\\to3\\to2\\to1<\/span> 回到递归栈上顶点，存在有向环；若去掉 3→2，其余结构为 DAG，可输出拓扑序。\n<\/li><li>\n对照无向图：把边当成双向，0 与其余点连通；有向场景必须沿箭头方向走，结论不能互套。\n<\/ol>\n<h2>邻接表规模口径核对<\/h2>\n<ul><li>\n无向图：<span class=\"katex-inline\">V<\/span> 个顶点、<span class=\"katex-inline\">E<\/span> 条边，邻接表项 <span class=\"katex-inline\">2E<\/span>，空间 <span class=\"katex-inline\">O(V+E)<\/span>；遍历检查全部表项。\n<\/li><li>\n有向图：表项 <span class=\"katex-inline\">E<\/span>，空间同样 <span class=\"katex-inline\">O(V+E)<\/span>，方向只写一侧。\n<\/li><li>\n邻接矩阵：<span class=\"katex-inline\">V\\times V<\/span> 布尔表，空间 <span class=\"katex-inline\">V^2<\/span>；判断共边 <span class=\"katex-inline\">O(1)<\/span>，枚举邻接点扫整行。稀疏图选表，稠密图矩阵才划算。\n<\/li><li>\n标记 <code>marked[]<\/code> 与前驱 <code>edgeTo[]<\/code> 各 <span class=\"katex-inline\">V<\/span> 个条目；路径回溯从目标沿 <code>edgeTo<\/code> 回到起点，输出前反转次序。\n<\/ul>\n<h2>搜索路线对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>DFS<\/th><th>BFS<\/th><\/tr><\/thead><tbody><tr><td>存储结构<\/td><td>递归栈/显式栈<\/td><td>队列<\/td><\/tr><tr><td>扩展顺序<\/td><td>分支深入到底再回退<\/td><td>按距起点层数扩散<\/td><\/tr><tr><td>典型问题<\/td><td>连通分量、环、拓扑序<\/td><td>最少边数路径<\/td><\/tr><tr><td>路径性质<\/td><td>不保证最短<\/td><td>边数最少<\/td><\/tr><tr><td>实现风险<\/td><td>递归栈深<\/td><td>队列内存<\/td><\/tr><\/tbody><\/table><\/div>\n<p>并查集是第三类轻量结构：只判分量归属，不保存边与路径；需要还原路径或邻接细节时回到 DFS/BFS。<\/p>\n<h2>第二组复盘：遍历易错点<\/h2>\n<p><strong>复盘 1：进入顶点后才标记。<\/strong> 同一顶点可能被多个邻居重复入队/入栈，遍历不收敛。复盘：入队或进入时立即 <code>marked=true<\/code>。<\/p>\n<p><strong>复盘 2：BFS 换栈存储。<\/strong> 层序性丢失，路径不保证边数最少。复盘：队列是 BFS 最短结论的组成部分，不能用栈替代。<\/p>\n<p><strong>复盘 3：有向无向混判。<\/strong> 无向连通结论搬到有向图漏掉方向；强连通要求双向路径。复盘：先标边方向，再写可达性结论。<\/p>\n<p><strong>复盘 4：递归处理大图。<\/strong> 链状图递归深度 <span class=\"katex-inline\">V<\/span>，栈空间不足。复盘：深图改迭代 DFS，显式维护栈与访问状态。<\/p>\n<p><strong>复盘 5：无权 BFS 求带权最短路。<\/strong> BFS 按边数分层，边权不同时代价最小不等于边数最少。复盘：带权图走松弛算法（c10）。<\/p>\n<h2>延伸：遍历在图算法中的位置<\/h2>\n<p>DFS/BFS 是所有图处理的底座：连通分量、环检测、拓扑序、可达性查询都在其上展开；带权优化（MST、最短路径）在遍历规则外加边权比较与优先队列。标记防重、扩展顺序、前驱记录三件套，在网络路由、任务调度、约束求解中反复出现。并查集则是只判归属的压缩版本，能力更轻但代价更低。<\/p>\n<h2>遍历代价与空间口径<\/h2>\n<ul><li>\n时间：每顶点一次入队/递归，每条邻接表项检查一次；<span class=\"katex-inline\">O(V+E)<\/span>。无向图表项 <span class=\"katex-inline\">2E<\/span>，有向图 <span class=\"katex-inline\">E<\/span>。\n<\/li><li>\n空间：<code>marked[]<\/code>、<code>edgeTo[]<\/code> 各 <span class=\"katex-inline\">O(V)<\/span>；DFS 递归栈深最坏 <span class=\"katex-inline\">V<\/span>，BFS 队列最坏 <span class=\"katex-inline\">V<\/span>。\n<\/li><li>\n邻接表空间 <span class=\"katex-inline\">O(V+E)<\/span>；邻接矩阵空间 <span class=\"katex-inline\">V^2<\/span>，共边判断 <span class=\"katex-inline\">O(1)<\/span> 但枚举邻居扫整行。\n<\/li><li>\n遍历不保存边权；带权最短路径另立松弛算法，BFS 的边数最少结论不能搬到带权图。\n<\/ul>\n<h2>可达性与环检测规则<\/h2>\n<ul><li>\n无向环：DFS 遇到已标记且非父结点的邻接点，回边成环。\n<\/li><li>\n有向环：邻接点落在当前递归栈上即成环；DAG 可按 DFS 逆序输出拓扑序。\n<\/li><li>\n强连通：两顶点互相可达；单向不算。强连通分量在 DFS 底座上扩展实现。\n<\/li><li>\n符号图：字符串名经符号表转编号，遍历算法不感知名字类型。\n<\/ul>\n<h2>搜索过程状态再核对<\/h2>\n<ol><li>\n起点入队/进入，立即标记。\n<\/li><li>\n出队/回退时遍历邻接点；未标记则标记、记前驱、入队/递归。\n<\/li><li>\n队空或递归返回，可达集确定。\n<\/li><li>\n全图扫描：未标记顶点发起新搜索，分量计数加一。\n<\/li><li>\n路径回溯：目标沿 <code>edgeTo<\/code> 回起点，输出前反转次序。\n<\/ol>\n<p>每一步的标记时机是防重复的关键；延迟到处理完才标记，同一顶点会被多个邻居重复纳入。<\/p>\n<h2>第五组复盘：遍历常见误用<\/h2>\n<p><strong>复盘 1：用 DFS 找最少边数路径。<\/strong> 深入分支可能绕远，DFS 不保证边数；最少边数必须 BFS。 <strong>复盘 2：用 BFS 求带权最短路。<\/strong> 层序只数边数，边权不同时代价最小不等于边数最少。 <strong>复盘 3：有向结论套无向图。<\/strong> 方向约束丢失，强连通判断失真。 <strong>复盘 4：大图递归栈溢出。<\/strong> 链状图深度 <span class=\"katex-inline\">V<\/span>；改迭代显式栈。 <strong>复盘 5：遍历与并查集互替。<\/strong> 并查集不存路径，要还原路线必须遍历结构。<\/p>\n<h2>图术语与表示口径<\/h2>\n<ul><li>\n顶点 <span class=\"katex-inline\">V<\/span>、边 <span class=\"katex-inline\">E<\/span>；邻接、度、路径、环、连通；无向边双向，有向边单向。\n<\/li><li>\n邻接表：每顶点一个邻居集合，空间 <span class=\"katex-inline\">O(V+E)<\/span>，稀疏图优先。\n<\/li><li>\n邻接矩阵：<span class=\"katex-inline\">V\\times V<\/span>，共边 <span class=\"katex-inline\">O(1)<\/span>，枚举邻居扫整行，稠密图才划算。\n<\/li><li>\n符号图：字符串名经符号表转编号，遍历不感知名字类型。\n<\/ul>\n<p>遍历前先确认图类型：无向连通、有向可达、强连通三者概念不同；方向约束不能省略。<\/p>\n<h2>两类遍历的过程对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>步骤<\/th><th>DFS<\/th><th>BFS<\/th><\/tr><\/thead><tbody><tr><td>起点<\/td><td>进入并标记<\/td><td>入队并标记<\/td><\/tr><tr><td>存储<\/td><td>递归栈/显式栈<\/td><td>队列<\/td><\/tr><tr><td>扩展<\/td><td>一条分支到底再回退<\/td><td>按层扩散<\/td><\/tr><tr><td>邻接点<\/td><td>未标记则递归<\/td><td>未标记则入队记前驱<\/td><\/tr><tr><td>典型结论<\/td><td>连通分量、环、拓扑序<\/td><td>最少边数路径<\/td><\/tr><tr><td>风险<\/td><td>递归栈深<\/td><td>队列内存<\/td><\/tr><\/tbody><\/table><\/div>\n<p>标记必须在纳入时立即完成；延迟标记会重复纳入同一顶点。路径从目标沿 <code>edgeTo<\/code> 回溯，输出前反转次序。<\/p>\n<h2>可达性延伸<\/h2>\n<p>有向 DFS 回答起点可达集；递归栈上顶点用于环检测；DAG 按 DFS 逆序得拓扑序。强连通分量要求双向可达，在 DFS 底座上扩展。带权最短路径不属本节：BFS 只数边数，边权差异交给松弛算法。<\/p>\n<h2>遍历字段与过程再核<\/h2>\n<p><code>marked[]<\/code> 纳入即标记，防重复进入；<code>edgeTo[]<\/code> 记前驱；<code>count<\/code> 计分量。起点入队/进入后，邻接点未标记则标记、记前驱、纳入结构。队空或递归返回，可达集确定；全图扫描遇未标记顶点发起新搜索，分量加一。路径从目标沿前驱回起点，输出前反转。<\/p>\n<p>代价口径：顶点处理 <span class=\"katex-inline\">O(V)<\/span>，表项检查 <span class=\"katex-inline\">O(E)<\/span>，总 <span class=\"katex-inline\">O(V+E)<\/span>；标记与前驱数组 <span class=\"katex-inline\">O(V)<\/span>。无向图表项 <span class=\"katex-inline\">2E<\/span>，有向图 <span class=\"katex-inline\">E<\/span>。邻接表稀疏优先，矩阵稠密才划算。<\/p>\n<h2>问题匹配再确认<\/h2>\n<p>DFS 深入回退：连通分量、环检测、拓扑序；BFS 层序扩散：最少边数路径、分层统计。并查集只判归属，不存边与前驱。有向问题先标方向：单向可达不等于强连通，强连通要求双向。带权最短路不属无权遍历，归松弛算法。<\/p>\n<p>图遍历是后续带权算法的底座：MST 与最短路径在遍历规则外加边权比较。标记防重、扩展顺序、前驱记录三件套在网络路由、调度约束、可达性问题中复用。并查集是只判归属的压缩版本；DFS/BFS 保存遍历过程，可还原路径与邻接细节。有向可达、环检测、强连通按方向单独建模，不与无向连通互套。<\/p>\n<p>遍历实现字段再核：<code>marked<\/code> 纳入即标记，<code>edgeTo<\/code> 记前驱，<code>count<\/code> 计分量。邻接表空间 <span class=\"katex-inline\">O(V+E)<\/span>，遍历时间同口径；递归 DFS 深图改显式栈，BFS 队列本身迭代无栈深问题。符号图把字符串名映射为编号，遍历算法不感知名字类型。<\/p>\n<p>DFS 回答连通、环、拓扑；BFS 回答最少边数路径。并查集只判归属，不存边与前驱。有向场景先标方向：单向可达不是强连通；带权最短路另立松弛算法，无权遍历的边数结论不能搬到带权图。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n邻接表的空间与遍历代价各是什么量级？每条无向边写入几个表项？\n<\/li><li>\nDFS 与 BFS 的扩展顺序差别在哪？各自回答什么问题？\n<\/li><li>\nBFS 最少边数证明的归纳步怎样排除更短路径？哪一步依赖队列层序？\n<\/li><li>\n连通分量个数怎样由搜索发起次数得到？为什么未访问顶点不可能与起点连通？\n<\/li><li>\n无向图与有向图的&quot;连通&quot;概念差别是什么？强连通要求什么条件？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "图的搜索：深度优先、广度优先与连通分量"}, "c10": {"html": "<div class=\"source-badge\">📖 出处：算法 第四版 Algorithms (4th Edition).pdf · p.429<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">图的搜索：深度优先、广度优先与连通分量<\/a><\/span><\/div><h1>最小生成树与最短路径：Prim、Kruskal、Dijkstra 的贪心正确性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（原书 §4.3 最小生成树、§4.4 最短路径，PDF 第 429、451 页，印刷 390、412）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>最小生成树（MST）是连通加权无向图中连接全部顶点、边权之和最小的生成树；切分定理保证最小横切边必属某棵 MST，Prim 从顶点出发逐步取最小横切边，Kruskal 按边权升序加边并用并查集环检测。最短路径问题在加权有向图中求起点到各顶点权重和最小的路径，Dijkstra 在边权非负前提下按距离递增确定顶点，无环图可按拓扑顺序松弛，负权场景另用一般算法。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>两类带权优化问题。一是布线组网：用最少光缆把所有站点连通，边权是线路造价；二是路线规划：从起点到各目的地走哪条路权重和最小。枚举全部生成树或全部路径不可行：生成树数量随顶点组合爆炸，路径数目同样指数增长。<\/p>\n<p>需要可证明正确的贪心规则。MST 方向要回答&quot;每次加哪条边不会堵死最优解&quot;；最短路径方向要回答&quot;哪个顶点的最短距离可以当场确定&quot;。两类算法都在遍历底座上加入边权比较：贪心选择由定理支撑，不是凭直觉挑小边。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>加权无向图<\/strong>：边带权值的无向图；<code>Edge<\/code> 含两端点与权重。生成树包含全部顶点、<span class=\"katex-inline\">V-1<\/span> 条边且无环。<\/p>\n<p><strong>切分与横切边<\/strong>：顶点集任意分成非空两组 <span class=\"katex-inline\">A<\/span>、<span class=\"katex-inline\">B<\/span>；两端分别在两组的边称横切边。最小横切边是权值最小的那条。<\/p>\n<p><strong>Prim 算法<\/strong>：从任一顶点起，树内顶点集逐步扩充；维护连接树内外的横切边，每次取权最小者加入树，把外侧顶点并入树内，重复到全部顶点入树。优先队列存横切边或顶点距离。<\/p>\n<p><strong>Kruskal 算法<\/strong>：边按权升序排序；逐条考虑，两端不在同一分量则加入（不成环），用 union-find 判断同组；成环则跳过，直到 <span class=\"katex-inline\">V-1<\/span> 条边。<\/p>\n<p><strong>加权有向图与最短路径树<\/strong>：<code>DirectedEdge<\/code> 含起点、终点、权重；最短路径树记录起点到各顶点的最短路径前驱，树边即最短路径上的边。<\/p>\n<p><strong>松弛（relaxation）<\/strong>：取边 <span class=\"katex-inline\">v\\to w<\/span>，若 <code>dist[v]+weight &lt; dist[w]<\/code>，更新 <code>dist[w]<\/code> 并记录前驱；松弛是缩短距离的基本动作。<\/p>\n<p><strong>Dijkstra 步骤<\/strong>：起点距离 0，其余无穷；反复取当前距离最小的未确定顶点，确定其最短距离，松弛其出边；重复到全部顶点确定。前提：所有边权非负。<\/p>\n<p><strong>拓扑松弛（无环图）<\/strong>：加权有向无环图按拓扑顺序处理顶点，每个顶点出边一次性松弛；可处理边权可为负的无环情形。<\/p>\n<p><strong>正例<\/strong>：小图上 Prim 每轮一条最小横切边入树；Dijkstra 按距离递增摘顶。<strong>反例<\/strong>：MST 不保证起点到某顶点路径最短，两个优化目标不同。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>切分定理（MST 贪心依据）<\/strong>：设 <span class=\"katex-inline\">e<\/span> 是最小横切边。反证：若某棵 MST <span class=\"katex-inline\">T<\/span> 不含 <span class=\"katex-inline\">e<\/span>，把 <span class=\"katex-inline\">e<\/span> 加入 <span class=\"katex-inline\">T<\/span> 形成唯一环；环上必有另一条横切边 <span class=\"katex-inline\">e&#x27;<\/span>。删去 <span class=\"katex-inline\">e&#x27;<\/span> 得新生成树 <span class=\"katex-inline\">T&#x27;<\/span>，因 <span class=\"katex-inline\">w(e)\\le w(e&#x27;)<\/span>，<span class=\"katex-inline\">w(T&#x27;)=w(T)+w(e)-w(e&#x27;)\\le w(T)<\/span>。故存在含 <span class=\"katex-inline\">e<\/span> 的 MST，每次取最小横切边不堵死最优解。<\/p>\n<p><strong>Prim 正确性<\/strong>：树内顶点集与树外顶点集构成一个切分；每轮选最小横切边，由切分定理该边属于某棵 MST；扩充后继续对新切分选择，累积出一棵 MST。<\/p>\n<p><strong>最短路径子路径最优<\/strong>：若 <span class=\"katex-inline\">s\\to\\cdots\\to v\\to\\cdots\\to t<\/span> 是最短路径，则 <span class=\"katex-inline\">s\\to\\cdots\\to v<\/span> 子段也是到 <span class=\"katex-inline\">v<\/span> 的最短路径；否则替换更短子段可得更短全路径。这条性质支撑按距离确定顶点。<\/p>\n<p><strong>Dijkstra 正确性（非负前提）<\/strong>：取当前距离最小的未确定顶点 <span class=\"katex-inline\">u<\/span>。若存在更短路径到 <span class=\"katex-inline\">u<\/span>，该路径先经过某个未确定顶点 <span class=\"katex-inline\">x<\/span>；因边权非负，<span class=\"katex-inline\">dist[x]\\le<\/span> 路径到 <span class=\"katex-inline\">u<\/span> 的剩余段，即 <span class=\"katex-inline\">dist[x]\\le dist[u]<\/span>，与 <span class=\"katex-inline\">u<\/span> 为最小未确定矛盾。故 <span class=\"katex-inline\">u<\/span> 的距离已定，松弛其出边即可。边权为负时，后续松弛可能压低已确定距离，证明破裂。<\/p>\n<h2>适用条件与边界<\/h2>\n<p><strong>成立条件<\/strong>：<\/p>\n<ul><li>\nMST：图连通、边权可比较；Prim 适合稠密图或需逐步扩点，Kruskal 适合稀疏图且易并行排序。\n<\/li><li>\nDijkstra：边权非负；需要最短路径树与前驱记录。\n<\/li><li>\n无环加权有向图：可走拓扑松弛，允许负权；存在负权环的图最短路径无定义。\n<\/ul>\n<p><strong>边界与失败案例<\/strong>：<\/p>\n<ul><li>\nDijkstra 遇负权边失效：已确定顶点距离可被后续松弛压小，摘顶顺序不安全。\n<\/li><li>\nMST 不等于最短路径树：MST 优化全网边权和，SPT 优化起点到各点距离；Prim 结果不能当导航路线。\n<\/li><li>\n边权相等时 MST 不唯一：多棵树同为最小，算法选哪棵取决于并列次序。\n<\/li><li>\nKruskal 环检测依赖并查集；不检查同组会加入成环边，破坏生成树定义。\n<\/li><li>\n负权环可无限松弛，路径权重无下界，最短路径问题无有限解。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>Prim vs Kruskal<\/strong>：Prim 从顶点扩切分，优先队列取最小边，稠密图友好；Kruskal 全局排序加边，并查集判环，稀疏图友好。两者都由切分定理支撑。\n<\/li><li>\n<strong>MST vs 最短路径树<\/strong>：目标函数不同——MST 是全网边权和，SPT 是起点到各点距离；算法流程相似（都取小边/小距离），结论不可互替。\n<\/li><li>\n<strong>Dijkstra vs 拓扑松弛<\/strong>：Dijkstra 依赖非负权按距离摘顶；拓扑松弛按顶点次序处理，可容负权但仅限 DAG。一般含负权有向图用 Bellman-Ford 方向算法。\n<\/li><li>\n<strong>贪心 vs 动态规划<\/strong>：贪心每步选当前最优且由定理证明不后悔；DP 枚举子问题最优组合。MST 与 Dijkstra 的贪心选择都有正确性定理托底，不是局部试探。\n<\/ul>\n<p><strong>两类问题的前提识别<\/strong>：先判图结构（连通、有无环）与边权符号，再选算法。MST 面向连通加权无向图；最短路径面向加权有向图。Dijkstra 的非负前提、DAG 拓扑松弛的无环前提、负权环无解这三条边界要在选型前列出；把 Dijkstra 用于负权图是最常见的误用。<\/p>\n<p><strong>贪心与松弛的部件复用<\/strong>：Prim 与 Dijkstra 都用优先队列摘最小候选（横切边权/当前距离）；Kruskal 用并查集做环检测；松弛是最短路径的基本动作——经 <span class=\"katex-inline\">v<\/span> 到 <span class=\"katex-inline\">w<\/span> 更短就更新 <code>dist[w]<\/code> 并记前驱。这些部件在 c02、c05 已建立，本章组合成带权优化算法。<\/p>\n<h2>联系<\/h2>\n<p>前置：c09 图遍历底座与 <span class=\"katex-inline\">O(V+E)<\/span> 口径；c05 优先队列承担 Prim 横切边与 Dijkstra 距离摘顶；c02 并查集承担 Kruskal 环检测。后继：本章是网络路由、任务调度、约束优化的入口；贪心正确性论证（切分定理、非负前提）是后续优化类算法的通用骨架。本书 §4.4 还给出无环图松弛与一般加权图的算法方向，负权与负权环边界需单独识别。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（最小生成树与最短路径：Prim、Kruskal、Dijkstra 的贪心正确性）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：切分定理、贪心选择与 Dijkstra 正确性推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>讲清 MST 与最短路径，往回追五层：<\/p>\n<ol><li>\n<strong>带权优化目标<\/strong>：组网求全网边权和最小，导航求起点到各点权重和最小；枚举生成树与路径不可行。\n<\/li><li>\n<strong>图结构底座<\/strong>：加权边带端点与权重；生成树含全部顶点、<span class=\"katex-inline\">V-1<\/span> 边、无环；最短路径树记录前驱。\n<\/li><li>\n<strong>贪心依据定理<\/strong>：MST 靠切分定理——最小横切边必属某棵 MST；最短路径靠子路径最优与非负前提。\n<\/li><li>\n<strong>算法动作<\/strong>：Prim 扩切分、Kruskal 排序加边、Dijkstra 摘顶松弛；优先队列与并查集是部件。\n<\/li><li>\n<strong>前提与边界<\/strong>：Dijkstra 要求非负权；DAG 可拓扑松弛；负权环无有限最短路径；MST 与 SPT 目标不同。\n<\/ol>\n<p>依赖链方向：优化目标 → 图结构 → 贪心定理 → 算法动作 → 前提边界。定理层跳过，贪心选择变成碰运气；前提不识别，负权场景会误用 Dijkstra。<\/p>\n<h2>正向推导：定理与算法逐步展开<\/h2>\n<p><strong>第 1 步：切分定理反证。<\/strong> 切分把顶点分 <span class=\"katex-inline\">A<\/span>、<span class=\"katex-inline\">B<\/span> 两组，<span class=\"katex-inline\">e<\/span> 为最小横切边。设 MST <span class=\"katex-inline\">T<\/span> 不含 <span class=\"katex-inline\">e<\/span>：<\/p>\n<ol><li>\n<span class=\"katex-inline\">T+e<\/span> 形成唯一环，环上必有另一条横切边 <span class=\"katex-inline\">e&#x27;<\/span>（连接 <span class=\"katex-inline\">A<\/span>、<span class=\"katex-inline\">B<\/span>）。\n<\/li><li>\n删去 <span class=\"katex-inline\">e&#x27;<\/span>，得生成树 <span class=\"katex-inline\">T&#x27;<\/span>；<span class=\"katex-inline\">w(T&#x27;)=w(T)+w(e)-w(e&#x27;)<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">e<\/span> 是最小横切边，<span class=\"katex-inline\">w(e)\\le w(e&#x27;)<\/span>，故 <span class=\"katex-inline\">w(T&#x27;)\\le w(T)<\/span>；<span class=\"katex-inline\">T<\/span> 既是 MST，<span class=\"katex-inline\">T&#x27;<\/span> 也是 MST 且含 <span class=\"katex-inline\">e<\/span>。\n<\/li><li>\n结论：每次选最小横切边不会排除最优解。\n<\/ol>\n<p><strong>第 2 步：Prim 扩充。<\/strong> 树内集合 <span class=\"katex-inline\">S<\/span>，树外 <span class=\"katex-inline\">V\\setminus S<\/span> 构成切分；取最小横切边加入树，外侧顶点并入 <span class=\"katex-inline\">S<\/span>；重复到 <span class=\"katex-inline\">S=V<\/span>。每步对应切分定理，累积树为 MST。优先队列存候选横切边，边权最小者摘顶。<\/p>\n<p><strong>第 3 步：Kruskal 加边。<\/strong> 边按权升序；取边两端，<code>connected<\/code> 为假则加入并合并，并查集判环；为真则跳过。加入 <span class=\"katex-inline\">V-1<\/span> 条边结束。排序是全局动作，环检测靠分量归属。<\/p>\n<p><strong>第 4 步：子路径最优。<\/strong> 设 <span class=\"katex-inline\">s\\to\\cdots\\to v\\to\\cdots\\to t<\/span> 最短，子段 <span class=\"katex-inline\">s\\to\\cdots\\to v<\/span> 若有更短路径，替换后全路径更短，矛盾。故最短路径的子段也是最短路径；这是松弛可沿路径累积距离的依据。<\/p>\n<p><strong>第 5 步：Dijkstra 正确性。<\/strong> 起点 <span class=\"katex-inline\">dist[s]=0<\/span>，其余 <span class=\"katex-inline\">\\infty<\/span>。反复取未确定顶点中 <span class=\"katex-inline\">dist<\/span> 最小者 <span class=\"katex-inline\">u<\/span>：<\/p>\n<ol><li>\n假设到 <span class=\"katex-inline\">u<\/span> 存在更短路径；该路径先经过某个未确定顶点 <span class=\"katex-inline\">x<\/span>。\n<\/li><li>\n边权非负，路径上 <span class=\"katex-inline\">dist[x]\\le<\/span> 从 <span class=\"katex-inline\">x<\/span> 到 <span class=\"katex-inline\">u<\/span> 的剩余权重，故 <span class=\"katex-inline\">dist[x]\\le dist[u]<\/span>。\n<\/li><li>\n但 <span class=\"katex-inline\">u<\/span> 是未确定集合中距离最小者，<span class=\"katex-inline\">dist[x]\\ge dist[u]<\/span>；只能 <span class=\"katex-inline\">dist[x]=dist[u]<\/span>，不构成更短路径。<span class=\"katex-inline\">u<\/span> 距离确定，松弛其出边。\n<\/li><li>\n前提破裂方向：若存在负权边，后续松弛可把已确定顶点距离压小，&quot;摘顶即确定&quot;不再成立。\n<\/ol>\n<p><strong>第 6 步：拓扑松弛（DAG）<\/strong>：按拓扑序处理顶点，每个顶点出边一次性松弛；无环保证处理到顶点时其前驱都已松弛。允许边权为负；一般含环负权图需 Bellman-Ford 方向算法。<\/p>\n<h2>数值算例一：Prim 逐步选边<\/h2>\n<p>取无向图 5 顶点，边权：<span class=\"katex-inline\">0<\/span>-<span class=\"katex-inline\">1<\/span> 2，<span class=\"katex-inline\">0<\/span>-<span class=\"katex-inline\">2<\/span> 4，<span class=\"katex-inline\">1<\/span>-<span class=\"katex-inline\">2<\/span> 1，<span class=\"katex-inline\">1<\/span>-<span class=\"katex-inline\">3<\/span> 5，<span class=\"katex-inline\">2<\/span>-<span class=\"katex-inline\">3<\/span> 3，<span class=\"katex-inline\">2<\/span>-<span class=\"katex-inline\">4<\/span> 6，<span class=\"katex-inline\">3<\/span>-<span class=\"katex-inline\">4<\/span> 2。<\/p>\n<ol><li>\n<span class=\"katex-inline\">S=\\{0\\}<\/span>，横切边：<span class=\"katex-inline\">0<\/span>-<span class=\"katex-inline\">1<\/span> 2、<span class=\"katex-inline\">0<\/span>-<span class=\"katex-inline\">2<\/span> 4；取 <span class=\"katex-inline\">0<\/span>-<span class=\"katex-inline\">1<\/span>（2），<span class=\"katex-inline\">S=\\{0,1\\}<\/span>。\n<\/li><li>\n横切边：<span class=\"katex-inline\">0<\/span>-<span class=\"katex-inline\">2<\/span> 4、<span class=\"katex-inline\">1<\/span>-<span class=\"katex-inline\">2<\/span> 1、<span class=\"katex-inline\">1<\/span>-<span class=\"katex-inline\">3<\/span> 5；取 <span class=\"katex-inline\">1<\/span>-<span class=\"katex-inline\">2<\/span>（1），<span class=\"katex-inline\">S=\\{0,1,2\\}<\/span>。\n<\/li><li>\n横切边：<span class=\"katex-inline\">1<\/span>-<span class=\"katex-inline\">3<\/span> 5、<span class=\"katex-inline\">2<\/span>-<span class=\"katex-inline\">3<\/span> 3、<span class=\"katex-inline\">2<\/span>-<span class=\"katex-inline\">4<\/span> 6；取 <span class=\"katex-inline\">2<\/span>-<span class=\"katex-inline\">3<\/span>（3），<span class=\"katex-inline\">S=\\{0,1,2,3\\}<\/span>。\n<\/li><li>\n横切边：<span class=\"katex-inline\">2<\/span>-<span class=\"katex-inline\">4<\/span> 6、<span class=\"katex-inline\">3<\/span>-<span class=\"katex-inline\">4<\/span> 2；取 <span class=\"katex-inline\">3<\/span>-<span class=\"katex-inline\">4<\/span>（2），<span class=\"katex-inline\">S=<\/span> 全图。\n<\/li><li>\nMST 边：<span class=\"katex-inline\">(0,1,2),(1,2,1),(2,3,3),(3,4,2)<\/span>，权和 <span class=\"katex-inline\">2+1+3+2=8<\/span>。\n<\/li><li>\n对照 Kruskal：排序边权 1（1-2）、2（0-1）、2（3-4）、3（2-3）、4（0-2）、5（1-3）、6（2-4）；逐条加 1-2、0-1、3-4、2-3，成环边跳过，同样得 4 条边，权和 8。\n<\/ol>\n<h2>数值算例二：Dijkstra 距离表<\/h2>\n<p>取有向图：<span class=\"katex-inline\">0\\to1<\/span> 4，<span class=\"katex-inline\">0\\to2<\/span> 1，<span class=\"katex-inline\">2\\to1<\/span> 2，<span class=\"katex-inline\">1\\to3<\/span> 1，<span class=\"katex-inline\">2\\to3<\/span> 5，边权非负。<\/p>\n<ol><li>\n初始 <span class=\"katex-inline\">dist=[0,\\infty,\\infty,\\infty]<\/span>，确定集合空。\n<\/li><li>\n摘顶 0（dist 0）；松弛：<span class=\"katex-inline\">dist[1]=4<\/span>，<span class=\"katex-inline\">dist[2]=1<\/span>。\n<\/li><li>\n未确定最小为 2（dist 1）；松弛：<span class=\"katex-inline\">dist[1]=\\min(4,1+2=3)=3<\/span>，<span class=\"katex-inline\">dist[3]=1+5=6<\/span>。\n<\/li><li>\n未确定最小为 1（dist 3）；松弛：<span class=\"katex-inline\">dist[3]=\\min(6,3+1=4)=4<\/span>。\n<\/li><li>\n摘顶 3（dist 4）；结束。最短距离：<span class=\"katex-inline\">d(0)=0,d(1)=3,d(2)=1,d(3)=4<\/span>。\n<\/li><li>\n回溯：<span class=\"katex-inline\">3\\leftarrow1\\leftarrow2\\leftarrow0<\/span>，路径 <span class=\"katex-inline\">0,2,1,3<\/span>，权重 <span class=\"katex-inline\">1+2+1=4<\/span>。\n<\/li><li>\n检查非负：所有边权 <span class=\"katex-inline\">\\ge0<\/span>，摘顶顺序安全；若某条边为负，第 3 步后已确定的 2 可能被更短路径压低。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：Dijkstra 用于负权边图。<\/strong> 已摘顶顶点的距离被后续负权松弛压小，最短路径树错误。复盘：先审边权符号；含负权改拓扑松弛（DAG）或 Bellman-Ford 方向。<\/p>\n<p><strong>案例 2：把 MST 当最短路径树。<\/strong> 用 Prim 结果回答导航路线；MST 优化全网和，<span class=\"katex-inline\">0<\/span> 到某点路径未必最短。复盘：两个目标函数分开建模，MST 边集不等于 SPT 边集。<\/p>\n<p><strong>案例 3：Kruskal 不做环检测。<\/strong> 两端同组仍加边，生成树出现环，不再是树。复盘：加边前 <code>connected<\/code> 判断，同组跳过。<\/p>\n<p><strong>案例 4：忽视负权环。<\/strong> 含负权环的图可绕环无限压低路径权重，最短路径无有限解；算法应先识别负权环存在性，而不是继续松弛。<\/p>\n<p><strong>案例 5：并列边权随意取舍。<\/strong> 权值相等时 MST 不唯一，不同并列次序得到不同最小树；结论是&quot;权和最小&quot;，不是&quot;边集唯一&quot;。<\/p>\n<h2>差生通读检查<\/h2>\n<p><strong>卡点 1：切分与横切边定义不清。<\/strong> 补步骤：先把顶点分两组，再数两端跨组的边；最小横切边是这些边里权最小者。画两组圈，跨组连线即横切边。<\/p>\n<p><strong>卡点 2：Prim 与 Kruskal 动作对调。<\/strong> 补步骤：Prim 从一个点扩邻接边；Kruskal 从全局边表排序逐条试加。一个守切分，一个守环检测。<\/p>\n<p><strong>卡点 3：松弛方向写反。<\/strong> 补步骤：<code>dist[w]<\/code> 比 <code>dist[v]+weight<\/code> 大才更新；更新同时记前驱。松弛是&quot;更短才替换&quot;，不是无条件覆盖。<\/p>\n<p><strong>卡点 4：非负前提找不到位置。<\/strong> 补步骤：Dijkstra 证明第 2 步用非负排除更短路径；审图先看边权符号，再决定算法。<\/p>\n<h2>延伸：图算法选型对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>问题<\/th><th>算法<\/th><th>前提<\/th><th>复杂度口径<\/th><th>关键部件<\/th><\/tr><\/thead><tbody><tr><td>连通分量<\/td><td>DFS/BFS / 并查集<\/td><td>无向<\/td><td><span class=\"katex-inline\">O(V+E)<\/span> / 近常数平摊<\/td><td>marked / find<\/td><\/tr><tr><td>MST<\/td><td>Prim<\/td><td>稠密图友好<\/td><td><span class=\"katex-inline\">O(E\\lg V)<\/span>（堆实现）<\/td><td>优先队列<\/td><\/tr><tr><td>MST<\/td><td>Kruskal<\/td><td>稀疏图友好<\/td><td><span class=\"katex-inline\">O(E\\lg E)<\/span> 排序主导<\/td><td>并查集<\/td><\/tr><tr><td>最短路径<\/td><td>Dijkstra<\/td><td>边权非负<\/td><td><span class=\"katex-inline\">O(E\\lg V)<\/span><\/td><td>优先队列、松弛<\/td><\/tr><tr><td>最短路径<\/td><td>拓扑松弛<\/td><td>DAG<\/td><td><span class=\"katex-inline\">O(V+E)<\/span><\/td><td>拓扑序<\/td><\/tr><tr><td>最短路径<\/td><td>Bellman-Ford 方向<\/td><td>一般含负权、无负权环<\/td><td><span class=\"katex-inline\">O(VE)<\/span><\/td><td>多轮松弛<\/td><\/tr><\/tbody><\/table><\/div>\n<p>选型顺序：先判图有无环、边权符号，再定目标（分量/组网/路径），再选算法；优先队列与并查集在多条路线中复用。<\/p>\n<h2>算例五：Kruskal 环检测逐步<\/h2>\n<p>沿用算例一的边集：权 1（1-2）、权 2（0-1）、权 2（3-4）、权 3（2-3）、权 4（0-2）、权 5（1-3）、权 6（2-4）。<\/p>\n<ol><li>\n排序后逐条取边：1-2 两端异组，加入，合并分量 <span class=\"katex-inline\">\\{1,2\\}<\/span>。\n<\/li><li>\n0-1 异组，加入，合并 <span class=\"katex-inline\">\\{0,1,2\\}<\/span>。\n<\/li><li>\n3-4 异组，加入，合并 <span class=\"katex-inline\">\\{3,4\\}<\/span>。\n<\/li><li>\n2-3 异组，加入，两个大分量合并。\n<\/li><li>\n0-2 已同组（都在大分量），成环，跳过；1-3 同组跳过；2-4 同组跳过。\n<\/li><li>\n已选 <span class=\"katex-inline\">V-1=4<\/span> 条边，结束；权和 <span class=\"katex-inline\">1+2+2+3=8<\/span>，与 Prim 结果一致。\n<\/li><li>\n环检测全靠 <code>connected<\/code> 判断：同组再加边必然成环，并查集不保存边序列，只回答归属。\n<\/ol>\n<h2>负权反例：Dijkstra 为何失效<\/h2>\n<p>设有向边：<span class=\"katex-inline\">0\\to1<\/span> 权重 5，<span class=\"katex-inline\">0\\to2<\/span> 权重 6，<span class=\"katex-inline\">2\\to1<\/span> 权重 <span class=\"katex-inline\">-3<\/span>。<\/p>\n<ol><li>\n初始 <span class=\"katex-inline\">dist=[0,5,6]<\/span>。摘顶 0，松弛得 <span class=\"katex-inline\">d(1)=5<\/span>、<span class=\"katex-inline\">d(2)=6<\/span>。\n<\/li><li>\n未确定最小为 1（dist 5），Dijkstra 此时认定 1 最短；但路径 <span class=\"katex-inline\">0\\to2\\to1<\/span> 权重 <span class=\"katex-inline\">6-3=3&lt;5<\/span>，1 的距离应被压到 3。\n<\/li><li>\n问题出在非负前提：负权边让后续松弛能压低已摘顶顶点，&quot;摘顶即确定&quot;破裂。\n<\/li><li>\n该图无环，可走拓扑松弛；若含负权环，绕环无限压低权重，最短路径无有限解。\n<\/ol>\n<h2>算法选择对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>问题<\/th><th>算法<\/th><th>前提<\/th><th>量级<\/th><th>关键部件<\/th><\/tr><\/thead><tbody><tr><td>连通分量<\/td><td>DFS/BFS / 并查集<\/td><td>无向<\/td><td><span class=\"katex-inline\">O(V+E)<\/span> / 近常数<\/td><td>marked / find<\/td><\/tr><tr><td>MST<\/td><td>Prim<\/td><td>稠密友好<\/td><td><span class=\"katex-inline\">O(E\\lg V)<\/span><\/td><td>优先队列<\/td><\/tr><tr><td>MST<\/td><td>Kruskal<\/td><td>稀疏友好<\/td><td><span class=\"katex-inline\">O(E\\lg E)<\/span> 排序主导<\/td><td>并查集<\/td><\/tr><tr><td>最短路径<\/td><td>Dijkstra<\/td><td>边权非负<\/td><td><span class=\"katex-inline\">O(E\\lg V)<\/span><\/td><td>优先队列、松弛<\/td><\/tr><tr><td>最短路径<\/td><td>拓扑松弛<\/td><td>DAG<\/td><td><span class=\"katex-inline\">O(V+E)<\/span><\/td><td>拓扑序<\/td><\/tr><tr><td>最短路径<\/td><td>Bellman-Ford 方向<\/td><td>一般负权、无负权环<\/td><td><span class=\"katex-inline\">O(VE)<\/span><\/td><td>多轮松弛<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>第二组复盘：贪心边界<\/h2>\n<p><strong>复盘 1：MST 当导航树。<\/strong> MST 优化全网边权和，<span class=\"katex-inline\">0<\/span> 到某点路径未必最短；Prim 边集不能直接当 SPT。复盘：目标函数分开建模。<\/p>\n<p><strong>复盘 2：Kruskal 不判环。<\/strong> 同组加边生成环，破坏生成树无环条件。复盘：加边前 <code>connected<\/code> 检查。<\/p>\n<p><strong>复盘 3：忽视负权环。<\/strong> 负权环可无限松弛，路径权重无下界；算法应先识别环存在性，不能继续求最短路。<\/p>\n<p><strong>复盘 4：并列权值误以为树唯一。<\/strong> 边权相等时多棵 MST 同为最小；结论是权和最小，边集可以不同。<\/p>\n<p><strong>复盘 5：把贪心当局部试探。<\/strong> MST 与 Dijkstra 的每步选择都有定理托底：切分定理、子路径最优；不是凭直觉挑小边。论证链条断了，贪心结论就只是经验。<\/p>\n<h2>延伸：本章在全书中的位置<\/h2>\n<p>图遍历底座来自 c09；优先队列来自 c05；并查集来自 c02。带权优化把&quot;结构遍历&quot;推进到&quot;目标函数优化&quot;：MST 选边使全网权和最小，SPT 选边使起点距离最小。贪心正确性的论证方式——先立定理（切分定理、非负下的最短排除），再推算法动作——是后续网络路由、调度、约束优化的通用骨架。本书 §4.4 还覆盖无环加权图松弛与一般加权图算法，负权与负权环边界需单独识别。<\/p>\n<h2>最短路径松弛口径再核对<\/h2>\n<ul><li>\n松弛动作：经 <span class=\"katex-inline\">v<\/span> 到 <span class=\"katex-inline\">w<\/span>，若 <code>dist[v]+weight(v,w)&lt;dist[w]<\/code>，更新 <code>dist[w]<\/code> 并记 <code>edgeTo[w]=v<\/code>。\n<\/li><li>\n子路径最优：最短路径的任意子段也是最短路径；否则替换更短子段可得更短全路径。\n<\/li><li>\nDijkstra：非负权下按距离摘顶，摘顶即确定；出边松弛。\n<\/li><li>\n拓扑松弛：DAG 按拓扑序处理，每顶点出边一次松弛，可容负权。\n<\/li><li>\nBellman-Ford 方向：一般含负权无负权环图，多轮松弛 <span class=\"katex-inline\">O(VE)<\/span>；负权环无解。\n<\/ul>\n<h2>MST 与 SPT 目标对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>最小生成树<\/th><th>最短路径树<\/th><\/tr><\/thead><tbody><tr><td>优化目标<\/td><td>全网边权和最小<\/td><td>起点到各点距离最小<\/td><\/tr><tr><td>面向图<\/td><td>连通加权无向图<\/td><td>加权有向图<\/td><\/tr><tr><td>代表算法<\/td><td>Prim / Kruskal<\/td><td>Dijkstra / 拓扑松弛<\/td><\/tr><tr><td>边集含义<\/td><td>组网无环连通<\/td><td>起点前驱路径<\/td><\/tr><tr><td>误用风险<\/td><td>当成导航路线<\/td><td>当成全网最省布线<\/td><\/tr><\/tbody><\/table><\/div>\n<p>两者流程相似（都取小候选、用优先队列），目标函数不同，边集不能互替。Kruskal 的环检测复用并查集；Prim 的横切边与 Dijkstra 的距离复用同一优先队列部件。<\/p>\n<h2>贪心论证链条<\/h2>\n<p>MST：切分定理 → 最小横切边属某棵 MST → Prim 扩切分、Kruskal 加边不堵最优。 最短路径：子路径最优 → 非负下排除更短路径 → Dijkstra 摘顶确定。 论证断在哪一步，贪心就退化成局部试探；选型时先确认前提（连通、非负、无环、无负权环），再引算法结论。<\/p>\n<h2>算法前提清单<\/h2>\n<ul><li>\nMST：图连通、边权可比较；Prim 稠密友好，Kruskal 稀疏友好。\n<\/li><li>\nDijkstra：边权非负；摘顶即确定，松弛出边。\n<\/li><li>\n拓扑松弛：图为 DAG；可容负权，按拓扑序处理。\n<\/li><li>\nBellman-Ford 方向：一般负权、无负权环；多轮松弛 <span class=\"katex-inline\">O(VE)<\/span>。\n<\/li><li>\n负权环：路径权重无下界，最短路径无解。\n<\/ul>\n<p>选型顺序：先判连通性、环、边权符号，再定优化目标（组网/路径），再选算法部件。优先队列承担摘顶，并查集承担环检测，松弛承担距离更新。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n切分定理怎样用反证证明最小横切边属于某棵 MST？删去的另一条横切边权值方向是什么？\n<\/li><li>\nPrim 每轮面对的切分是哪两组顶点？Kruskal 用什么结构判断成环？\n<\/li><li>\n为什么最短路径的子段也是最短路径？这条性质支撑什么松弛动作？\n<\/li><li>\nDijkstra 正确性证明中，非负权在第几步起作用？负权边怎样打破摘顶即确定的结论？\n<\/li><li>\nMST 与最短路径树的优化目标差别是什么？为什么 Prim 结果不能直接当导航路线？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "最小生成树与最短路径：Prim、Kruskal、Dijkstra 的贪心正确性"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：基础：编程模型、ADT、数据结构与算法分析<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：基础（编程模型、数据抽象、背包队列栈、算法分析、union-find）<\/a><br>检查点：能说出背包/队列/栈的 API 差别，用增长数量级给一段程序归类，解释 union-find 各实现访问数组次数的差异<\/li><li class='path-step' id='path-02'><strong>步骤 02：排序：初级排序、归并、快排、堆与优先队列<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：排序（初级排序、归并排序、快速排序、优先队列与堆排序）<\/a><br>检查点：能在小数组上逐步推演归并、切分与堆调整，写出各排序的最坏/期望复杂度与额外空间，并说明稳定性差异<\/li><li class='path-step' id='path-03'><strong>步骤 03：查找：符号表、二叉查找树、红黑树与散列表<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：查找（符号表、二叉查找树、红黑树、散列表）<\/a><br>检查点：能比较顺序查找、二分查找、BST、红黑树、散列表的代价来源，说清红黑树不变量与散列冲突处理机制<\/li><li class='path-step' id='path-04'><strong>步骤 04：图：搜索、连通分量、最小生成树与最短路径<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：图（无向图/有向图、DFS/BFS、最小生成树、最短路径）<\/a><br>检查点：能在小图上逐步跑通 DFS/BFS、Prim/Kruskal 与 Dijkstra，说明贪心选择成立的前提条件与各自适用的边权约束<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='抽象数据类型（adt）'>抽象数据类型（ADT） — 一组数据与其上操作的接口定义，使用方只通过 API 调用而不关心内部表示；书中用 API 表列出构造函数与方法签名、返回类型和用途 <span class=glossary-ref>（第 1 章：基础（编程模型、数据抽象、背包队列栈、算法分析、union-find））<\/span><\/li><li data-term='增长数量级（order of growth）'>增长数量级（order of growth） — 描述算法运行时间随输入规模 $N$ 变化的函数类别，如对数级 $\\lg N$、线性级 $N$、线性对数级 $N\\lg N$、平方级 $N^2$；忽略常数系数与低阶项 <span class=glossary-ref>（第 1 章：基础（编程模型、数据抽象、背包队列栈、算法分析、union-find））<\/span><\/li><li data-term='动态连通性问题'>动态连通性问题 — 输入一列整数对 $(p,q)$，表示两对象相连；程序需判断两对象是否已在同一等价类中，并合并不同等价类；自反、对称、传递三条性质把对象划分为等价类 <span class=glossary-ref>（第 1 章：基础（编程模型、数据抽象、背包队列栈、算法分析、union-find））<\/span><\/li><li data-term='加权 quick-union'>加权 quick-union — union-find 的一种实现：根结点记录树的分量大小，合并时把较小树的根接到较大树的根上；配合路径压缩使查找路径趋近常数 <span class=glossary-ref>（第 1 章：基础（编程模型、数据抽象、背包队列栈、算法分析、union-find））<\/span><\/li><li data-term='稳定排序'>稳定排序 — 排序后相等键的相对次序与输入次序保持一致；稳定性在多级排序（先按次键、再按主键）时决定结果是否可叠加 <span class=glossary-ref>（第 2 章：排序（初级排序、归并排序、快速排序、优先队列与堆排序））<\/span><\/li><li data-term='归并（merge）'>归并（merge） — 把两个各自有序的子数组合并成一个更大有序数组的线性操作；归并排序以归并为核心，分治地切分、排序、再合并 <span class=glossary-ref>（第 2 章：排序（初级排序、归并排序、快速排序、优先队列与堆排序））<\/span><\/li><li data-term='切分（partition）'>切分（partition） — 快速排序的核心步骤：取定标定点，把数组整理成左侧元素不大于标定、右侧元素不小于标定，标定落到最终位置 <span class=glossary-ref>（第 2 章：排序（初级排序、归并排序、快速排序、优先队列与堆排序））<\/span><\/li><li data-term='堆（heap）'>堆（heap） — 基于数组的完全二叉树，每个结点的键不小于（最大堆）或不大于（最小堆）其子结点的键；父结点下标 $k$ 对应子结点 $2k$、$2k+1$ <span class=glossary-ref>（第 2 章：排序（初级排序、归并排序、快速排序、优先队列与堆排序））<\/span><\/li><li data-term='符号表（symbol table）'>符号表（symbol table） — 键值对的抽象结构，支持插入、查找、删除以及有序符号表的排名、选择、范围查询等方法；是查找算法的统一 API 层 <span class=glossary-ref>（第 3 章：查找（符号表、二叉查找树、红黑树、散列表））<\/span><\/li><li data-term='二叉查找树（bst）'>二叉查找树（BST） — 一棵二叉树，每个结点键大于其左子树所有键、小于其右子树所有键；中序遍历按键升序输出；树高决定单次操作代价 <span class=glossary-ref>（第 3 章：查找（符号表、二叉查找树、红黑树、散列表））<\/span><\/li><li data-term='红黑树（red-black bst）'>红黑树（red-black BST） — 由 2-3 查找树映射而来的平衡二叉查找树：结点分红黑，满足红结点不连续、从根到叶黑高一致等不变量，保证树高在 $2\\lg N$ 以内 <span class=glossary-ref>（第 3 章：查找（符号表、二叉查找树、红黑树、散列表））<\/span><\/li><li data-term='散列冲突（collision）'>散列冲突（collision） — 两个不同键经散列函数得到同一数组索引；拉链法在同一索引处挂链表，线性探测法沿索引向后寻找空位 <span class=glossary-ref>（第 3 章：查找（符号表、二叉查找树、红黑树、散列表））<\/span><\/li><li data-term='广度优先搜索（bfs）'>广度优先搜索（BFS） — 按距起点的层数逐层扩展的图搜索：用队列保存待扩展顶点，先处理距离近的顶点；所得起点到各顶点的路径边数最少 <span class=glossary-ref>（第 4 章：图（无向图/有向图、DFS/BFS、最小生成树、最短路径））<\/span><\/li><li data-term='最小生成树（mst）'>最小生成树（MST） — 连通加权无向图中连接全部顶点、边权之和最小的生成树；Prim 从顶点出发逐步加入横切边，Kruskal 按边权升序加入不构成环的边 <span class=glossary-ref>（第 4 章：图（无向图/有向图、DFS/BFS、最小生成树、最短路径））<\/span><\/li><li data-term='最短路径'>最短路径 — 加权有向图中从起点到各顶点路径权重之和最小的路径；Dijkstra 在边权非负前提下按距离递增顺序确定最短路径 <span class=glossary-ref>（第 4 章：图（无向图/有向图、DFS/BFS、最小生成树、最短路径））<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库<\/h1>\n<h2>模式 1：分析程序先数基本操作次数，再归增长数量级<\/h2>\n<p><strong>触发<\/strong>：拿到一段循环或递归程序，要求估运行时间随规模 <span class=\"katex-inline\">N<\/span> 的变化趋势，或在两个实现之间比较快慢。<\/p>\n<p><strong>步骤<\/strong>：<\/p>\n<ol><li>\n定位最内层反复执行的基本操作（比较、交换、数组访问），它就是计数对象。\n<\/li><li>\n按嵌套结构计数：单层遍历为 <span class=\"katex-inline\">N<\/span>，两层嵌套为 <span class=\"katex-inline\">N^2<\/span>，每次区间折半为 <span class=\"katex-inline\">\\lg N<\/span>；递归程序先写递推式（如归并 <span class=\"katex-inline\">T(N)=2T(N/2)+O(N)<\/span>）再解量级。\n<\/li><li>\n忽略常数系数与低阶项，归入对数、线性、线性对数、平方等类别；分别标注最好、最坏、期望三种输入分布下的口径。\n<\/ol>\n<p><strong>落点<\/strong>：给出数量级类别与规模翻倍时的增长方向；需要数字时用小数组实测比对，不写伪精确的常数系数。<\/p>\n<p><strong>边界<\/strong>：数量级只刻画大规模趋势，小规模与缓存、常数因子不可由类别替代；输入分布未知时不能把期望口径当最坏口径报告。<\/p>\n<h2>模式 2：连通性问题先建等价类视图，再选并查集实现<\/h2>\n<p><strong>触发<\/strong>：题目输入是一对对相连的对象，操作只有&quot;判断两者是否同组&quot;和&quot;合并两组&quot;，不需要列出组成员关系。<\/p>\n<p><strong>步骤<\/strong>：<\/p>\n<ol><li>\n确认关系满足自反、对称、传递，对象被划分为若干等价类。\n<\/li><li>\n选表示：数组编号或父指针树；合并时把较小分量的根接到较大分量的根上，并维护分量大小。\n<\/li><li>\n查找沿途把路径上的结点压向根（路径压缩）；新对象先自成一类再参与合并。\n<\/ol>\n<p><strong>落点<\/strong>：用 find 回答同组判断，用 union 合并分量；加权加路径压缩后查找趋近反阿克曼函数量级。<\/p>\n<p><strong>边界<\/strong>：需要枚举同组全部成员、保存原始边或输出连接过程时，并查集不够用，需另配邻接表；路径压缩后父指针不再直接代表树规模，分量大小口径要单独维护，不能从父指针反推。<\/p>\n<h2>模式 3：排序选型先列约束清单，再选算法族<\/h2>\n<p><strong>触发<\/strong>：需要对一批键排序，在选择、插入、希尔、归并、快排、堆排之间选择实现。<\/p>\n<p><strong>步骤<\/strong>：<\/p>\n<ol><li>\n列约束：是否要求稳定、额外空间上限、重复键占比、输入是否接近有序、规模大小。\n<\/li><li>\n小规模或近乎有序选插入排序；要求稳定与最坏 <span class=\"katex-inline\">N\\lg N<\/span> 保证选归并；原地且期望快选快排，重复键多接三向切分；流式反复取最值接堆。\n<\/li><li>\n选定后写出该算法的最坏、期望时间与额外空间口径，并核对稳定性是否匹配多级排序需求。\n<\/ol>\n<p><strong>落点<\/strong>：给出算法名与代价对照表，关键步骤（切分、合并、堆调整）能在小数组上逐步走一遍。<\/p>\n<p><strong>边界<\/strong>：比较模型内 <span class=\"katex-inline\">N\\lg N<\/span> 是排序下界方向，非比较路线（计数、基数）只在键可映射到有限区间时成立；稳定性缺失会让&quot;先按次键、再按主键&quot;的多级排序结果错位；归并的 <span class=\"katex-inline\">N<\/span> 级空间在内存受限时是硬约束。<\/p>\n<h2>模式 4：查找结构选型先问是否需要有序操作<\/h2>\n<p><strong>触发<\/strong>：要实现键值对映射，在顺序查找、二分有序数组、普通 BST、红黑树、散列表之间选择。<\/p>\n<p><strong>步骤<\/strong>：<\/p>\n<ol><li>\n先查操作清单：是否需要排名、选择第 <span class=\"katex-inline\">k<\/span> 个、范围查询、按键序遍历；需要有序操作则走树路线，纯取值可评估散列。\n<\/li><li>\n看增删频率与数据是否静态：静态数据用有序数组二分；动态且怕最坏链状退化用红黑树；纯字典/缓存定位用散列。\n<\/li><li>\n为选定结构写出查找、插入、删除的代价口径，并标注平均与最坏的差别。\n<\/ol>\n<p><strong>落点<\/strong>：结构与代价口径一并确定；有序方法在树结构上沿中序与子树大小实现，散列不提供这些方法的落点。<\/p>\n<p><strong>边界<\/strong>：散列平均常数结论依赖均匀散列假设，最坏情况由散列质量决定，不承诺对数上界；普通 BST 的期望均衡来自随机插入排列，顺序插入会退化成链，需平衡结构兜底；键对象在表期间必须不可变，<code>equals<\/code> 与散列基于同一组字段。<\/p>\n<h2>模式 5：图问题先判图型与边权
