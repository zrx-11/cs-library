，再选遍历或贪心<\/h2>\n<p><strong>触发<\/strong>：问题以顶点和边为对象，目标是连通性、路径、组网或最短距离。<\/p>\n<p><strong>步骤<\/strong>：<\/p>\n<ol><li>\n判图型：无向还是有向；是否带权；边权是否非负；是否存在环与负权环。\n<\/li><li>\n判目标：可达性/连通分量走 DFS；最少边数路径走 BFS；连接全部顶点的最小组网走 Prim 或 Kruskal；带权最短路径走 Dijkstra 或拓扑松弛。\n<\/li><li>\n选定算法后标注成立前提与代价：DFS/BFS 为 <span class=\"katex-inline\">O(V+E)<\/span>，Prim 与 Dijkstra 为 <span class=\"katex-inline\">O(E\\lg V)<\/span>，Kruskal 为 <span class=\"katex-inline\">O(E\\lg E)<\/span>。\n<\/ol>\n<p><strong>落点<\/strong>：在小图上逐步跑通遍历或摘顶、松弛过程，能说清每一步加入的顶点或边依据什么不变量。<\/p>\n<p><strong>边界<\/strong>：Dijkstra 不处理负权边；存在负权环时最短路径无解；BFS 只数边数，边权差异交给松弛算法；MST 要求原图连通，不连通时各分量分别生成树；有向图的可达不等于强连通，双向可达要另立判定。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>1. 四章路线对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>单元<\/th><th>主题<\/th><th>核心结构<\/th><th>关键概念<\/th><th>原书章节<\/th><\/tr><\/thead><tbody><tr><td>ch01 基础<\/td><td>编程模型、ADT、背包/队列/栈、算法分析、union-find<\/td><td>数组、链表、父指针树<\/td><td>增长数量级、等价类、加权 quick-union、路径压缩<\/td><td>第 1 章<\/td><\/tr><tr><td>ch02 排序<\/td><td>初级排序、归并、快排、堆与优先队列<\/td><td>数组段、二叉堆<\/td><td>切分、归并、堆序、稳定性<\/td><td>第 2 章<\/td><\/tr><tr><td>ch03 查找<\/td><td>符号表、BST、红黑树、散列表<\/td><td>二叉树、红链、索引数组<\/td><td>中序有序、平衡不变量、冲突处理、均匀假设<\/td><td>第 3 章<\/td><\/tr><tr><td>ch04 图<\/td><td>无向/有向图、DFS/BFS、MST、最短路径<\/td><td>邻接表、优先队列<\/td><td>连通分量、贪心选择、横切边、松弛<\/td><td>第 4 章<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>2. 增长数量级速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>类别<\/th><th>记号<\/th><th>典型程序形态<\/th><th>代表算法/操作<\/th><\/tr><\/thead><tbody><tr><td>常数级<\/td><td><span class=\"katex-inline\">1<\/span><\/td><td>直接取数组元素、判断根是否相等<\/td><td>哈希命中、优先队列摘顶后的局部调整<\/td><\/tr><tr><td>对数级<\/td><td><span class=\"katex-inline\">\\lg N<\/span><\/td><td>每次把区间折半<\/td><td>二分查找、BST/红黑树单次操作（期望或最坏）<\/td><\/tr><tr><td>线性级<\/td><td><span class=\"katex-inline\">N<\/span><\/td><td>单层遍历全部元素<\/td><td>归并合并、DFS/BFS 扫描邻接表<\/td><\/tr><tr><td>线性对数级<\/td><td><span class=\"katex-inline\">N\\lg N<\/span><\/td><td>分治递归：每层 <span class=\"katex-inline\">O(N)<\/span>，共 <span class=\"katex-inline\">\\lg N<\/span> 层<\/td><td>归并排序、快排期望、堆排序<\/td><\/tr><tr><td>平方级<\/td><td><span class=\"katex-inline\">N^2<\/span><\/td><td>两层嵌套遍历<\/td><td>选择排序、插入排序（最坏）、quick-find 的 union<\/td><\/tr><tr><td>指数级<\/td><td><span class=\"katex-inline\">2^N<\/span><\/td><td>递归双路分裂且结果不合并<\/td><td>穷举子集类问题（本书主线路线之外）<\/td><\/tr><\/tbody><\/table><\/div>\n<p>口径提醒：数量级忽略常数系数与低阶项；比较最好、最坏、期望三种输入分布时分别归类，不混用。<\/p>\n<h2>3. 排序算法对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>算法<\/th><th>最坏时间<\/th><th>期望时间<\/th><th>额外空间<\/th><th>稳定性<\/th><th>核心步骤<\/th><\/tr><\/thead><tbody><tr><td>选择排序<\/td><td><span class=\"katex-inline\">N^2<\/span><\/td><td><span class=\"katex-inline\">N^2<\/span><\/td><td><span class=\"katex-inline\">1<\/span><\/td><td>不稳定<\/td><td>每轮在未排区间选最小，换到前端<\/td><\/tr><tr><td>插入排序<\/td><td><span class=\"katex-inline\">N^2<\/span><\/td><td><span class=\"katex-inline\">N^2<\/span>（随机约 <span class=\"katex-inline\">N^2/4<\/span>）<\/td><td><span class=\"katex-inline\">1<\/span><\/td><td>稳定<\/td><td>把当前键向前插入已排好段；代价由逆序对驱动<\/td><\/tr><tr><td>希尔排序<\/td><td>随增量序列，<span class=\"katex-inline\">N^{3/2}<\/span> 量级方向<\/td><td>同量级方向<\/td><td><span class=\"katex-inline\">1<\/span><\/td><td>不稳定<\/td><td>按增量分组做插入，逐步缩增量<\/td><\/tr><tr><td>归并排序<\/td><td><span class=\"katex-inline\">N\\lg N<\/span><\/td><td><span class=\"katex-inline\">N\\lg N<\/span><\/td><td><span class=\"katex-inline\">N<\/span>（辅助数组）<\/td><td>稳定<\/td><td>分治切半，递归排序后线性合并两段<\/td><\/tr><tr><td>快速排序<\/td><td><span class=\"katex-inline\">N^2<\/span><\/td><td><span class=\"katex-inline\">N\\lg N<\/span><\/td><td><span class=\"katex-inline\">\\lg N<\/span>（递归栈）<\/td><td>不稳定<\/td><td>标定切分，两侧递归；三向切分压重复键代价<\/td><\/tr><tr><td>堆排序<\/td><td><span class=\"katex-inline\">N\\lg N<\/span><\/td><td><span class=\"katex-inline\">N\\lg N<\/span><\/td><td><span class=\"katex-inline\">1<\/span><\/td><td>不稳定<\/td><td>建堆后反复摘顶、末端下沉调整<\/td><\/tr><\/tbody><\/table><\/div>\n<p>比较模型内排序的信息论下界方向为 <span class=\"katex-inline\">N\\lg N<\/span>：归并、快排期望、堆排落在该量级；插入、选择、希尔不越过平方级方向。<\/p>\n<h2>4. 查找结构对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>结构<\/th><th>查找<\/th><th>插入<\/th><th>删除<\/th><th>有序操作<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>顺序查找（链表/数组）<\/td><td><span class=\"katex-inline\">N<\/span><\/td><td><span class=\"katex-inline\">N<\/span><\/td><td><span class=\"katex-inline\">N<\/span><\/td><td>无<\/td><td>无键序假设，实现最轻<\/td><\/tr><tr><td>二分查找（有序数组）<\/td><td><span class=\"katex-inline\">\\lg N<\/span><\/td><td><span class=\"katex-inline\">N<\/span><\/td><td><span class=\"katex-inline\">N<\/span><\/td><td>排名、范围支持<\/td><td>适合静态数据，增删挪动贵<\/td><\/tr><tr><td>普通 BST<\/td><td>期望 <span class=\"katex-inline\">\\lg N<\/span>，最坏 <span class=\"katex-inline\">N<\/span><\/td><td>同查找<\/td><td>同查找<\/td><td>中序有序<\/td><td>期望均衡来自随机插入排列<\/td><\/tr><tr><td>红黑 BST<\/td><td><span class=\"katex-inline\">\\lg N<\/span> 最坏<\/td><td><span class=\"katex-inline\">\\lg N<\/span><\/td><td><span class=\"katex-inline\">\\lg N<\/span><\/td><td>排名、选择、范围、遍历<\/td><td>颜色不变量锁住树高<\/td><\/tr><tr><td>散列表<\/td><td>平均常数<\/td><td>平均常数<\/td><td>平均常数<\/td><td>不支持<\/td><td>常数结论以均匀散列假设为前提<\/td><\/tr><\/tbody><\/table><\/div>\n<p>有序操作指排名、选择第 <span class=\"katex-inline\">k<\/span> 个、范围查询、按键序遍历；散列放弃键序换来定位常数。<\/p>\n<h2>5. union-find 实现演化对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>实现<\/th><th>find<\/th><th>union<\/th><th>树高控制<\/th><th>访问次数口径<\/th><\/tr><\/thead><tbody><tr><td>quick-find<\/td><td><span class=\"katex-inline\">O(1)<\/span><\/td><td><span class=\"katex-inline\">O(N)<\/span>，遍历全数组改编号<\/td><td>无树结构<\/td><td>合并代价全数组<\/td><\/tr><tr><td>quick-union<\/td><td>随树高，最坏 <span class=\"katex-inline\">N<\/span><\/td><td>接两根，<span class=\"katex-inline\">O(\\text{树高})<\/span><\/td><td>无控制，链可拉长<\/td><td>查找沿父指针上溯<\/td><\/tr><tr><td>加权 quick-union<\/td><td>随树高，最坏 <span class=\"katex-inline\">\\lg N<\/span><\/td><td>小树根挂大树根，记分量大小<\/td><td>按大小平衡<\/td><td>树高被分量大小压到对数<\/td><\/tr><tr><td>加权 + 路径压缩<\/td><td>趋近反阿克曼函数量级<\/td><td>同加权<\/td><td>查找沿途压平<\/td><td>工程实践中近常数<\/td><\/tr><\/tbody><\/table><\/div>\n<p>并查集只回答同组归属，不保存成员名单、不保存原始边；需要枚举同组成员时另配结构。<\/p>\n<h2>6. 图算法对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>算法<\/th><th>目标<\/th><th>主要数据结构<\/th><th>代价口径<\/th><th>成立前提<\/th><\/tr><\/thead><tbody><tr><td>DFS<\/td><td>连通分量、环检测、拓扑序<\/td><td>递归栈/显式栈<\/td><td><span class=\"katex-inline\">O(V+E)<\/span><\/td><td>标记纳入即做，防重复进入<\/td><\/tr><tr><td>BFS<\/td><td>起点到各顶点最少边数路径<\/td><td>队列<\/td><td><span class=\"katex-inline\">O(V+E)<\/span><\/td><td>只数边数，不比较边权<\/td><\/tr><tr><td>Prim<\/td><td>最小生成树<\/td><td>优先队列<\/td><td><span class=\"katex-inline\">O(E\\lg V)<\/span><\/td><td>图连通；边权可比较<\/td><\/tr><tr><td>Kruskal<\/td><td>最小生成树<\/td><td>边排序 + 并查集<\/td><td><span class=\"katex-inline\">O(E\\lg E)<\/span><\/td><td>图连通；成环边跳过<\/td><\/tr><tr><td>Dijkstra<\/td><td>起点到各顶点最短路径<\/td><td>优先队列<\/td><td><span class=\"katex-inline\">O(E\\lg V)<\/span><\/td><td>边权非负；摘顶即确定距离<\/td><\/tr><\/tbody><\/table><\/div>\n<p>带负权边的最短路不适用 Dijkstra；含负权环时路径权重无下界，最短路径无解。<\/p>\n<h2>7. 不变量与边界清单<\/h2>\n<ul><li>\n归并排序稳定，快排、堆排、选择排序、希尔排序不稳定；多级排序先按次键再按主键时，稳定性决定结果能否叠加。\n<\/li><li>\n红黑树四条不变量：红链接只在左侧、红结点不连续、根为黑色、每条根到叶路径黑高一致；满足后树高在 <span class=\"katex-inline\">2\\lg N<\/span> 以内。\n<\/li><li>\n散列平均长度公式依赖均匀散列假设：不同键在索引区间等概率分布；函数聚集、表长取倍数规律时公式失效。\n<\/li><li>\n堆下标（1 起算）：父 <span class=\"katex-inline\">\\lfloor k/2\\rfloor<\/span>，左子 <span class=\"katex-inline\">2k<\/span>，右子 <span class=\"katex-inline\">2k+1<\/span>；swim 管尾到根，sink 管根到叶。\n<\/li><li>\nMST 贪心成立依据切分定理：横切边中权最小者必属某棵 MST；最短路径贪心成立依据边权非负下的松弛不变量。\n<\/li><li>\nBFS 给出的是最少边数，不是最小权重；带权图的距离结论必须走松弛类算法。\n<\/ul>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/sedgewick-algorithms-4e", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：基础（编程模型、数据抽象、背包队列栈、算法分析、union-find）", "href": "#/chapter/ch01"}, {"label": "第 2 章：排序（初级排序、归并排序、快速排序、优先队列与堆排序）", "href": "#/chapter/ch02"}, {"label": "第 3 章：查找（符号表、二叉查找树、红黑树、散列表）", "href": "#/chapter/ch03"}, {"label": "第 4 章：图（无向图/有向图、DFS/BFS、最小生成树、最短路径）", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "增长数量级与算法分析的数学模型", "href": "#/concept/c01"}, {"label": "动态连通性与 union-find：加权 quick-union 与路径压缩", "href": "#/concept/c02"}, {"label": "归并排序：自顶向下、自底向上与排序复杂度下界", "href": "#/concept/c03"}, {"label": "快速排序：切分过程、性能改进与三向切分", "href": "#/concept/c04"}, {"label": "堆、优先队列与堆排序", "href": "#/concept/c05"}, {"label": "符号表与二叉查找树：顺序查找、二分查找与 BST 性质", "href": "#/concept/c06"}, {"label": "红黑树：2-3 树映射与平衡不变量", "href": "#/concept/c07"}, {"label": "散列表：散列函数、拉链法、线性探测与均匀散列假设", "href": "#/concept/c08"}, {"label": "图的搜索：深度优先、广度优先与连通分量", "href": "#/concept/c09"}, {"label": "最小生成树与最短路径：Prim、Kruskal、Dijkstra 的贪心正确性", "href": "#/concept/c10"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：基础（编程模型、数据抽象、背包队列栈、算法分析、union-find）", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：排序（初级排序、归并排序、快速排序、优先队列与堆排序）", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：查找（符号表、二叉查找树、红黑树、散列表）", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：图（无向图/有向图、DFS/BFS、最小生成树、最短路径）", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：算法 第四版 Algorithms (4th Edition).pdf · p.40<\/div><h1>第 1 章：基础（编程模型、数据抽象、背包队列栈、算法分析、union-find）<\/h1>\n<blockquote>对应原书第 1 章（印刷页 1–151，PDF 第 40–190 页；偏移 k=39，即印刷页 = PDF 物理页 − 39，已用章首六处互核：PDF 40=印刷 1、191=152、266=227、368=329、490=451、650=611）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n读懂 Java 程序的基本结构、原始数据类型、数组、静态方法与字符串、输入输出，能照着书里的 API 表使用标准库；\n<\/li><li>\n说出抽象数据类型（ADT）的接口与实现分层，区分背包、队列、栈三种集合类数据类型的出入顺序；\n<\/li><li>\n用科学方法观察程序运行时间，写出程序运行时间关于规模 <span class=\"katex-inline\">N<\/span> 的数学模型，把算法归入对数、线性、线性对数、平方、立方等增长数量级；\n<\/li><li>\n走通动态连通性问题，说明 quick-find、quick-union、加权 quick-union 与路径压缩各版本访问数组次数的差异；\n<\/li><li>\n估算一段给定循环程序在最坏情形下的访问次数量级，识别输入分布对运行时间的影响。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>本章先立起两件工具：一件是接口与实现分离的数据类型表示法（API 表），另一件是用数学模型刻画算法代价的分析方法。后续排序、查找、图算法都先按 API 描述&quot;能做什么&quot;，再按增长数量级论证&quot;代价多大&quot;；union-find 案例则完整演示一次&quot;提出朴素实现 → 分析缺陷 → 迭代改进&quot;的算法设计循环。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：基础编程模型与数据抽象（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。§1.1 从一个 Java 程序的骨架讲起：方法签名、原始数据类型（整型、浮点、布尔、字符）、语句（声明、赋值、条件、循环、调用）、数组、静态方法、API 与字符串处理（PDF 第 40 页起）。§1.2 引入抽象数据类型：把数据表示藏在实现内部，用一张 API 表向用例暴露构造函数与方法（PDF 第 77 页起，印刷 38）。累加器 Accumulator 与点数器 Counter 是两个最小的 ADT 例子；用例只调用 <code>addDataValue()<\/code>、<code>mean()<\/code>、<code>increment()<\/code>，不接触内部字段。<\/p>\n<h3>2. 概念 2：背包、队列和栈（难度：基础）<\/h3>\n<p>§1.3 给出三种集合类数据类型（PDF 第 113 页起，印刷 74）。背包（Bag）只收集元素并能遍历，不关心取出顺序；队列（Queue）按先进先出（FIFO）出队；栈（Stack）按后进先出（LIFO）弹栈。三种结构的 API 都支持添加、判断是否为空、遍历，内部实现可以用数组也可以用链表。链表一节把结点定义为&quot;保存元素与指向下一结点的引用&quot;，讨论增删结点时引用链的改写顺序。<\/p>\n<h3>3. 概念 3：算法分析的数学模型与增长数量级（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。§1.4 按科学方法走一遍：提出假设 → 用计时器 Stopwatch 测量 → 倍率实验（规模加倍观察时间比）→ 建立数学模型（PDF 第 147 页起，印刷 108）。模型区分指令执行的频度：内层循环体执行次数决定量级。常见类别按增长速度排列：<span class=\"katex-inline\">\\lg N<\/span>、<span class=\"katex-inline\">N<\/span>、<span class=\"katex-inline\">N\\lg N<\/span>、<span class=\"katex-inline\">N^2<\/span>、<span class=\"katex-inline\">N^3<\/span>、<span class=\"katex-inline\">2^N<\/span>。本节还讨论内存占用：对象、数组、字符串在 Java 中的基本开销。<\/p>\n<h3>4. 概念 4：动态连通性与 union-find（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。§1.5 是本章案例研究（PDF 第 175 页起，印刷 136）。输入一列整数对 <span class=\"katex-inline\">(p,q)<\/span>，&quot;相连&quot;是等价关系（自反、对称、传递），目标是过滤掉两端已在同一等价类的整数对。书里依次给出 quick-find（每个端点查根值）、quick-union（沿父链找根）、加权 quick-union（小树挂大树），再叠加路径压缩。访问数组次数从平方级降到趋近常数级。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[Java 程序骨架&lt;br/&gt;类型/语句/数组/方法] --&gt; B[抽象数据类型&lt;br/&gt;API 与实现分离]\nB --&gt; C[背包/队列/栈&lt;br/&gt;三种集合结构]\nB --&gt; D[算法分析&lt;br/&gt;观察→模型→数量级]\nD --&gt; E[union-find 案例&lt;br/&gt;朴素实现→迭代改进]\nC --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这条链断在 B（接口与实现分层），后面三种集合结构的 API 描述就会和内部表示混在一起；断在 D（增长数量级），union-find 的改进方向就失去判据——只能凭感觉改代码，无法说清每一版为什么更快。<\/p>\n<h2>推导一（复杂度推演）：二分查找为什么是对数级<\/h2>\n<p>§1.1.10 在有序数组中查找目标键。记当前待查区间长度为 <span class=\"katex-inline\">N<\/span>，每轮比较后区间缩小为原来的一半左右：<\/p>\n<ol><li>\n初始区间有 <span class=\"katex-inline\">N<\/span> 个元素。一轮比较后，排除不含目标的一半，剩余待查区间长度约为 <span class=\"katex-inline\">\\lfloor N/2 \\rfloor<\/span>。\n<\/li><li>\n设 <span class=\"katex-inline\">T(N)<\/span> 为规模 <span class=\"katex-inline\">N<\/span> 时的比较次数，递推式写为 <span class=\"katex-inline\">T(N)=T(\\lfloor N/2 \\rfloor)+1<\/span>，边界 <span class=\"katex-inline\">T(1)=1<\/span>。\n<\/li><li>\n展开递推：第 1 轮后规模 <span class=\"katex-inline\">\\lfloor N/2 \\rfloor<\/span>，第 2 轮后 <span class=\"katex-inline\">\\lfloor N/4 \\rfloor<\/span>，第 <span class=\"katex-inline\">k<\/span> 轮后规模为 <span class=\"katex-inline\">\\lfloor N/2^k \\rfloor<\/span>；当区间缩到 1 个元素时停止。\n<\/li><li>\n停止条件是 <span class=\"katex-inline\">N/2^k \\le 1<\/span>，即 <span class=\"katex-inline\">2^k \\ge N<\/span>，解出 <span class=\"katex-inline\">k \\ge \\lg N<\/span>。比较次数上界为 <span class=\"katex-inline\">\\lfloor \\lg N \\rfloor+1<\/span>，属于对数增长数量级。\n<\/ol>\n<p>推演依据：有序数组保证比较一次就能砍掉一半；若数组无序，砍半的结论不成立，只能逐个扫描，代价退回线性级。<\/p>\n<h2>推导二（计数证明）：固定循环的总访问次数与量级归类<\/h2>\n<p>以一段双重循环为例：外层 <span class=\"katex-inline\">i<\/span> 从 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">N-1<\/span>，内层 <span class=\"katex-inline\">j<\/span> 从 <span class=\"katex-inline\">i+1<\/span> 到 <span class=\"katex-inline\">N-1<\/span>，循环体访问一次数组。<\/p>\n<ol><li>\n对固定的 <span class=\"katex-inline\">i<\/span>，内层执行次数为 <span class=\"katex-inline\">N-1-i<\/span>。\n<\/li><li>\n总次数为求和 <span class=\"katex-inline\">\\sum_{i=0}^{N-1}(N-1-i)=\\sum_{k=0}^{N-1}k=N(N-1)/2<\/span>。\n<\/li><li>\n展开得 <span class=\"katex-inline\">N(N-1)/2=\\frac{1}{2}N^2-\\frac{1}{2}N<\/span>；当 <span class=\"katex-inline\">N<\/span> 很大时低阶项 <span class=\"katex-inline\">-\\frac{1}{2}N<\/span> 与常数系数 <span class=\"katex-inline\">1/2<\/span> 不改变主导项，量级归为平方级 <span class=\"katex-inline\">N^2<\/span>。\n<\/li><li>\n对照三重循环（如 ThreeSum 的枚举三元组）：内层执行 <span class=\"katex-inline\">\\binom{N}{3}=N(N-1)(N-2)/6<\/span> 次，主导项为 <span class=\"katex-inline\">N^3/6<\/span>，归为立方级。\n<\/ol>\n<p>计数依据是&quot;循环体频度 × 单次代价&quot;：单次访问取常数，总代价由频度求和决定；求和只保留主导项得到增长数量级。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>改掉等价关系的传递性<\/strong>：若&quot;相连&quot;只保留自反与对称、去掉传递，那么 <span class=\"katex-inline\">p<\/span> 连 <span class=\"katex-inline\">q<\/span>、<span class=\"katex-inline\">q<\/span> 连 <span class=\"katex-inline\">r<\/span> 推不出 <span class=\"katex-inline\">p<\/span> 连 <span class=\"katex-inline\">r<\/span>，等价类划分无从建立；union-find 中&quot;两个端点是否同组&quot;的判断就没有固定答案，输入整数对无法被过滤。\n<\/li><li>\n<strong>去掉 API 与实现的分层<\/strong>：若用例直接读写结构内部数组，换一种内部表示（数组改链表）就要改动所有用例；接口稳定、实现可替换这一设计收益消失，§1.3 三种结构的实现迭代会直接波及调用方。\n<\/li><li>\n<strong>倍率实验不加倍规模<\/strong>：若只在同一规模反复测量，时间波动来自机器调度与缓存，无法观察运行时间随 <span class=\"katex-inline\">N<\/span> 的趋势；没有规模序列，就无法从数据反推增长数量级，假设得不到验证。\n<\/li><li>\n<strong>去掉输入分布假设<\/strong>：算法分析常按随机输入或最坏情形建模。若实际数据已经有序，插入排序这类算法表现接近线性；直接套用最坏情形的平方级结论，会高估真实代价并选错实现。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：API 表像餐厅菜单——顾客点菜只看菜名与价格，不进厨房看灶怎么烧；实现是后厨，菜单稳定，后厨可以换厨。\n<\/li><li>\n实例：<span class=\"katex-inline\">N=1000<\/span> 时，双重循环总次数为 <span class=\"katex-inline\">1000\\times999/2=499\\,500<\/span>；三重循环总次数为 <span class=\"katex-inline\">1000\\times999\\times998/6\\approx1.66\\times10^8<\/span>。同一规模下立方级比平方级多约 333 倍，这是后续章节选择分治算法的直接动机。\n<\/li><li>\n实例：union-find 处理 <span class=\"katex-inline\">N=10<\/span> 个对象、10 条连接时，quick-find 每条 union 都要扫描整个 id 数组；加权 quick-union 只需沿父链走到根，树高被分量大小压住。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解 1：增长数量级等于精确运行时间。<\/strong> 为什么错：数量级只保留主导项，忽略常数系数、低阶项与机器硬件；同一量级下两种实现的常数因子可能差几倍。数量级回答&quot;规模翻倍时代价怎么变&quot;，不回答&quot;这台机器上跑几秒&quot;。\n<\/li><li>\n<strong>误解 2：栈和队列只是写法不同，用途可以互换。<\/strong> 为什么错：出入顺序决定语义。括号匹配、函数调用链需要后进先出，用栈；任务排队、消息送达需要先进先出，用队列。顺序要求错了，结果顺序就错。\n<\/li><li>\n<strong>误解 3：ADT 的字段必须暴露给用例才能操作。<\/strong> 为什么错：ADT 的要点是数据隐藏，用例通过方法访问；字段私有才能在不破坏调用方的前提下更换内部表示。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n一段程序内层循环执行 <span class=\"katex-inline\">N(N-1)(N-2)/6<\/span> 次，它的增长数量级是什么？规模从 1000 加倍到 2000，总次数大约变为多少倍？\n<\/li><li>\n背包、队列、栈三者在&quot;取出元素的顺序&quot;上各是什么规则？各举一个需要该规则的场景。\n<\/li><li>\n为什么二分查找要求输入有序？若输入无序，推导一中哪一步失去依据？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nADT 用 API 表定义&quot;能做什么&quot;，内部表示可以替换；用例不碰字段。\n<\/li><li>\n增长数量级由循环体频度求和的主导项决定：<span class=\"katex-inline\">\\lg N<\/span>、<span class=\"katex-inline\">N<\/span>、<span class=\"katex-inline\">N\\lg N<\/span>、<span class=\"katex-inline\">N^2<\/span>、<span class=\"katex-inline\">N^3<\/span> 逐级放大。\n<\/li><li>\nunion-find 的改进主线：少扫描数组 → 沿父链找根 → 小树挂大树 → 压平路径，每一步都对应一次访问次数的下降。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章交付两样东西给后续章节：一是 API 描述方式，第 2 章排序、第 3 章符号表、第 4 章图类型都先给 API 表再讲实现；二是复杂度语言，后续每个算法都要回答&quot;最坏/期望代价是哪一级&quot;。union-find 的&quot;朴素实现 → 分析缺陷 → 加权/压缩改进&quot;循环，在第 2 章排序、第 3 章平衡查找树中反复出现：先有简单实现暴露代价问题，再用不变量把代价压下来。<\/p>", "ch02": "<div class=\"source-badge\">📖 出处：算法 第四版 Algorithms (4th Edition).pdf · p.191<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：基础（编程模型、数据抽象、背包队列栈、算法分析、union-find）<\/a><\/span><\/div><h1>第 2 章：排序（初级排序、归并排序、快速排序、优先队列与堆排序）<\/h1>\n<blockquote>对应原书第 2 章（印刷页 152–226，PDF 第 191–265 页；偏移 k=39）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n说清排序问题的游戏规则：比较、交换、键序约定，以及稳定排序的含义；\n<\/li><li>\n走完选择排序、插入排序、希尔排序的执行流程，指出各自比较与交换次数的来源；\n<\/li><li>\n写出归并排序自顶向下与自底向上两种实现的流程，证明其 <span class=\"katex-inline\">N\\lg N<\/span> 级别代价与 <span class=\"katex-inline\">N<\/span> 级额外空间；\n<\/li><li>\n讲透快速排序的切分过程，分析期望与最坏代价，说明子数组切换插入排序、三向切分等改进针对什么问题；\n<\/li><li>\n解释堆的数组表示、swim 与 sink 操作，走通堆排序流程，按场景在各排序算法间选型。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>排序算法的差别集中在三处：比较与交换的频度、额外空间开销、对输入分布的敏感程度。归并排序用分治换取稳定的 <span class=\"katex-inline\">N\\lg N<\/span> 代价，代价是线性额外空间；快速排序在期望意义下接近 <span class=\"katex-inline\">N\\lg N<\/span> 且原地工作，代价是最坏情形退化与对切分质量的依赖；堆排序把 <span class=\"katex-inline\">N\\lg N<\/span> 代价压进常数额外空间。三种主流路线与 §2.1 的初级算法构成一张按条件选型的对照表。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：初级排序——选择、插入、希尔（难度：基础）<\/h3>\n<p>§2.1（PDF 第 192 页起，印刷 153）先立游戏规则：待排序数组的元素实现 <code>Comparable<\/code> 接口，通过 <code>compareTo()<\/code> 比较键。选择排序每轮在未排区间找出最小键，与本轮起点交换；插入排序把当前元素向前插入左侧已排区间的正确位置；希尔排序按递减间隔 <span class=\"katex-inline\">h<\/span> 分组，组内插入排序，逐步缩小间隔到 1。选择排序交换次数少（<span class=\"katex-inline\">N-1<\/span> 次）但比较次数固定平方级；插入排序在部分有序输入上接近线性；希尔排序用间隔序列突破平方级瓶颈。<\/p>\n<h3>2. 概念 2：归并排序——分治与合并（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。§2.2（PDF 第 209 页起，印刷 170）把数组递归切成两半分别排序，再线性归并成一个有序数组。自顶向下走递归；自底向上按 1、2、4、8… 的子数组宽度逐层归并。归并操作需要一个辅助数组存放副本，因此额外空间与 <span class=\"katex-inline\">N<\/span> 成正比；归并排序是稳定排序。<\/p>\n<h3>3. 概念 3：快速排序——切分与改进（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。§2.3（PDF 第 221 页起，印刷 182）取定标定点，把数组整理成左侧不大于标定、右侧不小于标定，标定落到最终位置后递归切分两侧。改进方向包括：小子数组切回插入排序、随机打乱输入降低最坏情形概率、三向切分把等于标定的元素归为一组以对付大量重复键。<\/p>\n<h3>4. 概念 4：堆、优先队列与堆排序（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。§2.4（PDF 第 234 页起，印刷 195）优先队列支持删除最大（小）元素；堆用完全二叉树的数组表示，父结点下标 <span class=\"katex-inline\">k<\/span> 对应子结点 <span class=\"katex-inline\">2k<\/span> 与 <span class=\"katex-inline\">2k+1<\/span>。swim 向上浮、sink 向下沉维持堆序；堆排序先建堆，再反复把堆顶与堆尾交换并收缩堆大小、sink 调整。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[初级排序&lt;br/&gt;选择/插入/希尔] --&gt; B[归并排序&lt;br/&gt;稳定 N lg N, 空间 N]\nA --&gt; C[快速排序&lt;br/&gt;期望 N lg N, 原地]\nA --&gt; D[堆排序&lt;br/&gt;N lg N, 空间 1]\nB --&gt; E[§2.5 选型对照&lt;br/&gt;稳定性/分布/空间]\nC --&gt; E\nD --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这条链断在&quot;分治/切分/堆序&quot;三种组织方式之一，对应算法的代价来源就说不清；比如把归并的合并环节省掉，左右两半各自有序但整体无序，分治收益不成立。<\/p>\n<h2>推导一（递推证明）：归并排序为什么是 <span class=\"katex-inline\">N\\lg N<\/span><\/h2>\n<p>设 <span class=\"katex-inline\">T(N)<\/span> 为排序规模 <span class=\"katex-inline\">N<\/span> 所需比较与访问次数。<\/p>\n<ol><li>\n递归把数组均分成两半，两半各自排序代价为 <span class=\"katex-inline\">2T(N/2)<\/span>；合并两个有序段需要把 <span class=\"katex-inline\">N<\/span> 个元素逐个比较、复制，线性代价 <span class=\"katex-inline\">cN<\/span>。\n<\/li><li>\n递推式：<span class=\"katex-inline\">T(N)=2T(N/2)+cN<\/span>，边界 <span class=\"katex-inline\">T(1)=1<\/span>。\n<\/li><li>\n按层展开：第 0 层一个规模 <span class=\"katex-inline\">N<\/span> 的问题；第 1 层两个规模 <span class=\"katex-inline\">N/2<\/span>；第 <span class=\"katex-inline\">k<\/span> 层 <span class=\"katex-inline\">2^k<\/span> 个规模 <span class=\"katex-inline\">N/2^k<\/span>；每层的合并代价合计为 <span class=\"katex-inline\">cN<\/span>。\n<\/li><li>\n分层数：规模从 <span class=\"katex-inline\">N<\/span> 降到 1 需要 <span class=\"katex-inline\">\\lg N<\/span> 层；每层代价 <span class=\"katex-inline\">cN<\/span>，总代价 <span class=\"katex-inline\">T(N)=cN\\lg N+O(N)<\/span>，归为线性对数级 <span class=\"katex-inline\">N\\lg N<\/span>。\n<\/li><li>\n辅助数组需要保存一份 <span class=\"katex-inline\">N<\/span> 个元素的副本，额外空间 <span class=\"katex-inline\">\\Theta(N)<\/span>；合并过程左右段按原顺序复制，相等键先取左侧，归并保持稳定。\n<\/ol>\n<p>推演依据：均分保证两层子问题规模相等；若切分不均（如快排最坏切到一侧空），递推退化为 <span class=\"katex-inline\">T(N)=T(N-1)+N<\/span>，总代价回到 <span class=\"katex-inline\">N^2<\/span>。<\/p>\n<h2>推导二（计数推演）：插入排序代价等于逆序对数目<\/h2>\n<p>逆序对指下标 <span class=\"katex-inline\">i&lt;j<\/span> 但键值 <span class=\"katex-inline\">a_i&gt;a_j<\/span> 的一对元素。<\/p>\n<ol><li>\n插入排序处理第 <span class=\"katex-inline\">i<\/span> 个元素时，向左扫描直到左侧键不大于它；每次相邻交换消除一个逆序对。\n<\/li><li>\n设数组共有 <span class=\"katex-inline\">R<\/span> 个逆序对，全部插入完成需要 <span class=\"katex-inline\">R<\/span> 次相邻交换；比较次数与逆序对位置相关，上界为 <span class=\"katex-inline\">O(N+R)<\/span>。\n<\/li><li>\n最好情形（数组已有序）：<span class=\"katex-inline\">R=0<\/span>，每轮比较一次即停，比较 <span class=\"katex-inline\">N-1<\/span> 次；最坏情形（数组完全逆序）：<span class=\"katex-inline\">R=N(N-1)/2<\/span>，代价归为平方级 <span class=\"katex-inline\">N^2<\/span>。\n<\/li><li>\n对照选择排序：每轮都要扫描整个未排区间找最小值，比较次数固定为 <span class=\"katex-inline\">N(N-1)/2<\/span>，与输入是否有序无关。\n<\/ol>\n<p>推演依据：相邻交换每次只改变一对元素的相对次序；逆序对数目决定交换总量，输入的部分有序程度直接反映在 <span class=\"katex-inline\">R<\/span> 上。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉稳定要求<\/strong>：若排序不要求相等键保持原序，多级排序（先按次键排、再按主键排）的第二次排序可能把第一次排好的次键次序打乱；例如按学号排好的班级再按班级排序，不稳定算法会让同班同学学号次序随机化。\n<\/li><li>\n<strong>归并排序不许用额外空间<\/strong>：原地归并需要在原数组内挪动两段元素，实现复杂且常数代价上升；书里的标准归并靠辅助数组把合并写成线性扫描，省掉辅助空间就要接受更重的移动代价。\n<\/li><li>\n<strong>快速排序永远取左端元素作标定<\/strong>：输入已经有序（或逆序）时，标定始终落在端点，切分一侧为空，递推退化为 <span class=\"katex-inline\">T(N)=T(N-1)+N<\/span>，总比较次数平方级。随机打乱或随机选标定正是为了打掉这种最坏输入路径。\n<\/li><li>\n<strong>堆排序放松堆序约束<\/strong>：若父结点可以小于子结点，堆顶不再保证是最大键，&quot;删除最大元素&quot;无从实现；swim/sink 调整失去判断方向，优先队列的 API 语义落空。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：归并像把两摞已理好顺序的牌逐张并成一摞；插入排序像摸牌时把新牌插到手中牌的正确位置；堆像按职级排队的花名册，上级在上级名下，弹出名单第一项就是当前职级最高者。\n<\/li><li>\n实例：<span class=\"katex-inline\">N=8<\/span> 的归并排序，分层归并宽度为 1→2→4→8，共 <span class=\"katex-inline\">\\lg 8=3<\/span> 层，每层合并 8 个元素，比较访问合计约 <span class=\"katex-inline\">8\\times3=24<\/span> 次量级。\n<\/li><li>\n实例：<span class=\"katex-inline\">N=4<\/span> 完全逆序数组 <span class=\"katex-inline\">\\{4,3,2,1\\}<\/span> 的逆序对为 <span class=\"katex-inline\">(4,3),(4,2),(4,1),(3,2),(3,1),(2,1)<\/span> 共 6 个，插入排序交换 6 次；选择排序比较 <span class=\"katex-inline\">3+2+1=6<\/span> 次、交换 3 次。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解 1：快排比归并&quot;快&quot;，所以快排永远是首选。<\/strong> 为什么错：快排期望 <span class=\"katex-inline\">N\\lg N<\/span> 且常数小、原地工作，但最坏情形平方级，且不稳定；归并稳定、最坏保证 <span class=\"katex-inline\">N\\lg N<\/span>，代价是线性空间。选型要看稳定性要求、空间预算与输入重复键比例。\n<\/li><li>\n<strong>误解 2：希尔排序就是多次插入排序，没有本质改进。<\/strong> 为什么错：分组插入先消除远距离逆序对，使数组在间隔缩小后接近有序；希尔排序突破插入排序&quot;逆序对逐个相邻交换&quot;的瓶颈，代价量级低于平方级。\n<\/li><li>\n<strong>误解 3：堆排序的堆是链表结构。<\/strong> 为什么错：书里标准堆用数组表示完全二叉树，靠下标 <span class=\"katex-inline\">2k<\/span>、<span class=\"katex-inline\">2k+1<\/span> 定位子结点；链表实现需要额外指针字段，且无法按下标直接跳转。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n归并排序的递推式 <span class=\"katex-inline\">T(N)=2T(N/2)+cN<\/span> 展开后是哪一级代价？额外空间量级是多少？\n<\/li><li>\n插入排序的交换次数由哪个量决定？完全有序与完全逆序两种输入各落在什么量级？\n<\/li><li>\n三向切分针对的是什么输入问题？普通二向切分在大量重复键时会退化到哪一步？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n归并：分治 + 线性合并，<span class=\"katex-inline\">N\\lg N<\/span> 最坏保证、空间 <span class=\"katex-inline\">N<\/span>、稳定。\n<\/li><li>\n快排：切分落位 + 递归两侧，期望 <span class=\"katex-inline\">N\\lg N<\/span>、原地工作，最坏 <span class=\"katex-inline\">N^2<\/span>，随机化与三向切分是针对性改进。\n<\/li><li>\n堆：完全二叉树数组表示，swim/sink 维护堆序，堆排序 <span class=\"katex-inline\">N\\lg N<\/span>、常数空间。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章接住 ch01 的复杂度语言：每个排序算法都要给出最坏/期望量级与空间代价。排序中的&quot;按键有序&quot;是第 3 章符号表的前置——二分查找只在有序数组上成立；堆结构在第 3 章优先队列式符号表、第 4 章 Prim/Dijkstra 的优先队列中直接复用。排序算法对输入分布敏感的教训，也延续到查找树：平衡化机制正是为了避免简单 BST 退化成链表。<\/p>", "ch03": "<div class=\"source-badge\">📖 出处：算法 第四版 Algorithms (4th Edition).pdf · p.266<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：排序（初级排序、归并排序、快速排序、优先队列与堆排序）<\/a><\/span><\/div><h1>第 3 章：查找（符号表、二叉查找树、红黑树、散列表）<\/h1>\n<blockquote>对应原书第 3 章（印刷页 227–328，PDF 第 266–367 页；偏移 k=39）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n列出符号表 API 与有序符号表 API 的方法，区分插入、查找、删除、排名、选择、范围查询各操作；\n<\/li><li>\n走通无序链表顺序查找与有序数组二分查找，说明各自代价与局限；\n<\/li><li>\n描述二叉查找树的键序性质，推导最好、最坏与随机情形下的树高与操作代价；\n<\/li><li>\n解释 2-3 查找树到红黑树的映射，说出红黑树的平衡不变量及其对树高的约束；\n<\/li><li>\n讲清散列函数的职责、拉链法与线性探测两种冲突处理，说明均匀散列假设与装填因子对平均查找长度的影响。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>查找结构的取舍是&quot;键序信息保留多少&quot;与&quot;单次访问代价压到多少&quot;之间的平衡：有序数组二分查找快但插入贵；二叉查找树保留键序但高度依赖输入形态；红黑树用平衡不变量把树高锁住；散列表放弃键序换取趋近常数的查找。符号表 API 在所有实现之上保持同一层，选型由是否需要有序操作、键分布与空间预算决定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：符号表与两种朴素实现（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。§3.1（PDF 第 267 页起，印刷 228）先定义符号表：键值对容器，核心操作 <code>put(key,val)<\/code>、<code>get(key)<\/code>、<code>delete(key)<\/code>；有序符号表额外支持 <code>rank<\/code>（键的排名）、<code>select<\/code>（第 k 小）、<code>min/max<\/code>、范围查询。朴素实现：无序链表顺序查找，每次 get 沿链表逐键比较；有序数组配合二分查找，查找对数级但插入要挪动元素。<\/p>\n<h3>2. 概念 2：二叉查找树（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。§3.2（PDF 第 289 页起，印刷 250）BST 是一棵二叉树，任一结点的键大于左子树全部键、小于右子树全部键。查找、插入沿一条根到叶的路径比较；中序遍历按键升序输出。删除分三种情况：无子结点直接删、单子结点用子树顶替、双子结点用右子树最小结点顶替。树高决定单次操作代价，而树高由插入顺序决定。<\/p>\n<h3>3. 概念 3：红黑树与平衡不变量（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。§3.3（PDF 第 308 页起，印刷 269）先讲 2-3 查找树：2-结点存一键、3-结点存两键，插入时分裂结点保证树高平衡；红黑树把 3-结点拆成一条红链挂在二叉树里，用结点颜色与旋转、颜色翻转维持不变量：红结点不能连续出现，根到任意叶的黑色结点数相同。这些不变量把树高限制在 <span class=\"katex-inline\">2\\lg N<\/span> 以内，查找/插入/删除均为对数级。<\/p>\n<h3>4. 概念 4：散列表与冲突处理（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。§3.4（PDF 第 332 页起，印刷 293）散列分两步：散列函数把键转成数组索引，再处理碰撞。拉链法每个索引挂一条链表；线性探测法在同一索引向后找第一个空位。散列函数要把键均匀铺到索引区间；装填因子 α（元素数/表长）升高时探测链变长，需要调整数组大小再散列。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[符号表 API&lt;br/&gt;插入/查找/删除/有序操作] --&gt; B[链表顺序查找&lt;br/&gt;O N]\nA --&gt; C[有序数组二分&lt;br/&gt;查找 lg N, 插入 N]\nA --&gt; D[二叉查找树&lt;br/&gt;代价随树高]\nD --&gt; E[红黑树&lt;br/&gt;平衡不变量锁树高]\nA --&gt; F[散列表&lt;br/&gt;均匀散列 + 冲突处理]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：链条断在&quot;键序性质&quot;这一步，BST 与红黑树的遍历、排名操作就失去依据；断在&quot;均匀散列假设&quot;，散列表的常数级平均代价只是纸面结论，实际会退化成链表扫描。<\/p>\n<h2>推导一（高度分析）：BST 最好、最坏与随机情形的代价<\/h2>\n<p>设树有 <span class=\"katex-inline\">N<\/span> 个结点，单次查找/插入沿根到叶一条路径，代价等于路径上的比较次数。<\/p>\n<ol><li>\n最好情形：树完全平衡，高度 <span class=\"katex-inline\">\\lfloor \\lg N\\rfloor<\/span>，单次操作 <span class=\"katex-inline\">O(\\lg N)<\/span>。\n<\/li><li>\n最坏情形：插入序列本身单调有序，每个新键都挂在右（左）子结点，树退化成链表，高度 <span class=\"katex-inline\">N-1<\/span>，单次操作 <span class=\"katex-inline\">O(N)<\/span>。\n<\/li><li>\n随机插入情形：按随机顺序把 <span class=\"katex-inline\">N<\/span> 个等概率键插入 BST，树的平均期望高度为 <span class=\"katex-inline\">2\\ln N<\/span> 量级（书中给出的概率分析结论），单次查找期望代价 <span class=\"katex-inline\">O(\\lg N)<\/span>；平均成功查找代价约 <span class=\"katex-inline\">2\\ln N<\/span>，失败查找略高。\n<\/li><li>\n推导依据：路径长度由结点在树中的位置决定，树高又由插入顺序决定；有序输入给出最坏路径，随机输入把形状摊平。\n<\/ol>\n<h2>推导二（平均查找长度推演）：均匀散列下的拉链法<\/h2>\n<p>设表长 <span class=\"katex-inline\">M<\/span>、键数 <span class=\"katex-inline\">N<\/span>，装填因子 <span class=\"katex-inline\">\\alpha=N/M<\/span>；在均匀散列假设下，每个键落到各索引的概率相等。<\/p>\n<ol><li>\n拉链法第 <span class=\"katex-inline\">i<\/span> 条链表长度期望为 <span class=\"katex-inline\">\\alpha<\/span>。查找命中时要遍历到目标结点，平均比较次数 <span class=\"katex-inline\">1+\\alpha<\/span> 量级；未命中时遍历整条链表，平均长度 <span class=\"katex-inline\">\\alpha<\/span>。\n<\/li><li>\n链表为空的索引占比期望为 <span class=\"katex-inline\">(1-1/M)^N\\approx e^{-\\alpha}<\/span>；<span class=\"katex-inline\">\\alpha<\/span> 固定时表长与键数同比增长，平均长度不变。\n<\/li><li>\n线性探测法：碰撞后顺序向后探测，聚集现象使平均探测长度高于拉链法；装填因子通常控制在 <span class=\"katex-inline\">1/2<\/span>（拉链）或 <span class=\"katex-inline\">2/3<\/span>（线性探测）以下，超界后扩容重散列。\n<\/li><li>\n推演依据：均匀假设把&quot;落位&quot;看成独立等概率抽样；若散列函数把同类键聚到少数索引，链表长度分布偏离期望，上述平均长度不再成立。\n<\/ol>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉 BST 的平衡约束<\/strong>：普通 BST 不限制左右子树高度差，有序插入直接退化成链表，查找从对数级变平方级总量；红黑树的旋转与颜色翻转正是把这种退化路径截断。\n<\/li><li>\n<strong>放松红黑树黑高一致<\/strong>：若允许不同根叶路径黑结点数不同，某些路径可以长出很长的红链，树高失去上界，对数级保证落空；红结点连续出现也会让一条路径比其他路径多出一倍结点。\n<\/li><li>\n<strong>散列函数不均匀<\/strong>：若同类键映射到同一小段索引，对应链表/探测段聚集，其余索引空闲；均匀假设破裂，平均查找长度从 <span class=\"katex-inline\">1+\\alpha<\/span> 升到接近 <span class=\"katex-inline\">N<\/span>。\n<\/li><li>\n<strong>散列表不做扩容<\/strong>：键数增加而表长固定，α 趋向很大，探测链持续变长；插入与查找都退化成在长链上扫描，常数级优势消失。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：符号表像词典，API 是查词、加词条、删词条的动作；有序操作像按页码查第几页的词、查某个字母区间的词条；散列表像按手机号末几位分配储物柜，两人分到同一柜位就走柜内排队。\n<\/li><li>\n实例：<span class=\"katex-inline\">N=7<\/span> 的 BST，按序插入 1,2,3,4,5,6,7 得到右斜链，查找 7 需要 7 次比较；平衡形状下高度为 3，查找最多 3 次。\n<\/li><li>\n实例：拉链法 <span class=\"katex-inline\">M=10<\/span>、<span class=\"katex-inline\">N=20<\/span>，α=2，命中平均比较约 3 次量级；若散列失败使 18 个键落到 2 条链上，单链长度 9，查找该链上的键要 9 次上下。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解 1：散列表查找也是 <span class=\"katex-inline\">O(\\lg N)<\/span>。<\/strong> 为什么错：均匀散列假设下拉链法平均查找 <span class=\"katex-inline\">1+\\alpha<\/span>，α 固定时为常数级；<span class=\"katex-inline\">\\lg N<\/span> 是比较结构（BST、红黑树）的代价来源。散列表的常数代价依赖散列质量与装填因子，不是无条件成立。\n<\/li><li>\n<strong>误解 2：红黑树就是一棵普通二叉树加颜色标记。<\/strong> 为什么错：颜色只是表示层，真正约束是旋转、颜色翻转维护的两条不变量；没有不变量支撑，颜色不提供任何平衡保证。\n<\/li><li>\n<strong>误解 3：有序数组二分查找可以代替 BST。<\/strong> 为什么错：二分查找 <span class=\"katex-inline\">O(\\lg N)<\/span> 但插入要挪动 <span class=\"katex-inline\">O(N)<\/span> 个元素；插入频繁的场景，有序数组总量代价是平方级，BST/红黑树的动态插入优势才显现。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n普通 BST 的单次操作代价由哪个量决定？有序插入序列为什么会给出最坏情形？\n<\/li><li>\n红黑树哪两条不变量把树高限制在 <span class=\"katex-inline\">2\\lg N<\/span> 以内？放松其中一条会出现什么结构？\n<\/li><li>\n拉链法平均查找长度与装填因子 α 的关系是什么？均匀散列假设破裂后这个关系为什么不再成立？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n符号表是统一 API 层：无序链表、有序数组、BST、红黑树、散列表是不同实现路线。\n<\/li><li>\nBST 键序性质支撑中序遍历与排名操作；树高由插入顺序决定，最坏可退化链表。\n<\/li><li>\n红黑树把 2-3 树映射为带色二叉树，不变量锁住树高；散列表靠均匀散列与冲突处理换常数级查找，放弃键序。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章接住 ch02 的排序成果：有序数组的二分查找以数组有序为前提；BST 的键序性质与排序中的 <code>compareTo<\/code> 同源。查找结构中的优先队列（堆实现）直接进入第 4 章图算法：Prim 与 Dijkstra 用优先队列取出当前最小边权/最短距离顶点。散列表的均匀抽样视角，也为概率分析在算法设计中的使用提供了范例。<\/p>", "ch04": "<div class=\"source-badge\">📖 出处：算法 第四版 Algorithms (4th Edition).pdf · p.368<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：查找（符号表、二叉查找树、红黑树、散列表）<\/a><\/span><\/div><h1>第 4 章：图（无向图/有向图、DFS/BFS、最小生成树、最短路径）<\/h1>\n<blockquote>对应原书第 4 章（印刷页 329–450，PDF 第 368–489 页；偏移 k=39）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n说清图的术语（顶点、边、邻接、度、路径、环、连通、无向/有向、加权），读懂邻接表图数据类型；\n<\/li><li>\n走通深度优先搜索与广度优先搜索，区分两者的扩展顺序与适用问题；\n<\/li><li>\n用 DFS 求连通分量，用 BFS 求起点到各顶点的最少边数路径；\n<\/li><li>\n讲透切分定理，说明 Prim 与 Kruskal 怎样各自选出最小生成树的边；\n<\/li><li>\n写出 Dijkstra 算法流程，指出其边权非负前提，区分无环加权有向图与一般图的最短路径算法。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>图算法分两类问题：一类是&quot;可达性与结构&quot;，用 DFS/BFS 沿邻接表扩展，回答是否连通、路径长短、分量划分；另一类是&quot;带权优化&quot;，在边权上做贪心选择——MST 用切分定理挑最小横切边，最短路径在非负权下按距离递增确定顶点。两类问题的共同底座是图表示：邻接表把&quot;顶点能走到谁&quot;保存成表序列。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：图的表示与搜索（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。§4.1（PDF 第 370 页起，印刷 331）先立术语：无向图边没有方向，有向图边带方向；路径是边的序列，环是首尾相同的路径；连通指两顶点间存在路径。图数据类型用邻接表：每个顶点挂一个链表（或背包）保存相邻顶点。DFS 沿一条分支走到尽头再回退；BFS 用队列按距离起点的层数逐层扩展。§4.2 转到有向图：可达性、环与 DAG、强连通分量。<\/p>\n<h3>2. 概念 2：连通分量与路径查询（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。一次 DFS 遍历能标记起点所在连通分量的全部顶点；对未标记顶点反复发起搜索，即可划分全图连通分量。BFS 从起点逐层扩展，记录前驱顶点，回溯前驱即可得到边数最少的路径。符号图把字符串顶点名映射为整数索引，用于文件名、地名等用例。<\/p>\n<h3>3. 概念 3：最小生成树（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。§4.3（PDF 第 429 页起，印刷 390）连通加权无向图的生成树包含全部顶点且无环，最小生成树（MST）边权之和最小。切分定理：把顶点分成两组，跨越两组的横切边中权最小的一条，必属于某棵 MST。Prim 从一个顶点出发，维护连接树内外的横切边，反复取最小者加入；Kruskal 把边按权升序排序，逐条加入不构成环的边，并用 union-find 判断环。<\/p>\n<h3>4. 概念 4：最短路径（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。§4.4（PDF 第 451 页起，印刷 412）加权有向图中，最短路径指路径权重之和最小。最短路径性质：最短路径上的子路径仍是最短路径。Dijkstra 在边权非负前提下，按当前最短距离递增取出顶点并松弛其出边；无环加权有向图可按拓扑顺序松弛；存在负权边时需要 Bellman-Ford 方向的一般算法，Dijkstra 的非负前提不再满足。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[邻接表图表示] --&gt; B[DFS&lt;br/&gt;分支深入/回退]\nA --&gt; C[BFS&lt;br/&gt;层序/队列]\nB --&gt; D[连通分量/环/可达性]\nC --&gt; D\nD --&gt; E[MST: 切分定理&lt;br/&gt;Prim / Kruskal]\nD --&gt; F[最短路径&lt;br/&gt;Dijkstra / 拓扑松弛]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：链条断在邻接表表示，DFS/BFS 无从遍历；断在切分定理，Prim/Kruskal 的贪心选择失去依据；断在非负权前提，Dijkstra 的距离确定步骤会被负权边推翻。<\/p>\n<h2>推导一（证明推演）：BFS 给出的路径边数最少<\/h2>\n<p>记起点为 <span class=\"katex-inline\">s<\/span>，<span class=\"katex-inline\">d(v)<\/span> 为 BFS 得到的 <span class=\"katex-inline\">s<\/span> 到 <span class=\"katex-inline\">v<\/span> 的路径边数。<\/p>\n<ol><li>\nBFS 用队列保存待扩展顶点：起点入队，出队时把未访问邻接点入队。队列中顶点按入队先后排列，层序保证先入队的顶点与 <span class=\"katex-inline\">s<\/span> 距离不大于后入队者。\n<\/li><li>\n归纳证明：出队时顶点 <span class=\"katex-inline\">u<\/span> 的 <span class=\"katex-inline\">d(u)<\/span> 等于 <span class=\"katex-inline\">s<\/span> 到 <span class=\"katex-inline\">u<\/span> 的最少边数。起点 <span class=\"katex-inline\">d(s)=0<\/span> 成立；设队首 <span class=\"katex-inline\">u<\/span> 的距离已确定，其邻接点 <span class=\"katex-inline\">v<\/span> 首次被发现，经 <span class=\"katex-inline\">u<\/span> 到 <span class=\"katex-inline\">v<\/span> 的路径长 <span class=\"katex-inline\">d(u)+1<\/span>。\n<\/li><li>\n若存在更短路径到 <span class=\"katex-inline\">v<\/span>，该路径末端一段来自某个距离 <span class=\"katex-inline\">\\le d(u)<\/span> 的顶点；按层序该顶点应已先于 <span class=\"katex-inline\">u<\/span> 处理并发现 <span class=\"katex-inline\">v<\/span>，与 <span class=\"katex-inline\">v<\/span> 此刻首次被发现矛盾。故 <span class=\"katex-inline\">d(v)=d(u)+1<\/span> 即最少边数。\n<\/li><li>\n依据：队列的层序性使距离非递减；若用栈代替队列（DFS），路径先求深入分支，不能保证边数最少。\n<\/ol>\n<h2>推导二（正确性证明）：Prim 贪心选择的切分依据<\/h2>\n<p>切分：把顶点集 <span class=\"katex-inline\">V<\/span> 任意分成非空两组 <span class=\"katex-inline\">A<\/span>、<span class=\"katex-inline\">B<\/span>，两端分别在 <span class=\"katex-inline\">A<\/span>、<span class=\"katex-inline\">B<\/span> 的边称横切边。<\/p>\n<ol><li>\n设 <span class=\"katex-inline\">e<\/span> 是权最小的横切边，权 <span class=\"katex-inline\">w(e)<\/span>。反证：若某棵 MST <span class=\"katex-inline\">T<\/span> 不含 <span class=\"katex-inline\">e<\/span>，把 <span class=\"katex-inline\">e<\/span> 加入 <span class=\"katex-inline\">T<\/span> 形成唯一环；环上必有另一条横切边 <span class=\"katex-inline\">e&#x27;<\/span>。\n<\/li><li>\n从 <span class=\"katex-inline\">T+e<\/span> 的环中去掉 <span class=\"katex-inline\">e&#x27;<\/span>，得到另一棵生成树 <span class=\"katex-inline\">T&#x27;<\/span>。因为 <span class=\"katex-inline\">e<\/span> 是最小横切边，<span class=\"katex-inline\">w(e)\\le w(e&#x27;)<\/span>，所以 <span class=\"katex-inline\">w(T&#x27;)=w(T)+w(e)-w(e&#x27;)\\le w(T)<\/span>。\n<\/li><li>\n若原 <span class=\"katex-inline\">T<\/span> 是 MST，则 <span class=\"katex-inline\">T&#x27;<\/span> 也是 MST；即存在一棵 MST 包含 <span class=\"katex-inline\">e<\/span>。这说明每次取最小横切边加入生成树，不会堵死最优解。\n<\/li><li>\nPrim 维护的&quot;树内顶点集&quot;与&quot;树外顶点集&quot;正是一个切分；反复取最小横切边，等价于按切分定理逐步扩充一棵 MST。Kruskal 加入不构成环的边，同样不违反切分约束。\n<\/ol>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>搜索不标记已访问顶点<\/strong>：DFS/BFS 遇到已访问顶点不跳过，环上会反复递归同一批顶点，递归不收敛、队列不排空；marked 数组把每个顶点的访问状态钉住，是遍历终止的前提。\n<\/li><li>\n<strong>Dijkstra 允许负权边<\/strong>：取出顶点时认定其最短距离已定；若存在负权边，后续松弛可能把已取出顶点的距离再压小，&quot;已定&quot;结论被推翻。书中在一般加权有向图一节改用支持负权的松弛算法。\n<\/li><li>\n<strong>MST 边权允许任意环判断缺失<\/strong>：Kruskal 若不检查加入边是否构成环，加入的边会在树中形成回路，不再是生成树；union-find 的同组判断正是环检测环节。\n<\/li><li>\n<strong>邻接表换成邻接矩阵<\/strong>：稠密图矩阵查询邻接点要扫整行；稀疏图上空间与遍历代价都被 <span class=\"katex-inline\">V^2<\/span> 拖住。表示方式按图稠密程度选，不是越通用越好。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：DFS 像沿走廊逐个房间走到底，走到死路退回岔路口；BFS 像水波从起点一圈圈扩散；MST 像用最少的光缆把所有站点连成一个网；最短路径像导航按里程（而非过路费）找最短路线。\n<\/li><li>\n实例：<span class=\"katex-inline\">V=6<\/span>、边权取常见小值的无向图上，Prim 从顶点 0 起，每轮在连接已选顶点与未选顶点的边中挑最小者；Kruskal 把全部边排序后逐条试加，成环则跳过。\n<\/li><li>\n实例：BFS 在三角形网格状图上，同一层顶点距离相同；DFS 一条路径可能绕远，证明一中的归纳步骤说明这是队列层序带来的差别。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解 1：DFS 与 BFS 只是代码写法不同，结果等价。<\/strong> 为什么错：扩展顺序决定回答的问题。DFS 适合连通分量、环检测、拓扑排序；BFS 保证最少边数路径。用 DFS 找最短路径会得到一条深入分支上的路径，边数未必最少。\n<\/li><li>\n<strong>误解 2：MST 就是最短路径树。<\/strong> 为什么错：MST 优化的是全图边权总和，不保证起点到某顶点的路径最短；最短路径树优化的是起点到各顶点距离。两者目标函数不同，Prim/Dijkstra 流程相似但结论不可互替。\n<\/li><li>\n<strong>误解 3：Dijkstra 可以处理带负权边的图。<\/strong> 为什么错：算法依赖&quot;距离一旦取出不再变小&quot;；负权边使后续松弛能压低已确定距离，取出顺序不再安全。负权场景需要按拓扑松弛或 Bellman-Ford 方向的算法。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\nBFS 为什么能给出起点到各顶点的最少边数路径？证明中哪一步用到队列层序性？\n<\/li><li>\n切分定理怎样支撑 Prim 每次取最小横切边？反证步骤中去掉另一条横切边后树的权值如何变化？\n<\/li><li>\nDijkstra 的非负权前提去掉后，&quot;取出顶点即确定最短距离&quot;这一步为什么失效？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n邻接表是图遍历的底座；DFS 深入回退，BFS 层序扩展，marked 数组保证终止。\n<\/li><li>\n切分定理：最小横切边必属某棵 MST；Prim 从顶点扩切分，Kruskal 按边权加边并环检测。\n<\/li><li>\nDijkstra 在非负权下按距离递增确定顶点；最短路径的子路径仍是最短路径；负权场景换算法。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章把 ch03 的优先队列用于图算法：Prim 的横切边最小值、Dijkstra 的距离最小值都由优先队列取出；union-find（ch01）在 Kruskal 中承担环检测。图的可达性与连通性是后续网络分析、调度、约束求解等问题的入口；本章的贪心论证方式（切分定理、距离松弛）也是后续优化类算法的通用骨架。<\/p>", "c01": "<div class=\"source-badge\">📖 出处：算法 第四版 Algorithms (4th Edition).pdf · p.147<\/div><h1>增长数量级与算法分析的数学模型<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书 §1.4 算法分析，PDF 第 147 页，印刷 108）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>增长数量级是用一个函数类别（对数级 <span class=\"katex-inline\">\\lg N<\/span>、线性级 <span class=\"katex-inline\">N<\/span>、线性对数级 <span class=\"katex-inline\">N\\lg N<\/span>、平方级 <span class=\"katex-inline\">N^2<\/span>、立方级 <span class=\"katex-inline\">N^3<\/span>、指数级 <span class=\"katex-inline\">2^N<\/span>）刻画算法运行时间或空间随输入规模 <span class=\"katex-inline\">N<\/span> 变化趋势的分析口径；数学模型通过统计程序中各语句的执行频度，求和后保留主导项，把程序归入对应类别。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>不用这套语言，算法代价只能靠单次测量判断，而单次测量回答不了&quot;输入变大十倍，程序慢多少&quot;。具体失败场景有三类。<\/p>\n<p>第一类是选型被小样本误导。两个处理名单的程序，程序 A 在 <span class=\"katex-inline\">N=100<\/span> 的样本上快 0.1 秒，程序 B 内部循环更少但常数开销略大；若只测这一组数据，会选 A。把规模加到 <span class=\"katex-inline\">N=10\\,000<\/span>，A 的平方级曲线压过 B 的线性级曲线，结论反转。没有数量级模型，选型依据只是某台机器上某组数据的偶然表现。<\/p>\n<p>第二类是内部代价来源不清。一段嵌套循环程序，外层、中层、内层各执行多少次，哪一层决定总访问次数，凭读代码的感觉判断容易出错；统计频度求和之后，主导项才浮出来。<\/p>\n<p>第三类是实验与预测脱节。科学方法的流程是提出假设、观测数据、拟合模型、预测更大规模。倍率实验把输入规模逐次加倍，观察运行时间的比值；若没有&quot;代价属于哪一级&quot;的语言，实验数据只是一串秒数，无法外推到更大规模。增长数量级正是模型与实验之间的公共语言：模型给出类别，实验验证类别是否吻合。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>输入规模 <span class=\"katex-inline\">N<\/span><\/strong>：衡量问题大小的参数。对数组程序，<span class=\"katex-inline\">N<\/span> 通常是元素个数；对网络程序，<span class=\"katex-inline\">N<\/span> 可以是顶点数；对字符串程序，可以是字符长度。比较两个算法时，<span class=\"katex-inline\">N<\/span> 的口径必须一致，否则数量级无从对照。<\/p>\n<p><strong>运行时间<\/strong>：程序执行所需的时间，受机器主频、缓存、编译器优化影响。算法分析不直接预测秒数，而是统计执行的指令访问次数（数组访问、比较、交换），把它看作时间的代理量；同一量级内常数因子由机器和实现决定。<\/p>\n<p><strong>数学模型<\/strong>：对程序每条语句标注其执行频度，再按控制结构求和。单层循环执行 <span class=\"katex-inline\">N<\/span> 次；嵌套循环执行次数由内外层上下界共同决定；方法调用的频度要展开到被调方法内部。<\/p>\n<p><strong>频度求和<\/strong>：把各语句代价按执行次数累加。例如双重循环外层 <span class=\"katex-inline\">i<\/span> 从 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">N-1<\/span>、内层 <span class=\"katex-inline\">j<\/span> 从 <span class=\"katex-inline\">i+1<\/span> 到 <span class=\"katex-inline\">N-1<\/span>，循环体总次数为 <span class=\"katex-inline\">\\sum_{i=0}^{N-1}(N-1-i)=N(N-1)/2<\/span>。<\/p>\n<p><strong>主导项<\/strong>：求和表达式中随 <span class=\"katex-inline\">N<\/span> 增长最快的项。<span class=\"katex-inline\">N(N-1)/2=\\frac{1}{2}N^2-\\frac{1}{2}N<\/span>，低阶项 <span class=\"katex-inline\">-\\frac{1}{2}N<\/span> 在 <span class=\"katex-inline\">N<\/span> 很大时相对 <span class=\"katex-inline\">N^2<\/span> 可以忽略；常数系数 <span class=\"katex-inline\">1/2<\/span> 也不改变类别。保留主导项后归入平方级。<\/p>\n<p><strong>常见类别<\/strong>（按增长速度由慢到快）：<\/p>\n<ul><li>\n对数级 <span class=\"katex-inline\">\\lg N<\/span>：每轮排除一部分输入，如二分查找；\n<\/li><li>\n线性级 <span class=\"katex-inline\">N<\/span>：对每个元素常数次操作；\n<\/li><li>\n线性对数级 <span class=\"katex-inline\">N\\lg N<\/span>：分治算法的常见代价；\n<\/li><li>\n平方级 <span class=\"katex-inline\">N^2<\/span>：两层嵌套扫描；\n<\/li><li>\n立方级 <span class=\"katex-inline\">N^3<\/span>：三层嵌套枚举；\n<\/li><li>\n指数级 <span class=\"katex-inline\">2^N<\/span>：枚举全部子集，规模稍大即不可行。\n<\/ul>\n<p><strong>渐近记号<\/strong>：书里用 <span class=\"katex-inline\">O(g(N))<\/span> 表示上界方向——存在常数 <span class=\"katex-inline\">c<\/span> 与规模阈值，使代价不超过 <span class=\"katex-inline\">c\\,g(N)<\/span>；<span class=\"katex-inline\">\\Omega<\/span> 表示下界方向；<span class=\"katex-inline\">\\Theta<\/span> 表示上下界同阶。日常说&quot;某算法是平方级&quot;，指其主导项为 <span class=\"katex-inline\">N^2<\/span>，对应 <span class=\"katex-inline\">\\Theta(N^2)<\/span> 的紧结论。<\/p>\n<p><strong>正例<\/strong>：有序数组二分查找比较次数 <span class=\"katex-inline\">\\lfloor\\lg N\\rfloor+1<\/span>，归为对数级。<strong>反例<\/strong>：把&quot;比较次数少于 <span class=\"katex-inline\">N<\/span>&quot;说成对数级是错的；线性扫描比较 <span class=\"katex-inline\">N/2<\/span> 次仍是线性级，砍掉常数系数不改变类别。<\/p>\n<h2>原理推导<\/h2>\n<p>以三重枚举的 ThreeSum 程序为例推导量级。程序枚举所有三元组 <span class=\"katex-inline\">(i,j,k)<\/span>，判断三数之和是否为零。<\/p>\n<ol><li>\n外层 <span class=\"katex-inline\">i<\/span> 取 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">N-1<\/span>；中层 <span class=\"katex-inline\">j<\/span> 取 <span class=\"katex-inline\">i+1<\/span> 到 <span class=\"katex-inline\">N-1<\/span>；内层 <span class=\"katex-inline\">k<\/span> 取 <span class=\"katex-inline\">j+1<\/span> 到 <span class=\"katex-inline\">N-1<\/span>。三元组总数为组合数 <span class=\"katex-inline\">\\binom{N}{3}=\\frac{N(N-1)(N-2)}{6}<\/span>。\n<\/li><li>\n展开分子：<span class=\"katex-inline\">N(N-1)(N-2)=N^3-3N^2+2N<\/span>，除以 6 后主导项为 <span class=\"katex-inline\">N^3/6<\/span>，低阶项随 <span class=\"katex-inline\">N<\/span> 增大相对消失。\n<\/li><li>\n每次三元组做一次加法与比较，单次代价常数，总代价主导项 <span class=\"katex-inline\">N^3/6<\/span>，归为立方级 <span class=\"katex-inline\">O(N^3)<\/span>。\n<\/li><li>\n倍率实验互证：规模从 <span class=\"katex-inline\">N<\/span> 加倍到 <span class=\"katex-inline\">2N<\/span>，立方级时间比为 <span class=\"katex-inline\">(2N)^3/N^3=8<\/span>；若实测相邻两次时间比接近 8，支持立方模型。线性级倍数 2，平方级倍数 4，线性对数级倍数略大于 2 且随 <span class=\"katex-inline\">N<\/span> 增大趋近 2。\n<\/ol>\n<p>推导依据：单次操作代价视为常数，总量由频度求和决定；求和后只保留主导项。倍率比 <span class=\"katex-inline\">2^a<\/span> 对应代价 <span class=\"katex-inline\">N^a<\/span>，这是实验数据反推类别的依据。<\/p>\n<h2>适用条件与边界<\/h2>\n<p><strong>成立条件<\/strong>：<\/p>\n<ol><li>\n每条基本操作（比较、访问、交换）耗时近似常数，不受元素类型与位置剧烈影响；\n<\/li><li>\n<span class=\"katex-inline\">N<\/span> 足够大，低阶项确实被主导项压住；\n<\/li><li>\n明确代价口径：是最坏情形、平均情形还是最好情形；\n<\/li><li>\n输入分布已交代：随机输入、有序输入、重复键输入会给出不同模型。\n<\/ol>\n<p><strong>边界与失败案例<\/strong>：<\/p>\n<ul><li>\n数量级不预测绝对秒数。线性算法常数因子可能很大（如频繁装箱、方法调用），平方算法在小 <span class=\"katex-inline\">N<\/span> 下反而更快；选型时小样本要实测，大样本看量级。\n<\/li><li>\n忽略低阶项在小规模下失真。<span class=\"katex-inline\">N=10<\/span> 时 <span class=\"katex-inline\">N^2/2<\/span> 与 <span class=\"katex-inline\">N/2<\/span> 的差距远不如 <span class=\"katex-inline\">N=10\\,000<\/span> 时悬殊。\n<\/li><li>\n最坏情形不等于平均情形。插入排序最坏平方级，部分有序输入接近线性；只引用最坏上界会高估真实代价。\n<\/li><li>\n空间分析另立口径。归并排序时间 <span class=\"katex-inline\">N\\lg N<\/span> 但额外空间 <span class=\"katex-inline\">N<\/span>，数量级结论不能替代内存评估。\n<\/li><li>\n指数级算法在 <span class=\"katex-inline\">N<\/span> 很小时可行（<span class=\"katex-inline\">N=20<\/span> 时 <span class=\"katex-inline\">2^{20}\\approx10^6<\/span>），<span class=\"katex-inline\">N<\/span> 到 40 即不可行；类别结论要结合规模范围读。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>增长数量级 vs 精确运行时间<\/strong>：数量级是类别，回答规模翻倍时代价怎么变；精确时间是某次运行的秒数，含机器与常数因子。类别用于跨算法比较，秒数用于具体部署验收。\n<\/li><li>\n<strong><span class=\"katex-inline\">O<\/span> vs <span class=\"katex-inline\">\\Theta<\/span><\/strong>：<span class=\"katex-inline\">O<\/span> 只给上界，说&quot;<span class=\"katex-inline\">O(N^2)<\/span>&quot;不排除实际为 <span class=\"katex-inline\">O(N)<\/span>；紧结论要用 <span class=\"katex-inline\">\\Theta<\/span>。书里常把&quot;平方级&quot;理解为 <span class=\"katex-inline\">\\Theta(N^2)<\/span>，引用时注意方向。\n<\/li><li>\n<strong>最坏情形 vs 平均情形<\/strong>：最坏情形给出保证上界，平均情形依赖输入分布。快速排序最坏 <span class=\"katex-inline\">N^2<\/span>、期望 <span class=\"katex-inline\">N\\lg N<\/span>，两个结论都成立，回答的问题不同。\n<\/li><li>\n<strong>时间量级 vs 空间量级<\/strong>：同一算法两个口径独立。堆排序时间 <span class=\"katex-inline\">N\\lg N<\/span>、空间 <span class=\"katex-inline\">1<\/span>；归并排序时间 <span class=\"katex-inline\">N\\lg N<\/span>、空间 <span class=\"katex-inline\">N<\/span>；只看时间会漏掉空间代价。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：Java 循环结构、数组下标访问、基本代数求和（等差求和、组合数）。后继：ch02 各排序算法的最坏/期望代价归类；ch03 BST 高度与散列平均查找长度；ch04 图遍历的 <span class=\"katex-inline\">O(V+E)<\/span> 口径。本概念把&quot;语句频度 → 求和 → 主导项 → 类别&quot;这条分析路径固定下来，后续每遇到新算法都按同一套口径走一遍。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（增长数量级与算法分析的数学模型）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：从语句频度到增长数量级的完整链路<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把&quot;某算法属于哪一级&quot;讲清楚，往回追五层：<\/p>\n<ol><li>\n<strong>基本操作的时间口径<\/strong>：一次比较、一次数组访问、一次交换耗时视为常数。这一层不成立，后面所有频度求和都没有时间含义；它是整个分析的地基。\n<\/li><li>\n<strong>语句频度标注<\/strong>：每条语句在什么条件下执行、执行多少次，由控制结构（顺序、循环、分支、调用）决定。频度标错，求和结果整体偏移。\n<\/li><li>\n<strong>循环求和<\/strong>：单层循环频度为上界减下界加一；嵌套循环把内外层频度相乘再按层求和；方法调用要展开到被调方法内部统计。\n<\/li><li>\n<strong>主导项提取<\/strong>：求和表达式按 <span class=\"katex-inline\">N<\/span> 的幂次排列，去掉低阶项与常数系数，留下增长最快的项。\n<\/li><li>\n<strong>类别归类与实验互证<\/strong>：把主导项对照 <span class=\"katex-inline\">\\lg N<\/span>、<span class=\"katex-inline\">N<\/span>、<span class=\"katex-inline\">N\\lg N<\/span>、<span class=\"katex-inline\">N^2<\/span>、<span class=\"katex-inline\">N^3<\/span>、<span class=\"katex-inline\">2^N<\/span> 表归类；倍率实验看相邻规模时间比是否与类别倍数吻合。\n<\/ol>\n<p>依赖链方向：操作常数口径 → 语句频度 → 循环求和 → 主导项 → 类别 → 实验验证。链条上任何一层跳过，结论要么无依据，要么无法和实测对上。<\/p>\n<h2>正向推导：一步步从代码走到量级<\/h2>\n<p>下面从一段具体程序出发，逐步推到增长数量级。<\/p>\n<p><strong>第 1 步：固定代价口径。<\/strong> 约定一次数组比较 <code>a[i].compareTo(a[j])<\/code>、一次赋值、一次交换都记为常数代价 <span class=\"katex-inline\">c_0<\/span>；方法调用本身不再重复计费，被调方法内部操作单独统计。<\/p>\n<p><strong>第 2 步：标注单层循环。<\/strong> 程序对数组每个元素执行一次累加：<\/p>\n<pre class=\"lang-text\"><code>for (i = 0; i &lt; N; i++)\n    total += a[i];<\/code><\/pre>\n<p>循环体执行 <span class=\"katex-inline\">N<\/span> 次，总代价 <span class=\"katex-inline\">c_0 N<\/span>，主导项 <span class=\"katex-inline\">N<\/span>，归为线性级。<\/p>\n<p><strong>第 3 步：标注双层循环。<\/strong> 程序枚举所有下标对 <span class=\"katex-inline\">(i,j)<\/span>，其中 <span class=\"katex-inline\">j&gt;i<\/span>：<\/p>\n<pre class=\"lang-text\"><code>for (i = 0; i &lt; N; i++)\n    for (j = i + 1; j &lt; N; j++)\n        if (a[i] + a[j] == 0) count++;<\/code><\/pre>\n<p>固定 <span class=\"katex-inline\">i<\/span> 时内层从 <span class=\"katex-inline\">i+1<\/span> 到 <span class=\"katex-inline\">N-1<\/span>，次数 <span class=\"katex-inline\">N-1-i<\/span>。总次数：<\/p>\n<div class=\"katex-block\">\\sum_{i=0}^{N-1}(N-1-i)=\\sum_{k=0}^{N-1}k=\\frac{N(N-1)}{2}=\\frac{1}{2}N^2-\\frac{1}{2}N<\/div>\n<p>当 <span class=\"katex-inline\">N<\/span> 增大，<span class=\"katex-inline\">N^2<\/span> 项压住 <span class=\"katex-inline\">N<\/span> 项，主导项 <span class=\"katex-inline\">\\frac{1}{2}N^2<\/span>，归为平方级。<\/p>\n<p><strong>第 4 步：标注三层循环。<\/strong> 枚举三元组 <span class=\"katex-inline\">(i,j,k)<\/span>，<span class=\"katex-inline\">i&lt;j&lt;k<\/span>：<\/p>\n<div class=\"katex-block\">\\binom{N}{3}=\\frac{N(N-1)(N-2)}{6}=\\frac{N^3-3N^2+2N}{6}<\/div>\n<p>展开后三次项系数 <span class=\"katex-inline\">1/6<\/span>，二次项、一次项为低阶，主导项 <span class=\"katex-inline\">N^3/6<\/span>，归为立方级。<\/p>\n<p><strong>第 5 步：递推结构的归类。<\/strong> 分治程序把问题拆成两个规模 <span class=\"katex-inline\">N/2<\/span> 的子问题，合并代价 <span class=\"katex-inline\">cN<\/span>，递推 <span class=\"katex-inline\">T(N)=2T(N/2)+cN<\/span>。按层展开：第 <span class=\"katex-inline\">k<\/span> 层有 <span class=\"katex-inline\">2^k<\/span> 个规模 <span class=\"katex-inline\">N/2^k<\/span> 的子问题，每层合并代价合计 <span class=\"katex-inline\">cN<\/span>；层数 <span class=\"katex-inline\">\\lg N<\/span>，总代价 <span class=\"katex-inline\">cN\\lg N+O(N)<\/span>，归为线性对数级。<\/p>\n<p><strong>第 6 步：用倍率实验校验类别。<\/strong> 规模 <span class=\"katex-inline\">N<\/span> 加倍到 <span class=\"katex-inline\">2N<\/span> 时，各类别代价倍数：线性 <span class=\"katex-inline\">2<\/span>，平方 <span class=\"katex-inline\">4<\/span>，立方 <span class=\"katex-inline\">8<\/span>，线性对数 <span class=\"katex-inline\">2\\lg(2N)/\\lg N=2(1+1/\\lg N)<\/span>，略大于 2 并随 <span class=\"katex-inline\">N<\/span> 增大趋近 2。实测比值落在哪个区间，就支持哪个类别；比值在两类之间漂移，要回头检查输入分布或统计口径。<\/p>\n<h2>数值算例一：插入排序在小数组上的逆序对计数<\/h2>\n<p>取数组 <span class=\"katex-inline\">\\{4,3,2,1\\}<\/span>，<span class=\"katex-inline\">N=4<\/span>，插入排序从左到右把当前元素插入左侧已排区间。<\/p>\n<ol><li>\n逆序对枚举：<span class=\"katex-inline\">(4,3)<\/span>、<span class=\"katex-inline\">(4,2)<\/span>、<span class=\"katex-inline\">(4,1)<\/span>、<span class=\"katex-inline\">(3,2)<\/span>、<span class=\"katex-inline\">(3,1)<\/span>、<span class=\"katex-inline\">(2,1)<\/span>，共 <span class=\"katex-inline\">R=6<\/span> 个。\n<\/li><li>\n插入过程：\n<ul>\n<li>\n处理 3：左侧 <span class=\"katex-inline\">[4]<\/span>，3 小于 4，相邻交换一次，序列 <span class=\"katex-inline\">[3,4,2,1]<\/span>；\n<\/li><li>\n处理 2：先与 4 交换，再与 3 交换，两次相邻交换，序列 <span class=\"katex-inline\">[2,3,4,1]<\/span>；\n<\/li><li>\n处理 1：依次与 4、3、2 交换，三次相邻交换，序列 <span class=\"katex-inline\">[1,2,3,4]<\/span>。\n<\/li><li>\n交换合计 <span class=\"katex-inline\">1+2+3=6<\/span> 次，等于逆序对数目 <span class=\"katex-inline\">R<\/span>。比较次数上界为 <span class=\"katex-inline\">O(N+R)=O(10)<\/span>。\n<\/li><li>\n对照有序数组 <span class=\"katex-inline\">\\{1,2,3,4\\}<\/span>：<span class=\"katex-inline\">R=0<\/span>，每个元素比较一次即停，比较 <span class=\"katex-inline\">N-1=3<\/span> 次。同一算法两种输入，代价分别落在平方级附近与线性级附近，差别由逆序对数目决定。\n<\/ul>\n<\/ol>\n<p>推广：一般数组逆序对上界 <span class=\"katex-inline\">N(N-1)/2<\/span>，最坏交换次数平方级；这个计数是 §2.1 插入排序分析的基础。<\/p>\n<h2>数值算例二：倍率实验的四组观测值<\/h2>\n<p>假设对某程序在随机输入上测得运行时间（秒）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>规模 <span class=\"katex-inline\">N<\/span><\/th><th>500<\/th><th>1000<\/th><th>2000<\/th><th>4000<\/th><\/tr><\/thead><tbody><tr><td>观测时间<\/td><td>0.048<\/td><td>0.195<\/td><td>0.790<\/td><td>3.18<\/td><\/tr><\/tbody><\/table><\/div>\n<ol><li>\n相邻倍数：<span class=\"katex-inline\">0.195/0.048\\approx4.06<\/span>，<span class=\"katex-inline\">0.790/0.195\\approx4.05<\/span>，<span class=\"katex-inline\">3.18/0.790\\approx4.03<\/span>。\n<\/li><li>\n倍数稳定在 4 附近，对应平方级 <span class=\"katex-inline\">N^2<\/span>：<span class=\"katex-inline\">(2N)^2/N^2=4<\/span>。\n<\/li><li>\n反推模型：若代价 <span class=\"katex-inline\">cN^2<\/span>，由第一行 <span class=\"katex-inline\">c=0.048/500^2=1.92\\times10^{-7}<\/span>；预测 <span class=\"katex-inline\">N=1000<\/span> 时间 <span class=\"katex-inline\">c\\cdot10^6=0.192<\/span>，实测 0.195，吻合；预测 <span class=\"katex-inline\">N=4000<\/span> 时间 <span class=\"katex-inline\">c\\cdot16\\times10^6=3.07<\/span>，实测 3.18，偏差来自低阶项与机器波动。\n<\/li><li>\n对照：若观测倍数接近 2，支持线性级；接近 8，支持立方级。倍数不收敛时，先检查输入是否每次随机生成、缓存是否污染、是否存在最坏情形偶发触发。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：把最坏上界当成平均代价。<\/strong> 某插入排序实现，分析时直接引用最坏 <span class=\"katex-inline\">N^2<\/span> 作为选型依据。实际日志显示输入接近有序，逆序对很少，程序运行接近线性。复盘：上界结论回答&quot;最多多贵&quot;，不回答&quot;通常多贵&quot;；评估平均代价必须交代输入分布，两个口径分开写。<\/p>\n<p><strong>案例 2：小样本上用常数因子否定量级。<\/strong> <span class=\"katex-inline\">N=20<\/span> 时，平方级程序 A 因为循环体简单，比线性级程序 B（含对象装箱与方法调用）快；据此把 A 定为通用方案。规模升到 <span class=\"katex-inline\">N=10^5<\/span>，A 的 <span class=\"katex-inline\">N^2<\/span> 项增长压过 B，总时长反超。复盘：小样本区间低阶项与常数因子主导，量级结论在大规模才显现；选型要同时看目标规模区间。<\/p>\n<p><strong>案例 3：混淆 <span class=\"katex-inline\">O<\/span> 与紧界。<\/strong> 写&quot;归并排序是 <span class=\"katex-inline\">O(N^2)<\/span>&quot;——上界方向上这句话不算错（<span class=\"katex-inline\">N\\lg N<\/span> 当然不超过 <span class=\"katex-inline\">N^2<\/span>），但它掩盖了真实代价 <span class=\"katex-inline\">N\\lg N<\/span>。复盘：描述算法代价优先用 <span class=\"katex-inline\">\\Theta<\/span> 给紧结论；只能给上界时注明是上界，不把上界读成实际类别。<\/p>\n<p><strong>案例 4：空间代价漏算。<\/strong> 只比较排序时间，选了归并排序；部署环境内存紧张，归并的辅助数组占 <span class=\"katex-inline\">N<\/span> 个元素空间，实际无法运行。复盘：时间量级与空间量级是两个独立口径，评估时分别统计；线性额外空间在内存受限场景可能是硬约束。<\/p>\n<h2>延伸推导：各类别增长速度的比较口径<\/h2>\n<p>归类之后还要能判断两类谁压谁。取 <span class=\"katex-inline\">N<\/span> 增大的方向比较比值：<\/p>\n<ol><li>\n<strong>对数被任何线性项压住<\/strong>：令 <span class=\"katex-inline\">N=2^k<\/span>，则 <span class=\"katex-inline\">\\lg N=k<\/span>，比值 <span class=\"katex-inline\">N/\\lg N=2^k/k<\/span>，随 <span class=\"katex-inline\">k<\/span> 增大趋向无穷；因此 <span class=\"katex-inline\">\\lg N=o(N)<\/span>，对数级慢于线性级。\n<\/li><li>\n<strong>多项式之间幂次高者胜<\/strong>：<span class=\"katex-inline\">N^b/N^a=N^{b-a}<\/span>，<span class=\"katex-inline\">b&gt;a<\/span> 时比值趋向无穷，平方压线性，立方压平方。\n<\/li><li>\n<strong>指数压过任何多项式<\/strong>：以 <span class=\"katex-inline\">2^N/N^k<\/span> 为例，<span class=\"katex-inline\">N<\/span> 增大时指数项增长快于固定幂次；这也是子集枚举类算法在 <span class=\"katex-inline\">N<\/span> 稍大后不可行的原因。\n<\/li><li>\n<strong>数值对照<\/strong>（取常见 <span class=\"katex-inline\">N<\/span>）：\n<\/ol>\n<div class=\"table-wrap\"><table><thead><tr><th>类别<\/th><th><span class=\"katex-inline\">N=10<\/span><\/th><th><span class=\"katex-inline\">N=100<\/span><\/th><th><span class=\"katex-inline\">N=1000<\/span><\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">\\lg N<\/span><\/td><td>3.32<\/td><td>6.64<\/td><td>9.97<\/td><\/tr><tr><td><span class=\"katex-inline\">N<\/span><\/td><td>10<\/td><td>100<\/td><td>1000<\/td><\/tr><tr><td><span class=\"katex-inline\">N\\lg N<\/span><\/td><td>33.2<\/td><td>664<\/td><td>9970<\/td><\/tr><tr><td><span class=\"katex-inline\">N^2<\/span><\/td><td>100<\/td><td>10 000<\/td><td><span class=\"katex-inline\">10^6<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">N^3<\/span><\/td><td>1000<\/td><td><span class=\"katex-inline\">10^6<\/span><\/td><td><span class=\"katex-inline\">10^9<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>这张表用于粗判：同一规模下相邻类别的差距随 <span class=\"katex-inline\">N<\/span> 拉大而拉开，小样本阶段各类别差距不明显。<\/p>\n<h2>算例三：含方法调用的频度展开<\/h2>\n<p>程序对每个数组元素调用一次判断方法：<\/p>\n<pre class=\"lang-text\"><code>for (i = 0; i &lt; N; i++)\n    if (smaller(a[i], a[i+1])) swaps++;<\/code><\/pre>\n<p>方法 <code>smaller(x,y)<\/code> 内部做一次 <code>compareTo<\/code> 并返回布尔值。频度统计分两步：外层调用 <span class=\"katex-inline\">N<\/span> 次；被调方法内部一次比较，不计方法入口的额外计费。总比较次数 <span class=\"katex-inline\">N<\/span>，归为线性级。若被调方法内部再含一个内层循环扫描整个数组，频度就要把该内层循环次数乘到外层上：总次数 <span class=\"katex-inline\">N\\cdot N=N^2<\/span>，类别由被调方法内部结构决定，不能只看调用处一行。<\/p>\n<p>这条规则解释了为什么分析库方法代价时要读进实现：调用处一行看不出内部循环，频度必须展开到底层操作。<\/p>\n<h2>三种代价口径怎样分别建模<\/h2>\n<p><strong>最坏情形<\/strong>：取输入集合中代价最大的输入，给出保证上界。排序算法的最坏分析回答&quot;无论数据怎么来，不会贵过多少&quot;。 <strong>平均情形<\/strong>：给输入一个概率分布（如随机排列、随机键），对所有输入代价求期望；结论依赖分布假设，分布变了期望随之变。 <strong>最好情形<\/strong>：最有利输入下的代价，通常只作参照，不作选型依据。<\/p>\n<p>以快速排序为例：切分始终把数组均分时期望 <span class=\"katex-inline\">N\\lg N<\/span>；切分始终落到端点时最坏 <span class=\"katex-inline\">N^2<\/span>；书里通过随机打乱输入把最坏情形的概率压低。三个口径对应三个结论，引用时必须写明是哪一个，避免把期望结论当成保证上界。<\/p>\n<h2>第二组归类错误复盘<\/h2>\n<p><strong>错误 1：把二分查找说成线性级。<\/strong> 判别标志是每轮排除剩余输入的固定比例，比较次数满足 <span class=\"katex-inline\">2^k\\ge N<\/span>，<span class=\"katex-inline\">k\\ge\\lg N<\/span>，属对数级；扫描一遍才是线性。两者路径结构不同：二分走跳步，扫描走相邻遍历。<\/p>\n<p><strong>错误 2：递归程序只数一层调用。<\/strong> 递归代价要把各层子问题规模与调用次数合起来统计，单层数一次会漏掉子问题总量。归并排序若只看一轮合并会误判线性级，展开分层后才是 <span class=\"katex-inline\">N\\lg N<\/span>。<\/p>\n<p><strong>错误 3：忽略对象创建与装箱开销。<\/strong> 数量级模型把基本操作视为常数，但频繁创建临时对象、自动装箱拆箱会引入不可忽略的常数，甚至改变小样本表现。量级结论不变，但实测部署前要在目标规模上补一次计时。<\/p>\n<p><strong>错误 4：用空间紧张否定时间结论。<\/strong> 归并排序时间 <span class=\"katex-inline\">N\\lg N<\/span> 与额外空间 <span class=\"katex-inline\">N<\/span> 是两条独立结论；不能因为空间大就说时间也是平方级，反之亦然。两个口径分别记录、分别约束。<\/p>\n<h2>差生通读检查<\/h2>\n<p><strong>卡点 1：看到嵌套循环就数不清内层次数。<\/strong> 补步骤：先固定外层变量 <span class=\"katex-inline\">i<\/span> 的一个取值，单独数内层跑多少次，写成关于 <span class=\"katex-inline\">i<\/span> 的表达式，再对外层求和；不要一上来就套 <span class=\"katex-inline\">N^2<\/span>。数完用小 <span class=\"katex-inline\">N<\/span>（如 <span class=\"katex-inline\">N=3<\/span>）枚举下标对核对表达式。<\/p>\n<p><strong>卡点 2：主导项与低阶项分不清。<\/strong> 补步骤：把求和结果按 <span class=\"katex-inline\">N<\/span> 的幂次从高到低排列；<span class=\"katex-inline\">N<\/span> 增大时，高次项增长更快，低次项相对占比趋近零。拿不准就代入 <span class=\"katex-inline\">N=100<\/span> 与 <span class=\"katex-inline\">N=10\\,000<\/span> 算两项比值，看哪一项在缩小。<\/p>\n<p><strong>卡点 3：倍率实验比值对不上类别表。<\/strong> 补步骤：先确认输入每次重新随机生成、没有沿用上次的缓存状态；再检查程序是否含最坏情形分支被偶发触发；再核对规模加倍是否严格 <span class=\"katex-inline\">N\\to2N<\/span>。比值漂移不收敛时，不要硬套某个类别。<\/p>\n<p><strong>卡点 4：把&quot;操作次数少&quot;误读成&quot;对数级&quot;。<\/strong> 补步骤：对数级的标志是每轮排除固定比例的剩余输入；扫描一遍只触达每个元素一次是线性级，哪怕扫描次数是 <span class=\"katex-inline\">N/2<\/span>。判别依据是代价随 <span class=\"katex-inline\">N<\/span> 的函数形状，不是直觉上的&quot;次数不多&quot;。<\/p>\n<h2>算例四：退化递推与均衡递推的对照<\/h2>\n<p>有些算法的代价由切分质量决定，用两个递推式对照。<\/p>\n<p><strong>退化路径<\/strong>：<span class=\"katex-inline\">T(N)=T(N-1)+cN<\/span>，边界 <span class=\"katex-inline\">T(1)=c<\/span>。逐步展开：<\/p>\n<div class=\"katex-block\">T(N)=cN+c(N-1)+\\cdots+c\\cdot1=c\\frac{N(N+1)}{2}<\/div>\n<p>主导项 <span class=\"katex-inline\">cN^2/2<\/span>，归为平方级。这对应快排每次切分一侧为空的最坏情形：子问题规模只减 1，每层线性扫描累加出平方总量。<\/p>\n<p><strong>均衡路径<\/strong>：<span class=\"katex-inline\">T(N)=2T(N/2)+cN<\/span>，展开为每层 <span class=\"katex-inline\">cN<\/span>、共 <span class=\"katex-inline\">\\lg N<\/span> 层，总代价 <span class=\"katex-inline\">cN\\lg N<\/span>，归为线性对数级。<\/p>\n<p>两个递推的差别只在子问题规模怎么拆：拆成均衡两半，层数对数增长；拆成只减一，层数线性增长。这个对照是第 2 章快排改进（随机选标定、三向切分）的分析基础。<\/p>\n<h2>空间占用的数量级口径<\/h2>\n<p>时间模型统计操作次数，空间模型统计存活对象占用的存储，口径相同：标注每个数据结构占多少，按规模求和。<\/p>\n<ul><li>\n数组：<span class=\"katex-inline\">N<\/span> 个元素的引用加上元素本身；辅助数组若与原数组等长，额外空间 <span class=\"katex-inline\">\\Theta(N)<\/span>。\n<\/li><li>\n链表：每个结点除元素外还要存后继引用，结点开销计入空间。\n<\/li><li>\n递归调用栈：递归深度占用栈空间，退化递推 <span class=\"katex-inline\">T(N)=T(N-1)+\\cdots<\/span> 的栈深为 <span class=\"katex-inline\">N<\/span>，均衡递推栈深为 <span class=\"katex-inline\">\\lg N<\/span>。\n<\/li><li>\n字符串与对象：头部字段、对齐填充带来固定开销，数量级分析中先记常数，小对象密集时再单独评估。\n<\/ul>\n<p>空间结论常被时间分析漏掉：归并排序时间 <span class=\"katex-inline\">N\\lg N<\/span>、空间 <span class=\"katex-inline\">N<\/span>；堆排序时间 <span class=\"katex-inline\">N\\lg N<\/span>、空间 <span class=\"katex-inline\">1<\/span>；快排期望 <span class=\"katex-inline\">N\\lg N<\/span>、栈深 <span class=\"katex-inline\">\\lg N<\/span>。选型时两个口径并列写。<\/p>\n<h2>延伸问答：数量级分析管不到什么<\/h2>\n<ul><li>\n<strong>管不到具体指令周期<\/strong>：主频、流水线、缓存命中、分支预测都会改变单次操作实际耗时；模型给类别，实测给部署数字。\n<\/li><li>\n<strong>管不到并行与分布式<\/strong>：模型默认单处理器顺序执行；多线程、分布式下通信与同步代价不在原口径内。\n<\/li><li>\n<strong>不替代输入测试<\/strong>：模型基于假设的输入分布，真实业务数据可能含长尾、重复键、有序段；上线前用代表性样本计时校验。\n<\/li><li>\n<strong>不证明算法最优<\/strong>：给出某算法的量级，不等于证明不存在更低量级的算法；下界结论需要单独的论证（如比较排序的 <span class=\"katex-inline\">\\Omega(N\\lg N)<\/span> 下界）。\n<\/ul>\n<h2>记号与口径速记<\/h2>\n<ul><li>\n<span class=\"katex-inline\">O(g(N))<\/span>：上界方向，存在常数 <span class=\"katex-inline\">c<\/span> 与阈值，代价不超过 <span class=\"katex-inline\">c\\,g(N)<\/span>；只说&quot;不更贵于&quot;。\n<\/li><li>\n<span class=\"katex-inline\">\\Omega(g(N))<\/span>：下界方向，代价不低于 <span class=\"katex-inline\">c\\,g(N)<\/span>；只说&quot;不会便宜于&quot;。\n<\/li><li>\n<span class=\"katex-inline\">\\Theta(g(N))<\/span>：上下界同阶，两侧夹出紧结论；描述算法实际类别时优先用它。\n<\/li><li>\n频度：语句执行次数；单次操作常数代价；总量 = 频度 × 单次代价。\n<\/li><li>\n主导项：求和式中增长最快的项；低阶项与常数系数在大 <span class=\"katex-inline\">N<\/span> 下不改变类别。\n<\/li><li>\n口径标签：最坏、平均、最好必须写明；时间与空间分别统计。\n<\/ul>\n<p>记这套速记的用途是读算法结论时先对口径：看到一个复杂度表达式，先问是上界还是紧界、是哪种输入情形、时间还是空间，再决定它能支撑什么选型判断。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n一段三层循环枚举下标三元组，循环体总次数是哪一类组合数？主导项系数是多少？\n<\/li><li>\n递推 <span class=\"katex-inline\">T(N)=2T(N/2)+cN<\/span> 展开后有多少层？每层合并代价是多少？总代价归入哪一级？\n<\/li><li>\n倍率实验中相邻规模时间比稳定在 4 附近，支持哪一级代价？若比值接近 2 但略大于 2，可能是哪一级？\n<\/li><li>\n为什么说数量级结论不能替代具体部署的运行时间预估？至少给出两条理由。\n<\/li><li>\n插入排序的交换次数由哪个计数决定？最坏情形与最好情形各落在什么量级？\n<\/ol><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：算法 第四版 Algorithms (4th Edition).pdf · p.175<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">增长数量级与算法分析的数学模型<\/a><\/span><\/div><h1>动态连通性与 union-find：加权 quick-union 与路径压缩<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch01（原书 §1.5 案例研究：union-find 算法，PDF 第 175 页，印刷 136）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>union-find 是维护一组对象等价类的数据结构：用父指针数组记录每个对象所属分量，支持 <code>find(p)<\/code> 判断对象所在分量、<code>connected(p,q)<\/code> 判断两对象是否同类、<code>union(p,q)<\/code> 合并两个分量；实现从 quick-find 到 quick-union，再到按大小加权并配合路径压缩，使单次操作代价趋近常数。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>动态连通性问题的输入是一列整数对 <span class=\"katex-inline\">(p,q)<\/span>，每对表示&quot;<span class=\"katex-inline\">p<\/span> 与 <span class=\"katex-inline\">q<\/span> 相连&quot;。程序要做的事：读到一对整数，若两端已在同一等价类就忽略，否则输出这对并把两个类合并。应用场景包括网络中计算机是否可达、电路触点是否导通、社交网络两人是否同组、变量名等价性、物理渗流模拟。<\/p>\n<p>不用专门结构会出两类失败。第一类是重复扫描：每来一对就遍历已有全部连接判断连通性，<span class=\"katex-inline\">M<\/span> 对连接、<span class=\"katex-inline\">N<\/span> 个对象时总量平方级，对象到百万级、连接到十亿级时不可行。第二类是等价关系维护混乱：只记录直接相连的边，判断 <span class=\"katex-inline\">p<\/span> 与 <span class=\"katex-inline\">r<\/span> 是否连通要沿边反复追溯，没有把&quot;同组&quot;这个结论固化下来。<\/p>\n<p>union-find 的目标是把等价类信息压缩进一个数组：判断同类与合并分量都在这个数组上完成，后续算法（Kruskal 最小生成树、连通分量划分）直接复用这套结构。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>等价关系三性质<\/strong>：相连关系满足自反性（<span class=\"katex-inline\">p<\/span> 与自身相连）、对称性（<span class=\"katex-inline\">p<\/span> 连 <span class=\"katex-inline\">q<\/span> 则 <span class=\"katex-inline\">q<\/span> 连 <span class=\"katex-inline\">p<\/span>）、传递性（<span class=\"katex-inline\">p<\/span> 连 <span class=\"katex-inline\">q<\/span> 且 <span class=\"katex-inline\">q<\/span> 连 <span class=\"katex-inline\">r<\/span> 则 <span class=\"katex-inline\">p<\/span> 连 <span class=\"katex-inline\">r<\/span>）。三条性质把对象划分成互不相交的等价类，类内任意两点相连，类间不相连。<\/p>\n<p><strong>父指针数组 <code>id[]<\/code><\/strong>：长度 <span class=\"katex-inline\">N<\/span>，<code>id[i]<\/code> 记录对象 <span class=\"katex-inline\">i<\/span> 的父结点。初始 <code>id[i]=i<\/code>，每个对象自成一类。数组是整套实现的唯一核心状态。<\/p>\n<p><strong>API 三件套<\/strong>：<\/p>\n<ul><li>\n<code>find(p)<\/code>：返回 <span class=\"katex-inline\">p<\/span> 所在分量的标识；\n<\/li><li>\n<code>connected(p,q)<\/code>：<code>find(p)==find(q)<\/code> 即为同类；\n<\/li><li>\n<code>union(p,q)<\/code>：若两端不同类，把两个分量合并。\n<\/ul>\n<p><strong>quick-find 规则<\/strong>：<code>id[p]<\/code> 直接存分量标识。<code>connected<\/code> 比较两个标识；<code>union<\/code> 遍历整个数组，把所有与 <span class=\"katex-inline\">p<\/span> 同类的元素标识改成 <span class=\"katex-inline\">q<\/span> 的标识。<\/p>\n<p><strong>quick-union 规则<\/strong>：沿父指针向上找根，根的父指针指向自身。<code>find<\/code> 从 <span class=\"katex-inline\">p<\/span> 出发反复取 <code>id<\/code>，直到结点等于自身；<code>union<\/code> 把 <span class=\"katex-inline\">p<\/span> 的根接到 <span class=\"katex-inline\">q<\/span> 的根下。<\/p>\n<p><strong>加权 quick-union<\/strong>：另设 <code>sz[]<\/code> 记录每个根代表的分量大小；合并时把较小树的根接到较大树的根下，大树根成为新根。树高被分量大小压住，不会长成深链。<\/p>\n<p><strong>路径压缩<\/strong>：<code>find<\/code> 沿父链上溯时，把经过的结点直接指向根（或在返回途中压平）；下次查找同一批结点时路径变短。压缩与加权配合：加权控制树高上界，压缩消除残留的长路径。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">N=10<\/span>，初始各点自成一类；<code>union(4,3)<\/code>、<code>union(3,8)<\/code> 后 4、3、8 同组。<strong>反例<\/strong>：把 <code>id[i]<\/code> 当成邻接表存所有邻居是错的，union-find 不保存边的序列，只保存分量归属。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>quick-find 的代价<\/strong>：每次 <code>union<\/code> 要扫描 <span class=\"katex-inline\">N<\/span> 个元素改标识，<span class=\"katex-inline\">M<\/span> 次合并代价 <span class=\"katex-inline\">O(MN)<\/span>；<code>connected<\/code> 只需两次访问。缺陷在合并侧：为一次合并付出全数组扫描。<\/p>\n<p><strong>quick-union 的代价<\/strong>：<code>find<\/code> 沿父链走到根，次数等于路径长度；<code>union<\/code> 两次找根加一次挂接。若不加权，插入序列可能让树退化成链，单次查找 <span class=\"katex-inline\">O(N)<\/span>，总量仍可到平方级。<\/p>\n<p><strong>加权控制树高<\/strong>：设小树规模 <span class=\"katex-inline\">s<\/span>、大树规模 <span class=\"katex-inline\">t<\/span>，<span class=\"katex-inline\">s\\le t<\/span>。把小树根挂到大树根后，小树内结点到新根的路径增加一层；由归纳可证，加权 quick-union 中任意树高不超过 <span class=\"katex-inline\">\\lg N<\/span>。依据：结点所在树大小翻倍时高度才增加一层，规模从 1 到 <span class=\"katex-inline\">N<\/span> 至多翻倍 <span class=\"katex-inline\">\\lg N<\/span> 次。<\/p>\n<p><strong>路径压缩的效果<\/strong>：一次 <code>find<\/code> 上溯经过 <span class=\"katex-inline\">h<\/span> 个结点，沿途把它们接到根；后续访问这些结点直接到根。压缩不改变分量归属，只压平路径。配合加权后，单次操作的平摊代价趋近常数（书中给出的结论：带路径压缩的加权 quick-union，平摊代价增长极慢，实际工程中近似常数级）。<\/p>\n<p><strong>连通分量判定<\/strong>：反复扫描输入对，每次 <code>connected<\/code> 为假则 <code>union<\/code>；处理完所有对后，同根对象属于同一分量。分量个数初始为 <span class=\"katex-inline\">N<\/span>，每次成功合并减一。<\/p>\n<h2>适用条件与边界<\/h2>\n<p><strong>成立条件<\/strong>：<\/p>\n<ol><li>\n对象可以编号为 <span class=\"katex-inline\">0,\\dots,N-1<\/span>，分量归属是唯一需要维护的状态；\n<\/li><li>\n查询与合并交错出现，允许在数组上原地修改；\n<\/li><li>\n只需要&quot;是否同类&quot;的结论，不需要保存具体连接路径。\n<\/ol>\n<p><strong>边界与失败案例<\/strong>：<\/p>\n<ul><li>\n不保存边序列：要还原路径或边权信息，union-find 不够，需另存图结构。\n<\/li><li>\n不加权的 quick-union 遇有序输入退化成链；树高 <span class=\"katex-inline\">N-1<\/span>，单次查找线性级。\n<\/li><li>\n只压缩不加权：单次压缩有效，但合并环节仍可能把大树挂到小树上，高树风险保留。\n<\/li><li>\n分量标识不稳定：<code>find<\/code> 返回的根会随合并变化，不能把某次查到的标识缓存成长期键值。\n<\/li><li>\n并查集不处理有向关系：它的&quot;相连&quot;是对称的，有向图的可达性要另用 DFS/BFS。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>union-find vs 图的 DFS<\/strong>：DFS 遍历邻接表保存完整图结构，能给路径、环、邻接细节；union-find 只维护分量归属，状态更轻、操作更快，但不保留边。判断&quot;两点是否同组&quot;用并查集，要&quot;怎么走过去&quot;用图遍历。\n<\/li><li>\n<strong>quick-find vs quick-union<\/strong>：find 侧 quick-find 快（一次比较），union 侧慢（扫全数组）；quick-union 把代价移到查找侧，合并只动两个根。改进方向是压缩查找路径，而不是回到全数组扫描。\n<\/li><li>\n<strong>路径压缩 vs 路径分裂/减半<\/strong>：压缩把结点直接挂根；分裂把途经结点逐一向后挂祖父结点。两者都压平路径，实现细节不同，代价量级一致。\n<\/li><li>\n<strong>union-find vs 符号表<\/strong>：符号表按键存值、支持有序范围查询；并查集按编号维护等价类，接口只有查找与合并，不提供键序操作。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的频度求和与量级归类；数组与循环的基本写法。后继：ch04 Kruskal 算法用并查集做环检测（加入边前判断两端是否同组，同组则成环）；连通分量统计在 §4.1 与本节同一问题的图视角下互证。union-find 也是&quot;朴素实现暴露缺陷 → 加权/压缩改进&quot;这条算法迭代主线的第一个完整样本。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（动态连通性与 union-find：加权 quick-union 与路径压缩）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：union-find 三代实现的代价演化与树高论证<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要讲清 union-find 为什么快、快在哪，往回追五层：<\/p>\n<ol><li>\n<strong>等价关系定义<\/strong>：自反、对称、传递三条性质把对象分成等价类；没有这套定义，&quot;同组&quot;判断没有判别标准。\n<\/li><li>\n<strong>分量标识需求<\/strong>：每个对象需要一个可比较的归属记号，<code>find<\/code> 返回记号，<code>connected<\/code> 比较记号。\n<\/li><li>\n<strong>父指针数组表示<\/strong>：用 <code>id[]<\/code> 存归属，初始各自为根；标识可以直接存数组值，也可以存父链上溯结果。\n<\/li><li>\n<strong>查找与合并规则<\/strong>：找根的路径怎么走、合并挂哪个根，决定树的形状与单次代价。\n<\/li><li>\n<strong>树高控制与路径压平<\/strong>：加权按大小挂接压住高度上界，路径压缩消除长路径残留；两条改进分别作用于合并环节与查找环节。\n<\/ol>\n<p>依赖链方向：等价关系 → 分量标识 → 数组表示 → 查找/合并规则 → 树高与压缩。链条断在第一层，后面的&quot;同组&quot;判断失去语义；断在第四层，改进方向就无从谈起。<\/p>\n<h2>正向推导：三代实现逐步推演<\/h2>\n<p><strong>第一代 quick-find<\/strong>。<\/p>\n<ol><li>\n<code>id[p]<\/code> 直接是分量标识。初始 <code>id[i]=i<\/code>。\n<\/li><li>\n<code>connected(p,q)<\/code>：返回 <code>id[p]==id[q]<\/code>，两次数组访问。\n<\/li><li>\n<code>union(p,q)<\/code>：先取标识 <code>pid=id[p]<\/code>、<code>qid=id[q]<\/code>；若不同，遍历 <span class=\"katex-inline\">i=0,\\dots,N-1<\/span>，凡 <code>id[i]==pid<\/code> 改为 <code>qid<\/code>。\n<\/li><li>\n代价：一次合并扫描整个数组，<span class=\"katex-inline\">N<\/span> 次访问；<span class=\"katex-inline\">M<\/span> 次合并总量 <span class=\"katex-inline\">O(MN)<\/span>。缺陷定位：合并侧为一次挂接付出全数组遍历，查找侧再省也补不回合并侧的平方增长。\n<\/ol>\n<p><strong>第二代 quick-union<\/strong>。<\/p>\n<ol><li>\n<code>find(p)<\/code>：循环 <code>while (p != id[p]) p=id[p]<\/code>，走到结点父指针指向自身为止；这个结点是根。\n<\/li><li>\n<code>connected(p,q)<\/code>：两个根相等即同类。\n<\/li><li>\n<code>union(p,q)<\/code>：找 <span class=\"katex-inline\">p<\/span> 的根 <span class=\"katex-inline\">rp<\/span>、<span class=\"katex-inline\">q<\/span> 的根 <span class=\"katex-inline\">rq<\/span>；不同则 <code>id[rp]=rq<\/code>，把 <span class=\"katex-inline\">rp<\/span> 挂到 <span class=\"katex-inline\">rq<\/span> 下。\n<\/li><li>\n代价：查找次数等于父链长度；合并两次找根加一次写数组。问题：挂接不加选择，输入有序时新结点一直挂成右链，树高 <span class=\"katex-inline\">N-1<\/span>，单次查找 <span class=\"katex-inline\">O(N)<\/span>。\n<\/ol>\n<p><strong>第三代加权 quick-union<\/strong>。<\/p>\n<ol><li>\n增设 <code>sz[root]<\/code>：根的分量大小，初始全 1。\n<\/li><li>\n<code>union<\/code>：取两根 <span class=\"katex-inline\">rp,rq<\/span>；若 <code>sz[rp] &lt;= sz[rq]<\/code>，把 <span class=\"katex-inline\">rp<\/span> 挂到 <span class=\"katex-inline\">rq<\/span> 下，<code>sz[rq]+=sz[rp]<\/code>；反之对调。\n<\/li><li>\n树高论证（归纳）：记结点所在树大小为 <span class=\"katex-inline\">s<\/span>、高度为 <span class=\"katex-inline\">h<\/span>。归纳命题：任意结点到根路径长度不超过 <span class=\"katex-inline\">\\lg s<\/span>。基例 <span class=\"katex-inline\">s=1<\/span>，<span class=\"katex-inline\">h=0\\le\\lg 1=0<\/span>。合并时小树挂大树，小树内结点路径加 1；新树规模 <span class=\"katex-inline\">s&#x27;=s_1+s_2\\ge2s_1<\/span>，小树结点新高度 <span class=\"katex-inline\">h_1+1\\le\\lg s_1+1=\\lg(2s_1)\\le\\lg s&#x27;<\/span>；大树结点高度不变。归纳成立，树高 <span class=\"katex-inline\">O(\\lg N)<\/span>。\n<\/li><li>\n路径压缩：<code>find<\/code> 上溯时记录途经结点，返回途中把它们的 <code>id<\/code> 直接改成根结点；二次访问这些结点一步到根。压缩不改分量归属，只改父链形状。\n<\/li><li>\n配合效果：加权保证树不高，压缩把偶尔出现的长路径当场压平；书里结论是带路径压缩的加权 quick-union 平摊代价趋近常数，工程实践中单次操作近似 <span class=\"katex-inline\">O(1)<\/span>。\n<\/ol>\n<h2>数值算例一：10 个对象的合并过程<\/h2>\n<p>取 <span class=\"katex-inline\">N=10<\/span>，初始 <code>id[i]=i<\/code>。按序列合并：<code>union(4,3)<\/code>、<code>union(3,8)<\/code>、<code>union(6,5)<\/code>、<code>union(9,4)<\/code>、<code>union(2,1)<\/code>、<code>union(5,0)<\/code>、<code>union(7,2)<\/code>、<code>union(6,1)<\/code>、<code>union(7,0)<\/code>。<\/p>\n<ol><li>\n<code>union(4,3)<\/code>：根 4、根 3，挂接后 4 的父为 3（或按加权对称挂）。\n<\/li><li>\n<code>union(3,8)<\/code>：找 3 的根 3，8 的根 8，挂接；此时 4→3→8。\n<\/li><li>\n<code>union(6,5)<\/code>：6、5 成组。\n<\/li><li>\n<code>union(9,4)<\/code>：找 4 的根 8，9 挂到 8 下；组内 4、3、8、9。\n<\/li><li>\n<code>union(2,1)<\/code>：2、1 成组。\n<\/li><li>\n<code>union(5,0)<\/code>：5、0 成组。\n<\/li><li>\n<code>union(7,2)<\/code>：7 挂到 2 的组。\n<\/li><li>\n<code>union(6,1)<\/code>：6 组（6,5,0）与 2 组（2,1,7）合并。\n<\/li><li>\n<code>union(7,0)<\/code>：7 的根在 2 组，0 的根在合并后的大组，已同根，跳过不合并。\n<\/li><li>\n结果分量：<span class=\"katex-inline\">\\{4,3,8,9\\}<\/span>、<span class=\"katex-inline\">\\{6,5,0,2,1,7\\}<\/span> 两个大组加其余未列对象；<code>connected(7,0)<\/code> 为真，<code>connected(4,5)<\/code> 为假。\n<\/ol>\n<p>每一步检查：合并前先 <code>find<\/code> 两对象根，根不同才挂；同根输入对直接忽略，这一步对应问题定义里&quot;过滤无意义整数对&quot;。<\/p>\n<h2>数值算例二：退化链与加权树的高度对照<\/h2>\n<p><strong>退化构造<\/strong>：不加权的 quick-union 按顺序 <code>union(0,1)<\/code>、<code>union(1,2)<\/code>、<code>union(2,3)<\/code>、…、<code>union(N-2,N-1)<\/code>。每次新根挂到旧根下，形成一条右链：<span class=\"katex-inline\">0\\to1\\to2\\to\\cdots\\to N-1<\/span>。<\/p>\n<ol><li>\n查找对象 0 要沿链走 <span class=\"katex-inline\">N-1<\/span> 步到根；<span class=\"katex-inline\">M<\/span> 次末端查找总量 <span class=\"katex-inline\">O(MN)<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">N=10<\/span> 时链长 9，查找 0 需 9 次上溯；<span class=\"katex-inline\">N=1000<\/span> 时需 999 次，线性增长。\n<\/ol>\n<p><strong>加权对照<\/strong>：同样 <span class=\"katex-inline\">N<\/span> 个对象，合并时始终小树挂大树。任一棵树高不超过 <span class=\"katex-inline\">\\lg N<\/span>；<span class=\"katex-inline\">N=1000<\/span> 时树高上界约 10，单次查找十次以内。两种实现处理同一批输入，差别来自合并环节的挂接选择，不来自查找代码。<\/p>\n<p><strong>压缩对照<\/strong>：不加权但开路径压缩，一次深查找后途经结点挂根；但后续合并仍可能把大树挂小树上，新增长路径。压缩治标，加权治本，两者叠加才稳住代价。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：用 quick-find 处理大规模网络。<\/strong> 每次合并扫全数组，<span class=\"katex-inline\">N=10^6<\/span>、<span class=\"katex-inline\">M=10^6<\/span> 时合并侧访问 <span class=\"katex-inline\">10^{12}<\/span> 量级，任务不可完成。复盘：合并代价是平方来源，必须把挂接动作限制在两个根之间，查找侧承担路径长度代价。<\/p>\n<p><strong>案例 2：只做路径压缩、不加权。<\/strong> 压缩后短期查找变快，但合并仍可能把大树根接到小树上，树高重新失控；长路径反复出现，压缩开销抵消收益。复盘：树高上界要在合并环节固定，压缩处理的是查找环节的残留。<\/p>\n<p><strong>案例 3：缓存分量标识当长期键。<\/strong> 某次 <code>find<\/code> 返回根 <span class=\"katex-inline\">r<\/span>，程序把 <span class=\"katex-inline\">r<\/span> 存进外部表；后续合并改变根，缓存值指向旧根，判断失真。复盘：归属记号随合并变化，需要标识时当场 <code>find<\/code>，不缓存旧根。<\/p>\n<p><strong>案例 4：把并查集当有向图可达结构。<\/strong> 用 union-find 判断 <span class=\"katex-inline\">p<\/span> 能否沿有向边到达 <span class=\"katex-inline\">q<\/span>；并查集的相连天然对称，无法表达方向，结论会漏掉方向约束。复盘：有向可达性归 DFS/BFS，union-find 只管无向等价类。<\/p>\n<p><strong>案例 5：合并前不查同根。<\/strong> 直接挂接两根，即使两端已同组也再写一次数组；重复挂接可能制造环或多余分支。复盘：<code>union<\/code> 第一步必须比较两 find 结果，同根跳过。<\/p>\n<h2>差生通读检查<\/h2>\n<p><strong>卡点 1：分不清 <code>id[i]<\/code> 存的是邻居还是父结点。<\/strong> 补步骤：union-find 不存边表，<code>id[i]<\/code> 是父指针；找根是沿父指针上溯，不是遍历所有邻居。画树时把每个结点画成圆圈，箭头指向父结点，根的箭头自指。<\/p>\n<p><strong>卡点 2：加权比较的是树高还是分量大小。<\/strong> 补步骤：<code>sz[]<\/code> 存分量大小（结点数），比较的是大小；挂接目标是大树根。高树挂矮树不是加权规则，规则是小树挂大树。<\/p>\n<p><strong>卡点 3：路径压缩改了什么、没改什么。<\/strong> 补步骤：压缩改父指针指向，把途经结点挂到根；不改分量归属，不改边权。压缩后再查同组对象，路径一步到达。<\/p>\n<p><strong>卡点 4：连通分量个数怎么维护。<\/strong> 补步骤：初始分量数等于对象数 <span class=\"katex-inline\">N<\/span>；每次 <code>union<\/code> 确认两端不同根、完成合并后，分量数减一；同根合并不计。末尾分量数即等价类个数。<\/p>\n<h2>延伸：与 Kruskal 环检测的衔接<\/h2>\n<p>Kruskal 按边权升序逐条考虑边：两端若已同组，加入这条边会在生成树中成环，跳过；不同组则加入并合并。这里的&quot;同组判断&quot;正是 <code>connected<\/code>，环检测不需要完整图结构，一组 find 调用即可完成。union-find 在第 4 章复用，接口不变：<code>find<\/code>、<code>connected<\/code>、<code>union<\/code> 三件套直接搬到 MST 用例。<\/p>\n<h2>算例三：quick-find 合并扫描逐行推演<\/h2>\n<p>取 <span class=\"katex-inline\">N=6<\/span>，初始 <code>id=[0,1,2,3,4,5]<\/code>。<\/p>\n<ol><li>\n<code>union(0,1)<\/code>：<code>pid=0<\/code>、<code>qid=1<\/code>；遍历数组，把所有 <code>id[i]==0<\/code> 的位置改为 1。改后 <code>id=[1,1,2,3,4,5]<\/code>。\n<\/li><li>\n<code>union(2,3)<\/code>：扫描改 2 为 3，<code>id=[1,1,3,3,4,5]<\/code>。\n<\/li><li>\n<code>union(0,3)<\/code>：<code>pid=1<\/code>、<code>qid=3<\/code>；扫描把所有 1 改为 3，<code>id=[3,3,3,3,4,5]<\/code>。\n<\/li><li>\n每次合并访问 6 次数组；三次合并 18 次访问。对照 quick-union：每次合并只找两根、写一次父指针，访问次数与树高相关，不扫全数组。\n<\/li><li>\n计数推广：<span class=\"katex-inline\">M<\/span> 次 quick-find 合并访问 <span class=\"katex-inline\">MN<\/span> 次；<span class=\"katex-inline\">N=1000<\/span>、<span class=\"katex-inline\">M=1000<\/span> 即 <span class=\"katex-inline\">10^6<\/span> 次，<span class=\"katex-inline\">N=10^6<\/span>、<span class=\"katex-inline\">M=10^6<\/span> 即 <span class=\"katex-inline\">10^{12}<\/span> 次，平方增长在大规模下直接封死可行性。\n<\/ol>\n<h2>平摊代价口径补充<\/h2>\n<p>路径压缩带来的收益不是单次查找都变快：首次深查找仍要走完整条路径；收益体现在后续访问同一批结点时。平摊分析把一串操作的总代价分摊到每次操作上：压缩动作一次付出，多次读取回收。书里给出的结论方向是，加权加压缩的 union-find 平摊代价增长极慢，实际工程中按近似常数使用；严格的逆阿克曼函数级分析超出本书范围，记住&quot;趋近常数、不是无条件 <span class=\"katex-inline\">O(1)<\/span>&quot;即可。<\/p>\n<h2>API 与用例对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>操作<\/th><th>输入<\/th><th>返回/动作<\/th><th>实现要点<\/th><\/tr><\/thead><tbody><tr><td><code>find(p)<\/code><\/td><td>对象编号<\/td><td>所在分量根<\/td><td>父链上溯；压缩版途经结点挂根<\/td><\/tr><tr><td><code>connected(p,q)<\/code><\/td><td>两对象<\/td><td>布尔，是否同组<\/td><td>两根比较<\/td><\/tr><tr><td><code>union(p,q)<\/code><\/td><td>两对象<\/td><td>合并分量<\/td><td>找根；不同根按大小挂接；分量数减一<\/td><\/tr><tr><td><code>count()<\/code><\/td><td>无<\/td><td>分量个数<\/td><td>初始 <span class=\"katex-inline\">N<\/span>，成功合并减一<\/td><\/tr><\/tbody><\/table><\/div>\n<p>用例流程：读入对象数 <span class=\"katex-inline\">N<\/span> 初始化结构；逐对读入 <span class=\"katex-inline\">(p,q)<\/span>；<code>connected<\/code> 为假则输出该对并 <code>union<\/code>；读完遍历一次，同根对象归入同一分量。<\/p>\n<h2>第二组误解复盘<\/h2>\n<p><strong>误解 1：union-find 能给出两对象之间的路径。<\/strong> 它只记录分量归属，不保存边序列；要还原路径必须另存邻接表并跑遍历。并查集回答&quot;同不同组&quot;，不回答&quot;怎么走过去&quot;。<\/p>\n<p><strong>误解 2：树越矮越好，所以合并时把高树挂矮树。<\/strong> 加权规则比较的是分量大小，不是当前高度；小树挂大树保证规模翻倍次数有界。单纯按高度挂接也能控制高度（按高度合并），是另一种可行规则，但书里标准实现按大小。<\/p>\n<p><strong>误解 3：路径压缩后树是完全平衡的。<\/strong> 压缩只压平被查找过的路径，未访问的分支形状不变；整棵树不保证左右均衡。平衡化目标是控制最坏高度，不是绘制对称树。<\/p>\n<p><strong>误解 4：并查集适合保存键值映射。<\/strong> 它的接口没有存值、取值、范围查询；要按键存值归符号表（第 3 章），并查集只做归属判断。<\/p>\n<h2>背景补充：渗流模型<\/h2>\n<p>书里以物理化学中的渗流作为应用背景：网格每个单元以一定概率打开，上下两侧连通即发生渗流；模拟时把打开的相邻单元并入同一分量，判断顶部分量是否与底部分量连通。这类问题对象数可达网格量级，连接数更大，朴素扫描方案无法承受，union-find 的近常数平摊代价是模拟可行的前提。同一结构在网络连通、电路导通、社交分组、变量名等价等场景复用，接口不变，只换对象编号来源。<\/p>\n<h2>计数口径补充：三代实现访问次数对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>实现<\/th><th>find/connected<\/th><th>union<\/th><th>最坏总量<\/th><th>主要缺陷<\/th><\/tr><\/thead><tbody><tr><td>quick-find<\/td><td>两次访问<\/td><td>扫全数组 <span class=\"katex-inline\">N<\/span> 次<\/td><td><span class=\"katex-inline\">O(MN)<\/span><\/td><td>合并侧平方增长<\/td><\/tr><tr><td>quick-union<\/td><td>沿父链 <span class=\"katex-inline\">O(h)<\/span><\/td><td>两次找根加一次挂接<\/td><td>退化时 <span class=\"katex-inline\">O(MN)<\/span><\/td><td>可能退化成链<\/td><\/tr><tr><td>加权 quick-union<\/td><td><span class=\"katex-inline\">O(\\lg N)<\/span><\/td><td>两次找根加挂接<\/td><td><span class=\"katex-inline\">O(M\\lg N)<\/span><\/td><td>残留长路径可压缩<\/td><\/tr><tr><td>加权 + 路径压缩<\/td><td>平摊近常数<\/td><td>同左<\/td><td>趋近线性<\/td><td>不保存边与路径<\/td><\/tr><\/tbody><\/table><\/div>\n<p>表中 <span class=\"katex-inline\">M<\/span> 为操作次数、<span class=\"katex-inline\">N<\/span> 为对象数。改进链条的方向：把全数组扫描换成链上查找，再用挂接规则压住树高，再用压缩清理残留路径；每一步都对应访问次数的一个下降层级。<\/p>\n<h2>常见追问：并查集与等价类的边界<\/h2>\n<p>并查集维护的是&quot;无向、对称、可传递&quot;的归属关系。若问题带方向（A 信任 B 不等于 B 信任 A）、带权重（关系强度有数值）、需要记录关系产生的路径，union-find 都不够用，要回到图结构与遍历算法。判断用例是否适合并查集，先问三个问题：是否只判同类？是否无向？是否不需要边序列？三个都肯定，再选并查集。<\/p>\n<h2>追问：路径压缩的两种实现口径<\/h2>\n<ul><li>\n<strong>满压缩<\/strong>：<code>find<\/code> 上溯时把经过的全部结点直接挂到根；二次访问这些结点一步到根，压缩最彻底。\n<\/li><li>\n<strong>路径分裂/减半<\/strong>：上溯途中把结点改为挂祖父结点，逐步压平；单次改动少，多次访问后同样趋近平坦。\n<p>两种口径树高量级一致，差别在单次写入次数；书里标准实现配合加权使用，记住压缩对象是父链形状，不是分量归属。<\/p>\n<\/ul>\n<p>并查集初始化与计数规则再核对一遍：<code>id[i]=i<\/code>、<code>sz[i]=1<\/code>，分量计数 <code>count=N<\/code>；每次 <code>union<\/code> 先比较两 find，同根跳过，异根挂接后 <code>count--<\/code>。<code>find<\/code> 返回根结点标识，<code>connected<\/code> 比较两根；标识随合并变化，外部不能缓存旧根。这套规则在 Kruskal 环检测中原样复用：边两端同组则成环，异组则加入树并合并分量。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n等价关系的三条性质各是什么？它们怎样把对象划分成等价类？\n<\/li><li>\nquick-find 的代价集中在哪个操作上？为什么合并一次要扫描整个数组？\n<\/li><li>\n加权 quick-union 为什么把树高压在 <span class=\"katex-inline\">\\lg N<\/span> 以内？归纳论证的基例与合并步各是什么？\n<\/li><li>\n路径压缩与加权分别作用在哪个环节？只做其中一条会留下什么缺陷？\n<\/li><li>\n为什么不能把某次 <code>find<\/code> 返回的根结点缓存为长期标识？\n<\/ol><\/div><\/details>", "c03": "<div class=\"source-badge\">📖 出处：算法 第四版 Algorithms (4th Edition).pdf · p.209<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">增长数量级与算法分析的数学模型<\/a><\/span><\/div><h1>归并排序：自顶向下、自底向上与排序复杂度下界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch02（原书 §2.2 归并排序，PDF 第 209 页，印刷 170）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>归并排序是分治排序算法：把数组递归切成两半分别排序，再通过一次线性归并把两个有序段合成一个有序数组；实现分自顶向下（递归分解）与自底向上（按子数组宽度逐层归并）两条路线；最坏与平均代价均为 <span class=\"katex-inline\">N\\lg N<\/span>，需要与 <span class=\"katex-inline\">N<\/span> 成正比的辅助空间，排序结果稳定。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>选择、插入这类初级排序的总代价落在平方级：两层嵌套扫描或逐个相邻交换，<span class=\"katex-inline\">N<\/span> 增大时总量按 <span class=\"katex-inline\">N^2<\/span> 增长。需要一种最坏情形也保证 <span class=\"katex-inline\">N\\lg N<\/span> 的排序方案，并且在相等键较多时保持原有相对次序。<\/p>\n<p>不用分治会卡在两个地方。一是局部优化无法突破全局瓶颈：插入排序每次只消一个逆序对，逆序对上界 <span class=\"katex-inline\">N(N-1)/2<\/span>；要把代价压到 <span class=\"katex-inline\">N\\lg N<\/span>，必须改变组织方式，让大规模子问题先各自整理好再合并。二是合并环节缺乏规范：两个各自有序的段怎样拼成一个有序段，需要一个确定的线性过程，否则分治得到的两半无法衔接。<\/p>\n<p>归并排序给出的答案：归并操作把&quot;合并两个有序序列&quot;写成双指针线性扫描；排序主过程只管切分与递归，合并交给归并。后续快速排序、堆排序都在对照归并的代价与空间取舍。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>归并（merge）<\/strong>：输入两个各自有序的数组段，输出一个包含全部元素的有序数组。双指针分别指向两段起点，每次取两段中较小的元素复制回原数组；一段耗尽后复制另一段剩余部分。<\/p>\n<p><strong>原地归并抽象方法<\/strong>：书里 <code>merge(a, lo, mid, hi)<\/code> 把 <code>a[lo..mid]<\/code> 与 <code>a[mid+1..hi]<\/code> 归并回 <code>a[lo..hi]<\/code>。归并前把副本存入辅助数组 <code>aux[]<\/code>，扫描副本写回原数组；比较、复制过程线性。<\/p>\n<p><strong>自顶向下归并<\/strong>：<code>sort(a, lo, hi)<\/code> 递归：若段长足够小可切回插入排序；取中点 <code>mid=(lo+hi)/2<\/code>；排左半、排右半；调用 <code>merge<\/code> 合并。分解从上到下，合并从下到上。<\/p>\n<p><strong>自底向上归并<\/strong>：不用递归。子数组宽度 <span class=\"katex-inline\">sz<\/span> 从 1 开始，每轮把相邻两个宽度 <span class=\"katex-inline\">sz<\/span
