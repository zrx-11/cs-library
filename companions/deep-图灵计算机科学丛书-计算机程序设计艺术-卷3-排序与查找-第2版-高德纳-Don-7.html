键。前缀一旦无序，这个停止条件不成立。\n<\/li><li>\n<strong>比较只针对键<\/strong>。移动整条记录，但大小判断只读键；记录宽度与键宽度分开记账，否则移动代价会被错误地并进比较次数。\n<\/li><li>\n<strong>输入分布决定平均代价口径<\/strong>。最坏情形按完全逆序推，平均情形按随机排列、各位置等概率推；两种口径的假设不同，结论不能互相套用。\n<\/ol>\n<p>依赖链方向：顺序存储 → 维护有序前缀不变量 → 从右向左定位 → 上移并写入 → 比较与移动分别计数。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：写出初始状态<\/h3>\n<p>输入记录 <span class=\"katex-inline\">R_1,\\dots,R_N<\/span>，键 <span class=\"katex-inline\">K_1,\\dots,K_N<\/span>。第 1 条记录单独构成长度 1 的有序前缀，无需比较；从 <span class=\"katex-inline\">j=2<\/span> 开始插入。<\/p>\n<h3>第二步：单轮动作分解<\/h3>\n<p>第 <span class=\"katex-inline\">j<\/span> 轮：<\/p>\n<ol><li>\n暂存新键 <span class=\"katex-inline\">K\\leftarrow K_j<\/span> 与记录 <span class=\"katex-inline\">R\\leftarrow R_j<\/span>；\n<\/li><li>\n置 <span class=\"katex-inline\">i\\leftarrow j-1<\/span>，从前缀右端开始；\n<\/li><li>\n比较 <span class=\"katex-inline\">K<\/span> 与 <span class=\"katex-inline\">K_i<\/span>：若 <span class=\"katex-inline\">K\\ge K_i<\/span>，位置找到，停止；若 <span class=\"katex-inline\">K&lt;K_i<\/span>，把 <span class=\"katex-inline\">R_{i+1}<\/span> 移到 <span class=\"katex-inline\">R_{i+2}<\/span> 的位置（上移一格），<span class=\"katex-inline\">i\\leftarrow i-1<\/span>，回到比较；\n<\/li><li>\n退出循环后，把 <span class=\"katex-inline\">R<\/span> 写入 <span class=\"katex-inline\">R_{i+1}<\/span>。\n<\/ol>\n<h3>第三步：写出不变量<\/h3>\n<p>进入第 <span class=\"katex-inline\">j<\/span> 轮时 <span class=\"katex-inline\">K_1\\le\\cdots\\le K_{j-1}<\/span>；退出时 <span class=\"katex-inline\">K_1\\le\\cdots\\le K_j<\/span>。归纳基础：<span class=\"katex-inline\">j=1<\/span> 时长 1 前缀天然有序。归纳步：上移把大于 <span class=\"katex-inline\">K<\/span> 的键推到右侧，写入位置左侧不大于 <span class=\"katex-inline\">K<\/span>、右侧不小于 <span class=\"katex-inline\">K<\/span>，新前缀有序。<\/p>\n<h3>第四步：最坏比较次数<\/h3>\n<p>新键最小，前缀每个键都大于它，比较一路走到 <span class=\"katex-inline\">i=0<\/span>。第 <span class=\"katex-inline\">j<\/span> 轮比较 <span class=\"katex-inline\">j-1<\/span> 次。求和：<\/p>\n<div class=\"katex-block\">C_{\\max}=\\sum_{j=2}^{N}(j-1)=1+2+\\cdots+(N-1)=\\frac{N(N-1)}{2}.<\/div>\n<p>移动次数同口径：每轮上移 <span class=\"katex-inline\">j-1<\/span> 条记录再写入 1 条，最坏移动总量也是二阶量级。<\/p>\n<h3>第五步：平均比较次数<\/h3>\n<p>随机排列下，<span class=\"katex-inline\">K_j<\/span> 在 <span class=\"katex-inline\">j<\/span> 个位置（最左到最右）等概率出现。落到从右数第 <span class=\"katex-inline\">r<\/span> 位时比较 <span class=\"katex-inline\">r<\/span> 次，<span class=\"katex-inline\">r=1,\\dots,j<\/span>，期望<\/p>\n<div class=\"katex-block\">E_j=\\frac{1+2+\\cdots+j}{j}=\\frac{j+1}{2}.<\/div>\n<p>全书期望：<\/p>\n<div class=\"katex-block\">E_C=\\sum_{j=2}^{N}\\frac{j+1}{2}\\\\=\\frac12\\left(\\frac{N(N+1)}2-1+N-1\\right)\\\\=\\frac{N^2+N-2}{4}\\approx\\frac{N^2}{4}.<\/div>\n<p>均匀随机输入下，二阶项系数是最坏情形的一半。<\/p>\n<h3>第六步：接近有序输入的代价<\/h3>\n<p>若输入已经有序，每轮新键落在前缀右端，比较 1 次即停，全书比较约 <span class=\"katex-inline\">N-1<\/span> 次；移动只写入新记录。这解释了插入排序为何适合二次排序：第一遍排过的文件接近有序，第二遍用插入代价很低。<\/p>\n<h3>第七步：与二分插入的分界<\/h3>\n<p>插入点查找可以在前缀内折半进行，比较次数从每轮 <span class=\"katex-inline\">O(j)<\/span> 降到 <span class=\"katex-inline\">O(\\lg j)<\/span>，全书比较 <span class=\"katex-inline\">O(N\\lg N)<\/span>；但找到位置后上移记录的动作不变，移动总量仍是二阶。比较与移动两条线在二分插入里被拆开，不能只优化其中一条就声称整体变快。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：<span class=\"katex-inline\">N=4<\/span> 手算插入<\/h3>\n<p>输入 <span class=\"katex-inline\">3,1,4,2<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">j=2<\/span>：新键 1，比 3（1&lt;3，上移），落到最左，序列 <span class=\"katex-inline\">1,3,4,2<\/span>，比较 1 次；\n<\/li><li>\n<span class=\"katex-inline\">j=3<\/span>：新键 4，比 3（4≥3，停），序列 <span class=\"katex-inline\">1,3,4,2<\/span>，比较 1 次；\n<\/li><li>\n<span class=\"katex-inline\">j=4<\/span>：新键 2，比 4（上移），比 3（上移），比 1（2≥1，停），插入得 <span class=\"katex-inline\">1,2,3,4<\/span>，比较 3 次；\n<\/li><li>\n总比较 5 次。最坏 <span class=\"katex-inline\">N=4<\/span> 时 <span class=\"katex-inline\">4\\cdot3/2=6<\/span> 次，本例接近最坏。\n<\/ul>\n<h3>算例 2：最坏与平均对照<\/h3>\n<p><span class=\"katex-inline\">N=10<\/span>：最坏比较 <span class=\"katex-inline\">10\\cdot9/2=45<\/span> 次；平均约 <span class=\"katex-inline\">(100+10-2)/4=27<\/span> 次；有序输入 9 次。 <span class=\"katex-inline\">N=100<\/span>：最坏 4950 次；平均约 2500 次；有序输入 99 次。<\/p>\n<h3>算例 3：移动记录宽度的影响<\/h3>\n<p>若每条记录宽 100 字节、键宽 4 字节，一次上移搬 100 字节而比较只读 4 字节；大记录场景下先排序「键+指针」数组、最后按指针重排记录，可以把搬移量压到指针宽度。这个优化不改变比较次数，只改变移动成本口径。<\/p>\n<h3>算例 4：等值输入<\/h3>\n<p>输入 <span class=\"katex-inline\">5,5,5<\/span>。比较时 <span class=\"katex-inline\">K\\ge K_i<\/span> 即停，相等不交换，三轮各比较 1 次，相等键保持原次序，方法稳定。若把判断写成 <span class=\"katex-inline\">K&gt;K_i<\/span> 才停，相等时继续前移，相等键会被逆序搬动，稳定性被破坏。<\/p>\n<h3>算例 5：链表场景<\/h3>\n<p>单向链表里找插入位置只能从表头向后走，无法从前缀右端回溯；双向链表可以沿前驱指针回退，但省不掉指针改写。数组上移一格的便利，是顺序存储特有的。<\/p>\n<h3>算例 6：二分插入的拆分<\/h3>\n<p><span class=\"katex-inline\">N=8<\/span>，直接插入最坏比较 <span class=\"katex-inline\">8\\cdot7/2=28<\/span> 次；二分插入每轮查找比较 <span class=\"katex-inline\">\\lceil\\lg j\\rceil<\/span> 次，全书约 <span class=\"katex-inline\">8\\lg 8=24<\/span> 次量级，但上移记录的总量仍在二阶范围，整体收益受移动项限制。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>前缀不要求有序<\/strong>：停止条件「第一个不大于新键的键」失去依据，可能把新键插到比它小的键右侧，前缀再次变乱；不变量是算法正确性的核心。\n<\/li><li>\n<strong>比较附属信息而不只比键<\/strong>：比较次数随记录宽度和字段数膨胀，相同键也可能因附属字段差异被分出大小，稳定性与代价同时失真。\n<\/li><li>\n<strong>记录不能上移、只能原地交换<\/strong>：插入退化成相邻交换式的冒泡，归位一条记录要多次交换，移动动作从「批量上移」变成「逐对交换」。\n<\/li><li>\n<strong>输入完全逆序仍按平均口径估算<\/strong>：平均 <span class=\"katex-inline\">N^2/4<\/span> 只对随机排列成立；逆序输入按最坏 <span class=\"katex-inline\">N^2/2<\/span> 估计，混用会低估近一倍代价。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ol><li>\n每轮开始时前缀满足什么条件？这个条件怎样保证停止位置正确？\n<\/li><li>\n最坏情形下新键落在什么位置？第 <span class=\"katex-inline\">j<\/span> 轮比较几次？全书求和公式是什么？\n<\/li><li>\n平均情形为什么用「<span class=\"katex-inline\">j<\/span> 个位置等概率」？这个假设对应哪类输入？\n<\/li><li>\n比较次数和移动次数在插入排序里是不是同一个量？二分插入只优化了哪一条？\n<\/li><li>\n相等键为什么不交换？判断方向写反会破坏什么性质？\n<\/ol>\n<h2>扩展推演：插入位置查找的两种实现与稳定性来源<\/h2>\n<p>直接插入从前缀右端线性回退，比较次数随插入位置变化。另一种实现在前缀内折半查找插入点，比较次数降到每轮 <span class=\"katex-inline\">O(\\lg j)<\/span>，但找到位置后记录上移的动作不变：位置之后的每条记录仍要挪一格。记录宽度大时，搬移整条记录的成本远高于读键比较，折半查找省下的比较被移动项淹没；记录宽度小、键比较昂贵时，折半插入才有明显收益。这解释了为什么插入类方法的优化必须分比较与移动两条线记账。<\/p>\n<p>稳定性来自比较方向：算法在 <span class=\"katex-inline\">K\\ge K_i<\/span> 时停止前移，相等键不会越过左侧相等记录。若判断写成 <span class=\"katex-inline\">K&gt;K_i<\/span> 才停，相等时继续左移，相等记录被逆序搬动，方法就不稳定。二次排序要求第一遍次序保留，稳定性不是可有可无的性质。<\/p>\n<p>再看随机排列下平均位置的推导口径。<span class=\"katex-inline\">K_j<\/span> 在 <span class=\"katex-inline\">j<\/span> 个位置等概率，是「排列均匀随机」假设；若输入按某种规律偏斜，新键常落在左端或右端，期望比较次数偏离 <span class=\"katex-inline\">(j+1)/2<\/span>。例如已按次键排过的文件，主键插入位置偏右，比较次数接近线性。最坏 <span class=\"katex-inline\">N^2/2<\/span>、平均 <span class=\"katex-inline\">N^2/4<\/span>、接近线性三种情形，对应的是三类不同输入，不能用一个系数概括。<\/p>\n<p>补充手算 <span class=\"katex-inline\">N=5<\/span> 的完整过程：输入 <span class=\"katex-inline\">[5,3,1,4,2]<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">j=2<\/span>：3 比 5，上移，插入左端，<span class=\"katex-inline\">[3,5,1,4,2]<\/span>，比较 1 次；\n<\/li><li>\n<span class=\"katex-inline\">j=3<\/span>：1 比 5、比 3，上移两次，插入左端，<span class=\"katex-inline\">[1,3,5,4,2]<\/span>，比较 2 次；\n<\/li><li>\n<span class=\"katex-inline\">j=4<\/span>：4 比 5，上移，比 3 停，<span class=\"katex-inline\">[1,3,4,5,2]<\/span>，比较 2 次；\n<\/li><li>\n<span class=\"katex-inline\">j=5<\/span>：2 比 5、4、3，上移三次，比 1 停，<span class=\"katex-inline\">[1,2,3,4,5]<\/span>，比较 4 次；\n<\/li><li>\n总比较 9 次。最坏 <span class=\"katex-inline\">5\\cdot4/2=10<\/span> 次，本例接近最坏；平均期望 <span class=\"katex-inline\">(25+5-2)/4=7<\/span> 次。移动次数与插入位置同步，每轮上移 <span class=\"katex-inline\">r<\/span> 条再写入 1 条。\n<\/ul>\n<h2>再补充：边界记录与实现口径<\/h2>\n<p>空表与单元素表直接有序，插入循环从 <span class=\"katex-inline\">j=2<\/span> 开始不执行；两条记录相等时比较一次即停，不产生移动。前缀长度为 1 时插入位置只有两种可能。数组末尾空间不足时，插入排序也要先扩容，与移动记录无关。<\/p>\n<p>把比较次数与 MIX 指令口径分开：本书分析的是键比较次数，实际程序运行时间还含索引加减、记录上移等指令；同一比较次数在不同记录宽度下对应不同运行时间。习题中程序时间按 <span class=\"katex-inline\">u<\/span>（比较指令）与 <span class=\"katex-inline\">v<\/span>（移动指令）分别计，不能只按比较次数排方法优劣。<\/p>\n<p>与其他插入类变体对照：希尔排序先按增量分组插入，缩小增量后整体接近有序，克服直接插入在大规模随机输入下的二阶代价；它是插入思想的多级改进，不变量仍是每组内有序。直接插入作为基线方法，在小规模与近有序场景保留实用价值。<\/p>\n<h2>边界小结<\/h2>\n<p>插入排序的适用边界由三条前提决定：顺序存储便于上移、前缀有序提供查找依据、输入规模不大或近有序。离开顺序存储，链表版本要双向回溯；离开有序前缀，停止条件不成立；离开小规模或近有序，二阶比较被其他方法超过。分析插入代价时把键比较与记录移动分开记账，才能判断折半插入、希尔排序等变体各自优化了哪一条线。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出插入排序第 <span class=\"katex-inline\">j<\/span> 轮的四个动作，并指出哪一步依赖前缀有序。\n<\/li><li>\n<span class=\"katex-inline\">N=12<\/span> 时最坏比较次数是多少？平均比较次数约为多少？\n<\/li><li>\n为什么插入排序在接近有序的文件上代价接近线性？这种输入从哪里来？\n<\/li><li>\n二分插入把比较次数压到 <span class=\"katex-inline\">N\\lg N<\/span> 量级，为什么整体不一定快一个量级？\n<\/li><li>\n单向链表为什么不适合直接套用数组版插入排序？缺了什么回溯方向？\n<\/ol><\/div><\/details>", "c03": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/计算机程序与设计艺术/图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版 (高德纳（Donald E.Knuth）著；贾洪峰译, (美) 克努特, (Knuth etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.111<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">直接插入排序：逐步插入已排序前缀，比较与移动次数推导<\/a><\/span><\/div><h1>交换排序：冒泡与快速排序，划分递推与期望比较次数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch01（原书 §5.2.2 交换排序，PDF 第 111 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>相邻逆序对是插入、交换两类方法共同消除的对象。朴素的相邻交换一次只挪一对，大键要一步步走到后端；需要回答：能否用一次扫描把小键、大键分到两侧，再对两侧分别处理？交换排序这一节给出两条路线：冒泡反复把最大键逐步推到末端，快速排序选基准做划分，把问题拆成两个子文件。这个概念要解决的困难是：划分怎样保证两侧各自成立，以及快速排序的期望比较次数怎样从递推解出来。<\/p>\n<h2>定义<\/h2>\n<p><strong>交换排序<\/strong>：通过比较相邻或指定位置的记录、在逆序时交换它们来消除反序的一类方法。<\/p>\n<p><strong>冒泡排序<\/strong>：反复扫描相邻记录，逆序则交换，使当前最大键像气泡一样逐步移到序列末端；每轮扫描把一个极值固定到后端（PDF 第 110 页前后，习题中以算法 B 称呼该冒泡过程）。<\/p>\n<p><strong>快速排序<\/strong>：选一个基准键，把小于基准的记录换到左侧、大于基准的换到右侧，基准落到最终位置；再对左右两个子文件递归执行同一过程（PDF 第 111 页，习题中以算法 Q 称呼）。<\/p>\n<p><strong>划分<\/strong>：一轮扫描中按与基准的大小关系把记录归入两侧的动作；划分完成后基准左侧键不大于基准、右侧不小于基准。<\/p>\n<p><strong>基数交换排序<\/strong>：不比较整键大小，按二进制位从高到低把键分到两侧的交换类方法（PDF 第 112 页前后，习题中以算法 R 称呼）。<\/p>\n<p><strong>正例<\/strong>：基准为 5，输入 3,7,1,9,4；划分后左侧 3,1,4，基准 5，右侧 7,9。<strong>反例<\/strong>：划分后左侧仍混入大于基准的键，说明交换或指针边界有误，子文件不成立。<\/p>\n<h2>原理推导<\/h2>\n<p>快速排序记 <span class=\"katex-inline\">C_N<\/span> 为 <span class=\"katex-inline\">N<\/span> 个互不相同键的期望比较次数。划分一步把基准与其余 <span class=\"katex-inline\">N-1<\/span> 个键比较，代价 <span class=\"katex-inline\">N+1<\/span> 量级；基准把文件分成长度 <span class=\"katex-inline\">k<\/span> 与 <span class=\"katex-inline\">N-1-k<\/span> 两个子文件，<span class=\"katex-inline\">k<\/span> 在 <span class=\"katex-inline\">0,\\dots,N-1<\/span> 等概率取值，两侧递归代价 <span class=\"katex-inline\">C_k<\/span> 与 <span class=\"katex-inline\">C_{N-1-k}<\/span>。递推<\/p>\n<div class=\"katex-block\">C_N=N+1+\\frac{2}{N}\\sum_{k=0}^{N-1}C_k.<\/div>\n<p>乘 <span class=\"katex-inline\">N<\/span> 后与 <span class=\"katex-inline\">N-1<\/span> 的同类等式相减，消去求和项，整理得 <span class=\"katex-inline\">C_N=\\frac{N+1}{N}C_{N-1}+2<\/span>；令 <span class=\"katex-inline\">D_N=C_N/(N+1)<\/span>，累加调和数后得到<\/p>\n<div class=\"katex-block\">C_N\\approx 2(N+1)H_N-4N\\approx 2N\\ln N.<\/div>\n<p>冒泡排序每轮扫描比较相邻对，<span class=\"katex-inline\">N<\/span> 轮共约 <span class=\"katex-inline\">N^2/2<\/span> 次比较，与插入同属二阶；快速排序的主项是 <span class=\"katex-inline\">N\\ln N<\/span>，差距来自划分一次性分隔大批反序对。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：键可两两比较；快速排序的期望结论依赖基准等概率切分、键互不相同的随机输入假设。\n<\/li><li>\n边界一：基准每次取到最大或最小键时，子文件长度只减 1，递推退化为 <span class=\"katex-inline\">C_N\\approx C_{N-1}+N<\/span>，总代价 <span class=\"katex-inline\">N^2/2<\/span>，最坏情形存在。\n<\/li><li>\n失败案例一：等值键密集且划分不区分等值归属，等值记录被反复在两侧搬运，划分退化；等值键需要单独归入一侧或单独挂接。\n<\/li><li>\n失败案例二：子文件不再递归、只做一轮划分，文件只是被分组而未整体有序。\n<\/li><li>\n边界二：快速排序就地划分节省空间，但递归栈深度在最坏情形可达 <span class=\"katex-inline\">N<\/span>；尾递归改造或子文件先短后长可以控制栈占用。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>冒泡 vs 快速<\/strong>：冒泡一轮只把一个极值推到末端，相邻交换逐步走；快速一轮划分出两侧，基准归位后递归子文件。前者二阶，后者期望 <span class=\"katex-inline\">N\\ln N<\/span>。\n<\/li><li>\n<strong>划分 vs 插入归位<\/strong>：插入把一条新键放进有序前缀；划分把一大批按键的大小关系分到两侧，基准本身归位。\n<\/li><li>\n<strong>快速排序 vs 基数交换<\/strong>：快速按整键与基准的大小划分；基数交换按二进制位取值分侧，不比较整键，两条路线的分支依据不同。\n<\/li><li>\n<strong>期望代价 vs 最坏代价<\/strong>：<span class=\"katex-inline\">2N\\ln N<\/span> 是随机输入下的期望；快速排序最坏仍是二阶，选基准策略（如三者取中）用于压低最坏概率。\n<\/ul>\n<p><strong>常见误解<\/strong>：有人把快速排序当成「永远 <span class=\"katex-inline\">N\\log N<\/span>」的方法，忽略期望结论背后的随机切分假设。基准固定取首元素时，有序输入就是最坏切分；三者取中或随机选基准只是降低最坏概率，不能消除最坏输入。另一个误解是把划分交换与相邻冒泡混为一谈：划分一次把大批小键、大键分到两侧，基准直接归位；冒泡一轮只把一个极值推到末端，二者操作跨度和消除反序的批量不同。<\/p>\n<h2>联系<\/h2>\n<p>前置：c01 反序对、c02 插入的归位动作。后继：c05 合并排序与快速排序并列为本章两条 <span class=\"katex-inline\">N\\ln N<\/span> 路线；c06 的下界分析说明快速排序主项 <span class=\"katex-inline\">N\\ln N<\/span> 与决策树下界同量级；外部排序 c07 的多路合并复用划分思想但面向外部存储。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（交换排序：冒泡与快速排序，划分递推与期望比较次数）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：交换排序的划分机制与快速排序递推求解<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把快速排序的期望代价推到底，先往回追四层前提：<\/p>\n<ol><li>\n<strong>反序对可以通过交换消除<\/strong>。交换类方法的基本动作是逆序时交换；先承认相邻交换一次消除一对反序，再看批量划分怎样一次分隔多对。\n<\/li><li>\n<strong>基准要能把键分成大小两组<\/strong>。划分依据是整键与基准的大小关系；没有可比较的全序，左右两组无法界定。\n<\/li><li>\n<strong>子文件可以独立排序<\/strong>。划分保证左侧不大于基准、右侧不小于基准后，两侧内部次序不影响全局有序；递归只处理两侧，基准不再参与后续比较。\n<\/li><li>\n<strong>概率假设要写明<\/strong>。期望 <span class=\"katex-inline\">2N\\ln N<\/span> 来自基准等概率落位、输入随机排列；去掉这个假设，递推的平均口径不成立，只能回到最坏情形分析。\n<\/ol>\n<p>依赖链方向：可比较键 → 选基准并划分 → 两侧独立递归 → 期望比较次数递推 → 调和数求解到 <span class=\"katex-inline\">N\\ln N<\/span>。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：冒泡的一轮扫描<\/h3>\n<p>冒泡从左到右比较相邻对 <span class=\"katex-inline\">(R_j,R_{j+1})<\/span>，若 <span class=\"katex-inline\">K_j&gt;K_{j+1}<\/span> 则交换。一轮扫描后，当前最大键被推到最右端；下一轮在缩短一截的前缀上重复。<span class=\"katex-inline\">N<\/span> 条记录需要 <span class=\"katex-inline\">N-1<\/span> 轮，每轮比较长度递减，总比较<\/p>\n<div class=\"katex-block\">B_{\\max}=1+2+\\cdots+(N-1)=\\frac{N(N-1)}2.<\/div>\n<p>扫描中若某轮没有发生交换，说明已经有序，可以提前终止。<\/p>\n<h3>第二步：快速排序的划分动作<\/h3>\n<p>取基准键 <span class=\"katex-inline\">K<\/span>（书中过程在习题中称算法 Q）。两个指针分别从左右向中间移动：左侧找大于基准的键，右侧找小于基准的键，找到后交换；两指针相遇时基准归位。划分结束的不变量：相遇点左侧键 <span class=\"katex-inline\">\\le K<\/span>，右侧键 <span class=\"katex-inline\">\\ge K<\/span>，基准位于最终位置。<\/p>\n<h3>第三步：建立期望递推<\/h3>\n<p>记 <span class=\"katex-inline\">C_N<\/span> 为 <span class=\"katex-inline\">N<\/span> 个互不相同键的期望比较次数。划分阶段基准与其余 <span class=\"katex-inline\">N-1<\/span> 个键各比较一次，加基准自身归类，量级 <span class=\"katex-inline\">N+1<\/span>。基准落位把文件分成长度 <span class=\"katex-inline\">k<\/span> 与 <span class=\"katex-inline\">N-1-k<\/span> 的子文件；基准在 <span class=\"katex-inline\">N<\/span> 个位置等概率，<span class=\"katex-inline\">k<\/span> 取 <span class=\"katex-inline\">0,\\dots,N-1<\/span> 各概率 <span class=\"katex-inline\">1/N<\/span>。两侧期望代价 <span class=\"katex-inline\">C_k<\/span>、<span class=\"katex-inline\">C_{N-1-k}<\/span>，故<\/p>\n<div class=\"katex-block\">C_N=N+1+\\frac1N\\sum_{k=0}^{N-1}(C_k+C_{N-1-k})=N+1+\\frac2N\\sum_{k=0}^{N-1}C_k.<\/div>\n<h3>第四步：消去求和项<\/h3>\n<p>两端乘 <span class=\"katex-inline\">N<\/span>：<\/p>\n<div class=\"katex-block\">NC_N=N(N+1)+2\\sum_{k=0}^{N-1}C_k.<\/div>\n<p>对 <span class=\"katex-inline\">N-1<\/span> 写同类式：<\/p>\n<div class=\"katex-block\">(N-1)C_{N-1}=N(N-1)+2\\sum_{k=0}^{N-2}C_k.<\/div>\n<p>两式相减，右侧求和项只剩 <span class=\"katex-inline\">2C_{N-1}<\/span>：<\/p>\n<div class=\"katex-block\">NC_N-(N-1)C_{N-1}=2N+2C_{N-1}.<\/div>\n<p>把 <span class=\"katex-inline\">(N-1)C_{N-1}<\/span> 移到右侧：<\/p>\n<div class=\"katex-block\">NC_N=2N+(N+1)C_{N-1},<\/div>\n<p>即<\/p>\n<div class=\"katex-block\">C_N=\\frac{N+1}{N}C_{N-1}+2.<\/div>\n<h3>第五步：变量替换解递推<\/h3>\n<p>令 <span class=\"katex-inline\">D_N=C_N/(N+1)<\/span>，则 <span class=\"katex-inline\">C_N=(N+1)D_N<\/span>，<span class=\"katex-inline\">C_{N-1}=N D_{N-1}<\/span>。代入：<\/p>\n<div class=\"katex-block\">(N+1)D_N=\\frac{N+1}{N}\\cdot N D_{N-1}+2=(N+1)D_{N-1}+2,<\/div>\n<p>两边除以 <span class=\"katex-inline\">N+1<\/span>：<\/p>\n<div class=\"katex-block\">D_N=D_{N-1}+\\frac{2}{N+1}.<\/div>\n<p>累加：<\/p>\n<div class=\"katex-block\">D_N=D_0+2\\sum_{j=1}^{N}\\frac1{j+1}=2(H_{N+1}-1).<\/div>\n<p>于是<\/p>\n<div class=\"katex-block\">C_N=(N+1)\\cdot 2(H_{N+1}-1)\\approx 2(N+1)\\ln N-4N.<\/div>\n<p>主项 <span class=\"katex-inline\">2N\\ln N<\/span>，自然对数；换成以 2 为底，系数相应换算，量级仍是 <span class=\"katex-inline\">N\\lg N<\/span>。<\/p>\n<h3>第六步：最坏情形递推<\/h3>\n<p>基准每次取当前极值，子文件长度 <span class=\"katex-inline\">N-1<\/span>，递推<\/p>\n<div class=\"katex-block\">C_N=C_{N-1}+N+1,<\/div>\n<p>求和得 <span class=\"katex-inline\">C_N\\approx N^2/2<\/span>。这种输入下快速排序退到二阶，与冒泡同量级；三者取中、随机选基准等策略用于让最坏切分概率降低，不能消除最坏输入的存在。<\/p>\n<h3>第七步：基数交换的分支依据<\/h3>\n<p>基数交换排序（习题中称算法 R）按二进制位从高到低分侧：某一位为 0 归左、为 1 归右，不比较整键大小。它的代价落在位查看与交换次数上，分支依据是位取值，与快速排序的整键大小划分不同。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：一轮划分手算<\/h3>\n<p>输入 <span class=\"katex-inline\">[5,3,7,1,9,4]<\/span>，基准 5。左侧找大于 5：7；右侧找小于 5：4；交换得 <span class=\"katex-inline\">[5,3,4,1,9,7]<\/span>。继续移动指针，相遇后基准归位，左侧 <span class=\"katex-inline\">3,4,1<\/span>，右侧 <span class=\"katex-inline\">9,7<\/span>。两侧再分别递归。<\/p>\n<h3>算例 2：期望比较次数对照<\/h3>\n<p><span class=\"katex-inline\">N=100<\/span>：<span class=\"katex-inline\">2N\\ln N\\approx2\\cdot100\\cdot4.605=921<\/span> 次；最坏 <span class=\"katex-inline\">100\\cdot99/2=4950<\/span> 次。 <span class=\"katex-inline\">N=1000<\/span>：期望约 <span class=\"katex-inline\">2\\cdot1000\\cdot6.908=13816<\/span> 次；最坏约 50 万次。<\/p>\n<h3>算例 3：冒泡提前终止<\/h3>\n<p>输入 <span class=\"katex-inline\">1,2,3,4<\/span>：第一轮相邻对全部顺序，零交换，判定有序终止；若不设终止检查，仍会走完 3 轮、共 6 次比较。<\/p>\n<h3>算例 4：等值键处理<\/h3>\n<p>输入 <span class=\"katex-inline\">5,5,5<\/span>。划分若把等值键随意分到两侧，等值记录在递归中被反复搬运；稳定做法是等值归入同一侧，或单独堆积。等值密集时快速排序效率明显下降。<\/p>\n<h3>算例 5：递归栈深度<\/h3>\n<p>每次划分都把较长子文件留下递归，栈深等于划分层数；均衡划分层数约 <span class=\"katex-inline\">\\lg N<\/span>，偏斜划分层数可达 <span class=\"katex-inline\">N<\/span>。先递归短子文件、长改动为尾递归，可把栈占用压到 <span class=\"katex-inline\">\\lg N<\/span> 量级。<\/p>\n<h3>算例 6：递推系数核对<\/h3>\n<p><span class=\"katex-inline\">N=1<\/span> 时 <span class=\"katex-inline\">C_1=0<\/span>；<span class=\"katex-inline\">N=2<\/span> 时期望比较 1 次。代入 <span class=\"katex-inline\">C_N=(N+1)2(H_{N+1}-1)<\/span>：<span class=\"katex-inline\">N=2<\/span> 得 <span class=\"katex-inline\">3\\cdot2(H_3-1)=6\\cdot(1.833-1)=5<\/span>，这是含划分归类口径的量级值；实际比较次数按 MIX 指令口径另计，本算例只核对递推结构。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>基准落位不保证两侧大小<\/strong>：左侧混入大键、右侧混入小键，递归后全局仍有跨子文件反序，排序结果错误；划分不变量是递归成立的根据。\n<\/li><li>\n<strong>去掉等概率假设<\/strong>：若输入天然偏斜或基准固定取首元素，期望递推的平均项不成立，性能要按实际分布估计；随机化选基准就是为恢复可分析的平均口径。\n<\/li><li>\n<strong>只划分一轮不递归<\/strong>：文件被分成大小两组但各组内部无序，不是有序文件；递归步骤不能省。\n<\/li><li>\n<strong>等值键按大小两分支处理<\/strong>：等值被强行归入左或右，密集等值时一侧偏斜，划分退化；等值需要独立规则。\n<\/ul>\n<h2>补足推导：与插入、合并的量级对照<\/h2>\n<p>插入排序最坏 <span class=\"katex-inline\">N^2/2<\/span>、平均 <span class=\"katex-inline\">N^2/4<\/span>；冒泡最坏 <span class=\"katex-inline\">N^2/2<\/span>；快速排序期望 <span class=\"katex-inline\">2N\\ln N<\/span>、最坏 <span class=\"katex-inline\">N^2/2<\/span>；合并排序 <span class=\"katex-inline\">N\\lg N<\/span>。<span class=\"katex-inline\">N=1000<\/span> 时 <span class=\"katex-inline\">N^2<\/span> 是百万量级，<span class=\"katex-inline\">N\\ln N<\/span> 是万量级，差距随 <span class=\"katex-inline\">N<\/span> 拉大。快速排序主项系数 2 大于合并排序的 1 左右，但就地划分省去合并的额外数组搬运，实际常数取决于记录宽度与内存口径。决策树下界（c06）说明任何比较方法主项都不能低于 <span class=\"katex-inline\">N\\lg N<\/span>，快速与合并处在主项最优的一类。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n冒泡一轮扫描固定住哪条记录？为什么可能提前终止？\n<\/li><li>\n快速排序划分完成后，基准左侧、右侧各满足什么条件？\n<\/li><li>\n递推式里 <span class=\"katex-inline\">k<\/span> 代表什么？为什么两侧代价写成 <span class=\"katex-inline\">C_k<\/span> 与 <span class=\"katex-inline\">C_{N-1-k}<\/span>？\n<\/li><li>\n消去求和项用了哪两个等式相减？替换 <span class=\"katex-inline\">D_N<\/span> 后递推变成什么形式？\n<\/li><li>\n最坏情形下基准怎样选取？代价退回什么量级？\n<\/ol>\n<h2>扩展推演：基准选择、等值处理与栈深度<\/h2>\n<p>基准位置决定划分均衡度。固定取首元素在有序输入上每次切出极值子文件；三者取中（取首、中、尾的中值）让基准落在中间附近，降低最坏切分概率；随机选基准把位置选择随机化，使期望分析重新适用。这些策略不改变最坏输入的存在，只是让实际数据落入最坏情形的概率变低。<\/p>\n<p>等值键是快速排序的薄弱点。划分时若等值记录被随意分到两侧，它们会在递归中被反复搬运；稳妥做法是把等值归入同一侧，或单独堆积等值区。等值密集时，不做单独处理的快排效率明显下降，这与键互不相同的期望推导前提直接相关。<\/p>\n<p>递归栈深度等于划分层数。均衡划分层数 <span class=\"katex-inline\">\\lg N<\/span>；偏斜划分层数 <span class=\"katex-inline\">N<\/span>。实现上先递归较短子文件、较长子文件改尾递归，栈占用可压到 <span class=\"katex-inline\">\\lg N<\/span> 量级。栈溢出在朴素递归实现中是实际风险，尤其最坏切分下递归深度达到记录数。<\/p>\n<p>补充递推核对：<span class=\"katex-inline\">N=2<\/span> 时划分比较 1 次；<span class=\"katex-inline\">N=3<\/span> 随机基准，基准在三个位置各概率 <span class=\"katex-inline\">1/3<\/span>，两侧长度组合 <span class=\"katex-inline\">(0,2),(1,1),(2,0)<\/span>，期望代价按递推式加权。主项 <span class=\"katex-inline\">2N\\ln N<\/span> 是渐近结果，小 <span class=\"katex-inline\">N<\/span> 时线性项与常数不可忽略。与冒泡对照：冒泡 <span class=\"katex-inline\">N^2/2<\/span>，快排期望 <span class=\"katex-inline\">2N\\ln N<\/span>；<span class=\"katex-inline\">N=1000<\/span> 时前者约 50 万次，后者约 1.38 万次，规模越大差距越明显。基数交换排序按位划分，不比较整键，代价口径是位查看次数，不纳入这个比较递推。<\/p>\n<h2>再补充：划分指针与习题口径<\/h2>\n<p>划分实现中两个指针相向移动：左指针找大于基准的键，右指针找小于基准的键，找到后交换；指针相遇处即基准归位点。指针越界条件要单独处理，否则会扫出文件两端。基准本身不参与两侧递归，归位后不再移动。<\/p>\n<p>递推式 <span class=\"katex-inline\">C_N=N+1+\\frac2N\\sum C_k<\/span> 里的 <span class=\"katex-inline\">N+1<\/span> 是划分阶段比较量级；严格 MIX 时间还分比较与交换指令，习题按 <span class=\"katex-inline\">u,v<\/span> 分别给出。期望结论基于键互不相同、基准等概率落位；等值密集、偏斜输入不在这个平均口径内。<\/p>\n<p>与基数交换排序对照：基数交换按二进制位 0/1 分侧，不比较整键，位查看次数是它的代价量；快速排序按整键大小划分。两者都递归分侧，但分支依据不同，分析方法不能互套。冒泡作为相邻交换基线，每轮固定一个极值到末端，二阶代价与插入同档。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出快速排序期望比较次数的递推式，并指出每个假设条件。\n<\/li><li>\n为什么说快速排序的 <span class=\"katex-inline\">2N\\ln N<\/span> 是期望而非最坏保证？\n<\/li><li>\n基数交换排序与快速排序的分支依据有什么不同？\n<\/li><li>\n等值键在划分中如果处理不当，会引发什么退化？\n<\/li><li>\n递归栈深度由什么决定？均衡划分与偏斜划分各是多少量级？\n<\/ol><\/div><\/details>", "c04": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/计算机程序与设计艺术/图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版 (高德纳（Donald E.Knuth）著；贾洪峰译, (美) 克努特, (Knuth etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.113<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">排序问题、稳定性与反序：键、记录与逆序对代价度量<\/a><\/span><\/div><h1>选择排序与锦标赛树：逐次选最小，树选择把重复比较压到 <span class=\"katex-inline\">N\\lg N<\/span><\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书 §5.2.3 选择排序，PDF 第 113、116 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>插入排序的比较次数依赖输入有序程度，选择排序要回答另一条路线：每一步直接挑出剩余记录里的最小键，追加到已排序段。朴素挑选每轮都要扫遍剩余段，比较次数与输入无关地停在二阶；需要改进的地方是：第一次选出最小之后，第二名、第三名不必重新两两比一遍。锦标赛树把比较结果组织成树，选出冠军后沿一条路径重做比较，解决重复比较问题。<\/p>\n<h2>定义<\/h2>\n<p><strong>直接选择排序<\/strong>：每一轮在未排序段中找出键最小的记录，与未排序段首位置交换，固定到已排序段末尾；重复 <span class=\"katex-inline\">N<\/span> 轮（PDF 第 113 页，书中该选择过程称算法 S）。<\/p>\n<p><strong>锦标赛树（树选择）<\/strong>：把记录放在叶子结点，两两比较、胜者（较小键）上浮到父结点；根结点给出当前最小。选出一个最小后，该叶子置为无穷大，沿原路径自底向上重做比较，其余子树的比较结果保留（PDF 第 116 页前后）。<\/p>\n<p><strong>已排序段不变量<\/strong>：每轮结束时，序列前段 <span class=\"katex-inline\">K_1\\le\\cdots\\le K_j<\/span> 是全局最小的 <span class=\"katex-inline\">j<\/span> 条记录；后段是剩余未选记录。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">[4,2,7,1]<\/span>，第一轮选 1 换到首位；第二轮在 <span class=\"katex-inline\">[4,2,7]<\/span> 选 2；第三轮选 4。<strong>反例<\/strong>：选出最小后不固定位置、下一轮又把它扫进候选，选择无法逐轮收敛。<\/p>\n<h2>原理推导<\/h2>\n<p>朴素选择第 <span class=\"katex-inline\">j<\/span> 轮在 <span class=\"katex-inline\">N-j+1<\/span> 条记录中找最小，比较 <span class=\"katex-inline\">N-j<\/span> 次，全书比较<\/p>\n<div class=\"katex-block\">S_{\\text{直}}=\\sum_{j=1}^{N-1}(N-j)=1+2+\\cdots+(N-1)=\\frac{N(N-1)}2.<\/div>\n<p>这个次数与输入是否有序无关：即使输入已经排好，每轮仍要扫完剩余段才能确认最小。交换次数最多 <span class=\"katex-inline\">N-1<\/span> 次，远少于比较次数。<\/p>\n<p>锦标赛树首轮建树：<span class=\"katex-inline\">N<\/span> 个叶子两两比较，约 <span class=\"katex-inline\">N-1<\/span> 次比较产生冠军。之后每选一个记录，只有冠军所在路径上的结点需要重做：树高 <span class=\"katex-inline\">\\lceil\\lg N\\rceil<\/span>，每重做一层一次比较，后续每个记录约 <span class=\"katex-inline\">\\lceil\\lg N\\rceil<\/span> 次比较。全书比较约<\/p>\n<div class=\"katex-block\">S_{\\text{树}}\\approx N-1+N\\lceil\\lg N\\rceil,<\/div>\n<p>量级 <span class=\"katex-inline\">N\\lg N<\/span>。重复比较被保留下来：败者与其他对手的比较结果仍在子树中，不必重来。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：记录能两两比较；选择排序交换次数少，适合记录宽、键窄、搬移昂贵的场合。\n<\/li><li>\n边界一：朴素选择比较次数二阶，不随输入改善；树选择把比较压到 <span class=\"katex-inline\">N\\lg N<\/span>，代价是树结构的额外存储。\n<\/li><li>\n失败案例一：树选择更新冠军时，若把整棵树重建，就退回 <span class=\"katex-inline\">N^2<\/span>；只更新路径才保留树选择的收益。\n<\/li><li>\n失败案例二：已排序段不固定，下一轮候选包含已选记录，会选出重复元素。\n<\/li><li>\n边界二：锦标赛树选出的是最小键；若要同时得到次序，后续名次从败者链与树中继续取，树结构要支持回溯。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>选择 vs 插入<\/strong>：选择每轮从后段挑最小追加；插入把新键插进有序前缀。选择比较次数与输入无关，插入依赖输入有序程度。\n<\/li><li>\n<strong>朴素选择 vs 树选择<\/strong>：前者每轮全段扫描，比较 <span class=\"katex-inline\">N^2/2<\/span>；后者保留首轮比较结果，路径更新，比较 <span class=\"katex-inline\">N\\lg N<\/span>。\n<\/li><li>\n<strong>选择 vs 冒泡<\/strong>：选择一轮选出极值并交换到固定位置；冒泡一轮把极值逐步推到末端，中间经过多次相邻交换。\n<\/li><li>\n<strong>比较次数 vs 交换次数<\/strong>：选择的瓶颈是比较，交换最多 <span class=\"katex-inline\">N-1<\/span> 次；搬移昂贵时这个特征比插入更划算。\n<\/ul>\n<p><strong>常见误解<\/strong>：容易以为选择排序每轮挑出最小，已经比插入「聪明」，比较次数更少。朴素选择无论输入如何都要扫完剩余段确认最小，二阶比较次数不会因有序而下降；插入在有序输入上反而接近线性。树选择把比较压到 <span class=\"katex-inline\">N\\lg N<\/span>，靠的是保留首轮比较结果，不是选择动作本身更省力。另一个误解是把选择的少量交换当成低代价：记录宽、键窄时交换搬移昂贵，选择方法的这个特征才成立；若记录很窄，比较次数仍是主要瓶颈。朴素选择把最小记录交换到前段时可能越过相等键，稳定性需要在交换规则中单独维持；树选择保留首轮比较结果，等值次序同样要在比较规则里固定。<\/p>\n<h2>联系<\/h2>\n<p>前置：c01 的有序目标与反序度量。后继：c05 合并排序的两路归并也用比较选当前最小；c07 外部排序的 <span class=\"katex-inline\">P<\/span> 路合并用选择树在 <span class=\"katex-inline\">P<\/span> 个游程间选最小，正是锦标赛树的多路推广；c06 下界分析把选择类方法也纳入比较排序框架。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（选择排序与锦标赛树：逐次选最小，树选择把重复比较压到 $N\\lg N$）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：直接选择的扫描代价与锦标赛树的路径更新<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把选择类方法的代价推清楚，先往回追四层前提：<\/p>\n<ol><li>\n<strong>每步目标是全局剩余最小<\/strong>。选择排序不靠逐步消除相邻反序，而是直接确定第 <span class=\"katex-inline\">j<\/span> 小的记录；已排序段是全局最小的 <span class=\"katex-inline\">j<\/span> 条，这个定义决定了每轮候选范围。\n<\/li><li>\n<strong>比较结果可以保留<\/strong>。两两比较的胜负不只服务于当前这一步；树结构把败者与其他对手的关系保存下来，后续名次不必重赛。\n<\/li><li>\n<strong>存储能放下树或候选段<\/strong>。朴素选择在原数组上扫描；锦标赛树需要额外结点空间记录父子关系与中间胜者。\n<\/li><li>\n<strong>比较与交换分开记账<\/strong>。选择方法瓶颈在比较，交换次数很少；记录宽、键窄时，少搬记录这一特征比比较次数更实际。\n<\/ol>\n<p>依赖链方向：确定第 <span class=\"katex-inline\">j<\/span> 小 → 扫描剩余段找最小 / 建树保留比较 → 固定已排序段 → 比较次数求和 → 树选择路径更新降到 <span class=\"katex-inline\">N\\lg N<\/span>。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：朴素选择的轮次<\/h3>\n<p>第 1 轮从 <span class=\"katex-inline\">N<\/span> 条记录选最小，第 2 轮从剩余 <span class=\"katex-inline\">N-1<\/span> 条选，……，第 <span class=\"katex-inline\">N-1<\/span> 轮剩 2 条比较一次。已排序段在前段，未排序段在后段，每轮把选出的记录与未排序段首位置交换。<\/p>\n<h3>第二步：朴素比较次数求和<\/h3>\n<p>第 <span class=\"katex-inline\">j<\/span> 轮候选长度 <span class=\"katex-inline\">N-j+1<\/span>，找最小需要 <span class=\"katex-inline\">N-j<\/span> 次比较：<\/p>\n<div class=\"katex-block\">S_{\\text{直}}=\\sum_{j=1}^{N-1}(N-j)=\\sum_{k=1}^{N-1}k=\\frac{N(N-1)}2.<\/div>\n<p>输入有序或逆序对这个次数没有影响：扫描确认最小的动作一次不能少。交换次数至多 <span class=\"katex-inline\">N-1<\/span> 次，每轮一次定位交换。<\/p>\n<h3>第三步：锦标赛建树<\/h3>\n<p><span class=\"katex-inline\">N<\/span> 个记录置于叶子。相邻叶子两两比较，较小键上浮；父结点再两两比较，直到根。首轮比较次数约 <span class=\"katex-inline\">N-1<\/span>：每比较一次淘汰一个结点，<span class=\"katex-inline\">N<\/span> 个叶子淘汰到根剩 1 个，淘汰 <span class=\"katex-inline\">N-1<\/span> 次。根结点是全局最小。<\/p>\n<h3>第四步：冠军移出后的更新<\/h3>\n<p>冠军叶子置为 <span class=\"katex-inline\">\\infty<\/span>（大于所有键）。从该叶子到根的路径上，每层用兄弟结点与当前父结点值重做比较；路径外子树的胜者不受影响。树高 <span class=\"katex-inline\">h=\\lceil\\lg N\\rceil<\/span>，重做一层一次比较，后续每个记录约 <span class=\"katex-inline\">h<\/span> 次比较。<\/p>\n<h3>第五步：树选择总比较次数<\/h3>\n<div class=\"katex-block\">S_{\\text{树}}\\approx(N-1)+(N-1)\\lceil\\lg N\\rceil,<\/div>\n<p>首轮 <span class=\"katex-inline\">N-1<\/span> 次，之后 <span class=\"katex-inline\">N-1<\/span> 个名次各沿路径更新。主项 <span class=\"katex-inline\">N\\lg N<\/span>。<\/p>\n<h3>第六步：树高与叶子数的关系<\/h3>\n<p>满二叉树第 <span class=\"katex-inline\">h<\/span> 层最多 <span class=\"katex-inline\">2^h<\/span> 个叶子；<span class=\"katex-inline\">N<\/span> 个叶子需要 <span class=\"katex-inline\">2^{h-1}&lt;N\\le 2^h<\/span>，故 <span class=\"katex-inline\">h=\\lceil\\lg N\\rceil<\/span>。路径长度就是树高，更新比较次数受树高约束。<\/p>\n<h3>第七步：为什么保留比较能省钱<\/h3>\n<p>朴素选择中，A 胜过 B、B 胜过 C 的信息在选出 A 后就丢掉；下一轮找第二名要把 B、C 等重新比一遍。锦标赛树里 B 所在子树的层级结果仍在，第二名只可能是冠军路径上的败者或其子树胜者，更新路径即可定位，不必全段重赛。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：<span class=\"katex-inline\">N=4<\/span> 朴素选择<\/h3>\n<p>输入 <span class=\"katex-inline\">[4,2,7,1]<\/span>。<\/p>\n<ul><li>\n第 1 轮比 4 与 2（留 2），比 2 与 7（留 2），比 2 与 1（留 1），3 次比较，交换得 <span class=\"katex-inline\">[1,2,7,4]<\/span>；\n<\/li><li>\n第 2 轮比 2 与 7、2 与 4，2 次比较；\n<\/li><li>\n第 3 轮比 7 与 4，1 次；\n<\/li><li>\n共 6 次，<span class=\"katex-inline\">4\\cdot3/2=6<\/span>。\n<\/ul>\n<h3>算例 2：<span class=\"katex-inline\">N=8<\/span> 树选择<\/h3>\n<p>首轮建树 <span class=\"katex-inline\">8-1=7<\/span> 次比较；树高 <span class=\"katex-inline\">\\lceil\\lg 8\\rceil=3<\/span>；后续 7 个名次各 3 次，约 <span class=\"katex-inline\">7+21=28<\/span> 次。朴素选择 <span class=\"katex-inline\">8\\cdot7/2=28<\/span> 次，规模小差距不明显；<span class=\"katex-inline\">N=1024<\/span> 时朴素约 52 万次，树选择约 <span class=\"katex-inline\">1023+1023\\cdot10\\approx1.13<\/span> 万次。<\/p>\n<h3>算例 3：交换次数对照<\/h3>\n<p><span class=\"katex-inline\">N=100<\/span> 朴素选择比较 4950 次，交换至多 99 次；记录宽 500 字节时，交换搬移量与比较读键量不是一个量级，选择排序适合搬移昂贵的场景。<\/p>\n<h3>算例 4：有序输入不改善选择<\/h3>\n<p>输入 <span class=\"katex-inline\">1,2,3,4<\/span>，朴素选择第 1 轮仍要比 2 与 3、3 与 4 才能确认 1 最小；共 6 次，与逆序输入相同。插入排序在这个输入上只要 3 次比较，两类方法对有序输入的反应相反。<\/p>\n<h3>算例 5：冠军置无穷大<\/h3>\n<p>冠军叶子置 <span class=\"katex-inline\">\\infty<\/span> 后，该侧兄弟沿路径上浮；若忘记置 <span class=\"katex-inline\">\\infty<\/span>，冠军值残留会在更新中再次上浮，选出重复记录。<span class=\"katex-inline\">\\infty<\/span> 标识与外部排序游程末尾的哨兵作用相同。<\/p>\n<h3>算例 6：树高核对<\/h3>\n<p><span class=\"katex-inline\">N=5<\/span>：<span class=\"katex-inline\">2^2=4&lt;5\\le 8=2^3<\/span>，树高 3；路径更新每层一次，后续名次约 3 次比较。叶子不满时最底层空位以 <span class=\"katex-inline\">\\infty<\/span> 补足，不影响胜者判定。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>选出最小后重建整树<\/strong>：每轮都从叶子重新两两比较，树选择退回 <span class=\"katex-inline\">N^2/2<\/span>；路径更新是保留首轮成果的关键。\n<\/li><li>\n<strong>已排序段与候选段不分开<\/strong>：已选最小再次进入候选，会被重复选出，序列出现重复且缺项。\n<\/li><li>\n<strong>比较结果不存父子关系<\/strong>：没有树结构保存层级胜者，败者关系随扫描结束丢失，下一轮只能全段重赛。\n<\/li><li>\n<strong>把交换次数当成选择排序瓶颈<\/strong>：选择交换最多 <span class=\"katex-inline\">N-1<\/span> 次，瓶颈在比较；优化搬移而不减少比较，整体收益有限。\n<\/ul>\n<h2>补足推导：选择树向多路合并的推广<\/h2>\n<p>锦标赛树在 §5.4.1 扩展为 <span class=\"katex-inline\">P<\/span> 路合并的选择树：<span class=\"katex-inline\">P<\/span> 个游程各取首条记录置于叶子，根给出当前最小；输出最小后从该游程补入下一条，沿路径更新。树高 <span class=\"katex-inline\">\\lceil\\lg P\\rceil<\/span>，每选一个记录约 <span class=\"katex-inline\">\\lg P<\/span> 次比较。<span class=\"katex-inline\">P<\/span> 增大时树高增长很慢，但同时打开的游程数与内存缓存记录数随之增加。朴素 <span class=\"katex-inline\">P<\/span> 路选最小要 <span class=\"katex-inline\">P-1<\/span> 次比较，树选择把这一步压到对数，外部排序遍数优化依赖的正是这个比较机制。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n朴素选择每轮候选长度减几？比较次数求和公式是什么？\n<\/li><li>\n为什么选择排序的比较次数不受输入有序程度影响？\n<\/li><li>\n锦标赛树首轮比较多少次？这个数字与淘汰结点数有什么关系？\n<\/li><li>\n冠军移出后为什么只更新一条路径？路径外子树为什么不必重做？\n<\/li><li>\n树选择需要什么额外存储？朴素选择在原数组上能否直接建树？\n<\/ol>\n<h2>扩展推演：选择树的更新细节与多路推广<\/h2>\n<p>树选择首轮建树后，冠军叶子置 <span class=\"katex-inline\">\\infty<\/span>。更新时从该叶子向上：父结点比较左右子结点当前值，胜者上浮；兄弟子树的胜者没有变化，不必重做。路径长度等于树高 <span class=\"katex-inline\">\\lceil\\lg N\\rceil<\/span>。若冠军位置不在最底层，空位以 <span class=\"katex-inline\">\\infty<\/span> 补足，比较规则不变。后续名次按同样方式逐个产出：每次输出当前根，更新路径，再取下一根。<\/p>\n<p>朴素选择与树选择的比较次数差别，在小规模不明显：<span class=\"katex-inline\">N=4<\/span> 两者都是 6 次量级；<span class=\"katex-inline\">N=1024<\/span> 时朴素约 52 万次，树选择约 1.13 万次。规模放大后对数与二次的差距才拉开。树选择的代价是额外结点空间：每个内部结点要存当前胜者值与父子关系；朴素选择在原数组上扫描，不需要这层结构。<\/p>\n<p>选择排序的交换次数少，是它在大记录场景的主要价值：每轮至多一次定位交换，<span class=\"katex-inline\">N-1<\/span> 次封顶。插入排序每轮可能上移多条记录，冒泡相邻交换次数更多；记录宽度越大，选择方法搬移昂贵的优势越突出。反过来记录很窄时，比较次数成为主项，朴素选择的二阶比较就不划算。<\/p>\n<p>推广到 <span class=\"katex-inline\">P<\/span> 路合并：<span class=\"katex-inline\">P<\/span> 个游程首条记录置于叶子，根给当前最小；输出后补入新记录，沿路径更新。树高 <span class=\"katex-inline\">\\lceil\\lg P\\rceil<\/span>，单步比较 <span class=\"katex-inline\">\\lg P<\/span> 次。朴素 <span class=\"katex-inline\">P<\/span> 路扫描要 <span class=\"katex-inline\">P-1<\/span> 次比较，<span class=\"katex-inline\">P=8<\/span> 时差一倍以上。外部排序的选择树就是锦标赛树的多路形态，冠军移出后补入的是下一游程记录，而不是 <span class=\"katex-inline\">\\infty<\/span>。<\/p>\n<p>补充手算 <span class=\"katex-inline\">N=6<\/span>：朴素比较 <span class=\"katex-inline\">6\\cdot5/2=15<\/span> 次；树选择首轮 5 次，后续 5 个名次各 <span class=\"katex-inline\">\\lceil\\lg6\\rceil=3<\/span> 次，约 20 次量级。小规模树选择未必占优，结构收益随 <span class=\"katex-inline\">N<\/span> 增长。<\/p>\n<h2>再补充：选择类方法的适用边界<\/h2>\n<p>朴素选择不要求输入有序，比较次数稳定在二阶；它不保证稳定：交换最小记录到前段时，可能越过相等键。树选择保留比较结果，但同样要在交换环节注意等值次序。选择方法的主要场景是记录宽、键窄、搬移昂贵；记录很窄时，二阶比较不如换划分或归并方法。<\/p>\n<p>选择排序与冒泡常被并列：选择每轮一次定位交换，冒泡一轮多次相邻交换。选择的交换次数封顶 <span class=\"katex-inline\">N-1<\/span>，冒泡交换次数与反序数相关。树选择把比较压到对数，但额外树结构在小规模时得不偿失；<span class=\"katex-inline\">N<\/span> 越大，保留首轮比较的收益越明显。<\/p>\n<p>外部 <span class=\"katex-inline\">P<\/span> 路合并的选择树与锦标赛树同构：叶子是各游程首条记录，根给当前最小；区别只在移出冠军后补入下一游程记录。树高 <span class=\"katex-inline\">\\lceil\\lg P\\rceil<\/span>，<span class=\"katex-inline\">P<\/span> 增大时比较代价增长平缓，缓冲与通道占用线性增长。<\/p>\n<h2>边界补充<\/h2>\n<p>选择类方法的适用边界由比较代价与搬移代价两条线决定：朴素选择比较次数稳定在二阶，不因输入有序下降；树选择保留首轮比较把比较压到对数，但要额外维护树结构。记录宽、键窄时选择的少量交换是主要优点；记录很窄时二阶比较仍是瓶颈，选择方法相对插入、归并没有优势。稳定性要在比较与交换规则中单独维持，等值次序不会自动保留。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">N=6<\/span> 朴素选择的比较次数，并与树选择量级对照。\n<\/li><li>\n树高 <span class=\"katex-inline\">\\lceil\\lg N\\rceil<\/span> 由什么不等式确定？叶子不满时怎么处理？\n<\/li><li>\n选择排序为什么适合记录宽、键窄的场合？比较与交换哪一项是瓶颈？\n<\/li><li>\n冠军叶子置 <span class=\"katex-inline\">\\infty<\/span> 的作用是什么？不置会出现什么错误？\n<\/li><li>\n多路合并的选择树与锦标赛树在结构上是什么关系？\n<\/ol><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/计算机程序与设计艺术/图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版 (高德纳（Donald E.Knuth）著；贾洪峰译, (美) 克努特, (Knuth etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.129<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">选择排序与锦标赛树：逐次选最小，树选择把重复比较压到 $N\\lg N$<\/a><\/span><\/div><h1>合并排序与游程：两路合并、自然两路合并与 <span class=\"katex-inline\">N\\lg N<\/span> 归并结构<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch01（原书 §5.2.4 合并排序，PDF 第 129–131 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>插入、选择、交换类方法在大规模随机输入下退回二阶量级。合并排序换一条思路：先把文件切成短段，每段内部有序，再两两归并成长段，直到整文件有序。需要解决的困难是：两个有序段按什么规则归并成一个有序段，怎样识别输入里已经存在的有序短段（游程），以及归并轮数怎样随段长翻倍增长。<\/p>\n<h2>定义<\/h2>\n<p><strong>游程（run）<\/strong>：文件中一段按键非递减顺序连续排列的记录；它是合并排序的基本归并单位。<\/p>\n<p><strong>两路合并<\/strong>：给定两个有序文件 <span class=\"katex-inline\">R_1\\le\\cdots\\le R_m<\/span> 与 <span class=\"katex-inline\">S_1\\le\\cdots\\le S_n<\/span>，每次比较两段的首条记录，输出键较小者，从该段删去；重复直到两段都空（PDF 第 129 页，书中该两路合并过程称算法 M）。<\/p>\n<p><strong>自然两路合并排序<\/strong>：先按输入中已有的递增段划分游程，再逐轮把相邻游程两两合并；游程边界由「下坡」（后一条键小于前一条）确定（PDF 第 130 页前后，书中称算法 N）。<\/p>\n<p><strong>直接两路合并<\/strong>：不识别自然游程，先把记录两两配对成长度 2 的有序段，再逐轮合并；与自然两路合并的流程图相近，初始分段方式不同（PDF 第 132 页前后）。<\/p>\n<p><strong>正例<\/strong>：有序段 <span class=\"katex-inline\">[1,4,7]<\/span> 与 <span class=\"katex-inline\">[2,5,9]<\/span>，首条 1 与 2 比，输出 1；再 4 与 2 比，输出 2；依次得 <span class=\"katex-inline\">1,2,4,5,7,9<\/span>。<strong>反例<\/strong>：归并时只比较段内而跨段取错，会把大键先输出，结果段重新无序。<\/p>\n<h2>原理推导<\/h2>\n<p>一轮两路合并处理 <span class=\"katex-inline\">m+n<\/span> 条记录，每条输出前至多比较一次，比较与移动都与记录数成正比。<span class=\"katex-inline\">N<\/span> 条记录的直接两路合并：第 1 轮段长 2，第 2 轮段长 4，第 <span class=\"katex-inline\">k<\/span> 轮段长 <span class=\"katex-inline\">2^k<\/span>；段长翻倍 <span class=\"katex-inline\">\\lceil\\lg N\\rceil<\/span> 轮后整文件有序。每轮扫遍全部 <span class=\"katex-inline\">N<\/span> 条记录，总工作量<\/p>\n<div class=\"katex-block\">M_{\\text{直}}\\approx N\\lceil\\lg N\\rceil,<\/div>\n<p>量级 <span class=\"katex-inline\">N\\lg N<\/span>。自然两路合并在输入已有游程时，初始段长大于 1，轮数可能少于 <span class=\"katex-inline\">\\lceil\\lg N\\rceil<\/span>；若输入完全有序，自然游程只有 1 个，一轮即完成。<\/p>\n<p>合并的代价口径：通常需要与原文件等量的额外存放区，供归并结果写入；比较选最小的动作与选择排序同源，区别在归并双方各自有序，比较结果直接决定输出次序。冯·诺伊曼早在 1945 年就提出过合并排序（PDF 第 130 页前后）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：两段各自有序；顺序存储下需要辅助数组放合并结果；方法稳定（相等键优先取左侧段，保持原次序）。\n<\/li><li>\n边界一：<span class=\"katex-inline\">N\\lg N<\/span> 主项与决策树下界同量级；额外空间是合并排序与原地划分类方法的主要差别。\n<\/li><li>\n失败案例一：归并结果写回原段覆盖尚未读完的记录，会破坏待合并输入；辅助区域或交替读写顺序必须安排好。\n<\/li><li>\n失败案例二：不区分自然游程，把已有序长段拆成短段再合并，浪费已有秩序。\n<\/li><li>\n边界二：链表实现合并可以不搬移记录、只改指针；数组实现则受辅助空间约束。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>合并 vs 选择<\/strong>：选择每次从一个无序段挑最小；合并在两个有序段之间选当前最小，双方内部已经有序。\n<\/li><li>\n<strong>自然两路 vs 直接两路<\/strong>：前者按输入已有游程分段，后者强制从长度 2 配对；轮数差别取决于输入有序程度。\n<\/li><li>\n<strong>合并排序 vs 快速排序<\/strong>：合并先分小段再有序归并，主项稳定 <span class=\"katex-inline\">N\\lg N<\/span>；快速就地划分递归，期望 <span class=\"katex-inline\">N\\ln N<\/span> 但最坏二阶；合并额外空间大，快速栈深度需控制。\n<\/li><li>\n<strong>游程 vs 已排序段<\/strong>：游程是输入中现成的有序连续段；已排序段是算法逐轮固定下来的前缀。\n<\/ul>\n<p><strong>常见误解<\/strong>：合并排序常被说成「稳定的 <span class=\"katex-inline\">N\\lg N<\/span> 方法」，但稳定性依赖等值记录优先取左侧段这条规则；取段顺序写反，等值记录相对次序就被调换。另一个误解是以为归并不需要额外空间：数组实现必须有存放合并结果的区域，原地覆盖会冲掉未读输入；链表实现省的是记录搬移，不是结构上的归并过程。自然两路合并利用现成游程，但游程边界按下坡识别，输入中若有等值连续段，延续规则要预先固定。<\/p>\n<h2>联系<\/h2>\n<p>前置：c04 选择当前最小的比较机制、c01 的有序目标。后继：c06 的下界说明 <span class=\"katex-inline\">N\\lg N<\/span> 主项已是比较类最优；c07 外部排序把两路合并推广到 <span class=\"katex-inline\">P<\/span> 路合并，游程作为外部归并单位被替代选择拉长；查找部分的有序表前提由这类归并方法产出。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（合并排序与游程：两路合并、自然两路合并与 $N\\lg N$ 归并结构）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：两路归并规则、游程识别与轮数递推<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把合并排序推到底，先往回追四层前提：<\/p>\n<ol><li>\n<strong>参与归并的双方必须各自有序<\/strong>。两路合并选当前最小的依据，是两段首条就是本段剩余最小；任一段内部无序，首条不能代表段内最小，归并规则失效。\n<\/li><li>\n<strong>输出次序由跨段比较决定<\/strong>。段内次序已经固定，每一步只在两段首条之间比较；比较结果直接决定下一条输出谁。\n<\/li><li>\n<strong>初始分段可以利用输入秩序<\/strong>。自然游程是现成有序段；直接两路不利用秩序，强制短段起步。两种分段在归并规则上相同，差别只在第一轮段长。\n<\/li><li>\n<strong>归并结果需要存放位置<\/strong>。数组实现不能原地覆盖未读输入，辅助区域或双区交替是结构前提；链表实现则通过改指针绕开搬移。\n<\/ol>\n<p>依赖链方向：两段有序 → 首条比较选最小 → 输出并删去 → 段长翻倍归并 → 轮数 <span class=\"katex-inline\">\\lceil\\lg N\\rceil<\/span> → 自然游程压缩初始段长。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：两路合并的单步规则<\/h3>\n<p>设两段 <span class=\"katex-inline\">A=[a_1\\le\\cdots\\le a_m]<\/span>，<span class=\"katex-inline\">B=[b_1\\le\\cdots\\le b_n]<\/span>。比较 <span class=\"katex-inline\">a_1<\/span> 与 <span class=\"katex-inline\">b_1<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">a_1\\le b_1<\/span>：输出 <span class=\"katex-inline\">a_1<\/span>，<span class=\"katex-inline\">A<\/span> 段首指针后移；\n<\/li><li>\n<span class=\"katex-inline\">a_1&gt;b_1<\/span>：输出 <span class=\"katex-inline\">b_1<\/span>，<span class=\"katex-inline\">B<\/span> 段首指针后移。\n<p>一段耗尽后，另一段剩余部分整体追加。相等键优先取左侧段，保持输入相对次序，方法稳定。<\/p>\n<\/ul>\n<h3>第二步：单轮代价<\/h3>\n<p><span class=\"katex-inline\">m+n<\/span> 条记录各输出一次；每条记录输出前至多一次跨段比较，段耗尽后的追加不再比较。比较与移动都与 <span class=\"katex-inline\">m+n<\/span> 成正比，单轮工作量 <span class=\"katex-inline\">O(m+n)<\/span>。<\/p>\n<h3>第三步：直接两路的段长递推<\/h3>\n<p>第 1 轮把相邻两记录配对成 <span class=\"katex-inline\">N/2<\/span> 个长度 2 的有序段；第 2 轮相邻两段并成长度 4；第 <span class=\"katex-inline\">k<\/span> 轮段长 <span class=\"katex-inline\">2^k<\/span>。段长满足 <span class=\"katex-inline\">L_k=2L_{k-1}<\/span>。当 <span class=\"katex-inline\">2^k\\ge N<\/span> 时整文件成为一段，<span class=\"katex-inline\">k=\\lceil\\lg N\\rceil<\/span>。<\/p>\n<h3>第四步：总工作量<\/h3>\n<p>每轮扫遍全部 <span class=\"katex-inline\">N<\/span> 条记录，每条约一次比较加一次移动，共 <span class=\"katex-inline\">\\lceil\\lg N\\rceil<\/span> 轮：<\/p>\n<div class=\"katex-block\">M_{\\text{直}}\\approx N\\lceil\\lg N\\rceil.<\/div>\n<p><span class=\"katex-inline\">N=8<\/span>：3 轮；<span class=\"katex-inline\">N=1024<\/span>：10 轮；<span class=\"katex-inline\">N=10^6<\/span>：约 20 轮。<\/p>\n<h3>第五步：自然游程识别<\/h3>\n<p>从左向右扫描，当前键不小于前一键则延续当前游程；遇到后一键更小（下坡），当前游程结束、新游程开始。输入 <span class=\"katex-inline\">3,1,4,2<\/span> 的游程为 <span class=\"katex-inline\">[3]<\/span>、<span class=\"katex-inline\">[1,4]<\/span>、<span class=\"katex-inline\">[2]<\/span>；输入 <span class=\"katex-inline\">1,2,3,4<\/span> 只有一个游程。自然合并的初始段长就是识别出的游程长度。<\/p>\n<h3>第六步：自然合并轮数<\/h3>\n<p>设最长初始游程长度为 <span class=\"katex-inline\">L_0<\/span>，段长每轮翻倍；若 <span class=\"katex-inline\">L_0<\/span> 已较大，达到 <span class=\"katex-inline\">N<\/span> 所需轮数少于 <span class=\"katex-inline\">\\lceil\\lg N\\rceil<\/span>。完全有序输入 <span class=\"katex-inline\">L_0=N<\/span>，轮数为 0 次额外归并；逆序输入自然游程全为 1，退化为直接两路。<\/p>\n<h3>第七步：稳定性与等值处理<\/h3>\n<p>等值记录跨段相遇时，先取先出现（左侧）段的记录；若取反，等值记录相对次序被调换，稳定性破坏。合并排序的稳定性来自这条取段规则，而不是比较本身。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：两路归并手算<\/h3>\n<p><span class=\"katex-inline\">A=[1,4,7]<\/span>，<span class=\"katex-inline\">B=[2,5,9]<\/span>。<\/p>\n<ul><li>\n比 1、2 → 出 1；比 4、2 → 出 2；比 4、5 → 出 4；比 7、5 → 出 5；比 7、9 → 出 7；追加 9。\n<\/li><li>\n结果 <span class=\"katex-inline\">[1,2,4,5,7,9]<\/span>，跨段比较 5 次。\n<\/ul>\n<h3>算例 2：<span class=\"katex-inline\">N=8<\/span> 直接两路<\/h3>\n<p>轮 1：4 个长度 2 段；轮 2：2 个长度 4 段；轮 3：1 个长度 8 段。每轮 8 条记录，共 24 条次移动量级。<\/p>\n<h3>算例 3：自然游程压缩<\/h3>\n<p>输入 <span class=\"katex-inline\">[1,3,5,2,4,6,0]<\/span>：游程 <span class=\"katex-inline\">[1,3,5]<\/span>、<span class=\"katex-inline\">[2,4,6]<\/span>、<span class=\"katex-inline\">[0]<\/span>。首轮合并前两段得 <span class=\"katex-inline\">[1,2,3,4,5,6]<\/span>，再与 <span class=\"katex-inline\">[0]<\/span> 合并；比直接从长度 2 配对少一轮短段归并。<\/p>\n<h3>算例 4：等值稳定性<\/h3>\n<p><span class=\"katex-inline\">A=[5_a,7]<\/span>，<span class=\"katex-inline\">B=[5_b,9]<\/span>，<span class=\"katex-inline\">a<\/span> 先于 <span class=\"katex-inline\">b<\/span>。归并取 <span class=\"katex-inline\">5_a<\/span> 再取 <span class=\"katex-inline\">5_b<\/span>，次序保持；若取 <span class=\"katex-inline\">5_b<\/span> 在前，<span class=\"katex-inline\">a,b<\/span> 次序调换。<\/p>\n<h3>算例 5：辅助空间对照<\/h3>\n<p>数组合并需要等量辅助数组存归并结果；链表合并只改后继指针，节点本身不搬动。记录宽、指针窄时链表方案节省搬移，但链表遍历没有随机访问优势。<\/p>\n<h3>算例 6：轮数边界<\/h3>\n<p><span class=\"katex-inline\">N=100<\/span>：<span class=\"katex-inline\">\\lceil\\lg 100\\rceil=7<\/span> 轮；<span class=\"katex-inline\">N=1000<\/span>：10 轮；<span class=\"katex-inline\">N=10000<\/span>：14 轮。段长翻倍速度决定轮数只随对数增长。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>参与归并的段内部无序<\/strong>：段首不是段内最小，跨段比较选出的「当前最小」可能大于段内后续键，输出序列重新出现反序。\n<\/li><li>\n<strong>归并结果覆盖未读输入<\/strong>：辅助区不足时，写入动作冲掉后面还要比较的记录，待合并数据丢失；双区交替或先复制到辅助区是必要安排。\n<\/li><li>\n<strong>忽略自然游程强制短段起步<\/strong>：已有序长段被拆散重排，已有秩序白费，轮数上升。\n<\/li><li>\n<strong>等值键随意取段<\/strong>：相对次序被调换，方法退化为不稳定；二次排序场景下第一轮成果被冲掉。\n<\/ul>\n<h2>补足推导：归并排序与外部排序的衔接<\/h2>\n<p>内部合并在内存中完成段内归并；外部排序面对装不下的文件，先在内存受限条件下生成初始游程，再把游程写到外部介质，<span class=\"katex-inline\">P<\/span> 路合并逐轮并长。内部两路合并的「两段有序、首条比较」规则在 <span class=\"katex-inline\">P<\/span> 路情形扩展为 <span class=\"katex-inline\">P<\/span> 段首条比较，选择树把选最小的代价从 <span class=\"katex-inline\">P-1<\/span> 次压到 <span class=\"katex-inline\">\\lg P<\/span>。游程概念从内部自然延伸到外部：外部游程长度受替代选择控制，游程数 <span class=\"katex-inline\">S<\/span> 决定合并遍数 <span class=\"katex-inline\">\\lceil\\log_P S\\rceil<\/span>。可以说 §5.2.4 的归并结构是 §5.4 外部排序的内部原型。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n两路合并每一步比较哪两条记录？一段耗尽后剩余部分怎样处理？\n<\/li><li>\n直接两路的段长按什么规律翻倍？达到 <span class=\"katex-inline\">N<\/span> 需要多少轮？\n<\/li><li>\n自然游程按什么条件结束？有序输入与逆序输入各有多少游程？\n<\/li><li>\n合并排序为什么需要等量辅助空间？链表实现绕开了哪一项？\n<\/li><li>\n等值记录跨段相遇时取哪一段？这条规则保证了什么性质？\n<\/ol>\n<h2>扩展推演：归并的空间实现、稳定性与轮数边界<\/h2>\n<p>数组合并需要等量辅助区：归并结果先写入辅助数组，再拷回原段；若直接在原数组两段上覆盖写入，尚未比较的记录会被冲掉。双区交替方案把相邻两轮的读写方向对调，省去回拷；链表合并只改后继指针，节点本身不搬动，是空间代价最低的归并形态。记录宽度越大，链表方案省搬移的价值越高，但链表遍历不支持随机访问。<\/p>\n<p>稳定性规则再拆一层：两段各有等值键时，先取左段记录。左段在输入中先出现，这个顺序保留下来；若取反，等值记录相对次序调换。合并排序因此是稳定排序方法，前提是实现遵守取段规则。等值处理与快速排序不同：归并不把等值往一侧赶，而是按来源段固定先后。<\/p>\n<p>轮数边界：直接两路段长 <span class=\"katex-inline\">2^k<\/span>，达到 <span class=\"katex-inline\">N<\/span> 需 <span class=\"katex-inline\">\\lceil\\lg N\\rceil<\/span> 轮。自然合并按初始游程长度 <span class=\"katex-inline\">L_0<\/span> 起步，若 <span class=\"katex-inline\">L_0&gt;N<\/span> 一轮即完成；逆序输入 <span class=\"katex-inline\">L_0=1<\/span>，退化为直接两路。游程识别按下坡：当前键小于前一键时新游程开始；等值连续段延续当前游程。<\/p>\n<p>补充手算 <span class=\"katex-inline\">N=8<\/span> 自然合并：输入 <span class=\"katex-inline\">[3,1,4,2,6,5,8,7]<\/span>，游程 <span class=\"katex-inline\">[3]<\/span>、<span class=\"katex-inline\">[1,4]<\/span>、<span class=\"katex-inline\">[2,6]<\/span>、<span class=\"katex-inline\">[5,8]<\/span>、<span class=\"katex-inline\">[7]<\/span>。第一轮合并相邻游程得 <span class=\"katex-inline\">[1,3,4]<\/span>、<span class=\"katex-inline\">[2,5,6,8]<\/span>、<span class=\"katex-inline\">[7]<\/span>；第二轮并成 <span class=\"katex-inline\">[1,2,3,4,5,6,8]<\/span>、<span class=\"katex-inline\">[7]<\/span>；第三轮全局有序。比完全逆序输入的轮数对照要看初始游程长度。<\/p>\n<p>与内部其他 <span class=\"katex-inline\">N\\lg N<\/span> 方法对照：合并排序主项稳定，不依赖随机切分；快速排序期望 <span class=\"katex-inline\">2N\\ln N<\/span> 但最坏二阶。合并的代价是额外空间，快速的代价是栈深度与最坏概率。外部排序把两路归并扩成 <span class=\"katex-inline\">P<\/span> 路，游程从内部现成段变成内存受限生成的初始段，遍数公式相应换成 <span class=\"katex-inline\">\\lceil\\log_P S\\rceil<\/span>。<\/p>\n<h2>再补充：归并稳定性、空间与轮数细节<\/h2>\n<p>等值记录跨段相遇时取左段，是合并排序稳定的唯一来源；取段规则写反，稳定性随即丧失。归并不把等值往一侧赶，这与快速排序的等值处理不同。两段长度悬殊时，长段剩余部分整体追加，追加段不再参与比较。<\/p>\n<p>空间上数组实现需要等量辅助区；双区交替省去回拷，链表实现只改指针。若记录极宽，链表方案搬移最省；若需要随机访问，链表不适用。自然合并的游程识别依赖下坡判定，等值连续段延续当前游程；游程长度分布决定首轮后段长。<\/p>\n<p>轮数按段长翻倍计：直接两路 <span class=\"katex-inline\">\\lceil\\lg N\\rceil<\/span> 轮；自然合并从 <span class=\"katex-inline\">L_0<\/span> 起步，轮数可能更少。归并每轮扫遍全部记录，比较与移动都在 <span class=\"katex-inline\">O(N)<\/span>，总工作量 <span class=\"katex-inline\">N\\lg N<\/span>。外部排序把两路扩成 <span class=\"katex-inline\">P<\/span> 路，游程换成替代选择生成的初始段，遍数按 <span class=\"katex-inline\">\\log_P S<\/span> 计。<\/p>\n<h2>边界小结<\/h2>\n<p>归并方法的前提是参与合并的双方各自有序；单段无序时首条不代表段内最小，跨段选择会输出大键。空间实现上数组需要等量辅助区，链表靠改指针；稳定性来自等值取左段的固定规则。自然合并利用现成游程，轮数随初始游程长度下降；逆序输入退化为直接两路。外部 <span class=\"katex-inline\">P<\/span> 路合并是内部两路归并的多路推广，遍数口径换成 <span class=\"katex-inline\">\\log_P S<\/span>。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出两路合并单步规则，并说明两段各自有序为什么是前提。\n<\/li><li>\n<span class=\"katex-inline\">N=16<\/span> 直接两路共多少轮？每轮处理多少条记录？\n<\/li><li>\n自然合并与直接合并在初始分段上的差别是什么？轮数受什么影响？\n<\/li><li>\n合并排序的 <span class=\"katex-inline\">N\\lg N<\/span> 主项与决策树下界是什么关系？额外空间代价是什么？\n<\/li><li>\n外部 <span class=\"katex-inline\">P<\/span> 路合并相对内部两路合并，选最小的比较机制做了什么推广？\n<\/ol><\/div><\/details>", "c06": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/计算机程序与设计艺术/图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版 (高德纳（Donald E.Knuth）著；贾洪峰译, (美) 克努特, (Knuth etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.146<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">合并排序与游程：两路合并、自然两路合并与 $N\\lg N$ 归并结构<\/a><\/span><\/div><h1>比较排序的信息论下界：决策树、<span class=\"katex-inline\">\\lceil\\lg N!\\rceil<\/span> 与 Stirling 放缩<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch02（原书 §5.3.1 比较次数最少的排序，PDF 第 146 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>前面几类内部排序各有比较次数公式，但都没有回答「最少到底能少到多少」。需要一个不依赖具体算法的下界：无论程序员多聪明，只靠两两键比较的排序方法，最坏比较次数不可能低于某个数。这个概念用决策树把所有可能的比较路径画出来，用叶子数约束树高；再用 Stirling 公式把阶乘放缩成 <span class=\"katex-inline\">N\\lg N<\/span> 量级，说明现有 <span class=\"katex-inline\">N\\lg N<\/span> 方法离下界还有多远。<\/p>\n<h2>定义<\/h2>\n<p><strong>决策树<\/strong>：一次比较排序过程的树形表示。内部结点是一次键比较；两个分支分别对应 <span class=\"katex-inline\">K_i&lt;K_j<\/span> 与 <span class=\"katex-inline\">K_i&gt;K_j<\/span>（键互不相同的假定下）；叶子是一种最终排列结果。<\/p>\n<p><strong>比较排序<\/strong>：排序动作只依赖两两键比较的大小结果；基于基数、数字划分的方法不在这个模型内。<\/p>\n<p><strong>下界<\/strong>：所有合法决策树高度的最小值；树高即最坏情形从根到叶的比较次数。<\/p>\n<p><strong>Stirling 公式<\/strong>：<span class=\"katex-inline\">N!\\approx (N/e)^N\\sqrt{2\\pi N}<\/span>，用于把阶乘换成指数形式以便取对数。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">N=3<\/span> 共有 6 种排列，决策树至少 6 片叶子；二叉树高度 2 最多 4 片叶子，高度 3 最多 8 片，所以下界为 3 次比较。<strong>反例<\/strong>：把基数分桶算作比较模型内的方法，会用决策树叶子数约束它，得到不适用的结论。<\/p>\n<h2>原理推导<\/h2>\n<p><span class=\"katex-inline\">N<\/span> 个互不相同键的输入排列共 <span class=\"katex-inline\">N!<\/span> 种。不同排列不能落到同一片叶子：一片叶子对应一个确定次序，若两种排列共用叶子，算法只能给出其中一种次序，另一种被排错。因此叶子数 <span class=\"katex-inline\">L\\ge N!<\/span>。高度 <span class=\"katex-inline\">h<\/span> 的二叉树叶子数至多 <span class=\"katex-inline\">2^h<\/span>，代入：<\/p>\n<div class=\"katex-block\">2^h\\ge N!,\\quad h\\ge \\lceil\\lg N!\\rceil.<\/div>\n<p>用 Stirling 公式取对数：<\/p>\n<div class=\"katex-block\">\\ln N!\\approx N\\ln N-N+\\tfrac12\\ln(2\\pi N),<\/div>\n<p>换成以 2 为底：<\/p>\n<div class=\"katex-block\">\\lg N!\\approx N\\lg N-1.44N+\\tfrac12\\lg(2\\pi N).<\/div>\n<p>主项 <span class=\"katex-inline\">N\\lg N<\/span>，线性项系数约 1.44。合并排序、树选择等方法主项已是 <span class=\"katex-inline\">N\\lg N<\/span>，与下界同量级；差距集中在线性项与低阶部分，而不是主项。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：键互不相同，比较结果二分支；模型统计最坏情形比较次数。\n<\/li><li>\n边界一：下界只约束比较类方法。基数排序按位或字符分桶，一次操作区分多个类别，不服从叶子数论证。\n<\/li><li>\n失败案例一：允许等值三分支后，决策树结点度数变化，叶子计数要按三分支树重算。\n<\/li><li>\n失败案例二：把平均比较次数与最坏下界混在一起；<span class=\"katex-inline\">\\lceil\\lg N!\\rceil<\/span> 是最坏口径，平均最优值另按概率分布计算。\n<\/li><li>\n边界二：下界不规定具体算法，也不保证达到下界的方法容易实现；排序网络等额外结构在 §5.3.4 单独讨论。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>下界 vs 现有算法代价<\/strong>：下界是理论极限，算法是实际构造；<span class=\"katex-inline\">N\\lg N<\/span> 方法与下界同主项，不代表常数项已经最优。\n<\/li><li>\n<strong>比较模型 vs 基数模型<\/strong>：比较模型用大小关系分支；基数模型用键的数字位置分支；两者代价口径不同，不能互套下界。\n<\/li><li>\n<strong>最坏下界 vs 平均下界<\/strong>：决策树高度对应最坏路径；平均路径长度对应成功查找式的期望比较，分析对象不同。\n<\/li><li>\n<strong>叶子数 vs 结点数<\/strong>：约束来自叶子（排列结果）数，不是内部比较结点数。\n<\/ul>\n<p><strong>常见误解<\/strong>：有人拿「合并排序已经是 <span class=\"katex-inline\">N\\lg N<\/span>」声称达到下界；同主项不等于常数项最优，<span class=\"katex-inline\">\\lg N!<\/span> 的线性项与低阶部分仍有差距。另一个误解是把下界套到基数排序上：基数一次分多类，决策树不是二叉，叶子容量关系不同。还有一种混淆是把最坏下界当成平均最优值：<span class=\"katex-inline\">\\lceil\\lg N!\\rceil<\/span> 约束最坏路径，随机输入下的期望比较次数按概率加权，数值更小，两个量不能互相替代。下界只约束两两键比较这一动作，记录移动、桶分配、位查看的代价不计入这个框架；比较类方法达到 <span class=\"katex-inline\">N\\lg N<\/span> 主项后，优化空间集中在线性项与常数项，而不是主项本身。<\/p>\n<h2>联系<\/h2>\n<p>前置：c01 的 <span class=\"katex-inline\">N!<\/span> 排列总数、c05 的 <span class=\"katex-inline\">N\\lg N<\/span> 归并结构。后继：c07 外部排序不追求比较下界，而以扫描遍数为口径；查找部分的二分查找 <span class=\"katex-inline\">\\lg N<\/span> 下界，也是决策树分支数与候选区间对数的同一思路。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（比较排序的信息论下界：决策树、$\\lceil\\lg N!\\rceil$ 与 Stirling 放缩）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：决策树叶子计数、<span class=\"katex-inline\">N!<\/span> 下界与 Stirling 放缩<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把比较下界推到可验算，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先界定模型<\/strong>：只统计两两键比较，每次结果二分支；超出这个模型的操作（分桶、基数划分）先排除，否则叶子数论证无处落地。\n<\/li><li>\n<strong>输入空间是所有排列<\/strong>：<span class=\"katex-inline\">N<\/span> 个互不相同键共有 <span class=\"katex-inline\">N!<\/span> 种初始次序，每种次序都是算法必须正确处理的输入。\n<\/li><li>\n<strong>叶子必须与排列一一对应<\/strong>：一片叶子给出一个最终次序；两种排列共用叶子意味着算法在该路径上只能答对一种，正确性不允许。\n<\/li><li>\n<strong>树高与叶子数有确定关系<\/strong>：二叉树每层最多把叶子数翻倍，<span class=\"katex-inline\">h<\/span> 层高至多 <span class=\"katex-inline\">2^h<\/span> 片叶子；用这个容量关系反推高度下界。\n<\/ol>\n<p>依赖链方向：比较模型 → <span class=\"katex-inline\">N!<\/span> 种输入 → 叶子数 <span class=\"katex-inline\">\\ge N!<\/span> → <span class=\"katex-inline\">2^h\\ge N!<\/span> → <span class=\"katex-inline\">h\\ge\\lceil\\lg N!\\rceil<\/span> → Stirling 放缩到 <span class=\"katex-inline\">N\\lg N<\/span>。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：把算法画成树<\/h3>\n<p>根结点是第一次比较。比较 <span class=\"katex-inline\">K_i,K_j<\/span>：<span class=\"katex-inline\">K_i&lt;K_j<\/span> 走左支，<span class=\"katex-inline\">K_i&gt;K_j<\/span> 走右支。每条输入排列沿唯一一条路径走到一片叶子，叶子标注该路径结束时得到的排列。<\/p>\n<h3>第二步：证明叶子数不少于排列数<\/h3>\n<p>假设两种不同排列 <span class=\"katex-inline\">\\pi_1,\\pi_2<\/span> 落到同一片叶子。该叶子对应的算法动作已结束，输出次序唯一；这个次序不可能同时等于 <span class=\"katex-inline\">\\pi_1<\/span> 应有次序与 <span class=\"katex-inline\">\\pi_2<\/span> 应有次序，至少一种被排错。正确性要求每种排列独立叶子，故 <span class=\"katex-inline\">L\\ge N!<\/span>。<\/p>\n<h3>第三步：二叉树容量关系<\/h3>\n<p>高度 <span class=\"katex-inline\">h<\/span> 的满二叉树：第 0 层 1 个根，第 1 层至多 2 个结点，第 <span class=\"katex-inline\">h<\/span> 层至多 <span class=\"katex-inline\">2^h<\/span> 个叶子。任何不满的树叶子数不超过满树，故 <span class=\"katex-inline\">L\\le 2^h<\/span>。<\/p>\n<h3>第四步：合并两式得下界<\/h3>\n<div class=\"katex-block\">2^h\\ge L\\ge N!\\implies 2^h\\ge N!.<\/div>\n<p>两边取以 2 为底对数：<\/p>\n<div class=\"katex-block\">h\\ge \\lg N!,<\/div>\n<p><span class=\"katex-inline\">h<\/span> 为整数，写 <span class=\"katex-inline\">h\\ge\\lceil\\lg N!\\rceil<\/span>。<\/p>\n<h3>第五步：Stirling 放缩<\/h3>\n<p>Stirling 公式：<\/p>\n<div class=\"katex-block\">N!=\\sqrt{2\\pi N}\\left(\\frac{N}{e}\\right)^N e^{\\theta},\\quad 0<\\theta<1.<\/div>\n<p>取自然对数：<\/p>\n<div class=\"katex-block\">\\ln N!=\\tfrac12\\ln(2\\pi N)+N\\ln N-N+\\theta.<\/div>\n<p>除以 <span class=\"katex-inline\">\\ln 2<\/span> 换成以 2 为底：<\/p>\n<div class=\"katex-block\">\\lg N!=N\\lg N-\\frac{N}{\\ln 2}+\\frac{\\tfrac12\\ln(2\\pi N)}{\\ln 2}+\\theta',<\/div>\n<p><span class=\"katex-inline\">1/\\ln 2\\approx1.4427<\/span>，线性项系数约 1.44。<\/p>\n<h3>第六步：与现有方法对照<\/h3>\n<p>合并排序总比较 <span class=\"katex-inline\">N\\lg N<\/span> 量级；树选择 <span class=\"katex-inline\">N\\lg N<\/span>；快速排序期望 <span class=\"katex-inline\">2N\\ln N<\/span>，换成以 2 为底系数约 2.88。主项都落在 <span class=\"katex-inline\">N\\lg N<\/span>，与下界同阶；常数与线性项差距不随 <span class=\"katex-inline\">N<\/span> 增长为主导。<\/p>\n<h3>第七步：小样本核对<\/h3>\n<p><span class=\"katex-inline\">N=3<\/span>：<span class=\"katex-inline\">N!=6<\/span>，<span class=\"katex-inline\">\\lceil\\lg 6\\rceil=3<\/span>。高度 2 的二叉树至多 4 片叶子，放不下 6 种排列；高度 3 至多 8 片，可行。手推可知 3 个元素最少 3 次比较，与下界吻合。<span class=\"katex-inline\">N=4<\/span>：<span class=\"katex-inline\">N!=24<\/span>，<span class=\"katex-inline\">\\lceil\\lg 24\\rceil=5<\/span>。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：<span class=\"katex-inline\">N=3<\/span> 决策树容量<\/h3>\n<p>高度 1：至多 2 叶；高度 2：至多 4 叶；高度 3：至多 8 叶。6 种排列需要高度 3，下界 3 次。<\/p>\n<h3>算例 2：下界数值<\/h3>\n<p><span class=\"katex-inline\">N=10<\/span>：<span class=\"katex-inline\">10!=3\\,628\\,800<\/span>，<span class=\"katex-inline\">\\lg N!\\approx\\lg 3.63\\times10^6\\approx21.8<\/span>，下界 22 次；公式 <span class=\"katex-inline\">N\\lg N-1.44N\\approx33.2-14.4=18.8<\/span>，低阶项补足到 21.8。 <span class=\"katex-inline\">N=100<\/span>：<span class=\"katex-inline\">\\lg 100!\\approx524.8<\/span>；<span class=\"katex-inline\">N\\lg N-1.44N\\approx664.4-144=520.4<\/span>，接近。<\/p>\n<h3>算例 3：主项对照<\/h3>\n<p><span class=\"katex-inline\">N=1000<\/span>：下界主项 <span class=\"katex-inline\">1000\\lg1000\\approx9966<\/span>；合并排序约 <span class=\"katex-inline\">1000\\lg1000<\/span> 次；快速期望 <span class=\"katex-inline\">2N\\ln N\\approx13816<\/span> 次。三者主项同为 <span class=\"katex-inline\">N\\lg N<\/span>，系数不同。<\/p>\n<h3>算例 4：基数排序不在模型内<\/h3>\n<p>按十进制位分桶，一次操作把键分到 10 类；决策树结点度数为 10，叶子容量是 <span class=\"katex-inline\">10^h<\/span> 而不是 <span class=\"katex-inline\">2^h<\/span>，不能用 <span class=\"katex-inline\">\\lceil\\lg N!\\rceil<\/span> 约束其比较次数。<\/p>\n<h3>算例 5：等值三分支<\/h3>\n<p>若允许相等分支，结点三个子树，叶子容量关系改变；<span class=\"katex-inline\">N!<\/span> 计数也要按等值重复排列调整。把二分支结论套到三分支模型上是口径错误。<\/p>\n<h3>算例 6：平均与最坏区分<\/h3>\n<p>决策树高度是最坏路径；期望比较次数按各排列概率对路径长度加权。同一棵树，最坏高度与平均深度是两个量，下界分别推导。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>把分桶方法纳入比较模型<\/strong>：基数操作一次分出多类，硬套二叉叶子数会低估其合法分支容量，得出错误的「不可能高效」结论。\n<\/li><li>\n<strong>两种排列共用一片叶子<\/strong>：正确性不允许；若实现中出现，说明该路径没有区分这两种输入，结果对其中一种错误。\n<\/li><li>\n<strong>用平均下界代替最坏下界<\/strong>：<span class=\"katex-inline\">\\lceil\\lg N!\\rceil<\/span> 约束最坏路径；随机输入的期望最优值按概率加权，数值更小，不能互相替换。\n<\/li><li>\n<strong>忽略低阶项声称达到下界<\/strong>：主项同为 <span class=\"katex-inline\">N\\lg N<\/span> 只说明同阶；线性项、常数项与实际指令口径仍有差距。\n<\/ul>\n<h2>补足推导：信息论视角<\/h2>\n<p>下界也可以从信息量理解：区分 <span class=\"katex-inline\">N!<\/span> 种等可能排列需要 <span class=\"katex-inline\">\\lg N!<\/span> 比特信息；每次二分支比较最多给出 1 比特信息。要区分全部排列，比较次数不能少于所需信息量。这个视角与叶子计数等价：<span class=\"katex-inline\">2^h<\/span> 个分支结果对应 <span class=\"katex-inline\">h<\/span> 比特，<span class=\"katex-inline\">N!<\/span> 种结果需要 <span class=\"katex-inline\">\\lg N!<\/span> 比特。查找问题中，<span class=\"katex-inline\">N<\/span> 个候选键的二分查找需要 <span class=\"katex-inline\">\\lg N<\/span> 次比较，是同一信息量论证在检索场景的重现。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n决策树的内部结点和叶子各代表什么？\n<\/li><li>\n为什么不同排列不能共用一片叶子？\n<\/li><li>\n高度 <span class=\"katex-inline\">h<\/span> 的二叉树至多有多少片叶子？这个关系怎样反推 <span class=\"katex-inline\">h<\/span> 的下界？\n<\/li><li>\nStirling 公式把 <span class=\"katex-inline\">N!<\/span> 换成什么形式？取对数后主项和线性项各是什么？\n<\/li><li>\n基数排序为什么不受这个下界约束？\n<\/ol>\n<h2>扩展推演：下界的口径边界与小样本核对<\/h2>\n<p>决策树模型只统计两两键比较，一次操作二分支。基数排序按键位或字符分桶，一次分出多类，决策树结点度数不是 2；把二叉叶子容量 <span class=\"katex-inline\">2^h<\/span> 套上去是口径错误。计数排序、桶排序的代价落在分配与收集记录的遍数上，同样不受 <span class=\"katex-inline\">\\lceil\\lg N!\\rceil<\/span> 约束。<\/p>\n<p>等值存在时比较结果有三种（小于、等于、大于），结点三个子树；叶子计数按三分支树容量重新推，<span class=\"katex-inline\">N!<\/span> 也要换成等值重复排列数。二分支结论不能直接用于三分支模型。<\/p>\n<p>小样本再核对：<span class=\"katex-inline\">N=3<\/span>，<span class=\"katex-inline\">N!=6<\/span>，高度 2 的树至多 4 叶，放不下 6 种排列；高度 3 至多 8 叶，下界 3 次。手推可知三个元素最少 3 次比较完成排序，与下界吻合。<span class=\"katex-inline\">N=4<\/span>，<span class=\"katex-inline\">24<\/span> 种排列，<span class=\"katex-inline\">\\lceil\\lg24\\rceil=5<\/span>；高度 4 的二叉树至多 16 叶，不够。<\/p>\n<p>渐近数值：<span class=\"katex-inline\">\\lg N!\\approx N\\lg N-1.44N<\/span>。<span class=\"katex-inline\">N=100<\/span> 时精确 <span class=\"katex-inline\">\\lg100!\\approx524.8<\/span>，主项 <span class=\"katex-inline\">664.4<\/span> 减线性项 <span class=\"katex-inline\">144<\/span> 得 <span class=\"katex-inline\">520.4<\/span>，低阶项补足到 524.8。合并排序比较次数同主项 <span class=\"katex-inline\">N\\lg N<\/span>；快速期望 <span class=\"katex-inline\">2N\\ln N<\/span> 换底后系数约 2.88。下界与现有方法同阶，差距在线性项和指令常数，不在主项。<\/p>\n<p>信息量视角：区分 <span class=\"katex-inline\">N!<\/span> 种等可能排列需要 <span class=\"katex-inline\">\\lg N!<\/span> 比特；每次二分支比较最多给 1 比特。查找问题中 <span class=\"katex-inline\">N<\/span> 个候选需要 <span class=\"katex-inline\">\\lg N<\/span> 次比较，是同一论证在检索场景的重现。这个视角把排序下界与查找下界统一到「区分候选所需信息量」上。<\/p>\n<h2>再补充：下界与算法设计的关系<\/h2>\n<p>下界说明「不能再少到哪里」，不直接给出最优算法。达到 <span class=\"katex-inline\">N\\lg N<\/span> 主项的方法（归并、树选择）与下界同阶；线性项、常数项仍可继续优化。排序网络（§5.3.4）另加固定比较模式的约束，分析口径与串行比较排序不同。<\/p>\n<p>决策树高度对应最坏路径；期望最优值按各排列概率加权，是另一个量。随机输入下排序的期望比较次数低于最坏下界对应的高度，二者不要混用。叶子数论证只约束比较动作，移动记录、分配桶的代价不计入这个下界。<\/p>\n<p>查找问题共享同一信息量论证：<span class=\"katex-inline\">N<\/span> 个候选键二分查找需要 <span class=\"katex-inline\">\\lg N<\/span> 次比较，区分 <span class=\"katex-inline\">N<\/span> 个结果需要 <span class=\"katex-inline\">\\lg N<\/span> 比特。排序区分 <span class=\"katex-inline\">N!<\/span> 种结果，需要 <span class=\"katex-inline\">\\lg N!<\/span> 比特；两个场景的分支次数都由候选规模的对数决定。<\/p>\n<h2>边界补充<\/h2>\n<p>下界论证只覆盖两两键比较：桶分配、位查看、基数划分不在二叉决策树模型内，不能用 <span class=\"katex-inline\">\\lg N!<\/span> 衡量其代价。达到 <span class=\"katex-inline\">N\\lg N<\/span> 主项的方法与下界同阶，线性项与低阶部分仍有优化空间；下界说明主项不能再降，不直接给出常数项最优的算法。最坏路径下界与平均期望比较次数是两个量，分别对应决策树高度与叶子加权路径长度。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">N=4<\/span> 的比较下界，并说明树高 4 的二叉树为什么不够。\n<\/li><li>\n<span class=\"katex-inline\">\\lg N!<\/span> 的主项为什么是 <span class=\"katex-inline\">N\\lg N<\/span>？线性项系数约为多少？\n<\/li><li>\n决策树高度对应的是最坏情形还是平均情形？两者怎样区分？\n<\/li><li>\n等值键存在时，决策树模型需要做哪些调整？\n<\/li><li>\n信息量视角下，一次二分支比较最多提供多少比特？区分 <span class=\"katex-inline\">N!<\/span> 种排列需要多少？\n<\/ol><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/计算机程序与设计艺术/图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版 (高德纳（Donald E.Knuth）著；贾洪峰译, (美) 克努特, (Knuth etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.203<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">合并排序与游程：两路合并、自然两路合并与 $N\\lg N$ 归并结构<\/a><\/span><\/div><h1>外部排序：初始游程、替代选择与 <span class=\"katex-inline\">P<\/span> 路合并的扫描遍数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch02（原书 §5.4.1 多路合并和替代选择，PDF 第 203 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>内部排序假定文件一次装入内存；实际业务中文件可以有几百万条记录，内存放不下，磁带或磁盘要反复读写。外部排序要解决的困难是：在内存受限条件下先生成一批有序游程，再用多路合并逐轮把游程并长，尽量减少外部存储的扫描遍数。这个概念讲清两阶段结构、替代选择怎样拉长初始游程，以及合并路数与游程数怎样决定遍数。<\/p>\n<h2>定义<\/h2>\n<p><strong>外部排序<\/strong>：待排文件大于内存容量，借助外部存储分遍排序与合并的方法，与内部排序相对。<\/p>\n<p><strong>初始游程<\/strong>：第一阶段在内存受限条件下生成的有序连续段；外部排序的合并单位。<\/p>\n<p><strong>替代选择<\/strong>：在内存选择树中持续输出当前最小键，输出后把新读入记录补回树中参与竞争；新键不小于刚输出键时留在本游程，否则转入下一游程，从而长出比内存容量更长的游程。<\/p>\n<p><strong><span class=\"katex-inline\">P<\/span> 路合并<\/strong>：把 <span class=\"katex-inline\">P<\/span> 个有序游程同时归并成一个输出游程；任意时刻查看每个游程首条记录，选键最小的输出，再从该游程补入下一条（PDF 第 203 页）。<\/p>\n<p><strong>选择树<\/strong>：<span class=\"katex-inline\">P<\/span> 个首条记录置于树叶子，根给出当前最小；更新时只沿冠军路径重做比较，每步约 <span class=\"katex-inline\">\\lg P<\/span> 次比较。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">P=4<\/span> 路，游程首条 <span class=\"katex-inline\">87,170,154,612<\/span>，选 87 输出后补入下一记录；树选择每次比较约 <span class=\"katex-inline\">\\lg 4=2<\/span> 次。<strong>反例<\/strong>：游程末尾不设结束标识，某游程读完后选择树未判空，会把已空游程误当候选。<\/p>\n<h2>原理推导<\/h2>\n<p>第一阶段生成 <span class=\"katex-inline\">S<\/span> 个初始游程。第二阶段一轮 <span class=\"katex-inline\">P<\/span> 路合并把游程数降到 <span class=\"katex-inline\">\\lceil S/P\\rceil<\/span>；再一轮降到 <span class=\"katex-inline\">\\lceil S/P^2\\rceil<\/span>；<span class=\"katex-inline\">k<\/span> 轮后剩余 <span class=\"katex-inline\">S/P^k<\/span>。只剩一个游程的条件 <span class=\"katex-inline\">P^k\\ge S<\/span>，遍数<\/p>\n<div class=\"katex-block\">k=\\lceil\\log_P S\\rceil.<\/div>\n<p>举例 <span class=\"katex-inline\">S=1000<\/span>：<span class=\"katex-inline\">P=2<\/span> 需 10 遍，<span class=\"katex-inline\">P=10<\/span> 需 3 遍，<span class=\"katex-inline\">P=32<\/span> 需 2 遍。路数增多减少遍数，但每路要占内存缓冲与树结点，选择树比较代价约 <span class=\"katex-inline\">\\lg P<\/span>。<\/p>\n<p>替代选择拉长游程：普通内存排序一次游程长度不超过内存容量；替代选择在输出最小后补入新记录继续竞争，游程可以数倍于内存，<span class=\"katex-inline\">S<\/span> 随之下降，后续遍数减少。书中在每个游程末尾附加 <span class=\"katex-inline\">\\infty<\/span> 键作为结束标识，使合并过程无需反复判空（PDF 第 203 页）。替代选择的拉长幅度受键分布影响：补入记录频繁小于刚输出键时，本游程留不住新键，游程增长受限；候选空间大小与游程长度需要平衡。多阶段合并、级联合并在通道受限时分轮换向，外部基数排序按键位分配收集，是 §5.4 后续小节在游程与多路合并之上的扩展安排。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：外部存储可顺序读写；合并路数受内存缓冲数与设备驱动器数量约束。\n<\/li><li>\n边界一：磁带顺序读写与磁盘随机访问的代价结构不同；多阶段合并、级联合并等安排针对磁带特性设计。\n<\/li><li>\n失败案例一：初始游程过短，<span class=\"katex-inline\">S<\/span> 线性膨胀，合并遍数随之抬高；替代选择不足会把负担全压到第二阶段。\n<\/li><li>\n失败案例二：<span class=\"katex-inline\">P<\/span> 超过可同时打开的文件数或内存缓冲数，物理上无法实现。\n<\/li><li>\n边界二：外部排序代价口径是扫描遍数与记录读写量，不套用内部排序的键比较下界。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>外部 vs 内部排序<\/strong>：内部受内存容量约束小、以比较次数为口径；外部受存储带宽与遍数约束，比较次数退居次要。\n<\/li><li>\n<strong>初始游程 vs 内部游程<\/strong>：内部游程是输入现成有序段；外部初始游程是内存受限生成的产物，长度受替代选择控制。\n<\/li><li>\n<strong><span class=\"katex-inline\">P<\/span> 路合并 vs 两路合并<\/strong>：两路是 <span class=\"katex-inline\">P=2<\/span> 特例；多路用选择树在更多候选间选最小，遍数按 <span class=\"katex-inline\">\\log_P S<\/span> 下降。\n<\/li><li>\n<strong>替代选择 vs 普通内存排序<\/strong>：普通排序排满内存才输出；替代选择边输出边补入，游程跨出内存边界。\n<\/ul>\n<p><strong>常见误解<\/strong>：容易把外部排序理解成「把内部排序搬到磁盘上」。外部主代价是读写遍数，键比较在内存速度掩盖下退居次要；用内部比较下界评价外部方法是口径错位。另一个误解是以为多路合并路数越多越好：<span class=\"katex-inline\">P<\/span> 增大压低遍数，但每路占用缓冲、通道与树结点，物理上限由可打开文件数和内存决定。初始游程过短时压力全压到第二阶段，替代选择拉长游程是在第一阶段就减负。<\/p>\n<h2>联系<\/h2>\n<p>前置：c05 两路归并规则、c04 锦标赛选择树。后继：c09 外部存储上的 B 树按块检索，与外部排序共享按页/块访问介质的口径；查找部分的散列与有序表方法，假定数据已按外部排序或内部排序整理完毕。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（外部排序：初始游程、替代选择与 $P$ 路合并的扫描遍数）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：外部排序两阶段、替代选择与遍数对数公式<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把外部排序推到可验算，先往回追四层前提：<\/p>\n<ol><li>\n<strong>文件装不下内存<\/strong>：这是外部排序存在的根据；若一次装入，内部排序直接完成，不需要分遍归并。\n<\/li><li>\n<strong>先有序化、再归并<\/strong>：外部介质上不能高效地原地交换，可行路线是先在内存造出有序游程，再把游程逐步并长。\n<\/li><li>\n<strong>归并双方各自有序<\/strong>：多路合并沿用两路归并规则，每段首条是本段剩余最小；段内无序则选最小规则失效。\n<\/li><li>\n<strong>遍数是主代价口径<\/strong>：外部读写一条记录的成本远高于内存比较，优化目标是减少扫描遍数，比较次数不套内部下界。\n<\/ol>\n<p>依赖链方向：内存受限 → 生成初始游程 → <span class=\"katex-inline\">P<\/span> 路选择树归并 → 游程数按 <span class=\"katex-inline\">P<\/span> 除幂次下降 → 遍数 <span class=\"katex-inline\">\\lceil\\log_P S\\rceil<\/span>；替代选择在第一阶段拉长游程、压低 <span class=\"katex-inline\">S<\/span>。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：第一阶段生成游程<\/h3>\n<p>内存一次能容纳 <span class=\"katex-inline\">M<\/span> 条记录。普通做法：读入 <span class=\"katex-inline\">M<\/span> 条、内部排序、写成一个游程，重复直到文件读完；游程长度上限 <span class=\"katex-inline\">M<\/span>，游程数 <span class=\"katex-inline\">S\\approx N/M<\/span>。<\/p>\n<h3>第二步：替代选择拉长游程<\/h3>\n<p>选择树内存放 <span class=\"katex-inline\">M<\/span> 个候选。输出当前最小键 <span class=\"katex-inline\">K_{\\min}<\/span> 后，读入下一条记录 <span class=\"katex-inline\">x<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">x\\ge K_{\\min}<\/span>：<span class=\"katex-inline\">x<\/span> 不小于刚输出键，留在本游程竞争下一次输出；\n<\/li><li>\n<span class=\"katex-inline\">x&lt;K_{\\min}<\/span>：<span class=\"katex-inline\">x<\/span> 不能进入本游程（否则本游程出现逆序），挂到下一游程候选区。\n<p>随输出推进，本游程持续补入不小于已输出键的记录，长度可超过 <span class=\"katex-inline\">M<\/span>；下一游程候选积累到容量后接替开始。<\/p>\n<\/ul>\n<h3>第三步：多路合并的单步<\/h3>\n<p><span class=\"katex-inline\">P<\/span> 个游程首条置于选择树叶子。根为当前最小，输出后从该游程补入下一条，沿冠军路径重做比较；树高 <span class=\"katex-inline\">\\lceil\\lg P\\rceil<\/span>，单步比较约 <span class=\"katex-inline\">\\lg P<\/span> 次。游程末尾的 <span class=\"katex-inline\">\\infty<\/span> 标识保证一段耗尽后不参与选择。<\/p>\n<h3>第四步：游程数递推<\/h3>\n<p>一轮合并后游程数 <span class=\"katex-inline\">S_1=\\lceil S/P\\rceil<\/span>；两轮后 <span class=\"katex-inline\">S_2=\\lceil S_1/P\\rceil\\approx S/P^2<\/span>；<span class=\"katex-inline\">k<\/span> 轮后 <span class=\"katex-inline\">S_k\\approx S/P^k<\/span>。只剩一个游程要求 <span class=\"katex-inline\">S/P^k\\le1<\/span>，即 <span class=\"katex-inline\">P^k\\ge S<\/span>：<\/p>\n<div class=\"katex-block\">k=\\lceil\\log_P S\\rceil.<\/div>\n<h3>第五步：路数与内存的权衡<\/h3>\n<p><span class=\"katex-inline\">P<\/span> 增大，遍数按对数下降；但每路需要一个输入缓冲、树结点和打开的设备通道。选择树比较代价 <span class=\"katex-inline\">\\lg P<\/span> 增长平缓，缓冲与通道占用线性增长。<span class=\"katex-inline\">P<\/span> 的上限由内存和驱动器数量决定。<\/p>\n<h3>第六步：扫描记录总量<\/h3>\n<p>每遍扫遍全部 <span class=\"katex-inline\">N<\/span> 条记录（输入读、输出写各计），<span class=\"katex-inline\">k<\/span> 遍的记录读写量约 <span class=\"katex-inline\">2kN<\/span>。遍数 <span class=\"katex-inline\">k<\/span> 是外部排序优化的首要变量；同等遍数下再优化缓冲长度与选择树常数。<\/p>\n<h3>第七步：磁带与磁盘差别<\/h3>\n<p>磁带只能顺序读写，多阶段合并、级联合并要安排倒带与轮换顺序；磁盘可随机访问，块定位开销结构不同。§5.4.9 讨论磁盘与磁鼓，外部排序方法随介质特性调整。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：遍数对照<\/h3>\n<p><span class=\"katex-inline\">N=10^6<\/span>，普通内存 <span class=\"katex-inline\">M=1000<\/span>，<span class=\"katex-inline\">S=1000<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">P=2<\/span>：<span class=\"katex-inline\">k=\\lceil\\log_2 1000\\rceil=10<\/span> 遍；\n<\/li><li>\n<span class=\"katex-inline\">P=10<\/span>：<span class=\"katex-inline\">k=3<\/span> 遍；\n<\/li><li>\n<span class=\"katex-inline\">P=32<\/span>：<span class=\"katex-inline\">k=\\lceil\\log_{32}1000\\rceil=2<\/span> 遍。\n<p>读写记录量按 <span class=\"katex-inline\">2kN<\/span> 估算：<span class=\"katex-inline\">P=2<\/span> 约 <span class=\"katex-inline\">2\\times10^7<\/span> 条次，<span class=\"katex-inline\">P=32<\/span> 约 <span class=\"katex-inline\">4\\times10^6<\/span> 条次。<\/p>\n<\/ul>\n<h3>算例 2：替代选择拉长游程<\/h3>\n<p>若替代选择使平均游程长度达到 <span class=\"katex-inline\">3M<\/span>，则 <span class=\"katex-inline\">S\\approx N/(3M)<\/span>，降到普通做法的三分之一；<span class=\"katex-inline\">P=2<\/span> 时遍数从 10 降到约 <span class=\"katex-inline\">\\lceil\\log_2 333\\rceil=9<\/span> 遍。游程越长，第二阶段压力越小。<\/p>\n<h3>算例 3：四路选择树<\/h3>\n<p><span class=\"katex-inline\">P=4<\/span>，树高 <span class=\"katex-inline\">\\lg4=2<\/span>；输出最小后重做路径上两层比较。朴素四路选最小要 <span class=\"katex-inline\">P-1=3<\/span> 次比较，树选择 2 次；<span class=\"katex-inline\">P=8<\/span> 时朴素 7 次，树选择 3 次。<\/p>\n<h3>算例 4：<span class=\"katex-inline\">\\infty<\/span> 标识作用<\/h3>\n<p>某游程读完后若无标识，选择树仍把空槽当候选，可能选出无效值；附加 <span class=\"katex-inline\">\\infty<\/span> 后该槽永远输给其他真实键，自然留在选择末位。<\/p>\n<h3>算例 5：等值归属<\/h3>\n<p>补入记录与刚输出键相等时，归入本游程不造成逆序；等值处理规则要在第一阶段固定，避免等值记录跨游程反复移动。<\/p>\n<h3>算例 6：路数物理上限<\/h3>\n<p>若系统同时只能打开 6 个输入文件，<span class=\"katex-inline\">P<\/span> 不能超过 6；超出部分要分组分批合并，遍数按实际可行路数重新计算。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>文件一次装入内存<\/strong>：分遍归并失去必要，内部排序更省；外部排序整套结构是「装不下」条件下的方案。\n<\/li><li>\n<strong>初始游程内部无序<\/strong>：多路归并首条不能代表段内最小，跨段选择会输出大键，结果重新出现反序。\n<\/li><li>\n<strong>游程数不压缩、全靠后期多路<\/strong>：<span class=\"katex-inline\">S<\/span> 随 <span class=\"katex-inline\">N<\/span> 线性增长，<span class=\"katex-inline\">k=\\log_P S<\/span> 仍随 <span class=\"katex-inline\">\\log N<\/span> 上升；替代选择在第一阶段减负，与第二阶段多路分工配合。\n<\/li><li>\n<strong>比较内部排序下界评价外部方法<\/strong>：外部主代价是读写遍数，键比较次数受内存速度掩盖；用 <span class=\"katex-inline\">N\\lg N<\/span> 下界衡量外部排序口径错位。\n<\/ul>\n<h2>补足推导：外部排序与内部归并的结构对应<\/h2>\n<p>内部两路合并：两段有序、首条比较、输出补入；外部 <span class=\"katex-inline\">P<\/span> 路合并：<span class=\"katex-inline\">P<\/span> 段有序、选择树选最小、输出补入。内部合并的辅助数组在外部对应外部介质上的输出游程文件。内部归并轮数 <span class=\"katex-inline\">\\lceil\\lg N\\rceil<\/span> 对应外部遍数 <span class=\"katex-inline\">\\lceil\\log_P S\\rceil<\/span>；内部段长翻倍对应外部游程数按 <span class=\"katex-inline\">P<\/span> 除幂次下降。§5.4 后续小节的多阶段合并、级联合并，是在磁带通道受限下对 <span class=\"katex-inline\">P<\/span> 路合并的调度改造；外部基数排序则绕开比较，按键的数字位分配收集。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n外部排序为什么分「生成游程」和「多路合并」两个阶段？\n<\/li><li>\n替代选择怎样判断新记录能否留在当前游程？不满足时去了哪里？\n<\/li><li>\n多路合并每一步选最小用什么结构？单步比较量级是多少？\n<\/li><li>\n遍数公式 <span class=\"katex-inline\">\\lceil\\log_P S\\rceil<\/span> 中 <span class=\"katex-inline\">P<\/span> 和 <span class=\"katex-inline\">S<\/span> 各是什么？路数增大对遍数和内存各有什么影响？\n<\/li><li>\n外部排序的主代价为什么是扫描遍数而不是键比较次数？\n<\/ol>\n<h2>扩展推演：游程长度、路数约束与介质调度<\/h2>\n<p>替代选择的游程长度取决于内存候选数与键分布。候选 <span class=\"katex-inline\">M<\/span> 个记录时，新键不小于刚输出键就留在本游程；典型结果游程长度可达数倍 <span class=\"katex-inline\">M<\/span>。若键分布均匀，补入记录与输出键大小交错，留本游程的比例下降，游程增长受限。拉长游程直接压低 <span class=\"katex-inline\">S<\/span>，而遍数 <span class=\"katex-inline\">k=\\lceil\\log_P S\\rceil<\/span> 随 <span class=\"katex-inline\">S<\/span> 对数下降，第一阶段减负的收益在第二阶段按对数放大。<\/p>\n<p>路数 <span class=\"katex-inline\">P<\/span> 的约束有三条：同时打开的外部文件数、每个输入通道的内存缓冲、选择树结点数。磁带机数量有限时，<span class=\"katex-inline\">P<\/span> 不能超过驱动器数；磁盘可随机访问，通道约束松动，但缓冲与内存仍限制 <span class=\"katex-inline\">P<\/span>。多阶段合并、级联合并是在磁带 <span class=\"katex-inline\">P<\/span> 受限时，把多路合并拆成几轮换向轮换的调度方案。<\/p>\n<p>扫描总量按读写各一遍计：<span class=\"katex-inline\">k<\/span> 遍约 <span class=\"katex-inline\">2kN<\/span> 条次记录传输。优化顺序是先降遍数 <span class=\"katex-inline\">k<\/span>，再降单遍缓冲长度与选择树常数。外部排序几乎不优化内存里的键比较——内存速度远高于介质传输，比较代价被掩盖。<\/p>\n<p>补充算例：<span class=\"katex-inline\">N=10^6<\/span>，<span class=\"katex-inline\">M=1000<\/span>，普通生成 <span class=\"katex-inline\">S=1000<\/span>。<span class=\"katex-inline\">P=2<\/span> 十遍，传输约 <span class=\"katex-inline\">2\\times10^7<\/span> 条次；<span class=\"katex-inline\">P=10<\/span> 三遍，<span class=\"katex-inline\">6\\times10^6<\/span> 条次；替代选择把游程拉长到 3 倍，<span class=\"katex-inline\">S\\approx333<\/span>，<span class=\"katex-inline\">P=2<\/span> 时九遍。<span class=\"katex-inline\">S=2000,P=5<\/span>：<span class=\"katex-inline\">5^4=625&lt;2000\\le3125=5^5<\/span>，<span class=\"katex-inline\">k=5<\/span> 遍。<\/p>\n<p>外部基数排序另走一路：按键数字位分配收集，不做比较合并；它的遍数由键位数和基数决定，与游程合并模型并列。§5.4.9 讨论磁盘与磁鼓，随机访问结构与磁带顺序扫描的代价结构不同。<\/p>\n<h2>再补充：外部排序的代价口径与方案选型<\/h2>\n<p>外部排序记账主项是记录读写遍数，不是内存键比较；磁带顺序读写、磁盘块访问各有代价结构。方案选型先定 <span class=\"katex-inline\">S<\/span>（初始游程数）与 <span class=\"katex-inline\">P<\/span>（合并路数），再算 <span class=\"katex-inline\">k=\\lceil\\log_P S\\rceil<\/span>；缓冲长度、选择树常数是第二位优化。<\/p>\n<p>替代选择拉长游程受键分布影响：补入记录频繁小于刚输出键时，本游程留不住新键，游程增长受限。普通内存排序游程上限即内存容量；替代选择把边界推到数倍内存。游程过长也会占用更多候选空间，长度与候选数要平衡。<\/p>\n<p>多阶段合并、级联合并是磁带通道受限时的调度改造：<span class=\"katex-inline\">P<\/span> 不能一步到位时，分轮换向把多路合并拆开。外部基数排序按键位分配收集，遍数由位数与基数决定，与归并模型并列。§5.4.9 磁盘磁鼓部分讨论随机访问介质上的结构安排。<\/p>\n<h2>边界补充<\/h2>\n<p>外部排序的记账主项是记录读写遍数，不是内存键比较；磁带顺序读写、磁盘块访问各有自己的代价结构。方案选型先定初始游程数 <span class=\"katex-inline\">S<\/span> 与合并路数 <span class=\"katex-inline\">P<\/span>，再算 <span class=\"katex-inline\">k=\\lceil\\log_P S\\rceil<\/span>，缓冲长度与选择树常数是第二位优化。替代选择拉长游程受键分布约束：补入记录频繁小于刚输出键时，本游程留不住新键，增长受限；候选空间大小与游程长度需要平衡。通道受限时多阶段合并、级联合并把多路合并拆成分轮换向；外部基数排序按键位分配收集，遍数由位数与基数决定。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">S=2000<\/span>、<span class=\"katex-inline\">P=5<\/span> 时的合并遍数。\n<\/li><li>\n替代选择拉长游程后，<span class=\"katex-inline\">S<\/span> 怎样变化？对第二阶段遍数有什么影响？\n<\/li><li>\n选择树相对朴素 <span class=\"katex-inline\">P<\/span> 路扫描，把单步比较从多少次降到多少量级？\n<\/li><li>\n游程末尾的 <span class=\"katex-inline\">\\infty<\/span> 标识解决了什么问题？\n<\/li><li>\n磁带与磁盘在外部排序调度上的主要差别是什么？\n<\/ol><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/计算机程序与设计艺术/图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版 (高德纳（Donald E.Knuth）著；贾洪峰译, (美) 克努特, (Knuth etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.317<\/div><h1>顺序查找与静态最优排列：加权平均比较次数与频率降序最优<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch03（原书 §6.1 顺序查找，PDF 第 317 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>查找问题的起点是最朴素的方法：从表首逐条核对待查键。表不大、查找不频繁时它够用；需要算清的是：一条记录被查找的概率不同时，平均比较次数怎样表达，记录按什么次序摆放最省。这个概念建立加权平均比较次数公式，证明高频记录靠前时最优，并给出均匀分布与齐普夫分布下的具体数值。<\/p>\n<h2>定义<\/h2>\n<p><strong>顺序查找<\/strong>：从表首开始逐条比较 <span class=\"katex-inline\">K<\/span> 与 <span class=\"katex-inline\">K_i<\/span>，相等则成功结束，走到表尾仍不相等则失败（PDF 第 317 页）。<\/p>\n<p><strong>查找概率<\/strong>：第 <span class=\"katex-inline\">j<\/span> 条记录被查找的概率 <span class=\"katex-inline\">p_j<\/span>，满足 <span class=\"katex-inline\">p_1+p_2+\\cdots+p_N=1<\/span>。<\/p>\n<p><strong>加权平均比较次数<\/strong>：成功查找走到第 <span class=\"katex-inline\">j<\/span> 条需要 <span class=\"katex-inline\">j<\/span> 次比较，期望<\/p>\n<div class=\"katex-block\">\\bar C_N=p_1+2p_2+\\cdots+Np_N=\\sum_{j=1}^{N}j p_j.<\/div>\n<p><strong>静态最优排列<\/strong>：记录次序固定、查找概率已知时，使 <span class=\"katex-inline\">\\bar C_N<\/span> 最小的摆放顺序；结论为 <span class=\"katex-inline\">p_1\\ge p_2\\ge\\cdots\\ge p_N<\/span>，高频靠前。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">N=3<\/span>，概率 <span class=\"katex-inline\">p_1=1/2,p_2=1/4,p_3=1/4<\/span>，已按降序；<span class=\"katex-inline\">\\bar C=1/2+2/4+3/4=1.75<\/span>。<strong>反例<\/strong>：低频记录排在高频之前，相邻交换后期望下降，当前次序不是最优。<\/p>\n<h2>原理推导<\/h2>\n<p>均匀分布 <span class=\"katex-inline\">p_j=1/N<\/span>：<\/p>\n<div class=\"katex-block\">\\bar C_N=\\frac1N\\sum_{j=1}^{N}j=\\frac{N+1}{2}.<\/div>\n<p>最优排列用相邻交换论证：位置 <span class=\"katex-inline\">i&lt;j<\/span> 两条记录概率 <span class=\"katex-inline\">p_i,p_j<\/span>，当前次序贡献 <span class=\"katex-inline\">i p_i+j p_j<\/span>，交换后贡献 <span class=\"katex-inline\">j p_i+i p_j<\/span>，差<\/p>\n<div class=\"katex-block\">\\Delta=(j-i)(p_i-p_j).<\/div>\n<p><span class=\"katex-inline\">j-i&gt;0<\/span>；若 <span class=\"katex-inline\">p_i&lt;p_j<\/span>（低频在前），<span class=\"katex-inline\">\\Delta&lt;0<\/span>，交换后期望变小。反复消除「前小后大」的相邻逆序，直到 <span class=\"katex-inline\">p_1\\ge\\cdots\\ge p_N<\/span>，此时任一次交换都使 <span class=\"katex-inline\">\\Delta\\ge0<\/span>，排列最优。<\/p>\n<p>齐普夫分布 <span class=\"katex-inline\">p_j=c/j<\/span>，<span class=\"katex-inline\">c=1/H_N<\/span>，代入得 <span class=\"katex-inline\">\\bar C_N=N/H_N<\/span>（PDF 第 317 页，式 (8)(9)）。失败查找固定走完 <span class=\"katex-inline\">N<\/span> 次比较，与概率分布无关。<\/p>\n<p>实现上有的在表尾放一个哨兵键，每轮比较前不必先判断是否走到表尾；有的先查表尾标识快速判定失败。这些是指令层面的优化，不改变成功 <span class=\"katex-inline\">(N+1)/2<\/span>、失败 <span class=\"katex-inline\">N<\/span> 的口径。链表场景的顺序遍历同口径：沿指针逐条核对，位置序号即比较次数。静态最优排列只在表不常变时值得预先排定；频率漂移或频繁插入删除时，自组织规则（命中后把记录前移一位、或移到表首）比一次性排序更适配，两类方案对应不同更新假设。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：静态表、概率已知、更新不频繁；顺序查找不要求表有序。\n<\/li><li>\n边界一：动态表频繁插入删除，或频率随时间变化，一次性排定的次序会偏离最优。\n<\/li><li>\n失败案例一：把成功查找的 <span class=\"katex-inline\">(N+1)/2<\/span> 套到失败查找上；失败代价是 <span class=\"katex-inline\">N<\/span> 次。\n<\/li><li>\n失败案例二：概率分布假定均匀，实际高频集中在少数记录，平均代价被低估。\n<\/li><li>\n边界二：加权公式只统计比较次数；记录宽度、附属信息读取不计入。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>成功 vs 失败代价<\/strong>：成功按命中位置加权，期望 <span class=\"katex-inline\">(N+1)/2<\/span>（均匀）；失败走完全表，固定 <span class=\"katex-inline\">N<\/span> 次。\n<\/li><li>\n<strong>静态最优 vs 动态组织<\/strong>：静态按概率一次排定；动态场景可随访问频率前移记录（自组织表），规则不同。\n<\/li><li>\n<strong>顺序查找 vs 二分查找<\/strong>：顺序不依赖有序、<span class=\"katex-inline\">O(N)<\/span>；二分要求有序、<span class=\"katex-inline\">O(\\lg N)<\/span>，前提差别决定量级。\n<\/li><li>\n<strong>概率加权 vs 等概率平均<\/strong>：加权用 <span class=\"katex-inline\">p_j<\/span> 求期望；等概率是 <span class=\"katex-inline\">p_j=1/N<\/span> 的特例。\n<\/ul>\n<p><strong>常见误解<\/strong>：把成功查找的 <span class=\"katex-inline\">(N+1)/2<\/span> 当成顺序查找的统一代价；失败查找要走完整个表，固定 <span class=\"katex-inline\">N<\/span> 次，两者不能混用。另一个误解是假定频率长期不变就按一次排定：业务结构变化后高频记录退到后段，静态最优次序老化。还有一种错误是只看平均比较次数，忽略记录读取成本；顺序扫描每次逐条读记录，记录宽度同样计入实际耗时。最优排列结论只在静态、概率已知的条件下成立。<\/p>\n<h2>联系<\/h2>\n<p>前置：无，查找部分的度量起点。后继：c09 二分查找在有序表上把线性代价压到对数；c10 拉链法在单个链表内部沿用顺序核对；辅助键检索 c12 的全表扫描是顺序查找在属性维度的重现。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（顺序查找与静态最优排列：加权平均比较次数与频率降序最优）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：加权比较次数、相邻交换论证与典型分布数值<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把顺序查找的最优次序推清楚，先往回追四层前提：<\/p>\n<ol><li>\n<strong>查找按位置逐条推进<\/strong>：顺序查找没有折半或跳转，走到第 <span class=\"katex-inline\">j<\/span> 条必须经过前 <span class=\"katex-inline\">j-1<\/span> 条，位置序号直接就是比较次数。\n<\/li><li>\n<strong>每条记录有被查找概率<\/strong>：平均代价不能按等概率拍脑袋，<span class=\"katex-inline\">p_j<\/span> 描述各记录被访问的频率，且概率和为 1。\n<\/li><li>\n<strong>表是静态的<\/strong>：次序可以按期望排定；若记录频繁进出或频率漂移，静态最优次序的前提不稳。\n<\/li><li>\n<strong>比较次数是唯一记账项<\/strong>：顺序查找不读取附属信息做判断，代价口径限定在键比较次数。\n<\/ol>\n<p>依赖链方向：逐条遍历 → 位置即次数 → 按 <span class=\"katex-inline\">p_j<\/span> 加权求和 → 相邻交换检验次序 → 降序排列最优 → 均匀/齐普夫分布代入数值。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：单次查找的比较次数<\/h3>\n<p>命中第 <span class=\"katex-inline\">j<\/span> 条记录，要比较 <span class=\"katex-inline\">R_1,\\dots,R_j<\/span>，共 <span class=\"katex-inline\">j<\/span> 次；未命中则比较完 <span class=\"katex-inline\">R_1,\\dots,R_N<\/span>，共 <span class=\"katex-inline\">N<\/span> 次。<\/p>\n<h3>第二步：成功查找的期望<\/h3>\n<p>命中 <span class=\"katex-inline\">R_j<\/span> 的概率是 <span class=\"katex-inline\">p_j<\/span>，期望比较次数<\/p>\n<div class=\"katex-block\">\\bar C_N=\\sum_{j=1}^{N}j\\,p_j.<\/div>\n<p>展开即 <span class=\"katex-inline\">1\\cdot p_1+2\\cdot p_2+\\cdots+N\\cdot p_N<\/span>（PDF 第 317 页，式 (3)）。<\/p>\n<h3>第三步：均匀分布代入<\/h3>\n<p><span class=\"katex-inline\">p_j=1/N<\/span>：<\/p>\n<div class=\"katex-block\">\\bar C_N=\\frac1N(1+2+\\cdots+N)=\\frac1N\\cdot\\frac{N(N+1)}2=\\frac{N+1}{2}.<\/div>\n<h3>第四步：相邻交换的代价差<\/h3>\n<p>取相邻位置 <span class=\"katex-inline\">i&lt;j=i+1<\/span>，概率 <span class=\"katex-inline\">p_i,p_j<\/span>。当前次序对期望的贡献：<\/p>\n<div class=\"katex-block\">C_{\\text{旧}}=i p_i+j p_j.<\/div>\n<p>交换后：<\/p>\n<div class=\"katex-block\">C_{\\text{新}}=j p_i+i p_j.<\/div>\n<p>差值<\/p>\n<div class=\"katex-block\">\\Delta=C_{\\text{新}}-C_{\\text{旧}}=(j-i)p_i+(i-j)p_j=(j-i)(p_i-p_j).<\/div>\n<h3>第五步：判定交换方向<\/h3>\n<p><span class=\"katex-inline\">j-i&gt;0<\/span>。若 <span class=\"katex-inline\">p_i&lt;p_j<\/span>（低频在高频前），<span class=\"katex-inline\">\\Delta&lt;0<\/span>，交换后期望下降，应当交换。若 <span class=\"katex-inline\">p_i&gt;p_j<\/span>，<span class=\"katex-inline\">\\Delta&gt;0<\/span>，交换反而变差。持续把「前小后大」的相邻对换走，直到 <span class=\"katex-inline\">p_1\\ge p_2\\ge\\cdots\\ge p_N<\/span>。此时任意相邻交换都有 <span class=\"katex-inline\">\\Delta\\ge0<\/span>，排列达到最小期望。<\/p>\n<h3>第六步：非相邻次序的传递性<\/h3>\n<p>若存在 <span class=\"katex-inline\">i&lt;j<\/span> 但 <span class=\"katex-inline\">p_i&lt;p_j<\/span>，沿相邻位置逐步把 <span class=\"katex-inline\">p_j<\/span> 前移；每步对应一次上述有利交换，总期望下降。传递性保证最终降序排列是全局最优，而不只是局部相邻最优。<\/p>\n<h3>第七步：齐普夫分布<\/h3>\n<p>自然语言文本中第 <span class=\"katex-inline\">j<\/span> 常见词频率近似与 <span class=\"katex-inline\">j<\/span> 成反比：<span class=\"katex-inline\">p_j=c/j<\/span>，归一化 <span class=\"katex-inline\">c=1/H_N<\/span>，<span class=\"katex-inline\">H_N=\\sum_{k=1}^{N}1/k<\/span>。代入：<\/p>\n<div class=\"katex-block\">\\bar C_N=\\sum_{j=1}^{N}j\\cdot\\frac{1}{j H_N}=\\frac{N}{H_N}<\/div>\n<p>（PDF 第 317 页，式 (8)(9)）。<\/p>\n<h3>第八步：失败查找代价<\/h3>\n<p>失败不命中任何记录，必须走到表尾，固定 <span class=\"katex-inline\">N<\/span> 次比较；它不随 <span class=\"katex-inline\">p_j<\/span> 变化，也不参与最优排列的加权。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：<span class=\"katex-inline\">N=3<\/span> 加权对照<\/h3>\n<p>概率 <span class=\"katex-inline\">p=(1/2,1/4,1/4)<\/span>。降序摆放：<span class=\"katex-inline\">\\bar C=1/2+2/4+3/4=1.75<\/span>。若反序 <span class=\"katex-inline\">p=(1/4,1/4,1/2)<\/span> 摆在原位置：<span class=\"katex-inline\">\\bar C=1/4+2/4+3/2=2.25<\/span>，差 0.5 次。<\/p>\n<h3>算例 2：均匀分布<\/h3>\n<p><span class=\"katex-inline\">N=100<\/span>：成功平均 <span class=\"katex-inline\">(100+1)/2=50.5<\/span> 次；失败 100 次。<span class=\"katex-inline\">N=1000<\/span>：成功 500.5 次，失败 1000 次。<\/p>\n<h3>算例 3：齐普夫分布<\/h3>\n<p><span class=\"katex-inline\">N=100<\/span>，<span class=\"katex-inline\">H_{100}\\approx5.187<\/span>，<span class=\"katex-inline\">\\bar C=100/5.187\\approx19.3<\/span> 次，远低于均匀分布的 50.5 次；高频集中在前几条是下降主因。<\/p>\n<h3>算例 4：楔形分布<\/h3>\n<p>书中式 (6) 给出 <span class=\"katex-inline\">p_1=Nc,p_2=(N-1)c,\\dots,p_N=c<\/span>，<span class=\"katex-inline\">c=2/[N(N+1)]<\/span>，求得 <span class=\"katex-inline\">\\bar C_N=(N+2)/3<\/span>。<span class=\"katex-inline\">N=100<\/span> 时约 34 次，介于均匀 50.5 与齐普夫 19.3 之间。<\/p>\n<h3>算例 5：动态漂移<\/h3>\n<p>表按去年频率排定，今年访问结构改变，高频记录退到后段；静态次序不再最优，需要重新统计或采用自组织前移规则。<\/p>\n<h3>算例 6：失败与成功分离设计<\/h3>\n<p>有些实现先判断能否成功再扫描，失败路径可提前结束；标准顺序查找的失败代价仍是 <span class=\"katex-inline\">N<\/span>，优化要单独计数。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>表无序且不按频率排<\/strong>：顺序查找仍可运行，但期望停留在等概率或逆序摆放的较高水平；最优排列只在可选择摆放次序时成立。\n<\/li><li>\n<strong>概率和不为 1 或概率估计错误<\/strong>：加权公式基于归一化分布；估计偏差使排定次序偏离实际最优，平均代价被低估。\n<\/li><li>\n<strong>把成功期望套到失败路径<\/strong>：失败固定 <span class=\"katex-inline\">N<\/span> 次，用 <span class=\"katex-inline\">(N+1)/2<\/span> 估会少算近一半。\n<\/li><li>\n<strong>静态表假定长期不变<\/strong>：记录插入删除、频率随业务变化后，一次排定的次序老化，自组织或重排机制缺位。\n<\/ul>\n<h2>补足推导：顺序查找在后续结构中的残留<\/h2>\n<p>散列拉链法中，散列到同一地址的键串成链表，定位地址后仍要在链上顺序核对；链表长度的期望决定这一步比较次数。辅助键全表扫描是顺序查找在属性维度的重现：按属性条件逐条判断是否命中。二分、B 树等结构把 <span class=\"katex-inline\">O(N)<\/span> 降到对数，但结构内部最末一级往往仍回到顺序比较。顺序查找是所有检索结构的底层动作之一。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n命中第 <span class=\"katex-inline\">j<\/span> 条记录为什么比较 <span class=\"katex-inline\">j<\/span> 次？失败查找比较几次？\n<\/li><li>\n加权期望公式里 <span class=\"katex-inline\">p_j<\/span> 满足什么条件？等概率是它的什么特例？\n<\/li><li>\n相邻交换的差值 <span class=\"katex-inline\">\\Delta<\/span> 怎样计算？什么情况下交换有利？\n<\/li><li>\n为什么降序排列是全局最优，而不只是相邻位置最优？\n<\/li><li>\n齐普夫分布下 <span class=\"katex-inline\">\\bar C_N=N/H_N<\/span> 是怎样代入得到的？\n<\/ol>\n<h2>扩展推演：最优排列的适用边界与自组织对照<\/h2>\n<p>相邻交换论证只证明静态最优：次序可一次排定、概率固定不变。若表动态插入新记录，或访问频率随时间漂移，按旧概率排定的次序逐渐偏离最优。自组织表提供另一类规则：每次命中记录后把它前移一位，高频记录自然上浮；不依赖预先统计，但收敛过程有额外移动代价。两类方案分别对应「
