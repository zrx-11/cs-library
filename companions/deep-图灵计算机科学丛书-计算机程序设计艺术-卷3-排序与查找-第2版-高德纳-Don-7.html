同一路径，结点不产生分支。Patricia 把这 <span class=\"katex-inline\">p<\/span> 层压成一个带 SKIP 的结点：查找时一次跳过 <span class=\"katex-inline\">p<\/span> 位，直接落到第一个有分支的位。树结点数降到与键数同量级，路径长度由「有分支的位」决定，而不是由键总位数决定。<\/p>\n<p>查找算法（书中称算法 P）从表头出发：置指针 <span class=\"katex-inline\">P\\leftarrow\\text{HEAD}<\/span>、计数器 <span class=\"katex-inline\">j\\leftarrow0<\/span>；按 LTAG/RTAG 沿左链或右链下移；遇到 SKIP 位数就把 <span class=\"katex-inline\">j<\/span> 加上 SKIP；到比较阶段把参数与结点键逐位核对（PDF 第 397 页）。前缀相同的键在公共段共用路径，分歧位才分两支。<\/p>\n<p>把位分组到字符表就得到字符级 <span class=\"katex-inline\">M<\/span> 路数字树：每层按一个字符值分支，字符集大小为 <span class=\"katex-inline\">M<\/span>；二进制 Patricia 是 <span class=\"katex-inline\">M=2<\/span> 的压缩形态。字符级树的兄弟结点按字符有序排列，中序遍历给出词典序，适合词典、命令树与输入自动补全。插入新键时先沿现有路径下移，在首次分歧位分裂结点：原结点 SKIP 覆盖的前缀被切成两段，两段各记自己的跳过位数；新键与现存键前缀完全相同时，按等值记录挂接规则处理，不新增分支位。插入可能改写上层结点的 SKIP，结构维护比朴素树复杂。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：键可表示成位串；查找沿位序列分支；适合前缀检索与多关键字部分匹配。\n<\/li><li>\n边界一：压缩依赖「连续位在同前缀键中一致」的判断；SKIP 计算错误会破坏定位。\n<\/li><li>\n失败案例一：把大小比较规则套到数字树上，分支依据错位；数字树看位值，不看整键次序。\n<\/li><li>\n失败案例二：不压缩公共前缀，长键集下树高随键长膨胀，单支层占满路径。\n<\/li><li>\n边界二：Patricia 结点含标记与 SKIP，单结点结构比朴素树复杂；插入新键可能在已有结点内分裂。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>数字树 vs 二叉查找树<\/strong>：数字树按位值分支，BST 按整键大小分支；前者不要求全序，后者保留大小次序。\n<\/li><li>\n<strong>朴素数字树 vs Patricia<\/strong>：前者逐层展开所有位，后者 SKIP 压缩单支；结点数与路径长度口径不同。\n<\/li><li>\n<strong>数字查找 vs 散列<\/strong>：数字查找保留前缀层次，支持部分匹配；散列打散前缀关系，只支持等值。\n<\/li><li>\n<strong>SKIP vs 普通层号<\/strong>：普通层每层一位；SKIP 一次跳过多位，跳过的位不提供分支信息。\n<\/ul>\n<p><strong>常见误解<\/strong>：把数字树当成按整键大小排序的结构；它的分支依据是位值，不要求全序，也不保留大小次序。另一个误解是以为压缩只省存储空间：Patricia 压掉的是单支层，路径长度由分歧位数决定，公共前缀越长收益越大。SKIP 计算必须只含一致位，把分歧位跳过去会落进错误子树；反过来把一致位留成单支层，压缩收益就消失了。前缀检索是数字树相对散列的独有能力，散列打散前缀关系，做部分匹配只能遍历全表。<\/p>\n<h2>联系<\/h2>\n<p>前置：c09 树形下移结构、c10 不依赖全局有序的检索路线。后继：c12 辅助键检索可把属性编码成位串接入数字树；倒排与索引组织中，前缀检索是数字查找的典型用途。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（数字查找与 Patricia 树：按位分支、前缀压缩与 SKIP 字段）<\/summary><div class=\"depth-body\"><h1>c11 深度推导：按位分支、前缀冗余与 Patricia 压缩机制<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把数字查找树推清楚，先往回追四层前提：<\/p>\n<ol><li>\n<strong>键能拆成位序列<\/strong>：数字查找的分支依据是每一位的取值；整键先写成二进制串，位序号从高到低排列。\n<\/li><li>\n<strong>位值决定分支方向<\/strong>：0、1 各走一支；这与整键大小比较不同，不要求键之间有全序。\n<\/li><li>\n<strong>公共前缀不产生分支<\/strong>：前缀段所有键取值一致，沿路径重复走同一支，这部分层是冗余的。\n<\/li><li>\n<strong>压缩要保留分支信息<\/strong>：SKIP 跳过一致位，但分歧位必须保留为分支结点；压缩不能丢掉区分键的位置。\n<\/ol>\n<p>依赖链方向：位串表示 → 逐位 0/1 分支 → 公共前缀层冗余 → SKIP 合并单支 → 路径长度由分歧位数决定。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：位串与分支<\/h3>\n<p>键 <span class=\"katex-inline\">K<\/span> 写成位串 <span class=\"katex-inline\">b_1b_2\\cdots b_r<\/span>，<span class=\"katex-inline\">b_1<\/span> 最高位。根结点看 <span class=\"katex-inline\">b_1<\/span>：0 左支、1 右支；下一结点看 <span class=\"katex-inline\">b_2<\/span>，依此类推。每一层对应一位，位序号随层数推进。<\/p>\n<h3>第二步：公共前缀的冗余<\/h3>\n<p>设 <span class=\"katex-inline\">q<\/span> 个键共享长度 <span class=\"katex-inline\">p<\/span> 的前缀，前 <span class=\"katex-inline\">p<\/span> 位在这些键中完全相同。前 <span class=\"katex-inline\">p<\/span> 层每层只有一条可走路径，结点不产生分支；朴素树仍为每层建结点，<span class=\"katex-inline\">p<\/span> 层单支占用路径长度。<\/p>\n<h3>第三步：Patricia 的结点结构<\/h3>\n<p>压缩树的非叶结点保存：SKIP（跳过位数）、分支位序号、左右链接与方向标记。SKIP 内的位在该前缀键中一致，查找时一次越过；到 SKIP 之后的位才比较分支。<\/p>\n<h3>第四步：查找路径<\/h3>\n<p>算法 P（PDF 第 397 页）：<\/p>\n<ol><li>\n置 <span class=\"katex-inline\">P\\leftarrow\\text{HEAD}<\/span>，<span class=\"katex-inline\">j\\leftarrow0<\/span>（<span class=\"katex-inline\">j<\/span> 是参数中已处理的二进制位数）；\n<\/li><li>\n按 LTAG 判断：左链则 <span class=\"katex-inline\">P\\leftarrow\\text{LLINK}(P)<\/span>，置 LTAG 状态后转下一步；\n<\/li><li>\n跳过位：<span class=\"katex-inline\">j\\leftarrow j+\\text{SKIP}(P)<\/span>，若 <span class=\"katex-inline\">j&gt;n<\/span> 转比较阶段；\n<\/li><li>\n检测分支位：参数第 <span class=\"katex-inline\">j<\/span> 位为 0 转左支，为 1 转右支；\n<\/li><li>\n右移：<span class=\"katex-inline\">Q\\leftarrow P<\/span>，<span class=\"katex-inline\">P\\leftarrow\\text{RLINK}(Q)<\/span>，按 RTAG 回到跳过步骤；\n<\/li><li>\n比较：参数与结点键逐位核对，相等成功，不等失败。\n<\/ol>\n<h3>第五步：压缩后的路径长度<\/h3>\n<p>设键集有 <span class=\"katex-inline\">d<\/span> 个出现分歧的位位置。朴素树路径最坏 <span class=\"katex-inline\">r<\/span> 层；Patricia 路径只经过分歧位对应的结点，长度 <span class=\"katex-inline\">O(d)<\/span>。公共前缀越长，压缩收益越大。<\/p>\n<h3>第六步：插入与分裂<\/h3>\n<p>新键与树中键在某位首次分歧时，在该位分裂出分支结点；原有 SKIP 按新分歧位置重新计算。插入可能改变某结点的跳过位数，而不是简单追加叶子。<\/p>\n<h3>第七步：前缀检索<\/h3>\n<p>公共前缀对应树中一条公共路径；查「以某前缀开头的所有键」只需走到前缀末端结点，收集其下子树。这是数字树相对散列的结构优势：散列打散前缀，无法沿前缀聚集。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：四位键分支<\/h3>\n<p>键 <span class=\"katex-inline\">0011,0101,1001<\/span>。根看第 1 位：0 支含前两个，1 支含第三个；0 支内第 2 位分歧（0/1），分出 <span class=\"katex-inline\">0011<\/span> 与 <span class=\"katex-inline\">0101<\/span>。分歧位为第 1、2 位，Patricia 路径最多两层。<\/p>\n<h3>算例 2：公共前缀压缩<\/h3>\n<p>16 个键共享前 8 位前缀，第 9 位才分歧。朴素树前 8 层单支；Patricia 根 SKIP=8，直接落到第 9 位分支结点，路径省 7 层。<\/p>\n<h3>算例 3：THE 查找<\/h3>\n<p>THE 二进制 10111 01000 00101。根 SKIP 指定第 1 位，该位 1 走右支；下一结点 SKIP 跳过连续相同位；到分歧位再分。前缀 TH 对应的键（THIS、THAT、THE）在公共段共用路径（PDF 第 397 页）。<\/p>\n<h3>算例 4：SKIP 误算<\/h3>\n<p>若把一致位算成分歧位，结点过早分叉，单支被拆；若把分歧位算进 SKIP，查找跳过区分键的位置，落到错误子树。SKIP 必须只含一致位。<\/p>\n<h3>算例 5：等值与部分匹配<\/h3>\n<p>数字树可回答「前缀为 TH 的键」；散列查 TH 开头要遍历全表。部分匹配检索是数字树的典型用途。<\/p>\n<h3>算例 6：结点开销<\/h3>\n<p>Patricia 结点除键外要存 SKIP、链接与方向标记；朴素树结点只存链接。压缩省的是层数，单结点结构更重，键数少时收益有限。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>按整键大小做数字树分支<\/strong>：分支依据错位，位值树退化为没有全序依据的乱分支；数字树只看位取值。\n<\/li><li>\n<strong>保留全部单支中间结点<\/strong>：公共前缀长时树高随键位数膨胀，路径被一致位占满，压缩收益消失。\n<\/li><li>\n<strong>SKIP 跳过分歧位<\/strong>：区分键的位置被越过，查找进入错误子树，等值判断也会跟着失败。\n<\/li><li>\n<strong>用数字树做散列式等值检索<\/strong>：结构能完成查找，但前缀层次优势被浪费；两种方法目标场景不同。\n<\/ul>\n<h2>补足推导：数字树与其他检索结构的位置<\/h2>\n<p>数字查找树按位分支，介于二叉查找树与散列之间：比 BST 少要求全序，比散列多保留前缀层次。M 路数字检索树把位分组到 <span class=\"katex-inline\">M<\/span> 进制字符表，每层按字符值分支；Patricia 是其二进制压缩形态。外部索引中，前缀树结构支持词典式遍历与自动补全；倒排索引的词项字典常按这类树组织。与 c09 的 B 树对照：B 树按键大小多路平衡，数字树按键位前缀分支，两者都压矮树高，分支依据不同。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n数字树每一层看键的哪一部分？0、1 各走哪支？\n<\/li><li>\n公共前缀为什么不产生分支？朴素树在这一段浪费了什么？\n<\/li><li>\nSKIP 字段保存什么？跳过的位必须满足什么条件？\n<\/li><li>\nPatricia 查找路径长度由什么决定？与键总位数是什么关系？\n<\/li><li>\n数字树为什么支持前缀检索，散列为什么不支持？\n<\/ol>\n<h2>扩展推演：字符级数字树、插入分裂与前缀检索用途<\/h2>\n<p>M 路数字检索树把位分组到字符表：每层按键的一个字符值分支，字符集大小 <span class=\"katex-inline\">M<\/span>；二进制 Patricia 是 <span class=\"katex-inline\">M=2<\/span> 的压缩形态。字符级树适合词典式遍历：兄弟结点按字符有序排列，中序遍历即词典序。前缀检索自动补全、词项字典、命令树都用这类结构。<\/p>\n<p>插入新键时先沿现有路径下移，到首次分歧位分裂结点。原结点的 SKIP 覆盖范围被新分歧切成两段，两段各记自己的跳过位数；若新键与某现存键前缀完全相同，按等值记录挂接规则处理。插入可能改变上层 SKIP，不是简单追加叶子。<\/p>\n<p>压缩收益取决于公共前缀长度。键集前缀分歧早，压缩空间有限；自然语言词项共享长前缀，Patricia 收益明显。结点除键外要存 SKIP、左右链与方向标记，单结点比朴素树重；键数少时结构开销可能超过层数节省。<\/p>\n<p>补充算例：三个 5 位键 <span class=\"katex-inline\">00110,01010,10010<\/span>。第 1 位分出 1 支（第三键）与 0 支（前两键）；0 支内第 2 位分歧（0/1），分出前两键。分歧位为第 1、2 位，Patricia 路径两层。若三键共享前 4 位、第 5 位才分，根 SKIP=4，路径一层到位。<\/p>\n<p>与散列对照：散列把前缀关系打散，查 TH 开头要遍历全表；数字树沿 TH 公共路径下移，收集末端子树即可。与 BST 对照：BST 按整键大小分支，支持有序范围遍历；数字树按位值分支，不保留全序。两类树分支依据不同，服务的检索类型不同。<\/p>\n<h2>再补充：压缩边界与适用场景<\/h2>\n<p>Patricia 压缩的是「一致位构成的单支层」；若键集分歧频繁，公共前缀短，可压缩空间有限，结点额外的 SKIP 与标记反而成为开销。键共享长前缀（自然语言词项、编号序列）时压缩收益最大。<\/p>\n<p>插入分裂后要重算相关结点 SKIP；新键与现存键前缀完全相同时，按等值挂接规则处理，不新增分支位。删除结点可能合并单支，结构维护比朴素树复杂。<\/p>\n<p>数字树按位值分支，不保留整键全序；它支持前缀与部分匹配，不直接支持有序范围遍历。字符级 M 路检索树按字符分支，兄弟结点有序排列时中序遍历给出词典序，这是词典、自动补全的常用结构。<\/p>\n<h2>边界小结<\/h2>\n<p>数字查找树按位值分支，前提是键可拆成位串；Patricia 压缩只对公共前缀生效，分歧频繁的键集收益有限。SKIP 必须只含一致位，跳过分歧位会落进错误子树。数字树不保留整键全序，范围遍历要另配结构；前缀与部分匹配是它相对散列的独有能力。字符级 M 路树与二进制 Patricia 是同一思想在不同字符表上的形态。<\/p>\n<h2>再补充：字符级分支、插入分裂与压缩收益边界<\/h2>\n<p>字符级 <span class=\"katex-inline\">M<\/span> 路数字树把位分组到字符表，每层一个字符值；与二进制树相比，路径层数减少、结点扇出增大，结点内兄弟按字符有序时中序遍历即词典序。两类结构分支依据都是键的分段取值，不是整键大小；范围遍历要靠兄弟有序排列，而不是靠二叉查找树的中序骨架。<\/p>\n<p>插入分裂后要重算相关结点的 SKIP：新键在某一位与现有键分歧，该位之前的一致位保留在上层结点，分歧位起新开分支。若新键整条前缀与某现存键相同，等值记录直接挂到该键结点下，不产生新分支。删除结点时，若某结点两个子支合并成单一路径，可把结点压回父结点的 SKIP 中，结构方向与插入相反。<\/p>\n<p>压缩收益取决于公共前缀长度：自然语言词项、编号序列共享长前缀，Patricia 收益明显；键集分歧频繁、前缀短时，可压缩空间有限，结点额外的 SKIP 与标记反而成为开销。判断一个键集是否适合 Patricia，先统计最长公共前缀与分歧位分布，再权衡结点结构成本。<\/p>\n<h2>边界补充<\/h2>\n<p>数字树按位值分支，前提是键可拆成位串；Patricia 压缩只对公共前缀生效，分歧频繁的键集收益有限。SKIP 必须只含一致位，跳过分歧位会落进错误子树；数字树不保留整键全序，范围遍历要另配结构。字符级 <span class=\"katex-inline\">M<\/span> 路树与二进制 Patricia 是同一思想在不同字符表上的形态，兄弟有序时中序遍历给出词典序。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出三个 5 位键，指出它们的分歧位位置与 Patricia 路径层数。\n<\/li><li>\nSKIP 把分歧位算进去会造成什么错误？\n<\/li><li>\nPatricia 插入新键时，原有结点的 SKIP 为什么可能要重算？\n<\/li><li>\n数字树与二叉查找树的分支依据有何不同？\n<\/li><li>\n前缀检索在数字树上怎样完成？对应散列要付出什么代价？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "数字查找与 Patricia 树：按位分支、前缀压缩与 SKIP 字段"}, "c12": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/计算机程序与设计艺术/图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版 (高德纳（Donald E.Knuth）著；贾洪峰译, (美) 克努特, (Knuth etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.443<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c10\">散列查找：散列函数、拉链法与线性探查，装填因子与探查长度<\/a><\/span><\/div><h1>辅助键的查找：属性检索、简单/范围/布尔查询与倒排思路<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch04（原书 §6.5 辅助键的查找，PDF 第 443 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>前面的查找都围绕主键：主键唯一确定一条记录。实际业务常按主键之外的属性找记录，例如按专业、所在州、年龄范围筛选学生。困难在于：属性取值不唯一，一个属性值对应一批记录；查询条件有定值、范围、组合多种形式；主键次序对属性检索没有帮助。这个概念区分三类查询，说明全表扫描、聚集与辅助索引各自的适用边界。<\/p>\n<h2>定义<\/h2>\n<p><strong>辅助键（secondary key）<\/strong>：记录中除主键外用来检索的字段或属性；一个辅助键值对应多条记录。<\/p>\n<p><strong>简单查询<\/strong>：给出特定属性的特定定值，如「专业 = 数学」「居住州 = 俄亥俄」（PDF 第 443 页）。<\/p>\n<p><strong>范围查询<\/strong>：给出指定属性的取值范围，如「<span class=\"katex-inline\">21&lt;年龄\\le23<\/span>」「费用 &lt; \\$18.00」（PDF 第 443 页）。<\/p>\n<p><strong>布尔查询<\/strong>：用 AND、OR、NOT 把简单或范围查询组合起来，如「（专业 = 数学）AND（居住州 = 俄亥俄）」（PDF 第 443 页）。<\/p>\n<p><strong>批量聚集<\/strong>：批量提交多个查询时，先对整个文件顺序扫描、在结果上聚集，查询之间不重复扫描。<\/p>\n<p><strong>正例<\/strong>：「查所有讲法语的未婚女研究生」是多个条件经 AND 组合的布尔查询。<strong>反例<\/strong>：把属性等值查询当主键查找，指望一次定位唯一记录；辅助键命中的是记录集合。<\/p>\n<h2>原理推导<\/h2>\n<p>主键索引按唯一键定位单条记录；辅助键检索要先得到满足属性条件的记录集合。无辅助索引时，唯一通用手段是全表顺序扫描：逐条读取记录，判断属性条件是否成立，命中即收入结果集。扫描代价与文件长度成正比，与查询条件个数无关。<\/p>\n<p>批量查询共享一次扫描：多个查询条件在同一遍扫描中逐条判定，避免每个查询各扫一遍。文件不大、查询不要求即时响应时，扫描法可能最经济；大型文件、复杂查询则需要额外索引：为属性值建立到记录集合的映射（倒排思路），把按属性找记录转成查表与集合运算。人工打印索引是最朴素的形式（PDF 第 443 页）。<\/p>\n<p>倒排表由词典与记录列表两部分组成：词典登记出现过的属性值，每个属性值挂一条按记录编号有序排列的列表（posting）。简单查询直接取出对应列表；范围查询把区间覆盖的若干属性值列表合并；布尔查询先取各子条件列表，再做交集、并集或差集。列表有序时交集用双指针归并，公共元素留下；并集合并去重；差集从全集列表中减去子条件列表。列表长度悬殊时，先取最短列表逐条在长表中查找，可减少归并比较次数；NOT 子条件通常要访问全集或补集，代价高于 AND 与 OR。这套结构把「在文件里逐行筛属性」换成「查表后对列表做集合运算」，查询代价与命中列表长度相关，不再随全文件长度线性增长。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：记录带可检索属性；查询类型明确；扫描或索引成本与文件规模匹配。\n<\/li><li>\n边界一：范围查询与布尔查询无法直接利用主键次序；等值散列也不保留区间关系。\n<\/li><li>\n失败案例一：只建主键索引就处理属性筛选，查询退回全表扫描。\n<\/li><li>\n失败案例二：把简单查询的索引思路直接套到布尔组合上，多条件交集/差集需要集合运算，不是单表定位。\n<\/li><li>\n边界二：复杂查询的代价还包括索引维护、更新开销；辅助索引越多，写入成本越高。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>主键 vs 辅助键<\/strong>：主键唯一确定一条记录；辅助键对应记录集合，检索结果是一批。\n<\/li><li>\n<strong>简单 vs 范围 vs 布尔<\/strong>：定值单点、区间连续、逻辑组合；三类条件的索引与运算方式逐层复杂。\n<\/li><li>\n<strong>扫描 vs 索引<\/strong>：扫描通用但随文件线性变慢；索引把属性条件转成查表，占用额外空间并增加维护成本。\n<\/li><li>\n<strong>批量聚集 vs 逐条查询<\/strong>：多查询共享一遍扫描；逐条查询各扫一遍，重复劳动。\n<\/ul>\n<p><strong>常见误解<\/strong>：把辅助键当主键期待一次定位；属性值对应一批记录，检索结果是集合而不是单条。另一个误解是以为建了主键索引就能筛属性：主键次序与属性无关，索引帮不上忙。布尔查询也不是单条件查表，AND、OR、NOT 要在倒排列表上做交集、并集、差集；NOT 通常要从全集减去子条件列表，代价高于前两者。辅助索引越多写入维护越贵，读多写少的场景才适合多建；文件不大、查询不要求即时响应时，顺序扫描加批量聚集可能是最经济的方案，人工整理索引是其朴素形态。<\/p>\n<p>索引数量还要按读写比例权衡：一条记录在多个属性上变更，对应词典条目与 posting 列表都要同步更新；索引建得越多，每次写入要维护的列表越长，存储占用也越大。读多写少的目录、词典类场景适合多建辅助索引；写密集的事务系统则要精简索引，把维护成本压下来。范围查询依赖属性值在词典中的有序排列，散列这类把键打散的结构给不出区间；同一批记录面对等值、区间、前缀、组合四类查询时，往往需要不同结构配合，没有单一索引能同时覆盖全部查询类型。<\/p>\n<h2>联系<\/h2>\n<p>前置：c08 顺序扫描、c10 散列等值定位、c11 前缀索引。后继：本概念是数据库索引组织的入口；倒排表把属性词项映射到记录列表，与散列链、数字树等结构配合服务复合查询。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（辅助键的查找：属性检索、简单/范围/布尔查询与倒排思路）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：属性检索分类、扫描代价与倒排集合运算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把辅助键检索推清楚，先往回追四层前提：<\/p>\n<ol><li>\n<strong>检索对象从单条记录变成记录集合<\/strong>：辅助键值不唯一，查询返回满足条件的一批记录，定位目标不是一条而是一个集合。\n<\/li><li>\n<strong>条件形式分三类<\/strong>：定值、范围、布尔组合；三类条件利用次序关系的能力不同，索引设计要分别对待。\n<\/li><li>\n<strong>主键次序不服务属性筛选<\/strong>：按主键排好的文件，属性取值随机散布，顺序扫描仍是无索引时的通用手段。\n<\/li><li>\n<strong>索引是空间换时间<\/strong>：为属性建映射要额外存储并承担更新维护；扫描省索引但随文件线性变慢，两条路线按规模权衡。\n<\/ol>\n<p>依赖链方向：属性记录集合 → 简单/范围/布尔条件 → 无索引全表扫描 → 批量聚集共享扫描 → 倒排映射把属性条件转成集合交并差。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：区分主键与辅助键<\/h3>\n<p>主键唯一标识记录，查找返回至多一条；辅助键是属性字段，同一属性值可挂多条记录。学生表中学号是主键，专业、州、年龄、婚姻状况是辅助键。<\/p>\n<h3>第二步：三类查询的形式<\/h3>\n<ul><li>\n简单查询：属性 = 定值，如「专业 = 数学」；\n<\/li><li>\n范围查询：属性落在区间，如「<span class=\"katex-inline\">21&lt;年龄\\le23<\/span>」；\n<\/li><li>\n布尔查询：AND、OR、NOT 组合上述条件，如「（专业 = 数学）AND（州 = 俄亥俄）」（PDF 第 443 页）。\n<\/ul>\n<h3>第三步：无索引时的扫描过程<\/h3>\n<p>逐条读取记录，对每条判定条件：简单查询比对属性值；范围查询比较上下界；布尔查询先算各子条件再按逻辑组合。命中收入结果集，未命中跳过。扫描一遍处理完所有条件，代价 <span class=\"katex-inline\">O(N)<\/span>，<span class=\"katex-inline\">N<\/span> 为记录数。<\/p>\n<h3>第四步：批量聚集<\/h3>\n<p>多个查询同时提交时，一遍扫描内对每条记录判定全部查询条件，各查询结果分别收集；避免每个查询单独扫一遍。查询越多，共享扫描省下的重复读取越大。<\/p>\n<h3>第五步：倒排映射的思路<\/h3>\n<p>为每个属性值维护一个记录列表（倒排表）：属性值 → 含该值的记录编号集合。等值查询直接取对应列表；范围查询取区间覆盖的若干列表；布尔查询把各子条件列表做交集（AND）、并集（OR）、差集（NOT）。查表与集合运算替代逐条扫描。<\/p>\n<h3>第六步：集合运算口径<\/h3>\n<p>AND 对应交集：同时满足两条件的记录在两个列表都出现；OR 对应并集；NOT 对应全集减去子条件列表。列表有序时交集、差集可按归并方式线性扫描。<\/p>\n<h3>第七步：索引维护代价<\/h3>\n<p>辅助索引在记录插入、删除、修改时要同步更新对应列表；索引越多写入越慢。读多写少的场景适合建辅助索引，写密集场景要权衡索引数量。<\/p>\n<h3>第八步：人工索引的朴素形态<\/h3>\n<p>书中提到最朴素的辅助索引是人工打印的信息索引：打印时整理属性与记录对应关系，旧纸页重复使用；规模小、查询简单时这种人工整理已经够用（PDF 第 443 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：扫描代价<\/h3>\n<p>文件 <span class=\"katex-inline\">N=10^5<\/span> 条，单条判定常数次比较；全表扫描约 <span class=\"katex-inline\">10^5<\/span> 次读取。无索引时无论条件多简单，代价都随 <span class=\"katex-inline\">N<\/span> 线性增长。<\/p>\n<h3>算例 2：批量聚集<\/h3>\n<p>10 个查询共享一遍扫描：读取 <span class=\"katex-inline\">N<\/span> 条记录、每条判定 10 个条件；逐条查询则读取 <span class=\"katex-inline\">10N<\/span> 次。共享扫描把读取量压到 <span class=\"katex-inline\">1/10<\/span>。<\/p>\n<h3>算例 3：倒排交集<\/h3>\n<p>「专业 = 数学」列表 800 条，「州 = 俄亥俄」列表 500 条，交集 60 条；AND 查询结果 60 条，不必扫描全表。两列表有序时交集按双指针归并求出。<\/p>\n<h3>算例 4：范围查询<\/h3>\n<p>年龄索引按值排序，<span class=\"katex-inline\">21&lt;年龄\\le23<\/span> 取 22、23 两个值对应的列表；散列只支持等值，无法直接给出区间。<\/p>\n<h3>算例 5：NOT 差集<\/h3>\n<p>「非数学专业」= 全集减去数学专业列表；全集规模大时差集仍需遍历，NOT 条件在倒排中代价通常高于 AND/OR。<\/p>\n<h3>算例 6：索引维护<\/h3>\n<p>一条记录专业、州、年龄三个属性变更，三个辅助索引列表都要更新；辅助索引数量直接折算成写入成本。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>只靠主键索引做属性筛选<\/strong>：主键次序与属性无关，索引帮不上忙，查询退回全表扫描。\n<\/li><li>\n<strong>把辅助键当唯一键定位<\/strong>：属性值对应一批记录，期待一次定位单条会漏掉同值其他记录。\n<\/li><li>\n<strong>布尔查询只做单条件查表<\/strong>：AND/OR/NOT 需要集合交并差，单列表取不出组合结果。\n<\/li><li>\n<strong>索引无限增加<\/strong>：读查询变快，但写入维护成本与存储占用膨胀；索引数量要按读写比例取舍。\n<\/ul>\n<h2>补足推导：辅助检索与全书查找结构的汇合<\/h2>\n<p>顺序查找（c08）是无索引扫描的基线；二分与 B 树（c09）服务有序主键检索；散列（c10）服务等值定位；数字树（c11）支持前缀匹配；倒排表把这些结构组织在属性维度：词项字典可用数字树或 B 树，词项到记录的映射是列表或散列链。复合查询先在各属性索引上取列表，再做集合运算。第 5 章排序产物提供有序表基础，第 6 章各类查找结构按查询类型分工：等值、有序、前缀、属性集合，各有适用前提。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n辅助键与主键在检索结果上有什么差别？\n<\/li><li>\n三类查询各是什么形式？举例说明。\n<\/li><li>\n无索引时辅助查询怎样执行？代价随什么增长？\n<\/li><li>\n批量聚集为什么能省读取？共享的是哪一遍扫描？\n<\/li><li>\n倒排表把属性条件转成什么运算？AND、OR、NOT 各对应哪种集合操作？\n<\/ol>\n<h2>扩展推演：倒排实现、集合运算代价与索引取舍<\/h2>\n<p>倒排表由词典（属性值列表）和 postings（记录编号列表）两部分组成。词典可用数字树、B 树或散列组织；postings 通常按记录编号有序存放，便于交集、并集按归并方式扫描。等值查询直接取一条 posting；范围查询取区间覆盖的若干条 posting 合并；布尔查询先取各子条件列表，再做集合运算。<\/p>\n<p>AND 交集：两列表有序时双指针归并，公共元素留下；OR 并集：合并去重；NOT 差集：全集减去子条件列表。NOT 代价最高，因为要遍历全集或补集；实际系统常把 NOT 条件转成正面条件再检索。列表长度悬殊时，先取最短列表逐条在长表中查，可减少比较次数。<\/p>\n<p>索引取舍按读写比例：读多写少的查询场景（词典、目录）适合多建辅助索引；写密集的事务系统，每条记录更新要同步多个 posting，索引越多写入越慢。辅助索引还占用存储，词典与 postings 都要持久化。人工打印索引是倒排的朴素形态：纸页上整理属性与记录对应，旧页重复使用，规模小、查询简单时够用。<\/p>\n<p>补充算例：<span class=\"katex-inline\">N=10^5<\/span> 全表扫描，单条判定常数次；10 个查询逐条扫要 <span class=\"katex-inline\">10N<\/span> 次读取，批量聚集一遍扫描 <span class=\"katex-inline\">N<\/span> 次。倒排交集：专业列表 800、州列表 500，交集 60；双指针归并代价与两表长度和成比例，不碰全表。范围查询按年龄值取 22、23 两条 posting；散列只给等值，给不出区间。NOT「非数学专业」要从全集减去 800 条列表，全集规模大时差集代价高。<\/p>\n<p>全书查找结构在此汇合：顺序扫描是无索引基线；二分、B 树服务有序主键；散列服务等值；数字树服务前缀；倒排把属性值映射到记录集合，再与上述结构配合完成复合查询。第 5 章排序提供有序表基础，第 6 章各类方法按查询类型分工，前提与代价各有边界。<\/p>\n<h2>再补充：查询代价与索引维护<\/h2>\n<p>简单查询走等值索引；范围查询要按属性有序的索引取区间 posting；布尔查询先分离子条件取列表，再交并差。列表长度悬殊时先取最短列表逐条匹配，减少归并比较量。NOT 条件通常转成正面条件，避免遍历全集。<\/p>\n<p>索引数量受写入成本约束：一条记录多个属性变更，对应 posting 都要更新；读多写少的目录类场景适合多建，写密集系统要精简。词典与 postings 都占持久存储，复合查询的中间结果也需要临时空间。<\/p>\n<p>无索引时全表扫描是唯一通用手段；批量聚集让多查询共享一遍扫描。文件不大、响应要求不高时，扫描法省去索引维护，人工打印索引是其朴素形态。属性检索与主键检索分工：主键定位单条，辅助键返回记录集合。<\/p>\n<h2>再补充：词典组织、列表有序的作用与检索链路<\/h2>\n<p>词典本身是一份属性值到 posting 的映射，它的组织方式沿用第 6 章前面讲过的结构：属性值离散且需要等值定位时可用散列；属性值需要按区间遍历、词典序排列时可用数字查找树或 B 树。词典选型与 posting 组织是两件事：前者决定怎样找到属性值条目，后者决定取出的记录列表怎样参与交并差。<\/p>\n<p>posting 按记录编号有序存放，交集与并集才能用双指针归并：两个指针各扫一条列表，编号相等收入交集，较小编号的指针前移。若列表无序，交集只能逐条比对，代价随两表长度乘积增长。有序 posting 还支持压缩存储：相邻编号差值单独编码，区间内编号密集时压缩收益明显；编号稀疏时差值大，压缩收益下降。<\/p>\n<p>检索链路按查询类型展开：简单查询走「词典定位 → 取 posting → 返回记录集合」；范围查询先在有序词典上圈出区间属性值，合并对应 posting；布尔查询把各子条件列表取出后，按 AND、OR、NOT 的逻辑组合。NOT 差集需要全集编号序列，全集通常由主记录表提供；缺失全集时 NOT 条件无法直接计算，只能转成等价的正面条件。<\/p>\n<p>人工打印索引受纸张容量限制，属性值与记录对应只能手工抄录，查询时翻页对照，规模稍大就难以维护；它的价值在于把「属性到记录」的映射关系显性化，倒排表是这一思路在计算机上的系统化实现。无索引的扫描法不维护任何映射结构，代价随文件长度线性增长；索引法用空间与写入维护换取查询阶段的列表运算，两条路线的取舍由文件规模、查询频率与读写比例共同决定。<\/p>\n<h2>链路补充：从无索引扫描到倒排表的完整检索过程<\/h2>\n<p>先看无索引基线：文件中有 <span class=\"katex-inline\">N<\/span> 条记录，每个查询逐条读取记录、判定属性条件，命中收入结果集。一次查询的读取量与 <span class=\"katex-inline\">N<\/span> 成正比；<span class=\"katex-inline\">Q<\/span> 个查询逐条提交，总读取量 <span class=\"katex-inline\">QN<\/span>。批量聚集把 <span class=\"katex-inline\">Q<\/span> 个查询条件放进同一遍扫描，每条记录读出后依次判定各条件，总读取量压到 <span class=\"katex-inline\">N<\/span>，代价与查询个数脱钩。这个方案通用，但文件规模大时单次扫描仍然不短，也不支持把单个属性条件快速定位到记录集合。<\/p>\n<p>再看倒排表的组织：词典登记全部出现过的属性值，每个值挂一条按记录编号有序的 posting。词典本身可用数字树、B 树或散列组织，选型沿用第 6 章前面的结论；posting 有序是交并集归并扫描的前提。简单查询取出对应 posting 即得记录集合；范围查询先在有序词典上圈出区间值，合并若干 posting；布尔查询先取各子条件列表，再做交集、并集、差集。交集双指针归并：编号相等留下，较小编号指针前移；并集合并去重；差集从全集编号序列中减去子条件列表。<\/p>\n<p>列表长度悬殊时，先取最短列表逐条在长表中匹配，减少归并比较量；NOT 差集需要全集或补集，缺失全集时只能转成等价正面条件。索引维护发生在写入环节：记录属性变更时，词典条目与相关 posting 都要同步更新；索引越多，单次写入维护的列表越长，存储占用也越大。读多写少的目录、词典类场景适合多建辅助索引，写密集事务系统要精简索引。<\/p>\n<p>人工打印索引是倒排的朴素形态：纸页上整理属性与记录对应，规模小、查询简单时够用，稍大就难以手工维护。它把「属性到记录」的映射显性化，倒排表是这一思路在计算机上的系统化实现。检索链路至此汇合：顺序扫描是无索引基线；二分与 B 树服务有序主键；散列服务等值；数字树服务前缀；倒排把属性值映射到记录集合，再与上述结构配合完成复合查询。排序产物（有序表）是二分、B 树等有序查找方法的前提；各方法的适用边界由查询类型与读写比例共同决定。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出一个布尔查询，并拆出它的简单子条件与集合运算。\n<\/li><li>\n范围查询为什么不能直接用散列等值索引？\n<\/li><li>\n倒排交集在列表有序时怎样高效求出？\n<\/li><li>\n辅助索引的维护代价发生在什么操作上？\n<\/li><li>\n扫描法与索引法各自的适用规模和前提是什么？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "辅助键的查找：属性检索、简单/范围/布尔查询与倒排思路"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：排序的组合性质与内部排序：反序、插入、交换、选择、合并<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 5.1–5.2 章：排序的组合性质与内部排序<\/a><br>检查点：能说清反序与稳定性的含义，写出直接插入排序最坏与平均比较次数，沿递推推出快速排序期望比较次数 $2N\\ln N$，区分选择排序与锦标赛树、两路合并与自然两路合并的结构差别<\/li><li class='path-step' id='path-02'><strong>步骤 02：最优排序与外部排序：比较下界、排序网络、多路合并与替代选择<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 5.3–5.4 章：最优排序与外部排序<\/a><br>检查点：能用决策树叶子数推出 $\\lceil\\lg N!\\rceil$ 比较下界并用 Stirling 公式放缩，说明外部排序在内存受限时怎样生成初始游程、用 $P$ 路合并把扫描遍数压到 $\\lceil\\log_P S\\rceil$<\/li><li class='path-step' id='path-03'><strong>步骤 03：顺序查找与按键比较的查找：静态最优排列、二分查找、查找树与 B 树<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 6.1–6.2 章：顺序查找与按键比较进行的查找<\/a><br>检查点：能写出加权平均比较次数 $\\bar C_N=\\sum j p_j$ 并证明频率降序最优，沿区间长度递推推出二分查找比较次数上界，说明二叉查找树怎样退化成链、平衡树与多路 B 树怎样控制高度<\/li><li class='path-step' id='path-04'><strong>步骤 04：数字查找、散列与辅助键检索：数字树、Patricia、拉链与探查、倒排<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 6.3–6.5 章：数字查找、散列与辅助键的查找<\/a><br>检查点：能说清数字查找按位分支的依据，解释 Patricia 怎样用 SKIP 字段压缩单支结点；按装填因子推出拉链法与线性探查的平均探查长度，区分简单查询、范围查询与布尔查询在辅助键检索中的处理差别<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='键（key）'>键（key） — 记录中用来排序或查找的特殊字段；本书假定每条记录都含一个键，键值决定记录在序列中的次序（原书第 6 章开头，PDF 第 312 页） <span class=glossary-ref>（第 5.1–5.2 章：排序的组合性质与内部排序）<\/span><\/li><li data-term='记录（record）'>记录（record） — 携带键与附属信息的数据项；排序与查找算法通常只比较键，附属信息随记录一起移动（原书 5.2.1 节，PDF 第 67 页） <span class=glossary-ref>（第 5.1–5.2 章：排序的组合性质与内部排序）<\/span><\/li><li data-term='稳定性（stability）'>稳定性（stability） — 排序完成后，键相等的记录保持其输入时相对次序的性质；比较相等时不交换即可维持稳定（原书 5.2.2 节习题涉及，PDF 第 110 页前后） <span class=glossary-ref>（第 5.1–5.2 章：排序的组合性质与内部排序）<\/span><\/li><li data-term='反序（逆序对，inversion）'>反序（逆序对，inversion） — 排列中一对位置 $i&lt;j$ 而键 $K_i&gt;K_j$ 的记录；反序总数是衡量排序前混乱程度与交换类算法代价的度量（原书 5.1.1 节，PDF 第 15 页） <span class=glossary-ref>（第 5.1–5.2 章：排序的组合性质与内部排序）<\/span><\/li><li data-term='游程（run）'>游程（run） — 文件中一段已经按键非递减顺序排好的连续记录；合并排序与外部排序都以游程作为合并的基本单位（原书 5.2.4 节，PDF 第 130 页前后） <span class=glossary-ref>（第 5.1–5.2 章：排序的组合性质与内部排序）<\/span><\/li><li data-term='决策树（decision tree）'>决策树（decision tree） — 把一次排序中各次键比较作为内部结点、排列结果作为叶子的二叉树；树高给出比较次数下界的分析框架（原书 5.3.1 节，PDF 第 146 页） <span class=glossary-ref>（第 5.3–5.4 章：最优排序与外部排序）<\/span><\/li><li data-term='外部排序（external sorting）'>外部排序（external sorting） — 待排文件大于内存容量、需借助磁带或磁盘分遍扫描与合并的排序方式；与内部排序相对（原书 5.4 节，PDF 第 203 页） <span class=glossary-ref>（第 5.3–5.4 章：最优排序与外部排序）<\/span><\/li><li data-term='替代选择（replacement selection）'>替代选择（replacement selection） — 在内存中用选择树持续输出当前最小键、并把新读入记录补回树中，从而生成长于内存容量的初始游程的技术（原书 5.4.1 节，PDF 第 203 页） <span class=glossary-ref>（第 5.3–5.4 章：最优排序与外部排序）<\/span><\/li><li data-term='静态表与动态表'>静态表与动态表 — 静态表内容在建表后基本不变，分析时把查找时间压到最低；动态表允许频繁插入与删除，结构需兼顾更新代价（原书第 6 章开头，PDF 第 312 页） <span class=glossary-ref>（第 6.1–6.2 章：顺序查找与按键比较进行的查找）<\/span><\/li><li data-term='二分查找（binary search）'>二分查找（binary search） — 在已排序表中每次与中间位置比较、舍弃一半候选区间的查找法；比较次数随 $\\lg N$ 增长（原书 6.2.1 节，PDF 第 324 页） <span class=glossary-ref>（第 6.1–6.2 章：顺序查找与按键比较进行的查找）<\/span><\/li><li data-term='b 树（b-tree）'>B 树（B-tree） — 为外部存储设计的多路平衡树：除根外结点至少 $\\lceil m/2\\rceil$ 个子结点，结点内有序，高度受控；1970 年由拜尔和麦克赖特提出（原书 6.2.4 节，PDF 第 383 页） <span class=glossary-ref>（第 6.1–6.2 章：顺序查找与按键比较进行的查找）<\/span><\/li><li data-term='散列函数（hash function）'>散列函数（hash function） — 把键变换成散列表地址的函数；好的散列应与机器无关、与数据分布无关，使不同键尽量落到不同地址（原书 6.4 节，PDF 第 413 页） <span class=glossary-ref>（第 6.3–6.5 章：数字查找、散列与辅助键的查找）<\/span><\/li><li data-term='拉链法（chaining）'>拉链法（chaining） — 散列地址相同的键串成同一链表的冲突处理方式；查找时先散列定位，再在对应链表中顺序查找（原书 6.4 节，PDF 第 414 页） <span class=glossary-ref>（第 6.3–6.5 章：数字查找、散列与辅助键的查找）<\/span><\/li><li data-term='线性探查（linear probing）'>线性探查（linear probing） — 冲突后按固定步长依次探查下一地址，直到找到空槽或目标键的开放定址法（原书 6.4 节，PDF 第 418 页） <span class=glossary-ref>（第 6.3–6.5 章：数字查找、散列与辅助键的查找）<\/span><\/li><li data-term='辅助键（secondary key）'>辅助键（secondary key） — 主键之外用来检索的字段或属性；按辅助键取值定位记录的查询分简单、范围与布尔三类（原书 6.5 节，PDF 第 443 页） <span class=glossary-ref>（第 6.3–6.5 章：数字查找、散列与辅助键的查找）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库<\/h1>\n<h2>模式 1：先分清键、记录与稳定性前提，再谈排序动作<\/h2>\n<p>分析任何排序方法，先把三个对象分开：用来比较的键、携带附属信息的记录、决定等值次序的稳定性。比较只发生在键之间，记录随键移动；稳定性只在键相等时才有意义，比较相等时不交换、等值归并取左段，是两种维持稳定的常见规则。跳过这一步，容易把记录搬移成本算成键比较成本，也容易误判一个方法在等值密集输入上的次序表现。键可比较、记录可移动，是后续所有排序算法成立的共同前提。<\/p>\n<h2>模式 2：代价分「比较次数」与「移动次数」两条线记账<\/h2>\n<p>排序方法的性能不能只报一个数字。键比较次数随输入反序数、划分位置变化；记录移动次数随搬移宽度、辅助空间方案变化；MIX 指令口径下还要分比较指令与移动指令分别计。比较两类算法前先核对记的是哪条线：插入排序比较与移动都偏多，选择排序交换次数封顶 <span class=\"katex-inline\">N-1<\/span>，归并排序每轮扫遍记录。记录宽、键窄时搬移代价上升，方法选择随之改变；只按比较次数排优劣，会漏掉存储与移动这一整项成本。<\/p>\n<h2>模式 3：平均情形先写概率假设，再推加权求和<\/h2>\n<p>平均比较次数不是凭直觉报的数。先列假设：键互不相同、输入排列等概率、基准等概率落位、查找键按给定概率分布。假设写成求和式的权重，再沿位置或轮次累加。顺序查找的 <span class=\"katex-inline\">\\bar C_N=\\sum j\\,p_j<\/span>、快速排序的 <span class=\"katex-inline\">2N\\ln N<\/span>、散列的探查长度，都建立在明确的分布假设上。把等概率换成齐普夫或偏斜分布，结论随之改变；反事实分析就是反过来：去掉某条假设，看公式哪一项失效、代价向哪个方向恶化。<\/p>\n<h2>模式 4：分治方法沿递推式拆分「规模」与「合并代价」<\/h2>\n<p>快速排序、合并排序、<span class=\"katex-inline\">P<\/span> 路合并都是分治结构：先写递推式，把规模 <span class=\"katex-inline\">N<\/span> 拆成子问题规模，再加上本轮划分或合并的工作量。快速排序 <span class=\"katex-inline\">C_N=N+1+\\frac{2}{N}\\sum C_k<\/span>，合并排序每轮 <span class=\"katex-inline\">N<\/span> 次比较、共 <span class=\"katex-inline\">\\lceil\\lg N\\rceil<\/span> 轮。推递推时先问子问题是否同构、划分是否均匀、本轮代价是线性还是对数；偏斜划分会把递归深度从对数拉到线性。递推解出来后主项与低次项分开看，主项决定量级，常数与线性项决定同量级方法之间的差距。<\/p>\n<h2>模式 5：下界从候选规模的对数推，不从试跑快慢推<\/h2>\n<p>判断「还能不能更快」，先数需要区分多少种结果：排序区分 <span class=\"katex-inline\">N!<\/span> 种排列，二分查找区分 <span class=\"katex-inline\">N<\/span> 个候选。每一步比较把候选集分成两支，<span class=\"katex-inline\">h<\/span> 次比较最多区分 <span class=\"katex-inline\">2^h<\/span> 种结果，由此得 <span class=\"katex-inline\">2^h\\ge N!<\/span>，即 <span class=\"katex-inline\">h\\ge\\lceil\\lg N!\\rceil<\/span>。这是信息论下界，与具体算法无关；试跑时小规模数据快慢受常数与缓存影响，推不出量级结论。达到下界同阶的方法（归并、树选择）与下界之间仍有线性项差距；下界说明不能再少到哪里，不直接给出最优算法。<\/p>\n<h2>模式 6：内部与外部按「数据能否进内存」分档<\/h2>\n<p>排序方法先分两档：文件小于内存，在内存中完成内部排序；文件大于内存，必须分遍读写外部介质。内部排序比较的是键比较与移动的内存代价；外部排序记账主项是记录读写遍数，初始游程生成方式、合并路数、缓冲长度是主要优化对象。把内部排序的 <span class=\"katex-inline\">N\\lg N<\/span> 直接套到外部文件上会漏掉磁盘遍数；外部方案先定游程数 <span class=\"katex-inline\">S<\/span> 与路数 <span class=\"katex-inline\">P<\/span>，算遍数 <span class=\"katex-inline\">\\lceil\\log_P S\\rceil<\/span>，再谈内存比较。查找侧也是如此：B 树为外部分页设计，优化目标是页读取次数，不是内存比较次数。<\/p>\n<h2>模式 7：查找结构按查询类型分工，先定查询再选结构<\/h2>\n<p>同一份数据，查询类型不同，合适的结构不同：等值查询可用顺序、散列、二分；有序范围查询需要二分表、B 树或平衡树；前缀与部分匹配需要数字查找树；复合属性查询需要倒排表。散列把键打散，查不出区间；数字树沿位分支，不保留整键全序；二叉查找树支持中序遍历，但不加平衡会退化成链。选型先问「查等值、查区间、查前缀还是查组合条件」，再核对结构是否保留所需次序；用散列做范围筛选、用数字树做全序遍历，都是结构与查询错配。<\/p>\n<h2>模式 8：散列平均公式以「均匀分布」为前提，偏斜先修函数<\/h2>\n<p>散列的平均探查长度建立在散列函数均匀、冲突近似随机的假设上。函数偏斜时，同类键落进同一槽或同一段，局部链长、探查段长偏离期望，调装填因子补不回来。检查散列先看函数是否用上键的全部位、模值是否选质数；再看装填因子 <span class=\"katex-inline\">\\alpha<\/span> 是否压住；最后才数链长与段长。开放定址还要区分一级聚集（相邻占用槽连成段）与二级聚集（不同键落入同一段）。散列只服务等值，不支持范围与有序遍历；它与加密哈希目标不同，一个求地址均匀，一个求不可逆与抗碰撞，指标不能互套。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 排序的组合性质与内部排序<\/strong>：反序与稳定性、插入、交换、选择、合并（原书 §5.1–5.2，PDF 第 15、67、111、113、129 页）。\n<\/li><li>\n<strong>第 2 章 最优排序与外部排序<\/strong>：比较次数下界、决策树、多路合并与替代选择（原书 §5.3–5.4，PDF 第 146、203 页）。\n<\/li><li>\n<strong>第 3 章 顺序查找与按键比较的查找<\/strong>：静态最优排列、二分查找、二叉查找树、B 树（原书 §6.1–6.2，PDF 第 317、324、383 页）。\n<\/li><li>\n<strong>第 4 章 数字查找、散列与辅助键检索<\/strong>：数字查找树、Patricia、拉链与线性探查、倒排思路（原书 §6.3–6.5，PDF 第 397、413、414、418、443 页）。\n<\/ul>\n<h2>内部排序方法对照（键比较口径）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>方法<\/th><th>划分依据<\/th><th>最坏比较次数<\/th><th>平均比较次数<\/th><th>稳定性<\/th><th>前提<\/th><\/tr><\/thead><tbody><tr><td>直接插入排序<\/td><td>已排序前缀，向后插入<\/td><td><span class=\"katex-inline\">\\frac{N(N-1)}{2}<\/span><\/td><td><span class=\"katex-inline\">\\frac{N^2}{4}<\/span> 量级<\/td><td>稳定<\/td><td>顺序存储；前缀有序<\/td><\/tr><tr><td>冒泡排序<\/td><td>相邻交换，每轮定一个极值<\/td><td><span class=\"katex-inline\">O(N^2)<\/span><\/td><td><span class=\"katex-inline\">O(N^2)<\/span><\/td><td>稳定<\/td><td>顺序存储<\/td><\/tr><tr><td>快速排序<\/td><td>基准划分，两侧递归<\/td><td><span class=\"katex-inline\">O(N^2)<\/span>（偏斜划分）<\/td><td><span class=\"katex-inline\">2N\\ln N<\/span> 量级<\/td><td>不稳定<\/td><td>基准等概率落位；键可比较<\/td><\/tr><tr><td>直接选择排序<\/td><td>每轮选最小归位<\/td><td><span class=\"katex-inline\">\\frac{N(N-1)}{2}<\/span><\/td><td>同量级<\/td><td>不稳定<\/td><td>顺序存储<\/td><\/tr><tr><td>锦标赛树选择<\/td><td>二叉比较树保留首轮结果<\/td><td><span class=\"katex-inline\">N\\lg N<\/span> 量级<\/td><td>同量级<\/td><td>取决于等值规则<\/td><td>额外树结构<\/td><\/tr><tr><td>两路合并排序<\/td><td>两段有序后归并<\/td><td><span class=\"katex-inline\">N\\lg N<\/span> 量级<\/td><td><span class=\"katex-inline\">N\\lg N<\/span> 量级<\/td><td>稳定（等值取左段）<\/td><td>两段各自有序；需辅助空间<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>排序代价公式要点<\/h2>\n<ul><li>\n反序总数：排列中 <span class=\"katex-inline\">i&lt;j<\/span> 而 <span class=\"katex-inline\">K_i&gt;K_j<\/span> 的对数；交换相邻记录每消除一个反序。\n<\/li><li>\n插入排序第 <span class=\"katex-inline\">j<\/span> 个元素：最坏比较 <span class=\"katex-inline\">j-1<\/span> 次，期望比较约 <span class=\"katex-inline\">j/2<\/span> 次；求和后主项 <span class=\"katex-inline\">N^2/2<\/span>（最坏）、<span class=\"katex-inline\">N^2/4<\/span>（平均）。\n<\/li><li>\n快速排序递推：<span class=\"katex-inline\">C_N=N+1+\\frac{2}{N}\\sum_{k=0}^{N-1}C_k<\/span>，解得期望主项 <span class=\"katex-inline\">2N\\ln N<\/span>。\n<\/li><li>\n比较排序下界：决策树至少容纳 <span class=\"katex-inline\">N!<\/span> 个叶子，树高 <span class=\"katex-inline\">\\ge\\lceil\\lg N!\\rceil<\/span>；Stirling 放缩 <span class=\"katex-inline\">\\lg N!\\approx N\\lg N-1.44N<\/span>。\n<\/li><li>\n自然两路合并从现成游程起步；游程长度越长，首轮后段长越大，所需合并轮数越少。\n<\/ul>\n<h2>外部排序要点<\/h2>\n<ul><li>\n初始游程数 <span class=\"katex-inline\">S<\/span>，合并路数 <span class=\"katex-inline\">P<\/span>：合并遍数 <span class=\"katex-inline\">k=\\lceil\\log_P S\\rceil<\/span>。\n<\/li><li>\n替代选择用选择树持续输出当前最小键并补入新记录，生成的游程可长于内存容量；候选树高约 <span class=\"katex-inline\">\\lg P<\/span>。\n<\/li><li>\n外部排序记账主项是记录读写遍数，不是内存键比较；磁带顺序读写与磁盘块访问各有代价结构。\n<\/ul>\n<h2>查找方法代价对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>方法<\/th><th>索引前提<\/th><th>成功平均代价<\/th><th>失败代价<\/th><th>支持查询类型<\/th><\/tr><\/thead><tbody><tr><td>顺序查找（均匀）<\/td><td>无<\/td><td><span class=\"katex-inline\">(N+1)/2<\/span><\/td><td><span class=\"katex-inline\">N<\/span> 次比较<\/td><td>等值<\/td><\/tr><tr><td>顺序查找（加权）<\/td><td>频率已知<\/td><td><span class=\"katex-inline\">\\bar C_N=\\sum_{j=1}^N j\\,p_j<\/span><\/td><td>走完全表<\/td><td>等值；按频率降序排列最优<\/td><\/tr><tr><td>二分查找<\/td><td>表已排序<\/td><td><span class=\"katex-inline\">\\lceil\\lg(N+1)\\rceil<\/span> 量级<\/td><td>同量级<\/td><td>等值；有序表<\/td><\/tr><tr><td>二叉查找树<\/td><td>键可比较<\/td><td>平均 <span class=\"katex-inline\">\\lg N<\/span>；退化链上 <span class=\"katex-inline\">N<\/span><\/td><td>同左<\/td><td>等值；中序有序遍历<\/td><\/tr><tr><td>B 树<\/td><td>外部介质分页<\/td><td>高度 <span class=\"katex-inline\">O(\\log_m N)<\/span><\/td><td>同左<\/td><td>等值；范围<\/td><\/tr><tr><td>数字查找树 / Patricia<\/td><td>键可拆位串<\/td><td>按分歧层数<\/td><td>同左<\/td><td>前缀；部分匹配<\/td><\/tr><tr><td>拉链散列<\/td><td>散列均匀<\/td><td><span class=\"katex-inline\">1+\\alpha/2<\/span>（成功）<\/td><td><span class=\"katex-inline\">\\alpha<\/span>（失败）<\/td><td>等值<\/td><\/tr><tr><td>线性探查<\/td><td>散列均匀；低装填<\/td><td><span class=\"katex-inline\">\\tfrac12(1+\\frac{1}{1-\\alpha})<\/span>（成功）<\/td><td><span class=\"katex-inline\">\\tfrac12(1+\\frac{1}{(1-\\alpha)^2})<\/span>（失败）<\/td><td>等值<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>散列公式与装填因子<\/h2>\n<ul><li>\n装填因子 <span class=\"katex-inline\">\\alpha=N/M<\/span>：记录数除以槽位数。\n<\/li><li>\n拉链法：成功探查 <span class=\"katex-inline\">1+\\alpha/2<\/span>，失败探查约 <span class=\"katex-inline\">\\alpha<\/span>；链长随 <span class=\"katex-inline\">\\alpha<\/span> 线性增长。\n<\/li><li>\n线性探查：成功 <span class=\"katex-inline\">\\tfrac12(1+\\frac{1}{1-\\alpha})<\/span>，失败 <span class=\"katex-inline\">\\tfrac12(1+\\frac{1}{(1-\\alpha)^2})<\/span>；<span class=\"katex-inline\">\\alpha\\to1<\/span> 时失败探查急剧恶化。\n<\/li><li>\n散列函数把键全部位位用上；<span class=\"katex-inline\">M<\/span> 取质数可降低规律性键的聚集。\n<\/li><li>\n探查法删除不能简单置空，否则截断后续探查链；需墓碑标记或整段重散列。\n<\/ul>\n<h2>辅助键查询分类<\/h2>\n<ul><li>\n<strong>简单查询<\/strong>：属性定值，如「专业 = 数学」。\n<\/li><li>\n<strong>范围查询<\/strong>：属性取值区间，如「<span class=\"katex-inline\">21&lt;年龄\\le23<\/span>」。\n<\/li><li>\n<strong>布尔查询<\/strong>：AND、OR、NOT 组合；AND 交、OR 并、NOT 差；NOT 通常从全集减去子条件列表，代价高于前两者。\n<\/li><li>\n无索引时全表扫描；批量聚集让多个查询共享一遍扫描；倒排表把属性值映射到记录列表，再做集合运算。\n<\/ul>\n<h2>锚点页码表（PDF 实际页号）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>原书小节<\/th><th>主题<\/th><th>PDF 页<\/th><\/tr><\/thead><tbody><tr><td>第 5 章章首<\/td><td>排序章首<\/td><td>7<\/td><\/tr><tr><td>§5.1.1<\/td><td>反序与逆序对<\/td><td>15<\/td><\/tr><tr><td>§5.2.1<\/td><td>直接插入排序<\/td><td>67<\/td><\/tr><tr><td>§5.2.2<\/td><td>交换排序（冒泡、快速排序）<\/td><td>111<\/td><\/tr><tr><td>§5.2.3<\/td><td>选择排序<\/td><td>113<\/td><\/tr><tr><td>§5.2.4<\/td><td>合并排序<\/td><td>129<\/td><\/tr><tr><td>§5.3.1<\/td><td>比较次数最少的排序<\/td><td>146<\/td><\/tr><tr><td>§5.4.1<\/td><td>多路合并与替代选择<\/td><td>203<\/td><\/tr><tr><td>第 6 章章首<\/td><td>查找章首<\/td><td>312<\/td><\/tr><tr><td>§6.1<\/td><td>顺序查找<\/td><td>317<\/td><\/tr><tr><td>§6.2.1<\/td><td>二分查找有序表<\/td><td>324<\/td><\/tr><tr><td>§6.2.4<\/td><td>多路树与 B 树<\/td><td>383<\/td><\/tr><tr><td>§6.3<\/td><td>数字查找与 Patricia<\/td><td>397<\/td><\/tr><tr><td>§6.4<\/td><td>散列；拉链；线性探查<\/td><td>413 / 414 / 418<\/td><\/tr><tr><td>§6.5<\/td><td>辅助键的查找<\/td><td>443<\/td><\/tr><\/tbody><\/table><\/div>\n<p>印刷页码与 PDF 页号存在固定偏移（约 PDF 页 = 印刷页 + 6），个别扫描错页除外；具体锚点见交付 REPORT.md。<\/p>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/图灵计算机科学丛书-计算机程序设计艺术-卷3-排序与查找-第2版-高德纳-Don-7", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 5.1–5.2 章：排序的组合性质与内部排序", "href": "#/chapter/ch01"}, {"label": "第 5.3–5.4 章：最优排序与外部排序", "href": "#/chapter/ch02"}, {"label": "第 6.1–6.2 章：顺序查找与按键比较进行的查找", "href": "#/chapter/ch03"}, {"label": "第 6.3–6.5 章：数字查找、散列与辅助键的查找", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "排序问题、稳定性与反序：键、记录与逆序对代价度量", "href": "#/concept/c01"}, {"label": "直接插入排序：逐步插入已排序前缀，比较与移动次数推导", "href": "#/concept/c02"}, {"label": "交换排序：冒泡与快速排序，划分递推与期望比较次数", "href": "#/concept/c03"}, {"label": "选择排序与锦标赛树：逐次选最小，树选择把重复比较压到 $N\\lg N$", "href": "#/concept/c04"}, {"label": "合并排序与游程：两路合并、自然两路合并与 $N\\lg N$ 归并结构", "href": "#/concept/c05"}, {"label": "比较排序的信息论下界：决策树、$\\lceil\\lg N!\\rceil$ 与 Stirling 放缩", "href": "#/concept/c06"}, {"label": "外部排序：初始游程、替代选择与 $P$ 路合并的扫描遍数", "href": "#/concept/c07"}, {"label": "顺序查找与静态最优排列：加权平均比较次数与频率降序最优", "href": "#/concept/c08"}, {"label": "二分查找与查找树：折半递推、二叉查找树退化与 B 树多路平衡", "href": "#/concept/c09"}, {"label": "散列查找：散列函数、拉链法与线性探查，装填因子与探查长度", "href": "#/concept/c10"}, {"label": "数字查找与 Patricia 树：按位分支、前缀压缩与 SKIP 字段", "href": "#/concept/c11"}, {"label": "辅助键的查找：属性检索、简单/范围/布尔查询与倒排思路", "href": "#/concept/c12"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 5.1–5.2 章：排序的组合性质与内部排序", "href": "#/quiz/ch01"}, {"label": "测验：第 5.3–5.4 章：最优排序与外部排序", "href": "#/quiz/ch02"}, {"label": "测验：第 6.1–6.2 章：顺序查找与按键比较进行的查找", "href": "#/quiz/ch03"}, {"label": "测验：第 6.3–6.5 章：数字查找、散列与辅助键的查找", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/计算机程序与设计艺术/图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版 (高德纳（Donald E.Knuth）著；贾洪峰译, (美) 克努特, (Knuth etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.15<\/div><h1>第 5.1–5.2 章：排序的组合性质与内部排序<\/h1>\n<blockquote>对应原书第 5 章 §5.1「排序的组合性质」、§5.2「内部排序」（PDF 第 15–135 页；正文印刷页 = PDF 页 − 6，个别扫描错页除外）。本章讨论记录全部放在随机存储器中、一次装得下的排序：先把排序问题拆成键、记录、稳定性与反序等度量，再逐条推演插入、交换、选择、合并四类内部排序方法的结构与代价。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清键、记录、稳定排序与反序（逆序对）的含义，判断一种排序方法是否稳定；\n<\/li><li>\n写出直接插入排序在最坏情形与随机排列下的比较次数，说明移动记录与比较键的代价差别；\n<\/li><li>\n沿划分递推推出快速排序的期望比较次数 <span class=\"katex-inline\">2N\\ln N<\/span>，指出最坏情形在哪里；\n<\/li><li>\n区分选择排序与锦标赛树选择的结构差别，说清合并排序怎样把两个有序子文件归并成一个有序文件；\n<\/li><li>\n把本章各类方法归到「比较与移动」两类操作上，说出哪一类代价随 <span class=\"katex-inline\">N^2<\/span>、哪一类随 <span class=\"katex-inline\">N\\lg N<\/span> 增长。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>排序就是按键的升序或降序重排记录；反序对数衡量输入的混乱程度，插入类方法把新记录插进已排好的前缀，交换类方法靠划分把大键小键分开，选择类方法逐次挑出最小记录，合并类方法先各自有序再两路归并；方法之间的差别落在比较多少次、移动多少记录、需要多少额外空间这三件事上。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：排序问题、稳定性与反序（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。原书第 5 章开头把排序定义为按升序或降序重新排列项目，并列举排序的两类典型用途：把标识相同的记录集中到连续位置，以及让两个文件按相同顺序排列后一次顺序扫描就能匹配（PDF 第 7 页）。每条记录携带一个用来比较的键 <span class=\"katex-inline\">K<\/span>，附属信息随记录一起移动。当两个键相等时，排序前后它们的相对次序是否保持，就是稳定性问题。§5.1.1 用反序表描述一个排列：<span class=\"katex-inline\">b_j<\/span> 表示在 <span class=\"katex-inline\">j<\/span> 左边大于 <span class=\"katex-inline\">K_j<\/span> 的元素个数；<span class=\"katex-inline\">1,2,\\dots,n<\/span> 的排列总数为 <span class=\"katex-inline\">n!<\/span>，因为 <span class=\"katex-inline\">b_1<\/span> 有 <span class=\"katex-inline\">n<\/span> 种选择、<span class=\"katex-inline\">b_2<\/span> 有 <span class=\"katex-inline\">n-1<\/span> 种选择，依此类推（PDF 第 15 页）。交换相邻两个元素，反序数改变 1；反序数越少，输入越接近有序。<\/p>\n<h3>2. 概念 2：直接插入排序（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。§5.2.1 给出的直接插入排序假定 <span class=\"katex-inline\">R_1,\\dots,R_{j-1}<\/span> 已经有序，再把新键 <span class=\"katex-inline\">K_j<\/span> 依次与 <span class=\"katex-inline\">K_{j-1},K_{j-2},\\dots<\/span> 比较，找到插入位置后把后面的记录上移一格（PDF 第 67 页）。书中该算法从 <span class=\"katex-inline\">j=2,3,\\dots,N<\/span> 循环：先置 <span class=\"katex-inline\">i\\leftarrow j-1<\/span>、<span class=\"katex-inline\">K\\leftarrow K_j<\/span>、<span class=\"katex-inline\">R\\leftarrow R_j<\/span>，再把 <span class=\"katex-inline\">K<\/span> 与 <span class=\"katex-inline\">K_i<\/span> 比较，<span class=\"katex-inline\">K\\ge K_i<\/span> 时停止前移，否则 <span class=\"katex-inline\">i<\/span> 减 1 继续比较（PDF 第 67 页）。插入排序的比较次数依赖输入初始有序程度：接近有序时很快，完全逆序时每一步都要走到最左端。<\/p>\n<h3>3. 概念 3：交换排序：冒泡与快速排序（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。§5.2.2 讨论通过交换逆序相邻元素完成排序的一类方法。冒泡排序反复扫描相邻记录、把较大键逐步交换到后面；快速排序则选一个划分基准，把小于基准的记录换到左侧、大于基准的换到右侧，再对两侧递归（PDF 第 111 页，习题中以算法 Q 称呼该快速排序过程）。同一节还出现基数交换排序（按二进制位划分）与巴彻尔归并类方法。快速排序的效率来自划分把问题拆成两个规模更小的子文件；它的最坏情形发生在基准每次都把文件切得极不均衡时。<\/p>\n<h3>4. 概念 4：选择排序与锦标赛树（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。§5.2.3 的直接选择排序每一轮在剩余记录里找出最小键，放到已排序段的末尾（PDF 第 113 页）。朴素选择每轮都要扫描全部剩余记录，比较次数与排序方式无关地接近 <span class=\"katex-inline\">N^2/2<\/span>。树选择（锦标赛选择）把记录放进一棵淘汰树：两两比较、胜者上浮，选出当前最小后从叶子位置重新补位，后续每一轮只需沿树向上重做一条路径的比较，总时间大致与 <span class=\"katex-inline\">N\\lg N<\/span> 成正比（PDF 第 116 页前后）。<\/p>\n<h3>5. 概念 5：合并排序与游程（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。§5.2.4 讨论把两个有序文件合并成一个有序文件的方法。两路合并每次查看两个游程的第一条记录，选键较小的输出，再从该游程删去它（PDF 第 129 页）。书中给出自然两路合并排序：先按输入中已有的递增段（游程）分组，再逐轮两两合并；冯·诺伊曼早在 1945 年就提出过合并排序（PDF 第 130 页前后）。合并排序的比较次数随 <span class=\"katex-inline\">N\\lg N<\/span> 增长，代价是通常需要与原文件等量的额外存储空间放合并结果。<\/p>\n<h2>推导一（推演）：直接插入排序的比较次数<\/h2>\n<p>设文件有 <span class=\"katex-inline\">N<\/span> 条记录，键为 <span class=\"katex-inline\">K_1,\\dots,K_N<\/span>。插入第 <span class=\"katex-inline\">j<\/span> 条记录时，已排序前缀长度为 <span class=\"katex-inline\">j-1<\/span>。<\/p>\n<p><strong>最坏情形<\/strong>：输入完全逆序，新键 <span class=\"katex-inline\">K_j<\/span> 是当前最小键，必须与 <span class=\"katex-inline\">K_{j-1},K_{j-2},\\dots,K_1<\/span> 全部比较完才落到最左端，第 <span class=\"katex-inline\">j<\/span> 步比较 <span class=\"katex-inline\">j-1<\/span> 次。总比较次数为<\/p>\n<div class=\"katex-block\">C_{\\max}=\\sum_{j=2}^{N}(j-1)=\\sum_{k=1}^{N-1}k=\\frac{N(N-1)}{2}.<\/div>\n<p>当 <span class=\"katex-inline\">N=10<\/span> 时，<span class=\"katex-inline\">C_{\\max}=10\\cdot9/2=45<\/span> 次比较。<\/p>\n<p><strong>平均情形<\/strong>：在随机排列下，<span class=\"katex-inline\">K_j<\/span> 落在 <span class=\"katex-inline\">j<\/span> 个可能位置（最左到最右）的概率视为均等。落到从右数第 <span class=\"katex-inline\">r<\/span> 个位置时需要 <span class=\"katex-inline\">r<\/span> 次比较，<span class=\"katex-inline\">r=1,2,\\dots,j<\/span>，期望比较次数为<\/p>\n<div class=\"katex-block\">E_j=\\frac{1+2+\\cdots+j}{j}=\\frac{j+1}{2}.<\/div>\n<p>全书期望比较次数<\/p>\n<div class=\"katex-block\">E_C=\\sum_{j=2}^{N}\\frac{j+1}{2}=\\frac{1}{2}\\left(\\sum_{j=2}^{N}j+N-1\\right)=\\frac{N^2+N-2}{4}\\approx\\frac{N^2}{4}.<\/div>\n<p>除比较键外，插入还要把 <span class=\"katex-inline\">K_{j+1},\\dots,K_{j-1}<\/span> 各上移一格；移动记录的次数与比较次数同量级。这个推导说明：插入排序的二阶项系数在最坏情形是 <span class=\"katex-inline\">1/2<\/span>、平均情形是 <span class=\"katex-inline\">1/4<\/span>，两者都随 <span class=\"katex-inline\">N^2<\/span> 增长，所以它只适合 <span class=\"katex-inline\">N<\/span> 较小或输入接近有序的场合。<\/p>\n<h2>推导二（推演）：快速排序期望比较次数的递推与求解<\/h2>\n<p>记 <span class=\"katex-inline\">C_N<\/span> 为对 <span class=\"katex-inline\">N<\/span> 个互不相同键做一次快速排序的期望比较次数。划分阶段要把基准键与其余 <span class=\"katex-inline\">N-1<\/span> 个键逐一比较，再加上基准本身参与的比较，划分一步共耗 <span class=\"katex-inline\">N+1<\/span> 量级的比较。设基准把文件分成长度为 <span class=\"katex-inline\">k<\/span> 与 <span class=\"katex-inline\">N-1-k<\/span> 的两个子文件，<span class=\"katex-inline\">k<\/span> 在 <span class=\"katex-inline\">0,1,\\dots,N-1<\/span> 之间等概率取值（基准等概率落在任一位置），两侧递归排序的期望代价为 <span class=\"katex-inline\">C_k<\/span> 与 <span class=\"katex-inline\">C_{N-1-k}<\/span>，于是递推式为<\/p>\n<div class=\"katex-block\">C_N=N+1+\\frac{1}{N}\\sum_{k=0}^{N-1}(C_k+C_{N-1-k})=N+1+\\frac{2}{N}\\sum_{k=0}^{N-1}C_k.<\/div>\n<p>两端乘 <span class=\"katex-inline\">N<\/span>：<\/p>\n<div class=\"katex-block\">N C_N=N(N+1)+2\\sum_{k=0}^{N-1}C_k.<\/div>\n<p>对 <span class=\"katex-inline\">N-1<\/span> 写出同类等式：<span class=\"katex-inline\">(N-1)C_{N-1}=N(N-1)+2\\sum_{k=0}^{N-2}C_k<\/span>，两式相减，消去求和项：<\/p>\n<div class=\"katex-block\">N C_N-(N-1)C_{N-1}=2N+2C_{N-1},<\/div>\n<p>整理得<\/p>\n<div class=\"katex-block\">C_N=\\frac{N+1}{N}C_{N-1}+2.<\/div>\n<p>令 <span class=\"katex-inline\">D_N=C_N/(N+1)<\/span>，代入得 <span class=\"katex-inline\">D_N=D_{N-1}+2/(N+1)<\/span>，累加并利用调和数 <span class=\"katex-inline\">H_N=\\sum_{k=1}^{N}1/k<\/span>，可得<\/p>\n<div class=\"katex-block\">C_N\\approx 2(N+1)H_N-4N\\approx 2N\\ln N.<\/div>\n<p>量级上是 <span class=\"katex-inline\">N\\ln N<\/span>，系数约为 <span class=\"katex-inline\">2<\/span>。这个结论成立依赖「基准等概率切分」的假设；若每次基准都取到当前最大或最小，子文件长度只减 1，递推退化为 <span class=\"katex-inline\">C_N\\approx C_{N-1}+N<\/span>，总代价回到 <span class=\"katex-inline\">N^2/2<\/span>。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉「键互不相同」的假定<\/strong>：本节 5.3.1 的比较下界分析限定各键互不相同，比较只有 <span class=\"katex-inline\">K_i&lt;K_j<\/span> 与 <span class=\"katex-inline\">K_i&gt;K_j<\/span> 两种结果。若允许大量等值键，三分支比较（小于、等于、大于）需要单独处理；把等值键全当成不等值来交换，稳定排序会被破坏，快速排序在等值密集时还会退化到不均衡划分。\n<\/li><li>\n<strong>去掉「前缀已经有序」这个插入前提<\/strong>：插入排序每一步依赖 <span class=\"katex-inline\">R_1,\\dots,R_{j-1}<\/span> 有序这个不变量。若某一步提前打乱前缀，后续插入找不到位置参照，比较与上移都会落到错误的区间；不变量是算法能正确插入的根据。\n<\/li><li>\n<strong>划分时不交换、只扫描计数<\/strong>：快速排序若只统计左右两侧各有多少记录，不把小键换入左侧，下一轮递归拿到的仍是混杂文件；划分的交换动作把「类别」转成「位置」，缺了这一步子文件不成立。\n<\/li><li>\n<strong>选择排序每轮不保留已排序段<\/strong>：若已选出的最小记录不固定到序列末尾，下一轮还会把它重新扫进候选，选择过程无法收敛到 <span class=\"katex-inline\">N<\/span> 轮结束。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章是全书排序部分的内部底座：反序与比较次数的度量方式，直接被 §5.3 的最优排序下界分析沿用；合并排序建立的游程概念，在 §5.4 外部排序中扩展成多路合并。下一章先回答「内部排序最快能快到什么程度」，用决策树给出比较次数的下界，再转入内存装不下时的外部排序。查找部分（第 6 章）会反复依赖本章前提：二分查找要求表已排好序，有序性正是本章各类排序方法的产物。<\/p>", "ch02": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/计算机程序与设计艺术/图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版 (高德纳（Donald E.Knuth）著；贾洪峰译, (美) 克努特, (Knuth etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.146<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 5.1–5.2 章：排序的组合性质与内部排序<\/a><\/span><\/div><h1>第 5.3–5.4 章：最优排序与外部排序<\/h1>\n<blockquote>对应原书第 5 章 §5.3「最优排序」、§5.4「外部排序」（PDF 第 146–305 页；正文印刷页 = PDF 页 − 6）。前一章处理内存装得下的内部排序，本章先回答比较类方法的代价下限在哪里，再讨论文件大到一次装不下时，怎样在磁带、磁盘这类外部存储上分遍排序与合并。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用决策树叶子数推出比较排序的信息论下界 <span class=\"katex-inline\">\\lceil\\lg N!\\rceil<\/span>，并用 Stirling 公式把它放缩成 <span class=\"katex-inline\">N\\lg N<\/span> 量级；\n<\/li><li>\n说明比较次数下界与实际算法之间的差距来自哪里，区分「按键比较」与「基于基数/数字特性」两类排序；\n<\/li><li>\n解释外部排序为什么分「生成初始游程」和「多路合并」两个阶段，替代选择怎样长出比内存更长的游程；\n<\/li><li>\n按合并路数 <span class=\"katex-inline\">P<\/span> 与初始游程数 <span class=\"katex-inline\">S<\/span> 推出扫描遍数 <span class=\"katex-inline\">\\lceil\\log_P S\\rceil<\/span>，说明路数增多对内存与比较树的要求；\n<\/li><li>\n说出外部排序与内部排序在代价口径上的差别：外部以扫描遍数和读写记录数为主，内部以键比较次数为主。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>任何只靠两两键比较的排序方法，都绕不开 <span class=\"katex-inline\">\\lceil\\lg N!\\rceil<\/span> 次比较的下界；当文件超过内存容量，排序只能先在内存里切出一段段有序游程，再用多路合并逐轮把游程并长，扫描遍数由合并路数和初始游程数的对数决定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 6：比较排序的信息论下界（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。§5.3.1 从一个天平砝码类比切入：<span class=\"katex-inline\">n<\/span> 个互不相同的砝码，天平每次只能比较两个秤盘的轻重，问最少多少次称量才能排出顺序；等价地，<span class=\"katex-inline\">n<\/span> 名选手参加锦标赛，没有平局，最少多少场比赛才能排出名次（PDF 第 146 页）。把每次键比较画成二叉树的内部结点，<span class=\"katex-inline\">K_i&lt;K_j<\/span> 走左支、<span class=\"katex-inline\">K_i&gt;K_j<\/span> 走右支，每种可能的最终排列对应一片叶子。<span class=\"katex-inline\">N<\/span> 个互不相同键共有 <span class=\"katex-inline\">N!<\/span> 种排列，决策树至少要有 <span class=\"katex-inline\">N!<\/span> 片叶子，树高就是最坏比较次数的下界。书中还限定本节讨论依赖线性次序关系的比较技术，基于基数的数字排序不在这个下界口径内（PDF 第 146 页）。<\/p>\n<h3>2. 概念 7：外部排序、初始游程与多路合并（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。§5.4.1 把内部两路合并扩展为 <span class=\"katex-inline\">P<\/span> 个输入游程合并成一个输出游程：任意时刻查看每个游程的第一条记录，选键最小的输出，再从该游程删去它；若有多个相同最小键，任选其一（PDF 第 203 页）。<span class=\"katex-inline\">P<\/span> 不大时，找当前最小键只需 <span class=\"katex-inline\">P-1<\/span> 次比较；<span class=\"katex-inline\">P<\/span> 到 8 或更大时，可以用 §5.2.3 讲过的选择树，每次只需大约 <span class=\"katex-inline\">\\lg P<\/span> 次比较。书中示例在每个游程末尾附加一个 <span class=\"katex-inline\">\\infty<\/span> 键作为结束标识，使合并过程能优雅收尾（PDF 第 203 页）。替代选择在内存中持续输出当前最小键并补入新记录，是生成长游程的关键技术；多阶段合并、级联合并、外部基数排序等后续小节，都建立在游程与多路合并这两个概念之上。<\/p>\n<h2>推导一（证明）：决策树叶子数与比较次数下界<\/h2>\n<p>设 <span class=\"katex-inline\">N<\/span> 个键互不相同，所有可能输入排列共 <span class=\"katex-inline\">N!<\/span> 种。把一次排序算法展开成决策树：<\/p>\n<ol><li>\n根结点是第一次比较；每次比较只有两种结果（小于或大于），所以每个内部结点有两个子结点；\n<\/li><li>\n每条从根到叶子的路径，对应一次具体输入下算法走过的比较序列；\n<\/li><li>\n不同排列不能落到同一片叶子上——若两片不同排列共用一片叶子，算法在该叶结点给出的最终次序只能对应其中一种，另一种就被排错。\n<\/ol>\n<p>因此叶子数 <span class=\"katex-inline\">L\\ge N!<\/span>。一棵高度为 <span class=\"katex-inline\">h<\/span> 的二叉树，叶子数至多为 <span class=\"katex-inline\">2^h<\/span>（每层最多把已有结点翻倍）。代入得<\/p>\n<div class=\"katex-block\">2^h\\ge L\\ge N!,\\quad h\\ge \\lceil\\lg N!\\rceil.<\/div>\n<p>任何比较排序在最坏情形下的比较次数都不能低于这个数。这一证明只依赖二叉树叶子数与排列个数两个事实，不引入具体排序实现。用 Stirling 公式 <span class=\"katex-inline\">N!\\approx (N/e)^N\\sqrt{2\\pi N}<\/span> 取对数：<\/p>\n<div class=\"katex-block\">\\lg N!\\approx N\\lg N-N\\lg e+\\tfrac12\\lg(2\\pi N)\\approx N\\lg N-1.44N.<\/div>\n<p>量级上比较下界是 <span class=\"katex-inline\">N\\lg N<\/span>，线性项系数约为 <span class=\"katex-inline\">1.44<\/span>。合并排序这类达到 <span class=\"katex-inline\">N\\lg N<\/span> 的方法与下界同量级；差距集中在线性项和低阶部分，而不是主项。<\/p>\n<h2>推导二（推演）：外部排序的扫描遍数<\/h2>\n<p>外部排序分两阶段。第一阶段在内存受限条件下生成 <span class=\"katex-inline\">S<\/span> 个初始游程；第二阶段做 <span class=\"katex-inline\">P<\/span> 路合并。本推演的边界条件是各游程成段有序、每段可单独取出首条记录比较。合并一轮后，<span class=\"katex-inline\">S<\/span> 个游程被并成 <span class=\"katex-inline\">\\lceil S/P\\rceil<\/span> 个更长游程；再一轮变成 <span class=\"katex-inline\">\\lceil \\lceil S/P\\rceil/P\\rceil<\/span>，即 <span class=\"katex-inline\">S/P^2<\/span> 量级。每一轮把游程数除以 <span class=\"katex-inline\">P<\/span>，直到只剩 1 个游程。所需合并遍数满足<\/p>\n<div class=\"katex-block\">P^k\\ge S,\\quad k\\ge \\lceil\\log_P S\\rceil.<\/div>\n<p>举例：<span class=\"katex-inline\">S=1000<\/span> 个初始游程，<span class=\"katex-inline\">P=2<\/span> 路合并时 <span class=\"katex-inline\">k=\\lceil\\log_2 1000\\rceil=10<\/span> 遍；<span class=\"katex-inline\">P=10<\/span> 路时 <span class=\"katex-inline\">k=\\lceil\\log_{10}1000\\rceil=3<\/span> 遍；<span class=\"katex-inline\">P=32<\/span> 路时 <span class=\"katex-inline\">k=\\lceil\\log_{32}1000\\rceil=2<\/span> 遍。路数增多减少了遍数，但每一轮要同时打开 <span class=\"katex-inline\">P<\/span> 个输入文件、在内存里维护 <span class=\"katex-inline\">P<\/span> 条待选记录和比较树；选择树每次选出最小键后，沿树向上更新一条路径，比较代价约 <span class=\"katex-inline\">\\lg P<\/span>。替代选择的作用在第一阶段：普通内存排序一次只能产出长度不超过内存容量的游程，替代选择在输出最小键后把新读入记录补回树中继续参与竞争，游程可以长于内存容量，从而压低 <span class=\"katex-inline\">S<\/span>，后面合并阶段的遍数随之下降。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉「只做两两比较」的限制<\/strong>：下界 <span class=\"katex-inline\">\\lceil\\lg N!\\rceil<\/span> 只约束比较类排序。若允许按键的数字特性做基数划分（按位、按字符分桶），一次操作可以区分多个类别，比较口径失效；这类方法的代价落在分配与收集记录的遍数上，不能用决策树叶子数衡量。把下界套到基数排序上会得出错误结论。\n<\/li><li>\n<strong>去掉内存受限这个外部排序前提<\/strong>：若文件一次全部装入内存，就不需要分游程、不需要反复读写外部存储，内部排序方法直接可用；外部排序的整套两阶段结构，正是为「装不下」这个条件设计的。\n<\/li><li>\n<strong>合并游程末尾不放 <span class=\"katex-inline\">\\infty<\/span> 哨兵<\/strong>：书中示例给每个游程末尾附加 <span class=\"katex-inline\">\\infty<\/span> 键，避免某一游程读完后选择树还要判断「该游程已空」。去掉哨兵，每步选最小都要先检查哪些游程耗尽，分支增多且容易在游程边界出错；哨兵是把边界条件并入常规比较的处理手法。\n<\/li><li>\n<strong>固定合并路数 <span class=\"katex-inline\">P=2<\/span> 不随规模调整<\/strong>：两路合并实现最简单，但游程数减半一轮，<span class=\"katex-inline\">S<\/span> 很大时遍数随 <span class=\"katex-inline\">\\log_2 S<\/span> 增长；数据规模上升后读写遍数成为主要开销，多路合并用内存里的比较树换取遍数下降。\n<\/li><li>\n<strong>初始游程长度不做优化<\/strong>：若每个游程都被压到内存最小单位，<span class=\"katex-inline\">S<\/span> 随文件长度线性膨胀，合并遍数随之抬高；替代选择拉长游程、减少 <span class=\"katex-inline\">S<\/span>，是在第一阶段就为第二阶段减负。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章 §5.3 的下界回答了第 5.1–5.2 章各类内部排序「还能快多少」的理论尽头；§5.4 的多路合并直接复用了 §5.2.4 两路合并与 §5.2.3 锦标赛树的结构。进入第 6 章后，排序的产物——有序表——成为查找方法的前提：二分查找、二叉查找树都要求键已有序，而散列与数字查找则不依赖全局有序。外部存储上的多路平衡结构（B 树）将在 §6.2.4 再次出现，与本章外部排序共享「按页/按块访问外部存储」的口径。<\/p>", "ch03": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/计算机程序与设计艺术/图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版 (高德纳（Donald E.Knuth）著；贾洪峰译, (美) 克努特, (Knuth etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.312<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 5.1–5.2 章：排序的组合性质与内部排序<\/a><\/span><\/div><h1>第 6.1–6.2 章：顺序查找与按键比较进行的查找<\/h1>\n<blockquote>对应原书第 6 章 §6.1「顺序查找」、§6.2「通过键的比较进行查找」（PDF 第 312–383 页；正文印刷页 = PDF 页 − 6）。本章回答：给定 <span class=\"katex-inline\">N<\/span> 条记录与一个待查键 <span class=\"katex-inline\">K<\/span>，怎样在表中定位它；先看不依赖次序的暴力顺序扫描，再看利用键值大小关系折半与建树的比较类查找。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出顺序查找的加权平均比较次数 <span class=\"katex-inline\">\\bar C_N=\\sum_{j=1}^{N}j p_j<\/span>，推出均匀分布下成功查找的 <span class=\"katex-inline\">(N+1)/2<\/span>；\n<\/li><li>\n用相邻交换论证证明静态表按查找频率降序排列时平均比较次数最小；\n<\/li><li>\n沿区间长度递推推出二分查找的比较次数上界 <span class=\"katex-inline\">\\lceil\\lg(N+1)\\rceil<\/span>，说清三分支比较与两个指针的作用；\n<\/li><li>\n描述二叉查找树的结构，指出退化链什么条件下出现，以及平衡树、多路 B 树分别用什么手段控制高度；\n<\/li><li>\n区分内部查找与外部查找、静态表与动态表在代价口径上的差别。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>顺序查找从头逐条核对，平均代价取决于各键被查找的频率和排列次序；有序表上的二分查找每次比较舍弃一半候选，代价随 <span class=\"katex-inline\">\\lg N<\/span> 增长；把比较关系组织成树，就得到二叉查找树，树高决定查找代价，退化与平衡是这一类方法的核心矛盾。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 8：顺序查找与静态最优排列（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。§6.1 先讨论最直接的暴力方法：从表首开始逐条把 <span class=\"katex-inline\">K<\/span> 与 <span class=\"katex-inline\">K_i<\/span> 比较，相等则成功，走到表尾仍不相等则失败（PDF 第 317 页）。书中假定键 <span class=\"katex-inline\">K_j<\/span> 被查找的概率为 <span class=\"katex-inline\">p_j<\/span>，<span class=\"katex-inline\">p_1+p_2+\\cdots+p_N=1<\/span>；完成一次成功查找所需要的时间与比较次数 <span class=\"katex-inline\">C<\/span> 成正比，平均值为 <span class=\"katex-inline\">\\bar C_N=p_1+2p_2+\\cdots+Np_N<\/span>（PDF 第 317 页，式 (3)）。若可以按期望的任意顺序摆放记录，则 <span class=\"katex-inline\">p_1\\ge p_2\\ge\\cdots\\ge p_N<\/span> 即高频记录靠前时 <span class=\"katex-inline\">\\bar C_N<\/span> 最小（PDF 第 317 页，式 (4)）。均匀分布 <span class=\"katex-inline\">p_j=1/N<\/span> 时 <span class=\"katex-inline\">\\bar C_N=(N+1)/2<\/span>；书中还给出齐普夫定律分布 <span class=\"katex-inline\">p_j=c/j<\/span>、<span class=\"katex-inline\">c=1/H_N<\/span>，此时 <span class=\"katex-inline\">\\bar C_N=N/H_N<\/span>（PDF 第 317 页，式 (8)(9)）。<\/p>\n<h3>2. 概念 9：二分查找与查找树（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。§6.2 指出，把访问顺序的限制放开、利用键的线性大小关系后，比较结果分成 <span class=\"katex-inline\">K&lt;K_i<\/span>、<span class=\"katex-inline\">K=K_i<\/span>、<span class=\"katex-inline\">K&gt;K_i<\/span> 三种：小于就不再考虑 <span class=\"katex-inline\">R_i,\\dots,R_N<\/span>，大于就不再考虑 <span class=\"katex-inline\">R_1,\\dots,R_i<\/span>（PDF 第 324 页）。§6.2.1 的二分查找（对数查找）先与表中间位置比较，按结果舍弃一半，再对选定的一半重复，大约 <span class=\"katex-inline\">\\lg N<\/span> 次比较即可定位或确认不存在（PDF 第 324 页）。书中二分查找算法用两个指针 <span class=\"katex-inline\">l<\/span>、<span class=\"katex-inline\">u<\/span> 标记当前区间下界与上界；同节的均匀二分查找变体在区间长度为奇数、偶数时取不同中点（PDF 第 328 页）。查找关系也可以组织成树：二叉查找树左子树键小于根、右子树键大于根；按随机顺序插入可能长出偏斜的树。§6.2.4 讨论面向外部存储的多路树，B 树除根外每个结点至少有 <span class=\"katex-inline\">\\lceil m/2\\rceil<\/span> 个子结点，1970 年由拜尔和麦克赖特提出（PDF 第 383 页）。<\/p>\n<h2>推导一（推演）：顺序查找平均比较次数与最优排列<\/h2>\n<p>设表中有 <span class=\"katex-inline\">N<\/span> 条记录，第 <span class=\"katex-inline\">j<\/span> 条记录被查找的概率为 <span class=\"katex-inline\">p_j<\/span>，<span class=\"katex-inline\">\\sum_{j=1}^{N}p_j=1<\/span>。顺序查找从位置 1 走到位置 <span class=\"katex-inline\">j<\/span> 需要 <span class=\"katex-inline\">j<\/span> 次比较，成功查找的期望比较次数为<\/p>\n<div class=\"katex-block\">\\bar C_N=\\sum_{j=1}^{N}j p_j.<\/div>\n<p><strong>均匀情形<\/strong>：<span class=\"katex-inline\">p_j=1/N<\/span>，则<\/p>\n<div class=\"katex-block\">\\bar C_N=\\frac{1}{N}\\sum_{j=1}^{N}j=\\frac{N+1}{2}.<\/div>\n<p>例如 <span class=\"katex-inline\">N=100<\/span>，成功查找平均走 50.5 次比较；失败查找要走完整个表，固定 <span class=\"katex-inline\">N<\/span> 次。<\/p>\n<p><strong>最优排列论证<\/strong>：考虑相邻位置 <span class=\"katex-inline\">i&lt;j<\/span> 上的两条记录，概率分别为 <span class=\"katex-inline\">p_i,p_j<\/span>。当前次序对期望的贡献为 <span class=\"katex-inline\">i p_i+j p_j<\/span>；若交换两条记录，贡献变为 <span class=\"katex-inline\">j p_i+i p_j<\/span>。交换前后的差为<\/p>\n<div class=\"katex-block\">\\Delta=(j p_i+i p_j)-(i p_i+j p_j)=(j-i)(p_i-p_j).<\/div>\n<p>位置差 <span class=\"katex-inline\">j-i&gt;0<\/span>。若低频记录排在高频之前，即 <span class=\"katex-inline\">p_i&lt;p_j<\/span>，则 <span class=\"katex-inline\">\\Delta&lt;0<\/span>：交换后期望变小。所以任何「前小后大」的相邻逆序都应交换，直到排列满足 <span class=\"katex-inline\">p_1\\ge p_2\\ge\\cdots\\ge p_N<\/span>，高频记录全部靠前，此时 <span class=\"katex-inline\">\\bar C_N<\/span> 取到最小值。这个结论只在静态表、查找概率已知且更新不频繁时成立；动态表不断插入删除，固定次序未必能保持最优。<\/p>\n<h2>推导二（推演）：二分查找的比较次数上界<\/h2>\n<p>记 <span class=\"katex-inline\">T(N)<\/span> 为在长度 <span class=\"katex-inline\">N<\/span> 的有序表上做一次二分查找的最坏比较次数。每一步与中点比较后，剩下的候选区间长度不超过 <span class=\"katex-inline\">\\lfloor N/2\\rfloor<\/span>，加上本次比较一步，递推为<\/p>\n<div class=\"katex-block\">T(N)=1+T(\\lfloor N/2\\rfloor),\\quad T(1)=1.<\/div>\n<p>逐层展开：第 1 次比较后区间长度 <span class=\"katex-inline\">\\le N/2<\/span>，第 2 次后 <span class=\"katex-inline\">\\le N/4<\/span>，第 <span class=\"katex-inline\">k<\/span> 次后 <span class=\"katex-inline\">\\le N/2^k<\/span>。当区间收缩到 1 个元素时再做最后一次比较即可判定成功或失败。区间长度在 <span class=\"katex-inline\">k<\/span> 步后小于 1 的条件是 <span class=\"katex-inline\">N/2^k&lt;1<\/span>，即 <span class=\"katex-inline\">k&gt;\\lg N<\/span>。整理得上界<\/p>\n<div class=\"katex-block\">T(N)\\le \\lceil\\lg(N+1)\\rceil.<\/div>\n<p>数值对照：<span class=\"katex-inline\">N=100<\/span> 时 <span class=\"katex-inline\">\\lceil\\lg 101\\rceil=7<\/span> 次；<span class=\"katex-inline\">N=1000<\/span> 时 <span class=\"katex-inline\">\\lceil\\lg 1001\\rceil=10<\/span> 次；<span class=\"katex-inline\">N=10^6<\/span> 时约 20 次。与顺序查找的 <span class=\"katex-inline\">(N+1)/2<\/span> 相比，<span class=\"katex-inline\">N<\/span> 增大后两者差距按对数与线性拉开。这个上界成立的前提是表已按键有序；无序表上没有「舍弃一半」的依据，折半无从做起。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉「表已排序」的前提<\/strong>：二分查找和查找树的分支判断都依赖「左支小于根、右支大于根」的次序。若表无序，一次比较 <span class=\"katex-inline\">K&gt;K_i<\/span> 不能排除任何右侧记录，折半退化为全表扫描；有序性是本章高效方法与第 6.1 节暴力扫描的分界线。\n<\/li><li>\n<strong>比较只保留两分支（小于/不小于）<\/strong>：§6.2 把比较结果分成小于、等于、大于三种。若合并成两分支，命中判断要延后到区间收缩后单独做；查找有序表的算法仍可运行，但路径上缺少提前成功出口，失败与成功的比较分布都会改变。\n<\/li><li>\n<strong>只用一个指针、不保留区间上界<\/strong>：二分查找靠 <span class=\"katex-inline\">l<\/span>、<span class=\"katex-inline\">u<\/span> 两个边界把候选夹在区间内。丢掉上界，中点移动后无法判断右侧还剩多少候选，可能反复回到已经排除过的区域；双指针是区间不变量的载体。\n<\/li><li>\n<strong>把静态表按频率排好后假定长期不变<\/strong>：最优排列推导用的是固定 <span class=\"katex-inline\">p_j<\/span>。若表是动态的、新键频繁插入，或使用频率随时间变化，一次性排定的次序会逐渐偏离最优；动态场景要在查找代价与更新代价之间另做权衡。\n<\/li><li>\n<strong>允许键大量重复却按互不相同处理<\/strong>：查找树把等值键挤到左子树或右子树一侧，等值密集时该侧枝叶膨胀，树高失控；重复键需要单独的挂接规则。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章顺序查找是 §6.4 拉链法在单个链表内部沿用的基础动作；二分查找与查找树复用了第 5 章排序得到的有序性。下一章转入不依赖全局有序的两条路线：§6.3 按键的二进制数字特性做数字查找，§6.4 用散列变换直接把键映射到表地址；§6.5 则面对主键之外的辅助属性检索。外部存储上的 B 树已在本章出现，它与第 5.4 节外部排序共享按块访问外部介质的口径。<\/p>", "ch04": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/计算机程序与设计艺术/图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版 (高德纳（Donald E.Knuth）著；贾洪峰译, (美) 克努特, (Knuth etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.397<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 6.1–6.2 章：顺序查找与按键比较进行的查找<\/a><\/span><\/div><h1>第 6.3–6.5 章：数字查找、散列与辅助键的查找<\/h1>\n<blockquote>对应原书第 6 章 §6.3「数字查找」、§6.4「散列」、§6.5「辅助键的查找」（PDF 第 391–460 页；正文印刷页 = PDF 页 − 6）。前一章的比较类查找沿大小关系分支，本章改用键的数字结构：按二进制位分支的数字查找树、把键变换成地址的散列，以及按主键之外的属性组织检索。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清数字查找按位分支的依据，描述 Patricia 树用 SKIP 字段跳过单支结点、压缩前缀的机制；\n<\/li><li>\n写出散列函数应满足的两条性质，区分拉链法与开放定址（线性探查）两种冲突处理；\n<\/li><li>\n按装填因子 <span class=\"katex-inline\">\\alpha=N/M<\/span> 推出拉链法成功、失败的平均链表长度，复述线性探查成功与失败探查长度的经典公式；\n<\/li><li>\n说明散列查找平均 <span class=\"katex-inline\">O(1)<\/span> 代价成立的条件，以及散列函数差、装填因子高时性能怎样恶化；\n<\/li><li>\n区分简单查询、范围查询、布尔查询三类辅助键检索，说出全表扫描、聚集索引与人工索引各自的适用边界。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>数字查找树顺着键的二进制位逐层分支；散列用一个与机器无关、与数据分布无关的函数把键直接映到表地址，冲突靠拉链或探查解决，平均探查长度由装填因子决定；辅助键检索面对的是「属性取值」而不是主键本身，查询类别越复杂，越需要额外的索引结构，代价也越高。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 11：数字查找与 Patricia 树（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c11.md\" target=\"_blank\" rel=\"noopener\">概念 c11<\/a>。§6.3 的数字查找不比较整键大小，而是查看键的二进制位：每一位取 0 走一支、取 1 走另一支，逐层缩小候选。Patricia 树是压缩形态的数字检索树：每个非叶结点带一个 SKIP 字段，记录查找时要跳过多少个二进制位；结点内保存该位置用于分支的位序号，单一路径上的中间结点被压掉，不再单独占层（PDF 第 397 页）。书中示例查找单词 THE（二进制形式 10111 01000 00101）：先看根结点 SKIP 指定的位，按位值向左或向右，再读下一结点的 SKIP 跳过连续相同位，直到落到与键前缀匹配的结点（PDF 第 397 页）。算法 P（Patricia）从表头出发，按左链、右链与 RTAG/LTAG 标记下移，比较阶段把参数与结点键逐位核对（PDF 第 397 页）。<\/p>\n<h3>2. 概念 10：散列查找（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。§6.4 把散列定位为「基于实际键值算术变换」的查找技术：散列函数 <span class=\"katex-inline\">h(K)<\/span> 把键变换成表地址，好的散列应满足性质 (a) 与机器无关、性质 (b) 与数据相关无关——真正随机的键可以只提取一些二进制位，实践中则需要依赖键全部二进制位的函数（PDF 第 413 页）。多字符键可组合后取模；卡特和韦格曼 1977 年提出把各字符独立散列后相加再模 <span class=\"katex-inline\">M<\/span> 的形式 <span class=\"katex-inline\">h(K)=(h_1(x_1)+\\cdots+h_l(x_l))\\bmod M<\/span>（PDF 第 413 页，式 (9)）。冲突处理两条路线：拉链法把同一散列地址的键串成链表，查找时先散列定位再在链上顺序核对；开放定址法在冲突后按探查序列找下一空槽，线性探查是其中步长固定的一种（PDF 第 414、418 页）。<\/p>\n<h3>3. 概念 12：辅助键的查找（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c12.md\" target=\"_blank\" rel=\"noopener\">概念 c12<\/a>。主键能唯一确定一条记录；辅助键是记录中除主键外用来检索的字段或属性，例如学生信息表中按所在州、专业、年龄范围找记录（PDF 第 443 页）。书中把查询分三类：(a) 简单查询，给出特定属性的特定定值，如「专业 = 数学」；(b) 范围查询，给出指定属性的取值范围，如「<span class=\"katex-inline\">21&lt;年龄\\le 23<\/span>」；(c) 布尔查询，用 AND、OR、NOT 把上述类型组合起来（PDF 第 443 页）。批量查询时可以先对整个文件做顺序扫描、在结果上聚集；文件不大或查询不要求即时响应时，这种方法可能最经济。大型文件、复杂查询则需要额外索引结构，人工打印索引是最朴素的形式（PDF 第 443 页）。<\/p>\n<h2>推导一（推演）：拉链法的平均链表长度<\/h2>\n<p>设散列表有 <span class=\"katex-inline\">M<\/span> 个地址槽，存入 <span class=\"katex-inline\">N<\/span> 个键，装填因子 <span class=\"katex-inline\">\\alpha=N/M<\/span>。假定散列函数随机均匀，每个键落到任一槽位的概率相等。<\/p>\n<p><strong>失败查找<\/strong>：待查键 <span class=\"katex-inline\">K<\/span> 散列到地址槽后，该槽链表中现有键数的期望就是失败时要核对的结点数。<span class=\"katex-inline\">N<\/span> 个键独立均匀分配到 <span class=\"katex-inline\">M<\/span> 个槽，某一槽分到 <span class=\"katex-inline\">k<\/span> 个键的期望为 <span class=\"katex-inline\">N/M=\\alpha<\/span>；失败查找不需要命中，沿链表核对到链尾为止，平均链表长度为<\/p>\n<div class=\"katex-block\">U_{\\text{链}}\\approx 1+\\alpha.<\/div>\n<p>（空槽时 1 次定位即结束，非空时核对链上全部结点。）<\/p>\n<p><strong>成功查找<\/strong>：被命中的键在链上位置服从链内均匀分布。长度为 <span class=\"katex-inline\">L<\/span> 的链，命中其中任一键的平均位置为 <span class=\"katex-inline\">(L+1)/2<\/span>；对全表取平均，链长期望仍为 <span class=\"katex-inline\">\\alpha<\/span>，于是<\/p>\n<div class=\"katex-block\">S_{\\text{链}}\\approx 1+\\frac{\\alpha}{2}.<\/div>\n<p>数值对照：<span class=\"katex-inline\">\\alpha=1<\/span> 时成功约 1.5 次、失败约 2 次；<span class=\"katex-inline\">\\alpha=0.5<\/span> 时成功约 1.25 次、失败约 1.5 次；<span class=\"katex-inline\">\\alpha=2<\/span> 时成功约 2 次、失败约 3 次。拉链法即使 <span class=\"katex-inline\">\\alpha&gt;1<\/span> 也能工作，只是链表拉长、顺序核对代价上升；这个平均结果依赖散列均匀的假设，散列把同类键聚到同一批槽位时，局部链长会显著偏离期望。<\/p>\n<h2>推导二（推演）：线性探查的探查长度与聚集效应<\/h2>\n<p>开放定址法不用链表，冲突后按探查序列找空槽。线性探查的探查序列为 <span class=\"katex-inline\">h(K),h(K)+1,\\dots<\/span>（模表长）。设装填因子同为 <span class=\"katex-inline\">\\alpha<\/span>。Knuth 在本书中给出的经典平均结果为：<\/p>\n<p>成功查找平均探查次数<\/p>\n<div class=\"katex-block\">S_{\\text{探}}\\approx \\tfrac12\\left(1+\\frac{1}{1-\\alpha}\\right),<\/div>\n<p>失败查找平均探查次数<\/p>\n<div class=\"katex-block\">U_{\\text{探}}\\approx \\tfrac12\\left(1+\\frac{1}{(1-\\alpha)^2}\\right).<\/div>\n<p>推导思路：聚集指连续占用的槽段。一个新键散列到某槽，若该槽被占，就并入右侧最近的连续占用段；段越长，后续探查穿过它的概率越高，段会自我加长。成功查找面对的是已经插入的键，只需穿过它所在段的一部分；失败查找要穿过一整段占用槽才能找到空槽，因此失败公式里分母是 <span class=\"katex-inline\">(1-\\alpha)^2<\/span>，随 <span class=\"katex-inline\">\\alpha<\/span> 上升得更快。<\/p>\n<p>数值对照：<span class=\"katex-inline\">\\alpha=0.5<\/span> 时成功约 1.5 次、失败约 2.5 次；<span class=\"katex-inline\">\\alpha=0.75<\/span> 时成功约 2.5 次、失败约 6.5 次；<span class=\"katex-inline\">\\alpha=0.9<\/span> 时成功约 5.5 次、失败约 50.5 次。<span class=\"katex-inline\">\\alpha<\/span> 接近 1 时线性探查的失败探查长度趋于无穷，这是开放定址法必须控制装填因子、并在表满前扩容重散列的根据。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>散列函数退化成常数映射<\/strong>：所有键都映到同一地址，拉链法退化成一条长度 <span class=\"katex-inline\">N<\/span> 的单链表，平均核对 <span class=\"katex-inline\">N/2<\/span> 次；探查法全部挤进同一槽段，聚集效应拉满。散列的均匀性是 <span class=\"katex-inline\">O(1)<\/span> 平均代价的前提，函数差与表满同样致命。\n<\/li><li>\n<strong>去掉冲突处理，假定散列必然不冲突<\/strong>：不同键落到同一地址时没有挂接规则，后到的键无处可放；现实中键空间远大于表地址空间，冲突是必然事件而不是例外，拉链或探查正是为容纳冲突而设。\n<\/li><li>\n<strong>拉链法改成不存链、只留一个槽<\/strong>：退化成开放定址；反过来探查法若允许溢出链表，就部分变回拉链。两种路线的内存占用不同：拉链法额外消耗链结点空间，探查法全部记录压在基表内但受装填因子上限约束。\n<\/li><li>\n<strong>数字查找树保留全部单支中间结点<\/strong>：缺了 Patricia 的 SKIP 压缩，前缀相同的键之间会插入大量只有一个分支的结点，树高被公共前缀拉长，逐层下移的次数增多；压缩字段去掉的是不提供分支信息的层。\n<\/li><li>\n<strong>辅助键检索只靠主键顺序<\/strong>：按属性取值找记录时，主键次序对属性范围没有帮助，只能全表扫描；范围查询与布尔查询无法利用主键索引，这正是需要倒排或辅助索引的原因。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章散列的链内顺序查找回到 §6.1 的顺序扫描；数字查找树与 §6.2 的二叉查找树共享树状下移结构，区别在分支依据是位序列还是大小比较。全书至此形成两条检索路线：比较类（顺序、二分、查找树）依赖有序性，散列与数字类依赖键的编码结构。§6.5 的辅助键检索把视角从「定位一条记录」扩展到「按属性聚集一批记录」，是数据库索引组织的入口；第 5 章排序产物与第 6 章查找方法在此汇合：有序表服务比较查找，散列表服务快速等值定位，倒排服务属性检索。<\/p>", "c01": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/计算机程序与设计艺术/图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版 (高德纳（Donald E.Knuth）著；贾洪峰译, (美) 克努特, (Knuth etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.15<\/div><h1>排序问题、稳定性与反序：键、记录与逆序对代价度量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书 §5.1.1 反序，PDF 第 15 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>面对一堆杂乱存放的数据，先要回答「排序到底在排什么、按什么排、排完怎样算排对了」。如果不区分键与附属信息，把整段记录拿来逐字段比较，代价会失控；如果不定义相等键的处理规则，同一份输入每次排序结果可能次序不同，后续查找与匹配就得不到稳定结论。排序还需要一个度量输入混乱程度的量，否则比较两种排序方法时，只能凭感觉说「快」或「慢」。反序（逆序对）就是为这个度量目的引入的概念：它数清楚有多少对记录前后位置与键值次序相反。<\/p>\n<h2>定义<\/h2>\n<p><strong>记录（record）<\/strong>：参与排序的数据项，每条记录携带一个用来比较的字段，称为<strong>键（key）<\/strong>，其余字段是随记录一起移动的附属信息。排序算法通常只比较键，不比较附属信息。<\/p>\n<p><strong>升序与降序<\/strong>：升序要求最终 <span class=\"katex-inline\">K_1\\le K_2\\le\\cdots\\le K_N<\/span>，降序方向相反；本书主要按升序叙述。<\/p>\n<p><strong>稳定排序<\/strong>：两个键相等的记录 <span class=\"katex-inline\">R_a,R_b<\/span>，输入时 <span class=\"katex-inline\">a<\/span> 在 <span class=\"katex-inline\">b<\/span> 之前；排序完成后若 <span class=\"katex-inline\">a<\/span> 仍在 <span class=\"katex-inline\">b<\/span> 之前，方法是稳定的；若可能交换到 <span class=\"katex-inline\">b<\/span> 之后，则不稳定。稳定性只对相等键有意义，键互不相同时无从体现。<\/p>\n<p><strong>反序（inversion）<\/strong>：一对位置 <span class=\"katex-inline\">i&lt;j<\/span> 满足 <span class=\"katex-inline\">K_i&gt;K_j<\/span>，称这对记录构成一个反序。反序表 <span class=\"katex-inline\">b_j<\/span> 定义为：在 <span class=\"katex-inline\">j<\/span> 左边、键大于 <span class=\"katex-inline\">K_j<\/span> 的元素个数。所有 <span class=\"katex-inline\">b_j<\/span> 合起来唯一刻画一个排列的混乱程度。<\/p>\n<p><strong>正例<\/strong>：序列 <span class=\"katex-inline\">3,1,2<\/span> 中，<span class=\"katex-inline\">(3,1)<\/span>、<span class=\"katex-inline\">(3,2)<\/span> 是反序，共 2 个；<span class=\"katex-inline\">b_1=0<\/span>，<span class=\"katex-inline\">b_2=1<\/span>（3 大于 1），<span class=\"katex-inline\">b_3=1<\/span>（3 大于 2）。<strong>反例<\/strong>：把附属信息不同但键相同的两条记录当成不同键来比较，属于混淆了排序依据；相等键之间不做大小比较。<\/p>\n<h2>原理推导<\/h2>\n<p><span class=\"katex-inline\">1,2,\\dots,n<\/span> 的排列总数为 <span class=\"katex-inline\">n!<\/span>。从反序表角度计数：<span class=\"katex-inline\">b_1<\/span> 有 <span class=\"katex-inline\">n<\/span> 种取值（<span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">n-1<\/span>），<span class=\"katex-inline\">b_2<\/span> 有 <span class=\"katex-inline\">n-1<\/span> 种，……，<span class=\"katex-inline\">b_n<\/span> 只有 1 种；各 <span class=\"katex-inline\">b_j<\/span> 相互独立，所以反序表总数为 <span class=\"katex-inline\">n(n-1)\\cdots1=n!<\/span>，与排列总数吻合（PDF 第 15 页）。<\/p>\n<p>相邻两个元素交换一次，反序数改变 1：若交换的是逆序相邻对，反序数减 1；若是顺序相邻对，反序数加 1。原书图 1 把 <span class=\"katex-inline\">\\{1,2,3,4\\}<\/span> 的 24 个排列连成截八面体，每条边对应一次相邻交换，从 1234 到某排列的路径长度就是该排列的反序数。由此得到两个推论：一是把输入排好所需的相邻交换次数，至少等于反序数；二反序数越少，输入越接近有序。<\/p>\n<p>从右向左读取时局部最大值的平均个数，可以用反序表估算：<span class=\"katex-inline\">b_1<\/span> 以 <span class=\"katex-inline\">1/n<\/span> 概率取 <span class=\"katex-inline\">n-1<\/span>，<span class=\"katex-inline\">b_2<\/span> 以 <span class=\"katex-inline\">1/(n-1)<\/span> 概率取 <span class=\"katex-inline\">n-2<\/span>，依此类推，平均个数为调和数 <span class=\"katex-inline\">H_n=1/n+1/(n-1)+\\cdots+1<\/span>（PDF 第 15 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：记录之间存在可比较的键次序；反序数针对线性次序定义，多关键字复合排序需要先规定主键、次键的比较优先级。\n<\/li><li>\n边界一：稳定性是方法性质，不是排序结果性质。同一输入用稳定方法排两遍与用不稳定方法排一遍，相等键的次序差异只在后续依赖相对次序的场景（如二次排序）才暴露。\n<\/li><li>\n失败案例一：用反序数衡量基于基数划分的排序代价会失真。基数排序不依赖相邻交换，反序数不直接对应它的操作次数。\n<\/li><li>\n失败案例二：把键相等当成「小于或大于」处理，会人为制造分支，破坏稳定性假设；等值记录应跳过交换。\n<\/li><li>\n边界二：反序数是最坏与平均分析之外的输入描述量，本身不决定算法运行时间，只提供混乱程度的参照。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>键 vs 记录<\/strong>：键是比较依据，记录是整体；排序移动的是记录，比较的是键。把附属信息纳入比较会抬高代价且没有必要。\n<\/li><li>\n<strong>稳定性 vs 有序性<\/strong>：有序性指最终键的大小次序，稳定性指相等键的原始相对次序；一个方法可以产出有序结果但不稳定。\n<\/li><li>\n<strong>反序 vs 逆序排列<\/strong>：反序是一对位置关系，逆序排列是整体完全倒序的序列；后者反序数为 <span class=\"katex-inline\">N(N-1)/2<\/span>，是反序最多的情形。\n<\/li><li>\n<strong>反序数 vs 比较次数<\/strong>：反序数描述输入，比较次数描述算法；交换类方法的操作量与反序数相关，选择、合并类方法的代价另按自身结构计算。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无，本章是全书排序部分的度量起点。后继：c02 插入排序每一步消除前缀内的反序；c03 交换排序通过相邻交换或划分削减反序；c06 的决策树下界把输入排列总数 <span class=\"katex-inline\">N!<\/span> 作为叶子数根据；查找部分的有序表前提，正是排序把反序数降为 0 的产物。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（排序问题、稳定性与反序：键、记录与逆序对代价度量）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：排序对象、稳定性判据与反序计数<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把「排序在排什么、混乱程度怎样数」讲到可推演，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先区分比较依据与被移动整体<\/strong>。排序过程中真正参与大小判断的只有键；记录上的其他字段不参与比较，只跟着键对应的位置一起走。这一层不先分清，后面讨论比较次数时就会把附属字段的读取也算进去，口径全乱。\n<\/li><li>\n<strong>次序关系必须是线性可比较的<\/strong>。键之间能回答「谁大、谁小、相等」三类结果，才谈得上排成 <span class=\"katex-inline\">K_1\\le K_2\\le\\cdots\\le K_N<\/span>。若键是只能分组、不能排先后的类别标识，问题属于归类而不是排序。\n<\/li><li>\n<strong>相等键要有约定的处理规则<\/strong>。输入里相等键有先后位置；算法遇到相等时是跳过交换还是继续移动，决定了方法是否稳定。规则不写清，同一输入两次运行可能得到不同的相等键次序。\n<\/li><li>\n<strong>需要一个只依赖输入、不依赖算法的混乱度量<\/strong>。反序数就是这样设计的量：它数位置与次序相反的配对，任何排序方法都可以拿自己消除了多少反序作为对照；度量先于算法评价存在。\n<\/ol>\n<p>依赖链方向：可比较的键 → 记录整体随键移动 → 相等键处理规则 → 反序对计数与反序表。任一层前提缺失，稳定性判据和反序分析都落不到具体排列上。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：写出一条记录的结构<\/h3>\n<p>一条记录 <span class=\"katex-inline\">R_j<\/span> 由键 <span class=\"katex-inline\">K_j<\/span> 和附属信息 <span class=\"katex-inline\">I_j<\/span> 组成。排序的输入是记录序列 <span class=\"katex-inline\">R_1,R_2,\\dots,R_N<\/span>，输出仍是记录序列，只是位置重排；比较动作只读取 <span class=\"katex-inline\">K<\/span>，移动动作把整条 <span class=\"katex-inline\">R<\/span> 复制或交换到新位置。<\/p>\n<h3>第二步：定义升序目标<\/h3>\n<p>升序排序完成后，对任意 <span class=\"katex-inline\">i&lt;j<\/span> 都有 <span class=\"katex-inline\">K_i\\le K_j<\/span>。把不等号拆开：要么 <span class=\"katex-inline\">K_i&lt;K_j<\/span>，要么 <span class=\"katex-inline\">K_i=K_j<\/span>。排序算法保证的是前者不被违反；后者之间的先后，交给稳定性规则决定。<\/p>\n<h3>第三步：稳定性的判据<\/h3>\n<p>设输入中 <span class=\"katex-inline\">R_a<\/span> 在 <span class=\"katex-inline\">R_b<\/span> 之前且 <span class=\"katex-inline\">K_a=K_b<\/span>。排序结束后检查：若 <span class=\"katex-inline\">R_a<\/span> 仍在 <span class=\"katex-inline\">R_b<\/span> 之前，方法对这对记录稳定；若 <span class=\"katex-inline\">R_b<\/span> 跑到 <span class=\"katex-inline\">R_a<\/span> 之前，方法不稳定。判据只看相等键，键不同的记录谁在前由大小次序决定，不参与稳定性评价。<\/p>\n<h3>第四步：定义反序对与反序表<\/h3>\n<p>对位置 <span class=\"katex-inline\">i&lt;j<\/span>，若 <span class=\"katex-inline\">K_i&gt;K_j<\/span>，记一对反序。反序表第 <span class=\"katex-inline\">j<\/span> 项 <span class=\"katex-inline\">b_j<\/span> 数的是：位置 <span class=\"katex-inline\">j<\/span> 左侧有多少个键比 <span class=\"katex-inline\">K_j<\/span> 大。<span class=\"katex-inline\">b_j<\/span> 的取值范围是 <span class=\"katex-inline\">0,1,\\dots,j-1<\/span>。反序总数 <span class=\"katex-inline\">I=\\sum_{j=1}^{N}b_j<\/span>。<\/p>\n<h3>第五步：验证反序表与排列一一对应<\/h3>\n<p>计数 <span class=\"katex-inline\">1,2,\\dots,n<\/span> 的排列：<span class=\"katex-inline\">b_1<\/span> 只能取 0（左侧无元素），对应 1 种；<span class=\"katex-inline\">b_2<\/span> 可取 0、1，对应 2 种；<span class=\"katex-inline\">b_j<\/span> 可取 <span class=\"katex-inline\">0,\\dots,j-1<\/span>，共 <span class=\"katex-inline\">j<\/span> 种；<span class=\"katex-inline\">b_n<\/span> 有 <span class=\"katex-inline\">n<\/span> 种。各位置取值互不牵制，反序表总数为 <span class=\"katex-inline\">1\\cdot2\\cdot3\\cdots n=n!<\/span>，恰好等于排列总数。这说明用反序表描述排列没有重复也没有遗漏。<\/p>\n<h3>第六步：相邻交换对反序数的影响<\/h3>\n<p>取相邻位置 <span class=\"katex-inline\">j,j+1<\/span>。若 <span class=\"katex-inline\">K_j&gt;K_{j+1}<\/span>，这一对本身是反序；交换后它们变成顺序，其余配对的左右位置关系没有改变，反序数减 1。若 <span class=\"katex-inline\">K_j&lt;K_{j+1}<\/span>，交换后新形成一对反序，反序数加 1。一次相邻交换只改动这一对的方向，所以反序数变化量为 <span class=\"katex-inline\">\\pm1<\/span>。<\/p>\n<h3>第七步：反序数作为交换下界<\/h3>\n<p>把逆序相邻对逐次交换成顺序，每步消除 1 个反序；从初始排列到完全有序至少需要 <span class=\"katex-inline\">I<\/span> 次相邻交换。非相邻交换一次可以消除多个反序，但那是算法选择的操作方式，不改变「反序总数必须被消除」这个事实。<\/p>\n<h3>第八步：局部最大值个数的期望<\/h3>\n<p>从右向左读排列，遇到比右侧已读所有键都大的元素就是一个局部最大值。<span class=\"katex-inline\">b_j<\/span> 取 <span class=\"katex-inline\">n-j+1<\/span>（即左侧元素全比它小、它是左侧最大）对应最大值情形；按等概率分布，<span class=\"katex-inline\">b_1<\/span> 以 <span class=\"katex-inline\">1/n<\/span> 概率取 <span class=\"katex-inline\">n-1<\/span>，<span class=\"katex-inline\">b_2<\/span> 以 <span class=\"katex-inline\">1/(n-1)<\/span> 概率取 <span class=\"katex-inline\">n-2<\/span>，逐项相加得到平均个数 <span class=\"katex-inline\">H_n=1/n+1/(n-1)+\\cdots+1<\/span>（PDF 第 15 页）。调和数增长极慢，<span class=\"katex-inline\">n<\/span> 很大时局部最大值平均只有 <span class=\"katex-inline\">\\ln n<\/span> 量级。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：手算反序数<\/h3>\n<p>取 <span class=\"katex-inline\">N=4<\/span> 的排列 <span class=\"katex-inline\">3,1,4,2<\/span>。逐对检查：<\/p>\n<ul><li>\n位置 1 的 3：右侧 1、2 比它小，构成反序 <span class=\"katex-inline\">(3,1)<\/span>、<span class=\"katex-inline\">(3,2)<\/span>；\n<\/li><li>\n位置 2 的 1：右侧 4、2 都比它大，无反序；\n<\/li><li>\n位置 3 的 4：右侧 2 比它小，构成反序 <span class=\"katex-inline\">(4,2)<\/span>；\n<\/li><li>\n反序总数 <span class=\"katex-inline\">I=3<\/span>。\n<p>反序表：<span class=\"katex-inline\">b_1=0<\/span>，<span class=\"katex-inline\">b_2=1<\/span>（3 大于 1），<span class=\"katex-inline\">b_3=0<\/span>（3、1 都小于 4），<span class=\"katex-inline\">b_4=2<\/span>（3、4 大于 2），求和 <span class=\"katex-inline\">0+1+0+2=3<\/span>，两种口径吻合。<\/p>\n<\/ul>\n<h3>算例 2：两种极端排列<\/h3>\n<ul><li>\n完全有序 <span class=\"katex-inline\">1,2,3,4<\/span>：每对都顺序，<span class=\"katex-inline\">I=0<\/span>，反序表全 0。\n<\/li><li>\n完全逆序 <span class=\"katex-inline\">4,3,2,1<\/span>：每对都是反序，<span class=\"katex-inline\">I=4\\cdot3/2=6<\/span>，反序表 <span class=\"katex-inline\">b=(0,1,2,3)<\/span>。\n<p><span class=\"katex-inline\">N=100<\/span> 时逆序排列反序数为 <span class=\"katex-inline\">100\\cdot99/2=4950<\/span>；有序排列为 0。<\/p>\n<\/ul>\n<h3>算例 3：稳定性判定<\/h3>\n<p>输入两条记录：<span class=\"katex-inline\">R_a=(<\/span>键 5，姓名「甲」<span class=\"katex-inline\">)<\/span>，<span class=\"katex-inline\">R_b=(<\/span>键 5，姓名「乙」<span class=\"katex-inline\">)<\/span>，<span class=\"katex-inline\">a<\/span> 在 <span class=\"katex-inline\">b<\/span> 前。某排序算法在两键相等时仍执行一次交换，输出 <span class=\"katex-inline\">R_b<\/span> 在前、<span class=\"katex-inline\">R_a<\/span> 在后，该方法对这对记录不稳定；若相等分支直接跳过移动，则保持原次序，稳定。键不同的例子 <span class=\"katex-inline\">(<\/span>3<span class=\"katex-inline\">),(<\/span>5<span class=\"katex-inline\">)<\/span> 无论怎样交换都不涉及稳定性。<\/p>\n<h3>算例 4：相邻交换步数对照<\/h3>\n<p>排列 <span class=\"katex-inline\">3,1,2<\/span> 有反序 <span class=\"katex-inline\">(3,1)<\/span>、<span class=\"katex-inline\">(3,2)<\/span>，<span class=\"katex-inline\">I=2<\/span>。相邻交换过程：<span class=\"katex-inline\">3,1,2\\to1,3,2\\to1,2,3<\/span>，两步消除全部反序，步数等于 <span class=\"katex-inline\">I<\/span>。若允许非相邻交换，<span class=\"katex-inline\">3,1,2<\/span> 一步把 3 换到末尾即得 <span class=\"katex-inline\">1,2,3<\/span>，一步消除两个反序；步数减少来自操作跨度加大，不改变初始 <span class=\"katex-inline\">I=2<\/span> 的事实。<\/p>\n<h3>算例 5：调和数增长<\/h3>\n<p><span class=\"katex-inline\">H_4=1+1/2+1/3+1/4=2.083<\/span>；<span class=\"katex-inline\">H_{10}\\approx2.929<\/span>；<span class=\"katex-inline\">H_{100}\\approx5.187<\/span>。局部最大值平均个数随 <span class=\"katex-inline\">n<\/span> 增长很慢，<span class=\"katex-inline\">n<\/span> 从 10 增到 100，平均个数只从约 2.93 增到约 5.19。<\/p>\n<h3>算例 6：复合键的次序约定<\/h3>\n<p>若排序依据是「先按专业、专业相同再按姓名」，比较规则先比专业键；专业相等才比姓名键。此时只按姓名排序会打乱专业分组，次序优先级必须先规定清楚，反序对也按这套复合规则判定。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n看到一条记录，能指出哪部分是键、哪部分是附属信息吗？排序时比较的是哪一部分？\n<\/li><li>\n「排序结果有序」和「排序方法稳定」是不是同一件事？各用什么条件判断？\n<\/li><li>\n给定一个小排列，能否逐对数出反序对，再用反序表求和核对一遍？\n<\/li><li>\n相邻交换一次，反序数最多改变多少？为什么非相邻交换不受这个步数约束？\n<\/li><li>\n反序数是输入性质还是算法性质？基数排序的代价能不能直接用反序数衡量？\n<\/ol>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>若键之间不存在全序关系<\/strong>：只能把记录分成互不比较的类别，反序对无从定义；问题变成归属与聚类，排序这一套比较分析不适用。\n<\/li><li>\n<strong>若相等键允许任意交换且不记录原始次序<\/strong>：二次排序（先按次键排、再按主键稳定排）会把第一次排序的成果冲掉；稳定性规则的价值在多轮排序中才看得出来。\n<\/li><li>\n<strong>若用非相邻交换作为基本操作<\/strong>：一次操作可同时消除多对反序，反序数不再等于操作步数；下界仍然是反序数总量，但每步能消除多少取决于操作跨度。\n<\/li><li>\n<strong>若附属信息也参与比较<\/strong>：比较代价随记录宽度增长，且排序结果可能被附属字段的偶然差异左右；把比较依据限定在键上，是控制代价与明确次序的共同需要。\n<\/ul>\n<h2>延伸层：反序数在后续分析中的位置<\/h2>\n<p>反序数在本章后面几类方法中扮演不同角色。插入排序每把新键向左挪一位，消除的是它与左侧较大键构成的反序；交换排序的相邻交换直接对应反序数减 1；快速排序通过划分把大于基准和小于基准的键分到两侧，一次性消除跨区间的大批反序。§5.3 的下界分析不再数反序，而是数排列种类：<span class=\"katex-inline\">N!<\/span> 种输入必须被区分开，决策树叶子数由此而来。反序数衡量单条输入的混乱程度，<span class=\"katex-inline\">N!<\/span> 衡量输入空间的总规模，两者一个看点、一个看面，不要混用。<\/p>\n<p>在工程口径上，反序数还用于判断输入是否接近有序：接近有序的文件反序数少，插入类方法代价低；完全逆序的文件反序数达到 <span class=\"katex-inline\">N(N-1)/2<\/span>，插入类方法退到二阶代价。实际数据中「接近有序」是常见情形，例如已经按另一关键字排过一遍的文件再做二次排序，这时选用对有序输入敏感的方法才有依据。<\/p>\n<h2>扩展推演：反序在排序方法间的传递<\/h2>\n<p>反序数是输入侧的量，不同排序方法把它转成操作量的方式不同。插入排序每向左挪一步消除一对反序；交换排序的相邻交换一次消除一对；快速排序划分后，跨在基准两侧的反序对一次性消除，不再进入子文件；合并排序不直接数反序，它靠两段有序保证输出次序。比较这些方法时，反序数只能解释交换类方法的操作起点，不能直接换算成合并类方法的移动量。<\/p>\n<p>再看反序表与排列唯一性的对应。<span class=\"katex-inline\">b_j<\/span> 取值 <span class=\"katex-inline\">0,\\dots,j-1<\/span>，各位置独立，总数 <span class=\"katex-inline\">n!<\/span>；给定一组 <span class=\"katex-inline\">b_j<\/span>，可以从 <span class=\"katex-inline\">j=n<\/span> 向前还原排列：<span class=\"katex-inline\">b_j<\/span> 表示 <span class=\"katex-inline\">K_j<\/span> 在剩余元素中的次序位置。这个还原过程说明反序表不是排列的模糊描述，而是一一对应的编码。若两个排列有同一反序表，还原出的序列必然相同；编码与解码双向成立。<\/p>\n<p>工程上判断输入是否接近有序，常用反序数与 <span class=\"katex-inline\">N(N-1)/2<\/span> 的比值：比值接近 0 接近有序，接近 1 接近逆序。接近有序的文件选插入类方法收益高；完全逆序的文件反序数达到上界，插入类退到二阶，应换划分或归并路线。二次排序场景中，第一遍按次键排过的文件在主键上接近有序，这是插入排序被保留在实用工具链中的主要原因。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n为什么反序表 <span class=\"katex-inline\">b_j<\/span> 的取值范围是 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">j-1<\/span>，而不是 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">N-1<\/span>？\n<\/li><li>\n两个键相等的记录在稳定性判据中处于什么位置？把相等误判成大小关系会造成什么后果？\n<\/li><li>\n用反序表计数得到 <span class=\"katex-inline\">n!<\/span> 这个结果，说明了反序表与排列之间是什么对应关系？\n<\/li><li>\n完全逆序排列的反序数公式是什么？<span class=\"katex-inline\">N=10<\/span> 时等于多少？\n<\/li><li>\n为什么说反序数是相邻交换排序的下界，而不是所有排序方法的统一操作下界？\n<\/ol><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/计算机程序与设计艺术/图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版 (高德纳（Donald E.Knuth）著；贾洪峰译, (美) 克努特, (Knuth etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.67<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">排序问题、稳定性与反序：键、记录与逆序对代价度量<\/a><\/span><\/div><h1>直接插入排序：逐步插入已排序前缀，比较与移动次数推导<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书 §5.2.1 插入排序，PDF 第 67 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>当记录数量不大，或输入已经接近有序时，需要一种结构简单、额外空间少的排序方法。朴素做法每轮把未排序段整体扫一遍挑最小，比较次数固定偏高；插入思路反过来维护一段已经有序的前缀，把新记录就地插入它该在的位置。这个概念要解决的困难是：在不另开一个等大有序数组的前提下，怎样逐条把记录归位，并且说清比较多少次、移动多少记录。<\/p>\n<h2>定义<\/h2>\n<p><strong>直接插入排序<\/strong>：假定 <span class=\"katex-inline\">R_1,\\dots,R_{j-1}<\/span> 已经按键有序，取第 <span class=\"katex-inline\">j<\/span> 条记录 <span class=\"katex-inline\">R_j<\/span>，从右向左与前缀中的键逐个比较，找到第一个不大于它的位置，把该位置之后的记录整体上移一格，再把 <span class=\"katex-inline\">R_j<\/span> 放入空出的位置。<\/p>\n<p>书中算法（§5.2.1）的步骤：对 <span class=\"katex-inline\">j=2,3,\\dots,N<\/span> 循环；先置 <span class=\"katex-inline\">i\\leftarrow j-1<\/span>、<span class=\"katex-inline\">K\\leftarrow K_j<\/span>、<span class=\"katex-inline\">R\\leftarrow R_j<\/span>；再比较 <span class=\"katex-inline\">K<\/span> 与 <span class=\"katex-inline\">K_i<\/span>，若 <span class=\"katex-inline\">K\\ge K_i<\/span> 则停止前移，否则 <span class=\"katex-inline\">i<\/span> 减 1 继续比较；结束后把记录右移并写入 <span class=\"katex-inline\">R<\/span>（PDF 第 67 页）。<\/p>\n<p><strong>有序前缀不变量<\/strong>：每轮循环开始时 <span class=\"katex-inline\">K_1\\le\\cdots\\le K_{j-1}<\/span>，循环结束时 <span class=\"katex-inline\">K_1\\le\\cdots\\le K_j<\/span>。不变量把「前面已经排好」这件事固定下来，是插入位置查找的依据。<\/p>\n<p><strong>正例<\/strong>：前缀 <span class=\"katex-inline\">1,3,5<\/span>，新键 4；从右比 5（4&lt;5，上移），再比 3（4≥3，停），插入得 <span class=\"katex-inline\">1,3,4,5<\/span>。<strong>反例<\/strong>：若前缀无序，从右向左比较不能保证跳过的右侧区间都比新键大，插入位置判断失效。<\/p>\n<h2>原理推导<\/h2>\n<p>第 <span class=\"katex-inline\">j<\/span> 步插入长度 <span class=\"katex-inline\">j-1<\/span> 的前缀。最坏情形新键是当前最小键，要与 <span class=\"katex-inline\">K_{j-1},K_{j-2},\\dots,K_1<\/span> 全部比较完才落到最左端，比较 <span class=\"katex-inline\">j-1<\/span> 次。全书最坏比较次数<\/p>\n<div class=\"katex-block\">C_{\\max}=\\sum_{j=2}^{N}(j-1)=\\frac{N(N-1)}{2}.<\/div>\n<p>随机排列下，新键在前缀加自身共 <span class=\"katex-inline\">j<\/span> 个位置中等概率落位，落到从右数第 <span class=\"katex-inline\">r<\/span> 位需要 <span class=\"katex-inline\">r<\/span> 次比较，<span class=\"katex-inline\">r=1,\\dots,j<\/span>，期望比较次数 <span class=\"katex-inline\">(j+1)/2<\/span>，全书期望<\/p>\n<div class=\"katex-block\">E_C=\\sum_{j=2}^{N}\\frac{j+1}{2}\\approx\\frac{N^2}{4}.<\/div>\n<p>移动次数与比较次数同量级：找到位置后，位置之后的每条记录上移一格，再写入新记录。接近有序的输入中，新键通常落在前缀右端附近，比较次数接近 <span class=\"katex-inline\">N<\/span>；完全逆序时达到二阶上界。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：<span class=\"katex-inline\">N<\/span> 较小，或输入接近有序；顺序存储的表便于上移一格；方法稳定（相等键不越过左侧相等记录）。\n<\/li><li>\n边界一：链式存储上插入不需要搬移记录，但沿链从右向左回溯需要双向链；单向链无法高效找到插入位置。\n<\/li><li>\n失败案例一：<span class=\"katex-inline\">N<\/span> 很大且输入随机，<span class=\"katex-inline\">N^2/4<\/span> 的比较量级被远超，插入排序不再经济，应换划分或归并类方法。\n<\/li><li>\n失败案例二：不维护有序前缀不变量，比如某轮提前结束前移，后续插入可能插到错误区间。\n<\/li><li>\n边界二：比较次数之外，记录宽度决定单次移动成本；记录很宽、键很窄时，搬移整条记录的代价可能超过键比较，实际实现可先排序键与指针、最后再按指针重排记录。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>插入排序 vs 选择排序<\/strong>：插入每轮维护有序前缀并把新键插入其中；选择每轮从未排序段挑最小追加到前缀末尾。插入的比较次数依赖输入有序程度，选择的比较次数几乎与输入无关。\n<\/li><li>\n<strong>直接插入 vs 二分插入<\/strong>：直接插入从右向左线性比较找位置；二分插入在前缀内折半查找插入点，比较次数降到 <span class=\"katex-inline\">N\\lg N<\/span> 量级，但记录上移的移动次数没有减少。\n<\/li><li>\n<strong>插入排序 vs 冒泡排序<\/strong>：插入消除的是新键与前缀内的反序；冒泡通过相邻交换把大键逐步推到后端。两者都是 <span class=\"katex-inline\">N^2<\/span> 量级，操作对象不同。\n<\/li><li>\n<strong>比较次数 vs 移动次数<\/strong>：比较读键，移动搬记录；插入排序两者都随插入位置变化，分析时要分开记账。\n<\/ul>\n<p><strong>常见误解<\/strong>：一种看法以为插入排序「逐条归位」所以总是线性时间。实际上归位距离由输入反序数决定，逆序输入下每条记录都要走到最左端，比较与移动都到二阶；只有接近有序时才接近线性。另一种误解是把二分插入的比较收益当成整体收益：插入点查找可以折半，但记录上移的移动量没有减少，记录宽时移动仍是主项。判断插入类方法的代价，要同时看键比较次数与记录搬移量，不能只看其中一条线。<\/p>\n<h2>联系<\/h2>\n<p>前置：c01 的有序目标与反序度量。后继：c03 交换排序中的快速排序把插入的「逐条归位」换成「按划分批量归位」；c05 合并排序解决插入在大规模随机输入下的二阶代价；查找部分的有序表前提，由这类内部排序产出。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（直接插入排序：逐步插入已排序前缀，比较与移动次数推导）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：直接插入排序的不变量、比较与移动代价<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把插入排序讲到能自己补出下一行，先往回追四层前提：<\/p>\n<ol><li>\n<strong>存储方式允许就地移动<\/strong>。顺序存储的数组中，记录可以整体上移一格腾出位置；若只能通过指针链接、不能搬移存储单元，插入位置的确定和记录归位要另作安排。\n<\/li><li>\n<strong>前缀有序是每一步的依据<\/strong>。查找插入位置时，之所以从右向左比到第一个不大于新键的键就能停，是因为前缀已经有序：停住位置左侧的键都不大于新键，右侧已上移的键都不小于新
