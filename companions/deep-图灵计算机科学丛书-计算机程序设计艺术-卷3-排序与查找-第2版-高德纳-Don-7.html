静态排定」与「动态调整」，前提不同。<\/p>\n<p>概率估计本身影响结论。<span class=\"katex-inline\">p_j<\/span> 来自样本统计，样本不足时高频估计可能失真；按错误频率排定的次序，期望未必优于等概率。归一化是公式前提：<span class=\"katex-inline\">\\sum p_j=1<\/span>，概率和不为 1 时期权重量纲错乱。<\/p>\n<p>失败查找代价单独记账：成功按命中位置加权，失败走完全表固定 <span class=\"katex-inline\">N<\/span> 次。有些实现把失败判断前置（先看表尾标识或计数），失败路径可以提前结束；标准模型里失败仍是 <span class=\"katex-inline\">N<\/span> 次。批量查询共享扫描时，失败记录同样只遍历一遍。<\/p>\n<p>补充算例：<span class=\"katex-inline\">N=5<\/span>，<span class=\"katex-inline\">p=(0.4,0.3,0.15,0.1,0.05)<\/span> 已降序，<span class=\"katex-inline\">\\bar C=0.4+0.6+0.45+0.4+0.25=2.1<\/span>。反序摆放 <span class=\"katex-inline\">p=(0.05,0.1,0.15,0.3,0.4)<\/span> 时 <span class=\"katex-inline\">\\bar C=0.05+0.2+0.45+1.2+2.0=3.9<\/span>，差 1.8 次。均匀分布 <span class=\"katex-inline\">N=5<\/span> 成功 3 次，失败 5 次；齐普夫 <span class=\"katex-inline\">H_5\\approx2.283<\/span>，<span class=\"katex-inline\">\\bar C=5/2.283\\approx2.19<\/span>。<\/p>\n<p>顺序查找是后续检索结构的底层动作：拉链法链内核对、辅助键全表扫描，都是逐条比较。有序表上的二分把线性代价压到对数，但前提是先排序；散列平均常数次，前提是等值查询与均匀散列。各结构的代价都要放回自己的前提里比较。<\/p>\n<h2>再补充：概率假设与实现变体<\/h2>\n<p>加权公式要求概率归一化且稳定；样本估计有偏差时，最优次序只是近似。均匀分布是 <span class=\"katex-inline\">p_j=1/N<\/span> 的特例，齐普夫、楔形分布是另外两类典型。失败查找固定走完全表，不参与加权排列优化。<\/p>\n<p>实现变体有的在表尾放哨兵键，省去每轮边界判断；有的先读表尾标识快速判失败。这些是指令层面的优化，不改变成功 <span class=\"katex-inline\">(N+1)/2<\/span>、失败 <span class=\"katex-inline\">N<\/span> 的口径。链表里的顺序遍历同口径：沿指针逐条核对，位置序号即比较次数。<\/p>\n<p>静态最优排列只在表不常变时值得预先排定；频繁插入删除或频率漂移时，自组织前移规则更合适。两类方案对应不同更新假设，不能把静态降序结论套到动态表上。<\/p>\n<h2>再补充：概率假设、实现变体与静态动态分界<\/h2>\n<p>加权公式要求概率归一化且在考察期内稳定；样本频率估计有偏差时，降序排列只是近似最优。均匀分布是 <span class=\"katex-inline\">p_j=1/N<\/span> 的特例，齐普夫、楔形分布是另外两类典型。失败查找固定走完全表，不参与加权排列优化；把失败期望也按位置加权，会把不存在的命中位置计入公式。<\/p>\n<p>哨兵写法把边界判断并入比较循环：表尾预置与待查键不相等的标识，指针移到表尾即自然退出；链表版本每轮判断当前指针是否为空，省去数组哨兵。这些改动减少分支指令，不改变比较次数口径。记录宽度决定单次读取成本，键比较次数低不代表整体耗时短；记录很宽时，搬移与读取代价要另算。<\/p>\n<p>静态排序与自组织的分界在更新频率：表内容建表后基本不变，预先按概率降序排定；表频繁增删或访问频率随业务周期漂移，自组织前移规则把近期高频记录逐步推到前段，代价是每次命中付一次前移操作。静态方案不随时间调整，动态方案牺牲部分查询步骤换适应性，两者不能互相套用结论。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">N=5<\/span>、概率 <span class=\"katex-inline\">p=(0.4,0.3,0.15,0.1,0.05)<\/span> 的加权平均比较次数，并判断次序是否最优。\n<\/li><li>\n均匀分布成功与失败的比较次数各是多少？\n<\/li><li>\n相邻交换论证中 <span class=\"katex-inline\">\\Delta<\/span> 的符号由哪两项决定？\n<\/li><li>\n齐普夫分布相比均匀分布为何显著降低平均比较次数？\n<\/li><li>\n动态表为什么不能直接套用静态最优排列结论？\n<\/ol><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/计算机程序与设计艺术/图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版 (高德纳（Donald E.Knuth）著；贾洪峰译, (美) 克努特, (Knuth etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.324<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">顺序查找与静态最优排列：加权平均比较次数与频率降序最优<\/a><\/span><\/div><h1>二分查找与查找树：折半递推、二叉查找树退化与 B 树多路平衡<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch03（原书 §6.2.1 查找有序表、§6.2.4 多路树，PDF 第 324、383 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>顺序查找在有序表上仍逐条扫描，没有利用键的大小次序。需要回答：有序表上怎样每次比较舍弃一半候选；把比较关系组织成树以后，树高由什么决定，偏斜树为什么会退化；面向外部存储，多路平衡树怎样把树高控制在很小范围。这个概念串起二分查找、二叉查找树、平衡树与 B 树四条线索。<\/p>\n<h2>定义<\/h2>\n<p><strong>二分查找<\/strong>：在递增有序表中取中点比较，按 <span class=\"katex-inline\">K&lt;K_i<\/span>、<span class=\"katex-inline\">K=K_i<\/span>、<span class=\"katex-inline\">K&gt;K_i<\/span> 三种结果舍弃左段或右段，在剩余区间重复（PDF 第 324 页，书中二分过程称算法 B）。<\/p>\n<p><strong>区间双指针<\/strong>：<span class=\"katex-inline\">l<\/span>、<span class=\"katex-inline\">u<\/span> 标记当前候选区间下界与上界；中点由区间长度算出，指针随舍弃方向移动。<\/p>\n<p><strong>二叉查找树<\/strong>：结点左子树键小于根、右子树键大于根；查找从根沿分支下移，比较一次走一支。<\/p>\n<p><strong>B 树<\/strong>：面向外部存储的 <span class=\"katex-inline\">m<\/span> 阶多路平衡树；除根外每个结点至少 <span class=\"katex-inline\">\\lceil m/2\\rceil<\/span> 个子结点，根至少 2 个子结点，结点内键有序（PDF 第 383 页，1970 年拜尔和麦克赖特提出）。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">N=100<\/span>，二分查找至多 <span class=\"katex-inline\">\\lceil\\lg101\\rceil=7<\/span> 次。<strong>反例<\/strong>：表无序时，<span class=\"katex-inline\">K&gt;K_i<\/span> 不能排除右侧任何记录，折半依据不存在。<\/p>\n<h2>原理推导<\/h2>\n<p>记 <span class=\"katex-inline\">T(N)<\/span> 为长度 <span class=\"katex-inline\">N<\/span> 表上二分查找最坏比较次数。中点比较一次后，剩余区间长度不超过 <span class=\"katex-inline\">\\lfloor N/2\\rfloor<\/span>：<\/p>\n<div class=\"katex-block\">T(N)=1+T(\\lfloor N/2\\rfloor),\\quad T(1)=1.<\/div>\n<p><span class=\"katex-inline\">k<\/span> 步后区间长度 <span class=\"katex-inline\">N/2^k<\/span>，收缩到 1 个元素需 <span class=\"katex-inline\">k&gt;\\lg N<\/span>，得上界<\/p>\n<div class=\"katex-block\">T(N)\\le\\lceil\\lg(N+1)\\rceil.<\/div>\n<p>二叉查找树的查找路径长度等于树高；按随机键插入，树高期望 <span class=\"katex-inline\">O(\\lg N)<\/span>，但按已有序键依次插入会退化成右斜链，树高 <span class=\"katex-inline\">N<\/span>，查找退回 <span class=\"katex-inline\">O(N)<\/span>。平衡树通过旋转维持左右子树高度差；B 树把分支数提到 <span class=\"katex-inline\">m<\/span> 路，结点多键有序，树高约 <span class=\"katex-inline\">\\log_m N<\/span>，外部存储一次读一个结点（一页），少量页读取即可定位。<\/p>\n<p>二分实现有单指针、双指针等变体；均匀二分按区间长度奇偶取中点，不同变体的比较次数公式略有差别（PDF 第 328 页）。三分支比较（小于、等于、大于）可在命中时提前结束；两分支变体把等值判断留到区间收缩之后。查找成功与失败的路径长度分别统计：失败路径走到区间为空为止，成功路径在等值结点结束；两者的平均次数由表内键分布与查找概率共同决定，不能只报一个最坏上界。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：二分与二叉查找树要求键可比较、表或树有序；B 树面向块存储。\n<\/li><li>\n边界一：二分查找要求静态有序表；动态频繁插入时，维护有序表的移动成本要计入。\n<\/li><li>\n失败案例一：二叉查找树不做平衡控制，有序输入直接长成链，对数代价消失。\n<\/li><li>\n失败案例二：把 B 树的多路分支当成普通二叉树分析，树高公式不适用。\n<\/li><li>\n边界二：外部查找代价以页读取次数为主，结点大小按磁盘页设计；内存查找才以比较次数为主。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>二分查找 vs 二叉查找树<\/strong>：二分在数组区间上折半，树在结点分支上下移；两者比较次数同为对数，数组随机访问快但插入贵，树插入灵活但有结点开销。\n<\/li><li>\n<strong>平衡树 vs 偏斜树<\/strong>：平衡树控制高度差，偏斜树一侧过长；退化是查找树最主要的失效模式。\n<\/li><li>\n<strong>二叉树 vs B 树<\/strong>：二叉两支，B 树 <span class=\"katex-inline\">m<\/span> 支；B 树结点存多键、面向页块，树高更矮。\n<\/li><li>\n<strong>内部查找 vs 外部查找<\/strong>：内部以比较次数计；外部以页/块读取次数计，B 树按这个口径设计。\n<\/ul>\n<p><strong>常见误解<\/strong>：以为二叉查找树插入有序键也保持对数高度；不做平衡控制时有序输入长成斜链，查找退回 <span class=\"katex-inline\">O(N)<\/span>。另一个误解是把 B 树当普通二叉树分析：它 <span class=\"katex-inline\">m<\/span> 路分支、结点多键有序，树高公式是 <span class=\"katex-inline\">\\log_m N<\/span>，外部检索优化的是页读取次数而非内存比较。二分查找还要求静态有序表；频繁插入时维护数组次序的移动成本要算进总账，不能只看查找比较次数。<\/p>\n<h2>联系<\/h2>\n<p>前置：c08 顺序查找的线性基线、第 5 章排序产出的有序表。后继：c11 数字查找树按位分支，与二叉查找树的大小分支并列；c10 散列不依赖有序结构，用地址变换换 <span class=\"katex-inline\">O(1)<\/span> 平均代价；外部 B 树与 c07 外部排序共享按块访问介质的口径。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（二分查找与查找树：折半递推、二叉查找树退化与 B 树多路平衡）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：折半递推、查找树退化与 B 树高度控制<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把查找树类方法推到底，先往回追四层前提：<\/p>\n<ol><li>\n<strong>候选集合可按大小切分<\/strong>：二分与二叉树的分支依据是键的线性次序；无序集合一次比较不能排除一侧，折半无从做起。\n<\/li><li>\n<strong>每次比较后候选减半<\/strong>：中点比较把区间分成两段，舍弃一段，剩余规模约一半；递推 <span class=\"katex-inline\">T(N)=1+T(N/2)<\/span> 由此而来。\n<\/li><li>\n<strong>树结构保存比较关系<\/strong>：查找路径是结点分支序列；树高决定最长路径，退化与平衡都是围绕树高展开。\n<\/li><li>\n<strong>外部介质按块访问<\/strong>：B 树优化的是页读取次数，不是内存比较次数；结点大小对齐磁盘页，分支数提高以压矮树高。\n<\/ol>\n<p>依赖链方向：有序表 → 中点比较舍弃一半 → 递推解出 <span class=\"katex-inline\">\\lceil\\lg(N+1)\\rceil<\/span> → 二叉查找树路径即树高 → 偏斜退化为链 → 平衡旋转 / B 树多路压高。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：二分查找的区间动作<\/h3>\n<p>置 <span class=\"katex-inline\">l=1<\/span>，<span class=\"katex-inline\">u=N<\/span>。中点 <span class=\"katex-inline\">i\\leftarrow\\lfloor(l+u)/2\\rfloor<\/span> 附近；比较 <span class=\"katex-inline\">K<\/span> 与 <span class=\"katex-inline\">K_i<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">K&lt;K_i<\/span>：<span class=\"katex-inline\">u\\leftarrow i-1<\/span>，舍弃右段；\n<\/li><li>\n<span class=\"katex-inline\">K=K_i<\/span>：成功；\n<\/li><li>\n<span class=\"katex-inline\">K&gt;K_i<\/span>：<span class=\"katex-inline\">l\\leftarrow i+1<\/span>，舍弃左段。\n<p>区间为空即失败。<\/p>\n<\/ul>\n<h3>第二步：递推建立<\/h3>\n<p>剩余区间长度不超过 <span class=\"katex-inline\">\\lfloor N/2\\rfloor<\/span>。记 <span class=\"katex-inline\">T(N)<\/span> 最坏比较次数：<\/p>\n<div class=\"katex-block\">T(N)=1+T(\\lfloor N/2\\rfloor),\\quad T(1)=1.<\/div>\n<h3>第三步：递推展开<\/h3>\n<p>第 1 次比较后长度 <span class=\"katex-inline\">\\le N/2<\/span>；第 2 次后 <span class=\"katex-inline\">\\le N/4<\/span>；第 <span class=\"katex-inline\">k<\/span> 次后 <span class=\"katex-inline\">\\le N/2^k<\/span>。长度降到不足 1 个元素时判定结束，条件 <span class=\"katex-inline\">N/2^k&lt;1<\/span>，即 <span class=\"katex-inline\">k&gt;\\lg N<\/span>。整理<\/p>\n<div class=\"katex-block\">T(N)\\le\\lceil\\lg(N+1)\\rceil.<\/div>\n<h3>第四步：数值对照<\/h3>\n<p><span class=\"katex-inline\">N=10<\/span>：<span class=\"katex-inline\">\\lceil\\lg11\\rceil=4<\/span>；<span class=\"katex-inline\">N=100<\/span>：<span class=\"katex-inline\">\\lceil\\lg101\\rceil=7<\/span>；<span class=\"katex-inline\">N=1000<\/span>：10；<span class=\"katex-inline\">N=10^6<\/span>：20。顺序查找对应 <span class=\"katex-inline\">(N+1)/2<\/span>，<span class=\"katex-inline\">N=10^6<\/span> 时约 50 万次，差距按对数与线性拉开。<\/p>\n<h3>第五步：二叉查找树结构<\/h3>\n<p>根结点键 <span class=\"katex-inline\">K_r<\/span>：左子树所有键 <span class=\"katex-inline\">&lt;K_r<\/span>，右子树所有键 <span class=\"katex-inline\">&gt;K_r<\/span>。查找从根开始，比较后沿对应子树下移；命中路径长度即所在层数，失败走到空分支。<\/p>\n<h3>第六步：退化情形<\/h3>\n<p>按已有序键依次插入：新键最大，每次落到最右分支，树长成右斜链。<span class=\"katex-inline\">N<\/span> 个结点链高 <span class=\"katex-inline\">N<\/span>，查找最坏 <span class=\"katex-inline\">N<\/span> 次，退回顺序扫描。随机插入时左右子树规模较均衡，树高期望 <span class=\"katex-inline\">O(\\lg N)<\/span>；输入次序偏斜是退化主因。<\/p>\n<h3>第七步：平衡控制<\/h3>\n<p>平衡树在插入后检查子树高度差，超出阈值时通过旋转把高侧结点转到低侧，恢复高度平衡；旋转不改树的中序次序。B 树换思路：每个结点容纳 <span class=\"katex-inline\">m-1<\/span> 个键、<span class=\"katex-inline\">m<\/span> 个子结点，除根外结点至少 <span class=\"katex-inline\">\\lceil m/2\\rceil<\/span> 个子结点，保证树高 <span class=\"katex-inline\">\\log_m N<\/span> 量级；<span class=\"katex-inline\">m<\/span> 取页大小能容纳的键数，一次磁盘读入一个结点。<\/p>\n<h3>第八步：B 树性质核对<\/h3>\n<p>书中给出 <span class=\"katex-inline\">m<\/span> 阶 B 树条件：(i) 每个结点最多 <span class=\"katex-inline\">m<\/span> 个子结点；(ii) 除根和叶子外至少 <span class=\"katex-inline\">\\lceil m/2\\rceil<\/span> 个子结点；(iii) 根至少 2 个子结点（除非是叶子）（PDF 第 383 页）。这些性质把结点填充度与树高同时约束住。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：二分次数<\/h3>\n<p><span class=\"katex-inline\">N=16<\/span>：<span class=\"katex-inline\">\\lceil\\lg17\\rceil=5<\/span> 次；顺序查找平均 8.5 次。<span class=\"katex-inline\">N=1024<\/span>：二分 10 次，顺序平均 512.5 次。<\/p>\n<h3>算例 2：斜链退化<\/h3>\n<p>有序键 <span class=\"katex-inline\">1,2,\\dots,N<\/span> 依次插入二叉查找树：第 <span class=\"katex-inline\">j<\/span> 个结点挂在最右链上，树高 <span class=\"katex-inline\">N<\/span>；查找 <span class=\"katex-inline\">N<\/span> 号键要 <span class=\"katex-inline\">N<\/span> 次比较。平衡插入后树高约 <span class=\"katex-inline\">\\lg N<\/span>。<\/p>\n<h3>算例 3：B 树分支效果<\/h3>\n<p><span class=\"katex-inline\">N=10^6<\/span>，二叉树高约 20；<span class=\"katex-inline\">m=100<\/span> 路 B 树高约 <span class=\"katex-inline\">\\log_{100}10^6=3<\/span>，即定位记录约 3 次页读取。外部存储一次页读取成本远高于内存比较，压矮树高比减少比较次数更关键。<\/p>\n<h3>算例 4：中点变体<\/h3>\n<p>均匀二分按区间长度取中点；奇数偶数长度处理略有差别，书中均匀二分变体在区间长度奇偶时选不同中点（PDF 第 328 页），比较次数公式按变体分别给出。<\/p>\n<h3>算例 5：等值键<\/h3>\n<p>等值密集时，二叉树把等值键挤到一侧子树，该侧枝叶膨胀；等值记录需要单独挂接规则，否则树高失控。<\/p>\n<h3>算例 6：插入维护成本<\/h3>\n<p>二分基于静态有序数组；频繁插入要移动后续记录，动态场景下查找树或 B 树把插入成本分散到结构更新中。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>表无序就做折半<\/strong>：<span class=\"katex-inline\">K&gt;K_i<\/span> 不能排除右侧记录，舍弃一半没有依据，算法可能漏掉目标。\n<\/li><li>\n<strong>二叉查找树不做平衡<\/strong>：有序输入长成链，对数代价退回线性；平衡控制或多路结构是必要补救。\n<\/li><li>\n<strong>把 B 树按二叉树分析<\/strong>：结点 <span class=\"katex-inline\">m<\/span> 路分支、多键有序，高度公式不是 <span class=\"katex-inline\">\\lg N<\/span>；口径错位会低估外部检索效率。\n<\/li><li>\n<strong>外部查找仍按比较次数优化<\/strong>：外部瓶颈是页读取次数，B 树用结点大小与分支数压高度，单纯减少内存比较不解决介质访问瓶颈。\n<\/ul>\n<h2>补足推导：查找结构的代价谱系<\/h2>\n<p>顺序查找 <span class=\"katex-inline\">O(N)<\/span>：不要求有序，结构最简单；二分查找 <span class=\"katex-inline\">O(\\lg N)<\/span>：要求有序静态表；二叉/平衡查找树 <span class=\"katex-inline\">O(\\lg N)<\/span>：支持动态插入；B 树 <span class=\"katex-inline\">O(\\log_m N)<\/span> 次页读取：面向外部块存储；散列 <span class=\"katex-inline\">O(1)<\/span> 平均：不依赖有序，用地址变换换常数代价。各结构的前提（有序、静态、块介质、键分布）不同，选择时先核对前提再比量级。第 6.3 节数字查找树与本节大小分支不同：它按二进制位取值分支，Patricia 再压缩公共前缀。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n二分查找每次比较后候选区间长度最多剩多少？递推式怎么写？\n<\/li><li>\n<span class=\"katex-inline\">\\lceil\\lg(N+1)\\rceil<\/span> 这个上界由什么条件推出？\n<\/li><li>\n二叉查找树什么输入次序下退化成链？退化后查找代价是多少？\n<\/li><li>\nB 树的 <span class=\"katex-inline\">m<\/span> 个子结点条件怎样保证树高？为什么外部存储偏爱多路树？\n<\/li><li>\n二分、二叉树、B 树各自的前提条件是什么？\n<\/ol>\n<h2>扩展推演：插入次序、平衡手段与外部页读取<\/h2>\n<p>二叉查找树的高度由插入次序决定，不只由结点数决定。随机次序下左右子树规模接近，期望高度 <span class=\"katex-inline\">O(\\lg N)<\/span>；有序、逆序或偏斜次序把树长成链。同样 <span class=\"katex-inline\">N<\/span> 个结点，平衡树高 <span class=\"katex-inline\">\\lg N<\/span>，斜链高 <span class=\"katex-inline\">N<\/span>，查找代价差一个量级。平衡树在插入后检查高度差，超阈值时旋转：旋转不改中序次序，只调整父子关系，把高侧结点转下来。<\/p>\n<p>B 树面向外部存储，结点大小对齐磁盘页。<span class=\"katex-inline\">m<\/span> 取一页能容纳的键数，一次读入一个结点；树高 <span class=\"katex-inline\">\\log_m N<\/span>，定位记录只需少量页读取。<span class=\"katex-inline\">N=10^6<\/span>、<span class=\"katex-inline\">m=100<\/span> 时树高约 3，即三次页访问；二叉树同规模高度约 20 次内存比较。外部场景页读取成本远高于内存比较，压矮树高比减少比较次数更关键。<\/p>\n<p>二分查找基于静态有序数组：随机访问中点快，但插入要移动后续记录。动态场景用二叉树或 B 树把更新成本分散到结构维护；只查不增删时，数组二分最省结构开销。均匀二分在区间奇偶长度时取中点规则不同，比较次数公式按变体分别给出（PDF 第 328 页）。<\/p>\n<p>补充算例：<span class=\"katex-inline\">N=64<\/span>，<span class=\"katex-inline\">\\lceil\\lg65\\rceil=7<\/span> 次二分；顺序平均 32.5 次。<span class=\"katex-inline\">N=16<\/span> 二分 5 次，顺序平均 8.5 次。斜链情形下 <span class=\"katex-inline\">N=16<\/span> 查找最坏 16 次，退回顺序扫描。等值键密集时，BST 把等值挤到一侧，需要单独挂接规则，否则该侧枝叶膨胀。<\/p>\n<p>查找结构谱系收束：顺序 <span class=\"katex-inline\">O(N)<\/span> 无前提；二分 <span class=\"katex-inline\">O(\\lg N)<\/span> 要有序静态表；BST/平衡树 <span class=\"katex-inline\">O(\\lg N)<\/span> 支持动态；B 树 <span class=\"katex-inline\">O(\\log_m N)<\/span> 次页读；散列 <span class=\"katex-inline\">O(1)<\/span> 平均等值。选择前先核对前提，再比量级。<\/p>\n<h2>再补充：指针变体与外部结构边界<\/h2>\n<p>二分查找有单指针、双指针等变体；均匀二分按区间长度奇偶取中点，不同变体的比较次数公式略有差别（PDF 第 328 页）。三分支比较（小于、等于、大于）可提前命中；两分支变体把等值判断留到区间收缩后。<\/p>\n<p>二叉查找树插入有序键长成链，是不做平衡控制的必然结果；平衡树旋转恢复高度，但旋转不改中序次序。B 树结点多键、多路分支，页大小对齐外部介质；它平衡的是子树填充度与高度，不是二叉意义上的左右对称。<\/p>\n<p>外部查找优化目标是页读取次数，不是内存比较；把 B 树当二叉树算高度会得到错误量级。动态数组上的二分要付插入移动成本，频繁更新场景换树结构更合适。<\/p>\n<h2>再补充：变体口径、退化修复与外部结构边界<\/h2>\n<p>二分变体的差别在中点选取与等值判断位置：单指针维护候选区间上下界，双指针分别从两端向中间收；均匀二分按区间长度的奇偶取中点，避免边界指针反复移动。三分支比较把「等于」作为独立出口，命中即停；两分支变体把等值留到最后一次比较。成功与失败路径分开计数，失败路径走到区间为空，成功路径在等值结点结束。<\/p>\n<p>二叉查找树退化的修复手段是平衡控制：插入后检查左右子树高度差，超出阈值时通过旋转把偏高一侧的结点转到另一侧；旋转只改变树形，不改变中序遍历次序。平衡树维护的是高度差，不是左右结点数完全相等。B 树的平衡对象是子树填充度与高度：除根外结点至少半满，分裂时把多键结点拆开，兄弟合并发生在删除之后。<\/p>\n<p>外部查找的优化目标是页读取次数：结点大小对齐磁盘页，一次读取带入多个键与子指针；把 B 树当二叉树算高度会得到错误量级。动态数组上的二分要付插入移动成本，频繁更新场景换树结构更合适；散列把有序性全部放弃，换取平均常数级等值定位，范围与有序遍历则交还给有序结构。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">N=64<\/span> 的二分查找最坏比较次数，并与顺序查找平均次数对照。\n<\/li><li>\n为什么随机插入的二叉查找树高度期望为 <span class=\"katex-inline\">O(\\lg N)<\/span>，有序插入却不是？\n<\/li><li>\nB 树结点最少子结点数条件起什么作用？去掉会怎样？\n<\/li><li>\n外部查找为什么以页读取次数而不是比较次数为优化目标？\n<\/li><li>\n散列方法与本节查找树在前提上的根本差别是什么？\n<\/ol><\/div><\/details>", "c10": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/计算机程序与设计艺术/图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版 (高德纳（Donald E.Knuth）著；贾洪峰译, (美) 克努特, (Knuth etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.414<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">二分查找与查找树：折半递推、二叉查找树退化与 B 树多路平衡<\/a><\/span><\/div><h1>散列查找：散列函数、拉链法与线性探查，装填因子与探查长度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch04（原书 §6.4 散列，PDF 第 413–418 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>比较类查找沿大小关系分支，代价随对数增长；散列换一条路：用键的算术变换直接算出表地址，期望把定位压到常数次。需要解决的困难是：不同键可能映到同一地址（冲突），冲突怎样挂接；表装多满时平均探查次数怎样变化；散列函数要满足什么性质才不会把同类键聚到一起。<\/p>\n<h2>定义<\/h2>\n<p><strong>散列函数<\/strong>：把键 <span class=\"katex-inline\">K<\/span> 变换成表地址 <span class=\"katex-inline\">h(K)<\/span> 的函数。好的散列与机器无关、与数据分布无关，使不同键尽量落到不同地址（PDF 第 413 页）。<\/p>\n<p><strong>装填因子<\/strong>：<span class=\"katex-inline\">\\alpha=N/M<\/span>，<span class=\"katex-inline\">N<\/span> 个键、<span class=\"katex-inline\">M<\/span> 个表槽；衡量表的装满程度。<\/p>\n<p><strong>拉链法<\/strong>：同一散列地址的键串成链表；先散列定位，再在链上顺序核对（PDF 第 414 页，书中拉链查找插入过程称算法 C）。<\/p>\n<p><strong>线性探查<\/strong>：开放定址法的一种；冲突后按固定步长 <span class=\"katex-inline\">h(K),h(K)+1,\\dots<\/span> 依次探查，直到命中或找到空槽（PDF 第 418 页）。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">\\alpha=1<\/span> 时拉链法成功约 <span class=\"katex-inline\">1+\\alpha/2=1.5<\/span> 次、失败约 <span class=\"katex-inline\">1+\\alpha=2<\/span> 次。<strong>反例<\/strong>：散列函数把所有键映到同一槽，拉链退化成单链表，平均核对 <span class=\"katex-inline\">N/2<\/span> 次。<\/p>\n<h2>原理推导<\/h2>\n<p>拉链法假定散列均匀，<span class=\"katex-inline\">N<\/span> 个键独立落到 <span class=\"katex-inline\">M<\/span> 槽，某槽链长期望 <span class=\"katex-inline\">\\alpha<\/span>。失败查找沿链核对全部结点，平均 <span class=\"katex-inline\">U_{\\text{链}}\\approx1+\\alpha<\/span>；成功命中键在链内位置均匀，平均 <span class=\"katex-inline\">S_{\\text{链}}\\approx1+\\alpha/2<\/span>。<\/p>\n<p>线性探查的经典平均结果：<\/p>\n<div class=\"katex-block\">S_{\\text{探}}\\approx\\tfrac12\\left(1+\\frac{1}{1-\\alpha}\\right),\\quad\\\\U_{\\text{探}}\\approx\\tfrac12\\left(1+\\frac{1}{(1-\\alpha)^2}\\right).<\/div>\n<p>失败公式分母是 <span class=\"katex-inline\">(1-\\alpha)^2<\/span>：失败要穿过一整段连续占用槽，聚集段自我加长。<span class=\"katex-inline\">\\alpha<\/span> 接近 1 时探查长度趋于无穷，所以开放定址法必须控制装填因子、满前扩容重散列。<\/p>\n<p>多字符键可组合后取模；卡特和韦格曼 1977 年给出各字符独立散列后相加再模 <span class=\"katex-inline\">M<\/span> 的形式 <span class=\"katex-inline\">h(K)=(h_1(x_1)+\\cdots+h_l(x_l))\\bmod M<\/span>（PDF 第 413 页，式 (9)）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：散列均匀、键可做算术变换；等值查找为主，不支持范围顺序检索。\n<\/li><li>\n边界一：<span class=\"katex-inline\">\\alpha&gt;1<\/span> 拉链法仍可工作，链表拉长；开放定址法 <span class=\"katex-inline\">\\alpha<\/span> 必须小于 1，高装填时探查长度恶化。\n<\/li><li>\n失败案例一：散列函数按键的部分位或规律取值，同类键聚集到少数槽，局部链长偏离期望。\n<\/li><li>\n失败案例二：不设冲突处理，假定散列必然不冲突；键空间大于地址空间，冲突是必然事件。\n<\/li><li>\n边界二：散列表不保留键的大小次序，范围查询、有序遍历要另用结构。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>拉链 vs 开放定址<\/strong>：拉链额外链结点空间，<span class=\"katex-inline\">\\alpha<\/span> 可超过 1；探查法记录压在基表内，受装填因子上限约束。\n<\/li><li>\n<strong>散列 vs 二分<\/strong>：散列平均 <span class=\"katex-inline\">O(1)<\/span> 但只支持等值；二分 <span class=\"katex-inline\">O(\\lg N)<\/span> 且服务有序检索。\n<\/li><li>\n<strong>散列函数 vs 加密哈希<\/strong>：散列面向地址分布均匀，不要求不可逆或抗碰撞强度；两者目标不同。\n<\/li><li>\n<strong>成功 vs 失败探查<\/strong>：成功沿链/段的一部分命中，失败走完全程；开放定址失败代价随 <span class=\"katex-inline\">\\alpha<\/span> 上升快于成功。\n<\/ul>\n<p><strong>常见误解<\/strong>：把散列说成「查找时间与 <span class=\"katex-inline\">N<\/span> 无关」；这个常数平均以散列均匀、<span class=\"katex-inline\">\\alpha<\/span> 受控为前提。函数偏斜时同类键聚到一槽，链表拉长，代价退回顺序扫描。另一个误解是开放定址表装到接近满载仍可用：聚集段连成整片，失败探查趋于无穷，必须在阈值前扩容重散列。散列也不保留大小次序，范围查询、有序遍历不能靠它完成；把散列哈希与加密哈希混为一谈也不对，两者目标不同。删除环节两种路线差别明显：拉链法摘去链结点即可，开放定址法不能简单置空，否则截断后续探查链，需要墓碑标记或整段重散列；扩容到两倍槽位后旧键按新表重新分布，聚集段拆断，装填因子回到约一半。<\/p>\n<h2>联系<\/h2>\n<p>前置：c08 链内顺序核对、c09 查找结构的前提谱系。后继：c12 辅助键检索可在属性编码上建散列；数字查找 c11 与散列同属不依赖全局有序的路线，但分支依据是位序列而不是地址变换。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（散列查找：散列函数、拉链法与线性探查，装填因子与探查长度）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：装填因子、拉链长度与线性探查聚集公式<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把散列代价推清楚，先往回追四层前提：<\/p>\n<ol><li>\n<strong>地址由变换直接给出<\/strong>：散列不再沿大小关系分支，<span class=\"katex-inline\">h(K)<\/span> 把键映到槽位；定位步数与 <span class=\"katex-inline\">N<\/span> 不呈线性关系。\n<\/li><li>\n<strong>冲突不可避免<\/strong>：键空间大于槽位数，多键同槽是常态；冲突处理路线分拉链与开放定址。\n<\/li><li>\n<strong>均匀性决定平均公式<\/strong>：探查长度的平均结果假定散列随机均匀；函数偏斜时局部聚集，公式不再代表实际。\n<\/li><li>\n<strong>装填因子是统一标尺<\/strong>：<span class=\"katex-inline\">\\alpha=N/M<\/span> 同时进入拉链与探查公式，表的装满程度决定代价恶化速度。\n<\/ol>\n<p>依赖链方向：键 → 散列函数定位 → 冲突挂接（链 / 探查）→ 按 <span class=\"katex-inline\">\\alpha<\/span> 算平均长度 → 高装填下聚集恶化 → 扩容重散列控制 <span class=\"katex-inline\">\\alpha<\/span>。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：散列函数的两条性质<\/h3>\n<p>书中性质 (a)：与机器无关；性质 (b)：与数据相关无关。真正随机的键可只提取部分二进制位；实践中函数要依赖键全部位，避免同类键落同槽。多字符键先组合再取模，<span class=\"katex-inline\">h(K)=(h_1(x_1)+\\cdots+h_l(x_l))\\bmod M<\/span>（PDF 第 413 页，式 (9)）。<\/p>\n<h3>第二步：拉链法的链长期望<\/h3>\n<p><span class=\"katex-inline\">N<\/span> 键独立均匀落到 <span class=\"katex-inline\">M<\/span> 槽，每槽键数期望 <span class=\"katex-inline\">N/M=\\alpha<\/span>。某槽长度为 <span class=\"katex-inline\">L<\/span>：<\/p>\n<ul><li>\n失败查找：散列到该槽后核对链上全部 <span class=\"katex-inline\">L<\/span> 个结点才确认不存在，平均链长 <span class=\"katex-inline\">\\alpha<\/span>，加一次槽定位：<span class=\"katex-inline\">U_{\\text{链}}\\approx1+\\alpha<\/span>。\n<\/li><li>\n成功查找：命中键在链上位置均匀，长度 <span class=\"katex-inline\">L<\/span> 的链平均位置 <span class=\"katex-inline\">(L+1)/2<\/span>，全表平均 <span class=\"katex-inline\">S_{\\text{链}}\\approx1+\\alpha/2<\/span>。\n<\/ul>\n<h3>第三步：拉链法数值对照<\/h3>\n<p><span class=\"katex-inline\">\\alpha=0.5<\/span>：成功 1.25，失败 1.5；<span class=\"katex-inline\">\\alpha=1<\/span>：成功 1.5，失败 2；<span class=\"katex-inline\">\\alpha=2<\/span>：成功 2，失败 3。<span class=\"katex-inline\">\\alpha&gt;1<\/span> 拉链仍可用，代价随链长线性上升。<\/p>\n<h3>第四步：线性探查的探查序列<\/h3>\n<p>冲突后探查 <span class=\"katex-inline\">h(K),(h(K)+1)\\bmod M,\\dots<\/span>。占用槽连成聚集段；新键散列到段内并入该段，段越长后续穿过它的概率越高，段自我加长。<\/p>\n<h3>第五步：成功与失败公式<\/h3>\n<p>Knuth 给出的经典平均结果：<\/p>\n<div class=\"katex-block\">S_{\\text{探}}\\approx\\tfrac12\\left(1+\\frac{1}{1-\\alpha}\\right),\\quad\\\\U_{\\text{探}}\\approx\\tfrac12\\left(1+\\frac{1}{(1-\\alpha)^2}\\right).<\/div>\n<p>成功面对已插入键，穿过所在段的一部分；失败要穿过整段占用槽找空槽，所以失败分母是 <span class=\"katex-inline\">(1-\\alpha)^2<\/span>，恶化更快。<\/p>\n<h3>第六步：高装填恶化数值<\/h3>\n<p><span class=\"katex-inline\">\\alpha=0.5<\/span>：成功 1.5，失败 2.5；<span class=\"katex-inline\">\\alpha=0.75<\/span>：成功 2.5，失败 6.5；<span class=\"katex-inline\">\\alpha=0.9<\/span>：成功 5.5，失败 50.5；<span class=\"katex-inline\">\\alpha\\to1<\/span> 时失败探查趋于无穷。开放定址表必须在 <span class=\"katex-inline\">\\alpha<\/span> 到阈值前扩容、重散列。<\/p>\n<h3>第七步：聚集与二次聚集<\/h3>\n<p>线性探查的相邻槽聚集称一级聚集；不同散列键落到同一探查段会合并拉长。改换步长（双散列等）可减缓聚集，但不改变「失败穿过整段」的结构。<\/p>\n<h3>第八步：散列的检索边界<\/h3>\n<p>散列只回答「键是否在表中」，不保留大小次序；范围查询（键在某区间）不能靠散列定位，有序遍历要配合其他结构。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：拉链法 <span class=\"katex-inline\">N=100,M=20<\/span><\/h3>\n<p><span class=\"katex-inline\">\\alpha=5<\/span>。成功约 <span class=\"katex-inline\">1+2.5=3.5<\/span> 次，失败约 6 次；链表较长，链内顺序核对成为主代价。 <span class=\"katex-inline\">N=100,M=100<\/span>：<span class=\"katex-inline\">\\alpha=1<\/span>，成功 1.5，失败 2。<\/p>\n<h3>算例 2：探查法临界点<\/h3>\n<p><span class=\"katex-inline\">\\alpha=0.8<\/span>：成功 <span class=\"katex-inline\">\\tfrac12(1+5)=3<\/span>，失败 <span class=\"katex-inline\">\\tfrac12(1+25)=13<\/span>；<span class=\"katex-inline\">\\alpha=0.95<\/span>：成功 10.5，失败 100.5。扩容阈值通常设在 0.7–0.8 附近。<\/p>\n<h3>算例 3：散列偏斜失败<\/h3>\n<p>函数只取键末位，十进制键同类聚集；末位相同的键全挤一槽，该链长远超 <span class=\"katex-inline\">\\alpha<\/span> 期望，其他槽空置。均匀假设被破坏，平均公式失效。<\/p>\n<h3>算例 4：拉链结点空间<\/h3>\n<p>拉链每个冲突键需要链结点指针；探查法不另设结点，但基表要预留空槽。空间口径不同：<span class=\"katex-inline\">\\alpha<\/span> 高时拉链省槽位费结点，探查省结点费槽位。<\/p>\n<h3>算例 5：等值与范围<\/h3>\n<p>按学号散列可定位某学生；「查 2003–2005 级学生」是范围查询，散列地址不保留年级次序，要遍历全表或另建索引。<\/p>\n<h3>算例 6：重散列<\/h3>\n<p>表扩容到 <span class=\"katex-inline\">2M<\/span> 后，旧键按新表槽位重新散列；<span class=\"katex-inline\">\\alpha<\/span> 回到约 0.5，聚集段拆断，探查长度回落。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>散列函数退化为常数<\/strong>：所有键同槽，拉链退化为长度 <span class=\"katex-inline\">N<\/span> 的单链，平均 <span class=\"katex-inline\">N/2<\/span> 次；均匀性是 <span class=\"katex-inline\">O(1)<\/span> 代价的前提。\n<\/li><li>\n<strong>不设冲突处理<\/strong>：多键同槽无处挂接；键空间大于地址空间，冲突必然发生，挂接规则不可省。\n<\/li><li>\n<strong>开放定址表放到 <span class=\"katex-inline\">\\alpha\\to1<\/span><\/strong>：聚集段连成整片，失败探查爆炸；必须按阈值扩容，不能等装满再处理。\n<\/li><li>\n<strong>用散列做范围检索<\/strong>：地址变换不保留次序，区间键分散在全表，散列无法支持有序遍历。\n<\/ul>\n<h2>补足推导：散列与查找树的代价分工<\/h2>\n<p>散列平均常数次探查，前提是等值查询、散列均匀；二叉树/B 树 <span class=\"katex-inline\">O(\\lg N)<\/span> 或 <span class=\"katex-inline\">O(\\log_m N)<\/span>，支持有序与范围检索。实际系统常混合：主键散列定位，属性索引另建有序树或倒排。拉链法链内顺序查找回到 c08 的逐条核对；链表越长，散列退化为顺序扫描的程度越高。散列性能分析的核心量是装填因子，所有探查长度公式都从 <span class=\"katex-inline\">\\alpha<\/span> 展开。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n散列函数两条性质是什么？同类键聚集为什么破坏平均公式？\n<\/li><li>\n装填因子 <span class=\"katex-inline\">\\alpha<\/span> 怎样定义？拉链成功、失败公式各是什么？\n<\/li><li>\n线性探查成功与失败公式的分母为什么不同？失败恶化为什么更快？\n<\/li><li>\n<span class=\"katex-inline\">\\alpha<\/span> 接近 1 时开放定址表出现什么现象？应对措施是什么？\n<\/li><li>\n散列表为什么不适合范围查询？\n<\/ol>\n<h2>扩展推演：散列函数设计、聚集类型与扩容时机<\/h2>\n<p>散列函数要把键的全部二进制位用上，避免同类键落同槽。除留余数法取模 <span class=\"katex-inline\">M<\/span>，<span class=\"katex-inline\">M<\/span> 选质数可降低规律性键的聚集；乘法散列乘常数后取小数部分；多字符键先各字符独立散列再相加模 <span class=\"katex-inline\">M<\/span>（PDF 第 413 页，式 (9)）。函数偏斜时，平均公式的均匀假设失效，局部链长或段长偏离期望，这比 <span class=\"katex-inline\">\\alpha<\/span> 偏高更难从公式上预判。<\/p>\n<p>一级聚集是线性探查中相邻占用槽连成段；二级聚集指不同散列键落进同一探查段，合并拉长。改换探查步长（双散列用第二个散列值定步长）可减缓二级聚集，但失败仍要穿过占用段，结构没有变。拉链法不产生探查段，冲突键只在各自链内排队。<\/p>\n<p>扩容时机：开放定址表 <span class=\"katex-inline\">\\alpha<\/span> 到 0.7–0.8 区间就要准备重散列；等到 <span class=\"katex-inline\">\\alpha\\to1<\/span>，失败探查已经爆炸。扩容到两倍槽位后旧键按新表重新散列，聚集段拆断，<span class=\"katex-inline\">\\alpha<\/span> 回到约 0.5。拉链法 <span class=\"katex-inline\">\\alpha<\/span> 可超过 1，但链长随 <span class=\"katex-inline\">\\alpha<\/span> 线性增长，<span class=\"katex-inline\">\\alpha<\/span> 过高同样要扩槽。<\/p>\n<p>补充算例：<span class=\"katex-inline\">N=200,M=50<\/span>，<span class=\"katex-inline\">\\alpha=4<\/span>，拉链成功 <span class=\"katex-inline\">1+2=3<\/span> 次，失败 5 次。探查法在 <span class=\"katex-inline\">\\alpha=0.7<\/span>：成功 <span class=\"katex-inline\">\\tfrac12(1+3.33)=2.17<\/span>，失败 <span class=\"katex-inline\">\\tfrac12(1+11.1)=6.06<\/span>；<span class=\"katex-inline\">\\alpha=0.8<\/span>：成功 3，失败 13；<span class=\"katex-inline\">\\alpha=0.9<\/span>：成功 5.5，失败 50.5。失败公式 <span class=\"katex-inline\">(1-\\alpha)^{-2}<\/span> 在高装填时增长远快于成功的 <span class=\"katex-inline\">(1-\\alpha)^{-1}<\/span>。<\/p>\n<p>散列只支持等值：区间键分散在全表，有序遍历要另建结构。加密哈希要求不可逆与抗碰撞，散列要求地址均匀，两者指标不同，不能互相替代。拉链链内顺序查找回到 c08 的逐条核对，链越长散列越接近顺序扫描。<\/p>\n<h2>再补充：冲突处理选型与性能边界<\/h2>\n<p>拉链法适合 <span class=\"katex-inline\">\\alpha<\/span> 波动大、允许额外链结点的场景；开放定址省结点空间，但 <span class=\"katex-inline\">\\alpha<\/span> 必须压住，高装填探查恶化。两种路线的平均公式都以散列均匀为前提；函数偏斜时先修函数，调装填因子不能解决聚集。<\/p>\n<p>删除操作在探查法中不能简单置空，否则会截断后续探查链；需要墓碑标记或整段重散列。拉链法删除链结点直接摘链，处理更简单。重散列扩容后，旧键按新槽位重新分布，聚集段拆断。<\/p>\n<p>散列不支持范围与有序遍历；等值定位快，区间查询要另建有序结构。散列函数与加密哈希目标不同：前者求地址均匀，后者求不可逆与抗碰撞。链内顺序查找回到逐条核对，链长是散列退化程度的直接指标。<\/p>\n<h2>边界补充<\/h2>\n<p>散列平均公式以函数均匀、装填因子受控为前提；函数偏斜时先修函数，调装填因子补不回聚集。拉链法适合 <span class=\"katex-inline\">\\alpha<\/span> 波动大、允许额外链结点的场景；开放定址省结点空间，但 <span class=\"katex-inline\">\\alpha<\/span> 必须压住，高装填探查恶化。删除上两种路线差别明显：拉链摘链即可，探查法不能简单置空，否则截断后续探查链，需墓碑标记或整段重散列。扩容到两倍槽位后旧键按新槽位重新分布，聚集段拆断，<span class=\"katex-inline\">\\alpha<\/span> 回到约一半。散列只服务等值，不支持范围与有序遍历；散列函数求地址均匀，加密哈希求不可逆与抗碰撞，指标不能互套。链内顺序查找回到逐条核对，链长是散列退化程度的直接指标。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n<span class=\"katex-inline\">N=200,M=50<\/span>，拉链法成功与失败平均次数约为多少？\n<\/li><li>\n线性探查 <span class=\"katex-inline\">\\alpha=0.7<\/span> 时成功、失败探查次数各约多少？\n<\/li><li>\n一级聚集怎样自我加长？双散列改换步长缓解的是什么？\n<\/li><li>\n拉链与开放定址在空间占用上各有什么特点？\n<\/li><li>\n散列与二分查找各自支持什么查询类型？前提差别在哪？\n<\/ol><\/div><\/details>", "c11": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/计算机程序与设计艺术/图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版 (高德纳（Donald E.Knuth）著；贾洪峰译, (美) 克努特, (Knuth etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.397<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">二分查找与查找树：折半递推、二叉查找树退化与 B 树多路平衡<\/a><\/span><\/div><h1>数字查找与 Patricia 树：按位分支、前缀压缩与 SKIP 字段<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch04（原书 §6.3 数字查找，PDF 第 397 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>比较类查找看整键大小，数字查找换依据：按键的二进制位逐层分支。键是位串时，前缀相同的键会在树上共用一段路径；朴素数字树把单支中间结点也逐层展开，树高被公共前缀拉长。Patricia 树用 SKIP 字段跳过连续相同位，把单支结点压掉，解决前缀冗余问题。这个概念讲清按位分支规则、压缩结构与查找路径。<\/p>\n<h2>定义<\/h2>\n<p><strong>数字查找树<\/strong>：按键的二进制位逐层分支；某一位为 0 走左支、为 1 走右支，位序号从高位到低位推进。<\/p>\n<p><strong>Patricia 树<\/strong>：压缩形态的数字检索树；非叶结点保存 SKIP 字段（跳过的二进制位数）与分支位序号，单一路径上的中间结点被合并（PDF 第 397 页）。<\/p>\n<p><strong>SKIP 字段<\/strong>：记录查找时要跳过多少个二进制位；这些位在所有以该结点为前缀的键中取值一致，不提供分支信息。<\/p>\n<p><strong>分支标记<\/strong>：LTAG/RTAG 等标记区分左、右链接指向子树还是指向实际键；RTAG 标识在结点内保存分支方向。<\/p>\n<p><strong>正例<\/strong>：查找 THE（二进制 10111 01000 00101），根 SKIP 指定第一位，按位值左/右移，下一结点 SKIP 跳过连续相同位，直到前缀匹配的结点（PDF 第 397 页）。<strong>反例<\/strong>：SKIP 字段漏算公共前缀位数，查找会在单支结点间空转或跳错位。<\/p>\n<h2>原理推导<\/h2>\n<p>朴素数字树高由键长位数决定：<span class=\"katex-inline\">b<\/span> 位键最坏路径 <span class=\"katex-inline\">b<\/span> 层。公共前缀长度 <span class=\"katex-inline\">p<\/span> 的 <span class=\"katex-inline\">q<\/span> 个键，前 <span class=\"katex-inline\">p<\/span> 层只重复同一路径，结点不产生分支。Patricia 把这 <span class=\"katex-inline\">p<\/span> 层压成一个带 SKIP 的结点：查找时一次跳过 <span class=\"katex-inline\">p<\/span> 位，直接落到第一个有分支的位。树结点数降到与键数同量级，路径长度由「有分支的位」决定，而不是由键总位数决定。<\/p>\n<p>查找算法（书中称算法 P）从表头出发：置指针 <span class=\"katex-inline\">P\\leftarrow\\text{HEAD}<\/span>、计数器 <span class=\"katex-inline\">j\\leftarrow0<\/span>；按 LTAG/RTAG 沿左链或右链下移；遇到 SKIP 位数就把 <span class=\"katex-inline\">j<\/span> 加上 SKIP；到比较阶段把参数与结点键逐位核对（PDF 第 397 页）。前缀相同的键在公共段共用路径，分歧位才分两支。<\/p>\n<p>把位分组到字符表就得到字符级 <span class=\"katex-inline\">M<\/span> 路数字树：每层按一个字符值分支，字符集大小为 <span class=\"katex-inline\">M<\/span>；二进制 Patricia 是 <span class=\"katex-inline\">M=2<\/span> 的压缩形态。字符级树的兄弟结点按字符有序排列，中序遍历给出词典序，适合词典、命令树与输入自动补全。插入新键时先沿现有路径下移，在首次分歧位分裂结点：原结点 SKIP 覆盖的前缀被切成两段，两段各记自己的跳过位数；新键与现存键前缀完全相同时，按等值记录挂接规则处理，不新增分支位。插入可能改写上层结点的 SKIP，结构维护比朴素树复杂。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：键可表示成位串；查找沿位序列分支；适合前缀检索与多关键字部分匹配。\n<\/li><li>\n边界一：压缩依赖「连续位在同前缀键中一致」的判断；SKIP 计算错误会破坏定位。\n<\/li><li>\n失败案例一：把大小比较规则套到数字树上，分支依据错位；数字树看位值，不看整键次序。\n<\/li><li>\n失败案例二：不压缩公共前缀，长键集下树高随键长膨胀，单支层占满路径。\n<\/li><li>\n边界二：Patricia 结点含标记与 SKIP，单结点结构比朴素树复杂；插入新键可能在已有结点内分裂。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>数字树 vs 二叉查找树<\/strong>：数字树按位值分支，BST 按整键大小分支；前者不要求全序，后者保留大小次序。\n<\/li><li>\n<strong>朴素数字树 vs Patricia<\/strong>：前者逐层展开所有位，后者 SKIP 压缩单支；结点数与路径长度口径不同。\n<\/li><li>\n<strong>数字查找 vs 散列<\/strong>：数字查找保留前缀层次，支持部分匹配；散列打散前缀关系，只支持等值。\n<\/li><li>\n<strong>SKIP vs 普通层号<\/strong>：普通层每层一位；SKIP 一次跳过多位，跳过的位不提供分支信息。\n<\/ul>\n<p><strong>常见误解<\/strong>：把数字树当成按整键大小排序的结构；它的分支依据是位值，不要求全序，也不保留大小次序。另一个误解是以为压缩只省存储空间：Patricia 压掉的是单支层，路径长度由分歧位数决定，公共前缀越长收益越大。SKIP 计算必须只含一致位，把分歧位跳过去会落进错误子树；反过来把一致位留成单支层，压缩收益就消失了。前缀检索是数字树相对散列的独有能力，散列打散前缀关系，做部分匹配只能遍历全表。<\/p>\n<h2>联系<\/h2>\n<p>前置：c09 树形下移结构、c10 不依赖全局有序的检索路线。后继：c12 辅助键检索可把属性编码成位串接入数字树；倒排与索引组织中，前缀检索是数字查找的典型用途。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（数字查找与 Patricia 树：按位分支、前缀压缩与 SKIP 字段）<\/summary><div class=\"depth-body\"><h1>c11 深度推导：按位分支、前缀冗余与 Patricia 压缩机制<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把数字查找树推清楚，先往回追四层前提：<\/p>\n<ol><li>\n<strong>键能拆成位序列<\/strong>：数字查找的分支依据是每一位的取值；整键先写成二进制串，位序号从高到低排列。\n<\/li><li>\n<strong>位值决定分支方向<\/strong>：0、1 各走一支；这与整键大小比较不同，不要求键之间有全序。\n<\/li><li>\n<strong>公共前缀不产生分支<\/strong>：前缀段所有键取值一致，沿路径重复走同一支，这部分层是冗余的。\n<\/li><li>\n<strong>压缩要保留分支信息<\/strong>：SKIP 跳过一致位，但分歧位必须保留为分支结点；压缩不能丢掉区分键的位置。\n<\/ol>\n<p>依赖链方向：位串表示 → 逐位 0/1 分支 → 公共前缀层冗余 → SKIP 合并单支 → 路径长度由分歧位数决定。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：位串与分支<\/h3>\n<p>键 <span class=\"katex-inline\">K<\/span> 写成位串 <span class=\"katex-inline\">b_1b_2\\cdots b_r<\/span>，<span class=\"katex-inline\">b_1<\/span> 最高位。根结点看 <span class=\"katex-inline\">b_1<\/span>：0 左支、1 右支；下一结点看 <span class=\"katex-inline\">b_2<\/span>，依此类推。每一层对应一位，位序号随层数推进。<\/p>\n<h3>第二步：公共前缀的冗余<\/h3>\n<p>设 <span class=\"katex-inline\">q<\/span> 个键共享长度 <span class=\"katex-inline\">p<\/span> 的前缀，前 <span class=\"katex-inline\">p<\/span> 位在这些键中完全相同。前 <span class=\"katex-inline\">p<\/span> 层每层只有一条可走路径，结点不产生分支；朴素树仍为每层建结点，<span class=\"katex-inline\">p<\/span> 层单支占用路径长度。<\/p>\n<h3>第三步：Patricia 的结点结构<\/h3>\n<p>压缩树的非叶结点保存：SKIP（跳过位数）、分支位序号、左右链接与方向标记。SKIP 内的位在该前缀键中一致，查找时一次越过；到 SKIP 之后的位才比较分支。<\/p>\n<h3>第四步：查找路径<\/h3>\n<p>算法 P（PDF 第 397 页）：<\/p>\n<ol><li>\n置 <span class=\"katex-inline\">P\\leftarrow\\text{HEAD}<\/span>，<span class=\"katex-inline\">j\\leftarrow0<\/span>（<span class=\"katex-inline\">j<\/span> 是参数中已处理的二进制位数）；\n<\/li><li>\n按 LTAG 判断：左链则 <span class=\"katex-inline\">P\\leftarrow\\text{LLINK}(P)<\/span>，置 LTAG 状态后转下一步；\n<\/li><li>\n跳过位：<span class=\"katex-inline\">j\\leftarrow j+\\text{SKIP}(P)<\/span>，若 <span class=\"katex-inline\">j&gt;n<\/span> 转比较阶段；\n<\/li><li>\n检测分支位：参数第 <span class=\"katex-inline\">j<\/span> 位为 0 转左支，为 1 转右支；\n<\/li><li>\n右移：<span class=\"katex-inline\">Q\\leftarrow P<\/span>，<span class=\"katex-inline\">P\\leftarrow\\text{RLINK}(Q)<\/span>，按 RTAG 回到跳过步骤；\n<\/li><li>\n比较：参数与结点键逐位核对，相等成功，不等失败。\n<\/ol>\n<h3>第五步：压缩后的路径长度<\/h3>\n<p>设键集有 <span class=\"katex-inline\">d<\/span> 个出现分歧的位位置。朴素树路径最坏 <span class=\"katex-inline\">r<\/span> 层；Patricia 路径只经过分歧位对应的结点，长度 <span class=\"katex-inline\">O(d)<\/span>。公共前缀越长，压缩收益越大。<\/p>\n<h3>第六步：插入与分裂<\/h3>\n<p>新键与树中键在某位首次分歧时，在该位分裂出分支结点；原有 SKIP 按新分歧位置重新计算。插入可能改变某结点的跳过位数，而不是简单追加叶子。<\/p>\n<h3>第七步：前缀检索<\/h3>\n<p>公共前缀对应树中一条公共路径；查「以某前缀开头的所有键」只需走到前缀末端结点，收集其下子树。这是数字树相对散列的结构优势：散列打散前缀，无法沿前缀聚集。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：四位键分支<\/h3>\n<p>键 <span class=\"katex-inline\">0011,0101,1001<\/span>。根看第 1 位：0 支含前两个，1 支含第三个；0 支内第 2 位分歧（0/1），分出 <span class=\"katex-inline\">0011<\/span> 与 <span class=\"katex-inline\">0101<\/span>。分歧位为第 1、2 位，Patricia 路径最多两层。<\/p>\n<h3>算例 2：公共前缀压缩<\/h3>\n<p>16 个键共享前 8 位前缀，第 9 位才分歧。朴素树前 8 层单支；Patricia 根 SKIP=8，直接落到第 9 位分支结点，路径省 7 层。<\/p>\n<h3>算例 3：THE 查找<\/h3>\n<p>THE 二进制 10111 01000 00101。根 SKIP 指定第 1 位，该位 1 走右支；下一结点 SKIP 跳过连续相同位；到分歧位再分。前缀 TH 对应的键（THIS、THAT、THE）在公共段共用路径（PDF 第 397 页）。<\/p>\n<h3>算例 4：SKIP 误算<\/h3>\n<p>若把一致位算成分歧位，结点过早分叉，单支被拆；若把分歧位算进 SKIP，查找跳过区分键的位置，落到错误子树。SKIP 必须只含一致位。<\/p>\n<h3>算例 5：等值与部分匹配<\/h3>\n<p>数字树可回答「前缀为 TH 的键」；散列查 TH 开头要遍历全表。部分匹配检索是数字树的典型用途。<\/p>\n<h3>算例 6：结点开销<\/h3>\n<p>Patricia 结点除键外要存 SKIP、链接与方向标记；朴素树结点只存链接。压缩省的是层数，单结点结构更重，键数少时收益有限。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>按整键大小做数字树分支<\/strong>：分支依据错位，位值树退化为没有全序依据的乱分支；数字树只看位取值。\n<\/li><li>\n<strong>保留全部单支中间结点<\/strong>：公共前缀长时树高随键位数膨胀，路径被一致位占满，压缩收益消失。\n<\/li><li>\n<strong>SKIP 跳过分歧位<\/strong>：区分键的位置被越过，查找进入错误子树，等值判断也会跟着失败。\n<\/li><li>\n<strong>用数字树做散列式等值检索<\/strong>：结构能完成查找，但前缀层次优势被浪费；两种方法目标场景不同。\n<\/ul>\n<h2>补足推导：数字树与其他检索结构的位置<\/h2>\n<p>数字查找树按位分支，介于二叉查找树与散列之间：比 BST 少要求全序，比散列多保留前缀层次。M 路数字检索树把位分组到 <span class=\"katex-inline\">M<\/span> 进制字符表，每层按字符值分支；Patricia 是其二进制压缩形态。外部索引中，前缀树结构支持词典式遍历与自动补全；倒排索引的词项字典常按这类树组织。与 c09 的 B 树对照：B 树按键大小多路平衡，数字树按键位前缀分支，两者都压矮树高，分支依据不同。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n数字树每一层看键的哪一部分？0、1 各走哪支？\n<\/li><li>\n公共前缀为什么不产生分支？朴素树在这一段浪费了什么？\n<\/li><li>\nSKIP 字段保存什么？跳过的位必须满足什么条件？\n<\/li><li>\nPatricia 查找路径长度由什么决定？与键总位数是什么关系？\n<\/li><li>\n数字树为什么支持前缀检索，散列为什么不支持？\n<\/ol>\n<h2>扩展推演：字符级数字树、插入分裂与前缀检索用途<\/h2>\n<p>M 路数字检索树把位分组到字符表：每层按键的一个字符值分支，字符集大小 <span class=\"katex-inline\">M<\/span>；二进制 Patricia 是 <span class=\"katex-inline\">M=2<\/span> 的压缩形态。字符级树适合词典式遍历：兄弟结点按字符有序排列，中序遍历即词典序。前缀检索自动补全、词项字典、命令树都用这类结构。<\/p>\n<p>插入新键时先沿现有路径下移，到首次分歧位分裂结点。原结点的 SKIP 覆盖范围被新分歧切成两段，两段各记自己的跳过位数；若新键与某现存键前缀完全相同，按等值记录挂接规则处理。插入可能改变上层 SKIP，不是简单追加叶子。<\/p>\n<p>压缩收益取决于公共前缀长度。键集前缀分歧早，压缩空间有限；自然语言词项共享长前缀，Patricia 收益明显。结点除键外要存 SKIP、左右链与方向标记，单结点比朴素树重；键数少时结构开销可能超过层数节省。<\/p>\n<p>补充算例：三个 5 位键 <span class=\"katex-inline\">00110,01010,10010<\/span>。第 1 位分出 1 支（第三键）与 0 支（前两键）；0 支内第 2 位分歧（0/1），分出前两键。分歧位为第 1、2 位，Patricia 路径两层。若三键共享前 4 位、第 5 位才分，根 SKIP=4，路径一层到位。<\/p>\n<p>与散列对照：散列把前缀关系打散，查 TH 开头要遍历全表；数字树沿 TH 公共路径下移，收集末端子树即可。与 BST 对照：BST 按整键大小分支，支持有序范围遍历；数字树按位值分支，不保留全序。两类树分支依据不同，服务的检索类型不同。<\/p>\n<h2>再补充：压缩边界与适用场景<\/h2>\n<p>Patricia 压缩的是「一致位构成的单支层」；若键集分歧频繁，公共前缀短，可压缩空间有限，结点额外的 SKIP 与标记反而成为开销。键共享长前缀（自然语言词项、编号序列）时压缩收益最大。<\/p>\n<p>插入分裂后要重算相关结点 SKIP；新键与现存键前缀完全相同时，按等值挂接规则处理，不新增分支位。删除结点可能合并单支，结构维护比朴素树复杂。<\/p>\n<p>数字树按位值分支，不保留整键全序；它支持前缀与部分匹配，不直接支持有序范围遍历。字符级 M 路检索树按字符分支，兄弟结点有序排列时中序遍历给出词典序，这是词典、自动补全的常用结构。<\/p>\n<h2>边界小结<\/h2>\n<p>数字查找树按位值分支，前提是键可拆成位串；Patricia 压缩只对公共前缀生效，分歧频繁的键集收益有限。SKIP 必须只含一致位，跳过分歧位会落进错误子树。数字树不保留整键全序，范围遍历要另配结构；前缀与部分匹配是它相对散列的独有能力。字符级 M 路树与二进制 Patricia 是同一思想在不同字符表上的形态。<\/p>\n<h2>再补充：字符级分支、插入分裂与压缩收益边界<\/h2>\n<p>字符级 <span class=\"katex-inline\">M<\/span> 路数字树把位分组到字符表，每层一个字符值；与二进制树相比，路径层数减少、结点扇出增大，结点内兄弟按字符有序时中序遍历即词典序。两类结构分支依据都是键的分段取值，不是整键大小；范围遍历要靠兄弟有序排列，而不是靠二叉查找树的中序骨架。<\/p>\n<p>插入分裂后要重算相关结点的 SKIP：新键在某一位与现有键分歧，该位之前的一致位保留在上层结点，分歧位起新开分支。若新键整条前缀与某现存键相同，等值记录直接挂到该键结点下，不产生新分支。删除结点时，若某结点两个子支合并成单一路径，可把结点压回父结点的 SKIP 中，结构方向与插入相反。<\/p>\n<p>压缩收益取决于公共前缀长度：自然语言词项、编号序列共享长前缀，Patricia 收益明显；键集分歧频繁、前缀短时，可压缩空间有限，结点额外的 SKIP 与标记反而成为开销。判断一个键集是否适合 Patricia，先统计最长公共前缀与分歧位分布，再权衡结点结构成本。<\/p>\n<h2>边界补充<\/h2>\n<p>数字树按位值分支，前提是键可拆成位串；Patricia 压缩只对公共前缀生效，分歧频繁的键集收益有限。SKIP 必须只含一致位，跳过分歧位会落进错误子树；数字树不保留整键全序，范围遍历要另配结构。字符级 <span class=\"katex-inline\">M<\/span> 路树与二进制 Patricia 是同一思想在不同字符表上的形态，兄弟有序时中序遍历给出词典序。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出三个 5 位键，指出它们的分歧位位置与 Patricia 路径层数。\n<\/li><li>\nSKIP 把分歧位算进去会造成什么错误？\n<\/li><li>\nPatricia 插入新键时，原有结点的 SKIP 为什么可能要重算？\n<\/li><li>\n数字树与二叉查找树的分支依据有何不同？\n<\/li><li>\n前缀检索在数字树上怎样完成？对应散列要付出什么代价？\n<\/ol><\/div><\/details>", "c12": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/计算机程序与设计艺术/图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版 (高德纳（Donald E.Knuth）著；贾洪峰译, (美) 克努特, (Knuth etc.) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.443<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c10\">散列查找：散列函数、拉链法与线性探查，装填因子与探查长度<\/a><\/span><\/div><h1>辅助键的查找：属性检索、简单/范围/布尔查询与倒排思路<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch04（原书 §6.5 辅助键的查找，PDF 第 443 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>前面的查找都围绕主键：主键唯一确定一条记录。实际业务常按主键之外的属性找记录，例如按专业、所在州、年龄范围筛选学生。困难在于：属性取值不唯一，一个属性值对应一批记录；查询条件有定值、范围、组合多种形式；主键次序对属性检索没有帮助。这个概念区分三类查询，说明全表扫描、聚集与辅助索引各自的适用边界。<\/p>\n<h2>定义<\/h2>\n<p><strong>辅助键（secondary key）<\/strong>：记录中除主键外用来检索的字段或属性；一个辅助键值对应多条记录。<\/p>\n<p><strong>简单查询<\/strong>：给出特定属性的特定定值，如「专业 = 数学」「居住州 = 俄亥俄」（PDF 第 443 页）。<\/p>\n<p><strong>范围查询<\/strong>：给出指定属性的取值范围，如「<span class=\"katex-inline\">21&lt;年龄\\le23<\/span>」「费用 &lt; \\$18.00」（PDF 第 443 页）。<\/p>\n<p><strong>布尔查询<\/strong>：用 AND、OR、NOT 把简单或范围查询组合起来，如「（专业 = 数学）AND（居住州 = 俄亥俄）」（PDF 第 443 页）。<\/p>\n<p><strong>批量聚集<\/strong>：批量提交多个查询时，先对整个文件顺序扫描、在结果上聚集，查询之间不重复扫描。<\/p>\n<p><strong>正例<\/strong>：「查所有讲法语的未婚女研究生」是多个条件经 AND 组合的布尔查询。<strong>反例<\/strong>：把属性等值查询当主键查找，指望一次定位唯一记录；辅助键命中的是记录集合。<\/p>\n<h2>原理推导<\/h2>\n<p>主键索引按唯一键定位单条记录；辅助键检索要先得到满足属性条件的记录集合。无辅助索引时，唯一通用手段是全表顺序扫描：逐条读取记录，判断属性条件是否成立，命中即收入结果集。扫描代价与文件长度成正比，与查询条件个数无关。<\/p>\n<p>批量查询共享一次扫描：多个查询条件在同一遍扫描中逐条判定，避免每个查询各扫一遍。文件不大、查询不要求即时响应时，扫描法可能最经济；大型文件、复杂查询则需要额外索引：为属性值建立到记录集合的映射（倒排思路），把按属性找记录转成查表与集合运算。人工打印索引是最朴素的形式（PDF 第 443 页）。<\/p>\n<p>倒排表由词典与记录列表两部分组成：词典登记出现过的属性值，每个属性值挂一条按记录编号有序排列的列表（posting）。简单查询直接取出对应列表；范围查询把区间覆盖的若干属性值列表合并；布尔查询先取各子条件列表，再做交集、并集或差集。列表有序时交集用双指针归并，公共元素留下；并集合并去重；差集从全集列表中减去子条件列表。列表长度悬殊时，先取最短列表逐条在长表中查找，可减少归并比较次数；NOT 子条件通常要访问全集或补集，代价高于 AND 与 OR。这套结构把「在文件里逐行筛属性」换成「查表后对列表做集合运算」，查询代价与命中列表长度相关，不再随全文件长度线性增长。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：记录带可检索属性；查询类型明确；扫描或索引成本与文件规模匹配。\n<\/li><li>\n边界一：范围查询与布尔查询无法直接利用主键次序；等值散列也不保留区间关系。\n<\/li><li>\n失败案例一：只建主键索引就处理属性筛选，查询退回全表扫描。\n<\/li><li>\n失败案例二：把简单查询的索引思路直接套到布尔组合上，多条件交集/差集需要集合运算，不是单表定位。\n<\/li><li>\n边界二：复杂查询的代价还包括索引维护、更新开销；辅助索引越多，写入成本越高。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>主键 vs 辅助键<\/strong>：主键唯一确定一条记录；辅助键对应记录集合，检索结果是一批。\n<\/li><li>\n<strong>简单 vs 范围 vs 布尔<\/strong>：定值单点、区间连续、逻辑组合；三类条件的索引与运算方式逐层复杂。\n<\/li><li>\n<strong>扫描 vs 索引<\/strong>：扫描通用但随文件线性变慢；索引把属性条件转成查表，占用额外空间并增加维护成本。\n<\/li><li>\n<strong>批量聚集 vs 逐条查询<\/strong>：多查询共享一遍扫描；逐条查询各扫一遍，重复劳动。\n<\/ul>\n<p><strong>常见误解<\/strong>：把辅助键当主键期待一次定位；属性值对应一批记录，检索结果是集合而不是单条。另一个误解是以为建了主键索引就能筛属性：主键次序与属性无关，索引帮不上忙。布尔查询也不是单条件查表，AND、OR、NOT 要在倒排列表上做交集、并集、差集；NOT 通常要从全集减去子条件列表，代价高于前两者。辅助索引越多写入维护越贵，读多写少的场景才适合多建；文件不大、查询不要求即时响应时，顺序扫描加批量聚集可能是最经济的方案，人工整理索引是其朴素形态。<\/p>\n<p>索引数量还要按读写比例权衡：一条记录在多个属性上变更，对应词典条目与 posting 列表都要同步更新；索引建得越多，每次写入要维护的列表越长，存储占用也越大。读多写少的目录、词典类场景适合多建辅助索引；写密集的事务系统则要精简索引，把维护成本压下来。范围查询依赖属性值在词典中的有序排列，散列这类把键打散的结构给不出区间；同一批记录面对等值、区间、前缀、组合四类查询时，往往需要不同结构配合，没有单一索引能同时覆盖全部查询类型。<\/p>\n<h2>联系<\/h2>\n<p>前置：c08 顺序扫描、c10 散列等值定位、c11 前缀索引。后继：本概念是数据库索引组织的入口；倒排表把属性词项映射到记录列表，与散列链、数字树等结构配合服务复合查询。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（辅助键的查找：属性检索、简单/范围/布尔查询与倒排思路）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：属性检索分类、扫描代价与倒排集合运算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把辅助键检索推清楚，先往回追四层前提：<\/p>\n<ol><li>\n<strong>检索对象从单条记录变成记录集合<\/strong>：辅助键值不唯一，查询返回满足条件的一批记录，定位目标不是一条而是一个集合。\n<\/li><li>\n<strong>条件形式分三类<\/strong>：定值、范围、布尔组合；三类条件利用次序关系的能力不同，索引设计要分别对待。\n<\/li><li>\n<strong>主键次序不服务属性筛选<\/strong>：按主键排好的文件，属性取值随机散布，顺序扫描仍是无索引时的通用手段。\n<\/li><li>\n<strong>索引是空间换时间<\/strong>：为属性建映射要额外存储并承担更新维护；扫描省索引但随文件线性变慢，两条路线按规模权衡。\n<\/ol>\n<p>依赖链方向：属性记录集合 → 简单/范围/布尔条件 → 无索引全表扫描 → 批量聚集共享扫描 → 倒排映射把属性条件转成集合交并差。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：区分主键与辅助键<\/h3>\n<p>主键唯一标识记录，查找返回至多一条；辅助键是属性字段，同一属性值可挂多条记录。学生表中学号是主键，专业、州、年龄、婚姻状况是辅助键。<\/p>\n<h3>第二步：三类查询的形式<\/h3>\n<ul><li>\n简单查询：属性 = 定值，如「专业 = 数学」；\n<\/li><li>\n范围查询：属性落在区间，如「<span class=\"katex-inline\">21&lt;年龄\\le23<\/span>」；\n<\/li><li>\n布尔查询：AND、OR、NOT 组合上述条件，如「（专业 = 数学）AND（州 = 俄亥俄）」（PDF 第 443 页）。\n<\/ul>\n<h3>第三步：无索引时的扫描过程<\/h3>\n<p>逐条读取记录，对每条判定条件：简单查询比对属性值；范围查询比较上下界；布尔查询先算各子条件再按逻辑组合。命中收入结果集，未命中跳过。扫描一遍处理完所有条件，代价 <span class=\"katex-inline\">O(N)<\/span>，<span class=\"katex-inline\">N<\/span> 为记录数。<\/p>\n<h3>第四步：批量聚集<\/h3>\n<p>多个查询同时提交时，一遍扫描内对每条记录判定全部查询条件，各查询结果分别收集；避免每个查询单独扫一遍。查询越多，共享扫描省下的重复读取越大。<\/p>\n<h3>第五步：倒排映射的思路<\/h3>\n<p>为每个属性值维护一个记录列表（倒排表）：属性值 → 含该值的记录编号集合。等值查询直接取对应列表；范围查询取区间覆盖的若干列表；布尔查询把各子条件列表做交集（AND）、并集（OR）、差集（NOT）。查表与集合运算替代逐条扫描。<\/p>\n<h3>第六步：集合运算口径<\/h3>\n<p>AND 对应交集：同时满足两条件的记录在两个列表都出现；OR 对应并集；NOT 对应全集减去子条件列表。列表有序时交集、差集可按归并方式线性扫描。<\/p>\n<h3>第七步：索引维护代价<\/h3>\n<p>辅助索引在记录插入、删除、修改时要同步更新对应列表；索引越多写入越慢。读多写少的场景适合建辅助索引，写密集场景要权衡索引数量。<\/p>\n<h3>第八步：人工索引的朴素形态<\/h3>\n<p>书中提到最朴素的辅助索引是人工打印的信息索引：打印时整理属性与记录对应关系，旧纸页重复使用；规模小、查询简单时这种人工整理已经够用（PDF 第 443 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：扫描代价<\/h3>\n<p>文件 <span class=\"katex-inline\">N=10^5<\/span> 条，单条判定常数次比较；全表扫描约 <span class=\"katex-inline\">10^5<\/span> 次读取。无索引时无论条件多简单，代价都随 <span class=\"katex-inline\">N<\/span> 线性增长。<\/p>\n<h3>算例 2：批量聚集<\/h3>\n<p>10 个查询共享一遍扫描：读取 <span class=\"katex-inline\">N<\/span> 条记录、每条判定 10 个条件；逐条查询则读取 <span class=\"katex-inline\">10N<\/span> 次。共享扫描把读取量压到 <span class=\"katex-inline\">1/10<\/span>。<\/p>\n<h3>算例 3：倒排交集<\/h3>\n<p>「专业 = 数学」列表 800 条，「州 = 俄亥俄」列表 500 条，交集 60 条；AND 查询结果 60 条，不必扫描全表。两列表有序时交集按双指针归并求出。<\/p>\n<h3>算例 4：范围查询<\/h3>\n<p>年龄索引按值排序，<span class=\"katex-inline\">21&lt;年龄\\le23<\/span> 取 22、23 两个值对应的列表；散列只支持等值，无法直接给出区间。<\/p>\n<h3>算例 5：NOT 差集<\/h3>\n<p>「非数学专业」= 全集减去数学专业列表；全集规模大时差集仍需遍历，NOT 条件在倒排中代价通常高于 AND/OR。<\/p>\n<h3>算例 6：索引维护<\/h3>\n<p>一条记录专业、州、年龄三个属性变更，三个辅助索引列表都要更新；辅助索引数量直接折算成写入成本。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>只靠主键索引做属性筛选<\/strong>：主键次序与属性无关，索引帮不上忙，查询退回全表扫描。\n<\/li><li>\n<strong>把辅助键当唯一键定位<\/strong>：属性值对应一批记录，期待一次定位单条会漏掉同值其他记录。\n<\/li><li>\n<strong>布尔查询只做单条件查表<\/strong>：AND/OR/NOT 需要集合交并差，单列表取不出组合结果。\n<\/li><li>\n<strong>索引无限增加<\/strong>：读查询变快，但写入维护成本与存储占用膨胀；索引数量要按读写比例取舍。\n<\/ul>\n<h2>补足推导：辅助检索与全书查找结构的汇合<\/h2>\n<p>顺序查找（c08）是无索引扫描的基线；二分与 B 树（c09）服务有序主键检索；散列（c10）服务等值定位；数字树（c11）支持前缀匹配；倒排表把这些结构组织在属性维度：词项字典可用数字树或 B 树，词项到记录的映射是列表或散列链。复合查询先在各属性索引上取列表，再做集合运算。第 5 章排序产物提供有序表基础，第 6 章各类查找结构按查询类型分工：等值、有序、前缀、属性集合，各有适用前提。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n辅助键与主键在检索结果上有什么差别？\n<\/li><li>\n三类查询各是什么形式？举例说明。\n<\/li><li>\n无索引时辅助查询怎样执行？代价随什么增长？\n<\/li><li>\n批量聚集为什么能省读取？共享的是哪一遍扫描？\n<\/li><li>\n倒排表把属性条件转成什么运算？AND、OR、NOT 各对应哪种集合操作？\n<\/ol>\n<h2>扩展推演：倒排实现、集合运算代价与索引取舍<\/h2>\n<p>倒排表由词典（属性值列表）和 postings（记录编号列表）两部分组成。词典可用数字树、B 树或散列组织；postings 通常按记录编号有序存放，便于交集、并集按归并方式扫描。等值查询直接取一条 posting；范围查询取区间覆盖的若干条 posting 合并；布尔查询先取各子条件列表，再做集合运算。<\/p>\n<p>AND 交集：两列表有序时双指针归并，公共元素留下；OR 并集：合并去重；NOT 差集：全集减去子条件列表。NOT 代价最高，因为要遍历全集或补集；实际系统常把 NOT 条件转成正面条件再检索。列表长度悬殊时，先取最短列表逐条在长表中查，可减少比较次数。<\/p>\n<p>索引取舍按读写比例：读多写少的查询场景（词典、目录）适合多建辅助索引；写密集的事务系统，每条记录更新要同步多个 posting，索引越多写入越慢。辅助索引还占用存储，词典与 postings 都要持久化。人工打印索引是倒排的朴素形态：纸页上整理属性与记录对应，旧页重复使用，规模小、查询简单时够用。<\/p>\n<p>补充算例：<span class=\"katex-inline\">N=10^5<\/span> 全表扫描，单条判定常数次；10 个查询逐条扫要 <span class=\"katex-inline\">10N<\/span> 次读取，批量聚集一遍扫描 <span class=\"katex-inline\">N<\/span> 次。倒排交集：专业列表 800、州列表 500，交集 60；双指针归并代价与两表长度和成比例，不碰全表。范围查询按年龄值取 22、23 两条 posting；散列只给等值，给不出区间。NOT「非数学专业」要从全集减去 800 条列表，全集规模大时差集代价高。<\/p>\n<p>全书查找结构在此汇合：顺序扫描是无索引基线；二分、B 树服务有序主键；散列服务等值；数字树服务前缀；倒排把属性值映射到记录集合，再与上述结构配合完成复合查询。第 5 章排序提供有序表基础，第 6 章各类方法按查询类型分工，前提与代价各有边界。<\/p>\n<h2>再补充：查询代价与索引维护<\/h2>\n<p>简单查询走等值索引；范围查询要按属性有序的索引取区间 posting；布尔查询先分离子条件取列表，再交并差。列表长度悬殊时先取最短列表逐条匹配，减少归并比较量。NOT 条件通常转成正面条件，避免遍历全集。<\/p>\n<p>索引数量受写入成本约束：一条记录多个属性变更，对应 posting 都要更新；读多写少的目录类场景适合多建，写密集系统要精简。词典与 postings 都占持久存储，复合查询的中间结果也需要临时空间。<\/p>\n<p>无索引时全表扫描是唯一通用手段；批量聚集让多查询共享一遍扫描。文件不大、响应要求不高时，扫描法省去索引维护，人工打印索引是其朴素形态。属性检索与主键检索分工：主键定位单条，辅助键返回记录集合。<\/p>\n<h2>再补充：词典组织、列表有序的作用与检索链路<\/h2>\n<p>词典本身是一份属性值到 posting 的映射，它的组织方式沿用第 6 章前面讲过的结构：属性值离散且需要等值定位时可用散列；属性值需要按区间遍历、词典序排列时可用数字查找树或 B 树。词典选型与 posting 组织是两件事：前者决定怎样找到属性值条目，后者决定取出的记录列表怎样参与交并差。<\/p>\n<p>posting 按记录编号有序存放，交集与并集才能用双指针归并：两个指针各扫一条列表，编号相等收入交集，较小编号的指针前移。若列表无序，交集只能逐条比对，代价随两表长度乘积增长。有序 posting 还支持压缩存储：相邻编号差值单独编码，区间内编号密集时压缩收益明显；编号稀疏时差值大，压缩收益下降。<\/p>\n<p>检索链路按查询类型展开：简单查询走「词典定位 → 取 posting → 返回记录集合」；范围查询先在有序词典上圈出区间属性值，合并对应 posting；布尔查询把各子条件列表取出后，按 AND、OR、NOT 的逻辑组合。NOT 差集需要全集编号序列，全集通常由主记录表提供；缺失全集时 NOT 条件无法直接计算，只能转成等价的正面条件。<\/p>\n<p>人工打印索引受纸张容量限制，属性值与记录对应只能手工抄录，查询时翻页对照，规模稍大就难以维护；它的价值在于把「属性到记录」的映射关系显性化，倒排表是这一思路在计算机上的系统化实现。无索引的扫描法不维护任何映射结构，代价随文件长度线性增长；索引法用空间与写入维护换取查询阶段的列表运算，两条路线的取舍由文件规模、查询频率与读写比例共同决定。<\/p>\n<h2>链路补充：从无索引扫描到倒排表的完整检索过程<\/h2>\n<p>先看无索引基线：文件中有 <span class=\"katex-inline\">N<\/span> 条记录，每个查询逐条读取记录、判定属性条件，命中收入结果集。一次查询的读取量与 <span class=\"katex-inline\">N<\/span> 成正比；<span class=\"katex-inline\">Q<\/span> 个查询逐条提交，总读取量 <span class=\"katex-inline\">QN<\/span>。批量聚集把 <span class=\"katex-inline\">Q<\/span> 个查询条件放进同一遍扫描，每条记录读出后依次判定各条件，总读取量压到 <span class=\"katex-inline\">N<\/span>，代价与查询个数脱钩。这个方案通用，但文件规模大时单次扫描仍然不短，也不支持把单个属性条件快速定位到记录集合。<\/p>\n<p>再看倒排表的组织：词典登记全部出现过的属性值，每个值挂一条按记录编号有序的 posting。词典本身可用数字树、B 树或散列组织，选型沿用第 6 章前面的结论；posting 有序是交并集归并扫描的前提。简单查询取出对应 posting 即得记录集合；范围查询先在有序词典上圈出区间值，合并若干 posting；布尔查询先取各子条件列表，再做交集、并集、差集。交集双指针归并：编号相等留下，较小编号指针前移；并集合并去重；差集从全集编号序列中减去子条件列表。<\/p>\n<p>列表长度悬殊时，先取最短列表逐条在长表中匹配，减少归并比较量；NOT 差集需要全集或补集，缺失全集时只能转成等价正面条件。索引维护发生在写入环节：记录属性变更时，词典条目与相关 posting 都要同步更新；索引越多，单次写入维护的列表越长，存储占用也越大。读多写少的目录、词典类场景适合多建辅助索引，写密集事务系统要精简索引。<\/p>\n<p>人工打印索引是倒排的朴素形态：纸页上整理属性与记录对应，规模小、查询简单时够用，稍大就难以手工维护。它把「属性到记录」的映射显性化，倒排表是这一思路在计算机上的系统化实现。检索链路至此汇合：顺序扫描是无索引基线；二分与 B 树服务有序主键；散列服务等值；数字树服务前缀；倒排把属性值映射到记录集合，再与上述结构配合完成复合查询。排序产物（有序表）是二分、B 树等有序查找方法的前提；各方法的适用边界由查询类型与读写比例共同决定。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出一个布尔查询，并拆出它的简单子条件与集合运算。\n<\/li><li>\n范围查询为什么不能直接用散列等值索引？\n<\/li><li>\n倒排交集在列表有序时怎样高效求出？\n<\/li><li>\n辅助索引的维护代价发生在什么操作上？\n<\/li><li>\n扫描法与索引法各自的适用规模和前提是什么？\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：排序的组合性质与内部排序：反序、插入、交换、选择、合并<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 5.1–5.2 章：排序的组合性质与内部排序<\/a><br>检查点：能说清反序与稳定性的含义，写出直接插入排序最坏与平均比较次数，沿递推推出快速排序期望比较次数 $2N\\ln N$，区分选择排序与锦标赛树、两路合并与自然两路合并的结构差别<\/li><li class='path-step' id='path-02'><strong>步骤 02：最优排序与外部排序：比较下界、排序网络、多路合并与替代选择<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 5.3–5.4 章：最优排序与外部排序<\/a><br>检查点：能用决策树叶子数推出 $\\lceil\\lg N!\\rceil$ 比较下界并用 Stirling 公式放缩，说明外部排序在内存受限时怎样生成初始游程、用 $P$ 路合并把扫描遍数压到 $\\lceil\\log_P S\\rceil$<\/li><li class='path-step' id='path-03'><strong>步骤 03：顺序查找与按键比较的查找：静态最优排列、二分查找、查找树与 B 树<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 6.1–6.2 章：顺序查找与按键比较进行的查找<\/a><br>检查点：能写出加权平均比较次数 $\\bar C_N=\\sum j p_j$ 并证明频率降序最优，沿区间长度递推推出二分查找比较次数上界，说明二叉查找树怎样退化成链、平衡树与多路 B 树怎样控制高度<\/li><li class='path-step' id='path-04'><strong>步骤 04：数字查找、散列与辅助键检索：数字树、Patricia、拉链与探查、倒排<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 6.3–6.5 章：数字查找、散列与辅助键的查找<\/a><br>检查点：能说清数字查找按位分支的依据，解释 Patricia 怎样用 SKIP 字段压缩单支结点；按装填因子推出拉链法与线性探查的平均探查长度，区分简单查询、范围查询与布尔查询在辅助键检索中的处理差别<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='键（key）'>键（key） — 记录中用来排序或查找的特殊字段；本书假定每条记录都含一个键，键值决定记录在序列中的次序（原书第 6 章开头，PDF 第 312 页） <span class=glossary-ref>（第 5.1–5.2 章：排序的组合性质与内部排序）<\/span><\/li><li data-term='记录（record）'>记录（record） — 携带键与附属信息的数据项；排序与查找算法通常只比较键，附属信息随记录一起移动（原书 5.2.1 节，PDF 第 67 页） <span class=glossary-ref>（第 5.1–5.2 章：排序的组合性质与内部排序）<\/span><\/li><li data-term='稳定性（stability）'>稳定性（stability） — 排序完成后，键相等的记录保持其输入时相对次序的性质；比较相等时不交换即可维持稳定（原书 5.2.2 节习题涉及，PDF 第 110 页前后） <span class=glossary-ref>（第 5.1–5.2 章：排序的组合性质与内部排序）<\/span><\/li><li data-term='反序（逆序对，inversion）'>反序（逆序对，inversion） — 排列中一对位置 $i&lt;j$ 而键 $K_i&gt;K_j$ 的记录；反序总数是衡量排序前混乱程度与交换类算法代价的度量（原书 5.1.1 节，PDF 第 15 页） <span class=glossary-ref>（第 5.1–5.2 章：排序的组合性质与内部排序）<\/span><\/li><li data-term='游程（run）'>游程（run） — 文件中一段已经按键非递减顺序排好的连续记录；合并排序与外部排序都以游程作为合并的基本单位（原书 5.2.4 节，PDF 第 130 页前后） <span class=glossary-ref>（第 5.1–5.2 章：排序的组合性质与内部排序）<\/span><\/li><li data-term='决策树（decision tree）'>决策树（decision tree） — 把一次排序中各次键比较作为内部结点、排列结果作为叶子的二叉树；树高给出比较次数下界的分析框架（原书 5.3.1 节，PDF 第 146 页） <span class=glossary-ref>（第 5.3–5.4 章：最优排序与外部排序）<\/span><\/li><li data-term='外部排序（external sorting）'>外部排序（external sorting） — 待排文件大于内存容量、需借助磁带或磁盘分遍扫描与合并的排序方式；与内部排序相对（原书 5.4 节，PDF 第 203 页） <span class=glossary-ref>（第 5.3–5.4 章：最优排序与外部排序）<\/span><\/li><li data-term='替代选择（replacement selection）'>替代选择（replacement selection） — 在内存中用选择树持续输出当前最小键、并把新读入记录补回树中，从而生成长于内存容量的初始游程的技术（原书 5.4.1 节，PDF 第 203 页） <span class=glossary-ref>（第 5.3–5.4 章：最优排序与外部排序）<\/span><\/li><li data-term='静态表与动态表'>静态表与动态表 — 静态表内容在建表后基本不变，分析时把查找时间压到最低；动态表允许频繁插入与删除，结构需兼顾更新代价（原书第 6 章开头，PDF 第 312 页） <span class=glossary-ref>（第 6.1–6.2 章：顺序查找与按键比较进行的查找）<\/span><\/li><li data-term='二分查找（binary search）'>二分查找（binary search） — 在已排序表中每次与中间位置比较、舍弃一半候选区间的查找法；比较次数随 $\\lg N$ 增长（原书 6.2.1 节，PDF 第 324 页） <span class=glossary-ref>（第 6.1–6.2 章：顺序查找与按键比较进行的查找）<\/span><\/li><li data-term='b 树（b-tree）'>B 树（B-tree） — 为外部存储设计的多路平衡树：除根外结点至少 $\\lceil m/2\\rceil$ 个子结点，结点内有序，高度受控；1970 年由拜尔和麦克赖特提出（原书 6.2.4 节，PDF 第 383 页） <span class=glossary-ref>（第 6.1–6.2 章：顺序查找与按键比较进行的查找）<\/span><\/li><li data-term='散列函数（hash function）'>散列函数（hash function） — 把键变换成散列表地址的函数；好的散列应与机器无关、与数据分布无关，使不同键尽量落到不同地址（原书 6.4 节，PDF 第 413 页） <span class=glossary-ref>（第 6.3–6.5 章：数字查找、散列与辅助键的查找）<\/span><\/li><li data-term='拉链法（chaining）'>拉链法（chaining） — 散列地址相同的键串成同一链表的冲突处理方式；查找时先散列定位，再在对应链表中顺序查找（原书 6.4 节，PDF 第 414 页） <span class=glossary-ref>（第 6.3–6.5 章：数字查找、散列与辅助键的查找）<\/span><\/li><li data-term='线性探查（linear probing）'>线性探查（linear probing） — 冲突后按固定步长依次探查下一地址，直到找到空槽或目标键的开放定址法（原书 6.4 节，PDF 第 418 页） <span class=glossary-ref>（第 6.3–6.5 章：数字查找、散列与辅助键的查找）<\/span><\/li><li data-term='辅助键（secondary key）'>辅助键（secondary key） — 主键之外用来检索的字段或属性；按辅助键取值定位记录的查询分简单、范围与布尔三类（原书 6.5 节，PDF 第 443 页） <span class=glossary-ref>（第 6.3–6.5 章：数字查找、散列与辅助键的查找）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：先分清键、记录与稳定性前提，再谈排序动作<\/h2>\n<p>分析任何排序方法，先把三个对象分开：用来比较的键、携带附属信息的记录、决定等值次序的稳定性。比较只发生在键之间，记录随键移动；稳定性只在键相等时才有意义，比较相等时不交换、等值归并取左段，是两种维持稳定的常见规则。跳过这一步，容易把记录搬移成本算成键比较成本，也容易误判一个方法在等值密集输入上的次序表现。键可比较、记录可移动，是后续所有排序算法成立的共同前提。<\/p>\n<h2>模式 2：代价分「比较次数」与「移动次数」两条线记账<\/h2>\n<p>排序方法的性能不能只报一个数字。键比较次数随输入反序数、划分位置变化；记录移动次数随搬移宽度、辅助空间方案变化；MIX 指令口径下还要分比较指令与移动指令分别计。比较两类算法前先核对记的是哪条线：插入排序比较与移动都偏多，选择排序交换次数封顶 <span class=\"katex-inline\">N-1<\/span>，归并排序每轮扫遍记录。记录宽、键窄时搬移代价上升，方法选择随之改变；只按比较次数排优劣，会漏掉存储与移动这一整项成本。<\/p>\n<h2>模式 3：平均情形先写概率假设，再推加权求和<\/h2>\n<p>平均比较次数不是凭直觉报的数。先列假设：键互不相同、输入排列等概率、基准等概率落位、查找键按给定概率分布。假设写成求和式的权重，再沿位置或轮次累加。顺序查找的 <span class=\"katex-inline\">\\bar C_N=\\sum j\\,p_j<\/span>、快速排序的 <span class=\"katex-inline\">2N\\ln N<\/span>、散列的探查长度，都建立在明确的分布假设上。把等概率换成齐普夫或偏斜分布，结论随之改变；反事实分析就是反过来：去掉某条假设，看公式哪一项失效、代价向哪个方向恶化。<\/p>\n<h2>模式 4：分治方法沿递推式拆分「规模」与「合并代价」<\/h2>\n<p>快速排序、合并排序、<span class=\"katex-inline\">P<\/span> 路合并都是分治结构：先写递推式，把规模 <span class=\"katex-inline\">N<\/span> 拆成子问题规模，再加上本轮划分或合并的工作量。快速排序 <span class=\"katex-inline\">C_N=N+1+\\frac{2}{N}\\sum C_k<\/span>，合并排序每轮 <span class=\"katex-inline\">N<\/span> 次比较、共 <span class=\"katex-inline\">\\lceil\\lg N\\rceil<\/span> 轮。推递推时先问子问题是否同构、划分是否均匀、本轮代价是线性还是对数；偏斜划分会把递归深度从对数拉到线性。递推解出来后主项与低次项分开看，主项决定量级，常数与线性项决定同量级方法之间的差距。<\/p>\n<h2>模式 5：下界从候选规模的对数推，不从试跑快慢推<\/h2>\n<p>判断「还能不能更快」，先数需要区分多少种结果：排序区分 <span class=\"katex-inline\">N!<\/span> 种排列，二分查找区分 <span class=\"katex-inline\">N<\/span> 个候选。每一步比较把候选集分成两支，<span class=\"katex-inline\">h<\/span> 次比较最多区分 <span class=\"katex-inline\">2^h<\/span> 种结果，由此得 <span class=\"katex-inline\">2^h\\ge N!<\/span>，即 <span class=\"katex-inline\">h\\ge\\lceil\\lg N!\\rceil<\/span>。这是信息论下界，与具体算法无关；试跑时小规模数据快慢受常数与缓存影响，推不出量级结论。达到下界同阶的方法（归并、树选择）与下界之间仍有线性项差距；下界说明不能再少到哪里，不直接给出最优算法。<\/p>\n<h2>模式 6：内部与外部按「数据能否进内存」分档<\/h2>\n<p>排序方法先分两档：文件小于内存，在内存中完成内部排序；文件大于内存，必须分遍读写外部介质。内部排序比较的是键比较与移动的内存代价；外部排序记账主项是记录读写遍数，初始游程生成方式、合并路数、缓冲长度是主要优化对象。把内部排序的 <span class=\"katex-inline\">N\\lg N<\/span> 直接套到外部文件上会漏掉磁盘遍数；外部方案先定游程数 <span class=\"katex-inline\">S<\/span> 与路数 <span class=\"katex-inline\">P<\/span>，算遍数 <span class=\"katex-inline\">\\lceil\\log_P S\\rceil<\/span>，再谈内存比较。查找侧也是如此：B 树为外部分页设计，优化目标是页读取次数，不是内存比较次数。<\/p>\n<h2>模式 7：查找结构按查询类型分工，先定查询再选结构<\/h2>\n<p>同一份数据，查询类型不同，合适的结构不同：等值查询可用顺序、散列、二分；有序范围查询需要二分表、B 树或平衡树；前缀与部分匹配需要数字查找树；复合属性查询需要倒排表。散列把键打散，查不出区间；数字树沿位分支，不保留整键全序；二叉查找树支持中序遍历，但不加平衡会退化成链。选型先问「查等值、查区间、查前缀还是查组合条件」，再核对结构是否保留所需次序；用散列做范围筛选、用数字树做全序遍历，都是结构与查询错配。<\/p>\n<h2>模式 8：散列平均公式以「均匀分布」为前提，偏斜先修函数<\/h2>\n<p>散列的平均探查长度建立在散列函数均匀、冲突近似随机的假设上。函数偏斜时，同类键落进同一槽或同一段，局部链长、探查段长偏离期望，调装填因子补不回来。检查散列先看函数是否用上键的全部位、模值是否选质数；再看装填因子 <span class=\"katex-inline\">\\alpha<\/span> 是否压住；最后才数链长与段长。开放定址还要区分一级聚集（相邻占用槽连成段）与二级聚集（不同键落入同一段）。散列只服务等值，不支持范围与有序遍历；它与加密哈希目标不同，一个求地址均匀，一个求不可逆与抗碰撞，指标不能互套。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 排序的组合性质与内部排序<\/strong>：反序与稳定性、插入、交换、选择、合并（原书 §5.1–5.2，PDF 第 15、67、111、113、129 页）。\n<\/li><li>\n<strong>第 2 章 最优排序与外部排序<\/strong>：比较次数下界、决策树、多路合并与替代选择（原书 §5.3–5.4，PDF 第 146、203 页）。\n<\/li><li>\n<strong>第 3 章 顺序查找与按键比较的查找<\/strong>：静态最优排列、二分查找、二叉查找树、B 树（原书 §6.1–6.2，PDF 第 317、324、383 页）。\n<\/li><li>\n<strong>第 4 章 数字查找、散列与辅助键检索<\/strong>：数字查找树、Patricia、拉链与线性探查、倒排思路（原书 §6.3–6.5，PDF 第 397、413、414、418、443 页）。\n<\/ul>\n<h2>内部排序方法对照（键比较口径）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>方法<\/th><th>划分依据<\/th><th>最坏比较次数<\/th><th>平均比较次数<\/th><th>稳定性<\/th><th>前提<\/th><\/tr><\/thead><tbody><tr><td>直接插入排序<\/td><td>已排序前缀，向后插入<\/td><td><span class=\"katex-inline\">\\frac{N(N-1)}{2}<\/span><\/td><td><span class=\"katex-inline\">\\frac{N^2}{4}<\/span> 量级<\/td><td>稳定<\/td><td>顺序存储；前缀有序<\/td><\/tr><tr><td>冒泡排序<\/td><td>相邻交换，每轮定一个极值<\/td><td><span class=\"katex-inline\">O(N^2)<\/span><\/td><td><span class=\"katex-inline\">O(N^2)<\/span><\/td><td>稳定<\/td><td>顺序存储<\/td><\/tr><tr><td>快速排序<\/td><td>基准划分，两侧递归<\/td><td><span class=\"katex-inline\">O(N^2)<\/span>（偏斜划分）<\/td><td><span class=\"katex-inline\">2N\\ln N<\/span> 量级<\/td><td>不稳定<\/td><td>基准等概率落位；键可比较<\/td><\/tr><tr><td>直接选择排序<\/td><td>每轮选最小归位<\/td><td><span class=\"katex-inline\">\\frac{N(N-1)}{2}<\/span><\/td><td>同量级<\/td><td>不稳定<\/td><td>顺序存储<\/td><\/tr><tr><td>锦标赛树选择<\/td><td>二叉比较树保留首轮结果<\/td><td><span class=\"katex-inline\">N\\lg N<\/span> 量级<\/td><td>同量级<\/td><td>取决于等值规则<\/td><td>额外树结构<\/td><\/tr><tr><td>两路合并排序<\/td><td>两段有序后归并<\/td><td><span class=\"katex-inline\">N\\lg N<\/span> 量级<\/td><td><span class=\"katex-inline\">N\\lg N<\/span> 量级<\/td><td>稳定（等值取左段）<\/td><td>两段各自有序；需辅助空间<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>排序代价公式要点<\/h2>\n<ul><li>\n反序总数：排列中 <span class=\"katex-inline\">i&lt;j<\/span> 而 <span class=\"katex-inline\">K_i&gt;K_j<\/span> 的对数；交换相邻记录每消除一个反序。\n<\/li><li>\n插入排序第 <span class=\"katex-inline\">j<\/span> 个元素：最坏比较 <span class=\"katex-inline\">j-1<\/span> 次，期望比较约 <span class=\"katex-inline\">j/2<\/span> 次；求和后主项 <span class=\"katex-inline\">N^2/2<\/span>（最坏）、<span class=\"katex-inline\">N^2/4<\/span>（平均）。\n<\/li><li>\n快速排序递推：<span class=\"katex-inline\">C_N=N+1+\\frac{2}{N}\\sum_{k=0}^{N-1}C_k<\/span>，解得期望主项 <span class=\"katex-inline\">2N\\ln N<\/span>。\n<\/li><li>\n比较排序下界：决策树至少容纳 <span class=\"katex-inline\">N!<\/span> 个叶子，树高 <span class=\"katex-inline\">\\ge\\lceil\\lg N!\\rceil<\/span>；Stirling 放缩 <span class=\"katex-inline\">\\lg N!\\approx N\\lg N-1.44N<\/span>。\n<\/li><li>\n自然两路合并从现成游程起步；游程长度越长，首轮后段长越大，所需合并轮数越少。\n<\/ul>\n<h2>外部排序要点<\/h2>\n<ul><li>\n初始游程数 <span class=\"katex-inline\">S<\/span>，合并路数 <span class=\"katex-inline\">P<\/span>：合并遍数 <span class=\"katex-inline\">k=\\lceil\\log_P S\\rceil<\/span>。\n<\/li><li>\n替代选择用选择树持续输出当前最小键并补入新记录，生成的游程可长于内存容量；候选树高约 <span class=\"katex-inline\">\\lg P<\/span>。\n<\/li><li>\n外部排序记账主项是记录读写遍数，不是内存键比较；磁带顺序读写与磁盘块访问各有代价结构。\n<\/ul>\n<h2>查找方法代价对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>方法<\/th><th>索引前提<\/th><th>成功平均代价<\/th><th>失败代价<\/th><th>支持查询类型<\/th><\/tr><\/thead><tbody><tr><td>顺序查找（均匀）<\/td><td>无<\/td><td><span class=\"katex-inline\">(N+1)/2<\/span><\/td><td><span class=\"katex-inline\">N<\/span> 次比较<\/td><td>等值<\/td><\/tr><tr><td>顺序查找（加权）<\/td><td>频率已知<\/td><td><span class=\"katex-inline\">\\bar C_N=\\sum_{j=1}^N j\\,p_j<\/span><\/td><td>走完全表<\/td><td>等值；按频率降序排列最优<\/td><\/tr><tr><td>二分查找<\/td><td>表已排序<\/td><td><span class=\"katex-inline\">\\lceil\\lg(N+1)\\rceil<\/span> 量级<\/td><td>同量级<\/td><td>等值；有序表<\/td><\/tr><tr><td>二叉查找树<\/td><td>键可比较<\/td><td>平均 <span class=\"katex-inline\">\\lg N<\/span>；退化链上 <span class=\"katex-inline\">N<\/span><\/td><td>同左<\/td><td>等值；中序有序遍历<\/td><\/tr><tr><td>B 树<\/td><td>外部介质分页<\/td><td>高度 <span class=\"katex-inline\">O(\\log_m N)<\/span><\/td><td>同左<\/td><td>等值；范围<\/td><\/tr><tr><td>数字查找树 / Patricia<\/td><td>键可拆位串<\/td><td>按分歧层数<\/td><td>同左<\/td><td>前缀；部分匹配<\/td><\/tr><tr><td>拉链散列<\/td><td>散列均匀<\/td><td><span class=\"katex-inline\">1+\\alpha/2<\/span>（成功）<\/td><td><span class=\"katex-inline\">\\alpha<\/span>（失败）<\/td><td>等值<\/td><\/tr><tr><td>线性探查<\/td><td>散列均匀；低装填<\/td><td><span class=\"katex-inline\">\\tfrac12(1+\\frac{1}{1-\\alpha})<\/span>（成功）<\/td><td><span class=\"katex-inline\">\\tfrac12(1+\\frac{1}{(1-\\alpha)^2})<\/span>（失败）<\/td><td>等值<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>散列公式与装填因子<\/h2>\n<ul><li>\n装填因子 <span class=\"katex-inline\">\\alpha=N/M<\/span>：记录数除以槽位数。\n<\/li><li>\n拉链法：成功探查 <span class=\"katex-inline\">1+\\alpha/2<\/span>，失败探查约 <span class=\"katex-inline\">\\alpha<\/span>；链长随 <span class=\"katex- let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{

  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{

  });
}

function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  if(typeof vis !== 'undefined'){ networkLoaded = true; cb(); return; }
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE) { cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库未加载：离线构建请加 <code>--offline all</code>，或联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

function getMastery(cid){
  if(!cid) return 0.5;

function updateMastery(cid, delta){

}

/* ---------- 搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIndex = null;
let pendingHl = [];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP = new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                        '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                        '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw = q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out = [];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length > 2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low = text.toLowerCase();
  let pos = -1, hit = '';
  for(const t of terms){ const i = low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start = Math.max(0, (pos<0?0:pos) - 60);
  const end = Math.min(text.length, (pos<0?0:pos) + 140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms = pendingHl.slice(); pendingHl = [];
  if(!terms.length) return;
  const root = $('#view'); if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first = null, idx = -1, term = '';
  while((node = walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low = node.nodeValue.toLowerCase();
    for(const t of terms){
      const i = low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){
        first = node; idx = i; term = t;
      }
    }
  }
  if(!first) return;
  try{
    const i = first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range = document.createRange();
    range.setStart(first, i); range.setEnd(first, i+term.length);
    const mark = document.createElement('mark');
    mark.className = 'hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'), 1800);
  }catch(e){}
}
document.addEventListener('click', (e)=>{
  const a = (e.target && e.target.closest) ? e.target.closest('.search-hit a') : null;
  if(a && a.dataset.hl) pendingHl = tokenizeQuery(a.dataset.hl);

function searchHref(id){

function chapOf(id){

function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    const href = searchHref(id);

    searchIndex.push({id, href, text, label:pageTitle(id), chap:chapOf(id)});
  });
  return searchIndex;
}
function synOf(t){
  const out = [];
  for(const g of SYN_GROUPS){ if(g.indexOf(t) >= 0){ for(const x of g){ if(x !== t) out.push(x); } } }
  return out.slice(0,6);
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim();
  if(!v){ showPage(routeIdFromHash()); return; }
  const terms = tokenizeQuery(v);
  if(!terms.length){ showPage(routeIdFromHash()); return; }
  const grams = [];
  terms.forEach(t=>{ if(t.length >= 2){ for(let i=0;i+2<=t.length;i++) grams.push(t.slice(i,i+2)); } });
  const qGrams = [...new Set(grams)].slice(0,16);
  const snippetTerms = terms.concat(...terms.map(synOf)).slice(0,24);
  const hits = [];
  buildSearchIndex().forEach(p=>{
    const low = p.text.toLowerCase();
    let tHit = 0, sHit = 0, gHit = 0, first = '', viaSyn = '';
    for(const t of terms){
      if(low.includes(t)){ tHit++; if(!first) first = t; continue; }
      for(const s of synOf(t)){
        if(low.includes(s)){ sHit++; if(!viaSyn) viaSyn = s; if(!first) first = s; break; }
      }
    }
    for(const gm of qGrams){ if(low.includes(gm)) gHit++; }
    if(tHit > 0 || sHit > 0 || gHit >= 4){
      hits.push({p, score: tHit*100 + sHit*30 + Math.min(gHit,20), first, viaSyn});
    }
  });
  hits.sort((a,b)=> b.score-a.score || a.p.text.length-b.p.text.length);
  const top = hits.slice(0,20);
  let body;
  if(top.length){
    const gs = {};
    top.forEach(h=>{
      const k = h.p.chap.key;
      (gs[k] = gs[k] || {label:h.p.chap.label, order:h.p.chap.order, ref:!!h.p.chap.ref, hits:[]}).hits.push(h);
    });
    const eff = g => Math.max(...g.hits.map(x=>x.score)) * (g.ref ? 0.55 : 1);
    const order = Object.values(gs).sort((a,b)=> eff(b)-eff(a));
    body = order.map(g=>{
      const inner = g.hits.sort((a,b)=> b.score-a.score).map(h=>
        `<div class="search-hit"><a href="${h.p.href}" data-hl="${esc(h.first)}">${esc(h.p.label)}</a>${h.viaSyn?`<span class="syn-note">同义命中：${esc(h.viaSyn)}</span>`:''}<br><span class="sub">${hlSnippet(h.p.text, snippetTerms)}</span></div>`).join('');
      return `<div class="search-group"><div class="grp-head">${esc(g.label)}<span class="grp-count">${g.hits.length}</span></div>${inner}</div>`;
    }).join('');
  } else {
    body = '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语，或减少关键词。</div>';
  }
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' + body;
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof mermaid === 'undefined') return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  if(typeof mermaid !== 'undefined'){ boot(); return; }
  const urls=['https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js',
              'https://registry.npmmirror.com/mermaid/10.9.1/files/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js'];
  let ui=0, done=false;
  const tryNext=()=>{
    if(done || ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    const timer=setTimeout(()=>{ if(done) return; s.onload=null; s.onerror=null; s.remove(); tryNext(); }, 4000);
    s.onload=()=>{ done=true; clearTimeout(timer); boot(); };
    s.onerror=()=>{ clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

/* ---------- 句级出处：点击角标弹出原句 ---------- */
let citePop = null;
function closeCite(){ if(citePop){ citePop.remove(); citePop = null; } }
function showCite(id){
  const c = (typeof SOURCES !== 'undefined') ? SOURCES[id] : null;
  if(!c) return;
  closeCite();
  citePop = document.createElement('div');
  citePop.className = 'cite-pop';
  citePop.innerHTML = '<div class="cite-head">出处' + (c.page!=='' && c.page!=null ? (' · p.'+esc(String(c.page))) : '') +
    '<button class="cite-x" aria-label="关闭">×</button></div>' +
    (c.quote ? '<blockquote>'+esc(c.quote)+'</blockquote>' : '') +
    (c.zh ? '<div class="cite-zh">'+esc(c.zh)+'</div>' : '');
  document.body.appendChild(citePop);
  citePop.querySelector('.cite-x').onclick = closeCite;
}
document.addEventListener('click', e=>{
  const t = e.target.closest('.cite');
  if(t){ e.preventDefault(); showCite(t.dataset.cite); return; }
  if(citePop && !e.target.closest('.cite-pop')) closeCite();
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeCite(); });
</script>
<script id="zs-visual-init">
(function(){
  try{
    var B=document.body, H=document.documentElement;
    if(!B.dataset.theme && !H.dataset.theme) B.dataset.theme='dark';
    var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
    var scope=document.querySelectorAll('header, .topbar, .topbar-fixed, #topbar, .sidebar, .tabs, .hdr-right, .card-actions, .card-controls, .section-title, .card .icon, .icon-label');
    for(var i=0;i<scope.length;i++){
      var w=document.createTreeWalker(scope[i],NodeFilter.SHOW_TEXT,null,false), n;
      while(n=w.nextNode()){
        if(EMOJI.test(n.nodeValue)){
          n.nodeValue=n.nodeValue.replace(EMOJI,'').replace(/[ \t]+/g,' ').replace(/^ | $/g,'');
        }
      }
    }
    var btn=document.getElementById('theme-btn')||document.getElementById('theme')||document.getElementById('themeToggle');
    function label(){
      if(!btn) return;
      var light=B.dataset.theme==='light'||H.getAttribute('data-theme')==='light'||B.dataset.theme==='';
      if(btn.textContent.trim()===''||/浅色|深色/.test(btn.textContent)) btn.textContent=light?'深色':'浅色';
    }
    label();
    if(btn){
      new MutationObserver(label).observe(B,{attributes:true,attributeFilter:['data-theme']});
      new MutationObserver(label).observe(H,{attributes:true,attributeFilter:['data-theme']});
      btn.addEventListener('click',function(){setTimeout(label,0);},true);
    }
  }catch(e){}
})();
</script>
