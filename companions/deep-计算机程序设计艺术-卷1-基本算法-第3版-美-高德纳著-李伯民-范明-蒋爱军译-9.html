^{n}(n-k)+\\cdots<\/span> 这类求和式上，规模一大就看不出量级差别；两个精确式难以直接排序，压成 <span class=\"katex-inline\">O(n^2)<\/span> 与 <span class=\"katex-inline\">O(n\\log n)<\/span> 后优劣才清楚。\n<\/li><li>\n<strong>大 O 写成双向等号<\/strong>：<span class=\"katex-inline\">1/2n^2+n=O(n^2)<\/span> 成立，但反过来 <span class=\"katex-inline\">n^2=O(1/2n^2+n)<\/span> 写不回去——大 O 表示上界包含，不是两边等价。把单向包含当成相等，会在估下界时把上界误当精确值。\n<\/li><li>\n<strong>生成函数不写收敛域就做形式运算<\/strong>：母函数作为形式幂级数运算时可以暂不担心收敛；但若要代入具体 <span class=\"katex-inline\">z<\/span> 求值或用微积分结论，收敛半径不先核验，等式可能在不收敛的点上被误用。\n<\/li><li>\n<strong>求和时漏边界项<\/strong>：计数从 <span class=\"katex-inline\">k=1<\/span> 还是 <span class=\"katex-inline\">k=0<\/span> 起算、末项到 <span class=\"katex-inline\">n<\/span> 还是 <span class=\"katex-inline\">n-1<\/span>，直接改变常数项；渐进主项可能不变，但精确式与低阶项会错。典型算法分析第一步必须把下标范围钉死。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章方法回收第 1 章归纳与递推、第 2 章结构操作计数、第 3 章发生器周期与频数统计：插入删除移动元素求和对应线性表分析，周期长度计数对应递推分析。大 O 记号是后续各卷比较算法、习题答案给量级的通用语言；生成函数在计数组合、递推求解与概率母函数中反复出现。读完本章，卷一的概念层、结构层与分析层就闭合为一条链：先定义算法，再表示数据，再估计代价。<\/p>", "c01": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.20<\/div><h1>算法定义的五条特征与有穷性的边界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章（原书 §1.1）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>日常说&quot;写个算法&quot;，指的往往是一段能跑的程序。但在讨论算法性质、证明正确性、比较复杂度之前，需要先把&quot;什么算一个算法&quot;钉成可核验的条件。如果不区分&quot;有限步骤内给出结果的指令序列&quot;和&quot;可能一直运行下去的过程&quot;，就无法谈终止性保证，也无法把算法与菜谱、反应式进程、数学计算方法划清界限。书里在第一个完整算法（欧几里得求 gcd）之后回过头概括算法的含义，正是为了让后续每一个算法样例都套在同一组条件上审视（PDF 第 20–21 页）。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p>Knuth 概括的算法五条特征如下。<\/p>\n<p><strong>(1) 有限性（有穷性）<\/strong>：算法必须在执行有限步之后终止。算法 E 中，每做一次 E1 求余数，若 <span class=\"katex-inline\">r\\ne0<\/span>，下一步 E3 把 <span class=\"katex-inline\">(m,n)<\/span> 替换成 <span class=\"katex-inline\">(n,r)<\/span>，余数严格递减；一个递减的正整数序列不能无限延续，所以 E1 只会被执行有限次。书里同时提醒：步数可以取到任意大，例如选适当大的 <span class=\"katex-inline\">m,n<\/span> 可能让 E1 执行超百万次，但只要存在有限上界，就满足有限性。<\/p>\n<p><strong>(2) 确定性<\/strong>：算法每一步要执行的操作必须给出严格无歧义的说明，每种情况下做什么都有明确解释。用自然语言写步骤存在被不同读者理解出偏差的风险，因此关键算法常同时配形式化定义的程序；用计算机语言表示的计算方法称为程序（PDF 第 21 页）。<\/p>\n<p><strong>(3) 输入<\/strong>：算法具有 0 个或多个输入，即算法开始前赋给它的初始量，或执行中动态赋给它的量；输入取自特定对象集合。算法 E 的两个输入 <span class=\"katex-inline\">m,n<\/span> 都取自正整数集。<\/p>\n<p><strong>(4) 输出<\/strong>：算法具有 1 个或多个输出，即与输入存在某种指定关系的量。算法 E 有一个输出：步骤 E2 中的 <span class=\"katex-inline\">n<\/span>，它是 <span class=\"katex-inline\">m,n<\/span> 的最大公约数。<\/p>\n<p><strong>(5) 可行性（有效性）<\/strong>：所有操作必须足够基本，原则上可以用笔和纸在有限时间内准确执行。E 的操作包括整数相除、检验整数是否为 0、置改变量值，这些都能用有限形式写在纸上并由有限除法完成。<\/p>\n<p><strong>只缺有限性的过程<\/strong>：书里称一个具备其余四条特征、但可能不终止的过程为计算方法。两条线段长度不可通约时求&quot;最大公度&quot;的过程不终止；与环境不断交互的反应式进程也是例子（PDF 第 20 页）。<\/p>\n<h2>原理推导：五条条件怎样落到一个样例上<\/h2>\n<p>以算法 E 为对照逐项核验。输入：两个正整数 <span class=\"katex-inline\">m,n<\/span>。输出：<span class=\"katex-inline\">\\gcd(m,n)<\/span>。可行性：余数、判零、赋值都是基本操作。确定性：除法 <span class=\"katex-inline\">m=qn+r<\/span> 中 <span class=\"katex-inline\">q,r<\/span> 由 <span class=\"katex-inline\">m,n<\/span> 唯一确定，分支&quot;<span class=\"katex-inline\">r=0<\/span>&quot;与&quot;<span class=\"katex-inline\">r\\ne0<\/span>&quot;覆盖全部情形。有限性：设第 <span class=\"katex-inline\">k<\/span> 步余数为 <span class=\"katex-inline\">r_k<\/span>，则 <span class=\"katex-inline\">n&gt;r_1&gt;r_2&gt;\\cdots\\ge0<\/span>，严格递减的非负整数序列长度有限，必然在某一步取到 0。<\/p>\n<p>反过来看终止性证明的结构：有限性不是靠&quot;直觉上很快就完&quot;，而是靠一个单调递减量——余数每步下降，整数良序保证不能无限下降。若某算法找不到这样一个单调量，就不能仅凭步骤描述声称满足有限性。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：讨论对象是离散、可分步描述的指令序列；输入集合与操作语义明确。\n<\/li><li>\n失败案例 1：菜谱式步骤&quot;加少许盐&quot;&quot;轻轻搅拌直到均匀混合&quot;。它有输入（鸡蛋面粉）与输出（菜），但&quot;少许&quot;&quot;均匀混合&quot;缺乏无歧义解释，确定性不满足；书里用这个对照说明算法描述必须达到连计算机也能照做的程度。\n<\/li><li>\n失败案例 2：&quot;若 4 是使方程 <span class=\"katex-inline\">w^n+x^n+y^n=z^n<\/span> 存在正整数解的最大整数，转到步骤 E4。&quot;这类操作依赖尚未构造出的判定结果，不可行（PDF 第 21 页）。\n<\/li><li>\n边界：有限性只要求步数有限，不限制步数上界有多大；<span class=\"katex-inline\">O(\\log n)<\/span> 与 <span class=\"katex-inline\">O(n!)<\/span> 的算法都满足有限性。有限性也不保证算法最优或正确，只保证它会停下来。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>算法 vs 程序<\/strong>：程序是用计算机语言表示的计算方法；一个程序可以是不终止的后台服务，因此程序未必满足算法的有限性条件。算法强调性质集合，程序强调表示形式。\n<\/li><li>\n<strong>有限性 vs 可行性<\/strong>：有限性管&quot;会不会停&quot;，可行性管&quot;每一步能不能纸笔完成&quot;。一个每步都可行、却证明不出终止上界的过程，卡在有限性这条上；反之步骤无法在有限形式内完成的操作，卡在可行性这条上。\n<\/li><li>\n<strong>算法 vs 计算方法<\/strong>：计算方法覆盖范围更宽，只要求确定、可执行；算法额外加上有限终止。反应式服务、操作系统内核按本书分类属于计算方法，不是算法。\n<\/li><li>\n<strong>确定性 vs 输出正确<\/strong>：确定性要求步骤无歧义，不要求结果对；确定性满足但逻辑错误的算法仍然存在，正确性要另靠证明（见 c03、c04）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无（本单元起点概念）。后继：c02 讨论算法在虚构机器 MIX 上怎样计步；c03 的归纳法用于证明算法对所有输入成立；c04 用 gcd 不变量与余数递减量同时完成正确性与有限性论证。五条特征也是第 3 章判断发生器是否可接受的底层参照——发生器递推每步确定可行，但周期与终止性要单独分析。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（算法定义的五条特征与有穷性的边界）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：算法五条特征的依赖链、逐条核验与边界算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把一个操作序列认定为算法，先往回追四层前提：<\/p>\n<ol><li>\n最底层是操作语义：每一步动作必须能写成明确符号，对象取自确定集合。没有明确语义，后面谈终止性、确定性都没有附着点。\n<\/li><li>\n再往上是输入与输出边界：算法开始前有初始量，结束时给出与输入有指定关系的结果。输入集合不清，可行性无法核验；输出关系不定，正确性无从判断。\n<\/li><li>\n然后是执行可控性：每步操作足够基本，纸笔可完成；步骤之间无歧义，同一输入走到同一分支。\n<\/li><li>\n最上层是终止性：存在一个有限上界，保证过程在有限步内结束。有限性是算法与一般计算方法的分界。\n<\/ol>\n<p>依赖链方向：明确操作语义 → 划定输入输出 → 核验每步可行且确定 → 证明有限终止。任何一层缺失，对象都不能按算法对待。<\/p>\n<h2>正向推导：五条特征在样例算法上逐条落地<\/h2>\n<p>以算法 E（求 gcd）为样例，按顺序核验。<\/p>\n<p><strong>第一步，输入核验<\/strong>。算法 E 接收两个正整数 <span class=\"katex-inline\">m,n<\/span>。输入集合限定为正整数集；若输入是 <span class=\"katex-inline\">-\\pi<\/span>、<span class=\"katex-inline\">-8<\/span> 或 0，余数含义在书里指出并无一般共识，确定性条件无法满足。所以算法前置假设里写明 <span class=\"katex-inline\">m,n<\/span> 为正整数。<\/p>\n<p><strong>第二步，可行性核验<\/strong>。E1 做整数除法 <span class=\"katex-inline\">m=qn+r<\/span>；E2 检验 <span class=\"katex-inline\">r<\/span> 是否为 0；E3 执行两个赋值。这些动作都能在有限形式内写在纸上：除法有有限长除法算法，判零是符号比较，赋值是记录替换。不存在&quot;构造出满足某性质的最大整数&quot;这类需要未完成判定的操作。<\/p>\n<p><strong>第三步，确定性核验<\/strong>。除法给出唯一商 <span class=\"katex-inline\">q<\/span> 与余数 <span class=\"katex-inline\">r<\/span>；分支只有两条：<span class=\"katex-inline\">r=0<\/span> 与 <span class=\"katex-inline\">r\\ne0<\/span>，覆盖全部情形。自然语言步骤旁配机器语言程序，是为了消除读者理解偏差；程序语句本身不存在第二种读法。<\/p>\n<p><strong>第四步，输出核验<\/strong>。E2 终止时返回的 <span class=\"katex-inline\">n<\/span> 是 <span class=\"katex-inline\">m,n<\/span> 的最大公约数。输出与输入的指定关系是&quot;同时整除二者的最大正整数&quot;，正确性证明另由 gcd 不变量承担（见 c04）。<\/p>\n<p><strong>第五步，有限性核验<\/strong>。设第 <span class=\"katex-inline\">k<\/span> 轮余数为 <span class=\"katex-inline\">r_k<\/span>，E1 要求 <span class=\"katex-inline\">0\\le r_k&lt;n<\/span>，E3 后新 <span class=\"katex-inline\">n<\/span> 等于上一轮 <span class=\"katex-inline\">r_k<\/span>，所以 <span class=\"katex-inline\">r_{k+1}&lt;r_k<\/span>。<span class=\"katex-inline\">r_k<\/span> 是非负整数且严格递减；非负整数不能无限递减，序列必在某步取到 0，E2 终止。这一步找的是单调递减量，而不是凭感觉判断&quot;很快会完&quot;。<\/p>\n<h2>数值算例：两个边界过程对照<\/h2>\n<p><strong>算例 1：满足四条、缺有限性的计算方法<\/strong>。设想过程：从 2 开始逐个检查整数是否为素数，发现素数就记录下来，永不停止。输入为空或给定下界；每步判素数可行；分支确定；输出是一列素数。唯独有限性不满足：素数无穷多，过程不会终止。按本书分类，它是计算方法，不是算法。反应式进程与环境持续交互，属于同类。<\/p>\n<p><strong>算例 2：有限但不可行的步骤<\/strong>。书里给出的反例：&quot;如果 4 是使 <span class=\"katex-inline\">w^n+x^n+y^n=z^n<\/span> 存在正整数解的最大整数，转到步骤 E4。&quot;这一步要求先判定一个尚未构造出的最大整数是否存在；在判定结果可构造之前，操作无法纸笔完成。它即使形式上有输入输出，也卡在可行性条件上。<\/p>\n<p><strong>算例 3：确定性不足的菜谱<\/strong>。&quot;加少许盐&quot;&quot;轻轻搅拌直到均匀混合&quot;。&quot;少许&quot;没有量词边界，&quot;均匀混合&quot;没有可核验判据；不同执行者会得到不同动作。菜谱有输入有输出，确定性不满足。对照说明：算法描述必须达到连计算机也能照做的程度。<\/p>\n<h2>延伸推演：有限性与复杂度上界的关系<\/h2>\n<p>有限性只要求存在有限上界，不对上界大小做限制。<span class=\"katex-inline\">O(\\log n)<\/span> 的算法、<span class=\"katex-inline\">O(n^2)<\/span> 的算法、<span class=\"katex-inline\">O(n!)<\/span> 的算法都满足有限性；步数随输入爆炸只影响实用价值，不改变算法身份。讨论复杂度时说的最坏上界，是对这个&quot;有限&quot;定量刻画：上界越紧，分析越有价值。<\/p>\n<p>进一步，终止性证明在算法分析里承担两类角色。一类像余数递减：找到一个严格下降的整数/半整数度量，由良序原理推出有限。另一类像状态有限：状态集合有限且每步转入确定状态，重复即循环，从而必然终止或进入可识别循环。两类证明都需要把&quot;什么在下降、什么在循环&quot;写出来。<\/p>\n<h2>对抗性追问：有限性能不能靠运行很久没停来反证<\/h2>\n<p>不能。运行 <span class=\"katex-inline\">10^6<\/span> 步仍在执行，既不能证明算法满足有限性，也不能证明不满足；有限性是命题级别的结论，要靠结构论证。反过来，证明出单调递减量或状态有限，才是有限性的依据。测试覆盖的是已执行路径，未执行路径上的循环要靠证明排除。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n算法五条特征分别是什么？哪一条是算法与计算方法的分界？\n<\/li><li>\n确定性与正确性各约束什么？确定性满足的算法是否一定结果正确？\n<\/li><li>\n可行性与有限性回答的问题有何差别？各举一个卡在该条件上的例子。\n<\/li><li>\n证明 E 终止时找的单调量是什么？为什么严格递减的非负整数序列不能无限延续？\n<\/li><li>\n有限性是否限制步数上界的大小？<span class=\"katex-inline\">O(n!)<\/span> 的过程算不算算法？\n<\/ol>\n<h2>延伸推演：五类对象按五特征归类<\/h2>\n<p>把常见计算对象放到五条特征上逐项对照，可以看清分类边界。<\/p>\n<p><strong>批处理程序<\/strong>：输入文件、输出文件，步骤确定可行，正常路径有限终止，五条齐备，对应算法的程序实现。<strong>后台服务进程<\/strong>：输入来自持续到达的请求，输出为响应；每步确定可行，但设计上不终止，缺有限性，归计算方法。<strong>数学证明过程<\/strong>：从公理出发的有限推演，有前提有结论，每步可行确定；若证明策略要求遍历无穷对象才能判定，则不满足可行性。<strong>硬件组合逻辑<\/strong>：输入到输出的映射即时完成，没有步骤序列，不构成&quot;操作序列&quot;意义上的算法；它是电路实现，不是算法描述。<strong>查表过程<\/strong>：有限条目查表，输入索引、输出表项，动作是定位与复制，五条齐备，是最简单的一类算法。<\/p>\n<p>归类时容易混淆的是&quot;程序&quot;与&quot;算法&quot;。程序是表示载体：同一算法可以写成不同语言的程序；同一程序也可能不终止。算法是性质集合，程序是文本形式，两者不在同一层。<\/p>\n<h2>第二算例：识别不可行步骤<\/h2>\n<p>给定一段描述：&quot;检验是否存在整数解 <span class=\"katex-inline\">w,x,y,z<\/span> 满足 <span class=\"katex-inline\">w^n+x^n+y^n=z^n<\/span>，若存在则转到 E4。&quot;分步拆：<\/p>\n<ol><li>\n输入：方程与指数 <span class=\"katex-inline\">n<\/span>；\n<\/li><li>\n待执行动作：判定该丢番图方程是否有正整数解；\n<\/li><li>\n可行性检查：判定结果需要在有限步内构造出来；在没有给出判定算法之前，这一步依赖一个未完成的存在性构造，不能纸笔准确执行；\n<\/li><li>\n结论：该步骤卡在可行性条件，整段描述不能按算法对待。\n<\/ol>\n<p>对照书里另一类反例：反应式进程每步可行确定，但不终止，卡在有限性。两类反例位置不同：一个卡在操作可执行性，一个卡在终止保证。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;能跑出结果就是算法&quot;。<\/strong> 跑出结果只说明本次运行成功；算法身份要求对输入集合内所有输入都有终止保证。单次成功不覆盖未测输入。\n<\/li><li>\n<strong>误解二：&quot;步骤越简单越可行&quot;。<\/strong> 可行性看操作能否有限形式完成，不看步骤数量；复杂但可分解为基本动作的操作可行，依赖未构造判定的操作再简单也不可行。\n<\/li><li>\n<strong>误解三：&quot;自然语言写的步骤不算确定&quot;。<\/strong> 自然语言可以达到确定性，前提是每个分支、每个对象集合都无歧义；书里用自然语言加机器语言双写，是为了消除理解偏差，不是否定自然语言本身。\n<\/li><li>\n<strong>误解四：&quot;没有输入就不是算法&quot;。<\/strong> 特征允许 0 个输入；无输入算法每次运行由内部状态决定输出，例如固定常数表的生成过程。\n<\/ul>\n<h2>推演补充：确定性分支的覆盖核验<\/h2>\n<p>确定性要求每种情况执行操作有明确说明。核验一个算法的分支是否覆盖全部情形，做法是把输入对象集合按条件切分：主分支 <span class=\"katex-inline\">r=0<\/span> 对应余数为零的情形，补充分支 <span class=\"katex-inline\">r\\ne0<\/span> 对应其余情形；两支的并集是全部非负余数，交集为空。若描述中出现&quot;视情况而定&quot;&quot;必要时调整&quot;这类未定义分支，确定性缺口就在这里。<\/p>\n<p>输入集合的限定同样服务确定性。算法 E 假设 <span class=\"katex-inline\">m,n<\/span> 为正整数；若放开到负整数，<span class=\"katex-inline\">-8<\/span> 除以 <span class=\"katex-inline\">-\\pi<\/span> 的余数在不同数论约定下结果不同，书里明确指出此时余数含义没有一般共识。确定的对象集合是确定性可核验的前提：集合边界不清，分支判断就失去依据。<\/p>\n<h2>推演补充：输出与输入的指定关系<\/h2>\n<p>输出不是任意结果，必须与输入保持指定关系。算法 E 的输出 <span class=\"katex-inline\">n<\/span> 满足两条：整除 <span class=\"katex-inline\">m<\/span> 与 <span class=\"katex-inline\">n<\/span>，且大于任何其他公共约数。关系写不出，正确性就没有核验标准；反过来，只说&quot;给出相关结果&quot;而不写关系，输出合格与否无法判断。可行性条款还要求构造输出的每一步基本可执行，不能依赖无穷小数展开或未完成的存在性判定。<\/p>\n<h2>边界对照：算法概念在后续章节的落点<\/h2>\n<p>第 3 章发生器递推每步确定可行，状态有限必然回到旧状态，终止性表现为周期闭环；第 2 章表与树的遍历算法，输入是结构、输出是访问序列，可行性落在结点访问与链字段更新上。回看本章五特征，可以把后面每个新算法都拆成：输入集合、输出关系、基本操作清单、分支说明、终止度量五项分别登记，这也是读习题时自检算法描述完整度的固定清单。<\/p>\n<h2>推演补充：有限性证明的两类度量<\/h2>\n<p>终止性证明在全书反复出现，归纳起来有两类度量。第一类是单调递减量：余数、规模、剩余步数严格下降，由良序原理推出有限。第二类是状态有限：状态集合大小有界，每步转入确定状态，重复即闭环，过程必然终止或进入可识别循环。<\/p>\n<p>两类度量对应不同算法场景：欧几里得算法用余数递减；发生器用状态有限闭环；递归遍历用子树规模递减；调度类算法常合并两类——既看剩余任务量，也看状态是否重复。读一个新算法时，先找&quot;什么在下降&quot;或&quot;什么在重复&quot;，终止性论证就有了抓手。<\/p>\n<h2>推演补充：算法描述的记号约定<\/h2>\n<p>书里算法步骤以标识字母加数字编号，如 E1、E2；每步以方括号短语概括动作，后接文字注释说明变量不变量或当前目标。赋值箭头 <span class=\"katex-inline\">m\\leftarrow n<\/span> 表示用 <span class=\"katex-inline\">n<\/span> 的当前值替换 <span class=\"katex-inline\">m<\/span>；等号 <span class=\"katex-inline\">=<\/span> 表示可检验条件，箭头与等号不混用。多变量同值可连写 <span class=\"katex-inline\">n\\leftarrow r\\leftarrow s<\/span>；交换两值可写 <span class=\"katex-inline\">m\\leftrightarrow n<\/span>，或借临时变量 <span class=\"katex-inline\">t<\/span> 完成。<\/p>\n<p>这套记号是全书算法样例的通用格式：步骤编号便于交叉引用，概括短语对应流程图框，注释承担不变量说明。后续读 §1.3 机器语言程序、§1.4 子程序与协同程序时，这套步骤格式保持不变。<\/p>\n<h2>第三算例：五条特征逐项登记样例<\/h2>\n<p>以&quot;求数组最大值&quot;算法（书里 §1.2.10 算法 M 方向，PDF 第 93 页）做登记：<\/p>\n<ol><li>\n输入：<span class=\"katex-inline\">n<\/span> 个元素 <span class=\"katex-inline\">X[1],\\dots,X[n]<\/span>；\n<\/li><li>\n输出：最大值及其下标；\n<\/li><li>\n可行性：比较两元素、更新记录、递减计数器均为基本操作；\n<\/li><li>\n确定性：<span class=\"katex-inline\">X[k]\\le m<\/span> 与 <span class=\"katex-inline\">X[k]&gt;m<\/span> 两支覆盖全部比较结果；\n<\/li><li>\n有限性：计数器 <span class=\"katex-inline\">k<\/span> 从 <span class=\"katex-inline\">n-1<\/span> 递减到 0，严格递减有限步。\n<\/ol>\n<p>五项登记齐全，才符合本书对一个算法样例的描述要求；缺终止度量的过程，在书里归入计算方法而非算法。<\/p><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.116<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">算法定义的五条特征与有穷性的边界<\/a><\/span><\/div><h1>MIX 与现代机器：为什么用假机器计步<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章（原书 §1.3.1）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>分析一个算法在机器上跑多久，最直接的想法是对着某款真机数指令。但真机每隔几年换代，指令集带大量与算法主题无关的硬件特性；今天选机器 X，没有机器 X 的读者会认为书只写给 X 用户，而机器 X 过两年推出 X+1、X+10，书中描述又可能过时。书里需要一台规则简单、跨年代稳定、又能代表一类通用计算机的抽象机器，用来描述算法、做指令级计步。MIX 就是为这个位置设计的（PDF 第 116 页）。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>MIX 定位<\/strong>：书里反复使用的一台虚拟计算机，酷似 20 世纪 60、70 年代的每一种计算机；机器语言设计功能足以给大多数算法写简短程序，指令集本身简单易学。MIX 被称为一台&quot;多不饱和计算机&quot;（可从多方面扩展），它有一个标识符 1009，这个号码是 16 台与 MIX 非常相似的真实计算机标识符的算术平均值（PDF 第 116 页）。<\/p>\n<p><strong>数据单位<\/strong>：MIX 数据的基本单位是字节（byte）。每个字节包含数量不确定的信息，但至少能保存 64 个不同值，也至多包含 100 个不同值；因此二进制视角下一个字节必然是 6 位，十进制视角下一个字节必然是两位数字。<\/p>\n<p><strong>双基数视角<\/strong>：MIX 同时采用二进制和十进制，程序员实际并不知道自己在为以 2 还是以 10 为基数的机器编四则运算；无论在哪种计算机上，用 MIX 写的算法稍作修改即可使用，模拟 MIX 也很容易。习惯二进制机器的程序员可以把 MIX 看成二进制制，习惯十进制的看成十进制制。<\/p>\n<p><strong>后继机器 MMIX<\/strong>：书里注明 MIX 如今已完全过时，后续版本改用一台新计算机 MMIX，用 2009 的罗马数字表示；MMIX 是 64 位 RISC，比 MIX 更精致，会与 20 世纪 90 年代主流计算机相似（PDF 第 116 页）。本卷样例仍以 MIX 为准。<\/p>\n<h2>原理推导与推演：假机器在分析链条里承担什么角色<\/h2>\n<p>第一步，算法先写成与机器无关的步骤序列（如算法 E 的 E1–E3）。第二步，要估执行代价时，需要一个统一的代价单位：一次数据传送、一次加法、一次比较各计多少步。MIX 提供这套稳定的指令词汇：寄存器、字节字、跳转、算术运算都有固定表示。第三步，在 MIX 程序上统计各类指令出现次数，再乘以对应代价，得到算法的执行步数估计。<\/p>\n<p>用抽象机器计步的好处是，同一套步数估计不被某款芯片的缓存延迟、流水线宽度干扰；读者哪怕手头没有 MIX 硬件，也能按规则手算模拟。书里提到，许多志愿者已为 MIX 编写模拟程序，模拟程序适合教学目的，因为它们比实际机器更容易使用。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：讨论对象是通用算法的指令级行为；需要跨硬件比较步数，而不是测某一机型上的实际时钟。\n<\/li><li>\n失败案例：直接拿真机跑分做算法结论。真机成绩受编译器优化、内存层级、主频、数据预热影响，换一批输入或换一代芯片，排名可能翻转；用真机读数代替抽象计步，结论绑死在具体环境。\n<\/li><li>\n边界：MIX 计步得到的是指令次数量级，不是墙钟时间；它不刻画现代机器的分支预测、SIMD、并发等特征。MMIX 作为后继，定位同样是教学与分析用抽象机，不是某款在售 CPU 的文档。\n<\/li><li>\n误用提醒：把 MIX 指令格式当成当代汇编规范去读现代机器代码，会对位宽、字节定义产生错位预期；两者只在&quot;取指—执行—写回&quot;的通用模型上对应。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>MIX vs 真机<\/strong>：真机服务运行程序，MIX 服务描述与分析算法；真机必须接外设、管中断，MIX 只保留最精简的运算与存储模型。\n<\/li><li>\n<strong>MIX vs 高级语言<\/strong>：高级语言隐藏寄存器与字节操作，便于表达数据结构；MIX 贴近机器，便于看清一条算法操作落到哪些基本动作上。书里两种写法都给：自然语言步骤配机器语言程序。\n<\/li><li>\n<strong>标识符 1009 的含义<\/strong>：1009 不是指令条数，也不是内存容量，而是 16 台相似真机编号取整后的平均值；它是 MIX 谱系位置的记号，不要读成主频或字长。\n<\/li><li>\n<strong>字节定义的时代差异<\/strong>：MIX 字节至少 64 个值、至多 100 个值；1975 年以后字节演变为固定 8 位、可表示 0 到 255。读 MIX 样例时要按书里的传统意义理解字节，不能用现代 8 位定义倒推。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的算法五条特征——MIX 上的程序正是确定性、可行性落到指令级的载体。后继：c08 的顺序/链接分配在 MIX 内存模型里表示；c07 的遍历栈用到 MIX 式栈与寄存器概念。抽象机器计步的思路贯穿全书习题答案与算法分析，第 4 章把指令计数汇总成求和与渐进估计。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（MIX 与现代机器：为什么用假机器计步）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：MIX 作为分析基准机器的依赖链、计步推演与边界<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>为什么书里需要一台虚构机器，先往回追三层：<\/p>\n<ol><li>\n算法分析要把&quot;跑多久&quot;变成可比较的数字。数字必须有统一单位：一次传送、一次加法、一次比较各计多少。没有统一单位，不同算法的代价无法排序。\n<\/li><li>\n统一单位不能绑死在某款真机上。真机换代快，指令集带外设、中断、缓存等与算法主题无关的特性；选真机 X，读者群被限定为 X 用户，两年后 X 又被 X+1 取代。\n<\/li><li>\n因此需要一台规则极简、跨年代稳定、又能代表通用计算机模型的抽象机器。它保留取指、执行、写回的通用结构，剥除硬件细节；MIX 承担这个位置，后继为 MMIX。\n<\/ol>\n<p>依赖链方向：需要可比较的代价单位 → 单位不能随真机换代失效 → 抽象机器提供稳定指令词汇 → 在抽象机上统计指令次数 → 汇总成算法步数估计。<\/p>\n<h2>正向推导（逐步推演）：从算法步骤到 MIX 计步的完整链条<\/h2>\n<p><strong>第一步，写与机器无关的算法骨架<\/strong>。先把操作写成 E1–E3 这类步骤序列，明确输入、输出、分支与循环。这一层不出现任何机器指令。<\/p>\n<p><strong>第二步，确定代价词汇<\/strong>。MIX 模型里数据单位是字节：一个字节至少保存 64 个不同值，至多包含 100 个不同值；二进制视角下字节为 6 位，十进制视角下为两位数字。寄存器保存字，链字段保存结点位置，跳转对应分支。<\/p>\n<p><strong>第三步，把骨架翻成 MIX 程序<\/strong>。每条高级操作对应若干基本指令：数据传送、算术运算、比较、条件跳转。书里同时给自然语言步骤与机器语言程序，前者讲清意图，后者供计步。<\/p>\n<p><strong>第四步，统计指令次数<\/strong>。按输入规模 <span class=\"katex-inline\">n<\/span> 分类计数：循环体执行几次，比较做几次，更新发生几次。把各类指令次数乘对应代价，加总成该输入下的步数。<\/p>\n<p><strong>第五步，汇总成量级<\/strong>。对所有输入或随机输入求和，再用第 4 章的求和与大 O 记号压成渐进表达式。MIX 在这一步只提供计数基准，不提供墙钟时间。<\/p>\n<h2>数值算例：标识符 1009 与字节位宽对照<\/h2>\n<p><strong>算例 1：1009 是什么<\/strong>。MIX 标识符 1009 是 16 台与 MIX 相似的真实计算机标识符的算术平均值，取整得到。算式方向为：把 16 个真机编号相加后除以 16，向下取整。它不是指令条数，不是内存容量，也不是主频；它标记 MIX 在计算机谱系中的位置。<\/p>\n<p><strong>算例 2：双基数视角下的字节<\/strong>。若按二进制解释，6 位可表示 <span class=\"katex-inline\">2^6=64<\/span> 个值，落在&quot;至少 64&quot;的下界；若按十进制解释，两位数字可表示 <span class=\"katex-inline\">10^2=100<\/span> 个值，落在&quot;至多 100&quot;的上界。MIX 程序员不必知道当前为哪种基数：同一套 MIX 程序在二进制机与十进制机上稍作修改即可运行，模拟程序也容易实现。<\/p>\n<p><strong>算例 3：MIX 与 MMIX 的代际差<\/strong>。MIX 是 20 世纪 60、70 年代风格的精简指令计算机；MMIX 用 2009 的罗马数字命名，是 64 位 RISC，定位与 20 世纪 90 年代主流计算机相似。本卷习题与样例仍按 MIX 描述；读后续材料遇到 MMIX 时，两者角色相同，都是教学与分析用抽象机。<\/p>\n<h2>延伸推演：抽象机计步与现代真机性能的距离<\/h2>\n<p>MIX 计步得到的是指令次数量级。现代程序的实际墙钟时间还受缓存命中、分支预测、流水线停顿、SIMD 宽度、内存带宽影响；这些因素在 MIX 模型里没有对应字段。因此 MIX 步数适合比较算法渐近量级，不适合预测某款芯片上的毫秒数。<\/p>\n<p>反过来，抽象机也不能替代真实测量。渐近比较在大 <span class=\"katex-inline\">n<\/span> 上可靠；小规模输入下常数因子、数据布局、语言运行时可能逆转排名。完整分析路径是：抽象机计步给量级，原型测量给常数与工程现实，两者对照使用。<\/p>\n<h2>对抗性追问：为什么不直接用高级语言做计步基准<\/h2>\n<p>高级语言隐藏寄存器与字节操作，表达数据结构方便，但语句到基本动作的映射不固定：同一行赋值在不同编译器下生成的指令数不同。若以高级语句为单位计数，代价随编译策略漂移，基准不稳定。MIX 贴近机器一侧，正是为了让计数对象落在固定、可复核的基本动作上。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nMIX 的标识符 1009 是怎么来的？它不是哪三类指标？\n<\/li><li>\nMIX 字节在二进制与十进制视角下各对应几位？取值范围上下界是多少？\n<\/li><li>\n用抽象机器计步得到的是什么量？为什么不能直接换算成墙钟时间？\n<\/li><li>\n从算法骨架到步数估计分哪五步？MIX 在哪一步进入链条？\n<\/li><li>\nMMIX 与 MIX 的关系是什么？两者共同承担什么角色？\n<\/ol>\n<h2>延伸推演：抽象机指令模型与现代 RISC 的对应<\/h2>\n<p>MIX 保留的通用模型有四层：取指（按地址读指令）、译码（解释操作码与字段）、执行（算术/逻辑/传送）、写回（结果写入寄存器或存储）。现代 RISC 同样遵循这四层，差别在具体字段宽度、寻址方式与流水线组织。拿 MIX 程序与现代汇编对照时，可对应的是操作类别：数据传送对应 load/store，算术对应 add/mul，条件分支对应跳转，地址计算对应偏移寻址。<\/p>\n<p>不可对应的部分要单列：现代机器的缓存层级、分支预测、乱序执行、向量扩展在 MIX 模型里没有字段；MIX 也不刻画特权级、中断向量与外设接口。读 MIX 样例时把它当成&quot;通用计算机的最小公约数&quot;，而不是某一代真实芯片的手册。<\/p>\n<h2>第二算例：字节与字长推算<\/h2>\n<p>MIX 字节至少存 64 个值、至多存 100 个值。按二进制：<span class=\"katex-inline\">2^6=64<\/span>，<span class=\"katex-inline\">2^7=128&gt;100<\/span>，所以二进制视角字节为 6 位；按十进制：两位数字覆盖 <span class=\"katex-inline\">00<\/span> 到 <span class=\"katex-inline\">99<\/span> 共 100 个值。一个 MIX 字由若干字节组成，字内各字节可拆可合；指令格式里地址字段、符号位、字段说明都在这个字宽内安排。<\/p>\n<p>对照现代定义：1975 年以后字节固定为 8 位，可表示 0 到 255；读 MIX 时不能用 8 位反推其字节取值范围，否则会把 6 位/两位数字的样例计算改错。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;假机器计步不如真机跑分客观&quot;。<\/strong> 抽象机计数剔除了硬件波动，比较的是算法内在代价；真机测量包含编译与环境因素，两者用途不同。\n<\/li><li>\n<strong>误解二：&quot;学会 MIX 指令就掌握了当代汇编&quot;。<\/strong> MIX 训练的是寄存器、栈、寻址的通用概念；当代指令集的具体编码、特权指令、内存模型仍需另学。\n<\/li><li>\n<strong>误解三：&quot;1009 是 MIX 的内存大小&quot;。<\/strong> 1009 是 16 台相似真机编号的均值取整，属谱系记号；内存容量、指令条数、字长都另有定义。\n<\/li><li>\n<strong>误解四：&quot;MIX 只能模拟不能实际运行&quot;。<\/strong> 书里注明许多志愿者为 MIX 写了模拟程序，模拟程序适合教学，执行甚至比实际机器更容易使用。\n<\/ul>\n<h2>推演补充：计步单位与代价归类<\/h2>\n<p>在 MIX 模型上统计指令时，先把指令分入几类代价桶：数据传送类（取数、存数、置字）、算术类（加减乘除）、比较与分支类、地址计算类。每类给一个单位代价，循环体按执行次数乘开，再累加所有桶。书里分析典型算法时，计数对象通常是比较次数、更新次数、循环轮次，而不是笼统的&quot;运行时间&quot;。<\/p>\n<p>代价归类要注意边界：一次加法包含取操作数与写回，若模型按完整指令计步，取数与写回已含在指令内；若拆成微操作计步，需另行登记。选择哪一层计步，前后章节要保持一致，否则同类指令在不同算法间不可比。<\/p>\n<h2>推演补充：为什么抽象机仍要保留机器视角<\/h2>\n<p>书里解释选面向机器语言的理由有几点：程序员受编程语言影响深，理解面向机器的语言后更倾向设计效率更高的方法；所用程序通常短小，有台合适计算机就能理解；高级语言不适合讨论协同程序、随机数生成、多精度算术与内存有效使用的底层细节；学机器语言是计算机基础；无论如何都需要某种机器语言作为示例程序的输出载体。<\/p>\n<p>对应到学习路径：先读与机器无关的算法骨架，再落到 MIX 指令看基本动作，最后在抽象机上计数。跳过中间直接读当代真机，容易被特定硬件细节牵走；只停在骨架层，又看不到一条算法操作拆成哪些基本动作。<\/p>\n<h2>边界对照：抽象机在全书分析中的位置<\/h2>\n<p>§1.3 之后的习题与样例反复引用 MIX：子程序调用在 MIX 栈上保存返回地址，协同程序交换执行权，解释程序按指令表分发。c08 的结点链字段、c07 的遍历栈，都可以翻译成 MIX 内存字与寄存器操作。抽象机是连接算法描述与内存结构的中间层，第 4 章求和得到的操作次数，最终也要落到这一层的指令计数上。<\/p>\n<h2>推演补充：MIX 程序结构的固定部件<\/h2>\n<p>一段 MIX 程序通常包含几类固定部件：指令序列本身、常量与字面值、工作单元（临时保存的寄存器值）、入口与出口衔接。子程序调用时把返回地址压栈，保存现场寄存器；返回时恢复现场并跳转回调用点。协同程序的特点是互相交换执行权，不像子程序那样单向返回。<\/p>\n<p>解释程序读取指令表，按操作码分发到对应处理 routine；追踪程序在执行间隙记录现场，用于调试与步数统计。这些结构在 §1.4 基本程序设计技术中展开，机器模型统一以 MIX 为准。理解这些部件，关键是看清每个寄存器与内存字保存什么状态，而不是死记指令编码。<\/p>\n<h2>推演补充：虚构机器设计的取舍标准<\/h2>\n<p>书里选虚构机器而非特定真机，背后的取舍标准有几条：规则简单到一小时内能掌握；与历史上多种计算机相似，学完容易迁移；指令集足以表达算法协同、随机数、多精度算术等底层细节；程序短小，便于纸笔模拟。<\/p>\n<p>反过来，虚构机器不追求什么：不刻画现代缓存层次与并行机制；不提供外设与特权指令；不反映某一代芯片的具体时序。MIX 定位是教学与分析基准，不是工业实现手册。后继 MMIX 同样遵循这一定位，只把字宽与指令风格更新到 64 位 RISC 时代。<\/p>\n<h2>第三算例：MIX 与现代概念的对照映射<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>MIX 概念<\/th><th>现代对应<\/th><th>不可直接对应部分<\/th><\/tr><\/thead><tbody><tr><td>寄存器<\/td><td>通用寄存器<\/td><td>寄存器数量、位数定义不同<\/td><\/tr><tr><td>字节/字<\/td><td>内存字节/机器字<\/td><td>字节位宽定义随时代变化<\/td><\/tr><tr><td>条件跳转<\/td><td>条件分支指令<\/td><td>标志位设置方式不同<\/td><\/tr><tr><td>栈与返回地址<\/td><td>调用栈帧<\/td><td>栈帧布局与特权处理不同<\/td><\/tr><tr><td>链字段<\/td><td>指针/索引<\/td><td>指针长度与寻址方式不同<\/td><\/tr><\/tbody><\/table><\/div>\n<p>读对照表时先抓通用模型，再把不可对应部分单列；用 MIX 样例理解&quot;算法怎样落到基本动作&quot;，不要把它当成当代汇编规范去套真实芯片代码。<\/p><\/div><\/details>", "c03": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.25<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">算法定义的五条特征与有穷性的边界<\/a><\/span><\/div><h1>数学归纳法：三种形式与常见误用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章（原书 §1.2.1）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>命题 <span class=\"katex-inline\">P(n)<\/span> 对所有正整数 <span class=\"katex-inline\">n<\/span> 成立时，逐个 <span class=\"katex-inline\">n<\/span> 验证不可行——整数没有尽头。归纳法给出一条可复核的推理通道：只要最小情形成立，并且每一步能由前面情形推出下一个情形，链条就覆盖全部正整数。书里在 §1.2.1 把归纳法作为数学准备的第一项工具（PDF 第 25 页），因为后续证明算法正确性、递推数列性质、树结点计数都要反复用到它。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p>设 <span class=\"katex-inline\">P(n)<\/span> 是关于整数 <span class=\"katex-inline\">n<\/span> 的某个命题，例如&quot;<span class=\"katex-inline\">n(n+3)<\/span> 是偶数&quot;或&quot;<span class=\"katex-inline\">n\\ge10<\/span> 时 <span class=\"katex-inline\">2^n&gt;n^3<\/span>&quot;。标准归纳法分两步（PDF 第 25 页）：<\/p>\n<p><strong>(a) 基础步<\/strong>：证明 <span class=\"katex-inline\">P(1)<\/span> 为真。即核验最小的那个正整数情形。<\/p>\n<p><strong>(b) 归纳步<\/strong>：证明&quot;如果 <span class=\"katex-inline\">P(1),P(2),\\dots,P(n)<\/span> 全部为真，那么 <span class=\"katex-inline\">P(n+1)<\/span> 也为真&quot;，这个证明对任意正整数 <span class=\"katex-inline\">n<\/span> 成立。<\/p>\n<p>由此推出 <span class=\"katex-inline\">P(n)<\/span> 对所有正整数 <span class=\"katex-inline\">n<\/span> 为真。书里紧接着给了等式序列样例：<span class=\"katex-inline\">1=1^2<\/span>，<span class=\"katex-inline\">1+3=2^2<\/span>，<span class=\"katex-inline\">1+3+5=3^2<\/span>，<span class=\"katex-inline\">1+3+5+7=4^2<\/span>，左侧前 <span class=\"katex-inline\">n<\/span> 个奇数之和等于 <span class=\"katex-inline\">n^2<\/span>，这是归纳法最常见的练手命题。<\/p>\n<p><strong>普通归纳（弱归纳）<\/strong>：归纳步假设只取 <span class=\"katex-inline\">P(n)<\/span>，证明 <span class=\"katex-inline\">P(n+1)<\/span>。适用递推只依赖前一项的命题。<\/p>\n<p><strong>强归纳（完全归纳）<\/strong>：归纳步假设取 <span class=\"katex-inline\">P(1),\\dots,P(n)<\/span> 全部成立，证明 <span class=\"katex-inline\">P(n+1)<\/span>。当 <span class=\"katex-inline\">P(n+1)<\/span> 的论证要用到更早若干项的性质时，需要这一形式。<\/p>\n<p><strong>反归纳（从反例最小化入手）<\/strong>：若假设存在使命题不成立的整数，取其中最小者，导出它前面的更小者也不成立，形成矛盾；这是归纳原理的逆否写法。<\/p>\n<h2>原理推导：归纳法为什么覆盖全部正整数<\/h2>\n<p>用良序观点看：假设命题不成立的正整数集合非空，该集合必有最小元 <span class=\"katex-inline\">n_0<\/span>。基础步已证 <span class=\"katex-inline\">P(1)<\/span> 真，所以 <span class=\"katex-inline\">n_0&gt;1<\/span>。归纳步对 <span class=\"katex-inline\">n=n_0-1<\/span> 成立：若 <span class=\"katex-inline\">P(1),\\dots,P(n_0-1)<\/span> 全真则 <span class=\"katex-inline\">P(n_0)<\/span> 真；而 <span class=\"katex-inline\">n_0<\/span> 是最小反例，<span class=\"katex-inline\">1,\\dots,n_0-1<\/span> 都不在反例集合里，即全真，于是 <span class=\"katex-inline\">P(n_0)<\/span> 真，与 <span class=\"katex-inline\">n_0<\/span> 为反例矛盾。反例集合为空，命题对所有正整数成立。<\/p>\n<p>推导结构上，基础步排除&quot;链条第一环断开&quot;，归纳步排除&quot;任意一环接不住下一环&quot;，两者合起来才是完整证明。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：命题按自然数 <span class=\"katex-inline\">n<\/span> 分层，第 <span class=\"katex-inline\">n+1<\/span> 层与第 <span class=\"katex-inline\">n<\/span> 层之间有可写出的推理关系。\n<\/li><li>\n失败案例 1：只证归纳步、不证基础步。形式上写好了&quot;<span class=\"katex-inline\">P(n)\\Rightarrow P(n+1)<\/span>&quot;，但 <span class=\"katex-inline\">P(1)<\/span> 未核验，链条可以从第一环就悬空。例如错误证明&quot;所有马同色&quot;：<span class=\"katex-inline\">n<\/span> 匹马任取一组同色，换掉一匹仍得 <span class=\"katex-inline\">n<\/span> 匹；论证在 <span class=\"katex-inline\">n=2<\/span> 无法把两组单匹马的颜色接上，而基础步 <span class=\"katex-inline\">n=1<\/span> 虽平凡成立，归纳步本身在相邻规模间缺少桥接。\n<\/li><li>\n失败案例 2：归纳步假设范围写错。需要强归纳的命题只写 <span class=\"katex-inline\">P(n)<\/span> 假设，论证中偷偷引用了 <span class=\"katex-inline\">P(n-1)<\/span> 或更早项，假设清单与引用范围不一致。\n<\/li><li>\n失败案例 3：基础步不止一个。命题从 <span class=\"katex-inline\">n=0<\/span> 起算时去证 <span class=\"katex-inline\">P(1)<\/span>，漏掉 <span class=\"katex-inline\">P(0)<\/span>；或分奇偶两支，只验了一支。\n<\/li><li>\n边界：归纳法不给出命题的构造，只完成真值证明；想算出 <span class=\"katex-inline\">P(n)<\/span> 的具体数值，还要配合递推或求和。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>归纳法 vs 经验归纳<\/strong>：数学归纳法是演绎推理，结论由前提必然推出；日常&quot;见过很多天鹅白天鹅所以天鹅皆白&quot;是经验概括，两者同名不同义。\n<\/li><li>\n<strong>普通归纳 vs 强归纳<\/strong>：差别在归纳假设包含几项；强归纳能覆盖的命题，普通归纳往往要改写递推关系才能用。\n<\/li><li>\n<strong>归纳步 vs 推导公式<\/strong>：归纳步里写出 <span class=\"katex-inline\">P(n+1)<\/span> 的表达式并往 <span class=\"katex-inline\">P(n)<\/span> 方向凑，这一步是代数推演；别把&quot;假设 <span class=\"katex-inline\">P(n)<\/span> 成立&quot;当成已经证明了 <span class=\"katex-inline\">P(n)<\/span>，它只是条件前提。\n<\/li><li>\n<strong>递推定义 vs 归纳证明<\/strong>：斐波那契数按 <span class=\"katex-inline\">F_{n+2}=F_{n+1}+F_n<\/span> 定义是构造；证明 <span class=\"katex-inline\">F_n<\/span> 的某条性质才是归纳任务，两者不要混为一谈。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 算法确定性要求步骤可复核，归纳法是复核算法结论的工具。后继：c04 欧几里得算法的终止性按余数递减归纳，正确性按 gcd 不变量归纳；c05 置换轮换分解按元素个数归纳；c12 生成函数解出系数后，回到归纳法验证展开式与递推一致。树的性质证明（第 2 章）同样按结点数做归纳。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（数学归纳法：三种形式与常见误用）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：归纳法的依赖链、两种形式的完整证明与漏洞排查<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要证明命题 <span class=\"katex-inline\">P(n)<\/span> 对所有正整数成立，先往回追三层：<\/p>\n<ol><li>\n命题必须能按自然数分层。第 <span class=\"katex-inline\">n<\/span> 层与第 <span class=\"katex-inline\">n+1<\/span> 层之间存在可写出的推理关系；没有分层关系，归纳通道无从建立。\n<\/li><li>\n最小情形必须可单独核验。链条第一环是 <span class=\"katex-inline\">P(1)<\/span>（或命题起点的 <span class=\"katex-inline\">P(0)<\/span>），这一步不依赖归纳假设。\n<\/li><li>\n归纳步必须把假设范围与论证引用对齐。普通归纳假设 <span class=\"katex-inline\">P(n)<\/span>，强归纳假设 <span class=\"katex-inline\">P(1),\\dots,P(n)<\/span>；论证中引用了哪些更早项，假设清单就要覆盖哪些项。\n<\/ol>\n<p>依赖链方向：命题可分层 → 基础步核验起点 → 归纳步从假设推出下一项 → 由良序原理排除反例集合。<\/p>\n<h2>正向推导：普通归纳法完整走一遍<\/h2>\n<p>命题：前 <span class=\"katex-inline\">n<\/span> 个奇数之和 <span class=\"katex-inline\">1+3+5+\\cdots+(2n-1)=n^2<\/span>。<\/p>\n<p><strong>基础步<\/strong>：<span class=\"katex-inline\">n=1<\/span> 时左侧为 <span class=\"katex-inline\">1<\/span>，右侧 <span class=\"katex-inline\">1^2=1<\/span>，<span class=\"katex-inline\">P(1)<\/span> 成立。<\/p>\n<p><strong>归纳步<\/strong>：假设 <span class=\"katex-inline\">P(n)<\/span> 成立，即 <span class=\"katex-inline\">1+3+\\cdots+(2n-1)=n^2<\/span>。考察 <span class=\"katex-inline\">P(n+1)<\/span> 左侧：<\/p>\n<div class=\"katex-block\">1+3+\\cdots+(2n-1)+(2n+1)=n^2+(2n+1)=(n+1)^2<\/div>\n<p>右侧展开 <span class=\"katex-inline\">(n+1)^2=n^2+2n+1<\/span>，两边相等。由 <span class=\"katex-inline\">P(n)<\/span> 推出 <span class=\"katex-inline\">P(n+1)<\/span>。归纳步对任意 <span class=\"katex-inline\">n<\/span> 成立，结合基础步，命题对所有正整数成立。<\/p>\n<p><strong>强归纳形式走一遍<\/strong>：命题&quot;每个大于 1 的整数可写成素数乘积&quot;。基础步：<span class=\"katex-inline\">2<\/span> 本身是素数，<span class=\"katex-inline\">P(2)<\/span> 成立。归纳步：假设 <span class=\"katex-inline\">2,\\dots,n<\/span> 都可写成素数乘积，考察 <span class=\"katex-inline\">n+1<\/span>。若 <span class=\"katex-inline\">n+1<\/span> 是素数，结论直接成立；若为合数，它分解为 <span class=\"katex-inline\">a\\cdot b<\/span>，其中 <span class=\"katex-inline\">2\\le a,b\\le n<\/span>，由归纳假设 <span class=\"katex-inline\">a,b<\/span> 各有素因子分解，合并即得 <span class=\"katex-inline\">n+1<\/span> 的分解。这里论证要用到 <span class=\"katex-inline\">a,b<\/span> 两个更早项的性质，普通归纳只假设 <span class=\"katex-inline\">P(n)<\/span> 不够，必须用强归纳清单。<\/p>\n<h2>数值算例：错误证明的漏洞定位<\/h2>\n<p><strong>算例 1：漏掉基础步的悬空链条<\/strong>。有人声称&quot;所有 <span class=\"katex-inline\">n<\/span> 匹马同色&quot;，论证：任取 <span class=\"katex-inline\">n<\/span> 匹马为一组，同色；换掉其中一匹，仍得 <span class=\"katex-inline\">n<\/span> 匹，由归纳假设同色。检查基础步：<span class=\"katex-inline\">n=1<\/span> 时单匹马自然同色，<span class=\"katex-inline\">P(1)<\/span> 成立。问题出在归纳步桥接：<span class=\"katex-inline\">n=1<\/span> 推 <span class=\"katex-inline\">n=2<\/span> 时，第一组单匹马与第二组单匹马没有共享同一匹马，颜色无法互相传递。归纳步在相邻规模间缺少桥接结构，看似整齐的递推在第一处扩展就断开。<\/p>\n<p><strong>算例 2：假设范围与引用不一致<\/strong>。命题证明中写&quot;由 <span class=\"katex-inline\">P(n)<\/span> 得……&quot;，实际论证里用到了 <span class=\"katex-inline\">P(n-1)<\/span> 的结论。把假设清单改成 <span class=\"katex-inline\">P(1),\\dots,P(n)<\/span> 才覆盖引用；若坚持普通归纳形式，必须改写递推关系，让论证只依赖 <span class=\"katex-inline\">P(n)<\/span>。<\/p>\n<p><strong>算例 3：起点错位<\/strong>。命题从 <span class=\"katex-inline\">n=0<\/span> 起算，证明者去核验 <span class=\"katex-inline\">P(1)<\/span>，漏掉 <span class=\"katex-inline\">P(0)<\/span>；或命题分奇偶两支，只验了偶支。补法是先确认命题定义域最小元，基础步对准该最小元，多分支各自核验。<\/p>\n<h2>延伸推演：归纳原理与良序原理的等价方向<\/h2>\n<p>假设存在使命题不成立的正整数集合 <span class=\"katex-inline\">S<\/span>。若 <span class=\"katex-inline\">S<\/span> 非空，良序原理给出 <span class=\"katex-inline\">S<\/span> 中最小元 <span class=\"katex-inline\">n_0<\/span>。基础步已证 <span class=\"katex-inline\">P(1)<\/span>，故 <span class=\"katex-inline\">n_0&gt;1<\/span>。令 <span class=\"katex-inline\">n=n_0-1<\/span>，归纳步条件满足：<span class=\"katex-inline\">P(1),\\dots,P(n)<\/span> 全真则 <span class=\"katex-inline\">P(n_0)<\/span> 真。由于 <span class=\"katex-inline\">n_0<\/span> 是最小反例，<span class=\"katex-inline\">1,\\dots,n_0-1<\/span> 都不在 <span class=\"katex-inline\">S<\/span> 中，即全真，于是 <span class=\"katex-inline\">P(n_0)<\/span> 真，与 <span class=\"katex-inline\">n_0\\in S<\/span> 矛盾。<span class=\"katex-inline\">S<\/span> 必为空。这条逆否路径说明：基础步与归纳步合起来排除了&quot;最小反例&quot;的存在空间。<\/p>\n<p>归纳法不提供构造。证明 <span class=\"katex-inline\">F_n<\/span> 满足某性质，不等于算出 <span class=\"katex-inline\">F_n<\/span> 的具体值；求值还要走递推或求和。归纳是真值论证工具，母函数与闭式是计数工具，分工不同。<\/p>\n<h2>对抗性追问：归纳步写得长就等于证明充分吗<\/h2>\n<p>不等于。归纳步长度不替代核验清单：基础步是否真的成立、假设与引用是否对齐、边界情形是否覆盖，三项要逐条查。常见假象是把递推公式代入后展开整齐，就认为归纳完成；代入过程若漏边界项，推出的 <span class=\"katex-inline\">P(n+1)<\/span> 仍可能与目标式差一个常数项。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n标准归纳法分哪两步？强归纳与普通归纳的假设差别在哪？\n<\/li><li>\n为什么说归纳法是演绎推理，不是经验概括？\n<\/li><li>\n举一个只做归纳步、不证基础步导致结论悬空的例子。\n<\/li><li>\n论证中引用了 <span class=\"katex-inline\">P(n-1)<\/span>，却只写假设 <span class=\"katex-inline\">P(n)<\/span>，漏洞属于哪一类？\n<\/li><li>\n良序原理怎样推出反例集合为空？归纳法不承担什么任务？\n<\/ol>\n<h2>延伸推演：归纳法在递归正确性证明中的位置<\/h2>\n<p>递归过程的正确性证明天然分两层。<strong>基础层<\/strong>：递归直接返回的情形（空子树、单元素表、零次幂）结果正确，对应归纳基础步。<strong>递推层<\/strong>：假设递归调用在规模更小的子问题上返回正确结果，在此基础上证明当前规模的组合结果正确，对应归纳步。子问题规模严格小于原问题，配合良序原理，递归必然向下落到基础层。<\/p>\n<p>这一结构与 c04 欧几里得终止性、c07 遍历正确性同源：先认最小情形，再认相邻规模间的传递。写递归证明时，先列&quot;什么情形直接返回&quot;，再列&quot;子结果正确时当前结果为什么正确&quot;，两条对应归纳两步，缺一条证明不闭合。<\/p>\n<h2>第二算例：等差求和的归纳核验<\/h2>\n<p>命题：<span class=\"katex-inline\">1+2+\\cdots+n=n(n+1)/2<\/span>。<\/p>\n<p>基础步 <span class=\"katex-inline\">n=1<\/span>：左侧 1，右侧 <span class=\"katex-inline\">1\\cdot2/2=1<\/span>，成立。<\/p>\n<p>归纳步：假设 <span class=\"katex-inline\">1+\\cdots+n=n(n+1)/2<\/span>，考察 <span class=\"katex-inline\">n+1<\/span>：<\/p>\n<div class=\"katex-block\">1+\\cdots+n+(n+1)=\\frac{n(n+1)}2+(n+1)=(n+1)\\left(\\frac n2+1\\right)=\\frac{(n+1)(n+2)}2<\/div>\n<p>右侧为 <span class=\"katex-inline\">(n+1)((n+1)+1)/2<\/span>，形式吻合。归纳完成。<\/p>\n<p><strong>对照验算<\/strong>：<span class=\"katex-inline\">n=10<\/span> 时左侧 55，右侧 <span class=\"katex-inline\">10\\cdot11/2=55<\/span>；<span class=\"katex-inline\">n=100<\/span> 右侧 <span class=\"katex-inline\">100\\cdot101/2=5050<\/span>。归纳证明给出的是对所有 <span class=\"katex-inline\">n<\/span> 的真值，数值验算只抽查个别项，不能替代证明。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;归纳假设是已经证明的结论&quot;。<\/strong> 假设只是条件前提，证明的是&quot;若前提成立则结论成立&quot;；<span class=\"katex-inline\">P(n)<\/span> 本身在基础步与归纳步接力之前并未单独证出。\n<\/li><li>\n<strong>误解二：&quot;归纳步越长证明越牢&quot;。<\/strong> 证明强度取决于基础步是否成立、假设与引用是否对齐、边界是否覆盖，不取决于篇幅。代入展开整齐不等于链条闭合。\n<\/li><li>\n<strong>误解三：&quot;强归纳总比普通归纳好用&quot;。<\/strong> 强归纳假设更宽，但能用普通归纳解决的命题不必加码；形式选择应匹配递推依赖的项数。\n<\/li><li>\n<strong>误解四：&quot;归纳法只能证数列命题&quot;。<\/strong> 树按结点数归纳、程序按输入规模归纳、集合按元素个数归纳，都是同一原理在不同分层对象上的应用。\n<\/ul>\n<h2>推演补充：归纳证明的书写顺序检查<\/h2>\n<p>一份完整归纳证明落笔前，先列四样东西：命题 <span class=\"katex-inline\">P(n)<\/span> 的准确陈述；定义域最小元；基础步核验内容；归纳步假设清单与目标式。书写顺序通常是：声明命题 → 基础步 → 归纳假设 → 代入递推 → 整理到目标式 → 结论。<\/p>\n<p>检查时逐环对照：基础步代入最小元后等式两边是否真的相等；归纳假设写的是 <span class=\"katex-inline\">P(n)<\/span> 还是 <span class=\"katex-inline\">P(1),\\dots,P(n)<\/span>；推导中出现的 <span class=\"katex-inline\">P(n-1)<\/span> 是否在假设覆盖范围内；目标式右端是否展开到与左端同形。任一环对不上，证明就不能闭合。<\/p>\n<h2>推演补充：反归纳（最小反例）的写法<\/h2>\n<p>反归纳从反面入手：假设命题存在反例，取最小反例 <span class=\"katex-inline\">n_0<\/span>。由基础步知 <span class=\"katex-inline\">n_0&gt;1<\/span>，考察 <span class=\"katex-inline\">n_0-1<\/span>，它不是反例即命题成立；再用归纳步的同一推理推出 <span class=\"katex-inline\">P(n_0)<\/span> 成立，与 <span class=\"katex-inline\">n_0<\/span> 为反例矛盾。这一写法与正向归纳等价，区别是从矛盾处收口，在图论、集合论证明中更常见。<\/p>\n<p>两种形式都依赖良序原理：每个非空自然数子集有最小元。没有这条序结构，&quot;取最小反例&quot;或&quot;递减必到 0&quot;都失去依据。c04 的终止性证明同样站在良序原理上：余数严格递减，不可能无限延续。<\/p>\n<h2>边界对照：归纳法与后续工具的分工<\/h2>\n<p>归纳法负责核验命题真值；递推求解负责算出通项；母函数（c12）负责把递推转代数方程；求和与大 O（c11、c04 量级）负责估计规模。后续章节遇到&quot;证明某算法对所有输入成立&quot;，先回到归纳框架：最小输入情形是否核验，子规模情形能否推出当前情形。树性质证明按结点数归纳，置换分解按元素个数归纳，遍历正确性按子树规模归纳，都是这一框架的复用。<\/p>\n<h2>推演补充：归纳与递归的互映<\/h2>\n<p>递归过程在结构上就是归纳的执行版本：基础情形对应归纳基础步，递归调用对应归纳假设层，组合返回对应归纳步。证明递归函数正确时，先确认基础情形直接返回正确值；再假设各递归调用在更小输入上结果正确，证明当前组合结果正确；最后由输入规模严格下降配合良序，保证递归落到基础层。<\/p>\n<p>写递归代码与写归纳证明共用同一张分层图：顶层问题拆成哪些子问题，子问题规模小多少，合并规则是什么。分层图画不清，递归边界与归纳基础就都无从写起。<\/p>\n<h2>第三算例：等比数列求和归纳核验<\/h2>\n<p>命题：<span class=\"katex-inline\">1+r+r^2+\\cdots+r^n=(r^{n+1}-1)/(r-1)<\/span>（<span class=\"katex-inline\">r\\ne1<\/span>）。<\/p>\n<p>基础步 <span class=\"katex-inline\">n=0<\/span>：左侧 1，右侧 <span class=\"katex-inline\">(r-1)/(r-1)=1<\/span>，成立。<\/p>\n<p>归纳步：假设 <span class=\"katex-inline\">1+\\cdots+r^n=(r^{n+1}-1)/(r-1)<\/span>，加 <span class=\"katex-inline\">r^{n+1}<\/span>：<\/p>\n<div class=\"katex-block\">\\frac{r^{n+1}-1}{r-1}+r^{n+1}=\\frac{r^{n+1}-1+r^{n+1}(r-1)}{r-1}=\\frac{r^{n+2}-1}{r-1}<\/div>\n<p>与目标式 <span class=\"katex-inline\">(r^{(n+1)+1}-1)/(r-1)<\/span> 吻合。数值抽查 <span class=\"katex-inline\">r=2,n=3<\/span>：左侧 <span class=\"katex-inline\">1+2+4+8=15<\/span>，右侧 <span class=\"katex-inline\">(16-1)/(2-1)=15<\/span>，一致。<\/p>\n<h2>推演补充：归纳证明常见纸面错误清单<\/h2>\n<p>检查一份归纳证明，逐项过：基础步是否代入最小元后两边相等；归纳假设标注的是 <span class=\"katex-inline\">P(n)<\/span> 还是 <span class=\"katex-inline\">P(1),\\dots,P(n)<\/span>；推导引用的更早项是否在假设内；目标式右端是否展开同形；多分支命题是否每支都核验。纸面错误多发生在边界项：漏 <span class=\"katex-inline\">P(0)<\/span>、漏奇偶一支、把 <span class=\"katex-inline\">P(n-1)<\/span> 当 <span class=\"katex-inline\">P(n)<\/span> 引用。清单化核对比通读一遍更能定位漏洞。<\/p><\/div><\/details>", "c04": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.19<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">数学归纳法：三种形式与常见误用<\/a><\/span><\/div><h1>欧几里得算法的正确性与复杂度（gcd 不变量与步数量级）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 1 章（原书 §1.1、§1.2.8）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>给定两个正整数 <span class=\"katex-inline\">m,n<\/span>，要求同时整除二者的最大正整数。逐一枚举公约数太慢，直接分解质因数在大数上代价很高。欧几里得算法用余数反复替换两数，少量除法就得到 gcd。这个概念要回答两件事：为什么每步替换后答案不变（正确性），以及最坏情况下要做多少次除法（复杂度）。书里把算法 E 作为全书第一个完整算法样例（PDF 第 19–20 页）。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>算法 E（欧几里得算法）<\/strong>：给定两个正整数 <span class=\"katex-inline\">m,n<\/span>，求最大公约数。<\/p>\n<ul><li>\nE1. 求余数：用 <span class=\"katex-inline\">n<\/span> 除 <span class=\"katex-inline\">m<\/span>，令 <span class=\"katex-inline\">r<\/span> 为余数，<span class=\"katex-inline\">0\\le r&lt;n<\/span>。\n<\/li><li>\nE2. 余数为 0？若 <span class=\"katex-inline\">r=0<\/span>，算法终止，<span class=\"katex-inline\">n<\/span> 是答案。\n<\/li><li>\nE3. 减少：置 <span class=\"katex-inline\">m\\leftarrow n,\\ n\\leftarrow r<\/span>，返回步骤 E1。\n<\/ul>\n<p>书里另补 E0：若 <span class=\"katex-inline\">m&lt;n<\/span> 先交换 <span class=\"katex-inline\">m,n<\/span>，避免首轮商为 0 的空转（PDF 第 20 页）。<\/p>\n<p><strong>gcd 不变量<\/strong>：每步前后，<span class=\"katex-inline\">\\gcd(m,n)=\\gcd(n,r)<\/span>。这是正确性的核心。<\/p>\n<p><strong>余数递减量<\/strong>：<span class=\"katex-inline\">n&gt;r_1&gt;r_2&gt;\\cdots\\ge0<\/span>，余数序列严格递减，用于证明终止性。<\/p>\n<p><strong>与斐波那契数的挂钩<\/strong>：最坏情形输入是相邻斐波那契数；斐波那契数列 <span class=\"katex-inline\">F_0=0,\\ F_1=1,\\ F_{n+2}=F_{n+1}+F_n<\/span>（PDF 第 79 页），相邻两项做 gcd 所需除法次数与下标同阶。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>正确性证明<\/strong>：设 <span class=\"katex-inline\">m=qn+r<\/span>。<\/p>\n<p>第一步，证 <span class=\"katex-inline\">(m,n)<\/span> 的公约数都是 <span class=\"katex-inline\">(n,r)<\/span> 的公约数。若 <span class=\"katex-inline\">d\\mid m<\/span> 且 <span class=\"katex-inline\">d\\mid n<\/span>，则 <span class=\"katex-inline\">d\\mid(m-qn)<\/span>，而 <span class=\"katex-inline\">m-qn=r<\/span>，所以 <span class=\"katex-inline\">d\\mid r<\/span>。<\/p>\n<p>第二步，反过来证 <span class=\"katex-inline\">(n,r)<\/span> 的公约数都是 <span class=\"katex-inline\">(m,n)<\/span> 的公约数。若 <span class=\"katex-inline\">e\\mid n<\/span> 且 <span class=\"katex-inline\">e\\mid r<\/span>，则 <span class=\"katex-inline\">e\\mid(qn+r)<\/span>，而 <span class=\"katex-inline\">qn+r=m<\/span>，所以 <span class=\"katex-inline\">e\\mid m<\/span>。<\/p>\n<p>两方向合并，两个数对的公约数集合完全相同，最大公约数相等。E3 把问题换成 <span class=\"katex-inline\">(n,r)<\/span>，答案不变；到 E2 余数为 0 时，<span class=\"katex-inline\">n<\/span> 整除 <span class=\"katex-inline\">m<\/span>，<span class=\"katex-inline\">n<\/span> 本身即最大公约数。<\/p>\n<p><strong>终止性<\/strong>：每轮余数 <span class=\"katex-inline\">r&lt;n<\/span>，新的 <span class=\"katex-inline\">n<\/span> 是上一轮的 <span class=\"katex-inline\">r<\/span>，所以 <span class=\"katex-inline\">r_{k+1}&lt;r_k<\/span>。严格递减的非负整数序列不能无限延伸，有限步内必取到 0。<\/p>\n<p><strong>复杂度方向（Lamé 定理方向）<\/strong>：设做 <span class=\"katex-inline\">k<\/span> 次除法后余数为 0。逆推余数序列：最后一步余数为 0，倒数第二步为 <span class=\"katex-inline\">r_{k-1}<\/span>，向前每一步都满足后项不超过前项。最坏情况下余数下降最慢，对应相邻斐波那契数：<span class=\"katex-inline\">\\gcd(F_{k+1},F_k)<\/span> 需要 <span class=\"katex-inline\">k-1<\/span> 次除法。由于 <span class=\"katex-inline\">F_k\\approx\\varphi^k/\\sqrt5<\/span>（<span class=\"katex-inline\">\\varphi<\/span> 为黄金比），反解出 <span class=\"katex-inline\">k=O(\\log F_k)<\/span>，即除法次数为 <span class=\"katex-inline\">O(\\log\\min(m,n))<\/span>。这里给的是定理方向与量级归属，不展开完整定理证明。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：<span class=\"katex-inline\">m,n<\/span> 为正整数；除法与余数按整数语义定义。\n<\/li><li>\n失败案例 1：输入含 0 或负数。算法 E 假设正整数；对 0 与负数要先取绝对值、处理 <span class=\"katex-inline\">n=0<\/span> 的边界，否则余数分支语义不清。\n<\/li><li>\n失败案例 2：替换顺序写反。先 <span class=\"katex-inline\">n\\leftarrow r<\/span> 再 <span class=\"katex-inline\">m\\leftarrow n<\/span>，<span class=\"katex-inline\">m<\/span> 拿到的是 <span class=\"katex-inline\">r<\/span> 而非原 <span class=\"katex-inline\">n<\/span>，原 <span class=\"katex-inline\">n<\/span> 丢失，后续数对不再满足不变量。\n<\/li><li>\n边界：复杂度上界针对最坏情形；随机输入的平均步数低于最坏上界。算法只输出 gcd，不直接给出质因数分解；要分解仍需另行处理。\n<\/li><li>\n推广：同一套余数替换思想出现在连分数求解、线性同余求逆（扩展欧几里得）等场景。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>gcd 不变量 vs 余数递减<\/strong>：不变量保证答案不跑偏，递减量保证程序会停下；两者回答不同问题，缺一不可。只证不变量不证递减，不能排除无限循环；只证递减不证不变量，停下时无法确认答案。\n<\/li><li>\n<strong>欧几里得算法 vs 质因数分解<\/strong>：分解法分别列出 <span class=\"katex-inline\">m,n<\/span> 的素因子取公共部分，算法 E 不做因子枚举，直接在余数层完成替换。\n<\/li><li>\n<strong>最坏情形 vs 平均情形<\/strong>：<span class=\"katex-inline\">O(\\log\\min(m,n))<\/span> 是最坏上界；平均步数受输入分布影响，分析时不能把上界当平均值。\n<\/li><li>\n<strong>余数 vs 商<\/strong>：E1 关心余数 <span class=\"katex-inline\">r<\/span>，商 <span class=\"katex-inline\">q<\/span> 在主算法里不参与后续判断；扩展版本才需要保留商来写贝祖等式。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c03 归纳法用于核验不变量与终止性；c01 可行性、有限性在本算法上落地。后继：c09 线性同余发生器的周期条件建立在 gcd 与互素概念上；c11 调和数估计的是另一类求和量级，与本算法的对数步数对照阅读。扩展欧几里得是模逆元计算的基础工具。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（欧几里得算法的正确性与复杂度（gcd 不变量与步数量级））<\/summary><div class=\"depth-body\"><h1>c04 深度推导：欧几里得算法的不变量依赖链、手算全过程与步数量级<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要确认算法 E 正确且可终止，先往回追四层：<\/p>\n<ol><li>\n输入语义：<span class=\"katex-inline\">m,n<\/span> 为正整数，除法 <span class=\"katex-inline\">m=qn+r<\/span> 中 <span class=\"katex-inline\">q<\/span> 为商、<span class=\"katex-inline\">r<\/span> 为余数，<span class=\"katex-inline\">0\\le r&lt;n<\/span>。余数定义是后续替换的出发点。\n<\/li><li>\n不变量：每步前后两数对的公约数集合不变。这保证替换不改变待求答案。\n<\/li><li>\n终止度量：余数严格递减。这保证循环有限步内到达 0。\n<\/li><li>\n复杂度定位：最坏情形余数下降最慢，对应相邻斐波那契数；由斐波那契指数增长反解除数次数上界。\n<\/ol>\n<p>依赖链方向：整数除法语义 → gcd 集合相等证明 → 余数递减终止证明 → 最坏情形与斐波那契挂钩 → 量级 <span class=\"katex-inline\">O(\\log\\min(m,n))<\/span>。<\/p>\n<h2>正向推导：正确性与终止性分步核验<\/h2>\n<p><strong>不变量证明<\/strong>。设 <span class=\"katex-inline\">m=qn+r<\/span>。<\/p>\n<p>先证正向：若 <span class=\"katex-inline\">d\\mid m<\/span> 且 <span class=\"katex-inline\">d\\mid n<\/span>，则 <span class=\"katex-inline\">d\\mid(m-qn)<\/span>，而 <span class=\"katex-inline\">m-qn=r<\/span>，所以 <span class=\"katex-inline\">d\\mid r<\/span>。<span class=\"katex-inline\">(m,n)<\/span> 的公约数都是 <span class=\"katex-inline\">(n,r)<\/span> 的公约数。<\/p>\n<p>再证反向：若 <span class=\"katex-inline\">e\\mid n<\/span> 且 <span class=\"katex-inline\">e\\mid r<\/span>，则 <span class=\"katex-inline\">e\\mid(qn+r)<\/span>，而 <span class=\"katex-inline\">qn+r=m<\/span>，所以 <span class=\"katex-inline\">e\\mid m<\/span>。<span class=\"katex-inline\">(n,r)<\/span> 的公约数都是 <span class=\"katex-inline\">(m,n)<\/span> 的公约数。<\/p>\n<p>两方向合并，<span class=\"katex-inline\">\\gcd(m,n)=\\gcd(n,r)<\/span>。E3 把 <span class=\"katex-inline\">(m,n)<\/span> 换成 <span class=\"katex-inline\">(n,r)<\/span>，问题等价。到达 E2 时 <span class=\"katex-inline\">r=0<\/span>，<span class=\"katex-inline\">n\\mid m<\/span>，<span class=\"katex-inline\">n<\/span> 即最大公约数。<\/p>\n<p><strong>终止性证明<\/strong>。记第 <span class=\"katex-inline\">k<\/span> 轮余数 <span class=\"katex-inline\">r_k<\/span>，本轮后更新 <span class=\"katex-inline\">n\\leftarrow r_k<\/span>，下一轮余数 <span class=\"katex-inline\">r_{k+1}&lt;n=r_k<\/span>。于是 <span class=\"katex-inline\">n&gt;r_1&gt;r_2&gt;\\cdots\\ge0<\/span>。严格递减非负整数序列长度有限，必在某步取 0。<\/p>\n<h2>数值算例：书里算例的逐步还原<\/h2>\n<p>取 <span class=\"katex-inline\">m=119,\\ n=544<\/span>。初值 <span class=\"katex-inline\">m&lt;n<\/span>，先交换：<span class=\"katex-inline\">m=544,\\ n=119<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">544=4\\cdot119+68<\/span>，<span class=\"katex-inline\">r=68<\/span>；更新 <span class=\"katex-inline\">m=119,\\ n=68<\/span>。不变量：<span class=\"katex-inline\">\\gcd(544,119)=\\gcd(119,68)<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">119=1\\cdot68+51<\/span>，<span class=\"katex-inline\">r=51<\/span>；更新 <span class=\"katex-inline\">m=68,\\ n=51<\/span>。<span class=\"katex-inline\">\\gcd(119,68)=\\gcd(68,51)<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">68=1\\cdot51+17<\/span>，<span class=\"katex-inline\">r=17<\/span>；更新 <span class=\"katex-inline\">m=51,\\ n=17<\/span>。<span class=\"katex-inline\">\\gcd(68,51)=\\gcd(51,17)<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">51=3\\cdot17+0<\/span>，<span class=\"katex-inline\">r=0<\/span>；终止，返回 <span class=\"katex-inline\">n=17<\/span>。\n<\/ol>\n<p>四次除法，余数序列 <span class=\"katex-inline\">68,51,17,0<\/span>。核验：<span class=\"katex-inline\">17\\mid51<\/span>，<span class=\"katex-inline\">17\\mid68<\/span>，<span class=\"katex-inline\">17\\mid119<\/span>，<span class=\"katex-inline\">17\\mid544<\/span>；且无更大公共因子，答案成立。<\/p>\n<p><strong>第二算例：相邻斐波那契对<\/strong>。取 <span class=\"katex-inline\">F_6=8,\\ F_5=5<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">8=1\\cdot5+3<\/span>，<span class=\"katex-inline\">r=3<\/span>；<span class=\"katex-inline\">m=5,\\ n=3<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">5=1\\cdot3+2<\/span>，<span class=\"katex-inline\">r=2<\/span>；<span class=\"katex-inline\">m=3,\\ n=2<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">3=1\\cdot2+1<\/span>，<span class=\"katex-inline\">r=1<\/span>；<span class=\"katex-inline\">m=2,\\ n=1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">2=2\\cdot1+0<\/span>，终止，<span class=\"katex-inline\">\\gcd=1<\/span>。四次除法走完。斐波那契对每一步商都是 1，余数下降最慢，构成最坏情形。\n<\/ol>\n<h2>延伸推演：步数与斐波那契指数的挂钩方向<\/h2>\n<p>斐波那契数列 <span class=\"katex-inline\">F_0=0,\\ F_1=1,\\ F_{n+2}=F_{n+1}+F_n<\/span>，通项方向为 <span class=\"katex-inline\">F_n\\approx\\varphi^n/\\sqrt5<\/span>，<span class=\"katex-inline\">\\varphi=(1+\\sqrt5)/2<\/span>。逆推余数链：最后一步余数为 0，倒数第二步为 <span class=\"katex-inline\">r_{k-1}<\/span>，向前每步后项不超过前项；下降最慢的链条逐项复刻斐波那契递推。若 <span class=\"katex-inline\">\\gcd(F_{k+1},F_k)<\/span> 需要 <span class=\"katex-inline\">k-1<\/span> 次除法，而 <span class=\"katex-inline\">F_k\\approx\\varphi^k/\\sqrt5<\/span>，则 <span class=\"katex-inline\">k=O(\\log F_k)<\/span>。两个输入中较小者记为 <span class=\"katex-inline\">s<\/span>，除法次数为 <span class=\"katex-inline\">O(\\log s)<\/span>。这是定理方向与量级归属；完整 Lamé 定理证明在数论教材中展开，本概念不展开定理编号对应。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>替换顺序写反<\/strong>。E3 应先 <span class=\"katex-inline\">m\\leftarrow n<\/span>、再 <span class=\"katex-inline\">n\\leftarrow r<\/span>。若先 <span class=\"katex-inline\">n\\leftarrow r<\/span>，再 <span class=\"katex-inline\">m\\leftarrow n<\/span>，<span class=\"katex-inline\">m<\/span> 拿到的是 <span class=\"katex-inline\">r<\/span> 而不是原 <span class=\"katex-inline\">n<\/span>，原 <span class=\"katex-inline\">n<\/span> 已丢失；后续数对不再是不变量证明里的 <span class=\"katex-inline\">(n,r)<\/span>，答案出错。<\/p>\n<p><strong>输入非正整数<\/strong>。算法 E 假设正整数；含 0 时 <span class=\"katex-inline\">n=0<\/span> 除法无定义，负数余数语义不统一。实际使用先取绝对值并单独处理 0。<\/p>\n<h2>对抗性追问：gcd 不变量证明能否替代终止性证明<\/h2>\n<p>不能。不变量保证答案不跑偏，终止性保证过程会停下；两者回答不同问题。只证不变量，可能存在永不结束的循环；只证余数递减，停下时仍需不变量确认返回值是 gcd。c01 五条特征里，可行性对应基本操作，有限性对应余数递减，正确性对应不变量，三者分别核验。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">m=qn+r<\/span> 后，怎样证明 <span class=\"katex-inline\">(m,n)<\/span> 与 <span class=\"katex-inline\">(n,r)<\/span> 公约数集合相同？\n<\/li><li>\n终止性依赖哪个严格递减量？为什么非负严格递减序列必到 0？\n<\/li><li>\n手算 <span class=\"katex-inline\">\\gcd(252,105)<\/span>：写出每轮商、余数与更新后的数对。\n<\/li><li>\n最坏情形输入为什么对应相邻斐波那契数？量级怎样写成 <span class=\"katex-inline\">O(\\log\\min(m,n))<\/span>？\n<\/li><li>\n替换顺序写反后，哪一个原值丢失？后续数对错在哪里？\n<\/ol>\n<h2>延伸推演：扩展欧几里得与贝祖等式方向<\/h2>\n<p>主算法只返回 gcd；扩展版本在余数替换的同时保留商，可回溯出整数 <span class=\"katex-inline\">s,t<\/span> 使 <span class=\"katex-inline\">sm+tn=\\gcd(m,n)<\/span>。回溯方向：把每轮 <span class=\"katex-inline\">r=m-qn<\/span> 代回上一式，逐层消去中间余数，最后留下 <span class=\"katex-inline\">m,n<\/span> 的线性组合。这一工具是模逆元计算的基础：在 <span class=\"katex-inline\">\\gcd(a,m)=1<\/span> 时，贝祖等式给出 <span class=\"katex-inline\">sa\\equiv1\\pmod m<\/span>，<span class=\"katex-inline\">s<\/span> 即 <span class=\"katex-inline\">a<\/span> 模 <span class=\"katex-inline\">m<\/span> 的逆。<\/p>\n<p>理解主算法时先把不变量与终止性吃透；扩展版本只是在同一条余数链上附加系数记录，不改变替换顺序与复杂度量级。<\/p>\n<h2>第二算例：<span class=\"katex-inline\">\\gcd(252,105)<\/span> 逐步<\/h2>\n<ol><li>\n<span class=\"katex-inline\">252=2\\cdot105+42<\/span>，<span class=\"katex-inline\">r=42<\/span>；更新 <span class=\"katex-inline\">m=105,\\ n=42<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">105=2\\cdot42+21<\/span>，<span class=\"katex-inline\">r=21<\/span>；更新 <span class=\"katex-inline\">m=42,\\ n=21<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">42=2\\cdot21+0<\/span>，终止，<span class=\"katex-inline\">\\gcd=21<\/span>。\n<\/ol>\n<p>核验：<span class=\"katex-inline\">21\\mid105<\/span>（<span class=\"katex-inline\">105=5\\cdot21<\/span>），<span class=\"katex-inline\">21\\mid252<\/span>（<span class=\"katex-inline\">252=12\\cdot21<\/span>）；无更大公共因子。三轮除法，余数 <span class=\"katex-inline\">42,21,0<\/span> 递减。<\/p>\n<p>再取 <span class=\"katex-inline\">\\gcd(76,32)<\/span>：<\/p>\n<ol><li>\n<span class=\"katex-inline\">76=2\\cdot32+12<\/span>；<span class=\"katex-inline\">m=32,\\ n=12<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">32=2\\cdot12+8<\/span>；<span class=\"katex-inline\">m=12,\\ n=8<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">12=1\\cdot8+4<\/span>；<span class=\"katex-inline\">m=8,\\ n=4<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">8=2\\cdot4+0<\/span>；<span class=\"katex-inline\">\\gcd=4<\/span>。\n<\/ol>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;商越大算法越快&quot;。<\/strong> 步数由余数下降速度决定，商只写在除法式里；最坏情形商全为 1（斐波那契对），余数下降最慢。\n<\/li><li>\n<strong>误解二：&quot;gcd 只对素数有意义&quot;。<\/strong> 任意正整数对都有 gcd；素数概念用于互素判断（c09 周期条件），不是 gcd 算法的前提。\n<\/li><li>\n<strong>误解三：&quot;余数可以等于除数&quot;。<\/strong> 余数定义 <span class=\"katex-inline\">0\\le r&lt;n<\/span>，<span class=\"katex-inline\">r<\/span> 严格小于除数；若取到等于 <span class=\"katex-inline\">n<\/span>，商应再加 1、余数归 0。\n<\/li><li>\n<strong>误解四：&quot;算法 E 直接给出质因数分解&quot;。<\/strong> 主算法只给公共因子；分解 <span class=\"katex-inline\">m,n<\/span> 各自的素因子是另一类问题，gcd 结果不等于分解结果。\n<\/ul>\n<h2>边界对照：本算法在全书的位置<\/h2>\n<p>c01 五条特征在 E 上完整落地：输入正整数、输出 gcd、操作基本、分支确定、余数递减保证终止。c09 发生器周期条件中的互素判断，直接调用 gcd 概念；c11 调和数分析的是另一类求和量级，与本算法的对数步数形成对照。扩展欧几里得是模运算章节的预备工具，后续求逆、解同余方程都沿这条余数链展开。<\/p>\n<h2>推演补充：余数链与连分数<\/h2>\n<p>欧几里得算法的商序列就是连分数展开的各项。<span class=\"katex-inline\">m/n<\/span> 依次取整：<span class=\"katex-inline\">m/n=q_1+1/(n/r_1)<\/span>，递归展开到余数为 0。每一轮除法对应连分数一层；算法步数等于连分数层数。这一联系把 gcd 计算、连分数逼近、有理数约分串在同一条余数链上。<\/p>\n<p>理解这一联系时，主算法的两个性质各自对应：不变量对应连分数逐层取整不改变原值；递减量对应层数有限。后续数论应用（贝祖等式、模逆、丢番图方程）都沿这条链回溯系数。<\/p>\n<h2>第三算例：<span class=\"katex-inline\">\\gcd(1071,462)<\/span> 全程<\/h2>\n<ol><li>\n<span class=\"katex-inline\">1071=2\\cdot462+147<\/span>；<span class=\"katex-inline\">m=462,\\ n=147<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">462=3\\cdot147+21<\/span>；<span class=\"katex-inline\">m=147,\\ n=21<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">147=7\\cdot21+0<\/span>；终止，<span class=\"katex-inline\">\\gcd=21<\/span>。\n<\/ol>\n<p>核验：<span class=\"katex-inline\">21\\mid462<\/span>（<span class=\"katex-inline\">462=22\\cdot21<\/span>），<span class=\"katex-inline\">21\\mid1071<\/span>（<span class=\"katex-inline\">1071=51\\cdot21<\/span>）。三轮除法，余数 <span class=\"katex-inline\">147,21,0<\/span>。<\/p>\n<h2>推演补充：最坏情形的直觉<\/h2>\n<p>为什么相邻斐波那契数最难除？每轮商越小，余数下降越慢；商为 1 时新余数 = 旧除数 − 旧余数，下降幅度最小。斐波那契对 <span class=\"katex-inline\">F_{k+1},F_k<\/span> 每轮商都为 1，余数序列反向复刻 <span class=\"katex-inline\">F_{k-1},F_{k-2},\\dots<\/span>，步数达到同规模输入的最大值。反过来，首轮商很大则余数一次压得很小，后续轮次减少。复杂度上界 <span class=\"katex-inline\">O(\\log\\min(m,n))<\/span> 正是对这条最慢链条的估计，平均情形步数低于该上界。<\/p>\n<h2>补充对照：gcd 与素因子分解的分工<\/h2>\n<p>gcd 回答公共因子大小，不分解两个数各自的素因子；求 <span class=\"katex-inline\">m,n<\/span> 全部素因子需试除或分解算法，代价结构不同。贝祖等式 <span class=\"katex-inline\">sm+tn=\\gcd(m,n)<\/span> 由扩展欧几里得回溯系数得到，是 gcd 概念向线性组合方向的延伸。<\/p>\n<p>互素判断即 <span class=\"katex-inline\">\\gcd(m,n)=1<\/span>，这一判断在 c09 发生器周期条件、c10 分布分组中反复出现。理解 gcd 链条后，模逆元、同余方程、连分数约分都是余数链上的衍生工具，不需要另造一套计算规则。<\/p>\n<h2>补充算例：同余方向的小例<\/h2>\n<p>求 <span class=\"katex-inline\">17<\/span> 模 <span class=\"katex-inline\">462<\/span> 的逆方向：<span class=\"katex-inline\">\\gcd(462,17)=1<\/span>，扩展欧几里得回溯 <span class=\"katex-inline\">s,t<\/span> 使 <span class=\"katex-inline\">462s+17t=1<\/span>，<span class=\"katex-inline\">t<\/span> 即 <span class=\"katex-inline\">17\\cdot t\\equiv1\\pmod{462}<\/span> 的逆。主算法只负责确认互素与余数链，系数回溯属扩展版本。<\/p>\n<h2>补充边界：输入退化情形<\/h2>\n<p><span class=\"katex-inline\">m=n<\/span>：首轮余数 0，一次除法返回 <span class=\"katex-inline\">m<\/span>。<span class=\"katex-inline\">m=1<\/span> 或 <span class=\"katex-inline\">n=1<\/span>：次轮余数 0，返回 1。一数为另一数倍数：首轮余 0，直接返回较小者。这些退化轮次少，不变量与递减量仍成立；实际实现需单独处理 <span class=\"katex-inline\">n=0<\/span>，避免除零。<\/p><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.52<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">数学归纳法：三种形式与常见误用<\/a><\/span><\/div><h1>置换与逆序：轮换分解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章（原书 §1.2.5）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>把一组对象重排，结果可以写成一行新顺序，但要研究重排的结构——什么时候两个置换等价、置换怎样复合、一个排列离顺序有多远——就需要比&quot;一行序列&quot;更精细的表示。轮换分解把置换拆成互不相交的循环轨迹，逆序对给出扰乱程度的计数。书里在 §1.2.5 定义 <span class=\"katex-inline\">n<\/span> 元排列：<span class=\"katex-inline\">n<\/span> 个不同对象排成一行的一种排放方式（PDF 第 52 页）。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>排列（置换）<\/strong>：<span class=\"katex-inline\">n<\/span> 个不同对象的一种排放方式。3 个对象 <span class=\"katex-inline\">\\{a,b,c\\}<\/span> 共有 6 种排列：<span class=\"katex-inline\">abc,\\ acb,\\ bac,\\ bca,\\ cab,\\ cba<\/span>（PDF 第 52 页）。<span class=\"katex-inline\">n<\/span> 元置换总数为 <span class=\"katex-inline\">n!<\/span>。<\/p>\n<p><strong>置换作为映射<\/strong>：把位置上的对象看成元素，置换 <span class=\"katex-inline\">\\sigma<\/span> 把元素 <span class=\"katex-inline\">x<\/span> 送到它在新排列中的位置，记作 <span class=\"katex-inline\">\\sigma(x)<\/span>。映射满足每个元素恰有一个像、每个元素恰有一个原像。<\/p>\n<p><strong>轮换<\/strong>：形如 <span class=\"katex-inline\">(a_1\\ a_2\\ \\dots\\ a_k)<\/span> 的记号，表示 <span class=\"katex-inline\">a_1\\to a_2,\\ a_2\\to a_3,\\ \\dots,\\ a_k\\to a_1<\/span>。<span class=\"katex-inline\">k<\/span> 称轮换长度；长度为 1 的轮换表示元素不动，通常省略不写。<\/p>\n<p><strong>轮换分解<\/strong>：任一置换可写成若干互不相交轮换的乘积；不计轮换次序时，分解唯一。做法是从每个未跟踪元素出发，沿映射轨迹走一圈，回到起点即得一个轮换。<\/p>\n<p><strong>逆序对<\/strong>：位置 <span class=\"katex-inline\">i&lt;j<\/span> 但 <span class=\"katex-inline\">\\pi(i)&gt;\\pi(j)<\/span> 的一对元素；逆序对数衡量排列相对顺序排列的扰乱程度。<\/p>\n<h2>原理推演：分解一个具体置换<\/h2>\n<p>设集合 <span class=\"katex-inline\">\\{1,2,3,4,5\\}<\/span> 上置换 <span class=\"katex-inline\">\\sigma<\/span> 的映射为：<span class=\"katex-inline\">1\\to3,\\ 3\\to2,\\ 2\\to1,\\ 4\\to5,\\ 5\\to4<\/span>。<\/p>\n<p>从 1 出发：<span class=\"katex-inline\">1\\to3\\to2\\to1<\/span>，得轮换 <span class=\"katex-inline\">(1\\ 3\\ 2)<\/span>。 从剩下未跟踪的 4 出发：<span class=\"katex-inline\">4\\to5\\to4<\/span>，得轮换 <span class=\"katex-inline\">(4\\ 5)<\/span>。 分解结果：<span class=\"katex-inline\">\\sigma=(1\\ 3\\ 2)(4\\ 5)<\/span>。两个轮换互不相交，元素各走各的轨迹。<\/p>\n<p><strong>逆序计数算例<\/strong>：取排列 <span class=\"katex-inline\">\\pi=3,1,2<\/span>。逐对检查：<\/p>\n<ul><li>\n<span class=\"katex-inline\">(1,2)<\/span>：<span class=\"katex-inline\">3&gt;1<\/span>，是逆序；\n<\/li><li>\n<span class=\"katex-inline\">(1,3)<\/span>：<span class=\"katex-inline\">3&gt;2<\/span>，是逆序；\n<\/li><li>\n<span class=\"katex-inline\">(2,3)<\/span>：<span class=\"katex-inline\">1&lt;2<\/span>，不是逆序。\n<p>逆序对数为 2。排列 <span class=\"katex-inline\">1,2,3<\/span> 逆序对数为 0；<span class=\"katex-inline\">3,2,1<\/span> 逆序对数为 3。<\/p>\n<\/ul>\n<p><strong>分解唯一性的依据<\/strong>：轨迹由映射唯一确定；每个元素属于且仅属于一条轨迹，轮换之间不共享元素。换起点写同一轮换（如 <span class=\"katex-inline\">(1\\ 3\\ 2)=(3\\ 2\\ 1)=(2\\ 1\\ 3)<\/span>）只是记号循环移位，不是不同分解。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：元素集合有限；置换是双射。计数逆序假设元素可比较大小，否则只能谈位置关系。\n<\/li><li>\n失败案例 1：把相交轮换直接相乘却不展开，误以为两个轮换独立；相交轮换的复合顺序会影响结果，互不相交时次序才可交换。\n<\/li><li>\n失败案例 2：长度 1 轮换也写进分解，形式上不算错，但与省略写法对照时容易重复计数。\n<\/li><li>\n边界：轮换分解刻画映射结构，不直接给出排列的数值特征；逆序对数只数位置颠倒，不反映元素相邻距离。\n<\/li><li>\n与阶乘的关系：<span class=\"katex-inline\">n!<\/span> 是置换总数，每个置换对应一条轮换分解；枚举所有分解即枚举所有排列。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>置换 vs 排列<\/strong>：排列强调一行排放结果，置换强调元素间的映射；两者在有限集合上一一对应，书里 <span class=\"katex-inline\">\\S1.2.5<\/span> 用&quot;排列&quot;指称排放方式。\n<\/li><li>\n<strong>轮换 vs 循环链表<\/strong>：轮换是数学映射的轨迹记号；循环链表是第 2 章的数据结构，用指针把结点串成环。前者描述映射，后者组织存储。\n<\/li><li>\n<strong>逆序 vs 轮换长度<\/strong>：逆序数是统计量，回答&quot;乱多少&quot;；轮换长度是结构量，回答&quot;谁和谁在一条轨迹上&quot;。\n<\/li><li>\n<strong>置换复合 vs 置换幂<\/strong>：<span class=\"katex-inline\">\\sigma\\circ\\sigma<\/span> 是两次作用，记 <span class=\"katex-inline\">\\sigma^2<\/span>；轮换的幂把每条轨迹上的元素跳固定步长，与复合一次是不同运算。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c03 归纳法可用于按元素个数证明轮换分解存在唯一。后继：c07 遍历输出是结点的一种排列；排序算法分析（后续各卷）以逆序对数为比较交换次数的下界参照。置换在机器指令调度、字符串重排、组合计数中反复出现，c12 生成函数可用于计数带轮换约束的排列。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（置换与逆序：轮换分解）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：置换分解的依赖链、轨迹追踪与逆序计数算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把置换写成轮换并数逆序，先往回追三层：<\/p>\n<ol><li>\n有限集合上的双射：置换把每个元素送到唯一新位置，每个元素恰有一个原像。双射是轨迹追踪的前提。\n<\/li><li>\n轨迹闭合：从任一元素出发沿映射走，元素有限且每步确定，必然回到起点，形成一条闭合轨迹。\n<\/li><li>\n轨迹不相交：每个元素只属于一条轨迹；互不相交的轮换并排写出即得分解，次序可换。\n<\/ol>\n<p>依赖链方向：置换为双射 → 沿映射轨迹走圈 → 圈与圈互不相交 → 轮换乘积表示唯一 → 另按位置比较数逆序对。<\/p>\n<h2>正向推导（逐步推演）：完整分解一个五元置换<\/h2>\n<p>设集合 <span class=\"katex-inline\">\\{1,2,3,4,5\\}<\/span> 上置换 <span class=\"katex-inline\">\\sigma<\/span> 映射为：<span class=\"katex-inline\">1\\to3<\/span>，<span class=\"katex-inline\">3\\to2<\/span>，<span class=\"katex-inline\">2\\to1<\/span>，<span class=\"katex-inline\">4\\to5<\/span>，<span class=\"katex-inline\">5\\to4<\/span>。<\/p>\n<p>第一步，取未跟踪元素 1。<span class=\"katex-inline\">1\\to3<\/span>，<span class=\"katex-inline\">3\\to2<\/span>，<span class=\"katex-inline\">2\\to1<\/span>，回到起点 1，得轮换 <span class=\"katex-inline\">(1\\ 3\\ 2)<\/span>。轨迹内元素 1、3、2 标记已跟踪。<\/p>\n<p>第二步，取剩余未跟踪元素 4。<span class=\"katex-inline\">4\\to5<\/span>，<span class=\"katex-inline\">5\\to4<\/span>，回到起点 4，得轮换 <span class=\"katex-inline\">(4\\ 5)<\/span>。<\/p>\n<p>第三步，检查：五个元素全部落在两条轨迹内，无遗漏。分解为<\/p>\n<div class=\"katex-block\">\\sigma=(1\\ 3\\ 2)(4\\ 5)<\/div>\n<p>同一轮换循环移位写法等价：<span class=\"katex-inline\">(1\\ 3\\ 2)=(3\\ 2\\ 1)=(2\\ 1\\ 3)<\/span>，起点不同不产生新分解。轮换之间互不相交，因此 <span class=\"katex-inline\">(1\\ 3\\ 2)(4\\ 5)=(4\\ 5)(1\\ 3\\ 2)<\/span>。<\/p>\n<h2>数值算例：逆序对逐对清点<\/h2>\n<p><strong>算例 1<\/strong>：排列 <span class=\"katex-inline\">\\pi=3,1,2<\/span>，位置 <span class=\"katex-inline\">1,2,3<\/span> 上元素为 <span class=\"katex-inline\">3,1,2<\/span>。<\/p>\n<ul><li>\n位置对 <span class=\"katex-inline\">(1,2)<\/span>：<span class=\"katex-inline\">3&gt;1<\/span>，逆序；\n<\/li><li>\n位置对 <span class=\"katex-inline\">(1,3)<\/span>：<span class=\"katex-inline\">3&gt;2<\/span>，逆序；\n<\/li><li>\n位置对 <span class=\"katex-inline\">(2,3)<\/span>：<span class=\"katex-inline\">1&lt;2<\/span>，非逆序。\n<p>逆序对数 <span class=\"katex-inline\">=2<\/span>。<\/p>\n<\/ul>\n<p><strong>算例 2<\/strong>：排列 <span class=\"katex-inline\">3,2,1<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">(1,2)<\/span>：<span class=\"katex-inline\">3&gt;2<\/span>，逆序；\n<\/li><li>\n<span class=\"katex-inline\">(1,3)<\/span>：<span class=\"katex-inline\">3&gt;1<\/span>，逆序；\n<\/li><li>\n<span class=\"katex-inline\">(2,3)<\/span>：<span class=\"katex-inline\">2&gt;1<\/span>，逆序。\n<p>逆序对数 <span class=\"katex-inline\">=3<\/span>，即全逆序排列达到该长度最大值 <span class=\"katex-inline\">\\binom32=3<\/span>。<\/p>\n<\/ul>\n<p><strong>算例 3<\/strong>：排列 <span class=\"katex-inline\">1,2,3<\/span>，逐对比较均为升序，逆序对数 <span class=\"katex-inline\">=0<\/span>。<\/p>\n<p><strong>复合验算<\/strong>：取 <span class=\"katex-inline\">\\sigma=(1\\ 3\\ 2)(4\\ 5)<\/span>，再取 <span class=\"katex-inline\">\\tau=(1\\ 4)(2\\ 5)<\/span>。复合 <span class=\"katex-inline\">\\sigma\\circ\\tau<\/span> 先作用 <span class=\"katex-inline\">\\tau<\/span> 再作用 <span class=\"katex-inline\">\\sigma<\/span>：<span class=\"katex-inline\">1\\xrightarrow{\\tau}4\\xrightarrow{\\sigma}5<\/span>；<span class=\"katex-inline\">5\\xrightarrow{\\tau}2\\xrightarrow{\\sigma}1<\/span>，得轮换 <span class=\"katex-inline\">(1\\ 5)<\/span>。相交轮换的复合顺序影响结果；互不相交时才可交换。<\/p>\n<h2>延伸推演：分解唯一性与阶乘计数<\/h2>\n<p>唯一性依据：轨迹由映射唯一确定，每个元素属于且仅属于一条轨迹。若写出两套分解，任取元素沿两套轨迹走，落点序列相同，两套轮换在该元素处重合；逐元素覆盖即两套分解一致。<\/p>\n<p>计数方向：<span class=\"katex-inline\">n<\/span> 元置换总数 <span class=\"katex-inline\">n!<\/span>。按轮换类型分类计数时，长度为 <span class=\"katex-inline\">k<\/span> 的轮换贡献因子 <span class=\"katex-inline\">1/k<\/span>，同一长度 <span class=\"katex-inline\">j<\/span> 个轮换贡献 <span class=\"katex-inline\">1/j!<\/span>；带轮换约束的排列计数由生成函数处理（见 c12）。轮换长度本身是结构量：<span class=\"katex-inline\">k<\/span>-轮换把 <span class=\"katex-inline\">k<\/span> 个元素连成一圈，不动点即长度 1 轮换，通常省略。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>相交轮换误当独立<\/strong>：<span class=\"katex-inline\">(1\\ 2)(2\\ 3)<\/span> 与 <span class=\"katex-inline\">(2\\ 3)(1\\ 2)<\/span> 结果不同，复合不能交换。只有互不相交的轮换，先后次序才不影响乘积。<\/p>\n<p><strong>漏写不动点导致重复计数<\/strong>：分解结果里省略长度 1 轮换是通行写法；若同时在主分解与省略清单里各算一遍，会把不动点计两次。<\/p>\n<h2>对抗性追问：逆序多是否轮换就长<\/h2>\n<p>没有必然联系。逆序数是位置颠倒的统计量，轮换长度是轨迹闭合的结构量。构造一例：排列 <span class=\"katex-inline\">2,1,4,3<\/span> 有两个 2-轮换，逆序对为 <span class=\"katex-inline\">(1,2)<\/span>、<span class=\"katex-inline\">(3,4)<\/span> 共 2；另一排列 <span class=\"katex-inline\">2,3,4,1<\/span> 是一个 4-轮换，逆序对为 <span class=\"katex-inline\">(1,4),(2,4),(3,4)<\/span> 共 3。两者量纲不同，不能互相推导。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n置换作为映射为什么必须是双射？单射或不满射会怎样？\n<\/li><li>\n从元素 1 出发追踪轨迹，什么条件下得到一条闭合轮换？\n<\/li><li>\n写出置换 <span class=\"katex-inline\">1\\to2,\\ 2\\to4,\\ 3\\to1,\\ 4\\to3<\/span> 的轮换分解。\n<\/li><li>\n排列 <span class=\"katex-inline\">4,3,2,1<\/span> 有多少逆序对？全逆序最大值怎样用 <span class=\"katex-inline\">\\binom n2<\/span> 表示？\n<\/li><li>\n互不相交轮换与相交轮换在复合可交换性上差别在哪？\n<\/ol>\n<h2>延伸推演：置换复合与轮换的幂<\/h2>\n<p>复合两个置换 <span class=\"katex-inline\">\\sigma,\\tau<\/span>，按约定先作用 <span class=\"katex-inline\">\\tau<\/span> 再作用 <span class=\"katex-inline\">\\sigma<\/span>，结果记 <span class=\"katex-inline\">\\sigma\\circ\\tau<\/span>。逐元素查表：对每个 <span class=\"katex-inline\">x<\/span>，先算 <span class=\"katex-inline\">\\tau(x)<\/span>，再把结果送进 <span class=\"katex-inline\">\\sigma<\/span>。相交轮换复合不可交换，<span class=\"katex-inline\">(\\sigma\\circ\\tau)(x)<\/span> 与 <span class=\"katex-inline\">(\\tau\\circ\\sigma)(x)<\/span> 一般不同；互不相交轮换各自作用在不相交元素集上，先后次序不影响乘积。<\/p>\n<p>轮换的幂：<span class=\"katex-inline\">(a_1\\ a_2\\ \\dots\\ a_k)^p<\/span> 把轨迹上每个元素沿方向跳 <span class=\"katex-inline\">p<\/span> 步。<span class=\"katex-inline\">p=k<\/span> 时回到原位，即 <span class=\"katex-inline\">k<\/span>-轮换的阶为 <span class=\"katex-inline\">k<\/span>。置换的阶是各轮换长度的最小公倍数；判断置换幂次时，分轨迹分别计算再合并。<\/p>\n<h2>第二算例：轮换乘积追踪<\/h2>\n<p>设 <span class=\"katex-inline\">\\sigma=(1\\ 2\\ 3)<\/span>，<span class=\"katex-inline\">\\tau=(2\\ 3)<\/span>。复合 <span class=\"katex-inline\">\\sigma\\circ\\tau<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">1\\xrightarrow{\\tau}1\\xrightarrow{\\sigma}2<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">2\\xrightarrow{\\tau}3\\xrightarrow{\\sigma}1<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">3\\xrightarrow{\\tau}2\\xrightarrow{\\sigma}3<\/span>。\n<p>结果 <span class=\"katex-inline\">1\\to2,\\ 2\\to1,\\ 3\\to3<\/span>，即 <span class=\"katex-inline\">(1\\ 2)<\/span>。<\/p>\n<\/ul>\n<p>反序复合 <span class=\"katex-inline\">\\tau\\circ\\sigma<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">1\\xrightarrow{\\sigma}2\\xrightarrow{\\tau}3<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">2\\xrightarrow{\\sigma}3\\xrightarrow{\\tau}2<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">3\\xrightarrow{\\sigma}1\\xrightarrow{\\tau}1<\/span>。\n<p>结果 <span class=\"katex-inline\">1\\to3,\\ 3\\to1,\\ 2\\to2<\/span>，即 <span class=\"katex-inline\">(1\\ 3)<\/span>。两者不同，印证相交轮换不可交换。<\/p>\n<\/ul>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;轮换记号里元素顺序无关&quot;。<\/strong> 同一轮换循环移位等价，反向不等价：<span class=\"katex-inline\">(1\\ 2\\ 3)<\/span> 与 <span class=\"katex-inline\">(1\\ 3\\ 2)<\/span> 是互逆的两个轮换。\n<\/li><li>\n<strong>误解二：&quot;分解出的轮换可以任意嵌套合并&quot;。<\/strong> 只有同一轨迹的元素并入同一轮换；跨轨迹硬合并会掩盖各自闭合关系。\n<\/li><li>\n<strong>误解三：&quot;逆序数大的置换轮换个数少&quot;。<\/strong> 逆序是位置统计，轮换是轨迹结构，两者无单调关系，c05 正文已给对照例。\n<\/li><li>\n<strong>误解四：&quot;排列只关心数字大小&quot;。<\/strong> 逆序比较要求元素可排序；置换映射本身不依赖元素大小，对象可以是字母、符号或记录。\n<\/ul>\n<h2>边界对照：置换在后续结构中的出现<\/h2>\n<p>遍历输出是结点的一个排列（c07）；排序问题以减少逆序对为比较交换的度量参照；组合计数中带轮换约束的排列用母函数（c12）计数。置换概念上接 c03 归纳证明分解存在唯一，下接树与表的重排操作。机器指令调度、字符串变换都可看成有限集合上的置换作用。<\/p>\n<h2>推演补充：逆序对与相邻交换<\/h2>\n<p>冒泡、插入一类比较交换排序，每做一次相邻元素交换，逆序对数恰好改变 1：相邻两数若逆序，交换后逆序减 1；若顺序，交换后逆序加 1。因此把一个排列排到升序所需的最少相邻交换次数，等于初始逆序对数。这一结论把置换的统计量与排序算法下界联系起来。<\/p>\n<p>非相邻交换一次可以消去多个逆序对，所以选择类交换排序的最少交换次数不等于逆序对数；两者度量对象不同：相邻交换看邻位调整，跨位交换看轨迹归位。<\/p>\n<h2>第三算例：轮换类型与阶<\/h2>\n<p>置换 <span class=\"katex-inline\">\\sigma=(1\\ 4\\ 2)(3\\ 5)<\/span>，含一个 3-轮换与一个 2-轮换。<span class=\"katex-inline\">\\sigma<\/span> 的阶为 <span class=\"katex-inline\">\\operatorname{lcm}(3,2)=6<\/span>：<span class=\"katex-inline\">\\sigma^6<\/span> 回到恒等，更小幂次不能同时闭合两条轨迹。<\/p>\n<p>逐幂观察：<span class=\"katex-inline\">\\sigma^1<\/span> 原置换；<span class=\"katex-inline\">\\sigma^2<\/span> 在 3-轮换上跳两步、2-轮换上闭合；<span class=\"katex-inline\">\\sigma^3<\/span> 在 3-轮换上闭合、2-轮换上跳三步等价跳一步；<span class=\"katex-inline\">\\sigma^6<\/span> 两支都回到原位。阶由各轮换长度的最小公倍数决定，不是长度相加。<\/p>\n<h2>推演补充：排列的双射性质核验<\/h2>\n<p>置换作为映射必须满足两条：每个元素有唯一像（良定义），每个元素有唯一原像（满射）。核验时列出映射表，像集合应与原集合重合，且无两个元素映到同一处。若映射把两个元素送到同一位置，就不是置换，只是一般映射；轮换分解只对双射成立。<\/p>\n<p><span class=\"katex-inline\">n<\/span> 元置换总数 <span class=\"katex-inline\">n!<\/span>：第一位有 <span class=\"katex-inline\">n<\/span> 种选择，第二位 <span class=\"katex-inline\">n-1<\/span> 种，依次递减。枚举所有分解即枚举所有排列；计数带约束的排列时，按轮换长度分类，再用母函数汇总方案数（c12）。<\/p>\n<h2>补充对照：置换与排列的两种读法<\/h2>\n<p>&quot;排列&quot;强调一行排放结果：<span class=\"katex-inline\">abc<\/span>、<span class=\"katex-inline\">acb<\/span> 是两个排列；&quot;置换&quot;强调元素间映射：<span class=\"katex-inline\">\\sigma<\/span> 把位置上的元素送到新位置。有限集合上两者一一对应，书里 §1.2.5 先用排放方式定义排列，后续分析映射性质时使用轮换记号。<\/p>\n<p>复合置换与函数复合同构：<span class=\"katex-inline\">\\sigma\\circ\\tau<\/span> 先 <span class=\"katex-inline\">\\tau<\/span> 后 <span class=\"katex-inline\">\\sigma<\/span>；置换幂是同一映射多次复合。置换群研究封闭在复合下的置换集合，本概念只覆盖单个置换的分解与计数，群性质留到后续专题。<\/p>\n<h2>补充算例：逆序对累加<\/h2>\n<p>排列 <span class=\"katex-inline\">2,4,1,3<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">(1,2)<\/span>：<span class=\"katex-inline\">2&lt;4<\/span> 非逆序；\n<\/li><li>\n<span class=\"katex-inline\">(1,3)<\/span>：<span class=\"katex-inline\">2&gt;1<\/span> 逆序；\n<\/li><li>\n<span class=\"katex-inline\">(1,4)<\/span>：<span class=\"katex-inline\">2&lt;3<\/span> 非；\n<\/li><li>\n<span class=\"katex-inline\">(2,3)<\/span>：<span class=\"katex-inline\">4&gt;1<\/span> 逆序；\n<\/li><li>\n<span class=\"katex-inline\">(2,4)<\/span>：<span class=\"katex-inline\">4&gt;3<\/span> 逆序；\n<\/li><li>\n<span class=\"katex-inline\">(3,4)<\/span>：<span class=\"katex-inline\">1&lt;3<\/span> 非。\n<p>逆序对数 <span class=\"katex-inline\">=3<\/span>。相邻交换排序的最少交换次数即此值；跨位交换不受此限。<\/p>\n<\/ul><\/div><\/details>", "c06": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.282<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">二叉树三种遍历次序与栈实现<\/a><\/span><\/div><h1>树与二叉树的等价表示：左孩右兄<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书 §2.3.2）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>一般树的结点可以有任意多个子女，存储时若给每个结点留固定数量的子女指针，要么按最大度数预留造成浪费，要么变长结构难以统一处理。二叉树的结点只有左、右两个链字段，结构规整、遍历算法成熟。问题是：任意一棵树或一片森林，能不能不靠猜、不靠冗余，唯一地表示成一棵二叉树？书里 §2.3.2 给出森林与二叉树之间的自然对应（PDF 第 282 页）。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>树与二叉树的基本差别<\/strong>（PDF 第 282 页）：<\/p>\n<ol><li>\n树总有一个根结点，所以不为空；树的每个结点可以有 <span class=\"katex-inline\">0,1,2,3,\\dots<\/span> 个子女。\n<\/li><li>\n二叉树可以为空；每个结点可以有 0、1 或 2 个子女，并且区分&quot;左&quot;子女与&quot;右&quot;子女。\n<\/ol>\n<p><strong>森林<\/strong>：零棵或多棵不相交树的有序集合；任意结点下面的诸子树形成一个森林。<\/p>\n<p><strong>自然对应的构造步骤<\/strong>（书里图示 (1)→(2)→(3)）：<\/p>\n<ul><li>\n先把同一父母的子女横向链接在一起；\n<\/li><li>\n删去父母到第一个子女之外的竖直链；\n<\/li><li>\n把图顺时针转动 <span class=\"katex-inline\">45^\\circ<\/span>，稍加调整，得到一棵二叉树。\n<\/ul>\n<p><strong>两个链字段的含义<\/strong>：二叉树结点的左链（LLINK）指向原树中该结点的第一个子女；右链（RLINK）指向原树中该结点的下一个兄弟。<\/p>\n<p><strong>可逆性<\/strong>：逆转这一过程，任何二叉树都唯一对应于一个树的森林。特殊地，它给出树与一类特殊二叉树——有根但无右子树的二叉树——之间的对应；换视角让树根对应二叉树表头，就得到 <span class=\"katex-inline\">n+1<\/span> 个结点的树与 <span class=\"katex-inline\">n<\/span> 个结点的二叉树之间的一一对应（PDF 第 282 页）。<\/p>\n<h2>原理推导与推演：对应为什么是双射<\/h2>\n<p>正向映射分两层关系。向下关系：父母到长子，存进左链；横向关系：兄弟之间长幼次序，存进右链。原树的两类邻接信息各占一个字段，没有遗漏也没有重叠。<\/p>\n<p>反向还原：读左链回到长子，读右链回到下一个兄弟；按&quot;长子—兄弟&quot;规则把二叉树拆开，重建每棵树的父母—子女层次。两个方向的映射都由规则唯一确定，不存在第二种拆解方式，因此是一一对应。<\/p>\n<p>对照单棵有序树：根的子女按次序排列，第一个子女挂左链，其余兄弟依次挂右链。森林各棵树的根之间也视为兄弟，用右链首尾相接。这样森林结构与二叉树结构在结点集合上完全对齐。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：讨论的是有序树或有序森林；兄弟次序在原结构中有意义。\n<\/li><li>\n失败案例 1：只保留左链。右链承担兄弟联系，去掉之后根的第二个及以后子女无处挂靠，原树分支信息丢失。\n<\/li><li>\n失败案例 2：只保留右链。左链承担父母到长子的联系，去掉之后根与第一子女的关系断裂，还原不出层次。\n<\/li><li>\n边界：该对应是表示层等价，不改变原树的遍历语义；把二叉树遍历结果翻译回树时，先序对应树的先根次序，后序对应树的后根次序，中序要按对应规则解释。\n<\/li><li>\n误用提醒：二叉树的左右子女在原树里不是&quot;两个孩子&quot;，左是长子、右是兄弟；直接按二叉树语义画原树会误解分支关系。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>左孩右兄 vs 普通子女表<\/strong>：子女表把所有孩子挂在一个变长数组或链表里；左孩右兄用两个固定字段表达同样信息，代价是访问兄弟要走右链、访问子女要走左链再转右链。\n<\/li><li>\n<strong>有序树 vs 定向树<\/strong>：有序树区分子女次序，对应到二叉树时右链次序明确；定向树只看结点相对定向，不区分次序，对应关系的语义随之放宽。\n<\/li><li>\n<strong>二叉树表示 vs 二叉搜索树<\/strong>：前者是存储映射手段，后者是带键值有序性的结构；左孩右兄表示出的二叉树不具备搜索树的键值约束。\n<\/li><li>\n<strong>森林对应 vs 单树对应<\/strong>：森林各根用右链串成兄弟链；单棵树只是森林含一棵树的特例。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c08 线性表的链接思想是链字段表示的基础；c07 二叉树三序遍历在这棵对应二叉树上执行，结果可翻译回原树。后继：第 2 章树的计数、路径长度分析都建立在这一对应之上；多重链接结构（§2.4）是在两个链字段之外再加挂其他关系链。<\/p>\n<h2>补充：对应关系解决的具体工程问题<\/h2>\n<p>一般树若按&quot;每结点预留最大子女指针&quot;存储，度数小的结点浪费字段，度数大的结点又要变长记录；若用子女表挂在结点上，表长不一，遍历与插入都要处理变长结构。左孩右兄把两种极端收成统一的两字段结点：向下找长子走左链，横向找兄弟走右链，结点格式与二叉树完全一致。存储侧只存两类邻接，访问侧再按语义解释，这是该对应在数据结构设计上的主要价值。<\/p>\n<p>从还原角度看，对应不改变结点集合，也不改变原树的层次与长幼次序；它改变的只是连线的组织方式。讨论树的高度、路径长度、结点度数时，先确认是在原树语义下计数，还是在对应二叉树语义下计数，两套高度数值一般不同：原树高度按子女层计，对应二叉树高度可能因兄弟右链拉长而变大。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（树与二叉树的等价表示：左孩右兄）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：森林到二叉树的对应链、构造步骤与可逆性核验<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把一般树压成二叉树表示，先往回追三层：<\/p>\n<ol><li>\n原树的邻接信息分两类：父母到子女的向下关系，兄弟之间的长幼横向关系。两类信息必须各有去处，不能遗漏。\n<\/li><li>\n二叉树结点只有两个链字段。左链、右链各承担一类原关系；字段语义在构造前固定下来。\n<\/li><li>\n对应必须可逆：从二叉树能还原原森林，否则表示只是单向压缩，结构信息有损失。\n<\/ol>\n<p>依赖链方向：拆分原树两类邻接 → 左链挂长子、右链挂兄弟 → 横向链接同父母子女 → 删去多余竖直链 → 旋转 <span class=\"katex-inline\">45^\\circ<\/span> 成二叉树 → 反向规则还原森林。<\/p>\n<h2>正向推导（逐步推演）：构造四步走<\/h2>\n<p><strong>第一步，横向链接子女<\/strong>。对每个父母，把其子女按长幼次序用横向链串起来；同一家庭的子女形成一条兄弟链。<\/p>\n<p><strong>第二步，保留父母到长子的竖直链<\/strong>。其余竖直链（父母到第二及以后子女）删去；父母只通过左链接到长子上。<\/p>\n<p><strong>第三步，旋转成形<\/strong>。把得到的示意图顺时针转动 <span class=\"katex-inline\">45^\\circ<\/span>，调整连线角度，即为一棵二叉树。根的长子在左子树位置，下一兄弟在右链位置。<\/p>\n<p><strong>第四步，森林串联<\/strong>。多棵树的根之间视为兄弟，用右链首尾相接；整片森林压成一棵二叉树。<\/p>\n<p>字段语义固定为：LLINK 指向第一个子女，RLINK 指向下一个兄弟。原树的向下关系与横向关系各占一个字段，无重叠、无遗漏。<\/p>\n<h2>数值算例：两棵树森林的对应还原<\/h2>\n<p>设森林第一棵：根 <span class=\"katex-inline\">A<\/span>，子女 <span class=\"katex-inline\">B,C<\/span>，<span class=\"katex-inline\">C<\/span> 下有 <span class=\"katex-inline\">K<\/span>；第二棵：根 <span class=\"katex-inline\">D<\/span>，子女 <span class=\"katex-inline\">E,F,G<\/span>，<span class=\"katex-inline\">E<\/span> 下有 <span class=\"katex-inline\">H<\/span>，<span class=\"katex-inline\">F<\/span> 下有 <span class=\"katex-inline\">J<\/span>（对应书里图示方向，PDF 第 282 页）。<\/p>\n<p>正向构造：<\/p>\n<ul><li>\n<span class=\"katex-inline\">A<\/span> 的长子 <span class=\"katex-inline\">B<\/span> 挂 <span class=\"katex-inline\">A<\/span> 左链，<span class=\"katex-inline\">B<\/span> 的下一兄弟 <span class=\"katex-inline\">C<\/span> 挂 <span class=\"katex-inline\">B<\/span> 右链；<span class=\"katex-inline\">C<\/span> 的长子 <span class=\"katex-inline\">K<\/span> 挂 <span class=\"katex-inline\">C<\/span> 左链。\n<\/li><li>\n<span class=\"katex-inline\">D<\/span> 的长子 <span class=\"katex-inline\">E<\/span> 挂 <span class=\"katex-inline\">D<\/span> 左链，<span class=\"katex-inline\">E<\/span> 右链接 <span class=\"katex-inline\">F<\/span>，<span class=\"katex-inline\">F<\/span> 右链接 <span class=\"katex-inline\">G<\/span>；<span class=\"katex-inline\">E<\/span> 长子 <span class=\"katex-inline\">H<\/span> 挂左链，<span class=\"katex-inline\">F<\/span> 长子 <span class=\"katex-inline\">J<\/span> 挂左链。\n<\/li><li>\n两棵树根 <span class=\"katex-inline\">A,D<\/span> 视为兄弟，<span class=\"katex-inline\">A<\/span> 右链接 <span class=\"katex-inline\">D<\/span>。\n<\/ul>\n<p>反向还原：<\/p>\n<ul><li>\n读 <span class=\"katex-inline\">A<\/span> 左链回到长子 <span class=\"katex-inline\">B<\/span>；<span class=\"katex-inline\">B<\/span> 右链回到下一个兄弟 <span class=\"katex-inline\">C<\/span>；<span class=\"katex-inline\">C<\/span> 左链回到长子 <span class=\"katex-inline\">K<\/span>。\n<\/li><li>\n读 <span class=\"katex-inline\">D<\/span> 左链回到 <span class=\"katex-inline\">E<\/span>，<span class=\"katex-inline\">E<\/span> 右链回 <span class=\"katex-inline\">F<\/span>，<span class=\"katex-inline\">F<\/span> 右链回 <span class=\"katex-inline\">G<\/span>；<span class=\"katex-inline\">E<\/span> 左链回 <span class=\"katex-inline\">H<\/span>，<span class=\"katex-inline\">F<\/span> 左链回 <span class=\"katex-inline\">J<\/span>。\n<\/li><li>\n根链 <span class=\"katex-inline\">A<\/span> 右链回 <span class=\"katex-inline\">D<\/span>，还原两棵树的并列关系。\n<\/ul>\n<p>两个方向映射唯一：每个字段读回的原关系确定，不存在第二种拆解。<\/p>\n<h2>延伸推演：对应带来的计数与遍历平移<\/h2>\n<p>单棵有序树与&quot;有根、无右子树&quot;的二叉树一一对应；换视角把树根当作二叉树表头，<span class=\"katex-inline\">n+1<\/span> 个结点的树对应 <span class=\"katex-inline\">n<\/span> 个结点的二叉树。这层对应让树的计数问题可以转到二叉树计数上处理。<\/p>\n<p>遍历平移方向：原树的先根次序对应对应二叉树的先序；原树的后根次序对应对应二叉树的后序。中序不能直接照搬，要按&quot;左子树—根—右子树&quot;在映射语义下解释。c07 的三序算法先在二叉树上实现，结果再翻译回树遍历。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>只留左链<\/strong>：右链承担兄弟联系，去掉后根的第二个及以后子女无处挂靠，分支信息丢失。 <strong>只留右链<\/strong>：左链承担父母到长子的联系，去掉后根与第一子女断裂，层次无法还原。 <strong>按二叉树语义误读<\/strong>：把左链孩子当成&quot;左子女&quot;、右链孩子当成&quot;右子女&quot;，会画出与原树分支不同的图。左是长子，右是兄弟，读字段前先确认语义。<\/p>\n<h2>对抗性追问：这一对应是否改变原树的结点数<\/h2>\n<p>不改变。对应是结点集合上的双射：原树 <span class=\"katex-inline\">n<\/span> 个结点，二叉树仍为 <span class=\"katex-inline\">n<\/span> 个结点；改变的只是连线关系与字段解释。若表示后结点数增减，说明构造中重复挂接或漏挂了结点。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n树与二叉树在根是否可空、子女个数、左右区分上有哪三点差别？\n<\/li><li>\n左链与右链各指向原树的什么结点？\n<\/li><li>\n写出构造森林对应二叉树的四个步骤。\n<\/li><li>\n为什么说对应是双射？反向还原依据什么规则？\n<\/li><li>\n树的先根、后根次序分别对应二叉树哪种遍历次序？\n<\/ol>\n<h2>延伸推演：三结点树的对应枚举<\/h2>\n<p>取三个结点的有序树，看对应二叉树形态。<\/p>\n<p><strong>情形一：根 <span class=\"katex-inline\">A<\/span> 下两个子女 <span class=\"katex-inline\">B,C<\/span>。<\/strong> 正向：<span class=\"katex-inline\">A<\/span> 左链挂 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 右链挂 <span class=\"katex-inline\">C<\/span>。反向：<span class=\"katex-inline\">A<\/span> 左链回 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 右链回 <span class=\"katex-inline\">C<\/span>，<span class=\"katex-inline\">C<\/span> 无左链。对应二叉树根 <span class=\"katex-inline\">A<\/span> 左孩子 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 右孩子 <span class=\"katex-inline\">C<\/span>。<\/p>\n<p><strong>情形二：根 <span class=\"katex-inline\">A<\/span> 下一个子女 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 下一个子女 <span class=\"katex-inline\">C<\/span>。<\/strong> 正向：<span class=\"katex-inline\">A<\/span> 左链挂 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 左链挂 <span class=\"katex-inline\">C<\/span>。反向沿左链逐层下移。对应二叉树是一条左斜链。<\/p>\n<p><strong>情形三：森林两棵单根树 <span class=\"katex-inline\">A,B<\/span>。<\/strong> 正向：<span class=\"katex-inline\">A<\/span> 右链挂 <span class=\"katex-inline\">B<\/span>。反向：<span class=\"katex-inline\">A<\/span> 右链回 <span class=\"katex-inline\">B<\/span>，两者均无左链。对应二叉树根 <span class=\"katex-inline\">A<\/span> 右孩子 <span class=\"katex-inline\">B<\/span>。<\/p>\n<p>三例覆盖&quot;兄弟横向&quot;&quot;子女纵向&quot;&quot;森林并列&quot;三类关系在链字段上的落点。<\/p>\n<h2>延伸推演：对应与计数、高度的差别<\/h2>\n<p>树计数问题常转到二叉树计数：<span class=\"katex-inline\">n<\/span> 个结点的有序树与 <span class=\"katex-inline\">n-1<\/span> 个结点的二叉树一一对应（根作表头的视角）。计数时先确认对应口径：是 <span class=\"katex-inline\">n<\/span> 结点树对 <span class=\"katex-inline\">n<\/span> 结点二叉树，还是 <span class=\"katex-inline\">n+1<\/span> 对 <span class=\"katex-inline\">n<\/span>，两套基数不能混。<\/p>\n<p>高度口径要分开：原树高度按子女层数计；对应二叉树高度可能因兄弟右链拉长而变大。例如长兄弟链在二叉树上表现为右斜链，高度按右链累计。分析路径长度、平衡度时，先声明用哪一套高度，避免把原树的层深与对应二叉树的链深混算。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;左孩右兄就是把树转成二叉搜索树&quot;。<\/strong> 对应只做结构映射，不挂键值有序性；搜索树的左小右大约束在这里不存在。\n<\/li><li>\n<strong>误解二：&quot;右链孩子是原树的右子女&quot;。<\/strong> 右链指向兄弟，不是子女；读字段时先回到 c06 的语义定义。\n<\/li><li>\n<strong>误解三：&quot;对应会减少结点&quot;。<\/strong> 双射保持结点数不变；若还原后结点变少，说明构造中漏挂或重复挂接了链。\n<\/li><li>\n<strong>误解四：&quot;无序树也能直接套用同一对应&quot;。<\/strong> 对应依赖子女次序；定向树不区分次序时，右链次序语义放宽，还原前先确认原结构是否有序。\n<\/ul>\n<h2>边界对照：与多重链接结构的衔接<\/h2>\n<p>c08 的链接分配是单链思想在表上的推广；本概念是双链思想在树上的推广。§2.4 多链结构在两个链字段之外再加挂其他关系链（如父结点链、横向遍历链），字段更多但构造原则相同：每类邻接关系分配一个字段，字段语义在构造前固定。遍历算法（c07）在对应二叉树上执行后，结果按先根、后根翻译回原树；树的路径长度、度数分析都建立在这层表示之上。<\/p>\n<h2>推演补充：对应关系的形式化读法<\/h2>\n<p>形式上，森林 <span class=\"katex-inline\">F=(T_1,T_2,\\dots,T_k)<\/span> 对应二叉树 <span class=\"katex-inline\">B<\/span>：<span class=\"katex-inline\">B<\/span> 根为 <span class=\"katex-inline\">T_1<\/span> 根；<span class=\"katex-inline\">B<\/span> 根左子树对应 <span class=\"katex-inline\">T_1<\/span> 除去根后的子女森林；<span class=\"katex-inline\">B<\/span> 根右子树对应 <span class=\"katex-inline\">T_2,\\dots,T_k<\/span> 组成的森林。这是递归定义，与树的递归定义互映：原树按根与子女森林拆分，二叉树按根与左右子树拆分。<\/p>\n<p>反向还原同样递归：左子树还原成长子带领的兄弟链，右子树还原为下一兄弟子树。两层递归互相闭合，保证双射。写树的存储结构时，这一递归读法就是结点两个链字段的语义来源。<\/p>\n<h2>第三算例：四结点链状树<\/h2>\n<p>原树：<span class=\"katex-inline\">A\\to B\\to C\\to D<\/span> 单支向下。对应二叉树：<span class=\"katex-inline\">A<\/span> 左链 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 左链 <span class=\"katex-inline\">C<\/span>，<span class=\"katex-inline\">C<\/span> 左链 <span class=\"katex-inline\">D<\/span>，全为左斜链。先根遍历 <span class=\"katex-inline\">A,B,C,D<\/span>，后根 <span class=\"katex-inline\">D,C,B,A<\/span>，与原树先根、后根一致。<\/p>\n<p>对照兄弟链情形：<span class=\"katex-inline\">A<\/span> 下三子女 <span class=\"katex-inline\">B,C,D<\/span>。对应二叉树 <span class=\"katex-inline\">A<\/span> 左链 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 右链 <span class=\"katex-inline\">C<\/span>，<span class=\"katex-inline\">C<\/span> 右链 <span class=\"katex-inline\">D<\/span>，全为右斜链。两种形态在二叉树表示上方向不同，还原时左链找子女、右链找兄弟，不会混淆。<\/p>\n<h2>推演补充：表示等价与语义保留<\/h2>\n<p>左孩右兄是表示层等价：原树的层次、长幼、父子关系全部保留，只改连线组织。判断一次转换是否正确，检查三条：长子是否挂左链，兄弟是否挂右链，根之间是否用右链串联。三条都满足，还原出的森林与原树同构；缺任一条，结构信息就有丢失或错位。<\/p>\n<p>工程上这一表示的价值在于结点格式统一：不必为高度数结点预留变长子女表，也不必在结点内挂不定长数组；两个固定字段配合递归算法，覆盖任意分支度的树。代价是访问兄弟要走右链、访问子女要走左链再转右链，局部路径比直接子女表多一跳。<\/p>\n<h2>补充对照：树表示的几种备选方案<\/h2>\n<p>除左孩右兄外，树的存储还有三类常见方案。一是子女表：每个结点挂一个变长链表或数组记录全部子女，访问子女直接，但结点长度不定，遍历要处理表尾标记。二是邻接表：整张树存成边表，结点编号与父子边分列，适合静态查询，局部访问要查表。三是多重链表：结点同时挂父母链、子女链、兄弟链，字段冗余大，换取多方向快速访问。<\/p>\n<p>左孩右兄在字段固定性与表示简洁之间取平衡：两个字段覆盖两类基本邻接，递归算法直接复用二叉树框架。选哪种表示取决于访问模式：频繁子女遍历选子女表，频繁兄弟横向扫描选右链结构，多方向查询才需要多重链。<\/p>\n<h2>补充算例：森林三棵树还原<\/h2>\n<p>设森林根 <span class=\"katex-inline\">A,B,C<\/span>，<span class=\"katex-inline\">A<\/span> 子女 <span class=\"katex-inline\">D<\/span>，<span class=\"katex-inline\">B<\/span> 子女 <span class=\"katex-inline\">E,F<\/span>，<span class=\"katex-inline\">C<\/span> 无子女。对应二叉树：<span class=\"katex-inline\">A<\/span> 左链 <span class=\"katex-inline\">D<\/span>，<span class=\"katex-inline\">A<\/span> 右链 <span class=\"katex-inline\">B<\/span>；<span class=\"katex-inline\">B<\/span> 左链 <span class=\"katex-inline\">E<\/span>，<span class=\"katex-inline\">E<\/span> 右链 <span class=\"katex-inline\">F<\/span>；<span class=\"katex-inline\">B<\/span> 右链 <span class=\"katex-inline\">C<\/span>。<\/p>\n<p>反向还原：<span class=\"katex-inline\">A<\/span> 左链回长子 <span class=\"katex-inline\">D<\/span>，<span class=\"katex-inline\">A<\/span> 右链回下一棵根 <span class=\"katex-inline\">B<\/span>；<span class=\"katex-inline\">B<\/span> 左链回 <span class=\"katex-inline\">E<\/span>，<span class=\"katex-inline\">E<\/span> 右链回兄弟 <span class=\"katex-inline\">F<\/span>，<span class=\"katex-inline\">B<\/span> 右链回根 <span class=\"katex-inline\">C<\/span>。三棵树并列关系由根链 <span class=\"katex-inline\">A\\to B\\to C<\/span> 保留，子女层次由左链下沉保留。<\/p>\n<h2>补充边界：有序与无序的对应差异<\/h2>\n<p>有序树区分子女长幼，右链次序明确；定向树只看相对方向、不排次序，对应到二叉树时右链不再携带顺序信息。讨论无序森林的对应时，还原出的二叉树右子树结构不唯一，不能套用有序树的唯一双射结论。书里默认讨论的有序树，子女次序在计算机表示中天然带一个隐含顺序。<\/p>\n<h2>补充计数：两字段覆盖的邻接关系<\/h2>\n<p>原树邻接只有父子与兄弟两类；左孩字段挂长子，右兄字段挂下一兄弟，两类邻接各占一个链方向。没有为&quot;父母&quot;单独留字段时，向上访问需沿根到结点路径回溯；若应用频繁向上访问，需在结点另加父链，这属于多重链接扩展，超出左孩右兄的两字段约定。<\/p><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.270<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">线性表的数组分配与链接分配：代价对比<\/a><\/span><\/div><h1>二叉树三种遍历次序与栈实现<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2 章（原书 §2.3.1）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>树的信息靠结点之间的分支关系承载，但要输出、比较或搜索树，需要把结点排成一个线性序列。遍历就是系统地考察结点、使每个结点恰访问一次的方法；同一棵树按不同规则走出不同序列，次序约定决定了序列能回答什么问题。书里 §2.3.1 在进入树的进一步分析之前，先把二叉树三种递归遍历讲透（PDF 第 270 页）。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>二叉树定义<\/strong>：结点的有限集，或者为空，或者由一个根和两棵互不相交的二叉树（左子树、右子树）组成。内存表示中每个结点有两个链 LLINK、RLINK，外加指向树根的指针 T；树空时 <span class=\"katex-inline\">T=\\Lambda<\/span>，否则 T 是根结点地址（PDF 第 270 页）。<\/p>\n<p><strong>遍历<\/strong>：系统地考察树结点，每个结点恰访问一次。完全遍历给出结点的一种线性排列，序列中可以谈&quot;前一个&quot;&quot;后一个&quot;结点。<\/p>\n<p><strong>先序遍历（preorder）<\/strong>：访问根 → 遍历左子树 → 遍历右子树。<\/p>\n<p><strong>中序遍历（inorder）<\/strong>：遍历左子树 → 访问根 → 遍历右子树。<\/p>\n<p><strong>后序遍历（postorder）<\/strong>：遍历左子树 → 遍历右子树 → 访问根。<\/p>\n<p>空树时什么都不做，已经算&quot;遍历&quot;；非空树按上述三步递归定义。书里样例二叉树的先序输出为 <span class=\"katex-inline\">A\\ B\\ D\\ C\\ E\\ G\\ F\\ H\\ J<\/span>（PDF 第 270 页）。<\/p>\n<h2>原理推导与推演：样例树的三序输出<\/h2>\n<p>样例树结构：根 <span class=\"katex-inline\">A<\/span>，左子树根 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 的右为空、左孩子 <span class=\"katex-inline\">D<\/span>；右子树根 <span class=\"katex-inline\">C<\/span>，<span class=\"katex-inline\">C<\/span> 的左孩子 <span class=\"katex-inline\">E<\/span>、右孩子 <span class=\"katex-inline\">F<\/span>；<span class=\"katex-inline\">E<\/span> 左为空、右孩子 <span class=\"katex-inline\">G<\/span>；<span class=\"katex-inline\">F<\/span> 的左孩子 <span class=\"katex-inline\">H<\/span>、右孩子 <span class=\"katex-inline\">J<\/span>。<\/p>\n<p>先序（根左右）：<span class=\"katex-inline\">A\\
