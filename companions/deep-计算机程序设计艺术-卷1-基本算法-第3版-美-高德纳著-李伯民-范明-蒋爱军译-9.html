span class=\"katex-inline\">m=68,\\ n=51<\/span>。<span class=\"katex-inline\">\\gcd(119,68)=\\gcd(68,51)<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">68=1\\cdot51+17<\/span>，<span class=\"katex-inline\">r=17<\/span>；更新 <span class=\"katex-inline\">m=51,\\ n=17<\/span>。<span class=\"katex-inline\">\\gcd(68,51)=\\gcd(51,17)<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">51=3\\cdot17+0<\/span>，<span class=\"katex-inline\">r=0<\/span>；终止，返回 <span class=\"katex-inline\">n=17<\/span>。\n<\/ol>\n<p>四次除法，余数序列 <span class=\"katex-inline\">68,51,17,0<\/span>。核验：<span class=\"katex-inline\">17\\mid51<\/span>，<span class=\"katex-inline\">17\\mid68<\/span>，<span class=\"katex-inline\">17\\mid119<\/span>，<span class=\"katex-inline\">17\\mid544<\/span>；且无更大公共因子，答案成立。<\/p>\n<p><strong>第二算例：相邻斐波那契对<\/strong>。取 <span class=\"katex-inline\">F_6=8,\\ F_5=5<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">8=1\\cdot5+3<\/span>，<span class=\"katex-inline\">r=3<\/span>；<span class=\"katex-inline\">m=5,\\ n=3<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">5=1\\cdot3+2<\/span>，<span class=\"katex-inline\">r=2<\/span>；<span class=\"katex-inline\">m=3,\\ n=2<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">3=1\\cdot2+1<\/span>，<span class=\"katex-inline\">r=1<\/span>；<span class=\"katex-inline\">m=2,\\ n=1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">2=2\\cdot1+0<\/span>，终止，<span class=\"katex-inline\">\\gcd=1<\/span>。四次除法走完。斐波那契对每一步商都是 1，余数下降最慢，构成最坏情形。\n<\/ol>\n<h2>延伸推演：步数与斐波那契指数的挂钩方向<\/h2>\n<p>斐波那契数列 <span class=\"katex-inline\">F_0=0,\\ F_1=1,\\ F_{n+2}=F_{n+1}+F_n<\/span>，通项方向为 <span class=\"katex-inline\">F_n\\approx\\varphi^n/\\sqrt5<\/span>，<span class=\"katex-inline\">\\varphi=(1+\\sqrt5)/2<\/span>。逆推余数链：最后一步余数为 0，倒数第二步为 <span class=\"katex-inline\">r_{k-1}<\/span>，向前每步后项不超过前项；下降最慢的链条逐项复刻斐波那契递推。若 <span class=\"katex-inline\">\\gcd(F_{k+1},F_k)<\/span> 需要 <span class=\"katex-inline\">k-1<\/span> 次除法，而 <span class=\"katex-inline\">F_k\\approx\\varphi^k/\\sqrt5<\/span>，则 <span class=\"katex-inline\">k=O(\\log F_k)<\/span>。两个输入中较小者记为 <span class=\"katex-inline\">s<\/span>，除法次数为 <span class=\"katex-inline\">O(\\log s)<\/span>。这是定理方向与量级归属；完整 Lamé 定理证明在数论教材中展开，本概念不展开定理编号对应。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>替换顺序写反<\/strong>。E3 应先 <span class=\"katex-inline\">m\\leftarrow n<\/span>、再 <span class=\"katex-inline\">n\\leftarrow r<\/span>。若先 <span class=\"katex-inline\">n\\leftarrow r<\/span>，再 <span class=\"katex-inline\">m\\leftarrow n<\/span>，<span class=\"katex-inline\">m<\/span> 拿到的是 <span class=\"katex-inline\">r<\/span> 而不是原 <span class=\"katex-inline\">n<\/span>，原 <span class=\"katex-inline\">n<\/span> 已丢失；后续数对不再是不变量证明里的 <span class=\"katex-inline\">(n,r)<\/span>，答案出错。<\/p>\n<p><strong>输入非正整数<\/strong>。算法 E 假设正整数；含 0 时 <span class=\"katex-inline\">n=0<\/span> 除法无定义，负数余数语义不统一。实际使用先取绝对值并单独处理 0。<\/p>\n<h2>对抗性追问：gcd 不变量证明能否替代终止性证明<\/h2>\n<p>不能。不变量保证答案不跑偏，终止性保证过程会停下；两者回答不同问题。只证不变量，可能存在永不结束的循环；只证余数递减，停下时仍需不变量确认返回值是 gcd。c01 五条特征里，可行性对应基本操作，有限性对应余数递减，正确性对应不变量，三者分别核验。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">m=qn+r<\/span> 后，怎样证明 <span class=\"katex-inline\">(m,n)<\/span> 与 <span class=\"katex-inline\">(n,r)<\/span> 公约数集合相同？\n<\/li><li>\n终止性依赖哪个严格递减量？为什么非负严格递减序列必到 0？\n<\/li><li>\n手算 <span class=\"katex-inline\">\\gcd(252,105)<\/span>：写出每轮商、余数与更新后的数对。\n<\/li><li>\n最坏情形输入为什么对应相邻斐波那契数？量级怎样写成 <span class=\"katex-inline\">O(\\log\\min(m,n))<\/span>？\n<\/li><li>\n替换顺序写反后，哪一个原值丢失？后续数对错在哪里？\n<\/ol>\n<h2>延伸推演：扩展欧几里得与贝祖等式方向<\/h2>\n<p>主算法只返回 gcd；扩展版本在余数替换的同时保留商，可回溯出整数 <span class=\"katex-inline\">s,t<\/span> 使 <span class=\"katex-inline\">sm+tn=\\gcd(m,n)<\/span>。回溯方向：把每轮 <span class=\"katex-inline\">r=m-qn<\/span> 代回上一式，逐层消去中间余数，最后留下 <span class=\"katex-inline\">m,n<\/span> 的线性组合。这一工具是模逆元计算的基础：在 <span class=\"katex-inline\">\\gcd(a,m)=1<\/span> 时，贝祖等式给出 <span class=\"katex-inline\">sa\\equiv1\\pmod m<\/span>，<span class=\"katex-inline\">s<\/span> 即 <span class=\"katex-inline\">a<\/span> 模 <span class=\"katex-inline\">m<\/span> 的逆。<\/p>\n<p>理解主算法时先把不变量与终止性吃透；扩展版本只是在同一条余数链上附加系数记录，不改变替换顺序与复杂度量级。<\/p>\n<h2>第二算例：<span class=\"katex-inline\">\\gcd(252,105)<\/span> 逐步<\/h2>\n<ol><li>\n<span class=\"katex-inline\">252=2\\cdot105+42<\/span>，<span class=\"katex-inline\">r=42<\/span>；更新 <span class=\"katex-inline\">m=105,\\ n=42<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">105=2\\cdot42+21<\/span>，<span class=\"katex-inline\">r=21<\/span>；更新 <span class=\"katex-inline\">m=42,\\ n=21<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">42=2\\cdot21+0<\/span>，终止，<span class=\"katex-inline\">\\gcd=21<\/span>。\n<\/ol>\n<p>核验：<span class=\"katex-inline\">21\\mid105<\/span>（<span class=\"katex-inline\">105=5\\cdot21<\/span>），<span class=\"katex-inline\">21\\mid252<\/span>（<span class=\"katex-inline\">252=12\\cdot21<\/span>）；无更大公共因子。三轮除法，余数 <span class=\"katex-inline\">42,21,0<\/span> 递减。<\/p>\n<p>再取 <span class=\"katex-inline\">\\gcd(76,32)<\/span>：<\/p>\n<ol><li>\n<span class=\"katex-inline\">76=2\\cdot32+12<\/span>；<span class=\"katex-inline\">m=32,\\ n=12<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">32=2\\cdot12+8<\/span>；<span class=\"katex-inline\">m=12,\\ n=8<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">12=1\\cdot8+4<\/span>；<span class=\"katex-inline\">m=8,\\ n=4<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">8=2\\cdot4+0<\/span>；<span class=\"katex-inline\">\\gcd=4<\/span>。\n<\/ol>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;商越大算法越快&quot;。<\/strong> 步数由余数下降速度决定，商只写在除法式里；最坏情形商全为 1（斐波那契对），余数下降最慢。\n<\/li><li>\n<strong>误解二：&quot;gcd 只对素数有意义&quot;。<\/strong> 任意正整数对都有 gcd；素数概念用于互素判断（c09 周期条件），不是 gcd 算法的前提。\n<\/li><li>\n<strong>误解三：&quot;余数可以等于除数&quot;。<\/strong> 余数定义 <span class=\"katex-inline\">0\\le r&lt;n<\/span>，<span class=\"katex-inline\">r<\/span> 严格小于除数；若取到等于 <span class=\"katex-inline\">n<\/span>，商应再加 1、余数归 0。\n<\/li><li>\n<strong>误解四：&quot;算法 E 直接给出质因数分解&quot;。<\/strong> 主算法只给公共因子；分解 <span class=\"katex-inline\">m,n<\/span> 各自的素因子是另一类问题，gcd 结果不等于分解结果。\n<\/ul>\n<h2>边界对照：本算法在全书的位置<\/h2>\n<p>c01 五条特征在 E 上完整落地：输入正整数、输出 gcd、操作基本、分支确定、余数递减保证终止。c09 发生器周期条件中的互素判断，直接调用 gcd 概念；c11 调和数分析的是另一类求和量级，与本算法的对数步数形成对照。扩展欧几里得是模运算章节的预备工具，后续求逆、解同余方程都沿这条余数链展开。<\/p>\n<h2>推演补充：余数链与连分数<\/h2>\n<p>欧几里得算法的商序列就是连分数展开的各项。<span class=\"katex-inline\">m/n<\/span> 依次取整：<span class=\"katex-inline\">m/n=q_1+1/(n/r_1)<\/span>，递归展开到余数为 0。每一轮除法对应连分数一层；算法步数等于连分数层数。这一联系把 gcd 计算、连分数逼近、有理数约分串在同一条余数链上。<\/p>\n<p>理解这一联系时，主算法的两个性质各自对应：不变量对应连分数逐层取整不改变原值；递减量对应层数有限。后续数论应用（贝祖等式、模逆、丢番图方程）都沿这条链回溯系数。<\/p>\n<h2>第三算例：<span class=\"katex-inline\">\\gcd(1071,462)<\/span> 全程<\/h2>\n<ol><li>\n<span class=\"katex-inline\">1071=2\\cdot462+147<\/span>；<span class=\"katex-inline\">m=462,\\ n=147<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">462=3\\cdot147+21<\/span>；<span class=\"katex-inline\">m=147,\\ n=21<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">147=7\\cdot21+0<\/span>；终止，<span class=\"katex-inline\">\\gcd=21<\/span>。\n<\/ol>\n<p>核验：<span class=\"katex-inline\">21\\mid462<\/span>（<span class=\"katex-inline\">462=22\\cdot21<\/span>），<span class=\"katex-inline\">21\\mid1071<\/span>（<span class=\"katex-inline\">1071=51\\cdot21<\/span>）。三轮除法，余数 <span class=\"katex-inline\">147,21,0<\/span>。<\/p>\n<h2>推演补充：最坏情形的直觉<\/h2>\n<p>为什么相邻斐波那契数最难除？每轮商越小，余数下降越慢；商为 1 时新余数 = 旧除数 − 旧余数，下降幅度最小。斐波那契对 <span class=\"katex-inline\">F_{k+1},F_k<\/span> 每轮商都为 1，余数序列反向复刻 <span class=\"katex-inline\">F_{k-1},F_{k-2},\\dots<\/span>，步数达到同规模输入的最大值。反过来，首轮商很大则余数一次压得很小，后续轮次减少。复杂度上界 <span class=\"katex-inline\">O(\\log\\min(m,n))<\/span> 正是对这条最慢链条的估计，平均情形步数低于该上界。<\/p>\n<h2>补充对照：gcd 与素因子分解的分工<\/h2>\n<p>gcd 回答公共因子大小，不分解两个数各自的素因子；求 <span class=\"katex-inline\">m,n<\/span> 全部素因子需试除或分解算法，代价结构不同。贝祖等式 <span class=\"katex-inline\">sm+tn=\\gcd(m,n)<\/span> 由扩展欧几里得回溯系数得到，是 gcd 概念向线性组合方向的延伸。<\/p>\n<p>互素判断即 <span class=\"katex-inline\">\\gcd(m,n)=1<\/span>，这一判断在 c09 发生器周期条件、c10 分布分组中反复出现。理解 gcd 链条后，模逆元、同余方程、连分数约分都是余数链上的衍生工具，不需要另造一套计算规则。<\/p>\n<h2>补充算例：同余方向的小例<\/h2>\n<p>求 <span class=\"katex-inline\">17<\/span> 模 <span class=\"katex-inline\">462<\/span> 的逆方向：<span class=\"katex-inline\">\\gcd(462,17)=1<\/span>，扩展欧几里得回溯 <span class=\"katex-inline\">s,t<\/span> 使 <span class=\"katex-inline\">462s+17t=1<\/span>，<span class=\"katex-inline\">t<\/span> 即 <span class=\"katex-inline\">17\\cdot t\\equiv1\\pmod{462}<\/span> 的逆。主算法只负责确认互素与余数链，系数回溯属扩展版本。<\/p>\n<h2>补充边界：输入退化情形<\/h2>\n<p><span class=\"katex-inline\">m=n<\/span>：首轮余数 0，一次除法返回 <span class=\"katex-inline\">m<\/span>。<span class=\"katex-inline\">m=1<\/span> 或 <span class=\"katex-inline\">n=1<\/span>：次轮余数 0，返回 1。一数为另一数倍数：首轮余 0，直接返回较小者。这些退化轮次少，不变量与递减量仍成立；实际实现需单独处理 <span class=\"katex-inline\">n=0<\/span>，避免除零。<\/p><\/div><\/details>", "kind": "concept", "title": "欧几里得算法的正确性与复杂度（gcd 不变量与步数量级）"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.52<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">数学归纳法：三种形式与常见误用<\/a><\/span><\/div><h1>置换与逆序：轮换分解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章（原书 §1.2.5）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>把一组对象重排，结果可以写成一行新顺序，但要研究重排的结构——什么时候两个置换等价、置换怎样复合、一个排列离顺序有多远——就需要比&quot;一行序列&quot;更精细的表示。轮换分解把置换拆成互不相交的循环轨迹，逆序对给出扰乱程度的计数。书里在 §1.2.5 定义 <span class=\"katex-inline\">n<\/span> 元排列：<span class=\"katex-inline\">n<\/span> 个不同对象排成一行的一种排放方式（PDF 第 52 页）。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>排列（置换）<\/strong>：<span class=\"katex-inline\">n<\/span> 个不同对象的一种排放方式。3 个对象 <span class=\"katex-inline\">\\{a,b,c\\}<\/span> 共有 6 种排列：<span class=\"katex-inline\">abc,\\ acb,\\ bac,\\ bca,\\ cab,\\ cba<\/span>（PDF 第 52 页）。<span class=\"katex-inline\">n<\/span> 元置换总数为 <span class=\"katex-inline\">n!<\/span>。<\/p>\n<p><strong>置换作为映射<\/strong>：把位置上的对象看成元素，置换 <span class=\"katex-inline\">\\sigma<\/span> 把元素 <span class=\"katex-inline\">x<\/span> 送到它在新排列中的位置，记作 <span class=\"katex-inline\">\\sigma(x)<\/span>。映射满足每个元素恰有一个像、每个元素恰有一个原像。<\/p>\n<p><strong>轮换<\/strong>：形如 <span class=\"katex-inline\">(a_1\\ a_2\\ \\dots\\ a_k)<\/span> 的记号，表示 <span class=\"katex-inline\">a_1\\to a_2,\\ a_2\\to a_3,\\ \\dots,\\ a_k\\to a_1<\/span>。<span class=\"katex-inline\">k<\/span> 称轮换长度；长度为 1 的轮换表示元素不动，通常省略不写。<\/p>\n<p><strong>轮换分解<\/strong>：任一置换可写成若干互不相交轮换的乘积；不计轮换次序时，分解唯一。做法是从每个未跟踪元素出发，沿映射轨迹走一圈，回到起点即得一个轮换。<\/p>\n<p><strong>逆序对<\/strong>：位置 <span class=\"katex-inline\">i&lt;j<\/span> 但 <span class=\"katex-inline\">\\pi(i)&gt;\\pi(j)<\/span> 的一对元素；逆序对数衡量排列相对顺序排列的扰乱程度。<\/p>\n<h2>原理推演：分解一个具体置换<\/h2>\n<p>设集合 <span class=\"katex-inline\">\\{1,2,3,4,5\\}<\/span> 上置换 <span class=\"katex-inline\">\\sigma<\/span> 的映射为：<span class=\"katex-inline\">1\\to3,\\ 3\\to2,\\ 2\\to1,\\ 4\\to5,\\ 5\\to4<\/span>。<\/p>\n<p>从 1 出发：<span class=\"katex-inline\">1\\to3\\to2\\to1<\/span>，得轮换 <span class=\"katex-inline\">(1\\ 3\\ 2)<\/span>。 从剩下未跟踪的 4 出发：<span class=\"katex-inline\">4\\to5\\to4<\/span>，得轮换 <span class=\"katex-inline\">(4\\ 5)<\/span>。 分解结果：<span class=\"katex-inline\">\\sigma=(1\\ 3\\ 2)(4\\ 5)<\/span>。两个轮换互不相交，元素各走各的轨迹。<\/p>\n<p><strong>逆序计数算例<\/strong>：取排列 <span class=\"katex-inline\">\\pi=3,1,2<\/span>。逐对检查：<\/p>\n<ul><li>\n<span class=\"katex-inline\">(1,2)<\/span>：<span class=\"katex-inline\">3&gt;1<\/span>，是逆序；\n<\/li><li>\n<span class=\"katex-inline\">(1,3)<\/span>：<span class=\"katex-inline\">3&gt;2<\/span>，是逆序；\n<\/li><li>\n<span class=\"katex-inline\">(2,3)<\/span>：<span class=\"katex-inline\">1&lt;2<\/span>，不是逆序。\n<p>逆序对数为 2。排列 <span class=\"katex-inline\">1,2,3<\/span> 逆序对数为 0；<span class=\"katex-inline\">3,2,1<\/span> 逆序对数为 3。<\/p>\n<\/ul>\n<p><strong>分解唯一性的依据<\/strong>：轨迹由映射唯一确定；每个元素属于且仅属于一条轨迹，轮换之间不共享元素。换起点写同一轮换（如 <span class=\"katex-inline\">(1\\ 3\\ 2)=(3\\ 2\\ 1)=(2\\ 1\\ 3)<\/span>）只是记号循环移位，不是不同分解。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：元素集合有限；置换是双射。计数逆序假设元素可比较大小，否则只能谈位置关系。\n<\/li><li>\n失败案例 1：把相交轮换直接相乘却不展开，误以为两个轮换独立；相交轮换的复合顺序会影响结果，互不相交时次序才可交换。\n<\/li><li>\n失败案例 2：长度 1 轮换也写进分解，形式上不算错，但与省略写法对照时容易重复计数。\n<\/li><li>\n边界：轮换分解刻画映射结构，不直接给出排列的数值特征；逆序对数只数位置颠倒，不反映元素相邻距离。\n<\/li><li>\n与阶乘的关系：<span class=\"katex-inline\">n!<\/span> 是置换总数，每个置换对应一条轮换分解；枚举所有分解即枚举所有排列。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>置换 vs 排列<\/strong>：排列强调一行排放结果，置换强调元素间的映射；两者在有限集合上一一对应，书里 <span class=\"katex-inline\">\\S1.2.5<\/span> 用&quot;排列&quot;指称排放方式。\n<\/li><li>\n<strong>轮换 vs 循环链表<\/strong>：轮换是数学映射的轨迹记号；循环链表是第 2 章的数据结构，用指针把结点串成环。前者描述映射，后者组织存储。\n<\/li><li>\n<strong>逆序 vs 轮换长度<\/strong>：逆序数是统计量，回答&quot;乱多少&quot;；轮换长度是结构量，回答&quot;谁和谁在一条轨迹上&quot;。\n<\/li><li>\n<strong>置换复合 vs 置换幂<\/strong>：<span class=\"katex-inline\">\\sigma\\circ\\sigma<\/span> 是两次作用，记 <span class=\"katex-inline\">\\sigma^2<\/span>；轮换的幂把每条轨迹上的元素跳固定步长，与复合一次是不同运算。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c03 归纳法可用于按元素个数证明轮换分解存在唯一。后继：c07 遍历输出是结点的一种排列；排序算法分析（后续各卷）以逆序对数为比较交换次数的下界参照。置换在机器指令调度、字符串重排、组合计数中反复出现，c12 生成函数可用于计数带轮换约束的排列。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（置换与逆序：轮换分解）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：置换分解的依赖链、轨迹追踪与逆序计数算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把置换写成轮换并数逆序，先往回追三层：<\/p>\n<ol><li>\n有限集合上的双射：置换把每个元素送到唯一新位置，每个元素恰有一个原像。双射是轨迹追踪的前提。\n<\/li><li>\n轨迹闭合：从任一元素出发沿映射走，元素有限且每步确定，必然回到起点，形成一条闭合轨迹。\n<\/li><li>\n轨迹不相交：每个元素只属于一条轨迹；互不相交的轮换并排写出即得分解，次序可换。\n<\/ol>\n<p>依赖链方向：置换为双射 → 沿映射轨迹走圈 → 圈与圈互不相交 → 轮换乘积表示唯一 → 另按位置比较数逆序对。<\/p>\n<h2>正向推导（逐步推演）：完整分解一个五元置换<\/h2>\n<p>设集合 <span class=\"katex-inline\">\\{1,2,3,4,5\\}<\/span> 上置换 <span class=\"katex-inline\">\\sigma<\/span> 映射为：<span class=\"katex-inline\">1\\to3<\/span>，<span class=\"katex-inline\">3\\to2<\/span>，<span class=\"katex-inline\">2\\to1<\/span>，<span class=\"katex-inline\">4\\to5<\/span>，<span class=\"katex-inline\">5\\to4<\/span>。<\/p>\n<p>第一步，取未跟踪元素 1。<span class=\"katex-inline\">1\\to3<\/span>，<span class=\"katex-inline\">3\\to2<\/span>，<span class=\"katex-inline\">2\\to1<\/span>，回到起点 1，得轮换 <span class=\"katex-inline\">(1\\ 3\\ 2)<\/span>。轨迹内元素 1、3、2 标记已跟踪。<\/p>\n<p>第二步，取剩余未跟踪元素 4。<span class=\"katex-inline\">4\\to5<\/span>，<span class=\"katex-inline\">5\\to4<\/span>，回到起点 4，得轮换 <span class=\"katex-inline\">(4\\ 5)<\/span>。<\/p>\n<p>第三步，检查：五个元素全部落在两条轨迹内，无遗漏。分解为<\/p>\n<div class=\"katex-block\">\\sigma=(1\\ 3\\ 2)(4\\ 5)<\/div>\n<p>同一轮换循环移位写法等价：<span class=\"katex-inline\">(1\\ 3\\ 2)=(3\\ 2\\ 1)=(2\\ 1\\ 3)<\/span>，起点不同不产生新分解。轮换之间互不相交，因此 <span class=\"katex-inline\">(1\\ 3\\ 2)(4\\ 5)=(4\\ 5)(1\\ 3\\ 2)<\/span>。<\/p>\n<h2>数值算例：逆序对逐对清点<\/h2>\n<p><strong>算例 1<\/strong>：排列 <span class=\"katex-inline\">\\pi=3,1,2<\/span>，位置 <span class=\"katex-inline\">1,2,3<\/span> 上元素为 <span class=\"katex-inline\">3,1,2<\/span>。<\/p>\n<ul><li>\n位置对 <span class=\"katex-inline\">(1,2)<\/span>：<span class=\"katex-inline\">3&gt;1<\/span>，逆序；\n<\/li><li>\n位置对 <span class=\"katex-inline\">(1,3)<\/span>：<span class=\"katex-inline\">3&gt;2<\/span>，逆序；\n<\/li><li>\n位置对 <span class=\"katex-inline\">(2,3)<\/span>：<span class=\"katex-inline\">1&lt;2<\/span>，非逆序。\n<p>逆序对数 <span class=\"katex-inline\">=2<\/span>。<\/p>\n<\/ul>\n<p><strong>算例 2<\/strong>：排列 <span class=\"katex-inline\">3,2,1<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">(1,2)<\/span>：<span class=\"katex-inline\">3&gt;2<\/span>，逆序；\n<\/li><li>\n<span class=\"katex-inline\">(1,3)<\/span>：<span class=\"katex-inline\">3&gt;1<\/span>，逆序；\n<\/li><li>\n<span class=\"katex-inline\">(2,3)<\/span>：<span class=\"katex-inline\">2&gt;1<\/span>，逆序。\n<p>逆序对数 <span class=\"katex-inline\">=3<\/span>，即全逆序排列达到该长度最大值 <span class=\"katex-inline\">\\binom32=3<\/span>。<\/p>\n<\/ul>\n<p><strong>算例 3<\/strong>：排列 <span class=\"katex-inline\">1,2,3<\/span>，逐对比较均为升序，逆序对数 <span class=\"katex-inline\">=0<\/span>。<\/p>\n<p><strong>复合验算<\/strong>：取 <span class=\"katex-inline\">\\sigma=(1\\ 3\\ 2)(4\\ 5)<\/span>，再取 <span class=\"katex-inline\">\\tau=(1\\ 4)(2\\ 5)<\/span>。复合 <span class=\"katex-inline\">\\sigma\\circ\\tau<\/span> 先作用 <span class=\"katex-inline\">\\tau<\/span> 再作用 <span class=\"katex-inline\">\\sigma<\/span>：<span class=\"katex-inline\">1\\xrightarrow{\\tau}4\\xrightarrow{\\sigma}5<\/span>；<span class=\"katex-inline\">5\\xrightarrow{\\tau}2\\xrightarrow{\\sigma}1<\/span>，得轮换 <span class=\"katex-inline\">(1\\ 5)<\/span>。相交轮换的复合顺序影响结果；互不相交时才可交换。<\/p>\n<h2>延伸推演：分解唯一性与阶乘计数<\/h2>\n<p>唯一性依据：轨迹由映射唯一确定，每个元素属于且仅属于一条轨迹。若写出两套分解，任取元素沿两套轨迹走，落点序列相同，两套轮换在该元素处重合；逐元素覆盖即两套分解一致。<\/p>\n<p>计数方向：<span class=\"katex-inline\">n<\/span> 元置换总数 <span class=\"katex-inline\">n!<\/span>。按轮换类型分类计数时，长度为 <span class=\"katex-inline\">k<\/span> 的轮换贡献因子 <span class=\"katex-inline\">1/k<\/span>，同一长度 <span class=\"katex-inline\">j<\/span> 个轮换贡献 <span class=\"katex-inline\">1/j!<\/span>；带轮换约束的排列计数由生成函数处理（见 c12）。轮换长度本身是结构量：<span class=\"katex-inline\">k<\/span>-轮换把 <span class=\"katex-inline\">k<\/span> 个元素连成一圈，不动点即长度 1 轮换，通常省略。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>相交轮换误当独立<\/strong>：<span class=\"katex-inline\">(1\\ 2)(2\\ 3)<\/span> 与 <span class=\"katex-inline\">(2\\ 3)(1\\ 2)<\/span> 结果不同，复合不能交换。只有互不相交的轮换，先后次序才不影响乘积。<\/p>\n<p><strong>漏写不动点导致重复计数<\/strong>：分解结果里省略长度 1 轮换是通行写法；若同时在主分解与省略清单里各算一遍，会把不动点计两次。<\/p>\n<h2>对抗性追问：逆序多是否轮换就长<\/h2>\n<p>没有必然联系。逆序数是位置颠倒的统计量，轮换长度是轨迹闭合的结构量。构造一例：排列 <span class=\"katex-inline\">2,1,4,3<\/span> 有两个 2-轮换，逆序对为 <span class=\"katex-inline\">(1,2)<\/span>、<span class=\"katex-inline\">(3,4)<\/span> 共 2；另一排列 <span class=\"katex-inline\">2,3,4,1<\/span> 是一个 4-轮换，逆序对为 <span class=\"katex-inline\">(1,4),(2,4),(3,4)<\/span> 共 3。两者量纲不同，不能互相推导。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n置换作为映射为什么必须是双射？单射或不满射会怎样？\n<\/li><li>\n从元素 1 出发追踪轨迹，什么条件下得到一条闭合轮换？\n<\/li><li>\n写出置换 <span class=\"katex-inline\">1\\to2,\\ 2\\to4,\\ 3\\to1,\\ 4\\to3<\/span> 的轮换分解。\n<\/li><li>\n排列 <span class=\"katex-inline\">4,3,2,1<\/span> 有多少逆序对？全逆序最大值怎样用 <span class=\"katex-inline\">\\binom n2<\/span> 表示？\n<\/li><li>\n互不相交轮换与相交轮换在复合可交换性上差别在哪？\n<\/ol>\n<h2>延伸推演：置换复合与轮换的幂<\/h2>\n<p>复合两个置换 <span class=\"katex-inline\">\\sigma,\\tau<\/span>，按约定先作用 <span class=\"katex-inline\">\\tau<\/span> 再作用 <span class=\"katex-inline\">\\sigma<\/span>，结果记 <span class=\"katex-inline\">\\sigma\\circ\\tau<\/span>。逐元素查表：对每个 <span class=\"katex-inline\">x<\/span>，先算 <span class=\"katex-inline\">\\tau(x)<\/span>，再把结果送进 <span class=\"katex-inline\">\\sigma<\/span>。相交轮换复合不可交换，<span class=\"katex-inline\">(\\sigma\\circ\\tau)(x)<\/span> 与 <span class=\"katex-inline\">(\\tau\\circ\\sigma)(x)<\/span> 一般不同；互不相交轮换各自作用在不相交元素集上，先后次序不影响乘积。<\/p>\n<p>轮换的幂：<span class=\"katex-inline\">(a_1\\ a_2\\ \\dots\\ a_k)^p<\/span> 把轨迹上每个元素沿方向跳 <span class=\"katex-inline\">p<\/span> 步。<span class=\"katex-inline\">p=k<\/span> 时回到原位，即 <span class=\"katex-inline\">k<\/span>-轮换的阶为 <span class=\"katex-inline\">k<\/span>。置换的阶是各轮换长度的最小公倍数；判断置换幂次时，分轨迹分别计算再合并。<\/p>\n<h2>第二算例：轮换乘积追踪<\/h2>\n<p>设 <span class=\"katex-inline\">\\sigma=(1\\ 2\\ 3)<\/span>，<span class=\"katex-inline\">\\tau=(2\\ 3)<\/span>。复合 <span class=\"katex-inline\">\\sigma\\circ\\tau<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">1\\xrightarrow{\\tau}1\\xrightarrow{\\sigma}2<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">2\\xrightarrow{\\tau}3\\xrightarrow{\\sigma}1<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">3\\xrightarrow{\\tau}2\\xrightarrow{\\sigma}3<\/span>。\n<p>结果 <span class=\"katex-inline\">1\\to2,\\ 2\\to1,\\ 3\\to3<\/span>，即 <span class=\"katex-inline\">(1\\ 2)<\/span>。<\/p>\n<\/ul>\n<p>反序复合 <span class=\"katex-inline\">\\tau\\circ\\sigma<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">1\\xrightarrow{\\sigma}2\\xrightarrow{\\tau}3<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">2\\xrightarrow{\\sigma}3\\xrightarrow{\\tau}2<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">3\\xrightarrow{\\sigma}1\\xrightarrow{\\tau}1<\/span>。\n<p>结果 <span class=\"katex-inline\">1\\to3,\\ 3\\to1,\\ 2\\to2<\/span>，即 <span class=\"katex-inline\">(1\\ 3)<\/span>。两者不同，印证相交轮换不可交换。<\/p>\n<\/ul>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;轮换记号里元素顺序无关&quot;。<\/strong> 同一轮换循环移位等价，反向不等价：<span class=\"katex-inline\">(1\\ 2\\ 3)<\/span> 与 <span class=\"katex-inline\">(1\\ 3\\ 2)<\/span> 是互逆的两个轮换。\n<\/li><li>\n<strong>误解二：&quot;分解出的轮换可以任意嵌套合并&quot;。<\/strong> 只有同一轨迹的元素并入同一轮换；跨轨迹硬合并会掩盖各自闭合关系。\n<\/li><li>\n<strong>误解三：&quot;逆序数大的置换轮换个数少&quot;。<\/strong> 逆序是位置统计，轮换是轨迹结构，两者无单调关系，c05 正文已给对照例。\n<\/li><li>\n<strong>误解四：&quot;排列只关心数字大小&quot;。<\/strong> 逆序比较要求元素可排序；置换映射本身不依赖元素大小，对象可以是字母、符号或记录。\n<\/ul>\n<h2>边界对照：置换在后续结构中的出现<\/h2>\n<p>遍历输出是结点的一个排列（c07）；排序问题以减少逆序对为比较交换的度量参照；组合计数中带轮换约束的排列用母函数（c12）计数。置换概念上接 c03 归纳证明分解存在唯一，下接树与表的重排操作。机器指令调度、字符串变换都可看成有限集合上的置换作用。<\/p>\n<h2>推演补充：逆序对与相邻交换<\/h2>\n<p>冒泡、插入一类比较交换排序，每做一次相邻元素交换，逆序对数恰好改变 1：相邻两数若逆序，交换后逆序减 1；若顺序，交换后逆序加 1。因此把一个排列排到升序所需的最少相邻交换次数，等于初始逆序对数。这一结论把置换的统计量与排序算法下界联系起来。<\/p>\n<p>非相邻交换一次可以消去多个逆序对，所以选择类交换排序的最少交换次数不等于逆序对数；两者度量对象不同：相邻交换看邻位调整，跨位交换看轨迹归位。<\/p>\n<h2>第三算例：轮换类型与阶<\/h2>\n<p>置换 <span class=\"katex-inline\">\\sigma=(1\\ 4\\ 2)(3\\ 5)<\/span>，含一个 3-轮换与一个 2-轮换。<span class=\"katex-inline\">\\sigma<\/span> 的阶为 <span class=\"katex-inline\">\\operatorname{lcm}(3,2)=6<\/span>：<span class=\"katex-inline\">\\sigma^6<\/span> 回到恒等，更小幂次不能同时闭合两条轨迹。<\/p>\n<p>逐幂观察：<span class=\"katex-inline\">\\sigma^1<\/span> 原置换；<span class=\"katex-inline\">\\sigma^2<\/span> 在 3-轮换上跳两步、2-轮换上闭合；<span class=\"katex-inline\">\\sigma^3<\/span> 在 3-轮换上闭合、2-轮换上跳三步等价跳一步；<span class=\"katex-inline\">\\sigma^6<\/span> 两支都回到原位。阶由各轮换长度的最小公倍数决定，不是长度相加。<\/p>\n<h2>推演补充：排列的双射性质核验<\/h2>\n<p>置换作为映射必须满足两条：每个元素有唯一像（良定义），每个元素有唯一原像（满射）。核验时列出映射表，像集合应与原集合重合，且无两个元素映到同一处。若映射把两个元素送到同一位置，就不是置换，只是一般映射；轮换分解只对双射成立。<\/p>\n<p><span class=\"katex-inline\">n<\/span> 元置换总数 <span class=\"katex-inline\">n!<\/span>：第一位有 <span class=\"katex-inline\">n<\/span> 种选择，第二位 <span class=\"katex-inline\">n-1<\/span> 种，依次递减。枚举所有分解即枚举所有排列；计数带约束的排列时，按轮换长度分类，再用母函数汇总方案数（c12）。<\/p>\n<h2>补充对照：置换与排列的两种读法<\/h2>\n<p>&quot;排列&quot;强调一行排放结果：<span class=\"katex-inline\">abc<\/span>、<span class=\"katex-inline\">acb<\/span> 是两个排列；&quot;置换&quot;强调元素间映射：<span class=\"katex-inline\">\\sigma<\/span> 把位置上的元素送到新位置。有限集合上两者一一对应，书里 §1.2.5 先用排放方式定义排列，后续分析映射性质时使用轮换记号。<\/p>\n<p>复合置换与函数复合同构：<span class=\"katex-inline\">\\sigma\\circ\\tau<\/span> 先 <span class=\"katex-inline\">\\tau<\/span> 后 <span class=\"katex-inline\">\\sigma<\/span>；置换幂是同一映射多次复合。置换群研究封闭在复合下的置换集合，本概念只覆盖单个置换的分解与计数，群性质留到后续专题。<\/p>\n<h2>补充算例：逆序对累加<\/h2>\n<p>排列 <span class=\"katex-inline\">2,4,1,3<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">(1,2)<\/span>：<span class=\"katex-inline\">2&lt;4<\/span> 非逆序；\n<\/li><li>\n<span class=\"katex-inline\">(1,3)<\/span>：<span class=\"katex-inline\">2&gt;1<\/span> 逆序；\n<\/li><li>\n<span class=\"katex-inline\">(1,4)<\/span>：<span class=\"katex-inline\">2&lt;3<\/span> 非；\n<\/li><li>\n<span class=\"katex-inline\">(2,3)<\/span>：<span class=\"katex-inline\">4&gt;1<\/span> 逆序；\n<\/li><li>\n<span class=\"katex-inline\">(2,4)<\/span>：<span class=\"katex-inline\">4&gt;3<\/span> 逆序；\n<\/li><li>\n<span class=\"katex-inline\">(3,4)<\/span>：<span class=\"katex-inline\">1&lt;3<\/span> 非。\n<p>逆序对数 <span class=\"katex-inline\">=3<\/span>。相邻交换排序的最少交换次数即此值；跨位交换不受此限。<\/p>\n<\/ul><\/div><\/details>", "kind": "concept", "title": "置换与逆序：轮换分解"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.282<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">二叉树三种遍历次序与栈实现<\/a><\/span><\/div><h1>树与二叉树的等价表示：左孩右兄<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书 §2.3.2）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>一般树的结点可以有任意多个子女，存储时若给每个结点留固定数量的子女指针，要么按最大度数预留造成浪费，要么变长结构难以统一处理。二叉树的结点只有左、右两个链字段，结构规整、遍历算法成熟。问题是：任意一棵树或一片森林，能不能不靠猜、不靠冗余，唯一地表示成一棵二叉树？书里 §2.3.2 给出森林与二叉树之间的自然对应（PDF 第 282 页）。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>树与二叉树的基本差别<\/strong>（PDF 第 282 页）：<\/p>\n<ol><li>\n树总有一个根结点，所以不为空；树的每个结点可以有 <span class=\"katex-inline\">0,1,2,3,\\dots<\/span> 个子女。\n<\/li><li>\n二叉树可以为空；每个结点可以有 0、1 或 2 个子女，并且区分&quot;左&quot;子女与&quot;右&quot;子女。\n<\/ol>\n<p><strong>森林<\/strong>：零棵或多棵不相交树的有序集合；任意结点下面的诸子树形成一个森林。<\/p>\n<p><strong>自然对应的构造步骤<\/strong>（书里图示 (1)→(2)→(3)）：<\/p>\n<ul><li>\n先把同一父母的子女横向链接在一起；\n<\/li><li>\n删去父母到第一个子女之外的竖直链；\n<\/li><li>\n把图顺时针转动 <span class=\"katex-inline\">45^\\circ<\/span>，稍加调整，得到一棵二叉树。\n<\/ul>\n<p><strong>两个链字段的含义<\/strong>：二叉树结点的左链（LLINK）指向原树中该结点的第一个子女；右链（RLINK）指向原树中该结点的下一个兄弟。<\/p>\n<p><strong>可逆性<\/strong>：逆转这一过程，任何二叉树都唯一对应于一个树的森林。特殊地，它给出树与一类特殊二叉树——有根但无右子树的二叉树——之间的对应；换视角让树根对应二叉树表头，就得到 <span class=\"katex-inline\">n+1<\/span> 个结点的树与 <span class=\"katex-inline\">n<\/span> 个结点的二叉树之间的一一对应（PDF 第 282 页）。<\/p>\n<h2>原理推导与推演：对应为什么是双射<\/h2>\n<p>正向映射分两层关系。向下关系：父母到长子，存进左链；横向关系：兄弟之间长幼次序，存进右链。原树的两类邻接信息各占一个字段，没有遗漏也没有重叠。<\/p>\n<p>反向还原：读左链回到长子，读右链回到下一个兄弟；按&quot;长子—兄弟&quot;规则把二叉树拆开，重建每棵树的父母—子女层次。两个方向的映射都由规则唯一确定，不存在第二种拆解方式，因此是一一对应。<\/p>\n<p>对照单棵有序树：根的子女按次序排列，第一个子女挂左链，其余兄弟依次挂右链。森林各棵树的根之间也视为兄弟，用右链首尾相接。这样森林结构与二叉树结构在结点集合上完全对齐。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：讨论的是有序树或有序森林；兄弟次序在原结构中有意义。\n<\/li><li>\n失败案例 1：只保留左链。右链承担兄弟联系，去掉之后根的第二个及以后子女无处挂靠，原树分支信息丢失。\n<\/li><li>\n失败案例 2：只保留右链。左链承担父母到长子的联系，去掉之后根与第一子女的关系断裂，还原不出层次。\n<\/li><li>\n边界：该对应是表示层等价，不改变原树的遍历语义；把二叉树遍历结果翻译回树时，先序对应树的先根次序，后序对应树的后根次序，中序要按对应规则解释。\n<\/li><li>\n误用提醒：二叉树的左右子女在原树里不是&quot;两个孩子&quot;，左是长子、右是兄弟；直接按二叉树语义画原树会误解分支关系。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>左孩右兄 vs 普通子女表<\/strong>：子女表把所有孩子挂在一个变长数组或链表里；左孩右兄用两个固定字段表达同样信息，代价是访问兄弟要走右链、访问子女要走左链再转右链。\n<\/li><li>\n<strong>有序树 vs 定向树<\/strong>：有序树区分子女次序，对应到二叉树时右链次序明确；定向树只看结点相对定向，不区分次序，对应关系的语义随之放宽。\n<\/li><li>\n<strong>二叉树表示 vs 二叉搜索树<\/strong>：前者是存储映射手段，后者是带键值有序性的结构；左孩右兄表示出的二叉树不具备搜索树的键值约束。\n<\/li><li>\n<strong>森林对应 vs 单树对应<\/strong>：森林各根用右链串成兄弟链；单棵树只是森林含一棵树的特例。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c08 线性表的链接思想是链字段表示的基础；c07 二叉树三序遍历在这棵对应二叉树上执行，结果可翻译回原树。后继：第 2 章树的计数、路径长度分析都建立在这一对应之上；多重链接结构（§2.4）是在两个链字段之外再加挂其他关系链。<\/p>\n<h2>补充：对应关系解决的具体工程问题<\/h2>\n<p>一般树若按&quot;每结点预留最大子女指针&quot;存储，度数小的结点浪费字段，度数大的结点又要变长记录；若用子女表挂在结点上，表长不一，遍历与插入都要处理变长结构。左孩右兄把两种极端收成统一的两字段结点：向下找长子走左链，横向找兄弟走右链，结点格式与二叉树完全一致。存储侧只存两类邻接，访问侧再按语义解释，这是该对应在数据结构设计上的主要价值。<\/p>\n<p>从还原角度看，对应不改变结点集合，也不改变原树的层次与长幼次序；它改变的只是连线的组织方式。讨论树的高度、路径长度、结点度数时，先确认是在原树语义下计数，还是在对应二叉树语义下计数，两套高度数值一般不同：原树高度按子女层计，对应二叉树高度可能因兄弟右链拉长而变大。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（树与二叉树的等价表示：左孩右兄）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：森林到二叉树的对应链、构造步骤与可逆性核验<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把一般树压成二叉树表示，先往回追三层：<\/p>\n<ol><li>\n原树的邻接信息分两类：父母到子女的向下关系，兄弟之间的长幼横向关系。两类信息必须各有去处，不能遗漏。\n<\/li><li>\n二叉树结点只有两个链字段。左链、右链各承担一类原关系；字段语义在构造前固定下来。\n<\/li><li>\n对应必须可逆：从二叉树能还原原森林，否则表示只是单向压缩，结构信息有损失。\n<\/ol>\n<p>依赖链方向：拆分原树两类邻接 → 左链挂长子、右链挂兄弟 → 横向链接同父母子女 → 删去多余竖直链 → 旋转 <span class=\"katex-inline\">45^\\circ<\/span> 成二叉树 → 反向规则还原森林。<\/p>\n<h2>正向推导（逐步推演）：构造四步走<\/h2>\n<p><strong>第一步，横向链接子女<\/strong>。对每个父母，把其子女按长幼次序用横向链串起来；同一家庭的子女形成一条兄弟链。<\/p>\n<p><strong>第二步，保留父母到长子的竖直链<\/strong>。其余竖直链（父母到第二及以后子女）删去；父母只通过左链接到长子上。<\/p>\n<p><strong>第三步，旋转成形<\/strong>。把得到的示意图顺时针转动 <span class=\"katex-inline\">45^\\circ<\/span>，调整连线角度，即为一棵二叉树。根的长子在左子树位置，下一兄弟在右链位置。<\/p>\n<p><strong>第四步，森林串联<\/strong>。多棵树的根之间视为兄弟，用右链首尾相接；整片森林压成一棵二叉树。<\/p>\n<p>字段语义固定为：LLINK 指向第一个子女，RLINK 指向下一个兄弟。原树的向下关系与横向关系各占一个字段，无重叠、无遗漏。<\/p>\n<h2>数值算例：两棵树森林的对应还原<\/h2>\n<p>设森林第一棵：根 <span class=\"katex-inline\">A<\/span>，子女 <span class=\"katex-inline\">B,C<\/span>，<span class=\"katex-inline\">C<\/span> 下有 <span class=\"katex-inline\">K<\/span>；第二棵：根 <span class=\"katex-inline\">D<\/span>，子女 <span class=\"katex-inline\">E,F,G<\/span>，<span class=\"katex-inline\">E<\/span> 下有 <span class=\"katex-inline\">H<\/span>，<span class=\"katex-inline\">F<\/span> 下有 <span class=\"katex-inline\">J<\/span>（对应书里图示方向，PDF 第 282 页）。<\/p>\n<p>正向构造：<\/p>\n<ul><li>\n<span class=\"katex-inline\">A<\/span> 的长子 <span class=\"katex-inline\">B<\/span> 挂 <span class=\"katex-inline\">A<\/span> 左链，<span class=\"katex-inline\">B<\/span> 的下一兄弟 <span class=\"katex-inline\">C<\/span> 挂 <span class=\"katex-inline\">B<\/span> 右链；<span class=\"katex-inline\">C<\/span> 的长子 <span class=\"katex-inline\">K<\/span> 挂 <span class=\"katex-inline\">C<\/span> 左链。\n<\/li><li>\n<span class=\"katex-inline\">D<\/span> 的长子 <span class=\"katex-inline\">E<\/span> 挂 <span class=\"katex-inline\">D<\/span> 左链，<span class=\"katex-inline\">E<\/span> 右链接 <span class=\"katex-inline\">F<\/span>，<span class=\"katex-inline\">F<\/span> 右链接 <span class=\"katex-inline\">G<\/span>；<span class=\"katex-inline\">E<\/span> 长子 <span class=\"katex-inline\">H<\/span> 挂左链，<span class=\"katex-inline\">F<\/span> 长子 <span class=\"katex-inline\">J<\/span> 挂左链。\n<\/li><li>\n两棵树根 <span class=\"katex-inline\">A,D<\/span> 视为兄弟，<span class=\"katex-inline\">A<\/span> 右链接 <span class=\"katex-inline\">D<\/span>。\n<\/ul>\n<p>反向还原：<\/p>\n<ul><li>\n读 <span class=\"katex-inline\">A<\/span> 左链回到长子 <span class=\"katex-inline\">B<\/span>；<span class=\"katex-inline\">B<\/span> 右链回到下一个兄弟 <span class=\"katex-inline\">C<\/span>；<span class=\"katex-inline\">C<\/span> 左链回到长子 <span class=\"katex-inline\">K<\/span>。\n<\/li><li>\n读 <span class=\"katex-inline\">D<\/span> 左链回到 <span class=\"katex-inline\">E<\/span>，<span class=\"katex-inline\">E<\/span> 右链回 <span class=\"katex-inline\">F<\/span>，<span class=\"katex-inline\">F<\/span> 右链回 <span class=\"katex-inline\">G<\/span>；<span class=\"katex-inline\">E<\/span> 左链回 <span class=\"katex-inline\">H<\/span>，<span class=\"katex-inline\">F<\/span> 左链回 <span class=\"katex-inline\">J<\/span>。\n<\/li><li>\n根链 <span class=\"katex-inline\">A<\/span> 右链回 <span class=\"katex-inline\">D<\/span>，还原两棵树的并列关系。\n<\/ul>\n<p>两个方向映射唯一：每个字段读回的原关系确定，不存在第二种拆解。<\/p>\n<h2>延伸推演：对应带来的计数与遍历平移<\/h2>\n<p>单棵有序树与&quot;有根、无右子树&quot;的二叉树一一对应；换视角把树根当作二叉树表头，<span class=\"katex-inline\">n+1<\/span> 个结点的树对应 <span class=\"katex-inline\">n<\/span> 个结点的二叉树。这层对应让树的计数问题可以转到二叉树计数上处理。<\/p>\n<p>遍历平移方向：原树的先根次序对应对应二叉树的先序；原树的后根次序对应对应二叉树的后序。中序不能直接照搬，要按&quot;左子树—根—右子树&quot;在映射语义下解释。c07 的三序算法先在二叉树上实现，结果再翻译回树遍历。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>只留左链<\/strong>：右链承担兄弟联系，去掉后根的第二个及以后子女无处挂靠，分支信息丢失。 <strong>只留右链<\/strong>：左链承担父母到长子的联系，去掉后根与第一子女断裂，层次无法还原。 <strong>按二叉树语义误读<\/strong>：把左链孩子当成&quot;左子女&quot;、右链孩子当成&quot;右子女&quot;，会画出与原树分支不同的图。左是长子，右是兄弟，读字段前先确认语义。<\/p>\n<h2>对抗性追问：这一对应是否改变原树的结点数<\/h2>\n<p>不改变。对应是结点集合上的双射：原树 <span class=\"katex-inline\">n<\/span> 个结点，二叉树仍为 <span class=\"katex-inline\">n<\/span> 个结点；改变的只是连线关系与字段解释。若表示后结点数增减，说明构造中重复挂接或漏挂了结点。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n树与二叉树在根是否可空、子女个数、左右区分上有哪三点差别？\n<\/li><li>\n左链与右链各指向原树的什么结点？\n<\/li><li>\n写出构造森林对应二叉树的四个步骤。\n<\/li><li>\n为什么说对应是双射？反向还原依据什么规则？\n<\/li><li>\n树的先根、后根次序分别对应二叉树哪种遍历次序？\n<\/ol>\n<h2>延伸推演：三结点树的对应枚举<\/h2>\n<p>取三个结点的有序树，看对应二叉树形态。<\/p>\n<p><strong>情形一：根 <span class=\"katex-inline\">A<\/span> 下两个子女 <span class=\"katex-inline\">B,C<\/span>。<\/strong> 正向：<span class=\"katex-inline\">A<\/span> 左链挂 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 右链挂 <span class=\"katex-inline\">C<\/span>。反向：<span class=\"katex-inline\">A<\/span> 左链回 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 右链回 <span class=\"katex-inline\">C<\/span>，<span class=\"katex-inline\">C<\/span> 无左链。对应二叉树根 <span class=\"katex-inline\">A<\/span> 左孩子 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 右孩子 <span class=\"katex-inline\">C<\/span>。<\/p>\n<p><strong>情形二：根 <span class=\"katex-inline\">A<\/span> 下一个子女 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 下一个子女 <span class=\"katex-inline\">C<\/span>。<\/strong> 正向：<span class=\"katex-inline\">A<\/span> 左链挂 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 左链挂 <span class=\"katex-inline\">C<\/span>。反向沿左链逐层下移。对应二叉树是一条左斜链。<\/p>\n<p><strong>情形三：森林两棵单根树 <span class=\"katex-inline\">A,B<\/span>。<\/strong> 正向：<span class=\"katex-inline\">A<\/span> 右链挂 <span class=\"katex-inline\">B<\/span>。反向：<span class=\"katex-inline\">A<\/span> 右链回 <span class=\"katex-inline\">B<\/span>，两者均无左链。对应二叉树根 <span class=\"katex-inline\">A<\/span> 右孩子 <span class=\"katex-inline\">B<\/span>。<\/p>\n<p>三例覆盖&quot;兄弟横向&quot;&quot;子女纵向&quot;&quot;森林并列&quot;三类关系在链字段上的落点。<\/p>\n<h2>延伸推演：对应与计数、高度的差别<\/h2>\n<p>树计数问题常转到二叉树计数：<span class=\"katex-inline\">n<\/span> 个结点的有序树与 <span class=\"katex-inline\">n-1<\/span> 个结点的二叉树一一对应（根作表头的视角）。计数时先确认对应口径：是 <span class=\"katex-inline\">n<\/span> 结点树对 <span class=\"katex-inline\">n<\/span> 结点二叉树，还是 <span class=\"katex-inline\">n+1<\/span> 对 <span class=\"katex-inline\">n<\/span>，两套基数不能混。<\/p>\n<p>高度口径要分开：原树高度按子女层数计；对应二叉树高度可能因兄弟右链拉长而变大。例如长兄弟链在二叉树上表现为右斜链，高度按右链累计。分析路径长度、平衡度时，先声明用哪一套高度，避免把原树的层深与对应二叉树的链深混算。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;左孩右兄就是把树转成二叉搜索树&quot;。<\/strong> 对应只做结构映射，不挂键值有序性；搜索树的左小右大约束在这里不存在。\n<\/li><li>\n<strong>误解二：&quot;右链孩子是原树的右子女&quot;。<\/strong> 右链指向兄弟，不是子女；读字段时先回到 c06 的语义定义。\n<\/li><li>\n<strong>误解三：&quot;对应会减少结点&quot;。<\/strong> 双射保持结点数不变；若还原后结点变少，说明构造中漏挂或重复挂接了链。\n<\/li><li>\n<strong>误解四：&quot;无序树也能直接套用同一对应&quot;。<\/strong> 对应依赖子女次序；定向树不区分次序时，右链次序语义放宽，还原前先确认原结构是否有序。\n<\/ul>\n<h2>边界对照：与多重链接结构的衔接<\/h2>\n<p>c08 的链接分配是单链思想在表上的推广；本概念是双链思想在树上的推广。§2.4 多链结构在两个链字段之外再加挂其他关系链（如父结点链、横向遍历链），字段更多但构造原则相同：每类邻接关系分配一个字段，字段语义在构造前固定。遍历算法（c07）在对应二叉树上执行后，结果按先根、后根翻译回原树；树的路径长度、度数分析都建立在这层表示之上。<\/p>\n<h2>推演补充：对应关系的形式化读法<\/h2>\n<p>形式上，森林 <span class=\"katex-inline\">F=(T_1,T_2,\\dots,T_k)<\/span> 对应二叉树 <span class=\"katex-inline\">B<\/span>：<span class=\"katex-inline\">B<\/span> 根为 <span class=\"katex-inline\">T_1<\/span> 根；<span class=\"katex-inline\">B<\/span> 根左子树对应 <span class=\"katex-inline\">T_1<\/span> 除去根后的子女森林；<span class=\"katex-inline\">B<\/span> 根右子树对应 <span class=\"katex-inline\">T_2,\\dots,T_k<\/span> 组成的森林。这是递归定义，与树的递归定义互映：原树按根与子女森林拆分，二叉树按根与左右子树拆分。<\/p>\n<p>反向还原同样递归：左子树还原成长子带领的兄弟链，右子树还原为下一兄弟子树。两层递归互相闭合，保证双射。写树的存储结构时，这一递归读法就是结点两个链字段的语义来源。<\/p>\n<h2>第三算例：四结点链状树<\/h2>\n<p>原树：<span class=\"katex-inline\">A\\to B\\to C\\to D<\/span> 单支向下。对应二叉树：<span class=\"katex-inline\">A<\/span> 左链 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 左链 <span class=\"katex-inline\">C<\/span>，<span class=\"katex-inline\">C<\/span> 左链 <span class=\"katex-inline\">D<\/span>，全为左斜链。先根遍历 <span class=\"katex-inline\">A,B,C,D<\/span>，后根 <span class=\"katex-inline\">D,C,B,A<\/span>，与原树先根、后根一致。<\/p>\n<p>对照兄弟链情形：<span class=\"katex-inline\">A<\/span> 下三子女 <span class=\"katex-inline\">B,C,D<\/span>。对应二叉树 <span class=\"katex-inline\">A<\/span> 左链 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 右链 <span class=\"katex-inline\">C<\/span>，<span class=\"katex-inline\">C<\/span> 右链 <span class=\"katex-inline\">D<\/span>，全为右斜链。两种形态在二叉树表示上方向不同，还原时左链找子女、右链找兄弟，不会混淆。<\/p>\n<h2>推演补充：表示等价与语义保留<\/h2>\n<p>左孩右兄是表示层等价：原树的层次、长幼、父子关系全部保留，只改连线组织。判断一次转换是否正确，检查三条：长子是否挂左链，兄弟是否挂右链，根之间是否用右链串联。三条都满足，还原出的森林与原树同构；缺任一条，结构信息就有丢失或错位。<\/p>\n<p>工程上这一表示的价值在于结点格式统一：不必为高度数结点预留变长子女表，也不必在结点内挂不定长数组；两个固定字段配合递归算法，覆盖任意分支度的树。代价是访问兄弟要走右链、访问子女要走左链再转右链，局部路径比直接子女表多一跳。<\/p>\n<h2>补充对照：树表示的几种备选方案<\/h2>\n<p>除左孩右兄外，树的存储还有三类常见方案。一是子女表：每个结点挂一个变长链表或数组记录全部子女，访问子女直接，但结点长度不定，遍历要处理表尾标记。二是邻接表：整张树存成边表，结点编号与父子边分列，适合静态查询，局部访问要查表。三是多重链表：结点同时挂父母链、子女链、兄弟链，字段冗余大，换取多方向快速访问。<\/p>\n<p>左孩右兄在字段固定性与表示简洁之间取平衡：两个字段覆盖两类基本邻接，递归算法直接复用二叉树框架。选哪种表示取决于访问模式：频繁子女遍历选子女表，频繁兄弟横向扫描选右链结构，多方向查询才需要多重链。<\/p>\n<h2>补充算例：森林三棵树还原<\/h2>\n<p>设森林根 <span class=\"katex-inline\">A,B,C<\/span>，<span class=\"katex-inline\">A<\/span> 子女 <span class=\"katex-inline\">D<\/span>，<span class=\"katex-inline\">B<\/span> 子女 <span class=\"katex-inline\">E,F<\/span>，<span class=\"katex-inline\">C<\/span> 无子女。对应二叉树：<span class=\"katex-inline\">A<\/span> 左链 <span class=\"katex-inline\">D<\/span>，<span class=\"katex-inline\">A<\/span> 右链 <span class=\"katex-inline\">B<\/span>；<span class=\"katex-inline\">B<\/span> 左链 <span class=\"katex-inline\">E<\/span>，<span class=\"katex-inline\">E<\/span> 右链 <span class=\"katex-inline\">F<\/span>；<span class=\"katex-inline\">B<\/span> 右链 <span class=\"katex-inline\">C<\/span>。<\/p>\n<p>反向还原：<span class=\"katex-inline\">A<\/span> 左链回长子 <span class=\"katex-inline\">D<\/span>，<span class=\"katex-inline\">A<\/span> 右链回下一棵根 <span class=\"katex-inline\">B<\/span>；<span class=\"katex-inline\">B<\/span> 左链回 <span class=\"katex-inline\">E<\/span>，<span class=\"katex-inline\">E<\/span> 右链回兄弟 <span class=\"katex-inline\">F<\/span>，<span class=\"katex-inline\">B<\/span> 右链回根 <span class=\"katex-inline\">C<\/span>。三棵树并列关系由根链 <span class=\"katex-inline\">A\\to B\\to C<\/span> 保留，子女层次由左链下沉保留。<\/p>\n<h2>补充边界：有序与无序的对应差异<\/h2>\n<p>有序树区分子女长幼，右链次序明确；定向树只看相对方向、不排次序，对应到二叉树时右链不再携带顺序信息。讨论无序森林的对应时，还原出的二叉树右子树结构不唯一，不能套用有序树的唯一双射结论。书里默认讨论的有序树，子女次序在计算机表示中天然带一个隐含顺序。<\/p>\n<h2>补充计数：两字段覆盖的邻接关系<\/h2>\n<p>原树邻接只有父子与兄弟两类；左孩字段挂长子，右兄字段挂下一兄弟，两类邻接各占一个链方向。没有为&quot;父母&quot;单独留字段时，向上访问需沿根到结点路径回溯；若应用频繁向上访问，需在结点另加父链，这属于多重链接扩展，超出左孩右兄的两字段约定。<\/p><\/div><\/details>", "kind": "concept", "title": "树与二叉树的等价表示：左孩右兄"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.270<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">线性表的数组分配与链接分配：代价对比<\/a><\/span><\/div><h1>二叉树三种遍历次序与栈实现<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2 章（原书 §2.3.1）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>树的信息靠结点之间的分支关系承载，但要输出、比较或搜索树，需要把结点排成一个线性序列。遍历就是系统地考察结点、使每个结点恰访问一次的方法；同一棵树按不同规则走出不同序列，次序约定决定了序列能回答什么问题。书里 §2.3.1 在进入树的进一步分析之前，先把二叉树三种递归遍历讲透（PDF 第 270 页）。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>二叉树定义<\/strong>：结点的有限集，或者为空，或者由一个根和两棵互不相交的二叉树（左子树、右子树）组成。内存表示中每个结点有两个链 LLINK、RLINK，外加指向树根的指针 T；树空时 <span class=\"katex-inline\">T=\\Lambda<\/span>，否则 T 是根结点地址（PDF 第 270 页）。<\/p>\n<p><strong>遍历<\/strong>：系统地考察树结点，每个结点恰访问一次。完全遍历给出结点的一种线性排列，序列中可以谈&quot;前一个&quot;&quot;后一个&quot;结点。<\/p>\n<p><strong>先序遍历（preorder）<\/strong>：访问根 → 遍历左子树 → 遍历右子树。<\/p>\n<p><strong>中序遍历（inorder）<\/strong>：遍历左子树 → 访问根 → 遍历右子树。<\/p>\n<p><strong>后序遍历（postorder）<\/strong>：遍历左子树 → 遍历右子树 → 访问根。<\/p>\n<p>空树时什么都不做，已经算&quot;遍历&quot;；非空树按上述三步递归定义。书里样例二叉树的先序输出为 <span class=\"katex-inline\">A\\ B\\ D\\ C\\ E\\ G\\ F\\ H\\ J<\/span>（PDF 第 270 页）。<\/p>\n<h2>原理推导与推演：样例树的三序输出<\/h2>\n<p>样例树结构：根 <span class=\"katex-inline\">A<\/span>，左子树根 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 的右为空、左孩子 <span class=\"katex-inline\">D<\/span>；右子树根 <span class=\"katex-inline\">C<\/span>，<span class=\"katex-inline\">C<\/span> 的左孩子 <span class=\"katex-inline\">E<\/span>、右孩子 <span class=\"katex-inline\">F<\/span>；<span class=\"katex-inline\">E<\/span> 左为空、右孩子 <span class=\"katex-inline\">G<\/span>；<span class=\"katex-inline\">F<\/span> 的左孩子 <span class=\"katex-inline\">H<\/span>、右孩子 <span class=\"katex-inline\">J<\/span>。<\/p>\n<p>先序（根左右）：<span class=\"katex-inline\">A\\ B\\ D\\ C\\ E\\ G\\ F\\ H\\ J<\/span>，与书里给出的序列一致（PDF 第 270 页序列 (3)）。<\/p>\n<p>中序（左根右）：<span class=\"katex-inline\">B<\/span> 子树得 <span class=\"katex-inline\">D\\ B<\/span>；<span class=\"katex-inline\">C<\/span> 子树中，<span class=\"katex-inline\">E<\/span> 左空、右子树 <span class=\"katex-inline\">G<\/span>，<span class=\"katex-inline\">E<\/span> 子树得 <span class=\"katex-inline\">E\\ G<\/span>，<span class=\"katex-inline\">F<\/span> 子树得 <span class=\"katex-inline\">H\\ F\\ J<\/span>，根 <span class=\"katex-inline\">C<\/span> 在中间，合为 <span class=\"katex-inline\">E\\ G\\ C\\ H\\ F\\ J<\/span>；整树为 <span class=\"katex-inline\">D\\ B\\ A\\ E\\ G\\ C\\ H\\ F\\ J<\/span>（PDF 第 271 页序列 (4)）。<\/p>\n<p>后序（左右根）：<span class=\"katex-inline\">B<\/span> 子树得 <span class=\"katex-inline\">D\\ B<\/span>；<span class=\"katex-inline\">E<\/span> 子树得 <span class=\"katex-inline\">G\\ E<\/span>；<span class=\"katex-inline\">F<\/span> 子树得 <span class=\"katex-inline\">H\\ J\\ F<\/span>；<span class=\"katex-inline\">C<\/span> 子树得 <span class=\"katex-inline\">G\\ E\\ H\\ J\\ F\\ C<\/span>；整树为 <span class=\"katex-inline\">D\\ B\\ G\\ E\\ H\\ J\\ F\\ C\\ A<\/span>（PDF 第 271 页序列 (5)）。<\/p>\n<p><strong>递归到栈的转换<\/strong>：递归执行时，调用栈保存每一层待返回的现场。改成迭代版本时用显式栈模拟：以中序为例，从根出发沿左链下压，每压一个结点记下&quot;待访问&quot;；走到空后弹出栈顶结点访问，再转到其右子树重复。栈里保存的是尚未完成右子树处理的结点。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：二叉树结点可区分左右；遍历要求每结点恰访问一次，不做重复搜索。\n<\/li><li>\n失败案例 1：次序中左右写反。先序写成根右左，得到另一套序列；三种次序不再互为同一树的视图，与其他算法的对照会错位。\n<\/li><li>\n失败案例 2：空树判断漏掉。递归进入空子树直接访问字段，会对空链解引用；迭代实现中栈空判断缺失会在叶子处越界。\n<\/li><li>\n边界：遍历本身不修改树；带访问动作的遍历可以在结点处做查询、打印或累计，但遍历规则与访问内容分离。\n<\/li><li>\n复杂度：每个结点压栈、弹出各一次，遍历时间 <span class=\"katex-inline\">O(n)<\/span>；显式栈最坏占用 <span class=\"katex-inline\">O(n)<\/span>（单支树），平衡树为 <span class=\"katex-inline\">O(\\log n)<\/span>。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>先序 vs 后序<\/strong>：先序先处理根再下钻，适合复制树、输出目录层次；后序先完成子树再回根，适合释放树、计算子树规模。中序在二叉搜索树中给出升序序列。\n<\/li><li>\n<strong>递归遍历 vs 栈遍历<\/strong>：递归写法靠语言调用栈，栈遍历靠程序内显式结构；两者访问次序相同，差别在现场保存方式与可控性。\n<\/li><li>\n<strong>树遍历 vs 表扫描<\/strong>：线性表扫描是单链循访；树遍历带分支回退，必须记录待返回位置，否则走完左子树找不到回根路径。\n<\/li><li>\n<strong>三序 vs 层次遍历<\/strong>：先/中/后序都是深度优先路线；层次遍历按层从上到下、同层从左到右，用队列实现，不属于本节三种递归次序。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c08 链接分配提供结点链字段；c06 左孩右兄把一般树转成二叉树后，本节遍历结果可翻译回树的先根、后根次序。后继：树的路径长度、表达式求值、目录输出等算法都建立在遍历序列之上；第 4 章对遍历做结点访问计数时，求和范围按三序结构划分。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（二叉树三种遍历次序与栈实现）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：三序遍历的依赖链、样例树输出与栈迭代推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把遍历落到可执行算法，先往回追三层：<\/p>\n<ol><li>\n二叉树结构可递归拆开：根 + 左子树 + 右子树。遍历规则必须按这个递归结构组织。\n<\/li><li>\n访问次序约定：根、左、右三者的相对位置排列出先序、中序、后序；空树为空操作。\n<\/li><li>\n递归执行靠调用栈保存现场；改迭代版本时，显式栈承担同一职责，压栈与回退规则对应递归返回点。\n<\/ol>\n<p>依赖链方向：二叉树递归定义 → 三序规则按根/左/右排列 → 样例树逐层展开输出序列 → 递归现场转显式栈 → 复杂度按结点计数。<\/p>\n<h2>正向推导（逐步推演）：样例树三序展开<\/h2>\n<p>样例树结构：根 <span class=\"katex-inline\">A<\/span>；左子树根 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 左孩子 <span class=\"katex-inline\">D<\/span>，右空；右子树根 <span class=\"katex-inline\">C<\/span>，<span class=\"katex-inline\">C<\/span> 左 <span class=\"katex-inline\">E<\/span>、右 <span class=\"katex-inline\">F<\/span>；<span class=\"katex-inline\">E<\/span> 左空、右孩子 <span class=\"katex-inline\">G<\/span>；<span class=\"katex-inline\">F<\/span> 左 <span class=\"katex-inline\">H<\/span>、右 <span class=\"katex-inline\">J<\/span>。<\/p>\n<p><strong>先序（根左右）<\/strong>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">A<\/span> 先访问；进 <span class=\"katex-inline\">B<\/span> 子树：访问 <span class=\"katex-inline\">B<\/span>，访问 <span class=\"katex-inline\">D<\/span>，<span class=\"katex-inline\">B<\/span> 右空；\n<\/li><li>\n进 <span class=\"katex-inline\">C<\/span> 子树：访问 <span class=\"katex-inline\">C<\/span>，进 <span class=\"katex-inline\">E<\/span> 子树：访问 <span class=\"katex-inline\">E<\/span>，访问 <span class=\"katex-inline\">G<\/span>；进 <span class=\"katex-inline\">F<\/span> 子树：访问 <span class=\"katex-inline\">F<\/span>，访问 <span class=\"katex-inline\">H<\/span>，访问 <span class=\"katex-inline\">J<\/span>。\n<\/li><li>\n输出：<span class=\"katex-inline\">A\\ B\\ D\\ C\\ E\\ G\\ F\\ H\\ J<\/span>，与书里序列一致（PDF 第 270 页序列 (3)）。\n<\/ul>\n<p><strong>中序（左根右）<\/strong>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">B<\/span> 子树：左 <span class=\"katex-inline\">D<\/span>，根 <span class=\"katex-inline\">B<\/span>，右空 → <span class=\"katex-inline\">D\\ B<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">C<\/span> 子树：<span class=\"katex-inline\">E<\/span> 左空、右 <span class=\"katex-inline\">G<\/span>，<span class=\"katex-inline\">E<\/span> 子树 → <span class=\"katex-inline\">E\\ G<\/span>；<span class=\"katex-inline\">F<\/span> 子树 → <span class=\"katex-inline\">H\\ F\\ J<\/span>；根 <span class=\"katex-inline\">C<\/span> 在中间 → <span class=\"katex-inline\">E\\ G\\ C\\ H\\ F\\ J<\/span>；\n<\/li><li>\n整树：<span class=\"katex-inline\">D\\ B\\ A\\ E\\ G\\ C\\ H\\ F\\ J<\/span>（PDF 第 271 页序列 (4)）。\n<\/ul>\n<p><strong>后序（左右根）<\/strong>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">B<\/span> 子树：<span class=\"katex-inline\">D\\ B<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">E<\/span> 子树：<span class=\"katex-inline\">G\\ E<\/span>；<span class=\"katex-inline\">F<\/span> 子树：<span class=\"katex-inline\">H\\ J\\ F<\/span>；<span class=\"katex-inline\">C<\/span> 子树：<span class=\"katex-inline\">G\\ E\\ H\\ J\\ F\\ C<\/span>；\n<\/li><li>\n整树：<span class=\"katex-inline\">D\\ B\\ G\\ E\\ H\\ J\\ F\\ C\\ A<\/span>（PDF 第 271 页序列 (5)）。\n<\/ul>\n<h2>数值算例：中序迭代的栈动作<\/h2>\n<p>以中序为例，显式栈保存&quot;尚未处理右子树&quot;的结点。<\/p>\n<ol><li>\n从 <span class=\"katex-inline\">A<\/span> 出发，沿左链下压：压 <span class=\"katex-inline\">A<\/span>，压 <span class=\"katex-inline\">B<\/span>，压 <span class=\"katex-inline\">D<\/span>。栈底到栈顶：<span class=\"katex-inline\">[A,B,D]<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">D<\/span> 左空，弹出 <span class=\"katex-inline\">D<\/span> 访问；转 <span class=\"katex-inline\">D<\/span> 右，空。\n<\/li><li>\n弹出 <span class=\"katex-inline\">B<\/span> 访问；转 <span class=\"katex-inline\">B<\/span> 右，空。\n<\/li><li>\n弹出 <span class=\"katex-inline\">A<\/span> 访问；转 <span class=\"katex-inline\">A<\/span> 右，进入 <span class=\"katex-inline\">C<\/span> 子树。\n<\/li><li>\n沿左链压 <span class=\"katex-inline\">C<\/span>，压 <span class=\"katex-inline\">E<\/span>；<span class=\"katex-inline\">E<\/span> 左空，弹出 <span class=\"katex-inline\">E<\/span> 访问；转 <span class=\"katex-inline\">E<\/span> 右，压 <span class=\"katex-inline\">G<\/span>；弹出 <span class=\"katex-inline\">G<\/span> 访问，<span class=\"katex-inline\">G<\/span> 右空。\n<\/li><li>\n回到 <span class=\"katex-inline\">C<\/span> 右子树，压 <span class=\"katex-inline\">F<\/span>，压 <span class=\"katex-inline\">H<\/span>；弹出 <span class=\"katex-inline\">H<\/span> 访问；弹出 <span class=\"katex-inline\">F<\/span> 访问，转 <span class=\"katex-inline\">F<\/span> 右，压 <span class=\"katex-inline\">J<\/span>；弹出 <span class=\"katex-inline\">J<\/span> 访问。\n<\/li><li>\n弹出 <span class=\"katex-inline\">C<\/span> 访问。\n<\/ol>\n<p>访问序列即中序结果 <span class=\"katex-inline\">D\\ B\\ A\\ E\\ G\\ C\\ H\\ F\\ J<\/span>，与递归展开一致。<\/p>\n<p>栈动作方向核对：<span class=\"katex-inline\">G<\/span> 是 <span class=\"katex-inline\">E<\/span> 的右孩子，沿左链下压阶段不经过 <span class=\"katex-inline\">G<\/span>；<span class=\"katex-inline\">E<\/span> 弹出访问后，控制转到 <span class=\"katex-inline\">E<\/span> 的右链才压入 <span class=\"katex-inline\">G<\/span>。若把 <span class=\"katex-inline\">G<\/span> 误当左孩子，压栈顺序会变成先压 <span class=\"katex-inline\">G<\/span> 再弹 <span class=\"katex-inline\">G<\/span>、后弹 <span class=\"katex-inline\">E<\/span>，中序次序被颠倒——孩子方向决定结点在哪一步进栈，这是迭代栈推演与递归展开必须对齐的细节。<\/p>\n<p><strong>先序迭代对照<\/strong>：弹栈访问根后，先压右子树再压左子树（栈后进先出，保证左先弹出）。<strong>后序迭代对照<\/strong>：需要两次出入栈标记，或用双栈；根在左右子树都完成后才访问。<\/p>\n<h2>延伸推演：复杂度与栈深<\/h2>\n<p>每个结点恰好压栈、弹出各一次，访问动作 <span class=\"katex-inline\">O(1)<\/span>，整树遍历时间 <span class=\"katex-inline\">O(n)<\/span>。栈空间最坏对应树高：单支树链长 <span class=\"katex-inline\">n<\/span>，栈深 <span class=\"katex-inline\">O(n)<\/span>；平衡二叉树高 <span class=\"katex-inline\">O(\\log n)<\/span>，栈深同阶。遍历不修改树结构，访问时挂载的查询、打印、累计动作与遍历规则分离。<\/p>\n<p>层次遍历不属于三序：它按层从上到下、同层从左到右，用队列保存待访问结点；深度优先的三序用栈，广度优先的层序用队列，数据结构选择对应遍历方向。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>左右次序写反<\/strong>：先序写成根右左，输出另一套序列；三序不再是同一树的视图，与后续算法对照错位。 <strong>空树判断漏掉<\/strong>：递归进入空子树仍解引用链字段，对空链访问；迭代实现栈空判断缺失会在叶子处越界。 <strong>递归现场丢失<\/strong>：递归返回时需要回到父结点继续处理右子树；不用显式栈保存返回点，走完左子树就回不到根。<\/p>\n<h2>对抗性追问：先序与中序能否唯一确定一棵树<\/h2>\n<p>可以由先序与中序（或后序与中序）还原二叉树；但只给先序与后序，部分结构无法区分。遍历序列是树的投影，单套序列不足以反推唯一结构。c06 的对应关系下，树遍历结果翻译回原树先根、后根次序，同样受这一约束。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出先序、中序、后序各自的根/左/右次序。\n<\/li><li>\n对样例树默背三序输出，并指出哪一套与书里先序序列一致。\n<\/li><li>\n中序迭代时栈里保存的是什么结点？为什么先压左链？\n<\/li><li>\n遍历时间与最坏栈深各是什么量级？单支树与平衡树栈深差别在哪？\n<\/li><li>\n层次遍历为什么用队列而不是栈？它与三序的遍历方向差别是什么？\n<\/ol>\n<h2>延伸推演：由遍历序列还原二叉树<\/h2>\n<p>先序加中序可唯一还原二叉树：先序首项是根，在中序中找到根位置，左侧划分左子树、右侧划分右子树；再按左右子树长度切分先序序列，递归还原。后序加中序走同一套划分：后序末项是根。<\/p>\n<p>只有先序与后序不足以唯一还原：根确定后，左子树与右子树的划分缺少中序边界信息，存在多种结构满足两套序列。这一约束解释了为什么遍历算法分析时常同时引用两套序列做交叉校验。<\/p>\n<h2>第二算例：小型树三序核对<\/h2>\n<p>取根 <span class=\"katex-inline\">R<\/span>，左孩子 <span class=\"katex-inline\">A<\/span>，右孩子 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">A<\/span> 无子女，<span class=\"katex-inline\">B<\/span> 左孩子 <span class=\"katex-inline\">C<\/span>。<\/p>\n<ul><li>\n先序：<span class=\"katex-inline\">R\\ A\\ B\\ C<\/span>；\n<\/li><li>\n中序：<span class=\"katex-inline\">A\\ R\\ C\\ B<\/span>；\n<\/li><li>\n后序：<span class=\"katex-inline\">A\\ C\\ B\\ R<\/span>。\n<\/ul>\n<p>核验路径：先序根 <span class=\"katex-inline\">R<\/span>，中序左段 <span class=\"katex-inline\">A<\/span>、右段 <span class=\"katex-inline\">C,B<\/span>；后序末项 <span class=\"katex-inline\">R<\/span>，与先序根一致。层序（广度优先）：<span class=\"katex-inline\">R,\\ A,\\ B,\\ C<\/span>，按层从上到下、同层从左到右，用队列保存待访问结点。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;三序差别只在打印位置&quot;。<\/strong> 次序决定子树处理时机：先序适合复制结构，后序适合释放与子树汇总，中序在搜索树上给出升序；用途由次序语义决定。\n<\/li><li>\n<strong>误解二：&quot;递归遍历不用栈&quot;。<\/strong> 递归靠语言调用栈保存现场；迭代版本只是把栈显式搬到程序内，现场保存职责没有消失。\n<\/li><li>\n<strong>误解三：&quot;遍历可以访问结点多次&quot;。<\/strong> 遍历定义要求每个结点恰访问一次；重复计数属于搜索或统计，不是遍历本身。\n<\/li><li>\n<strong>误解四：&quot;空树无法遍历&quot;。<\/strong> 空树什么都不做即算完成遍历；递归终止条件正是判空，漏掉判空才会出错。\n<\/ul>\n<h2>边界对照：遍历在全书结构分析中的位置<\/h2>\n<p>c06 的左孩右兄把一般树转成二叉树后，本概念三序结果翻译回原树先根、后根次序。c08 表扫描是单链循访，树遍历带分支回退，两者数据结构选择对应访问方向差异。后续表达式求值、目录输出、子树规模汇总都挂在遍历框架上；第 4 章统计访问次数时，求和范围按三序的左右子树结构划分。<\/p>\n<h2>推演补充：遍历中的不变量<\/h2>\n<p>递归遍历维持一条不变量：栈（或调用栈）中每个结点的右子树尚未处理，左子树已走完或正在走。以中序为例，压栈阶段沿左链下行，弹出时访问根，再转入右子树；不变量保证每个结点在左子树完成后才被访问，右子树在根之后处理。<\/p>\n<p>迭代实现丢失这个不变量就会出错：先访问根再压左子树，次序变成先序；压栈前未判空，叶子处解引用空链。写遍历算法时先声明不变量，再核对每个动作是否维持它，比凭印象调栈顺序可靠。<\/p>\n<h2>第三算例：单支树的栈深<\/h2>\n<p>左斜链 <span class=\"katex-inline\">A\\to B\\to C\\to\\cdots\\to X<\/span>，共 <span class=\"katex-inline\">n<\/span> 个结点。先序迭代压栈：根入栈后压左孩子，栈深达到 <span class=\"katex-inline\">n<\/span>；中序同样沿左链压到底再逐弹。最坏栈深 <span class=\"katex-inline\">O(n)<\/span>。<\/p>\n<p>平衡二叉树高 <span class=\"katex-inline\">O(\\log n)<\/span>，栈深同阶 <span class=\"katex-inline\">O(\\log n)<\/span>。时间复杂度两类情形都是 <span class=\"katex-inline\">O(n)<\/span>：每结点一次压入、一次弹出、一次访问，与树形无关；空间差别只在栈深。<\/p>\n<h2>推演补充：遍历与其他树操作的关系<\/h2>\n<p>复制树：先序遍历，访问根时新建结点并复制字段，再递归左右。释放树：后序遍历，左右子树清空后再释放根结点本身，避免先删根导致子树找不到入口。求子树规模：后序汇总，左规模加右规模加 1。二叉搜索树按中序输出升序键值。<\/p>\n<p>这些操作共用遍历骨架，差别只在访问结点时挂载的动作。理解三序次序后，新树操作先选遍历方向，再填访问动作，不必每次重写递归框架。<\/p>\n<h2>补充对照：三序的典型用途<\/h2>\n<p>先序适合复制与序列化：根先输出，重建时先建根再建左右子树，输入顺序与建树顺序一致。后序适合销毁与子树汇总：左右处理完才回根，汇总子树规模、高度、最值时父结点拿到的是已完成的子结果。中序在二叉搜索树上给出键值升序，范围查询与有序输出直接使用。<\/p>\n<p>选择遍历方向先看任务要什么结果：要结构重建选先序，要自底向上汇总选后序，要有序序列选中序。次序选错，访问动作再正确也拿不到目标序列。<\/p>\n<h2>补充算例：表达式树对照<\/h2>\n<p>表达式 <span class=\"katex-inline\">(a+b)\\times(c-d)<\/span> 对应二叉树：根为 <span class=\"katex-inline\">\\times<\/span>，左子树 <span class=\"katex-inline\">+<\/span>（<span class=\"katex-inline\">a,b<\/span>），右子树 <span class=\"katex-inline\">-<\/span>（<span class=\"katex-inline\">c,d<\/span>）。<\/p>\n<ul><li>\n先序：<span class=\"katex-inline\">\\times\\ +\\ a\\ b\\ -\\ c\\ d<\/span>（前缀式）；\n<\/li><li>\n中序：<span class=\"katex-inline\">a+b\\times c-d<\/span> 需加括号才保结构；\n<\/li><li>\n后序：<span class=\"katex-inline\">a\\ b\\ +\\ c\\ d\\ -\\ \\times<\/span>（后缀式）。\n<\/ul>\n<p>前缀、后缀表达式求值分别沿先序、后序栈框架处理；中序还原原始表达式必须补括号，否则运算优先级覆盖树结构。<\/p>\n<h2>补充边界：遍历与搜索的差别<\/h2>\n<p>遍历要求每结点恰访问一次，路径由树结构决定；搜索（如查找指定键值）可能提前终止，路径取决于比较结果。遍历是全结构扫描，搜索是定向检索，二者在栈/队列使用上相似，终止条件不同。把搜索剪枝误当遍历，会漏统计未访问结点；把遍历当搜索，会做多余访问。<\/p><\/div><\/details>", "kind": "concept", "title": "二叉树三种遍历次序与栈实现"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.208<\/div><h1>线性表的数组分配与链接分配：代价对比<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章（原书 §2.2）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>线性表只关心元素排成一行的相对位置：<span class=\"katex-inline\">X[1]<\/span> 是第一结点，<span class=\"katex-inline\">X[n]<\/span> 是最后结点，<span class=\"katex-inline\">1&lt;k&lt;n<\/span> 时 <span class=\"katex-inline\">X[k]<\/span> 前面是 <span class=\"katex-inline\">X[k-1]<\/span>、后面是 <span class=\"katex-inline\">X[k+1]<\/span>（PDF 第 208 页）。围绕表有访问第 <span class=\"katex-inline\">k<\/span> 项、插入、删除、合并、拆分、复制、计数、排序、搜索九类操作。同一个逻辑表，在机器内存里可以连续存放，也可以用指针串起来；两种表示在访问速度、增删代价、空间开销上各有取舍。这个概念把两类表示的代价算清楚，为选结构提供依据。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>线性表<\/strong>：<span class=\"katex-inline\">n\\ge0<\/span> 个结点的序列，基本结构性质只是各项排成一行时的相对位置（PDF 第 208 页）。空表 <span class=\"katex-inline\">n=0<\/span>。<\/p>\n<p><strong>顺序分配（数组式）<\/strong>：结点按次序连续存放在一段存储区；下标 <span class=\"katex-inline\">k<\/span> 对应位置可由基址加偏移直接算出。随机访问第 <span class=\"katex-inline\">k<\/span> 个结点是常数步。<\/p>\n<p><strong>链接分配<\/strong>：每个结点除数据字段外带链字段；结点在内存中不必连续，链字段保存后继（必要时再加前驱）结点的位置。访问第 <span class=\"katex-inline\">k<\/span> 个结点要沿链依次走。<\/p>\n<p><strong>栈、队列、双端队列<\/strong>：线性表的受限变体，只允许在端点处增删；书里 §2.2.1 先讨论这三类受限表，再展开一般顺序与链接分配（PDF 第 208 页）。<\/p>\n<h2>原理推导与推演：插入删除的步数对比<\/h2>\n<p>设表长 <span class=\"katex-inline\">n<\/span>，在第 <span class=\"katex-inline\">k<\/span> 个结点之后插入新结点 <span class=\"katex-inline\">x<\/span>。<\/p>\n<p>顺序分配：新结点占第 <span class=\"katex-inline\">k+1<\/span> 位，原 <span class=\"katex-inline\">k+1,\\dots,n<\/span> 位元素整体后移一格，移动个数 <span class=\"katex-inline\">n-k<\/span>；定位下标一次算出。删除第 <span class=\"katex-inline\">k<\/span> 个结点对称，把 <span class=\"katex-inline\">k+1,\\dots,n<\/span> 前移一格，移动 <span class=\"katex-inline\">n-k<\/span> 个元素。表尾插入 <span class=\"katex-inline\">k=n<\/span> 移动 0 个；表头插入 <span class=\"katex-inline\">k=1<\/span> 移动 <span class=\"katex-inline\">n-1<\/span> 个。<\/p>\n<p>链接分配：先沿链走 <span class=\"katex-inline\">k<\/span> 步定位第 <span class=\"katex-inline\">k<\/span> 个结点；定位后插入只改两个链字段——新结点链指向原后继，原结点链改指新结点，已有元素不挪动。删除同样先定位，再把前驱链直接接到后继。<\/p>\n<p>空间代价：链表每结点额外存至少一个链字段；顺序表按最大长度预留连续区域，表长波动大时预留不足或闲置。访问代价方向相反：顺序表 <span class=\"katex-inline\">O(1)<\/span> 随机访问，链表 <span class=\"katex-inline\">O(n)<\/span> 定位；插入删除动作顺序表 <span class=\"katex-inline\">O(n)<\/span> 移动，链表定位后 <span class=\"katex-inline\">O(1)<\/span> 改链。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：顺序表适合长度稳定、频繁随机访问、少做中间增删的场景；链表适合频繁头尾或中间增删、访问次序固定的场景。\n<\/li><li>\n失败案例 1：顺序表禁止整体搬移却要求表头插入。连续空间不移动元素就无法保持相对位置，强行放置会破坏下标语义。\n<\/li><li>\n失败案例 2：链表按下标直接取结点。没有基址偏移可算，跳过中间结点读不到目标；需要 <span class=\"katex-inline\">O(1)<\/span> 随机访问时只能回到顺序表或加辅助索引。\n<\/li><li>\n边界：链字段占用的空间在结点粒度上固定；顺序表的内碎片落在预留区尾部。两类表示都不解决表内查找效率问题，那是排序与搜索结构的任务。\n<\/li><li>\n混合方案：数组存链表结点（静态链表）保留链接语义，又避免动态分配；代价仍是沿链访问。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>顺序表 vs 数组<\/strong>：数组是存储载体，顺序分配是表的一种表示策略；数组也可用于其他结构，顺序表也可借别的连续存储实现。\n<\/li><li>\n<strong>单链表 vs 双链表<\/strong>：单链表只有后继链，删除某结点需先找到其前驱；双链表加前驱链，反向访问与删除更方便，每结点多一个字段。\n<\/li><li>\n<strong>循环链表 vs 普通链表<\/strong>：循环链表尾结点链回到表头而非空，适合环形调度；遍历终止条件从&quot;链为空&quot;改为&quot;回到起点&quot;。\n<\/li><li>\n<strong>顺序分配 vs 紧凑存储<\/strong>：顺序表连续紧凑，链接分配结点离散；紧凑程度不同，缓存局部性也不同，但代价对比不能只看存储密度。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 可行性要求每步操作基本可执行，两类分配的插入删除都落到可计数的基本动作。后继：c07 遍历栈用链接或顺序区保存待返回结点；c06 左孩右兄的链字段是链接思想在树上的推广。第 4 章分析插入删除时，移动元素个数 <span class=\"katex-inline\">n-k<\/span> 直接进入求和式。<\/p>\n<h2>补充：两类分配在受限表上的表现<\/h2>\n<p>栈只在表顶增删，顺序分配与链接分配都能胜任：顺序栈顶指针上移下移，链栈在表头压入弹出。队列在两端操作，顺序队列要处理环形回绕，否则表头一侧空间闲置；链队列天然支持两端进出，但每结点多一个链字段。双端队列同时允许两端增删，两类表示都可实现，差别仍在随机访问与搬移代价的对照上。<\/p>\n<p>选结构时先统计操作频次：若九成操作是按位置读取、少量增删，顺序表的连续布局带来访问优势；若操作集中在表头表尾插入删除，链表省去搬移。混合场景可以在链表上加索引块，或在顺序表上做批量重排，用辅助结构弥补主表示的短板。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（线性表的数组分配与链接分配：代价对比）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：两类线性表分配的代价链、插入删除算例与空间对照<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>比较顺序分配与链接分配，先往回追三层：<\/p>\n<ol><li>\n线性表语义只规定相对位置：首项 <span class=\"katex-inline\">X[1]<\/span>，末项 <span class=\"katex-inline\">X[n]<\/span>，<span class=\"katex-inline\">X[k]<\/span> 前后邻接。语义不规定内存布局。\n<\/li><li>\n布局选择决定访问路径：连续区域靠基址加偏移定位；离散结点靠链字段循访。\n<\/li><li>\n操作代价沿路径折算：定位步数、挪动元素个数、链字段开销分别计数，再汇总成各类操作量级。\n<\/ol>\n<p>依赖链方向：表的位置语义 → 连续/离散两种布局 → 定位与增删路径 → 步数与空间代价对照 → 场景选择依据。<\/p>\n<h2>正向推导（逐步推演）：插入删除逐项计数<\/h2>\n<p>设表长 <span class=\"katex-inline\">n<\/span>，在第 <span class=\"katex-inline\">k<\/span> 个结点之后插入新结点 <span class=\"katex-inline\">x<\/span>。<\/p>\n<p><strong>顺序分配<\/strong>：<\/p>\n<ul><li>\n定位：下标 <span class=\"katex-inline\">k<\/span> 由基址偏移直接算出，<span class=\"katex-inline\">O(1)<\/span>。\n<\/li><li>\n搬移：原位置 <span class=\"katex-inline\">k+1,\\dots,n<\/span> 共 <span class=\"katex-inline\">n-k<\/span> 个元素后移一格，每个元素一次写操作，搬移 <span class=\"katex-inline\">n-k<\/span> 步。\n<\/li><li>\n写入：新结点放第 <span class=\"katex-inline\">k+1<\/span> 位，一次写入。\n<\/li><li>\n删除第 <span class=\"katex-inline\">k<\/span> 个结点：对称，<span class=\"katex-inline\">k+1,\\dots,n<\/span> 共 <span class=\"katex-inline\">n-k<\/span> 个元素前移一格。\n<\/ul>\n<p><strong>链接分配<\/strong>：<\/p>\n<ul><li>\n定位：沿链走 <span class=\"katex-inline\">k<\/span> 步到达第 <span class=\"katex-inline\">k<\/span> 个结点。\n<\/li><li>\n插入：新结点链指向原后继；原结点链改指新结点，两次改链，已有元素不挪动。\n<\/li><li>\n删除：先定位前驱，前驱链直接接到后继，两次改链。\n<\/ul>\n<p><strong>访问对照<\/strong>：顺序表取第 <span class=\"katex-inline\">k<\/span> 项 <span class=\"katex-inline\">O(1)<\/span>；链表取第 <span class=\"katex-inline\">k<\/span> 项 <span class=\"katex-inline\">O(k)<\/span>，最坏 <span class=\"katex-inline\">O(n)<\/span>。<\/p>\n<h2>数值算例：具体表长下的步数<\/h2>\n<p><strong>算例 1：顺序表中间插入<\/strong>。表 <span class=\"katex-inline\">[a,b,c,d,e]<\/span>，<span class=\"katex-inline\">n=5<\/span>，在 <span class=\"katex-inline\">b<\/span>（第 2 项）后插 <span class=\"katex-inline\">x<\/span>。<\/p>\n<ul><li>\n搬移：<span class=\"katex-inline\">c,d,e<\/span> 后移，<span class=\"katex-inline\">n-k=5-2=3<\/span> 个元素；\n<\/li><li>\n写入 <span class=\"katex-inline\">x<\/span>；新表 <span class=\"katex-inline\">[a,b,x,c,d,e]<\/span>。\n<p>表头插入 <span class=\"katex-inline\">k=1<\/span>：搬移 <span class=\"katex-inline\">n-1=4<\/span> 个；表尾插入 <span class=\"katex-inline\">k=n=5<\/span>：搬移 0 个。<\/p>\n<\/ul>\n<p><strong>算例 2：链表同一插入<\/strong>。链 <span class=\"katex-inline\">a\\to b\\to c\\to d\\to e<\/span>，在 <span class=\"katex-inline\">b<\/span> 后插 <span class=\"katex-inline\">x<\/span>。<\/p>\n<ul><li>\n定位走 2 步到 <span class=\"katex-inline\">b<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">x<\/span> 链指向 <span class=\"katex-inline\">c<\/span>；<span class=\"katex-inline\">b<\/span> 链改指 <span class=\"katex-inline\">x<\/span>；两次改链，无元素搬移。\n<\/ul>\n<p><strong>算例 3：删除代价对比<\/strong>。顺序表删第 3 项 <span class=\"katex-inline\">c<\/span>：<span class=\"katex-inline\">d,e<\/span> 前移，<span class=\"katex-inline\">n-k=5-3=2<\/span> 步。链表删 <span class=\"katex-inline\">c<\/span>：先走到 <span class=\"katex-inline\">b<\/span>（2 步），<span class=\"katex-inline\">b<\/span> 链接 <span class=\"katex-inline\">d<\/span>，一步改链。<\/p>\n<h2>延伸推演：空间代价与混合方案<\/h2>\n<p>顺序表按最大长度预留连续区域；表长长期小于预留时，尾部空间闲置，属预留区碎片。链表每结点至少存一个后继链字段，字段大小随机器字长；结点离散分布，分配释放有额外开销。<\/p>\n<p>静态链表在数组内结点间用下标链代替指针，保留链接语义又避免动态分配；代价仍是沿链访问。双链表加前驱链，反向访问与删除方便，每结点多一字段。循环链表尾链回表头，遍历终止条件改为回到起点。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>顺序表禁止搬移<\/strong>：不整体挪动元素，表头插入无法在连续空间保持相对位置；新元素只能放表尾，下标语义被破坏。 <strong>链表按下标直取<\/strong>：没有基址偏移可算，跳过中间结点读不到目标；需要 <span class=\"katex-inline\">O(1)<\/span> 随机访问时只能回到顺序表或加索引结构。 <strong>把链字段开销算进时间<\/strong>：链字段占空间，不占遍历时间；两类代价分开计数，不要把存储密度与访问速度混为一谈。<\/p>\n<h2>对抗性追问：链表是否在所有操作上都更优<\/h2>\n<p>不是。链表优势集中在定位后的插入删除；随机访问、顺序扫描的局部性上，顺序表连续存放，缓存预取命中率更高。若场景以查表为主、增删很少，顺序表综合代价更低。选结构取决于最频繁的操作类型，不存在单表通吃。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n线性表的相对位置语义规定了什么？它是否规定内存布局？\n<\/li><li>\n顺序表插入第 <span class=\"katex-inline\">k<\/span> 项后要搬移几个元素？删除呢？\n<\/li><li>\n链表定位第 <span class=\"katex-inline\">k<\/span> 项要走几步？插入删除各改几次链？\n<\/li><li>\n两类表示在随机访问复杂度与空间预留上各有什么取舍？\n<\/li><li>\n静态链表、双链表、循环链表分别解决什么问题？\n<\/ol>\n<h2>延伸推演：操作代价汇总表<\/h2>\n<p>按九类常见操作对照两类表示（表长 <span class=\"katex-inline\">n<\/span>）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>操作<\/th><th>顺序分配<\/th><th>链接分配<\/th><\/tr><\/thead><tbody><tr><td>访问第 <span class=\"katex-inline\">k<\/span> 项<\/td><td><span class=\"katex-inline\">O(1)<\/span> 下标定位<\/td><td><span class=\"katex-inline\">O(k)<\/span> 沿链走<\/td><\/tr><tr><td>表头插入<\/td><td>搬移 <span class=\"katex-inline\">n-1<\/span> 项<\/td><td>改链 2 次<\/td><\/tr><tr><td>表尾插入<\/td><td>搬移 0 项<\/td><td>改链 2 次<\/td><\/tr><tr><td>中间插入<\/td><td>搬移 <span class=\"katex-inline\">n-k<\/span> 项<\/td><td>定位后改链 2 次<\/td><\/tr><tr><td>删除第 <span class=\"katex-inline\">k<\/span> 项<\/td><td>搬移 <span class=\"katex-inline\">n-k<\/span> 项<\/td><td>定位前驱后改链 1 次<\/td><\/tr><tr><td>合并两表<\/td><td>复制搬移两表长度<\/td><td>接尾链一次改链<\/td><\/tr><tr><td>拆分<\/td><td>下标切分<\/td><td>断点改链<\/td><\/tr><tr><td>计数<\/td><td>记长度字段 <span class=\"katex-inline\">O(1)<\/span><\/td><td>记长度或沿链 <span class=\"katex-inline\">O(n)<\/span><\/td><\/tr><tr><td>排序/搜索<\/td><td>随机访问优势<\/td><td>访问劣势另计<\/td><\/tr><\/tbody><\/table><\/div>\n<p>表中复杂度按最坏路径计；实际常数因子随存储实现不同。<\/p>\n<h2>第二算例：<span class=\"katex-inline\">n=10<\/span> 链表定位<\/h2>\n<p>链表 <span class=\"katex-inline\">v_1\\to v_2\\to\\cdots\\to v_{10}<\/span>，访问第 7 项：沿链走 6 次后继到达。若在第 7 项后插入 <span class=\"katex-inline\">x<\/span>：定位 6 步，<span class=\"katex-inline\">x<\/span> 链指向 <span class=\"katex-inline\">v_8<\/span>，<span class=\"katex-inline\">v_7<\/span> 链改指 <span class=\"katex-inline\">x<\/span>，两次改链。删除第 7 项：先走到 <span class=\"katex-inline\">v_6<\/span>（5 步），<span class=\"katex-inline\">v_6<\/span> 链接 <span class=\"katex-inline\">v_8<\/span>，一次改链。<\/p>\n<p>对照顺序表同场景：访问第 7 项一次偏移计算；插入搬移 <span class=\"katex-inline\">10-7=3<\/span> 项（<span class=\"katex-inline\">v_8,v_9,v_{10}<\/span> 后移）；删除搬移 3 项。两侧代价结构相反：链表贵在定位，顺序表贵在搬移。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;链表省空间&quot;。<\/strong> 链表省的是预留连续区，每结点额外链字段；结点离散分配还有管理开销，总空间不一定少于顺序表。\n<\/li><li>\n<strong>误解二：&quot;顺序表不能动态扩长&quot;。<\/strong> 顺序表可按容量倍增扩容；扩容时整体复制搬移，摊还代价与单次扩容代价要分开记。\n<\/li><li>\n<strong>误解三：&quot;双链表能随机访问&quot;。<\/strong> 双链表只是反向多一条前驱链，访问第 <span class=\"katex-inline\">k<\/span> 项仍要沿链走，随机访问能力没有恢复。\n<\/li><li>\n<strong>误解四：&quot;循环链表比普通链表多存数据&quot;。<\/strong> 循环链表尾链回表头，数据结点数不变，改变的是遍历终止条件。\n<\/ul>\n<h2>边界对照：两类表示在结构层的位置<\/h2>\n<p>c01 可行性把插入删除拆成可计数基本动作；c07 遍历栈可以用顺序区保存待返回结点，也可以用链表结点；c06 树的链字段是链接思想在树上的双链推广。第 4 章做算法分析时，插入删除搬移个数 <span class=\"katex-inline\">n-k<\/span> 直接进入求和式，再压成渐进量级。受限表（栈、队列、双端队列）是线性表操作端点受限的变体，代价对照沿同一框架。<\/p>\n<h2>推演补充：顺序表扩容的摊还代价<\/h2>\n<p>顺序表容量不足时申请更大连续区，把旧元素整体复制过去。单次扩容代价 <span class=\"katex-inline\">O(n)<\/span>，但不是每次插入都扩容；按容量倍增策略，连续两次扩容之间插入 <span class=\"katex-inline\">O(n)<\/span> 次，把扩容复制代价摊到各次插入上，单次摊还代价 <span class=\"katex-inline\">O(1)<\/span>。<\/p>\n<p>这与单次最坏 <span class=\"katex-inline\">O(n)<\/span> 搬移不矛盾：摊还分析看长期均值，最坏情形看单次峰值。链表没有扩容复制，但每结点链字段开销与动态分配代价在另一侧。两类表示的总代价要把空间开销与访问代价合并评估，不能只看插入一步。<\/p>\n<h2>第三算例：队列两种实现对照<\/h2>\n<p>顺序队列：队头指针 <span class=\"katex-inline\">f<\/span>、队尾指针 <span class=\"katex-inline\">r<\/span>，入队写 <span class=\"katex-inline\">r<\/span> 位置再后移，出队读 <span class=\"katex-inline\">f<\/span> 位置再后移；线性前移会让头部空间闲置，需环形回绕把尾部接回头部。判满与判空靠计数或留一个空位区分。<\/p>\n<p>链队列：队头、队尾两个指针，入队在尾后插，出队在头后删；两端都是常数步，无回绕问题，每结点多一个后继链字段。两类实现都满足队列先进先出，差别在空间预留与访问路径。<\/p>\n<h2>推演补充：表示选择的决策顺序<\/h2>\n<p>选线性表表示先回答三个问题：最频繁的操作是读还是增删；读是否按下标随机访问；表长波动幅度多大。随机读多、长度稳定 → 顺序表；增删集中、长度不定 → 链表；需要两端操作 → 再按栈或队列变体细化。<\/p>\n<p>混合方案不是折中退路：链表加索引块改善随机访问，顺序表批量重排抑制碎片，静态链表在数组内做链接。决策时先统计操作频次，再选主表示，最后用辅助结构补短板；脱离操作频次谈&quot;哪种表更好&quot;没有结论。<\/p>\n<h2>补充对照：链字段的几种组织方式<\/h2>\n<p>单链表每结点一个后继链，尾结点链为空；删除结点需先找到前驱，定位步数含前驱查找。双链表每结点再加前驱链，反向访问与删除方便，空间多一个字段。循环链表尾链回到表头，遍历终止条件改为回到起点；判空与判满要另设标记。静态链表在数组下标间串链，无动态分配，适合规模固定、不允许指针环境的场景。<\/p>\n<p>组织方式选择按反向访问需求：不需要前驱用单链，频繁删除已知结点用双链，环形调度用循环链表，受限内存用静态链。字段越多维护代价越高，不为用不到的方向预留链。<\/p>\n<h2>补充算例：<span class=\"katex-inline\">n=6<\/span> 两表操作对比<\/h2>\n<p>顺序表 <span class=\"katex-inline\">[v_1,v_2,v_3,v_4,v_5,v_6]<\/span>：<\/p>\n<ul><li>\n访问 <span class=\"katex-inline\">v_4<\/span>：下标偏移一次计算；\n<\/li><li>\n<span class=\"katex-inline\">v_3<\/span> 后插 <span class=\"katex-inline\">x<\/span>：<span class=\"katex-inline\">v_4,v_5,v_6<\/span> 后移，搬 3 项；\n<\/li><li>\n删 <span class=\"katex-inline\">v_4<\/span>：<span class=\"katex-inline\">v_5,v_6<\/span> 前移，搬 2 项。\n<\/ul>\n<p>链表 <span class=\"katex-inline\">v_1\\to\\cdots\\to v_6<\/span>：<\/p>\n<ul><li>\n访问 <span class=\"katex-inline\">v_4<\/span>：沿链走 3 步；\n<\/li><li>\n<span class=\"katex-inline\">v_3<\/span> 后插 <span class=\"katex-inline\">x<\/span>：定位 3 步，两次改链；\n<\/li><li>\n删 <span class=\"katex-inline\">v_4<\/span>：先到 <span class=\"katex-inline\">v_3<\/span> 走 2 步，前驱链直接接 <span class=\"katex-inline\">v_5<\/span>，一次改链。\n<\/ul>\n<p>两侧步数对照：顺序表访问快、增删搬移多；链表访问慢、增删改链少。<span class=\"katex-inline\">n<\/span> 增大后，搬移与定位的差距按线性拉开。<\/p>\n<h2>补充边界：表与其他结构的衔接<\/h2>\n<p>线性表是最基础结构，栈与队列是端点受限变体；串（字符序列）可借顺序表存储；数组与正交表（§2.2.6）在表上扩展多维下标。树与图的结点常挂表链组织子女或邻接点。c06 树的双链、c07 遍历栈都以本章链接/顺序表示为底层构件，理解两类分配的代价是后续结构分析的前提。<\/p>\n<h2>补充空间对照：字段与预留开销<\/h2>\n<p>顺序表预留容量 <span class=\"katex-inline\">C<\/span>，已存 <span class=\"katex-inline\">n<\/span> 项，闲置空间 <span class=\"katex-inline\">C-n<\/span>；链表每结点除数据外存链字段，节点分配还有对齐与管理开销。两表总空间比较：顺序表换随机访问付预留闲置，链表付链字段与分配碎片。表长波动大时预留闲置容易浪费，链表空间随实际项数增长；字段宽度按数据类型决定，链字段宽度在固定字长机器上为常数。<\/p><\/div><\/details>", "kind": "concept", "title": "线性表的数组分配与链接分配：代价对比"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">欧几里得算法的正确性与复杂度（gcd 不变量与步数量级）<\/a><\/span><\/div><h1>线性同余发生器：模数选择与周期<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（本卷仅铺垫数论；发生器方法属卷 2 第 3 章，本概念不挂本卷页码）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>程序需要一批&quot;看起来不可预测&quot;的数做采样、模拟、加盐或测试。真随机来源成本高、不可复现；工程上常用确定的递推造出一长串数，再用统计检验筛掉结构太差的。线性同余发生器（LCG）是最经典的一类：递推形式简单，状态空间有限，周期、分布性质可以从数论条件上分析。这个概念回答递推怎样写、周期由什么决定、满周期需要哪些条件方向。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>递推式<\/strong>：<span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">m<\/span>：模数，状态空间大小，序列取值范围 <span class=\"katex-inline\">0\\le X_n&lt;m<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">a<\/span>：乘子；\n<\/li><li>\n<span class=\"katex-inline\">c<\/span>：增量（偏移量）；\n<\/li><li>\n<span class=\"katex-inline\">X_0<\/span>：初值（种子）。\n<\/ul>\n<p><strong>状态<\/strong>：每个 <span class=\"katex-inline\">X_n<\/span> 是发生器当前状态。状态总数有限（<span class=\"katex-inline\">m<\/span> 个），序列从某一步起必然重复；一旦某状态再次出现，其后序列与上次完全一致，进入循环。<\/p>\n<p><strong>周期<\/strong>：从初值出发到首次回到该状态经过的步数。满周期指序列遍历全部 <span class=\"katex-inline\">m<\/span> 个状态后才回到初值；否则周期短于 <span class=\"katex-inline\">m<\/span>，部分状态永远不可达。<\/p>\n<p><strong>满周期条件方向<\/strong>（通行结论，供理解条件结构）：<\/p>\n<ol><li>\n<span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">m<\/span> 互素，即 <span class=\"katex-inline\">\\gcd(c,m)=1<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">a-1<\/span> 被 <span class=\"katex-inline\">m<\/span> 的每个素因子整除；\n<\/li><li>\n若 <span class=\"katex-inline\">m<\/span> 被 4 整除，则 <span class=\"katex-inline\">a-1<\/span> 也被 4 整除。\n<\/ol>\n<p>满足这组方向时递推达到满周期 <span class=\"katex-inline\">m<\/span>；任一条件偏离，周期受限。<\/p>\n<h2>原理推导与推演：小模数逐项与周期观察<\/h2>\n<p>取 <span class=\"katex-inline\">m=16,\\ a=5,\\ c=1,\\ X_0=1<\/span>。递推 <span class=\"katex-inline\">X_{n+1}=(5X_n+1)\\bmod16<\/span>。<\/p>\n<p><span class=\"katex-inline\">X_1=6<\/span>，<span class=\"katex-inline\">X_2=15<\/span>，<span class=\"katex-inline\">X_3=12<\/span>，<span class=\"katex-inline\">X_4=13<\/span>，<span class=\"katex-inline\">X_5=2<\/span>，<span class=\"katex-inline\">X_6=11<\/span>，<span class=\"katex-inline\">X_7=8<\/span>，<span class=\"katex-inline\">X_8=9<\/span>，<span class=\"katex-inline\">X_9=14<\/span>，<span class=\"katex-inline\">X_{10}=7<\/span>，<span class=\"katex-inline\">X_{11}=4<\/span>，<span class=\"katex-inline\">X_{12}=5<\/span>，<span class=\"katex-inline\">X_{13}=10<\/span>，<span class=\"katex-inline\">X_{14}=3<\/span>，<span class=\"katex-inline\">X_{15}=0<\/span>，<span class=\"katex-inline\">X_{16}=1<\/span>，回到初值。<\/p>\n<p>16 个状态 <span class=\"katex-inline\">0,\\dots,15<\/span> 各出现一次，周期 16，等于模数。对照条件：<span class=\"katex-inline\">c=1<\/span> 与 16 互素；<span class=\"katex-inline\">a-1=4<\/span> 被素因子 2 整除；16 被 4 整除，<span class=\"katex-inline\">a-1=4<\/span> 也被 4 整除。<\/p>\n<p><strong>周期崩溃算例<\/strong>：取 <span class=\"katex-inline\">m=8,\\ a=2,\\ c=0,\\ X_0=1<\/span>。序列 <span class=\"katex-inline\">1\\to2\\to4\\to0\\to0\\cdots<\/span>，第三步后卡在 0，周期为 1。状态空间 8 个，实际只走过三个非零值。这里 <span class=\"katex-inline\">c=0<\/span> 与模数有公因子的约束未被满足，乘子也未提供足够扰动。<\/p>\n<p><strong>模运算结构<\/strong>：每步先算 <span class=\"katex-inline\">aX_n+c<\/span> 的普通整数，再对 <span class=\"katex-inline\">m<\/span> 取余；余数落在 <span class=\"katex-inline\">[0,m-1]<\/span>。加法项 <span class=\"katex-inline\">c<\/span> 保证非零初值不至于被乘子迅速压到 0；互素条件决定可达状态是否被公因子切走一块。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：需要可复现、低速实现的伪随机序列；对高维不可预测性要求不高的场景。\n<\/li><li>\n失败案例 1：模数取合数而乘子选错，序列早早就落入短周期或固定点，频数检验立刻暴露规则痕迹。\n<\/li><li>\n失败案例 2：<span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">m<\/span> 有公因子 <span class=\"katex-inline\">d&gt;1<\/span>，各项与 <span class=\"katex-inline\">m<\/span> 的 gcd 被 <span class=\"katex-inline\">d<\/span> 约束，部分状态不可达，周期不可能满。\n<\/li><li>\n失败案例 3：同一初值重复使用。LCG 是确定过程，同一种子产生同一整列序列；不换种子，多次运行得到重复结果，独立性无从谈起。\n<\/li><li>\n边界：LCG 周期长不等于分布好；满周期只保证状态遍历，高维结构可能仍有规则痕迹，要靠 c10 的检验把关。递推只在整数模运算层面定义，不涉及真随机源。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>周期 vs 长度<\/strong>：周期是循环长度，输出长度可以超过周期（重复输出）；评测时不要把输出个数误当周期。\n<\/li><li>\n<strong>模数 vs 精度<\/strong>：<span class=\"katex-inline\">m<\/span> 决定状态空间与取值上限，不直接决定单个数字的有效位数；生成 <span class=\"katex-inline\">[0,1)<\/span> 均匀数还要做归一化。\n<\/li><li>\n<strong>LCG vs 移位寄存器发生器<\/strong>：LCG 用乘法加法，递推简单；其他发生器（线性反馈移位寄存器等）换用位移与异或，周期结构与高维性质不同。\n<\/li><li>\n<strong>种子 vs 参数<\/strong>：<span class=\"katex-inline\">X_0<\/span> 换值改起点，<span class=\"katex-inline\">m,a,c<\/span> 换值改整条序列；调试复现要固定参数、记录种子。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c04 gcd 与余数替换是互素判断的基础；c01 有限性对应递推必然回到旧状态这一终止事实。后继：c10 谱检验与 χ² 检验对发生器输出做均匀性核查；c11 估计周期内各类计数时用到求和与渐进。模运算概念接第 1 章 §1.2.4 整数函数与初等数论（PDF 第 47 页）。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（线性同余发生器：模数选择与周期）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：线性同余发生器的周期链、逐项算例与条件核验<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>分析 LCG 周期，先往回追三层：<\/p>\n<ol><li>\n状态空间有限：<span class=\"katex-inline\">X_n<\/span> 取值 <span class=\"katex-inline\">0,\\dots,m-1<\/span>，共 <span class=\"katex-inline\">m<\/span> 个状态；每步转入确定状态。\n<\/li><li>\n重复即循环：某状态再次出现后，后继由同一递推唯一确定，序列进入闭环。\n<\/li><li>\n周期长度由参数约束：可达状态是否被公因子切走、乘子是否提供足够扰动，决定周期能否达到满值。\n<\/ol>\n<p>依赖链方向：模运算余数语义 → 有限状态必重复 → 轨迹长度为周期 → 互素与乘子条件约束可达性 → 满周期或短周期分类。<\/p>\n<h2>正向推导（逐步推演）：递推结构与周期判定<\/h2>\n<p>递推 <span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span>。每步先算普通整数 <span class=\"katex-inline\">aX_n+c<\/span>，再对 <span class=\"katex-inline\">m<\/span> 取余，余数落在 <span class=\"katex-inline\">[0,m-1]<\/span>。<\/p>\n<p>状态转移是确定映射：同一状态只产生同一后继。状态总数有限，序列走到某一步必然撞到旧状态；从该状态起整段重复，首次回到起点的步数即周期。<\/p>\n<p>满周期条件方向（通行结论）：<\/p>\n<ol><li>\n<span class=\"katex-inline\">\\gcd(c,m)=1<\/span>，增量与模数互素；\n<\/li><li>\n<span class=\"katex-inline\">a-1<\/span> 被 <span class=\"katex-inline\">m<\/span> 的每个素因子整除；\n<\/li><li>\n若 <span class=\"katex-inline\">4\\mid m<\/span>，则 <span class=\"katex-inline\">4\\mid(a-1)<\/span>。\n<\/ol>\n<p>条件分别约束：公因子不得切走状态；乘子对素因子结构保持一致；被 4 整除时二次因子也要覆盖。任一条件偏离，周期短于 <span class=\"katex-inline\">m<\/span>。<\/p>\n<h2>数值算例：满周期小模数序列<\/h2>\n<p>取 <span class=\"katex-inline\">m=16,\\ a=5,\\ c=1,\\ X_0=1<\/span>。逐项：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><span class=\"katex-inline\">n<\/span><\/th><th><span class=\"katex-inline\">X_n<\/span><\/th><th><span class=\"katex-inline\">5X_n+1<\/span><\/th><th><span class=\"katex-inline\">\\bmod16<\/span><\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>1<\/td><td>6<\/td><td>6<\/td><\/tr><tr><td>1<\/td><td>6<\/td><td>31<\/td><td>15<\/td><\/tr><tr><td>2<\/td><td>15<\/td><td>76<\/td><td>12<\/td><\/tr><tr><td>3<\/td><td>12<\/td><td>61<\/td><td>13<\/td><\/tr><tr><td>4<\/td><td>13<\/td><td>66<\/td><td>2<\/td><\/tr><tr><td>5<\/td><td>2<\/td><td>11<\/td><td>11<\/td><\/tr><tr><td>6<\/td><td>11<\/td><td>56<\/td><td>8<\/td><\/tr><tr><td>7<\/td><td>8<\/td><td>41<\/td><td>9<\/td><\/tr><tr><td>8<\/td><td>9<\/td><td>46<\/td><td>14<\/td><\/tr><tr><td>9<\/td><td>14<\/td><td>71<\/td><td>7<\/td><\/tr><tr><td>10<\/td><td>7<\/td><td>36<\/td><td>4<\/td><\/tr><tr><td>11<\/td><td>4<\/td><td>21<\/td><td>5<\/td><\/tr><tr><td>12<\/td><td>5<\/td><td>26<\/td><td>10<\/td><\/tr><tr><td>13<\/td><td>10<\/td><td>51<\/td><td>3<\/td><\/tr><tr><td>14<\/td><td>3<\/td><td>16<\/td><td>0<\/td><\/tr><tr><td>15<\/td><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>16<\/td><td>1<\/td><td>—<\/td><td>回到 <span class=\"katex-inline\">X_0<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>状态 <span class=\"katex-inline\">0,1,\\dots,15<\/span> 各出现一次，周期 <span class=\"katex-inline\">16=m<\/span>。条件核验：<span class=\"katex-inline\">c=1<\/span> 与 16 互素；<span class=\"katex-inline\">a-1=4<\/span> 被素因子 2 整除；<span class=\"katex-inline\">4\\mid16<\/span> 且 <span class=\"katex-inline\">4\\mid4<\/span>。三项满足。<\/p>\n<h2>数值算例：崩溃序列对照<\/h2>\n<p>取 <span class=\"katex-inline\">m=8,\\ a=2,\\ c=0,\\ X_0=1<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">X_1=2\\cdot1+0=2\\bmod8=2<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">X_2=2\\cdot2=4<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">X_3=2\\cdot4=8\\bmod8=0<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">X_4=0<\/span>，此后恒为 0。\n<\/ul>\n<p>第三步后固定在 0，周期 1。状态空间 8 个，实际只走过 <span class=\"katex-inline\">1,2,4,0<\/span> 四个值。<span class=\"katex-inline\">c=0<\/span> 与 <span class=\"katex-inline\">m<\/span> 有公因子约束未排除，乘子 <span class=\"katex-inline\">a=2<\/span> 不提供离开 0 邻域的扰动。<\/p>\n<h2>延伸推演：周期与分布的分工<\/h2>\n<p>周期长只说明状态遍历充分；满周期不保证高维分布合格。<span class=\"katex-inline\">m<\/span> 决定状态空间与取值上限，生成 <span class=\"katex-inline\">[0,1)<\/span> 均匀数还要做归一化 <span class=\"katex-inline\">X_n/m<\/span>。种子 <span class=\"katex-inline\">X_0<\/span> 换值只改起点，参数 <span class=\"katex-inline\">m,a,c<\/span> 换值改整条序列；复现实验要固定参数并记录种子。<\/p>\n<p>其他发生器路线：线性反馈移位寄存器用位移与异或构造，周期结构与高维性质另作分析；LCG 的优势是递推短、实现快，代价是低维易显规则痕迹，需 c10 的检验把关。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong><span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">m<\/span> 不互素<\/strong>：设 <span class=\"katex-inline\">\\gcd(c,m)=d&gt;1<\/span>，各项与 <span class=\"katex-inline\">m<\/span> 的 gcd 被 <span class=\"katex-inline\">d<\/span> 约束，部分状态不可达，周期不可能满。 <strong>同一初值重复运行<\/strong>：确定过程同种子同序列；不换种子，多次采样得到重复结果，独立性不成立。 <strong>把输出长度当周期<\/strong>：输出可以长于周期并重复；周期是闭环长度，不是打印个数。<\/p>\n<h2>对抗性追问：满周期发生器是否就没有结构缺陷<\/h2>\n<p>不能下这个结论。周期是状态遍历性质，分布是统计性质；满周期序列仍可能在二维、三维上落在规则网格上，谱检验会暴露。参数选择先过周期条件，再交检验筛分布，两道关卡分开。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 LCG 递推式，说明 <span class=\"katex-inline\">m,a,c,X_0<\/span> 各是什么。\n<\/li><li>\n为什么有限状态序列必然进入循环？周期怎样定义？\n<\/li><li>\n满周期三个条件方向分别约束什么？\n<\/li><li>\n手算 <span class=\"katex-inline\">m=7,\\ a=3,\\ c=1,\\ X_0=2<\/span> 前 5 项，并观察是否回到 2。\n<\/li><li>\n周期长与分布好为什么是两件事？种子与参数各改变什么？\n<\/ol>\n<h2>延伸推演：模数选择的两类取向<\/h2>\n<p>模数取 2 的幂（如 <span class=\"katex-inline\">2^{32}<\/span>）时，乘法与取余在硬件低位截断上很自然，实现快；低位周期结构较弱，输出低位比特容易显规律。模数取素数时，同余域上乘法逆元存在，数论性质整齐；实现上取余运算代价略高。工程选择在实现速度、低位质量、周期长度之间权衡，两种取向各有适用场景。<\/p>\n<p>乘子选择要避开小步长结构：<span class=\"katex-inline\">a<\/span> 过小，序列在状态间跳跃不足，容易落入短链；<span class=\"katex-inline\">a<\/span> 接近模数时高位扰动过大，低位仍可能规则。增量 <span class=\"katex-inline\">c<\/span> 提供平移量，<span class=\"katex-inline\">c=0<\/span> 时为乘同余形式，周期条件与带增量情形不同，状态可达性分析要单独处理。<\/p>\n<h2>第二算例：<span class=\"katex-inline\">m=7<\/span> 序列观察<\/h2>\n<p>取 <span class=\"katex-inline\">m=7,\\ a=3,\\ c=1,\\ X_0=2<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">X_1=(3\\cdot2+1)\\bmod7=7\\bmod7=0<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">X_2=(3\\cdot0+1)\\bmod7=1<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">X_3=(3\\cdot1+1)\\bmod7=4<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">X_4=(3\\cdot4+1)\\bmod7=13\\bmod7=6<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">X_5=(3\\cdot6+1)\\bmod7=19\\bmod7=5<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">X_6=(3\\cdot5+1)\\bmod7=16\\bmod7=2<\/span>，回到初值。\n<\/ul>\n<p>序列 <span class=\"katex-inline\">2,0,1,4,6,5<\/span>，周期 6，未遍历 7 个状态（缺 3）。对照条件：<span class=\"katex-inline\">c=1<\/span> 与 7 互素；<span class=\"katex-inline\">a-1=2<\/span>，7 的素因子是 7，<span class=\"katex-inline\">2<\/span> 不被 7 整除，满周期条件未满足，周期短于模数，与观察一致。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;周期等于输出个数&quot;。<\/strong> 输出可重复超过周期；周期是闭环长度，打印个数可以任意长。\n<\/li><li>\n<strong>误解二：&quot;模数越大序列越随机&quot;。<\/strong> 大模数只扩大状态空间，乘子增量不当仍会短周期或留结构痕迹；周期与分布是两道关卡。\n<\/li><li>\n<strong>误解三：&quot;换种子就能改变周期&quot;。<\/strong> 种子改起点，周期由参数 <span class=\"katex-inline\">m,a,c<\/span> 决定；同一参数不同种子只改轨迹起点，不改闭环长度。\n<\/li><li>\n<strong>误解四：&quot;LCG 输出可直接当密码学随机数&quot;。<\/strong> LCG 状态可由少量样本反推，不具备不可预测性；密码场景需要专门的随机源与算法。\n<\/ul>\n<h2>边界对照：发生器在全书链条中的位置<\/h2>\n<p>c04 的 gcd 与互素判断是周期条件的数论语言；c01 有限性对应状态有限必然闭环。c10 谱检验与 χ² 检验对本概念输出做分布把关；c11 计数周期内各类状态出现次数时进入求和框架。模运算概念接卷一 §1.2.4 整数函数与初等数论（PDF 第 47 页），发生器完整讨论属卷 2 第 3 章，本卷不展开定理编号对应。<\/p>\n<h2>推演补充：递推的状态转移图<\/h2>\n<p>把每个状态 <span class=\"katex-inline\">x\\in[0,m-1]<\/span> 看成结点，转移 <span class=\"katex-inline\">x\\to(ax+c)\\bmod m<\/span> 画成有向边。确定性转移使每个出度为 1；有限图中轨迹必进入一个环，环上结点周期闭环，环前尾巴为暂态。满周期即环长 <span class=\"katex-inline\">m<\/span>，无暂态；短周期表现为环小、暂态长。<\/p>\n<p>转移图视角下，互素条件决定暂态是否被公因子切断；乘子决定环内跳跃结构。看图判断周期：从初值沿边走，首次回到起点的步数即周期；不必等整段输出打印完。<\/p>\n<h2>第三算例：<span class=\"katex-inline\">c=0<\/span> 乘同余对照<\/h2>\n<p>取 <span class=\"katex-inline\">m=9,\\ a=4,\\ c=0,\\ X_0=1<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">X_1=4,\\ X_2=16\\bmod9=7,\\ X_3=28\\bmod9=1<\/span>，回到 1，周期 3。\n<p>状态空间 9 个，只走 <span class=\"katex-inline\">1,4,7<\/span> 三个；<span class=\"katex-inline\">c=0<\/span> 时序列各项是初值乘 <span class=\"katex-inline\">a<\/span> 的幂模 <span class=\"katex-inline\">m<\/span>，可达集合受乘法子群约束。<\/p>\n<\/ul>\n<p>再取 <span class=\"katex-inline\">m=9,\\ a=4,\\ c=2,\\ X_0=1<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">X_1=6,\\ X_2=26\\bmod9=8,\\ X_3=34\\bmod9=7,\\ X_4=30\\bmod9=3,\\ X_5=14\\bmod9=5,\\ X_6=22\\bmod9=4,\\ X_7=18\\bmod9=0,\\ X_8=2<\/span>，继续追踪可见增量改变了可达结构。参数小幅变动对周期的影响，要按转移图逐点核验，不能凭类比推断。\n<\/ul>\n<h2>推演补充：归一化与输出精度<\/h2>\n<p>发生器输出整数 <span class=\"katex-inline\">X_n\\in[0,m-1]<\/span>，生成 <span class=\"katex-inline\">[0,1)<\/span> 均匀数通常取 <span class=\"katex-inline\">X_n/m<\/span>。模数大则输出粒度细；低位比特质量差时，可取高位比特组合改善统计表现。归一化不改变周期，只改变输出缩放；检验时样本类别划分要与输出区间匹配。<\/p>\n<p>种子管理：同一参数表配多种子用于重复实验对照；调试时固定种子复现序列，正式采样时更换种子。种子本身不作为随机质量的来源，参数结构才是周期与分布的决定因素。<\/p>\n<h2>补充对照：常见退化参数方向<\/h2>\n<p>模数取 2 的幂：低位比特周期短，高位比特质量较好，实际使用常取高位输出。乘数过小：状态跳跃慢，轨迹在狭小邻域内打转。增量为零：可达集合受乘法子群约束，互素条件不再覆盖 <span class=\"katex-inline\">c<\/span>。初值落在暂态段：前若干项不参与闭环，正式采样前先弃头。<\/p>\n<p>参数验收顺序：先核互素与周期长度，再看高位分布与相邻相关性；周期只说明状态不重复，不保证数值均匀，后者归 c10 检验。<\/p>\n<h2>补充算例：周期长度对照<\/h2>\n<p><span class=\"katex-inline\">m=16<\/span> 满周期 16，序列 16 项后才回到初值；<span class=\"katex-inline\">m=8,a=2,c=0<\/span> 周期 1（0 除外），四项内落入固定点。同样整数范围，参数结构不同导致可达状态数相差一个量级。周期计数以回到初值为准，不以数值是否重复为判据；同一数值在不同初值下出现位置不同，需沿转移链逐点追踪。<\/p><\/div><\/details>", "kind": "concept", "title": "线性同余发生器：模数选择与周期"}, "c10": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">线性同余发生器：模数选择与周期<\/a><\/span><\/div><h1>随机数检验：谱检验思想、χ² 统计量与&quot;随机不可证&quot;<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3 章（本卷未收录检验章节，方法按通行统计检验思路讲，不挂本卷页码）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>一个发生器输出一长串数，凭什么说它够&quot;随机&quot;？人眼挑不出规律不等于分布合格。检验需要把模糊感觉换成可计算的统计量：一类看各类别频数是否接近期望，一类看多维状态之间是否残留规则结构。这个概念讲清两类检验各自测什么、统计量怎么算，以及一条方法论边界：检验只能拒绝不合格者，不能证明某序列随机。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>均匀性假设<\/strong>：先假设输出在取值区间上均匀分布，各类别出现概率相等；检验计算观测与该假设的偏离程度。<\/p>\n<p><strong>χ² 统计量<\/strong>：把区间分成 <span class=\"katex-inline\">k<\/span> 个等长类别，生成 <span class=\"katex-inline\">N<\/span> 个数，第 <span class=\"katex-inline\">i<\/span> 类观测频数 <span class=\"katex-inline\">O_i<\/span>，期望频数 <span class=\"katex-inline\">E_i=N/k<\/span>。统计量<\/p>\n<div class=\"katex-block\">\\chi^2=\\sum_{i=1}^{k}\\frac{(O_i-E_i)^2}{E_i}<\/div>\n<p>每一项把偏离平方后除以期望；平方消除正负号，除以 <span class=\"katex-inline\">E_i<\/span> 折算成相对尺度。各类偏离同向累加，总值越大越偏离均匀期望。<\/p>\n<p><strong>谱检验思想<\/strong>：把连续 <span class=\"katex-inline\">r<\/span> 个输出看成 <span class=\"katex-inline\">r<\/span> 维空间中的格点。合格的伪随机序列，高维点集应当铺得均匀；若乘子或模数选择不当，点集会落在少数几条规则超平面上。谱检验考察相邻超平面之间的距离：距离过小，说明序列在高维上可被规则结构预测；距离与分布格局是评判发生器多维质量的依据。<\/p>\n<p><strong>其他常见检验方向<\/strong>：游程检验看连续升降或同类段的长度分布；间距检验看相邻输出差值；扑克牌式分组检验看多位组合的频次。各类检验从不同侧面找规则痕迹。<\/p>\n<h2>原理推演：χ² 从频数到偏离值<\/h2>\n<p>设 <span class=\"katex-inline\">k=4<\/span> 类，<span class=\"katex-inline\">N=400<\/span>，期望每类 <span class=\"katex-inline\">E_i=100<\/span>。若观测为 <span class=\"katex-inline\">O=(120,95,88,97)<\/span>，逐项算：<\/p>\n<ul><li>\n第 1 类：<span class=\"katex-inline\">(120-100)^2/100=400/100=4<\/span>；\n<\/li><li>\n第 2 类：<span class=\"katex-inline\">(95-100)^2/100=25/100=0.25<\/span>；\n<\/li><li>\n第 3 类：<span class=\"katex-inline\">(88-100)^2/100=144/100=1.44<\/span>；\n<\/li><li>\n第 4 类：<span class=\"katex-inline\">(97-100)^2/100=9/100=0.09<\/span>。\n<\/ul>\n<p>总和 <span class=\"katex-inline\">\\chi^2=5.78<\/span>。对照相应自由度的临界分布，判断是否拒绝均匀假设；样本量小或类别数太少时，统计量参照不稳，结论要谨慎。<\/p>\n<p><strong>谱检验的直觉<\/strong>：一维均匀只看落点频次；把相邻两项配对成二维点，规则发生器可能显出斜线、网格等格局。推广到三维、四维，格局越规整越容易被识别。谱距离是对这些超平面疏密的量化：合格发生器在各维上都保持足够间隔。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：样本量足够大，类别划分事先确定；检验针对指定假设（均匀、独立、无长程相关等）。\n<\/li><li>\n失败案例 1：用通过单项检验代替整体合格。χ² 频数合格不代表高维无结构，谱检验、游程检验可能在另一项上拒绝；检验要组合使用。\n<\/li><li>\n失败案例 2：小样本硬套 χ²。类别期望频数过低时，平方偏离被少数极端值主导，统计量参照失真。\n<\/li><li>\n失败案例 3：把检验阈值当成绝对分界。临界值对应显著性水平，落在边缘的结果
