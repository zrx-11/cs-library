需要重复抽样复核，不是一次读数定生死。\n<\/li><li>\n方法论边界：有限样本上的任何检验都只能&quot;尚未拒绝&quot;，不能证明随机。真随机的定义涉及不可预测性与信息论测度，超出有限样本检验的覆盖范围。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>χ² 检验 vs 谱检验<\/strong>：χ² 看一维频数分布，属于边缘分布检验；谱检验看高维点集几何，属于结构检验。两者互补，不互相替代。\n<\/li><li>\n<strong>拒绝假设 vs 证明非随机<\/strong>：统计量过大是拒绝均匀假设的证据，不等同于已找到确定性规律；不拒绝也不等于序列被证明随机。\n<\/li><li>\n<strong>检验合格 vs 周期长<\/strong>：满周期（c09）只说明状态遍历，输出仍可能在高维留下规则痕迹；周期是结构性质，检验是分布评测。\n<\/li><li>\n<strong>均匀性 vs 独立性<\/strong>：每一项边缘均匀，不代表相邻项独立；独立性要靠滞后相关、游程等专门检验。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c09 给出被检验的发生器及其周期；c04 互素概念是参数选择条件的语言。后继：c11 的频数加权求和是分析发生器平均行为的同构方法；c12 母函数可用于构造概率分布的矩估计。检验思想也回流到算法分析：估平均步数时分组统计各类输入占比，再按组内代价加权。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（随机数检验：谱检验思想、χ² 统计量与“随机不可证”）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：随机数检验的逻辑链、χ² 算例与谱检验直觉<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>设计一项随机数检验，先往回追三层：<\/p>\n<ol><li>\n先立假设：输出在取值区间上均匀、各类别等概率；检验计算观测与该假设的偏离。\n<\/li><li>\n选统计量把偏离压成一个数：一维频数用 χ²，多维几何用谱距离，两类分别对应边缘分布与结构痕迹。\n<\/li><li>\n解释结论：统计量大到越过临界值才拒绝假设；不拒绝只是尚未发现偏离，不等于证明随机。\n<\/ol>\n<p>依赖链方向：均匀性假设 → 分类或取点 → 观测频数/格点格局 → 统计量计算 → 对照临界值 → 限定结论为&quot;拒绝/未拒绝&quot;。<\/p>\n<h2>正向推导（逐步推演）：χ² 统计量构造<\/h2>\n<p>把 <span class=\"katex-inline\">[0,1)<\/span> 分 <span class=\"katex-inline\">k<\/span> 类，生成 <span class=\"katex-inline\">N<\/span> 个数，第 <span class=\"katex-inline\">i<\/span> 类观测 <span class=\"katex-inline\">O_i<\/span>，期望 <span class=\"katex-inline\">E_i=N/k<\/span>。<\/p>\n<div class=\"katex-block\">\\chi^2=\\sum_{i=1}^{k}\\frac{(O_i-E_i)^2}{E_i}<\/div>\n<p>每一项三层处理：偏离 <span class=\"katex-inline\">O_i-E_i<\/span> 先平方消除正负号；再除以 <span class=\"katex-inline\">E_i<\/span> 折算相对尺度；各类偏离同向累加。观测完全接近期望时各项趋零，总和趋零；某类明显偏多偏少，对应项抬高。<\/p>\n<h2>数值算例：四类别 χ² 计算<\/h2>\n<p><span class=\"katex-inline\">k=4<\/span>，<span class=\"katex-inline\">N=400<\/span>，<span class=\"katex-inline\">E_i=100<\/span>，观测 <span class=\"katex-inline\">O=(120,95,88,97)<\/span>。<\/p>\n<ul><li>\n第 1 类：<span class=\"katex-inline\">(120-100)^2/100=400/100=4<\/span>；\n<\/li><li>\n第 2 类：<span class=\"katex-inline\">(95-100)^2/100=25/100=0.25<\/span>；\n<\/li><li>\n第 3 类：<span class=\"katex-inline\">(88-100)^2/100=144/100=1.44<\/span>；\n<\/li><li>\n第 4 类：<span class=\"katex-inline\">(97-100)^2/100=9/100=0.09<\/span>。\n<\/ul>\n<p>总和 <span class=\"katex-inline\">\\chi^2=4+0.25+1.44+0.09=5.78<\/span>。对照自由度 <span class=\"katex-inline\">k-1=3<\/span> 的临界分布判断是否拒绝；样本量不足或类别期望过低时，平方偏离被极端值主导，结论不稳。<\/p>\n<p><strong>第二算例：完全均匀<\/strong>。<span class=\"katex-inline\">O=(100,100,100,100)<\/span>，各项为 0，<span class=\"katex-inline\">\\chi^2=0<\/span>，统计量最小。 <strong>第三算例：一类极端<\/strong>。<span class=\"katex-inline\">O=(160,80,80,80)<\/span>：第 1 类 <span class=\"katex-inline\">60^2/100=36<\/span>，其余各 <span class=\"katex-inline\">20^2/100=4<\/span>，总和 <span class=\"katex-inline\">48<\/span>，偏离显著抬高。<\/p>\n<h2>延伸推演：谱检验的高维直觉<\/h2>\n<p>一维均匀只看落点频次。把相邻两项配成二维点，规则发生器可能显出斜线、网格、聚束；推广到三维、四维，格局越规整越易识别。谱检验把高维点集看成格点，考察相邻超平面之间的距离：距离过小，点集被压在少数规则面上，序列可被结构预测；距离与各维分布格局是多维质量依据。<\/p>\n<p>其他检验方向：游程检验看连续升降或同类段长度；间距检验看相邻输出差值；分组组合检验看多位数频次。各项从不同侧面找痕迹，单项合格不代表整体合格。<\/p>\n<h2>方法论边界：为什么随机不可证<\/h2>\n<p>有限样本检验只能否决&quot;均匀/独立&quot;假设。一组数通过 χ²，只说明在这一批频数上没发现偏离；谱检验、游程检验可能在另一项上拒绝。真随机涉及不可预测性与信息论测度，超出有限样本可核验范围。合格发生器的准确表述是&quot;尚未被现有检验否决&quot;，不是&quot;已证明随机&quot;。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>小样本硬套 χ²<\/strong>：类别期望频数过低时，单项平方偏离主导总和，参照分布失真；应先保证样本量与类别划分合理。 <strong>阈值当绝对分界<\/strong>：临界值对应显著性水平，边缘结果需重复抽样复核，一次读数不定生死。 <strong>把拒绝当证明非随机<\/strong>：统计量大是拒绝均匀假设的证据，不等于已找到确定性规律；不拒绝也不构成随机证明。<\/p>\n<h2>对抗性追问：频数均匀是否就相邻独立<\/h2>\n<p>不是。边缘均匀只看每一项落点；相邻项可能存在滞后相关，例如奇数位总偏大、偶数位总偏小，一维频数仍可均匀。独立性要靠滞后相关、游程等专门检验，χ² 覆盖不到这一层。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nχ² 算式中平方、除以 <span class=\"katex-inline\">E_i<\/span> 各起什么作用？\n<\/li><li>\n手算 <span class=\"katex-inline\">k=3,\\ N=300,\\ O=(110,95,95)<\/span> 的 χ² 值。\n<\/li><li>\n谱检验在高维空间里考察什么？相邻超平面距离过小说明什么？\n<\/li><li>\n为什么说检验只能证伪、不能证明随机？\n<\/li><li>\n边缘均匀与相互独立为什么是两个不同假设？\n<\/ol>\n<h2>延伸推演：显著性水平与多重检验<\/h2>\n<p>统计量越过临界值才拒绝假设，临界值对应一个显著性水平：允许多大比例把均匀序列误判为不合格。水平定得严，漏网的不合格发生器变多；定得松，误杀合格发生器变多。单次检验如此，同时跑多项检验时，整体误杀概率随检验项数上升，解释结果要考虑这一背景。<\/p>\n<p>样本量影响结论稳定性：<span class=\"katex-inline\">N<\/span> 很小时，随机波动就能让 χ² 偏大；<span class=\"katex-inline\">N<\/span> 很大时，微小偏离也会被统计量放大并越过临界值。检验报告应同时给出样本量、类别数与统计量，不能只报&quot;通过/不通过&quot;。<\/p>\n<h2>第二算例：游程与间距的直觉<\/h2>\n<p>游程检验把序列按升降或同类切段，统计连续段长度。合格序列的游程长度分布应有疏有密；若游程异常长（一直升或一直降），或异常短（反复横跳），都偏离随机期望。<\/p>\n<p>间距检验看相邻输出差值：均匀随机点的间距应接近指数分布形态；若间距周期性重复，说明发生器在取值轴上留有等间隔痕迹。谱检验看二维以上点集几何，游程与间距看一维序列形态，三类检验互补。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;检验全过就可以宣称随机&quot;。<\/strong> 准确表述是尚未被现有检验否决；未测的检验项、未覆盖的样本段仍可能暴露问题。\n<\/li><li>\n<strong>误解二：&quot;统计量越大越随机&quot;。<\/strong> 统计量大是偏离均匀的信号，应拒绝；接近 0 才是接近期望，方向不要读反。\n<\/li><li>\n<strong>误解三：&quot;一次检验定终身&quot;。<\/strong> 边缘样本需重复抽样复核；临界值附近结果受单次波动影响，不能凭一组读数下结论。\n<\/li><li>\n<strong>误解四：&quot;频数均匀就相邻独立&quot;。<\/strong> 均匀是边缘分布，独立是条件分布关系；滞后相关要专门检验，χ² 不覆盖。\n<\/ul>\n<h2>边界对照：检验方法回流到算法分析<\/h2>\n<p>c09 发生器输出是被检验对象；周期条件（互素、乘子结构）是参数层把关，统计检验是分布层把关。c11 频数加权求和与检验中的分组计数同构：估平均代价时按输入类别分组，统计各类占比再加权组内代价。概率母函数（c12）可用于计算分布矩与检验统计量的理论期望。<\/p>\n<h2>推演补充：检验设计的一般流程<\/h2>\n<p>一项检验落地分四步：立假设（均匀、独立或无长程相关）；选统计量把偏离压成一个数；定临界值对应显著性水平；跑样本算统计量并对照结论。报告时附样本量、类别数、统计量与参照分布，单给&quot;通过/拒绝&quot;不足以复核。<\/p>\n<p>检验之间分工明确：边缘分布看频数，高维结构看谱，相邻关系看游程与滞后相关，组合规律看分组频次。单项合格只覆盖该侧面；发生器验收通常组合多项检验，再看不同种子、不同样本段的一致性。<\/p>\n<h2>第三算例：χ² 边界情形<\/h2>\n<p><span class=\"katex-inline\">k=2,\\ N=20,\\ O=(14,6)<\/span>，<span class=\"katex-inline\">E=10<\/span>：<\/p>\n<ul><li>\n第一项 <span class=\"katex-inline\">(14-10)^2/10=1.6<\/span>；\n<\/li><li>\n第二项 <span class=\"katex-inline\">(6-10)^2/10=1.6<\/span>；\n<\/li><li>\n总和 <span class=\"katex-inline\">3.2<\/span>。\n<\/ul>\n<p><span class=\"katex-inline\">N=200,\\ O=(140,60)<\/span>，<span class=\"katex-inline\">E=100<\/span>：<\/p>\n<ul><li>\n第一项 <span class=\"katex-inline\">1600/100=16<\/span>；\n<\/li><li>\n第二项 <span class=\"katex-inline\">1600/100=16<\/span>；\n<\/li><li>\n总和 <span class=\"katex-inline\">32<\/span>。\n<\/ul>\n<p>比例相同（7:3），大样本统计量显著抬高：样本越大，微小偏离越容易被放大到临界值之外。解释大样本结果时，统计量越过临界不等于实际偏离有工程意义；解释小样本时，统计量偏小也可能只是样本不足。<\/p>\n<h2>推演补充：不可证伪性的逻辑位置<\/h2>\n<p>&quot;序列随机&quot;若定义为不可预测、信息不可压缩，涉及对无穷序列性质的判断；有限样本只能观察有限前缀，无法穷尽后续可能。检验能做的是：若存在可识别的规则痕迹，统计量上反映出来；未发现痕迹，只能说明当前样本与假设不冲突。<\/p>\n<p>这一立场与算法正确性证明对照：算法正确性可由前提公理演绎证明；随机性质不能靠有限归纳建立。两类结论的证据标准不同，混淆两者会把&quot;检验通过&quot;误写成&quot;证明随机&quot;。<\/p>\n<h2>补充对照：常用检验侧面<\/h2>\n<p>游程检验：序列升降段长度分布是否与随机序列一致，抓相邻趋势粘连。间隔检验：同一类别两次出现之间的间隔长度分布，抓长时间重复。自相关检验：<span class=\"katex-inline\">X_n<\/span> 与滞后 <span class=\"katex-inline\">k<\/span> 项 <span class=\"katex-inline\">X_{n+k}<\/span> 的相关程度，抓长程依赖。排列检验：相邻若干项组成的元组在所有可能排列上的分布，抓局部组合规律。<\/p>\n<p>各侧面对应不同故障模式：周期过短在频数检验已显形；高维网格聚集在谱检验暴露；相邻趋势粘连在游程检验暴露。组合多项检验的结论比单项覆盖面广，也更耗样本量。<\/p>\n<h2>补充算例：谱检验直觉对照<\/h2>\n<p>二维情形把相邻两数 <span class=\"katex-inline\">(X_n/m, X_{n+1}/m)<\/span> 画到单位正方形上。合格序列点子散布全域；坏参数的点排成几条平行直线或网格，点之间留出规则空白。谱检验把这些点阵的间距量成一个最小网格距离量，距离过小提示高维结构聚集。<\/p>\n<p><span class=\"katex-inline\">k<\/span> 维推广到相邻 <span class=\"katex-inline\">k<\/span> 元组在 <span class=\"katex-inline\">[0,1)^k<\/span> 中的格点分布；维度越高所需样本越大，检验越难在短样本上出结论。谱检验结论是对高维均匀性的侧面判断，不替代频数与游程检验。<\/p>\n<h2>补充边界：样本量与类别数约束<\/h2>\n<p>χ² 分组时每类期望计数不宜过小，个别期望项偏低会让统计量不稳；类别划得过细，单项期望不足，划得过粗则掩盖局部偏离。临界值参照自由度 <span class=\"katex-inline\">k-1<\/span> 的 χ² 分布，自由度由类别数减一得到，不由样本量决定。<\/p>\n<p>检验失败后的处理：先排除实现错误（取模、缩放、样本截断），再调参数或换发生器；重复同一坏样本只加强已见结论，不能靠重跑翻案。<\/p><\/div><\/details>", "kind": "concept", "title": "随机数检验：谱检验思想、χ² 统计量与“随机不可证”"}, "c11": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.76<\/div><h1>调和数与求和的渐进估计<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书 §1.2.7、§1.2.11）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>算法分析里反复出现形如 <span class=\"katex-inline\">\\sum_{k=1}^{n}1/k<\/span> 的求和：交换元素计数、概率倒数、递归摊还都可能落到调和数。逐项算到 <span class=\"katex-inline\">n<\/span> 既慢又看不出量级；需要一组工具，把有限和压成带常数项与误差阶的近似式。这个概念定义调和数，给出下界分组与积分比较两条路径，并说明渐进式各项的位置。书里 §1.2.7 专门讨论调和数（PDF 第 76 页）。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>调和数定义<\/strong>：<\/p>\n<div class=\"katex-block\">H_n=1+\\frac12+\\frac13+\\cdots+\\frac1n=\\sum_{k=1}^{n}\\frac1k,\\quad n\\ge0<\/div>\n<p><span class=\"katex-inline\">H_0=0<\/span>，<span class=\"katex-inline\">H_1=1<\/span>。字母 <span class=\"katex-inline\">H<\/span> 代表 harmonic（调和），<span class=\"katex-inline\">H_n<\/span> 习惯上称调和级数的第 <span class=\"katex-inline\">n<\/span> 项部分和（PDF 第 76 页）。<\/p>\n<p><strong>下界分组<\/strong>：按二的幂分段，第 <span class=\"katex-inline\">t<\/span> 段有 <span class=\"katex-inline\">2^{t-1}<\/span> 项，每项 <span class=\"katex-inline\">\\ge 1/2^t<\/span>，段和 <span class=\"katex-inline\">\\ge 1/2<\/span>；由此 <span class=\"katex-inline\">H_{2^m}\\ge 1+m/2<\/span>。<\/p>\n<p><strong>积分比较上界<\/strong>：对递减函数 <span class=\"katex-inline\">1/x<\/span>，<span class=\"katex-inline\">1/k\\le\\int_{k-1}^{k}dx/x<\/span>（<span class=\"katex-inline\">k\\ge2<\/span>），求和得 <span class=\"katex-inline\">H_n\\le1+\\ln n<\/span>。<\/p>\n<p><strong>精细渐进式<\/strong>（PDF 第 76 页）：<\/p>\n<div class=\"katex-block\">H_n=\\ln n+\\gamma+\\frac{1}{2n}-\\frac{1}{12n^2}+\\frac{1}{120n^4}-\\epsilon,\\quad 0<\\epsilon<\\frac{1}{252n^6}<\/div>\n<p>其中 <span class=\"katex-inline\">\\gamma=0.5772156649\\ldots<\/span> 为欧拉常数，由欧拉提出。去掉高阶修正后常用 <span class=\"katex-inline\">H_n=\\ln n+\\gamma+O(1/n)<\/span>。<\/p>\n<p><strong>对照级数<\/strong>：<span class=\"katex-inline\">\\sum 1/k^r<\/span> 在 <span class=\"katex-inline\">r&gt;1<\/span> 时收敛，<span class=\"katex-inline\">H_n^{(r)}<\/span> 记这类广义调和数；<span class=\"katex-inline\">r=2<\/span> 时和趋近黎曼 <span class=\"katex-inline\">\\zeta(2)<\/span>，与 <span class=\"katex-inline\">r=1<\/span> 的发散形成对照（PDF 第 76 页）。<\/p>\n<h2>原理推演：从分组到积分再到常数项<\/h2>\n<p>第一步分组看发散性：<span class=\"katex-inline\">H_{2^m}<\/span> 每翻倍至少再加 <span class=\"katex-inline\">1/2<\/span>，<span class=\"katex-inline\">m<\/span> 增大时下界线性增长，调和数不收敛。<\/p>\n<p>第二步积分估主项：<span class=\"katex-inline\">1/x<\/span> 在区间 <span class=\"katex-inline\">[k-1,k]<\/span> 上 <span class=\"katex-inline\">\\ge1/k<\/span>，所以<\/p>\n<div class=\"katex-block\">H_n=1+\\sum_{k=2}^{n}\\frac1k\\le1+\\int_{1}^{n}\\frac{dx}{x}=1+\\ln n<\/div>\n<p>结合下界 <span class=\"katex-inline\">H_{2^m}\\ge1+m/2<\/span>（<span class=\"katex-inline\">n=2^m<\/span> 时 <span class=\"katex-inline\">m=\\log_2 n<\/span>），<span class=\"katex-inline\">H_n<\/span> 量级确定为 <span class=\"katex-inline\">\\ln n<\/span>。<\/p>\n<p>第三步补常数与修正：积分比较只给主项，欧拉-麦克劳林方向在主项之后补出 <span class=\"katex-inline\">1/(2n)<\/span>、<span class=\"katex-inline\">-1/(12n^2)<\/span> 等修正项，<span class=\"katex-inline\">\\gamma<\/span> 是积分近似与真实和之间的恒定差。<span class=\"katex-inline\">\\gamma<\/span> 是独立于 <span class=\"katex-inline\">n<\/span> 的常数，不能并入 <span class=\"katex-inline\">1/n<\/span> 阶误差。<\/p>\n<p><strong>数值对照<\/strong>：<span class=\"katex-inline\">H_{10}=7381/2520\\approx2.9290<\/span>（书里给出该分数值，PDF 第 76 页）；<span class=\"katex-inline\">\\ln10+\\gamma\\approx2.302585+0.577216=2.879801<\/span>，差约 <span class=\"katex-inline\">0.0492<\/span>，<span class=\"katex-inline\">1/(2n)=0.05<\/span> 正好对上修正量级。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：求和项为 <span class=\"katex-inline\">1/k<\/span> 型正项；估量级用积分比较，估常数项用渐进展开。\n<\/li><li>\n失败案例 1：把 <span class=\"katex-inline\">H_n<\/span> 当有界量。<span class=\"katex-inline\">H_n<\/span> 发散只是增长慢；误以为调和数收敛会低估涉及倒数计数的算法代价。\n<\/li><li>\n失败案例 2：只记 <span class=\"katex-inline\">\\ln n<\/span> 丢掉 <span class=\"katex-inline\">\\gamma<\/span>。比较两个含 <span class=\"katex-inline\">H_n<\/span> 的精确式时常数项影响低阶判断；<span class=\"katex-inline\">H_n-\\ln n<\/span> 趋近 <span class=\"katex-inline\">\\gamma<\/span>，不是趋近 0。\n<\/li><li>\n边界：渐进式在 <span class=\"katex-inline\">n<\/span> 大时精度高；小 <span class=\"katex-inline\">n<\/span> 应直接算精确和。<span class=\"katex-inline\">O(1/n)<\/span> 写法省略了修正结构，需要误差界时回到完整展开。\n<\/li><li>\n推广：调和数出现在快速排序期望比较次数、优惠券收集问题、递归递推求解中，不是孤立的数列习题。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>调和数 vs 自然对数<\/strong>：<span class=\"katex-inline\">\\ln n<\/span> 是积分主项，<span class=\"katex-inline\">H_n<\/span> 比它多 <span class=\"katex-inline\">\\gamma<\/span> 及小修正；两者渐近同阶，但不能互换。\n<\/li><li>\n<strong><span class=\"katex-inline\">H_n<\/span> vs <span class=\"katex-inline\">n<\/span><\/strong>：线性增长为 <span class=\"katex-inline\">O(n)<\/span>，调和增长为 <span class=\"katex-inline\">O(\\log n)<\/span>；差一个对数阶，在复杂度排序上属于不同量级。\n<\/li><li>\n<strong>下界分组 vs 上界积分<\/strong>：分组证明发散，积分估计主项；两条路径回答不同侧面，组合才夹住量级。\n<\/li><li>\n<strong>欧拉常数 vs 自然对数底 <span class=\"katex-inline\">e<\/span><\/strong>：<span class=\"katex-inline\">\\gamma<\/span> 是和与积分的差，<span class=\"katex-inline\">e<\/span> 是指数底；两者名字都带&quot;自然&quot;，数值与来源无关。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c03 归纳法可核验调和数递推 <span class=\"katex-inline\">H_n=H_{n-1}+1/n<\/span>；c01 可行性保证逐项计算是基本动作。后继：c12 生成函数求解递推时，系数提取常涉及调和数闭式；第 4 章大 O 记号把 <span class=\"katex-inline\">H_n=\\ln n+\\gamma+O(1/n)<\/span> 压成 <span class=\"katex-inline\">O(\\log n)<\/span> 上界。排序与递归算法分析直接引用本概念的量级结论。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（调和数与求和的渐进估计）<\/summary><div class=\"depth-body\"><h1>c11 深度推导：调和数的求和链、分组与积分估计、数值对照<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>估计 <span class=\"katex-inline\">H_n<\/span> 的量级，先往回追三层：<\/p>\n<ol><li>\n求和对象是正项 <span class=\"katex-inline\">1/k<\/span>，逐项递减；正项和可用分组与积分比较两条路径夹逼。\n<\/li><li>\n下界要证明发散：按二的幂分组，每组贡献有固定下限。\n<\/li><li>\n上界要估主项：递减函数积分给出对数主项；常数项与高阶修正由欧拉-麦克劳林方向补出。\n<\/ol>\n<p>依赖链方向：定义 <span class=\"katex-inline\">H_n=\\sum1/k<\/span> → 分组得下界 <span class=\"katex-inline\">H_{2^m}\\ge1+m/2<\/span> → 积分比较得上界 <span class=\"katex-inline\">1+\\ln n<\/span> → 夹住 <span class=\"katex-inline\">\\ln n<\/span> 量级 → 补 <span class=\"katex-inline\">\\gamma<\/span> 与 <span class=\"katex-inline\">1/(2n)<\/span> 等修正。<\/p>\n<h2>正向推导：分组下界<\/h2>\n<p>把 <span class=\"katex-inline\">H_{2^m}<\/span> 分段：<\/p>\n<div class=\"katex-block\">H_{2^m}=1+\\sum_{j=2}^{2^m}\\frac1j<\/div>\n<p>第 <span class=\"katex-inline\">t<\/span> 段覆盖 <span class=\"katex-inline\">2^{t-1}&lt;j\\le2^t<\/span>，共 <span class=\"katex-inline\">2^{t-1}<\/span> 项，每项 <span class=\"katex-inline\">\\ge1/2^t<\/span>，段和 <span class=\"katex-inline\">\\ge2^{t-1}/2^t=1/2<\/span>。<span class=\"katex-inline\">m<\/span> 段合计 <span class=\"katex-inline\">\\ge m/2<\/span>，加首项 1：<\/p>\n<div class=\"katex-block\">H_{2^m}\\ge1+\\frac m2<\/div>\n<p><span class=\"katex-inline\">m<\/span> 增大时下界线性增长，调和级数不收敛。<\/p>\n<h2>正向推导：积分上界<\/h2>\n<p>对递减函数 <span class=\"katex-inline\">1/x<\/span>，区间 <span class=\"katex-inline\">[k-1,k]<\/span> 上 <span class=\"katex-inline\">1/x\\le1/(k-1)<\/span>（<span class=\"katex-inline\">k\\ge2<\/span>），于是<\/p>\n<div class=\"katex-block\">H_n=1+\\sum_{k=2}^{n}\\frac1k\\le1+\\sum_{k=2}^{n}\\int_{k-1}^{k}\\frac{dx}{x}=1+\\int_{1}^{n}\\frac{dx}{x}=1+\\ln n<\/div>\n<p>夹逼：<span class=\"katex-inline\">n=2^m<\/span> 时下界 <span class=\"katex-inline\">1+m/2=1+(\\log_2 n)/2<\/span>，上界 <span class=\"katex-inline\">1+\\ln n<\/span>，两侧同阶于 <span class=\"katex-inline\">\\ln n<\/span>，<span class=\"katex-inline\">H_n<\/span> 主项确定为 <span class=\"katex-inline\">\\ln n<\/span>。<\/p>\n<h2>数值算例：小 <span class=\"katex-inline\">n<\/span> 精确值与渐进对照<\/h2>\n<p><strong>算例 1<\/strong>：<span class=\"katex-inline\">H_{10}=7381/2520\\approx2.9290<\/span>（书里给出分数值，PDF 第 76 页）。<\/p>\n<ul><li>\n<span class=\"katex-inline\">\\ln10\\approx2.302585<\/span>，<span class=\"katex-inline\">\\gamma\\approx0.577216<\/span>，<span class=\"katex-inline\">\\ln10+\\gamma\\approx2.879801<\/span>；\n<\/li><li>\n差值 <span class=\"katex-inline\">2.9290-2.8798\\approx0.0492<\/span>；\n<\/li><li>\n修正项 <span class=\"katex-inline\">1/(2n)=1/20=0.05<\/span>，与差值同阶，方向吻合。\n<\/ul>\n<p><strong>算例 2<\/strong>：<span class=\"katex-inline\">H_{1000}<\/span> 估计。<span class=\"katex-inline\">\\ln1000\\approx6.907755<\/span>，加 <span class=\"katex-inline\">\\gamma<\/span> 得 <span class=\"katex-inline\">7.484971<\/span>，再加 <span class=\"katex-inline\">1/(2\\cdot1000)=0.0005<\/span>，估计值约 <span class=\"katex-inline\">7.4855<\/span>；高阶修正 <span class=\"katex-inline\">-1/(12n^2)<\/span> 量级 <span class=\"katex-inline\">8.3\\times10^{-8}<\/span>，可忽略。<\/p>\n<p><strong>算例 3<\/strong>：对照收敛级数。<span class=\"katex-inline\">1+1/2^2+\\cdots+1/n^2<\/span> 随 <span class=\"katex-inline\">n<\/span> 增大趋近 <span class=\"katex-inline\">\\zeta(2)\\approx1.6449<\/span>；<span class=\"katex-inline\">H_n<\/span> 却按 <span class=\"katex-inline\">\\ln n<\/span> 缓增。同为倒数幂，<span class=\"katex-inline\">r=1<\/span> 发散、<span class=\"katex-inline\">r&gt;1<\/span> 收敛，分界在指数 1。<\/p>\n<h2>延伸推演：渐进式各项位置<\/h2>\n<p>完整展开（PDF 第 76 页）：<\/p>\n<div class=\"katex-block\">H_n=\\ln n+\\gamma+\\frac{1}{2n}-\\frac{1}{12n^2}+\\frac{1}{120n^4}-\\epsilon,\\quad 0<\\epsilon<\\frac{1}{252n^6}<\/div>\n<p><span class=\"katex-inline\">\\gamma=0.5772156649\\ldots<\/span> 是欧拉常数，即积分近似与真实和之间的恒定差。常用简写 <span class=\"katex-inline\">H_n=\\ln n+\\gamma+O(1/n)<\/span>；只估量级时压成 <span class=\"katex-inline\">O(\\log n)<\/span>。<\/p>\n<p>递推方向：<span class=\"katex-inline\">H_n=H_{n-1}+1/n<\/span>，归纳法可核验任意有限项；母函数方向见 c12，调和数常作为系数出现在计数母函数中。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>把 <span class=\"katex-inline\">H_n<\/span> 当有界量<\/strong>：误判收敛会低估涉及倒数计数的算法代价；分组下界已证明它随 <span class=\"katex-inline\">m<\/span> 线性增长。 <strong>丢掉常数 <span class=\"katex-inline\">\\gamma<\/span><\/strong>：比较两个含 <span class=\"katex-inline\">H_n<\/span> 的精确式时，<span class=\"katex-inline\">H_n-\\ln n\\to\\gamma<\/span>，不是趋于 0；只记 <span class=\"katex-inline\">\\ln n<\/span> 会在低阶判断上出错。 <strong>小 <span class=\"katex-inline\">n<\/span> 套渐进<\/strong>：渐进式在 <span class=\"katex-inline\">n<\/span> 大时精度高；<span class=\"katex-inline\">n=1,2<\/span> 应直接算精确和，不用展开式估。<\/p>\n<h2>对抗性追问：<span class=\"katex-inline\">H_n<\/span> 增长慢是否就是常数阶<\/h2>\n<p>不是。慢增长不等于有界：<span class=\"katex-inline\">H_n<\/span> 越过任意给定常数只需 <span class=\"katex-inline\">n<\/span> 足够大，量级为 <span class=\"katex-inline\">\\ln n<\/span>，与常数阶有本质区别。复杂度排序中 <span class=\"katex-inline\">O(\\log n)<\/span> 低于 <span class=\"katex-inline\">O(n)<\/span>，但高于 <span class=\"katex-inline\">O(1)<\/span>。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">H_n<\/span> 定义与递推关系。\n<\/li><li>\n分组法怎样得到 <span class=\"katex-inline\">H_{2^m}\\ge1+m/2<\/span>？每段下限为什么是 <span class=\"katex-inline\">1/2<\/span>？\n<\/li><li>\n积分比较给出的上界是什么？怎样夹住 <span class=\"katex-inline\">H_n<\/span> 的主项？\n<\/li><li>\n<span class=\"katex-inline\">\\gamma<\/span> 是什么常数？<span class=\"katex-inline\">H_n=\\ln n+\\gamma+O(1/n)<\/span> 省略了哪些修正项？\n<\/li><li>\n为什么 <span class=\"katex-inline\">r=1<\/span> 的倒数级数发散而 <span class=\"katex-inline\">r=2<\/span> 收敛？\n<\/ol>\n<h2>延伸推演：调和数在摊还与递归中的出现<\/h2>\n<p>快速排序期望比较次数中，划分后两侧子问题的合并贡献产生调和数结构；优惠券收集问题收集齐 <span class=\"katex-inline\">n<\/span> 类券的期望次数为 <span class=\"katex-inline\">nH_n<\/span>；递归树逐层累加倒数项，总量常落到 <span class=\"katex-inline\">H_n<\/span> 量级。识别这些场景的信号：求和项形如 <span class=\"katex-inline\">1/k<\/span>，或每轮把规模折半、各层贡献同阶。<\/p>\n<p>摊还分析里另一类常见和是 <span class=\"katex-inline\">\\sum k<\/span> 与 <span class=\"katex-inline\">\\sum k^2<\/span>，对应二次、三次主项；调和数专门对应倒数项。区分求和式的幂次，才能判断量级是对数、线性还是多项式阶。<\/p>\n<h2>第二算例：小 <span class=\"katex-inline\">n<\/span> 调和数表<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th><span class=\"katex-inline\">n<\/span><\/th><th><span class=\"katex-inline\">H_n<\/span> 精确值方向<\/th><th>近似 <span class=\"katex-inline\">\\ln n+\\gamma<\/span><\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>1<\/td><td>0.5772<\/td><\/tr><tr><td>2<\/td><td>1.5<\/td><td>1.2703<\/td><\/tr><tr><td>3<\/td><td>1.8333<\/td><td>1.6758<\/td><\/tr><tr><td>4<\/td><td>2.0833<\/td><td>1.9635<\/td><\/tr><tr><td>5<\/td><td>2.2833<\/td><td>2.1993<\/td><\/tr><tr><td>10<\/td><td>2.92897<\/td><td>2.8798<\/td><\/tr><\/tbody><\/table><\/div>\n<p><span class=\"katex-inline\">n<\/span> 越小，<span class=\"katex-inline\">1/(2n)<\/span> 修正占比越大；<span class=\"katex-inline\">n=1<\/span> 时近似值 0.577 与精确值 1 差 0.423，不能用展开式估小项。<span class=\"katex-inline\">n=10<\/span> 时差 0.049，与 <span class=\"katex-inline\">1/(2n)=0.05<\/span> 同阶，验证修正项方向。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;<span class=\"katex-inline\">H_n<\/span> 增长慢所以是常数阶&quot;。<\/strong> 慢增长不等于有界；<span class=\"katex-inline\">H_n<\/span> 越过任意大常数只需 <span class=\"katex-inline\">n<\/span> 足够大，量级 <span class=\"katex-inline\">\\ln n<\/span>，高于 <span class=\"katex-inline\">O(1)<\/span>。\n<\/li><li>\n<strong>误解二：&quot;<span class=\"katex-inline\">\\gamma<\/span> 可以并入 <span class=\"katex-inline\">O(1/n)<\/span>&quot;。<\/strong> <span class=\"katex-inline\">\\gamma<\/span> 是不随 <span class=\"katex-inline\">n<\/span> 变的常数，<span class=\"katex-inline\">1/(2n)<\/span> 随 <span class=\"katex-inline\">n<\/span> 趋于 0，两者阶不同；写 <span class=\"katex-inline\">H_n-\\ln n<\/span> 时极限是 <span class=\"katex-inline\">\\gamma<\/span>，不是 0。\n<\/li><li>\n<strong>误解三：&quot;调和级数与 <span class=\"katex-inline\">p<\/span> 级数都发散&quot;。<\/strong> 分界在 <span class=\"katex-inline\">p=1<\/span>：<span class=\"katex-inline\">p&gt;1<\/span> 收敛，<span class=\"katex-inline\">p=1<\/span> 发散，<span class=\"katex-inline\">p&lt;1<\/span> 发散更快。\n<\/li><li>\n<strong>误解四：&quot;渐进式对所有 <span class=\"katex-inline\">n<\/span> 成立&quot;。<\/strong> 渐进描述 <span class=\"katex-inline\">n<\/span> 大时的行为；小 <span class=\"katex-inline\">n<\/span> 直接算精确和，展开式误差界也随 <span class=\"katex-inline\">n<\/span> 增大才收紧。\n<\/ul>\n<h2>边界对照：调和数与全书分析链条<\/h2>\n<p>c03 归纳法核验 <span class=\"katex-inline\">H_n=H_{n-1}+1/n<\/span> 的任意有限项；c12 母函数系数常带调和数闭式；c04 欧几里得步数是对数阶，与 <span class=\"katex-inline\">H_n<\/span> 的对数阶并列参照。大 O 记号（§1.2.11.1，PDF 第 102 页）把 <span class=\"katex-inline\">H_n<\/span> 压成 <span class=\"katex-inline\">O(\\log n)<\/span> 上界；后续排序、递归、概率算法分析直接引用本概念的量级与常数项结论。<\/p>\n<h2>推演补充：求和阶的识别顺序<\/h2>\n<p>面对一个有限和，先看通项幂次：<span class=\"katex-inline\">\\sum k^p<\/span> 主项 <span class=\"katex-inline\">O(n^{p+1})<\/span>；<span class=\"katex-inline\">\\sum 1/k<\/span> 主项 <span class=\"katex-inline\">O(\\ln n)<\/span>；<span class=\"katex-inline\">\\sum r^k<\/span>（<span class=\"katex-inline\">r&gt;1<\/span>）主项 <span class=\"katex-inline\">O(r^n)<\/span>；<span class=\"katex-inline\">\\sum 1/k^p<\/span>（<span class=\"katex-inline\">p&gt;1<\/span>）收敛有界。识别通项类型后再选估计工具：多项式求和用公式或积分，倒数和用分组加积分，几何和用闭式。<\/p>\n<p>同一和式换元常落到已知类型：<span class=\"katex-inline\">\\sum_{k=1}^{n}\\lfloor\\log_b k\\rfloor<\/span> 按对数段分组，段内项数乘段值；<span class=\"katex-inline\">\\sum 1/\\sqrt{k}<\/span> 介于 <span class=\"katex-inline\">1/k<\/span> 与 <span class=\"katex-inline\">1<\/span> 之间，积分比较得 <span class=\"katex-inline\">O(\\sqrt n)<\/span>。工具选择由通项决定，不套固定模板。<\/p>\n<h2>第三算例：<span class=\"katex-inline\">H_n<\/span> 递推与数值对照<\/h2>\n<p>递推 <span class=\"katex-inline\">H_1=1,\\ H_n=H_{n-1}+1/n<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">H_1=1<\/span>\n<\/li><li>\n<span class=\"katex-inline\">H_2=1+1/2=1.5<\/span>\n<\/li><li>\n<span class=\"katex-inline\">H_3=1.5+1/3\\approx1.8333<\/span>\n<\/li><li>\n<span class=\"katex-inline\">H_4\\approx2.0833<\/span>\n<\/li><li>\n<span class=\"katex-inline\">H_5\\approx2.2833<\/span>\n<\/li><li>\n<span class=\"katex-inline\">H_{10}\\approx2.92897<\/span>\n<\/ul>\n<p>渐进式 <span class=\"katex-inline\">H_n\\approx\\ln n+\\gamma+1/(2n)<\/span>：<span class=\"katex-inline\">n=1000<\/span> 时 <span class=\"katex-inline\">\\ln1000\\approx6.9078<\/span>，<span class=\"katex-inline\">\\gamma\\approx0.5772<\/span>，加 <span class=\"katex-inline\">0.0005<\/span>，估计约 <span class=\"katex-inline\">7.4855<\/span>；与精确和差在 <span class=\"katex-inline\">10^{-6}<\/span> 量级。<span class=\"katex-inline\">n=2<\/span> 时近似 <span class=\"katex-inline\">\\ln2+\\gamma+1/4\\approx1.2703+0.25=1.5203<\/span>，精确 1.5，修正项方向正确但小 <span class=\"katex-inline\">n<\/span> 偏差明显。<\/p>\n<h2>推演补充：欧拉常数的位置<\/h2>\n<p><span class=\"katex-inline\">\\gamma=\\lim_{n\\to\\infty}(H_n-\\ln n)<\/span>，是积分近似与离散和之间的恒定差。它独立于 <span class=\"katex-inline\">n<\/span>，不能随 <span class=\"katex-inline\">n<\/span> 增大消失；与自然对数底 <span class=\"katex-inline\">e<\/span> 来源不同：<span class=\"katex-inline\">e<\/span> 是指数极限，<span class=\"katex-inline\">\\gamma<\/span> 是和与积分的差。<span class=\"katex-inline\">\\gamma<\/span> 无简洁闭式，数值 <span class=\"katex-inline\">0.5772156649\\ldots<\/span>，书里附录 A 给小 <span class=\"katex-inline\">n<\/span> 精确值与 <span class=\"katex-inline\">\\gamma<\/span> 高精度数值（PDF 第 76 页）。<\/p>\n<p>写渐进估计时，主项 <span class=\"katex-inline\">\\ln n<\/span>、常数项 <span class=\"katex-inline\">\\gamma<\/span>、<span class=\"katex-inline\">1/n<\/span> 阶修正各占一层；比较两个含 <span class=\"katex-inline\">H_n<\/span> 的式子，常数项差异在低阶判断中不能省略，只压主项时才统一写成 <span class=\"katex-inline\">O(\\log n)<\/span>。<\/p>\n<h2>补充对照：常见调和型求和式<\/h2>\n<p><span class=\"katex-inline\">H_n/2<\/span> 对应 <span class=\"katex-inline\">\\sum 1/(2k)<\/span>；<span class=\"katex-inline\">\\sum_{k=1}^n 1/(2k-1)=H_{2n}-\\frac12 H_n<\/span>；<span class=\"katex-inline\">\\sum_{k=1}^n H_k=(n+1)H_n-n<\/span>（交换求和次序可得）。这些式子在递归分析里直接出现：递归每层做一次扫描，累计代价常落到调和数组合。<\/p>\n<p>识别调和型求和先把通项拆成 <span class=\"katex-inline\">1/k<\/span> 倍数与分段，再套已知恒等式；不要把含 <span class=\"katex-inline\">1/k<\/span> 的和与多项式和混估成同一量级。<\/p>\n<h2>补充算例：分组比较上界<\/h2>\n<p>把 <span class=\"katex-inline\">1/k<\/span> 按指数段分组：<span class=\"katex-inline\">k=1<\/span>；<span class=\"katex-inline\">k=2,3<\/span>；<span class=\"katex-inline\">k=4,\\dots,7<\/span>；<span class=\"katex-inline\">k=8,\\dots,15<\/span>；第 <span class=\"katex-inline\">j<\/span> 段 <span class=\"katex-inline\">k\\in[2^j,2^{j+1}-1]<\/span>，段内每项 <span class=\"katex-inline\">\\le1/2^j<\/span>，段长 <span class=\"katex-inline\">2^j<\/span>，段和 <span class=\"katex-inline\">\\le1<\/span>。第 <span class=\"katex-inline\">j<\/span> 段贡献上界 1，到 <span class=\"katex-inline\">n<\/span> 所在段共 <span class=\"katex-inline\">\\lfloor\\log_2 n\\rfloor+1<\/span> 段，得 <span class=\"katex-inline\">H_n\\le\\lfloor\\log_2 n\\rfloor+1<\/span>，量级 <span class=\"katex-inline\">\\log n<\/span>。下界用相邻段每项 <span class=\"katex-inline\">\\ge1/(2^{j+1})<\/span>，段和 <span class=\"katex-inline\">\\ge1/2<\/span>，同法得 <span class=\"katex-inline\">\\Omega(\\log n)<\/span>。积分近似给出常数项精度，分组比较只锁定量级。<\/p><\/div><\/details>", "kind": "concept", "title": "调和数与求和的渐进估计"}, "c12": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.86<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">调和数与求和的渐进估计<\/a><\/span><\/div><h1>生成函数入门：把递推变成母函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章（原书 §1.2.9）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>数列按递推定义时，逐项展开只能看到相邻两项关系；要闭合计数式、求通项或研究整列数的性质，需要一个能把整列数装在一起的对象。生成函数（母函数）用一个幂级数承载数列：递推对所有 <span class=\"katex-inline\">n<\/span> 成立，转化为母函数满足的代数方程；解方程后再取 <span class=\"katex-inline\">z^n<\/span> 系数，就回到数列项。书里 §1.2.9 给出这一工具的基本运算（PDF 第 86 页）。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>生成函数<\/strong>：对数列 <span class=\"katex-inline\">\\langle a_n\\rangle=a_0,a_1,a_2,\\dots<\/span>，建立以参数 <span class=\"katex-inline\">z<\/span> 表示的无限和<\/p>\n<div class=\"katex-block\">G(z)=a_0+a_1z+a_2z^2+\\cdots=\\sum_{n\\ge0}a_n z^n<\/div>\n<p>函数 <span class=\"katex-inline\">G<\/span> 用一个量表示了整个数列；若数列递归定义，母函数是利用递推条件的有力工具（PDF 第 86 页）。<\/p>\n<p><strong>基本运算 A. 加法<\/strong>：<span class=\"katex-inline\">G(z)<\/span> 对应 <span class=\"katex-inline\">\\langle a_n\\rangle<\/span>，<span class=\"katex-inline\">H(z)<\/span> 对应 <span class=\"katex-inline\">\\langle b_n\\rangle<\/span>，则 <span class=\"katex-inline\">\\alpha G(z)+\\beta H(z)<\/span> 对应 <span class=\"katex-inline\">\\langle\\alpha a_n+\\beta b_n\\rangle<\/span>：<\/p>\n<div class=\"katex-block\">\\alpha\\sum_{n\\ge0}a_nz^n+\\beta\\sum_{n\\ge0}b_nz^n=\\sum_{n\\ge0}(\\alpha a_n+\\beta b_n)z^n<\/div>\n<p><strong>基本运算 B. 移位<\/strong>：<span class=\"katex-inline\">z^mG(z)<\/span> 对应右移 <span class=\"katex-inline\">m<\/span> 位的数列 <span class=\"katex-inline\">\\langle a_{n-m}\\rangle<\/span>，前 <span class=\"katex-inline\">m<\/span> 项补 0：<\/p>\n<div class=\"katex-block\">z^m\\sum_{n\\ge0}a_nz^n=\\sum_{n\\ge m}a_{n-m}z^n<\/div>\n<p><strong>收敛性位置<\/strong>：若级数在 <span class=\"katex-inline\">z=z_0<\/span> 收敛，则对 <span class=\"katex-inline\">|z|&lt;|z_0|<\/span> 收敛；级数在某非零 <span class=\"katex-inline\">z<\/span> 收敛，当且仅当序列 <span class=\"katex-inline\">\\sqrt[n]{|a_n|}<\/span> 有界。作为形式幂级数运算时，可以先不担心收敛，找到解后再独立证明正确性（PDF 第 86 页）。<\/p>\n<h2>原理推演：斐波那契递推转母函数<\/h2>\n<p>设 <span class=\"katex-inline\">F_0=0,\\ F_1=1,\\ F_{n+2}=F_{n+1}+F_n\\ (n\\ge0)<\/span>，<span class=\"katex-inline\">G(z)=\\sum_{n\\ge0}F_nz^n<\/span>。<\/p>\n<p>写出移位：<\/p>\n<div class=\"katex-block\">zG(z)=\\sum_{n\\ge1}F_{n-1}z^n,\\quad z^2G(z)=\\sum_{n\\ge2}F_{n-2}z^n<\/div>\n<p>递推乘 <span class=\"katex-inline\">z^n<\/span> 对 <span class=\"katex-inline\">n\\ge2<\/span> 求和：左侧 <span class=\"katex-inline\">\\sum_{n\\ge2}F_nz^n=G(z)-F_0-F_1z=G(z)-z<\/span>；右侧 <span class=\"katex-inline\">\\sum_{n\\ge2}F_{n-1}z^n=zG(z)<\/span>，<span class=\"katex-inline\">\\sum_{n\\ge2}F_{n-2}z^n=z^2G(z)<\/span>。整理：<\/p>\n<div class=\"katex-block\">G(z)-z=zG(z)+z^2G(z)<\/div>\n<div class=\"katex-block\">G(z)(1-z-z^2)=z<\/div>\n<div class=\"katex-block\">G(z)=\\frac{z}{1-z-z^2}<\/div>\n<p>右端展开后 <span class=\"katex-inline\">z^n<\/span> 系数即 <span class=\"katex-inline\">F_n<\/span>。需要通项时再做部分分式分解或系数提取；母函数把&quot;递推对所有 <span class=\"katex-inline\">n<\/span> 成立&quot;压缩成一条代数等式。<\/p>\n<p><strong>小例子对照<\/strong>：常数列 <span class=\"katex-inline\">1,1,1,\\dots<\/span> 的母函数 <span class=\"katex-inline\">G(z)=\\sum_{n\\ge0}z^n=1/(1-z)<\/span>；这是最基础的可封闭母函数。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：数列由线性递推给出，或需要计数带权组合；母函数运算走加法、移位、乘法（卷积）三条路。\n<\/li><li>\n失败案例 1：不写收敛域就代入具体 <span class=\"katex-inline\">z<\/span> 求值。形式运算阶段可以不管收敛，一旦用微积分结论或在数值点上计算，必须先核验收敛半径。\n<\/li><li>\n失败案例 2：递推下标范围写错。求和从 <span class=\"katex-inline\">n=2<\/span> 起还是 <span class=\"katex-inline\">n=0<\/span> 起，边界项 <span class=\"katex-inline\">F_0,F_1z<\/span> 处理不同；漏边界项会让方程常数项错位。\n<\/li><li>\n失败案例 3：把母函数当成普通多项式做除法。形式幂级数可以无限长，除法按系数逐项匹配，不能套用有限多项式因式分解的全部结论。\n<\/li><li>\n边界：母函数给出系数关系，不自动给出闭式；取系数才是最终目标，解方程只是中间步。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>母函数 vs 数列本身<\/strong>：母函数是承载工具，系数才是原数列；两个母函数相等当且仅当对应系数逐项相等（形式幂级数意义）。\n<\/li><li>\n<strong>普通母函数 vs 指数母函数<\/strong>：本节 <span class=\"katex-inline\">G(z)=\\sum a_nz^n<\/span> 是普通母函数；计数排列时另用指数母函数 <span class=\"katex-inline\">\\sum a_nz^n/n!<\/span>，适用对象不同。\n<\/li><li>\n<strong>生成函数 vs 生成式<\/strong>：生成函数是数学对象；&quot;生成式&quot;在书中也指文法规则，两者不要混称。\n<\/li><li>\n<strong>母函数法 vs 归纳法<\/strong>：母函数把递推转代数方程，归纳法核验命题；c03 的归纳可用于验证母函数展开式与递推一致，两条路互补。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c11 调和数的求和式常作为母函数系数出现；c03 归纳法负责事后核验展开结果。后继：计数组合、概率母函数、递推求解在后续各卷反复使用；卷积乘法对应数列逐项乘积求和，与第 4 章求和、大 O 估计衔接。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（生成函数入门：把递推变成母函数）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：生成函数的变换链、斐波那契母函数求解与系数提取<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>用母函数解递推，先往回追三层：<\/p>\n<ol><li>\n数列由递推定义，相邻项关系对所有 <span class=\"katex-inline\">n<\/span> 成立；需要一个对象把整列数同时承载。\n<\/li><li>\n母函数 <span class=\"katex-inline\">G(z)=\\sum_{n\\ge0}a_nz^n<\/span> 把数列变成幂级数；加法、移位、卷积对应数列运算。\n<\/li><li>\n递推乘 <span class=\"katex-inline\">z^n<\/span> 求和后，边界项与移位项组合成 <span class=\"katex-inline\">G(z)<\/span> 的代数方程；解出 <span class=\"katex-inline\">G(z)<\/span> 再取系数回到数列。\n<\/ol>\n<p>依赖链方向：数列递推 → 建母函数 → 递推逐项乘 <span class=\"katex-inline\">z^n<\/span> 求和 → 边界项整理 → 解出 <span class=\"katex-inline\">G(z)<\/span> → 部分分式或展开取 <span class=\"katex-inline\">[z^n]G(z)<\/span>。<\/p>\n<h2>正向推导（逐步推演）：斐波那契母函数完整求解<\/h2>\n<p>设 <span class=\"katex-inline\">F_0=0,\\ F_1=1,\\ F_{n+2}=F_{n+1}+F_n\\ (n\\ge0)<\/span>，<span class=\"katex-inline\">G(z)=\\sum_{n\\ge0}F_nz^n<\/span>。<\/p>\n<p>写出三个移位形式：<\/p>\n<div class=\"katex-block\">G(z)=F_0+F_1z+\\sum_{n\\ge2}F_nz^n=z+\\sum_{n\\ge2}F_nz^n<\/div>\n<div class=\"katex-block\">zG(z)=\\sum_{n\\ge0}F_nz^{n+1}=\\sum_{n\\ge1}F_{n-1}z^n<\/div>\n<div class=\"katex-block\">z^2G(z)=\\sum_{n\\ge0}F_nz^{n+2}=\\sum_{n\\ge2}F_{n-2}z^n<\/div>\n<p>递推 <span class=\"katex-inline\">F_n=F_{n-1}+F_{n-2}<\/span> 对 <span class=\"katex-inline\">n\\ge2<\/span> 乘 <span class=\"katex-inline\">z^n<\/span> 求和：<\/p>\n<p>左侧 <span class=\"katex-inline\">\\sum_{n\\ge2}F_nz^n=G(z)-z<\/span>；右侧第一项 <span class=\"katex-inline\">\\sum_{n\\ge2}F_{n-1}z^n=zG(z)<\/span>（<span class=\"katex-inline\">n=1<\/span> 项 <span class=\"katex-inline\">F_0z=0<\/span>）；右侧第二项 <span class=\"katex-inline\">\\sum_{n\\ge2}F_{n-2}z^n=z^2G(z)<\/span>。<\/p>\n<p>整理：<\/p>\n<div class=\"katex-block\">G(z)-z=zG(z)+z^2G(z)<\/div>\n<div class=\"katex-block\">G(z)(1-z-z^2)=z<\/div>\n<div class=\"katex-block\">G(z)=\\frac{z}{1-z-z^2}<\/div>\n<p>右端展开后 <span class=\"katex-inline\">z^n<\/span> 系数即 <span class=\"katex-inline\">F_n<\/span>。需要通项时对分母 <span class=\"katex-inline\">1-z-z^2<\/span> 做部分分式分解，再按几何级数展开取系数。<\/p>\n<h2>数值算例：低阶系数核验<\/h2>\n<p><span class=\"katex-inline\">G(z)=z/(1-z-z^2)<\/span>。先写分母倒数展开：设 <span class=\"katex-inline\">1/(1-z-z^2)=c_0+c_1z+c_2z^2+\\cdots<\/span>，乘分母：<\/p>\n<div class=\"katex-block\">(1-z-z^2)(c_0+c_1z+c_2z^2+\\cdots)=1<\/div>\n<p>系数对照：<span class=\"katex-inline\">c_0=1<\/span>；<span class=\"katex-inline\">c_1-c_0=0\\Rightarrow c_1=1<\/span>；<span class=\"katex-inline\">c_2-c_1-c_0=0\\Rightarrow c_2=2<\/span>；<span class=\"katex-inline\">c_3=c_2+c_1=3<\/span>；<span class=\"katex-inline\">c_4=5<\/span>。乘分子 <span class=\"katex-inline\">z<\/span> 后 <span class=\"katex-inline\">G(z)=z+z^2+2z^3+3z^4+5z^5+\\cdots<\/span>，系数 <span class=\"katex-inline\">0,1,1,2,3,5<\/span> 与斐波那契数列一致。<\/p>\n<p><strong>第二算例：常数列<\/strong>。<span class=\"katex-inline\">a_n=1<\/span> 对所有 <span class=\"katex-inline\">n<\/span>，母函数<\/p>\n<div class=\"katex-block\">G(z)=\\sum_{n\\ge0}z^n=1+z+z^2+\\cdots=\\frac{1}{1-z}<\/div>\n<p>这是最基础的可封闭母函数；移位 <span class=\"katex-inline\">z^mG(z)<\/span> 对应数列右移 <span class=\"katex-inline\">m<\/span> 位，前 <span class=\"katex-inline\">m<\/span> 项补 0。<\/p>\n<h2>延伸推演：基本运算与收敛位置<\/h2>\n<p><strong>加法<\/strong>：<span class=\"katex-inline\">\\alpha G(z)+\\beta H(z)<\/span> 对应 <span class=\"katex-inline\">\\langle\\alpha a_n+\\beta b_n\\rangle<\/span>，逐项线性组合。 <strong>移位<\/strong>：<span class=\"katex-inline\">z^mG(z)=\\sum_{n\\ge m}a_{n-m}z^n<\/span>，数列右移 <span class=\"katex-inline\">m<\/span> 位。 <strong>卷积<\/strong>：<span class=\"katex-inline\">G(z)H(z)<\/span> 系数为 <span class=\"katex-inline\">\\sum_{k=0}^{n}a_kb_{n-k}<\/span>，对应数列卷积。<\/p>\n<p>收敛性：若级数在 <span class=\"katex-inline\">z=z_0<\/span> 收敛，则 <span class=\"katex-inline\">|z|&lt;|z_0|<\/span> 内收敛；在某非零 <span class=\"katex-inline\">z<\/span> 收敛当且仅当 <span class=\"katex-inline\">\\sqrt[n]{|a_n|}<\/span> 有界。形式幂级数运算阶段可暂不担心收敛；一旦代入具体 <span class=\"katex-inline\">z<\/span> 求值或使用微积分结论，先核验收敛半径。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>下标范围写错<\/strong>：求和从 <span class=\"katex-inline\">n=2<\/span> 起还是 <span class=\"katex-inline\">n=0<\/span> 起，边界项 <span class=\"katex-inline\">F_0,F_1z<\/span> 处理不同；漏边界项会让方程常数项错位。 <strong>把母函数当有限多项式<\/strong>：形式幂级数无限长，除法按系数逐项匹配；有限多项式因式分解结论不能整套套用。 <strong>解方程后停在母函数<\/strong>：母函数是中间载体，最终目标是 <span class=\"katex-inline\">[z^n]G(z)<\/span>；只解出 <span class=\"katex-inline\">G(z)<\/span> 不算完成递推求解。<\/p>\n<h2>对抗性追问：母函数法能否替代归纳法<\/h2>\n<p>不能互相替代。母函数把递推转代数方程并给出系数关系；归纳法核验命题真值。得到展开式后，可用归纳法验证系数满足递推与初值，两条路互补。普通母函数 <span class=\"katex-inline\">G(z)=\\sum a_nz^n<\/span> 用于组合计数；排列计数另用指数母函数 <span class=\"katex-inline\">\\sum a_nz^n/n!<\/span>，对象不同不要混用。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出普通母函数定义；加法与移位各对应什么数列运算？\n<\/li><li>\n斐波那契递推转母函数时，<span class=\"katex-inline\">zG(z)<\/span> 与 <span class=\"katex-inline\">z^2G(z)<\/span> 各覆盖哪些下标？\n<\/li><li>\n从 <span class=\"katex-inline\">G(z)=z/(1-z-z^2)<\/span> 展开前 5 个系数并与 <span class=\"katex-inline\">F_n<\/span> 对照。\n<\/li><li>\n形式幂级数运算为什么可以暂不考虑收敛？什么时候必须核验收敛半径？\n<\/li><li>\n普通母函数与指数母函数分别服务哪类计数问题？\n<\/ol>\n<h2>延伸推演：卷积与组合计数<\/h2>\n<p>母函数相乘对应数列卷积：<span class=\"katex-inline\">C(z)=G(z)H(z)<\/span> 时，<span class=\"katex-inline\">c_n=\\sum_{k=0}^{n}a_kb_{n-k}<\/span>。组合计数中这一结构直接可用：选 <span class=\"katex-inline\">k<\/span> 个甲类物品与 <span class=\"katex-inline\">n-k<\/span> 个乙类物品的方案数求和，正是卷积形式。<\/p>\n<p>常见闭式母函数：<\/p>\n<ul><li>\n常数列 <span class=\"katex-inline\">1,1,1,\\dots<\/span>：<span class=\"katex-inline\">1/(1-z)<\/span>；\n<\/li><li>\n自然数列 <span class=\"katex-inline\">0,1,2,3,\\dots<\/span>：<span class=\"katex-inline\">z/(1-z)^2<\/span>；\n<\/li><li>\n二项式系数行：<span class=\"katex-inline\">(1+z)^m<\/span>；\n<\/li><li>\n几何权重序列：按 <span class=\"katex-inline\">r^n<\/span> 展开 <span class=\"katex-inline\">1/(1-rz)<\/span>。\n<\/ul>\n<p>取系数记号 <span class=\"katex-inline\">[z^n]G(z)<\/span> 表示 <span class=\"katex-inline\">G(z)<\/span> 展开式中 <span class=\"katex-inline\">z^n<\/span> 的系数；母函数法的最终目标就是读出这个系数，再翻译回计数或通项公式。<\/p>\n<h2>第二算例：<span class=\"katex-inline\">1/(1-z)^2<\/span> 系数展开<\/h2>\n<p>由 <span class=\"katex-inline\">1/(1-z)=\\sum_{n\\ge0}z^n<\/span>，自乘一次：<\/p>\n<div class=\"katex-block\">\\frac{1}{(1-z)^2}=\\left(\\sum_{n\\ge0}z^n\\right)^2=\\sum_{n\\ge0}\\left(\\sum_{k=0}^{n}1\\right)z^n=\\sum_{n\\ge0}(n+1)z^n<\/div>\n<p>系数为 <span class=\"katex-inline\">n+1<\/span>，即自然数列上移一位。再乘一次 <span class=\"katex-inline\">1/(1-z)<\/span>，系数变为 <span class=\"katex-inline\">\\binom{n+2}{2}<\/span>，对应二维非负整数解计数。卷积次数与维度提升的对应，是母函数解组合问题的基本模式。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;母函数就是普通多项式&quot;。<\/strong> 母函数是形式幂级数，长度无限；多项式除法结论不能整套搬用，除法按系数逐项匹配。\n<\/li><li>\n<strong>误解二：&quot;解方程得到 <span class=\"katex-inline\">G(z)<\/span> 就完成了&quot;。<\/strong> <span class=\"katex-inline\">G(z)<\/span> 是中间载体，最终要取 <span class=\"katex-inline\">[z^n]G(z)<\/span> 回到数列；停在函数式不算求解递推。\n<\/li><li>\n<strong>误解三：&quot;母函数能证明一切递推性质&quot;。<\/strong> 母函数给系数关系；命题真值核验仍靠归纳法（c03），两条路互补。\n<\/li><li>\n<strong>误解四：&quot;普通母函数可直接用于排列计数&quot;。<\/strong> 排列有顺序重复因素，计数用指数母函数 <span class=\"katex-inline\">\\sum a_nz^n/n!<\/span>；混用会得到错误系数。\n<\/ul>\n<h2>边界对照：母函数在全书分析链条中的位置<\/h2>\n<p>c11 调和数求和式常作为母函数系数出现；c05 带轮换约束的排列计数可由母函数分类统计；c10 概率分布的矩估计对应概率母函数。递推求解、组合计数、递推数列通项是母函数三类主要场景；与大 O 记号配合时，母函数给出精确系数结构，渐进分析给出规模量级。<\/p>\n<h2>推演补充：母函数解题的标准步骤<\/h2>\n<p>第一步，写递推与初值：明确 <span class=\"katex-inline\">a_0,a_1<\/span> 与 <span class=\"katex-inline\">n\\ge2<\/span>（或对应起点）的递推式。 第二步，建 <span class=\"katex-inline\">G(z)=\\sum_{n\\ge0}a_nz^n<\/span>，写出 <span class=\"katex-inline\">zG(z)<\/span>、<span class=\"katex-inline\">z^2G(z)<\/span> 等移位形式，标注各覆盖下标。 第三步，递推乘 <span class=\"katex-inline\">z^n<\/span> 求和，边界项单独摘出（<span class=\"katex-inline\">a_0,a_1z<\/span> 等）。 第四步，整理成 <span class=\"katex-inline\">G(z)<\/span> 的代数方程，解出闭式。 第五步，展开或部分分式分解，取 <span class=\"katex-inline\">[z^n]G(z)<\/span> 得通项或系数关系。<\/p>\n<p>每一步核对下标范围：漏边界项是最常见错位；移位项覆盖的下标写错，方程常数项就偏。解出 <span class=\"katex-inline\">G(z)<\/span> 后回到归纳法核验初值与递推，两条路互相印证。<\/p>\n<h2>第三算例：简单递推母函数<\/h2>\n<p>递推 <span class=\"katex-inline\">a_0=1,\\ a_n=2a_{n-1}<\/span>（<span class=\"katex-inline\">n\\ge1<\/span>）。<span class=\"katex-inline\">G(z)=\\sum a_nz^n<\/span>，<span class=\"katex-inline\">zG(z)=\\sum a_{n-1}z^n<\/span>。递推乘 <span class=\"katex-inline\">z^n<\/span> 求和：<span class=\"katex-inline\">G(z)-1=2zG(z)<\/span>，得 <span class=\"katex-inline\">G(z)=1/(1-2z)<\/span>，展开系数 <span class=\"katex-inline\">a_n=2^n<\/span>。<\/p>\n<p>再取 <span class=\"katex-inline\">b_0=1,\\ b_n=b_{n-1}+n<\/span>（<span class=\"katex-inline\">n\\ge1<\/span>）。<span class=\"katex-inline\">B(z)-1=zB(z)+\\sum nz^n<\/span>，而 <span class=\"katex-inline\">\\sum nz^n=z/(1-z)^2<\/span>；整理 <span class=\"katex-inline\">B(z)=1/(1-z)+z/(1-z)^2<\/span>，系数即 <span class=\"katex-inline\">1+n<\/span>，与累加 <span class=\"katex-inline\">1+\\cdots+n<\/span> 加 1 一致。<\/p>\n<h2>推演补充：收敛半径与形式运算<\/h2>\n<p>形式幂级数层只做代数操作：加法、移位、卷积、可逆除法按系数匹配，不要求 <span class=\"katex-inline\">z<\/span> 取具体值。一旦要代入 <span class=\"katex-inline\">z=z_0<\/span> 求值、用微积分结论（求导、积分交换求和），先核验收敛半径：级数在 <span class=\"katex-inline\">z_0<\/span> 收敛则 <span class=\"katex-inline\">|z|&lt;|z_0|<\/span> 内收敛；非零收敛等价于 <span class=\"katex-inline\">\\sqrt[n]{|a_n|}<\/span> 有界。<\/p>\n<p>书里指出：用母函数求解时通常不必先担心收敛性，找到解后可独立证明正确性；多项式与有理母函数的系数等式，可由归纳法逐项核验，不依赖级数收敛结论。这一分工把形式运算与数值求值分开处理。<\/p>\n<h2>补充对照：母函数与其他计数工具<\/h2>\n<p>递推直接展开：适合项数少、递推简单的情形，项数一大就冗长。差分方程与特征根：常系数线性递推可直接求根写通项，与母函数结果等价；变系数递推特征根法不适用，母函数更灵活。组合枚举：按分类直接计数，分类复杂时母函数把分类乘积转成级数乘积。<\/p>\n<p>母函数的强项是把递推与计数都压成代数操作；代价是代数整理步骤多，初值边界容易漏。拿到母函数解后，回代前几项与直接枚举对照，是最低成本的核验。<\/p>\n<h2>补充算例：斐波那契母函数系数核验<\/h2>\n<p><span class=\"katex-inline\">G(z)=z/(1-z-z^2)<\/span>。分母展开：<span class=\"katex-inline\">1/(1-z-z^2)=1+(z+z^2)+(z+z^2)^2+\\cdots<\/span>，乘 <span class=\"katex-inline\">z<\/span> 后系数：<span class=\"katex-inline\">[z^1]G=1<\/span>，<span class=\"katex-inline\">[z^2]G=1<\/span>，<span class=\"katex-inline\">[z^3]G=2<\/span>，<span class=\"katex-inline\">[z^4]G=3<\/span>，<span class=\"katex-inline\">[z^5]G=5<\/span>，对应 <span class=\"katex-inline\">F_1=1,F_2=1,F_3=2,F_4=3,F_5=5<\/span>。系数递推 <span class=\"katex-inline\">F_n=F_{n-1}+F_{n-2}<\/span> 与分母 <span class=\"katex-inline\">1-z-z^2<\/span> 逐项匹配。<\/p><\/div><\/details>", "kind": "concept", "title": "生成函数入门：把递推变成母函数"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：基本概念：算法、证明方法、数论工具与置换<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：基本概念——算法、证明方法、数论工具与置换<\/a><br>检查点：能说出算法五条特征，写出归纳法两步并指出缺基础步的后果，手算一次 gcd 全过程，把给定置换写成轮换并数出逆序<\/li><li class='path-step' id='path-02'><strong>步骤 02：信息结构：线性表、树、二叉树遍历与多重链接<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：信息结构——线性表、树、二叉树遍历与多重链接<\/a><br>检查点：能对比顺序分配与链接分配在插入删除时的代价，画出左孩右兄对应关系，对给定二叉树给出先序、中序、后序输出<\/li><li class='path-step' id='path-03'><strong>步骤 03：起点与随机数：模运算铺垫、同余发生器与检验思想<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：起点与随机数——模运算铺垫、线性同余发生器与随机数检验<\/a><br>检查点：能写出线性同余递推并算出前若干项，说清满周期的三个条件方向，解释谱检验与 χ² 统计量在测什么，以及为什么随机只能测不能证<\/li><li class='path-step' id='path-04'><strong>步骤 04：算法分析基础：调和数、求和渐进、生成函数与大 O<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：算法分析基础（对应原书第 1 章 §1.2 与第 3 章 §3.5 的分析方法）<\/a><br>检查点：能用积分比较估 H_n 量级，写出调和数渐进式，把一个一阶递推转成生成函数并取系数，读懂大 O 记号的单向包含关系<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='算法（algorithm）'>算法（algorithm） — 对一类问题给出的、由有限条明确指令组成的操作序列；Knuth 概括为具备有限性、确定性、输入、输出、可行性五条特征 <span class=glossary-ref>（第 1 章：基本概念——算法、证明方法、数论工具与置换）<\/span><\/li><li data-term='有限性（有穷性）'>有限性（有穷性） — 算法必须在执行有限步之后终止；只满足其余四条特征、但可能不终止的过程称为计算方法，而非算法 <span class=glossary-ref>（第 1 章：基本概念——算法、证明方法、数论工具与置换）<\/span><\/li><li data-term='确定性'>确定性 — 算法每一步要执行的操作都给出严格无歧义的说明；用自然语言描述时读者理解可能有出入，因此关键算法常同时配机器语言程序 <span class=glossary-ref>（第 1 章：基本概念——算法、证明方法、数论工具与置换）<\/span><\/li><li data-term='mix'>MIX — 书中设计的一台虚拟精简指令计算机，记号 1009；数据单位为字节，同时兼容二进制与十进制视角，用于在不依赖特定真机的前提下描述算法与计步 <span class=glossary-ref>（第 1 章：基本概念——算法、证明方法、数论工具与置换）<\/span><\/li><li data-term='数学归纳法'>数学归纳法 — 证明命题 $P(n)$ 对所有正整数成立的方法：先证基础步 $P(1)$，再证归纳步——若 $P(1),\\dots,P(n)$ 全为真则 $P(n+1)$ 为真；另有强归纳形式 <span class=glossary-ref>（第 1 章：基本概念——算法、证明方法、数论工具与置换）<\/span><\/li><li data-term='最大公约数（gcd）'>最大公约数（gcd） — 同时整除 $m$ 和 $n$ 的最大正整数；欧几里得算法反复用余数替换，过程中 gcd 保持不变 <span class=glossary-ref>（第 1 章：基本概念——算法、证明方法、数论工具与置换）<\/span><\/li><li data-term='置换（排列）'>置换（排列） —  $n$ 个不同对象排成一行的一种排放方式；$n$ 元置换共有 $n!$ 个，可用轮换分解表示 <span class=glossary-ref>（第 1 章：基本概念——算法、证明方法、数论工具与置换）<\/span><\/li><li data-term='轮换分解'>轮换分解 — 把置换写成若干互不相交轮换的乘积；每个轮换 $(a_1\\ a_2\\ \\dots\\ a_k)$ 表示 $a_1\\to a_2,\\dots,a_k\\to a_1$ <span class=glossary-ref>（第 1 章：基本概念——算法、证明方法、数论工具与置换）<\/span><\/li><li data-term='线性表（linear list）'>线性表（linear list） —  $n\\ge 0$ 个结点排成一行的序列；只关心各项相对位置，第一结点为 $X[1]$，最后一结点为 $X[n]$ <span class=glossary-ref>（第 2 章：信息结构——线性表、树、二叉树遍历与多重链接）<\/span><\/li><li data-term='顺序分配 / 链接分配'>顺序分配 / 链接分配 — 顺序分配把表元素连续存放在数组式存储区；链接分配在每个结点里放链字段，用指针把结点串起来；两者在随机访问与插入删除上代价相反 <span class=glossary-ref>（第 2 章：信息结构——线性表、树、二叉树遍历与多重链接）<\/span><\/li><li data-term='二叉树'>二叉树 — 结点的有限集：或者为空，或者由一个根和两棵互不相交的二叉树（左子树、右子树）组成；左右子树有次序之分 <span class=glossary-ref>（第 2 章：信息结构——线性表、树、二叉树遍历与多重链接）<\/span><\/li><li data-term='遍历（traversal）'>遍历（traversal） — 系统地考察树的结点，使每个结点恰被访问一次；二叉树有先序、中序、后序三种递归次序 <span class=glossary-ref>（第 2 章：信息结构——线性表、树、二叉树遍历与多重链接）<\/span><\/li><li data-term='线性同余发生器（lcg）'>线性同余发生器（LCG） — 按递推 $X_{n+1}=(aX_n+c)\\bmod m$ 产生序列的方法；$m$ 为模数，$a$ 为乘子，$c$ 为增量 <span class=glossary-ref>（第 3 章：起点与随机数——模运算铺垫、线性同余发生器与随机数检验）<\/span><\/li><li data-term='谱检验（spectral test）'>谱检验（spectral test） — 从高维格点分布角度检验发生器：考察相邻超平面之间的距离，距离过小或格点结构规则说明序列在高维上可被预测 <span class=glossary-ref>（第 3 章：起点与随机数——模运算铺垫、线性同余发生器与随机数检验）<\/span><\/li><li data-term='χ² 统计量'>χ² 统计量 —  $\\sum_i (O_i-E_i)^2/E_i$，其中 $O_i$ 为第 $i$ 类观测频数、$E_i$ 为期望频数；数值越大，观测分布与均匀期望偏离越远 <span class=glossary-ref>（第 3 章：起点与随机数——模运算铺垫、线性同余发生器与随机数检验）<\/span><\/li><li data-term='调和数 $h_n$'>调和数 $H_n$ —  $H_n=1+1/2+\\cdots+1/n=\\sum_{k=1}^{n}1/k$；量级为 $\\ln n+\\gamma$，$\\gamma$ 为欧拉常数 <span class=glossary-ref>（第 4 章：算法分析基础（对应原书第 1 章 §1.2 与第 3 章 §3.5 的分析方法））<\/span><\/li><li data-term='生成函数（母函数）'>生成函数（母函数） — 对数列 $\\langle a_n\\rangle$ 建立幂级数 $G(z)=\\sum_{n\\ge 0}a_n z^n$，用一个函数承载整列数；递推关系可转化为 $G(z)$ 的代数方程 <span class=glossary-ref>（第 4 章：算法分析基础（对应原书第 1 章 §1.2 与第 3 章 §3.5 的分析方法））<\/span><\/li><li data-term='大 o 记号'>大 O 记号 —  $x_n=O(f(n))$ 表示存在正常数 $M$ 与 $n_0$，使 $n\\ge n_0$ 时 $|x_n|\\le M|f(n)|$；大 O 是单向包含关系，不能反向写等号 <span class=glossary-ref>（第 4 章：算法分析基础（对应原书第 1 章 §1.2 与第 3 章 §3.5 的分析方法））<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库<\/h1>\n<h2>模式 1：判一段描述是不是算法，先逐条核五条特征<\/h2>\n<p>拿到一段过程描述，依次核对：是否在有限步内终止（有限性）；每一步操作是否无歧义（确定性）；是否有明确输入与输出；每一步是否在有限时间内可行。五条全满足才是算法；缺有限性、其余四条齐备的过程只是计算方法，可能停不下来。检查时把&quot;理论上可执行&quot;与&quot;有限步内完成&quot;分开：可行性看单步能否执行，有限性看总步数是否有上界。<\/p>\n<h2>模式 2：证明数列命题走归纳法，先立基础步再推归纳步<\/h2>\n<p>证明 <span class=\"katex-inline\">P(n)<\/span> 对所有正整数成立，先把 <span class=\"katex-inline\">n=1<\/span>（或对应起点）代进命题验真；再写归纳步：假设 <span class=\"katex-inline\">P(1),\\dots,P(n)<\/span> 为真，推出 <span class=\"katex-inline\">P(n+1)<\/span>。基础步与归纳步缺一不可：只写 <span class=\"katex-inline\">P(n)\\Rightarrow P(n+1)<\/span> 而不验基础，命题可能从假起点一路推出假结论。强归纳把假设扩到前 <span class=\"katex-inline\">n<\/span> 项；用普通归纳能推的命题不强行上强归纳，假设范围要与递推结构匹配。<\/p>\n<h2>模式 3：求 gcd 沿余数链替换，全程保住 gcd 不变量<\/h2>\n<p><span class=\"katex-inline\">\\gcd(m,n)<\/span> 与 <span class=\"katex-inline\">\\gcd(n,m\\bmod n)<\/span> 相等是整条算法的不变量：每轮用余数替换大数，余数严格小于原除数，数值递减保证终止；末轮余数为 0 时，当前非零余数即 gcd。估步数时沿最慢的斐波那契型余数链对照，得到 <span class=\"katex-inline\">O(\\log\\min(m,n))<\/span> 的量级。写实现先处理 <span class=\"katex-inline\">n=0<\/span> 退化情形，再进入主循环。<\/p>\n<h2>模式 4：置换先画映射箭头，再沿未标记元素写成轮换<\/h2>\n<p>把集合元素按原排列对齐，逐元素画 <span class=\"katex-inline\">\\sigma<\/span> 箭头；从尚未走过的元素出发，沿箭头回到起点即得一个轮换，轮换内元素顺序沿箭头方向写；标出已用元素，换下一个起点。多个互不相交轮换并列即完成分解。数逆序对时逐对比较前面元素是否大于后面元素，累计成对计数；相邻交换排序的最少次数等于逆序对数。<\/p>\n<h2>模式 5：选线性表表示先看访问模式，再比两类代价<\/h2>\n<p>先统计最频繁的操作：随机读多、表长稳定，选顺序分配；增删集中、长度不定，选链接分配。顺序分配随机访问一次定位，插入删除要搬移后继元素；链接分配定位要沿链走，插入删除只改链字段。混合需求再上辅助结构：链表加索引块改善随机访问，顺序表批量重排抑制碎片。决策不脱离操作频次谈哪种表更好。<\/p>\n<h2>模式 6：树与森林转二叉树，左孩挂长子、右链挂兄弟<\/h2>\n<p>任意分支度的树统一成二叉树表示：结点左链挂第一个子女，右链挂下一个兄弟；森林的根之间也用右链相连。反向还原时左链回长子，右链回下一兄弟（或下一棵根）。遍历二叉树先定访问次序：先序复制与序列化，后序子树汇总与销毁，中序在搜索树上取有序序列；次序选错，访问动作再正确也拿不到目标序列。<\/p>\n<h2>模式 7：设计发生器先核周期条件，再交统计检验把关<\/h2>\n<p>线性同余递推 <span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span> 先核参数结构与模数互素关系，确认可达状态数与周期长度；周期只说明状态不重复，不保证数值均匀。分布层再交检验：频数看边缘分布，谱检验看高维格点结构，游程与滞后相关看相邻趋势。检验结论是与均匀假设不冲突，不能写成&quot;证明随机&quot;；检验失败先排除实现错误，再调参数或换发生器。<\/p>\n<h2>模式 8：估求和量级先认通项类型，再选工具压渐进<\/h2>\n<p>拿到有限和先判断通项：<span class=\"katex-inline\">k^p<\/span> 型主项 <span class=\"katex-inline\">O(n^{p+1})<\/span>，<span class=\"katex-inline\">1/k<\/span> 型主项 <span class=\"katex-inline\">O(\\ln n)<\/span>，<span class=\"katex-inline\">r^k<\/span> 型主项 <span class=\"katex-inline\">O(r^n)<\/span>。多项式求和用公式或积分，倒数和用分组加积分比较，几何和用闭式。含递推数列时，建母函数 <span class=\"katex-inline\">G(z)=\\sum a_nz^n<\/span>，移位乘 <span class=\"katex-inline\">z<\/span> 后整理成代数方程，解出闭式再取系数；解完回代前几项与直接枚举对照核验。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 基本概念<\/strong>：算法五特征与 MIX、归纳法、欧几里得算法、置换与逆序、整除性（PDF 第 18、19、20、25、47、52、116 页起；印刷页 = PDF 页 − 17）。\n<\/li><li>\n<strong>第 2 章 信息结构<\/strong>：线性表顺序/链接分配、树与左孩右兄表示、二叉树三序遍历、多重链接（PDF 第 204、208、262、270、282、350 页起）。\n<\/li><li>\n<strong>第 3 章 起点与随机数<\/strong>：模运算铺垫、线性同余发生器、谱检验与 χ² 检验（模运算对应 PDF 第 47 页；发生器与检验完整讨论属卷 2 第 3 章，本卷不挂页码）。\n<\/li><li>\n<strong>第 4 章 算法分析基础<\/strong>：调和数与求和渐进、大 O 记号、典型算法分析、生成函数入门（PDF 第 76、79、86、93、102 页起）。\n<\/ul>\n<h2>算法五特征速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>特征<\/th><th>含义<\/th><th>缺失后果<\/th><\/tr><\/thead><tbody><tr><td>有限性<\/td><td>有限步内终止<\/td><td>停不下来，只是计算方法不是算法<\/td><\/tr><tr><td>确定性<\/td><td>每步操作无歧义<\/td><td>不同读者执行结果分叉<\/td><\/tr><tr><td>输入<\/td><td>给出外部输入<\/td><td>过程无作用对象<\/td><\/tr><tr><td>输出<\/td><td>给出与输入相关的结果<\/td><td>无信息返回<\/td><\/tr><tr><td>可行性<\/td><td>每步可在有限时间内执行<\/td><td>单步不可完成<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>归纳法三种形式<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>形式<\/th><th>基础步<\/th><th>归纳步假设<\/th><th>适用<\/th><\/tr><\/thead><tbody><tr><td>普通归纳<\/td><td><span class=\"katex-inline\">P(1)<\/span> 为真<\/td><td><span class=\"katex-inline\">P(n)<\/span> 为真 → <span class=\"katex-inline\">P(n+1)<\/span><\/td><td>递推只依赖前一项<\/td><\/tr><tr><td>强归纳<\/td><td><span class=\"katex-inline\">P(1)<\/span> 为真<\/td><td><span class=\"katex-inline\">P(1),\\dots,P(n)<\/span> 全真 → <span class=\"katex-inline\">P(n+1)<\/span><\/td><td>递推依赖更早多项<\/td><\/tr><tr><td>起始偏移<\/td><td><span class=\"katex-inline\">P(n_0)<\/span> 为真<\/td><td>从 <span class=\"katex-inline\">n_0<\/span> 起递推<\/td><td>命题从某个起点才成立<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>欧几里得算法链<\/h2>\n<ul><li>\n不变量：<span class=\"katex-inline\">\\gcd(m,n)=\\gcd(n,m\\bmod n)<\/span>。\n<\/li><li>\n终止：余数严格递减，末轮余数 0，当前非零余数即 gcd。\n<\/li><li>\n算例 <span class=\"katex-inline\">\\gcd(544,119)<\/span>：<span class=\"katex-inline\">544=4\\times119+68<\/span>；<span class=\"katex-inline\">119=1\\times68+51<\/span>；<span class=\"katex-inline\">68=1\\times51+17<\/span>；<span class=\"katex-inline\">51=3\\times17+0<\/span>，返回 17，四次除法。\n<\/li><li>\n量级：<span class=\"katex-inline\">O(\\log\\min(m,n))<\/span>，最慢链条对照斐波那契数。\n<\/ul>\n<h2>线性表分配对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>操作<\/th><th>顺序分配<\/th><th>链接分配<\/th><\/tr><\/thead><tbody><tr><td>按下标访问<\/td><td>一次偏移定位<\/td><td>沿链走 <span class=\"katex-inline\">O(n)<\/span> 步<\/td><\/tr><tr><td>定位后插入<\/td><td>后继元素搬移 <span class=\"katex-inline\">O(n)<\/span><\/td><td>两次改链，常数步<\/td><\/tr><tr><td>定位后删除<\/td><td>后继前移 <span class=\"katex-inline\">O(n)<\/span><\/td><td>一次改链；需先找前驱<\/td><\/tr><tr><td>空间<\/td><td>预留容量，闲置部分占空间<\/td><td>每结点挂链字段，有分配碎片<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>二叉树三序遍历<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>次序<\/th><th>访问顺序<\/th><th>典型用途<\/th><\/tr><\/thead><tbody><tr><td>先序<\/td><td>根 → 左子树 → 右子树<\/td><td>复制、序列化、前缀表达式<\/td><\/tr><tr><td>中序<\/td><td>左子树 → 根 → 右子树<\/td><td>搜索树有序输出、中缀表达式<\/td><\/tr><tr><td>后序<\/td><td>左子树 → 右子树 → 根<\/td><td>子树汇总、销毁、后缀表达式<\/td><\/tr><\/tbody><\/table><\/div>\n<p>样例树先序 <code>A B D C E G F H J<\/code>（PDF 270 序列 3），中序 <code>D B A E G C H F J<\/code>（PDF 271 序列 4），后序 <code>D B G E H J F C A<\/code>（PDF 271 序列 5）；E 的右孩子为 G，E 左空。<\/p>\n<h2>线性同余发生器<\/h2>\n<ul><li>\n递推：<span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span>。\n<\/li><li>\n满周期算例：<span class=\"katex-inline\">m=16,\\ a=5,\\ c=1,\\ X_0=1<\/span>，周期 16。\n<\/li><li>\n崩溃算例：<span class=\"katex-inline\">m=8,\\ a=2,\\ c=0,\\ X_0=1<\/span>，序列 <span class=\"katex-inline\">1,2,4,0,0<\/span>，周期 1。\n<\/li><li>\n模数取合数、乘子过小、增量为零都会压缩可达状态；低位比特质量通常弱于高位。\n<\/ul>\n<h2>随机数检验速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>检验<\/th><th>侧面<\/th><th>统计量/判据<\/th><\/tr><\/thead><tbody><tr><td>频数（χ²）<\/td><td>各类边缘分布<\/td><td><span class=\"katex-inline\">\\chi^2=\\sum_i (O_i-E_i)^2/E_i<\/span><\/td><\/tr><tr><td>谱检验<\/td><td>高维格点均匀性<\/td><td>相邻超平面间距，过小提示聚集<\/td><\/tr><tr><td>游程检验<\/td><td>相邻趋势粘连<\/td><td>升降段长度分布<\/td><\/tr><tr><td>滞后相关<\/td><td>长程依赖<\/td><td><span class=\"katex-inline\">X_n<\/span> 与 <span class=\"katex-inline\">X_{n+k}<\/span> 相关程度<\/td><\/tr><\/tbody><\/table><\/div>\n<p>结论边界：检验只判断样本与均匀假设是否冲突；有限样本不能证明序列随机。<\/p>\n<h2>求和与母函数公式<\/h2>\n<ul><li>\n调和数：<span class=\"katex-inline\">H_n=\\sum_{k=1}^{n}1/k=\\ln n+\\gamma+1/(2n)+O(1/n^2)<\/span>，<span class=\"katex-inline\">\\gamma\\approx0.5772156649<\/span>。\n<\/li><li>\n算例：<span class=\"katex-inline\">H_{10}=7381/2520\\approx2.9290<\/span>。\n<\/li><li>\n母函数：<span class=\"katex-inline\">G(z)=\\sum_{n\\ge0}a_nz^n<\/span>；移位 <span class=\"katex-inline\">zG(z)=\\sum_{n\\ge1}a_{n-1}z^n<\/span>。\n<\/li><li>\n斐波那契：<span class=\"katex-inline\">F_0=0,\\ F_1=1,\\ F_{n+2}=F_{n+1}+F_n<\/span>，<span class=\"katex-inline\">G(z)=z/(1-z-z^2)<\/span>。\n<\/li><li>\n大 O：<span class=\"katex-inline\">x_n=O(f(n))<\/span> 表示 <span class=\"katex-inline\">n\\ge n_0<\/span> 时 <span class=\"katex-inline\">|x_n|\\le M|f(n)|<\/span>，单向包含，不能反写等号。\n<\/ul>\n<h2>关键故障对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>漏了哪一步<\/th><th>后果<\/th><\/tr><\/thead><tbody><tr><td>归纳法不验基础步<\/td><td>从假起点推出假命题，证明无效<\/td><\/tr><tr><td>强归纳假设范围小于递推需要<\/td><td>归纳步推不出，链条中断<\/td><\/tr><tr><td>gcd 实现不处理 <span class=\"katex-inline\">n=0<\/span><\/td><td>主循环除零错误<\/td><\/tr><tr><td>把周期长误当分布均匀<\/td><td>发生器可能在高维上规则聚集，漏检<\/td><\/tr><tr><td>χ² 类别划得过细<\/td><td>单项期望频数不足，统计量失真<\/td><\/tr><tr><td>把&quot;检验通过&quot;写成&quot;证明随机&quot;<\/td><td>证据标准混淆，结论越界<\/td><\/tr><tr><td>母函数漏摘边界项<\/td><td>方程常数项错位，系数结果全偏<\/td><\/tr><tr><td>树表示把右链当子女链<\/td><td>还原森林时兄弟与子女关系混淆<\/td><\/tr><\/tbody><\/table><\/div>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/计算机程序设计艺术-卷1-基本算法-第3版-美-高德纳著-李伯民-范明-蒋爱军译-9", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：基本概念——算法、证明方法、数论工具与置换", "href": "#/chapter/ch01"}, {"label": "第 2 章：信息结构——线性表、树、二叉树遍历与多重链接", "href": "#/chapter/ch02"}, {"label": "第 3 章：起点与随机数——模运算铺垫、线性同余发生器与随机数检验", "href": "#/chapter/ch03"}, {"label": "第 4 章：算法分析基础（对应原书第 1 章 §1.2 与第 3 章 §3.5 的分析方法）", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "算法定义的五条特征与有穷性的边界", "href": "#/concept/c01"}, {"label": "MIX 与现代机器：为什么用假机器计步", "href": "#/concept/c02"}, {"label": "数学归纳法：三种形式与常见误用", "href": "#/concept/c03"}, {"label": "欧几里得算法的正确性与复杂度（gcd 不变量与步数量级）", "href": "#/concept/c04"}, {"label": "置换与逆序：轮换分解", "href": "#/concept/c05"}, {"label": "树与二叉树的等价表示：左孩右兄", "href": "#/concept/c06"}, {"label": "二叉树三种遍历次序与栈实现", "href": "#/concept/c07"}, {"label": "线性表的数组分配与链接分配：代价对比", "href": "#/concept/c08"}, {"label": "线性同余发生器：模数选择与周期", "href": "#/concept/c09"}, {"label": "随机数检验：谱检验思想、χ² 统计量与“随机不可证”", "href": "#/concept/c10"}, {"label": "调和数与求和的渐进估计", "href": "#/concept/c11"}, {"label": "生成函数入门：把递推变成母函数", "href": "#/concept/c12"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：基本概念——算法、证明方法、数论工具与置换", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：信息结构——线性表、树、二叉树遍历与多重链接", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：起点与随机数——模运算铺垫、线性同余发生器与随机数检验", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：算法分析基础（对应原书第 1 章 §1.2 与第 3 章 §3.5 的分析方法）", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.18<\/div><h1>第 1 章：基本概念——算法、证明方法、数论工具与置换<\/h1>\n<blockquote>对应原书第 1 章 §1.1「算法」、§1.2.1「数学归纳法」、§1.2.4「整数函数与初等数论」、§1.2.5「排列与阶乘」（PDF 第 18–52 页；印刷页 = PDF 页 − 17）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n复述算法的五条特征，指出&quot;有限性&quot;与其余四条的差别，说明一个不终止的过程为什么不算算法；\n<\/li><li>\n按归纳法两步写出对数列命题的证明，找出只做归纳步、漏掉基础步这类证明里的漏洞；\n<\/li><li>\n手算欧几里得算法求两个整数的最大公约数，逐步说明 gcd 不变量为什么保持，估计步数的数量级；\n<\/li><li>\n把一个给定置换写成互不相交的轮换乘积，数出一个排列包含的逆序对数；\n<\/li><li>\n说清 Knuth 为什么在书里使用一台虚构机器 MIX，而不是直接对着某款真机讲算法。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>算法是一组有限、确定、有输入输出、每步可行的操作指令；要证明算法对所有输入成立，靠的是归纳法这类可复核的推理；数论工具（余数、整除、gcd）是后面分析算法与构造发生器的地基；置换则把&quot;一组对象的重排&quot;变成可以形式分解的对象。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：算法的五条特征与有穷性边界（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。书里在 §1.1 先用欧几里得算法作为第一个完整算法样例，再回过头概括算法的含义：一个算法不仅是求解问题的有限操作序列，还必须具备有限性、确定性、输入、输出、可行性五条特征（PDF 第 20–21 页）。有限性要求算法在有限步之后终止；其余四条分别约束每一步无歧义、有初始量、有与输入存在指定关系的结果、操作本身足够基本可以纸笔完成。只缺有限性的过程，书里称为&quot;计算方法&quot;，例如与环境不断交互的反应式进程。<\/p>\n<h3>2. 概念 2：MIX 与现代机器的关系（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。书里反复用到一台虚构计算机 MIX，记号 1009，字节至少能保存 64 个不同值，同时兼容二进制与十进制视角（PDF 第 116 页）。选假机器的理由是：真机每隔几年换代，指令集还带大量与本书主题无关的硬件特性；用一台规则简单的抽象机器描述算法，计步与结构分析不被某款芯片的细节绑死。<\/p>\n<h3>3. 概念 3：数学归纳法的形式与误用（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。§1.2.1 把归纳法写成两步：先证 <span class=\"katex-inline\">P(1)<\/span> 为真，再证若 <span class=\"katex-inline\">P(1),\\dots,P(n)<\/span> 全为真则 <span class=\"katex-inline\">P(n+1)<\/span> 为真（PDF 第 25 页）。归纳法是后面证明算法正确性、推导递推数列性质的标准工具；常见漏洞集中在基础步未证、归纳步假设范围写错、以及把强归纳当成普通归纳使用。<\/p>\n<h3>4. 概念 4：欧几里得算法的正确性与复杂度（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。算法 E 给定两个正整数 <span class=\"katex-inline\">m,n<\/span>，反复用 <span class=\"katex-inline\">n<\/span> 除 <span class=\"katex-inline\">m<\/span> 取余数 <span class=\"katex-inline\">r<\/span>，再把 <span class=\"katex-inline\">(m,n)<\/span> 替换成 <span class=\"katex-inline\">(n,r)<\/span>，直到余数为 0（PDF 第 19–20 页）。正确性靠 gcd 不变量：每一步前后 <span class=\"katex-inline\">(m,n)<\/span> 与 <span class=\"katex-inline\">(n,r)<\/span> 的公约数集合相同；步数最坏情况与斐波那契数列挂钩，量级为 <span class=\"katex-inline\">O(\\log\\min(m,n))<\/span>。<\/p>\n<h3>5. 概念 5：置换与轮换分解（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。§1.2.5 定义 <span class=\"katex-inline\">n<\/span> 元排列为 <span class=\"katex-inline\">n<\/span> 个不同对象排成一行的排放方式，3 个对象 <span class=\"katex-inline\">\\{a,b,c\\}<\/span> 共有 6 种排列（PDF 第 52 页）。把置换作用在元素上的轨迹追踪下来，就得到互不相交的轮换；逆序对则衡量一个排列离顺序排列有多远。<\/p>\n<h2>推导一（证明）：gcd 不变量为什么保持<\/h2>\n<p>设当前两数为 <span class=\"katex-inline\">m,n<\/span>，按算法 E1 做除法 <span class=\"katex-inline\">m=qn+r<\/span>，其中 <span class=\"katex-inline\">0\\le r&lt;n<\/span>。<\/p>\n<p>第一步，任取 <span class=\"katex-inline\">m,n<\/span> 的一个公约数 <span class=\"katex-inline\">d<\/span>：<span class=\"katex-inline\">d\\mid m<\/span> 且 <span class=\"katex-inline\">d\\mid n<\/span>，于是 <span class=\"katex-inline\">d<\/span> 整除 <span class=\"katex-inline\">m-qn<\/span>，而 <span class=\"katex-inline\">m-qn=r<\/span>，所以 <span class=\"katex-inline\">d\\mid r<\/span>。这说明 <span class=\"katex-inline\">m,n<\/span> 的全部公约数都是 <span class=\"katex-inline\">n,r<\/span> 的公约数。<\/p>\n<p>第二步，反过来任取 <span class=\"katex-inline\">n,r<\/span> 的一个公约数 <span class=\"katex-inline\">e<\/span>：<span class=\"katex-inline\">e\\mid n<\/span> 且 <span class=\"katex-inline\">e\\mid r<\/span>，于是 <span class=\"katex-inline\">e<\/span> 整除 <span class=\"katex-inline\">qn+r=m<\/span>，所以 <span class=\"katex-inline\">e\\mid m<\/span>。这说明 <span class=\"katex-inline\">n,r<\/span> 的全部公约数也都是 <span class=\"katex-inline\">m,n<\/span> 的公约数。<\/p>\n<p>两个方向合起来，<span class=\"katex-inline\">\\gcd(m,n)<\/span> 与 <span class=\"katex-inline\">\\gcd(n,r)<\/span> 的公约数集合完全相同，最大公约数自然相等。算法 E3 执行 <span class=\"katex-inline\">m\\leftarrow n,\\ n\\leftarrow r<\/span> 之后，待求问题从&quot;求 <span class=\"katex-inline\">(m,n)<\/span> 的 gcd&quot;换成&quot;求 <span class=\"katex-inline\">(n,r)<\/span> 的 gcd&quot;，答案没有改变。<\/p>\n<h2>推导二（推演）：一次完整的欧几里得手算<\/h2>\n<p>取书里的算例方向：<span class=\"katex-inline\">m=119,\\ n=544<\/span>。因为初值 <span class=\"katex-inline\">m&lt;n<\/span>，先交换使 <span class=\"katex-inline\">m=544,\\ n=119<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">544=4\\cdot119+68<\/span>，余数 <span class=\"katex-inline\">r=68<\/span>；更新 <span class=\"katex-inline\">m=119,\\ n=68<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">119=1\\cdot68+51<\/span>，余数 <span class=\"katex-inline\">r=51<\/span>；更新 <span class=\"katex-inline\">m=68,\\ n=51<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">68=1\\cdot51+17<\/span>，余数 <span class=\"katex-inline\">r=17<\/span>；更新 <span class=\"katex-inline\">m=51,\\ n=17<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">51=3\\cdot17+0<\/span>，余数 <span class=\"katex-inline\">r=0<\/span>；算法终止，答案为 <span class=\"katex-inline\">n=17<\/span>。\n<\/ol>\n<p>对照不变量：第 1 步前后 <span class=\"katex-inline\">\\gcd(544,119)=\\gcd(119,68)<\/span>，第 2 步前后 <span class=\"katex-inline\">\\gcd(119,68)=\\gcd(68,51)<\/span>，第 3 步前后 <span class=\"katex-inline\">\\gcd(68,51)=\\gcd(51,17)<\/span>，最后 <span class=\"katex-inline\">\\gcd(51,17)=17<\/span>。全程四次除法，余数序列 <span class=\"katex-inline\">68,51,17,0<\/span> 严格递减。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>去掉有限性要求<\/strong>：一个每步确定、有输入有输出、操作可行，却可能无限循环的过程，按本书定义不能称为算法。例如&quot;不断生成比当前数更大的素数并记录&quot;，只要不设终止条件，它永远在工作；程序可以运行，但无法保证在有限时间给出结果。反应式进程就是这一类，它与算法的差别不在某一步写得对不对，而在终止性这条外部约束。\n<\/li><li>\n<strong>归纳法不证基础步<\/strong>：假设有人直接从归纳步出发，声称&quot;所有 <span class=\"katex-inline\">n<\/span> 匹马同色&quot;：任取 <span class=\"katex-inline\">n<\/span> 匹马，换掉一匹仍得 <span class=\"katex-inline\">n<\/span> 匹，由归纳假设同色。基础步 <span class=\"katex-inline\">n=1<\/span> 本应平凡成立，但论证在 <span class=\"katex-inline\">n=2<\/span> 这一步无法把两组单匹马的颜色接起来；缺了对最小情形的核验，归纳链条从第一环就悬空，后面每一步再整齐也推不出真命题。\n<\/li><li>\n<strong>gcd 替换顺序写反<\/strong>：E3 要求先置 <span class=\"katex-inline\">m\\leftarrow n<\/span>、再置 <span class=\"katex-inline\">n\\leftarrow r<\/span>。若写成先 <span class=\"katex-inline\">n\\leftarrow r<\/span> 再 <span class=\"katex-inline\">m\\leftarrow n<\/span>，<span class=\"katex-inline\">m<\/span> 拿到的是 <span class=\"katex-inline\">r<\/span> 而不是原来的 <span class=\"katex-inline\">n<\/span>，余数信息丢失，后续除法不再对应不变量证明里的 <span class=\"katex-inline\">(n,r)<\/span> 对，答案会错。\n<\/li><li>\n<strong>把模数取成合数而乘子选错<\/strong>：这一单元只铺垫数论背景；发生器一侧的周期崩溃留到第 3 章展开。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章是全书的概念地基：归纳法是第 4 章分析递推与求和的推理工具；gcd 与余数是第 3 章线性同余发生器、模运算检验的前置；置换概念在 §1.3.3 排列的应用里接机器指令，又在第 2 章树结构的枚举、第 5 章排序问题中反复出现。下一章进入信息结构，看这些数论与证明工具怎样被用来组织内存里的数据对象。<\/p>", "ch02": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.204<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：基本概念——算法、证明方法、数论工具与置换<\/a><\/span><\/div><h1>第 2 章：信息结构——线性表、树、二叉树遍历与多重链接<\/h1>\n<blockquote>对应原书第 2 章 §2.1「引论」、§2.2「线性表」、§2.3「树」、§2.4「多链结构」（PDF 第 204–350 页；印刷页 = PDF 页 − 17）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出线性表定义的相对位置语义，列出对线性表常做的九类操作；\n<\/li><li>\n对比顺序分配与链接分配在随机访问、插入、删除、空间开销上的代价，给出插入删除各自动多少步的算例；\n<\/li><li>\n复述树的递归定义，区分有序树、定向树与森林；\n<\/li><li>\n画出森林到二叉树的&quot;左孩右兄&quot;对应关系，说清两个链字段各指向谁；\n<\/li><li>\n对给定二叉树写出先序、中序、后序遍历序列，并说清递归遍历怎样落到栈上实现。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>信息在机器里不是一团杂乱数值，结点之间带有结构关系；最简单的结构是排成一行的线性表，进一步分支分层就得到树，而一般的树与森林总能对应到一棵二叉树，因此遍历、存储、分析先在二叉树上做透，再推广回树。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：线性表的数组分配与链接分配（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。§2.2 开头定义线性表为 <span class=\"katex-inline\">n\\ge 0<\/span> 个结点 <span class=\"katex-inline\">X[1],X[2],\\dots,X[n]<\/span> 的序列，结构性质只是各项排成一行时的相对位置（PDF 第 208 页）。围绕表的操作包括访问第 <span class=\"katex-inline\">k<\/span> 个结点、在前后插入新结点、删除第 <span class=\"katex-inline\">k<\/span> 个结点、合并、拆分、复制、计数、排序与搜索。表示方法有两类：顺序分配把元素连续放在存储区；链接分配在结点里留链字段，用指针把结点串起来。两类方法在访问速度与增删代价上正好相反。<\/p>\n<h3>2. 概念 2：二叉树三种遍历次序与栈实现（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。§2.3.1 把遍历定义为系统地考察结点、每个结点恰访问一次；二叉树遍历分先序、中序、后序三种递归次序（PDF 第 270 页）。书里样例二叉树先序输出为 <span class=\"katex-inline\">A\\ B\\ D\\ C\\ E\\ G\\ F\\ H\\ J<\/span>。递归写法靠调用栈保存现场，改成迭代版本时用显式栈模拟左子树链的下压与回退。<\/p>\n<h3>3. 概念 3：树与二叉树的等价表示（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。§2.3.2 指出树与二叉树的基本差别：树总有根、不为空，结点可以有任意多个子女；二叉树可以为空，结点至多两个子女且区分左右。有一种自然对应：把每家子女横向链接，删去父母到第一个子女之外的竖直链，再把图顺时针转 <span class=\"katex-inline\">45^\\circ<\/span>，森林就变成一棵二叉树（PDF 第 282 页）。二叉树结点的左链指向第一个子女，右链指向下一个兄弟。<\/p>\n<h3>4. 多重链接结构<\/h3>\n<p>§2.4 讨论结点带好几个链字段的情形（PDF 第 350 页）。前面线性表与树大多只有一两个链字段；高级应用里结构类型同时出现，一个结点既要挂在这条链上，又要挂在那条链上。这一节同时引出一个设计问题：内存里应该显式记录多少结构信息——记录得越多访问越快，重复存储的代价也越高。<\/p>\n<h2>推导一（推演）：顺序表与链表的插入代价对比<\/h2>\n<p>设表长 <span class=\"katex-inline\">n<\/span>，两种表示各做一次&quot;在第 <span class=\"katex-inline\">k<\/span> 个结点之后插入新结点 <span class=\"katex-inline\">x<\/span>&quot;。<\/p>\n<p>顺序分配：元素连续存放，新结点要占第 <span class=\"katex-inline\">k+1<\/span> 个位置，原位置 <span class=\"katex-inline\">k+1,\\dots,n<\/span> 的元素必须整体后移一格。需要移动的元素个数是 <span class=\"katex-inline\">n-k<\/span>；下标定位本身只要一次计算。删除第 <span class=\"katex-inline\">k<\/span> 个结点时对称，把 <span class=\"katex-inline\">k+1,\\dots,n<\/span> 前移一格，移动 <span class=\"katex-inline\">n-k<\/span> 个元素。表尾插入 <span class=\"katex-inline\">k=n<\/span> 时移动 0 个元素，表头插入 <span class=\"katex-inline\">k=1<\/span> 时移动 <span class=\"katex-inline\">n-1<\/span> 个元素。<\/p>\n<p>链接分配：结点里保存链字段。找到第 <span class=\"katex-inline\">k<\/span> 个结点需要沿链走 <span class=\"katex-inline\">k<\/span> 步；定位之后插入只改两个指针：新结点的链指向原后继，原结点的链改指新结点，不挪动任何已有元素。删除时同样先定位，再把前驱的链直接接到后继。链表的代价集中在查找，插入删除动作本身是常数步；代价反过来集中在移动的是顺序表。<\/p>\n<p>空间上，链表每个结点额外存至少一个链字段；顺序表按最大长度预留连续区域，表长波动大时容易出现预留不足或空间闲置。<\/p>\n<h2>推导二（证明方向）：森林与二叉树的一一对应<\/h2>\n<p>先看单棵有序树。根的子女按次序排列，取第一个子女作为二叉树根的左孩子；同一父母的兄弟之间用右链依次相连。把这两条规则用到森林的每一棵树，再把各棵树的根视为兄弟、用右链串起来。<\/p>\n<p>对应是可逆的：从一棵二叉树出发，左链回到&quot;第一个子女&quot;，右链回到&quot;下一个兄弟&quot;，按规则还原出原森林。两个方向映射都唯一，因此树/森林的存储与遍历问题可以转成二叉树问题处理。这一对应解释了为什么书里先在 §2.3.1 把二叉树遍历讲透：遍历结果能翻译回树的先根次序与后根次序，而二叉树结点只需两个链字段，结构简单且无歧义。<\/p>\n<h2>反事实：改掉表示方式会怎样<\/h2>\n<ul><li>\n<strong>顺序表禁止移动元素<\/strong>：若存储区不允许整体搬移，表头插入就无法在连续空间完成；强行不移动会把新元素放到表尾，相对位置语义被破坏。这也是链表在频繁头尾增删场景下被采用的原因。\n<\/li><li>\n<strong>链表随机访问不沿链走<\/strong>：第 <span class=\"katex-inline\">k<\/span> 个结点没有下标可直接算，跳过中间结点就读不到目标；想 <span class=\"katex-inline\">O(1)<\/span> 取任意位置结点，只能回到顺序分配，或在链表上加索引、跳表这类辅助结构。\n<\/li><li>\n<strong>左孩右兄只留一个链字段<\/strong>：只有左链时，兄弟之间失去联系，根的第二个及以后子女无处挂靠；只有右链时，父母与第一个子女的关系丢失。两个链字段分别承担&quot;向下&quot;与&quot;向右&quot;两类关系，缺一个方向信息就还原不出原树。\n<\/li><li>\n<strong>遍历次序把左右子树顺序写反<\/strong>：先序定义为访问根、遍历左、遍历右；若把左右互换，同一棵树会得到另一套序列，且与中序、后序不再是同一棵树的三种视图。次序约定是遍历结果可对照的前提。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章结构表示是第 1 章算法概念的落地对象：线性表与树的操作本身就是算法，插入删除步数分析要用到第 4 章的求和与渐进估计。多重链接为后面编译符号表、稀疏矩阵、操作系统队列等应用铺路；树的递归定义与第 1 章归纳法直接呼应——树按结点数归纳证明性质，遍历按递归结构展开。下一章把视角转到数发生器：余数与整除在那里变成序列周期与均匀性检验。<\/p>", "ch03": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.47<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：基本概念——算法、证明方法、数论工具与置换<\/a><\/span><\/div><h1>第 3 章：起点与随机数——模运算铺垫、线性同余发生器与随机数检验<\/h1>\n<blockquote>对应原书第 1 章 §1.2.4「整数函数与初等数论」（PDF 第 47–51 页；印刷页 = PDF 页 − 17）。说明：线性同余发生器与随机数检验的完整讨论属于原丛书卷 2 第 3 章，本卷未收录；本单元只回收卷一的数论铺垫，发生器与检验部分按通行方法讲解，不挂本卷页码，涉及具体定理条件以通行数论结果为准。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出余数、整除、同余的基本记号，把一个除法写成 <span class=\"katex-inline\">m=qn+r<\/span> 的形式；\n<\/li><li>\n写出线性同余递推 <span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span>，手动算出前若干项，并在小模数上观察周期；\n<\/li><li>\n复述满周期条件的三个方向：增量与模数互素、<span class=\"katex-inline\">a-1<\/span> 被模数的每个素因子整除、模数被 4 整除时 <span class=\"katex-inline\">a-1<\/span> 也被 4 整除；\n<\/li><li>\n解释谱检验在高维格点上看什么，写出 χ² 统计量的算式并说明各项含义；\n<\/li><li>\n说清为什么&quot;序列是随机的&quot;无法被证明，检验只能证伪均匀性假设。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>随机数发生器是一个确定的递推过程：从初值出发，乘子、增量、模数按模运算造出下一项；衡量它不靠感觉，而靠一批统计检验——低维均匀性看谱结构，频数均匀性看 χ² 偏离；任何检验都只能排除不合格的发生器，不能保证剩下的序列&quot;真的随机&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 数论铺垫：余数与整除<\/h3>\n<p>§1.2.4 在整数函数一节进入初等数论：对实数 <span class=\"katex-inline\">x<\/span>，下整 <span class=\"katex-inline\">\\lfloor x\\rfloor<\/span> 是不超过 <span class=\"katex-inline\">x<\/span> 的最大整数，上整 <span class=\"katex-inline\">\\lceil x\\rceil<\/span> 是不小于 <span class=\"katex-inline\">x<\/span> 的最小整数（PDF 第 47 页）。整数除法写成 <span class=\"katex-inline\">m=qn+r<\/span>，<span class=\"katex-inline\">0\\le r&lt;n<\/span>，<span class=\"katex-inline\">r<\/span> 就是 <span class=\"katex-inline\">m<\/span> 除以 <span class=\"katex-inline\">n<\/span> 的余数；<span class=\"katex-inline\">d\\mid m<\/span> 表示 <span class=\"katex-inline\">d<\/span> 整除 <span class=\"katex-inline\">m<\/span>。欧几里得算法反复使用的余数替换，是发生器里模运算的同一套规则。<\/p>\n<h3>2. 概念 1：线性同余发生器的模数选择与周期（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。线性同余发生器（LCG）按 <span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span> 递推。<span class=\"katex-inline\">m<\/span> 是模数，<span class=\"katex-inline\">a<\/span> 是乘子，<span class=\"katex-inline\">c<\/span> 是增量，<span class=\"katex-inline\">X_0<\/span> 是初值。状态空间只有 <span class=\"katex-inline\">m<\/span> 个，序列必然在某一步回到旧状态并进入循环；周期是从初值到首次重复经过的步数。满周期指序列遍历全部 <span class=\"katex-inline\">m<\/span> 个状态再回到初值。<\/p>\n<h3>3. 概念 2：随机数检验的思想（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。检验分两类思路：一类看一维频数是否接近期望，用 χ² 统计量比较观测频数与期望频数；一类看高维结构，谱检验把相邻状态看成格点，考察相邻超平面间距，间距过小说明序列在多维上留有规则痕迹。检验结果是&quot;拒绝/不拒绝均匀假设&quot;，不是&quot;证明随机&quot;。<\/p>\n<h2>推导一（推演）：小模数 LCG 逐项计算与周期观察<\/h2>\n<p>取 <span class=\"katex-inline\">m=16,\\ a=5,\\ c=1,\\ X_0=1<\/span>。递推 <span class=\"katex-inline\">X_{n+1}=(5X_n+1)\\bmod 16<\/span>，逐项计算：<\/p>\n<ul><li>\n<span class=\"katex-inline\">X_1=(5\\cdot1+1)\\bmod16=6<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_2=(5\\cdot6+1)\\bmod16=31\\bmod16=15<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_3=(5\\cdot15+1)\\bmod16=76\\bmod16=12<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_4=(5\\cdot12+1)\\bmod16=61\\bmod16=13<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_5=(5\\cdot13+1)\\bmod16=66\\bmod16=2<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_6=(5\\cdot2+1)\\bmod16=11<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_7=(5\\cdot11+1)\\bmod16=56\\bmod16=8<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_8=(5\\cdot8+1)\\bmod16=41\\bmod16=9<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_9=(5\\cdot9+1)\\bmod16=46\\bmod16=14<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_{10}=(5\\cdot14+1)\\bmod16=71\\bmod16=7<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_{11}=(5\\cdot7+1)\\bmod16=36\\bmod16=4<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_{12}=(5\\cdot4+1)\\bmod16=21\\bmod16=5<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_{13}=(5\\cdot5+1)\\bmod16=26\\bmod16=10<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_{14}=(5\\cdot10+1)\\bmod16=51\\bmod16=3<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_{15}=(5\\cdot3+1)\\bmod16=16\\bmod16=0<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_{16}=(5\\cdot0+1)\\bmod16=1<\/span>，回到初值 <span class=\"katex-inline\">X_0=1<\/span>。\n<\/ul>\n<p>16 个状态 <span class=\"katex-inline\">0,1,\\dots,15<\/span> 各出现一次，周期为 16，等于模数。对照满周期条件方向：<span class=\"katex-inline\">c=1<\/span> 与 <span class=\"katex-inline\">m=16<\/span> 互素；<span class=\"katex-inline\">a-1=4<\/span> 被 16 的素因子 2 整除；16 被 4 整除，<span class=\"katex-inline\">a-1=4<\/span> 也被 4 整除。三个方向同时满足。<\/p>\n<h2>推导二（推演）：χ² 统计量怎样从频数算到偏离值<\/h2>\n<p>把 <span class=\"katex-inline\">[0,1)<\/span> 区间分成 <span class=\"katex-inline\">k<\/span> 个等长类别，生成 <span class=\"katex-inline\">N<\/span> 个随机数，第 <span class=\"katex-inline\">i<\/span> 类观测到 <span class=\"katex-inline\">O_i<\/span> 个。均匀假设下每类期望 <span class=\"katex-inline\">E_i=N/k<\/span>。<\/p>\n<p>统计量定义为：<\/p>\n<div class=\"katex-block\">\\chi^2=\\sum_{i=1}^{k}\\frac{(O_i-E_i)^2}{E_i}<\/div>\n<p>每一项把偏离量 <span class=\"katex-inline\">(O_i-E_i)<\/span> 平方后除以期望：平方消除正负号，除以 <span class=\"katex-inline\">E_i<\/span> 把偏离折算成相对尺度。各类偏离同向累加。若观测完全接近期望，每一项接近 0，统计量接近 0；某一类明显偏多或偏少，对应项变大，总和抬高。对照临界值可以判断是否拒绝均匀假设；类别数、样本量都会影响统计量的参照分布，小样本下 χ² 结论不稳。<\/p>\n<h2>反事实：改掉发生器条件会怎样<\/h2>\n<ul><li>\n<strong>模数取合数、乘子选错<\/strong>：取 <span class=\"katex-inline\">m=8,\\ a=2,\\ c=0,\\ X_0=1<\/span>，序列为 <span class=\"katex-inline\">1\\to2\\to4\\to0\\to0\\cdots<\/span>，第三步后卡在 0，周期只有 1。状态空间 8 个，实际只走过 3 个非零值；这类发生器在低维就显出规则痕迹，频数检验直接暴露。\n<\/li><li>\n<strong>增量 <span class=\"katex-inline\">c<\/span> 与模数不互素<\/strong>：若 <span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">m<\/span> 有公共因子 <span class=\"katex-inline\">d&gt;1<\/span>，序列各项与 <span class=\"katex-inline\">m<\/span> 的 gcd 被 <span class=\"katex-inline\">d<\/span> 约束，部分状态永远进不去，周期不可能达到 <span class=\"katex-inline\">m<\/span>。\n<\/li><li>\n<strong>把&quot;通过检验&quot;当成&quot;证明随机&quot;<\/strong>：一组序列通过了 χ² 频数检验，只说明在这一项观测上没发现偏离；谱检验、游程检验、间距检验可能在另一项上拒绝它。检验是排除工具，合格发生器是&quot;尚未被现有检验否决&quot;的发生器，不是被证明随机的发生器。\n<\/li><li>\n<strong>初值固定却要求每次运行不同<\/strong>：LCG 是确定过程，同一 <span class=\"katex-inline\">X_0<\/span> 产生同一整列序列；不换初值，重复运行得到重复结果，这与随机采样的独立性要求是两回事。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章的模运算直接接第 1 章 gcd 与余数替换；发生器周期分析用到递推与计数，第 4 章的求和、渐进与生成函数是分析这类递推的标准语言。检验思想中的频数比较，在算法分析里同样出现：估平均步数时把输入按类别分组，统计各类占比再加权求和。下一章收拢散在各章的分析方法：怎样估求和量级、怎样写渐进式、怎样把递推转成母函数。<\/p>", "ch04": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.76<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：基本概念——算法、证明方法、数论工具与置换<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：信息结构——线性表、树、二叉树遍历与多重链接<\/a><\/span><\/div><h1>第 4 章：算法分析基础（对应原书第 1 章 §1.2 与第 3 章 §3.5 的分析方法）<\/h1>\n<blockquote>对应原书第 1 章 §1.2.7「调和数」、§1.2.9「生成函数」、§1.2.10「典型算法分析」、*§1.2.11「渐近表示」（PDF 第 76–102 页；印刷页 = PDF 页 − 17）。§3.5 的检验分析方法在卷 2，本单元只做方法层面的收拢，不挂本卷页码。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 1、2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出调和数 <span class=\"katex-inline\">H_n<\/span> 的定义，用分组求和给出 <span class=\"katex-inline\">H_{2^m}\\ge 1+m/2<\/span> 的下界方向，用积分比较估出 <span class=\"katex-inline\">H_n<\/span> 的对数量级；\n<\/li><li>\n复述 <span class=\"katex-inline\">H_n=\\ln n+\\gamma+O(1/n)<\/span> 的结构，说出 <span class=\"katex-inline\">\\gamma<\/span> 是欧拉常数，各项修正的位置；\n<\/li><li>\n对给定数列建立生成函数 <span class=\"katex-inline\">G(z)=\\sum_{n\\ge0}a_n z^n<\/span>，把一阶递推转化为 <span class=\"katex-inline\">G(z)<\/span> 的代数方程并取系数；\n<\/li><li>\n读懂大 O 记号的定义：存在正常数 <span class=\"katex-inline\">M,n_0<\/span> 使 <span class=\"katex-inline\">|x_n|\\le M|f(n)|<\/span>，说清大 O 为什么是单向包含；\n<\/li><li>\n按 §1.2.10 的路子走一遍典型算法分析：设输入规模、计数关键操作、求和得到表达式、再做渐进估计。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>算法分析把&quot;跑多久&quot;变成可计算的量：先对操作计数求和，再用调和数、积分比较、大 O 记号把精确表达式压成量级；生成函数则是另一套工具，把整列递推数装进一个幂级数，用代数运算代替逐项归纳。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：调和数与求和渐进（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c11.md\" target=\"_blank\" rel=\"noopener\">概念 c11<\/a>。§1.2.7 定义 <span class=\"katex-inline\">H_n=1+1/2+\\cdots+1/n=\\sum_{k=1}^{n}1/k<\/span>（PDF 第 76 页）。逐项看 <span class=\"katex-inline\">1/k<\/span> 趋向 0，但累加不会收敛：按二的幂分组可得 <span class=\"katex-inline\">H_{2^m}\\ge 1+m/2<\/span>。更精细的近似为 <span class=\"katex-inline\">H_n=\\ln n+\\gamma+1/(2n)-1/(12n^2)+1/(120n^4)-\\epsilon<\/span>，其中 <span class=\"katex-inline\">0&lt;\\epsilon&lt;1/(252n^6)<\/span>，<span class=\"katex-inline\">\\gamma=0.5772156649\\ldots<\/span> 为欧拉常数。<\/p>\n<h3>2. 概念 2：生成函数入门（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c12.md\" target=\"_blank\" rel=\"noopener\">概念 c12<\/a>。§1.2.9 对数列 <span class=\"katex-inline\">\\langle a_n\\rangle<\/span> 建立 <span class=\"katex-inline\">G(z)=a_0+a_1z+a_2z^2+\\cdots=\\sum_{n\\ge0}a_n z^n<\/span>（PDF 第 86 页）。一个函数承载整列数；递推定义的数列可以先转成 <span class=\"katex-inline\">G(z)<\/span> 的方程，解出 <span class=\"katex-inline\">G(z)<\/span> 后再取 <span class=\"katex-inline\">z^n<\/span> 系数。书里列出生成函数的基本运算：加法 <span class=\"katex-inline\">\\alpha G(z)+\\beta H(z)<\/span> 对应数列逐项线性组合；移位 <span class=\"katex-inline\">z^mG(z)<\/span> 对应数列右移 <span class=\"katex-inline\">m<\/span> 位。<\/p>\n<h3>3. 典型算法分析的路子<\/h3>\n<p>§1.2.10 用&quot;找出最大值&quot;的算法 M 演示分析流程（PDF 第 93 页）：给定 <span class=\"katex-inline\">n<\/span> 个元素 <span class=\"katex-inline\">X[1],\\dots,X[n]<\/span>，从 <span class=\"katex-inline\">j\\leftarrow n,\\ k\\leftarrow n-1,\\ m\\leftarrow X[n]<\/span> 开始，逐个比较 <span class=\"katex-inline\">X[k]<\/span> 与 <span class=\"katex-inline\">m<\/span>，更大则更新 <span class=\"katex-inline\">j,m<\/span>，<span class=\"katex-inline\">k<\/span> 递减直到 0。分析时先定义要计数的操作（比较次数、更新次数），再对所有输入或随机输入求和，最后把表达式压成渐进量级。大 O 记号在 §1.2.11.1 给出：<span class=\"katex-inline\">x_n=O(f(n))<\/span> 表示存在正常数 <span class=\"katex-inline\">M<\/span> 与 <span class=\"katex-inline\">n_0<\/span>，<span class=\"katex-inline\">n\\ge n_0<\/span> 时 <span class=\"katex-inline\">|x_n|\\le M|f(n)|<\/span>（PDF 第 102 页）。<\/p>\n<h2>推导一（证明方向）：调和数的下界与对数量级<\/h2>\n<p>下界分组：把 <span class=\"katex-inline\">H_{2^m}<\/span> 按相邻二的幂分段。<\/p>\n<div class=\"katex-block\">H_{2^m}=1+\\sum_{j=1}^{2^m}\\frac1j=1+\\underbrace{\\left(\\frac12\\right)}_{j=2}+\\underbrace{\\left(\\frac13+\\frac14\\right)}_{j=3,4}+\\underbrace{\\left(\\frac15+\\cdots+\\frac18\\right)}_{j=5\\dots8}+\\cdots+\\underbrace{\\left(\\frac1{2^{m-1}+1}+\\cdots+\\frac1{2^m}\\right)}_{j=2^{m-1}+1\\dots2^m}<\/div>\n<p>第 <span class=\"katex-inline\">t<\/span> 段（<span class=\"katex-inline\">2^{t-1}&lt;j\\le 2^t<\/span>）有 <span class=\"katex-inline\">2^{t-1}<\/span> 项，每项不小于 <span class=\"katex-inline\">1/2^t<\/span>，所以该段和 <span class=\"katex-inline\">\\ge 2^{t-1}/2^t=1/2<\/span>。共 <span class=\"katex-inline\">m<\/span> 段，加上首项 1，得 <span class=\"katex-inline\">H_{2^m}\\ge 1+m/2<\/span>。<\/p>\n<p>上界用积分比较：对递减函数 <span class=\"katex-inline\">1/x<\/span>，区间 <span class=\"katex-inline\">[k-1,k]<\/span> 上 <span class=\"katex-inline\">1/x\\le 1/(k-1)<\/span>（<span class=\"katex-inline\">k\\ge2<\/span>），于是<\/p>\n<div class=\"katex-block\">H_n=1+\\sum_{k=2}^{n}\\frac1k\\le 1+\\int_{1}^{n}\\frac{dx}{x}=1+\\ln n<\/div>\n<p>夹在 <span class=\"katex-inline\">1+m/2<\/span>（<span class=\"katex-inline\">n=2^m<\/span>）与 <span class=\"katex-inline\">1+\\ln n<\/span> 之间，<span class=\"katex-inline\">H_n<\/span> 的量级确定为 <span class=\"katex-inline\">\\ln n<\/span>。这组上下界证明了主项是对数增长，常数项 <span class=\"katex-inline\">\\gamma<\/span> 不在分组比较内出现；更精细的常数项由欧拉-麦克劳林方向给出：<span class=\"katex-inline\">H_n=\\ln n+\\gamma+1/(2n)+O(1/n^2)<\/span>。<\/p>\n<h2>推导二（推演）：把斐波那契递推转成生成函数<\/h2>\n<p>设 <span class=\"katex-inline\">F_0=0,\\ F_1=1,\\ F_{n+2}=F_{n+1}+F_n\\ (n\\ge0)<\/span>，生成函数 <span class=\"katex-inline\">G(z)=\\sum_{n\\ge0}F_n z^n<\/span>。<\/p>\n<p>先写三个移位形式：<\/p>\n<div class=\"katex-block\">G(z)=F_0+F_1z+\\sum_{n\\ge2}F_n z^n<\/div>\n<div class=\"katex-block\">zG(z)=\\sum_{n\\ge0}F_n z^{n+1}=\\sum_{n\\ge1}F_{n-1}z^n<\/div>\n<div class=\"katex-block\">z^2G(z)=\\sum_{n\\ge0}F_n z^{n+2}=\\sum_{n\\ge2}F_{n-2}z^n<\/div>\n<p>把递推 <span class=\"katex-inline\">F_n=F_{n-1}+F_{n-2}<\/span>（<span class=\"katex-inline\">n\\ge2<\/span>）逐项乘 <span class=\"katex-inline\">z^n<\/span> 求和：<\/p>\n<div class=\"katex-block\">\\sum_{n\\ge2}F_n z^n=\\sum_{n\\ge2}F_{n-1}z^n+\\sum_{n\\ge2}F_{n-2}z^n<\/div>\n<p>左侧 <span class=\"katex-inline\">=G(z)-F_0-F_1z=G(z)-z<\/span>；右侧第一项 <span class=\"katex-inline\">=zG(z)-F_0z=zG(z)<\/span>；第二项 <span class=\"katex-inline\">=z^2G(z)<\/span>。整理：<\/p>\n<div class=\"katex-block\">G(z)-z=zG(z)+z^2G(z)<\/div>\n<div class=\"katex-block\">G(z)(1-z-z^2)=z<\/div>\n<div class=\"katex-block\">G(z)=\\frac{z}{1-z-z^2}<\/div>\n<p>右端展开后 <span class=\"katex-inline\">z^n<\/span> 的系数即 <span class=\"katex-inline\">F_n<\/span>；系数等式可用归纳法逐项证明与递推一致。需要通项时再做部分分式或系数提取；母函数把&quot;递推对所有 <span class=\"katex-inline\">n<\/span> 成立&quot;压缩成一条代数等式。<\/p>\n<h2>反事实：改掉分析约定会怎样<\/h2>\n<ul><li>\n<strong>只看精确表达式不做渐进<\/strong>：算法比较停留在 <span class=\"katex-inline\">T(n)=\\sum_{k=1}
