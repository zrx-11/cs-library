<\/span>（<span class=\"katex-inline\">n\\ge1<\/span>）。<span class=\"katex-inline\">B(z)-1=zB(z)+\\sum nz^n<\/span>，而 <span class=\"katex-inline\">\\sum nz^n=z/(1-z)^2<\/span>；整理 <span class=\"katex-inline\">B(z)=1/(1-z)+z/(1-z)^2<\/span>，系数即 <span class=\"katex-inline\">1+n<\/span>，与累加 <span class=\"katex-inline\">1+\\cdots+n<\/span> 加 1 一致。<\/p>\n<h2>推演补充：收敛半径与形式运算<\/h2>\n<p>形式幂级数层只做代数操作：加法、移位、卷积、可逆除法按系数匹配，不要求 <span class=\"katex-inline\">z<\/span> 取具体值。一旦要代入 <span class=\"katex-inline\">z=z_0<\/span> 求值、用微积分结论（求导、积分交换求和），先核验收敛半径：级数在 <span class=\"katex-inline\">z_0<\/span> 收敛则 <span class=\"katex-inline\">|z|&lt;|z_0|<\/span> 内收敛；非零收敛等价于 <span class=\"katex-inline\">\\sqrt[n]{|a_n|}<\/span> 有界。<\/p>\n<p>书里指出：用母函数求解时通常不必先担心收敛性，找到解后可独立证明正确性；多项式与有理母函数的系数等式，可由归纳法逐项核验，不依赖级数收敛结论。这一分工把形式运算与数值求值分开处理。<\/p>\n<h2>补充对照：母函数与其他计数工具<\/h2>\n<p>递推直接展开：适合项数少、递推简单的情形，项数一大就冗长。差分方程与特征根：常系数线性递推可直接求根写通项，与母函数结果等价；变系数递推特征根法不适用，母函数更灵活。组合枚举：按分类直接计数，分类复杂时母函数把分类乘积转成级数乘积。<\/p>\n<p>母函数的强项是把递推与计数都压成代数操作；代价是代数整理步骤多，初值边界容易漏。拿到母函数解后，回代前几项与直接枚举对照，是最低成本的核验。<\/p>\n<h2>补充算例：斐波那契母函数系数核验<\/h2>\n<p><span class=\"katex-inline\">G(z)=z/(1-z-z^2)<\/span>。分母展开：<span class=\"katex-inline\">1/(1-z-z^2)=1+(z+z^2)+(z+z^2)^2+\\cdots<\/span>，乘 <span class=\"katex-inline\">z<\/span> 后系数：<span class=\"katex-inline\">[z^1]G=1<\/span>，<span class=\"katex-inline\">[z^2]G=1<\/span>，<span class=\"katex-inline\">[z^3]G=2<\/span>，<span class=\"katex-inline\">[z^4]G=3<\/span>，<span class=\"katex-inline\">[z^5]G=5<\/span>，对应 <span class=\"katex-inline\">F_1=1,F_2=1,F_3=2,F_4=3,F_5=5<\/span>。系数递推 <span class=\"katex-inline\">F_n=F_{n-1}+F_{n-2}<\/span> 与分母 <span class=\"katex-inline\">1-z-z^2<\/span> 逐项匹配。<\/p><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：基本概念：算法、证明方法、数论工具与置换<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：基本概念——算法、证明方法、数论工具与置换<\/a><br>检查点：能说出算法五条特征，写出归纳法两步并指出缺基础步的后果，手算一次 gcd 全过程，把给定置换写成轮换并数出逆序<\/li><li class='path-step' id='path-02'><strong>步骤 02：信息结构：线性表、树、二叉树遍历与多重链接<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：信息结构——线性表、树、二叉树遍历与多重链接<\/a><br>检查点：能对比顺序分配与链接分配在插入删除时的代价，画出左孩右兄对应关系，对给定二叉树给出先序、中序、后序输出<\/li><li class='path-step' id='path-03'><strong>步骤 03：起点与随机数：模运算铺垫、同余发生器与检验思想<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：起点与随机数——模运算铺垫、线性同余发生器与随机数检验<\/a><br>检查点：能写出线性同余递推并算出前若干项，说清满周期的三个条件方向，解释谱检验与 χ² 统计量在测什么，以及为什么随机只能测不能证<\/li><li class='path-step' id='path-04'><strong>步骤 04：算法分析基础：调和数、求和渐进、生成函数与大 O<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：算法分析基础（对应原书第 1 章 §1.2 与第 3 章 §3.5 的分析方法）<\/a><br>检查点：能用积分比较估 H_n 量级，写出调和数渐进式，把一个一阶递推转成生成函数并取系数，读懂大 O 记号的单向包含关系<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='算法（algorithm）'>算法（algorithm） — 对一类问题给出的、由有限条明确指令组成的操作序列；Knuth 概括为具备有限性、确定性、输入、输出、可行性五条特征 <span class=glossary-ref>（第 1 章：基本概念——算法、证明方法、数论工具与置换）<\/span><\/li><li data-term='有限性（有穷性）'>有限性（有穷性） — 算法必须在执行有限步之后终止；只满足其余四条特征、但可能不终止的过程称为计算方法，而非算法 <span class=glossary-ref>（第 1 章：基本概念——算法、证明方法、数论工具与置换）<\/span><\/li><li data-term='确定性'>确定性 — 算法每一步要执行的操作都给出严格无歧义的说明；用自然语言描述时读者理解可能有出入，因此关键算法常同时配机器语言程序 <span class=glossary-ref>（第 1 章：基本概念——算法、证明方法、数论工具与置换）<\/span><\/li><li data-term='mix'>MIX — 书中设计的一台虚拟精简指令计算机，记号 1009；数据单位为字节，同时兼容二进制与十进制视角，用于在不依赖特定真机的前提下描述算法与计步 <span class=glossary-ref>（第 1 章：基本概念——算法、证明方法、数论工具与置换）<\/span><\/li><li data-term='数学归纳法'>数学归纳法 — 证明命题 $P(n)$ 对所有正整数成立的方法：先证基础步 $P(1)$，再证归纳步——若 $P(1),\\dots,P(n)$ 全为真则 $P(n+1)$ 为真；另有强归纳形式 <span class=glossary-ref>（第 1 章：基本概念——算法、证明方法、数论工具与置换）<\/span><\/li><li data-term='最大公约数（gcd）'>最大公约数（gcd） — 同时整除 $m$ 和 $n$ 的最大正整数；欧几里得算法反复用余数替换，过程中 gcd 保持不变 <span class=glossary-ref>（第 1 章：基本概念——算法、证明方法、数论工具与置换）<\/span><\/li><li data-term='置换（排列）'>置换（排列） —  $n$ 个不同对象排成一行的一种排放方式；$n$ 元置换共有 $n!$ 个，可用轮换分解表示 <span class=glossary-ref>（第 1 章：基本概念——算法、证明方法、数论工具与置换）<\/span><\/li><li data-term='轮换分解'>轮换分解 — 把置换写成若干互不相交轮换的乘积；每个轮换 $(a_1\\ a_2\\ \\dots\\ a_k)$ 表示 $a_1\\to a_2,\\dots,a_k\\to a_1$ <span class=glossary-ref>（第 1 章：基本概念——算法、证明方法、数论工具与置换）<\/span><\/li><li data-term='线性表（linear list）'>线性表（linear list） —  $n\\ge 0$ 个结点排成一行的序列；只关心各项相对位置，第一结点为 $X[1]$，最后一结点为 $X[n]$ <span class=glossary-ref>（第 2 章：信息结构——线性表、树、二叉树遍历与多重链接）<\/span><\/li><li data-term='顺序分配 / 链接分配'>顺序分配 / 链接分配 — 顺序分配把表元素连续存放在数组式存储区；链接分配在每个结点里放链字段，用指针把结点串起来；两者在随机访问与插入删除上代价相反 <span class=glossary-ref>（第 2 章：信息结构——线性表、树、二叉树遍历与多重链接）<\/span><\/li><li data-term='二叉树'>二叉树 — 结点的有限集：或者为空，或者由一个根和两棵互不相交的二叉树（左子树、右子树）组成；左右子树有次序之分 <span class=glossary-ref>（第 2 章：信息结构——线性表、树、二叉树遍历与多重链接）<\/span><\/li><li data-term='遍历（traversal）'>遍历（traversal） — 系统地考察树的结点，使每个结点恰被访问一次；二叉树有先序、中序、后序三种递归次序 <span class=glossary-ref>（第 2 章：信息结构——线性表、树、二叉树遍历与多重链接）<\/span><\/li><li data-term='线性同余发生器（lcg）'>线性同余发生器（LCG） — 按递推 $X_{n+1}=(aX_n+c)\\bmod m$ 产生序列的方法；$m$ 为模数，$a$ 为乘子，$c$ 为增量 <span class=glossary-ref>（第 3 章：起点与随机数——模运算铺垫、线性同余发生器与随机数检验）<\/span><\/li><li data-term='谱检验（spectral test）'>谱检验（spectral test） — 从高维格点分布角度检验发生器：考察相邻超平面之间的距离，距离过小或格点结构规则说明序列在高维上可被预测 <span class=glossary-ref>（第 3 章：起点与随机数——模运算铺垫、线性同余发生器与随机数检验）<\/span><\/li><li data-term='χ² 统计量'>χ² 统计量 —  $\\sum_i (O_i-E_i)^2/E_i$，其中 $O_i$ 为第 $i$ 类观测频数、$E_i$ 为期望频数；数值越大，观测分布与均匀期望偏离越远 <span class=glossary-ref>（第 3 章：起点与随机数——模运算铺垫、线性同余发生器与随机数检验）<\/span><\/li><li data-term='调和数 $h_n$'>调和数 $H_n$ —  $H_n=1+1/2+\\cdots+1/n=\\sum_{k=1}^{n}1/k$；量级为 $\\ln n+\\gamma$，$\\gamma$ 为欧拉常数 <span class=glossary-ref>（第 4 章：算法分析基础（对应原书第 1 章 §1.2 与第 3 章 §3.5 的分析方法））<\/span><\/li><li data-term='生成函数（母函数）'>生成函数（母函数） — 对数列 $\\langle a_n\\rangle$ 建立幂级数 $G(z)=\\sum_{n\\ge 0}a_n z^n$，用一个函数承载整列数；递推关系可转化为 $G(z)$ 的代数方程 <span class=glossary-ref>（第 4 章：算法分析基础（对应原书第 1 章 §1.2 与第 3 章 §3.5 的分析方法））<\/span><\/li><li data-term='大 o 记号'>大 O 记号 —  $x_n=O(f(n))$ 表示存在正常数 $M$ 与 $n_0$，使 $n\\ge n_0$ 时 $|x_n|\\le M|f(n)|$；大 O 是单向包含关系，不能反向写等号 <span class=glossary-ref>（第 4 章：算法分析基础（对应原书第 1 章 §1.2 与第 3 章 §3.5 的分析方法））<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：判一段描述是不是算法，先逐条核五条特征<\/h2>\n<p>拿到一段过程描述，依次核对：是否在有限步内终止（有限性）；每一步操作是否无歧义（确定性）；是否有明确输入与输出；每一步是否在有限时间内可行。五条全满足才是算法；缺有限性、其余四条齐备的过程只是计算方法，可能停不下来。检查时把&quot;理论上可执行&quot;与&quot;有限步内完成&quot;分开：可行性看单步能否执行，有限性看总步数是否有上界。<\/p>\n<h2>模式 2：证明数列命题走归纳法，先立基础步再推归纳步<\/h2>\n<p>证明 <span class=\"katex-inline\">P(n)<\/span> 对所有正整数成立，先把 <span class=\"katex-inline\">n=1<\/span>（或对应起点）代进命题验真；再写归纳步：假设 <span class=\"katex-inline\">P(1),\\dots,P(n)<\/span> 为真，推出 <span class=\"katex-inline\">P(n+1)<\/span>。基础步与归纳步缺一不可：只写 <span class=\"katex-inline\">P(n)\\Rightarrow P(n+1)<\/span> 而不验基础，命题可能从假起点一路推出假结论。强归纳把假设扩到前 <span class=\"katex-inline\">n<\/span> 项；用普通归纳能推的命题不强行上强归纳，假设范围要与递推结构匹配。<\/p>\n<h2>模式 3：求 gcd 沿余数链替换，全程保住 gcd 不变量<\/h2>\n<p><span class=\"katex-inline\">\\gcd(m,n)<\/span> 与 <span class=\"katex-inline\">\\gcd(n,m\\bmod n)<\/span> 相等是整条算法的不变量：每轮用余数替换大数，余数严格小于原除数，数值递减保证终止；末轮余数为 0 时，当前非零余数即 gcd。估步数时沿最慢的斐波那契型余数链对照，得到 <span class=\"katex-inline\">O(\\log\\min(m,n))<\/span> 的量级。写实现先处理 <span class=\"katex-inline\">n=0<\/span> 退化情形，再进入主循环。<\/p>\n<h2>模式 4：置换先画映射箭头，再沿未标记元素写成轮换<\/h2>\n<p>把集合元素按原排列对齐，逐元素画 <span class=\"katex-inline\">\\sigma<\/span> 箭头；从尚未走过的元素出发，沿箭头回到起点即得一个轮换，轮换内元素顺序沿箭头方向写；标出已用元素，换下一个起点。多个互不相交轮换并列即完成分解。数逆序对时逐对比较前面元素是否大于后面元素，累计成对计数；相邻交换排序的最少次数等于逆序对数。<\/p>\n<h2>模式 5：选线性表表示先看访问模式，再比两类代价<\/h2>\n<p>先统计最频繁的操作：随机读多、表长稳定，选顺序分配；增删集中、长度不定，选链接分配。顺序分配随机访问一次定位，插入删除要搬移后继元素；链接分配定位要沿链走，插入删除只改链字段。混合需求再上辅助结构：链表加索引块改善随机访问，顺序表批量重排抑制碎片。决策不脱离操作频次谈哪种表更好。<\/p>\n<h2>模式 6：树与森林转二叉树，左孩挂长子、右链挂兄弟<\/h2>\n<p>任意分支度的树统一成二叉树表示：结点左链挂第一个子女，右链挂下一个兄弟；森林的根之间也用右链相连。反向还原时左链回长子，右链回下一兄弟（或下一棵根）。遍历二叉树先定访问次序：先序复制与序列化，后序子树汇总与销毁，中序在搜索树上取有序序列；次序选错，访问动作再正确也拿不到目标序列。<\/p>\n<h2>模式 7：设计发生器先核周期条件，再交统计检验把关<\/h2>\n<p>线性同余递推 <span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span> 先核参数结构与模数互素关系，确认可达状态数与周期长度；周期只说明状态不重复，不保证数值均匀。分布层再交检验：频数看边缘分布，谱检验看高维格点结构，游程与滞后相关看相邻趋势。检验结论是与均匀假设不冲突，不能写成&quot;证明随机&quot;；检验失败先排除实现错误，再调参数或换发生器。<\/p>\n<h2>模式 8：估求和量级先认通项类型，再选工具压渐进<\/h2>\n<p>拿到有限和先判断通项：<span class=\"katex-inline\">k^p<\/span> 型主项 <span class=\"katex-inline\">O(n^{p+1})<\/span>，<span class=\"katex-inline\">1/k<\/span> 型主项 <span class=\"katex-inline\">O(\\ln n)<\/span>，<span class=\"katex-inline\">r^k<\/span> 型主项 <span class=\"katex-inline\">O(r^n)<\/span>。多项式求和用公式或积分，倒数和用分组加积分比较，几何和用闭式。含递推数列时，建母函数 <span class=\"katex-inline\">G(z)=\\sum a_nz^n<\/span>，移位乘 <span class=\"katex-inline\">z<\/span> 后整理成代数方程，解出闭式再取系数；解完回代前几项与直接枚举对照核验。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 基本概念<\/strong>：算法五特征与 MIX、归纳法、欧几里得算法、置换与逆序、整除性（PDF 第 18、19、20、25、47、52、116 页起；印刷页 = PDF 页 − 17）。\n<\/li><li>\n<strong>第 2 章 信息结构<\/strong>：线性表顺序/链接分配、树与左孩右兄表示、二叉树三序遍历、多重链接（PDF 第 204、208、262、270、282、350 页起）。\n<\/li><li>\n<strong>第 3 章 起点与随机数<\/strong>：模运算铺垫、线性同余发生器、谱检验与 χ² 检验（模运算对应 PDF 第 47 页；发生器与检验完整讨论属卷 2 第 3 章，本卷不挂页码）。\n<\/li><li>\n<strong>第 4 章 算法分析基础<\/strong>：调和数与求和渐进、大 O 记号、典型算法分析、生成函数入门（PDF 第 76、79、86、93、102 页起）。\n<\/ul>\n<h2>算法五特征速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>特征<\/th><th>含义<\/th><th>缺失后果<\/th><\/tr><\/thead><tbody><tr><td>有限性<\/td><td>有限步内终止<\/td><td>停不下来，只是计算方法不是算法<\/td><\/tr><tr><td>确定性<\/td><td>每步操作无歧义<\/td><td>不同读者执行结果分叉<\/td><\/tr><tr><td>输入<\/td><td>给出外部输入<\/td><td>过程无作用对象<\/td><\/tr><tr><td>输出<\/td><td>给出与输入相关的结果<\/td><td>无信息返回<\/td><\/tr><tr><td>可行性<\/td><td>每步可在有限时间内执行<\/td><td>单步不可完成<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>归纳法三种形式<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>形式<\/th><th>基础步<\/th><th>归纳步假设<\/th><th>适用<\/th><\/tr><\/thead><tbody><tr><td>普通归纳<\/td><td><span class=\"katex-inline\">P(1)<\/span> 为真<\/td><td><span class=\"katex-inline\">P(n)<\/span> 为真 → <span class=\"katex-inline\">P(n+1)<\/span><\/td><td>递推只依赖前一项<\/td><\/tr><tr><td>强归纳<\/td><td><span class=\"katex-inline\">P(1)<\/span> 为真<\/td><td><span class=\"katex-inline\">P(1),\\dots,P(n)<\/span> 全真 → <span class=\"katex-inline\">P(n+1)<\/span><\/td><td>递推依赖更早多项<\/td><\/tr><tr><td>起始偏移<\/td><td><span class=\"katex-inline\">P(n_0)<\/span> 为真<\/td><td>从 <span class=\"katex-inline\">n_0<\/span> 起递推<\/td><td>命题从某个起点才成立<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>欧几里得算法链<\/h2>\n<ul><li>\n不变量：<span class=\"katex-inline\">\\gcd(m,n)=\\gcd(n,m\\bmod n)<\/span>。\n<\/li><li>\n终止：余数严格递减，末轮余数 0，当前非零余数即 gcd。\n<\/li><li>\n算例 <span class=\"katex-inline\">\\gcd(544,119)<\/span>：<span class=\"katex-inline\">544=4\\times119+68<\/span>；<span class=\"katex-inline\">119=1\\times68+51<\/span>；<span class=\"katex-inline\">68=1\\times51+17<\/span>；<span class=\"katex-inline\">51=3\\times17+0<\/span>，返回 17，四次除法。\n<\/li><li>\n量级：<span class=\"katex-inline\">O(\\log\\min(m,n))<\/span>，最慢链条对照斐波那契数。\n<\/ul>\n<h2>线性表分配对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>操作<\/th><th>顺序分配<\/th><th>链接分配<\/th><\/tr><\/thead><tbody><tr><td>按下标访问<\/td><td>一次偏移定位<\/td><td>沿链走 <span class=\"katex-inline\">O(n)<\/span> 步<\/td><\/tr><tr><td>定位后插入<\/td><td>后继元素搬移 <span class=\"katex-inline\">O(n)<\/span><\/td><td>两次改链，常数步<\/td><\/tr><tr><td>定位后删除<\/td><td>后继前移 <span class=\"katex-inline\">O(n)<\/span><\/td><td>一次改链；需先找前驱<\/td><\/tr><tr><td>空间<\/td><td>预留容量，闲置部分占空间<\/td><td>每结点挂链字段，有分配碎片<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>二叉树三序遍历<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>次序<\/th><th>访问顺序<\/th><th>典型用途<\/th><\/tr><\/thead><tbody><tr><td>先序<\/td><td>根 → 左子树 → 右子树<\/td><td>复制、序列化、前缀表达式<\/td><\/tr><tr><td>中序<\/td><td>左子树 → 根 → 右子树<\/td><td>搜索树有序输出、中缀表达式<\/td><\/tr><tr><td>后序<\/td><td>左子树 → 右子树 → 根<\/td><td>子树汇总、销毁、后缀表达式<\/td><\/tr><\/tbody><\/table><\/div>\n<p>样例树先序 <code>A B D C E G F H J<\/code>（PDF 270 序列 3），中序 <code>D B A E G C H F J<\/code>（PDF 271 序列 4），后序 <code>D B G E H J F C A<\/code>（PDF 271 序列 5）；E 的右孩子为 G，E 左空。<\/p>\n<h2>线性同余发生器<\/h2>\n<ul><li>\n递推：<span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span>。\n<\/li><li>\n满周期算例：<span class=\"katex-inline\">m=16,\\ a=5,\\ c=1,\\ X_0=1<\/span>，周期 16。\n<\/li><li>\n崩溃算例：<span class=\"katex-inline\">m=8,\\ a=2,\\ c=0,\\ X_0=1<\/span>，序列 <span class=\"katex-inline\">1,2,4,0,0<\/span>，周期 1。\n<\/li><li>\n模数取合数、乘子过小、增量为零都会压缩可达状态；低位比特质量通常弱于高位。\n<\/ul>\n<h2>随机数检验速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>检验<\/th><th>侧面<\/th><th>统计量/判据<\/th><\/tr><\/thead><tbody><tr><td>频数（χ²）<\/td><td>各类边缘分布<\/td><td><span class=\"katex-inline\">\\chi^2=\\sum_i (O_i-E_i)^2/E_i<\/span><\/td><\/tr><tr><td>谱检验<\/td><td>高维格点均匀性<\/td><td>相邻超平面间距，过小提示聚集<\/td><\/tr><tr><td>游程检验<\/td><td>相邻趋势粘连<\/td><td>升降段长度分布<\/td><\/tr><tr><td>滞后相关<\/td><td>长程依赖<\/td><td><span class=\"katex-inline\">X_n<\/span> 与 <span class=\"katex-inline\">X_{n+k}<\/span> 相关程度<\/td><\/tr><\/tbody><\/table><\/div>\n<p>结论边界：检验只判断样本与均匀假设是否冲突；有限样本不能证明序列随机。<\/p>\n<h2>求和与母函数公式<\/h2>\n<ul><li>\n调和数：<span class=\"katex-inline\">H_n=\\sum_{k=1}^{n}1/k=\\ln n+\\gamma+1/(2n)+O(1/n^2)<\/span>，<span class=\"katex-inline\">\\gamma\\approx0.5772156649<\/span>。\n<\/li><li>\n算例：<span class=\"katex-inline\">H_{10}=7381/2520\\approx2.9290<\/span>。\n<\/li><li>\n母函数：<span class=\"katex-inline\">G(z)=\\sum_{n\\ge0}a_nz^n<\/span>；移位 <span class=\"katex-inline\">zG(z)=\\sum_{n\\ge1}a_{n-1}z^n<\/span>。\n<\/li><li>\n斐波那契：<span class=\"katex-inline\">F_0=0,\\ F_1=1,\\ F_{n+2}=F_{n+1}+F_n<\/span>，<span class=\"katex-inline\">G(z)=z/(1-z-z^2)<\/span>。\n<\/li><li>\n大 O：<span class=\"katex-inline\">x_n=O(f(n))<\/span> 表示 <span class=\"katex-inline\">n\\ge n_0<\/span> 时 <span class=\"katex-inline\">|x_n|\\le M|f(n)|<\/span>，单向包含，不能反写等号。\n<\/ul>\n<h2>关键故障对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>漏了哪一步<\/th><th>后果<\/th><\/tr><\/thead><tbody><tr><td>归纳法不验基础步<\/td><td>从假起点推出假命题，证明无效<\/td><\/tr><tr><td>强归纳假设范围小于递推需要<\/td><td>归纳步推不出，链条中断<\/td><\/tr><tr><td>gcd 实现不处理 <span class=\"katex-inline\">n=0<\/span><\/td><td>主循环除零错误<\/td><\/tr><tr><td>把周期长误当分布均匀<\/td><td>发生器可能在高维上规则聚集，漏检<\/td><\/tr><tr><td>χ² 类别划得过细<\/td><td>单项期望频数不足，统计量失真<\/td><\/tr><tr><td>把&quot;检验通过&quot;写成&quot;证明随机&quot;<\/td><td>证据标准混淆，结论越界<\/td><\/tr><tr><td>母函数漏摘边界项<\/td><td>方程常数项错位，系数结果全偏<\/td><\/tr><tr><td>树表示把右链当子女链<\/td><td>还原森林时兄弟与子女关系混淆<\/td><\/tr><\/tbody><\/table><\/div>"}};

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

      } else if(type==='multi'){

        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];

      } else if(type==='blank'){

      }
      item.querySelectorAll('input:checked').forEach(i=>{

      });

      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  if(typeof vis !== 'undefined'){ networkLoaded = true; cb(); return; }
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE) { cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库未加载：离线构建请加 <code>--offline all</code>，或联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

function getMastery(cid){
  if(!cid) return 0.5;

function updateMastery(cid, delta){

/* ---------- 搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIndex = null;
let pendingHl = [];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP = new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                        '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                        '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw = q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out = [];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length > 2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low = text.toLowerCase();
  let pos = -1, hit = '';
  for(const t of terms){ const i = low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start = Math.max(0, (pos<0?0:pos) - 60);
  const end = Math.min(text.length, (pos<0?0:pos) + 140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms = pendingHl.slice(); pendingHl = [];
  if(!terms.length) return;
  const root = $('#view'); if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first = null, idx = -1, term = '';
  while((node = walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low = node.nodeValue.toLowerCase();
    for(const t of terms){
      const i = low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){
        first = node; idx = i; term = t;
      }
    }
  }
  if(!first) return;
  try{
    const i = first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range = document.createRange();
    range.setStart(first, i); range.setEnd(first, i+term.length);
    const mark = document.createElement('mark');
    mark.className = 'hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'), 1800);
  }catch(e){}
}
document.addEventListener('click', (e)=>{
  const a = (e.target && e.target.closest) ? e.target.closest('.search-hit a') : null;
  if(a && a.dataset.hl) pendingHl = tokenizeQuery(a.dataset.hl);
});
function searchHref(id){
  const map = {'__path__':'#/path','__diagnosis__':'#/diagnosis','__graph__':'#/graph',
               '__cards__':'#/cards','__glossary__':'#/glossary','__patterns__':'#/patterns',
               '__cheatsheet__':'#/cheatsheet'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '#/quiz/'+id.replace('__quiz_','').replace(/__$/,'');
  if(id.startsWith('__')) return '';
  return '#/'+id;
}
function searchLabel(id){
  if((manifest.chapters||[]).some(c=>c.id===id)) return '章节：'+id;
  if((manifest.concepts||[]).some(c=>c.id===id)) return '概念：'+id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '测验';
  return id;
}
function pageTitle(id){
  const ch = (manifest.chapters||[]).find(c=>c.id===id);
  if(ch) return ch.title || id;
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp) return cp.title || id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')){
    const q = (manifest.quizzes||[]).find(x=>'__quiz_'+x.id===id);
    return q ? '测验 · '+String(q.question||'').slice(0,14) : '测验';
  }
  return id;
}
function chapOf(id){
  const chs = manifest.chapters || [];
  const ci = chs.findIndex(c=>c.id===id);
  if(ci >= 0) return {key:'ch:'+id, label:chs[ci].title||id, order:ci};
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp){
    const chId = (cp.chapterIds||[])[0];
    const i = chs.findIndex(c=>c.id===chId);
    if(i >= 0) return {key:'ch:'+chId, label:chs[i].title||chId, order:i};
    return {key:'zz', label:'未归入章节', order:900};
  }
  return {key:'tools', label:'术语与工具页', order:950, ref:true};
}
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    const href = searchHref(id);
    if(!href) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, href, text, label:pageTitle(id), chap:chapOf(id)});
  });
  return searchIndex;
}
function synOf(t){
  const out = [];
  for(const g of SYN_GROUPS){ if(g.indexOf(t) >= 0){ for(const x of g){ if(x !== t) out.push(x); } } }
  return out.slice(0,6);
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim();
  if(!v){ showPage(routeIdFromHash()); return; }
  const terms = tokenizeQuery(v);
  if(!terms.length){ showPage(routeIdFromHash()); return; }
  const grams = [];
  terms.forEach(t=>{ if(t.length >= 2){ for(let i=0;i+2<=t.length;i++) grams.push(t.slice(i,i+2)); } });
  const qGrams = [...new Set(grams)].slice(0,16);
  const snippetTerms = terms.concat(...terms.map(synOf)).slice(0,24);
  const hits = [];
  buildSearchIndex().forEach(p=>{
    const low = p.text.toLowerCase();
    let tHit = 0, sHit = 0, gHit = 0, first = '', viaSyn = '';
    for(const t of terms){
      if(low.includes(t)){ tHit++; if(!first) first = t; continue; }
      for(const s of synOf(t)){
        if(low.includes(s)){ sHit++; if(!viaSyn) viaSyn = s; if(!first) first = s; break; }
      }
    }
    for(const gm of qGrams){ if(low.includes(gm)) gHit++; }
    if(tHit > 0 || sHit > 0 || gHit >= 4){
      hits.push({p, score: tHit*100 + sHit*30 + Math.min(gHit,20), first, viaSyn});
    }
  });
  hits.sort((a,b)=> b.score-a.score || a.p.text.length-b.p.text.length);
  const top = hits.slice(0,20);
  let body;
  if(top.length){
    const gs = {};
    top.forEach(h=>{
      const k = h.p.chap.key;
      (gs[k] = gs[k] || {label:h.p.chap.label, order:h.p.chap.order, ref:!!h.p.chap.ref, hits:[]}).hits.push(h);
    });
    const eff = g => Math.max(...g.hits.map(x=>x.score)) * (g.ref ? 0.55 : 1);
    const order = Object.values(gs).sort((a,b)=> eff(b)-eff(a));
    body = order.map(g=>{
      const inner = g.hits.sort((a,b)=> b.score-a.score).map(h=>
        `<div class="search-hit"><a href="${h.p.href}" data-hl="${esc(h.first)}">${esc(h.p.label)}</a>${h.viaSyn?`<span class="syn-note">同义命中：${esc(h.viaSyn)}</span>`:''}<br><span class="sub">${hlSnippet(h.p.text, snippetTerms)}</span></div>`).join('');
      return `<div class="search-group"><div class="grp-head">${esc(g.label)}<span class="grp-count">${g.hits.length}</span></div>${inner}</div>`;
    }).join('');
  } else {
    body = '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语，或减少关键词。</div>';
  }
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' + body;
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof mermaid === 'undefined') return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  if(typeof mermaid !== 'undefined'){ boot(); return; }
  const urls=['https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js',
              'https://registry.npmmirror.com/mermaid/10.9.1/files/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js'];
  let ui=0, done=false;
  const tryNext=()=>{
    if(done || ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    const timer=setTimeout(()=>{ if(done) return; s.onload=null; s.onerror=null; s.remove(); tryNext(); }, 4000);
    s.onload=()=>{ done=true; clearTimeout(timer); boot(); };
    s.onerror=()=>{ clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

/* ---------- 句级出处：点击角标弹出原句 ---------- */
let citePop = null;
function closeCite(){ if(citePop){ citePop.remove(); citePop = null; } }
function showCite(id){
  const c = (typeof SOURCES !== 'undefined') ? SOURCES[id] : null;
  if(!c) return;
  closeCite();
  citePop = document.createElement('div');
  citePop.className = 'cite-pop';
  citePop.innerHTML = '<div class="cite-head">出处' + (c.page!=='' && c.page!=null ? (' · p.'+esc(String(c.page))) : '') +
    '<button class="cite-x" aria-label="关闭">×</button></div>' +
    (c.quote ? '<blockquote>'+esc(c.quote)+'</blockquote>' : '') +
    (c.zh ? '<div class="cite-zh">'+esc(c.zh)+'</div>' : '');
  document.body.appendChild(citePop);
  citePop.querySelector('.cite-x').onclick = closeCite;
}
document.addEventListener('click', e=>{
  const t = e.target.closest('.cite');
  if(t){ e.preventDefault(); showCite(t.dataset.cite); return; }
  if(citePop && !e.target.closest('.cite-pop')) closeCite();
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeCite(); });
</script>
<script id="zs-visual-init">
(function(){
  try{
    var B=document.body, H=document.documentElement;
    if(!B.dataset.theme && !H.dataset.theme) B.dataset.theme='dark';
    var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
    var scope=document.querySelectorAll('header, .topbar, .topbar-fixed, #topbar, .sidebar, .tabs, .hdr-right, .card-actions, .card-controls, .section-title, .card .icon, .icon-label');
    for(var i=0;i<scope.length;i++){
      var w=document.createTreeWalker(scope[i],NodeFilter.SHOW_TEXT,null,false), n;
      while(n=w.nextNode()){
        if(EMOJI.test(n.nodeValue)){
          n.nodeValue=n.nodeValue.replace(EMOJI,'').replace(/[ \t]+/g,' ').replace(/^ | $/g,'');
        }
      }
    }
    var btn=document.getElementById('theme-btn')||document.getElementById('theme')||document.getElementById('themeToggle');
    function label(){
      if(!btn) return;
      var light=B.dataset.theme==='light'||H.getAttribute('data-theme')==='light'||B.dataset.theme==='';
      if(btn.textContent.trim()===''||/浅色|深色/.test(btn.textContent)) btn.textContent=light?'深色':'浅色';
    }
    label();
    if(btn){
      new MutationObserver(label).observe(B,{attributes:true,attributeFilter:['data-theme']});
      new MutationObserver(label).observe(H,{attributes:true,attributeFilter:['data-theme']});
      btn.addEventListener('click',function(){setTimeout(label,0);},true);
    }
  }catch(e){}
})();
</script>
