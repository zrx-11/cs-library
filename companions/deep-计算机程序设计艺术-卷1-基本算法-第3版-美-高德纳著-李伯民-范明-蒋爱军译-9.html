B\\ D\\ C\\ E\\ G\\ F\\ H\\ J<\/span>，与书里给出的序列一致（PDF 第 270 页序列 (3)）。<\/p>\n<p>中序（左根右）：<span class=\"katex-inline\">B<\/span> 子树得 <span class=\"katex-inline\">D\\ B<\/span>；<span class=\"katex-inline\">C<\/span> 子树中，<span class=\"katex-inline\">E<\/span> 左空、右子树 <span class=\"katex-inline\">G<\/span>，<span class=\"katex-inline\">E<\/span> 子树得 <span class=\"katex-inline\">E\\ G<\/span>，<span class=\"katex-inline\">F<\/span> 子树得 <span class=\"katex-inline\">H\\ F\\ J<\/span>，根 <span class=\"katex-inline\">C<\/span> 在中间，合为 <span class=\"katex-inline\">E\\ G\\ C\\ H\\ F\\ J<\/span>；整树为 <span class=\"katex-inline\">D\\ B\\ A\\ E\\ G\\ C\\ H\\ F\\ J<\/span>（PDF 第 271 页序列 (4)）。<\/p>\n<p>后序（左右根）：<span class=\"katex-inline\">B<\/span> 子树得 <span class=\"katex-inline\">D\\ B<\/span>；<span class=\"katex-inline\">E<\/span> 子树得 <span class=\"katex-inline\">G\\ E<\/span>；<span class=\"katex-inline\">F<\/span> 子树得 <span class=\"katex-inline\">H\\ J\\ F<\/span>；<span class=\"katex-inline\">C<\/span> 子树得 <span class=\"katex-inline\">G\\ E\\ H\\ J\\ F\\ C<\/span>；整树为 <span class=\"katex-inline\">D\\ B\\ G\\ E\\ H\\ J\\ F\\ C\\ A<\/span>（PDF 第 271 页序列 (5)）。<\/p>\n<p><strong>递归到栈的转换<\/strong>：递归执行时，调用栈保存每一层待返回的现场。改成迭代版本时用显式栈模拟：以中序为例，从根出发沿左链下压，每压一个结点记下&quot;待访问&quot;；走到空后弹出栈顶结点访问，再转到其右子树重复。栈里保存的是尚未完成右子树处理的结点。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：二叉树结点可区分左右；遍历要求每结点恰访问一次，不做重复搜索。\n<\/li><li>\n失败案例 1：次序中左右写反。先序写成根右左，得到另一套序列；三种次序不再互为同一树的视图，与其他算法的对照会错位。\n<\/li><li>\n失败案例 2：空树判断漏掉。递归进入空子树直接访问字段，会对空链解引用；迭代实现中栈空判断缺失会在叶子处越界。\n<\/li><li>\n边界：遍历本身不修改树；带访问动作的遍历可以在结点处做查询、打印或累计，但遍历规则与访问内容分离。\n<\/li><li>\n复杂度：每个结点压栈、弹出各一次，遍历时间 <span class=\"katex-inline\">O(n)<\/span>；显式栈最坏占用 <span class=\"katex-inline\">O(n)<\/span>（单支树），平衡树为 <span class=\"katex-inline\">O(\\log n)<\/span>。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>先序 vs 后序<\/strong>：先序先处理根再下钻，适合复制树、输出目录层次；后序先完成子树再回根，适合释放树、计算子树规模。中序在二叉搜索树中给出升序序列。\n<\/li><li>\n<strong>递归遍历 vs 栈遍历<\/strong>：递归写法靠语言调用栈，栈遍历靠程序内显式结构；两者访问次序相同，差别在现场保存方式与可控性。\n<\/li><li>\n<strong>树遍历 vs 表扫描<\/strong>：线性表扫描是单链循访；树遍历带分支回退，必须记录待返回位置，否则走完左子树找不到回根路径。\n<\/li><li>\n<strong>三序 vs 层次遍历<\/strong>：先/中/后序都是深度优先路线；层次遍历按层从上到下、同层从左到右，用队列实现，不属于本节三种递归次序。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c08 链接分配提供结点链字段；c06 左孩右兄把一般树转成二叉树后，本节遍历结果可翻译回树的先根、后根次序。后继：树的路径长度、表达式求值、目录输出等算法都建立在遍历序列之上；第 4 章对遍历做结点访问计数时，求和范围按三序结构划分。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（二叉树三种遍历次序与栈实现）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：三序遍历的依赖链、样例树输出与栈迭代推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把遍历落到可执行算法，先往回追三层：<\/p>\n<ol><li>\n二叉树结构可递归拆开：根 + 左子树 + 右子树。遍历规则必须按这个递归结构组织。\n<\/li><li>\n访问次序约定：根、左、右三者的相对位置排列出先序、中序、后序；空树为空操作。\n<\/li><li>\n递归执行靠调用栈保存现场；改迭代版本时，显式栈承担同一职责，压栈与回退规则对应递归返回点。\n<\/ol>\n<p>依赖链方向：二叉树递归定义 → 三序规则按根/左/右排列 → 样例树逐层展开输出序列 → 递归现场转显式栈 → 复杂度按结点计数。<\/p>\n<h2>正向推导（逐步推演）：样例树三序展开<\/h2>\n<p>样例树结构：根 <span class=\"katex-inline\">A<\/span>；左子树根 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">B<\/span> 左孩子 <span class=\"katex-inline\">D<\/span>，右空；右子树根 <span class=\"katex-inline\">C<\/span>，<span class=\"katex-inline\">C<\/span> 左 <span class=\"katex-inline\">E<\/span>、右 <span class=\"katex-inline\">F<\/span>；<span class=\"katex-inline\">E<\/span> 左空、右孩子 <span class=\"katex-inline\">G<\/span>；<span class=\"katex-inline\">F<\/span> 左 <span class=\"katex-inline\">H<\/span>、右 <span class=\"katex-inline\">J<\/span>。<\/p>\n<p><strong>先序（根左右）<\/strong>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">A<\/span> 先访问；进 <span class=\"katex-inline\">B<\/span> 子树：访问 <span class=\"katex-inline\">B<\/span>，访问 <span class=\"katex-inline\">D<\/span>，<span class=\"katex-inline\">B<\/span> 右空；\n<\/li><li>\n进 <span class=\"katex-inline\">C<\/span> 子树：访问 <span class=\"katex-inline\">C<\/span>，进 <span class=\"katex-inline\">E<\/span> 子树：访问 <span class=\"katex-inline\">E<\/span>，访问 <span class=\"katex-inline\">G<\/span>；进 <span class=\"katex-inline\">F<\/span> 子树：访问 <span class=\"katex-inline\">F<\/span>，访问 <span class=\"katex-inline\">H<\/span>，访问 <span class=\"katex-inline\">J<\/span>。\n<\/li><li>\n输出：<span class=\"katex-inline\">A\\ B\\ D\\ C\\ E\\ G\\ F\\ H\\ J<\/span>，与书里序列一致（PDF 第 270 页序列 (3)）。\n<\/ul>\n<p><strong>中序（左根右）<\/strong>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">B<\/span> 子树：左 <span class=\"katex-inline\">D<\/span>，根 <span class=\"katex-inline\">B<\/span>，右空 → <span class=\"katex-inline\">D\\ B<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">C<\/span> 子树：<span class=\"katex-inline\">E<\/span> 左空、右 <span class=\"katex-inline\">G<\/span>，<span class=\"katex-inline\">E<\/span> 子树 → <span class=\"katex-inline\">E\\ G<\/span>；<span class=\"katex-inline\">F<\/span> 子树 → <span class=\"katex-inline\">H\\ F\\ J<\/span>；根 <span class=\"katex-inline\">C<\/span> 在中间 → <span class=\"katex-inline\">E\\ G\\ C\\ H\\ F\\ J<\/span>；\n<\/li><li>\n整树：<span class=\"katex-inline\">D\\ B\\ A\\ E\\ G\\ C\\ H\\ F\\ J<\/span>（PDF 第 271 页序列 (4)）。\n<\/ul>\n<p><strong>后序（左右根）<\/strong>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">B<\/span> 子树：<span class=\"katex-inline\">D\\ B<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">E<\/span> 子树：<span class=\"katex-inline\">G\\ E<\/span>；<span class=\"katex-inline\">F<\/span> 子树：<span class=\"katex-inline\">H\\ J\\ F<\/span>；<span class=\"katex-inline\">C<\/span> 子树：<span class=\"katex-inline\">G\\ E\\ H\\ J\\ F\\ C<\/span>；\n<\/li><li>\n整树：<span class=\"katex-inline\">D\\ B\\ G\\ E\\ H\\ J\\ F\\ C\\ A<\/span>（PDF 第 271 页序列 (5)）。\n<\/ul>\n<h2>数值算例：中序迭代的栈动作<\/h2>\n<p>以中序为例，显式栈保存&quot;尚未处理右子树&quot;的结点。<\/p>\n<ol><li>\n从 <span class=\"katex-inline\">A<\/span> 出发，沿左链下压：压 <span class=\"katex-inline\">A<\/span>，压 <span class=\"katex-inline\">B<\/span>，压 <span class=\"katex-inline\">D<\/span>。栈底到栈顶：<span class=\"katex-inline\">[A,B,D]<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">D<\/span> 左空，弹出 <span class=\"katex-inline\">D<\/span> 访问；转 <span class=\"katex-inline\">D<\/span> 右，空。\n<\/li><li>\n弹出 <span class=\"katex-inline\">B<\/span> 访问；转 <span class=\"katex-inline\">B<\/span> 右，空。\n<\/li><li>\n弹出 <span class=\"katex-inline\">A<\/span> 访问；转 <span class=\"katex-inline\">A<\/span> 右，进入 <span class=\"katex-inline\">C<\/span> 子树。\n<\/li><li>\n沿左链压 <span class=\"katex-inline\">C<\/span>，压 <span class=\"katex-inline\">E<\/span>；<span class=\"katex-inline\">E<\/span> 左空，弹出 <span class=\"katex-inline\">E<\/span> 访问；转 <span class=\"katex-inline\">E<\/span> 右，压 <span class=\"katex-inline\">G<\/span>；弹出 <span class=\"katex-inline\">G<\/span> 访问，<span class=\"katex-inline\">G<\/span> 右空。\n<\/li><li>\n回到 <span class=\"katex-inline\">C<\/span> 右子树，压 <span class=\"katex-inline\">F<\/span>，压 <span class=\"katex-inline\">H<\/span>；弹出 <span class=\"katex-inline\">H<\/span> 访问；弹出 <span class=\"katex-inline\">F<\/span> 访问，转 <span class=\"katex-inline\">F<\/span> 右，压 <span class=\"katex-inline\">J<\/span>；弹出 <span class=\"katex-inline\">J<\/span> 访问。\n<\/li><li>\n弹出 <span class=\"katex-inline\">C<\/span> 访问。\n<\/ol>\n<p>访问序列即中序结果 <span class=\"katex-inline\">D\\ B\\ A\\ E\\ G\\ C\\ H\\ F\\ J<\/span>，与递归展开一致。<\/p>\n<p>栈动作方向核对：<span class=\"katex-inline\">G<\/span> 是 <span class=\"katex-inline\">E<\/span> 的右孩子，沿左链下压阶段不经过 <span class=\"katex-inline\">G<\/span>；<span class=\"katex-inline\">E<\/span> 弹出访问后，控制转到 <span class=\"katex-inline\">E<\/span> 的右链才压入 <span class=\"katex-inline\">G<\/span>。若把 <span class=\"katex-inline\">G<\/span> 误当左孩子，压栈顺序会变成先压 <span class=\"katex-inline\">G<\/span> 再弹 <span class=\"katex-inline\">G<\/span>、后弹 <span class=\"katex-inline\">E<\/span>，中序次序被颠倒——孩子方向决定结点在哪一步进栈，这是迭代栈推演与递归展开必须对齐的细节。<\/p>\n<p><strong>先序迭代对照<\/strong>：弹栈访问根后，先压右子树再压左子树（栈后进先出，保证左先弹出）。<strong>后序迭代对照<\/strong>：需要两次出入栈标记，或用双栈；根在左右子树都完成后才访问。<\/p>\n<h2>延伸推演：复杂度与栈深<\/h2>\n<p>每个结点恰好压栈、弹出各一次，访问动作 <span class=\"katex-inline\">O(1)<\/span>，整树遍历时间 <span class=\"katex-inline\">O(n)<\/span>。栈空间最坏对应树高：单支树链长 <span class=\"katex-inline\">n<\/span>，栈深 <span class=\"katex-inline\">O(n)<\/span>；平衡二叉树高 <span class=\"katex-inline\">O(\\log n)<\/span>，栈深同阶。遍历不修改树结构，访问时挂载的查询、打印、累计动作与遍历规则分离。<\/p>\n<p>层次遍历不属于三序：它按层从上到下、同层从左到右，用队列保存待访问结点；深度优先的三序用栈，广度优先的层序用队列，数据结构选择对应遍历方向。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>左右次序写反<\/strong>：先序写成根右左，输出另一套序列；三序不再是同一树的视图，与后续算法对照错位。 <strong>空树判断漏掉<\/strong>：递归进入空子树仍解引用链字段，对空链访问；迭代实现栈空判断缺失会在叶子处越界。 <strong>递归现场丢失<\/strong>：递归返回时需要回到父结点继续处理右子树；不用显式栈保存返回点，走完左子树就回不到根。<\/p>\n<h2>对抗性追问：先序与中序能否唯一确定一棵树<\/h2>\n<p>可以由先序与中序（或后序与中序）还原二叉树；但只给先序与后序，部分结构无法区分。遍历序列是树的投影，单套序列不足以反推唯一结构。c06 的对应关系下，树遍历结果翻译回原树先根、后根次序，同样受这一约束。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出先序、中序、后序各自的根/左/右次序。\n<\/li><li>\n对样例树默背三序输出，并指出哪一套与书里先序序列一致。\n<\/li><li>\n中序迭代时栈里保存的是什么结点？为什么先压左链？\n<\/li><li>\n遍历时间与最坏栈深各是什么量级？单支树与平衡树栈深差别在哪？\n<\/li><li>\n层次遍历为什么用队列而不是栈？它与三序的遍历方向差别是什么？\n<\/ol>\n<h2>延伸推演：由遍历序列还原二叉树<\/h2>\n<p>先序加中序可唯一还原二叉树：先序首项是根，在中序中找到根位置，左侧划分左子树、右侧划分右子树；再按左右子树长度切分先序序列，递归还原。后序加中序走同一套划分：后序末项是根。<\/p>\n<p>只有先序与后序不足以唯一还原：根确定后，左子树与右子树的划分缺少中序边界信息，存在多种结构满足两套序列。这一约束解释了为什么遍历算法分析时常同时引用两套序列做交叉校验。<\/p>\n<h2>第二算例：小型树三序核对<\/h2>\n<p>取根 <span class=\"katex-inline\">R<\/span>，左孩子 <span class=\"katex-inline\">A<\/span>，右孩子 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">A<\/span> 无子女，<span class=\"katex-inline\">B<\/span> 左孩子 <span class=\"katex-inline\">C<\/span>。<\/p>\n<ul><li>\n先序：<span class=\"katex-inline\">R\\ A\\ B\\ C<\/span>；\n<\/li><li>\n中序：<span class=\"katex-inline\">A\\ R\\ C\\ B<\/span>；\n<\/li><li>\n后序：<span class=\"katex-inline\">A\\ C\\ B\\ R<\/span>。\n<\/ul>\n<p>核验路径：先序根 <span class=\"katex-inline\">R<\/span>，中序左段 <span class=\"katex-inline\">A<\/span>、右段 <span class=\"katex-inline\">C,B<\/span>；后序末项 <span class=\"katex-inline\">R<\/span>，与先序根一致。层序（广度优先）：<span class=\"katex-inline\">R,\\ A,\\ B,\\ C<\/span>，按层从上到下、同层从左到右，用队列保存待访问结点。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;三序差别只在打印位置&quot;。<\/strong> 次序决定子树处理时机：先序适合复制结构，后序适合释放与子树汇总，中序在搜索树上给出升序；用途由次序语义决定。\n<\/li><li>\n<strong>误解二：&quot;递归遍历不用栈&quot;。<\/strong> 递归靠语言调用栈保存现场；迭代版本只是把栈显式搬到程序内，现场保存职责没有消失。\n<\/li><li>\n<strong>误解三：&quot;遍历可以访问结点多次&quot;。<\/strong> 遍历定义要求每个结点恰访问一次；重复计数属于搜索或统计，不是遍历本身。\n<\/li><li>\n<strong>误解四：&quot;空树无法遍历&quot;。<\/strong> 空树什么都不做即算完成遍历；递归终止条件正是判空，漏掉判空才会出错。\n<\/ul>\n<h2>边界对照：遍历在全书结构分析中的位置<\/h2>\n<p>c06 的左孩右兄把一般树转成二叉树后，本概念三序结果翻译回原树先根、后根次序。c08 表扫描是单链循访，树遍历带分支回退，两者数据结构选择对应访问方向差异。后续表达式求值、目录输出、子树规模汇总都挂在遍历框架上；第 4 章统计访问次数时，求和范围按三序的左右子树结构划分。<\/p>\n<h2>推演补充：遍历中的不变量<\/h2>\n<p>递归遍历维持一条不变量：栈（或调用栈）中每个结点的右子树尚未处理，左子树已走完或正在走。以中序为例，压栈阶段沿左链下行，弹出时访问根，再转入右子树；不变量保证每个结点在左子树完成后才被访问，右子树在根之后处理。<\/p>\n<p>迭代实现丢失这个不变量就会出错：先访问根再压左子树，次序变成先序；压栈前未判空，叶子处解引用空链。写遍历算法时先声明不变量，再核对每个动作是否维持它，比凭印象调栈顺序可靠。<\/p>\n<h2>第三算例：单支树的栈深<\/h2>\n<p>左斜链 <span class=\"katex-inline\">A\\to B\\to C\\to\\cdots\\to X<\/span>，共 <span class=\"katex-inline\">n<\/span> 个结点。先序迭代压栈：根入栈后压左孩子，栈深达到 <span class=\"katex-inline\">n<\/span>；中序同样沿左链压到底再逐弹。最坏栈深 <span class=\"katex-inline\">O(n)<\/span>。<\/p>\n<p>平衡二叉树高 <span class=\"katex-inline\">O(\\log n)<\/span>，栈深同阶 <span class=\"katex-inline\">O(\\log n)<\/span>。时间复杂度两类情形都是 <span class=\"katex-inline\">O(n)<\/span>：每结点一次压入、一次弹出、一次访问，与树形无关；空间差别只在栈深。<\/p>\n<h2>推演补充：遍历与其他树操作的关系<\/h2>\n<p>复制树：先序遍历，访问根时新建结点并复制字段，再递归左右。释放树：后序遍历，左右子树清空后再释放根结点本身，避免先删根导致子树找不到入口。求子树规模：后序汇总，左规模加右规模加 1。二叉搜索树按中序输出升序键值。<\/p>\n<p>这些操作共用遍历骨架，差别只在访问结点时挂载的动作。理解三序次序后，新树操作先选遍历方向，再填访问动作，不必每次重写递归框架。<\/p>\n<h2>补充对照：三序的典型用途<\/h2>\n<p>先序适合复制与序列化：根先输出，重建时先建根再建左右子树，输入顺序与建树顺序一致。后序适合销毁与子树汇总：左右处理完才回根，汇总子树规模、高度、最值时父结点拿到的是已完成的子结果。中序在二叉搜索树上给出键值升序，范围查询与有序输出直接使用。<\/p>\n<p>选择遍历方向先看任务要什么结果：要结构重建选先序，要自底向上汇总选后序，要有序序列选中序。次序选错，访问动作再正确也拿不到目标序列。<\/p>\n<h2>补充算例：表达式树对照<\/h2>\n<p>表达式 <span class=\"katex-inline\">(a+b)\\times(c-d)<\/span> 对应二叉树：根为 <span class=\"katex-inline\">\\times<\/span>，左子树 <span class=\"katex-inline\">+<\/span>（<span class=\"katex-inline\">a,b<\/span>），右子树 <span class=\"katex-inline\">-<\/span>（<span class=\"katex-inline\">c,d<\/span>）。<\/p>\n<ul><li>\n先序：<span class=\"katex-inline\">\\times\\ +\\ a\\ b\\ -\\ c\\ d<\/span>（前缀式）；\n<\/li><li>\n中序：<span class=\"katex-inline\">a+b\\times c-d<\/span> 需加括号才保结构；\n<\/li><li>\n后序：<span class=\"katex-inline\">a\\ b\\ +\\ c\\ d\\ -\\ \\times<\/span>（后缀式）。\n<\/ul>\n<p>前缀、后缀表达式求值分别沿先序、后序栈框架处理；中序还原原始表达式必须补括号，否则运算优先级覆盖树结构。<\/p>\n<h2>补充边界：遍历与搜索的差别<\/h2>\n<p>遍历要求每结点恰访问一次，路径由树结构决定；搜索（如查找指定键值）可能提前终止，路径取决于比较结果。遍历是全结构扫描，搜索是定向检索，二者在栈/队列使用上相似，终止条件不同。把搜索剪枝误当遍历，会漏统计未访问结点；把遍历当搜索，会做多余访问。<\/p><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.208<\/div><h1>线性表的数组分配与链接分配：代价对比<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章（原书 §2.2）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>线性表只关心元素排成一行的相对位置：<span class=\"katex-inline\">X[1]<\/span> 是第一结点，<span class=\"katex-inline\">X[n]<\/span> 是最后结点，<span class=\"katex-inline\">1&lt;k&lt;n<\/span> 时 <span class=\"katex-inline\">X[k]<\/span> 前面是 <span class=\"katex-inline\">X[k-1]<\/span>、后面是 <span class=\"katex-inline\">X[k+1]<\/span>（PDF 第 208 页）。围绕表有访问第 <span class=\"katex-inline\">k<\/span> 项、插入、删除、合并、拆分、复制、计数、排序、搜索九类操作。同一个逻辑表，在机器内存里可以连续存放，也可以用指针串起来；两种表示在访问速度、增删代价、空间开销上各有取舍。这个概念把两类表示的代价算清楚，为选结构提供依据。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>线性表<\/strong>：<span class=\"katex-inline\">n\\ge0<\/span> 个结点的序列，基本结构性质只是各项排成一行时的相对位置（PDF 第 208 页）。空表 <span class=\"katex-inline\">n=0<\/span>。<\/p>\n<p><strong>顺序分配（数组式）<\/strong>：结点按次序连续存放在一段存储区；下标 <span class=\"katex-inline\">k<\/span> 对应位置可由基址加偏移直接算出。随机访问第 <span class=\"katex-inline\">k<\/span> 个结点是常数步。<\/p>\n<p><strong>链接分配<\/strong>：每个结点除数据字段外带链字段；结点在内存中不必连续，链字段保存后继（必要时再加前驱）结点的位置。访问第 <span class=\"katex-inline\">k<\/span> 个结点要沿链依次走。<\/p>\n<p><strong>栈、队列、双端队列<\/strong>：线性表的受限变体，只允许在端点处增删；书里 §2.2.1 先讨论这三类受限表，再展开一般顺序与链接分配（PDF 第 208 页）。<\/p>\n<h2>原理推导与推演：插入删除的步数对比<\/h2>\n<p>设表长 <span class=\"katex-inline\">n<\/span>，在第 <span class=\"katex-inline\">k<\/span> 个结点之后插入新结点 <span class=\"katex-inline\">x<\/span>。<\/p>\n<p>顺序分配：新结点占第 <span class=\"katex-inline\">k+1<\/span> 位，原 <span class=\"katex-inline\">k+1,\\dots,n<\/span> 位元素整体后移一格，移动个数 <span class=\"katex-inline\">n-k<\/span>；定位下标一次算出。删除第 <span class=\"katex-inline\">k<\/span> 个结点对称，把 <span class=\"katex-inline\">k+1,\\dots,n<\/span> 前移一格，移动 <span class=\"katex-inline\">n-k<\/span> 个元素。表尾插入 <span class=\"katex-inline\">k=n<\/span> 移动 0 个；表头插入 <span class=\"katex-inline\">k=1<\/span> 移动 <span class=\"katex-inline\">n-1<\/span> 个。<\/p>\n<p>链接分配：先沿链走 <span class=\"katex-inline\">k<\/span> 步定位第 <span class=\"katex-inline\">k<\/span> 个结点；定位后插入只改两个链字段——新结点链指向原后继，原结点链改指新结点，已有元素不挪动。删除同样先定位，再把前驱链直接接到后继。<\/p>\n<p>空间代价：链表每结点额外存至少一个链字段；顺序表按最大长度预留连续区域，表长波动大时预留不足或闲置。访问代价方向相反：顺序表 <span class=\"katex-inline\">O(1)<\/span> 随机访问，链表 <span class=\"katex-inline\">O(n)<\/span> 定位；插入删除动作顺序表 <span class=\"katex-inline\">O(n)<\/span> 移动，链表定位后 <span class=\"katex-inline\">O(1)<\/span> 改链。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：顺序表适合长度稳定、频繁随机访问、少做中间增删的场景；链表适合频繁头尾或中间增删、访问次序固定的场景。\n<\/li><li>\n失败案例 1：顺序表禁止整体搬移却要求表头插入。连续空间不移动元素就无法保持相对位置，强行放置会破坏下标语义。\n<\/li><li>\n失败案例 2：链表按下标直接取结点。没有基址偏移可算，跳过中间结点读不到目标；需要 <span class=\"katex-inline\">O(1)<\/span> 随机访问时只能回到顺序表或加辅助索引。\n<\/li><li>\n边界：链字段占用的空间在结点粒度上固定；顺序表的内碎片落在预留区尾部。两类表示都不解决表内查找效率问题，那是排序与搜索结构的任务。\n<\/li><li>\n混合方案：数组存链表结点（静态链表）保留链接语义，又避免动态分配；代价仍是沿链访问。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>顺序表 vs 数组<\/strong>：数组是存储载体，顺序分配是表的一种表示策略；数组也可用于其他结构，顺序表也可借别的连续存储实现。\n<\/li><li>\n<strong>单链表 vs 双链表<\/strong>：单链表只有后继链，删除某结点需先找到其前驱；双链表加前驱链，反向访问与删除更方便，每结点多一个字段。\n<\/li><li>\n<strong>循环链表 vs 普通链表<\/strong>：循环链表尾结点链回到表头而非空，适合环形调度；遍历终止条件从&quot;链为空&quot;改为&quot;回到起点&quot;。\n<\/li><li>\n<strong>顺序分配 vs 紧凑存储<\/strong>：顺序表连续紧凑，链接分配结点离散；紧凑程度不同，缓存局部性也不同，但代价对比不能只看存储密度。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 可行性要求每步操作基本可执行，两类分配的插入删除都落到可计数的基本动作。后继：c07 遍历栈用链接或顺序区保存待返回结点；c06 左孩右兄的链字段是链接思想在树上的推广。第 4 章分析插入删除时，移动元素个数 <span class=\"katex-inline\">n-k<\/span> 直接进入求和式。<\/p>\n<h2>补充：两类分配在受限表上的表现<\/h2>\n<p>栈只在表顶增删，顺序分配与链接分配都能胜任：顺序栈顶指针上移下移，链栈在表头压入弹出。队列在两端操作，顺序队列要处理环形回绕，否则表头一侧空间闲置；链队列天然支持两端进出，但每结点多一个链字段。双端队列同时允许两端增删，两类表示都可实现，差别仍在随机访问与搬移代价的对照上。<\/p>\n<p>选结构时先统计操作频次：若九成操作是按位置读取、少量增删，顺序表的连续布局带来访问优势；若操作集中在表头表尾插入删除，链表省去搬移。混合场景可以在链表上加索引块，或在顺序表上做批量重排，用辅助结构弥补主表示的短板。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（线性表的数组分配与链接分配：代价对比）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：两类线性表分配的代价链、插入删除算例与空间对照<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>比较顺序分配与链接分配，先往回追三层：<\/p>\n<ol><li>\n线性表语义只规定相对位置：首项 <span class=\"katex-inline\">X[1]<\/span>，末项 <span class=\"katex-inline\">X[n]<\/span>，<span class=\"katex-inline\">X[k]<\/span> 前后邻接。语义不规定内存布局。\n<\/li><li>\n布局选择决定访问路径：连续区域靠基址加偏移定位；离散结点靠链字段循访。\n<\/li><li>\n操作代价沿路径折算：定位步数、挪动元素个数、链字段开销分别计数，再汇总成各类操作量级。\n<\/ol>\n<p>依赖链方向：表的位置语义 → 连续/离散两种布局 → 定位与增删路径 → 步数与空间代价对照 → 场景选择依据。<\/p>\n<h2>正向推导（逐步推演）：插入删除逐项计数<\/h2>\n<p>设表长 <span class=\"katex-inline\">n<\/span>，在第 <span class=\"katex-inline\">k<\/span> 个结点之后插入新结点 <span class=\"katex-inline\">x<\/span>。<\/p>\n<p><strong>顺序分配<\/strong>：<\/p>\n<ul><li>\n定位：下标 <span class=\"katex-inline\">k<\/span> 由基址偏移直接算出，<span class=\"katex-inline\">O(1)<\/span>。\n<\/li><li>\n搬移：原位置 <span class=\"katex-inline\">k+1,\\dots,n<\/span> 共 <span class=\"katex-inline\">n-k<\/span> 个元素后移一格，每个元素一次写操作，搬移 <span class=\"katex-inline\">n-k<\/span> 步。\n<\/li><li>\n写入：新结点放第 <span class=\"katex-inline\">k+1<\/span> 位，一次写入。\n<\/li><li>\n删除第 <span class=\"katex-inline\">k<\/span> 个结点：对称，<span class=\"katex-inline\">k+1,\\dots,n<\/span> 共 <span class=\"katex-inline\">n-k<\/span> 个元素前移一格。\n<\/ul>\n<p><strong>链接分配<\/strong>：<\/p>\n<ul><li>\n定位：沿链走 <span class=\"katex-inline\">k<\/span> 步到达第 <span class=\"katex-inline\">k<\/span> 个结点。\n<\/li><li>\n插入：新结点链指向原后继；原结点链改指新结点，两次改链，已有元素不挪动。\n<\/li><li>\n删除：先定位前驱，前驱链直接接到后继，两次改链。\n<\/ul>\n<p><strong>访问对照<\/strong>：顺序表取第 <span class=\"katex-inline\">k<\/span> 项 <span class=\"katex-inline\">O(1)<\/span>；链表取第 <span class=\"katex-inline\">k<\/span> 项 <span class=\"katex-inline\">O(k)<\/span>，最坏 <span class=\"katex-inline\">O(n)<\/span>。<\/p>\n<h2>数值算例：具体表长下的步数<\/h2>\n<p><strong>算例 1：顺序表中间插入<\/strong>。表 <span class=\"katex-inline\">[a,b,c,d,e]<\/span>，<span class=\"katex-inline\">n=5<\/span>，在 <span class=\"katex-inline\">b<\/span>（第 2 项）后插 <span class=\"katex-inline\">x<\/span>。<\/p>\n<ul><li>\n搬移：<span class=\"katex-inline\">c,d,e<\/span> 后移，<span class=\"katex-inline\">n-k=5-2=3<\/span> 个元素；\n<\/li><li>\n写入 <span class=\"katex-inline\">x<\/span>；新表 <span class=\"katex-inline\">[a,b,x,c,d,e]<\/span>。\n<p>表头插入 <span class=\"katex-inline\">k=1<\/span>：搬移 <span class=\"katex-inline\">n-1=4<\/span> 个；表尾插入 <span class=\"katex-inline\">k=n=5<\/span>：搬移 0 个。<\/p>\n<\/ul>\n<p><strong>算例 2：链表同一插入<\/strong>。链 <span class=\"katex-inline\">a\\to b\\to c\\to d\\to e<\/span>，在 <span class=\"katex-inline\">b<\/span> 后插 <span class=\"katex-inline\">x<\/span>。<\/p>\n<ul><li>\n定位走 2 步到 <span class=\"katex-inline\">b<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">x<\/span> 链指向 <span class=\"katex-inline\">c<\/span>；<span class=\"katex-inline\">b<\/span> 链改指 <span class=\"katex-inline\">x<\/span>；两次改链，无元素搬移。\n<\/ul>\n<p><strong>算例 3：删除代价对比<\/strong>。顺序表删第 3 项 <span class=\"katex-inline\">c<\/span>：<span class=\"katex-inline\">d,e<\/span> 前移，<span class=\"katex-inline\">n-k=5-3=2<\/span> 步。链表删 <span class=\"katex-inline\">c<\/span>：先走到 <span class=\"katex-inline\">b<\/span>（2 步），<span class=\"katex-inline\">b<\/span> 链接 <span class=\"katex-inline\">d<\/span>，一步改链。<\/p>\n<h2>延伸推演：空间代价与混合方案<\/h2>\n<p>顺序表按最大长度预留连续区域；表长长期小于预留时，尾部空间闲置，属预留区碎片。链表每结点至少存一个后继链字段，字段大小随机器字长；结点离散分布，分配释放有额外开销。<\/p>\n<p>静态链表在数组内结点间用下标链代替指针，保留链接语义又避免动态分配；代价仍是沿链访问。双链表加前驱链，反向访问与删除方便，每结点多一字段。循环链表尾链回表头，遍历终止条件改为回到起点。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>顺序表禁止搬移<\/strong>：不整体挪动元素，表头插入无法在连续空间保持相对位置；新元素只能放表尾，下标语义被破坏。 <strong>链表按下标直取<\/strong>：没有基址偏移可算，跳过中间结点读不到目标；需要 <span class=\"katex-inline\">O(1)<\/span> 随机访问时只能回到顺序表或加索引结构。 <strong>把链字段开销算进时间<\/strong>：链字段占空间，不占遍历时间；两类代价分开计数，不要把存储密度与访问速度混为一谈。<\/p>\n<h2>对抗性追问：链表是否在所有操作上都更优<\/h2>\n<p>不是。链表优势集中在定位后的插入删除；随机访问、顺序扫描的局部性上，顺序表连续存放，缓存预取命中率更高。若场景以查表为主、增删很少，顺序表综合代价更低。选结构取决于最频繁的操作类型，不存在单表通吃。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n线性表的相对位置语义规定了什么？它是否规定内存布局？\n<\/li><li>\n顺序表插入第 <span class=\"katex-inline\">k<\/span> 项后要搬移几个元素？删除呢？\n<\/li><li>\n链表定位第 <span class=\"katex-inline\">k<\/span> 项要走几步？插入删除各改几次链？\n<\/li><li>\n两类表示在随机访问复杂度与空间预留上各有什么取舍？\n<\/li><li>\n静态链表、双链表、循环链表分别解决什么问题？\n<\/ol>\n<h2>延伸推演：操作代价汇总表<\/h2>\n<p>按九类常见操作对照两类表示（表长 <span class=\"katex-inline\">n<\/span>）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>操作<\/th><th>顺序分配<\/th><th>链接分配<\/th><\/tr><\/thead><tbody><tr><td>访问第 <span class=\"katex-inline\">k<\/span> 项<\/td><td><span class=\"katex-inline\">O(1)<\/span> 下标定位<\/td><td><span class=\"katex-inline\">O(k)<\/span> 沿链走<\/td><\/tr><tr><td>表头插入<\/td><td>搬移 <span class=\"katex-inline\">n-1<\/span> 项<\/td><td>改链 2 次<\/td><\/tr><tr><td>表尾插入<\/td><td>搬移 0 项<\/td><td>改链 2 次<\/td><\/tr><tr><td>中间插入<\/td><td>搬移 <span class=\"katex-inline\">n-k<\/span> 项<\/td><td>定位后改链 2 次<\/td><\/tr><tr><td>删除第 <span class=\"katex-inline\">k<\/span> 项<\/td><td>搬移 <span class=\"katex-inline\">n-k<\/span> 项<\/td><td>定位前驱后改链 1 次<\/td><\/tr><tr><td>合并两表<\/td><td>复制搬移两表长度<\/td><td>接尾链一次改链<\/td><\/tr><tr><td>拆分<\/td><td>下标切分<\/td><td>断点改链<\/td><\/tr><tr><td>计数<\/td><td>记长度字段 <span class=\"katex-inline\">O(1)<\/span><\/td><td>记长度或沿链 <span class=\"katex-inline\">O(n)<\/span><\/td><\/tr><tr><td>排序/搜索<\/td><td>随机访问优势<\/td><td>访问劣势另计<\/td><\/tr><\/tbody><\/table><\/div>\n<p>表中复杂度按最坏路径计；实际常数因子随存储实现不同。<\/p>\n<h2>第二算例：<span class=\"katex-inline\">n=10<\/span> 链表定位<\/h2>\n<p>链表 <span class=\"katex-inline\">v_1\\to v_2\\to\\cdots\\to v_{10}<\/span>，访问第 7 项：沿链走 6 次后继到达。若在第 7 项后插入 <span class=\"katex-inline\">x<\/span>：定位 6 步，<span class=\"katex-inline\">x<\/span> 链指向 <span class=\"katex-inline\">v_8<\/span>，<span class=\"katex-inline\">v_7<\/span> 链改指 <span class=\"katex-inline\">x<\/span>，两次改链。删除第 7 项：先走到 <span class=\"katex-inline\">v_6<\/span>（5 步），<span class=\"katex-inline\">v_6<\/span> 链接 <span class=\"katex-inline\">v_8<\/span>，一次改链。<\/p>\n<p>对照顺序表同场景：访问第 7 项一次偏移计算；插入搬移 <span class=\"katex-inline\">10-7=3<\/span> 项（<span class=\"katex-inline\">v_8,v_9,v_{10}<\/span> 后移）；删除搬移 3 项。两侧代价结构相反：链表贵在定位，顺序表贵在搬移。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;链表省空间&quot;。<\/strong> 链表省的是预留连续区，每结点额外链字段；结点离散分配还有管理开销，总空间不一定少于顺序表。\n<\/li><li>\n<strong>误解二：&quot;顺序表不能动态扩长&quot;。<\/strong> 顺序表可按容量倍增扩容；扩容时整体复制搬移，摊还代价与单次扩容代价要分开记。\n<\/li><li>\n<strong>误解三：&quot;双链表能随机访问&quot;。<\/strong> 双链表只是反向多一条前驱链，访问第 <span class=\"katex-inline\">k<\/span> 项仍要沿链走，随机访问能力没有恢复。\n<\/li><li>\n<strong>误解四：&quot;循环链表比普通链表多存数据&quot;。<\/strong> 循环链表尾链回表头，数据结点数不变，改变的是遍历终止条件。\n<\/ul>\n<h2>边界对照：两类表示在结构层的位置<\/h2>\n<p>c01 可行性把插入删除拆成可计数基本动作；c07 遍历栈可以用顺序区保存待返回结点，也可以用链表结点；c06 树的链字段是链接思想在树上的双链推广。第 4 章做算法分析时，插入删除搬移个数 <span class=\"katex-inline\">n-k<\/span> 直接进入求和式，再压成渐进量级。受限表（栈、队列、双端队列）是线性表操作端点受限的变体，代价对照沿同一框架。<\/p>\n<h2>推演补充：顺序表扩容的摊还代价<\/h2>\n<p>顺序表容量不足时申请更大连续区，把旧元素整体复制过去。单次扩容代价 <span class=\"katex-inline\">O(n)<\/span>，但不是每次插入都扩容；按容量倍增策略，连续两次扩容之间插入 <span class=\"katex-inline\">O(n)<\/span> 次，把扩容复制代价摊到各次插入上，单次摊还代价 <span class=\"katex-inline\">O(1)<\/span>。<\/p>\n<p>这与单次最坏 <span class=\"katex-inline\">O(n)<\/span> 搬移不矛盾：摊还分析看长期均值，最坏情形看单次峰值。链表没有扩容复制，但每结点链字段开销与动态分配代价在另一侧。两类表示的总代价要把空间开销与访问代价合并评估，不能只看插入一步。<\/p>\n<h2>第三算例：队列两种实现对照<\/h2>\n<p>顺序队列：队头指针 <span class=\"katex-inline\">f<\/span>、队尾指针 <span class=\"katex-inline\">r<\/span>，入队写 <span class=\"katex-inline\">r<\/span> 位置再后移，出队读 <span class=\"katex-inline\">f<\/span> 位置再后移；线性前移会让头部空间闲置，需环形回绕把尾部接回头部。判满与判空靠计数或留一个空位区分。<\/p>\n<p>链队列：队头、队尾两个指针，入队在尾后插，出队在头后删；两端都是常数步，无回绕问题，每结点多一个后继链字段。两类实现都满足队列先进先出，差别在空间预留与访问路径。<\/p>\n<h2>推演补充：表示选择的决策顺序<\/h2>\n<p>选线性表表示先回答三个问题：最频繁的操作是读还是增删；读是否按下标随机访问；表长波动幅度多大。随机读多、长度稳定 → 顺序表；增删集中、长度不定 → 链表；需要两端操作 → 再按栈或队列变体细化。<\/p>\n<p>混合方案不是折中退路：链表加索引块改善随机访问，顺序表批量重排抑制碎片，静态链表在数组内做链接。决策时先统计操作频次，再选主表示，最后用辅助结构补短板；脱离操作频次谈&quot;哪种表更好&quot;没有结论。<\/p>\n<h2>补充对照：链字段的几种组织方式<\/h2>\n<p>单链表每结点一个后继链，尾结点链为空；删除结点需先找到前驱，定位步数含前驱查找。双链表每结点再加前驱链，反向访问与删除方便，空间多一个字段。循环链表尾链回到表头，遍历终止条件改为回到起点；判空与判满要另设标记。静态链表在数组下标间串链，无动态分配，适合规模固定、不允许指针环境的场景。<\/p>\n<p>组织方式选择按反向访问需求：不需要前驱用单链，频繁删除已知结点用双链，环形调度用循环链表，受限内存用静态链。字段越多维护代价越高，不为用不到的方向预留链。<\/p>\n<h2>补充算例：<span class=\"katex-inline\">n=6<\/span> 两表操作对比<\/h2>\n<p>顺序表 <span class=\"katex-inline\">[v_1,v_2,v_3,v_4,v_5,v_6]<\/span>：<\/p>\n<ul><li>\n访问 <span class=\"katex-inline\">v_4<\/span>：下标偏移一次计算；\n<\/li><li>\n<span class=\"katex-inline\">v_3<\/span> 后插 <span class=\"katex-inline\">x<\/span>：<span class=\"katex-inline\">v_4,v_5,v_6<\/span> 后移，搬 3 项；\n<\/li><li>\n删 <span class=\"katex-inline\">v_4<\/span>：<span class=\"katex-inline\">v_5,v_6<\/span> 前移，搬 2 项。\n<\/ul>\n<p>链表 <span class=\"katex-inline\">v_1\\to\\cdots\\to v_6<\/span>：<\/p>\n<ul><li>\n访问 <span class=\"katex-inline\">v_4<\/span>：沿链走 3 步；\n<\/li><li>\n<span class=\"katex-inline\">v_3<\/span> 后插 <span class=\"katex-inline\">x<\/span>：定位 3 步，两次改链；\n<\/li><li>\n删 <span class=\"katex-inline\">v_4<\/span>：先到 <span class=\"katex-inline\">v_3<\/span> 走 2 步，前驱链直接接 <span class=\"katex-inline\">v_5<\/span>，一次改链。\n<\/ul>\n<p>两侧步数对照：顺序表访问快、增删搬移多；链表访问慢、增删改链少。<span class=\"katex-inline\">n<\/span> 增大后，搬移与定位的差距按线性拉开。<\/p>\n<h2>补充边界：表与其他结构的衔接<\/h2>\n<p>线性表是最基础结构，栈与队列是端点受限变体；串（字符序列）可借顺序表存储；数组与正交表（§2.2.6）在表上扩展多维下标。树与图的结点常挂表链组织子女或邻接点。c06 树的双链、c07 遍历栈都以本章链接/顺序表示为底层构件，理解两类分配的代价是后续结构分析的前提。<\/p>\n<h2>补充空间对照：字段与预留开销<\/h2>\n<p>顺序表预留容量 <span class=\"katex-inline\">C<\/span>，已存 <span class=\"katex-inline\">n<\/span> 项，闲置空间 <span class=\"katex-inline\">C-n<\/span>；链表每结点除数据外存链字段，节点分配还有对齐与管理开销。两表总空间比较：顺序表换随机访问付预留闲置，链表付链字段与分配碎片。表长波动大时预留闲置容易浪费，链表空间随实际项数增长；字段宽度按数据类型决定，链字段宽度在固定字长机器上为常数。<\/p><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">欧几里得算法的正确性与复杂度（gcd 不变量与步数量级）<\/a><\/span><\/div><h1>线性同余发生器：模数选择与周期<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（本卷仅铺垫数论；发生器方法属卷 2 第 3 章，本概念不挂本卷页码）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>程序需要一批&quot;看起来不可预测&quot;的数做采样、模拟、加盐或测试。真随机来源成本高、不可复现；工程上常用确定的递推造出一长串数，再用统计检验筛掉结构太差的。线性同余发生器（LCG）是最经典的一类：递推形式简单，状态空间有限，周期、分布性质可以从数论条件上分析。这个概念回答递推怎样写、周期由什么决定、满周期需要哪些条件方向。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>递推式<\/strong>：<span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">m<\/span>：模数，状态空间大小，序列取值范围 <span class=\"katex-inline\">0\\le X_n&lt;m<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">a<\/span>：乘子；\n<\/li><li>\n<span class=\"katex-inline\">c<\/span>：增量（偏移量）；\n<\/li><li>\n<span class=\"katex-inline\">X_0<\/span>：初值（种子）。\n<\/ul>\n<p><strong>状态<\/strong>：每个 <span class=\"katex-inline\">X_n<\/span> 是发生器当前状态。状态总数有限（<span class=\"katex-inline\">m<\/span> 个），序列从某一步起必然重复；一旦某状态再次出现，其后序列与上次完全一致，进入循环。<\/p>\n<p><strong>周期<\/strong>：从初值出发到首次回到该状态经过的步数。满周期指序列遍历全部 <span class=\"katex-inline\">m<\/span> 个状态后才回到初值；否则周期短于 <span class=\"katex-inline\">m<\/span>，部分状态永远不可达。<\/p>\n<p><strong>满周期条件方向<\/strong>（通行结论，供理解条件结构）：<\/p>\n<ol><li>\n<span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">m<\/span> 互素，即 <span class=\"katex-inline\">\\gcd(c,m)=1<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">a-1<\/span> 被 <span class=\"katex-inline\">m<\/span> 的每个素因子整除；\n<\/li><li>\n若 <span class=\"katex-inline\">m<\/span> 被 4 整除，则 <span class=\"katex-inline\">a-1<\/span> 也被 4 整除。\n<\/ol>\n<p>满足这组方向时递推达到满周期 <span class=\"katex-inline\">m<\/span>；任一条件偏离，周期受限。<\/p>\n<h2>原理推导与推演：小模数逐项与周期观察<\/h2>\n<p>取 <span class=\"katex-inline\">m=16,\\ a=5,\\ c=1,\\ X_0=1<\/span>。递推 <span class=\"katex-inline\">X_{n+1}=(5X_n+1)\\bmod16<\/span>。<\/p>\n<p><span class=\"katex-inline\">X_1=6<\/span>，<span class=\"katex-inline\">X_2=15<\/span>，<span class=\"katex-inline\">X_3=12<\/span>，<span class=\"katex-inline\">X_4=13<\/span>，<span class=\"katex-inline\">X_5=2<\/span>，<span class=\"katex-inline\">X_6=11<\/span>，<span class=\"katex-inline\">X_7=8<\/span>，<span class=\"katex-inline\">X_8=9<\/span>，<span class=\"katex-inline\">X_9=14<\/span>，<span class=\"katex-inline\">X_{10}=7<\/span>，<span class=\"katex-inline\">X_{11}=4<\/span>，<span class=\"katex-inline\">X_{12}=5<\/span>，<span class=\"katex-inline\">X_{13}=10<\/span>，<span class=\"katex-inline\">X_{14}=3<\/span>，<span class=\"katex-inline\">X_{15}=0<\/span>，<span class=\"katex-inline\">X_{16}=1<\/span>，回到初值。<\/p>\n<p>16 个状态 <span class=\"katex-inline\">0,\\dots,15<\/span> 各出现一次，周期 16，等于模数。对照条件：<span class=\"katex-inline\">c=1<\/span> 与 16 互素；<span class=\"katex-inline\">a-1=4<\/span> 被素因子 2 整除；16 被 4 整除，<span class=\"katex-inline\">a-1=4<\/span> 也被 4 整除。<\/p>\n<p><strong>周期崩溃算例<\/strong>：取 <span class=\"katex-inline\">m=8,\\ a=2,\\ c=0,\\ X_0=1<\/span>。序列 <span class=\"katex-inline\">1\\to2\\to4\\to0\\to0\\cdots<\/span>，第三步后卡在 0，周期为 1。状态空间 8 个，实际只走过三个非零值。这里 <span class=\"katex-inline\">c=0<\/span> 与模数有公因子的约束未被满足，乘子也未提供足够扰动。<\/p>\n<p><strong>模运算结构<\/strong>：每步先算 <span class=\"katex-inline\">aX_n+c<\/span> 的普通整数，再对 <span class=\"katex-inline\">m<\/span> 取余；余数落在 <span class=\"katex-inline\">[0,m-1]<\/span>。加法项 <span class=\"katex-inline\">c<\/span> 保证非零初值不至于被乘子迅速压到 0；互素条件决定可达状态是否被公因子切走一块。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：需要可复现、低速实现的伪随机序列；对高维不可预测性要求不高的场景。\n<\/li><li>\n失败案例 1：模数取合数而乘子选错，序列早早就落入短周期或固定点，频数检验立刻暴露规则痕迹。\n<\/li><li>\n失败案例 2：<span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">m<\/span> 有公因子 <span class=\"katex-inline\">d&gt;1<\/span>，各项与 <span class=\"katex-inline\">m<\/span> 的 gcd 被 <span class=\"katex-inline\">d<\/span> 约束，部分状态不可达，周期不可能满。\n<\/li><li>\n失败案例 3：同一初值重复使用。LCG 是确定过程，同一种子产生同一整列序列；不换种子，多次运行得到重复结果，独立性无从谈起。\n<\/li><li>\n边界：LCG 周期长不等于分布好；满周期只保证状态遍历，高维结构可能仍有规则痕迹，要靠 c10 的检验把关。递推只在整数模运算层面定义，不涉及真随机源。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>周期 vs 长度<\/strong>：周期是循环长度，输出长度可以超过周期（重复输出）；评测时不要把输出个数误当周期。\n<\/li><li>\n<strong>模数 vs 精度<\/strong>：<span class=\"katex-inline\">m<\/span> 决定状态空间与取值上限，不直接决定单个数字的有效位数；生成 <span class=\"katex-inline\">[0,1)<\/span> 均匀数还要做归一化。\n<\/li><li>\n<strong>LCG vs 移位寄存器发生器<\/strong>：LCG 用乘法加法，递推简单；其他发生器（线性反馈移位寄存器等）换用位移与异或，周期结构与高维性质不同。\n<\/li><li>\n<strong>种子 vs 参数<\/strong>：<span class=\"katex-inline\">X_0<\/span> 换值改起点，<span class=\"katex-inline\">m,a,c<\/span> 换值改整条序列；调试复现要固定参数、记录种子。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c04 gcd 与余数替换是互素判断的基础；c01 有限性对应递推必然回到旧状态这一终止事实。后继：c10 谱检验与 χ² 检验对发生器输出做均匀性核查；c11 估计周期内各类计数时用到求和与渐进。模运算概念接第 1 章 §1.2.4 整数函数与初等数论（PDF 第 47 页）。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（线性同余发生器：模数选择与周期）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：线性同余发生器的周期链、逐项算例与条件核验<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>分析 LCG 周期，先往回追三层：<\/p>\n<ol><li>\n状态空间有限：<span class=\"katex-inline\">X_n<\/span> 取值 <span class=\"katex-inline\">0,\\dots,m-1<\/span>，共 <span class=\"katex-inline\">m<\/span> 个状态；每步转入确定状态。\n<\/li><li>\n重复即循环：某状态再次出现后，后继由同一递推唯一确定，序列进入闭环。\n<\/li><li>\n周期长度由参数约束：可达状态是否被公因子切走、乘子是否提供足够扰动，决定周期能否达到满值。\n<\/ol>\n<p>依赖链方向：模运算余数语义 → 有限状态必重复 → 轨迹长度为周期 → 互素与乘子条件约束可达性 → 满周期或短周期分类。<\/p>\n<h2>正向推导（逐步推演）：递推结构与周期判定<\/h2>\n<p>递推 <span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span>。每步先算普通整数 <span class=\"katex-inline\">aX_n+c<\/span>，再对 <span class=\"katex-inline\">m<\/span> 取余，余数落在 <span class=\"katex-inline\">[0,m-1]<\/span>。<\/p>\n<p>状态转移是确定映射：同一状态只产生同一后继。状态总数有限，序列走到某一步必然撞到旧状态；从该状态起整段重复，首次回到起点的步数即周期。<\/p>\n<p>满周期条件方向（通行结论）：<\/p>\n<ol><li>\n<span class=\"katex-inline\">\\gcd(c,m)=1<\/span>，增量与模数互素；\n<\/li><li>\n<span class=\"katex-inline\">a-1<\/span> 被 <span class=\"katex-inline\">m<\/span> 的每个素因子整除；\n<\/li><li>\n若 <span class=\"katex-inline\">4\\mid m<\/span>，则 <span class=\"katex-inline\">4\\mid(a-1)<\/span>。\n<\/ol>\n<p>条件分别约束：公因子不得切走状态；乘子对素因子结构保持一致；被 4 整除时二次因子也要覆盖。任一条件偏离，周期短于 <span class=\"katex-inline\">m<\/span>。<\/p>\n<h2>数值算例：满周期小模数序列<\/h2>\n<p>取 <span class=\"katex-inline\">m=16,\\ a=5,\\ c=1,\\ X_0=1<\/span>。逐项：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><span class=\"katex-inline\">n<\/span><\/th><th><span class=\"katex-inline\">X_n<\/span><\/th><th><span class=\"katex-inline\">5X_n+1<\/span><\/th><th><span class=\"katex-inline\">\\bmod16<\/span><\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>1<\/td><td>6<\/td><td>6<\/td><\/tr><tr><td>1<\/td><td>6<\/td><td>31<\/td><td>15<\/td><\/tr><tr><td>2<\/td><td>15<\/td><td>76<\/td><td>12<\/td><\/tr><tr><td>3<\/td><td>12<\/td><td>61<\/td><td>13<\/td><\/tr><tr><td>4<\/td><td>13<\/td><td>66<\/td><td>2<\/td><\/tr><tr><td>5<\/td><td>2<\/td><td>11<\/td><td>11<\/td><\/tr><tr><td>6<\/td><td>11<\/td><td>56<\/td><td>8<\/td><\/tr><tr><td>7<\/td><td>8<\/td><td>41<\/td><td>9<\/td><\/tr><tr><td>8<\/td><td>9<\/td><td>46<\/td><td>14<\/td><\/tr><tr><td>9<\/td><td>14<\/td><td>71<\/td><td>7<\/td><\/tr><tr><td>10<\/td><td>7<\/td><td>36<\/td><td>4<\/td><\/tr><tr><td>11<\/td><td>4<\/td><td>21<\/td><td>5<\/td><\/tr><tr><td>12<\/td><td>5<\/td><td>26<\/td><td>10<\/td><\/tr><tr><td>13<\/td><td>10<\/td><td>51<\/td><td>3<\/td><\/tr><tr><td>14<\/td><td>3<\/td><td>16<\/td><td>0<\/td><\/tr><tr><td>15<\/td><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>16<\/td><td>1<\/td><td>—<\/td><td>回到 <span class=\"katex-inline\">X_0<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>状态 <span class=\"katex-inline\">0,1,\\dots,15<\/span> 各出现一次，周期 <span class=\"katex-inline\">16=m<\/span>。条件核验：<span class=\"katex-inline\">c=1<\/span> 与 16 互素；<span class=\"katex-inline\">a-1=4<\/span> 被素因子 2 整除；<span class=\"katex-inline\">4\\mid16<\/span> 且 <span class=\"katex-inline\">4\\mid4<\/span>。三项满足。<\/p>\n<h2>数值算例：崩溃序列对照<\/h2>\n<p>取 <span class=\"katex-inline\">m=8,\\ a=2,\\ c=0,\\ X_0=1<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">X_1=2\\cdot1+0=2\\bmod8=2<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">X_2=2\\cdot2=4<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">X_3=2\\cdot4=8\\bmod8=0<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">X_4=0<\/span>，此后恒为 0。\n<\/ul>\n<p>第三步后固定在 0，周期 1。状态空间 8 个，实际只走过 <span class=\"katex-inline\">1,2,4,0<\/span> 四个值。<span class=\"katex-inline\">c=0<\/span> 与 <span class=\"katex-inline\">m<\/span> 有公因子约束未排除，乘子 <span class=\"katex-inline\">a=2<\/span> 不提供离开 0 邻域的扰动。<\/p>\n<h2>延伸推演：周期与分布的分工<\/h2>\n<p>周期长只说明状态遍历充分；满周期不保证高维分布合格。<span class=\"katex-inline\">m<\/span> 决定状态空间与取值上限，生成 <span class=\"katex-inline\">[0,1)<\/span> 均匀数还要做归一化 <span class=\"katex-inline\">X_n/m<\/span>。种子 <span class=\"katex-inline\">X_0<\/span> 换值只改起点，参数 <span class=\"katex-inline\">m,a,c<\/span> 换值改整条序列；复现实验要固定参数并记录种子。<\/p>\n<p>其他发生器路线：线性反馈移位寄存器用位移与异或构造，周期结构与高维性质另作分析；LCG 的优势是递推短、实现快，代价是低维易显规则痕迹，需 c10 的检验把关。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong><span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">m<\/span> 不互素<\/strong>：设 <span class=\"katex-inline\">\\gcd(c,m)=d&gt;1<\/span>，各项与 <span class=\"katex-inline\">m<\/span> 的 gcd 被 <span class=\"katex-inline\">d<\/span> 约束，部分状态不可达，周期不可能满。 <strong>同一初值重复运行<\/strong>：确定过程同种子同序列；不换种子，多次采样得到重复结果，独立性不成立。 <strong>把输出长度当周期<\/strong>：输出可以长于周期并重复；周期是闭环长度，不是打印个数。<\/p>\n<h2>对抗性追问：满周期发生器是否就没有结构缺陷<\/h2>\n<p>不能下这个结论。周期是状态遍历性质，分布是统计性质；满周期序列仍可能在二维、三维上落在规则网格上，谱检验会暴露。参数选择先过周期条件，再交检验筛分布，两道关卡分开。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 LCG 递推式，说明 <span class=\"katex-inline\">m,a,c,X_0<\/span> 各是什么。\n<\/li><li>\n为什么有限状态序列必然进入循环？周期怎样定义？\n<\/li><li>\n满周期三个条件方向分别约束什么？\n<\/li><li>\n手算 <span class=\"katex-inline\">m=7,\\ a=3,\\ c=1,\\ X_0=2<\/span> 前 5 项，并观察是否回到 2。\n<\/li><li>\n周期长与分布好为什么是两件事？种子与参数各改变什么？\n<\/ol>\n<h2>延伸推演：模数选择的两类取向<\/h2>\n<p>模数取 2 的幂（如 <span class=\"katex-inline\">2^{32}<\/span>）时，乘法与取余在硬件低位截断上很自然，实现快；低位周期结构较弱，输出低位比特容易显规律。模数取素数时，同余域上乘法逆元存在，数论性质整齐；实现上取余运算代价略高。工程选择在实现速度、低位质量、周期长度之间权衡，两种取向各有适用场景。<\/p>\n<p>乘子选择要避开小步长结构：<span class=\"katex-inline\">a<\/span> 过小，序列在状态间跳跃不足，容易落入短链；<span class=\"katex-inline\">a<\/span> 接近模数时高位扰动过大，低位仍可能规则。增量 <span class=\"katex-inline\">c<\/span> 提供平移量，<span class=\"katex-inline\">c=0<\/span> 时为乘同余形式，周期条件与带增量情形不同，状态可达性分析要单独处理。<\/p>\n<h2>第二算例：<span class=\"katex-inline\">m=7<\/span> 序列观察<\/h2>\n<p>取 <span class=\"katex-inline\">m=7,\\ a=3,\\ c=1,\\ X_0=2<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">X_1=(3\\cdot2+1)\\bmod7=7\\bmod7=0<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">X_2=(3\\cdot0+1)\\bmod7=1<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">X_3=(3\\cdot1+1)\\bmod7=4<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">X_4=(3\\cdot4+1)\\bmod7=13\\bmod7=6<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">X_5=(3\\cdot6+1)\\bmod7=19\\bmod7=5<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">X_6=(3\\cdot5+1)\\bmod7=16\\bmod7=2<\/span>，回到初值。\n<\/ul>\n<p>序列 <span class=\"katex-inline\">2,0,1,4,6,5<\/span>，周期 6，未遍历 7 个状态（缺 3）。对照条件：<span class=\"katex-inline\">c=1<\/span> 与 7 互素；<span class=\"katex-inline\">a-1=2<\/span>，7 的素因子是 7，<span class=\"katex-inline\">2<\/span> 不被 7 整除，满周期条件未满足，周期短于模数，与观察一致。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;周期等于输出个数&quot;。<\/strong> 输出可重复超过周期；周期是闭环长度，打印个数可以任意长。\n<\/li><li>\n<strong>误解二：&quot;模数越大序列越随机&quot;。<\/strong> 大模数只扩大状态空间，乘子增量不当仍会短周期或留结构痕迹；周期与分布是两道关卡。\n<\/li><li>\n<strong>误解三：&quot;换种子就能改变周期&quot;。<\/strong> 种子改起点，周期由参数 <span class=\"katex-inline\">m,a,c<\/span> 决定；同一参数不同种子只改轨迹起点，不改闭环长度。\n<\/li><li>\n<strong>误解四：&quot;LCG 输出可直接当密码学随机数&quot;。<\/strong> LCG 状态可由少量样本反推，不具备不可预测性；密码场景需要专门的随机源与算法。\n<\/ul>\n<h2>边界对照：发生器在全书链条中的位置<\/h2>\n<p>c04 的 gcd 与互素判断是周期条件的数论语言；c01 有限性对应状态有限必然闭环。c10 谱检验与 χ² 检验对本概念输出做分布把关；c11 计数周期内各类状态出现次数时进入求和框架。模运算概念接卷一 §1.2.4 整数函数与初等数论（PDF 第 47 页），发生器完整讨论属卷 2 第 3 章，本卷不展开定理编号对应。<\/p>\n<h2>推演补充：递推的状态转移图<\/h2>\n<p>把每个状态 <span class=\"katex-inline\">x\\in[0,m-1]<\/span> 看成结点，转移 <span class=\"katex-inline\">x\\to(ax+c)\\bmod m<\/span> 画成有向边。确定性转移使每个出度为 1；有限图中轨迹必进入一个环，环上结点周期闭环，环前尾巴为暂态。满周期即环长 <span class=\"katex-inline\">m<\/span>，无暂态；短周期表现为环小、暂态长。<\/p>\n<p>转移图视角下，互素条件决定暂态是否被公因子切断；乘子决定环内跳跃结构。看图判断周期：从初值沿边走，首次回到起点的步数即周期；不必等整段输出打印完。<\/p>\n<h2>第三算例：<span class=\"katex-inline\">c=0<\/span> 乘同余对照<\/h2>\n<p>取 <span class=\"katex-inline\">m=9,\\ a=4,\\ c=0,\\ X_0=1<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">X_1=4,\\ X_2=16\\bmod9=7,\\ X_3=28\\bmod9=1<\/span>，回到 1，周期 3。\n<p>状态空间 9 个，只走 <span class=\"katex-inline\">1,4,7<\/span> 三个；<span class=\"katex-inline\">c=0<\/span> 时序列各项是初值乘 <span class=\"katex-inline\">a<\/span> 的幂模 <span class=\"katex-inline\">m<\/span>，可达集合受乘法子群约束。<\/p>\n<\/ul>\n<p>再取 <span class=\"katex-inline\">m=9,\\ a=4,\\ c=2,\\ X_0=1<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">X_1=6,\\ X_2=26\\bmod9=8,\\ X_3=34\\bmod9=7,\\ X_4=30\\bmod9=3,\\ X_5=14\\bmod9=5,\\ X_6=22\\bmod9=4,\\ X_7=18\\bmod9=0,\\ X_8=2<\/span>，继续追踪可见增量改变了可达结构。参数小幅变动对周期的影响，要按转移图逐点核验，不能凭类比推断。\n<\/ul>\n<h2>推演补充：归一化与输出精度<\/h2>\n<p>发生器输出整数 <span class=\"katex-inline\">X_n\\in[0,m-1]<\/span>，生成 <span class=\"katex-inline\">[0,1)<\/span> 均匀数通常取 <span class=\"katex-inline\">X_n/m<\/span>。模数大则输出粒度细；低位比特质量差时，可取高位比特组合改善统计表现。归一化不改变周期，只改变输出缩放；检验时样本类别划分要与输出区间匹配。<\/p>\n<p>种子管理：同一参数表配多种子用于重复实验对照；调试时固定种子复现序列，正式采样时更换种子。种子本身不作为随机质量的来源，参数结构才是周期与分布的决定因素。<\/p>\n<h2>补充对照：常见退化参数方向<\/h2>\n<p>模数取 2 的幂：低位比特周期短，高位比特质量较好，实际使用常取高位输出。乘数过小：状态跳跃慢，轨迹在狭小邻域内打转。增量为零：可达集合受乘法子群约束，互素条件不再覆盖 <span class=\"katex-inline\">c<\/span>。初值落在暂态段：前若干项不参与闭环，正式采样前先弃头。<\/p>\n<p>参数验收顺序：先核互素与周期长度，再看高位分布与相邻相关性；周期只说明状态不重复，不保证数值均匀，后者归 c10 检验。<\/p>\n<h2>补充算例：周期长度对照<\/h2>\n<p><span class=\"katex-inline\">m=16<\/span> 满周期 16，序列 16 项后才回到初值；<span class=\"katex-inline\">m=8,a=2,c=0<\/span> 周期 1（0 除外），四项内落入固定点。同样整数范围，参数结构不同导致可达状态数相差一个量级。周期计数以回到初值为准，不以数值是否重复为判据；同一数值在不同初值下出现位置不同，需沿转移链逐点追踪。<\/p><\/div><\/details>", "c10": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">线性同余发生器：模数选择与周期<\/a><\/span><\/div><h1>随机数检验：谱检验思想、χ² 统计量与&quot;随机不可证&quot;<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3 章（本卷未收录检验章节，方法按通行统计检验思路讲，不挂本卷页码）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>一个发生器输出一长串数，凭什么说它够&quot;随机&quot;？人眼挑不出规律不等于分布合格。检验需要把模糊感觉换成可计算的统计量：一类看各类别频数是否接近期望，一类看多维状态之间是否残留规则结构。这个概念讲清两类检验各自测什么、统计量怎么算，以及一条方法论边界：检验只能拒绝不合格者，不能证明某序列随机。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>均匀性假设<\/strong>：先假设输出在取值区间上均匀分布，各类别出现概率相等；检验计算观测与该假设的偏离程度。<\/p>\n<p><strong>χ² 统计量<\/strong>：把区间分成 <span class=\"katex-inline\">k<\/span> 个等长类别，生成 <span class=\"katex-inline\">N<\/span> 个数，第 <span class=\"katex-inline\">i<\/span> 类观测频数 <span class=\"katex-inline\">O_i<\/span>，期望频数 <span class=\"katex-inline\">E_i=N/k<\/span>。统计量<\/p>\n<div class=\"katex-block\">\\chi^2=\\sum_{i=1}^{k}\\frac{(O_i-E_i)^2}{E_i}<\/div>\n<p>每一项把偏离平方后除以期望；平方消除正负号，除以 <span class=\"katex-inline\">E_i<\/span> 折算成相对尺度。各类偏离同向累加，总值越大越偏离均匀期望。<\/p>\n<p><strong>谱检验思想<\/strong>：把连续 <span class=\"katex-inline\">r<\/span> 个输出看成 <span class=\"katex-inline\">r<\/span> 维空间中的格点。合格的伪随机序列，高维点集应当铺得均匀；若乘子或模数选择不当，点集会落在少数几条规则超平面上。谱检验考察相邻超平面之间的距离：距离过小，说明序列在高维上可被规则结构预测；距离与分布格局是评判发生器多维质量的依据。<\/p>\n<p><strong>其他常见检验方向<\/strong>：游程检验看连续升降或同类段的长度分布；间距检验看相邻输出差值；扑克牌式分组检验看多位组合的频次。各类检验从不同侧面找规则痕迹。<\/p>\n<h2>原理推演：χ² 从频数到偏离值<\/h2>\n<p>设 <span class=\"katex-inline\">k=4<\/span> 类，<span class=\"katex-inline\">N=400<\/span>，期望每类 <span class=\"katex-inline\">E_i=100<\/span>。若观测为 <span class=\"katex-inline\">O=(120,95,88,97)<\/span>，逐项算：<\/p>\n<ul><li>\n第 1 类：<span class=\"katex-inline\">(120-100)^2/100=400/100=4<\/span>；\n<\/li><li>\n第 2 类：<span class=\"katex-inline\">(95-100)^2/100=25/100=0.25<\/span>；\n<\/li><li>\n第 3 类：<span class=\"katex-inline\">(88-100)^2/100=144/100=1.44<\/span>；\n<\/li><li>\n第 4 类：<span class=\"katex-inline\">(97-100)^2/100=9/100=0.09<\/span>。\n<\/ul>\n<p>总和 <span class=\"katex-inline\">\\chi^2=5.78<\/span>。对照相应自由度的临界分布，判断是否拒绝均匀假设；样本量小或类别数太少时，统计量参照不稳，结论要谨慎。<\/p>\n<p><strong>谱检验的直觉<\/strong>：一维均匀只看落点频次；把相邻两项配对成二维点，规则发生器可能显出斜线、网格等格局。推广到三维、四维，格局越规整越容易被识别。谱距离是对这些超平面疏密的量化：合格发生器在各维上都保持足够间隔。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：样本量足够大，类别划分事先确定；检验针对指定假设（均匀、独立、无长程相关等）。\n<\/li><li>\n失败案例 1：用通过单项检验代替整体合格。χ² 频数合格不代表高维无结构，谱检验、游程检验可能在另一项上拒绝；检验要组合使用。\n<\/li><li>\n失败案例 2：小样本硬套 χ²。类别期望频数过低时，平方偏离被少数极端值主导，统计量参照失真。\n<\/li><li>\n失败案例 3：把检验阈值当成绝对分界。临界值对应显著性水平，落在边缘的结果需要重复抽样复核，不是一次读数定生死。\n<\/li><li>\n方法论边界：有限样本上的任何检验都只能&quot;尚未拒绝&quot;，不能证明随机。真随机的定义涉及不可预测性与信息论测度，超出有限样本检验的覆盖范围。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>χ² 检验 vs 谱检验<\/strong>：χ² 看一维频数分布，属于边缘分布检验；谱检验看高维点集几何，属于结构检验。两者互补，不互相替代。\n<\/li><li>\n<strong>拒绝假设 vs 证明非随机<\/strong>：统计量过大是拒绝均匀假设的证据，不等同于已找到确定性规律；不拒绝也不等于序列被证明随机。\n<\/li><li>\n<strong>检验合格 vs 周期长<\/strong>：满周期（c09）只说明状态遍历，输出仍可能在高维留下规则痕迹；周期是结构性质，检验是分布评测。\n<\/li><li>\n<strong>均匀性 vs 独立性<\/strong>：每一项边缘均匀，不代表相邻项独立；独立性要靠滞后相关、游程等专门检验。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c09 给出被检验的发生器及其周期；c04 互素概念是参数选择条件的语言。后继：c11 的频数加权求和是分析发生器平均行为的同构方法；c12 母函数可用于构造概率分布的矩估计。检验思想也回流到算法分析：估平均步数时分组统计各类输入占比，再按组内代价加权。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（随机数检验：谱检验思想、χ² 统计量与“随机不可证”）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：随机数检验的逻辑链、χ² 算例与谱检验直觉<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>设计一项随机数检验，先往回追三层：<\/p>\n<ol><li>\n先立假设：输出在取值区间上均匀、各类别等概率；检验计算观测与该假设的偏离。\n<\/li><li>\n选统计量把偏离压成一个数：一维频数用 χ²，多维几何用谱距离，两类分别对应边缘分布与结构痕迹。\n<\/li><li>\n解释结论：统计量大到越过临界值才拒绝假设；不拒绝只是尚未发现偏离，不等于证明随机。\n<\/ol>\n<p>依赖链方向：均匀性假设 → 分类或取点 → 观测频数/格点格局 → 统计量计算 → 对照临界值 → 限定结论为&quot;拒绝/未拒绝&quot;。<\/p>\n<h2>正向推导（逐步推演）：χ² 统计量构造<\/h2>\n<p>把 <span class=\"katex-inline\">[0,1)<\/span> 分 <span class=\"katex-inline\">k<\/span> 类，生成 <span class=\"katex-inline\">N<\/span> 个数，第 <span class=\"katex-inline\">i<\/span> 类观测 <span class=\"katex-inline\">O_i<\/span>，期望 <span class=\"katex-inline\">E_i=N/k<\/span>。<\/p>\n<div class=\"katex-block\">\\chi^2=\\sum_{i=1}^{k}\\frac{(O_i-E_i)^2}{E_i}<\/div>\n<p>每一项三层处理：偏离 <span class=\"katex-inline\">O_i-E_i<\/span> 先平方消除正负号；再除以 <span class=\"katex-inline\">E_i<\/span> 折算相对尺度；各类偏离同向累加。观测完全接近期望时各项趋零，总和趋零；某类明显偏多偏少，对应项抬高。<\/p>\n<h2>数值算例：四类别 χ² 计算<\/h2>\n<p><span class=\"katex-inline\">k=4<\/span>，<span class=\"katex-inline\">N=400<\/span>，<span class=\"katex-inline\">E_i=100<\/span>，观测 <span class=\"katex-inline\">O=(120,95,88,97)<\/span>。<\/p>\n<ul><li>\n第 1 类：<span class=\"katex-inline\">(120-100)^2/100=400/100=4<\/span>；\n<\/li><li>\n第 2 类：<span class=\"katex-inline\">(95-100)^2/100=25/100=0.25<\/span>；\n<\/li><li>\n第 3 类：<span class=\"katex-inline\">(88-100)^2/100=144/100=1.44<\/span>；\n<\/li><li>\n第 4 类：<span class=\"katex-inline\">(97-100)^2/100=9/100=0.09<\/span>。\n<\/ul>\n<p>总和 <span class=\"katex-inline\">\\chi^2=4+0.25+1.44+0.09=5.78<\/span>。对照自由度 <span class=\"katex-inline\">k-1=3<\/span> 的临界分布判断是否拒绝；样本量不足或类别期望过低时，平方偏离被极端值主导，结论不稳。<\/p>\n<p><strong>第二算例：完全均匀<\/strong>。<span class=\"katex-inline\">O=(100,100,100,100)<\/span>，各项为 0，<span class=\"katex-inline\">\\chi^2=0<\/span>，统计量最小。 <strong>第三算例：一类极端<\/strong>。<span class=\"katex-inline\">O=(160,80,80,80)<\/span>：第 1 类 <span class=\"katex-inline\">60^2/100=36<\/span>，其余各 <span class=\"katex-inline\">20^2/100=4<\/span>，总和 <span class=\"katex-inline\">48<\/span>，偏离显著抬高。<\/p>\n<h2>延伸推演：谱检验的高维直觉<\/h2>\n<p>一维均匀只看落点频次。把相邻两项配成二维点，规则发生器可能显出斜线、网格、聚束；推广到三维、四维，格局越规整越易识别。谱检验把高维点集看成格点，考察相邻超平面之间的距离：距离过小，点集被压在少数规则面上，序列可被结构预测；距离与各维分布格局是多维质量依据。<\/p>\n<p>其他检验方向：游程检验看连续升降或同类段长度；间距检验看相邻输出差值；分组组合检验看多位数频次。各项从不同侧面找痕迹，单项合格不代表整体合格。<\/p>\n<h2>方法论边界：为什么随机不可证<\/h2>\n<p>有限样本检验只能否决&quot;均匀/独立&quot;假设。一组数通过 χ²，只说明在这一批频数上没发现偏离；谱检验、游程检验可能在另一项上拒绝。真随机涉及不可预测性与信息论测度，超出有限样本可核验范围。合格发生器的准确表述是&quot;尚未被现有检验否决&quot;，不是&quot;已证明随机&quot;。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>小样本硬套 χ²<\/strong>：类别期望频数过低时，单项平方偏离主导总和，参照分布失真；应先保证样本量与类别划分合理。 <strong>阈值当绝对分界<\/strong>：临界值对应显著性水平，边缘结果需重复抽样复核，一次读数不定生死。 <strong>把拒绝当证明非随机<\/strong>：统计量大是拒绝均匀假设的证据，不等于已找到确定性规律；不拒绝也不构成随机证明。<\/p>\n<h2>对抗性追问：频数均匀是否就相邻独立<\/h2>\n<p>不是。边缘均匀只看每一项落点；相邻项可能存在滞后相关，例如奇数位总偏大、偶数位总偏小，一维频数仍可均匀。独立性要靠滞后相关、游程等专门检验，χ² 覆盖不到这一层。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nχ² 算式中平方、除以 <span class=\"katex-inline\">E_i<\/span> 各起什么作用？\n<\/li><li>\n手算 <span class=\"katex-inline\">k=3,\\ N=300,\\ O=(110,95,95)<\/span> 的 χ² 值。\n<\/li><li>\n谱检验在高维空间里考察什么？相邻超平面距离过小说明什么？\n<\/li><li>\n为什么说检验只能证伪、不能证明随机？\n<\/li><li>\n边缘均匀与相互独立为什么是两个不同假设？\n<\/ol>\n<h2>延伸推演：显著性水平与多重检验<\/h2>\n<p>统计量越过临界值才拒绝假设，临界值对应一个显著性水平：允许多大比例把均匀序列误判为不合格。水平定得严，漏网的不合格发生器变多；定得松，误杀合格发生器变多。单次检验如此，同时跑多项检验时，整体误杀概率随检验项数上升，解释结果要考虑这一背景。<\/p>\n<p>样本量影响结论稳定性：<span class=\"katex-inline\">N<\/span> 很小时，随机波动就能让 χ² 偏大；<span class=\"katex-inline\">N<\/span> 很大时，微小偏离也会被统计量放大并越过临界值。检验报告应同时给出样本量、类别数与统计量，不能只报&quot;通过/不通过&quot;。<\/p>\n<h2>第二算例：游程与间距的直觉<\/h2>\n<p>游程检验把序列按升降或同类切段，统计连续段长度。合格序列的游程长度分布应有疏有密；若游程异常长（一直升或一直降），或异常短（反复横跳），都偏离随机期望。<\/p>\n<p>间距检验看相邻输出差值：均匀随机点的间距应接近指数分布形态；若间距周期性重复，说明发生器在取值轴上留有等间隔痕迹。谱检验看二维以上点集几何，游程与间距看一维序列形态，三类检验互补。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;检验全过就可以宣称随机&quot;。<\/strong> 准确表述是尚未被现有检验否决；未测的检验项、未覆盖的样本段仍可能暴露问题。\n<\/li><li>\n<strong>误解二：&quot;统计量越大越随机&quot;。<\/strong> 统计量大是偏离均匀的信号，应拒绝；接近 0 才是接近期望，方向不要读反。\n<\/li><li>\n<strong>误解三：&quot;一次检验定终身&quot;。<\/strong> 边缘样本需重复抽样复核；临界值附近结果受单次波动影响，不能凭一组读数下结论。\n<\/li><li>\n<strong>误解四：&quot;频数均匀就相邻独立&quot;。<\/strong> 均匀是边缘分布，独立是条件分布关系；滞后相关要专门检验，χ² 不覆盖。\n<\/ul>\n<h2>边界对照：检验方法回流到算法分析<\/h2>\n<p>c09 发生器输出是被检验对象；周期条件（互素、乘子结构）是参数层把关，统计检验是分布层把关。c11 频数加权求和与检验中的分组计数同构：估平均代价时按输入类别分组，统计各类占比再加权组内代价。概率母函数（c12）可用于计算分布矩与检验统计量的理论期望。<\/p>\n<h2>推演补充：检验设计的一般流程<\/h2>\n<p>一项检验落地分四步：立假设（均匀、独立或无长程相关）；选统计量把偏离压成一个数；定临界值对应显著性水平；跑样本算统计量并对照结论。报告时附样本量、类别数、统计量与参照分布，单给&quot;通过/拒绝&quot;不足以复核。<\/p>\n<p>检验之间分工明确：边缘分布看频数，高维结构看谱，相邻关系看游程与滞后相关，组合规律看分组频次。单项合格只覆盖该侧面；发生器验收通常组合多项检验，再看不同种子、不同样本段的一致性。<\/p>\n<h2>第三算例：χ² 边界情形<\/h2>\n<p><span class=\"katex-inline\">k=2,\\ N=20,\\ O=(14,6)<\/span>，<span class=\"katex-inline\">E=10<\/span>：<\/p>\n<ul><li>\n第一项 <span class=\"katex-inline\">(14-10)^2/10=1.6<\/span>；\n<\/li><li>\n第二项 <span class=\"katex-inline\">(6-10)^2/10=1.6<\/span>；\n<\/li><li>\n总和 <span class=\"katex-inline\">3.2<\/span>。\n<\/ul>\n<p><span class=\"katex-inline\">N=200,\\ O=(140,60)<\/span>，<span class=\"katex-inline\">E=100<\/span>：<\/p>\n<ul><li>\n第一项 <span class=\"katex-inline\">1600/100=16<\/span>；\n<\/li><li>\n第二项 <span class=\"katex-inline\">1600/100=16<\/span>；\n<\/li><li>\n总和 <span class=\"katex-inline\">32<\/span>。\n<\/ul>\n<p>比例相同（7:3），大样本统计量显著抬高：样本越大，微小偏离越容易被放大到临界值之外。解释大样本结果时，统计量越过临界不等于实际偏离有工程意义；解释小样本时，统计量偏小也可能只是样本不足。<\/p>\n<h2>推演补充：不可证伪性的逻辑位置<\/h2>\n<p>&quot;序列随机&quot;若定义为不可预测、信息不可压缩，涉及对无穷序列性质的判断；有限样本只能观察有限前缀，无法穷尽后续可能。检验能做的是：若存在可识别的规则痕迹，统计量上反映出来；未发现痕迹，只能说明当前样本与假设不冲突。<\/p>\n<p>这一立场与算法正确性证明对照：算法正确性可由前提公理演绎证明；随机性质不能靠有限归纳建立。两类结论的证据标准不同，混淆两者会把&quot;检验通过&quot;误写成&quot;证明随机&quot;。<\/p>\n<h2>补充对照：常用检验侧面<\/h2>\n<p>游程检验：序列升降段长度分布是否与随机序列一致，抓相邻趋势粘连。间隔检验：同一类别两次出现之间的间隔长度分布，抓长时间重复。自相关检验：<span class=\"katex-inline\">X_n<\/span> 与滞后 <span class=\"katex-inline\">k<\/span> 项 <span class=\"katex-inline\">X_{n+k}<\/span> 的相关程度，抓长程依赖。排列检验：相邻若干项组成的元组在所有可能排列上的分布，抓局部组合规律。<\/p>\n<p>各侧面对应不同故障模式：周期过短在频数检验已显形；高维网格聚集在谱检验暴露；相邻趋势粘连在游程检验暴露。组合多项检验的结论比单项覆盖面广，也更耗样本量。<\/p>\n<h2>补充算例：谱检验直觉对照<\/h2>\n<p>二维情形把相邻两数 <span class=\"katex-inline\">(X_n/m, X_{n+1}/m)<\/span> 画到单位正方形上。合格序列点子散布全域；坏参数的点排成几条平行直线或网格，点之间留出规则空白。谱检验把这些点阵的间距量成一个最小网格距离量，距离过小提示高维结构聚集。<\/p>\n<p><span class=\"katex-inline\">k<\/span> 维推广到相邻 <span class=\"katex-inline\">k<\/span> 元组在 <span class=\"katex-inline\">[0,1)^k<\/span> 中的格点分布；维度越高所需样本越大，检验越难在短样本上出结论。谱检验结论是对高维均匀性的侧面判断，不替代频数与游程检验。<\/p>\n<h2>补充边界：样本量与类别数约束<\/h2>\n<p>χ² 分组时每类期望计数不宜过小，个别期望项偏低会让统计量不稳；类别划得过细，单项期望不足，划得过粗则掩盖局部偏离。临界值参照自由度 <span class=\"katex-inline\">k-1<\/span> 的 χ² 分布，自由度由类别数减一得到，不由样本量决定。<\/p>\n<p>检验失败后的处理：先排除实现错误（取模、缩放、样本截断），再调参数或换发生器；重复同一坏样本只加强已见结论，不能靠重跑翻案。<\/p><\/div><\/details>", "c11": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.76<\/div><h1>调和数与求和的渐进估计<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书 §1.2.7、§1.2.11）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>算法分析里反复出现形如 <span class=\"katex-inline\">\\sum_{k=1}^{n}1/k<\/span> 的求和：交换元素计数、概率倒数、递归摊还都可能落到调和数。逐项算到 <span class=\"katex-inline\">n<\/span> 既慢又看不出量级；需要一组工具，把有限和压成带常数项与误差阶的近似式。这个概念定义调和数，给出下界分组与积分比较两条路径，并说明渐进式各项的位置。书里 §1.2.7 专门讨论调和数（PDF 第 76 页）。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>调和数定义<\/strong>：<\/p>\n<div class=\"katex-block\">H_n=1+\\frac12+\\frac13+\\cdots+\\frac1n=\\sum_{k=1}^{n}\\frac1k,\\quad n\\ge0<\/div>\n<p><span class=\"katex-inline\">H_0=0<\/span>，<span class=\"katex-inline\">H_1=1<\/span>。字母 <span class=\"katex-inline\">H<\/span> 代表 harmonic（调和），<span class=\"katex-inline\">H_n<\/span> 习惯上称调和级数的第 <span class=\"katex-inline\">n<\/span> 项部分和（PDF 第 76 页）。<\/p>\n<p><strong>下界分组<\/strong>：按二的幂分段，第 <span class=\"katex-inline\">t<\/span> 段有 <span class=\"katex-inline\">2^{t-1}<\/span> 项，每项 <span class=\"katex-inline\">\\ge 1/2^t<\/span>，段和 <span class=\"katex-inline\">\\ge 1/2<\/span>；由此 <span class=\"katex-inline\">H_{2^m}\\ge 1+m/2<\/span>。<\/p>\n<p><strong>积分比较上界<\/strong>：对递减函数 <span class=\"katex-inline\">1/x<\/span>，<span class=\"katex-inline\">1/k\\le\\int_{k-1}^{k}dx/x<\/span>（<span class=\"katex-inline\">k\\ge2<\/span>），求和得 <span class=\"katex-inline\">H_n\\le1+\\ln n<\/span>。<\/p>\n<p><strong>精细渐进式<\/strong>（PDF 第 76 页）：<\/p>\n<div class=\"katex-block\">H_n=\\ln n+\\gamma+\\frac{1}{2n}-\\frac{1}{12n^2}+\\frac{1}{120n^4}-\\epsilon,\\quad 0<\\epsilon<\\frac{1}{252n^6}<\/div>\n<p>其中 <span class=\"katex-inline\">\\gamma=0.5772156649\\ldots<\/span> 为欧拉常数，由欧拉提出。去掉高阶修正后常用 <span class=\"katex-inline\">H_n=\\ln n+\\gamma+O(1/n)<\/span>。<\/p>\n<p><strong>对照级数<\/strong>：<span class=\"katex-inline\">\\sum 1/k^r<\/span> 在 <span class=\"katex-inline\">r&gt;1<\/span> 时收敛，<span class=\"katex-inline\">H_n^{(r)}<\/span> 记这类广义调和数；<span class=\"katex-inline\">r=2<\/span> 时和趋近黎曼 <span class=\"katex-inline\">\\zeta(2)<\/span>，与 <span class=\"katex-inline\">r=1<\/span> 的发散形成对照（PDF 第 76 页）。<\/p>\n<h2>原理推演：从分组到积分再到常数项<\/h2>\n<p>第一步分组看发散性：<span class=\"katex-inline\">H_{2^m}<\/span> 每翻倍至少再加 <span class=\"katex-inline\">1/2<\/span>，<span class=\"katex-inline\">m<\/span> 增大时下界线性增长，调和数不收敛。<\/p>\n<p>第二步积分估主项：<span class=\"katex-inline\">1/x<\/span> 在区间 <span class=\"katex-inline\">[k-1,k]<\/span> 上 <span class=\"katex-inline\">\\ge1/k<\/span>，所以<\/p>\n<div class=\"katex-block\">H_n=1+\\sum_{k=2}^{n}\\frac1k\\le1+\\int_{1}^{n}\\frac{dx}{x}=1+\\ln n<\/div>\n<p>结合下界 <span class=\"katex-inline\">H_{2^m}\\ge1+m/2<\/span>（<span class=\"katex-inline\">n=2^m<\/span> 时 <span class=\"katex-inline\">m=\\log_2 n<\/span>），<span class=\"katex-inline\">H_n<\/span> 量级确定为 <span class=\"katex-inline\">\\ln n<\/span>。<\/p>\n<p>第三步补常数与修正：积分比较只给主项，欧拉-麦克劳林方向在主项之后补出 <span class=\"katex-inline\">1/(2n)<\/span>、<span class=\"katex-inline\">-1/(12n^2)<\/span> 等修正项，<span class=\"katex-inline\">\\gamma<\/span> 是积分近似与真实和之间的恒定差。<span class=\"katex-inline\">\\gamma<\/span> 是独立于 <span class=\"katex-inline\">n<\/span> 的常数，不能并入 <span class=\"katex-inline\">1/n<\/span> 阶误差。<\/p>\n<p><strong>数值对照<\/strong>：<span class=\"katex-inline\">H_{10}=7381/2520\\approx2.9290<\/span>（书里给出该分数值，PDF 第 76 页）；<span class=\"katex-inline\">\\ln10+\\gamma\\approx2.302585+0.577216=2.879801<\/span>，差约 <span class=\"katex-inline\">0.0492<\/span>，<span class=\"katex-inline\">1/(2n)=0.05<\/span> 正好对上修正量级。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：求和项为 <span class=\"katex-inline\">1/k<\/span> 型正项；估量级用积分比较，估常数项用渐进展开。\n<\/li><li>\n失败案例 1：把 <span class=\"katex-inline\">H_n<\/span> 当有界量。<span class=\"katex-inline\">H_n<\/span> 发散只是增长慢；误以为调和数收敛会低估涉及倒数计数的算法代价。\n<\/li><li>\n失败案例 2：只记 <span class=\"katex-inline\">\\ln n<\/span> 丢掉 <span class=\"katex-inline\">\\gamma<\/span>。比较两个含 <span class=\"katex-inline\">H_n<\/span> 的精确式时常数项影响低阶判断；<span class=\"katex-inline\">H_n-\\ln n<\/span> 趋近 <span class=\"katex-inline\">\\gamma<\/span>，不是趋近 0。\n<\/li><li>\n边界：渐进式在 <span class=\"katex-inline\">n<\/span> 大时精度高；小 <span class=\"katex-inline\">n<\/span> 应直接算精确和。<span class=\"katex-inline\">O(1/n)<\/span> 写法省略了修正结构，需要误差界时回到完整展开。\n<\/li><li>\n推广：调和数出现在快速排序期望比较次数、优惠券收集问题、递归递推求解中，不是孤立的数列习题。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>调和数 vs 自然对数<\/strong>：<span class=\"katex-inline\">\\ln n<\/span> 是积分主项，<span class=\"katex-inline\">H_n<\/span> 比它多 <span class=\"katex-inline\">\\gamma<\/span> 及小修正；两者渐近同阶，但不能互换。\n<\/li><li>\n<strong><span class=\"katex-inline\">H_n<\/span> vs <span class=\"katex-inline\">n<\/span><\/strong>：线性增长为 <span class=\"katex-inline\">O(n)<\/span>，调和增长为 <span class=\"katex-inline\">O(\\log n)<\/span>；差一个对数阶，在复杂度排序上属于不同量级。\n<\/li><li>\n<strong>下界分组 vs 上界积分<\/strong>：分组证明发散，积分估计主项；两条路径回答不同侧面，组合才夹住量级。\n<\/li><li>\n<strong>欧拉常数 vs 自然对数底 <span class=\"katex-inline\">e<\/span><\/strong>：<span class=\"katex-inline\">\\gamma<\/span> 是和与积分的差，<span class=\"katex-inline\">e<\/span> 是指数底；两者名字都带&quot;自然&quot;，数值与来源无关。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c03 归纳法可核验调和数递推 <span class=\"katex-inline\">H_n=H_{n-1}+1/n<\/span>；c01 可行性保证逐项计算是基本动作。后继：c12 生成函数求解递推时，系数提取常涉及调和数闭式；第 4 章大 O 记号把 <span class=\"katex-inline\">H_n=\\ln n+\\gamma+O(1/n)<\/span> 压成 <span class=\"katex-inline\">O(\\log n)<\/span> 上界。排序与递归算法分析直接引用本概念的量级结论。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（调和数与求和的渐进估计）<\/summary><div class=\"depth-body\"><h1>c11 深度推导：调和数的求和链、分组与积分估计、数值对照<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>估计 <span class=\"katex-inline\">H_n<\/span> 的量级，先往回追三层：<\/p>\n<ol><li>\n求和对象是正项 <span class=\"katex-inline\">1/k<\/span>，逐项递减；正项和可用分组与积分比较两条路径夹逼。\n<\/li><li>\n下界要证明发散：按二的幂分组，每组贡献有固定下限。\n<\/li><li>\n上界要估主项：递减函数积分给出对数主项；常数项与高阶修正由欧拉-麦克劳林方向补出。\n<\/ol>\n<p>依赖链方向：定义 <span class=\"katex-inline\">H_n=\\sum1/k<\/span> → 分组得下界 <span class=\"katex-inline\">H_{2^m}\\ge1+m/2<\/span> → 积分比较得上界 <span class=\"katex-inline\">1+\\ln n<\/span> → 夹住 <span class=\"katex-inline\">\\ln n<\/span> 量级 → 补 <span class=\"katex-inline\">\\gamma<\/span> 与 <span class=\"katex-inline\">1/(2n)<\/span> 等修正。<\/p>\n<h2>正向推导：分组下界<\/h2>\n<p>把 <span class=\"katex-inline\">H_{2^m}<\/span> 分段：<\/p>\n<div class=\"katex-block\">H_{2^m}=1+\\sum_{j=2}^{2^m}\\frac1j<\/div>\n<p>第 <span class=\"katex-inline\">t<\/span> 段覆盖 <span class=\"katex-inline\">2^{t-1}&lt;j\\le2^t<\/span>，共 <span class=\"katex-inline\">2^{t-1}<\/span> 项，每项 <span class=\"katex-inline\">\\ge1/2^t<\/span>，段和 <span class=\"katex-inline\">\\ge2^{t-1}/2^t=1/2<\/span>。<span class=\"katex-inline\">m<\/span> 段合计 <span class=\"katex-inline\">\\ge m/2<\/span>，加首项 1：<\/p>\n<div class=\"katex-block\">H_{2^m}\\ge1+\\frac m2<\/div>\n<p><span class=\"katex-inline\">m<\/span> 增大时下界线性增长，调和级数不收敛。<\/p>\n<h2>正向推导：积分上界<\/h2>\n<p>对递减函数 <span class=\"katex-inline\">1/x<\/span>，区间 <span class=\"katex-inline\">[k-1,k]<\/span> 上 <span class=\"katex-inline\">1/x\\le1/(k-1)<\/span>（<span class=\"katex-inline\">k\\ge2<\/span>），于是<\/p>\n<div class=\"katex-block\">H_n=1+\\sum_{k=2}^{n}\\frac1k\\le1+\\sum_{k=2}^{n}\\int_{k-1}^{k}\\frac{dx}{x}=1+\\int_{1}^{n}\\frac{dx}{x}=1+\\ln n<\/div>\n<p>夹逼：<span class=\"katex-inline\">n=2^m<\/span> 时下界 <span class=\"katex-inline\">1+m/2=1+(\\log_2 n)/2<\/span>，上界 <span class=\"katex-inline\">1+\\ln n<\/span>，两侧同阶于 <span class=\"katex-inline\">\\ln n<\/span>，<span class=\"katex-inline\">H_n<\/span> 主项确定为 <span class=\"katex-inline\">\\ln n<\/span>。<\/p>\n<h2>数值算例：小 <span class=\"katex-inline\">n<\/span> 精确值与渐进对照<\/h2>\n<p><strong>算例 1<\/strong>：<span class=\"katex-inline\">H_{10}=7381/2520\\approx2.9290<\/span>（书里给出分数值，PDF 第 76 页）。<\/p>\n<ul><li>\n<span class=\"katex-inline\">\\ln10\\approx2.302585<\/span>，<span class=\"katex-inline\">\\gamma\\approx0.577216<\/span>，<span class=\"katex-inline\">\\ln10+\\gamma\\approx2.879801<\/span>；\n<\/li><li>\n差值 <span class=\"katex-inline\">2.9290-2.8798\\approx0.0492<\/span>；\n<\/li><li>\n修正项 <span class=\"katex-inline\">1/(2n)=1/20=0.05<\/span>，与差值同阶，方向吻合。\n<\/ul>\n<p><strong>算例 2<\/strong>：<span class=\"katex-inline\">H_{1000}<\/span> 估计。<span class=\"katex-inline\">\\ln1000\\approx6.907755<\/span>，加 <span class=\"katex-inline\">\\gamma<\/span> 得 <span class=\"katex-inline\">7.484971<\/span>，再加 <span class=\"katex-inline\">1/(2\\cdot1000)=0.0005<\/span>，估计值约 <span class=\"katex-inline\">7.4855<\/span>；高阶修正 <span class=\"katex-inline\">-1/(12n^2)<\/span> 量级 <span class=\"katex-inline\">8.3\\times10^{-8}<\/span>，可忽略。<\/p>\n<p><strong>算例 3<\/strong>：对照收敛级数。<span class=\"katex-inline\">1+1/2^2+\\cdots+1/n^2<\/span> 随 <span class=\"katex-inline\">n<\/span> 增大趋近 <span class=\"katex-inline\">\\zeta(2)\\approx1.6449<\/span>；<span class=\"katex-inline\">H_n<\/span> 却按 <span class=\"katex-inline\">\\ln n<\/span> 缓增。同为倒数幂，<span class=\"katex-inline\">r=1<\/span> 发散、<span class=\"katex-inline\">r&gt;1<\/span> 收敛，分界在指数 1。<\/p>\n<h2>延伸推演：渐进式各项位置<\/h2>\n<p>完整展开（PDF 第 76 页）：<\/p>\n<div class=\"katex-block\">H_n=\\ln n+\\gamma+\\frac{1}{2n}-\\frac{1}{12n^2}+\\frac{1}{120n^4}-\\epsilon,\\quad 0<\\epsilon<\\frac{1}{252n^6}<\/div>\n<p><span class=\"katex-inline\">\\gamma=0.5772156649\\ldots<\/span> 是欧拉常数，即积分近似与真实和之间的恒定差。常用简写 <span class=\"katex-inline\">H_n=\\ln n+\\gamma+O(1/n)<\/span>；只估量级时压成 <span class=\"katex-inline\">O(\\log n)<\/span>。<\/p>\n<p>递推方向：<span class=\"katex-inline\">H_n=H_{n-1}+1/n<\/span>，归纳法可核验任意有限项；母函数方向见 c12，调和数常作为系数出现在计数母函数中。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>把 <span class=\"katex-inline\">H_n<\/span> 当有界量<\/strong>：误判收敛会低估涉及倒数计数的算法代价；分组下界已证明它随 <span class=\"katex-inline\">m<\/span> 线性增长。 <strong>丢掉常数 <span class=\"katex-inline\">\\gamma<\/span><\/strong>：比较两个含 <span class=\"katex-inline\">H_n<\/span> 的精确式时，<span class=\"katex-inline\">H_n-\\ln n\\to\\gamma<\/span>，不是趋于 0；只记 <span class=\"katex-inline\">\\ln n<\/span> 会在低阶判断上出错。 <strong>小 <span class=\"katex-inline\">n<\/span> 套渐进<\/strong>：渐进式在 <span class=\"katex-inline\">n<\/span> 大时精度高；<span class=\"katex-inline\">n=1,2<\/span> 应直接算精确和，不用展开式估。<\/p>\n<h2>对抗性追问：<span class=\"katex-inline\">H_n<\/span> 增长慢是否就是常数阶<\/h2>\n<p>不是。慢增长不等于有界：<span class=\"katex-inline\">H_n<\/span> 越过任意给定常数只需 <span class=\"katex-inline\">n<\/span> 足够大，量级为 <span class=\"katex-inline\">\\ln n<\/span>，与常数阶有本质区别。复杂度排序中 <span class=\"katex-inline\">O(\\log n)<\/span> 低于 <span class=\"katex-inline\">O(n)<\/span>，但高于 <span class=\"katex-inline\">O(1)<\/span>。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">H_n<\/span> 定义与递推关系。\n<\/li><li>\n分组法怎样得到 <span class=\"katex-inline\">H_{2^m}\\ge1+m/2<\/span>？每段下限为什么是 <span class=\"katex-inline\">1/2<\/span>？\n<\/li><li>\n积分比较给出的上界是什么？怎样夹住 <span class=\"katex-inline\">H_n<\/span> 的主项？\n<\/li><li>\n<span class=\"katex-inline\">\\gamma<\/span> 是什么常数？<span class=\"katex-inline\">H_n=\\ln n+\\gamma+O(1/n)<\/span> 省略了哪些修正项？\n<\/li><li>\n为什么 <span class=\"katex-inline\">r=1<\/span> 的倒数级数发散而 <span class=\"katex-inline\">r=2<\/span> 收敛？\n<\/ol>\n<h2>延伸推演：调和数在摊还与递归中的出现<\/h2>\n<p>快速排序期望比较次数中，划分后两侧子问题的合并贡献产生调和数结构；优惠券收集问题收集齐 <span class=\"katex-inline\">n<\/span> 类券的期望次数为 <span class=\"katex-inline\">nH_n<\/span>；递归树逐层累加倒数项，总量常落到 <span class=\"katex-inline\">H_n<\/span> 量级。识别这些场景的信号：求和项形如 <span class=\"katex-inline\">1/k<\/span>，或每轮把规模折半、各层贡献同阶。<\/p>\n<p>摊还分析里另一类常见和是 <span class=\"katex-inline\">\\sum k<\/span> 与 <span class=\"katex-inline\">\\sum k^2<\/span>，对应二次、三次主项；调和数专门对应倒数项。区分求和式的幂次，才能判断量级是对数、线性还是多项式阶。<\/p>\n<h2>第二算例：小 <span class=\"katex-inline\">n<\/span> 调和数表<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th><span class=\"katex-inline\">n<\/span><\/th><th><span class=\"katex-inline\">H_n<\/span> 精确值方向<\/th><th>近似 <span class=\"katex-inline\">\\ln n+\\gamma<\/span><\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>1<\/td><td>0.5772<\/td><\/tr><tr><td>2<\/td><td>1.5<\/td><td>1.2703<\/td><\/tr><tr><td>3<\/td><td>1.8333<\/td><td>1.6758<\/td><\/tr><tr><td>4<\/td><td>2.0833<\/td><td>1.9635<\/td><\/tr><tr><td>5<\/td><td>2.2833<\/td><td>2.1993<\/td><\/tr><tr><td>10<\/td><td>2.92897<\/td><td>2.8798<\/td><\/tr><\/tbody><\/table><\/div>\n<p><span class=\"katex-inline\">n<\/span> 越小，<span class=\"katex-inline\">1/(2n)<\/span> 修正占比越大；<span class=\"katex-inline\">n=1<\/span> 时近似值 0.577 与精确值 1 差 0.423，不能用展开式估小项。<span class=\"katex-inline\">n=10<\/span> 时差 0.049，与 <span class=\"katex-inline\">1/(2n)=0.05<\/span> 同阶，验证修正项方向。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;<span class=\"katex-inline\">H_n<\/span> 增长慢所以是常数阶&quot;。<\/strong> 慢增长不等于有界；<span class=\"katex-inline\">H_n<\/span> 越过任意大常数只需 <span class=\"katex-inline\">n<\/span> 足够大，量级 <span class=\"katex-inline\">\\ln n<\/span>，高于 <span class=\"katex-inline\">O(1)<\/span>。\n<\/li><li>\n<strong>误解二：&quot;<span class=\"katex-inline\">\\gamma<\/span> 可以并入 <span class=\"katex-inline\">O(1/n)<\/span>&quot;。<\/strong> <span class=\"katex-inline\">\\gamma<\/span> 是不随 <span class=\"katex-inline\">n<\/span> 变的常数，<span class=\"katex-inline\">1/(2n)<\/span> 随 <span class=\"katex-inline\">n<\/span> 趋于 0，两者阶不同；写 <span class=\"katex-inline\">H_n-\\ln n<\/span> 时极限是 <span class=\"katex-inline\">\\gamma<\/span>，不是 0。\n<\/li><li>\n<strong>误解三：&quot;调和级数与 <span class=\"katex-inline\">p<\/span> 级数都发散&quot;。<\/strong> 分界在 <span class=\"katex-inline\">p=1<\/span>：<span class=\"katex-inline\">p&gt;1<\/span> 收敛，<span class=\"katex-inline\">p=1<\/span> 发散，<span class=\"katex-inline\">p&lt;1<\/span> 发散更快。\n<\/li><li>\n<strong>误解四：&quot;渐进式对所有 <span class=\"katex-inline\">n<\/span> 成立&quot;。<\/strong> 渐进描述 <span class=\"katex-inline\">n<\/span> 大时的行为；小 <span class=\"katex-inline\">n<\/span> 直接算精确和，展开式误差界也随 <span class=\"katex-inline\">n<\/span> 增大才收紧。\n<\/ul>\n<h2>边界对照：调和数与全书分析链条<\/h2>\n<p>c03 归纳法核验 <span class=\"katex-inline\">H_n=H_{n-1}+1/n<\/span> 的任意有限项；c12 母函数系数常带调和数闭式；c04 欧几里得步数是对数阶，与 <span class=\"katex-inline\">H_n<\/span> 的对数阶并列参照。大 O 记号（§1.2.11.1，PDF 第 102 页）把 <span class=\"katex-inline\">H_n<\/span> 压成 <span class=\"katex-inline\">O(\\log n)<\/span> 上界；后续排序、递归、概率算法分析直接引用本概念的量级与常数项结论。<\/p>\n<h2>推演补充：求和阶的识别顺序<\/h2>\n<p>面对一个有限和，先看通项幂次：<span class=\"katex-inline\">\\sum k^p<\/span> 主项 <span class=\"katex-inline\">O(n^{p+1})<\/span>；<span class=\"katex-inline\">\\sum 1/k<\/span> 主项 <span class=\"katex-inline\">O(\\ln n)<\/span>；<span class=\"katex-inline\">\\sum r^k<\/span>（<span class=\"katex-inline\">r&gt;1<\/span>）主项 <span class=\"katex-inline\">O(r^n)<\/span>；<span class=\"katex-inline\">\\sum 1/k^p<\/span>（<span class=\"katex-inline\">p&gt;1<\/span>）收敛有界。识别通项类型后再选估计工具：多项式求和用公式或积分，倒数和用分组加积分，几何和用闭式。<\/p>\n<p>同一和式换元常落到已知类型：<span class=\"katex-inline\">\\sum_{k=1}^{n}\\lfloor\\log_b k\\rfloor<\/span> 按对数段分组，段内项数乘段值；<span class=\"katex-inline\">\\sum 1/\\sqrt{k}<\/span> 介于 <span class=\"katex-inline\">1/k<\/span> 与 <span class=\"katex-inline\">1<\/span> 之间，积分比较得 <span class=\"katex-inline\">O(\\sqrt n)<\/span>。工具选择由通项决定，不套固定模板。<\/p>\n<h2>第三算例：<span class=\"katex-inline\">H_n<\/span> 递推与数值对照<\/h2>\n<p>递推 <span class=\"katex-inline\">H_1=1,\\ H_n=H_{n-1}+1/n<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">H_1=1<\/span>\n<\/li><li>\n<span class=\"katex-inline\">H_2=1+1/2=1.5<\/span>\n<\/li><li>\n<span class=\"katex-inline\">H_3=1.5+1/3\\approx1.8333<\/span>\n<\/li><li>\n<span class=\"katex-inline\">H_4\\approx2.0833<\/span>\n<\/li><li>\n<span class=\"katex-inline\">H_5\\approx2.2833<\/span>\n<\/li><li>\n<span class=\"katex-inline\">H_{10}\\approx2.92897<\/span>\n<\/ul>\n<p>渐进式 <span class=\"katex-inline\">H_n\\approx\\ln n+\\gamma+1/(2n)<\/span>：<span class=\"katex-inline\">n=1000<\/span> 时 <span class=\"katex-inline\">\\ln1000\\approx6.9078<\/span>，<span class=\"katex-inline\">\\gamma\\approx0.5772<\/span>，加 <span class=\"katex-inline\">0.0005<\/span>，估计约 <span class=\"katex-inline\">7.4855<\/span>；与精确和差在 <span class=\"katex-inline\">10^{-6}<\/span> 量级。<span class=\"katex-inline\">n=2<\/span> 时近似 <span class=\"katex-inline\">\\ln2+\\gamma+1/4\\approx1.2703+0.25=1.5203<\/span>，精确 1.5，修正项方向正确但小 <span class=\"katex-inline\">n<\/span> 偏差明显。<\/p>\n<h2>推演补充：欧拉常数的位置<\/h2>\n<p><span class=\"katex-inline\">\\gamma=\\lim_{n\\to\\infty}(H_n-\\ln n)<\/span>，是积分近似与离散和之间的恒定差。它独立于 <span class=\"katex-inline\">n<\/span>，不能随 <span class=\"katex-inline\">n<\/span> 增大消失；与自然对数底 <span class=\"katex-inline\">e<\/span> 来源不同：<span class=\"katex-inline\">e<\/span> 是指数极限，<span class=\"katex-inline\">\\gamma<\/span> 是和与积分的差。<span class=\"katex-inline\">\\gamma<\/span> 无简洁闭式，数值 <span class=\"katex-inline\">0.5772156649\\ldots<\/span>，书里附录 A 给小 <span class=\"katex-inline\">n<\/span> 精确值与 <span class=\"katex-inline\">\\gamma<\/span> 高精度数值（PDF 第 76 页）。<\/p>\n<p>写渐进估计时，主项 <span class=\"katex-inline\">\\ln n<\/span>、常数项 <span class=\"katex-inline\">\\gamma<\/span>、<span class=\"katex-inline\">1/n<\/span> 阶修正各占一层；比较两个含 <span class=\"katex-inline\">H_n<\/span> 的式子，常数项差异在低阶判断中不能省略，只压主项时才统一写成 <span class=\"katex-inline\">O(\\log n)<\/span>。<\/p>\n<h2>补充对照：常见调和型求和式<\/h2>\n<p><span class=\"katex-inline\">H_n/2<\/span> 对应 <span class=\"katex-inline\">\\sum 1/(2k)<\/span>；<span class=\"katex-inline\">\\sum_{k=1}^n 1/(2k-1)=H_{2n}-\\frac12 H_n<\/span>；<span class=\"katex-inline\">\\sum_{k=1}^n H_k=(n+1)H_n-n<\/span>（交换求和次序可得）。这些式子在递归分析里直接出现：递归每层做一次扫描，累计代价常落到调和数组合。<\/p>\n<p>识别调和型求和先把通项拆成 <span class=\"katex-inline\">1/k<\/span> 倍数与分段，再套已知恒等式；不要把含 <span class=\"katex-inline\">1/k<\/span> 的和与多项式和混估成同一量级。<\/p>\n<h2>补充算例：分组比较上界<\/h2>\n<p>把 <span class=\"katex-inline\">1/k<\/span> 按指数段分组：<span class=\"katex-inline\">k=1<\/span>；<span class=\"katex-inline\">k=2,3<\/span>；<span class=\"katex-inline\">k=4,\\dots,7<\/span>；<span class=\"katex-inline\">k=8,\\dots,15<\/span>；第 <span class=\"katex-inline\">j<\/span> 段 <span class=\"katex-inline\">k\\in[2^j,2^{j+1}-1]<\/span>，段内每项 <span class=\"katex-inline\">\\le1/2^j<\/span>，段长 <span class=\"katex-inline\">2^j<\/span>，段和 <span class=\"katex-inline\">\\le1<\/span>。第 <span class=\"katex-inline\">j<\/span> 段贡献上界 1，到 <span class=\"katex-inline\">n<\/span> 所在段共 <span class=\"katex-inline\">\\lfloor\\log_2 n\\rfloor+1<\/span> 段，得 <span class=\"katex-inline\">H_n\\le\\lfloor\\log_2 n\\rfloor+1<\/span>，量级 <span class=\"katex-inline\">\\log n<\/span>。下界用相邻段每项 <span class=\"katex-inline\">\\ge1/(2^{j+1})<\/span>，段和 <span class=\"katex-inline\">\\ge1/2<\/span>，同法得 <span class=\"katex-inline\">\\Omega(\\log n)<\/span>。积分近似给出常数项精度，分组比较只锁定量级。<\/p><\/div><\/details>", "c12": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.86<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">调和数与求和的渐进估计<\/a><\/span><\/div><h1>生成函数入门：把递推变成母函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章（原书 §1.2.9）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>数列按递推定义时，逐项展开只能看到相邻两项关系；要闭合计数式、求通项或研究整列数的性质，需要一个能把整列数装在一起的对象。生成函数（母函数）用一个幂级数承载数列：递推对所有 <span class=\"katex-inline\">n<\/span> 成立，转化为母函数满足的代数方程；解方程后再取 <span class=\"katex-inline\">z^n<\/span> 系数，就回到数列项。书里 §1.2.9 给出这一工具的基本运算（PDF 第 86 页）。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>生成函数<\/strong>：对数列 <span class=\"katex-inline\">\\langle a_n\\rangle=a_0,a_1,a_2,\\dots<\/span>，建立以参数 <span class=\"katex-inline\">z<\/span> 表示的无限和<\/p>\n<div class=\"katex-block\">G(z)=a_0+a_1z+a_2z^2+\\cdots=\\sum_{n\\ge0}a_n z^n<\/div>\n<p>函数 <span class=\"katex-inline\">G<\/span> 用一个量表示了整个数列；若数列递归定义，母函数是利用递推条件的有力工具（PDF 第 86 页）。<\/p>\n<p><strong>基本运算 A. 加法<\/strong>：<span class=\"katex-inline\">G(z)<\/span> 对应 <span class=\"katex-inline\">\\langle a_n\\rangle<\/span>，<span class=\"katex-inline\">H(z)<\/span> 对应 <span class=\"katex-inline\">\\langle b_n\\rangle<\/span>，则 <span class=\"katex-inline\">\\alpha G(z)+\\beta H(z)<\/span> 对应 <span class=\"katex-inline\">\\langle\\alpha a_n+\\beta b_n\\rangle<\/span>：<\/p>\n<div class=\"katex-block\">\\alpha\\sum_{n\\ge0}a_nz^n+\\beta\\sum_{n\\ge0}b_nz^n=\\sum_{n\\ge0}(\\alpha a_n+\\beta b_n)z^n<\/div>\n<p><strong>基本运算 B. 移位<\/strong>：<span class=\"katex-inline\">z^mG(z)<\/span> 对应右移 <span class=\"katex-inline\">m<\/span> 位的数列 <span class=\"katex-inline\">\\langle a_{n-m}\\rangle<\/span>，前 <span class=\"katex-inline\">m<\/span> 项补 0：<\/p>\n<div class=\"katex-block\">z^m\\sum_{n\\ge0}a_nz^n=\\sum_{n\\ge m}a_{n-m}z^n<\/div>\n<p><strong>收敛性位置<\/strong>：若级数在 <span class=\"katex-inline\">z=z_0<\/span> 收敛，则对 <span class=\"katex-inline\">|z|&lt;|z_0|<\/span> 收敛；级数在某非零 <span class=\"katex-inline\">z<\/span> 收敛，当且仅当序列 <span class=\"katex-inline\">\\sqrt[n]{|a_n|}<\/span> 有界。作为形式幂级数运算时，可以先不担心收敛，找到解后再独立证明正确性（PDF 第 86 页）。<\/p>\n<h2>原理推演：斐波那契递推转母函数<\/h2>\n<p>设 <span class=\"katex-inline\">F_0=0,\\ F_1=1,\\ F_{n+2}=F_{n+1}+F_n\\ (n\\ge0)<\/span>，<span class=\"katex-inline\">G(z)=\\sum_{n\\ge0}F_nz^n<\/span>。<\/p>\n<p>写出移位：<\/p>\n<div class=\"katex-block\">zG(z)=\\sum_{n\\ge1}F_{n-1}z^n,\\quad z^2G(z)=\\sum_{n\\ge2}F_{n-2}z^n<\/div>\n<p>递推乘 <span class=\"katex-inline\">z^n<\/span> 对 <span class=\"katex-inline\">n\\ge2<\/span> 求和：左侧 <span class=\"katex-inline\">\\sum_{n\\ge2}F_nz^n=G(z)-F_0-F_1z=G(z)-z<\/span>；右侧 <span class=\"katex-inline\">\\sum_{n\\ge2}F_{n-1}z^n=zG(z)<\/span>，<span class=\"katex-inline\">\\sum_{n\\ge2}F_{n-2}z^n=z^2G(z)<\/span>。整理：<\/p>\n<div class=\"katex-block\">G(z)-z=zG(z)+z^2G(z)<\/div>\n<div class=\"katex-block\">G(z)(1-z-z^2)=z<\/div>\n<div class=\"katex-block\">G(z)=\\frac{z}{1-z-z^2}<\/div>\n<p>右端展开后 <span class=\"katex-inline\">z^n<\/span> 系数即 <span class=\"katex-inline\">F_n<\/span>。需要通项时再做部分分式分解或系数提取；母函数把&quot;递推对所有 <span class=\"katex-inline\">n<\/span> 成立&quot;压缩成一条代数等式。<\/p>\n<p><strong>小例子对照<\/strong>：常数列 <span class=\"katex-inline\">1,1,1,\\dots<\/span> 的母函数 <span class=\"katex-inline\">G(z)=\\sum_{n\\ge0}z^n=1/(1-z)<\/span>；这是最基础的可封闭母函数。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：数列由线性递推给出，或需要计数带权组合；母函数运算走加法、移位、乘法（卷积）三条路。\n<\/li><li>\n失败案例 1：不写收敛域就代入具体 <span class=\"katex-inline\">z<\/span> 求值。形式运算阶段可以不管收敛，一旦用微积分结论或在数值点上计算，必须先核验收敛半径。\n<\/li><li>\n失败案例 2：递推下标范围写错。求和从 <span class=\"katex-inline\">n=2<\/span> 起还是 <span class=\"katex-inline\">n=0<\/span> 起，边界项 <span class=\"katex-inline\">F_0,F_1z<\/span> 处理不同；漏边界项会让方程常数项错位。\n<\/li><li>\n失败案例 3：把母函数当成普通多项式做除法。形式幂级数可以无限长，除法按系数逐项匹配，不能套用有限多项式因式分解的全部结论。\n<\/li><li>\n边界：母函数给出系数关系，不自动给出闭式；取系数才是最终目标，解方程只是中间步。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>母函数 vs 数列本身<\/strong>：母函数是承载工具，系数才是原数列；两个母函数相等当且仅当对应系数逐项相等（形式幂级数意义）。\n<\/li><li>\n<strong>普通母函数 vs 指数母函数<\/strong>：本节 <span class=\"katex-inline\">G(z)=\\sum a_nz^n<\/span> 是普通母函数；计数排列时另用指数母函数 <span class=\"katex-inline\">\\sum a_nz^n/n!<\/span>，适用对象不同。\n<\/li><li>\n<strong>生成函数 vs 生成式<\/strong>：生成函数是数学对象；&quot;生成式&quot;在书中也指文法规则，两者不要混称。\n<\/li><li>\n<strong>母函数法 vs 归纳法<\/strong>：母函数把递推转代数方程，归纳法核验命题；c03 的归纳可用于验证母函数展开式与递推一致，两条路互补。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c11 调和数的求和式常作为母函数系数出现；c03 归纳法负责事后核验展开结果。后继：计数组合、概率母函数、递推求解在后续各卷反复使用；卷积乘法对应数列逐项乘积求和，与第 4 章求和、大 O 估计衔接。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（生成函数入门：把递推变成母函数）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：生成函数的变换链、斐波那契母函数求解与系数提取<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>用母函数解递推，先往回追三层：<\/p>\n<ol><li>\n数列由递推定义，相邻项关系对所有 <span class=\"katex-inline\">n<\/span> 成立；需要一个对象把整列数同时承载。\n<\/li><li>\n母函数 <span class=\"katex-inline\">G(z)=\\sum_{n\\ge0}a_nz^n<\/span> 把数列变成幂级数；加法、移位、卷积对应数列运算。\n<\/li><li>\n递推乘 <span class=\"katex-inline\">z^n<\/span> 求和后，边界项与移位项组合成 <span class=\"katex-inline\">G(z)<\/span> 的代数方程；解出 <span class=\"katex-inline\">G(z)<\/span> 再取系数回到数列。\n<\/ol>\n<p>依赖链方向：数列递推 → 建母函数 → 递推逐项乘 <span class=\"katex-inline\">z^n<\/span> 求和 → 边界项整理 → 解出 <span class=\"katex-inline\">G(z)<\/span> → 部分分式或展开取 <span class=\"katex-inline\">[z^n]G(z)<\/span>。<\/p>\n<h2>正向推导（逐步推演）：斐波那契母函数完整求解<\/h2>\n<p>设 <span class=\"katex-inline\">F_0=0,\\ F_1=1,\\ F_{n+2}=F_{n+1}+F_n\\ (n\\ge0)<\/span>，<span class=\"katex-inline\">G(z)=\\sum_{n\\ge0}F_nz^n<\/span>。<\/p>\n<p>写出三个移位形式：<\/p>\n<div class=\"katex-block\">G(z)=F_0+F_1z+\\sum_{n\\ge2}F_nz^n=z+\\sum_{n\\ge2}F_nz^n<\/div>\n<div class=\"katex-block\">zG(z)=\\sum_{n\\ge0}F_nz^{n+1}=\\sum_{n\\ge1}F_{n-1}z^n<\/div>\n<div class=\"katex-block\">z^2G(z)=\\sum_{n\\ge0}F_nz^{n+2}=\\sum_{n\\ge2}F_{n-2}z^n<\/div>\n<p>递推 <span class=\"katex-inline\">F_n=F_{n-1}+F_{n-2}<\/span> 对 <span class=\"katex-inline\">n\\ge2<\/span> 乘 <span class=\"katex-inline\">z^n<\/span> 求和：<\/p>\n<p>左侧 <span class=\"katex-inline\">\\sum_{n\\ge2}F_nz^n=G(z)-z<\/span>；右侧第一项 <span class=\"katex-inline\">\\sum_{n\\ge2}F_{n-1}z^n=zG(z)<\/span>（<span class=\"katex-inline\">n=1<\/span> 项 <span class=\"katex-inline\">F_0z=0<\/span>）；右侧第二项 <span class=\"katex-inline\">\\sum_{n\\ge2}F_{n-2}z^n=z^2G(z)<\/span>。<\/p>\n<p>整理：<\/p>\n<div class=\"katex-block\">G(z)-z=zG(z)+z^2G(z)<\/div>\n<div class=\"katex-block\">G(z)(1-z-z^2)=z<\/div>\n<div class=\"katex-block\">G(z)=\\frac{z}{1-z-z^2}<\/div>\n<p>右端展开后 <span class=\"katex-inline\">z^n<\/span> 系数即 <span class=\"katex-inline\">F_n<\/span>。需要通项时对分母 <span class=\"katex-inline\">1-z-z^2<\/span> 做部分分式分解，再按几何级数展开取系数。<\/p>\n<h2>数值算例：低阶系数核验<\/h2>\n<p><span class=\"katex-inline\">G(z)=z/(1-z-z^2)<\/span>。先写分母倒数展开：设 <span class=\"katex-inline\">1/(1-z-z^2)=c_0+c_1z+c_2z^2+\\cdots<\/span>，乘分母：<\/p>\n<div class=\"katex-block\">(1-z-z^2)(c_0+c_1z+c_2z^2+\\cdots)=1<\/div>\n<p>系数对照：<span class=\"katex-inline\">c_0=1<\/span>；<span class=\"katex-inline\">c_1-c_0=0\\Rightarrow c_1=1<\/span>；<span class=\"katex-inline\">c_2-c_1-c_0=0\\Rightarrow c_2=2<\/span>；<span class=\"katex-inline\">c_3=c_2+c_1=3<\/span>；<span class=\"katex-inline\">c_4=5<\/span>。乘分子 <span class=\"katex-inline\">z<\/span> 后 <span class=\"katex-inline\">G(z)=z+z^2+2z^3+3z^4+5z^5+\\cdots<\/span>，系数 <span class=\"katex-inline\">0,1,1,2,3,5<\/span> 与斐波那契数列一致。<\/p>\n<p><strong>第二算例：常数列<\/strong>。<span class=\"katex-inline\">a_n=1<\/span> 对所有 <span class=\"katex-inline\">n<\/span>，母函数<\/p>\n<div class=\"katex-block\">G(z)=\\sum_{n\\ge0}z^n=1+z+z^2+\\cdots=\\frac{1}{1-z}<\/div>\n<p>这是最基础的可封闭母函数；移位 <span class=\"katex-inline\">z^mG(z)<\/span> 对应数列右移 <span class=\"katex-inline\">m<\/span> 位，前 <span class=\"katex-inline\">m<\/span> 项补 0。<\/p>\n<h2>延伸推演：基本运算与收敛位置<\/h2>\n<p><strong>加法<\/strong>：<span class=\"katex-inline\">\\alpha G(z)+\\beta H(z)<\/span> 对应 <span class=\"katex-inline\">\\langle\\alpha a_n+\\beta b_n\\rangle<\/span>，逐项线性组合。 <strong>移位<\/strong>：<span class=\"katex-inline\">z^mG(z)=\\sum_{n\\ge m}a_{n-m}z^n<\/span>，数列右移 <span class=\"katex-inline\">m<\/span> 位。 <strong>卷积<\/strong>：<span class=\"katex-inline\">G(z)H(z)<\/span> 系数为 <span class=\"katex-inline\">\\sum_{k=0}^{n}a_kb_{n-k}<\/span>，对应数列卷积。<\/p>\n<p>收敛性：若级数在 <span class=\"katex-inline\">z=z_0<\/span> 收敛，则 <span class=\"katex-inline\">|z|&lt;|z_0|<\/span> 内收敛；在某非零 <span class=\"katex-inline\">z<\/span> 收敛当且仅当 <span class=\"katex-inline\">\\sqrt[n]{|a_n|}<\/span> 有界。形式幂级数运算阶段可暂不担心收敛；一旦代入具体 <span class=\"katex-inline\">z<\/span> 求值或使用微积分结论，先核验收敛半径。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>下标范围写错<\/strong>：求和从 <span class=\"katex-inline\">n=2<\/span> 起还是 <span class=\"katex-inline\">n=0<\/span> 起，边界项 <span class=\"katex-inline\">F_0,F_1z<\/span> 处理不同；漏边界项会让方程常数项错位。 <strong>把母函数当有限多项式<\/strong>：形式幂级数无限长，除法按系数逐项匹配；有限多项式因式分解结论不能整套套用。 <strong>解方程后停在母函数<\/strong>：母函数是中间载体，最终目标是 <span class=\"katex-inline\">[z^n]G(z)<\/span>；只解出 <span class=\"katex-inline\">G(z)<\/span> 不算完成递推求解。<\/p>\n<h2>对抗性追问：母函数法能否替代归纳法<\/h2>\n<p>不能互相替代。母函数把递推转代数方程并给出系数关系；归纳法核验命题真值。得到展开式后，可用归纳法验证系数满足递推与初值，两条路互补。普通母函数 <span class=\"katex-inline\">G(z)=\\sum a_nz^n<\/span> 用于组合计数；排列计数另用指数母函数 <span class=\"katex-inline\">\\sum a_nz^n/n!<\/span>，对象不同不要混用。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出普通母函数定义；加法与移位各对应什么数列运算？\n<\/li><li>\n斐波那契递推转母函数时，<span class=\"katex-inline\">zG(z)<\/span> 与 <span class=\"katex-inline\">z^2G(z)<\/span> 各覆盖哪些下标？\n<\/li><li>\n从 <span class=\"katex-inline\">G(z)=z/(1-z-z^2)<\/span> 展开前 5 个系数并与 <span class=\"katex-inline\">F_n<\/span> 对照。\n<\/li><li>\n形式幂级数运算为什么可以暂不考虑收敛？什么时候必须核验收敛半径？\n<\/li><li>\n普通母函数与指数母函数分别服务哪类计数问题？\n<\/ol>\n<h2>延伸推演：卷积与组合计数<\/h2>\n<p>母函数相乘对应数列卷积：<span class=\"katex-inline\">C(z)=G(z)H(z)<\/span> 时，<span class=\"katex-inline\">c_n=\\sum_{k=0}^{n}a_kb_{n-k}<\/span>。组合计数中这一结构直接可用：选 <span class=\"katex-inline\">k<\/span> 个甲类物品与 <span class=\"katex-inline\">n-k<\/span> 个乙类物品的方案数求和，正是卷积形式。<\/p>\n<p>常见闭式母函数：<\/p>\n<ul><li>\n常数列 <span class=\"katex-inline\">1,1,1,\\dots<\/span>：<span class=\"katex-inline\">1/(1-z)<\/span>；\n<\/li><li>\n自然数列 <span class=\"katex-inline\">0,1,2,3,\\dots<\/span>：<span class=\"katex-inline\">z/(1-z)^2<\/span>；\n<\/li><li>\n二项式系数行：<span class=\"katex-inline\">(1+z)^m<\/span>；\n<\/li><li>\n几何权重序列：按 <span class=\"katex-inline\">r^n<\/span> 展开 <span class=\"katex-inline\">1/(1-rz)<\/span>。\n<\/ul>\n<p>取系数记号 <span class=\"katex-inline\">[z^n]G(z)<\/span> 表示 <span class=\"katex-inline\">G(z)<\/span> 展开式中 <span class=\"katex-inline\">z^n<\/span> 的系数；母函数法的最终目标就是读出这个系数，再翻译回计数或通项公式。<\/p>\n<h2>第二算例：<span class=\"katex-inline\">1/(1-z)^2<\/span> 系数展开<\/h2>\n<p>由 <span class=\"katex-inline\">1/(1-z)=\\sum_{n\\ge0}z^n<\/span>，自乘一次：<\/p>\n<div class=\"katex-block\">\\frac{1}{(1-z)^2}=\\left(\\sum_{n\\ge0}z^n\\right)^2=\\sum_{n\\ge0}\\left(\\sum_{k=0}^{n}1\\right)z^n=\\sum_{n\\ge0}(n+1)z^n<\/div>\n<p>系数为 <span class=\"katex-inline\">n+1<\/span>，即自然数列上移一位。再乘一次 <span class=\"katex-inline\">1/(1-z)<\/span>，系数变为 <span class=\"katex-inline\">\\binom{n+2}{2}<\/span>，对应二维非负整数解计数。卷积次数与维度提升的对应，是母函数解组合问题的基本模式。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;母函数就是普通多项式&quot;。<\/strong> 母函数是形式幂级数，长度无限；多项式除法结论不能整套搬用，除法按系数逐项匹配。\n<\/li><li>\n<strong>误解二：&quot;解方程得到 <span class=\"katex-inline\">G(z)<\/span> 就完成了&quot;。<\/strong> <span class=\"katex-inline\">G(z)<\/span> 是中间载体，最终要取 <span class=\"katex-inline\">[z^n]G(z)<\/span> 回到数列；停在函数式不算求解递推。\n<\/li><li>\n<strong>误解三：&quot;母函数能证明一切递推性质&quot;。<\/strong> 母函数给系数关系；命题真值核验仍靠归纳法（c03），两条路互补。\n<\/li><li>\n<strong>误解四：&quot;普通母函数可直接用于排列计数&quot;。<\/strong> 排列有顺序重复因素，计数用指数母函数 <span class=\"katex-inline\">\\sum a_nz^n/n!<\/span>；混用会得到错误系数。\n<\/ul>\n<h2>边界对照：母函数在全书分析链条中的位置<\/h2>\n<p>c11 调和数求和式常作为母函数系数出现；c05 带轮换约束的排列计数可由母函数分类统计；c10 概率分布的矩估计对应概率母函数。递推求解、组合计数、递推数列通项是母函数三类主要场景；与大 O 记号配合时，母函数给出精确系数结构，渐进分析给出规模量级。<\/p>\n<h2>推演补充：母函数解题的标准步骤<\/h2>\n<p>第一步，写递推与初值：明确 <span class=\"katex-inline\">a_0,a_1<\/span> 与 <span class=\"katex-inline\">n\\ge2<\/span>（或对应起点）的递推式。 第二步，建 <span class=\"katex-inline\">G(z)=\\sum_{n\\ge0}a_nz^n<\/span>，写出 <span class=\"katex-inline\">zG(z)<\/span>、<span class=\"katex-inline\">z^2G(z)<\/span> 等移位形式，标注各覆盖下标。 第三步，递推乘 <span class=\"katex-inline\">z^n<\/span> 求和，边界项单独摘出（<span class=\"katex-inline\">a_0,a_1z<\/span> 等）。 第四步，整理成 <span class=\"katex-inline\">G(z)<\/span> 的代数方程，解出闭式。 第五步，展开或部分分式分解，取 <span class=\"katex-inline\">[z^n]G(z)<\/span> 得通项或系数关系。<\/p>\n<p>每一步核对下标范围：漏边界项是最常见错位；移位项覆盖的下标写错，方程常数项就偏。解出 <span class=\"katex-inline\">G(z)<\/span> 后回到归纳法核验初值与递推，两条路互相印证。<\/p>\n<h2>第三算例：简单递推母函数<\/h2>\n<p>递推 <span class=\"katex-inline\">a_0=1,\\ a_n=2a_{n-1}<\/span>（<span class=\"katex-inline\">n\\ge1<\/span>）。<span class=\"katex-inline\">G(z)=\\sum a_nz^n<\/span>，<span class=\"katex-inline\">zG(z)=\\sum a_{n-1}z^n<\/span>。递推乘 <span class=\"katex-inline\">z^n<\/span> 求和：<span class=\"katex-inline\">G(z)-1=2zG(z)<\/span>，得 <span class=\"katex-inline\">G(z)=1/(1-2z)<\/span>，展开系数 <span class=\"katex-inline\">a_n=2^n<\/span>。<\/p>\n<p>再取 <span class=\"katex-inline\">b_0=1,\\ b_n=b_{n-1}+n
