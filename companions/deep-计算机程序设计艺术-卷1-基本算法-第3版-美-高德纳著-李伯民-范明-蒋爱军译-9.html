*{box-sizing:border-box}
html,body{margin:0;padding:0}

a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);

.sidebar h1{font-size:17px;margin:2px 0 2px}

#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}

.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}

.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}

#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */

#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}

  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}

  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}

艺术 卷1 基本算法 第3版.pdf", "page": 208}, "prerequisites": [], "depthFragment": "concepts/c08-depth.md"}, {"id": "c09", "title": "线性同余发生器：模数选择与周期", "file": "concepts/c09.md", "chapterIds": ["ch03"], "difficulty": "进阶", "source": {"file": "计算机程序设计艺术 卷1 基本算法 第3版.pdf", "page": null}, "prerequisites": ["c04"], "depthFragment": "concepts/c09-depth.md"}, {"id": "c10", "title": "随机数检验：谱检验思想、χ² 统计量与“随机不可证”", "file": "concepts/c10.md", "chapterIds": ["ch03"], "difficulty": "高难", "source": {"file": "计算机程序设计艺术 卷1 基本算法 第3版.pdf", "page": null}, "prerequisites": ["c09"], "depthFragment": "concepts/c10-depth.md"}, {"id": "c11", "title": "调和数与求和的渐进估计", "file": "concepts/c11.md", "chapterIds": ["ch04"], "difficulty": "进阶", "source": {"file": "计算机程序设计艺术 卷1 基本算法 第3版.pdf", "page": 76}, "prerequisites": [], "depthFragment": "concepts/c11-depth.md"}, {"id": "c12", "title": "生成函数入门：把递推变成母函数", "file": "concepts/c12.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "计算机程序设计艺术 卷1 基本算法 第3版.pdf", "page": 86}, "prerequisites": ["c11"], "depthFragment": "concepts/c12-depth.md"}], "glossary": [{"term": "算法（algorithm）", "def": "对一类问题给出的、由有限条明确指令组成的操作序列；Knuth 概括为具备有限性、确定性、输入、输出、可行性五条特征", "chapterId": "ch01"}, {"term": "有限性（有穷性）", "def": "算法必须在执行有限步之后终止；只满足其余四条特征、但可能不终止的过程称为计算方法，而非算法", "chapterId": "ch01"}, {"term": "确定性", "def": "算法每一步要执行的操作都给出严格无歧义的说明；用自然语言描述时读者理解可能有出入，因此关键算法常同时配机器语言程序", "chapterId": "ch01"}, {"term": "MIX", "def": "书中设计的一台虚拟精简指令计算机，记号 1009；数据单位为字节，同时兼容二进制与十进制视角，用于在不依赖特定真机的前提下描述算法与计步", "chapterId": "ch01"}, {"term": "数学归纳法", "def": "证明命题 $P(n)$ 对所有正整数成立的方法：先证基础步 $P(1)$，再证归纳步——若 $P(1),\\dots,P(n)$ 全为真则 $P(n+1)$ 为真；另有强归纳形式", "chapterId": "ch01"}, {"term": "最大公约数（gcd）", "def": "同时整除 $m$ 和 $n$ 的最大正整数；欧几里得算法反复用余数替换，过程中 gcd 保持不变", "chapterId": "ch01"}, {"term": "置换（排列）", "def": " $n$ 个不同对象排成一行的一种排放方式；$n$ 元置换共有 $n!$ 个，可用轮换分解表示", "chapterId": "ch01"}, {"term": "轮换分解", "def": "把置换写成若干互不相交轮换的乘积；每个轮换 $(a_1\\ a_2\\ \\dots\\ a_k)$ 表示 $a_1\\to a_2,\\dots,a_k\\to a_1$", "chapterId": "ch01"}, {"term": "线性表（linear list）", "def": " $n\\ge 0$ 个结点排成一行的序列；只关心各项相对位置，第一结点为 $X[1]$，最后一结点为 $X[n]$", "chapterId": "ch02"}, {"term": "顺序分配 / 链接分配", "def": "顺序分配把表元素连续存放在数组式存储区；链接分配在每个结点里放链字段，用指针把结点串起来；两者在随机访问与插入删除上代价相反", "chapterId": "ch02"}, {"term": "二叉树", "def": "结点的有限集：或者为空，或者由一个根和两棵互不相交的二叉树（左子树、右子树）组成；左右子树有次序之分", "chapterId": "ch02"}, {"term": "遍历（traversal）", "def": "系统地考察树的结点，使每个结点恰被访问一次；二叉树有先序、中序、后序三种递归次序", "chapterId": "ch02"}, {"term": "线性同余发生器（LCG）", "def": "按递推 $X_{n+1}=(aX_n+c)\\bmod m$ 产生序列的方法；$m$ 为模数，$a$ 为乘子，$c$ 为增量", "chapterId": "ch03"}, {"term": "谱检验（spectral test）", "def": "从高维格点分布角度检验发生器：考察相邻超平面之间的距离，距离过小或格点结构规则说明序列在高维上可被预测", "chapterId": "ch03"}, {"term": "χ² 统计量", "def": " $\\sum_i (O_i-E_i)^2/E_i$，其中 $O_i$ 为第 $i$ 类观测频数、$E_i$ 为期望频数；数值越大，观测分布与均匀期望偏离越远", "chapterId": "ch03"}, {"term": "调和数 $H_n$", "def": " $H_n=1+1/2+\\cdots+1/n=\\sum_{k=1}^{n}1/k$；量级为 $\\ln n+\\gamma$，$\\gamma$ 为欧拉常数", "chapterId": "ch04"}, {"term": "生成函数（母函数）", "def": "对数列 $\\langle a_n\\rangle$ 建立幂级数 $G(z)=\\sum_{n\\ge 0}a_n z^n$，用一个函数承载整列数；递推关系可转化为 $G(z)$ 的代数方程", "chapterId": "ch04"}, {"term": "大 O 记号", "def": " $x_n=O(f(n))$ 表示存在正常数 $M$ 与 $n_0$，使 $n\\ge n_0$ 时 $|x_n|\\le M|f(n)|$；大 O 是单向包含关系，不能反向写等号", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [], "flashcards": []}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.18<\/div><h1>第 1 章：基本概念——算法、证明方法、数论工具与置换<\/h1>\n<blockquote>对应原书第 1 章 §1.1「算法」、§1.2.1「数学归纳法」、§1.2.4「整数函数与初等数论」、§1.2.5「排列与阶乘」（PDF 第 18–52 页；印刷页 = PDF 页 − 17）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n复述算法的五条特征，指出&quot;有限性&quot;与其余四条的差别，说明一个不终止的过程为什么不算算法；\n<\/li><li>\n按归纳法两步写出对数列命题的证明，找出只做归纳步、漏掉基础步这类证明里的漏洞；\n<\/li><li>\n手算欧几里得算法求两个整数的最大公约数，逐步说明 gcd 不变量为什么保持，估计步数的数量级；\n<\/li><li>\n把一个给定置换写成互不相交的轮换乘积，数出一个排列包含的逆序对数；\n<\/li><li>\n说清 Knuth 为什么在书里使用一台虚构机器 MIX，而不是直接对着某款真机讲算法。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>算法是一组有限、确定、有输入输出、每步可行的操作指令；要证明算法对所有输入成立，靠的是归纳法这类可复核的推理；数论工具（余数、整除、gcd）是后面分析算法与构造发生器的地基；置换则把&quot;一组对象的重排&quot;变成可以形式分解的对象。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：算法的五条特征与有穷性边界（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。书里在 §1.1 先用欧几里得算法作为第一个完整算法样例，再回过头概括算法的含义：一个算法不仅是求解问题的有限操作序列，还必须具备有限性、确定性、输入、输出、可行性五条特征（PDF 第 20–21 页）。有限性要求算法在有限步之后终止；其余四条分别约束每一步无歧义、有初始量、有与输入存在指定关系的结果、操作本身足够基本可以纸笔完成。只缺有限性的过程，书里称为&quot;计算方法&quot;，例如与环境不断交互的反应式进程。<\/p>\n<h3>2. 概念 2：MIX 与现代机器的关系（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。书里反复用到一台虚构计算机 MIX，记号 1009，字节至少能保存 64 个不同值，同时兼容二进制与十进制视角（PDF 第 116 页）。选假机器的理由是：真机每隔几年换代，指令集还带大量与本书主题无关的硬件特性；用一台规则简单的抽象机器描述算法，计步与结构分析不被某款芯片的细节绑死。<\/p>\n<h3>3. 概念 3：数学归纳法的形式与误用（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。§1.2.1 把归纳法写成两步：先证 <span class=\"katex-inline\">P(1)<\/span> 为真，再证若 <span class=\"katex-inline\">P(1),\\dots,P(n)<\/span> 全为真则 <span class=\"katex-inline\">P(n+1)<\/span> 为真（PDF 第 25 页）。归纳法是后面证明算法正确性、推导递推数列性质的标准工具；常见漏洞集中在基础步未证、归纳步假设范围写错、以及把强归纳当成普通归纳使用。<\/p>\n<h3>4. 概念 4：欧几里得算法的正确性与复杂度（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。算法 E 给定两个正整数 <span class=\"katex-inline\">m,n<\/span>，反复用 <span class=\"katex-inline\">n<\/span> 除 <span class=\"katex-inline\">m<\/span> 取余数 <span class=\"katex-inline\">r<\/span>，再把 <span class=\"katex-inline\">(m,n)<\/span> 替换成 <span class=\"katex-inline\">(n,r)<\/span>，直到余数为 0（PDF 第 19–20 页）。正确性靠 gcd 不变量：每一步前后 <span class=\"katex-inline\">(m,n)<\/span> 与 <span class=\"katex-inline\">(n,r)<\/span> 的公约数集合相同；步数最坏情况与斐波那契数列挂钩，量级为 <span class=\"katex-inline\">O(\\log\\min(m,n))<\/span>。<\/p>\n<h3>5. 概念 5：置换与轮换分解（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。§1.2.5 定义 <span class=\"katex-inline\">n<\/span> 元排列为 <span class=\"katex-inline\">n<\/span> 个不同对象排成一行的排放方式，3 个对象 <span class=\"katex-inline\">\\{a,b,c\\}<\/span> 共有 6 种排列（PDF 第 52 页）。把置换作用在元素上的轨迹追踪下来，就得到互不相交的轮换；逆序对则衡量一个排列离顺序排列有多远。<\/p>\n<h2>推导一（证明）：gcd 不变量为什么保持<\/h2>\n<p>设当前两数为 <span class=\"katex-inline\">m,n<\/span>，按算法 E1 做除法 <span class=\"katex-inline\">m=qn+r<\/span>，其中 <span class=\"katex-inline\">0\\le r&lt;n<\/span>。<\/p>\n<p>第一步，任取 <span class=\"katex-inline\">m,n<\/span> 的一个公约数 <span class=\"katex-inline\">d<\/span>：<span class=\"katex-inline\">d\\mid m<\/span> 且 <span class=\"katex-inline\">d\\mid n<\/span>，于是 <span class=\"katex-inline\">d<\/span> 整除 <span class=\"katex-inline\">m-qn<\/span>，而 <span class=\"katex-inline\">m-qn=r<\/span>，所以 <span class=\"katex-inline\">d\\mid r<\/span>。这说明 <span class=\"katex-inline\">m,n<\/span> 的全部公约数都是 <span class=\"katex-inline\">n,r<\/span> 的公约数。<\/p>\n<p>第二步，反过来任取 <span class=\"katex-inline\">n,r<\/span> 的一个公约数 <span class=\"katex-inline\">e<\/span>：<span class=\"katex-inline\">e\\mid n<\/span> 且 <span class=\"katex-inline\">e\\mid r<\/span>，于是 <span class=\"katex-inline\">e<\/span> 整除 <span class=\"katex-inline\">qn+r=m<\/span>，所以 <span class=\"katex-inline\">e\\mid m<\/span>。这说明 <span class=\"katex-inline\">n,r<\/span> 的全部公约数也都是 <span class=\"katex-inline\">m,n<\/span> 的公约数。<\/p>\n<p>两个方向合起来，<span class=\"katex-inline\">\\gcd(m,n)<\/span> 与 <span class=\"katex-inline\">\\gcd(n,r)<\/span> 的公约数集合完全相同，最大公约数自然相等。算法 E3 执行 <span class=\"katex-inline\">m\\leftarrow n,\\ n\\leftarrow r<\/span> 之后，待求问题从&quot;求 <span class=\"katex-inline\">(m,n)<\/span> 的 gcd&quot;换成&quot;求 <span class=\"katex-inline\">(n,r)<\/span> 的 gcd&quot;，答案没有改变。<\/p>\n<h2>推导二（推演）：一次完整的欧几里得手算<\/h2>\n<p>取书里的算例方向：<span class=\"katex-inline\">m=119,\\ n=544<\/span>。因为初值 <span class=\"katex-inline\">m&lt;n<\/span>，先交换使 <span class=\"katex-inline\">m=544,\\ n=119<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">544=4\\cdot119+68<\/span>，余数 <span class=\"katex-inline\">r=68<\/span>；更新 <span class=\"katex-inline\">m=119,\\ n=68<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">119=1\\cdot68+51<\/span>，余数 <span class=\"katex-inline\">r=51<\/span>；更新 <span class=\"katex-inline\">m=68,\\ n=51<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">68=1\\cdot51+17<\/span>，余数 <span class=\"katex-inline\">r=17<\/span>；更新 <span class=\"katex-inline\">m=51,\\ n=17<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">51=3\\cdot17+0<\/span>，余数 <span class=\"katex-inline\">r=0<\/span>；算法终止，答案为 <span class=\"katex-inline\">n=17<\/span>。\n<\/ol>\n<p>对照不变量：第 1 步前后 <span class=\"katex-inline\">\\gcd(544,119)=\\gcd(119,68)<\/span>，第 2 步前后 <span class=\"katex-inline\">\\gcd(119,68)=\\gcd(68,51)<\/span>，第 3 步前后 <span class=\"katex-inline\">\\gcd(68,51)=\\gcd(51,17)<\/span>，最后 <span class=\"katex-inline\">\\gcd(51,17)=17<\/span>。全程四次除法，余数序列 <span class=\"katex-inline\">68,51,17,0<\/span> 严格递减。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>去掉有限性要求<\/strong>：一个每步确定、有输入有输出、操作可行，却可能无限循环的过程，按本书定义不能称为算法。例如&quot;不断生成比当前数更大的素数并记录&quot;，只要不设终止条件，它永远在工作；程序可以运行，但无法保证在有限时间给出结果。反应式进程就是这一类，它与算法的差别不在某一步写得对不对，而在终止性这条外部约束。\n<\/li><li>\n<strong>归纳法不证基础步<\/strong>：假设有人直接从归纳步出发，声称&quot;所有 <span class=\"katex-inline\">n<\/span> 匹马同色&quot;：任取 <span class=\"katex-inline\">n<\/span> 匹马，换掉一匹仍得 <span class=\"katex-inline\">n<\/span> 匹，由归纳假设同色。基础步 <span class=\"katex-inline\">n=1<\/span> 本应平凡成立，但论证在 <span class=\"katex-inline\">n=2<\/span> 这一步无法把两组单匹马的颜色接起来；缺了对最小情形的核验，归纳链条从第一环就悬空，后面每一步再整齐也推不出真命题。\n<\/li><li>\n<strong>gcd 替换顺序写反<\/strong>：E3 要求先置 <span class=\"katex-inline\">m\\leftarrow n<\/span>、再置 <span class=\"katex-inline\">n\\leftarrow r<\/span>。若写成先 <span class=\"katex-inline\">n\\leftarrow r<\/span> 再 <span class=\"katex-inline\">m\\leftarrow n<\/span>，<span class=\"katex-inline\">m<\/span> 拿到的是 <span class=\"katex-inline\">r<\/span> 而不是原来的 <span class=\"katex-inline\">n<\/span>，余数信息丢失，后续除法不再对应不变量证明里的 <span class=\"katex-inline\">(n,r)<\/span> 对，答案会错。\n<\/li><li>\n<strong>把模数取成合数而乘子选错<\/strong>：这一单元只铺垫数论背景；发生器一侧的周期崩溃留到第 3 章展开。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章是全书的概念地基：归纳法是第 4 章分析递推与求和的推理工具；gcd 与余数是第 3 章线性同余发生器、模运算检验的前置；置换概念在 §1.3.3 排列的应用里接机器指令，又在第 2 章树结构的枚举、第 5 章排序问题中反复出现。下一章进入信息结构，看这些数论与证明工具怎样被用来组织内存里的数据对象。<\/p>", "kind": "chapter", "title": "第 1 章：基本概念——算法、证明方法、数论工具与置换"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.204<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：基本概念——算法、证明方法、数论工具与置换<\/a><\/span><\/div><h1>第 2 章：信息结构——线性表、树、二叉树遍历与多重链接<\/h1>\n<blockquote>对应原书第 2 章 §2.1「引论」、§2.2「线性表」、§2.3「树」、§2.4「多链结构」（PDF 第 204–350 页；印刷页 = PDF 页 − 17）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出线性表定义的相对位置语义，列出对线性表常做的九类操作；\n<\/li><li>\n对比顺序分配与链接分配在随机访问、插入、删除、空间开销上的代价，给出插入删除各自动多少步的算例；\n<\/li><li>\n复述树的递归定义，区分有序树、定向树与森林；\n<\/li><li>\n画出森林到二叉树的&quot;左孩右兄&quot;对应关系，说清两个链字段各指向谁；\n<\/li><li>\n对给定二叉树写出先序、中序、后序遍历序列，并说清递归遍历怎样落到栈上实现。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>信息在机器里不是一团杂乱数值，结点之间带有结构关系；最简单的结构是排成一行的线性表，进一步分支分层就得到树，而一般的树与森林总能对应到一棵二叉树，因此遍历、存储、分析先在二叉树上做透，再推广回树。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：线性表的数组分配与链接分配（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。§2.2 开头定义线性表为 <span class=\"katex-inline\">n\\ge 0<\/span> 个结点 <span class=\"katex-inline\">X[1],X[2],\\dots,X[n]<\/span> 的序列，结构性质只是各项排成一行时的相对位置（PDF 第 208 页）。围绕表的操作包括访问第 <span class=\"katex-inline\">k<\/span> 个结点、在前后插入新结点、删除第 <span class=\"katex-inline\">k<\/span> 个结点、合并、拆分、复制、计数、排序与搜索。表示方法有两类：顺序分配把元素连续放在存储区；链接分配在结点里留链字段，用指针把结点串起来。两类方法在访问速度与增删代价上正好相反。<\/p>\n<h3>2. 概念 2：二叉树三种遍历次序与栈实现（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。§2.3.1 把遍历定义为系统地考察结点、每个结点恰访问一次；二叉树遍历分先序、中序、后序三种递归次序（PDF 第 270 页）。书里样例二叉树先序输出为 <span class=\"katex-inline\">A\\ B\\ D\\ C\\ E\\ G\\ F\\ H\\ J<\/span>。递归写法靠调用栈保存现场，改成迭代版本时用显式栈模拟左子树链的下压与回退。<\/p>\n<h3>3. 概念 3：树与二叉树的等价表示（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。§2.3.2 指出树与二叉树的基本差别：树总有根、不为空，结点可以有任意多个子女；二叉树可以为空，结点至多两个子女且区分左右。有一种自然对应：把每家子女横向链接，删去父母到第一个子女之外的竖直链，再把图顺时针转 <span class=\"katex-inline\">45^\\circ<\/span>，森林就变成一棵二叉树（PDF 第 282 页）。二叉树结点的左链指向第一个子女，右链指向下一个兄弟。<\/p>\n<h3>4. 多重链接结构<\/h3>\n<p>§2.4 讨论结点带好几个链字段的情形（PDF 第 350 页）。前面线性表与树大多只有一两个链字段；高级应用里结构类型同时出现，一个结点既要挂在这条链上，又要挂在那条链上。这一节同时引出一个设计问题：内存里应该显式记录多少结构信息——记录得越多访问越快，重复存储的代价也越高。<\/p>\n<h2>推导一（推演）：顺序表与链表的插入代价对比<\/h2>\n<p>设表长 <span class=\"katex-inline\">n<\/span>，两种表示各做一次&quot;在第 <span class=\"katex-inline\">k<\/span> 个结点之后插入新结点 <span class=\"katex-inline\">x<\/span>&quot;。<\/p>\n<p>顺序分配：元素连续存放，新结点要占第 <span class=\"katex-inline\">k+1<\/span> 个位置，原位置 <span class=\"katex-inline\">k+1,\\dots,n<\/span> 的元素必须整体后移一格。需要移动的元素个数是 <span class=\"katex-inline\">n-k<\/span>；下标定位本身只要一次计算。删除第 <span class=\"katex-inline\">k<\/span> 个结点时对称，把 <span class=\"katex-inline\">k+1,\\dots,n<\/span> 前移一格，移动 <span class=\"katex-inline\">n-k<\/span> 个元素。表尾插入 <span class=\"katex-inline\">k=n<\/span> 时移动 0 个元素，表头插入 <span class=\"katex-inline\">k=1<\/span> 时移动 <span class=\"katex-inline\">n-1<\/span> 个元素。<\/p>\n<p>链接分配：结点里保存链字段。找到第 <span class=\"katex-inline\">k<\/span> 个结点需要沿链走 <span class=\"katex-inline\">k<\/span> 步；定位之后插入只改两个指针：新结点的链指向原后继，原结点的链改指新结点，不挪动任何已有元素。删除时同样先定位，再把前驱的链直接接到后继。链表的代价集中在查找，插入删除动作本身是常数步；代价反过来集中在移动的是顺序表。<\/p>\n<p>空间上，链表每个结点额外存至少一个链字段；顺序表按最大长度预留连续区域，表长波动大时容易出现预留不足或空间闲置。<\/p>\n<h2>推导二（证明方向）：森林与二叉树的一一对应<\/h2>\n<p>先看单棵有序树。根的子女按次序排列，取第一个子女作为二叉树根的左孩子；同一父母的兄弟之间用右链依次相连。把这两条规则用到森林的每一棵树，再把各棵树的根视为兄弟、用右链串起来。<\/p>\n<p>对应是可逆的：从一棵二叉树出发，左链回到&quot;第一个子女&quot;，右链回到&quot;下一个兄弟&quot;，按规则还原出原森林。两个方向映射都唯一，因此树/森林的存储与遍历问题可以转成二叉树问题处理。这一对应解释了为什么书里先在 §2.3.1 把二叉树遍历讲透：遍历结果能翻译回树的先根次序与后根次序，而二叉树结点只需两个链字段，结构简单且无歧义。<\/p>\n<h2>反事实：改掉表示方式会怎样<\/h2>\n<ul><li>\n<strong>顺序表禁止移动元素<\/strong>：若存储区不允许整体搬移，表头插入就无法在连续空间完成；强行不移动会把新元素放到表尾，相对位置语义被破坏。这也是链表在频繁头尾增删场景下被采用的原因。\n<\/li><li>\n<strong>链表随机访问不沿链走<\/strong>：第 <span class=\"katex-inline\">k<\/span> 个结点没有下标可直接算，跳过中间结点就读不到目标；想 <span class=\"katex-inline\">O(1)<\/span> 取任意位置结点，只能回到顺序分配，或在链表上加索引、跳表这类辅助结构。\n<\/li><li>\n<strong>左孩右兄只留一个链字段<\/strong>：只有左链时，兄弟之间失去联系，根的第二个及以后子女无处挂靠；只有右链时，父母与第一个子女的关系丢失。两个链字段分别承担&quot;向下&quot;与&quot;向右&quot;两类关系，缺一个方向信息就还原不出原树。\n<\/li><li>\n<strong>遍历次序把左右子树顺序写反<\/strong>：先序定义为访问根、遍历左、遍历右；若把左右互换，同一棵树会得到另一套序列，且与中序、后序不再是同一棵树的三种视图。次序约定是遍历结果可对照的前提。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章结构表示是第 1 章算法概念的落地对象：线性表与树的操作本身就是算法，插入删除步数分析要用到第 4 章的求和与渐进估计。多重链接为后面编译符号表、稀疏矩阵、操作系统队列等应用铺路；树的递归定义与第 1 章归纳法直接呼应——树按结点数归纳证明性质，遍历按递归结构展开。下一章把视角转到数发生器：余数与整除在那里变成序列周期与均匀性检验。<\/p>", "kind": "chapter", "title": "第 2 章：信息结构——线性表、树、二叉树遍历与多重链接"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.47<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：基本概念——算法、证明方法、数论工具与置换<\/a><\/span><\/div><h1>第 3 章：起点与随机数——模运算铺垫、线性同余发生器与随机数检验<\/h1>\n<blockquote>对应原书第 1 章 §1.2.4「整数函数与初等数论」（PDF 第 47–51 页；印刷页 = PDF 页 − 17）。说明：线性同余发生器与随机数检验的完整讨论属于原丛书卷 2 第 3 章，本卷未收录；本单元只回收卷一的数论铺垫，发生器与检验部分按通行方法讲解，不挂本卷页码，涉及具体定理条件以通行数论结果为准。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出余数、整除、同余的基本记号，把一个除法写成 <span class=\"katex-inline\">m=qn+r<\/span> 的形式；\n<\/li><li>\n写出线性同余递推 <span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span>，手动算出前若干项，并在小模数上观察周期；\n<\/li><li>\n复述满周期条件的三个方向：增量与模数互素、<span class=\"katex-inline\">a-1<\/span> 被模数的每个素因子整除、模数被 4 整除时 <span class=\"katex-inline\">a-1<\/span> 也被 4 整除；\n<\/li><li>\n解释谱检验在高维格点上看什么，写出 χ² 统计量的算式并说明各项含义；\n<\/li><li>\n说清为什么&quot;序列是随机的&quot;无法被证明，检验只能证伪均匀性假设。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>随机数发生器是一个确定的递推过程：从初值出发，乘子、增量、模数按模运算造出下一项；衡量它不靠感觉，而靠一批统计检验——低维均匀性看谱结构，频数均匀性看 χ² 偏离；任何检验都只能排除不合格的发生器，不能保证剩下的序列&quot;真的随机&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 数论铺垫：余数与整除<\/h3>\n<p>§1.2.4 在整数函数一节进入初等数论：对实数 <span class=\"katex-inline\">x<\/span>，下整 <span class=\"katex-inline\">\\lfloor x\\rfloor<\/span> 是不超过 <span class=\"katex-inline\">x<\/span> 的最大整数，上整 <span class=\"katex-inline\">\\lceil x\\rceil<\/span> 是不小于 <span class=\"katex-inline\">x<\/span> 的最小整数（PDF 第 47 页）。整数除法写成 <span class=\"katex-inline\">m=qn+r<\/span>，<span class=\"katex-inline\">0\\le r&lt;n<\/span>，<span class=\"katex-inline\">r<\/span> 就是 <span class=\"katex-inline\">m<\/span> 除以 <span class=\"katex-inline\">n<\/span> 的余数；<span class=\"katex-inline\">d\\mid m<\/span> 表示 <span class=\"katex-inline\">d<\/span> 整除 <span class=\"katex-inline\">m<\/span>。欧几里得算法反复使用的余数替换，是发生器里模运算的同一套规则。<\/p>\n<h3>2. 概念 1：线性同余发生器的模数选择与周期（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。线性同余发生器（LCG）按 <span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span> 递推。<span class=\"katex-inline\">m<\/span> 是模数，<span class=\"katex-inline\">a<\/span> 是乘子，<span class=\"katex-inline\">c<\/span> 是增量，<span class=\"katex-inline\">X_0<\/span> 是初值。状态空间只有 <span class=\"katex-inline\">m<\/span> 个，序列必然在某一步回到旧状态并进入循环；周期是从初值到首次重复经过的步数。满周期指序列遍历全部 <span class=\"katex-inline\">m<\/span> 个状态再回到初值。<\/p>\n<h3>3. 概念 2：随机数检验的思想（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。检验分两类思路：一类看一维频数是否接近期望，用 χ² 统计量比较观测频数与期望频数；一类看高维结构，谱检验把相邻状态看成格点，考察相邻超平面间距，间距过小说明序列在多维上留有规则痕迹。检验结果是&quot;拒绝/不拒绝均匀假设&quot;，不是&quot;证明随机&quot;。<\/p>\n<h2>推导一（推演）：小模数 LCG 逐项计算与周期观察<\/h2>\n<p>取 <span class=\"katex-inline\">m=16,\\ a=5,\\ c=1,\\ X_0=1<\/span>。递推 <span class=\"katex-inline\">X_{n+1}=(5X_n+1)\\bmod 16<\/span>，逐项计算：<\/p>\n<ul><li>\n<span class=\"katex-inline\">X_1=(5\\cdot1+1)\\bmod16=6<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_2=(5\\cdot6+1)\\bmod16=31\\bmod16=15<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_3=(5\\cdot15+1)\\bmod16=76\\bmod16=12<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_4=(5\\cdot12+1)\\bmod16=61\\bmod16=13<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_5=(5\\cdot13+1)\\bmod16=66\\bmod16=2<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_6=(5\\cdot2+1)\\bmod16=11<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_7=(5\\cdot11+1)\\bmod16=56\\bmod16=8<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_8=(5\\cdot8+1)\\bmod16=41\\bmod16=9<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_9=(5\\cdot9+1)\\bmod16=46\\bmod16=14<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_{10}=(5\\cdot14+1)\\bmod16=71\\bmod16=7<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_{11}=(5\\cdot7+1)\\bmod16=36\\bmod16=4<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_{12}=(5\\cdot4+1)\\bmod16=21\\bmod16=5<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_{13}=(5\\cdot5+1)\\bmod16=26\\bmod16=10<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_{14}=(5\\cdot10+1)\\bmod16=51\\bmod16=3<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_{15}=(5\\cdot3+1)\\bmod16=16\\bmod16=0<\/span>\n<\/li><li>\n<span class=\"katex-inline\">X_{16}=(5\\cdot0+1)\\bmod16=1<\/span>，回到初值 <span class=\"katex-inline\">X_0=1<\/span>。\n<\/ul>\n<p>16 个状态 <span class=\"katex-inline\">0,1,\\dots,15<\/span> 各出现一次，周期为 16，等于模数。对照满周期条件方向：<span class=\"katex-inline\">c=1<\/span> 与 <span class=\"katex-inline\">m=16<\/span> 互素；<span class=\"katex-inline\">a-1=4<\/span> 被 16 的素因子 2 整除；16 被 4 整除，<span class=\"katex-inline\">a-1=4<\/span> 也被 4 整除。三个方向同时满足。<\/p>\n<h2>推导二（推演）：χ² 统计量怎样从频数算到偏离值<\/h2>\n<p>把 <span class=\"katex-inline\">[0,1)<\/span> 区间分成 <span class=\"katex-inline\">k<\/span> 个等长类别，生成 <span class=\"katex-inline\">N<\/span> 个随机数，第 <span class=\"katex-inline\">i<\/span> 类观测到 <span class=\"katex-inline\">O_i<\/span> 个。均匀假设下每类期望 <span class=\"katex-inline\">E_i=N/k<\/span>。<\/p>\n<p>统计量定义为：<\/p>\n<div class=\"katex-block\">\\chi^2=\\sum_{i=1}^{k}\\frac{(O_i-E_i)^2}{E_i}<\/div>\n<p>每一项把偏离量 <span class=\"katex-inline\">(O_i-E_i)<\/span> 平方后除以期望：平方消除正负号，除以 <span class=\"katex-inline\">E_i<\/span> 把偏离折算成相对尺度。各类偏离同向累加。若观测完全接近期望，每一项接近 0，统计量接近 0；某一类明显偏多或偏少，对应项变大，总和抬高。对照临界值可以判断是否拒绝均匀假设；类别数、样本量都会影响统计量的参照分布，小样本下 χ² 结论不稳。<\/p>\n<h2>反事实：改掉发生器条件会怎样<\/h2>\n<ul><li>\n<strong>模数取合数、乘子选错<\/strong>：取 <span class=\"katex-inline\">m=8,\\ a=2,\\ c=0,\\ X_0=1<\/span>，序列为 <span class=\"katex-inline\">1\\to2\\to4\\to0\\to0\\cdots<\/span>，第三步后卡在 0，周期只有 1。状态空间 8 个，实际只走过 3 个非零值；这类发生器在低维就显出规则痕迹，频数检验直接暴露。\n<\/li><li>\n<strong>增量 <span class=\"katex-inline\">c<\/span> 与模数不互素<\/strong>：若 <span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">m<\/span> 有公共因子 <span class=\"katex-inline\">d&gt;1<\/span>，序列各项与 <span class=\"katex-inline\">m<\/span> 的 gcd 被 <span class=\"katex-inline\">d<\/span> 约束，部分状态永远进不去，周期不可能达到 <span class=\"katex-inline\">m<\/span>。\n<\/li><li>\n<strong>把&quot;通过检验&quot;当成&quot;证明随机&quot;<\/strong>：一组序列通过了 χ² 频数检验，只说明在这一项观测上没发现偏离；谱检验、游程检验、间距检验可能在另一项上拒绝它。检验是排除工具，合格发生器是&quot;尚未被现有检验否决&quot;的发生器，不是被证明随机的发生器。\n<\/li><li>\n<strong>初值固定却要求每次运行不同<\/strong>：LCG 是确定过程，同一 <span class=\"katex-inline\">X_0<\/span> 产生同一整列序列；不换初值，重复运行得到重复结果，这与随机采样的独立性要求是两回事。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章的模运算直接接第 1 章 gcd 与余数替换；发生器周期分析用到递推与计数，第 4 章的求和、渐进与生成函数是分析这类递推的标准语言。检验思想中的频数比较，在算法分析里同样出现：估平均步数时把输入按类别分组，统计各类占比再加权求和。下一章收拢散在各章的分析方法：怎样估求和量级、怎样写渐进式、怎样把递推转成母函数。<\/p>", "kind": "chapter", "title": "第 3 章：起点与随机数——模运算铺垫、线性同余发生器与随机数检验"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.76<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：基本概念——算法、证明方法、数论工具与置换<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：信息结构——线性表、树、二叉树遍历与多重链接<\/a><\/span><\/div><h1>第 4 章：算法分析基础（对应原书第 1 章 §1.2 与第 3 章 §3.5 的分析方法）<\/h1>\n<blockquote>对应原书第 1 章 §1.2.7「调和数」、§1.2.9「生成函数」、§1.2.10「典型算法分析」、*§1.2.11「渐近表示」（PDF 第 76–102 页；印刷页 = PDF 页 − 17）。§3.5 的检验分析方法在卷 2，本单元只做方法层面的收拢，不挂本卷页码。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 1、2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出调和数 <span class=\"katex-inline\">H_n<\/span> 的定义，用分组求和给出 <span class=\"katex-inline\">H_{2^m}\\ge 1+m/2<\/span> 的下界方向，用积分比较估出 <span class=\"katex-inline\">H_n<\/span> 的对数量级；\n<\/li><li>\n复述 <span class=\"katex-inline\">H_n=\\ln n+\\gamma+O(1/n)<\/span> 的结构，说出 <span class=\"katex-inline\">\\gamma<\/span> 是欧拉常数，各项修正的位置；\n<\/li><li>\n对给定数列建立生成函数 <span class=\"katex-inline\">G(z)=\\sum_{n\\ge0}a_n z^n<\/span>，把一阶递推转化为 <span class=\"katex-inline\">G(z)<\/span> 的代数方程并取系数；\n<\/li><li>\n读懂大 O 记号的定义：存在正常数 <span class=\"katex-inline\">M,n_0<\/span> 使 <span class=\"katex-inline\">|x_n|\\le M|f(n)|<\/span>，说清大 O 为什么是单向包含；\n<\/li><li>\n按 §1.2.10 的路子走一遍典型算法分析：设输入规模、计数关键操作、求和得到表达式、再做渐进估计。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>算法分析把&quot;跑多久&quot;变成可计算的量：先对操作计数求和，再用调和数、积分比较、大 O 记号把精确表达式压成量级；生成函数则是另一套工具，把整列递推数装进一个幂级数，用代数运算代替逐项归纳。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：调和数与求和渐进（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c11.md\" target=\"_blank\" rel=\"noopener\">概念 c11<\/a>。§1.2.7 定义 <span class=\"katex-inline\">H_n=1+1/2+\\cdots+1/n=\\sum_{k=1}^{n}1/k<\/span>（PDF 第 76 页）。逐项看 <span class=\"katex-inline\">1/k<\/span> 趋向 0，但累加不会收敛：按二的幂分组可得 <span class=\"katex-inline\">H_{2^m}\\ge 1+m/2<\/span>。更精细的近似为 <span class=\"katex-inline\">H_n=\\ln n+\\gamma+1/(2n)-1/(12n^2)+1/(120n^4)-\\epsilon<\/span>，其中 <span class=\"katex-inline\">0&lt;\\epsilon&lt;1/(252n^6)<\/span>，<span class=\"katex-inline\">\\gamma=0.5772156649\\ldots<\/span> 为欧拉常数。<\/p>\n<h3>2. 概念 2：生成函数入门（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c12.md\" target=\"_blank\" rel=\"noopener\">概念 c12<\/a>。§1.2.9 对数列 <span class=\"katex-inline\">\\langle a_n\\rangle<\/span> 建立 <span class=\"katex-inline\">G(z)=a_0+a_1z+a_2z^2+\\cdots=\\sum_{n\\ge0}a_n z^n<\/span>（PDF 第 86 页）。一个函数承载整列数；递推定义的数列可以先转成 <span class=\"katex-inline\">G(z)<\/span> 的方程，解出 <span class=\"katex-inline\">G(z)<\/span> 后再取 <span class=\"katex-inline\">z^n<\/span> 系数。书里列出生成函数的基本运算：加法 <span class=\"katex-inline\">\\alpha G(z)+\\beta H(z)<\/span> 对应数列逐项线性组合；移位 <span class=\"katex-inline\">z^mG(z)<\/span> 对应数列右移 <span class=\"katex-inline\">m<\/span> 位。<\/p>\n<h3>3. 典型算法分析的路子<\/h3>\n<p>§1.2.10 用&quot;找出最大值&quot;的算法 M 演示分析流程（PDF 第 93 页）：给定 <span class=\"katex-inline\">n<\/span> 个元素 <span class=\"katex-inline\">X[1],\\dots,X[n]<\/span>，从 <span class=\"katex-inline\">j\\leftarrow n,\\ k\\leftarrow n-1,\\ m\\leftarrow X[n]<\/span> 开始，逐个比较 <span class=\"katex-inline\">X[k]<\/span> 与 <span class=\"katex-inline\">m<\/span>，更大则更新 <span class=\"katex-inline\">j,m<\/span>，<span class=\"katex-inline\">k<\/span> 递减直到 0。分析时先定义要计数的操作（比较次数、更新次数），再对所有输入或随机输入求和，最后把表达式压成渐进量级。大 O 记号在 §1.2.11.1 给出：<span class=\"katex-inline\">x_n=O(f(n))<\/span> 表示存在正常数 <span class=\"katex-inline\">M<\/span> 与 <span class=\"katex-inline\">n_0<\/span>，<span class=\"katex-inline\">n\\ge n_0<\/span> 时 <span class=\"katex-inline\">|x_n|\\le M|f(n)|<\/span>（PDF 第 102 页）。<\/p>\n<h2>推导一（证明方向）：调和数的下界与对数量级<\/h2>\n<p>下界分组：把 <span class=\"katex-inline\">H_{2^m}<\/span> 按相邻二的幂分段。<\/p>\n<div class=\"katex-block\">H_{2^m}=1+\\sum_{j=1}^{2^m}\\frac1j=1+\\underbrace{\\left(\\frac12\\right)}_{j=2}+\\underbrace{\\left(\\frac13+\\frac14\\right)}_{j=3,4}+\\underbrace{\\left(\\frac15+\\cdots+\\frac18\\right)}_{j=5\\dots8}+\\cdots+\\underbrace{\\left(\\frac1{2^{m-1}+1}+\\cdots+\\frac1{2^m}\\right)}_{j=2^{m-1}+1\\dots2^m}<\/div>\n<p>第 <span class=\"katex-inline\">t<\/span> 段（<span class=\"katex-inline\">2^{t-1}&lt;j\\le 2^t<\/span>）有 <span class=\"katex-inline\">2^{t-1}<\/span> 项，每项不小于 <span class=\"katex-inline\">1/2^t<\/span>，所以该段和 <span class=\"katex-inline\">\\ge 2^{t-1}/2^t=1/2<\/span>。共 <span class=\"katex-inline\">m<\/span> 段，加上首项 1，得 <span class=\"katex-inline\">H_{2^m}\\ge 1+m/2<\/span>。<\/p>\n<p>上界用积分比较：对递减函数 <span class=\"katex-inline\">1/x<\/span>，区间 <span class=\"katex-inline\">[k-1,k]<\/span> 上 <span class=\"katex-inline\">1/x\\le 1/(k-1)<\/span>（<span class=\"katex-inline\">k\\ge2<\/span>），于是<\/p>\n<div class=\"katex-block\">H_n=1+\\sum_{k=2}^{n}\\frac1k\\le 1+\\int_{1}^{n}\\frac{dx}{x}=1+\\ln n<\/div>\n<p>夹在 <span class=\"katex-inline\">1+m/2<\/span>（<span class=\"katex-inline\">n=2^m<\/span>）与 <span class=\"katex-inline\">1+\\ln n<\/span> 之间，<span class=\"katex-inline\">H_n<\/span> 的量级确定为 <span class=\"katex-inline\">\\ln n<\/span>。这组上下界证明了主项是对数增长，常数项 <span class=\"katex-inline\">\\gamma<\/span> 不在分组比较内出现；更精细的常数项由欧拉-麦克劳林方向给出：<span class=\"katex-inline\">H_n=\\ln n+\\gamma+1/(2n)+O(1/n^2)<\/span>。<\/p>\n<h2>推导二（推演）：把斐波那契递推转成生成函数<\/h2>\n<p>设 <span class=\"katex-inline\">F_0=0,\\ F_1=1,\\ F_{n+2}=F_{n+1}+F_n\\ (n\\ge0)<\/span>，生成函数 <span class=\"katex-inline\">G(z)=\\sum_{n\\ge0}F_n z^n<\/span>。<\/p>\n<p>先写三个移位形式：<\/p>\n<div class=\"katex-block\">G(z)=F_0+F_1z+\\sum_{n\\ge2}F_n z^n<\/div>\n<div class=\"katex-block\">zG(z)=\\sum_{n\\ge0}F_n z^{n+1}=\\sum_{n\\ge1}F_{n-1}z^n<\/div>\n<div class=\"katex-block\">z^2G(z)=\\sum_{n\\ge0}F_n z^{n+2}=\\sum_{n\\ge2}F_{n-2}z^n<\/div>\n<p>把递推 <span class=\"katex-inline\">F_n=F_{n-1}+F_{n-2}<\/span>（<span class=\"katex-inline\">n\\ge2<\/span>）逐项乘 <span class=\"katex-inline\">z^n<\/span> 求和：<\/p>\n<div class=\"katex-block\">\\sum_{n\\ge2}F_n z^n=\\sum_{n\\ge2}F_{n-1}z^n+\\sum_{n\\ge2}F_{n-2}z^n<\/div>\n<p>左侧 <span class=\"katex-inline\">=G(z)-F_0-F_1z=G(z)-z<\/span>；右侧第一项 <span class=\"katex-inline\">=zG(z)-F_0z=zG(z)<\/span>；第二项 <span class=\"katex-inline\">=z^2G(z)<\/span>。整理：<\/p>\n<div class=\"katex-block\">G(z)-z=zG(z)+z^2G(z)<\/div>\n<div class=\"katex-block\">G(z)(1-z-z^2)=z<\/div>\n<div class=\"katex-block\">G(z)=\\frac{z}{1-z-z^2}<\/div>\n<p>右端展开后 <span class=\"katex-inline\">z^n<\/span> 的系数即 <span class=\"katex-inline\">F_n<\/span>；系数等式可用归纳法逐项证明与递推一致。需要通项时再做部分分式或系数提取；母函数把&quot;递推对所有 <span class=\"katex-inline\">n<\/span> 成立&quot;压缩成一条代数等式。<\/p>\n<h2>反事实：改掉分析约定会怎样<\/h2>\n<ul><li>\n<strong>只看精确表达式不做渐进<\/strong>：算法比较停留在 <span class=\"katex-inline\">T(n)=\\sum_{k=1}^{n}(n-k)+\\cdots<\/span> 这类求和式上，规模一大就看不出量级差别；两个精确式难以直接排序，压成 <span class=\"katex-inline\">O(n^2)<\/span> 与 <span class=\"katex-inline\">O(n\\log n)<\/span> 后优劣才清楚。\n<\/li><li>\n<strong>大 O 写成双向等号<\/strong>：<span class=\"katex-inline\">1/2n^2+n=O(n^2)<\/span> 成立，但反过来 <span class=\"katex-inline\">n^2=O(1/2n^2+n)<\/span> 写不回去——大 O 表示上界包含，不是两边等价。把单向包含当成相等，会在估下界时把上界误当精确值。\n<\/li><li>\n<strong>生成函数不写收敛域就做形式运算<\/strong>：母函数作为形式幂级数运算时可以暂不担心收敛；但若要代入具体 <span class=\"katex-inline\">z<\/span> 求值或用微积分结论，收敛半径不先核验，等式可能在不收敛的点上被误用。\n<\/li><li>\n<strong>求和时漏边界项<\/strong>：计数从 <span class=\"katex-inline\">k=1<\/span> 还是 <span class=\"katex-inline\">k=0<\/span> 起算、末项到 <span class=\"katex-inline\">n<\/span> 还是 <span class=\"katex-inline\">n-1<\/span>，直接改变常数项；渐进主项可能不变，但精确式与低阶项会错。典型算法分析第一步必须把下标范围钉死。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章方法回收第 1 章归纳与递推、第 2 章结构操作计数、第 3 章发生器周期与频数统计：插入删除移动元素求和对应线性表分析，周期长度计数对应递推分析。大 O 记号是后续各卷比较算法、习题答案给量级的通用语言；生成函数在计数组合、递推求解与概率母函数中反复出现。读完本章，卷一的概念层、结构层与分析层就闭合为一条链：先定义算法，再表示数据，再估计代价。<\/p>", "kind": "chapter", "title": "第 4 章：算法分析基础（对应原书第 1 章 §1.2 与第 3 章 §3.5 的分析方法）"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.20<\/div><h1>算法定义的五条特征与有穷性的边界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章（原书 §1.1）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>日常说&quot;写个算法&quot;，指的往往是一段能跑的程序。但在讨论算法性质、证明正确性、比较复杂度之前，需要先把&quot;什么算一个算法&quot;钉成可核验的条件。如果不区分&quot;有限步骤内给出结果的指令序列&quot;和&quot;可能一直运行下去的过程&quot;，就无法谈终止性保证，也无法把算法与菜谱、反应式进程、数学计算方法划清界限。书里在第一个完整算法（欧几里得求 gcd）之后回过头概括算法的含义，正是为了让后续每一个算法样例都套在同一组条件上审视（PDF 第 20–21 页）。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p>Knuth 概括的算法五条特征如下。<\/p>\n<p><strong>(1) 有限性（有穷性）<\/strong>：算法必须在执行有限步之后终止。算法 E 中，每做一次 E1 求余数，若 <span class=\"katex-inline\">r\\ne0<\/span>，下一步 E3 把 <span class=\"katex-inline\">(m,n)<\/span> 替换成 <span class=\"katex-inline\">(n,r)<\/span>，余数严格递减；一个递减的正整数序列不能无限延续，所以 E1 只会被执行有限次。书里同时提醒：步数可以取到任意大，例如选适当大的 <span class=\"katex-inline\">m,n<\/span> 可能让 E1 执行超百万次，但只要存在有限上界，就满足有限性。<\/p>\n<p><strong>(2) 确定性<\/strong>：算法每一步要执行的操作必须给出严格无歧义的说明，每种情况下做什么都有明确解释。用自然语言写步骤存在被不同读者理解出偏差的风险，因此关键算法常同时配形式化定义的程序；用计算机语言表示的计算方法称为程序（PDF 第 21 页）。<\/p>\n<p><strong>(3) 输入<\/strong>：算法具有 0 个或多个输入，即算法开始前赋给它的初始量，或执行中动态赋给它的量；输入取自特定对象集合。算法 E 的两个输入 <span class=\"katex-inline\">m,n<\/span> 都取自正整数集。<\/p>\n<p><strong>(4) 输出<\/strong>：算法具有 1 个或多个输出，即与输入存在某种指定关系的量。算法 E 有一个输出：步骤 E2 中的 <span class=\"katex-inline\">n<\/span>，它是 <span class=\"katex-inline\">m,n<\/span> 的最大公约数。<\/p>\n<p><strong>(5) 可行性（有效性）<\/strong>：所有操作必须足够基本，原则上可以用笔和纸在有限时间内准确执行。E 的操作包括整数相除、检验整数是否为 0、置改变量值，这些都能用有限形式写在纸上并由有限除法完成。<\/p>\n<p><strong>只缺有限性的过程<\/strong>：书里称一个具备其余四条特征、但可能不终止的过程为计算方法。两条线段长度不可通约时求&quot;最大公度&quot;的过程不终止；与环境不断交互的反应式进程也是例子（PDF 第 20 页）。<\/p>\n<h2>原理推导：五条条件怎样落到一个样例上<\/h2>\n<p>以算法 E 为对照逐项核验。输入：两个正整数 <span class=\"katex-inline\">m,n<\/span>。输出：<span class=\"katex-inline\">\\gcd(m,n)<\/span>。可行性：余数、判零、赋值都是基本操作。确定性：除法 <span class=\"katex-inline\">m=qn+r<\/span> 中 <span class=\"katex-inline\">q,r<\/span> 由 <span class=\"katex-inline\">m,n<\/span> 唯一确定，分支&quot;<span class=\"katex-inline\">r=0<\/span>&quot;与&quot;<span class=\"katex-inline\">r\\ne0<\/span>&quot;覆盖全部情形。有限性：设第 <span class=\"katex-inline\">k<\/span> 步余数为 <span class=\"katex-inline\">r_k<\/span>，则 <span class=\"katex-inline\">n&gt;r_1&gt;r_2&gt;\\cdots\\ge0<\/span>，严格递减的非负整数序列长度有限，必然在某一步取到 0。<\/p>\n<p>反过来看终止性证明的结构：有限性不是靠&quot;直觉上很快就完&quot;，而是靠一个单调递减量——余数每步下降，整数良序保证不能无限下降。若某算法找不到这样一个单调量，就不能仅凭步骤描述声称满足有限性。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：讨论对象是离散、可分步描述的指令序列；输入集合与操作语义明确。\n<\/li><li>\n失败案例 1：菜谱式步骤&quot;加少许盐&quot;&quot;轻轻搅拌直到均匀混合&quot;。它有输入（鸡蛋面粉）与输出（菜），但&quot;少许&quot;&quot;均匀混合&quot;缺乏无歧义解释，确定性不满足；书里用这个对照说明算法描述必须达到连计算机也能照做的程度。\n<\/li><li>\n失败案例 2：&quot;若 4 是使方程 <span class=\"katex-inline\">w^n+x^n+y^n=z^n<\/span> 存在正整数解的最大整数，转到步骤 E4。&quot;这类操作依赖尚未构造出的判定结果，不可行（PDF 第 21 页）。\n<\/li><li>\n边界：有限性只要求步数有限，不限制步数上界有多大；<span class=\"katex-inline\">O(\\log n)<\/span> 与 <span class=\"katex-inline\">O(n!)<\/span> 的算法都满足有限性。有限性也不保证算法最优或正确，只保证它会停下来。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>算法 vs 程序<\/strong>：程序是用计算机语言表示的计算方法；一个程序可以是不终止的后台服务，因此程序未必满足算法的有限性条件。算法强调性质集合，程序强调表示形式。\n<\/li><li>\n<strong>有限性 vs 可行性<\/strong>：有限性管&quot;会不会停&quot;，可行性管&quot;每一步能不能纸笔完成&quot;。一个每步都可行、却证明不出终止上界的过程，卡在有限性这条上；反之步骤无法在有限形式内完成的操作，卡在可行性这条上。\n<\/li><li>\n<strong>算法 vs 计算方法<\/strong>：计算方法覆盖范围更宽，只要求确定、可执行；算法额外加上有限终止。反应式服务、操作系统内核按本书分类属于计算方法，不是算法。\n<\/li><li>\n<strong>确定性 vs 输出正确<\/strong>：确定性要求步骤无歧义，不要求结果对；确定性满足但逻辑错误的算法仍然存在，正确性要另靠证明（见 c03、c04）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无（本单元起点概念）。后继：c02 讨论算法在虚构机器 MIX 上怎样计步；c03 的归纳法用于证明算法对所有输入成立；c04 用 gcd 不变量与余数递减量同时完成正确性与有限性论证。五条特征也是第 3 章判断发生器是否可接受的底层参照——发生器递推每步确定可行，但周期与终止性要单独分析。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（算法定义的五条特征与有穷性的边界）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：算法五条特征的依赖链、逐条核验与边界算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把一个操作序列认定为算法，先往回追四层前提：<\/p>\n<ol><li>\n最底层是操作语义：每一步动作必须能写成明确符号，对象取自确定集合。没有明确语义，后面谈终止性、确定性都没有附着点。\n<\/li><li>\n再往上是输入与输出边界：算法开始前有初始量，结束时给出与输入有指定关系的结果。输入集合不清，可行性无法核验；输出关系不定，正确性无从判断。\n<\/li><li>\n然后是执行可控性：每步操作足够基本，纸笔可完成；步骤之间无歧义，同一输入走到同一分支。\n<\/li><li>\n最上层是终止性：存在一个有限上界，保证过程在有限步内结束。有限性是算法与一般计算方法的分界。\n<\/ol>\n<p>依赖链方向：明确操作语义 → 划定输入输出 → 核验每步可行且确定 → 证明有限终止。任何一层缺失，对象都不能按算法对待。<\/p>\n<h2>正向推导：五条特征在样例算法上逐条落地<\/h2>\n<p>以算法 E（求 gcd）为样例，按顺序核验。<\/p>\n<p><strong>第一步，输入核验<\/strong>。算法 E 接收两个正整数 <span class=\"katex-inline\">m,n<\/span>。输入集合限定为正整数集；若输入是 <span class=\"katex-inline\">-\\pi<\/span>、<span class=\"katex-inline\">-8<\/span> 或 0，余数含义在书里指出并无一般共识，确定性条件无法满足。所以算法前置假设里写明 <span class=\"katex-inline\">m,n<\/span> 为正整数。<\/p>\n<p><strong>第二步，可行性核验<\/strong>。E1 做整数除法 <span class=\"katex-inline\">m=qn+r<\/span>；E2 检验 <span class=\"katex-inline\">r<\/span> 是否为 0；E3 执行两个赋值。这些动作都能在有限形式内写在纸上：除法有有限长除法算法，判零是符号比较，赋值是记录替换。不存在&quot;构造出满足某性质的最大整数&quot;这类需要未完成判定的操作。<\/p>\n<p><strong>第三步，确定性核验<\/strong>。除法给出唯一商 <span class=\"katex-inline\">q<\/span> 与余数 <span class=\"katex-inline\">r<\/span>；分支只有两条：<span class=\"katex-inline\">r=0<\/span> 与 <span class=\"katex-inline\">r\\ne0<\/span>，覆盖全部情形。自然语言步骤旁配机器语言程序，是为了消除读者理解偏差；程序语句本身不存在第二种读法。<\/p>\n<p><strong>第四步，输出核验<\/strong>。E2 终止时返回的 <span class=\"katex-inline\">n<\/span> 是 <span class=\"katex-inline\">m,n<\/span> 的最大公约数。输出与输入的指定关系是&quot;同时整除二者的最大正整数&quot;，正确性证明另由 gcd 不变量承担（见 c04）。<\/p>\n<p><strong>第五步，有限性核验<\/strong>。设第 <span class=\"katex-inline\">k<\/span> 轮余数为 <span class=\"katex-inline\">r_k<\/span>，E1 要求 <span class=\"katex-inline\">0\\le r_k&lt;n<\/span>，E3 后新 <span class=\"katex-inline\">n<\/span> 等于上一轮 <span class=\"katex-inline\">r_k<\/span>，所以 <span class=\"katex-inline\">r_{k+1}&lt;r_k<\/span>。<span class=\"katex-inline\">r_k<\/span> 是非负整数且严格递减；非负整数不能无限递减，序列必在某步取到 0，E2 终止。这一步找的是单调递减量，而不是凭感觉判断&quot;很快会完&quot;。<\/p>\n<h2>数值算例：两个边界过程对照<\/h2>\n<p><strong>算例 1：满足四条、缺有限性的计算方法<\/strong>。设想过程：从 2 开始逐个检查整数是否为素数，发现素数就记录下来，永不停止。输入为空或给定下界；每步判素数可行；分支确定；输出是一列素数。唯独有限性不满足：素数无穷多，过程不会终止。按本书分类，它是计算方法，不是算法。反应式进程与环境持续交互，属于同类。<\/p>\n<p><strong>算例 2：有限但不可行的步骤<\/strong>。书里给出的反例：&quot;如果 4 是使 <span class=\"katex-inline\">w^n+x^n+y^n=z^n<\/span> 存在正整数解的最大整数，转到步骤 E4。&quot;这一步要求先判定一个尚未构造出的最大整数是否存在；在判定结果可构造之前，操作无法纸笔完成。它即使形式上有输入输出，也卡在可行性条件上。<\/p>\n<p><strong>算例 3：确定性不足的菜谱<\/strong>。&quot;加少许盐&quot;&quot;轻轻搅拌直到均匀混合&quot;。&quot;少许&quot;没有量词边界，&quot;均匀混合&quot;没有可核验判据；不同执行者会得到不同动作。菜谱有输入有输出，确定性不满足。对照说明：算法描述必须达到连计算机也能照做的程度。<\/p>\n<h2>延伸推演：有限性与复杂度上界的关系<\/h2>\n<p>有限性只要求存在有限上界，不对上界大小做限制。<span class=\"katex-inline\">O(\\log n)<\/span> 的算法、<span class=\"katex-inline\">O(n^2)<\/span> 的算法、<span class=\"katex-inline\">O(n!)<\/span> 的算法都满足有限性；步数随输入爆炸只影响实用价值，不改变算法身份。讨论复杂度时说的最坏上界，是对这个&quot;有限&quot;定量刻画：上界越紧，分析越有价值。<\/p>\n<p>进一步，终止性证明在算法分析里承担两类角色。一类像余数递减：找到一个严格下降的整数/半整数度量，由良序原理推出有限。另一类像状态有限：状态集合有限且每步转入确定状态，重复即循环，从而必然终止或进入可识别循环。两类证明都需要把&quot;什么在下降、什么在循环&quot;写出来。<\/p>\n<h2>对抗性追问：有限性能不能靠运行很久没停来反证<\/h2>\n<p>不能。运行 <span class=\"katex-inline\">10^6<\/span> 步仍在执行，既不能证明算法满足有限性，也不能证明不满足；有限性是命题级别的结论，要靠结构论证。反过来，证明出单调递减量或状态有限，才是有限性的依据。测试覆盖的是已执行路径，未执行路径上的循环要靠证明排除。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n算法五条特征分别是什么？哪一条是算法与计算方法的分界？\n<\/li><li>\n确定性与正确性各约束什么？确定性满足的算法是否一定结果正确？\n<\/li><li>\n可行性与有限性回答的问题有何差别？各举一个卡在该条件上的例子。\n<\/li><li>\n证明 E 终止时找的单调量是什么？为什么严格递减的非负整数序列不能无限延续？\n<\/li><li>\n有限性是否限制步数上界的大小？<span class=\"katex-inline\">O(n!)<\/span> 的过程算不算算法？\n<\/ol>\n<h2>延伸推演：五类对象按五特征归类<\/h2>\n<p>把常见计算对象放到五条特征上逐项对照，可以看清分类边界。<\/p>\n<p><strong>批处理程序<\/strong>：输入文件、输出文件，步骤确定可行，正常路径有限终止，五条齐备，对应算法的程序实现。<strong>后台服务进程<\/strong>：输入来自持续到达的请求，输出为响应；每步确定可行，但设计上不终止，缺有限性，归计算方法。<strong>数学证明过程<\/strong>：从公理出发的有限推演，有前提有结论，每步可行确定；若证明策略要求遍历无穷对象才能判定，则不满足可行性。<strong>硬件组合逻辑<\/strong>：输入到输出的映射即时完成，没有步骤序列，不构成&quot;操作序列&quot;意义上的算法；它是电路实现，不是算法描述。<strong>查表过程<\/strong>：有限条目查表，输入索引、输出表项，动作是定位与复制，五条齐备，是最简单的一类算法。<\/p>\n<p>归类时容易混淆的是&quot;程序&quot;与&quot;算法&quot;。程序是表示载体：同一算法可以写成不同语言的程序；同一程序也可能不终止。算法是性质集合，程序是文本形式，两者不在同一层。<\/p>\n<h2>第二算例：识别不可行步骤<\/h2>\n<p>给定一段描述：&quot;检验是否存在整数解 <span class=\"katex-inline\">w,x,y,z<\/span> 满足 <span class=\"katex-inline\">w^n+x^n+y^n=z^n<\/span>，若存在则转到 E4。&quot;分步拆：<\/p>\n<ol><li>\n输入：方程与指数 <span class=\"katex-inline\">n<\/span>；\n<\/li><li>\n待执行动作：判定该丢番图方程是否有正整数解；\n<\/li><li>\n可行性检查：判定结果需要在有限步内构造出来；在没有给出判定算法之前，这一步依赖一个未完成的存在性构造，不能纸笔准确执行；\n<\/li><li>\n结论：该步骤卡在可行性条件，整段描述不能按算法对待。\n<\/ol>\n<p>对照书里另一类反例：反应式进程每步可行确定，但不终止，卡在有限性。两类反例位置不同：一个卡在操作可执行性，一个卡在终止保证。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;能跑出结果就是算法&quot;。<\/strong> 跑出结果只说明本次运行成功；算法身份要求对输入集合内所有输入都有终止保证。单次成功不覆盖未测输入。\n<\/li><li>\n<strong>误解二：&quot;步骤越简单越可行&quot;。<\/strong> 可行性看操作能否有限形式完成，不看步骤数量；复杂但可分解为基本动作的操作可行，依赖未构造判定的操作再简单也不可行。\n<\/li><li>\n<strong>误解三：&quot;自然语言写的步骤不算确定&quot;。<\/strong> 自然语言可以达到确定性，前提是每个分支、每个对象集合都无歧义；书里用自然语言加机器语言双写，是为了消除理解偏差，不是否定自然语言本身。\n<\/li><li>\n<strong>误解四：&quot;没有输入就不是算法&quot;。<\/strong> 特征允许 0 个输入；无输入算法每次运行由内部状态决定输出，例如固定常数表的生成过程。\n<\/ul>\n<h2>推演补充：确定性分支的覆盖核验<\/h2>\n<p>确定性要求每种情况执行操作有明确说明。核验一个算法的分支是否覆盖全部情形，做法是把输入对象集合按条件切分：主分支 <span class=\"katex-inline\">r=0<\/span> 对应余数为零的情形，补充分支 <span class=\"katex-inline\">r\\ne0<\/span> 对应其余情形；两支的并集是全部非负余数，交集为空。若描述中出现&quot;视情况而定&quot;&quot;必要时调整&quot;这类未定义分支，确定性缺口就在这里。<\/p>\n<p>输入集合的限定同样服务确定性。算法 E 假设 <span class=\"katex-inline\">m,n<\/span> 为正整数；若放开到负整数，<span class=\"katex-inline\">-8<\/span> 除以 <span class=\"katex-inline\">-\\pi<\/span> 的余数在不同数论约定下结果不同，书里明确指出此时余数含义没有一般共识。确定的对象集合是确定性可核验的前提：集合边界不清，分支判断就失去依据。<\/p>\n<h2>推演补充：输出与输入的指定关系<\/h2>\n<p>输出不是任意结果，必须与输入保持指定关系。算法 E 的输出 <span class=\"katex-inline\">n<\/span> 满足两条：整除 <span class=\"katex-inline\">m<\/span> 与 <span class=\"katex-inline\">n<\/span>，且大于任何其他公共约数。关系写不出，正确性就没有核验标准；反过来，只说&quot;给出相关结果&quot;而不写关系，输出合格与否无法判断。可行性条款还要求构造输出的每一步基本可执行，不能依赖无穷小数展开或未完成的存在性判定。<\/p>\n<h2>边界对照：算法概念在后续章节的落点<\/h2>\n<p>第 3 章发生器递推每步确定可行，状态有限必然回到旧状态，终止性表现为周期闭环；第 2 章表与树的遍历算法，输入是结构、输出是访问序列，可行性落在结点访问与链字段更新上。回看本章五特征，可以把后面每个新算法都拆成：输入集合、输出关系、基本操作清单、分支说明、终止度量五项分别登记，这也是读习题时自检算法描述完整度的固定清单。<\/p>\n<h2>推演补充：有限性证明的两类度量<\/h2>\n<p>终止性证明在全书反复出现，归纳起来有两类度量。第一类是单调递减量：余数、规模、剩余步数严格下降，由良序原理推出有限。第二类是状态有限：状态集合大小有界，每步转入确定状态，重复即闭环，过程必然终止或进入可识别循环。<\/p>\n<p>两类度量对应不同算法场景：欧几里得算法用余数递减；发生器用状态有限闭环；递归遍历用子树规模递减；调度类算法常合并两类——既看剩余任务量，也看状态是否重复。读一个新算法时，先找&quot;什么在下降&quot;或&quot;什么在重复&quot;，终止性论证就有了抓手。<\/p>\n<h2>推演补充：算法描述的记号约定<\/h2>\n<p>书里算法步骤以标识字母加数字编号，如 E1、E2；每步以方括号短语概括动作，后接文字注释说明变量不变量或当前目标。赋值箭头 <span class=\"katex-inline\">m\\leftarrow n<\/span> 表示用 <span class=\"katex-inline\">n<\/span> 的当前值替换 <span class=\"katex-inline\">m<\/span>；等号 <span class=\"katex-inline\">=<\/span> 表示可检验条件，箭头与等号不混用。多变量同值可连写 <span class=\"katex-inline\">n\\leftarrow r\\leftarrow s<\/span>；交换两值可写 <span class=\"katex-inline\">m\\leftrightarrow n<\/span>，或借临时变量 <span class=\"katex-inline\">t<\/span> 完成。<\/p>\n<p>这套记号是全书算法样例的通用格式：步骤编号便于交叉引用，概括短语对应流程图框，注释承担不变量说明。后续读 §1.3 机器语言程序、§1.4 子程序与协同程序时，这套步骤格式保持不变。<\/p>\n<h2>第三算例：五条特征逐项登记样例<\/h2>\n<p>以&quot;求数组最大值&quot;算法（书里 §1.2.10 算法 M 方向，PDF 第 93 页）做登记：<\/p>\n<ol><li>\n输入：<span class=\"katex-inline\">n<\/span> 个元素 <span class=\"katex-inline\">X[1],\\dots,X[n]<\/span>；\n<\/li><li>\n输出：最大值及其下标；\n<\/li><li>\n可行性：比较两元素、更新记录、递减计数器均为基本操作；\n<\/li><li>\n确定性：<span class=\"katex-inline\">X[k]\\le m<\/span> 与 <span class=\"katex-inline\">X[k]&gt;m<\/span> 两支覆盖全部比较结果；\n<\/li><li>\n有限性：计数器 <span class=\"katex-inline\">k<\/span> 从 <span class=\"katex-inline\">n-1<\/span> 递减到 0，严格递减有限步。\n<\/ol>\n<p>五项登记齐全，才符合本书对一个算法样例的描述要求；缺终止度量的过程，在书里归入计算方法而非算法。<\/p><\/div><\/details>", "kind": "concept", "title": "算法定义的五条特征与有穷性的边界"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.116<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">算法定义的五条特征与有穷性的边界<\/a><\/span><\/div><h1>MIX 与现代机器：为什么用假机器计步<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章（原书 §1.3.1）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>分析一个算法在机器上跑多久，最直接的想法是对着某款真机数指令。但真机每隔几年换代，指令集带大量与算法主题无关的硬件特性；今天选机器 X，没有机器 X 的读者会认为书只写给 X 用户，而机器 X 过两年推出 X+1、X+10，书中描述又可能过时。书里需要一台规则简单、跨年代稳定、又能代表一类通用计算机的抽象机器，用来描述算法、做指令级计步。MIX 就是为这个位置设计的（PDF 第 116 页）。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>MIX 定位<\/strong>：书里反复使用的一台虚拟计算机，酷似 20 世纪 60、70 年代的每一种计算机；机器语言设计功能足以给大多数算法写简短程序，指令集本身简单易学。MIX 被称为一台&quot;多不饱和计算机&quot;（可从多方面扩展），它有一个标识符 1009，这个号码是 16 台与 MIX 非常相似的真实计算机标识符的算术平均值（PDF 第 116 页）。<\/p>\n<p><strong>数据单位<\/strong>：MIX 数据的基本单位是字节（byte）。每个字节包含数量不确定的信息，但至少能保存 64 个不同值，也至多包含 100 个不同值；因此二进制视角下一个字节必然是 6 位，十进制视角下一个字节必然是两位数字。<\/p>\n<p><strong>双基数视角<\/strong>：MIX 同时采用二进制和十进制，程序员实际并不知道自己在为以 2 还是以 10 为基数的机器编四则运算；无论在哪种计算机上，用 MIX 写的算法稍作修改即可使用，模拟 MIX 也很容易。习惯二进制机器的程序员可以把 MIX 看成二进制制，习惯十进制的看成十进制制。<\/p>\n<p><strong>后继机器 MMIX<\/strong>：书里注明 MIX 如今已完全过时，后续版本改用一台新计算机 MMIX，用 2009 的罗马数字表示；MMIX 是 64 位 RISC，比 MIX 更精致，会与 20 世纪 90 年代主流计算机相似（PDF 第 116 页）。本卷样例仍以 MIX 为准。<\/p>\n<h2>原理推导与推演：假机器在分析链条里承担什么角色<\/h2>\n<p>第一步，算法先写成与机器无关的步骤序列（如算法 E 的 E1–E3）。第二步，要估执行代价时，需要一个统一的代价单位：一次数据传送、一次加法、一次比较各计多少步。MIX 提供这套稳定的指令词汇：寄存器、字节字、跳转、算术运算都有固定表示。第三步，在 MIX 程序上统计各类指令出现次数，再乘以对应代价，得到算法的执行步数估计。<\/p>\n<p>用抽象机器计步的好处是，同一套步数估计不被某款芯片的缓存延迟、流水线宽度干扰；读者哪怕手头没有 MIX 硬件，也能按规则手算模拟。书里提到，许多志愿者已为 MIX 编写模拟程序，模拟程序适合教学目的，因为它们比实际机器更容易使用。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：讨论对象是通用算法的指令级行为；需要跨硬件比较步数，而不是测某一机型上的实际时钟。\n<\/li><li>\n失败案例：直接拿真机跑分做算法结论。真机成绩受编译器优化、内存层级、主频、数据预热影响，换一批输入或换一代芯片，排名可能翻转；用真机读数代替抽象计步，结论绑死在具体环境。\n<\/li><li>\n边界：MIX 计步得到的是指令次数量级，不是墙钟时间；它不刻画现代机器的分支预测、SIMD、并发等特征。MMIX 作为后继，定位同样是教学与分析用抽象机，不是某款在售 CPU 的文档。\n<\/li><li>\n误用提醒：把 MIX 指令格式当成当代汇编规范去读现代机器代码，会对位宽、字节定义产生错位预期；两者只在&quot;取指—执行—写回&quot;的通用模型上对应。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>MIX vs 真机<\/strong>：真机服务运行程序，MIX 服务描述与分析算法；真机必须接外设、管中断，MIX 只保留最精简的运算与存储模型。\n<\/li><li>\n<strong>MIX vs 高级语言<\/strong>：高级语言隐藏寄存器与字节操作，便于表达数据结构；MIX 贴近机器，便于看清一条算法操作落到哪些基本动作上。书里两种写法都给：自然语言步骤配机器语言程序。\n<\/li><li>\n<strong>标识符 1009 的含义<\/strong>：1009 不是指令条数，也不是内存容量，而是 16 台相似真机编号取整后的平均值；它是 MIX 谱系位置的记号，不要读成主频或字长。\n<\/li><li>\n<strong>字节定义的时代差异<\/strong>：MIX 字节至少 64 个值、至多 100 个值；1975 年以后字节演变为固定 8 位、可表示 0 到 255。读 MIX 样例时要按书里的传统意义理解字节，不能用现代 8 位定义倒推。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的算法五条特征——MIX 上的程序正是确定性、可行性落到指令级的载体。后继：c08 的顺序/链接分配在 MIX 内存模型里表示；c07 的遍历栈用到 MIX 式栈与寄存器概念。抽象机器计步的思路贯穿全书习题答案与算法分析，第 4 章把指令计数汇总成求和与渐进估计。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（MIX 与现代机器：为什么用假机器计步）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：MIX 作为分析基准机器的依赖链、计步推演与边界<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>为什么书里需要一台虚构机器，先往回追三层：<\/p>\n<ol><li>\n算法分析要把&quot;跑多久&quot;变成可比较的数字。数字必须有统一单位：一次传送、一次加法、一次比较各计多少。没有统一单位，不同算法的代价无法排序。\n<\/li><li>\n统一单位不能绑死在某款真机上。真机换代快，指令集带外设、中断、缓存等与算法主题无关的特性；选真机 X，读者群被限定为 X 用户，两年后 X 又被 X+1 取代。\n<\/li><li>\n因此需要一台规则极简、跨年代稳定、又能代表通用计算机模型的抽象机器。它保留取指、执行、写回的通用结构，剥除硬件细节；MIX 承担这个位置，后继为 MMIX。\n<\/ol>\n<p>依赖链方向：需要可比较的代价单位 → 单位不能随真机换代失效 → 抽象机器提供稳定指令词汇 → 在抽象机上统计指令次数 → 汇总成算法步数估计。<\/p>\n<h2>正向推导（逐步推演）：从算法步骤到 MIX 计步的完整链条<\/h2>\n<p><strong>第一步，写与机器无关的算法骨架<\/strong>。先把操作写成 E1–E3 这类步骤序列，明确输入、输出、分支与循环。这一层不出现任何机器指令。<\/p>\n<p><strong>第二步，确定代价词汇<\/strong>。MIX 模型里数据单位是字节：一个字节至少保存 64 个不同值，至多包含 100 个不同值；二进制视角下字节为 6 位，十进制视角下为两位数字。寄存器保存字，链字段保存结点位置，跳转对应分支。<\/p>\n<p><strong>第三步，把骨架翻成 MIX 程序<\/strong>。每条高级操作对应若干基本指令：数据传送、算术运算、比较、条件跳转。书里同时给自然语言步骤与机器语言程序，前者讲清意图，后者供计步。<\/p>\n<p><strong>第四步，统计指令次数<\/strong>。按输入规模 <span class=\"katex-inline\">n<\/span> 分类计数：循环体执行几次，比较做几次，更新发生几次。把各类指令次数乘对应代价，加总成该输入下的步数。<\/p>\n<p><strong>第五步，汇总成量级<\/strong>。对所有输入或随机输入求和，再用第 4 章的求和与大 O 记号压成渐进表达式。MIX 在这一步只提供计数基准，不提供墙钟时间。<\/p>\n<h2>数值算例：标识符 1009 与字节位宽对照<\/h2>\n<p><strong>算例 1：1009 是什么<\/strong>。MIX 标识符 1009 是 16 台与 MIX 相似的真实计算机标识符的算术平均值，取整得到。算式方向为：把 16 个真机编号相加后除以 16，向下取整。它不是指令条数，不是内存容量，也不是主频；它标记 MIX 在计算机谱系中的位置。<\/p>\n<p><strong>算例 2：双基数视角下的字节<\/strong>。若按二进制解释，6 位可表示 <span class=\"katex-inline\">2^6=64<\/span> 个值，落在&quot;至少 64&quot;的下界；若按十进制解释，两位数字可表示 <span class=\"katex-inline\">10^2=100<\/span> 个值，落在&quot;至多 100&quot;的上界。MIX 程序员不必知道当前为哪种基数：同一套 MIX 程序在二进制机与十进制机上稍作修改即可运行，模拟程序也容易实现。<\/p>\n<p><strong>算例 3：MIX 与 MMIX 的代际差<\/strong>。MIX 是 20 世纪 60、70 年代风格的精简指令计算机；MMIX 用 2009 的罗马数字命名，是 64 位 RISC，定位与 20 世纪 90 年代主流计算机相似。本卷习题与样例仍按 MIX 描述；读后续材料遇到 MMIX 时，两者角色相同，都是教学与分析用抽象机。<\/p>\n<h2>延伸推演：抽象机计步与现代真机性能的距离<\/h2>\n<p>MIX 计步得到的是指令次数量级。现代程序的实际墙钟时间还受缓存命中、分支预测、流水线停顿、SIMD 宽度、内存带宽影响；这些因素在 MIX 模型里没有对应字段。因此 MIX 步数适合比较算法渐近量级，不适合预测某款芯片上的毫秒数。<\/p>\n<p>反过来，抽象机也不能替代真实测量。渐近比较在大 <span class=\"katex-inline\">n<\/span> 上可靠；小规模输入下常数因子、数据布局、语言运行时可能逆转排名。完整分析路径是：抽象机计步给量级，原型测量给常数与工程现实，两者对照使用。<\/p>\n<h2>对抗性追问：为什么不直接用高级语言做计步基准<\/h2>\n<p>高级语言隐藏寄存器与字节操作，表达数据结构方便，但语句到基本动作的映射不固定：同一行赋值在不同编译器下生成的指令数不同。若以高级语句为单位计数，代价随编译策略漂移，基准不稳定。MIX 贴近机器一侧，正是为了让计数对象落在固定、可复核的基本动作上。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nMIX 的标识符 1009 是怎么来的？它不是哪三类指标？\n<\/li><li>\nMIX 字节在二进制与十进制视角下各对应几位？取值范围上下界是多少？\n<\/li><li>\n用抽象机器计步得到的是什么量？为什么不能直接换算成墙钟时间？\n<\/li><li>\n从算法骨架到步数估计分哪五步？MIX 在哪一步进入链条？\n<\/li><li>\nMMIX 与 MIX 的关系是什么？两者共同承担什么角色？\n<\/ol>\n<h2>延伸推演：抽象机指令模型与现代 RISC 的对应<\/h2>\n<p>MIX 保留的通用模型有四层：取指（按地址读指令）、译码（解释操作码与字段）、执行（算术/逻辑/传送）、写回（结果写入寄存器或存储）。现代 RISC 同样遵循这四层，差别在具体字段宽度、寻址方式与流水线组织。拿 MIX 程序与现代汇编对照时，可对应的是操作类别：数据传送对应 load/store，算术对应 add/mul，条件分支对应跳转，地址计算对应偏移寻址。<\/p>\n<p>不可对应的部分要单列：现代机器的缓存层级、分支预测、乱序执行、向量扩展在 MIX 模型里没有字段；MIX 也不刻画特权级、中断向量与外设接口。读 MIX 样例时把它当成&quot;通用计算机的最小公约数&quot;，而不是某一代真实芯片的手册。<\/p>\n<h2>第二算例：字节与字长推算<\/h2>\n<p>MIX 字节至少存 64 个值、至多存 100 个值。按二进制：<span class=\"katex-inline\">2^6=64<\/span>，<span class=\"katex-inline\">2^7=128&gt;100<\/span>，所以二进制视角字节为 6 位；按十进制：两位数字覆盖 <span class=\"katex-inline\">00<\/span> 到 <span class=\"katex-inline\">99<\/span> 共 100 个值。一个 MIX 字由若干字节组成，字内各字节可拆可合；指令格式里地址字段、符号位、字段说明都在这个字宽内安排。<\/p>\n<p>对照现代定义：1975 年以后字节固定为 8 位，可表示 0 到 255；读 MIX 时不能用 8 位反推其字节取值范围，否则会把 6 位/两位数字的样例计算改错。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;假机器计步不如真机跑分客观&quot;。<\/strong> 抽象机计数剔除了硬件波动，比较的是算法内在代价；真机测量包含编译与环境因素，两者用途不同。\n<\/li><li>\n<strong>误解二：&quot;学会 MIX 指令就掌握了当代汇编&quot;。<\/strong> MIX 训练的是寄存器、栈、寻址的通用概念；当代指令集的具体编码、特权指令、内存模型仍需另学。\n<\/li><li>\n<strong>误解三：&quot;1009 是 MIX 的内存大小&quot;。<\/strong> 1009 是 16 台相似真机编号的均值取整，属谱系记号；内存容量、指令条数、字长都另有定义。\n<\/li><li>\n<strong>误解四：&quot;MIX 只能模拟不能实际运行&quot;。<\/strong> 书里注明许多志愿者为 MIX 写了模拟程序，模拟程序适合教学，执行甚至比实际机器更容易使用。\n<\/ul>\n<h2>推演补充：计步单位与代价归类<\/h2>\n<p>在 MIX 模型上统计指令时，先把指令分入几类代价桶：数据传送类（取数、存数、置字）、算术类（加减乘除）、比较与分支类、地址计算类。每类给一个单位代价，循环体按执行次数乘开，再累加所有桶。书里分析典型算法时，计数对象通常是比较次数、更新次数、循环轮次，而不是笼统的&quot;运行时间&quot;。<\/p>\n<p>代价归类要注意边界：一次加法包含取操作数与写回，若模型按完整指令计步，取数与写回已含在指令内；若拆成微操作计步，需另行登记。选择哪一层计步，前后章节要保持一致，否则同类指令在不同算法间不可比。<\/p>\n<h2>推演补充：为什么抽象机仍要保留机器视角<\/h2>\n<p>书里解释选面向机器语言的理由有几点：程序员受编程语言影响深，理解面向机器的语言后更倾向设计效率更高的方法；所用程序通常短小，有台合适计算机就能理解；高级语言不适合讨论协同程序、随机数生成、多精度算术与内存有效使用的底层细节；学机器语言是计算机基础；无论如何都需要某种机器语言作为示例程序的输出载体。<\/p>\n<p>对应到学习路径：先读与机器无关的算法骨架，再落到 MIX 指令看基本动作，最后在抽象机上计数。跳过中间直接读当代真机，容易被特定硬件细节牵走；只停在骨架层，又看不到一条算法操作拆成哪些基本动作。<\/p>\n<h2>边界对照：抽象机在全书分析中的位置<\/h2>\n<p>§1.3 之后的习题与样例反复引用 MIX：子程序调用在 MIX 栈上保存返回地址，协同程序交换执行权，解释程序按指令表分发。c08 的结点链字段、c07 的遍历栈，都可以翻译成 MIX 内存字与寄存器操作。抽象机是连接算法描述与内存结构的中间层，第 4 章求和得到的操作次数，最终也要落到这一层的指令计数上。<\/p>\n<h2>推演补充：MIX 程序结构的固定部件<\/h2>\n<p>一段 MIX 程序通常包含几类固定部件：指令序列本身、常量与字面值、工作单元（临时保存的寄存器值）、入口与出口衔接。子程序调用时把返回地址压栈，保存现场寄存器；返回时恢复现场并跳转回调用点。协同程序的特点是互相交换执行权，不像子程序那样单向返回。<\/p>\n<p>解释程序读取指令表，按操作码分发到对应处理 routine；追踪程序在执行间隙记录现场，用于调试与步数统计。这些结构在 §1.4 基本程序设计技术中展开，机器模型统一以 MIX 为准。理解这些部件，关键是看清每个寄存器与内存字保存什么状态，而不是死记指令编码。<\/p>\n<h2>推演补充：虚构机器设计的取舍标准<\/h2>\n<p>书里选虚构机器而非特定真机，背后的取舍标准有几条：规则简单到一小时内能掌握；与历史上多种计算机相似，学完容易迁移；指令集足以表达算法协同、随机数、多精度算术等底层细节；程序短小，便于纸笔模拟。<\/p>\n<p>反过来，虚构机器不追求什么：不刻画现代缓存层次与并行机制；不提供外设与特权指令；不反映某一代芯片的具体时序。MIX 定位是教学与分析基准，不是工业实现手册。后继 MMIX 同样遵循这一定位，只把字宽与指令风格更新到 64 位 RISC 时代。<\/p>\n<h2>第三算例：MIX 与现代概念的对照映射<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>MIX 概念<\/th><th>现代对应<\/th><th>不可直接对应部分<\/th><\/tr><\/thead><tbody><tr><td>寄存器<\/td><td>通用寄存器<\/td><td>寄存器数量、位数定义不同<\/td><\/tr><tr><td>字节/字<\/td><td>内存字节/机器字<\/td><td>字节位宽定义随时代变化<\/td><\/tr><tr><td>条件跳转<\/td><td>条件分支指令<\/td><td>标志位设置方式不同<\/td><\/tr><tr><td>栈与返回地址<\/td><td>调用栈帧<\/td><td>栈帧布局与特权处理不同<\/td><\/tr><tr><td>链字段<\/td><td>指针/索引<\/td><td>指针长度与寻址方式不同<\/td><\/tr><\/tbody><\/table><\/div>\n<p>读对照表时先抓通用模型，再把不可对应部分单列；用 MIX 样例理解&quot;算法怎样落到基本动作&quot;，不要把它当成当代汇编规范去套真实芯片代码。<\/p><\/div><\/details>", "kind": "concept", "title": "MIX 与现代机器：为什么用假机器计步"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.25<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">算法定义的五条特征与有穷性的边界<\/a><\/span><\/div><h1>数学归纳法：三种形式与常见误用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章（原书 §1.2.1）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>命题 <span class=\"katex-inline\">P(n)<\/span> 对所有正整数 <span class=\"katex-inline\">n<\/span> 成立时，逐个 <span class=\"katex-inline\">n<\/span> 验证不可行——整数没有尽头。归纳法给出一条可复核的推理通道：只要最小情形成立，并且每一步能由前面情形推出下一个情形，链条就覆盖全部正整数。书里在 §1.2.1 把归纳法作为数学准备的第一项工具（PDF 第 25 页），因为后续证明算法正确性、递推数列性质、树结点计数都要反复用到它。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p>设 <span class=\"katex-inline\">P(n)<\/span> 是关于整数 <span class=\"katex-inline\">n<\/span> 的某个命题，例如&quot;<span class=\"katex-inline\">n(n+3)<\/span> 是偶数&quot;或&quot;<span class=\"katex-inline\">n\\ge10<\/span> 时 <span class=\"katex-inline\">2^n&gt;n^3<\/span>&quot;。标准归纳法分两步（PDF 第 25 页）：<\/p>\n<p><strong>(a) 基础步<\/strong>：证明 <span class=\"katex-inline\">P(1)<\/span> 为真。即核验最小的那个正整数情形。<\/p>\n<p><strong>(b) 归纳步<\/strong>：证明&quot;如果 <span class=\"katex-inline\">P(1),P(2),\\dots,P(n)<\/span> 全部为真，那么 <span class=\"katex-inline\">P(n+1)<\/span> 也为真&quot;，这个证明对任意正整数 <span class=\"katex-inline\">n<\/span> 成立。<\/p>\n<p>由此推出 <span class=\"katex-inline\">P(n)<\/span> 对所有正整数 <span class=\"katex-inline\">n<\/span> 为真。书里紧接着给了等式序列样例：<span class=\"katex-inline\">1=1^2<\/span>，<span class=\"katex-inline\">1+3=2^2<\/span>，<span class=\"katex-inline\">1+3+5=3^2<\/span>，<span class=\"katex-inline\">1+3+5+7=4^2<\/span>，左侧前 <span class=\"katex-inline\">n<\/span> 个奇数之和等于 <span class=\"katex-inline\">n^2<\/span>，这是归纳法最常见的练手命题。<\/p>\n<p><strong>普通归纳（弱归纳）<\/strong>：归纳步假设只取 <span class=\"katex-inline\">P(n)<\/span>，证明 <span class=\"katex-inline\">P(n+1)<\/span>。适用递推只依赖前一项的命题。<\/p>\n<p><strong>强归纳（完全归纳）<\/strong>：归纳步假设取 <span class=\"katex-inline\">P(1),\\dots,P(n)<\/span> 全部成立，证明 <span class=\"katex-inline\">P(n+1)<\/span>。当 <span class=\"katex-inline\">P(n+1)<\/span> 的论证要用到更早若干项的性质时，需要这一形式。<\/p>\n<p><strong>反归纳（从反例最小化入手）<\/strong>：若假设存在使命题不成立的整数，取其中最小者，导出它前面的更小者也不成立，形成矛盾；这是归纳原理的逆否写法。<\/p>\n<h2>原理推导：归纳法为什么覆盖全部正整数<\/h2>\n<p>用良序观点看：假设命题不成立的正整数集合非空，该集合必有最小元 <span class=\"katex-inline\">n_0<\/span>。基础步已证 <span class=\"katex-inline\">P(1)<\/span> 真，所以 <span class=\"katex-inline\">n_0&gt;1<\/span>。归纳步对 <span class=\"katex-inline\">n=n_0-1<\/span> 成立：若 <span class=\"katex-inline\">P(1),\\dots,P(n_0-1)<\/span> 全真则 <span class=\"katex-inline\">P(n_0)<\/span> 真；而 <span class=\"katex-inline\">n_0<\/span> 是最小反例，<span class=\"katex-inline\">1,\\dots,n_0-1<\/span> 都不在反例集合里，即全真，于是 <span class=\"katex-inline\">P(n_0)<\/span> 真，与 <span class=\"katex-inline\">n_0<\/span> 为反例矛盾。反例集合为空，命题对所有正整数成立。<\/p>\n<p>推导结构上，基础步排除&quot;链条第一环断开&quot;，归纳步排除&quot;任意一环接不住下一环&quot;，两者合起来才是完整证明。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：命题按自然数 <span class=\"katex-inline\">n<\/span> 分层，第 <span class=\"katex-inline\">n+1<\/span> 层与第 <span class=\"katex-inline\">n<\/span> 层之间有可写出的推理关系。\n<\/li><li>\n失败案例 1：只证归纳步、不证基础步。形式上写好了&quot;<span class=\"katex-inline\">P(n)\\Rightarrow P(n+1)<\/span>&quot;，但 <span class=\"katex-inline\">P(1)<\/span> 未核验，链条可以从第一环就悬空。例如错误证明&quot;所有马同色&quot;：<span class=\"katex-inline\">n<\/span> 匹马任取一组同色，换掉一匹仍得 <span class=\"katex-inline\">n<\/span> 匹；论证在 <span class=\"katex-inline\">n=2<\/span> 无法把两组单匹马的颜色接上，而基础步 <span class=\"katex-inline\">n=1<\/span> 虽平凡成立，归纳步本身在相邻规模间缺少桥接。\n<\/li><li>\n失败案例 2：归纳步假设范围写错。需要强归纳的命题只写 <span class=\"katex-inline\">P(n)<\/span> 假设，论证中偷偷引用了 <span class=\"katex-inline\">P(n-1)<\/span> 或更早项，假设清单与引用范围不一致。\n<\/li><li>\n失败案例 3：基础步不止一个。命题从 <span class=\"katex-inline\">n=0<\/span> 起算时去证 <span class=\"katex-inline\">P(1)<\/span>，漏掉 <span class=\"katex-inline\">P(0)<\/span>；或分奇偶两支，只验了一支。\n<\/li><li>\n边界：归纳法不给出命题的构造，只完成真值证明；想算出 <span class=\"katex-inline\">P(n)<\/span> 的具体数值，还要配合递推或求和。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>归纳法 vs 经验归纳<\/strong>：数学归纳法是演绎推理，结论由前提必然推出；日常&quot;见过很多天鹅白天鹅所以天鹅皆白&quot;是经验概括，两者同名不同义。\n<\/li><li>\n<strong>普通归纳 vs 强归纳<\/strong>：差别在归纳假设包含几项；强归纳能覆盖的命题，普通归纳往往要改写递推关系才能用。\n<\/li><li>\n<strong>归纳步 vs 推导公式<\/strong>：归纳步里写出 <span class=\"katex-inline\">P(n+1)<\/span> 的表达式并往 <span class=\"katex-inline\">P(n)<\/span> 方向凑，这一步是代数推演；别把&quot;假设 <span class=\"katex-inline\">P(n)<\/span> 成立&quot;当成已经证明了 <span class=\"katex-inline\">P(n)<\/span>，它只是条件前提。\n<\/li><li>\n<strong>递推定义 vs 归纳证明<\/strong>：斐波那契数按 <span class=\"katex-inline\">F_{n+2}=F_{n+1}+F_n<\/span> 定义是构造；证明 <span class=\"katex-inline\">F_n<\/span> 的某条性质才是归纳任务，两者不要混为一谈。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 算法确定性要求步骤可复核，归纳法是复核算法结论的工具。后继：c04 欧几里得算法的终止性按余数递减归纳，正确性按 gcd 不变量归纳；c05 置换轮换分解按元素个数归纳；c12 生成函数解出系数后，回到归纳法验证展开式与递推一致。树的性质证明（第 2 章）同样按结点数做归纳。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（数学归纳法：三种形式与常见误用）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：归纳法的依赖链、两种形式的完整证明与漏洞排查<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要证明命题 <span class=\"katex-inline\">P(n)<\/span> 对所有正整数成立，先往回追三层：<\/p>\n<ol><li>\n命题必须能按自然数分层。第 <span class=\"katex-inline\">n<\/span> 层与第 <span class=\"katex-inline\">n+1<\/span> 层之间存在可写出的推理关系；没有分层关系，归纳通道无从建立。\n<\/li><li>\n最小情形必须可单独核验。链条第一环是 <span class=\"katex-inline\">P(1)<\/span>（或命题起点的 <span class=\"katex-inline\">P(0)<\/span>），这一步不依赖归纳假设。\n<\/li><li>\n归纳步必须把假设范围与论证引用对齐。普通归纳假设 <span class=\"katex-inline\">P(n)<\/span>，强归纳假设 <span class=\"katex-inline\">P(1),\\dots,P(n)<\/span>；论证中引用了哪些更早项，假设清单就要覆盖哪些项。\n<\/ol>\n<p>依赖链方向：命题可分层 → 基础步核验起点 → 归纳步从假设推出下一项 → 由良序原理排除反例集合。<\/p>\n<h2>正向推导：普通归纳法完整走一遍<\/h2>\n<p>命题：前 <span class=\"katex-inline\">n<\/span> 个奇数之和 <span class=\"katex-inline\">1+3+5+\\cdots+(2n-1)=n^2<\/span>。<\/p>\n<p><strong>基础步<\/strong>：<span class=\"katex-inline\">n=1<\/span> 时左侧为 <span class=\"katex-inline\">1<\/span>，右侧 <span class=\"katex-inline\">1^2=1<\/span>，<span class=\"katex-inline\">P(1)<\/span> 成立。<\/p>\n<p><strong>归纳步<\/strong>：假设 <span class=\"katex-inline\">P(n)<\/span> 成立，即 <span class=\"katex-inline\">1+3+\\cdots+(2n-1)=n^2<\/span>。考察 <span class=\"katex-inline\">P(n+1)<\/span> 左侧：<\/p>\n<div class=\"katex-block\">1+3+\\cdots+(2n-1)+(2n+1)=n^2+(2n+1)=(n+1)^2<\/div>\n<p>右侧展开 <span class=\"katex-inline\">(n+1)^2=n^2+2n+1<\/span>，两边相等。由 <span class=\"katex-inline\">P(n)<\/span> 推出 <span class=\"katex-inline\">P(n+1)<\/span>。归纳步对任意 <span class=\"katex-inline\">n<\/span> 成立，结合基础步，命题对所有正整数成立。<\/p>\n<p><strong>强归纳形式走一遍<\/strong>：命题&quot;每个大于 1 的整数可写成素数乘积&quot;。基础步：<span class=\"katex-inline\">2<\/span> 本身是素数，<span class=\"katex-inline\">P(2)<\/span> 成立。归纳步：假设 <span class=\"katex-inline\">2,\\dots,n<\/span> 都可写成素数乘积，考察 <span class=\"katex-inline\">n+1<\/span>。若 <span class=\"katex-inline\">n+1<\/span> 是素数，结论直接成立；若为合数，它分解为 <span class=\"katex-inline\">a\\cdot b<\/span>，其中 <span class=\"katex-inline\">2\\le a,b\\le n<\/span>，由归纳假设 <span class=\"katex-inline\">a,b<\/span> 各有素因子分解，合并即得 <span class=\"katex-inline\">n+1<\/span> 的分解。这里论证要用到 <span class=\"katex-inline\">a,b<\/span> 两个更早项的性质，普通归纳只假设 <span class=\"katex-inline\">P(n)<\/span> 不够，必须用强归纳清单。<\/p>\n<h2>数值算例：错误证明的漏洞定位<\/h2>\n<p><strong>算例 1：漏掉基础步的悬空链条<\/strong>。有人声称&quot;所有 <span class=\"katex-inline\">n<\/span> 匹马同色&quot;，论证：任取 <span class=\"katex-inline\">n<\/span> 匹马为一组，同色；换掉其中一匹，仍得 <span class=\"katex-inline\">n<\/span> 匹，由归纳假设同色。检查基础步：<span class=\"katex-inline\">n=1<\/span> 时单匹马自然同色，<span class=\"katex-inline\">P(1)<\/span> 成立。问题出在归纳步桥接：<span class=\"katex-inline\">n=1<\/span> 推 <span class=\"katex-inline\">n=2<\/span> 时，第一组单匹马与第二组单匹马没有共享同一匹马，颜色无法互相传递。归纳步在相邻规模间缺少桥接结构，看似整齐的递推在第一处扩展就断开。<\/p>\n<p><strong>算例 2：假设范围与引用不一致<\/strong>。命题证明中写&quot;由 <span class=\"katex-inline\">P(n)<\/span> 得……&quot;，实际论证里用到了 <span class=\"katex-inline\">P(n-1)<\/span> 的结论。把假设清单改成 <span class=\"katex-inline\">P(1),\\dots,P(n)<\/span> 才覆盖引用；若坚持普通归纳形式，必须改写递推关系，让论证只依赖 <span class=\"katex-inline\">P(n)<\/span>。<\/p>\n<p><strong>算例 3：起点错位<\/strong>。命题从 <span class=\"katex-inline\">n=0<\/span> 起算，证明者去核验 <span class=\"katex-inline\">P(1)<\/span>，漏掉 <span class=\"katex-inline\">P(0)<\/span>；或命题分奇偶两支，只验了偶支。补法是先确认命题定义域最小元，基础步对准该最小元，多分支各自核验。<\/p>\n<h2>延伸推演：归纳原理与良序原理的等价方向<\/h2>\n<p>假设存在使命题不成立的正整数集合 <span class=\"katex-inline\">S<\/span>。若 <span class=\"katex-inline\">S<\/span> 非空，良序原理给出 <span class=\"katex-inline\">S<\/span> 中最小元 <span class=\"katex-inline\">n_0<\/span>。基础步已证 <span class=\"katex-inline\">P(1)<\/span>，故 <span class=\"katex-inline\">n_0&gt;1<\/span>。令 <span class=\"katex-inline\">n=n_0-1<\/span>，归纳步条件满足：<span class=\"katex-inline\">P(1),\\dots,P(n)<\/span> 全真则 <span class=\"katex-inline\">P(n_0)<\/span> 真。由于 <span class=\"katex-inline\">n_0<\/span> 是最小反例，<span class=\"katex-inline\">1,\\dots,n_0-1<\/span> 都不在 <span class=\"katex-inline\">S<\/span> 中，即全真，于是 <span class=\"katex-inline\">P(n_0)<\/span> 真，与 <span class=\"katex-inline\">n_0\\in S<\/span> 矛盾。<span class=\"katex-inline\">S<\/span> 必为空。这条逆否路径说明：基础步与归纳步合起来排除了&quot;最小反例&quot;的存在空间。<\/p>\n<p>归纳法不提供构造。证明 <span class=\"katex-inline\">F_n<\/span> 满足某性质，不等于算出 <span class=\"katex-inline\">F_n<\/span> 的具体值；求值还要走递推或求和。归纳是真值论证工具，母函数与闭式是计数工具，分工不同。<\/p>\n<h2>对抗性追问：归纳步写得长就等于证明充分吗<\/h2>\n<p>不等于。归纳步长度不替代核验清单：基础步是否真的成立、假设与引用是否对齐、边界情形是否覆盖，三项要逐条查。常见假象是把递推公式代入后展开整齐，就认为归纳完成；代入过程若漏边界项，推出的 <span class=\"katex-inline\">P(n+1)<\/span> 仍可能与目标式差一个常数项。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n标准归纳法分哪两步？强归纳与普通归纳的假设差别在哪？\n<\/li><li>\n为什么说归纳法是演绎推理，不是经验概括？\n<\/li><li>\n举一个只做归纳步、不证基础步导致结论悬空的例子。\n<\/li><li>\n论证中引用了 <span class=\"katex-inline\">P(n-1)<\/span>，却只写假设 <span class=\"katex-inline\">P(n)<\/span>，漏洞属于哪一类？\n<\/li><li>\n良序原理怎样推出反例集合为空？归纳法不承担什么任务？\n<\/ol>\n<h2>延伸推演：归纳法在递归正确性证明中的位置<\/h2>\n<p>递归过程的正确性证明天然分两层。<strong>基础层<\/strong>：递归直接返回的情形（空子树、单元素表、零次幂）结果正确，对应归纳基础步。<strong>递推层<\/strong>：假设递归调用在规模更小的子问题上返回正确结果，在此基础上证明当前规模的组合结果正确，对应归纳步。子问题规模严格小于原问题，配合良序原理，递归必然向下落到基础层。<\/p>\n<p>这一结构与 c04 欧几里得终止性、c07 遍历正确性同源：先认最小情形，再认相邻规模间的传递。写递归证明时，先列&quot;什么情形直接返回&quot;，再列&quot;子结果正确时当前结果为什么正确&quot;，两条对应归纳两步，缺一条证明不闭合。<\/p>\n<h2>第二算例：等差求和的归纳核验<\/h2>\n<p>命题：<span class=\"katex-inline\">1+2+\\cdots+n=n(n+1)/2<\/span>。<\/p>\n<p>基础步 <span class=\"katex-inline\">n=1<\/span>：左侧 1，右侧 <span class=\"katex-inline\">1\\cdot2/2=1<\/span>，成立。<\/p>\n<p>归纳步：假设 <span class=\"katex-inline\">1+\\cdots+n=n(n+1)/2<\/span>，考察 <span class=\"katex-inline\">n+1<\/span>：<\/p>\n<div class=\"katex-block\">1+\\cdots+n+(n+1)=\\frac{n(n+1)}2+(n+1)=(n+1)\\left(\\frac n2+1\\right)=\\frac{(n+1)(n+2)}2<\/div>\n<p>右侧为 <span class=\"katex-inline\">(n+1)((n+1)+1)/2<\/span>，形式吻合。归纳完成。<\/p>\n<p><strong>对照验算<\/strong>：<span class=\"katex-inline\">n=10<\/span> 时左侧 55，右侧 <span class=\"katex-inline\">10\\cdot11/2=55<\/span>；<span class=\"katex-inline\">n=100<\/span> 右侧 <span class=\"katex-inline\">100\\cdot101/2=5050<\/span>。归纳证明给出的是对所有 <span class=\"katex-inline\">n<\/span> 的真值，数值验算只抽查个别项，不能替代证明。<\/p>\n<h2>常见误解补充<\/h2>\n<ul><li>\n<strong>误解一：&quot;归纳假设是已经证明的结论&quot;。<\/strong> 假设只是条件前提，证明的是&quot;若前提成立则结论成立&quot;；<span class=\"katex-inline\">P(n)<\/span> 本身在基础步与归纳步接力之前并未单独证出。\n<\/li><li>\n<strong>误解二：&quot;归纳步越长证明越牢&quot;。<\/strong> 证明强度取决于基础步是否成立、假设与引用是否对齐、边界是否覆盖，不取决于篇幅。代入展开整齐不等于链条闭合。\n<\/li><li>\n<strong>误解三：&quot;强归纳总比普通归纳好用&quot;。<\/strong> 强归纳假设更宽，但能用普通归纳解决的命题不必加码；形式选择应匹配递推依赖的项数。\n<\/li><li>\n<strong>误解四：&quot;归纳法只能证数列命题&quot;。<\/strong> 树按结点数归纳、程序按输入规模归纳、集合按元素个数归纳，都是同一原理在不同分层对象上的应用。\n<\/ul>\n<h2>推演补充：归纳证明的书写顺序检查<\/h2>\n<p>一份完整归纳证明落笔前，先列四样东西：命题 <span class=\"katex-inline\">P(n)<\/span> 的准确陈述；定义域最小元；基础步核验内容；归纳步假设清单与目标式。书写顺序通常是：声明命题 → 基础步 → 归纳假设 → 代入递推 → 整理到目标式 → 结论。<\/p>\n<p>检查时逐环对照：基础步代入最小元后等式两边是否真的相等；归纳假设写的是 <span class=\"katex-inline\">P(n)<\/span> 还是 <span class=\"katex-inline\">P(1),\\dots,P(n)<\/span>；推导中出现的 <span class=\"katex-inline\">P(n-1)<\/span> 是否在假设覆盖范围内；目标式右端是否展开到与左端同形。任一环对不上，证明就不能闭合。<\/p>\n<h2>推演补充：反归纳（最小反例）的写法<\/h2>\n<p>反归纳从反面入手：假设命题存在反例，取最小反例 <span class=\"katex-inline\">n_0<\/span>。由基础步知 <span class=\"katex-inline\">n_0&gt;1<\/span>，考察 <span class=\"katex-inline\">n_0-1<\/span>，它不是反例即命题成立；再用归纳步的同一推理推出 <span class=\"katex-inline\">P(n_0)<\/span> 成立，与 <span class=\"katex-inline\">n_0<\/span> 为反例矛盾。这一写法与正向归纳等价，区别是从矛盾处收口，在图论、集合论证明中更常见。<\/p>\n<p>两种形式都依赖良序原理：每个非空自然数子集有最小元。没有这条序结构，&quot;取最小反例&quot;或&quot;递减必到 0&quot;都失去依据。c04 的终止性证明同样站在良序原理上：余数严格递减，不可能无限延续。<\/p>\n<h2>边界对照：归纳法与后续工具的分工<\/h2>\n<p>归纳法负责核验命题真值；递推求解负责算出通项；母函数（c12）负责把递推转代数方程；求和与大 O（c11、c04 量级）负责估计规模。后续章节遇到&quot;证明某算法对所有输入成立&quot;，先回到归纳框架：最小输入情形是否核验，子规模情形能否推出当前情形。树性质证明按结点数归纳，置换分解按元素个数归纳，遍历正确性按子树规模归纳，都是这一框架的复用。<\/p>\n<h2>推演补充：归纳与递归的互映<\/h2>\n<p>递归过程在结构上就是归纳的执行版本：基础情形对应归纳基础步，递归调用对应归纳假设层，组合返回对应归纳步。证明递归函数正确时，先确认基础情形直接返回正确值；再假设各递归调用在更小输入上结果正确，证明当前组合结果正确；最后由输入规模严格下降配合良序，保证递归落到基础层。<\/p>\n<p>写递归代码与写归纳证明共用同一张分层图：顶层问题拆成哪些子问题，子问题规模小多少，合并规则是什么。分层图画不清，递归边界与归纳基础就都无从写起。<\/p>\n<h2>第三算例：等比数列求和归纳核验<\/h2>\n<p>命题：<span class=\"katex-inline\">1+r+r^2+\\cdots+r^n=(r^{n+1}-1)/(r-1)<\/span>（<span class=\"katex-inline\">r\\ne1<\/span>）。<\/p>\n<p>基础步 <span class=\"katex-inline\">n=0<\/span>：左侧 1，右侧 <span class=\"katex-inline\">(r-1)/(r-1)=1<\/span>，成立。<\/p>\n<p>归纳步：假设 <span class=\"katex-inline\">1+\\cdots+r^n=(r^{n+1}-1)/(r-1)<\/span>，加 <span class=\"katex-inline\">r^{n+1}<\/span>：<\/p>\n<div class=\"katex-block\">\\frac{r^{n+1}-1}{r-1}+r^{n+1}=\\frac{r^{n+1}-1+r^{n+1}(r-1)}{r-1}=\\frac{r^{n+2}-1}{r-1}<\/div>\n<p>与目标式 <span class=\"katex-inline\">(r^{(n+1)+1}-1)/(r-1)<\/span> 吻合。数值抽查 <span class=\"katex-inline\">r=2,n=3<\/span>：左侧 <span class=\"katex-inline\">1+2+4+8=15<\/span>，右侧 <span class=\"katex-inline\">(16-1)/(2-1)=15<\/span>，一致。<\/p>\n<h2>推演补充：归纳证明常见纸面错误清单<\/h2>\n<p>检查一份归纳证明，逐项过：基础步是否代入最小元后两边相等；归纳假设标注的是 <span class=\"katex-inline\">P(n)<\/span> 还是 <span class=\"katex-inline\">P(1),\\dots,P(n)<\/span>；推导引用的更早项是否在假设内；目标式右端是否展开同形；多分支命题是否每支都核验。纸面错误多发生在边界项：漏 <span class=\"katex-inline\">P(0)<\/span>、漏奇偶一支、把 <span class=\"katex-inline\">P(n-1)<\/span> 当 <span class=\"katex-inline\">P(n)<\/span> 引用。清单化核对比通读一遍更能定位漏洞。<\/p><\/div><\/details>", "kind": "concept", "title": "数学归纳法：三种形式与常见误用"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷1 基本算法 第3版.pdf · p.19<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">数学归纳法：三种形式与常见误用<\/a><\/span><\/div><h1>欧几里得算法的正确性与复杂度（gcd 不变量与步数量级）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 1 章（原书 §1.1、§1.2.8）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>给定两个正整数 <span class=\"katex-inline\">m,n<\/span>，要求同时整除二者的最大正整数。逐一枚举公约数太慢，直接分解质因数在大数上代价很高。欧几里得算法用余数反复替换两数，少量除法就得到 gcd。这个概念要回答两件事：为什么每步替换后答案不变（正确性），以及最坏情况下要做多少次除法（复杂度）。书里把算法 E 作为全书第一个完整算法样例（PDF 第 19–20 页）。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>算法 E（欧几里得算法）<\/strong>：给定两个正整数 <span class=\"katex-inline\">m,n<\/span>，求最大公约数。<\/p>\n<ul><li>\nE1. 求余数：用 <span class=\"katex-inline\">n<\/span> 除 <span class=\"katex-inline\">m<\/span>，令 <span class=\"katex-inline\">r<\/span> 为余数，<span class=\"katex-inline\">0\\le r&lt;n<\/span>。\n<\/li><li>\nE2. 余数为 0？若 <span class=\"katex-inline\">r=0<\/span>，算法终止，<span class=\"katex-inline\">n<\/span> 是答案。\n<\/li><li>\nE3. 减少：置 <span class=\"katex-inline\">m\\leftarrow n,\\ n\\leftarrow r<\/span>，返回步骤 E1。\n<\/ul>\n<p>书里另补 E0：若 <span class=\"katex-inline\">m&lt;n<\/span> 先交换 <span class=\"katex-inline\">m,n<\/span>，避免首轮商为 0 的空转（PDF 第 20 页）。<\/p>\n<p><strong>gcd 不变量<\/strong>：每步前后，<span class=\"katex-inline\">\\gcd(m,n)=\\gcd(n,r)<\/span>。这是正确性的核心。<\/p>\n<p><strong>余数递减量<\/strong>：<span class=\"katex-inline\">n&gt;r_1&gt;r_2&gt;\\cdots\\ge0<\/span>，余数序列严格递减，用于证明终止性。<\/p>\n<p><strong>与斐波那契数的挂钩<\/strong>：最坏情形输入是相邻斐波那契数；斐波那契数列 <span class=\"katex-inline\">F_0=0,\\ F_1=1,\\ F_{n+2}=F_{n+1}+F_n<\/span>（PDF 第 79 页），相邻两项做 gcd 所需除法次数与下标同阶。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>正确性证明<\/strong>：设 <span class=\"katex-inline\">m=qn+r<\/span>。<\/p>\n<p>第一步，证 <span class=\"katex-inline\">(m,n)<\/span> 的公约数都是 <span class=\"katex-inline\">(n,r)<\/span> 的公约数。若 <span class=\"katex-inline\">d\\mid m<\/span> 且 <span class=\"katex-inline\">d\\mid n<\/span>，则 <span class=\"katex-inline\">d\\mid(m-qn)<\/span>，而 <span class=\"katex-inline\">m-qn=r<\/span>，所以 <span class=\"katex-inline\">d\\mid r<\/span>。<\/p>\n<p>第二步，反过来证 <span class=\"katex-inline\">(n,r)<\/span> 的公约数都是 <span class=\"katex-inline\">(m,n)<\/span> 的公约数。若 <span class=\"katex-inline\">e\\mid n<\/span> 且 <span class=\"katex-inline\">e\\mid r<\/span>，则 <span class=\"katex-inline\">e\\mid(qn+r)<\/span>，而 <span class=\"katex-inline\">qn+r=m<\/span>，所以 <span class=\"katex-inline\">e\\mid m<\/span>。<\/p>\n<p>两方向合并，两个数对的公约数集合完全相同，最大公约数相等。E3 把问题换成 <span class=\"katex-inline\">(n,r)<\/span>，答案不变；到 E2 余数为 0 时，<span class=\"katex-inline\">n<\/span> 整除 <span class=\"katex-inline\">m<\/span>，<span class=\"katex-inline\">n<\/span> 本身即最大公约数。<\/p>\n<p><strong>终止性<\/strong>：每轮余数 <span class=\"katex-inline\">r&lt;n<\/span>，新的 <span class=\"katex-inline\">n<\/span> 是上一轮的 <span class=\"katex-inline\">r<\/span>，所以 <span class=\"katex-inline\">r_{k+1}&lt;r_k<\/span>。严格递减的非负整数序列不能无限延伸，有限步内必取到 0。<\/p>\n<p><strong>复杂度方向（Lamé 定理方向）<\/strong>：设做 <span class=\"katex-inline\">k<\/span> 次除法后余数为 0。逆推余数序列：最后一步余数为 0，倒数第二步为 <span class=\"katex-inline\">r_{k-1}<\/span>，向前每一步都满足后项不超过前项。最坏情况下余数下降最慢，对应相邻斐波那契数：<span class=\"katex-inline\">\\gcd(F_{k+1},F_k)<\/span> 需要 <span class=\"katex-inline\">k-1<\/span> 次除法。由于 <span class=\"katex-inline\">F_k\\approx\\varphi^k/\\sqrt5<\/span>（<span class=\"katex-inline\">\\varphi<\/span> 为黄金比），反解出 <span class=\"katex-inline\">k=O(\\log F_k)<\/span>，即除法次数为 <span class=\"katex-inline\">O(\\log\\min(m,n))<\/span>。这里给的是定理方向与量级归属，不展开完整定理证明。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：<span class=\"katex-inline\">m,n<\/span> 为正整数；除法与余数按整数语义定义。\n<\/li><li>\n失败案例 1：输入含 0 或负数。算法 E 假设正整数；对 0 与负数要先取绝对值、处理 <span class=\"katex-inline\">n=0<\/span> 的边界，否则余数分支语义不清。\n<\/li><li>\n失败案例 2：替换顺序写反。先 <span class=\"katex-inline\">n\\leftarrow r<\/span> 再 <span class=\"katex-inline\">m\\leftarrow n<\/span>，<span class=\"katex-inline\">m<\/span> 拿到的是 <span class=\"katex-inline\">r<\/span> 而非原 <span class=\"katex-inline\">n<\/span>，原 <span class=\"katex-inline\">n<\/span> 丢失，后续数对不再满足不变量。\n<\/li><li>\n边界：复杂度上界针对最坏情形；随机输入的平均步数低于最坏上界。算法只输出 gcd，不直接给出质因数分解；要分解仍需另行处理。\n<\/li><li>\n推广：同一套余数替换思想出现在连分数求解、线性同余求逆（扩展欧几里得）等场景。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>gcd 不变量 vs 余数递减<\/strong>：不变量保证答案不跑偏，递减量保证程序会停下；两者回答不同问题，缺一不可。只证不变量不证递减，不能排除无限循环；只证递减不证不变量，停下时无法确认答案。\n<\/li><li>\n<strong>欧几里得算法 vs 质因数分解<\/strong>：分解法分别列出 <span class=\"katex-inline\">m,n<\/span> 的素因子取公共部分，算法 E 不做因子枚举，直接在余数层完成替换。\n<\/li><li>\n<strong>最坏情形 vs 平均情形<\/strong>：<span class=\"katex-inline\">O(\\log\\min(m,n))<\/span> 是最坏上界；平均步数受输入分布影响，分析时不能把上界当平均值。\n<\/li><li>\n<strong>余数 vs 商<\/strong>：E1 关心余数 <span class=\"katex-inline\">r<\/span>，商 <span class=\"katex-inline\">q<\/span> 在主算法里不参与后续判断；扩展版本才需要保留商来写贝祖等式。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c03 归纳法用于核验不变量与终止性；c01 可行性、有限性在本算法上落地。后继：c09 线性同余发生器的周期条件建立在 gcd 与互素概念上；c11 调和数估计的是另一类求和量级，与本算法的对数步数对照阅读。扩展欧几里得是模逆元计算的基础工具。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（欧几里得算法的正确性与复杂度（gcd 不变量与步数量级））<\/summary><div class=\"depth-body\"><h1>c04 深度推导：欧几里得算法的不变量依赖链、手算全过程与步数量级<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要确认算法 E 正确且可终止，先往回追四层：<\/p>\n<ol><li>\n输入语义：<span class=\"katex-inline\">m,n<\/span> 为正整数，除法 <span class=\"katex-inline\">m=qn+r<\/span> 中 <span class=\"katex-inline\">q<\/span> 为商、<span class=\"katex-inline\">r<\/span> 为余数，<span class=\"katex-inline\">0\\le r&lt;n<\/span>。余数定义是后续替换的出发点。\n<\/li><li>\n不变量：每步前后两数对的公约数集合不变。这保证替换不改变待求答案。\n<\/li><li>\n终止度量：余数严格递减。这保证循环有限步内到达 0。\n<\/li><li>\n复杂度定位：最坏情形余数下降最慢，对应相邻斐波那契数；由斐波那契指数增长反解除数次数上界。\n<\/ol>\n<p>依赖链方向：整数除法语义 → gcd 集合相等证明 → 余数递减终止证明 → 最坏情形与斐波那契挂钩 → 量级 <span class=\"katex-inline\">O(\\log\\min(m,n))<\/span>。<\/p>\n<h2>正向推导：正确性与终止性分步核验<\/h2>\n<p><strong>不变量证明<\/strong>。设 <span class=\"katex-inline\">m=qn+r<\/span>。<\/p>\n<p>先证正向：若 <span class=\"katex-inline\">d\\mid m<\/span> 且 <span class=\"katex-inline\">d\\mid n<\/span>，则 <span class=\"katex-inline\">d\\mid(m-qn)<\/span>，而 <span class=\"katex-inline\">m-qn=r<\/span>，所以 <span class=\"katex-inline\">d\\mid r<\/span>。<span class=\"katex-inline\">(m,n)<\/span> 的公约数都是 <span class=\"katex-inline\">(n,r)<\/span> 的公约数。<\/p>\n<p>再证反向：若 <span class=\"katex-inline\">e\\mid n<\/span> 且 <span class=\"katex-inline\">e\\mid r<\/span>，则 <span class=\"katex-inline\">e\\mid(qn+r)<\/span>，而 <span class=\"katex-inline\">qn+r=m<\/span>，所以 <span class=\"katex-inline\">e\\mid m<\/span>。<span class=\"katex-inline\">(n,r)<\/span> 的公约数都是 <span class=\"katex-inline\">(m,n)<\/span> 的公约数。<\/p>\n<p>两方向合并，<span class=\"katex-inline\">\\gcd(m,n)=\\gcd(n,r)<\/span>。E3 把 <span class=\"katex-inline\">(m,n)<\/span> 换成 <span class=\"katex-inline\">(n,r)<\/span>，问题等价。到达 E2 时 <span class=\"katex-inline\">r=0<\/span>，<span class=\"katex-inline\">n\\mid m<\/span>，<span class=\"katex-inline\">n<\/span> 即最大公约数。<\/p>\n<p><strong>终止性证明<\/strong>。记第 <span class=\"katex-inline\">k<\/span> 轮余数 <span class=\"katex-inline\">r_k<\/span>，本轮后更新 <span class=\"katex-inline\">n\\leftarrow r_k<\/span>，下一轮余数 <span class=\"katex-inline\">r_{k+1}&lt;n=r_k<\/span>。于是 <span class=\"katex-inline\">n&gt;r_1&gt;r_2&gt;\\cdots\\ge0<\/span>。严格递减非负整数序列长度有限，必在某步取 0。<\/p>\n<h2>数值算例：书里算例的逐步还原<\/h2>\n<p>取 <span class=\"katex-inline\">m=119,\\ n=544<\/span>。初值 <span class=\"katex-inline\">m&lt;n<\/span>，先交换：<span class=\"katex-inline\">m=544,\\ n=119<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">544=4\\cdot119+68<\/span>，<span class=\"katex-inline\">r=68<\/span>；更新 <span class=\"katex-inline\">m=119,\\ n=68<\/span>。不变量：<span class=\"katex-inline\">\\gcd(544,119)=\\gcd(119,68)<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">119=1\\cdot68+51<\/span>，<span class=\"katex-inline\">r=51<\/span>；更新 <
