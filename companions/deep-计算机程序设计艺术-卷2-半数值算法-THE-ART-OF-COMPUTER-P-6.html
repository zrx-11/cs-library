n>，这是素数模周期长的群论依据。<\/p>\n<h2>补充算例：<span class=\"katex-inline\">m=7<\/span> 上的阶对照<\/h2>\n<p><span class=\"katex-inline\">a=2<\/span> 模 7：<span class=\"katex-inline\">2^1=2<\/span>，<span class=\"katex-inline\">2^2=4<\/span>，<span class=\"katex-inline\">2^3=1<\/span>，阶 3。<span class=\"katex-inline\">a=3<\/span>：<span class=\"katex-inline\">3^1=3<\/span>，<span class=\"katex-inline\">3^2=2<\/span>，<span class=\"katex-inline\">3^3=6<\/span>，<span class=\"katex-inline\">3^6=1<\/span>，阶 6，等于群规模 6。<span class=\"katex-inline\">a=3<\/span> 是本原乘子方向，零增量序列周期 6；<span class=\"katex-inline\">a=2<\/span> 阶 3，周期减半。对照可见同模数下乘子选择直接决定阶的长短，不能只看模大小。<\/p>\n<h2>补充辨析：模数形式的两类折中<\/h2>\n<p>字长幂次模取模最快，群结构受限；素数模群完整、周期长，取模要专门回退。梅森素数模 <span class=\"katex-inline\">2^e-1<\/span> 方向是折中：减法回退代替除法，群结构接近素数模。选型先列吞吐与周期两项硬指标，再在三类模之间权衡，不为单一指标牺牲另一项。<\/p>\n<h2>补充一层：参数选择与检验环节的接口<\/h2>\n<p>模、乘子、增量选定后，周期由定理 A 或阶判定；周期合格只是入门。低位是否随机、高维格是否成摞，由 c04 经验检验与 c05 谱检验验收。参数表的最终排序通常按检验指标，周期条件作为筛选门槛。c09 多精度取余、c03 模算术把同一 <span class=\"katex-inline\">\\bmod m<\/span> 操作推广到大整数表示，底层规则一致。<\/p>\n<h2>补充一层：阶与周期的互素前提<\/h2>\n<p>阶定义在乘法群上，前提是 <span class=\"katex-inline\">a<\/span> 与 <span class=\"katex-inline\">m<\/span> 互素；初值 <span class=\"katex-inline\">X_0<\/span> 与 <span class=\"katex-inline\">m<\/span> 互素时周期等于阶。若初值含公共因子，序列可能进入更短的环，实际周期再受 gcd 约束。核验零增量发生器时，先查乘子与模互素，再查阶，最后确认初值公共因子，三步分开。<\/p>\n<h2>补充一层：模算术在大整数上的推广<\/h2>\n<p>c09 多精度算术里，模 <span class=\"katex-inline\">m<\/span> 表示把大整数压到余数范围；c03 阶的判定与模群结构是同一套余数语言。选模时的速度与周期权衡，在大整数模表示中同样成立：字长模快但结构受限，素数模完整但取模成本高。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n模数选择要同时过哪两条约束？只满足一条会出什么问题？\n<\/li><li>\n为什么 <span class=\"katex-inline\">a=1<\/span> 与 <span class=\"katex-inline\">a=0<\/span> 不能作为随机乘子？\n<\/li><li>\n写出阶的定义，并说明零增量序列周期与阶的关系。\n<\/li><li>\n手算 <span class=\"katex-inline\">5<\/span> 模 <span class=\"katex-inline\">16<\/span> 的阶，对应序列周期是多少？\n<\/li><li>\n零增量分支为什么不能套用定理 A 的互素条件？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "模、乘数与势：模数选择、乘数选择与零增量时的阶"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷2 半数值算法.pdf · p.43<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">线性同余发生器：递推式、均匀偏差与序列循环<\/a><\/span><\/div><h1>卡方检验与经验检验：均匀性、连检验与配对检验<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch02（原书 §3.3.1–3.3.2，PDF 第 43 页起）\n<\/ul>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>生成器给出一串候选随机数之后，凭什么说它&quot;够随机&quot;？书里指出，把真随机数表给人看，人也常挑出模式说它不随机；主观感觉靠不住，必须有无偏的机械检验。困难在于：随机序列的&quot;随机&quot;体现在多个角度——频数是否均匀、相邻项次序是否粘连、两两组合位置是否偏斜。单一角度通过不代表整体合格，需要一组经验检验，把序列分组算统计量，再与随机假设下的期望对照。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>经验检验（empirical test）<\/strong>：用计算机处理序列中的若干组数，计算特定统计量；与理论检验相对，后者用数论方法按递推规则建立特征。<\/p>\n<p><strong>卡方（<span class=\"katex-inline\">\\chi^2<\/span>）检验<\/strong>：把取值区间分成若干格，统计每格观测频数 <span class=\"katex-inline\">N_s<\/span>；均匀假设下期望频数 <span class=\"katex-inline\">E_s=Np_s<\/span>；统计量<\/p>\n<div class=\"katex-block\">\\chi^2=\\sum_s \\frac{(N_s-E_s)^2}{E_s}<\/div>\n<p>观测与期望越接近，每项越小；系统性偏斜被平方放大。<\/p>\n<p><strong>连检验（runs test）方向<\/strong>：按相邻项的大小次序（升、降、等）划分连续段，统计各种长度连的个数，与随机排列下的期望比较；检验相邻次序是否粘连。<\/p>\n<p><strong>配对检验（paired test）方向<\/strong>：把相邻两项配成坐标，看点在二维平面各象限或格子中的分布是否均匀；暴露组合层面的偏斜。<\/p>\n<p><strong>正例<\/strong>：骰子和值试验中，各点数和出现次数接近期望概率分配，卡方值小；某一格持续偏多，对应项抬高统计量。<\/p>\n<p><strong>反例<\/strong>：只数&quot;0 到 9 各 digit 出现次数&quot;就宣布均匀，可能漏掉长段上升、长段重复这类次序缺陷；频数均匀与次序随机是两件事。<\/p>\n<h2>原理推导：统计量怎样度量偏离<\/h2>\n<p>设共 <span class=\"katex-inline\">N<\/span> 次试验。第 <span class=\"katex-inline\">s<\/span> 格期望 <span class=\"katex-inline\">E_s=Np_s<\/span>。偏差 <span class=\"katex-inline\">N_s-E_s<\/span> 有正有负，直接求和会互相抵消；平方后消除符号，再除以 <span class=\"katex-inline\">E_s<\/span> 归一化——期望大的格子容差天然大，除以期望使各格可比。<span class=\"katex-inline\">\\chi^2<\/span> 越大，偏离均匀假设越远；超出临界值则拒绝该假设。<\/p>\n<p>检验流程不变量：每轮检验先明确被考察的角度（单变量频数、相邻次序、二元组合），再算对应统计量；不同角度的检验互相补充，不能互相替代。一个序列对 <span class=\"katex-inline\">T_1,\\dots,T_n<\/span> 都通过，也不能保证 <span class=\"katex-inline\">T_{n+1}<\/span> 通过；实践中跑五六种不同类型检验，通过得多才更有把握。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：已有一段可重复取样的序列样本；样本量足够使各格期望频数不至于过小。\n<\/li><li>\n失败案例 1：格子分得太细，每格期望个位数，平方比失真，卡方统计量不再按既定分布解释。\n<\/li><li>\n失败案例 2：只跑频数检验，连检验暴露的升降粘连、配对检验暴露的象限偏斜都漏过去。\n<\/li><li>\n失败案例 3：把检验失败归因于样本偶然后反复重抽同一发生器，直到&quot;通过&quot;；挑选样本会掩盖发生器缺陷。\n<\/li><li>\n边界：经验检验基于样本，样本内通过不能证明全周期性质；结构层面的缺陷要靠理论检验与谱检验（c05）。\n<\/ul>\n<p><strong>检验组合的实际安排<\/strong>：书 §3.3.2 把经验检验组织成一组可重复执行的流程。先把序列切成等长样本段，逐段算统计量；频数检验看各区间落点数，连检验数上升段、下降段与等段的长度分布，配对检验把相邻两项配成坐标看格子落点。每种检验对应一个随机假设下的期望分布：若随机排列，各种长度的连各占多少、各象限点数各占多少，都有理论比例。观测比例偏离期望比例越远，统计量越大。检验顺序上先跑计算便宜的频数与连检验，再做配对与更高维组合；每种检验的样本段要足够长，否则稀有连类型在样本里一次不出现，期望与观测都失去比较基础。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>经验检验 vs 理论检验<\/strong>：前者跑样本算统计量，后者分析递推规则的数学性质；谱检验两类特点兼有。\n<\/li><li>\n<strong>卡方 vs 连检验<\/strong>：卡方管单变量分布形状，连检验管相邻次序；前者看落在哪格，后者看怎样连续。\n<\/li><li>\n<strong>通过检验 ≠ 证明随机<\/strong>：检验只能推翻&quot;不随机&quot;的明显反例，不能穷尽所有随机性质；通过多项检验是提高把握，不是出具随机证明。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 生成的均匀偏差序列、概率频数与期望概念。后继：c05 谱检验从格结构做更强的理论判断；c06 的抽样、洗牌算法产出的样本同样要经这套检验验收。经验检验是实践中最常用的第一道筛子。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（卡方检验与经验检验：均匀性、连检验与配对检验）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：卡方统计量推演、连检验角度与样本验收流程<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>经验检验往回追四层：<\/p>\n<ol><li>\n<strong>合格原料前提<\/strong>：先有一串可重复取样的候选序列（c01）。\n<\/li><li>\n<strong>随机假设<\/strong>：待检验的零假设是序列在各考察角度下符合均匀随机排列。\n<\/li><li>\n<strong>统计量构造<\/strong>：把观测频数与期望频数对照，偏差平方归一化求和。\n<\/li><li>\n<strong>多角度补充<\/strong>：频数、连、配对各管一个角度，单角度通过不代表整体合格。\n<\/ol>\n<p>依赖链方向：候选序列 → 随机假设 → 频数统计量 → 次序与组合检验 → 多项检验综合把握。<\/p>\n<h2>正向推导：卡方统计量怎样从频数偏差算出<\/h2>\n<p>设共 <span class=\"katex-inline\">N<\/span> 次试验，取值分 <span class=\"katex-inline\">S<\/span> 格，第 <span class=\"katex-inline\">s<\/span> 格概率 <span class=\"katex-inline\">p_s<\/span>，期望频数 <span class=\"katex-inline\">E_s=Np_s<\/span>，观测频数 <span class=\"katex-inline\">N_s<\/span>。<\/p>\n<ol><li>\n算每格偏差 <span class=\"katex-inline\">N_s-E_s<\/span>。直接求和时正负抵消，不能反映总偏离。\n<\/li><li>\n平方 <span class=\"katex-inline\">(N_s-E_s)^2<\/span> 消除符号，偏大偏小都计入。\n<\/li><li>\n除以 <span class=\"katex-inline\">E_s<\/span> 归一化：期望大的格子容差天然大，除以期望使各格可比。\n<\/li><li>\n求和：\n<\/ol>\n<div class=\"katex-block\">\\chi^2=\\sum_{s=1}^{S}\\frac{(N_s-E_s)^2}{E_s}<\/div>\n<p>统计量小说明观测贴近期望；某格系统性偏多或偏少，对应项被平方放大。超出临界值则拒绝均匀假设。<\/p>\n<h2>数值算例：两个骰子和的卡方<\/h2>\n<p>36 次试验，点数和 <span class=\"katex-inline\">s=2,\\dots,12<\/span>，各和的组合方式数为 <span class=\"katex-inline\">1,2,3,4,5,6,5,4,3,2,1<\/span>，期望频数 <span class=\"katex-inline\">E_s<\/span> 恰为方式数。设观测只有 <span class=\"katex-inline\">s=7<\/span> 偏离：观测 12 次，期望 6 次；其余格子观测等于期望。<\/p>\n<ul><li>\n<span class=\"katex-inline\">s=7<\/span> 项：<span class=\"katex-inline\">(12-6)^2/6=36/6=6<\/span>。\n<\/li><li>\n其余项偏差为 0。\n<\/ul>\n<p><span class=\"katex-inline\">\\chi^2=6<\/span>。若全部格子贴近期望，<span class=\"katex-inline\">\\chi^2=0<\/span>；<span class=\"katex-inline\">s=7<\/span> 持续偏多，统计量抬高。判读时对照卡方分布临界值：超出临界值才拒绝假设；样本量小时单格期望个位数，平方比失真，格子要相应合并。<\/p>\n<h2>正向推演：连检验的角度<\/h2>\n<p>把相邻两项按大小关系标成上升、下降、持平，连续同向的一段称为一个连。随机排列下，长连出现有理论概率；观测中连续上升五六段、或长连个数明显偏少，说明次序粘连。连检验不看落在哪格，只看相邻次序，与卡方的单变量分布角度互补。配对检验再把 <span class=\"katex-inline\">(X_n,X_{n+1})<\/span> 配成坐标，数各象限、各格子点数，暴露二元组合层面的偏斜。<\/p>\n<h2>验收流程的推进次序<\/h2>\n<ol><li>\n序列切等长样本段，样本长度保证稀有连类型有机会出现。\n<\/li><li>\n先跑计算便宜的频数检验与连检验，再做配对与高维组合。\n<\/li><li>\n每种检验记录统计量与临界值的关系；通过多类检验才提高把握。\n<\/li><li>\n一个序列对 <span class=\"katex-inline\">T_1,\\dots,T_n<\/span> 通过，不保证 <span class=\"katex-inline\">T_{n+1}<\/span> 通过；实践中跑五六种不同类型检验。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>格子过细<\/strong>。每格期望个位数时，一次偏差就让平方比剧烈跳动，统计量不再按既定分布解释；合并不够细的格子是第一步要做的修正。<\/p>\n<p><strong>只跑频数检验<\/strong>。长段上升、长段重复这类次序缺陷在频数表上看不出来；连检验、配对检验漏跑，缺陷放行。<\/p>\n<p><strong>挑样本凑通过<\/strong>。同一发生器反复重抽，挑出一串&quot;通过&quot;的样本归档；挑选过程掩盖发生器本身的偏斜，验收结论无效。<\/p>\n<p><strong>样本太短<\/strong>。短样本里稀有组合一次不出现，期望与观测都失去比较基础；检验结论不能外推到全周期。<\/p>\n<h2>延伸推演：经验检验与理论检验的分工<\/h2>\n<p>经验检验处理样本统计量，样本内通过不能证明全周期性质；理论检验直接分析递推规则的数学结构。谱检验（c05）兼有二者：既用全周期性质，又靠程序算指标。实践中先用经验检验筛掉明显偏斜的样本，再用结构检验判断发生器本身。<\/p>\n<h2>延伸一层：卡方分布的判读方向<\/h2>\n<p>卡方统计量在随机假设下服从相应自由度的卡方分布；观测统计量落在右端尾部越深，偏离均匀假设越显著。判读不是看统计量是否为零——样本天然有随机波动，零偏离反而可疑——而是看它是否超出临界值。自由度由格子数与被估参数决定；格子合并后自由度同步调整。样本量增大时，同样的相对偏离会被更灵敏地检出，临界值随样本规模变化。<\/p>\n<h2>数值算例二：配对检验的格子计数<\/h2>\n<p>把相邻两项 <span class=\"katex-inline\">(U_n,U_{n+1})<\/span> 投到二维单位正方形，四等分后得四个象限格子。随机假设下每格期望 <span class=\"katex-inline\">N/4<\/span>。设 <span class=\"katex-inline\">N=40<\/span>，各格期望 10；观测 <span class=\"katex-inline\">14,9,8,9<\/span>，偏差项 <span class=\"katex-inline\">(14-10)^2/10=1.6<\/span>，其余 <span class=\"katex-inline\">0.1,0.4,0.1<\/span>，合计 2.2。某一格持续偏多，二维组合层面存在偏斜；这类偏斜在单变量频数表里完全看不出来。<\/p>\n<h2>延伸推演：经验检验的组织顺序<\/h2>\n<p>实际流程把检验分层：先单变量频数（落在哪格），再单变量次序（连检验），再二元组合（配对），必要时上三维以上组合。每层检验样本段等长，稀有类型在短样本中不出现会使期望失准，因此样本长度要覆盖最慢出现的连类型。检验记录保留统计量与临界值关系，不同类型检验的结果并列陈列，不用一个总分掩盖某一层的偏离。<\/p>\n<h2>对照辨析：经验检验与谱检验的数据来源<\/h2>\n<p>经验检验从序列抽样算统计量，结论受样本段选择影响；谱检验（c05）直接分析全周期递推结构。前者像抽样质检，后者像图纸审查。经验检验能发现样本中的偶然偏斜，谱检验暴露发生器固有的规则结构；实践顺序是先用经验检验筛样本质量，再用结构检验判发生器本身。<\/p>\n<h2>失败案例补充：检验假设错位<\/h2>\n<p>把非均匀分布的序列拿去做均匀性检验，显著偏离是原料分布问题，不是发生器随机度问题；检验口径要与生成目标匹配。另一种错位是把连检验用在已经排序过的样本上，长连是排序的必然结果，不能归罪于随机发生器。跑检验前先确认样本出处与待验假设。<\/p>\n<h2>再推一层：多种检验的组合把握<\/h2>\n<p>书里指出，序列对 <span class=\"katex-inline\">T_1,\\dots,T_n<\/span> 都通过，也不能保证 <span class=\"katex-inline\">T_{n+1}<\/span> 通过；通过五六种不同类型检验只是提高把握。随机性是开放性质，不存在有限检验集合能穷尽；检验的作用是推翻明显不合格的发生器，而不是出具&quot;绝对随机&quot;证明。这一立场与 §3.5 对&quot;什么是随机序列&quot;的理论追问相接。<\/p>\n<h2>补充推演：频数、次序、组合三层检验的覆盖关系<\/h2>\n<p>频数检验回答&quot;落在哪格&quot;，连检验回答&quot;相邻怎样衔接&quot;，配对检验回答&quot;两项组合落在哪格&quot;。三层覆盖单变量分布、单变量次序、二元组合；更高维组合继续叠加。三层之间不互相替代：频数均匀的序列可能长段粘连，次序随机的序列可能象限偏斜。验收表按三层陈列结果，某一层红灯不能被其他层的绿灯掩盖。<\/p>\n<h2>补充算例：连检验的长度分布<\/h2>\n<p>随机排列中，长度为 1 的升降连占多数，长连稀有。设样本出现一段连续五升，理论概率极低；连检验统计各长度连的个数，与随机排列期望比较。观测长连个数超出期望，说明相邻项存在同向粘连，序列不如随机排列那样换向频繁。这个角度与格子计数完全无关，只看相邻大小关系的延续长度。<\/p>\n<h2>补充辨析：样本检验与全周期性质<\/h2>\n<p>经验检验基于抽出的样本段，结论随样本选择波动；换一段样本可能结论不同。全周期性质要靠理论分析（c05 谱检验）。经验检验适合日常验收：跑一段样本，统计量不越界即放行；结构缺陷的最终定位回到发生器规则本身。两者在流水线前后衔接，不是二选一。<\/p>\n<h2>失败案例补充：样本不独立被当独立样本检验<\/h2>\n<p>序列若分段重叠抽取，样本间自带相关；检验把相关样本当独立样本，期望频数口径失效。抽样应取不重叠段，或在检验口径中计入相关结构。另一种错位是样本量不足以支撑细分格子，硬细分后期望个位数，统计量失真。<\/p>\n<h2>补充一层：检验通过的概率立场<\/h2>\n<p>书里立场是&quot;在证明有罪之前假定它无罪&quot;：多项检验通过才提高把握，检验不能证明随机。随机序列本就可能在某次检验中偶然偏离，临界值控制误判方向；反过来，合格发生器也可能在短样本上暴露偶然偏离，需要换段复验。理解这一概率立场，才不会把单次检验通过或失败当成终审判决。<\/p>\n<h2>补充算例：频数检验的格子合并<\/h2>\n<p>样本量 <span class=\"katex-inline\">N=20<\/span>，分十格后期望每格 2；某格观测 0、某格观测 5，平方比被小期望放大。格子合并到四五格后期望升到 4 左右，统计量口径才稳定。合并规则：把相邻小期望格并成一格，自由度同步减少；不能为了让统计量好看随意并格，合并要在检验前按样本量定好。<\/p>\n<h2>补充辨析：经验检验的指标选择<\/h2>\n<p>不同检验统计量对应不同偏离方向：卡方看单变量分布形状，连检验看次序延续，配对看二元组合。选指标先明确怀疑哪类缺陷，再跑对应检验；只跑一个卡方就下均匀结论，等于只查了一个角度。检验清单按三层覆盖排列，每层至少一个指标。<\/p>\n<h2>补充一层：检验记录的陈列方式<\/h2>\n<p>验收表按频数、次序、组合三层陈列，每层记统计量与临界值关系；某层偏离单独标注，不被其他层绿灯掩盖。样本段长度、格子数、自由度随表记录，便于换段复验时口径一致。检验结论是概率判断，记录口径比单次通过结论更重要。<\/p>\n<h2>补充一层：检验与发生器迭代的闭环<\/h2>\n<p>检验发现偏离后回到参数调整：周期不足改模与乘子，次序粘连查递推结构，组合偏斜换发生器类型。检验不是一次性签收，而是选型闭环的反馈环节；每轮调整后重跑同一套检验口径，保证前后可比。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出卡方统计量公式，说明平方与除以期望各解决什么问题。\n<\/li><li>\n36 次骰子试验中 <span class=\"katex-inline\">s=7<\/span> 观测 12、期望 6，其余贴近期望，<span class=\"katex-inline\">\\chi^2<\/span> 是多少？\n<\/li><li>\n连检验与卡方检验分别考察哪个角度？为什么两者不能互相替代？\n<\/li><li>\n格子分得太细为什么会让统计量失真？\n<\/li><li>\n为什么&quot;通过几种检验&quot;不等于证明序列随机？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "卡方检验与经验检验：均匀性、连检验与配对检验"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷2 半数值算法.pdf · p.81<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">卡方检验与经验检验：均匀性、连检验与配对检验<\/a><\/span><\/div><h1>谱检验：相邻随机数的格结构与发生器质量判断<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch02（原书 §3.3.4，PDF 第 81 页）\n<\/ul>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>经验检验抽样本算统计量，对藏在递推规则深处的结构缺陷可能看不出来。线性同余发生器的点受同一递推约束，低维投影也许看着均匀，高维上却成摞排列。困难在于：怎样直接利用序列的全周期数学性质，把这种规则格暴露出来，并给出一个可计算的疏密指标。谱检验（spectral test）就是为此设计；书里称它是迄今为止已知最强的检验，所有好的生成器能通过，目前已知的坏生成器实际上都通不过它（PDF 第 81 页）。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>格点视角<\/strong>：把相邻的两个、三个或更多随机数组成高维点 <span class=\"katex-inline\">(X_n,X_{n+1})<\/span>、<span class=\"katex-inline\">(X_n,X_{n+1},X_{n+2})<\/span>……线性同余序列的点受线性递推约束，落在一组规则的平行直线、平行平面或超平面上。<\/p>\n<p><strong>格间距<\/strong>：这些平行直线（面、超平面）之间的距离。间距小表示格密、空间覆盖均匀；间距大表示点成摞排列，方向上留出宽条空白。<\/p>\n<p><strong>谱检验的双重身份<\/strong>：像理论检验那样处理序列全周期的性质，又像经验检验那样需要计算机程序确定结果；它综合两类检验的特点。<\/p>\n<p><strong>维度序列<\/strong>：检验逐维进行——二维看点落在哪组直线上，三维看平面，更高维看超平面；低维合格不代表高维合格。<\/p>\n<p><strong>正例<\/strong>：参数选择良好的发生器，各维格都较密，间距指标小，谱检验通过。<\/p>\n<p><strong>反例<\/strong>：乘数或模数选择不当的坏发生器，点在某些方向成条成摞，格间距大；即便单变量频数均匀，谱检验把这种空白翻出来。<\/p>\n<h2>原理推导：递推规则为什么把点压上规则格<\/h2>\n<p>递推 <span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span> 是线性关系加取模。忽略取模的非线性折叠，<span class=\"katex-inline\">(X_n,X_{n+1})<\/span> 满足 <span class=\"katex-inline\">X_{n+1}=aX_n+c<\/span> 的线性关系，画在平面上就是一组平行线；取模把超出 <span class=\"katex-inline\">[0,m-1]<\/span> 的部分折回，直线变成平行的周期排列。三维点 <span class=\"katex-inline\">(X_n,X_{n+1},X_{n+2})<\/span> 受两条相邻递推约束，落在平行平面上。维数越高，约束叠加越多，格结构越规整。<\/p>\n<p>谱检验计算各维最密覆盖下的间距：把所有格点方向找出来，量相邻平行面的距离。不变量是：递推规则固定，格的方向与间距由 <span class=\"katex-inline\">m,a,c<\/span> 决定；参数不变，格结构不变。间距大意味着某些方向上点与点之间隔着空白，仿真或抽样时沿这些方向取值会系统性扎堆。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：对象是线性同余型及其推广的发生器；需要判断全周期意义上的结构质量。\n<\/li><li>\n失败案例 1：只看二维投影，高维成摞在二维上被抹平，检验放行。\n<\/li><li>\n失败案例 2：把格密当成唯一标准，忽略经验检验暴露的样本偏斜；谱检验强但不替代其他角度。\n<\/li><li>\n失败案例 3：参数改了一组就只重算低维，未逐维更新间距；高维缺陷会漏掉。\n<\/li><li>\n边界：谱检验针对线性同余结构；对非线性发生器，其格视角需要相应改造。\n<\/ul>\n<p><strong>格疏密的计算口径<\/strong>：谱检验在每个维度上先找出覆盖全部点的最密平行面族，再量面间距。二维情形看点落在哪组平行线之间，三维看平行平面，更高维推广到超平面。间距指标越小，说明点在该维度铺满空间；间距一旦偏大，沿垂直于面的方向点与点之间隔着空白条。检验逐维更新结果：二维合格只说明相邻两项的关系没有明显成摞，三维、四维仍可能暴露高阶约束。书里强调谱检验综合了前几节经验检验与理论检验的特点，它不抽样本猜性质，而是把全周期递推规则的几何后果直接算出来，因此对坏生成器的识别力高于普通样本统计。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>谱检验 vs 卡方类经验检验<\/strong>：卡方抽样本数格子，谱检验分析全周期格结构；前者样本驱动，后者规则驱动。\n<\/li><li>\n<strong>格间距大 vs 周期短<\/strong>：周期短是很快重复，格间距大是一轮内排列成摞；两者是不同缺陷，可同时出现也可分别存在。\n<\/li><li>\n<strong>理论检验 vs 经验检验<\/strong>：谱检验兼有二者；理论检验按递推规则建特征，经验检验靠程序统计样本。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 线性同余递推、c04 经验检验的位置与分工。后继：c06 在通过检验的均匀偏差上做分布变换；c10 大整数乘法复杂度、c12 多项式卷积里同样出现&quot;把对象看成格点/系数结构再度量疏密&quot;的分析方向。谱检验是本章随机性验收的最后一道结构关。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（谱检验：相邻随机数的格结构与发生器质量判断）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：递推约束下的格结构、间距度量与逐维检验<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>谱检验往回追四层：<\/p>\n<ol><li>\n<strong>递推规则固定<\/strong>：<span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span> 由参数决定，序列不是任意点集（c01）。\n<\/li><li>\n<strong>线性关系约束<\/strong>：忽略取模折叠，相邻项满足线性方程；取模把直线折成周期平行排列。\n<\/li><li>\n<strong>高维叠加<\/strong>：三维、四维相邻项受多条递推约束，点落在平行面、超平面上。\n<\/li><li>\n<strong>疏密度量<\/strong>：量平行面间距，间距大即方向上留有空白，发生器结构外露。\n<\/ol>\n<p>依赖链方向：固定递推 → 二维直线约束 → 高维平面约束 → 格间距指标 → 逐维验收。<\/p>\n<h2>正向推导：二维点为什么落在平行直线上<\/h2>\n<p>递推 <span class=\"katex-inline\">X_{n+1}=aX_n+c\\bmod m<\/span>。先忽略取模，<span class=\"katex-inline\">(X_n,X_{n+1})<\/span> 满足直线方程 <span class=\"katex-inline\">X_{n+1}=aX_n+c<\/span>，斜率 <span class=\"katex-inline\">a<\/span>、截距 <span class=\"katex-inline\">c<\/span>。取模把超出 <span class=\"katex-inline\">[0,m-1]<\/span> 的部分折回区间，直线在模 <span class=\"katex-inline\">m<\/span> 下复制成一组平行直线，间距由斜率与模共同决定。所有相邻点都落在这组线上，不会散满整个正方形。<\/p>\n<p>三维点 <span class=\"katex-inline\">(X_n,X_{n+1},X_{n+2})<\/span> 受两条相邻递推约束：<span class=\"katex-inline\">X_{n+1}=aX_n+c<\/span> 与 <span class=\"katex-inline\">X_{n+2}=aX_{n+1}+c<\/span>，点落在一组平行平面上。维数再加，约束叠加为超平面族。递推规则不变，格的方向与间距就不变。<\/p>\n<h2>正向推导：间距怎样反映质量<\/h2>\n<p>把覆盖全部点的最密平行面族找出来，量相邻面距离：<\/p>\n<ul><li>\n间距小：格密，点在该方向铺满空间，空白条窄。\n<\/li><li>\n间距大：点成摞排列，垂直于面的方向留出宽条空白；沿这些方向取值会扎堆。\n<\/ul>\n<p>低维投影可能把高维成摞抹平：二维看着散，三维、四维才显出平面约束。谱检验逐维计算间距指标，低维合格不代表高维合格。<\/p>\n<h2>数值算例：短序列的二维落点<\/h2>\n<p>取 c01 算例 <span class=\"katex-inline\">m=10,a=7,c=7,X_0=7<\/span>，相邻点为 <span class=\"katex-inline\">(7,6),(6,9),(9,0),(0,7)<\/span>。四点在正方形 <span class=\"katex-inline\">[0,9]^2<\/span> 内受同一递推约束，重复周期内不会出现其余 96 个格点。周期越短、参数越偏，点集在平面上的空缺越大；谱检验把这种空缺量化为线间距，而不是凭目视判断。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>只看二维投影<\/strong>。高维成摞在二维被摊开，检验放行；必须逐维更新间距，三维四维单独算。<\/p>\n<p><strong>把格密当唯一标准<\/strong>。谱检验强于结构判断，但样本层面的偶然偏斜仍要经验检验兜底；两类检验互补。<\/p>\n<p><strong>参数改动后只重算低维<\/strong>。<span class=\"katex-inline\">m,a,c<\/span> 任一改变，格方向与间距全变；只更新二维结果，高维缺陷漏掉。<\/p>\n<p><strong>对非线性发生器硬套格视角<\/strong>。谱检验的直线平面结构来自线性同余递推；非线性发生器的结构约束不同，度量方式要相应改造。<\/p>\n<h2>延伸推演：为什么谱检验被称为最强检验<\/h2>\n<p>书 §3.3.4 指出，好生成器能通过谱检验，已知坏生成器实际上都通不过。原因在于它直接利用全周期递推规则，不依赖抽样运气：经验检验抽到哪段算哪段，样本偏差可能偶然不显著；谱检验把规则的几何后果整体算出，坏结构藏不住。它兼有理论检验的全周期性质与经验检验的程序计算，两类特点合一。<\/p>\n<h2>延伸推演：格视角与其他结构分析<\/h2>\n<p>把点集看成规则格、再量覆盖疏密，这一思路在别处也出现：多项式卷积按系数位置排列，快速乘法分析系数结构；大整数乘法分治同样考察数位块的排列。谱检验是&quot;几何结构度量&quot;在随机数领域的典型用法。<\/p>\n<h2>延伸一层：格的几何描述从二维到高维<\/h2>\n<p>二维是平行直线族，三维是平行平面族，<span class=\"katex-inline\">d<\/span> 维是平行超平面族。线性递推每增加一维相邻关系，约束多一条，点被压在更低维的规则结构上。谱检验在每个维度计算覆盖全部点的最密面族间距：间距度量的是垂直于面方向上点与点之间的空白宽度。维数升高，计算量增长，但暴露的约束也更多；低维间距合格只说明该维方向上没有成摞，不代表高维约束消失。<\/p>\n<h2>数值算例：等差序列的格退化<\/h2>\n<p><span class=\"katex-inline\">a=1<\/span> 时 <span class=\"katex-inline\">X_n=X_0+nc\\bmod m<\/span>，相邻点满足 <span class=\"katex-inline\">X_{n+1}-X_n=c<\/span>，二维点落在斜率为 1 的平行直线上，线间距由步长 <span class=\"katex-inline\">c<\/span> 决定。步长与模互素时遍历全部点，但点沿直线等距排列，平面上其余方向全是空白；谱检验的线间距指标把这种直线性量化出来。周期满不改变格外露的事实，这与 c02 的辨析一致。<\/p>\n<h2>延伸推演：谱检验综合两类检验的原因<\/h2>\n<p>书 §3.3.4 指出谱检验兼有理论检验与经验检验的特点：它处理序列全周期性质，不需要抽样本猜统计量；同时间距指标要靠计算机程序在参数空间上搜索最密面族才能确定，不是纯解析式推导。理论部分来自递推规则的线性结构，计算部分来自格搜索程序，两者合一使它对坏生成器的识别力高于单一抽样统计。<\/p>\n<h2>对照辨析：格间距与周期长度<\/h2>\n<p>周期短是很快回到起点，一轮内点数少；格间距大是一轮内点成摞、方向留白。两者可独立出现：长周期等差序列格间距大但周期满；短周期序列点少，格结构谈不上疏密。谱检验量的是排列疏密，不是循环长度，验收时两个指标分别看。<\/p>\n<h2>失败案例补充：只优化低维指标<\/h2>\n<p>有些发生器专门调整乘数让二维投影均匀，二维线间距好看，但三维、四维平面约束仍明显。逐维检验时不能只交二维结果；高维间距指标才暴露深层线性约束。反过来，高维合格也不回头保证二维，低维投影可能因折叠出现局部聚集。<\/p>\n<h2>再推一层：格度量思路的通用化<\/h2>\n<p>把对象看成规则格点再量覆盖疏密，是结构分析的通用套路：多项式系数按幂次排列后看卷积结构，大整数数位块看分治排列，谱检验则把随机序列看成高维格点。共同点是不抽样本猜性质，而是先找规则结构，再度量规则留下的空白宽度。这一视角在 c10 快速乘法与 c12 多项式卷积分析中反复出现。<\/p>\n<h2>补充推演：格间距指标的方向一致性<\/h2>\n<p>平行面族有法线方向；间距沿法线度量。同一组点在平行方向上无间距概念，空白只出现在垂直于面的方向。谱检验为每个候选方向算面间距，取最密覆盖下的指标；方向找错，间距量出来偏大或偏小。低维直线的法线是平面方向，高维超平面的法线是向量方向，几何对象随维数变化，但&quot;垂直方向量空白宽度&quot;的口径一致。<\/p>\n<h2>补充算例：二维格的疏密对照<\/h2>\n<p>两组二维点：一组均匀铺满正方形，相邻平行线间距小；一组沿斜率 1 的直线等距排列，线间空白宽。前者格密，后者格疏。周期长度可以相同，差别只在点在面上的排列方向。谱检验把&quot;看着散不散&quot;变成可计算的间距数，避免人眼在低分辨率投影上误判。<\/p>\n<h2>补充辨析：结构检验与抽样检验的证据强度<\/h2>\n<p>谱检验依据全周期递推规则，证据覆盖整个发生器；经验检验依据样本段，证据只覆盖抽到的部分。坏发生器的规则缺陷在全周期都存在，谱检验必然捕捉；样本检验可能恰好抽到不明显的一段放行。这是书里称谱检验最强的原因：它不依赖抽样运气。<\/p>\n<h2>失败案例补充：递推非线性后硬套格模型<\/h2>\n<p>非线性发生器的点不落在线性平行面上，格间距模型失效；此时要换对应结构的检验工具。把线性同余的格结论推广到任意随机源，属于模型错位。检验工具与发生器类型必须匹配。<\/p>\n<h2>补充一层：谱检验在参数筛选中的位置<\/h2>\n<p>发生器选型流程：周期条件（c02、c03）过关后，谱检验筛高维格疏密；经验检验兜底样本偏斜。谱检验指标差的参数，周期再长也不选用；指标好的再送样本检验复核。格结构是线性同余发生器的内禀性质，比样本统计更接近发生器本质。<\/p>\n<h2>补充推演：高维约束的叠加方式<\/h2>\n<p>二维受一条递推约束，三维受两条，<span class=\"katex-inline\">d<\/span> 维受 <span class=\"katex-inline\">d-1<\/span> 条；每加一维相邻关系，点被压进更低维的规则面。约束叠加不是简单复制二维直线，而是在高维空间形成超平面族。谱检验逐维算间距，某一维间距突变，说明该维方向上线性约束最强。低维合格不向高维传递，每一维单独出指标。<\/p>\n<h2>补充算例：坏发生器的格特征<\/h2>\n<p>乘数选择不当时，二维投影可能看着均匀，三维点挤在少数几张平面上；谱检验三维间距偏大。这类缺陷在样本检验里要抽到三元组才暴露，样本段短则漏过。谱检验直接按递推规则算全周期格结构，不依赖三元组样本量。<\/p>\n<h2>补充辨析：格密与样本均匀<\/h2>\n<p>格密是全周期结构性质，样本均匀是抽样表现；前者由规则决定，后者带随机波动。谱检验指标差的发生器，样本偶尔也能抽得均匀；指标好的发生器，短样本可能偶然偏斜。两层结论分别记录，不互相替代。<\/p>\n<h2>补充一层：谱检验与其他结构分析的共性<\/h2>\n<p>先找规则结构（直线、平面、系数排列），再度量规则留下的空白宽度；这一视角在多项式卷积、数位块分治中重复出现。谱检验是该思路在随机数领域的典型：不抽样本猜性质，而是把递推规则的几何后果算成间距指标。<\/p>\n<h2>补充一层：谱检验的逐维出报告<\/h2>\n<p>二维、三维、四维间距指标分别列出，某一维突变单独标注；低维合格不向高维传递。报告口径与经验检验分层陈列一致，结构缺陷定位到具体维度，便于回头查乘数与模数在该方向的约束。<\/p>\n<h2>补充一层：坏发生器的典型格形<\/h2>\n<p>乘数不当时，二维点沿少数直线排开，三维点压在少数平面上；周期可以很长，但规则方向留白宽。谱检验把这种留白量化成间距指标，指标超阈值即淘汰，不依赖人眼在投影上找模式。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出二维相邻点满足的直线关系，说明取模怎样把直线变成平行直线族。\n<\/li><li>\n三维点受几条递推约束？落在什么几何结构上？\n<\/li><li>\n格间距大为什么对应发生器缺陷？间距小说明什么？\n<\/li><li>\n为什么低维合格不能推出高维合格？\n<\/li><li>\n谱检验与卡方类经验检验在数据来源上有什么根本差别？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "谱检验：相邻随机数的格结构与发生器质量判断"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷2 半数值算法.pdf · p.101<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">线性同余发生器：递推式、均匀偏差与序列循环<\/a><\/span><\/div><h1>从均匀偏差到其他分布：数值分布、随机抽样与洗牌<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch02（原书 §3.4，PDF 第 101 页起）\n<\/ul>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>生成器先造出 0 与 1 之间均匀分布的 <span class=\"katex-inline\">U<\/span>，但仿真等待时间要指数分布，离散事件按概率 <span class=\"katex-inline\">p_1,\\dots,p_k<\/span> 发生，抽样要从 <span class=\"katex-inline\">n<\/span> 个对象里选 <span class=\"katex-inline\">k<\/span> 个，排队与调度要随机排列。困难在于：底层只有均匀偏差一种原料，其他分布与随机对象都要由它构造；变换路线选错，底层均匀性会被扭曲成目标分布的偏斜。本节梳理从均匀整数、加权离散分布到连续分布，再到抽样与洗牌的基本构造。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>均匀偏差<\/strong>：0 与 1 之间均匀分布的随机实数 <span class=\"katex-inline\">U<\/span>；其他随机量大多由它变换得到。<\/p>\n<p><strong>有限随机整数<\/strong>：要 0 到 <span class=\"katex-inline\">k-1<\/span> 的整数，令 <span class=\"katex-inline\">X=\\lfloor kU\\rfloor<\/span>。计算机字长有限带来一点误差；<span class=\"katex-inline\">k<\/span> 很小（如 <span class=\"katex-inline\">k/m&lt;1/10000<\/span>）时误差可忽略。<\/p>\n<p><strong>加权离散分布<\/strong>：取值 <span class=\"katex-inline\">x_1,\\dots,x_k<\/span>，概率 <span class=\"katex-inline\">p_1,\\dots,p_k<\/span>，<span class=\"katex-inline\">p_1+\\cdots+p_k=1<\/span>。累计分段 <span class=\"katex-inline\">P_j=p_1+\\cdots+p_j<\/span>：<span class=\"katex-inline\">P_{j-1}\\le U&lt;P_j<\/span> 时取 <span class=\"katex-inline\">x_j<\/span>。<\/p>\n<p><strong>连续分布方向<\/strong>：按分布函数的逆变换，或舍选法（先生成候选，再按接受概率保留）得到指定连续分布的偏差。<\/p>\n<p><strong>随机抽样与洗牌<\/strong>：从 <span class=\"katex-inline\">n<\/span> 个对象的安排中取随机排列（洗牌），或从中随机选 <span class=\"katex-inline\">k<\/span> 个（组合抽样）。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">k=7<\/span> 时 <span class=\"katex-inline\">\\lfloor 7U\\rfloor<\/span> 给出 0 到 6 的整数；权重对半的两类，<span class=\"katex-inline\">U&lt;0.5<\/span> 取第一类，否则取第二类。<\/p>\n<p><strong>反例<\/strong>：把 <span class=\"katex-inline\">U<\/span> 直接乘目标区间宽度后不加取整，得到的是连续值而不是离散整数；分段边界累计概率算错，对应概率被重新分配，分布失真。<\/p>\n<h2>原理推导：离散变换为什么保持概率<\/h2>\n<p>把 <span class=\"katex-inline\">[0,1)<\/span> 按 <span class=\"katex-inline\">p_1,\\dots,p_k<\/span> 切成相邻区间，第 <span class=\"katex-inline\">j<\/span> 段长度恰为 <span class=\"katex-inline\">p_j<\/span>。<span class=\"katex-inline\">U<\/span> 均匀，落入第 <span class=\"katex-inline\">j<\/span> 段的概率等于段长 <span class=\"katex-inline\">p_j<\/span>；映射到 <span class=\"katex-inline\">x_j<\/span> 后，取 <span class=\"katex-inline\">x_j<\/span> 的概率就是 <span class=\"katex-inline\">p_j<\/span>。分段边界严格按累计概率 <span class=\"katex-inline\">P_j<\/span> 排列，段长不重不漏，概率守恒。<\/p>\n<p>整数方向：<span class=\"katex-inline\">kU<\/span> 在 <span class=\"katex-inline\">[0,k)<\/span> 均匀展开，向下取整把它分成 <span class=\"katex-inline\">k<\/span> 个等长单位区间，每段对应一个整数；字长有限使各区间宽度略有不齐，<span class=\"katex-inline\">k<\/span> 相对字长很小时不齐可忽略。<\/p>\n<p>抽样洗牌的不变量：每个合法子集（或排列）被选中的概率相等；算法用均匀 <span class=\"katex-inline\">U<\/span> 决定交换位置或入选资格，<span class=\"katex-inline\">U<\/span> 的均匀性传递到最终对象。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：已有合格的均匀偏差；目标分布的分段概率或分布函数已知。\n<\/li><li>\n失败案例 1：底层 <span class=\"katex-inline\">U<\/span> 不均匀，分段映射把偏斜放大到各取值概率上；原料不合格，变换不补救。\n<\/li><li>\n失败案例 2：分段用未经累计的原始权重直接比大小，权重未归一，边界错位。\n<\/li><li>\n失败案例 3：洗牌时只随机交换几次位置，未遍历所有排列，部分排列概率为零；抽样未保证每个子集等概率。\n<\/li><li>\n边界：逆变换要求分布函数可逆；不可逆或无显式逆时走舍选法，接受率影响效率。\n<\/ul>\n<p><strong>抽样与洗牌的等概率口径<\/strong>：洗牌要让 <span class=\"katex-inline\">n!<\/span> 个排列各自概率相等，算法用均匀 <span class=\"katex-inline\">U<\/span> 决定每一步与哪个位置交换，交换位置的选择范围随步长收窄；组合抽样要让 <span class=\"katex-inline\">\\binom{n}{k}<\/span> 个子集各自概率相等，逐个决定每个对象入选或排除时，候选范围与剩余名额保持对应。两种算法都把 <span class=\"katex-inline\">U<\/span> 的均匀性传递到最终对象，中途若固定几次交换、或候选范围算错，部分排列或子集概率为零，等概率口径就被破坏。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>均匀整数 vs 均匀连续值<\/strong>：<span class=\"katex-inline\">\\lfloor kU\\rfloor<\/span> 离散取整，<span class=\"katex-inline\">kU<\/span> 是连续值；两步不能混。\n<\/li><li>\n<strong>分段映射 vs 直接缩放<\/strong>：加权分布按累计概率切段，不是把取值范围按数值大小等距切开。\n<\/li><li>\n<strong>抽样 vs 洗牌<\/strong>：抽样产出无序子集，洗牌产出全排列；两者等概率口径不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 均匀偏差生成、c04/c05 检验原料质量。后继：第 4 章多精度算术（c09）为随机数落地到机器字长提供运算支撑；c11 最大公因数与约分是分数表示的工具。均匀偏差是随机数主线通往仿真、抽样实践的出口。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（从均匀偏差到其他分布：数值分布、随机抽样与洗牌）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：均匀偏差变换的概率守恒、抽样洗牌的等概率推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>分布变换往回追四层：<\/p>\n<ol><li>\n<strong>合格均匀原料<\/strong>：<span class=\"katex-inline\">U<\/span> 在 <span class=\"katex-inline\">[0,1)<\/span> 均匀，由通过检验的发生器产出（c01、c04、c05）。\n<\/li><li>\n<strong>区间分段<\/strong>：按目标概率把 <span class=\"katex-inline\">[0,1)<\/span> 切成相邻段，段长等于目标概率。\n<\/li><li>\n<strong>映射规则<\/strong>：<span class=\"katex-inline\">U<\/span> 落在哪段就取对应取值，概率由段长守恒传递。\n<\/li><li>\n<strong>抽样对象<\/strong>：随机排列、随机子集把均匀性传递到对象选择上。\n<\/ol>\n<p>依赖链方向：均匀 <span class=\"katex-inline\">U<\/span> → 概率分段 → 离散/连续分布 → 等概率抽样与洗牌。<\/p>\n<h2>正向推导：离散分段为什么保持概率<\/h2>\n<p>设取值 <span class=\"katex-inline\">x_1,\\dots,x_k<\/span>，概率 <span class=\"katex-inline\">p_1,\\dots,p_k<\/span>，<span class=\"katex-inline\">p_1+\\cdots+p_k=1<\/span>。累计边界 <span class=\"katex-inline\">P_j=p_1+\\cdots+p_j<\/span>，约定 <span class=\"katex-inline\">P_0=0<\/span>。区间划分：<span class=\"katex-inline\">P_{j-1}\\le U&lt;P_j<\/span> 时取 <span class=\"katex-inline\">x_j<\/span>。<\/p>\n<ol><li>\n第 <span class=\"katex-inline\">j<\/span> 段长度 <span class=\"katex-inline\">P_j-P_{j-1}=p_j<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">U<\/span> 均匀，落入某段的概率等于段长。\n<\/li><li>\n映射后取 <span class=\"katex-inline\">x_j<\/span> 的概率即段长 <span class=\"katex-inline\">p_j<\/span>，概率不重不漏。\n<\/ol>\n<p>分段边界必须按累计概率排列；若用未归一的原始权重直接比大小，段长错位，概率被重新分配。<\/p>\n<h2>数值算例一：有限随机整数<\/h2>\n<p><span class=\"katex-inline\">k=7<\/span>，令 <span class=\"katex-inline\">X=\\lfloor 7U\\rfloor<\/span>。<span class=\"katex-inline\">7U<\/span> 在 <span class=\"katex-inline\">[0,7)<\/span> 均匀展开，向下取整分成 7 个单位区间，<span class=\"katex-inline\">X<\/span> 取 0 到 6。字长有限使各区间宽度略有不齐；<span class=\"katex-inline\">k<\/span> 相对机器字长很小时（如 <span class=\"katex-inline\">k/m&lt;1/10000<\/span>），不齐可忽略。<\/p>\n<h2>数值算例二：加权两类分布<\/h2>\n<p><span class=\"katex-inline\">x_1<\/span> 概率 0.3，<span class=\"katex-inline\">x_2<\/span> 概率 0.7。累计边界 <span class=\"katex-inline\">P_1=0.3<\/span>：<span class=\"katex-inline\">U&lt;0.3<\/span> 取 <span class=\"katex-inline\">x_1<\/span>，否则取 <span class=\"katex-inline\">x_2<\/span>。核验段长：第一段 0.3，第二段 <span class=\"katex-inline\">1-0.3=0.7<\/span>，与目标概率一致。推广到 <span class=\"katex-inline\">k<\/span> 类，边界依次累加 <span class=\"katex-inline\">p_j<\/span>。<\/p>\n<h2>正向推演：抽样与洗牌的等概率口径<\/h2>\n<p><strong>洗牌<\/strong>：<span class=\"katex-inline\">n<\/span> 个对象的排列共 <span class=\"katex-inline\">n!<\/span> 种。算法逐步用 <span class=\"katex-inline\">U<\/span> 决定当前位置与哪个候选交换，候选范围随步长收窄；每一步选择概率与剩余候选数对应，最终每个排列概率相等。若固定只交换几次，部分排列概率为零，等概率口径破坏。<\/p>\n<p><strong>组合抽样<\/strong>：从 <span class=\"katex-inline\">n<\/span> 个对象选 <span class=\"katex-inline\">k<\/span> 个，子集共 <span class=\"katex-inline\">\\binom nk<\/span> 个。逐个决定对象入选或排除时，候选范围与剩余名额对应；每个合法子集被选中的概率相等。候选范围算错，某些子集永远选不到。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>原料不均匀<\/strong>。底层 <span class=\"katex-inline\">U<\/span> 偏向某一侧，分段映射把偏斜放大到各取值概率；变换不补救原料缺陷，必须先过检验。<\/p>\n<p><strong>权重未累计<\/strong>。直接拿原始权重比大小，边界不是累计概率，段长与目标概率不符；归一化与累计两步不能省。<\/p>\n<p><strong>洗牌次数不足<\/strong>。只随机交换两三轮，远未遍历 <span class=\"katex-inline\">n!<\/span> 个排列；低概率排列实际概率为零。<\/p>\n<p><strong>连续分布无显式逆变换<\/strong>。分布函数不可逆时走舍选法：生成候选再按接受概率保留，接受率影响效率；硬套逆变换公式会找不到解析式。<\/p>\n<h2>延伸推演：连续分布的变换方向<\/h2>\n<p>若分布函数 <span class=\"katex-inline\">F<\/span> 可逆，<span class=\"katex-inline\">X=F^{-1}(U)<\/span> 把均匀偏差变换到该分布；不可逆或无显式逆时，用舍选法在包络曲线内接受候选。两类方法都以 <span class=\"katex-inline\">U<\/span> 均匀为前提，分段思想在连续情形变成面积比例：接受区域面积占包络面积的比例即接受概率。<\/p>\n<h2>延伸一层：离散整数的取整方向<\/h2>\n<p><span class=\"katex-inline\">X=\\lfloor kU\\rfloor<\/span> 向下取整。若改用四舍五入或截断高位，各整数对应的区间宽度不齐，概率分配偏离均匀。向下取整把 <span class=\"katex-inline\">[0,k)<\/span> 切成 <span class=\"katex-inline\">k<\/span> 个等长单位区间，口径最干净。字长有限使 <span class=\"katex-inline\">kU<\/span> 不能精确落在分界上时，边界附近存在微小误差；<span class=\"katex-inline\">k<\/span> 相对字长很小时误差可忽略，<span class=\"katex-inline\">k<\/span> 接近字长时要检测边界落点。<\/p>\n<h2>数值算例三：加权三类分布<\/h2>\n<p>取值 <span class=\"katex-inline\">x_1,x_2,x_3<\/span>，概率 <span class=\"katex-inline\">0.2,0.3,0.5<\/span>。累计边界 <span class=\"katex-inline\">P_1=0.2<\/span>，<span class=\"katex-inline\">P_2=0.5<\/span>：<span class=\"katex-inline\">U&lt;0.2<\/span> 取 <span class=\"katex-inline\">x_1<\/span>，<span class=\"katex-inline\">0.2\\le U&lt;0.5<\/span> 取 <span class=\"katex-inline\">x_2<\/span>，<span class=\"katex-inline\">U\\ge0.5<\/span> 取 <span class=\"katex-inline\">x_3<\/span>。段长分别 0.2、0.3、0.5，与目标概率一致。若权重先不累计而直接拿 <span class=\"katex-inline\">0.2,0.3,0.5<\/span> 比大小，边界位置错动，三段长度不再对应原概率。<\/p>\n<h2>延伸推演：连续分布的面积比例<\/h2>\n<p>逆变换 <span class=\"katex-inline\">X=F^{-1}(U)<\/span> 成立的条件是分布函数 <span class=\"katex-inline\">F<\/span> 可逆；不可逆时用舍选法：在包络曲线内生成候选，按曲线面积比例接受。接受区域面积占包络面积的比例即接受率，接受率太低则采样效率差。两类方法都以 <span class=\"katex-inline\">U<\/span> 均匀为前提；原料偏向哪一侧，变换后的分布就在哪一侧变形。<\/p>\n<h2>对照辨析：抽样对象与抽样顺序<\/h2>\n<p>洗牌产出全排列，每个排列等概率；组合抽样产出无序子集，每个子集等概率。两者候选空间不同：<span class=\"katex-inline\">n!<\/span> 对 <span class=\"katex-inline\">\\binom nk<\/span>。算法上洗牌逐步交换位置，组合抽样逐步决定入选排除；把洗牌算法当成子集抽样用，会得到带次序的结果，口径错位。<\/p>\n<h2>失败案例补充：候选范围与剩余名额脱钩<\/h2>\n<p>组合抽样到后半程，剩余名额小于剩余候选时，必须强制入选或排除；若仍按原始概率随机决定，部分子集概率为零。洗牌到最后一步候选只剩一个，交换位置退化为固定动作。等概率口径要求候选范围随步长收窄，与剩余名额同步更新。<\/p>\n<h2>再推一层：变换链路的误差传递<\/h2>\n<p>均匀偏差是原料，分段、取整、舍选每一步都引入离散化误差；底层 <span class=\"katex-inline\">U<\/span> 的偏差经过多级变换被放大。链路越长，越要在中间环节保留精度，不能假定每步变换都把误差抹平。随机数落地到机器字长后的表示约束，与 c08 浮点舍入、c09 多精度数位串属于同一类有限表示问题。<\/p>\n<h2>补充推演：分段映射的概率守恒证明<\/h2>\n<p>设第 <span class=\"katex-inline\">j<\/span> 段 <span class=\"katex-inline\">[P_{j-1},P_j)<\/span> 长度 <span class=\"katex-inline\">p_j<\/span>。<span class=\"katex-inline\">U<\/span> 在 <span class=\"katex-inline\">[0,1)<\/span> 均匀，落入区间概率等于区间长度；映射 <span class=\"katex-inline\">U\\mapsto x_j<\/span> 后，取 <span class=\"katex-inline\">x_j<\/span> 的概率即 <span class=\"katex-inline\">p_j<\/span>。段与段相邻不重叠，<span class=\"katex-inline\">P_k=\\sum_{j\\le k}p_j<\/span> 累计到 1，全部段覆盖 <span class=\"katex-inline\">[0,1)<\/span>。概率在映射前后守恒：没有段被重复计数，也没有区间漏掉。这一守恒是离散分布变换成立的根据，换非均匀 <span class=\"katex-inline\">U<\/span> 则段长概率不再对应目标分布。<\/p>\n<h2>补充算例：指数分布的逆变换方向<\/h2>\n<p>指数分布密度 <span class=\"katex-inline\">\\lambda e^{-\\lambda x}<\/span>，分布函数 <span class=\"katex-inline\">F(x)=1-e^{-\\lambda x}<\/span>，逆变换 <span class=\"katex-inline\">X=-\\ln(1-U)/\\lambda<\/span>。<span class=\"katex-inline\">1-U<\/span> 仍均匀，可写作 <span class=\"katex-inline\">-\\ln U/\\lambda<\/span>。这是连续分布变换的标准路线：先求分布函数，再反解 <span class=\"katex-inline\">x<\/span>。逆函数不存在或无解析式时，才退回舍选法；路线选择由分布函数形状决定，不是随意挑一种。<\/p>\n<h2>补充辨析：等概率抽样与加权抽样<\/h2>\n<p>组合抽样默认每个子集等概率；加权抽样按指定权重选对象。两套口径分段方式不同：等概率按候选名额均分，加权按权重累计切段。把加权权重塞进等概率抽样算法，选出来的子集不符合任一目标分布。先明确抽样目标是均匀还是加权，再选分段规则。<\/p>\n<h2>失败案例补充：边界点归属重复或遗漏<\/h2>\n<p>分段边界 <span class=\"katex-inline\">P_j<\/span> 上的 <span class=\"katex-inline\">U<\/span> 归属必须固定一侧（约定左闭右开）；两侧都归或都不归，边界点概率重复计数或漏掉。连续 <span class=\"katex-inline\">U<\/span> 取到精确边界的概率为零，但离散化机器表示下边界落点可能出现，归属规则仍要写死。<\/p>\n<h2>补充一层：变换链路与机器精度<\/h2>\n<p><span class=\"katex-inline\">U<\/span> 本身是机器字长内的离散点，分段边界、取整、舍选都在有限精度内进行；链路越长，离散化误差累积越多。中间结果保留精度，不到最后一步不截断。这与 c08 浮点舍入、c09 数位串有限表示属于同一类边界：连续对象在机器上都是有限点集，精度由点数与保留位数决定。<\/p>\n<h2>补充算例：有限随机整数的边界误差<\/h2>\n<p><span class=\"katex-inline\">k=7<\/span>，字长模 <span class=\"katex-inline\">m=16<\/span>，<span class=\"katex-inline\">X=\\lfloor7U\\rfloor<\/span>。<span class=\"katex-inline\">7U<\/span> 的单位区间在 16 点网格上宽度不齐，边界附近落点有微小偏差；<span class=\"katex-inline\">k<\/span> 接近字长时偏差放大，需要边界检测。<span class=\"katex-inline\">k/m&lt;1/10000<\/span> 方向误差可忽略，这是书 §3.4.1 给出的经验口径。<\/p>\n<h2>补充辨析：逆变换与舍选法选择<\/h2>\n<p>分布函数可逆且有解析式走逆变换；不可逆、无解析式或包络简单时走舍选。接受率低则效率差。两种方法都以均匀 <span class=\"katex-inline\">U<\/span> 为原料，原料偏斜会进入目标分布。选择路线看分布函数形状，不看计算偏好。<\/p>\n<h2>补充一层：抽样算法的等概率复核<\/h2>\n<p>洗牌与子集抽样完成后，复核候选空间覆盖：<span class=\"katex-inline\">n!<\/span> 个排列或 <span class=\"katex-inline\">\\binom nk<\/span> 个子集是否都有非零概率。中途固定交换、候选范围不随名额收窄，都会使部分对象概率为零。等概率口径在算法每一步都要成立，不只在最终结果。<\/p>\n<h2>补充一层：变换后的复核<\/h2>\n<p>分布变换完成后，抽样本复核目标分布：离散取值概率贴不贴权重，连续分布分位数是否落在区间内。复核不通过先查原料均匀性，再查分段边界与归属规则，不把变换误差记到随机源头上。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出累计分段规则，说明第 <span class=\"katex-inline\">j<\/span> 段长度为什么等于 <span class=\"katex-inline\">p_j<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">X=\\lfloor kU\\rfloor<\/span> 给出什么范围的整数？字长有限带来的误差何时可忽略？\n<\/li><li>\n加权分布中边界为什么必须按累计概率排列？\n<\/li><li>\n洗牌与组合抽样各自要保证什么等概率口径？交换次数不足会怎样？\n<\/li><li>\n为什么原料不均匀时，后续变换会把偏斜放大而不是修正？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "从均匀偏差到其他分布：数值分布、随机抽样与洗牌"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷2 半数值算法.pdf · p.158<\/div><h1>按位记数系统与进制转换<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch03（原书 §4.1、§4.4，PDF 第 158 页起）\n<\/ul>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>算术运算先要有数的表示。同一数值在不同基数下写法不同：人用十进制，机器用二进制，压缩表示常用八进制、十六进制。困难在于：怎样一套统一规则说明&quot;一串数位代表什么数&quot;，以及同一数值在两种基数之间怎样无歧义换算。按位记数法（positional number system）给出这套规则：数位的值不仅看数字本身，还看它所在的位置；位置对应基数的幂次。进制转换则是这套规则在两种基数之间的互译。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>基数 <span class=\"katex-inline\">b<\/span><\/strong>：大于 1 的整数。<span class=\"katex-inline\">b=10<\/span> 十进制，<span class=\"katex-inline\">b=2<\/span> 二进制，<span class=\"katex-inline\">b=8<\/span> 八进制，<span class=\"katex-inline\">b=16<\/span> 十六进制。<\/p>\n<p><strong>展开式<\/strong>（书 §4.1 式 (1)，PDF 第 158 页）：<\/p>\n<div class=\"katex-block\">(\\dots a_2a_1a_0.a_{-1}a_{-2}\\dots)_b=\\cdots+a_2b^2+a_1b+a_0+a_{-1}b^{-1}+a_{-2}b^{-2}+\\cdots<\/div>\n<p>每位数字满足 <span class=\"katex-inline\">0\\le a_k&lt;b<\/span>。<\/p>\n<p><strong>小数点<\/strong>：<span class=\"katex-inline\">a_0<\/span> 与 <span class=\"katex-inline\">a_{-1}<\/span> 之间的点；<span class=\"katex-inline\">b=10<\/span> 称十进制小数点，<span class=\"katex-inline\">b=2<\/span> 称二进制小数点。欧洲大陆常用逗号标记，英国历史上曾用位置略高的点。<\/p>\n<p><strong>整数转换<\/strong>：除基取余。反复除以 <span class=\"katex-inline\">b<\/span>，余数依次是最低位到最高位；商降到 0 为止。<\/p>\n<p><strong>小数转换<\/strong>：乘基取整。小数部分反复乘 <span class=\"katex-inline\">b<\/span>，每次取出整数位，依次是最高位到最低位；乘到余数为 0 或达到所需精度为止。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">13=1101_2<\/span>；<span class=\"katex-inline\">0.625=0.101_2<\/span>。<\/p>\n<p><strong>反例<\/strong>：数位 <span class=\"katex-inline\">a_k\\ge b<\/span> 违反该进制规则，比如二进制里写 2；同一小数在有限位内乘基除不尽时，硬写有限位会得到近似值。<\/p>\n<h2>原理推导：位置为什么对应幂次<\/h2>\n<p>展开式规定第 <span class=\"katex-inline\">k<\/span> 位的权重是 <span class=\"katex-inline\">b^k<\/span>。整数部分从右往左幂次升 <span class=\"katex-inline\">1<\/span>，小数部分从左往右幂次降 <span class=\"katex-inline\">1<\/span>。除基取余时，<span class=\"katex-inline\">N=bQ+r<\/span>，<span class=\"katex-inline\">r<\/span> 即 <span class=\"katex-inline\">b^0<\/span> 位数字；<span class=\"katex-inline\">Q<\/span> 再除 <span class=\"katex-inline\">b<\/span> 得到 <span class=\"katex-inline\">b^1<\/span> 位，依次递推。乘基取整时，小数 <span class=\"katex-inline\">f=\\sum a_{-j}b^{-j}<\/span>，乘 <span class=\"katex-inline\">b<\/span> 后整数位恰是 <span class=\"katex-inline\">a_{-1}<\/span>，余下部分退到下一位。两条路线都是展开式的直接推论。<\/p>\n<p>转换不变量：换算前后数值相等；数位范围 <span class=\"katex-inline\">0\\le a_k&lt;b<\/span> 在目标进制内重新满足。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：基数为大于 1 的整数；有限位转换或明确精度要求的无限小数转换。\n<\/li><li>\n失败案例 1：把十进制小数直接照搬数位到二进制，忽略乘基过程，得到错误位串。\n<\/li><li>\n失败案例 2：有限十进制小数在二进制下可能是无限循环小数，截断过早造成累积误差；这是浮点表示误差的来源之一（见 c08）。\n<\/li><li>\n边界：非整数基数（书 §4.1 提到 <span class=\"katex-inline\">b<\/span> 可取任意非零数的推广）规则不同，不能套整数进制的取余取整。\n<\/ul>\n<p><strong>换算中的精度边界<\/strong>：整数转换总能在有限步完成，因为除基取余最终商为 0；小数转换不一定终止——若小数在目标进制下是无限循环，乘基取整会无限进行，必须按精度要求截断或保留循环节。判断一个十进制有限小数能否在二进制有限位表示，看其最简分母是否只含因子 2；含其他因子时二进制表示循环。这一边界直接解释了 c08 中浮点尾数为什么存不下某些十进制小数，舍入误差从转换阶段就开始积累。八进制、十六进制与二进制之间则是分组对应：三位二进制对一位八进制，四位对一位十六进制，转换只做分组重排，不涉及数值近似。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>数位值 vs 位置值<\/strong>：单个数字 5 在个位与百位数值不同；按位记数的核心是位置权重，不是数字面值。\n<\/li><li>\n<strong>整数转换 vs 小数转换<\/strong>：整数除基取余从低位起，小数乘基取整从高位起；方向相反，不能混用。\n<\/li><li>\n<strong>进制只是表示<\/strong>：数值本身不变，进制改变不改变大小；同一数的两种写法等值。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：幂次、余数与整除概念。后继：c08 浮点记数在按位表示上加指数位；c09 多精度算术把数位串当运算对象；c12 多项式系数串与数位串结构相通。进制转换是第 4 章所有算术表示的入口。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（按位记数系统与进制转换）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：按位展开式、整数与小数转换的逐位推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>进制转换往回追四层：<\/p>\n<ol><li>\n<strong>数值与表示分离<\/strong>：同一数值在不同基数下写法不同，数值本身不变。\n<\/li><li>\n<strong>位置权重<\/strong>：第 <span class=\"katex-inline\">k<\/span> 位权重 <span class=\"katex-inline\">b^k<\/span>，数位范围 <span class=\"katex-inline\">0\\le a_k&lt;b<\/span>。\n<\/li><li>\n<strong>整数路线<\/strong>：除基取余，余数从低位到高位。\n<\/li><li>\n<strong>小数路线<\/strong>：乘基取整，整数位从高位到低位。\n<\/ol>\n<p>依赖链方向：数值等值 → 幂次权重 → 整数除基取余 → 小数乘基取整。<\/p>\n<h2>正向推导：展开式定权重<\/h2>\n<p><span class=\"katex-inline\">b<\/span> 进制数展开：<\/p>\n<div class=\"katex-block\">(\\dots a_2a_1a_0.a_{-1}a_{-2}\\dots)_b=\\sum_{k}a_kb^k<\/div>\n<p>整数部分 <span class=\"katex-inline\">k\\ge0<\/span>，小数部分 <span class=\"katex-inline\">k&lt;0<\/span>。每位 <span class=\"katex-inline\">a_k<\/span> 必须小于 <span class=\"katex-inline\">b<\/span>，否则该位进位到高一位。<\/p>\n<p><strong>整数除基取余<\/strong>。设 <span class=\"katex-inline\">N=bQ+r<\/span>，<span class=\"katex-inline\">0\\le r&lt;b<\/span>，则 <span class=\"katex-inline\">r<\/span> 是 <span class=\"katex-inline\">b^0<\/span> 位数字；<span class=\"katex-inline\">Q<\/span> 再除 <span class=\"katex-inline\">b<\/span> 得到 <span class=\"katex-inline\">b^1<\/span> 位，依次递推，商降到 0 结束。余数序列从 <span class=\"katex-inline\">b^0<\/span> 位读到最高位。<\/p>\n<p><strong>小数乘基取整<\/strong>。<span class=\"katex-inline\">f=\\sum_{j\\ge1}a_{-j}b^{-j}<\/span>，乘 <span class=\"katex-inline\">b<\/span> 后整数位恰为 <span class=\"katex-inline\">a_{-1}<\/span>，余下部分退到下一位；重复取整，整数位序列从 <span class=\"katex-inline\">b^{-1}<\/span> 位读到低位。<\/p>\n<h2>数值算例一：13 转二进制<\/h2>\n<p><span class=\"katex-inline\">13\\div2=6<\/span> 余 1；<span class=\"katex-inline\">6\\div2=3<\/span> 余 0；<span class=\"katex-inline\">3\\div2=1<\/span> 余 1；<span class=\"katex-inline\">1\\div2=0<\/span> 余 1。余数自下而上读 <span class=\"katex-inline\">1101_2<\/span>。核验：<span class=\"katex-inline\">1\\cdot2^3+1\\cdot2^2+0\\cdot2^1+1\\cdot2^0=8+4+1=13<\/span>。<\/p>\n<h2>数值算例二：0.625 转二进制<\/h2>\n<p><span class=\"katex-inline\">0.625\\cdot2=1.25<\/span> 取整 1；<span class=\"katex-inline\">0.25\\cdot2=0.5<\/span> 取整 0；<span class=\"katex-inline\">0.5\\cdot2=1.0<\/span> 取整 1，得 <span class=\"katex-inline\">0.101_2<\/span>。核验：<span class=\"katex-inline\">1\\cdot2^{-1}+0\\cdot2^{-2}+1\\cdot2^{-3}=0.5+0.125=0.625<\/span>。<\/p>\n<h2>数值算例三：二与八、十六的分组对应<\/h2>\n<p>三位二进制对一位八进制：<span class=\"katex-inline\">1101_2<\/span> 补足四位 <span class=\"katex-inline\">0001\\ 101<\/span>，按三位分组 <span class=\"katex-inline\">001\\ 101_2=15_8<\/span>。四位二进制对一位十六进制：<span class=\"katex-inline\">1101_2=\\mathrm{D}_{16}<\/span>。这类转换只做分组重排，不做数值近似；八进制、十六进制是二进制的压缩写法。<\/p>\n<h2>精度边界推演<\/h2>\n<p>整数转换必然终止，商最终为 0。小数转换可能无限：最简分母含除 2 以外的素因子时，二进制表示循环；乘基取整无限进行，必须按精度截断或记循环节。判断有限性：十进制有限小数最简分母只含因子 2、5，二进制有限表示要求分母只含因子 2；不满足即循环。这一边界是 c08 浮点尾数存不下某些十进制小数的根源之一。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>数位越界<\/strong>。二进制写数位 2，违反 <span class=\"katex-inline\">0\\le a_k&lt;2<\/span>；该位应进位，而不是保留非法数字。<\/p>\n<p><strong>整数小数路线混用<\/strong>。整数用乘基取整、小数用除基取余，方向反了，位串全错。<\/p>\n<p><strong>截断无限小数不标注误差<\/strong>。循环小数提前截断，得到近似值；后续运算把截断误差带下去，应在精度要求内记录舍入。<\/p>\n<h2>延伸推演：非整数基数<\/h2>\n<p>书 §4.1 提到 <span class=\"katex-inline\">b<\/span> 可取任意非零数的推广；此时数位权重不再是整数幂，取余取整规则不同，不能套整数进制的转换步骤。本书主体讨论整数基数，非整数基数只作边界提示。<\/p>\n<h2>延伸一层：数位范围与进位规则<\/h2>\n<p><span class=\"katex-inline\">b<\/span> 进制每位 <span class=\"katex-inline\">0\\le a_k&lt;b<\/span>；某位达到 <span class=\"katex-inline\">b<\/span> 必须进位，而不是保留非法数字。反过来借位时，高位借 1 当本位 <span class=\"katex-inline\">b<\/span>。这条规则在整数与小数部分一致：权重沿 <span class=\"katex-inline\">b<\/span> 的幂次升降，进位借位都按 <span class=\"katex-inline\">b<\/span> 折算。八进制每位 0–7，十六进制每位 0–15（字母 A–F 记 10–15），越界即进位。<\/p>\n<h2>数值算例四：十进制转八进制<\/h2>\n<p><span class=\"katex-inline\">13_{10}<\/span>：<span class=\"katex-inline\">13\\div8=1<\/span> 余 5，<span class=\"katex-inline\">1\\div8=0<\/span> 余 1，得 <span class=\"katex-inline\">15_8<\/span>。核验：<span class=\"katex-inline\">1\\cdot8+5=13<\/span>。小数方向同二进制：乘 8 取整，整数位从高到低。八进制与二进制三位一组对应，转换只重分组；十六进制四位一组，是机器位串的两种压缩写法。<\/p>\n<h2>延伸推演：有限性的分母判据<\/h2>\n<p>十进制有限小数最简分母只含因子 2、5；二进制有限表示要求分母只含因子 2。一个十进制有限小数能否在二进制有限位表示，约分后看分母：含因子 5 即二进制循环。循环节长度由分母与 2 的阶决定，截断必须标注精度。这一判据解释了为什么 <span class=\"katex-inline\">0.1<\/span> 在二进制浮点里是无限循环近似，尾数只能保留最近点。<\/p>\n<h2>对照辨析：数值不变性与写法变换<\/h2>\n<p>进制转换改变数位串，不改变数值；比较两个不同进制的数，先转到同一基数再比大小。常见错误是按字符串字典序比较，或把十进制位直接照抄到二进制。数值是实体，进制是表示层，两层分开才不会在转换中改错大小关系。<\/p>\n<h2>失败案例补充：无限小数提前截断不记误差<\/h2>\n<p>乘基取整遇到循环小数，截到指定位数得到近似值；若不记录截断位置与舍入方向，后续运算把近似当精确值使用，误差逐级累积。转换任务先定精度要求，再决定保留几位；整数转换无此问题，商必然降到 0。<\/p>\n<h2>再推一层：进位制与机器表示的衔接<\/h2>\n<p>按位记数是 c07 的底层，c08 浮点在数位上加指数位，c09 多精度把数位串拉长做竖式运算。同一套权重规则贯穿三层：数位权重 <span class=\"katex-inline\">b^k<\/span>、数位范围 <span class=\"katex-inline\">0\\le a_k&lt;b<\/span>、进位按 <span class=\"katex-inline\">b<\/span> 折算，先在整数转换里练熟，后面浮点与多精度直接沿用。<\/p>\n<h2>补充推演：权重式与数位串的对应<\/h2>\n<p>展开式 <span class=\"katex-inline\">\\sum a_kb^k<\/span> 中，<span class=\"katex-inline\">b^k<\/span> 是第 <span class=\"katex-inline\">k<\/span> 位权重，<span class=\"katex-inline\">a_k<\/span> 是该位系数。数位串从右往左幂次递增；小数点右侧幂次取负。转换本质是在两种权重表示之间平移系数：除基取余把整数系数从低幂次依次摘出，乘基取整把小数系数从高幂次依次摘出。理解权重位置，转换方向就不会记反。<\/p>\n<h2>补充算例：255 转十六进制<\/h2>\n<p><span class=\"katex-inline\">255\\div16=15<\/span> 余 15（F），<span class=\"katex-inline\">15\\div16=0<\/span> 余 15（F），得 <span class=\"katex-inline\">\\mathrm{FF}_{16}<\/span>。核验 <span class=\"katex-inline\">15\\cdot16+15=255<\/span>。二进制视角 <span class=\"katex-inline\">11111111_2<\/span>，四位一组 <span class=\"katex-inline\">1111\\ 1111=\\mathrm{FF}<\/span>。三位八进制、四位十六进制的分组规则，本质是把 <span class=\"katex-inline\">2<\/span> 的幂次重组成 <span class=\"katex-inline\">8<\/span>、<span class=\"katex-inline\">16<\/span> 的幂次，数值不变。<\/p>\n<h2>补充辨析：进制转换与数值比较<\/h2>\n<p>不同进制的数不能按字符串比较；先转到同一基数再比大小。整数大小先看位数（高位权重），同位数再逐位比。小数比较先对齐小数点位置，再按权重逐位比。把转换后的数位串按字典序排列，是把表示层顺序误当数值顺序。<\/p>\n<h2>失败案例补充：小数乘基不终止却硬写有限位<\/h2>\n<p>循环小数乘基取整无限进行，提前截断得到近似；不标注精度就当精确值继续运算，误差沿链路传递。有限性判据先于转换：分母只含目标基数素因子才有限，否则按精度截断并记录舍入。整数转换无此问题，商必然归零。<\/p>\n<h2>补充一层：记数系统在后续章节的接口<\/h2>\n<p>c08 浮点在数位上加指数位，c09 多精度把数位串拉长做竖式，c12 多项式把数位串换成系数串。权重 <span class=\"katex-inline\">b^k<\/span>、数位范围 <span class=\"katex-inline\">0\\le a_k&lt;b<\/span>、进位按 <span class=\"katex-inline\">b<\/span> 折算，三条规则贯穿后续三层。本节的整数与小数转换是练熟这套规则的入口，后面章节不再重述基础记数。<\/p>\n<h2>补充算例：小数 0.1 的二进制循环<\/h2>\n<p><span class=\"katex-inline\">0.1=1/10<\/span>，分母含因子 5，二进制不能有限表示。乘 2 取整循环出现，截断到指定位数得到最近近似；这正是 c08 浮点尾数存不下 0.1 的根源。判据先行：分母只含基数素因子才有限，含其他因子即循环，截断必须记精度。<\/p>\n<h2>补充辨析：分组转换与数值重算<\/h2>\n<p>二到八、十六进制是分组重排，不做数值近似；不同基数互转（十到二）要走除基乘基。分组规则只在 <span class=\"katex-inline\">2<\/span> 的幂次基数间成立，八与十六进制之间也要经二进制中转。<\/p>\n<h2>补充一层：转换中的精度标注<\/h2>\n<p>无限小数截断必须写明保留位数与舍入方向；整数转换结果天然精确。后续运算把近似当精确值使用，是误差累积的常见起点。换算任务先定精度要求，再决定小数保留几位，与 c08 浮点尾数保留位数的口径一致。<\/p>\n<h2>补充一层：基数选择的表示效率<\/h2>\n<p>基数越大，数位越短但数字符号越多；二进制机器实现最稳，十六进制是压缩写法。转换只改变表示长度与符号集，不改变数值。记数系统的选型在机器实现便利性与人读压缩之间权衡，与后续浮点指数、多精度数位串直接衔接。<\/p>\n<h2>补充一层：数位权重的复核方法<\/h2>\n<p>转换后回代展开式核验：每个数位乘回对应 <span class=\"katex-inline\">b^k<\/span> 求和，应等于原数。回代不等说明某一位摘错或幂次错位。整数除基、小数乘基的方向，用回代结果校验最直接。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">b<\/span> 进制展开式，说明数位取值范围。\n<\/li><li>\n手算 13 的二进制表示并核验。\n<\/li><li>\n手算 0.625 的二进制表示并核验。\n<\/li><li>\n为什么整数转换必然终止，小数转换可能无限？\n<\/li><li>\n二进制与八进制、十六进制之间为什么只需分组重排？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "按位记数系统与进制转换"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷2 半数值算法.pdf · p.174<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">按位记数系统与进制转换<\/a><\/span><\/div><h1>浮点表示、规范化与舍入误差界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch03（原书 §4.2.1–4.2.2，PDF 第 174 页起）\n<\/ul>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>定点表示假定小数点位置固定，表示极大或极小数时数位不够用：阿伏伽德罗常数量级 <span class=\"katex-inline\">10^{23}<\/span>、普朗克常量量级 <span class=\"katex-inline\">10^{-27}<\/span>，固定位数装不下。浮点记数让小数点随量级浮动：用指数部分记量级，小数部分记有效数字。困难随之而来：同一个数有多种写法，需要规范化钉住唯一形式；每次运算都要舍入，误差怎样产生、累积到什么程度，需要误差界说清。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>浮点数对 <span class=\"katex-inline\">(e,f)<\/span><\/strong>（书 §4.2.1 式 (1)，PDF 第 174 页）：数写成 <span class=\"katex-inline\">f\\times b^{e-q}<\/span>，<span class=\"katex-inline\">e<\/span> 是指定范围内的整数指数部分，<span class=\"katex-inline\">f<\/span> 是带符号小数部分；<span class=\"katex-inline\">q<\/span> 为超量（bias）参数。<\/p>\n<p><strong>取值约束<\/strong>：规定 <span class=\"katex-inline\">|f|&lt;1<\/span>；<span class=\"katex-inline\">f<\/span> 为 <span class=\"katex-inline\">p<\/span> 位数时 <span class=\"katex-inline\">b^p f<\/span> 是整数，即 <span class=\"katex-inline\">-b^p&lt;b^pf&lt;b^p<\/span>。<\/p>\n<p><strong>规范化<\/strong>：<span class=\"katex-inline\">f<\/span> 的最高位不含有效零，使同一数的表示唯一；尾数前导零占着精度位，规范化把它们挤掉。<\/p>\n<p><strong>指数部分与小数部分<\/strong>：<span class=\"katex-inline\">e<\/span> 记量级，<span class=\"katex-inline\">f<\/span> 记有效数字；书里提示&quot;尾数（mantissa）&quot;一词在对数中有不同含义，使用时注意混淆。<\/p>\n<p><strong>舍入<\/strong>：超出 <span class=\"katex-inline\">p<\/span> 位有效数字的部分按规则保留最近值；每次加减乘除都可能产生舍入。<\/p>\n<p><strong>正例<\/strong>：超量 50 的 8 位十进制数中，阿伏伽德罗常数写成 <span class=\"katex-inline\">(74,+0.60221400)<\/span> 方向，普朗克常量写成 <span class=\"katex-inline\">(24,+0.66261000)<\/span> 方向（书 §4.2.1 式 (3)，PDF 第 174 页）。<\/p>\n<p><strong>反例<\/strong>：<span class=\"katex-inline\">0.01\\times b^{e+1}<\/span> 与 <span class=\"katex-inline\">0.1\\times b^e<\/span> 未规范化时并存，相等判断与归零判断失去唯一标准。<\/p>\n<h2>原理推导：误差界怎样一步步界住<\/h2>\n<p>单步运算的相对误差可由舍入位数界住：<span class=\"katex-inline\">p<\/span> 位尾数保留后，舍入相对误差不超过与 <span class=\"katex-inline\">b^{-p}<\/span> 同阶的量。多步运算时，每步新舍入叠加到已有误差上；量级相近的数相加，小量级项的有效位被挤掉。结合律失效的根源在此：实数里 <span class=\"katex-inline\">(x+y)+z=x+(y+z)<\/span>，浮点中小数被大数&quot;吃掉&quot;的方向依赖加法次序，换次序结果不同。<\/p>\n<p>不变量：规范化表示唯一；误差界只在每次运算按既定舍入规则、尾数位数固定时成立。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：机器字长固定、尾数位数 <span class=\"katex-inline\">p<\/span> 固定；运算按标准舍入规则。\n<\/li><li>\n失败案例 1：不规范化，同一数多种写法，比较与归零判断出错。\n<\/li><li>\n失败案例 2：按实数结合律估算浮点误差，忽略加法次序，累积误差超出预计界。\n<\/li><li>\n失败案例 3：极端量级相除或相减（两个相近大数相减），有效位被抵消，相对误差骤增；这就是精度危险区。\n<\/li><li>\n边界：误差界是渐近方向的界，不保证每一步绝对误差都小于固定值；连续运算后误差可能放大。下溢使极小非零数归零，上溢使超大数无法表示，两种边界状态都要单独检测。\n<\/ul>\n<p><strong>单精度运算的基本步骤<\/strong>：两次浮点运算先对齐指数——把较小量级的尾数右移补到与较大指数一致，再做尾数加减；乘法则尾数相乘、指数相加后调整超量；每步结果重新规范化，挤掉前导零并检查上溢下溢。对齐阶段右移丢掉的低位不再找回，这是小量级被大量级吞掉的直接环节。误差界按尾数位数 <span class=\"katex-inline\">p<\/span> 估计：单步相对误差与 <span class=\"katex-inline\">b^{-p}<\/span> 同阶，连续运算时已有误差与新舍入叠加；两个相近大数相减时前导有效位抵消，剩余尾数的相对误差会明显放大，这一情形与乘法、加法的误差规律要分开记。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>浮点 vs 定点<\/strong>：定点小数点固定，量级范围受位数限制；浮点指数浮动，范围大但尾数有效位有限。\n<\/li><li>\n<strong>规范化 vs 截断前导零<\/strong>：规范化挤掉前导零换有效位，截断只是砍掉低位；目的与效果不同。\n<\/li><li>\n<strong>绝对误差 vs 相对误差<\/strong>：大数的绝对误差天然偏大，浮点精度通常用相对误差衡量；只看绝对误差会误判。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c07 按位记数与数位范围。后继：c09 多精度算术用拉长数位串缓解精度受限；c11 分数运算以精确有理数对照浮点近似；c06 均匀偏差落地为机器数时同样受这套表示约束。浮点误差是第 3 章随机数与第 4 章数值计算共享的底层议题。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（浮点表示、规范化与舍入误差界）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：浮点对结构、规范化、误差界与结合律失效<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>浮点表示往回追四层：<\/p>\n<ol><li>\n<strong>按位记数<\/strong>：数位权重与数位范围是一切表示的基础（c07）。\n<\/li><li>\n<strong>量级分离<\/strong>：极大极小值需要指数记量级、尾数记有效数字。\n<\/li><li>\n<strong>唯一写法<\/strong>：规范化挤掉前导零，同一数表示唯一。\n<\/li><li>\n<strong>舍入代价<\/strong>：固定尾数位数使每步运算带舍入，误差逐步累积。\n<\/ol>\n<p>依赖链方向：数位表示 → 指数尾数分离 → 规范化唯一化 → 舍入误差界 → 结合律失效。<\/p>\n<h2>正向推导：浮点对的结构<\/h2>\n<p>数写成 <span class=\"katex-inline\">f\\times b^{e-q}<\/span>，<span class=\"katex-inline\">e<\/span> 为指数部分，<span class=\"katex-inline\">f<\/span> 为带符号小数部分，<span class=\"katex-inline\">q<\/span> 为超量。约束 <span class=\"katex-inline\">|f|&lt;1<\/span>；<span class=\"katex-inline\">f<\/span> 为 <span class=\"katex-inline\">p<\/span> 位数时 <span class=\"katex-inline\">b^pf<\/span> 是整数，即 <span class=\"katex-inline\">-b^p&lt;b^pf&lt;b^p<\/span>。指数记量级，尾数记有效位；两者分开后，极大数靠指数放大，极小数靠负指数缩小。<\/p>\n<p><strong>规范化<\/strong>：<span class=\"katex-inline\">f<\/span> 的最高位不含有效零。若允许 <span class=\"katex-inline\">0.01\\times b^{e+1}<\/span> 与 <span class=\"katex-inline\">0.1\\times b^e<\/span> 并存，相等判断、归零判断都失去唯一标准；前导零还占着尾数精度位。规范化把表示钉成唯一形式。<\/p>\n<h2>正向推演：单步运算流程<\/h2>\n<p>两次浮点运算先对齐指数：较小量级的尾数右移，补到与较大指数一致，再做尾数加减；乘法尾数相乘、指数相加后调整超量；结果重新规范化，挤掉前导零并检查上溢下溢。右移丢掉的低位不再找回，这是小量级被大量级吞掉的直接环节。<\/p>\n<h2>误差界推演<\/h2>\n<p>尾数保留 <span class=\"katex-inline\">p<\/span> 位，单步舍入的相对误差与 <span class=\"katex-inline\">b^{-p}<\/span> 同阶：尾数位数越多，界越窄。多步运算时，已有误差与新舍入叠加；量级相近的数相加，小量级有效位被挤掉。两个相近大数相减，前导有效位抵消，剩余尾数相对误差骤增，这是精度危险区，与加减乘除的一般误差规律分开记。<\/p>\n<h2>数值算例：结合律失效方向<\/h2>\n<p>设 <span class=\"katex-inline\">x<\/span> 远大于 <span class=\"katex-inline\">y<\/span>，<span class=\"katex-inline\">y<\/span> 又远大于 <span class=\"katex-inline\">z<\/span>。先算 <span class=\"katex-inline\">(x+y)<\/span>：<span class=\"katex-inline\">y<\/span> 的低位在对齐时被 <span class=\"katex-inline\">x<\/span> 吞掉，结果约等于 <span class=\"katex-inline\">x<\/span>；再加 <span class=\"katex-inline\">z<\/span>，<span class=\"katex-inline\">z<\/span> 同样被吞。换序先算 <span class=\"katex-inline\">(y+z)<\/span>：<span class=\"katex-inline\">y,z<\/span> 量级相近，相加保留有效位，再并入 <span class=\"katex-inline\">x<\/span> 时 <span class=\"katex-inline\">y+z<\/span> 的部分低位仍可能被吞，但中间结果不同。实数里 <span class=\"katex-inline\">(x+y)+z=x+(y+z)<\/span>，浮点里加法次序影响结果，结合律不成立。按纸面结合律估算误差，实际换序后可能超界。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>不规范化<\/strong>：同一数多种写法，比较相等与归零判断出错；前导零浪费精度位。<\/p>\n<p><strong>假设结合律成立<\/strong>：把浮点当实数算术估算累积误差，忽略加法次序，危险区误差超出预计。<\/p>\n<p><strong>相近大数相减不检测<\/strong>：有效位抵消后相对误差放大，结果却被当成高精度值使用。<\/p>\n<p><strong>上下溢不检测<\/strong>：极小非零数下溢归零，超大数上溢无法表示；两种边界状态都要单独标记。<\/p>\n<h2>延伸推演：浮点与多精度的分工<\/h2>\n<p>浮点压尾数换表示范围，运算快但有舍入；多精度算术拉长数位串保留全部数位，精确但位数拉长后变慢（c09）。数值问题对精度敏感时用分数或多精度对照，范围极大时才依赖浮点。<\/p>\n<h2>延伸一层：指数、尾数与超量的分工<\/h2>\n<p><span class=\"katex-inline\">e<\/span> 是整数指数，记量级；<span class=\"katex-inline\">f<\/span> 是带符号小数，记有效数字；<span class=\"katex-inline\">q<\/span> 是超量，把指数偏移成非负编码。三者分工：指数负责范围，尾数负责精度，超量负责编码偏移。尾数位数 <span class=\"katex-inline\">p<\/span> 固定后，有效数字位数被钉死；指数可放大范围，但不增加尾数里的有效位。极大数靠指数撑开，尾数仍只有 <span class=\"katex-inline\">p<\/span> 位，相对精度不变。<\/p>\n<h2>数值算例：规范化前后对照<\/h2>\n<p>同一数值若写成 <span class=\"katex-inline\">0.01\\times b^{e+1}<\/span>，前导两个零占着尾数位；规范化挤成 <span class=\"katex-inline\">0.1\\times b^e<\/span>，前导零让位给有效数字。未规范化时，<span class=\"katex-inline\">0.1\\times b^e<\/span> 与 <span class=\"katex-inline\">0.01\\times b^{e+1}<\/span> 并存，判等要额外判指数补偿；归零判断也会把尾数非零但指数极小的数漏判。规范化把表示唯一化，比较与归零才能走统一规则。<\/p>\n<h2>延伸推演：误差界的累积方向<\/h2>\n<p>单步相对误差与 <span class=\"katex-inline\">b^{-p}<\/span> 同阶；连续 <span class=\"katex-inline\">N<\/span> 步运算后，误差按步数累积，量级随运算次数增长。加法在量级悬殊时吞掉小项，乘法误差按相对误差叠加，相近数相减抵消前导有效位使相对误差骤增。三类情形误差机制不同，不能共用一个笼统界；危险区要单独检测有效位损失，而不是只看绝对误差大小。<\/p>\n<h2>对照辨析：浮点 vs 科学记数法<\/h2>\n<p>十进制科学记数法 <span class=\"katex-inline\">a\\times10^n<\/span> 是浮点思想的手写版本：一位整数加小数记有效位，指数记量级。机器浮点把这一格式固化成固定位数的指数尾数对，超量编码指数。差别在于手写可以随时补位，机器尾数位数固定，超出部分必须舍入。<\/p>\n<h2>失败案例补充：上溢下溢未标记<\/h2>\n<p>指数超出编码范围，极大数上溢、极小数下溢归零；若不单独标记，后续运算把无穷或零当正常尾数继续算。尾数抵消后结果接近零，也要区分真零与精度耗尽的小量。边界状态与正常数值必须分流。<\/p>\n<h2>再推一层：与多精度、分数的对照路线<\/h2>\n<p>浮点用有限尾数换范围，速度快、有舍入；多精度拉长数位串保留全部数位（c09）；分数用整数对精确表示有理数（c11）。数值问题对精度敏感时，用分数或多精度对照浮点结果；范围极大但精度要求一般时，浮点是性价比路线。三条路线的取舍由误差容忍度决定。<\/p>\n<h2>补充推演：对齐、舍入与规范化的次序<\/h2>\n<p>一次浮点运算的次序：先取两数指数，对齐尾数（小量级右移补位），再做尾数加减或乘除，结果规范化挤掉前导零，最后按尾数位数舍入并检查上溢下溢。右移丢掉的低位在对齐阶段已不可恢复；舍入发生在规范化之后，前导零挤掉后剩下的位数才参与保留。次序打乱——先舍入再规范化——会把有效位误删。<\/p>\n<h2>补充算例：量级悬殊相加的吞掉过程<\/h2>\n<p>设尾数三位，<span class=\"katex-inline\">x=1.00\\times10^3<\/span>，<span class=\"katex-inline\">y=2.00\\times10^1<\/span>。对齐到同指数：<span class=\"katex-inline\">y=0.020\\times10^3<\/span>，三位尾数下 <span class=\"katex-inline\">0.020<\/span> 保留两位小数成 <span class=\"katex-inline\">0.02<\/span>，<span class=\"katex-inline\">y<\/span> 的低位被压；<span class=\"katex-inline\">x+y=1.02\\times10^3<\/span>，<span class=\"katex-inline\">y<\/span> 的贡献只进一位。换序先算 <span class=\"katex-inline\">y<\/span> 自身不涉及吞位，但并入 <span class=\"katex-inline\">x<\/span> 时同样受尾数位数限制。加法次序影响中间保留了哪些低位。<\/p>\n<h2>补充辨析：相对误差与绝对误差<\/h2>\n<p>大数的绝对误差天然偏大，浮点精度用相对误差衡量；只看绝对误差会误判大数结果精度。相近数相减后绝对误差不大，相对误差却可能因有效位抵消而骤增。两类误差口径分开，危险区单独识别。<\/p>\n<h2>失败案例补充：规范化前判等或判零<\/h2>\n<p>未规范化的同一数有多种尾数写法，提前判等会把等值当不等；尾数非零但指数极小的数提前判零，会漏掉接近下溢的小量。比较与归零判断都应在规范化之后进行。<\/p>\n<h2>补充一层：浮点路线的适用边界<\/h2>\n<p>浮点换范围、保速度，适合精度要求一般的大范围计算；精度敏感场合用分数（c11）或多精度（c09）对照。指数撑范围不增加尾数有效位，这是浮点精度的根本约束；位数 <span class=\"katex-inline\">p<\/span> 决定相对精度上限，换指数不能提高它。<\/p>\n<h2>补充推演：指数范围与尾数精度的独立约束<\/h2>\n<p>指数编码决定上下溢边界，尾数位数决定相对精度；两者独立。扩大指数范围不增加尾数有效位，放大尾数位数不改变量级覆盖。设计或选用浮点格式时，先看应用需要多大量级范围，再看需要几位相对精度，两项分别配置。<\/p>\n<h2>补充算例：减法抵消的精度损失<\/h2>\n<p>两个相近大数相减，前导相同位抵消，剩余尾数有效位变少；若直接把结果当原精度使用，相对误差被掩盖。检测方法是比较两数量级与抵消后剩余位数，有效位不足时改用多精度或分数对照。<\/p>\n<h2>补充辨析：规范化与截断前导零<\/h2>\n<p>规范化挤掉尾数前导零换有效位；截断低位是另一个方向的舍入。前者在表示内部唯一化，后者在精度边界丢低位。未规范化的前导零占精度位，与截断丢低位都损失有效数字，但发生在运算不同阶段。<\/p>\n<h2>失败案例补充：结合律误用在多步求和<\/h2>\n<p>多个小数求和按不同分组结合，结果不同；按纸面结合律估算误差会超界。多步求和应从小量级开始累加，减少大数吞小数；次序本身是精度控制手段，不只是计算习惯。<\/p>\n<h2>补充一层：浮点误差的工程控制<\/h2>\n<p>多步求和从小量级累加；相近大数相减前评估有效位损失；上溢下溢单独标记。格式选型先定量级范围再定尾数位数，两项约束分开。这些控制手段对应误差产生的不同阶段：对齐吞位、抵消损失、边界状态，不能用一个笼统精度指标覆盖。<\/p>\n<h2>补充一层：浮点格式的参数对照<\/h2>\n<p>指数位数定量级范围，尾数位数定相对精度，超量偏移编码指数。三项参数对应不同需求，选型时先列应用的量级跨度与有效位要求，再定格式；不能用加指数位代替补尾数有效位。<\/p>\n<h2>补充一层：尾数位数与有效数字<\/h2>\n<p><span class=\"katex-inline\">p<\/span> 位尾数决定相对精度上限，换指数不补有效位。应用需要几位有效数字，尾数至少留几位；量级跨度靠指数扩展，两者不能互相替代。格式对照先列精度需求，再列范围需求。<\/p>\n<h2>补充一层：规范化位置在运算链中的次序<\/h2>\n<p>对齐尾数、运算、规范化、舍入、边界检查依次进行；前导零在规范化阶段挤掉，低位在舍入阶段保留。次序颠倒会误删有效位，这一顺序是浮点实现的固定流程。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出浮点对 <span class=\"katex-inline\">f\\times b^{e-q}<\/span> 各部分含义与尾数约束。\n<\/li><li>\n规范化解决哪两个问题？\n<\/li><li>\n单步浮点运算为什么会丢低位？对齐指数发生在哪一步？\n<\/li><li>\n结合律在浮点中为什么失效？举一个量级悬殊相加的例子说明次序影响。\n<\/li><li>\n相近大数相减为什么会造成相对误差骤增？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "浮点表示、规范化与舍入误差界"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷2 半数值算法.pdf · p.214<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">按位记数系统与进制转换<\/a><\/span><\/div><h1>多精度经典算术：进位借位、竖式乘法与除法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch03（原书 §4.3.1，PDF 第 214 页起）\n<\/ul>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>单字长装不下的整数（密码学大素数、高精度计算中间值）要做加减乘除。困难在于：机器指令只处理单字长，超出部分的进位、溢出、余数无处安放；直接套用单字指令会丢高位信息。多精度算术把数拆成 <span class=\"katex-inline\">b<\/span> 进制数位串，按竖式笔算规则逐位推进，进位与借位在数位间显式传递。§4.3.1 称这些为经典算法：加法减法、乘法、除法三类，对应小学竖式的机器版本。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong><span class=\"katex-inline\">n<\/span> 位整数<\/strong>：小于 <span class=\"katex-inline\">b^n<\/span> 的非负整数，写成不超过 <span class=\"katex-inline\">n<\/span> 个 <span class=\"katex-inline\">b<\/span> 进制数位。<\/p>\n<p><strong>三类经典运算<\/strong>（书 §4.3.1，PDF 第 214 页）：<\/p>\n<ul><li>\n(a) <span class=\"katex-inline\">n<\/span> 位整数加减：给出 <span class=\"katex-inline\">n<\/span> 位结果与一个进位标志；\n<\/li><li>\n(b) <span class=\"katex-inline\">m<\/span> 位整数乘 <span class=\"katex-inline\">n<\/span> 位整数：给出 <span class=\"katex-inline\">(m+n)<\/span> 位结果；\n<\/li><li>\n(c) <span class=\"katex-inline\">(m+n)<\/span> 位整数除以 <span class=\"katex-inline\">n<\/span> 位整数：给出 <span class=\"katex-inline\">(m+1)<\/span> 位商和 <span class=\"katex-inline\">n<\/span> 位余数。\n<\/ul>\n<p><strong>基本单步<\/strong>：一位加减给出结果位与进位；一位乘一位给出两位结果；两位除一位给出一位商与一位余数。复杂运算由这些单步搭起来。<\/p>\n<p><strong>进位/借位<\/strong>：本位结果超出 <span class=\"katex-inline\">b<\/span> 时，整数部分进到高位；减法不够减时向高位借 1 当 <span class=\"katex-inline\">b<\/span>。<\/p>\n<p><strong>正例<\/strong>：两个多精度十进制数相加，逐位求和加进位，满十进一；乘法部分积按位错开累加。<\/p>\n<p><strong>反例<\/strong>：不存进位标志，低位溢出直接冲掉本位；除法不保留余数，下一位商无从试起。<\/p>\n<h2>原理推导：加法的位推进程<\/h2>\n<p>设 <span class=\"katex-inline\">u=(u_{n-1}\\dots u_0)<\/span>、<span class=\"katex-inline\">v=(v_{n-1}\\dots v_0)<\/span>，进位初值 <span class=\"katex-inline\">c_{-1}=0<\/span>。对 <span class=\"katex-inline\">i=0,1,\\dots,n-1<\/span>：<\/p>\n<ol><li>\n<span class=\"katex-inline\">s_i=u_i+v_i+c_{i-1}<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">w_i=s_i\\bmod b<\/span> 为本位结果；\n<\/li><li>\n<span class=\"katex-inline\">c_i=\\lfloor s_i/b\\rfloor<\/span> 为本位进位。\n<\/ol>\n<p>不变量：低 <span class=\"katex-inline\">i<\/span> 位已算部分和等于两数低 <span class=\"katex-inline\">i<\/span> 位之和模 <span class=\"katex-inline\">b^i<\/span>，<span class=\"katex-inline\">c_i<\/span> 携带超出部分；最高位进位成为新数位。减法对称，借位替换进位。乘法：乘数每一位乘被乘数得部分积，按位错开后按加法规则累加；除法从高位试商，每步乘商减余数，余数落到下一位继续。<\/p>\n<p>运算代价随数位增长：<span class=\"katex-inline\">m<\/span> 位乘 <span class=\"katex-inline\">n<\/span> 位的常规算法约 <span class=\"katex-inline\">mn<\/span> 次单步乘法（见 c10）。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：非负整数为主；带符号数另补求补格式处理。\n<\/li><li>\n失败案例 1：进位只在单字内保存，跨字高位丢失，结果偏低。\n<\/li><li>\n失败案例 2：乘法部分积不错位累加，权重错位，结果串位。\n<\/li><li>\n失败案例 3：除法试商偏大不回退，余数变负；试商偏小则商位漏算。\n<\/li><li>\n边界：经典算法保证正确性，速度随位数按平方方向增长；更快的乘法路线见 c10。\n<\/ul>\n<p><strong>乘除竖式的位推进程<\/strong>：乘法把乘数每一位与被乘数相乘，得到的部分积按数位错开一行，再逐列累加；每列累加按加法规则处理进位，高位部分积进入高位列。除法从最高位试商：估一位商，用商位乘除式，从当前余式减去，余数落下一位继续；试商偏大则余数变负，要回退商位减一，偏小则余数仍大于除式，商位漏算一位。多精度实现把这些数位操作套到 <span class=\"katex-inline\">b<\/span> 进制串上，<span class=\"katex-inline\">b<\/span> 常取机器字长对应的幂次，使每位运算落在单字指令内；进位、借位、余数都单独存放，不允许复用寄存器覆盖。与浮点相比，多精度算术保留全部数位，中间结果不压尾数，代价是位数拉长后运算次数随规模增长。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>多精度 vs 浮点<\/strong>：多精度保留全部数位做精确整数运算；浮点压尾数换范围，有舍入。\n<\/li><li>\n<strong>进位 vs 溢出<\/strong>：进位是数位间合法传递的超出量，溢出是目标格式装不下导致的信息丢失；前者要显式存，后者要检测。\n<\/li><li>\n<strong>竖式乘除 vs 单字指令<\/strong>：经典算法按位展开，单字指令只一步；多精度是把单步组合成串。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c07 按位记数与数位权重。后继：c10 分析乘法复杂度并给出分治改进；c11 辗转相除的取余作用在多精度整数上；c12 多项式卷积的部分积累加与多精度乘法同构。多精度算术是大整数与多项式运算的共同底座。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（多精度经典算术：进位借位、竖式乘法与除法）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：多精度竖式的进位推进、乘除位流程与不变量<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>多精度算术往回追四层：<\/p>\n<ol><li>\n<strong>数位串表示<\/strong>：数拆成 <span class=\"katex-inline\">b<\/span> 进制数位，每位 <span class=\"katex-inline\">0\\le a_k&lt;b<\/span>（c07）。\n<\/li><li>\n<strong>单步运算<\/strong>：一位加减、一位乘一位、两位除一位构成基本操作。\n<\/li><li>\n<strong>进位借位传递<\/strong>：超出本位的量在数位间显式保存传递。\n<\/li><li>\n<strong>竖式组合<\/strong>：复杂运算由单步按位推进，结果位数按规则增长。\n<\/ol>\n<p>依赖链方向：数位串 → 单步操作 → 进位借位 → 加减乘除竖式。<\/p>\n<h2>正向推导：加法位推进程<\/h2>\n<p>设 <span class=\"katex-inline\">u=(u_{n-1}\\dots u_0)<\/span>，<span class=\"katex-inline\">v=(v_{n-1}\\dots v_0)<\/span>，进位初值 <span class=\"katex-inline\">c_{-1}=0<\/span>。对 <span class=\"katex-inline\">i=0,\\dots,n-1<\/span>：<\/p>\n<ol><li>\n<span class=\"katex-inline\">s_i=u_i+v_i+c_{i-1}<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">w_i=s_i\\bmod b<\/span> 为本位结果；\n<\/li><li>\n<span class=\"katex-inline\">c_i=\\lfloor s_i/b\\rfloor<\/span> 为进位。\n<\/ol>\n<p>不变量：低 <span class=\"katex-inline\">i<\/span> 位已算部分和等于两数低 <span class=\"katex-inline\">i<\/span> 位之和模 <span class=\"katex-inline\">b^i<\/span>，<span class=\"katex-inline\">c_i<\/span> 携带超出部分；最高位进位成为新数位。减法对称，不够减时向高位借 1 当 <span class=\"katex-inline\">b<\/span>，借位替换进位。<\/p>\n<h2>数值算例一：589 + 764（十进制）<\/h2>\n<p>个位：<span class=\"katex-inline\">9+4=13<\/span>，<span class=\"katex-inline\">w_0=3<\/span>，<span class=\"katex-inline\">c_0=1<\/span>。 十位：<span class=\"katex-inline\">8+6+1=15<\/span>，<span class=\"katex-inline\">w_1=5<\/span>，<span class=\"katex-inline\">c_1=1<\/span>。 百位：<span class=\"katex-inline\">5+7+1=13<\/span>，<span class=\"katex-inline\">w_2=3<\/span>，<span class=\"katex-inline\">c_2=1<\/span>。 千位：<span class=\"katex-inline\">c_2=1<\/span>。结果 <span class=\"katex-inline\">1353<\/span>。每步进位单独存放，不覆盖本位。<\/p>\n<h2>数值算例二：12 × 34<\/h2>\n<p>部分积 <span class=\"katex-inline\">12\\times4=48<\/span>；<span class=\"katex-inline\">12\\times3=36<\/span>，左移一位（十位权重）得 <span class=\"katex-inline\">360<\/span>；累加 <span class=\"katex-inline\">48+360=408<\/span>。乘法部分积按位错开，再按加法规则逐列进位。<\/p>\n<h2>除法位流程<\/h2>\n<p>从最高位试商：估一位商，商位乘除式从当前余式减去，余数落下一位继续；试商偏大余数变负，回退商位减一；偏小则余数仍大于除式，商位漏算一位。每步不变量：当前余式等于原被除式减去已得商乘除式。<\/p>\n<h2>代价方向<\/h2>\n<p><span class=\"katex-inline\">m<\/span> 位乘 <span class=\"katex-inline\">n<\/span> 位常规算法约 <span class=\"katex-inline\">mn<\/span> 次单步乘法；位数拉长后按平方方向增长，改进路线见 c10。多精度实现把 <span class=\"katex-inline\">b<\/span> 取机器字长对应的幂次，使每位落在单字指令内；进位、借位、余数单独存放，不复用寄存器覆盖。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>进位丢失<\/strong>：进位只在单字内保存，跨字高位溢出，结果偏低；进位标志必须显式存到下一位。<\/p>\n<p><strong>部分积不错位<\/strong>：乘法权重错位，部分积进错列，结果串位。<\/p>\n<p><strong>试商不回退<\/strong>：商偏大余数变负仍继续，余式符号错乱；偏小则商位漏算。<\/p>\n<p><strong>带符号数直接套竖式<\/strong>：正负号另走求补格式处理，竖式主体先对非负整数。<\/p>\n<h2>延伸推演：与浮点、多项式对照<\/h2>\n<p>多精度保留全部数位做精确整数运算；浮点压尾数换范围（c08）。多项式卷积的部分积累加与多精度乘法同构，系数串对应数位串，差别是多项式相邻系数间不进位（c12）。<\/p>\n<h2>延伸一层：减法借位与加法进位对称<\/h2>\n<p>加法进位 <span class=\"katex-inline\">c_i=\\lfloor s_i/b\\rfloor<\/span>；减法本位不够减时，向高位借 1 当 <span class=\"katex-inline\">b<\/span>，本位加 <span class=\"katex-inline\">b<\/span> 再减，借位标记传到高位。借位与进位是同一套数位折算的两个方向：高位让出一个权重单位，低位补足 <span class=\"katex-inline\">b<\/span>。多精度实现里借位标志与进位标志分开存放，符号位处理另行走求补格式，竖式主体先对非负整数推进。<\/p>\n<h2>数值算例三：305 − 178（十进制）<\/h2>\n<p>个位 <span class=\"katex-inline\">5-8<\/span> 不够减，借位 <span class=\"katex-inline\">1<\/span>，<span class=\"katex-inline\">15-8=7<\/span>；十位被借后 <span class=\"katex-inline\">0<\/span> 减 7，再向百位借，<span class=\"katex-inline\">10-1-7=2<\/span>；百位被借后 <span class=\"katex-inline\">2-1=1<\/span>。结果 <span class=\"katex-inline\">127<\/span>。核验 <span class=\"katex-inline\">127+178=305<\/span>。每步借位单独记录，不允许复用本位寄存器覆盖。<\/p>\n<h2>延伸推演：乘法部分积的列累加<\/h2>\n<p>乘数每位乘被乘数得一行部分积，第 <span class=\"katex-inline\">j<\/span> 行左移 <span class=\"katex-inline\">j<\/span> 位；所有部分积按列对齐后逐列累加，列内进位按加法规则传到左列。部分积行数等于乘数位数，列数等于被乘数位数加乘数位数。这一结构与多项式卷积 <span class=\"katex-inline\">w_k=\\sum_{i+j=k}u_iv_j<\/span> 同构，差别只是整数乘法有进位、多项式系数间不进位。<\/p>\n<h2>对照辨析：多精度运算与单字指令<\/h2>\n<p>单字指令一步完成两个机器字的四则运算；多精度把数拆成数位串，用单步指令逐位推进，进位借位显式传递。位数不超过字长时直接用单字指令，超出后才进入竖式流程。两者不是替代关系，而是按位数分层：单字路径快，多精度路径覆盖任意长度。<\/p>\n<h2>失败案例补充：符号处理混入竖式<\/h2>\n<p>带符号数直接套非负竖式，负号与借位互相干扰；正确做法是先取绝对值做竖式，符号单独按求补或符号位规则合并。中间结果溢出单字长时不检测进位，高位信息被丢弃，结果低位正确、高位错误，这类静默失败最隐蔽。<\/p>\n<h2>再推一层：代价与改进路线的接口<\/h2>\n<p>经典算法正确性清楚，代价随位数平方方向增长；位数很大时竖式乘法成为瓶颈，改进路线见 c10 分治乘法。多精度除法试商、取余是 c11 辗转相除的底层操作；多项式卷积与本节部分积结构相通，见 c12。经典竖式是后续所有改进的对照基准。<\/p>\n<h2>补充推演：多精度数的位数与结果位数<\/h2>\n<p><span class=\"katex-inline\">n<\/span> 位加减结果最多 <span class=\"katex-inline\">n+1<\/span> 位（最高位进位）；<span class=\"katex-inline\">m<\/span> 位乘 <span class=\"katex-inline\">n<\/span> 位结果最多 <span class=\"katex-inline\">m+n<\/span> 位；<span class=\"katex-inline\">(m+n)<\/span> 位除 <span class=\"katex-inline\">n<\/span> 位商最多 <span class=\"katex-inline\">m+1<\/span> 位、余数 <span class=\"katex-inline\">n<\/span> 位。位数边界由权重范围推出：乘积最高位权重 <span class=\"katex-inline\">b^{m+n-2}<\/span> 到 <span class=\"katex-inline\">b^{m+n-1}<\/span> 方向，除法余数必须小于除式。结果位数先估边界，再分配寄存器空间，避免高位溢出。<\/p>\n<h2>补充算例：多精度加法的进位链<\/h2>\n<p>两个十进制三位数相加，个位进位传到十位，十位进位传到百位，百位进位成千位；进位链沿数位单向传递。若某一步进位标志丢失，后续高位按无进位计算，结果高位整体偏低。多精度实现把进位作为独立标志位串传递，不与本位结果共用寄存器。<\/p>\n<h2>补充辨析：竖式算法与硬件乘法<\/h2>\n<p>硬件乘法器一步完成单字乘积，多精度竖式逐位推进；位数超字长后才进入竖式流程。竖式是通用数字计算机上的软件算法，不依赖特定硬件乘法器。经典算法正确性清楚，代价随位数增长；快速路线见 c10。<\/p>\n<h2>失败案例补充：部分积位数越界<\/h2>\n<p>乘法部分积行数与列数估算不足，高位部分积无处存放；累加前未预留 <span class=\"katex-inline\">m+n<\/span> 位空间，高位被截断。除法余数未保持小于除式，下一步商位估错。两类边界都来自位数估算，实现前先按公式留足空间。<\/p>\n<h2>补充一层：竖式在后续概念中的复用<\/h2>\n<p>c11 辗转相除的取余是多精度除法的反复调用；c12 多项式卷积复用部分积列累加；c10 分治在竖式基准上改进乘法。进位借位规则、余数非负约束、位数边界，是这些后续概念共同的底层操作。<\/p>\n<h2>补充推演：进位标志的存储设计<\/h2>\n<p>多精度实现中，进位/借位不能压在本位结果寄存器里，必须单独成串传递；每一步本位结果与进位分别写入。高位溢出时进位成为新数位，寄存器空间按结果位数预留。符号位另走求补格式，不混入进位链。<\/p>\n<h2>补充算例：多精度乘法的部分积规模<\/h2>\n<p><span class=\"katex-inline\">m<\/span> 位乘 <span class=\"katex-inline\">n<\/span> 位，部分积 <span class=\"katex-inline\">m<\/span> 行、每行 <span class=\"katex-inline\">n<\/span> 位扩展到 <span class=\"katex-inline\">m+n<\/span> 位；列累加从最低位起，列内进位传到左列。位数边界 <span class=\"katex-inline\">m+n<\/span> 先于累加留足，否则高位部分积无处存放。这一规模估算与 c10 分治拆分的位数簿记同源。<\/p>\n<h2>补充辨析：软件竖式与硬件指令<\/h2>\n<p>单字硬件指令一步出结果，竖式是超字长后的软件通用流程；位数不超字长直接走指令，超出才拆数位串。经典竖式不依赖专用乘法器，在通用数字计算机上可移植。<\/p>\n<h2>失败案例补充：余数符号与大小越界<\/h2>\n<p>除法余数必须非负且小于除式；余数为负或大于除式，下一步商位估错。多精度实现里余数比较、符号判断单独校验，不允许带着越界余数继续迭代。<\/p>\n<h2>补充一层：多精度运算的实现分层<\/h2>\n<p>位数不超字长走单字指令；超出后拆数位串，进位借位成串传递；乘法大位数区再考虑分治改进。经典竖式是正确性基准，快速路线是大位数优化。余数非负、位数边界、符号处理三条规则在分层中一致沿用，不因换算法而改变。<\/p>\n<h2>补充一层：多精度结果的位数复核<\/h2>\n<p>运算完成后复核结果位数：加减最多多一位，乘积 <span class=\"katex-inline\">m+n<\/span> 位，商与余数按公式落位。位数超出说明进位簿记有误，不足则检查最高位是否被截断。位数边界是竖式正确性的第一道复核。<\/p>\n<h2>补充一层：进位链与借位链的一致性<\/h2>\n<p>加法进位从低位向高位传递，减法借位反向折算；两条链规则对称。实现中标志位分开存放，符号处理另立。复核时先查进位借位有没有丢步，再查本位结果，最后对结果位数。<\/p>\n<h2>补充一层：多精度与浮点的分工复核<\/h2>\n<p>多精度保全部位做精确整数运算，浮点压尾数换范围；精度敏感走多精度，大范围近似走浮点。两条路线按误差容忍度选择，中间结果在两种表示间转换时记录舍入方向。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出加法每步的本位结果与进位公式，说明低 <span class=\"katex-inline\">i<\/span> 位不变量。\n<\/li><li>\n手算 589+764，标出每步进位。\n<\/li><li>\n乘法部分积为什么要按位错开？\n<\/li><li>\n除法试商偏大、偏小各会出什么问题？\n<\/li><li>\n多精度算术与浮点在精度取舍上有什么根本不同？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "多精度经典算术：进位借位、竖式乘法与除法"}, "c10": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷2 半数值算法.pdf · p.236<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">多精度经典算术：进位借位、竖式乘法与除法<\/a><\/span><\/div><h1>大整数乘法的复杂度：从平方算法到分治快速乘法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch03（原书 §4.3.3，PDF 第 236 页起）\n<\/ul>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>经典竖式乘法把 <span class=\"katex-inline\">m<\/span> 位数乘 <span class=\"katex-inline\">n<\/span> 位数，约需 <span class=\"katex-inline\">cmn<\/span> 次单步操作。位数 <span class=\"katex-inline\">n<\/span> 很大时（大整数、多项式卷积、循环乘积），平方阶 <span class=\"katex-inline\">n^2<\/span> 增长很快。困难在于：通用乘法的运行时间是否一定随 <span class=\"katex-inline\">n^2<\/span> 增长？能不能利用分治把乘法拆成更少的半长乘法，把阶压下来？§4.3.3「乘法有多快？」正面追问这个问题，区分&quot;允许对特定 <span class=\"katex-inline\">n<\/span> 建大乘法表&quot;与&quot;在通用数字计算机上运行的算法&quot;两种口径。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>常规算法（Algorithm 4.3.1M 方向）<\/strong>：按位竖式相乘，<span class=\"katex-inline\">m<\/span> 位与 <span class=\"katex-inline\">n<\/span> 位相乘约 <span class=\"katex-inline\">cmn<\/span> 次操作，<span class=\"katex-inline\">c<\/span> 为常数；<span class=\"katex-inline\">m=n<\/span> 时为 <span class=\"katex-inline\">O(n^2)<\/span>。<\/p>\n<p><strong>通用算法<\/strong>：以任意两个按位记数的 <span class=\"katex-inline\">n<\/span> 位数为输入，输出乘积；不依赖为某个确定 <span class=\"katex-inline\">n<\/span> 预先建好的查表。<\/p>\n<p><strong>分治乘法方向<\/strong>：把两个 <span class=\"katex-inline\">n<\/span> 位数各拆成两半，高位半与低位半；直接展开需要 4 次半长乘法，改进路线用 3 次半长乘法加线性加减完成合并。<\/p>\n<p><strong>递推复杂度<\/strong>：<span class=\"katex-inline\">T(n)=3T(n/2)+O(n)<\/span>，解为 <span class=\"katex-inline\">O(n^{\\log_2 3})\\approx O(n^{1.585})<\/span>，低于平方阶。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">n=1000<\/span> 时竖式乘法约 <span class=\"katex-inline\">10^6<\/span> 次数位相乘；三分治路线按 <span class=\"katex-inline\">3^{\\log_2 n}<\/span> 方向，半长乘法次数降到数万量级（估算方向，具体随实现）。<\/p>\n<p><strong>反例<\/strong>：为固定 <span class=\"katex-inline\">n<\/span> 造一张巨大乘法表，查表 <span class=\"katex-inline\">O(1)<\/span> 完成；这不算通用算法，换位数表就作废。<\/p>\n<h2>原理推导：为什么分治能减少乘法次数<\/h2>\n<p>设 <span class=\"katex-inline\">u=u_1b^{n/2}+u_0<\/span>，<span class=\"katex-inline\">v=v_1b^{n/2}+v_0<\/span>。直接展开：<\/p>\n<div class=\"katex-block\">uv=u_1v_1b^n+(u_1v_0+u_0v_1)b^{n/2}+u_0v_0<\/div>\n<p>交叉项 <span class=\"katex-inline\">u_1v_0+u_0v_1<\/span> 直接算要两次半长乘法，合计 4 次。改进路线先算 <span class=\"katex-inline\">u_1v_1<\/span>、<span class=\"katex-inline\">u_0v_0<\/span>，再算 <span class=\"katex-inline\">(u_1+u_0)(v_1+v_0)<\/span>，交叉项由三者相减得到，半长乘法降到 3 次。递归对半长整数再拆，每层乘法数按 3 倍增长、规模按半折，得 <span class=\"katex-inline\">T(n)=3T(n/2)+O(n)<\/span>。<\/p>\n<p>推导依据：加减是线性代价，乘法是递归主体；用线性加减替换一次半长乘法，递归树的分支因子从 4 降到 3。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：位数足够大，分治合并的线性开销摊得薄；小位数上竖式更划算，递归阈值以下退回经典算法。\n<\/li><li>\n失败案例 1：位数很小时硬递归，合并加减开销超过省下的乘法，反而变慢。\n<\/li><li>\n失败案例 2：把&quot;查表加速&quot;当通用复杂度结论；预计算表只对固定输入规模有效。\n<\/li><li>\n边界：分治改进仍属多项式阶；更高效率的乘法路线（书 §4.3.3 后续与循环乘积方向）在更大规模上继续讨论。循环卷积与多项式乘积可借用同一套快速变换，规模越大收益越明显；小位数区间内竖式常数更优，分治阈值以下不递归。\n<\/ul>\n<p><strong>阈值与实现边界<\/strong>：分治不是越大越好。递归拆到小位数时，半长乘法的合并加减已经超过省下的那一次乘法，因此实现上要设阈值：位数低于阈值退回竖式经典算法，高于阈值才继续拆分。合并阶段处理高位半与低位半的进位、符号与重叠项，簿记开销随递归层累积；只有位数足够大，分支因子下降带来的收益才盖过这部分线性开销。复杂度阶比较的是渐近行为，实际选型还要看阈值内的常数与机器字长。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>操作数 vs 乘法次数<\/strong>：复杂度阶按单步操作计数；加减与乘法在递归里权重不同，分治正是用便宜运算换昂贵乘法。\n<\/li><li>\n<strong><span class=\"katex-inline\">O(n^2)<\/span> 竖式 vs 分治<\/strong>：竖式不拆，<span class=\"katex-inline\">mn<\/span> 次相乘；分治拆半降分支因子，阶低于平方。\n<\/li><li>\n<strong>大整数乘法 vs 多项式卷积<\/strong>：两者结构同构，循环乘积（书 §4.3.2 习题方向）与多项式系数卷积可共用快速乘法思路。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c09 竖式乘法与部分积累加。后继：c12 多项式乘法按卷积展开，同样面对 <span class=\"katex-inline\">n^2<\/span> 项与分治改进；c11 辗转相除的步数对数增长，与本节乘法代价对照，构成大整数运算两类核心代价。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（大整数乘法的复杂度：从平方算法到分治快速乘法）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：分治乘法的拆分、递推求解与规模估算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>乘法复杂度往回追四层：<\/p>\n<ol><li>\n<strong>竖式乘法<\/strong>：<span class=\"katex-inline\">m<\/span> 位乘 <span class=\"katex-inline\">n<\/span> 位约 <span class=\"katex-inline\">mn<\/span> 次单步操作（c09）。\n<\/li><li>\n<strong>拆分对象<\/strong>：两个 <span class=\"katex-inline\">n<\/span> 位数各切高位半、低位半。\n<\/li><li>\n<strong>乘法次数优化<\/strong>：直接展开 4 次半长乘法，改进路线 3 次加线性加减。\n<\/li><li>\n<strong>递归求解<\/strong>：递推式定出渐近阶，低于平方。\n<\/ol>\n<p>依赖链方向：竖式 <span class=\"katex-inline\">mn<\/span> 次 → 半长拆分 → 3 次半长乘法 → 递推 <span class=\"katex-inline\">T(n)=3T(n/2)+O(n)<\/span>。<\/p>\n<h2>正向推导：直接展开的四次半长乘法<\/h2>\n<p>设 <span class=\"katex-inline\">u=u_1b^{n/2}+u_0<\/span>，<span class=\"katex-inline\">v=v_1b^{n/2}+v_0<\/span>。乘积：<\/p>\n<div class=\"katex-block\">uv=u_1v_1b^n+(u_1v_0+u_0v_1)b^{n/2}+u_0v_0<\/div>\n<p>其中 <span class=\"katex-inline\">u_1v_1<\/span>、<span class=\"katex-inline\">u_0v_0<\/span>、<span class=\"katex-inline\">u_1v_0<\/span>、<span class=\"katex-inline\">u_0v_1<\/span> 是四次半长乘法。交叉项 <span class=\"katex-inline\">u_1v_0+u_0v_1<\/span> 单独算又要两次，朴素拆分合计四次主体乘法。<\/p>\n<h2>正向推导：三次半长乘法的合并<\/h2>\n<p>先算 <span class=\"katex-inline\">A=u_1v_1<\/span>，<span class=\"katex-inline\">B=u_0v_0<\/span>，再算 <span class=\"katex-inline\">C=(u_1+u_0)(v_1+v_0)<\/span>。交叉项：<\/p>\n<div class=\"katex-block\">u_1v_0+u_0v_1=C-A-B<\/div>\n<p>半长乘法降到 3 次，多出的是加法、减法与移位合并，属线性代价。递归对半长整数再拆，每层乘法数按 3 倍增长、规模按半折。<\/p>\n<h2>递推求解<\/h2>\n<div class=\"katex-block\">T(n)=3T(n/2)+O(n)<\/div>\n<p>递归树每层：分支因子 3，规模折半。按主定理方向，解为 <span class=\"katex-inline\">T(n)=O(n^{\\log_2 3})<\/span>，<span class=\"katex-inline\">\\log_2 3\\approx1.585<\/span>，低于平方阶 <span class=\"katex-inline\">O(n^2)<\/span>。推导依据：加减是线性代价，递归主体是乘法；用便宜运算换昂贵乘法，分支因子从 4 降到 3。<\/p>\n<h2>数值算例：<span class=\"katex-inline\">n=1000<\/span> 的次数估算<\/h2>\n<p>竖式乘法：约 <span class=\"katex-inline\">1000\\times1000=10^6<\/span> 次数位相乘。分治路线：半长乘法次数随 <span class=\"katex-inline\">3^{\\log_2 n}<\/span> 增长，<span class=\"katex-inline\">\\log_2 1000\\approx9.97<\/span>，<span class=\"katex-inline\">3^{9.97}\\approx5.7\\times10^4<\/span>，约为竖式的二十分之一量级；合并加减另计。这是渐近方向的估算，实际阈值以下退回竖式。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>小位数硬递归<\/strong>：半长合并的加减开销超过省下的乘法，小位数上反而变慢；必须设阈值，低于阈值走竖式。<\/p>\n<p><strong>查表当通用算法<\/strong>：为固定 <span class=\"katex-inline\">n<\/span> 造大乘法表，查表 <span class=\"katex-inline\">O(1)<\/span>；换位数表作废，不算通用数字计算机算法。<\/p>\n<p><strong>只看乘法次数不计合并<\/strong>：分治省下乘法但增加加减与簿记；规模不够大时净收益为负。<\/p>\n<h2>延伸推演：多项式卷积与循环乘积<\/h2>\n<p>两个 <span class=\"katex-inline\">n<\/span> 次多项式卷积有 <span class=\"katex-inline\">(n+1)^2<\/span> 个系数乘积项，与大整数乘法同构；循环卷积（书 §4.3.2 习题方向）可借用同一套快速变换。分治思路在系数串与数位串上互相迁移。<\/p>\n<h2>延伸一层：四次到三次的代数核对<\/h2>\n<p>直接展开交叉项 <span class=\"katex-inline\">u_1v_0+u_0v_1<\/span>。由 <span class=\"katex-inline\">C=(u_1+u_0)(v_1+v_0)=u_1v_1+u_1v_0+u_0v_1+u_0v_0<\/span>，减去 <span class=\"katex-inline\">A=u_1v_1<\/span> 与 <span class=\"katex-inline\">B=u_0v_0<\/span>，恰得 <span class=\"katex-inline\">u_1v_0+u_0v_1<\/span>。三次半长乘法 <span class=\"katex-inline\">A,B,C<\/span> 覆盖原四次项，替换出去的两次乘法由一次加法、一次减法完成。代数核对确认没有丢项：<span class=\"katex-inline\">C<\/span> 展开的四个乘积项与直接展开一一对应。<\/p>\n<h2>数值算例二：小位数拆分核对<\/h2>\n<p>取 <span class=\"katex-inline\">u=12<\/span>，<span class=\"katex-inline\">v=34<\/span>，按十进制半长：<span class=\"katex-inline\">u_1=1,u_0=2<\/span>，<span class=\"katex-inline\">v_1=3,v_0=4<\/span>。<span class=\"katex-inline\">A=1\\cdot3=3<\/span>，<span class=\"katex-inline\">B=2\\cdot4=8<\/span>，<span class=\"katex-inline\">C=(1+2)(3+4)=21<\/span>，交叉项 <span class=\"katex-inline\">21-3-8=10<\/span>。乘积 <span class=\"katex-inline\">uv=3\\cdot100+10\\cdot10+8=408<\/span>，与竖式一致。小位数上三次乘法加合并并不比竖式快，核对只用于确认拆分代数正确。<\/p>\n<h2>延伸推演：递归阈值与实现分层<\/h2>\n<p>分治拆到低位规模时，半长乘法的合并簿记超过省下的乘法，实现上设阈值：位数高于阈值继续递归，低于阈值退回经典竖式。阈值由实测常数决定，不是渐近理论给出。递归层的进位、符号、重叠项要逐层簿记；规模不够大时，这些线性开销吃掉阶改进的收益。<\/p>\n<h2>对照辨析：渐近阶与小常数<\/h2>\n<p><span class=\"katex-inline\">O(n^{1.585})<\/span> 低于 <span class=\"katex-inline\">O(n^2)<\/span> 是大位数方向的结论；小位数上竖式常数更小。选型不能只看渐近阶，要结合实际位数区间、阈值与机器字长。查表法在固定输入规模下 <span class=\"katex-inline\">O(1)<\/span>，但换规模即作废，不属于通用数字计算机算法口径。<\/p>\n<h2>失败案例补充：合并项溢出未处理<\/h2>\n<p>半长相加 <span class=\"katex-inline\">u_1+u_0<\/span> 可能进位到高位，<span class=\"katex-inline\">v_1+v_0<\/span> 同样可能进位到高位；递归合并时不处理这一进位，高位项错位。分治实现要把半长之和的进位纳入高位簿记，与 c09 竖式进位规则一致。只拆数位不处理进位，分解结果会偏低。<\/p>\n<h2>再推一层：快速乘法与卷积的迁移<\/h2>\n<p>多项式卷积 <span class=\"katex-inline\">(n+1)^2<\/span> 个乘积项与大整数竖式乘法同构，分治减少乘法次数的思路可直接迁移；循环乘积借快速变换实现。c12 多项式乘法、c09 多精度竖式是这条改进路线的两端，本节的递推分析是中间接口。<\/p>\n<h2>补充推演：递推式的递归树求解<\/h2>\n<p><span class=\"katex-inline\">T(n)=3T(n/2)+O(n)<\/span>：每层递归规模折半，分支数 3。第 <span class=\"katex-inline\">l<\/span> 层有 <span class=\"katex-inline\">3^l<\/span> 个子问题，每个规模 <span class=\"katex-inline\">n/2^l<\/span>；层代价 <span class=\"katex-inline\">O(n)<\/span>。展开到叶子层 <span class=\"katex-inline\">\\log_2 n<\/span>，叶子数 <span class=\"katex-inline\">3^{\\log_2 n}=n^{\\log_2 3}<\/span>。主定理方向给出 <span class=\"katex-inline\">T(n)=O(n^{\\log_2 3})<\/span>，<span class=\"katex-inline\">\\log_2 3\\approx1.585<\/span>。分支因子 3 来自三次半长乘法；若退回四次，阶变为 <span class=\"katex-inline\">n^2<\/span>。减少递归分支数是降阶的关键。<\/p>\n<h2>补充算例：阈值以下的竖式回退<\/h2>\n<p>位数 <span class=\"katex-inline\">n<\/span> 低于阈值时，半长拆分的合并加减超过省下的乘法，实现回退经典竖式。阈值由实测：在目标机器上测不同位数的两种算法交点，取交点以下为竖式区。渐近阶改进只在大位数区兑现，小位数区保留竖式常数优势。<\/p>\n<h2>补充辨析：分治乘法与查表加速<\/h2>\n<p>查表对固定 <span class=\"katex-inline\">n<\/span> 预计算乘积，<span class=\"katex-inline\">O(1)<\/span> 取用；换规模表作废，不属于通用算法。分治对任意 <span class=\"katex-inline\">n<\/span> 递归拆分，是数字计算机上的通用改进。复杂度讨论的&quot;通用&quot;口径排除预计算查表，这是书 §4.3.3 明确的问题设定。<\/p>\n<h2>失败案例补充：半长进位未纳入簿记<\/h2>\n<p><span class=\"katex-inline\">u_1+u_0<\/span>、<span class=\"katex-inline\">v_1+v_0<\/span> 可能进位到高位；递归合并忽略这一进位，高位项错位。分治实现要把半长之和的进位并入高位项，规则与 c09 竖式进位一致。拆分只分数位，不改变进位折算规则。<\/p>\n<h2>补充一层：快速乘法的迁移链条<\/h2>\n<p>多项式卷积与大整数乘法同构，分治减乘思路可迁移；循环乘积借快速变换实现。c09 竖式是基准，c10 是大位数改进，c12 多项式乘法复用同一结构。复杂度分析的对象从数位串推广到系数串。<\/p>\n<h2>补充推演：分治的合并代价归属<\/h2>\n<p>三次半长乘法之外，加、减、移位是线性 <span class=\"katex-inline\">O(n)<\/span> 代价；递归式 <span class=\"katex-inline\">T(n)=3T(n/2)+O(n)<\/span> 把线性项归入非递归层。若合并簿记做重，线性常数变大，但不改变渐近阶；小位数区常数主导，阈值以下回退竖式。阶改进靠分支因子下降，不靠压缩线性项。<\/p>\n<h2>补充算例：<span class=\"katex-inline\">n=1000<\/span> 的量级对照<\/h2>\n<p>竖式 <span class=\"katex-inline\">10^6<\/span> 次数位相乘；分治 <span class=\"katex-inline\">3^{\\log_2 1000}\\approx5.7\\times10^4<\/span> 半长乘法，加线性合并。这是渐近方向估算，实际交点由机器常数定。位数越大，阶差距越明显；小位数竖式常数更优。<\/p>\n<h2>补充辨析：乘法阶与卷积阶<\/h2>\n<p>大整数乘法与多项式卷积同构，<span class=\"katex-inline\">n^2<\/span> 项的结构相同；快速变换在两类对象上通用。分治减乘思路不限于整数，系数串乘法可复用。<\/p>\n<h2>补充一层：复杂度结论的适用区间<\/h2>\n<p><span class=\"katex-inline\">O(n^{1.585})<\/span> 是大位数渐近结论；小位数区竖式常数更优，阈值以下不递归。通用口径排除固定查表。选型结合实际位数区间、机器常数与进位簿记，不把渐近阶当成全区间优劣判据。<\/p>\n<h2>补充一层：分治实现的簿记清单<\/h2>\n<p>半长拆分、三次乘法、交叉项合并、进位回写；每一步的高位进位纳入簿记。递归阈值以下回退竖式。清单逐项核对，避免只拆数位不处理进位，或小位数硬递归吃掉阶改进收益。<\/p>\n<h2>补充一层：减乘思路的复用条件<\/h2>\n<p>分治减少的是昂贵乘法次数，加减移位保持线性；复用前提是对象能对半拆分、合并项可用线性运算表达。多项式卷积满足这两个条件，因此同一思路迁移；不满足拆分条件的运算不能硬套。<\/p>\n<h2>补充一层：与竖式基准的对照测试<\/h2>\n<p>分治结果先与竖式小位数结果逐位核对一致，再上大位数；拆分、合并、进位每一层都可用小例子回代验证。正确性以竖式基准为对照，阶改进以大位数实测为准。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出两数半长拆分后的乘积展开式。\n<\/li><li>\n三次半长乘法路线怎样算出交叉项？哪一项被线性加减替换？\n<\/li><li>\n递推 <span class=\"katex-inline\">T(n)=3T(n/2)+O(n)<\/span> 的渐近阶是多少？\n<\/li><li>\n<span class=\"katex-inline\">n=1000<\/span> 时竖式与分治的次数各是什么量级？\n<\/li><li>\n为什么小位数上分治可能反而变慢？阈值起什么作用？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "大整数乘法的复杂度：从平方算法到分治快速乘法"}, "c11": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷2 半数值算法.pdf · p.267<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">多精度经典算术：进位借位、竖式乘法与除法<\/a><\/span><\/div><h1>最大公因数与欧几里得算法：连分数、最坏情形与斐波那契数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（原书 §4.5.2–4.5.3，PDF 第 267、277 页）\n<\/ul>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>分数要约成既约形式，约分要求分子分母同除以最大公因数；判断两数是否互素、模运算中求逆元，也都落在最大公因数上。困难在于：大整数逐个试除到较小数，步数随数值线性增长，推广到多精度时代价失控。欧几里得算法用辗转取余把数对不断换小，步数随位数对数增长；§4.5.3 进一步分析它最坏要走几步、为什么最坏情形是斐波那契数。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>最大公因数 <span class=\"katex-inline\">\\gcd(u,v)<\/span><\/strong>：同时整除 <span class=\"katex-inline\">u,v<\/span> 的最大正整数。<\/p>\n<p><strong>欧几里得算法（算法 4.5.2A 方向）<\/strong>：若 <span class=\"katex-inline\">v=0<\/span>，答案为 <span class=\"katex-inline\">u<\/span>；否则令 <span class=\"katex-inline\">u=qv+r<\/span>，以 <span class=\"katex-inline\">(v,r)<\/span> 替换 <span class=\"katex-inline\">(u,v)<\/span> 重复，直到余数为 0。<\/p>\n<p><strong>连分数<\/strong>：形如<\/p>\n<div class=\"katex-block\">\\frac{b_1}{a_1+\\frac{b_2}{a_2+\\cdots}}<\/div>\n<p>系数全 1 时与辗转相除步骤一一对应；书 §4.5.3 记 <span class=\"katex-inline\">\\parallel x_1,\\dots,x_n\\parallel=1/(x_1+1/(x_2+\\cdots))<\/span>。<\/p>\n<p><strong>最坏情形（定理 F，PDF 第 277 页）<\/strong>：恰好 <span class=\"katex-inline\">n<\/span> 步除法、且 <span class=\"katex-inline\">u<\/span> 是满足条件的最小整数时，<span class=\"katex-inline\">u=F_{n+2}<\/span>，<span class=\"katex-inline\">v=F_{n+1}<\/span>，即连续两个斐波那契数。<\/p>\n<p><strong>步数上界（推论 L）<\/strong>：<span class=\"katex-inline\">0\\le v&lt;N<\/span> 时，除法步骤数最多 <span class=\"katex-inline\">\\lceil\\log_\\phi((3-\\phi)N)\\rceil<\/span>，<span class=\"katex-inline\">\\phi<\/span> 为黄金分割比。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">\\gcd(29,8)<\/span>：<span class=\"katex-inline\">29=3\\cdot8+5<\/span>，<span class=\"katex-inline\">8=1\\cdot5+3<\/span>，<span class=\"katex-inline\">5=1\\cdot3+2<\/span>，<span class=\"katex-inline\">3=1\\cdot2+1<\/span>，<span class=\"katex-inline\">2=2\\cdot1+0<\/span>，答案 1。<\/p>\n<p><strong>反例<\/strong>：从 2 逐个试除到较小数，小整数可行，大整数时代价线性膨胀；这不是辗转相除路线。<\/p>\n<h2>原理推导：辗转相除为什么终止且正确<\/h2>\n<p>依据恒等式 <span class=\"katex-inline\">\\gcd(u,v)=\\gcd(v,u\\bmod v)<\/span>：<span class=\"katex-inline\">u<\/span> 与 <span class=\"katex-inline\">v<\/span> 的公因数同时整除 <span class=\"katex-inline\">u-qv=r<\/span>；反之 <span class=\"katex-inline\">v<\/span> 与 <span class=\"katex-inline\">r<\/span> 的公因数也整除 <span class=\"katex-inline\">u=qv+r<\/span>。公因数集合相同，最大公因数不变。每步余数严格小于除数，非负余数必然下降，有限步内到 0；最后非零余数即最大公因数。<\/p>\n<p>连分数方向：每步商 <span class=\"katex-inline\">q_i<\/span> 成为连分数一个系数；商全为 1 时余数递减最慢，对应斐波那契递推 <span class=\"katex-inline\">F_{n+2}=F_{n+1}+F_n<\/span>。定理 F 证明方向：若某步商大于 1，余数下降更快，同一步数可取更小的数；最小最坏输入只能是商全 1 的斐波那契相邻项。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：非负整数；多精度整数同样适用，取余按 c09 竖式实现。\n<\/li><li>\n失败案例 1：试除法代替辗转相除，大整数步数失控。\n<\/li><li>\n失败案例 2：分数不约分直接运算，分子分母只涨不落，中间结果溢出单精度。\n<\/li><li>\n失败案例 3：把欧几里得算法步数当成线性于数值；实际随位数对数增长，斐波那契相邻项是最慢情形。\n<\/li><li>\n边界：算法分析基于标准取余步骤；带符号数先取绝对值。\n<\/ul>\n<p><strong>与分数算术的衔接<\/strong>：分数 <span class=\"katex-inline\">(u/u&#x27;)<\/span> 要求 <span class=\"katex-inline\">u,u&#x27;<\/span> 互素且 <span class=\"katex-inline\">u&#x27;&gt;0<\/span>。乘法交叉相乘后求一次 gcd 约分；加减通分后分子相加，再除以分子分母的 gcd 化既约。若不约分，同一有理数出现多种写法，相等判断要交叉相乘，中间分子分母只涨不落，单精度很快溢出。gcd 算法的步数对数于位数，使多精度分数运算在大整数上仍可承受；这也是 §4.5.1 把公因数算法放在分数运算之后讲解的原因。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>公因数 vs 公因子分解<\/strong>：辗转相除直接求 gcd，不必先把两数拆成素因子；素因数分解（§4.5.4）是另一类更慢的问题。\n<\/li><li>\n<strong>最坏情形 vs 平均情形<\/strong>：定理 F 给最慢输入；平均步数另由连续模型分析，量级低于最坏上界。\n<\/li><li>\n<strong>gcd vs 互素<\/strong>：<span class=\"katex-inline\">\\gcd=1<\/span> 即互素；互素是 gcd 判定的一个结果。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c09 多精度取余与竖式减法。后继：c12 多项式最大公因数与多项式除法同构；c03 零增量序列的阶、c04 检验中的互素判断都调用 gcd。欧几里得算法是分数算术与数论运算的枢纽。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（最大公因数与欧几里得算法：连分数、最坏情形与斐波那契数）<\/summary><div class=\"depth-body\"><h1>c11 深度推导：辗转相除正确性、连分数对应与斐波那契最坏情形<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>最大公因数往回追四层：<\/p>\n<ol><li>\n<strong>取余运算<\/strong>：<span class=\"katex-inline\">u=qv+r<\/span>，余数 <span class=\"katex-inline\">0\\le r&lt;v<\/span>（c09 多精度取余）。\n<\/li><li>\n<strong>公因数不变量<\/strong>：<span class=\"katex-inline\">\\gcd(u,v)=\\gcd(v,r)<\/span>。\n<\/li><li>\n<strong>余数下降<\/strong>：每步余数严格减小，有限步终止于 0。\n<\/li><li>\n<strong>连分数对应<\/strong>：商序列对应连分数系数，全 1 系数即斐波那契递推。\n<\/ol>\n<p>依赖链方向：取余 → 公因数集合不变 → 余数递减终止 → 连分数系数 → 最坏情形定位。<\/p>\n<h2>正向推导：辗转相除为什么正确<\/h2>\n<p>恒等式：<span class=\"katex-inline\">\\gcd(u,v)=\\gcd(v,u\\bmod v)<\/span>。<\/p>\n<ol><li>\n若 <span class=\"katex-inline\">d<\/span> 整除 <span class=\"katex-inline\">u<\/span> 与 <span class=\"katex-inline\">v<\/span>，则 <span class=\"katex-inline\">d<\/span> 整除 <span class=\"katex-inline\">u-qv=r<\/span>，所以 <span class=\"katex-inline\">d<\/span> 也是 <span class=\"katex-inline\">v,r<\/span> 的公因数。\n<\/li><li>\n反之，<span class=\"katex-inline\">d<\/span> 整除 <span class=\"katex-inline\">v<\/span> 与 <span class=\"katex-inline\">r<\/span>，则 <span class=\"katex-inline\">d<\/span> 整除 <span class=\"katex-inline\">qv+r=u<\/span>，也是 <span class=\"katex
