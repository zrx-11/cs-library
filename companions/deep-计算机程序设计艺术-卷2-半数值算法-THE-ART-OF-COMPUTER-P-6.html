-inline\">u,v<\/span> 的公因数。\n<\/li><li>\n两边公因数集合相同，最大公因数不变。\n<\/ol>\n<p>每步把数对 <span class=\"katex-inline\">(u,v)<\/span> 换成 <span class=\"katex-inline\">(v,r)<\/span>，余数 <span class=\"katex-inline\">r&lt;v<\/span> 严格下降；非负余数有限，必然到余数 0，最后非零余数即 gcd。<\/p>\n<h2>数值算例一：<span class=\"katex-inline\">\\gcd(29,8)<\/span><\/h2>\n<ol><li>\n<span class=\"katex-inline\">29=3\\cdot8+5<\/span>，余 5。\n<\/li><li>\n<span class=\"katex-inline\">8=1\\cdot5+3<\/span>，余 3。\n<\/li><li>\n<span class=\"katex-inline\">5=1\\cdot3+2<\/span>，余 2。\n<\/li><li>\n<span class=\"katex-inline\">3=1\\cdot2+1<\/span>，余 1。\n<\/li><li>\n<span class=\"katex-inline\">2=2\\cdot1+0<\/span>，余 0。\n<\/ol>\n<p>最后非零余数 1，<span class=\"katex-inline\">\\gcd(29,8)=1<\/span>，五步除法。<\/p>\n<h2>数值算例二：斐波那契相邻项<\/h2>\n<p><span class=\"katex-inline\">u=8<\/span>，<span class=\"katex-inline\">v=5<\/span>（<span class=\"katex-inline\">F_6=8<\/span>，<span class=\"katex-inline\">F_5=5<\/span>）：<\/p>\n<ol><li>\n<span class=\"katex-inline\">8=1\\cdot5+3<\/span>，余 3。\n<\/li><li>\n<span class=\"katex-inline\">5=1\\cdot3+2<\/span>，余 2。\n<\/li><li>\n<span class=\"katex-inline\">3=1\\cdot2+1<\/span>，余 1。\n<\/li><li>\n<span class=\"katex-inline\">2=2\\cdot1+0<\/span>，余 0。\n<\/ol>\n<p>四步除法，商序列前三个都是 1。对照定理 F：恰好 <span class=\"katex-inline\">n=4<\/span> 步、且 <span class=\"katex-inline\">u<\/span> 是满足条件的最小整数时，<span class=\"katex-inline\">u=F_{n+2}=F_6=8<\/span>，<span class=\"katex-inline\">v=F_{n+1}=F_5=5<\/span>。<\/p>\n<h2>正向推演：最坏情形为什么是斐波那契数<\/h2>\n<p>连分数系数就是每步商。商全为 1 时余数递减最慢：每步只减去一倍，余数序列按 <span class=\"katex-inline\">F_{k+2}=F_{k+1}+F_k<\/span> 递推。若某步商大于 1，余数下降更快，同一步数可取更小的数。因此满足&quot;步数 <span class=\"katex-inline\">n<\/span>、输入最小&quot;的最坏输入只能是商全 1 的斐波那契相邻项。定理 F 给出这一结论；推论 L 给步数上界：<span class=\"katex-inline\">0\\le v&lt;N<\/span> 时，步骤数最多 <span class=\"katex-inline\">\\lceil\\log_\\phi((3-\\phi)N)\\rceil<\/span>，<span class=\"katex-inline\">\\phi<\/span> 为黄金分割比，步数随位数对数增长。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>试除法代替辗转相除<\/strong>：从 2 逐个试除到较小数，步数随数值线性增长；大整数与多精度时代价失控。<\/p>\n<p><strong>不约分<\/strong>：分数分子分母只涨不落，同一有理数多种写法，单精度溢出；gcd 约分环节不可省。<\/p>\n<p><strong>把步数当线性于数值<\/strong>：实际最坏情形对数于位数，斐波那契相邻项是最慢输入，不是平均输入。<\/p>\n<h2>延伸推演：与分数算术衔接<\/h2>\n<p>分数 <span class=\"katex-inline\">(u/u&#x27;)<\/span> 要求互素且 <span class=\"katex-inline\">u&#x27;&gt;0<\/span>。乘法交叉相乘后求一次 gcd 约分；加减通分后再除 gcd 化既约。gcd 步数对数于位数，使多精度分数运算在大整数上可承受。素因数分解（§4.5.4）是另一类更慢的问题，不能用辗转相除替代。<\/p>\n<h2>延伸一层：连分数记号与商序列<\/h2>\n<p>书 §4.5.3 记 <span class=\"katex-inline\">\\parallel x_1,\\dots,x_n\\parallel=1/(x_1+1/(x_2+\\cdots))<\/span>。辗转相除每步商 <span class=\"katex-inline\">q_i<\/span> 就是连分数一个系数；余数比 <span class=\"katex-inline\">u/v<\/span> 对应连分数的逐层展开。商全为 1 时连分数系数全 1，分子分母由斐波那契递推生成；商大于 1 时系数出现大项，余数下降加快。连分数把算法步数与数值结构直接挂钩。<\/p>\n<h2>数值算例三：<span class=\"katex-inline\">\\gcd(8,5)<\/span> 的连分数对应<\/h2>\n<p><span class=\"katex-inline\">8/5=1+3/5<\/span>，<span class=\"katex-inline\">5/3=1+2/3<\/span>，<span class=\"katex-inline\">3/2=1+1/2<\/span>，商序列 <span class=\"katex-inline\">1,1,1,2<\/span>。前三个商为 1，对应斐波那契相邻项；最后一步商 2 结束。五步内的最慢输入正是商全 1 的序列，这与定理 F 的方向一致：商 1 越多，余数递减越慢，步数越长。<\/p>\n<h2>延伸推演：步数上界的对数方向<\/h2>\n<p>推论 L：<span class=\"katex-inline\">0\\le v&lt;N<\/span> 时步骤数最多 <span class=\"katex-inline\">\\lceil\\log_\\phi((3-\\phi)N)\\rceil<\/span>。<span class=\"katex-inline\">\\phi<\/span> 为黄金分割比，上界随 <span class=\"katex-inline\">N<\/span> 对数增长；这说明辗转相除不是线性于数值大小，大整数上步数依然可控。平均步数另由连续模型分析，量级低于最坏上界；最坏情形由斐波那契相邻项给出，不是随机输入的典型表现。<\/p>\n<h2>对照辨析：gcd 与素因数分解<\/h2>\n<p>辗转相除直接求公因数，不必先拆素因子；素因数分解把整数拆成素数乘积，难度更高。两个问题常被混为一谈：gcd 走取余迭代，分解走试除或筛法；用 gcd 结果反推因子分解只在互素情形有空余信息。c12 多项式最大公因数与本节整数 gcd 同构，同样先求公因子再谈分解。<\/p>\n<h2>失败案例补充：余数符号与终止条件<\/h2>\n<p>余数必须取非负值；带余除法 <span class=\"katex-inline\">u=qv+r<\/span> 要求 <span class=\"katex-inline\">0\\le r&lt;v<\/span>。若余数算成负数未回正，下一步数对代入错乱，终止条件（余数为 0）迟迟达不到。多精度实现里余数与除数的大小比较、符号判断单独走 c09 竖式规则。<\/p>\n<h2>再推一层：分数算术里的 gcd 位置<\/h2>\n<p>分数 <span class=\"katex-inline\">(u/u&#x27;)<\/span> 既约要求分子分母互素：乘法交叉相乘后求 gcd 约分，加减通分后再除 gcd。不约分则同一有理数多种写法，中间分子分母膨胀溢出。gcd 步数对数于位数，使多精度分数运算可承受；这是 §4.5.1 分数运算把公因数算法放在其后讲解的原因。<\/p>\n<h2>补充推演：算法终止与余数下降<\/h2>\n<p>每步 <span class=\"katex-inline\">u=qv+r<\/span>，<span class=\"katex-inline\">0\\le r&lt;v<\/span>，余数严格小于除数；数对 <span class=\"katex-inline\">(u,v)\\mapsto(v,r)<\/span> 中第二个分量严格下降。非负整数不能无限下降，有限步内余数为 0。终止性不依赖输入大小，只依赖余数严格递减；最后非零余数即 gcd。若余数算成负值未回正，下降链条断裂，终止条件失效。<\/p>\n<h2>补充算例：互素与非互素对照<\/h2>\n<p><span class=\"katex-inline\">\\gcd(29,8)=1<\/span> 互素；<span class=\"katex-inline\">\\gcd(29,28)=1<\/span> 相邻整数互素；<span class=\"katex-inline\">\\gcd(12,18)=6<\/span>：<span class=\"katex-inline\">18=1\\cdot12+6<\/span>，<span class=\"katex-inline\">12=2\\cdot6+0<\/span>，最后非零余数 6。非互素情形 gcd 大于 1，约分除以 6 即可。两条路线取余规则相同，差别只在最后余数大小。<\/p>\n<h2>补充辨析：最坏情形与平均情形<\/h2>\n<p>定理 F 给最慢输入（斐波那契相邻项），推论 L 给最坏上界；平均步数由连续模型另析，量级低于最坏。随机输入大多不是斐波那契相邻项，实际步数更接近平均估计；上界是保险线，不是典型表现。<\/p>\n<h2>失败案例补充：带符号输入未取绝对值<\/h2>\n<p>负数直接进入取余，余数符号随语言实现；先取绝对值再辗转相除，符号最后合并。多精度余数比较、符号判断走 c09 竖式规则，gcd 主体对非负整数推进。<\/p>\n<h2>补充一层：gcd 在数论与算术章节的接口<\/h2>\n<p>模逆元、既约分数、多项式公因式都调用 gcd；c03 零增量序列的互素判断、c04 检验中的公因数核对同属 gcd 应用。辗转相除是连接分数算术、模运算与多项式公因子的枢纽算法。<\/p>\n<h2>补充推演：gcd 与模逆元的联系<\/h2>\n<p>若 <span class=\"katex-inline\">a<\/span> 与 <span class=\"katex-inline\">m<\/span> 互素，扩展辗转相除可求出 <span class=\"katex-inline\">ax+my=1<\/span>，<span class=\"katex-inline\">x<\/span> 即 <span class=\"katex-inline\">a<\/span> 模 <span class=\"katex-inline\">m<\/span> 的逆元。标准 gcd 只留最后非零余数，扩展版保留每步系数；两者取余流程相同。模逆元是 c03 零增量阶、模算术运算的基础工具，由 gcd 算法延伸得到。<\/p>\n<h2>补充算例：相邻整数互素<\/h2>\n<p><span class=\"katex-inline\">\\gcd(n,n+1)=1<\/span>：<span class=\"katex-inline\">n+1=1\\cdot n+1<\/span>，<span class=\"katex-inline\">n=n\\cdot1+0<\/span>，最后余数 1。相邻整数无公共因子，这是整数互素的常见情形；辗转相除一步即见分晓。<\/p>\n<h2>补充辨析：gcd 算法与分解算法<\/h2>\n<p>gcd 迭代取余求公因子，分解拆素因子；前者快且对数步数，后者难度高。不能用 gcd 结果替代素因子分解，多项式公因式（c12）与整数 gcd 同构。<\/p>\n<h2>补充一层：辗转相除在多精度上的落地<\/h2>\n<p>取余按 c09 多精度除法实现，余数非负且小于除式；步数对数于位数，大整数 gcd 仍可控。扩展版求模逆元保留每步系数，标准版只留最后余数。分数约分、多项式公因式都调用这一底层取余迭代。<\/p>\n<h2>补充一层：gcd 结果的使用边界<\/h2>\n<p>gcd 用于约分、互素判断、模逆元求解；不直接给出素因子分解。分数约分除以 gcd 后既约，多项式公因式按同一规则处理。把 gcd 当分解算法使用，是问题对象选错。<\/p>\n<h2>补充一层：步数上界的工程意义<\/h2>\n<p>最坏上界对数于位数，说明大整数辗转相除不会拖成线性长链；平均步数低于上界。工程上按上界留迭代预算，按平均估实际耗时，两者分开记。<\/p>\n<h2>补充一层：辗转相除的输入规范化<\/h2>\n<p>带符号输入先取绝对值；余数保持非负；最后非零余数即 gcd，符号单独合并。输入不规范化，取余链条在符号与大小比较上出错，终止条件失效。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n证明 <span class=\"katex-inline\">\\gcd(u,v)=\\gcd(v,u\\bmod v)<\/span>，双向说清公因数集合。\n<\/li><li>\n手算 <span class=\"katex-inline\">\\gcd(29,8)<\/span>，标出每步余数。\n<\/li><li>\n定理 F 中 <span class=\"katex-inline\">n<\/span> 步最坏输入对应哪两个斐波那契数？\n<\/li><li>\n商全为 1 为什么是最慢情形？\n<\/li><li>\n辗转相除与素因数分解为什么不能互相替代？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "最大公因数与欧几里得算法：连分数、最坏情形与斐波那契数"}, "c12": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷2 半数值算法.pdf · p.335<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">多精度经典算术：进位借位、竖式乘法与除法<\/a><\/span><\/div><h1>多项式算术：除法、因子分解、快速幂与多项式求值<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch04（原书 §4.6，PDF 第 335 页起）\n<\/ul>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>把运算对象从整数推广到系数串，就得到多项式：加减是同次幂系数合并，乘法是卷积展开。困难在于：多项式除法求商余、因子分解拆不可约因子、幂计算求 <span class=\"katex-inline\">u(x)^n<\/span>、求值算给定 <span class=\"katex-inline\">x<\/span> 处的 <span class=\"katex-inline\">u(x)<\/span>，各自输入输出不同，代价结构也不同。§4.6 把这些操作分门别类，与多精度算术对照：系数串对应数位串，卷积对应部分积累加，但系数所在代数系统不一定有除法逆元。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>多项式<\/strong>（书 §4.6 式 (1)，PDF 第 335 页）：<span class=\"katex-inline\">u(x)=u_nx^n+\\cdots+u_1x+u_0<\/span>，系数取自代数系统 <span class=\"katex-inline\">S<\/span>；<span class=\"katex-inline\">u_n\\ne0<\/span> 时 <span class=\"katex-inline\">\\deg(u)=n<\/span>，首项系数 <span class=\"katex-inline\">\\ell(u)=u_n<\/span>。零多项式约定 <span class=\"katex-inline\">\\deg(0)=-\\infty<\/span>，<span class=\"katex-inline\">\\ell(0)=0<\/span>。<\/p>\n<p><strong>加减<\/strong>：同次幂系数相加减。<\/p>\n<p><strong>乘法卷积<\/strong>：<span class=\"katex-inline\">w_k=\\sum_{i+j=k}u_i v_j<\/span>，<span class=\"katex-inline\">i&gt;r<\/span> 或 <span class=\"katex-inline\">j&gt;s<\/span> 时相应系数取零。<\/p>\n<p><strong>多项式除法<\/strong>：给出商式与余式；余式次数低于除式。<\/p>\n<p><strong>因子分解<\/strong>：把多项式拆成不可约因子的乘积。<\/p>\n<p><strong>幂的计算<\/strong>：求 <span class=\"katex-inline\">u(x)^n<\/span>；快速平方路线按指数二进制分解，逐次平方乘入。<\/p>\n<p><strong>求值<\/strong>：给定 <span class=\"katex-inline\">x<\/span>，计算 <span class=\"katex-inline\">u(x)<\/span>；霍纳方向把系数串嵌套合并，减少乘法次数。<\/p>\n<p><strong>正例<\/strong>：两个一次多项式相乘得二次多项式，卷积系数逐项对应；<span class=\"katex-inline\">x^2-1=(x-1)(x+1)<\/span> 是简单分解。<\/p>\n<p><strong>反例<\/strong>：系数取自模 <span class=\"katex-inline\">m<\/span> 系统时直接套整数除法规则，忽略系数环可能无逆元；多项式除式首项系数不可逆时商式无法按同一方式确定。<\/p>\n<h2>原理推导：除法的商余结构<\/h2>\n<p>被除式次数 <span class=\"katex-inline\">n<\/span>、除式次数 <span class=\"katex-inline\">m<\/span>（<span class=\"katex-inline\">n\\ge m<\/span>）：首项系数相除定商的最高次项，乘除式后从被除式减去，余式次数下降；重复到余式次数低于 <span class=\"katex-inline\">m<\/span>。每步不变量：当前余式等于原被除式减去已得商乘除式。快速幂：<span class=\"katex-inline\">n<\/span> 写成二进制，遇 1 把当前底乘入结果，底逐次平方；乘法次数随指数位数对数增长，优于逐个连乘。求值：霍纳格式 <span class=\"katex-inline\">u(x)=(\\cdots(u_nx+u_{n-1})x+\\cdots+u_0)<\/span>，<span class=\"katex-inline\">n<\/span> 次乘法完成 <span class=\"katex-inline\">n<\/span> 次多项式求值。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：系数系统的加法、乘法与所需逆元明确；除式首项系数在该系统中可逆。\n<\/li><li>\n失败案例 1：忽略系数环差异，把整数除法逆元规则套到模系数多项式上。\n<\/li><li>\n失败案例 2：幂计算逐个连乘，指数大时乘法次数线性膨胀；快速平方未被采用。\n<\/li><li>\n失败案例 3：求值按展开式逐项算幂，重复计算 <span class=\"katex-inline\">x<\/span> 的各次幂；霍纳嵌套更省乘法。\n<\/li><li>\n边界：因子分解的难度依赖系数域；有理数域、实数域、模 <span class=\"katex-inline\">p<\/span> 系统上不可约判定不同。幂级数方向（§4.7）把多项式操作推广到无穷项展开，求和与求逆规则另有限定。\n<\/ul>\n<p><strong>各操作的代价方向<\/strong>：多项式加减是线性合并系数；乘法卷积有 <span class=\"katex-inline\">(n+1)^2<\/span> 个乘积项，可借 c10 的分治思路降低阶；除法每步定一个商位，余式次数递减；幂计算用快速平方把乘法次数压到指数位数的对数量级；求值用霍纳嵌套把 <span class=\"katex-inline\">n<\/span> 次多项式压到 <span class=\"katex-inline\">n<\/span> 次乘法。系数取自整数、实数或模 <span class=\"katex-inline\">m<\/span> 系统时，加法乘法规则相同，除法逆元的存在性不同：模系数环里只有首项系数与模数互素才可逆，这是多项式除法与整数除法最容易混淆的地方。§4.6.2 的因子分解依赖系数域上的不可约判定，比带余除法更难，不能用同一套步骤硬套。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>多项式 vs 多精度整数<\/strong>：系数串与数位串同构，卷积与部分积相通；差别是多项式没有&quot;进位&quot;，相邻系数间不向前溢出。\n<\/li><li>\n<strong>除法 vs 因子分解<\/strong>：除法求商余，分解求不可约因子；前者是带余除法，后者是因式结构拆解。\n<\/li><li>\n<strong>快速幂 vs 逐个连乘<\/strong>：前者按二进制对数次乘法，后者线性次；对象可以是多项式也可以是整数。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c09 多精度竖式与卷积、c11 辗转相除与最大公因数。后继：§4.7 把多项式操作推广到幂级数；c10 快速乘法思路可迁移到多项式卷积。多项式算术是整数运算在系数对象上的自然延伸。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（多项式算术：除法、因子分解、快速幂与多项式求值）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：多项式除法商余、快速幂与霍纳求值的推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>多项式算术往回追四层：<\/p>\n<ol><li>\n<strong>系数串<\/strong>：多项式按幂次排列系数，对应数位串（c07、c09）。\n<\/li><li>\n<strong>加减卷积<\/strong>：同次幂合并，乘法按 <span class=\"katex-inline\">w_k=\\sum_{i+j=k}u_iv_j<\/span> 展开。\n<\/li><li>\n<strong>带余除法<\/strong>：首项定商位，乘减降次，余式次数低于除式。\n<\/li><li>\n<strong>幂与求值<\/strong>：快速平方压乘法次数，霍纳嵌套减少求值乘法。\n<\/ol>\n<p>依赖链方向：系数串 → 加减卷积 → 商余除法 → 快速幂与求值。<\/p>\n<h2>正向推导：多项式除法商余<\/h2>\n<p>被除式次数 <span class=\"katex-inline\">n<\/span>、除式次数 <span class=\"katex-inline\">m<\/span>（<span class=\"katex-inline\">n\\ge m<\/span>）。<\/p>\n<ol><li>\n首项系数相除，定商的最高次项。\n<\/li><li>\n商位乘除式，从被除式减去。\n<\/li><li>\n余式次数下降，重复到余式次数低于 <span class=\"katex-inline\">m<\/span>。\n<\/ol>\n<p>不变量：当前余式等于原被除式减去已得商乘除式。除式首项系数必须在系数系统中可逆，商位才能确定。<\/p>\n<h2>数值算例一：<span class=\"katex-inline\">(x^2-3x+2)\\div(x-1)<\/span><\/h2>\n<p>首项 <span class=\"katex-inline\">x^2/x=x<\/span>，商位 <span class=\"katex-inline\">x<\/span>；<span class=\"katex-inline\">x(x-1)=x^2-x<\/span>，减去得 <span class=\"katex-inline\">-2x+2<\/span>。再首项 <span class=\"katex-inline\">-2x/x=-2<\/span>，商位 <span class=\"katex-inline\">-2<\/span>；<span class=\"katex-inline\">-2(x-1)=-2x+2<\/span>，减去余 0。商式 <span class=\"katex-inline\">x-2<\/span>，余式 0；<span class=\"katex-inline\">x^2-3x+2=(x-1)(x-2)<\/span>。<\/p>\n<h2>正向推演：快速幂<\/h2>\n<p>求 <span class=\"katex-inline\">u(x)^n<\/span>。指数 <span class=\"katex-inline\">n<\/span> 写二进制，逐位扫描：底逐次平方；遇二进制位 1，把当前底乘入结果。乘法次数随指数位数对数增长，优于逐个连乘。<\/p>\n<p><strong>算例：<span class=\"katex-inline\">x^{10}<\/span><\/strong>。<span class=\"katex-inline\">10<\/span> 二进制 <span class=\"katex-inline\">1010<\/span>。初始结果 1，底 <span class=\"katex-inline\">x<\/span>：位 0 跳过，底平方 <span class=\"katex-inline\">x^2<\/span>；位 1 为 1，结果 <span class=\"katex-inline\">x^2<\/span>；底平方 <span class=\"katex-inline\">x^4<\/span>；位 0 跳过；底平方 <span class=\"katex-inline\">x^8<\/span>；位 1 为 1，结果 <span class=\"katex-inline\">x^2\\cdot x^8=x^{10}<\/span>。四次平方加一次乘入，少于十次连乘。<\/p>\n<h2>正向推演：霍纳求值<\/h2>\n<p><span class=\"katex-inline\">u(x)=u_nx^n+\\cdots+u_1x+u_0<\/span> 改写成<\/p>\n<div class=\"katex-block\">u(x)=(\\cdots((u_nx+u_{n-1})x+u_{n-2})x+\\cdots+u_0)<\/div>\n<p><span class=\"katex-inline\">n<\/span> 次乘法完成 <span class=\"katex-inline\">n<\/span> 次多项式求值，不必逐项算 <span class=\"katex-inline\">x<\/span> 的各次幂。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>套整数除法逆元<\/strong>：模系数环里首项系数不与模数互素时不可逆，商式无法按同一方式确定；系数系统先查清逆元存在性。<\/p>\n<p><strong>幂计算逐个连乘<\/strong>：指数大时乘法次数线性膨胀，快速平方未被采用。<\/p>\n<p><strong>求值按展开式硬算<\/strong>：重复计算 <span class=\"katex-inline\">x<\/span> 的各次幂，乘法次数高于霍纳嵌套。<\/p>\n<p><strong>因子分解硬套带余除法<\/strong>：分解求不可约因子，依赖系数域上的不可约判定，与商余除法不是同一套步骤。<\/p>\n<h2>延伸推演：与多精度乘法对照<\/h2>\n<p>多项式卷积的 <span class=\"katex-inline\">(n+1)^2<\/span> 个乘积项与大整数竖式乘法同构，分治思路（c10）可迁移；差别是多项式相邻系数间不进位。§4.7 把这些操作推广到幂级数，求和与求逆规则另有限定。<\/p>\n<h2>延伸一层：卷积公式的逐项核对<\/h2>\n<p>乘法 <span class=\"katex-inline\">u(x)v(x)<\/span>，系数 <span class=\"katex-inline\">w_k=\\sum_{i+j=k}u_iv_j<\/span>。<span class=\"katex-inline\">i&gt;r<\/span> 或 <span class=\"katex-inline\">j&gt;s<\/span> 时相应系数取零；<span class=\"katex-inline\">k<\/span> 从 0 到 <span class=\"katex-inline\">r+s<\/span>。每个 <span class=\"katex-inline\">u_i<\/span> 乘 <span class=\"katex-inline\">v_j<\/span> 贡献到 <span class=\"katex-inline\">w_{i+j}<\/span>，与整数部分积按位错开累加同构。差别：多项式相邻系数间不向前进位，整数数位满 <span class=\"katex-inline\">b<\/span> 则进位；其余卷积结构一致。<\/p>\n<h2>数值算例二：两个一次多项式相乘<\/h2>\n<p><span class=\"katex-inline\">(x+1)(x+2)=x^2+3x+2<\/span>。卷积：<span class=\"katex-inline\">w_0=1\\cdot2=2<\/span>，<span class=\"katex-inline\">w_1=1\\cdot2+1\\cdot1=3<\/span>，<span class=\"katex-inline\">w_2=1\\cdot1=1<\/span>。对照整数 <span class=\"katex-inline\">11\\times12=132<\/span>，数位卷积同形但不进位；若系数出现大于基数的值，多项式不折进位，整数则进位归一。<\/p>\n<h2>延伸推演：快速幂的二进制扫描<\/h2>\n<p>指数 <span class=\"katex-inline\">n<\/span> 写成二进制，从高位到低位扫描：底逐次平方，遇位 1 把底乘入结果。乘法次数 = 位数次平方 + 1 的个数次乘入，对数于指数位数。逐个连乘要 <span class=\"katex-inline\">n-1<\/span> 次乘法；指数越大，快速平方优势越明显。对象可以是多项式，也可以是整数，规则相同。<\/p>\n<h2>对照辨析：多项式除法与整数带余除法<\/h2>\n<p>两者都是首项定商位、乘减降次；差别在系数逆元：整数除式天然有逆，多项式系数环里首项系数必须可逆。模 <span class=\"katex-inline\">p<\/span> 系数系统中，首项系数与 <span class=\"katex-inline\">p<\/span> 互素才可逆，否则商式无法按同一方式确定。套用整数除法规则前，先确认系数环的逆元存在性。<\/p>\n<h2>失败案例补充：因子分解与带余除法混用<\/h2>\n<p>带余除法求商余，分解求不可约因子；后者依赖系数域上的不可约判定，不是除法的重复执行。把除不尽当成分解失败，或用试除替代不可约判定，都是步骤错位。幂级数方向（§4.7）另有无穷项求和求逆规则，不能套多项式有限除法。<\/p>\n<h2>再推一层：与多精度算术的结构对照<\/h2>\n<p>多项式系数串对应数位串，卷积对应部分积累加；c10 分治减少乘法次数的思路可迁移到多项式乘积。没有进位是多项式与整数运算的核心差别。求值霍纳嵌套、快速幂平方路线，都是把重复乘法压到对数或线性最少次数，与 c09 竖式、c10 分治同属代价优化链条。<\/p>\n<h2>补充推演：多项式次数与首项系数<\/h2>\n<p><span class=\"katex-inline\">\\deg(u)=n<\/span> 要求 <span class=\"katex-inline\">u_n\\ne0<\/span>；零多项式约定 <span class=\"katex-inline\">\\deg(0)=-\\infty<\/span>。除法中商的次数等于被除式次数减除式次数；余式次数低于除式。首项系数 <span class=\"katex-inline\">\\ell(u)=u_n<\/span> 决定除法商位的第一步系数，系数环中它必须可逆。次数边界与整数数位边界对应：余式次数压到除式以下，余数小于除式。<\/p>\n<h2>补充算例：霍纳求值手算<\/h2>\n<p><span class=\"katex-inline\">u(x)=2x^3+3x^2+x+5<\/span>，代入 <span class=\"katex-inline\">x=2<\/span>：<span class=\"katex-inline\">((2\\cdot2+3)\\cdot2+1)\\cdot2+5=((7)\\cdot2+1)\\cdot2+5=15\\cdot2+5=35<\/span>。核验展开：<span class=\"katex-inline\">16+12+2+5=35<\/span>。三次乘法完成三次多项式求值，不必先算 <span class=\"katex-inline\">x^2,x^3<\/span>。<\/p>\n<h2>补充辨析：多项式乘法与整数乘法<\/h2>\n<p>卷积结构相同，差别在进位：整数数位满 <span class=\"katex-inline\">b<\/span> 进位，多项式系数间不进位。模 <span class=\"katex-inline\">m<\/span> 多项式算术里系数按模 <span class=\"katex-inline\">m<\/span> 运算，同样不产生数位进位。把整数进位规则套到多项式，系数会被错误折位。<\/p>\n<h2>失败案例补充：系数逆元缺失仍定商位<\/h2>\n<p>模系数环中首项系数与模数不互素时不可逆，商位无法确定；硬除会得到错误商式。先查系数环逆元存在性，再决定除法路线。因子分解依赖不可约判定，不能用带余除法反复执行替代。<\/p>\n<h2>补充一层：多项式操作与多精度、快速幂的链条<\/h2>\n<p>卷积复用 c09 部分积结构，分治减乘迁移自 c10；快速幂与霍纳都是减少重复乘法的路线。§4.7 幂级数把有限多项式推广到无穷项，求和求逆规则另定。多项式算术是整数运算在系数对象上的延伸。<\/p>\n<h2>补充推演：多项式加减乘的次数边界<\/h2>\n<p>加减结果次数不超过两多项式次数最大值；乘积次数为次数之和。卷积 <span class=\"katex-inline\">w_k<\/span> 覆盖 <span class=\"katex-inline\">k=0<\/span> 到 <span class=\"katex-inline\">r+s<\/span>。次数边界与整数位数边界对应：余式次数低于除式，余数小于除式。系数环不同，加减乘规则相同，除法逆元条件不同。<\/p>\n<h2>补充算例：快速幂的平方链<\/h2>\n<p><span class=\"katex-inline\">x^{10}=x^8\\cdot x^2<\/span>，指数 10 二进制 1010：四次平方（<span class=\"katex-inline\">x^2,x^4,x^8,x^{16}<\/span> 方向）加一次乘入。指数位数决定平方次数，1 的个数决定乘入次数；逐个连乘要九次乘法，指数越大差距越大。<\/p>\n<h2>补充辨析：多项式除法与整数除法<\/h2>\n<p>首项定商位、乘减降次流程相同；差别在系数逆元。模 <span class=\"katex-inline\">p<\/span> 系统首项系数与 <span class=\"katex-inline\">p<\/span> 互素才可逆，否则商式无法确定。因式分解是不可约因子拆解，不是除法重复执行。<\/p>\n<h2>失败案例补充：系数环逆元未查<\/h2>\n<p>直接套整数除法逆元规则到模系数多项式，商位出错；先确认首项系数在系数环可逆。幂级数无穷项求和求逆另立规则，不套用有限多项式除法。<\/p>\n<h2>补充一层：多项式操作的代价分层<\/h2>\n<p>加减线性合并系数；乘法卷积 <span class=\"katex-inline\">(n+1)^2<\/span> 项，可借分治降阶；除法逐位定商；快速幂对数次乘法；霍纳求值 <span class=\"katex-inline\">n<\/span> 次乘法。各操作代价结构不同，选型先分清求商余、分解、乘幂还是求值，再选对应算法，不把一种流程套到全部操作上。<\/p>\n<h2>补充一层：系数环的先查清单<\/h2>\n<p>做多项式除法前，先查首项系数在系数环是否可逆；模 <span class=\"katex-inline\">p<\/span> 系统中要求与 <span class=\"katex-inline\">p<\/span> 互素。加减乘不依赖逆元，除法依赖。因子分解另需不可约判定，与带余除法分属不同操作清单。<\/p>\n<h2>补充一层：多项式与整数乘法的对照清单<\/h2>\n<p>卷积公式相同，进位规则不同：整数满 <span class=\"katex-inline\">b<\/span> 进位，多项式系数间不折位。模 <span class=\"katex-inline\">m<\/span> 多项式系数按模运算，同样无数位进位。混淆两套规则会把系数错误折位，对照清单先确认对象是数位串还是系数串。<\/p>\n<h2>补充一层：多项式操作的选型顺序<\/h2>\n<p>先判目标：求商余走除法，求因子走分解，求幂走快速幂，代入求值走霍纳。四类操作输入输出与代价结构不同，混在一套流程里会选错算法。系数环逆元条件在除法前先查，分解的不可约判定另立标准。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出卷积系数 <span class=\"katex-inline\">w_k<\/span> 的公式。\n<\/li><li>\n手算 <span class=\"katex-inline\">(x^2-3x+2)\\div(x-1)<\/span> 的商与余式。\n<\/li><li>\n快速幂为什么乘法次数对数于指数位数？\n<\/li><li>\n霍纳格式把 <span class=\"katex-inline\">n<\/span> 次多项式压到几次乘法？\n<\/li><li>\n多项式除法在什么条件下商位无法确定？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "多项式算术：除法、因子分解、快速幂与多项式求值"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：均匀随机数的生成：线性同余法、周期与参数选择<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 3 章 3.1–3.2：均匀随机数的生成（引言、线性同余法与其他方法）<\/a><br>检查点：能写出递推式 $X_{n+1}=(aX_n+c)\\bmod m$，逐条列出定理 A 的三个全周期条件，手算一个小模数序列并指出周期长度，说明模与乘数选错会怎样缩短周期<\/li><li class='path-step' id='path-02'><strong>步骤 02：检验随机性：经验检验、谱检验与其他随机量<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 3 章 3.3–3.5：随机数的统计检验、其他随机量与随机序列<\/a><br>检查点：能解释卡方检验比较观测频数与期望频数的思路，说清谱检验把相邻随机数看成格点的视角，讲出从均匀偏差到指定分布、抽样与洗牌的基本路线<\/li><li class='path-step' id='path-03'><strong>步骤 03：算术基础：记数系统、浮点误差与多精度运算<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 4 章 4.1–4.4：记数系统、浮点算术、多精度算术与进制转换<\/a><br>检查点：能在两种进制间转换数的表示，写出浮点对数 $(e,f)$ 的形式与规范化条件，说明舍入累积误差的来源，走通多精度加减乘除的竖式进位流程，比较平方算法与分治乘法的复杂度<\/li><li class='path-step' id='path-04'><strong>步骤 04：有理数与多项式：最大公因数、欧几里得分析与多项式运算<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章 4.5–4.7：有理数算术、最大公因数、多项式算术与幂级数操作<\/a><br>检查点：能手算两数的辗转相除步骤，说出最坏情形对应连续斐波那契数及步数上界，区分多项式除法、因式分解、快速幂与求值各自的输入输出和适用对象<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='线性同余序列（linear congruential sequence）'>线性同余序列（linear congruential sequence） — 由递推 $X_{n+1}=(aX_n+c)\\bmod m$ 生成的整数序列；$m$ 为模，$a$ 为乘数，$c$ 为增量，$X_0$ 为初值，均匀偏差 $U_n=X_n/m$ 落在 0 与 1 之间 <span class=glossary-ref>（第 3 章 3.1–3.2：均匀随机数的生成（引言、线性同余法与其他方法））<\/span><\/li><li data-term='周期（period）'>周期（period） — 序列进入无休止重复之前循环所经历的项数；同余序列总会陷入循环，周期长度不超过模 $m$ <span class=glossary-ref>（第 3 章 3.1–3.2：均匀随机数的生成（引言、线性同余法与其他方法））<\/span><\/li><li data-term='全周期（full period）'>全周期（full period） — 周期长度等于模 $m$，一轮内遍历 $0,1,\\dots,m-1$ 全部值；定理 A 给出达到全周期的充要条件 <span class=glossary-ref>（第 3 章 3.1–3.2：均匀随机数的生成（引言、线性同余法与其他方法））<\/span><\/li><li data-term='势 / 阶（order）'>势 / 阶（order） — 零增量情形 $c=0$ 下，满足 $a^s\\equiv 1\\pmod m$ 的最小正整数 $s$；它决定乘法同余序列的周期长度 <span class=glossary-ref>（第 3 章 3.1–3.2：均匀随机数的生成（引言、线性同余法与其他方法））<\/span><\/li><li data-term='卡方检验（chi-square test）'>卡方检验（chi-square test） — 把观测频数与均匀分布下的期望频数对照，按 $(观测-期望)^2/期望$ 求和得到统计量，判断序列与均匀分布的偏离程度 <span class=glossary-ref>（第 3 章 3.3–3.5：随机数的统计检验、其他随机量与随机序列）<\/span><\/li><li data-term='谱检验（spectral test）'>谱检验（spectral test） — 针对线性同余发生器的理论检验：把相邻若干项看成高维格中的点，考察格的间距与覆盖，格越密越均匀；它同时利用全周期性质与计算机计算 <span class=glossary-ref>（第 3 章 3.3–3.5：随机数的统计检验、其他随机量与随机序列）<\/span><\/li><li data-term='均匀偏差（uniform deviate）'>均匀偏差（uniform deviate） — 在 0 与 1 之间均匀分布的随机实数；其他分布的随机量通常由均匀偏差经变换得到 <span class=glossary-ref>（第 3 章 3.3–3.5：随机数的统计检验、其他随机量与随机序列）<\/span><\/li><li data-term='按位记数法（positional number system）'>按位记数法（positional number system） — 以 $b$ 为基数，数写成 $(\\dots a_2a_1a_0.a_{-1}\\dots)_b=\\sum a_kb^k$，每位数字满足 $0\\le a_k&lt;b$ <span class=glossary-ref>（第 4 章 4.1–4.4：记数系统、浮点算术、多精度算术与进制转换）<\/span><\/li><li data-term='浮点数 $(e,f)$'>浮点数 $(e,f)$ — 用一对对数标记的数 $f\\times b^{e-q}$，$e$ 为指数部分，$f$ 为带符号小数部分；规范化要求 $f$ 的最高位不含有效零 <span class=glossary-ref>（第 4 章 4.1–4.4：记数系统、浮点算术、多精度算术与进制转换）<\/span><\/li><li data-term='多精度算术（multiple-precision arithmetic）'>多精度算术（multiple-precision arithmetic） — 把超过单字长的数拆成 $b$ 进制数位串，按竖式规则实现加减乘除；运算代价随位数增长 <span class=glossary-ref>（第 4 章 4.1–4.4：记数系统、浮点算术、多精度算术与进制转换）<\/span><\/li><li data-term='欧几里得算法（euclidean algorithm）'>欧几里得算法（Euclidean algorithm） — 反复用 $u=qv+r$ 取余，把较大数换成余数，直到余数为 0，最后非零余数即最大公因数；其步数与连分数、斐波那契数相联系 <span class=glossary-ref>（第 4 章 4.5–4.7：有理数算术、最大公因数、多项式算术与幂级数操作）<\/span><\/li><li data-term='多项式（polynomial）'>多项式（polynomial） — 形如 $u(x)=u_nx^n+\\cdots+u_1x+u_0$ 的表达式，系数取自代数系统 $S$；多项式算术包括加减乘除、因子分解、幂计算与求值 <span class=glossary-ref>（第 4 章 4.5–4.7：有理数算术、最大公因数、多项式算术与幂级数操作）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库<\/h1>\n<h2>模式 1：参数选择先分约束，再逐项核验<\/h2>\n<p>发生器参数分开看模、乘数、增量、初值各自的约束：模管周期天花板与取模速度，乘数管轨道形状，增量管平移，初值管入口。核验时先列素因子分解，再逐条对条件，不把四个参数搅在一起试算。周期条件过关后再进统计检验，门槛与验收分层。<\/p>\n<h2>模式 2：周期合格不等于随机，结构检验兜底<\/h2>\n<p>长周期只保证遍历不重复，不保证散布均匀。等差序列可以周期拉满却结构外露。验收路线：经验检验筛样本偏斜，谱检验查全周期格结构，两类互补；通过多项检验只是提高把握，不出具随机证明。<\/p>\n<h2>模式 3：分段映射先守恒概率，再核对边界<\/h2>\n<p>离散分布变换按累计概率切段，段长等于目标概率；边界归属固定左闭右开。先确认原料 <span class=\"katex-inline\">U<\/span> 均匀，再查分段边界与归属；原料偏斜会被变换放大，不在变换环节补救。<\/p>\n<h2>模式 4：记数表示先定基数规则，再做转换<\/h2>\n<p>数位权重 <span class=\"katex-inline\">b^k<\/span>、数位范围 <span class=\"katex-inline\">0\\le a_k&lt;b<\/span>、进位按 <span class=\"katex-inline\">b<\/span> 折算三条规则先立住；整数除基取余、小数乘基取整，转换后回代展开式核验。循环小数按精度截断并标注舍入，不把近似当精确值。<\/p>\n<h2>模式 5：浮点运算先排对齐、规范化、舍入次序<\/h2>\n<p>对齐尾数→运算→规范化→舍入→边界检查，次序固定。加法从小量级累加减少吞位；相近大数相减先评估有效位损失；上溢下溢单独标记。指数撑范围，尾数定精度，两者不互相替代。<\/p>\n<h2>模式 6：多精度竖式先估位数边界，再推进数位<\/h2>\n<p>加减多一位，乘积 <span class=\"katex-inline\">m+n<\/span> 位，商余按公式落位；进位借位单独成串传递，不压本位寄存器。余数非负且小于除式。经典竖式作正确性基准，大位数再上分治改进。<\/p>\n<h2>模式 7：算法选型先辨对象类型，再套流程<\/h2>\n<p>gcd 求公因子不替代素因子分解；多项式除法先查系数逆元；快速幂、霍纳求值、卷积各有代价结构。拿到问题先判目标是求商余、分解、乘幂还是求值，再选对应算法，不把一套流程硬套到全部操作上。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 均匀随机数的生成<\/strong>：线性同余递推、周期上界、定理 A 全周期条件、模与乘数选择、零增量的阶（PDF 第 12、19、20、24、29 页起；印刷页 = PDF 页 − 11）。\n<\/li><li>\n<strong>第 2 章 检验与其他随机量<\/strong>：卡方与经验检验、谱检验格结构、均匀偏差到其他分布的变换、抽样与洗牌（PDF 第 43、81、101 页起）。\n<\/li><li>\n<strong>第 3 章 记数、浮点与多精度算术<\/strong>：按位记数与进制转换、浮点规范化与误差界、多精度竖式、乘法复杂度（PDF 第 158、174、214、236 页起）。\n<\/li><li>\n<strong>第 4 章 有理数与多项式算术<\/strong>：gcd 与辗转相除、斐波那契最坏情形、多项式除法/分解/快速幂/求值（PDF 第 265、267、277、335 页起）。\n<\/ul>\n<h2>线性同余发生器<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>量<\/th><th>记号<\/th><th>取值范围<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td>模<\/td><td><span class=\"katex-inline\">m<\/span><\/td><td><span class=\"katex-inline\">0&lt;m<\/span><\/td><td>周期天花板，取模空间<\/td><\/tr><tr><td>乘数<\/td><td><span class=\"katex-inline\">a<\/span><\/td><td><span class=\"katex-inline\">0\\le a&lt;m<\/span><\/td><td>轨道形状<\/td><\/tr><tr><td>增量<\/td><td><span class=\"katex-inline\">c<\/span><\/td><td><span class=\"katex-inline\">0\\le c&lt;m<\/span><\/td><td>平移偏移<\/td><\/tr><tr><td>初值<\/td><td><span class=\"katex-inline\">X_0<\/span><\/td><td><span class=\"katex-inline\">0\\le X_0&lt;m<\/span><\/td><td>循环入口<\/td><\/tr><\/tbody><\/table><\/div>\n<p>递推：<span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span>，<span class=\"katex-inline\">U_n=X_n/m<\/span>。<\/p>\n<h2>定理 A 全周期三条件<\/h2>\n<ol><li>\n<span class=\"katex-inline\">\\gcd(c,m)=1<\/span>；\n<\/li><li>\n对每个整除 <span class=\"katex-inline\">m<\/span> 的素数 <span class=\"katex-inline\">p<\/span>，<span class=\"katex-inline\">p\\mid(a-1)<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">4\\mid m<\/span> 时 <span class=\"katex-inline\">4\\mid(a-1)<\/span>。\n<\/ol>\n<h2>检验角度对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>检验<\/th><th>考察对象<\/th><th>统计量方向<\/th><\/tr><\/thead><tbody><tr><td>卡方<\/td><td>单变量频数分布<\/td><td><span class=\"katex-inline\">\\sum(N_s-E_s)^2/E_s<\/span><\/td><\/tr><tr><td>连检验<\/td><td>相邻次序延续长度<\/td><td>各长度连的个数对照期望<\/td><\/tr><tr><td>配对检验<\/td><td>二元组合落点<\/td><td>象限/格子点数对照期望<\/td><\/tr><tr><td>谱检验<\/td><td>全周期格结构<\/td><td>平行面间距<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>记数与浮点<\/h2>\n<ul><li>\n<span class=\"katex-inline\">b<\/span> 进制展开：<span class=\"katex-inline\">\\sum a_kb^k<\/span>，<span class=\"katex-inline\">0\\le a_k&lt;b<\/span>。\n<\/li><li>\n浮点对：<span class=\"katex-inline\">f\\times b^{e-q}<\/span>，<span class=\"katex-inline\">|f|&lt;1<\/span>，规范化挤掉前导零。\n<\/li><li>\n误差：单步相对误差与 <span class=\"katex-inline\">b^{-p}<\/span> 同阶，多步累积；相近大数相减损失有效位。\n<\/ul>\n<h2>多精度与多项式<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>操作<\/th><th>代价/规则<\/th><\/tr><\/thead><tbody><tr><td>竖式乘法<\/td><td><span class=\"katex-inline\">mn<\/span> 次单步，<span class=\"katex-inline\">n<\/span> 位平方阶<\/td><\/tr><tr><td>分治乘法<\/td><td><span class=\"katex-inline\">T(n)=3T(n/2)+O(n)<\/span>，<span class=\"katex-inline\">O(n^{1.585})<\/span><\/td><\/tr><tr><td>辗转相除<\/td><td>余数严格递减，最坏步数对数于位数<\/td><\/tr><tr><td>多项式卷积<\/td><td><span class=\"katex-inline\">w_k=\\sum_{i+j=k}u_iv_j<\/span><\/td><\/tr><tr><td>快速幂<\/td><td>指数二进制扫描，对数次乘法<\/td><\/tr><tr><td>霍纳求值<\/td><td><span class=\"katex-inline\">n<\/span> 次乘法完成 <span class=\"katex-inline\">n<\/span> 次多项式<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>最坏情形对照<\/h2>\n<ul><li>\n欧几里得算法最慢输入：连续斐波那契数 <span class=\"katex-inline\">u=F_{n+2}<\/span>，<span class=\"katex-inline\">v=F_{n+1}<\/span>。\n<\/li><li>\n步数上界：<span class=\"katex-inline\">\\lceil\\log_\\phi((3-\\phi)N)\\rceil<\/span>。\n<\/ul>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/计算机程序设计艺术-卷2-半数值算法-THE-ART-OF-COMPUTER-P-6", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 3 章 3.1–3.2：均匀随机数的生成（引言、线性同余法与其他方法）", "href": "#/chapter/ch01"}, {"label": "第 3 章 3.3–3.5：随机数的统计检验、其他随机量与随机序列", "href": "#/chapter/ch02"}, {"label": "第 4 章 4.1–4.4：记数系统、浮点算术、多精度算术与进制转换", "href": "#/chapter/ch03"}, {"label": "第 4 章 4.5–4.7：有理数算术、最大公因数、多项式算术与幂级数操作", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "线性同余发生器：递推式、均匀偏差与序列循环", "href": "#/concept/c01"}, {"label": "全周期定理 A（Hull-Dobell）：周期达到模数的充要条件", "href": "#/concept/c02"}, {"label": "模、乘数与势：模数选择、乘数选择与零增量时的阶", "href": "#/concept/c03"}, {"label": "卡方检验与经验检验：均匀性、连检验与配对检验", "href": "#/concept/c04"}, {"label": "谱检验：相邻随机数的格结构与发生器质量判断", "href": "#/concept/c05"}, {"label": "从均匀偏差到其他分布：数值分布、随机抽样与洗牌", "href": "#/concept/c06"}, {"label": "按位记数系统与进制转换", "href": "#/concept/c07"}, {"label": "浮点表示、规范化与舍入误差界", "href": "#/concept/c08"}, {"label": "多精度经典算术：进位借位、竖式乘法与除法", "href": "#/concept/c09"}, {"label": "大整数乘法的复杂度：从平方算法到分治快速乘法", "href": "#/concept/c10"}, {"label": "最大公因数与欧几里得算法：连分数、最坏情形与斐波那契数", "href": "#/concept/c11"}, {"label": "多项式算术：除法、因子分解、快速幂与多项式求值", "href": "#/concept/c12"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 3 章 3.1–3.2：均匀随机数的生成（引言、线性同余法与其他方法）", "href": "#/quiz/ch01"}, {"label": "测验：第 3 章 3.3–3.5：随机数的统计检验、其他随机量与随机序列", "href": "#/quiz/ch02"}, {"label": "测验：第 4 章 4.1–4.4：记数系统、浮点算术、多精度算术与进制转换", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章 4.5–4.7：有理数算术、最大公因数、多项式算术与幂级数操作", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷2 半数值算法.pdf · p.12<\/div><h1>第 3 章 3.1–3.2：均匀随机数的生成（引言、线性同余法与其他方法）<\/h1>\n<blockquote>对应原书第 3 章 3.1–3.2 节（印刷页 1–31，PDF 第 12–42 页；正文偏移 k=11，即 PDF 页 = 印刷页 + 11）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出随机数在仿真、抽样、数值分析、算法测试、决策、密码学与娱乐等场景里的用途，区分&quot;算术方法生成的伪随机数&quot;与真正随机的物理量；\n<\/li><li>\n写出线性同余递推式 <span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span>，说清 <span class=\"katex-inline\">m<\/span>、<span class=\"katex-inline\">a<\/span>、<span class=\"katex-inline\">c<\/span>、<span class=\"katex-inline\">X_0<\/span> 四个参数各自的取值范围；\n<\/li><li>\n手算一个小模数序列，指出它何时回到初值、周期是多少；\n<\/li><li>\n逐条复述定理 A（Hull-Dobell）判定全周期的三个条件，并能拿一组参数核验；\n<\/li><li>\n说明模数 <span class=\"katex-inline\">m<\/span>、乘数 <span class=\"katex-inline\">a<\/span> 与零增量情形的阶怎样影响周期长度，知道长周期只是随机性的必要条件而非充分条件。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>计算机不能凭空掷骰子，只能用确定性的算术规则造出一串看起来均匀、独立的数；线性同余法是其中最流行的构造：在整数环上做&quot;乘加再取模&quot;，把整数序列除以 <span class=\"katex-inline\">m<\/span> 得到 0 与 1 之间的均匀偏差。生成器的好坏先由周期长度把关，再由后面章节的统计检验与谱检验把关。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：线性同余发生器与递推序列（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。§3.2 先说明目标是生成 0 与 1 之间均匀分布的随机实数 <span class=\"katex-inline\">U_n<\/span>；计算机只能表示有限精度实数，于是实际生成 0 与 <span class=\"katex-inline\">m<\/span> 之间的整数 <span class=\"katex-inline\">X_n<\/span>，再令 <span class=\"katex-inline\">U_n=X_n/m<\/span>（PDF 第 19 页）。§3.2.1 线性同余法取四个整数：模 <span class=\"katex-inline\">m<\/span>（<span class=\"katex-inline\">0&lt;m<\/span>）、乘数 <span class=\"katex-inline\">a<\/span>（<span class=\"katex-inline\">0\\le a&lt;m<\/span>）、增量 <span class=\"katex-inline\">c<\/span>（<span class=\"katex-inline\">0\\le c&lt;m<\/span>）、初值 <span class=\"katex-inline\">X_0<\/span>（<span class=\"katex-inline\">0\\le X_0&lt;m<\/span>），按 <span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span> 递推。书里给出的小例子：<span class=\"katex-inline\">m=10<\/span>，<span class=\"katex-inline\">X_0=a=c=7<\/span>，序列为 <span class=\"katex-inline\">7,6,9,0,7,6,9,0,\\dots<\/span>，周期为 4。同余序列总会陷入循环，这种重复的循环称为周期；有用的序列应当具有较长的周期。<\/p>\n<h3>2. 概念 2：全周期定理 A（Hull-Dobell）（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。§3.2.1.2 分析乘数选择时给出定理 A：由 <span class=\"katex-inline\">m<\/span>、<span class=\"katex-inline\">a<\/span>、<span class=\"katex-inline\">c<\/span>、<span class=\"katex-inline\">X_0<\/span> 定义的线性同余序列具有周期 <span class=\"katex-inline\">m<\/span>（全周期），当且仅当三条同时成立：(i) <span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">m<\/span> 互素；(ii) 对每个整除 <span class=\"katex-inline\">m<\/span> 的素数 <span class=\"katex-inline\">p<\/span>，<span class=\"katex-inline\">b=a-1<\/span> 是 <span class=\"katex-inline\">p<\/span> 的倍数；(iii) 如果 <span class=\"katex-inline\">m<\/span> 是 4 的倍数，则 <span class=\"katex-inline\">b<\/span> 是 4 的倍数（PDF 第 24 页）。定理把&quot;周期能否拉满&quot;从试算变成数论条件核验：三条逐条对照参数即可，不必把整轮序列跑一遍。书里注明这条定理在 <span class=\"katex-inline\">c=1<\/span>、<span class=\"katex-inline\">X_0=0<\/span> 的特例上的证明思想可追溯到更早，一般情形的充分性由赫尔（Thomas Hull）与艾伦·多贝尔（Alan Dobell）证明。<\/p>\n<h3>3. 概念 3：模、乘数与势（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。§3.2.1.1 先排除 <span class=\"katex-inline\">a=1<\/span>：此时 <span class=\"katex-inline\">X_n=(X_0+nc)\\bmod m<\/span>，序列按固定步长走，不像随机序列；<span class=\"katex-inline\">a=0<\/span> 更糟。模数 <span class=\"katex-inline\">m<\/span> 希望取大，因为周期中的元素不可能超过 <span class=\"katex-inline\">m<\/span> 个；选 <span class=\"katex-inline\">m<\/span> 还要考虑生成速度，若 <span class=\"katex-inline\">m<\/span> 取计算机字大小 <span class=\"katex-inline\">w<\/span>，乘法与取模可以靠寄存器高位低位直接完成，避免慢速除法。§3.2.1.3 讨论&quot;势&quot;：当 <span class=\"katex-inline\">c=0<\/span> 时生成过程快一点，但周期被缩短；此时序列周期由 <span class=\"katex-inline\">a<\/span> 模 <span class=\"katex-inline\">m<\/span> 的阶决定，即满足 <span class=\"katex-inline\">a^s\\equiv 1\\pmod m<\/span> 的最小正整数 <span class=\"katex-inline\">s<\/span>。书里还给出机器基数 <span class=\"katex-inline\">z<\/span>、字大小 <span class=\"katex-inline\">m=z^e<\/span> 时乘数取 <span class=\"katex-inline\">a=z^k+1<\/span> 的构造方向。<\/p>\n<h2>推导一（推演）：手算 <span class=\"katex-inline\">m=10<\/span> 的短周期序列<\/h2>\n<p>按书里的例子逐步展开。参数 <span class=\"katex-inline\">m=10<\/span>，<span class=\"katex-inline\">a=7<\/span>，<span class=\"katex-inline\">c=7<\/span>，<span class=\"katex-inline\">X_0=7<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">X_1=(7\\cdot 7+7)\\bmod 10=56\\bmod 10=6<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">X_2=(7\\cdot 6+7)\\bmod 10=49\\bmod 10=9<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">X_3=(7\\cdot 9+7)\\bmod 10=70\\bmod 10=0<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">X_4=(7\\cdot 0+7)\\bmod 10=7<\/span>，回到 <span class=\"katex-inline\">X_0<\/span>。\n<\/ol>\n<p>序列 <span class=\"katex-inline\">7,6,9,0<\/span> 之后重复，周期为 4。推演依据是递推式本身：每一步只依赖上一项与固定参数，取模把结果压回 <span class=\"katex-inline\">[0,m-1]<\/span>。这个序列周期远小于 <span class=\"katex-inline\">m=10<\/span>，说明参数选得不好时，一轮遍历连模的大小都用不满。<\/p>\n<h2>推导二（证明思路）：定理 A 三条条件怎样钉住全周期<\/h2>\n<p>全周期要求序列一轮内遍历 <span class=\"katex-inline\">0,1,\\dots,m-1<\/span>。条件 (i) <span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">m<\/span> 互素，保证增量在模 <span class=\"katex-inline\">m<\/span> 加法群里是一个可逆平移；条件 (ii) 与 (iii) 约束乘数 <span class=\"katex-inline\">a<\/span> 在模每个素因子、模 4 时的余数结构，使乘加变换在各分量上都不把不同初值压到同一条短轨道上。按中国剩余定理方向分解：<span class=\"katex-inline\">m<\/span> 拆成素数幂分量后，各分量的周期分别拉满，合并周期才等于 <span class=\"katex-inline\">m<\/span>。条件 (ii) 对应每个素数因子 <span class=\"katex-inline\">p<\/span> 上 <span class=\"katex-inline\">a\\equiv 1\\pmod p<\/span>；条件 (iii) 专门处理 <span class=\"katex-inline\">2<\/span> 的幂中含 <span class=\"katex-inline\">4<\/span> 的情形，要求 <span class=\"katex-inline\">a\\equiv 1\\pmod 4<\/span>。三条分别管住不同素因子分量，缺一条就有某个分量退化成短轨道，整体周期达不到 <span class=\"katex-inline\">m<\/span>。完整证明在原书 §3.2.1.2，这里只梳理条件与分量之间的对应关系。<\/p>\n<h2>反事实：改掉前提会怎样<\/h2>\n<ul><li>\n<strong>令 <span class=\"katex-inline\">c=0<\/span> 且不核验阶<\/strong>：零增量省去一次加法，但条件 (i) 不再成立（<span class=\"katex-inline\">0<\/span> 与 <span class=\"katex-inline\">m<\/span> 不互素），周期改由 <span class=\"katex-inline\">a<\/span> 模 <span class=\"katex-inline\">m<\/span> 的阶决定。取 <span class=\"katex-inline\">m=16<\/span>，<span class=\"katex-inline\">a=5<\/span>，<span class=\"katex-inline\">X_0=1<\/span>：<span class=\"katex-inline\">X_1=5<\/span>，<span class=\"katex-inline\">X_2=25\\bmod 16=9<\/span>，<span class=\"katex-inline\">X_3=45\\bmod 16=13<\/span>，<span class=\"katex-inline\">X_4=65\\bmod 16=1<\/span>，周期只有 4，而不是 16。增量被砍掉的同时，周期也跟着掉下来。\n<\/li><li>\n<strong>取 <span class=\"katex-inline\">a=1<\/span><\/strong>：递推退化为 <span class=\"katex-inline\">X_n=(X_0+nc)\\bmod m<\/span>，序列按固定步长在模 <span class=\"katex-inline\">m<\/span> 直线前进。即便步长与 <span class=\"katex-inline\">m<\/span> 互素使周期拉满，相邻项之差恒定，取值排成一条规则的线，完全不具备随机序列应有的散布感。长周期掩盖不了结构缺陷。\n<\/li><li>\n<strong>模数取小<\/strong>：周期上界就是 <span class=\"katex-inline\">m<\/span>，<span class=\"katex-inline\">m<\/span> 很小时一轮重复很快到来；仿真需要成千上万次抽样时，重复段被反复使用，样本之间不再独立。\n<\/ul>\n<h2>与后续章节的衔接<\/h2>\n<p>本章解决&quot;怎样造出一串均匀的伪随机数&quot;，但周期长、参数满足定理 A 只能保证遍历规则，不能保证序列在统计意义上像随机数。§3.3 接统计检验：用卡方、连检验、配对检验等经验过程与理论检验考察序列；§3.3.4 谱检验从格结构给出更强的判断。§3.4 再解决&quot;均匀偏差之外的分布怎样生成&quot;。第 4 章则转向计算机内部的算术表示与运算，是随机数落地到机器字长之后的另一面。<\/p>", "ch02": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷2 半数值算法.pdf · p.43<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 3 章 3.1–3.2：均匀随机数的生成（引言、线性同余法与其他方法）<\/a><\/span><\/div><h1>第 3 章 3.3–3.5：随机数的统计检验、其他随机量与随机序列<\/h1>\n<blockquote>对应原书第 3 章 3.3–3.5 节（印刷页 32–146，PDF 第 43–157 页；正文偏移 k=11）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01 均匀随机数的生成\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明为什么周期长不等于随机，判断一个数列是否随机必须靠无偏的机械检验，而不是人的直觉；\n<\/li><li>\n复述卡方检验比较观测频数与期望频数的计算流程，说出经验检验与理论检验的分工；\n<\/li><li>\n讲清谱检验把相邻随机数看成高维格点的视角，以及格间距为什么能反映发生器质量；\n<\/li><li>\n说出从均匀偏差 <span class=\"katex-inline\">U<\/span> 到有限随机整数、加权离散分布、其他连续分布的基本变换路线；\n<\/li><li>\n描述随机抽样与洗牌（从 <span class=\"katex-inline\">n<\/span> 个对象中选 <span class=\"katex-inline\">k<\/span> 个、安排随机排列）的算法思路。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>生成器给出一串候选随机数之后，要拿一套统计尺子去量：经验检验把数列分组算统计量，理论检验直接分析序列的数学结构；谱检验是其中最强的一种，它把线性同余序列的点落在格点上的疏密暴露出来。均匀偏差是原料，其他分布的随机量和随机排列、随机抽样都由它变换得到。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：卡方检验与经验检验（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。§3.3 开篇指出：周期长度是重要标准，但周期长不能保证序列在应用中可用；要判断一个数列是否随机，不能相信自己的眼睛，必须使用无偏的机械检验（PDF 第 43 页）。书里引用矩阵博士对 <span class=\"katex-inline\">\\pi<\/span> 十进制展开的评论说明：人眼容易在随机材料里找出刻意的模式。检验分两类：经验检验用计算机处理序列中的若干组数，计算统计量；理论检验用数论方法按形成序列的递推规则建立特征。§3.3.1 以卡方（<span class=\"katex-inline\">\\chi^2<\/span>）检验为一般检验过程的入口：先分区间统计观测频数，与均匀假设下的期望频数对照，按偏差平方除以期望求和。后续连检验、配对检验等从相邻项的大小次序、两两组合的位置等角度补充考察。<\/p>\n<h3>2. 概念 2：谱检验与格结构（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。§3.3.4 谱检验专门检查线性同余发生器的质量，书里称它是迄今为止已知最强的检验：好的生成器能通过，而目前已知的坏生成器实际上都通不过它（PDF 第 81 页）。它兼有两类检验的特点：像理论检验那样处理序列全周期的性质，又像经验检验那样需要计算机程序确定结果。把相邻的两个、三个或更多随机数看成高维空间中的点，线性同余序列的点会落在规则的格上；格的层数越少、间距越大，说明点在空间里留有大块空白，发生器存在结构缺陷。谱检验度量的正是这种格的覆盖疏密。<\/p>\n<h3>3. 概念 3：均匀偏差到其他分布的变换、抽样与洗牌（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。§3.4 指出：均匀分布的应用常常需要其他类型分布的随机量；要从 <span class=\"katex-inline\">k<\/span> 个候选中随机选一个，需要 0 到 <span class=\"katex-inline\">k-1<\/span> 的随机整数；仿真等待时间需要指数分布的随机数；有时还需要随机排列（<span class=\"katex-inline\">n<\/span> 个对象的随机安排）或随机组合（从 <span class=\"katex-inline\">n<\/span> 个对象中随机选 <span class=\"katex-inline\">k<\/span> 个）（PDF 第 101 页）。§3.4.1 数值分布先处理有限随机整数：取均匀偏差 <span class=\"katex-inline\">U<\/span>，令 <span class=\"katex-inline\">X=\\lfloor kU\\rfloor<\/span> 得到 0 到 <span class=\"katex-inline\">k-1<\/span> 的整数；按权重 <span class=\"katex-inline\">p_1,\\dots,p_k<\/span> 分段，把 <span class=\"katex-inline\">U<\/span> 落在哪个区间映射成对应取值。连续分布则按分布函数的逆变换或舍选法方向处理。§3.4.2 随机抽样和洗牌给出从集合中取子集、打乱排列的算法。<\/p>\n<h2>推导一（推演）：卡方统计量的计算流程<\/h2>\n<p>以掷两个骰子之和的均匀对照为例（原书 §3.3.1 的方向）。点数和 <span class=\"katex-inline\">s<\/span> 取 2 到 12，均匀假设下期望频数按概率 <span class=\"katex-inline\">p_s<\/span> 分配。设做了 <span class=\"katex-inline\">N<\/span> 次试验，第 <span class=\"katex-inline\">s<\/span> 格观测频数为 <span class=\"katex-inline\">N_s<\/span>，期望频数 <span class=\"katex-inline\">E_s=Np_s<\/span>。<\/p>\n<ol><li>\n对每个格子算偏差 <span class=\"katex-inline\">N_s-E_s<\/span>。\n<\/li><li>\n平方后除以期望：<span class=\"katex-inline\">(N_s-E_s)^2/E_s<\/span>。\n<\/li><li>\n各格求和得到卡方统计量 <span class=\"katex-inline\">\\chi^2=\\sum_s (N_s-E_s)^2/E_s<\/span>。\n<\/ol>\n<p>推演依据：观测与期望越接近，每一项越小；某一格系统性偏多或偏少，对应项被平方放大。统计量超出临界值就拒绝&quot;均匀&quot;假设。检验要在多个不同角度重复：单看频数均匀还不够，相邻次序、配对位置等都要分别量过。<\/p>\n<h2>推导二（推演）：谱检验为什么能暴露坏发生器<\/h2>\n<p>线性同余序列满足固定递推 <span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span>。把 <span class=\"katex-inline\">(X_n,X_{n+1})<\/span> 画成二维平面上的点，所有点受同一线性关系约束，只会落在一组平行直线上；取三维相邻项 <span class=\"katex-inline\">(X_n,X_{n+1},X_{n+2})<\/span>，点落在平行平面上。维数越高，结构约束越明显。谱检验计算这些直线（或平面、超平面）之间的间距：间距小意味着格密、空白少；间距大意味着点在某些方向上成摞排列，留出宽条空白。一个发生器若乘数或模数选择不当，低维投影可能看着均匀，高维格间距却很大；谱检验逐维度量这种疏密，把隐藏的规则结构翻出来。这与经验检验分工不同：经验检验抽样本算统计量，谱检验直接利用递推规则的全周期数学性质。<\/p>\n<h2>反事实：改掉前提会怎样<\/h2>\n<ul><li>\n<strong>只凭人的主观判断随机性<\/strong>：书里指出，把真随机数表给人看，人也常说它不随机，因为眼睛能辨认出明显模式；反过来人为造出的规则序列也可能被说成有规律。去掉无偏检验这道环节，验收标准就随主观感觉漂移，同一串数列这次通过、下次被否。\n<\/li><li>\n<strong>只做一种检验<\/strong>：一个序列对检验 <span class=\"katex-inline\">T_1,\\dots,T_n<\/span> 都表现随机，也不能保证进一步的 <span class=\"katex-inline\">T_{n+1}<\/span> 一定通过；只跑频数均匀性，可能漏掉连检验暴露的次序粘连、配对检验暴露的组合偏斜。实践中要跑五六种不同类型的检验，通过得多才更有把握。\n<\/li><li>\n<strong>跳过均匀偏差直接造指定分布<\/strong>：不先得到 0 到 1 之间均匀的 <span class=\"katex-inline\">U<\/span>，变换到其他分布时底层偏斜会被放大；区间分段边界、权重映射都建立在 <span class=\"katex-inline\">U<\/span> 均匀的前提上，原料不均匀，后面的分布形状跟着失真。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>上一章造出候选序列，本章用检验尺子验收：经验检验管样本统计量，理论检验与谱检验管结构。§3.5 进一步追问&quot;什么是随机序列&quot;，把随机性本身作为理论对象讨论。本章的变换路线把均匀偏差接到仿真、抽样等实际用途。第 4 章离开随机数主题，进入计算机怎样表示数、怎样做算术的底层议题；多精度算术与误差分析是后面一切数值计算的地基。<\/p>", "ch03": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷2 半数值算法.pdf · p.158<\/div><h1>第 4 章 4.1–4.4：记数系统、浮点算术、多精度算术与进制转换<\/h1>\n<blockquote>对应原书第 4 章 4.1–4.4 节（印刷页 147–253，PDF 第 158–264 页；正文偏移 k=11）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：无（算术基础自成一体）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 <span class=\"katex-inline\">b<\/span> 进制按位记数的展开式，说明每位数字的取值范围，完成整数与小数在两种进制间的转换；\n<\/li><li>\n解释浮点数对 <span class=\"katex-inline\">(e,f)=f\\times b^{e-q}<\/span> 各部分的含义，说出规范化条件与单精度浮点运算的基本步骤；\n<\/li><li>\n说出浮点舍入误差的来源，理解为什么浮点加法不满足结合律、累积误差会随运算次数增长；\n<\/li><li>\n走通多精度整数加减乘除的竖式流程，指出进位与借位怎样在数位间传递；\n<\/li><li>\n比较常规 <span class=\"katex-inline\">O(n^2)<\/span> 乘法与分治乘法的复杂度变化，说出乘法代价不一定随位数平方增长。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>计算机先把数写成某种进制的数位串，再按竖式规则做运算：定点记数解决&quot;数位怎样排列&quot;，浮点记数解决&quot;小数点怎样浮动&quot;，多精度算术解决&quot;位数超过单字长怎么办&quot;。每一层都有自己的误差与代价边界：浮点有舍入累积，多精度运算的时间随位数增长。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：按位记数系统与进制转换（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。§4.1 从&quot;怎样做算术运算&quot;回溯到&quot;数的表示方法&quot;：以 <span class=\"katex-inline\">b<\/span> 为基数的按位记数法把数写成 <span class=\"katex-inline\">(\\dots a_2a_1a_0.a_{-1}a_{-2}\\dots)_b=\\sum a_k b^k<\/span>，每位数字 <span class=\"katex-inline\">a_k<\/span> 满足 <span class=\"katex-inline\">0\\le a_k&lt;b<\/span>（PDF 第 158 页）。十进制是 <span class=\"katex-inline\">b=10<\/span> 的特例；取 <span class=\"katex-inline\">b=2<\/span> 得二进制，<span class=\"katex-inline\">b=8<\/span>、<span class=\"katex-inline\">b=16<\/span> 按同一规则推广。小数点在 <span class=\"katex-inline\">a_0<\/span> 与 <span class=\"katex-inline\">a_{-1}<\/span> 之间；欧洲大陆常用逗号标记小数点，英国历史上曾用位置略高的点。§4.4 进制转换讨论同一整数或小数在不同基数之间的换算：整数部分除基取余，小数部分乘基取整。<\/p>\n<h3>2. 概念 2：浮点表示、规范化与舍入误差界（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。§4.2.1 单精度计算引入浮点记数法：用一对对数 <span class=\"katex-inline\">(e,f)<\/span> 标记 <span class=\"katex-inline\">f\\times b^{e-q}<\/span>，<span class=\"katex-inline\">e<\/span> 是指定范围内的整数指数部分，<span class=\"katex-inline\">f<\/span> 是带符号小数部分；规定 <span class=\"katex-inline\">|f|&lt;1<\/span>，<span class=\"katex-inline\">f<\/span> 为 <span class=\"katex-inline\">p<\/span> 位数时 <span class=\"katex-inline\">b^p f<\/span> 是整数（PDF 第 174 页）。<span class=\"katex-inline\">e<\/span> 与 <span class=\"katex-inline\">f<\/span> 分别称指数部分与小数部分。规范化要求 <span class=\"katex-inline\">f<\/span> 的最高位不含有效零，使同一个数的表示唯一。§4.2.2 讨论浮点算术的精度：每次运算都可能舍入，相对误差被界住，但多次运算后误差会累积；浮点运算不再严格满足实数的结合律，先加哪两项会影响结果。<\/p>\n<h3>3. 概念 3：多精度经典算术与乘法复杂度（难度：进阶 / 高难）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>、<a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。§4.3.1 经典算法处理任意高精度的整数：<span class=\"katex-inline\">n<\/span> 位整数的加减给出 <span class=\"katex-inline\">n<\/span> 位结果与进位标志；<span class=\"katex-inline\">m<\/span> 位整数乘 <span class=\"katex-inline\">n<\/span> 位整数给出 <span class=\"katex-inline\">(m+n)<\/span> 位结果；<span class=\"katex-inline\">(m+n)<\/span> 位整数除以 <span class=\"katex-inline\">n<\/span> 位整数给出 <span class=\"katex-inline\">(m+1)<\/span> 位商和 <span class=\"katex-inline\">n<\/span> 位余数（PDF 第 214 页）。这些就是小学竖式笔算的机器版本：加法按位加并进位，乘法逐位相乘再错位累加，除法试商后减余。§4.3.3 追问乘法有多快：常规算法把 <span class=\"katex-inline\">m<\/span> 位与 <span class=\"katex-inline\">n<\/span> 位相乘约需 <span class=\"katex-inline\">cmn<\/span> 次操作，<span class=\"katex-inline\">m=n<\/span> 时是 <span class=\"katex-inline\">n^2<\/span> 量级；问题是通用算法的运行时间是否一定随 <span class=\"katex-inline\">n^2<\/span> 增长，分治路线给出了低于平方阶的方向。<\/p>\n<h2>推导一（推演）：二进制与十进制的相互转换<\/h2>\n<p>取整数 <span class=\"katex-inline\">N<\/span>。十进制转二进制：反复除以 2 取余数，余数从下往上读。以 <span class=\"katex-inline\">N=13<\/span> 为例：<span class=\"katex-inline\">13\\div2=6<\/span> 余 1，<span class=\"katex-inline\">6\\div2=3<\/span> 余 0，<span class=\"katex-inline\">3\\div2=1<\/span> 余 1，<span class=\"katex-inline\">1\\div2=0<\/span> 余 1，余数序列自下而上为 <span class=\"katex-inline\">1101_2<\/span>。核验：<span class=\"katex-inline\">1\\cdot2^3+1\\cdot2^2+0\\cdot2^1+1\\cdot2^0=8+4+1=13<\/span>。<\/p>\n<p>小数方向：<span class=\"katex-inline\">0.625<\/span> 转二进制，反复乘 2 取整数位：<span class=\"katex-inline\">0.625\\cdot2=1.25<\/span> 取 1，<span class=\"katex-inline\">0.25\\cdot2=0.5<\/span> 取 0，<span class=\"katex-inline\">0.5\\cdot2=1.0<\/span> 取 1，得 <span class=\"katex-inline\">0.101_2<\/span>。核验：<span class=\"katex-inline\">1\\cdot2^{-1}+0\\cdot2^{-2}+1\\cdot2^{-3}=0.5+0.125=0.625<\/span>。推演依据是按位展开式：整数部分对应 <span class=\"katex-inline\">b<\/span> 的非负幂，除基取余依次得到最低位；小数部分对应负幂，乘基取整依次得到最高位。<\/p>\n<h2>推导二（推演）：多精度加法的进位传递<\/h2>\n<p>设两个 <span class=\"katex-inline\">n<\/span> 位 <span class=\"katex-inline\">b<\/span> 进制数 <span class=\"katex-inline\">u=(u_{n-1}\\dots u_0)<\/span>、<span class=\"katex-inline\">v=(v_{n-1}\\dots v_0)<\/span>，从最低位 <span class=\"katex-inline\">i=0<\/span> 起：<\/p>\n<ol><li>\n本位和 <span class=\"katex-inline\">s_i=u_i+v_i+c_{i-1}<\/span>，<span class=\"katex-inline\">c_{-1}=0<\/span>。\n<\/li><li>\n本位结果 <span class=\"katex-inline\">w_i=s_i\\bmod b<\/span>，进位 <span class=\"katex-inline\">c_i=\\lfloor s_i/b\\rfloor<\/span>。\n<\/li><li>\n进到 <span class=\"katex-inline\">i+1<\/span> 位重复，最高位进位 <span class=\"katex-inline\">c_{n-1}<\/span> 作为新数位。\n<\/ol>\n<p>每一步不变量：低 <span class=\"katex-inline\">i<\/span> 位已算出的部分和等于两数低 <span class=\"katex-inline\">i<\/span> 位之和模 <span class=\"katex-inline\">b^i<\/span>，进位 <span class=\"katex-inline\">c_i<\/span> 携带超出部分。减法对称：不够减时向高位借 1，借一位当 <span class=\"katex-inline\">b<\/span>。乘法把乘数每一位与被乘数相乘，得到部分积后按位错开累加，进位规则与加法相同；除法从高位试商，每步乘商减余数。<\/p>\n<h2>反事实：改掉前提会怎样<\/h2>\n<ul><li>\n<strong>浮点不做规范化<\/strong>：同一个数可以写成 <span class=\"katex-inline\">0.1\\times b^e<\/span>、<span class=\"katex-inline\">0.01\\times b^{e+1}<\/span> 等多种形式，比较相等、判断归零都失去唯一标准；尾数里的有效零还白白占用精度位。规范化把表示钉成唯一形式，正是为了消除这种歧义。\n<\/li><li>\n<strong>假设浮点运算满足实数结合律<\/strong>：三个相近量级的小数相加，先加大数与先加小数结果不同；小到一定程度的数会被大数&quot;吃掉&quot;。若按 <span class=\"katex-inline\">(x+y)+z<\/span> 的纸面结合律估算误差，实际顺序换过后累积误差可能超出界。§4.2.2 指出的这种失效，是浮点近似与实数算术的根本差别之一。\n<\/li><li>\n<strong>多精度运算只按单字长处理<\/strong>：位数超过机器字长后仍直接套用单字指令，进位与溢出无处存放，高位信息丢失；必须把数拆成数位串，按竖式逐位推进，进位标志在数位间显式传递。\n<\/ul>\n<h2>与后续章节的衔接<\/h2>\n<p>本章的记数与运算是 §4.5 有理数算术的前置：分数运算本质是整数运算加最大公因数约分，§4.5.2 的最大公因数算法建立在整数取余之上；§4.6 多项式算术把数位串推广成系数串，多精度乘法的错位累加与多项式卷积结构相通。浮点误差界则是第 3 章随机数落地为机器数之后，一切数值分析共享的底层约束。<\/p>", "ch04": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷2 半数值算法.pdf · p.265<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 4 章 4.1–4.4：记数系统、浮点算术、多精度算术与进制转换<\/a><\/span><\/div><h1>第 4 章 4.5–4.7：有理数算术、最大公因数、多项式算术与幂级数操作<\/h1>\n<blockquote>对应原书第 4 章 4.5–4.7 节（印刷页 254–419，PDF 第 265–430 页；正文偏移 k=11）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch03 记数系统、多精度算术\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明分数为什么要以既约形式 <span class=\"katex-inline\">u/u&#x27;<\/span>（<span class=\"katex-inline\">u,u&#x27;<\/span> 互素，<span class=\"katex-inline\">u&#x27;&gt;0<\/span>）表示，走通分数加减乘除中约分的位置；\n<\/li><li>\n手算辗转相除求最大公因数，说出算法每一步的余数关系；\n<\/li><li>\n把欧几里得算法与连分数联系起来，说出最坏情形对应连续斐波那契数，以及步数上界的方向；\n<\/li><li>\n区分多项式除法、因子分解、幂的计算与多项式求值各自的输入输出；\n<\/li><li>\n描述快速幂（按平方累乘）的思路，说明它比逐个连乘快在哪里。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>有理数运算是整数运算外加约分，约分靠最大公因数；最大公因数靠辗转相除，其步数由连分数与斐波那契数刻画。把整数推广到系数串就得到多项式算术：除法求商余，分解求因子，幂计算用快速平方，求值则是把系数串代入变量。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：有理数算术与最大公因数（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c11.md\" target=\"_blank\" rel=\"noopener\">概念 c11<\/a>。§4.5.1 分数：分数表示为一对整数 <span class=\"katex-inline\">(u/u&#x27;)<\/span>，其中 <span class=\"katex-inline\">u<\/span> 与 <span class=\"katex-inline\">u&#x27;<\/span> 互素且 <span class=\"katex-inline\">u&#x27;&gt;0<\/span>，<span class=\"katex-inline\">(0/1)<\/span> 表示零；相等当且仅当分子分母分别相等（PDF 第 265 页）。分数乘法直接交叉相乘后再约分；加减先通分，分子相加后约成最简。约分要反复调用最大公因数。§4.5.2 最大公因数给出欧几里得算法（算法 4.5.2A 方向）：反复用 <span class=\"katex-inline\">u=qv+r<\/span> 取余，把较大数换成余数，直到余数为 0。§4.5.3 对欧几里得算法的分析把步数与连分数挂钩：连分数系数对应除法步骤，最坏情形出现在输入为连续两个斐波那契数时（PDF 第 277 页定理 F）。§4.5.4 分解素因数在公因数与约分之上，处理把整数拆成素数乘积的问题。<\/p>\n<h3>2. 概念 2：多项式算术（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c12.md\" target=\"_blank\" rel=\"noopener\">概念 c12<\/a>。§4.6 定义在代数系统 <span class=\"katex-inline\">S<\/span> 上的多项式形如 <span class=\"katex-inline\">u(x)=u_nx^n+\\cdots+u_1x+u_0<\/span>，<span class=\"katex-inline\">u_n\\ne0<\/span> 时次数 <span class=\"katex-inline\">\\deg(u)=n<\/span>（PDF 第 335 页）。多项式加减是同次幂系数相加减；乘法按卷积展开，<span class=\"katex-inline\">w_k=\\sum_{i+j=k}u_i v_j<\/span>。§4.6.1 多项式除法给出商式与余式；§4.6.2 多项式因子分解把多项式拆成不可约因子；§4.6.3 幂的计算处理 <span class=\"katex-inline\">u(x)^n<\/span>，快速平方路线把指数按二进制分解；§4.6.4 多项式求值讨论给定 <span class=\"katex-inline\">x<\/span> 时怎样少算乘法地算出 <span class=\"katex-inline\">u(x)<\/span>。§4.7 把这些操作推广到幂级数。<\/p>\n<h2>推导一（推演）：辗转相除求 <span class=\"katex-inline\">\\gcd(29,8)<\/span><\/h2>\n<p>按算法 4.5.2A 的方向逐步取余：<\/p>\n<ol><li>\n<span class=\"katex-inline\">29=3\\cdot8+5<\/span>，余数 <span class=\"katex-inline\">5<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">8=1\\cdot5+3<\/span>，余数 <span class=\"katex-inline\">3<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">5=1\\cdot3+2<\/span>，余数 <span class=\"katex-inline\">2<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">3=1\\cdot2+1<\/span>，余数 <span class=\"katex-inline\">1<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">2=2\\cdot1+0<\/span>，余数 <span class=\"katex-inline\">0<\/span>。\n<\/ol>\n<p>最后非零余数为 <span class=\"katex-inline\">1<\/span>，<span class=\"katex-inline\">\\gcd(29,8)=1<\/span>。推演依据：<span class=\"katex-inline\">\\gcd(u,v)=\\gcd(v,u\\bmod v)<\/span>，因为 <span class=\"katex-inline\">u<\/span> 与 <span class=\"katex-inline\">v<\/span> 的公因数同时整除 <span class=\"katex-inline\">u-qv=r<\/span>，反之 <span class=\"katex-inline\">v<\/span> 与 <span class=\"katex-inline\">r<\/span> 的公因数也整除 <span class=\"katex-inline\">u=qv+r<\/span>。每步把数对换成更小的一对，余数严格下降，必然终止。<\/p>\n<h2>推导二（证明思路）：最坏情形与斐波那契数<\/h2>\n<p>§4.5.3 定理 F：设 <span class=\"katex-inline\">n\\ge1<\/span>，<span class=\"katex-inline\">u&gt;v&gt;0<\/span>，恰好需要 <span class=\"katex-inline\">n<\/span> 次除法步骤、且 <span class=\"katex-inline\">u<\/span> 是满足条件的最小整数时，<span class=\"katex-inline\">u=F_{n+2}<\/span>，<span class=\"katex-inline\">v=F_{n+1}<\/span>，即连续两个斐波那契数（PDF 第 277 页）。证明方向：连分数系数全为 1 时对应每步商都是 1，余数递减最慢；此时分子分母由斐波那契递推生成。反过来，若某一步商大于 1，余数下降更快，同一步数下可以取更小的数。推论 L 给出步数上界：<span class=\"katex-inline\">0\\le v&lt;N<\/span> 时，算法 4.5.2A 的除法步骤数最多为 <span class=\"katex-inline\">\\lceil\\log_\\phi((3-\\phi)N)\\rceil<\/span>，其中 <span class=\"katex-inline\">\\phi<\/span> 为黄金分割比。这说明欧几里得算法的步数随输入位数对数增长，不是线性拖长。<\/p>\n<h2>反事实：改掉前提会怎样<\/h2>\n<ul><li>\n<strong>分数不约分<\/strong>：同一个有理数写成 <span class=\"katex-inline\">2/4<\/span>、<span class=\"katex-inline\">3/6<\/span>、<span class=\"katex-inline\">1/2<\/span>，相等判断要交叉相乘才能比；运算过程中分子分母只涨不落，中间结果迅速膨胀，单精度就装不下。既约表示把相等的数钉成唯一写法，约分环节因此不可省。\n<\/li><li>\n<strong>最大公因数改用逐个试除<\/strong>：从 2 试到较小数，步数随数值线性增长；辗转相除每步把数对换成余数对，步数对数于位数。试除法在小整数上可行，推广到大整数与多精度算术时代价失控。\n<\/li><li>\n<strong>多项式乘法按逐项展开硬算、不利用结构<\/strong>：两个 <span class=\"katex-inline\">n<\/span> 次多项式卷积有 <span class=\"katex-inline\">(n+1)^2<\/span> 个系数乘积项；而多项式算术与多精度算术结构相通，错位累加、模运算与快速乘法的思路可以互相迁移。不区分多项式系数取自整数、实数还是模 <span class=\"katex-inline\">m<\/span> 系统，把整数除法规则直接套过来，会忽略系数环不一定有除法逆元的问题。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章承接 ch03 的多精度竖式：分数约分调用的公因数算法作用在多精度整数上，多项式卷积与多精度乘法的部分积累加同构。第 3 章的随机数在 §3.3.3 理论检验中也会调用互反公式求值，与本章取余、步数分析相接。至此卷 2 两条主线闭合：随机数怎样生成与检验，算术怎样在机器上表示、计算并控制代价。<\/p>", "c01": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷2 半数值算法.pdf · p.19<\/div><h1>线性同余发生器：递推式、均匀偏差与序列循环<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书 §3.2.1，PDF 第 19 页）\n<\/ul>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>仿真、抽样、算法测试、决策、密码学这些场景都需要&quot;随机选取&quot;的数，但计算机是确定性机器：给定同样的输入，每次跑出同样的结果，没有物理掷硬币装置。困难在于：怎样用一条确定的算术规则，造出一串在 0 与 1 之间看起来均匀、重复周期足够长的数。线性同余法是目前最流行的构造方向：先在整数环上递推，再缩放成区间内的小数。它不能产生真正随机的量，产出的是伪随机数；&quot;伪&quot;在序列完全由初值和参数决定，可复现、可预测，但统计性质可以做到接近均匀。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>四个参数<\/strong>（书 §3.2.1 式 (1)、(2)，PDF 第 19 页）：<\/p>\n<ul><li>\n模 <span class=\"katex-inline\">m<\/span>：<span class=\"katex-inline\">0&lt;m<\/span>，序列取值的上界，整数。\n<\/li><li>\n乘数 <span class=\"katex-inline\">a<\/span>：<span class=\"katex-inline\">0\\le a&lt;m<\/span>，递推中的乘法系数。\n<\/li><li>\n增量 <span class=\"katex-inline\">c<\/span>：<span class=\"katex-inline\">0\\le c&lt;m<\/span>，递推中的加法常数。\n<\/li><li>\n初值 <span class=\"katex-inline\">X_0<\/span>：<span class=\"katex-inline\">0\\le X_0&lt;m<\/span>，序列第一项。\n<\/ul>\n<p><strong>递推式<\/strong>：<span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span>，<span class=\"katex-inline\">n\\ge0<\/span>。每一步把上一项乘 <span class=\"katex-inline\">a<\/span>、加 <span class=\"katex-inline\">c<\/span>，再对 <span class=\"katex-inline\">m<\/span> 取模，余数落在 <span class=\"katex-inline\">[0,m-1]<\/span>。<\/p>\n<p><strong>均匀偏差<\/strong>：<span class=\"katex-inline\">U_n=X_n/m<\/span>，把整数缩放到 0 与 1 之间；<span class=\"katex-inline\">U_n<\/span> 假定小数点在最左边。<\/p>\n<p><strong>周期<\/strong>：同余序列总会陷入循环，出现无休止重复的那段循环长度称为周期。函数 <span class=\"katex-inline\">f<\/span> 把有限集变换到自身，所有 <span class=\"katex-inline\">X_{n+1}=f(X_n)<\/span> 的序列都有这一性质。<\/p>\n<p><strong>正例<\/strong>：书里小例子 <span class=\"katex-inline\">m=10<\/span>，<span class=\"katex-inline\">X_0=a=c=7<\/span>，递推得 <span class=\"katex-inline\">7,6,9,0,7,6,9,0,\\dots<\/span>，周期 4。<\/p>\n<p><strong>反例<\/strong>：取 <span class=\"katex-inline\">m=10<\/span> 但参数选成 <span class=\"katex-inline\">a=0,c=0<\/span>，序列除初值外恒为 0，不是随机序列；<span class=\"katex-inline\">a=1<\/span> 时序列按固定步长直线前进，相邻项之差恒定，散布感缺失。<\/p>\n<h2>原理推导：序列为什么必然循环、周期受什么约束<\/h2>\n<p>取值只有 <span class=\"katex-inline\">0,1,\\dots,m-1<\/span> 共 <span class=\"katex-inline\">m<\/span> 种可能，递推只依赖上一项。根据抽屉原理，连续 <span class=\"katex-inline\">m+1<\/span> 项中必有两项取值相同；一旦 <span class=\"katex-inline\">X_i=X_j<\/span>（<span class=\"katex-inline\">i&lt;j<\/span>），由同一递推规则，<span class=\"katex-inline\">X_{i+1}=X_{j+1}<\/span>，之后整段重复，周期不超过 <span class=\"katex-inline\">j-i\\le m<\/span>。这给出周期上界：周期长度不可能大于模 <span class=\"katex-inline\">m<\/span>。<\/p>\n<p>把递推展开可得到书中式 (6) 的方向：<span class=\"katex-inline\">X_{n+k}=(a^kX_n+(a^k-1)c/b)\\bmod m<\/span>，其中 <span class=\"katex-inline\">b=a-1<\/span>。它说明隔 <span class=\"katex-inline\">k<\/span> 项取一项仍是同余形式的序列，乘数为 <span class=\"katex-inline\">a^k\\bmod m<\/span>。周期能有多长，取决于参数在模 <span class=\"katex-inline\">m<\/span> 各分量上的行为：<span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">m<\/span> 是否互素、<span class=\"katex-inline\">a<\/span> 在各素因子模下的余数结构，这些由定理 A 系统刻画（见 c02）。<\/p>\n<p>生成器不变量：每一步的结果始终是模 <span class=\"katex-inline\">m<\/span> 的余数；初值、<span class=\"katex-inline\">a<\/span>、<span class=\"katex-inline\">c<\/span>、<span class=\"katex-inline\">m<\/span> 固定后，整条序列被唯一确定。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：需要可复现的伪随机数；应用场景对&quot;不可预测性&quot;要求不高（密码学场景需要另外的安全发生器）。\n<\/li><li>\n失败案例 1：模数取小。周期上界就是 <span class=\"katex-inline\">m<\/span>，<span class=\"katex-inline\">m<\/span> 小时很快重复，仿真样本上万次时重复段被反复使用，样本间不再独立。\n<\/li><li>\n失败案例 2：参数使周期退化成短循环。<span class=\"katex-inline\">m=16,a=5,c=0,X_0=1<\/span>：<span class=\"katex-inline\">5\\to9\\to13\\to1<\/span>，周期 4，远小于 16。\n<\/li><li>\n边界：线性同余序列是确定性的，知道 <span class=\"katex-inline\">m,a,c,X_0<\/span> 即可复现整串；它不是物理噪声意义上的随机数。长周期只是随机性的必要条件，不是充分条件。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>伪随机 vs 真随机<\/strong>：真随机量每次取值不可预测，不被初始条件决定；线性同余序列由参数完全决定，可复现、可预测，只是统计上接近均匀独立。\n<\/li><li>\n<strong>周期长 ≠ 随机<\/strong>：<span class=\"katex-inline\">a=1<\/span> 且步长与 <span class=\"katex-inline\">m<\/span> 互素时周期可拉满，但序列按固定步长排列，结构明显；遍历全部取值不代表散布均匀。\n<\/li><li>\n<strong>取模 vs 截断<\/strong>：<span class=\"katex-inline\">\\bmod m<\/span> 取余数保留 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">m-1<\/span> 的循环对称；直接截断高位会留下偏向某一侧的分布，两者效果不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：模运算、整数除法与余数是高中代数基础。后继：c02 用定理 A 给出周期拉满的充要条件；c03 分析模数、乘数与零增量时的阶；c04、c05 用统计检验与谱检验判断生成器产出的序列是否够随机；c06 把均匀偏差变换成其他分布的随机量。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（线性同余发生器：递推式、均匀偏差与序列循环）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：线性同余序列的依赖链、循环必然性与手算推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把线性同余发生器讲到底，往回追四层：<\/p>\n<ol><li>\n<strong>模运算余数<\/strong>：<span class=\"katex-inline\">x\\bmod m<\/span> 是 <span class=\"katex-inline\">x<\/span> 除以 <span class=\"katex-inline\">m<\/span> 的非负余数，结果落在 <span class=\"katex-inline\">0,1,\\dots,m-1<\/span>。这是序列取值范围的来源。\n<\/li><li>\n<strong>有限取值集<\/strong>：递推每一步的可能取值只有 <span class=\"katex-inline\">m<\/span> 种，集合有限；递推函数 <span class=\"katex-inline\">f(x)=(ax+c)\\bmod m<\/span> 把这个有限集映射到自身。\n<\/li><li>\n<strong>确定性递推<\/strong>：下一项只由上一项与固定参数 <span class=\"katex-inline\">a,c,m<\/span> 决定，不引入外部随机源；同一初值永远跑出同一串序列。\n<\/li><li>\n<strong>循环必然性<\/strong>：有限集上的确定性迭代必然重复，重复点之后整段复制；周期长度由参数在模结构中的行为决定。\n<\/ol>\n<p>依赖链方向：余数规则 → 有限取值 → 确定性函数 → 抽屉原理循环 → 周期上界 <span class=\"katex-inline\">m<\/span> → 缩放为均匀偏差 <span class=\"katex-inline\">U_n=X_n/m<\/span>。<\/p>\n<h2>正向推导：序列为什么必然循环<\/h2>\n<p>设取值集合 <span class=\"katex-inline\">S=\\{0,1,\\dots,m-1\\}<\/span>，递推 <span class=\"katex-inline\">X_{n+1}=f(X_n)<\/span>，<span class=\"katex-inline\">f:S\\to S<\/span>。<\/p>\n<ol><li>\n连续考察 <span class=\"katex-inline\">m+1<\/span> 项 <span class=\"katex-inline\">X_0,X_1,\\dots,X_m<\/span>。每一项只有 <span class=\"katex-inline\">m<\/span> 种可能取值。\n<\/li><li>\n由抽屉原理，<span class=\"katex-inline\">m+1<\/span> 个项中必有两项相同：存在 <span class=\"katex-inline\">0\\le i&lt;j\\le m<\/span> 使 <span class=\"katex-inline\">X_i=X_j<\/span>。\n<\/li><li>\n递推规则固定，<span class=\"katex-inline\">X_i=X_j<\/span> 推出 <span class=\"katex-inline\">X_{i+1}=f(X_i)=f(X_j)=X_{j+1}<\/span>；归纳得 <span class=\"katex-inline\">X_{i+k}=X_{j+k}<\/span> 对所有 <span class=\"katex-inline\">k\\ge0<\/span> 成立。\n<\/li><li>\n序列从位置 <span class=\"katex-inline\">i<\/span> 进入长度 <span class=\"katex-inline\">j-i<\/span> 的循环，周期 <span class=\"katex-inline\">p=j-i\\le m<\/span>。\n<\/ol>\n<p>这给出周期上界：任何线性同余序列的周期都不可能超过模 <span class=\"katex-inline\">m<\/span>。上界能不能达到，取决于参数条件，那是 c02 定理 A 的内容。<\/p>\n<p><strong>递推展开<\/strong>。把 <span class=\"katex-inline\">X_n<\/span> 反复代入：<\/p>\n<div class=\"katex-block\">X_1=aX_0+c\\bmod m<\/div>\n<div class=\"katex-block\">X_2=a(aX_0+c)+c=a^2X_0+ac+c\\bmod m<\/div>\n<p>归纳得<\/p>\n<div class=\"katex-block\">X_n=a^nX_0+c(1+a+\\cdots+a^{n-1})\\bmod m<\/div>\n<p>隔 <span class=\"katex-inline\">k<\/span> 项取一项仍是同余形式：子序列的乘数为 <span class=\"katex-inline\">a^k\\bmod m<\/span>。这说明线性同余结构在抽样隔项后仍然保持，不是普通的任意数列。<\/p>\n<p><strong>均匀偏差的来源<\/strong>。<span class=\"katex-inline\">X_n\\in[0,m-1]<\/span>，令 <span class=\"katex-inline\">U_n=X_n/m<\/span>，则 <span class=\"katex-inline\">U_n\\in[0,1)<\/span>。若序列在模 <span class=\"katex-inline\">m<\/span> 各余数上分布均匀，<span class=\"katex-inline\">U_n<\/span> 就在 <span class=\"katex-inline\">[0,1)<\/span> 上近似均匀；缩放是线性的，不改变均匀性的相对结构。<\/p>\n<h2>数值算例一：书里的短周期序列<\/h2>\n<p>参数 <span class=\"katex-inline\">m=10<\/span>，<span class=\"katex-inline\">a=7<\/span>，<span class=\"katex-inline\">c=7<\/span>，<span class=\"katex-inline\">X_0=7<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">X_1=(7\\cdot7+7)\\bmod10=56\\bmod10=6<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">X_2=(7\\cdot6+7)\\bmod10=49\\bmod10=9<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">X_3=(7\\cdot9+7)\\bmod10=70\\bmod10=0<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">X_4=(7\\cdot0+7)\\bmod10=7=X_0<\/span>。\n<\/ol>\n<p>序列 <span class=\"katex-inline\">7,6,9,0<\/span> 之后重复，周期 <span class=\"katex-inline\">p=4<\/span>。核验上界：<span class=\"katex-inline\">p=4\\le m=10<\/span>，符合周期不超过模的结论；一轮只覆盖 4 个余数，没有遍历全部 10 个值。<\/p>\n<h2>数值算例二：<span class=\"katex-inline\">m=7<\/span> 的短周期对照<\/h2>\n<p>参数 <span class=\"katex-inline\">m=7<\/span>，<span class=\"katex-inline\">a=3<\/span>，<span class=\"katex-inline\">c=1<\/span>，<span class=\"katex-inline\">X_0=0<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">X_1=(3\\cdot0+1)\\bmod7=1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">X_2=(3\\cdot1+1)\\bmod7=4<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">X_3=(3\\cdot4+1)\\bmod7=13\\bmod7=6<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">X_4=(3\\cdot6+1)\\bmod7=19\\bmod7=5<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">X_5=(3\\cdot5+1)\\bmod7=16\\bmod7=2<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">X_6=(3\\cdot2+1)\\bmod7=7\\bmod7=0=X_0<\/span>。\n<\/ol>\n<p>序列 <span class=\"katex-inline\">0,1,4,6,5,2<\/span>，周期 <span class=\"katex-inline\">p=6&lt;7<\/span>。对照定理 A 的方向：<span class=\"katex-inline\">m=7<\/span> 是素数，条件 (ii) 要求 <span class=\"katex-inline\">a-1=2<\/span> 被 7 整除，不满足，所以周期拉不到 7；实际周期 6。这个算例说明周期受乘数在素因子模下的余数约束，不是模大就自动有长周期。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>参数全零退化<\/strong>。<span class=\"katex-inline\">a=0,c=0<\/span> 时 <span class=\"katex-inline\">X_{n+1}=0<\/span>，除初值外序列恒为 0；递推函数把所有值映到 0，取值集塌缩成单点，周期 1。生成器完全失效。<\/p>\n<p><strong>乘数取 1 的直线序列<\/strong>。<span class=\"katex-inline\">a=1<\/span> 时 <span class=\"katex-inline\">X_n=(X_0+nc)\\bmod m<\/span>，相邻项之差恒为 <span class=\"katex-inline\">c<\/span>，在模 <span class=\"katex-inline\">m<\/span> 上按固定步长直线推进。即便步长与 <span class=\"katex-inline\">m<\/span> 互素使周期达到 <span class=\"katex-inline\">m<\/span>，取值排成规则的等差线，没有随机散布感；周期长掩盖不了结构外露。<\/p>\n<p><strong>模数过小<\/strong>。<span class=\"katex-inline\">m=2<\/span> 时周期上界为 2，仿真需要上万次抽样时循环段被反复使用，样本之间不再独立；周期上界随模走，模小是硬约束。<\/p>\n<h2>延伸推演：确定性与可复现性<\/h2>\n<p>线性同余序列不是物理噪声，知道 <span class=\"katex-inline\">m,a,c,X_0<\/span> 就能复现整串。这一性质在调试仿真时是优点（同一随机序列重复跑便于定位问题），在密码学场景是缺陷（攻击者复现序列即可预测后续位）。两类用途对&quot;随机&quot;的要求不同：统计均匀可由同余构造满足，不可预测性需要另外的安全发生器。<\/p>\n<h2>延伸一层：递推展开式的逐项核对<\/h2>\n<p>把 <span class=\"katex-inline\">X_n=a^nX_0+c(1+a+\\cdots+a^{n-1})\\bmod m<\/span> 逐层展开核对：<span class=\"katex-inline\">n=1<\/span> 时 <span class=\"katex-inline\">X_1=aX_0+c<\/span>，求和式只留 <span class=\"katex-inline\">c<\/span>；<span class=\"katex-inline\">n=2<\/span> 时 <span class=\"katex-inline\">X_2=a^2X_0+ac+c<\/span>，求和式为 <span class=\"katex-inline\">c(1+a)<\/span>；归纳假设 <span class=\"katex-inline\">n=k<\/span> 成立，<span class=\"katex-inline\">n=k+1<\/span> 代入递推得 <span class=\"katex-inline\">aX_k+c=a^{k+1}X_0+ac(1+a+\\cdots+a^{k-1})+c=a^{k+1}X_0+c(1+a+\\cdots+a^k)<\/span>，与展开式一致。这个式子说明：乘数的幂次决定序列对初值的放大方式，增量的等比和决定常数项；隔项抽样得到的子序列仍是同余结构，乘数换成 <span class=\"katex-inline\">a^k\\bmod m<\/span>。<\/p>\n<h2>延伸推演：均匀偏差的区间与离散化误差<\/h2>\n<p><span class=\"katex-inline\">U_n=X_n/m<\/span> 的取值点是 <span class=\"katex-inline\">0,1/m,\\dots,(m-1)/m<\/span>，共 <span class=\"katex-inline\">m<\/span> 个离散点，不是真正连续的均匀实数。<span class=\"katex-inline\">m<\/span> 越大，点越密，离散化误差越小；<span class=\"katex-inline\">m<\/span> 小时相邻点之间有可见空隙，把它当连续偏差用于连续分布变换，分段边界附近会出现落点不齐。这层离散性与 c08 浮点尾数的离散表示是同类问题：有限字长把连续对象压成有限点集，精度边界由点数多少决定。<\/p>\n<h2>对照辨析：同余序列与任意确定性数列<\/h2>\n<p>任意确定性数列也由规则生成，但不一定满足线性递推；同余序列的特殊之处是每步只做乘加取模，结构简单、可分析周期与格性质。普通递推（如斐波那契 <span class=\"katex-inline\">F_{n+1}=F_n+F_{n-1}<\/span>）没有取模折叠，数值线性增长，不落在有限剩余类上。判断一个发生器是否属于线性同余族，看它能否写成 <span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span> 的单步形式；能写成，周期与格分析的工具才适用。<\/p>\n<h2>再推一层：初值在周期中的位置<\/h2>\n<p>全周期序列里，初值 <span class=\"katex-inline\">X_0<\/span> 只是循环上的一个入口点；换初值不改变周期长度，只改变从哪个余数起步。非全周期序列中，初值可能落在不同长度的环上，或先经过一段不循环的尾段进入环。同余函数把有限集映到自身，函数图由若干环加上指向环的树状尾段构成；分析发生器时要区分环长与尾段长度，两者不是同一个量。<\/p>\n<h2>补充推演：递推式中各参数的独立作用<\/h2>\n<p>固定其余参数，单独看每个量：<span class=\"katex-inline\">m<\/span> 圈定取值空间与周期天花板；<span class=\"katex-inline\">a<\/span> 决定相邻项的放大与乘子余数结构；<span class=\"katex-inline\">c<\/span> 提供平移偏移，使零乘子情形也能离开原点；<span class=\"katex-inline\">X_0<\/span> 只决定循环入口。改变 <span class=\"katex-inline\">m<\/span> 会整体改换剩余类空间，改变 <span class=\"katex-inline\">a<\/span> 改变轨道形状，改变 <span class=\"katex-inline\">c<\/span> 平移轨道，改变初值只移动起点。理解这种分工，参数调试时才能定位是哪一项约束出了问题，而不是四个数一起乱试。<\/p>\n<h2>补充算例：<span class=\"katex-inline\">m=7,a=3,c=1<\/span> 的轨道结构<\/h2>\n<p>前算例序列 <span class=\"katex-inline\">0,1,4,6,5,2<\/span> 周期 6。换初值 <span class=\"katex-inline\">X_0=3<\/span>：<span class=\"katex-inline\">X_1=3\\cdot3+1=10\\bmod7=3<\/span>，进入单点不动点 <span class=\"katex-inline\">3<\/span>。同一发生器里不同初值落在不同环：长度 6 的主环与长度 1 的不动点。函数图上，环外加指向环的尾段；初值选到不动点附近，序列立刻塌缩。分析发生器不能只验一个初值，要区分主环长度、短环与尾段。<\/p>\n<h2>补充辨析：伪随机与随机数发生器的用途分界<\/h2>\n<p>仿真与算法测试要求统计均匀可复现，线性同余足够；密码学要求后续位不可预测，同余序列由参数可复现，不满足。两类用途对&quot;随机&quot;的定义不同：前者看分布性质，后者看不可预测性。把同余发生器用于密钥流，知道参数即可推后续位，属于选型错误，不是参数微调能补救。<\/p>\n<h2>补充一层：序列可复现性的两面<\/h2>\n<p>同一参数与初值重复跑出同一串数，调试仿真时便于定位问题：改一行参数前后对照，随机序列可重放。代价是序列可预测，知道参数即可复现后续位。同余发生器的确定性是中性性质，用途决定它是优点还是缺陷。<\/p>\n<h2>补充一层：生成器选型的参数清单<\/h2>\n<p>落地一个线性同余发生器，清单依次是：模 <span class=\"katex-inline\">m<\/span> 圈定周期天花板与取模速度，乘数 <span class=\"katex-inline\">a<\/span> 定轨道形状，增量 <span class=\"katex-inline\">c<\/span> 定平移，初值 <span class=\"katex-inline\">X_0<\/span> 定入口。四项分开核验，再进周期判定与统计检验；不要把四个参数搅在一起试算。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出递推式 <span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span> 中四个参数的取值范围。\n<\/li><li>\n用抽屉原理说明为什么任何同余序列必然进入循环，周期上界是多少。\n<\/li><li>\n手算 <span class=\"katex-inline\">m=10,a=7,c=7,X_0=7<\/span> 的前四项并指出周期。\n<\/li><li>\n<span class=\"katex-inline\">U_n=X_n/m<\/span> 把整数序列映射到什么区间？线性缩放为什么不改变分布的相对均匀性？\n<\/li><li>\n为什么说长周期只是随机性的必要条件，不是充分条件？\n<\/ol><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷2 半数值算法.pdf · p.24<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">线性同余发生器：递推式、均匀偏差与序列循环<\/a><\/span><\/div><h1>全周期定理 A（Hull-Dobell）：周期达到模数的充要条件<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch01（原书 §3.2.1.2，PDF 第 24 页）\n<\/ul>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>c01 只说周期不超过 <span class=\"katex-inline\">m<\/span>，实践中要反过来问：参数取成什么样，周期才能正好等于 <span class=\"katex-inline\">m<\/span>，一轮遍历 <span class=\"katex-inline\">0,1,\\dots,m-1<\/span>？逐个试算整轮序列成本高，而且试算只能判断当前这组参数，换一组又得重来。定理 A 把周期判定变成数论条件核验：不用跑序列，逐条对照三条条件，就能判断全周期是否成立。它是选择乘数与增量的理论依据。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>定理 A<\/strong>（书 §3.2.1.2，PDF 第 24 页）：由 <span class=\"katex-inline\">m<\/span>、<span class=\"katex-inline\">a<\/span>、<span class=\"katex-inline\">c<\/span>、<span class=\"katex-inline\">X_0<\/span> 定义的线性同余序列具有周期 <span class=\"katex-inline\">m<\/span>，当且仅当以下三条同时成立：<\/p>\n<ol><li>\n<strong>(i)<\/strong> <span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">m<\/span> 互素，即 <span class=\"katex-inline\">\\gcd(c,m)=1<\/span>；\n<\/li><li>\n<strong>(ii)<\/strong> 对每个整除 <span class=\"katex-inline\">m<\/span> 的素数 <span class=\"katex-inline\">p<\/span>，<span class=\"katex-inline\">b=a-1<\/span> 是 <span class=\"katex-inline\">p<\/span> 的倍数，即 <span class=\"katex-inline\">a\\equiv1\\pmod p<\/span>；\n<\/li><li>\n<strong>(iii)<\/strong> 如果 <span class=\"katex-inline\">m<\/span> 是 4 的倍数，则 <span class=\"katex-inline\">b=a-1<\/span> 是 4 的倍数，即 <span class=\"katex-inline\">a\\equiv1\\pmod4<\/span>。\n<\/ol>\n<p><strong>全周期<\/strong>：周期长度等于模数 <span class=\"katex-inline\">m<\/span>，一轮内出现全部 <span class=\"katex-inline\">m<\/span> 个不同余数。<\/p>\n<p><strong>互素<\/strong>：两数最大公因数为 1，除 1 外没有公共因子。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">m=16<\/span>，<span class=\"katex-inline\">a=5<\/span>，<span class=\"katex-inline\">c=3<\/span>。核验：(i) <span class=\"katex-inline\">\\gcd(3,16)=1<\/span>；(ii) 整除 16 的素数只有 <span class=\"katex-inline\">p=2<\/span>，<span class=\"katex-inline\">b=4<\/span> 是 2 的倍数；(iii) 16 是 4 的倍数，<span class=\"katex-inline\">b=4<\/span> 是 4 的倍数。三条满足，周期 16。<\/p>\n<p><strong>反例<\/strong>：<span class=\"katex-inline\">m=16<\/span>，<span class=\"katex-inline\">a=5<\/span>，<span class=\"katex-inline\">c=0<\/span>。条件 (i) 不满足，<span class=\"katex-inline\">\\gcd(0,16)=16\\ne1<\/span>；序列 <span class=\"katex-inline\">1,5,9,13,1<\/span> 周期 4。再如 <span class=\"katex-inline\">a=1<\/span> 时 <span class=\"katex-inline\">b=0<\/span>，条件 (ii)(iii) 空满足，但序列按步长 <span class=\"katex-inline\">c<\/span> 直线前进，散布性质差；定理 A 只保证周期长度，不保证随机质量。<\/p>\n<h2>原理推导：三条条件怎样分别管住素因子分量<\/h2>\n<p>按中国剩余定理方向，把 <span class=\"katex-inline\">m<\/span> 分解成素数幂乘积，模 <span class=\"katex-inline\">m<\/span> 的行为分解到各素数幂分量上分别考察；各分量周期都拉满，合并周期才等于 <span class=\"katex-inline\">m<\/span>。<\/p>\n<ul><li>\n条件 (i)：<span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">m<\/span> 互素，意味着平移 <span class=\"katex-inline\">x\\mapsto x+c<\/span> 在模 <span class=\"katex-inline\">m<\/span> 加法群上可逆，每个初值都能被增量带到不同轨道上，不被 <span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">m<\/span> 的公共因子压成子群。\n<\/li><li>\n条件 (ii)：对每个素因子 <span class=\"katex-inline\">p<\/span>，<span class=\"katex-inline\">a\\equiv1\\pmod p<\/span>，乘加变换在 <span class=\"katex-inline\">p<\/span> 分量上不引入额外的收缩方向；若 <span class=\"katex-inline\">a\\not\\equiv1\\pmod p<\/span>，<span class=\"katex-inline\">p<\/span> 分量上的轨道会退化。\n<\/li><li>\n条件 (iii)：<span class=\"katex-inline\">2<\/span> 的幂含 <span class=\"katex-inline\">4<\/span> 时单独加严，要求 <span class=\"katex-inline\">a\\equiv1\\pmod4<\/span>；这是 <span class=\"katex-inline\">2<\/span> 分量上比奇素因子更强的约束，缺了它 <span class=\"katex-inline\">4<\/span> 的倍数分量上周期达不到满。\n<\/ul>\n<p>书里注明：该定理在 <span class=\"katex-inline\">c=1<\/span>、<span class=\"katex-inline\">X_0=0<\/span> 特例上的证明思想可追溯到更早；一般情形的充分性由托马斯·赫尔（Thomas Hull）与艾伦·多贝尔（Alan Dobell）证明，见 SIAM Review 4 (1962), 230–254（转述自原书页注）。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：递推是标准线性同余 <span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span>；目标是周期长度等于 <span class=\"katex-inline\">m<\/span>。\n<\/li><li>\n失败案例 1：违反条件 (i)。<span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">m<\/span> 有公共因子 <span class=\"katex-inline\">d&gt;1<\/span>，所有项都落在模 <span class=\"katex-inline\">d<\/span> 的同一个剩余类里，一轮覆盖不到 <span class=\"katex-inline\">m<\/span> 个值。\n<\/li><li>\n失败案例 2：违反条件 (ii)。<span class=\"katex-inline\">m<\/span> 含素因子 <span class=\"katex-inline\">p<\/span> 但 <span class=\"katex-inline\">a-1<\/span> 不被 <span class=\"katex-inline\">p<\/span> 整除，<span class=\"katex-inline\">p<\/span> 分量上周期缩短，整体周期只是 <span class=\"katex-inline\">m<\/span> 的真因子。\n<\/li><li>\n失败案例 3：<span class=\"katex-inline\">m<\/span> 被 4 整除但 <span class=\"katex-inline\">a-1<\/span> 只被 2 整除、不被 4 整除，<span class=\"katex-inline\">2<\/span> 的高次幂分量退化。\n<\/li><li>\n边界：定理 A 判定的是周期长度；全周期序列仍可能在统计检验中暴露结构缺陷，随机性还要靠 c04、c05 的检验把关。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>全周期 vs 最大随机质量<\/strong>：定理 A 保证遍历全部余数，不保证相邻项独立、高维散布均匀；<span class=\"katex-inline\">a=1<\/span> 型直线序列可以周期满但一眼可辨。\n<\/li><li>\n<strong>条件 (ii) 与 (iii) 的分工<\/strong>：(ii) 管每个奇素因子与 <span class=\"katex-inline\">2<\/span> 本身，(iii) 专门加严 <span class=\"katex-inline\">4\\mid m<\/span> 的情形；后者不能被前者覆盖。\n<\/li><li>\n<strong>互素对象别搞错<\/strong>：条件 (i) 要求 <span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">m<\/span> 互素，不是 <span class=\"katex-inline\">a<\/span> 与 <span class=\"katex-inline\">m<\/span>；乘数与模互素是另一类问题（见 c03 零增量情形）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的递推式与周期上界、最大公因数、素因子分解。后继：c03 在 <span class=\"katex-inline\">c=0<\/span> 情形去掉增量，周期改由 <span class=\"katex-inline\">a<\/span> 模 <span class=\"katex-inline\">m<\/span> 的阶决定；c05 谱检验在长周期基础上进一步检查高维格结构。定理 A 是选择 <span class=\"katex-inline\">m<\/span>、<span class=\"katex-inline\">a<\/span>、<span class=\"katex-inline\">c<\/span> 三个参数的直接准绳。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（全周期定理 A（Hull-Dobell）：周期达到模数的充要条件）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：定理 A 三条条件的分量对应、全周期手算与反例核验<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要判定周期能否拉满，往回追五层：<\/p>\n<ol><li>\n<strong>周期上界<\/strong>：序列取值共 <span class=\"katex-inline\">m<\/span> 种，周期不超过 <span class=\"katex-inline\">m<\/span>（c01）。\n<\/li><li>\n<strong>模分解<\/strong>：把 <span class=\"katex-inline\">m<\/span> 拆成素数幂乘积，模 <span class=\"katex-inline\">m<\/span> 的行为按中国剩余定理方向分解到各素因子分量。\n<\/li><li>\n<strong>平移可逆性<\/strong>：增量 <span class=\"katex-inline\">c<\/span> 在模 <span class=\"katex-inline\">m<\/span> 加法群中是否可逆，决定初值能否被带到不同轨道。\n<\/li><li>\n<strong>乘子余数结构<\/strong>：乘数 <span class=\"katex-inline\">a<\/span> 在每个素因子模下的余数，决定该分量上轨道是否收缩。\n<\/li><li>\n<strong>2 的幂加严<\/strong>：含因子 4 时，<span class=\"katex-inline\">2<\/span> 分量需要比奇素因子更强的同余约束。\n<\/ol>\n<p>依赖链方向：周期上界 → 素因子分量分解 → 平移条件 → 乘子同余条件 → 全周期判定。<\/p>\n<h2>正向推导：三条条件各自管住哪个分量<\/h2>\n<p>定理 A：周期等于 <span class=\"katex-inline\">m<\/span> 当且仅当 (i) <span class=\"katex-inline\">\\gcd(c,m)=1<\/span>；(ii) 对每个整除 <span class=\"katex-inline\">m<\/span> 的素数 <span class=\"katex-inline\">p<\/span>，<span class=\"katex-inline\">p\\mid(a-1)<\/span>；(iii) 若 <span class=\"katex-inline\">4\\mid m<\/span>，则 <span class=\"katex-inline\">4\\mid(a-1)<\/span>。<\/p>\n<p><strong>条件 (i) 的作用<\/strong>。<span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">m<\/span> 互素，意味着映射 <span class=\"katex-inline\">x\\mapsto x+c\\bmod m<\/span> 是加法群上的可逆平移：<span class=\"katex-inline\">c<\/span> 在模 <span class=\"katex-inline\">m<\/span> 下存在逆元，反复加 <span class=\"katex-inline\">c<\/span> 可以走遍整个剩余类群。若 <span class=\"katex-inline\">d=\\gcd(c,m)&gt;1<\/span>，所有项都留在模 <span class=\"katex-inline\">d<\/span> 的同一个剩余类里，一轮覆盖不到 <span class=\"katex-inline\">m<\/span> 个值。<\/p>\n<p><strong>条件 (ii) 的作用<\/strong>。对素因子 <span class=\"katex-inline\">p<\/span>，要求 <span class=\"katex-inline\">a\\equiv1\\pmod p<\/span>。乘加变换在 <span class=\"katex-inline\">p<\/span> 分量上不引入额外收缩方向；若 <span class=\"katex-inline\">a\\not\\equiv1\\pmod p<\/span>，该分量上的轨道长度只是 <span class=\"katex-inline\">p-1<\/span> 或其真因子，整体周期达不到满。<\/p>\n<p><strong>条件 (iii) 的作用<\/strong>。<span class=\"katex-inline\">2<\/span> 的幂分量与奇素因子不同：当 <span class=\"katex-inline\">4\\mid m<\/span> 时，仅 <span class=\"katex-inline\">a\\equiv1\\pmod2<\/span> 不够，必须 <span class=\"katex-inline\">a\\equiv1\\pmod4<\/span>。这是对 <span class=\"katex-inline\">2<\/span> 的高次幂单独加严的约束。<\/p>\n<p><strong>分量合并<\/strong>。各素数幂分量的周期分别拉满后，合并周期取各分量周期的最小公倍数；各分量周期都等于对应分量大小，合并周期才等于 <span class=\"katex-inline\">m<\/span>。三条条件分别保证各分量不退化，缺一条就有分量拖短整体周期。<\/p>\n<h2>数值算例一：<span class=\"katex-inline\">m=16,a=5,c=3<\/span> 全周期核验<\/h2>\n<p>逐条核验定理 A：<\/p>\n<ol><li>\n(i) <span class=\"katex-inline\">\\gcd(3,16)=1<\/span>，满足。\n<\/li><li>\n(ii) 整除 16 的素数只有 <span class=\"katex-inline\">p=2<\/span>，<span class=\"katex-inline\">a-1=4<\/span>，<span class=\"katex-inline\">2\\mid4<\/span>，满足。\n<\/li><li>\n(iii) <span class=\"katex-inline\">16<\/span> 是 4 的倍数，<span class=\"katex-inline\">4\\mid4<\/span>，满足。\n<\/ol>\n<p>三条成立，周期应为 16。取 <span class=\"katex-inline\">X_0=0<\/span> 逐步递推：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><span class=\"katex-inline\">n<\/span><\/th><th><span class=\"katex-inline\">X_n<\/span><\/th><th><span class=\"katex-inline\">n<\/span><\/th><th><span class=\"katex-inline\">X_n<\/span><\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>9<\/td><td>11<\/td><\/tr><tr><td>1<\/td><td>3<\/td><td>10<\/td><td>10<\/td><\/tr><tr><td>2<\/td><td>2<\/td><td>11<\/td><td>5<\/td><\/tr><tr><td>3<\/td><td>13<\/td><td>12<\/td><td>12<\/td><\/tr><tr><td>4<\/td><td>4<\/td><td>13<\/td><td>15<\/td><\/tr><tr><td>5<\/td><td>7<\/td><td>14<\/td><td>14<\/td><\/tr><tr><td>6<\/td><td>6<\/td><td>15<\/td><td>9<\/td><\/tr><tr><td>7<\/td><td>1<\/td><td>16<\/td><td>0<\/td><\/tr><tr><td>8<\/td><td>8<\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<p>前 16 项 <span class=\"katex-inline\">0,3,2,13,4,7,6,1,8,11,10,5,12,15,14,9<\/span> 互不相同，第 16 项回到 0，周期 16，与定理判定一致。<\/p>\n<h2>数值算例二：违反条件 (i) 的短周期<\/h2>\n<p>参数 <span class=\"katex-inline\">m=16<\/span>，<span class=\"katex-inline\">a=5<\/span>，<span class=\"katex-inline\">c=0<\/span>，<span class=\"katex-inline\">X_0=1<\/span>。条件 (i)：<span class=\"katex-inline\">\\gcd(0,16)=16\\ne1<\/span>，不满足。递推：<\/p>\n<ol><li>\n<span class=\"katex-inline\">X_1=5\\cdot1\\bmod16=5<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">X_2=5\\cdot5\\bmod16=25\\bmod16=9<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">X_3=5\\cdot9\\bmod16=45\\bmod16=13<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">X_4=5\\cdot13\\bmod16=65\\bmod16=1=X_0<\/span>。\n<\/ol>\n<p>序列 <span class=\"katex-inline\">1,5,9,13<\/span>，周期 4，远小于 16。增量为 0 时 <span class=\"katex-inline\">c<\/span> 与模不可能互素，条件 (i) 直接排除；周期改由 <span class=\"katex-inline\">a<\/span> 模 <span class=\"katex-inline\">m<\/span> 的阶决定（c03）。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>条件 (ii) 失守<\/strong>。设 <span class=\"katex-inline\">m<\/span> 含素因子 <span class=\"katex-inline\">p<\/span> 但 <span class=\"katex-inline\">a-1<\/span> 不被 <span class=\"katex-inline\">p<\/span> 整除，<span class=\"katex-inline\">p<\/span> 分量上乘子留在非 1 剩余类，轨道被限制在子群内；合并周期只是 <span class=\"katex-inline\">m<\/span> 的真因子。核验时先列 <span class=\"katex-inline\">m<\/span> 的全部素因子，逐个对 <span class=\"katex-inline\">p<\/span> 检查 <span class=\"katex-inline\">a-1<\/span> 的整除性，不能只看最大素因子。<\/p>\n<p><strong>条件 (iii) 漏检<\/strong>。<span class=\"katex-inline\">m<\/span> 被 4 整除时，若 <span class=\"katex-inline\">a-1<\/span> 只被 2 整除、不被 4 整除，<span class=\"katex-inline\">2<\/span> 的高次幂分量退化；常见错误是拿条件 (ii) 覆盖一切素因子，忘了 <span class=\"katex-inline\">4\\mid m<\/span> 这一条加严。<\/p>\n<p><strong>把全周期当随机质量<\/strong>。定理 A 只判定周期长度；<span class=\"katex-inline\">a=1<\/span> 型等差序列即便周期拉满，相邻项差恒定，结构外露。周期合格之后，仍要过 c04 经验检验与 c05 谱检验。<\/p>\n<h2>延伸推演：条件与 <span class=\"katex-inline\">b=a-1<\/span> 的写法<\/h2>\n<p>定理书里用 <span class=\"katex-inline\">b=a-1<\/span> 表述条件 (ii)(iii)：<span class=\"katex-inline\">b<\/span> 被每个素因子 <span class=\"katex-inline\">p<\/span> 整除；<span class=\"katex-inline\">4\\mid m<\/span> 时 <span class=\"katex-inline\">b<\/span> 被 4 整除。换 <span class=\"katex-inline\">a<\/span> 表述就是 <span class=\"katex-inline\">a\\equiv1\\pmod p<\/span>、<span class=\"katex-inline\">a\\equiv1\\pmod4<\/span>。两种写法等价，核验时先算 <span class=\"katex-inline\">b=a-1<\/span> 再做整除检查，避免直接对 <span class=\"katex-inline\">a<\/span> 取模时把 1 的位置搞错。<\/p>\n<h2>延伸一层：素因子分解与分量周期<\/h2>\n<p>把 <span class=\"katex-inline\">m<\/span> 写成素数幂乘积 <span class=\"katex-inline\">m=\\prod p_j^{e_j}<\/span>。模 <span class=\"katex-inline\">m<\/span> 的剩余类按各 <span class=\"katex-inline\">p_j^{e_j}<\/span> 分量独立取值，序列在每个分量上有自己的周期 <span class=\"katex-inline\">p_j<\/span>，合并周期是各 <span class=\"katex-inline\">p_j<\/span> 的最小公倍数。全周期要求合并周期等于 <span class=\"katex-inline\">m<\/span>，等价于每个分量周期都等于该分量大小 <span class=\"katex-inline\">p_j^{e_j}<\/span>。条件 (ii) 管每个素因子 <span class=\"katex-inline\">p<\/span> 上的乘子余数，条件 (iii) 专门加强 <span class=\"katex-inline\">2^{e}<\/span> 分量；条件 (i) 保证平移在整个加法群上可逆，不被公共因子压进子群。三条条件分别对应分量结构的不同侧面，核验时先列素因子分解，再逐条对号入座。<\/p>\n<h2>数值算例三：<span class=\"katex-inline\">m=8<\/span> 上的条件对照<\/h2>\n<p>取 <span class=\"katex-inline\">m=8<\/span>，<span class=\"katex-inline\">a=5<\/span>，<span class=\"katex-inline\">c=1<\/span>。核验：(i) <span class=\"katex-inline\">\\gcd(1,8)=1<\/span>；(ii) 素因子 <span class=\"katex-inline\">p=2<\/span>，<span class=\"katex-inline\">a-1=4<\/span> 被 2 整除；(iii) <span class=\"katex-inline\">8<\/span> 被 4 整除，<span class=\"katex-inline\">a-1=4<\/span> 被 4 整除。三条满足，周期应为 8。手算 <span class=\"katex-inline\">X_0=0<\/span>：<span class=\"katex-inline\">X_1=1<\/span>，<span class=\"katex-inline\">X_2=6<\/span>，<span class=\"katex-inline\">X_3=7<\/span>，<span class=\"katex-inline\">X_4=4<\/span>，<span class=\"katex-inline\">X_5=5<\/span>，<span class=\"katex-inline\
