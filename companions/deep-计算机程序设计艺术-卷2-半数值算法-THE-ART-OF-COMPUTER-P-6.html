\"katex-inline\">n^2<\/span> 增长很快。困难在于：通用乘法的运行时间是否一定随 <span class=\"katex-inline\">n^2<\/span> 增长？能不能利用分治把乘法拆成更少的半长乘法，把阶压下来？§4.3.3「乘法有多快？」正面追问这个问题，区分&quot;允许对特定 <span class=\"katex-inline\">n<\/span> 建大乘法表&quot;与&quot;在通用数字计算机上运行的算法&quot;两种口径。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>常规算法（Algorithm 4.3.1M 方向）<\/strong>：按位竖式相乘，<span class=\"katex-inline\">m<\/span> 位与 <span class=\"katex-inline\">n<\/span> 位相乘约 <span class=\"katex-inline\">cmn<\/span> 次操作，<span class=\"katex-inline\">c<\/span> 为常数；<span class=\"katex-inline\">m=n<\/span> 时为 <span class=\"katex-inline\">O(n^2)<\/span>。<\/p>\n<p><strong>通用算法<\/strong>：以任意两个按位记数的 <span class=\"katex-inline\">n<\/span> 位数为输入，输出乘积；不依赖为某个确定 <span class=\"katex-inline\">n<\/span> 预先建好的查表。<\/p>\n<p><strong>分治乘法方向<\/strong>：把两个 <span class=\"katex-inline\">n<\/span> 位数各拆成两半，高位半与低位半；直接展开需要 4 次半长乘法，改进路线用 3 次半长乘法加线性加减完成合并。<\/p>\n<p><strong>递推复杂度<\/strong>：<span class=\"katex-inline\">T(n)=3T(n/2)+O(n)<\/span>，解为 <span class=\"katex-inline\">O(n^{\\log_2 3})\\approx O(n^{1.585})<\/span>，低于平方阶。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">n=1000<\/span> 时竖式乘法约 <span class=\"katex-inline\">10^6<\/span> 次数位相乘；三分治路线按 <span class=\"katex-inline\">3^{\\log_2 n}<\/span> 方向，半长乘法次数降到数万量级（估算方向，具体随实现）。<\/p>\n<p><strong>反例<\/strong>：为固定 <span class=\"katex-inline\">n<\/span> 造一张巨大乘法表，查表 <span class=\"katex-inline\">O(1)<\/span> 完成；这不算通用算法，换位数表就作废。<\/p>\n<h2>原理推导：为什么分治能减少乘法次数<\/h2>\n<p>设 <span class=\"katex-inline\">u=u_1b^{n/2}+u_0<\/span>，<span class=\"katex-inline\">v=v_1b^{n/2}+v_0<\/span>。直接展开：<\/p>\n<div class=\"katex-block\">uv=u_1v_1b^n+(u_1v_0+u_0v_1)b^{n/2}+u_0v_0<\/div>\n<p>交叉项 <span class=\"katex-inline\">u_1v_0+u_0v_1<\/span> 直接算要两次半长乘法，合计 4 次。改进路线先算 <span class=\"katex-inline\">u_1v_1<\/span>、<span class=\"katex-inline\">u_0v_0<\/span>，再算 <span class=\"katex-inline\">(u_1+u_0)(v_1+v_0)<\/span>，交叉项由三者相减得到，半长乘法降到 3 次。递归对半长整数再拆，每层乘法数按 3 倍增长、规模按半折，得 <span class=\"katex-inline\">T(n)=3T(n/2)+O(n)<\/span>。<\/p>\n<p>推导依据：加减是线性代价，乘法是递归主体；用线性加减替换一次半长乘法，递归树的分支因子从 4 降到 3。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：位数足够大，分治合并的线性开销摊得薄；小位数上竖式更划算，递归阈值以下退回经典算法。\n<\/li><li>\n失败案例 1：位数很小时硬递归，合并加减开销超过省下的乘法，反而变慢。\n<\/li><li>\n失败案例 2：把&quot;查表加速&quot;当通用复杂度结论；预计算表只对固定输入规模有效。\n<\/li><li>\n边界：分治改进仍属多项式阶；更高效率的乘法路线（书 §4.3.3 后续与循环乘积方向）在更大规模上继续讨论。循环卷积与多项式乘积可借用同一套快速变换，规模越大收益越明显；小位数区间内竖式常数更优，分治阈值以下不递归。\n<\/ul>\n<p><strong>阈值与实现边界<\/strong>：分治不是越大越好。递归拆到小位数时，半长乘法的合并加减已经超过省下的那一次乘法，因此实现上要设阈值：位数低于阈值退回竖式经典算法，高于阈值才继续拆分。合并阶段处理高位半与低位半的进位、符号与重叠项，簿记开销随递归层累积；只有位数足够大，分支因子下降带来的收益才盖过这部分线性开销。复杂度阶比较的是渐近行为，实际选型还要看阈值内的常数与机器字长。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>操作数 vs 乘法次数<\/strong>：复杂度阶按单步操作计数；加减与乘法在递归里权重不同，分治正是用便宜运算换昂贵乘法。\n<\/li><li>\n<strong><span class=\"katex-inline\">O(n^2)<\/span> 竖式 vs 分治<\/strong>：竖式不拆，<span class=\"katex-inline\">mn<\/span> 次相乘；分治拆半降分支因子，阶低于平方。\n<\/li><li>\n<strong>大整数乘法 vs 多项式卷积<\/strong>：两者结构同构，循环乘积（书 §4.3.2 习题方向）与多项式系数卷积可共用快速乘法思路。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c09 竖式乘法与部分积累加。后继：c12 多项式乘法按卷积展开，同样面对 <span class=\"katex-inline\">n^2<\/span> 项与分治改进；c11 辗转相除的步数对数增长，与本节乘法代价对照，构成大整数运算两类核心代价。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（大整数乘法的复杂度：从平方算法到分治快速乘法）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：分治乘法的拆分、递推求解与规模估算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>乘法复杂度往回追四层：<\/p>\n<ol><li>\n<strong>竖式乘法<\/strong>：<span class=\"katex-inline\">m<\/span> 位乘 <span class=\"katex-inline\">n<\/span> 位约 <span class=\"katex-inline\">mn<\/span> 次单步操作（c09）。\n<\/li><li>\n<strong>拆分对象<\/strong>：两个 <span class=\"katex-inline\">n<\/span> 位数各切高位半、低位半。\n<\/li><li>\n<strong>乘法次数优化<\/strong>：直接展开 4 次半长乘法，改进路线 3 次加线性加减。\n<\/li><li>\n<strong>递归求解<\/strong>：递推式定出渐近阶，低于平方。\n<\/ol>\n<p>依赖链方向：竖式 <span class=\"katex-inline\">mn<\/span> 次 → 半长拆分 → 3 次半长乘法 → 递推 <span class=\"katex-inline\">T(n)=3T(n/2)+O(n)<\/span>。<\/p>\n<h2>正向推导：直接展开的四次半长乘法<\/h2>\n<p>设 <span class=\"katex-inline\">u=u_1b^{n/2}+u_0<\/span>，<span class=\"katex-inline\">v=v_1b^{n/2}+v_0<\/span>。乘积：<\/p>\n<div class=\"katex-block\">uv=u_1v_1b^n+(u_1v_0+u_0v_1)b^{n/2}+u_0v_0<\/div>\n<p>其中 <span class=\"katex-inline\">u_1v_1<\/span>、<span class=\"katex-inline\">u_0v_0<\/span>、<span class=\"katex-inline\">u_1v_0<\/span>、<span class=\"katex-inline\">u_0v_1<\/span> 是四次半长乘法。交叉项 <span class=\"katex-inline\">u_1v_0+u_0v_1<\/span> 单独算又要两次，朴素拆分合计四次主体乘法。<\/p>\n<h2>正向推导：三次半长乘法的合并<\/h2>\n<p>先算 <span class=\"katex-inline\">A=u_1v_1<\/span>，<span class=\"katex-inline\">B=u_0v_0<\/span>，再算 <span class=\"katex-inline\">C=(u_1+u_0)(v_1+v_0)<\/span>。交叉项：<\/p>\n<div class=\"katex-block\">u_1v_0+u_0v_1=C-A-B<\/div>\n<p>半长乘法降到 3 次，多出的是加法、减法与移位合并，属线性代价。递归对半长整数再拆，每层乘法数按 3 倍增长、规模按半折。<\/p>\n<h2>递推求解<\/h2>\n<div class=\"katex-block\">T(n)=3T(n/2)+O(n)<\/div>\n<p>递归树每层：分支因子 3，规模折半。按主定理方向，解为 <span class=\"katex-inline\">T(n)=O(n^{\\log_2 3})<\/span>，<span class=\"katex-inline\">\\log_2 3\\approx1.585<\/span>，低于平方阶 <span class=\"katex-inline\">O(n^2)<\/span>。推导依据：加减是线性代价，递归主体是乘法；用便宜运算换昂贵乘法，分支因子从 4 降到 3。<\/p>\n<h2>数值算例：<span class=\"katex-inline\">n=1000<\/span> 的次数估算<\/h2>\n<p>竖式乘法：约 <span class=\"katex-inline\">1000\\times1000=10^6<\/span> 次数位相乘。分治路线：半长乘法次数随 <span class=\"katex-inline\">3^{\\log_2 n}<\/span> 增长，<span class=\"katex-inline\">\\log_2 1000\\approx9.97<\/span>，<span class=\"katex-inline\">3^{9.97}\\approx5.7\\times10^4<\/span>，约为竖式的二十分之一量级；合并加减另计。这是渐近方向的估算，实际阈值以下退回竖式。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>小位数硬递归<\/strong>：半长合并的加减开销超过省下的乘法，小位数上反而变慢；必须设阈值，低于阈值走竖式。<\/p>\n<p><strong>查表当通用算法<\/strong>：为固定 <span class=\"katex-inline\">n<\/span> 造大乘法表，查表 <span class=\"katex-inline\">O(1)<\/span>；换位数表作废，不算通用数字计算机算法。<\/p>\n<p><strong>只看乘法次数不计合并<\/strong>：分治省下乘法但增加加减与簿记；规模不够大时净收益为负。<\/p>\n<h2>延伸推演：多项式卷积与循环乘积<\/h2>\n<p>两个 <span class=\"katex-inline\">n<\/span> 次多项式卷积有 <span class=\"katex-inline\">(n+1)^2<\/span> 个系数乘积项，与大整数乘法同构；循环卷积（书 §4.3.2 习题方向）可借用同一套快速变换。分治思路在系数串与数位串上互相迁移。<\/p>\n<h2>延伸一层：四次到三次的代数核对<\/h2>\n<p>直接展开交叉项 <span class=\"katex-inline\">u_1v_0+u_0v_1<\/span>。由 <span class=\"katex-inline\">C=(u_1+u_0)(v_1+v_0)=u_1v_1+u_1v_0+u_0v_1+u_0v_0<\/span>，减去 <span class=\"katex-inline\">A=u_1v_1<\/span> 与 <span class=\"katex-inline\">B=u_0v_0<\/span>，恰得 <span class=\"katex-inline\">u_1v_0+u_0v_1<\/span>。三次半长乘法 <span class=\"katex-inline\">A,B,C<\/span> 覆盖原四次项，替换出去的两次乘法由一次加法、一次减法完成。代数核对确认没有丢项：<span class=\"katex-inline\">C<\/span> 展开的四个乘积项与直接展开一一对应。<\/p>\n<h2>数值算例二：小位数拆分核对<\/h2>\n<p>取 <span class=\"katex-inline\">u=12<\/span>，<span class=\"katex-inline\">v=34<\/span>，按十进制半长：<span class=\"katex-inline\">u_1=1,u_0=2<\/span>，<span class=\"katex-inline\">v_1=3,v_0=4<\/span>。<span class=\"katex-inline\">A=1\\cdot3=3<\/span>，<span class=\"katex-inline\">B=2\\cdot4=8<\/span>，<span class=\"katex-inline\">C=(1+2)(3+4)=21<\/span>，交叉项 <span class=\"katex-inline\">21-3-8=10<\/span>。乘积 <span class=\"katex-inline\">uv=3\\cdot100+10\\cdot10+8=408<\/span>，与竖式一致。小位数上三次乘法加合并并不比竖式快，核对只用于确认拆分代数正确。<\/p>\n<h2>延伸推演：递归阈值与实现分层<\/h2>\n<p>分治拆到低位规模时，半长乘法的合并簿记超过省下的乘法，实现上设阈值：位数高于阈值继续递归，低于阈值退回经典竖式。阈值由实测常数决定，不是渐近理论给出。递归层的进位、符号、重叠项要逐层簿记；规模不够大时，这些线性开销吃掉阶改进的收益。<\/p>\n<h2>对照辨析：渐近阶与小常数<\/h2>\n<p><span class=\"katex-inline\">O(n^{1.585})<\/span> 低于 <span class=\"katex-inline\">O(n^2)<\/span> 是大位数方向的结论；小位数上竖式常数更小。选型不能只看渐近阶，要结合实际位数区间、阈值与机器字长。查表法在固定输入规模下 <span class=\"katex-inline\">O(1)<\/span>，但换规模即作废，不属于通用数字计算机算法口径。<\/p>\n<h2>失败案例补充：合并项溢出未处理<\/h2>\n<p>半长相加 <span class=\"katex-inline\">u_1+u_0<\/span> 可能进位到高位，<span class=\"katex-inline\">v_1+v_0<\/span> 同样可能进位到高位；递归合并时不处理这一进位，高位项错位。分治实现要把半长之和的进位纳入高位簿记，与 c09 竖式进位规则一致。只拆数位不处理进位，分解结果会偏低。<\/p>\n<h2>再推一层：快速乘法与卷积的迁移<\/h2>\n<p>多项式卷积 <span class=\"katex-inline\">(n+1)^2<\/span> 个乘积项与大整数竖式乘法同构，分治减少乘法次数的思路可直接迁移；循环乘积借快速变换实现。c12 多项式乘法、c09 多精度竖式是这条改进路线的两端，本节的递推分析是中间接口。<\/p>\n<h2>补充推演：递推式的递归树求解<\/h2>\n<p><span class=\"katex-inline\">T(n)=3T(n/2)+O(n)<\/span>：每层递归规模折半，分支数 3。第 <span class=\"katex-inline\">l<\/span> 层有 <span class=\"katex-inline\">3^l<\/span> 个子问题，每个规模 <span class=\"katex-inline\">n/2^l<\/span>；层代价 <span class=\"katex-inline\">O(n)<\/span>。展开到叶子层 <span class=\"katex-inline\">\\log_2 n<\/span>，叶子数 <span class=\"katex-inline\">3^{\\log_2 n}=n^{\\log_2 3}<\/span>。主定理方向给出 <span class=\"katex-inline\">T(n)=O(n^{\\log_2 3})<\/span>，<span class=\"katex-inline\">\\log_2 3\\approx1.585<\/span>。分支因子 3 来自三次半长乘法；若退回四次，阶变为 <span class=\"katex-inline\">n^2<\/span>。减少递归分支数是降阶的关键。<\/p>\n<h2>补充算例：阈值以下的竖式回退<\/h2>\n<p>位数 <span class=\"katex-inline\">n<\/span> 低于阈值时，半长拆分的合并加减超过省下的乘法，实现回退经典竖式。阈值由实测：在目标机器上测不同位数的两种算法交点，取交点以下为竖式区。渐近阶改进只在大位数区兑现，小位数区保留竖式常数优势。<\/p>\n<h2>补充辨析：分治乘法与查表加速<\/h2>\n<p>查表对固定 <span class=\"katex-inline\">n<\/span> 预计算乘积，<span class=\"katex-inline\">O(1)<\/span> 取用；换规模表作废，不属于通用算法。分治对任意 <span class=\"katex-inline\">n<\/span> 递归拆分，是数字计算机上的通用改进。复杂度讨论的&quot;通用&quot;口径排除预计算查表，这是书 §4.3.3 明确的问题设定。<\/p>\n<h2>失败案例补充：半长进位未纳入簿记<\/h2>\n<p><span class=\"katex-inline\">u_1+u_0<\/span>、<span class=\"katex-inline\">v_1+v_0<\/span> 可能进位到高位；递归合并忽略这一进位，高位项错位。分治实现要把半长之和的进位并入高位项，规则与 c09 竖式进位一致。拆分只分数位，不改变进位折算规则。<\/p>\n<h2>补充一层：快速乘法的迁移链条<\/h2>\n<p>多项式卷积与大整数乘法同构，分治减乘思路可迁移；循环乘积借快速变换实现。c09 竖式是基准，c10 是大位数改进，c12 多项式乘法复用同一结构。复杂度分析的对象从数位串推广到系数串。<\/p>\n<h2>补充推演：分治的合并代价归属<\/h2>\n<p>三次半长乘法之外，加、减、移位是线性 <span class=\"katex-inline\">O(n)<\/span> 代价；递归式 <span class=\"katex-inline\">T(n)=3T(n/2)+O(n)<\/span> 把线性项归入非递归层。若合并簿记做重，线性常数变大，但不改变渐近阶；小位数区常数主导，阈值以下回退竖式。阶改进靠分支因子下降，不靠压缩线性项。<\/p>\n<h2>补充算例：<span class=\"katex-inline\">n=1000<\/span> 的量级对照<\/h2>\n<p>竖式 <span class=\"katex-inline\">10^6<\/span> 次数位相乘；分治 <span class=\"katex-inline\">3^{\\log_2 1000}\\approx5.7\\times10^4<\/span> 半长乘法，加线性合并。这是渐近方向估算，实际交点由机器常数定。位数越大，阶差距越明显；小位数竖式常数更优。<\/p>\n<h2>补充辨析：乘法阶与卷积阶<\/h2>\n<p>大整数乘法与多项式卷积同构，<span class=\"katex-inline\">n^2<\/span> 项的结构相同；快速变换在两类对象上通用。分治减乘思路不限于整数，系数串乘法可复用。<\/p>\n<h2>补充一层：复杂度结论的适用区间<\/h2>\n<p><span class=\"katex-inline\">O(n^{1.585})<\/span> 是大位数渐近结论；小位数区竖式常数更优，阈值以下不递归。通用口径排除固定查表。选型结合实际位数区间、机器常数与进位簿记，不把渐近阶当成全区间优劣判据。<\/p>\n<h2>补充一层：分治实现的簿记清单<\/h2>\n<p>半长拆分、三次乘法、交叉项合并、进位回写；每一步的高位进位纳入簿记。递归阈值以下回退竖式。清单逐项核对，避免只拆数位不处理进位，或小位数硬递归吃掉阶改进收益。<\/p>\n<h2>补充一层：减乘思路的复用条件<\/h2>\n<p>分治减少的是昂贵乘法次数，加减移位保持线性；复用前提是对象能对半拆分、合并项可用线性运算表达。多项式卷积满足这两个条件，因此同一思路迁移；不满足拆分条件的运算不能硬套。<\/p>\n<h2>补充一层：与竖式基准的对照测试<\/h2>\n<p>分治结果先与竖式小位数结果逐位核对一致，再上大位数；拆分、合并、进位每一层都可用小例子回代验证。正确性以竖式基准为对照，阶改进以大位数实测为准。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出两数半长拆分后的乘积展开式。\n<\/li><li>\n三次半长乘法路线怎样算出交叉项？哪一项被线性加减替换？\n<\/li><li>\n递推 <span class=\"katex-inline\">T(n)=3T(n/2)+O(n)<\/span> 的渐近阶是多少？\n<\/li><li>\n<span class=\"katex-inline\">n=1000<\/span> 时竖式与分治的次数各是什么量级？\n<\/li><li>\n为什么小位数上分治可能反而变慢？阈值起什么作用？\n<\/ol><\/div><\/details>", "c11": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷2 半数值算法.pdf · p.267<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">多精度经典算术：进位借位、竖式乘法与除法<\/a><\/span><\/div><h1>最大公因数与欧几里得算法：连分数、最坏情形与斐波那契数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（原书 §4.5.2–4.5.3，PDF 第 267、277 页）\n<\/ul>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>分数要约成既约形式，约分要求分子分母同除以最大公因数；判断两数是否互素、模运算中求逆元，也都落在最大公因数上。困难在于：大整数逐个试除到较小数，步数随数值线性增长，推广到多精度时代价失控。欧几里得算法用辗转取余把数对不断换小，步数随位数对数增长；§4.5.3 进一步分析它最坏要走几步、为什么最坏情形是斐波那契数。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>最大公因数 <span class=\"katex-inline\">\\gcd(u,v)<\/span><\/strong>：同时整除 <span class=\"katex-inline\">u,v<\/span> 的最大正整数。<\/p>\n<p><strong>欧几里得算法（算法 4.5.2A 方向）<\/strong>：若 <span class=\"katex-inline\">v=0<\/span>，答案为 <span class=\"katex-inline\">u<\/span>；否则令 <span class=\"katex-inline\">u=qv+r<\/span>，以 <span class=\"katex-inline\">(v,r)<\/span> 替换 <span class=\"katex-inline\">(u,v)<\/span> 重复，直到余数为 0。<\/p>\n<p><strong>连分数<\/strong>：形如<\/p>\n<div class=\"katex-block\">\\frac{b_1}{a_1+\\frac{b_2}{a_2+\\cdots}}<\/div>\n<p>系数全 1 时与辗转相除步骤一一对应；书 §4.5.3 记 <span class=\"katex-inline\">\\parallel x_1,\\dots,x_n\\parallel=1/(x_1+1/(x_2+\\cdots))<\/span>。<\/p>\n<p><strong>最坏情形（定理 F，PDF 第 277 页）<\/strong>：恰好 <span class=\"katex-inline\">n<\/span> 步除法、且 <span class=\"katex-inline\">u<\/span> 是满足条件的最小整数时，<span class=\"katex-inline\">u=F_{n+2}<\/span>，<span class=\"katex-inline\">v=F_{n+1}<\/span>，即连续两个斐波那契数。<\/p>\n<p><strong>步数上界（推论 L）<\/strong>：<span class=\"katex-inline\">0\\le v&lt;N<\/span> 时，除法步骤数最多 <span class=\"katex-inline\">\\lceil\\log_\\phi((3-\\phi)N)\\rceil<\/span>，<span class=\"katex-inline\">\\phi<\/span> 为黄金分割比。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">\\gcd(29,8)<\/span>：<span class=\"katex-inline\">29=3\\cdot8+5<\/span>，<span class=\"katex-inline\">8=1\\cdot5+3<\/span>，<span class=\"katex-inline\">5=1\\cdot3+2<\/span>，<span class=\"katex-inline\">3=1\\cdot2+1<\/span>，<span class=\"katex-inline\">2=2\\cdot1+0<\/span>，答案 1。<\/p>\n<p><strong>反例<\/strong>：从 2 逐个试除到较小数，小整数可行，大整数时代价线性膨胀；这不是辗转相除路线。<\/p>\n<h2>原理推导：辗转相除为什么终止且正确<\/h2>\n<p>依据恒等式 <span class=\"katex-inline\">\\gcd(u,v)=\\gcd(v,u\\bmod v)<\/span>：<span class=\"katex-inline\">u<\/span> 与 <span class=\"katex-inline\">v<\/span> 的公因数同时整除 <span class=\"katex-inline\">u-qv=r<\/span>；反之 <span class=\"katex-inline\">v<\/span> 与 <span class=\"katex-inline\">r<\/span> 的公因数也整除 <span class=\"katex-inline\">u=qv+r<\/span>。公因数集合相同，最大公因数不变。每步余数严格小于除数，非负余数必然下降，有限步内到 0；最后非零余数即最大公因数。<\/p>\n<p>连分数方向：每步商 <span class=\"katex-inline\">q_i<\/span> 成为连分数一个系数；商全为 1 时余数递减最慢，对应斐波那契递推 <span class=\"katex-inline\">F_{n+2}=F_{n+1}+F_n<\/span>。定理 F 证明方向：若某步商大于 1，余数下降更快，同一步数可取更小的数；最小最坏输入只能是商全 1 的斐波那契相邻项。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：非负整数；多精度整数同样适用，取余按 c09 竖式实现。\n<\/li><li>\n失败案例 1：试除法代替辗转相除，大整数步数失控。\n<\/li><li>\n失败案例 2：分数不约分直接运算，分子分母只涨不落，中间结果溢出单精度。\n<\/li><li>\n失败案例 3：把欧几里得算法步数当成线性于数值；实际随位数对数增长，斐波那契相邻项是最慢情形。\n<\/li><li>\n边界：算法分析基于标准取余步骤；带符号数先取绝对值。\n<\/ul>\n<p><strong>与分数算术的衔接<\/strong>：分数 <span class=\"katex-inline\">(u/u&#x27;)<\/span> 要求 <span class=\"katex-inline\">u,u&#x27;<\/span> 互素且 <span class=\"katex-inline\">u&#x27;&gt;0<\/span>。乘法交叉相乘后求一次 gcd 约分；加减通分后分子相加，再除以分子分母的 gcd 化既约。若不约分，同一有理数出现多种写法，相等判断要交叉相乘，中间分子分母只涨不落，单精度很快溢出。gcd 算法的步数对数于位数，使多精度分数运算在大整数上仍可承受；这也是 §4.5.1 把公因数算法放在分数运算之后讲解的原因。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>公因数 vs 公因子分解<\/strong>：辗转相除直接求 gcd，不必先把两数拆成素因子；素因数分解（§4.5.4）是另一类更慢的问题。\n<\/li><li>\n<strong>最坏情形 vs 平均情形<\/strong>：定理 F 给最慢输入；平均步数另由连续模型分析，量级低于最坏上界。\n<\/li><li>\n<strong>gcd vs 互素<\/strong>：<span class=\"katex-inline\">\\gcd=1<\/span> 即互素；互素是 gcd 判定的一个结果。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c09 多精度取余与竖式减法。后继：c12 多项式最大公因数与多项式除法同构；c03 零增量序列的阶、c04 检验中的互素判断都调用 gcd。欧几里得算法是分数算术与数论运算的枢纽。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（最大公因数与欧几里得算法：连分数、最坏情形与斐波那契数）<\/summary><div class=\"depth-body\"><h1>c11 深度推导：辗转相除正确性、连分数对应与斐波那契最坏情形<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>最大公因数往回追四层：<\/p>\n<ol><li>\n<strong>取余运算<\/strong>：<span class=\"katex-inline\">u=qv+r<\/span>，余数 <span class=\"katex-inline\">0\\le r&lt;v<\/span>（c09 多精度取余）。\n<\/li><li>\n<strong>公因数不变量<\/strong>：<span class=\"katex-inline\">\\gcd(u,v)=\\gcd(v,r)<\/span>。\n<\/li><li>\n<strong>余数下降<\/strong>：每步余数严格减小，有限步终止于 0。\n<\/li><li>\n<strong>连分数对应<\/strong>：商序列对应连分数系数，全 1 系数即斐波那契递推。\n<\/ol>\n<p>依赖链方向：取余 → 公因数集合不变 → 余数递减终止 → 连分数系数 → 最坏情形定位。<\/p>\n<h2>正向推导：辗转相除为什么正确<\/h2>\n<p>恒等式：<span class=\"katex-inline\">\\gcd(u,v)=\\gcd(v,u\\bmod v)<\/span>。<\/p>\n<ol><li>\n若 <span class=\"katex-inline\">d<\/span> 整除 <span class=\"katex-inline\">u<\/span> 与 <span class=\"katex-inline\">v<\/span>，则 <span class=\"katex-inline\">d<\/span> 整除 <span class=\"katex-inline\">u-qv=r<\/span>，所以 <span class=\"katex-inline\">d<\/span> 也是 <span class=\"katex-inline\">v,r<\/span> 的公因数。\n<\/li><li>\n反之，<span class=\"katex-inline\">d<\/span> 整除 <span class=\"katex-inline\">v<\/span> 与 <span class=\"katex-inline\">r<\/span>，则 <span class=\"katex-inline\">d<\/span> 整除 <span class=\"katex-inline\">qv+r=u<\/span>，也是 <span class=\"katex-inline\">u,v<\/span> 的公因数。\n<\/li><li>\n两边公因数集合相同，最大公因数不变。\n<\/ol>\n<p>每步把数对 <span class=\"katex-inline\">(u,v)<\/span> 换成 <span class=\"katex-inline\">(v,r)<\/span>，余数 <span class=\"katex-inline\">r&lt;v<\/span> 严格下降；非负余数有限，必然到余数 0，最后非零余数即 gcd。<\/p>\n<h2>数值算例一：<span class=\"katex-inline\">\\gcd(29,8)<\/span><\/h2>\n<ol><li>\n<span class=\"katex-inline\">29=3\\cdot8+5<\/span>，余 5。\n<\/li><li>\n<span class=\"katex-inline\">8=1\\cdot5+3<\/span>，余 3。\n<\/li><li>\n<span class=\"katex-inline\">5=1\\cdot3+2<\/span>，余 2。\n<\/li><li>\n<span class=\"katex-inline\">3=1\\cdot2+1<\/span>，余 1。\n<\/li><li>\n<span class=\"katex-inline\">2=2\\cdot1+0<\/span>，余 0。\n<\/ol>\n<p>最后非零余数 1，<span class=\"katex-inline\">\\gcd(29,8)=1<\/span>，五步除法。<\/p>\n<h2>数值算例二：斐波那契相邻项<\/h2>\n<p><span class=\"katex-inline\">u=8<\/span>，<span class=\"katex-inline\">v=5<\/span>（<span class=\"katex-inline\">F_6=8<\/span>，<span class=\"katex-inline\">F_5=5<\/span>）：<\/p>\n<ol><li>\n<span class=\"katex-inline\">8=1\\cdot5+3<\/span>，余 3。\n<\/li><li>\n<span class=\"katex-inline\">5=1\\cdot3+2<\/span>，余 2。\n<\/li><li>\n<span class=\"katex-inline\">3=1\\cdot2+1<\/span>，余 1。\n<\/li><li>\n<span class=\"katex-inline\">2=2\\cdot1+0<\/span>，余 0。\n<\/ol>\n<p>四步除法，商序列前三个都是 1。对照定理 F：恰好 <span class=\"katex-inline\">n=4<\/span> 步、且 <span class=\"katex-inline\">u<\/span> 是满足条件的最小整数时，<span class=\"katex-inline\">u=F_{n+2}=F_6=8<\/span>，<span class=\"katex-inline\">v=F_{n+1}=F_5=5<\/span>。<\/p>\n<h2>正向推演：最坏情形为什么是斐波那契数<\/h2>\n<p>连分数系数就是每步商。商全为 1 时余数递减最慢：每步只减去一倍，余数序列按 <span class=\"katex-inline\">F_{k+2}=F_{k+1}+F_k<\/span> 递推。若某步商大于 1，余数下降更快，同一步数可取更小的数。因此满足&quot;步数 <span class=\"katex-inline\">n<\/span>、输入最小&quot;的最坏输入只能是商全 1 的斐波那契相邻项。定理 F 给出这一结论；推论 L 给步数上界：<span class=\"katex-inline\">0\\le v&lt;N<\/span> 时，步骤数最多 <span class=\"katex-inline\">\\lceil\\log_\\phi((3-\\phi)N)\\rceil<\/span>，<span class=\"katex-inline\">\\phi<\/span> 为黄金分割比，步数随位数对数增长。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>试除法代替辗转相除<\/strong>：从 2 逐个试除到较小数，步数随数值线性增长；大整数与多精度时代价失控。<\/p>\n<p><strong>不约分<\/strong>：分数分子分母只涨不落，同一有理数多种写法，单精度溢出；gcd 约分环节不可省。<\/p>\n<p><strong>把步数当线性于数值<\/strong>：实际最坏情形对数于位数，斐波那契相邻项是最慢输入，不是平均输入。<\/p>\n<h2>延伸推演：与分数算术衔接<\/h2>\n<p>分数 <span class=\"katex-inline\">(u/u&#x27;)<\/span> 要求互素且 <span class=\"katex-inline\">u&#x27;&gt;0<\/span>。乘法交叉相乘后求一次 gcd 约分；加减通分后再除 gcd 化既约。gcd 步数对数于位数，使多精度分数运算在大整数上可承受。素因数分解（§4.5.4）是另一类更慢的问题，不能用辗转相除替代。<\/p>\n<h2>延伸一层：连分数记号与商序列<\/h2>\n<p>书 §4.5.3 记 <span class=\"katex-inline\">\\parallel x_1,\\dots,x_n\\parallel=1/(x_1+1/(x_2+\\cdots))<\/span>。辗转相除每步商 <span class=\"katex-inline\">q_i<\/span> 就是连分数一个系数；余数比 <span class=\"katex-inline\">u/v<\/span> 对应连分数的逐层展开。商全为 1 时连分数系数全 1，分子分母由斐波那契递推生成；商大于 1 时系数出现大项，余数下降加快。连分数把算法步数与数值结构直接挂钩。<\/p>\n<h2>数值算例三：<span class=\"katex-inline\">\\gcd(8,5)<\/span> 的连分数对应<\/h2>\n<p><span class=\"katex-inline\">8/5=1+3/5<\/span>，<span class=\"katex-inline\">5/3=1+2/3<\/span>，<span class=\"katex-inline\">3/2=1+1/2<\/span>，商序列 <span class=\"katex-inline\">1,1,1,2<\/span>。前三个商为 1，对应斐波那契相邻项；最后一步商 2 结束。五步内的最慢输入正是商全 1 的序列，这与定理 F 的方向一致：商 1 越多，余数递减越慢，步数越长。<\/p>\n<h2>延伸推演：步数上界的对数方向<\/h2>\n<p>推论 L：<span class=\"katex-inline\">0\\le v&lt;N<\/span> 时步骤数最多 <span class=\"katex-inline\">\\lceil\\log_\\phi((3-\\phi)N)\\rceil<\/span>。<span class=\"katex-inline\">\\phi<\/span> 为黄金分割比，上界随 <span class=\"katex-inline\">N<\/span> 对数增长；这说明辗转相除不是线性于数值大小，大整数上步数依然可控。平均步数另由连续模型分析，量级低于最坏上界；最坏情形由斐波那契相邻项给出，不是随机输入的典型表现。<\/p>\n<h2>对照辨析：gcd 与素因数分解<\/h2>\n<p>辗转相除直接求公因数，不必先拆素因子；素因数分解把整数拆成素数乘积，难度更高。两个问题常被混为一谈：gcd 走取余迭代，分解走试除或筛法；用 gcd 结果反推因子分解只在互素情形有空余信息。c12 多项式最大公因数与本节整数 gcd 同构，同样先求公因子再谈分解。<\/p>\n<h2>失败案例补充：余数符号与终止条件<\/h2>\n<p>余数必须取非负值；带余除法 <span class=\"katex-inline\">u=qv+r<\/span> 要求 <span class=\"katex-inline\">0\\le r&lt;v<\/span>。若余数算成负数未回正，下一步数对代入错乱，终止条件（余数为 0）迟迟达不到。多精度实现里余数与除数的大小比较、符号判断单独走 c09 竖式规则。<\/p>\n<h2>再推一层：分数算术里的 gcd 位置<\/h2>\n<p>分数 <span class=\"katex-inline\">(u/u&#x27;)<\/span> 既约要求分子分母互素：乘法交叉相乘后求 gcd 约分，加减通分后再除 gcd。不约分则同一有理数多种写法，中间分子分母膨胀溢出。gcd 步数对数于位数，使多精度分数运算可承受；这是 §4.5.1 分数运算把公因数算法放在其后讲解的原因。<\/p>\n<h2>补充推演：算法终止与余数下降<\/h2>\n<p>每步 <span class=\"katex-inline\">u=qv+r<\/span>，<span class=\"katex-inline\">0\\le r&lt;v<\/span>，余数严格小于除数；数对 <span class=\"katex-inline\">(u,v)\\mapsto(v,r)<\/span> 中第二个分量严格下降。非负整数不能无限下降，有限步内余数为 0。终止性不依赖输入大小，只依赖余数严格递减；最后非零余数即 gcd。若余数算成负值未回正，下降链条断裂，终止条件失效。<\/p>\n<h2>补充算例：互素与非互素对照<\/h2>\n<p><span class=\"katex-inline\">\\gcd(29,8)=1<\/span> 互素；<span class=\"katex-inline\">\\gcd(29,28)=1<\/span> 相邻整数互素；<span class=\"katex-inline\">\\gcd(12,18)=6<\/span>：<span class=\"katex-inline\">18=1\\cdot12+6<\/span>，<span class=\"katex-inline\">12=2\\cdot6+0<\/span>，最后非零余数 6。非互素情形 gcd 大于 1，约分除以 6 即可。两条路线取余规则相同，差别只在最后余数大小。<\/p>\n<h2>补充辨析：最坏情形与平均情形<\/h2>\n<p>定理 F 给最慢输入（斐波那契相邻项），推论 L 给最坏上界；平均步数由连续模型另析，量级低于最坏。随机输入大多不是斐波那契相邻项，实际步数更接近平均估计；上界是保险线，不是典型表现。<\/p>\n<h2>失败案例补充：带符号输入未取绝对值<\/h2>\n<p>负数直接进入取余，余数符号随语言实现；先取绝对值再辗转相除，符号最后合并。多精度余数比较、符号判断走 c09 竖式规则，gcd 主体对非负整数推进。<\/p>\n<h2>补充一层：gcd 在数论与算术章节的接口<\/h2>\n<p>模逆元、既约分数、多项式公因式都调用 gcd；c03 零增量序列的互素判断、c04 检验中的公因数核对同属 gcd 应用。辗转相除是连接分数算术、模运算与多项式公因子的枢纽算法。<\/p>\n<h2>补充推演：gcd 与模逆元的联系<\/h2>\n<p>若 <span class=\"katex-inline\">a<\/span> 与 <span class=\"katex-inline\">m<\/span> 互素，扩展辗转相除可求出 <span class=\"katex-inline\">ax+my=1<\/span>，<span class=\"katex-inline\">x<\/span> 即 <span class=\"katex-inline\">a<\/span> 模 <span class=\"katex-inline\">m<\/span> 的逆元。标准 gcd 只留最后非零余数，扩展版保留每步系数；两者取余流程相同。模逆元是 c03 零增量阶、模算术运算的基础工具，由 gcd 算法延伸得到。<\/p>\n<h2>补充算例：相邻整数互素<\/h2>\n<p><span class=\"katex-inline\">\\gcd(n,n+1)=1<\/span>：<span class=\"katex-inline\">n+1=1\\cdot n+1<\/span>，<span class=\"katex-inline\">n=n\\cdot1+0<\/span>，最后余数 1。相邻整数无公共因子，这是整数互素的常见情形；辗转相除一步即见分晓。<\/p>\n<h2>补充辨析：gcd 算法与分解算法<\/h2>\n<p>gcd 迭代取余求公因子，分解拆素因子；前者快且对数步数，后者难度高。不能用 gcd 结果替代素因子分解，多项式公因式（c12）与整数 gcd 同构。<\/p>\n<h2>补充一层：辗转相除在多精度上的落地<\/h2>\n<p>取余按 c09 多精度除法实现，余数非负且小于除式；步数对数于位数，大整数 gcd 仍可控。扩展版求模逆元保留每步系数，标准版只留最后余数。分数约分、多项式公因式都调用这一底层取余迭代。<\/p>\n<h2>补充一层：gcd 结果的使用边界<\/h2>\n<p>gcd 用于约分、互素判断、模逆元求解；不直接给出素因子分解。分数约分除以 gcd 后既约，多项式公因式按同一规则处理。把 gcd 当分解算法使用，是问题对象选错。<\/p>\n<h2>补充一层：步数上界的工程意义<\/h2>\n<p>最坏上界对数于位数，说明大整数辗转相除不会拖成线性长链；平均步数低于上界。工程上按上界留迭代预算，按平均估实际耗时，两者分开记。<\/p>\n<h2>补充一层：辗转相除的输入规范化<\/h2>\n<p>带符号输入先取绝对值；余数保持非负；最后非零余数即 gcd，符号单独合并。输入不规范化，取余链条在符号与大小比较上出错，终止条件失效。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n证明 <span class=\"katex-inline\">\\gcd(u,v)=\\gcd(v,u\\bmod v)<\/span>，双向说清公因数集合。\n<\/li><li>\n手算 <span class=\"katex-inline\">\\gcd(29,8)<\/span>，标出每步余数。\n<\/li><li>\n定理 F 中 <span class=\"katex-inline\">n<\/span> 步最坏输入对应哪两个斐波那契数？\n<\/li><li>\n商全为 1 为什么是最慢情形？\n<\/li><li>\n辗转相除与素因数分解为什么不能互相替代？\n<\/ol><\/div><\/details>", "c12": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 卷2 半数值算法.pdf · p.335<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">多精度经典算术：进位借位、竖式乘法与除法<\/a><\/span><\/div><h1>多项式算术：除法、因子分解、快速幂与多项式求值<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch04（原书 §4.6，PDF 第 335 页起）\n<\/ul>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>把运算对象从整数推广到系数串，就得到多项式：加减是同次幂系数合并，乘法是卷积展开。困难在于：多项式除法求商余、因子分解拆不可约因子、幂计算求 <span class=\"katex-inline\">u(x)^n<\/span>、求值算给定 <span class=\"katex-inline\">x<\/span> 处的 <span class=\"katex-inline\">u(x)<\/span>，各自输入输出不同，代价结构也不同。§4.6 把这些操作分门别类，与多精度算术对照：系数串对应数位串，卷积对应部分积累加，但系数所在代数系统不一定有除法逆元。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>多项式<\/strong>（书 §4.6 式 (1)，PDF 第 335 页）：<span class=\"katex-inline\">u(x)=u_nx^n+\\cdots+u_1x+u_0<\/span>，系数取自代数系统 <span class=\"katex-inline\">S<\/span>；<span class=\"katex-inline\">u_n\\ne0<\/span> 时 <span class=\"katex-inline\">\\deg(u)=n<\/span>，首项系数 <span class=\"katex-inline\">\\ell(u)=u_n<\/span>。零多项式约定 <span class=\"katex-inline\">\\deg(0)=-\\infty<\/span>，<span class=\"katex-inline\">\\ell(0)=0<\/span>。<\/p>\n<p><strong>加减<\/strong>：同次幂系数相加减。<\/p>\n<p><strong>乘法卷积<\/strong>：<span class=\"katex-inline\">w_k=\\sum_{i+j=k}u_i v_j<\/span>，<span class=\"katex-inline\">i&gt;r<\/span> 或 <span class=\"katex-inline\">j&gt;s<\/span> 时相应系数取零。<\/p>\n<p><strong>多项式除法<\/strong>：给出商式与余式；余式次数低于除式。<\/p>\n<p><strong>因子分解<\/strong>：把多项式拆成不可约因子的乘积。<\/p>\n<p><strong>幂的计算<\/strong>：求 <span class=\"katex-inline\">u(x)^n<\/span>；快速平方路线按指数二进制分解，逐次平方乘入。<\/p>\n<p><strong>求值<\/strong>：给定 <span class=\"katex-inline\">x<\/span>，计算 <span class=\"katex-inline\">u(x)<\/span>；霍纳方向把系数串嵌套合并，减少乘法次数。<\/p>\n<p><strong>正例<\/strong>：两个一次多项式相乘得二次多项式，卷积系数逐项对应；<span class=\"katex-inline\">x^2-1=(x-1)(x+1)<\/span> 是简单分解。<\/p>\n<p><strong>反例<\/strong>：系数取自模 <span class=\"katex-inline\">m<\/span> 系统时直接套整数除法规则，忽略系数环可能无逆元；多项式除式首项系数不可逆时商式无法按同一方式确定。<\/p>\n<h2>原理推导：除法的商余结构<\/h2>\n<p>被除式次数 <span class=\"katex-inline\">n<\/span>、除式次数 <span class=\"katex-inline\">m<\/span>（<span class=\"katex-inline\">n\\ge m<\/span>）：首项系数相除定商的最高次项，乘除式后从被除式减去，余式次数下降；重复到余式次数低于 <span class=\"katex-inline\">m<\/span>。每步不变量：当前余式等于原被除式减去已得商乘除式。快速幂：<span class=\"katex-inline\">n<\/span> 写成二进制，遇 1 把当前底乘入结果，底逐次平方；乘法次数随指数位数对数增长，优于逐个连乘。求值：霍纳格式 <span class=\"katex-inline\">u(x)=(\\cdots(u_nx+u_{n-1})x+\\cdots+u_0)<\/span>，<span class=\"katex-inline\">n<\/span> 次乘法完成 <span class=\"katex-inline\">n<\/span> 次多项式求值。<\/p>\n<h2>适用条件与边界 + 失败案例<\/h2>\n<ul><li>\n适用条件：系数系统的加法、乘法与所需逆元明确；除式首项系数在该系统中可逆。\n<\/li><li>\n失败案例 1：忽略系数环差异，把整数除法逆元规则套到模系数多项式上。\n<\/li><li>\n失败案例 2：幂计算逐个连乘，指数大时乘法次数线性膨胀；快速平方未被采用。\n<\/li><li>\n失败案例 3：求值按展开式逐项算幂，重复计算 <span class=\"katex-inline\">x<\/span> 的各次幂；霍纳嵌套更省乘法。\n<\/li><li>\n边界：因子分解的难度依赖系数域；有理数域、实数域、模 <span class=\"katex-inline\">p<\/span> 系统上不可约判定不同。幂级数方向（§4.7）把多项式操作推广到无穷项展开，求和与求逆规则另有限定。\n<\/ul>\n<p><strong>各操作的代价方向<\/strong>：多项式加减是线性合并系数；乘法卷积有 <span class=\"katex-inline\">(n+1)^2<\/span> 个乘积项，可借 c10 的分治思路降低阶；除法每步定一个商位，余式次数递减；幂计算用快速平方把乘法次数压到指数位数的对数量级；求值用霍纳嵌套把 <span class=\"katex-inline\">n<\/span> 次多项式压到 <span class=\"katex-inline\">n<\/span> 次乘法。系数取自整数、实数或模 <span class=\"katex-inline\">m<\/span> 系统时，加法乘法规则相同，除法逆元的存在性不同：模系数环里只有首项系数与模数互素才可逆，这是多项式除法与整数除法最容易混淆的地方。§4.6.2 的因子分解依赖系数域上的不可约判定，比带余除法更难，不能用同一套步骤硬套。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>多项式 vs 多精度整数<\/strong>：系数串与数位串同构，卷积与部分积相通；差别是多项式没有&quot;进位&quot;，相邻系数间不向前溢出。\n<\/li><li>\n<strong>除法 vs 因子分解<\/strong>：除法求商余，分解求不可约因子；前者是带余除法，后者是因式结构拆解。\n<\/li><li>\n<strong>快速幂 vs 逐个连乘<\/strong>：前者按二进制对数次乘法，后者线性次；对象可以是多项式也可以是整数。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c09 多精度竖式与卷积、c11 辗转相除与最大公因数。后继：§4.7 把多项式操作推广到幂级数；c10 快速乘法思路可迁移到多项式卷积。多项式算术是整数运算在系数对象上的自然延伸。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（多项式算术：除法、因子分解、快速幂与多项式求值）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：多项式除法商余、快速幂与霍纳求值的推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>多项式算术往回追四层：<\/p>\n<ol><li>\n<strong>系数串<\/strong>：多项式按幂次排列系数，对应数位串（c07、c09）。\n<\/li><li>\n<strong>加减卷积<\/strong>：同次幂合并，乘法按 <span class=\"katex-inline\">w_k=\\sum_{i+j=k}u_iv_j<\/span> 展开。\n<\/li><li>\n<strong>带余除法<\/strong>：首项定商位，乘减降次，余式次数低于除式。\n<\/li><li>\n<strong>幂与求值<\/strong>：快速平方压乘法次数，霍纳嵌套减少求值乘法。\n<\/ol>\n<p>依赖链方向：系数串 → 加减卷积 → 商余除法 → 快速幂与求值。<\/p>\n<h2>正向推导：多项式除法商余<\/h2>\n<p>被除式次数 <span class=\"katex-inline\">n<\/span>、除式次数 <span class=\"katex-inline\">m<\/span>（<span class=\"katex-inline\">n\\ge m<\/span>）。<\/p>\n<ol><li>\n首项系数相除，定商的最高次项。\n<\/li><li>\n商位乘除式，从被除式减去。\n<\/li><li>\n余式次数下降，重复到余式次数低于 <span class=\"katex-inline\">m<\/span>。\n<\/ol>\n<p>不变量：当前余式等于原被除式减去已得商乘除式。除式首项系数必须在系数系统中可逆，商位才能确定。<\/p>\n<h2>数值算例一：<span class=\"katex-inline\">(x^2-3x+2)\\div(x-1)<\/span><\/h2>\n<p>首项 <span class=\"katex-inline\">x^2/x=x<\/span>，商位 <span class=\"katex-inline\">x<\/span>；<span class=\"katex-inline\">x(x-1)=x^2-x<\/span>，减去得 <span class=\"katex-inline\">-2x+2<\/span>。再首项 <span class=\"katex-inline\">-2x/x=-2<\/span>，商位 <span class=\"katex-inline\">-2<\/span>；<span class=\"katex-inline\">-2(x-1)=-2x+2<\/span>，减去余 0。商式 <span class=\"katex-inline\">x-2<\/span>，余式 0；<span class=\"katex-inline\">x^2-3x+2=(x-1)(x-2)<\/span>。<\/p>\n<h2>正向推演：快速幂<\/h2>\n<p>求 <span class=\"katex-inline\">u(x)^n<\/span>。指数 <span class=\"katex-inline\">n<\/span> 写二进制，逐位扫描：底逐次平方；遇二进制位 1，把当前底乘入结果。乘法次数随指数位数对数增长，优于逐个连乘。<\/p>\n<p><strong>算例：<span class=\"katex-inline\">x^{10}<\/span><\/strong>。<span class=\"katex-inline\">10<\/span> 二进制 <span class=\"katex-inline\">1010<\/span>。初始结果 1，底 <span class=\"katex-inline\">x<\/span>：位 0 跳过，底平方 <span class=\"katex-inline\">x^2<\/span>；位 1 为 1，结果 <span class=\"katex-inline\">x^2<\/span>；底平方 <span class=\"katex-inline\">x^4<\/span>；位 0 跳过；底平方 <span class=\"katex-inline\">x^8<\/span>；位 1 为 1，结果 <span class=\"katex-inline\">x^2\\cdot x^8=x^{10}<\/span>。四次平方加一次乘入，少于十次连乘。<\/p>\n<h2>正向推演：霍纳求值<\/h2>\n<p><span class=\"katex-inline\">u(x)=u_nx^n+\\cdots+u_1x+u_0<\/span> 改写成<\/p>\n<div class=\"katex-block\">u(x)=(\\cdots((u_nx+u_{n-1})x+u_{n-2})x+\\cdots+u_0)<\/div>\n<p><span class=\"katex-inline\">n<\/span> 次乘法完成 <span class=\"katex-inline\">n<\/span> 次多项式求值，不必逐项算 <span class=\"katex-inline\">x<\/span> 的各次幂。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>套整数除法逆元<\/strong>：模系数环里首项系数不与模数互素时不可逆，商式无法按同一方式确定；系数系统先查清逆元存在性。<\/p>\n<p><strong>幂计算逐个连乘<\/strong>：指数大时乘法次数线性膨胀，快速平方未被采用。<\/p>\n<p><strong>求值按展开式硬算<\/strong>：重复计算 <span class=\"katex-inline\">x<\/span> 的各次幂，乘法次数高于霍纳嵌套。<\/p>\n<p><strong>因子分解硬套带余除法<\/strong>：分解求不可约因子，依赖系数域上的不可约判定，与商余除法不是同一套步骤。<\/p>\n<h2>延伸推演：与多精度乘法对照<\/h2>\n<p>多项式卷积的 <span class=\"katex-inline\">(n+1)^2<\/span> 个乘积项与大整数竖式乘法同构，分治思路（c10）可迁移；差别是多项式相邻系数间不进位。§4.7 把这些操作推广到幂级数，求和与求逆规则另有限定。<\/p>\n<h2>延伸一层：卷积公式的逐项核对<\/h2>\n<p>乘法 <span class=\"katex-inline\">u(x)v(x)<\/span>，系数 <span class=\"katex-inline\">w_k=\\sum_{i+j=k}u_iv_j<\/span>。<span class=\"katex-inline\">i&gt;r<\/span> 或 <span class=\"katex-inline\">j&gt;s<\/span> 时相应系数取零；<span class=\"katex-inline\">k<\/span> 从 0 到 <span class=\"katex-inline\">r+s<\/span>。每个 <span class=\"katex-inline\">u_i<\/span> 乘 <span class=\"katex-inline\">v_j<\/span> 贡献到 <span class=\"katex-inline\">w_{i+j}<\/span>，与整数部分积按位错开累加同构。差别：多项式相邻系数间不向前进位，整数数位满 <span class=\"katex-inline\">b<\/span> 则进位；其余卷积结构一致。<\/p>\n<h2>数值算例二：两个一次多项式相乘<\/h2>\n<p><span class=\"katex-inline\">(x+1)(x+2)=x^2+3x+2<\/span>。卷积：<span class=\"katex-inline\">w_0=1\\cdot2=2<\/span>，<span class=\"katex-inline\">w_1=1\\cdot2+1\\cdot1=3<\/span>，<span class=\"katex-inline\">w_2=1\\cdot1=1<\/span>。对照整数 <span class=\"katex-inline\">11\\times12=132<\/span>，数位卷积同形但不进位；若系数出现大于基数的值，多项式不折进位，整数则进位归一。<\/p>\n<h2>延伸推演：快速幂的二进制扫描<\/h2>\n<p>指数 <span class=\"katex-inline\">n<\/span> 写成二进制，从高位到低位扫描：底逐次平方，遇位 1 把底乘入结果。乘法次数 = 位数次平方 + 1 的个数次乘入，对数于指数位数。逐个连乘要 <span class=\"katex-inline\">n-1<\/span> 次乘法；指数越大，快速平方优势越明显。对象可以是多项式，也可以是整数，规则相同。<\/p>\n<h2>对照辨析：多项式除法与整数带余除法<\/h2>\n<p>两者都是首项定商位、乘减降次；差别在系数逆元：整数除式天然有逆，多项式系数环里首项系数必须可逆。模 <span class=\"katex-inline\">p<\/span> 系数系统中，首项系数与 <span class=\"katex-inline\">p<\/span> 互素才可逆，否则商式无法按同一方式确定。套用整数除法规则前，先确认系数环的逆元存在性。<\/p>\n<h2>失败案例补充：因子分解与带余除法混用<\/h2>\n<p>带余除法求商余，分解求不可约因子；后者依赖系数域上的不可约判定，不是除法的重复执行。把除不尽当成分解失败，或用试除替代不可约判定，都是步骤错位。幂级数方向（§4.7）另有无穷项求和求逆规则，不能套多项式有限除法。<\/p>\n<h2>再推一层：与多精度算术的结构对照<\/h2>\n<p>多项式系数串对应数位串，卷积对应部分积累加；c10 分治减少乘法次数的思路可迁移到多项式乘积。没有进位是多项式与整数运算的核心差别。求值霍纳嵌套、快速幂平方路线，都是把重复乘法压到对数或线性最少次数，与 c09 竖式、c10 分治同属代价优化链条。<\/p>\n<h2>补充推演：多项式次数与首项系数<\/h2>\n<p><span class=\"katex-inline\">\\deg(u)=n<\/span> 要求 <span class=\"katex-inline\">u_n\\ne0<\/span>；零多项式约定 <span class=\"katex-inline\">\\deg(0)=-\\infty<\/span>。除法中商的次数等于被除式次数减除式次数；余式次数低于除式。首项系数 <span class=\"katex-inline\">\\ell(u)=u_n<\/span> 决定除法商位的第一步系数，系数环中它必须可逆。次数边界与整数数位边界对应：余式次数压到除式以下，余数小于除式。<\/p>\n<h2>补充算例：霍纳求值手算<\/h2>\n<p><span class=\"katex-inline\">u(x)=2x^3+3x^2+x+5<\/span>，代入 <span class=\"katex-inline\">x=2<\/span>：<span class=\"katex-inline\">((2\\cdot2+3)\\cdot2+1)\\cdot2+5=((7)\\cdot2+1)\\cdot2+5=15\\cdot2+5=35<\/span>。核验展开：<span class=\"katex-inline\">16+12+2+5=35<\/span>。三次乘法完成三次多项式求值，不必先算 <span class=\"katex-inline\">x^2,x^3<\/span>。<\/p>\n<h2>补充辨析：多项式乘法与整数乘法<\/h2>\n<p>卷积结构相同，差别在进位：整数数位满 <span class=\"katex-inline\">b<\/span> 进位，多项式系数间不进位。模 <span class=\"katex-inline\">m<\/span> 多项式算术里系数按模 <span class=\"katex-inline\">m<\/span> 运算，同样不产生数位进位。把整数进位规则套到多项式，系数会被错误折位。<\/p>\n<h2>失败案例补充：系数逆元缺失仍定商位<\/h2>\n<p>模系数环中首项系数与模数不互素时不可逆，商位无法确定；硬除会得到错误商式。先查系数环逆元存在性，再决定除法路线。因子分解依赖不可约判定，不能用带余除法反复执行替代。<\/p>\n<h2>补充一层：多项式操作与多精度、快速幂的链条<\/h2>\n<p>卷积复用 c09 部分积结构，分治减乘迁移自 c10；快速幂与霍纳都是减少重复乘法的路线。§4.7 幂级数把有限多项式推广到无穷项，求和求逆规则另定。多项式算术是整数运算在系数对象上的延伸。<\/p>\n<h2>补充推演：多项式加减乘的次数边界<\/h2>\n<p>加减结果次数不超过两多项式次数最大值；乘积次数为次数之和。卷积 <span class=\"katex-inline\">w_k<\/span> 覆盖 <span class=\"katex-inline\">k=0<\/span> 到 <span class=\"katex-inline\">r+s<\/span>。次数边界与整数位数边界对应：余式次数低于除式，余数小于除式。系数环不同，加减乘规则相同，除法逆元条件不同。<\/p>\n<h2>补充算例：快速幂的平方链<\/h2>\n<p><span class=\"katex-inline\">x^{10}=x^8\\cdot x^2<\/span>，指数 10 二进制 1010：四次平方（<span class=\"katex-inline\">x^2,x^4,x^8,x^{16}<\/span> 方向）加一次乘入。指数位数决定平方次数，1 的个数决定乘入次数；逐个连乘要九次乘法，指数越大差距越大。<\/p>\n<h2>补充辨析：多项式除法与整数除法<\/h2>\n<p>首项定商位、乘减降次流程相同；差别在系数逆元。模 <span class=\"katex-inline\">p<\/span> 系统首项系数与 <span class=\"katex-inline\">p<\/span> 互素才可逆，否则商式无法确定。因式分解是不可约因子拆解，不是除法重复执行。<\/p>\n<h2>失败案例补充：系数环逆元未查<\/h2>\n<p>直接套整数除法逆元规则到模系数多项式，商位出错；先确认首项系数在系数环可逆。幂级数无穷项求和求逆另立规则，不套用有限多项式除法。<\/p>\n<h2>补充一层：多项式操作的代价分层<\/h2>\n<p>加减线性合并系数；乘法卷积 <span class=\"katex-inline\">(n+1)^2<\/span> 项，可借分治降阶；除法逐位定商；快速幂对数次乘法；霍纳求值 <span class=\"katex-inline\">n<\/span> 次乘法。各操作代价结构不同，选型先分清求商余、分解、乘幂还是求值，再选对应算法，不把一种流程套到全部操作上。<\/p>\n<h2>补充一层：系数环的先查清单<\/h2>\n<p>做多项式除法前，先查首项系数在系数环是否可逆；模 <span class=\"katex-inline\">p<\/span> 系统中要求与 <span class=\"katex-inline\">p<\/span> 互素。加减乘不依赖逆元，除法依赖。因子分解另需不可约判定，与带余除法分属不同操作清单。<\/p>\n<h2>补充一层：多项式与整数乘法的对照清单<\/h2>\n<p>卷积公式相同，进位规则不同：整数满 <span class=\"katex-inline\">b<\/span> 进位，多项式系数间不折位。模 <span class=\"katex-inline\">m<\/span> 多项式系数按模运算，同样无数位进位。混淆两套规则会把系数错误折位，对照清单先确认对象是数位串还是系数串。<\/p>\n<h2>补充一层：多项式操作的选型顺序<\/h2>\n<p>先判目标：求商余走除法，求因子走分解，求幂走快速幂，代入求值走霍纳。四类操作输入输出与代价结构不同，混在一套流程里会选错算法。系数环逆元条件在除法前先查，分解的不可约判定另立标准。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出卷积系数 <span class=\"katex-inline\">w_k<\/span> 的公式。\n<\/li><li>\n手算 <span class=\"katex-inline\">(x^2-3x+2)\\div(x-1)<\/span> 的商与余式。\n<\/li><li>\n快速幂为什么乘法次数对数于指数位数？\n<\/li><li>\n霍纳格式把 <span class=\"katex-inline\">n<\/span> 次多项式压到几次乘法？\n<\/li><li>\n多项式除法在什么条件下商位无法确定？\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：均匀随机数的生成：线性同余法、周期与参数选择<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 3 章 3.1–3.2：均匀随机数的生成（引言、线性同余法与其他方法）<\/a><br>检查点：能写出递推式 $X_{n+1}=(aX_n+c)\\bmod m$，逐条列出定理 A 的三个全周期条件，手算一个小模数序列并指出周期长度，说明模与乘数选错会怎样缩短周期<\/li><li class='path-step' id='path-02'><strong>步骤 02：检验随机性：经验检验、谱检验与其他随机量<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 3 章 3.3–3.5：随机数的统计检验、其他随机量与随机序列<\/a><br>检查点：能解释卡方检验比较观测频数与期望频数的思路，说清谱检验把相邻随机数看成格点的视角，讲出从均匀偏差到指定分布、抽样与洗牌的基本路线<\/li><li class='path-step' id='path-03'><strong>步骤 03：算术基础：记数系统、浮点误差与多精度运算<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 4 章 4.1–4.4：记数系统、浮点算术、多精度算术与进制转换<\/a><br>检查点：能在两种进制间转换数的表示，写出浮点对数 $(e,f)$ 的形式与规范化条件，说明舍入累积误差的来源，走通多精度加减乘除的竖式进位流程，比较平方算法与分治乘法的复杂度<\/li><li class='path-step' id='path-04'><strong>步骤 04：有理数与多项式：最大公因数、欧几里得分析与多项式运算<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章 4.5–4.7：有理数算术、最大公因数、多项式算术与幂级数操作<\/a><br>检查点：能手算两数的辗转相除步骤，说出最坏情形对应连续斐波那契数及步数上界，区分多项式除法、因式分解、快速幂与求值各自的输入输出和适用对象<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='线性同余序列（linear congruential sequence）'>线性同余序列（linear congruential sequence） — 由递推 $X_{n+1}=(aX_n+c)\\bmod m$ 生成的整数序列；$m$ 为模，$a$ 为乘数，$c$ 为增量，$X_0$ 为初值，均匀偏差 $U_n=X_n/m$ 落在 0 与 1 之间 <span class=glossary-ref>（第 3 章 3.1–3.2：均匀随机数的生成（引言、线性同余法与其他方法））<\/span><\/li><li data-term='周期（period）'>周期（period） — 序列进入无休止重复之前循环所经历的项数；同余序列总会陷入循环，周期长度不超过模 $m$ <span class=glossary-ref>（第 3 章 3.1–3.2：均匀随机数的生成（引言、线性同余法与其他方法））<\/span><\/li><li data-term='全周期（full period）'>全周期（full period） — 周期长度等于模 $m$，一轮内遍历 $0,1,\\dots,m-1$ 全部值；定理 A 给出达到全周期的充要条件 <span class=glossary-ref>（第 3 章 3.1–3.2：均匀随机数的生成（引言、线性同余法与其他方法））<\/span><\/li><li data-term='势 / 阶（order）'>势 / 阶（order） — 零增量情形 $c=0$ 下，满足 $a^s\\equiv 1\\pmod m$ 的最小正整数 $s$；它决定乘法同余序列的周期长度 <span class=glossary-ref>（第 3 章 3.1–3.2：均匀随机数的生成（引言、线性同余法与其他方法））<\/span><\/li><li data-term='卡方检验（chi-square test）'>卡方检验（chi-square test） — 把观测频数与均匀分布下的期望频数对照，按 $(观测-期望)^2/期望$ 求和得到统计量，判断序列与均匀分布的偏离程度 <span class=glossary-ref>（第 3 章 3.3–3.5：随机数的统计检验、其他随机量与随机序列）<\/span><\/li><li data-term='谱检验（spectral test）'>谱检验（spectral test） — 针对线性同余发生器的理论检验：把相邻若干项看成高维格中的点，考察格的间距与覆盖，格越密越均匀；它同时利用全周期性质与计算机计算 <span class=glossary-ref>（第 3 章 3.3–3.5：随机数的统计检验、其他随机量与随机序列）<\/span><\/li><li data-term='均匀偏差（uniform deviate）'>均匀偏差（uniform deviate） — 在 0 与 1 之间均匀分布的随机实数；其他分布的随机量通常由均匀偏差经变换得到 <span class=glossary-ref>（第 3 章 3.3–3.5：随机数的统计检验、其他随机量与随机序列）<\/span><\/li><li data-term='按位记数法（positional number system）'>按位记数法（positional number system） — 以 $b$ 为基数，数写成 $(\\dots a_2a_1a_0.a_{-1}\\dots)_b=\\sum a_kb^k$，每位数字满足 $0\\le a_k&lt;b$ <span class=glossary-ref>（第 4 章 4.1–4.4：记数系统、浮点算术、多精度算术与进制转换）<\/span><\/li><li data-term='浮点数 $(e,f)$'>浮点数 $(e,f)$ — 用一对对数标记的数 $f\\times b^{e-q}$，$e$ 为指数部分，$f$ 为带符号小数部分；规范化要求 $f$ 的最高位不含有效零 <span class=glossary-ref>（第 4 章 4.1–4.4：记数系统、浮点算术、多精度算术与进制转换）<\/span><\/li><li data-term='多精度算术（multiple-precision arithmetic）'>多精度算术（multiple-precision arithmetic） — 把超过单字长的数拆成 $b$ 进制数位串，按竖式规则实现加减乘除；运算代价随位数增长 <span class=glossary-ref>（第 4 章 4.1–4.4：记数系统、浮点算术、多精度算术与进制转换）<\/span><\/li><li data-term='欧几里得算法（euclidean algorithm）'>欧几里得算法（Euclidean algorithm） — 反复用 $u=qv+r$ 取余，把较大数换成余数，直到余数为 0，最后非零余数即最大公因数；其步数与连分数、斐波那契数相联系 <span class=glossary-ref>（第 4 章 4.5–4.7：有理数算术、最大公因数、多项式算术与幂级数操作）<\/span><\/li><li data-term='多项式（polynomial）'>多项式（polynomial） — 形如 $u(x)=u_nx^n+\\cdots+u_1x+u_0$ 的表达式，系数取自代数系统 $S$；多项式算术包括加减乘除、因子分解、幂计算与求值 <span class=glossary-ref>（第 4 章 4.5–4.7：有理数算术、最大公因数、多项式算术与幂级数操作）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：参数选择先分约束，再逐项核验<\/h2>\n<p>发生器参数分开看模、乘数、增量、初值各自的约束：模管周期天花板与取模速度，乘数管轨道形状，增量管平移，初值管入口。核验时先列素因子分解，再逐条对条件，不把四个参数搅在一起试算。周期条件过关后再进统计检验，门槛与验收分层。<\/p>\n<h2>模式 2：周期合格不等于随机，结构检验兜底<\/h2>\n<p>长周期只保证遍历不重复，不保证散布均匀。等差序列可以周期拉满却结构外露。验收路线：经验检验筛样本偏斜，谱检验查全周期格结构，两类互补；通过多项检验只是提高把握，不出具随机证明。<\/p>\n<h2>模式 3：分段映射先守恒概率，再核对边界<\/h2>\n<p>离散分布变换按累计概率切段，段长等于目标概率；边界归属固定左闭右开。先确认原料 <span class=\"katex-inline\">U<\/span> 均匀，再查分段边界与归属；原料偏斜会被变换放大，不在变换环节补救。<\/p>\n<h2>模式 4：记数表示先定基数规则，再做转换<\/h2>\n<p>数位权重 <span class=\"katex-inline\">b^k<\/span>、数位范围 <span class=\"katex-inline\">0\\le a_k&lt;b<\/span>、进位按 <span class=\"katex-inline\">b<\/span> 折算三条规则先立住；整数除基取余、小数乘基取整，转换后回代展开式核验。循环小数按精度截断并标注舍入，不把近似当精确值。<\/p>\n<h2>模式 5：浮点运算先排对齐、规范化、舍入次序<\/h2>\n<p>对齐尾数→运算→规范化→舍入→边界检查，次序固定。加法从小量级累加减少吞位；相近大数相减先评估有效位损失；上溢下溢单独标记。指数撑范围，尾数定精度，两者不互相替代。<\/p>\n<h2>模式 6：多精度竖式先估位数边界，再推进数位<\/h2>\n<p>加减多一位，乘积 <span class=\"katex-inline\">m+n<\/span> 位，商余按公式落位；进位借位单独成串传递，不压本位寄存器。余数非负且小于除式。经典竖式作正确性基准，大位数再上分治改进。<\/p>\n<h2>模式 7：算法选型先辨对象类型，再套流程<\/h2>\n<p>gcd 求公因子不替代素因子分解；多项式除法先查系数逆元；快速幂、霍纳求值、卷积各有代价结构。拿到问题先判目标是求商余、分解、乘幂还是求值，再选对应算法，不把一套流程硬套到全部操作上。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 均匀随机数的生成<\/strong>：线性同余递推、周期上界、定理 A 全周期条件、模与乘数选择、零增量的阶（PDF 第 12、19、20、24、29 页起；印刷页 = PDF 页 − 11）。\n<\/li><li>\n<strong>第 2 章 检验与其他随机量<\/strong>：卡方与经验检验、谱检验格结构、均匀偏差到其他分布的变换、抽样与洗牌（PDF 第 43、81、101 页起）。\n<\/li><li>\n<strong>第 3 章 记数、浮点与多精度算术<\/strong>：按位记数与进制转换、浮点规范化与误差界、多精度竖式、乘法复杂度（PDF 第 158、174、214、236 页起）。\n<\/li><li>\n<strong>第 4 章 有理数与多项式算术<\/strong>：gcd 与辗转相除、斐波那契最坏情形、多项式除法/分解/快速幂/求值（PDF 第 265、267、277、335 页起）。\n<\/ul>\n<h2>线性同余发生器<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>量<\/th><th>记号<\/th><th>取值范围<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td>模<\/td><td><span class=\"katex-inline\">m<\/span><\/td><td><span class=\"katex-inline\">0&lt;m<\/span><\/td><td>周期天花板，取模空间<\/td><\/tr><tr><td>乘数<\/td><td><span class=\"katex-inline\">a<\/span><\/td><td><span class=\"katex-inline\">0\\le a&lt;m<\/span><\/td><td>轨道形状<\/td><\/tr><tr><td>增量<\/td><td><span class=\"katex-inline\">c<\/span><\/td><td><span class=\"katex-inline\">0\\le c&lt;m<\/span><\/td><td>平移偏移<\/td><\/tr><tr><td>初值<\/td><td><span class=\"katex-inline\">X_0<\/span><\/td><td><span class=\"katex-inline\">0\\le X_0&lt;m<\/span><\/td><td>循环入口<\/td><\/tr><\/tbody><\/table><\/div>\n<p>递推：<span class=\"katex-inline\">X_{n+1}=(aX_n+c)\\bmod m<\/span>，<span class=\"katex-inline\">U_n=X_n/m<\/span>。<\/p>\n<h2>定理 A 全周期三条件<\/h2>\n<ol><li>\n<span class=\"katex-inline\">\\gcd(c,m)=1<\/span>；\n<\/li><li>\n对每个整除 <span class=\"katex-inline\">m<\/span> 的素数 <span class=\"katex-inline\">p<\/span>，<span class=\"katex-inline\">p\\mid(a-1)<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">4\\mid m<\/span> 时 <span class=\"katex-inline\">4\\mid(a-1)<\/span>。\n<\/ol>\n<h2>检验角度对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>检验<\/th><th>考察对象<\/th><th>统计量方向<\/th><\/tr><\/thead><tbody><tr><td>卡方<\/td><td>单变量频数分布<\/td><td><span class=\"katex-inline\">\\sum(N_s-E_s)^2/E_s<\/span><\/td><\/tr><tr><td>连检验<\/td><td>相邻次序延续长度<\/td><td>各长度连的个数对照期望<\/td><\/tr><tr><td>配对检验<\/td><td>二元组合落点<\/td><td>象限/格子点数对照期望<\/td><\/tr><tr><td>谱检验<\/td><td>全周期格结构<\/td><td>平行面间距<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>记数与浮点<\/h2>\n<ul><li>\n<span class=\"katex-inline\">b<\/span> 进制展开：<span class=\"katex-inline\">\\sum a_kb^k<\/span>，<span class=\"katex-inline\">0\\le a_k&lt;b<\/span>。\n<\/li><li>\n浮点对：<span class=\"katex-inline\">f\\times b^{e-q}<\/span>，<span class=\"katex-inline\">|f|&lt;1<\/span>，规范化挤掉前导零。\n<\/li><li>\n误差：单步相对误差与 <span class=\"katex-inline\">b^{-p}<\/span> 同阶，多步累积；相近大数相减损失有效位。\n<\/ul>\n<h2>多精度与多项式<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>操作<\/th><th>代价/规则<\/th><\/tr><\/thead><tbody><tr><td>竖式乘法<\/td><td><span class=\"katex-inline\">mn<\/span> 次单步，<span class=\"katex-inline\">n<\/span> 位平方阶<\/td><\/tr><tr><td>分治乘法<\/td><td><span class=\"katex-inline\">T(n)=3T(n/2)+O(n)<\/span>，<span class=\"katex-inline\">O(n^{1.585})<\/span><\/td><\/tr><tr><td>辗转相除<\/td><td>余数严格递减，最坏步数对数于位数<\/td><\/tr><tr><td>多项式卷积<\/td><td><span class=\"katex-inline\">w_k=\\sum_{i+j=k}u_iv_j<\/span><\/td><\/tr><tr><td>快速幂<\/td><td>指数二进制扫描，对数次乘法<\/td><\/tr><tr><td>霍纳求值<\/td><td><span class=\"katex-inline\">n<\/span> 次乘法完成 <span class=\"katex-inline\">n<\/span> 次多项式<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>最坏情形对照<\/h2>\n<ul><li>\n欧几里得算法最慢输入：连续斐波那契数 <span class=\"katex-inline\">u=F_{n+2}<\/span>，<span class=\"katex-inline\">v=F_{n+1}<\/span>。\n<\/li><li>\n步数上界：<span class=\"katex-inline\">\\lceil\\log_\\phi((3-\\phi)N)\\rceil<\/span>。\n<\/ul>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const SYN_GROUPS = [["定义", "含义", "释义", "概念"], ["例题", "算例", "示例", "例子", "案例"], ["习题", "题目", "练习", "测验", "自测"], ["推导", "证明", "论证", "演算"], ["步骤", "流程", "过程", "环节"], ["性质", "特性", "特点", "属性"], ["公式", "表达式", "式子"], ["定理", "定律", "法则", "准则"], ["图像", "图形", "图示", "曲线"], ["计算", "求解", "算出", "求值"], ["平均值", "均值", "平均数"], ["误差", "偏差", "偏离"], ["函数", "映射", "对应关系"], ["导数", "变化率", "切线斜率", "微商"], ["原函数", "不定积分", "反导数"], ["概率", "几率", "可能性"]];
const SOURCES = {};
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
const ZS_VERSION = '1.9.0';
/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  if(typeof vis !== 'undefined'){ networkLoaded = true; cb(); return; }
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE) { cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库未加载：离线构建请加 <code>--offline all</code>，或联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 掌握度（简化 BKT） ---------- */
function getMastery(cid){
  if(!cid) return 0.5;
  const m = (state.mastery||{})[cid];
  return m !== undefined ? m : 0.3;
}
function updateMastery(cid, delta){
  if(!cid) return;
  if(!state.mastery) state.mastery = {};
  const cur = state.mastery[cid] !== undefined ? state.mastery[cid] : 0.3;
  state.mastery[cid] = Math.max(0, Math.min(1, cur + delta));
  store.set('mastery', state.mastery);
}
function masteryBar(cid){
  const v = Math.round(getMastery(cid)*100);
  return `<div class="mastery-bar"><div style="width:${v}%"></div></div><span class="mastery-label">掌握度 ${v}%</span>`;
}

/* ---------- 搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIndex = null;
let pendingHl = [];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP = new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                        '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                        '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw = q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out = [];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length > 2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low = text.toLowerCase();
  let pos = -1, hit = '';
  for(const t of terms){ const i = low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start = Math.max(0, (pos<0?0:pos) - 60);
  const end = Math.min(text.length, (pos<0?0:pos) + 140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms = pendingHl.slice(); pendingHl = [];
  if(!terms.length) return;
  const root = $('#view'); if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first = null, idx = -1, term = '';
  while((node = walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low = node.nodeValue.toLowerCase();
    for(const t of terms){
      const i = low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){
        first = node; idx = i; term = t;
      }
    }
  }
  if(!first) return;
  try{
    const i = first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range = document.createRange();
    range.setStart(first, i); range.setEnd(first, i+term.length);
    const mark = document.createElement('mark');
    mark.className = 'hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'), 1800);
  }catch(e){}
}
document.addEventListener('click', (e)=>{
  const a = (e.target && e.target.closest) ? e.target.closest('.search-hit a') : null;
  if(a && a.dataset.hl) pendingHl = tokenizeQuery(a.dataset.hl);
});
function searchHref(id){
  const map = {'__path__':'#/path','__diagnosis__':'#/diagnosis','__graph__':'#/graph',
               '__cards__':'#/cards','__glossary__':'#/glossary','__patterns__':'#/patterns',
               '__cheatsheet__':'#/cheatsheet'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '#/quiz/'+id.replace('__quiz_','').replace(/__$/,'');
  if(id.startsWith('__')) return '';
  return '#/'+id;
}
function searchLabel(id){
  if((manifest.chapters||[]).some(c=>c.id===id)) return '章节：'+id;
  if((manifest.concepts||[]).some(c=>c.id===id)) return '概念：'+id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '测验';
  return id;
}
function pageTitle(id){
  const ch = (manifest.chapters||[]).find(c=>c.id===id);
  if(ch) return ch.title || id;
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp) return cp.title || id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')){
    const q = (manifest.quizzes||[]).find(x=>'__quiz_'+x.id===id);
    return q ? '测验 · '+String(q.question||'').slice(0,14) : '测验';
  }
  return id;
}
function chapOf(id){
  const chs = manifest.chapters || [];
  const ci = chs.findIndex(c=>c.id===id);
  if(ci >= 0) return {key:'ch:'+id, label:chs[ci].title||id, order:ci};
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp){
    const chId = (cp.chapterIds||[])[0];
    const i = chs.findIndex(c=>c.id===chId);
    if(i >= 0) return {key:'ch:'+chId, label:chs[i].title||chId, order:i};
    return {key:'zz', label:'未归入章节', order:900};
  }
  return {key:'tools', label:'术语与工具页', order:950, ref:true};
}
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    const href = searchHref(id);
    if(!href) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, href, text, label:pageTitle(id), chap:chapOf(id)});
  });
  return searchIndex;
}
function synOf(t){
  const out = [];
  for(const g of SYN_GROUPS){ if(g.indexOf(t) >= 0){ for(const x of g){ if(x !== t) out.push(x); } } }
  return out.slice(0,6);
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim();
  if(!v){ showPage(routeIdFromHash()); return; }
  const terms = tokenizeQuery(v);
  if(!terms.length){ showPage(routeIdFromHash()); return; }
  const grams = [];
  terms.forEach(t=>{ if(t.length >= 2){ for(let i=0;i+2<=t.length;i++) grams.push(t.slice(i,i+2)); } });
  const qGrams = [...new Set(grams)].slice(0,16);
  const snippetTerms = terms.concat(...terms.map(synOf)).slice(0,24);
  const hits = [];
  buildSearchIndex().forEach(p=>{
    const low = p.text.toLowerCase();
    let tHit = 0, sHit = 0, gHit = 0, first = '', viaSyn = '';
    for(const t of terms){
      if(low.includes(t)){ tHit++; if(!first) first = t; continue; }
      for(const s of synOf(t)){
        if(low.includes(s)){ sHit++; if(!viaSyn) viaSyn = s; if(!first) first = s; break; }
      }
    }
    for(const gm of qGrams){ if(low.includes(gm)) gHit++; }
    if(tHit > 0 || sHit > 0 || gHit >= 4){
      hits.push({p, score: tHit*100 + sHit*30 + Math.min(gHit,20), first, viaSyn});
    }
  });
  hits.sort((a,b)=> b.score-a.score || a.p.text.length-b.p.text.length);
  const top = hits.slice(0,20);
  let body;
  if(top.length){
    const gs = {};
    top.forEach(h=>{
      const k = h.p.chap.key;
      (gs[k] = gs[k] || {label:h.p.chap.label, order:h.p.chap.order, ref:!!h.p.chap.ref, hits:[]}).hits.push(h);
    });
    const eff = g => Math.max(...g.hits.map(x=>x.score)) * (g.ref ? 0.55 : 1);
    const order = Object.values(gs).sort((a,b)=> eff(b)-eff(a));
    body = order.map(g=>{
      const inner = g.hits.sort((a,b)=> b.score-a.score).map(h=>
        `<div class="search-hit"><a href="${h.p.href}" data-hl="${esc(h.first)}">${esc(h.p.label)}</a>${h.viaSyn?`<span class="syn-note">同义命中：${esc(h.viaSyn)}</span>`:''}<br><span class="sub">${hlSnippet(h.p.text, snippetTerms)}</span></div>`).join('');
      return `<div class="search-group"><div class="grp-head">${esc(g.label)}<span class="grp-count">${g.hits.length}</span></div>${inner}</div>`;
    }).join('');
  } else {
    body = '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语，或减少关键词。</div>';
  }
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' + body;
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof mermaid === 'undefined') return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  if(typeof mermaid !== 'undefined'){ boot(); return; }
  const urls=['https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js',
              'https://registry.npmmirror.com/mermaid/10.9.1/files/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js'];
  let ui=0, done=false;
  const tryNext=()=>{
    if(done || ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    const timer=setTimeout(()=>{ if(done) return; s.onload=null; s.onerror=null; s.remove(); tryNext(); }, 4000);
    s.onload=()=>{ done=true; clearTimeout(timer); boot(); };
    s.onerror=()=>{ clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

<script id="zs-visual-init">
(function(){
  try{
    var B=document.body, H=document.documentElement;
    if(!B.dataset.theme && !H.dataset.theme) B.dataset.theme='dark';
    var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
    var scope=document.querySelectorAll('header, .topbar, .topbar-fixed, #topbar, .sidebar, .tabs, .hdr-right, .card-actions, .card-controls, .section-title, .card .icon, .icon-label');
    for(var i=0;i<scope.length;i++){
      var w=document.createTreeWalker(scope[i],NodeFilter.SHOW_TEXT,null,false), n;
      while(n=w.nextNode()){
        if(EMOJI.test(n.nodeValue)){
          n.nodeValue=n.nodeValue.replace(EMOJI,'').replace(/[ \t]+/g,' ').replace(/^ | $/g,'');
        }
      }
    }
    var btn=document.getElementById('theme-btn')||document.getElementById('theme')||document.getElementById('themeToggle');
    function label(){
      if(!btn) return;
      var light=B.dataset.theme==='light'||H.getAttribute('data-theme')==='light'||B.dataset.theme==='';
      if(btn.textContent.trim()===''||/浅色|深色/.test(btn.textContent)) btn.textContent=light?'深色':'浅色';
    }
    label();
    if(btn){
      new MutationObserver(label).observe(B,{attributes:true,attributeFilter:['data-theme']});
      new MutationObserver(label).observe(H,{attributes:true,attributeFilter:['data-theme']});
      btn.addEventListener('click',function(){setTimeout(label,0);},true);
    }
  }catch(e){}
})();
