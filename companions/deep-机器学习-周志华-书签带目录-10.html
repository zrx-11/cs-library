不代表真实泛化能力，指标再好也不能外推。\n<\/li><li>\n<strong>边界<\/strong>：偏差-方差分解是理论视角，现实数据中噪声项不可消除；欠拟合靠增强模型容量缓解，过拟合靠正则化、剪枝、增加样本缓解，两者方向不能混。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>精度 vs 查准率<\/strong>：精度（accuracy）对全部样本统计判对比例；查准率只在预测为正例的样本中统计判对比例，口径不同。\n<\/li><li>\n<strong>P-R 曲线 vs ROC 曲线<\/strong>：P-R 纵轴查准率、横轴查全率；ROC 纵轴 TPR、横轴 FPR。类别极不平衡时 P-R 曲线对正例比例更敏感，ROC 可能显得过于乐观。\n<\/li><li>\n<strong>偏差 vs 方差<\/strong>：高偏差对应欠拟合，模型容量不足；高方差对应过拟合，训练集小幅变化就引起预测大幅摆动。\n<\/li><li>\n<strong>留出法 vs 交叉验证<\/strong>：留出法一次划分、计算省，但结果依赖单次划分；交叉验证反复折分、评估更稳，计算量随 <span class=\"katex-inline\">k<\/span> 放大。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置概念：无，本章是全书评估语言的起点。后继：概念 c02 的平方损失与对数似然以本章指标作为验收标准；概念 c08 集成学习的多样性-准确性权衡可放回偏差-方差框架理解；概念 c12 的 PAC 理论把&quot;以多大概率达到多小误差&quot;形式化，是本章经验评估的理论对应物。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（经验误差、过拟合与模型评估：错误率、P/R/F1、ROC-AUC、交叉验证与偏差-方差）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：评估指标的代数来源、ROC 面积估算与偏差-方差分解<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把模型评估讲透，往回追四层前提：<\/p>\n<ol><li>\n<strong>评估对象必须先分清训练误差与泛化误差<\/strong>。若把两者混为一谈，优化目标就变成背下训练集；先定义两类误差，才能解释过拟合为什么是评估问题而不只是优化问题。\n<\/li><li>\n<strong>分类结果要先落到混淆矩阵四项<\/strong>。任何 P、R、F1、TPR、FPR 都从 TP、FP、TN、FN 计数出发；不先约定四项口径，指标公式无法逐项对应。\n<\/li><li>\n<strong>指标分两类口径<\/strong>：固定截断点的指标（P、R、F1、准确率）与考察全排序的指标（ROC、AUC）。前者回答&quot;在这个阈值下判得怎样&quot;，后者回答&quot;样本排得怎样&quot;，推导路径分开。\n<\/li><li>\n<strong>评估稳定性依赖数据划分方式<\/strong>。单次划分结果有偶然性，留出、交叉验证、自助采样各在偏差与方差间折中；理解划分方式才能判断指标波动来自哪里。\n<\/ol>\n<p>依赖链方向：误差定义 → 混淆矩阵计数 → 点指标与排序指标 → 数据划分途径 → 偏差-方差对泛化误差的拆解。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：错误率、精度与混淆矩阵<\/h3>\n<p>设 <span class=\"katex-inline\">m<\/span> 个样本中 <span class=\"katex-inline\">a<\/span> 个分类错误，错误率 <span class=\"katex-inline\">E=a/m<\/span>，精度 <span class=\"katex-inline\">\\mathrm{acc}=1-a/m<\/span>。二分类下把预测与真实的组合排成 <span class=\"katex-inline\">2\\times2<\/span> 矩阵：真实为正例、预测为正例记 <span class=\"katex-inline\">TP<\/span>，真实为反例、预测为正例记 <span class=\"katex-inline\">FP<\/span>，真实为反例、预测为反例记 <span class=\"katex-inline\">TN<\/span>，真实为正例、预测为反例记 <span class=\"katex-inline\">FN<\/span>。计数恒等式 <span class=\"katex-inline\">TP+FP+TN+FN=m<\/span> 用于核对矩阵是否漏计。<\/p>\n<h3>第二步：查准率、查全率与 F1<\/h3>\n<p>查准率 <span class=\"katex-inline\">P=TP/(TP+FP)<\/span>：在所有被预测为正例的样本里，真正例占多少；查全率 <span class=\"katex-inline\">R=TP/(TP+FN)<\/span>：在所有真实正例里，被找出来多少。两者矛盾的来源是同一个截断点：阈值放宽，更多样本进入正例侧，<span class=\"katex-inline\">R<\/span> 上升而混入的 <span class=\"katex-inline\">FP<\/span> 增多拉低 <span class=\"katex-inline\">P<\/span>。<\/p>\n<p>F1 取调和平均 <span class=\"katex-inline\">F_1=2PR/(P+R)<\/span>。调和平均的特点是对较小值敏感：<span class=\"katex-inline\">P<\/span> 与 <span class=\"katex-inline\">R<\/span> 中只要有一个偏低，F1 就被拉低；这与算术平均不同，算术平均会让一项很高掩盖另一项很低。<span class=\"katex-inline\">F_\\beta=\\frac{(1+\\beta^2)PR}{\\beta^2P+R}<\/span>，<span class=\"katex-inline\">\\beta&gt;1<\/span> 更重视查全率，<span class=\"katex-inline\">\\beta&lt;1<\/span> 更重视查准率。<\/p>\n<h3>第三步：ROC 曲线与 AUC 梯形估算<\/h3>\n<p>按预测得分从高到低排序样本，分类阈值依次取每个样本的预测值。起点 <span class=\"katex-inline\">(0,0)<\/span>：每遇到真正例，纵坐标增加 <span class=\"katex-inline\">1/(TP+FN)<\/span>；每遇到假正例，横坐标增加 <span class=\"katex-inline\">1/(FP+TN)<\/span>。把相邻标记点用线段连接即得近似 ROC 曲线。<\/p>\n<p>AUC 按线段下梯形求和。设相邻点 <span class=\"katex-inline\">(x_1,y_1)<\/span>、<span class=\"katex-inline\">(x_2,y_2)<\/span>，该段贡献 <span class=\"katex-inline\">\\frac{y_1+y_2}{2}(x_2-x_1)<\/span>；所有段累加：<\/p>\n<div class=\"katex-block\">\\mathrm{AUC}=\\sum_{k=1}^{m-1}\\frac{y_k+y_{k+1}}{2}(x_{k+1}-x_k).<\/div>\n<p>对角线对应随机猜测，AUC=0.5；点 <span class=\"katex-inline\">(0,1)<\/span> 对应理想排序，AUC=1。从概率解释看，AUC 等于随机抽取一个正例与一个反例、正例得分不低于反例的概率；这个解释不依赖具体截断点。<\/p>\n<h3>第四步：数据划分的偏差与方差<\/h3>\n<p>留出法把 <span class=\"katex-inline\">D<\/span> 拆 <span class=\"katex-inline\">S<\/span>（训练）与 <span class=\"katex-inline\">T<\/span>（测试）：<span class=\"katex-inline\">S<\/span> 大则模型接近全量训练结果，但 <span class=\"katex-inline\">T<\/span> 小、指标方差大；<span class=\"katex-inline\">T<\/span> 大则评估保真性下降，被评模型与全量模型差距变大。<span class=\"katex-inline\">k<\/span> 折交叉验证把 <span class=\"katex-inline\">D<\/span> 分成 <span class=\"katex-inline\">k<\/span> 份，轮流用一份测试、其余 <span class=\"katex-inline\">k-1<\/span> 份训练，<span class=\"katex-inline\">k<\/span> 次结果取平均，用重复划分平滑偶然性。自助采样有放回抽 <span class=\"katex-inline\">m<\/span> 次，单个样本未被抽到的概率为 <span class=\"katex-inline\">(1-1/m)^m<\/span>，<span class=\"katex-inline\">m<\/span> 较大时趋近 <span class=\"katex-inline\">1/e\\approx0.368<\/span>，故约 <span class=\"katex-inline\">63.2\\%<\/span> 样本进入采样集，未抽到的样本可做包外估计。<\/p>\n<h3>第五步：偏差-方差分解<\/h3>\n<p>对固定训练集规模 <span class=\"katex-inline\">D<\/span>，学习器 <span class=\"katex-inline\">f<\/span> 在样本 <span class=\"katex-inline\">\\mathbf x<\/span> 上的预测期望记 <span class=\"katex-inline\">\\bar f(\\mathbf x)=\\mathbb E_D[f(\\mathbf x;D)]<\/span>。泛化误差可拆为三项：<\/p>\n<div class=\"katex-block\">E(f;D)=\\mathrm{bias}^2(\\mathbf x)+\\mathrm{var}(\\mathbf x)+\\sigma^2,<\/div>\n<p>其中偏差平方 <span class=\"katex-inline\">\\mathrm{bias}^2=(\\bar f(\\mathbf x)-y)^2<\/span> 度量平均预测与真实规律的差距，方差 <span class=\"katex-inline\">\\mathrm{var}=\\mathbb E_D[(f(\\mathbf x;D)-\\bar f(\\mathbf x))^2]<\/span> 度量训练集扰动引起的摆动，<span class=\"katex-inline\">\\sigma^2<\/span> 为数据本身噪声。欠拟合落在高偏差区：模型连训练规律都没学好；过拟合落在高方差区：训练集小幅变化就改变预测。模型容量上调通常偏差下降、方差上升，选择空间是这条权衡曲线上的点。<\/p>\n<h3>第八步：AUC 的成对概率解释<\/h3>\n<p>把正例得分记 <span class=\"katex-inline\">s_+<\/span>，反例得分记 <span class=\"katex-inline\">s_-<\/span>。随机抽取一个正例对 <span class=\"katex-inline\">(\\mathbf x_+,\\mathbf x_-)<\/span>，指示量 <span class=\"katex-inline\">\\mathbb I(s_+&gt;s_-)<\/span> 在正例得分更高时取 1。所有正负例对的平均指示量为<\/p>\n<div class=\"katex-block\">\\mathrm{AUC}=\\frac{1}{m^+m^-}\\sum_{i:y_i=+1}\\sum_{j:y_j=-1}\\big[\\mathbb I(s_i>s_j)+\\tfrac12\\mathbb I(s_i=s_j)\\big].<\/div>\n<p>等号右边逐对比较：严格高分记 1，平分记 0.5。这个形式说明 AUC 不看绝对分值大小，只看相对次序；得分整体缩放、平移不改变次序，因此不改变 AUC。与 ROC 梯形公式对照：梯形法按排序累积假正例位置，成对法按样本对累加胜出次数，两者在有限样本上估计的是同一个量。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：混淆矩阵与点指标<\/h3>\n<p>测试集 30 个样本：<span class=\"katex-inline\">TP=8<\/span>，<span class=\"katex-inline\">FP=2<\/span>，<span class=\"katex-inline\">FN=4<\/span>，<span class=\"katex-inline\">TN=16<\/span>。核对 <span class=\"katex-inline\">8+2+4+16=30<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">P=8/10=0.800<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">R=8/12\\approx0.667<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">F_1=2\\times0.800\\times0.667/1.467\\approx0.727<\/span>；\n<\/li><li>\n准确率 <span class=\"katex-inline\">=24/30=0.800<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">TPR=8/12=0.667<\/span>，<span class=\"katex-inline\">FPR=2/18\\approx0.111<\/span>。\n<\/ul>\n<h3>算例 2：两点 ROC 的 AUC<\/h3>\n<p>设排序后前两个样本依次为真正例、假正例，余下样本不再产生坐标移动。起点 <span class=\"katex-inline\">(0,0)<\/span>；纳入真正例后到 <span class=\"katex-inline\">(0,1/12)<\/span>；纳入假正例后到 <span class=\"katex-inline\">(1/18,1/12)<\/span>；曲线终点归一到 <span class=\"katex-inline\">(1,1)<\/span>。第一段梯形面积 <span class=\"katex-inline\">\\frac{0+1/12}{2}(0-0)=0<\/span>；第二段 <span class=\"katex-inline\">\\frac{1/12+1/12}{2}(1/18-0)=1/216\\approx0.0046<\/span>；末段按归一化连线补齐。小规模数据 ROC 呈阶梯状，AUC 对排序最靠前的几个样本敏感。<\/p>\n<h3>算例 3：<span class=\"katex-inline\">F_\\beta<\/span> 偏好调整<\/h3>\n<p>沿用算例 1 的 <span class=\"katex-inline\">P=0.800<\/span>、<span class=\"katex-inline\">R=0.667<\/span>。取 <span class=\"katex-inline\">\\beta=2<\/span>（更重视查全率）：<span class=\"katex-inline\">F_2=\\frac{5\\times0.800\\times0.667}{4\\times0.800+0.667}\\approx0.698<\/span>；取 <span class=\"katex-inline\">\\beta=0.5<\/span>（更重视查准率）：<span class=\"katex-inline\">F_{0.5}=\\frac{1.25\\times0.800\\times0.667}{0.25\\times0.800+0.667}\\approx0.792<\/span>。同一对 P、R，偏好不同得到不同综合分。<\/p>\n<h3>第六步：划分途径的数值对照<\/h3>\n<p>设数据集 100 个样本。留出法按 7:3 拆出 70 训练、30 测试：单次划分若测试集恰好含难样本，指标会明显偏低；重复随机留出 5 次取平均，可观察指标波动幅度。5 折交叉验证：每折 20 个测试样本、80 个训练样本，轮流 5 次，每个样本恰好被测试一次，结果取 5 折平均。自助采样：抽 100 次有放回，样本未被抽中的概率 <span class=\"katex-inline\">(1-1/100)^{100}\\approx0.366<\/span>，约 36.6% 样本不在采样集中，这部分可作包外测试集；代价是训练集与采样集重复度高，评估估计有偏。<\/p>\n<h3>第七步：噪声项为何不可约<\/h3>\n<p>分解式中 <span class=\"katex-inline\">\\sigma^2<\/span> 是同一输入下标签自身的波动，与算法选择无关。无论模型多复杂，预测都无法越过噪声项；评估时若把噪声导致的误差归因于模型欠拟合，会盲目上调容量，把方差抬上去。判断欠拟合还是过拟合，先看训练误差：训练误差已高，是偏差问题；训练误差低而测试误差高，是方差问题；两者都高才是噪声或数据质量问题。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong>为什么误差率不能直接指导模型选择<\/strong>：误差率把所有错误等权对待，而检索场景漏过正例与混入假例代价不同；P/R 分别暴露两类错误，<span class=\"katex-inline\">F_\\beta<\/span> 把业务偏好写进权重。\n<\/li><li>\n<strong>AUC 对类别不平衡的稳健性来源<\/strong>：AUC 只比较正负样本对的得分次序，不统计判对绝对数量；反例占绝大多数时，准确率被反例预测主导，AUC 仍反映排序能力。代价是 ROC 在稀正例场景下曲线观感偏乐观，需配合 P-R 曲线一起看。\n<\/li><li>\n<strong>交叉验证轮次的取舍<\/strong>：<span class=\"katex-inline\">k<\/span> 越大，每折训练集越接近全量，评估偏差越小，但折间相关性高、计算量大；<span class=\"katex-inline\">k=10<\/span> 是常见折中，数据集很小或很大时再调整。\n<\/ul>\n<h3>算例 4：三种模型的学习曲线读数<\/h3>\n<p>同一数据集上训出 A、B、C 三个模型：A 训练误差 0.05、测试误差 0.42；B 训练误差 0.38、测试误差 0.41；C 训练误差 0.06、测试误差 0.10。A 训练低测试高，方差主导，过拟合；B 训练与测试都偏高，偏差主导，欠拟合；C 两侧都低且差距小，容量与数据规模相称。按分解式看，A 的方差项大，B 的偏差平方项大，C 两项都被压住。若给 A 增加正则化或扩充样本，方差下降；给 B 更换更强模型或补充特征，偏差下降。<\/p>\n<h3>算例 5：自助采样的包外估计<\/h3>\n<p><span class=\"katex-inline\">m=100<\/span> 时，某样本未被抽中的概率 <span class=\"katex-inline\">(1-1/100)^{100}\\approx0.366<\/span>，包外集约 37 个样本；这部分样本不参与训练，可直接作为测试集估计泛化误差。包外估计无需额外划分数据，但采样集与原始集同分布假设要求样本独立同分布；时间序列或强相关数据上，有放回采样会把相关样本同时放进训练与包外，估计偏乐观。<\/p>\n<h3>延伸：BEP 与曲线包围关系<\/h3>\n<p>平衡点（Break-Event Point，BEP）是查准率等于查全率时的取值，作为单值比较辅助判据；P-R 曲线被另一条完全包住时，外侧曲线性能占优，两曲线交叉时只能在具体 P 或 R 条件下比较。ROC 的包围判据一致：曲线被完全包住则外侧更优，交叉时借助 AUC 数值比较。BEP 与 F1 都是把二维曲线压成单值的折中手段，压掉的信息是阈值偏好。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n一个全部预测为反例的模型，其准确率、查全率、AUC 分别是多少？为什么高准确率不能说明模型有用？\n<\/li><li>\n同样的混淆矩阵，<span class=\"katex-inline\">F_1<\/span> 与算术平均 <span class=\"katex-inline\">(P+R)/2<\/span> 何时接近、何时拉开？试构造 <span class=\"katex-inline\">P=0.99,R=0.20<\/span> 的例子比较两者。\n<\/li><li>\nROC 曲线上哪一段对应&quot;阈值很松&quot;，哪一段对应&quot;阈值很紧&quot;？纵坐标与横坐标各自在纳入哪类样本时移动？\n<\/li><li>\n高偏差与高方差在学习曲线上分别表现为训练误差、测试误差怎样的组合？增加样本量对哪一侧缓解更直接？\n<\/ol><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.69<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">经验误差、过拟合与模型评估：错误率、P/R/F1、ROC-AUC、交叉验证与偏差-方差<\/a><\/span><\/div><h1>线性模型：最小二乘正规方程、对数几率回归的对数似然与梯度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：原书第 3 章线性模型（PDF 第 67–76 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>回归任务要学出属性线性组合的预测函数；分类任务要把线性输出转成类别后验概率。只用均值预测无法利用属性信息，直接对类别标签套连续值回归又忽略概率结构。线性模型给出两条可求解路径：回归用最小二乘估计权重，分类用对数几率函数压到 <span class=\"katex-inline\">(0,1)<\/span> 再按极大似然估计参数。弄清损失来源与梯度方向，是理解后续网络训练循环的基础。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>线性模型<\/strong>：<span class=\"katex-inline\">f(\\mathbf x)=\\mathbf w^\\top\\mathbf x+b<\/span>，<span class=\"katex-inline\">w_j<\/span> 是第 <span class=\"katex-inline\">j<\/span> 个属性权重，<span class=\"katex-inline\">b<\/span> 为截距（原书 3.1 节，PDF 第 67 页）。<\/p>\n<p><strong>增广设计矩阵<\/strong>：把 <span class=\"katex-inline\">b<\/span> 并入权重 <span class=\"katex-inline\">\\hat{\\mathbf w}=(\\mathbf w;b)<\/span>，<span class=\"katex-inline\">X\\in\\mathbb R^{m\\times(d+1)}<\/span> 每行前 <span class=\"katex-inline\">d<\/span> 列为属性、末列恒为 1，标签向量 <span class=\"katex-inline\">\\mathbf y\\in\\mathbb R^m<\/span>。<\/p>\n<p><strong>平方损失<\/strong>：<span class=\"katex-inline\">E_{\\hat{\\mathbf w}}=(\\mathbf y-X\\hat{\\mathbf w})^\\top(\\mathbf y-X\\hat{\\mathbf w})=\\lVert X\\hat{\\mathbf w}-\\mathbf y\\rVert_2^2<\/span>。<\/p>\n<p><strong>正规方程<\/strong>：令损失梯度为零得 <span class=\"katex-inline\">X^\\top X\\hat{\\mathbf w}=X^\\top\\mathbf y<\/span>；<span class=\"katex-inline\">X^\\top X<\/span> 满秩或正定时闭式解 <span class=\"katex-inline\">\\hat{\\mathbf w}^*=(X^\\top X)^{-1}X^\\top\\mathbf y<\/span>（原书 3.2 节，PDF 第 69 页）。<\/p>\n<p><strong>对数几率函数<\/strong>：<span class=\"katex-inline\">y=1/(1+e^{-z})<\/span>，单调可微的 Sigmoid 函数，把实数输出映射到 <span class=\"katex-inline\">(0,1)<\/span>。<\/p>\n<p><strong>对数似然<\/strong>：<span class=\"katex-inline\">\\ell(\\mathbf w,b)=\\sum_i\\ln p(y_i|\\mathbf x_i;\\mathbf w,b)<\/span>，极大似然即令每个样本属于真实标记的概率尽量大（原书 3.3 节，PDF 第 73 页）。负对数似然是关于参数的凸函数，可用梯度下降或牛顿法求解。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>平方损失展开为 <span class=\"katex-inline\">E=\\hat{\\mathbf w}^\\top X^\\top X\\hat{\\mathbf w}-2\\mathbf y^\\top X\\hat{\\mathbf w}+\\mathbf y^\\top\\mathbf y<\/span>。对 <span class=\"katex-inline\">\\hat{\\mathbf w}<\/span> 求梯度，二次型梯度为 <span class=\"katex-inline\">2X^\\top X\\hat{\\mathbf w}<\/span>，一次项梯度为 <span class=\"katex-inline\">-2X^\\top\\mathbf y<\/span>，故 <span class=\"katex-inline\">\\nabla E=2X^\\top(X\\hat{\\mathbf w}-\\mathbf y)<\/span>。令其为零即正规方程。几何上 <span class=\"katex-inline\">\\hat{\\mathbf y}=X\\hat{\\mathbf w}<\/span> 落在 <span class=\"katex-inline\">X<\/span> 列空间内，残差与列空间正交，闭式解找到列空间中离 <span class=\"katex-inline\">\\mathbf y<\/span> 最近的点。<\/p>\n<p>对数几率回归中，类后验 <span class=\"katex-inline\">p(y=1|\\mathbf x)=1/(1+e^{-\\mathbf w^\\top\\mathbf x+b})<\/span>。代入对数似然取负，等价于最小化<\/p>\n<div class=\"katex-block\">E(\\beta)=\\sum_i\\big[-y_i\\beta^\\top\\hat{\\mathbf x}_i+\\ln(1+e^{\\beta^\\top\\hat{\\mathbf x}_i})\\big],<\/div>\n<p><span class=\"katex-inline\">\\beta=(\\mathbf w;b)<\/span>，<span class=\"katex-inline\">\\hat{\\mathbf x}_i=(\\mathbf x_i;1)<\/span>。对 <span class=\"katex-inline\">\\beta<\/span> 求梯度：<span class=\"katex-inline\">\\nabla_\\beta E=\\sum_i\\hat{\\mathbf x}_i(\\hat y_i-y_i)<\/span>，结构与线性回归残差梯度同构，预测值换成 Sigmoid 输出。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：正规方程要求 <span class=\"katex-inline\">X^\\top X<\/span> 满秩，特征间无严格共线，样本数不少于特征数；模型假设回归面或决策边界为线性。\n<\/li><li>\n<strong>失败案例一：特征数超过样本数<\/strong>。<span class=\"katex-inline\">X^\\top X<\/span> 不满秩，解析解不唯一，权重在共线特征间任意分配；需引入正则化或改用迭代求解。\n<\/li><li>\n<strong>失败案例二：把对数几率回归当回归模型直接出类别<\/strong>。模型给的是后验概率估计，类别判定要另设截断点；概率校准与阈值选择是两个独立步骤。\n<\/li><li>\n<strong>边界<\/strong>：线性模型表达能力受限于线性组合；非线性关系需要特征变换或非线性模型（如第 5 章网络）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>线性回归 vs 对数几率回归<\/strong>：回归输出连续值、用平方损失，拟合条件均值；对数几率回归输出概率、用对数似然，拟合后验类别分布。\n<\/li><li>\n<strong>平方损失 vs 对数似然<\/strong>：平方损失对应高斯噪声假设；对数似然对应伯努利类别分布。分类套平方损失，自信判错时梯度被 Sigmoid 饱和区压平。\n<\/li><li>\n<strong>正规方程 vs 梯度下降<\/strong>：闭式解一步到位但受可逆条件与 <span class=\"katex-inline\">O(d^3)<\/span> 求逆代价限制；梯度下降逐轮逼近，超参数是学习率与批量大小，适合高维大数据。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的评估口径用于验收两类模型。后继：概念 c04 的 BP 算法沿用&quot;输出—损失—梯度—更新&quot;循环；概念 c11 的 L1/L2 正则化加在本节损失上；概念 c05 对偶问题的拉格朗日推导与本节矩阵梯度同属优化基础。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（线性模型：最小二乘正规方程、对数几率回归的对数似然与梯度）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：最小二乘正规方程、几何投影与对数几率回归梯度<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把线性模型两条求解路径讲透，往回追四层前提：<\/p>\n<ol><li>\n<strong>模型必须先写成矩阵形式<\/strong>。单样本公式无法支撑批量求导；需要设计矩阵 <span class=\"katex-inline\">X<\/span>、标签向量 <span class=\"katex-inline\">\\mathbf y<\/span> 与增广权重 <span class=\"katex-inline\">\\hat{\\mathbf w}<\/span> 的统一记号，才能对整组参数求梯度。\n<\/li><li>\n<strong>损失函数决定梯度形式<\/strong>。回归选平方损失，对应高斯噪声假设；分类选对数似然，对应伯努利类别分布。损失来源不同，导数结构不同。\n<\/li><li>\n<strong>闭式解存在以列满秩为条件<\/strong>。<span class=\"katex-inline\">X^\\top X<\/span> 可逆才能左乘逆矩阵；共线或高维小样本条件破坏，只能转正则化或迭代法。\n<\/li><li>\n<strong>迭代路径的步长由学习率或二阶信息控制<\/strong>。梯度下降按一阶梯度更新，牛顿法用 Hessian 逆修正步长；两者都从损失关于参数的梯度出发。\n<\/ol>\n<p>依赖链方向：线性模型定义 → 损失矩阵式 → 矩阵梯度展开 → 令梯度为零得正规方程（满秩条件）→ 对数几率后验与负对数似然 → 梯度/牛顿更新。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：写模型与增广设计矩阵<\/h3>\n<p><span class=\"katex-inline\">m<\/span> 个样本，<span class=\"katex-inline\">X\\in\\mathbb R^{m\\times(d+1)}<\/span>，每行 <span class=\"katex-inline\">\\hat{\\mathbf x}_i^\\top=(x_{i1},\\dots,x_{id},1)<\/span>，<span class=\"katex-inline\">\\mathbf y\\in\\mathbb R^m<\/span>，预测 <span class=\"katex-inline\">\\hat{\\mathbf y}=X\\hat{\\mathbf w}<\/span>，<span class=\"katex-inline\">\\hat{\\mathbf w}=(\\mathbf w;b)<\/span>。平方损失<\/p>\n<div class=\"katex-block\">E(\\hat{\\mathbf w})=\\sum_{i=1}^m(\\hat y_i-y_i)^2=(X\\hat{\\mathbf w}-\\mathbf y)^\\top(X\\hat{\\mathbf w}-\\mathbf y).<\/div>\n<h3>第二步：展开并对权重求梯度<\/h3>\n<p>展开被求导项：<\/p>\n<div class=\"katex-block\">E=\\hat{\\mathbf w}^\\top X^\\top X\\hat{\\mathbf w}-2\\mathbf y^\\top X\\hat{\\mathbf w}+\\mathbf y^\\top\\mathbf y.<\/div>\n<p>常数项 <span class=\"katex-inline\">\\mathbf y^\\top\\mathbf y<\/span> 对 <span class=\"katex-inline\">\\hat{\\mathbf w}<\/span> 梯度为零。一次项 <span class=\"katex-inline\">-2\\mathbf y^\\top X\\hat{\\mathbf w}<\/span> 是线性函数 <span class=\"katex-inline\">\\mathbf a^\\top\\hat{\\mathbf w}<\/span>，<span class=\"katex-inline\">\\mathbf a=X^\\top\\mathbf y<\/span>，梯度为 <span class=\"katex-inline\">-2X^\\top\\mathbf y<\/span>。二次项 <span class=\"katex-inline\">\\hat{\\mathbf w}^\\top X^\\top X\\hat{\\mathbf w}<\/span>，记 <span class=\"katex-inline\">A=X^\\top X<\/span> 对称，矩阵梯度公式 <span class=\"katex-inline\">\\nabla_{\\hat{\\mathbf w}}(\\hat{\\mathbf w}^\\top A\\hat{\\mathbf w})=2A\\hat{\\mathbf w}=2X^\\top X\\hat{\\mathbf w}<\/span>。合并：<\/p>\n<div class=\"katex-block\">\\nabla_{\\hat{\\mathbf w}}E=2X^\\top X\\hat{\\mathbf w}-2X^\\top\\mathbf y=2X^\\top(X\\hat{\\mathbf w}-\\mathbf y).<\/div>\n<h3>第三步：令梯度为零推正规方程<\/h3>\n<p><span class=\"katex-inline\">\\nabla E=0 \\Rightarrow X^\\top X\\hat{\\mathbf w}=X^\\top\\mathbf y<\/span>。若 <span class=\"katex-inline\">X^\\top X<\/span> 满秩或正定，两边左乘逆矩阵：<\/p>\n<div class=\"katex-block\">\\hat{\\mathbf w}^*=(X^\\top X)^{-1}X^\\top\\mathbf y.<\/div>\n<p>几何解释：<span class=\"katex-inline\">\\hat{\\mathbf y}=X\\hat{\\mathbf w}<\/span> 是列空间 <span class=\"katex-inline\">\\mathrm{col}(X)<\/span> 中的向量；正规方程等价于残差 <span class=\"katex-inline\">\\mathbf r=\\mathbf y-\\hat{\\mathbf y}<\/span> 与列空间正交，即 <span class=\"katex-inline\">X^\\top\\mathbf r=0<\/span>。解出的 <span class=\"katex-inline\">\\hat{\\mathbf y}<\/span> 是列空间中离 <span class=\"katex-inline\">\\mathbf y<\/span> 距离最近的点，这是正交投影在回归中的形式。<\/p>\n<h3>第四步：不满秩时的处理<\/h3>\n<p>样本数少于特征数，或特征间严格共线，<span class=\"katex-inline\">X^\\top X<\/span> 奇异，逆矩阵不存在。此时多个 <span class=\"katex-inline\">\\hat{\\mathbf w}<\/span> 都使平方误差最小，选择哪一个由归纳偏好决定：常见做法是在损失中加正则项（L2 得岭回归闭式解，L1 得稀疏解），或用梯度下降类迭代方法沿损失面逼近。数值上共线特征会使 <span class=\"katex-inline\">X^\\top X<\/span> 条件数变大，闭式解对噪声敏感。<\/p>\n<h3>第五步：对数几率回归的后验与似然<\/h3>\n<p>Sigmoid 函数 <span class=\"katex-inline\">\\sigma(z)=1/(1+e^{-z})<\/span>，性质 <span class=\"katex-inline\">\\sigma&#x27;(z)=\\sigma(z)(1-\\sigma(z))<\/span>。把线性输出送入 Sigmoid：<\/p>\n<div class=\"katex-block\">p(y=1|\\mathbf x)=\\sigma(\\beta^\\top\\hat{\\mathbf x}),\\quad p(y=0|\\mathbf x)=1-\\sigma(\\beta^\\top\\hat{\\mathbf x}).<\/div>\n<p>两式合并写 <span class=\"katex-inline\">p(y_i|\\hat{\\mathbf x}_i;\\beta)=\\hat y_i^{y_i}(1-\\hat y_i)^{1-y_i}<\/span>，其中 <span class=\"katex-inline\">\\hat y_i=\\sigma(\\beta^\\top\\hat{\\mathbf x}_i)<\/span>。对数似然<\/p>\n<div class=\"katex-block\">\\ell(\\beta)=\\sum_i\\big[y_i\\ln\\hat y_i+(1-y_i)\\ln(1-\\hat y_i)\\big].<\/div>\n<p>最大化 <span class=\"katex-inline\">\\ell<\/span> 等价于最小化负对数似然<\/p>\n<div class=\"katex-block\">E(\\beta)=-\\ell(\\beta)=\\sum_i\\big[-y_i\\beta^\\top\\hat{\\mathbf x}_i+\\ln(1+e^{\\beta^\\top\\hat{\\mathbf x}_i})\\big].<\/div>\n<h3>第六步：对参数求梯度<\/h3>\n<p>逐项对 <span class=\"katex-inline\">\\beta<\/span> 求导。第一项 <span class=\"katex-inline\">-y_i\\beta^\\top\\hat{\\mathbf x}_i<\/span> 的梯度为 <span class=\"katex-inline\">-y_i\\hat{\\mathbf x}_i<\/span>。第二项 <span class=\"katex-inline\">\\ln(1+e^{\\beta^\\top\\hat{\\mathbf x}_i})<\/span> 的导数：复合函数，内层梯度 <span class=\"katex-inline\">\\hat{\\mathbf x}_i<\/span>，外层导数 <span class=\"katex-inline\">e^{\\beta^\\top\\hat{\\mathbf x}_i}/(1+e^{\\beta^\\top\\hat{\\mathbf x}_i})=\\hat y_i<\/span>。合并第 <span class=\"katex-inline\">i<\/span> 项梯度 <span class=\"katex-inline\">\\hat{\\mathbf x}_i(\\hat y_i-y_i)<\/span>，整体<\/p>\n<div class=\"katex-block\">\\nabla_\\beta E=\\sum_i\\hat{\\mathbf x}_i(\\hat y_i-y_i).<\/div>\n<p>梯度下降按 <span class=\"katex-inline\">\\beta\\leftarrow\\beta-\\eta\\nabla_\\beta E<\/span> 更新。牛顿法利用二阶信息，第 <span class=\"katex-inline\">t+1<\/span> 轮<\/p>\n<div class=\"katex-block\">\\beta_{t+1}=\\beta_t-\\big(\\nabla^2 E(\\beta_t)\\big)^{-1}\\nabla E(\\beta_t),<\/div>\n<p>Hessian 为 <span class=\"katex-inline\">X^\\top WX<\/span>，<span class=\"katex-inline\">W<\/span> 是对角阵，对角元 <span class=\"katex-inline\">\\hat y_i(1-\\hat y_i)<\/span>；原书 3.3 节给出该迭代形式（PDF 第 73 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：一维两点最小二乘<\/h3>\n<p>样本 <span class=\"katex-inline\">(x,y)=(1,2)<\/span>、<span class=\"katex-inline\">(2,4)<\/span>。模型 <span class=\"katex-inline\">y=wx+b<\/span>，两点确定一条直线，最小二乘残差为零。正规方程：<span class=\"katex-inline\">\\sum x_i=3<\/span>，<span class=\"katex-inline\">\\sum x_i^2=5<\/span>，<span class=\"katex-inline\">\\sum y_i=6<\/span>，<span class=\"katex-inline\">\\sum x_i y_i=10<\/span>，方程组 <span class=\"katex-inline\">5w+3b=10<\/span>、<span class=\"katex-inline\">3w+2b=6<\/span>，解得 <span class=\"katex-inline\">w=2<\/span>，<span class=\"katex-inline\">b=0<\/span>，拟合 <span class=\"katex-inline\">\\hat y=2x<\/span>。<\/p>\n<h3>算例 2：二维设计矩阵<\/h3>\n<p>样本 <span class=\"katex-inline\">\\mathbf x=(1,1)<\/span> 标签 3，<span class=\"katex-inline\">\\mathbf x=(2,2)<\/span> 标签 6。<span class=\"katex-inline\">X=\\begin{pmatrix}1&amp;1&amp;1\\\\2&amp;2&amp;1\\end{pmatrix}<\/span>，<span class=\"katex-inline\">\\mathbf y=(3,6)^\\top<\/span>。<span class=\"katex-inline\">X^\\top X<\/span> 中前两列相同，矩阵不满秩：两个特征方向共线，闭式解不唯一。这正是高维小样本或共线场景的微型翻版；加 L2 正则后解被约束在小范数内，数值稳定。<\/p>\n<h3>算例 3：对数几率单步梯度<\/h3>\n<p>单样本 <span class=\"katex-inline\">\\hat{\\mathbf x}=(1,1)<\/span>，<span class=\"katex-inline\">y=1<\/span>，初始 <span class=\"katex-inline\">\\beta=(0,0)<\/span>，<span class=\"katex-inline\">\\hat y=\\sigma(0)=0.5<\/span>。梯度 <span class=\"katex-inline\">\\hat{\\mathbf x}(\\hat y-y)=(1,1)(-0.5)=(-0.5,-0.5)<\/span>。学习率 <span class=\"katex-inline\">\\eta=0.1<\/span>，更新 <span class=\"katex-inline\">\\beta\\leftarrow(0,0)-0.1(-0.5,-0.5)=(0.05,0.05)<\/span>。新一轮 <span class=\"katex-inline\">\\beta^\\top\\hat{\\mathbf x}=0.1<\/span>，<span class=\"katex-inline\">\\hat y=\\sigma(0.1)\\approx0.525<\/span>，误差从 <span class=\"katex-inline\">-0.5<\/span> 收到约 <span class=\"katex-inline\">-0.475<\/span>，沿减小判错概率的方向移动。<\/p>\n<h3>算例 4：平方损失与分类损失对照<\/h3>\n<p>样本标签 <span class=\"katex-inline\">y=1<\/span>，模型输出 <span class=\"katex-inline\">\\hat y<\/span>。平方损失项 <span class=\"katex-inline\">(\\hat y-1)^2<\/span>，导数 <span class=\"katex-inline\">2(\\hat y-1)<\/span>；交叉熵项 <span class=\"katex-inline\">-\\ln\\hat y<\/span>，导数 <span class=\"katex-inline\">-1/\\hat y<\/span>。当模型自信判错（<span class=\"katex-inline\">\\hat y\\to0<\/span> 而 <span class=\"katex-inline\">y=1<\/span>），交叉熵梯度趋于 <span class=\"katex-inline\">-1/0<\/span> 放大修正，平方损失导数趋于 <span class=\"katex-inline\">-2<\/span> 且经 Sigmoid 饱和后被压平；这是分类选对数似然而不选平方损失的直接原因。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong>平方损失的概率来源<\/strong>：假设 <span class=\"katex-inline\">y_i=\\mathbf w^\\top\\mathbf x_i+b+\\varepsilon_i<\/span>，<span class=\"katex-inline\">\\varepsilon_i\\sim\\mathcal N(0,\\sigma^2)<\/span> 独立高斯，样本似然取负对数后，常数项之外正是平方损失。换噪声分布就换损失函数：伯努利分布导出交叉熵，拉普拉斯噪声导出绝对值损失。\n<\/li><li>\n<strong>线性模型的归纳偏好<\/strong>：正规方程在所有使误差最小的解中取闭式对应点；正则项等价于对参数空间加先验约束。L2 先验对应高斯先验，L1 先验对应拉普拉斯先验，这一联系在概念 c11 展开。\n<\/li><li>\n<strong>概率输出与阈值判定分离<\/strong>：对数几率回归给后验估计，决策阈值可按业务偏好调整；检索场景放宽阈值提高查全率，推荐场景收紧阈值提高查准率，模型本身不需要重训。\n<\/ul>\n<h3>对数线性回归与线性模型谱系<\/h3>\n<p>若输出标记在指数尺度上变化，可令 <span class=\"katex-inline\">\\ln y=\\mathbf w^\\top\\mathbf x+b<\/span>，即对数线性回归（log-linear regression）；形式上仍是线性回归，实质上是输入到输出的非线性映射（原书 3.2 节，PDF 第 70 页）。线性模型谱系按输出变换展开：恒等变换得线性回归，Sigmoid 变换得对数几率回归，对数变换得对数线性回归；骨架都是线性组合加损失优化，差别在输出与噪声分布假设。<\/p>\n<h3>概率解释与损失选择的对应<\/h3>\n<p>平方损失对应高斯噪声假设：<span class=\"katex-inline\">y_i=\\mathbf w^\\top\\mathbf x_i+b+\\varepsilon_i<\/span>，<span class=\"katex-inline\">\\varepsilon_i\\sim\\mathcal N(0,\\sigma^2)<\/span>，负对数似然去掉常数即平方误差。伯努利类别分布导出交叉熵形式的对数似然。换噪声分布就换损失：拉普拉斯噪声导出绝对值损失，分类自信判错时交叉熵梯度不被饱和区压平。选损失先确认任务输出类型与噪声假设，不能在分类上套平方损失。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n<span class=\"katex-inline\">X^\\top X<\/span> 不满秩时正规方程为什么不能直接求逆？工程上有哪两条替代路径？\n<\/li><li>\n写出对数几率回归负对数似然对 <span class=\"katex-inline\">\\beta<\/span> 的梯度，说明它与线性回归残差梯度在结构上哪里相同、哪里不同。\n<\/li><li>\nSigmoid 导数性质 <span class=\"katex-inline\">\\sigma&#x27;(z)=\\sigma(z)(1-\\sigma(z))<\/span> 在 Hessian <span class=\"katex-inline\">X^\\top WX<\/span> 的对角元 <span class=\"katex-inline\">W_{ii}=\\hat y_i(1-\\hat y_i)<\/span> 中如何体现？\n<\/li><li>\n为什么分类任务自信判错时平方损失修正力度不足？把两种损失在 <span class=\"katex-inline\">\\hat y\\to0<\/span>、<span class=\"katex-inline\">y=1<\/span> 时的导数行为写出来对照。\n<\/ol><\/div><\/details>", "c03": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.89<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">线性模型：最小二乘正规方程、对数几率回归的对数似然与梯度<\/a><\/span><\/div><h1>决策树：信息增益、增益率、基尼指数与剪枝处理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：原书第 4 章决策树（PDF 第 87–100 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>线性模型给出的边界是超平面，只能划分按线性方向可分的数据；现实分类常需要&quot;先看色泽，再看根蒂&quot;这种逐级判断的嵌套规则。决策树（decision tree）把分类过程组织成树结构：内部结点对应属性测试，分支对应属性取值，叶结点给出类别标记。学习的核心困难是每一步选哪个属性切开当前样本集——划分后分支结点要尽量纯，同时不能把训练噪声当成规律。纯度度量准则与剪枝策略就是围绕这两点设计的。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>信息熵（information entropy）<\/strong>：样本集 <span class=\"katex-inline\">D<\/span> 中第 <span class=\"katex-inline\">k<\/span> 类比例 <span class=\"katex-inline\">p_k<\/span>，<span class=\"katex-inline\">\\mathrm{Ent}(D)=-\\sum_{k=1}^{|\\mathcal Y|}p_k\\log_2 p_k<\/span>。<span class=\"katex-inline\">\\mathrm{Ent}(D)<\/span> 越小纯度越高，最小值 0，样本越杂最大值越大（原书 4.2.1 节，PDF 第 89 页）。<\/p>\n<p><strong>信息增益（information gain）<\/strong>：离散属性 <span class=\"katex-inline\">a<\/span> 有 <span class=\"katex-inline\">V<\/span> 个取值，分支子集 <span class=\"katex-inline\">D^v<\/span>，<\/p>\n<div class=\"katex-block\">\\mathrm{Gain}(D,a)=\\mathrm{Ent}(D)-\\sum_{v=1}^{V}\\frac{|D^v|}{|D|}\\mathrm{Ent}(D^v).<\/div>\n<p>增益越大，按 <span class=\"katex-inline\">a<\/span> 划分带来的纯度提升越大；ID3 算法按信息增益选属性（原书 4.2.1 节，PDF 第 89 页）。<\/p>\n<p><strong>增益率（gain ratio）<\/strong>：C4.5 采用，<span class=\"katex-inline\">\\mathrm{Gain\\_ratio}(D,a)=\\mathrm{Gain}(D,a)/\\mathrm{IV}(a)<\/span>，固有值 <span class=\"katex-inline\">\\mathrm{IV}(a)=-\\sum_v |D^v|/|D|\\log_2(|D^v|/|D|)<\/span>，对取值数目多的属性做惩罚（原书 4.2.2 节，PDF 第 91 页前后）。<\/p>\n<p><strong>基尼值（Gini）<\/strong>：<span class=\"katex-inline\">\\mathrm{Gini}(D)=1-\\sum_k p_k^2<\/span>，反映随机抽两个样本类别不一致的概率；值越小纯度越高。属性 <span class=\"katex-inline\">a<\/span> 的基尼指数 <span class=\"katex-inline\">\\mathrm{Gini\\_index}(D,a)=\\sum_v |D^v|/|D|\\,\\mathrm{Gini}(D^v)<\/span>，CART 选基尼指数最小的属性（原书 4.2.3 节，PDF 第 93 页）。<\/p>\n<p><strong>剪枝（pruning）<\/strong>：预剪枝在划分前估计泛化性能，不能提升就停止划分；后剪枝先生成完整树，再自底向上把子树替换为叶结点考察是否保留（原书 4.3 节，PDF 第 93 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>以原书西瓜数据集 2.0 为例：根结点 17 个样本，好瓜与坏瓜混合。属性&quot;色泽&quot;分三个子集：<span class=\"katex-inline\">D^1<\/span>（青绿）6 个、<span class=\"katex-inline\">D^2<\/span>（乌黑）6 个、<span class=\"katex-inline\">D^3<\/span>（浅白）5 个。分别算各子集信息熵，按样本数加权回根结点熵，差值即色泽的信息增益。原书算得 <span class=\"katex-inline\">\\mathrm{Gain}(D,\\text{色泽})=0.109<\/span>，其余属性依次为根蒂 0.143、敲声 0.141、纹理 0.381、脐部 0.289、触感 0.006；纹理增益最大，被选为根结点划分属性（PDF 第 91 页）。<\/p>\n<p>基尼指数计算路径相同：先算各子集基尼值，按样本数加权，选加权基尼值最小的属性。基尼值与熵都刻画不纯度，区别在熵用对数、基尼用平方和，数值趋势一致。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：信息增益与增益率面向离散属性；连续值需先二分划分。树模型可处理类别不平衡下的分段规则，不要求特征尺度归一。\n<\/li><li>\n<strong>失败案例一：信息增益偏向取值数目多的属性<\/strong>。若把样本编号这类唯一标识属性纳入候选，每个分支只剩单个样本，子集熵为 0，信息增益最大但无泛化能力；增益率通过固有值惩罚多取值属性。\n<\/li><li>\n<strong>失败案例二：不剪枝的完全树<\/strong>。分支一直分到结点样本全对，训练误差为零，训练集噪声被逐叶记下；新样本扰动即走错分支，方差过大。\n<\/li><li>\n<strong>失败案例三：预剪枝过早停止<\/strong>。若当前划分单独看提升有限，但与后续划分组合后效果显著，预剪枝会砍掉这条有潜力的路径，偏差上升。\n<\/li><li>\n<strong>边界<\/strong>：单棵树对样本扰动敏感，小的样本变化可能长出结构不同的树；高维稀疏数据上树深容易失控。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>信息增益 vs 增益率 vs 基尼指数<\/strong>：增益偏向多取值属性；增益率用固有值修正这一偏向；基尼指数计算不涉及对数，数值上是平方和形式，CART 用于分类与回归树。\n<\/li><li>\n<strong>决策树 vs 线性模型<\/strong>：线性模型边界连续光滑，参数可解释为特征权重；树模型给出分段规则路径，可解释为属性合取规则，但边界是轴平行折线。\n<\/li><li>\n<strong>预剪枝 vs 后剪枝<\/strong>：预剪枝边生成边停止，计算开销小，可能欠拟合；后剪枝基于完整树回退，保留更多潜在结构，计算开销大，通常泛化更稳。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c02 的线性模型代表另一类决策边界；概念 c01 的过拟合与交叉验证是剪枝判断的依据。后继：概念 c08 集成学习把决策树作为基学习器，Bagging 与随机森林靠多棵树降低单树方差；概念 c11 中决策树划分属性集合本身就是一种嵌入式特征选择。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（决策树：信息增益、增益率、基尼指数与剪枝处理）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：纯度度量、三种划分准则与剪枝的偏差-方差对照<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把决策树划分准则讲透，往回追四层前提：<\/p>\n<ol><li>\n<strong>树划分要先定义&quot;纯&quot;的度量<\/strong>。没有不纯度指标，就无法比较两个属性谁切得好；信息熵从编码角度、基尼从随机抽样角度给出两种不纯度刻画。\n<\/li><li>\n<strong>单结点纯度要与划分后分支纯度衔接<\/strong>。加权平均分支熵才反映划分后的整体纯度，权重必须是各分支样本占比，否则样本多的分支被错估。\n<\/li><li>\n<strong>准则偏好需要修正<\/strong>。信息增益天然偏向取值数目多的属性，固有值 IV 度量属性自身的取值分散程度，增益率以此做分母修正。\n<\/li><li>\n<strong>结构复杂度要靠剪枝约束<\/strong>。划分准则只保证训练集纯度，不约束树深；预剪枝、后剪枝在生成过程与生成之后两个位置控制复杂度，对应偏差与方差的不同权衡。\n<\/ol>\n<p>依赖链方向：纯度度量定义 → 信息增益（加权分支熵）→ 增益率修正多取值偏好 → 基尼指数平行准则 → 剪枝控制过拟合。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：信息熵的定义与极值<\/h3>\n<p>设 <span class=\"katex-inline\">D<\/span> 含 <span class=\"katex-inline\">|\\mathcal Y|<\/span> 类，第 <span class=\"katex-inline\">k<\/span> 类比例 <span class=\"katex-inline\">p_k=n_k/|D|<\/span>。信息熵<\/p>\n<div class=\"katex-block\">\\mathrm{Ent}(D)=-\\sum_{k=1}^{|\\mathcal Y|}p_k\\log_2 p_k.<\/div>\n<p>约定 <span class=\"katex-inline\">p=0<\/span> 时 <span class=\"katex-inline\">p\\log_2 p=0<\/span>。两类情形下 <span class=\"katex-inline\">p<\/span> 与 <span class=\"katex-inline\">1-p<\/span> 对称：<span class=\"katex-inline\">p=0.5<\/span> 时熵最大为 1，<span class=\"katex-inline\">p=0<\/span> 或 1 时熵为 0。熵的单位是比特，可理解为编码类别所需平均编码长度；越杂需要越长编码，熵越大。<\/p>\n<h3>第二步：信息增益的加权结构<\/h3>\n<p>属性 <span class=\"katex-inline\">a<\/span> 取 <span class=\"katex-inline\">V<\/span> 个值，划分出 <span class=\"katex-inline\">D^1,\\dots,D^V<\/span>。划分后整体不纯度取分支熵按样本数加权：<\/p>\n<div class=\"katex-block\">\\mathrm{Ent}_{a}(D)=\\sum_{v=1}^{V}\\frac{|D^v|}{|D|}\\mathrm{Ent}(D^v).<\/div>\n<p>信息增益是划分前后熵的差：<\/p>\n<div class=\"katex-block\">\\mathrm{Gain}(D,a)=\\mathrm{Ent}(D)-\\mathrm{Ent}_{a}(D).<\/div>\n<p>权重 <span class=\"katex-inline\">|D^v|/|D|<\/span> 的依据：分支样本越多，它对整体纯度的影响越大；不加权会让小分支的熵被放大到与大分支同等地位。ID3 选 <span class=\"katex-inline\">a^*=\\arg\\max_{a\\in A}\\mathrm{Gain}(D,a)<\/span>。<\/p>\n<h3>第三步：增益率与固有值<\/h3>\n<p>信息增益的偏好来源：属性取值越多，每个分支越容易只剩单类样本，分支熵趋近 0，增益虚高。固有值<\/p>\n<div class=\"katex-block\">\\mathrm{IV}(a)=-\\sum_{v=1}^{V}\\frac{|D^v|}{|D|}\\log_2\\frac{|D^v|}{|D|}<\/div>\n<p>度量属性取值的分散程度：取值越多、越均匀，IV 越大。增益率<\/p>\n<div class=\"katex-block\">\\mathrm{Gain\\_ratio}(D,a)=\\frac{\\mathrm{Gain}(D,a)}{\\mathrm{IV}(a)}.<\/div>\n<p>C4.5 不直接选增益率最大者，而是先从信息增益高于平均水平的属性中再选增益率最高者，避免增益率反过来偏向取值少的属性（原书 4.2.2 节，PDF 第 91–92 页）。<\/p>\n<h3>第四步：基尼指数<\/h3>\n<p>基尼值反映随机抽取两个样本类别标记不一致的概率：<\/p>\n<div class=\"katex-block\">\\mathrm{Gini}(D)=\\sum_k\\sum_{k'\\neq k}p_k p_{k'}=1-\\sum_k p_k^2.<\/div>\n<p><span class=\"katex-inline\">p_k^2<\/span> 是抽中同类的概率，取 1 减同类概率即不一致概率。属性 <span class=\"katex-inline\">a<\/span> 的基尼指数<\/p>\n<div class=\"katex-block\">\\mathrm{Gini\\_index}(D,a)=\\sum_v\\frac{|D^v|}{|D|}\\mathrm{Gini}(D^v),<\/div>\n<p>CART 选 <span class=\"katex-inline\">a^*=\\arg\\min_{a\\in A}\\mathrm{Gini\\_index}(D,a)<\/span>。与熵对照：基尼用平方和、计算不涉及对数，两类分布下基尼曲线与熵曲线单调一致，选属性结论通常接近。<\/p>\n<h3>第五步：剪枝的两条路径<\/h3>\n<p>预剪枝：每个结点划分前，先用交叉验证估计划分前后泛化性能；划分不能带来提升，就把当前结点标为叶结点，停止向下。后剪枝：先按准则长出完整决策树，再自底向上考察每个非叶结点，把子树替换成叶结点若泛化性能不降则替换。预剪枝在生成中截断，后剪枝在生成后回退；前者省计算、易欠拟合，后者保留更多结构、计算开销大。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：自拟六样本集<\/h3>\n<p><span class=\"katex-inline\">D<\/span> 含 6 个样本，正例 3、反例 3：<span class=\"katex-inline\">p_+=p_-=0.5<\/span>。根结点熵<\/p>\n<div class=\"katex-block\">\\mathrm{Ent}(D)=-0.5\\log_2 0.5-0.5\\log_2 0.5=1.000.<\/div>\n<p>属性 <span class=\"katex-inline\">a<\/span> 分两支：<span class=\"katex-inline\">D^1<\/span> 含 4 个样本（3 正 1 反），<span class=\"katex-inline\">D^2<\/span> 含 2 个样本（0 正 2 反）。<\/p>\n<ul><li>\n<span class=\"katex-inline\">\\mathrm{Ent}(D^1)=-\\frac34\\log_2\\frac34-\\frac14\\log_2\\frac14\\approx0.811<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">\\mathrm{Ent}(D^2)=0<\/span>（纯反例）；\n<\/li><li>\n加权分支熵 <span class=\"katex-inline\">\\frac46\\times0.811+\\frac26\\times0\\approx0.541<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">\\mathrm{Gain}(D,a)=1.000-0.541=0.459<\/span>。\n<\/ul>\n<h3>算例 2：同数据集基尼对照<\/h3>\n<p><span class=\"katex-inline\">\\mathrm{Gini}(D)=1-(0.5^2+0.5^2)=0.5<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">\\mathrm{Gini}(D^1)=1-((3/4)^2+(1/4)^2)=0.375<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">\\mathrm{Gini}(D^2)=0<\/span>；\n<\/li><li>\n加权基尼指数 <span class=\"katex-inline\">\\frac46\\times0.375+\\frac26\\times0=0.250<\/span>。\n<p>另一属性 <span class=\"katex-inline\">b<\/span> 若两支各 3 个、均为 2 正 1 反，加权基尼 <span class=\"katex-inline\">1-((2/3)^2+(1/3)^2)\\approx0.444<\/span>，高于 0.250，按基尼准则选 <span class=\"katex-inline\">a<\/span>。<\/p>\n<\/ul>\n<h3>算例 3：多取值属性的增益虚高<\/h3>\n<p>属性 <span class=\"katex-inline\">c<\/span> 是样本编号，6 个取值各含 1 个样本。每个分支熵为 0，加权分支熵为 0，<span class=\"katex-inline\">\\mathrm{Gain}(D,c)=1.000<\/span>，高于算例 1 的 0.459。但编号与类别无泛化关系：训练集内完美划分，新样本编号从未见过，无法判定。增益率分母 <span class=\"katex-inline\">\\mathrm{IV}(c)=-6\\times(1/6)\\log_2(1/6)=\\log_2 6\\approx2.585<\/span>，增益率 <span class=\"katex-inline\">1/2.585\\approx0.387<\/span>，与其他属性比较时不再占优。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong>ID3、C4.5、CART 的谱系<\/strong>：ID3 用信息增益，只能处理离散属性；C4.5 改用增益率并支持连续值二分；CART 用基尼指数（分类）或平方误差（回归），二叉树结构。三条谱系共享&quot;递归划分、纯度下降&quot;的骨架，差别在准则与分裂形式。\n<\/li><li>\n<strong>连续属性处理<\/strong>：把连续值排序后取相邻分界点，按候选二分点计算增益，选最优划分点；一个连续属性可在后续结点再次使用，这与离散属性只在当前结点分裂不同（原书 4.4 节前后，转述）。\n<\/li><li>\n<strong>树模型的可解释性边界<\/strong>：从根到叶的路径是一条属性合取规则，单条路径可读；但整棵树的规则集合相互重叠，整体复杂度未必低于线性模型。特征重要性可由各属性带来的增益或基尼下降累加得到。\n<\/ul>\n<h3>算例 4：剪枝前后的指标对照<\/h3>\n<p>设完整树在训练集误差 0.02、测试集误差 0.31；某非叶结点替换为叶结点后，训练集误差升到 0.05，测试集误差降到 0.22。后剪枝考察该结点：子树保留时测试误差 0.31，替换后 0.22，泛化不降反升，执行替换。预剪枝视角下，若在该结点划分前用验证集估计，划分后验证误差从 0.24 变 0.26，不能提升，即停止；两种策略在这个结点上结论可能不同，差别来自预剪枝看不到后续组合收益。<\/p>\n<h3>剪枝与偏差-方差的对应<\/h3>\n<p>完全树方差项大：训练集换一批样本，叶结点归属就可能改变，预测摆动剧烈。预剪枝强制树深受限，模型容量下降，偏差项上升；欠剪枝保留过多分支，方差项上升。后剪枝从完整树出发回退，相当于在偏差-方差曲线上按验证误差选点，通常比预剪枝更接近折中位置，代价是生成阶段先付出完整树的训练成本。测试集只用于最终验收，剪枝判断应基于交叉验证或独立验证集，不能拿测试集挑剪枝方案。<\/p>\n<h3>准则选择对数值稳定性的影响<\/h3>\n<p>熵含对数运算，<span class=\"katex-inline\">p<\/span> 接近 0 时 <span class=\"katex-inline\">p\\log_2 p<\/span> 约定为 0；实现中需先截断概率避免 <span class=\"katex-inline\">\\log 0<\/span>。基尼指数为平方和，运算量更小，对概率尺度不敏感。两类准则在二分类上排序相关：若属性 <span class=\"katex-inline\">a<\/span> 按熵准则优于 <span class=\"katex-inline\">b<\/span>，按基尼准则多数情形结论一致；多分类、样本极不平衡时，两者可能在边界属性上给出不同排序，此时应回到验证集指标选择。<\/p>\n<h3>算例 5：熵与基尼在不同混合度下的对照<\/h3>\n<p>设子集正例比例 <span class=\"katex-inline\">p<\/span>，反例 <span class=\"katex-inline\">1-p<\/span>。<span class=\"katex-inline\">p=0.5<\/span>：熵 <span class=\"katex-inline\">=1.000<\/span>，基尼 <span class=\"katex-inline\">=0.500<\/span>；<span class=\"katex-inline\">p=0.8<\/span>：熵 <span class=\"katex-inline\">=-0.8\\log_20.8-0.2\\log_20.2\\approx0.722<\/span>，基尼 <span class=\"katex-inline\">=1-0.64-0.04=0.320<\/span>；<span class=\"katex-inline\">p=0.95<\/span>：熵 <span class=\"katex-inline\">\\approx0.286<\/span>，基尼 <span class=\"katex-inline\">=0.0975<\/span>。三者都在 <span class=\"katex-inline\">p=0.5<\/span> 取最大、纯集取 0，曲线单调方向一致；基尼数值压缩幅度更大，对中等混合度差异不如熵敏感。选属性时两者排序通常一致，分歧多出现在边界属性上，以验证集指标定夺。<\/p>\n<h3>树深与样本规模的关系<\/h3>\n<p>完全二叉树每层分裂使分支数翻倍，<span class=\"katex-inline\">h<\/span> 层树最多容纳 <span class=\"katex-inline\">2^h<\/span> 个叶结点；要把 <span class=\"katex-inline\">m<\/span> 个训练样本全部分对，叶结点数至少 <span class=\"katex-inline\">m<\/span>，树深至少 <span class=\"katex-inline\">\\log_2 m<\/span>。样本噪声越多，维持训练完美所需的分支越细，树深随之增长。预剪枝限制最大深度，等价于在偏差-方差曲线上向低方差侧移动；后剪枝回退子树则是在完整树基础上删除冗余分支。评估剪枝效果必须用交叉验证折内的验证样本，不能拿训练集纯度判断剪枝好坏——训练集纯度随剪枝必然下降，泛化是否改善要在未见样本上看。<\/p>\n<h3>连续属性的二分划分<\/h3>\n<p>连续属性取值排序后，相邻取值之间构成候选分界点；对每个候选点算两侧子集的增益或基尼下降，选最优分界点。与离散属性不同，连续属性可在后续结点再次参与分裂。分裂后每个子集内只剩该属性一侧样本，递归继续。若连续属性与标记单调相关，二分点倾向落在两类样本交界位置；若关系非线性，单个二分点不足，需要多个结点分段刻画。<\/p>\n<h3>划分准则与模型复杂度<\/h3>\n<p>信息增益、增益率、基尼指数都在回答同一问题：当前属性切开后分支纯度提升多少。准则只决定选属性，不约束树深；防止过拟合仍要靠剪枝或早停。同一数据集换不同准则，根结点选择通常接近，分歧多在取值关系复杂的边界属性上。实现熵约定 <span class=\"katex-inline\">p=0<\/span> 时 <span class=\"katex-inline\">p\\log_2p=0<\/span>，数值上先截断概率避免对数零值。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n信息增益公式中分支权重 <span class=\"katex-inline\">|D^v|/|D|<\/span> 去掉会怎样？举一个大小分支悬殊的例子说明偏差方向。\n<\/li><li>\n增益率为什么用 IV 做分母？为什么 C4.5 不直接选增益率最大的属性，而要先筛信息增益高于平均者？\n<\/li><li>\n两类分布下写出基尼值与熵的表达式，比较 <span class=\"katex-inline\">p=0.5<\/span> 与 <span class=\"katex-inline\">p=0.9<\/span> 时两者的数值大小关系。\n<\/li><li>\n预剪枝可能在什么情形下造成高偏差？后剪枝又在什么情形下计算开销失控？各举一个数据场景。\n<\/ol><\/div><\/details>", "c04": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.116<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">线性模型：最小二乘正规方程、对数几率回归的对数似然与梯度<\/a><\/span><\/div><h1>多层前馈神经网络与误差逆传播：链式法则、连接权梯度与更新规则<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：原书第 5 章神经网络（PDF 第 113–119 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>单层感知机只能划分线性可分数据，异或这类问题无法解决。多层前馈网络在输入与输出之间加入隐层神经元，靠非线性激活扩大表达能力；困难在于隐层参数不直接对接输出误差，训练信号要从输出端逐层传回。误差逆传播（error BackPropagation，BP）算法解决的就是&quot;多层网络里每个连接权该往哪个方向调、调多少&quot;的问题：基于梯度下降，把输出误差沿连接路径反向拆成各层参数的梯度。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>多层前馈网络（multi-layer feedforward neural networks）<\/strong>：输入层接收外界输入，隐层与输出层包含功能神经元，拓扑不含环或回路；输入层不做函数处理，信号单向向前（原书 5.2 节，PDF 第 115 页）。<\/p>\n<p><strong>连接权与阈值<\/strong>：神经元之间的连接强度称连接权（connection weight），每个功能神经元带一个阈值；网络学到的内容蕴涵在连接权与阈值中。<\/p>\n<p><strong>激活函数<\/strong>：隐层与输出层常用 Sigmoid 函数 <span class=\"katex-inline\">f(z)=1/(1+e^{-z})<\/span>，导数满足 <span class=\"katex-inline\">f&#x27;(z)=f(z)(1-f(z))<\/span>。<\/p>\n<p><strong>单样本均方误差<\/strong>：训练例 <span class=\"katex-inline\">(\\mathbf x_k,\\mathbf y_k)<\/span>，网络输出 <span class=\"katex-inline\">\\hat{\\mathbf y}_k=(\\hat y_{k1},\\dots,\\hat y_{kl})<\/span>，<span class=\"katex-inline\">E_k=\\frac12\\sum_{j=1}^l(\\hat y_{kj}-y_{kj})^2<\/span>，系数 <span class=\"katex-inline\">1/2<\/span> 为求导便利（原书 5.3 节，PDF 第 116 页）。<\/p>\n<p><strong>更新规则<\/strong>：BP 基于梯度下降，任意参数 <span class=\"katex-inline\">v<\/span> 按 <span class=\"katex-inline\">v\\leftarrow v+\\Delta v<\/span> 更新，<span class=\"katex-inline\">\\Delta v=-\\eta\\,\\partial E_k/\\partial v<\/span>，<span class=\"katex-inline\">\\eta<\/span> 为学习率。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>记隐层第 <span class=\"katex-inline\">h<\/span> 个神经元输出 <span class=\"katex-inline\">b_h<\/span>，输出层第 <span class=\"katex-inline\">j<\/span> 个输入 <span class=\"katex-inline\">\\beta_j=\\sum_h\\omega_{hj}b_h<\/span>，输出 <span class=\"katex-inline\">\\hat y_j=f(\\beta_j-\\theta_j)<\/span>。对连接权 <span class=\"katex-inline\">\\omega_{hj}<\/span> 求偏导，按链式法则拆三段：<\/p>\n<div class=\"katex-block\">\\frac{\\partial E}{\\partial\\omega_{hj}}=\\frac{\\partial E}{\\partial\\hat y_j}\\frac{\\partial\\hat y_j}{\\partial\\beta_j}\\frac{\\partial\\beta_j}{\\partial\\omega_{hj}}.<\/div>\n<p>第一段 <span class=\"katex-inline\">\\partial E/\\partial\\hat y_j=\\hat y_j-y_j<\/span>；第二段由 Sigmoid 导数得 <span class=\"katex-inline\">\\hat y_j(1-\\hat y_j)<\/span>；第三段 <span class=\"katex-inline\">\\partial\\beta_j/\\partial\\omega_{hj}=b_h<\/span>。记输出层误差项 <span class=\"katex-inline\">g_j=\\hat y_j(1-\\hat y_j)(\\hat y_j-y_j)<\/span>，则 <span class=\"katex-inline\">\\Delta\\omega_{hj}=-\\eta g_j b_h<\/span>。<\/p>\n<p>隐层连接权的梯度要把 <span class=\"katex-inline\">g_j<\/span> 经 <span class=\"katex-inline\">\\omega_{hj}<\/span> 回传：隐层误差项 <span class=\"katex-inline\">e_h=b_h(1-b_h)\\sum_j\\omega_{hj}g_j<\/span>，再按与输出层同形的规则更新输入层到隐层的连接权。整条链每一步只用本地偏导数，不需要对网络整体写闭合导数。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：BP 要求激活函数可微（Sigmoid 满足）；样本可按批量或单样本估计梯度；参数初始化非对称，否则同层神经元学到相同变换。\n<\/li><li>\n<strong>失败案例一：学习率过大<\/strong>。更新步长越过损失面低点，在两侧震荡，误差不降反升；过小则收敛轮次拉长。\n<\/li><li>\n<strong>失败案例二：隐层误差不回传<\/strong>。只更新输出层权重，隐层连接权保持初值，网络退化为固定随机特征加单层分类器，欠拟合。\n<\/li><li>\n<strong>失败案例三：饱和区梯度消失<\/strong>。Sigmoid 输入过大或过小时输出趋近 0 或 1，导数趋于 0，误差项被压平，深层参数长期不动。\n<\/li><li>\n<strong>边界<\/strong>：BP 找到的是局部极小，不保证全局最优；网络容量过大时训练误差低而测试误差高，需配合正则化与早停。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>BP 规则 vs 感知机学习规则<\/strong>：感知机只按当前样本误分类调整权重；BP 在多层网络上沿链式法则回传误差，输出层与隐层分别构造误差项，更新式同形但信号来源不同。\n<\/li><li>\n<strong>前馈 vs 反馈<\/strong>：前馈指拓扑无环、信号单向；反馈网络存在回路。BP 描述的是训练时误差反向传播，不改变前馈拓扑。\n<\/li><li>\n<strong>单隐层 vs 多隐层<\/strong>：单隐层网络可拟合连续函数（在宽隐层条件下）；多隐层逐层组合特征，表达复杂层次结构，训练难度也随深度上升。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c02 的线性模型与损失梯度是单层版本；概念 c01 的交叉验证用于判断网络是否过拟合。后继：概念 c05 的 SVM 以最大间隔替代误差反向调整边界；概念 c08 的集成学习可把 BP 网络作为个体学习器；深层网络的梯度消失问题在概念 c10 降维与后续深度学习内容中再次出现。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（多层前馈神经网络与误差逆传播：链式法则、连接权梯度与更新规则）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：BP 前向计算、误差项构造与两层权重更新手算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把 BP 算法讲透，往回追四层前提：<\/p>\n<ol><li>\n<strong>先定网络结构与记号<\/strong>。输入维度 <span class=\"katex-inline\">d<\/span>、隐层神经元数 <span class=\"katex-inline\">q<\/span>、输出维度 <span class=\"katex-inline\">l<\/span>，连接权分输入到隐层、隐层到输出两组，阈值分隐层与输出层两组；记号不定，链式法则无法落到具体参数。\n<\/li><li>\n<strong>前向计算必须先于反向求导<\/strong>。误差是输出的函数，要算输出层梯度，先算出隐层输出 <span class=\"katex-inline\">b_h<\/span> 与网络输出 <span class=\"katex-inline\">\\hat y_j<\/span>；反向传播依赖前向留存的中间量。\n<\/li><li>\n<strong>误差按链式法则逐层拆<\/strong>。复合函数求导沿计算图分段，每段本地偏导数相乘；输出层误差项由损失导数与激活导数合成，隐层误差项再把上层误差加权回传。\n<\/li><li>\n<strong>更新方向由负梯度决定<\/strong>。学习率控制步长，参数更新式与感知机规则同形，差别在误差项的构造路径。\n<\/ol>\n<p>依赖链方向：网络结构 → 前向留存中间量 → 单样本均方误差 → 输出层误差项 <span class=\"katex-inline\">g_j<\/span> → 隐层误差项 <span class=\"katex-inline\">e_h<\/span> → 两组连接权与阈值更新。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：记号与前向计算<\/h3>\n<p>输入 <span class=\"katex-inline\">\\mathbf x=(x_1,\\dots,x_d)<\/span>，隐层第 <span class=\"katex-inline\">h<\/span> 个神经元输入 <span class=\"katex-inline\">\\alpha_h=\\sum_{i=1}^d v_{ih}x_i<\/span>，输出 <span class=\"katex-inline\">b_h=f(\\alpha_h-\\gamma_h)<\/span>，<span class=\"katex-inline\">\\gamma_h<\/span> 为隐层阈值。输出层第 <span class=\"katex-inline\">j<\/span> 个神经元输入 <span class=\"katex-inline\">\\beta_j=\\sum_{h=1}^q\\omega_{hj}b_h<\/span>，输出<\/p>\n<div class=\"katex-block\">\\hat y_j=f(\\beta_j-\\theta_j),<\/div>\n<p><span class=\"katex-inline\">\\theta_j<\/span> 为输出层阈值。<span class=\"katex-inline\">f<\/span> 取 Sigmoid，<span class=\"katex-inline\">f&#x27;(z)=f(z)(1-f(z))<\/span>。<\/p>\n<h3>第二步：单样本损失<\/h3>\n<div class=\"katex-block\">E_k=\\frac12\\sum_{j=1}^l(\\hat y_{kj}-y_{kj})^2.<\/div>\n<p>系数 <span class=\"katex-inline\">1/2<\/span> 与平方求导的 2 抵消，后续误差项不再带系数。<\/p>\n<h3>第三步：输出层连接权梯度<\/h3>\n<p>对 <span class=\"katex-inline\">\\omega_{hj}<\/span> 求偏导，链式拆三段：<\/p>\n<div class=\"katex-block\">\\frac{\\partial E_k}{\\partial\\omega_{hj}}=\\underbrace{(\\hat y_j-y_j)}_{\\partial E/\\partial\\hat y_j}\\underbrace{\\hat y_j(1-\\hat y_j)}_{\\partial\\hat y_j/\\partial\\beta_j}\\underbrace{b_h}_{\\partial\\beta_j/\\partial\\omega_{hj}}.<\/div>\n<p>定义输出层误差项<\/p>\n<div class=\"katex-block\">g_j=\\hat y_j(1-\\hat y_j)(\\hat y_j-y_j),<\/div>\n<p>则 <span class=\"katex-inline\">\\partial E_k/\\partial\\omega_{hj}=g_j b_h<\/span>，更新<\/p>\n<div class=\"katex-block\">\\Delta\\omega_{hj}=-\\eta g_j b_h,\\quad \\omega_{hj}\\leftarrow\\omega_{hj}+\\Delta\\omega_{hj}.<\/div>\n<p>输出层阈值 <span class=\"katex-inline\">\\theta_j<\/span> 的梯度只缺 <span class=\"katex-inline\">b_h<\/span> 这一段：<span class=\"katex-inline\">\\partial E_k/\\partial\\theta_j=-g_j<\/span>，更新 <span class=\"katex-inline\">\\Delta\\theta_j=\\eta g_j<\/span>。<\/p>\n<h3>第四步：隐层误差项与隐层权梯度<\/h3>\n<p>隐层神经元 <span class=\"katex-inline\">h<\/span> 连接到所有输出层神经元。误差经 <span class=\"katex-inline\">\\omega_{hj}<\/span> 回传到 <span class=\"katex-inline\">h<\/span> 的总量为 <span class=\"katex-inline\">\\sum_j\\omega_{hj}g_j<\/span>，乘隐层激活导数 <span class=\"katex-inline\">b_h(1-b_h)<\/span>，得隐层误差项<\/p>\n<div class=\"katex-block\">e_h=b_h(1-b_h)\\sum_{j=1}^l\\omega_{hj}g_j.<\/div>\n<p>输入到隐层连接权 <span class=\"katex-inline\">v_{ih}<\/span> 的梯度 <span class=\"katex-inline\">\\partial E_k/\\partial v_{ih}=e_h x_i<\/span>，更新<\/p>\n<div class=\"katex-block\">\\Delta v_{ih}=-\\eta e_h x_i,\\quad v_{ih}\\leftarrow v_{ih}+\\Delta v_{ih}.<\/div>\n<p>隐层阈值 <span class=\"katex-inline\">\\gamma_h<\/span> 梯度为 <span class=\"katex-inline\">-e_h<\/span>，更新 <span class=\"katex-inline\">\\Delta\\gamma_h=\\eta e_h<\/span>。<\/p>\n<h3>第五步：批量与单样本口径<\/h3>\n<p>单样本 BP 用当前例估计梯度；批量 BP 把整批样本误差梯度累加后更新。批量梯度方向稳定但每轮计算量大，单样本更新频繁、梯度带噪声；小批量折中两者。原书 5.3 节以单样本推导，算法可推广到批量口径（PDF 第 116 页前后）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：2–2–1 网络前向<\/h3>\n<p>设输入 <span class=\"katex-inline\">(x_1,x_2)=(1,0)<\/span>，标签 <span class=\"katex-inline\">y=1<\/span>。初始权值：<span class=\"katex-inline\">v_{11}=0.2,v_{21}=-0.1,v_{12}=-0.3,v_{22}=0.4<\/span>，隐层阈值 <span class=\"katex-inline\">\\gamma_1=\\gamma_2=0<\/span>；输出层 <span class=\"katex-inline\">\\omega_{11}=0.5,\\omega_{21}=-0.2<\/span>，<span class=\"katex-inline\">\\theta_1=0<\/span>。<\/p>\n<ul><li>\n隐层输入 <span class=\"katex-inline\">\\alpha_1=0.2\\times1+(-0.1)\\times0=0.2<\/span>，<span class=\"katex-inline\">b_1=\\sigma(0.2)\\approx0.550<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">\\alpha_2=-0.3\\times1+0.4\\times0=-0.3<\/span>，<span class=\"katex-inline\">b_2=\\sigma(-0.3)\\approx0.426<\/span>；\n<\/li><li>\n输出输入 <span class=\"katex-inline\">\\beta=0.5\\times0.550+(-0.2)\\times0.426\\approx0.190<\/span>，<span class=\"katex-inline\">\\hat y=\\sigma(0.190)\\approx0.547<\/span>。\n<p>误差 <span class=\"katex-inline\">E=\\frac12(0.547-1)^2\\approx0.105<\/span>。<\/p>\n<\/ul>\n<h3>算例 2：输出层误差与权更新<\/h3>\n<p>输出误差项 <span class=\"katex-inline\">g_1=\\hat y(1-\\hat y)(\\hat y-y)=0.547\\times0.453\\times(-0.453)\\approx-0.112<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">\\Delta\\omega_{11}=-\\eta g_1 b_1<\/span>，取 <span class=\"katex-inline\">\\eta=0.5<\/span>：<span class=\"katex-inline\">-0.5\\times(-0.112)\\times0.550\\approx0.031<\/span>，<span class=\"katex-inline\">\\omega_{11}\\leftarrow0.531<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">\\Delta\\omega_{21}=-0.5\\times(-0.112)\\times0.426\\approx0.024<\/span>，<span class=\"katex-inline\">\\omega_{21}\\leftarrow-0.176<\/span>。\n<\/ul>\n<h3>算例 3：隐层误差回传<\/h3>\n<p>回传到隐层 1 的量 <span class=\"katex-inline\">\\omega_{11}g_1=0.5\\times(-0.112)=-0.056<\/span>；隐层误差项 <span class=\"katex-inline\">e_1=b_1(1-b_1)(-0.056)=0.550\\times0.450\\times(-0.056)\\approx-0.0139<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">\\Delta v_{11}=-\\eta e_1 x_1=-0.5\\times(-0.0139)\\times1\\approx0.0070<\/span>，<span class=\"katex-inline\">v_{11}\\leftarrow0.207<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">\\Delta v_{21}=-\\eta e_1 x_2=0<\/span>，<span class=\"katex-inline\">x_2=0<\/span> 时该权不更新。\n<p>隐层 2 回传量 <span class=\"katex-inline\">\\omega_{21}g_1=(-0.2)\\times(-0.112)=0.0224<\/span>，<span class=\"katex-inline\">e_2=0.426\\times0.574\\times0.0224\\approx0.0055<\/span>，同规则更新。<\/p>\n<\/ul>\n<h3>算例 4：饱和区梯度量级<\/h3>\n<p>若隐层输出 <span class=\"katex-inline\">b_h\\approx0.98<\/span>，激活导数 <span class=\"katex-inline\">b_h(1-b_h)\\approx0.0196<\/span>；误差项经此因子后被压到原来的约 2%。深层网络连乘多个饱和因子，梯度逐层趋零，参数更新近乎停滞，这是梯度消失的直接数值表现。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong>局部极小与鞍点<\/strong>：BP 沿负梯度下降，损失面非凸，收敛点可能是局部极小；高维空间中大面积鞍点比孤立局部极小更常见，梯度在鞍点附近趋零但不处于谷底。初始化、动量与批量噪声用于跳出平缓区域。\n<\/li><li>\n<strong>参数对称性破坏<\/strong>：若同一隐层神经元初始权值相同，更新后仍相同，等价于一个神经元；初始化取小随机值打破对称，各隐单元才能学到不同特征。\n<\/li><li>\n<strong>与正则化的衔接<\/strong>：误差项控制拟合训练集，权重衰减、早停控制复杂度；BP 本身只负责下降训练损失，泛化要靠概念 c01 的验证口径与概念 c11 的正则手段。\n<\/ul>\n<h3>算例 5：批量口径下的梯度累加<\/h3>\n<p>批量 <span class=\"katex-inline\">B<\/span> 含 <span class=\"katex-inline\">n_B<\/span> 个样本，损失 <span class=\"katex-inline\">E=\\frac1{2n_B}\\sum_{k\\in B}\\sum_j(\\hat y_{kj}-y_{kj})^2<\/span>。对 <span class=\"katex-inline\">\\omega_{hj}<\/span> 的批量梯度<\/p>\n<div class=\"katex-block\">\\frac{\\partial E}{\\partial\\omega_{hj}}=\\frac1{n_B}\\sum_{k\\in B}g_{kj}b_{kh},<\/div>\n<p>即各样本输出层误差项按隐层输出平均。批量梯度方向是单样本梯度的平均，波动小于单样本更新；每轮要缓存整批中间量，内存占用随批量增长。小批量在两者之间折中：批量太小梯度噪声大，批量太大方向稳定但单轮计算重。<\/p>\n<h3>阈值更新与连接权的差别<\/h3>\n<p>输出层阈值 <span class=\"katex-inline\">\\theta_j<\/span>：梯度 <span class=\"katex-inline\">\\partial E/\\partial\\theta_j=-g_j<\/span>，更新 <span class=\"katex-inline\">\\Delta\\theta_j=\\eta g_j<\/span>。隐层阈值 <span class=\"katex-inline\">\\gamma_h<\/span>：梯度 <span class=\"katex-inline\">-e_h<\/span>，更新 <span class=\"katex-inline\">\\Delta\\gamma_h=\\eta e_h<\/span>。阈值不乘输入或隐层输出，只接收误差项本身；连接权之所以多乘 <span class=\"katex-inline\">b_h<\/span> 或 <span class=\"katex-inline\">x_i<\/span>，是因为输入侧变量进入该层净输入。实现时阈值可并入连接权向量，增广一列恒为 1 的输入，更新规则与权重一致。<\/p>\n<h3>局部极小、鞍点与初始化<\/h3>\n<p>损失关于网络参数非凸：多层复合后参数空间存在多个局部极小。高维空间中鞍点比孤立谷底更常见，梯度在鞍点邻域趋近零但不处于最低处。初始化取小随机值打破对称：若同一隐层神经元初始权值相同，经过相同更新后仍相同，等价于一个神经元，隐层宽度被浪费。He 或 Xavier 初始化按输入输出维度控制权重方差，使前向激活量级、反向梯度量级都维持在 1 附近；初始化只定起点，训练中的分布漂移还要靠归一化与正则化补充。<\/p>\n<h3>学习率与更新轨迹<\/h3>\n<p>学习率 <span class=\"katex-inline\">\\eta<\/span> 决定每步沿负梯度移动的尺度。损失面曲率大的方向，步长过大易越过谷底来回震荡；曲率小的方向，步长过小则移动缓慢。实践中先用小 <span class=\"katex-inline\">\\eta<\/span> 观察训练损失下行趋势，出现震荡再下调；批量梯度下降在凸损失面上收敛到全局极小，非凸面只能保证到达某个驻点。动量法累积历史梯度抵消单步翻转，Adam 按一阶、二阶矩逐坐标缩放，都是在 SGD 更新骨架上叠加状态估计。<\/p>\n<h3>网络容量与层数对照<\/h3>\n<p>单隐层网络在隐层足够宽的条件下可逼近连续函数；多隐层逐层组合特征，表达层次结构，但训练难度随深度上升。层数增加带来更多参数与更长梯度链，局部极小、饱和、初始化问题同步放大。BP 只负责沿损失下降，泛化要靠验证集监控、权重衰减与早停配合；网络结构选择与第 2 章偏差-方差权衡是同一套判断。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出输出层误差项 <span class=\"katex-inline\">g_j<\/span> 三段乘积各自对应链式法则的哪一段，激活导数在哪一步进入。\n<\/li><li>\n隐层误差项 <span class=\"katex-inline\">e_h<\/span> 为什么要对所有输出层误差按连接权加权求和？只取一个输出会漏掉什么？\n<\/li><li>\n单样本 BP 与批量 BP 在梯度方向、计算量、收敛轨迹上有何差别？小批量折中了哪两端？\n<\/li><li>\n隐层输出趋近 0 或 1 时误差项被哪个因子压平？写出该因子表达式并说明深层连乘后果。\n<\/ol><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.136<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">多层前馈神经网络与误差逆传播：链式法则、连接权梯度与更新规则<\/a><\/span><\/div><h1>支持向量机：间隔最大化、拉格朗日对偶、KKT 条件与支持向量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：原书第 6 章支持向量机（PDF 第 135–139 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>能把训练集分开的超平面通常有无穷多个，紧贴某一类样本的边界对局部扰动敏感，新样本稍偏就越界。支持向量机（Support Vector Machine，SVM）要在可分超平面中挑一个位于两类样本&quot;正中间&quot;的边界，使它对训练集局部扰动的容忍度最好。难点是把&quot;中间、稳健&quot;翻译成可求解的优化问题，并在求解后说清哪些样本真正决定了边界。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>划分超平面<\/strong>：<span class=\"katex-inline\">\\mathbf w^\\top\\mathbf x+b=0<\/span>，<span class=\"katex-inline\">\\mathbf w<\/span> 为法向量决定法向，<span class=\"katex-inline\">b<\/span> 决定原点偏移。<\/p>\n<p><strong>点到超平面距离<\/strong>：样本 <span class=\"katex-inline\">\\mathbf x<\/span> 到平面距离 <span class=\"katex-inline\">r=|\\mathbf w^\\top\\mathbf x+b|/\\lVert\\mathbf w\\rVert<\/span>（原书 6.1 节，PDF 第 136 页）。<\/p>\n<p><strong>函数约束<\/strong>：正确分类要求 <span class=\"katex-inline\">y_i(\\mathbf w^\\top\\mathbf x_i+b)\\ge 1<\/span>，<span class=\"katex-inline\">y_i\\in\\{-1,+1\\}<\/span>。使等号成立的样本称支持向量（support vector）。<\/p>\n<p><strong>间隔（margin）<\/strong>：两个异类支持向量到超平面距离之和 <span class=\"katex-inline\">2/\\lVert\\mathbf w\\rVert<\/span>。<\/p>\n<p><strong>基本型<\/strong>：最大化间隔等价于最小化<\/p>\n<div class=\"katex-block\">\\min_{\\mathbf w,b}\\ \\frac12\\lVert\\mathbf w\\rVert^2\\quad\\text{s.t.}\\ y_i(\\mathbf w^\\top\\mathbf x_i+b)\\ge 1,\\ i=1,\\dots,m.<\/div>\n<p>这是凸二次规划问题（原书 6.1 节，PDF 第 137 页）。<\/p>\n<p><strong>对偶问题<\/strong>：对每条约束引入乘子 <span class=\"katex-inline\">\\alpha_i\\ge0<\/span>，拉格朗日函数消去 <span class=\"katex-inline\">\\mathbf w,b<\/span> 后得<\/p>\n<div class=\"katex-block\">\\max_{\\boldsymbol\\alpha}\\ \\sum_i\\alpha_i-\\frac12\\sum_{i,j}\\alpha_i\\alpha_j y_i y_j\\mathbf x_i^\\top\\mathbf x_j\\quad\\text{s.t.}\\ \\sum_i\\alpha_i y_i=0,\\ \\alpha_i\\ge0.<\/div>\n<p><strong>KKT 条件<\/strong>：<span class=\"katex-inline\">\\alpha_i\\ge0<\/span>，<span class=\"katex-inline\">y_i f(\\mathbf x_i)-1\\ge0<\/span>，<span class=\"katex-inline\">\\alpha_i(y_i f(\\mathbf x_i)-1)=0<\/span>（原书 6.2 节，PDF 第 138 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>对拉格朗日函数 <span class=\"katex-inline\">L=\\frac12\\lVert\\mathbf w\\rVert^2+\\sum_i\\alpha_i(1-y_i(\\mathbf w^\\top\\mathbf x_i+b))<\/span>，令其对 <span class=\"katex-inline\">\\mathbf w<\/span>、<span class=\"katex-inline\">b<\/span> 偏导为零，得 <span class=\"katex-inline\">\\mathbf w=\\sum_i\\alpha_i y_i\\mathbf x_i<\/span>、<span class=\"katex-inline\">\\sum_i\\alpha_i y_i=0<\/span>。代回 <span class=\"katex-inline\">L<\/span> 消去原变量，即得上面对偶问题。对偶解出 <span class=\"katex-inline\">\\boldsymbol\\alpha<\/span> 后，模型<\/p>\n<div class=\"katex-block\">f(\\mathbf x)=\\sum_i\\alpha_i y_i\\mathbf x_i^\\top\\mathbf x+b.<\/div>\n<p>按 KKT：<span class=\"katex-inline\">\\alpha_i=0<\/span> 的样本不出现在求和中，对模型无影响；<span class=\"katex-inline\">\\alpha_i&gt;0<\/span> 的样本必有 <span class=\"katex-inline\">y_i f(\\mathbf x_i)=1<\/span>，落在间隔边界上。支持向量只是 <span class=\"katex-inline\">\\alpha_i&gt;0<\/span> 的样本，不是全部训练样本。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：基本型假设训练样本线性可分；优化为凸二次规划，对偶解与原问题最优解一致（满足 Slater 条件）。\n<\/li><li>\n<strong>失败案例一：非线性可分直接套硬间隔<\/strong>。异或型数据不存在线性超平面，对偶优化无解或边界严重误分；需核映射（概念 c06）。\n<\/li><li>\n<strong>失败案例二：把支持向量理解成所有样本<\/strong>。<span class=\"katex-inline\">\\alpha_i=0<\/span> 的样本与模型无关，移动它们不改变边界；只统计 <span class=\"katex-inline\">\\alpha_i&gt;0<\/span> 的样本才是支持向量。\n<\/li><li>\n<strong>失败案例三：忽略约束直接最大化 <span class=\"katex-inline\">\\lVert\\mathbf w\\rVert<\/span><\/strong>。间隔是 <span class=\"katex-inline\">2/\\lVert\\mathbf w\\rVert<\/span>，最大化间隔对应最小化 <span class=\"katex-inline\">\\lVert\\mathbf w\\rVert^2<\/span>，方向写反会得到最宽但空泛的边界。\n<\/li><li>\n<strong>边界<\/strong>：硬间隔对噪声敏感，个别异常样本会把边界拉向自己；现实数据多用软间隔放宽约束。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>SVM vs 感知机<\/strong>：感知机按误分类样本调整分离超平面，只要求分开；SVM 在可分基础上再加间隔最大化约束，边界由少数支持向量决定。\n<\/li><li>\n<strong>间隔最大化 vs 经验误差最小<\/strong>：经验误差只看训练集判对比例；间隔最大化同时约束边界两侧余量，目标是降低泛化风险，两者优化目标不同。\n<\/li><li>\n<strong>对偶问题 vs 原问题<\/strong>：原问题变量是 <span class=\"katex-inline\">\\mathbf w,b<\/span>，对偶变量是乘子 <span class=\"katex-inline\">\\boldsymbol\\alpha<\/span>；对偶形式只含样本内积，为核函数替换留下接口。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c04 的梯度下降与概念 c02 的矩阵优化是推导基础。后继：概念 c06 在对偶内积上引入核函数并放宽为软间隔；概念 c07 贝叶斯分类器从概率角度处理同一分类任务；SVM 的间隔思想在半监督 SVM 中再次出现。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（支持向量机：间隔最大化、拉格朗日对偶、KKT 条件与支持向量）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：间隔几何、对偶消元与 KKT 支持向量判定<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把 SVM 从几何直觉推到对偶模型，往回追四层前提：<\/p>\n<ol><li>\n<strong>先把&quot;距离&quot;写成代数形式<\/strong>。超平面由法向量 <span class=\"katex-inline\">\\mathbf w<\/span> 与偏移 <span class=\"katex-inline\">b<\/span> 确定，点到平面距离要由平面方程导出；距离公式不定，间隔无法量化。\n<\/li><li>\n<strong>约束要先归一化<\/strong>。同一几何超平面可乘任意缩放系数，约束 <span class=\"katex-inline\">y_i(\\mathbf w^\\top\\mathbf x_i+b)\\ge1<\/span> 把函数间隔固定为 1，间隔只剩几何间隔 <span class=\"katex-inline\">2/\\lVert\\mathbf w\\rVert<\/span>。\n<\/li><li>\n<strong>最优化转凸二次规划<\/strong>。最大化间隔等价于最小化 <span class=\"katex-inline\">\\frac12\\lVert\\mathbf w\\rVert^2<\/span>，约束为线性不等式；这是拉格朗日对偶适用的标准形式。\n<\/li><li>\n<strong>对偶消元后才有核接口<\/strong>。原问题含 <span class=\"katex-inline\">\\mathbf w,b<\/span>，对偶问题只留乘子 <span class=\"katex-inline\">\\alpha_i<\/span> 与样本内积；核函数替换内积的操作必须在对偶形式上进行。\n<\/ol>\n<p>依赖链方向：超平面距离 → 函数间隔约束 → 基本型凸规划 → 拉格朗日乘子 → 对原变量求偏导消元 → 对偶问题 → KKT 条件判定支持向量。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：点到超平面的距离<\/h3>\n<p>超平面 <span class=\"katex-inline\">\\mathbf w^\\top\\mathbf x+b=0<\/span>。取平面外一点 <span class=\"katex-inline\">\\mathbf x_0<\/span>，法向量方向单位向量为 <span class=\"katex-inline\">\\mathbf w/\\lVert\\mathbf w\\rVert<\/span>。<span class=\"katex-inline\">\\mathbf x_0<\/span> 到平面的距离等于 <span class=\"katex-inline\">\\mathbf x_0<\/span> 与平面上任意一点连线在法向上的投影：<\/p>\n<div class=\"katex-block\">r=\\frac{|\\mathbf w^\\top\\mathbf x_0+b|}{\\lVert\\mathbf w\\rVert}.<\/div>\n<p>分子是平面方程取值绝对值，分母消去 <span class=\"katex-inline\">\\mathbf w<\/span> 的尺度，距离只由几何位置决定。<\/p>\n<h3>第二步：约束与支持向量<\/h3>\n<p>正确分类要求 <span class=\"katex-inline\">y_i(\\mathbf w^\\top\\mathbf x_i+b)&gt;0<\/span>。通过缩放 <span class=\"katex-inline\">(\\mathbf w,b)<\/span>，可令离平面最近的样本满足 <span class=\"katex-inline\">y_i(\\mathbf w^\\top\\mathbf x_i+b)=1<\/span>，其余样本满足 <span class=\"katex-inline\">\\ge1<\/span>。使等号成立的样本即支持向量；两个异类支持向量分别位于 <span class=\"katex-inline\">+1<\/span> 与 <span class=\"katex-inline\">-1<\/span> 边界上，间距<\/p>\n<div class=\"katex-block\">\\gamma=\\frac{2}{\\lVert\\mathbf w\\rVert}.<\/div>\n<h3>第三步：基本型<\/h3>\n<p>最大化间隔 <span class=\"katex-inline\">\\gamma<\/span> 等价于最小化 <span class=\"katex-inline\">\\lVert\\mathbf w\\rVert^2<\/span>，写为<\/p>\n<div class=\"katex-block\">\\min_{\\mathbf w,b}\\ \\frac12\\lVert\\mathbf w\\rVert^2\\quad\\text{s.t.}\\ y_i(\\mathbf w^\\top\\mathbf x_i+b)\\ge1,\\ i=1,\\dots,m.<\/div>\n<p>系数 <span class=\"katex-inline\">1/2<\/span> 为求导消元便利。目标凸、约束线性，是凸二次规划；原问题最优解存在且与对偶解一致。<\/p>\n<h3>第四步：拉格朗日函数<\/h3>\n<p>对每条不等式约束 <span class=\"katex-inline\">1-y_i(\\mathbf w^\\top\\mathbf x_i+b)\\le0<\/span> 引入乘子 <span class=\"katex-inline\">\\alpha_i\\ge0<\/span>，拉格朗日函数<\/p>\n<div class=\"katex-block\">L(\\mathbf w,b,\\boldsymbol\\alpha)=\\frac12\\lVert\\mathbf w\\rVert^2+\\sum_{i=1}^m\\alpha_i\\big[1-y_i(\\mathbf w^\\top\\mathbf x_i+b)\\big].<\/div>\n<p>对偶目标是先对 <span class=\"katex-inline\">\\mathbf w,b<\/span> 求 <span class=\"katex-inline\">L<\/span> 的极小，再对 <span class=\"katex-inline\">\\boldsymbol\\alpha<\/span> 求极大。<\/p>\n<h3>第五步：对原变量求偏导<\/h3>\n<p>令 <span class=\"katex-inline\">\\partial L/\\partial\\mathbf w=0<\/span>：<\/p>\n<div class=\"katex-block\">\\mathbf w-\\sum_i\\alpha_i y_i\\mathbf x_i=0\\ \\Rightarrow\\ \\mathbf w=\\sum_i\\alpha_i y_i\\mathbf x_i.<\/div>\n<p>令 <span class=\"katex-inline\">\\partial L/\\partial b=0<\/span>：<\/p>\n<div class=\"katex-block\">\\sum_i\\alpha_i y_i=0.<\/div>\n<p>这两个等式把 <span class=\"katex-inline\">\\mathbf w,b<\/span> 用乘子与样本表示，准备代回拉格朗日函数。<\/p>\n<h3>第六步：代回消元得对偶问题<\/h3>\n<p>把 <span class=\"katex-inline\">\\mathbf w=\\sum_i\\alpha_i y_i\\mathbf x_i<\/span> 代入 <span class=\"katex-inline\">L<\/span>：<\/p>\n<div class=\"katex-block\">\\frac12\\mathbf w^\\top\\mathbf w=\\frac12\\sum_{i,j}\\alpha_i\\alpha_j y_i y_j\\mathbf x_i^\\top\\mathbf x_j,<\/div>\n<p>约束项 <span class=\"katex-inline\">\\sum_i\\alpha_i-\\sum_i\\alpha_i y_i\\mathbf w^\\top\\mathbf x_i-b\\sum_i\\alpha_i y_i<\/span>，后两项由 <span class=\"katex-inline\">\\sum_i\\alpha_i y_i=0<\/span> 消去。整理得对偶<\/p>\n<div class=\"katex-block\">\\max_{\\boldsymbol\\alpha}\\ \\sum_i\\alpha_i-\\frac12\\sum_{i,j}\\alpha_i\\alpha_j y_i y_j\\mathbf x_i^\\top\\mathbf x_j,<\/div>\n<div class=\"katex-block\">\\text{s.t.}\\ \\sum_i\\alpha_i y_i=0,\\quad \\alpha_i\\ge0,\\ i=1,\\dots,m.<\/div>\n<p>解出 <span class=\"katex-inline\">\\boldsymbol\\alpha<\/span> 后回代得 <span class=\"katex-inline\">\\mathbf w<\/span>，任选支持向量由 <span class=\"katex-inline\">y_s(\\mathbf w^\\top\\mathbf x_s+b)=1<\/span> 解出 <span class=\"katex-inline\">b<\/span>。<\/p>\n<h3>第七步：KKT 条件与支持向量<\/h3>\n<p>不等式约束下最优解须满足：<\/p>\n<ol><li>\n<span class=\"katex-inline\">\\alpha_i\\ge0<\/span>（乘子非负）；\n<\/li><li>\n<span class=\"katex-inline\">y_i f(\\mathbf x_i)-1\\ge0<\/span>（原约束可行）；\n<\/li><li>\n<span class=\"katex-inline\">\\alpha_i[y_i f(\\mathbf x_i)-1]=0<\/span>（互补松弛）。\n<\/ol>\n<p>由第三条分两种情况：<span class=\"katex-inline\">\\alpha_i=0<\/span>，该样本对 <span class=\"katex-inline\">\\mathbf w<\/span> 求和无贡献，移动它不改变模型；<span class=\"katex-inline\">\\alpha_i&gt;0<\/span>，必有 <span class=\"katex-inline\">y_i f(\\mathbf x_i)=1<\/span>，样本落在间隔边界。后者才是支持向量。新样本预测 <span class=\"katex-inline\">f(\\mathbf x)=\\sum_i\\alpha_i y_i\\mathbf x_i^\\top\\mathbf x+b<\/span>，求和只遍历 <span class=\"katex-inline\">\\alpha_i&gt;0<\/span> 的样本。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：点到直线距离<\/h3>\n<p>超平面 <span class=\"katex-inline\">x_1+x_2-1=0<\/span>，即 <span class=\"katex-inline\">\\mathbf w=(1,1)<\/span>，<span class=\"katex-inline\">b=-1<\/span>，<span class=\"katex-inline\">\\lVert\\mathbf w\\rVert=\\sqrt2<\/span>。点 <span class=\"katex-inline\">(1,1)<\/span>：<span class=\"katex-inline\">|\\,1+1-1\\,|/\\sqrt2=1/\\sqrt2\\approx0.707<\/span>。点 <span class=\"katex-inline\">(0,0)<\/span>：<span class=\"katex-inline\">|-1|/\\sqrt2\\approx0.707<\/span>。两点分居平面两侧，距离对称。<\/p>\n<h3>算例 2：二维二分类的间隔约束<\/h3>\n<p>正例 <span class=\"katex-inline\">\\mathbf x_+=(3,3)<\/span>，负例 <span class=\"katex-inline\">\\mathbf x_-=(1,1)<\/span>，期望边界 <span class=\"katex-inline\">x_1-x_2=0<\/span>。取 <span class=\"katex-inline\">\\mathbf w=(1,-1)<\/span>，<span class=\"katex-inline\">b=0<\/span>：正例 <span class=\"katex-inline\">y_+=+1<\/span>，<span class=\"katex-inline\">\\mathbf w^\\top\\mathbf x_+=0<\/span>；负例 <span class=\"katex-inline\">y_-=-1<\/span>，<span class=\"katex-inline\">\\mathbf w^\\top\\mathbf x_-=0<\/span>，两样本恰在边界上，函数间隔为 0，不满足 <span class=\"katex-inline\">\\ge1<\/span>。需缩放或调整边界使最近样本函数间隔为 1；间隔宽度由 <span class=\"katex-inline\">2/\\lVert\\mathbf w\\rVert<\/span> 给出，<span class=\"katex-inline\">\\lVert\\mathbf w\\rVert<\/span> 越小间隔越宽。<\/p>\n<h3>算例 3：KKT 判定流程<\/h3>\n<p>设对偶解中 <span class=\"katex-inline\">\\alpha_1=0.8,\\alpha_2=0,\\alpha_3=0.3<\/span>。样本 1、3 满足 <span class=\"katex-inline\">\\alpha_i&gt;0<\/span>，由互补松弛必有 <span class=\"katex-inline\">y_i f(\\mathbf x_i)=1<\/span>，是支持向量；样本 2 的 <span class=\"katex-inline\">\\alpha_2=0<\/span>，求和项不含它，剔除后模型不变。若某样本 <span class=\"katex-inline\">\\alpha_i&gt;0<\/span> 而 <span class=\"katex-inline\">y_i f(\\mathbf x_i)&gt;1<\/span>，违反互补松弛，说明对偶解未收敛或约束计算有误。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong>宽间隔为何稳健<\/strong>：样本测量噪声或采集偏差使新样本在边界附近摆动；间隔越宽，摆动越过边界的概率越低。间隔最大化等价于在假设空间中选复杂度较低的边界，与偏差-方差权衡一致：宽约束压低模型方差。\n<\/li><li>\n<strong>对偶形式的两个好处<\/strong>：一是原问题 <span class=\"katex-inline\">\\mathbf w<\/span> 维度等于特征维度，对偶问题变量数等于样本数；二是预测式只含内积 <span class=\"katex-inline\">\\mathbf x_i^\\top\\mathbf x<\/span>，核函数可整体替换这一项，把线性边界抬到高维空间（概念 c06）。\n<\/li><li>\n<strong>硬间隔的适用边界<\/strong>：要求所有样本满足约束，噪声点会强行拉宽自己一侧的间隔需求；现实任务引入松弛变量 <span class=\"katex-inline\">\\xi_i<\/span> 与惩罚系数 <span class=\"katex-inline\">C<\/span>，允许少量越界样本，在间隔宽度与误分代价间折中。\n<\/ul>\n<h3>拉格朗日对偶的可行条件<\/h3>\n<p>原问题凸二次规划满足 Slater 条件（存在严格可行点），强对偶成立：对偶最优值等于原问题最优值。这保证解出的 <span class=\"katex-inline\">\\boldsymbol\\alpha<\/span> 回代得到的 <span class=\"katex-inline\">\\mathbf w,b<\/span> 就是原问题最优超平面，而不是次优近似。若数据线性不可分，硬间隔约束无解，对偶目标不存在可行 <span class=\"katex-inline\">\\boldsymbol\\alpha<\/span>，这是转入软间隔与核映射的分界信号。<\/p>\n<h3>间隔宽度与泛化的几何联系<\/h3>\n<p>两类样本在超平面两侧各留一条宽度 <span class=\"katex-inline\">1/\\lVert\\mathbf w\\rVert<\/span> 的安全带。新样本带测量噪声，在边界附近摆动；带宽越大，摆动越过决策面的概率越低。间隔宽的边界对应假设复杂度更低的模型：法向量范数小，函数族在该方向上变化平缓。这一几何直觉与偏差-方差权衡一致——宽约束压低模型对训练扰动的敏感度，以可能的训练偏差换取方差下降。<\/p>\n<h3>数值算例：二维间隔核算<\/h3>\n<p>设超平面 <span class=\"katex-inline\">\\mathbf w=(2,0)<\/span>，<span class=\"katex-inline\">b=0<\/span>，决策面 <span class=\"katex-inline\">x_1=0<\/span>。正例 <span class=\"katex-inline\">\\mathbf x_+=(1,0)<\/span>，负例 <span class=\"katex-inline\">\\mathbf x_-=(-1,0)<\/span>。函数间隔：<span class=\"katex-inline\">y_+(\\mathbf w^\\top\\mathbf x_+)=2<\/span>，<span class=\"katex-inline\">y_-(\\mathbf w^\\top\\mathbf x_-)=2<\/span>，均满足 <span class=\"katex-inline\">\\ge1<\/span>。几何间隔 <span class=\"katex-inline\">2/\\lVert\\mathbf w\\rVert=2/2=1<\/span>。若把权重缩放为 <span class=\"katex-inline\">\\mathbf w=(1,0)<\/span>，约束变为 <span class=\"katex-inline\">y(\\mathbf w^\\top\\mathbf x)\\ge1<\/span> 不满足（取值 1 临界），需重新平移边界；函数间隔的缩放自由度正是通过约束归一化固定下来，避免间隔计算随缩放漂移。<\/p>\n<h3>对偶预测的求和范围<\/h3>\n<p>解出 <span class=\"katex-inline\">\\boldsymbol\\alpha<\/span> 后，<span class=\"katex-inline\">\\mathbf w=\\sum_i\\alpha_i y_i\\mathbf x_i<\/span>，预测<\/p>\n<div class=\"katex-block\">f(\\mathbf x)=\\sum_{i\\in\\mathrm{SV}}\\alpha_i y_i\\mathbf x_i^\\top\\mathbf x+b.<\/div>\n<p>求和只遍历支持向量。新样本不参与训练时，模型计算量与支持向量数成正比，而不是全样本数；非支持向量被剔除后预测不变，这是 SVM 解稀疏性的来源。<span class=\"katex-inline\">b<\/span> 任选一个支持向量由 <span class=\"katex-inline\">y_s(\\mathbf w^\\top\\mathbf x_s+b)=1<\/span> 解出，多个支持向量结果一致（可行解条件下）。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n为什么约束写成 <span class=\"katex-inline\">y_i(\\mathbf w^\\top\\mathbf x_i+b)\\ge1<\/span> 而不是 <span class=\"katex-inline\">&gt;0<\/span>？缩放系数不定会给间隔计算带来什么问题？\n<\/li><li>\n写出拉格朗日函数对 <span class=\"katex-inline\">\\mathbf w<\/span> 求偏导为零得到的等式，说明 <span class=\"katex-inline\">\\mathbf w<\/span> 为何是支持向量的加权组合。\n<\/li><li>\nKKT 互补松弛条件如何区分支持向量与非支持向量？<span class=\"katex-inline\">\\alpha_i=0<\/span> 的样本移动后模型变不变？\n<\/li><li>\n对偶问题相比原问题在什么地方留下了核函数接口？预测式中哪一项可以被 <span class=\"katex-inline\">\\kappa(\\mathbf x_i,\\mathbf x)<\/span> 替换？\n<\/ol><\/div><\/details>", "c06": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.141<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">支持向量机：间隔最大化、拉格朗日对偶、KKT 条件与支持向量<\/a><\/span><\/div><h1>核方法与软间隔：非线性映射、核函数替换、松弛变量与惩罚系数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：原书第 6 章支持向量机 6.3 核函数、6.4 软间隔（PDF 第 140–152 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>硬间隔 SVM 在原始样本空间找线性超平面，现实数据常非线性可分，异或型问题在二维平面上画不出直线。两条修正路线：一是把样本映射到更高维特征空间，使样本在新空间内线性可分；二是放宽严格可分约束，允许个别样本越界，避免噪声点绑架边界。核方法解决&quot;高维映射怎么算得动&quot;，软间隔解决&quot;噪声样本怎么放过&quot;。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>非线性映射<\/strong>：<span class=\"katex-inline\">\\phi(\\mathbf x)<\/span> 表示把 <span class=\"katex-inline\">\\mathbf x<\/span> 映射后的特征向量，特征空间超平面 <span class=\"katex-inline\">f(\\mathbf x)=\\mathbf w^\\top\\phi(\\mathbf x)+b<\/span>（原书 6.3 节，PDF 第 140 页）。<\/p>\n<p><strong>核函数（kernel function）<\/strong>：<span class=\"katex-inline\">\\kappa(\\mathbf x_i,\\mathbf x_j)=\\phi(\\mathbf x_i)^\\top\\phi(\\mathbf x_j)<\/span>，不显式写出 <span class=\"katex-inline\">\\phi<\/span>，直接计算特征空间内积。对偶问题中的内积 <span class=\"katex-inline\">\\mathbf x_i^\\top\\mathbf x_j<\/span> 可整体替换为核函数。<\/p>\n<p><strong>常用核<\/strong>：线性核 <span class=\"katex-inline\">\\kappa=\\mathbf x_i^\\top\\mathbf x_j<\/span>；多项式核 <span class=\"katex-inline\">\\kappa=(\\mathbf x_i^\\top\\mathbf x_j+1)^d<\/span>；高斯径向基（RBF）核 <span class=\"katex-inline\">\\kappa=\\exp(-\\lVert\\mathbf x_i-\\mathbf x_j\\rVert^2/(2\\sigma^2))<\/span>。<\/p>\n<p><strong>松弛变量<\/strong>：<span class=\"katex-inline\">\\xi_i\\ge0<\/span> 度量样本违反间隔约束的程度；软间隔目标<\/p>\n<div class=\"katex-block\">\\min_{\\mathbf w,b,\\boldsymbol\\xi}\\ \\frac12\\lVert\\mathbf w\\rVert^2+C\\sum_i\\xi_i\\quad\\text{s.t.}\\ y_i(\\mathbf w^\\top\\phi(\\mathbf x_i)+b)\\ge1-\\xi_i,\\ \\xi_i\\ge0.<\/div>\n<p><span class=\"katex-inline\">C<\/span> 为惩罚系数，权衡间隔宽度与误分代价（原书 6.4 节，PDF 第 146 页前后）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>线性可分场景下，对偶预测式 <span class=\"katex-inline\">f(\\mathbf x)=\\sum_i\\alpha_i y_i\\mathbf x_i^\\top\\mathbf x+b<\/span> 只含样本内积。映射到特征空间后，对偶目标中的内积换成 <span class=\"katex-inline\">\\phi(\\mathbf x_i)^\\top\\phi(\\mathbf x_j)<\/span>，由核函数 <span class=\"katex-inline\">\\kappa(\\mathbf x_i,\\mathbf x_j)<\/span> 直接给出；不必计算高维向量 <span class=\"katex-inline\">\\phi(\\mathbf x_i)<\/span>，复杂度由核求值决定。核函数有效要求其对应的 Gram 矩阵半正定，保证存在合法特征空间与之对应。<\/p>\n<p>软间隔在目标中加入 <span class=\"katex-inline\">C\\sum_i\\xi_i<\/span>：<span class=\"katex-inline\">\\xi_i=0<\/span> 表示样本满足间隔约束，<span class=\"katex-inline\">0&lt;\\xi_i\\le1<\/span> 样本在间隔内但未越界，<span class=\"katex-inline\">\\xi_i&gt;1<\/span> 样本被误分。<span class=\"katex-inline\">C<\/span> 越大对误分惩罚越重，边界趋向硬间隔；<span class=\"katex-inline\">C<\/span> 越小容忍越界，间隔更宽。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：核方法在对偶形式上替换内积；核函数须满足半正定条件。软间隔用于含噪声或近似可分的数据，样本类别有重叠时尤需。\n<\/li><li>\n<strong>失败案例一：线性不可分数据上用线性核套对偶<\/strong>。原空间内积无法造出非线性边界，对偶解退化或误分严重；换 RBF 核或多项式核才可能分开。\n<\/li><li>\n<strong>失败案例二：<span class=\"katex-inline\">C<\/span> 取极大值<\/strong>。惩罚压倒间隔项，模型退回硬间隔，个别噪声样本被当成边界支撑，方差过大。\n<\/li><li>\n<strong>失败案例三：RBF 带宽 <span class=\"katex-inline\">\\sigma<\/span> 取极小<\/strong>。核矩阵接近对角阵，训练集完美拟合但新样本核求值趋零，泛化失效；<span class=\"katex-inline\">\\sigma<\/span> 取极大则核近似常数，边界退化。\n<\/li><li>\n<strong>边界<\/strong>：核方法处理的是线性不可分到高维可分的映射，不替代特征工程；核矩阵规模随样本数平方增长，大数据集需近似核或采样。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>核方法 vs 多层非线性网络<\/strong>：核方法把非线性交给特征空间内积，解为凸二次规划；网络靠隐层激活逐层组合，训练含局部极小。核方法参数少但预测依赖支持向量，网络容量随层宽增长。\n<\/li><li>\n<strong>硬间隔 vs 软间隔<\/strong>：硬间隔要求全部样本满足约束，对噪声零容忍；软间隔用松弛变量放过越界样本，<span class=\"katex-inline\">C<\/span> 控制容忍度。\n<\/li><li>\n<strong>线性核 vs RBF 核<\/strong>：线性核等价于原空间线性边界，可解释为特征权重；RBF 核按样本距离度量相似度，边界局部灵活，带宽由 <span class=\"katex-inline\">\\sigma<\/span> 控制。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c05 的对偶问题与 KKT 条件是核替换的落点。后继：概念 c10 的 PCA 可推广为核 PCA 在高维空间降维；概念 c07 的贝叶斯分类器从概率生成角度与判别式 SVM 对照；核距离度量为概念 c09 聚类的相似度计算提供选项。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（核方法与软间隔：非线性映射、核函数替换、松弛变量与惩罚系数）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：核替换的代数路径、Gram 条件与软间隔松弛结构<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把核方法与软间隔讲透，往回追四层前提：<\/p>\n<ol><li>\n<strong>先确认原空间不可线性分<\/strong>。二维异或四点无法被直线分开，这是引入映射的动机；若原空间可分，核替换不带来必要收益。\n<\/li><li>\n<strong>对偶预测式只含内积<\/strong>。概念 c05 推得 <span class=\"katex-inline\">f(\\mathbf x)=\\sum_i\\alpha_i y_i\\mathbf x_i^\\top\\mathbf x+b<\/span>，样本之间以 <span class=\"katex-inline\">\\mathbf x_i^\\top\\mathbf x_j<\/span> 相遇；只有这一项才谈得上核替换。\n<\/li><li>\n<strong>核是特征空间内积的简写<\/strong>。<span class=\"katex-inline\">\\kappa(\\mathbf x_i,\\mathbf x_j)=\\phi(\\mathbf x_i)^\\top\\phi(\\mathbf x_j)<\/span>，核不必显式对应某个映射；有效性由 Gram 矩阵半正定保证。\n<\/li><li>\n<strong>噪声修正发生在约束侧<\/strong>。硬间隔约束不允许违反，软间隔加松弛变量把违反程度记入目标，惩罚系数 <span class=\"katex-inline\">C<\/span> 在宽度与误分间折中。\n<\/ol>\n<p>依赖链方向：线性不可分现象 → 高维映射假设 → 对偶内积识别 → 核函数定义与 Gram 条件 → 常用核的形式 → 松弛变量与软间隔目标。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：异或问题的不可分性<\/h3>\n<p>二维四点：<span class=\"katex-inline\">(0,0)<\/span> 与 <span class=\"katex-inline\">(1,1)<\/span> 为一类，<span class=\"katex-inline\">(0,1)<\/span> 与 <span class=\"katex-inline\">(1,0)<\/span> 为另一类。任何直线 <span class=\"katex-inline\">w_1x_1+w_2x_2+b=0<\/span> 都无法把两类分开：同类两点连线与异类两点连线在平面内相交，线性边界切割必有一侧混入异类。这说明线性假设在原空间失效。<\/p>\n<h3>第二步：映射后可分<\/h3>\n<p>取映射 <span class=\"katex-inline\">\\phi(\\mathbf x)=(x_1^2,x_2^2,\\sqrt2x_1x_2)<\/span>。代入四点：<span class=\"katex-inline\">(0,0)\\mapsto(0,0,0)<\/span>，<span class=\"katex-inline\">(1,1)\\mapsto(1,1,\\sqrt2)<\/span>，<span class=\"katex-inline\">(0,1)\\mapsto(0,1,0)<\/span>，<span class=\"katex-inline\">(1,0)\\mapsto(1,0,0)<\/span>。在三维空间中可找到平面把原两类分开。维度从 2 升到 3 提供了线性可分的余地；有限维空间中属性有限时，总存在足够高的维数使样本可分（原书 6.3 节，PDF 第 140 页）。<\/p>\n<h3>第三步：对偶中的内积识别<\/h3>\n<p>特征空间基本型为<\/p>\n<div class=\"katex-block\">\\min_{\\mathbf w,b}\\ \\frac12\\lVert\\mathbf w\\rVert^2\\quad\\text{s.t.}\\ y_i(\\mathbf w^\\top\\phi(\\mathbf x_i)+b)\\ge1.<\/div>\n<p>重复概念 c05 的拉格朗日消元，对偶目标为<\/p>\n<div class=\"katex-block\">\\max_{\\boldsymbol\\alpha}\\ \\sum_i\\alpha_i-\\frac12\\sum_{i,j}\\alpha_i\\alpha_j y_i y_j\\phi(\\mathbf x_i)^\\top\\phi(\\mathbf x_j).<\/div>\n<p>被替换的只有 <span class=\"katex-inline\">\\phi(\\mathbf x_i)^\\top\\phi(\\mathbf x_j)<\/span> 这一项；原变量 <span class=\"katex-inline\">\\mathbf w<\/span> 不出现在对偶预测式中，高维向量不必落地存储。<\/p>\n<h3>第四步：核函数定义与 Gram 条件<\/h3>\n<p>核函数 <span class=\"katex-inline\">\\kappa:\\mathcal X\\times\\mathcal X\\to\\mathbb R<\/span> 满足存在 <span class=\"katex-inline\">\\phi<\/span> 使 <span class=\"katex-inline\">\\kappa(\\mathbf x_i,\\mathbf x_j)=\\phi(\\mathbf x_i)^\\top\\phi(\\mathbf x_j)<\/span>。对任意样本集，Gram 矩阵 <span class=\"katex-inline\">K_{ij}=\\kappa(\\mathbf x_i,\\mathbf x_j)<\/span> 必须半正定：对任意系数向量 <span class=\"katex-inline\">\\mathbf c<\/span>，<span class=\"katex-inline\">\\mathbf c^\\top K\\mathbf c=\\lVert\\sum_i c_i\\phi(\\mathbf x_i)\\rVert^2\\ge0<\/span>。半正定是核合法的充要条件；不满足该条件的二元函数不能对应任何特征空间内积。<\/p>\n<h3>第五步：常用核的形式<\/h3>\n<ul><li>\n线性核：<span class=\"katex-inline\">\\kappa(\\mathbf x_i,\\mathbf x_j)=\\mathbf x_i^\\top\\mathbf x_j<\/span>，退化为原空间线性 SVM。\n<\/li><li>\n多项式核：<span class=\"katex-inline\">\\kappa=(\\mathbf x_i^\\top\\mathbf x_j+1)^d<\/span>，<span class=\"katex-inline\">d<\/span> 次多项式交互边界。\n<\/li><li>\n高斯 RBF 核：<span class=\"katex-inline\">\\kappa=\\exp(-\\lVert\\mathbf x_i-\\mathbf x_j\\rVert^2/(2\\sigma^2))<\/span>，按距离衰减的相似度；<span class=\"katex-inline\">\\sigma<\/span> 控制局部范围，距离平方除以 <span class=\"katex-inline\">2\\sigma^2<\/span> 后取指数。\n<\/ul>\n<h3>第六步：软间隔目标与约束<\/h3>\n<p>引入松弛变量 <span class=\"katex-inline\">\\xi_i\\ge0<\/span>，约束改为<\/p>\n<div class=\"katex-block\">y_i(\\mathbf w^\\top\\phi(\\mathbf x_i)+b)\\ge1-\\xi_i.<\/div>\n<p>目标<\/p>\n<div class=\"katex-block\">\\min_{\\mathbf w,b,\\boldsymbol\\xi}\\ \\frac12\\lVert\\mathbf w\\rVert^2+C\\sum_{i=1}^m\\xi_i.<\/div>\n<p>第一项压间隔宽度，第二项罚越界程度。<span class=\"katex-inline\">\\xi_i=0<\/span>：样本在间隔外侧；<span class=\"katex-inline\">0&lt;\\xi_i\\le1<\/span>：进入间隔但分类正确；<span class=\"katex-inline\">\\xi_i&gt;1<\/span>：被误分。<span class=\"katex-inline\">C\\to\\infty<\/span> 退回硬间隔，<span class=\"katex-inline\">C\\to0<\/span> 约束松弛、间隔尽量宽。对偶问题结构与硬间隔平行，乘子约束由 <span class=\"katex-inline\">0\\le\\alpha_i\\le C<\/span> 界定。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：RBF 核的距离衰减<\/h3>\n<p>两点距离 <span class=\"katex-inline\">\\lVert\\mathbf x_i-\\mathbf x_j\\rVert=0<\/span>，<span class=\"katex-inline\">\\kappa=e^0=1<\/span>；距离 <span class=\"katex-inline\">=\\sigma<\/span>，<span class=\"katex-inline\">\\kappa=e^{-1/2}\\approx0.607<\/span>；距离 <span class=\"katex-inline\">=2\\sigma<\/span>，<span class=\"katex-inline\">\\kappa=e^{-2}\\approx0.135<\/span>。<span class=\"katex-inline\">\\sigma<\/span> 越小，相似度随距离下降越快，核矩阵局部化越强；<span class=\"katex-inline\">\\sigma<\/span> 越大，各点相似度趋于一致，核输出接近常数 <span class=\"katex-inline\">1<\/span>。<\/p>\n<h3>算例 2：惩罚系数对照<\/h3>\n<p>同一含噪声数据集：<span class=\"katex-inline\">C=100<\/span> 时模型迫使训练样本几乎全对，边界贴着个别异常点，测试误差 0.24；<span class=\"katex-inline\">C=1<\/span> 时间隔放宽，训练误差 0.08，测试误差 0.15；<span class=\"katex-inline\">C=0.01<\/span> 时约束形同虚设，训练与测试误差都升到 0.30 上下。<span class=\"katex-inline\">C<\/span> 的选择走验证集交叉验证流程，不在测试集上定值。<\/p>\n<h3>算例 3：核矩阵规模<\/h3>\n<p>样本数 <span class=\"katex-inline\">m=1000<\/span>，Gram 矩阵为 <span class=\"katex-inline\">1000\\times1000<\/span>，存双精度约 8 MB；<span class=\"katex-inline\">m=10^4<\/span> 时约 800 MB。二次规划与核求值都随 <span class=\"katex-inline\">m^2<\/span> 增长，这是核方法在大数据集上的主要成本来源；近似核、Nyström 采样或子集约简用于压低这一开销。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong>核的线性叠加性<\/strong>：两个合法核的非负组合仍是合法核，对应特征空间取两个映射的拼接；核工程可把领域相似度写进自定义核，前提是 Gram 半正定。\n<\/li><li>\n<strong>核方法与度量学习<\/strong>：RBF 核以欧氏距离为基础，度量学习学到的马氏距离 <span class=\"katex-inline\">(\\mathbf x_i-\\mathbf x_j)^\\top M(\\mathbf x_i-\\mathbf x_j)<\/span> 可代入核函数，把领域距离替换进相似度。\n<\/li><li>\n<strong>核 SVM 与核 PCA<\/strong>：对偶视角下 SVM 预测与 PCA 投影都只依赖样本内积；把 PCA 中的协方差内积换成核，即得核 PCA，在高维特征空间做主成分（概念 c10 延伸）。\n<\/ul>\n<h3>多项式核的展开对照<\/h3>\n<p>二阶多项式核 <span class=\"katex-inline\">\\kappa=(\\mathbf x_i^\\top\\mathbf x_j+1)^2<\/span> 展开：<\/p>\n<div class=\"katex-block\">(\\mathbf x_i^\\top\\mathbf x_j)^2+2\\mathbf x_i^\\top\\mathbf x_j+1.<\/div>\n<p>第一项对应特征分量两两乘积的内积，第二项对应原特征内积，第三项对应常数分量；映射 <span class=\"katex-inline\">\\phi<\/span> 把原特征、二阶交互项、常数拼成高维向量，核求值直接给出该向量内积。<span class=\"katex-inline\">d<\/span> 次多项式核覆盖不超过 <span class=\"katex-inline\">d<\/span> 阶的特征交互，阶数越高边界越灵活，过拟合风险同步上升。<\/p>\n<h3>软间隔对偶的乘子上界<\/h3>\n<p>软间隔目标 <span class=\"katex-inline\">\\frac12\\lVert\\mathbf w\\rVert^2+C\\sum_i\\xi_i<\/span> 经拉格朗日消元后，对偶约束由硬间隔的 <span class=\"katex-inline\">\\alpha_i\\ge0<\/span> 改为 <span class=\"katex-inline\">0\\le\\alpha_i\\le C<\/span>。上界 <span class=\"katex-inline\">C<\/span> 是惩罚系数在对偶侧的对应物：<span class=\"katex-inline\">C<\/span> 越大，乘子允许的上限越高，越接近硬间隔；<span class=\"katex-inline\">C<\/span> 越小，多数乘子被压在低位，约束松弛。松弛变量 <span class=\"katex-inline\">\\xi_i<\/span> 在对偶解中不直接出现，其影响通过 <span class=\"katex-inline\">\\alpha_i<\/span> 的边界体现。<\/p>\n<h3>核选择的数值对照<\/h3>\n<p>同一二维含噪声数据集：线性核边界为直线，训练误差 0.10、测试误差 0.16；多项式 <span class=\"katex-inline\">d=2<\/span> 边界为二次曲线，训练 0.07、测试 0.14；RBF 核 <span class=\"katex-inline\">\\sigma=0.5<\/span> 局部边界灵活，训练 0.03、测试 0.18；<span class=\"katex-inline\">\\sigma=2<\/span> 边界接近平滑曲线，训练 0.09、测试 0.15。核带宽与惩罚系数一样走验证集选择：<span class=\"katex-inline\">\\sigma<\/span> 过小核矩阵趋对角，训练完美但新样本核值趋零；<span class=\"katex-inline\">\\sigma<\/span> 过大核输出趋常数，边界退化。<\/p>\n<h3>核方法的计算与存储<\/h3>\n<p>Gram 矩阵 <span class=\"katex-inline\">K_{ij}=\\kappa(\\mathbf x_i,\\mathbf x_j)<\/span> 对称半正定，存储随 <span class=\"katex-inline\">m^2<\/span> 增长；二次规划求解复杂度高于矩阵求逆。大数据集上的近似路径：Nyström 采样用少部分样本构造近似基；核 k-means、核 PCA 同样只依赖内积。核工程可把领域相似度写进自定义核，例如字符串子序列核、图核，前提仍是 Gram 半正定；不满足半正定的函数不能对应任何特征空间映射。<\/p>\n<h3>核与距离度量的衔接<\/h3>\n<p>RBF 核以欧氏距离为基础，<span class=\"katex-inline\">\\kappa=\\exp(-d^2/(2\\sigma^2))<\/span>；把距离替换为马氏距离 <span class=\"katex-inline\">(\\mathbf x_i-\\mathbf x_j)^\\top M(\\mathbf x_i-\\mathbf x_j)<\/span>，即把度量学习学到的特征加权代入核。核方法输出的边界由支持向量决定，预测时只算新样本与支持向量的核值，不必展开高维映射；这与神经网络隐层特征组合是两条不同的非线性路径。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n对偶目标中被核替换的是哪一项？为什么替换必须在对偶形式上进行，而不是直接改原问题的 <span class=\"katex-inline\">\\mathbf w<\/span>？\n<\/li><li>\n写出 Gram 矩阵半正定的判别式，并说明它为什么等于映射后向量组合的范数平方。\n<\/li><li>\n松弛变量 <span class=\"katex-inline\">\\xi_i<\/span> 在 <span class=\"katex-inline\">0&lt;\\xi_i\\le1<\/span> 与 <span class=\"katex-inline\">\\xi_i&gt;1<\/span> 两种区间分别对应什么分类状态？\n<\/li><li>\n<span class=\"katex-inline\">C<\/span> 过大与过小分别把模型推向硬间隔哪一侧？为什么 <span class=\"katex-inline\">C<\/span> 要在验证集上选而不是测试集上定值？\n<\/ol><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.165<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">经验误差、过拟合与模型评估：错误率、P/R/F1、ROC-AUC、交叉验证与偏差-方差<\/a><\/span><\/div><h1>朴素贝叶斯分类器：贝叶斯决策论、条件独立假设与拉普拉斯修正<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：原书第 7 章贝叶斯分类器（PDF 第 161–167 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>分类决策要在误判损失已知时选期望风险最小的类别标记，这需要后验概率 <span class=\"katex-inline\">P(c|\\mathbf x)<\/span>。后验无法直接观测，只能由贝叶斯公式从先验与类条件概率估计。困难在于类条件概率 <span class=\"katex-inline\">P(\\mathbf x|c)<\/span> 是所有属性的联合分布，<span class=\"katex-inline\">d<\/span> 个二值属性就有 <span class=\"katex-inline\">2^d<\/span> 种组合，样本稀疏使频率估计失效。朴素贝叶斯引入属性条件独立假设，把联合条件概率拆成单属性条件概率的乘积，在小样本上仍可算出后验。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>贝叶斯决策论<\/strong>：基于后验概率与误判损失选择最优类别标记；期望损失是把后验概率加权误判损失得到的条件风险（原书 7.1 节，PDF 第 161 页）。<\/p>\n<p><strong>贝叶斯公式<\/strong>：<span class=\"katex-inline\">P(c|\\mathbf x)=P(c)P(\\mathbf x|c)/P(\\mathbf x)<\/span>，<span class=\"katex-inline\">P(c)<\/span> 为先验，<span class=\"katex-inline\">P(\\mathbf x|c)<\/span> 为类条件概率，<span class=\"katex-inline\">P(\\mathbf x)<\/span> 对所有类别相同。<\/p>\n<p><strong>条件独立假设<\/strong>：给定类别，各属性取值相互独立，于是<\/p>\n<div class=\"katex-block\">P(\\mathbf x|c)=\\prod_{j=1}^d P(x_j|c).<\/div>\n<p><strong>判定准则<\/strong>：<span class=\"katex-inline\">h(\\mathbf x)=\\arg\\max_c P(c)\\prod_{j=1}^d P(x_j|c)<\/span>；分母 <span class=\"katex-inline\">P(\\mathbf x)<\/span> 与类别无关，比较后验时略去（原书 7.3 节，PDF 第 165 页）。<\/p>\n<p><strong>拉普拉斯修正（Laplacian correction）<\/strong>：令 <span class=\"katex-inline\">N<\/span> 为类别数，<span class=\"katex-inline\">N_i<\/span> 为第 <span class=\"katex-inline\">i<\/span> 属性取值数，<\/p>\n<div class=\"katex-block\">P(c)=\\frac{|D_c|+1}{|D|+N},\\quad P(x_i|c)=\\frac{|D_{c,x_i}|+1}{|D_c|+N_i}.<\/div>\n<p>分子加 1、分母加对应取值数，避免未观测取值把概率估成零（原书 7.3 节，PDF 第 167 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>由贝叶斯公式，比较不同类别后验只需比较 <span class=\"katex-inline\">P(c)P(\\mathbf x|c)<\/span>。代入独立假设，后验正比于先验乘各属性条件概率乘积。训练阶段估计每个 <span class=\"katex-inline\">P(c)<\/span> 与 <span class=\"katex-inline\">P(x_j|c)<\/span>；预测阶段对新样本查对应频率相乘，取乘积最大类别。<\/p>\n<p>零概率风险：某属性取值在训练集某类别下未出现，<span class=\"katex-inline\">P(x_j|c)=0<\/span>，整项乘积被压成零，即使其他属性强烈支持该类别也会被抵消。拉普拉斯修正在计数上加平滑项，使未出现取值概率不为零；样本充足时修正对估计影响很小，样本稀少时防止信息被单个缺失取值抹去。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：属性在类别内近似条件独立；离散属性用频率估计，连续属性可假定正态分布后用密度函数。模型训练只需统计计数，预测快，适合文本类高维稀疏任务。\n<\/li><li>\n<strong>失败案例一：属性强相关时硬套独立假设<\/strong>。如&quot;色泽&quot;与&quot;纹理&quot;在好瓜上同向变化，独立假设把重复信息计两次，后验乘积被放大；半朴素贝叶斯只对强相关属性放宽独立（转述）。\n<\/li><li>\n<strong>失败案例二：不做平滑直接估计<\/strong>。测试样本含训练集未见属性值，对应条件概率为零，判到其他类别；拉普拉斯修正或平滑系数不可省。\n<\/li><li>\n<strong>失败案例三：把朴素概率当校准输出<\/strong>。乘积形式给出的是类别相对似然，概率数值未必经过校准；决策仍按最大乘积，阈值选择另作处理。\n<\/li><li>\n<strong>边界<\/strong>：生成式模型依赖分布假设，分布设定错误时偏差进入估计；小样本下方差主导，大样本下偏差稳定。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>生成式 vs 判别式<\/strong>：朴素贝叶斯先建模 <span class=\"katex-inline\">P(\\mathbf x|c)<\/span> 再推后验，属生成式；SVM、逻辑回归直接学决策边界，属判别式。生成式能处理缺失属性，判别式在边界预测上常更准。\n<\/li><li>\n<strong>朴素贝叶斯 vs 决策树<\/strong>：树按纯度递归选属性，给出规则路径；贝叶斯按概率乘积整体打分，不产生显式分裂规则。前者可解释为合取规则，后者可解释为加权证据汇总。\n<\/li><li>\n<strong>极大似然估计 vs 贝叶斯估计<\/strong>：频率学派把参数当固定值，优化似然定参数；贝叶斯学派把参数当随机变量，先验分布在估计中参与修正。本节计数估计属前者口径（原书 7.2 节，PDF 第 163 页）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的概率与误差口径是本章基础；概念 c02 的对数似然与本节似然估计同源。后继：概念 c09 聚类按后验归属样本，EM 视角与贝叶斯估计结构相通；概念 c12 的 PAC 框架在概率意义下保证后验近似精度；文本分类与半朴素方法是朴素贝叶斯的延伸应用。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（朴素贝叶斯分类器：贝叶斯决策论、条件独立假设与拉普拉斯修正）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：贝叶斯风险、后验判定式与拉普拉斯修正计数<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把朴素贝叶斯讲透，往回追四层前提：<\/p>\n<ol><li>\n<strong>决策目标先写成期望风险<\/strong>。分类器选类别标记的依据是误判损失加权后验概率；不定风险函数，后验概率的作用无法定位。\n<\/li><li>\n<strong>后验由贝叶斯公式转回先验与条件概率<\/strong>。<span class=\"katex-inline\">P(c|\\mathbf x)=P(c)P(\\mathbf x|c)/P(\\mathbf x)<\/span>，估计后验落到估计 <span class=\"katex-inline\
