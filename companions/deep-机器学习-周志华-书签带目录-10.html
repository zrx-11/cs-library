<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>

  color: #17223b !important;
}

.page blockquote,

  background: var(--accent-soft) !important;
  border-left-color: var(--accent) !important;
  color: var(--text) !important;
}

.mermaid,
.mermaid-hint {
  background: var(--code-bg) !important;
  color: var(--muted) !important;
  border-color: var(--border) !important;
}

.quiz-item,
.path-step,
.book-card,
.concept-card,
.pattern-card,
.term-card,
.diag-card,
.search-hit,
.card,
.box,
.panel,
.fc-front,
.fc-back,
details,
summary {
  background: var(--panel) !important;
  border-color: var(--border) !important;
  color: var(--text) !important;
}

.book-card:hover,
.concept-card:hover,
.quiz-item:hover {
  border-color: var(--accent) !important;
}

.quiz-explain,
.source-badge,
.glossary-ref,
.card-counts,
.source,
.citation {
  color: var(--muted) !important;
  border-color: var(--border) !important;
}

.quiz-blank,
.quiz-opts label,
.quiz-opts label:hover {
  background: var(--bg-soft) !important;
  color: var(--text) !important;
  border-color: var(--border) !important;
}

.fc-back {
  background: var(--accent-soft) !important;
}

.tag,
.pill,
.badge {
  background: var(--panel-2) !important;
  border-color: var(--border) !important;
  color: var(--text2) !important;
}

.empty {
  color: var(--muted) !important;
}

.card .icon:empty,
.icon-label:empty {
  display: none !important;
}

* {
  scrollbar-color: #2a3a5f transparent;
  scrollbar-width: thin;
}

::selection {
  background: var(--accent);
  color: #fff;
}

/* 深色主题下代码高亮不要被旧样式压成白底 */
html[data-theme="dark"] .page pre,
body[data-theme="dark"] .page pre {
  background: var(--code-bg) !important;
}

/* 旧版页面里的白色卡片兜底 */
html[data-theme="dark"] .page .card,
body[data-theme="dark"] .page .card {
  background: var(--panel) !important;
}

@media (max-width: 820px) {
  body {
    background-size: 22px 22px;
    font-size: 15.5px;
  }
  header,
  .topbar,
  .topbar-fixed {
    background: var(--bg) !important;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: .001ms !important;
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
  }
}

@media print {
  html, body {
    background: #fff !important;
    color: #000 !important;
  }
  body {
    background-image: none !important;
  }
}

/* 多书总入口：窄屏下书籍标签横滑，不再堆成四五行 */
@media (max-width: 720px) {
  header .tabs,
  .tabs {
    display: flex !important;
    flex-wrap: nowrap !important;
    overflow-x: auto;
    overflow-y: hidden;
    max-width: 100%;
    padding-bottom: 4px;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }

  header .tabs > *,
  .tabs > * {
    flex: 0 0 auto;
  }

  .tabs::-webkit-scrollbar {
    height: 4px;
  }
  .tabs::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }
}

": "支持向量机：间隔最大化、拉格朗日对偶、KKT 条件与支持向量", "file": "concepts/c05.md", "chapterIds": ["ch02"], "difficulty": "高难", "source": {"file": "library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 136}, "prerequisites": ["c04"], "depthFragment": "concepts/c05-depth.md"}, {"id": "c06", "title": "核方法与软间隔：非线性映射、核函数替换、松弛变量与惩罚系数", "file": "concepts/c06.md", "chapterIds": ["ch02"], "difficulty": "进阶", "source": {"file": "library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 141}, "prerequisites": ["c05"], "depthFragment": "concepts/c06-depth.md"}, {"id": "c07", "title": "朴素贝叶斯分类器：贝叶斯决策论、条件独立假设与拉普拉斯修正", "file": "concepts/c07.md", "chapterIds": ["ch03"], "difficulty": "进阶", "source": {"file": "library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 165}, "prerequisites": ["c01"], "depthFragment": "concepts/c07-depth.md"}, {"id": "c08", "title": "集成学习：Bagging 并行采样与 Boosting 串行加权，AdaBoost 指数损失与权重更新", "file": "concepts/c08.md", "chapterIds": ["ch03"], "difficulty": "高难", "source": {"file": "library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 190}, "prerequisites": ["c03"], "depthFragment": "concepts/c08-depth.md"}, {"id": "c09", "title": "k-means 原型聚类：平方误差目标函数、簇分配与均值更新、EM 视角与初值敏感", "file": "concepts/c09.md", "chapterIds": ["ch03"], "difficulty": "进阶", "source": {"file": "library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 217}, "prerequisites": ["c07"], "depthFragment": "concepts/c09-depth.md"}, {"id": "c10", "title": "主成分分析 PCA：方差最大化与最小重构误差的等价性", "file": "concepts/c10.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 244}, "prerequisites": ["c09"], "depthFragment": "concepts/c10-depth.md"}, {"id": "c11", "title": "特征选择与稀疏学习：过滤/包裹/嵌入机制、L1 与 L2 正则化的几何差别", "file": "concepts/c11.md", "chapterIds": ["ch04"], "difficulty": "进阶", "source": {"file": "library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 263}, "prerequisites": ["c02"], "depthFragment": "concepts/c11-depth.md"}, {"id": "c12", "title": "计算学习理论：PAC 可学习性、假设空间复杂度与样本复杂度", "file": "concepts/c12.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 284}, "prerequisites": ["c01"], "depthFragment": "concepts/c12-depth.md"}], "glossary": [{"term": "泛化误差（Generalization Error）", "def": "学习器在新样本上的误差；训练误差（经验误差）是学习器在训练集上的误差。训练误差很小而泛化误差大，对应过拟合（原书 2.1 节，PDF 第 37 页）。", "chapterId": "ch01"}, {"term": "查准率 P 与查全率 R（Precision / Recall）", "def": "混淆矩阵下 $P=TP/(TP+FP)$，$R=TP/(TP+FN)$；两者通常此消彼长，F1 取调和平均 $F_1=2PR/(P+R)$（原书 2.3.2 节，PDF 第 44–46 页）。", "chapterId": "ch01"}, {"term": "ROC 与 AUC", "def": "ROC 纵轴为真正例率 $TPR=TP/(TP+FN)$，横轴为假正例率 $FPR=FP/(FP+TN)$；AUC 为 ROC 曲线下面积，衡量排序质量，不是分类准确率（原书 2.3.3 节，PDF 第 47–48 页）。", "chapterId": "ch01"}, {"term": "偏差-方差分解（Bias-Variance Decomposition）", "def": "泛化误差可拆为偏差（模型假设与真实规律的差距）、方差（训练集扰动带来的预测波动）与噪声；欠拟合对应高偏差，过拟合对应高方差（原书 2.6 节，PDF 第 40 页前后）。", "chapterId": "ch01"}, {"term": "正规方程（Normal Equation）", "def": "平方损失对权重求梯度为零得到 $X^\top X\\mathbf w=X^\top\\mathbf y$；$X^\top X$ 满秩时闭式解 $\\mathbf w^*=(X^\top X)^{-1}X^\top\\mathbf y$（原书 3.2 节，PDF 第 69 页）。", "chapterId": "ch01"}, {"term": "对数几率回归（Logistic Regression）", "def": "用 Sigmoid 函数把线性输出压到 $(0,1)$ 作为类后验概率估计，以对数似然为优化目标，经梯度下降或牛顿法求解；输出是概率而非类别标记（原书 3.3 节，PDF 第 72–73 页）。", "chapterId": "ch01"}, {"term": "信息增益（Information Gain）", "def": "$\\mathrm{Gain}(D,a)=\\mathrm{Ent}(D)-\\sum_v |D^v|/|D|\\,\\mathrm{Ent}(D^v)$，其中信息熵 $\\mathrm{Ent}(D)=-\\sum_k p_k\\log_2 p_k$；ID3 按信息增益选划分属性（原书 4.2.1 节，PDF 第 89 页）。", "chapterId": "ch01"}, {"term": "基尼指数（Gini Index）", "def": "基尼值 $\\mathrm{Gini}(D)=1-\\sum_k p_k^2$，反映随机抽两个样本类别不一致的概率；CART 按划分后基尼指数最小选属性（原书 4.2.3 节，PDF 第 93 页）。", "chapterId": "ch01"}, {"term": "误差逆传播算法（Error BackPropagation, BP）", "def": "基于梯度下降，按链式法则把输出层误差逐层反向传回隐层，更新连接权与阈值；BP 是训练多层前馈网络最常用的算法（原书 5.3 节，PDF 第 115–116 页）。", "chapterId": "ch02"}, {"term": "间隔（Margin）与支持向量（Support Vector）", "def": "异类支持向量到划分超平面的距离之和为间隔；约束取等号的样本即支持向量，拉格朗日乘子 $\\alpha_i>0$ 的样本只在求和中出现（原书 6.1–6.2 节，PDF 第 136–138 页）。", "chapterId": "ch02"}, {"term": "核函数（Kernel Function）", "def": "$\\kappa(\\mathbf x_i,\\mathbf x_j)=\\phi(\\mathbf x_i)^\top\\phi(\\mathbf x_j)$，在不显式写出高维映射 $\\phi$ 的情况下计算特征空间内积；对偶问题中的内积可整体替换为核函数（原书 6.3 节，PDF 第 140–141 页）。", "chapterId": "ch02"}, {"term": "朴素贝叶斯分类器（Naive Bayes Classifier）", "def": "在属性条件独立假设下，后验 $P(c|\\mathbf x)\\propto P(c)\\prod_j P(x_j|c)$；判定取后验最大的类别，$P(\\mathbf x)$ 对所有类别相同可略去（原书 7.3 节，PDF 第 165 页）。", "chapterId": "ch03"}, {"term": "集成学习（Ensemble Learning）", "def": "构建并结合多个个体学习器完成任务；个体间强依赖、串行生成的代表是 Boosting，无强依赖、可并行的代表是 Bagging 与随机森林（原书 8.1–8.3 节，PDF 第 185、187、192 页）。", "chapterId": "ch03"}, {"term": "自助采样（Bootstrap Sampling）", "def": "有放回地抽 $m$ 次得到 $m$ 个样本的采样集；初始集约 63.2% 的样本出现在采样集中，Bagging 以此产生不同子集训练基学习器（原书 2.2.3、8.3.1 节，PDF 第 192 页）。", "chapterId": "ch03"}, {"term": "k-means 平方误差", "def": "$E=\\sum_{i=1}^{k}\\sum_{\\mathbf x\\in C_i}\\lVert\\mathbf x-\\boldsymbol\\mu_i\\rVert_2^2$，刻画簇内样本围绕均值向量的紧密程度；找到最优簇划分是 NP 难问题，算法以迭代方式近似求解（原书 9.4.1 节，PDF 第 216–217 页）。", "chapterId": "ch03"}, {"term": "PAC 可学习（PAC Learnable）", "def": "对 $0<\\varepsilon,\\delta<1$，存在算法与多项式规模 $m$，使以至少 $1-\\delta$ 的概率输出假设误差不超过 $\\varepsilon$；样本复杂度是满足该条件所需的最小 $m$（原书 12.2 节，PDF 第 283–284 页）。", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [], "flashcards": []}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.37<\/div><h1>第 2–4 章：模型评估与选择、线性模型、决策树<\/h1>\n<blockquote>对应原书第 2 章模型评估与选择、第 3 章线性模型、第 4 章决策树（PDF 第 37–110 页；印刷页码 = PDF 页码 − 14）。页码偏移已用第 2 章首节核对：印刷第 23 章首页对应 PDF 第 37 页。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n从一张混淆矩阵算出错误率、精度、查准率 P、查全率 R 与 F1，并按 ROC 坐标估算 AUC，说清 AUC 衡量的是排序质量而非准确率；\n<\/li><li>\n写出平方损失的矩阵形式，推到正规方程闭式解并解释列空间几何含义；写出对数几率回归的对数似然目标与梯度；\n<\/li><li>\n用信息熵、信息增益、增益率、基尼指数比较两个候选划分属性，说出信息增益对取值数目多的属性偏好在哪一步，以及预剪枝、后剪枝各自控制什么风险。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>评估先于调参：只有把经验误差与泛化误差分开，用留出法、交叉验证在独立样本上量出指标，选出的模型才可能在新样本上生效；线性模型把预测写成属性的线性组合，用最小二乘或对数似然求解；决策树沿属性递归划分，靠纯度准则决定每次选哪个属性切开样本集。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 经验误差、过拟合与性能度量<\/h3>\n<p>原书 2.1 节把分类错误样本数占样本总数的比例称为错误率（error rate），<span class=\"katex-inline\">E=a/m<\/span>，<span class=\"katex-inline\">1-a/m<\/span> 为精度（accuracy）（PDF 第 37 页）。训练集上的误差叫训练误差（training error）或经验误差（empirical error），新样本上的误差叫泛化误差（generalization error）。学习器把训练样本自身特点当成一般规律，导致泛化性能下降，即过拟合（overfitting）；尚未学好一般规律则为欠拟合（underfitting）。<\/p>\n<p>二分类结果按真实类别与预测类别排成混淆矩阵：真正例 TP、假正例 FP、真反例 TN、假反例 FN，四项之和等于样例总数。查准率 <span class=\"katex-inline\">P=TP/(TP+FP)<\/span>，查全率 <span class=\"katex-inline\">R=TP/(TP+FN)<\/span>（原书 2.3.2 节，PDF 第 44 页）。两者通常此消彼长：把所有样本都判正例，查全率为 1 而查准率很低；只挑最有把握的样本，查准率高而漏掉不少正例。F1 取调和平均 <span class=\"katex-inline\">F_1=2PR/(P+R)<\/span>。<\/p>\n<p>ROC 曲线以真正例率 <span class=\"katex-inline\">TPR=TP/(TP+FN)<\/span> 为纵轴、假正例率 <span class=\"katex-inline\">FPR=FP/(FP+TN)<\/span> 为横轴（原书 2.3.3 节，PDF 第 47 页）。AUC（Area Under ROC Curve）是曲线下面积，含义是随机取一个正例、一个反例时，正例预测得分高于反例的概率；它不依赖某个固定截断点，量的是模型对样本的排序能力。<\/p>\n<h3>2. 概念 1：经验误差、过拟合与模型评估（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。2.2 节给出数据集划分的三种途径：留出法（hold-out）把数据集拆成训练集与测试集，训练集用于拟合，测试集只用于评估；交叉验证（cross-validation）把数据折成 <span class=\"katex-inline\">k<\/span> 份，轮流取一份做测试、其余做训练，再取 <span class=\"katex-inline\">k<\/span> 次结果平均；自助采样（bootstrap）有放回抽样，约 63.2% 的样本进入采样集。2.6 节从偏差-方差角度理解泛化误差：偏差刻画模型假设与真实规律的差距，方差刻画训练集扰动带来的预测波动，欠拟合对应高偏差，过拟合对应高方差（PDF 第 40 页前后）。<\/p>\n<h3>3. 概念 2：线性模型（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。线性模型（linear model）试图学得 <span class=\"katex-inline\">f(\\mathbf x)=\\mathbf w^\\top\\mathbf x+b<\/span>，<span class=\"katex-inline\">w_j<\/span> 是第 <span class=\"katex-inline\">j<\/span> 个属性的权重，<span class=\"katex-inline\">b<\/span> 是截距（原书 3.1 节，PDF 第 67 页）。回归任务用最小二乘法估计 <span class=\"katex-inline\">\\mathbf w<\/span> 与 <span class=\"katex-inline\">b<\/span>；分类任务把线性输出送入对数几率函数（logistic function）<span class=\"katex-inline\">y=1/(1+e^{-z})<\/span>，把结果压到 <span class=\"katex-inline\">(0,1)<\/span> 作为类后验概率估计，再用极大似然法估计参数（原书 3.2、3.3 节，PDF 第 69、72–73 页）。<\/p>\n<h3>4. 概念 3：决策树（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。决策树（decision tree）基于树结构做分类：叶结点给出类别标记，内部结点对应属性测试，分支对应属性取值。学习的关键是划分选择（原书 4.2 节，PDF 第 89 页）：希望分支结点样本尽可能同类，即纯度（purity）越来越高。信息熵度量纯度，信息增益衡量划分带来的纯度提升；增益率对取值数目多的偏好做了修正；CART 决策树用基尼指数选属性。剪枝（pruning）是对付过拟合的主要手段：预剪枝在划分前估计泛化性能，不能提升就停止；后剪枝先生成完整树，再自底向上考察是否把子树替换成叶结点（原书 4.3 节，PDF 第 93 页）。<\/p>\n<h2>推导一（推演）：混淆矩阵上的 P、R、F1 与 AUC 估算<\/h2>\n<p>设测试集 100 个样本，其中正例 30、反例 70。模型判出 TP=24，FP=6，FN=6，TN=64，四项合计 100。<\/p>\n<p>查准率 <span class=\"katex-inline\">P=24/(24+6)=0.800<\/span>；查全率 <span class=\"katex-inline\">R=24/(24+6)=0.800<\/span>；F1 <span class=\"katex-inline\">=2\\times0.800\\times0.800/(0.800+0.800)=0.800<\/span>。再算 ROC 坐标：<span class=\"katex-inline\">TPR=24/(24+6)=0.800<\/span>，<span class=\"katex-inline\">FPR=6/(6+64)=0.086<\/span>。若另一截断点得到 <span class=\"katex-inline\">TPR=0.500<\/span>、<span class=\"katex-inline\">FPR=0.020<\/span>，基于有限样例的 ROC 由相邻点线段连接；AUC 按梯形求和：相邻点 <span class=\"katex-inline\">(x_1,y_1)<\/span>、<span class=\"katex-inline\">(x_2,y_2)<\/span> 之间贡献 <span class=\"katex-inline\">\\frac{y_1+y_2}{2}(x_2-x_1)<\/span>。把所有梯形面积累加，即得近似 AUC。注意 AUC 不是准确率：本例准确率 <span class=\"katex-inline\">(24+64)/100=0.880<\/span>，而 AUC 描述的是任意正负样本对的得分排序胜率，两者口径不同。<\/p>\n<h2>推导二（推演）：最小二乘正规方程与列空间几何<\/h2>\n<p>把偏置并入权重，记 <span class=\"katex-inline\">\\hat{\\mathbf w}=(\\mathbf w;b)<\/span>，设计矩阵 <span class=\"katex-inline\">X\\in\\mathbb R^{m\\times(d+1)}<\/span> 每行末列恒为 1，标签向量 <span class=\"katex-inline\">\\mathbf y\\in\\mathbb R^m<\/span>。平方损失 <span class=\"katex-inline\">E_{\\hat{\\mathbf w}}=(\\mathbf y-X\\hat{\\mathbf w})^\\top(\\mathbf y-X\\hat{\\mathbf w})<\/span>。展开后对 <span class=\"katex-inline\">\\hat{\\mathbf w}<\/span> 求梯度，二次型 <span class=\"katex-inline\">\\hat{\\mathbf w}^\\top X^\\top X\\hat{\\mathbf w}<\/span> 的梯度为 <span class=\"katex-inline\">2X^\\top X\\hat{\\mathbf w}<\/span>，一次项梯度为 <span class=\"katex-inline\">-2X^\\top\\mathbf y<\/span>，故<\/p>\n<div class=\"katex-block\">\\nabla_{\\hat{\\mathbf w}}E=2X^\\top(X\\hat{\\mathbf w}-\\mathbf y).<\/div>\n<p>令梯度为零得 <span class=\"katex-inline\">X^\\top X\\hat{\\mathbf w}=X^\\top\\mathbf y<\/span>；当 <span class=\"katex-inline\">X^\\top X<\/span> 满秩或正定，<span class=\"katex-inline\">\\hat{\\mathbf w}^*=(X^\\top X)^{-1}X^\\top\\mathbf y<\/span>（原书 3.2 节，PDF 第 69 页）。几何上，<span class=\"katex-inline\">\\hat{\\mathbf y}=X\\hat{\\mathbf w}<\/span> 落在 <span class=\"katex-inline\">X<\/span> 的列空间内，残差 <span class=\"katex-inline\">\\mathbf y-\\hat{\\mathbf y}<\/span> 与列空间正交；正规方程找到的是列空间中离 <span class=\"katex-inline\">\\mathbf y<\/span> 最近的点。若特征数超过样本数，<span class=\"katex-inline\">X^\\top X<\/span> 不满秩，解析解不唯一，需靠正则化或归纳偏好选出一个解（原书 3.2 节，PDF 第 70 页）。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>只在训练集上评估模型<\/strong>：过拟合的模型经验误差可以为零，但泛化误差未知。没有独立测试集或交叉验证，无法区分&quot;规律学到了&quot;与&quot;训练样本被背下来&quot;，调参方向完全失去依据。\n<\/li><li>\n<strong>把 AUC 当成准确率来比较两个模型<\/strong>：两者口径不同。准确率固定在某个截断点上看判对比例，AUC 看全排序。类别不平衡时，全部判反例的模型准确率很高但 AUC 接近 0.5；按准确率选模型会把排序能力差的模型选出来。\n<\/li><li>\n<strong>决策树不设剪枝、属性可反复划分<\/strong>：结点分支一直分到样本全对，分支数目随样本数增长，训练集自身的噪声被当成规律记下；新样本上稍一扰动就走错分支。预剪枝控制树深，后剪枝在完整树基础上回退，两者都把模型复杂度压回与数据规模相称的范围。\n<\/li><li>\n<strong><span class=\"katex-inline\">X^\\top X<\/span> 不满秩时直接求逆<\/strong>：数值上得到奇异或不稳定的解，权重在共线特征间任意分配；工程上改为正则化最小二乘或迭代求解，并先做特征去相关。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章提供全书的评估语言与第一类可解释模型。第 5–6 章的神经网络、支持向量机同样要靠本章的混淆矩阵、交叉验证与偏差-方差口径做比较；线性模型的&quot;损失→梯度→更新&quot;循环是 BP 算法的蓝本；决策树的纯度准则在第 8 章集成学习中作为基学习器反复出现。下一章进入两层非线性模型：先搭多层前馈网络并推 BP 反向梯度，再把分类边界推到最大间隔超平面。<\/p>", "kind": "chapter", "title": "第 2–4 章：模型评估与选择、线性模型、决策树"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.111<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 2–4 章：模型评估与选择、线性模型、决策树<\/a><\/span><\/div><h1>第 5–6 章：神经网络与支持向量机<\/h1>\n<blockquote>对应原书第 5 章神经网络、第 6 章支持向量机（PDF 第 111–160 页；印刷页码 = PDF 页码 − 14）。第 5 章首节印刷第 97 页对应 PDF 第 111 页，第 6 章首节印刷第 121 页对应 PDF 第 135 页。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01（线性模型、损失与梯度、评估口径）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清多层前馈网络的层间信号流向，写出单样本均方误差，沿链式法则推出隐层到输出层连接权的梯度更新式；\n<\/li><li>\n把 SVM 最大间隔问题写成凸二次规划基本型，经拉格朗日乘子法推到对偶问题，按 KKT 条件判断哪些样本是支持向量；\n<\/li><li>\n解释核函数在对偶问题中替换了哪一步，区分线性可分、非线性可分与软间隔三种情形各自的约束与代价。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>单层感知机只能划分线性可分数据；多层前馈网络靠隐层非线性变换扩大表达能力，BP 算法沿计算图把误差梯度逐层回传更新连接权。支持向量机不在可分的超平面里随便挑一个，而是找位于两类样本&quot;正中间&quot;、对扰动容忍度最好的最大间隔超平面；对偶形式让求解只依赖样本内积，核函数由此把线性边界推广到高维特征空间。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 多层前馈神经网络<\/h3>\n<p>原书 5.2 节给出多层前馈神经网络（multi-layer feedforward neural networks）结构：输入层接收外界输入，隐层与输出层包含功能神经元，网络拓扑不含环或回路（PDF 第 115 页）。输入层神经元不做函数处理；隐层与输出层神经元对信号加工，最终结果由输出层给出。网络学习过程就是根据训练数据调整神经元之间的连接权（connection weight）与每个功能神经元的阈值；学到的东西蕴涵在连接权与阈值中。<\/p>\n<h3>2. 概念 4：误差逆传播算法（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。BP（error BackPropagation）算法基于梯度下降策略，以目标的负梯度方向对参数调整（原书 5.3 节，PDF 第 116 页）。对训练例 <span class=\"katex-inline\">(\\mathbf x_k,\\mathbf y_k)<\/span>，设网络输出 <span class=\"katex-inline\">\\hat{\\mathbf y}_k<\/span>，均方误差 <span class=\"katex-inline\">E_k=\\frac12\\sum_{j=1}^l(\\hat y_{kj}-y_{kj})^2<\/span>，系数 <span class=\"katex-inline\">1/2<\/span> 为后续求导便利。任意参数 <span class=\"katex-inline\">v<\/span> 的更新估计为 <span class=\"katex-inline\">v\\leftarrow v+\\Delta v<\/span>，其中 <span class=\"katex-inline\">\\Delta v=-\\eta\\,\\partial E_k/\\partial v<\/span>，<span class=\"katex-inline\">\\eta<\/span> 为学习率。推导从隐层到输出层的连接权 <span class=\"katex-inline\">\\omega_{hj}<\/span> 入手，再沿链式法则把误差信号传回隐层。<\/p>\n<h3>3. 概念 5：支持向量机的间隔与对偶（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。给定训练集 <span class=\"katex-inline\">D=\\{(\\mathbf x_i,y_i)\\}<\/span>，<span class=\"katex-inline\">y_i\\in\\{-1,+1\\}<\/span>，样本空间中能分开两类的超平面可能有很多。点到超平面 <span class=\"katex-inline\">(\\mathbf w,b)<\/span> 的距离为 <span class=\"katex-inline\">r=|\\mathbf w^\\top\\mathbf x+b|/\\lVert\\mathbf w\\rVert<\/span>（原书 6.1 节，PDF 第 136 页）。距离超平面最近、使约束取等号的样本称为支持向量（support vector），两个异类支持向量到超平面的距离之和 <span class=\"katex-inline\">2/\\lVert\\mathbf w\\rVert<\/span> 即间隔（margin）。最大间隔问题等价于最小化 <span class=\"katex-inline\">\\frac12\\lVert\\mathbf w\\rVert^2<\/span>，约束 <span class=\"katex-inline\">y_i(\\mathbf w^\\top\\mathbf x_i+b)\\ge 1<\/span>。<\/p>\n<h3>4. 概念 6：核方法与软间隔（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。原始空间线性不可分时，把样本映射到更高维特征空间 <span class=\"katex-inline\">\\phi(\\mathbf x)<\/span>，使样本在特征空间内线性可分（原书 6.3 节，PDF 第 140 页）。对偶问题中样本之间只以内积 <span class=\"katex-inline\">\\mathbf x_i^\\top\\mathbf x_j<\/span> 出现，核函数 <span class=\"katex-inline\">\\kappa(\\mathbf x_i,\\mathbf x_j)=\\phi(\\mathbf x_i)^\\top\\phi(\\mathbf x_j)<\/span> 直接给出特征空间内积，不必显式写出映射。现实数据常有噪声，严格可分约束会把个别异常样本当成边界；软间隔（soft margin）允许部分样本违反间隔约束，引入松弛变量与惩罚系数 <span class=\"katex-inline\">C<\/span>，在间隔宽度与误分代价之间折中（原书 6.4 节，PDF 第 146 页前后）。<\/p>\n<h2>推导一（推演）：BP 连接权梯度的链式展开<\/h2>\n<p>记隐层第 <span class=\"katex-inline\">h<\/span> 个神经元输出 <span class=\"katex-inline\">b_h<\/span>，输出层第 <span class=\"katex-inline\">j<\/span> 个神经元输入 <span class=\"katex-inline\">\\beta_j=\\sum_h\\omega_{hj}b_h<\/span>，输出 <span class=\"katex-inline\">\\hat y_j=f(\\beta_j-\\theta_j)<\/span>，<span class=\"katex-inline\">f<\/span> 为 Sigmoid 函数，<span class=\"katex-inline\">f&#x27;(z)=f(z)(1-f(z))<\/span>。单样本误差 <span class=\"katex-inline\">E=\\frac12\\sum_j(\\hat y_j-y_j)^2<\/span>。<\/p>\n<p>对连接权 <span class=\"katex-inline\">\\omega_{hj}<\/span> 求偏导：<span class=\"katex-inline\">\\partial E/\\partial\\omega_{hj}=(\\partial E/\\partial\\hat y_j)(\\partial\\hat y_j/\\partial\\beta_j)(\\partial\\beta_j/\\partial\\omega_{hj})<\/span>。第一项 <span class=\"katex-inline\">\\partial E/\\partial\\hat y_j=\\hat y_j-y_j<\/span>；第二项由 Sigmoid 导数得 <span class=\"katex-inline\">\\hat y_j(1-\\hat y_j)<\/span>；第三项 <span class=\"katex-inline\">\\partial\\beta_j/\\partial\\omega_{hj}=b_h<\/span>。合并记输出层误差项 <span class=\"katex-inline\">g_j=\\hat y_j(1-\\hat y_j)(\\hat y_j-y_j)<\/span>，则 <span class=\"katex-inline\">\\Delta\\omega_{hj}=-\\eta g_j b_h<\/span>。隐层权重的梯度再把 <span class=\"katex-inline\">g_j<\/span> 经 <span class=\"katex-inline\">\\omega_{hj}<\/span> 回传到隐层神经元，乘以隐层输出的 Sigmoid 导数得到隐层误差项 <span class=\"katex-inline\">e_h<\/span>，更新规则与输出层同形。整条链上每一步只用到本地偏导数，不需要对网络整体写出闭合导数。<\/p>\n<h2>推导二（推演）：SVM 基本型到对偶问题<\/h2>\n<p>最大间隔问题写成<\/p>\n<div class=\"katex-block\">\\min_{\\mathbf w,b}\\ \\frac12\\lVert\\mathbf w\\rVert^2\\quad\\text{s.t.}\\ y_i(\\mathbf w^\\top\\mathbf x_i+b)\\ge 1,\\ i=1,\\dots,m.<\/div>\n<p>对每条约束引入拉格朗日乘子 <span class=\"katex-inline\">\\alpha_i\\ge 0<\/span>，拉格朗日函数<\/p>\n<div class=\"katex-block\">L(\\mathbf w,b,\\boldsymbol\\alpha)=\\frac12\\lVert\\mathbf w\\rVert^2+\\sum_i\\alpha_i\\big(1-y_i(\\mathbf w^\\top\\mathbf x_i+b)\\big).<\/div>\n<p>令 <span class=\"katex-inline\">L<\/span> 对 <span class=\"katex-inline\">\\mathbf w<\/span> 和 <span class=\"katex-inline\">b<\/span> 的偏导为零：<span class=\"katex-inline\">\\mathbf w=\\sum_i\\alpha_i y_i\\mathbf x_i<\/span>，<span class=\"katex-inline\">0=\\sum_i\\alpha_i y_i<\/span>。把这两个等式代回 <span class=\"katex-inline\">L<\/span>，消去 <span class=\"katex-inline\">\\mathbf w<\/span> 与 <span class=\"katex-inline\">b<\/span>，得到对偶问题<\/p>\n<div class=\"katex-block\">\\max_{\\boldsymbol\\alpha}\\ \\sum_i\\alpha_i-\\frac12\\sum_{i}\\sum_j\\alpha_i\\alpha_j y_i y_j\\mathbf x_i^\\top\\mathbf x_j\\quad\\text{s.t.}\\ \\sum_i\\alpha_i y_i=0,\\ \\alpha_i\\ge 0.<\/div>\n<p>对偶解出 <span class=\"katex-inline\">\\boldsymbol\\alpha<\/span> 后，模型 <span class=\"katex-inline\">f(\\mathbf x)=\\sum_i\\alpha_i y_i\\mathbf x_i^\\top\\mathbf x+b<\/span>。KKT 条件要求 <span class=\"katex-inline\">\\alpha_i\\ge 0<\/span>、<span class=\"katex-inline\">y_i f(\\mathbf x_i)-1\\ge 0<\/span>、<span class=\"katex-inline\">\\alpha_i(y_i f(\\mathbf x_i)-1)=0<\/span>（原书 6.2 节，PDF 第 137–138 页）：<span class=\"katex-inline\">\\alpha_i=0<\/span> 的样本不出现在求和中，对模型没有影响；<span class=\"katex-inline\">\\alpha_i&gt;0<\/span> 的样本必有 <span class=\"katex-inline\">y_i f(\\mathbf x_i)=1<\/span>，即落在间隔边界上。支持向量只是这些 <span class=\"katex-inline\">\\alpha_i&gt;0<\/span> 的样本，不是全部训练样本。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>BP 中隐层误差信号不回传、只更新输出层权重<\/strong>：隐层连接权保持初始值不变，网络退化为&quot;固定随机特征 + 单层线性分类器&quot;，隐层学不到有用变换；训练误差长期停在欠拟合水平。链式法则断掉一层，后面所有隐层参数都收不到梯度。\n<\/li><li>\n<strong>SVM 不要求间隔最大化，只找一个能分开训练集的超平面<\/strong>：可分超平面有无穷多个，紧贴某一类样本的边界对局部扰动敏感，新样本稍偏就越界；最大间隔准则把&quot;容忍度&quot;量化成间隔宽度，选到两类中间的稳健边界。\n<\/li><li>\n<strong>非线性可分数据上直接套线性核对偶、不做特征映射<\/strong>：对偶内积在原空间计算，线性超平面无法分开异或型问题，对偶优化要么无解要么只能给出严重误分的边界；核映射把样本抬到高维空间后再求超平面，对偶目标里的内积被核函数替代。\n<\/li><li>\n<strong>去掉软间隔约束、坚持所有样本严格满足 <span class=\"katex-inline\">y_i(\\mathbf w^\\top\\mathbf x_i+b)\\ge 1<\/span><\/strong>：个别噪声样本会把边界拉向自己，间隔被压得很窄，模型对训练噪声敏感；松弛变量允许越界样本付出罚分代价，换取整体间隔更宽、泛化更稳。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章两条线索在后续章节汇合：BP 训练的神经网络是第 8 章集成学习中常用的基学习器；SVM 的对偶与核思想在第 13 章半监督 SVM 中再次出现。本章用到的梯度下降循环来自第 3 章线性模型，评估优劣仍用第 2 章的 P/R、ROC 与交叉验证口径。下一章转向概率框架与组合策略：先按贝叶斯决策论估后验概率，再看多个弱学习器如何集成，进而进入无监督的聚类划分。<\/p>", "kind": "chapter", "title": "第 5–6 章：神经网络与支持向量机"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.161<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 5–6 章：神经网络与支持向量机<\/a><\/span><\/div><h1>第 7–9 章：贝叶斯分类器、集成学习与聚类<\/h1>\n<blockquote>对应原书第 7 章贝叶斯分类器、第 8 章集成学习、第 9 章聚类（PDF 第 161–238 页；印刷页码 = PDF 页码 − 14）。第 7 章首节印刷第 147 页对应 PDF 第 161 页，第 8 章印刷第 171 页对应 PDF 第 185 页，第 9 章印刷第 197 页对应 PDF 第 211 页。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch02（梯度更新、线性与非线性边界、评估指标）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出贝叶斯决策论的期望风险形式，在条件独立假设下推出朴素贝叶斯判定式，说明拉普拉斯修正解决哪类零概率问题；\n<\/li><li>\n区分 Bagging 与 Boosting 的个体学习器生成机制，推得 AdaBoost 基学习器权重 <span class=\"katex-inline\">\\alpha_t=\\frac12\\ln((1-\\varepsilon_t)/\\varepsilon_t)<\/span> 与样本权重更新方向；\n<\/li><li>\n写出 k-means 的平方误差目标函数，描述簇分配与均值更新两步迭代，解释目标函数为何单调下降，以及算法对初始均值向量的敏感点。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>贝叶斯分类器在概率框架下按后验概率做决策：直接估计类条件概率代价过高，朴素贝叶斯引入属性条件独立假设把联合条件概率拆成单属性乘积；集成学习把多个&quot;好而不同&quot;的个体学习器组合起来，Bagging 靠自助采样并行产生差异，Boosting 靠串行加权逐步纠正前序错误；聚类在无标记样本上按样本相似度划簇，k-means 以簇内平方误差最小为目标，交替分配样本与更新均值。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 贝叶斯决策论与朴素贝叶斯<\/h3>\n<p>原书 7.1 节把贝叶斯决策论（Bayesian decision theory）作为概率框架下实施决策的基本方法：在所有相关概率已知的理想情形下，基于后验概率 <span class=\"katex-inline\">P(c|\\mathbf x)<\/span> 和误判损失选择最优类别标记（PDF 第 161 页）。估计类条件概率 <span class=\"katex-inline\">P(\\mathbf x|c)<\/span> 时，<span class=\"katex-inline\">d<\/span> 个二值属性就有 <span class=\"katex-inline\">2^d<\/span> 种样本取值，远大于训练样本数，直接用频率估计不可行。7.2 节的极大似然估计先假定概率分布形式，再用训练样本估计分布参数。<\/p>\n<h3>2. 概念 7：朴素贝叶斯分类器（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。朴素贝叶斯分类器（naive Bayes classifier）假设各属性在类别给定条件下相互独立，于是<\/p>\n<div class=\"katex-block\">P(c|\\mathbf x)\\propto P(c)\\prod_{j=1}^d P(x_j|c),<\/div>\n<p>判定取后验最大的类别；<span class=\"katex-inline\">P(\\mathbf x)<\/span> 对所有类别相同，比较后验时可略去（原书 7.3 节，PDF 第 165 页）。训练集中未出现的属性取值会把概率估成零，连带把整个后验压成零；拉普拉斯修正（Laplacian correction）在先验与条件概率的分子各加 1、分母加上类别数或取值数，避免&quot;未被观测到&quot;被当成&quot;概率为零&quot;（PDF 第 167 页）。<\/p>\n<h3>3. 概念 8：集成学习（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。集成学习（ensemble learning）先产生一组个体学习器（individual learner），再用某种策略结合（原书 8.1 节，PDF 第 185 页）。个体学习器间存在强依赖、必须串行生成的是 Boosting；不存在强依赖、可同时生成的是 Bagging 与随机森林（原书 8.2 节，PDF 第 187 页）。AdaBoost 从初始分布训练第一个基学习器，之后每轮根据前序基学习器表现调整样本分布：判错的样本后续受到更多关注，再按调整后的分布训练下一个基学习器，最终把 <span class=\"katex-inline\">T<\/span> 个基学习器加权结合。<\/p>\n<h3>4. 概念 9：k-means 原型聚类（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。聚类（clustering）在无标记样本上揭示数据内在性质与规律（原书 9.1 节，PDF 第 211 页）。k-means 算法针对簇划分 <span class=\"katex-inline\">C=\\{C_1,\\dots,C_k\\}<\/span> 最小化平方误差<\/p>\n<div class=\"katex-block\">E=\\sum_{i=1}^k\\sum_{\\mathbf x\\in C_i}\\lVert\\mathbf x-\\boldsymbol\\mu_i\\rVert_2^2,<\/div>\n<p><span class=\"katex-inline\">\\boldsymbol\\mu_i<\/span> 为簇 <span class=\"katex-inline\">i<\/span> 的均值向量（原书 9.4.1 节，PDF 第 216 页）。找到最优簇划分需考察所有可能划分，是 NP 难问题；算法从随机初始均值向量出发，交替执行簇分配（样本归入最近均值向量）与均值更新（重算各簇均值），直到均值不再变化。<\/p>\n<h2>推导一（推演）：AdaBoost 基学习器权重与样本更新<\/h2>\n<p>设第 <span class=\"katex-inline\">t<\/span> 轮基学习器 <span class=\"katex-inline\">h_t<\/span> 在分布 <span class=\"katex-inline\">D_t<\/span> 上的分类误差率 <span class=\"katex-inline\">\\varepsilon_t=P_{\\mathbf x\\sim D_t}(h_t(\\mathbf x)\\neq f(\\mathbf x))<\/span>。AdaBoost 从指数损失 <span class=\"katex-inline\">E_{\\mathbf x\\sim D_t}[e^{-f(\\mathbf x)\\alpha_t h_t(\\mathbf x)}]<\/span> 出发，按判对、判错拆成两项：<\/p>\n<div class=\"katex-block\">E=e^{-\\alpha_t}(1-\\varepsilon_t)+e^{\\alpha_t}\\varepsilon_t.<\/div>\n<p>对 <span class=\"katex-inline\">\\alpha_t<\/span> 求导并令其为零：<\/p>\n<div class=\"katex-block\">-e^{-\\alpha_t}(1-\\varepsilon_t)+e^{\\alpha_t}\\varepsilon_t=0\\ \\Rightarrow\\ e^{2\\alpha_t}=(1-\\varepsilon_t)/\\varepsilon_t,<\/div>\n<p>解得 <span class=\"katex-inline\">\\alpha_t=\\frac12\\ln\\frac{1-\\varepsilon_t}{\\varepsilon_t}<\/span>（原书 8.2 节，PDF 第 189 页）。误差率小于 0.5 时 <span class=\"katex-inline\">\\alpha_t&gt;0<\/span>；基学习器越好，权重越大。样本分布按<\/p>\n<div class=\"katex-block\">D_{t+1}(\\mathbf x_i)\\propto D_t(\\mathbf x_i)e^{-\\alpha_t f(\\mathbf x_i)h_t(\\mathbf x_i)}<\/div>\n<p>更新：判对时 <span class=\"katex-inline\">f h=+1<\/span>，指数为负，权重下降；判错时 <span class=\"katex-inline\">f h=-1<\/span>，指数为正，权重上升。归一化因子 <span class=\"katex-inline\">Z_t<\/span> 保证新分布概率和为 1。这个方向不能写反：把判错样本权重调低，后续基学习器会重复漏掉难样本，集成误差无法下降。<\/p>\n<h2>推导二（推演）：k-means 目标函数的单调下降<\/h2>\n<p>固定均值向量 <span class=\"katex-inline\">\\boldsymbol\\mu_i<\/span>，平方误差 <span class=\"katex-inline\">E=\\sum_i\\sum_{\\mathbf x\\in C_i}\\lVert\\mathbf x-\\boldsymbol\\mu_i\\rVert^2<\/span> 对样本分配是逐项独立的：每个样本 <span class=\"katex-inline\">\\mathbf x_j<\/span> 归入使 <span class=\"katex-inline\">\\lVert\\mathbf x_j-\\boldsymbol\\mu_i\\rVert^2<\/span> 最小的簇，分配步骤不会让 <span class=\"katex-inline\">E<\/span> 增大。固定簇划分后，<span class=\"katex-inline\">E<\/span> 对 <span class=\"katex-inline\">\\boldsymbol\\mu_i<\/span> 求导：<span class=\"katex-inline\">\\partial E/\\partial\\boldsymbol\\mu_i=-2\\sum_{\\mathbf x\\in C_i}(\\mathbf x-\\boldsymbol\\mu_i)<\/span>，令其为零得 <span class=\"katex-inline\">\\boldsymbol\\mu_i=\\frac1{|C_i|}\\sum_{\\mathbf x\\in C_i}\\mathbf x<\/span>，即簇内均值；在该簇内，均值使到各样本距离平方和最小，更新步骤也不会让 <span class=\"katex-inline\">E<\/span> 增大。两步交替，<span class=\"katex-inline\">E<\/span> 单调不增且有下界 0，故算法在有限步内收敛到某个局部极小；收敛点依赖初始均值向量，不同初值可能落到不同局部极小。EM 视角下，E 步按后验归属完成簇分配，M 步估计簇均值，迭代结构与高斯混合模型一致。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>去掉属性条件独立假设，直接估计联合条件概率<\/strong>：<span class=\"katex-inline\">P(x_1,\\dots,x_d|c)<\/span> 的组合数随 <span class=\"katex-inline\">d<\/span> 指数增长，样本稀疏使多数组合频率为零；朴素假设用偏差换可估计性，牺牲一点联合结构信息，换取在小样本上能算出概率。\n<\/li><li>\n<strong>Boosting 各轮使用同一份固定样本分布<\/strong>：前序基学习器判错的难样本在后续轮次权重不变，错误被反复犯在同一批样本上；调整分布的作用就是把注意力向后序难样本转移，串行纠正前序偏差。\n<\/li><li>\n<strong>Bagging 把所有基学习器在同一个全量数据集上训练<\/strong>：缺少采样差异，个体学习器高度相似，集成多样性不足；自助采样让各基学习器看到不同样本子集，再结合投票或平均，才能降低方差。\n<\/li><li>\n<strong>k-means 初始均值向量固定取同一点或取在同一簇内<\/strong>：初始偏置会被后续迭代放大，可能把一个真实簇劈成两半，或把两个簇并入一个；算法对初值敏感的具体表现是换一组初始点，最终簇划分与目标函数值都不同。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>贝叶斯概率估计为第 10 章最近邻与度量学习提供后验视角；集成学习的基学习器可选用第 4 章决策树或第 5 章 BP 网络，多样性与准确性的权衡呼应第 2 章偏差-方差分解；聚类是无监督主线，第 10 章降维先压缩特征空间，再在低维空间内度量样本距离。下一章进入降维、特征选择与学习理论：先把投影方向的方差与重构误差推到同一个优化目标，再区分特征选择机制与稀疏正则化，再用 PAC 框架刻画&quot;能不能学、需要多少样本&quot;。<\/p>", "kind": "chapter", "title": "第 7–9 章：贝叶斯分类器、集成学习与聚类"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.240<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 7–9 章：贝叶斯分类器、集成学习与聚类<\/a><\/span><\/div><h1>第 10–12 章：降维与度量学习、特征选择与稀疏学习、计算学习理论<\/h1>\n<blockquote>对应原书第 10 章降维与度量学习、第 11 章特征选择与稀疏学习、第 12 章计算学习理论（PDF 第 240–306 页；印刷页码 = PDF 页码 − 14）。第 11 章首节印刷第 247 页对应 PDF 第 261 页，第 12 章印刷第 267 页对应 PDF 第 281 页。第 16 章强化学习在本书作为选读延伸（PDF 第 385 页起）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★★ | <strong>前置<\/strong>：ch03（聚类、概率与集成视角）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n从最近重构性与最大可分性两条路径推出 PCA 的同一个优化目标，说清投影方差与重构误差为何等价；\n<\/li><li>\n区分过滤式、包裹式、嵌入式三类特征选择机制的评估对象与计算开销，用几何方式解释 L1 范数为何更易产生稀疏解；\n<\/li><li>\n按 PAC 定义写出可辨识条件，说明误差 ε、置信度 δ、样本复杂度与假设空间复杂度各自约束什么，偏差-方差与奥卡姆剃刀在理论框架中对应哪一层。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>高维数据中大量特征彼此相关，直接计算距离会受噪声维度干扰：PCA 找一组标准正交投影基，使投影后方差最大或重构距离最小，两条推导落到同一组协方差矩阵特征向量；特征选择从原始属性集中挑出相关子集，过滤式先选特征再训练模型，包裹式以学习器交叉验证误差为准则反复训练，嵌入式把选择过程嵌入模型优化；计算学习理论用概率近似正确（PAC）框架回答：什么任务在多少样本下能以多大把握学到误差不超过 ε 的假设。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 降维与最近邻<\/h3>\n<p>原书 10.1 节从最近邻分类器切入：给定测试样本 <span class=\"katex-inline\">\\mathbf x<\/span>，其最近邻样本为 <span class=\"katex-inline\">\\mathbf z<\/span>，分类出错概率是两者类别标记不同的概率（PDF 第 240 页）。在样本独立同分布、任意小邻域内能找到训练样本的假设下，最近邻分类器泛化错误率趋近贝叶斯最优分类器错误率的两倍左右。高维空间中距离度量被无关维度稀释，这是降维与度量学习的动机：把数据压到低维空间，再在低维内做距离比较。<\/p>\n<h3>2. 概念 10：主成分分析 PCA（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。PCA（Principal Components Analysis）有两条等价推导路径：最近重构性要求样本点到投影超平面的距离足够近，最大可分性要求样本在超平面上的投影尽可能分开（原书 10.3 节，PDF 第 244 页）。中心化后假设投影坐标系为标准正交基 <span class=\"katex-inline\">\\{\\mathbf w_1,\\dots,\\mathbf w_d\\}<\/span>，丢弃部分坐标后由低维投影重构原样本；最小化重构距离与最大化投影方差分别得到优化目标，二者通过协方差矩阵的特征值分解等价。实践中常通过奇异值分解代替协方差矩阵的特征值分解（PDF 第 245 页）。<\/p>\n<h3>3. 概念 11：特征选择与稀疏学习（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c11.md\" target=\"_blank\" rel=\"noopener\">概念 c11<\/a>。特征选择（feature selection）从给定属性集合中选出相关特征子集；相关特征（relevant feature）对当前学习任务有用，无关特征（irrelevant feature）没用（原书 11.1 节，PDF 第 261 页）。子集评价可用信息增益衡量特征子集划分与标记划分的差异；选择机制分三类：过滤式（filter）先选特征再训练学习器，选择过程与后续学习器无关；包裹式（wrapper）在特征子集上通过交叉验证估计学习器误差，计算开销大；嵌入式（embedding）把特征选择直接嵌入模型优化过程，决策树划分属性、带 L1 正则的线性模型都属此类（原书 11.2、11.3 节，PDF 第 263、265 页）。稀疏解的额外好处来自范数几何：L1 范数正则化比 L2 更易求得非零分量更少的权重（原书 11.4 节，PDF 第 266 页）。<\/p>\n<h3>4. 概念 12：PAC 学习理论（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c12.md\" target=\"_blank\" rel=\"noopener\">概念 c12<\/a>。计算学习理论（computational learning theory）分析学习任务的困难本质，为算法提供理论保证（原书 12.1 节，PDF 第 281 页）。样本服从隐含未知分布 <span class=\"katex-inline\">\\mathcal D<\/span>，训练样本独立同分布采样。PAC 辨识要求：对 <span class=\"katex-inline\">0&lt;\\varepsilon,\\delta&lt;1<\/span>、所有 <span class=\"katex-inline\">c\\in\\mathcal C<\/span> 和分布 <span class=\"katex-inline\">\\mathcal D<\/span>，算法输出假设 <span class=\"katex-inline\">h<\/span> 满足 <span class=\"katex-inline\">P(E(h)\\le\\varepsilon)\\ge 1-\\delta<\/span>（原书 12.2 节，PDF 第 283 页）。PAC 可学习要求存在多项式规模的样本数 <span class=\"katex-inline\">m<\/span>；样本复杂度（sample complexity）是满足条件所需的最小 <span class=\"katex-inline\">m<\/span>。假设空间复杂度是 PAC 学习的关键因素：候选假设越多，要以高置信度排除坏假设所需样本越多。<\/p>\n<h2>推导一（推演）：从重构距离到协方差特征值<\/h2>\n<p>设数据已中心化 <span class=\"katex-inline\">\\sum_i\\mathbf x_i=0<\/span>，投影基标准正交 <span class=\"katex-inline\">\\mathbf w_j^\\top\\mathbf w_k=0<\/span>、<span class=\"katex-inline\">\\lVert\\mathbf w_j\\rVert=1<\/span>。样本 <span class=\"katex-inline\">\\mathbf x_i<\/span> 在低维坐标 <span class=\"katex-inline\">z_{ij}=\\mathbf w_j^\\top\\mathbf x_i<\/span>，重构 <span class=\"katex-inline\">\\hat{\\mathbf x}_i=\\sum_{j=1}^{d&#x27;}z_{ij}\\mathbf w_j<\/span>。重构距离平方和<\/p>\n<div class=\"katex-block\">\\sum_i\\lVert\\mathbf x_i-\\hat{\\mathbf x}_i\\rVert^2=\\sum_i\\lVert\\mathbf x_i\\rVert^2-2\\sum_{i}\\sum_{j=1}^{d'}z_{ij}\\mathbf w_j^\\top\\mathbf x_i+\\mathrm{const},<\/div>\n<p>利用基的正交性整理，保留与基有关的项 <span class=\"katex-inline\">-\\mathrm{tr}(W^\\top XX^\\top W)<\/span>。最近重构性要求最小化该距离，即在 <span class=\"katex-inline\">W^\\top W=I<\/span> 约束下最大化 <span class=\"katex-inline\">\\mathrm{tr}(W^\\top XX^\\top W)<\/span>。从最大可分性出发，投影方差 <span class=\"katex-inline\">\\sum_i\\lVert W^\\top\\mathbf x_i\\rVert^2=\\mathrm{tr}(W^\\top XX^\\top W)<\/span>，最大化投影方差得到同一目标。对 <span class=\"katex-inline\">XX^\\top<\/span> 做特征值分解，最大 <span class=\"katex-inline\">d&#x27;<\/span> 个特征值对应的特征向量即主成分方向（原书 10.3 节，PDF 第 244–245 页）。<\/p>\n<h2>推导二（推演）：L1 与 L2 正则化的几何对照<\/h2>\n<p>带正则项的线性回归目标为 <span class=\"katex-inline\">E=\\sum_i(\\mathbf w^\\top\\mathbf x_i-y_i)^2+\\lambda\\lVert\\mathbf w\\rVert_q^q<\/span>。二维情形画出损失等值线与正则区域：L2 正则区域是圆 <span class=\"katex-inline\">\\omega_1^2+\\omega_2^2\\le r^2<\/span>，等值线与圆周相切通常落在坐标轴外的点，两个分量一般都非零；L1 正则区域是菱形 <span class=\"katex-inline\">|\\omega_1|+|\\omega_2|\\le r<\/span>，角点落在坐标轴上，损失等值线碰到角点时一个分量被压成零。这就是 L1 更易产生稀疏解的几何原因：菱形的棱与角提供了落在坐标轴上的切点，圆形边界没有这样的尖角。L0 范数要求非零分量最少，但不连续、难以优化，实践中常用 L1 范数近似（原书 11.4 节，PDF 第 266 页）。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>PCA 不要求投影基标准正交，允许方向任意相关<\/strong>：主成分方向之间信息重复，同一方差被多个基反复计入，低维坐标不是数据的互不相关压缩；正交约束保证选出的方向各占一块互不重叠的方差。\n<\/li><li>\n<strong>特征选择只用过滤式、完全不看后续学习器<\/strong>：特征与标记的边际相关性高，不等于在具体模型里组合起来有效；过滤式开销低但可能丢掉对某模型关键的弱相关特征。反过来纯包裹式每个候选子集都要交叉验证训练，特征数多时计算量随子集组合爆炸。\n<\/li><li>\n<strong>假设空间无限大或不限定候选假设范围<\/strong>：PAC 意义下要以 <span class=\"katex-inline\">1-\\delta<\/span> 概率排除所有坏假设，候选假设越多所需样本量越大；若空间包含与训练集一致的任意假设，理论上无法保证泛化。奥卡姆剃刀在理论层面对应：在拟合能力相当的假设中优先选择更简单的，降低过拟合风险。\n<\/li><li>\n<strong>把降维当成去掉噪声的万能手段<\/strong>：PCA 保留方差最大的方向，方差大不等于判别信息强；两类样本可能沿方差小的方向分开，保留主成分后判别方向被丢掉。降维前后仍需回到第 2 章的独立测试集上评估分类性能。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章收束全书理论线索：PCA 压缩后的低维空间可直接喂给第 9 章 k-means 聚类；嵌入式特征选择与第 3 章线性模型、第 4 章决策树的属性选择相互对应；PAC 框架为前面所有模型的泛化保证提供理论语言。第 13–16 章（半监督、概率图模型、规则学习、强化学习）是在这套基础上的扩展：强化学习在环境交互中按回报调整策略，属于本书选读内容（PDF 第 385 页起）。<\/p>", "kind": "chapter", "title": "第 10–12 章：降维与度量学习、特征选择与稀疏学习、计算学习理论"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.39<\/div><h1>经验误差、过拟合与模型评估：错误率、P/R/F1、ROC-AUC、交叉验证与偏差-方差<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：原书第 2 章模型评估与选择（PDF 第 37–62 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>模型在训练数据上表现好，不等于在新样本上表现好。若只凭训练集表现挑模型，把训练样本自身噪声背下来的过拟合模型会被误选出来。评估环节要解决的困难是：在不知道新样本分布的前提下，如何用手头数据估计模型的泛化性能，并在多个模型或多组超参数之间做出有依据的选择。没有独立于训练过程的评估口径，后面所有损失优化、结构调整都缺少验收标准。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>误差（error）<\/strong>：学习器实际预测输出与样本真实输出之间的差异。训练集上的误差称训练误差（training error）或经验误差（empirical error），新样本上的误差称泛化误差（generalization error）（原书 2.1 节，PDF 第 37 页）。<\/p>\n<p><strong>过拟合与欠拟合<\/strong>：学习器把训练样本自身特点当成所有潜在样本的一般性质，导致泛化性能下降，称过拟合（overfitting）；对训练样本一般规律尚未学好，称欠拟合（underfitting）。<\/p>\n<p><strong>混淆矩阵四项<\/strong>：二分类任务中，<span class=\"katex-inline\">TP<\/span> 真正例、<span class=\"katex-inline\">FP<\/span> 假正例、<span class=\"katex-inline\">TN<\/span> 真反例、<span class=\"katex-inline\">FN<\/span> 假反例，四项之和等于样例总数（原书 2.3.2 节，PDF 第 44 页）。<\/p>\n<p><strong>查准率与查全率<\/strong>：<span class=\"katex-inline\">P=TP/(TP+FP)<\/span>，<span class=\"katex-inline\">R=TP/(TP+FN)<\/span>。F1 取调和平均 <span class=\"katex-inline\">F_1=2PR/(P+R)<\/span>；一般形式 <span class=\"katex-inline\">F_\\beta<\/span> 用 <span class=\"katex-inline\">\\beta<\/span> 调节查全率相对查准率的重要性。<\/p>\n<p><strong>ROC 与 AUC<\/strong>：纵轴真正例率 <span class=\"katex-inline\">TPR=TP/(TP+FN)<\/span>，横轴假正例率 <span class=\"katex-inline\">FPR=FP/(FP+TN)<\/span>；AUC 是 ROC 曲线下面积，含义为随机取一正一反两样本时正例得分高于反例的概率（原书 2.3.3 节，PDF 第 47–48 页）。<\/p>\n<p><strong>划分途径<\/strong>：留出法把数据拆训练集与测试集；<span class=\"katex-inline\">k<\/span> 折交叉验证把数据折成 <span class=\"katex-inline\">k<\/span> 份轮流测试；自助采样有放回抽样，约 63.2% 样本进入采样集。<\/p>\n<p><strong>偏差-方差<\/strong>：泛化误差可拆为偏差、方差与噪声。偏差刻画模型假设与真实规律的差距，方差刻画训练集扰动带来的预测波动（原书 2.6 节，PDF 第 40 页前后）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>给定混淆矩阵：<span class=\"katex-inline\">TP=8<\/span>，<span class=\"katex-inline\">FP=2<\/span>，<span class=\"katex-inline\">FN=4<\/span>，<span class=\"katex-inline\">TN=16<\/span>，总样本 30。查准率 <span class=\"katex-inline\">P=8/(8+2)=0.800<\/span>；查全率 <span class=\"katex-inline\">R=8/(8+4)\\approx0.667<\/span>；F1 <span class=\"katex-inline\">=2\\times0.800\\times0.667/(0.800+0.667)\\approx0.727<\/span>。准确率 <span class=\"katex-inline\">=(8+16)/30=0.800<\/span>。<\/p>\n<p>ROC 估算：测试样本按预测得分排序，阈值从高到低移动，每纳入一个真正例纵坐标上跳 <span class=\"katex-inline\">1/(TP+FN)<\/span>，每纳入一个假正例横坐标右跳 <span class=\"katex-inline\">1/(FP+TN)<\/span>。相邻点 <span class=\"katex-inline\">(x_1,y_1)<\/span>、<span class=\"katex-inline\">(x_2,y_2)<\/span> 之间梯形面积为 <span class=\"katex-inline\">(y_1+y_2)(x_2-x_1)/2<\/span>，累加即近似 AUC。AUC=1 对应理想排序，0.5 对应随机猜测。<\/p>\n<p>交叉验证的偏差与方差：训练集占比大则模型更接近全量训练结果，但测试集小、评估方差大；测试集大则保真性下降。<span class=\"katex-inline\">k<\/span> 折平均用 <span class=\"katex-inline\">k<\/span> 次评估平滑单次划分的偶然性；测试集规模过小，评估结果本身波动剧烈。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：混淆矩阵口径要求类别可二分为正例/反例；P/R/F1 依赖固定截断点，ROC/AUC 考察全排序；交叉验证假设样本独立同分布。\n<\/li><li>\n<strong>失败案例一：类别不平衡时只看准确率<\/strong>。反例占多数时全部判反例也能得到高准确率，但模型正例识别能力为零；此时应看 R、F1 或 AUC。\n<\/li><li>\n<strong>失败案例二：把 AUC 当准确率<\/strong>。准确率是固定截断点上判对比例，AUC 是排序胜率；两者数值接近纯属巧合，比较模型时口径必须一致。\n<\/li><li>\n<strong>失败案例三：测试集与训练集来自不同采集条件<\/strong>。分布不一致时评估指标不代表真实泛化能力，指标再好也不能外推。\n<\/li><li>\n<strong>边界<\/strong>：偏差-方差分解是理论视角，现实数据中噪声项不可消除；欠拟合靠增强模型容量缓解，过拟合靠正则化、剪枝、增加样本缓解，两者方向不能混。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>精度 vs 查准率<\/strong>：精度（accuracy）对全部样本统计判对比例；查准率只在预测为正例的样本中统计判对比例，口径不同。\n<\/li><li>\n<strong>P-R 曲线 vs ROC 曲线<\/strong>：P-R 纵轴查准率、横轴查全率；ROC 纵轴 TPR、横轴 FPR。类别极不平衡时 P-R 曲线对正例比例更敏感，ROC 可能显得过于乐观。\n<\/li><li>\n<strong>偏差 vs 方差<\/strong>：高偏差对应欠拟合，模型容量不足；高方差对应过拟合，训练集小幅变化就引起预测大幅摆动。\n<\/li><li>\n<strong>留出法 vs 交叉验证<\/strong>：留出法一次划分、计算省，但结果依赖单次划分；交叉验证反复折分、评估更稳，计算量随 <span class=\"katex-inline\">k<\/span> 放大。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置概念：无，本章是全书评估语言的起点。后继：概念 c02 的平方损失与对数似然以本章指标作为验收标准；概念 c08 集成学习的多样性-准确性权衡可放回偏差-方差框架理解；概念 c12 的 PAC 理论把&quot;以多大概率达到多小误差&quot;形式化，是本章经验评估的理论对应物。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（经验误差、过拟合与模型评估：错误率、P/R/F1、ROC-AUC、交叉验证与偏差-方差）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：评估指标的代数来源、ROC 面积估算与偏差-方差分解<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把模型评估讲透，往回追四层前提：<\/p>\n<ol><li>\n<strong>评估对象必须先分清训练误差与泛化误差<\/strong>。若把两者混为一谈，优化目标就变成背下训练集；先定义两类误差，才能解释过拟合为什么是评估问题而不只是优化问题。\n<\/li><li>\n<strong>分类结果要先落到混淆矩阵四项<\/strong>。任何 P、R、F1、TPR、FPR 都从 TP、FP、TN、FN 计数出发；不先约定四项口径，指标公式无法逐项对应。\n<\/li><li>\n<strong>指标分两类口径<\/strong>：固定截断点的指标（P、R、F1、准确率）与考察全排序的指标（ROC、AUC）。前者回答&quot;在这个阈值下判得怎样&quot;，后者回答&quot;样本排得怎样&quot;，推导路径分开。\n<\/li><li>\n<strong>评估稳定性依赖数据划分方式<\/strong>。单次划分结果有偶然性，留出、交叉验证、自助采样各在偏差与方差间折中；理解划分方式才能判断指标波动来自哪里。\n<\/ol>\n<p>依赖链方向：误差定义 → 混淆矩阵计数 → 点指标与排序指标 → 数据划分途径 → 偏差-方差对泛化误差的拆解。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：错误率、精度与混淆矩阵<\/h3>\n<p>设 <span class=\"katex-inline\">m<\/span> 个样本中 <span class=\"katex-inline\">a<\/span> 个分类错误，错误率 <span class=\"katex-inline\">E=a/m<\/span>，精度 <span class=\"katex-inline\">\\mathrm{acc}=1-a/m<\/span>。二分类下把预测与真实的组合排成 <span class=\"katex-inline\">2\\times2<\/span> 矩阵：真实为正例、预测为正例记 <span class=\"katex-inline\">TP<\/span>，真实为反例、预测为正例记 <span class=\"katex-inline\">FP<\/span>，真实为反例、预测为反例记 <span class=\"katex-inline\">TN<\/span>，真实为正例、预测为反例记 <span class=\"katex-inline\">FN<\/span>。计数恒等式 <span class=\"katex-inline\">TP+FP+TN+FN=m<\/span> 用于核对矩阵是否漏计。<\/p>\n<h3>第二步：查准率、查全率与 F1<\/h3>\n<p>查准率 <span class=\"katex-inline\">P=TP/(TP+FP)<\/span>：在所有被预测为正例的样本里，真正例占多少；查全率 <span class=\"katex-inline\">R=TP/(TP+FN)<\/span>：在所有真实正例里，被找出来多少。两者矛盾的来源是同一个截断点：阈值放宽，更多样本进入正例侧，<span class=\"katex-inline\">R<\/span> 上升而混入的 <span class=\"katex-inline\">FP<\/span> 增多拉低 <span class=\"katex-inline\">P<\/span>。<\/p>\n<p>F1 取调和平均 <span class=\"katex-inline\">F_1=2PR/(P+R)<\/span>。调和平均的特点是对较小值敏感：<span class=\"katex-inline\">P<\/span> 与 <span class=\"katex-inline\">R<\/span> 中只要有一个偏低，F1 就被拉低；这与算术平均不同，算术平均会让一项很高掩盖另一项很低。<span class=\"katex-inline\">F_\\beta=\\frac{(1+\\beta^2)PR}{\\beta^2P+R}<\/span>，<span class=\"katex-inline\">\\beta&gt;1<\/span> 更重视查全率，<span class=\"katex-inline\">\\beta&lt;1<\/span> 更重视查准率。<\/p>\n<h3>第三步：ROC 曲线与 AUC 梯形估算<\/h3>\n<p>按预测得分从高到低排序样本，分类阈值依次取每个样本的预测值。起点 <span class=\"katex-inline\">(0,0)<\/span>：每遇到真正例，纵坐标增加 <span class=\"katex-inline\">1/(TP+FN)<\/span>；每遇到假正例，横坐标增加 <span class=\"katex-inline\">1/(FP+TN)<\/span>。把相邻标记点用线段连接即得近似 ROC 曲线。<\/p>\n<p>AUC 按线段下梯形求和。设相邻点 <span class=\"katex-inline\">(x_1,y_1)<\/span>、<span class=\"katex-inline\">(x_2,y_2)<\/span>，该段贡献 <span class=\"katex-inline\">\\frac{y_1+y_2}{2}(x_2-x_1)<\/span>；所有段累加：<\/p>\n<div class=\"katex-block\">\\mathrm{AUC}=\\sum_{k=1}^{m-1}\\frac{y_k+y_{k+1}}{2}(x_{k+1}-x_k).<\/div>\n<p>对角线对应随机猜测，AUC=0.5；点 <span class=\"katex-inline\">(0,1)<\/span> 对应理想排序，AUC=1。从概率解释看，AUC 等于随机抽取一个正例与一个反例、正例得分不低于反例的概率；这个解释不依赖具体截断点。<\/p>\n<h3>第四步：数据划分的偏差与方差<\/h3>\n<p>留出法把 <span class=\"katex-inline\">D<\/span> 拆 <span class=\"katex-inline\">S<\/span>（训练）与 <span class=\"katex-inline\">T<\/span>（测试）：<span class=\"katex-inline\">S<\/span> 大则模型接近全量训练结果，但 <span class=\"katex-inline\">T<\/span> 小、指标方差大；<span class=\"katex-inline\">T<\/span> 大则评估保真性下降，被评模型与全量模型差距变大。<span class=\"katex-inline\">k<\/span> 折交叉验证把 <span class=\"katex-inline\">D<\/span> 分成 <span class=\"katex-inline\">k<\/span> 份，轮流用一份测试、其余 <span class=\"katex-inline\">k-1<\/span> 份训练，<span class=\"katex-inline\">k<\/span> 次结果取平均，用重复划分平滑偶然性。自助采样有放回抽 <span class=\"katex-inline\">m<\/span> 次，单个样本未被抽到的概率为 <span class=\"katex-inline\">(1-1/m)^m<\/span>，<span class=\"katex-inline\">m<\/span> 较大时趋近 <span class=\"katex-inline\">1/e\\approx0.368<\/span>，故约 <span class=\"katex-inline\">63.2\\%<\/span> 样本进入采样集，未抽到的样本可做包外估计。<\/p>\n<h3>第五步：偏差-方差分解<\/h3>\n<p>对固定训练集规模 <span class=\"katex-inline\">D<\/span>，学习器 <span class=\"katex-inline\">f<\/span> 在样本 <span class=\"katex-inline\">\\mathbf x<\/span> 上的预测期望记 <span class=\"katex-inline\">\\bar f(\\mathbf x)=\\mathbb E_D[f(\\mathbf x;D)]<\/span>。泛化误差可拆为三项：<\/p>\n<div class=\"katex-block\">E(f;D)=\\mathrm{bias}^2(\\mathbf x)+\\mathrm{var}(\\mathbf x)+\\sigma^2,<\/div>\n<p>其中偏差平方 <span class=\"katex-inline\">\\mathrm{bias}^2=(\\bar f(\\mathbf x)-y)^2<\/span> 度量平均预测与真实规律的差距，方差 <span class=\"katex-inline\">\\mathrm{var}=\\mathbb E_D[(f(\\mathbf x;D)-\\bar f(\\mathbf x))^2]<\/span> 度量训练集扰动引起的摆动，<span class=\"katex-inline\">\\sigma^2<\/span> 为数据本身噪声。欠拟合落在高偏差区：模型连训练规律都没学好；过拟合落在高方差区：训练集小幅变化就改变预测。模型容量上调通常偏差下降、方差上升，选择空间是这条权衡曲线上的点。<\/p>\n<h3>第八步：AUC 的成对概率解释<\/h3>\n<p>把正例得分记 <span class=\"katex-inline\">s_+<\/span>，反例得分记 <span class=\"katex-inline\">s_-<\/span>。随机抽取一个正例对 <span class=\"katex-inline\">(\\mathbf x_+,\\mathbf x_-)<\/span>，指示量 <span class=\"katex-inline\">\\mathbb I(s_+&gt;s_-)<\/span> 在正例得分更高时取 1。所有正负例对的平均指示量为<\/p>\n<div class=\"katex-block\">\\mathrm{AUC}=\\frac{1}{m^+m^-}\\sum_{i:y_i=+1}\\sum_{j:y_j=-1}\\big[\\mathbb I(s_i>s_j)+\\tfrac12\\mathbb I(s_i=s_j)\\big].<\/div>\n<p>等号右边逐对比较：严格高分记 1，平分记 0.5。这个形式说明 AUC 不看绝对分值大小，只看相对次序；得分整体缩放、平移不改变次序，因此不改变 AUC。与 ROC 梯形公式对照：梯形法按排序累积假正例位置，成对法按样本对累加胜出次数，两者在有限样本上估计的是同一个量。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：混淆矩阵与点指标<\/h3>\n<p>测试集 30 个样本：<span class=\"katex-inline\">TP=8<\/span>，<span class=\"katex-inline\">FP=2<\/span>，<span class=\"katex-inline\">FN=4<\/span>，<span class=\"katex-inline\">TN=16<\/span>。核对 <span class=\"katex-inline\">8+2+4+16=30<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">P=8/10=0.800<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">R=8/12\\approx0.667<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">F_1=2\\times0.800\\times0.667/1.467\\approx0.727<\/span>；\n<\/li><li>\n准确率 <span class=\"katex-inline\">=24/30=0.800<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">TPR=8/12=0.667<\/span>，<span class=\"katex-inline\">FPR=2/18\\approx0.111<\/span>。\n<\/ul>\n<h3>算例 2：两点 ROC 的 AUC<\/h3>\n<p>设排序后前两个样本依次为真正例、假正例，余下样本不再产生坐标移动。起点 <span class=\"katex-inline\">(0,0)<\/span>；纳入真正例后到 <span class=\"katex-inline\">(0,1/12)<\/span>；纳入假正例后到 <span class=\"katex-inline\">(1/18,1/12)<\/span>；曲线终点归一到 <span class=\"katex-inline\">(1,1)<\/span>。第一段梯形面积 <span class=\"katex-inline\">\\frac{0+1/12}{2}(0-0)=0<\/span>；第二段 <span class=\"katex-inline\">\\frac{1/12+1/12}{2}(1/18-0)=1/216\\approx0.0046<\/span>；末段按归一化连线补齐。小规模数据 ROC 呈阶梯状，AUC 对排序最靠前的几个样本敏感。<\/p>\n<h3>算例 3：<span class=\"katex-inline\">F_\\beta<\/span> 偏好调整<\/h3>\n<p>沿用算例 1 的 <span class=\"katex-inline\">P=0.800<\/span>、<span class=\"katex-inline\">R=0.667<\/span>。取 <span class=\"katex-inline\">\\beta=2<\/span>（更重视查全率）：<span class=\"katex-inline\">F_2=\\frac{5\\times0.800\\times0.667}{4\\times0.800+0.667}\\approx0.698<\/span>；取 <span class=\"katex-inline\">\\beta=0.5<\/span>（更重视查准率）：<span class=\"katex-inline\">F_{0.5}=\\frac{1.25\\times0.800\\times0.667}{0.25\\times0.800+0.667}\\approx0.792<\/span>。同一对 P、R，偏好不同得到不同综合分。<\/p>\n<h3>第六步：划分途径的数值对照<\/h3>\n<p>设数据集 100 个样本。留出法按 7:3 拆出 70 训练、30 测试：单次划分若测试集恰好含难样本，指标会明显偏低；重复随机留出 5 次取平均，可观察指标波动幅度。5 折交叉验证：每折 20 个测试样本、80 个训练样本，轮流 5 次，每个样本恰好被测试一次，结果取 5 折平均。自助采样：抽 100 次有放回，样本未被抽中的概率 <span class=\"katex-inline\">(1-1/100)^{100}\\approx0.366<\/span>，约 36.6% 样本不在采样集中，这部分可作包外测试集；代价是训练集与采样集重复度高，评估估计有偏。<\/p>\n<h3>第七步：噪声项为何不可约<\/h3>\n<p>分解式中 <span class=\"katex-inline\">\\sigma^2<\/span> 是同一输入下标签自身的波动，与算法选择无关。无论模型多复杂，预测都无法越过噪声项；评估时若把噪声导致的误差归因于模型欠拟合，会盲目上调容量，把方差抬上去。判断欠拟合还是过拟合，先看训练误差：训练误差已高，是偏差问题；训练误差低而测试误差高，是方差问题；两者都高才是噪声或数据质量问题。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong>为什么误差率不能直接指导模型选择<\/strong>：误差率把所有错误等权对待，而检索场景漏过正例与混入假例代价不同；P/R 分别暴露两类错误，<span class=\"katex-inline\">F_\\beta<\/span> 把业务偏好写进权重。\n<\/li><li>\n<strong>AUC 对类别不平衡的稳健性来源<\/strong>：AUC 只比较正负样本对的得分次序，不统计判对绝对数量；反例占绝大多数时，准确率被反例预测主导，AUC 仍反映排序能力。代价是 ROC 在稀正例场景下曲线观感偏乐观，需配合 P-R 曲线一起看。\n<\/li><li>\n<strong>交叉验证轮次的取舍<\/strong>：<span class=\"katex-inline\">k<\/span> 越大，每折训练集越接近全量，评估偏差越小，但折间相关性高、计算量大；<span class=\"katex-inline\">k=10<\/span> 是常见折中，数据集很小或很大时再调整。\n<\/ul>\n<h3>算例 4：三种模型的学习曲线读数<\/h3>\n<p>同一数据集上训出 A、B、C 三个模型：A 训练误差 0.05、测试误差 0.42；B 训练误差 0.38、测试误差 0.41；C 训练误差 0.06、测试误差 0.10。A 训练低测试高，方差主导，过拟合；B 训练与测试都偏高，偏差主导，欠拟合；C 两侧都低且差距小，容量与数据规模相称。按分解式看，A 的方差项大，B 的偏差平方项大，C 两项都被压住。若给 A 增加正则化或扩充样本，方差下降；给 B 更换更强模型或补充特征，偏差下降。<\/p>\n<h3>算例 5：自助采样的包外估计<\/h3>\n<p><span class=\"katex-inline\">m=100<\/span> 时，某样本未被抽中的概率 <span class=\"katex-inline\">(1-1/100)^{100}\\approx0.366<\/span>，包外集约 37 个样本；这部分样本不参与训练，可直接作为测试集估计泛化误差。包外估计无需额外划分数据，但采样集与原始集同分布假设要求样本独立同分布；时间序列或强相关数据上，有放回采样会把相关样本同时放进训练与包外，估计偏乐观。<\/p>\n<h3>延伸：BEP 与曲线包围关系<\/h3>\n<p>平衡点（Break-Event Point，BEP）是查准率等于查全率时的取值，作为单值比较辅助判据；P-R 曲线被另一条完全包住时，外侧曲线性能占优，两曲线交叉时只能在具体 P 或 R 条件下比较。ROC 的包围判据一致：曲线被完全包住则外侧更优，交叉时借助 AUC 数值比较。BEP 与 F1 都是把二维曲线压成单值的折中手段，压掉的信息是阈值偏好。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n一个全部预测为反例的模型，其准确率、查全率、AUC 分别是多少？为什么高准确率不能说明模型有用？\n<\/li><li>\n同样的混淆矩阵，<span class=\"katex-inline\">F_1<\/span> 与算术平均 <span class=\"katex-inline\">(P+R)/2<\/span> 何时接近、何时拉开？试构造 <span class=\"katex-inline\">P=0.99,R=0.20<\/span> 的例子比较两者。\n<\/li><li>\nROC 曲线上哪一段对应&quot;阈值很松&quot;，哪一段对应&quot;阈值很紧&quot;？纵坐标与横坐标各自在纳入哪类样本时移动？\n<\/li><li>\n高偏差与高方差在学习曲线上分别表现为训练误差、测试误差怎样的组合？增加样本量对哪一侧缓解更直接？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "经验误差、过拟合与模型评估：错误率、P/R/F1、ROC-AUC、交叉验证与偏差-方差"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.69<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">经验误差、过拟合与模型评估：错误率、P/R/F1、ROC-AUC、交叉验证与偏差-方差<\/a><\/span><\/div><h1>线性模型：最小二乘正规方程、对数几率回归的对数似然与梯度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：原书第 3 章线性模型（PDF 第 67–76 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>回归任务要学出属性线性组合的预测函数；分类任务要把线性输出转成类别后验概率。只用均值预测无法利用属性信息，直接对类别标签套连续值回归又忽略概率结构。线性模型给出两条可求解路径：回归用最小二乘估计权重，分类用对数几率函数压到 <span class=\"katex-inline\">(0,1)<\/span> 再按极大似然估计参数。弄清损失来源与梯度方向，是理解后续网络训练循环的基础。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>线性模型<\/strong>：<span class=\"katex-inline\">f(\\mathbf x)=\\mathbf w^\\top\\mathbf x+b<\/span>，<span class=\"katex-inline\">w_j<\/span> 是第 <span class=\"katex-inline\">j<\/span> 个属性权重，<span class=\"katex-inline\">b<\/span> 为截距（原书 3.1 节，PDF 第 67 页）。<\/p>\n<p><strong>增广设计矩阵<\/strong>：把 <span class=\"katex-inline\">b<\/span> 并入权重 <span class=\"katex-inline\">\\hat{\\mathbf w}=(\\mathbf w;b)<\/span>，<span class=\"katex-inline\">X\\in\\mathbb R^{m\\times(d+1)}<\/span> 每行前 <span class=\"katex-inline\">d<\/span> 列为属性、末列恒为 1，标签向量 <span class=\"katex-inline\">\\mathbf y\\in\\mathbb R^m<\/span>。<\/p>\n<p><strong>平方损失<\/strong>：<span class=\"katex-inline\">E_{\\hat{\\mathbf w}}=(\\mathbf y-X\\hat{\\mathbf w})^\\top(\\mathbf y-X\\hat{\\mathbf w})=\\lVert X\\hat{\\mathbf w}-\\mathbf y\\rVert_2^2<\/span>。<\/p>\n<p><strong>正规方程<\/strong>：令损失梯度为零得 <span class=\"katex-inline\">X^\\top X\\hat{\\mathbf w}=X^\\top\\mathbf y<\/span>；<span class=\"katex-inline\">X^\\top X<\/span> 满秩或正定时闭式解 <span class=\"katex-inline\">\\hat{\\mathbf w}^*=(X^\\top X)^{-1}X^\\top\\mathbf y<\/span>（原书 3.2 节，PDF 第 69 页）。<\/p>\n<p><strong>对数几率函数<\/strong>：<span class=\"katex-inline\">y=1/(1+e^{-z})<\/span>，单调可微的 Sigmoid 函数，把实数输出映射到 <span class=\"katex-inline\">(0,1)<\/span>。<\/p>\n<p><strong>对数似然<\/strong>：<span class=\"katex-inline\">\\ell(\\mathbf w,b)=\\sum_i\\ln p(y_i|\\mathbf x_i;\\mathbf w,b)<\/span>，极大似然即令每个样本属于真实标记的概率尽量大（原书 3.3 节，PDF 第 73 页）。负对数似然是关于参数的凸函数，可用梯度下降或牛顿法求解。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>平方损失展开为 <span class=\"katex-inline\">E=\\hat{\\mathbf w}^\\top X^\\top X\\hat{\\mathbf w}-2\\mathbf y^\\top X\\hat{\\mathbf w}+\\mathbf y^\\top\\mathbf y<\/span>。对 <span class=\"katex-inline\">\\hat{\\mathbf w}<\/span> 求梯度，二次型梯度为 <span class=\"katex-inline\">2X^\\top X\\hat{\\mathbf w}<\/span>，一次项梯度为 <span class=\"katex-inline\">-2X^\\top\\mathbf y<\/span>，故 <span class=\"katex-inline\">\\nabla E=2X^\\top(X\\hat{\\mathbf w}-\\mathbf y)<\/span>。令其为零即正规方程。几何上 <span class=\"katex-inline\">\\hat{\\mathbf y}=X\\hat{\\mathbf w}<\/span> 落在 <span class=\"katex-inline\">X<\/span> 列空间内，残差与列空间正交，闭式解找到列空间中离 <span class=\"katex-inline\">\\mathbf y<\/span> 最近的点。<\/p>\n<p>对数几率回归中，类后验 <span class=\"katex-inline\">p(y=1|\\mathbf x)=1/(1+e^{-\\mathbf w^\\top\\mathbf x+b})<\/span>。代入对数似然取负，等价于最小化<\/p>\n<div class=\"katex-block\">E(\\beta)=\\sum_i\\big[-y_i\\beta^\\top\\hat{\\mathbf x}_i+\\ln(1+e^{\\beta^\\top\\hat{\\mathbf x}_i})\\big],<\/div>\n<p><span class=\"katex-inline\">\\beta=(\\mathbf w;b)<\/span>，<span class=\"katex-inline\">\\hat{\\mathbf x}_i=(\\mathbf x_i;1)<\/span>。对 <span class=\"katex-inline\">\\beta<\/span> 求梯度：<span class=\"katex-inline\">\\nabla_\\beta E=\\sum_i\\hat{\\mathbf x}_i(\\hat y_i-y_i)<\/span>，结构与线性回归残差梯度同构，预测值换成 Sigmoid 输出。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：正规方程要求 <span class=\"katex-inline\">X^\\top X<\/span> 满秩，特征间无严格共线，样本数不少于特征数；模型假设回归面或决策边界为线性。\n<\/li><li>\n<strong>失败案例一：特征数超过样本数<\/strong>。<span class=\"katex-inline\">X^\\top X<\/span> 不满秩，解析解不唯一，权重在共线特征间任意分配；需引入正则化或改用迭代求解。\n<\/li><li>\n<strong>失败案例二：把对数几率回归当回归模型直接出类别<\/strong>。模型给的是后验概率估计，类别判定要另设截断点；概率校准与阈值选择是两个独立步骤。\n<\/li><li>\n<strong>边界<\/strong>：线性模型表达能力受限于线性组合；非线性关系需要特征变换或非线性模型（如第 5 章网络）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>线性回归 vs 对数几率回归<\/strong>：回归输出连续值、用平方损失，拟合条件均值；对数几率回归输出概率、用对数似然，拟合后验类别分布。\n<\/li><li>\n<strong>平方损失 vs 对数似然<\/strong>：平方损失对应高斯噪声假设；对数似然对应伯努利类别分布。分类套平方损失，自信判错时梯度被 Sigmoid 饱和区压平。\n<\/li><li>\n<strong>正规方程 vs 梯度下降<\/strong>：闭式解一步到位但受可逆条件与 <span class=\"katex-inline\">O(d^3)<\/span> 求逆代价限制；梯度下降逐轮逼近，超参数是学习率与批量大小，适合高维大数据。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的评估口径用于验收两类模型。后继：概念 c04 的 BP 算法沿用&quot;输出—损失—梯度—更新&quot;循环；概念 c11 的 L1/L2 正则化加在本节损失上；概念 c05 对偶问题的拉格朗日推导与本节矩阵梯度同属优化基础。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（线性模型：最小二乘正规方程、对数几率回归的对数似然与梯度）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：最小二乘正规方程、几何投影与对数几率回归梯度<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把线性模型两条求解路径讲透，往回追四层前提：<\/p>\n<ol><li>\n<strong>模型必须先写成矩阵形式<\/strong>。单样本公式无法支撑批量求导；需要设计矩阵 <span class=\"katex-inline\">X<\/span>、标签向量 <span class=\"katex-inline\">\\mathbf y<\/span> 与增广权重 <span class=\"katex-inline\">\\hat{\\mathbf w}<\/span> 的统一记号，才能对整组参数求梯度。\n<\/li><li>\n<strong>损失函数决定梯度形式<\/strong>。回归选平方损失，对应高斯噪声假设；分类选对数似然，对应伯努利类别分布。损失来源不同，导数结构不同。\n<\/li><li>\n<strong>闭式解存在以列满秩为条件<\/strong>。<span class=\"katex-inline\">X^\\top X<\/span> 可逆才能左乘逆矩阵；共线或高维小样本条件破坏，只能转正则化或迭代法。\n<\/li><li>\n<strong>迭代路径的步长由学习率或二阶信息控制<\/strong>。梯度下降按一阶梯度更新，牛顿法用 Hessian 逆修正步长；两者都从损失关于参数的梯度出发。\n<\/ol>\n<p>依赖链方向：线性模型定义 → 损失矩阵式 → 矩阵梯度展开 → 令梯度为零得正规方程（满秩条件）→ 对数几率后验与负对数似然 → 梯度/牛顿更新。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：写模型与增广设计矩阵<\/h3>\n<p><span class=\"katex-inline\">m<\/span> 个样本，<span class=\"katex-inline\">X\\in\\mathbb R^{m\\times(d+1)}<\/span>，每行 <span class=\"katex-inline\">\\hat{\\mathbf x}_i^\\top=(x_{i1},\\dots,x_{id},1)<\/span>，<span class=\"katex-inline\">\\mathbf y\\in\\mathbb R^m<\/span>，预测 <span class=\"katex-inline\">\\hat{\\mathbf y}=X\\hat{\\mathbf w}<\/span>，<span class=\"katex-inline\">\\hat{\\mathbf w}=(\\mathbf w;b)<\/span>。平方损失<\/p>\n<div class=\"katex-block\">E(\\hat{\\mathbf w})=\\sum_{i=1}^m(\\hat y_i-y_i)^2=(X\\hat{\\mathbf w}-\\mathbf y)^\\top(X\\hat{\\mathbf w}-\\mathbf y).<\/div>\n<h3>第二步：展开并对权重求梯度<\/h3>\n<p>展开被求导项：<\/p>\n<div class=\"katex-block\">E=\\hat{\\mathbf w}^\\top X^\\top X\\hat{\\mathbf w}-2\\mathbf y^\\top X\\hat{\\mathbf w}+\\mathbf y^\\top\\mathbf y.<\/div>\n<p>常数项 <span class=\"katex-inline\">\\mathbf y^\\top\\mathbf y<\/span> 对 <span class=\"katex-inline\">\\hat{\\mathbf w}<\/span> 梯度为零。一次项 <span class=\"katex-inline\">-2\\mathbf y^\\top X\\hat{\\mathbf w}<\/span> 是线性函数 <span class=\"katex-inline\">\\mathbf a^\\top\\hat{\\mathbf w}<\/span>，<span class=\"katex-inline\">\\mathbf a=X^\\top\\mathbf y<\/span>，梯度为 <span class=\"katex-inline\">-2X^\\top\\mathbf y<\/span>。二次项 <span class=\"katex-inline\">\\hat{\\mathbf w}^\\top X^\\top X\\hat{\\mathbf w}<\/span>，记 <span class=\"katex-inline\">A=X^\\top X<\/span> 对称，矩阵梯度公式 <span class=\"katex-inline\">\\nabla_{\\hat{\\mathbf w}}(\\hat{\\mathbf w}^\\top A\\hat{\\mathbf w})=2A\\hat{\\mathbf w}=2X^\\top X\\hat{\\mathbf w}<\/span>。合并：<\/p>\n<div class=\"katex-block\">\\nabla_{\\hat{\\mathbf w}}E=2X^\\top X\\hat{\\mathbf w}-2X^\\top\\mathbf y=2X^\\top(X\\hat{\\mathbf w}-\\mathbf y).<\/div>\n<h3>第三步：令梯度为零推正规方程<\/h3>\n<p><span class=\"katex-inline\">\\nabla E=0 \\Rightarrow X^\\top X\\hat{\\mathbf w}=X^\\top\\mathbf y<\/span>。若 <span class=\"katex-inline\">X^\\top X<\/span> 满秩或正定，两边左乘逆矩阵：<\/p>\n<div class=\"katex-block\">\\hat{\\mathbf w}^*=(X^\\top X)^{-1}X^\\top\\mathbf y.<\/div>\n<p>几何解释：<span class=\"katex-inline\">\\hat{\\mathbf y}=X\\hat{\\mathbf w}<\/span> 是列空间 <span class=\"katex-inline\">\\mathrm{col}(X)<\/span> 中的向量；正规方程等价于残差 <span class=\"katex-inline\">\\mathbf r=\\mathbf y-\\hat{\\mathbf y}<\/span> 与列空间正交，即 <span class=\"katex-inline\">X^\\top\\mathbf r=0<\/span>。解出的 <span class=\"katex-inline\">\\hat{\\mathbf y}<\/span> 是列空间中离 <span class=\"katex-inline\">\\mathbf y<\/span> 距离最近的点，这是正交投影在回归中的形式。<\/p>\n<h3>第四步：不满秩时的处理<\/h3>\n<p>样本数少于特征数，或特征间严格共线，<span class=\"katex-inline\">X^\\top X<\/span> 奇异，逆矩阵不存在。此时多个 <span class=\"katex-inline\">\\hat{\\mathbf w}<\/span> 都使平方误差最小，选择哪一个由归纳偏好决定：常见做法是在损失中加正则项（L2 得岭回归闭式解，L1 得稀疏解），或用梯度下降类迭代方法沿损失面逼近。数值上共线特征会使 <span class=\"katex-inline\">X^\\top X<\/span> 条件数变大，闭式解对噪声敏感。<\/p>\n<h3>第五步：对数几率回归的后验与似然<\/h3>\n<p>Sigmoid 函数 <span class=\"katex-inline\">\\sigma(z)=1/(1+e^{-z})<\/span>，性质 <span class=\"katex-inline\">\\sigma&#x27;(z)=\\sigma(z)(1-\\sigma(z))<\/span>。把线性输出送入 Sigmoid：<\/p>\n<div class=\"katex-block\">p(y=1|\\mathbf x)=\\sigma(\\beta^\\top\\hat{\\mathbf x}),\\quad p(y=0|\\mathbf x)=1-\\sigma(\\beta^\\top\\hat{\\mathbf x}).<\/div>\n<p>两式合并写 <span class=\"katex-inline\">p(y_i|\\hat{\\mathbf x}_i;\\beta)=\\hat y_i^{y_i}(1-\\hat y_i)^{1-y_i}<\/span>，其中 <span class=\"katex-inline\">\\hat y_i=\\sigma(\\beta^\\top\\hat{\\mathbf x}_i)<\/span>。对数似然<\/p>\n<div class=\"katex-block\">\\ell(\\beta)=\\sum_i\\big[y_i\\ln\\hat y_i+(1-y_i)\\ln(1-\\hat y_i)\\big].<\/div>\n<p>最大化 <span class=\"katex-inline\">\\ell<\/span> 等价于最小化负对数似然<\/p>\n<div class=\"katex-block\">E(\\beta)=-\\ell(\\beta)=\\sum_i\\big[-y_i\\beta^\\top\\hat{\\mathbf x}_i+\\ln(1+e^{\\beta^\\top\\hat{\\mathbf x}_i})\\big].<\/div>\n<h3>第六步：对参数求梯度<\/h3>\n<p>逐项对 <span class=\"katex-inline\">\\beta<\/span> 求导。第一项 <span class=\"katex-inline\">-y_i\\beta^\\top\\hat{\\mathbf x}_i<\/span> 的梯度为 <span class=\"katex-inline\">-y_i\\hat{\\mathbf x}_i<\/span>。第二项 <span class=\"katex-inline\">\\ln(1+e^{\\beta^\\top\\hat{\\mathbf x}_i})<\/span> 的导数：复合函数，内层梯度 <span class=\"katex-inline\">\\hat{\\mathbf x}_i<\/span>，外层导数 <span class=\"katex-inline\">e^{\\beta^\\top\\hat{\\mathbf x}_i}/(1+e^{\\beta^\\top\\hat{\\mathbf x}_i})=\\hat y_i<\/span>。合并第 <span class=\"katex-inline\">i<\/span> 项梯度 <span class=\"katex-inline\">\\hat{\\mathbf x}_i(\\hat y_i-y_i)<\/span>，整体<\/p>\n<div class=\"katex-block\">\\nabla_\\beta E=\\sum_i\\hat{\\mathbf x}_i(\\hat y_i-y_i).<\/div>\n<p>梯度下降按 <span class=\"katex-inline\">\\beta\\leftarrow\\beta-\\eta\\nabla_\\beta E<\/span> 更新。牛顿法利用二阶信息，第 <span class=\"katex-inline\">t+1<\/span> 轮<\/p>\n<div class=\"katex-block\">\\beta_{t+1}=\\beta_t-\\big(\\nabla^2 E(\\beta_t)\\big)^{-1}\\nabla E(\\beta_t),<\/div>\n<p>Hessian 为 <span class=\"katex-inline\">X^\\top WX<\/span>，<span class=\"katex-inline\">W<\/span> 是对角阵，对角元 <span class=\"katex-inline\">\\hat y_i(1-\\hat y_i)<\/span>；原书 3.3 节给出该迭代形式（PDF 第 73 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：一维两点最小二乘<\/h3>\n<p>样本 <span class=\"katex-inline\">(x,y)=(1,2)<\/span>、<span class=\"katex-inline\">(2,4)<\/span>。模型 <span class=\"katex-inline\">y=wx+b<\/span>，两点确定一条直线，最小二乘残差为零。正规方程：<span class=\"katex-inline\">\\sum x_i=3<\/span>，<span class=\"katex-inline\">\\sum x_i^2=5<\/span>，<span class=\"katex-inline\">\\sum y_i=6<\/span>，<span class=\"katex-inline\">\\sum x_i y_i=10<\/span>，方程组 <span class=\"katex-inline\">5w+3b=10<\/span>、<span class=\"katex-inline\">3w+2b=6<\/span>，解得 <span class=\"katex-inline\">w=2<\/span>，<span class=\"katex-inline\">b=0<\/span>，拟合 <span class=\"katex-inline\">\\hat y=2x<\/span>。<\/p>\n<h3>算例 2：二维设计矩阵<\/h3>\n<p>样本 <span class=\"katex-inline\">\\mathbf x=(1,1)<\/span> 标签 3，<span class=\"katex-inline\">\\mathbf x=(2,2)<\/span> 标签 6。<span class=\"katex-inline\">X=\\begin{pmatrix}1&amp;1&amp;1\\\\2&amp;2&amp;1\\end{pmatrix}<\/span>，<span class=\"katex-inline\">\\mathbf y=(3,6)^\\top<\/span>。<span class=\"katex-inline\">X^\\top X<\/span> 中前两列相同，矩阵不满秩：两个特征方向共线，闭式解不唯一。这正是高维小样本或共线场景的微型翻版；加 L2 正则后解被约束在小范数内，数值稳定。<\/p>\n<h3>算例 3：对数几率单步梯度<\/h3>\n<p>单样本 <span class=\"katex-inline\">\\hat{\\mathbf x}=(1,1)<\/span>，<span class=\"katex-inline\">y=1<\/span>，初始 <span class=\"katex-inline\">\\beta=(0,0)<\/span>，<span class=\"katex-inline\">\\hat y=\\sigma(0)=0.5<\/span>。梯度 <span class=\"katex-inline\">\\hat{\\mathbf x}(\\hat y-y)=(1,1)(-0.5)=(-0.5,-0.5)<\/span>。学习率 <span class=\"katex-inline\">\\eta=0.1<\/span>，更新 <span class=\"katex-inline\">\\beta\\leftarrow(0,0)-0.1(-0.5,-0.5)=(0.05,0.05)<\/span>。新一轮 <span class=\"katex-inline\">\\beta^\\top\\hat{\\mathbf x}=0.1<\/span>，<span class=\"katex-inline\">\\hat y=\\sigma(0.1)\\approx0.525<\/span>，误差从 <span class=\"katex-inline\">-0.5<\/span> 收到约 <span class=\"katex-inline\">-0.475<\/span>，沿减小判错概率的方向移动。<\/p>\n<h3>算例 4：平方损失与分类损失对照<\/h3>\n<p>样本标签 <span class=\"katex-inline\">y=1<\/span>，模型输出 <span class=\"katex-inline\">\\hat y<\/span>。平方损失项 <span class=\"katex-inline\">(\\hat y-1)^2<\/span>，导数 <span class=\"katex-inline\">2(\\hat y-1)<\/span>；交叉熵项 <span class=\"katex-inline\">-\\ln\\hat y<\/span>，导数 <span class=\"katex-inline\">-1/\\hat y<\/span>。当模型自信判错（<span class=\"katex-inline\">\\hat y\\to0<\/span> 而 <span class=\"katex-inline\">y=1<\/span>），交叉熵梯度趋于 <span class=\"katex-inline\">-1/0<\/span> 放大修正，平方损失导数趋于 <span class=\"katex-inline\">-2<\/span> 且经 Sigmoid 饱和后被压平；这是分类选对数似然而不选平方损失的直接原因。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong>平方损失的概率来源<\/strong>：假设 <span class=\"katex-inline\">y_i=\\mathbf w^\\top\\mathbf x_i+b+\\varepsilon_i<\/span>，<span class=\"katex-inline\">\\varepsilon_i\\sim\\mathcal N(0,\\sigma^2)<\/span> 独立高斯，样本似然取负对数后，常数项之外正是平方损失。换噪声分布就换损失函数：伯努利分布导出交叉熵，拉普拉斯噪声导出绝对值损失。\n<\/li><li>\n<strong>线性模型的归纳偏好<\/strong>：正规方程在所有使误差最小的解中取闭式对应点；正则项等价于对参数空间加先验约束。L2 先验对应高斯先验，L1 先验对应拉普拉斯先验，这一联系在概念 c11 展开。\n<\/li><li>\n<strong>概率输出与阈值判定分离<\/strong>：对数几率回归给后验估计，决策阈值可按业务偏好调整；检索场景放宽阈值提高查全率，推荐场景收紧阈值提高查准率，模型本身不需要重训。\n<\/ul>\n<h3>对数线性回归与线性模型谱系<\/h3>\n<p>若输出标记在指数尺度上变化，可令 <span class=\"katex-inline\">\\ln y=\\mathbf w^\\top\\mathbf x+b<\/span>，即对数线性回归（log-linear regression）；形式上仍是线性回归，实质上是输入到输出的非线性映射（原书 3.2 节，PDF 第 70 页）。线性模型谱系按输出变换展开：恒等变换得线性回归，Sigmoid 变换得对数几率回归，对数变换得对数线性回归；骨架都是线性组合加损失优化，差别在输出与噪声分布假设。<\/p>\n<h3>概率解释与损失选择的对应<\/h3>\n<p>平方损失对应高斯噪声假设：<span class=\"katex-inline\">y_i=\\mathbf w^\\top\\mathbf x_i+b+\\varepsilon_i<\/span>，<span class=\"katex-inline\">\\varepsilon_i\\sim\\mathcal N(0,\\sigma^2)<\/span>，负对数似然去掉常数即平方误差。伯努利类别分布导出交叉熵形式的对数似然。换噪声分布就换损失：拉普拉斯噪声导出绝对值损失，分类自信判错时交叉熵梯度不被饱和区压平。选损失先确认任务输出类型与噪声假设，不能在分类上套平方损失。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n<span class=\"katex-inline\">X^\\top X<\/span> 不满秩时正规方程为什么不能直接求逆？工程上有哪两条替代路径？\n<\/li><li>\n写出对数几率回归负对数似然对 <span class=\"katex-inline\">\\beta<\/span> 的梯度，说明它与线性回归残差梯度在结构上哪里相同、哪里不同。\n<\/li><li>\nSigmoid 导数性质 <span class=\"katex-inline\">\\sigma&#x27;(z)=\\sigma(z)(1-\\sigma(z))<\/span> 在 Hessian <span class=\"katex-inline\">X^\\top WX<\/span> 的对角元 <span class=\"katex-inline\">W_{ii}=\\hat y_i(1-\\hat y_i)<\/span> 中如何体现？\n<\/li><li>\n为什么分类任务自信判错时平方损失修正力度不足？把两种损失在 <span class=\"katex-inline\">\\hat y\\to0<\/span>、<span class=\"katex-inline\">y=1<\/span> 时的导数行为写出来对照。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "线性模型：最小二乘正规方程、对数几率回归的对数似然与梯度"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.89<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">线性模型：最小二乘正规方程、对数几率回归的对数似然与梯度<\/a><\/span><\/div><h1>决策树：信息增益、增益率、基尼指数与剪枝处理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：原书第 4 章决策树（PDF 第 87–100 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>线性模型给出的边界是超平面，只能划分按线性方向可分的数据；现实分类常需要&quot;先看色泽，再看根蒂&quot;这种逐级判断的嵌套规则。决策树（decision tree）把分类过程组织成树结构：内部结点对应属性测试，分支对应属性取值，叶结点给出类别标记。学习的核心困难是每一步选哪个属性切开当前样本集——划分后分支结点要尽量纯，同时不能把训练噪声当成规律。纯度度量准则与剪枝策略就是围绕这两点设计的。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>信息熵（information entropy）<\/strong>：样本集 <span class=\"katex-inline\">D<\/span> 中第 <span class=\"katex-inline\">k<\/span> 类比例 <span class=\"katex-inline\">p_k<\/span>，<span class=\"katex-inline\">\\mathrm{Ent}(D)=-\\sum_{k=1}^{|\\mathcal Y|}p_k\\log_2 p_k<\/span>。<span class=\"katex-inline\">\\mathrm{Ent}(D)<\/span> 越小纯度越高，最小值 0，样本越杂最大值越大（原书 4.2.1 节，PDF 第 89 页）。<\/p>\n<p><strong>信息增益（information gain）<\/strong>：离散属性 <span class=\"katex-inline\">a<\/span> 有 <span class=\"katex-inline\">V<\/span> 个取值，分支子集 <span class=\"katex-inline\">D^v<\/span>，<\/p>\n<div class=\"katex-block\">\\mathrm{Gain}(D,a)=\\mathrm{Ent}(D)-\\sum_{v=1}^{V}\\frac{|D^v|}{|D|}\\mathrm{Ent}(D^v).<\/div>\n<p>增益越大，按 <span class=\"katex-inline\">a<\/span> 划分带来的纯度提升越大；ID3 算法按信息增益选属性（原书 4.2.1 节，PDF 第 89 页）。<\/p>\n<p><strong>增益率（gain ratio）<\/strong>：C4.5 采用，<span class=\"katex-inline\">\\mathrm{Gain\\_ratio}(D,a)=\\mathrm{Gain}(D,a)/\\mathrm{IV}(a)<\/span>，固有值 <span class=\"katex-inline\">\\mathrm{IV}(a)=-\\sum_v |D^v|/|D|\\log_2(|D^v|/|D|)<\/span>，对取值数目多的属性做惩罚（原书 4.2.2 节，PDF 第 91 页前后）。<\/p>\n<p><strong>基尼值（Gini）<\/strong>：<span class=\"katex-inline\">\\mathrm{Gini}(D)=1-\\sum_k p_k^2<\/span>，反映随机抽两个样本类别不一致的概率；值越小纯度越高。属性 <span class=\"katex-inline\">a<\/span> 的基尼指数 <span class=\"katex-inline\">\\mathrm{Gini\\_index}(D,a)=\\sum_v |D^v|/|D|\\,\\mathrm{Gini}(D^v)<\/span>，CART 选基尼指数最小的属性（原书 4.2.3 节，PDF 第 93 页）。<\/p>\n<p><strong>剪枝（pruning）<\/strong>：预剪枝在划分前估计泛化性能，不能提升就停止划分；后剪枝先生成完整树，再自底向上把子树替换为叶结点考察是否保留（原书 4.3 节，PDF 第 93 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>以原书西瓜数据集 2.0 为例：根结点 17 个样本，好瓜与坏瓜混合。属性&quot;色泽&quot;分三个子集：<span class=\"katex-inline\">D^1<\/span>（青绿）6 个、<span class=\"katex-inline\">D^2<\/span>（乌黑）6 个、<span class=\"katex-inline\">D^3<\/span>（浅白）5 个。分别算各子集信息熵，按样本数加权回根结点熵，差值即色泽的信息增益。原书算得 <span class=\"katex-inline\">\\mathrm{Gain}(D,\\text{色泽})=0.109<\/span>，其余属性依次为根蒂 0.143、敲声 0.141、纹理 0.381、脐部 0.289、触感 0.006；纹理增益最大，被选为根结点划分属性（PDF 第 91 页）。<\/p>\n<p>基尼指数计算路径相同：先算各子集基尼值，按样本数加权，选加权基尼值最小的属性。基尼值与熵都刻画不纯度，区别在熵用对数、基尼用平方和，数值趋势一致。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：信息增益与增益率面向离散属性；连续值需先二分划分。树模型可处理类别不平衡下的分段规则，不要求特征尺度归一。\n<\/li><li>\n<strong>失败案例一：信息增益偏向取值数目多的属性<\/strong>。若把样本编号这类唯一标识属性纳入候选，每个分支只剩单个样本，子集熵为 0，信息增益最大但无泛化能力；增益率通过固有值惩罚多取值属性。\n<\/li><li>\n<strong>失败案例二：不剪枝的完全树<\/strong>。分支一直分到结点样本全对，训练误差为零，训练集噪声被逐叶记下；新样本扰动即走错分支，方差过大。\n<\/li><li>\n<strong>失败案例三：预剪枝过早停止<\/strong>。若当前划分单独看提升有限，但与后续划分组合后效果显著，预剪枝会砍掉这条有潜力的路径，偏差上升。\n<\/li><li>\n<strong>边界<\/strong>：单棵树对样本扰动敏感，小的样本变化可能长出结构不同的树；高维稀疏数据上树深容易失控。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>信息增益 vs 增益率 vs 基尼指数<\/strong>：增益偏向多取值属性；增益率用固有值修正这一偏向；基尼指数计算不涉及对数，数值上是平方和形式，CART 用于分类与回归树。\n<\/li><li>\n<strong>决策树 vs 线性模型<\/strong>：线性模型边界连续光滑，参数可解释为特征权重；树模型给出分段规则路径，可解释为属性合取规则，但边界是轴平行折线。\n<\/li><li>\n<strong>预剪枝 vs 后剪枝<\/strong>：预剪枝边生成边停止，计算开销小，可能欠拟合；后剪枝基于完整树回退，保留更多潜在结构，计算开销大，通常泛化更稳。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c02 的线性模型代表另一类决策边界；概念 c01 的过拟合与交叉验证是剪枝判断的依据。后继：概念 c08 集成学习把决策树作为基学习器，Bagging 与随机森林靠多棵树降低单树方差；概念 c11 中决策树划分属性集合本身就是一种嵌入式特征选择。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（决策树：信息增益、增益率、基尼指数与剪枝处理）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：纯度度量、三种划分准则与剪枝的偏差-方差对照<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把决策树划分准则讲透，往回追四层前提：<\/p>\n<ol><li>\n<strong>树划分要先定义&quot;纯&quot;的度量<\/strong>。没有不纯度指标，就无法比较两个属性谁切得好；信息熵从编码角度、基尼从随机抽样角度给出两种不纯度刻画。\n<\/li><li>\n<strong>单结点纯度要与划分后分支纯度衔接<\/strong>。加权平均分支熵才反映划分后的整体纯度，权重必须是各分支样本占比，否则样本多的分支被错估。\n<\/li><li>\n<strong>准则偏好需要修正<\/strong>。信息增益天然偏向取值数目多的属性，固有值 IV 度量属性自身的取值分散程度，增益率以此做分母修正。\n<\/li><li>\n<strong>结构复杂度要靠剪枝约束<\/strong>。划分准则只保证训练集纯度，不约束树深；预剪枝、后剪枝在生成过程与生成之后两个位置控制复杂度，对应偏差与方差的不同权衡。\n<\/ol>\n<p>依赖链方向：纯度度量定义 → 信息增益（加权分支熵）→ 增益率修正多取值偏好 → 基尼指数平行准则 → 剪枝控制过拟合。<\/p
