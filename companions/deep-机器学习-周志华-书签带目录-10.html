">P(c)<\/span> 与 <span class=\"katex-inline\">P(\\mathbf x|c)<\/span> 上。\n<\/li><li>\n<strong>联合条件概率不可估才引入独立假设<\/strong>。属性组合数随维度指数增长，样本稀疏；独立假设把联合拆成边缘乘积，牺牲一点结构信息换可估性。\n<\/li><li>\n<strong>零概率靠平滑修正<\/strong>。频率估计把未观测当概率零，与&quot;未观测到&quot;和&quot;概率为零&quot;的区分冲突；拉普拉斯修正在计数空间加均匀先验。\n<\/ol>\n<p>依赖链方向：期望风险 → 贝叶斯公式 → 类条件概率估计困难 → 条件独立拆分 → 后验乘积判定 → 拉普拉斯平滑。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：期望风险与贝叶斯最优<\/h3>\n<p>设类别标记 <span class=\"katex-inline\">c_j\\in\\mathcal Y<\/span>，<span class=\"katex-inline\">\\lambda_{ij}<\/span> 是把真实 <span class=\"katex-inline\">c_j<\/span> 误判为 <span class=\"katex-inline\">c_i<\/span> 的损失。样本 <span class=\"katex-inline\">\\mathbf x<\/span> 判为 <span class=\"katex-inline\">c_i<\/span> 的条件风险<\/p>\n<div class=\"katex-block\">R(c_i|\\mathbf x)=\\sum_j\\lambda_{ij}P(c_j|\\mathbf x).<\/div>\n<p>贝叶斯决策论选 <span class=\"katex-inline\">h(\\mathbf x)=\\arg\\min_{c_i}R(c_i|\\mathbf x)<\/span>。若所有误判损失相等，风险最小等价于后验概率最大；使风险最小的分类器称贝叶斯最优分类器，其错误率是该任务不可约的下界。<\/p>\n<h3>第二步：贝叶斯公式转换<\/h3>\n<p>后验<\/p>\n<div class=\"katex-block\">P(c|\\mathbf x)=\\frac{P(c)P(\\mathbf x|c)}{P(\\mathbf x)}.<\/div>\n<p><span class=\"katex-inline\">P(c)<\/span> 是类别先验，<span class=\"katex-inline\">P(\\mathbf x|c)<\/span> 是类条件概率（似然），<span class=\"katex-inline\">P(\\mathbf x)=\\sum_cP(c)P(\\mathbf x|c)<\/span> 是证据因子。比较同一 <span class=\"katex-inline\">\\mathbf x<\/span> 的不同类别后验，<span class=\"katex-inline\">P(\\mathbf x)<\/span> 公共分母不变，判定只需比较 <span class=\"katex-inline\">P(c)P(\\mathbf x|c)<\/span>。<\/p>\n<h3>第三步：联合概率的维度灾难<\/h3>\n<p><span class=\"katex-inline\">d<\/span> 个属性各取若干值，组合数 <span class=\"katex-inline\">\\prod_j n_j<\/span>；二值属性即 <span class=\"katex-inline\">2^d<\/span>。训练样本数 <span class=\"katex-inline\">m<\/span> 远小于组合数时，多数组合频率为零，直接估 <span class=\"katex-inline\">P(\\mathbf x|c)<\/span> 不可行。朴素假设：类别给定条件下属性相互独立，<\/p>\n<div class=\"katex-block\">P(\\mathbf x|c)=P(x_1,\\dots,x_d|c)=\\prod_{j=1}^d P(x_j|c).<\/div>\n<p>待估参数从组合数降到 <span class=\"katex-inline\">\\sum_j n_j<\/span>，小样本可算。<\/p>\n<h3>第四步：后验乘积判定<\/h3>\n<p>合并得<\/p>\n<div class=\"katex-block\">P(c|\\mathbf x)\\propto P(c)\\prod_{j=1}^d P(x_j|c),<\/div>\n<p>分类器<\/p>\n<div class=\"katex-block\">h(\\mathbf x)=\\arg\\max_{c\\in\\mathcal Y}P(c)\\prod_{j=1}^d P(x_j|c).<\/div>\n<p>训练阶段统计 <span class=\"katex-inline\">|D_c|<\/span> 与各属性条件计数；预测阶段查计数相乘，选最大类别。连续属性改用概率密度：假定 <span class=\"katex-inline\">x_j|c\\sim\\mathcal N(\\mu_{jc},\\sigma_{jc}^2)<\/span>，代入正态密度函数求值（原书 7.3 节，PDF 第 166 页前后）。<\/p>\n<h3>第五步：拉普拉斯修正推导<\/h3>\n<p>未出现取值的频率为零，会使乘积整项归零。拉普拉斯修正等价于在计数前给每个类别、每个取值分配一次虚拟样本：<\/p>\n<div class=\"katex-block\">\\hat P(c)=\\frac{|D_c|+1}{|D|+N},<\/div>\n<p><span class=\"katex-inline\">N<\/span> 为可能类别数；属性条件概率<\/p>\n<div class=\"katex-block\">\\hat P(x_i|c)=\\frac{|D_{c,x_i}|+1}{|D_c|+N_i},<\/div>\n<p><span class=\"katex-inline\">N_i<\/span> 为第 <span class=\"katex-inline\">i<\/span> 属性可能取值数。分子加 1 对应均匀先验的一次计数，分母加取值数保证修正后概率和为 1。样本量增大时，<span class=\"katex-inline\">|D_c|<\/span> 主导分子分母，修正项影响趋零；样本稀少时，未观测取值分到非零小概率，不再被直接否决。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：先验与条件概率计数<\/h3>\n<p>教材西瓜数据 3.0 共 17 个样本，好瓜 8、坏瓜 9（原书 7.3 节，PDF 第 167 页）。修正后<\/p>\n<div class=\"katex-block\">P(\\text{好瓜})=\\frac{8+1}{17+2}=\\frac9{17}\\approx0.474,\\quad P(\\text{坏瓜})=\\frac{9+1}{17+2}=\\frac{10}{17}\\approx0.526.<\/div>\n<p>色泽条件概率：好瓜中青绿 3 例，修正 <span class=\"katex-inline\">P(\\text{青绿}|\\text{好瓜})=(3+1)/(8+3)=4/11\\approx0.364<\/span>；坏瓜中青绿 3 例，<span class=\"katex-inline\">P(\\text{青绿}|\\text{坏瓜})=(3+1)/(9+3)=4/12\\approx0.333<\/span>。<\/p>\n<h3>算例 2：新样本判定<\/h3>\n<p>设新样本色泽青绿、根蒂蜷缩、敲声浊响。查得条件概率：<\/p>\n<ul><li>\n好瓜侧：<span class=\"katex-inline\">P(\\text{蜷缩}|\\text{好瓜})=3/8<\/span> 附近、<span class=\"katex-inline\">P(\\text{浊响}|\\text{好瓜})=6/8<\/span> 附近；\n<\/li><li>\n坏瓜侧：<span class=\"katex-inline\">P(\\text{蜷缩}|\\text{坏瓜})=3/9<\/span> 附近、<span class=\"katex-inline\">P(\\text{浊响}|\\text{坏瓜})=4/9<\/span> 附近。\n<\/ul>\n<p>好瓜乘积 <span class=\"katex-inline\">\\approx0.474\\times0.364\\times0.375\\times0.750\\approx0.0485<\/span>；坏瓜乘积 <span class=\"katex-inline\">\\approx0.526\\times0.333\\times0.333\\times0.444\\approx0.0259<\/span>。好瓜乘积更大，判为好瓜。注意乘积绝对值偏小只反映证据强度，类别间相对大小才是判定依据。<\/p>\n<h3>算例 3：零概率对照<\/h3>\n<p>若不修正，设某属性取值在好瓜样本中未出现，<span class=\"katex-inline\">P(x_j|\\text{好瓜})=0<\/span>，好瓜侧乘积直接为 0；即使其余属性全支持好瓜，也只能判坏瓜。修正后该项为 <span class=\"katex-inline\">1/(|D_c|+N_j)&gt;0<\/span>，乘积保留其他属性证据。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong>独立假设的偏差来源<\/strong>：属性相关时，重复证据被独立乘积重复计入，后验置信被抬高；半朴素贝叶斯（如 SPODE）只让强相关属性构成超父节点，其余仍独立，在偏差与可估性间折中（转述原书 7.4 节前后）。\n<\/li><li>\n<strong>生成式模型的缺失值处理<\/strong>：某属性缺失时，判定乘积跳过该属性条件项即可，其余证据照常汇总；判别式模型处理缺失输入通常要先插补。\n<\/li><li>\n<strong>概率校准与排序<\/strong>：朴素贝叶斯输出的乘积常被压缩到极端值，但类别排序往往可靠；用于决策时按最大乘积选类，用于风险估计时需另外校准概率。\n<\/ul>\n<h3>连续属性的密度估计<\/h3>\n<p>离散属性用计数频率估计条件概率；连续属性假定 <span class=\"katex-inline\">x_j|c\\sim\\mathcal N(\\mu_{jc},\\sigma_{jc}^2)<\/span>，密度<\/p>\n<div class=\"katex-block\">p(x_j|c)=\\frac1{\\sqrt{2\\pi}\\sigma_{jc}}\\exp\\Big(-\\frac{(x_j-\\mu_{jc})^2}{2\\sigma_{jc}^2}\\Big).<\/div>\n<p><span class=\"katex-inline\">\\mu_{jc}<\/span> 取该类样本第 <span class=\"katex-inline\">j<\/span> 维均值，<span class=\"katex-inline\">\\sigma_{jc}<\/span> 取标准差。预测时代入新样本取值算密度，与离散条件概率同乘进乘积。若某类样本极少，方差估计不稳，可对各类方差做平滑合并；密度为连续值，不要求取值离散。<\/p>\n<h3>贝叶斯最优错误率<\/h3>\n<p>对任意样本 <span class=\"katex-inline\">\\mathbf x<\/span>，最优分类器选后验最大类别，条件风险最小。贝叶斯最优错误率是该任务在给定分布下不可约的下界：任何模型在同分布测试集上的误差都不会低于它。朴素贝叶斯因独立假设引入偏差，与最优错误率之间的差距，一部分来自假设失真，一部分来自样本不足。理解这一下界可避免把模型误差全部归因于算法。<\/p>\n<h3>缺失属性的处理<\/h3>\n<p>判定乘积中某属性缺失，直接跳过该项条件概率，用其余属性证据汇总。这是生成式模型相对判别式的便利：判别式模型输入缺维时通常要先插补或要求模型支持掩码；朴素贝叶斯的乘积结构天然容许缺项。若缺失本身携带信息（如某属性系统性缺失对应特定人群），跳过该属性会丢掉这层信号，需另建缺失指示变量。<\/p>\n<h3>概率校准与排序<\/h3>\n<p>朴素贝叶斯输出的乘积常被压向极端值：证据稍偏某类，连乘后概率接近 0 或 1。类别排序往往可靠，但绝对概率值未必校准。用于风险决策时，可在验证集上对输出做 Platt 缩放或 isotonic 回归校准；只做类别判定时，按最大乘积选类即可，不必要求概率数值精确。<\/p>\n<h3>半朴素与属性相关修正<\/h3>\n<p>强相关属性成对出现时，独立假设把同一证据计两次。半朴素贝叶斯放宽部分独立：SPODE 为每个属性指定一个超父属性，条件概率写成 <span class=\"katex-inline\">P(x_j|c,x_{\\mathrm{parent}})<\/span>；TAN 用树结构刻画属性间依赖。修正范围越大，待估参数越多，小样本下方差上升；选择放宽程度要在偏差与样本量之间折中。原书 7.4 节前后讨论了这类推广（转述）。<\/p>\n<h3>频率估计与样本量<\/h3>\n<p>离散条件概率 <span class=\"katex-inline\">P(x_j|c)=|D_{c,x_j}|/|D_c|<\/span>，先验 <span class=\"katex-inline\">P(c)=|D_c|/|D|<\/span>。样本充足时频率逼近真实概率；样本稀少时单次计数波动大，平滑项占比偏高。朴素贝叶斯训练阶段只统计计数表，预测阶段查表连乘，适合高维稀疏文本场景；模型结构简单，方差小但独立假设带来的偏差稳定存在。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出条件风险 <span class=\"katex-inline\">R(c_i|\\mathbf x)<\/span> 的表达式，说明误判损失全相等时为何等价于后验最大。\n<\/li><li>\n联合条件概率的组合数随属性数怎样增长？独立假设把待估参数从什么量级降到什么量级？\n<\/li><li>\n拉普拉斯修正分母为什么加 <span class=\"katex-inline\">N<\/span> 或 <span class=\"katex-inline\">N_i<\/span>，而不是统一加类别数？修正后概率和为何仍为 1？\n<\/li><li>\n属性强相关时朴素假设会把证据重复计几次？举一个瓜类属性相关的例子说明后验被放大的方向。\n<\/ol><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.190<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">决策树：信息增益、增益率、基尼指数与剪枝处理<\/a><\/span><\/div><h1>集成学习：Bagging 并行采样与 Boosting 串行加权，AdaBoost 指数损失与权重更新<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：原书第 8 章集成学习（PDF 第 185–195 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>单个学习器在偏差与方差上各有局限：高偏差模型欠拟合，高方差模型对样本扰动敏感。集成学习（ensemble learning）构建并结合多个个体学习器，用&quot;好而不同&quot;的组合压低单模型风险。核心困难有两个：个体之间怎样产生差异，以及产生之后按什么策略结合。按个体学习器是否存在强依赖，方法分为串行生成的 Boosting 与并行生成的 Bagging、随机森林两条路线。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>个体学习器（individual learner）<\/strong>：由现有算法在训练数据上产生的基模型，如 C4.5 决策树、BP 网络；同种算法构成同质集成，不同种构成异质集成（原书 8.1 节，PDF 第 185 页）。<\/p>\n<p><strong>Bagging<\/strong>：基于自助采样（bootstrap sampling），有放回抽 <span class=\"katex-inline\">m<\/span> 次得 <span class=\"katex-inline\">m<\/span> 样本的采样集；约 63.2% 初始样本进入采样集。各采样集训练一个基学习器，再投票或平均结合（原书 8.3.1 节，PDF 第 192 页）。<\/p>\n<p><strong>Boosting<\/strong>：先在初始分布训练基学习器，再按前序表现调整样本分布，判错样本后续受更多关注；重复 <span class=\"katex-inline\">T<\/span> 轮后把基学习器加权结合（原书 8.2 节，PDF 第 187 页）。<\/p>\n<p><strong>AdaBoost 基权重<\/strong>：第 <span class=\"katex-inline\">t<\/span> 轮误差率 <span class=\"katex-inline\">\\varepsilon_t=P_{\\mathbf x\\sim D_t}(h_t(\\mathbf x)\\neq f(\\mathbf x))<\/span>，基学习器权重<\/p>\n<div class=\"katex-block\">\\alpha_t=\\frac12\\ln\\frac{1-\\varepsilon_t}{\\varepsilon_t}.<\/div>\n<p><strong>样本分布更新<\/strong>：<\/p>\n<div class=\"katex-block\">D_{t+1}(\\mathbf x_i)\\propto D_t(\\mathbf x_i)e^{-\\alpha_t f(\\mathbf x_i)h_t(\\mathbf x_i)},<\/div>\n<p><span class=\"katex-inline\">Z_t<\/span> 为归一化因子，保证新分布概率和为 1。<\/p>\n<p><strong>指数损失<\/strong>：AdaBoost 从加性模型迭代优化指数损失 <span class=\"katex-inline\">E_{\\mathbf x\\sim D}[e^{-f(\\mathbf x)H(\\mathbf x)}]<\/span> 推导出基权重与更新规则（原书 8.2 节，PDF 第 189–190 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>第 <span class=\"katex-inline\">t<\/span> 轮指数损失按判对、判错拆成两项：<\/p>\n<div class=\"katex-block\">E=e^{-\\alpha_t}(1-\\varepsilon_t)+e^{\\alpha_t}\\varepsilon_t.<\/div>\n<p>对 <span class=\"katex-inline\">\\alpha_t<\/span> 求导并令其为零：<span class=\"katex-inline\">-e^{-\\alpha_t}(1-\\varepsilon_t)+e^{\\alpha_t}\\varepsilon_t=0<\/span>，整理 <span class=\"katex-inline\">e^{2\\alpha_t}=(1-\\varepsilon_t)/\\varepsilon_t<\/span>，解得 <span class=\"katex-inline\">\\alpha_t=\\frac12\\ln((1-\\varepsilon_t)/\\varepsilon_t)<\/span>。误差率小于 0.5 时 <span class=\"katex-inline\">\\alpha_t&gt;0<\/span>，基学习器越好权重越大。<\/p>\n<p>样本更新方向：判对时 <span class=\"katex-inline\">f h=+1<\/span>，指数为负，权重下降；判错时 <span class=\"katex-inline\">f h=-1<\/span>，指数为正，权重上升。归一化后难样本在后续轮次被重点照顾。最终集成 <span class=\"katex-inline\">H(\\mathbf x)=\\sum_t\\alpha_t h_t(\\mathbf x)<\/span>，分类按符号判定，回归按加权平均。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：基学习器不能太弱，误差率须低于 0.5 才有正权重；集成收益来自个体差异与个体精度的平衡。\n<\/li><li>\n<strong>失败案例一：基学习器高度相似<\/strong>。缺少采样或属性扰动，个体决策接近，集成只重复同一模型，方差与偏差都压不下去。\n<\/li><li>\n<strong>失败案例二：Boosting 反复聚焦噪声样本<\/strong>。噪声点被判错后权重持续抬高，后续基学习器围着噪声转，边界被带偏；Boosting 对异常样本比 Bagging 敏感。\n<\/li><li>\n<strong>失败案例三：样本权重更新方向写反<\/strong>。判错样本权重调低，难样本被反复漏掉，集成误差不下降；更新式指数项符号由 <span class=\"katex-inline\">f h<\/span> 决定，不能颠倒。\n<\/li><li>\n<strong>边界<\/strong>：集成降低的风险类型不同——Bagging 主要压方差，适合高方差单模型；Boosting 主要压偏差，适合弱学习器叠加。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>Bagging vs Boosting<\/strong>：Bagging 并行自助采样，个体无强依赖，投票结合，侧重降方差；Boosting 串行依赖前序结果，按误差加权，侧重降偏差。随机森林在 Bagging 基础上再加入属性选择扰动。\n<\/li><li>\n<strong>投票结合 vs 加权结合<\/strong>：投票各基学习器等权；加权结合按 <span class=\"katex-inline\">\\alpha_t<\/span> 分配话语权，精度高的基模型贡献更大。回归任务常用加权平均，分类任务常用加权投票。\n<\/li><li>\n<strong>集成 vs 单模型<\/strong>：集成以多倍训练与预测开销换泛化提升；单模型可解释性强、部署轻。任务对延迟或解释要求高时，单模型可能更合适。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c03 决策树、概念 c04 BP 网络都是常用基学习器；概念 c01 的偏差-方差分解解释两条路线分别压哪一项风险。后继：概念 c09 聚类的簇归属可作为集成特征；概念 c12 学习理论为集成泛化界提供假设复杂度分析框架。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（集成学习：Bagging 并行采样与 Boosting 串行加权，AdaBoost 指数损失与权重更新）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：AdaBoost 指数损失求导、样本权重更新与 Bagging 采样结构<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把集成机制讲透，往回追四层前提：<\/p>\n<ol><li>\n<strong>单模型风险有两类来源<\/strong>。偏差来自模型容量不足，方差来自样本扰动；集成要分别对应两条修正路线，先分清压哪一项。\n<\/li><li>\n<strong>个体差异是集成收益的前提<\/strong>。所有基学习器决策相同，组合不产生新信息；采样扰动、属性扰动是制造差异的两种手段。\n<\/li><li>\n<strong>Boosting 的目标函数是指数损失<\/strong>。基权重与样本更新都从该损失对 <span class=\"katex-inline\">\\alpha_t<\/span> 的优化导出；不定损失函数，更新规则只能记结论。\n<\/li><li>\n<strong>结合策略把个体输出汇总<\/strong>。等权投票或加权求和，权重由基学习器在当前分布上的误差决定。\n<\/ol>\n<p>依赖链方向：单模型偏差/方差 → 集成多样性要求 → 自助采样（Bagging）→ 指数损失（Boosting）→ 基权重闭式解 → 样本分布更新 → 加权结合。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：集成结构与独立性假设<\/h3>\n<p>集成先产生一组个体学习器，再结合。原书 8.1 节给出一个理论对照：若基学习器误差相互独立，集成错误率随个体数目 <span class=\"katex-inline\">T<\/span> 指数下降，最终趋于零（转述）。现实中个体为同一任务训练，不可能独立；准确性与多样性存在冲突——精度提高后增加多样性往往要牺牲精度。集成研究的核心就是在&quot;好&quot;与&quot;不同&quot;之间找平衡。<\/p>\n<h3>第二步：Boosting 的串行流程<\/h3>\n<ol><li>\n初始分布 <span class=\"katex-inline\">D_1<\/span> 上训练 <span class=\"katex-inline\">h_1<\/span>；\n<\/li><li>\n按 <span class=\"katex-inline\">h_1<\/span> 表现调整分布，判错样本权重抬高；\n<\/li><li>\n在新分布 <span class=\"katex-inline\">D_2<\/span> 上训练 <span class=\"katex-inline\">h_2<\/span>；\n<\/li><li>\n重复至 <span class=\"katex-inline\">T<\/span> 轮，输出 <span class=\"katex-inline\">H(\\mathbf x)=\\sum_{t=1}^T\\alpha_t h_t(\\mathbf x)<\/span>。\n<\/ol>\n<p>基学习器可接受带权样本时用重赋权法（re-weighting）；只能接受等权样本时用重采样法（re-sampling），按分布重新抽样（原书 8.2 节，PDF 第 190 页前后）。<\/p>\n<h3>第三步：指数损失拆项<\/h3>\n<p>加性模型在分布 <span class=\"katex-inline\">D_t<\/span> 上的指数损失<\/p>\n<div class=\"katex-block\">E_{\\mathbf x\\sim D_t}[e^{-f(\\mathbf x)\\alpha_t h_t(\\mathbf x)}].<\/div>\n<p>按 <span class=\"katex-inline\">h_t<\/span> 判对、判错拆成两部分：判对概率 <span class=\"katex-inline\">1-\\varepsilon_t<\/span>，此时 <span class=\"katex-inline\">fh=+1<\/span>，贡献 <span class=\"katex-inline\">e^{-\\alpha_t}(1-\\varepsilon_t)<\/span>；判错概率 <span class=\"katex-inline\">\\varepsilon_t<\/span>，此时 <span class=\"katex-inline\">fh=-1<\/span>，贡献 <span class=\"katex-inline\">e^{\\alpha_t}\\varepsilon_t<\/span>。整体<\/p>\n<div class=\"katex-block\">E(\\alpha_t)=e^{-\\alpha_t}(1-\\varepsilon_t)+e^{\\alpha_t}\\varepsilon_t.<\/div>\n<h3>第四步：对基权重求导求解<\/h3>\n<div class=\"katex-block\">\\frac{\\partial E}{\\partial\\alpha_t}=-e^{-\\alpha_t}(1-\\varepsilon_t)+e^{\\alpha_t}\\varepsilon_t.<\/div>\n<p>令导数为零：<\/p>\n<div class=\"katex-block\">e^{\\alpha_t}\\varepsilon_t=e^{-\\alpha_t}(1-\\varepsilon_t)\\ \\Rightarrow\\ e^{2\\alpha_t}=\\frac{1-\\varepsilon_t}{\\varepsilon_t},<\/div>\n<div class=\"katex-block\">\\alpha_t=\\frac12\\ln\\frac{1-\\varepsilon_t}{\\varepsilon_t}.<\/div>\n<p>检验二阶条件：<span class=\"katex-inline\">\\partial^2E/\\partial\\alpha_t^2=e^{-\\alpha_t}(1-\\varepsilon_t)+e^{\\alpha_t}\\varepsilon_t&gt;0<\/span>，驻点为极小值。<span class=\"katex-inline\">\\varepsilon_t&lt;0.5<\/span> 时 <span class=\"katex-inline\">\\alpha_t&gt;0<\/span>；基学习器误差越小，<span class=\"katex-inline\">\\alpha_t<\/span> 越大。<span class=\"katex-inline\">\\varepsilon_t=0.5<\/span> 时 <span class=\"katex-inline\">\\alpha_t=0<\/span>，随机猜测不获话语权。<\/p>\n<h3>第五步：样本分布更新<\/h3>\n<p>指数损失对样本权重的影响经 <span class=\"katex-inline\">e^{-\\alpha_t f h_t}<\/span> 体现：<\/p>\n<div class=\"katex-block\">D_{t+1}(\\mathbf x_i)=\\frac{D_t(\\mathbf x_i)e^{-\\alpha_t f(\\mathbf x_i)h_t(\\mathbf x_i)}}{Z_t},<\/div>\n<p><span class=\"katex-inline\">Z_t=\\sum_iD_t(\\mathbf x_i)e^{-\\alpha_t f(\\mathbf x_i)h_t(\\mathbf x_i)}<\/span> 为归一化因子。<\/p>\n<ul><li>\n判对：<span class=\"katex-inline\">fh=+1<\/span>，<span class=\"katex-inline\">e^{-\\alpha_t}&lt;1<\/span>，权重下降；\n<\/li><li>\n判错：<span class=\"katex-inline\">fh=-1<\/span>，<span class=\"katex-inline\">e^{\\alpha_t}&gt;1<\/span>，权重上升。\n<\/ul>\n<p>下一轮基学习器被迫把注意力放在被前序判错的难样本上。更新方向不能颠倒：若判错样本权重调低，后续轮次重复漏掉同一批样本，集成误差沿原方向累积。<\/p>\n<h3>第六步：Bagging 采样与结合<\/h3>\n<p>自助采样：<span class=\"katex-inline\">m<\/span> 个样本有放回抽 <span class=\"katex-inline\">m<\/span> 次。单样本未被抽中概率 <span class=\"katex-inline\">(1-1/m)^m\\to1/e\\approx0.368<\/span>，约 63.2% 样本进入采样集。<span class=\"katex-inline\">T<\/span> 个采样集训出 <span class=\"katex-inline\">T<\/span> 个基学习器，分类投票、回归平均。各基学习器训练集不同但同分布，输出期望不变、方差随个体差异下降；Bagging 对高方差、低偏差模型收益最明显。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：首轮 AdaBoost 权重<\/h3>\n<p>设 6 个样本，首轮误差率 <span class=\"katex-inline\">\\varepsilon_1=2/6\\approx0.333<\/span>。基权重<\/p>\n<div class=\"katex-block\">\\alpha_1=\\frac12\\ln\\frac{1-0.333}{0.333}=\\frac12\\ln2\\approx0.347.<\/div>\n<p>判对样本权重乘 <span class=\"katex-inline\">e^{-0.347}\\approx0.707<\/span>，判错样本乘 <span class=\"katex-inline\">e^{0.347}\\approx1.414<\/span>。归一化前两类权重比约 <span class=\"katex-inline\">0.707:1.414=1:2<\/span>；归一化后判错样本在新分布中占比抬高。<\/p>\n<h3>算例 2：三轮误差与权重走向<\/h3>\n<p>设 <span class=\"katex-inline\">\\varepsilon_1=0.333<\/span>，<span class=\"katex-inline\">\\alpha_1\\approx0.347<\/span>；第二轮聚焦难样本后 <span class=\"katex-inline\">\\varepsilon_2=0.250<\/span>，<span class=\"katex-inline\">\\alpha_2=\\frac12\\ln3\\approx0.549<\/span>；第三轮 <span class=\"katex-inline\">\\varepsilon_3=0.167<\/span>，<span class=\"katex-inline\">\\alpha_3=\\frac12\\ln5\\approx0.805<\/span>。误差逐轮下降，基权重逐轮增大；最终分类 <span class=\"katex-inline\">H(\\mathbf x)=\\sum_t\\alpha_t h_t(\\mathbf x)<\/span>，符号为正判正例。<\/p>\n<h3>算例 3：投票与加权对照<\/h3>\n<p>三个基学习器对某样本输出 <span class=\"katex-inline\">+1,+1,-1<\/span>，权重分别 <span class=\"katex-inline\">0.347,0.549,0.805<\/span>。等权投票：2 比 1 判正例；加权求和 <span class=\"katex-inline\">0.347+0.549-0.805=0.091&gt;0<\/span>，仍判正例。若负例来自权重 0.805 的强基学习器，加权结果与等权投票可能翻转；权重反映各基模型在验证分布上的可靠程度。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong>多样性度量<\/strong>：个体间可用不合度量、相关系数、Q 统计量等衡量差异；多样性高但个体精度差，集成仍无效。集成边界是偏差与方差的联合权衡，不是单纯堆模型数量。\n<\/li><li>\n<strong>随机森林的双重扰动<\/strong>：Bagging 扰动样本，随机森林再在每个结点随机选属性子集分裂；两层扰动压低个体相关性，进一步降方差。树模型低偏差、高方差，是 Bagging 系的典型基学习器。\n<\/li><li>\n<strong>Boosting 的偏差驱动<\/strong>：Boosting 逐步拟合前序残差或错误，主要压低偏差；串行结构决定它不易并行，对噪声标签敏感——噪声被当难样本反复放大。Gradient Boosting 把指数损失推广到可微损失族，沿残差梯度叠加基模型（转述延伸）。\n<\/ul>\n<h3>两条路线的偏差-方差归属<\/h3>\n<p>Bagging 对同一分布的不同采样集训练基模型，输出平均压低方差：个体预测在不同样本扰动下摆动，平均后摆动幅度减小，偏差基本不变。Boosting 串行拟合前序错误，逐步把弱模型的偏差压低：每轮基学习器针对前序残差或误分样本叠加，偏差下降为主，方差随个体复杂度可能上升。选择路线先判断单模型短板：高方差低偏差用 Bagging，高偏差低方差用 Boosting。<\/p>\n<h3>重赋权与重采样<\/h3>\n<p>基学习器接受带权样本时，按 <span class=\"katex-inline\">D_t<\/span> 给每个样本赋权，训练目标按权重累计；只能处理等权样本的算法，按 <span class=\"katex-inline\">D_t<\/span> 有放回重采样，使难样本被抽中的概率抬高。两种做法分布等价，区别只在实现接口：重赋权改损失累计，重采样改抽样过程。原书指出两者一般无显著优劣差别（PDF 第 190 页前后）。<\/p>\n<h3>多样性度量与准确性约束<\/h3>\n<p>个体差异可用不合度量、相关系数、Q 统计量等衡量：两基学习器在样本上判断一致或不一致的比例构成不合度量。多样性高但个体精度差，集成无效；个体精度高但判断雷同，集成只重复同一模型。集成边界是&quot;好而不同&quot;的联合权衡，模型数量本身不产生收益，<span class=\"katex-inline\">T<\/span> 增大到个体差异耗尽后测试误差不再下降。<\/p>\n<h3>随机森林的双重扰动<\/h3>\n<p>Bagging 扰动训练样本，随机森林在每个分裂结点再随机抽取属性子集候选：每次分裂只在随机选出的少量属性中找最优划分。样本扰动加属性扰动使个体相关性进一步降低，方差压得更稳。树模型低偏差、高方差，是 Bagging 系典型基学习器；森林中各树独立生长，预测投票，训练可并行。<\/p>\n<h3>Boosting 的噪声敏感性<\/h3>\n<p>噪声标签被前序基学习器判错后，权重在下一轮被抬高，后续基学习器被迫围着噪声样本转；多轮累积后边界被异常点拉扯。Boosting 对异常标签比 Bagging 敏感，实践中需先清洗标签或限制轮数。Gradient Boosting 把指数损失推广到一般可微损失族，每轮基模型拟合当前残差的负梯度，沿函数空间梯度下降叠加；AdaBoost 是其指数损失特例（转述延伸）。<\/p>\n<h3>结合策略的口径<\/h3>\n<p>分类任务常用加权投票：<span class=\"katex-inline\">\\mathrm{sign}(\\sum_t\\alpha_t h_t(\\mathbf x))<\/span>；回归任务用加权平均 <span class=\"katex-inline\">\\sum_t\\alpha_t h_t(\\mathbf x)/\\sum_t\\alpha_t<\/span>。等权投票是 <span class=\"katex-inline\">\\alpha_t<\/span> 全相等的特例。权重 <span class=\"katex-inline\">\\alpha_t<\/span> 来自基学习器在当前分布上的误差，不是训练集精度；误差率高于 0.5 的基模型权重为负，在集成中起反向作用，通常应剔除而非保留。<\/p>\n<h3>三轮集成的误差走向<\/h3>\n<p>设首轮 <span class=\"katex-inline\">\\varepsilon_1=0.333<\/span>，<span class=\"katex-inline\">\\alpha_1\\approx0.347<\/span>；二轮聚焦难样本后 <span class=\"katex-inline\">\\varepsilon_2=0.250<\/span>，<span class=\"katex-inline\">\\alpha_2\\approx0.549<\/span>；三轮 <span class=\"katex-inline\">\\varepsilon_3=0.167<\/span>，<span class=\"katex-inline\">\\alpha_3\\approx0.805<\/span>。加权输出 <span class=\"katex-inline\">H=\\sum\\alpha_t h_t<\/span>。若某样本三轮判为 <span class=\"katex-inline\">+1,-1,+1<\/span>，加权和 <span class=\"katex-inline\">0.347-0.549+0.805=0.603&gt;0<\/span>，判正例；等权投票 2 比 1 同向。强基学习器权重大，其判断在翻转边缘时主导最终类别。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出指数损失按判对、判错拆项的表达式，说明两项概率权重为何是 <span class=\"katex-inline\">1-\\varepsilon_t<\/span> 与 <span class=\"katex-inline\">\\varepsilon_t<\/span>。\n<\/li><li>\n由损失对 <span class=\"katex-inline\">\\alpha_t<\/span> 的导数为零推得基权重闭式解；<span class=\"katex-inline\">\\varepsilon_t=0.5<\/span> 时权重是多少，对应什么模型水平？\n<\/li><li>\n样本更新式中判对、判错分别乘什么因子？归一化因子 <span class=\"katex-inline\">Z_t<\/span> 的作用是什么？\n<\/li><li>\nBagging 与 Boosting 分别主要压低偏差还是方差？为什么树模型常作为 Bagging 的基学习器，而弱分类器适合 Boosting？\n<\/ol><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.217<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">朴素贝叶斯分类器：贝叶斯决策论、条件独立假设与拉普拉斯修正<\/a><\/span><\/div><h1>k-means 原型聚类：平方误差目标函数、簇分配与均值更新、EM 视角与初值敏感<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：原书第 9 章聚类 9.1 聚类任务、9.4.1 k 均值算法（PDF 第 211、216–218 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>无监督学习中训练样本标记未知，目标是揭示数据内在性质与规律。聚类（clustering）把样本按相似度划入若干簇，使簇内样本接近、簇间样本分离。困难在于没有真值可对照，划分准则要自己定义；原型类方法用每个簇的代表点（原型）刻画簇，k-means 以簇内样本到均值向量的平方误差为目标，交替分配样本与更新原型，是最常用的原型聚类算法。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>簇划分<\/strong>：<span class=\"katex-inline\">C=\\{C_1,C_2,\\dots,C_k\\}<\/span>，<span class=\"katex-inline\">C_i<\/span> 为第 <span class=\"katex-inline\">i<\/span> 个簇，样本互不重叠地归入各簇。<\/p>\n<p><strong>平方误差目标<\/strong>：<\/p>\n<div class=\"katex-block\">E=\\sum_{i=1}^k\\sum_{\\mathbf x\\in C_i}\\lVert\\mathbf x-\\boldsymbol\\mu_i\\rVert_2^2,<\/div>\n<p><span class=\"katex-inline\">\\boldsymbol\\mu_i=\\frac1{|C_i|}\\sum_{\\mathbf x\\in C_i}\\mathbf x<\/span> 为簇 <span class=\"katex-inline\">i<\/span> 的均值向量；<span class=\"katex-inline\">E<\/span> 越小簇内样本围绕均值越紧密（原书 9.4.1 节，PDF 第 216 页）。<\/p>\n<p><strong>算法步骤<\/strong>：随机选 <span class=\"katex-inline\">k<\/span> 个样本作初始均值向量；重复以下两步直到均值不再更新——把每个样本归入最近均值向量所在簇；重算各簇均值向量（原书算法 9.2，PDF 第 217 页）。<\/p>\n<p><strong>NP 难背景<\/strong>：找到使 <span class=\"katex-inline\">E<\/span> 最小的簇划分需考察所有可能划分，是 NP 难问题；k-means 以迭代方式求近似解，不保证全局最优。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>固定均值向量时，<span class=\"katex-inline\">E<\/span> 对样本分配逐项独立：样本 <span class=\"katex-inline\">\\mathbf x_j<\/span> 归入使 <span class=\"katex-inline\">\\lVert\\mathbf x_j-\\boldsymbol\\mu_i\\rVert^2<\/span> 最小的簇，分配步骤不增大 <span class=\"katex-inline\">E<\/span>。固定簇划分后，<span class=\"katex-inline\">E<\/span> 对 <span class=\"katex-inline\">\\boldsymbol\\mu_i<\/span> 求导：<\/p>\n<div class=\"katex-block\">\\frac{\\partial E}{\\partial\\boldsymbol\\mu_i}=-2\\sum_{\\mathbf x\\in C_i}(\\mathbf x-\\boldsymbol\\mu_i),<\/div>\n<p>令导数为零得 <span class=\"katex-inline\">\\boldsymbol\\mu_i=\\frac1{|C_i|}\\sum_{\\mathbf x\\in C_i}\\mathbf x<\/span>，即簇内均值；在该簇内均值使距离平方和最小，更新步骤也不增大 <span class=\"katex-inline\">E<\/span>。<\/p>\n<p>两步交替，<span class=\"katex-inline\">E<\/span> 单调不增且有下界 0，算法在有限步内收敛到某个局部极小。EM 视角下：E 步按归属后验完成样本分配，M 步在当前归属下估计簇均值；结构与高斯混合模型的 EM 迭代一致。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：簇近似球形、簇内方差相近时效果稳定；样本度量为欧氏距离，特征尺度需先归一，量纲大的特征会主导距离。\n<\/li><li>\n<strong>失败案例一：初始均值落在同一簇内<\/strong>。初始偏置被迭代放大，可能把一个真实簇劈成两半，或把两个簇并入一个；换一组初值，最终划分与目标函数值都不同。\n<\/li><li>\n<strong>失败案例二：簇形不规则或密度不均<\/strong>。k-means 按球形距离划界，月牙形、带状簇会被硬切到不同均值上；这类场景需密度聚类或层次聚类。\n<\/li><li>\n<strong>失败案例三：<span class=\"katex-inline\">k<\/span> 取值不当<\/strong>。<span class=\"katex-inline\">k<\/span> 偏小把差异大的样本并入一簇，<span class=\"katex-inline\">k<\/span> 偏大把紧密簇切碎；簇数选择需结合肘部法或外部指标（转述）。\n<\/li><li>\n<strong>边界<\/strong>：算法对离群点敏感，均值被拉向极端值；大规模数据上 <span class=\"katex-inline\">m\\times k<\/span> 距离计算是主要成本。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>原型聚类 vs 密度聚类 vs 层次聚类<\/strong>：k-means 用原型代表簇；DBSCAN 按样本密度连通扩簇，可发现任意形状；层次聚类生成嵌套簇树状图。三者相似度定义与簇结构假设不同。\n<\/li><li>\n<strong>聚类 vs 监督分类<\/strong>：分类有标记、目标是拟合标记边界；聚类无标记、目标是发现数据分组。同一批特征上，聚类结果可作为分类的额外特征输入。\n<\/li><li>\n<strong>k-means vs 高斯混合<\/strong>：k-means 给硬归属（样本只属一簇），高斯混合给软归属概率；k-means 可看作高斯混合在等方差、归属概率硬判决下的特例。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c07 的后验归属与 EM 估计结构相通；概念 c01 的距离度量与误差口径用于评估簇内紧密程度。后继：概念 c10 的 PCA 先把数据压到低维，再在低维空间算距离做聚类；簇划分结果可作为概念 c08 集成模型的离散特征。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（k-means 原型聚类：平方误差目标函数、簇分配与均值更新、EM 视角与初值敏感）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：平方误差下降证明、均值更新求导与 EM 对应<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把 k-means 讲透，往回追四层前提：<\/p>\n<ol><li>\n<strong>先定义簇内相似度的度量<\/strong>。聚类没有标记真值，目标必须写成样本与代表点距离的函数；距离口径不定，分配与更新都无从推起。\n<\/li><li>\n<strong>目标函数拆成两个交替子问题<\/strong>。固定原型看分配，固定划分看原型更新；两步各自有明确最优解，交替构成算法。\n<\/li><li>\n<strong>收敛性要靠单调性证明<\/strong>。每步不增大目标、目标有下界，才能说明算法会停在稳定划分；不证明单调性，迭代是否收敛没有依据。\n<\/li><li>\n<strong>EM 视角提供概率对应<\/strong>。硬归属分配对应 E 步求后验，均值更新对应 M 步估参数；这一联系把 k-means 接入概率模型谱系。\n<\/ol>\n<p>依赖链方向：无监督分组目标 → 平方误差目标函数 → 固定均值的最近簇分配 → 固定划分的均值更新 → 单调下降与局部极小 → EM 对应。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：聚类任务与距离口径<\/h3>\n<p>聚类在无标记样本上揭示内在结构。常用无监督任务还包括密度估计、异常检测；聚类是其中研究最多的一类（原书 9.1 节，PDF 第 211 页）。k-means 采用欧氏距离平方 <span class=\"katex-inline\">\\lVert\\mathbf x-\\boldsymbol\\mu_i\\rVert_2^2<\/span> 作相似度度量，距离越小越相似。<\/p>\n<h3>第二步：目标函数<\/h3>\n<p>簇划分 <span class=\"katex-inline\">C=\\{C_1,\\dots,C_k\\}<\/span>，簇内平方误差<\/p>\n<div class=\"katex-block\">E(C,\\boldsymbol\\mu)=\\sum_{i=1}^k\\sum_{\\mathbf x\\in C_i}\\lVert\\mathbf x-\\boldsymbol\\mu_i\\rVert_2^2.<\/div>\n<p><span class=\"katex-inline\">E<\/span> 刻画所有样本到所属原型的偏离总和；值越小簇内越紧密。注意 <span class=\"katex-inline\">E<\/span> 不是分类准确率，它只衡量簇内紧凑度，不直接回答&quot;簇数是否合理&quot;。<\/p>\n<h3>第三步：固定均值，最优分配<\/h3>\n<p>固定 <span class=\"katex-inline\">\\boldsymbol\\mu_1,\\dots,\\boldsymbol\\mu_k<\/span>，<span class=\"katex-inline\">E<\/span> 中每个样本项独立：<\/p>\n<div class=\"katex-block\">E=\\sum_j\\min_{i}\\lVert\\mathbf x_j-\\boldsymbol\\mu_i\\rVert^2.<\/div>\n<p>样本 <span class=\"katex-inline\">\\mathbf x_j<\/span> 的归属只影响自己这一项，归入距离最近的簇即使该项最小：<\/p>\n<div class=\"katex-block\">\\lambda_j=\\arg\\min_{i\\in\\{1,\\dots,k\\}}\\lVert\\mathbf x_j-\\boldsymbol\\mu_i\\rVert^2.<\/div>\n<p>分配步骤不增大 <span class=\"katex-inline\">E<\/span>；若某样本到两个均值距离相等，归属任选，不影响当前目标值。<\/p>\n<h3>第四步：固定划分，最优原型<\/h3>\n<p>固定 <span class=\"katex-inline\">C_i<\/span>，<span class=\"katex-inline\">E<\/span> 对 <span class=\"katex-inline\">\\boldsymbol\\mu_i<\/span> 求导。展开第 <span class=\"katex-inline\">i<\/span> 簇项：<\/p>\n<div class=\"katex-block\">E_i=\\sum_{\\mathbf x\\in C_i}(\\mathbf x-\\boldsymbol\\mu_i)^\\top(\\mathbf x-\\boldsymbol\\mu_i).<\/div>\n<p>对 <span class=\"katex-inline\">\\boldsymbol\\mu_i<\/span> 求梯度：<\/p>\n<div class=\"katex-block\">\\frac{\\partial E_i}{\\partial\\boldsymbol\\mu_i}=-2\\sum_{\\mathbf x\\in C_i}(\\mathbf x-\\boldsymbol\\mu_i).<\/div>\n<p>令梯度为零：<\/p>\n<div class=\"katex-block\">\\sum_{\\mathbf x\\in C_i}\\mathbf x-|C_i|\\boldsymbol\\mu_i=0\\ \\Rightarrow\\ \\boldsymbol\\mu_i=\\frac1{|C_i|}\\sum_{\\mathbf x\\in C_i}\\mathbf x.<\/div>\n<p>二阶导数为 <span class=\"katex-inline\">2|C_i|I<\/span> 正定，该驻点是簇内平方和最小值点。均值向量就是簇内质心。<\/p>\n<h3>第五步：收敛性与局部极小<\/h3>\n<p>分配步 <span class=\"katex-inline\">E<\/span> 不增，更新步 <span class=\"katex-inline\">E<\/span> 不增，两步交替后序列 <span class=\"katex-inline\">E^{(t)}<\/span> 单调不增；<span class=\"katex-inline\">E\\ge0<\/span> 有下界，单调有界序列必收敛。有限样本下划分组合有限，算法在均值不再变化时停止。收敛点是局部极小：目标函数关于划分非凸，不同初值可能落到不同局部极小，不保证全局最优。原书指出求最优簇划分是 NP 难问题（PDF 第 216 页），迭代法是可行的近似路径。<\/p>\n<h3>第六步：EM 视角<\/h3>\n<p>高斯混合模型的 EM 迭代：E 步按当前参数算样本属于各簇的后验概率 <span class=\"katex-inline\">p(i|\\mathbf x)<\/span>；M 步按后验加权更新均值、协方差与混合系数。k-means 对应硬归属版本：E 步把后验最大的簇标为归属（硬判决），M 步按归属样本均值更新原型。软归属的混合模型给出概率簇成员，硬归属的 k-means 给出确定性划分；两者迭代骨架一致。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：四样本二维聚类<\/h3>\n<p>样本：<span class=\"katex-inline\">\\mathbf x_1=(0,0)<\/span>，<span class=\"katex-inline\">\\mathbf x_2=(0,1)<\/span>，<span class=\"katex-inline\">\\mathbf x_3=(3,3)<\/span>，<span class=\"katex-inline\">\\mathbf x_4=(3,4)<\/span>，<span class=\"katex-inline\">k=2<\/span>。初始均值 <span class=\"katex-inline\">\\boldsymbol\\mu_1=\\mathbf x_1=(0,0)<\/span>，<span class=\"katex-inline\">\\boldsymbol\\mu_2=\\mathbf x_3=(3,3)<\/span>。<\/p>\n<p>分配步：<\/p>\n<ul><li>\n<span class=\"katex-inline\">\\mathbf x_1<\/span>：到 <span class=\"katex-inline\">\\mu_1<\/span> 距离 0，到 <span class=\"katex-inline\">\\mu_2<\/span> 距离 <span class=\"katex-inline\">\\sqrt{18}<\/span>，归 <span class=\"katex-inline\">C_1<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">\\mathbf x_2<\/span>：到 <span class=\"katex-inline\">\\mu_1<\/span> 距离 1，到 <span class=\"katex-inline\">\\mu_2<\/span> 距离 <span class=\"katex-inline\">\\sqrt{13}<\/span>，归 <span class=\"katex-inline\">C_1<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">\\mathbf x_3<\/span>：到 <span class=\"katex-inline\">\\mu_1<\/span> 距离 <span class=\"katex-inline\">\\sqrt{18}<\/span>，到 <span class=\"katex-inline\">\\mu_2<\/span> 距离 0，归 <span class=\"katex-inline\">C_2<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">\\mathbf x_4<\/span>：到 <span class=\"katex-inline\">\\mu_1<\/span> 距离 5，到 <span class=\"katex-inline\">\\mu_2<\/span> 距离 1，归 <span class=\"katex-inline\">C_2<\/span>。\n<\/ul>\n<p>更新步：<\/p>\n<div class=\"katex-block\">\\boldsymbol\\mu_1=\\frac{(0,0)+(0,1)}2=(0,0.5),\\quad \\boldsymbol\\mu_2=\\frac{(3,3)+(3,4)}2=(3,3.5).<\/div>\n<p>再分配：距离不变关系，归属保持。<span class=\"katex-inline\">E=\\lVert(0,0)-(0,0.5)\\rVert^2+\\lVert(0,1)-(0,0.5)\\rVert^2+\\lVert(3,3)-(3,3.5)\\rVert^2+\\lVert(3,4)-(3,3.5)\\rVert^2=0.25+0.25+0.25+0.25=1.00<\/span>。<\/p>\n<h3>算例 2：初值敏感对照<\/h3>\n<p>同一数据集换初值：<span class=\"katex-inline\">\\boldsymbol\\mu_1=\\mathbf x_2=(0,1)<\/span>，<span class=\"katex-inline\">\\boldsymbol\\mu_2=\\mathbf x_4=(3,4)<\/span>。首轮分配仍把 <span class=\"katex-inline\">(0,0),(0,1)<\/span> 归一簇、<span class=\"katex-inline\">(3,3),(3,4)<\/span> 归一簇，收敛划分相同。若初值 <span class=\"katex-inline\">\\boldsymbol\\mu_1=\\mathbf x_1<\/span>、<span class=\"katex-inline\">\\boldsymbol\\mu_2=\\mathbf x_2<\/span>（同处左侧），首轮 <span class=\"katex-inline\">\\mathbf x_3,\\mathbf x_4<\/span> 都并入距离较近的 <span class=\"katex-inline\">\\mu_2<\/span>，后续迭代可能把右侧样本拆散；多跑几组初值取 <span class=\"katex-inline\">E<\/span> 最小者，是工程上缓解局部极小的做法。<\/p>\n<h3>算例 3：尺度未归一的距离主导<\/h3>\n<p>特征 <span class=\"katex-inline\">x_1<\/span> 取值 <span class=\"katex-inline\">0\\sim1<\/span>，<span class=\"katex-inline\">x_2<\/span> 取值 <span class=\"katex-inline\">0\\sim1000<\/span>。距离平方中 <span class=\"katex-inline\">x_2<\/span> 差分量纲占绝对主导，聚类边界几乎只由 <span class=\"katex-inline\">x_2<\/span> 决定。先按各特征减均值除标准差归一化，使距离口径对各特征均衡，再跑 k-means。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong><span class=\"katex-inline\">k<\/span> 的选择<\/strong>：肘部法观察 <span class=\"katex-inline\">E<\/span> 随 <span class=\"katex-inline\">k<\/span> 增大的下降斜率，下降由陡转缓的拐点对应合适簇数；外部指标如轮廓系数衡量簇内紧密度与簇间分离度。<span class=\"katex-inline\">k<\/span> 是超参数，需结合业务可解释性选择（转述原书 9.4 节前后）。\n<\/li><li>\n<strong>离群点影响<\/strong>：均值受极端值拉扯，单个离群点可使整簇原型偏移；鲁棒版本可用中位数原型或先剔除异常点再聚类。\n<\/li><li>\n<strong>与密度、层次方法的分工<\/strong>：球形紧凑簇用 k-means 高效；任意形状连通结构用 DBSCAN；需要簇间层次关系用凝聚或分裂层次聚类。方法选择取决于簇的形状假设，而非单纯精度比较。\n<\/ul>\n<h3>簇数选择与轮廓系数<\/h3>\n<p>肘部法观察 <span class=\"katex-inline\">E<\/span> 随 <span class=\"katex-inline\">k<\/span> 增大的下降曲线：<span class=\"katex-inline\">k<\/span> 偏小时 <span class=\"katex-inline\">E<\/span> 随加簇陡降，超过合理簇数后下降转缓，拐点对应候选簇数。轮廓系数对每个样本算 <span class=\"katex-inline\">(b-a)/\\max(a,b)<\/span>，<span class=\"katex-inline\">a<\/span> 为簇内平均距离、<span class=\"katex-inline\">b<\/span> 到最近外簇平均距离；系数接近 1 簇内紧、簇间分，接近 -1 归属可疑。<span class=\"katex-inline\">k<\/span> 最终还要结合业务可解释性，指标最优不等于业务可用。<\/p>\n<h3>离群点与尺度问题<\/h3>\n<p>均值是平方误差最优原型，但受极端值拉扯：单个远离样本可使整簇质心偏移，边界随之倾斜。鲁棒做法先用距离剔除异常点，或改用中位数原型。特征尺度未归一时代量大的特征主导距离，聚类边界被该特征绑架；先减均值除标准差再算欧氏距离，使各特征在距离中权重均衡。<\/p>\n<h3>与高斯混合的软归属对照<\/h3>\n<p>k-means 给硬归属：样本明确划入一簇。高斯混合模型给软归属：样本以概率 <span class=\"katex-inline\">p(i|\\mathbf x)<\/span> 属于各簇，M 步按后验加权更新均值、协方差与混合系数。k-means 可看作混合模型在等方差、后验硬判决下的近似；软归属保留样本跨簇的不确定度，边界样本不必强行站队。EM 迭代骨架一致：E 步算归属，M 步更新参数。<\/p>\n<h3>计算成本与初始化实践<\/h3>\n<p>每轮距离计算 <span class=\"katex-inline\">m\\times k<\/span> 次，迭代轮数取决于收敛速度；大规模数据上用小批量 k-means 分批更新质心。初始化随机选 <span class=\"katex-inline\">k<\/span> 个样本，不同初值落到不同局部极小；工程上多次运行取 <span class=\"katex-inline\">E<\/span> 最小划分，或用 k-means++ 按距离概率选初始点，使初始质心尽量分散。算法不保证全局最优，这是 NP 难背景下迭代近似的固有代价。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出固定均值时样本归属的最优准则，说明为什么分配可以逐项独立做决定。\n<\/li><li>\n对簇内平方和求导，证明簇原型取簇内均值是最小值点；二阶导数正定起什么作用？\n<\/li><li>\n收敛性证明依赖哪两条性质？为什么说 k-means 收敛到局部极小而不是全局最优？\n<\/li><li>\nk-means 与高斯混合 EM 在 E 步、M 步分别怎么对应？硬归属相比软归属丢掉了什么信息？\n<\/ol><\/div><\/details>", "c10": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.244<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">k-means 原型聚类：平方误差目标函数、簇分配与均值更新、EM 视角与初值敏感<\/a><\/span><\/div><h1>主成分分析 PCA：方差最大化与最小重构误差的等价性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：原书第 10 章降维与度量学习 10.3 主成分分析（PDF 第 243–246 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>高维数据中大量特征彼此相关，直接计算距离会被噪声维度稀释，维度灾难使近邻估计不可靠。降维要把数据压到低维空间，同时尽量保留原有信息。主成分分析（Principal Components Analysis，PCA）找一组标准正交投影基，使样本在低维坐标上的投影尽量分散，或等价地使重构回原空间的误差尽量小；两条路径推出同一个优化目标。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>中心化<\/strong>：样本已平移到原点，<span class=\"katex-inline\">\\sum_i\\mathbf x_i=0<\/span>。<\/p>\n<p><strong>投影基<\/strong>：<span class=\"katex-inline\">\\{\\mathbf w_1,\\dots,\\mathbf w_d\\}<\/span> 为标准正交基，<span class=\"katex-inline\">\\mathbf w_j^\\top\\mathbf w_k=0<\/span>（<span class=\"katex-inline\">j\\neq k<\/span>），<span class=\"katex-inline\">\\lVert\\mathbf w_j\\rVert=1<\/span>。降到 <span class=\"katex-inline\">d&#x27;&lt;d<\/span> 维时，样本 <span class=\"katex-inline\">\\mathbf x_i<\/span> 的低维坐标 <span class=\"katex-inline\">z_{ij}=\\mathbf w_j^\\top\\mathbf x_i<\/span>，重构 <span class=\"katex-inline\">\\hat{\\mathbf x}_i=\\sum_{j=1}^{d&#x27;}z_{ij}\\mathbf w_j<\/span>。<\/p>\n<p><strong>最近重构性<\/strong>：原样本点到投影超平面的距离尽量近，即最小化重构距离平方和。<\/p>\n<p><strong>最大可分性<\/strong>：样本在超平面上的投影尽量分开，即最大化投影方差（原书 10.3 节，PDF 第 244 页）。<\/p>\n<p><strong>协方差矩阵<\/strong>：<span class=\"katex-inline\">XX^\\top=\\sum_i\\mathbf x_i\\mathbf x_i^\\top<\/span>，主成分方向由其特征值分解给出；实践中常用奇异值分解（SVD）代替协方差特征值分解（PDF 第 245 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>重构距离平方和展开：<\/p>\n<div class=\"katex-block\">\\sum_i\\lVert\\mathbf x_i-\\hat{\\mathbf x}_i\\rVert^2=\\sum_i\\lVert\\mathbf x_i\\rVert^2-2\\sum_i\\sum_{j=1}^{d'}z_{ij}\\mathbf w_j^\\top\\mathbf x_i+\\mathrm{const},<\/div>\n<p>利用基正交性整理，与基有关的项为 <span class=\"katex-inline\">-\\mathrm{tr}(W^\\top XX^\\top W)<\/span>。最近重构性要求最小化重构距离，即在 <span class=\"katex-inline\">W^\\top W=I<\/span> 约束下最大化 <span class=\"katex-inline\">\\mathrm{tr}(W^\\top XX^\\top W)<\/span>。<\/p>\n<p>从最大可分性出发，投影方差 <span class=\"katex-inline\">\\sum_i\\lVert W^\\top\\mathbf x_i\\rVert^2=\\mathrm{tr}(W^\\top XX^\\top W)<\/span>，最大化投影方差得到同一目标。对协方差矩阵特征值分解，最大 <span class=\"katex-inline\">d&#x27;<\/span> 个特征值对应的特征向量即主成分方向。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：特征尺度可比，必要时先标准化；线性结构为主的数据上 PCA 保留线性相关方向；无监督降维，不利用类别标记。\n<\/li><li>\n<strong>失败案例一：把大方差方向当判别方向<\/strong>。方差大不代表类别区分强；两类样本可能沿方差小的方向分开，保留主成分后判别方向被丢掉。有监督判别应看 LDA 类方法。\n<\/li><li>\n<strong>失败案例二：未中心化直接分解<\/strong>。均值偏移会被协方差第一项吸收，主方向混入整体平移；中心化是推导前提。\n<\/li><li>\n<strong>失败案例三：非线性结构硬套线性 PCA<\/strong>。螺旋、流形结构上线性投影破坏邻域关系，需核 PCA 或流形方法。\n<\/li><li>\n<strong>边界<\/strong>：PCA 输出分量互不相关，但不保证稀疏；主成分数 <span class=\"katex-inline\">d&#x27;<\/span> 按累计方差解释比选择，是超参数。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>PCA vs LDA<\/strong>：PCA 无监督，找方差最大方向；LDA 有监督，找类间散度与类内散度比值最大方向。前者保重构信息，后者保判别信息。\n<\/li><li>\n<strong>方差最大化 vs 最小重构误差<\/strong>：两条推导路径表面目标不同，展开后落到同一个 <span class=\"katex-inline\">\\mathrm{tr}(W^\\top XX^\\top W)<\/span>，优化目标等价；这是 PCA 最核心的结论。\n<\/li><li>\n<strong>PCA vs 特征选择<\/strong>：PCA 对原特征做线性组合生成新成分；特征选择直接保留原特征子集。前者压缩重叠信息，后者保留可解释原属性。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c09 聚类在 PCA 压缩后的低维空间算距离更稳；概念 c06 的核函数可把 PCA 推广到高维特征空间（核 PCA）。后继：概念 c11 的嵌入式选择与 PCA 同属降维/压缩谱系；概念 c12 的假设复杂度分析可解释高维降维对泛化误差的影响。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（主成分分析 PCA：方差最大化与最小重构误差的等价性）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：重构误差展开、方差最大化等价性与特征方程<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把 PCA 讲透，往回追四层前提：<\/p>\n<ol><li>\n<strong>先固定投影表达方式<\/strong>。低维坐标由原样本在一组基上的内积给出，重构是坐标乘基向量的叠加；不定投影形式，两条推导都无法落地。\n<\/li><li>\n<strong>重构路径从距离出发<\/strong>。最近重构性要求原样本与重构样本距离近，把距离平方和展开后分离出与基有关的迹项。\n<\/li><li>\n<strong>方差路径从分离度出发<\/strong>。最大可分性要求投影点分散，投影方差同样写成协方差矩阵的二次型。\n<\/li><li>\n<strong>两路径等价后才求解<\/strong>。确认目标一致，再用拉格朗日乘子法得到协方差特征方程；SVD 是数值实现替代路径。\n<\/ol>\n<p>依赖链方向：中心化数据 → 投影与重构式 → 重构距离展开 → 投影方差式 → 同一迹目标 → 特征值分解取主成分。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：中心化与记号<\/h3>\n<p>样本 <span class=\"katex-inline\">\\mathbf x_i\\in\\mathbb R^d<\/span>，<span class=\"katex-inline\">i=1,\\dots,m<\/span>，已中心化 <span class=\"katex-inline\">\\sum_i\\mathbf x_i=0<\/span>。投影基 <span class=\"katex-inline\">W=(\\mathbf w_1,\\dots,\\mathbf w_{d&#x27;})<\/span>，标准正交约束 <span class=\"katex-inline\">W^\\top W=I_{d&#x27;}<\/span>。低维坐标 <span class=\"katex-inline\">z_{ij}=\\mathbf w_j^\\top\\mathbf x_i<\/span>，重构<\/p>\n<div class=\"katex-block\">\\hat{\\mathbf x}_i=\\sum_{j=1}^{d'}z_{ij}\\mathbf w_j=W\\mathbf z_i.<\/div>\n<h3>第二步：重构距离展开<\/h3>\n<p>原样本与重构样本距离平方和<\/p>\n<div class=\"katex-block\">J_{\\mathrm{recon}}=\\sum_{i=1}^m\\lVert\\mathbf x_i-\\hat{\\mathbf x}_i\\rVert^2.<\/div>\n<p>展开被减项：<\/p>\n<div class=\"katex-block\">\\lVert\\mathbf x_i-\\hat{\\mathbf x}_i\\rVert^2=\\lVert\\mathbf x_i\\rVert^2-2\\mathbf x_i^\\top\\hat{\\mathbf x}_i+\\lVert\\hat{\\mathbf x}_i\\rVert^2.<\/div>\n<p>由基正交性，<span class=\"katex-inline\">\\lVert\\hat{\\mathbf x}_i\\rVert^2=\\sum_j z_{ij}^2=\\sum_j(\\mathbf w_j^\\top\\mathbf x_i)^2<\/span>，<span class=\"katex-inline\">\\mathbf x_i^\\top\\hat{\\mathbf x}_i=\\sum_j z_{ij}\\mathbf w_j^\\top\\mathbf x_i=\\sum_j(\\mathbf w_j^\\top\\mathbf x_i)^2<\/span>，后两项抵消后剩下 <span class=\"katex-inline\">-\\sum_j(\\mathbf w_j^\\top\\mathbf x_i)^2<\/span>。整体<\/p>\n<div class=\"katex-block\">J_{\\mathrm{recon}}=\\sum_i\\lVert\\mathbf x_i\\rVert^2-\\sum_{i,j}(\\mathbf w_j^\\top\\mathbf x_i)^2.<\/div>\n<p>第一项与 <span class=\"katex-inline\">W<\/span> 无关，最小化 <span class=\"katex-inline\">J_{\\mathrm{recon}}<\/span> 等价于最大化<\/p>\n<div class=\"katex-block\">\\sum_{i,j}(\\mathbf w_j^\\top\\mathbf x_i)^2=\\mathrm{tr}(W^\\top XX^\\top W).<\/div>\n<h3>第三步：最大可分性路径<\/h3>\n<p>样本在低维超平面上的投影方差，按各维坐标方差求和：<\/p>\n<div class=\"katex-block\">J_{\\mathrm{var}}=\\sum_{i=1}^m\\lVert W^\\top\\mathbf x_i\\rVert^2=\\sum_{i,j}(\\mathbf w_j^\\top\\mathbf x_i)^2=\\mathrm{tr}(W^\\top XX^\\top W).<\/div>\n<p>与重构路径得到的迹项完全相同。方差最大方向即投影后样本最分散的方向；重构误差最小方向即保留信息最多的方向，两者是同一优化目标的两种说法。<\/p>\n<h3>第四步：约束优化与特征方程<\/h3>\n<p>单列方向 <span class=\"katex-inline\">\\mathbf w<\/span>，目标 <span class=\"katex-inline\">\\mathbf w^\\top XX^\\top\\mathbf w<\/span>，约束 <span class=\"katex-inline\">\\mathbf w^\\top\\mathbf w=1<\/span>。拉格朗日函数<\/p>\n<div class=\"katex-block\">L(\\mathbf w,\\lambda)=\\mathbf w^\\top XX^\\top\\mathbf w-\\lambda(\\mathbf w^\\top\\mathbf w-1).<\/div>\n<p>对 <span class=\"katex-inline\">\\mathbf w<\/span> 求偏导为零：<\/p>\n<div class=\"katex-block\">2XX^\\top\\mathbf w-2\\lambda\\mathbf w=0\\ \\Rightarrow\\ XX^\\top\\mathbf w=\\lambda\\mathbf w.<\/div>\n<p><span class=\"katex-inline\">\\mathbf w<\/span> 是协方差矩阵 <span class=\"katex-inline\">XX^\\top<\/span> 的特征向量，<span class=\"katex-inline\">\\lambda<\/span> 为对应特征值。目标值 <span class=\"katex-inline\">\\mathbf w^\\top XX^\\top\\mathbf w=\\lambda<\/span>，故特征值越大方向保留方差越多；按特征值从大到小取前 <span class=\"katex-inline\">d&#x27;<\/span> 个特征向量作主成分。<\/p>\n<h3>第五步：SVD 实现路径<\/h3>\n<p>实践中对数据矩阵做奇异值分解 <span class=\"katex-inline\">X=U\\Sigma V^\\top<\/span>，右奇异向量 <span class=\"katex-inline\">V<\/span> 的列即协方差 <span class=\"katex-inline\">XX^\\top=U\\Sigma^2U^\\top<\/span> 的特征向量；避免显式构造 <span class=\"katex-inline\">XX^\\top<\/span> 可减小数值误差。逐一选取方向的做法：先取最大特征值对应向量，扣除该方向方差后再分解残差；由正交性可知，逐一选取与直接取最大 <span class=\"katex-inline\">d&#x27;<\/span> 个特征值等价（原书 10.3 节，PDF 第 245 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：二维三点中心化<\/h3>\n<p>样本 <span class=\"katex-inline\">(1,1)<\/span>、<span class=\"katex-inline\">(2,2)<\/span>、<span class=\"katex-inline\">(3,3)<\/span> 的均值 <span class=\"katex-inline\">(2,2)<\/span>，中心化后 <span class=\"katex-inline\">(-1,-1)<\/span>、<span class=\"katex-inline\">(0,0)<\/span>、<span class=\"katex-inline\">(1,1)<\/span>。协方差<\/p>\n<div class=\"katex-block\">XX^\\top=\\begin{pmatrix}2&2\\\\2&2\\end{pmatrix}.<\/div>\n<p>特征方程 <span class=\"katex-inline\">\\det(XX^\\top-\\lambda I)=\\lambda^2-4\\lambda=\\lambda(\\lambda-4)=0<\/span>，特征值 <span class=\"katex-inline\">\\lambda_1=4,\\lambda_2=0<\/span>。<span class=\"katex-inline\">\\lambda_1<\/span> 对应特征向量满足 <span class=\"katex-inline\">2w_1+2w_2=4w_1\\Rightarrow w_1=w_2<\/span>，单位化 <span class=\"katex-inline\">\\mathbf w_1=(1,1)/\\sqrt2<\/span>；主方向沿直线 <span class=\"katex-inline\">x_1=x_2<\/span>，第二主成分方差为 0，数据在该方向无展开。<\/p>\n<h3>算例 2：投影坐标与重构<\/h3>\n<p>样本 <span class=\"katex-inline\">(1,1)<\/span> 中心化后 <span class=\"katex-inline\">(-1,-1)<\/span>，投影坐标 <span class=\"katex-inline\">z=\\mathbf w_1^\\top(-1,-1)=-\\sqrt2<\/span>；重构 <span class=\"katex-inline\">\\hat{\\mathbf x}=z\\mathbf w_1=(-1,-1)<\/span>，重构误差为 0。取第二主成分后坐标为 0，丢弃不损失信息。<\/p>\n<h3>算例 3：方差解释比<\/h3>\n<p>设协方差特征值为 <span class=\"katex-inline\">(4.0,1.0,0.5)<\/span>，累计总方差 5.5。取前 1 个成分解释比 <span class=\"katex-inline\">4/5.5\\approx0.727<\/span>；取前 2 个 <span class=\"katex-inline\">5/5.5\\approx0.909<\/span>。成分数按解释比阈值（如 90%）选择，剩余小方差方向视为噪声。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong>标准化与尺度影响<\/strong>：PCA 对特征尺度敏感，量纲大的特征方差被放大；各特征取值范围悬殊时先减均值除标准差，再做协方差分解。否则主方向被大量纲特征绑架。\n<\/li><li>\n<strong>PCA 与 LDA 的分工<\/strong>：无监督场景只能看方差；有监督且目标是分类时，类间/类内散度比才是判别方向依据。PCA 常作为 LDA、聚类之前的预处理步骤。\n<\/li><li>\n<strong>核 PCA<\/strong>：线性 PCA 的内积可像 SVM 对偶那样替换为核函数，在 <span class=\"katex-inline\">\\phi<\/span> 张成的高维空间做主成分；非线性流形上核 PCA 比线性投影更能保留局部结构（概念 c06 延伸）。\n<\/li><li>\n<strong>稀疏性与可解释性<\/strong>：普通主成分是原特征的稠密组合，难以指认单个属性；稀疏 PCA 在主成分上加 L1 约束，使成分只由少数原特征构成（概念 c11 正则衔接）。\n<\/ul>\n<h3>标准化对主方向的影响<\/h3>\n<p>PCA 最大化方差，量纲大的特征天然占高方差。若某特征取值 <span class=\"katex-inline\">0\\sim1000<\/span>，另一特征 <span class=\"katex-inline\">0\\sim1<\/span>，主方向几乎被大量纲特征锁定，小方差但有判别信息的方向被压到次成分。分解前先对各特征减均值除标准差，使距离与方差口径均衡；是否标准化取决于业务上是否希望量纲主导，不能默认直接分解原始值。<\/p>\n<h3>重构误差与累计解释比<\/h3>\n<p>保留 <span class=\"katex-inline\">d&#x27;<\/span> 个主成分后，重构误差为被丢弃方向的方差和：<\/p>\n<div class=\"katex-block\">J_{\\mathrm{recon}}=\\sum_{j>d'}\\lambda_j.<\/div>\n<p>累计解释比 <span class=\"katex-inline\">\\sum_{j=1}^{d&#x27;}\\lambda_j/\\sum_{j=1}^d\\lambda_j<\/span> 衡量保留信息比例。成分数按阈值（如 90%）选取；阈值越高重构越精，低维坐标维度越大。被丢弃的小方差方向常被视为噪声，但其中可能含弱判别信号，分类任务需回到验证集确认。<\/p>\n<h3>投影坐标的尺度与去相关<\/h3>\n<p>主成分坐标 <span class=\"katex-inline\">z_{ij}=\\mathbf w_j^\\top\\mathbf x_i<\/span> 在新坐标系下互不相关：协方差矩阵在 <span class=\"katex-inline\">W^\\top<\/span> 基下对角化，对角元即特征值。各主成分方差等于对应 <span class=\"katex-inline\">\\lambda_j<\/span>，按从大到小排列。降维后做聚类或回归，特征间重叠信息被去除，距离比较不再被重复维度稀释。<\/p>\n<h3>与特征选择、LDA 的分工<\/h3>\n<p>PCA 生成稠密组合成分，不保留原属性名；特征选择保留原特征子集，结果可读回业务属性。LDA 有监督，目标是类间散度与类内散度之比；PCA 无监督，只看总方差。分类场景常先 PCA 去相关降噪，再上 LDA 或分类器；无标签探索阶段只能用 PCA 这类无监督方法。<\/p>\n<h3>核 PCA 的衔接<\/h3>\n<p>线性 PCA 中内积 <span class=\"katex-inline\">\\mathbf x_i^\\top\\mathbf x_j<\/span> 可替换为核函数 <span class=\"katex-inline\">\\kappa(\\mathbf x_i,\\mathbf x_j)<\/span>，在 <span class=\"katex-inline\">\\phi<\/span> 张成的高维空间做主成分。非线性流形上线性投影破坏邻域关系，核 PCA 借核映射保留局部结构；其对偶形式与 SVM 核方法共用同一内积替换路径（概念 c06）。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n重构距离展开后，为什么最小化重构误差等价于最大化 <span class=\"katex-inline\">\\mathrm{tr}(W^\\top XX^\\top W)<\/span>？哪一项与基无关被略去？\n<\/li><li>\n写出单列方向的拉格朗日函数与特征方程，说明目标值为何等于对应特征值。\n<\/li><li>\n方差大的方向为什么不一定是判别方向？举两类样本沿小方差分量分离的例子。\n<\/li><li>\nSVD 路径如何避开显式构造 <span class=\"katex-inline\">XX^\\top<\/span>？逐一选方向与直接取前 <span class=\"katex-inline\">d&#x27;<\/span> 个特征向量为何等价？\n<\/ol><\/div><\/details>", "c11": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.263<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">线性模型：最小二乘正规方程、对数几率回归的对数似然与梯度<\/a><\/span><\/div><h1>特征选择与稀疏学习：过滤/包裹/嵌入机制、L1 与 L2 正则化的几何差别<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：原书第 11 章特征选择与稀疏学习（PDF 第 261–268 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>给定属性集中有些特征对任务有用，有些没用；无关特征增加维度、稀释距离，也抬高过拟合风险。特征选择（feature selection）从原始属性集中挑出相关特征子集，目的是降维、改善泛化与可解释性。困难分两步：怎样搜索候选子集，以及按什么准则评价子集好坏；按搜索与学习器的结合方式，方法分成过滤式、包裹式、嵌入式三类。稀疏学习则用正则项直接让权重产生大量零分量，把选择过程压进模型优化。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>相关与无关特征<\/strong>：对当前学习任务有用的属性称相关特征（relevant feature），没用的称无关特征（irrelevant feature）（原书 11.1 节，PDF 第 261 页）。<\/p>\n<p><strong>子集搜索<\/strong>：前向搜索从空集逐步加入特征；后向搜索从全集逐步剔除；随机搜索在子集空间随机探索。<\/p>\n<p><strong>子集评价<\/strong>：信息增益衡量特征子集划分与标记划分的差异；其他能判断两个划分差异的机制也可作评价准则（原书 11.2 节，PDF 第 263 页）。<\/p>\n<p><strong>过滤式（filter）<\/strong>：先选特征再训练学习器，选择过程与后续模型无关，相当于先用准则过滤一遍。<\/p>\n<p><strong>包裹式（wrapper）<\/strong>：在特征子集上用交叉验证估计学习器误差，以模型误差为选择准则；典型代表 LVW（Las Vegas Wrapper）（原书 11.3 节，PDF 第 265 页）。<\/p>\n<p><strong>嵌入式（embedding）<\/strong>：特征选择直接嵌入模型优化过程，如决策树结点划分属性、带 L1 正则的线性模型。<\/p>\n<p><strong>范数正则<\/strong>：L2 项 <span class=\"katex-inline\">\\lambda\\lVert\\mathbf w\\rVert_2^2<\/span>，L1 项 <span class=\"katex-inline\">\\lambda\\lVert\\mathbf w\\rVert_1<\/span>；L1 更易获得稀疏解，非零分量更少（原书 11.4 节，PDF 第 266 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>二维线性模型画出损失等值线与正则区域：L2 正则区域是圆 <span class=\"katex-inline\">\\omega_1^2+\\omega_2^2\\le r^2<\/span>，等值线与圆周相切通常落在坐标轴外，两个分量一般非零；L1 正则区域是菱形 <span class=\"katex-inline\">|\\omega_1|+|\\omega_2|\\le r<\/span>，角点落在坐标轴上，损失等值线碰到角点时一个分量被压成零。稀疏性来自菱形棱与角提供的轴上切点，圆形边界没有这种尖角。L0 范数要求非零分量最少，但不连续、难以优化，实践中用 L1 近似。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：过滤式适合高维粗筛、模型未定场景；包裹式适合子集规模可控、计算预算充足；嵌入式随模型一次训练完成，适合可加正则的线性与树模型。\n<\/li><li>\n<strong>失败案例一：过滤式与后续模型脱节<\/strong>。边际相关高的特征在具体模型组合中可能无效；纯过滤可能丢掉对某模型关键的弱相关特征。\n<\/li><li>\n<strong>失败案例二：包裹式子集组合爆炸<\/strong>。特征数大时候选子集指数增长，反复交叉验证训练开销不可承受；需限停条件或随机策略。\n<\/li><li>\n<strong>失败案例三：正则强度与模型容量错配<\/strong>。<span class=\"katex-inline\">\\lambda<\/span> 过大把权重全压零，欠拟合；过小失去稀疏与约束作用。强度在验证集上选。\n<\/li><li>\n<strong>边界<\/strong>：特征选择保留原属性可解释性；PCA 生成组合成分，两者压缩口径不同。稀疏解不自动等于好模型，零分量的稳定性需多样本验证。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>过滤式 vs 包裹式 vs 嵌入式<\/strong>：过滤与学习器解耦，快但粗；包裹以模型误差为准，准但贵；嵌入把选择写进训练目标，一次完成。\n<\/li><li>\n<strong>L1 vs L2<\/strong>：L1 产生稀疏权重，可兼作特征选择；L2 压缩权重幅值，权重趋小但一般不为零。L1 对应拉普拉斯先验，L2 对应高斯先验。\n<\/li><li>\n<strong>特征选择 vs 主成分分析<\/strong>：选择保留原特征子集；PCA 把原特征线性组合成新成分。选择结果可读回原属性，成分结果是稠密组合。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c02 的损失函数是正则项的挂载点；概念 c03 决策树的划分属性集合就是一种嵌入式选择。后继：概念 c10 的 PCA 是另一条降维路线；概念 c12 的假设复杂度分析解释了无关特征如何放大假设空间、抬高样本复杂度。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（特征选择与稀疏学习：过滤/包裹/嵌入机制、L1 与 L2 正则化的几何差别）<\/summary><div class=\"depth-body\"><h1>c11 深度推导：子集搜索评价链条、三类选择机制对照与 L1/L2 几何证明<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把特征选择讲透，往回追四层前提：<\/p>\n<ol><li>\n<strong>先区分相关与无关特征<\/strong>。任务驱动的相关性定义是选择前提；泛泛按方差大挑特征，会把高方差噪声误选进来。\n<\/li><li>\n<strong>子集空间需要搜索策略<\/strong>。特征数 <span class=\"katex-inline\">d<\/span> 对应 <span class=\"katex-inline\">2^d<\/span> 个子集，逐个枚举不可行；前向、后向、随机是三类可行探索路径。\n<\/li><li>\n<strong>子集要有评价准则<\/strong>。准则可基于信息增益等划分差异，也可基于学习器交叉验证误差；准则不同，选择结果不同。\n<\/li><li>\n<strong>选择与训练的结合方式分出三类机制<\/strong>：过滤式先选后训，包裹式以模型误差包裹搜索，嵌入式把选择写进优化目标。正则化从损失侧提供稀疏解路径。\n<\/ol>\n<p>依赖链方向：特征相关性 → 子集搜索策略 → 子集评价准则 → 过滤/包裹/嵌入对照 → 范数正则几何 → 稀疏解来源。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：相关性定义<\/h3>\n<p>相关特征是对当前学习任务有预测作用的属性；无关特征在给定标记后不提供额外信息。注意相关性是任务相关的：同一特征在分类任务中无关，在回归任务中可能有用。选择目标不是删低方差特征，而是删对标记无贡献的特征。<\/p>\n<h3>第二步：子集搜索策略<\/h3>\n<ul><li>\n<strong>前向搜索<\/strong>：从空集开始，每轮加入使评价提升最大的特征，直到提升停滞。路径由少到多，倾向于给出偏小子集。\n<\/li><li>\n<strong>后向搜索<\/strong>：从全集开始，每轮剔除使评价下降最小的特征，直到剔除损害性能。路径由多到少，保留组合信息。\n<\/li><li>\n<strong>随机搜索<\/strong>：随机产生子集或随机交换特征，配合停止条件跳出局部组合；拉斯维加斯方法给满足要求的解或不给解，蒙特卡罗方法一定给解但未必满足要求（原书 11.3 节，PDF 第 265 页）。\n<\/ul>\n<h3>第三步：子集评价机制<\/h3>\n<p>信息熵 <span class=\"katex-inline\">\\mathrm{Ent}(D)=-\\sum_k p_k\\log_2 p_k<\/span>，信息增益 <span class=\"katex-inline\">\\mathrm{Gain}(A)<\/span> 度量子集 <span class=\"katex-inline\">A<\/span> 划分与标记划分的差异。更一般地，子集确定对数据集的一个划分，标记对应真实划分；两个划分差异越小，子集越好。决策树结点划分属性构成的集合，就是该框架下的嵌入式选择结果。<\/p>\n<h3>第四步：过滤式流程<\/h3>\n<ol><li>\n在原始数据集上按准则给特征或子集打分；\n<\/li><li>\n选出高分子集；\n<\/li><li>\n用筛选后特征单独训练学习器。\n<\/ol>\n<p>选择过程不接触后续模型，计算开销低，可并行粗筛；缺点是准则与最终模型目标脱节，边际相关不等于模型内有效。Relief 类方法按近邻样本对的特征差异打分，属过滤式代表（转述原书 11.2 节）。<\/p>\n<h3>第五步：包裹式流程<\/h3>\n<p>LVW 算法：初始化全集 <span class=\"katex-inline\">A^*=A<\/span>、误差 <span class=\"katex-inline\">E=\\infty<\/span>、未更新轮数 <span class=\"katex-inline\">t=0<\/span>；每轮随机产生子集 <span class=\"katex-inline\">A&#x27;<\/span>，在 <span class=\"katex-inline\">A&#x27;<\/span> 上交叉验证得误差 <span class=\"katex-inline\">E&#x27;<\/span>；若 <span class=\"katex-inline\">E&#x27;&lt;E<\/span>，或 <span class=\"katex-inline\">E&#x27;=E<\/span> 且 <span class=\"katex-inline\">|A&#x27;|&lt;|A|<\/span>，更新最优子集并重置 <span class=\"katex-inline\">t<\/span>，否则 <span class=\"katex-inline\">t<\/span> 加 1；连续 <span class=\"katex-inline\">T<\/span> 轮未更新则停止。包裹式直接以学习器泛化误差为准则，选择结果对该模型更准；代价是每个候选子集都要训练与验证，特征数大时开销随子集组合增长。<\/p>\n<h3>第六步：嵌入式流程<\/h3>\n<p>选择与模型训练在同一优化过程中完成。两类典型：决策树在分裂时递归选出划分属性，属性集合随树生长自然形成；线性模型在损失上加正则项，优化过程中权重被压向零。嵌入式省去单独搜索环节，选择结果与模型参数同时得到。<\/p>\n<h3>第七步：L1 与 L2 的几何对照<\/h3>\n<p>带正则的线性目标<\/p>\n<div class=\"katex-block\">J(\\mathbf w)=\\sum_i(\\mathbf w^\\top\\mathbf x_i-y_i)^2+\\lambda\\lVert\\mathbf w\\rVert_q^q.<\/div>\n<p>二维情形画损失等值线（圆心在无约束最优点的同心曲线）与正则可行域。<\/p>\n<p><strong>L2 区域<\/strong>：<span class=\"katex-inline\">\\omega_1^2+\\omega_2^2\\le r^2<\/span>，边界光滑圆形。等值线与圆周切点一般不在坐标轴上，<span class=\"katex-inline\">\\omega_1,\\omega_2<\/span> 都为非零小量；L2 把权重整体压缩，不产生稀疏。<\/p>\n<p><strong>L1 区域<\/strong>：<span class=\"katex-inline\">|\\omega_1|+|\\omega_2|\\le r<\/span>，菱形边界在坐标轴上有角点。损失等值线碰到角点时，对应一个分量为零、另一个非零；棱上切点也常落在轴上。角点结构使 L1 解更易含零分量，这就是稀疏性的几何来源。<\/p>\n<p><strong>L0 范数<\/strong>：<span class=\"katex-inline\">\\lVert\\mathbf w\\rVert_0<\/span> 统计非零分量个数，最贴近稀疏目标，但函数不连续、组合优化难求解；L1 是其凸松弛，可由凸优化求解。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：正则切点对照<\/h3>\n<p>设无约束最优点 <span class=\"katex-inline\">w^*=(1,1)<\/span>，正则区域半径 <span class=\"katex-inline\">r=0.5<\/span>。L2 圆域切点沿 <span class=\"katex-inline\">(1,1)<\/span> 方向，<span class=\"katex-inline\">w\\approx(0.354,0.354)<\/span>，两分量非零；L1 菱形域，等值线先碰到的角点为 <span class=\"katex-inline\">(0.5,0)<\/span> 或 <span class=\"katex-inline\">(0,0.5)<\/span>，一个分量为零。同一数据、同一正则强度，L1 给出稀疏解，L2 给出压缩解。<\/p>\n<h3>算例 2：包裹式子集搜索轮次<\/h3>\n<p>特征集 <span class=\"katex-inline\">\\{a,b,c,d\\}<\/span>，初始全集交叉验证误差 0.20。随机子集 <span class=\"katex-inline\">\\{a,b,c\\}<\/span> 误差 0.18，更新最优；<span class=\"katex-inline\">\\{a,b,d\\}<\/span> 误差 0.19，不更新；<span class=\"katex-inline\">\\{a,c\\}<\/span> 误差 0.22，不更新；连续 <span class=\"katex-inline\">T=3<\/span> 轮无更优则停止，输出 <span class=\"katex-inline\">\\{a,b,c\\}<\/span>。每轮误差来自交叉验证，不是训练集误差，避免选择过拟合特征。<\/p>\n<h3>算例 3：正则强度扫描<\/h3>\n<p>同一线性模型取 <span class=\"katex-inline\">\\lambda=0.001<\/span>：权重接近无约束解，训练误差 0.06、测试误差 0.18；<span class=\"katex-inline\">\\lambda=1<\/span>：权重多数趋小，训练 0.09、测试 0.13；<span class=\"katex-inline\">\\lambda=100<\/span>：权重近零，训练与测试误差都升到 0.30 上下。中间强度对应偏差-方差折中，<span class=\"katex-inline\">\\lambda<\/span> 在验证集上选定。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong>稀疏解的解释价值<\/strong>：权重为零的特征不进入预测，模型可读成少数相关属性的规则；这在医疗、金融等需要理由的场景比黑箱成分更可接受。\n<\/li><li>\n<strong>正则与假设复杂度<\/strong>：无关特征越多，假设空间含有的一致假设越多，泛化所需样本量越大；L1 选择与特征选择都在收缩有效假设空间，与概念 c12 的样本复杂度分析衔接。\n<\/li><li>\n<strong>嵌入式与树模型<\/strong>：树的特征重要性可由各属性带来的基尼下降或信息增益累加；多次分裂后未被选中的属性等价于被排除出模型。\n<\/li><li>\n<strong>稳定性提醒<\/strong>：小样本下 L1 选出的零分量可能随样本波动；重采样观察权重零分量的稳定性，比单次结果更可靠。\n<\/ul>\n<h3>过滤式代表 Relief 的打分思路<\/h3>\n<p>Relief 对每个样本找同类近邻与异类近邻：特征在同类近邻间差异小、异类近邻间差异大则得分高。打分只看样本对的特征差值，不训练后续模型，属过滤式。扩展到多分类时汇总各类异类近邻。Relief 计算与模型解耦，适合高维数据初筛；缺点是不评估特征组合效应，交互作用强的弱特征可能被低估。<\/p>\n<h3>包裹式的开销来源<\/h3>\n<p>每个候选子集都要走一遍交叉验证：折数 <span class=\"katex-inline\">k<\/span> 次训练加 <span class=\"katex-inline\">k<\/span> 次验证，子集数随 <span class=\"katex-inline\">d<\/span> 指数增长。LVW 用随机子集加停止条件控制探索，但特征数上百时仍难穷尽。包裹式结果对指定学习器更准，换模型后子集需重选；它不产出跨模型通用的特征排序。实践中先过滤式粗筛降维，再在小候选集上包裹式精挑，是常见两段流程。<\/p>\n<h3>嵌入式与模型目标的耦合<\/h3>\n<p>决策树分裂时选信息增益或基尼下降最大的属性，属性集合随树生长自然形成；L1 正则在线性目标优化中把权重压零，零分量对应特征被排除。嵌入式选择与参数估计一次完成，没有独立搜索环节。代价是选择结果依赖模型假设：线性模型选出的子集，换到树模型上未必最优。<\/p>\n<h3>稀疏解的稳定性<\/h3>\n<p>小样本下 L1 选出的零分量可能随采样波动：某次训练某权重恰被压零，换一批样本又恢复非零。观察稳定性的做法是重采样多次统计权重零分量出现频率，稳定为零的特征才视为可剔除。稀疏性改善可解释性，但不自动改善泛化；正则强度过大把有效特征一并压零，偏差上升。<\/p>\n<h3>正则先验视角<\/h3>\n<p>L2 权重分布对应高斯先验，均值为零、对称衰减；L1 对应拉普拉斯先验，密度在零点尖锐，后验估计更易取到零点。先验选择决定权重空间约束形状：圆域压缩幅值，菱形域产生轴上稀疏解。这一联系与概念 c02 的损失估计、概念 c12 的假设复杂度收缩衔接：正则化在损失侧压低有效假设容量。<\/p>\n<h3>三类机制的选择流程<\/h3>\n<p>模型未定、维度极高：先过滤式按边际相关性粗筛；计算预算充足、子集规模可控：包裹式以交叉验证误差精挑；模型本身支持正则或分裂准则：嵌入式随训练一次完成。实际系统常组合：过滤去无关维度，嵌入在模型内再筛，包裹式只在关键子集上复核。选择结果都要在独立验证集上确认泛化收益，不能以训练集误差为准。<\/p>\n<h3>选择与压缩的区别收口<\/h3>\n<p>特征选择输出原属性子集，每个被选特征有业务含义；PCA 输出组合成分，成分是原特征线性加权。需要向业务解释依据时选选择路线，需要去相关降噪时用压缩路线；两者可串联，先选择粗筛再压缩降维。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n前向与后向搜索分别从什么集合出发？各自倾向于偏大还是偏小的子集？\n<\/li><li>\n过滤式与包裹式的评价准则差别在哪？为什么包裹式开销更大？\n<\/li><li>\n用二维正则区域说明 L1 为何比 L2 更易稀疏：圆形与菱形边界的切点位置有何不同？\n<\/li><li>\nL0 最贴近稀疏目标却为什么不直接优化？L1 作为凸松弛解决了什么问题？\n<\/ol><\/div><\/details>", "c12": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.284<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">经验误差、过拟合与模型评估：错误率、P/R/F1、ROC-AUC、交叉验证与偏差-方差<\/a><\/span><\/div><h1>计算学习理论：PAC 可学习性、假设空间复杂度与样本复杂度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：原书第 12 章计算学习理论 12.1 基础知识、12.2 PAC 学习（PDF 第 281–286 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>经验误差低只说明模型记住了训练集，不自动保证新样本上误差小。计算学习理论（computational learning theory）要回答：什么任务在什么条件下可学，算法需要多少样本才能以多大概率达到多小误差，假设空间大小怎样影响泛化保证。它为前面各章的模型选择、正则化与集成策略提供理论语言，而不针对某个具体算法给实现步骤。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>样本设定<\/strong>：样本服从隐含未知分布 <span class=\"katex-inline\">\\mathcal D<\/span>，训练样本独立同分布（independent identically distributed，i.i.d.）采样；<span class=\"katex-inline\">\\mathcal X<\/span> 为样本空间，<span class=\"katex-inline\">\\mathcal Y<\/span> 为标记空间（原书 12.1 节，PDF 第 281 页）。<\/p>\n<p><strong>假设与概念<\/strong>：学习算法输出假设 <span class=\"katex-inline\">h\\in\\mathcal H<\/span>，<span class=\"katex-inline\">\\mathcal H<\/span> 为假设空间；目标概念 <span class=\"katex-inline\">c\\in\\mathcal C<\/span>，<span class=\"katex-inline\">\\mathcal C<\/span> 为概念类。若 <span class=\"katex-inline\">\\mathcal H<\/span> 中存在假设把训练示例全部分对，问题对算法可分（separable），亦称一致（consistent）。<\/p>\n<p><strong>PAC 辨识<\/strong>：对 <span class=\"katex-inline\">0&lt;\\varepsilon,\\delta&lt;1<\/span>、所有 <span class=\"katex-inline\">c\\in\\mathcal C<\/span> 和分布 <span class=\"katex-inline\">\\mathcal D<\/span>，若算法输出 <span class=\"katex-inline\">h<\/span> 满足<\/p>\n<div class=\"katex-block\">P(E(h)\\le\\varepsilon)\\ge1-\\delta,<\/div>\n<p>则称算法能从假设空间 <span class=\"katex-inline\">\\mathcal H<\/span> 中 PAC 辨识概念类 <span class=\"katex-inline\">\\mathcal C<\/span>（原书 12.2 节，PDF 第 283 页）。<\/p>\n<p><strong>PAC 可学习<\/strong>：存在算法与多项式规模 <span class=\"katex-inline\">m<\/span>，使 <span class=\"katex-inline\">m\\ge\\mathrm{poly}(1/\\varepsilon,1/\\delta,\\mathrm{size}(\\mathbf x),\\mathrm{size}(c))<\/span> 时，对任意分布都能 PAC 辨识。<\/p>\n<p><strong>样本复杂度（sample complexity）<\/strong>：满足 PAC 条件所需的最小 <span class=\"katex-inline\">m<\/span>；假定处理单样本时间为常数，时间复杂度等价于样本复杂度。<\/p>\n<p><strong>高效 PAC 可学习<\/strong>：概念类可学习且算法运行时间为上述参数的多项式函数（原书 12.2 节，PDF 第 284 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>PAC 框架把&quot;学得好&quot;拆成三个可量化部件：误差上界 <span class=\"katex-inline\">\\varepsilon<\/span>（学得多准）、置信度 <span class=\"katex-inline\">1-\\delta<\/span>（有多大把握）、样本数 <span class=\"katex-inline\">m<\/span>（需要多少数据）。假设空间复杂度是关键因素：候选假设越多，要排除的坏假设越多，达到同一 <span class=\"katex-inline\">\\varepsilon,\\delta<\/span> 所需样本量越大。有限假设空间下，单个假设以小概率在训练集上一致，多个假设同时一致的概率由并集界限控制；空间越大，坏假设蒙对训练集的机会越多，泛化保证越弱。<\/p>\n<p>奥卡姆剃刀在理论层面对应：拟合能力相当的假设中优先选更简单的，简单假设有效容量更低，过拟合风险更小。偏差-方差分解是误差在模型侧的拆解，PAC 是在概率分布侧对&quot;多少样本能学到多准&quot;的刻画。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：PAC 假设样本 i.i.d.、测试与训练同分布；结论对所有分布成立的分布无关口径要求较强。\n<\/li><li>\n<strong>失败案例一：把 PAC 可学习当成算法可优化<\/strong>。可学习性问的是存在样本与算法保证，不保证某个具体梯度下降能收敛到该假设；可优化性是另一层问题。\n<\/li><li>\n<strong>失败案例二：假设空间无限扩大<\/strong>。候选假设包含任意与训练集一致的复杂模型，理论上无法排除坏假设，泛化保证消失；这对应经验层面的过拟合。\n<\/li><li>\n<strong>失败案例三：跨分布套用保证<\/strong>。训练与测试分布变化时，PAC 的同分布前提不成立，原有误差界不再适用。\n<\/li><li>\n<strong>边界<\/strong>：PAC 给的是最坏分布下的概率保证，常偏保守；理论界指出方向与量级，具体任务仍需概念 c01 的实证评估。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>PAC 框架 vs 实证评估<\/strong>：交叉验证在固定数据集上估经验泛化；PAC 从分布与样本复杂度出发给概率保证，两者互补，理论界不替代测试集指标。\n<\/li><li>\n<strong>假设空间 vs 概念类<\/strong>：概念类是真实规律所在范围，假设空间是算法可能输出的范围；两者重合称恰 PAC 可学习，现实中概念类未知，假设空间常大于概念类。\n<\/li><li>\n<strong>可学习 vs 可分<\/strong>：可分指训练集存在一致假设；可学习指概率意义下的泛化保证。训练可分不推出 PAC 可学习。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的误差与置信口径是 PAC 定义的直觉来源；概念 c11 的特征选择收缩有效假设空间，对应降低假设复杂度。后继：间隔界（概念 c05）把 SVM 泛化误差与间隔宽度挂钩；集成多样性（概念 c08）可在假设复杂度与个体精度间权衡；半监督与概率图模型在 PAC 框架外补充利用未标记数据的学习保证。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（计算学习理论：PAC 可学习性、假设空间复杂度与样本复杂度）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：PAC 辨识要素、样本复杂度与假设空间作用<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把计算学习理论讲透，往回追四层前提：<\/p>\n<ol><li>\n<strong>先立概率样本框架<\/strong>。训练样本从未知分布 <span class=\"katex-inline\">\\mathcal D<\/span> 独立同分布采样，泛化误差按该分布度量；不先定分布口径，&quot;泛化&quot;没有数学对象。\n<\/li><li>\n<strong>区分真实概念与输出假设<\/strong>。<span class=\"katex-inline\">c<\/span> 是待学规律，<span class=\"katex-inline\">h<\/span> 是算法候选；假设空间 <span class=\"katex-inline\">\\mathcal H<\/span> 限定算法能输出的范围。\n<\/li><li>\n<strong>&quot;学得好&quot;拆成误差、置信度、样本量三件事<\/strong>。<span class=\"katex-inline\">\\varepsilon<\/span> 约束误差上界，<span class=\"katex-inline\">\\delta<\/span> 约束失败概率，<span class=\"katex-inline\">m<\/span> 约束数据规模；PAC 定义把三者写进一个不等式。\n<\/li><li>\n<strong>假设复杂度决定样本需求<\/strong>。候选假设越多，坏假设蒙对训练集的概率叠加越高，达到同一保证所需样本越多。\n<\/ol>\n<p>依赖链方向：i.i.d. 分布设定 → 概念/假设记号 → PAC 辨识不等式 → PAC 可学习与多项式规模 → 样本复杂度 → 假设空间复杂度的作用。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：样本与误差设定<\/h3>\n<p>样本空间 <span class=\"katex-inline\">\\mathcal X<\/span>，标记空间 <span class=\"katex-inline\">\\mathcal Y=\\{-1,+1\\}<\/span>（二分类口径）；样本服从隐含未知分布 <span class=\"katex-inline\">\\mathcal D<\/span>，训练集 <span class=\"katex-inline\">D<\/span> 中样本独立同分布采样。假设 <span class=\"katex-inline\">h:\\mathcal X\\to\\mathcal Y<\/span>，泛化误差<\/p>\n<div class=\"katex-block\">E(h)=\\Pr_{\\mathbf x\\sim\\mathcal D}[h(\\mathbf x)\\neq c(\\mathbf x)].<\/div>\n<p>误差按分布 <span class=\"katex-inline\">\\mathcal D<\/span> 计算，不依赖训练集具体取值。<\/p>\n<h3>第二步：概念类与假设空间<\/h3>\n<p>概念类 <span class=\"katex-inline\">\\mathcal C<\/span> 是所有可能目标概念的集合；假设空间 <span class=\"katex-inline\">\\mathcal H<\/span> 是学习算法可能输出的假设集合。若 <span class=\"katex-inline\">c\\in\\mathcal H<\/span>，存在假设与真实标记完全一致，问题对算法可分（一致）；若 <span class=\"katex-inline\">c\\notin\\mathcal H<\/span>，空间内无假设能正确分开。算法只能在 <span class=\"katex-inline\">\\mathcal H<\/span> 内选择，<span class=\"katex-inline\">\\mathcal H<\/span> 过大引入冗余，过小可能不含目标概念。<\/p>\n<h3>第三步：PAC 辨识定义<\/h3>\n<p>对 <span class=\"katex-inline\">0&lt;\\varepsilon,\\delta&lt;1<\/span>，所有 <span class=\"katex-inline\">c\\in\\mathcal C<\/span> 与分布 <span class=\"katex-inline\">\\mathcal D<\/span>，若存在算法 <span class=\"katex-inline\">\\mathfrak L<\/span>，输出 <span class=\"katex-inline\">h\\in\\mathcal H<\/span> 满足<\/p>\n<div class=\"katex-block\">\\Pr\\big[E(h)\\le\\varepsilon\\big]\\ge1-\\delta,<\/div>\n<p>则称 <span class=\"katex-inline\">\\mathfrak L<\/span> 能从 <span class=\"katex-inline\">\\mathcal H<\/span> 中 PAC 辨识 <span class=\"katex-inline\">\\mathcal C<\/span>。读法：以至少 <span class=\"katex-inline\">1-\\delta<\/span> 的概率，学到误差不超过 <span class=\"katex-inline\">\\varepsilon<\/span> 的假设；失败概率上限为 <span class=\"katex-inline\">\\delta<\/span>。PAC 全称 Probably Approximately Correct，概率近似正确。<\/p>\n<h3>第四步：PAC 可学习<\/h3>\n<p>令 <span class=\"katex-inline\">m<\/span> 为 i.i.d. 样例数。若存在算法 <span class=\"katex-inline\">\\mathfrak L<\/span> 与多项式函数 <span class=\"katex-inline\">\\mathrm{poly}(\\cdot)<\/span>，对任意分布，当<\/p>\n<div class=\"katex-block\">m\\ge\\mathrm{poly}(1/\\varepsilon,1/\\delta,\\mathrm{size}(\\mathbf x),\\mathrm{size}(c))<\/div>\n<p>时 <span class=\"katex-inline\">\\mathfrak L<\/span> 能 PAC 辨识 <span class=\"katex-inline\">\\mathcal C<\/span>，则称 <span class=\"katex-inline\">\\mathcal C<\/span> 对 <span class=\"katex-inline\">\\mathcal H<\/span> 而言 PAC 可学习。两个复杂度维度：数据复杂度由样本数 <span class=\"katex-inline\">m<\/span> 度量，时间复杂度在单样本处理时间为常数假设下等价于样本复杂度。<\/p>\n<h3>第五步：高效 PAC 与样本复杂度<\/h3>\n<p>若概念类可学习，且算法运行时间是 <span class=\"katex-inline\">1/\\varepsilon,1/\\delta,\\mathrm{size}(\\mathbf x),\\mathrm{size}(c)<\/span> 的多项式，称高效 PAC 可学习，算法为 PAC 学习算法。样本复杂度是满足 PAC 条件所需的最小 <span class=\"katex-inline\">m<\/span>；它随误差要求收紧（<span class=\"katex-inline\">\\varepsilon<\/span> 减小）、置信度提高（<span class=\"katex-inline\">\\delta<\/span> 减小）、概念规模增大而上升。<\/p>\n<h3>第六步：假设空间复杂度的作用<\/h3>\n<p>有限假设空间含 <span class=\"katex-inline\">M<\/span> 个假设。对一个固定坏假设（真实误差 <span class=\"katex-inline\">&gt;\\varepsilon<\/span>），它在 <span class=\"katex-inline\">m<\/span> 个独立样本上全部判对的概率上界为 <span class=\"katex-inline\">(1-\\varepsilon)^m\\le e^{-\\varepsilon m}<\/span>。由并集界限，<span class=\"katex-inline\">M<\/span> 个坏假设中至少一个蒙对训练集的概率不超过 <span class=\"katex-inline\">M e^{-\\varepsilon m}<\/span>。令该概率 <span class=\"katex-inline\">\\le\\delta<\/span>：<\/p>\n<div class=\"katex-block\">M e^{-\\varepsilon m}\\le\\delta\\ \\Rightarrow\\ m\\ge\\frac1\\varepsilon\\ln\\frac{M}{\\delta}.<\/div>\n<p><span class=\"katex-inline\">M<\/span> 增大（假设空间变复杂），所需样本 <span class=\"katex-inline\">m<\/span> 随 <span class=\"katex-inline\">\\ln M<\/span> 增长；这从理论上解释了无关特征与冗余模型如何抬高数据需求。无限空间改用 VC 维等容量度量替代 <span class=\"katex-inline\">M<\/span>（转述延伸）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：<span class=\"katex-inline\">\\varepsilon,\\delta<\/span> 读数<\/h3>\n<p>设 <span class=\"katex-inline\">\\varepsilon=0.10<\/span>，<span class=\"katex-inline\">\\delta=0.05<\/span>。PAC 保证读作：重复采样训练并建模，至少 95% 的情况下输出假设误差不超过 10%；至多 5% 的实验失败。<span class=\"katex-inline\">\\delta=0.01<\/span> 比 <span class=\"katex-inline\">\\delta=0.05<\/span> 置信度更高，所需样本更多；<span class=\"katex-inline\">\\varepsilon=0.05<\/span> 比 <span class=\"katex-inline\">0.10<\/span> 误差要求更严，样本量同样上升。<\/p>\n<h3>算例 2：有限空间样本量估算<\/h3>\n<p>设 <span class=\"katex-inline\">M=100<\/span> 个候选假设，<span class=\"katex-inline\">\\varepsilon=0.10<\/span>，<span class=\"katex-inline\">\\delta=0.05<\/span>。由 <span class=\"katex-inline\">m\\ge(1/0.10)\\ln(100/0.05)=10\\ln2000\\approx76.0<\/span>，至少约 77 个样本。若空间扩大到 <span class=\"katex-inline\">M=10^4<\/span>，<span class=\"katex-inline\">m\\ge10\\ln(2\\times10^5)\\approx122.0<\/span>，样本需求随对数空间规模上升。<\/p>\n<h3>算例 3：可学习与可分对照<\/h3>\n<p>训练集 6 个样本被某决策树完美分类，只说明该假设在训练集一致（可分）；PAC 可学习要求在未知分布上以 <span class=\"katex-inline\">1-\\delta<\/span> 概率误差 <span class=\"katex-inline\">\\le\\varepsilon<\/span>，训练一致不构成后者保证。跨分布场景中，训练可分的模型在新分布上误差可能很高。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong>PAC 与偏差-方差的对应<\/strong>：PAC 从分布侧给泛化界，偏差-方差从模型侧拆误差；假设空间过小对应高偏差，过大对应高方差，两侧结论一致指向容量折中。\n<\/li><li>\n<strong>奥卡姆剃刀的理论位置<\/strong>：在同等拟合训练集的假设中选简单者，等价于压低有效假设容量；由并集界限，容量越小坏假设蒙对概率越低，泛化界越紧。\n<\/li><li>\n<strong>间隔界与 PAC 的衔接<\/strong>：SVM 的间隔最大化把泛化误差界与间隔宽度、支持向量数挂钩，是 PAC 思想在具体模型上的细化（概念 c05、c06）。\n<\/li><li>\n<strong>理论保证的边界<\/strong>：PAC 给最坏分布下的保守界，不预测单模型实测精度；分布漂移、标签噪声、特征缺失都在保证前提之外，落地仍需交叉验证与独立测试（概念 c01）。\n<\/ul>\n<h3>可分与一致的含义<\/h3>\n<p>若目标概念 <span class=\"katex-inline\">c\\in\\mathcal H<\/span>，假设空间中存在与 <span class=\"katex-inline\">c<\/span> 一致的假设，问题对算法可分（separable），亦称一致（consistent）。若 <span class=\"katex-inline\">c\\notin\\mathcal H<\/span>，空间内任何假设都无法完全正确，训练再久也有不可约误差。可分是样本层面的性质：训练集存在一致假设；可学习是分布层面的保证：以高概率达到误差上界。两者不能互推。<\/p>\n<h3>样本复杂度的参数走向<\/h3>\n<p>样本复杂度 <span class=\"katex-inline\">m<\/span> 随三个方向上升：误差要求收紧（<span class=\"katex-inline\">\\varepsilon<\/span> 减小，<span class=\"katex-inline\">1/\\varepsilon<\/span> 增大）；置信度提高（<span class=\"katex-inline\">\\delta<\/span> 减小，<span class=\"katex-inline\">\\ln(1/\\delta)<\/span> 增大）；概念与样本规模增大（<span class=\"katex-inline\">\\mathrm{size}(c)<\/span>、<span class=\"katex-inline\">\\mathrm{size}(\\mathbf x)<\/span> 增大）。有限空间界 <span class=\"katex-inline\">m\\ge(1/\\varepsilon)\\ln(M/\\delta)<\/span> 中，<span class=\"katex-inline\">M<\/span> 以对数形式进入，误差 <span class=\"katex-inline\">\\varepsilon<\/span> 以倒数形式进入：收紧误差比对扩大空间规模更耗样本。<\/p>\n<h3>无限假设空间与 VC 维<\/h3>\n<p>有限空间用假设数 <span class=\"katex-inline\">M<\/span> 度量容量；无限空间（如线性分类器全体）<span class=\"katex-inline\">M<\/span> 无穷，需用 VC 维（Vapnik-Chervonenkis dimension）替代：能被假设打散的最大样本数。VC 维刻画假设的增长能力，泛化界写成样本数与 VC 维的关系。PAC 框架不限定空间类型，有限 <span class=\"katex-inline\">M<\/span> 只是最易推导的口径；原书 12.3 节前后讨论了假设复杂度与增长函数（转述延伸）。<\/p>\n<h3>PAC 与偏差-方差的对应<\/h3>\n<p>PAC 在分布侧回答&quot;多少样本能学到多准&quot;，偏差-方差在模型侧拆解误差来源。假设空间过小：容量不足，偏差项主导，PAC 意义下可能不含目标概念；空间过大：容量冗余，方差项上升，排除坏假设所需样本增多。两侧结论一致指向容量折中：模型复杂度要与样本规模、任务难度相称。<\/p>\n<h3>理论保证的保守性<\/h3>\n<p>PAC 界对所有分布取最坏情形，通常比实测泛化误差宽松。它指出方向与量级：空间越大样本需求越高，误差要求越严数据需求越大；具体模型在具体数据集上的精度，仍要靠交叉验证与独立测试估计。PAC 不替代实证评估，也不保证某个优化算法收敛到最优假设——可学习性是存在性保证，可优化性是算法层面问题。<\/p>\n<h3>不可学习与分布漂移<\/h3>\n<p>若概念类在给定假设空间下不存在多项式样本复杂度保证，称 PAC 不可学习；常见原因是假设空间与任务严重错位，或概念本身需要不可计算的表示。训练与测试分布不一致时，i.i.d. 同分布前提破坏，原有误差界失效；半监督、迁移学习处理分布部分重叠的场景，属于 PAC 基本框架之外的推广。<\/p>\n<h3>数值算例补充：置信度与样本量<\/h3>\n<p>设 <span class=\"katex-inline\">M=50<\/span>，<span class=\"katex-inline\">\\varepsilon=0.08<\/span>，<span class=\"katex-inline\">\\delta=0.10<\/span>。由 <span class=\"katex-inline\">m\\ge(1/0.08)\\ln(50/0.10)=12.5\\ln500\\approx77.9<\/span>，至少约 79 个样本。若把置信度提到 <span class=\"katex-inline\">\\delta=0.01<\/span>，<span class=\"katex-inline\">m\\ge12.5\\ln5000\\approx101.5<\/span>，约 102 个样本；误差收紧到 <span class=\"katex-inline\">\\varepsilon=0.04<\/span>，<span class=\"katex-inline\">m\\ge25\\ln500\\approx155.8<\/span>，约 156 个样本。误差减半带来的样本增长，幅度大于置信度一个数量级的调整。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出 PAC 辨识不等式，说明 <span class=\"katex-inline\">\\varepsilon<\/span>、<span class=\"katex-inline\">\\delta<\/span> 分别约束什么，失败概率是多少。\n<\/li><li>\nPAC 可学习定义中样本量 <span class=\"katex-inline\">m<\/span> 与哪些参数成多项式关系？时间复杂度为何在一定假设下等价于样本复杂度？\n<\/li><li>\n有限假设空间下由并集界限推出 <span class=\"katex-inline\">m\\ge(1/\\varepsilon)\\ln(M/\\delta)<\/span>，说明 <span class=\"katex-inline\">M<\/span> 增大时样本需求怎样变化。\n<\/li><li>\n训练集可分为什么不等于 PAC 可学习？举例说明分布变化后训练一致的模型可能出现什么情况。\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：模型评估、线性模型与决策树：误差与性能度量、最小二乘与对数几率回归、划分准则与剪枝<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 2–4 章：模型评估与选择、线性模型、决策树<\/a><br>检查点：能手算混淆矩阵上的 P/R/F1 与 AUC 梯形面积，写出正规方程解并解释列空间几何，按信息增益与基尼指数比较两个候选划分属性，说清预剪枝与后剪枝各自牺牲什么。<\/li><li class='path-step' id='path-02'><strong>步骤 02：神经网络与支持向量机：多层前馈网络、误差逆传播、间隔最大化、对偶问题与核方法<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 5–6 章：神经网络与支持向量机<\/a><br>检查点：能沿 BP 链条写出连接权的梯度更新，把 SVM 基本型推到对偶形式，按 KKT 条件判断哪些样本是支持向量，说明线性可分与非线性可分场景下核函数替换了哪一步。<\/li><li class='path-step' id='path-03'><strong>步骤 03：贝叶斯分类器、集成学习与聚类：后验判定、条件独立、Bagging 与 Boosting、AdaBoost 更新、k-means<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 7–9 章：贝叶斯分类器、集成学习与聚类<\/a><br>检查点：能写出朴素贝叶斯判定式并解释条件独立假设去掉后会发生什么，对比 Bagging 并行采样与 Boosting 串行加权的生成机制，推得 AdaBoost 基学习器权重与样本权重更新公式，说明 k-means 目标函数为何单调下降以及对初值的敏感点。<\/li><li class='path-step' id='path-04'><strong>步骤 04：降维、特征选择与计算学习理论：PCA 等价性、稀疏正则、选择机制与 PAC 可学习性<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 10–12 章：降维与度量学习、特征选择与稀疏学习、计算学习理论<\/a><br>检查点：能从最近重构性与最大可分性两条路径推出同一个 PCA 优化目标，用几何方式解释 L1 为何更易稀疏，区分三类特征选择机制的评估对象，按 PAC 定义说清 ε、δ、样本复杂度与假设空间复杂度各自约束什么。<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='泛化误差（generalization error）'>泛化误差（Generalization Error） — 学习器在新样本上的误差；训练误差（经验误差）是学习器在训练集上的误差。训练误差很小而泛化误差大，对应过拟合（原书 2.1 节，PDF 第 37 页）。 <span class=glossary-ref>（第 2–4 章：模型评估与选择、线性模型、决策树）<\/span><\/li><li data-term='查准率 p 与查全率 r（precision / recall）'>查准率 P 与查全率 R（Precision / Recall） — 混淆矩阵下 $P=TP/(TP+FP)$，$R=TP/(TP+FN)$；两者通常此消彼长，F1 取调和平均 $F_1=2PR/(P+R)$（原书 2.3.2 节，PDF 第 44–46 页）。 <span class=glossary-ref>（第 2–4 章：模型评估与选择、线性模型、决策树）<\/span><\/li><li data-term='roc 与 auc'>ROC 与 AUC — ROC 纵轴为真正例率 $TPR=TP/(TP+FN)$，横轴为假正例率 $FPR=FP/(FP+TN)$；AUC 为 ROC 曲线下面积，衡量排序质量，不是分类准确率（原书 2.3.3 节，PDF 第 47–48 页）。 <span class=glossary-ref>（第 2–4 章：模型评估与选择、线性模型、决策树）<\/span><\/li><li data-term='偏差-方差分解（bias-variance decomposition）'>偏差-方差分解（Bias-Variance Decomposition） — 泛化误差可拆为偏差（模型假设与真实规律的差距）、方差（训练集扰动带来的预测波动）与噪声；欠拟合对应高偏差，过拟合对应高方差（原书 2.6 节，PDF 第 40 页前后）。 <span class=glossary-ref>（第 2–4 章：模型评估与选择、线性模型、决策树）<\/span><\/li><li data-term='正规方程（normal equation）'>正规方程（Normal Equation） — 平方损失对权重求梯度为零得到 $X^\top X\\mathbf w=X^\top\\mathbf y$；$X^\top X$ 满秩时闭式解 $\\mathbf w^*=(X^\top X)^{-1}X^\top\\mathbf y$（原书 3.2 节，PDF 第 69 页）。 <span class=glossary-ref>（第 2–4 章：模型评估与选择、线性模型、决策树）<\/span><\/li><li data-term='对数几率回归（logistic regression）'>对数几率回归（Logistic Regression） — 用 Sigmoid 函数把线性输出压到 $(0,1)$ 作为类后验概率估计，以对数似然为优化目标，经梯度下降或牛顿法求解；输出是概率而非类别标记（原书 3.3 节，PDF 第 72–73 页）。 <span class=glossary-ref>（第 2–4 章：模型评估与选择、线性模型、决策树）<\/span><\/li><li data-term='信息增益（information gain）'>信息增益（Information Gain） — $\\mathrm{Gain}(D,a)=\\mathrm{Ent}(D)-\\sum_v |D^v|/|D|\\,\\mathrm{Ent}(D^v)$，其中信息熵 $\\mathrm{Ent}(D)=-\\sum_k p_k\\log_2 p_k$；ID3 按信息增益选划分属性（原书 4.2.1 节，PDF 第 89 页）。 <span class=glossary-ref>（第 2–4 章：模型评估与选择、线性模型、决策树）<\/span><\/li><li data-term='基尼指数（gini index）'>基尼指数（Gini Index） — 基尼值 $\\mathrm{Gini}(D)=1-\\sum_k p_k^2$，反映随机抽两个样本类别不一致的概率；CART 按划分后基尼指数最小选属性（原书 4.2.3 节，PDF 第 93 页）。 <span class=glossary-ref>（第 2–4 章：模型评估与选择、线性模型、决策树）<\/span><\/li><li data-term='误差逆传播算法（error backpropagation, bp）'>误差逆传播算法（Error BackPropagation, BP） — 基于梯度下降，按链式法则把输出层误差逐层反向传回隐层，更新连接权与阈值；BP 是训练多层前馈网络最常用的算法（原书 5.3 节，PDF 第 115–116 页）。 <span class=glossary-ref>（第 5–6 章：神经网络与支持向量机）<\/span><\/li><li data-term='间隔（margin）与支持向量（support vector）'>间隔（Margin）与支持向量（Support Vector） — 异类支持向量到划分超平面的距离之和为间隔；约束取等号的样本即支持向量，拉格朗日乘子 $\\alpha_i&gt;0$ 的样本只在求和中出现（原书 6.1–6.2 节，PDF 第 136–138 页）。 <span class=glossary-ref>（第 5–6 章：神经网络与支持向量机）<\/span><\/li><li data-term='核函数（kernel function）'>核函数（Kernel Function） — $\\kappa(\\mathbf x_i,\\mathbf x_j)=\\phi(\\mathbf x_i)^\top\\phi(\\mathbf x_j)$，在不显式写出高维映射 $\\phi$ 的情况下计算特征空间内积；对偶问题中的内积可整体替换为核函数（原书 6.3 节，PDF 第 140–141 页）。 <span class=glossary-ref>（第 5–6 章：神经网络与支持向量机）<\/span><\/li><li data-term='朴素贝叶斯分类器（naive bayes classifier）'>朴素贝叶斯分类器（Naive Bayes Classifier） — 在属性条件独立假设下，后验 $P(c|\\mathbf x)\\propto P(c)\\prod_j P(x_j|c)$；判定取后验最大的类别，$P(\\mathbf x)$ 对所有类别相同可略去（原书 7.3 节，PDF 第 165 页）。 <span class=glossary-ref>（第 7–9 章：贝叶斯分类器、集成学习与聚类）<\/span><\/li><li data-term='集成学习（ensemble learning）'>集成学习（Ensemble Learning） — 构建并结合多个个体学习器完成任务；个体间强依赖、串行生成的代表是 Boosting，无强依赖、可并行的代表是 Bagging 与随机森林（原书 8.1–8.3 节，PDF 第 185、187、192 页）。 <span class=glossary-ref>（第 7–9 章：贝叶斯分类器、集成学习与聚类）<\/span><\/li><li data-term='自助采样（bootstrap sampling）'>自助采样（Bootstrap Sampling） — 有放回地抽 $m$ 次得到 $m$ 个样本的采样集；初始集约 63.2% 的样本出现在采样集中，Bagging 以此产生不同子集训练基学习器（原书 2.2.3、8.3.1 节，PDF 第 192 页）。 <span class=glossary-ref>（第 7–9 章：贝叶斯分类器、集成学习与聚类）<\/span><\/li><li data-term='k-means 平方误差'>k-means 平方误差 — $E=\\sum_{i=1}^{k}\\sum_{\\mathbf x\\in C_i}\\lVert\\mathbf x-\\boldsymbol\\mu_i\\rVert_2^2$，刻画簇内样本围绕均值向量的紧密程度；找到最优簇划分是 NP 难问题，算法以迭代方式近似求解（原书 9.4.1 节，PDF 第 216–217 页）。 <span class=glossary-ref>（第 7–9 章：贝叶斯分类器、集成学习与聚类）<\/span><\/li><li data-term='pac 可学习（pac learnable）'>PAC 可学习（PAC Learnable） — 对 $0&lt;\\varepsilon,\\delta&lt;1$，存在算法与多项式规模 $m$，使以至少 $1-\\delta$ 的概率输出假设误差不超过 $\\varepsilon$；样本复杂度是满足该条件所需的最小 $m$（原书 12.2 节，PDF 第 283–284 页）。 <span class=glossary-ref>（第 10–12 章：降维与度量学习、特征选择与稀疏学习、计算学习理论）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：先分损失来源，再推梯度更新<\/h2>\n<p>每个模型先确认输出类型与噪声假设：连续值回归对应平方损失，伯努利分类对应对数似然，指数损失对应 Boosting 加性模型。损失定下来再写矩阵形式、求梯度、得更新式；跳过损失来源直接背更新规则，换任务时无法判断该用哪种损失。线性回归、对数几率回归、BP 网络共享&quot;输出—损失—梯度—更新&quot;循环，差别只在预测函数与损失项。<\/p>\n<h2>模式 2：评估口径先于模型调参<\/h2>\n<p>选模型、定正则强度、挑剪枝方案，都要在独立验证集或交叉验证折上做，测试集只留作最终验收。指标按任务选：重视挑准看 P，重视不漏看 R，整体排序看 AUC，类别不平衡不能只看准确率。训练低测试高指向方差过大，训练测试双高指向偏差不足；评估口径不先立住，后续优化方向失去依据。<\/p>\n<h2>模式 3：判别式与生成式对照选型<\/h2>\n<p>直接学决策边界的是判别式（SVM、对数几率回归、决策树），先建模类条件概率再推后验的是生成式（朴素贝叶斯）。样本少、属性独立近似成立时生成式可估；要求边界精度、样本充足时判别式常更稳。缺失值处理上生成式可跳过缺项，判别式通常要先插补。两条路线在贝叶斯风险与经验误差两个框架下分别成立。<\/p>\n<h2>模式 4：单模型短板决定集成路线<\/h2>\n<p>高方差低偏差的模型（如深决策树）用 Bagging：自助采样加并行投票压方差；高偏差弱学习器用 Boosting：串行聚焦难样本、加权叠加压偏差。集成收益来自&quot;好而不同&quot;，个体雷同则重复同一模型，个体太差则组合无效。Boosting 对噪声标签敏感，Bagging 对异常样本相对稳健；基学习器选择先看单模型偏差方差归属。<\/p>\n<h2>模式 5：无监督目标写成原型或距离函数<\/h2>\n<p>聚类先定相似度口径：k-means 用欧氏距离平方与质心原型，密度聚类按连通扩簇，层次聚类生成嵌套树。目标函数拆成分配与更新两步交替，每步证明不增目标、目标有下界，再谈收敛。k-means 收敛到局部极小，初值敏感，多跑几组初值取目标最小者；簇形不规则时换密度方法，不硬套球形原型。<\/p>\n<h2>模式 6：降维先分清保信息还是保判别<\/h2>\n<p>无标签压缩用 PCA：协方差最大方差方向等价于最小重构误差；有监督判别用 LDA：类间散度比类内散度。方差大不等于可分，分类前确认主成分没丢掉弱判别方向。特征选择保留原属性可读回业务，PCA 生成稠密成分不可直接解释；需要去相关降噪走压缩，需要规则依据走选择。<\/p>\n<h2>模式 7：正则从几何与先验两侧理解<\/h2>\n<p>L2 圆域压缩权重幅值，对应高斯先验；L1 菱形域角点产生稀疏解，对应拉普拉斯先验。稀疏不是自动更好：正则过强把有效特征压零，偏差上升。特征选择三机制分工：过滤式与模型解耦粗筛，包裹式以交叉验证误差精挑，嵌入式随模型训练一次完成。正则强度与子集选择都在验证集上定值。<\/p>\n<h2>模式 8：理论保证落到样本与复杂度<\/h2>\n<p>PAC 框架把&quot;学得好&quot;拆成误差上界 ε、失败概率 δ、样本数 m 三件事；假设空间越大，排除坏假设所需样本越多。理论界给最坏分布下的保守方向，不替代实测指标。可学习性是存在保证，可优化性是算法收敛问题；训练可分不推出泛化可学。理解模型泛化时，把假设复杂度、样本规模、偏差方差放在同一张权衡图上看。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>四单元路线对照<\/h2>\n<ul><li>\n<strong>第 1 单元（原书第 2–4 章）<\/strong>：模型评估与选择、线性模型、决策树（PDF 第 37–110 页；印刷页码 = PDF 页码 − 14）。\n<\/li><li>\n<strong>第 2 单元（原书第 5–6 章）<\/strong>：神经网络、支持向量机（PDF 第 111–160 页）。\n<\/li><li>\n<strong>第 3 单元（原书第 7–9 章）<\/strong>：贝叶斯分类器、集成学习、聚类（PDF 第 161–238 页）。\n<\/li><li>\n<strong>第 4 单元（原书第 10–12 章）<\/strong>：降维与度量学习、特征选择与稀疏学习、计算学习理论（PDF 第 240–306 页）；第 16 章强化学习为选读（PDF 第 385 页起）。\n<\/ul>\n<h2>评估指标速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>指标<\/th><th>公式<\/th><th>口径<\/th><\/tr><\/thead><tbody><tr><td>查准率 P<\/td><td><span class=\"katex-inline\">TP/(TP+FP)<\/span><\/td><td>预测为正中真正例比例<\/td><\/tr><tr><td>查全率 R<\/td><td><span class=\"katex-inline\">TP/(TP+FN)<\/span><\/td><td>真实正例被找出比例<\/td><\/tr><tr><td>F1<\/td><td><span class=\"katex-inline\">2PR/(P+R)<\/span><\/td><td>P、R 调和平均<\/td><\/tr><tr><td>TPR<\/td><td><span class=\"katex-inline\">TP/(TP+FN)<\/span><\/td><td>ROC 纵轴<\/td><\/tr><tr><td>FPR<\/td><td><span class=\"katex-inline\">FP/(FP+TN)<\/span><\/td><td>ROC 横轴<\/td><\/tr><tr><td>AUC<\/td><td>ROC 曲线下梯形面积和<\/td><td>正负样本对排序胜率<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>模型目标与求解速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>目标函数<\/th><th>求解/更新<\/th><\/tr><\/thead><tbody><tr><td>线性回归<\/td><td><span class=\"katex-inline\">\\lVert X\\hat{\\mathbf w}-\\mathbf y\\rVert_2^2<\/span><\/td><td>正规方程 <span class=\"katex-inline\">\\hat{\\mathbf w}^*=(X^\\top X)^{-1}X^\\top\\mathbf y<\/span><\/td><\/tr><tr><td>对数几率回归<\/td><td><span class=\"katex-inline\">\\sum_i[-y_i\\beta^\\top\\hat{\\mathbf x}_i+\\ln(1+e^{\\beta^\\top\\hat{\\mathbf x}_i})]<\/span><\/td><td>梯度 <span class=\"katex-inline\">\\nabla_\\beta E=\\sum_i\\hat{\\mathbf x}_i(\\hat y_i-y_i)<\/span><\/td><\/tr><tr><td>决策树<\/td><td><span class=\"katex-inline\">\\mathrm{Ent}(D)-\\sum_v|D^v|/|D|\\,\\mathrm{Ent}(D^v)<\/span><\/td><td>选增益/增益率/基尼指数最大属性<\/td><\/tr><tr><td>SVM<\/td><td><span class=\"katex-inline\">\\frac12\\lVert\\mathbf w\\rVert^2<\/span>，<span class=\"katex-inline\">y_i(\\mathbf w^\\top\\mathbf x_i+b)\\ge1<\/span><\/td><td>对偶 <span class=\"katex-inline\">\\max\\sum\\alpha_i-\\frac12\\sum\\alpha_i\\alpha_j y_i y_j\\mathbf x_i^\\top\\mathbf x_j<\/span><\/td><\/tr><tr><td>AdaBoost<\/td><td>指数损失 <span class=\"katex-inline\">E[e^{-fH}]<\/span><\/td><td><span class=\"katex-inline\">\\alpha_t=\\frac12\\ln\\frac{1-\\varepsilon_t}{\\varepsilon_t}<\/span><\/td><\/tr><tr><td>k-means<\/td><td><span class=\"katex-inline\">\\sum_i\\sum_{\\mathbf x\\in C_i}\\lVert\\mathbf x-\\boldsymbol\\mu_i\\rVert^2<\/span><\/td><td>分配最近质心 → 更新簇均值<\/td><\/tr><tr><td>PCA<\/td><td><span class=\"katex-inline\">\\max\\mathrm{tr}(W^\\top XX^\\top W)<\/span>，<span class=\"katex-inline\">W^\\top W=I<\/span><\/td><td>协方差特征值分解取前 <span class=\"katex-inline\">d&#x27;<\/span> 特征向量<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>准则与正则对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>概念<\/th><th>形式<\/th><th>特点<\/th><\/tr><\/thead><tbody><tr><td>信息熵<\/td><td><span class=\"katex-inline\">-\\sum_k p_k\\log_2p_k<\/span><\/td><td>越小纯度越高<\/td><\/tr><tr><td>基尼值<\/td><td><span class=\"katex-inline\">1-\\sum_k p_k^2<\/span><\/td><td>抽样两类不一致概率<\/td><\/tr><tr><td>L2 正则<\/td><td><span class=\"katex-inline\">\\lambda\\lVert\\mathbf w\\rVert_2^2<\/span><\/td><td>圆域，压缩幅值，分量一般非零<\/td><\/tr><tr><td>L1 正则<\/td><td><span class=\"katex-inline\">\\lambda\\lVert\\mathbf w\\rVert_1<\/span><\/td><td>菱形域，角点产生稀疏解<\/td><\/tr><tr><td>拉普拉斯修正<\/td><td><span class=\"katex-inline\">(|D_c|+1)/(|D|+N)<\/span><\/td><td>避免零概率抹去证据<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>易混点提醒<\/h2>\n<ul><li>\nAUC 不是准确率：AUC 看排序，准确率看固定阈值判对比例。\n<\/li><li>\n支持向量只是 <span class=\"katex-inline\">\\alpha_i&gt;0<\/span> 的样本，不是全部训练样本。\n<\/li><li>\nAdaBoost 判错样本权重上升、判对下降，方向不能写反。\n<\/li><li>\n信息增益偏向取值多的属性；增益率用 IV 分母修正。\n<\/li><li>\nPCA 保方差不保判别；两类可分方向可能在小方差分量上。\n<\/li><li>\n训练可分不等于 PAC 可学习；前者是样本层面，后者是分布层面概率保证。\n<\/ul>"}};

function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);

  }

  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';

  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}
