inline\">\\boldsymbol\\mu_2=\\mathbf x_4=(3,4)<\/span>。首轮分配仍把 <span class=\"katex-inline\">(0,0),(0,1)<\/span> 归一簇、<span class=\"katex-inline\">(3,3),(3,4)<\/span> 归一簇，收敛划分相同。若初值 <span class=\"katex-inline\">\\boldsymbol\\mu_1=\\mathbf x_1<\/span>、<span class=\"katex-inline\">\\boldsymbol\\mu_2=\\mathbf x_2<\/span>（同处左侧），首轮 <span class=\"katex-inline\">\\mathbf x_3,\\mathbf x_4<\/span> 都并入距离较近的 <span class=\"katex-inline\">\\mu_2<\/span>，后续迭代可能把右侧样本拆散；多跑几组初值取 <span class=\"katex-inline\">E<\/span> 最小者，是工程上缓解局部极小的做法。<\/p>\n<h3>算例 3：尺度未归一的距离主导<\/h3>\n<p>特征 <span class=\"katex-inline\">x_1<\/span> 取值 <span class=\"katex-inline\">0\\sim1<\/span>，<span class=\"katex-inline\">x_2<\/span> 取值 <span class=\"katex-inline\">0\\sim1000<\/span>。距离平方中 <span class=\"katex-inline\">x_2<\/span> 差分量纲占绝对主导，聚类边界几乎只由 <span class=\"katex-inline\">x_2<\/span> 决定。先按各特征减均值除标准差归一化，使距离口径对各特征均衡，再跑 k-means。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong><span class=\"katex-inline\">k<\/span> 的选择<\/strong>：肘部法观察 <span class=\"katex-inline\">E<\/span> 随 <span class=\"katex-inline\">k<\/span> 增大的下降斜率，下降由陡转缓的拐点对应合适簇数；外部指标如轮廓系数衡量簇内紧密度与簇间分离度。<span class=\"katex-inline\">k<\/span> 是超参数，需结合业务可解释性选择（转述原书 9.4 节前后）。\n<\/li><li>\n<strong>离群点影响<\/strong>：均值受极端值拉扯，单个离群点可使整簇原型偏移；鲁棒版本可用中位数原型或先剔除异常点再聚类。\n<\/li><li>\n<strong>与密度、层次方法的分工<\/strong>：球形紧凑簇用 k-means 高效；任意形状连通结构用 DBSCAN；需要簇间层次关系用凝聚或分裂层次聚类。方法选择取决于簇的形状假设，而非单纯精度比较。\n<\/ul>\n<h3>簇数选择与轮廓系数<\/h3>\n<p>肘部法观察 <span class=\"katex-inline\">E<\/span> 随 <span class=\"katex-inline\">k<\/span> 增大的下降曲线：<span class=\"katex-inline\">k<\/span> 偏小时 <span class=\"katex-inline\">E<\/span> 随加簇陡降，超过合理簇数后下降转缓，拐点对应候选簇数。轮廓系数对每个样本算 <span class=\"katex-inline\">(b-a)/\\max(a,b)<\/span>，<span class=\"katex-inline\">a<\/span> 为簇内平均距离、<span class=\"katex-inline\">b<\/span> 到最近外簇平均距离；系数接近 1 簇内紧、簇间分，接近 -1 归属可疑。<span class=\"katex-inline\">k<\/span> 最终还要结合业务可解释性，指标最优不等于业务可用。<\/p>\n<h3>离群点与尺度问题<\/h3>\n<p>均值是平方误差最优原型，但受极端值拉扯：单个远离样本可使整簇质心偏移，边界随之倾斜。鲁棒做法先用距离剔除异常点，或改用中位数原型。特征尺度未归一时代量大的特征主导距离，聚类边界被该特征绑架；先减均值除标准差再算欧氏距离，使各特征在距离中权重均衡。<\/p>\n<h3>与高斯混合的软归属对照<\/h3>\n<p>k-means 给硬归属：样本明确划入一簇。高斯混合模型给软归属：样本以概率 <span class=\"katex-inline\">p(i|\\mathbf x)<\/span> 属于各簇，M 步按后验加权更新均值、协方差与混合系数。k-means 可看作混合模型在等方差、后验硬判决下的近似；软归属保留样本跨簇的不确定度，边界样本不必强行站队。EM 迭代骨架一致：E 步算归属，M 步更新参数。<\/p>\n<h3>计算成本与初始化实践<\/h3>\n<p>每轮距离计算 <span class=\"katex-inline\">m\\times k<\/span> 次，迭代轮数取决于收敛速度；大规模数据上用小批量 k-means 分批更新质心。初始化随机选 <span class=\"katex-inline\">k<\/span> 个样本，不同初值落到不同局部极小；工程上多次运行取 <span class=\"katex-inline\">E<\/span> 最小划分，或用 k-means++ 按距离概率选初始点，使初始质心尽量分散。算法不保证全局最优，这是 NP 难背景下迭代近似的固有代价。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出固定均值时样本归属的最优准则，说明为什么分配可以逐项独立做决定。\n<\/li><li>\n对簇内平方和求导，证明簇原型取簇内均值是最小值点；二阶导数正定起什么作用？\n<\/li><li>\n收敛性证明依赖哪两条性质？为什么说 k-means 收敛到局部极小而不是全局最优？\n<\/li><li>\nk-means 与高斯混合 EM 在 E 步、M 步分别怎么对应？硬归属相比软归属丢掉了什么信息？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "k-means 原型聚类：平方误差目标函数、簇分配与均值更新、EM 视角与初值敏感"}, "c10": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.244<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">k-means 原型聚类：平方误差目标函数、簇分配与均值更新、EM 视角与初值敏感<\/a><\/span><\/div><h1>主成分分析 PCA：方差最大化与最小重构误差的等价性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：原书第 10 章降维与度量学习 10.3 主成分分析（PDF 第 243–246 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>高维数据中大量特征彼此相关，直接计算距离会被噪声维度稀释，维度灾难使近邻估计不可靠。降维要把数据压到低维空间，同时尽量保留原有信息。主成分分析（Principal Components Analysis，PCA）找一组标准正交投影基，使样本在低维坐标上的投影尽量分散，或等价地使重构回原空间的误差尽量小；两条路径推出同一个优化目标。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>中心化<\/strong>：样本已平移到原点，<span class=\"katex-inline\">\\sum_i\\mathbf x_i=0<\/span>。<\/p>\n<p><strong>投影基<\/strong>：<span class=\"katex-inline\">\\{\\mathbf w_1,\\dots,\\mathbf w_d\\}<\/span> 为标准正交基，<span class=\"katex-inline\">\\mathbf w_j^\\top\\mathbf w_k=0<\/span>（<span class=\"katex-inline\">j\\neq k<\/span>），<span class=\"katex-inline\">\\lVert\\mathbf w_j\\rVert=1<\/span>。降到 <span class=\"katex-inline\">d&#x27;&lt;d<\/span> 维时，样本 <span class=\"katex-inline\">\\mathbf x_i<\/span> 的低维坐标 <span class=\"katex-inline\">z_{ij}=\\mathbf w_j^\\top\\mathbf x_i<\/span>，重构 <span class=\"katex-inline\">\\hat{\\mathbf x}_i=\\sum_{j=1}^{d&#x27;}z_{ij}\\mathbf w_j<\/span>。<\/p>\n<p><strong>最近重构性<\/strong>：原样本点到投影超平面的距离尽量近，即最小化重构距离平方和。<\/p>\n<p><strong>最大可分性<\/strong>：样本在超平面上的投影尽量分开，即最大化投影方差（原书 10.3 节，PDF 第 244 页）。<\/p>\n<p><strong>协方差矩阵<\/strong>：<span class=\"katex-inline\">XX^\\top=\\sum_i\\mathbf x_i\\mathbf x_i^\\top<\/span>，主成分方向由其特征值分解给出；实践中常用奇异值分解（SVD）代替协方差特征值分解（PDF 第 245 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>重构距离平方和展开：<\/p>\n<div class=\"katex-block\">\\sum_i\\lVert\\mathbf x_i-\\hat{\\mathbf x}_i\\rVert^2=\\sum_i\\lVert\\mathbf x_i\\rVert^2-2\\sum_i\\sum_{j=1}^{d'}z_{ij}\\mathbf w_j^\\top\\mathbf x_i+\\mathrm{const},<\/div>\n<p>利用基正交性整理，与基有关的项为 <span class=\"katex-inline\">-\\mathrm{tr}(W^\\top XX^\\top W)<\/span>。最近重构性要求最小化重构距离，即在 <span class=\"katex-inline\">W^\\top W=I<\/span> 约束下最大化 <span class=\"katex-inline\">\\mathrm{tr}(W^\\top XX^\\top W)<\/span>。<\/p>\n<p>从最大可分性出发，投影方差 <span class=\"katex-inline\">\\sum_i\\lVert W^\\top\\mathbf x_i\\rVert^2=\\mathrm{tr}(W^\\top XX^\\top W)<\/span>，最大化投影方差得到同一目标。对协方差矩阵特征值分解，最大 <span class=\"katex-inline\">d&#x27;<\/span> 个特征值对应的特征向量即主成分方向。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：特征尺度可比，必要时先标准化；线性结构为主的数据上 PCA 保留线性相关方向；无监督降维，不利用类别标记。\n<\/li><li>\n<strong>失败案例一：把大方差方向当判别方向<\/strong>。方差大不代表类别区分强；两类样本可能沿方差小的方向分开，保留主成分后判别方向被丢掉。有监督判别应看 LDA 类方法。\n<\/li><li>\n<strong>失败案例二：未中心化直接分解<\/strong>。均值偏移会被协方差第一项吸收，主方向混入整体平移；中心化是推导前提。\n<\/li><li>\n<strong>失败案例三：非线性结构硬套线性 PCA<\/strong>。螺旋、流形结构上线性投影破坏邻域关系，需核 PCA 或流形方法。\n<\/li><li>\n<strong>边界<\/strong>：PCA 输出分量互不相关，但不保证稀疏；主成分数 <span class=\"katex-inline\">d&#x27;<\/span> 按累计方差解释比选择，是超参数。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>PCA vs LDA<\/strong>：PCA 无监督，找方差最大方向；LDA 有监督，找类间散度与类内散度比值最大方向。前者保重构信息，后者保判别信息。\n<\/li><li>\n<strong>方差最大化 vs 最小重构误差<\/strong>：两条推导路径表面目标不同，展开后落到同一个 <span class=\"katex-inline\">\\mathrm{tr}(W^\\top XX^\\top W)<\/span>，优化目标等价；这是 PCA 最核心的结论。\n<\/li><li>\n<strong>PCA vs 特征选择<\/strong>：PCA 对原特征做线性组合生成新成分；特征选择直接保留原特征子集。前者压缩重叠信息，后者保留可解释原属性。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c09 聚类在 PCA 压缩后的低维空间算距离更稳；概念 c06 的核函数可把 PCA 推广到高维特征空间（核 PCA）。后继：概念 c11 的嵌入式选择与 PCA 同属降维/压缩谱系；概念 c12 的假设复杂度分析可解释高维降维对泛化误差的影响。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（主成分分析 PCA：方差最大化与最小重构误差的等价性）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：重构误差展开、方差最大化等价性与特征方程<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把 PCA 讲透，往回追四层前提：<\/p>\n<ol><li>\n<strong>先固定投影表达方式<\/strong>。低维坐标由原样本在一组基上的内积给出，重构是坐标乘基向量的叠加；不定投影形式，两条推导都无法落地。\n<\/li><li>\n<strong>重构路径从距离出发<\/strong>。最近重构性要求原样本与重构样本距离近，把距离平方和展开后分离出与基有关的迹项。\n<\/li><li>\n<strong>方差路径从分离度出发<\/strong>。最大可分性要求投影点分散，投影方差同样写成协方差矩阵的二次型。\n<\/li><li>\n<strong>两路径等价后才求解<\/strong>。确认目标一致，再用拉格朗日乘子法得到协方差特征方程；SVD 是数值实现替代路径。\n<\/ol>\n<p>依赖链方向：中心化数据 → 投影与重构式 → 重构距离展开 → 投影方差式 → 同一迹目标 → 特征值分解取主成分。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：中心化与记号<\/h3>\n<p>样本 <span class=\"katex-inline\">\\mathbf x_i\\in\\mathbb R^d<\/span>，<span class=\"katex-inline\">i=1,\\dots,m<\/span>，已中心化 <span class=\"katex-inline\">\\sum_i\\mathbf x_i=0<\/span>。投影基 <span class=\"katex-inline\">W=(\\mathbf w_1,\\dots,\\mathbf w_{d&#x27;})<\/span>，标准正交约束 <span class=\"katex-inline\">W^\\top W=I_{d&#x27;}<\/span>。低维坐标 <span class=\"katex-inline\">z_{ij}=\\mathbf w_j^\\top\\mathbf x_i<\/span>，重构<\/p>\n<div class=\"katex-block\">\\hat{\\mathbf x}_i=\\sum_{j=1}^{d'}z_{ij}\\mathbf w_j=W\\mathbf z_i.<\/div>\n<h3>第二步：重构距离展开<\/h3>\n<p>原样本与重构样本距离平方和<\/p>\n<div class=\"katex-block\">J_{\\mathrm{recon}}=\\sum_{i=1}^m\\lVert\\mathbf x_i-\\hat{\\mathbf x}_i\\rVert^2.<\/div>\n<p>展开被减项：<\/p>\n<div class=\"katex-block\">\\lVert\\mathbf x_i-\\hat{\\mathbf x}_i\\rVert^2=\\lVert\\mathbf x_i\\rVert^2-2\\mathbf x_i^\\top\\hat{\\mathbf x}_i+\\lVert\\hat{\\mathbf x}_i\\rVert^2.<\/div>\n<p>由基正交性，<span class=\"katex-inline\">\\lVert\\hat{\\mathbf x}_i\\rVert^2=\\sum_j z_{ij}^2=\\sum_j(\\mathbf w_j^\\top\\mathbf x_i)^2<\/span>，<span class=\"katex-inline\">\\mathbf x_i^\\top\\hat{\\mathbf x}_i=\\sum_j z_{ij}\\mathbf w_j^\\top\\mathbf x_i=\\sum_j(\\mathbf w_j^\\top\\mathbf x_i)^2<\/span>，后两项抵消后剩下 <span class=\"katex-inline\">-\\sum_j(\\mathbf w_j^\\top\\mathbf x_i)^2<\/span>。整体<\/p>\n<div class=\"katex-block\">J_{\\mathrm{recon}}=\\sum_i\\lVert\\mathbf x_i\\rVert^2-\\sum_{i,j}(\\mathbf w_j^\\top\\mathbf x_i)^2.<\/div>\n<p>第一项与 <span class=\"katex-inline\">W<\/span> 无关，最小化 <span class=\"katex-inline\">J_{\\mathrm{recon}}<\/span> 等价于最大化<\/p>\n<div class=\"katex-block\">\\sum_{i,j}(\\mathbf w_j^\\top\\mathbf x_i)^2=\\mathrm{tr}(W^\\top XX^\\top W).<\/div>\n<h3>第三步：最大可分性路径<\/h3>\n<p>样本在低维超平面上的投影方差，按各维坐标方差求和：<\/p>\n<div class=\"katex-block\">J_{\\mathrm{var}}=\\sum_{i=1}^m\\lVert W^\\top\\mathbf x_i\\rVert^2=\\sum_{i,j}(\\mathbf w_j^\\top\\mathbf x_i)^2=\\mathrm{tr}(W^\\top XX^\\top W).<\/div>\n<p>与重构路径得到的迹项完全相同。方差最大方向即投影后样本最分散的方向；重构误差最小方向即保留信息最多的方向，两者是同一优化目标的两种说法。<\/p>\n<h3>第四步：约束优化与特征方程<\/h3>\n<p>单列方向 <span class=\"katex-inline\">\\mathbf w<\/span>，目标 <span class=\"katex-inline\">\\mathbf w^\\top XX^\\top\\mathbf w<\/span>，约束 <span class=\"katex-inline\">\\mathbf w^\\top\\mathbf w=1<\/span>。拉格朗日函数<\/p>\n<div class=\"katex-block\">L(\\mathbf w,\\lambda)=\\mathbf w^\\top XX^\\top\\mathbf w-\\lambda(\\mathbf w^\\top\\mathbf w-1).<\/div>\n<p>对 <span class=\"katex-inline\">\\mathbf w<\/span> 求偏导为零：<\/p>\n<div class=\"katex-block\">2XX^\\top\\mathbf w-2\\lambda\\mathbf w=0\\ \\Rightarrow\\ XX^\\top\\mathbf w=\\lambda\\mathbf w.<\/div>\n<p><span class=\"katex-inline\">\\mathbf w<\/span> 是协方差矩阵 <span class=\"katex-inline\">XX^\\top<\/span> 的特征向量，<span class=\"katex-inline\">\\lambda<\/span> 为对应特征值。目标值 <span class=\"katex-inline\">\\mathbf w^\\top XX^\\top\\mathbf w=\\lambda<\/span>，故特征值越大方向保留方差越多；按特征值从大到小取前 <span class=\"katex-inline\">d&#x27;<\/span> 个特征向量作主成分。<\/p>\n<h3>第五步：SVD 实现路径<\/h3>\n<p>实践中对数据矩阵做奇异值分解 <span class=\"katex-inline\">X=U\\Sigma V^\\top<\/span>，右奇异向量 <span class=\"katex-inline\">V<\/span> 的列即协方差 <span class=\"katex-inline\">XX^\\top=U\\Sigma^2U^\\top<\/span> 的特征向量；避免显式构造 <span class=\"katex-inline\">XX^\\top<\/span> 可减小数值误差。逐一选取方向的做法：先取最大特征值对应向量，扣除该方向方差后再分解残差；由正交性可知，逐一选取与直接取最大 <span class=\"katex-inline\">d&#x27;<\/span> 个特征值等价（原书 10.3 节，PDF 第 245 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：二维三点中心化<\/h3>\n<p>样本 <span class=\"katex-inline\">(1,1)<\/span>、<span class=\"katex-inline\">(2,2)<\/span>、<span class=\"katex-inline\">(3,3)<\/span> 的均值 <span class=\"katex-inline\">(2,2)<\/span>，中心化后 <span class=\"katex-inline\">(-1,-1)<\/span>、<span class=\"katex-inline\">(0,0)<\/span>、<span class=\"katex-inline\">(1,1)<\/span>。协方差<\/p>\n<div class=\"katex-block\">XX^\\top=\\begin{pmatrix}2&2\\\\2&2\\end{pmatrix}.<\/div>\n<p>特征方程 <span class=\"katex-inline\">\\det(XX^\\top-\\lambda I)=\\lambda^2-4\\lambda=\\lambda(\\lambda-4)=0<\/span>，特征值 <span class=\"katex-inline\">\\lambda_1=4,\\lambda_2=0<\/span>。<span class=\"katex-inline\">\\lambda_1<\/span> 对应特征向量满足 <span class=\"katex-inline\">2w_1+2w_2=4w_1\\Rightarrow w_1=w_2<\/span>，单位化 <span class=\"katex-inline\">\\mathbf w_1=(1,1)/\\sqrt2<\/span>；主方向沿直线 <span class=\"katex-inline\">x_1=x_2<\/span>，第二主成分方差为 0，数据在该方向无展开。<\/p>\n<h3>算例 2：投影坐标与重构<\/h3>\n<p>样本 <span class=\"katex-inline\">(1,1)<\/span> 中心化后 <span class=\"katex-inline\">(-1,-1)<\/span>，投影坐标 <span class=\"katex-inline\">z=\\mathbf w_1^\\top(-1,-1)=-\\sqrt2<\/span>；重构 <span class=\"katex-inline\">\\hat{\\mathbf x}=z\\mathbf w_1=(-1,-1)<\/span>，重构误差为 0。取第二主成分后坐标为 0，丢弃不损失信息。<\/p>\n<h3>算例 3：方差解释比<\/h3>\n<p>设协方差特征值为 <span class=\"katex-inline\">(4.0,1.0,0.5)<\/span>，累计总方差 5.5。取前 1 个成分解释比 <span class=\"katex-inline\">4/5.5\\approx0.727<\/span>；取前 2 个 <span class=\"katex-inline\">5/5.5\\approx0.909<\/span>。成分数按解释比阈值（如 90%）选择，剩余小方差方向视为噪声。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong>标准化与尺度影响<\/strong>：PCA 对特征尺度敏感，量纲大的特征方差被放大；各特征取值范围悬殊时先减均值除标准差，再做协方差分解。否则主方向被大量纲特征绑架。\n<\/li><li>\n<strong>PCA 与 LDA 的分工<\/strong>：无监督场景只能看方差；有监督且目标是分类时，类间/类内散度比才是判别方向依据。PCA 常作为 LDA、聚类之前的预处理步骤。\n<\/li><li>\n<strong>核 PCA<\/strong>：线性 PCA 的内积可像 SVM 对偶那样替换为核函数，在 <span class=\"katex-inline\">\\phi<\/span> 张成的高维空间做主成分；非线性流形上核 PCA 比线性投影更能保留局部结构（概念 c06 延伸）。\n<\/li><li>\n<strong>稀疏性与可解释性<\/strong>：普通主成分是原特征的稠密组合，难以指认单个属性；稀疏 PCA 在主成分上加 L1 约束，使成分只由少数原特征构成（概念 c11 正则衔接）。\n<\/ul>\n<h3>标准化对主方向的影响<\/h3>\n<p>PCA 最大化方差，量纲大的特征天然占高方差。若某特征取值 <span class=\"katex-inline\">0\\sim1000<\/span>，另一特征 <span class=\"katex-inline\">0\\sim1<\/span>，主方向几乎被大量纲特征锁定，小方差但有判别信息的方向被压到次成分。分解前先对各特征减均值除标准差，使距离与方差口径均衡；是否标准化取决于业务上是否希望量纲主导，不能默认直接分解原始值。<\/p>\n<h3>重构误差与累计解释比<\/h3>\n<p>保留 <span class=\"katex-inline\">d&#x27;<\/span> 个主成分后，重构误差为被丢弃方向的方差和：<\/p>\n<div class=\"katex-block\">J_{\\mathrm{recon}}=\\sum_{j>d'}\\lambda_j.<\/div>\n<p>累计解释比 <span class=\"katex-inline\">\\sum_{j=1}^{d&#x27;}\\lambda_j/\\sum_{j=1}^d\\lambda_j<\/span> 衡量保留信息比例。成分数按阈值（如 90%）选取；阈值越高重构越精，低维坐标维度越大。被丢弃的小方差方向常被视为噪声，但其中可能含弱判别信号，分类任务需回到验证集确认。<\/p>\n<h3>投影坐标的尺度与去相关<\/h3>\n<p>主成分坐标 <span class=\"katex-inline\">z_{ij}=\\mathbf w_j^\\top\\mathbf x_i<\/span> 在新坐标系下互不相关：协方差矩阵在 <span class=\"katex-inline\">W^\\top<\/span> 基下对角化，对角元即特征值。各主成分方差等于对应 <span class=\"katex-inline\">\\lambda_j<\/span>，按从大到小排列。降维后做聚类或回归，特征间重叠信息被去除，距离比较不再被重复维度稀释。<\/p>\n<h3>与特征选择、LDA 的分工<\/h3>\n<p>PCA 生成稠密组合成分，不保留原属性名；特征选择保留原特征子集，结果可读回业务属性。LDA 有监督，目标是类间散度与类内散度之比；PCA 无监督，只看总方差。分类场景常先 PCA 去相关降噪，再上 LDA 或分类器；无标签探索阶段只能用 PCA 这类无监督方法。<\/p>\n<h3>核 PCA 的衔接<\/h3>\n<p>线性 PCA 中内积 <span class=\"katex-inline\">\\mathbf x_i^\\top\\mathbf x_j<\/span> 可替换为核函数 <span class=\"katex-inline\">\\kappa(\\mathbf x_i,\\mathbf x_j)<\/span>，在 <span class=\"katex-inline\">\\phi<\/span> 张成的高维空间做主成分。非线性流形上线性投影破坏邻域关系，核 PCA 借核映射保留局部结构；其对偶形式与 SVM 核方法共用同一内积替换路径（概念 c06）。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n重构距离展开后，为什么最小化重构误差等价于最大化 <span class=\"katex-inline\">\\mathrm{tr}(W^\\top XX^\\top W)<\/span>？哪一项与基无关被略去？\n<\/li><li>\n写出单列方向的拉格朗日函数与特征方程，说明目标值为何等于对应特征值。\n<\/li><li>\n方差大的方向为什么不一定是判别方向？举两类样本沿小方差分量分离的例子。\n<\/li><li>\nSVD 路径如何避开显式构造 <span class=\"katex-inline\">XX^\\top<\/span>？逐一选方向与直接取前 <span class=\"katex-inline\">d&#x27;<\/span> 个特征向量为何等价？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "主成分分析 PCA：方差最大化与最小重构误差的等价性"}, "c11": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.263<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">线性模型：最小二乘正规方程、对数几率回归的对数似然与梯度<\/a><\/span><\/div><h1>特征选择与稀疏学习：过滤/包裹/嵌入机制、L1 与 L2 正则化的几何差别<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：原书第 11 章特征选择与稀疏学习（PDF 第 261–268 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>给定属性集中有些特征对任务有用，有些没用；无关特征增加维度、稀释距离，也抬高过拟合风险。特征选择（feature selection）从原始属性集中挑出相关特征子集，目的是降维、改善泛化与可解释性。困难分两步：怎样搜索候选子集，以及按什么准则评价子集好坏；按搜索与学习器的结合方式，方法分成过滤式、包裹式、嵌入式三类。稀疏学习则用正则项直接让权重产生大量零分量，把选择过程压进模型优化。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>相关与无关特征<\/strong>：对当前学习任务有用的属性称相关特征（relevant feature），没用的称无关特征（irrelevant feature）（原书 11.1 节，PDF 第 261 页）。<\/p>\n<p><strong>子集搜索<\/strong>：前向搜索从空集逐步加入特征；后向搜索从全集逐步剔除；随机搜索在子集空间随机探索。<\/p>\n<p><strong>子集评价<\/strong>：信息增益衡量特征子集划分与标记划分的差异；其他能判断两个划分差异的机制也可作评价准则（原书 11.2 节，PDF 第 263 页）。<\/p>\n<p><strong>过滤式（filter）<\/strong>：先选特征再训练学习器，选择过程与后续模型无关，相当于先用准则过滤一遍。<\/p>\n<p><strong>包裹式（wrapper）<\/strong>：在特征子集上用交叉验证估计学习器误差，以模型误差为选择准则；典型代表 LVW（Las Vegas Wrapper）（原书 11.3 节，PDF 第 265 页）。<\/p>\n<p><strong>嵌入式（embedding）<\/strong>：特征选择直接嵌入模型优化过程，如决策树结点划分属性、带 L1 正则的线性模型。<\/p>\n<p><strong>范数正则<\/strong>：L2 项 <span class=\"katex-inline\">\\lambda\\lVert\\mathbf w\\rVert_2^2<\/span>，L1 项 <span class=\"katex-inline\">\\lambda\\lVert\\mathbf w\\rVert_1<\/span>；L1 更易获得稀疏解，非零分量更少（原书 11.4 节，PDF 第 266 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>二维线性模型画出损失等值线与正则区域：L2 正则区域是圆 <span class=\"katex-inline\">\\omega_1^2+\\omega_2^2\\le r^2<\/span>，等值线与圆周相切通常落在坐标轴外，两个分量一般非零；L1 正则区域是菱形 <span class=\"katex-inline\">|\\omega_1|+|\\omega_2|\\le r<\/span>，角点落在坐标轴上，损失等值线碰到角点时一个分量被压成零。稀疏性来自菱形棱与角提供的轴上切点，圆形边界没有这种尖角。L0 范数要求非零分量最少，但不连续、难以优化，实践中用 L1 近似。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：过滤式适合高维粗筛、模型未定场景；包裹式适合子集规模可控、计算预算充足；嵌入式随模型一次训练完成，适合可加正则的线性与树模型。\n<\/li><li>\n<strong>失败案例一：过滤式与后续模型脱节<\/strong>。边际相关高的特征在具体模型组合中可能无效；纯过滤可能丢掉对某模型关键的弱相关特征。\n<\/li><li>\n<strong>失败案例二：包裹式子集组合爆炸<\/strong>。特征数大时候选子集指数增长，反复交叉验证训练开销不可承受；需限停条件或随机策略。\n<\/li><li>\n<strong>失败案例三：正则强度与模型容量错配<\/strong>。<span class=\"katex-inline\">\\lambda<\/span> 过大把权重全压零，欠拟合；过小失去稀疏与约束作用。强度在验证集上选。\n<\/li><li>\n<strong>边界<\/strong>：特征选择保留原属性可解释性；PCA 生成组合成分，两者压缩口径不同。稀疏解不自动等于好模型，零分量的稳定性需多样本验证。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>过滤式 vs 包裹式 vs 嵌入式<\/strong>：过滤与学习器解耦，快但粗；包裹以模型误差为准，准但贵；嵌入把选择写进训练目标，一次完成。\n<\/li><li>\n<strong>L1 vs L2<\/strong>：L1 产生稀疏权重，可兼作特征选择；L2 压缩权重幅值，权重趋小但一般不为零。L1 对应拉普拉斯先验，L2 对应高斯先验。\n<\/li><li>\n<strong>特征选择 vs 主成分分析<\/strong>：选择保留原特征子集；PCA 把原特征线性组合成新成分。选择结果可读回原属性，成分结果是稠密组合。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c02 的损失函数是正则项的挂载点；概念 c03 决策树的划分属性集合就是一种嵌入式选择。后继：概念 c10 的 PCA 是另一条降维路线；概念 c12 的假设复杂度分析解释了无关特征如何放大假设空间、抬高样本复杂度。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（特征选择与稀疏学习：过滤/包裹/嵌入机制、L1 与 L2 正则化的几何差别）<\/summary><div class=\"depth-body\"><h1>c11 深度推导：子集搜索评价链条、三类选择机制对照与 L1/L2 几何证明<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把特征选择讲透，往回追四层前提：<\/p>\n<ol><li>\n<strong>先区分相关与无关特征<\/strong>。任务驱动的相关性定义是选择前提；泛泛按方差大挑特征，会把高方差噪声误选进来。\n<\/li><li>\n<strong>子集空间需要搜索策略<\/strong>。特征数 <span class=\"katex-inline\">d<\/span> 对应 <span class=\"katex-inline\">2^d<\/span> 个子集，逐个枚举不可行；前向、后向、随机是三类可行探索路径。\n<\/li><li>\n<strong>子集要有评价准则<\/strong>。准则可基于信息增益等划分差异，也可基于学习器交叉验证误差；准则不同，选择结果不同。\n<\/li><li>\n<strong>选择与训练的结合方式分出三类机制<\/strong>：过滤式先选后训，包裹式以模型误差包裹搜索，嵌入式把选择写进优化目标。正则化从损失侧提供稀疏解路径。\n<\/ol>\n<p>依赖链方向：特征相关性 → 子集搜索策略 → 子集评价准则 → 过滤/包裹/嵌入对照 → 范数正则几何 → 稀疏解来源。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：相关性定义<\/h3>\n<p>相关特征是对当前学习任务有预测作用的属性；无关特征在给定标记后不提供额外信息。注意相关性是任务相关的：同一特征在分类任务中无关，在回归任务中可能有用。选择目标不是删低方差特征，而是删对标记无贡献的特征。<\/p>\n<h3>第二步：子集搜索策略<\/h3>\n<ul><li>\n<strong>前向搜索<\/strong>：从空集开始，每轮加入使评价提升最大的特征，直到提升停滞。路径由少到多，倾向于给出偏小子集。\n<\/li><li>\n<strong>后向搜索<\/strong>：从全集开始，每轮剔除使评价下降最小的特征，直到剔除损害性能。路径由多到少，保留组合信息。\n<\/li><li>\n<strong>随机搜索<\/strong>：随机产生子集或随机交换特征，配合停止条件跳出局部组合；拉斯维加斯方法给满足要求的解或不给解，蒙特卡罗方法一定给解但未必满足要求（原书 11.3 节，PDF 第 265 页）。\n<\/ul>\n<h3>第三步：子集评价机制<\/h3>\n<p>信息熵 <span class=\"katex-inline\">\\mathrm{Ent}(D)=-\\sum_k p_k\\log_2 p_k<\/span>，信息增益 <span class=\"katex-inline\">\\mathrm{Gain}(A)<\/span> 度量子集 <span class=\"katex-inline\">A<\/span> 划分与标记划分的差异。更一般地，子集确定对数据集的一个划分，标记对应真实划分；两个划分差异越小，子集越好。决策树结点划分属性构成的集合，就是该框架下的嵌入式选择结果。<\/p>\n<h3>第四步：过滤式流程<\/h3>\n<ol><li>\n在原始数据集上按准则给特征或子集打分；\n<\/li><li>\n选出高分子集；\n<\/li><li>\n用筛选后特征单独训练学习器。\n<\/ol>\n<p>选择过程不接触后续模型，计算开销低，可并行粗筛；缺点是准则与最终模型目标脱节，边际相关不等于模型内有效。Relief 类方法按近邻样本对的特征差异打分，属过滤式代表（转述原书 11.2 节）。<\/p>\n<h3>第五步：包裹式流程<\/h3>\n<p>LVW 算法：初始化全集 <span class=\"katex-inline\">A^*=A<\/span>、误差 <span class=\"katex-inline\">E=\\infty<\/span>、未更新轮数 <span class=\"katex-inline\">t=0<\/span>；每轮随机产生子集 <span class=\"katex-inline\">A&#x27;<\/span>，在 <span class=\"katex-inline\">A&#x27;<\/span> 上交叉验证得误差 <span class=\"katex-inline\">E&#x27;<\/span>；若 <span class=\"katex-inline\">E&#x27;&lt;E<\/span>，或 <span class=\"katex-inline\">E&#x27;=E<\/span> 且 <span class=\"katex-inline\">|A&#x27;|&lt;|A|<\/span>，更新最优子集并重置 <span class=\"katex-inline\">t<\/span>，否则 <span class=\"katex-inline\">t<\/span> 加 1；连续 <span class=\"katex-inline\">T<\/span> 轮未更新则停止。包裹式直接以学习器泛化误差为准则，选择结果对该模型更准；代价是每个候选子集都要训练与验证，特征数大时开销随子集组合增长。<\/p>\n<h3>第六步：嵌入式流程<\/h3>\n<p>选择与模型训练在同一优化过程中完成。两类典型：决策树在分裂时递归选出划分属性，属性集合随树生长自然形成；线性模型在损失上加正则项，优化过程中权重被压向零。嵌入式省去单独搜索环节，选择结果与模型参数同时得到。<\/p>\n<h3>第七步：L1 与 L2 的几何对照<\/h3>\n<p>带正则的线性目标<\/p>\n<div class=\"katex-block\">J(\\mathbf w)=\\sum_i(\\mathbf w^\\top\\mathbf x_i-y_i)^2+\\lambda\\lVert\\mathbf w\\rVert_q^q.<\/div>\n<p>二维情形画损失等值线（圆心在无约束最优点的同心曲线）与正则可行域。<\/p>\n<p><strong>L2 区域<\/strong>：<span class=\"katex-inline\">\\omega_1^2+\\omega_2^2\\le r^2<\/span>，边界光滑圆形。等值线与圆周切点一般不在坐标轴上，<span class=\"katex-inline\">\\omega_1,\\omega_2<\/span> 都为非零小量；L2 把权重整体压缩，不产生稀疏。<\/p>\n<p><strong>L1 区域<\/strong>：<span class=\"katex-inline\">|\\omega_1|+|\\omega_2|\\le r<\/span>，菱形边界在坐标轴上有角点。损失等值线碰到角点时，对应一个分量为零、另一个非零；棱上切点也常落在轴上。角点结构使 L1 解更易含零分量，这就是稀疏性的几何来源。<\/p>\n<p><strong>L0 范数<\/strong>：<span class=\"katex-inline\">\\lVert\\mathbf w\\rVert_0<\/span> 统计非零分量个数，最贴近稀疏目标，但函数不连续、组合优化难求解；L1 是其凸松弛，可由凸优化求解。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：正则切点对照<\/h3>\n<p>设无约束最优点 <span class=\"katex-inline\">w^*=(1,1)<\/span>，正则区域半径 <span class=\"katex-inline\">r=0.5<\/span>。L2 圆域切点沿 <span class=\"katex-inline\">(1,1)<\/span> 方向，<span class=\"katex-inline\">w\\approx(0.354,0.354)<\/span>，两分量非零；L1 菱形域，等值线先碰到的角点为 <span class=\"katex-inline\">(0.5,0)<\/span> 或 <span class=\"katex-inline\">(0,0.5)<\/span>，一个分量为零。同一数据、同一正则强度，L1 给出稀疏解，L2 给出压缩解。<\/p>\n<h3>算例 2：包裹式子集搜索轮次<\/h3>\n<p>特征集 <span class=\"katex-inline\">\\{a,b,c,d\\}<\/span>，初始全集交叉验证误差 0.20。随机子集 <span class=\"katex-inline\">\\{a,b,c\\}<\/span> 误差 0.18，更新最优；<span class=\"katex-inline\">\\{a,b,d\\}<\/span> 误差 0.19，不更新；<span class=\"katex-inline\">\\{a,c\\}<\/span> 误差 0.22，不更新；连续 <span class=\"katex-inline\">T=3<\/span> 轮无更优则停止，输出 <span class=\"katex-inline\">\\{a,b,c\\}<\/span>。每轮误差来自交叉验证，不是训练集误差，避免选择过拟合特征。<\/p>\n<h3>算例 3：正则强度扫描<\/h3>\n<p>同一线性模型取 <span class=\"katex-inline\">\\lambda=0.001<\/span>：权重接近无约束解，训练误差 0.06、测试误差 0.18；<span class=\"katex-inline\">\\lambda=1<\/span>：权重多数趋小，训练 0.09、测试 0.13；<span class=\"katex-inline\">\\lambda=100<\/span>：权重近零，训练与测试误差都升到 0.30 上下。中间强度对应偏差-方差折中，<span class=\"katex-inline\">\\lambda<\/span> 在验证集上选定。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong>稀疏解的解释价值<\/strong>：权重为零的特征不进入预测，模型可读成少数相关属性的规则；这在医疗、金融等需要理由的场景比黑箱成分更可接受。\n<\/li><li>\n<strong>正则与假设复杂度<\/strong>：无关特征越多，假设空间含有的一致假设越多，泛化所需样本量越大；L1 选择与特征选择都在收缩有效假设空间，与概念 c12 的样本复杂度分析衔接。\n<\/li><li>\n<strong>嵌入式与树模型<\/strong>：树的特征重要性可由各属性带来的基尼下降或信息增益累加；多次分裂后未被选中的属性等价于被排除出模型。\n<\/li><li>\n<strong>稳定性提醒<\/strong>：小样本下 L1 选出的零分量可能随样本波动；重采样观察权重零分量的稳定性，比单次结果更可靠。\n<\/ul>\n<h3>过滤式代表 Relief 的打分思路<\/h3>\n<p>Relief 对每个样本找同类近邻与异类近邻：特征在同类近邻间差异小、异类近邻间差异大则得分高。打分只看样本对的特征差值，不训练后续模型，属过滤式。扩展到多分类时汇总各类异类近邻。Relief 计算与模型解耦，适合高维数据初筛；缺点是不评估特征组合效应，交互作用强的弱特征可能被低估。<\/p>\n<h3>包裹式的开销来源<\/h3>\n<p>每个候选子集都要走一遍交叉验证：折数 <span class=\"katex-inline\">k<\/span> 次训练加 <span class=\"katex-inline\">k<\/span> 次验证，子集数随 <span class=\"katex-inline\">d<\/span> 指数增长。LVW 用随机子集加停止条件控制探索，但特征数上百时仍难穷尽。包裹式结果对指定学习器更准，换模型后子集需重选；它不产出跨模型通用的特征排序。实践中先过滤式粗筛降维，再在小候选集上包裹式精挑，是常见两段流程。<\/p>\n<h3>嵌入式与模型目标的耦合<\/h3>\n<p>决策树分裂时选信息增益或基尼下降最大的属性，属性集合随树生长自然形成；L1 正则在线性目标优化中把权重压零，零分量对应特征被排除。嵌入式选择与参数估计一次完成，没有独立搜索环节。代价是选择结果依赖模型假设：线性模型选出的子集，换到树模型上未必最优。<\/p>\n<h3>稀疏解的稳定性<\/h3>\n<p>小样本下 L1 选出的零分量可能随采样波动：某次训练某权重恰被压零，换一批样本又恢复非零。观察稳定性的做法是重采样多次统计权重零分量出现频率，稳定为零的特征才视为可剔除。稀疏性改善可解释性，但不自动改善泛化；正则强度过大把有效特征一并压零，偏差上升。<\/p>\n<h3>正则先验视角<\/h3>\n<p>L2 权重分布对应高斯先验，均值为零、对称衰减；L1 对应拉普拉斯先验，密度在零点尖锐，后验估计更易取到零点。先验选择决定权重空间约束形状：圆域压缩幅值，菱形域产生轴上稀疏解。这一联系与概念 c02 的损失估计、概念 c12 的假设复杂度收缩衔接：正则化在损失侧压低有效假设容量。<\/p>\n<h3>三类机制的选择流程<\/h3>\n<p>模型未定、维度极高：先过滤式按边际相关性粗筛；计算预算充足、子集规模可控：包裹式以交叉验证误差精挑；模型本身支持正则或分裂准则：嵌入式随训练一次完成。实际系统常组合：过滤去无关维度，嵌入在模型内再筛，包裹式只在关键子集上复核。选择结果都要在独立验证集上确认泛化收益，不能以训练集误差为准。<\/p>\n<h3>选择与压缩的区别收口<\/h3>\n<p>特征选择输出原属性子集，每个被选特征有业务含义；PCA 输出组合成分，成分是原特征线性加权。需要向业务解释依据时选选择路线，需要去相关降噪时用压缩路线；两者可串联，先选择粗筛再压缩降维。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n前向与后向搜索分别从什么集合出发？各自倾向于偏大还是偏小的子集？\n<\/li><li>\n过滤式与包裹式的评价准则差别在哪？为什么包裹式开销更大？\n<\/li><li>\n用二维正则区域说明 L1 为何比 L2 更易稀疏：圆形与菱形边界的切点位置有何不同？\n<\/li><li>\nL0 最贴近稀疏目标却为什么不直接优化？L1 作为凸松弛解决了什么问题？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "特征选择与稀疏学习：过滤/包裹/嵌入机制、L1 与 L2 正则化的几何差别"}, "c12": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.284<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">经验误差、过拟合与模型评估：错误率、P/R/F1、ROC-AUC、交叉验证与偏差-方差<\/a><\/span><\/div><h1>计算学习理论：PAC 可学习性、假设空间复杂度与样本复杂度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：原书第 12 章计算学习理论 12.1 基础知识、12.2 PAC 学习（PDF 第 281–286 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>经验误差低只说明模型记住了训练集，不自动保证新样本上误差小。计算学习理论（computational learning theory）要回答：什么任务在什么条件下可学，算法需要多少样本才能以多大概率达到多小误差，假设空间大小怎样影响泛化保证。它为前面各章的模型选择、正则化与集成策略提供理论语言，而不针对某个具体算法给实现步骤。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>样本设定<\/strong>：样本服从隐含未知分布 <span class=\"katex-inline\">\\mathcal D<\/span>，训练样本独立同分布（independent identically distributed，i.i.d.）采样；<span class=\"katex-inline\">\\mathcal X<\/span> 为样本空间，<span class=\"katex-inline\">\\mathcal Y<\/span> 为标记空间（原书 12.1 节，PDF 第 281 页）。<\/p>\n<p><strong>假设与概念<\/strong>：学习算法输出假设 <span class=\"katex-inline\">h\\in\\mathcal H<\/span>，<span class=\"katex-inline\">\\mathcal H<\/span> 为假设空间；目标概念 <span class=\"katex-inline\">c\\in\\mathcal C<\/span>，<span class=\"katex-inline\">\\mathcal C<\/span> 为概念类。若 <span class=\"katex-inline\">\\mathcal H<\/span> 中存在假设把训练示例全部分对，问题对算法可分（separable），亦称一致（consistent）。<\/p>\n<p><strong>PAC 辨识<\/strong>：对 <span class=\"katex-inline\">0&lt;\\varepsilon,\\delta&lt;1<\/span>、所有 <span class=\"katex-inline\">c\\in\\mathcal C<\/span> 和分布 <span class=\"katex-inline\">\\mathcal D<\/span>，若算法输出 <span class=\"katex-inline\">h<\/span> 满足<\/p>\n<div class=\"katex-block\">P(E(h)\\le\\varepsilon)\\ge1-\\delta,<\/div>\n<p>则称算法能从假设空间 <span class=\"katex-inline\">\\mathcal H<\/span> 中 PAC 辨识概念类 <span class=\"katex-inline\">\\mathcal C<\/span>（原书 12.2 节，PDF 第 283 页）。<\/p>\n<p><strong>PAC 可学习<\/strong>：存在算法与多项式规模 <span class=\"katex-inline\">m<\/span>，使 <span class=\"katex-inline\">m\\ge\\mathrm{poly}(1/\\varepsilon,1/\\delta,\\mathrm{size}(\\mathbf x),\\mathrm{size}(c))<\/span> 时，对任意分布都能 PAC 辨识。<\/p>\n<p><strong>样本复杂度（sample complexity）<\/strong>：满足 PAC 条件所需的最小 <span class=\"katex-inline\">m<\/span>；假定处理单样本时间为常数，时间复杂度等价于样本复杂度。<\/p>\n<p><strong>高效 PAC 可学习<\/strong>：概念类可学习且算法运行时间为上述参数的多项式函数（原书 12.2 节，PDF 第 284 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>PAC 框架把&quot;学得好&quot;拆成三个可量化部件：误差上界 <span class=\"katex-inline\">\\varepsilon<\/span>（学得多准）、置信度 <span class=\"katex-inline\">1-\\delta<\/span>（有多大把握）、样本数 <span class=\"katex-inline\">m<\/span>（需要多少数据）。假设空间复杂度是关键因素：候选假设越多，要排除的坏假设越多，达到同一 <span class=\"katex-inline\">\\varepsilon,\\delta<\/span> 所需样本量越大。有限假设空间下，单个假设以小概率在训练集上一致，多个假设同时一致的概率由并集界限控制；空间越大，坏假设蒙对训练集的机会越多，泛化保证越弱。<\/p>\n<p>奥卡姆剃刀在理论层面对应：拟合能力相当的假设中优先选更简单的，简单假设有效容量更低，过拟合风险更小。偏差-方差分解是误差在模型侧的拆解，PAC 是在概率分布侧对&quot;多少样本能学到多准&quot;的刻画。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：PAC 假设样本 i.i.d.、测试与训练同分布；结论对所有分布成立的分布无关口径要求较强。\n<\/li><li>\n<strong>失败案例一：把 PAC 可学习当成算法可优化<\/strong>。可学习性问的是存在样本与算法保证，不保证某个具体梯度下降能收敛到该假设；可优化性是另一层问题。\n<\/li><li>\n<strong>失败案例二：假设空间无限扩大<\/strong>。候选假设包含任意与训练集一致的复杂模型，理论上无法排除坏假设，泛化保证消失；这对应经验层面的过拟合。\n<\/li><li>\n<strong>失败案例三：跨分布套用保证<\/strong>。训练与测试分布变化时，PAC 的同分布前提不成立，原有误差界不再适用。\n<\/li><li>\n<strong>边界<\/strong>：PAC 给的是最坏分布下的概率保证，常偏保守；理论界指出方向与量级，具体任务仍需概念 c01 的实证评估。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>PAC 框架 vs 实证评估<\/strong>：交叉验证在固定数据集上估经验泛化；PAC 从分布与样本复杂度出发给概率保证，两者互补，理论界不替代测试集指标。\n<\/li><li>\n<strong>假设空间 vs 概念类<\/strong>：概念类是真实规律所在范围，假设空间是算法可能输出的范围；两者重合称恰 PAC 可学习，现实中概念类未知，假设空间常大于概念类。\n<\/li><li>\n<strong>可学习 vs 可分<\/strong>：可分指训练集存在一致假设；可学习指概率意义下的泛化保证。训练可分不推出 PAC 可学习。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的误差与置信口径是 PAC 定义的直觉来源；概念 c11 的特征选择收缩有效假设空间，对应降低假设复杂度。后继：间隔界（概念 c05）把 SVM 泛化误差与间隔宽度挂钩；集成多样性（概念 c08）可在假设复杂度与个体精度间权衡；半监督与概率图模型在 PAC 框架外补充利用未标记数据的学习保证。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（计算学习理论：PAC 可学习性、假设空间复杂度与样本复杂度）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：PAC 辨识要素、样本复杂度与假设空间作用<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把计算学习理论讲透，往回追四层前提：<\/p>\n<ol><li>\n<strong>先立概率样本框架<\/strong>。训练样本从未知分布 <span class=\"katex-inline\">\\mathcal D<\/span> 独立同分布采样，泛化误差按该分布度量；不先定分布口径，&quot;泛化&quot;没有数学对象。\n<\/li><li>\n<strong>区分真实概念与输出假设<\/strong>。<span class=\"katex-inline\">c<\/span> 是待学规律，<span class=\"katex-inline\">h<\/span> 是算法候选；假设空间 <span class=\"katex-inline\">\\mathcal H<\/span> 限定算法能输出的范围。\n<\/li><li>\n<strong>&quot;学得好&quot;拆成误差、置信度、样本量三件事<\/strong>。<span class=\"katex-inline\">\\varepsilon<\/span> 约束误差上界，<span class=\"katex-inline\">\\delta<\/span> 约束失败概率，<span class=\"katex-inline\">m<\/span> 约束数据规模；PAC 定义把三者写进一个不等式。\n<\/li><li>\n<strong>假设复杂度决定样本需求<\/strong>。候选假设越多，坏假设蒙对训练集的概率叠加越高，达到同一保证所需样本越多。\n<\/ol>\n<p>依赖链方向：i.i.d. 分布设定 → 概念/假设记号 → PAC 辨识不等式 → PAC 可学习与多项式规模 → 样本复杂度 → 假设空间复杂度的作用。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：样本与误差设定<\/h3>\n<p>样本空间 <span class=\"katex-inline\">\\mathcal X<\/span>，标记空间 <span class=\"katex-inline\">\\mathcal Y=\\{-1,+1\\}<\/span>（二分类口径）；样本服从隐含未知分布 <span class=\"katex-inline\">\\mathcal D<\/span>，训练集 <span class=\"katex-inline\">D<\/span> 中样本独立同分布采样。假设 <span class=\"katex-inline\">h:\\mathcal X\\to\\mathcal Y<\/span>，泛化误差<\/p>\n<div class=\"katex-block\">E(h)=\\Pr_{\\mathbf x\\sim\\mathcal D}[h(\\mathbf x)\\neq c(\\mathbf x)].<\/div>\n<p>误差按分布 <span class=\"katex-inline\">\\mathcal D<\/span> 计算，不依赖训练集具体取值。<\/p>\n<h3>第二步：概念类与假设空间<\/h3>\n<p>概念类 <span class=\"katex-inline\">\\mathcal C<\/span> 是所有可能目标概念的集合；假设空间 <span class=\"katex-inline\">\\mathcal H<\/span> 是学习算法可能输出的假设集合。若 <span class=\"katex-inline\">c\\in\\mathcal H<\/span>，存在假设与真实标记完全一致，问题对算法可分（一致）；若 <span class=\"katex-inline\">c\\notin\\mathcal H<\/span>，空间内无假设能正确分开。算法只能在 <span class=\"katex-inline\">\\mathcal H<\/span> 内选择，<span class=\"katex-inline\">\\mathcal H<\/span> 过大引入冗余，过小可能不含目标概念。<\/p>\n<h3>第三步：PAC 辨识定义<\/h3>\n<p>对 <span class=\"katex-inline\">0&lt;\\varepsilon,\\delta&lt;1<\/span>，所有 <span class=\"katex-inline\">c\\in\\mathcal C<\/span> 与分布 <span class=\"katex-inline\">\\mathcal D<\/span>，若存在算法 <span class=\"katex-inline\">\\mathfrak L<\/span>，输出 <span class=\"katex-inline\">h\\in\\mathcal H<\/span> 满足<\/p>\n<div class=\"katex-block\">\\Pr\\big[E(h)\\le\\varepsilon\\big]\\ge1-\\delta,<\/div>\n<p>则称 <span class=\"katex-inline\">\\mathfrak L<\/span> 能从 <span class=\"katex-inline\">\\mathcal H<\/span> 中 PAC 辨识 <span class=\"katex-inline\">\\mathcal C<\/span>。读法：以至少 <span class=\"katex-inline\">1-\\delta<\/span> 的概率，学到误差不超过 <span class=\"katex-inline\">\\varepsilon<\/span> 的假设；失败概率上限为 <span class=\"katex-inline\">\\delta<\/span>。PAC 全称 Probably Approximately Correct，概率近似正确。<\/p>\n<h3>第四步：PAC 可学习<\/h3>\n<p>令 <span class=\"katex-inline\">m<\/span> 为 i.i.d. 样例数。若存在算法 <span class=\"katex-inline\">\\mathfrak L<\/span> 与多项式函数 <span class=\"katex-inline\">\\mathrm{poly}(\\cdot)<\/span>，对任意分布，当<\/p>\n<div class=\"katex-block\">m\\ge\\mathrm{poly}(1/\\varepsilon,1/\\delta,\\mathrm{size}(\\mathbf x),\\mathrm{size}(c))<\/div>\n<p>时 <span class=\"katex-inline\">\\mathfrak L<\/span> 能 PAC 辨识 <span class=\"katex-inline\">\\mathcal C<\/span>，则称 <span class=\"katex-inline\">\\mathcal C<\/span> 对 <span class=\"katex-inline\">\\mathcal H<\/span> 而言 PAC 可学习。两个复杂度维度：数据复杂度由样本数 <span class=\"katex-inline\">m<\/span> 度量，时间复杂度在单样本处理时间为常数假设下等价于样本复杂度。<\/p>\n<h3>第五步：高效 PAC 与样本复杂度<\/h3>\n<p>若概念类可学习，且算法运行时间是 <span class=\"katex-inline\">1/\\varepsilon,1/\\delta,\\mathrm{size}(\\mathbf x),\\mathrm{size}(c)<\/span> 的多项式，称高效 PAC 可学习，算法为 PAC 学习算法。样本复杂度是满足 PAC 条件所需的最小 <span class=\"katex-inline\">m<\/span>；它随误差要求收紧（<span class=\"katex-inline\">\\varepsilon<\/span> 减小）、置信度提高（<span class=\"katex-inline\">\\delta<\/span> 减小）、概念规模增大而上升。<\/p>\n<h3>第六步：假设空间复杂度的作用<\/h3>\n<p>有限假设空间含 <span class=\"katex-inline\">M<\/span> 个假设。对一个固定坏假设（真实误差 <span class=\"katex-inline\">&gt;\\varepsilon<\/span>），它在 <span class=\"katex-inline\">m<\/span> 个独立样本上全部判对的概率上界为 <span class=\"katex-inline\">(1-\\varepsilon)^m\\le e^{-\\varepsilon m}<\/span>。由并集界限，<span class=\"katex-inline\">M<\/span> 个坏假设中至少一个蒙对训练集的概率不超过 <span class=\"katex-inline\">M e^{-\\varepsilon m}<\/span>。令该概率 <span class=\"katex-inline\">\\le\\delta<\/span>：<\/p>\n<div class=\"katex-block\">M e^{-\\varepsilon m}\\le\\delta\\ \\Rightarrow\\ m\\ge\\frac1\\varepsilon\\ln\\frac{M}{\\delta}.<\/div>\n<p><span class=\"katex-inline\">M<\/span> 增大（假设空间变复杂），所需样本 <span class=\"katex-inline\">m<\/span> 随 <span class=\"katex-inline\">\\ln M<\/span> 增长；这从理论上解释了无关特征与冗余模型如何抬高数据需求。无限空间改用 VC 维等容量度量替代 <span class=\"katex-inline\">M<\/span>（转述延伸）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：<span class=\"katex-inline\">\\varepsilon,\\delta<\/span> 读数<\/h3>\n<p>设 <span class=\"katex-inline\">\\varepsilon=0.10<\/span>，<span class=\"katex-inline\">\\delta=0.05<\/span>。PAC 保证读作：重复采样训练并建模，至少 95% 的情况下输出假设误差不超过 10%；至多 5% 的实验失败。<span class=\"katex-inline\">\\delta=0.01<\/span> 比 <span class=\"katex-inline\">\\delta=0.05<\/span> 置信度更高，所需样本更多；<span class=\"katex-inline\">\\varepsilon=0.05<\/span> 比 <span class=\"katex-inline\">0.10<\/span> 误差要求更严，样本量同样上升。<\/p>\n<h3>算例 2：有限空间样本量估算<\/h3>\n<p>设 <span class=\"katex-inline\">M=100<\/span> 个候选假设，<span class=\"katex-inline\">\\varepsilon=0.10<\/span>，<span class=\"katex-inline\">\\delta=0.05<\/span>。由 <span class=\"katex-inline\">m\\ge(1/0.10)\\ln(100/0.05)=10\\ln2000\\approx76.0<\/span>，至少约 77 个样本。若空间扩大到 <span class=\"katex-inline\">M=10^4<\/span>，<span class=\"katex-inline\">m\\ge10\\ln(2\\times10^5)\\approx122.0<\/span>，样本需求随对数空间规模上升。<\/p>\n<h3>算例 3：可学习与可分对照<\/h3>\n<p>训练集 6 个样本被某决策树完美分类，只说明该假设在训练集一致（可分）；PAC 可学习要求在未知分布上以 <span class=\"katex-inline\">1-\\delta<\/span> 概率误差 <span class=\"katex-inline\">\\le\\varepsilon<\/span>，训练一致不构成后者保证。跨分布场景中，训练可分的模型在新分布上误差可能很高。<\/p>\n<h2>延伸推演<\/h2>\n<ul><li>\n<strong>PAC 与偏差-方差的对应<\/strong>：PAC 从分布侧给泛化界，偏差-方差从模型侧拆误差；假设空间过小对应高偏差，过大对应高方差，两侧结论一致指向容量折中。\n<\/li><li>\n<strong>奥卡姆剃刀的理论位置<\/strong>：在同等拟合训练集的假设中选简单者，等价于压低有效假设容量；由并集界限，容量越小坏假设蒙对概率越低，泛化界越紧。\n<\/li><li>\n<strong>间隔界与 PAC 的衔接<\/strong>：SVM 的间隔最大化把泛化误差界与间隔宽度、支持向量数挂钩，是 PAC 思想在具体模型上的细化（概念 c05、c06）。\n<\/li><li>\n<strong>理论保证的边界<\/strong>：PAC 给最坏分布下的保守界，不预测单模型实测精度；分布漂移、标签噪声、特征缺失都在保证前提之外，落地仍需交叉验证与独立测试（概念 c01）。\n<\/ul>\n<h3>可分与一致的含义<\/h3>\n<p>若目标概念 <span class=\"katex-inline\">c\\in\\mathcal H<\/span>，假设空间中存在与 <span class=\"katex-inline\">c<\/span> 一致的假设，问题对算法可分（separable），亦称一致（consistent）。若 <span class=\"katex-inline\">c\\notin\\mathcal H<\/span>，空间内任何假设都无法完全正确，训练再久也有不可约误差。可分是样本层面的性质：训练集存在一致假设；可学习是分布层面的保证：以高概率达到误差上界。两者不能互推。<\/p>\n<h3>样本复杂度的参数走向<\/h3>\n<p>样本复杂度 <span class=\"katex-inline\">m<\/span> 随三个方向上升：误差要求收紧（<span class=\"katex-inline\">\\varepsilon<\/span> 减小，<span class=\"katex-inline\">1/\\varepsilon<\/span> 增大）；置信度提高（<span class=\"katex-inline\">\\delta<\/span> 减小，<span class=\"katex-inline\">\\ln(1/\\delta)<\/span> 增大）；概念与样本规模增大（<span class=\"katex-inline\">\\mathrm{size}(c)<\/span>、<span class=\"katex-inline\">\\mathrm{size}(\\mathbf x)<\/span> 增大）。有限空间界 <span class=\"katex-inline\">m\\ge(1/\\varepsilon)\\ln(M/\\delta)<\/span> 中，<span class=\"katex-inline\">M<\/span> 以对数形式进入，误差 <span class=\"katex-inline\">\\varepsilon<\/span> 以倒数形式进入：收紧误差比对扩大空间规模更耗样本。<\/p>\n<h3>无限假设空间与 VC 维<\/h3>\n<p>有限空间用假设数 <span class=\"katex-inline\">M<\/span> 度量容量；无限空间（如线性分类器全体）<span class=\"katex-inline\">M<\/span> 无穷，需用 VC 维（Vapnik-Chervonenkis dimension）替代：能被假设打散的最大样本数。VC 维刻画假设的增长能力，泛化界写成样本数与 VC 维的关系。PAC 框架不限定空间类型，有限 <span class=\"katex-inline\">M<\/span> 只是最易推导的口径；原书 12.3 节前后讨论了假设复杂度与增长函数（转述延伸）。<\/p>\n<h3>PAC 与偏差-方差的对应<\/h3>\n<p>PAC 在分布侧回答&quot;多少样本能学到多准&quot;，偏差-方差在模型侧拆解误差来源。假设空间过小：容量不足，偏差项主导，PAC 意义下可能不含目标概念；空间过大：容量冗余，方差项上升，排除坏假设所需样本增多。两侧结论一致指向容量折中：模型复杂度要与样本规模、任务难度相称。<\/p>\n<h3>理论保证的保守性<\/h3>\n<p>PAC 界对所有分布取最坏情形，通常比实测泛化误差宽松。它指出方向与量级：空间越大样本需求越高，误差要求越严数据需求越大；具体模型在具体数据集上的精度，仍要靠交叉验证与独立测试估计。PAC 不替代实证评估，也不保证某个优化算法收敛到最优假设——可学习性是存在性保证，可优化性是算法层面问题。<\/p>\n<h3>不可学习与分布漂移<\/h3>\n<p>若概念类在给定假设空间下不存在多项式样本复杂度保证，称 PAC 不可学习；常见原因是假设空间与任务严重错位，或概念本身需要不可计算的表示。训练与测试分布不一致时，i.i.d. 同分布前提破坏，原有误差界失效；半监督、迁移学习处理分布部分重叠的场景，属于 PAC 基本框架之外的推广。<\/p>\n<h3>数值算例补充：置信度与样本量<\/h3>\n<p>设 <span class=\"katex-inline\">M=50<\/span>，<span class=\"katex-inline\">\\varepsilon=0.08<\/span>，<span class=\"katex-inline\">\\delta=0.10<\/span>。由 <span class=\"katex-inline\">m\\ge(1/0.08)\\ln(50/0.10)=12.5\\ln500\\approx77.9<\/span>，至少约 79 个样本。若把置信度提到 <span class=\"katex-inline\">\\delta=0.01<\/span>，<span class=\"katex-inline\">m\\ge12.5\\ln5000\\approx101.5<\/span>，约 102 个样本；误差收紧到 <span class=\"katex-inline\">\\varepsilon=0.04<\/span>，<span class=\"katex-inline\">m\\ge25\\ln500\\approx155.8<\/span>，约 156 个样本。误差减半带来的样本增长，幅度大于置信度一个数量级的调整。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出 PAC 辨识不等式，说明 <span class=\"katex-inline\">\\varepsilon<\/span>、<span class=\"katex-inline\">\\delta<\/span> 分别约束什么，失败概率是多少。\n<\/li><li>\nPAC 可学习定义中样本量 <span class=\"katex-inline\">m<\/span> 与哪些参数成多项式关系？时间复杂度为何在一定假设下等价于样本复杂度？\n<\/li><li>\n有限假设空间下由并集界限推出 <span class=\"katex-inline\">m\\ge(1/\\varepsilon)\\ln(M/\\delta)<\/span>，说明 <span class=\"katex-inline\">M<\/span> 增大时样本需求怎样变化。\n<\/li><li>\n训练集可分为什么不等于 PAC 可学习？举例说明分布变化后训练一致的模型可能出现什么情况。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "计算学习理论：PAC 可学习性、假设空间复杂度与样本复杂度"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：模型评估、线性模型与决策树：误差与性能度量、最小二乘与对数几率回归、划分准则与剪枝<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 2–4 章：模型评估与选择、线性模型、决策树<\/a><br>检查点：能手算混淆矩阵上的 P/R/F1 与 AUC 梯形面积，写出正规方程解并解释列空间几何，按信息增益与基尼指数比较两个候选划分属性，说清预剪枝与后剪枝各自牺牲什么。<\/li><li class='path-step' id='path-02'><strong>步骤 02：神经网络与支持向量机：多层前馈网络、误差逆传播、间隔最大化、对偶问题与核方法<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 5–6 章：神经网络与支持向量机<\/a><br>检查点：能沿 BP 链条写出连接权的梯度更新，把 SVM 基本型推到对偶形式，按 KKT 条件判断哪些样本是支持向量，说明线性可分与非线性可分场景下核函数替换了哪一步。<\/li><li class='path-step' id='path-03'><strong>步骤 03：贝叶斯分类器、集成学习与聚类：后验判定、条件独立、Bagging 与 Boosting、AdaBoost 更新、k-means<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 7–9 章：贝叶斯分类器、集成学习与聚类<\/a><br>检查点：能写出朴素贝叶斯判定式并解释条件独立假设去掉后会发生什么，对比 Bagging 并行采样与 Boosting 串行加权的生成机制，推得 AdaBoost 基学习器权重与样本权重更新公式，说明 k-means 目标函数为何单调下降以及对初值的敏感点。<\/li><li class='path-step' id='path-04'><strong>步骤 04：降维、特征选择与计算学习理论：PCA 等价性、稀疏正则、选择机制与 PAC 可学习性<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 10–12 章：降维与度量学习、特征选择与稀疏学习、计算学习理论<\/a><br>检查点：能从最近重构性与最大可分性两条路径推出同一个 PCA 优化目标，用几何方式解释 L1 为何更易稀疏，区分三类特征选择机制的评估对象，按 PAC 定义说清 ε、δ、样本复杂度与假设空间复杂度各自约束什么。<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='泛化误差（generalization error）'>泛化误差（Generalization Error） — 学习器在新样本上的误差；训练误差（经验误差）是学习器在训练集上的误差。训练误差很小而泛化误差大，对应过拟合（原书 2.1 节，PDF 第 37 页）。 <span class=glossary-ref>（第 2–4 章：模型评估与选择、线性模型、决策树）<\/span><\/li><li data-term='查准率 p 与查全率 r（precision / recall）'>查准率 P 与查全率 R（Precision / Recall） — 混淆矩阵下 $P=TP/(TP+FP)$，$R=TP/(TP+FN)$；两者通常此消彼长，F1 取调和平均 $F_1=2PR/(P+R)$（原书 2.3.2 节，PDF 第 44–46 页）。 <span class=glossary-ref>（第 2–4 章：模型评估与选择、线性模型、决策树）<\/span><\/li><li data-term='roc 与 auc'>ROC 与 AUC — ROC 纵轴为真正例率 $TPR=TP/(TP+FN)$，横轴为假正例率 $FPR=FP/(FP+TN)$；AUC 为 ROC 曲线下面积，衡量排序质量，不是分类准确率（原书 2.3.3 节，PDF 第 47–48 页）。 <span class=glossary-ref>（第 2–4 章：模型评估与选择、线性模型、决策树）<\/span><\/li><li data-term='偏差-方差分解（bias-variance decomposition）'>偏差-方差分解（Bias-Variance Decomposition） — 泛化误差可拆为偏差（模型假设与真实规律的差距）、方差（训练集扰动带来的预测波动）与噪声；欠拟合对应高偏差，过拟合对应高方差（原书 2.6 节，PDF 第 40 页前后）。 <span class=glossary-ref>（第 2–4 章：模型评估与选择、线性模型、决策树）<\/span><\/li><li data-term='正规方程（normal equation）'>正规方程（Normal Equation） — 平方损失对权重求梯度为零得到 $X^\top X\\mathbf w=X^\top\\mathbf y$；$X^\top X$ 满秩时闭式解 $\\mathbf w^*=(X^\top X)^{-1}X^\top\\mathbf y$（原书 3.2 节，PDF 第 69 页）。 <span class=glossary-ref>（第 2–4 章：模型评估与选择、线性模型、决策树）<\/span><\/li><li data-term='对数几率回归（logistic regression）'>对数几率回归（Logistic Regression） — 用 Sigmoid 函数把线性输出压到 $(0,1)$ 作为类后验概率估计，以对数似然为优化目标，经梯度下降或牛顿法求解；输出是概率而非类别标记（原书 3.3 节，PDF 第 72–73 页）。 <span class=glossary-ref>（第 2–4 章：模型评估与选择、线性模型、决策树）<\/span><\/li><li data-term='信息增益（information gain）'>信息增益（Information Gain） — $\\mathrm{Gain}(D,a)=\\mathrm{Ent}(D)-\\sum_v |D^v|/|D|\\,\\mathrm{Ent}(D^v)$，其中信息熵 $\\mathrm{Ent}(D)=-\\sum_k p_k\\log_2 p_k$；ID3 按信息增益选划分属性（原书 4.2.1 节，PDF 第 89 页）。 <span class=glossary-ref>（第 2–4 章：模型评估与选择、线性模型、决策树）<\/span><\/li><li data-term='基尼指数（gini index）'>基尼指数（Gini Index） — 基尼值 $\\mathrm{Gini}(D)=1-\\sum_k p_k^2$，反映随机抽两个样本类别不一致的概率；CART 按划分后基尼指数最小选属性（原书 4.2.3 节，PDF 第 93 页）。 <span class=glossary-ref>（第 2–4 章：模型评估与选择、线性模型、决策树）<\/span><\/li><li data-term='误差逆传播算法（error backpropagation, bp）'>误差逆传播算法（Error BackPropagation, BP） — 基于梯度下降，按链式法则把输出层误差逐层反向传回隐层，更新连接权与阈值；BP 是训练多层前馈网络最常用的算法（原书 5.3 节，PDF 第 115–116 页）。 <span class=glossary-ref>（第 5–6 章：神经网络与支持向量机）<\/span><\/li><li data-term='间隔（margin）与支持向量（support vector）'>间隔（Margin）与支持向量（Support Vector） — 异类支持向量到划分超平面的距离之和为间隔；约束取等号的样本即支持向量，拉格朗日乘子 $\\alpha_i&gt;0$ 的样本只在求和中出现（原书 6.1–6.2 节，PDF 第 136–138 页）。 <span class=glossary-ref>（第 5–6 章：神经网络与支持向量机）<\/span><\/li><li data-term='核函数（kernel function）'>核函数（Kernel Function） — $\\kappa(\\mathbf x_i,\\mathbf x_j)=\\phi(\\mathbf x_i)^\top\\phi(\\mathbf x_j)$，在不显式写出高维映射 $\\phi$ 的情况下计算特征空间内积；对偶问题中的内积可整体替换为核函数（原书 6.3 节，PDF 第 140–141 页）。 <span class=glossary-ref>（第 5–6 章：神经网络与支持向量机）<\/span><\/li><li data-term='朴素贝叶斯分类器（naive bayes classifier）'>朴素贝叶斯分类器（Naive Bayes Classifier） — 在属性条件独立假设下，后验 $P(c|\\mathbf x)\\propto P(c)\\prod_j P(x_j|c)$；判定取后验最大的类别，$P(\\mathbf x)$ 对所有类别相同可略去（原书 7.3 节，PDF 第 165 页）。 <span class=glossary-ref>（第 7–9 章：贝叶斯分类器、集成学习与聚类）<\/span><\/li><li data-term='集成学习（ensemble learning）'>集成学习（Ensemble Learning） — 构建并结合多个个体学习器完成任务；个体间强依赖、串行生成的代表是 Boosting，无强依赖、可并行的代表是 Bagging 与随机森林（原书 8.1–8.3 节，PDF 第 185、187、192 页）。 <span class=glossary-ref>（第 7–9 章：贝叶斯分类器、集成学习与聚类）<\/span><\/li><li data-term='自助采样（bootstrap sampling）'>自助采样（Bootstrap Sampling） — 有放回地抽 $m$ 次得到 $m$ 个样本的采样集；初始集约 63.2% 的样本出现在采样集中，Bagging 以此产生不同子集训练基学习器（原书 2.2.3、8.3.1 节，PDF 第 192 页）。 <span class=glossary-ref>（第 7–9 章：贝叶斯分类器、集成学习与聚类）<\/span><\/li><li data-term='k-means 平方误差'>k-means 平方误差 — $E=\\sum_{i=1}^{k}\\sum_{\\mathbf x\\in C_i}\\lVert\\mathbf x-\\boldsymbol\\mu_i\\rVert_2^2$，刻画簇内样本围绕均值向量的紧密程度；找到最优簇划分是 NP 难问题，算法以迭代方式近似求解（原书 9.4.1 节，PDF 第 216–217 页）。 <span class=glossary-ref>（第 7–9 章：贝叶斯分类器、集成学习与聚类）<\/span><\/li><li data-term='pac 可学习（pac learnable）'>PAC 可学习（PAC Learnable） — 对 $0&lt;\\varepsilon,\\delta&lt;1$，存在算法与多项式规模 $m$，使以至少 $1-\\delta$ 的概率输出假设误差不超过 $\\varepsilon$；样本复杂度是满足该条件所需的最小 $m$（原书 12.2 节，PDF 第 283–284 页）。 <span class=glossary-ref>（第 10–12 章：降维与度量学习、特征选择与稀疏学习、计算学习理论）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库<\/h1>\n<h2>模式 1：先分损失来源，再推梯度更新<\/h2>\n<p>每个模型先确认输出类型与噪声假设：连续值回归对应平方损失，伯努利分类对应对数似然，指数损失对应 Boosting 加性模型。损失定下来再写矩阵形式、求梯度、得更新式；跳过损失来源直接背更新规则，换任务时无法判断该用哪种损失。线性回归、对数几率回归、BP 网络共享&quot;输出—损失—梯度—更新&quot;循环，差别只在预测函数与损失项。<\/p>\n<h2>模式 2：评估口径先于模型调参<\/h2>\n<p>选模型、定正则强度、挑剪枝方案，都要在独立验证集或交叉验证折上做，测试集只留作最终验收。指标按任务选：重视挑准看 P，重视不漏看 R，整体排序看 AUC，类别不平衡不能只看准确率。训练低测试高指向方差过大，训练测试双高指向偏差不足；评估口径不先立住，后续优化方向失去依据。<\/p>\n<h2>模式 3：判别式与生成式对照选型<\/h2>\n<p>直接学决策边界的是判别式（SVM、对数几率回归、决策树），先建模类条件概率再推后验的是生成式（朴素贝叶斯）。样本少、属性独立近似成立时生成式可估；要求边界精度、样本充足时判别式常更稳。缺失值处理上生成式可跳过缺项，判别式通常要先插补。两条路线在贝叶斯风险与经验误差两个框架下分别成立。<\/p>\n<h2>模式 4：单模型短板决定集成路线<\/h2>\n<p>高方差低偏差的模型（如深决策树）用 Bagging：自助采样加并行投票压方差；高偏差弱学习器用 Boosting：串行聚焦难样本、加权叠加压偏差。集成收益来自&quot;好而不同&quot;，个体雷同则重复同一模型，个体太差则组合无效。Boosting 对噪声标签敏感，Bagging 对异常样本相对稳健；基学习器选择先看单模型偏差方差归属。<\/p>\n<h2>模式 5：无监督目标写成原型或距离函数<\/h2>\n<p>聚类先定相似度口径：k-means 用欧氏距离平方与质心原型，密度聚类按连通扩簇，层次聚类生成嵌套树。目标函数拆成分配与更新两步交替，每步证明不增目标、目标有下界，再谈收敛。k-means 收敛到局部极小，初值敏感，多跑几组初值取目标最小者；簇形不规则时换密度方法，不硬套球形原型。<\/p>\n<h2>模式 6：降维先分清保信息还是保判别<\/h2>\n<p>无标签压缩用 PCA：协方差最大方差方向等价于最小重构误差；有监督判别用 LDA：类间散度比类内散度。方差大不等于可分，分类前确认主成分没丢掉弱判别方向。特征选择保留原属性可读回业务，PCA 生成稠密成分不可直接解释；需要去相关降噪走压缩，需要规则依据走选择。<\/p>\n<h2>模式 7：正则从几何与先验两侧理解<\/h2>\n<p>L2 圆域压缩权重幅值，对应高斯先验；L1 菱形域角点产生稀疏解，对应拉普拉斯先验。稀疏不是自动更好：正则过强把有效特征压零，偏差上升。特征选择三机制分工：过滤式与模型解耦粗筛，包裹式以交叉验证误差精挑，嵌入式随模型训练一次完成。正则强度与子集选择都在验证集上定值。<\/p>\n<h2>模式 8：理论保证落到样本与复杂度<\/h2>\n<p>PAC 框架把&quot;学得好&quot;拆成误差上界 ε、失败概率 δ、样本数 m 三件事；假设空间越大，排除坏假设所需样本越多。理论界给最坏分布下的保守方向，不替代实测指标。可学习性是存在保证，可优化性是算法收敛问题；训练可分不推出泛化可学。理解模型泛化时，把假设复杂度、样本规模、偏差方差放在同一张权衡图上看。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>四单元路线对照<\/h2>\n<ul><li>\n<strong>第 1 单元（原书第 2–4 章）<\/strong>：模型评估与选择、线性模型、决策树（PDF 第 37–110 页；印刷页码 = PDF 页码 − 14）。\n<\/li><li>\n<strong>第 2 单元（原书第 5–6 章）<\/strong>：神经网络、支持向量机（PDF 第 111–160 页）。\n<\/li><li>\n<strong>第 3 单元（原书第 7–9 章）<\/strong>：贝叶斯分类器、集成学习、聚类（PDF 第 161–238 页）。\n<\/li><li>\n<strong>第 4 单元（原书第 10–12 章）<\/strong>：降维与度量学习、特征选择与稀疏学习、计算学习理论（PDF 第 240–306 页）；第 16 章强化学习为选读（PDF 第 385 页起）。\n<\/ul>\n<h2>评估指标速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>指标<\/th><th>公式<\/th><th>口径<\/th><\/tr><\/thead><tbody><tr><td>查准率 P<\/td><td><span class=\"katex-inline\">TP/(TP+FP)<\/span><\/td><td>预测为正中真正例比例<\/td><\/tr><tr><td>查全率 R<\/td><td><span class=\"katex-inline\">TP/(TP+FN)<\/span><\/td><td>真实正例被找出比例<\/td><\/tr><tr><td>F1<\/td><td><span class=\"katex-inline\">2PR/(P+R)<\/span><\/td><td>P、R 调和平均<\/td><\/tr><tr><td>TPR<\/td><td><span class=\"katex-inline\">TP/(TP+FN)<\/span><\/td><td>ROC 纵轴<\/td><\/tr><tr><td>FPR<\/td><td><span class=\"katex-inline\">FP/(FP+TN)<\/span><\/td><td>ROC 横轴<\/td><\/tr><tr><td>AUC<\/td><td>ROC 曲线下梯形面积和<\/td><td>正负样本对排序胜率<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>模型目标与求解速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>目标函数<\/th><th>求解/更新<\/th><\/tr><\/thead><tbody><tr><td>线性回归<\/td><td><span class=\"katex-inline\">\\lVert X\\hat{\\mathbf w}-\\mathbf y\\rVert_2^2<\/span><\/td><td>正规方程 <span class=\"katex-inline\">\\hat{\\mathbf w}^*=(X^\\top X)^{-1}X^\\top\\mathbf y<\/span><\/td><\/tr><tr><td>对数几率回归<\/td><td><span class=\"katex-inline\">\\sum_i[-y_i\\beta^\\top\\hat{\\mathbf x}_i+\\ln(1+e^{\\beta^\\top\\hat{\\mathbf x}_i})]<\/span><\/td><td>梯度 <span class=\"katex-inline\">\\nabla_\\beta E=\\sum_i\\hat{\\mathbf x}_i(\\hat y_i-y_i)<\/span><\/td><\/tr><tr><td>决策树<\/td><td><span class=\"katex-inline\">\\mathrm{Ent}(D)-\\sum_v|D^v|/|D|\\,\\mathrm{Ent}(D^v)<\/span><\/td><td>选增益/增益率/基尼指数最大属性<\/td><\/tr><tr><td>SVM<\/td><td><span class=\"katex-inline\">\\frac12\\lVert\\mathbf w\\rVert^2<\/span>，<span class=\"katex-inline\">y_i(\\mathbf w^\\top\\mathbf x_i+b)\\ge1<\/span><\/td><td>对偶 <span class=\"katex-inline\">\\max\\sum\\alpha_i-\\frac12\\sum\\alpha_i\\alpha_j y_i y_j\\mathbf x_i^\\top\\mathbf x_j<\/span><\/td><\/tr><tr><td>AdaBoost<\/td><td>指数损失 <span class=\"katex-inline\">E[e^{-fH}]<\/span><\/td><td><span class=\"katex-inline\">\\alpha_t=\\frac12\\ln\\frac{1-\\varepsilon_t}{\\varepsilon_t}<\/span><\/td><\/tr><tr><td>k-means<\/td><td><span class=\"katex-inline\">\\sum_i\\sum_{\\mathbf x\\in C_i}\\lVert\\mathbf x-\\boldsymbol\\mu_i\\rVert^2<\/span><\/td><td>分配最近质心 → 更新簇均值<\/td><\/tr><tr><td>PCA<\/td><td><span class=\"katex-inline\">\\max\\mathrm{tr}(W^\\top XX^\\top W)<\/span>，<span class=\"katex-inline\">W^\\top W=I<\/span><\/td><td>协方差特征值分解取前 <span class=\"katex-inline\">d&#x27;<\/span> 特征向量<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>准则与正则对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>概念<\/th><th>形式<\/th><th>特点<\/th><\/tr><\/thead><tbody><tr><td>信息熵<\/td><td><span class=\"katex-inline\">-\\sum_k p_k\\log_2p_k<\/span><\/td><td>越小纯度越高<\/td><\/tr><tr><td>基尼值<\/td><td><span class=\"katex-inline\">1-\\sum_k p_k^2<\/span><\/td><td>抽样两类不一致概率<\/td><\/tr><tr><td>L2 正则<\/td><td><span class=\"katex-inline\">\\lambda\\lVert\\mathbf w\\rVert_2^2<\/span><\/td><td>圆域，压缩幅值，分量一般非零<\/td><\/tr><tr><td>L1 正则<\/td><td><span class=\"katex-inline\">\\lambda\\lVert\\mathbf w\\rVert_1<\/span><\/td><td>菱形域，角点产生稀疏解<\/td><\/tr><tr><td>拉普拉斯修正<\/td><td><span class=\"katex-inline\">(|D_c|+1)/(|D|+N)<\/span><\/td><td>避免零概率抹去证据<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>易混点提醒<\/h2>\n<ul><li>\nAUC 不是准确率：AUC 看排序，准确率看固定阈值判对比例。\n<\/li><li>\n支持向量只是 <span class=\"katex-inline\">\\alpha_i&gt;0<\/span> 的样本，不是全部训练样本。\n<\/li><li>\nAdaBoost 判错样本权重上升、判对下降，方向不能写反。\n<\/li><li>\n信息增益偏向取值多的属性；增益率用 IV 分母修正。\n<\/li><li>\nPCA 保方差不保判别；两类可分方向可能在小方差分量上。\n<\/li><li>\n训练可分不等于 PAC 可学习；前者是样本层面，后者是分布层面概率保证。\n<\/ul>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/机器学习-周志华-书签带目录-10", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 2–4 章：模型评估与选择、线性模型、决策树", "href": "#/chapter/ch01"}, {"label": "第 5–6 章：神经网络与支持向量机", "href": "#/chapter/ch02"}, {"label": "第 7–9 章：贝叶斯分类器、集成学习与聚类", "href": "#/chapter/ch03"}, {"label": "第 10–12 章：降维与度量学习、特征选择与稀疏学习、计算学习理论", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "经验误差、过拟合与模型评估：错误率、P/R/F1、ROC-AUC、交叉验证与偏差-方差", "href": "#/concept/c01"}, {"label": "线性模型：最小二乘正规方程、对数几率回归的对数似然与梯度", "href": "#/concept/c02"}, {"label": "决策树：信息增益、增益率、基尼指数与剪枝处理", "href": "#/concept/c03"}, {"label": "多层前馈神经网络与误差逆传播：链式法则、连接权梯度与更新规则", "href": "#/concept/c04"}, {"label": "支持向量机：间隔最大化、拉格朗日对偶、KKT 条件与支持向量", "href": "#/concept/c05"}, {"label": "核方法与软间隔：非线性映射、核函数替换、松弛变量与惩罚系数", "href": "#/concept/c06"}, {"label": "朴素贝叶斯分类器：贝叶斯决策论、条件独立假设与拉普拉斯修正", "href": "#/concept/c07"}, {"label": "集成学习：Bagging 并行采样与 Boosting 串行加权，AdaBoost 指数损失与权重更新", "href": "#/concept/c08"}, {"label": "k-means 原型聚类：平方误差目标函数、簇分配与均值更新、EM 视角与初值敏感", "href": "#/concept/c09"}, {"label": "主成分分析 PCA：方差最大化与最小重构误差的等价性", "href": "#/concept/c10"}, {"label": "特征选择与稀疏学习：过滤/包裹/嵌入机制、L1 与 L2 正则化的几何差别", "href": "#/concept/c11"}, {"label": "计算学习理论：PAC 可学习性、假设空间复杂度与样本复杂度", "href": "#/concept/c12"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 2–4 章：模型评估与选择、线性模型、决策树", "href": "#/quiz/ch01"}, {"label": "测验：第 5–6 章：神经网络与支持向量机", "href": "#/quiz/ch02"}, {"label": "测验：第 7–9 章：贝叶斯分类器、集成学习与聚类", "href": "#/quiz/ch03"}, {"label": "测验：第 10–12 章：降维与度量学习、特征选择与稀疏学习、计算学习理论", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.37<\/div><h1>第 2–4 章：模型评估与选择、线性模型、决策树<\/h1>\n<blockquote>对应原书第 2 章模型评估与选择、第 3 章线性模型、第 4 章决策树（PDF 第 37–110 页；印刷页码 = PDF 页码 − 14）。页码偏移已用第 2 章首节核对：印刷第 23 章首页对应 PDF 第 37 页。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n从一张混淆矩阵算出错误率、精度、查准率 P、查全率 R 与 F1，并按 ROC 坐标估算 AUC，说清 AUC 衡量的是排序质量而非准确率；\n<\/li><li>\n写出平方损失的矩阵形式，推到正规方程闭式解并解释列空间几何含义；写出对数几率回归的对数似然目标与梯度；\n<\/li><li>\n用信息熵、信息增益、增益率、基尼指数比较两个候选划分属性，说出信息增益对取值数目多的属性偏好在哪一步，以及预剪枝、后剪枝各自控制什么风险。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>评估先于调参：只有把经验误差与泛化误差分开，用留出法、交叉验证在独立样本上量出指标，选出的模型才可能在新样本上生效；线性模型把预测写成属性的线性组合，用最小二乘或对数似然求解；决策树沿属性递归划分，靠纯度准则决定每次选哪个属性切开样本集。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 经验误差、过拟合与性能度量<\/h3>\n<p>原书 2.1 节把分类错误样本数占样本总数的比例称为错误率（error rate），<span class=\"katex-inline\">E=a/m<\/span>，<span class=\"katex-inline\">1-a/m<\/span> 为精度（accuracy）（PDF 第 37 页）。训练集上的误差叫训练误差（training error）或经验误差（empirical error），新样本上的误差叫泛化误差（generalization error）。学习器把训练样本自身特点当成一般规律，导致泛化性能下降，即过拟合（overfitting）；尚未学好一般规律则为欠拟合（underfitting）。<\/p>\n<p>二分类结果按真实类别与预测类别排成混淆矩阵：真正例 TP、假正例 FP、真反例 TN、假反例 FN，四项之和等于样例总数。查准率 <span class=\"katex-inline\">P=TP/(TP+FP)<\/span>，查全率 <span class=\"katex-inline\">R=TP/(TP+FN)<\/span>（原书 2.3.2 节，PDF 第 44 页）。两者通常此消彼长：把所有样本都判正例，查全率为 1 而查准率很低；只挑最有把握的样本，查准率高而漏掉不少正例。F1 取调和平均 <span class=\"katex-inline\">F_1=2PR/(P+R)<\/span>。<\/p>\n<p>ROC 曲线以真正例率 <span class=\"katex-inline\">TPR=TP/(TP+FN)<\/span> 为纵轴、假正例率 <span class=\"katex-inline\">FPR=FP/(FP+TN)<\/span> 为横轴（原书 2.3.3 节，PDF 第 47 页）。AUC（Area Under ROC Curve）是曲线下面积，含义是随机取一个正例、一个反例时，正例预测得分高于反例的概率；它不依赖某个固定截断点，量的是模型对样本的排序能力。<\/p>\n<h3>2. 概念 1：经验误差、过拟合与模型评估（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。2.2 节给出数据集划分的三种途径：留出法（hold-out）把数据集拆成训练集与测试集，训练集用于拟合，测试集只用于评估；交叉验证（cross-validation）把数据折成 <span class=\"katex-inline\">k<\/span> 份，轮流取一份做测试、其余做训练，再取 <span class=\"katex-inline\">k<\/span> 次结果平均；自助采样（bootstrap）有放回抽样，约 63.2% 的样本进入采样集。2.6 节从偏差-方差角度理解泛化误差：偏差刻画模型假设与真实规律的差距，方差刻画训练集扰动带来的预测波动，欠拟合对应高偏差，过拟合对应高方差（PDF 第 40 页前后）。<\/p>\n<h3>3. 概念 2：线性模型（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。线性模型（linear model）试图学得 <span class=\"katex-inline\">f(\\mathbf x)=\\mathbf w^\\top\\mathbf x+b<\/span>，<span class=\"katex-inline\">w_j<\/span> 是第 <span class=\"katex-inline\">j<\/span> 个属性的权重，<span class=\"katex-inline\">b<\/span> 是截距（原书 3.1 节，PDF 第 67 页）。回归任务用最小二乘法估计 <span class=\"katex-inline\">\\mathbf w<\/span> 与 <span class=\"katex-inline\">b<\/span>；分类任务把线性输出送入对数几率函数（logistic function）<span class=\"katex-inline\">y=1/(1+e^{-z})<\/span>，把结果压到 <span class=\"katex-inline\">(0,1)<\/span> 作为类后验概率估计，再用极大似然法估计参数（原书 3.2、3.3 节，PDF 第 69、72–73 页）。<\/p>\n<h3>4. 概念 3：决策树（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。决策树（decision tree）基于树结构做分类：叶结点给出类别标记，内部结点对应属性测试，分支对应属性取值。学习的关键是划分选择（原书 4.2 节，PDF 第 89 页）：希望分支结点样本尽可能同类，即纯度（purity）越来越高。信息熵度量纯度，信息增益衡量划分带来的纯度提升；增益率对取值数目多的偏好做了修正；CART 决策树用基尼指数选属性。剪枝（pruning）是对付过拟合的主要手段：预剪枝在划分前估计泛化性能，不能提升就停止；后剪枝先生成完整树，再自底向上考察是否把子树替换成叶结点（原书 4.3 节，PDF 第 93 页）。<\/p>\n<h2>推导一（推演）：混淆矩阵上的 P、R、F1 与 AUC 估算<\/h2>\n<p>设测试集 100 个样本，其中正例 30、反例 70。模型判出 TP=24，FP=6，FN=6，TN=64，四项合计 100。<\/p>\n<p>查准率 <span class=\"katex-inline\">P=24/(24+6)=0.800<\/span>；查全率 <span class=\"katex-inline\">R=24/(24+6)=0.800<\/span>；F1 <span class=\"katex-inline\">=2\\times0.800\\times0.800/(0.800+0.800)=0.800<\/span>。再算 ROC 坐标：<span class=\"katex-inline\">TPR=24/(24+6)=0.800<\/span>，<span class=\"katex-inline\">FPR=6/(6+64)=0.086<\/span>。若另一截断点得到 <span class=\"katex-inline\">TPR=0.500<\/span>、<span class=\"katex-inline\">FPR=0.020<\/span>，基于有限样例的 ROC 由相邻点线段连接；AUC 按梯形求和：相邻点 <span class=\"katex-inline\">(x_1,y_1)<\/span>、<span class=\"katex-inline\">(x_2,y_2)<\/span> 之间贡献 <span class=\"katex-inline\">\\frac{y_1+y_2}{2}(x_2-x_1)<\/span>。把所有梯形面积累加，即得近似 AUC。注意 AUC 不是准确率：本例准确率 <span class=\"katex-inline\">(24+64)/100=0.880<\/span>，而 AUC 描述的是任意正负样本对的得分排序胜率，两者口径不同。<\/p>\n<h2>推导二（推演）：最小二乘正规方程与列空间几何<\/h2>\n<p>把偏置并入权重，记 <span class=\"katex-inline\">\\hat{\\mathbf w}=(\\mathbf w;b)<\/span>，设计矩阵 <span class=\"katex-inline\">X\\in\\mathbb R^{m\\times(d+1)}<\/span> 每行末列恒为 1，标签向量 <span class=\"katex-inline\">\\mathbf y\\in\\mathbb R^m<\/span>。平方损失 <span class=\"katex-inline\">E_{\\hat{\\mathbf w}}=(\\mathbf y-X\\hat{\\mathbf w})^\\top(\\mathbf y-X\\hat{\\mathbf w})<\/span>。展开后对 <span class=\"katex-inline\">\\hat{\\mathbf w}<\/span> 求梯度，二次型 <span class=\"katex-inline\">\\hat{\\mathbf w}^\\top X^\\top X\\hat{\\mathbf w}<\/span> 的梯度为 <span class=\"katex-inline\">2X^\\top X\\hat{\\mathbf w}<\/span>，一次项梯度为 <span class=\"katex-inline\">-2X^\\top\\mathbf y<\/span>，故<\/p>\n<div class=\"katex-block\">\\nabla_{\\hat{\\mathbf w}}E=2X^\\top(X\\hat{\\mathbf w}-\\mathbf y).<\/div>\n<p>令梯度为零得 <span class=\"katex-inline\">X^\\top X\\hat{\\mathbf w}=X^\\top\\mathbf y<\/span>；当 <span class=\"katex-inline\">X^\\top X<\/span> 满秩或正定，<span class=\"katex-inline\">\\hat{\\mathbf w}^*=(X^\\top X)^{-1}X^\\top\\mathbf y<\/span>（原书 3.2 节，PDF 第 69 页）。几何上，<span class=\"katex-inline\">\\hat{\\mathbf y}=X\\hat{\\mathbf w}<\/span> 落在 <span class=\"katex-inline\">X<\/span> 的列空间内，残差 <span class=\"katex-inline\">\\mathbf y-\\hat{\\mathbf y}<\/span> 与列空间正交；正规方程找到的是列空间中离 <span class=\"katex-inline\">\\mathbf y<\/span> 最近的点。若特征数超过样本数，<span class=\"katex-inline\">X^\\top X<\/span> 不满秩，解析解不唯一，需靠正则化或归纳偏好选出一个解（原书 3.2 节，PDF 第 70 页）。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>只在训练集上评估模型<\/strong>：过拟合的模型经验误差可以为零，但泛化误差未知。没有独立测试集或交叉验证，无法区分&quot;规律学到了&quot;与&quot;训练样本被背下来&quot;，调参方向完全失去依据。\n<\/li><li>\n<strong>把 AUC 当成准确率来比较两个模型<\/strong>：两者口径不同。准确率固定在某个截断点上看判对比例，AUC 看全排序。类别不平衡时，全部判反例的模型准确率很高但 AUC 接近 0.5；按准确率选模型会把排序能力差的模型选出来。\n<\/li><li>\n<strong>决策树不设剪枝、属性可反复划分<\/strong>：结点分支一直分到样本全对，分支数目随样本数增长，训练集自身的噪声被当成规律记下；新样本上稍一扰动就走错分支。预剪枝控制树深，后剪枝在完整树基础上回退，两者都把模型复杂度压回与数据规模相称的范围。\n<\/li><li>\n<strong><span class=\"katex-inline\">X^\\top X<\/span> 不满秩时直接求逆<\/strong>：数值上得到奇异或不稳定的解，权重在共线特征间任意分配；工程上改为正则化最小二乘或迭代求解，并先做特征去相关。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章提供全书的评估语言与第一类可解释模型。第 5–6 章的神经网络、支持向量机同样要靠本章的混淆矩阵、交叉验证与偏差-方差口径做比较；线性模型的&quot;损失→梯度→更新&quot;循环是 BP 算法的蓝本；决策树的纯度准则在第 8 章集成学习中作为基学习器反复出现。下一章进入两层非线性模型：先搭多层前馈网络并推 BP 反向梯度，再把分类边界推到最大间隔超平面。<\/p>", "ch02": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.111<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 2–4 章：模型评估与选择、线性模型、决策树<\/a><\/span><\/div><h1>第 5–6 章：神经网络与支持向量机<\/h1>\n<blockquote>对应原书第 5 章神经网络、第 6 章支持向量机（PDF 第 111–160 页；印刷页码 = PDF 页码 − 14）。第 5 章首节印刷第 97 页对应 PDF 第 111 页，第 6 章首节印刷第 121 页对应 PDF 第 135 页。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01（线性模型、损失与梯度、评估口径）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清多层前馈网络的层间信号流向，写出单样本均方误差，沿链式法则推出隐层到输出层连接权的梯度更新式；\n<\/li><li>\n把 SVM 最大间隔问题写成凸二次规划基本型，经拉格朗日乘子法推到对偶问题，按 KKT 条件判断哪些样本是支持向量；\n<\/li><li>\n解释核函数在对偶问题中替换了哪一步，区分线性可分、非线性可分与软间隔三种情形各自的约束与代价。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>单层感知机只能划分线性可分数据；多层前馈网络靠隐层非线性变换扩大表达能力，BP 算法沿计算图把误差梯度逐层回传更新连接权。支持向量机不在可分的超平面里随便挑一个，而是找位于两类样本&quot;正中间&quot;、对扰动容忍度最好的最大间隔超平面；对偶形式让求解只依赖样本内积，核函数由此把线性边界推广到高维特征空间。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 多层前馈神经网络<\/h3>\n<p>原书 5.2 节给出多层前馈神经网络（multi-layer feedforward neural networks）结构：输入层接收外界输入，隐层与输出层包含功能神经元，网络拓扑不含环或回路（PDF 第 115 页）。输入层神经元不做函数处理；隐层与输出层神经元对信号加工，最终结果由输出层给出。网络学习过程就是根据训练数据调整神经元之间的连接权（connection weight）与每个功能神经元的阈值；学到的东西蕴涵在连接权与阈值中。<\/p>\n<h3>2. 概念 4：误差逆传播算法（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。BP（error BackPropagation）算法基于梯度下降策略，以目标的负梯度方向对参数调整（原书 5.3 节，PDF 第 116 页）。对训练例 <span class=\"katex-inline\">(\\mathbf x_k,\\mathbf y_k)<\/span>，设网络输出 <span class=\"katex-inline\">\\hat{\\mathbf y}_k<\/span>，均方误差 <span class=\"katex-inline\">E_k=\\frac12\\sum_{j=1}^l(\\hat y_{kj}-y_{kj})^2<\/span>，系数 <span class=\"katex-inline\">1/2<\/span> 为后续求导便利。任意参数 <span class=\"katex-inline\">v<\/span> 的更新估计为 <span class=\"katex-inline\">v\\leftarrow v+\\Delta v<\/span>，其中 <span class=\"katex-inline\">\\Delta v=-\\eta\\,\\partial E_k/\\partial v<\/span>，<span class=\"katex-inline\">\\eta<\/span> 为学习率。推导从隐层到输出层的连接权 <span class=\"katex-inline\">\\omega_{hj}<\/span> 入手，再沿链式法则把误差信号传回隐层。<\/p>\n<h3>3. 概念 5：支持向量机的间隔与对偶（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。给定训练集 <span class=\"katex-inline\">D=\\{(\\mathbf x_i,y_i)\\}<\/span>，<span class=\"katex-inline\">y_i\\in\\{-1,+1\\}<\/span>，样本空间中能分开两类的超平面可能有很多。点到超平面 <span class=\"katex-inline\">(\\mathbf w,b)<\/span> 的距离为 <span class=\"katex-inline\">r=|\\mathbf w^\\top\\mathbf x+b|/\\lVert\\mathbf w\\rVert<\/span>（原书 6.1 节，PDF 第 136 页）。距离超平面最近、使约束取等号的样本称为支持向量（support vector），两个异类支持向量到超平面的距离之和 <span class=\"katex-inline\">2/\\lVert\\mathbf w\\rVert<\/span> 即间隔（margin）。最大间隔问题等价于最小化 <span class=\"katex-inline\">\\frac12\\lVert\\mathbf w\\rVert^2<\/span>，约束 <span class=\"katex-inline\">y_i(\\mathbf w^\\top\\mathbf x_i+b)\\ge 1<\/span>。<\/p>\n<h3>4. 概念 6：核方法与软间隔（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。原始空间线性不可分时，把样本映射到更高维特征空间 <span class=\"katex-inline\">\\phi(\\mathbf x)<\/span>，使样本在特征空间内线性可分（原书 6.3 节，PDF 第 140 页）。对偶问题中样本之间只以内积 <span class=\"katex-inline\">\\mathbf x_i^\\top\\mathbf x_j<\/span> 出现，核函数 <span class=\"katex-inline\">\\kappa(\\mathbf x_i,\\mathbf x_j)=\\phi(\\mathbf x_i)^\\top\\phi(\\mathbf x_j)<\/span> 直接给出特征空间内积，不必显式写出映射。现实数据常有噪声，严格可分约束会把个别异常样本当成边界；软间隔（soft margin）允许部分样本违反间隔约束，引入松弛变量与惩罚系数 <span class=\"katex-inline\">C<\/span>，在间隔宽度与误分代价之间折中（原书 6.4 节，PDF 第 146 页前后）。<\/p>\n<h2>推导一（推演）：BP 连接权梯度的链式展开<\/h2>\n<p>记隐层第 <span class=\"katex-inline\">h<\/span> 个神经元输出 <span class=\"katex-inline\">b_h<\/span>，输出层第 <span class=\"katex-inline\">j<\/span> 个神经元输入 <span class=\"katex-inline\">\\beta_j=\\sum_h\\omega_{hj}b_h<\/span>，输出 <span class=\"katex-inline\">\\hat y_j=f(\\beta_j-\\theta_j)<\/span>，<span class=\"katex-inline\">f<\/span> 为 Sigmoid 函数，<span class=\"katex-inline\">f&#x27;(z)=f(z)(1-f(z))<\/span>。单样本误差 <span class=\"katex-inline\">E=\\frac12\\sum_j(\\hat y_j-y_j)^2<\/span>。<\/p>\n<p>对连接权 <span class=\"katex-inline\">\\omega_{hj}<\/span> 求偏导：<span class=\"katex-inline\">\\partial E/\\partial\\omega_{hj}=(\\partial E/\\partial\\hat y_j)(\\partial\\hat y_j/\\partial\\beta_j)(\\partial\\beta_j/\\partial\\omega_{hj})<\/span>。第一项 <span class=\"katex-inline\">\\partial E/\\partial\\hat y_j=\\hat y_j-y_j<\/span>；第二项由 Sigmoid 导数得 <span class=\"katex-inline\">\\hat y_j(1-\\hat y_j)<\/span>；第三项 <span class=\"katex-inline\">\\partial\\beta_j/\\partial\\omega_{hj}=b_h<\/span>。合并记输出层误差项 <span class=\"katex-inline\">g_j=\\hat y_j(1-\\hat y_j)(\\hat y_j-y_j)<\/span>，则 <span class=\"katex-inline\">\\Delta\\omega_{hj}=-\\eta g_j b_h<\/span>。隐层权重的梯度再把 <span class=\"katex-inline\">g_j<\/span> 经 <span class=\"katex-inline\">\\omega_{hj}<\/span> 回传到隐层神经元，乘以隐层输出的 Sigmoid 导数得到隐层误差项 <span class=\"katex-inline\">e_h<\/span>，更新规则与输出层同形。整条链上每一步只用到本地偏导数，不需要对网络整体写出闭合导数。<\/p>\n<h2>推导二（推演）：SVM 基本型到对偶问题<\/h2>\n<p>最大间隔问题写成<\/p>\n<div class=\"katex-block\">\\min_{\\mathbf w,b}\\ \\frac12\\lVert\\mathbf w\\rVert^2\\quad\\text{s.t.}\\ y_i(\\mathbf w^\\top\\mathbf x_i+b)\\ge 1,\\ i=1,\\dots,m.<\/div>\n<p>对每条约束引入拉格朗日乘子 <span class=\"katex-inline\">\\alpha_i\\ge 0<\/span>，拉格朗日函数<\/p>\n<div class=\"katex-block\">L(\\mathbf w,b,\\boldsymbol\\alpha)=\\frac12\\lVert\\mathbf w\\rVert^2+\\sum_i\\alpha_i\\big(1-y_i(\\mathbf w^\\top\\mathbf x_i+b)\\big).<\/div>\n<p>令 <span class=\"katex-inline\">L<\/span> 对 <span class=\"katex-inline\">\\mathbf w<\/span> 和 <span class=\"katex-inline\">b<\/span> 的偏导为零：<span class=\"katex-inline\">\\mathbf w=\\sum_i\\alpha_i y_i\\mathbf x_i<\/span>，<span class=\"katex-inline\">0=\\sum_i\\alpha_i y_i<\/span>。把这两个等式代回 <span class=\"katex-inline\">L<\/span>，消去 <span class=\"katex-inline\">\\mathbf w<\/span> 与 <span class=\"katex-inline\">b<\/span>，得到对偶问题<\/p>\n<div class=\"katex-block\">\\max_{\\boldsymbol\\alpha}\\ \\sum_i\\alpha_i-\\frac12\\sum_{i}\\sum_j\\alpha_i\\alpha_j y_i y_j\\mathbf x_i^\\top\\mathbf x_j\\quad\\text{s.t.}\\ \\sum_i\\alpha_i y_i=0,\\ \\alpha_i\\ge 0.<\/div>\n<p>对偶解出 <span class=\"katex-inline\">\\boldsymbol\\alpha<\/span> 后，模型 <span class=\"katex-inline\">f(\\mathbf x)=\\sum_i\\alpha_i y_i\\mathbf x_i^\\top\\mathbf x+b<\/span>。KKT 条件要求 <span class=\"katex-inline\">\\alpha_i\\ge 0<\/span>、<span class=\"katex-inline\">y_i f(\\mathbf x_i)-1\\ge 0<\/span>、<span class=\"katex-inline\">\\alpha_i(y_i f(\\mathbf x_i)-1)=0<\/span>（原书 6.2 节，PDF 第 137–138 页）：<span class=\"katex-inline\">\\alpha_i=0<\/span> 的样本不出现在求和中，对模型没有影响；<span class=\"katex-inline\">\\alpha_i&gt;0<\/span> 的样本必有 <span class=\"katex-inline\">y_i f(\\mathbf x_i)=1<\/span>，即落在间隔边界上。支持向量只是这些 <span class=\"katex-inline\">\\alpha_i&gt;0<\/span> 的样本，不是全部训练样本。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>BP 中隐层误差信号不回传、只更新输出层权重<\/strong>：隐层连接权保持初始值不变，网络退化为&quot;固定随机特征 + 单层线性分类器&quot;，隐层学不到有用变换；训练误差长期停在欠拟合水平。链式法则断掉一层，后面所有隐层参数都收不到梯度。\n<\/li><li>\n<strong>SVM 不要求间隔最大化，只找一个能分开训练集的超平面<\/strong>：可分超平面有无穷多个，紧贴某一类样本的边界对局部扰动敏感，新样本稍偏就越界；最大间隔准则把&quot;容忍度&quot;量化成间隔宽度，选到两类中间的稳健边界。\n<\/li><li>\n<strong>非线性可分数据上直接套线性核对偶、不做特征映射<\/strong>：对偶内积在原空间计算，线性超平面无法分开异或型问题，对偶优化要么无解要么只能给出严重误分的边界；核映射把样本抬到高维空间后再求超平面，对偶目标里的内积被核函数替代。\n<\/li><li>\n<strong>去掉软间隔约束、坚持所有样本严格满足 <span class=\"katex-inline\">y_i(\\mathbf w^\\top\\mathbf x_i+b)\\ge 1<\/span><\/strong>：个别噪声样本会把边界拉向自己，间隔被压得很窄，模型对训练噪声敏感；松弛变量允许越界样本付出罚分代价，换取整体间隔更宽、泛化更稳。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章两条线索在后续章节汇合：BP 训练的神经网络是第 8 章集成学习中常用的基学习器；SVM 的对偶与核思想在第 13 章半监督 SVM 中再次出现。本章用到的梯度下降循环来自第 3 章线性模型，评估优劣仍用第 2 章的 P/R、ROC 与交叉验证口径。下一章转向概率框架与组合策略：先按贝叶斯决策论估后验概率，再看多个弱学习器如何集成，进而进入无监督的聚类划分。<\/p>", "ch03": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.161<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 5–6 章：神经网络与支持向量机<\/a><\/span><\/div><h1>第 7–9 章：贝叶斯分类器、集成学习与聚类<\/h1>\n<blockquote>对应原书第 7 章贝叶斯分类器、第 8 章集成学习、第 9 章聚类（PDF 第 161–238 页；印刷页码 = PDF 页码 − 14）。第 7 章首节印刷第 147 页对应 PDF 第 161 页，第 8 章印刷第 171 页对应 PDF 第 185 页，第 9 章印刷第 197 页对应 PDF 第 211 页。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch02（梯度更新、线性与非线性边界、评估指标）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出贝叶斯决策论的期望风险形式，在条件独立假设下推出朴素贝叶斯判定式，说明拉普拉斯修正解决哪类零概率问题；\n<\/li><li>\n区分 Bagging 与 Boosting 的个体学习器生成机制，推得 AdaBoost 基学习器权重 <span class=\"katex-inline\">\\alpha_t=\\frac12\\ln((1-\\varepsilon_t)/\\varepsilon_t)<\/span> 与样本权重更新方向；\n<\/li><li>\n写出 k-means 的平方误差目标函数，描述簇分配与均值更新两步迭代，解释目标函数为何单调下降，以及算法对初始均值向量的敏感点。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>贝叶斯分类器在概率框架下按后验概率做决策：直接估计类条件概率代价过高，朴素贝叶斯引入属性条件独立假设把联合条件概率拆成单属性乘积；集成学习把多个&quot;好而不同&quot;的个体学习器组合起来，Bagging 靠自助采样并行产生差异，Boosting 靠串行加权逐步纠正前序错误；聚类在无标记样本上按样本相似度划簇，k-means 以簇内平方误差最小为目标，交替分配样本与更新均值。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 贝叶斯决策论与朴素贝叶斯<\/h3>\n<p>原书 7.1 节把贝叶斯决策论（Bayesian decision theory）作为概率框架下实施决策的基本方法：在所有相关概率已知的理想情形下，基于后验概率 <span class=\"katex-inline\">P(c|\\mathbf x)<\/span> 和误判损失选择最优类别标记（PDF 第 161 页）。估计类条件概率 <span class=\"katex-inline\">P(\\mathbf x|c)<\/span> 时，<span class=\"katex-inline\">d<\/span> 个二值属性就有 <span class=\"katex-inline\">2^d<\/span> 种样本取值，远大于训练样本数，直接用频率估计不可行。7.2 节的极大似然估计先假定概率分布形式，再用训练样本估计分布参数。<\/p>\n<h3>2. 概念 7：朴素贝叶斯分类器（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。朴素贝叶斯分类器（naive Bayes classifier）假设各属性在类别给定条件下相互独立，于是<\/p>\n<div class=\"katex-block\">P(c|\\mathbf x)\\propto P(c)\\prod_{j=1}^d P(x_j|c),<\/div>\n<p>判定取后验最大的类别；<span class=\"katex-inline\">P(\\mathbf x)<\/span> 对所有类别相同，比较后验时可略去（原书 7.3 节，PDF 第 165 页）。训练集中未出现的属性取值会把概率估成零，连带把整个后验压成零；拉普拉斯修正（Laplacian correction）在先验与条件概率的分子各加 1、分母加上类别数或取值数，避免&quot;未被观测到&quot;被当成&quot;概率为零&quot;（PDF 第 167 页）。<\/p>\n<h3>3. 概念 8：集成学习（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。集成学习（ensemble learning）先产生一组个体学习器（individual learner），再用某种策略结合（原书 8.1 节，PDF 第 185 页）。个体学习器间存在强依赖、必须串行生成的是 Boosting；不存在强依赖、可同时生成的是 Bagging 与随机森林（原书 8.2 节，PDF 第 187 页）。AdaBoost 从初始分布训练第一个基学习器，之后每轮根据前序基学习器表现调整样本分布：判错的样本后续受到更多关注，再按调整后的分布训练下一个基学习器，最终把 <span class=\"katex-inline\">T<\/span> 个基学习器加权结合。<\/p>\n<h3>4. 概念 9：k-means 原型聚类（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。聚类（clustering）在无标记样本上揭示数据内在性质与规律（原书 9.1 节，PDF 第 211 页）。k-means 算法针对簇划分 <span class=\"katex-inline\">C=\\{C_1,\\dots,C_k\\}<\/span> 最小化平方误差<\/p>\n<div class=\"katex-block\">E=\\sum_{i=1}^k\\sum_{\\mathbf x\\in C_i}\\lVert\\mathbf x-\\boldsymbol\\mu_i\\rVert_2^2,<\/div>\n<p><span class=\"katex-inline\">\\boldsymbol\\mu_i<\/span> 为簇 <span class=\"katex-inline\">i<\/span> 的均值向量（原书 9.4.1 节，PDF 第 216 页）。找到最优簇划分需考察所有可能划分，是 NP 难问题；算法从随机初始均值向量出发，交替执行簇分配（样本归入最近均值向量）与均值更新（重算各簇均值），直到均值不再变化。<\/p>\n<h2>推导一（推演）：AdaBoost 基学习器权重与样本更新<\/h2>\n<p>设第 <span class=\"katex-inline\">t<\/span> 轮基学习器 <span class=\"katex-inline\">h_t<\/span> 在分布 <span class=\"katex-inline\">D_t<\/span> 上的分类误差率 <span class=\"katex-inline\">\\varepsilon_t=P_{\\mathbf x\\sim D_t}(h_t(\\mathbf x)\\neq f(\\mathbf x))<\/span>。AdaBoost 从指数损失 <span class=\"katex-inline\">E_{\\mathbf x\\sim D_t}[e^{-f(\\mathbf x)\\alpha_t h_t(\\mathbf x)}]<\/span> 出发，按判对、判错拆成两项：<\/p>\n<div class=\"katex-block\">E=e^{-\\alpha_t}(1-\\varepsilon_t)+e^{\\alpha_t}\\varepsilon_t.<\/div>\n<p>对 <span class=\"katex-inline\">\\alpha_t<\/span> 求导并令其为零：<\/p>\n<div class=\"katex-block\">-e^{-\\alpha_t}(1-\\varepsilon_t)+e^{\\alpha_t}\\varepsilon_t=0\\ \\Rightarrow\\ e^{2\\alpha_t}=(1-\\varepsilon_t)/\\varepsilon_t,<\/div>\n<p>解得 <span class=\"katex-inline\">\\alpha_t=\\frac12\\ln\\frac{1-\\varepsilon_t}{\\varepsilon_t}<\/span>（原书 8.2 节，PDF 第 189 页）。误差率小于 0.5 时 <span class=\"katex-inline\">\\alpha_t&gt;0<\/span>；基学习器越好，权重越大。样本分布按<\/p>\n<div class=\"katex-block\">D_{t+1}(\\mathbf x_i)\\propto D_t(\\mathbf x_i)e^{-\\alpha_t f(\\mathbf x_i)h_t(\\mathbf x_i)}<\/div>\n<p>更新：判对时 <span class=\"katex-inline\">f h=+1<\/span>，指数为负，权重下降；判错时 <span class=\"katex-inline\">f h=-1<\/span>，指数为正，权重上升。归一化因子 <span class=\"katex-inline\">Z_t<\/span> 保证新分布概率和为 1。这个方向不能写反：把判错样本权重调低，后续基学习器会重复漏掉难样本，集成误差无法下降。<\/p>\n<h2>推导二（推演）：k-means 目标函数的单调下降<\/h2>\n<p>固定均值向量 <span class=\"katex-inline\">\\boldsymbol\\mu_i<\/span>，平方误差 <span class=\"katex-inline\">E=\\sum_i\\sum_{\\mathbf x\\in C_i}\\lVert\\mathbf x-\\boldsymbol\\mu_i\\rVert^2<\/span> 对样本分配是逐项独立的：每个样本 <span class=\"katex-inline\">\\mathbf x_j<\/span> 归入使 <span class=\"katex-inline\">\\lVert\\mathbf x_j-\\boldsymbol\\mu_i\\rVert^2<\/span> 最小的簇，分配步骤不会让 <span class=\"katex-inline\">E<\/span> 增大。固定簇划分后，<span class=\"katex-inline\">E<\/span> 对 <span class=\"katex-inline\">\\boldsymbol\\mu_i<\/span> 求导：<span class=\"katex-inline\">\\partial E/\\partial\\boldsymbol\\mu_i=-2\\sum_{\\mathbf x\\in C_i}(\\mathbf x-\\boldsymbol\\mu_i)<\/span>，令其为零得 <span class=\"katex-inline\">\\boldsymbol\\mu_i=\\frac1{|C_i|}\\sum_{\\mathbf x\\in C_i}\\mathbf x<\/span>，即簇内均值；在该簇内，均值使到各样本距离平方和最小，更新步骤也不会让 <span class=\"katex-inline\">E<\/span> 增大。两步交替，<span class=\"katex-inline\">E<\/span> 单调不增且有下界 0，故算法在有限步内收敛到某个局部极小；收敛点依赖初始均值向量，不同初值可能落到不同局部极小。EM 视角下，E 步按后验归属完成簇分配，M 步估计簇均值，迭代结构与高斯混合模型一致。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>去掉属性条件独立假设，直接估计联合条件概率<\/strong>：<span class=\"katex-inline\">P(x_1,\\dots,x_d|c)<\/span> 的组合数随 <span class=\"katex-inline\">d<\/span> 指数增长，样本稀疏使多数组合频率为零；朴素假设用偏差换可估计性，牺牲一点联合结构信息，换取在小样本上能算出概率。\n<\/li><li>\n<strong>Boosting 各轮使用同一份固定样本分布<\/strong>：前序基学习器判错的难样本在后续轮次权重不变，错误被反复犯在同一批样本上；调整分布的作用就是把注意力向后序难样本转移，串行纠正前序偏差。\n<\/li><li>\n<strong>Bagging 把所有基学习器在同一个全量数据集上训练<\/strong>：缺少采样差异，个体学习器高度相似，集成多样性不足；自助采样让各基学习器看到不同样本子集，再结合投票或平均，才能降低方差。\n<\/li><li>\n<strong>k-means 初始均值向量固定取同一点或取在同一簇内<\/strong>：初始偏置会被后续迭代放大，可能把一个真实簇劈成两半，或把两个簇并入一个；算法对初值敏感的具体表现是换一组初始点，最终簇划分与目标函数值都不同。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>贝叶斯概率估计为第 10 章最近邻与度量学习提供后验视角；集成学习的基学习器可选用第 4 章决策树或第 5 章 BP 网络，多样性与准确性的权衡呼应第 2 章偏差-方差分解；聚类是无监督主线，第 10 章降维先压缩特征空间，再在低维空间内度量样本距离。下一章进入降维、特征选择与学习理论：先把投影方向的方差与重构误差推到同一个优化目标，再区分特征选择机制与稀疏正则化，再用 PAC 框架刻画&quot;能不能学、需要多少样本&quot;。<\/p>", "ch04": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.240<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 7–9 章：贝叶斯分类器、集成学习与聚类<\/a><\/span><\/div><h1>第 10–12 章：降维与度量学习、特征选择与稀疏学习、计算学习理论<\/h1>\n<blockquote>对应原书第 10 章降维与度量学习、第 11 章特征选择与稀疏学习、第 12 章计算学习理论（PDF 第 240–306 页；印刷页码 = PDF 页码 − 14）。第 11 章首节印刷第 247 页对应 PDF 第 261 页，第 12 章印刷第 267 页对应 PDF 第 281 页。第 16 章强化学习在本书作为选读延伸（PDF 第 385 页起）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★★ | <strong>前置<\/strong>：ch03（聚类、概率与集成视角）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n从最近重构性与最大可分性两条路径推出 PCA 的同一个优化目标，说清投影方差与重构误差为何等价；\n<\/li><li>\n区分过滤式、包裹式、嵌入式三类特征选择机制的评估对象与计算开销，用几何方式解释 L1 范数为何更易产生稀疏解；\n<\/li><li>\n按 PAC 定义写出可辨识条件，说明误差 ε、置信度 δ、样本复杂度与假设空间复杂度各自约束什么，偏差-方差与奥卡姆剃刀在理论框架中对应哪一层。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>高维数据中大量特征彼此相关，直接计算距离会受噪声维度干扰：PCA 找一组标准正交投影基，使投影后方差最大或重构距离最小，两条推导落到同一组协方差矩阵特征向量；特征选择从原始属性集中挑出相关子集，过滤式先选特征再训练模型，包裹式以学习器交叉验证误差为准则反复训练，嵌入式把选择过程嵌入模型优化；计算学习理论用概率近似正确（PAC）框架回答：什么任务在多少样本下能以多大把握学到误差不超过 ε 的假设。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 降维与最近邻<\/h3>\n<p>原书 10.1 节从最近邻分类器切入：给定测试样本 <span class=\"katex-inline\">\\mathbf x<\/span>，其最近邻样本为 <span class=\"katex-inline\">\\mathbf z<\/span>，分类出错概率是两者类别标记不同的概率（PDF 第 240 页）。在样本独立同分布、任意小邻域内能找到训练样本的假设下，最近邻分类器泛化错误率趋近贝叶斯最优分类器错误率的两倍左右。高维空间中距离度量被无关维度稀释，这是降维与度量学习的动机：把数据压到低维空间，再在低维内做距离比较。<\/p>\n<h3>2. 概念 10：主成分分析 PCA（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。PCA（Principal Components Analysis）有两条等价推导路径：最近重构性要求样本点到投影超平面的距离足够近，最大可分性要求样本在超平面上的投影尽可能分开（原书 10.3 节，PDF 第 244 页）。中心化后假设投影坐标系为标准正交基 <span class=\"katex-inline\">\\{\\mathbf w_1,\\dots,\\mathbf w_d\\}<\/span>，丢弃部分坐标后由低维投影重构原样本；最小化重构距离与最大化投影方差分别得到优化目标，二者通过协方差矩阵的特征值分解等价。实践中常通过奇异值分解代替协方差矩阵的特征值分解（PDF 第 245 页）。<\/p>\n<h3>3. 概念 11：特征选择与稀疏学习（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c11.md\" target=\"_blank\" rel=\"noopener\">概念 c11<\/a>。特征选择（feature selection）从给定属性集合中选出相关特征子集；相关特征（relevant feature）对当前学习任务有用，无关特征（irrelevant feature）没用（原书 11.1 节，PDF 第 261 页）。子集评价可用信息增益衡量特征子集划分与标记划分的差异；选择机制分三类：过滤式（filter）先选特征再训练学习器，选择过程与后续学习器无关；包裹式（wrapper）在特征子集上通过交叉验证估计学习器误差，计算开销大；嵌入式（embedding）把特征选择直接嵌入模型优化过程，决策树划分属性、带 L1 正则的线性模型都属此类（原书 11.2、11.3 节，PDF 第 263、265 页）。稀疏解的额外好处来自范数几何：L1 范数正则化比 L2 更易求得非零分量更少的权重（原书 11.4 节，PDF 第 266 页）。<\/p>\n<h3>4. 概念 12：PAC 学习理论（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c12.md\" target=\"_blank\" rel=\"noopener\">概念 c12<\/a>。计算学习理论（computational learning theory）分析学习任务的困难本质，为算法提供理论保证（原书 12.1 节，PDF 第 281 页）。样本服从隐含未知分布 <span class=\"katex-inline\">\\mathcal D<\/span>，训练样本独立同分布采样。PAC 辨识要求：对 <span class=\"katex-inline\">0&lt;\\varepsilon,\\delta&lt;1<\/span>、所有 <span class=\"katex-inline\">c\\in\\mathcal C<\/span> 和分布 <span class=\"katex-inline\">\\mathcal D<\/span>，算法输出假设 <span class=\"katex-inline\">h<\/span> 满足 <span class=\"katex-inline\">P(E(h)\\le\\varepsilon)\\ge 1-\\delta<\/span>（原书 12.2 节，PDF 第 283 页）。PAC 可学习要求存在多项式规模的样本数 <span class=\"katex-inline\">m<\/span>；样本复杂度（sample complexity）是满足条件所需的最小 <span class=\"katex-inline\">m<\/span>。假设空间复杂度是 PAC 学习的关键因素：候选假设越多，要以高置信度排除坏假设所需样本越多。<\/p>\n<h2>推导一（推演）：从重构距离到协方差特征值<\/h2>\n<p>设数据已中心化 <span class=\"katex-inline\">\\sum_i\\mathbf x_i=0<\/span>，投影基标准正交 <span class=\"katex-inline\">\\mathbf w_j^\\top\\mathbf w_k=0<\/span>、<span class=\"katex-inline\">\\lVert\\mathbf w_j\\rVert=1<\/span>。样本 <span class=\"katex-inline\">\\mathbf x_i<\/span> 在低维坐标 <span class=\"katex-inline\">z_{ij}=\\mathbf w_j^\\top\\mathbf x_i<\/span>，重构 <span class=\"katex-inline\">\\hat{\\mathbf x}_i=\\sum_{j=1}^{d&#x27;}z_{ij}\\mathbf w_j<\/span>。重构距离平方和<\/p>\n<div class=\"katex-block\">\\sum_i\\lVert\\mathbf x_i-\\hat{\\mathbf x}_i\\rVert^2=\\sum_i\\lVert\\mathbf x_i\\rVert^2-2\\sum_{i}\\sum_{j=1}^{d'}z_{ij}\\mathbf w_j^\\top\\mathbf x_i+\\mathrm{const},<\/div>\n<p>利用基的正交性整理，保留与基有关的项 <span class=\"katex-inline\">-\\mathrm{tr}(W^\\top XX^\\top W)<\/span>。最近重构性要求最小化该距离，即在 <span class=\"katex-inline\">W^\\top W=I<\/span> 约束下最大化 <span class=\"katex-inline\">\\mathrm{tr}(W^\\top XX^\\top W)<\/span>。从最大可分性出发，投影方差 <span class=\"katex-inline\">\\sum_i\\lVert W^\\top\\mathbf x_i\\rVert^2=\\mathrm{tr}(W^\\top XX^\\top W)<\/span>，最大化投影方差得到同一目标。对 <span class=\"katex-inline\">XX^\\top<\/span> 做特征值分解，最大 <span class=\"katex-inline\">d&#x27;<\/span> 个特征值对应的特征向量即主成分方向（原书 10.3 节，PDF 第 244–245 页）。<\/p>\n<h2>推导二（推演）：L1 与 L2 正则化的几何对照<\/h2>\n<p>带正则项的线性回归目标为 <span class=\"katex-inline\">E=\\sum_i(\\mathbf w^\\top\\mathbf x_i-y_i)^2+\\lambda\\lVert\\mathbf w\\rVert_q^q<\/span>。二维情形画出损失等值线与正则区域：L2 正则区域是圆 <span class=\"katex-inline\">\\omega_1^2+\\omega_2^2\\le r^2<\/span>，等值线与圆周相切通常落在坐标轴外的点，两个分量一般都非零；L1 正则区域是菱形 <span class=\"katex-inline\">|\\omega_1|+|\\omega_2|\\le r<\/span>，角点落在坐标轴上，损失等值线碰到角点时一个分量被压成零。这就是 L1 更易产生稀疏解的几何原因：菱形的棱与角提供了落在坐标轴上的切点，圆形边界没有这样的尖角。L0 范数要求非零分量最少，但不连续、难以优化，实践中常用 L1 范数近似（原书 11.4 节，PDF 第 266 页）。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>PCA 不要求投影基标准正交，允许方向任意相关<\/strong>：主成分方向之间信息重复，同一方差被多个基反复计入，低维坐标不是数据的互不相关压缩；正交约束保证选出的方向各占一块互不重叠的方差。\n<\/li><li>\n<strong>特征选择只用过滤式、完全不看后续学习器<\/strong>：特征与标记的边际相关性高，不等于在具体模型里组合起来有效；过滤式开销低但可能丢掉对某模型关键的弱相关特征。反过来纯包裹式每个候选子集都要交叉验证训练，特征数多时计算量随子集组合爆炸。\n<\/li><li>\n<strong>假设空间无限大或不限定候选假设范围<\/strong>：PAC 意义下要以 <span class=\"katex-inline\">1-\\delta<\/span> 概率排除所有坏假设，候选假设越多所需样本量越大；若空间包含与训练集一致的任意假设，理论上无法保证泛化。奥卡姆剃刀在理论层面对应：在拟合能力相当的假设中优先选择更简单的，降低过拟合风险。\n<\/li><li>\n<strong>把降维当成去掉噪声的万能手段<\/strong>：PCA 保留方差最大的方向，方差大不等于判别信息强；两类样本可能沿方差小的方向分开，保留主成分后判别方向被丢掉。降维前后仍需回到第 2 章的独立测试集上评估分类性能。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章收束全书理论线索：PCA 压缩后的低维空间可直接喂给第 9 章 k-means 聚类；嵌入式特征选择与第 3 章线性模型、第 4 章决策树的属性选择相互对应；PAC 框架为前面所有模型的泛化保证提供理论语言。第 13–16 章（半监督、概率图模型、规则学习、强化学习）是在这套基础上的扩展：强化学习在环境交互中按回报调整策略，属于本书选读内容（PDF 第 385 页起）。<\/p>", "c01": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/人工智能/机器学习/机器学习 (周志华-(书签带目录)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.39<\/div><h1>经验误差、过拟合与模型评估：错误率、P/R/F1、ROC-AUC、交叉验证与偏差-方差<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：原书第 2 章模型评估与选择（PDF 第 37–62 页；印刷页码 = PDF 页码 − 14）\n<\/ul>\n<h2>问题：这个概念要解决什么困难<\/h2>\n<p>模型在训练数据上表现好，不等于在新样本上表现好。若只凭训练集表现挑模型，把训练样本自身噪声背下来的过拟合模型会被误选出来。评估环节要解决的困难是：在不知道新样本分布的前提下，如何用手头数据估计模型的泛化性能，并在多个模型或多组超参数之间做出有依据的选择。没有独立于训练过程的评估口径，后面所有损失优化、结构调整都缺少验收标准。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>误差（error）<\/strong>：学习器实际预测输出与样本真实输出之间的差异。训练集上的误差称训练误差（training error）或经验误差（empirical error），新样本上的误差称泛化误差（generalization error）（原书 2.1 节，PDF 第 37 页）。<\/p>\n<p><strong>过拟合与欠拟合<\/strong>：学习器把训练样本自身特点当成所有潜在样本的一般性质，导致泛化性能下降，称过拟合（overfitting）；对训练样本一般规律尚未学好，称欠拟合（underfitting）。<\/p>\n<p><strong>混淆矩阵四项<\/strong>：二分类任务中，<span class=\"katex-inline\">TP<\/span> 真正例、<span class=\"katex-inline\">FP<\/span> 假正例、<span class=\"katex-inline\">TN<\/span> 真反例、<span class=\"katex-inline\">FN<\/span> 假反例，四项之和等于样例总数（原书 2.3.2 节，PDF 第 44 页）。<\/p>\n<p><strong>查准率与查全率<\/strong>：<span class=\"katex-inline\">P=TP/(TP+FP)<\/span>，<span class=\"katex-inline\">R=TP/(TP+FN)<\/span>。F1 取调和平均 <span class=\"katex-inline\">F_1=2PR/(P+R)<\/span>；一般形式 <span class=\"katex-inline\">F_\\beta<\/span> 用 <span class=\"katex-inline\">\\beta<\/span> 调节查全率相对查准率的重要性。<\/p>\n<p><strong>ROC 与 AUC<\/strong>：纵轴真正例率 <span class=\"katex-inline\">TPR=TP/(TP+FN)<\/span>，横轴假正例率 <span class=\"katex-inline\">FPR=FP/(FP+TN)<\/span>；AUC 是 ROC 曲线下面积，含义为随机取一正一反两样本时正例得分高于反例的概率（原书 2.3.3 节，PDF 第 47–48 页）。<\/p>\n<p><strong>划分途径<\/strong>：留出法把数据拆训练集与测试集；<span class=\"katex-inline\">k<\/span> 折交叉验证把数据折成 <span class=\"katex-inline\">k<\/span> 份轮流测试；自助采样有放回抽样，约 63.2% 样本进入采样集。<\/p>\n<p><strong>偏差-方差<\/strong>：泛化误差可拆为偏差、方差与噪声。偏差刻画模型假设与真实规律的差距，方差刻画训练集扰动带来的预测波动（原书 2.6 节，PDF 第 40 页前后）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>给定混淆矩阵：<span class=\"katex-inline\">TP=8<\/span>，<span class=\"katex-inline\">FP=2<\/span>，<span class=\"katex-inline\">FN=4<\/span>，<span class=\"katex-inline\">TN=16<\/span>，总样本 30。查准率 <span class=\"katex-inline\">P=8/(8+2)=0.800<\/span>；查全率 <span class=\"katex-inline\">R=8/(8+4)\\approx0.667<\/span>；F1 <span class=\"katex-inline\">=2\\times0.800\\times0.667/(0.800+0.667)\\approx0.727<\/span>。准确率 <span class=\"katex-inline\">=(8+16)/30=0.800<\/span>。<\/p>\n<p>ROC 估算：测试样本按预测得分排序，阈值从高到低移动，每纳入一个真正例纵坐标上跳 <span class=\"katex-inline\">1/(TP+FN)<\/span>，每纳入一个假正例横坐标右跳 <span class=\"katex-inline\">1/(FP+TN)<\/span>。相邻点 <span class=\"katex-inline\">(x_1,y_1)<\/span>、<span class=\"katex-inline\">(x_2,y_2)<\/span> 之间梯形面积为 <span class=\"katex-inline\">(y_1+y_2)(x_2-x_1)/2<\/span>，累加即近似 AUC。AUC=1 对应理想排序，0.5 对应随机猜测。<\/p>\n<p>交叉验证的偏差与方差：训练集占比大则模型更接近全量训练结果，但测试集小、评估方差大；测试集大则保真性下降。<span class=\"katex-inline\">k<\/span> 折平均用 <span class=\"katex-inline\">k<\/span> 次评估平滑单次划分的偶然性；测试集规模过小，评估结果本身波动剧烈。<\/p>\n<h2>适用条件、边界与失败案例<\/h2>\n<ul><li>\n<strong>适用条件<\/strong>：混淆矩阵口径要求类别可二分为正例/反例；P/R/F1 依赖固定截断点，ROC/AUC 考察全排序；交叉验证假设样本独立同分布。\n<\/li><li>\n<strong>失败案例一：类别不平衡时只看准确率<\/strong>。反例占多数时全部判反例也能得到高准确率，但模型正例识别能力为零；此时应看 R、F1 或 AUC。\n<\/li><li>\n<strong>失败案例二：把 AUC 当准确率<\/strong>。准确率是固定截断点上判对比例，AUC 是排序胜率；两者数值接近纯属巧合，比较模型时口径必须一致。\n<\/li><li>\n<strong>失败案例三：测试集与训练集来自不同采集条件<\/strong>。分布不一致时评估指标
