舍，以及状态空间很大时的策略表示。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>强化学习<\/strong>研究 Agent 根据环境反馈的奖励与惩罚改变策略，以期获得长期最大奖励。逐句拆：<\/p>\n<ul><li>\n<strong>Agent<\/strong>：做动作的主体；\n<\/li><li>\n<strong>环境<\/strong>：接受动作、返回状态与奖励的外部世界；\n<\/li><li>\n<strong>奖励/惩罚<\/strong>：环境对动作的评价信号；\n<\/li><li>\n<strong>策略<\/strong>：Agent 在给定状态下选择动作的规则；\n<\/li><li>\n<strong>长期最大奖励<\/strong>：优化目标不是单步收益，而是累计回报。\n<\/ul>\n<h2>推导<\/h2>\n<p>理论基础两块：马尔可夫决策过程（MDP）提供状态、动作、转移概率与回报的决策模型；动态规划来自贝尔曼 1950 年代的工作，巴托与萨顿承认早期受到它的启发（PDF 第 130 页）。人物线：巴托 1975 年到马萨诸塞大学任教，萨顿是他第一个博士生，两人形成关于学习的第一性原理（PDF 第 128–130 页）。思想源头可追到图灵 1948 年内部报告《智能机器》：P 型机只接受“快乐”“痛苦”刺激，即奖励与惩罚；明斯基 1954 年博士论文也关于强化学习（PDF 第 131 页）。工程标志：Q-Learning 由沃科金斯 1989 年剑桥大学博士论文提出（PDF 第 138 页）。核心张力：探索（尝试未知动作获取信息）与利用（选取当前最优动作）的权衡，用学习率 <span class=\"katex-inline\">\\varepsilon<\/span> 调节（PDF 第 132 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：任务可建模为状态—动作—奖励的序列决策，规则在短期内稳定，回报可累积度量。边界：奖励设计不当会学到偏离目标的策略；延迟奖励导致信用分配困难；状态空间很大时需要神经网络做函数逼近。条件去掉会怎样：去掉奖励信号，Agent 无从判断动作好坏；去掉长期回报目标，就退化成单步判断，不是强化学习。<\/p>\n<h2>反例<\/h2>\n<p>游戏只是早期环境容易定义的试验场，不是强化学习的全部；本书记载其后续也进入芯片布局、蛋白质折叠等固定规则场景（PDF 第 134–135 页）。另一个反例提醒：强化学习早期并未成为主流，2016 年 AlphaGo 击败李世石后才一夜成名；DeepMind 团队中有萨顿四名学生，首席科学家席尔瓦是萨顿大弟子，2017 年 7 月 DeepMind 在阿尔伯塔大学设联合实验室（PDF 第 132–133 页）。路线落地依赖算法理论与工程环境同时成熟。<\/p>\n<h2>辨析<\/h2>\n<p>与监督学习的差别：监督学习立刻得到对错标签，强化学习只得到延迟奖励；与进化算法的差别：遗传算法在种群层面做选择交叉变异，强化学习在个体策略上做反馈调整；两者都属“向自然学习”。与反向传播的关系：深度强化学习用神经网络逼近价值函数或策略，反向传播是其训练工具之一。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：图灵机（c09）给出可计算装置底座；连接主义（c04）提供函数逼近手段。后继：下棋系统（书中第 7 章）是强化学习最早工业级应用；所罗门诺夫归纳（c08）在算法信息论框架内把强化学习解释为在线学习。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（强化学习）<\/summary><div class=\"depth-body\"><h1>强化学习 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>倒查强化学习成立需要哪些前置：<\/p>\n<ol><li>\n序列决策模型：状态、动作、转移概率与回报可形式化，这就是马尔可夫决策过程（MDP）。\n<\/li><li>\n优化方法基础：贝尔曼 1950 年代动态规划提供多步决策的递推思路（PDF 第 130 页）。\n<\/li><li>\n反馈观念：图灵 1948 年《智能机器》内部报告里的 P 型机，只接受快乐、痛苦刺激，即奖励与惩罚（PDF 第 131 页）。\n<\/li><li>\n再往前的问题：监督学习给不出示范的任务，只能靠好坏反馈调整行为。\n<\/ol>\n<p>逆推基线：先认“动作影响后续状态”，再认“反馈可评价策略”，最后认“长期回报最大化为学习目标”。<\/p>\n<h2>正向推导<\/h2>\n<p>按理论、人物、工程、张力推进：<\/p>\n<ul><li>\n第一步，理论框架。MDP 把任务拆成状态—动作—转移—回报；动态规划提供多步决策递推。巴托与萨顿承认早期受动态规划启发（PDF 第 130 页）。依据：序列决策可在数学上形式化。\n<\/li><li>\n第二步，人物与第一性原理。巴托 1975 年到马萨诸塞大学任教，萨顿是他第一个博士生；两人形成关于学习的第一性原理，把目标制导称为奖励假设（Reward is enough）：以长期奖励最大化为目标的学习足以解释智能行为（PDF 第 128–131 页）。\n<\/li><li>\n第三步，思想源头。图灵 1948 年 P 型机以快乐/痛苦为输入；明斯基 1954 年博士论文也关于强化学习（PDF 第 131 页）。这说明奖励反馈观念早于 AI 学科名称。\n<\/li><li>\n第四步，工程算法。Q-Learning 由沃科金斯 1989 年剑桥大学博士论文提出（PDF 第 138 页）。核心张力是探索与利用：抬头看路尝试未知动作获取信息，低头拉车选取当前最优动作；学习率 <span class=\"katex-inline\">\\varepsilon<\/span> 调节二者权衡（PDF 第 132 页）。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：强化学习理论在 1980–90 年代已成形，2016 年 AlphaGo 击败李世石后才一夜成名；DeepMind 团队有萨顿四名学生，首席科学家席尔瓦是萨顿大弟子，2017 年 7 月在阿尔伯塔大学设联合实验室（PDF 第 132–133 页）。\n<\/li><li>\n史料：萨顿 2019 年《The Bitter Lesson》主张通用算法加增长算力自然提升智能；当下 Scaling Law 思路源于这一立场（PDF 第 133 页）。\n<\/li><li>\n推断：从理论到显学的间隔，条件是封闭规则任务出现、深度网络提供状态表示与策略逼近能力；游戏之所以先成为试验场，是因为规则固定、回报明确、环境可重复交互。这一条件归纳是推断，原书未做分层归因。\n<\/li><li>\n必然还是偶然：奖励反馈作为学习原则在控制论与心理学里早有雏形；AlphaGo 时点由围棋项目进度、人才聚集与工程环境共同决定，带有偶然性。\n<\/ul>\n<p>推导保留的限定：强化学习理论在 1980–90 年代已成形，成为显学仍要等到工业任务与工程环境成熟。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，下棋落地。2016 年 AlphaGo 击败李世石，强化学习作为核心算法一夜成名；DeepMind 团队有萨顿四名学生，席尔瓦是萨顿大弟子；2017 年 7 月 7 日 DeepMind 在阿尔伯塔大学开办联合实验室，是英国以外第一个研究机构（PDF 第 132–133 页）。案例二，任务外推。强化学习不只用于游戏，后续进入芯片布局、蛋白质折叠等固定规则场景（PDF 第 134–135 页）。案例三，路线哲学。萨顿《The Bitter Lesson》的立场是：通用算法加增长算力会持续胜过手工知识（PDF 第 133 页）。<\/p>\n<p>案例四，算力对照（数字史料 + 量级推断）。遗传编程路线在 1999 年由寇扎搭建 1000 个节点的 Pentium II 集群，软硬件统称 Beowulf，是 Hadoop 与 Spark 的先驱（PDF 第 125 页）；同期强化学习实验受限于单机或小规模并行环境。两组记录共同说明：1980–90 年代学习类算法的实验规模以单实验室设备为界，2010 年代后才跨入集群与大规模数据阶段。具体训练回合数与样本量原书未给，只做代际量级对照，不补造数字。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：把强化学习等同于打游戏是窄化。游戏只是早期环境易定义的试验场，理论骨架是 MDP、动态规划与奖励假设。反例二：奖励设计不当会学到偏离目标的策略；延迟奖励导致信用分配困难，这是强化学习区别于监督学习的固有难点。边界条件：任务可建模为状态—动作—奖励、规则短期稳定、回报可累积度量；去掉奖励信号，动作好坏无从判断；去掉长期回报目标，退化为单步判断。与进化算法的差别：遗传算法在种群层选择交叉变异，强化学习在个体策略上反馈调整。<\/p>\n<h2>史料补充<\/h2>\n<p>强化学习的思想源头在 AI 学科成形之前：图灵 1948 年《智能机器》内部报告提出只受快乐、痛苦刺激的 P 型机；明斯基 1954 年博士论文题目与强化学习有关；巴托与萨顿的师承链条是 1975 年巴托到马萨诸塞大学任教，萨顿成为他第一个博士生（PDF 第 128、131 页）。算法端，Q-Learning 出自沃科金斯 1989 年剑桥大学博士论文；工程端，DeepMind 与阿尔伯塔大学 2017 年 7 月 7 日开设联合实验室，首席科学家席尔瓦是萨顿大弟子（PDF 第 133、138 页）。与遗传编程的分工要分清：遗传算法在种群层做选择、交叉、变异；强化学习在单个策略上按奖励反馈调整动作，两者都用搜索逼近优化目标，但反馈层级不同（PDF 第 124–125、132 页）。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：强化学习是为打游戏发明的。<\/strong> 反证：理论骨架来自 MDP 与动态规划，思想源头可追到图灵 1948 年 P 型机与明斯基 1954 年博士论文；游戏只是最先落地的试验场（PDF 第 130–131 页）。\n<\/li><li>\n<strong>误读：强化学习每一步都能立刻得到对错标签。<\/strong> 反证：延迟奖励与信用分配是它的固有难点，行动的好坏要等多步之后才显现；这与监督学习的即时反馈不同（PDF 第 132 页）。\n<\/li><li>\n<strong>误读：奖励假设等于“唯奖励论”，否定其他学习机制。<\/strong> 反证：奖励假设是把目标制导作为统一视角；本书框架后来把监督学习、在线学习都放进归纳框架内解释，并未取消其他学习形态（PDF 第 131、218 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\nMDP 由哪些要素构成？动态规划在强化学习理论中提供了什么？\n<\/li><li>\n奖励假设主张什么？巴托与萨顿的师承关系是怎样的？\n<\/li><li>\n探索与利用各自指什么？<span class=\"katex-inline\">\\varepsilon<\/span> 在权衡中起什么作用？\n<\/li><li>\nQ-Learning 出自哪一年谁的学位论文？\n<\/li><li>\n为什么说游戏不是强化学习的全部？举出书中记载的其他应用方向。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "强化学习"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.167<\/div><h1>统计 NLP、词嵌入与 Transformer<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6–8 章\n<\/ul>\n<h2>问题<\/h2>\n<p>早期自然语言处理靠人工写语法规则，但规则永远追不上真实语料的变体。待解决的困难是：不逐条书写语法，能否从平行语料与统计规律中获得翻译、对齐与表示能力；进一步，怎样把词变成可计算的表示，并用合适架构处理长序列。<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n<strong>统计自然语言处理<\/strong>：用平行语料与概率模型替代人工语法规则，估计语言单元之间的搭配与转移概率。\n<\/li><li>\n<strong>词嵌入（word embedding）<\/strong>：把词表示成向量，让词义相近的词在向量空间中靠近。\n<\/li><li>\n<strong>Transformer<\/strong>：2017 年谷歌团队提出、基于注意力机制的序列架构，解除训练并行性限制（PDF 第 116、170 页）。\n<\/ul>\n<h2>推导<\/h2>\n<p>规则阶段：乔姆斯基句法理论代表规则语言学，文法层次与自动机等价；1953–1954 年 IBM 资助乔治敦大学做首次机器翻译实验，1964 年政府评估结论是机器翻译短期无法实用（PDF 第 149–150 页）。统计阶段：1988 年 IBM Thomas J. Watson 中心发表统计机器翻译论文，推出法英系统 CANDIDE，标志统计派在大数据支持下回潮；贾里尼克一派以信息论为训练背景，成员寇克 1987 年因 RISC 获图灵奖（PDF 第 167 页）。表示层：辛顿 1980 年代后期的词分布式表示工作引入词向量概念，2013 年谷歌 word2vec 率先工程实现词嵌入，2016 年 GNMT 取代统计翻译、误差降低约 60%（PDF 第 169 页）。架构层：2017 年 Transformer 基于注意力机制；谷歌走 BERT（Encoder-only，双向掩码），OpenAI 走 GPT（Decoder-only，单向 next token prediction）；GPT-3 于 2020 年问世，2022 年 11 月 30 日 ChatGPT 出现（PDF 第 170–171 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：有足够规模的语料与平行文本，计算资源可支撑概率模型或网络训练。边界：统计方法不解释语言结构为什么如此，只给数据上的描述；深度模型内部表示难以逐条归因。条件去掉会怎样：去掉语料规模，统计与嵌入都失去原料；去掉注意力机制，长序列的并行训练与长程依赖处理受限。<\/p>\n<h2>反例<\/h2>\n<p>规则派并未被证明错误，而是被成本压过：乔姆斯基批评端到端 NLP 结果无法解释，辛顿则批评乔姆斯基理性主义、主张数据驱动学习（PDF 第 183 页）。另一个边界案例：早期统计翻译不需要工程师懂源语言或目标语言，但这并不等于语言学问题消失，只是被推后到模型内部表示里。<\/p>\n<h2>辨析<\/h2>\n<p>BERT 与 GPT 的差别在预测方式：BERT 双向掩码猜被遮住的词，GPT 单向续写；Transformer 是二者共用的底层架构，不是理论本身。统计 NLP 与深度学习的差别：前者靠概率模型与特征，后者靠神经网络表示与序列架构。与强化学习的差别：NLP 主体是监督/自监督序列预测，强化学习处理序列决策与奖励。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：反向传播与多层网络（c05）提供训练手段；图灵机（c09）提供可计算底座。后继：所罗门诺夫归纳（c08）为 next token prediction 提供理论前身；强化学习（c06）后来用于大模型对齐。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（统计 NLP、词嵌入与 Transformer）<\/summary><div class=\"depth-body\"><h1>统计 NLP、词嵌入与 Transformer · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>倒查这条线需要哪些前置：<\/p>\n<ol><li>\n规则语言学先存在：乔姆斯基句法理论给出文法层次，文法与自动机等价（PDF 第 150–154 页）。\n<\/li><li>\n早期机器翻译失败记录：1953–1954 年 IBM 资助乔治敦大学首次实验，1964 年政府评估判定短期不可实用（PDF 第 149–150 页）。\n<\/li><li>\n概率工具：信息论提供语言单元搭配与转移概率的估计框架。\n<\/li><li>\n再往后，多层网络与训练手段成熟，词嵌入与序列架构才有承载物（见 c05）。\n<\/ol>\n<p>逆推基线：先认“规则追不上语料变体”，再认“概率可从语料估计”，最后认“词可变成向量、序列可被架构建模”。<\/p>\n<h2>正向推导<\/h2>\n<p>按范式阶段推进，每步标明证据：<\/p>\n<ul><li>\n第一步，规则阶段。乔姆斯基 1928 年生，句法分层与自动机对应：3 型文法等价有限自动机，1 型文法等价线性有界非确定图灵机，0 型文法等价图灵机；他认为语言结构内在、非经验习得，不认可统计方法（PDF 第 150–154 页）。依据：规则派追求解释语言结构。\n<\/li><li>\n第二步，统计阶段。1988 年 IBM Thomas J. Watson 研究中心发表统计机器翻译论文，推出法英系统 CANDIDE，标志统计派在大数据支持下回潮；贾里尼克一派以信息论为训练背景，成员寇克 1987 年因 RISC 获图灵奖（PDF 第 167 页）。依据：平行语料加概率模型可完成翻译对齐，工程师不必懂源语言与目标语言。\n<\/li><li>\n第三步，表示阶段。辛顿 1980 年代后期词分布式表示工作引入词向量概念；2013 年谷歌 word2vec 率先工程实现词嵌入；2016 年 GNMT 取代统计翻译，误差降低约 60%（PDF 第 169 页）。依据：词义可在向量空间中按距离组织。\n<\/li><li>\n第四步，架构阶段。2017 年谷歌 Transformer 基于注意力机制，解除训练并行性限制；谷歌 BERT 走 Encoder-only 双向掩码，OpenAI GPT 走 Decoder-only 单向 next token prediction；GPT-3 2020 年问世，2022 年 11 月 30 日 ChatGPT 出现（PDF 第 170–171 页）。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：规则阶段存续约 40 年，统计与浅层学习约 20 年，深度学习不到 10 年，大模型准备期约 5 年，阶段时长逐渐缩短（PDF 第 7、171 页）。\n<\/li><li>\n史料：2016 年 GNMT 取代上一代统计翻译，误差降低约 60%；同期沃森硬件为 90 台 IBM Power 750、720 核、2880 线程、16TB 内存、成本 300 万美元（PDF 第 169 页）。\n<\/li><li>\n推断：范式切换的共同条件是语料规模扩大与计算资源到位；规则路线的解释诉求并未被驳倒，只是在规模成本上被压过。这一条件归纳基于书中记录做推断。\n<\/li><li>\n必然还是偶然：统计与深度学习先后替代规则，有语料与工具成熟的必然性；Transformer 2017 年出现的具体时点与谷歌团队研究进度有关，带有偶然性。\n<\/ul>\n<p>推导保留的限定：范式切换是成本与条件驱动，不是规则派被证明错误；统计与深度模型也未解决可解释性问题。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，CANDIDE。1988 年 IBM 小组法英统计翻译系统，是统计路线回潮的标志（PDF 第 167 页）。案例二，词嵌入落地。word2vec 2013 年由谷歌实现，把词分布式表示变成可用工程对象；GNMT 2016 年神经翻译系统取代上一代统计翻译（PDF 第 169 页）。案例三，路线分野。BERT 抽走序列中 <span class=\"katex-inline\">x_i<\/span> 猜 <span class=\"katex-inline\">x_i<\/span>，双向；GPT 单向续写；Transformer 是共用底层架构（PDF 第 170、215 页）。案例四，评价对照：乔姆斯基批评端到端 NLP 结果无法解释，辛顿批评乔姆斯基理性主义、主张数据驱动（PDF 第 183 页）。<\/p>\n<p>案例五，硬件与效果量级（数字史料）。沃森系统 90 台 Power 750、720 核、2880 线程、16TB 内存、成本 300 万美元；按摩尔定律，2017 年同等算力约 20 万美元，2025 年不到 2 万美元（PDF 第 169 页）。GNMT 相对统计翻译误差降约 60%（PDF 第 169 页）。两组数字说明：翻译能力提升建立在可获得的算力与语料之上；具体模型参数量、训练 token 数原书未给，不做补造。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：统计方法不需要语言学知识，不等于语言学问题消失；它被推后到模型内部表示，可解释性争议仍在。反例二：规则派没有被驳倒，只是在规模成本上被压过；其解释诉求在大模型时代仍被提出。边界条件：语料规模、计算资源、序列架构三者齐备；去掉语料，统计与嵌入失去原料；去掉注意力机制，长序列并行训练与长程依赖处理受限。与强化学习的差别：NLP 主体是监督/自监督序列预测，强化学习处理序列决策与奖励。<\/p>\n<h2>史料补充<\/h2>\n<p>本书划分的 NLP 阶段时长：规则阶段约 40 年，统计与浅层学习约 20 年，深度学习不到 10 年，大模型准备期约 5 年；阶段时长缩短本身说明语料规模与工程条件在替换研究范式（PDF 第 171 页）。沃森案例提供中间对照：2011 年问答机沃森 90 台 Power 750、720 核、2880 线程、16TB 内存、成本 300 万美元，答案 95% 来自维基百科（PDF 第 168–169 页）。翻译线上，2016 年谷歌 GNMT 取代上一代统计翻译，误差降约 60%；模型架构上，2017 年 Transformer 解除训练并行性限制，word2vec 2013 年先行实现词嵌入（PDF 第 116、169 页）。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：NLP 进步是语言学理论被一步步证明正确。<\/strong> 反证：本书把阶段划分为规则、统计、深度学习、大模型准备期，路线切换主要由语料规模与工程条件驱动；规则派的解释诉求至今仍在争议中（PDF 第 171、183 页）。\n<\/li><li>\n<strong>误读：BERT 与 GPT 的差别只是训练语料。<\/strong> 反证：核心差别在预测方式——双向掩码猜词 vs 单向续写；Transformer 只是共用架构（PDF 第 170、215 页）。\n<\/li><li>\n<strong>误读：统计翻译系统必须先懂两门语言。<\/strong> 反证：贾里尼克一派的工程好处就是工程师不必具备语言学知识、不必懂源语言与目标语言，模型从平行语料估计搭配概率（PDF 第 167 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n乔姆斯基文法层次与自动机如何对应？他对统计方法持什么立场？\n<\/li><li>\nCANDIDE 是哪一年、哪个机构、什么语言对的统计翻译系统？\n<\/li><li>\nword2vec 与 GNMT 分别是哪一年的工作？词嵌入把词义组织在什么空间里？\n<\/li><li>\nBERT 与 GPT 的预测方式差别在哪？Transformer 在其中是什么位置？\n<\/li><li>\n为什么说范式切换是成本驱动，而不是规则派被证明错误？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "统计 NLP、词嵌入与 Transformer"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.206<\/div><h1>所罗门诺夫归纳与算法信息论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 9–11 章\n<\/ul>\n<h2>问题<\/h2>\n<p>大语言模型靠“预测下一个词”获得能力，但工程实践背后需要一条理论解释：为什么在大量序列上预测下一个元素，会概括出语言规律甚至世界知识？待解决的困难是：把归纳推理写成可计算框架——给定已有序列，凭什么相信某个续写；什么叫对序列最经济的概括。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>所罗门诺夫归纳法<\/strong>：给定已知序列 <span class=\"katex-inline\">(x_1,\\dots,x_n)<\/span>，预测 <span class=\"katex-inline\">x_{n+1}<\/span>；找编码长度最短、能为已知序列建模的图灵机程序，据此预测后续元素（PDF 第 206 页）。逐句拆：<\/p>\n<ul><li>\n“最短程序”：描述序列所用程序越短，概括越强；\n<\/li><li>\n“可生成序列”：程序必须能输出已知数据，而不只是拟合；\n<\/li><li>\n“先验概率”：程序越短，先验概率越高，随长度增加而指数衰减；\n<\/li><li>\n“归纳”：从已有数据推未知续写，不是演绎证明。\n<\/ul>\n<h2>推导<\/h2>\n<p>人物线：所罗门诺夫 1951 年在芝加哥大学受卡尔纳普影响，归纳推理成为毕生方向；1956 年达特茅斯整个暑假在会，1956 年 8 月 14 日传阅打字稿；工作首次发表于 1960 年加州理工会议，1964 年《A Formal Theory of Inductive Inference》刊于《信息与控制》（PDF 第 201、204–206 页）。理论链：序列的描述复杂度即输出该序列的最短图灵机程序长度；所罗门诺夫、柯尔莫哥洛夫、蔡汀各自独立提出，合称 SKC 复杂性（所罗门诺夫-柯尔莫哥洛夫-蔡汀复杂性），也称算法熵、描述复杂性（PDF 第 208–210 页）。与工程的对应：这正是 GPT 核心机制 next token prediction 的理论前身；能概括已知数据的图灵机就是大模型；学习可被当作压缩，神经网络是通用逼近器候选（PDF 第 207 页）。2023 年 8 月伊利亚·苏茨克维在赛蒙斯计算理论研究所演讲确认：GPT 的数学依据就是所罗门诺夫归纳法（PDF 第 216、219 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：把数据看作可由程序生成的序列，接受“概括越短越可信”的奥卡姆原则。边界：所罗门诺夫归纳可能不停机，只能用近似算法放宽最小性与预测准确性；SKC 复杂性普遍不可计算，工程上用贝叶斯概率近似（PDF 第 207、218 页）。条件去掉会怎样：去掉最短程序原则，就退化为任意内插，没有选择续写的标准；去掉不可计算这一限制，理论会给出通用最优归纳器，现实中不存在。<\/p>\n<h2>反例<\/h2>\n<p>研究停滞近二十年，最终实现所罗门诺夫归纳的恰是神经网络（PDF 第 204 页）——理论先于工程，但工程直到数据、算力、网络结构齐备才落地。另一个反例边界：列文在柯尔莫哥洛夫复杂性基础上加时间限制提出 L-search 通用搜索，复杂性才变得可计算（PDF 第 212–213 页）；纯所罗门诺夫框架本身不能直接上机。<\/p>\n<h2>辨析<\/h2>\n<p>与香农信息论的差别：香农熵度量消息的统计不确定性，不要求找生成程序；SKC 复杂性度量描述长度，把信息论建立在可计算理论之上（PDF 第 211 页）。与统计 NLP 的差别：统计模型估计搭配概率，不追问最短程序；所罗门诺夫归纳给预测提供第一性原理解释。与反向传播的差别：反向传播是训练机制，归纳框架是目标与学习观，二者不在同一层。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：图灵机与丘奇-图灵论题（c09）提供“程序生成序列”的装置底座；词嵌入与 Transformer（c07）是工程实现。后继：强化学习（c06）被解释为框架内的在线学习；BERT/GPT 的预测方式分野在同一框架内比较。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（所罗门诺夫归纳与算法信息论）<\/summary><div class=\"depth-body\"><h1>所罗门诺夫归纳与算法信息论 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>倒查这条理论线需要哪些前置：<\/p>\n<ol><li>\n图灵机概念：生成序列的程序必须有可计算载体（见 c09，PDF 第 184 页）。\n<\/li><li>\n归纳推理问题：从已有序列推未知续写，需要一条选择候选续写的标准。\n<\/li><li>\n奥卡姆原则：概括越短越可信，作为先验排序依据。\n<\/li><li>\n更早的信息论：香农熵度量统计不确定性；算法信息论要把信息建立在可计算理论之上（PDF 第 211 页）。\n<\/ol>\n<p>逆推基线：先认“数据可由程序生成”，再认“最短程序是最好概括”，最后认“预测下一项就是归纳”。<\/p>\n<h2>正向推导<\/h2>\n<p>按人物、理论、工程对应三步推进：<\/p>\n<ul><li>\n第一步，人物与发表。所罗门诺夫 1951 年在芝加哥大学跟随卡尔纳普，归纳推理成为毕生方向；1956 年达特茅斯整个暑假在会，1956 年 8 月 14 日传阅打字稿；首次公开发表于 1960 年加州理工会议，1964 年《A Formal Theory of Inductive Inference》刊于《信息与控制》（PDF 第 201、204–206 页）。依据：归纳问题可形式化为序列预测。\n<\/li><li>\n第二步，理论构造。给定 <span class=\"katex-inline\">(x_1,\\dots,x_n)<\/span> 预测 <span class=\"katex-inline\">x_{n+1}<\/span>：找编码长度最短、能为已知序列建模的图灵机程序；程序越短先验概率越高，随长度增加指数衰减；序列描述复杂度即输出该序列的最短程序长度（PDF 第 206 页）。柯尔莫哥洛夫 1965 年提出同名复杂性，1968 年起引用所罗门诺夫；蔡汀独立确认柯尔莫哥洛夫工作；三人合称 SKC 复杂性（PDF 第 208–210 页）。\n<\/li><li>\n第三步，工程对应。这正是 GPT 核心机制 next token prediction 的理论前身；能概括已知数据的图灵机就是大模型；学习可被当作压缩，神经网络作为通用逼近器是候选实现（PDF 第 207 页）。2023 年 8 月伊利亚·苏茨克维在赛蒙斯计算理论研究所演讲确认：GPT 的数学依据是所罗门诺夫归纳法（PDF 第 216、219 页）。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：所罗门诺夫工作 1956 年已成稿，研究停滞近二十年，最终实现归纳机制的恰是神经网络（PDF 第 204 页）。\n<\/li><li>\n史料：SKC 复杂性普遍不可计算，最优压缩不存在通用算法，工程上用贝叶斯概率近似；列文加时间限制提出 L-search，搜索才可计算（PDF 第 212–213、218 页）。\n<\/li><li>\n推断：理论早于工程的间隔，条件是通用逼近装置、规模数据与算力都未就绪；不可计算这一环不会因时间提前而消失，工程只能走近似路线。这一条件归纳是推断，原书未做三因素分解。\n<\/li><li>\n必然还是偶然：把归纳写成最短程序排序，在可计算观念成熟后是可预期的方向；神经网络成为实现载体，与 2010 年代后的工程环境有关，带有偶然性。\n<\/ul>\n<p>推导保留的限定：归纳框架普遍不可计算，工程只能近似；理论暂时落后于工程实践。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，发表链。1956 年打字稿 → 1960 年加州理工会议 → 1964 年《信息与控制》正式论文；研究停滞近二十年，最终实现所罗门诺夫归纳的恰是神经网络（PDF 第 204 页）。案例二，复杂性定理。不变性定理：不同程序表示下最短描述长度只差常量；该定理可看作丘奇-图灵论题的推论（PDF 第 209 页）。案例三，可计算性补救。列文在柯尔莫哥洛夫复杂性基础上加时间限制，提出 L-search 通用搜索，复杂性才变得可计算（PDF 第 212–213 页）。案例四，术语对应：压缩时间对应训练时间，SKC 复杂性对应参数量，逻辑深度对应最短推断时间（PDF 第 214 页）。<\/p>\n<p>案例五，量级对照（史料 + 量级推断）。本书给出的对应是：参数量对应 SKC 复杂性，token 量对应建模对象规模，压缩时间对应训练时间，逻辑深度对应推断时间（PDF 第 214、207 页）。GPT-3 与后续模型的具体参数量、训练 token 数原书未给数字；可核对的史料是 2020 年 GPT-3 问世后 NTP 方法反超，2022 年 11 月 30 日 ChatGPT 出现（PDF 第 170 页）。凡涉及具体参数与 token 量级，此处不补造，只保留框架内的对应关系。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：纯所罗门诺夫框架不能直接上机。归纳可能不停机，SKC 复杂性普遍不可计算，工程上只能用贝叶斯概率近似（PDF 第 207、218 页）。反例二：学习即压缩不等于死记硬背；压缩要求概括出最短表示，共相比殊相经济，不可计算的是最优压缩，实际模型给出近似。边界条件：把数据看作可由程序生成的序列，接受最短概括优先原则；去掉最短程序原则，候选续写失去排序标准；去掉不可计算限制，会得到现实中不存在的通用最优归纳器。与香农信息论的差别：香农熵不追问生成程序，SKC 复杂性度量描述长度。<\/p>\n<h2>史料补充与框架对照<\/h2>\n<p>三位提出者的时间线：所罗门诺夫 1956 年已成稿、1960 年会议发表、1964 年正式刊文；柯尔莫哥洛夫 1965 年提出同名复杂性，后来注意到所罗门诺夫工作，1968 年起用俄文与英文文章引用，使后者在苏联名声比在西方更响；蔡汀独立确认了柯尔莫哥洛夫的工作（PDF 第 204–209 页）。三方合流后合称 SKC 复杂性，也称算法熵、描述复杂性（PDF 第 210 页）。<\/p>\n<p>框架内的学习形态对照：离线学习（监督学习）与在线学习（强化学习）在这一框架内都被解释为归纳过程——建模即压缩，压缩由图灵机完成；奥卡姆剃刀、波普尔证伪、库恩式科学革命可作为归纳的特例或近似，能覆盖全部数据的最小模型就是最短程序或最小图灵机（PDF 第 217–218 页）。与香农信息论的分界要记住：香农熵度量消息的统计不确定性，不追问生成程序；SKC 复杂性把信息论建立在可计算理论之上（PDF 第 211 页）。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：大模型只是把符号规则方法放大了规模。<\/strong> 反证：本书把 GPT 的理论前身追溯到所罗门诺夫归纳与算法信息论，next token prediction 是序列预测框架，不是规则清单的加长；伊利亚 2023 年 8 月演讲确认了这一依据（PDF 第 216、219 页）。\n<\/li><li>\n<strong>误读：既然学习即压缩，模型应该把知识原样背下来。<\/strong> 反证：压缩的目标是最短概括，共相表示比殊相堆积经济；最优压缩不可计算，实际模型是可逼近的近似，不是逐字存储（PDF 第 218 页）。\n<\/li><li>\n<strong>误读：所罗门诺夫归纳已经被神经网络完全实现。<\/strong> 反证：神经网络只是通用逼近器候选，探索非神经网络实现仍是开放课题；归纳可能不停机，框架本身未被工程闭合（PDF 第 207、216 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n所罗门诺夫归纳的输入输出各是什么？最短程序在其中扮演什么角色？\n<\/li><li>\nSKC 复杂性由哪三位学者各自独立提出？不变性定理说的是什么？\n<\/li><li>\n为什么说 next token prediction 的理论前身是所罗门诺夫归纳？伊利亚在哪一场合确认了这一点？\n<\/li><li>\n归纳框架为什么不能直接上机？列文的时间限制补救是什么？\n<\/li><li>\n“学习即压缩”与死记硬背的差别在哪里？不可计算的是哪一环？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "所罗门诺夫归纳与算法信息论"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.184<\/div><h1>图灵机与丘奇-图灵论题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 9–11 章\n<\/ul>\n<h2>问题<\/h2>\n<p>要讨论“机器能否思维”，先得说清机器能算什么、不能算什么。待解决的困难是：1930 年代需要一个足够简单、又能刻画所有可计算过程的抽象装置；同时要回答，不同计算模型（递归函数、λ 演算、Post 系统）之间是否等价，这种等价是不是已经被证明的事实。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>图灵机<\/strong>是图灵 1936 年《论可计算的数》定义的计算装置：一条无穷纸带、一个读写头、一个控制装置，在纸带上读写 0/1（PDF 第 184 页）。<strong>丘奇-图灵论题<\/strong>：所有功能足够强的计算装置，计算能力都等价于图灵机（PDF 第 186 页）。逐句拆：<\/p>\n<ul><li>\n“功能足够强”：排除太弱的装置；\n<\/li><li>\n“等价”：可互相模拟；\n<\/li><li>\n“论题”：是观察性结论，不是可证明的定理。\n<\/ul>\n<h2>推导<\/h2>\n<p>定义层：图灵 1936 年文章给出装置；丘奇 1937 年在《符号逻辑杂志》评论中首次使用“图灵机”一词（PDF 第 186 页）。等价层：当时递归函数、λ 演算、Post 系统、图灵机等已被证明可互相模拟，丘奇-图灵论题由此被提出；本书强调它是观察而不是定理——无法证明不会出现新的更强装置（PDF 第 185–186 页）。装置层：通用图灵机（UTM）把一台图灵机的执行过程编码成数据放上纸带，另一台机器读出编码指令并逐步模仿；被编码的图灵机就是软件，冯诺伊曼存储程序架构的思想由此而来（PDF 第 188 页）。分层：可计算性层面讨论能否算出来，计算复杂性层面讨论模拟成本；洪加威提出的相似性原则（强丘奇-图灵论题）讨论不同模型间的模拟成本，同样是工作假设（PDF 第 189–190 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：讨论经典数字计算，装置在可计算性层面足够强。边界：论题不能严格证明；相似性原则管的是复杂性，不是可计算性。条件去掉会怎样：如果机器在可计算性上满足论题、却在复杂性上不服从相似性原则，它能模拟图灵机但不能在多项式时间内模拟，也算一种“超计算”（PDF 第 191 页）。BSS 模型以任意精度实数比较为单位时间，一阶逻辑可判定，与图灵机停机不可判定形成对照；多依奇通用量子图灵机加入物理约束——量子计算机不能求解图灵机不可计算的问题，但在某些条件下可能违背强论题（PDF 第 191–194 页）。<\/p>\n<h2>反例<\/h2>\n<p>彭罗斯用“非算法”、有人用“超图灵”指称超越图灵机能力的装置；oracle 机器可追问超越图灵机的 oracle（PDF 第 190–191 页）。这些是理论上的边界设想，不是已实现的装置。本书判断：如果认可丘奇-图灵论题和相似性原则，人就是图灵机；现有 AI 工作都建立在这一认同之上（PDF 第 196 页）。<\/p>\n<h2>辨析<\/h2>\n<p>论题与定理的差别：论题是基于已有模型互相模拟的观察，定理有严格证明；可计算性与复杂性的差别：前者问停机与判定边界，后者问时间空间成本。与所罗门诺夫归纳的关系：图灵机是归纳框架中“生成序列的程序”的载体，SKC 复杂性定义在图灵机程序长度上。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：可追溯到数理逻辑对算术可判定性的讨论（哥德尔、塔尔斯基）。后继：符号主义（c01）、定理证明（c02）、连接主义（c04）与强化学习（c06）的所有实现，默认跑在等价于图灵机的装置上；所罗门诺夫归纳（c08）直接以图灵机为定义底座。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（图灵机与丘奇-图灵论题）<\/summary><div class=\"depth-body\"><h1>图灵机与丘奇-图灵论题 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>倒查这一概念需要哪些前置：<\/p>\n<ol><li>\n可判定性问题背景：算术是否可判定，逻辑系统哪些部分可判定，先有逻辑与数学基础讨论。\n<\/li><li>\n抽象装置需求：需要一个足够简单、又能刻画所有可计算过程的模型。\n<\/li><li>\n模型等价性观察：递归函数、λ 演算、Post 系统、图灵机之间已被证明可互相模拟。\n<\/li><li>\n再往前，工程后果：装置要能把程序本身编码成数据，才有通用机器与软件观念。\n<\/ol>\n<p>逆推基线：先认“计算是有限步骤变换”，再认“装置可抽象为纸带+读写头+控制”，最后认“等价性是观察不是定理”。<\/p>\n<h2>正向推导<\/h2>\n<p>按定义、等价、装置、分层推进：<\/p>\n<ul><li>\n第一步，定义装置。图灵 1936 年《论可计算的数》给出图灵机：无穷纸带、读写头、控制装置，读写 0/1；丘奇 1937 年在《符号逻辑杂志》评论中首次使用“图灵机”一词（PDF 第 184、186 页）。依据：用最少部件刻画可计算过程。\n<\/li><li>\n第二步，提出论题。丘奇-图灵论题主张所有功能足够强的计算装置，计算能力等价于图灵机；本书强调这是观察而不是定理——当时各模型已被证明可互相模拟，但无法证明未来不出现更强装置（PDF 第 185–186 页）。依据：已有模型等价记录支撑观察，严格证明超出范围。\n<\/li><li>\n第三步，通用装置。UTM 把一台图灵机的执行过程编码成数据放上纸带，另一台机器读出指令并逐步模仿；被编码的图灵机就是软件，冯诺伊曼存储程序架构思想由此而来（PDF 第 188 页）。\n<\/li><li>\n第四步，分层。可计算性层面讨论能否算出；复杂性层面讨论模拟成本。洪加威提出的相似性原则（强丘奇-图灵论题）讨论不同模型间模拟成本，同样是工作假设（PDF 第 189–190 页）。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：论题形成时，递归函数、λ 演算、Post 系统、图灵机已被证明可互相模拟；丘奇 1937 年评论命名“图灵机”（PDF 第 185–186 页）。\n<\/li><li>\n史料：BSS 模型假设任意精度实数比较为单位时间，一阶逻辑可判定；多依奇首创通用量子图灵机，提出丘奇-图灵-多依奇原理（PDF 第 191–194 页）。\n<\/li><li>\n推断：把论题分两层看——可计算性与复杂性——是为了避免把“能模拟”和“能在多项式时间模拟”混为一谈；这一分层读解基于本书章节结构做的归纳。\n<\/li><li>\n必然还是偶然：抽象出纸带+读写头的装置形态有历史偶然性；但等价性观察在多个模型收敛后才被提出，是模型比较积累后的结果。\n<\/ul>\n<p>推导保留的限定：论题不能严格证明；相似性原则管复杂性，不替代可计算性结论。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，模型对照。BSS 模型（布卢姆一家三口）以任意精度实数比较为单位时间，该模型里一阶逻辑可判定；这与图灵机上停机问题不可判定形成对照，差别可追溯到哥德尔证明算术不可判定、塔尔斯基证明实数一阶理论可判定两条逻辑线（PDF 第 191–192 页）。案例二，物理计算。多依奇首创通用量子图灵机模型，提出丘奇-图灵-多依奇原理，给计算加入物理约束；量子计算机不能求解图灵机不可计算的问题，但在某些条件下可能违背强论题（PDF 第 193–194 页）。案例三，哲学立场。本书判断：认可论题与相似性原则，人就是图灵机；现有 AI 工作都建立在这一认同之上，争议主要留在经典到量子、经典物理到量子物理两处跳跃（PDF 第 196、199 页）。<\/p>\n<p>案例四，分层对照（史料 + 量级推断）。可计算性层回答“停机问题是否可判定”，结论是不可判定；复杂性层回答“模拟需要多少时间空间”，相似性原则处理模型间模拟成本（PDF 第 189–191 页）。本书未给各模型模拟步数的具体倍数；凡涉及成本量级，此处只做两层区分，不补造复杂度系数。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：oracle 机器可追问超越图灵机的 oracle；彭罗斯用“非算法”、有人用“超图灵”指称这类装置（PDF 第 190–191 页）。这些是理论边界设想，不是已实现装置。反例二：可计算性满足论题不等于复杂性服从相似性原则；一台机器能模拟图灵机，却不能在多项式时间内模拟，也算一种超计算（PDF 第 191 页）。边界条件：讨论经典数字计算、装置足够强；去掉可计算性前提，论题无从谈起；把复杂性成本混进可计算性结论，会误判超计算边界。<\/p>\n<h2>史料补充与分层对照<\/h2>\n<p>论题两侧的文本脉络：图灵 1936 年《论可计算的数》给出装置；丘奇 1937 年在《符号逻辑杂志》评论中命名“图灵机”；同期可互相模拟的模型包括递归函数、λ 演算、Post 系统与图灵机（PDF 第 185–186 页）。需要分开的另一条线是 AI 语境：图灵 1948 年内部报告《智能机器》提出 P 型机，1950 年《计算机与智能》提出模仿游戏；这些讨论机器能否思维，而论题只刻画计算能力边界，不直接回答思维问题（PDF 第 131、184 页）。<\/p>\n<p>分层对照再补一条复杂性线索：非确定性图灵机上多项式时间可解的问题简称 NP，确定性图灵机上多项式时间可解的是 P；相似性原则讨论不同模型之间模拟的成本，把它混进可计算性结论，会把“跑不跑得动”误当成“能不能算”（PDF 第 189–190 页）。本书还记载 oracle 思想：一台图灵机可以追问 oracle，若 oracle 能力超过图灵机，就构成超计算设想（PDF 第 190–191 页）。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：丘奇-图灵论题是一条已被证明的定理。<\/strong> 反证：本书明确它是观察——当时装置可互相模拟，但无法排除未来出现更强装置；论题不具备定理的严格证明路径（PDF 第 186 页）。\n<\/li><li>\n<strong>误读：量子计算机能算出图灵机不可计算的问题。<\/strong> 反证：本书立场是不能；量子计算只在某些条件下违背强丘奇-图灵论题（复杂性层面），不违背可计算性层面的论题（PDF 第 194 页）。\n<\/li><li>\n<strong>误读：通用图灵机就是第一台电子计算机。<\/strong> 反证：UTM 是抽象模型，思想后果是程序可编码成数据、成为软件；存储程序架构的工程实现是另一环节（PDF 第 188 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n图灵机由哪几个部件构成？“图灵机”这个名称是谁在哪篇评论里使用的？\n<\/li><li>\n丘奇-图灵论题为什么是观察而不是定理？它覆盖哪些已被证明可互相模拟的模型？\n<\/li><li>\n通用图灵机怎样把程序变成数据？这一思想对存储程序架构有什么影响？\n<\/li><li>\nBSS 模型与图灵机模型在一阶逻辑可判定性上的结论有何不同？\n<\/li><li>\n量子计算能求解不可计算问题吗？它可能违背的是哪一层的论题？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "图灵机与丘奇-图灵论题"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：起源与符号主义黄金年代<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1–2 章：起源与符号主义的黄金年代（达特茅斯会议、定理证明）<\/a><br>检查点：能说清 1956 达特茅斯会议的主要人物、符号派主张，以及定理证明从逻辑理论家到归结原理的路线<\/li><li class='path-step' id='path-02'><strong>步骤 02：专家系统、五代机与神经网络两次起落<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 3–5 章：专家系统、第五代机与神经网络的两次起落<\/a><br>检查点：能对比 DENDRAL/MYCIN 与感知机—反向传播两条线，说明符号工程为何受挫、连接主义为何复兴<\/li><li class='path-step' id='path-03'><strong>步骤 03：向自然学习、机器下棋与自然语言处理<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 6–8 章：向自然学习、机器下棋与自然语言处理<\/a><br>检查点：能讲清遗传算法与强化学习的来源、下棋程序的两次突破，以及 NLP 从规则到统计再到深度学习的范式切换<\/li><li class='path-step' id='path-04'><strong>步骤 04：语言、计算理论与大语言模型<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 9–11 章：语言、计算理论与大语言模型<\/a><br>检查点：能陈述图灵机与丘奇-图灵论题，并把所罗门诺夫归纳、压缩观与 GPT 的 next token prediction 串起来<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 人工智能学界公认的达特茅斯会议召开于哪一年？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 1943 年<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 1956 年<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 1965 年<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 1969 年<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 纽厄尔与司马贺共享图灵奖的年份是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 1956 年<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 1965 年<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 1975 年<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 1983 年<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> 按物理符号系统假说，智能的本质是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 神经元之间连接强度的调整<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 对符号的操作，最原始的符号对应物理客体<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 对环境奖励的长期累积<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 大量语料上的概率压缩<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q4.<\/b> 1958 年夏天，王浩在 IBM 704 上用 9 分钟证明了《数学原理》中一阶逻辑定理的多少条？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 全部 150 条<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 150 条中的 120 条<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 200 条命题逻辑定理<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 仅命题逻辑子集<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q5.<\/b> 罗宾逊的归结原理论文发表于哪一年、哪个刊物？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 1957 年，《符号逻辑杂志》<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 1965 年，JACM<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 1969 年，《人工智能杂志》<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 1970 年，《信息与控制》<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q6.<\/b> 归结原理最核心的简化是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 只需一条归结规则即可完成一阶逻辑证明推导<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 把所有定理转换成神经网络权重<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 用穷举搜索替代任何逻辑规则<\/label><label class='quiz-opt'><input typ div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c05' data-chapter='ch02'><p class='quiz-q'><b>Q10.<\/b> 反向传播在多层神经网络中的主要作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 把输出误差逐层回传，用梯度下降调整各层权重<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 随机初始化网络结构<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 把符号规则翻译成逻辑子句<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 在种群之间做交叉变异<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c05' data-chapter='ch02'><p class='quiz-q'><b>Q11.<\/b> 2012 年 ImageNet 大赛上，辛顿团队 SuperVision（AlexNet）的核心成员包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 克里泽夫斯基、伊利亚·苏茨克维和辛顿<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 本吉奥、杨立昆和辛顿<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 霍普菲尔德和谢诺夫斯基<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 萨顿和席尔瓦<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c06' data-chapter='ch03'><p class='quiz-q'><b>Q12.<\/b> Q-Learning 是在哪一年的哪篇学位论文中提出的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 1989 年，沃科金斯（Chris Watkins）剑桥大学博士论文<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 1986 年，鲁梅尔哈特《自然》论文<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 1975 年，霍兰德遗传算法著作<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 1998 年，萨顿与 tton class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q16' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q16.<\/b> 图灵在哪一年的文章《论可计算的数》中定义了后来被称为图灵机的计算装置？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 1936 年<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 1948 年<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> 1950 年<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> 1965 年<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q17' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q17.<\/b> 关于丘奇-图灵论题，下列说法哪条符合本书立场？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> 它是一条可以被严格证明的数学定理<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> 它是一个观察：足够强的计算装置互相等价<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 它断言量子计算机不可计算<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 它只适用于 LISP 程序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q18.<\/b> 所罗门诺夫归纳法的核心做法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 用最短的、能为已知序列建模的程序预测下一个序列元素<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 用人工规则逐条标注语法结构<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 在种群中反复交叉变异选出最优个体<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> 按奖励信号调整下棋策略<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><sp io' name='q10' value='3'> 在种群之间做交叉变异<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c05' data-chapter='ch02'><p class='quiz-q'><b>Q5.<\/b> 2012 年 ImageNet 大赛上，辛顿团队 SuperVision（AlexNet）的核心成员包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 克里泽夫斯基、伊利亚·苏茨克维和辛顿<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 本吉奥、杨立昆和辛顿<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 霍普菲尔德和谢诺夫斯基<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 萨顿和席尔瓦<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 6–8 章：向自然学习、机器下棋与自然语言处理<\/h1><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c06' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> Q-Learning 是在哪一年的哪篇学位论文中提出的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 1989 年，沃科金斯（Chris Watkins）剑桥大学博士论文<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 1986 年，鲁梅尔哈特《自然》论文<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 1975 年，霍兰德遗传算法著作<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 1998 年，萨顿与巴托教科书<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q13' data-type='single' data-concept='c06' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 强化学习中“探索”与“利用”的取舍指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 是否把代码开源给社区<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> 尝试未知动作获取新信息，还是选取当前已知最优动作<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> 训练数据用英文还是中文<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 使用 GPU 还是 CPU<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q3.<\/b> 1988 年 IBM Thomas J. Watson 研究中心在计算语言学会议上推出的法英统计机器翻译系统叫什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> GNMT<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> CANDIDE<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> word2vec<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> BERT<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q4.<\/b> 谷歌在哪一年率先在 word2vec 中工程实现了词嵌入？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 1988 年<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 2013 年<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 2016 年<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 2017 年<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 9–11 章：语言、计算理论与大语言模型<\/h1><div class='quiz-item' data-qid='q16' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 图灵在哪一年的文章《论可计算的数》中定义了后来被称为图灵机的计算装置？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 1936 年<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 1948 年<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> 1950 年<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> 1965 年<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q17' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 关于丘奇-图灵论题，下列说法哪条符合本书立场？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> 它是一条可以被严格证明的数学定理<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> 它是一个观察：足够强的计算装置互相等价<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 它断言量子计算机不可计算<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 它只适用于 LISP 程序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q3.<\/b> 所罗门诺夫归纳法的核心做法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 用最短的、能为已知序列建模的程序预测下一个序列元素<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 用人工规则逐条标注语法结构<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 在种群中反复交叉变异选出最优个体<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> 按奖励信号调整下棋策略<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q19' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q4.<\/b> 2023 年 8 月，伊利亚·苏茨克维在哪一场合透露 GPT 的数学依据是所罗门诺夫归纳？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> 伯克利 Hixon 会议<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> 赛蒙斯计算理论研究所（Simons Institute）演讲<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> 达特茅斯 50 周年重聚<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> ARPA-IPTO 报告会<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q20' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q5.<\/b> 按本书第 11 章的区分，BERT 与 GPT 在预测方式上的差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q20' value='0'> BERT 抽取序列中被遮住的词；GPT 做单向的 next token prediction<\/label><label class='quiz-opt'><input type='radio' name='q20' value='1'> BERT 用神经网络，GPT 用符号规则<\/label><label class='quiz-opt'><input type='radio' name='q20' value='2'> BERT 预测奖励，GPT 预测棋步<\/label><label class='quiz-opt'><input type='radio' name='q20' value='3'> 二者完全相同，只是训练语料不同<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='物理符号系统假说'>物理符号系统假说 — 纽厄尔与司马贺提出的主张：智能是对符号的操作，最原始的符号对应于物理客体 <span class=glossary-ref>（第 1–2 章：起源与符号主义的黄金年代（达特茅斯会议、定理证明））<\/span><\/li><li data-term='启发式'>启发式 — 借鉴人解决问题的经验性策略，而非穷举所有可能路径的搜索方法；“逻辑理论家”首创的程序思路 <span class=glossary-ref>（第 1–2 章：起源与符号主义的黄金年代（达特茅斯会议、定理证明））<\/span><\/li><li data-term='合一（unification）'>合一（unification） — 把两个一阶逻辑项按变量代换对齐的算法，普拉维茨提出、罗宾逊拓展，是归结原理的配套机制 <span class=glossary-ref>（第 1–2 章：起源与符号主义的黄金年代（达特茅斯会议、定理证明））<\/span><\/li><li data-term='归结原理（resolution）'>归结原理（resolution） — 罗宾逊 1965 年提出的单条推理规则：所有一阶逻辑证明推导只需归结这一条规则即可 <span class=glossary-ref>（第 1–2 章：起源与符号主义的黄金年代（达特茅斯会议、定理证明））<\/span><\/li><li data-term='专家系统'>专家系统 — 把领域专家知识提炼成规则、在狭窄专业领域内模拟专家判断的程序，代表系统有 DENDRAL、MYCIN <span class=glossary-ref>（第 3–5 章：专家系统、第五代机与神经网络的两次起落）<\/span><\/li><li data-term='产生式规则'>产生式规则 — “如果条件，那么结论”形式的规则；MYCIN 首创把它作为专家系统的核心要素并用于不精确推理 <span class=glossary-ref>（第 3–5 章：专家系统、第五代机与神经网络的两次起落）<\/span><\/li><li data-term='感知机（perceptron）'>感知机（perceptron） — 罗森布拉特 1957 年提出的单层神经网络模型，可在样本线性可分时收敛并完成简单模式识别 <span class=glossary-ref>（第 3–5 章：专家系统、第五代机与神经网络的两次起落）<\/span><\/li><li data-term='反向传播（backpropagation）'>反向传播（backpropagation） — 把输出误差逐层回传、用梯度下降调整多层网络权重的算法；1986 年 Rumelhart、Hinton、Williams 在《自然》杂志压缩发表 <span class=glossary-ref>（第 3–5 章：专家系统、第五代机与神经网络的两次起落）<\/span><\/li><li data-term='遗传算法'>遗传算法 — 霍兰德受进化论与遗传学启发、模拟种群选择、交叉与变异的进化式优化算法 <span class=glossary-ref>（第 6–8 章：向自然学习、机器下棋与自然语言处理）<\/span><\/li><li data-term='马尔可夫决策过程（mdp）'>马尔可夫决策过程（MDP） — 强化学习的理论框架之一：状态、动作与转移概率构成的序列决策模型 <span class=glossary-ref>（第 6–8 章：向自然学习、机器下棋与自然语言处理）<\/span><\/li><li data-term='奖励假设（reward is enough）'>奖励假设（Reward is enough） — 巴托与萨顿的观点：以长期奖励最大化为目标的学习，足以解释包括智能在内的种种行为 <span class=glossary-ref>（第 6–8 章：向自然学习、机器下棋与自然语言处理）<\/span><\/li><li data-term='词嵌入（word embedding）'>词嵌入（word embedding） — 把词表示成向量、让词义相近的词在向量空间中靠近的方法；2013 年谷歌 word2vec 率先工程实现 <span class=glossary-ref>（第 6–8 章：向自然学习、机器下棋与自然语言处理）<\/span><\/li><li data-term='图灵机'>图灵机 — 图灵 1936 年定义的计算装置：无穷纸带、读写头与控制装置，被丘奇在 1937 年评论中命名 <span class=glossary-ref>（第 9–11 章：语言、计算理论与大语言模型）<\/span><\/li><li data-term='丘奇-图灵论题'>丘奇-图灵论题 — 观察性结论：所有功能足够强的计算装置，计算能力都等价于图灵机；它不是数学定理 <span class=glossary-ref>（第 9–11 章：语言、计算理论与大语言模型）<\/span><\/li><li data-term='柯尔莫哥洛夫复杂性（skc 复杂性）'>柯尔莫哥洛夫复杂性（SKC 复杂性） — 输出某序列的最短程序长度；所罗门诺夫、柯尔莫哥洛夫、蔡汀各自独立提出，普遍不可计算 <span class=glossary-ref>（第 9–11 章：语言、计算理论与大语言模型）<\/span><\/li><li data-term='next token prediction'>next token prediction — 下一词元预测：给定已出现的序列预测下一个符号；GPT 系列大语言模型的核心机制，思想可追溯到所罗门诺夫归纳 <span class=glossary-ref>（第 9–11 章：语言、计算理论与大语言模型）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库<\/h1>\n<h2>模式 1：先认路线，再记事件<\/h2>\n<p>碰到一段 AI 史材料，先判断它属于符号（规则/逻辑）、连接（网络/数据）还是行为（进化/奖励）路线；路线定了，人物、方法和成败原因各归其位，事件就不会记串。<\/p>\n<h2>模式 2：人物线与技术线并行读<\/h2>\n<p>每读一个阶段，同时追两条线：人物师承与合作（如纽厄尔-司马贺、巴托-萨顿、辛顿-学生），技术问题与解法（如 XOR 局限 → 多层网络 → 反向传播）。轶事只作记忆锚点，结论以技术线为准。<\/p>\n<h2>模式 3：区分“解释”与“描述”<\/h2>\n<p>规则派要解释语言/行为为什么有此结构；统计与深度学习给的是数据上的描述与预测。评价一个系统时先分清它回答的是“为什么”还是“是什么”，避免把工程效果当成科学解释。<\/p>\n<h2>模式 4：把工程突破放回三要素<\/h2>\n<p>一次方法起飞通常需要算法、算力、数据同时到位：感知机受限于单层与训练方法，深度学习等到反向传播成熟、GPU 算力和 ImageNet 规模数据才拐点。看到“新架构”先问另外两要素是否具备。<\/p>\n<h2>模式 5：理论主张与可计算性边界分开<\/h2>\n<p>哲学争论（语言是否等于思维、人是否机器）落到计算层面，先检查它预设的计算模型：图灵机、BSS 实数模型还是量子模型；再区分可计算性问题与复杂性问题，结论的适用范围才清楚。<\/p>\n<h2>模式 6：用归纳框架统一学习范式<\/h2>\n<p>监督学习、强化学习、序列预测在算法信息论里都是所罗门诺夫归纳的近似：找最短程序概括已有数据、预测新数据；模型规模对应描述复杂性，训练对应压缩，推断对应逻辑深度。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1–2 章 符号黄金年代<\/strong>：1956 达特茅斯 → 物理符号系统假说 → 定理证明（戴维斯 1954 / 王浩 1958 / 罗宾逊 1965）。\n<\/li><li>\n<strong>第 3–5 章 两次起落<\/strong>：DENDRAL → MYCIN → XCON；五代机 1981–1994 押 Prolog；感知机 1957 → 寒冬 1969 → 反向传播 1986 → AlexNet 2012。\n<\/li><li>\n<strong>第 6–8 章 向自然学习<\/strong>：遗传算法（霍兰德）→ 强化学习（巴托/萨顿）；下棋：香农 1950 → 深蓝 1997 → AlphaGo；NLP：规则 → 统计 → 深度学习 → Transformer 2017。\n<\/li><li>\n<strong>第 9–11 章 语言与理论<\/strong>：乔姆斯基思维即语言；图灵机 1936 与 CTT；所罗门诺夫归纳 = 最短程序预测下一项，学习即压缩。\n<\/ul>\n<h2>关键年份与人物<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>年份<\/th><th>事件<\/th><th>人物<\/th><\/tr><\/thead><tbody><tr><td>1943<\/td><td>神经元模型开山文章<\/td><td>麦卡洛克、皮茨<\/td><\/tr><tr><td>1956<\/td><td>达特茅斯会议；第二款跳棋程序<\/td><td>麦卡锡、明斯基、纽厄尔、司马贺；塞缪尔<\/td><\/tr><tr><td>1957<\/td><td>感知机提出<\/td><td>罗森布拉特<\/td><\/tr><tr><td>1958<\/td><td>王浩 IBM 704 机器证明<\/td><td>王浩；学生库克<\/td><\/tr><tr><td>1965<\/td><td>归结原理发表 JACM<\/td><td>罗宾逊<\/td><\/tr><tr><td>1969<\/td><td>《感知机》批判单层网络<\/td><td>明斯基、佩珀特<\/td><\/tr><tr><td>1976<\/td><td>MYCIN 博士论文<\/td><td>肖特莱福<\/td><\/tr><tr><td>1982<\/td><td>霍普菲尔德网络<\/td><td>霍普菲尔德<\/td><\/tr><tr><td>1986<\/td><td>反向传播《自然》论文<\/td><td>Rumelhart、Hinton、Williams<\/td><\/tr><tr><td>1989<\/td><td>Q-Learning 博士论文<\/td><td>沃科金斯<\/td><\/tr><tr><td>1997<\/td><td>深蓝胜卡斯帕罗夫<\/td><td>IBM 深蓝团队<\/td><\/tr><tr><td>2012<\/td><td>AlexNet 夺 ILSVRC<\/td><td>克里泽夫斯基、苏茨克维、辛顿<\/td><\/tr><tr><td>2013<\/td><td>word2vec<\/td><td>谷歌<\/td><\/tr><tr><td>2017<\/td><td>Transformer<\/td><td>谷歌团队<\/td><\/tr><tr><td>2022-11-30<\/td><td>ChatGPT 问世<\/td><td>OpenAI<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>概念辨析<\/h2>\n<ul><li>\n<strong>符号主义<\/strong>：智能 = 符号操作；知识来自人工规则与逻辑。\n<\/li><li>\n<strong>连接主义<\/strong>：智能 = 连接强度调整；知识来自数据训练。\n<\/li><li>\n<strong>行为/进化路线<\/strong>：遗传算法模拟种群进化；强化学习靠奖励试错。\n<\/li><li>\n<strong>CTT vs 相似性原则<\/strong>：前者管可计算性（能否算），后者管复杂性（模拟成本）；都是观察，不是定理。\n<\/li><li>\n<strong>BERT vs GPT<\/strong>：双向掩码完形填空 vs 单向 next token prediction；Transformer 是共用架构。\n<\/ul>\n<h2>反例库<\/h2>\n<ul><li>\n“AI 一词确定由麦卡锡发明”——本书记为悬案。\n<\/li><li>\n“逻辑理论家是第一个可运行定理证明程序”——第一归戴维斯 1954。\n<\/li><li>\n“反向传播 1986 年凭空出现”——Werbos 1974 已有早期工作。\n<\/li><li>\n“量子计算机能算不可计算问题”——不能，只可能违背强 CTT（复杂性层面）。\n<\/ul>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/ai-history", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1–2 章：起源与符号主义的黄金年代（达特茅斯会议、定理证明）", "href": "#/chapter/ch01"}, {"label": "第 3–5 章：专家系统、第五代机与神经网络的两次起落", "href": "#/chapter/ch02"}, {"label": "第 6–8 章：向自然学习、机器下棋与自然语言处理", "href": "#/chapter/ch03"}, {"label": "第 9–11 章：语言、计算理论与大语言模型", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "符号主义与物理符号系统假说", "href": "#/concept/c01"}, {"label": "自动定理证明与归结原理", "href": "#/concept/c02"}, {"label": "专家系统与知识表示", "href": "#/concept/c03"}, {"label": "连接主义与感知机", "href": "#/concept/c04"}, {"label": "反向传播与深度学习复兴", "href": "#/concept/c05"}, {"label": "强化学习", "href": "#/concept/c06"}, {"label": "统计 NLP、词嵌入与 Transformer", "href": "#/concept/c07"}, {"label": "所罗门诺夫归纳与算法信息论", "href": "#/concept/c08"}, {"label": "图灵机与丘奇-图灵论题", "href": "#/concept/c09"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1–2 章：起源与符号主义的黄金年代（达特茅斯会议、定理证明）", "href": "#/quiz/ch01"}, {"label": "测验：第 3–5 章：专家系统、第五代机与神经网络的两次起落", "href": "#/quiz/ch02"}, {"label": "测验：第 6–8 章：向自然学习、机器下棋与自然语言处理", "href": "#/quiz/ch03"}, {"label": "测验：第 9–11 章：语言、计算理论与大语言模型", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.13<\/div><h1>第 1–2 章：起源与符号主义的黄金年代（达特茅斯会议、定理证明）<\/h1>\n<blockquote>对应原书第 1 章《达特茅斯会议：人工智能的缘起》、第 2 章《自动定理证明兴衰纪》（PDF 第 13–62 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出达特茅斯会议的年份、主要召集者与核心人物，分清符号派与神经网络派的早期分野；\n<\/li><li>\n解释物理符号系统假说的主张，以及它为什么被称作符号主义的纲领；\n<\/li><li>\n梳理自动定理证明从“逻辑理论家”、王浩的机器证明到罗宾逊归结原理的路线，并指出每条路线解决了什么、留下了什么问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>人工智能的起点不是某台机器，而是一次会议与一个信念：<strong>智能可以被拆成对符号的操作，而符号操作可以交给机器<\/strong>；定理证明则是这条路线最早、最硬核的技术阵地。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 前戏：1955 年洛杉矶的学习机讨论会<\/h3>\n<p>公认的 AI 起点是 1956 年的达特茅斯会议，但本书先记了一场前戏：1955 年美国西部计算机联合大会在洛杉矶套开“学习机讨论会”。与会的塞弗里奇（Oliver Selfridge）讲模式识别，纽厄尔（Allen Newell）讲计算机下棋；讨论会主持人是神经网络鼻祖之一皮茨（Walter Pitts）。皮茨总结时说，一派人模拟神经系统，纽厄尔那一派模拟心智（mind），但殊途同归——这句话提前预告了之后几十年逻辑与神经网络两条进路的矛盾（PDF 第 13 页）。<\/p>\n<p>为什么要先讲这场前戏？因为 AI 从第一天起就不是一条路线：有人从大脑结构出发，有人从心智功能出发。后面七十年的起落，基本都是这两条路线在不同硬件、数据和理论条件下的重演。<\/p>\n<h3>2. 达特茅斯会议：六个人与一份建议书<\/h3>\n<p>会议召集者麦卡锡（John McCarthy，1927—2011）当时是达特茅斯学院数学系助理教授；另一位积极参加者是明斯基（Marvin Lee Minsky），两人在普林斯顿读书时就相熟。受邀的还有信息论创始人香农（Claude Shannon，1916—2001），以及后来终生合作的纽厄尔与司马贺（Herbert Simon，1916—2001）。1955 年夏天，麦卡锡与 IBM 的罗切斯特（Nathaniel Rochester）打算第二年在达特茅斯办活动，遂说动香农和明斯基一起给洛克菲勒基金会写项目建议书（PDF 第 13–18 页）。<\/p>\n<p>一个常被搞错的细节：“人工智能”这个词并不确定是麦卡锡原创。他晚年承认最早是从别人那里听来、记不清是谁；英国人伍德华（Philip Woodward）后来给杂志写信自称原创者。麦卡锡的建议书 1955 年就已经在用“人工智能”了，当事人都已仙逝，这成了一桩悬案（PDF 第 19–20 页）。<\/p>\n<h3>3. 人物线：纽厄尔与司马贺代表的符号派<\/h3>\n<p>纽厄尔在兰德公司认识了司马贺，司马贺把他力邀到卡内基-梅隆大学并给他博士学位。他们共享 1975 年图灵奖，三年后司马贺再获诺贝尔经济学奖。他们把自己的思路命名为<strong>物理符号系统假说<\/strong>：智能是对符号的操作，最原始的符号对应于物理客体。这个思路接近英美经验主义传统，也和当时数学系主任、第一届图灵奖得主珀里思（Alan Perlis）一起，帮卡内基-梅隆建起计算机系（PDF 第 16–17 页）。<\/p>\n<p>为什么这一派被叫作“符号主义”？因为它假定：不管大脑里神经元怎么放电，智能在描述层面可以用符号（如“客体”“关系”“规则”）及其操作来刻画。只要机器能操作这些符号，就不必复刻大脑的物理结构。<\/p>\n<h3>4. 概念 1：符号主义与物理符号系统假说（难度：基础）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。一句话：<strong>符号主义相信智能的核心是符号的表示与变换<\/strong>；物理符号系统假说是纽厄尔与司马贺对这一信念的正式表述。<\/p>\n<h3>5. 技术线：自动定理证明为什么成了符号派的第一块试验田<\/h3>\n<p>纽厄尔和司马贺在会上报告的“逻辑理论家”（Logic Theorist），能证明怀特海与罗素《数学原理》命题逻辑部分的一个很大子集。它常被当作 AI 史上最重要的原创工作之一，但本书提醒：它对机器定理证明这个分支影响并不大——逻辑学家并不买账（PDF 第 23 页）。<\/p>\n<p>为什么定理证明是符号派的硬核阵地？因为数学证明是最纯粹的符号操作：前提、规则、结论全是符号串，证明就是按规则把一串符号变成另一串。如果机器能自动完成证明，就等于在最高标准的“理性活动”上摸到了智能。符号派的思想源头和理论基础就是定理证明，不懂定理证明就没法深入了解符号派（PDF 第 32 页）。<\/p>\n<h3>6. 概念 2：自动定理证明与归结原理（难度：进阶）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。这条线上有几个必须记住的节点：<\/p>\n<ul><li>\n<strong>戴维斯（Martin Davis）1954 年<\/strong>在普林斯顿高等研究院的 JOHNNIAC 上完成第一个定理证明程序，文章 1957 年才发表；它实现了普利斯博格算术（只有加法、没有乘法的可判定算术）的判定过程（PDF 第 33–34 页）。\n<\/li><li>\n<strong>王浩<\/strong>1958 年夏天在 IBM 704 上实现完全的命题逻辑程序和一阶逻辑程序，后者只用 9 分钟就证明《数学原理》一阶逻辑全部 150 条定理中的 120 条；1959 年夏天的改进版证明全部一阶定理外加 200 条命题逻辑定理。他的学生库克（Stephen Cook）后来在 1971 年《定理证明的复杂性》一文中提出 NP 完全性理论，1982 年获图灵奖（PDF 第 36 页）。\n<\/li><li>\n<strong>罗宾逊（John Alan Robinson，1930—2016）<\/strong>在实现 DP 过程的过程中发现<strong>归结（resolution）原理<\/strong>，文章迟至 1965 年发表在 JACM。有了归结，所有一阶逻辑证明推导只需归结这一条规则；它配合拓展后的合一算法，是定理证明的重要里程碑（PDF 第 38–39 页）。\n<\/ul>\n<h3>7. 阿贡小组与机器证明的实干路线<\/h3>\n<p>罗宾逊后来全职加入阿贡国家实验室的定理证明小组，同事有盲人数学家沃思（Larry Wos）。阿贡小组的精神是实战：提出支持集（set of support）等提高效率的概念。小组成员马库恩（William McCune，1953—2011）用 C 写了 Otter 证明器，又用专门证明方程的 EQP 在 1996 年 10 月 10 日证明了 1933 年提出、六十多年未被证明的罗宾斯猜想：在一台 486 机上跑了 13 天给出证明，再在 IBM RS/6000 工作站上跑 7 天验证（PDF 第 40–41 页）。<\/p>\n<p>为什么要记这个案例？它说明定理证明并非纸上谈兵：当搜索策略、索引和实现工程都到位时，机器可以解决人长期没拿下的问题。但它也暴露了归结路线的另一面——组合爆炸仍然需要启发式帮忙，纯逻辑的通用证明器在实际问题上效率有限。<\/p>\n<h2>完整推导 1：符号主义为什么会撞上组合爆炸<\/h2>\n<p>推理链分四步，每步给出书中依据：<\/p>\n<ol><li>\n前提：符号派把智能看成符号操作，定理证明被当作最纯粹的检验阵地（PDF 第 32 页）。\n<\/li><li>\n第一步工程尝试：“逻辑理论家”用启发式模拟人解题，能证明《数学原理》命题逻辑子集，但逻辑学家并不接受它作为证明方法（PDF 第 23、35 页）。\n<\/li><li>\n规则统一化之后：罗宾逊 1965 年归结原理把一阶逻辑证明归约为一条规则配合合一算法，规则数量减少了，但证明过程会持续生成新子句（PDF 第 38–39 页）。\n<\/li><li>\n结论落点：归结的简单性引起重视，可组合爆炸同样没有消失；纯逻辑通用证明器在实际问题上效率有限，必须借助支持集、索引等启发式策略控制搜索（PDF 第 40、42 页）。反例检验：EQP 证明罗宾斯猜想耗时 13 天加 7 天验证，成功依赖项索引与判别树索引等工程条件，不是归结规则单独完成（PDF 第 41 页）。\n<\/ol>\n<h2>完整推导 2：定理证明路线为什么从 AI 圈子分化到逻辑与工程共同体<\/h2>\n<ol><li>\n观察起点：早期证明程序分两路——戴维斯、王浩贴近逻辑判定过程，纽厄尔、司马贺贴近人类解题启发式（PDF 第 33–36 页）。\n<\/li><li>\n分化原因：逻辑学家追求可判定性与形式化标准，对启发式程序评价不高；王浩甚至称逻辑理论家“不专业”，该文也被《符号逻辑杂志》退稿（PDF 第 35 页）。\n<\/li><li>\n接力位置：罗宾逊在实现 DP 过程时发现归结，把证明规则统一化；阿贡小组则把证明器做成可实战的工程系统（PDF 第 38、40 页）。\n<\/li><li>\n推论：符号派的思想源头是定理证明，但定理证明共同体与 AI 工程圈子长期若即若离；这条分化后来影响了专家系统、逻辑程序各自的发展方向（PDF 第 32、42 页）。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[1955 洛杉矶学习机讨论会] --&gt; B[1956 达特茅斯会议]\nB --&gt; C[符号派: 纽厄尔/司马贺&lt;br/&gt;物理符号系统假说]\nB --&gt; D[神经网络派: 皮茨/麦卡洛克一线]\nC --&gt; E[逻辑理论家 1956]\nE --&gt; F[王浩机器证明 1958]\nF --&gt; G[罗宾逊归结原理 1965]\nG --&gt; H[阿贡小组 Otter/EQP 1996 罗宾斯猜想]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：符号派从心智功能出发，落到逻辑与证明；定理证明的技术接力棒从 AI 圈子交到逻辑学家和实战小组手里，两条线索在 1965 年归结原理处合流，又在 1970 年代后因组合爆炸分化。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：符号主义像一本用规范语言写成的操作手册——世界被拆成名词（客体）和动词（操作），智能就是照着手册翻页、改写、查表；它不关心手册写在纸上还是刻在神经元里。\n<\/li><li>\n实例对照：“逻辑理论家”模仿人证明定理的思路（启发式），王浩的程序更贴近逻辑学家的判定过程；前者对 AI 和心理学有意义，后者对理论计算机科学影响更深。\n<\/li><li>\n反例提醒：把“第一个可运行的定理证明程序”安给纽厄尔和司马贺并不准确，本书把这一荣誉归给戴维斯 1954 年的程序（PDF 第 33 页）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：达特茅斯会议上大家一致同意了 AI 的技术路线。<\/strong> 实际上会议本身没产生统一路线，纽厄尔和司马贺的报告反而抢了召集者的风头；符号与连接的分歧从会前就存在。\n<\/li><li>\n<strong>误解：“人工智能”一词确定是麦卡锡发明的。<\/strong> 本书记载这是悬案，麦卡锡晚年也承认记不清来源。\n<\/li><li>\n<strong>误解：归结原理是一条单独的逻辑规则集合。<\/strong> 它的威力来自“合一算法 + 归结规则 + 包含（subsumption）”的综合；罗宾逊的贡献不止归结一项（PDF 第 39 页）。\n<\/li><li>\n<strong>误解：定理证明从一开始就属于 AI 圈子。<\/strong> 逻辑学家和数学家长期与 AI 圈子若即若离，很多人宁可和计算机理论家混在一起（PDF 第 35 页）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n达特茅斯会议是哪一年召开的？（答案：1956 年；前戏是 1955 年洛杉矶学习机讨论会。）\n<\/li><li>\n物理符号系统假说是谁提出的、主张什么？（答案：纽厄尔与司马贺；智能是对符号的操作，最原始的符号对应物理客体。）\n<\/li><li>\n罗宾逊归结原理哪一年发表在哪个刊物？它配套的算法是什么？（答案：1965 年，JACM；配套合一算法。）\n<\/li><li>\n王浩 1958 年夏天在 IBM 704 上证明了多少条一阶逻辑定理？他的学生是谁、后来提出了什么理论？（答案：150 条中的 120 条；学生库克，提出 NP 完全性理论。）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>如果 1950 年代逻辑学家与 AI 圈子没有互相排斥，符号派是否会更早走向高效判定过程？书中证据支持两点：其一，王浩路线的机器证明在 1958–1959 年已在教科书定理上取得记录，证明“判定过程 + 工程实现”这条路当时可行（PDF 第 36 页）；其二，启发式程序与逻辑证明两套标准长期分离，逻辑理论家被逻辑界拒之门外（PDF 第 35 页）。反过来假设两方早期深度合作，更可能的结果是定理证明方法更早被 AI 工程吸收，而不是符号派整体避开组合爆炸；组合爆炸来自逻辑搜索的固有规模问题，不会因圈子合作而消失。另一条反事实：若 1956 年会上没有纽厄尔与司马贺的报告，达特茅斯会议留下的技术演示会更偏松散讨论；本书记载他们的报告在会上抢了召集者的风头，这一演示是符号派纲领第一次落地样本（PDF 第 23 页）。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章是四条学习单元的起点：符号主义纲领（c01）与定理证明（c02）构成后续专家系统、五代机的方法源头；计算理论底座（c09）与归纳学习观（c08）在第 4 单元再回收本章“符号可被机器处理”的预设。下一章进入符号工程的两个方向：窄领域专家系统，以及国家层面押注逻辑程序的第五代计算机。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n1956 达特茅斯会议：AI 公认起点；人物线 = 麦卡锡、明斯基、香农、纽厄尔、司马贺、塞弗里奇、所罗门诺夫。\n<\/li><li>\n符号主义纲领：物理符号系统假说——智能即符号操作。\n<\/li><li>\n定理证明接力：戴维斯 1954 → 王浩 1958/1959 → 罗宾逊 1965 归结 → 阿贡小组 1996 EQP 罗宾斯猜想。\n<\/li><li>\n遗留问题：归结的组合爆炸、通用证明器效率低，为后来符号派内部“过程表示 vs 陈述表示”的斗争埋下伏笔。\n<\/ul>", "ch02": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.63<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1–2 章：起源与符号主义的黄金年代（达特茅斯会议、定理证明）<\/a><\/span><\/div><h1>第 3–5 章：专家系统、第五代机与神经网络的两次起落<\/h1>\n<blockquote>对应原书第 3 章《从专家系统到知识图谱》、第 4 章《第五代计算机的教训》、第 5 章《神经网络简史》（PDF 第 63–119 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 1–2 章的符号主义脉络\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清专家系统从 DENDRAL、MYCIN 到 XCON 的演进，以及“知识原则”和产生式规则在其中的位置；\n<\/li><li>\n解释日本第五代计算机计划为什么押注 Prolog 与逻辑程序，又为什么在 1990 年代初归于沉寂；\n<\/li><li>\n梳理神经网络从 1943 年麦卡洛克-皮茨模型、1957 年感知机、1969 年《感知机》批判，到 1980 年代反向传播与 2012 年深度学习突破的两次起落。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>符号路线把专家知识搬进规则库，押注“知识就是力量”；连接路线把智能交给神经元之间的连接强度，两次被打压、两次复活——两条路线的胜负取决于硬件、数据和算法是否同时到位。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 专家系统：把专家的脑子写成规则<\/h3>\n<p>1964 年，费根鲍姆（Edward Feigenbaum）响应麦卡锡召唤，从加州大学伯克利分校到斯坦福。他与遗传学家、1958 年诺贝尔生理学或医学奖得主莱德伯格（Joshua Lederberg，1925—2008）合作，团队成员还有布坎南（Bruce Buchanan）。合作成果是<strong>第一个专家系统 DENDRAL<\/strong>：输入质谱仪数据，输出给定物质的化学结构；团队把化学家的分析知识提炼成规则，系统有时做得比莱德伯格的学生还好（PDF 第 64–65 页）。<\/p>\n<p>为什么专家系统在 1960–70 年代出现？因为定理证明那条通用路线走不动：通用证明器效率低，而真实世界的专业判断往往狭窄、明确、依赖经验规则。把专家在小领域里的判断写成“如果条件，那么结论”的产生式规则，是当时最可行的工程路径。<\/p>\n<p>第二个代表系统是 <strong>MYCIN<\/strong>：牵头人肖特莱福（Edward Shortliffe）1976 年在斯坦福拿计算机博士，论文主题就是细菌感染诊断系统。本书记载 MYCIN 处方准确率 69%，当时专科医生 80%，但已优于非本专业医生；肖特莱福因此获 1976 年 ACM 青年科学家霍珀奖。MYCIN 从未真正临床使用，但它的原理后来提炼成通用骨架 EMYCIN。纽厄尔甚至认为 MYCIN 才是真正的第一个专家系统，因为它首创了后来成为专家系统要素的产生式规则与不精确推理（PDF 第 66 页）。<\/p>\n<h3>2. 概念 3：专家系统与知识表示（难度：基础）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。成熟期最成功的案例是 DEC 的零部件配置系统 <strong>XCON<\/strong>：1980 年投入使用到 1986 年，按需求自动配置零部件；专家系统在 1980 年代初到 1990 年代初经历了约十年黄金期（PDF 第 67 页）。<\/p>\n<p>知识表示这条线还长出了常识库：雷纳特（Douglas Lenat，1950—2023）的 <strong>Cyc<\/strong> 用逻辑表达人类常识，被视为知识图谱的雏形。他 1984 年预言 1999 年每台计算机都得预装 Cyc，1986 年又估计常识规则至少要 2500 万条；Cyc 在 1990 年代初就被批评没有成功案例（PDF 第 72 页）。2010 年谷歌收购 Metaweb，命名为<strong>知识图谱（Knowledge Graph）<\/strong>；语义网推动者伯纳斯-李 2016 年获图灵奖（PDF 第 74–75 页）。<\/p>\n<h3>3. 第五代计算机：一次国家级押注<\/h3>\n<p>1978 年日本通商产业省组织研究下一代计算机系统，由元冈达（Tohru Moto-Oka，1929—1985）牵头；1981 年委员会提交 89 页报告《知识信息处理系统的挑战：第五代计算机系统初步报告》，提出六种先进体系结构。1981 年第一届五代机会议在日本信息处理开发中心（JIPDEC）召开，费根鲍姆和德国定理证明学者白贝尔（Wolfgang Bibel）作为外籍嘉宾出席（PDF 第 79–80 页）。<\/p>\n<p>五代机研究所（ICOT）所长是渕一博（Kazuhiro Fuchi，1936—2006）。技术上选定 <strong>Prolog<\/strong> 而不是更成熟的美国语言 LISP：沃伦（David Warren）1982 年在 AI Magazine 撰文分析，Prolog 在五代机各类应用中覆盖面最广，且在小规模基准测试中作为数据库查询语言不输关系代数；另一个现实因素是 LISP 是美国制造的，Prolog 相对全新（PDF 第 80、83–84 页）。<\/p>\n<p>为什么五代机会选逻辑程序？因为它继承了定理证明的陈述性表达：把问题陈述出来，推理机负责求解，这正是符号主义的工程延伸。十年计划预算 4.5 亿美元；作为回应，美国 1982 年成立 MCC（每年投资 7500 万美元），英国 1982 年夏启动阿尔维计划、1987 年放弃，欧洲 1983 年启动合作计划（PDF 第 84、88–89 页）。<\/p>\n<p>衰落的迹象在 1988 年已经露出：会议录从 1981 年的 280 多页膨胀到 1988 年三大卷 1300 页，内容失去聚焦。五代机没能证明它能干传统机器干不了的活，典型应用中也没快多少；项目 1994 年结束，渕一博转往东京大学任教，两年后退休（PDF 第 90–91 页）。本书的判断是：路线出错的核心原因是缺乏理论指导；五代机并非彻底失败，它留下了逻辑程序、并发 Prolog 等非物质遗产，只是被互联网的全社会浪潮盖过了光芒。<\/p>\n<h3>4. 概念 4：连接主义与感知机（难度：基础）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。神经网络的开山文章发表于 <strong>1943 年<\/strong>，作者麦卡洛克（Warren McCulloch，1898—1969）与皮茨（Walter Pitts，1923—1969）。1949 年神经心理学家赫布（Donald Hebb）出版《行为的组织》，提出后人称为赫布学习的规则（PDF 第 93–95 页）。<\/p>\n<p>1957 年，康奈尔大学实验心理学家罗森布拉特（Frank Rosenblatt，1928—1971）提出<strong>感知机（perceptron）<\/strong>模型，可完成简单模式识别；他在理论上证明单层网络在线性可分问题上可以收敛，并于 1962 年写成《神经动力学原理：感知机和大脑机制的理论》（PDF 第 96 页）。<\/p>\n<p>打压来自明斯基一方。他与 MIT 教授佩珀特（Seymour Papert）合作写出《感知机：计算几何学》（1969），证明单层神经网络不能解决 <strong>XOR（异或）<\/strong>问题。这一批判以充满敌意的方式呈现，对罗森布拉特是致命打击；感知机失败导致神经网络研究式微，经历了近二十年低谷（PDF 第 97–98 页）。1988 年该书再版时，明斯基删去第一版攻击罗森布拉特的句子，并手写“纪念罗森布拉特”；IEEE 2004 年设立罗森布拉特奖（PDF 第 98 页）。<\/p>\n<h3>5. 概念 5：反向传播与深度学习复兴（难度：进阶）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。1982 年物理学家霍普菲尔德（John Hopfield，1933—）提出霍普菲尔德网络，把网络看作带能量函数的系统，为低潮期的神经网络提供了物理学基础。1983–1986 年，辛顿（Geoffrey Hinton，1947—）与谢诺夫斯基（Terry Sejnowski）在原始霍普菲尔德网络中引入隐藏单元和概率分布，提出<strong>玻尔兹曼机<\/strong>（PDF 第 101–102 页）。<\/p>\n<p>多层网络的训练钥匙是<strong>反向传播<\/strong>：Werbos 1974 年已有相关文章，但当时没在神经网络圈子引起反响；1986 年鲁梅尔哈特（David Rumelhart）、辛顿和威廉姆斯（Ronald J. Williams）在《自然》杂志发表反向传播的压缩版本，把误差逐层回传、用梯度下降调整权重——作者并未引用 Werbos 1974 年的博士论文（PDF 第 111、118 页）。<\/p>\n<p>复兴的实测拐点在 2012 年：辛顿团队 SuperVision 在 ImageNet 大规模视觉识别挑战赛（ILSVRC）上以压倒性优势夺冠，网络因学生克里泽夫斯基（Alex Krizhevsky）得名 AlexNet，另一位学生是伊利亚·苏茨克维（Ilya Sutskever）。2018 年图灵奖颁给辛顿、本吉奥（Yoshua Bengio）和杨立昆（Yann LeCun）；2024 年霍普菲尔德与辛顿获诺贝尔物理学奖（PDF 第 113–115、105 页）。<\/p>\n<h2>完整推导 1：第五代计算机为什么在 1990 年代初归于沉寂<\/h2>\n<p>推理链按前提—条件—证据展开：<\/p>\n<ol><li>\n前提：五代机押注陈述性知识加自动推理，技术路线选 Prolog 而非 LISP，十年计划预算 4.5 亿美元（PDF 第 80、84 页）。\n<\/li><li>\n条件一，理论支撑不足：本书判断五代机技术路线出错的核心原因是缺乏理论指导；它要证明自己能干传统机器干不了的活，但典型应用中速度优势不明显（PDF 第 90 页）。\n<\/li><li>\n条件二，目标失焦：衰落迹象 1988 年已经露出，会议录从 1981 年 280 多页膨胀到 1988 年三大卷 1300 页，内容失去聚焦（PDF 第 90 页）。\n<\/li><li>\n条件三，外部浪潮覆盖：项目 1994 年结束，渕一博转往东京大学，两年后退休；逻辑程序、并行 Prolog 等遗产被后续技术吸收，但工程光芒被全社会的互联网浪潮盖过（PDF 第 91 页）。\n<p>反例检验：作为回应，美国 1982 年成立 MCC（每年 7500 万美元），英国 1982 年夏启动阿尔维计划、1987 年放弃，欧洲 1983 年启动合作计划；各国反应说明五代机不是孤立失败，符号工程整体在 1980 年代末失去前期势能（PDF 第 88–90 页）。<\/p>\n<\/ol>\n<h2>完整推导 2：神经网络为什么先经历近二十年寒冬，算法成形后又等到 2012 年才拐点<\/h2>\n<ol><li>\n第一层条件：1957 年感知机只在样本线性可分时收敛，单层结构表示能力有限（PDF 第 96 页）。\n<\/li><li>\n打压环节：1969 年《感知机：计算几何学》证明单层网络不能解决 XOR，批判以敌意方式呈现，连接主义进入近二十年低谷（PDF 第 97–98 页）。\n<\/li><li>\n算法环节：1982 年霍普菲尔德网络提供物理学基础，1983–1986 年玻尔兹曼机引入概率隐藏单元，1986 年反向传播加梯度下降解决多层权重调整问题（PDF 第 101–102、118 页）。\n<\/li><li>\n落地环节：算法不等于拐点——语音识别到 2009 年起合作、2011 年才突破；视觉任务等到 2012 年 AlexNet 在 ILSVRC 夺冠，数据规模、GPU 算力与网络结构同时到位后才形成实测突破（PDF 第 113 页）。\n<p>推论：连接主义两次起落的分界不在单个算法，而在结构、算法、数据、算力四件事是否凑齐。<\/p>\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[符号工程线] --&gt; B[DENDRAL 1960s]\nB --&gt; C[MYCIN 1976]\nC --&gt; D[XCON 1980-1986]\nD --&gt; E[Cyc 常识库 / 知识图谱]\nF[国家级押注] --&gt; G[日本五代机 1981-1994&lt;br/&gt;Prolog 逻辑程序]\nH[连接主义线] --&gt; I[麦卡洛克-皮茨 1943]\nI --&gt; J[感知机 1957]\nJ --&gt; K[《感知机》1969 批判&lt;br/&gt;近二十年寒冬]\nK --&gt; L[霍普菲尔德网络 1982 / 玻尔兹曼机]\nL --&gt; M[反向传播 1986]\nM --&gt; N[AlexNet 2012 / 深度学习]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面一条是“人把知识写成规则”的符号工程，下面一条是“数据调整连接”的连接工程；五代机是符号工程在国家层面的最后一次重注，而连接线在算法、算力、数据三者凑齐后才完成第二次起飞。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：专家系统像一位把办案口诀逐条写进笔记本的老刑警；遇到笔记本上没写过的新情况，它就无能为力。感知机像一块可调的窗帘布，能拉开两类直线可分的样本，但 XOR 这种弯扭分界它拉不平。\n<\/li><li>\n实例：MYCIN 的 69% vs 专科医生 80%，说明专家系统在窄领域能接近非专业水平，但离顶尖专家仍有距离；AlexNet 之前，语音识别 2009 年起由微软邓力小组与辛顿合作，用深度学习加隐马尔可夫模型在 2011 年取得突破（PDF 第 113 页）。\n<\/li><li>\n对照：五代机选 Prolog 是选“陈述性知识 + 自动推理”；深度学习选反向传播是选“数据 + 梯度调整连接”，二者对“智能从哪来”的回答完全不同。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：专家系统就是早期的大模型。<\/strong> 专家系统靠人工提炼规则，不具备从数据中归纳参数的能力；两者的知识获取方式正好相反。\n<\/li><li>\n<strong>误解：明斯基一直反对神经网络。<\/strong> 本书记载他的博士论文就是关于神经网络的，早期也是“吃啥补啥”派，后来才转向并与罗森布拉特决裂（PDF 第 97 页）。\n<\/li><li>\n<strong>误解：反向传播是 1986 年凭空发明的。<\/strong> Werbos 1974 年已有文章，1986 年论文是把反向传播加梯度下降放到多层神经网络上并获得广泛影响（PDF 第 111、118 页）。\n<\/li><li>\n<strong>误解：五代机死于技术指标不够快。<\/strong> 本书认为更核心的原因是缺乏理论指导、目标失焦；它在技术圈留下了逻辑程序与并行推理的遗产。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nDENDRAL 和 MYCIN 分别解决什么领域的问题？（答案：DENDRAL 由质谱数据推化学结构；MYCIN 做细菌感染诊断与处方。）\n<\/li><li>\n五代机为什么选 Prolog 而不是 LISP？（答案：Prolog 应用覆盖面广、小规模基准不输关系代数，且不是美国制造；背后是逻辑程序与陈述性表达的路线。）\n<\/li><li>\n单层感知机不能解决哪个逻辑问题？出自哪本书？（答案：XOR 异或；明斯基与佩珀特 1969 年《感知机：计算几何学》。）\n<\/li><li>\n1986 年反向传播《自然》论文的三位作者是谁？2012 年 ImageNet 夺冠团队的核心学生有哪两位？（答案：Rumelhart、Hinton、Williams；克里泽夫斯基与苏茨克维。）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>假设 1969 年《感知机》没有把单层局限表述成敌意批判，连接主义是否会提前回暖？书中证据给出两面：其一，XOR 的单层不可解是理论事实，即使表述温和，单层模型的能力边界仍在；其二，再版记录显示明斯基后来删去攻击句并手写纪念罗森布拉特，IEEE 2004 年设罗森布拉特奖，说明打压的舆论形态与理论结论是两件事（PDF 第 98 页）。较稳妥的反事实判断：温和表述会缩短资金与人心的冷却期，但多层训练方法未解决之前，回暖仍要等到反向传播与算力数据条件出现。<\/p>\n<p>另一条假设：如果五代机押注 LISP 而非 Prolog，结局是否不同？书中记载选 Prolog 的现实因素包括应用覆盖面与“LISP 是美国制造”（PDF 第 80、84 页）。但本书把失败主因归于缺乏理论指导与目标失焦，路线语言选择不是决定性变量；换成 LISP，符号工程面对的通用化与效率问题依然存在。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章承接第 1 章符号主义纲领：专家系统（c03）是窄领域规则工程，五代机是符号工程的国家计划；连接主义部分（c04、c05）为第 3 章的进化与强化路线、第 4 章的学习观埋下结构与算法基础。下一章离开符号与连接两条主线，进入向自然学习的路线、机器下棋和自然语言处理的范式切换。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n专家系统三站：DENDRAL（化学结构）→ MYCIN（诊断规则与不精确推理）→ XCON（配置工程）；长线落到 Cyc 与知识图谱。\n<\/li><li>\n五代机：1981 启动、1994 结束，Prolog/逻辑程序，预算 4.5 亿美元；教训是国家级工程需要理论指导，不能只靠野心与硬件。\n<\/li><li>\n神经网络两次起落：1943 模型 → 1957 感知机 → 1969 寒冬 → 1982 霍普菲尔德/1986 反向传播 → 2012 AlexNet 拐点。\n<\/li><li>\n人物对应：符号工程 = 费根鲍姆、布坎南、肖特莱福、雷纳特；连接线 = 麦卡洛克、皮茨、罗森布拉特、霍普菲尔德、辛顿、鲁梅尔哈特。\n<\/ul>", "ch03": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.120<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 3–5 章：专家系统、第五代机与神经网络的两次起落<\/a><\/span><\/div><h1>第 6–8 章：向自然学习、机器下棋与自然语言处理<\/h1>\n<blockquote>对应原书第 6 章《向自然学习：从遗传算法到强化学习》、第 7 章《计算机下棋简史：机定胜人，人定胜天》、第 8 章《自然语言处理》（PDF 第 120–176 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 3–5 章的两派起落\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分遗传算法（向进化学习）与强化学习（向奖励学习）两条“向自然学习”的路线，说出强化学习的要素、理论基础与代表人物；\n<\/li><li>\n梳理计算机下棋从图灵、香农的理论到塞缪尔跳棋、深蓝胜卡斯帕罗夫、AlphaGo 与 AlphaZero 的突破链；\n<\/li><li>\n讲清自然语言处理的四次范式切换：规则语言学 → 统计方法 → 深度学习 → 大语言模型准备期，以及词嵌入、Transformer、BERT/GPT 的位置。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>除了符号与连接，AI 还有第三条路：<strong>向生物的进化、试错与奖励学习<\/strong>；而下棋和语言这两块“最像智能”的试金石，分别检验了这条路线与统计/深度学习路线的成色。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 遗传算法：把进化论写进搜索<\/h3>\n<p>霍兰德（John Holland，1929—2015）本科在 MIT 学物理，博士阶段进入密歇根大学伯克斯（Arthur Burks）创立的跨学科通信科学计划，被视为计算机科学史上第一个博士。他受英国统计学家费舍《自然选择的遗传理论》启发——这本书把孟德尔遗传理论与达尔文自然选择结合起来——想到用种群、选择、交叉、变异来做搜索（PDF 第 120–123 页）。<\/p>\n<p><strong>遗传算法<\/strong>模拟种群进化：种群是数据，每一代按适应度挑选个体，交叉重组、随机变异，逐代逼近更好的解。1985 年第一届遗传算法国际会议召开，学科有了自己的共同体；1997 年 IEEE 开办《进化计算汇刊》。霍兰德的学生寇扎（John Koza）1987 年进一步提出<strong>遗传编程<\/strong>：让种群里的个体不是参数而是程序，进化的对象直接是代码（PDF 第 124–125 页）。<\/p>\n<p>为什么这条线在神经网络低谷期没被完全波及？因为它不依赖神经元模型，本质是受生物学启发的近似优化；后来深度学习成为普适学习实现机制后，遗传算法与强化学习才都被放进更统一的学习框架里讨论。<\/p>\n<h3>2. 强化学习：Agent 在奖励中学会策略<\/h3>\n<p>巴托（Andrew Barto，1948—）1975 年到马萨诸塞大学任教，他的第一个博士生是萨顿（Richard Sutton，1957—）。萨顿本科学心理学，研究动物如何适应环境；两人形成了关于学习的第一性原理——<strong>强化学习<\/strong>。理论基础之一是马尔可夫决策过程（MDP），另一块是动态规划：贝尔曼（Richard Bellman）在 1950 年代就发明了动态规划，巴托和萨顿承认早期受到它的启发（PDF 第 128–130 页）。<\/p>\n<p>强化学习的主体是 Agent：Agent 施加动作给环境，环境返回状态与奖励/惩罚；Agent 根据经验改变策略，以期达到长期最大奖励。巴托与萨顿把目标制导称为<strong>奖励假设<\/strong>（Reward is enough）：以长期奖励最大化为目标的学习，足以解释智能行为。本书记载，巴托与萨顿因强化学习获图灵奖（PDF 第 131 页；前言另记为 2025 年获奖，两处年份表述不一致，以原书第 6 章正文为准）。<\/p>\n<p>这条线的思想源头比 AI 学科还早：图灵 1948 年内部报告《智能机器》定义了可学习的 P 型机，只接受“快乐”和“痛苦”刺激，实际就是奖励与惩罚；明斯基 1954 年的博士论文也是关于强化学习的（PDF 第 131 页）。工程上，<strong>Q-Learning<\/strong> 由沃科金斯（Chris Watkins）1989 年在剑桥大学博士论文中提出（PDF 第 138 页）。<\/p>\n<h3>3. 概念 6：强化学习（难度：进阶）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。两个必须理解的基本张力：<\/p>\n<ul><li>\n<strong>探索 vs 利用<\/strong>：“抬头看路”是尝试未知动作获取新信息，“低头拉车”是选取当前已知最优动作；用希腊字母 <span class=\"katex-inline\">\\varepsilon<\/span> 表示学习率，平衡二者是强化学习的经典问题（PDF 第 132 页）。\n<\/li><li>\n<strong>延迟奖励<\/strong>：效果要等到多步以后才显现，这和监督学习立刻得到对错反馈不同；当状态空间很大时，神经网络被用作函数逼近器，于是长出深度强化学习。\n<\/ul>\n<p>2016 年 AlphaGo 击败李世石后，强化学习作为核心算法一夜之间成为显学。DeepMind 团队里有萨顿的四个学生，首席科学家席尔瓦（David Silver）是萨顿大弟子；2017 年 7 月 7 日 DeepMind 在萨顿所在的加拿大阿尔伯塔大学开办联合实验室，是其在英国以外的第一个研究机构（PDF 第 132–133 页）。萨顿 2019 年的两页短文《The Bitter Lesson》是他几十年研究的哲学总结：以通用算法（如强化学习）为基础、辅以不断增长的算力，智能自然会提升；当下工程师嘴边的 Scaling Law（缩放定律）正源于这一思路（PDF 第 133 页）。<\/p>\n<h3>4. 机器下棋：从纸上模拟到 AlphaZero<\/h3>\n<p>下棋一直是人类智能的标志之一。图灵 1947 年编写了第一款下棋程序，但当时机时宝贵轮不到上机；他的同事普林茨（Dietrich Prinz）1951 年延续这一思路。1951 年斯特雷奇（Christopher Strachey）在曼彻斯特 Mark 1 上写出第一款跳棋程序，图灵 1952 年曾与之对弈并轻松取胜。1956 年 IBM 的塞缪尔（Arthur Samuel）写出第二款跳棋程序，特点是自学习，被视为最早的机器学习程序之一（PDF 第 141 页）。<\/p>\n<p>理论框架上，冯诺伊曼与经济学家摩根斯顿（Oskar Morgenstern）合作的博弈论著作首次提出二人对弈的 <strong>Minimax 算法<\/strong>；这套博弈推演框架要求机器在对手最坏回应下选取最优着法。香农 1950 年在《哲学杂志》发表《计算机下棋程序》，开启计算机下棋的理论研究，其主要思路在后来的深蓝和 AlphaGo 中还能看到（PDF 第 142 页）。第一款可以走完全局的下棋程序是伯恩斯坦（Alex Bernstein）1958 年在 IBM 704 上开发的，每走一步要花 8 分钟（PDF 第 143 页）。<\/p>\n<p>象棋的里程碑是 <strong>深蓝<\/strong>：1996 年深蓝与卡斯帕罗夫（Garry Kasparov）首次对弈六局；1997 年再战，卡斯帕罗夫先赢一局后趋于保守，最终认输，深蓝成为第一位战胜当时世界冠军的机器（PDF 第 146 页）。围棋方面，AlphaGo 是强化学习最早的工业级应用；早期版本借助人类棋谱，随后的 AlphaGo Zero 完全摆脱人类棋谱，“Zero”的一层含义就是零人类知识；再往后的 AlphaZero 在对弈类游戏中通用化（PDF 第 147 页）。<\/p>\n<h3>5. 自然语言处理：四次范式切换<\/h3>\n<p>1953–1954 年，IBM 资助乔治敦大学做了有史以来第一次机器翻译实验。1964 年美国政府资助机构责成评估，结论是机器翻译比人工慢、更不准、成本更高（估计贵两倍），可预见未来无法实用，应停止资助（PDF 第 149–150 页）。<\/p>\n<p>第一阶段是<strong>专家语言学知识<\/strong>，代表人物乔姆斯基（Noam Chomsky，1928—）。他的句法分层与自动机有深刻对应：3 型文法等价有限自动机，1 型文法等价线性有界非确定图灵机，0 型文法等价图灵机。乔姆斯基认为语言结构是内在的，不是通过经验习得的；他不认可语言学的统计方法，视统计为行为主义（PDF 第 150–154 页）。<\/p>\n<p>第二阶段是<strong>统计方法<\/strong>。1988 年 IBM Thomas J. Watson 研究中心机器翻译小组发表统计机器翻译论文，推出法语-英语系统 <strong>CANDIDE<\/strong>，标志统计派在大数据支持下回潮。贾里尼克（Fred Jelinek）一派的学术训练是信息论，统计是他们最自然的工具；小组成员寇克（John Cocke）1987 年因 RISC 架构获图灵奖（PDF 第 167 页）。统计方法的工程好处是：工程师不需要具备语言学知识，也不必懂源语言或目标语言。<\/p>\n<p>第三阶段是<strong>深度学习<\/strong>，第四阶段是大语言模型准备期。辛顿 1980 年代后期的词分布式表示工作引入词向量概念；2013 年谷歌在 <strong>word2vec<\/strong> 中率先工程实现词嵌入；2016 年谷歌发布神经机器翻译系统 GNMT，取代上一代统计翻译，误差降低约 60%（PDF 第 169 页）。2017 年谷歌团队提出 <strong>Transformer<\/strong>，基于注意力机制解除训练并行性限制；此后谷歌走双向编码器 <strong>BERT<\/strong>（Encoder-only）路线，OpenAI 走单向 <strong>GPT<\/strong>（Decoder-only）路线，GPT 更通俗的解释就是 NTP（next token prediction）。2020 年 GPT-3 问世后 NTP 方法反超；2022 年 11 月 30 日 ChatGPT 横空出世，进步速度以月计（PDF 第 170–171 页）。<\/p>\n<h3>6. 概念 7：统计 NLP、词嵌入与 Transformer（难度：进阶）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。本书把 NLP 范式概括为：规则约 40 年 → 统计与浅层学习约 20 年 → 深度学习不到 10 年 → 大模型准备期约 5 年；每个阶段时长逐渐缩短（PDF 第 7、171 页）。<\/p>\n<h2>完整推导 1：强化学习为什么在 2016 年之后成为显学<\/h2>\n<ol><li>\n理论前提：MDP 提供状态—动作—转移—回报模型，动态规划提供多步递推；巴托与萨顿把长期回报最大化为学习目标，形成奖励假设（PDF 第 128–131 页）。\n<\/li><li>\n算法积累：Q-Learning 由沃科金斯 1989 年剑桥博士论文提出，探索与利用的权衡有了可操作框架（PDF 第 132、138 页）。\n<\/li><li>\n工程触发点：2016 年 AlphaGo 击败李世石，强化学习作为核心算法一夜成名；对弈推演从人类棋谱与自我对弈中同时获得策略更新；DeepMind 团队有萨顿四名学生，首席科学家席尔瓦是萨顿大弟子，2017 年 7 月在阿尔伯塔大学设联合实验室（PDF 第 132–133 页）。\n<\/li><li>\n路线沉淀：萨顿 2019 年《The Bitter Lesson》主张通用算法加增长算力自然提升智能，Scaling Law 思路由此承接（PDF 第 133 页）。\n<p>推论：理论积累数十年，成为显学仍要等到封闭规则任务、深度表示能力与工程环境同时成熟；反例检验是强化学习并未局限于游戏，后续进入芯片布局、蛋白质折叠等固定规则场景（PDF 第 134–135 页）。<\/p>\n<\/ol>\n<h2>完整推导 2：自然语言处理为什么沿规则→统计→深度学习→大模型准备期切换<\/h2>\n<ol><li>\n规则阶段条件：乔姆斯基句法理论给出文法层次，文法与自动机等价；早期机器翻译 1953–1954 年起步，1964 年评估判定短期不可实用（PDF 第 149–154 页）。规则追求解释语言结构，代价是规则追不上真实语料变体。\n<\/li><li>\n统计阶段条件：信息论训练背景的贾里尼克一派用平行语料估计搭配概率，1988 年 CANDIDE 法英系统标志统计派回潮；工程师不必懂源语言与目标语言（PDF 第 167 页）。\n<\/li><li>\n表示与架构条件：词分布式表示先引入词向量，2013 年 word2vec 工程实现词嵌入，2016 年 GNMT 把统计翻译误差降低约 60%；2017 年 Transformer 用注意力机制解除训练并行限制，BERT 与 GPT 分出双向掩码与单向续写两条路线（PDF 第 169–170 页）。\n<\/li><li>\n结论落点：每一步切换都把更多判断交给数据与算法；阶段时长从约 40 年、20 年、不到 10 年缩到约 5 年，后一阶段站在前一阶段结果上推进（PDF 第 7、171 页）。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[向自然学习] --&gt; B[遗传算法 霍兰德 1975 著作]\nA --&gt; C[强化学习 巴托/萨顿]\nC --&gt; D[MDP + 动态规划]\nC --&gt; E[Q-Learning 1989 Watkins]\nC --&gt; F[AlphaGo 2016 / AlphaZero]\nG[机器下棋] --&gt; H[香农 1950 Minimax 思路]\nH --&gt; I[塞缪尔跳棋 1956]\nI --&gt; J[深蓝 1997 胜卡斯帕罗夫]\nJ --&gt; F\nK[NLP 范式] --&gt; L[规则/乔姆斯基]\nK --&gt; M[统计 CANDIDE 1988]\nK --&gt; N[深度学习 word2vec 2013 / GNMT 2016]\nN --&gt; O[Transformer 2017 → BERT / GPT]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：强化学习与下棋在 AlphaGo 处合流；NLP 的范式切换则沿着“人写规则 → 数据出统计 → 数据出表示 → 架构出通用模型”的方向移动，每一步都把更多判断交给数据和算法。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：强化学习像训狗——不给逐条指令，只在动作对了给奖励、错了给惩罚，狗自己摸索出策略；遗传算法像同时养一大群方案，淘汰差的、让好的杂交变异。\n<\/li><li>\n实例：塞缪尔跳棋是最早的自学习程序之一；深蓝团队多非 AI 出身，更像“锤子派”的硬件与搜索胜利；AlphaGo Zero 不看人类棋谱，靠自我对弈生成数据，这是强化学习不依赖人类示范的典型例子。\n<\/li><li>\n对照：乔姆斯基要的是“解释”（语言为什么有此结构），统计派给的是“描述”（语料里什么搭配最常见）；本书引科学方法的区分：统计方法可看作一种描述，但不是解释（PDF 第 154 页）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：强化学习就是打游戏。<\/strong> 游戏只是早期环境容易定义的试验场；MDP、动态规划与奖励假设是理论骨架，芯片布局、蛋白质折叠等固定规则场景后来都用了强化学习（PDF 第 134–135 页）。\n<\/li><li>\n<strong>误解：深蓝赢棋靠的是人工智能的新理论。<\/strong> 本书记载深蓝团队并非 AI 出身，胜利更多来自专用硬件、搜索工程与评估函数；团队甚至不认为机器表现出了智能（PDF 第 146 页）。\n<\/li><li>\n<strong>误解：BERT 和 GPT 的差别只是训练语料。<\/strong> 核心差别在预测方式：BERT 双向掩码猜被遮住的词，GPT 单向做 next token prediction；Transformer 只是共同的底层架构（PDF 第 170、215 页）。\n<\/li><li>\n<strong>误解：统计派不需要语言学。<\/strong> 工程上确实可以不懂源语言和目标语言做翻译模型，但这并不意味着语言学问题消失了，只是被推后到模型内部表示里。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n强化学习的理论基础是哪两块？奖励假设是谁提出的？（答案：马尔可夫决策过程 + 动态规划；巴托与萨顿。）\n<\/li><li>\n第一款可以走完全局的下棋程序是哪年、谁在哪台机器上写的？（答案：1958 年伯恩斯坦，IBM 704。）\n<\/li><li>\nNLP 四个阶段各自的代表方法和时间尺度是什么？（答案：规则语言学约 40 年；统计与浅层学习约 20 年；深度学习不到 10 年；大模型准备期约 5 年。）\n<\/li><li>\nword2vec 与 Transformer 分别是哪一年、由谁推出的？（答案：2013 年谷歌 word2vec；2017 年谷歌团队 Transformer。）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>假设 1950 年代算力已经足够，司马贺 1957 年“十年内计算机下棋击败人类”的预言是否会按时兑现？书中记录：预言在 1957 年做出，机器到 1997 年才由深蓝战胜卡斯帕罗夫，延迟约四十年（PDF 第 27、41、146 页）。反事实判断要分两层：搜索与评估思路在香农 1950 年论文中已成形，瓶颈在硬件速度、搜索工程与评估函数，而非理论空白；若算力提前到位，棋类程序会更早逼近人类水平，但 AlphaGo 依赖的深度表示与自我对弈数据仍需后续条件。<\/p>\n<p>另一条假设：如果早期统计翻译拥有今天规模的平行语料，规则路线是否还能维持四十年？书中证据是统计方法在 1988 年 CANDIDE 上已显示工程优势，规则派的存续更多依赖语料规模不足与语言学解释诉求（PDF 第 167、183 页）。语料提前只会加速统计替代规则，不会改变描述与解释之争的性质。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章把行为路线（c06）与语言工程（c07）接到前两章的符号、连接主线上：强化学习后来被所罗门诺夫归纳框架解释为在线学习；Transformer 与 GPT 的预测机制在第 4 章回收为 next token prediction 的理论前身。下一章回到语言与思维之争，进入计算理论基础和大语言模型的学习观。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n进化线：霍兰德遗传算法 → 寇扎遗传编程；奖励线：巴托/萨顿强化学习，MDP + 动态规划，Q-Learning 1989，AlphaGo 2016。\n<\/li><li>\n下棋史：图灵 1947 程序 → 香农 1950 理论 → 塞缪尔 1956 跳棋 → 深蓝 1997 → AlphaGo/Zero/AlphaZero。\n<\/li><li>\nNLP 四范式：规则（乔姆斯基）→ 统计（CANDIDE 1988）→ 深度学习（word2vec 2013、GNMT 2016）→ Transformer 2017 与 BERT/GPT 分野。\n<\/li><li>\n人物对照：进化/奖励 = 霍兰德、巴托、萨顿、沃特金斯；下棋 = 香农、塞缪尔、许峰雄、席尔瓦；语言 = 乔姆斯基、贾里尼克、寇克、诺维格。\n<\/ul>", "ch04": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.177<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 6–8 章：向自然学习、机器下棋与自然语言处理<\/a><\/span><\/div><h1>第 9–11 章：语言、计算理论与大语言模型<\/h1>\n<blockquote>对应原书第 9 章《语言等于思维吗？》、第 10 章《人是机器吗？——人工智能的计算理论基础》、第 11 章《什么是学习？——大语言模型的理论与实践》（PDF 第 177–219 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 6–8 章的 NLP 与强化学习脉络\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n复述乔姆斯基“思维即语言”的立场及其与经验主义、连接主义的分歧，说明语言之争为什么回到计算理论；\n<\/li><li>\n讲清图灵机、丘奇-图灵论题、相似性原则、通用图灵机的位置，以及可计算性与计算复杂性两个层面的区别；\n<\/li><li>\n解释所罗门诺夫归纳、柯尔莫哥洛夫-所罗门诺夫-蔡汀（SKC）复杂性为什么是大语言模型的理论前身，并把“学习即压缩”“next token prediction”“BERT/GPT 分野”串成一条线。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>大语言模型把“语言等于思维吗”这个老哲学问题逼成了计算问题：<strong>如果承认丘奇-图灵论题，语言官能就是某种自动机，而学习在算法信息论看来就是找最短程序、做压缩<\/strong>；工程上的 next token prediction 是这一思想的近似落地。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 语言等于思维吗：一场被 ChatGPT 重新点燃的争论<\/h3>\n<p>ChatGPT 于 2022 年 11 月 30 日问世。2023 年 3 月 8 日，近 95 岁的乔姆斯基在《纽约时报》发表特邀文章《ChatGPT 的虚假承诺》，对大语言模型不买账。本书记载了一个反转：乔姆斯基最出名的“John 不可理喻”式例句被网民丢给 ChatGPT，模型准确理解了深层含义，乔姆斯基被“打了脸”（PDF 第 177 页）。<\/p>\n<p>乔姆斯基一生的两条主线被本书概括为“柏拉图之问”和“奥威尔之问”：做学问贴近柏拉图（理性主义、内在结构），从事政治活动遵循奥威尔（怀疑权威、同情人民）。他的核心思想是<strong>思维由语言生成<\/strong>（“思维即语言”）：语言结构是内在的，不是经验习得的；交流功能只是思想功能的外化，思想在先、交流在后（PDF 第 177–179 页）。<\/p>\n<p>为什么这个语言学问题绕不开计算机科学？因为乔姆斯基文法层次与自动机等价：3 型文法等价有限自动机，0 型文法等价图灵机。本书点出一个推论：<strong>如果承认语言等于思维，实际上就承认了图灵机可以思维<\/strong>；反过来，连接主义者辛顿批评乔姆斯基的理性主义，认为语言不需要先天结构，靠后天数据驱动的学习就可习得，而乔姆斯基批评神经网络端到端方法导致语言学结果无法被解释（PDF 第 179、183 页）。<\/p>\n<p>这里要分清两层：乔姆斯基与统计/连接派争的是“语言能力从哪来”（先天结构还是后天数据）；而计算理论追问的是“任何智能活动能被什么装置实现”。前者是科学立场之争，后者是可计算性边界之争。<\/p>\n<h3>2. 概念 9：图灵机与丘奇-图灵论题（难度：基础）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。计算机科学起源于图灵 1936 年《论可计算的数》：他定义了一条无穷纸带、一个读写头、在控制装置下读写 0/1 的装置；丘奇 1937 年在《符号逻辑杂志》对该文的评论里首次使用“图灵机”一词（PDF 第 184、186 页）。<\/p>\n<p><strong>丘奇-图灵论题<\/strong>：所有功能足够强的计算装置，计算能力都等价于图灵机。本书强调这是一个<strong>观察，而不是定理<\/strong>——无法证明不会出现新的更强装置；当时递归函数、λ 演算、Post 系统、图灵机等已被证明可互相模拟（PDF 第 185–186 页）。<\/p>\n<p><strong>通用图灵机（UTM）<\/strong>的思想同样深刻：一台图灵机的执行过程可以编码成数据放上纸带，另一台图灵机读出编码指令并逐步模仿它。被编码的图灵机就是软件；冯诺伊曼存储程序架构的思想正来自这里（PDF 第 188 页）。<\/p>\n<p>在可计算性层面之外，还有<strong>计算复杂性<\/strong>层面：非确定性图灵机上多项式时间可解的问题简称 NP，确定性图灵机上多项式时间可解的是 P。洪加威提出的相似性原则（也称强丘奇-图灵论题/扩展论题）讨论不同计算模型之间模拟的成本，它同样是工作假设而非数学定理（PDF 第 189–190 页）。本书提醒：一台机器可以在可计算性上满足丘奇-图灵论题，却在复杂性层面不服从相似性原则——能模拟，但不能在多项式时间内模拟，这也算一种“超计算”（PDF 第 191 页）。<\/p>\n<h3>3. 人是机器吗：理论立场的几个岔路<\/h3>\n<p>图灵本人提出过 oracle（天启）思想：一台图灵机可以问 oracle 任何问题，当 oracle 能力超过图灵机时，就有了超计算。彭罗斯（Roger Penrose）用“非算法”、有人用“超图灵/超级图灵”指称这类装置（PDF 第 190–191 页）。<\/p>\n<p>计算模型并不只有图灵机：BSS 模型（布卢姆一家三口）假设任意精度实数之间的比较是单位时间的，在 BSS 模型里一阶逻辑所有东西都可判定，这与图灵机上停机问题不可判定截然不同；差别可溯源到哥德尔证明算术不可判定、塔尔斯基证明实数一阶理论（初等几何与代数）可判定这两条逻辑线（PDF 第 191–192 页）。多依奇（David Deutsch）首创通用量子图灵机模型，提出丘奇-图灵-多依奇原理，在计算里加入物理内容：经典图灵机约束是经典物理，量子图灵机约束是量子物理；量子计算机不能求解图灵机不可计算的问题，但在某些条件下可能违背强丘奇-图灵论题（PDF 第 193–194 页）。<\/p>\n<p>本书给出的工作判断是：如果认可丘奇-图灵论题和相似性原则，那么人就是图灵机；目前所有 AI 工作都建立在这个认同之上。争议主要剩下两处跳跃：图灵机到量子计算的跳跃、经典物理到量子物理的跳跃（PDF 第 196、199 页）。<\/p>\n<h3>4. 概念 8：所罗门诺夫归纳与算法信息论（难度：高难）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。所罗门诺夫（Ray Solomonoff）是达特茅斯会议上最认真对待会议的人，整个暑假都在会；他 1951 年在芝加哥大学跟随卡尔纳普（Rudolf Carnap），归纳推理成为毕生方向。1956 年 8 月 14 日他把打字稿给参会人员传阅；工作首次公开发表于 1960 年加州理工会议，1964 年以《A Formal Theory of Inductive Inference》正式发表在《信息与控制》（PDF 第 201、204–206 页）。<\/p>\n<p><strong>所罗门诺夫归纳法<\/strong>：给定序列 <span class=\"katex-inline\">(x_1,x_2,\\dots,x_n)<\/span>，预测 <span class=\"katex-inline\">x_{n+1}<\/span>；归纳推理力图找到一个编码长度最短的图灵机程序，为已知序列建模，从而准确预测后续序列。序列的描述复杂度，就是输出该序列的最短图灵机程序长度（PDF 第 206 页）。<\/p>\n<p>这一机制与大模型的对应关系在本书里讲得很直接：<\/p>\n<ul><li>\n它就是以 GPT 为代表的大语言模型核心机制 <strong>next token prediction<\/strong> 的理论前身；能对已知数据做出概括的图灵机就是大模型。\n<\/li><li>\n在同样数据集上，期望覆盖数据且最经济（最短）的图灵机；<strong>学习可以被当作压缩<\/strong>，参数量与 token 量的关系也可借此研究。\n<\/li><li>\n所罗门诺夫归纳可能不停机，只能用近似算法，放宽对“最小性”和预测准确性的限制；神经网络作为通用逼近器，是实现这一归纳的候选机制（PDF 第 207 页）。\n<\/ul>\n<h3>5. SKC 复杂性：不可计算的最优压缩<\/h3>\n<p>柯尔莫哥洛夫（Andrey Kolmogorov）1965 年创办刊物并提出现在所称的<strong>柯尔莫哥洛夫复杂性<\/strong>；他后来注意到所罗门诺夫的工作，1968 年分别用俄文和英文发表文章引用所罗门诺夫，使后者在苏联名声比在西方更响。蔡汀（Gregory Chaitin）独立确认了柯尔莫哥洛夫的工作；三人的理论合称所罗门诺夫-柯尔莫哥洛夫-蔡汀复杂性（SKC 复杂性），也称算法熵、描述复杂性（PDF 第 208–210 页）。<\/p>\n<p>不变性定理：不同程序表示（C、Java、Python、图灵机代码）对应的最短描述长度只差一个常量；这一定理可看作丘奇-图灵论题的推论。但柯尔莫哥洛夫复杂性是<strong>不可计算的<\/strong>——最优压缩不存在通用算法，工程上只能用贝叶斯概率近似（PDF 第 209、218 页）。列文（Leonid Levin）在柯尔莫哥洛夫复杂性基础上加时间限制，提出 L-search 通用搜索过程，复杂性于是变得可计算（PDF 第 212–213 页）。<\/p>\n<p>本书还给出一组对应：压缩时间对应训练时间，柯尔莫哥洛夫复杂性对应模型参数量，逻辑深度对应最短“推断”（inference）时间；并提醒大模型术语里的 inference 更合适的译法是“推断”（统计意义），有别于逻辑意义上的“推理”（reasoning）（PDF 第 214 页）。<\/p>\n<h3>6. Scaling 之后的学习观：BERT、GPT 与归纳框架<\/h3>\n<p>回到工程分野：谷歌的 BERT 可描述为“给定序列抽走 <span class=\"katex-inline\">x_i<\/span>，猜 <span class=\"katex-inline\">x_i<\/span> 是什么”（掩码、双向）；OpenAI 的 GPT 采用单向 next token prediction。本书指出，Transformer 只是实现 next token prediction 的一种特定神经网络架构，探索非神经网络实现所罗门诺夫归纳的机制仍是开放课题（PDF 第 215–216 页）。<\/p>\n<p>2023 年 8 月，OpenAI 首席科学家伊利亚·苏茨克维在赛蒙斯计算理论研究所（Simons Institute）演讲中明确透露：GPT 的数学依据就是所罗门诺夫归纳法（Sutskever, 2023）。在这一框架下，离线学习（监督学习）和在线学习（强化学习）都能得到计算理论解释：建模就是压缩，压缩由图灵机完成；科学革命、奥卡姆剃刀、波普尔证伪都可作为所罗门诺夫归纳的特例或近似——能覆盖所有数据的最小模型，就是最短的程序或最小的图灵机（PDF 第 216–218 页）。<\/p>\n<p>为什么这套学习观在 scaling 时代显得重要？因为当模型规模、数据和算力同时扩大时，“通用算法 + 增长算力”的路线（萨顿《The Bitter Lesson》的思路）压过了手工知识路线；而所罗门诺夫- SKC 理论为这条路线提供了第一性原理层面的解释：预测能力来自对数据的压缩概括，压缩的定量度量就是 SKC 复杂性。本书同时保留谨慎：所罗门诺夫归纳与 SKC 复杂性普遍不可计算，理论暂时落后于工程实践，大模型评价也落后于开发（PDF 第 216、218 页）。<\/p>\n<h2>完整推导 1：语言之争为什么必须回到计算理论<\/h2>\n<ol><li>\n立场前提：乔姆斯基主张思维由语言生成，语言结构内在、非经验习得；辛顿一派主张数据驱动学习，乔姆斯基则批评端到端结果无法解释（PDF 第 177–183 页）。\n<\/li><li>\n形式化环节：乔姆斯基文法层次与自动机对应，3 型文法等价有限自动机，0 型文法等价图灵机（PDF 第 179、187 页）。\n<\/li><li>\n推论环节：如果承认语言等于思维，又承认 0 型文法等价图灵机，就必须面对“图灵机能否思维”的计算问题；语言学争论由此被翻译成可计算性与装置能力问题。\n<\/li><li>\n边界落点：丘奇-图灵论题是观察而非定理；认可论题与相似性原则，人才被当作图灵机，现有 AI 工作都建立在这一认同之上（PDF 第 186、196 页）。反例检验：oracle、非算法、超图灵等说法属于理论边界设想，不是已实现装置（PDF 第 190–191 页）。\n<\/ol>\n<h2>完整推导 2：所罗门诺夫归纳怎样推到 next token prediction，理论为什么仍落后工程<\/h2>\n<ol><li>\n归纳构造：给定序列 <span class=\"katex-inline\">(x_1,\\dots,x_n)<\/span>，找编码长度最短、能生成已知序列的图灵机程序，先验概率随程序长度指数衰减，据此预测 <span class=\"katex-inline\">x_{n+1}<\/span>（PDF 第 206 页）。\n<\/li><li>\n对应环节：能概括已知数据的图灵机就是大模型，这一机制即 GPT 的 next token prediction；学习被看作压缩，神经网络是通用逼近器候选（PDF 第 207 页）。\n<\/li><li>\n复杂性环节：最短程序长度即 SKC 复杂性；不变性定理说不同程序表示下最短描述长度只差常量；但 SKC 复杂性普遍不可计算，工程只能用贝叶斯概率近似（PDF 第 209、218 页）。\n<\/li><li>\n工程确认：2023 年 8 月伊利亚在赛蒙斯计算理论研究所演讲确认 GPT 的数学依据是所罗门诺夫归纳（PDF 第 216、219 页）。限制落点：归纳可能不停机，列文加时间限制的 L-search 才使搜索可计算；大模型评价仍落后于开发（PDF 第 213、216 页）。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[语言之争: 乔姆斯基 思维即语言] --&gt; B{承认丘奇-图灵论题?}\nB --&gt;|是| C[语言官能 ≡ 某种自动机&lt;br/&gt;0 型文法 ≡ 图灵机]\nB --&gt;|否| D[需超计算/非算法装置]\nE[计算理论基础] --&gt; F[图灵机 1936]\nF --&gt; G[丘奇-图灵论题: 观察非定理]\nF --&gt; H[通用图灵机: 程序即数据]\nG --&gt; I[可计算性层面]\nG --&gt; J[复杂性层面: 相似性原则]\nK[算法信息论] --&gt; L[所罗门诺夫归纳 1956/1964]\nL --&gt; M[SKC 复杂性: 不可计算]\nL --&gt; N[next token prediction]\nN --&gt; O[GPT 单向 NTP]\nN --&gt; P[BERT 双向掩码]\nM --&gt; Q[学习即压缩]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上半段是哲学与可计算性的分叉，下半段是学习的理论骨架；所罗门诺夫归纳把“预测序列”和“找最短程序”统一起来，大模型工程是这一思想在神经网络上的近似实现。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：所罗门诺夫归纳像找一个能压缩整套故事的最短剧本大纲——大纲越短，越能预测后续情节；SKC 复杂性就是这份大纲的理论长度，而写出绝对最短大纲在数学上做不到。\n<\/li><li>\n实例：伊利亚 2023 年 8 月的演讲把 GPT 与所罗门诺夫归纳直接挂钩；而 BERT 的掩码预测更像做完形填空，GPT 的 NTP 更像顺着故事往下续写，两者在本书框架里都是序列预测的不同变体。\n<\/li><li>\n对照：图灵 1948 年《智能机器》里的 P 型机只接受快乐/痛苦刺激，是强化学习奖励惩罚的雏形；到第 11 章，强化学习又被放回所罗门诺夫归纳的统一框架内解释（PDF 第 131、218 页）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：丘奇-图灵论题是一条已被证明的定理。<\/strong> 本书明确它是观察：当时各种装置可互相模拟，但无法排除未来出现更强装置（PDF 第 186 页）。\n<\/li><li>\n<strong>误解：量子计算机能算出图灵机不可计算的问题。<\/strong> 本书立场是不能；量子计算只在某些条件下违背强丘奇-图灵论题（复杂性层面），不违背可计算性层面的论题（PDF 第 194 页）。\n<\/li><li>\n<strong>误解：大模型的理论基础是 Transformer 架构。<\/strong> 本书区分：Transformer 只是实现 next token prediction 的一种手段；理论前身是所罗门诺夫归纳与算法信息论，架构是工程选择（PDF 第 215–216 页）。\n<\/li><li>\n<strong>误解：学习即压缩意味着模型把知识背下来。<\/strong> 压缩要求的是概括出最短程序/表示，共相的表示比诸多殊相经济；不可计算的是最优压缩，实际模型给出的是近似。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n乔姆斯基“思维即语言”与辛顿的数据驱动学习，分歧在哪一层？（答案：语言能力来自先天结构还是后天数据；二者都可被放进“语言官能是否等价自动机”的计算问题里审视。）\n<\/li><li>\n丘奇-图灵论题和相似性原则分别对应哪个层面？为什么说它们不是定理？（答案：前者对应可计算性，后者对应计算复杂性；二者都是基于已有装置互相模拟的观察/工作假设，无法对未来装置严格证明。）\n<\/li><li>\n所罗门诺夫归纳怎么定义？为什么说学习即压缩？（答案：找最短程序为已知序列建模并预测下一个元素；建模即概括，概括的经济程度就是压缩，最短程序对应最小模型。）\n<\/li><li>\nBERT 与 GPT 的预测方式差别是什么？Transformer 在其中处于什么位置？（答案：BERT 双向掩码猜被遮住的词，GPT 单向 NTP；Transformer 是二者共用的底层架构，不是理论本身。）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>假设丘奇-图灵论题不成立，AI 立场会怎样变化？书中判断是：论题与相似性原则是现有 AI 工作的默认认同——认可它们，人就是图灵机；如果论题被更强装置突破，符号、连接、强化各路线的实现边界都要重写（PDF 第 196、199 页）。但这一假设在本书记录里没有落地证据：量子计算不能求解图灵机不可计算的问题，只可能在复杂性层面违背强论题（PDF 第 194 页）。<\/p>\n<p>另一条假设：所罗门诺夫归纳若在 1960 年代即被工程化，大模型是否会提前出现？书中记载研究停滞近二十年，最终实现归纳机制的恰是神经网络（PDF 第 204 页）。反事实判断：理论可以早提出，实现仍受通用逼近装置、数据规模与算力约束；不可计算的最优压缩这一环不会因时间提前而消失，工程近似路线依旧需要后来的网络结构。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章回收前三章的两条伏笔：计算理论底座（c09）支撑符号、连接、强化所有实现；归纳框架（c08）把监督学习、强化学习与序列预测统一成压缩过程。至此，符号主义、连接主义、行为路线与大模型学习观在同一套可计算性—归纳语言下合拢。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n语言之争：乔姆斯基理性主义/内在结构 vs 辛顿经验主义/数据驱动；0 型文法等价图灵机是两边都绕不开的计算事实。\n<\/li><li>\n计算理论：图灵机 1936 → CTT（观察非定理）→ UTM 程序即数据 → 相似性原则（复杂性层面）→ BSS/量子模型的边界。\n<\/li><li>\n算法信息论：所罗门诺夫归纳（最短程序预测下一项）→ SKC 复杂性（不可计算，贝叶斯近似）→ 学习即压缩。\n<\/li><li>\n工程落点：next token prediction；GPT 单向、BERT 双向；伊利亚 2023 年 8 月演讲确认 GPT 的所罗门诺夫归纳依据；理论落后于工程仍是现状。\n<\/ul>", "c01": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.17<\/div><h1>符号主义与物理符号系统假说<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1–2 章\n<\/ul>\n<h2>问题<\/h2>\n<p>1950 年代中期，研究者要回答一个具体困难：智能活动能不能不依赖大脑的生理结构，只在描述层面被机器复刻？纽厄尔与司马贺在兰德公司、卡内基-梅隆的合作需要一条明确纲领，否则“用计算机模拟智能”只是一句口号。如果没有这条纲领，早期 AI 会把神经元模拟和心智功能研究混在一起，方法与评价标准都无法统一。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>物理符号系统假说<\/strong>由纽厄尔与司马贺提出（PDF 第 17 页），逐句拆开：<\/p>\n<ul><li>\n“物理符号”：符号对应物理客体，不是凭空的记号；\n<\/li><li>\n“操作”：智能表现为对符号的识别、组合、替换与推理；\n<\/li><li>\n“假说”：这是一条可检验的研究立场，不是已被证明的定理。\n<p>合起来：智能是对符号的操作，最原始的符号对应于物理客体。符号主义这一路线，假定世界可被拆成客体、关系与规则，机器操作这些符号即可表现出智能。<\/p>\n<\/ul>\n<h2>推导<\/h2>\n<p>推理链分三步。第一步，观察人类解题：人证明定理、下棋、诊断问题时，处理的是概念与关系，而非直接处理神经元放电。第二步，由此抽出假设：只要机器能表示客体符号、按规则变换符号，就不必复刻大脑结构。第三步，工程落地：纽厄尔与司马贺的“逻辑理论家”证明《数学原理》命题逻辑子集（PDF 第 23 页），是这条假设的第一次演示；后续定理证明、专家系统、逻辑程序都沿这条思路展开。每一步的依据是书中记载的人物谱系与系统案例，而不是哲学断言。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>假说在“边界清楚、知识可显性写成规则”的领域好用：定理证明、窄领域诊断、零部件配置。边界在于：常识难以穷尽表示，感知（视觉、语音）无法直接写成符号规则；当问题需要从大量实例中归纳模式时，符号表示的获取成本迅速上升。条件去掉会怎样：如果放弃“符号可显性表示”这条假设，剩下的路线就是从数据中调整连接，即连接主义；如果放弃“符号操作即智能”，就退回到对大脑结构的直接模拟。<\/p>\n<h2>反例<\/h2>\n<p>本书记载的反例是常识工程：雷纳特的 Cyc 用逻辑表达人类常识，1984 年预言 1999 年每台计算机预装 Cyc，1986 年估计需要约 2500 万条规则，1990 年代初即被批评没有成功案例（PDF 第 72 页）。这说明客体与关系虽可符号化，但常识的体量与隐性程度超出手工规则库的承载能力。<\/p>\n<
