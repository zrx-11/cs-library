h2>辨析<\/h2>\n<p>与最近邻的连接主义差在哪一步：符号主义在描述层把智能归于符号操作，知识由人提炼入库；连接主义把智能归于连接强度调整，知识由数据训练出来。两者的分歧不在“机器要不要算”，而在知识从规则来还是从数据来。与控制论路线的差别：符号派刻意与维纳的控制论划清界限，关注符号推理而非反馈调节（PDF 第 18、127 页）。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：图灵机与可计算性观念（c09）提供“符号可被机器处理”的底座。后继：自动定理证明与归结原理（c02）是符号主义最早的技术阵地；专家系统与知识表示（c03）是它的工程落地。本概念把达特茅斯会议的人物谱系与后来三条 AI 路线的分野串在一起。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（符号主义与物理符号系统假说）<\/summary><div class=\"depth-body\"><h1>符号主义与物理符号系统假说 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要把这条假设推到底，先逐级倒查它依赖什么：<\/p>\n<ol><li>\n“符号可被机器处理”依赖更底层的可计算观念：符号串能被读写、替换、组合，这一能力由图灵机模型刻画（见 c09，PDF 第 184 页）。没有机械化底座，符号只能是人脑中的概念。\n<\/li><li>\n“智能是操作”依赖一个观察：人在解题时处理的是概念与关系，而不是直接感知神经元活动。这一观察在 1950 年代的心理学与计算机交叉处形成。\n<\/li><li>\n“符号对应物理客体”依赖经验主义立场：符号不是凭空生成的记号，它指称外部世界里可分辨的对象。\n<\/li><li>\n再往前一层，还需要一条研究假设：机器不必复刻大脑生理结构，只在描述层面模拟心智功能就足够。这条假设把符号派与神经模拟派分开。\n<\/ol>\n<p>逆推到读者基线为止：先认“符号=可处理的记号”，再认“操作=按规则变换记号”，最后认“这就是智能的描述层”。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条分四步，每一步写清用了哪条假设：<\/p>\n<ul><li>\n第一步，事实观察：纽厄尔与司马贺观察人类证明定理、下棋等活动，发现人处理的是概念、关系与目标，而不是肌肉反应。这一步用的假设是“心智活动可在描述层被观察”。\n<\/li><li>\n第二步，提出假设：既然处理对象是符号，就可以假设智能在描述层等价于符号操作；符号对应物理客体，操作包括识别、组合、替换与推理。这就是物理符号系统假说（PDF 第 17 页）。\n<\/li><li>\n第三步，工程检验：假设要落地成可运行程序。“逻辑理论家”证明《数学原理》命题逻辑的一个很大子集，是符号操作假设的第一次演示（PDF 第 23 页）。检验只说明程序能做一类符号推理，不证明人类智能完全等同于符号操作。\n<\/li><li>\n第四步，路线分化：在这条假设上，长出定理证明、专家系统、逻辑程序三类工程；常识与感知则成为符号表示覆盖不到的区域，留给连接主义与行为路线。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：1955 年建议书罗列了 7 个研究领域——自动计算机、编程语言、神经网络、计算规模的理论、自我改进、抽象、随机性与创见性（PDF 第 22 页）；符号路线当时与神经网络等路线并排在同一议程内，并非开场就独占。\n<\/li><li>\n史料：麦卡锡对会议的原始预算是 13500 美元，洛克菲勒基金会只批了 7500 美元；按书中推算，麦卡锡、明斯基当时年薪不到 8000 美元（PDF 第 22 页）。经费与硬件规模限定了会议只能是小规模研讨。\n<\/li><li>\n推断：在真空管机器、存储器与程序语言都未成熟的年代，把智能先抽成符号操作是成本最低的可行选择——不必复刻神经元，也不必等待感知数据积累。这一步是后人基于史料条件做的推断，原书没有直接写成因果判断。\n<\/li><li>\n必然还是偶然：符号派成为主流，与纽厄尔、司马贺在工程演示上的领先有关，带有偶然性；但在当时条件下选择符号抽象作为研究对象，是环境约束下的可行解。\n<\/ul>\n<p>推导中保留的限定：假说是研究立场，不是已证明的定理；它对窄领域有效，不等于解释全部智能。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，人物谱系。1956 年达特茅斯会议上，纽厄尔与司马贺代表符号派；麦卡锡、明斯基、香农、塞弗里奇、所罗门诺夫等在场。纽厄尔 1927—1992，司马贺 1916—2001，两人共享 1975 年图灵奖，三年后司马贺再获诺贝尔经济学奖（PDF 第 16–17 页）。案例二，系统检验。逻辑理论家在会上报告，能证明《数学原理》命题逻辑子集；它常被视为 AI 史最重要的原创工作之一，但逻辑学家并不买账（PDF 第 23、35 页）。案例三，反例检验。Cyc 试图用逻辑表示人类常识，雷纳特 1984 年预言 1999 年每台计算机预装 Cyc，1986 年估计需约 2500 万条规则，1990 年代初即被批评没有成功案例（PDF 第 72 页）。把三个案例放回链条：案例二是假设的成功演示，案例三是假设在常识边界上的失败。<\/p>\n<p>案例四，会议预算与议程规模（数字史料）。建议书列 7 个研究领域；原始预算 13500 美元、获批 7500 美元（PDF 第 22 页）。量级对照：这场学科起点会议的经费规模，与后来五代机十年 4.5 亿美元计划、2012 年前后深度学习所需的 GPU 集群形成代际落差；经费数字来自原书，代际落差对照是读者可做的量级推断。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：如果符号操作足以解释智能，常识应当可被规则穷尽；Cyc 的规模估计与失败记录说明常识的隐性程度超出手工规则库。反例二：视觉、语音等感知任务难以先写成符号规则，符号派在这些领域需要另接表示层，而不是直接推理。边界条件：在边界清楚、知识可显性表述的问题上，符号派方法有效；一旦问题依赖大量实例归纳，符号表示的获取成本成为瓶颈。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：AI 是匀速线性进步的。<\/strong> 反证：本书记录了两次起落，1969 年后神经网络进入近二十年寒冬，五代机 1994 年结束（PDF 第 91、97–98 页）；进步是路线交替与条件凑齐的阶梯，不是逐年匀速爬升。\n<\/li><li>\n<strong>误读：符号主义彻底失败了。<\/strong> 反证：符号思想后来进入规则引擎、知识图谱等后继形态（PDF 第 67、75 页）；失败的是通用符号工程与常识手工穷尽，不是符号表示这一手段本身。\n<\/li><li>\n<strong>误读：符号派从第一天起就排斥神经网络。<\/strong> 反证：1955 年建议书第 3 个领域就是神经网络（PDF 第 22 页）；两派是同一份议程里的不同进路，排斥是后来在资金、评价标准与路线竞争中逐步形成的。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n物理符号系统假说里“物理”二字限定的是什么？去掉它会变成什么主张？\n<\/li><li>\n逻辑理论家成功证明了哪本书的哪一部分？为什么说它只是假设的演示，不是假说被证明？\n<\/li><li>\n符号派与神经模拟派在第一天就分开，两者差在哪一条假设上？\n<\/li><li>\n用 Cyc 的记录说明：符号表示在常识问题上的边界在哪里？\n<\/li><li>\n为什么定理证明、专家系统、逻辑程序都可以挂在这条假设之下？\n<\/ol><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.38<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">符号主义与物理符号系统假说<\/a><\/span><\/div><h1>自动定理证明与归结原理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1–2 章\n<\/ul>\n<h2>问题<\/h2>\n<p>符号主义要证明自己能复刻“最纯粹的理性活动”，首选阵地就是数学证明：前提、规则、结论全是符号串，证明就是按规则把一串符号变成另一串。早期困难是：手工定理证明程序要么依赖启发式、被逻辑学家嫌弃，要么规则庞杂、难以实现。需要一条既通用又可机械化的推理规则，把一阶逻辑证明变成可重复执行的过程。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>自动定理证明（ATP）<\/strong>研究用机器判定或证明逻辑与数学命题。<strong>归结原理<\/strong>是罗宾逊 1965 年发表于 JACM 的推理规则（PDF 第 38 页）。逐句拆：<\/p>\n<ul><li>\n给定两个含互补文字的子句，归结消去互补文字，合成一个新子句；\n<\/li><li>\n配合<strong>合一（unification）<\/strong>：把两个一阶项按变量代换对齐；\n<\/li><li>\n有了归结，一阶逻辑证明推导原则上只反复使用这一条规则，不再需要为每种证明配一条专门规则。\n<\/ul>\n<h2>推导<\/h2>\n<p>链条按时间与逻辑两层展开。时间层：戴维斯 1954 年在 JOHNNIAC 上完成第一个定理证明程序，实现只有加法的普利斯博格算术判定过程，1957 年发表（PDF 第 33–34 页）；王浩 1958 年夏在 IBM 704 上 9 分钟证明《数学原理》一阶逻辑 150 条中的 120 条，1959 年夏改进版证明全部一阶定理加 200 条命题逻辑定理（PDF 第 36 页）。逻辑层：DP 过程（戴维斯-普特南）与 DPLL 是前驱；罗宾逊在实现 DP 过程时发现归结，拓展普拉维茨的合一算法，再加上“包含（subsumption）”策略——被已有子句包含的新子句不必保存（PDF 第 39 页）。结论：归结把证明规则统一化，合一解决项对齐，包含控制子句膨胀。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>归结在一阶逻辑范围内成立，依赖合一与子句形式化。边界：归结会很快生成大量新子句，组合爆炸仍需启发式与搜索策略控制；纯通用证明器在实际问题上效率有限。条件去掉会怎样：去掉合一，变量代换无法对齐，归结规则落不了地；去掉包含策略，无用子句堆积，证明器被检索成本拖垮。失败案例：费根鲍姆批评罗宾逊把人工智能引入陷阱，罗宾逊被迫从《人工智能杂志》编委会辞职（PDF 第 42 页）；这是纯逻辑路线在 AI 工程语境下受挫的记载。<\/p>\n<h2>反例<\/h2>\n<p>纯归结路线没有自动解决数学发现。阿贡小组 1996 年用 EQP 证明 1933 年提出的罗宾斯猜想，在 486 机上跑 13 天给出证明，再在 RS/6000 上跑 7 天验证（PDF 第 41 页）；成功依赖项索引、判别树索引等工程策略，不是归结规则单独完成的。反例同时提醒：定理证明能解决人长期未拿下的问题，但前提是搜索策略、索引与实现工程都到位。<\/p>\n<h2>辨析<\/h2>\n<p>与启发式程序的差别：“逻辑理论家”首创启发式思路，模拟人解题经验，对 AI 与心理学有意义，但逻辑学家不买账；王浩称其“不专业”（PDF 第 35 页）。与项重写的差别：罗宾逊 1960 年代奠定逻辑主义证明基础，高德纳与本迪克斯 1970 年开启形式主义的项重写路线，前者靠归结，后者靠单向方程规则（PDF 第 39 页）。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：符号主义纲领（c01）提供“证明即符号操作”的立场；图灵机（c09）提供机械化底座。后继：Prolog 与五代机的逻辑程序由定理证明传统生长；专家系统（c03）的推理机是同一符号思路在窄领域的变体。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（自动定理证明与归结原理）<\/summary><div class=\"depth-body\"><h1>自动定理证明与归结原理 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>倒查这条技术线需要哪些前置：<\/p>\n<ol><li>\n一阶逻辑的项、子句与推理规则是形式化语言基础；不懂逻辑表达式，就无法理解机器在证明什么。\n<\/li><li>\n机械化前提：逻辑证明可被拆成有限、可重复执行的步骤，这要求可计算观念成立（见 c09，PDF 第 184 页）。\n<\/li><li>\n更早的判定过程探索：戴维斯的普利斯博格算术程序、DP 过程与 DPLL，是归结规则出现前的工程积累（PDF 第 33–34 页）。\n<\/li><li>\n再往前，问题意识：数学证明是最纯粹的符号操作，符号派要在最高标准的理性活动上摸到智能（PDF 第 32 页）。\n<\/ol>\n<p>逆推基线：先认“证明=符号变换”，再认“变换可机械化”，最后认“需要一条统一规则降低工程复杂度”。<\/p>\n<h2>正向推导<\/h2>\n<p>按时间与逻辑两层推进，每步标明依据：<\/p>\n<ul><li>\n第一步，判定过程探索。戴维斯 1954 年在普林斯顿高等研究院的 JOHNNIAC 上完成第一个定理证明程序，文章 1957 年发表；程序实现普利斯博格算术（只有加法、没有乘法）的判定过程，该理论可判定但复杂性超指数（PDF 第 33–34 页）。依据：机器能执行固定判定流程。\n<\/li><li>\n第二步，机器证明提速。王浩 1958 年夏天在 IBM 704 上实现命题逻辑与一阶逻辑程序，后者 9 分钟证明《数学原理》一阶逻辑 150 条中的 120 条；1959 年夏天改进版证明全部一阶定理外加 200 条命题逻辑定理（PDF 第 36 页）。依据：高效算法加上当时机器能力，可在真实教科书定理上取得记录。\n<\/li><li>\n第三步，统一推理规则。罗宾逊在实现 DP 过程时发现归结原理，文章迟至 1965 年发表于 JACM（PDF 第 38 页）。以前的证明技术需要很多规则，归结把证明推导归约为一条规则；配合普拉维茨 1957 年提出的合一算法，把两个一阶项按变量代换对齐；另有被忽视的包含策略：被已有子句包含的新子句不必保存（PDF 第 39 页）。\n<\/li><li>\n第四步，工程策略配套。阿贡小组沃思等人提出支持集（set of support）等提高效率的概念；马库恩用 C 写 Otter 证明器，再用 EQP 证明罗宾斯猜想（PDF 第 40–41 页）。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：早期机器运算与存储条件有限，证明程序必须在有限机时内跑完；戴维斯程序发表滞后于实现三年（1954 实现、1957 发表），王浩程序依托 IBM 704 这一代机时资源（PDF 第 33、36 页）。\n<\/li><li>\n史料：评价标准分成两套——AI 圈子看重启发式与模拟人解题，逻辑圈子看重可判定性与形式化标准；逻辑理论家论文被《符号逻辑杂志》退稿，王浩称其“不专业”（PDF 第 35 页）。\n<\/li><li>\n推断：归结之所以被重视，直接原因是规则数量从多条压到一条，降低了实现复杂度；但它没有降低搜索规模，组合爆炸仍在，需要后来的支持集、索引等工程策略补救。这一因果是基于书中记载的技术链条做的推断。\n<\/li><li>\n必然还是偶然：统一规则的方向在一阶逻辑成熟后是可预期的；罗宾逊文章因匿名审稿耽搁到 1965 年发表、包含策略长期被忽视，这些节点带有偶然性。\n<\/ul>\n<p>推导保留的限定：归结统一了规则，但组合爆炸没有消失；证明器效率仍受搜索策略、索引与工程实现制约。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，王浩记录。1958 年夏 IBM 704，9 分钟，120/150 条一阶逻辑定理；1959 年夏全部一阶定理 + 200 条命题逻辑定理。王浩学生库克后来在 1971 年《定理证明的复杂性》提出 NP 完全性理论，1982 年获图灵奖（PDF 第 36 页）。案例二，罗宾斯猜想。猜想 1933 年提出，六十多年无人证明；EQP 在 1996 年 10 月 10 日给出证明，486 机跑 13 天，再在 IBM RS/6000 工作站跑 7 天验证（PDF 第 41 页）。案例三，路线受挫。费根鲍姆批评罗宾逊把人工智能引入陷阱，罗宾逊被迫从《人工智能杂志》编委会辞职；本书同时记载归结的简单性带来重视，但同样存在组合爆炸问题（PDF 第 42 页）。<\/p>\n<p>案例四，规模对照（数字史料 + 量级推断）。王浩程序在 9 分钟内处理教科书上编号明确的 150 条一阶定理；EQP 证明罗宾斯猜想用了 13 天机时加 7 天验证（PDF 第 36、41 页）。从几十条教科书定理到开放数学猜想，搜索空间差距以数量级计；具体子句膨胀倍数原书未给数字，此处只做“从分钟级到两周级”的量级推断，不补造膨胀率。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：纯归结不能自动完成数学发现。罗宾斯猜想的成功依赖项索引、判别树索引等工程策略，不是归结规则单独产出。反例二：启发式程序与逻辑证明是两条标准。逻辑理论家模拟人解题经验，被王浩称“不专业”；其论文还被《符号逻辑杂志》退稿（PDF 第 35 页）。边界条件：一阶逻辑范围内归结成立；超出范围的常识、感知与开放问题，证明器无法直接处理。条件去掉合一，变量代换无法对齐；去掉包含策略，无用子句堆积，检索成本拖垮证明器。<\/p>\n<h2>史料补充<\/h2>\n<p>定理证明线的人物与节点：戴维斯 1954 年在 JOHNNIAC 上实现逻辑理论家、1957 年发表；王浩 1958 年夏在 IBM 704 上九分钟证出 150 条一阶定理中的 120 条，1959 年夏补全一阶并证明 200 条命题逻辑定理；DP 与 DPLL 是后续 SAT 求解路线；王浩学生库克 1971 年提出 NP 完全性，1982 年获图灵奖（PDF 第 33、36 页）。归结线，罗宾逊 1965 年在《ACM 杂志》发表归结原理，合一算法与包含策略配套提出；EQP 1996 年 10 月 10 日证出罗宾斯猜想，老式 486 机跑 13 天、RS/6000 跑 7 天（PDF 第 38–41 页）。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：归结原理把证明变成了一键求解。<\/strong> 反证：本书明确记载归结同样存在组合爆炸问题（PDF 第 42 页）；统一的是规则数量，不是搜索规模，实际证明仍要策略与索引配合。\n<\/li><li>\n<strong>误读：机器证明从一开始就是 AI 的主线。<\/strong> 反证：逻辑学家与 AI 圈子长期若即若离，宁肯和计算机理论家混在一起；定理证明共同体与 AI 工程圈是逐步分化的（PDF 第 35、42 页）。\n<\/li><li>\n<strong>误读：王浩的程序只是重复逻辑理论家的思路。<\/strong> 反证：两者标准不同，王浩贴近逻辑判定过程，对理论计算机科学影响更深；逻辑理论家贴近人类启发式，对 AI 与心理学有意义（PDF 第 35–36 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n普利斯博格算术为什么可判定却仍不实用？复杂性结论是什么？\n<\/li><li>\n归结原理把证明规则统一到几条？它配套的两个机制分别解决什么问题？\n<\/li><li>\n王浩 1958 与 1959 两年的程序记录差在哪里？学生库克后来提出了什么理论？\n<\/li><li>\n罗宾斯猜想的证明耗时记录说明了什么？成功依赖哪些工程条件？\n<\/li><li>\n为什么说定理证明是符号派的思想源头，但纯逻辑路线在 AI 工程语境下受挫？\n<\/ol><\/div><\/details>", "c03": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.65<\/div><h1>专家系统与知识表示<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 3–5 章\n<\/ul>\n<h2>问题<\/h2>\n<p>通用定理证明走不动之后，工程上需要一条能在真实专业场景落地的路径。具体困难是：窄领域里的老专家靠经验判断，但这些经验没有写成形式规则，机器无法使用。专家系统要解决的困难就是把专家在小领域内的判断抽出来，变成程序可执行的规则与推理流程；不这么做，AI 只能停留在玩具问题上。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>专家系统<\/strong>：把狭窄专业领域内专家的判断提炼成规则，在专用场景内模拟专家决策的程序。<strong>知识表示<\/strong>：研究如何把客体、关系与常识组织成机器可用的形式。逐句拆：<\/p>\n<ul><li>\n“狭窄领域”：系统不追求通用智能，边界明确；\n<\/li><li>\n“提炼规则”：知识从专家访谈与案例中抽取，写成“如果条件，那么结论”的产生式规则；\n<\/li><li>\n“模拟判断”：推理机按规则链给出结论，必要时做不精确推理。\n<\/ul>\n<h2>推导<\/h2>\n<p>第一步，观察科学判断：DENDRAL 团队面对质谱仪数据与化学结构之间的对应，把化学家的分析知识提炼成规则，输入质谱数据、输出化学结构，系统有时比莱德伯格的学生做得还好（PDF 第 65 页）。第二步，方法迁移到医学诊断：MYCIN 由肖特莱福 1976 年斯坦福博士论文完成，针对细菌感染诊断，首创产生式规则与不精确推理；处方准确率 69%，专科医生 80%，优于非本专业医生（PDF 第 66 页）。第三步，工程成熟：DEC 的 XCON 在 1980–1986 年按需求自动配置零部件，是成熟期最成功的案例（PDF 第 67 页）。推理依据是书中三个可核对的系统案例，而非“专家系统很成功”的笼统判断。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：领域边界清楚、专家经验可显性表述、判断错误的代价可评估。边界：规则覆盖不到的新情况系统无法处理；知识获取靠人工访谈，规模一大就变慢；隐性的感知与常识难以写成规则。条件去掉会怎样：如果领域边界不清、专家自己也讲不出判断依据，规则提炼就失去对象；如果取消产生式规则、改由数据训练，系统就不再是专家系统，而进入连接主义路线。<\/p>\n<h2>反例<\/h2>\n<p>Cyc 是常识知识表示的失败案例：雷纳特 1984 年预言 1999 年每台计算机预装 Cyc，1986 年估计常识规则至少 2500 万条，1990 年代初即被批评没有成功案例（PDF 第 72 页）。另一个边界案例：MYCIN 从未真正临床使用，其价值在方法被提炼为通用骨架 EMYCIN（PDF 第 66 页）。这两个案例说明专家系统的成功高度依赖窄领域与可抽取知识。<\/p>\n<h2>辨析<\/h2>\n<p>与定理证明的差别：定理证明追求通用逻辑推导，专家系统把领域知识显式编入规则库，推理服务于窄判断。与大模型的差别：专家系统知识由人写规则，大模型从数据归纳参数；两者知识获取方向相反。与知识图谱的关系：知识图谱是常识表示在 Web 数据整合方向的后继，2010 年谷歌收购 Metaweb 后命名 Knowledge Graph（PDF 第 75 页）。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：符号主义纲领（c01）与定理证明推理机（c02）提供规则与推理思路。后继：五代机（书中第 4 章）是符号工程在国家计划层面的重注；知识图谱与现代检索问答是其长线延伸。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（专家系统与知识表示）<\/summary><div class=\"depth-body\"><h1>专家系统与知识表示 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>倒查专家系统成立需要什么前置：<\/p>\n<ol><li>\n符号表示与推理机先存在：客体、关系可写成符号，推理可按规则执行（见 c01、c02，PDF 第 17、38 页）。没有符号底座，专家经验无处落地。\n<\/li><li>\n领域专家经验可被访谈、拆成“条件—结论”形式。这要求专家自己能讲出判断依据，问题边界相对清楚。\n<\/li><li>\n窄领域假设：系统不追求通用智能，只在一个专业场景内给出判断。\n<\/li><li>\n再往前的困境：通用定理证明在真实工程问题上效率有限，需要一条把知识显式编入程序的路线。\n<\/ol>\n<p>逆推基线：先认“知识可抽取”，再认“规则可执行”，最后认“窄领域内可模拟专家判断”。<\/p>\n<h2>正向推导<\/h2>\n<p>按案例推进，每步标明假设与证据：<\/p>\n<ul><li>\n第一步，化学结构判断。1964 年费根鲍姆从伯克利到斯坦福，与遗传学家、1958 年诺贝尔生理学或医学奖得主莱德伯格合作，团队成员布坎南；成果 DENDRAL 输入质谱仪数据、输出化学物质结构，把化学家分析知识提炼成规则，有时比莱德伯格的学生做得还好（PDF 第 64–65 页）。依据：领域内可抽出规则，规则可复刻专家判断。\n<\/li><li>\n第二步，医学诊断迁移。MYCIN 由肖特莱福 1976 年斯坦福博士论文完成，针对细菌感染诊断；处方准确率 69%，专科医生 80%，优于非本专业医生；MYCIN 首创产生式规则与不精确推理，原理后提炼为通用骨架 EMYCIN（PDF 第 66 页）。依据：同一套规则—推理结构可跨领域迁移。\n<\/li><li>\n第三步，工程成熟期案例。DEC 的 XCON 在 1980–1986 年按需求自动配置零部件，是成熟期最成功的专家系统案例（PDF 第 67 页）。依据：规则库加推理机可以进入真实生产流程。\n<\/li><li>\n第四步，常识表示外推。Cyc 把目标从窄领域推到人类常识，用逻辑表达常识；雷纳特 1984 年预言 1999 年每台计算机预装 Cyc，1986 年估计常识规则至少 2500 万条（PDF 第 72 页）。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：1970 年代初 DARPA 削减 AI 长期资助、改为每年评审，费根鲍姆团队需转向 NIH 与 NLM 资助；专家系统在经费压力下必须展示可落地的窄领域应用（PDF 第 67 页）。\n<\/li><li>\n史料：XCON 起源于卡内基-梅隆 R1，最早用 Fortran 写失败后改 BASIC，随后采用福吉发明的 Rete 算法与 OPS5 语言，效率大幅提高（PDF 第 67 页）。\n<\/li><li>\n推断：专家系统在 1980 年代初到 1990 年代初进入黄金期，条件是问题边界清楚、专家经验可表述、商业客户愿意为配置与诊断付费；三者缺一，规则库建不起来。这一条件归纳是基于书中案例做的推断。\n<\/li><li>\n必然还是偶然：把专家知识写成规则在窄领域可行，是符号路线的自然延伸；但黄金期长度受五代机幻灭与互联网新场景影响，1990 年代后“专家系统”一词带上负面含义，转向规则引擎形态（PDF 第 67 页）。\n<\/ul>\n<p>推导保留的限定：专家系统的成功记录都在窄领域；常识与隐性知识不在同一可抽取性上。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，DENDRAL。任务是由质谱数据推断化学结构，属第一个专家系统；证据落在 PDF 第 65 页。案例二，MYCIN。诊断细菌感染，69% 对 80% 的准确率记录，从未真正临床使用；价值在方法沉淀为 EMYCIN 基础（PDF 第 66 页）。案例三，XCON。DEC 零部件配置，1980–1986 年在使用，代表专家系统十年黄金期（PDF 第 67 页）。案例四，Cyc 反例。常识规则规模估计与 1990 年代初的失败批评，说明知识表示从窄领域推向常识时遇到体量瓶颈（PDF 第 72 页）。长线：2010 年谷歌收购 Metaweb，命名 Knowledge Graph；伯纳斯-李 2016 年获图灵奖（PDF 第 74–75 页）。<\/p>\n<p>案例五，订单与成本对照（数字史料）。XCON 在 1980–1986 年共处理 8 万个订单；节省金额估算分歧很大，最高称每年省 4000 万美元，也有说法每年省 2500 万美元，还有认为每年顶多几百万美元（PDF 第 67 页）。MYCIN 的 69% 与专科医生 80% 是另一组可核对数字（PDF 第 66 页）。两组数字说明：专家系统在窄流程里有实测价值，但收益与准确率都未达到顶尖专家水平；金额区间分歧本身，说明早期商业收益缺乏统一口径。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：MYCIN 未临床落地，说明模拟判断不等于可直接交付的医疗系统；领域责任、安全与集成问题超出规则本身。反例二：Cyc 的失败说明专家经验可抽取这一假设在常识层不成立——大量常识是隐性的、情境依赖的。边界条件：领域边界清楚、专家可表述经验、错误代价可评估，三条同时满足时专家系统有效；去掉任一条件，规则库要么建不起来，要么覆盖不住新情况。与大模型的差别在知识获取方向：专家系统由人写规则，大模型从数据归纳参数。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：专家系统就是早期的大模型。<\/strong> 反证：两者知识获取方向相反——专家系统靠人工访谈提炼规则，大模型从数据归纳参数；专家系统不具备从样本里自动形成表示的能力（PDF 第 66–67 页）。\n<\/li><li>\n<strong>误读：专家系统当年真的全面胜过人类专家。<\/strong> 反证：MYCIN 处方准确率 69%，低于专科医生 80%；XCON 的节省金额各估算相差一个数量级（PDF 第 66–67 页）。\n<\/li><li>\n<strong>误读：专家系统作为技术路线已经消失。<\/strong> 反证：互联网催生的电商配置、征信、反欺诈、风险控制延续了类似场景，专家系统改名规则引擎成为中间件标配，FICO 收购了一批专家系统公司（PDF 第 67 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\nDENDRAL 解决什么任务？它把哪一类知识提炼成了规则？\n<\/li><li>\nMYCIN 的准确率记录是多少？为什么说它的价值在方法而不在临床落地？\n<\/li><li>\n产生式规则与不精确推理是从哪个系统开始成为专家系统要素的？\n<\/li><li>\nCyc 案例对“常识可被手工规则穷尽”这一假设提出了什么反例？\n<\/li><li>\n专家系统在什么条件下有效？三条边界条件去掉一条会怎样？\n<\/ol><\/div><\/details>", "c04": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.96<\/div><h1>连接主义与感知机<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 3–5 章\n<\/ul>\n<h2>问题<\/h2>\n<p>符号路线把知识写成规则，感知与模式识别却难以规则化。连接主义要解决的困难是：能不能仿照神经元结构，让机器从样本中自己分出模式，而不是由人先写好判别规则。1950 年代的具体目标是：构造一个可训练的单层网络，完成简单的视觉或模式识别任务。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>连接主义<\/strong>把智能归于神经元之间连接强度的调整。<strong>感知机<\/strong>是罗森布拉特 1957 年提出的单层神经网络模型（PDF 第 96 页）。逐句拆：<\/p>\n<ul><li>\n“单层”：输入层直接连到输出层，中间没有隐藏层；\n<\/li><li>\n“连接强度”：每条连接带权重，学习就是调整权重；\n<\/li><li>\n“可收敛”：在样本线性可分时，学习过程可以收敛到一组正确分类的权重。\n<\/ul>\n<h2>推导<\/h2>\n<p>前置链条：麦卡洛克与皮茨 1943 年提出神经元数学模型开山文章（PDF 第 93–94 页）；赫布 1949 年《行为的组织》提出后人所称的赫布学习规则（PDF 第 95 页）。落到感知机：罗森布拉特 1957 年在康奈尔提出模型，完成简单模式识别，并在理论上证明单层网络在线性可分问题上收敛；1962 年写成《神经动力学原理：感知机和大脑机制的理论》（PDF 第 96 页）。推理步骤：先有神经元模型与学习规则，再有可调权重的单层装置，最后证明其在可分条件下收敛。每一步对应书中可核对的人物与著作。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>成立条件：样本可被一条直线（高维中一个超平面）分开，网络为单层结构。边界：线性不可分的模式单层网络学不会；没有隐藏层，无法表示多层组合特征。条件去掉会怎样：去掉线性可分条件，收敛定理不再成立；去掉单层限制、引入隐藏层，问题就转到多层网络的训练方法，即反向传播（c05）要解决的困难。<\/p>\n<h2>反例<\/h2>\n<p>明斯基与佩珀特 1969 年《感知机：计算几何学》证明单层神经网络不能解决 XOR（异或）问题（PDF 第 97 页）。这一批判以充满敌意的方式呈现，被视为神经网络进入近二十年低谷的重要原因；1988 年该书再版时删去第一版攻击罗森布拉特的句子，并手写“纪念罗森布拉特”，IEEE 2004 年设立罗森布拉特奖（PDF 第 98 页）。XOR 是单层结构能力边界的标准反例：两条边界互相交叉，一条直线分不开两类。<\/p>\n<h2>辨析<\/h2>\n<p>与符号主义的差别：知识来源不同——符号派靠人写规则，连接派靠数据调权重。与多层深度学习的差别：感知机是单层模型，深度学习是多层结构；感知机的 XOR 局限不是连接主义整体的局限，而是单层模型的局限。与自适应线性元件（Adaline）的关系：维德罗同期提出的 Adaline 与感知机相似，都是单层可调权重装置（PDF 第 98 页）。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：麦卡洛克-皮茨模型与赫布规则提供神经装置与学习规则。后继：反向传播与深度学习复兴（c05）解决多层训练；强化学习（c06）在连接主义框架内引入奖励信号。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（连接主义与感知机）<\/summary><div class=\"depth-body\"><h1>连接主义与感知机 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>倒查感知机出现需要哪些前置：<\/p>\n<ol><li>\n神经元的数学模型先存在：麦卡洛克与皮茨 1943 年开山文章，把神经元抽象成可计算单元（PDF 第 93–94 页）。\n<\/li><li>\n学习规则先存在：赫布 1949 年《行为的组织》提出后人所称的赫布学习规则，说明连接强度如何随经验调整（PDF 第 95 页）。\n<\/li><li>\n问题动机：符号规则难覆盖模式识别，需要能从样本自学分类的装置。\n<\/li><li>\n再往前的路线分野：1955 年洛杉矶讨论会上，模拟神经系统与模拟心智两条进路已被区分（PDF 第 13 页）。\n<\/ol>\n<p>逆推基线：先认“单元可调权重”，再认“样本可驱动权重调整”，最后认“单层装置能解决哪类分类”。<\/p>\n<h2>正向推导<\/h2>\n<p>按历史顺序与逻辑条件推进：<\/p>\n<ul><li>\n第一步，神经元模型。麦卡洛克（1898—1969）与皮茨（1923—1969）1943 年文章给出神经元的数学表达，为人工装置提供结构原型（PDF 第 93–94 页）。依据：可把神经单元抽象成输入—输出单元。\n<\/li><li>\n第二步，学习规则。赫布 1949 年著作说明连接强度随重复激活调整，回答“权重为什么会变”（PDF 第 95 页）。依据：学习可落在连接参数上。\n<\/li><li>\n第三步，感知机构造。罗森布拉特 1957 年在康奈尔大学提出感知机模型，完成简单模式识别；理论上证明单层网络在线性可分问题上收敛；1962 年写成《神经动力学原理：感知机和大脑机制的理论》（PDF 第 96 页）。依据：在可分条件下，权重迭代能到达正确分类边界。\n<\/li><li>\n第四步，能力边界被证明。明斯基与佩珀特 1969 年《感知机：计算几何学》证明单层神经网络不能解决 XOR（异或）问题（PDF 第 97 页）。依据：边界形状是非线性可分时，单层超平面分不开两类样本。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：1950 年代硬件只能支撑简单单层装置，多层结构的训练方法尚未成形；感知机的实验形态与当时可上机的计算条件匹配（PDF 第 96 页）。\n<\/li><li>\n史料：《感知机》一书以充满敌意的方式呈现批判，被视为近二十年低谷的重要原因；1988 年再版删去攻击罗森布拉特的句子并手写纪念，IEEE 2004 年设罗森布拉特奖（PDF 第 97–98 页）。\n<\/li><li>\n推断：寒冬是理论边界与舆论打压共同作用的结果；XOR 不可解是事实结论，把它扩大成“神经网络整体不可行”是评价标准上的放大。这一区分是基于书中记录做的推断。\n<\/li><li>\n必然还是偶然：单层模型表达有限是数学事实，迟早会被指出；但低谷持续近二十年，与批判的舆论形态、资金转向有关，并非纯数学结论的直接后果。\n<\/ul>\n<p>推导保留的限定：被否定的是单层感知机，不是整个连接主义；多层结构仍可能表示非线性边界，但训练方法当时未解决。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，XOR 反例。异或的两类样本在二维平面上互相交叉，任何一条直线都分不开；单层网络只有一个超平面边界，无法完成分类（PDF 第 97 页）。案例二，打压与余波。《感知机》以敌意方式呈现批判，被视为神经网络近二十年低谷的重要原因；罗森布拉特 1928—1971，1971 年去世（PDF 第 97–98 页）。案例三，后期追认。1988 年再版删去第一版攻击罗森布拉特的句子，并手写“纪念罗森布拉特”；IEEE 2004 年设立罗森布拉特奖（PDF 第 98 页）。同期对照：维德罗的 Adaline 与感知机相似，同为单层可调权重装置（PDF 第 98 页）。<\/p>\n<p>案例四，尺度对照（数字史料 + 量级推断）。本书记载人脑神经连接约 100 万亿到 1000 万亿（10¹⁴—10¹⁵）个（PDF 第 114 页）；感知机作为早期人工装置，连接规模与之相差十几个数量级。具体每层权重数与单次训练计算量原书未给数字，此处只做“生物脑与早期人工装置规模不可同日而语”的量级推断，不补造感知机参数量。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：把单层局限记成连接主义整体失败，是错误推断。XOR 只证明单层模型能力有限；多层网络与反向传播后来打开了另一空间（见 c05）。反例二：以为明斯基一直反对神经网络。本书记载他早期博士论文就是关于神经网络的，后来才转向并与罗森布拉特决裂（PDF 第 97 页）。边界条件：线性可分、单层结构两条同时满足时，收敛定理成立；去掉可分条件，定理失效；去掉单层限制，问题转入多层训练。<\/p>\n<h2>史料补充<\/h2>\n<p>两代连接主义文献：麦卡洛克-皮茨 1943 年形式化神经元，赫布 1949 年提出学习律；罗森布拉特 1957 年构造感知机、1962 年出版专著；明斯基与帕佩尔特 1969 年《感知机》证明单层网络不可解 XOR；1988 年再版删去带有攻击性的结尾句，IEEE 2004 年设立罗森布拉特奖（PDF 第 93、95–98 页）。两次起落之间的过渡人物是霍普菲尔德 1982 年与玻尔兹曼机 1983–1986 年，它们为 1986 年反向传播论文留出位置（PDF 第 101–102、118 页）。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：感知机被证明不行，所以神经网络路线被否定了。<\/strong> 反证：被证明不可解的是单层网络的 XOR 问题；连接主义整体并未被判死刑，1980 年代后由多层网络与反向传播接续（PDF 第 97–98、118 页）。\n<\/li><li>\n<strong>误读：罗森布拉特只是做了个简单硬件玩具。<\/strong> 反证：他给出了单层网络在线性可分条件下的收敛理论，并写成 1962 年专著；收敛结论是理论结果，不只是实验观察（PDF 第 96 页）。\n<\/li><li>\n<strong>误读：明斯基从头到尾站在神经网络对立面。<\/strong> 反证：他早期博士论文即关于神经网络，早期属“吃啥补啥”一派，决裂发生在后来的路线冲突中（PDF 第 97 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n麦卡洛克-皮茨模型与赫布规则分别为感知机提供了什么前置？\n<\/li><li>\n感知机的收敛定理在什么条件下成立？罗森布拉特 1962 年著作叫什么？\n<\/li><li>\nXOR 为什么是单层网络的标准反例？用边界形状说明。\n<\/li><li>\n《感知机》1969 年一书造成了什么后果？1988 年再版时做了什么修改？\n<\/li><li>\n为什么不能把 XOR 局限解读为连接主义路线整体失败？\n<\/ol><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.111<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">连接主义与感知机<\/a><\/span><\/div><h1>反向传播与深度学习复兴<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3–5 章\n<\/ul>\n<h2>问题<\/h2>\n<p>感知机被 XOR 卡住之后，多层网络表达能力更强，但长期缺少可行的训练方法：隐藏层里的权重看不到直接的对错反馈，无法像单层那样直接调整。待解决的困难是：误差信号怎样从输出层逐层传回中间层，让每一层权重都知道自己该往哪个方向改。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>反向传播（backpropagation）<\/strong>：把输出误差逐层回传，用梯度下降调整多层网络各层权重的算法。逐句拆：<\/p>\n<ul><li>\n“误差”：输出与目标之差，可度量；\n<\/li><li>\n“逐层回传”：误差信号沿连接反向传到前一层，计算各权重对误差的贡献；\n<\/li><li>\n“梯度下降”：沿使误差减小的方向迭代更新权重；\n<\/li><li>\n“多层”：方法针对含隐藏层的网络，不只是单层感知机。\n<\/ul>\n<h2>推导<\/h2>\n<p>铺垫：霍普菲尔德 1982 年提出霍普菲尔德网络，把网络看作带能量函数的系统，为低潮期的神经网络提供物理学基础；1983–1986 年辛顿与谢诺夫斯基引入隐藏单元和概率分布，提出玻尔兹曼机（PDF 第 101–102 页）。算法层：Werbos 1974 年已有反向传播相关文章，但未在神经网络圈子引起反响；1986 年鲁梅尔哈特、辛顿、威廉姆斯在《自然》杂志发表压缩版本，把反向传播加梯度下降放到多层神经网络上，作者并未引用 Werbos 1974 年博士论文（PDF 第 111、118 页）。落地层：辛顿 2006 年两篇文章开辟深度学习方向；2012 年 ILSVRC 上团队 SuperVision 以 AlexNet 夺冠，学生克里泽夫斯基与苏茨克维在列；2018 年图灵奖颁给辛顿、本吉奥、杨立昆（PDF 第 113–114 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：网络可微分、训练样本可给出目标反馈、算力足以支撑多层迭代。边界：需要大量标注数据与并行算力；深层网络的训练稳定性、梯度消失/爆炸仍需结构与策略配合。条件去掉会怎样：去掉可微分，误差无法沿连接传回；去掉数据与算力，算法虽在 1986 年成形，工程拐点仍要等到 2012 年前后。<\/p>\n<h2>反例<\/h2>\n<p>1986 年之后神经网络并未立即取代其他路线：寒冬后的复兴是渐进的，语音识别 2009 年起才由微软邓力小组与辛顿合作、结合深度学习与隐马尔可夫模型在 2011 年取得突破（PDF 第 113 页）。这说明算法单靠自身不足以形成拐点，数据、任务与算力同时到位才有实测突破。另一个史实：反向传播并非 1986 年凭空出现，Werbos 1974 年已有早期工作（PDF 第 111 页），把功劳全记在 1986 年论文上不符合记载。<\/p>\n<h2>辨析<\/h2>\n<p>与梯度下降的差别：梯度下降是优化方法，反向传播是误差在网络中的回传与梯度计算方式，二者配合使用。与感知机的差别：感知机是单层直接调权重，反向传播解决多层隐藏层的信用分配问题。与强化学习的差别：反向传播依赖监督目标反馈，强化学习依赖延迟奖励信号；两者后来在深度强化学习中结合。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：连接主义与感知机（c04）提出单层局限；玻尔兹曼机提供概率网络铺垫。后继：统计 NLP 与 Transformer（c07）把多层网络用到语言任务；强化学习（c06）与反向传播结合出深度强化学习。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（反向传播与深度学习复兴）<\/summary><div class=\"depth-body\"><h1>反向传播与深度学习复兴 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>倒查反向传播要解决什么、依赖什么：<\/p>\n<ol><li>\n单层感知机的局限先被确认：XOR 单层不可解（见 c04，PDF 第 97 页），需要含隐藏层的多层网络。\n<\/li><li>\n多层网络的困难在信用分配：隐藏层权重看不到直接对错，不知道往哪改。\n<\/li><li>\n可微分前提：误差必须能沿连接逐层传回，计算各权重对误差的贡献。\n<\/li><li>\n铺垫网络：霍普菲尔德网络与玻尔兹曼机先在低谷期提供物理学与概率模型基础（PDF 第 101–102 页）。\n<\/ol>\n<p>逆推基线：先认“多层表达更强”，再认“误差需要回传”，最后认“梯度下降可迭代更新权重”。<\/p>\n<h2>正向推导<\/h2>\n<p>按铺垫、算法、落地三步推进：<\/p>\n<ul><li>\n第一步，低谷期铺垫。霍普菲尔德 1982 年提出霍普菲尔德网络，把网络看作带能量函数的系统；1983–1986 年辛顿与谢诺夫斯基在隐藏单元与概率分布上提出玻尔兹曼机（PDF 第 101–102 页）。依据：网络可被当作可优化的动力系统。\n<\/li><li>\n第二步，算法成形。Werbos 1974 年已有反向传播相关文章，但未在神经网络圈子引起反响；1986 年鲁梅尔哈特、辛顿、威廉姆斯在《自然》杂志发表压缩版本，把反向传播加梯度下降放到多层神经网络上；该文未引用 Werbos 1974 年博士论文（PDF 第 111、118 页）。推导链条：输出误差 → 沿连接反向计算各层权重贡献 → 沿误差减小方向更新权重 → 迭代到收敛。\n<\/li><li>\n第三步，工程拐点。辛顿 2006 年两篇文章开辟深度学习方向；2012 年 ILSVRC 上团队 SuperVision 以 AlexNet 夺冠，学生克里泽夫斯基与苏茨克维在列；2018 年图灵奖颁给辛顿、本吉奥、杨立昆；2024 年霍普菲尔德与辛顿获诺贝尔物理学奖（PDF 第 113–115、105 页）。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：1986 年之后神经网络未立即取代其他路线；语音识别到 2009 年起才由微软邓力小组与辛顿合作，2011 年取得突破（PDF 第 113 页）。\n<\/li><li>\n史料：2012 年 ILSVRC 用 1000 万张图像训练、15 万张图像测试；此前普遍错误率约 26%，SuperVision 首次参赛把错误率压到 15% 以下，领先超过 10 个百分点（PDF 第 113 页）。\n<\/li><li>\n推断：算法成形与工程拐点之间隔着数据规模、GPU 算力与网络结构三个条件；缺任意一个，2012 年的错误率差距不会出现。这一条件归纳基于书中时间线做推断，原书未做三因素分解。\n<\/li><li>\n必然还是偶然：多层训练方法迟早会被重新整理，但 AlexNet 夺冠的具体时点与团队、竞赛、硬件供给有关，带有偶然性。\n<\/ul>\n<p>推导保留的限定：1986 年算法成形不等于工程拐点；数据、任务、算力同时到位后才有实测突破。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，语音路径。深度学习不是 2012 年才突然起势：语音识别 2009 年起由微软邓力小组与辛顿合作，结合深度学习与隐马尔可夫模型，2011 年取得突破（PDF 第 113 页）。案例二，视觉拐点。2012 年 AlexNet 因克里泽夫斯基得名，另一位学生是伊利亚·苏茨克维；夺冠标志深度网络在大规模视觉任务上压倒此前方法（PDF 第 113 页）。案例三，算法史归属。Werbos 1974 年文章在先，1986 年论文的贡献是把反向传播与多层网络训练、梯度下降结合并产生广泛影响；把反向传播全记给 1986 年论文不符合记载（PDF 第 111、118 页）。<\/p>\n<p>案例四，ImageNet 量级对照（数字史料）。训练图像 1000 万张、测试图像 15 万张；基线错误率约 26%，SuperVision 压到 15% 以下，降幅超过 10 个百分点（PDF 第 113 页）。作为对照，沃森系统硬件为 90 台 IBM Power 750、720 核、2880 线程、16TB 内存、成本 300 万美元（PDF 第 169 页）；两类系统都说明，1980 年代的单机机时条件无法支撑 2012 年这种规模的训练。具体训练轮次与参数量原书未给，不做补造。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：算法不能脱离数据与算力生效。1986 年后神经网络未立即取代其他路线，复兴是渐进的；这说明单有算法不够。反例二：深层网络训练仍有稳定性问题，梯度消失、爆炸需要结构与训练策略配合；反向传播不是万能开关。边界条件：网络可微分、有可对照的目标反馈、算力支撑多层迭代，三条同时成立；去掉可微分，误差无法回传；去掉数据与算力，工程拐点推迟。与梯度下降的差别：梯度下降是优化方法，反向传播是误差回传与梯度计算方式，二者配合。<\/p>\n<h2>史料补充<\/h2>\n<p>奖项与时间线对照：2018 年图灵奖授予辛顿、本吉奥、勒昆；2024 年诺贝尔物理学奖授予霍普菲尔德与辛顿，对应连接主义两次起落之间的长期积累（PDF 第 105、115 页）。预训练路线上，辛顿小组 2006 年在《Science》发表两篇文章，把降维逐层预训练引入多层网络，配合新的层预训练算法改善训练（PDF 第 113 页）。语音线与视觉线并行：2009 年辛顿与微软、IBM、谷歌合作，2011 年语音识别突破；图像线以 ILSVRC 为标志（PDF 第 113 页）。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：深度学习在 1986 年反向传播论文发表后就赢了。<\/strong> 反证：本书记载语音路径到 2009–2011 年才突破，视觉拐点等到 2012 年；算法与工程落地之间隔着二十多年（PDF 第 113 页）。\n<\/li><li>\n<strong>误读：反向传播是 1986 年凭空发明的。<\/strong> 反证：Werbos 1974 年已有相关文章；1986 年论文的贡献是结合多层网络与梯度下降并扩大影响，归属不能抹除早期工作（PDF 第 111、118 页）。\n<\/li><li>\n<strong>误读：深度网络的效果来自新发明的优化器。<\/strong> 反证：2012 年成绩同时依托 1000 万张训练图像、GPU 算力与网络结构；误差率从约 26% 降到 15% 以下是多条件叠加的结果（PDF 第 113 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n多层网络相对单层解决了什么？又留下了什么新的训练困难？\n<\/li><li>\n反向传播的误差信号沿什么路径传回？权重更新朝哪个方向？\n<\/li><li>\nWerbos 1974 与 Rumelhart/Hinton/Williams 1986 两段史实如何区分归属？\n<\/li><li>\n为什么说 1986 年不是工程拐点，2012 年才是？数据与算力在其中起什么作用？\n<\/li><li>\n反向传播与梯度下降各指什么？二者是什么配合关系？\n<\/ol><\/div><\/details>", "c06": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.130<\/div><h1>强化学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6–8 章\n<\/ul>\n<h2>问题<\/h2>\n<p>监督学习需要逐条正确答案，现实中很多任务只能得到“好/坏”的延迟反馈，没有现成示范。待解决的困难是：Agent 怎样在与环境的试错互动中改变策略，使长期获得的奖励最大；这要处理延迟奖励、探索与利用的取舍，以及状态空间很大时的策略表示。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>强化学习<\/strong>研究 Agent 根据环境反馈的奖励与惩罚改变策略，以期获得长期最大奖励。逐句拆：<\/p>\n<ul><li>\n<strong>Agent<\/strong>：做动作的主体；\n<\/li><li>\n<strong>环境<\/strong>：接受动作、返回状态与奖励的外部世界；\n<\/li><li>\n<strong>奖励/惩罚<\/strong>：环境对动作的评价信号；\n<\/li><li>\n<strong>策略<\/strong>：Agent 在给定状态下选择动作的规则；\n<\/li><li>\n<strong>长期最大奖励<\/strong>：优化目标不是单步收益，而是累计回报。\n<\/ul>\n<h2>推导<\/h2>\n<p>理论基础两块：马尔可夫决策过程（MDP）提供状态、动作、转移概率与回报的决策模型；动态规划来自贝尔曼 1950 年代的工作，巴托与萨顿承认早期受到它的启发（PDF 第 130 页）。人物线：巴托 1975 年到马萨诸塞大学任教，萨顿是他第一个博士生，两人形成关于学习的第一性原理（PDF 第 128–130 页）。思想源头可追到图灵 1948 年内部报告《智能机器》：P 型机只接受“快乐”“痛苦”刺激，即奖励与惩罚；明斯基 1954 年博士论文也关于强化学习（PDF 第 131 页）。工程标志：Q-Learning 由沃科金斯 1989 年剑桥大学博士论文提出（PDF 第 138 页）。核心张力：探索（尝试未知动作获取信息）与利用（选取当前最优动作）的权衡，用学习率 <span class=\"katex-inline\">\\varepsilon<\/span> 调节（PDF 第 132 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：任务可建模为状态—动作—奖励的序列决策，规则在短期内稳定，回报可累积度量。边界：奖励设计不当会学到偏离目标的策略；延迟奖励导致信用分配困难；状态空间很大时需要神经网络做函数逼近。条件去掉会怎样：去掉奖励信号，Agent 无从判断动作好坏；去掉长期回报目标，就退化成单步判断，不是强化学习。<\/p>\n<h2>反例<\/h2>\n<p>游戏只是早期环境容易定义的试验场，不是强化学习的全部；本书记载其后续也进入芯片布局、蛋白质折叠等固定规则场景（PDF 第 134–135 页）。另一个反例提醒：强化学习早期并未成为主流，2016 年 AlphaGo 击败李世石后才一夜成名；DeepMind 团队中有萨顿四名学生，首席科学家席尔瓦是萨顿大弟子，2017 年 7 月 DeepMind 在阿尔伯塔大学设联合实验室（PDF 第 132–133 页）。路线落地依赖算法理论与工程环境同时成熟。<\/p>\n<h2>辨析<\/h2>\n<p>与监督学习的差别：监督学习立刻得到对错标签，强化学习只得到延迟奖励；与进化算法的差别：遗传算法在种群层面做选择交叉变异，强化学习在个体策略上做反馈调整；两者都属“向自然学习”。与反向传播的关系：深度强化学习用神经网络逼近价值函数或策略，反向传播是其训练工具之一。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：图灵机（c09）给出可计算装置底座；连接主义（c04）提供函数逼近手段。后继：下棋系统（书中第 7 章）是强化学习最早工业级应用；所罗门诺夫归纳（c08）在算法信息论框架内把强化学习解释为在线学习。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（强化学习）<\/summary><div class=\"depth-body\"><h1>强化学习 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>倒查强化学习成立需要哪些前置：<\/p>\n<ol><li>\n序列决策模型：状态、动作、转移概率与回报可形式化，这就是马尔可夫决策过程（MDP）。\n<\/li><li>\n优化方法基础：贝尔曼 1950 年代动态规划提供多步决策的递推思路（PDF 第 130 页）。\n<\/li><li>\n反馈观念：图灵 1948 年《智能机器》内部报告里的 P 型机，只接受快乐、痛苦刺激，即奖励与惩罚（PDF 第 131 页）。\n<\/li><li>\n再往前的问题：监督学习给不出示范的任务，只能靠好坏反馈调整行为。\n<\/ol>\n<p>逆推基线：先认“动作影响后续状态”，再认“反馈可评价策略”，最后认“长期回报最大化为学习目标”。<\/p>\n<h2>正向推导<\/h2>\n<p>按理论、人物、工程、张力推进：<\/p>\n<ul><li>\n第一步，理论框架。MDP 把任务拆成状态—动作—转移—回报；动态规划提供多步决策递推。巴托与萨顿承认早期受动态规划启发（PDF 第 130 页）。依据：序列决策可在数学上形式化。\n<\/li><li>\n第二步，人物与第一性原理。巴托 1975 年到马萨诸塞大学任教，萨顿是他第一个博士生；两人形成关于学习的第一性原理，把目标制导称为奖励假设（Reward is enough）：以长期奖励最大化为目标的学习足以解释智能行为（PDF 第 128–131 页）。\n<\/li><li>\n第三步，思想源头。图灵 1948 年 P 型机以快乐/痛苦为输入；明斯基 1954 年博士论文也关于强化学习（PDF 第 131 页）。这说明奖励反馈观念早于 AI 学科名称。\n<\/li><li>\n第四步，工程算法。Q-Learning 由沃科金斯 1989 年剑桥大学博士论文提出（PDF 第 138 页）。核心张力是探索与利用：抬头看路尝试未知动作获取信息，低头拉车选取当前最优动作；学习率 <span class=\"katex-inline\">\\varepsilon<\/span> 调节二者权衡（PDF 第 132 页）。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：强化学习理论在 1980–90 年代已成形，2016 年 AlphaGo 击败李世石后才一夜成名；DeepMind 团队有萨顿四名学生，首席科学家席尔瓦是萨顿大弟子，2017 年 7 月在阿尔伯塔大学设联合实验室（PDF 第 132–133 页）。\n<\/li><li>\n史料：萨顿 2019 年《The Bitter Lesson》主张通用算法加增长算力自然提升智能；当下 Scaling Law 思路源于这一立场（PDF 第 133 页）。\n<\/li><li>\n推断：从理论到显学的间隔，条件是封闭规则任务出现、深度网络提供状态表示与策略逼近能力；游戏之所以先成为试验场，是因为规则固定、回报明确、环境可重复交互。这一条件归纳是推断，原书未做分层归因。\n<\/li><li>\n必然还是偶然：奖励反馈作为学习原则在控制论与心理学里早有雏形；AlphaGo 时点由围棋项目进度、人才聚集与工程环境共同决定，带有偶然性。\n<\/ul>\n<p>推导保留的限定：强化学习理论在 1980–90 年代已成形，成为显学仍要等到工业任务与工程环境成熟。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，下棋落地。2016 年 AlphaGo 击败李世石，强化学习作为核心算法一夜成名；DeepMind 团队有萨顿四名学生，席尔瓦是萨顿大弟子；2017 年 7 月 7 日 DeepMind 在阿尔伯塔大学开办联合实验室，是英国以外第一个研究机构（PDF 第 132–133 页）。案例二，任务外推。强化学习不只用于游戏，后续进入芯片布局、蛋白质折叠等固定规则场景（PDF 第 134–135 页）。案例三，路线哲学。萨顿《The Bitter Lesson》的立场是：通用算法加增长算力会持续胜过手工知识（PDF 第 133 页）。<\/p>\n<p>案例四，算力对照（数字史料 + 量级推断）。遗传编程路线在 1999 年由寇扎搭建 1000 个节点的 Pentium II 集群，软硬件统称 Beowulf，是 Hadoop 与 Spark 的先驱（PDF 第 125 页）；同期强化学习实验受限于单机或小规模并行环境。两组记录共同说明：1980–90 年代学习类算法的实验规模以单实验室设备为界，2010 年代后才跨入集群与大规模数据阶段。具体训练回合数与样本量原书未给，只做代际量级对照，不补造数字。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：把强化学习等同于打游戏是窄化。游戏只是早期环境易定义的试验场，理论骨架是 MDP、动态规划与奖励假设。反例二：奖励设计不当会学到偏离目标的策略；延迟奖励导致信用分配困难，这是强化学习区别于监督学习的固有难点。边界条件：任务可建模为状态—动作—奖励、规则短期稳定、回报可累积度量；去掉奖励信号，动作好坏无从判断；去掉长期回报目标，退化为单步判断。与进化算法的差别：遗传算法在种群层选择交叉变异，强化学习在个体策略上反馈调整。<\/p>\n<h2>史料补充<\/h2>\n<p>强化学习的思想源头在 AI 学科成形之前：图灵 1948 年《智能机器》内部报告提出只受快乐、痛苦刺激的 P 型机；明斯基 1954 年博士论文题目与强化学习有关；巴托与萨顿的师承链条是 1975 年巴托到马萨诸塞大学任教，萨顿成为他第一个博士生（PDF 第 128、131 页）。算法端，Q-Learning 出自沃科金斯 1989 年剑桥大学博士论文；工程端，DeepMind 与阿尔伯塔大学 2017 年 7 月 7 日开设联合实验室，首席科学家席尔瓦是萨顿大弟子（PDF 第 133、138 页）。与遗传编程的分工要分清：遗传算法在种群层做选择、交叉、变异；强化学习在单个策略上按奖励反馈调整动作，两者都用搜索逼近优化目标，但反馈层级不同（PDF 第 124–125、132 页）。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：强化学习是为打游戏发明的。<\/strong> 反证：理论骨架来自 MDP 与动态规划，思想源头可追到图灵 1948 年 P 型机与明斯基 1954 年博士论文；游戏只是最先落地的试验场（PDF 第 130–131 页）。\n<\/li><li>\n<strong>误读：强化学习每一步都能立刻得到对错标签。<\/strong> 反证：延迟奖励与信用分配是它的固有难点，行动的好坏要等多步之后才显现；这与监督学习的即时反馈不同（PDF 第 132 页）。\n<\/li><li>\n<strong>误读：奖励假设等于“唯奖励论”，否定其他学习机制。<\/strong> 反证：奖励假设是把目标制导作为统一视角；本书框架后来把监督学习、在线学习都放进归纳框架内解释，并未取消其他学习形态（PDF 第 131、218 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\nMDP 由哪些要素构成？动态规划在强化学习理论中提供了什么？\n<\/li><li>\n奖励假设主张什么？巴托与萨顿的师承关系是怎样的？\n<\/li><li>\n探索与利用各自指什么？<span class=\"katex-inline\">\\varepsilon<\/span> 在权衡中起什么作用？\n<\/li><li>\nQ-Learning 出自哪一年谁的学位论文？\n<\/li><li>\n为什么说游戏不是强化学习的全部？举出书中记载的其他应用方向。\n<\/ol><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.167<\/div><h1>统计 NLP、词嵌入与 Transformer<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6–8 章\n<\/ul>\n<h2>问题<\/h2>\n<p>早期自然语言处理靠人工写语法规则，但规则永远追不上真实语料的变体。待解决的困难是：不逐条书写语法，能否从平行语料与统计规律中获得翻译、对齐与表示能力；进一步，怎样把词变成可计算的表示，并用合适架构处理长序列。<\/p>\n<h2>定义逐句拆<\/h2>\n<ul><li>\n<strong>统计自然语言处理<\/strong>：用平行语料与概率模型替代人工语法规则，估计语言单元之间的搭配与转移概率。\n<\/li><li>\n<strong>词嵌入（word embedding）<\/strong>：把词表示成向量，让词义相近的词在向量空间中靠近。\n<\/li><li>\n<strong>Transformer<\/strong>：2017 年谷歌团队提出、基于注意力机制的序列架构，解除训练并行性限制（PDF 第 116、170 页）。\n<\/ul>\n<h2>推导<\/h2>\n<p>规则阶段：乔姆斯基句法理论代表规则语言学，文法层次与自动机等价；1953–1954 年 IBM 资助乔治敦大学做首次机器翻译实验，1964 年政府评估结论是机器翻译短期无法实用（PDF 第 149–150 页）。统计阶段：1988 年 IBM Thomas J. Watson 中心发表统计机器翻译论文，推出法英系统 CANDIDE，标志统计派在大数据支持下回潮；贾里尼克一派以信息论为训练背景，成员寇克 1987 年因 RISC 获图灵奖（PDF 第 167 页）。表示层：辛顿 1980 年代后期的词分布式表示工作引入词向量概念，2013 年谷歌 word2vec 率先工程实现词嵌入，2016 年 GNMT 取代统计翻译、误差降低约 60%（PDF 第 169 页）。架构层：2017 年 Transformer 基于注意力机制；谷歌走 BERT（Encoder-only，双向掩码），OpenAI 走 GPT（Decoder-only，单向 next token prediction）；GPT-3 于 2020 年问世，2022 年 11 月 30 日 ChatGPT 出现（PDF 第 170–171 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：有足够规模的语料与平行文本，计算资源可支撑概率模型或网络训练。边界：统计方法不解释语言结构为什么如此，只给数据上的描述；深度模型内部表示难以逐条归因。条件去掉会怎样：去掉语料规模，统计与嵌入都失去原料；去掉注意力机制，长序列的并行训练与长程依赖处理受限。<\/p>\n<h2>反例<\/h2>\n<p>规则派并未被证明错误，而是被成本压过：乔姆斯基批评端到端 NLP 结果无法解释，辛顿则批评乔姆斯基理性主义、主张数据驱动学习（PDF 第 183 页）。另一个边界案例：早期统计翻译不需要工程师懂源语言或目标语言，但这并不等于语言学问题消失，只是被推后到模型内部表示里。<\/p>\n<h2>辨析<\/h2>\n<p>BERT 与 GPT 的差别在预测方式：BERT 双向掩码猜被遮住的词，GPT 单向续写；Transformer 是二者共用的底层架构，不是理论本身。统计 NLP 与深度学习的差别：前者靠概率模型与特征，后者靠神经网络表示与序列架构。与强化学习的差别：NLP 主体是监督/自监督序列预测，强化学习处理序列决策与奖励。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：反向传播与多层网络（c05）提供训练手段；图灵机（c09）提供可计算底座。后继：所罗门诺夫归纳（c08）为 next token prediction 提供理论前身；强化学习（c06）后来用于大模型对齐。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（统计 NLP、词嵌入与 Transformer）<\/summary><div class=\"depth-body\"><h1>统计 NLP、词嵌入与 Transformer · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>倒查这条线需要哪些前置：<\/p>\n<ol><li>\n规则语言学先存在：乔姆斯基句法理论给出文法层次，文法与自动机等价（PDF 第 150–154 页）。\n<\/li><li>\n早期机器翻译失败记录：1953–1954 年 IBM 资助乔治敦大学首次实验，1964 年政府评估判定短期不可实用（PDF 第 149–150 页）。\n<\/li><li>\n概率工具：信息论提供语言单元搭配与转移概率的估计框架。\n<\/li><li>\n再往后，多层网络与训练手段成熟，词嵌入与序列架构才有承载物（见 c05）。\n<\/ol>\n<p>逆推基线：先认“规则追不上语料变体”，再认“概率可从语料估计”，最后认“词可变成向量、序列可被架构建模”。<\/p>\n<h2>正向推导<\/h2>\n<p>按范式阶段推进，每步标明证据：<\/p>\n<ul><li>\n第一步，规则阶段。乔姆斯基 1928 年生，句法分层与自动机对应：3 型文法等价有限自动机，1 型文法等价线性有界非确定图灵机，0 型文法等价图灵机；他认为语言结构内在、非经验习得，不认可统计方法（PDF 第 150–154 页）。依据：规则派追求解释语言结构。\n<\/li><li>\n第二步，统计阶段。1988 年 IBM Thomas J. Watson 研究中心发表统计机器翻译论文，推出法英系统 CANDIDE，标志统计派在大数据支持下回潮；贾里尼克一派以信息论为训练背景，成员寇克 1987 年因 RISC 获图灵奖（PDF 第 167 页）。依据：平行语料加概率模型可完成翻译对齐，工程师不必懂源语言与目标语言。\n<\/li><li>\n第三步，表示阶段。辛顿 1980 年代后期词分布式表示工作引入词向量概念；2013 年谷歌 word2vec 率先工程实现词嵌入；2016 年 GNMT 取代统计翻译，误差降低约 60%（PDF 第 169 页）。依据：词义可在向量空间中按距离组织。\n<\/li><li>\n第四步，架构阶段。2017 年谷歌 Transformer 基于注意力机制，解除训练并行性限制；谷歌 BERT 走 Encoder-only 双向掩码，OpenAI GPT 走 Decoder-only 单向 next token prediction；GPT-3 2020 年问世，2022 年 11 月 30 日 ChatGPT 出现（PDF 第 170–171 页）。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：规则阶段存续约 40 年，统计与浅层学习约 20 年，深度学习不到 10 年，大模型准备期约 5 年，阶段时长逐渐缩短（PDF 第 7、171 页）。\n<\/li><li>\n史料：2016 年 GNMT 取代上一代统计翻译，误差降低约 60%；同期沃森硬件为 90 台 IBM Power 750、720 核、2880 线程、16TB 内存、成本 300 万美元（PDF 第 169 页）。\n<\/li><li>\n推断：范式切换的共同条件是语料规模扩大与计算资源到位；规则路线的解释诉求并未被驳倒，只是在规模成本上被压过。这一条件归纳基于书中记录做推断。\n<\/li><li>\n必然还是偶然：统计与深度学习先后替代规则，有语料与工具成熟的必然性；Transformer 2017 年出现的具体时点与谷歌团队研究进度有关，带有偶然性。\n<\/ul>\n<p>推导保留的限定：范式切换是成本与条件驱动，不是规则派被证明错误；统计与深度模型也未解决可解释性问题。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，CANDIDE。1988 年 IBM 小组法英统计翻译系统，是统计路线回潮的标志（PDF 第 167 页）。案例二，词嵌入落地。word2vec 2013 年由谷歌实现，把词分布式表示变成可用工程对象；GNMT 2016 年神经翻译系统取代上一代统计翻译（PDF 第 169 页）。案例三，路线分野。BERT 抽走序列中 <span class=\"katex-inline\">x_i<\/span> 猜 <span class=\"katex-inline\">x_i<\/span>，双向；GPT 单向续写；Transformer 是共用底层架构（PDF 第 170、215 页）。案例四，评价对照：乔姆斯基批评端到端 NLP 结果无法解释，辛顿批评乔姆斯基理性主义、主张数据驱动（PDF 第 183 页）。<\/p>\n<p>案例五，硬件与效果量级（数字史料）。沃森系统 90 台 Power 750、720 核、2880 线程、16TB 内存、成本 300 万美元；按摩尔定律，2017 年同等算力约 20 万美元，2025 年不到 2 万美元（PDF 第 169 页）。GNMT 相对统计翻译误差降约 60%（PDF 第 169 页）。两组数字说明：翻译能力提升建立在可获得的算力与语料之上；具体模型参数量、训练 token 数原书未给，不做补造。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：统计方法不需要语言学知识，不等于语言学问题消失；它被推后到模型内部表示，可解释性争议仍在。反例二：规则派没有被驳倒，只是在规模成本上被压过；其解释诉求在大模型时代仍被提出。边界条件：语料规模、计算资源、序列架构三者齐备；去掉语料，统计与嵌入失去原料；去掉注意力机制，长序列并行训练与长程依赖处理受限。与强化学习的差别：NLP 主体是监督/自监督序列预测，强化学习处理序列决策与奖励。<\/p>\n<h2>史料补充<\/h2>\n<p>本书划分的 NLP 阶段时长：规则阶段约 40 年，统计与浅层学习约 20 年，深度学习不到 10 年，大模型准备期约 5 年；阶段时长缩短本身说明语料规模与工程条件在替换研究范式（PDF 第 171 页）。沃森案例提供中间对照：2011 年问答机沃森 90 台 Power 750、720 核、2880 线程、16TB 内存、成本 300 万美元，答案 95% 来自维基百科（PDF 第 168–169 页）。翻译线上，2016 年谷歌 GNMT 取代上一代统计翻译，误差降约 60%；模型架构上，2017 年 Transformer 解除训练并行性限制，word2vec 2013 年先行实现词嵌入（PDF 第 116、169 页）。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：NLP 进步是语言学理论被一步步证明正确。<\/strong> 反证：本书把阶段划分为规则、统计、深度学习、大模型准备期，路线切换主要由语料规模与工程条件驱动；规则派的解释诉求至今仍在争议中（PDF 第 171、183 页）。\n<\/li><li>\n<strong>误读：BERT 与 GPT 的差别只是训练语料。<\/strong> 反证：核心差别在预测方式——双向掩码猜词 vs 单向续写；Transformer 只是共用架构（PDF 第 170、215 页）。\n<\/li><li>\n<strong>误读：统计翻译系统必须先懂两门语言。<\/strong> 反证：贾里尼克一派的工程好处就是工程师不必具备语言学知识、不必懂源语言与目标语言，模型从平行语料估计搭配概率（PDF 第 167 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n乔姆斯基文法层次与自动机如何对应？他对统计方法持什么立场？\n<\/li><li>\nCANDIDE 是哪一年、哪个机构、什么语言对的统计翻译系统？\n<\/li><li>\nword2vec 与 GNMT 分别是哪一年的工作？词嵌入把词义组织在什么空间里？\n<\/li><li>\nBERT 与 GPT 的预测方式差别在哪？Transformer 在其中是什么位置？\n<\/li><li>\n为什么说范式切换是成本驱动，而不是规则派被证明错误？\n<\/ol><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.206<\/div><h1>所罗门诺夫归纳与算法信息论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 9–11 章\n<\/ul>\n<h2>问题<\/h2>\n<p>大语言模型靠“预测下一个词”获得能力，但工程实践背后需要一条理论解释：为什么在大量序列上预测下一个元素，会概括出语言规律甚至世界知识？待解决的困难是：把归纳推理写成可计算框架——给定已有序列，凭什么相信某个续写；什么叫对序列最经济的概括。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>所罗门诺夫归纳法<\/strong>：给定已知序列 <span class=\"katex-inline\">(x_1,\\dots,x_n)<\/span>，预测 <span class=\"katex-inline\">x_{n+1}<\/span>；找编码长度最短、能为已知序列建模的图灵机程序，据此预测后续元素（PDF 第 206 页）。逐句拆：<\/p>\n<ul><li>\n“最短程序”：描述序列所用程序越短，概括越强；\n<\/li><li>\n“可生成序列”：程序必须能输出已知数据，而不只是拟合；\n<\/li><li>\n“先验概率”：程序越短，先验概率越高，随长度增加而指数衰减；\n<\/li><li>\n“归纳”：从已有数据推未知续写，不是演绎证明。\n<\/ul>\n<h2>推导<\/h2>\n<p>人物线：所罗门诺夫 1951 年在芝加哥大学受卡尔纳普影响，归纳推理成为毕生方向；1956 年达特茅斯整个暑假在会，1956 年 8 月 14 日传阅打字稿；工作首次发表于 1960 年加州理工会议，1964 年《A Formal Theory of Inductive Inference》刊于《信息与控制》（PDF 第 201、204–206 页）。理论链：序列的描述复杂度即输出该序列的最短图灵机程序长度；所罗门诺夫、柯尔莫哥洛夫、蔡汀各自独立提出，合称 SKC 复杂性（所罗门诺夫-柯尔莫哥洛夫-蔡汀复杂性），也称算法熵、描述复杂性（PDF 第 208–210 页）。与工程的对应：这正是 GPT 核心机制 next token prediction 的理论前身；能概括已知数据的图灵机就是大模型；学习可被当作压缩，神经网络是通用逼近器候选（PDF 第 207 页）。2023 年 8 月伊利亚·苏茨克维在赛蒙斯计算理论研究所演讲确认：GPT 的数学依据就是所罗门诺夫归纳法（PDF 第 216、219 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：把数据看作可由程序生成的序列，接受“概括越短越可信”的奥卡姆原则。边界：所罗门诺夫归纳可能不停机，只能用近似算法放宽最小性与预测准确性；SKC 复杂性普遍不可计算，工程上用贝叶斯概率近似（PDF 第 207、218 页）。条件去掉会怎样：去掉最短程序原则，就退化为任意内插，没有选择续写的标准；去掉不可计算这一限制，理论会给出通用最优归纳器，现实中不存在。<\/p>\n<h2>反例<\/h2>\n<p>研究停滞近二十年，最终实现所罗门诺夫归纳的恰是神经网络（PDF 第 204 页）——理论先于工程，但工程直到数据、算力、网络结构齐备才落地。另一个反例边界：列文在柯尔莫哥洛夫复杂性基础上加时间限制提出 L-search 通用搜索，复杂性才变得可计算（PDF 第 212–213 页）；纯所罗门诺夫框架本身不能直接上机。<\/p>\n<h2>辨析<\/h2>\n<p>与香农信息论的差别：香农熵度量消息的统计不确定性，不要求找生成程序；SKC 复杂性度量描述长度，把信息论建立在可计算理论之上（PDF 第 211 页）。与统计 NLP 的差别：统计模型估计搭配概率，不追问最短程序；所罗门诺夫归纳给预测提供第一性原理解释。与反向传播的差别：反向传播是训练机制，归纳框架是目标与学习观，二者不在同一层。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：图灵机与丘奇-图灵论题（c09）提供“程序生成序列”的装置底座；词嵌入与 Transformer（c07）是工程实现。后继：强化学习（c06）被解释为框架内的在线学习；BERT/GPT 的预测方式分野在同一框架内比较。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（所罗门诺夫归纳与算法信息论）<\/summary><div class=\"depth-body\"><h1>所罗门诺夫归纳与算法信息论 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>倒查这条理论线需要哪些前置：<\/p>\n<ol><li>\n图灵机概念：生成序列的程序必须有可计算载体（见 c09，PDF 第 184 页）。\n<\/li><li>\n归纳推理问题：从已有序列推未知续写，需要一条选择候选续写的标准。\n<\/li><li>\n奥卡姆原则：概括越短越可信，作为先验排序依据。\n<\/li><li>\n更早的信息论：香农熵度量统计不确定性；算法信息论要把信息建立在可计算理论之上（PDF 第 211 页）。\n<\/ol>\n<p>逆推基线：先认“数据可由程序生成”，再认“最短程序是最好概括”，最后认“预测下一项就是归纳”。<\/p>\n<h2>正向推导<\/h2>\n<p>按人物、理论、工程对应三步推进：<\/p>\n<ul><li>\n第一步，人物与发表。所罗门诺夫 1951 年在芝加哥大学跟随卡尔纳普，归纳推理成为毕生方向；1956 年达特茅斯整个暑假在会，1956 年 8 月 14 日传阅打字稿；首次公开发表于 1960 年加州理工会议，1964 年《A Formal Theory of Inductive Inference》刊于《信息与控制》（PDF 第 201、204–206 页）。依据：归纳问题可形式化为序列预测。\n<\/li><li>\n第二步，理论构造。给定 <span class=\"katex-inline\">(x_1,\\dots,x_n)<\/span> 预测 <span class=\"katex-inline\">x_{n+1}<\/span>：找编码长度最短、能为已知序列建模的图灵机程序；程序越短先验概率越高，随长度增加指数衰减；序列描述复杂度即输出该序列的最短程序长度（PDF 第 206 页）。柯尔莫哥洛夫 1965 年提出同名复杂性，1968 年起引用所罗门诺夫；蔡汀独立确认柯尔莫哥洛夫工作；三人合称 SKC 复杂性（PDF 第 208–210 页）。\n<\/li><li>\n第三步，工程对应。这正是 GPT 核心机制 next token prediction 的理论前身；能概括已知数据的图灵机就是大模型；学习可被当作压缩，神经网络作为通用逼近器是候选实现（PDF 第 207 页）。2023 年 8 月伊利亚·苏茨克维在赛蒙斯计算理论研究所演讲确认：GPT 的数学依据是所罗门诺夫归纳法（PDF 第 216、219 页）。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：所罗门诺夫工作 1956 年已成稿，研究停滞近二十年，最终实现归纳机制的恰是神经网络（PDF 第 204 页）。\n<\/li><li>\n史料：SKC 复杂性普遍不可计算，最优压缩不存在通用算法，工程上用贝叶斯概率近似；列文加时间限制提出 L-search，搜索才可计算（PDF 第 212–213、218 页）。\n<\/li><li>\n推断：理论早于工程的间隔，条件是通用逼近装置、规模数据与算力都未就绪；不可计算这一环不会因时间提前而消失，工程只能走近似路线。这一条件归纳是推断，原书未做三因素分解。\n<\/li><li>\n必然还是偶然：把归纳写成最短程序排序，在可计算观念成熟后是可预期的方向；神经网络成为实现载体，与 2010 年代后的工程环境有关，带有偶然性。\n<\/ul>\n<p>推导保留的限定：归纳框架普遍不可计算，工程只能近似；理论暂时落后于工程实践。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，发表链。1956 年打字稿 → 1960 年加州理工会议 → 1964 年《信息与控制》正式论文；研究停滞近二十年，最终实现所罗门诺夫归纳的恰是神经网络（PDF 第 204 页）。案例二，复杂性定理。不变性定理：不同程序表示下最短描述长度只差常量；该定理可看作丘奇-图灵论题的推论（PDF 第 209 页）。案例三，可计算性补救。列文在柯尔莫哥洛夫复杂性基础上加时间限制，提出 L-search 通用搜索，复杂性才变得可计算（PDF 第 212–213 页）。案例四，术语对应：压缩时间对应训练时间，SKC 复杂性对应参数量，逻辑深度对应最短推断时间（PDF 第 214 页）。<\/p>\n<p>案例五，量级对照（史料 + 量级推断）。本书给出的对应是：参数量对应 SKC 复杂性，token 量对应建模对象规模，压缩时间对应训练时间，逻辑深度对应推断时间（PDF 第 214、207 页）。GPT-3 与后续模型的具体参数量、训练 token 数原书未给数字；可核对的史料是 2020 年 GPT-3 问世后 NTP 方法反超，2022 年 11 月 30 日 ChatGPT 出现（PDF 第 170 页）。凡涉及具体参数与 token 量级，此处不补造，只保留框架内的对应关系。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：纯所罗门诺夫框架不能直接上机。归纳可能不停机，SKC 复杂性普遍不可计算，工程上只能用贝叶斯概率近似（PDF 第 207、218 页）。反例二：学习即压缩不等于死记硬背；压缩要求概括出最短表示，共相比殊相经济，不可计算的是最优压缩，实际模型给出近似。边界条件：把数据看作可由程序生成的序列，接受最短概括优先原则；去掉最短程序原则，候选续写失去排序标准；去掉不可计算限制，会得到现实中不存在的通用最优归纳器。与香农信息论的差别：香农熵不追问生成程序，SKC 复杂性度量描述长度。<\/p>\n<h2>史料补充与框架对照<\/h2>\n<p>三位提出者的时间线：所罗门诺夫 1956 年已成稿、1960 年会议发表、1964 年正式刊文；柯尔莫哥洛夫 1965 年提出同名复杂性，后来注意到所罗门诺夫工作，1968 年起用俄文与英文文章引用，使后者在苏联名声比在西方更响；蔡汀独立确认了柯尔莫哥洛夫的工作（PDF 第 204–209 页）。三方合流后合称 SKC 复杂性，也称算法熵、描述复杂性（PDF 第 210 页）。<\/p>\n<p>框架内的学习形态对照：离线学习（监督学习）与在线学习（强化学习）在这一框架内都被解释为归纳过程——建模即压缩，压缩由图灵机完成；奥卡姆剃刀、波普尔证伪、库恩式科学革命可作为归纳的特例或近似，能覆盖全部数据的最小模型就是最短程序或最小图灵机（PDF 第 217–218 页）。与香农信息论的分界要记住：香农熵度量消息的统计不确定性，不追问生成程序；SKC 复杂性把信息论建立在可计算理论之上（PDF 第 211 页）。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：大模型只是把符号规则方法放大了规模。<\/strong> 反证：本书把 GPT 的理论前身追溯到所罗门诺夫归纳与算法信息论，next token prediction 是序列预测框架，不是规则清单的加长；伊利亚 2023 年 8 月演讲确认了这一依据（PDF 第 216、219 页）。\n<\/li><li>\n<strong>误读：既然学习即压缩，模型应该把知识原样背下来。<\/strong> 反证：压缩的目标是最短概括，共相表示比殊相堆积经济；最优压缩不可计算，实际模型是可逼近的近似，不是逐字存储（PDF 第 218 页）。\n<\/li><li>\n<strong>误读：所罗门诺夫归纳已经被神经网络完全实现。<\/strong> 反证：神经网络只是通用逼近器候选，探索非神经网络实现仍是开放课题；归纳可能不停机，框架本身未被工程闭合（PDF 第 207、216 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n所罗门诺夫归纳的输入输出各是什么？最短程序在其中扮演什么角色？\n<\/li><li>\nSKC 复杂性由哪三位学者各自独立提出？不变性定理说的是什么？\n<\/li><li>\n为什么说 next token prediction 的理论前身是所罗门诺夫归纳？伊利亚在哪一场合确认了这一点？\n<\/li><li>\n归纳框架为什么不能直接上机？列文的时间限制补救是什么？\n<\/li><li>\n“学习即压缩”与死记硬背的差别在哪里？不可计算的是哪一环？\n<\/ol><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.184<\/div><h1>图灵机与丘奇-图灵论题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 9–11 章\n<\/ul>\n<h2>问题<\/h2>\n<p>要讨论“机器能否思维”，先得说清机器能算什么、不能算什么。待解决的困难是：1930 年代需要一个足够简单、又能刻画所有可计算过程的抽象装置；同时要回答，不同计算模型（递归函数、λ 演算、Post 系统）之间是否等价，这种等价是不是已经被证明的事实。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>图灵机<\/strong>是图灵 1936 年《论可计算的数》定义的计算装置：一条无穷纸带、一个读写头、一个控制装置，在纸带上读写 0/1（PDF 第 184 页）。<strong>丘奇-图灵论题<\/strong>：所有功能足够强的计算装置，计算能力都等价于图灵机（PDF 第 186 页）。逐句拆：<\/p>\n<ul><li>\n“功能足够强”：排除太弱的装置；\n<\/li><li>\n“等价”：可互相模拟；\n<\/li><li>\n“论题”：是观察性结论，不是可证明的定理。\n<\/ul>\n<h2>推导<\/h2>\n<p>定义层：图灵 1936 年文章给出装置；丘奇 1937 年在《符号逻辑杂志》评论中首次使用“图灵机”一词（PDF 第 186 页）。等价层：当时递归函数、λ 演算、Post 系统、图灵机等已被证明可互相模拟，丘奇-图灵论题由此被提出；本书强调它是观察而不是定理——无法证明不会出现新的更强装置（PDF 第 185–186 页）。装置层：通用图灵机（UTM）把一台图灵机的执行过程编码成数据放上纸带，另一台机器读出编码指令并逐步模仿；被编码的图灵机就是软件，冯诺伊曼存储程序架构的思想由此而来（PDF 第 188 页）。分层：可计算性层面讨论能否算出来，计算复杂性层面讨论模拟成本；洪加威提出的相似性原则（强丘奇-图灵论题）讨论不同模型间的模拟成本，同样是工作假设（PDF 第 189–190 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：讨论经典数字计算，装置在可计算性层面足够强。边界：论题不能严格证明；相似性原则管的是复杂性，不是可计算性。条件去掉会怎样：如果机器在可计算性上满足论题、却在复杂性上不服从相似性原则，它能模拟图灵机但不能在多项式时间内模拟，也算一种“超计算”（PDF 第 191 页）。BSS 模型以任意精度实数比较为单位时间，一阶逻辑可判定，与图灵机停机不可判定形成对照；多依奇通用量子图灵机加入物理约束——量子计算机不能求解图灵机不可计算的问题，但在某些条件下可能违背强论题（PDF 第 191–194 页）。<\/p>\n<h2>反例<\/h2>\n<p>彭罗斯用“非算法”、有人用“超图灵”指称超越图灵机能力的装置；oracle 机器可追问超越图灵机的 oracle（PDF 第 190–191 页）。这些是理论上的边界设想，不是已实现的装置。本书判断：如果认可丘奇-图灵论题和相似性原则，人就是图灵机；现有 AI 工作都建立在这一认同之上（PDF 第 196 页）。<\/p>\n<h2>辨析<\/h2>\n<p>论题与定理的差别：论题是基于已有模型互相模拟的观察，定理有严格证明；可计算性与复杂性的差别：前者问停机与判定边界，后者问时间空间成本。与所罗门诺夫归纳的关系：图灵机是归纳框架中“生成序列的程序”的载体，SKC 复杂性定义在图灵机程序长度上。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：可追溯到数理逻辑对算术可判定性的讨论（哥德尔、塔尔斯基）。后继：符号主义（c01）、定理证明（c02）、连接主义（c04）与强化学习（c06）的所有实现，默认跑在等价于图灵机的装置上；所罗门诺夫归纳（c08）直接以图灵机为定义底座。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（图灵机与丘奇-图灵论题）<\/summary><div class=\"depth-body\"><h1>图灵机与丘奇-图灵论题 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>倒查这一概念需要哪些前置：<\/p>\n<ol><li>\n可判定性问题背景：算术是否可判定，逻辑系统哪些部分可判定，先有逻辑与数学基础讨论。\n<\/li><li>\n抽象装置需求：需要一个足够简单、又能刻画所有可计算过程的模型。\n<\/li><li>\n模型等价性观察：递归函数、λ 演算、Post 系统、图灵机之间已被证明可互相模拟。\n<\/li><li>\n再往前，工程后果：装置要能把程序本身编码成数据，才有通用机器与软件观念。\n<\/ol>\n<p>逆推基线：先认“计算是有限步骤变换”，再认“装置可抽象为纸带+读写头+控制”，最后认“等价性是观察不是定理”。<\/p>\n<h2>正向推导<\/h2>\n<p>按定义、等价、装置、分层推进：<\/p>\n<ul><li>\n第一步，定义装置。图灵 1936 年《论可计算的数》给出图灵机：无穷纸带、读写头、控制装置，读写 0/1；丘奇 1937 年在《符号逻辑杂志》评论中首次使用“图灵机”一词（PDF 第 184、186 页）。依据：用最少部件刻画可计算过程。\n<\/li><li>\n第二步，提出论题。丘奇-图灵论题主张所有功能足够强的计算装置，计算能力等价于图灵机；本书强调这是观察而不是定理——当时各模型已被证明可互相模拟，但无法证明未来不出现更强装置（PDF 第 185–186 页）。依据：已有模型等价记录支撑观察，严格证明超出范围。\n<\/li><li>\n第三步，通用装置。UTM 把一台图灵机的执行过程编码成数据放上纸带，另一台机器读出指令并逐步模仿；被编码的图灵机就是软件，冯诺伊曼存储程序架构思想由此而来（PDF 第 188 页）。\n<\/li><li>\n第四步，分层。可计算性层面讨论能否算出；复杂性层面讨论模拟成本。洪加威提出的相似性原则（强丘奇-图灵论题）讨论不同模型间模拟成本，同样是工作假设（PDF 第 189–190 页）。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：论题形成时，递归函数、λ 演算、Post 系统、图灵机已被证明可互相模拟；丘奇 1937 年评论命名“图灵机”（PDF 第 185–186 页）。\n<\/li><li>\n史料：BSS 模型假设任意精度实数比较为单位时间，一阶逻辑可判定；多依奇首创通用量子图灵机，提出丘奇-图灵-多依奇原理（PDF 第 191–194 页）。\n<\/li><li>\n推断：把论题分两层看——可计算性与复杂性——是为了避免把“能模拟”和“能在多项式时间模拟”混为一谈；这一分层读解基于本书章节结构做的归纳。\n<\/li><li>\n必然还是偶然：抽象出纸带+读写头的装置形态有历史偶然性；但等价性观察在多个模型收敛后才被提出，是模型比较积累后的结果。\n<\/ul>\n<p>推导保留的限定：论题不能严格证明；相似性原则管复杂性，不替代可计算性结论。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，模型对照。BSS 模型（布卢姆一家三口）以任意精度实数比较为单位时间，该模型里一阶逻辑可判定；这与图灵机上停机问题不可判定形成对照，差别可追溯到哥德尔证明算术不可判定、塔尔斯基证明实数一阶理论可判定两条逻辑线（PDF 第 191–192 页）。案例二，物理计算。多依奇首创通用量子图灵机模型，提出丘奇-图灵-多依奇原理，给计算加入物理约束；量子计算机不能求解图灵机不可计算的问题，但在某些条件下可能违背强论题（PDF 第 193–194 页）。案例三，哲学立场。本书判断：认可论题与相似性原则，人就是图灵机；现有 AI 工作都建立在这一认同之上，争议主要留在经典到量子、经典物理到量子物理两处跳跃（PDF 第 196、199 页）。<\/p>\n<p>案例四，分层对照（史料 + 量级推断）。可计算性层回答“停机问题是否可判定”，结论是不可判定；复杂性层回答“模拟需要多少时间空间”，相似性原则处理模型间模拟成本（PDF 第 189–191 页）。本书未给各模型模拟步数的具体倍数；凡涉及成本量级，此处只做两层区分，不补造复杂度系数。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：oracle 机器可追问超越图灵机的 oracle；彭罗斯用“非算法”、有人用“超图灵”指称这类装置（PDF 第 190–191 页）。这些是理论边界设想，不是已实现装置。反例二：可计算性满足论题不等于复杂性服从相似性原则；一台机器能模拟图灵机，却不能在多项式时间内模拟，也算一种超计算（PDF 第 191 页）。边界条件：讨论经典数字计算、装置足够强；去掉可计算性前提，论题无从谈起；把复杂性成本混进可计算性结论，会误判超计算边界。<\/p>\n<h2>史料补充与分层对照<\/h2>\n<p>论题两侧的文本脉络：图灵 1936 年《论可计算的数》给出装置；丘奇 1937 年在《符号逻辑杂志》评论中命名“图灵机”；同期可互相模拟的模型包括递归函数、λ 演算、Post 系统与图灵机（PDF 第 185–186 页）。需要分开的另一条线是 AI 语境：图灵 1948 年内部报告《智能机器》提出 P 型机，1950 年《计算机与智能》提出模仿游戏；这些讨论机器能否思维，而论题只刻画计算能力边界，不直接回答思维问题（PDF 第 131、184 页）。<\/p>\n<p>分层对照再补一条复杂性线索：非确定性图灵机上多项式时间可解的问题简称 NP，确定性图灵机上多项式时间可解的是 P；相似性原则讨论不同模型之间模拟的成本，把它混进可计算性结论，会把“跑不跑得动”误当成“能不能算”（PDF 第 189–190 页）。本书还记载 oracle 思想：一台图灵机可以追问 oracle，若 oracle 能力超过图灵机，就构成超计算设想（PDF 第 190–191 页）。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：丘奇-图灵论题是一条已被证明的定理。<\/strong> 反证：本书明确它是观察——当时装置可互相模拟，但无法排除未来出现更强装置；论题不具备定理的严格证明路径（PDF 第 186 页）。\n<\/li><li>\n<strong>误读：量子计算机能算出图灵机不可计算的问题。<\/strong> 反证：本书立场是不能；量子计算只在某些条件下违背强丘奇-图灵论题（复杂性层面），不违背可计算性层面的论题（PDF 第 194 页）。\n<\/li><li>\n<strong>误读：通用图灵机就是第一台电子计算机。<\/strong> 反证：UTM 是抽象模型，思想后果是程序可编码成数据、成为软件；存储程序架构的工程实现是另一环节（PDF 第 188 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n图灵机由哪几个部件构成？“图灵机”这个名称是谁在哪篇评论里使用的？\n<\/li><li>\n丘奇-图灵论题为什么是观察而不是定理？它覆盖哪些已被证明可互相模拟的模型？\n<\/li><li>\n通用图灵机怎样把程序变成数据？这一思想对存储程序架构有什么影响？\n<\/li><li>\nBSS 模型与图灵机模型在一阶逻辑可判定性上的结论有何不同？\n<\/li><li>\n量子计算能求解不可计算问题吗？它可能违背的是哪一层的论题？\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：起源与符号主义黄金年代<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1–2 章：起源与符号主义的黄金年代（达特茅斯会议、定理证明）<\/a><br>检查点：能说清 1956 达特茅斯会议的主要人物、符号派主张，以及定理证明从逻辑理论家到归结原理的路线<\/li><li class='path-step' id='path-02'><strong>步骤 02：专家系统、五代机与神经网络两次起落<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 3–5 章：专家系统、第五代机与神经网络的两次起落<\/a><br>检查点：能对比 DENDRAL/MYCIN 与感知机—反向传播两条线，说明符号工程为何受挫、连接主义为何复兴<\/li><li class='path-step' id='path-03'><strong>步骤 03：向自然学习、机器下棋与自然语言处理<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 6–8 章：向自然学习、机器下棋与自然语言处理<\/a><br>检查点：能讲清遗传算法与强化学习的来源、下棋程序的两次突破，以及 NLP 从规则到统计再到深度学习的范式切换<\/li><li class='path-step' id='path-04'><strong>步骤 04：语言、计算理论与大语言模型<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 9–11 章：语言、计算理论与大语言模型<\/a><br>检查点：能陈述图灵机与丘奇-图灵论题，并把所罗门诺夫归纳、压缩观与 GPT 的 next token prediction 串起来<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 人工智能学界公认的达特茅斯会议召开于哪一年？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 1943 年<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 1956 年<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 1965 年<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 1969 年<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 纽厄尔与司马贺共享图灵奖的年份是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 1956 年<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 1965 年<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 1975 年<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 1983 年<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> 按物理符号系统假说，智能的本质是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 神经元之间连接强度的调整<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 对符号的操作，最原始的符号对应物理客体<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 对环境奖励的长期累积<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 大量语料上的概率压缩<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q4.<\/b> 1958 年夏天，王浩在 IBM 704 上用 9 分钟证明了《数学原理》中一阶逻辑定理的多少条？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 全部 150 条<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 150 条中的 120 条<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 200 条命题逻辑定理<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 仅命题逻辑子集<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q5.<\/b> 罗宾逊的归结原理论文发表于哪一年、哪个刊物？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 1957 年，《符号逻辑杂志》<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 1965 年，JACM<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 1969 年，《人工智能杂志》<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 1970 年，《信息与控制》<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q6.<\/b> 归结原理最核心的简化是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 只需一条归结规则即可完成一阶逻辑证明推导<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 把所有定理转换成神经网络权重<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 用穷举搜索替代任何逻辑规则<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 把一阶逻辑降级为命题逻辑<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c03' data-chapter='ch02'><p class='quiz-q'><b>Q7.<\/b> 第一个专家系统 DENDRAL 解决的是什么问题？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 细菌感染诊断与处方<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 根据质谱仪数据推断化学物质结构<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> DEC 计算机零部件配置<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 常识规则入库<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-ty h1><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c06' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> Q-Learning 是在哪一年的哪篇学位论文中提出的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 1989 年，沃科金斯（Chris Watkins）剑桥大学博士论文<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 1986 年，鲁梅尔哈特《自然》论文<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 1975 年，霍兰德遗传算法著作<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 1998 年，萨顿与巴托教科书<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q13' data-type='single' data-concept='c06' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 强化学习中“探索”与“利用”的取舍指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 是否把代码开源给社区<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> 尝试未知动作获取新信息，还是选取当前已知最优动作<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> 训练数据用英文还是中文<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 使用 GPU 还是 CPU<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q3.<\/b> 1988 年 IBM Thomas J. Watson 研究中心在计算语言学会议上推出的法英统计机器翻译系统叫什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> GNMT<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> CANDIDE<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> word2vec<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> BERT<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q4.<\/b> 谷歌在哪一年率先在 word2vec 中工程实现了词嵌入？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 1988 年<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 2013 年<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 2016 年<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 2017 年<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 9–11 章：语言、计算理论与大语言模型<\/h1><div class='quiz-item' data-qid='q16' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 图灵在哪一年的文章《论可计算的数》中定义了后来被称为图灵机的计算装置？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 1936 年<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 1948 年<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> 1950 年<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> 1965 年<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q17' data-type='single' data-concept='c09' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 关于丘奇-图灵论题，下列说法哪条符合本书立场？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> 它是一条可以被严格证明的数学定理<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> 它是一个观察：足够强的计算装置互相等价<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 它断言量子计算机不可计算<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 它只适用于 LISP 程序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q3.<\/b> 所罗门诺夫归纳法的核心做法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 用最短的、能为已知序列建模的程序预测下一个序列元素<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 用人工规则逐条标注语法结构<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 在种群中反复交叉变异选出最优个体<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> 按奖励信号调整下棋策略<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q19' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q4.<\/b> 2023 年 8 月，伊利亚·苏茨克维在哪一场合透露 GPT 的数学依据是所罗门诺夫归纳？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> 伯克利 Hixon 会议<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> 赛蒙斯计算理论研究所（Simons Institute）演讲<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> 达特茅斯 50 周年重聚<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> ARPA-IPTO 报告会<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q20' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q5.<\/b> 按本书第 11 章的区分，BERT 与 GPT 在预测方式上的差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q20' value='0'> BERT 抽取序列中被遮住的词；GPT 做单向的 next token prediction<\/label><label class='quiz-opt'><input type='radio' name='q20' value='1'> BERT 用神经网络，GPT 用符号规则<\/label><label class='quiz-opt'><input type='radio' name='q20' value='2'> BERT 预测奖励，GPT 预测棋步<\/label><label class='quiz-opt'><input type='radio' name='q20' value='3'> 二者完全相同，只是训练语料不同<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='物理符号系统假说'>物理符号系统假说 — 纽厄尔与司马贺提出的主张：智能是对符号的操作，最原始的符号对应于物理客体 <span class=glossary-ref>（第 1–2 章：起源与符号主义的黄金年代（达特茅斯会议、定理证明））<\/span><\/li><li data-term='启发式'>启发式 — 借鉴人解决问题的经验性策略，而非穷举所有可能路径的搜索方法；“逻辑理论家”首创的程序思路 <span class=glossary-ref>（第 1–2 章：起源与符号主义的黄金年代（达特茅斯会议、定理证明））<\/span><\/li><li data-term='合一（unification）'>合一（unification） — 把两个一阶逻辑项按变量代换对齐的算法，普拉维茨提出、罗宾逊拓展，是归结原理的配套机制 <span class=glossary-ref>（第 1–2 章：起源与符号主义的黄金年代（达特茅斯会议、定理证明））<\/span><\/li><li data-term='归结原理（resolution）'>归结原理（resolution） — 罗宾逊 1965 年提出的单条推理规则：所有一阶逻辑证明推导只需归结这一条规则即可 <span class=glossary-ref>（第 1–2 章：起源与符号主义的黄金年代（达特茅斯会议、定理证明））<\/span><\/li><li data-term='专家系统'>专家系统 — 把领域专家知识提炼成规则、在狭窄专业领域内模拟专家判断的程序，代表系统有 DENDRAL、MYCIN <span class=glossary-ref>（第 3–5 章：专家系统、第五代机与神经网络的两次起落）<\/span><\/li><li data-term='产生式规则'>产生式规则 — “如果条件，那么结论”形式的规则；MYCIN 首创把它作为专家系统的核心要素并用于不精确推理 <span class=glossary-ref>（第 3–5 章：专家系统、第五代机与神经网络的两次起落）<\/span><\/li><li data-term='感知机（perceptron）'>感知机（perceptron） — 罗森布拉特 1957 年提出的单层神经网络模型，可在样本线性可分时收敛并完成简单模式识别 <span class=glossary-ref>（第 3–5 章：专家系统、第五代机与神经网络的两次起落）<\/span><\/li><li data-term='反向传播（backpropagation）'>反向传播（backpropagation） — 把输出误差逐层回传、用梯度下降调整多层网络权重的算法；1986 年 Rumelhart、Hinton、Williams 在《自然》杂志压缩发表 <span class=glossary-ref>（第 3–5 章：专家系统、第五代机与神经网络的两次起落）<\/span><\/li><li data-term='遗传算法'>遗传算法 — 霍兰德受进化论与遗传学启发、模拟种群选择、交叉与变异的进化式优化算法 <span class=glossary-ref>（第 6–8 章：向自然学习、机器下棋与自然语言处理）<\/span><\/li><li data-term='马尔可夫决策过程（mdp）'>马尔可夫决策过程（MDP） — 强化学习的理论框架之一：状态、动作与转移概率构成的序列决策模型 <span class=glossary-ref>（第 6–8 章：向自然学习、机器下棋与自然语言处理）<\/span><\/li><li data-term='奖励假设（reward is enough）'>奖励假设（Reward is enough） — 巴托与萨顿的观点：以长期奖励最大化为目标的学习，足以解释包括智能在内的种种行为 <span class=glossary-ref>（第 6–8 章：向自然学习、机器下棋与自然语言处理）<\/span><\/li><li data-term='词嵌入（word embedding）'>词嵌入（word embedding） — 把词表示成向量、让词义相近的词在向量空间中靠近的方法；2013 年谷歌 word2vec 率先工程实现 <span class=glossary-ref>（第 6–8 章：向自然学习、机器下棋与自然语言处理）<\/span><\/li><li data-term='图灵机'>图灵机 — 图灵 1936 年定义的计算装置：无穷纸带、读写头与控制装置，被丘奇在 1937 年评论中命名 <span class=glossary-ref>（第 9–11 章：语言、计算理论与大语言模型）<\/span><\/li><li data-term='丘奇-图灵论题'>丘奇-图灵论题 — 观察性结论：所有功能足够强的计算装置，计算能力都等价于图灵机；它不是数学定理 <span class=glossary-ref>（第 9–11 章：语言、计算理论与大语言模型）<\/span><\/li><li data-term='柯尔莫哥洛夫复杂性（skc 复杂性）'>柯尔莫哥洛夫复杂性（SKC 复杂性） — 输出某序列的最短程序长度；所罗门诺夫、柯尔莫哥洛夫、蔡汀各自独立提出，普遍不可计算 <span class=glossary-ref>（第 9–11 章：语言、计算理论与大语言模型）<\/span><\/li><li data-term='next token prediction'>next token prediction — 下一词元预测：给定已出现的序列预测下一个符号；GPT 系列大语言模型的核心机制，思想可追溯到所罗门诺夫归纳 <span class=glossary-ref>（第 9–11 章：语言、计算理论与大语言模型）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：先认路线，再记事件<\/h2>\n<p>碰到一段 AI 史材料，先判断它属于符号（规则/逻辑）、连接（网络/数据）还是行为（进化/奖励）路线；路线定了，人物、方法和成败原因各归其位，事件就不会记串。<\/p>\n<h2>模式 2：人物线与技术线并行读<\/h2>\n<p>每读一个阶段，同时追两条线：人物师承与合作（如纽厄尔-司马贺、巴托-萨顿、辛顿-学生），技术问题与解法（如 XOR 局限 → 多层网络 → 反向传播）。轶事只作记忆锚点，结论以技术线为准。<\/p>\n<h2>模式 3：区分“解释”与“描述”<\/h2>\n<p>规则派要解释语言/行为为什么有此结构；统计与深度学习给的是数据上的描述与预测。评价一个系统时先分清它回答的是“为什么”还是“是什么”，避免把工程效果当成科学解释。<\/p>\n<h2>模式 4：把工程突破放回三要素<\/h2>\n<p>一次方法起飞通常需要算法、算力、数据同时到位：感知机受限于单层与训练方法，深度学习等到反向传播成熟、GPU 算力和 ImageNet 规模数据才拐点。看到“新架构”先问另外两要素是否具备。<\/p>\n<h2>模式 5：理论主张与可计算性边界分开<\/h2>\n<p>哲学争论（语言是否等于思维、人是否机器）落到计算层面，先检查它预设的计算模型：图灵机、BSS 实数模型还是量子模型；再区分可计算性问题与复杂性问题，结论的适用范围才清楚。<\/p>\n<h2>模式 6：用归纳框架统一学习范式<\/h2>\n<p>监督学习、强化学习、序列预测在算法信息论里都是所罗门诺夫归纳的近似：找最短程序概括已有数据、预测新数据；模型规模对应描述复杂性，训练对应压缩，推断对应逻辑深度。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1–2 章 符号黄金年代<\/strong>：1956 达特茅斯 → 物理符号系统假说 → 定理证明（戴维斯 1954 / 王浩 1958 / 罗宾逊 1965）。\n<\/li><li>\n<strong>第 3–5 章 两次起落<\/strong>：DENDRAL → MYCIN → XCON；五代机 1981–1994 押 Prolog；感知机 1957 → 寒冬 1969 → 反向传播 1986 → AlexNet 2012。\n<\/li><li>\n<strong>第 6–8 章 向自然学习<\/strong>：遗传算法（霍兰德）→ 强化学习（巴托/萨顿）；下棋：香农 1950 → 深蓝 1997 → AlphaGo；NLP：规则 → 统计 → 深度学习 → Transformer 2017。\n<\/li><li>\n<strong>第 9–11 章 语言与理论<\/strong>：乔姆斯基思维即语言；图灵机 1936 与 CTT；所罗门诺夫归纳 = 最短程序预测下一项，学习即压缩。\n<\/ul>\n<h2>关键年份与人物<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>年份<\/th><th>事件<\/th><th>人物<\/th><\/tr><\/thead><tbody><tr><td>1943<\/td><td>神经元模型开山文章<\/td><td>麦卡洛克、皮茨<\/td><\/tr><tr><td>1956<\/td><td>达特茅斯会议；第二款跳棋程序<\/td><td>麦卡锡、明斯基、纽厄尔、司马贺；塞缪尔<\/td><\/tr><tr><td>1957<\/td><td>感知机提出<\/td><td>罗森布拉特<\/td><\/tr><tr><td>1958<\/td><td>王浩 IBM 704 机器证明<\/td><td>王浩；学生库克<\/td><\/tr><tr><td>1965<\/td><td>归结原理发表 JACM<\/td><td>罗宾逊<\/td><\/tr><tr><td>1969<\/td><td>《感知机》批判单层网络<\/td><td>明斯基、佩珀特<\/td><\/tr><tr><td>1976<\/td><td>MYCIN 博士论文<\/td><td>肖特莱福<\/td><\/tr><tr><td>1982<\/td><td>霍普菲尔德网络<\/td><td>霍普菲尔德<\/td><\/tr><tr><td>1986<\/td><td>反向传播《自然》论文<\/td><td>Rumelhart、Hinton、Williams<\/td><\/tr><tr><td>1989<\/td><td>Q-Learning 博士论文<\/td><td>沃科金斯<\/td><\/tr><tr><td>1997<\/td><td>深蓝胜卡斯帕罗夫<\/td><td>IBM 深蓝团队<\/td><\/tr><tr><td>2012<\/td><td>AlexNet 夺 ILSVRC<\/td><td>克里泽夫斯基、苏茨克维、辛顿<\/td><\/tr><tr><td>2013<\/td><td>word2vec<\/td><td>谷歌<\/td><\/tr><tr><td>2017<\/td><td>Transformer<\/td><td>谷歌团队<\/td><\/tr><tr><td>2022-11-30<\/td><td>ChatGPT 问世<\/td><td>OpenAI<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>概念辨析<\/h2>\n<ul><li>\n<strong>符号主义<\/strong>：智能 = 符号操作；知识来自人工规则与逻辑。\n<\/li><li>\n<strong>连接主义<\/strong>：智能 = 连接强度调整；知识来自数据训练。\n<\/li><li>\n<strong>行为/进化路线<\/strong>：遗传算法模拟种群进化；强化学习靠奖励试错。\n<\/li><li>\n<strong>CTT vs 相似性原则<\/strong>：前者管可计算性（能否算），后者管复杂性（模拟成本）；都是观察，不是定理。\n<\/li><li>\n<strong>BERT vs GPT<\/strong>：双向掩码完形填空 vs 单向 next token prediction；Transformer 是共用架构。\n<\/ul>\n<h2>反例库<\/h2>\n<ul><li>\n“AI 一词确定由麦卡锡发明”——本书记为悬案。\n<\/li><li>\n“逻辑理论家是第一个可运行定理证明程序”——第一归戴维斯 1954。\n<\/li><li>\n“反向传播 1986 年凭空出现”——Werbos 1974 已有早期工作。\n<\/li><li>\n“量子计算机能算不可计算问题”——不能，只可能违背强 CTT（复杂性层面）。\n<\/ul>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const SYN_GROUPS = [["定义", "含义", "释义", "概念"], ["例题", "算例", "示例", "例子", "案例"], ["习题", "题目", "练习", "测验", "自测"], ["推导", "证明", "论证", "演算"], ["步骤", "流程", "过程", "环节"], ["性质", "特性", "特点", "属性"], ["公式", "表达式", "式子"], ["定理", "定律", "法则", "准则"], ["图像", "图形", "图示", "曲线"], ["计算", "求解", "算出", "求值"], ["平均值", "均值", "平均数"], ["误差", "偏差", "偏离"], ["函数", "映射", "对应关系"], ["导数", "变化率", "切线斜率", "微商"], ["原函数", "不定积分", "反导数"], ["概率", "几率", "可能性"]];
const SOURCES = {};
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
const ZS_VERSION = '1.9.0';
/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}
