<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>人工智能简史（第3版）</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>

html,
body {

}

body {

CIN", "chapterId": "ch02"}, {"term": "产生式规则", "def": "“如果条件，那么结论”形式的规则；MYCIN 首创把它作为专家系统的核心要素并用于不精确推理", "chapterId": "ch02"}, {"term": "感知机（perceptron）", "def": "罗森布拉特 1957 年提出的单层神经网络模型，可在样本线性可分时收敛并完成简单模式识别", "chapterId": "ch02"}, {"term": "反向传播（backpropagation）", "def": "把输出误差逐层回传、用梯度下降调整多层网络权重的算法；1986 年 Rumelhart、Hinton、Williams 在《自然》杂志压缩发表", "chapterId": "ch02"}, {"term": "遗传算法", "def": "霍兰德受进化论与遗传学启发、模拟种群选择、交叉与变异的进化式优化算法", "chapterId": "ch03"}, {"term": "马尔可夫决策过程（MDP）", "def": "强化学习的理论框架之一：状态、动作与转移概率构成的序列决策模型", "chapterId": "ch03"}, {"term": "奖励假设（Reward is enough）", "def": "巴托与萨顿的观点：以长期奖励最大化为目标的学习，足以解释包括智能在内的种种行为", "chapterId": "ch03"}, {"term": "词嵌入（word embedding）", "def": "把词表示成向量、让词义相近的词在向量空间中靠近的方法；2013 年谷歌 word2vec 率先工程实现", "chapterId": "ch03"}, {"term": "图灵机", "def": "图灵 1936 年定义的计算装置：无穷纸带、读写头与控制装置，被丘奇在 1937 年评论中命名", "chapterId": "ch04"}, {"term": "丘奇-图灵论题", "def": "观察性结论：所有功能足够强的计算装置，计算能力都等价于图灵机；它不是数学定理", "chapterId": "ch04"}, {"term": "柯尔莫哥洛夫复杂性（SKC 复杂性）", "def": "输出某序列的最短程序长度；所罗门诺夫、柯尔莫哥洛夫、蔡汀各自独立提出，普遍不可计算", "chapterId": "ch04"}, {"term": "next token prediction", "def": "下一词元预测：给定已出现的序列预测下一个符号；GPT 系列大语言模型的核心机制，思想可追溯到所罗门诺夫归纳", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "人工智能学界公认的达特茅斯会议召开于哪一年？", "options": ["1943 年", "1956 年", "1965 年", "1969 年"], "answer": 1, "explain": "本书第 1 章开篇即称 1956 年的达特茅斯会议是 AI 起源的公认标志（PDF 第 13 页）；1955 年洛杉矶西部计算机联合大会的学习机讨论会只是前戏。", "relatedConceptId": "c01"}, {"id": "q02", "chapterId": "ch01", "type": "single", "question": "纽厄尔与司马贺共享图灵奖的年份是？", "options": ["1956 年", "1965 年", "1975 年", "1983 年"], "answer": 2, "explain": "据本书第 1 章（PDF 第 17 页），二人共享 1975 年图灵奖，三年后司马贺再获诺贝尔经济学奖。", "relatedConceptId": "c01"}, {"id": "q03", "chapterId": "ch01", "type": "single", "question": "按物理符号系统假说，智能的本质是什么？", "options": ["神经元之间连接强度的调整", "对符号的操作，最原始的符号对应物理客体", "对环境奖励的长期累积", "大量语料上的概率压缩"], "answer": 1, "explain": "这是纽厄尔与司马贺代表的符号派主张（PDF 第 17 页）；连接强度调整属于连接主义，奖励累积属于强化学习，概率压缩属于后面的算法信息论视角。", "relatedConceptId": "c01"}, {"id": "q04", "chapterId": "ch01", "type": "single", "question": "1958 年夏天，王浩在 IBM 704 上用 9 分钟证明了《数学原理》中一阶逻辑定理的多少条？", "options": ["全部 150 条", "150 条中的 120 条", "200 条命题逻辑定理", "仅命题逻辑子集"], "answer": 1, "explain": "本书第 2 章（PDF 第 36 页）记载：1958 年夏的程序 9 分钟证明一阶逻辑全部 150 条中的 120 条；1959 年夏改进版才证明全部一阶定理外加 200 条命题逻辑定理。", "relatedConceptId": "c02"}, {"id": "q05", "chapterId": "ch01", "type": "single", "question": "罗宾逊的归结原理论文发表于哪一年、哪个刊物？", "options": ["1957 年，《符号逻辑杂志》", "1965 年，JACM", "1969 年，《人工智能杂志》", "1970 年，《信息与控制》"], "answer": 1, "explain": "本书第 2 章（PDF 第 38 页）记载：文章因匿名审稿耽搁，迟至 1965 年才发表在 JACM 上。", "relatedConceptId": "c02"}, {"id": "q06", "chapterId": "ch01", "type": "single", "question": "归结原理最核心的简化是什么？", "options": ["只需一条归结规则即可完成一阶逻辑证明推导", "把所有定理转换成神经网络权重", "用穷举搜索替代任何逻辑规则", "把一阶逻辑降级为命题逻辑"], "answer": 0, "explain": "本书第 2 章（PDF 第 39 页）：以前的证明技术需要很多规则，有了归结原理，所有证明推导只要归结这一条规则就可以；它配合合一算法使用。", "relatedConceptId": "c02"}, {"id": "q07", "chapterId": "ch02", "type": "single", "question": "第一个专家系统 DENDRAL 解决的是什么问题？", "options": ["细菌感染诊断与处方", "根据质谱仪数据推断化学物质结构", "DEC 计算机零部件配置", "常识规则入库"], "answer": 1, "explain": "本书第 3 章（PDF 第 65 页）：DENDRAL 使用质谱仪数据输出给定物质的化学结构；细菌感染诊断是 MYCIN，零部件配置是 XCON，常识入库是 Cyc。", "relatedConceptId": "c03"}, {"id": "q08", "chapterId": "ch02", "type": "single", "question": "按本书记载，MYCIN 的处方准确率与当时专科医生相比如何？", "options": ["69%，低于专科医生的 80%", "80%，高于专科医生的 69%", "同为 80%", "69%，低于非本专业医生"], "answer": 0, "explain": "本书第 3 章（PDF 第 66 页）：MYCIN 处方准确率 69%，专科医生 80%，但已优于非本专业的医生；MYCIN 从未真正临床使用。", "relatedConceptId": "c03"}, {"id": "q09", "chapterId": "ch02", "type": "single", "question": "明斯基与佩珀特在 1969 年《感知机》一书中证明单层神经网络不能解决哪个基本问题？", "options": ["与（AND）", "异或（XOR）", "非（NOT）", "恒等映射"], "answer": 1, "explain": "本书第 5 章（PDF 第 97 页）：《感知机：计算几何学》证明单层网络不能解决 XOR（异或）问题；这一批判被认为导致神经网络进入近二十年的低谷。", "relatedConceptId": "c04"}, {"id": "q10", "chapterId": "ch02", "type": "single", "question": "反向传播在多层神经网络中的主要作用是？", "options": ["把输出误差逐层回传，用梯度下降调整各层权重", "随机初始化网络结构", "把符号规则翻译成逻辑子句", "在种群之间做交叉变异"], "answer": 0, "explain": "反向传播把误差信号沿网络反向传递，配合梯度下降更新多层权重；本书第 5 章记载 Werbos 1974 年已有相关文章，1986 年 Rumelhart、Hinton、Williams 在《自然》杂志发表压缩版本（PDF 第 111、118 页）。", "relatedConceptId": "c05"}, {"id": "q11", "chapterId": "ch02", "type": "single", "question": "2012 年 ImageNet 大赛上，辛顿团队 SuperVision（AlexNet）的核心成员包括？", "options": ["克里泽夫斯基、伊利亚·苏茨克维和辛顿", "本吉奥、杨立昆和辛顿", "霍普菲尔德和谢诺夫斯基", "萨顿和席尔瓦"], "answer": 0, "explain": "本书第 5 章（PDF 第 113 页）：AlexNet 因克里泽夫斯基得名，团队另有伊利亚（苏茨克维）；2018 年图灵奖则颁给辛顿、本吉奥与杨立昆（PDF 第 114 页），注意区分这两组人。", "relatedConceptId": "c05"}, {"id": "q12", "chapterId": "ch03", "type": "single", "question": "Q-Learning 是在哪一年的哪篇学位论文中提出的？", "options": ["1989 年，沃科金斯（Chris Watkins）剑桥大学博士论文", "1986 年，鲁梅尔哈特《自然》论文", "1975 年，霍兰德遗传算法著作", "1998 年，萨顿与巴托教科书"], "answer": 0, "explain": "本书第 6 章参考文献部分（PDF 第 138 页）：Q-Learning 例子出自 Watkins 1989 年剑桥大学博士论文。", "relatedConceptId": "c06"}, {"id": "q13", "chapterId": "ch03", "type": "single", "question": "强化学习中“探索”与“利用”的取舍指的是？", "options": ["是否把代码开源给社区", "尝试未知动作获取新信息，还是选取当前已知最优动作", "训练数据用英文还是中文", "使用 GPU 还是 CPU"], "answer": 1, "explain": "本书第 6 章（PDF 第 132 页）：探索是“抬头看路”，利用是“低头拉车”；把最高摇臂上投注就是利用，二者的权衡是强化学习的基本问题。", "relatedConceptId": "c06"}, {"id": "q14", "chapterId": "ch03", "type": "single", "question": "1988 年 IBM Thomas J. Watson 研究中心在计算语言学会议上推出的法英统计机器翻译系统叫什么？", "options": ["GNMT", "CANDIDE", "word2vec", "BERT"], "answer": 1, "explain": "本书第 8 章（PDF 第 167 页）：1988 年 IBM 小组发表统计机器翻译论文并推出法语-英语系统 CANDIDE，标志统计派在大数据支持下回潮；GNMT 是 2016 年谷歌神经翻译系统。", "relatedConceptId": "c07"}, {"id": "q15", "chapterId": "ch03", "type": "single", "question": "谷歌在哪一年率先在 word2vec 中工程实现了词嵌入？", "options": ["1988 年", "2013 年", "2016 年", "2017 年"], "answer": 1, "explain": "本书第 8 章（PDF 第 169 页）：辛顿 1980 年代后期的词分布式表示工作引入词向量概念，2013 年谷歌在 word2vec 中率先实现词嵌入。", "relatedConceptId": "c07"}, {"id": "q16", "chapterId": "ch04", "type": "single", "question": "图灵在哪一年的文章《论可计算的数》中定义了后来被称为图灵机的计算装置？", "options": ["1936 年", "1948 年", "1950 年", "1965 年"], "answer": 0, "explain": "本书第 10 章（PDF 第 184 页）：计算机科学起源于图灵 1936 年那篇文章；1948 年《智能机器》是内部报告，1950 年《计算机与智能》提出模仿游戏。", "relatedConceptId": "c09"}, {"id": "q17", "chapterId": "ch04", "type": "single", "question": "关于丘奇-图灵论题，下列说法哪条符合本书立场？", "options": ["它是一条可以被严格证明的数学定理", "它是一个观察：足够强的计算装置互相等价", "它断言量子计算机不可计算", "它只适用于 LISP 程序"], "answer": 1, "explain": "本书第 10 章（PDF 第 186 页）：丘奇-图灵论题是一个观察而不是定理；当时递归函数、λ 演算、Post 系统、图灵机等已被证明可互相模拟。", "relatedConceptId": "c09"}, {"id": "q18", "chapterId": "ch04", "type": "single", "question": "所罗门诺夫归纳法的核心做法是？", "options": ["用最短的、能为已知序列建模的程序预测下一个序列元素", "用人工规则逐条标注语法结构", "在种群中反复交叉变异选出最优个体", "按奖励信号调整下棋策略"], "answer": 0, "explain": "本书第 11 章（PDF 第 206 页）：给定序列找编码长度最短的图灵机程序为其建模，从而准确预测后续序列；这正是 next token prediction 的理论前身，学习可被看作压缩。", "relatedConceptId": "c08"}, {"id": "q19", "chapterId": "ch04", "type": "single", "question": "2023 年 8 月，伊利亚·苏茨克维在哪一场合透露 GPT 的数学依据是所罗门诺夫归纳？", "options": ["伯克利 Hixon 会议", "赛蒙斯计算理论研究所（Simons Institute）演讲", "达特茅斯 50 周年重聚", "ARPA-IPTO 报告会"], "answer": 1, "explain": "本书第 11 章（PDF 第 216、219 页）：2023 年 8 月伊利亚在赛蒙斯计算理论研究所的演讲中明确透露，next token prediction 的理论基础即所罗门诺夫归纳法（Sutskever, 2023）。", "relatedConceptId": "c08"}, {"id": "q20", "chapterId": "ch04", "type": "single", "question": "按本书第 11 章的区分，BERT 与 GPT 在预测方式上的差别是？", "options": ["BERT 抽取序列中被遮住的词；GPT 做单向的 next token prediction", "BERT 用神经网络，GPT 用符号规则", "BERT 预测奖励，GPT 预测棋步", "二者完全相同，只是训练语料不同"], "answer": 0, "explain": "本书第 11 章（PDF 第 215 页）：BERT 可描述为给定序列抽走 $x_i$ 猜 $x_i$ 是什么（掩码、双向），GPT 采用单向 next token prediction；Transformer 只是实现这一机制的一种架构。", "relatedConceptId": "c08"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "达特茅斯会议", "back": "1956 年夏季研讨会，AI 学科公认起点；召集者麦卡锡，核心人物还有明斯基、香农、纽厄尔、司马贺、塞弗里奇、所罗门诺夫等", "tags": ["史实"]}, {"id": "f02", "chapterId": "ch01", "front": "物理符号系统假说", "back": "纽厄尔与司马贺：智能是对符号的操作，符号对应物理客体；符号派的核心主张", "tags": ["概念"]}, {"id": "f03", "chapterId": "ch01", "front": "归结原理", "back": "阿兰·罗宾逊 1965 年发表于 JACM；一条归结规则配合合一算法完成一阶逻辑证明", "tags": ["史实"]}, {"id": "f04", "chapterId": "ch01", "front": "王浩 1958 年的机器证明", "back": "IBM 704 上 9 分钟证明《数学原理》一阶逻辑 150 条中的 120 条；学生库克后来提出 NP 完全性理论", "tags": ["史实"]}, {"id": "f05", "chapterId": "ch02", "front": "DENDRAL", "back": "第一个专家系统：费根鲍姆团队与莱德伯格合作，由质谱数据推断化学物质结构（PDF 第 65 页）", "tags": ["史实"]}, {"id": "f06", "chapterId": "ch02", "front": "感知机", "back": "罗森布拉特 1957 年提出的单层网络；线性可分时收敛；1962 年写成《神经动力学原理》", "tags": ["概念"]}, {"id": "f07", "chapterId": "ch02", "front": "《感知机》一书的结论", "back": "明斯基与佩珀特 1969 年证明单层网络不能解决 XOR；此后神经网络进入近二十年低谷", "tags": ["史实"]}, {"id": "f08", "chapterId": "ch02", "front": "反向传播的 1986 年论文", "back": "Rumelhart、Hinton、Williams 在《自然》杂志发表压缩版本；未引用 Werbos 1974 年的早期博士论文", "tags": ["史实"]}, {"id": "f09", "chapterId": "ch03", "front": "强化学习三要素", "back": "Agent（智能体）、环境、奖励与惩罚；Agent 根据经验改变策略，以期长期奖励最大", "tags": ["概念"]}, {"id": "f10", "chapterId": "ch03", "front": "奖励假设", "back": "“Reward is enough.” 巴托与萨顿：长期奖励最大化这一目标制导足以解释智能行为", "tags": ["概念"]}, {"id": "f11", "chapterId": "ch03", "front": "Transformer", "back": "2017 年谷歌团队提出，基于注意力机制，解除训练并行性限制；后成为各类模态大模型的底层架构", "tags": ["史实"]}, {"id": "f12", "chapterId": "ch04", "front": "丘奇-图灵论题", "back": "所有功能足够强的计算装置计算能力等价于图灵机；是观察，不是定理", "tags": ["概念"]}, {"id": "f13", "chapterId": "ch04", "front": "所罗门诺夫归纳", "back": "用最短程序为已知序列建模并预测下一个元素；先验概率随程序长度增加而指数衰减", "tags": ["概念"]}, {"id": "f14", "chapterId": "ch04", "front": "学习即压缩", "back": "在 SKC 理论里，建模就是找最短程序；所罗门诺夫归纳与 SKC 复杂性普遍不可计算，工程上用贝叶斯概率近似", "tags": ["观点"]}]}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.13<\/div><h1>第 1–2 章：起源与符号主义的黄金年代（达特茅斯会议、定理证明）<\/h1>\n<blockquote>对应原书第 1 章《达特茅斯会议：人工智能的缘起》、第 2 章《自动定理证明兴衰纪》（PDF 第 13–62 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出达特茅斯会议的年份、主要召集者与核心人物，分清符号派与神经网络派的早期分野；\n<\/li><li>\n解释物理符号系统假说的主张，以及它为什么被称作符号主义的纲领；\n<\/li><li>\n梳理自动定理证明从“逻辑理论家”、王浩的机器证明到罗宾逊归结原理的路线，并指出每条路线解决了什么、留下了什么问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>人工智能的起点不是某台机器，而是一次会议与一个信念：<strong>智能可以被拆成对符号的操作，而符号操作可以交给机器<\/strong>；定理证明则是这条路线最早、最硬核的技术阵地。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 前戏：1955 年洛杉矶的学习机讨论会<\/h3>\n<p>公认的 AI 起点是 1956 年的达特茅斯会议，但本书先记了一场前戏：1955 年美国西部计算机联合大会在洛杉矶套开“学习机讨论会”。与会的塞弗里奇（Oliver Selfridge）讲模式识别，纽厄尔（Allen Newell）讲计算机下棋；讨论会主持人是神经网络鼻祖之一皮茨（Walter Pitts）。皮茨总结时说，一派人模拟神经系统，纽厄尔那一派模拟心智（mind），但殊途同归——这句话提前预告了之后几十年逻辑与神经网络两条进路的矛盾（PDF 第 13 页）。<\/p>\n<p>为什么要先讲这场前戏？因为 AI 从第一天起就不是一条路线：有人从大脑结构出发，有人从心智功能出发。后面七十年的起落，基本都是这两条路线在不同硬件、数据和理论条件下的重演。<\/p>\n<h3>2. 达特茅斯会议：六个人与一份建议书<\/h3>\n<p>会议召集者麦卡锡（John McCarthy，1927—2011）当时是达特茅斯学院数学系助理教授；另一位积极参加者是明斯基（Marvin Lee Minsky），两人在普林斯顿读书时就相熟。受邀的还有信息论创始人香农（Claude Shannon，1916—2001），以及后来终生合作的纽厄尔与司马贺（Herbert Simon，1916—2001）。1955 年夏天，麦卡锡与 IBM 的罗切斯特（Nathaniel Rochester）打算第二年在达特茅斯办活动，遂说动香农和明斯基一起给洛克菲勒基金会写项目建议书（PDF 第 13–18 页）。<\/p>\n<p>一个常被搞错的细节：“人工智能”这个词并不确定是麦卡锡原创。他晚年承认最早是从别人那里听来、记不清是谁；英国人伍德华（Philip Woodward）后来给杂志写信自称原创者。麦卡锡的建议书 1955 年就已经在用“人工智能”了，当事人都已仙逝，这成了一桩悬案（PDF 第 19–20 页）。<\/p>\n<h3>3. 人物线：纽厄尔与司马贺代表的符号派<\/h3>\n<p>纽厄尔在兰德公司认识了司马贺，司马贺把他力邀到卡内基-梅隆大学并给他博士学位。他们共享 1975 年图灵奖，三年后司马贺再获诺贝尔经济学奖。他们把自己的思路命名为<strong>物理符号系统假说<\/strong>：智能是对符号的操作，最原始的符号对应于物理客体。这个思路接近英美经验主义传统，也和当时数学系主任、第一届图灵奖得主珀里思（Alan Perlis）一起，帮卡内基-梅隆建起计算机系（PDF 第 16–17 页）。<\/p>\n<p>为什么这一派被叫作“符号主义”？因为它假定：不管大脑里神经元怎么放电，智能在描述层面可以用符号（如“客体”“关系”“规则”）及其操作来刻画。只要机器能操作这些符号，就不必复刻大脑的物理结构。<\/p>\n<h3>4. 概念 1：符号主义与物理符号系统假说（难度：基础）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。一句话：<strong>符号主义相信智能的核心是符号的表示与变换<\/strong>；物理符号系统假说是纽厄尔与司马贺对这一信念的正式表述。<\/p>\n<h3>5. 技术线：自动定理证明为什么成了符号派的第一块试验田<\/h3>\n<p>纽厄尔和司马贺在会上报告的“逻辑理论家”（Logic Theorist），能证明怀特海与罗素《数学原理》命题逻辑部分的一个很大子集。它常被当作 AI 史上最重要的原创工作之一，但本书提醒：它对机器定理证明这个分支影响并不大——逻辑学家并不买账（PDF 第 23 页）。<\/p>\n<p>为什么定理证明是符号派的硬核阵地？因为数学证明是最纯粹的符号操作：前提、规则、结论全是符号串，证明就是按规则把一串符号变成另一串。如果机器能自动完成证明，就等于在最高标准的“理性活动”上摸到了智能。符号派的思想源头和理论基础就是定理证明，不懂定理证明就没法深入了解符号派（PDF 第 32 页）。<\/p>\n<h3>6. 概念 2：自动定理证明与归结原理（难度：进阶）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。这条线上有几个必须记住的节点：<\/p>\n<ul><li>\n<strong>戴维斯（Martin Davis）1954 年<\/strong>在普林斯顿高等研究院的 JOHNNIAC 上完成第一个定理证明程序，文章 1957 年才发表；它实现了普利斯博格算术（只有加法、没有乘法的可判定算术）的判定过程（PDF 第 33–34 页）。\n<\/li><li>\n<strong>王浩<\/strong>1958 年夏天在 IBM 704 上实现完全的命题逻辑程序和一阶逻辑程序，后者只用 9 分钟就证明《数学原理》一阶逻辑全部 150 条定理中的 120 条；1959 年夏天的改进版证明全部一阶定理外加 200 条命题逻辑定理。他的学生库克（Stephen Cook）后来在 1971 年《定理证明的复杂性》一文中提出 NP 完全性理论，1982 年获图灵奖（PDF 第 36 页）。\n<\/li><li>\n<strong>罗宾逊（John Alan Robinson，1930—2016）<\/strong>在实现 DP 过程的过程中发现<strong>归结（resolution）原理<\/strong>，文章迟至 1965 年发表在 JACM。有了归结，所有一阶逻辑证明推导只需归结这一条规则；它配合拓展后的合一算法，是定理证明的重要里程碑（PDF 第 38–39 页）。\n<\/ul>\n<h3>7. 阿贡小组与机器证明的实干路线<\/h3>\n<p>罗宾逊后来全职加入阿贡国家实验室的定理证明小组，同事有盲人数学家沃思（Larry Wos）。阿贡小组的精神是实战：提出支持集（set of support）等提高效率的概念。小组成员马库恩（William McCune，1953—2011）用 C 写了 Otter 证明器，又用专门证明方程的 EQP 在 1996 年 10 月 10 日证明了 1933 年提出、六十多年未被证明的罗宾斯猜想：在一台 486 机上跑了 13 天给出证明，再在 IBM RS/6000 工作站上跑 7 天验证（PDF 第 40–41 页）。<\/p>\n<p>为什么要记这个案例？它说明定理证明并非纸上谈兵：当搜索策略、索引和实现工程都到位时，机器可以解决人长期没拿下的问题。但它也暴露了归结路线的另一面——组合爆炸仍然需要启发式帮忙，纯逻辑的通用证明器在实际问题上效率有限。<\/p>\n<h2>完整推导 1：符号主义为什么会撞上组合爆炸<\/h2>\n<p>推理链分四步，每步给出书中依据：<\/p>\n<ol><li>\n前提：符号派把智能看成符号操作，定理证明被当作最纯粹的检验阵地（PDF 第 32 页）。\n<\/li><li>\n第一步工程尝试：“逻辑理论家”用启发式模拟人解题，能证明《数学原理》命题逻辑子集，但逻辑学家并不接受它作为证明方法（PDF 第 23、35 页）。\n<\/li><li>\n规则统一化之后：罗宾逊 1965 年归结原理把一阶逻辑证明归约为一条规则配合合一算法，规则数量减少了，但证明过程会持续生成新子句（PDF 第 38–39 页）。\n<\/li><li>\n结论落点：归结的简单性引起重视，可组合爆炸同样没有消失；纯逻辑通用证明器在实际问题上效率有限，必须借助支持集、索引等启发式策略控制搜索（PDF 第 40、42 页）。反例检验：EQP 证明罗宾斯猜想耗时 13 天加 7 天验证，成功依赖项索引与判别树索引等工程条件，不是归结规则单独完成（PDF 第 41 页）。\n<\/ol>\n<h2>完整推导 2：定理证明路线为什么从 AI 圈子分化到逻辑与工程共同体<\/h2>\n<ol><li>\n观察起点：早期证明程序分两路——戴维斯、王浩贴近逻辑判定过程，纽厄尔、司马贺贴近人类解题启发式（PDF 第 33–36 页）。\n<\/li><li>\n分化原因：逻辑学家追求可判定性与形式化标准，对启发式程序评价不高；王浩甚至称逻辑理论家“不专业”，该文也被《符号逻辑杂志》退稿（PDF 第 35 页）。\n<\/li><li>\n接力位置：罗宾逊在实现 DP 过程时发现归结，把证明规则统一化；阿贡小组则把证明器做成可实战的工程系统（PDF 第 38、40 页）。\n<\/li><li>\n推论：符号派的思想源头是定理证明，但定理证明共同体与 AI 工程圈子长期若即若离；这条分化后来影响了专家系统、逻辑程序各自的发展方向（PDF 第 32、42 页）。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[1955 洛杉矶学习机讨论会] --&gt; B[1956 达特茅斯会议]\nB --&gt; C[符号派: 纽厄尔/司马贺&lt;br/&gt;物理符号系统假说]\nB --&gt; D[神经网络派: 皮茨/麦卡洛克一线]\nC --&gt; E[逻辑理论家 1956]\nE --&gt; F[王浩机器证明 1958]\nF --&gt; G[罗宾逊归结原理 1965]\nG --&gt; H[阿贡小组 Otter/EQP 1996 罗宾斯猜想]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：符号派从心智功能出发，落到逻辑与证明；定理证明的技术接力棒从 AI 圈子交到逻辑学家和实战小组手里，两条线索在 1965 年归结原理处合流，又在 1970 年代后因组合爆炸分化。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：符号主义像一本用规范语言写成的操作手册——世界被拆成名词（客体）和动词（操作），智能就是照着手册翻页、改写、查表；它不关心手册写在纸上还是刻在神经元里。\n<\/li><li>\n实例对照：“逻辑理论家”模仿人证明定理的思路（启发式），王浩的程序更贴近逻辑学家的判定过程；前者对 AI 和心理学有意义，后者对理论计算机科学影响更深。\n<\/li><li>\n反例提醒：把“第一个可运行的定理证明程序”安给纽厄尔和司马贺并不准确，本书把这一荣誉归给戴维斯 1954 年的程序（PDF 第 33 页）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：达特茅斯会议上大家一致同意了 AI 的技术路线。<\/strong> 实际上会议本身没产生统一路线，纽厄尔和司马贺的报告反而抢了召集者的风头；符号与连接的分歧从会前就存在。\n<\/li><li>\n<strong>误解：“人工智能”一词确定是麦卡锡发明的。<\/strong> 本书记载这是悬案，麦卡锡晚年也承认记不清来源。\n<\/li><li>\n<strong>误解：归结原理是一条单独的逻辑规则集合。<\/strong> 它的威力来自“合一算法 + 归结规则 + 包含（subsumption）”的综合；罗宾逊的贡献不止归结一项（PDF 第 39 页）。\n<\/li><li>\n<strong>误解：定理证明从一开始就属于 AI 圈子。<\/strong> 逻辑学家和数学家长期与 AI 圈子若即若离，很多人宁可和计算机理论家混在一起（PDF 第 35 页）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n达特茅斯会议是哪一年召开的？（答案：1956 年；前戏是 1955 年洛杉矶学习机讨论会。）\n<\/li><li>\n物理符号系统假说是谁提出的、主张什么？（答案：纽厄尔与司马贺；智能是对符号的操作，最原始的符号对应物理客体。）\n<\/li><li>\n罗宾逊归结原理哪一年发表在哪个刊物？它配套的算法是什么？（答案：1965 年，JACM；配套合一算法。）\n<\/li><li>\n王浩 1958 年夏天在 IBM 704 上证明了多少条一阶逻辑定理？他的学生是谁、后来提出了什么理论？（答案：150 条中的 120 条；学生库克，提出 NP 完全性理论。）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>如果 1950 年代逻辑学家与 AI 圈子没有互相排斥，符号派是否会更早走向高效判定过程？书中证据支持两点：其一，王浩路线的机器证明在 1958–1959 年已在教科书定理上取得记录，证明“判定过程 + 工程实现”这条路当时可行（PDF 第 36 页）；其二，启发式程序与逻辑证明两套标准长期分离，逻辑理论家被逻辑界拒之门外（PDF 第 35 页）。反过来假设两方早期深度合作，更可能的结果是定理证明方法更早被 AI 工程吸收，而不是符号派整体避开组合爆炸；组合爆炸来自逻辑搜索的固有规模问题，不会因圈子合作而消失。另一条反事实：若 1956 年会上没有纽厄尔与司马贺的报告，达特茅斯会议留下的技术演示会更偏松散讨论；本书记载他们的报告在会上抢了召集者的风头，这一演示是符号派纲领第一次落地样本（PDF 第 23 页）。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章是四条学习单元的起点：符号主义纲领（c01）与定理证明（c02）构成后续专家系统、五代机的方法源头；计算理论底座（c09）与归纳学习观（c08）在第 4 单元再回收本章“符号可被机器处理”的预设。下一章进入符号工程的两个方向：窄领域专家系统，以及国家层面押注逻辑程序的第五代计算机。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n1956 达特茅斯会议：AI 公认起点；人物线 = 麦卡锡、明斯基、香农、纽厄尔、司马贺、塞弗里奇、所罗门诺夫。\n<\/li><li>\n符号主义纲领：物理符号系统假说——智能即符号操作。\n<\/li><li>\n定理证明接力：戴维斯 1954 → 王浩 1958/1959 → 罗宾逊 1965 归结 → 阿贡小组 1996 EQP 罗宾斯猜想。\n<\/li><li>\n遗留问题：归结的组合爆炸、通用证明器效率低，为后来符号派内部“过程表示 vs 陈述表示”的斗争埋下伏笔。\n<\/ul>", "kind": "chapter", "title": "第 1–2 章：起源与符号主义的黄金年代（达特茅斯会议、定理证明）"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.63<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1–2 章：起源与符号主义的黄金年代（达特茅斯会议、定理证明）<\/a><\/span><\/div><h1>第 3–5 章：专家系统、第五代机与神经网络的两次起落<\/h1>\n<blockquote>对应原书第 3 章《从专家系统到知识图谱》、第 4 章《第五代计算机的教训》、第 5 章《神经网络简史》（PDF 第 63–119 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 1–2 章的符号主义脉络\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清专家系统从 DENDRAL、MYCIN 到 XCON 的演进，以及“知识原则”和产生式规则在其中的位置；\n<\/li><li>\n解释日本第五代计算机计划为什么押注 Prolog 与逻辑程序，又为什么在 1990 年代初归于沉寂；\n<\/li><li>\n梳理神经网络从 1943 年麦卡洛克-皮茨模型、1957 年感知机、1969 年《感知机》批判，到 1980 年代反向传播与 2012 年深度学习突破的两次起落。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>符号路线把专家知识搬进规则库，押注“知识就是力量”；连接路线把智能交给神经元之间的连接强度，两次被打压、两次复活——两条路线的胜负取决于硬件、数据和算法是否同时到位。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 专家系统：把专家的脑子写成规则<\/h3>\n<p>1964 年，费根鲍姆（Edward Feigenbaum）响应麦卡锡召唤，从加州大学伯克利分校到斯坦福。他与遗传学家、1958 年诺贝尔生理学或医学奖得主莱德伯格（Joshua Lederberg，1925—2008）合作，团队成员还有布坎南（Bruce Buchanan）。合作成果是<strong>第一个专家系统 DENDRAL<\/strong>：输入质谱仪数据，输出给定物质的化学结构；团队把化学家的分析知识提炼成规则，系统有时做得比莱德伯格的学生还好（PDF 第 64–65 页）。<\/p>\n<p>为什么专家系统在 1960–70 年代出现？因为定理证明那条通用路线走不动：通用证明器效率低，而真实世界的专业判断往往狭窄、明确、依赖经验规则。把专家在小领域里的判断写成“如果条件，那么结论”的产生式规则，是当时最可行的工程路径。<\/p>\n<p>第二个代表系统是 <strong>MYCIN<\/strong>：牵头人肖特莱福（Edward Shortliffe）1976 年在斯坦福拿计算机博士，论文主题就是细菌感染诊断系统。本书记载 MYCIN 处方准确率 69%，当时专科医生 80%，但已优于非本专业医生；肖特莱福因此获 1976 年 ACM 青年科学家霍珀奖。MYCIN 从未真正临床使用，但它的原理后来提炼成通用骨架 EMYCIN。纽厄尔甚至认为 MYCIN 才是真正的第一个专家系统，因为它首创了后来成为专家系统要素的产生式规则与不精确推理（PDF 第 66 页）。<\/p>\n<h3>2. 概念 3：专家系统与知识表示（难度：基础）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。成熟期最成功的案例是 DEC 的零部件配置系统 <strong>XCON<\/strong>：1980 年投入使用到 1986 年，按需求自动配置零部件；专家系统在 1980 年代初到 1990 年代初经历了约十年黄金期（PDF 第 67 页）。<\/p>\n<p>知识表示这条线还长出了常识库：雷纳特（Douglas Lenat，1950—2023）的 <strong>Cyc<\/strong> 用逻辑表达人类常识，被视为知识图谱的雏形。他 1984 年预言 1999 年每台计算机都得预装 Cyc，1986 年又估计常识规则至少要 2500 万条；Cyc 在 1990 年代初就被批评没有成功案例（PDF 第 72 页）。2010 年谷歌收购 Metaweb，命名为<strong>知识图谱（Knowledge Graph）<\/strong>；语义网推动者伯纳斯-李 2016 年获图灵奖（PDF 第 74–75 页）。<\/p>\n<h3>3. 第五代计算机：一次国家级押注<\/h3>\n<p>1978 年日本通商产业省组织研究下一代计算机系统，由元冈达（Tohru Moto-Oka，1929—1985）牵头；1981 年委员会提交 89 页报告《知识信息处理系统的挑战：第五代计算机系统初步报告》，提出六种先进体系结构。1981 年第一届五代机会议在日本信息处理开发中心（JIPDEC）召开，费根鲍姆和德国定理证明学者白贝尔（Wolfgang Bibel）作为外籍嘉宾出席（PDF 第 79–80 页）。<\/p>\n<p>五代机研究所（ICOT）所长是渕一博（Kazuhiro Fuchi，1936—2006）。技术上选定 <strong>Prolog<\/strong> 而不是更成熟的美国语言 LISP：沃伦（David Warren）1982 年在 AI Magazine 撰文分析，Prolog 在五代机各类应用中覆盖面最广，且在小规模基准测试中作为数据库查询语言不输关系代数；另一个现实因素是 LISP 是美国制造的，Prolog 相对全新（PDF 第 80、83–84 页）。<\/p>\n<p>为什么五代机会选逻辑程序？因为它继承了定理证明的陈述性表达：把问题陈述出来，推理机负责求解，这正是符号主义的工程延伸。十年计划预算 4.5 亿美元；作为回应，美国 1982 年成立 MCC（每年投资 7500 万美元），英国 1982 年夏启动阿尔维计划、1987 年放弃，欧洲 1983 年启动合作计划（PDF 第 84、88–89 页）。<\/p>\n<p>衰落的迹象在 1988 年已经露出：会议录从 1981 年的 280 多页膨胀到 1988 年三大卷 1300 页，内容失去聚焦。五代机没能证明它能干传统机器干不了的活，典型应用中也没快多少；项目 1994 年结束，渕一博转往东京大学任教，两年后退休（PDF 第 90–91 页）。本书的判断是：路线出错的核心原因是缺乏理论指导；五代机并非彻底失败，它留下了逻辑程序、并发 Prolog 等非物质遗产，只是被互联网的全社会浪潮盖过了光芒。<\/p>\n<h3>4. 概念 4：连接主义与感知机（难度：基础）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。神经网络的开山文章发表于 <strong>1943 年<\/strong>，作者麦卡洛克（Warren McCulloch，1898—1969）与皮茨（Walter Pitts，1923—1969）。1949 年神经心理学家赫布（Donald Hebb）出版《行为的组织》，提出后人称为赫布学习的规则（PDF 第 93–95 页）。<\/p>\n<p>1957 年，康奈尔大学实验心理学家罗森布拉特（Frank Rosenblatt，1928—1971）提出<strong>感知机（perceptron）<\/strong>模型，可完成简单模式识别；他在理论上证明单层网络在线性可分问题上可以收敛，并于 1962 年写成《神经动力学原理：感知机和大脑机制的理论》（PDF 第 96 页）。<\/p>\n<p>打压来自明斯基一方。他与 MIT 教授佩珀特（Seymour Papert）合作写出《感知机：计算几何学》（1969），证明单层神经网络不能解决 <strong>XOR（异或）<\/strong>问题。这一批判以充满敌意的方式呈现，对罗森布拉特是致命打击；感知机失败导致神经网络研究式微，经历了近二十年低谷（PDF 第 97–98 页）。1988 年该书再版时，明斯基删去第一版攻击罗森布拉特的句子，并手写“纪念罗森布拉特”；IEEE 2004 年设立罗森布拉特奖（PDF 第 98 页）。<\/p>\n<h3>5. 概念 5：反向传播与深度学习复兴（难度：进阶）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。1982 年物理学家霍普菲尔德（John Hopfield，1933—）提出霍普菲尔德网络，把网络看作带能量函数的系统，为低潮期的神经网络提供了物理学基础。1983–1986 年，辛顿（Geoffrey Hinton，1947—）与谢诺夫斯基（Terry Sejnowski）在原始霍普菲尔德网络中引入隐藏单元和概率分布，提出<strong>玻尔兹曼机<\/strong>（PDF 第 101–102 页）。<\/p>\n<p>多层网络的训练钥匙是<strong>反向传播<\/strong>：Werbos 1974 年已有相关文章，但当时没在神经网络圈子引起反响；1986 年鲁梅尔哈特（David Rumelhart）、辛顿和威廉姆斯（Ronald J. Williams）在《自然》杂志发表反向传播的压缩版本，把误差逐层回传、用梯度下降调整权重——作者并未引用 Werbos 1974 年的博士论文（PDF 第 111、118 页）。<\/p>\n<p>复兴的实测拐点在 2012 年：辛顿团队 SuperVision 在 ImageNet 大规模视觉识别挑战赛（ILSVRC）上以压倒性优势夺冠，网络因学生克里泽夫斯基（Alex Krizhevsky）得名 AlexNet，另一位学生是伊利亚·苏茨克维（Ilya Sutskever）。2018 年图灵奖颁给辛顿、本吉奥（Yoshua Bengio）和杨立昆（Yann LeCun）；2024 年霍普菲尔德与辛顿获诺贝尔物理学奖（PDF 第 113–115、105 页）。<\/p>\n<h2>完整推导 1：第五代计算机为什么在 1990 年代初归于沉寂<\/h2>\n<p>推理链按前提—条件—证据展开：<\/p>\n<ol><li>\n前提：五代机押注陈述性知识加自动推理，技术路线选 Prolog 而非 LISP，十年计划预算 4.5 亿美元（PDF 第 80、84 页）。\n<\/li><li>\n条件一，理论支撑不足：本书判断五代机技术路线出错的核心原因是缺乏理论指导；它要证明自己能干传统机器干不了的活，但典型应用中速度优势不明显（PDF 第 90 页）。\n<\/li><li>\n条件二，目标失焦：衰落迹象 1988 年已经露出，会议录从 1981 年 280 多页膨胀到 1988 年三大卷 1300 页，内容失去聚焦（PDF 第 90 页）。\n<\/li><li>\n条件三，外部浪潮覆盖：项目 1994 年结束，渕一博转往东京大学，两年后退休；逻辑程序、并行 Prolog 等遗产被后续技术吸收，但工程光芒被全社会的互联网浪潮盖过（PDF 第 91 页）。\n<p>反例检验：作为回应，美国 1982 年成立 MCC（每年 7500 万美元），英国 1982 年夏启动阿尔维计划、1987 年放弃，欧洲 1983 年启动合作计划；各国反应说明五代机不是孤立失败，符号工程整体在 1980 年代末失去前期势能（PDF 第 88–90 页）。<\/p>\n<\/ol>\n<h2>完整推导 2：神经网络为什么先经历近二十年寒冬，算法成形后又等到 2012 年才拐点<\/h2>\n<ol><li>\n第一层条件：1957 年感知机只在样本线性可分时收敛，单层结构表示能力有限（PDF 第 96 页）。\n<\/li><li>\n打压环节：1969 年《感知机：计算几何学》证明单层网络不能解决 XOR，批判以敌意方式呈现，连接主义进入近二十年低谷（PDF 第 97–98 页）。\n<\/li><li>\n算法环节：1982 年霍普菲尔德网络提供物理学基础，1983–1986 年玻尔兹曼机引入概率隐藏单元，1986 年反向传播加梯度下降解决多层权重调整问题（PDF 第 101–102、118 页）。\n<\/li><li>\n落地环节：算法不等于拐点——语音识别到 2009 年起合作、2011 年才突破；视觉任务等到 2012 年 AlexNet 在 ILSVRC 夺冠，数据规模、GPU 算力与网络结构同时到位后才形成实测突破（PDF 第 113 页）。\n<p>推论：连接主义两次起落的分界不在单个算法，而在结构、算法、数据、算力四件事是否凑齐。<\/p>\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[符号工程线] --&gt; B[DENDRAL 1960s]\nB --&gt; C[MYCIN 1976]\nC --&gt; D[XCON 1980-1986]\nD --&gt; E[Cyc 常识库 / 知识图谱]\nF[国家级押注] --&gt; G[日本五代机 1981-1994&lt;br/&gt;Prolog 逻辑程序]\nH[连接主义线] --&gt; I[麦卡洛克-皮茨 1943]\nI --&gt; J[感知机 1957]\nJ --&gt; K[《感知机》1969 批判&lt;br/&gt;近二十年寒冬]\nK --&gt; L[霍普菲尔德网络 1982 / 玻尔兹曼机]\nL --&gt; M[反向传播 1986]\nM --&gt; N[AlexNet 2012 / 深度学习]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面一条是“人把知识写成规则”的符号工程，下面一条是“数据调整连接”的连接工程；五代机是符号工程在国家层面的最后一次重注，而连接线在算法、算力、数据三者凑齐后才完成第二次起飞。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：专家系统像一位把办案口诀逐条写进笔记本的老刑警；遇到笔记本上没写过的新情况，它就无能为力。感知机像一块可调的窗帘布，能拉开两类直线可分的样本，但 XOR 这种弯扭分界它拉不平。\n<\/li><li>\n实例：MYCIN 的 69% vs 专科医生 80%，说明专家系统在窄领域能接近非专业水平，但离顶尖专家仍有距离；AlexNet 之前，语音识别 2009 年起由微软邓力小组与辛顿合作，用深度学习加隐马尔可夫模型在 2011 年取得突破（PDF 第 113 页）。\n<\/li><li>\n对照：五代机选 Prolog 是选“陈述性知识 + 自动推理”；深度学习选反向传播是选“数据 + 梯度调整连接”，二者对“智能从哪来”的回答完全不同。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：专家系统就是早期的大模型。<\/strong> 专家系统靠人工提炼规则，不具备从数据中归纳参数的能力；两者的知识获取方式正好相反。\n<\/li><li>\n<strong>误解：明斯基一直反对神经网络。<\/strong> 本书记载他的博士论文就是关于神经网络的，早期也是“吃啥补啥”派，后来才转向并与罗森布拉特决裂（PDF 第 97 页）。\n<\/li><li>\n<strong>误解：反向传播是 1986 年凭空发明的。<\/strong> Werbos 1974 年已有文章，1986 年论文是把反向传播加梯度下降放到多层神经网络上并获得广泛影响（PDF 第 111、118 页）。\n<\/li><li>\n<strong>误解：五代机死于技术指标不够快。<\/strong> 本书认为更核心的原因是缺乏理论指导、目标失焦；它在技术圈留下了逻辑程序与并行推理的遗产。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nDENDRAL 和 MYCIN 分别解决什么领域的问题？（答案：DENDRAL 由质谱数据推化学结构；MYCIN 做细菌感染诊断与处方。）\n<\/li><li>\n五代机为什么选 Prolog 而不是 LISP？（答案：Prolog 应用覆盖面广、小规模基准不输关系代数，且不是美国制造；背后是逻辑程序与陈述性表达的路线。）\n<\/li><li>\n单层感知机不能解决哪个逻辑问题？出自哪本书？（答案：XOR 异或；明斯基与佩珀特 1969 年《感知机：计算几何学》。）\n<\/li><li>\n1986 年反向传播《自然》论文的三位作者是谁？2012 年 ImageNet 夺冠团队的核心学生有哪两位？（答案：Rumelhart、Hinton、Williams；克里泽夫斯基与苏茨克维。）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>假设 1969 年《感知机》没有把单层局限表述成敌意批判，连接主义是否会提前回暖？书中证据给出两面：其一，XOR 的单层不可解是理论事实，即使表述温和，单层模型的能力边界仍在；其二，再版记录显示明斯基后来删去攻击句并手写纪念罗森布拉特，IEEE 2004 年设罗森布拉特奖，说明打压的舆论形态与理论结论是两件事（PDF 第 98 页）。较稳妥的反事实判断：温和表述会缩短资金与人心的冷却期，但多层训练方法未解决之前，回暖仍要等到反向传播与算力数据条件出现。<\/p>\n<p>另一条假设：如果五代机押注 LISP 而非 Prolog，结局是否不同？书中记载选 Prolog 的现实因素包括应用覆盖面与“LISP 是美国制造”（PDF 第 80、84 页）。但本书把失败主因归于缺乏理论指导与目标失焦，路线语言选择不是决定性变量；换成 LISP，符号工程面对的通用化与效率问题依然存在。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章承接第 1 章符号主义纲领：专家系统（c03）是窄领域规则工程，五代机是符号工程的国家计划；连接主义部分（c04、c05）为第 3 章的进化与强化路线、第 4 章的学习观埋下结构与算法基础。下一章离开符号与连接两条主线，进入向自然学习的路线、机器下棋和自然语言处理的范式切换。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n专家系统三站：DENDRAL（化学结构）→ MYCIN（诊断规则与不精确推理）→ XCON（配置工程）；长线落到 Cyc 与知识图谱。\n<\/li><li>\n五代机：1981 启动、1994 结束，Prolog/逻辑程序，预算 4.5 亿美元；教训是国家级工程需要理论指导，不能只靠野心与硬件。\n<\/li><li>\n神经网络两次起落：1943 模型 → 1957 感知机 → 1969 寒冬 → 1982 霍普菲尔德/1986 反向传播 → 2012 AlexNet 拐点。\n<\/li><li>\n人物对应：符号工程 = 费根鲍姆、布坎南、肖特莱福、雷纳特；连接线 = 麦卡洛克、皮茨、罗森布拉特、霍普菲尔德、辛顿、鲁梅尔哈特。\n<\/ul>", "kind": "chapter", "title": "第 3–5 章：专家系统、第五代机与神经网络的两次起落"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.120<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 3–5 章：专家系统、第五代机与神经网络的两次起落<\/a><\/span><\/div><h1>第 6–8 章：向自然学习、机器下棋与自然语言处理<\/h1>\n<blockquote>对应原书第 6 章《向自然学习：从遗传算法到强化学习》、第 7 章《计算机下棋简史：机定胜人，人定胜天》、第 8 章《自然语言处理》（PDF 第 120–176 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 3–5 章的两派起落\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分遗传算法（向进化学习）与强化学习（向奖励学习）两条“向自然学习”的路线，说出强化学习的要素、理论基础与代表人物；\n<\/li><li>\n梳理计算机下棋从图灵、香农的理论到塞缪尔跳棋、深蓝胜卡斯帕罗夫、AlphaGo 与 AlphaZero 的突破链；\n<\/li><li>\n讲清自然语言处理的四次范式切换：规则语言学 → 统计方法 → 深度学习 → 大语言模型准备期，以及词嵌入、Transformer、BERT/GPT 的位置。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>除了符号与连接，AI 还有第三条路：<strong>向生物的进化、试错与奖励学习<\/strong>；而下棋和语言这两块“最像智能”的试金石，分别检验了这条路线与统计/深度学习路线的成色。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 遗传算法：把进化论写进搜索<\/h3>\n<p>霍兰德（John Holland，1929—2015）本科在 MIT 学物理，博士阶段进入密歇根大学伯克斯（Arthur Burks）创立的跨学科通信科学计划，被视为计算机科学史上第一个博士。他受英国统计学家费舍《自然选择的遗传理论》启发——这本书把孟德尔遗传理论与达尔文自然选择结合起来——想到用种群、选择、交叉、变异来做搜索（PDF 第 120–123 页）。<\/p>\n<p><strong>遗传算法<\/strong>模拟种群进化：种群是数据，每一代按适应度挑选个体，交叉重组、随机变异，逐代逼近更好的解。1985 年第一届遗传算法国际会议召开，学科有了自己的共同体；1997 年 IEEE 开办《进化计算汇刊》。霍兰德的学生寇扎（John Koza）1987 年进一步提出<strong>遗传编程<\/strong>：让种群里的个体不是参数而是程序，进化的对象直接是代码（PDF 第 124–125 页）。<\/p>\n<p>为什么这条线在神经网络低谷期没被完全波及？因为它不依赖神经元模型，本质是受生物学启发的近似优化；后来深度学习成为普适学习实现机制后，遗传算法与强化学习才都被放进更统一的学习框架里讨论。<\/p>\n<h3>2. 强化学习：Agent 在奖励中学会策略<\/h3>\n<p>巴托（Andrew Barto，1948—）1975 年到马萨诸塞大学任教，他的第一个博士生是萨顿（Richard Sutton，1957—）。萨顿本科学心理学，研究动物如何适应环境；两人形成了关于学习的第一性原理——<strong>强化学习<\/strong>。理论基础之一是马尔可夫决策过程（MDP），另一块是动态规划：贝尔曼（Richard Bellman）在 1950 年代就发明了动态规划，巴托和萨顿承认早期受到它的启发（PDF 第 128–130 页）。<\/p>\n<p>强化学习的主体是 Agent：Agent 施加动作给环境，环境返回状态与奖励/惩罚；Agent 根据经验改变策略，以期达到长期最大奖励。巴托与萨顿把目标制导称为<strong>奖励假设<\/strong>（Reward is enough）：以长期奖励最大化为目标的学习，足以解释智能行为。本书记载，巴托与萨顿因强化学习获图灵奖（PDF 第 131 页；前言另记为 2025 年获奖，两处年份表述不一致，以原书第 6 章正文为准）。<\/p>\n<p>这条线的思想源头比 AI 学科还早：图灵 1948 年内部报告《智能机器》定义了可学习的 P 型机，只接受“快乐”和“痛苦”刺激，实际就是奖励与惩罚；明斯基 1954 年的博士论文也是关于强化学习的（PDF 第 131 页）。工程上，<strong>Q-Learning<\/strong> 由沃科金斯（Chris Watkins）1989 年在剑桥大学博士论文中提出（PDF 第 138 页）。<\/p>\n<h3>3. 概念 6：强化学习（难度：进阶）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。两个必须理解的基本张力：<\/p>\n<ul><li>\n<strong>探索 vs 利用<\/strong>：“抬头看路”是尝试未知动作获取新信息，“低头拉车”是选取当前已知最优动作；用希腊字母 <span class=\"katex-inline\">\\varepsilon<\/span> 表示学习率，平衡二者是强化学习的经典问题（PDF 第 132 页）。\n<\/li><li>\n<strong>延迟奖励<\/strong>：效果要等到多步以后才显现，这和监督学习立刻得到对错反馈不同；当状态空间很大时，神经网络被用作函数逼近器，于是长出深度强化学习。\n<\/ul>\n<p>2016 年 AlphaGo 击败李世石后，强化学习作为核心算法一夜之间成为显学。DeepMind 团队里有萨顿的四个学生，首席科学家席尔瓦（David Silver）是萨顿大弟子；2017 年 7 月 7 日 DeepMind 在萨顿所在的加拿大阿尔伯塔大学开办联合实验室，是其在英国以外的第一个研究机构（PDF 第 132–133 页）。萨顿 2019 年的两页短文《The Bitter Lesson》是他几十年研究的哲学总结：以通用算法（如强化学习）为基础、辅以不断增长的算力，智能自然会提升；当下工程师嘴边的 Scaling Law（缩放定律）正源于这一思路（PDF 第 133 页）。<\/p>\n<h3>4. 机器下棋：从纸上模拟到 AlphaZero<\/h3>\n<p>下棋一直是人类智能的标志之一。图灵 1947 年编写了第一款下棋程序，但当时机时宝贵轮不到上机；他的同事普林茨（Dietrich Prinz）1951 年延续这一思路。1951 年斯特雷奇（Christopher Strachey）在曼彻斯特 Mark 1 上写出第一款跳棋程序，图灵 1952 年曾与之对弈并轻松取胜。1956 年 IBM 的塞缪尔（Arthur Samuel）写出第二款跳棋程序，特点是自学习，被视为最早的机器学习程序之一（PDF 第 141 页）。<\/p>\n<p>理论框架上，冯诺伊曼与经济学家摩根斯顿（Oskar Morgenstern）合作的博弈论著作首次提出二人对弈的 <strong>Minimax 算法<\/strong>；这套博弈推演框架要求机器在对手最坏回应下选取最优着法。香农 1950 年在《哲学杂志》发表《计算机下棋程序》，开启计算机下棋的理论研究，其主要思路在后来的深蓝和 AlphaGo 中还能看到（PDF 第 142 页）。第一款可以走完全局的下棋程序是伯恩斯坦（Alex Bernstein）1958 年在 IBM 704 上开发的，每走一步要花 8 分钟（PDF 第 143 页）。<\/p>\n<p>象棋的里程碑是 <strong>深蓝<\/strong>：1996 年深蓝与卡斯帕罗夫（Garry Kasparov）首次对弈六局；1997 年再战，卡斯帕罗夫先赢一局后趋于保守，最终认输，深蓝成为第一位战胜当时世界冠军的机器（PDF 第 146 页）。围棋方面，AlphaGo 是强化学习最早的工业级应用；早期版本借助人类棋谱，随后的 AlphaGo Zero 完全摆脱人类棋谱，“Zero”的一层含义就是零人类知识；再往后的 AlphaZero 在对弈类游戏中通用化（PDF 第 147 页）。<\/p>\n<h3>5. 自然语言处理：四次范式切换<\/h3>\n<p>1953–1954 年，IBM 资助乔治敦大学做了有史以来第一次机器翻译实验。1964 年美国政府资助机构责成评估，结论是机器翻译比人工慢、更不准、成本更高（估计贵两倍），可预见未来无法实用，应停止资助（PDF 第 149–150 页）。<\/p>\n<p>第一阶段是<strong>专家语言学知识<\/strong>，代表人物乔姆斯基（Noam Chomsky，1928—）。他的句法分层与自动机有深刻对应：3 型文法等价有限自动机，1 型文法等价线性有界非确定图灵机，0 型文法等价图灵机。乔姆斯基认为语言结构是内在的，不是通过经验习得的；他不认可语言学的统计方法，视统计为行为主义（PDF 第 150–154 页）。<\/p>\n<p>第二阶段是<strong>统计方法<\/strong>。1988 年 IBM Thomas J. Watson 研究中心机器翻译小组发表统计机器翻译论文，推出法语-英语系统 <strong>CANDIDE<\/strong>，标志统计派在大数据支持下回潮。贾里尼克（Fred Jelinek）一派的学术训练是信息论，统计是他们最自然的工具；小组成员寇克（John Cocke）1987 年因 RISC 架构获图灵奖（PDF 第 167 页）。统计方法的工程好处是：工程师不需要具备语言学知识，也不必懂源语言或目标语言。<\/p>\n<p>第三阶段是<strong>深度学习<\/strong>，第四阶段是大语言模型准备期。辛顿 1980 年代后期的词分布式表示工作引入词向量概念；2013 年谷歌在 <strong>word2vec<\/strong> 中率先工程实现词嵌入；2016 年谷歌发布神经机器翻译系统 GNMT，取代上一代统计翻译，误差降低约 60%（PDF 第 169 页）。2017 年谷歌团队提出 <strong>Transformer<\/strong>，基于注意力机制解除训练并行性限制；此后谷歌走双向编码器 <strong>BERT<\/strong>（Encoder-only）路线，OpenAI 走单向 <strong>GPT<\/strong>（Decoder-only）路线，GPT 更通俗的解释就是 NTP（next token prediction）。2020 年 GPT-3 问世后 NTP 方法反超；2022 年 11 月 30 日 ChatGPT 横空出世，进步速度以月计（PDF 第 170–171 页）。<\/p>\n<h3>6. 概念 7：统计 NLP、词嵌入与 Transformer（难度：进阶）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。本书把 NLP 范式概括为：规则约 40 年 → 统计与浅层学习约 20 年 → 深度学习不到 10 年 → 大模型准备期约 5 年；每个阶段时长逐渐缩短（PDF 第 7、171 页）。<\/p>\n<h2>完整推导 1：强化学习为什么在 2016 年之后成为显学<\/h2>\n<ol><li>\n理论前提：MDP 提供状态—动作—转移—回报模型，动态规划提供多步递推；巴托与萨顿把长期回报最大化为学习目标，形成奖励假设（PDF 第 128–131 页）。\n<\/li><li>\n算法积累：Q-Learning 由沃科金斯 1989 年剑桥博士论文提出，探索与利用的权衡有了可操作框架（PDF 第 132、138 页）。\n<\/li><li>\n工程触发点：2016 年 AlphaGo 击败李世石，强化学习作为核心算法一夜成名；对弈推演从人类棋谱与自我对弈中同时获得策略更新；DeepMind 团队有萨顿四名学生，首席科学家席尔瓦是萨顿大弟子，2017 年 7 月在阿尔伯塔大学设联合实验室（PDF 第 132–133 页）。\n<\/li><li>\n路线沉淀：萨顿 2019 年《The Bitter Lesson》主张通用算法加增长算力自然提升智能，Scaling Law 思路由此承接（PDF 第 133 页）。\n<p>推论：理论积累数十年，成为显学仍要等到封闭规则任务、深度表示能力与工程环境同时成熟；反例检验是强化学习并未局限于游戏，后续进入芯片布局、蛋白质折叠等固定规则场景（PDF 第 134–135 页）。<\/p>\n<\/ol>\n<h2>完整推导 2：自然语言处理为什么沿规则→统计→深度学习→大模型准备期切换<\/h2>\n<ol><li>\n规则阶段条件：乔姆斯基句法理论给出文法层次，文法与自动机等价；早期机器翻译 1953–1954 年起步，1964 年评估判定短期不可实用（PDF 第 149–154 页）。规则追求解释语言结构，代价是规则追不上真实语料变体。\n<\/li><li>\n统计阶段条件：信息论训练背景的贾里尼克一派用平行语料估计搭配概率，1988 年 CANDIDE 法英系统标志统计派回潮；工程师不必懂源语言与目标语言（PDF 第 167 页）。\n<\/li><li>\n表示与架构条件：词分布式表示先引入词向量，2013 年 word2vec 工程实现词嵌入，2016 年 GNMT 把统计翻译误差降低约 60%；2017 年 Transformer 用注意力机制解除训练并行限制，BERT 与 GPT 分出双向掩码与单向续写两条路线（PDF 第 169–170 页）。\n<\/li><li>\n结论落点：每一步切换都把更多判断交给数据与算法；阶段时长从约 40 年、20 年、不到 10 年缩到约 5 年，后一阶段站在前一阶段结果上推进（PDF 第 7、171 页）。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[向自然学习] --&gt; B[遗传算法 霍兰德 1975 著作]\nA --&gt; C[强化学习 巴托/萨顿]\nC --&gt; D[MDP + 动态规划]\nC --&gt; E[Q-Learning 1989 Watkins]\nC --&gt; F[AlphaGo 2016 / AlphaZero]\nG[机器下棋] --&gt; H[香农 1950 Minimax 思路]\nH --&gt; I[塞缪尔跳棋 1956]\nI --&gt; J[深蓝 1997 胜卡斯帕罗夫]\nJ --&gt; F\nK[NLP 范式] --&gt; L[规则/乔姆斯基]\nK --&gt; M[统计 CANDIDE 1988]\nK --&gt; N[深度学习 word2vec 2013 / GNMT 2016]\nN --&gt; O[Transformer 2017 → BERT / GPT]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：强化学习与下棋在 AlphaGo 处合流；NLP 的范式切换则沿着“人写规则 → 数据出统计 → 数据出表示 → 架构出通用模型”的方向移动，每一步都把更多判断交给数据和算法。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：强化学习像训狗——不给逐条指令，只在动作对了给奖励、错了给惩罚，狗自己摸索出策略；遗传算法像同时养一大群方案，淘汰差的、让好的杂交变异。\n<\/li><li>\n实例：塞缪尔跳棋是最早的自学习程序之一；深蓝团队多非 AI 出身，更像“锤子派”的硬件与搜索胜利；AlphaGo Zero 不看人类棋谱，靠自我对弈生成数据，这是强化学习不依赖人类示范的典型例子。\n<\/li><li>\n对照：乔姆斯基要的是“解释”（语言为什么有此结构），统计派给的是“描述”（语料里什么搭配最常见）；本书引科学方法的区分：统计方法可看作一种描述，但不是解释（PDF 第 154 页）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：强化学习就是打游戏。<\/strong> 游戏只是早期环境容易定义的试验场；MDP、动态规划与奖励假设是理论骨架，芯片布局、蛋白质折叠等固定规则场景后来都用了强化学习（PDF 第 134–135 页）。\n<\/li><li>\n<strong>误解：深蓝赢棋靠的是人工智能的新理论。<\/strong> 本书记载深蓝团队并非 AI 出身，胜利更多来自专用硬件、搜索工程与评估函数；团队甚至不认为机器表现出了智能（PDF 第 146 页）。\n<\/li><li>\n<strong>误解：BERT 和 GPT 的差别只是训练语料。<\/strong> 核心差别在预测方式：BERT 双向掩码猜被遮住的词，GPT 单向做 next token prediction；Transformer 只是共同的底层架构（PDF 第 170、215 页）。\n<\/li><li>\n<strong>误解：统计派不需要语言学。<\/strong> 工程上确实可以不懂源语言和目标语言做翻译模型，但这并不意味着语言学问题消失了，只是被推后到模型内部表示里。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n强化学习的理论基础是哪两块？奖励假设是谁提出的？（答案：马尔可夫决策过程 + 动态规划；巴托与萨顿。）\n<\/li><li>\n第一款可以走完全局的下棋程序是哪年、谁在哪台机器上写的？（答案：1958 年伯恩斯坦，IBM 704。）\n<\/li><li>\nNLP 四个阶段各自的代表方法和时间尺度是什么？（答案：规则语言学约 40 年；统计与浅层学习约 20 年；深度学习不到 10 年；大模型准备期约 5 年。）\n<\/li><li>\nword2vec 与 Transformer 分别是哪一年、由谁推出的？（答案：2013 年谷歌 word2vec；2017 年谷歌团队 Transformer。）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>假设 1950 年代算力已经足够，司马贺 1957 年“十年内计算机下棋击败人类”的预言是否会按时兑现？书中记录：预言在 1957 年做出，机器到 1997 年才由深蓝战胜卡斯帕罗夫，延迟约四十年（PDF 第 27、41、146 页）。反事实判断要分两层：搜索与评估思路在香农 1950 年论文中已成形，瓶颈在硬件速度、搜索工程与评估函数，而非理论空白；若算力提前到位，棋类程序会更早逼近人类水平，但 AlphaGo 依赖的深度表示与自我对弈数据仍需后续条件。<\/p>\n<p>另一条假设：如果早期统计翻译拥有今天规模的平行语料，规则路线是否还能维持四十年？书中证据是统计方法在 1988 年 CANDIDE 上已显示工程优势，规则派的存续更多依赖语料规模不足与语言学解释诉求（PDF 第 167、183 页）。语料提前只会加速统计替代规则，不会改变描述与解释之争的性质。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章把行为路线（c06）与语言工程（c07）接到前两章的符号、连接主线上：强化学习后来被所罗门诺夫归纳框架解释为在线学习；Transformer 与 GPT 的预测机制在第 4 章回收为 next token prediction 的理论前身。下一章回到语言与思维之争，进入计算理论基础和大语言模型的学习观。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n进化线：霍兰德遗传算法 → 寇扎遗传编程；奖励线：巴托/萨顿强化学习，MDP + 动态规划，Q-Learning 1989，AlphaGo 2016。\n<\/li><li>\n下棋史：图灵 1947 程序 → 香农 1950 理论 → 塞缪尔 1956 跳棋 → 深蓝 1997 → AlphaGo/Zero/AlphaZero。\n<\/li><li>\nNLP 四范式：规则（乔姆斯基）→ 统计（CANDIDE 1988）→ 深度学习（word2vec 2013、GNMT 2016）→ Transformer 2017 与 BERT/GPT 分野。\n<\/li><li>\n人物对照：进化/奖励 = 霍兰德、巴托、萨顿、沃特金斯；下棋 = 香农、塞缪尔、许峰雄、席尔瓦；语言 = 乔姆斯基、贾里尼克、寇克、诺维格。\n<\/ul>", "kind": "chapter", "title": "第 6–8 章：向自然学习、机器下棋与自然语言处理"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.177<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 6–8 章：向自然学习、机器下棋与自然语言处理<\/a><\/span><\/div><h1>第 9–11 章：语言、计算理论与大语言模型<\/h1>\n<blockquote>对应原书第 9 章《语言等于思维吗？》、第 10 章《人是机器吗？——人工智能的计算理论基础》、第 11 章《什么是学习？——大语言模型的理论与实践》（PDF 第 177–219 页）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 6–8 章的 NLP 与强化学习脉络\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n复述乔姆斯基“思维即语言”的立场及其与经验主义、连接主义的分歧，说明语言之争为什么回到计算理论；\n<\/li><li>\n讲清图灵机、丘奇-图灵论题、相似性原则、通用图灵机的位置，以及可计算性与计算复杂性两个层面的区别；\n<\/li><li>\n解释所罗门诺夫归纳、柯尔莫哥洛夫-所罗门诺夫-蔡汀（SKC）复杂性为什么是大语言模型的理论前身，并把“学习即压缩”“next token prediction”“BERT/GPT 分野”串成一条线。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>大语言模型把“语言等于思维吗”这个老哲学问题逼成了计算问题：<strong>如果承认丘奇-图灵论题，语言官能就是某种自动机，而学习在算法信息论看来就是找最短程序、做压缩<\/strong>；工程上的 next token prediction 是这一思想的近似落地。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 语言等于思维吗：一场被 ChatGPT 重新点燃的争论<\/h3>\n<p>ChatGPT 于 2022 年 11 月 30 日问世。2023 年 3 月 8 日，近 95 岁的乔姆斯基在《纽约时报》发表特邀文章《ChatGPT 的虚假承诺》，对大语言模型不买账。本书记载了一个反转：乔姆斯基最出名的“John 不可理喻”式例句被网民丢给 ChatGPT，模型准确理解了深层含义，乔姆斯基被“打了脸”（PDF 第 177 页）。<\/p>\n<p>乔姆斯基一生的两条主线被本书概括为“柏拉图之问”和“奥威尔之问”：做学问贴近柏拉图（理性主义、内在结构），从事政治活动遵循奥威尔（怀疑权威、同情人民）。他的核心思想是<strong>思维由语言生成<\/strong>（“思维即语言”）：语言结构是内在的，不是经验习得的；交流功能只是思想功能的外化，思想在先、交流在后（PDF 第 177–179 页）。<\/p>\n<p>为什么这个语言学问题绕不开计算机科学？因为乔姆斯基文法层次与自动机等价：3 型文法等价有限自动机，0 型文法等价图灵机。本书点出一个推论：<strong>如果承认语言等于思维，实际上就承认了图灵机可以思维<\/strong>；反过来，连接主义者辛顿批评乔姆斯基的理性主义，认为语言不需要先天结构，靠后天数据驱动的学习就可习得，而乔姆斯基批评神经网络端到端方法导致语言学结果无法被解释（PDF 第 179、183 页）。<\/p>\n<p>这里要分清两层：乔姆斯基与统计/连接派争的是“语言能力从哪来”（先天结构还是后天数据）；而计算理论追问的是“任何智能活动能被什么装置实现”。前者是科学立场之争，后者是可计算性边界之争。<\/p>\n<h3>2. 概念 9：图灵机与丘奇-图灵论题（难度：基础）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。计算机科学起源于图灵 1936 年《论可计算的数》：他定义了一条无穷纸带、一个读写头、在控制装置下读写 0/1 的装置；丘奇 1937 年在《符号逻辑杂志》对该文的评论里首次使用“图灵机”一词（PDF 第 184、186 页）。<\/p>\n<p><strong>丘奇-图灵论题<\/strong>：所有功能足够强的计算装置，计算能力都等价于图灵机。本书强调这是一个<strong>观察，而不是定理<\/strong>——无法证明不会出现新的更强装置；当时递归函数、λ 演算、Post 系统、图灵机等已被证明可互相模拟（PDF 第 185–186 页）。<\/p>\n<p><strong>通用图灵机（UTM）<\/strong>的思想同样深刻：一台图灵机的执行过程可以编码成数据放上纸带，另一台图灵机读出编码指令并逐步模仿它。被编码的图灵机就是软件；冯诺伊曼存储程序架构的思想正来自这里（PDF 第 188 页）。<\/p>\n<p>在可计算性层面之外，还有<strong>计算复杂性<\/strong>层面：非确定性图灵机上多项式时间可解的问题简称 NP，确定性图灵机上多项式时间可解的是 P。洪加威提出的相似性原则（也称强丘奇-图灵论题/扩展论题）讨论不同计算模型之间模拟的成本，它同样是工作假设而非数学定理（PDF 第 189–190 页）。本书提醒：一台机器可以在可计算性上满足丘奇-图灵论题，却在复杂性层面不服从相似性原则——能模拟，但不能在多项式时间内模拟，这也算一种“超计算”（PDF 第 191 页）。<\/p>\n<h3>3. 人是机器吗：理论立场的几个岔路<\/h3>\n<p>图灵本人提出过 oracle（天启）思想：一台图灵机可以问 oracle 任何问题，当 oracle 能力超过图灵机时，就有了超计算。彭罗斯（Roger Penrose）用“非算法”、有人用“超图灵/超级图灵”指称这类装置（PDF 第 190–191 页）。<\/p>\n<p>计算模型并不只有图灵机：BSS 模型（布卢姆一家三口）假设任意精度实数之间的比较是单位时间的，在 BSS 模型里一阶逻辑所有东西都可判定，这与图灵机上停机问题不可判定截然不同；差别可溯源到哥德尔证明算术不可判定、塔尔斯基证明实数一阶理论（初等几何与代数）可判定这两条逻辑线（PDF 第 191–192 页）。多依奇（David Deutsch）首创通用量子图灵机模型，提出丘奇-图灵-多依奇原理，在计算里加入物理内容：经典图灵机约束是经典物理，量子图灵机约束是量子物理；量子计算机不能求解图灵机不可计算的问题，但在某些条件下可能违背强丘奇-图灵论题（PDF 第 193–194 页）。<\/p>\n<p>本书给出的工作判断是：如果认可丘奇-图灵论题和相似性原则，那么人就是图灵机；目前所有 AI 工作都建立在这个认同之上。争议主要剩下两处跳跃：图灵机到量子计算的跳跃、经典物理到量子物理的跳跃（PDF 第 196、199 页）。<\/p>\n<h3>4. 概念 8：所罗门诺夫归纳与算法信息论（难度：高难）<\/h3>\n<p>详见 <a href=\"#\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。所罗门诺夫（Ray Solomonoff）是达特茅斯会议上最认真对待会议的人，整个暑假都在会；他 1951 年在芝加哥大学跟随卡尔纳普（Rudolf Carnap），归纳推理成为毕生方向。1956 年 8 月 14 日他把打字稿给参会人员传阅；工作首次公开发表于 1960 年加州理工会议，1964 年以《A Formal Theory of Inductive Inference》正式发表在《信息与控制》（PDF 第 201、204–206 页）。<\/p>\n<p><strong>所罗门诺夫归纳法<\/strong>：给定序列 <span class=\"katex-inline\">(x_1,x_2,\\dots,x_n)<\/span>，预测 <span class=\"katex-inline\">x_{n+1}<\/span>；归纳推理力图找到一个编码长度最短的图灵机程序，为已知序列建模，从而准确预测后续序列。序列的描述复杂度，就是输出该序列的最短图灵机程序长度（PDF 第 206 页）。<\/p>\n<p>这一机制与大模型的对应关系在本书里讲得很直接：<\/p>\n<ul><li>\n它就是以 GPT 为代表的大语言模型核心机制 <strong>next token prediction<\/strong> 的理论前身；能对已知数据做出概括的图灵机就是大模型。\n<\/li><li>\n在同样数据集上，期望覆盖数据且最经济（最短）的图灵机；<strong>学习可以被当作压缩<\/strong>，参数量与 token 量的关系也可借此研究。\n<\/li><li>\n所罗门诺夫归纳可能不停机，只能用近似算法，放宽对“最小性”和预测准确性的限制；神经网络作为通用逼近器，是实现这一归纳的候选机制（PDF 第 207 页）。\n<\/ul>\n<h3>5. SKC 复杂性：不可计算的最优压缩<\/h3>\n<p>柯尔莫哥洛夫（Andrey Kolmogorov）1965 年创办刊物并提出现在所称的<strong>柯尔莫哥洛夫复杂性<\/strong>；他后来注意到所罗门诺夫的工作，1968 年分别用俄文和英文发表文章引用所罗门诺夫，使后者在苏联名声比在西方更响。蔡汀（Gregory Chaitin）独立确认了柯尔莫哥洛夫的工作；三人的理论合称所罗门诺夫-柯尔莫哥洛夫-蔡汀复杂性（SKC 复杂性），也称算法熵、描述复杂性（PDF 第 208–210 页）。<\/p>\n<p>不变性定理：不同程序表示（C、Java、Python、图灵机代码）对应的最短描述长度只差一个常量；这一定理可看作丘奇-图灵论题的推论。但柯尔莫哥洛夫复杂性是<strong>不可计算的<\/strong>——最优压缩不存在通用算法，工程上只能用贝叶斯概率近似（PDF 第 209、218 页）。列文（Leonid Levin）在柯尔莫哥洛夫复杂性基础上加时间限制，提出 L-search 通用搜索过程，复杂性于是变得可计算（PDF 第 212–213 页）。<\/p>\n<p>本书还给出一组对应：压缩时间对应训练时间，柯尔莫哥洛夫复杂性对应模型参数量，逻辑深度对应最短“推断”（inference）时间；并提醒大模型术语里的 inference 更合适的译法是“推断”（统计意义），有别于逻辑意义上的“推理”（reasoning）（PDF 第 214 页）。<\/p>\n<h3>6. Scaling 之后的学习观：BERT、GPT 与归纳框架<\/h3>\n<p>回到工程分野：谷歌的 BERT 可描述为“给定序列抽走 <span class=\"katex-inline\">x_i<\/span>，猜 <span class=\"katex-inline\">x_i<\/span> 是什么”（掩码、双向）；OpenAI 的 GPT 采用单向 next token prediction。本书指出，Transformer 只是实现 next token prediction 的一种特定神经网络架构，探索非神经网络实现所罗门诺夫归纳的机制仍是开放课题（PDF 第 215–216 页）。<\/p>\n<p>2023 年 8 月，OpenAI 首席科学家伊利亚·苏茨克维在赛蒙斯计算理论研究所（Simons Institute）演讲中明确透露：GPT 的数学依据就是所罗门诺夫归纳法（Sutskever, 2023）。在这一框架下，离线学习（监督学习）和在线学习（强化学习）都能得到计算理论解释：建模就是压缩，压缩由图灵机完成；科学革命、奥卡姆剃刀、波普尔证伪都可作为所罗门诺夫归纳的特例或近似——能覆盖所有数据的最小模型，就是最短的程序或最小的图灵机（PDF 第 216–218 页）。<\/p>\n<p>为什么这套学习观在 scaling 时代显得重要？因为当模型规模、数据和算力同时扩大时，“通用算法 + 增长算力”的路线（萨顿《The Bitter Lesson》的思路）压过了手工知识路线；而所罗门诺夫- SKC 理论为这条路线提供了第一性原理层面的解释：预测能力来自对数据的压缩概括，压缩的定量度量就是 SKC 复杂性。本书同时保留谨慎：所罗门诺夫归纳与 SKC 复杂性普遍不可计算，理论暂时落后于工程实践，大模型评价也落后于开发（PDF 第 216、218 页）。<\/p>\n<h2>完整推导 1：语言之争为什么必须回到计算理论<\/h2>\n<ol><li>\n立场前提：乔姆斯基主张思维由语言生成，语言结构内在、非经验习得；辛顿一派主张数据驱动学习，乔姆斯基则批评端到端结果无法解释（PDF 第 177–183 页）。\n<\/li><li>\n形式化环节：乔姆斯基文法层次与自动机对应，3 型文法等价有限自动机，0 型文法等价图灵机（PDF 第 179、187 页）。\n<\/li><li>\n推论环节：如果承认语言等于思维，又承认 0 型文法等价图灵机，就必须面对“图灵机能否思维”的计算问题；语言学争论由此被翻译成可计算性与装置能力问题。\n<\/li><li>\n边界落点：丘奇-图灵论题是观察而非定理；认可论题与相似性原则，人才被当作图灵机，现有 AI 工作都建立在这一认同之上（PDF 第 186、196 页）。反例检验：oracle、非算法、超图灵等说法属于理论边界设想，不是已实现装置（PDF 第 190–191 页）。\n<\/ol>\n<h2>完整推导 2：所罗门诺夫归纳怎样推到 next token prediction，理论为什么仍落后工程<\/h2>\n<ol><li>\n归纳构造：给定序列 <span class=\"katex-inline\">(x_1,\\dots,x_n)<\/span>，找编码长度最短、能生成已知序列的图灵机程序，先验概率随程序长度指数衰减，据此预测 <span class=\"katex-inline\">x_{n+1}<\/span>（PDF 第 206 页）。\n<\/li><li>\n对应环节：能概括已知数据的图灵机就是大模型，这一机制即 GPT 的 next token prediction；学习被看作压缩，神经网络是通用逼近器候选（PDF 第 207 页）。\n<\/li><li>\n复杂性环节：最短程序长度即 SKC 复杂性；不变性定理说不同程序表示下最短描述长度只差常量；但 SKC 复杂性普遍不可计算，工程只能用贝叶斯概率近似（PDF 第 209、218 页）。\n<\/li><li>\n工程确认：2023 年 8 月伊利亚在赛蒙斯计算理论研究所演讲确认 GPT 的数学依据是所罗门诺夫归纳（PDF 第 216、219 页）。限制落点：归纳可能不停机，列文加时间限制的 L-search 才使搜索可计算；大模型评价仍落后于开发（PDF 第 213、216 页）。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[语言之争: 乔姆斯基 思维即语言] --&gt; B{承认丘奇-图灵论题?}\nB --&gt;|是| C[语言官能 ≡ 某种自动机&lt;br/&gt;0 型文法 ≡ 图灵机]\nB --&gt;|否| D[需超计算/非算法装置]\nE[计算理论基础] --&gt; F[图灵机 1936]\nF --&gt; G[丘奇-图灵论题: 观察非定理]\nF --&gt; H[通用图灵机: 程序即数据]\nG --&gt; I[可计算性层面]\nG --&gt; J[复杂性层面: 相似性原则]\nK[算法信息论] --&gt; L[所罗门诺夫归纳 1956/1964]\nL --&gt; M[SKC 复杂性: 不可计算]\nL --&gt; N[next token prediction]\nN --&gt; O[GPT 单向 NTP]\nN --&gt; P[BERT 双向掩码]\nM --&gt; Q[学习即压缩]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上半段是哲学与可计算性的分叉，下半段是学习的理论骨架；所罗门诺夫归纳把“预测序列”和“找最短程序”统一起来，大模型工程是这一思想在神经网络上的近似实现。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：所罗门诺夫归纳像找一个能压缩整套故事的最短剧本大纲——大纲越短，越能预测后续情节；SKC 复杂性就是这份大纲的理论长度，而写出绝对最短大纲在数学上做不到。\n<\/li><li>\n实例：伊利亚 2023 年 8 月的演讲把 GPT 与所罗门诺夫归纳直接挂钩；而 BERT 的掩码预测更像做完形填空，GPT 的 NTP 更像顺着故事往下续写，两者在本书框架里都是序列预测的不同变体。\n<\/li><li>\n对照：图灵 1948 年《智能机器》里的 P 型机只接受快乐/痛苦刺激，是强化学习奖励惩罚的雏形；到第 11 章，强化学习又被放回所罗门诺夫归纳的统一框架内解释（PDF 第 131、218 页）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：丘奇-图灵论题是一条已被证明的定理。<\/strong> 本书明确它是观察：当时各种装置可互相模拟，但无法排除未来出现更强装置（PDF 第 186 页）。\n<\/li><li>\n<strong>误解：量子计算机能算出图灵机不可计算的问题。<\/strong> 本书立场是不能；量子计算只在某些条件下违背强丘奇-图灵论题（复杂性层面），不违背可计算性层面的论题（PDF 第 194 页）。\n<\/li><li>\n<strong>误解：大模型的理论基础是 Transformer 架构。<\/strong> 本书区分：Transformer 只是实现 next token prediction 的一种手段；理论前身是所罗门诺夫归纳与算法信息论，架构是工程选择（PDF 第 215–216 页）。\n<\/li><li>\n<strong>误解：学习即压缩意味着模型把知识背下来。<\/strong> 压缩要求的是概括出最短程序/表示，共相的表示比诸多殊相经济；不可计算的是最优压缩，实际模型给出的是近似。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n乔姆斯基“思维即语言”与辛顿的数据驱动学习，分歧在哪一层？（答案：语言能力来自先天结构还是后天数据；二者都可被放进“语言官能是否等价自动机”的计算问题里审视。）\n<\/li><li>\n丘奇-图灵论题和相似性原则分别对应哪个层面？为什么说它们不是定理？（答案：前者对应可计算性，后者对应计算复杂性；二者都是基于已有装置互相模拟的观察/工作假设，无法对未来装置严格证明。）\n<\/li><li>\n所罗门诺夫归纳怎么定义？为什么说学习即压缩？（答案：找最短程序为已知序列建模并预测下一个元素；建模即概括，概括的经济程度就是压缩，最短程序对应最小模型。）\n<\/li><li>\nBERT 与 GPT 的预测方式差别是什么？Transformer 在其中处于什么位置？（答案：BERT 双向掩码猜被遮住的词，GPT 单向 NTP；Transformer 是二者共用的底层架构，不是理论本身。）\n<\/ol>\n<h2>反事实分析<\/h2>\n<p>假设丘奇-图灵论题不成立，AI 立场会怎样变化？书中判断是：论题与相似性原则是现有 AI 工作的默认认同——认可它们，人就是图灵机；如果论题被更强装置突破，符号、连接、强化各路线的实现边界都要重写（PDF 第 196、199 页）。但这一假设在本书记录里没有落地证据：量子计算不能求解图灵机不可计算的问题，只可能在复杂性层面违背强论题（PDF 第 194 页）。<\/p>\n<p>另一条假设：所罗门诺夫归纳若在 1960 年代即被工程化，大模型是否会提前出现？书中记载研究停滞近二十年，最终实现归纳机制的恰是神经网络（PDF 第 204 页）。反事实判断：理论可以早提出，实现仍受通用逼近装置、数据规模与算力约束；不可计算的最优压缩这一环不会因时间提前而消失，工程近似路线依旧需要后来的网络结构。<\/p>\n<h2>本章在全书依赖图中的位置<\/h2>\n<p>本章回收前三章的两条伏笔：计算理论底座（c09）支撑符号、连接、强化所有实现；归纳框架（c08）把监督学习、强化学习与序列预测统一成压缩过程。至此，符号主义、连接主义、行为路线与大模型学习观在同一套可计算性—归纳语言下合拢。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n语言之争：乔姆斯基理性主义/内在结构 vs 辛顿经验主义/数据驱动；0 型文法等价图灵机是两边都绕不开的计算事实。\n<\/li><li>\n计算理论：图灵机 1936 → CTT（观察非定理）→ UTM 程序即数据 → 相似性原则（复杂性层面）→ BSS/量子模型的边界。\n<\/li><li>\n算法信息论：所罗门诺夫归纳（最短程序预测下一项）→ SKC 复杂性（不可计算，贝叶斯近似）→ 学习即压缩。\n<\/li><li>\n工程落点：next token prediction；GPT 单向、BERT 双向；伊利亚 2023 年 8 月演讲确认 GPT 的所罗门诺夫归纳依据；理论落后于工程仍是现状。\n<\/ul>", "kind": "chapter", "title": "第 9–11 章：语言、计算理论与大语言模型"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.17<\/div><h1>符号主义与物理符号系统假说<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1–2 章\n<\/ul>\n<h2>问题<\/h2>\n<p>1950 年代中期，研究者要回答一个具体困难：智能活动能不能不依赖大脑的生理结构，只在描述层面被机器复刻？纽厄尔与司马贺在兰德公司、卡内基-梅隆的合作需要一条明确纲领，否则“用计算机模拟智能”只是一句口号。如果没有这条纲领，早期 AI 会把神经元模拟和心智功能研究混在一起，方法与评价标准都无法统一。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>物理符号系统假说<\/strong>由纽厄尔与司马贺提出（PDF 第 17 页），逐句拆开：<\/p>\n<ul><li>\n“物理符号”：符号对应物理客体，不是凭空的记号；\n<\/li><li>\n“操作”：智能表现为对符号的识别、组合、替换与推理；\n<\/li><li>\n“假说”：这是一条可检验的研究立场，不是已被证明的定理。\n<p>合起来：智能是对符号的操作，最原始的符号对应于物理客体。符号主义这一路线，假定世界可被拆成客体、关系与规则，机器操作这些符号即可表现出智能。<\/p>\n<\/ul>\n<h2>推导<\/h2>\n<p>推理链分三步。第一步，观察人类解题：人证明定理、下棋、诊断问题时，处理的是概念与关系，而非直接处理神经元放电。第二步，由此抽出假设：只要机器能表示客体符号、按规则变换符号，就不必复刻大脑结构。第三步，工程落地：纽厄尔与司马贺的“逻辑理论家”证明《数学原理》命题逻辑子集（PDF 第 23 页），是这条假设的第一次演示；后续定理证明、专家系统、逻辑程序都沿这条思路展开。每一步的依据是书中记载的人物谱系与系统案例，而不是哲学断言。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>假说在“边界清楚、知识可显性写成规则”的领域好用：定理证明、窄领域诊断、零部件配置。边界在于：常识难以穷尽表示，感知（视觉、语音）无法直接写成符号规则；当问题需要从大量实例中归纳模式时，符号表示的获取成本迅速上升。条件去掉会怎样：如果放弃“符号可显性表示”这条假设，剩下的路线就是从数据中调整连接，即连接主义；如果放弃“符号操作即智能”，就退回到对大脑结构的直接模拟。<\/p>\n<h2>反例<\/h2>\n<p>本书记载的反例是常识工程：雷纳特的 Cyc 用逻辑表达人类常识，1984 年预言 1999 年每台计算机预装 Cyc，1986 年估计需要约 2500 万条规则，1990 年代初即被批评没有成功案例（PDF 第 72 页）。这说明客体与关系虽可符号化，但常识的体量与隐性程度超出手工规则库的承载能力。<\/p>\n<h2>辨析<\/h2>\n<p>与最近邻的连接主义差在哪一步：符号主义在描述层把智能归于符号操作，知识由人提炼入库；连接主义把智能归于连接强度调整，知识由数据训练出来。两者的分歧不在“机器要不要算”，而在知识从规则来还是从数据来。与控制论路线的差别：符号派刻意与维纳的控制论划清界限，关注符号推理而非反馈调节（PDF 第 18、127 页）。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：图灵机与可计算性观念（c09）提供“符号可被机器处理”的底座。后继：自动定理证明与归结原理（c02）是符号主义最早的技术阵地；专家系统与知识表示（c03）是它的工程落地。本概念把达特茅斯会议的人物谱系与后来三条 AI 路线的分野串在一起。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（符号主义与物理符号系统假说）<\/summary><div class=\"depth-body\"><h1>符号主义与物理符号系统假说 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要把这条假设推到底，先逐级倒查它依赖什么：<\/p>\n<ol><li>\n“符号可被机器处理”依赖更底层的可计算观念：符号串能被读写、替换、组合，这一能力由图灵机模型刻画（见 c09，PDF 第 184 页）。没有机械化底座，符号只能是人脑中的概念。\n<\/li><li>\n“智能是操作”依赖一个观察：人在解题时处理的是概念与关系，而不是直接感知神经元活动。这一观察在 1950 年代的心理学与计算机交叉处形成。\n<\/li><li>\n“符号对应物理客体”依赖经验主义立场：符号不是凭空生成的记号，它指称外部世界里可分辨的对象。\n<\/li><li>\n再往前一层，还需要一条研究假设：机器不必复刻大脑生理结构，只在描述层面模拟心智功能就足够。这条假设把符号派与神经模拟派分开。\n<\/ol>\n<p>逆推到读者基线为止：先认“符号=可处理的记号”，再认“操作=按规则变换记号”，最后认“这就是智能的描述层”。<\/p>\n<h2>正向推导<\/h2>\n<p>正向链条分四步，每一步写清用了哪条假设：<\/p>\n<ul><li>\n第一步，事实观察：纽厄尔与司马贺观察人类证明定理、下棋等活动，发现人处理的是概念、关系与目标，而不是肌肉反应。这一步用的假设是“心智活动可在描述层被观察”。\n<\/li><li>\n第二步，提出假设：既然处理对象是符号，就可以假设智能在描述层等价于符号操作；符号对应物理客体，操作包括识别、组合、替换与推理。这就是物理符号系统假说（PDF 第 17 页）。\n<\/li><li>\n第三步，工程检验：假设要落地成可运行程序。“逻辑理论家”证明《数学原理》命题逻辑的一个很大子集，是符号操作假设的第一次演示（PDF 第 23 页）。检验只说明程序能做一类符号推理，不证明人类智能完全等同于符号操作。\n<\/li><li>\n第四步，路线分化：在这条假设上，长出定理证明、专家系统、逻辑程序三类工程；常识与感知则成为符号表示覆盖不到的区域，留给连接主义与行为路线。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：1955 年建议书罗列了 7 个研究领域——自动计算机、编程语言、神经网络、计算规模的理论、自我改进、抽象、随机性与创见性（PDF 第 22 页）；符号路线当时与神经网络等路线并排在同一议程内，并非开场就独占。\n<\/li><li>\n史料：麦卡锡对会议的原始预算是 13500 美元，洛克菲勒基金会只批了 7500 美元；按书中推算，麦卡锡、明斯基当时年薪不到 8000 美元（PDF 第 22 页）。经费与硬件规模限定了会议只能是小规模研讨。\n<\/li><li>\n推断：在真空管机器、存储器与程序语言都未成熟的年代，把智能先抽成符号操作是成本最低的可行选择——不必复刻神经元，也不必等待感知数据积累。这一步是后人基于史料条件做的推断，原书没有直接写成因果判断。\n<\/li><li>\n必然还是偶然：符号派成为主流，与纽厄尔、司马贺在工程演示上的领先有关，带有偶然性；但在当时条件下选择符号抽象作为研究对象，是环境约束下的可行解。\n<\/ul>\n<p>推导中保留的限定：假说是研究立场，不是已证明的定理；它对窄领域有效，不等于解释全部智能。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，人物谱系。1956 年达特茅斯会议上，纽厄尔与司马贺代表符号派；麦卡锡、明斯基、香农、塞弗里奇、所罗门诺夫等在场。纽厄尔 1927—1992，司马贺 1916—2001，两人共享 1975 年图灵奖，三年后司马贺再获诺贝尔经济学奖（PDF 第 16–17 页）。案例二，系统检验。逻辑理论家在会上报告，能证明《数学原理》命题逻辑子集；它常被视为 AI 史最重要的原创工作之一，但逻辑学家并不买账（PDF 第 23、35 页）。案例三，反例检验。Cyc 试图用逻辑表示人类常识，雷纳特 1984 年预言 1999 年每台计算机预装 Cyc，1986 年估计需约 2500 万条规则，1990 年代初即被批评没有成功案例（PDF 第 72 页）。把三个案例放回链条：案例二是假设的成功演示，案例三是假设在常识边界上的失败。<\/p>\n<p>案例四，会议预算与议程规模（数字史料）。建议书列 7 个研究领域；原始预算 13500 美元、获批 7500 美元（PDF 第 22 页）。量级对照：这场学科起点会议的经费规模，与后来五代机十年 4.5 亿美元计划、2012 年前后深度学习所需的 GPU 集群形成代际落差；经费数字来自原书，代际落差对照是读者可做的量级推断。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：如果符号操作足以解释智能，常识应当可被规则穷尽；Cyc 的规模估计与失败记录说明常识的隐性程度超出手工规则库。反例二：视觉、语音等感知任务难以先写成符号规则，符号派在这些领域需要另接表示层，而不是直接推理。边界条件：在边界清楚、知识可显性表述的问题上，符号派方法有效；一旦问题依赖大量实例归纳，符号表示的获取成本成为瓶颈。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：AI 是匀速线性进步的。<\/strong> 反证：本书记录了两次起落，1969 年后神经网络进入近二十年寒冬，五代机 1994 年结束（PDF 第 91、97–98 页）；进步是路线交替与条件凑齐的阶梯，不是逐年匀速爬升。\n<\/li><li>\n<strong>误读：符号主义彻底失败了。<\/strong> 反证：符号思想后来进入规则引擎、知识图谱等后继形态（PDF 第 67、75 页）；失败的是通用符号工程与常识手工穷尽，不是符号表示这一手段本身。\n<\/li><li>\n<strong>误读：符号派从第一天起就排斥神经网络。<\/strong> 反证：1955 年建议书第 3 个领域就是神经网络（PDF 第 22 页）；两派是同一份议程里的不同进路，排斥是后来在资金、评价标准与路线竞争中逐步形成的。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n物理符号系统假说里“物理”二字限定的是什么？去掉它会变成什么主张？\n<\/li><li>\n逻辑理论家成功证明了哪本书的哪一部分？为什么说它只是假设的演示，不是假说被证明？\n<\/li><li>\n符号派与神经模拟派在第一天就分开，两者差在哪一条假设上？\n<\/li><li>\n用 Cyc 的记录说明：符号表示在常识问题上的边界在哪里？\n<\/li><li>\n为什么定理证明、专家系统、逻辑程序都可以挂在这条假设之下？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "符号主义与物理符号系统假说"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.38<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">符号主义与物理符号系统假说<\/a><\/span><\/div><h1>自动定理证明与归结原理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1–2 章\n<\/ul>\n<h2>问题<\/h2>\n<p>符号主义要证明自己能复刻“最纯粹的理性活动”，首选阵地就是数学证明：前提、规则、结论全是符号串，证明就是按规则把一串符号变成另一串。早期困难是：手工定理证明程序要么依赖启发式、被逻辑学家嫌弃，要么规则庞杂、难以实现。需要一条既通用又可机械化的推理规则，把一阶逻辑证明变成可重复执行的过程。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>自动定理证明（ATP）<\/strong>研究用机器判定或证明逻辑与数学命题。<strong>归结原理<\/strong>是罗宾逊 1965 年发表于 JACM 的推理规则（PDF 第 38 页）。逐句拆：<\/p>\n<ul><li>\n给定两个含互补文字的子句，归结消去互补文字，合成一个新子句；\n<\/li><li>\n配合<strong>合一（unification）<\/strong>：把两个一阶项按变量代换对齐；\n<\/li><li>\n有了归结，一阶逻辑证明推导原则上只反复使用这一条规则，不再需要为每种证明配一条专门规则。\n<\/ul>\n<h2>推导<\/h2>\n<p>链条按时间与逻辑两层展开。时间层：戴维斯 1954 年在 JOHNNIAC 上完成第一个定理证明程序，实现只有加法的普利斯博格算术判定过程，1957 年发表（PDF 第 33–34 页）；王浩 1958 年夏在 IBM 704 上 9 分钟证明《数学原理》一阶逻辑 150 条中的 120 条，1959 年夏改进版证明全部一阶定理加 200 条命题逻辑定理（PDF 第 36 页）。逻辑层：DP 过程（戴维斯-普特南）与 DPLL 是前驱；罗宾逊在实现 DP 过程时发现归结，拓展普拉维茨的合一算法，再加上“包含（subsumption）”策略——被已有子句包含的新子句不必保存（PDF 第 39 页）。结论：归结把证明规则统一化，合一解决项对齐，包含控制子句膨胀。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>归结在一阶逻辑范围内成立，依赖合一与子句形式化。边界：归结会很快生成大量新子句，组合爆炸仍需启发式与搜索策略控制；纯通用证明器在实际问题上效率有限。条件去掉会怎样：去掉合一，变量代换无法对齐，归结规则落不了地；去掉包含策略，无用子句堆积，证明器被检索成本拖垮。失败案例：费根鲍姆批评罗宾逊把人工智能引入陷阱，罗宾逊被迫从《人工智能杂志》编委会辞职（PDF 第 42 页）；这是纯逻辑路线在 AI 工程语境下受挫的记载。<\/p>\n<h2>反例<\/h2>\n<p>纯归结路线没有自动解决数学发现。阿贡小组 1996 年用 EQP 证明 1933 年提出的罗宾斯猜想，在 486 机上跑 13 天给出证明，再在 RS/6000 上跑 7 天验证（PDF 第 41 页）；成功依赖项索引、判别树索引等工程策略，不是归结规则单独完成的。反例同时提醒：定理证明能解决人长期未拿下的问题，但前提是搜索策略、索引与实现工程都到位。<\/p>\n<h2>辨析<\/h2>\n<p>与启发式程序的差别：“逻辑理论家”首创启发式思路，模拟人解题经验，对 AI 与心理学有意义，但逻辑学家不买账；王浩称其“不专业”（PDF 第 35 页）。与项重写的差别：罗宾逊 1960 年代奠定逻辑主义证明基础，高德纳与本迪克斯 1970 年开启形式主义的项重写路线，前者靠归结，后者靠单向方程规则（PDF 第 39 页）。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：符号主义纲领（c01）提供“证明即符号操作”的立场；图灵机（c09）提供机械化底座。后继：Prolog 与五代机的逻辑程序由定理证明传统生长；专家系统（c03）的推理机是同一符号思路在窄领域的变体。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（自动定理证明与归结原理）<\/summary><div class=\"depth-body\"><h1>自动定理证明与归结原理 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>倒查这条技术线需要哪些前置：<\/p>\n<ol><li>\n一阶逻辑的项、子句与推理规则是形式化语言基础；不懂逻辑表达式，就无法理解机器在证明什么。\n<\/li><li>\n机械化前提：逻辑证明可被拆成有限、可重复执行的步骤，这要求可计算观念成立（见 c09，PDF 第 184 页）。\n<\/li><li>\n更早的判定过程探索：戴维斯的普利斯博格算术程序、DP 过程与 DPLL，是归结规则出现前的工程积累（PDF 第 33–34 页）。\n<\/li><li>\n再往前，问题意识：数学证明是最纯粹的符号操作，符号派要在最高标准的理性活动上摸到智能（PDF 第 32 页）。\n<\/ol>\n<p>逆推基线：先认“证明=符号变换”，再认“变换可机械化”，最后认“需要一条统一规则降低工程复杂度”。<\/p>\n<h2>正向推导<\/h2>\n<p>按时间与逻辑两层推进，每步标明依据：<\/p>\n<ul><li>\n第一步，判定过程探索。戴维斯 1954 年在普林斯顿高等研究院的 JOHNNIAC 上完成第一个定理证明程序，文章 1957 年发表；程序实现普利斯博格算术（只有加法、没有乘法）的判定过程，该理论可判定但复杂性超指数（PDF 第 33–34 页）。依据：机器能执行固定判定流程。\n<\/li><li>\n第二步，机器证明提速。王浩 1958 年夏天在 IBM 704 上实现命题逻辑与一阶逻辑程序，后者 9 分钟证明《数学原理》一阶逻辑 150 条中的 120 条；1959 年夏天改进版证明全部一阶定理外加 200 条命题逻辑定理（PDF 第 36 页）。依据：高效算法加上当时机器能力，可在真实教科书定理上取得记录。\n<\/li><li>\n第三步，统一推理规则。罗宾逊在实现 DP 过程时发现归结原理，文章迟至 1965 年发表于 JACM（PDF 第 38 页）。以前的证明技术需要很多规则，归结把证明推导归约为一条规则；配合普拉维茨 1957 年提出的合一算法，把两个一阶项按变量代换对齐；另有被忽视的包含策略：被已有子句包含的新子句不必保存（PDF 第 39 页）。\n<\/li><li>\n第四步，工程策略配套。阿贡小组沃思等人提出支持集（set of support）等提高效率的概念；马库恩用 C 写 Otter 证明器，再用 EQP 证明罗宾斯猜想（PDF 第 40–41 页）。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：早期机器运算与存储条件有限，证明程序必须在有限机时内跑完；戴维斯程序发表滞后于实现三年（1954 实现、1957 发表），王浩程序依托 IBM 704 这一代机时资源（PDF 第 33、36 页）。\n<\/li><li>\n史料：评价标准分成两套——AI 圈子看重启发式与模拟人解题，逻辑圈子看重可判定性与形式化标准；逻辑理论家论文被《符号逻辑杂志》退稿，王浩称其“不专业”（PDF 第 35 页）。\n<\/li><li>\n推断：归结之所以被重视，直接原因是规则数量从多条压到一条，降低了实现复杂度；但它没有降低搜索规模，组合爆炸仍在，需要后来的支持集、索引等工程策略补救。这一因果是基于书中记载的技术链条做的推断。\n<\/li><li>\n必然还是偶然：统一规则的方向在一阶逻辑成熟后是可预期的；罗宾逊文章因匿名审稿耽搁到 1965 年发表、包含策略长期被忽视，这些节点带有偶然性。\n<\/ul>\n<p>推导保留的限定：归结统一了规则，但组合爆炸没有消失；证明器效率仍受搜索策略、索引与工程实现制约。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，王浩记录。1958 年夏 IBM 704，9 分钟，120/150 条一阶逻辑定理；1959 年夏全部一阶定理 + 200 条命题逻辑定理。王浩学生库克后来在 1971 年《定理证明的复杂性》提出 NP 完全性理论，1982 年获图灵奖（PDF 第 36 页）。案例二，罗宾斯猜想。猜想 1933 年提出，六十多年无人证明；EQP 在 1996 年 10 月 10 日给出证明，486 机跑 13 天，再在 IBM RS/6000 工作站跑 7 天验证（PDF 第 41 页）。案例三，路线受挫。费根鲍姆批评罗宾逊把人工智能引入陷阱，罗宾逊被迫从《人工智能杂志》编委会辞职；本书同时记载归结的简单性带来重视，但同样存在组合爆炸问题（PDF 第 42 页）。<\/p>\n<p>案例四，规模对照（数字史料 + 量级推断）。王浩程序在 9 分钟内处理教科书上编号明确的 150 条一阶定理；EQP 证明罗宾斯猜想用了 13 天机时加 7 天验证（PDF 第 36、41 页）。从几十条教科书定理到开放数学猜想，搜索空间差距以数量级计；具体子句膨胀倍数原书未给数字，此处只做“从分钟级到两周级”的量级推断，不补造膨胀率。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：纯归结不能自动完成数学发现。罗宾斯猜想的成功依赖项索引、判别树索引等工程策略，不是归结规则单独产出。反例二：启发式程序与逻辑证明是两条标准。逻辑理论家模拟人解题经验，被王浩称“不专业”；其论文还被《符号逻辑杂志》退稿（PDF 第 35 页）。边界条件：一阶逻辑范围内归结成立；超出范围的常识、感知与开放问题，证明器无法直接处理。条件去掉合一，变量代换无法对齐；去掉包含策略，无用子句堆积，检索成本拖垮证明器。<\/p>\n<h2>史料补充<\/h2>\n<p>定理证明线的人物与节点：戴维斯 1954 年在 JOHNNIAC 上实现逻辑理论家、1957 年发表；王浩 1958 年夏在 IBM 704 上九分钟证出 150 条一阶定理中的 120 条，1959 年夏补全一阶并证明 200 条命题逻辑定理；DP 与 DPLL 是后续 SAT 求解路线；王浩学生库克 1971 年提出 NP 完全性，1982 年获图灵奖（PDF 第 33、36 页）。归结线，罗宾逊 1965 年在《ACM 杂志》发表归结原理，合一算法与包含策略配套提出；EQP 1996 年 10 月 10 日证出罗宾斯猜想，老式 486 机跑 13 天、RS/6000 跑 7 天（PDF 第 38–41 页）。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：归结原理把证明变成了一键求解。<\/strong> 反证：本书明确记载归结同样存在组合爆炸问题（PDF 第 42 页）；统一的是规则数量，不是搜索规模，实际证明仍要策略与索引配合。\n<\/li><li>\n<strong>误读：机器证明从一开始就是 AI 的主线。<\/strong> 反证：逻辑学家与 AI 圈子长期若即若离，宁肯和计算机理论家混在一起；定理证明共同体与 AI 工程圈是逐步分化的（PDF 第 35、42 页）。\n<\/li><li>\n<strong>误读：王浩的程序只是重复逻辑理论家的思路。<\/strong> 反证：两者标准不同，王浩贴近逻辑判定过程，对理论计算机科学影响更深；逻辑理论家贴近人类启发式，对 AI 与心理学有意义（PDF 第 35–36 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n普利斯博格算术为什么可判定却仍不实用？复杂性结论是什么？\n<\/li><li>\n归结原理把证明规则统一到几条？它配套的两个机制分别解决什么问题？\n<\/li><li>\n王浩 1958 与 1959 两年的程序记录差在哪里？学生库克后来提出了什么理论？\n<\/li><li>\n罗宾斯猜想的证明耗时记录说明了什么？成功依赖哪些工程条件？\n<\/li><li>\n为什么说定理证明是符号派的思想源头，但纯逻辑路线在 AI 工程语境下受挫？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "自动定理证明与归结原理"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.65<\/div><h1>专家系统与知识表示<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 3–5 章\n<\/ul>\n<h2>问题<\/h2>\n<p>通用定理证明走不动之后，工程上需要一条能在真实专业场景落地的路径。具体困难是：窄领域里的老专家靠经验判断，但这些经验没有写成形式规则，机器无法使用。专家系统要解决的困难就是把专家在小领域内的判断抽出来，变成程序可执行的规则与推理流程；不这么做，AI 只能停留在玩具问题上。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>专家系统<\/strong>：把狭窄专业领域内专家的判断提炼成规则，在专用场景内模拟专家决策的程序。<strong>知识表示<\/strong>：研究如何把客体、关系与常识组织成机器可用的形式。逐句拆：<\/p>\n<ul><li>\n“狭窄领域”：系统不追求通用智能，边界明确；\n<\/li><li>\n“提炼规则”：知识从专家访谈与案例中抽取，写成“如果条件，那么结论”的产生式规则；\n<\/li><li>\n“模拟判断”：推理机按规则链给出结论，必要时做不精确推理。\n<\/ul>\n<h2>推导<\/h2>\n<p>第一步，观察科学判断：DENDRAL 团队面对质谱仪数据与化学结构之间的对应，把化学家的分析知识提炼成规则，输入质谱数据、输出化学结构，系统有时比莱德伯格的学生做得还好（PDF 第 65 页）。第二步，方法迁移到医学诊断：MYCIN 由肖特莱福 1976 年斯坦福博士论文完成，针对细菌感染诊断，首创产生式规则与不精确推理；处方准确率 69%，专科医生 80%，优于非本专业医生（PDF 第 66 页）。第三步，工程成熟：DEC 的 XCON 在 1980–1986 年按需求自动配置零部件，是成熟期最成功的案例（PDF 第 67 页）。推理依据是书中三个可核对的系统案例，而非“专家系统很成功”的笼统判断。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：领域边界清楚、专家经验可显性表述、判断错误的代价可评估。边界：规则覆盖不到的新情况系统无法处理；知识获取靠人工访谈，规模一大就变慢；隐性的感知与常识难以写成规则。条件去掉会怎样：如果领域边界不清、专家自己也讲不出判断依据，规则提炼就失去对象；如果取消产生式规则、改由数据训练，系统就不再是专家系统，而进入连接主义路线。<\/p>\n<h2>反例<\/h2>\n<p>Cyc 是常识知识表示的失败案例：雷纳特 1984 年预言 1999 年每台计算机预装 Cyc，1986 年估计常识规则至少 2500 万条，1990 年代初即被批评没有成功案例（PDF 第 72 页）。另一个边界案例：MYCIN 从未真正临床使用，其价值在方法被提炼为通用骨架 EMYCIN（PDF 第 66 页）。这两个案例说明专家系统的成功高度依赖窄领域与可抽取知识。<\/p>\n<h2>辨析<\/h2>\n<p>与定理证明的差别：定理证明追求通用逻辑推导，专家系统把领域知识显式编入规则库，推理服务于窄判断。与大模型的差别：专家系统知识由人写规则，大模型从数据归纳参数；两者知识获取方向相反。与知识图谱的关系：知识图谱是常识表示在 Web 数据整合方向的后继，2010 年谷歌收购 Metaweb 后命名 Knowledge Graph（PDF 第 75 页）。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：符号主义纲领（c01）与定理证明推理机（c02）提供规则与推理思路。后继：五代机（书中第 4 章）是符号工程在国家计划层面的重注；知识图谱与现代检索问答是其长线延伸。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（专家系统与知识表示）<\/summary><div class=\"depth-body\"><h1>专家系统与知识表示 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>倒查专家系统成立需要什么前置：<\/p>\n<ol><li>\n符号表示与推理机先存在：客体、关系可写成符号，推理可按规则执行（见 c01、c02，PDF 第 17、38 页）。没有符号底座，专家经验无处落地。\n<\/li><li>\n领域专家经验可被访谈、拆成“条件—结论”形式。这要求专家自己能讲出判断依据，问题边界相对清楚。\n<\/li><li>\n窄领域假设：系统不追求通用智能，只在一个专业场景内给出判断。\n<\/li><li>\n再往前的困境：通用定理证明在真实工程问题上效率有限，需要一条把知识显式编入程序的路线。\n<\/ol>\n<p>逆推基线：先认“知识可抽取”，再认“规则可执行”，最后认“窄领域内可模拟专家判断”。<\/p>\n<h2>正向推导<\/h2>\n<p>按案例推进，每步标明假设与证据：<\/p>\n<ul><li>\n第一步，化学结构判断。1964 年费根鲍姆从伯克利到斯坦福，与遗传学家、1958 年诺贝尔生理学或医学奖得主莱德伯格合作，团队成员布坎南；成果 DENDRAL 输入质谱仪数据、输出化学物质结构，把化学家分析知识提炼成规则，有时比莱德伯格的学生做得还好（PDF 第 64–65 页）。依据：领域内可抽出规则，规则可复刻专家判断。\n<\/li><li>\n第二步，医学诊断迁移。MYCIN 由肖特莱福 1976 年斯坦福博士论文完成，针对细菌感染诊断；处方准确率 69%，专科医生 80%，优于非本专业医生；MYCIN 首创产生式规则与不精确推理，原理后提炼为通用骨架 EMYCIN（PDF 第 66 页）。依据：同一套规则—推理结构可跨领域迁移。\n<\/li><li>\n第三步，工程成熟期案例。DEC 的 XCON 在 1980–1986 年按需求自动配置零部件，是成熟期最成功的专家系统案例（PDF 第 67 页）。依据：规则库加推理机可以进入真实生产流程。\n<\/li><li>\n第四步，常识表示外推。Cyc 把目标从窄领域推到人类常识，用逻辑表达常识；雷纳特 1984 年预言 1999 年每台计算机预装 Cyc，1986 年估计常识规则至少 2500 万条（PDF 第 72 页）。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：1970 年代初 DARPA 削减 AI 长期资助、改为每年评审，费根鲍姆团队需转向 NIH 与 NLM 资助；专家系统在经费压力下必须展示可落地的窄领域应用（PDF 第 67 页）。\n<\/li><li>\n史料：XCON 起源于卡内基-梅隆 R1，最早用 Fortran 写失败后改 BASIC，随后采用福吉发明的 Rete 算法与 OPS5 语言，效率大幅提高（PDF 第 67 页）。\n<\/li><li>\n推断：专家系统在 1980 年代初到 1990 年代初进入黄金期，条件是问题边界清楚、专家经验可表述、商业客户愿意为配置与诊断付费；三者缺一，规则库建不起来。这一条件归纳是基于书中案例做的推断。\n<\/li><li>\n必然还是偶然：把专家知识写成规则在窄领域可行，是符号路线的自然延伸；但黄金期长度受五代机幻灭与互联网新场景影响，1990 年代后“专家系统”一词带上负面含义，转向规则引擎形态（PDF 第 67 页）。\n<\/ul>\n<p>推导保留的限定：专家系统的成功记录都在窄领域；常识与隐性知识不在同一可抽取性上。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，DENDRAL。任务是由质谱数据推断化学结构，属第一个专家系统；证据落在 PDF 第 65 页。案例二，MYCIN。诊断细菌感染，69% 对 80% 的准确率记录，从未真正临床使用；价值在方法沉淀为 EMYCIN 基础（PDF 第 66 页）。案例三，XCON。DEC 零部件配置，1980–1986 年在使用，代表专家系统十年黄金期（PDF 第 67 页）。案例四，Cyc 反例。常识规则规模估计与 1990 年代初的失败批评，说明知识表示从窄领域推向常识时遇到体量瓶颈（PDF 第 72 页）。长线：2010 年谷歌收购 Metaweb，命名 Knowledge Graph；伯纳斯-李 2016 年获图灵奖（PDF 第 74–75 页）。<\/p>\n<p>案例五，订单与成本对照（数字史料）。XCON 在 1980–1986 年共处理 8 万个订单；节省金额估算分歧很大，最高称每年省 4000 万美元，也有说法每年省 2500 万美元，还有认为每年顶多几百万美元（PDF 第 67 页）。MYCIN 的 69% 与专科医生 80% 是另一组可核对数字（PDF 第 66 页）。两组数字说明：专家系统在窄流程里有实测价值，但收益与准确率都未达到顶尖专家水平；金额区间分歧本身，说明早期商业收益缺乏统一口径。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：MYCIN 未临床落地，说明模拟判断不等于可直接交付的医疗系统；领域责任、安全与集成问题超出规则本身。反例二：Cyc 的失败说明专家经验可抽取这一假设在常识层不成立——大量常识是隐性的、情境依赖的。边界条件：领域边界清楚、专家可表述经验、错误代价可评估，三条同时满足时专家系统有效；去掉任一条件，规则库要么建不起来，要么覆盖不住新情况。与大模型的差别在知识获取方向：专家系统由人写规则，大模型从数据归纳参数。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：专家系统就是早期的大模型。<\/strong> 反证：两者知识获取方向相反——专家系统靠人工访谈提炼规则，大模型从数据归纳参数；专家系统不具备从样本里自动形成表示的能力（PDF 第 66–67 页）。\n<\/li><li>\n<strong>误读：专家系统当年真的全面胜过人类专家。<\/strong> 反证：MYCIN 处方准确率 69%，低于专科医生 80%；XCON 的节省金额各估算相差一个数量级（PDF 第 66–67 页）。\n<\/li><li>\n<strong>误读：专家系统作为技术路线已经消失。<\/strong> 反证：互联网催生的电商配置、征信、反欺诈、风险控制延续了类似场景，专家系统改名规则引擎成为中间件标配，FICO 收购了一批专家系统公司（PDF 第 67 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\nDENDRAL 解决什么任务？它把哪一类知识提炼成了规则？\n<\/li><li>\nMYCIN 的准确率记录是多少？为什么说它的价值在方法而不在临床落地？\n<\/li><li>\n产生式规则与不精确推理是从哪个系统开始成为专家系统要素的？\n<\/li><li>\nCyc 案例对“常识可被手工规则穷尽”这一假设提出了什么反例？\n<\/li><li>\n专家系统在什么条件下有效？三条边界条件去掉一条会怎样？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "专家系统与知识表示"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.96<\/div><h1>连接主义与感知机<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 3–5 章\n<\/ul>\n<h2>问题<\/h2>\n<p>符号路线把知识写成规则，感知与模式识别却难以规则化。连接主义要解决的困难是：能不能仿照神经元结构，让机器从样本中自己分出模式，而不是由人先写好判别规则。1950 年代的具体目标是：构造一个可训练的单层网络，完成简单的视觉或模式识别任务。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>连接主义<\/strong>把智能归于神经元之间连接强度的调整。<strong>感知机<\/strong>是罗森布拉特 1957 年提出的单层神经网络模型（PDF 第 96 页）。逐句拆：<\/p>\n<ul><li>\n“单层”：输入层直接连到输出层，中间没有隐藏层；\n<\/li><li>\n“连接强度”：每条连接带权重，学习就是调整权重；\n<\/li><li>\n“可收敛”：在样本线性可分时，学习过程可以收敛到一组正确分类的权重。\n<\/ul>\n<h2>推导<\/h2>\n<p>前置链条：麦卡洛克与皮茨 1943 年提出神经元数学模型开山文章（PDF 第 93–94 页）；赫布 1949 年《行为的组织》提出后人所称的赫布学习规则（PDF 第 95 页）。落到感知机：罗森布拉特 1957 年在康奈尔提出模型，完成简单模式识别，并在理论上证明单层网络在线性可分问题上收敛；1962 年写成《神经动力学原理：感知机和大脑机制的理论》（PDF 第 96 页）。推理步骤：先有神经元模型与学习规则，再有可调权重的单层装置，最后证明其在可分条件下收敛。每一步对应书中可核对的人物与著作。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>成立条件：样本可被一条直线（高维中一个超平面）分开，网络为单层结构。边界：线性不可分的模式单层网络学不会；没有隐藏层，无法表示多层组合特征。条件去掉会怎样：去掉线性可分条件，收敛定理不再成立；去掉单层限制、引入隐藏层，问题就转到多层网络的训练方法，即反向传播（c05）要解决的困难。<\/p>\n<h2>反例<\/h2>\n<p>明斯基与佩珀特 1969 年《感知机：计算几何学》证明单层神经网络不能解决 XOR（异或）问题（PDF 第 97 页）。这一批判以充满敌意的方式呈现，被视为神经网络进入近二十年低谷的重要原因；1988 年该书再版时删去第一版攻击罗森布拉特的句子，并手写“纪念罗森布拉特”，IEEE 2004 年设立罗森布拉特奖（PDF 第 98 页）。XOR 是单层结构能力边界的标准反例：两条边界互相交叉，一条直线分不开两类。<\/p>\n<h2>辨析<\/h2>\n<p>与符号主义的差别：知识来源不同——符号派靠人写规则，连接派靠数据调权重。与多层深度学习的差别：感知机是单层模型，深度学习是多层结构；感知机的 XOR 局限不是连接主义整体的局限，而是单层模型的局限。与自适应线性元件（Adaline）的关系：维德罗同期提出的 Adaline 与感知机相似，都是单层可调权重装置（PDF 第 98 页）。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：麦卡洛克-皮茨模型与赫布规则提供神经装置与学习规则。后继：反向传播与深度学习复兴（c05）解决多层训练；强化学习（c06）在连接主义框架内引入奖励信号。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（连接主义与感知机）<\/summary><div class=\"depth-body\"><h1>连接主义与感知机 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>倒查感知机出现需要哪些前置：<\/p>\n<ol><li>\n神经元的数学模型先存在：麦卡洛克与皮茨 1943 年开山文章，把神经元抽象成可计算单元（PDF 第 93–94 页）。\n<\/li><li>\n学习规则先存在：赫布 1949 年《行为的组织》提出后人所称的赫布学习规则，说明连接强度如何随经验调整（PDF 第 95 页）。\n<\/li><li>\n问题动机：符号规则难覆盖模式识别，需要能从样本自学分类的装置。\n<\/li><li>\n再往前的路线分野：1955 年洛杉矶讨论会上，模拟神经系统与模拟心智两条进路已被区分（PDF 第 13 页）。\n<\/ol>\n<p>逆推基线：先认“单元可调权重”，再认“样本可驱动权重调整”，最后认“单层装置能解决哪类分类”。<\/p>\n<h2>正向推导<\/h2>\n<p>按历史顺序与逻辑条件推进：<\/p>\n<ul><li>\n第一步，神经元模型。麦卡洛克（1898—1969）与皮茨（1923—1969）1943 年文章给出神经元的数学表达，为人工装置提供结构原型（PDF 第 93–94 页）。依据：可把神经单元抽象成输入—输出单元。\n<\/li><li>\n第二步，学习规则。赫布 1949 年著作说明连接强度随重复激活调整，回答“权重为什么会变”（PDF 第 95 页）。依据：学习可落在连接参数上。\n<\/li><li>\n第三步，感知机构造。罗森布拉特 1957 年在康奈尔大学提出感知机模型，完成简单模式识别；理论上证明单层网络在线性可分问题上收敛；1962 年写成《神经动力学原理：感知机和大脑机制的理论》（PDF 第 96 页）。依据：在可分条件下，权重迭代能到达正确分类边界。\n<\/li><li>\n第四步，能力边界被证明。明斯基与佩珀特 1969 年《感知机：计算几何学》证明单层神经网络不能解决 XOR（异或）问题（PDF 第 97 页）。依据：边界形状是非线性可分时，单层超平面分不开两类样本。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：1950 年代硬件只能支撑简单单层装置，多层结构的训练方法尚未成形；感知机的实验形态与当时可上机的计算条件匹配（PDF 第 96 页）。\n<\/li><li>\n史料：《感知机》一书以充满敌意的方式呈现批判，被视为近二十年低谷的重要原因；1988 年再版删去攻击罗森布拉特的句子并手写纪念，IEEE 2004 年设罗森布拉特奖（PDF 第 97–98 页）。\n<\/li><li>\n推断：寒冬是理论边界与舆论打压共同作用的结果；XOR 不可解是事实结论，把它扩大成“神经网络整体不可行”是评价标准上的放大。这一区分是基于书中记录做的推断。\n<\/li><li>\n必然还是偶然：单层模型表达有限是数学事实，迟早会被指出；但低谷持续近二十年，与批判的舆论形态、资金转向有关，并非纯数学结论的直接后果。\n<\/ul>\n<p>推导保留的限定：被否定的是单层感知机，不是整个连接主义；多层结构仍可能表示非线性边界，但训练方法当时未解决。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，XOR 反例。异或的两类样本在二维平面上互相交叉，任何一条直线都分不开；单层网络只有一个超平面边界，无法完成分类（PDF 第 97 页）。案例二，打压与余波。《感知机》以敌意方式呈现批判，被视为神经网络近二十年低谷的重要原因；罗森布拉特 1928—1971，1971 年去世（PDF 第 97–98 页）。案例三，后期追认。1988 年再版删去第一版攻击罗森布拉特的句子，并手写“纪念罗森布拉特”；IEEE 2004 年设立罗森布拉特奖（PDF 第 98 页）。同期对照：维德罗的 Adaline 与感知机相似，同为单层可调权重装置（PDF 第 98 页）。<\/p>\n<p>案例四，尺度对照（数字史料 + 量级推断）。本书记载人脑神经连接约 100 万亿到 1000 万亿（10¹⁴—10¹⁵）个（PDF 第 114 页）；感知机作为早期人工装置，连接规模与之相差十几个数量级。具体每层权重数与单次训练计算量原书未给数字，此处只做“生物脑与早期人工装置规模不可同日而语”的量级推断，不补造感知机参数量。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：把单层局限记成连接主义整体失败，是错误推断。XOR 只证明单层模型能力有限；多层网络与反向传播后来打开了另一空间（见 c05）。反例二：以为明斯基一直反对神经网络。本书记载他早期博士论文就是关于神经网络的，后来才转向并与罗森布拉特决裂（PDF 第 97 页）。边界条件：线性可分、单层结构两条同时满足时，收敛定理成立；去掉可分条件，定理失效；去掉单层限制，问题转入多层训练。<\/p>\n<h2>史料补充<\/h2>\n<p>两代连接主义文献：麦卡洛克-皮茨 1943 年形式化神经元，赫布 1949 年提出学习律；罗森布拉特 1957 年构造感知机、1962 年出版专著；明斯基与帕佩尔特 1969 年《感知机》证明单层网络不可解 XOR；1988 年再版删去带有攻击性的结尾句，IEEE 2004 年设立罗森布拉特奖（PDF 第 93、95–98 页）。两次起落之间的过渡人物是霍普菲尔德 1982 年与玻尔兹曼机 1983–1986 年，它们为 1986 年反向传播论文留出位置（PDF 第 101–102、118 页）。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：感知机被证明不行，所以神经网络路线被否定了。<\/strong> 反证：被证明不可解的是单层网络的 XOR 问题；连接主义整体并未被判死刑，1980 年代后由多层网络与反向传播接续（PDF 第 97–98、118 页）。\n<\/li><li>\n<strong>误读：罗森布拉特只是做了个简单硬件玩具。<\/strong> 反证：他给出了单层网络在线性可分条件下的收敛理论，并写成 1962 年专著；收敛结论是理论结果，不只是实验观察（PDF 第 96 页）。\n<\/li><li>\n<strong>误读：明斯基从头到尾站在神经网络对立面。<\/strong> 反证：他早期博士论文即关于神经网络，早期属“吃啥补啥”一派，决裂发生在后来的路线冲突中（PDF 第 97 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n麦卡洛克-皮茨模型与赫布规则分别为感知机提供了什么前置？\n<\/li><li>\n感知机的收敛定理在什么条件下成立？罗森布拉特 1962 年著作叫什么？\n<\/li><li>\nXOR 为什么是单层网络的标准反例？用边界形状说明。\n<\/li><li>\n《感知机》1969 年一书造成了什么后果？1988 年再版时做了什么修改？\n<\/li><li>\n为什么不能把 XOR 局限解读为连接主义路线整体失败？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "连接主义与感知机"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.111<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">连接主义与感知机<\/a><\/span><\/div><h1>反向传播与深度学习复兴<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3–5 章\n<\/ul>\n<h2>问题<\/h2>\n<p>感知机被 XOR 卡住之后，多层网络表达能力更强，但长期缺少可行的训练方法：隐藏层里的权重看不到直接的对错反馈，无法像单层那样直接调整。待解决的困难是：误差信号怎样从输出层逐层传回中间层，让每一层权重都知道自己该往哪个方向改。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>反向传播（backpropagation）<\/strong>：把输出误差逐层回传，用梯度下降调整多层网络各层权重的算法。逐句拆：<\/p>\n<ul><li>\n“误差”：输出与目标之差，可度量；\n<\/li><li>\n“逐层回传”：误差信号沿连接反向传到前一层，计算各权重对误差的贡献；\n<\/li><li>\n“梯度下降”：沿使误差减小的方向迭代更新权重；\n<\/li><li>\n“多层”：方法针对含隐藏层的网络，不只是单层感知机。\n<\/ul>\n<h2>推导<\/h2>\n<p>铺垫：霍普菲尔德 1982 年提出霍普菲尔德网络，把网络看作带能量函数的系统，为低潮期的神经网络提供物理学基础；1983–1986 年辛顿与谢诺夫斯基引入隐藏单元和概率分布，提出玻尔兹曼机（PDF 第 101–102 页）。算法层：Werbos 1974 年已有反向传播相关文章，但未在神经网络圈子引起反响；1986 年鲁梅尔哈特、辛顿、威廉姆斯在《自然》杂志发表压缩版本，把反向传播加梯度下降放到多层神经网络上，作者并未引用 Werbos 1974 年博士论文（PDF 第 111、118 页）。落地层：辛顿 2006 年两篇文章开辟深度学习方向；2012 年 ILSVRC 上团队 SuperVision 以 AlexNet 夺冠，学生克里泽夫斯基与苏茨克维在列；2018 年图灵奖颁给辛顿、本吉奥、杨立昆（PDF 第 113–114 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>适用条件：网络可微分、训练样本可给出目标反馈、算力足以支撑多层迭代。边界：需要大量标注数据与并行算力；深层网络的训练稳定性、梯度消失/爆炸仍需结构与策略配合。条件去掉会怎样：去掉可微分，误差无法沿连接传回；去掉数据与算力，算法虽在 1986 年成形，工程拐点仍要等到 2012 年前后。<\/p>\n<h2>反例<\/h2>\n<p>1986 年之后神经网络并未立即取代其他路线：寒冬后的复兴是渐进的，语音识别 2009 年起才由微软邓力小组与辛顿合作、结合深度学习与隐马尔可夫模型在 2011 年取得突破（PDF 第 113 页）。这说明算法单靠自身不足以形成拐点，数据、任务与算力同时到位才有实测突破。另一个史实：反向传播并非 1986 年凭空出现，Werbos 1974 年已有早期工作（PDF 第 111 页），把功劳全记在 1986 年论文上不符合记载。<\/p>\n<h2>辨析<\/h2>\n<p>与梯度下降的差别：梯度下降是优化方法，反向传播是误差在网络中的回传与梯度计算方式，二者配合使用。与感知机的差别：感知机是单层直接调权重，反向传播解决多层隐藏层的信用分配问题。与强化学习的差别：反向传播依赖监督目标反馈，强化学习依赖延迟奖励信号；两者后来在深度强化学习中结合。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：连接主义与感知机（c04）提出单层局限；玻尔兹曼机提供概率网络铺垫。后继：统计 NLP 与 Transformer（c07）把多层网络用到语言任务；强化学习（c06）与反向传播结合出深度强化学习。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（反向传播与深度学习复兴）<\/summary><div class=\"depth-body\"><h1>反向传播与深度学习复兴 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>倒查反向传播要解决什么、依赖什么：<\/p>\n<ol><li>\n单层感知机的局限先被确认：XOR 单层不可解（见 c04，PDF 第 97 页），需要含隐藏层的多层网络。\n<\/li><li>\n多层网络的困难在信用分配：隐藏层权重看不到直接对错，不知道往哪改。\n<\/li><li>\n可微分前提：误差必须能沿连接逐层传回，计算各权重对误差的贡献。\n<\/li><li>\n铺垫网络：霍普菲尔德网络与玻尔兹曼机先在低谷期提供物理学与概率模型基础（PDF 第 101–102 页）。\n<\/ol>\n<p>逆推基线：先认“多层表达更强”，再认“误差需要回传”，最后认“梯度下降可迭代更新权重”。<\/p>\n<h2>正向推导<\/h2>\n<p>按铺垫、算法、落地三步推进：<\/p>\n<ul><li>\n第一步，低谷期铺垫。霍普菲尔德 1982 年提出霍普菲尔德网络，把网络看作带能量函数的系统；1983–1986 年辛顿与谢诺夫斯基在隐藏单元与概率分布上提出玻尔兹曼机（PDF 第 101–102 页）。依据：网络可被当作可优化的动力系统。\n<\/li><li>\n第二步，算法成形。Werbos 1974 年已有反向传播相关文章，但未在神经网络圈子引起反响；1986 年鲁梅尔哈特、辛顿、威廉姆斯在《自然》杂志发表压缩版本，把反向传播加梯度下降放到多层神经网络上；该文未引用 Werbos 1974 年博士论文（PDF 第 111、118 页）。推导链条：输出误差 → 沿连接反向计算各层权重贡献 → 沿误差减小方向更新权重 → 迭代到收敛。\n<\/li><li>\n第三步，工程拐点。辛顿 2006 年两篇文章开辟深度学习方向；2012 年 ILSVRC 上团队 SuperVision 以 AlexNet 夺冠，学生克里泽夫斯基与苏茨克维在列；2018 年图灵奖颁给辛顿、本吉奥、杨立昆；2024 年霍普菲尔德与辛顿获诺贝尔物理学奖（PDF 第 113–115、105 页）。\n<\/ul>\n<p>约束条件拆解（史料与推断分开标注）：<\/p>\n<ul><li>\n史料：1986 年之后神经网络未立即取代其他路线；语音识别到 2009 年起才由微软邓力小组与辛顿合作，2011 年取得突破（PDF 第 113 页）。\n<\/li><li>\n史料：2012 年 ILSVRC 用 1000 万张图像训练、15 万张图像测试；此前普遍错误率约 26%，SuperVision 首次参赛把错误率压到 15% 以下，领先超过 10 个百分点（PDF 第 113 页）。\n<\/li><li>\n推断：算法成形与工程拐点之间隔着数据规模、GPU 算力与网络结构三个条件；缺任意一个，2012 年的错误率差距不会出现。这一条件归纳基于书中时间线做推断，原书未做三因素分解。\n<\/li><li>\n必然还是偶然：多层训练方法迟早会被重新整理，但 AlexNet 夺冠的具体时点与团队、竞赛、硬件供给有关，带有偶然性。\n<\/ul>\n<p>推导保留的限定：1986 年算法成形不等于工程拐点；数据、任务、算力同时到位后才有实测突破。<\/p>\n<h2>算例（史实案例）<\/h2>\n<p>案例一，语音路径。深度学习不是 2012 年才突然起势：语音识别 2009 年起由微软邓力小组与辛顿合作，结合深度学习与隐马尔可夫模型，2011 年取得突破（PDF 第 113 页）。案例二，视觉拐点。2012 年 AlexNet 因克里泽夫斯基得名，另一位学生是伊利亚·苏茨克维；夺冠标志深度网络在大规模视觉任务上压倒此前方法（PDF 第 113 页）。案例三，算法史归属。Werbos 1974 年文章在先，1986 年论文的贡献是把反向传播与多层网络训练、梯度下降结合并产生广泛影响；把反向传播全记给 1986 年论文不符合记载（PDF 第 111、118 页）。<\/p>\n<p>案例四，ImageNet 量级对照（数字史料）。训练图像 1000 万张、测试图像 15 万张；基线错误率约 26%，SuperVision 压到 15% 以下，降幅超过 10 个百分点（PDF 第 113 页）。作为对照，沃森系统硬件为 90 台 IBM Power 750、720 核、2880 线程、16TB 内存、成本 300 万美元（PDF 第 169 页）；两类系统都说明，1980 年代的单机机时条件无法支撑 2012 年这种规模的训练。具体训练轮次与参数量原书未给，不做补造。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例一：算法不能脱离数据与算力生效。1986 年后神经网络未立即取代其他路线，复兴是渐进的；这说明单有算法不够。反例二：深层网络训练仍有稳定性问题，梯度消失、爆炸需要结构与训练策略配合；反向传播不是万能开关。边界条件：网络可微分、有可对照的目标反馈、算力支撑多层迭代，三条同时成立；去掉可微分，误差无法回传；去掉数据与算力，工程拐点推迟。与梯度下降的差别：梯度下降是优化方法，反向传播是误差回传与梯度计算方式，二者配合。<\/p>\n<h2>史料补充<\/h2>\n<p>奖项与时间线对照：2018 年图灵奖授予辛顿、本吉奥、勒昆；2024 年诺贝尔物理学奖授予霍普菲尔德与辛顿，对应连接主义两次起落之间的长期积累（PDF 第 105、115 页）。预训练路线上，辛顿小组 2006 年在《Science》发表两篇文章，把降维逐层预训练引入多层网络，配合新的层预训练算法改善训练（PDF 第 113 页）。语音线与视觉线并行：2009 年辛顿与微软、IBM、谷歌合作，2011 年语音识别突破；图像线以 ILSVRC 为标志（PDF 第 113 页）。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n<strong>误读：深度学习在 1986 年反向传播论文发表后就赢了。<\/strong> 反证：本书记载语音路径到 2009–2011 年才突破，视觉拐点等到 2012 年；算法与工程落地之间隔着二十多年（PDF 第 113 页）。\n<\/li><li>\n<strong>误读：反向传播是 1986 年凭空发明的。<\/strong> 反证：Werbos 1974 年已有相关文章；1986 年论文的贡献是结合多层网络与梯度下降并扩大影响，归属不能抹除早期工作（PDF 第 111、118 页）。\n<\/li><li>\n<strong>误读：深度网络的效果来自新发明的优化器。<\/strong> 反证：2012 年成绩同时依托 1000 万张训练图像、GPU 算力与网络结构；误差率从约 26% 降到 15% 以下是多条件叠加的结果（PDF 第 113 页）。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n多层网络相对单层解决了什么？又留下了什么新的训练困难？\n<\/li><li>\n反向传播的误差信号沿什么路径传回？权重更新朝哪个方向？\n<\/li><li>\nWerbos 1974 与 Rumelhart/Hinton/Williams 1986 两段史实如何区分归属？\n<\/li><li>\n为什么说 1986 年不是工程拐点，2012 年才是？数据与算力在其中起什么作用？\n<\/li><li>\n反向传播与梯度下降各指什么？二者是什么配合关系？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "反向传播与深度学习复兴"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：人工智能简史（第3版） · p.130<\/div><h1>强化学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6–8 章\n<\/ul>\n<h2>问题<\/h2>\n<p>监督学习需要逐条正确答案，现实中很多任务只能得到“好/坏”的延迟反馈，没有现成示范。待解决的困难是：Agent 怎样在与环境的试错互动中改变策略，使长期获得的奖励最大；这要处理延迟奖励、探索与利用的取
