ode>main<\/code> 中调用语句之后；局部 <code>result<\/code> 在帧回收后不可访问。<\/p>\n<p>再看两个形参的函数：<\/p>\n<pre class=\"lang-c\"><code>int add(int p, int q) { return p + q; }<\/code><\/pre>\n<p>调用 <code>add(3, 4)<\/code>：<code>p=3<\/code>、<code>q=4<\/code> 进入各自形参位置；返回 7。原型 <code>int add(int, int);<\/code> 在编译期核对调用是否传两个整数；缺一个实参时编译期即可发现。<\/p>\n<h2>算例二：阶乘递归的展开与退回<\/h2>\n<p>阶乘定义：<span class=\"katex-inline\">n! = n \\times (n-1)!<\/span>，基准 <span class=\"katex-inline\">0! = 1<\/span>、<span class=\"katex-inline\">1! = 1<\/span>。<\/p>\n<pre class=\"lang-c\"><code>long fact(int n)\n{\n    if (n &lt;= 1)\n        return 1;\n    return n * fact(n - 1);\n}<\/code><\/pre>\n<p>调用 <code>fact(3)<\/code>：<\/p>\n<p><strong>展开方向<\/strong>：<\/p>\n<ol><li>\n<code>fact(3)<\/code>：未达基准，调 <code>fact(2)<\/code>，建帧。\n<\/li><li>\n<code>fact(2)<\/code>：未达基准，调 <code>fact(1)<\/code>，建帧。\n<\/li><li>\n<code>fact(1)<\/code>：命中基准，返回 1。\n<\/ol>\n<p><strong>退回方向<\/strong>：<\/p>\n<ol><li>\n回到 <code>fact(2)<\/code>：拿到 <code>fact(1)=1<\/code>，算 <code>2 * 1 = 2<\/code>，返回 2。\n<\/li><li>\n回到 <code>fact(3)<\/code>：拿到 <code>fact(2)=2<\/code>，算 <code>3 * 2 = 6<\/code>，返回 6。\n<\/li><li>\n顶层结果 6。\n<\/ol>\n<p>帧次序核对：深入时帧依次为 <code>fact(3)<\/code>、<code>fact(2)<\/code>、<code>fact(1)<\/code>；回收反向为 <code>fact(1)<\/code>、<code>fact(2)<\/code>、<code>fact(3)<\/code>。每层形参 <code>n<\/code> 与返回值独立存放，互不覆盖。<\/p>\n<p>再看尾递归对照。若递归调用是函数末尾动作，返回前不再相乘合并：<\/p>\n<pre class=\"lang-c\"><code>long fact_tail(int n, long acc)\n{\n    if (n &lt;= 1) return acc;\n    return fact_tail(n - 1, n * acc);\n}<\/code><\/pre>\n<p>累计值通过形参 <code>acc<\/code> 带入下层，下层返回即最终值；这类形式便于实现尾帧复用。普通阶乘在退回层还要做乘法，合并动作挂在返回路径上。<\/p>\n<h2>反事实推演：去掉某一约束会怎样<\/h2>\n<p><strong>去掉原型检查<\/strong>。调用 <code>add(int,int)<\/code> 时少传一个参数，被调帧读到不确定值；参数类型不符时按错误宽度读栈。原型是编译期接口契约，去掉后错误推迟到运行期，且现象随机。<\/p>\n<p><strong>形参改动直接回写实参<\/strong>。若语言把形参当实参别名，被调函数改形参会牵动主调；C 选择按值复制，隔离两侧，代价是需要回写时必须显式传指针。<\/p>\n<p><strong>递归没有基准条件<\/strong>。每层继续调用自己，帧持续堆积，栈空间耗尽后程序崩溃；递归步必须使问题规模逐层缩小，基准条件必须可达。<\/p>\n<p><strong>调用不保存返回地址<\/strong>。被调函数执行完无法回到主调位置，执行流丢失；返回地址是帧结构的必要组成，与局部变量同属帧内容。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>改形参期待回写<\/strong>。被调函数内 <code>x = 0<\/code>，以为主调变量被清零；复盘：按值传递只改副本，要回写就传地址并解引用。<\/p>\n<p><strong>递归不缩小问题<\/strong>。递归步仍传同一规模参数，永不命中基准；复盘：检查每层参数是否向基准靠近。<\/p>\n<p><strong>层数过大栈溢出<\/strong>。递归深度等于调用链长度，每层占帧；深度不可控时改迭代，或限制最大层数。<\/p>\n<p><strong>路径漏写 return<\/strong>。非 <code>void<\/code> 函数某条执行路径无返回值，返回值不确定；复盘：核对所有分支出口都有 <code>return<\/code>。<\/p>\n<p><strong>多文件原型不一致<\/strong>。实现文件改了形参类型，声明头文件未同步；复盘：原型集中放头文件，各文件包含同一份，编译期暴露不一致。<\/p>\n<h2>原型与实参检查推演<\/h2>\n<p>原型形如 <code>int add(int, int);<\/code>，包含返回类型 <code>int<\/code>、函数名 <code>add<\/code>、两个形参类型。调用 <code>add(3, 4)<\/code> 时编译器逐项核对：<\/p>\n<ol><li>\n实参个数：两个实参对两个形参；少传或多传都报错。\n<\/li><li>\n实参类型：<code>3<\/code>、<code>4<\/code> 为 <code>int<\/code>，与形参 <code>int<\/code> 匹配；类型不符时尝试提升或给出警告。\n<\/li><li>\n返回值使用：若把 <code>add<\/code> 结果当 <code>double<\/code> 用，按返回类型 <code>int<\/code> 解释，再在使用处转换。\n<\/ol>\n<p>对照缺原型场景：编译器不知道 <code>add<\/code> 期望几个参数，按默认规则处理；少传参数时被调帧读到栈上残留值，结果随机。原型把接口约束从运行期提前到编译期，这是它存在的主要理由。<\/p>\n<p>再看形参与实参的名字关系。形参名只在被调帧内有效，与实参变量名无关；调用 <code>add(x, y)<\/code> 时，形参 <code>p<\/code>、<code>q<\/code> 分别接收 <code>x<\/code>、<code>y<\/code> 的副本。函数内改动 <code>p<\/code>、<code>q<\/code> 不回写 <code>x<\/code>、<code>y<\/code>，因为存储位置不同。<\/p>\n<h2>递归正确性的三个条件<\/h2>\n<p>递归成立要同时满足：<\/p>\n<ol><li>\n基准条件：存在不再递归、直接返回值的情形，且可被到达。\n<\/li><li>\n缩小步长：递归调用的参数使问题规模向基准方向靠近一层。\n<\/li><li>\n合并规则：退回层拿到子结果后，按定义合并出本层结果。\n<\/ol>\n<p>以阶乘为例：基准 <code>n&lt;=1<\/code> 返回 1；步长 <code>fact(n-1)<\/code> 使参数减 1；合并 <code>n * 子结果<\/code>。三条缺一不可：缺基准则深入不止；步长不缩小则卡在同一规模；合并规则错误则退回值不对。<\/p>\n<p><strong>展开与退回对照表<\/strong>（<code>fact(3)<\/code>）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>层次<\/th><th>形参 n<\/th><th>动作<\/th><th>返回值<\/th><\/tr><\/thead><tbody><tr><td>fact(3)<\/td><td>3<\/td><td>调 fact(2)<\/td><td>3 × 2 = 6<\/td><\/tr><tr><td>fact(2)<\/td><td>2<\/td><td>调 fact(1)<\/td><td>2 × 1 = 2<\/td><\/tr><tr><td>fact(1)<\/td><td>1<\/td><td>命中基准<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>深入顺序 3→2→1，退回顺序 1→2→3；每层帧独立保存自己的 <code>n<\/code> 与返回值。读递归时先写展开链，再写退回链，两链方向相反，不能混在一列里。<\/p>\n<p><strong>栈深度估算<\/strong>。递归最大层数约等于问题规模；每层帧保存形参、返回地址与局部变量。规模为 <span class=\"katex-inline\">n<\/span> 的递归，栈占用随 <span class=\"katex-inline\">n<\/span> 增长；<span class=\"katex-inline\">n<\/span> 很大时优先考虑迭代，或确认尾递归可被优化。<\/p>\n<h2>多帧调用链推演<\/h2>\n<p>设三个函数依次调用：<code>main<\/code> 调 <code>b<\/code>，<code>b<\/code> 调 <code>c<\/code>。<\/p>\n<pre class=\"lang-c\"><code>int c(int z) { return z + 1; }\nint b(int y) { return c(y) * 2; }\nint main(void) { return b(5); }<\/code><\/pre>\n<p>逐帧推演：<\/p>\n<ol><li>\n<code>main<\/code> 帧：调用 <code>b(5)<\/code>，保存返回地址，建 <code>b<\/code> 帧，形参 <code>y=5<\/code>。\n<\/li><li>\n<code>b<\/code> 帧：调 <code>c(y)<\/code>，保存返回地址，建 <code>c<\/code> 帧，形参 <code>z=5<\/code>。\n<\/li><li>\n<code>c<\/code> 帧：<code>z+1=6<\/code>，返回 6；<code>c<\/code> 帧回收。\n<\/li><li>\n回到 <code>b<\/code>：拿到 6，算 <code>6*2=12<\/code>，返回 12；<code>b<\/code> 帧回收。\n<\/li><li>\n回到 <code>main<\/code>：返回值 12，进程结束。\n<\/ol>\n<p>帧栈次序：进入时 <code>main → b → c<\/code>；回收时 <code>c → b → main<\/code>。每层只认自己帧内的形参与局部变量；<code>b<\/code> 看不到 <code>c<\/code> 的 <code>z<\/code>，<code>main<\/code> 看不到 <code>b<\/code> 的 <code>y<\/code>，要传递信息只能靠参数与返回值。<\/p>\n<p>返回地址的作用：<code>c<\/code> 执行完知道回到 <code>b<\/code> 的调用点，<code>b<\/code> 执行完知道回到 <code>main<\/code>。若返回地址被覆盖（越界写常见后果），回收后跳到非法位置，程序崩溃。这也解释了为什么栈上越界写比普通数据错误更危险。<\/p>\n<p><strong>值传递与地址传递对照<\/strong>。标量按值传递，形参是副本；数组传地址，函数经地址改原元素；要在函数内修改单个标量，传该标量地址，函数内解引用写回。三种方式的差别在传的是副本、地址还是数组首地址，帧内拿到的内容随之不同。<\/p>\n<h2>函数接口与返回路径核对<\/h2>\n<p>一个函数写好后，按接口、传递、帧、返回四层核对：<\/p>\n<ol><li>\n接口：原型写清返回类型与形参类型；调用处实参个数、类型与原型一致。\n<\/li><li>\n传递：标量按值复制，数组传首地址；需要回写单个标量时传地址。\n<\/li><li>\n帧：形参与局部变量在本帧分配，互不干扰；返回后帧回收，不可再访问帧内局部量。\n<\/li><li>\n返回：非 <code>void<\/code> 函数每条路径都有 <code>return<\/code>；返回值类型与声明一致；<code>void<\/code> 函数不带值返回。\n<\/ol>\n<p><strong>返回路径漏写的后果<\/strong>。某条分支没有 <code>return<\/code>，函数退出时返回值不确定；调用方拿到的是帧残留。核对方法：画出所有分支出口，逐个确认有返回语句。<\/p>\n<p><strong>原型不一致的后果<\/strong>。实现文件改了形参类型，头文件原型未同步；调用方按旧类型传参，被调按新类型解释，栈位置错位。多文件工程应把原型集中在头文件，各文件包含同一份，编译期暴露不一致。<\/p>\n<p><strong>递归与迭代的选择<\/strong>。问题可分解为同类子问题、基准明确、合并规则清晰，递归结构直观；规模大、栈深度受限或合并动作复杂时，迭代更省栈。尾递归把累计值经形参带入下层，便于帧复用；普通递归在退回层做合并，每层保留中间结果。<\/p>\n<p><strong>帧回收后的可用性<\/strong>。被调帧内的形参、局部变量在返回后回收；指向这些位置的指针随后悬垂。主调若保存了被调局部变量的地址，返回后解引用属于未定义行为。需要把结果带回主调，走返回值或主调提供的地址通道，不返回帧内局部量地址。<\/p>\n<h2>再推一层：栈帧与后续概念的衔接<\/h2>\n<p>指针参数的本质是把主调变量地址压进帧，被调函数经该地址写回原变量；c09 的指针算术决定地址怎样在帧与数组间移动。存储类别一章区分自动变量（帧内，调用期）、静态变量（静态区，全程）与动态分配（堆）；生命周期差别都能回到帧模型理解。<\/p>\n<p>读函数调用时按四步还原：原型约定什么接口；实参怎样复制；帧内有哪些形参与局部变量；返回值沿哪条链退回。读递归时先列展开链，再列退回链，核对每层参数与合并动作。原书第 9 章 §9.1 复习函数创建与使用，§9.2 讲 ANSI C 原型，§9.3 讲递归；示例阅读应先画帧栈，再对照递归两方向。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n函数原型在编译期检查哪三件事？缺原型会推迟到什么时候暴露问题？\n<\/li><li>\n按值传递下，被调函数改形参会不会影响实参？要回写需要传什么？\n<\/li><li>\n一帧里通常存哪几类内容？返回后哪些内容不可再访问？\n<\/li><li>\n递归展开方向与退回方向各做什么？次序是否相同？\n<\/li><li>\n递归必须满足哪两个条件才能终止？缺基准会怎样？\n<\/li><li>\n尾递归与普通递归在退回层的合并动作有何差别？\n<\/ol>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n画出 <code>main<\/code> 调用 <code>double_it(int x)<\/code> 时两帧的布局，标出形参、返回地址、局部变量。\n<\/li><li>\n写一个求两数最大值的函数，补出原型；说明编译期怎样核对实参个数与类型。\n<\/li><li>\n推演 <code>fact(4)<\/code> 的展开链与退回链，写出每层返回值。\n<\/li><li>\n为什么递归层数受栈大小限制？深度过大时改造方向是什么？\n<\/li><li>\n形参与全局同名变量时，函数内访问的是哪一个？遮蔽规则怎样起作用？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "函数原型、栈帧结构与递归执行"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.641<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">函数原型、栈帧结构与递归执行<\/a><\/span><\/div><h1>指针、数组与指针算术<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（原书第 10 章 §10.3、§10.5，PDF 第 641 页起）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>指针是存放内存地址的变量；数组名在多数表达式中退化为首元素地址；指针加减按指向元素的大小缩放，两指针差值以元素个数为单位；<code>&amp;<\/code> 取地址，一元 <code>*<\/code> 间接访问指针指向的对象。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>函数要在调用外修改主调变量，多个数据要按位置共享，遍历要在成组元素间移动；直接传值无法把地址交出，逐个复制数组代价过高。指针提供间接访问通道：存地址、按地址读写、在元素间步进。困难在于地址计算的单位容易被当成字节，数组名与指针的差别容易被忽略，越界访问难以在编译期发现。本章把地址公式、缩放规则与边界判断讲清，是理解字符串处理、数组参数与后续动态内存的基础。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>指针变量<\/strong>：存放内存地址的变量，声明形如 <code>int *p;<\/code>，<code>p<\/code> 是指向 <code>int<\/code> 的指针；未初始化的指针值不确定，不能解引用。<\/p>\n<p><strong><code>&amp;<\/code> 运算符<\/strong>：取对象地址，<code>&amp;x<\/code> 得到变量 <code>x<\/code> 所在地址。 **一元 <code>*<\/code> 运算符**：间接访问，<code>*p<\/code> 表示 <code>p<\/code> 指向位置上的对象。<\/p>\n<p><strong>数组退化<\/strong>。数组名在多数表达式中转换为指向首元素的指针；例外是 <code>sizeof(数组名)<\/code>、取地址 <code>&amp;数组名<\/code> 等少数场景。退化后得到的是右值地址，不能给数组名赋值。<\/p>\n<p><strong>指针算术<\/strong>：<\/p>\n<ul><li>\n<code>p + i<\/code>：地址前进 <span class=\"katex-inline\">i<\/span> 个元素，字节增量为 <span class=\"katex-inline\">i \\times sizeof(*p)<\/span>。\n<\/li><li>\n<code>p - i<\/code>：后退 <span class=\"katex-inline\">i<\/span> 个元素。\n<\/li><li>\n<code>p2 - p1<\/code>：两指针间元素个数，等于字节差除以元素大小。\n<\/li><li>\n同类型指针才能相减；跨类型指针运算无定义。\n<\/ul>\n<p><strong>地址公式<\/strong>。数组首地址 <span class=\"katex-inline\">base<\/span>，元素类型宽度 <span class=\"katex-inline\">w<\/span>，元素 <code>a[i]<\/code> 地址为 <span class=\"katex-inline\">base + i \\times w<\/span>。<\/p>\n<p><strong><code>const<\/code> 与指针<\/strong>：<code>const int <em>p<\/code> 表示不能经 <code>p<\/code> 改所指值；<code>int <\/em> const p<\/code> 表示指针本身不可改指向；位置不同约束对象不同。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-c\"><code>int a[5] = {10, 20, 30, 40, 50};\nint *p = a;\nint third = *(p + 2);   /* 等于 a[2]，值 30 */<\/code><\/pre>\n<p><strong>反例<\/strong>：对未初始化指针解引用；把指针差当字节差；访问下标 <span class=\"katex-inline\">5<\/span> 及以上的 <code>a<\/code> 元素；给数组名赋新地址。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>地址缩放推导<\/strong>。设元素类型宽度 <span class=\"katex-inline\">w<\/span>，<code>p<\/code> 指向某元素。<code>p+1<\/code> 必须指向下一个同类型元素，因此字节地址增加 <span class=\"katex-inline\">w<\/span>；<code>p+i<\/code> 增加 <span class=\"katex-inline\">i \\times w<\/span>。若按字节加 1，跨类型访问会落在元素中间，位模式被错误拆开。<\/p>\n<p><strong>指针差推导<\/strong>。<code>p2<\/code> 与 <code>p1<\/code> 指向同一数组，字节差为 <span class=\"katex-inline\">(base+i_2 w)-(base+i_1 w)=(i_2-i_1)w<\/span>；除以 <span class=\"katex-inline\">w<\/span> 得元素个数 <span class=\"katex-inline\">i_2-i_1<\/span>。标准规定差值类型为 <code>ptrdiff_t<\/code>，单位是元素，不是字节。<\/p>\n<p><strong>数组表示与指针表示等价<\/strong>。<code>a[i]<\/code> 按定义等价于 <code>*(a + i)<\/code>：先退化为首元素地址，加 <span class=\"katex-inline\">i<\/span> 个元素，再间接访问。下标写法与指针写法指向同一对象，编译后地址计算一致。<\/p>\n<p><strong>边界判断推导<\/strong>。数组声明 <span class=\"katex-inline\">n<\/span> 个元素，合法下标为 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">n-1<\/span>；对应地址区间 <span class=\"katex-inline\">[base, base+n w)<\/span>。下标越界时地址仍可能算得出，但位置不属于数组，访问结果未定义。地址可计算不等于访问合法。<\/p>\n<p><strong>指针与函数参数<\/strong>。数组作形参退化为指针；函数内改 <code>arr[i]<\/code> 即改原数组元素。要保护数据不被修改，形参加 <code>const<\/code> 限定。<\/p>\n<p><strong>指针初始化与有效性<\/strong>。指针声明后必须指向合法对象才能解引用：可以用 <code>&amp;<\/code> 取已有变量地址，或用内存分配得到堆地址。未初始化的指针值不确定，称为野指针；指向的对象已回收后仍使用，称为悬垂指针。两者解引用都是未定义行为。<\/p>\n<p><strong>多级指针与地址层次<\/strong>。<code>int **pp<\/code> 存放指向 <code>int <em><\/code> 的地址；<code><\/em>pp<\/code> 得到内层指针，<code>**pp<\/code> 得到最终整数。多级指针的每一层都遵守同一套取址与解引用规则，只是多经过一层间接。<\/p>\n<p><strong>指针与数组表示的等价边界<\/strong>。<code>a[i]<\/code> 等价 <code>*(a+i)<\/code>，下标与指针写法互通；但数组名不是指针变量，不能被赋值，也不能在退化后保留原数组宽度。等价只在表达式求值层面成立，存储安排上数组仍是整块对象。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：遍历数组、向函数传递数组、间接修改主调变量、在缓冲区间移动位置。\n<\/li><li>\n边界一：指针使用前必须指向合法对象；野指针、悬垂指针解引用属于未定义行为。\n<\/li><li>\n边界二：指针算术只在同一数组内有意义；指向不同数组的指针相减无定义。\n<\/li><li>\n失败案例：循环按下标走到 <span class=\"katex-inline\">n<\/span> 仍访问元素，越过末元素；复盘：合法区间 <span class=\"katex-inline\">[0,n)<\/span>，末后指针可算不可解引用。\n<\/li><li>\n边界三：<code>void *<\/code> 是通用地址类型，不能直接做算术，需要先转成具体字符或元素指针。\n<\/li><li>\n边界四：指针与整数比较、跨类型转换受严格限制；<code>int <em><\/code> 与 <code>double <\/em><\/code> 不能直接相减或互换赋值。\n<\/ul>\n<p><strong>指针使用的核对顺序<\/strong>。先确认指针指向哪个合法对象；再核对加减步长乘的元素宽度；然后看差值单位是元素还是字节；末尾检查下标是否落在 <span class=\"katex-inline\">[0,n)<\/span>。四步对应有效性、算术、单位、边界四个层面，缺一步都可能出现错位或越界。<\/p>\n<p><strong>指针与数组的常见用途<\/strong>。向函数传数组避免整块复制；在被调函数内经地址修改主调数据；遍历成组元素时移动位置；配合字符串函数处理字符序列。指针本身存的是地址，不持有对象内容；对象仍在数组、变量或堆上，指针只提供访问通道。<\/p>\n<p><strong>类型安全约束<\/strong>。指针类型决定解引用时的解释宽度；把 <code>char <em><\/code> 当 <code>int <\/em><\/code> 解引用属于违规访问。<code>void *<\/code> 可通用存地址，但做算术前必须转成具体元素类型。多级指针逐层取址解引用，每一层类型都要明确。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>数组名 vs 指针变量<\/strong>：数组名是数组对象标识，退化为首地址右值，不可赋值；指针变量可重新指向别处。<code>sizeof<\/code> 两者结果不同。\n<\/li><li>\n<strong>字节差 vs 元素差<\/strong>：指针减法返回元素个数；要字节差需先转 <code>char *<\/code> 再相减。\n<\/li><li>\n**<code>&amp;<\/code> 取地址 vs <code>*<\/code> 解引用**：方向相反，<code>&amp;x<\/code> 由对象得地址，<code>*p<\/code> 由地址得对象。\n<\/li><li>\n<strong>指针常量 vs 常量指针<\/strong>：<code>int <em>const p<\/code> 锁指向，<code>const int <\/em>p<\/code> 锁所指值；写在 <code>*<\/code> 两侧约束不同对象。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 的类型宽度是缩放步长的依据；c08 的帧模型说明指针参数怎样传入被调帧。后继：第 11 章字符串遍历以字符指针步进为骨架；第 12 章动态内存分配在堆上返回指针；第 13 章文件指针复用同一间接访问模型。本章地址公式是后续一切内存操作的计算基础。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（指针、数组与指针算术）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：指针依赖链、地址计算推演与越界边界复盘<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把指针与数组用对，往回追四层：<\/p>\n<ol><li>\n对象层：变量与数组在内存占确定宽度的存储区；类型宽度来自 c02。\n<\/li><li>\n地址层：<code>&amp;<\/code> 取得对象地址，指针变量存放该地址；解引用 <code>*<\/code> 按地址读写对象。\n<\/li><li>\n算术层：指针加减按元素宽度缩放；差值以元素个数为单位；同数组内运算才有定义。\n<\/li><li>\n边界层：合法下标区间 <span class=\"katex-inline\">[0,n)<\/span>，越界地址可算但访问未定义；退化规则决定数组名何时变成首地址。\n<\/ol>\n<p>依赖链方向：对象有宽度 → 地址可存放 → 算术按元素步进 → 边界约束访问。抽掉缩放规则，步长按字节计算会错位；抽掉边界层，越界访问被误当成合法元素。<\/p>\n<p>再追一层为什么指针算术按元素缩放：同一类型元素等宽排列，<code>p+1<\/code> 的语义是&quot;下一个同类型元素&quot;，编译器必须用元素宽度乘步长。若按字节步进，<code>int *<\/code> 加 1 只移动 1 字节，落在元素内部，解引用得到跨字节的错误位模式。这条规则把类型信息带进了地址计算。<\/p>\n<h2>正向推导：地址公式与等价关系<\/h2>\n<p><strong>基本公式<\/strong>。设数组首地址 <span class=\"katex-inline\">base<\/span>，元素类型宽度 <span class=\"katex-inline\">w<\/span>：<\/p>\n<ol><li>\n<code>a[0]<\/code> 地址 <span class=\"katex-inline\">base<\/span>。\n<\/li><li>\n<code>a[i]<\/code> 地址 <span class=\"katex-inline\">base + i \\times w<\/span>。\n<\/li><li>\n指针 <code>p=a<\/code>，<code>p+i<\/code> 与 <code>&amp;a[i]<\/code> 同一地址。\n<\/ol>\n<p><strong>等价关系<\/strong>。<code>a[i]<\/code> 等价于 <code>*(a+i)<\/code>：数组名退化为首元素地址，加 <span class=\"katex-inline\">i<\/span> 个元素后间接访问。下标写法、指针写法在编译后指向同一对象；<code>&amp;a[i]<\/code> 与 <code>p+i<\/code> 同义。<\/p>\n<p><strong>差值公式<\/strong>。<code>p2=&amp;a[i2]<\/code>，<code>p1=&amp;a[i1]<\/code>：<\/p>\n<ol><li>\n字节差 <span class=\"katex-inline\">=(base+i_2 w)-(base+i_1 w)=(i_2-i_1)w<\/span>。\n<\/li><li>\n指针差 <span class=\"katex-inline\">=(i_2-i_1)w/w=i_2-i_1<\/span>，单位元素个数。\n<\/li><li>\n差值类型 <code>ptrdiff_t<\/code>；要字节差，先把两指针转成 <code>char *<\/code> 再相减。\n<\/ol>\n<p><strong>退化例外<\/strong>。多数表达式中数组名退化为首元素指针；<code>sizeof(a)<\/code> 仍得数组总宽度，<code>&amp;a<\/code> 得到整数组地址（类型为数组指针）。判断退化场景时先确认表达式上下文。<\/p>\n<p><strong>函数参数中的退化<\/strong>。形参 <code>int arr[]<\/code> 被当作 <code>int *arr<\/code>；函数内 <code>sizeof(arr)<\/code> 是指针宽度，不是原数组大小。要在函数内知道容量，需另传长度参数。<\/p>\n<h2>算例一：int 数组地址与下标推演<\/h2>\n<p>声明 <code>int a[5];<\/code>，平台 <code>sizeof(int)=4<\/code>，首地址记为 <code>0x1000<\/code>。<\/p>\n<ol><li>\n<code>a[0]<\/code> 地址：<span class=\"katex-inline\">0x1000+0\\times4=0x1000<\/span>。\n<\/li><li>\n<code>a[1]<\/code>：<span class=\"katex-inline\">0x1000+4=0x1004<\/span>。\n<\/li><li>\n<code>a[3]<\/code>：<span class=\"katex-inline\">0x1000+12=0x100C<\/span>。\n<\/li><li>\n`&amp;a[3]-&amp;a[0]=(0x100C-0x1000)/4=3$，元素差 3，字节差 12。\n<\/li><li>\n合法下标 <span class=\"katex-inline\">0,1,2,3,4<\/span>；<code>a[5]<\/code> 地址 <span class=\"katex-inline\">0x1014<\/span>，落在数组区间 <span class=\"katex-inline\">[0x1000,0x1014)<\/span> 之外。\n<\/ol>\n<p>赋值与访问核对：<\/p>\n<pre class=\"lang-c\"><code>int a[5] = {10, 20, 30, 40, 50};\nint *p = a;<\/code><\/pre>\n<ul><li>\n<code>*(p+2)<\/code>：<code>p<\/code> 加 2 个元素到 <code>&amp;a[2]<\/code>，解引用得 30，与 <code>a[2]<\/code> 相同。\n<\/li><li>\n<code>p[4]<\/code>：下标形式等价于 <code>*(p+4)<\/code>，得 50。\n<\/li><li>\n<code>p++<\/code>：指针前进一个 <code>int<\/code>，地址加 4；再解引用得到下一元素。\n<\/ul>\n<p>边界核对：<code>a[5]<\/code> 地址能算出 <code>0x1014<\/code>，但该位置不属于数组；即使读出某个值，结果也未定义。末后指针 <code>a+5<\/code> 可以参与比较（如循环终点），不能解引用。<\/p>\n<h2>算例二：字符数组与跨类型对照<\/h2>\n<p>声明 <code>char code[12];<\/code>，元素宽度 1，首地址 <code>0x2000<\/code>。<\/p>\n<ol><li>\n<code>code[0]<\/code> 地址 <code>0x2000<\/code>，<code>code[7]<\/code> 地址 <code>0x2007<\/code>。\n<\/li><li>\n`&amp;code[7]-&amp;code[2]=5<span class=\"katex-inline\">，元素差 5；字节差同样 5，因为 <\/span>w=1$。\n<\/li><li>\n字符串遍历：<code>for (char <em>q=code; <\/em>q != &#x27;\\0&#x27;; q++) putchar(*q);<\/code>，每轮检查当前字符，非 null 输出，指针前进 1 字节。\n<\/ol>\n<p>跨类型对照：同一地址区间，<code>int <em><\/code> 步长 4，<code>char <\/em><\/code> 步长 1。把 <code>int <em><\/code> 转成 <code>char <\/em><\/code> 后逐字节访问，可以看到一个整数的四个字节；反过来，把 <code>char <em><\/code> 当 <code>int <\/em><\/code> 解引用属于类型违规，位模式跨字节拆读。<\/p>\n<p>再看指针差的单位。<code>double v[8];<\/code>，<code>sizeof(double)=8<\/code>：<\/p>\n<ol><li>\n`&amp;v[6]-&amp;v[1]=5$，元素差 5。\n<\/li><li>\n字节差 <span class=\"katex-inline\">=5\\times8=40<\/span>。\n<\/li><li>\n写成 <code>(char<em>)&amp;v[6]-(char<\/em>)&amp;v[1]<\/code> 才得到 40；直接指针差仍是 5。\n<\/ol>\n<p>核对要点：差值单位跟随指针类型；换类型先转换，再决定求差方式。<\/p>\n<h2>反事实推演：改变缩放规则会怎样<\/h2>\n<p><strong>按字节做指针算术<\/strong>。<code>int *p<\/code> 加 1 移动 1 字节，下一元素在 4 字节外，中间位置被当成新元素；解引用跨两到三个整数，读出错误组合。反例后果：遍历整数数组时每个元素都错位，结果全乱。<\/p>\n<p><strong>数组名当成可赋值指针变量<\/strong>。若允许 <code>a = a + 1<\/code>，数组对象的起始位置被改写，与数组固定存储安排冲突；C 让数组名退化为右值地址，不可赋值，正是保留数组对象的固定性。<\/p>\n<p><strong>取消越界约束<\/strong>。假设任意地址访问都合法，程序可以读到其他变量、返回地址所在内存；越界写覆盖这些位置，轻则数据错乱，重则控制流被破坏。标准把越界访问定为未定义行为，编译器不保证可诊断。<\/p>\n<p><strong>指针差返回字节差<\/strong>。若减法直接给字节数，不同类型元素要再除宽度；C 选择元素单位，使 <code>p2-p1<\/code> 直接回答&quot;隔几个元素&quot;。<\/p>\n<h2>指针有效性与生命周期对照<\/h2>\n<p>指针合法的前提是指向一个仍存在的对象。按对象生命周期分三类：<\/p>\n<ol><li>\n局部自动变量：对象在帧内，帧回收后变量消失；保存其地址的指针随后悬垂，不能再解引用。\n<\/li><li>\n静态变量：对象在静态区，全程存在；取其地址在函数返回后仍可用。\n<\/li><li>\n动态分配对象：在堆上，由分配函数返回指针，<code>free<\/code> 归还后指针悬垂。\n<\/ol>\n<p>对照错误场景：函数内定义局部数组，把数组地址返回给主调；函数返回后帧回收，该地址指向已回收区域，主调解引用得到未定义结果。修正方式：数据在主调侧分配，把地址传入函数；或使用静态/堆对象。<\/p>\n<p>野指针与悬垂指针的差别：野指针从未指向合法对象，值是随机残留；悬垂指针曾经合法，但所指对象已回收。两者都不能解引用，排查方向分别是初始化缺失与生命周期越界。<\/p>\n<h2>数组参数传递推演<\/h2>\n<p>定义：<\/p>\n<pre class=\"lang-c\"><code>int sum_arr(int arr[], int n)\n{\n    int s = 0, k;\n    for (k = 0; k &lt; n; k++)\n        s += arr[k];\n    return s;\n}<\/code><\/pre>\n<p>调用：<\/p>\n<pre class=\"lang-c\"><code>int vals[5] = {3, 7, 2, 9, 4};\nint total = sum_arr(vals, 5);<\/code><\/pre>\n<ol><li>\n实参 <code>vals<\/code> 退化为指向首元素的指针，传入函数的是地址，不是整块数组副本。\n<\/li><li>\n形参 <code>arr<\/code> 按 <code>int <em>arr<\/code> 处理；<code>arr[k]<\/code> 等价 <code><\/em>(arr+k)<\/code>，访问原数组元素。\n<\/li><li>\n函数内修改 <code>arr[k]<\/code> 会改到 <code>vals[k]<\/code>；这与按值传递标量不同，传递的是地址副本，指向同一对象。\n<\/li><li>\n函数内 <code>sizeof(arr)<\/code> 是指针宽度，不是 5 个 <code>int<\/code> 的大小；元素个数必须由第二个参数 <code>n<\/code> 传入。\n<\/ol>\n<p>再看 <code>const<\/code> 保护：形参写成 <code>const int arr[]<\/code>，函数体内不能经 <code>arr<\/code> 改元素；编译器对写操作报错。这一约束在编译期生效，不改变传递方式，只限制修改权限。<\/p>\n<p>字符串参数是同一模型的特例：<code>char *s<\/code> 指向字符数组，遍历按 1 字节步长；<code>strlen<\/code>、<code>strcpy<\/code> 都通过首地址访问原数组。理解数组参数退化，就理解了标准库字符串函数为什么只传一个地址。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>野指针解引用<\/strong>。<code>int <em>p; <\/em>p=3;<\/code> 中 <code>p<\/code> 未初始化，值不确定；复盘：指针必须先指向合法对象（取地址或分配内存）再解引用。<\/p>\n<p><strong>指针差当字节差<\/strong>。把 <code>&amp;a[3]-&amp;a[0]<\/code> 当成 12 字节，实际是 3 个元素；复盘：求字节差先转 <code>char *<\/code>。<\/p>\n<p><strong>形参 sizeof 推算容量<\/strong>。函数内对数组形参求 <code>sizeof<\/code> 得到指针宽度，据此判断元素个数；复盘：容量另传参数，不依赖形参退化后的宽度。<\/p>\n<p><strong>跨数组指针相减<\/strong>。两个不同数组的指针相减，位置关系无定义；复盘：指针算术只在同一数组区间内进行。<\/p>\n<p><strong>越界下标访问<\/strong>。循环条件 <code>i &lt;= n<\/code> 访问到 <code>a[n]<\/code>；复盘：下标区间 <span class=\"katex-inline\">[0,n)<\/span>，终点指针可比较不可解引用。<\/p>\n<h2>指针运算综合算例<\/h2>\n<p><strong>算例：遍历并查找最大值<\/strong>。<\/p>\n<pre class=\"lang-c\"><code>int arr[6] = {4, 1, 9, 3, 7, 2};\nint *p, max = arr[0];\nfor (p = arr + 1; p &lt; arr + 6; p++)\n{\n    if (*p &gt; max)\n        max = *p;\n}<\/code><\/pre>\n<ol><li>\n初值 <code>p=arr+1<\/code>，指向 <code>arr[1]<\/code>；终点 <code>arr+6<\/code> 是末后指针，只比较不解引用。\n<\/li><li>\n每轮比较 <code>*p<\/code> 与 <code>max<\/code>，更新最大值；<code>p++<\/code> 前进一个 <code>int<\/code>，地址加 <code>sizeof(int)<\/code>。\n<\/li><li>\n退出时 <code>max=9<\/code>。指针差 <code>p-arr<\/code> 在循环中从 1 走到 6，元素个数与下标一致。\n<\/li><li>\n边界核对：<code>arr+6<\/code> 可作为终点比较；<code>*(arr+6)<\/code> 越界，不能写。\n<\/ol>\n<p><strong>算例：两指针区间复制<\/strong>。<\/p>\n<pre class=\"lang-c\"><code>int src[4] = {1, 2, 3, 4};\nint dst[4];\nint *q = dst;\nfor (p = src; p &lt; src + 4; p++, q++)\n    *q = *p;<\/code><\/pre>\n<ol><li>\n<code>p<\/code> 扫源数组，<code>q<\/code> 扫目标数组，各按 <code>int<\/code> 宽度步进。\n<\/li><li>\n每轮解引用 <code><em>p<\/code> 读出，写入 <code><\/em>q<\/code>。\n<\/li><li>\n两数组等长，区间都是 <span class=\"katex-inline\">[0,4)<\/span>；不等长时必须以较短者为界。\n<\/li><li>\n字节视角核对：若 <code>sizeof(int)=4<\/code>，一轮步进 4 字节；4 轮共移动 16 字节，覆盖 4 个元素。\n<\/ol>\n<p><strong>算例：字符指针与整数字节对照<\/strong>。把 <code>int x=0x12345678<\/code> 的地址转成 <code>char *<\/code> 逐字节看：<\/p>\n<pre class=\"lang-c\"><code>int x = 0x12345678;\nchar *cp = (char *)&amp;x;\nint k;\nfor (k = 0; k &lt; (int)sizeof(x); k++)\n    /* 观察 cp[k] */;<\/code><\/pre>\n<ol><li>\n<code>&amp;x<\/code> 是 <code>int <em><\/code>，转 <code>char <\/em><\/code> 后按 1 字节步长访问。\n<\/li><li>\n各字节顺序由平台字节序决定，这里只观察不跨类型解引用。\n<\/li><li>\n对比：<code>int <em><\/code> 加 1 跳一个元素，<code>char <\/em><\/code> 加 1 跳一个字节；两种步长服务不同访问目的。\n<\/ol>\n<h2>指针有效性与边界核对清单<\/h2>\n<p>读一段指针代码，按清单逐项核对：<\/p>\n<ol><li>\n指向对象：指针是否用 <code>&amp;<\/code> 或分配结果初始化；是否存在野指针。\n<\/li><li>\n生命周期：所指对象在指针使用期间是否仍存在；函数返回后局部对象地址不可再用。\n<\/li><li>\n算术范围：加减是否落在同一数组区间内；跨数组相减无定义。\n<\/li><li>\n差值单位：直接相减得元素个数；需要字节差先转 <code>char *<\/code>。\n<\/li><li>\n解引用边界：下标在 <span class=\"katex-inline\">[0,n)<\/span> 内；末后指针只比较，不解引用。\n<\/li><li>\n类型匹配：解引用宽度与指针类型一致；<code>void *<\/code> 先转具体类型再算术。\n<\/ol>\n<p><strong>地址计算复核<\/strong>。设首地址 <span class=\"katex-inline\">base<\/span>、元素宽 <span class=\"katex-inline\">w<\/span>，<code>a[i]<\/code> 地址 <span class=\"katex-inline\">base+i w<\/span>；<code>p+i<\/code> 与 <code>&amp;a[i]<\/code> 同址；<code>p2-p1=(i2-i1)<\/code>。复核时先写 <span class=\"katex-inline\">w<\/span>，再算字节增量，再核对元素差，避免把字节差当元素差。<\/p>\n<p><strong>数组形参复核<\/strong>。形参退化为指针，函数内 <code>sizeof<\/code> 只得指针宽度；元素个数必须另传。修改 <code>arr[k]<\/code> 改的是原数组元素；加 <code>const<\/code> 限制函数内修改权限。字符串参数是同一模型，步长 1，停止靠 null。<\/p>\n<p><strong>指针与下标互通的边界<\/strong>。<code>a[i]<\/code> 与 <code>*(a+i)<\/code> 等价，下标写法可换成指针写法；但数组名是对象标识，不是可赋值指针变量，<code>a = a + 1<\/code> 不成立。等价只在求值层面，存储安排上数组仍是整块连续对象，这一边界决定了数组名不能被改写指向。<\/p>\n<h2>再推一层：指针规则的延伸应用<\/h2>\n<p>字符串函数以 <code>char <em><\/code> 为入口：<code>strlen<\/code> 从首指针扫到 null，<code>strcpy<\/code> 逐字符复制并补 null；步长 1 是本章规则在字符类型上的特例。动态内存分配返回堆区指针，用完由 <code>free<\/code> 归还；指针指向堆块期间同样按元素宽度算术。文件指针 <code>FILE <\/em><\/code> 是另一层间接访问，内部结构对使用者隐藏，接口方式与本章指针模型一致。<\/p>\n<p>读指针代码按四步核对：指针指向哪个合法对象；加减步长乘的是哪种元素宽度；差值单位是元素还是字节；访问下标是否落在 <span class=\"katex-inline\">[0,n)<\/span>。四步写得出，地址计算与边界判断就有依据。原书第 10 章 §10.3 讲指针和数组，§10.5 讲指针操作；示例阅读应先画首地址与元素宽度表，再核对每个下标对应的地址。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n<code>&amp;<\/code> 与一元 <code>*<\/code> 各是什么方向的运算？给出一组对照表达式。\n<\/li><li>\n<code>p+i<\/code> 的字节增量怎样计算？为什么步长要乘元素宽度？\n<\/li><li>\n指针减法结果的单位是什么类型？要字节差怎么转换？\n<\/li><li>\n数组名在什么场合退化为首元素指针？<code>sizeof<\/code> 与 <code>&amp;<\/code> 场景有何例外？\n<\/li><li>\n合法下标区间是什么？末后指针为什么可以比较却不能解引用？\n<\/li><li>\n<code>const int <em>p<\/code> 与 <code>int <\/em>const p<\/code> 各约束哪个对象？\n<\/ol>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n<code>int v[8];<\/code> 中 <code>&amp;v[6]-&amp;v[1]<\/code> 等于多少？若元素为 <code>double<\/code>（8 字节），字节差是多少？\n<\/li><li>\n写出 <code>a[i]<\/code> 与 <code>*(a+i)<\/code> 的等价推导，说明退化发生在哪一步。\n<\/li><li>\n函数形参 <code>char s[30]<\/code> 内 <code>sizeof(s)<\/code> 是多少？为什么不等于 30？要知道容量应补什么参数？\n<\/li><li>\n为什么不能把不同数组的指针相减？无定义后果可能怎样表现？\n<\/li><li>\n用字符指针写一个遍历字符串到 null 的循环，标出每轮的检查动作与步进动作。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "指针、数组与指针算术"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：程序骨架与数据：编译链接流程、最小程序结构、基本类型与取值范围<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1–3 章：初识 C 语言、程序结构与数据类型<\/a><br>检查点：能画出从源文件到可执行文件的四阶段产物，说出 main 在程序中的位置；按位宽推导 signed 与 unsigned 整数的上下界，区分变量与常量<\/li><li class='path-step' id='path-02'><strong>步骤 02：字符串与表达式：字符数组与 null 终止、格式串解析、运算符优先级与类型转换<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 4–5 章：字符串与格式化输入/输出、运算符与表达式<\/a><br>检查点：能手算一个字符数组的 strlen 与内存布局，按格式串逐个匹配 printf/scanf 参数；写出含乘除模与自增的表达式求值顺序，判断整数除法与隐式转换结果<\/li><li class='path-step' id='path-03'><strong>步骤 03：控制流与字符 I/O：循环不变式、分支跳转、短路求值、缓冲区与输入验证<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 6–8 章：循环、分支跳转、字符输入/输出与输入验证<\/a><br>检查点：能为一段循环写出不变式与退出条件；解释 else 与 if 的配对规则、逻辑运算符的短路顺序、switch 的 break 落点；说明缓冲输入与文件结尾判定的依据<\/li><li class='path-step' id='path-04'><strong>步骤 04：函数、数组与指针：原型检查、栈帧推演、递归展开、指针算术与边界<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 9–10 章：函数、数组与指针<\/a><br>检查点：能沿调用栈画出参数、返回地址与局部变量的位置，推演一次递归调用的展开与回收；给定数组首地址与元素类型，计算任意下标元素地址与两指针差值，标出越界访问<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='目标代码文件'>目标代码文件 — 源文件经编译产生的机器码文件，尚不能直接运行，需要链接器与库及其他目标文件合并。 <span class=glossary-ref>（第 1–3 章：初识 C 语言、程序结构与数据类型）<\/span><\/li><li data-term='可执行文件'>可执行文件 — 链接阶段把目标代码与库代码按符号地址绑定后生成、可被操作系统加载运行的文件。 <span class=glossary-ref>（第 1–3 章：初识 C 语言、程序结构与数据类型）<\/span><\/li><li data-term='类型宽度（位宽）'>类型宽度（位宽） — 某类型在内存中占据的二进制位数；位宽决定取值上下界，同一类型在不同平台宽度可能不同。 <span class=glossary-ref>（第 1–3 章：初识 C 语言、程序结构与数据类型）<\/span><\/li><li data-term='null 字符（&#x27;\\0&#x27;）'>null 字符（&#x27;\\0&#x27;） — 值为 0 的字符，作为字符串结束标志；字符数组末尾必须有它，字符串函数才知道何时停止。 <span class=glossary-ref>（第 4–5 章：字符串与格式化输入/输出、运算符与表达式）<\/span><\/li><li data-term='转换说明'>转换说明 — printf/scanf 格式串中以 % 开头的片段，规定对应参数的类型、宽度与精度。 <span class=glossary-ref>（第 4–5 章：字符串与格式化输入/输出、运算符与表达式）<\/span><\/li><li data-term='运算符优先级'>运算符优先级 — 决定表达式中各运算符先后结合次序的规则表；同级再按结合性决定从左或从右分组。 <span class=glossary-ref>（第 4–5 章：字符串与格式化输入/输出、运算符与表达式）<\/span><\/li><li data-term='隐式类型转换'>隐式类型转换 — 混合类型表达式中，编译器按规则把较窄类型提升为较宽类型后再运算，不需要显式书写转换。 <span class=glossary-ref>（第 4–5 章：字符串与格式化输入/输出、运算符与表达式）<\/span><\/li><li data-term='循环不变式'>循环不变式 — 每次循环开始前都成立的断言；用它可以验证循环做对了什么、退出时得到什么结果。 <span class=glossary-ref>（第 6–8 章：循环、分支跳转、字符输入/输出与输入验证）<\/span><\/li><li data-term='短路求值'>短路求值 — 逻辑与、逻辑或在已能确定结果时不再计算右侧操作数的求值方式，右侧表达式可能不执行。 <span class=glossary-ref>（第 6–8 章：循环、分支跳转、字符输入/输出与输入验证）<\/span><\/li><li data-term='缓冲区'>缓冲区 — 在设备与程序之间暂存输入输出字符的内存区域；缓冲输入下，字符敲入换行后才交给程序读取。 <span class=glossary-ref>（第 6–8 章：循环、分支跳转、字符输入/输出与输入验证）<\/span><\/li><li data-term='函数原型'>函数原型 — 在调用前声明函数名、返回类型与各形参类型的语句；编译器据此检查参数个数与类型是否匹配。 <span class=glossary-ref>（第 9–10 章：函数、数组与指针）<\/span><\/li><li data-term='栈帧'>栈帧 — 一次函数调用在栈上分配的一块区域，存放形参、返回地址与局部变量；调用返回后该帧被回收。 <span class=glossary-ref>（第 9–10 章：函数、数组与指针）<\/span><\/li><li data-term='指针算术'>指针算术 — 对指针做加减、求差等运算时，步长按指向元素的大小缩放；差值以元素个数为单位。 <span class=glossary-ref>（第 9–10 章：函数、数组与指针）<\/span><\/li><li data-term='数组越界'>数组越界 — 访问下标落在数组声明范围之外的元素；地址计算合法不代表访问合法，越界结果未定义。 <span class=glossary-ref>（第 9–10 章：函数、数组与指针）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>C Primer Plus（第 6 版）模式库<\/h1>\n<h2>模式 1：最小可编译程序骨架<\/h2>\n<ul><li>\n<strong>触发<\/strong>：开始写一个新 C 程序，或排查&quot;找不到入口&quot;类构建问题。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n写 <code>#include &lt;stdio.h&gt;<\/code> 引入标准 I/O 原型。\n<\/li><li>\n定义 <code>int main(void)<\/code>，函数体内放声明与语句。\n<\/li><li>\n末尾 <code>return 0;<\/code> 交回退出状态。\n<\/li><li>\n先编译确认目标代码生成，再链接确认映像完整。\n<\/li><li>\n<strong>落点<\/strong>：程序入口明确，构建四阶段产物可逐段核对。\n<\/li><li>\n<strong>边界<\/strong>：<code>void main()<\/code> 不是标准形式；头文件只给声明，库机器码在链接阶段并入。\n<\/ol>\n<\/ul>\n<h2>模式 2：字符串容量与遍历核对<\/h2>\n<ul><li>\n<strong>触发<\/strong>：声明字符数组、写入字符串、调用 <code>strlen<\/code> 或字符串库函数之前。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n按&quot;字符数 + 1&quot;预留数组位置，1 字节留给 <code>&#x27;\\0&#x27;<\/code>。\n<\/li><li>\n写入结束确认末尾补 null。\n<\/li><li>\n读取前确认数组已被合法字符串初始化。\n<\/li><li>\n区分 <code>strlen<\/code>（运行期字符个数）与 <code>sizeof<\/code>（编译期声明宽度）。\n<\/li><li>\n<strong>落点<\/strong>：字符串遍历有停止依据，不会读到相邻内存。\n<\/li><li>\n<strong>边界<\/strong>：不带 null 的字符数组只能按字节访问；<code>%s<\/code> 不检查目标宽度，必须用 <code>%Ns<\/code> 限制。\n<\/ol>\n<\/ul>\n<h2>模式 3：表达式分组与类型检查<\/h2>\n<ul><li>\n<strong>触发<\/strong>：一条语句含多个运算符，或混合整数与浮点运算。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n按优先级圈出高优先级子表达式，同级按结合性分组。\n<\/li><li>\n列出每个叶子的类型，确认提升方向（窄 → 宽）。\n<\/li><li>\n先算分组内值，再沿分组树向上合并。\n<\/li><li>\n赋值时核对收窄是否超范围；有副作用的语句拆成独立行。\n<\/li><li>\n<strong>落点<\/strong>：结果次序与类型明确，避免先加后乘、整数除法误判。\n<\/li><li>\n<strong>边界<\/strong>：优先级不定操作数求值顺序；<code>&amp;&amp;<\/code>、<code>||<\/code>、<code>?:<\/code>、逗号才有次序保证。\n<\/ol>\n<\/ul>\n<h2>模式 4：循环不变式核对<\/h2>\n<ul><li>\n<strong>触发<\/strong>：写计数循环、数组遍历，或循环结果与预期不符。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n写一条断言：进入每圈前已积累了什么。\n<\/li><li>\n核对初始化使断言成立。\n<\/li><li>\n核对执行体加步进后，下一圈断言保持。\n<\/li><li>\n退出条件成立时，由断言推出目标结果；再查边界符号含不含端点。\n<\/li><li>\n<strong>落点<\/strong>：循环正确性可逐圈验证，不依赖试跑个别输入。\n<\/li><li>\n<strong>边界<\/strong>：浮点不做循环边界；遍历变量只在步进位置改变；嵌套循环外层控行、内层控列。\n<\/ol>\n<\/ul>\n<h2>模式 5：分支配对与短路保护<\/h2>\n<ul><li>\n<strong>触发<\/strong>：多层 <code>if<\/code> 嵌套、复合条件判断、<code>switch<\/code> 状态分流。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n忽略缩进，按最近未配对规则确定 <code>else<\/code> 归属。\n<\/li><li>\n复合条件把合法性判断放 <code>&amp;&amp;<\/code> 左侧，危险操作放右侧。\n<\/li><li>\n<code>switch<\/code> 从命中标签向下逐行走，标出每个 <code>break<\/code> 落点。\n<\/li><li>\n检查无匹配路径是否有 <code>default<\/code> 兜底。\n<\/li><li>\n<strong>落点<\/strong>：每条输入类别对应明确路径，保护条件先于危险操作。\n<\/li><li>\n<strong>边界<\/strong>：<code>case<\/code> 只能是整型常量；有意贯穿要加注释，漏写 <code>break<\/code> 会误串后续标签。\n<\/ol>\n<\/ul>\n<h2>模式 6：指针与数组边界计算<\/h2>\n<ul><li>\n<strong>触发<\/strong>：向函数传数组、遍历元素、计算两指针位置，或排查越界。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n确认指针指向合法对象，排除野指针与悬垂指针。\n<\/li><li>\n按元素宽度算地址：<code>base + i × sizeof(*p)<\/code>。\n<\/li><li>\n指针差值以元素为单位；要字节差先转 <code>char *<\/code>。\n<\/li><li>\n核对下标落在 <span class=\"katex-inline\">[0,n)<\/span>；末后指针只参与比较，不解引用。\n<\/li><li>\n<strong>落点<\/strong>：地址计算与访问边界一致，函数内修改数组元素有明确通道。\n<\/li><li>\n<strong>边界<\/strong>：跨数组指针相减无定义；<code>void *<\/code> 不能直接做算术；形参 <code>sizeof<\/code> 得指针宽度，容量需另传参数。\n<\/ol>\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>C Primer Plus（第 6 版）速查表<\/h1>\n<h2>1. 程序结构与构建阶段<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>阶段<\/th><th>动作<\/th><th>产物<\/th><th>常见问题<\/th><\/tr><\/thead><tbody><tr><td>预处理<\/td><td>展开 <code>#include<\/code>、<code>#define<\/code><\/td><td>翻译单元文本<\/td><td>宏未展开、头文件路径缺失<\/td><\/tr><tr><td>编译<\/td><td>词法/语法/类型检查，生成机器码<\/td><td>目标代码<\/td><td>语法错误、类型不匹配、原型缺失<\/td><\/tr><tr><td>链接<\/td><td>合并目标文件与库，绑定符号地址<\/td><td>可执行文件<\/td><td>未定义引用、重复定义<\/td><\/tr><tr><td>加载启动<\/td><td>映像读入内存，进入 <code>main<\/code><\/td><td>运行进程<\/td><td>运行期逻辑错误<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最小程序骨架：<code>#include &lt;stdio.h&gt;<\/code> → <code>int main(void) { ...; return 0; }<\/code>。<\/p>\n<h2>2. 基本类型与取值范围<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>类型<\/th><th>用途<\/th><th>宽度要点<\/th><\/tr><\/thead><tbody><tr><td><code>int<\/code><\/td><td>默认有符号整数计数<\/td><td>宽度平台相关，用 <code>sizeof<\/code> 实测<\/td><\/tr><tr><td><code>unsigned int<\/code><\/td><td>非负数量、位模式<\/td><td>范围 <span class=\"katex-inline\">[0,2^w-1]<\/span>，溢出模 <span class=\"katex-inline\">2^w<\/span> 回绕<\/td><\/tr><tr><td><code>char<\/code><\/td><td>字符编码，窄整数<\/td><td>算术时提升为 <code>int<\/code><\/td><\/tr><tr><td><code>float<\/code> / <code>double<\/code><\/td><td>单/双精度浮点<\/td><td>默认计算用 <code>double<\/code>，精度有限<\/td><\/tr><tr><td><code>int32_t<\/code> 等<\/td><td>固定宽度整数<\/td><td>来自 <code>&lt;stdint.h&gt;<\/code>，可移植<\/td><\/tr><\/tbody><\/table><\/div>\n<p>有符号 <span class=\"katex-inline\">w<\/span> 位范围：<span class=\"katex-inline\">[-2^{w-1},\\ 2^{w-1}-1]<\/span>；无符号：<span class=\"katex-inline\">[0,\\ 2^w-1]<\/span>。有符号溢出是未定义行为，无符号回绕可依赖。<\/p>\n<h2>3. 字符串与 null 终止<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>项目<\/th><th>规则<\/th><\/tr><\/thead><tbody><tr><td>结束标志<\/td><td><code>&#x27;\\0&#x27;<\/code>，数值 0；与字符 <code>&#x27;0&#x27;<\/code>（编码 48）不同<\/td><\/tr><tr><td>容量公式<\/td><td>存 <span class=\"katex-inline\">n<\/span> 个字符，数组宽度至少 <span class=\"katex-inline\">n+1<\/span><\/td><\/tr><tr><td><code>strlen<\/code><\/td><td>数 null 之前字符个数，运行期计算<\/td><\/tr><tr><td><code>sizeof(数组名)<\/code><\/td><td>编译期确定的声明宽度<\/td><\/tr><tr><td>退化例外<\/td><td><code>sizeof<\/code>、<code>&amp;数组名<\/code> 不退化为指针<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>4. 格式说明符配对<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>说明符<\/th><th>输出侧参数<\/th><th>输入侧参数<\/th><\/tr><\/thead><tbody><tr><td><code>%d<\/code><\/td><td><code>int<\/code><\/td><td><code>int *<\/code><\/td><\/tr><tr><td><code>%u<\/code><\/td><td><code>unsigned int<\/code><\/td><td><code>unsigned int *<\/code><\/td><\/tr><tr><td><code>%ld<\/code> / <code>%lld<\/code><\/td><td><code>long<\/code> / <code>long long<\/code><\/td><td>对应指针<\/td><\/tr><tr><td><code>%f<\/code><\/td><td><code>double<\/code>（<code>float<\/code> 提升）<\/td><td><code>float *<\/code><\/td><\/tr><tr><td><code>%lf<\/code><\/td><td>同 <code>%f<\/code><\/td><td><code>double *<\/code><\/td><\/tr><tr><td><code>%c<\/code><\/td><td>字符<\/td><td><code>char *<\/code>，不跳过空白<\/td><\/tr><tr><td><code>%s<\/code><\/td><td>字符数组地址<\/td><td>字符数组地址<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>scanf<\/code> 数值变量必须传地址（<code>&amp;x<\/code>）；数组名本身已是地址，不再加 <code>&amp;<\/code>。<\/p>\n<h2>5. 运算符优先级（高到低摘要）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>层级<\/th><th>运算符<\/th><th>结合性<\/th><\/tr><\/thead><tbody><tr><td>一元<\/td><td><code>++<\/code> <code>--<\/code> 正负 <code>sizeof<\/code> <code>*<\/code>(解引用) <code>&amp;<\/code><\/td><td>右<\/td><\/tr><tr><td>乘除模<\/td><td><code>*<\/code> <code>/<\/code> <code>%<\/code><\/td><td>左<\/td><\/tr><tr><td>加减<\/td><td><code>+<\/code> <code>-<\/code><\/td><td>左<\/td><\/tr><tr><td>关系<\/td><td><code>&lt; &lt;= &gt; &gt;=<\/code><\/td><td>左<\/td><\/tr><tr><td>相等<\/td><td><code>==<\/code> <code>!=<\/code><\/td><td>左<\/td><\/tr><tr><td>逻辑<\/td><td><code>&amp;&amp;<\/code> → `<\/td><td><\/td><td>`<\/td><td>短路<\/td><\/tr><tr><td>条件/赋值<\/td><td><code>?:<\/code> <code>=<\/code> <code>+=<\/code> 等<\/td><td>右<\/td><\/tr><\/tbody><\/table><\/div>\n<p>整数除法截断向零；混合类型先提升到宽类型，赋值时再收窄。<code>&amp;&amp;<\/code> 左侧假则停，<code>||<\/code> 左侧真则停。<\/p>\n<h2>6. 循环与分支要点<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>结构<\/th><th>条件位置<\/th><th>最少执行<\/th><th>适用<\/th><\/tr><\/thead><tbody><tr><td><code>while<\/code><\/td><td>入口<\/td><td>0 次<\/td><td>依赖状态终止<\/td><\/tr><tr><td><code>for<\/code><\/td><td>入口（表头三要素）<\/td><td>0 次<\/td><td>次数明确<\/td><\/tr><tr><td><code>do while<\/code><\/td><td>出口<\/td><td>1 次<\/td><td>需先执行再校验<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>\n不变式：进入每圈前成立的断言；初始化成立 → 每圈保持 → 退出得结果。\n<\/li><li>\n<code>else<\/code> 配最近未配对 <code>if<\/code>；缩进不改配对。\n<\/li><li>\n<code>switch<\/code> 命中后顺序贯穿，<code>break<\/code> 离开；<code>case<\/code> 标签须为整型常量。\n<\/li><li>\n<code>break<\/code> 跳出整个结构；<code>continue<\/code> 跳过本次余下循环体。\n<\/ul>\n<h2>7. 函数、栈帧与指针<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>概念<\/th><th>规则<\/th><\/tr><\/thead><tbody><tr><td>原型<\/td><td>调用前声明返回类型与形参类型，编译期核对个数/类型<\/td><\/tr><tr><td>按值传递<\/td><td>形参是副本，改形参不回写实参<\/td><\/tr><tr><td>栈帧<\/td><td>存形参、返回地址、局部变量；返回回收<\/td><\/tr><tr><td>递归<\/td><td>逐层建帧，基准条件终止，结果沿链退回<\/td><\/tr><tr><td>指针算术<\/td><td><code>p+i<\/code> 地址增量 <span class=\"katex-inline\">i\\times sizeof(*p)<\/span><\/td><\/tr><tr><td>指针差值<\/td><td>单位为元素个数；字节差需转 <code>char *<\/code> 再减<\/td><\/tr><tr><td>数组边界<\/td><td>合法下标 <span class=\"katex-inline\">[0,n)<\/span>；末后指针可比较不可解引用<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>8. 输入验证顺序<\/h2>\n<ol><li>\n用 <code>scanf<\/code> 返回值判断读到几个合法项。\n<\/li><li>\n数值后残留的换行/字符，用循环读到换行清出缓冲。\n<\/li><li>\n<code>%c<\/code> 不跳过空白；读可见字符前在格式串加空格。\n<\/li><li>\n<code>%s<\/code> 必须带宽度限制，如 10 元素数组用 <code>%9s<\/code>。\n<\/ol>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/c-primer-plus-6e", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1–3 章：初识 C 语言、程序结构与数据类型", "href": "#/chapter/ch01"}, {"label": "第 4–5 章：字符串与格式化输入/输出、运算符与表达式", "href": "#/chapter/ch02"}, {"label": "第 6–8 章：循环、分支跳转、字符输入/输出与输入验证", "href": "#/chapter/ch03"}, {"label": "第 9–10 章：函数、数组与指针", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "编译链接模型与最小 C 程序结构", "href": "#/concept/c01"}, {"label": "基本数据类型、位宽与整数取值范围", "href": "#/concept/c02"}, {"label": "字符数组、null 终止符与字符串长度", "href": "#/concept/c03"}, {"label": "printf/scanf 格式串解析与参数绑定", "href": "#/concept/c04"}, {"label": "运算符优先级、求值顺序与类型转换", "href": "#/concept/c05"}, {"label": "循环结构、关系真值与循环不变式", "href": "#/concept/c06"}, {"label": "分支跳转、逻辑短路与 switch 匹配规则", "href": "#/concept/c07"}, {"label": "函数原型、栈帧结构与递归执行", "href": "#/concept/c08"}, {"label": "指针、数组与指针算术", "href": "#/concept/c09"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1–3 章：初识 C 语言、程序结构与数据类型", "href": "#/quiz/ch01"}, {"label": "测验：第 4–5 章：字符串与格式化输入/输出、运算符与表达式", "href": "#/quiz/ch02"}, {"label": "测验：第 6–8 章：循环、分支跳转、字符输入/输出与输入验证", "href": "#/quiz/ch03"}, {"label": "测验：第 9–10 章：函数、数组与指针", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.26<\/div><h1>第 1–3 章：初识 C 语言、程序结构与数据类型<\/h1>\n<blockquote>对应原书第 1–3 章（第 1 章 PDF 第 26 页起，第 2 章 PDF 第 66 页起，第 3 章 PDF 第 109 页起；本 PDF 物理页序与印刷页一致，已用三个章首页脚注互核，偏移 0）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n画出一个 <code>.c<\/code> 源文件经过预处理、编译、汇编、链接到可执行文件的各阶段产物。\n<\/li><li>\n说出最小 C 程序的组成部分：头文件包含、<code>main<\/code> 函数、声明、语句、返回值。\n<\/li><li>\n区分变量与常量，识别 <code>int<\/code>、<code>char<\/code>、<code>float<\/code>、<code>double<\/code> 等基本类型的用途。\n<\/li><li>\n按类型位宽推导有符号整数与无符号整数的取值上下界。\n<\/li><li>\n解释为什么 C 程序必须先编译链接、不能直接被机器执行。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>C 程序是写给人读、最终交给机器执行的文本：编译器把文本翻译成机器码，链接器把机器码拼成可执行文件；程序里处理的每一个数据，都要先选定类型，类型决定它占多少位、能表示什么范围的数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念：编译链接流程（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。原书第 1 章 §1.8 先说明目标代码文件、可执行文件和库的分工：源文件经过编译器生成目标代码，目标代码还不能直接运行；链接器把目标代码与库代码合并，补上函数调用对应的机器地址，才得到可执行文件。第 2 章 §2.2 从一个完整示例出发，逐行说明 <code>#include<\/code>、<code>main<\/code>、声明语句与 <code>printf<\/code> 的位置。<\/p>\n<h3>2. 概念：最小程序的结构（难度：基础）<\/h3>\n<p>一个能编译运行的 C 程序，骨架固定为：包含标准输入输出头文件，定义 <code>main<\/code> 函数，函数体内写声明与语句，<code>main<\/code> 返回整数状态。下面是原书一类入门程序的标准形态：<\/p>\n<pre class=\"lang-c\"><code>#include &lt;stdio.h&gt;\n\nint main(void)\n{\n    int dogs;\n    printf(&quot;How many dogs do you have?\\n&quot;);\n    scanf(&quot;%d&quot;, &amp;dogs);\n    printf(&quot;You have %d dogs.\\n&quot;, dogs);\n    return 0;\n}<\/code><\/pre>\n<p><code>main<\/code> 是程序执行的入口；操作系统从 <code>main<\/code> 的第一条语句开始调度；<code>return 0<\/code> 把退出状态交回操作系统，0 表示正常结束。<\/p>\n<h3>3. 概念：基本数据类型与取值范围（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。原书第 3 章 §3.4 把类型分成整数系列（<code>int<\/code>、<code>short<\/code>、<code>long<\/code>、<code>char<\/code>、<code>_Bool<\/code>）与浮点数系列（<code>float<\/code>、<code>double<\/code>、<code>long double<\/code>）。类型不是语法装饰：它决定变量占几个字节、二进制位怎么解释、能存多大范围的值。声明一个变量，就是在内存里划出一块按该类型解释的区域。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[.c 源文件文本] --&gt; B[预处理: 展开 #include 与宏]\nB --&gt; C[编译: 翻译为汇编/目标代码]\nC --&gt; D[目标代码 .o/.obj]\nD --&gt; E[链接: 合并库代码, 绑定符号地址]\nE --&gt; F[可执行文件]\nF --&gt; G[操作系统加载执行, 进入 main]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这条链断在 C 步，源文件只是文本，机器无法直接理解；断在 E 步，目标代码里调用的库函数还没有地址，无法形成完整可执行映像。<\/p>\n<h2>推导一：从二进制位宽推导有符号整数的取值范围<\/h2>\n<p>取一个位宽为 <span class=\"katex-inline\">w<\/span> 的有符号整数类型，二进制最高位约定为符号位：0 表示非负，1 表示负。剩下 <span class=\"katex-inline\">w-1<\/span> 位表示数值部分。<\/p>\n<ol><li>\n非负方向：<span class=\"katex-inline\">w-1<\/span> 位全 1 时数值最大，最大值为 <span class=\"katex-inline\">2^{w-1}-1<\/span>。理由是 <span class=\"katex-inline\">k<\/span> 位二进制能表示的最大非负数是 <span class=\"katex-inline\">2^k-1<\/span>，这里 <span class=\"katex-inline\">k=w-1<\/span>。\n<\/li><li>\n负方向：补码表示下，最小负值为 <span class=\"katex-inline\">-2^{w-1}<\/span>。理由是符号位为 1、数值位全 0 的编码被约定给最小负数，比正数侧多表示一个值。\n<\/li><li>\n因此有符号范围为 <span class=\"katex-inline\">[-2^{w-1},\\ 2^{w-1}-1]<\/span>。\n<\/li><li>\n同一 <span class=\"katex-inline\">w<\/span> 位若按无符号解释，所有位都算数值位，范围为 <span class=\"katex-inline\">[0,\\ 2^w-1]<\/span>。\n<\/ol>\n<p>以常见 32 位 <code>int<\/code> 为例：<span class=\"katex-inline\">w=32<\/span>，有符号范围 <span class=\"katex-inline\">[-2^{31},\\ 2^{31}-1]<\/span>，即 <span class=\"katex-inline\">[-2147483648,\\ 2147483647]<\/span>；无版本（<code>unsigned int<\/code>）范围 <span class=\"katex-inline\">[0,\\ 4294967295]<\/span>。这个推导只依赖位宽与补码约定，不依赖具体编译器。<\/p>\n<h2>推导二：一个入门程序的执行推演<\/h2>\n<p>对上面的 <code>dogs<\/code> 程序逐步列出执行过程：<\/p>\n<ol><li>\n操作系统加载可执行文件，跳转到 <code>main<\/code>，在栈上为局部变量 <code>dogs<\/code> 留出 <code>int<\/code> 宽度的存储区。\n<\/li><li>\n<code>printf<\/code> 把提示文字写入标准输出；程序暂停，等待输入。\n<\/li><li>\n用户输入数字（例如 3）并回车；<code>scanf(&quot;%d&quot;, &amp;dogs)<\/code> 按十进制解析字符序列，把 3 写入 <code>dogs<\/code> 对应的存储区。\n<\/li><li>\n第二个 <code>printf<\/code> 取出 <code>dogs<\/code> 的值 3，按 <code>%d<\/code> 格式化后输出。\n<\/li><li>\n<code>return 0<\/code> 把 0 交回操作系统，<code>main<\/code> 的栈帧回收，程序结束。\n<\/ol>\n<p>推演中每一步的依据：<code>scanf<\/code> 的 <code>%d<\/code> 规定把字符按十进制整数解释；<code>&amp;dogs<\/code> 给出变量地址，函数才能把值写回原变量；<code>printf<\/code> 的 <code>%d<\/code> 按整数格式读出该地址处的值。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉 <code>#include &lt;stdio.h&gt;<\/code><\/strong>：<code>printf<\/code>、<code>scanf<\/code> 的原型未声明。旧标准下编译器可能按默认规则猜测返回类型，函数参数个数与类型不做检查；现代编译器直接报错。反例场景：漏写头文件后调用 <code>printf(&quot;%f&quot;, x)<\/code>，原型缺失导致编译器不知道参数应按浮点传递，值按错误寄存器或栈位置读取，输出乱码。\n<\/li><li>\n<strong>把 <code>int dogs;<\/code> 改成不初始化就直接使用<\/strong>：局部变量初始值不确定，读取它属于未定义行为。反例：去掉 <code>scanf<\/code> 直接 <code>printf(&quot;%d&quot;, dogs)<\/code>，<code>dogs<\/code> 所在栈区残留旧值，每次运行结果可能不同。\n<\/li><li>\n<strong>把有符号 <code>int<\/code> 换成 <code>unsigned int<\/code><\/strong>：负数解释规则改变。若程序里出现 <code>dogs = -1<\/code>，无符号类型按模 <span class=\"katex-inline\">2^w<\/span> 解释，-1 变成 <span class=\"katex-inline\">2^w-1<\/span>，后续比较与输出全部偏离预期。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p>把编译链接流程类比成印一本书：源文件是作者手稿，预处理是把引用的章节拼进文稿，编译是排成印刷厂能照排的版样，链接是把正文、插图与目录拼成完整成书；读者（操作系统）拿到的是装订好的书，不是散落的手稿。类型宽度类比成抽屉格数：格数固定，能放的东西大小就被限定；想放超出范围的值，要么溢出回绕，要么截断出错。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解一：源文件双击就能运行<\/strong>。C 文本需要编译链接生成可执行文件后，操作系统才能加载；看到的源码本身不是机器指令。\n<\/li><li>\n<strong>误解二：类型只影响显示格式<\/strong>。类型同时决定存储宽度、二进制解释方式与取值范围；格式符用错会按错误宽度读取内存。\n<\/li><li>\n<strong>误解三：变量声明后自动清零<\/strong>。局部自动变量不会自动初始化，全局静态变量才被初始化为 0；不能假定局部变量初值为 0。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n列出从 <code>.c<\/code> 文件到可执行文件的四个阶段，各阶段产物是什么。\n<\/li><li>\n16 位有符号整数的最大值与最小值各是多少？写出推导过程。\n<\/li><li>\n为什么调用 <code>scanf<\/code> 时要写 <code>&amp;dogs<\/code>，而调用 <code>printf<\/code> 时直接写 <code>dogs<\/code>？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\n<code>main<\/code> 是程序入口，<code>return 0<\/code> 表示正常退出。\n<\/li><li>\n类型决定位宽、二进制解释与取值范围；位宽 <span class=\"katex-inline\">w<\/span> 决定上下界。\n<\/li><li>\n目标代码必须经过链接合并库代码，才能成为可执行文件。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章把程序从文本到执行的骨架搭起来。下一章（第 4–5 章）在这个骨架上处理两类具体数据：字符串怎样存放在字符数组里、<code>printf<\/code>/<code>scanf<\/code> 怎样按格式绑定参数；同时进入运算符与表达式，研究一条语句内部的求值次序。本章的类型宽度结论，是后面隐式类型转换与指针算术的计算基础。<\/p>", "ch02": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.174<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1–3 章：初识 C 语言、程序结构与数据类型<\/a><\/span><\/div><h1>第 4–5 章：字符串与格式化输入/输出、运算符与表达式<\/h1>\n<blockquote>对应原书第 4–5 章（第 4 章 PDF 第 174 页起，第 5 章 PDF 第 239 页起；物理页序与印刷页一致，偏移 0）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n画出字符数组的内存布局，标出每个字符与末尾的 null 字符位置。\n<\/li><li>\n手算一个字符串的 <code>strlen<\/code>，并说清它为什么不把 null 计入长度。\n<\/li><li>\n按格式串逐个匹配 <code>printf<\/code>/<code>scanf<\/code> 的转换说明与参数。\n<\/li><li>\n写出含乘除模、自增与比较的表达式求值顺序，区分优先级与结合性。\n<\/li><li>\n判断混合类型表达式中隐式转换的方向，识别整数除法与浮点除法的差别。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>字符串是靠末尾 null 字符收尾的字符序列；格式化输入输出靠格式串里的转换说明规定参数类型；表达式的结果由优先级、结合性与类型转换共同决定，不按书写顺序从左到右一概而论。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念：字符数组与 null 终止（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。原书第 4 章 §4.2 说明：字符串存放在 <code>char<\/code> 类型数组中，末尾追加一个空字符 <code>&#x27;\\0&#x27;<\/code>（即数值 0）作为结束标志。<code>strlen()<\/code> 从数组首元素逐个计数，直到遇到 null 为止，null 本身不计入长度。<\/p>\n<h3>2. 概念：格式串与参数绑定（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。原书第 4 章 §4.4 把 <code>printf()<\/code> 与 <code>scanf()<\/code> 作为一对交互函数。格式串中的普通字符原样输出或原样匹配；<code>%<\/code> 开头的转换说明决定下一个参数按什么类型解释：<code>%d<\/code> 对应 <code>int<\/code>，<code>%f<\/code> 对应 <code>float<\/code>（<code>double<\/code> 在变参中提升），<code>%s<\/code> 对应字符数组地址，<code>%c<\/code> 对应单个字符。<\/p>\n<h3>3. 概念：运算符优先级与类型转换（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。原书第 5 章 §5.2 给出赋值、加减、乘除、求模的优先级关系；§5.3 讲解 <code>sizeof<\/code>、<code>%<\/code>、<code>++<\/code>、<code>--<\/code>；§5.5 说明类型转换。优先级决定先算哪一对，结合性决定同级从哪一侧分组；混合类型运算时窄类型先提升为宽类型。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[字符数组首地址] --&gt; B[字符1]\nB --&gt; C[字符2]\nC --&gt; D[...]\nD --&gt; E[字符n]\nE --&gt; F[&#x27;\\0&#x27; 结束标志]\nG[格式串 %d %f %s] --&gt; H[逐个匹配后续参数]\nI[表达式] --&gt; J[优先级分组]\nJ --&gt; K[结合性定次序]\nK --&gt; L[类型提升后求值]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：字符串遍历断在 F 步——缺少 null 时函数不知道何处停止，会继续读到数组外部内存；表达式求值断在 J 步——不先分组，同级与跨级运算的先后就无法确定。<\/p>\n<h2>推导一：strlen 遍历推演与内存计数<\/h2>\n<p>设字符数组声明为 <code>char name[40];<\/code>，存入内容 <code>Amy<\/code>。内存布局按地址递增排列：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>下标<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4…39<\/th><\/tr><\/thead><tbody><tr><td>内容<\/td><td><code>A<\/code><\/td><td><code>m<\/code><\/td><td><code>y<\/code><\/td><td><code>\\0<\/code><\/td><td>未使用<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>strlen<\/code> 的推演过程：<\/p>\n<ol><li>\n指针从下标 0 开始，内容 <code>&#x27;A&#x27;<\/code> 不是 null，计数 1，前进到下标 1。\n<\/li><li>\n下标 1 内容 <code>&#x27;m&#x27;<\/code> 不是 null，计数 2，前进到下标 2。\n<\/li><li>\n下标 2 内容 <code>&#x27;y&#x27;<\/code> 不是 null，计数 3，前进到下标 3。\n<\/li><li>\n下标 3 内容 <code>&#x27;\\0&#x27;<\/code>，停止；返回计数 3。\n<\/li><li>\n结论：<code>strlen(&quot;Amy&quot;) == 3<\/code>，数组实际占用 4 个字节存有效内容与结束标志。\n<\/ol>\n<p>推演依据：null 的数值是 0，与字符 <code>&#x27;0&#x27;<\/code>（ASCII 48）不同；计数只在遇到 0 值字符时终止。<\/p>\n<h2>推导二：一条混合表达式的求值顺序推演<\/h2>\n<p>取表达式：<\/p>\n<pre class=\"lang-c\"><code>int a = 7, b = 2;\ndouble r = a / b + 3.5;<\/code><\/pre>\n<p>分步推演：<\/p>\n<ol><li>\n<code>/<\/code> 优先级高于 <code>+<\/code>，先分组为 <code>(a / b) + 3.5<\/code>。\n<\/li><li>\n<code>a / b<\/code> 两侧都是 <code>int<\/code>，按整数除法计算：<code>7 / 2 = 3<\/code>，小数部分丢弃。\n<\/li><li>\n进入加法前，左侧 <code>3<\/code>（<code>int<\/code>）提升为 <code>double<\/code>，与 <code>3.5<\/code> 相加：<code>3.0 + 3.5 = 6.5<\/code>。\n<\/li><li>\n结果 <code>r = 6.5<\/code>。\n<\/ol>\n<p>再看一条自增与比较混合的语句：<code>x = 2; y = x++ <em> 3;<\/code>。<code>x++<\/code> 是后置自增：表达式里先取 <code>x<\/code> 当前值 2 参与乘法，<code>y = 2 <\/em> 3 = 6<\/code>；该表达式结束后 <code>x<\/code> 再加 1，变为 3。依据是后置自增的取值规则：返回旧值，副作用在序列点前完成。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉字符串末尾的 null<\/strong>：<code>strlen<\/code>、<code>puts<\/code>、<code>%s<\/code> 输出都不会在数组边界处停下，继续读到后续内存字节直到偶然遇到一个 0 值。反例：数组里存了 <code>&quot;Amy&quot;<\/code> 却没写 <code>&#x27;\\0&#x27;<\/code>，输出可能带上相邻内存里的乱码字符。\n<\/li><li>\n<strong>把 <code>%d<\/code> 与浮点参数配错<\/strong>：格式串按 <code>int<\/code> 宽度读取浮点值所在位置，位模式被错误解释。反例：<code>printf(&quot;%d\\n&quot;, 3.14);<\/code> 不会输出 3，而是把 <code>double<\/code> 的位模式按整数规则拆读，得到无意义整数。\n<\/li><li>\n<strong>把整数除法改成两侧强制浮点<\/strong>：<code>(double)a / b<\/code> 中 <code>a<\/code> 先转 <code>double<\/code>，<code>b<\/code> 随之提升，<code>7.0 / 2.0 = 3.5<\/code>；与原整数除法 <code>3<\/code> 的差别就落在内侧除法是否先提升类型。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p>字符串结尾的 null 像一段录音的结束标记：没有标记，播放器会一直往下读隔壁轨道。格式串像点菜单上的暗号：厨房按暗号顺序取食材，暗号与食材对不上，上的菜就错。整数除法像把饼干平分给人，零头直接收走；浮点除法把零头折算成小数继续算。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解一：<code>strlen<\/code> 返回数组占用字节数<\/strong>。它返回有效字符个数，不含 null；数组声明宽度与字符串长度是两个量。\n<\/li><li>\n<strong>误解二：<code>++x<\/code> 与 <code>x++<\/code> 在所有位置等价<\/strong>。后置自增返回旧值，前置自增返回新值；在赋值表达式右侧混用时差别直接影响结果。\n<\/li><li>\n<strong>误解三：混合类型一定先转成更窄类型<\/strong>。规则方向相反：窄类型提升为宽类型，避免精度先损失再补回。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n写出 <code>char s[10] = &quot;hi&quot;;<\/code> 的内存表，标出下标 0、1、2 的内容，并给出 <code>strlen(s)<\/code>。\n<\/li><li>\n表达式 <code>17 % 5 + 8 / 3<\/code> 按什么次序计算，结果是多少？\n<\/li><li>\n为什么 <code>printf(&quot;%f\\n&quot;, 5 / 2);<\/code> 与 <code>printf(&quot;%f\\n&quot;, 5.0 / 2);<\/code> 输出不同？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\n字符串靠 <code>&#x27;\\0&#x27;<\/code> 收尾，<code>strlen<\/code> 不计 null。\n<\/li><li>\n转换说明与参数按位置一一绑定，类型必须匹配。\n<\/li><li>\n优先级先分组，结合性定同级次序，混合运算先做类型提升。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章的数据存放与格式化输入输出，为下一章的控制流提供输入手段：循环与分支需要反复读取字符、判断条件。第 5 章的表达式求值规则，是第 6 章循环条件、第 7 章分支条件的判断依据；类型提升结论也会在函数参数传递（第 9 章）与指针算术（第 10 章）中再次出现。<\/p>", "ch03": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.313<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 4–5 章：字符串与格式化输入/输出、运算符与表达式<\/a><\/span><\/div><h1>第 6–8 章：循环、分支跳转、字符输入/输出与输入验证<\/h1>\n<blockquote>对应原书第 6–8 章（第 6 章 PDF 第 313 页起，第 7 章 PDF 第 407 页起，第 8 章 PDF 第 497 页起；物理页序与印刷页一致，偏移 0）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n为一段计数循环写出循环不变式，说明退出条件与退出时得到的结果。\n<\/li><li>\n区分 <code>while<\/code>、<code>for<\/code>、<code>do while<\/code> 的入口条件与出口条件位置。\n<\/li><li>\n解释 <code>if<\/code>/<code>else<\/code> 配对规则、逻辑运算符短路顺序与 <code>switch<\/code> 的 <code>break<\/code> 落点。\n<\/li><li>\n说明缓冲输入下字符何时交到程序，以及文件结尾（EOF）如何判定。\n<\/li><li>\n设计输入验证流程：先读入字符流，再拒绝非法值并把剩余字符清出缓冲区。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>循环靠不变式保证每一圈积累的状态正确；分支靠配对规则与短路顺序确定走哪条路；字符 I/O 经过缓冲区与流层，程序读到的是缓冲区里暂存的内容，结尾靠 EOF 标志而不是某个特殊字符。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念：三种循环与循环不变式（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。原书第 6 章 §6.2 讲 <code>while<\/code>（入口条件循环：先判断后执行），§6.5 讲 <code>for<\/code>（初始化、判断、步进写在一行），§6.8 讲 <code>do while<\/code>（出口条件循环：先执行后判断）。循环不变式是每次进入循环体前都成立的断言，用来核对积累状态是否正确。<\/p>\n<h3>2. 概念：分支、短路与 switch（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。原书第 7 章 §7.1–7.2 讲 <code>if<\/code> 与 <code>if else<\/code>，§7.3 讲逻辑运算符 <code>&amp;&amp;<\/code>、<code>||<\/code>、<code>!<\/code>，§7.7 讲 <code>switch<\/code>。<code>else<\/code> 与最近的未配对 <code>if<\/code> 结合；逻辑与、逻辑或在结果已定时不再算右侧；<code>switch<\/code> 按表达式值匹配标签，没有 <code>break<\/code> 会继续向下贯穿。<\/p>\n<h3>3. 概念：缓冲区、EOF 与输入验证（难度：基础）<\/h3>\n<p>原书第 8 章 §8.1 讲 <code>getchar()<\/code>/<code>putchar()<\/code>，§8.2 讲缓冲区，§8.3 讲文件结尾，§8.6 讲输入验证。标准输入默认缓冲：用户敲回车后，整行字符进入缓冲区，程序逐个读取。读到文件结尾时 <code>getchar()<\/code> 返回 <code>EOF<\/code>（一个负整型常量），用它判断输入是否结束。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[读取字符] --&gt; B{缓冲区内有字符?}\nB -- 有 --&gt; C[getchar 取一个字符]\nC --&gt; D{是 EOF?}\nD -- 否 --&gt; E[条件判断/循环体]\nE --&gt; A\nD -- 是 --&gt; F[结束处理]\nB -- 无 --&gt; G[等待回车提交整行]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：控制流断在 D 步——不识别 EOF，程序会把结束标志当普通字符处理；断在 G 步——把缓冲输入当成即时输入，会误解字符为何迟迟读不到。<\/p>\n<h2>推导一：求和循环的不变式与逐圈推演<\/h2>\n<p>程序求 <span class=\"katex-inline\">1+2+\\dots+n<\/span>：<\/p>\n<pre class=\"lang-c\"><code>int sum = 0, i = 1, n = 5;\nwhile (i &lt;= n)\n{\n    sum = sum + i;\n    i = i + 1;\n}<\/code><\/pre>\n<p>循环不变式：进入第 <span class=\"katex-inline\">k<\/span> 圈前，<code>sum<\/code> 等于 <span class=\"katex-inline\">1+2+\\dots+(i-1)<\/span>，即前 <span class=\"katex-inline\">i-1<\/span> 个整数之和；<code>i<\/code> 是下一个待加的数。逐圈推演：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>圈次<\/th><th>进入时 i<\/th><th>进入时 sum<\/th><th>执行体后 sum<\/th><th>执行体后 i<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>2<\/td><td>1<\/td><td>3<\/td><td>3<\/td><\/tr><tr><td>3<\/td><td>3<\/td><td>3<\/td><td>6<\/td><td>4<\/td><\/tr><tr><td>4<\/td><td>4<\/td><td>6<\/td><td>10<\/td><td>5<\/td><\/tr><tr><td>5<\/td><td>5<\/td><td>10<\/td><td>15<\/td><td>6<\/td><\/tr><\/tbody><\/table><\/div>\n<p>第 5 圈结束后 <code>i=6<\/code>，条件 <code>i &lt;= 5<\/code> 不成立，退出。退出时不变式给出 <code>sum = 1+2+…+5 = 15<\/code>。推演依据：每圈先把当前 <code>i<\/code> 累加进 <code>sum<\/code>，再把 <code>i<\/code> 加 1；不变式在赋值前后都能对上前后两列数值。<\/p>\n<h2>推导二：短路求值与 if-else 配对推演<\/h2>\n<p>取条件：<\/p>\n<pre class=\"lang-c\"><code>if (x != 0 &amp;&amp; y / x &gt; 1)\n    printf(&quot;ok\\n&quot;);<\/code><\/pre>\n<p>求值推演：<\/p>\n<ol><li>\n先算左侧 <code>x != 0<\/code>。若 <code>x == 0<\/code>，左侧为假，逻辑与已确定整体为假，右侧 <code>y / x<\/code> 不再计算，避免了除零。\n<\/li><li>\n仅当左侧为真，才算右侧 <code>y / x &gt; 1<\/code>；两侧都真时执行 <code>printf<\/code>。\n<\/li><li>\n这就是短路：右侧是否执行，取决于左侧结果。\n<\/ol>\n<p>再看配对规则。代码片段：<\/p>\n<pre class=\"lang-c\"><code>if (a &gt; 0)\n    if (b &gt; 0)\n        printf(&quot;both\\n&quot;);\nelse\n    printf(&quot;a&lt;=0?\\n&quot;);<\/code><\/pre>\n<p>按规则，<code>else<\/code> 与它最近的未配对 <code>if<\/code>（即 <code>if (b &gt; 0)<\/code>）结合，缩进不改变配对。因此 <code>else<\/code> 分支对应的是 <code>a&gt;0 且 b&lt;=0<\/code>，而不是 <code>a&lt;=0<\/code>。推演依据：C 语言按语法配对，不按书写缩进配对；要让 <code>else<\/code> 挂到外层 <code>if<\/code>，必须用花括号把内层 <code>if<\/code> 包成块。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉循环边界检查<\/strong>：把 <code>while (i &lt;= n)<\/code> 改成 <code>while (1)<\/code> 且删去 <code>i<\/code> 的累加终止条件，循环永远满足入口条件。反例场景：数组遍历不写下界判断，读到数组尾部后继续访问相邻内存，属于未定义行为。\n<\/li><li>\n<strong>去掉 <code>switch<\/code> 里的 <code>break<\/code><\/strong>：匹配到一个标签后继续贯穿执行后续标签的语句。反例：星期判断中 <code>case 1:<\/code> 没有 <code>break<\/code>，满足 case 1 后会连着执行 case 2、case 3 的语句。\n<\/li><li>\n<strong>假设输入是无缓冲即时提交<\/strong>：按每敲一个字符就立即被程序读取来写界面，实际缓冲下程序要等回车后才看到字符，菜单响应会表现为&quot;卡住&quot;直到换行。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p>循环不变式像记账：每加一笔账前，账本余额必须等于上一笔结算后的总额；退出时账本总额就是全部入账之和。短路求值像核验入场：第一关证件不合格，第二关就不必再查。缓冲区像前台收件筐：信件先放进筐里，秘书按批次取走，不是送一件就马上处理一件。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解一：<code>do while<\/code> 至少执行一次，所以条件总为真<\/strong>。先执行一次是结构特征；条件为假时照样退出，只是判断位置在尾部。\n<\/li><li>\n<strong>误解二：缩进决定 <code>else<\/code> 挂哪个 <code>if<\/code><\/strong>。配对只看语法层次，缩进仅为可读性；靠缩进读分支容易把内层误判成外层。\n<\/li><li>\n<strong>误解三：EOF 是输入的一个字符<\/strong>。EOF 是 <code>getchar()<\/code> 返回的状态标志（负值），不属于字符集；读到普通字符时返回字符编码，读到流结尾才返回 EOF。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n为 <code>for (i=0; i&lt;n; i++)<\/code> 累加数组元素的循环写一条不变式，并说明退出时 <code>sum<\/code> 的含义。\n<\/li><li>\n<code>if (a &gt; 0 || b++ &gt; 1)<\/code> 中，<code>a &gt; 0<\/code> 为真时 <code>b<\/code> 是否自增？依据是什么？\n<\/li><li>\n写出 <code>switch<\/code> 中缺少 <code>break<\/code> 时的贯穿过程，举一个两个标签共用同一段处理代码的合法用法。\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\n不变式核对每圈积累状态；退出条件成立时得到目标结果。\n<\/li><li>\n<code>else<\/code> 配最近未配对 <code>if<\/code>；逻辑运算符短路，右侧可能不执行。\n<\/li><li>\n缓冲输入回车后提交；EOF 是流结尾标志，不是普通字符。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章控制流把第 5 章的表达式变成可执行的判断与重复动作。第 9 章把可复用的重复动作封装成函数，循环与分支在函数体内组织；第 10 章处理成组数据时，循环是遍历数组的主要手段，分支是筛选与分类的主要手段。本章的输入验证结论，在文件 I/O（第 13 章）处理流结尾时同样适用。<\/p>", "ch04": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.561<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 6–8 章：循环、分支跳转、字符输入/输出与输入验证<\/a><\/span><\/div><h1>第 9–10 章：函数、数组与指针<\/h1>\n<blockquote>对应原书第 9–10 章（第 9 章 PDF 第 561 页起，第 10 章 PDF 第 641 页起；物理页序与印刷页一致，偏移 0）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n说清函数原型的作用：参数个数、类型与返回类型在调用前被编译器检查。\n<\/li><li>\n沿栈帧变化推演一次函数调用：形参、返回地址、局部变量的位置与回收。\n<\/li><li>\n推演一次递归调用的展开与回收顺序，区分尾递归与一般递归。\n<\/li><li>\n给定数组首地址与元素类型，计算任意下标元素的地址与两指针差值。\n<\/li><li>\n判断数组越界访问的位置，说明为什么地址落在数组外面就属于未定义行为。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>函数把一段动作封装成黑盒，原型在调用前约束接口；每次调用在栈上开一帧，返回时回收；数组名在多数表达式中退化为首元素指针，指针算术按元素大小缩放，访问范围必须落在声明的元素个数之内。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念：原型、参数与返回值（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。原书第 9 章 §9.1 讲创建与使用函数，§9.2 讲 ANSI C 函数原型。原型写明函数名、返回类型与形参类型列表；调用时编译器对照原型检查实参个数与类型。<code>return<\/code> 把结果交回主调函数；函数类型由返回值类型决定。<\/p>\n<h3>2. 概念：栈帧与递归（难度：高难）<\/h3>\n<p>原书第 9 章 §9.3 讲递归：函数直接或间接调用自己。每进入一层递归，栈上新建一帧；每层的形参与局部变量互不干扰，直到触达基准条件，再逐层返回。推演递归必须同时看展开方向（一层层深入）与回收方向（一层层退回）。<\/p>\n<h3>3. 概念：指针、数组与指针算术（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。原书第 10 章 §10.3 讲指针和数组的关系，§10.5 讲指针操作。数组在表达式中通常退化为指向首元素的指针；<code>p + i<\/code> 的地址增量是 <span class=\"katex-inline\">i<\/span> 乘元素大小；两指针相减的结果以元素个数为单位，不是字节差。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[主调函数帧] --&gt; B[调用: 压入实参/返回地址]\nB --&gt; C[被调函数帧: 形参+局部变量]\nC --&gt; D{是否再调用/递归?}\nD -- 是 --&gt; C\nD -- 否 --&gt; E[return: 计算返回值]\nE --&gt; F[回收本帧, 回到返回地址]\nG[数组首元素地址 base] --&gt; H[元素 i 地址 = base + i*元素大小]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：函数调用断在 B 步——实参与返回地址没有压栈，被调函数无法知道从哪里返回；指针计算断在 H 步——步长若按字节而不是按元素大小缩放，跨类型访问全部错位。<\/p>\n<h2>推导一：一次函数调用的栈帧推演<\/h2>\n<p>取定义与调用：<\/p>\n<pre class=\"lang-c\"><code>int square(int x)\n{\n    int result;\n    result = x * x;\n    return result;\n}\n\nint main(void)\n{\n    int a = 6;\n    int b = square(a);\n    return 0;\n}<\/code><\/pre>\n<p>推演过程：<\/p>\n<ol><li>\n<code>main<\/code> 帧中 <code>a<\/code> 存入局部变量区，值 6。\n<\/li><li>\n调用 <code>square(a)<\/code>：实参 6 传入形参 <code>x<\/code>，保存返回地址（<code>main<\/code> 中调用语句的下一条位置），栈上新建 <code>square<\/code> 帧。\n<\/li><li>\n<code>square<\/code> 帧内：形参 <code>x=6<\/code>，局部变量 <code>result<\/code> 未初始化；执行 <code>result = x * x<\/code>，<code>result=36<\/code>。\n<\/li><li>\n<code>return result<\/code>：把 36 作为返回值交出，<code>square<\/code> 帧回收。\n<\/li><li>\n回到 <code>main<\/code>，返回值赋给 <code>b<\/code>，<code>b=36<\/code>；<code>main<\/code> 随后返回 0。\n<\/ol>\n<p>推演依据：形参是被调帧内的局部存储，实参按值复制；被调函数修改形参不影响主调函数的原变量；帧回收后该帧内局部变量不再可访问。<\/p>\n<h2>推导二：指针算术与数组地址推演<\/h2>\n<p>设数组声明 <code>int a[5];<\/code>，<code>int<\/code> 宽度为 4 字节，首元素地址记为 <span class=\"katex-inline\">base<\/span>。地址计算规则：元素 <code>a[i]<\/code> 的地址为 <span class=\"katex-inline\">base + i \\times sizeof(int)<\/span>。<\/p>\n<ol><li>\n<code>a[0]<\/code> 地址：<span class=\"katex-inline\">base + 0 \\times 4 = base<\/span>。\n<\/li><li>\n<code>a[3]<\/code> 地址：<span class=\"katex-inline\">base + 3 \\times 4 = base + 12<\/span>。\n<\/li><li>\n指针差 <code>&amp;a[3] - &amp;a[0]<\/code>：<span class=\"katex-inline\">(base+12 - base) / 4 = 3<\/span>，结果是 3 个元素，不是 12 字节。\n<\/li><li>\n越界位置：下标范围为 <span class=\"katex-inline\">0,1,2,3,4<\/span>；<code>a[5]<\/code> 地址为 <span class=\"katex-inline\">base+20<\/span>，落在数组存储区之后，访问它属于越界。\n<\/ol>\n<p>再看字符数组：<code>char code[12];<\/code>，元素大小 1 字节，<code>code[i]<\/code> 地址为 <span class=\"katex-inline\">base + i<\/span>；<code>&amp;code[7]-&amp;code[2]=5<\/code>。元素类型不同，同一指针差对应的字节差不同，但元素个数差一致。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉函数原型声明<\/strong>：调用前编译器不知道形参类型，实参按默认规则传递，个数与类型不做检查。反例场景：定义 <code>int add(int, int)<\/code> 却先调用后定义且无原型，调用时少传一个参数，被调函数在帧上读到垃圾值，结果不可预测。\n<\/li><li>\n<strong>去掉数组边界检查<\/strong>：遍历写到 <code>a[5]<\/code>、<code>a[6]<\/code>，地址计算本身能算出位置，但该位置不属于数组；相邻变量、返回地址可能被覆盖，轻则数据错乱，重则程序崩溃。\n<\/li><li>\n<strong>把数组形参当成按值复制整块<\/strong>：函数形参写 <code>int arr[]<\/code>，实际收到的是首元素指针，函数内修改 <code>arr[i]<\/code> 会改到原数组；若误以为复制了整块，会漏掉&quot;函数内改动影响主调数组&quot;这条链路。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p>栈帧像一摞工作表：每接一个任务在最上面铺一张表，写完交回后抽走这张表；下面一张表的内容不受影响。指针算术像按排取书：每排固定放 4 本书（<code>int<\/code> 4 字节），向前走 3 排，位置移动 12 个书位，但排数差记为 3。数组越界像翻到书架编号之外的格子，格子物理上存在，放的却不是这组书。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解一：数组名是一个常量指针变量<\/strong>。数组名是数组对象的标识，在多数表达式中退化为首元素地址；它本身不是可被赋值的指针变量，不能写 <code>a = a + 1<\/code>。\n<\/li><li>\n<strong>误解二：递归一定比迭代省内存<\/strong>。每深入一层开一帧，递归层数过大会占满栈空间；基准条件缺失时递归不会自动停止。\n<\/li><li>\n<strong>误解三：指针差值是字节差<\/strong>。指针减法以元素为单位；要算字节差，需要先把指针转成 <code>char *<\/code> 再相减。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n画出 <code>main<\/code> 调用 <code>double_it(int x)<\/code> 时两帧的布局，标出形参、返回地址与局部变量。\n<\/li><li>\n<code>int v[8];<\/code> 中 <code>&amp;v[6]-&amp;v[1]<\/code> 等于多少？若元素为 <code>double<\/code>（8 字节），字节差是多少？\n<\/li><li>\n递归求阶乘 <code>fact(n)<\/code>：写出展开到 <code>fact(1)<\/code> 的层数顺序，以及返回值逐层乘回的顺序。\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\n原型在调用前检查参数个数与类型；按值传递，形参改动不回写实参。\n<\/li><li>\n每次调用开一帧，返回回收；递归每层独立成帧。\n<\/li><li>\n指针算术步长按元素大小缩放；下标必须落在声明范围内。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章把前面章节里零散出现的函数调用、数组访问收拢到接口与内存两个视角。第 11 章字符串函数建立在字符指针与数组遍历之上；第 12 章存储类别与动态内存分配在栈、静态区与堆之间区分变量生命周期；第 13 章文件 I/O 把指针操作扩展到流对象。本章的地址计算规则是理解后续所有内存相关概念的底层依据。<\/p>", "c01": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.47<\/div><h1>编译链接模型与最小 C 程序结构<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书第 1 章 §1.8、第 2 章 §2.2，PDF 第 47、69 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>C 程序从文本源文件出发，经过预处理、编译、汇编、链接四个阶段形成可执行文件；最小可运行程序由头文件包含、<code>main<\/code> 函数定义、函数体内的声明与语句、返回状态四部分组成。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>刚接触 C 的人容易把&quot;写代码&quot;和&quot;运行程序&quot;看成一件事：以为保存 <code>.c<\/code> 文件后机器就能直接执行。困难在于，CPU 只识别二进制机器指令，不识别 C 文本；而程序里调用的库函数（如 <code>printf<\/code>）并不在自己写的源文件里。编译链接模型回答两个具体问题：文本怎样变成机器指令；分散在不同文件与库里的代码怎样拼成一个完整映像。不理解这条链，遇到&quot;编译错误&quot;&quot;链接错误&quot;&quot;运行结果不对&quot;三类问题时无法定位出错阶段；也说不清 <code>main<\/code> 在整个程序里处于什么位置。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>预处理阶段<\/strong>：处理以 <code>#<\/code> 开头的指令。<code>#include<\/code> 把头文件内容插入当前文件位置，<code>#define<\/code> 做宏替换；这一阶段不检查 C 语法，只做文本展开。<\/p>\n<p><strong>编译阶段<\/strong>：把展开后的 C 文本翻译成汇编代码，再汇编成目标代码（机器码）。目标代码里已经有本文件函数的机器指令，但调用外部函数的位置还留着未绑定的符号。<\/p>\n<p><strong>链接阶段<\/strong>：链接器把本文件目标代码、其他目标文件与库代码合并，按符号名找到每个函数与变量的实际地址，填进调用位置，生成可执行文件。<\/p>\n<p><strong>最小程序结构<\/strong>：<\/p>\n<ol><li>\n<code>#include &lt;stdio.h&gt;<\/code>：引入标准输入输出库的原型声明。\n<\/li><li>\n<code>int main(void)<\/code>：定义程序入口函数；<code>void<\/code> 表示不接收命令行参数。\n<\/li><li>\n函数体 <code>{ ... }<\/code>：写变量声明与可执行语句。\n<\/li><li>\n<code>return 0;<\/code>：把退出状态交回操作系统，0 表示正常结束。\n<\/ol>\n<p><strong>正例<\/strong>：下面程序结构完整，可编译运行：<\/p>\n<pre class=\"lang-c\"><code>#include &lt;stdio.h&gt;\n\nint main(void)\n{\n    int dogs;\n    scanf(&quot;%d&quot;, &amp;dogs);\n    printf(&quot;%d\\n&quot;, dogs);\n    return 0;\n}<\/code><\/pre>\n<p><strong>反例<\/strong>：只有一句 <code>printf(&quot;hi&quot;);<\/code> 而没有 <code>main<\/code>，编译器找不到入口；调用 <code>printf<\/code> 却不包含 <code>&lt;stdio.h&gt;<\/code>，原型缺失，参数类型不被检查。<\/p>\n<h2>原理推导<\/h2>\n<p>阶段划分的依据是职责分离：文本展开、语法翻译、符号绑定是三类不同工作，分开才能分别报错、分别复用。<\/p>\n<ol><li>\n假设源文件只有文本，没有任何翻译：CPU 取指时读到的是字母与符号，无法解码成算术或访存指令，程序不能运行。这说明必须有一步把文本换成机器码。\n<\/li><li>\n假设只翻译本文件、不做链接：<code>printf<\/code> 的机器指令不在本文件中，调用位置无法形成合法目标地址，映像不完整。这说明必须有一步把外部代码并入。\n<\/li><li>\n链接完成后，可执行映像包含：入口地址指向 <code>main<\/code> 对应机器指令；各函数调用已经绑定到具体地址；操作系统加载后从入口开始调度。\n<\/li><li>\n<code>main<\/code> 的位置由操作系统约定：它不是被另一个 C 函数调用的普通函数，而是映像入口；程序执行流从 <code>main<\/code> 第一条语句开始，<code>main<\/code> 返回后进程结束。\n<\/ol>\n<p>推导中使用的假设：目标平台按机器指令取指；库代码以目标代码形式提供；链接器按符号名解析地址。<\/p>\n<p><strong>一个完整构建推演<\/strong>。取源文件 <code>hello.c<\/code>，内容为包含 <code>&lt;stdio.h&gt;<\/code>、定义 <code>main<\/code>、调用 <code>printf<\/code>、<code>return 0<\/code> 的小程序：<\/p>\n<ol><li>\n预处理把 <code>stdio.h<\/code> 中 <code>printf<\/code> 的原型声明插入源文位置，文本展开后得到完整翻译单元。\n<\/li><li>\n编译逐行检查语法：变量名、类型、语句分号；通过后生成汇编，再汇编出目标文件，本文件内 <code>main<\/code> 的机器指令已经成型，而 <code>printf<\/code> 调用处仍是待填的符号引用。\n<\/li><li>\n链接器查标准库，找到 <code>printf<\/code> 的机器码入口地址，把引用填进调用位置；同时补齐程序启动所需的运行支持代码。\n<\/li><li>\n生成可执行文件；操作系统加载映像，跳转到入口，进入 <code>main<\/code>。\n<\/ol>\n<p>这条推演对应原书第 1 章 §1.8.1 对目标代码文件、可执行文件和库的说明：目标代码是编译器的产物，可执行文件是链接器的产物，库是可复用代码的集合。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：基于编译器+链接器的传统 C 开发流程；源文件、库文件以目标代码形式参与构建。\n<\/li><li>\n边界一：不同 IDE 把多阶段隐藏在&quot;构建&quot;按钮后，但阶段仍然存在；报错信息分属编译期或链接期。\n<\/li><li>\n边界二：头文件只提供声明与类型信息，不提供库函数机器码；机器码在链接阶段并入。\n<\/li><li>\n失败案例：漏写函数定义、只调用不实现，编译能过而链接报&quot;未定义引用&quot;；把这种链接错误当成语法错误修改源代码，方向就错了。\n<\/li><li>\n失败案例二：源文件调用 <code>printf<\/code> 却漏写 <code>#include &lt;stdio.h&gt;<\/code>。旧标准允许编译器按隐式规则猜测返回类型，现代标准下直接报错；即使勉强编译，参数个数与类型也没有原型约束，传参错位时输出乱码。这一案例说明头文件提供的是编译期检查依据，不是可有可无的装饰。\n<\/li><li>\n边界三：<code>main<\/code> 的返回类型在标准 C 中约定为 <code>int<\/code>；<code>void main()<\/code> 不是标准形式，跨平台移植时可能出问题。\n<\/li><li>\n边界四：预处理只做文本替换，不理解替换后的语义。宏替换在文本层面完成，因此宏参数不加括号时，展开后的优先级可能与书写意图不符；这一现象在第 5 章表达式求值中会再次遇到。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>编译错误 vs 链接错误<\/strong>：编译错误来自本文件语法、类型不符，发生在翻译阶段；链接错误来自符号找不到、重复定义，发生在合并阶段。前者改源文件写法，后者查函数是否实现、库是否加入。\n<\/li><li>\n<strong>头文件 vs 库文件<\/strong>：头文件放原型、类型与宏；库文件放机器码。包含头文件不等于链接了库。\n<\/li><li>\n<strong>预处理指令 vs C 语句<\/strong>：<code>#define<\/code>、<code>#include<\/code> 在翻译前展开，末尾不写分号；把预处理指令当语句加分号会引入多余字符。\n<\/li><li>\n<strong><code>main<\/code> 与普通函数<\/strong>：普通函数由其他函数调用；<code>main<\/code> 由运行环境启动，是映像入口。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无，这是全书最底层的构建视角。后继：c02 在程序处理的数据上区分类型宽度；c04 的 <code>printf<\/code>/<code>scanf<\/code> 原型来自标准库头文件；c08 的函数原型检查、多文件编译与本章阶段划分直接对应。本章解释&quot;代码怎样变成可执行映像&quot;，后续概念都建立在映像已经能被加载执行的前提上。<\/p>\n<p>理解这条链对调试的直接作用：看到一条报错，先判断它落在翻译阶段还是合并阶段，再决定是改写法还是查构建配置。编译期问题围绕本文件的语法与类型，链接期问题围绕符号是否有定义、库是否齐全；运行期问题则发生在映像加载之后，属于程序逻辑层面。三个阶段的问题不能用同一类修法处理。原书第 2 章 §2.7 区分语法错误与语义错误，语法错误多在编译期暴露，语义错误能编译通过但执行结果偏离预期；本章的阶段划分给这两类错误提供了定位坐标。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（编译链接模型与最小 C 程序结构）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：构建阶段依赖链、最小程序执行推演与报错定位<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把&quot;一个 C 文件怎样变成运行中的程序&quot;讲清楚，往回追五层：<\/p>\n<ol><li>\n机器执行层：CPU 从内存取二进制指令解码执行，只认机器码，不认 C 文本。这是整条链的终点约束。\n<\/li><li>\n翻译层：必须有一步把 C 文本换成机器码，这一步就是编译；编译前还要先把引用的头文件与宏展开，即预处理。\n<\/li><li>\n符号层：本文件机器码里调用外部函数的位置只有符号名，没有地址；必须有一步按符号名找到外部实现并填地址，这一步是链接。\n<\/li><li>\n结构层：链接出的映像需要一个约定入口，操作系统从这里启动；这个入口在 C 代码里就是 <code>main<\/code>。\n<\/li><li>\n检查层：在翻译之前，原型声明让编译器核对调用的参数个数与类型；没有原型，检查失去依据。\n<\/ol>\n<p>依赖链方向：机器只认机器码 → 需要编译翻译 → 外部符号需要链接绑定 → 映像需要入口 <code>main<\/code> → 调用关系需要原型检查。任何一层被抽掉，上层结论都站不住：没有编译就没有机器码，没有链接符号悬空，没有入口映像无法启动。<\/p>\n<p>往回再追一步：为什么 C 不直接把文本交给机器执行？因为机器指令集是固定的二进制编码，每条指令对应具体的寄存器操作与访存动作；C 文本里的关键字、表达式、语句结构是给人读的抽象表示，二者之间不存在一一对应的直接映射，必须经过翻译。为什么链接不能合并进编译一次完成？因为一个程序由多个源文件与可复用库组成，编译按文件独立进行，彼此只暴露符号名；只有全部文件编译完，才能统一安排最终映像里的地址。这两个约束决定了阶段必须分开。<\/p>\n<h2>正向推导：四个阶段各完成什么<\/h2>\n<p><strong>预处理<\/strong>。输入是 <code>.c<\/code> 源文本。逐条处理 <code>#<\/code> 指令：<code>#include &lt;stdio.h&gt;<\/code> 把该头文件内容复制到指令所在位置；<code>#define DENSITY 62.4<\/code> 把后文出现的 <code>DENSITY<\/code> 替换成 <code>62.4<\/code>。这一阶段不做类型检查，宏替换是纯文本动作。展开结果是一个完整翻译单元，文本量通常比源文件大。<\/p>\n<p><strong>编译<\/strong>。输入是展开后的翻译单元。编译器先做词法分析，把字符流切成标识符、关键字、常量、运算符；再做语法分析，按 C 语法拼成语句结构；类型检查在这一层进行：声明与使用是否一致、类型是否匹配。通过后生成汇编代码，汇编器再把汇编翻成目标代码（机器码）。目标代码包含本文件函数的指令流，外部调用处保留符号占位。<\/p>\n<p><strong>链接<\/strong>。输入是本文件目标代码、其他目标文件与库。链接器收集所有符号定义：函数名、全局变量名；再扫描所有引用，把每个符号名替换成它在最终映像中的地址。若一个引用找不到定义，报&quot;未定义引用&quot;；若同名定义出现多次，报&quot;重复定义&quot;。绑定完成后生成可执行文件。<\/p>\n<p><strong>加载与启动<\/strong>。操作系统把可执行映像读入内存，设置栈与运行环境，跳转到入口地址。入口在 C 代码中对应 <code>main<\/code> 的第一条语句；<code>main<\/code> 执行完 <code>return<\/code>，退出状态交回操作系统，进程结束。<\/p>\n<p>推导依据：阶段之间是单向流水线，上游产物是下游输入；报错信息落在哪个阶段，决定了该改源文件写法还是查构建配置。<\/p>\n<p>阶段之间的数据接口要分清：预处理交给编译的是文本；编译交给链接的是带符号占位的机器码；链接交给操作系统的是地址已绑定的完整映像。接口不清会导致把上一阶段的问题带到下一阶段去修。<\/p>\n<h2>算例一：一个含库调用的小程序构建推演<\/h2>\n<p>源文件 <code>talkback.c<\/code> 的核心结构：<\/p>\n<pre class=\"lang-c\"><code>#include &lt;stdio.h&gt;\n#define DENSITY 62.4\n\nint main(void)\n{\n    float weight, volume;\n    char name[40];\n    scanf(&quot;%s&quot;, name);\n    scanf(&quot;%f&quot;, &amp;weight);\n    volume = weight / DENSITY;\n    printf(&quot;%s %.2f\\n&quot;, name, volume);\n    return 0;\n}<\/code><\/pre>\n<p>逐步推演：<\/p>\n<ol><li>\n预处理：<code>&lt;stdio.h&gt;<\/code> 的原型插入；<code>DENSITY<\/code> 在 <code>weight / DENSITY<\/code> 处被替换成 <code>62.4<\/code>。翻译单元里出现 <code>scanf<\/code>、<code>printf<\/code> 的原型声明。\n<\/li><li>\n编译：检查 <code>main<\/code> 返回 <code>int<\/code>；两个 <code>scanf<\/code> 实参与原型对照：<code>%s<\/code> 配字符数组地址，<code>%f<\/code> 配 <code>float *<\/code>；<code>volume = weight / 62.4<\/code> 中 <code>weight<\/code> 是 <code>float<\/code>，字面量 <code>62.4<\/code> 是 <code>double<\/code>，按提升规则运算。编译通过，生成目标文件，<code>scanf<\/code>、<code>printf<\/code> 处为待绑定符号。\n<\/li><li>\n链接：从标准库找到 <code>scanf<\/code>、<code>printf<\/code> 的机器码入口，填入调用位置；运行支持代码并入。可执行文件生成。\n<\/li><li>\n启动执行：进入 <code>main<\/code>，栈上留出 <code>weight<\/code>、<code>volume<\/code>、<code>name[40]<\/code> 的空间；第一次 <code>scanf<\/code> 读名字到 <code>name<\/code>；第二次读体重到 <code>weight<\/code>；计算体积；<code>printf<\/code> 按格式输出；<code>return 0<\/code> 结束进程。\n<\/ol>\n<p>中间状态核对：预处理后 <code>DENSITY<\/code> 不再以符号出现；编译期不查 <code>scanf<\/code> 内部实现；链接期不查 C 语法。三个阶段职责互不重叠。<\/p>\n<p>把执行期变量值列出来核对：假设用户先输入 <code>Amy<\/code>，再输入 <code>130<\/code>。第一次 <code>scanf<\/code> 后 <code>name<\/code> 前三个字节为 <code>A<\/code>、<code>m<\/code>、<code>y<\/code>，第四字节为 null；第二次 <code>scanf<\/code> 后 <code>weight=130.0<\/code>；<code>volume = 130.0 / 62.4 ≈ 2.0833<\/code>；<code>printf<\/code> 按 <code>%.2f<\/code> 输出 <code>2.08<\/code>。这条链里，编译期确认类型合法，链接期确认函数可达，运行期才产生具体数值，三类问题各有归属。<\/p>\n<h2>算例二：两类报错分别落在哪一阶段<\/h2>\n<p><strong>场景 A：源文件漏写分号<\/strong>。语句 <code>printf(&quot;%d&quot;, dogs)<\/code> 末尾缺 <code>;<\/code>。编译在语法分析阶段发现语句结束位置不符合语法，报错指向该行；目标代码不会生成，链接阶段根本不会开始。定位依据：报错文本包含语法错误信息，发生在编译期。<\/p>\n<p><strong>场景 B：调用了未实现的函数 <code>lookup()<\/code><\/strong>。源代码中写 <code>int x = lookup();<\/code>，但整个工程没有 <code>lookup<\/code> 的定义。编译阶段本文件语法与类型检查通过，目标代码生成；链接扫描符号引用时找不到 <code>lookup<\/code> 的定义，报未定义引用。定位依据：编译已过、链接失败；解决方向是补上函数实现或加入包含该函数的库，而不是修改本行语法。<\/p>\n<p><strong>场景 C：头文件缺失<\/strong>。调用 <code>printf<\/code> 而未包含 <code>&lt;stdio.h&gt;<\/code>。在现代标准下，编译期因原型不可见报错；即使旧标准放行，参数类型检查也缺失，调用 <code>printf(&quot;%f&quot;, 3)<\/code> 时按错误方式传递实参，运行输出乱码。这一场景说明原型检查属于编译期防线。<\/p>\n<p>把三个场景并排看：A 的问题在翻译语法层，B 的问题在符号合并层，C 的问题在调用接口检查层。报错文本的关键词不同：语法错误、未定义引用、隐式声明；对应的排查方向分别是改写法、补实现或加库、补头文件。<\/p>\n<h2>算例三：最小程序逐语句执行状态推演<\/h2>\n<p>取第二个示例程序：<\/p>\n<pre class=\"lang-c\"><code>#include &lt;stdio.h&gt;\n\nint main(void)\n{\n    int dogs;\n    printf(&quot;How many dogs?\\n&quot;);\n    scanf(&quot;%d&quot;, &amp;dogs);\n    printf(&quot;You have %d dogs.\\n&quot;, dogs);\n    return 0;\n}<\/code><\/pre>\n<p>按执行顺序列出每一步的存储与状态：<\/p>\n<ol><li>\n映像加载，进入 <code>main<\/code>。栈帧建立，局部变量 <code>dogs<\/code> 占据一个 <code>int<\/code> 宽度区域，此时区域内是上次栈残留的不确定值，不能假定为 0。\n<\/li><li>\n第一个 <code>printf<\/code> 把字面量字符串写入标准输出，程序暂停等待。\n<\/li><li>\n用户键入数字 <code>3<\/code> 并回车。字符 <code>&#x27;3&#x27;<\/code> 进入输入缓冲；<code>scanf<\/code> 按 <code>%d<\/code> 解析：字符 <code>&#x27;3&#x27;<\/code> 的 ASCII 码减去 <code>&#x27;0&#x27;<\/code> 的 ASCII 码得到数值 3，写入 <code>dogs<\/code> 所在区域。此步之后 <code>dogs=3<\/code>。\n<\/li><li>\n第二个 <code>printf<\/code> 读取 <code>dogs<\/code> 的值 3，按 <code>%d<\/code> 转成十进制字符序列，与其余字面量拼成输出行。\n<\/li><li>\n<code>return 0<\/code>：返回值 0 交给操作系统，<code>main<\/code> 帧回收，进程结束。\n<\/ol>\n<p>核对这条推演的依据：<code>scanf<\/code> 写值需要变量地址，所以实参是 <code>&amp;dogs<\/code>；<code>printf<\/code> 取值直接写变量名即可；两个函数的原型来自 <code>&lt;stdio.h&gt;<\/code>，编译期已核对类型。若第 3 步之前读取 <code>dogs<\/code>，得到的是残留值，这正是局部变量不自动初始化的表现。<\/p>\n<p>把这条执行链与构建链对照：构建期解决&quot;指令从哪来、地址绑到哪&quot;，运行期解决&quot;变量存什么值、语句按什么次序执行&quot;。两套推演回答不同问题，不能互相替代。<\/p>\n<p>再核对一次阶段边界：<code>#include<\/code> 与 <code>#define<\/code> 的效果在进入编译前已经固定；类型检查只在编译期进行；符号绑定只在链接期进行；变量的具体数值只在运行期产生。记住这条边界，后面读到类型转换、原型检查、指针绑定时，就能判断每条规则属于哪一层约束。原书第 3 章 §3.6 提示参数与陷阱，其中一类陷阱正是格式符与类型不匹配，其根源就是把编译期类型约定与运行期内存解释混在了一起。<\/p>\n<h2>反事实推演：抽掉某一阶段会怎样<\/h2>\n<p><strong>抽掉链接阶段<\/strong>：假设编译直接出可执行映像。本文件调用 <code>printf<\/code> 的位置没有外部地址可填，映像里留下悬空引用；CPU 取指时跳到非法位置，触发访问错误。反例后果：程序无法启动，而不是输出错误数字。<\/p>\n<p><strong>抽掉原型检查<\/strong>：假设编译器不核对实参与形参。调用 <code>add(int, int)<\/code> 时少传一个参数，被调函数在帧上读到不确定值；参数类型不符时按错误宽度读取栈位置，结果随机。这说明原型不是文档，而是编译期的接口约束。<\/p>\n<p><strong>抽掉入口约定<\/strong>：假设映像不固定入口。操作系统加载后不知道从哪条指令开始，无法调度执行流；<code>main<\/code> 作为约定入口，正是为了解决&quot;从哪里启动&quot;这个问题。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>把链接错误当成语法错误<\/strong>。现象：编译过程走完，末尾报&quot;undefined reference to …&quot;。复盘：符号找不到说明合并阶段缺定义；若回头在调用行加括号、改类型，源码越改越乱。正确动作：确认函数是否写了、文件名是否加入工程、库是否链接。<\/p>\n<p><strong>以为包含头文件就等于链接库<\/strong>。头文件只给声明，机器码在库中。只 <code>#include<\/code> 而构建配置没加库，编译通过、链接报未定义引用；两类文件的分工被混淆是根因。<\/p>\n<p><strong>按缩进判断 <code>main<\/code> 的位置<\/strong>。有人把所有代码写进一个函数，却以为每个函数都会被自动执行。复盘：映像入口只有 <code>main<\/code> 一个；其他函数必须被 <code>main<\/code> 或其调用链触达，否则代码不执行。<\/p>\n<p><strong>把 <code>void main()<\/code> 当成可移植写法<\/strong>。某些环境接受 <code>void main()<\/code>，但标准 C 约定 <code>main<\/code> 返回 <code>int<\/code>；换编译器或换平台后，退出状态与启动约定可能不一致。跨平台代码应写 <code>int main(void)<\/code> 并 <code>return 0<\/code>。<\/p>\n<p><strong>忽略启动支持代码的位置<\/strong>。可执行映像里除了自己写的 <code>main<\/code> 与库函数，还有运行环境插入的启动代码：负责设置栈、收集命令行参数、调用 <code>main<\/code>、接收返回值并退出。初学者以为程序第一条语句就是自己写的代码，实际中间还有这层支持；理解这一点，才能解释为什么 <code>main<\/code> 能被外部启动、返回后进程即结束。原书第 1 章 §1.8.2 到 §1.8.6 分别说明 UNIX、GCC、Linux、PC 命令行编译器与 IDE 环境下的构建方式，环境不同只改变操作入口，阶段划分不变。<\/p>\n<p><strong>把注释当成语义内容<\/strong>。注释在预处理后的翻译单元里被去除，不进入目标代码；调试时不能依赖注释传递运行期信息。同样，空行与缩进只服务可读性，不参与机器码生成。<\/p>\n<h2>再推一层：多文件程序里的阶段分工<\/h2>\n<p>一个程序拆成两个源文件：<code>main.c<\/code> 调用 <code>helper.c<\/code> 里定义的 <code>helper()<\/code>。编译分别独立进行：<code>main.c<\/code> 编译出的目标文件里 <code>helper<\/code> 是符号占位；<code>helper.c<\/code> 编译出的目标文件里有 <code>helper<\/code> 的机器码与符号定义。链接器把两份目标代码与库合并，在 <code>main.o<\/code> 的占位处填入 <code>helper<\/code> 的最终地址。多文件情况下，编译互不依赖，链接是唯一的合并点；这解释了为什么改一个函数实现只需重编对应文件，再重新链接，而不必重写全部代码。<\/p>\n<p>这一层还能解释头文件的分工：两个文件共享的类型声明、函数原型放进头文件，两边 <code>#include<\/code> 后看到同一份接口描述；函数的机器码各自编译成目标文件，在链接时汇合。声明与定义分离，正是为了让独立编译成为可能。<\/p>\n<h2>阶段产物与判据对照<\/h2>\n<p>把四个阶段的输入、产物、常见问题并排列出，便于遇到报错时反查归属：<\/p>\n<ol><li>\n预处理：输入源文本，产物展开后的翻译单元。常见问题是宏未展开、头文件路径找不到；判据是替换结果里是否还残留宏名。\n<\/li><li>\n编译：输入翻译单元，产物目标代码与汇编。常见问题是语法错误、类型不匹配、原型缺失；判据是报错行号落在源码哪一行，错误关键词是语法还是类型。\n<\/li><li>\n链接：输入目标文件与库，产物可执行映像。常见问题是未定义引用、重复定义、库未加入；判据是编译已完成、报错发生在合并阶段。\n<\/li><li>\n加载启动：输入映像，产物运行中的进程。常见问题是入口找不到、运行期段错误；判据是程序能启动但执行逻辑出错，属于调试层面而非构建层面。\n<\/ol>\n<p>这套对照的用处是定位优先级：先看报错发生在哪一步，再决定改源码、改构建配置还是调逻辑。把链接期问题当成编译期问题修改，是初学者最常见的返工来源；反过来，把运行期数值错误当成链接问题，也会在构建配置上白费时间。<\/p>\n<p>再看命令行流程与 IDE 流程的对应关系。命令行下，编译器程序先调预处理再编译汇编，链接器单独把目标文件拼成映像；IDE 把这些动作收进&quot;构建&quot;菜单，后台仍按同一顺序执行。菜单显示&quot;编译通过&quot;只代表目标代码生成，不代表链接完成；显示&quot;构建成功&quot;才表示映像已生成。两个按钮或两个步骤的差别，对应本章流水线里的不同节点。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n能否不看资料，按顺序说出预处理、编译、汇编、链接、加载启动各自产出什么？\n<\/li><li>\n给定一条报错，能否判断它属于编译期还是链接期？判断依据是报错出现在哪个阶段之后？\n<\/li><li>\n为什么 <code>printf<\/code> 的机器码不在自己的目标文件里？它是在哪一步并入映像的？\n<\/li><li>\n<code>main<\/code> 和自定义函数在&quot;谁调用谁&quot;上有什么差别？\n<\/li><li>\n头文件提供声明还是机器码？库提供哪一个？\n<\/li><li>\n漏写分号与漏写函数定义，报错阶段各是什么？\n<\/li><li>\n多文件工程里，为什么改一个函数只需重编对应文件再链接？\n<\/ol>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n画出从源文件到进程结束的阶段流水线，标出每阶段输入与产物。\n<\/li><li>\n一个工程编译成功但链接失败，列出三种可能的原因与对应排查动作。\n<\/li><li>\n为什么原型声明属于编译期检查，而不是链接期检查？\n<\/li><li>\n操作系统加载可执行文件后，第一条执行的语句在代码里对应哪里？\n<\/li><li>\n宏替换在哪一阶段完成？这一阶段为什么不做类型检查？\n<\/li><li>\n两个源文件共享同一函数的原型，声明放在哪里、定义放在哪里？链接阶段把什么填进调用位置？\n<\/ol><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.109<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">编译链接模型与最小 C 程序结构<\/a><\/span><\/div><h1>基本数据类型、位宽与整数取值范围<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书第 3 章 §3.4，PDF 第 109 页起）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>C 的基本类型规定一块内存的位宽与二进制解释方式：整数系列按补码解释，浮点系列按 IEEE 浮点数格式解释；位宽决定取值上下界，类型选择就是在范围、精度与存储代价之间取舍。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>程序要存数字、字符与文字，困难在于同样一串二进制位，按不同类型解释会得到完全不同的结果。不先定类型，编译器不知道给变量留多大空间、按什么规则解码；写表达式时也无法判断运算结果是否溢出。具体困难有三类：一是数值超出类型范围后按什么规则回绕或截断；二是 <code>char<\/code>、<code>int<\/code>、<code>long<\/code> 在不同平台宽度不一致，代码怎样保持可移植；三是整数除法、字符编码与布尔真值各自由哪类类型承载。本章把类型拆成位宽与解释规则两层，后续字符串、表达式转换、指针算术都建立在这套宽度结论上。<\/p>\n<p>不区分宽度与解释，会出现两类典型错误：一类是存储安排错误，给小范围数据留了过宽空间，或给大范围数据留窄了位置；另一类是解码错误，位串按错误类型读出，数值看似随机。两类错误在编译期不一定都能拦住，因此写代码前先定类型，比出错后反推更省成本。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>位宽<\/strong>：类型在内存中占据的二进制位数，通常以字节为单位报告；<code>sizeof(类型)<\/code> 返回该类型对象占用的字节数。位宽由实现定义，标准只规定各类型之间的最小宽度次序，不规定每个类型的绝对字节数。<\/p>\n<p><strong>整数系列<\/strong>：<\/p>\n<ul><li>\n<code>int<\/code>：默认有符号整数类型，是平台算术效率最高的整数宽度。\n<\/li><li>\n<code>short<\/code>、<code>long<\/code>、<code>long long<\/code>：更窄或更宽的有符号整数变体，宽度依次不小于 <code>int<\/code> 的对应次序。\n<\/li><li>\n<code>unsigned<\/code> 前缀：无符号解释，所有位都计入数值，按模 <span class=\"katex-inline\">2^w<\/span> 回绕。\n<\/li><li>\n<code>char<\/code>：存放字符编码的最小整数类型；是否默认可 signed 由实现决定。\n<\/li><li>\n<code>_Bool<\/code>：只存 0 与 1 的布尔类型。\n<\/ul>\n<p><strong>浮点系列<\/strong>：<code>float<\/code> 单精度、<code>double<\/code> 双精度、<code>long double<\/code> 扩展精度；二进制位分成符号位、指数位与尾数位，能表示很大范围的数，但小数部分以精度为代价。<\/p>\n<p><strong>字面量与变量<\/strong>：<code>12<\/code> 是 <code>int<\/code> 字面量，<code>3.14<\/code> 是 <code>double<\/code> 字面量，<code>&#x27;A&#x27;<\/code> 是字符常量；变量声明时写明类型，后续每次读写都按该类型解释其存储区。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-c\"><code>int age = 20;\nunsigned int count = 100;\ndouble price = 19.9;\nchar grade = &#x27;A&#x27;;<\/code><\/pre>\n<p><strong>反例<\/strong>：把超出 <code>int<\/code> 范围的大数直接赋给 <code>int<\/code>，结果按溢出规则处理；把字符与整数混作语义相同的量时，忽略编码差值会得到错误比较结果。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>有符号范围推导<\/strong>。位宽 <span class=\"katex-inline\">w<\/span> 时，最高位为符号位，剩 <span class=\"katex-inline\">w-1<\/span> 位表数值。非负侧最大值为 <span class=\"katex-inline\">2^{w-1}-1<\/span>：<span class=\"katex-inline\">k=w-1<\/span> 位全 1 对应 <span class=\"katex-inline\">2^k-1<\/span>。负侧最小值为 <span class=\"katex-inline\">-2^{w-1}<\/span>：补码下符号位为 1、数值位全 0 的编码约定给最小负数。因此有符号范围 <span class=\"katex-inline\">[-2^{w-1},\\ 2^{w-1}-1]<\/span>。<\/p>\n<p><strong>无符号范围推导<\/strong>。<span class=\"katex-inline\">w<\/span> 位全部计入数值，最小值 0，最大值 <span class=\"katex-inline\">2^w-1<\/span>；运算结果按模 <span class=\"katex-inline\">2^w<\/span> 回绕，超过上界从 0 重新计。<\/p>\n<p><strong>浮点表示的边界<\/strong>。<code>double<\/code> 的位分成符号、指数、尾数三段；指数负责量级，尾数负责精度。它能表示的数值范围远大于同宽整数，但相邻可表示数在大数区间变稀疏，小数运算存在舍入误差。比较两个浮点是否相等，不能直接按全等判断。<\/p>\n<p><strong>宽度次序的依据<\/strong>。标准要求 <code>short<\/code> 宽度不超过 <code>int<\/code>，<code>int<\/code> 不超过 <code>long<\/code>，<code>long<\/code> 不超过 <code>long long<\/code>；具体字节数用 <code>sizeof<\/code> 在目标平台实测。可移植代码不应假定 <code>int<\/code> 一定是 4 字节，需要固定宽度时用 <code>stdint.h<\/code> 提供的 <code>int32_t<\/code> 一类类型。<\/p>\n<p><strong>常见类型用途对照<\/strong>：计数与普通整数用 <code>int<\/code>；字符编码用 <code>char<\/code>；真假状态用 <code>_Bool<\/code>；需要跨平台固定 32 位存整数用 <code>int32_t<\/code>；金额测量与科学计算用 <code>double<\/code>；批量节省存储且精度要求不高时才选 <code>float<\/code>。选择顺序是先定数值范围，再定精度需求，末尾看存储代价，而不是先挑一个最熟的类型。<\/p>\n<p><strong>字符编码的边界<\/strong>。<code>char<\/code> 存放的是字符的编码值：十进制数字字符 <code>&#x27;0&#x27;<\/code> 到 <code>&#x27;9&#x27;<\/code> 编码连续为 48 到 57，大写字母、小写字母各自连续。字符常量在算术表达式中提升为 <code>int<\/code> 参与运算，因此 <code>&#x27;A&#x27; + 1<\
