<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>

"c03"], "depthFragment": "concepts/c04-depth.md"}, {"id": "c05", "title": "运算符优先级、求值顺序与类型转换", "file": "concepts/c05.md", "chapterIds": ["ch02"], "difficulty": "进阶", "source": {"file": "library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 239}, "prerequisites": ["c02"], "depthFragment": "concepts/c05-depth.md"}, {"id": "c06", "title": "循环结构、关系真值与循环不变式", "file": "concepts/c06.md", "chapterIds": ["ch03"], "difficulty": "基础", "source": {"file": "library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 321}, "prerequisites": ["c05"], "depthFragment": "concepts/c06-depth.md"}, {"id": "c07", "title": "分支跳转、逻辑短路与 switch 匹配规则", "file": "concepts/c07.md", "chapterIds": ["ch03"], "difficulty": "进阶", "source": {"file": "library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 407}, "prerequisites": ["c06"], "depthFragment": "concepts/c07-depth.md"}, {"id": "c08", "title": "函数原型、栈帧结构与递归执行", "file": "concepts/c08.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 562}, "prerequisites": ["c01", "c05"], "depthFragment": "concepts/c08-depth.md"}, {"id": "c09", "title": "指针、数组与指针算术", "file": "concepts/c09.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf", "page": 641}, "prerequisites": ["c08"], "depthFragment": "concepts/c09-depth.md"}], "glossary": [{"term": "目标代码文件", "def": "源文件经编译产生的机器码文件，尚不能直接运行，需要链接器与库及其他目标文件合并。", "chapterId": "ch01"}, {"term": "可执行文件", "def": "链接阶段把目标代码与库代码按符号地址绑定后生成、可被操作系统加载运行的文件。", "chapterId": "ch01"}, {"term": "类型宽度（位宽）", "def": "某类型在内存中占据的二进制位数；位宽决定取值上下界，同一类型在不同平台宽度可能不同。", "chapterId": "ch01"}, {"term": "null 字符（'\\0'）", "def": "值为 0 的字符，作为字符串结束标志；字符数组末尾必须有它，字符串函数才知道何时停止。", "chapterId": "ch02"}, {"term": "转换说明", "def": "printf/scanf 格式串中以 % 开头的片段，规定对应参数的类型、宽度与精度。", "chapterId": "ch02"}, {"term": "运算符优先级", "def": "决定表达式中各运算符先后结合次序的规则表；同级再按结合性决定从左或从右分组。", "chapterId": "ch02"}, {"term": "隐式类型转换", "def": "混合类型表达式中，编译器按规则把较窄类型提升为较宽类型后再运算，不需要显式书写转换。", "chapterId": "ch02"}, {"term": "循环不变式", "def": "每次循环开始前都成立的断言；用它可以验证循环做对了什么、退出时得到什么结果。", "chapterId": "ch03"}, {"term": "短路求值", "def": "逻辑与、逻辑或在已能确定结果时不再计算右侧操作数的求值方式，右侧表达式可能不执行。", "chapterId": "ch03"}, {"term": "缓冲区", "def": "在设备与程序之间暂存输入输出字符的内存区域；缓冲输入下，字符敲入换行后才交给程序读取。", "chapterId": "ch03"}, {"term": "函数原型", "def": "在调用前声明函数名、返回类型与各形参类型的语句；编译器据此检查参数个数与类型是否匹配。", "chapterId": "ch04"}, {"term": "栈帧", "def": "一次函数调用在栈上分配的一块区域，存放形参、返回地址与局部变量；调用返回后该帧被回收。", "chapterId": "ch04"}, {"term": "指针算术", "def": "对指针做加减、求差等运算时，步长按指向元素的大小缩放；差值以元素个数为单位。", "chapterId": "ch04"}, {"term": "数组越界", "def": "访问下标落在数组声明范围之外的元素；地址计算合法不代表访问合法，越界结果未定义。", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [], "flashcards": []}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.26<\/div><h1>第 1–3 章：初识 C 语言、程序结构与数据类型<\/h1>\n<blockquote>对应原书第 1–3 章（第 1 章 PDF 第 26 页起，第 2 章 PDF 第 66 页起，第 3 章 PDF 第 109 页起；本 PDF 物理页序与印刷页一致，已用三个章首页脚注互核，偏移 0）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n画出一个 <code>.c<\/code> 源文件经过预处理、编译、汇编、链接到可执行文件的各阶段产物。\n<\/li><li>\n说出最小 C 程序的组成部分：头文件包含、<code>main<\/code> 函数、声明、语句、返回值。\n<\/li><li>\n区分变量与常量，识别 <code>int<\/code>、<code>char<\/code>、<code>float<\/code>、<code>double<\/code> 等基本类型的用途。\n<\/li><li>\n按类型位宽推导有符号整数与无符号整数的取值上下界。\n<\/li><li>\n解释为什么 C 程序必须先编译链接、不能直接被机器执行。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>C 程序是写给人读、最终交给机器执行的文本：编译器把文本翻译成机器码，链接器把机器码拼成可执行文件；程序里处理的每一个数据，都要先选定类型，类型决定它占多少位、能表示什么范围的数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念：编译链接流程（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。原书第 1 章 §1.8 先说明目标代码文件、可执行文件和库的分工：源文件经过编译器生成目标代码，目标代码还不能直接运行；链接器把目标代码与库代码合并，补上函数调用对应的机器地址，才得到可执行文件。第 2 章 §2.2 从一个完整示例出发，逐行说明 <code>#include<\/code>、<code>main<\/code>、声明语句与 <code>printf<\/code> 的位置。<\/p>\n<h3>2. 概念：最小程序的结构（难度：基础）<\/h3>\n<p>一个能编译运行的 C 程序，骨架固定为：包含标准输入输出头文件，定义 <code>main<\/code> 函数，函数体内写声明与语句，<code>main<\/code> 返回整数状态。下面是原书一类入门程序的标准形态：<\/p>\n<pre class=\"lang-c\"><code>#include &lt;stdio.h&gt;\n\nint main(void)\n{\n    int dogs;\n    printf(&quot;How many dogs do you have?\\n&quot;);\n    scanf(&quot;%d&quot;, &amp;dogs);\n    printf(&quot;You have %d dogs.\\n&quot;, dogs);\n    return 0;\n}<\/code><\/pre>\n<p><code>main<\/code> 是程序执行的入口；操作系统从 <code>main<\/code> 的第一条语句开始调度；<code>return 0<\/code> 把退出状态交回操作系统，0 表示正常结束。<\/p>\n<h3>3. 概念：基本数据类型与取值范围（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。原书第 3 章 §3.4 把类型分成整数系列（<code>int<\/code>、<code>short<\/code>、<code>long<\/code>、<code>char<\/code>、<code>_Bool<\/code>）与浮点数系列（<code>float<\/code>、<code>double<\/code>、<code>long double<\/code>）。类型不是语法装饰：它决定变量占几个字节、二进制位怎么解释、能存多大范围的值。声明一个变量，就是在内存里划出一块按该类型解释的区域。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[.c 源文件文本] --&gt; B[预处理: 展开 #include 与宏]\nB --&gt; C[编译: 翻译为汇编/目标代码]\nC --&gt; D[目标代码 .o/.obj]\nD --&gt; E[链接: 合并库代码, 绑定符号地址]\nE --&gt; F[可执行文件]\nF --&gt; G[操作系统加载执行, 进入 main]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这条链断在 C 步，源文件只是文本，机器无法直接理解；断在 E 步，目标代码里调用的库函数还没有地址，无法形成完整可执行映像。<\/p>\n<h2>推导一：从二进制位宽推导有符号整数的取值范围<\/h2>\n<p>取一个位宽为 <span class=\"katex-inline\">w<\/span> 的有符号整数类型，二进制最高位约定为符号位：0 表示非负，1 表示负。剩下 <span class=\"katex-inline\">w-1<\/span> 位表示数值部分。<\/p>\n<ol><li>\n非负方向：<span class=\"katex-inline\">w-1<\/span> 位全 1 时数值最大，最大值为 <span class=\"katex-inline\">2^{w-1}-1<\/span>。理由是 <span class=\"katex-inline\">k<\/span> 位二进制能表示的最大非负数是 <span class=\"katex-inline\">2^k-1<\/span>，这里 <span class=\"katex-inline\">k=w-1<\/span>。\n<\/li><li>\n负方向：补码表示下，最小负值为 <span class=\"katex-inline\">-2^{w-1}<\/span>。理由是符号位为 1、数值位全 0 的编码被约定给最小负数，比正数侧多表示一个值。\n<\/li><li>\n因此有符号范围为 <span class=\"katex-inline\">[-2^{w-1},\\ 2^{w-1}-1]<\/span>。\n<\/li><li>\n同一 <span class=\"katex-inline\">w<\/span> 位若按无符号解释，所有位都算数值位，范围为 <span class=\"katex-inline\">[0,\\ 2^w-1]<\/span>。\n<\/ol>\n<p>以常见 32 位 <code>int<\/code> 为例：<span class=\"katex-inline\">w=32<\/span>，有符号范围 <span class=\"katex-inline\">[-2^{31},\\ 2^{31}-1]<\/span>，即 <span class=\"katex-inline\">[-2147483648,\\ 2147483647]<\/span>；无版本（<code>unsigned int<\/code>）范围 <span class=\"katex-inline\">[0,\\ 4294967295]<\/span>。这个推导只依赖位宽与补码约定，不依赖具体编译器。<\/p>\n<h2>推导二：一个入门程序的执行推演<\/h2>\n<p>对上面的 <code>dogs<\/code> 程序逐步列出执行过程：<\/p>\n<ol><li>\n操作系统加载可执行文件，跳转到 <code>main<\/code>，在栈上为局部变量 <code>dogs<\/code> 留出 <code>int<\/code> 宽度的存储区。\n<\/li><li>\n<code>printf<\/code> 把提示文字写入标准输出；程序暂停，等待输入。\n<\/li><li>\n用户输入数字（例如 3）并回车；<code>scanf(&quot;%d&quot;, &amp;dogs)<\/code> 按十进制解析字符序列，把 3 写入 <code>dogs<\/code> 对应的存储区。\n<\/li><li>\n第二个 <code>printf<\/code> 取出 <code>dogs<\/code> 的值 3，按 <code>%d<\/code> 格式化后输出。\n<\/li><li>\n<code>return 0<\/code> 把 0 交回操作系统，<code>main<\/code> 的栈帧回收，程序结束。\n<\/ol>\n<p>推演中每一步的依据：<code>scanf<\/code> 的 <code>%d<\/code> 规定把字符按十进制整数解释；<code>&amp;dogs<\/code> 给出变量地址，函数才能把值写回原变量；<code>printf<\/code> 的 <code>%d<\/code> 按整数格式读出该地址处的值。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉 <code>#include &lt;stdio.h&gt;<\/code><\/strong>：<code>printf<\/code>、<code>scanf<\/code> 的原型未声明。旧标准下编译器可能按默认规则猜测返回类型，函数参数个数与类型不做检查；现代编译器直接报错。反例场景：漏写头文件后调用 <code>printf(&quot;%f&quot;, x)<\/code>，原型缺失导致编译器不知道参数应按浮点传递，值按错误寄存器或栈位置读取，输出乱码。\n<\/li><li>\n<strong>把 <code>int dogs;<\/code> 改成不初始化就直接使用<\/strong>：局部变量初始值不确定，读取它属于未定义行为。反例：去掉 <code>scanf<\/code> 直接 <code>printf(&quot;%d&quot;, dogs)<\/code>，<code>dogs<\/code> 所在栈区残留旧值，每次运行结果可能不同。\n<\/li><li>\n<strong>把有符号 <code>int<\/code> 换成 <code>unsigned int<\/code><\/strong>：负数解释规则改变。若程序里出现 <code>dogs = -1<\/code>，无符号类型按模 <span class=\"katex-inline\">2^w<\/span> 解释，-1 变成 <span class=\"katex-inline\">2^w-1<\/span>，后续比较与输出全部偏离预期。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p>把编译链接流程类比成印一本书：源文件是作者手稿，预处理是把引用的章节拼进文稿，编译是排成印刷厂能照排的版样，链接是把正文、插图与目录拼成完整成书；读者（操作系统）拿到的是装订好的书，不是散落的手稿。类型宽度类比成抽屉格数：格数固定，能放的东西大小就被限定；想放超出范围的值，要么溢出回绕，要么截断出错。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解一：源文件双击就能运行<\/strong>。C 文本需要编译链接生成可执行文件后，操作系统才能加载；看到的源码本身不是机器指令。\n<\/li><li>\n<strong>误解二：类型只影响显示格式<\/strong>。类型同时决定存储宽度、二进制解释方式与取值范围；格式符用错会按错误宽度读取内存。\n<\/li><li>\n<strong>误解三：变量声明后自动清零<\/strong>。局部自动变量不会自动初始化，全局静态变量才被初始化为 0；不能假定局部变量初值为 0。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n列出从 <code>.c<\/code> 文件到可执行文件的四个阶段，各阶段产物是什么。\n<\/li><li>\n16 位有符号整数的最大值与最小值各是多少？写出推导过程。\n<\/li><li>\n为什么调用 <code>scanf<\/code> 时要写 <code>&amp;dogs<\/code>，而调用 <code>printf<\/code> 时直接写 <code>dogs<\/code>？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\n<code>main<\/code> 是程序入口，<code>return 0<\/code> 表示正常退出。\n<\/li><li>\n类型决定位宽、二进制解释与取值范围；位宽 <span class=\"katex-inline\">w<\/span> 决定上下界。\n<\/li><li>\n目标代码必须经过链接合并库代码，才能成为可执行文件。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章把程序从文本到执行的骨架搭起来。下一章（第 4–5 章）在这个骨架上处理两类具体数据：字符串怎样存放在字符数组里、<code>printf<\/code>/<code>scanf<\/code> 怎样按格式绑定参数；同时进入运算符与表达式，研究一条语句内部的求值次序。本章的类型宽度结论，是后面隐式类型转换与指针算术的计算基础。<\/p>", "kind": "chapter", "title": "第 1–3 章：初识 C 语言、程序结构与数据类型"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.174<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1–3 章：初识 C 语言、程序结构与数据类型<\/a><\/span><\/div><h1>第 4–5 章：字符串与格式化输入/输出、运算符与表达式<\/h1>\n<blockquote>对应原书第 4–5 章（第 4 章 PDF 第 174 页起，第 5 章 PDF 第 239 页起；物理页序与印刷页一致，偏移 0）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n画出字符数组的内存布局，标出每个字符与末尾的 null 字符位置。\n<\/li><li>\n手算一个字符串的 <code>strlen<\/code>，并说清它为什么不把 null 计入长度。\n<\/li><li>\n按格式串逐个匹配 <code>printf<\/code>/<code>scanf<\/code> 的转换说明与参数。\n<\/li><li>\n写出含乘除模、自增与比较的表达式求值顺序，区分优先级与结合性。\n<\/li><li>\n判断混合类型表达式中隐式转换的方向，识别整数除法与浮点除法的差别。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>字符串是靠末尾 null 字符收尾的字符序列；格式化输入输出靠格式串里的转换说明规定参数类型；表达式的结果由优先级、结合性与类型转换共同决定，不按书写顺序从左到右一概而论。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念：字符数组与 null 终止（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。原书第 4 章 §4.2 说明：字符串存放在 <code>char<\/code> 类型数组中，末尾追加一个空字符 <code>&#x27;\\0&#x27;<\/code>（即数值 0）作为结束标志。<code>strlen()<\/code> 从数组首元素逐个计数，直到遇到 null 为止，null 本身不计入长度。<\/p>\n<h3>2. 概念：格式串与参数绑定（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。原书第 4 章 §4.4 把 <code>printf()<\/code> 与 <code>scanf()<\/code> 作为一对交互函数。格式串中的普通字符原样输出或原样匹配；<code>%<\/code> 开头的转换说明决定下一个参数按什么类型解释：<code>%d<\/code> 对应 <code>int<\/code>，<code>%f<\/code> 对应 <code>float<\/code>（<code>double<\/code> 在变参中提升），<code>%s<\/code> 对应字符数组地址，<code>%c<\/code> 对应单个字符。<\/p>\n<h3>3. 概念：运算符优先级与类型转换（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。原书第 5 章 §5.2 给出赋值、加减、乘除、求模的优先级关系；§5.3 讲解 <code>sizeof<\/code>、<code>%<\/code>、<code>++<\/code>、<code>--<\/code>；§5.5 说明类型转换。优先级决定先算哪一对，结合性决定同级从哪一侧分组；混合类型运算时窄类型先提升为宽类型。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[字符数组首地址] --&gt; B[字符1]\nB --&gt; C[字符2]\nC --&gt; D[...]\nD --&gt; E[字符n]\nE --&gt; F[&#x27;\\0&#x27; 结束标志]\nG[格式串 %d %f %s] --&gt; H[逐个匹配后续参数]\nI[表达式] --&gt; J[优先级分组]\nJ --&gt; K[结合性定次序]\nK --&gt; L[类型提升后求值]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：字符串遍历断在 F 步——缺少 null 时函数不知道何处停止，会继续读到数组外部内存；表达式求值断在 J 步——不先分组，同级与跨级运算的先后就无法确定。<\/p>\n<h2>推导一：strlen 遍历推演与内存计数<\/h2>\n<p>设字符数组声明为 <code>char name[40];<\/code>，存入内容 <code>Amy<\/code>。内存布局按地址递增排列：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>下标<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4…39<\/th><\/tr><\/thead><tbody><tr><td>内容<\/td><td><code>A<\/code><\/td><td><code>m<\/code><\/td><td><code>y<\/code><\/td><td><code>\\0<\/code><\/td><td>未使用<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>strlen<\/code> 的推演过程：<\/p>\n<ol><li>\n指针从下标 0 开始，内容 <code>&#x27;A&#x27;<\/code> 不是 null，计数 1，前进到下标 1。\n<\/li><li>\n下标 1 内容 <code>&#x27;m&#x27;<\/code> 不是 null，计数 2，前进到下标 2。\n<\/li><li>\n下标 2 内容 <code>&#x27;y&#x27;<\/code> 不是 null，计数 3，前进到下标 3。\n<\/li><li>\n下标 3 内容 <code>&#x27;\\0&#x27;<\/code>，停止；返回计数 3。\n<\/li><li>\n结论：<code>strlen(&quot;Amy&quot;) == 3<\/code>，数组实际占用 4 个字节存有效内容与结束标志。\n<\/ol>\n<p>推演依据：null 的数值是 0，与字符 <code>&#x27;0&#x27;<\/code>（ASCII 48）不同；计数只在遇到 0 值字符时终止。<\/p>\n<h2>推导二：一条混合表达式的求值顺序推演<\/h2>\n<p>取表达式：<\/p>\n<pre class=\"lang-c\"><code>int a = 7, b = 2;\ndouble r = a / b + 3.5;<\/code><\/pre>\n<p>分步推演：<\/p>\n<ol><li>\n<code>/<\/code> 优先级高于 <code>+<\/code>，先分组为 <code>(a / b) + 3.5<\/code>。\n<\/li><li>\n<code>a / b<\/code> 两侧都是 <code>int<\/code>，按整数除法计算：<code>7 / 2 = 3<\/code>，小数部分丢弃。\n<\/li><li>\n进入加法前，左侧 <code>3<\/code>（<code>int<\/code>）提升为 <code>double<\/code>，与 <code>3.5<\/code> 相加：<code>3.0 + 3.5 = 6.5<\/code>。\n<\/li><li>\n结果 <code>r = 6.5<\/code>。\n<\/ol>\n<p>再看一条自增与比较混合的语句：<code>x = 2; y = x++ <em> 3;<\/code>。<code>x++<\/code> 是后置自增：表达式里先取 <code>x<\/code> 当前值 2 参与乘法，<code>y = 2 <\/em> 3 = 6<\/code>；该表达式结束后 <code>x<\/code> 再加 1，变为 3。依据是后置自增的取值规则：返回旧值，副作用在序列点前完成。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉字符串末尾的 null<\/strong>：<code>strlen<\/code>、<code>puts<\/code>、<code>%s<\/code> 输出都不会在数组边界处停下，继续读到后续内存字节直到偶然遇到一个 0 值。反例：数组里存了 <code>&quot;Amy&quot;<\/code> 却没写 <code>&#x27;\\0&#x27;<\/code>，输出可能带上相邻内存里的乱码字符。\n<\/li><li>\n<strong>把 <code>%d<\/code> 与浮点参数配错<\/strong>：格式串按 <code>int<\/code> 宽度读取浮点值所在位置，位模式被错误解释。反例：<code>printf(&quot;%d\\n&quot;, 3.14);<\/code> 不会输出 3，而是把 <code>double<\/code> 的位模式按整数规则拆读，得到无意义整数。\n<\/li><li>\n<strong>把整数除法改成两侧强制浮点<\/strong>：<code>(double)a / b<\/code> 中 <code>a<\/code> 先转 <code>double<\/code>，<code>b<\/code> 随之提升，<code>7.0 / 2.0 = 3.5<\/code>；与原整数除法 <code>3<\/code> 的差别就落在内侧除法是否先提升类型。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p>字符串结尾的 null 像一段录音的结束标记：没有标记，播放器会一直往下读隔壁轨道。格式串像点菜单上的暗号：厨房按暗号顺序取食材，暗号与食材对不上，上的菜就错。整数除法像把饼干平分给人，零头直接收走；浮点除法把零头折算成小数继续算。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解一：<code>strlen<\/code> 返回数组占用字节数<\/strong>。它返回有效字符个数，不含 null；数组声明宽度与字符串长度是两个量。\n<\/li><li>\n<strong>误解二：<code>++x<\/code> 与 <code>x++<\/code> 在所有位置等价<\/strong>。后置自增返回旧值，前置自增返回新值；在赋值表达式右侧混用时差别直接影响结果。\n<\/li><li>\n<strong>误解三：混合类型一定先转成更窄类型<\/strong>。规则方向相反：窄类型提升为宽类型，避免精度先损失再补回。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n写出 <code>char s[10] = &quot;hi&quot;;<\/code> 的内存表，标出下标 0、1、2 的内容，并给出 <code>strlen(s)<\/code>。\n<\/li><li>\n表达式 <code>17 % 5 + 8 / 3<\/code> 按什么次序计算，结果是多少？\n<\/li><li>\n为什么 <code>printf(&quot;%f\\n&quot;, 5 / 2);<\/code> 与 <code>printf(&quot;%f\\n&quot;, 5.0 / 2);<\/code> 输出不同？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\n字符串靠 <code>&#x27;\\0&#x27;<\/code> 收尾，<code>strlen<\/code> 不计 null。\n<\/li><li>\n转换说明与参数按位置一一绑定，类型必须匹配。\n<\/li><li>\n优先级先分组，结合性定同级次序，混合运算先做类型提升。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章的数据存放与格式化输入输出，为下一章的控制流提供输入手段：循环与分支需要反复读取字符、判断条件。第 5 章的表达式求值规则，是第 6 章循环条件、第 7 章分支条件的判断依据；类型提升结论也会在函数参数传递（第 9 章）与指针算术（第 10 章）中再次出现。<\/p>", "kind": "chapter", "title": "第 4–5 章：字符串与格式化输入/输出、运算符与表达式"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.313<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 4–5 章：字符串与格式化输入/输出、运算符与表达式<\/a><\/span><\/div><h1>第 6–8 章：循环、分支跳转、字符输入/输出与输入验证<\/h1>\n<blockquote>对应原书第 6–8 章（第 6 章 PDF 第 313 页起，第 7 章 PDF 第 407 页起，第 8 章 PDF 第 497 页起；物理页序与印刷页一致，偏移 0）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n为一段计数循环写出循环不变式，说明退出条件与退出时得到的结果。\n<\/li><li>\n区分 <code>while<\/code>、<code>for<\/code>、<code>do while<\/code> 的入口条件与出口条件位置。\n<\/li><li>\n解释 <code>if<\/code>/<code>else<\/code> 配对规则、逻辑运算符短路顺序与 <code>switch<\/code> 的 <code>break<\/code> 落点。\n<\/li><li>\n说明缓冲输入下字符何时交到程序，以及文件结尾（EOF）如何判定。\n<\/li><li>\n设计输入验证流程：先读入字符流，再拒绝非法值并把剩余字符清出缓冲区。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>循环靠不变式保证每一圈积累的状态正确；分支靠配对规则与短路顺序确定走哪条路；字符 I/O 经过缓冲区与流层，程序读到的是缓冲区里暂存的内容，结尾靠 EOF 标志而不是某个特殊字符。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念：三种循环与循环不变式（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。原书第 6 章 §6.2 讲 <code>while<\/code>（入口条件循环：先判断后执行），§6.5 讲 <code>for<\/code>（初始化、判断、步进写在一行），§6.8 讲 <code>do while<\/code>（出口条件循环：先执行后判断）。循环不变式是每次进入循环体前都成立的断言，用来核对积累状态是否正确。<\/p>\n<h3>2. 概念：分支、短路与 switch（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。原书第 7 章 §7.1–7.2 讲 <code>if<\/code> 与 <code>if else<\/code>，§7.3 讲逻辑运算符 <code>&amp;&amp;<\/code>、<code>||<\/code>、<code>!<\/code>，§7.7 讲 <code>switch<\/code>。<code>else<\/code> 与最近的未配对 <code>if<\/code> 结合；逻辑与、逻辑或在结果已定时不再算右侧；<code>switch<\/code> 按表达式值匹配标签，没有 <code>break<\/code> 会继续向下贯穿。<\/p>\n<h3>3. 概念：缓冲区、EOF 与输入验证（难度：基础）<\/h3>\n<p>原书第 8 章 §8.1 讲 <code>getchar()<\/code>/<code>putchar()<\/code>，§8.2 讲缓冲区，§8.3 讲文件结尾，§8.6 讲输入验证。标准输入默认缓冲：用户敲回车后，整行字符进入缓冲区，程序逐个读取。读到文件结尾时 <code>getchar()<\/code> 返回 <code>EOF<\/code>（一个负整型常量），用它判断输入是否结束。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[读取字符] --&gt; B{缓冲区内有字符?}\nB -- 有 --&gt; C[getchar 取一个字符]\nC --&gt; D{是 EOF?}\nD -- 否 --&gt; E[条件判断/循环体]\nE --&gt; A\nD -- 是 --&gt; F[结束处理]\nB -- 无 --&gt; G[等待回车提交整行]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：控制流断在 D 步——不识别 EOF，程序会把结束标志当普通字符处理；断在 G 步——把缓冲输入当成即时输入，会误解字符为何迟迟读不到。<\/p>\n<h2>推导一：求和循环的不变式与逐圈推演<\/h2>\n<p>程序求 <span class=\"katex-inline\">1+2+\\dots+n<\/span>：<\/p>\n<pre class=\"lang-c\"><code>int sum = 0, i = 1, n = 5;\nwhile (i &lt;= n)\n{\n    sum = sum + i;\n    i = i + 1;\n}<\/code><\/pre>\n<p>循环不变式：进入第 <span class=\"katex-inline\">k<\/span> 圈前，<code>sum<\/code> 等于 <span class=\"katex-inline\">1+2+\\dots+(i-1)<\/span>，即前 <span class=\"katex-inline\">i-1<\/span> 个整数之和；<code>i<\/code> 是下一个待加的数。逐圈推演：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>圈次<\/th><th>进入时 i<\/th><th>进入时 sum<\/th><th>执行体后 sum<\/th><th>执行体后 i<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>2<\/td><td>1<\/td><td>3<\/td><td>3<\/td><\/tr><tr><td>3<\/td><td>3<\/td><td>3<\/td><td>6<\/td><td>4<\/td><\/tr><tr><td>4<\/td><td>4<\/td><td>6<\/td><td>10<\/td><td>5<\/td><\/tr><tr><td>5<\/td><td>5<\/td><td>10<\/td><td>15<\/td><td>6<\/td><\/tr><\/tbody><\/table><\/div>\n<p>第 5 圈结束后 <code>i=6<\/code>，条件 <code>i &lt;= 5<\/code> 不成立，退出。退出时不变式给出 <code>sum = 1+2+…+5 = 15<\/code>。推演依据：每圈先把当前 <code>i<\/code> 累加进 <code>sum<\/code>，再把 <code>i<\/code> 加 1；不变式在赋值前后都能对上前后两列数值。<\/p>\n<h2>推导二：短路求值与 if-else 配对推演<\/h2>\n<p>取条件：<\/p>\n<pre class=\"lang-c\"><code>if (x != 0 &amp;&amp; y / x &gt; 1)\n    printf(&quot;ok\\n&quot;);<\/code><\/pre>\n<p>求值推演：<\/p>\n<ol><li>\n先算左侧 <code>x != 0<\/code>。若 <code>x == 0<\/code>，左侧为假，逻辑与已确定整体为假，右侧 <code>y / x<\/code> 不再计算，避免了除零。\n<\/li><li>\n仅当左侧为真，才算右侧 <code>y / x &gt; 1<\/code>；两侧都真时执行 <code>printf<\/code>。\n<\/li><li>\n这就是短路：右侧是否执行，取决于左侧结果。\n<\/ol>\n<p>再看配对规则。代码片段：<\/p>\n<pre class=\"lang-c\"><code>if (a &gt; 0)\n    if (b &gt; 0)\n        printf(&quot;both\\n&quot;);\nelse\n    printf(&quot;a&lt;=0?\\n&quot;);<\/code><\/pre>\n<p>按规则，<code>else<\/code> 与它最近的未配对 <code>if<\/code>（即 <code>if (b &gt; 0)<\/code>）结合，缩进不改变配对。因此 <code>else<\/code> 分支对应的是 <code>a&gt;0 且 b&lt;=0<\/code>，而不是 <code>a&lt;=0<\/code>。推演依据：C 语言按语法配对，不按书写缩进配对；要让 <code>else<\/code> 挂到外层 <code>if<\/code>，必须用花括号把内层 <code>if<\/code> 包成块。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉循环边界检查<\/strong>：把 <code>while (i &lt;= n)<\/code> 改成 <code>while (1)<\/code> 且删去 <code>i<\/code> 的累加终止条件，循环永远满足入口条件。反例场景：数组遍历不写下界判断，读到数组尾部后继续访问相邻内存，属于未定义行为。\n<\/li><li>\n<strong>去掉 <code>switch<\/code> 里的 <code>break<\/code><\/strong>：匹配到一个标签后继续贯穿执行后续标签的语句。反例：星期判断中 <code>case 1:<\/code> 没有 <code>break<\/code>，满足 case 1 后会连着执行 case 2、case 3 的语句。\n<\/li><li>\n<strong>假设输入是无缓冲即时提交<\/strong>：按每敲一个字符就立即被程序读取来写界面，实际缓冲下程序要等回车后才看到字符，菜单响应会表现为&quot;卡住&quot;直到换行。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p>循环不变式像记账：每加一笔账前，账本余额必须等于上一笔结算后的总额；退出时账本总额就是全部入账之和。短路求值像核验入场：第一关证件不合格，第二关就不必再查。缓冲区像前台收件筐：信件先放进筐里，秘书按批次取走，不是送一件就马上处理一件。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解一：<code>do while<\/code> 至少执行一次，所以条件总为真<\/strong>。先执行一次是结构特征；条件为假时照样退出，只是判断位置在尾部。\n<\/li><li>\n<strong>误解二：缩进决定 <code>else<\/code> 挂哪个 <code>if<\/code><\/strong>。配对只看语法层次，缩进仅为可读性；靠缩进读分支容易把内层误判成外层。\n<\/li><li>\n<strong>误解三：EOF 是输入的一个字符<\/strong>。EOF 是 <code>getchar()<\/code> 返回的状态标志（负值），不属于字符集；读到普通字符时返回字符编码，读到流结尾才返回 EOF。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n为 <code>for (i=0; i&lt;n; i++)<\/code> 累加数组元素的循环写一条不变式，并说明退出时 <code>sum<\/code> 的含义。\n<\/li><li>\n<code>if (a &gt; 0 || b++ &gt; 1)<\/code> 中，<code>a &gt; 0<\/code> 为真时 <code>b<\/code> 是否自增？依据是什么？\n<\/li><li>\n写出 <code>switch<\/code> 中缺少 <code>break<\/code> 时的贯穿过程，举一个两个标签共用同一段处理代码的合法用法。\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\n不变式核对每圈积累状态；退出条件成立时得到目标结果。\n<\/li><li>\n<code>else<\/code> 配最近未配对 <code>if<\/code>；逻辑运算符短路，右侧可能不执行。\n<\/li><li>\n缓冲输入回车后提交；EOF 是流结尾标志，不是普通字符。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章控制流把第 5 章的表达式变成可执行的判断与重复动作。第 9 章把可复用的重复动作封装成函数，循环与分支在函数体内组织；第 10 章处理成组数据时，循环是遍历数组的主要手段，分支是筛选与分类的主要手段。本章的输入验证结论，在文件 I/O（第 13 章）处理流结尾时同样适用。<\/p>", "kind": "chapter", "title": "第 6–8 章：循环、分支跳转、字符输入/输出与输入验证"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.561<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 6–8 章：循环、分支跳转、字符输入/输出与输入验证<\/a><\/span><\/div><h1>第 9–10 章：函数、数组与指针<\/h1>\n<blockquote>对应原书第 9–10 章（第 9 章 PDF 第 561 页起，第 10 章 PDF 第 641 页起；物理页序与印刷页一致，偏移 0）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n说清函数原型的作用：参数个数、类型与返回类型在调用前被编译器检查。\n<\/li><li>\n沿栈帧变化推演一次函数调用：形参、返回地址、局部变量的位置与回收。\n<\/li><li>\n推演一次递归调用的展开与回收顺序，区分尾递归与一般递归。\n<\/li><li>\n给定数组首地址与元素类型，计算任意下标元素的地址与两指针差值。\n<\/li><li>\n判断数组越界访问的位置，说明为什么地址落在数组外面就属于未定义行为。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>函数把一段动作封装成黑盒，原型在调用前约束接口；每次调用在栈上开一帧，返回时回收；数组名在多数表达式中退化为首元素指针，指针算术按元素大小缩放，访问范围必须落在声明的元素个数之内。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念：原型、参数与返回值（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。原书第 9 章 §9.1 讲创建与使用函数，§9.2 讲 ANSI C 函数原型。原型写明函数名、返回类型与形参类型列表；调用时编译器对照原型检查实参个数与类型。<code>return<\/code> 把结果交回主调函数；函数类型由返回值类型决定。<\/p>\n<h3>2. 概念：栈帧与递归（难度：高难）<\/h3>\n<p>原书第 9 章 §9.3 讲递归：函数直接或间接调用自己。每进入一层递归，栈上新建一帧；每层的形参与局部变量互不干扰，直到触达基准条件，再逐层返回。推演递归必须同时看展开方向（一层层深入）与回收方向（一层层退回）。<\/p>\n<h3>3. 概念：指针、数组与指针算术（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。原书第 10 章 §10.3 讲指针和数组的关系，§10.5 讲指针操作。数组在表达式中通常退化为指向首元素的指针；<code>p + i<\/code> 的地址增量是 <span class=\"katex-inline\">i<\/span> 乘元素大小；两指针相减的结果以元素个数为单位，不是字节差。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[主调函数帧] --&gt; B[调用: 压入实参/返回地址]\nB --&gt; C[被调函数帧: 形参+局部变量]\nC --&gt; D{是否再调用/递归?}\nD -- 是 --&gt; C\nD -- 否 --&gt; E[return: 计算返回值]\nE --&gt; F[回收本帧, 回到返回地址]\nG[数组首元素地址 base] --&gt; H[元素 i 地址 = base + i*元素大小]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：函数调用断在 B 步——实参与返回地址没有压栈，被调函数无法知道从哪里返回；指针计算断在 H 步——步长若按字节而不是按元素大小缩放，跨类型访问全部错位。<\/p>\n<h2>推导一：一次函数调用的栈帧推演<\/h2>\n<p>取定义与调用：<\/p>\n<pre class=\"lang-c\"><code>int square(int x)\n{\n    int result;\n    result = x * x;\n    return result;\n}\n\nint main(void)\n{\n    int a = 6;\n    int b = square(a);\n    return 0;\n}<\/code><\/pre>\n<p>推演过程：<\/p>\n<ol><li>\n<code>main<\/code> 帧中 <code>a<\/code> 存入局部变量区，值 6。\n<\/li><li>\n调用 <code>square(a)<\/code>：实参 6 传入形参 <code>x<\/code>，保存返回地址（<code>main<\/code> 中调用语句的下一条位置），栈上新建 <code>square<\/code> 帧。\n<\/li><li>\n<code>square<\/code> 帧内：形参 <code>x=6<\/code>，局部变量 <code>result<\/code> 未初始化；执行 <code>result = x * x<\/code>，<code>result=36<\/code>。\n<\/li><li>\n<code>return result<\/code>：把 36 作为返回值交出，<code>square<\/code> 帧回收。\n<\/li><li>\n回到 <code>main<\/code>，返回值赋给 <code>b<\/code>，<code>b=36<\/code>；<code>main<\/code> 随后返回 0。\n<\/ol>\n<p>推演依据：形参是被调帧内的局部存储，实参按值复制；被调函数修改形参不影响主调函数的原变量；帧回收后该帧内局部变量不再可访问。<\/p>\n<h2>推导二：指针算术与数组地址推演<\/h2>\n<p>设数组声明 <code>int a[5];<\/code>，<code>int<\/code> 宽度为 4 字节，首元素地址记为 <span class=\"katex-inline\">base<\/span>。地址计算规则：元素 <code>a[i]<\/code> 的地址为 <span class=\"katex-inline\">base + i \\times sizeof(int)<\/span>。<\/p>\n<ol><li>\n<code>a[0]<\/code> 地址：<span class=\"katex-inline\">base + 0 \\times 4 = base<\/span>。\n<\/li><li>\n<code>a[3]<\/code> 地址：<span class=\"katex-inline\">base + 3 \\times 4 = base + 12<\/span>。\n<\/li><li>\n指针差 <code>&amp;a[3] - &amp;a[0]<\/code>：<span class=\"katex-inline\">(base+12 - base) / 4 = 3<\/span>，结果是 3 个元素，不是 12 字节。\n<\/li><li>\n越界位置：下标范围为 <span class=\"katex-inline\">0,1,2,3,4<\/span>；<code>a[5]<\/code> 地址为 <span class=\"katex-inline\">base+20<\/span>，落在数组存储区之后，访问它属于越界。\n<\/ol>\n<p>再看字符数组：<code>char code[12];<\/code>，元素大小 1 字节，<code>code[i]<\/code> 地址为 <span class=\"katex-inline\">base + i<\/span>；<code>&amp;code[7]-&amp;code[2]=5<\/code>。元素类型不同，同一指针差对应的字节差不同，但元素个数差一致。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉函数原型声明<\/strong>：调用前编译器不知道形参类型，实参按默认规则传递，个数与类型不做检查。反例场景：定义 <code>int add(int, int)<\/code> 却先调用后定义且无原型，调用时少传一个参数，被调函数在帧上读到垃圾值，结果不可预测。\n<\/li><li>\n<strong>去掉数组边界检查<\/strong>：遍历写到 <code>a[5]<\/code>、<code>a[6]<\/code>，地址计算本身能算出位置，但该位置不属于数组；相邻变量、返回地址可能被覆盖，轻则数据错乱，重则程序崩溃。\n<\/li><li>\n<strong>把数组形参当成按值复制整块<\/strong>：函数形参写 <code>int arr[]<\/code>，实际收到的是首元素指针，函数内修改 <code>arr[i]<\/code> 会改到原数组；若误以为复制了整块，会漏掉&quot;函数内改动影响主调数组&quot;这条链路。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p>栈帧像一摞工作表：每接一个任务在最上面铺一张表，写完交回后抽走这张表；下面一张表的内容不受影响。指针算术像按排取书：每排固定放 4 本书（<code>int<\/code> 4 字节），向前走 3 排，位置移动 12 个书位，但排数差记为 3。数组越界像翻到书架编号之外的格子，格子物理上存在，放的却不是这组书。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解一：数组名是一个常量指针变量<\/strong>。数组名是数组对象的标识，在多数表达式中退化为首元素地址；它本身不是可被赋值的指针变量，不能写 <code>a = a + 1<\/code>。\n<\/li><li>\n<strong>误解二：递归一定比迭代省内存<\/strong>。每深入一层开一帧，递归层数过大会占满栈空间；基准条件缺失时递归不会自动停止。\n<\/li><li>\n<strong>误解三：指针差值是字节差<\/strong>。指针减法以元素为单位；要算字节差，需要先把指针转成 <code>char *<\/code> 再相减。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n画出 <code>main<\/code> 调用 <code>double_it(int x)<\/code> 时两帧的布局，标出形参、返回地址与局部变量。\n<\/li><li>\n<code>int v[8];<\/code> 中 <code>&amp;v[6]-&amp;v[1]<\/code> 等于多少？若元素为 <code>double<\/code>（8 字节），字节差是多少？\n<\/li><li>\n递归求阶乘 <code>fact(n)<\/code>：写出展开到 <code>fact(1)<\/code> 的层数顺序，以及返回值逐层乘回的顺序。\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\n原型在调用前检查参数个数与类型；按值传递，形参改动不回写实参。\n<\/li><li>\n每次调用开一帧，返回回收；递归每层独立成帧。\n<\/li><li>\n指针算术步长按元素大小缩放；下标必须落在声明范围内。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章把前面章节里零散出现的函数调用、数组访问收拢到接口与内存两个视角。第 11 章字符串函数建立在字符指针与数组遍历之上；第 12 章存储类别与动态内存分配在栈、静态区与堆之间区分变量生命周期；第 13 章文件 I/O 把指针操作扩展到流对象。本章的地址计算规则是理解后续所有内存相关概念的底层依据。<\/p>", "kind": "chapter", "title": "第 9–10 章：函数、数组与指针"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.47<\/div><h1>编译链接模型与最小 C 程序结构<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书第 1 章 §1.8、第 2 章 §2.2，PDF 第 47、69 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>C 程序从文本源文件出发，经过预处理、编译、汇编、链接四个阶段形成可执行文件；最小可运行程序由头文件包含、<code>main<\/code> 函数定义、函数体内的声明与语句、返回状态四部分组成。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>刚接触 C 的人容易把&quot;写代码&quot;和&quot;运行程序&quot;看成一件事：以为保存 <code>.c<\/code> 文件后机器就能直接执行。困难在于，CPU 只识别二进制机器指令，不识别 C 文本；而程序里调用的库函数（如 <code>printf<\/code>）并不在自己写的源文件里。编译链接模型回答两个具体问题：文本怎样变成机器指令；分散在不同文件与库里的代码怎样拼成一个完整映像。不理解这条链，遇到&quot;编译错误&quot;&quot;链接错误&quot;&quot;运行结果不对&quot;三类问题时无法定位出错阶段；也说不清 <code>main<\/code> 在整个程序里处于什么位置。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>预处理阶段<\/strong>：处理以 <code>#<\/code> 开头的指令。<code>#include<\/code> 把头文件内容插入当前文件位置，<code>#define<\/code> 做宏替换；这一阶段不检查 C 语法，只做文本展开。<\/p>\n<p><strong>编译阶段<\/strong>：把展开后的 C 文本翻译成汇编代码，再汇编成目标代码（机器码）。目标代码里已经有本文件函数的机器指令，但调用外部函数的位置还留着未绑定的符号。<\/p>\n<p><strong>链接阶段<\/strong>：链接器把本文件目标代码、其他目标文件与库代码合并，按符号名找到每个函数与变量的实际地址，填进调用位置，生成可执行文件。<\/p>\n<p><strong>最小程序结构<\/strong>：<\/p>\n<ol><li>\n<code>#include &lt;stdio.h&gt;<\/code>：引入标准输入输出库的原型声明。\n<\/li><li>\n<code>int main(void)<\/code>：定义程序入口函数；<code>void<\/code> 表示不接收命令行参数。\n<\/li><li>\n函数体 <code>{ ... }<\/code>：写变量声明与可执行语句。\n<\/li><li>\n<code>return 0;<\/code>：把退出状态交回操作系统，0 表示正常结束。\n<\/ol>\n<p><strong>正例<\/strong>：下面程序结构完整，可编译运行：<\/p>\n<pre class=\"lang-c\"><code>#include &lt;stdio.h&gt;\n\nint main(void)\n{\n    int dogs;\n    scanf(&quot;%d&quot;, &amp;dogs);\n    printf(&quot;%d\\n&quot;, dogs);\n    return 0;\n}<\/code><\/pre>\n<p><strong>反例<\/strong>：只有一句 <code>printf(&quot;hi&quot;);<\/code> 而没有 <code>main<\/code>，编译器找不到入口；调用 <code>printf<\/code> 却不包含 <code>&lt;stdio.h&gt;<\/code>，原型缺失，参数类型不被检查。<\/p>\n<h2>原理推导<\/h2>\n<p>阶段划分的依据是职责分离：文本展开、语法翻译、符号绑定是三类不同工作，分开才能分别报错、分别复用。<\/p>\n<ol><li>\n假设源文件只有文本，没有任何翻译：CPU 取指时读到的是字母与符号，无法解码成算术或访存指令，程序不能运行。这说明必须有一步把文本换成机器码。\n<\/li><li>\n假设只翻译本文件、不做链接：<code>printf<\/code> 的机器指令不在本文件中，调用位置无法形成合法目标地址，映像不完整。这说明必须有一步把外部代码并入。\n<\/li><li>\n链接完成后，可执行映像包含：入口地址指向 <code>main<\/code> 对应机器指令；各函数调用已经绑定到具体地址；操作系统加载后从入口开始调度。\n<\/li><li>\n<code>main<\/code> 的位置由操作系统约定：它不是被另一个 C 函数调用的普通函数，而是映像入口；程序执行流从 <code>main<\/code> 第一条语句开始，<code>main<\/code> 返回后进程结束。\n<\/ol>\n<p>推导中使用的假设：目标平台按机器指令取指；库代码以目标代码形式提供；链接器按符号名解析地址。<\/p>\n<p><strong>一个完整构建推演<\/strong>。取源文件 <code>hello.c<\/code>，内容为包含 <code>&lt;stdio.h&gt;<\/code>、定义 <code>main<\/code>、调用 <code>printf<\/code>、<code>return 0<\/code> 的小程序：<\/p>\n<ol><li>\n预处理把 <code>stdio.h<\/code> 中 <code>printf<\/code> 的原型声明插入源文位置，文本展开后得到完整翻译单元。\n<\/li><li>\n编译逐行检查语法：变量名、类型、语句分号；通过后生成汇编，再汇编出目标文件，本文件内 <code>main<\/code> 的机器指令已经成型，而 <code>printf<\/code> 调用处仍是待填的符号引用。\n<\/li><li>\n链接器查标准库，找到 <code>printf<\/code> 的机器码入口地址，把引用填进调用位置；同时补齐程序启动所需的运行支持代码。\n<\/li><li>\n生成可执行文件；操作系统加载映像，跳转到入口，进入 <code>main<\/code>。\n<\/ol>\n<p>这条推演对应原书第 1 章 §1.8.1 对目标代码文件、可执行文件和库的说明：目标代码是编译器的产物，可执行文件是链接器的产物，库是可复用代码的集合。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：基于编译器+链接器的传统 C 开发流程；源文件、库文件以目标代码形式参与构建。\n<\/li><li>\n边界一：不同 IDE 把多阶段隐藏在&quot;构建&quot;按钮后，但阶段仍然存在；报错信息分属编译期或链接期。\n<\/li><li>\n边界二：头文件只提供声明与类型信息，不提供库函数机器码；机器码在链接阶段并入。\n<\/li><li>\n失败案例：漏写函数定义、只调用不实现，编译能过而链接报&quot;未定义引用&quot;；把这种链接错误当成语法错误修改源代码，方向就错了。\n<\/li><li>\n失败案例二：源文件调用 <code>printf<\/code> 却漏写 <code>#include &lt;stdio.h&gt;<\/code>。旧标准允许编译器按隐式规则猜测返回类型，现代标准下直接报错；即使勉强编译，参数个数与类型也没有原型约束，传参错位时输出乱码。这一案例说明头文件提供的是编译期检查依据，不是可有可无的装饰。\n<\/li><li>\n边界三：<code>main<\/code> 的返回类型在标准 C 中约定为 <code>int<\/code>；<code>void main()<\/code> 不是标准形式，跨平台移植时可能出问题。\n<\/li><li>\n边界四：预处理只做文本替换，不理解替换后的语义。宏替换在文本层面完成，因此宏参数不加括号时，展开后的优先级可能与书写意图不符；这一现象在第 5 章表达式求值中会再次遇到。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>编译错误 vs 链接错误<\/strong>：编译错误来自本文件语法、类型不符，发生在翻译阶段；链接错误来自符号找不到、重复定义，发生在合并阶段。前者改源文件写法，后者查函数是否实现、库是否加入。\n<\/li><li>\n<strong>头文件 vs 库文件<\/strong>：头文件放原型、类型与宏；库文件放机器码。包含头文件不等于链接了库。\n<\/li><li>\n<strong>预处理指令 vs C 语句<\/strong>：<code>#define<\/code>、<code>#include<\/code> 在翻译前展开，末尾不写分号；把预处理指令当语句加分号会引入多余字符。\n<\/li><li>\n<strong><code>main<\/code> 与普通函数<\/strong>：普通函数由其他函数调用；<code>main<\/code> 由运行环境启动，是映像入口。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无，这是全书最底层的构建视角。后继：c02 在程序处理的数据上区分类型宽度；c04 的 <code>printf<\/code>/<code>scanf<\/code> 原型来自标准库头文件；c08 的函数原型检查、多文件编译与本章阶段划分直接对应。本章解释&quot;代码怎样变成可执行映像&quot;，后续概念都建立在映像已经能被加载执行的前提上。<\/p>\n<p>理解这条链对调试的直接作用：看到一条报错，先判断它落在翻译阶段还是合并阶段，再决定是改写法还是查构建配置。编译期问题围绕本文件的语法与类型，链接期问题围绕符号是否有定义、库是否齐全；运行期问题则发生在映像加载之后，属于程序逻辑层面。三个阶段的问题不能用同一类修法处理。原书第 2 章 §2.7 区分语法错误与语义错误，语法错误多在编译期暴露，语义错误能编译通过但执行结果偏离预期；本章的阶段划分给这两类错误提供了定位坐标。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（编译链接模型与最小 C 程序结构）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：构建阶段依赖链、最小程序执行推演与报错定位<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把&quot;一个 C 文件怎样变成运行中的程序&quot;讲清楚，往回追五层：<\/p>\n<ol><li>\n机器执行层：CPU 从内存取二进制指令解码执行，只认机器码，不认 C 文本。这是整条链的终点约束。\n<\/li><li>\n翻译层：必须有一步把 C 文本换成机器码，这一步就是编译；编译前还要先把引用的头文件与宏展开，即预处理。\n<\/li><li>\n符号层：本文件机器码里调用外部函数的位置只有符号名，没有地址；必须有一步按符号名找到外部实现并填地址，这一步是链接。\n<\/li><li>\n结构层：链接出的映像需要一个约定入口，操作系统从这里启动；这个入口在 C 代码里就是 <code>main<\/code>。\n<\/li><li>\n检查层：在翻译之前，原型声明让编译器核对调用的参数个数与类型；没有原型，检查失去依据。\n<\/ol>\n<p>依赖链方向：机器只认机器码 → 需要编译翻译 → 外部符号需要链接绑定 → 映像需要入口 <code>main<\/code> → 调用关系需要原型检查。任何一层被抽掉，上层结论都站不住：没有编译就没有机器码，没有链接符号悬空，没有入口映像无法启动。<\/p>\n<p>往回再追一步：为什么 C 不直接把文本交给机器执行？因为机器指令集是固定的二进制编码，每条指令对应具体的寄存器操作与访存动作；C 文本里的关键字、表达式、语句结构是给人读的抽象表示，二者之间不存在一一对应的直接映射，必须经过翻译。为什么链接不能合并进编译一次完成？因为一个程序由多个源文件与可复用库组成，编译按文件独立进行，彼此只暴露符号名；只有全部文件编译完，才能统一安排最终映像里的地址。这两个约束决定了阶段必须分开。<\/p>\n<h2>正向推导：四个阶段各完成什么<\/h2>\n<p><strong>预处理<\/strong>。输入是 <code>.c<\/code> 源文本。逐条处理 <code>#<\/code> 指令：<code>#include &lt;stdio.h&gt;<\/code> 把该头文件内容复制到指令所在位置；<code>#define DENSITY 62.4<\/code> 把后文出现的 <code>DENSITY<\/code> 替换成 <code>62.4<\/code>。这一阶段不做类型检查，宏替换是纯文本动作。展开结果是一个完整翻译单元，文本量通常比源文件大。<\/p>\n<p><strong>编译<\/strong>。输入是展开后的翻译单元。编译器先做词法分析，把字符流切成标识符、关键字、常量、运算符；再做语法分析，按 C 语法拼成语句结构；类型检查在这一层进行：声明与使用是否一致、类型是否匹配。通过后生成汇编代码，汇编器再把汇编翻成目标代码（机器码）。目标代码包含本文件函数的指令流，外部调用处保留符号占位。<\/p>\n<p><strong>链接<\/strong>。输入是本文件目标代码、其他目标文件与库。链接器收集所有符号定义：函数名、全局变量名；再扫描所有引用，把每个符号名替换成它在最终映像中的地址。若一个引用找不到定义，报&quot;未定义引用&quot;；若同名定义出现多次，报&quot;重复定义&quot;。绑定完成后生成可执行文件。<\/p>\n<p><strong>加载与启动<\/strong>。操作系统把可执行映像读入内存，设置栈与运行环境，跳转到入口地址。入口在 C 代码中对应 <code>main<\/code> 的第一条语句；<code>main<\/code> 执行完 <code>return<\/code>，退出状态交回操作系统，进程结束。<\/p>\n<p>推导依据：阶段之间是单向流水线，上游产物是下游输入；报错信息落在哪个阶段，决定了该改源文件写法还是查构建配置。<\/p>\n<p>阶段之间的数据接口要分清：预处理交给编译的是文本；编译交给链接的是带符号占位的机器码；链接交给操作系统的是地址已绑定的完整映像。接口不清会导致把上一阶段的问题带到下一阶段去修。<\/p>\n<h2>算例一：一个含库调用的小程序构建推演<\/h2>\n<p>源文件 <code>talkback.c<\/code> 的核心结构：<\/p>\n<pre class=\"lang-c\"><code>#include &lt;stdio.h&gt;\n#define DENSITY 62.4\n\nint main(void)\n{\n    float weight, volume;\n    char name[40];\n    scanf(&quot;%s&quot;, name);\n    scanf(&quot;%f&quot;, &amp;weight);\n    volume = weight / DENSITY;\n    printf(&quot;%s %.2f\\n&quot;, name, volume);\n    return 0;\n}<\/code><\/pre>\n<p>逐步推演：<\/p>\n<ol><li>\n预处理：<code>&lt;stdio.h&gt;<\/code> 的原型插入；<code>DENSITY<\/code> 在 <code>weight / DENSITY<\/code> 处被替换成 <code>62.4<\/code>。翻译单元里出现 <code>scanf<\/code>、<code>printf<\/code> 的原型声明。\n<\/li><li>\n编译：检查 <code>main<\/code> 返回 <code>int<\/code>；两个 <code>scanf<\/code> 实参与原型对照：<code>%s<\/code> 配字符数组地址，<code>%f<\/code> 配 <code>float *<\/code>；<code>volume = weight / 62.4<\/code> 中 <code>weight<\/code> 是 <code>float<\/code>，字面量 <code>62.4<\/code> 是 <code>double<\/code>，按提升规则运算。编译通过，生成目标文件，<code>scanf<\/code>、<code>printf<\/code> 处为待绑定符号。\n<\/li><li>\n链接：从标准库找到 <code>scanf<\/code>、<code>printf<\/code> 的机器码入口，填入调用位置；运行支持代码并入。可执行文件生成。\n<\/li><li>\n启动执行：进入 <code>main<\/code>，栈上留出 <code>weight<\/code>、<code>volume<\/code>、<code>name[40]<\/code> 的空间；第一次 <code>scanf<\/code> 读名字到 <code>name<\/code>；第二次读体重到 <code>weight<\/code>；计算体积；<code>printf<\/code> 按格式输出；<code>return 0<\/code> 结束进程。\n<\/ol>\n<p>中间状态核对：预处理后 <code>DENSITY<\/code> 不再以符号出现；编译期不查 <code>scanf<\/code> 内部实现；链接期不查 C 语法。三个阶段职责互不重叠。<\/p>\n<p>把执行期变量值列出来核对：假设用户先输入 <code>Amy<\/code>，再输入 <code>130<\/code>。第一次 <code>scanf<\/code> 后 <code>name<\/code> 前三个字节为 <code>A<\/code>、<code>m<\/code>、<code>y<\/code>，第四字节为 null；第二次 <code>scanf<\/code> 后 <code>weight=130.0<\/code>；<code>volume = 130.0 / 62.4 ≈ 2.0833<\/code>；<code>printf<\/code> 按 <code>%.2f<\/code> 输出 <code>2.08<\/code>。这条链里，编译期确认类型合法，链接期确认函数可达，运行期才产生具体数值，三类问题各有归属。<\/p>\n<h2>算例二：两类报错分别落在哪一阶段<\/h2>\n<p><strong>场景 A：源文件漏写分号<\/strong>。语句 <code>printf(&quot;%d&quot;, dogs)<\/code> 末尾缺 <code>;<\/code>。编译在语法分析阶段发现语句结束位置不符合语法，报错指向该行；目标代码不会生成，链接阶段根本不会开始。定位依据：报错文本包含语法错误信息，发生在编译期。<\/p>\n<p><strong>场景 B：调用了未实现的函数 <code>lookup()<\/code><\/strong>。源代码中写 <code>int x = lookup();<\/code>，但整个工程没有 <code>lookup<\/code> 的定义。编译阶段本文件语法与类型检查通过，目标代码生成；链接扫描符号引用时找不到 <code>lookup<\/code> 的定义，报未定义引用。定位依据：编译已过、链接失败；解决方向是补上函数实现或加入包含该函数的库，而不是修改本行语法。<\/p>\n<p><strong>场景 C：头文件缺失<\/strong>。调用 <code>printf<\/code> 而未包含 <code>&lt;stdio.h&gt;<\/code>。在现代标准下，编译期因原型不可见报错；即使旧标准放行，参数类型检查也缺失，调用 <code>printf(&quot;%f&quot;, 3)<\/code> 时按错误方式传递实参，运行输出乱码。这一场景说明原型检查属于编译期防线。<\/p>\n<p>把三个场景并排看：A 的问题在翻译语法层，B 的问题在符号合并层，C 的问题在调用接口检查层。报错文本的关键词不同：语法错误、未定义引用、隐式声明；对应的排查方向分别是改写法、补实现或加库、补头文件。<\/p>\n<h2>算例三：最小程序逐语句执行状态推演<\/h2>\n<p>取第二个示例程序：<\/p>\n<pre class=\"lang-c\"><code>#include &lt;stdio.h&gt;\n\nint main(void)\n{\n    int dogs;\n    printf(&quot;How many dogs?\\n&quot;);\n    scanf(&quot;%d&quot;, &amp;dogs);\n    printf(&quot;You have %d dogs.\\n&quot;, dogs);\n    return 0;\n}<\/code><\/pre>\n<p>按执行顺序列出每一步的存储与状态：<\/p>\n<ol><li>\n映像加载，进入 <code>main<\/code>。栈帧建立，局部变量 <code>dogs<\/code> 占据一个 <code>int<\/code> 宽度区域，此时区域内是上次栈残留的不确定值，不能假定为 0。\n<\/li><li>\n第一个 <code>printf<\/code> 把字面量字符串写入标准输出，程序暂停等待。\n<\/li><li>\n用户键入数字 <code>3<\/code> 并回车。字符 <code>&#x27;3&#x27;<\/code> 进入输入缓冲；<code>scanf<\/code> 按 <code>%d<\/code> 解析：字符 <code>&#x27;3&#x27;<\/code> 的 ASCII 码减去 <code>&#x27;0&#x27;<\/code> 的 ASCII 码得到数值 3，写入 <code>dogs<\/code> 所在区域。此步之后 <code>dogs=3<\/code>。\n<\/li><li>\n第二个 <code>printf<\/code> 读取 <code>dogs<\/code> 的值 3，按 <code>%d<\/code> 转成十进制字符序列，与其余字面量拼成输出行。\n<\/li><li>\n<code>return 0<\/code>：返回值 0 交给操作系统，<code>main<\/code> 帧回收，进程结束。\n<\/ol>\n<p>核对这条推演的依据：<code>scanf<\/code> 写值需要变量地址，所以实参是 <code>&amp;dogs<\/code>；<code>printf<\/code> 取值直接写变量名即可；两个函数的原型来自 <code>&lt;stdio.h&gt;<\/code>，编译期已核对类型。若第 3 步之前读取 <code>dogs<\/code>，得到的是残留值，这正是局部变量不自动初始化的表现。<\/p>\n<p>把这条执行链与构建链对照：构建期解决&quot;指令从哪来、地址绑到哪&quot;，运行期解决&quot;变量存什么值、语句按什么次序执行&quot;。两套推演回答不同问题，不能互相替代。<\/p>\n<p>再核对一次阶段边界：<code>#include<\/code> 与 <code>#define<\/code> 的效果在进入编译前已经固定；类型检查只在编译期进行；符号绑定只在链接期进行；变量的具体数值只在运行期产生。记住这条边界，后面读到类型转换、原型检查、指针绑定时，就能判断每条规则属于哪一层约束。原书第 3 章 §3.6 提示参数与陷阱，其中一类陷阱正是格式符与类型不匹配，其根源就是把编译期类型约定与运行期内存解释混在了一起。<\/p>\n<h2>反事实推演：抽掉某一阶段会怎样<\/h2>\n<p><strong>抽掉链接阶段<\/strong>：假设编译直接出可执行映像。本文件调用 <code>printf<\/code> 的位置没有外部地址可填，映像里留下悬空引用；CPU 取指时跳到非法位置，触发访问错误。反例后果：程序无法启动，而不是输出错误数字。<\/p>\n<p><strong>抽掉原型检查<\/strong>：假设编译器不核对实参与形参。调用 <code>add(int, int)<\/code> 时少传一个参数，被调函数在帧上读到不确定值；参数类型不符时按错误宽度读取栈位置，结果随机。这说明原型不是文档，而是编译期的接口约束。<\/p>\n<p><strong>抽掉入口约定<\/strong>：假设映像不固定入口。操作系统加载后不知道从哪条指令开始，无法调度执行流；<code>main<\/code> 作为约定入口，正是为了解决&quot;从哪里启动&quot;这个问题。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>把链接错误当成语法错误<\/strong>。现象：编译过程走完，末尾报&quot;undefined reference to …&quot;。复盘：符号找不到说明合并阶段缺定义；若回头在调用行加括号、改类型，源码越改越乱。正确动作：确认函数是否写了、文件名是否加入工程、库是否链接。<\/p>\n<p><strong>以为包含头文件就等于链接库<\/strong>。头文件只给声明，机器码在库中。只 <code>#include<\/code> 而构建配置没加库，编译通过、链接报未定义引用；两类文件的分工被混淆是根因。<\/p>\n<p><strong>按缩进判断 <code>main<\/code> 的位置<\/strong>。有人把所有代码写进一个函数，却以为每个函数都会被自动执行。复盘：映像入口只有 <code>main<\/code> 一个；其他函数必须被 <code>main<\/code> 或其调用链触达，否则代码不执行。<\/p>\n<p><strong>把 <code>void main()<\/code> 当成可移植写法<\/strong>。某些环境接受 <code>void main()<\/code>，但标准 C 约定 <code>main<\/code> 返回 <code>int<\/code>；换编译器或换平台后，退出状态与启动约定可能不一致。跨平台代码应写 <code>int main(void)<\/code> 并 <code>return 0<\/code>。<\/p>\n<p><strong>忽略启动支持代码的位置<\/strong>。可执行映像里除了自己写的 <code>main<\/code> 与库函数，还有运行环境插入的启动代码：负责设置栈、收集命令行参数、调用 <code>main<\/code>、接收返回值并退出。初学者以为程序第一条语句就是自己写的代码，实际中间还有这层支持；理解这一点，才能解释为什么 <code>main<\/code> 能被外部启动、返回后进程即结束。原书第 1 章 §1.8.2 到 §1.8.6 分别说明 UNIX、GCC、Linux、PC 命令行编译器与 IDE 环境下的构建方式，环境不同只改变操作入口，阶段划分不变。<\/p>\n<p><strong>把注释当成语义内容<\/strong>。注释在预处理后的翻译单元里被去除，不进入目标代码；调试时不能依赖注释传递运行期信息。同样，空行与缩进只服务可读性，不参与机器码生成。<\/p>\n<h2>再推一层：多文件程序里的阶段分工<\/h2>\n<p>一个程序拆成两个源文件：<code>main.c<\/code> 调用 <code>helper.c<\/code> 里定义的 <code>helper()<\/code>。编译分别独立进行：<code>main.c<\/code> 编译出的目标文件里 <code>helper<\/code> 是符号占位；<code>helper.c<\/code> 编译出的目标文件里有 <code>helper<\/code> 的机器码与符号定义。链接器把两份目标代码与库合并，在 <code>main.o<\/code> 的占位处填入 <code>helper<\/code> 的最终地址。多文件情况下，编译互不依赖，链接是唯一的合并点；这解释了为什么改一个函数实现只需重编对应文件，再重新链接，而不必重写全部代码。<\/p>\n<p>这一层还能解释头文件的分工：两个文件共享的类型声明、函数原型放进头文件，两边 <code>#include<\/code> 后看到同一份接口描述；函数的机器码各自编译成目标文件，在链接时汇合。声明与定义分离，正是为了让独立编译成为可能。<\/p>\n<h2>阶段产物与判据对照<\/h2>\n<p>把四个阶段的输入、产物、常见问题并排列出，便于遇到报错时反查归属：<\/p>\n<ol><li>\n预处理：输入源文本，产物展开后的翻译单元。常见问题是宏未展开、头文件路径找不到；判据是替换结果里是否还残留宏名。\n<\/li><li>\n编译：输入翻译单元，产物目标代码与汇编。常见问题是语法错误、类型不匹配、原型缺失；判据是报错行号落在源码哪一行，错误关键词是语法还是类型。\n<\/li><li>\n链接：输入目标文件与库，产物可执行映像。常见问题是未定义引用、重复定义、库未加入；判据是编译已完成、报错发生在合并阶段。\n<\/li><li>\n加载启动：输入映像，产物运行中的进程。常见问题是入口找不到、运行期段错误；判据是程序能启动但执行逻辑出错，属于调试层面而非构建层面。\n<\/ol>\n<p>这套对照的用处是定位优先级：先看报错发生在哪一步，再决定改源码、改构建配置还是调逻辑。把链接期问题当成编译期问题修改，是初学者最常见的返工来源；反过来，把运行期数值错误当成链接问题，也会在构建配置上白费时间。<\/p>\n<p>再看命令行流程与 IDE 流程的对应关系。命令行下，编译器程序先调预处理再编译汇编，链接器单独把目标文件拼成映像；IDE 把这些动作收进&quot;构建&quot;菜单，后台仍按同一顺序执行。菜单显示&quot;编译通过&quot;只代表目标代码生成，不代表链接完成；显示&quot;构建成功&quot;才表示映像已生成。两个按钮或两个步骤的差别，对应本章流水线里的不同节点。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n能否不看资料，按顺序说出预处理、编译、汇编、链接、加载启动各自产出什么？\n<\/li><li>\n给定一条报错，能否判断它属于编译期还是链接期？判断依据是报错出现在哪个阶段之后？\n<\/li><li>\n为什么 <code>printf<\/code> 的机器码不在自己的目标文件里？它是在哪一步并入映像的？\n<\/li><li>\n<code>main<\/code> 和自定义函数在&quot;谁调用谁&quot;上有什么差别？\n<\/li><li>\n头文件提供声明还是机器码？库提供哪一个？\n<\/li><li>\n漏写分号与漏写函数定义，报错阶段各是什么？\n<\/li><li>\n多文件工程里，为什么改一个函数只需重编对应文件再链接？\n<\/ol>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n画出从源文件到进程结束的阶段流水线，标出每阶段输入与产物。\n<\/li><li>\n一个工程编译成功但链接失败，列出三种可能的原因与对应排查动作。\n<\/li><li>\n为什么原型声明属于编译期检查，而不是链接期检查？\n<\/li><li>\n操作系统加载可执行文件后，第一条执行的语句在代码里对应哪里？\n<\/li><li>\n宏替换在哪一阶段完成？这一阶段为什么不做类型检查？\n<\/li><li>\n两个源文件共享同一函数的原型，声明放在哪里、定义放在哪里？链接阶段把什么填进调用位置？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "编译链接模型与最小 C 程序结构"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.109<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">编译链接模型与最小 C 程序结构<\/a><\/span><\/div><h1>基本数据类型、位宽与整数取值范围<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书第 3 章 §3.4，PDF 第 109 页起）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>C 的基本类型规定一块内存的位宽与二进制解释方式：整数系列按补码解释，浮点系列按 IEEE 浮点数格式解释；位宽决定取值上下界，类型选择就是在范围、精度与存储代价之间取舍。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>程序要存数字、字符与文字，困难在于同样一串二进制位，按不同类型解释会得到完全不同的结果。不先定类型，编译器不知道给变量留多大空间、按什么规则解码；写表达式时也无法判断运算结果是否溢出。具体困难有三类：一是数值超出类型范围后按什么规则回绕或截断；二是 <code>char<\/code>、<code>int<\/code>、<code>long<\/code> 在不同平台宽度不一致，代码怎样保持可移植；三是整数除法、字符编码与布尔真值各自由哪类类型承载。本章把类型拆成位宽与解释规则两层，后续字符串、表达式转换、指针算术都建立在这套宽度结论上。<\/p>\n<p>不区分宽度与解释，会出现两类典型错误：一类是存储安排错误，给小范围数据留了过宽空间，或给大范围数据留窄了位置；另一类是解码错误，位串按错误类型读出，数值看似随机。两类错误在编译期不一定都能拦住，因此写代码前先定类型，比出错后反推更省成本。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>位宽<\/strong>：类型在内存中占据的二进制位数，通常以字节为单位报告；<code>sizeof(类型)<\/code> 返回该类型对象占用的字节数。位宽由实现定义，标准只规定各类型之间的最小宽度次序，不规定每个类型的绝对字节数。<\/p>\n<p><strong>整数系列<\/strong>：<\/p>\n<ul><li>\n<code>int<\/code>：默认有符号整数类型，是平台算术效率最高的整数宽度。\n<\/li><li>\n<code>short<\/code>、<code>long<\/code>、<code>long long<\/code>：更窄或更宽的有符号整数变体，宽度依次不小于 <code>int<\/code> 的对应次序。\n<\/li><li>\n<code>unsigned<\/code> 前缀：无符号解释，所有位都计入数值，按模 <span class=\"katex-inline\">2^w<\/span> 回绕。\n<\/li><li>\n<code>char<\/code>：存放字符编码的最小整数类型；是否默认可 signed 由实现决定。\n<\/li><li>\n<code>_Bool<\/code>：只存 0 与 1 的布尔类型。\n<\/ul>\n<p><strong>浮点系列<\/strong>：<code>float<\/code> 单精度、<code>double<\/code> 双精度、<code>long double<\/code> 扩展精度；二进制位分成符号位、指数位与尾数位，能表示很大范围的数，但小数部分以精度为代价。<\/p>\n<p><strong>字面量与变量<\/strong>：<code>12<\/code> 是 <code>int<\/code> 字面量，<code>3.14<\/code> 是 <code>double<\/code> 字面量，<code>&#x27;A&#x27;<\/code> 是字符常量；变量声明时写明类型，后续每次读写都按该类型解释其存储区。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-c\"><code>int age = 20;\nunsigned int count = 100;\ndouble price = 19.9;\nchar grade = &#x27;A&#x27;;<\/code><\/pre>\n<p><strong>反例<\/strong>：把超出 <code>int<\/code> 范围的大数直接赋给 <code>int<\/code>，结果按溢出规则处理；把字符与整数混作语义相同的量时，忽略编码差值会得到错误比较结果。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>有符号范围推导<\/strong>。位宽 <span class=\"katex-inline\">w<\/span> 时，最高位为符号位，剩 <span class=\"katex-inline\">w-1<\/span> 位表数值。非负侧最大值为 <span class=\"katex-inline\">2^{w-1}-1<\/span>：<span class=\"katex-inline\">k=w-1<\/span> 位全 1 对应 <span class=\"katex-inline\">2^k-1<\/span>。负侧最小值为 <span class=\"katex-inline\">-2^{w-1}<\/span>：补码下符号位为 1、数值位全 0 的编码约定给最小负数。因此有符号范围 <span class=\"katex-inline\">[-2^{w-1},\\ 2^{w-1}-1]<\/span>。<\/p>\n<p><strong>无符号范围推导<\/strong>。<span class=\"katex-inline\">w<\/span> 位全部计入数值，最小值 0，最大值 <span class=\"katex-inline\">2^w-1<\/span>；运算结果按模 <span class=\"katex-inline\">2^w<\/span> 回绕，超过上界从 0 重新计。<\/p>\n<p><strong>浮点表示的边界<\/strong>。<code>double<\/code> 的位分成符号、指数、尾数三段；指数负责量级，尾数负责精度。它能表示的数值范围远大于同宽整数，但相邻可表示数在大数区间变稀疏，小数运算存在舍入误差。比较两个浮点是否相等，不能直接按全等判断。<\/p>\n<p><strong>宽度次序的依据<\/strong>。标准要求 <code>short<\/code> 宽度不超过 <code>int<\/code>，<code>int<\/code> 不超过 <code>long<\/code>，<code>long<\/code> 不超过 <code>long long<\/code>；具体字节数用 <code>sizeof<\/code> 在目标平台实测。可移植代码不应假定 <code>int<\/code> 一定是 4 字节，需要固定宽度时用 <code>stdint.h<\/code> 提供的 <code>int32_t<\/code> 一类类型。<\/p>\n<p><strong>常见类型用途对照<\/strong>：计数与普通整数用 <code>int<\/code>；字符编码用 <code>char<\/code>；真假状态用 <code>_Bool<\/code>；需要跨平台固定 32 位存整数用 <code>int32_t<\/code>；金额测量与科学计算用 <code>double<\/code>；批量节省存储且精度要求不高时才选 <code>float<\/code>。选择顺序是先定数值范围，再定精度需求，末尾看存储代价，而不是先挑一个最熟的类型。<\/p>\n<p><strong>字符编码的边界<\/strong>。<code>char<\/code> 存放的是字符的编码值：十进制数字字符 <code>&#x27;0&#x27;<\/code> 到 <code>&#x27;9&#x27;<\/code> 编码连续为 48 到 57，大写字母、小写字母各自连续。字符常量在算术表达式中提升为 <code>int<\/code> 参与运算，因此 <code>&#x27;A&#x27; + 1<\/code> 得到 <code>&#x27;B&#x27;<\/code> 的编码；但写回字符变量时仍按 <code>char<\/code> 宽度存储。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：普通整数计数、状态标记用 <code>int<\/code>；更大范围用 <code>long<\/code>/<code>long long<\/code>；位运算与模回绕语义明确时用 <code>unsigned<\/code>；金额与科学计算用 <code>double<\/code>。\n<\/li><li>\n边界一：有符号溢出在标准中属于未定义行为，编译器不保证结果；无符号溢出按模回绕是明确定义。两者不能混为一谈。\n<\/li><li>\n边界二：<code>char<\/code> 与 <code>int<\/code> 参与算术时都会提升为 <code>int<\/code>；但存储字符时仍按 <code>char<\/code> 宽度占用空间。\n<\/li><li>\n失败案例：假设 <code>int<\/code> 恒为 4 字节，把指针差、数组规模按 4 推算，换到 64 位宽整型平台时地址计算错位。\n<\/li><li>\n边界三：浮点零有正负之分，极小误差在连续运算中累积；循环计数应使用整数类型，不应用 <code>double<\/code> 累加次数。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong><code>char<\/code> 字符 vs 整数<\/strong>：<code>char<\/code> 本质是窄整数，能存编码值；写 <code>&#x27;A&#x27;<\/code> 与写编码数值等价，但语义上字符类型用于文本，整数类型用于计数。\n<\/li><li>\n<strong>有符号 vs 无符号<\/strong>：同一 <code>w<\/code> 位，有符号分正负两侧，无符号单侧到 <span class=\"katex-inline\">2^w-1<\/span>；混合比较时 <code>int<\/code> 可能转成 <code>unsigned<\/code>，负数比较结果反直觉。\n<\/li><li>\n<strong><code>float<\/code> vs <code>double<\/code><\/strong>：<code>float<\/code> 省空间但尾数精度低，日常计算默认用 <code>double<\/code>；只有存储大量浮点数据时才为省空间选 <code>float<\/code>。\n<\/li><li>\n<strong>类型宽度 vs 格式符<\/strong>：宽度是存储与解释规则，格式符是 <code>printf<\/code>/<code>scanf<\/code> 的读取约定；两者必须配套，<code>%d<\/code> 配 <code>int<\/code>、<code>%u<\/code> 配 <code>unsigned<\/code>。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的编译链接模型说明类型在编译期决定存储安排。后继：c03 的字符数组以 <code>char<\/code> 为元素类型；c05 的表达式类型提升依据本章宽度次序；c09 的指针算术步长等于元素类型宽度。本章的取值范围结论，是判断溢出、越界与类型转换是否安全的底层依据。<\/p>\n<p>判断一个类型选得是否合适，落到两个可核对事实：上界是否被覆盖，解释规则是否与用途一致。计数、状态、编码、测量各有对应类型；需要固定位数时再用 <code>stdint.h<\/code> 定宽类型，而不是假定某平台默认宽度。原书第 3 章 §3.4.9 列出各类型大小的查看方式，§3.5 讲使用数据类型时的选择顺序，阅读时应结合目标平台 <code>sizeof<\/code> 实测，把类型宽度与用途对齐。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（基本数据类型、位宽与整数取值范围）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：位宽依赖链、取值范围推导与溢出回绕推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把类型宽度与取值范围用对，往回追四层：<\/p>\n<ol><li>\n存储层：变量在内存占一块连续二进制位，位的数量由类型决定。这是最底层事实。\n<\/li><li>\n解释层：同一串位按有符号补码、无符号数或浮点格式解码，得到不同数值；类型同时绑定宽度与解释规则。\n<\/li><li>\n范围层：宽度 <span class=\"katex-inline\">w<\/span> 决定可编码状态总数 <span class=\"katex-inline\">2^w<\/span>；有符号在正负两侧分配，无符号单侧分配，浮点再分符号、指数、尾数三段。\n<\/li><li>\n运算层：表达式求值时按类型提升规则换算，溢出时按类型有无符号区分后果；范围判断先于运算安排类型。\n<\/ol>\n<p>依赖链方向：内存留位 → 类型定解释 → 解释定范围 → 运算按范围判断安全性。抽掉解释层，位串没有数值含义；抽掉范围层，溢出与否无法预判。<\/p>\n<p>再追一层为什么标准不写死每个类型的字节数：C 要适配从嵌入式到大型机的多种硬件，类型宽度跟随平台算术效率调整；标准只锁死宽度次序与最小保证，固定宽度类型交给 <code>stdint.h<\/code>。这一约束决定了可移植代码必须用 <code>sizeof<\/code> 实测，不能凭印象写死字节数。<\/p>\n<h2>正向推导：范围公式怎样得到<\/h2>\n<p><strong>有符号整数<\/strong>。设位宽 <span class=\"katex-inline\">w<\/span>。最高位为符号位 <span class=\"katex-inline\">s<\/span>，其余 <span class=\"katex-inline\">w-1<\/span> 位为数值位 <span class=\"katex-inline\">v<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">s=0<\/span> 时表非负：<span class=\"katex-inline\">v<\/span> 可取 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">2^{w-1}-1<\/span>，最大值即全 1 的数值位。\n<\/li><li>\n<span class=\"katex-inline\">s=1<\/span> 时表负数：补码表示下，编码 <span class=\"katex-inline\">(1,0,\\dots,0)<\/span> 约定给最小负值 <span class=\"katex-inline\">-2^{w-1}<\/span>；比正数侧多一个编码位置。\n<\/li><li>\n合并两侧，有符号范围 <span class=\"katex-inline\">[-2^{w-1},\\ 2^{w-1}-1]<\/span>，可编码状态总数 <span class=\"katex-inline\">2^w<\/span>。\n<\/ol>\n<p><strong>无符号整数<\/strong>。<span class=\"katex-inline\">w<\/span> 位全部为数值位，编码从 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">2^w-1<\/span>；超出上界的结果按模 <span class=\"katex-inline\">2^w<\/span> 回绕：<span class=\"katex-inline\">x \\bmod 2^w<\/span>，落回 <span class=\"katex-inline\">[0,2^w-1]<\/span>。<\/p>\n<p><strong>浮点类型<\/strong>。位划分为符号位、指数位 <span class=\"katex-inline\">E<\/span>、尾数位 <span class=\"katex-inline\">M<\/span>。数值约等于 <span class=\"katex-inline\">(-1)^s \\times 2^{E-\\text{bias}} \\times (1+M)<\/span>。指数决定量级跨度，尾数决定同一量级内的分辨细度；同宽下浮点范围大但精度有限，大数区间相邻两数间隔被拉大。<\/p>\n<p><strong>类型提升次序<\/strong>。算术运算中，<code>char<\/code>、<code>short<\/code> 先提升到 <code>int<\/code>；<code>int<\/code> 与 <code>unsigned<\/code> 运算时 <code>int<\/code> 转 <code>unsigned<\/code>；<code>int<\/code> 与 <code>double<\/code> 运算时 <code>int<\/code> 转 <code>double<\/code>。提升方向是向更宽、精度更高的类型靠拢，避免先损精度再补回。<\/p>\n<p>推导依据：范围公式只依赖位宽与编码约定；提升次序由标准类型层次规定，不随编译器偏好改变。<\/p>\n<h2>算例一：按位宽计算四个类型的上下界<\/h2>\n<p><strong>例 1：16 位 <code>short<\/code>（<span class=\"katex-inline\">w=16<\/span>）<\/strong>。<\/p>\n<ol><li>\n有符号：下界 <span class=\"katex-inline\">-2^{15}=-32768<\/span>，上界 <span class=\"katex-inline\">2^{15}-1=32767<\/span>。\n<\/li><li>\n无符号：下界 <span class=\"katex-inline\">0<\/span>，上界 <span class=\"katex-inline\">2^{16}-1=65535<\/span>。\n<\/li><li>\n核对状态数：有符号覆盖 <span class=\"katex-inline\">32768<\/span> 个负数、<span class=\"katex-inline\">32768<\/span> 个非负数（含 0），合计 <span class=\"katex-inline\">65536=2^{16}<\/span>；无符号同样 <span class=\"katex-inline\">65536<\/span> 个编码，两侧总数一致。\n<\/ol>\n<p><strong>例 2：32 位 <code>int<\/code>（<span class=\"katex-inline\">w=32<\/span>）<\/strong>。<\/p>\n<ol><li>\n有符号：下界 <span class=\"katex-inline\">-2^{31}=-2147483648<\/span>，上界 <span class=\"katex-inline\">2^{31}-1=2147483647<\/span>。\n<\/li><li>\n无符号：上界 <span class=\"katex-inline\">2^{32}-1=4294967295<\/span>。\n<\/li><li>\n核对：<span class=\"katex-inline\">2^{31}=2147483648<\/span>，加 1 得 <span class=\"katex-inline\">2147483647<\/span>；<span class=\"katex-inline\">2^{32}=4294967296<\/span>，减 1 得上界。\n<\/ol>\n<p><strong>例 3：<code>char<\/code>（<span class=\"katex-inline\">w=8<\/span>）<\/strong>。若按有符号解释，范围 <span class=\"katex-inline\">[-128,127]<\/span>；无符号解释范围 <span class=\"katex-inline\">[0,255]<\/span>。字符 <code>&#x27;0&#x27;<\/code> 的编码是 48，与数值 0 相差 48；比较字符时必须用编码值，不能把字符 <code>&#x27;0&#x27;<\/code> 当整数 0。<\/p>\n<p><strong>例 4：宽度实测对照<\/strong>。在常见 64 位平台上，<code>sizeof(int)<\/code> 为 4，<code>sizeof(long)<\/code> 可能为 8；换平台后 <code>long<\/code> 宽度可能变为 4。判断某平台真实宽度，唯一可靠动作是运行 <code>sizeof<\/code> 打印，而不是套用其他平台数值。<\/p>\n<h2>算例二：溢出与回绕逐值推演<\/h2>\n<p><strong>场景 A：有符号上界加 1<\/strong>。设 32 位 <code>int x = 2147483647;<\/code> 执行 <code>x = x + 1;<\/code>。<\/p>\n<ol><li>\n上界是 <span class=\"katex-inline\">2^{31}-1<\/span>，加 1 应为 <span class=\"katex-inline\">2^{31}<\/span>，超出有符号可表示范围。\n<\/li><li>\n标准规定有符号溢出属于未定义行为；实际常见补码机器上，位模式从 <code>0111...111<\/code> 变成 <code>1000...000<\/code>，按有符号解码为 <span class=\"katex-inline\">-2147483648<\/span>。\n<\/li><li>\n不能把这个回绕结果当成可移植保证：换编译器可能优化掉判断或产生其他后果。\n<\/ol>\n<p><strong>场景 B：无符号回绕<\/strong>。设 <code>unsigned int u = 0;<\/code> 执行 <code>u = u - 1;<\/code>。<\/p>\n<ol><li>\n按数值应得 <span class=\"katex-inline\">-1<\/span>，无符号类型按模 <span class=\"katex-inline\">2^{32}<\/span> 解释。\n<\/li><li>\n<span class=\"katex-inline\">-1 \\bmod 2^{32}=2^{32}-1=4294967295<\/span>。\n<\/li><li>\n位模式全 1，与有符号下的 <span class=\"katex-inline\">-1<\/span> 位模式相同，差别只在解码规则；无符号下该结果是明确定义的回绕值。\n<\/ol>\n<p><strong>场景 C：混合符号比较<\/strong>。设 <code>int a = -1; unsigned int b = 1;<\/code> 比较 <code>a &lt; b<\/code>。<\/p>\n<ol><li>\n按规则 <code>a<\/code> 在比较前转成 <code>unsigned int<\/code>；<code>-1<\/code> 的位模式转无符号为 <span class=\"katex-inline\">4294967295<\/span>。\n<\/li><li>\n比较变成 <span class=\"katex-inline\">4294967295 &lt; 1<\/span>，结果为假。\n<\/li><li>\n直觉上 <span class=\"katex-inline\">-1 &lt; 1<\/span> 成立，这里得出相反结论，根源是有符号侧被转换成无符号解释。\n<\/ol>\n<p>核对三步：先看两侧类型，再看转换方向，末尾按转换后的类型比较；跳过中间转换直接凭直觉比较，是这类错误的来源。<\/p>\n<h2>反事实推演：改变类型约定会怎样<\/h2>\n<p><strong>把有符号溢出也定义成模回绕<\/strong>：程序会得到确定回绕值，但标准选择不保证有符号溢出，是为了给编译器优化留出空间；若把回绕当保证，优化开高等级后代码行为可能偏离预期。边界在于：无符号回绕可依赖，有符号溢出不可依赖。<\/p>\n<p><strong>取消类型宽度区分，所有整数统一 64 位<\/strong>：小变量白白占空间，且无法表达按窄位宽访问硬件寄存器的需求；类型宽度分级正是为范围、精度与存储代价分层服务。<\/p>\n<p><strong>让浮点按精确十进制存储<\/strong>：小数如 0.1 在二进制下是无限循环分数，无法精确存入；取消二进制格式，就要换一套量级与尾数表示，运算复杂度与硬件支持都要重算。<\/p>\n<h2>算例三：字面量类型与赋值截断推演<\/h2>\n<p>取三组字面量与赋值：<\/p>\n<ol><li>\n<code>long big = 1000000;<\/code>：<code>1000000<\/code> 按 <code>int<\/code> 字面量处理，只要该值在 <code>int<\/code> 范围内就安全；若平台 <code>int<\/code> 为 16 位（上界 32767），这个字面量本身已超出，需要写 <code>1000000L<\/code> 标明 <code>long<\/code>。\n<\/li><li>\n<code>float f = 3.14;<\/code>：<code>3.14<\/code> 是 <code>double<\/code> 字面量，赋给 <code>float<\/code> 时尾数按 <code>float<\/code> 精度舍入；若直接写 <code>3.14f<\/code>，字面量本身就是 <code>float<\/code>。\n<\/li><li>\n<code>char c = 200;<\/code>：若 <code>char<\/code> 按有符号解释，200 超出 127，位模式解码为负数；按无符号解释才是 200。同一个位串在两种解释下数值不同，说明类型同时约束解码方向。\n<\/ol>\n<p>核对依据：字面量后缀决定字面量类型；赋值时右侧先按自身类型求值，再按左侧类型转换；转换是否丢精度，看两侧范围与精度差。<\/p>\n<p>再看一次算术提升链。表达式 <code>&#x27;A&#x27; + 1<\/code>：<\/p>\n<ol><li>\n<code>&#x27;A&#x27;<\/code> 是 <code>char<\/code> 常量，先提升为 <code>int<\/code>，编码值 65。\n<\/li><li>\n与整数 1 相加，<code>int<\/code> 加 <code>int<\/code>，结果 66。\n<\/li><li>\n若写 <code>char c = &#x27;A&#x27; + 1;<\/code>，66 再截断存入 <code>char<\/code>；66 在 8 位范围内，存储结果为 <code>&#x27;B&#x27;<\/code>。\n<\/ol>\n<p>这条链展示提升方向：窄类型在运算前加宽，运算在较宽类型上完成，赋值时才按目标类型收窄；收窄是否安全，要看原值是否落在目标范围内。<\/p>\n<h2>类型选择决策顺序<\/h2>\n<p>面对一个新变量，按四步判断类型：<\/p>\n<ol><li>\n数值是离散计数还是连续测量：离散用整数系列，测量用浮点系列。\n<\/li><li>\n估计最大可能值：选能覆盖上界的最窄宽度；需要固定位数再用 <code>stdint.h<\/code> 别名。\n<\/li><li>\n是否涉及模回绕或位模式操作：语义明确时才用 <code>unsigned<\/code>；普通计数保持有符号。\n<\/li><li>\n精度需求：默认 <code>double<\/code>，批量存储且精度宽松再考虑 <code>float<\/code>。\n<\/ol>\n<p>四步的依据是范围先于精度、精度先于存储代价；顺序颠倒会先挑省空间的类型，再发现数值装不下或精度不够。原书第 3 章 §3.5 提示使用数据类型时先确认变量用途，§3.6 列出参数与陷阱，其中类型与格式符错配、字符与数字混淆都属于类型选择阶段遗留的问题。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>假定 <code>int<\/code> 恒为 4 字节<\/strong>。在 16 位平台上 <code>int<\/code> 为 2 字节，上界仅 32767；按 4 字节推算数组跨度或地址差，结果错位。复盘：需要固定宽度就用 <code>int32_t<\/code> 这类定宽类型，通用计数用平台默认宽度并以 <code>sizeof<\/code> 核对。<\/p>\n<p><strong>字符与数字直接比较<\/strong>。判断输入是否为数字，写成 <code>if (c &gt;= 0 &amp;&amp; c &lt;= 9)<\/code>；<code>c<\/code> 存的是字符编码，数字字符编码为 48 到 57，比较应写成 <code>c &gt;= &#x27;0&#x27; &amp;&amp; c &lt;= &#x27;9&#x27;<\/code>，再用 <code>c - &#x27;0&#x27;<\/code> 转数值。<\/p>\n<p><strong>用浮点做循环计数<\/strong>。<code>for (double d = 0; d &lt; 10; d += 0.1)<\/code> 累加 0.1 存在舍入误差，累计次数可能偏离预期；循环次数是离散计数，应用整数类型承载。<\/p>\n<p><strong>混合符号比较未察觉转换<\/strong>。见场景 C：负的 <code>int<\/code> 与 <code>unsigned<\/code> 比较前被转无符号，结论反转。复盘：比较前先确认两侧是否同符号类型，必要时显式转换。<\/p>\n<h2>补码编码与解码推演<\/h2>\n<p>以 4 位宽度（<span class=\"katex-inline\">w=4<\/span>）为例把补码规则走一遍，便于把 32 位结论压缩到可手算规模。<\/p>\n<ol><li>\n编码 0110：符号位 0，非负；数值位 110 为 <span class=\"katex-inline\">2^2+2^1=6<\/span>，解码 +6。\n<\/li><li>\n编码 1000：符号位 1，按约定是最小负值 <span class=\"katex-inline\">-2^{3}=-8<\/span>。\n<\/li><li>\n编码 1111：符号位 1，数值位全 1；补码解码为 <span class=\"katex-inline\">-8+7=-1<\/span>。\n<\/li><li>\n编码 0000：解码 0。\n<\/li><li>\n范围核对：非负侧 0 到 7，负侧 -8 到 -1，共 16 个编码，等于 <span class=\"katex-inline\">2^4<\/span>。\n<\/ol>\n<p>推广到 <span class=\"katex-inline\">w<\/span> 位：符号位决定方向，数值位按二进制展开；负侧比正侧多一个最小负值编码。手算小宽度编码，是为了理解 32 位机器上同一规则的放大版本，而不是把 4 位数值直接搬到程序里。<\/p>\n<p>再看无符号对照：同样 4 位，0110 解码 6，1000 解码 8，1111 解码 15，0000 解码 0，范围 0 到 15。位串相同，解码规则不同，数值不同；这就是&quot;类型同时绑定宽度与解释&quot;的具体含义。<\/p>\n<h2>浮点累加误差算例<\/h2>\n<p>设用 <code>double<\/code> 反复累加 0.1，共 10 次。<\/p>\n<ol><li>\n0.1 在二进制下无法精确表示，存入时已是最近的可表示近似值。\n<\/li><li>\n每加一次，近似误差叠加一次；10 次累加后结果与理论值 1.0 可能存在极小偏差。\n<\/li><li>\n若循环条件写成&quot;累加值等于 1.0 时停止&quot;，比较可能因偏差不成立，循环多走或少走。\n<\/li><li>\n离散次数用整数计数：<code>for (int i = 0; i &lt; 10; i++)<\/code>，次数由整数变量控制，不依赖浮点相等判断。\n<\/ol>\n<p>这条算例说明浮点类型的边界：量级跨度大，但同一量级内分辨有限；涉及累计、计数、相等判断的场景，优先选整数类型。原书第 3 章 §3.4.6 介绍 <code>float<\/code>、<code>double<\/code>、<code>long double<\/code> 时，应结合这条边界理解：选浮点是为了连续测量，不是为了替代所有整数用途。<\/p>\n<h2>类型选择对照算例<\/h2>\n<p>按用途选类型，逐个核对范围与精度：<\/p>\n<ol><li>\n人数计数：非负、通常不大，用 <code>int<\/code>；需要更大范围用 <code>long<\/code>。\n<\/li><li>\n字符编码：用 <code>char<\/code>；参与算术时提升为 <code>int<\/code>。\n<\/li><li>\n真假状态：用 <code>_Bool<\/code>，取值 0 或 1。\n<\/li><li>\n金额测量：用 <code>double<\/code>；批量省空间且精度宽松才用 <code>float<\/code>。\n<\/li><li>\n必须固定 32 位存整数：用 <code>int32_t<\/code>，不假定 <code>int<\/code> 宽度。\n<\/ol>\n<p><strong>宽度核对动作<\/strong>。在目标平台运行 <code>sizeof<\/code> 打印各类型字节数，再与上界估计对照：估计上界落在类型范围内才选定。把某一台机器的 <code>sizeof<\/code> 结果抄成通用结论，是移植错误的常见来源。<\/p>\n<p><strong>符号选择核对<\/strong>。普通计数保持有符号；只有做位模式操作、模回绕语义明确、或纯非负数量时才用 <code>unsigned<\/code>。混合比较前先确认两侧符号一致，避免负 <code>int<\/code> 被转无符号后结论反转。浮点不承担离散计数；循环次数、数组下标用整数类型。<\/p>\n<h2>再推一层：类型宽度怎样支撑后续概念<\/h2>\n<p>指针算术的步长等于元素类型宽度：<code>int <em><\/code> 加 1 移动 4 字节（平台实测），<code>char <\/em><\/code> 加 1 移动 1 字节；这条规则直接来自本章位宽结论。函数参数按值传递时，形参按类型宽度在栈上留出空间；表达式隐式提升按类型层次方向进行。离开本章后，凡涉及&quot;占多少位、能存多大、按什么解码&quot;的判断，都回到位宽与解释规则两层来分析。<\/p>\n<p>原书第 3 章 §3.4.5 介绍 <code>stdint.h<\/code> 与 <code>inttypes.h<\/code> 的可移植类型：当代码必须假定固定位数时，这些头文件提供 <code>int8_t<\/code>、<code>uint32_t<\/code> 等别名，把&quot;平台宽度不确定&quot;的风险收敛到显式选择。§3.4.9 的类型大小表，应配合 <code>sizeof<\/code> 在目标平台实测阅读，不能把某一台机器的字节数抄成通用结论。<\/p>\n<p>把本章结论压缩成三条可执行判断：其一，声明变量前先估计上界，上界落在哪个范围就选哪个宽度；其二，有符号溢出不可依赖，无符号回绕才可依赖，混合符号比较先查转换方向；其三，格式符必须与变量类型配套，<code>%d<\/code>、<code>%u<\/code>、<code>%f<\/code>、<code>%ld<\/code> 各对应一类类型，配错时编译期未必报错，运行期按错误宽度读内存。这三条在后面字符串输入输出、表达式求值与指针计算中反复用到。判断类型选择是否合理，最终回到两个可核对事实：上界是否被覆盖，解释规则是否与用途一致；两条都满足，类型选择才算落地。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n不看公式，能否从 <span class=\"katex-inline\">w<\/span> 位推出有符号与无符号的上下界？\n<\/li><li>\n有符号溢出与无符号回绕，后果一个是未定义行为、一个是明确定义，差别落在哪条规则上？\n<\/li><li>\n<code>char &#x27;0&#x27;<\/code>、<code>&#x27;A&#x27;<\/code> 与整数 0、65 的关系是什么？为什么不能直接比较字符与数字？\n<\/li><li>\n混合 <code>int<\/code> 与 <code>unsigned<\/code> 比较时，转换方向朝哪一侧？\n<\/li><li>\n为什么循环计数不用 <code>double<\/code>？\n<\/li><li>\n需要固定 32 位宽度时，应该用哪类类型，而不是假定 <code>int<\/code> 宽度？\n<\/ol>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出 8 位、16 位、32 位有符号与无符号整数的取值范围，并核对编码状态总数。\n<\/li><li>\n32 位下 <code>-1<\/code> 转 <code>unsigned int<\/code> 得到多少？推导模 <span class=\"katex-inline\">2^{32}<\/span> 的计算过程。\n<\/li><li>\n为什么 <code>double<\/code> 不能直接判断两次计算结果全等？尾数精度与指数各承担什么职责？\n<\/li><li>\n<code>short<\/code>、<code>int<\/code>、<code>long<\/code> 的宽度次序由什么保证？绝对字节数在哪个阶段确定？\n<\/li><li>\n一段代码把循环次数存在 <code>float<\/code> 里，可能出现什么偏离？换成整数类型解决了哪一层问题？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "基本数据类型、位宽与整数取值范围"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.178<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">基本数据类型、位宽与整数取值范围<\/a><\/span><\/div><h1>字符数组、null 终止符与字符串长度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch02（原书第 4 章 §4.2，PDF 第 178 页起）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>C 语言的字符串是存放在 <code>char<\/code> 数组中、以 null 字符 <code>&#x27;\\0&#x27;<\/code>（数值 0）收尾的字符序列；长度由遍历到 null 之前的字符个数确定，末尾的 null 本身不计入长度。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>程序要处理名字、句子、提示语这类文本，困难在于字符序列本身没有自带长度字段。早期语言用长度前缀存字符串，C 的做法是用一个结束标记划定序列边界。这个设计带来两个必须弄清的问题：一是数组里怎样安排字符与结束标记，二是所有字符串函数怎样知道在哪停止。不理解 null 终止规则，写字符串时会漏写结束符，读字符串时会越界读到相邻内存；<code>strlen<\/code>、<code>puts<\/code>、<code>%s<\/code>、<code>strcpy<\/code>、<code>strcmp<\/code> 全部依赖这条规则。本章把字符数组的内存布局与遍历不变式讲清，为第 11 章字符串函数与第 10 章指针遍历打基础。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>字符数组<\/strong>：元素类型为 <code>char<\/code> 的数组，每个元素占一个字节，存放一个字符编码。声明形如 <code>char name[40];<\/code>，方括号内是元素个数。<\/p>\n<p><strong>null 字符<\/strong>：字面量写作 <code>&#x27;\\0&#x27;<\/code>，数值为 0，是字符串结束标志。它与字符 <code>&#x27;0&#x27;<\/code> 不同：<code>&#x27;0&#x27;<\/code> 编码 48，<code>&#x27;\\0&#x27;<\/code> 编码 0；两者位模式不同，不能互换。<\/p>\n<p><strong>字符串字面量<\/strong>：用双引号括起的字符序列，如 <code>&quot;Amy&quot;<\/code>；编译器在末尾自动补一个 null，并存放在只读数据区。用数组接收字面量时，字符被复制进数组，末尾同样带 null。<\/p>\n<p><strong><code>strlen()<\/code><\/strong>：标准库函数，参数为字符数组首地址，从首元素逐个计数，遇到 null 停止，返回 null 之前的字符个数。头文件 <code>&lt;string.h&gt;<\/code> 提供其原型。<\/p>\n<p><strong>两种初始化对照<\/strong>：<\/p>\n<pre class=\"lang-c\"><code>char a[6] = &quot;Hello&quot;;   /* 5 个字符加 null，占 6 字节 */\nchar b[] = &quot;Hi&quot;;       /* 编译器按字面量长度加 1 定数组大小 */<\/code><\/pre>\n<p><strong>正例<\/strong>：<code>char s[10] = &quot;cat&quot;;<\/code> 布局为 <code>c<\/code>、<code>a<\/code>、<code>t<\/code>、<code>\\0<\/code>，其余字节未使用；<code>strlen(s)<\/code> 返回 3。<\/p>\n<p><strong>反例<\/strong>：<code>char s[3] = &quot;cat&quot;;<\/code> 没有给 null 留位置，数组不构成合法字符串；后续 <code>strlen<\/code> 遍历越过数组边界，结果未定义。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>遍历不变式<\/strong>：设指针从数组首元素出发，每读到一个非 null 字符，计数加 1 并前进一格；读到 null 即停止。不变式：当前计数等于从起点到当前指针之前的字符个数。终止条件是当前元素为 <code>&#x27;\\0&#x27;<\/code>，停止位置就是结束标记。<\/p>\n<p><strong>长度计数推导<\/strong>：若有效字符有 <span class=\"katex-inline\">n<\/span> 个，数组至少需要 <span class=\"katex-inline\">n+1<\/span> 个元素存字符与 null。<code>strlen<\/code> 返回 <span class=\"katex-inline\">n<\/span>；<code>sizeof<\/code> 数组得到的是声明宽度（含未使用字节），两者口径不同。<\/p>\n<p><strong>内存布局推演<\/strong>。设 <code>char msg[8];<\/code> 存入 <code>&quot;Bye&quot;<\/code>：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>下标<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><\/tr><\/thead><tbody><tr><td>内容<\/td><td><code>B<\/code><\/td><td><code>y<\/code><\/td><td><code>e<\/code><\/td><td><code>\\0<\/code><\/td><td>未用<\/td><td>未用<\/td><td>未用<\/td><td>未用<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>strlen(msg)=3<\/code>；<code>sizeof(msg)=8<\/code>；若只看有效内容，占用 4 字节（含 null）。<\/p>\n<p><strong>为什么必须显式留 null<\/strong>：数组本身只提供连续字节，函数无法从数组对象上直接读出长度；没有结束标记，遍历就没有停止依据。C 用一个额外字节换得遍历规则的统一，代价是数组宽度必须为字符数加 1 预留位置。<\/p>\n<p><strong>与其他语言字符串的差别<\/strong>：带长度前缀的结构把长度存在独立字段，取长度是一次读取；C 字符串取长度要遍历到结尾。这一差别影响性能判断：频繁求长度的场景，不能假设 <code>strlen<\/code> 是常数时间操作；也影响安全判断：任何写入字符串的操作都要同时检查字符位置与 null 位置。<\/p>\n<p><strong>字符数组的两种用途<\/strong>：一是当字符串用，末尾带 null，交给字符串库函数；二是当字节缓冲区用，存任意二进制数据，不要求 null 结尾。同一块内存两种用途，差别只在是否遵守 null 终止约定；混用是错误来源。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：所有标准字符串函数都要求参数指向以 null 结尾的字符序列；自己手写遍历也应遵循同一规则。\n<\/li><li>\n边界一：字符数组可以存任意字符，但只有末尾带 null 才是合法字符串；不带 null 的字符数组只能按字节逐个访问，不能传给 <code>strlen<\/code> 一类函数。\n<\/li><li>\n边界二：向数组写入字符串时，目标宽度必须大于等于字符数加 1；只复制字符不留 null，是缓冲区溢出类错误的常见来源。\n<\/li><li>\n失败案例：用 <code>scanf(&quot;%s&quot;, name)<\/code> 读入超长内容，输入超过数组宽度时覆盖相邻内存，null 位置不可控。\n<\/li><li>\n边界三：字符串字面量属于只读区；用 <code>char *<\/code> 直接指向字面量并尝试修改，属于未定义行为，存放字符串应使用数组。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong><code>strlen<\/code> vs <code>sizeof<\/code><\/strong>：<code>strlen<\/code> 数 null 之前的字符个数，随内容变化；<code>sizeof<\/code> 给声明的字节宽度，是编译期确定的常量。对数组求 <code>sizeof<\/code> 得数组大小；对退化成指针的形参求 <code>sizeof<\/code> 只得指针宽度。\n<\/li><li>\n<strong>字符数组 vs 字符指针<\/strong>：数组名是数组对象标识，表达式中退化为首元素地址；指针变量可以重新指向别处，数组名不能被赋值。<code>char *p = &quot;Hi&quot;;<\/code> 中 <code>p<\/code> 指向只读字面量。\n<\/li><li>\n<strong>null 字符 vs 空字符串<\/strong>：空字符串 <code>&quot;&quot;<\/code> 占一个字节存 <code>&#x27;\\0&#x27;<\/code>，<code>strlen<\/code> 返回 0；它不是没有存储，而是有结束标记的最短字符串。\n<\/li><li>\n<strong><code>char<\/code> 数值 vs 字符<\/strong>：<code>char<\/code> 是窄整数，字符与编码可互转；字符串语义针对字符序列，算术语义针对编码值。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 的 <code>char<\/code> 类型宽度是数组元素大小的依据；c01 的头文件规则说明 <code>&lt;string.h&gt;<\/code> 提供 <code>strlen<\/code> 原型。后继：c04 的 <code>%s<\/code> 格式按 null 规则输出字符串；c09 的指针遍历把本章逐格前进的规则推广到任意元素类型；第 11 章的 <code>strcat<\/code>、<code>strcmp<\/code>、<code>strcpy<\/code> 都以 null 终止为前提。本章的遍历不变式是理解一切字符串操作的底层规则。<\/p>\n<p>写字符串相关代码时，容量、写入、读取三个环节分别核对：数组宽度按字符数加 1 预留；写入结束补 null；读取前确认已被合法字符串初始化。<code>strlen<\/code> 随内容变化，<code>sizeof<\/code> 随声明宽度固定，两个口径不能互相替代。原书第 4 章 §4.2.2 讲字符串使用，§4.2.3 讲 <code>strlen()<\/code>；每个示例都应先画内存表，再核对长度与容量两个数。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（字符数组、null 终止符与字符串长度）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：null 终止依赖链、字符串遍历推演与长度口径对照<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把字符串存对、读对，往回追四层：<\/p>\n<ol><li>\n元素层：字符串由 <code>char<\/code> 元素组成，每个元素一个字节，存字符编码。这是存储基础。\n<\/li><li>\n标记层：序列末尾追加一个数值 0 的 <code>&#x27;\\0&#x27;<\/code>，作为遍历停止依据；没有标记，字节序列没有边界。\n<\/li><li>\n遍历层：<code>strlen<\/code>、输出、复制、比较都从首元素出发逐格前进，遇到 null 停在标记位，不计入长度。\n<\/li><li>\n容量层：数组声明宽度必须至少为字符数加 1；写满字符不留 null，后续函数行为未定义。\n<\/ol>\n<p>依赖链方向：<code>char<\/code> 元素 → null 标记 → 统一遍历规则 → 容量预留。抽掉标记层，所有字符串函数失去停止条件；抽掉容量层，写入会覆盖相邻内存。<\/p>\n<p>再追一层为什么 C 选结束标记而不是长度前缀：结束标记让字符串字面量与字符数组共用同一套遍历规则，数组不必额外携带长度字段；代价是每次遍历都要扫到 null，且容量必须多留一个字节。这一取舍决定了 C 字符串库函数的统一接口：参数只传首地址，边界由结尾标记提供。<\/p>\n<h2>正向推导：遍历规则与长度公式<\/h2>\n<p><strong>遍历不变式<\/strong>。设数组首地址为 <span class=\"katex-inline\">p_0<\/span>，指针 <span class=\"katex-inline\">p<\/span> 从 <span class=\"katex-inline\">p_0<\/span> 出发，计数器 <span class=\"katex-inline\">n<\/span> 初始 0。每一步：<\/p>\n<ol><li>\n检查 <span class=\"katex-inline\">*p<\/span> 是否为 0（null）。若是，停止，返回 <span class=\"katex-inline\">n<\/span>。\n<\/li><li>\n若不是，<span class=\"katex-inline\">n<\/span> 加 1，<span class=\"katex-inline\">p<\/span> 前进一格（一个 <code>char<\/code> 宽度），回到第 1 步。\n<\/ol>\n<p>不变式：进入每一步时，<span class=\"katex-inline\">n<\/span> 等于 <span class=\"katex-inline\">[p_0,p)<\/span> 区间内的字符个数。停止时 <span class=\"katex-inline\">*p=0<\/span>，因此 <span class=\"katex-inline\">n<\/span> 等于 null 之前的字符总数。<\/p>\n<p><strong>长度与容量公式<\/strong>。若有效字符数为 <span class=\"katex-inline\">n<\/span>，合法数组宽度 <span class=\"katex-inline\">W<\/span> 满足 <span class=\"katex-inline\">W \\ge n+1<\/span>：<span class=\"katex-inline\">n<\/span> 个位置存字符，1 个位置存 null。<code>strlen<\/code> 返回 <span class=\"katex-inline\">n<\/span>；<code>sizeof(数组名)<\/code> 返回 <span class=\"katex-inline\">W<\/span>；数组中未使用字节不参与 <code>strlen<\/code> 计数。<\/p>\n<p><strong>字面量到数组的复制<\/strong>。编译器处理 <code>&quot;Amy&quot;<\/code> 时，在只读区生成 <code>A,m,y,\\0<\/code> 四个字节；用数组接收时，这四个字节被复制进数组，数组宽度由声明或字面量长度确定。字面量本身的 null 随复制一起进入数组。<\/p>\n<p><strong>遍历与指针的关系<\/strong>。<code>strlen<\/code> 内部按元素前进；因为 <code>char<\/code> 宽度为 1，指针加 1 对应地址加 1。换成其他元素类型，同一套遍历规则仍成立，只是步长换成对应元素宽度，这是 c09 指针算术的基础。<\/p>\n<p>推导依据：停止条件只看元素是否为 0；计数口径只统计 null 之前的字符；容量口径在编译期由声明确定，与运行期内容无关。<\/p>\n<h2>算例一：<code>&quot;Amy&quot;<\/code> 的内存布局与逐格计数<\/h2>\n<p>声明 <code>char name[40];<\/code>，执行 <code>scanf(&quot;%s&quot;, name);<\/code> 输入 <code>Amy<\/code>。<\/p>\n<p>内存布局（下标 0 起）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>下标<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4…39<\/th><\/tr><\/thead><tbody><tr><td>内容<\/td><td><code>A<\/code><\/td><td><code>m<\/code><\/td><td><code>y<\/code><\/td><td><code>\\0<\/code><\/td><td>未使用<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>strlen(name)<\/code> 推演：<\/p>\n<ol><li>\n<span class=\"katex-inline\">p<\/span> 指向下标 0，<code>*p=&#x27;A&#x27;<\/code>，非 null，<span class=\"katex-inline\">n=1<\/span>，前进到下标 1。\n<\/li><li>\n<code>*p=&#x27;m&#x27;<\/code>，非 null，<span class=\"katex-inline\">n=2<\/span>，前进到下标 2。\n<\/li><li>\n<code>*p=&#x27;y&#x27;<\/code>，非 null，<span class=\"katex-inline\">n=3<\/span>，前进到下标 3。\n<\/li><li>\n<code>*p=&#x27;\\0&#x27;<\/code>，停止，返回 <span class=\"katex-inline\">n=3<\/span>。\n<\/li><li>\n核对：<code>strlen(&quot;Amy&quot;)=3<\/code>；有效内容占 3 字节，含 null 共占 4 字节；数组声明宽度 40，<code>sizeof(name)=40<\/code>。\n<\/ol>\n<p>再核对两个易混点：字符 <code>&#x27;A&#x27;<\/code> 编码 65、<code>&#x27;m&#x27;<\/code> 编码 109、<code>&#x27;y&#x27;<\/code> 编码 121，都不是 0；null 编码 0，与数字字符 <code>&#x27;0&#x27;<\/code>（编码 48）位模式不同。若把 <code>&#x27;0&#x27;<\/code> 当 null 判断停止位置，遍历会继续往下走。<\/p>\n<h2>算例二：三种声明下 <code>strlen<\/code> 与 <code>sizeof<\/code> 对照<\/h2>\n<p><strong>声明 A<\/strong>：<code>char a[6] = &quot;Hello&quot;;<\/code><\/p>\n<ol><li>\n字符 <code>H,e,l,l,o<\/code> 加 null 共 6 字节，宽度刚好。\n<\/li><li>\n<code>strlen(a)=5<\/code>，<code>sizeof(a)=6<\/code>。\n<\/li><li>\n数组后 0 字节空余；再追加字符就越界。\n<\/ol>\n<p><strong>声明 B<\/strong>：<code>char b[] = &quot;Hi&quot;;<\/code><\/p>\n<ol><li>\n编译器按字面量长度加 1 定宽：<code>H,i,\\0<\/code>，宽度 3。\n<\/li><li>\n<code>strlen(b)=2<\/code>，<code>sizeof(b)=3<\/code>。
