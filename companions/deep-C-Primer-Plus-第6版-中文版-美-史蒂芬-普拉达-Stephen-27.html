if<\/code> 分支，为假走 <code>else<\/code> 分支；两条路径互斥。<\/p>\n<p><strong><code>else<\/code> 配对规则<\/strong>：<code>else<\/code> 与它上方最近的、尚未配对的 <code>if<\/code> 结合；书写缩进不改变配对，只影响可读性。要让 <code>else<\/code> 挂外层 <code>if<\/code>，用花括号把内层 <code>if<\/code> 包成块。<\/p>\n<p><strong>逻辑运算符<\/strong>：<code>&amp;&amp;<\/code> 逻辑与，两侧都真才真；<code>||<\/code> 逻辑或，一侧为真即真；<code>!<\/code> 逻辑非，翻转真假。短路规则：<code>&amp;&amp;<\/code> 左侧为假，整体已假，右侧不计算；<code>||<\/code> 左侧为真，整体已真，右侧不计算。<\/p>\n<p><strong><code>switch<\/code> 结构<\/strong>：括号内表达式求值，与各 <code>case<\/code> 标签常量比较；命中标签后从该处顺序执行，直到 <code>break<\/code> 或结构结束；<code>default<\/code> 标签在无匹配时进入。<code>case<\/code> 后必须是整型常量，不能用变量做标签。<\/p>\n<p><strong><code>break<\/code> 与 <code>continue<\/code><\/strong>：<code>break<\/code> 跳出当前 <code>switch<\/code> 或循环；<code>continue<\/code> 跳过本次循环体剩余部分，直接进入下一次条件判断。<code>goto<\/code> 跳到标号位置，跨层跳转，一般不用于常规结构。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-c\"><code>if (score &gt;= 60)\n    printf(&quot;pass\\n&quot;);\nelse\n    printf(&quot;fail\\n&quot;);\n\nswitch (grade)\n{\n    case &#x27;A&#x27;: printf(&quot;excellent\\n&quot;); break;\n    case &#x27;B&#x27;: printf(&quot;good\\n&quot;); break;\n    default: printf(&quot;other\\n&quot;); break;\n}<\/code><\/pre>\n<p><strong>反例<\/strong>：嵌套 <code>if<\/code> 中靠缩进判断 <code>else<\/code>；<code>switch<\/code> 命中后漏 <code>break<\/code>，贯穿执行后续标签；条件里依赖右侧必定执行的副作用。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>配对推演<\/strong>。编译器按语法层次匹配：每个 <code>else<\/code> 向上找最近的未配对 <code>if<\/code>。代码片段：<\/p>\n<pre class=\"lang-c\"><code>if (a &gt; 0)\n    if (b &gt; 0)\n        printf(&quot;both\\n&quot;);\nelse\n    printf(&quot;?\\n&quot;);<\/code><\/pre>\n<p><code>else<\/code> 贴近内层 <code>if (b &gt; 0)<\/code>，按规则配内层；缩进若让人以为配外层，是阅读错觉。改成块：<\/p>\n<pre class=\"lang-c\"><code>if (a &gt; 0)\n{\n    if (b &gt; 0)\n        printf(&quot;both\\n&quot;);\n}\nelse\n    printf(&quot;a&lt;=0\\n&quot;);<\/code><\/pre>\n<p>花括号限定内层 <code>if<\/code> 范围，<code>else<\/code> 才挂到外层。<\/p>\n<p><strong>短路推演<\/strong>。<code>&amp;&amp;<\/code>：左侧假 → 整体假，右侧省略；左侧真 → 才算右侧。<code>||<\/code>：左侧真 → 整体真，右侧省略；左侧假 → 才算右侧。短路不仅是优化，也是语言保证的求值次序；右侧含赋值、自增、函数调用时，是否执行取决于左侧。<\/p>\n<p><strong>匹配与贯穿推演<\/strong>。<code>switch<\/code> 表达式先求值一次；依次比对标签常量，命中则入口定在该标签；之后顺序执行后续语句，不回头比对下一个标签。<code>break<\/code> 跳到结构末尾；无 <code>break<\/code> 则贯穿到下一条 <code>case<\/code> 或 <code>default<\/code> 语句。多个标签共用同一段处理是合法用法：相邻 <code>case<\/code> 不写 <code>break<\/code>，共享其后代码。<\/p>\n<p><strong>条件结果类型<\/strong>。关系与逻辑表达式结果为 <code>int<\/code> 0 或 1；可直接作为分支条件，也可参与算术运算。<\/p>\n<p><strong>分支与循环的配合<\/strong>。循环体内常用分支筛选元素：满足条件处理，不满足 <code>continue<\/code> 跳过；<code>switch<\/code> 常用于菜单选择与状态码分流。分支本身不重复动作，重复框架由循环提供，两者嵌套时规则各自独立适用。<\/p>\n<p><strong>条件书写的核对顺序<\/strong>。先写条件表达式并核对 <code>==<\/code> 与 <code>=<\/code>，再按配对规则确认 <code>else<\/code> 归属，复合条件先排保护判断，末尾沿标签走一遍 <code>switch<\/code> 语句。顺序反过来容易把缩进错觉当成配对结论。<\/p>\n<p><strong>分支选择依据<\/strong>。区间判断与复合条件用 <code>if else<\/code> 链；等值多分支用 <code>switch<\/code>；需要保护危险操作时把判断放 <code>&amp;&amp;<\/code> 左侧。读完一段分支，应能按输入类别列出每条路径落点。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：互斥路径用 <code>if else<\/code>；等值多分支用 <code>switch<\/code>；需要短路保护（如防除零、防空指针）用 <code>&amp;&amp;<\/code> 左侧先判。\n<\/li><li>\n边界一：<code>switch<\/code> 标签只能是整型常量；浮点、字符串不能做 <code>switch<\/code> 标签。\n<\/li><li>\n边界二：<code>case<\/code> 之间不写 <code>break<\/code> 即贯穿；有意贯穿时应加注释说明，避免误漏。\n<\/li><li>\n失败案例：把 <code>&amp;&amp;<\/code> 两侧顺序写反，先访问后判空，短路保护失效。\n<\/li><li>\n边界三：<code>continue<\/code> 只作用于最近循环，不影响 <code>switch<\/code>；<code>break<\/code> 在 <code>switch<\/code> 内跳出分支，在循环内跳出循环，嵌套时注意落点。\n<\/li><li>\n边界四：条件中赋值 <code>=<\/code> 与相等判断 <code>==<\/code> 写法相近；条件写成赋值会按赋值结果判真假，需要核对符号。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong><code>if else<\/code> vs <code>switch<\/code><\/strong>：前者适用范围判断与复杂条件，后者适用整型等值多分支；<code>switch<\/code> 不能表达区间比较。\n<\/li><li>\n<strong>短路 vs 普通二元运算<\/strong>：算术运算符两侧次序未指定，逻辑运算符有明确短路次序；右侧副作用不能假定一定发生。\n<\/li><li>\n<strong><code>break<\/code> vs <code>continue<\/code><\/strong>：<code>break<\/code> 退出整个结构，<code>continue<\/code> 只跳过本次余下循环体；二者在 <code>switch<\/code> 与循环中含义不同。\n<\/li><li>\n<strong>标签匹配 vs 逐个重新判断<\/strong>：<code>switch<\/code> 命中后不再比对后续标签，只顺序贯穿；与一连串 <code>if else<\/code> 的逐条判断不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c05 的表达式分组与真值规则给出条件取值；c06 的循环提供分支所处的重复框架。后继：c08 函数内用分支做参数校验与返回分流；第 8 章输入验证靠分支拒绝非法值；第 13 章文件处理按返回状态分支。本章短路规则与 c05 的求值次序保证部分直接衔接。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（分支跳转、逻辑短路与 switch 匹配规则）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：分支配对依赖链、短路求值推演与 switch 贯穿复盘<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把分支写对，往回追四层：<\/p>\n<ol><li>\n条件层：条件表达式求值为 0 或非 0，决定走哪条路；取值规则来自 c05 表达式分组。\n<\/li><li>\n配对层：多分支嵌套时，<code>else<\/code> 按语法层次找最近未配对 <code>if<\/code>；缩进不参与配对。\n<\/li><li>\n短路层：<code>&amp;&amp;<\/code>、<code>||<\/code> 左侧结果已定时右侧省略；右侧副作用是否执行受左侧约束。\n<\/li><li>\n标签层：<code>switch<\/code> 表达式求值一次，命中标签后顺序贯穿，<code>break<\/code> 决定离开位置。\n<\/ol>\n<p>依赖链方向：条件取值 → 分支配对 → 复合条件短路 → 标签匹配贯穿。抽掉配对层，嵌套分支归属错乱；抽掉短路层，会假定右侧必定执行；抽掉标签层，<code>switch<\/code> 贯穿路径无法预测。<\/p>\n<p>再追一层为什么需要配对规则：<code>if<\/code> 可以嵌套，语言必须规定 <code>else<\/code> 的归属，否则同一缩进文本有多种解释。规则选&quot;最近未配对 <code>if<\/code>&quot;，与花括号块的作用域一致；短路次序写入标准，是为了让&quot;先判空再访问&quot;这类保护写法成立；标签贯穿规则则把等值跳转统一成顺序执行模型。<\/p>\n<h2>正向推导：三条规则的成立依据<\/h2>\n<p><strong>配对规则<\/strong>。语法树上，<code>if<\/code> 节点可带一个 <code>else<\/code> 子节点；解析 <code>else<\/code> 时向上找最近的还没有 <code>else<\/code> 的 <code>if<\/code> 节点。缩进是文本外观，不进语法树，因此不改变配对。要改变归属，必须用块节点把内层 <code>if<\/code> 包住，使外层 <code>if<\/code> 成为可配对的最近节点。<\/p>\n<p><strong>短路规则<\/strong>。<code>A &amp;&amp; B<\/code>：若 <code>A<\/code> 为假，合取已假，不论 <code>B<\/code> 为何值结果都是假，<code>B<\/code> 无需计算；若 <code>A<\/code> 为真，结果取决于 <code>B<\/code>，才计算 <code>B<\/code>。<code>A || B<\/code>：若 <code>A<\/code> 为真，析取已真，<code>B<\/code> 省略；若 <code>A<\/code> 为假，才计算 <code>B<\/code>。这一顺序是标准保证的，不同于普通算术运算符的未指定次序。<\/p>\n<p><strong>贯穿规则<\/strong>。<code>switch (E)<\/code> 先求 <span class=\"katex-inline\">E<\/span> 一次；扫描 <code>case<\/code> 常量找相等标签；找到后入口落在该标签，其后语句顺序执行，后续 <code>case<\/code> 只做标记，不再参与比较。遇到 <code>break<\/code> 离开结构；无 <code>break<\/code> 继续走到下一条语句。<code>default<\/code> 在无任何标签匹配时进入，位置不影响匹配顺序。<\/p>\n<p><strong>条件真假<\/strong>。条件接受任意表达式：0 为假，非 0 为真；关系与逻辑运算结果严格为 0 或 1。复合条件由内层关系向外层逻辑合并。<\/p>\n<h2>算例一：if-else 配对归属推演<\/h2>\n<p>代码片段：<\/p>\n<pre class=\"lang-c\"><code>if (a &gt; 0)\n    if (b &gt; 0)\n        printf(&quot;both\\n&quot;);\nelse\n    printf(&quot;branch\\n&quot;);<\/code><\/pre>\n<ol><li>\n解析外层 <code>if (a &gt; 0)<\/code>，其下嵌套内层 <code>if (b &gt; 0)<\/code>。\n<\/li><li>\n<code>else<\/code> 向上找最近未配对 <code>if<\/code>：内层 <code>if (b &gt; 0)<\/code> 尚未配对，于是 <code>else<\/code> 归内层。\n<\/li><li>\n语义：<code>a&gt;0 且 b&gt;0<\/code> 输出 <code>both<\/code>；<code>a&gt;0 且 b&lt;=0<\/code> 输出 <code>branch<\/code>；<code>a&lt;=0<\/code> 时整条嵌套跳过。\n<\/li><li>\n若期望 <code>else<\/code> 对应 <code>a&lt;=0<\/code>，必须写块：\n<\/ol>\n<pre class=\"lang-c\"><code>if (a &gt; 0)\n{\n    if (b &gt; 0)\n        printf(&quot;both\\n&quot;);\n}\nelse\n    printf(&quot;branch\\n&quot;);<\/code><\/pre>\n<p>块把内层 <code>if<\/code> 封闭，<code>else<\/code> 向上配对外层 <code>if<\/code>。核对两种写法的语义表：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>a<\/th><th>b<\/th><th>无块输出<\/th><th>有块输出<\/th><\/tr><\/thead><tbody><tr><td>&gt;0<\/td><td>&gt;0<\/td><td>both<\/td><td>both<\/td><\/tr><tr><td>&gt;0<\/td><td>≤0<\/td><td>branch<\/td><td>跳过内层<\/td><\/tr><tr><td>≤0<\/td><td>任意<\/td><td>跳过<\/td><td>branch<\/td><\/tr><\/tbody><\/table><\/div>\n<p>差别只在 <code>a&lt;=0<\/code> 一行，正是配对归属改变的位置。<\/p>\n<h2>算例二：短路求值与副作用推演<\/h2>\n<p><strong>场景 A：防除零<\/strong>。<\/p>\n<pre class=\"lang-c\"><code>if (b != 0 &amp;&amp; a / b &gt; 1)\n    printf(&quot;ok\\n&quot;);<\/code><\/pre>\n<ol><li>\n先算 <code>b != 0<\/code>。若 <code>b==0<\/code>，左侧假，<code>&amp;&amp;<\/code> 短路，右侧 <code>a/b<\/code> 不计算，除零被避开。\n<\/li><li>\n左侧真才算 <code>a/b &gt; 1<\/code>。\n<\/li><li>\n若把顺序写成 <code>if (a / b &gt; 1 &amp;&amp; b != 0)<\/code>，先算除法，<code>b==0<\/code> 时已触发除零，短路保护失效。\n<\/ol>\n<p><strong>场景 B：或运算短路<\/strong>。<\/p>\n<pre class=\"lang-c\"><code>if (x &lt; 0 || x &gt; 100)\n    printf(&quot;out\\n&quot;);<\/code><\/pre>\n<ol><li>\n<code>x&lt;0<\/code> 为真，整体真，右侧 <code>x&gt;100<\/code> 省略。\n<\/li><li>\n<code>x&lt;0<\/code> 为假，才算 <code>x&gt;100<\/code>。\n<\/li><li>\n两个条件互斥区间，短路不改变结果，只省略右侧计算。\n<\/ol>\n<p><strong>场景 C：右侧含自增<\/strong>。<\/p>\n<pre class=\"lang-c\"><code>if (flag &amp;&amp; (y = x++))\n    ...<\/code><\/pre>\n<ol><li>\n<code>flag<\/code> 为假时，<code>x++<\/code> 不执行，<code>x<\/code> 不自增。\n<\/li><li>\n<code>flag<\/code> 为真时才进入右侧，<code>y<\/code> 取 <code>x<\/code> 旧值，<code>x<\/code> 增 1。\n<\/li><li>\n若代码假定 <code>x++<\/code> 总会执行，<code>flag<\/code> 为假时计数就少一步；副作用必须挂在确定会执行的路径上。\n<\/ol>\n<h2>算例三：switch 贯穿与共用标签推演<\/h2>\n<p>语句：<\/p>\n<pre class=\"lang-c\"><code>switch (grade)\n{\n    case &#x27;A&#x27;:\n        printf(&quot;A\\n&quot;);\n        break;\n    case &#x27;B&#x27;:\n    case &#x27;C&#x27;:\n        printf(&quot;B or C\\n&quot;);\n        break;\n    default:\n        printf(&quot;other\\n&quot;);\n        break;\n}<\/code><\/pre>\n<ol><li>\n<code>grade=&#x27;A&#x27;<\/code>：命中 <code>case &#x27;A&#x27;<\/code>，输出 <code>A<\/code>，遇 <code>break<\/code> 离开。\n<\/li><li>\n<code>grade=&#x27;B&#x27;<\/code>：<code>case &#x27;B&#x27;<\/code> 后无语句，也无 <code>break<\/code>，贯穿到 <code>case &#x27;C&#x27;<\/code> 后的语句，输出 <code>B or C<\/code>，再离开。\n<\/li><li>\n<code>grade=&#x27;C&#x27;<\/code>：直接进入 <code>case &#x27;C&#x27;<\/code>，同一处理。\n<\/li><li>\n<code>grade=&#x27;X&#x27;<\/code>：无标签匹配，进入 <code>default<\/code>，输出 <code>other<\/code>。\n<\/li><li>\n共用标签是有意贯穿：<code>B<\/code> 与 <code>C<\/code> 共享同一段代码；漏写 <code>break<\/code> 导致的非有意贯穿，会把后续标签语句也执行一遍。\n<\/ol>\n<p>再看一个漏 <code>break<\/code> 的反例：<\/p>\n<pre class=\"lang-c\"><code>switch (k)\n{\n    case 1: printf(&quot;one\\n&quot;);\n    case 2: printf(&quot;two\\n&quot;); break;\n    default: printf(&quot;other\\n&quot;);\n}<\/code><\/pre>\n<p><code>k=1<\/code>：输出 <code>one<\/code> 后贯穿，再输出 <code>two<\/code>，才遇 <code>break<\/code>。预期只处理 1，实际串入 2 的语句；核对路径时从命中标签向下逐行走，不靠标签名猜。<\/p>\n<h2>反事实推演：改掉规则会怎样<\/h2>\n<p><strong>取消最近配对规则<\/strong>。若 <code>else<\/code> 总挂最外层 <code>if<\/code>，深层嵌套无法表达内层互斥路径；规则必须固定归属，多分支解析才有唯一解释。<\/p>\n<p><strong>取消短路，两侧总计算<\/strong>。防除零、防空指针的写法失去依据：左侧判断来不及保护右侧；右侧副作用也无法按条件省略。标准保留短路，正是为这类保护提供次序保证。<\/p>\n<p><strong>取消贯穿，每个 case 自动跳出<\/strong>。共用标签需要重复写同一段处理；贯穿机制允许相邻标签共享代码，但代价是漏写 <code>break<\/code> 会误串。两种取舍对应不同语言设计，C 选择贯穿加显式 <code>break<\/code>。<\/p>\n<h2>复合条件真值表推演<\/h2>\n<p>两个条件 <span class=\"katex-inline\">A<\/span>、<span class=\"katex-inline\">B<\/span> 组合出四种取值，核对短路与结果：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>A<\/th><th>B<\/th><th>A &amp;&amp; B<\/th><th>A<\/th><th><\/th><th>B<\/th><\/tr><\/thead><tbody><tr><td>假<\/td><td>假<\/td><td>假（右侧不计算当 A 假）<\/td><td>假（右侧才计算）<\/td><\/tr><tr><td>假<\/td><td>真<\/td><td>假（右侧不计算）<\/td><td>真<\/td><\/tr><tr><td>真<\/td><td>假<\/td><td>假（右侧才计算）<\/td><td>真（右侧不计算）<\/td><\/tr><tr><td>真<\/td><td>真<\/td><td>真<\/td><td>真（右侧不计算）<\/td><\/tr><\/tbody><\/table><\/div>\n<p>读表要点：<code>&amp;&amp;<\/code> 只有两侧都真才真，左侧假即停；<code>||<\/code> 只要一侧真即真，左侧真即停。右侧含副作用时，表中标注&quot;不计算&quot;的行里副作用不发生。<\/p>\n<p>把表落到防错写法：判断指针或除零对象是否合法，保护条件放 <code>&amp;&amp;<\/code> 左侧；危险操作放右侧，只有保护通过才执行。顺序对调后，保护条件来不及生效，危险操作先触发。<\/p>\n<p>再看嵌套条件与 <code>if else<\/code> 链。一段成绩分流：<\/p>\n<pre class=\"lang-c\"><code>if (score &gt;= 90)      grade = &#x27;A&#x27;;\nelse if (score &gt;= 80) grade = &#x27;B&#x27;;\nelse if (score &gt;= 70) grade = &#x27;C&#x27;;\nelse                  grade = &#x27;D&#x27;;<\/code><\/pre>\n<ol><li>\n从上向下逐条判断，命中一条即进入对应分支，其余跳过。\n<\/li><li>\n写成链而不是并列 <code>if<\/code>，是因为区间互斥；并列 <code>if<\/code> 会在多条条件都满足时重复赋值。\n<\/li><li>\n与 <code>switch<\/code> 差别：链处理区间比较，<code>switch<\/code> 处理等值匹配。\n<\/ol>\n<h2>状态分流与跳转落点算例<\/h2>\n<p><strong>菜单选择<\/strong>：<\/p>\n<pre class=\"lang-c\"><code>switch (choice)\n{\n    case 1: load(); break;\n    case 2: save(); break;\n    case 3: help(); break;\n    default: bad(); break;\n}<\/code><\/pre>\n<ol><li>\n<code>choice=1<\/code>：进 <code>case 1<\/code>，调 <code>load<\/code>，<code>break<\/code> 离开。\n<\/li><li>\n<code>choice=2<\/code>：进 <code>case 2<\/code>，调 <code>save<\/code>，离开。\n<\/li><li>\n<code>choice=9<\/code>：无匹配，进 <code>default<\/code>。\n<\/li><li>\n每个标签后都有 <code>break<\/code>，路径不贯穿；若 <code>case 1<\/code> 漏 <code>break<\/code>，会接着执行 <code>save<\/code>。\n<\/ol>\n<p><strong>循环内分支<\/strong>：<\/p>\n<pre class=\"lang-c\"><code>for (i = 0; i &lt; n; i++)\n{\n    if (a[i] &lt; 0)\n        continue;\n    total += a[i];\n}<\/code><\/pre>\n<ol><li>\n负数元素跳过，不累加；<code>continue<\/code> 回到循环条件，进入下一轮。\n<\/li><li>\n<code>break<\/code> 在这里会直接结束整个循环，与 <code>continue<\/code> 的跳过本次不同。\n<\/li><li>\n分支作用于单个元素，循环框架不变。\n<\/ol>\n<p><strong><code>goto<\/code> 的位置<\/strong>。<code>goto<\/code> 跳到同一函数内标号处，可用于多层嵌套内一次性跳出；常规流程优先用 <code>break<\/code>、<code>continue<\/code> 与函数拆分，<code>goto<\/code> 只在集中清理错误出口等有限场景使用。<\/p>\n<h2>分支路径覆盖核对方法<\/h2>\n<p>读一段分支代码，按输入类别列路径表，逐条核对落点：<\/p>\n<ol><li>\n列出所有条件表达式及其真假组合。\n<\/li><li>\n对每种组合，沿配对规则找到归属分支。\n<\/li><li>\n复合条件先标短路位置，确认右侧是否执行。\n<\/li><li>\n<code>switch<\/code> 从命中标签向下走语句，标出每个 <code>break<\/code> 离开点。\n<\/li><li>\n检查有无路径漏掉：无匹配时是否进 <code>default<\/code>，<code>if<\/code> 链末尾是否有兜底分支。\n<\/ol>\n<p><strong>算例：奇偶数分流<\/strong>。<\/p>\n<pre class=\"lang-c\"><code>if (n % 2 == 0)\n    even++;\nelse\n    odd++;<\/code><\/pre>\n<ol><li>\n<code>n%2==0<\/code> 为真走 <code>even<\/code>，为假走 <code>odd<\/code>；两路径互斥，覆盖全部整数。\n<\/li><li>\n取 <code>n=4<\/code>：<code>4%2=0<\/code>，<code>even<\/code> 加 1；取 <code>n=7<\/code>：<code>7%2=1<\/code>，条件假，<code>odd<\/code> 加 1。\n<\/li><li>\n若写成两个并列 <code>if<\/code>，两个条件都判断一遍，虽然本例结果相同，但在多条件叠加时会重复赋值。\n<\/ol>\n<p><strong>算例：空指针保护顺序<\/strong>。<\/p>\n<pre class=\"lang-c\"><code>if (p != NULL &amp;&amp; p-&gt;score &gt; 60)\n    count++;<\/code><\/pre>\n<ol><li>\n左侧先判 <code>p<\/code> 是否为空；为空则短路，右侧 <code>p-&gt;score<\/code> 不访问。\n<\/li><li>\n非空才解引用比较分数。\n<\/li><li>\n顺序反过来：<code>p-&gt;score &gt; 60<\/code> 先执行，<code>p<\/code> 为空时已触发非法访问，后续判空来不及保护。\n<\/li><li>\n这类条件的核对要点是危险操作必须位于保护判断之后。\n<\/ol>\n<p><strong>常见误读纠正<\/strong>。缩进把内层 <code>if<\/code> 画得靠外，容易让人误判 <code>else<\/code> 归属；纠正动作是忽略缩进，按语法树找最近未配对 <code>if<\/code>。<code>switch<\/code> 标签名像独立分支，实际命中后顺序贯穿；纠正动作是从入口向下逐行走，而不是按标签名猜下一条语句。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>按缩进判配对<\/strong>。把内层 <code>if<\/code> 的 <code>else<\/code> 读成外层分支；复盘：画语法树找最近未配对 <code>if<\/code>，要改归属就加花括号。<\/p>\n<p><strong>短路顺序写反<\/strong>。先访问后判空/除零，保护条件落空；复盘：危险操作放右侧，保护判断放左侧 <code>&amp;&amp;<\/code>。<\/p>\n<p><strong>漏写 break 贯穿<\/strong>。菜单或状态分支串入后续处理；复盘：从命中标签向下逐行走一遍，确认每个出口都有 <code>break<\/code>；有意贯穿加注释标明。<\/p>\n<p><strong><code>switch<\/code> 标签用浮点或变量<\/strong>。标签要求整型常量，编译不通过；区间判断应改用 <code>if else<\/code> 链。<\/p>\n<p><strong>赋值与相等混淆<\/strong>。条件里写 <code>if (x = 5)<\/code>，每次都把 5 赋给 <code>x<\/code> 并按非 0 判真；复盘：条件判断核对 <code>==<\/code>，避免把赋值符号写进判断。<\/p>\n<h2>再推一层：分支与循环、函数的衔接<\/h2>\n<p>循环体内用分支筛选元素：满足条件处理，不满足 <code>continue<\/code> 跳过；分支嵌套在循环骨架内，配对与短路规则单独适用。函数入口用分支校验参数：非法参数走错误返回，合法参数继续主体；c08 的返回值分流就建立在本章规则上。<\/p>\n<p>读已有分支代码时三步核对：先数 <code>if<\/code> 与 <code>else<\/code> 个数，按最近配对画归属；再看复合条件左右侧各有什么副作用，判断短路会不会省略；末尾沿 <code>switch<\/code> 标签向下走语句，标出每个 <code>break<\/code> 落点。三步走完，执行路径可以逐条件列出。原书第 7 章 §7.1–7.2 讲 <code>if<\/code> 与 <code>if else<\/code>，§7.3 讲逻辑运算符，§7.7 讲 <code>switch<\/code>；示例阅读应先列真值表，再核对每条路径。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n<code>else<\/code> 按什么规则找 <code>if<\/code>？缩进能不能改变配对？\n<\/li><li>\n<code>&amp;&amp;<\/code> 与 <code>||<\/code> 各在什么条件下短路？右侧副作用何时不执行？\n<\/li><li>\n<code>switch<\/code> 命中标签后还会不会再比对下一个标签？\n<\/li><li>\n<code>break<\/code> 与 <code>continue<\/code> 在循环和 <code>switch<\/code> 中各起什么作用？\n<\/li><li>\n哪些类型可以做 <code>switch<\/code> 标签？字符串为什么不行？\n<\/li><li>\n防除零的条件为什么要把判断放在 <code>&amp;&amp;<\/code> 左侧？\n<\/ol>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n画出无块与有块两种写法在 <code>a&gt;0,b&gt;0<\/code>、<code>a&gt;0,b≤0<\/code>、<code>a≤0<\/code> 三种输入下的输出表。\n<\/li><li>\n<code>if (p != NULL &amp;&amp; p-&gt;v &gt; 0)<\/code> 中两个条件的次序能否交换？为什么？\n<\/li><li>\n<code>switch<\/code> 中 <code>case &#x27;B&#x27;: case &#x27;C&#x27;:<\/code> 共用处理依赖什么规则？写成两个独立分支要怎么改？\n<\/li><li>\n一段 <code>switch<\/code> 漏写 <code>break<\/code>，从命中标签到结构结束会走过哪些语句？怎样逐行走查？\n<\/li><li>\n<code>continue<\/code> 与 <code>break<\/code> 在嵌套循环中分别作用于哪一层？\n<\/ol><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.562<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">编译链接模型与最小 C 程序结构<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">运算符优先级、求值顺序与类型转换<\/a><\/span><\/div><h1>函数原型、栈帧结构与递归执行<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（原书第 9 章 §9.1、§9.2、§9.3，PDF 第 562 页起）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>函数把一段动作封装成可复用单元；原型在调用前声明返回类型与形参类型，供编译器检查参数匹配；每次调用在栈上分配一帧，存放形参、返回地址与局部变量，返回时回收；递归是函数直接或间接调用自己，每层独立成帧，触达基准条件后逐层返回。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>程序规模变大后，重复动作堆在 <code>main<\/code> 里难以维护。函数提供封装：输入参数、内部处理、返回结果形成黑盒。困难在于理解调用时数据怎样传递、返回地址记在哪里、局部变量为何互不干扰；递归则要同时看清深入与退回两个方向。不掌握栈帧，容易混淆按值传递与按址传递，误以为被调函数能改回写实参；不掌握递归层次，会把展开顺序与返回顺序当成一回事。本章把调用链、帧布局与递归推演讲清，是多文件程序设计与后续数据结构操作的基础。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>函数定义<\/strong>：返回类型、函数名、形参列表与函数体；形参是被调帧内的局部变量。<\/p>\n<p><strong>函数原型<\/strong>：调用之前声明函数名、返回类型与各形参类型；编译器据此核对实参个数、类型与返回值使用。原型以分号结束，通常放头文件。<\/p>\n<p><strong>按值传递<\/strong>：调用时实参值复制给形参；被调函数修改形参不影响主调函数原变量。需要改回写时，传指针地址（见 c09）。<\/p>\n<p><strong><code>return<\/code><\/strong>：把结果交回主调函数，并结束本次函数执行；返回类型与函数声明一致。无返回值用 <code>void<\/code>。<\/p>\n<p><strong>栈帧<\/strong>：一次调用在栈上分配的一块区域，通常包含：形参、保存的返回地址、局部变量、帧指针信息。调用时建帧，返回时回收；帧内变量只在本次调用期间可访问。<\/p>\n<p><strong>递归<\/strong>：函数调用自身。基准条件（base case）直接返回不再深入；递归步把问题缩小一层再调用自己。每层调用独立成帧，参数与局部变量互不覆盖。<\/p>\n<p><strong>尾递归<\/strong>：递归调用是函数末尾一个动作，返回前不再做额外运算；部分实现可优化这类帧占用。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-c\"><code>int square(int x)\n{\n    int result;\n    result = x * x;\n    return result;\n}\n\nint main(void)\n{\n    int a = 6, b = square(a);\n    return 0;\n}<\/code><\/pre>\n<p><strong>反例<\/strong>：调用前无原型，参数个数类型不被检查；在被调函数里改形参却期待主调变量改变；递归缺基准条件，深入到栈耗尽。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>调用序列推演<\/strong>。<\/p>\n<ol><li>\n主调函数求实参值，压入调用位置所需信息；保存返回地址（调用语句的下一条位置）。\n<\/li><li>\n转入被调函数入口，建立被调帧：形参占据帧内位置，实参值复制进来。\n<\/li><li>\n执行函数体：局部变量在帧内分配，<code>return<\/code> 把结果放到返回值位置。\n<\/li><li>\n回收被调帧，按返回地址回到主调函数，继续后续语句。\n<\/ol>\n<p><strong>按值传递依据<\/strong>：形参是新副本，地址与实参不同；改形参只动副本。要让被调函数访问主调变量，必须传该变量地址，函数内通过指针间接写回。<\/p>\n<p><strong>递归推演两方向<\/strong>。展开方向：从顶层调用逐层深入，每层建新帧，参数按递归步缩小；到达基准条件后进入退回方向：每层把结果返回上一层，帧依次回收。两个方向次序相反：深入时参数递减，退回时结果逐层合并。<\/p>\n<p><strong>原型检查依据<\/strong>。原型在编译期提供接口契约：实参个数不符、类型不匹配、返回值误用都能在编译期暴露；缺原型时编译器按隐式规则猜测，错误推迟到运行期。<\/p>\n<p><strong>函数定义的组成<\/strong>。返回类型在前，函数名紧随，形参列表在括号内，函数体在花括号内。形参列表可以为空（<code>void<\/code> 表示不接收参数）；函数声明以分号结束，定义不写分号。函数名在程序内唯一对应一个定义，多处声明指向同一实现。<\/p>\n<p><strong>多文件组织<\/strong>。原型与类型声明放头文件，各源文件 <code>#include<\/code> 同一头文件；函数实现放对应的源文件。编译按文件独立进行，链接阶段把各目标文件合并。头文件保证各文件对接口的理解一致，避免调用方与实现方各写一套参数约定。<\/p>\n<p><strong>递归的适用边界<\/strong>。问题能拆成同类子问题、规模逐层缩小、存在直接可解的基准情形，才适合递归。子问题相互独立、合并动作明确时，递归结构清晰；规模过大或合并动作复杂时，迭代可能更省栈空间。<\/p>\n<p><strong>栈空间约束<\/strong>。每深入一层占用一帧；递归层数过大可能耗尽栈空间。深度优先的递归要估算最大层数，必要时改写为迭代。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：重复动作封装、参数化处理、递归适合可分解为同类子问题的场景。\n<\/li><li>\n边界一：原型必须在调用前可见；先调用后定义且无原型，参数检查失效。\n<\/li><li>\n边界二：形参改动不回写实参；需要回写就传地址，函数内解引用。\n<\/li><li>\n失败案例：递归缺基准条件或递归步不缩小问题，调用不终止，栈帧持续堆积直到栈溢出。\n<\/li><li>\n边界三：多文件程序中，函数原型放头文件，定义放实现文件；各文件包含同一头文件保证接口一致。\n<\/li><li>\n边界四：<code>void<\/code> 函数不能带值返回；非 <code>void<\/code> 函数所有执行路径都必须有 <code>return<\/code>。\n<\/ul>\n<p><strong>函数的黑盒视角<\/strong>。主调函数只看接口：传什么参数、返回什么结果，不关心内部实现；被调函数只通过形参接收输入，通过返回值交出结果。黑盒边界使函数可以独立修改内部实现，只要接口不变，调用方不受影响。<\/p>\n<p><strong>局部变量的可见范围<\/strong>。形参与函数体内声明的局部变量只在本帧有效；函数返回后帧回收，这些变量不可再访问。同名局部变量遮蔽全局同名变量，函数内访问的是局部副本；要访问全局对象需用专门区分方式。<\/p>\n<p><strong>函数设计的核对要点<\/strong>。接口参数个数与类型在原型写清；函数体内只处理分配给它的职责；返回路径覆盖所有分支；重复动作封装成函数后，主调处不再复制相同代码。原型、定义、调用三处的类型必须一致，多文件时由头文件统一这份约定。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>定义 vs 原型<\/strong>：定义包含函数体与实现；原型只声明接口类型。一个定义对应多处原型声明。\n<\/li><li>\n<strong>按值 vs 按址<\/strong>：按值传副本，形参独立；按址传地址，函数可经指针改原变量。\n<\/li><li>\n<strong>递归展开 vs 递归返回<\/strong>：展开是自顶向下建帧，返回是自底向上回收；两者方向相反，不能混为一层。\n<\/li><li>\n<strong>局部变量 vs 全局变量<\/strong>：局部变量在帧内，调用结束回收；全局变量在静态区，全程存在。同名局部变量遮蔽全局同名变量。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的编译链接模型解释多文件与原型位置；c05 的类型提升规则用于实参传递。后继：c09 指针参数把按址传递落地；第 12 章存储类别在栈、静态区、堆之间区分生命周期；第 11 章字符串函数与第 13 章文件函数都按本章接口契约组织。本章帧布局是理解一切函数调用行为的底层模型。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（函数原型、栈帧结构与递归执行）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：调用栈依赖链、栈帧推演与递归展开复盘<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把函数调用与递归讲清，往回追四层：<\/p>\n<ol><li>\n接口层：原型声明函数名、返回类型与形参类型；编译期按原型核对实参个数与类型。\n<\/li><li>\n传递层：调用时实参值复制给形参；按值传递下形参是独立副本。\n<\/li><li>\n帧层：每次调用在栈上建帧，存形参、返回地址、局部变量；返回时回收。\n<\/li><li>\n递归层：自调用每层独立成帧，基准条件终止深入，结果沿调用链逐层返回。\n<\/ol>\n<p>依赖链方向：原型定契约 → 实参复制进形参 → 建帧保存上下文 → 递归逐层深入再退回。抽掉帧层，返回地址与局部变量没有存放位置；抽掉基准条件，递归不终止。<\/p>\n<p>再追一层为什么用栈组织帧：函数调用是后进先出次序——最晚进入的调用最先返回，栈的压入弹出正好匹配；帧随调用建立、随返回销毁，局部变量生命周期与调用期一致。这一结构决定了递归层数受栈大小约束，也决定了形参改动不回写实参。<\/p>\n<h2>正向推导：调用序列与帧内容<\/h2>\n<p><strong>调用四步<\/strong>。<\/p>\n<ol><li>\n主调求实参：各实参按类型求值，准备传递。\n<\/li><li>\n保存上下文：记录返回地址（调用语句下一条指令位置），转入被调入口。\n<\/li><li>\n建被调帧：形参在帧内分配并写入实参副本；函数体执行时局部变量在帧内留出空间。\n<\/li><li>\n返回回收：<code>return<\/code> 把结果放入返回值位置，回收本帧，按返回地址回到主调。\n<\/ol>\n<p><strong>帧内布局的一般顺序<\/strong>（具体顺序由平台决定，概念上分层）：形参区、返回地址保存区、局部变量区、帧指针链。不依赖具体平台的结论是：形参与局部变量都属于本次调用帧，调用结束后不可再访问；各次调用的帧互不覆盖。<\/p>\n<p><strong>按值传递推导<\/strong>。实参表达式求值后复制到形参存储；形参与实参地址不同。被调函数对形参赋值，改动的是副本；主调侧原变量保持原值。要在被调侧改原变量，必须传原变量地址，函数内用指针解引用写回，这是 c09 的内容。<\/p>\n<p><strong>递归两方向<\/strong>。<\/p>\n<ol><li>\n展开：顶层调用进入，建新帧，参数按递归步缩小；未达基准条件前继续深入。\n<\/li><li>\n基准：参数达到基准条件，直接返回确定值。\n<\/li><li>\n退回：每层拿到下层结果，按递归步合并，返回上一层；帧依次回收。\n<\/ol>\n<p>深入时参数递减，退回时结果合并；两个方向沿同一调用链反向行走。<\/p>\n<h2>算例一：一次普通调用的帧推演<\/h2>\n<p>定义与调用：<\/p>\n<pre class=\"lang-c\"><code>int square(int x)\n{\n    int result;\n    result = x * x;\n    return result;\n}\n\nint main(void)\n{\n    int a = 6;\n    int b = square(a);\n    return 0;\n}<\/code><\/pre>\n<p>逐帧推演：<\/p>\n<ol><li>\n<code>main<\/code> 帧：局部 <code>a<\/code> 存入 6。\n<\/li><li>\n调用 <code>square(a)<\/code>：实参 6 复制给形参 <code>x<\/code>；保存返回地址；建 <code>square<\/code> 帧。\n<\/li><li>\n<code>square<\/code> 帧：<code>x=6<\/code>，局部 <code>result<\/code> 未初始化；执行 <code>result = x * x<\/code>，<code>result=36<\/code>。\n<\/li><li>\n<code>return result<\/code>：返回值 36 交出；<code>square<\/code> 帧回收。\n<\/li><li>\n回到 <code>main<\/code>，返回值赋给 <code>b<\/code>，<code>b=36<\/code>；<code>main<\/code> 随后返回 0。\n<\/ol>\n<p>核对要点：形参 <code>x<\/code> 是 <code>square<\/code> 帧内副本，与 <code>main<\/code> 中 <code>a<\/code> 地址不同；即使在 <code>square<\/code> 内改 <code>x<\/code>，<code>a<\/code> 不变。返回地址保证 <code>square<\/code> 结束后回到 <code>main<\/code> 中调用语句之后；局部 <code>result<\/code> 在帧回收后不可访问。<\/p>\n<p>再看两个形参的函数：<\/p>\n<pre class=\"lang-c\"><code>int add(int p, int q) { return p + q; }<\/code><\/pre>\n<p>调用 <code>add(3, 4)<\/code>：<code>p=3<\/code>、<code>q=4<\/code> 进入各自形参位置；返回 7。原型 <code>int add(int, int);<\/code> 在编译期核对调用是否传两个整数；缺一个实参时编译期即可发现。<\/p>\n<h2>算例二：阶乘递归的展开与退回<\/h2>\n<p>阶乘定义：<span class=\"katex-inline\">n! = n \\times (n-1)!<\/span>，基准 <span class=\"katex-inline\">0! = 1<\/span>、<span class=\"katex-inline\">1! = 1<\/span>。<\/p>\n<pre class=\"lang-c\"><code>long fact(int n)\n{\n    if (n &lt;= 1)\n        return 1;\n    return n * fact(n - 1);\n}<\/code><\/pre>\n<p>调用 <code>fact(3)<\/code>：<\/p>\n<p><strong>展开方向<\/strong>：<\/p>\n<ol><li>\n<code>fact(3)<\/code>：未达基准，调 <code>fact(2)<\/code>，建帧。\n<\/li><li>\n<code>fact(2)<\/code>：未达基准，调 <code>fact(1)<\/code>，建帧。\n<\/li><li>\n<code>fact(1)<\/code>：命中基准，返回 1。\n<\/ol>\n<p><strong>退回方向<\/strong>：<\/p>\n<ol><li>\n回到 <code>fact(2)<\/code>：拿到 <code>fact(1)=1<\/code>，算 <code>2 * 1 = 2<\/code>，返回 2。\n<\/li><li>\n回到 <code>fact(3)<\/code>：拿到 <code>fact(2)=2<\/code>，算 <code>3 * 2 = 6<\/code>，返回 6。\n<\/li><li>\n顶层结果 6。\n<\/ol>\n<p>帧次序核对：深入时帧依次为 <code>fact(3)<\/code>、<code>fact(2)<\/code>、<code>fact(1)<\/code>；回收反向为 <code>fact(1)<\/code>、<code>fact(2)<\/code>、<code>fact(3)<\/code>。每层形参 <code>n<\/code> 与返回值独立存放，互不覆盖。<\/p>\n<p>再看尾递归对照。若递归调用是函数末尾动作，返回前不再相乘合并：<\/p>\n<pre class=\"lang-c\"><code>long fact_tail(int n, long acc)\n{\n    if (n &lt;= 1) return acc;\n    return fact_tail(n - 1, n * acc);\n}<\/code><\/pre>\n<p>累计值通过形参 <code>acc<\/code> 带入下层，下层返回即最终值；这类形式便于实现尾帧复用。普通阶乘在退回层还要做乘法，合并动作挂在返回路径上。<\/p>\n<h2>反事实推演：去掉某一约束会怎样<\/h2>\n<p><strong>去掉原型检查<\/strong>。调用 <code>add(int,int)<\/code> 时少传一个参数，被调帧读到不确定值；参数类型不符时按错误宽度读栈。原型是编译期接口契约，去掉后错误推迟到运行期，且现象随机。<\/p>\n<p><strong>形参改动直接回写实参<\/strong>。若语言把形参当实参别名，被调函数改形参会牵动主调；C 选择按值复制，隔离两侧，代价是需要回写时必须显式传指针。<\/p>\n<p><strong>递归没有基准条件<\/strong>。每层继续调用自己，帧持续堆积，栈空间耗尽后程序崩溃；递归步必须使问题规模逐层缩小，基准条件必须可达。<\/p>\n<p><strong>调用不保存返回地址<\/strong>。被调函数执行完无法回到主调位置，执行流丢失；返回地址是帧结构的必要组成，与局部变量同属帧内容。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>改形参期待回写<\/strong>。被调函数内 <code>x = 0<\/code>，以为主调变量被清零；复盘：按值传递只改副本，要回写就传地址并解引用。<\/p>\n<p><strong>递归不缩小问题<\/strong>。递归步仍传同一规模参数，永不命中基准；复盘：检查每层参数是否向基准靠近。<\/p>\n<p><strong>层数过大栈溢出<\/strong>。递归深度等于调用链长度，每层占帧；深度不可控时改迭代，或限制最大层数。<\/p>\n<p><strong>路径漏写 return<\/strong>。非 <code>void<\/code> 函数某条执行路径无返回值，返回值不确定；复盘：核对所有分支出口都有 <code>return<\/code>。<\/p>\n<p><strong>多文件原型不一致<\/strong>。实现文件改了形参类型，声明头文件未同步；复盘：原型集中放头文件，各文件包含同一份，编译期暴露不一致。<\/p>\n<h2>原型与实参检查推演<\/h2>\n<p>原型形如 <code>int add(int, int);<\/code>，包含返回类型 <code>int<\/code>、函数名 <code>add<\/code>、两个形参类型。调用 <code>add(3, 4)<\/code> 时编译器逐项核对：<\/p>\n<ol><li>\n实参个数：两个实参对两个形参；少传或多传都报错。\n<\/li><li>\n实参类型：<code>3<\/code>、<code>4<\/code> 为 <code>int<\/code>，与形参 <code>int<\/code> 匹配；类型不符时尝试提升或给出警告。\n<\/li><li>\n返回值使用：若把 <code>add<\/code> 结果当 <code>double<\/code> 用，按返回类型 <code>int<\/code> 解释，再在使用处转换。\n<\/ol>\n<p>对照缺原型场景：编译器不知道 <code>add<\/code> 期望几个参数，按默认规则处理；少传参数时被调帧读到栈上残留值，结果随机。原型把接口约束从运行期提前到编译期，这是它存在的主要理由。<\/p>\n<p>再看形参与实参的名字关系。形参名只在被调帧内有效，与实参变量名无关；调用 <code>add(x, y)<\/code> 时，形参 <code>p<\/code>、<code>q<\/code> 分别接收 <code>x<\/code>、<code>y<\/code> 的副本。函数内改动 <code>p<\/code>、<code>q<\/code> 不回写 <code>x<\/code>、<code>y<\/code>，因为存储位置不同。<\/p>\n<h2>递归正确性的三个条件<\/h2>\n<p>递归成立要同时满足：<\/p>\n<ol><li>\n基准条件：存在不再递归、直接返回值的情形，且可被到达。\n<\/li><li>\n缩小步长：递归调用的参数使问题规模向基准方向靠近一层。\n<\/li><li>\n合并规则：退回层拿到子结果后，按定义合并出本层结果。\n<\/ol>\n<p>以阶乘为例：基准 <code>n&lt;=1<\/code> 返回 1；步长 <code>fact(n-1)<\/code> 使参数减 1；合并 <code>n * 子结果<\/code>。三条缺一不可：缺基准则深入不止；步长不缩小则卡在同一规模；合并规则错误则退回值不对。<\/p>\n<p><strong>展开与退回对照表<\/strong>（<code>fact(3)<\/code>）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>层次<\/th><th>形参 n<\/th><th>动作<\/th><th>返回值<\/th><\/tr><\/thead><tbody><tr><td>fact(3)<\/td><td>3<\/td><td>调 fact(2)<\/td><td>3 × 2 = 6<\/td><\/tr><tr><td>fact(2)<\/td><td>2<\/td><td>调 fact(1)<\/td><td>2 × 1 = 2<\/td><\/tr><tr><td>fact(1)<\/td><td>1<\/td><td>命中基准<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>深入顺序 3→2→1，退回顺序 1→2→3；每层帧独立保存自己的 <code>n<\/code> 与返回值。读递归时先写展开链，再写退回链，两链方向相反，不能混在一列里。<\/p>\n<p><strong>栈深度估算<\/strong>。递归最大层数约等于问题规模；每层帧保存形参、返回地址与局部变量。规模为 <span class=\"katex-inline\">n<\/span> 的递归，栈占用随 <span class=\"katex-inline\">n<\/span> 增长；<span class=\"katex-inline\">n<\/span> 很大时优先考虑迭代，或确认尾递归可被优化。<\/p>\n<h2>多帧调用链推演<\/h2>\n<p>设三个函数依次调用：<code>main<\/code> 调 <code>b<\/code>，<code>b<\/code> 调 <code>c<\/code>。<\/p>\n<pre class=\"lang-c\"><code>int c(int z) { return z + 1; }\nint b(int y) { return c(y) * 2; }\nint main(void) { return b(5); }<\/code><\/pre>\n<p>逐帧推演：<\/p>\n<ol><li>\n<code>main<\/code> 帧：调用 <code>b(5)<\/code>，保存返回地址，建 <code>b<\/code> 帧，形参 <code>y=5<\/code>。\n<\/li><li>\n<code>b<\/code> 帧：调 <code>c(y)<\/code>，保存返回地址，建 <code>c<\/code> 帧，形参 <code>z=5<\/code>。\n<\/li><li>\n<code>c<\/code> 帧：<code>z+1=6<\/code>，返回 6；<code>c<\/code> 帧回收。\n<\/li><li>\n回到 <code>b<\/code>：拿到 6，算 <code>6*2=12<\/code>，返回 12；<code>b<\/code> 帧回收。\n<\/li><li>\n回到 <code>main<\/code>：返回值 12，进程结束。\n<\/ol>\n<p>帧栈次序：进入时 <code>main → b → c<\/code>；回收时 <code>c → b → main<\/code>。每层只认自己帧内的形参与局部变量；<code>b<\/code> 看不到 <code>c<\/code> 的 <code>z<\/code>，<code>main<\/code> 看不到 <code>b<\/code> 的 <code>y<\/code>，要传递信息只能靠参数与返回值。<\/p>\n<p>返回地址的作用：<code>c<\/code> 执行完知道回到 <code>b<\/code> 的调用点，<code>b<\/code> 执行完知道回到 <code>main<\/code>。若返回地址被覆盖（越界写常见后果），回收后跳到非法位置，程序崩溃。这也解释了为什么栈上越界写比普通数据错误更危险。<\/p>\n<p><strong>值传递与地址传递对照<\/strong>。标量按值传递，形参是副本；数组传地址，函数经地址改原元素；要在函数内修改单个标量，传该标量地址，函数内解引用写回。三种方式的差别在传的是副本、地址还是数组首地址，帧内拿到的内容随之不同。<\/p>\n<h2>函数接口与返回路径核对<\/h2>\n<p>一个函数写好后，按接口、传递、帧、返回四层核对：<\/p>\n<ol><li>\n接口：原型写清返回类型与形参类型；调用处实参个数、类型与原型一致。\n<\/li><li>\n传递：标量按值复制，数组传首地址；需要回写单个标量时传地址。\n<\/li><li>\n帧：形参与局部变量在本帧分配，互不干扰；返回后帧回收，不可再访问帧内局部量。\n<\/li><li>\n返回：非 <code>void<\/code> 函数每条路径都有 <code>return<\/code>；返回值类型与声明一致；<code>void<\/code> 函数不带值返回。\n<\/ol>\n<p><strong>返回路径漏写的后果<\/strong>。某条分支没有 <code>return<\/code>，函数退出时返回值不确定；调用方拿到的是帧残留。核对方法：画出所有分支出口，逐个确认有返回语句。<\/p>\n<p><strong>原型不一致的后果<\/strong>。实现文件改了形参类型，头文件原型未同步；调用方按旧类型传参，被调按新类型解释，栈位置错位。多文件工程应把原型集中在头文件，各文件包含同一份，编译期暴露不一致。<\/p>\n<p><strong>递归与迭代的选择<\/strong>。问题可分解为同类子问题、基准明确、合并规则清晰，递归结构直观；规模大、栈深度受限或合并动作复杂时，迭代更省栈。尾递归把累计值经形参带入下层，便于帧复用；普通递归在退回层做合并，每层保留中间结果。<\/p>\n<p><strong>帧回收后的可用性<\/strong>。被调帧内的形参、局部变量在返回后回收；指向这些位置的指针随后悬垂。主调若保存了被调局部变量的地址，返回后解引用属于未定义行为。需要把结果带回主调，走返回值或主调提供的地址通道，不返回帧内局部量地址。<\/p>\n<h2>再推一层：栈帧与后续概念的衔接<\/h2>\n<p>指针参数的本质是把主调变量地址压进帧，被调函数经该地址写回原变量；c09 的指针算术决定地址怎样在帧与数组间移动。存储类别一章区分自动变量（帧内，调用期）、静态变量（静态区，全程）与动态分配（堆）；生命周期差别都能回到帧模型理解。<\/p>\n<p>读函数调用时按四步还原：原型约定什么接口；实参怎样复制；帧内有哪些形参与局部变量；返回值沿哪条链退回。读递归时先列展开链，再列退回链，核对每层参数与合并动作。原书第 9 章 §9.1 复习函数创建与使用，§9.2 讲 ANSI C 原型，§9.3 讲递归；示例阅读应先画帧栈，再对照递归两方向。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n函数原型在编译期检查哪三件事？缺原型会推迟到什么时候暴露问题？\n<\/li><li>\n按值传递下，被调函数改形参会不会影响实参？要回写需要传什么？\n<\/li><li>\n一帧里通常存哪几类内容？返回后哪些内容不可再访问？\n<\/li><li>\n递归展开方向与退回方向各做什么？次序是否相同？\n<\/li><li>\n递归必须满足哪两个条件才能终止？缺基准会怎样？\n<\/li><li>\n尾递归与普通递归在退回层的合并动作有何差别？\n<\/ol>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n画出 <code>main<\/code> 调用 <code>double_it(int x)<\/code> 时两帧的布局，标出形参、返回地址、局部变量。\n<\/li><li>\n写一个求两数最大值的函数，补出原型；说明编译期怎样核对实参个数与类型。\n<\/li><li>\n推演 <code>fact(4)<\/code> 的展开链与退回链，写出每层返回值。\n<\/li><li>\n为什么递归层数受栈大小限制？深度过大时改造方向是什么？\n<\/li><li>\n形参与全局同名变量时，函数内访问的是哪一个？遮蔽规则怎样起作用？\n<\/ol><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.641<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">函数原型、栈帧结构与递归执行<\/a><\/span><\/div><h1>指针、数组与指针算术<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（原书第 10 章 §10.3、§10.5，PDF 第 641 页起）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>指针是存放内存地址的变量；数组名在多数表达式中退化为首元素地址；指针加减按指向元素的大小缩放，两指针差值以元素个数为单位；<code>&amp;<\/code> 取地址，一元 <code>*<\/code> 间接访问指针指向的对象。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>函数要在调用外修改主调变量，多个数据要按位置共享，遍历要在成组元素间移动；直接传值无法把地址交出，逐个复制数组代价过高。指针提供间接访问通道：存地址、按地址读写、在元素间步进。困难在于地址计算的单位容易被当成字节，数组名与指针的差别容易被忽略，越界访问难以在编译期发现。本章把地址公式、缩放规则与边界判断讲清，是理解字符串处理、数组参数与后续动态内存的基础。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>指针变量<\/strong>：存放内存地址的变量，声明形如 <code>int *p;<\/code>，<code>p<\/code> 是指向 <code>int<\/code> 的指针；未初始化的指针值不确定，不能解引用。<\/p>\n<p><strong><code>&amp;<\/code> 运算符<\/strong>：取对象地址，<code>&amp;x<\/code> 得到变量 <code>x<\/code> 所在地址。 **一元 <code>*<\/code> 运算符**：间接访问，<code>*p<\/code> 表示 <code>p<\/code> 指向位置上的对象。<\/p>\n<p><strong>数组退化<\/strong>。数组名在多数表达式中转换为指向首元素的指针；例外是 <code>sizeof(数组名)<\/code>、取地址 <code>&amp;数组名<\/code> 等少数场景。退化后得到的是右值地址，不能给数组名赋值。<\/p>\n<p><strong>指针算术<\/strong>：<\/p>\n<ul><li>\n<code>p + i<\/code>：地址前进 <span class=\"katex-inline\">i<\/span> 个元素，字节增量为 <span class=\"katex-inline\">i \\times sizeof(*p)<\/span>。\n<\/li><li>\n<code>p - i<\/code>：后退 <span class=\"katex-inline\">i<\/span> 个元素。\n<\/li><li>\n<code>p2 - p1<\/code>：两指针间元素个数，等于字节差除以元素大小。\n<\/li><li>\n同类型指针才能相减；跨类型指针运算无定义。\n<\/ul>\n<p><strong>地址公式<\/strong>。数组首地址 <span class=\"katex-inline\">base<\/span>，元素类型宽度 <span class=\"katex-inline\">w<\/span>，元素 <code>a[i]<\/code> 地址为 <span class=\"katex-inline\">base + i \\times w<\/span>。<\/p>\n<p><strong><code>const<\/code> 与指针<\/strong>：<code>const int <em>p<\/code> 表示不能经 <code>p<\/code> 改所指值；<code>int <\/em> const p<\/code> 表示指针本身不可改指向；位置不同约束对象不同。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-c\"><code>int a[5] = {10, 20, 30, 40, 50};\nint *p = a;\nint third = *(p + 2);   /* 等于 a[2]，值 30 */<\/code><\/pre>\n<p><strong>反例<\/strong>：对未初始化指针解引用；把指针差当字节差；访问下标 <span class=\"katex-inline\">5<\/span> 及以上的 <code>a<\/code> 元素；给数组名赋新地址。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>地址缩放推导<\/strong>。设元素类型宽度 <span class=\"katex-inline\">w<\/span>，<code>p<\/code> 指向某元素。<code>p+1<\/code> 必须指向下一个同类型元素，因此字节地址增加 <span class=\"katex-inline\">w<\/span>；<code>p+i<\/code> 增加 <span class=\"katex-inline\">i \\times w<\/span>。若按字节加 1，跨类型访问会落在元素中间，位模式被错误拆开。<\/p>\n<p><strong>指针差推导<\/strong>。<code>p2<\/code> 与 <code>p1<\/code> 指向同一数组，字节差为 <span class=\"katex-inline\">(base+i_2 w)-(base+i_1 w)=(i_2-i_1)w<\/span>；除以 <span class=\"katex-inline\">w<\/span> 得元素个数 <span class=\"katex-inline\">i_2-i_1<\/span>。标准规定差值类型为 <code>ptrdiff_t<\/code>，单位是元素，不是字节。<\/p>\n<p><strong>数组表示与指针表示等价<\/strong>。<code>a[i]<\/code> 按定义等价于 <code>*(a + i)<\/code>：先退化为首元素地址，加 <span class=\"katex-inline\">i<\/span> 个元素，再间接访问。下标写法与指针写法指向同一对象，编译后地址计算一致。<\/p>\n<p><strong>边界判断推导<\/strong>。数组声明 <span class=\"katex-inline\">n<\/span> 个元素，合法下标为 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">n-1<\/span>；对应地址区间 <span class=\"katex-inline\">[base, base+n w)<\/span>。下标越界时地址仍可能算得出，但位置不属于数组，访问结果未定义。地址可计算不等于访问合法。<\/p>\n<p><strong>指针与函数参数<\/strong>。数组作形参退化为指针；函数内改 <code>arr[i]<\/code> 即改原数组元素。要保护数据不被修改，形参加 <code>const<\/code> 限定。<\/p>\n<p><strong>指针初始化与有效性<\/strong>。指针声明后必须指向合法对象才能解引用：可以用 <code>&amp;<\/code> 取已有变量地址，或用内存分配得到堆地址。未初始化的指针值不确定，称为野指针；指向的对象已回收后仍使用，称为悬垂指针。两者解引用都是未定义行为。<\/p>\n<p><strong>多级指针与地址层次<\/strong>。<code>int **pp<\/code> 存放指向 <code>int <em><\/code> 的地址；<code><\/em>pp<\/code> 得到内层指针，<code>**pp<\/code> 得到最终整数。多级指针的每一层都遵守同一套取址与解引用规则，只是多经过一层间接。<\/p>\n<p><strong>指针与数组表示的等价边界<\/strong>。<code>a[i]<\/code> 等价 <code>*(a+i)<\/code>，下标与指针写法互通；但数组名不是指针变量，不能被赋值，也不能在退化后保留原数组宽度。等价只在表达式求值层面成立，存储安排上数组仍是整块对象。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：遍历数组、向函数传递数组、间接修改主调变量、在缓冲区间移动位置。\n<\/li><li>\n边界一：指针使用前必须指向合法对象；野指针、悬垂指针解引用属于未定义行为。\n<\/li><li>\n边界二：指针算术只在同一数组内有意义；指向不同数组的指针相减无定义。\n<\/li><li>\n失败案例：循环按下标走到 <span class=\"katex-inline\">n<\/span> 仍访问元素，越过末元素；复盘：合法区间 <span class=\"katex-inline\">[0,n)<\/span>，末后指针可算不可解引用。\n<\/li><li>\n边界三：<code>void *<\/code> 是通用地址类型，不能直接做算术，需要先转成具体字符或元素指针。\n<\/li><li>\n边界四：指针与整数比较、跨类型转换受严格限制；<code>int <em><\/code> 与 <code>double <\/em><\/code> 不能直接相减或互换赋值。\n<\/ul>\n<p><strong>指针使用的核对顺序<\/strong>。先确认指针指向哪个合法对象；再核对加减步长乘的元素宽度；然后看差值单位是元素还是字节；末尾检查下标是否落在 <span class=\"katex-inline\">[0,n)<\/span>。四步对应有效性、算术、单位、边界四个层面，缺一步都可能出现错位或越界。<\/p>\n<p><strong>指针与数组的常见用途<\/strong>。向函数传数组避免整块复制；在被调函数内经地址修改主调数据；遍历成组元素时移动位置；配合字符串函数处理字符序列。指针本身存的是地址，不持有对象内容；对象仍在数组、变量或堆上，指针只提供访问通道。<\/p>\n<p><strong>类型安全约束<\/strong>。指针类型决定解引用时的解释宽度；把 <code>char <em><\/code> 当 <code>int <\/em><\/code> 解引用属于违规访问。<code>void *<\/code> 可通用存地址，但做算术前必须转成具体元素类型。多级指针逐层取址解引用，每一层类型都要明确。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>数组名 vs 指针变量<\/strong>：数组名是数组对象标识，退化为首地址右值，不可赋值；指针变量可重新指向别处。<code>sizeof<\/code> 两者结果不同。\n<\/li><li>\n<strong>字节差 vs 元素差<\/strong>：指针减法返回元素个数；要字节差需先转 <code>char *<\/code> 再相减。\n<\/li><li>\n**<code>&amp;<\/code> 取地址 vs <code>*<\/code> 解引用**：方向相反，<code>&amp;x<\/code> 由对象得地址，<code>*p<\/code> 由地址得对象。\n<\/li><li>\n<strong>指针常量 vs 常量指针<\/strong>：<code>int <em>const p<\/code> 锁指向，<code>const int <\/em>p<\/code> 锁所指值；写在 <code>*<\/code> 两侧约束不同对象。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 的类型宽度是缩放步长的依据；c08 的帧模型说明指针参数怎样传入被调帧。后继：第 11 章字符串遍历以字符指针步进为骨架；第 12 章动态内存分配在堆上返回指针；第 13 章文件指针复用同一间接访问模型。本章地址公式是后续一切内存操作的计算基础。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（指针、数组与指针算术）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：指针依赖链、地址计算推演与越界边界复盘<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把指针与数组用对，往回追四层：<\/p>\n<ol><li>\n对象层：变量与数组在内存占确定宽度的存储区；类型宽度来自 c02。\n<\/li><li>\n地址层：<code>&amp;<\/code> 取得对象地址，指针变量存放该地址；解引用 <code>*<\/code> 按地址读写对象。\n<\/li><li>\n算术层：指针加减按元素宽度缩放；差值以元素个数为单位；同数组内运算才有定义。\n<\/li><li>\n边界层：合法下标区间 <span class=\"katex-inline\">[0,n)<\/span>，越界地址可算但访问未定义；退化规则决定数组名何时变成首地址。\n<\/ol>\n<p>依赖链方向：对象有宽度 → 地址可存放 → 算术按元素步进 → 边界约束访问。抽掉缩放规则，步长按字节计算会错位；抽掉边界层，越界访问被误当成合法元素。<\/p>\n<p>再追一层为什么指针算术按元素缩放：同一类型元素等宽排列，<code>p+1<\/code> 的语义是&quot;下一个同类型元素&quot;，编译器必须用元素宽度乘步长。若按字节步进，<code>int *<\/code> 加 1 只移动 1 字节，落在元素内部，解引用得到跨字节的错误位模式。这条规则把类型信息带进了地址计算。<\/p>\n<h2>正向推导：地址公式与等价关系<\/h2>\n<p><strong>基本公式<\/strong>。设数组首地址 <span class=\"katex-inline\">base<\/span>，元素类型宽度 <span class=\"katex-inline\">w<\/span>：<\/p>\n<ol><li>\n<code>a[0]<\/code> 地址 <span class=\"katex-inline\">base<\/span>。\n<\/li><li>\n<code>a[i]<\/code> 地址 <span class=\"katex-inline\">base + i \\times w<\/span>。\n<\/li><li>\n指针 <code>p=a<\/code>，<code>p+i<\/code> 与 <code>&amp;a[i]<\/code> 同一地址。\n<\/ol>\n<p><strong>等价关系<\/strong>。<code>a[i]<\/code> 等价于 <code>*(a+i)<\/code>：数组名退化为首元素地址，加 <span class=\"katex-inline\">i<\/span> 个元素后间接访问。下标写法、指针写法在编译后指向同一对象；<code>&amp;a[i]<\/code> 与 <code>p+i<\/code> 同义。<\/p>\n<p><strong>差值公式<\/strong>。<code>p2=&amp;a[i2]<\/code>，<code>p1=&amp;a[i1]<\/code>：<\/p>\n<ol><li>\n字节差 <span class=\"katex-inline\">=(base+i_2 w)-(base+i_1 w)=(i_2-i_1)w<\/span>。\n<\/li><li>\n指针差 <span class=\"katex-inline\">=(i_2-i_1)w/w=i_2-i_1<\/span>，单位元素个数。\n<\/li><li>\n差值类型 <code>ptrdiff_t<\/code>；要字节差，先把两指针转成 <code>char *<\/code> 再相减。\n<\/ol>\n<p><strong>退化例外<\/strong>。多数表达式中数组名退化为首元素指针；<code>sizeof(a)<\/code> 仍得数组总宽度，<code>&amp;a<\/code> 得到整数组地址（类型为数组指针）。判断退化场景时先确认表达式上下文。<\/p>\n<p><strong>函数参数中的退化<\/strong>。形参 <code>int arr[]<\/code> 被当作 <code>int *arr<\/code>；函数内 <code>sizeof(arr)<\/code> 是指针宽度，不是原数组大小。要在函数内知道容量，需另传长度参数。<\/p>\n<h2>算例一：int 数组地址与下标推演<\/h2>\n<p>声明 <code>int a[5];<\/code>，平台 <code>sizeof(int)=4<\/code>，首地址记为 <code>0x1000<\/code>。<\/p>\n<ol><li>\n<code>a[0]<\/code> 地址：<span class=\"katex-inline\">0x1000+0\\times4=0x1000<\/span>。\n<\/li><li>\n<code>a[1]<\/code>：<span class=\"katex-inline\">0x1000+4=0x1004<\/span>。\n<\/li><li>\n<code>a[3]<\/code>：<span class=\"katex-inline\">0x1000+12=0x100C<\/span>。\n<\/li><li>\n`&amp;a[3]-&amp;a[0]=(0x100C-0x1000)/4=3$，元素差 3，字节差 12。\n<\/li><li>\n合法下标 <span class=\"katex-inline\">0,1,2,3,4<\/span>；<code>a[5]<\/code> 地址 <span class=\"katex-inline\">0x1014<\/span>，落在数组区间 <span class=\"katex-inline\">[0x1000,0x1014)<\/span> 之外。\n<\/ol>\n<p>赋值与访问核对：<\/p>\n<pre class=\"lang-c\"><code>int a[5] = {10, 20, 30, 40, 50};\nint *p = a;<\/code><\/pre>\n<ul><li>\n<code>*(p+2)<\/code>：<code>p<\/code> 加 2 个元素到 <code>&amp;a[2]<\/code>，解引用得 30，与 <code>a[2]<\/code> 相同。\n<\/li><li>\n<code>p[4]<\/code>：下标形式等价于 <code>*(p+4)<\/code>，得 50。\n<\/li><li>\n<code>p++<\/code>：指针前进一个 <code>int<\/code>，地址加 4；再解引用得到下一元素。\n<\/ul>\n<p>边界核对：<code>a[5]<\/code> 地址能算出 <code>0x1014<\/code>，但该位置不属于数组；即使读出某个值，结果也未定义。末后指针 <code>a+5<\/code> 可以参与比较（如循环终点），不能解引用。<\/p>\n<h2>算例二：字符数组与跨类型对照<\/h2>\n<p>声明 <code>char code[12];<\/code>，元素宽度 1，首地址 <code>0x2000<\/code>。<\/p>\n<ol><li>\n<code>code[0]<\/code> 地址 <code>0x2000<\/code>，<code>code[7]<\/code> 地址 <code>0x2007<\/code>。\n<\/li><li>\n`&amp;code[7]-&amp;code[2]=5<span class=\"katex-inline\">，元素差 5；字节差同样 5，因为 <\/span>w=1$。\n<\/li><li>\n字符串遍历：<code>for (char <em>q=code; <\/em>q != &#x27;\\0&#x27;; q++) putchar(*q);<\/code>，每轮检查当前字符，非 null 输出，指针前进 1 字节。\n<\/ol>\n<p>跨类型对照：同一地址区间，<code>int <em><\/code> 步长 4，<code>char <\/em><\/code> 步长 1。把 <code>int <em><\/code> 转成 <code>char <\/em><\/code> 后逐字节访问，可以看到一个整数的四个字节；反过来，把 <code>char <em><\/code> 当 <code>int <\/em><\/code> 解引用属于类型违规，位模式跨字节拆读。<\/p>\n<p>再看指针差的单位。<code>double v[8];<\/code>，<code>sizeof(double)=8<\/code>：<\/p>\n<ol><li>\n`&amp;v[6]-&amp;v[1]=5$，元素差 5。\n<\/li><li>\n字节差 <span class=\"katex-inline\">=5\\times8=40<\/span>。\n<\/li><li>\n写成 <code>(char<em>)&amp;v[6]-(char<\/em>)&amp;v[1]<\/code> 才得到 40；直接指针差仍是 5。\n<\/ol>\n<p>核对要点：差值单位跟随指针类型；换类型先转换，再决定求差方式。<\/p>\n<h2>反事实推演：改变缩放规则会怎样<\/h2>\n<p><strong>按字节做指针算术<\/strong>。<code>int *p<\/code> 加 1 移动 1 字节，下一元素在 4 字节外，中间位置被当成新元素；解引用跨两到三个整数，读出错误组合。反例后果：遍历整数数组时每个元素都错位，结果全乱。<\/p>\n<p><strong>数组名当成可赋值指针变量<\/strong>。若允许 <code>a = a + 1<\/code>，数组对象的起始位置被改写，与数组固定存储安排冲突；C 让数组名退化为右值地址，不可赋值，正是保留数组对象的固定性。<\/p>\n<p><strong>取消越界约束<\/strong>。假设任意地址访问都合法，程序可以读到其他变量、返回地址所在内存；越界写覆盖这些位置，轻则数据错乱，重则控制流被破坏。标准把越界访问定为未定义行为，编译器不保证可诊断。<\/p>\n<p><strong>指针差返回字节差<\/strong>。若减法直接给字节数，不同类型元素要再除宽度；C 选择元素单位，使 <code>p2-p1<\/code> 直接回答&quot;隔几个元素&quot;。<\/p>\n<h2>指针有效性与生命周期对照<\/h2>\n<p>指针合法的前提是指向一个仍存在的对象。按对象生命周期分三类：<\/p>\n<ol><li>\n局部自动变量：对象在帧内，帧回收后变量消失；保存其地址的指针随后悬垂，不能再解引用。\n<\/li><li>\n静态变量：对象在静态区，全程存在；取其地址在函数返回后仍可用。\n<\/li><li>\n动态分配对象：在堆上，由分配函数返回指针，<code>free<\/code> 归还后指针悬垂。\n<\/ol>\n<p>对照错误场景：函数内定义局部数组，把数组地址返回给主调；函数返回后帧回收，该地址指向已回收区域，主调解引用得到未定义结果。修正方式：数据在主调侧分配，把地址传入函数；或使用静态/堆对象。<\/p>\n<p>野指针与悬垂指针的差别：野指针从未指向合法对象，值是随机残留；悬垂指针曾经合法，但所指对象已回收。两者都不能解引用，排查方向分别是初始化缺失与生命周期越界。<\/p>\n<h2>数组参数传递推演<\/h2>\n<p>定义：<\/p>\n<pre class=\"lang-c\"><code>int sum_arr(int arr[], int n)\n{\n    int s = 0, k;\n    for (k = 0; k &lt; n; k++)\n        s += arr[k];\n    return s;\n}<\/code><\/pre>\n<p>调用：<\/p>\n<pre class=\"lang-c\"><code>int vals[5] = {3, 7, 2, 9, 4};\nint total = sum_arr(vals, 5);<\/code><\/pre>\n<ol><li>\n实参 <code>vals<\/code> 退化为指向首元素的指针，传入函数的是地址，不是整块数组副本。\n<\/li><li>\n形参 <code>arr<\/code> 按 <code>int <em>arr<\/code> 处理；<code>arr[k]<\/code> 等价 <code><\/em>(arr+k)<\/code>，访问原数组元素。\n<\/li><li>\n函数内修改 <code>arr[k]<\/code> 会改到 <code>vals[k]<\/code>；这与按值传递标量不同，传递的是地址副本，指向同一对象。\n<\/li><li>\n函数内 <code>sizeof(arr)<\/code> 是指针宽度，不是 5 个 <code>int<\/code> 的大小；元素个数必须由第二个参数 <code>n<\/code> 传入。\n<\/ol>\n<p>再看 <code>const<\/code> 保护：形参写成 <code>const int arr[]<\/code>，函数体内不能经 <code>arr<\/code> 改元素；编译器对写操作报错。这一约束在编译期生效，不改变传递方式，只限制修改权限。<\/p>\n<p>字符串参数是同一模型的特例：<code>char *s<\/code> 指向字符数组，遍历按 1 字节步长；<code>strlen<\/code>、<code>strcpy<\/code> 都通过首地址访问原数组。理解数组参数退化，就理解了标准库字符串函数为什么只传一个地址。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>野指针解引用<\/strong>。<code>int <em>p; <\/em>p=3;<\/code> 中 <code>p<\/code> 未初始化，值不确定；复盘：指针必须先指向合法对象（取地址或分配内存）再解引用。<\/p>\n<p><strong>指针差当字节差<\/strong>。把 <code>&amp;a[3]-&amp;a[0]<\/code> 当成 12 字节，实际是 3 个元素；复盘：求字节差先转 <code>char *<\/code>。<\/p>\n<p><strong>形参 sizeof 推算容量<\/strong>。函数内对数组形参求 <code>sizeof<\/code> 得到指针宽度，据此判断元素个数；复盘：容量另传参数，不依赖形参退化后的宽度。<\/p>\n<p><strong>跨数组指针相减<\/strong>。两个不同数组的指针相减，位置关系无定义；复盘：指针算术只在同一数组区间内进行。<\/p>\n<p><strong>越界下标访问<\/strong>。循环条件 <code>i &lt;= n<\/code> 访问到 <code>a[n]<\/code>；复盘：下标区间 <span class=\"katex-inline\">[0,n)<\/span>，终点指针可比较不可解引用。<\/p>\n<h2>指针运算综合算例<\/h2>\n<p><strong>算例：遍历并查找最大值<\/strong>。<\/p>\n<pre class=\"lang-c\"><code>int arr[6] = {4, 1, 9, 3, 7, 2};\nint *p, max = arr[0];\nfor (p = arr + 1; p &lt; arr + 6; p++)\n{\n    if (*p &gt; max)\n        max = *p;\n}<\/code><\/pre>\n<ol><li>\n初值 <code>p=arr+1<\/code>，指向 <code>arr[1]<\/code>；终点 <code>arr+6<\/code> 是末后指针，只比较不解引用。\n<\/li><li>\n每轮比较 <code>*p<\/code> 与 <code>max<\/code>，更新最大值；<code>p++<\/code> 前进一个 <code>int<\/code>，地址加 <code>sizeof(int)<\/code>。\n<\/li><li>\n退出时 <code>max=9<\/code>。指针差 <code>p-arr<\/code> 在循环中从 1 走到 6，元素个数与下标一致。\n<\/li><li>\n边界核对：<code>arr+6<\/code> 可作为终点比较；<code>*(arr+6)<\/code> 越界，不能写。\n<\/ol>\n<p><strong>算例：两指针区间复制<\/strong>。<\/p>\n<pre class=\"lang-c\"><code>int src[4] = {1, 2, 3, 4};\nint dst[4];\nint *q = dst;\nfor (p = src; p &lt; src + 4; p++, q++)\n    *q = *p;<\/code><\/pre>\n<ol><li>\n<code>p<\/code> 扫源数组，<code>q<\/code> 扫目标数组，各按 <code>int<\/code> 宽度步进。\n<\/li><li>\n每轮解引用 <code><em>p<\/code> 读出，写入 <code><\/em>q<\/code>。\n<\/li><li>\n两数组等长，区间都是 <span class=\"katex-inline\">[0,4)<\/span>；不等长时必须以较短者为界。\n<\/li><li>\n字节视角核对：若 <code>sizeof(int)=4<\/code>，一轮步进 4 字节；4 轮共移动 16 字节，覆盖 4 个元素。\n<\/ol>\n<p><strong>算例：字符指针与整数字节对照<\/strong>。把 <code>int x=0x12345678<\/code> 的地址转成 <code>char *<\/code> 逐字节看：<\/p>\n<pre class=\"lang-c\"><code>int x = 0x12345678;\nchar *cp = (char *)&amp;x;\nint k;\nfor (k = 0; k &lt; (int)sizeof(x); k++)\n    /* 观察 cp[k] */;<\/code><\/pre>\n<ol><li>\n<code>&amp;x<\/code> 是 <code>int <em><\/code>，转 <code>char <\/em><\/code> 后按 1 字节步长访问。\n<\/li><li>\n各字节顺序由平台字节序决定，这里只观察不跨类型解引用。\n<\/li><li>\n对比：<code>int <em><\/code> 加 1 跳一个元素，<code>char <\/em><\/code> 加 1 跳一个字节；两种步长服务不同访问目的。\n<\/ol>\n<h2>指针有效性与边界核对清单<\/h2>\n<p>读一段指针代码，按清单逐项核对：<\/p>\n<ol><li>\n指向对象：指针是否用 <code>&amp;<\/code> 或分配结果初始化；是否存在野指针。\n<\/li><li>\n生命周期：所指对象在指针使用期间是否仍存在；函数返回后局部对象地址不可再用。\n<\/li><li>\n算术范围：加减是否落在同一数组区间内；跨数组相减无定义。\n<\/li><li>\n差值单位：直接相减得元素个数；需要字节差先转 <code>char *<\/code>。\n<\/li><li>\n解引用边界：下标在 <span class=\"katex-inline\">[0,n)<\/span> 内；末后指针只比较，不解引用。\n<\/li><li>\n类型匹配：解引用宽度与指针类型一致；<code>void *<\/code> 先转具体类型再算术。\n<\/ol>\n<p><strong>地址计算复核<\/strong>。设首地址 <span class=\"katex-inline\">base<\/span>、元素宽 <span class=\"katex-inline\">w<\/span>，<code>a[i]<\/code> 地址 <span class=\"katex-inline\">base+i w<\/span>；<code>p+i<\/code> 与 <code>&amp;a[i]<\/code> 同址；<code>p2-p1=(i2-i1)<\/code>。复核时先写 <span class=\"katex-inline\">w<\/span>，再算字节增量，再核对元素差，避免把字节差当元素差。<\/p>\n<p><strong>数组形参复核<\/strong>。形参退化为指针，函数内 <code>sizeof<\/code> 只得指针宽度；元素个数必须另传。修改 <code>arr[k]<\/code> 改的是原数组元素；加 <code>const<\/code> 限制函数内修改权限。字符串参数是同一模型，步长 1，停止靠 null。<\/p>\n<p><strong>指针与下标互通的边界<\/strong>。<code>a[i]<\/code> 与 <code>*(a+i)<\/code> 等价，下标写法可换成指针写法；但数组名是对象标识，不是可赋值指针变量，<code>a = a + 1<\/code> 不成立。等价只在求值层面，存储安排上数组仍是整块连续对象，这一边界决定了数组名不能被改写指向。<\/p>\n<h2>再推一层：指针规则的延伸应用<\/h2>\n<p>字符串函数以 <code>char <em><\/code> 为入口：<code>strlen<\/code> 从首指针扫到 null，<code>strcpy<\/code> 逐字符复制并补 null；步长 1 是本章规则在字符类型上的特例。动态内存分配返回堆区指针，用完由 <code>free<\/code> 归还；指针指向堆块期间同样按元素宽度算术。文件指针 <code>FILE <\/em><\/code> 是另一层间接访问，内部结构对使用者隐藏，接口方式与本章指针模型一致。<\/p>\n<p>读指针代码按四步核对：指针指向哪个合法对象；加减步长乘的是哪种元素宽度；差值单位是元素还是字节；访问下标是否落在 <span class=\"katex-inline\">[0,n)<\/span>。四步写得出，地址计算与边界判断就有依据。原书第 10 章 §10.3 讲指针和数组，§10.5 讲指针操作；示例阅读应先画首地址与元素宽度表，再核对每个下标对应的地址。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n<code>&amp;<\/code> 与一元 <code>*<\/code> 各是什么方向的运算？给出一组对照表达式。\n<\/li><li>\n<code>p+i<\/code> 的字节增量怎样计算？为什么步长要乘元素宽度？\n<\/li><li>\n指针减法结果的单位是什么类型？要字节差怎么转换？\n<\/li><li>\n数组名在什么场合退化为首元素指针？<code>sizeof<\/code> 与 <code>&amp;<\/code> 场景有何例外？\n<\/li><li>\n合法下标区间是什么？末后指针为什么可以比较却不能解引用？\n<\/li><li>\n<code>const int <em>p<\/code> 与 <code>int <\/em>const p<\/code> 各约束哪个对象？\n<\/ol>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n<code>int v[8];<\/code> 中 <code>&amp;v[6]-&amp;v[1]<\/code> 等于多少？若元素为 <code>double<\/code>（8 字节），字节差是多少？\n<\/li><li>\n写出 <code>a[i]<\/code> 与 <code>*(a+i)<\/code> 的等价推导，说明退化发生在哪一步。\n<\/li><li>\n函数形参 <code>char s[30]<\/code> 内 <code>sizeof(s)<\/code> 是多少？为什么不等于 30？要知道容量应补什么参数？\n<\/li><li>\n为什么不能把不同数组的指针相减？无定义后果可能怎样表现？\n<\/li><li>\n用字符指针写一个遍历字符串到 null 的循环，标出每轮的检查动作与步进动作。\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：程序骨架与数据：编译链接流程、最小程序结构、基本类型与取值范围<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1–3 章：初识 C 语言、程序结构与数据类型<\/a><br>检查点：能画出从源文件到可执行文件的四阶段产物，说出 main 在程序中的位置；按位宽推导 signed 与 unsigned 整数的上下界，区分变量与常量<\/li><li class='path-step' id='path-02'><strong>步骤 02：字符串与表达式：字符数组与 null 终止、格式串解析、运算符优先级与类型转换<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 4–5 章：字符串与格式化输入/输出、运算符与表达式<\/a><br>检查点：能手算一个字符数组的 strlen 与内存布局，按格式串逐个匹配 printf/scanf 参数；写出含乘除模与自增的表达式求值顺序，判断整数除法与隐式转换结果<\/li><li class='path-step' id='path-03'><strong>步骤 03：控制流与字符 I/O：循环不变式、分支跳转、短路求值、缓冲区与输入验证<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 6–8 章：循环、分支跳转、字符输入/输出与输入验证<\/a><br>检查点：能为一段循环写出不变式与退出条件；解释 else 与 if 的配对规则、逻辑运算符的短路顺序、switch 的 break 落点；说明缓冲输入与文件结尾判定的依据<\/li><li class='path-step' id='path-04'><strong>步骤 04：函数、数组与指针：原型检查、栈帧推演、递归展开、指针算术与边界<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 9–10 章：函数、数组与指针<\/a><br>检查点：能沿调用栈画出参数、返回地址与局部变量的位置，推演一次递归调用的展开与回收；给定数组首地址与元素类型，计算任意下标元素地址与两指针差值，标出越界访问<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='目标代码文件'>目标代码文件 — 源文件经编译产生的机器码文件，尚不能直接运行，需要链接器与库及其他目标文件合并。 <span class=glossary-ref>（第 1–3 章：初识 C 语言、程序结构与数据类型）<\/span><\/li><li data-term='可执行文件'>可执行文件 — 链接阶段把目标代码与库代码按符号地址绑定后生成、可被操作系统加载运行的文件。 <span class=glossary-ref>（第 1–3 章：初识 C 语言、程序结构与数据类型）<\/span><\/li><li data-term='类型宽度（位宽）'>类型宽度（位宽） — 某类型在内存中占据的二进制位数；位宽决定取值上下界，同一类型在不同平台宽度可能不同。 <span class=glossary-ref>（第 1–3 章：初识 C 语言、程序结构与数据类型）<\/span><\/li><li data-term='null 字符（&#x27;\\0&#x27;）'>null 字符（&#x27;\\0&#x27;） — 值为 0 的字符，作为字符串结束标志；字符数组末尾必须有它，字符串函数才知道何时停止。 <span class=glossary-ref>（第 4–5 章：字符串与格式化输入/输出、运算符与表达式）<\/span><\/li><li data-term='转换说明'>转换说明 — printf/scanf 格式串中以 % 开头的片段，规定对应参数的类型、宽度与精度。 <span class=glossary-ref>（第 4–5 章：字符串与格式化输入/输出、运算符与表达式）<\/span><\/li><li data-term='运算符优先级'>运算符优先级 — 决定表达式中各运算符先后结合次序的规则表；同级再按结合性决定从左或从右分组。 <span class=glossary-ref>（第 4–5 章：字符串与格式化输入/输出、运算符与表达式）<\/span><\/li><li data-term='隐式类型转换'>隐式类型转换 — 混合类型表达式中，编译器按规则把较窄类型提升为较宽类型后再运算，不需要显式书写转换。 <span class=glossary-ref>（第 4–5 章：字符串与格式化输入/输出、运算符与表达式）<\/span><\/li><li data-term='循环不变式'>循环不变式 — 每次循环开始前都成立的断言；用它可以验证循环做对了什么、退出时得到什么结果。 <span class=glossary-ref>（第 6–8 章：循环、分支跳转、字符输入/输出与输入验证）<\/span><\/li><li data-term='短路求值'>短路求值 — 逻辑与、逻辑或在已能确定结果时不再计算右侧操作数的求值方式，右侧表达式可能不执行。 <span class=glossary-ref>（第 6–8 章：循环、分支跳转、字符输入/输出与输入验证）<\/span><\/li><li data-term='缓冲区'>缓冲区 — 在设备与程序之间暂存输入输出字符的内存区域；缓冲输入下，字符敲入换行后才交给程序读取。 <span class=glossary-ref>（第 6–8 章：循环、分支跳转、字符输入/输出与输入验证）<\/span><\/li><li data-term='函数原型'>函数原型 — 在调用前声明函数名、返回类型与各形参类型的语句；编译器据此检查参数个数与类型是否匹配。 <span class=glossary-ref>（第 9–10 章：函数、数组与指针）<\/span><\/li><li data-term='栈帧'>栈帧 — 一次函数调用在栈上分配的一块区域，存放形参、返回地址与局部变量；调用返回后该帧被回收。 <span class=glossary-ref>（第 9–10 章：函数、数组与指针）<\/span><\/li><li data-term='指针算术'>指针算术 — 对指针做加减、求差等运算时，步长按指向元素的大小缩放；差值以元素个数为单位。 <span class=glossary-ref>（第 9–10 章：函数、数组与指针）<\/span><\/li><li data-term='数组越界'>数组越界 — 访问下标落在数组声明范围之外的元素；地址计算合法不代表访问合法，越界结果未定义。 <span class=glossary-ref>（第 9–10 章：函数、数组与指针）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>C Primer Plus（第 6 版）模式库<\/h1>\n<h2>模式 1：最小可编译程序骨架<\/h2>\n<ul><li>\n<strong>触发<\/strong>：开始写一个新 C 程序，或排查&quot;找不到入口&quot;类构建问题。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n写 <code>#include &lt;stdio.h&gt;<\/code> 引入标准 I/O 原型。\n<\/li><li>\n定义 <code>int main(void)<\/code>，函数体内放声明与语句。\n<\/li><li>\n末尾 <code>return 0;<\/code> 交回退出状态。\n<\/li><li>\n先编译确认目标代码生成，再链接确认映像完整。\n<\/li><li>\n<strong>落点<\/strong>：程序入口明确，构建四阶段产物可逐段核对。\n<\/li><li>\n<strong>边界<\/strong>：<code>void main()<\/code> 不是标准形式；头文件只给声明，库机器码在链接阶段并入。\n<\/ol>\n<\/ul>\n<h2>模式 2：字符串容量与遍历核对<\/h2>\n<ul><li>\n<strong>触发<\/strong>：声明字符数组、写入字符串、调用 <code>strlen<\/code> 或字符串库函数之前。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n按&quot;字符数 + 1&quot;预留数组位置，1 字节留给 <code>&#x27;\\0&#x27;<\/code>。\n<\/li><li>\n写入结束确认末尾补 null。\n<\/li><li>\n读取前确认数组已被合法字符串初始化。\n<\/li><li>\n区分 <code>strlen<\/code>（运行期字符个数）与 <code>sizeof<\/code>（编译期声明宽度）。\n<\/li><li>\n<strong>落点<\/strong>：字符串遍历有停止依据，不会读到相邻内存。\n<\/li><li>\n<strong>边界<\/strong>：不带 null 的字符数组只能按字节访问；<code>%s<\/code> 不检查目标宽度，必须用 <code>%Ns<\/code> 限制。\n<\/ol>\n<\/ul>\n<h2>模式 3：表达式分组与类型检查<\/h2>\n<ul><li>\n<strong>触发<\/strong>：一条语句含多个运算符，或混合整数与浮点运算。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n按优先级圈出高优先级子表达式，同级按结合性分组。\n<\/li><li>\n列出每个叶子的类型，确认提升方向（窄 → 宽）。\n<\/li><li>\n先算分组内值，再沿分组树向上合并。\n<\/li><li>\n赋值时核对收窄是否超范围；有副作用的语句拆成独立行。\n<\/li><li>\n<strong>落点<\/strong>：结果次序与类型明确，避免先加后乘、整数除法误判。\n<\/li><li>\n<strong>边界<\/strong>：优先级不定操作数求值顺序；<code>&amp;&amp;<\/code>、<code>||<\/code>、<code>?:<\/code>、逗号才有次序保证。\n<\/ol>\n<\/ul>\n<h2>模式 4：循环不变式核对<\/h2>\n<ul><li>\n<strong>触发<\/strong>：写计数循环、数组遍历，或循环结果与预期不符。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n写一条断言：进入每圈前已积累了什么。\n<\/li><li>\n核对初始化使断言成立。\n<\/li><li>\n核对执行体加步进后，下一圈断言保持。\n<\/li><li>\n退出条件成立时，由断言推出目标结果；再查边界符号含不含端点。\n<\/li><li>\n<strong>落点<\/strong>：循环正确性可逐圈验证，不依赖试跑个别输入。\n<\/li><li>\n<strong>边界<\/strong>：浮点不做循环边界；遍历变量只在步进位置改变；嵌套循环外层控行、内层控列。\n<\/ol>\n<\/ul>\n<h2>模式 5：分支配对与短路保护<\/h2>\n<ul><li>\n<strong>触发<\/strong>：多层 <code>if<\/code> 嵌套、复合条件判断、<code>switch<\/code> 状态分流。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n忽略缩进，按最近未配对规则确定 <code>else<\/code> 归属。\n<\/li><li>\n复合条件把合法性判断放 <code>&amp;&amp;<\/code> 左侧，危险操作放右侧。\n<\/li><li>\n<code>switch<\/code> 从命中标签向下逐行走，标出每个 <code>break<\/code> 落点。\n<\/li><li>\n检查无匹配路径是否有 <code>default<\/code> 兜底。\n<\/li><li>\n<strong>落点<\/strong>：每条输入类别对应明确路径，保护条件先于危险操作。\n<\/li><li>\n<strong>边界<\/strong>：<code>case<\/code> 只能是整型常量；有意贯穿要加注释，漏写 <code>break<\/code> 会误串后续标签。\n<\/ol>\n<\/ul>\n<h2>模式 6：指针与数组边界计算<\/h2>\n<ul><li>\n<strong>触发<\/strong>：向函数传数组、遍历元素、计算两指针位置，或排查越界。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n确认指针指向合法对象，排除野指针与悬垂指针。\n<\/li><li>\n按元素宽度算地址：<code>base + i × sizeof(*p)<\/code>。\n<\/li><li>\n指针差值以元素为单位；要字节差先转 <code>char *<\/code>。\n<\/li><li>\n核对下标落在 <span class=\"katex-inline\">[0,n)<\/span>；末后指针只参与比较，不解引用。\n<\/li><li>\n<strong>落点<\/strong>：地址计算与访问边界一致，函数内修改数组元素有明确通道。\n<\/li><li>\n<strong>边界<\/strong>：跨数组指针相减无定义；<code>void *<\/code> 不能直接做算术；形参 <code>sizeof<\/code> 得指针宽度，容量需另传参数。\n<\/ol>\n<\/ul>", "__cheatsheet__": "<h1>C Primer Plus（第 6 版）速查表<\/h1>\n<h2>1. 程序结构与构建阶段<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>阶段<\/th><th>动作<\/th><th>产物<\/th><th>常见问题<\/th><\/tr><\/thead><tbody><tr><td>预处理<\/td><td>展开 <code>#include<\/code>、<code>#define<\/code><\/td><td>翻译单元文本<\/td><td>宏未展开、头文件路径缺失<\/td><\/tr><tr><td>编译<\/td><td>词法/语法/类型检查，生成机器码<\/td><td>目标代码<\/td><td>语法错误、类型不匹配、原型缺失<\/td><\/tr><tr><td>链接<\/td><td>合并目标文件与库，绑定符号地址<\/td><td>可执行文件<\/td><td>未定义引用、重复定义<\/td><\/tr><tr><td>加载启动<\/td><td>映像读入内存，进入 <code>main<\/code><\/td><td>运行进程<\/td><td>运行期逻辑错误<\/td><\/tr><\/tbody><\/table><\/div>\n<p>最小程序骨架：<code>#include &lt;stdio.h&gt;<\/code> → <code>int main(void) { ...; return 0; }<\/code>。<\/p>\n<h2>2. 基本类型与取值范围<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>类型<\/th><th>用途<\/th><th>宽度要点<\/th><\/tr><\/thead><tbody><tr><td><code>int<\/code><\/td><td>默认有符号整数计数<\/td><td>宽度平台相关，用 <code>sizeof<\/code> 实测<\/td><\/tr><tr><td><code>unsigned int<\/code><\/td><td>非负数量、位模式<\/td><td>范围 <span class=\"katex-inline\">[0,2^w-1]<\/span>，溢出模 <span class=\"katex-inline\">2^w<\/span> 回绕<\/td><\/tr><tr><td><code>char<\/code><\/td><td>字符编码，窄整数<\/td><td>算术时提升为 <code>int<\/code><\/td><\/tr><tr><td><code>float<\/code> / <code>double<\/code><\/td><td>单/双精度浮点<\/td><td>默认计算用 <code>double<\/code>，精度有限<\/td><\/tr><tr><td><code>int32_t<\/code> 等<\/td><td>固定宽度整数<\/td><td>来自 <code>&lt;stdint.h&gt;<\/code>，可移植<\/td><\/tr><\/tbody><\/table><\/div>\n<p>有符号 <span class=\"katex-inline\">w<\/span> 位范围：<span class=\"katex-inline\">[-2^{w-1},\\ 2^{w-1}-1]<\/span>；无符号：<span class=\"katex-inline\">[0,\\ 2^w-1]<\/span>。有符号溢出是未定义行为，无符号回绕可依赖。<\/p>\n<h2>3. 字符串与 null 终止<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>项目<\/th><th>规则<\/th><\/tr><\/thead><tbody><tr><td>结束标志<\/td><td><code>&#x27;\\0&#x27;<\/code>，数值 0；与字符 <code>&#x27;0&#x27;<\/code>（编码 48）不同<\/td><\/tr><tr><td>容量公式<\/td><td>存 <span class=\"katex-inline\">n<\/span> 个字符，数组宽度至少 <span class=\"katex-inline\">n+1<\/span><\/td><\/tr><tr><td><code>strlen<\/code><\/td><td>数 null 之前字符个数，运行期计算<\/td><\/tr><tr><td><code>sizeof(数组名)<\/code><\/td><td>编译期确定的声明宽度<\/td><\/tr><tr><td>退化例外<\/td><td><code>sizeof<\/code>、<code>&amp;数组名<\/code> 不退化为指针<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>4. 格式说明符配对<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>说明符<\/th><th>输出侧参数<\/th><th>输入侧参数<\/th><\/tr><\/thead><tbody><tr><td><code>%d<\/code><\/td><td><code>int<\/code><\/td><td><code>int *<\/code><\/td><\/tr><tr><td><code>%u<\/code><\/td><td><code>unsigned int<\/code><\/td><td><code>unsigned int *<\/code><\/td><\/tr><tr><td><code>%ld<\/code> / <code>%lld<\/code><\/td><td><code>long<\/code> / <code>long long<\/code><\/td><td>对应指针<\/td><\/tr><tr><td><code>%f<\/code><\/td><td><code>double<\/code>（<code>float<\/code> 提升）<\/td><td><code>float *<\/code><\/td><\/tr><tr><td><code>%lf<\/code><\/td><td>同 <code>%f<\/code><\/td><td><code>double *<\/code><\/td><\/tr><tr><td><code>%c<\/code><\/td><td>字符<\/td><td><code>char *<\/code>，不跳过空白<\/td><\/tr><tr><td><code>%s<\/code><\/td><td>字符数组地址<\/td><td>字符数组地址<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>scanf<\/code> 数值变量必须传地址（<code>&amp;x<\/code>）；数组名本身已是地址，不再加 <code>&amp;<\/code>。<\/p>\n<h2>5. 运算符优先级（高到低摘要）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>层级<\/th><th>运算符<\/th><th>结合性<\/th><\/tr><\/thead><tbody><tr><td>一元<\/td><td><code>++<\/code> <code>--<\/code> 正负 <code>sizeof<\/code> <code>*<\/code>(解引用) <code>&amp;<\/code><\/td><td>右<\/td><\/tr><tr><td>乘除模<\/td><td><code>*<\/code> <code>/<\/code> <code>%<\/code><\/td><td>左<\/td><\/tr><tr><td>加减<\/td><td><code>+<\/code> <code>-<\/code><\/td><td>左<\/td><\/tr><tr><td>关系<\/td><td><code>&lt; &lt;= &gt; &gt;=<\/code><\/td><td>左<\/td><\/tr><tr><td>相等<\/td><td><code>==<\/code> <code>!=<\/code><\/td><td>左<\/td><\/tr><tr><td>逻辑<\/td><td><code>&amp;&amp;<\/code> → `<\/td><td><\/td><td>`<\/td><td>短路<\/td><\/tr><tr><td>条件/赋值<\/td><td><code>?:<\/code> <code>=<\/code> <code>+=<\/code> 等<\/td><td>右<\/td><\/tr><\/tbody><\/table><\/div>\n<p>整数除法截断向零；混合类型先提升到宽类型，赋值时再收窄。<code>&amp;&amp;<\/code> 左侧假则停，<code>||<\/code> 左侧真则停。<\/p>\n<h2>6. 循环与分支要点<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>结构<\/th><th>条件位置<\/th><th>最少执行<\/th><th>适用<\/th><\/tr><\/thead><tbody><tr><td><code>while<\/code><\/td><td>入口<\/td><td>0 次<\/td><td>依赖状态终止<\/td><\/tr><tr><td><code>for<\/code><\/td><td>入口（表头三要素）<\/td><td>0 次<\/td><td>次数明确<\/td><\/tr><tr><td><code>do while<\/code><\/td><td>出口<\/td><td>1 次<\/td><td>需先执行再校验<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>\n不变式：进入每圈前成立的断言；初始化成立 → 每圈保持 → 退出得结果。\n<\/li><li>\n<code>else<\/code> 配最近未配对 <code>if<\/code>；缩进不改配对。\n<\/li><li>\n<code>switch<\/code> 命中后顺序贯穿，<code>break<\/code> 离开；<code>case<\/code> 标签须为整型常量。\n<\/li><li>\n<code>break<\/code> 跳出整个结构；<code>continue<\/code> 跳过本次余下循环体。\n<\/ul>\n<h2>7. 函数、栈帧与指针<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>概念<\/th><th>规则<\/th><\/tr><\/thead><tbody><tr><td>原型<\/td><td>调用前声明返回类型与形参类型，编译期核对个数/类型<\/td><\/tr><tr><td>按值传递<\/td><td>形参是副本，改形参不回写实参<\/td><\/tr><tr><td>栈帧<\/td><td>存形参、返回地址、局部变量；返回回收<\/td><\/tr><tr><td>递归<\/td><td>逐层建帧，基准条件终止，结果沿链退回<\/td><\/tr><tr><td>指针算术<\/td><td><code>p+i<\/code> 地址增量 <span class=\"katex-inline\">i\\times sizeof(*p)<\/span><\/td><\/tr><tr><td>指针差值<\/td><td>单位为元素个数；字节差需转 <code>char *<\/code> 再减<\/td><\/tr><tr><td>数组边界<\/td><td>合法下标 <span class=\"katex-inline\">[0,n)<\/span>；末后指针可比较不可解引用<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>8. 输入验证顺序<\/h2>\n<ol><li>\n用 <code>scanf<\/code> 返回值判断读到几个合法项。\n<\/li><li>\n数值后残留的换行/字符，用循环读到换行清出缓冲。\n<\/li><li>\n<code>%c<\/code> 不跳过空白；读可见字符前在格式串加空格。\n<\/li><li>\n<code>%s<\/code> 必须带宽度限制，如 10 元素数组用 <code>%9s<\/code>。\n<\/ol>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const SYN_GROUPS = [["定义", "含义", "释义", "概念"], ["例题", "算例", "示例", "例子", "案例"], ["习题", "题目", "练习", "测验", "自测"], ["推导", "证明", "论证", "演算"], ["步骤", "流程", "过程", "环节"], ["性质", "特性", "特点", "属性"], ["公式", "表达式", "式子"], ["定理", "定律", "法则", "准则"], ["图像", "图形", "图示", "曲线"], ["计算", "求解", "算出", "求值"], ["平均值", "均值", "平均数"], ["误差", "偏差", "偏离"], ["函数", "映射", "对应关系"], ["导数", "变化率", "切线斜率", "微商"], ["原函数", "不定积分", "反导数"], ["概率", "几率", "可能性"]];
const SOURCES = {};
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
const ZS_VERSION = '1.9.0';
/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  if(typeof vis !== 'undefined'){ networkLoaded = true; cb(); return; }
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE) { cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库未加载：离线构建请加 <code>--offline all</code>，或联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边

        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){

        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 掌握度（简化 BKT） ---------- */
function getMastery(cid){
  if(!cid) return 0.5;
  const m = (state.mastery||{})[cid];
  return m !== undefined ? m : 0.3;
}
function updateMastery(cid, delta){
  if(!cid) return;
  if(!state.mastery) state.mastery = {};
  const cur = state.mastery[cid] !== undefined ? state.mastery[cid] : 0.3;
  state.mastery[cid] = Math.max(0, Math.min(1, cur + delta));
  store.set('mastery', state.mastery);
}
function masteryBar(cid){

  return `<div class="mastery-bar"><div style="width:${v}%"></div></div><span class="mastery-label">掌握度 ${v}%</span>`;
}
