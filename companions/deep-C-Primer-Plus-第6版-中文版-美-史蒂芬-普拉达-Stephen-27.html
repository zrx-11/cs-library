/code> 得到 <code>&#x27;B&#x27;<\/code> 的编码；但写回字符变量时仍按 <code>char<\/code> 宽度存储。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：普通整数计数、状态标记用 <code>int<\/code>；更大范围用 <code>long<\/code>/<code>long long<\/code>；位运算与模回绕语义明确时用 <code>unsigned<\/code>；金额与科学计算用 <code>double<\/code>。\n<\/li><li>\n边界一：有符号溢出在标准中属于未定义行为，编译器不保证结果；无符号溢出按模回绕是明确定义。两者不能混为一谈。\n<\/li><li>\n边界二：<code>char<\/code> 与 <code>int<\/code> 参与算术时都会提升为 <code>int<\/code>；但存储字符时仍按 <code>char<\/code> 宽度占用空间。\n<\/li><li>\n失败案例：假设 <code>int<\/code> 恒为 4 字节，把指针差、数组规模按 4 推算，换到 64 位宽整型平台时地址计算错位。\n<\/li><li>\n边界三：浮点零有正负之分，极小误差在连续运算中累积；循环计数应使用整数类型，不应用 <code>double<\/code> 累加次数。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong><code>char<\/code> 字符 vs 整数<\/strong>：<code>char<\/code> 本质是窄整数，能存编码值；写 <code>&#x27;A&#x27;<\/code> 与写编码数值等价，但语义上字符类型用于文本，整数类型用于计数。\n<\/li><li>\n<strong>有符号 vs 无符号<\/strong>：同一 <code>w<\/code> 位，有符号分正负两侧，无符号单侧到 <span class=\"katex-inline\">2^w-1<\/span>；混合比较时 <code>int<\/code> 可能转成 <code>unsigned<\/code>，负数比较结果反直觉。\n<\/li><li>\n<strong><code>float<\/code> vs <code>double<\/code><\/strong>：<code>float<\/code> 省空间但尾数精度低，日常计算默认用 <code>double<\/code>；只有存储大量浮点数据时才为省空间选 <code>float<\/code>。\n<\/li><li>\n<strong>类型宽度 vs 格式符<\/strong>：宽度是存储与解释规则，格式符是 <code>printf<\/code>/<code>scanf<\/code> 的读取约定；两者必须配套，<code>%d<\/code> 配 <code>int<\/code>、<code>%u<\/code> 配 <code>unsigned<\/code>。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的编译链接模型说明类型在编译期决定存储安排。后继：c03 的字符数组以 <code>char<\/code> 为元素类型；c05 的表达式类型提升依据本章宽度次序；c09 的指针算术步长等于元素类型宽度。本章的取值范围结论，是判断溢出、越界与类型转换是否安全的底层依据。<\/p>\n<p>判断一个类型选得是否合适，落到两个可核对事实：上界是否被覆盖，解释规则是否与用途一致。计数、状态、编码、测量各有对应类型；需要固定位数时再用 <code>stdint.h<\/code> 定宽类型，而不是假定某平台默认宽度。原书第 3 章 §3.4.9 列出各类型大小的查看方式，§3.5 讲使用数据类型时的选择顺序，阅读时应结合目标平台 <code>sizeof<\/code> 实测，把类型宽度与用途对齐。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（基本数据类型、位宽与整数取值范围）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：位宽依赖链、取值范围推导与溢出回绕推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把类型宽度与取值范围用对，往回追四层：<\/p>\n<ol><li>\n存储层：变量在内存占一块连续二进制位，位的数量由类型决定。这是最底层事实。\n<\/li><li>\n解释层：同一串位按有符号补码、无符号数或浮点格式解码，得到不同数值；类型同时绑定宽度与解释规则。\n<\/li><li>\n范围层：宽度 <span class=\"katex-inline\">w<\/span> 决定可编码状态总数 <span class=\"katex-inline\">2^w<\/span>；有符号在正负两侧分配，无符号单侧分配，浮点再分符号、指数、尾数三段。\n<\/li><li>\n运算层：表达式求值时按类型提升规则换算，溢出时按类型有无符号区分后果；范围判断先于运算安排类型。\n<\/ol>\n<p>依赖链方向：内存留位 → 类型定解释 → 解释定范围 → 运算按范围判断安全性。抽掉解释层，位串没有数值含义；抽掉范围层，溢出与否无法预判。<\/p>\n<p>再追一层为什么标准不写死每个类型的字节数：C 要适配从嵌入式到大型机的多种硬件，类型宽度跟随平台算术效率调整；标准只锁死宽度次序与最小保证，固定宽度类型交给 <code>stdint.h<\/code>。这一约束决定了可移植代码必须用 <code>sizeof<\/code> 实测，不能凭印象写死字节数。<\/p>\n<h2>正向推导：范围公式怎样得到<\/h2>\n<p><strong>有符号整数<\/strong>。设位宽 <span class=\"katex-inline\">w<\/span>。最高位为符号位 <span class=\"katex-inline\">s<\/span>，其余 <span class=\"katex-inline\">w-1<\/span> 位为数值位 <span class=\"katex-inline\">v<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">s=0<\/span> 时表非负：<span class=\"katex-inline\">v<\/span> 可取 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">2^{w-1}-1<\/span>，最大值即全 1 的数值位。\n<\/li><li>\n<span class=\"katex-inline\">s=1<\/span> 时表负数：补码表示下，编码 <span class=\"katex-inline\">(1,0,\\dots,0)<\/span> 约定给最小负值 <span class=\"katex-inline\">-2^{w-1}<\/span>；比正数侧多一个编码位置。\n<\/li><li>\n合并两侧，有符号范围 <span class=\"katex-inline\">[-2^{w-1},\\ 2^{w-1}-1]<\/span>，可编码状态总数 <span class=\"katex-inline\">2^w<\/span>。\n<\/ol>\n<p><strong>无符号整数<\/strong>。<span class=\"katex-inline\">w<\/span> 位全部为数值位，编码从 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">2^w-1<\/span>；超出上界的结果按模 <span class=\"katex-inline\">2^w<\/span> 回绕：<span class=\"katex-inline\">x \\bmod 2^w<\/span>，落回 <span class=\"katex-inline\">[0,2^w-1]<\/span>。<\/p>\n<p><strong>浮点类型<\/strong>。位划分为符号位、指数位 <span class=\"katex-inline\">E<\/span>、尾数位 <span class=\"katex-inline\">M<\/span>。数值约等于 <span class=\"katex-inline\">(-1)^s \\times 2^{E-\\text{bias}} \\times (1+M)<\/span>。指数决定量级跨度，尾数决定同一量级内的分辨细度；同宽下浮点范围大但精度有限，大数区间相邻两数间隔被拉大。<\/p>\n<p><strong>类型提升次序<\/strong>。算术运算中，<code>char<\/code>、<code>short<\/code> 先提升到 <code>int<\/code>；<code>int<\/code> 与 <code>unsigned<\/code> 运算时 <code>int<\/code> 转 <code>unsigned<\/code>；<code>int<\/code> 与 <code>double<\/code> 运算时 <code>int<\/code> 转 <code>double<\/code>。提升方向是向更宽、精度更高的类型靠拢，避免先损精度再补回。<\/p>\n<p>推导依据：范围公式只依赖位宽与编码约定；提升次序由标准类型层次规定，不随编译器偏好改变。<\/p>\n<h2>算例一：按位宽计算四个类型的上下界<\/h2>\n<p><strong>例 1：16 位 <code>short<\/code>（<span class=\"katex-inline\">w=16<\/span>）<\/strong>。<\/p>\n<ol><li>\n有符号：下界 <span class=\"katex-inline\">-2^{15}=-32768<\/span>，上界 <span class=\"katex-inline\">2^{15}-1=32767<\/span>。\n<\/li><li>\n无符号：下界 <span class=\"katex-inline\">0<\/span>，上界 <span class=\"katex-inline\">2^{16}-1=65535<\/span>。\n<\/li><li>\n核对状态数：有符号覆盖 <span class=\"katex-inline\">32768<\/span> 个负数、<span class=\"katex-inline\">32768<\/span> 个非负数（含 0），合计 <span class=\"katex-inline\">65536=2^{16}<\/span>；无符号同样 <span class=\"katex-inline\">65536<\/span> 个编码，两侧总数一致。\n<\/ol>\n<p><strong>例 2：32 位 <code>int<\/code>（<span class=\"katex-inline\">w=32<\/span>）<\/strong>。<\/p>\n<ol><li>\n有符号：下界 <span class=\"katex-inline\">-2^{31}=-2147483648<\/span>，上界 <span class=\"katex-inline\">2^{31}-1=2147483647<\/span>。\n<\/li><li>\n无符号：上界 <span class=\"katex-inline\">2^{32}-1=4294967295<\/span>。\n<\/li><li>\n核对：<span class=\"katex-inline\">2^{31}=2147483648<\/span>，加 1 得 <span class=\"katex-inline\">2147483647<\/span>；<span class=\"katex-inline\">2^{32}=4294967296<\/span>，减 1 得上界。\n<\/ol>\n<p><strong>例 3：<code>char<\/code>（<span class=\"katex-inline\">w=8<\/span>）<\/strong>。若按有符号解释，范围 <span class=\"katex-inline\">[-128,127]<\/span>；无符号解释范围 <span class=\"katex-inline\">[0,255]<\/span>。字符 <code>&#x27;0&#x27;<\/code> 的编码是 48，与数值 0 相差 48；比较字符时必须用编码值，不能把字符 <code>&#x27;0&#x27;<\/code> 当整数 0。<\/p>\n<p><strong>例 4：宽度实测对照<\/strong>。在常见 64 位平台上，<code>sizeof(int)<\/code> 为 4，<code>sizeof(long)<\/code> 可能为 8；换平台后 <code>long<\/code> 宽度可能变为 4。判断某平台真实宽度，唯一可靠动作是运行 <code>sizeof<\/code> 打印，而不是套用其他平台数值。<\/p>\n<h2>算例二：溢出与回绕逐值推演<\/h2>\n<p><strong>场景 A：有符号上界加 1<\/strong>。设 32 位 <code>int x = 2147483647;<\/code> 执行 <code>x = x + 1;<\/code>。<\/p>\n<ol><li>\n上界是 <span class=\"katex-inline\">2^{31}-1<\/span>，加 1 应为 <span class=\"katex-inline\">2^{31}<\/span>，超出有符号可表示范围。\n<\/li><li>\n标准规定有符号溢出属于未定义行为；实际常见补码机器上，位模式从 <code>0111...111<\/code> 变成 <code>1000...000<\/code>，按有符号解码为 <span class=\"katex-inline\">-2147483648<\/span>。\n<\/li><li>\n不能把这个回绕结果当成可移植保证：换编译器可能优化掉判断或产生其他后果。\n<\/ol>\n<p><strong>场景 B：无符号回绕<\/strong>。设 <code>unsigned int u = 0;<\/code> 执行 <code>u = u - 1;<\/code>。<\/p>\n<ol><li>\n按数值应得 <span class=\"katex-inline\">-1<\/span>，无符号类型按模 <span class=\"katex-inline\">2^{32}<\/span> 解释。\n<\/li><li>\n<span class=\"katex-inline\">-1 \\bmod 2^{32}=2^{32}-1=4294967295<\/span>。\n<\/li><li>\n位模式全 1，与有符号下的 <span class=\"katex-inline\">-1<\/span> 位模式相同，差别只在解码规则；无符号下该结果是明确定义的回绕值。\n<\/ol>\n<p><strong>场景 C：混合符号比较<\/strong>。设 <code>int a = -1; unsigned int b = 1;<\/code> 比较 <code>a &lt; b<\/code>。<\/p>\n<ol><li>\n按规则 <code>a<\/code> 在比较前转成 <code>unsigned int<\/code>；<code>-1<\/code> 的位模式转无符号为 <span class=\"katex-inline\">4294967295<\/span>。\n<\/li><li>\n比较变成 <span class=\"katex-inline\">4294967295 &lt; 1<\/span>，结果为假。\n<\/li><li>\n直觉上 <span class=\"katex-inline\">-1 &lt; 1<\/span> 成立，这里得出相反结论，根源是有符号侧被转换成无符号解释。\n<\/ol>\n<p>核对三步：先看两侧类型，再看转换方向，末尾按转换后的类型比较；跳过中间转换直接凭直觉比较，是这类错误的来源。<\/p>\n<h2>反事实推演：改变类型约定会怎样<\/h2>\n<p><strong>把有符号溢出也定义成模回绕<\/strong>：程序会得到确定回绕值，但标准选择不保证有符号溢出，是为了给编译器优化留出空间；若把回绕当保证，优化开高等级后代码行为可能偏离预期。边界在于：无符号回绕可依赖，有符号溢出不可依赖。<\/p>\n<p><strong>取消类型宽度区分，所有整数统一 64 位<\/strong>：小变量白白占空间，且无法表达按窄位宽访问硬件寄存器的需求；类型宽度分级正是为范围、精度与存储代价分层服务。<\/p>\n<p><strong>让浮点按精确十进制存储<\/strong>：小数如 0.1 在二进制下是无限循环分数，无法精确存入；取消二进制格式，就要换一套量级与尾数表示，运算复杂度与硬件支持都要重算。<\/p>\n<h2>算例三：字面量类型与赋值截断推演<\/h2>\n<p>取三组字面量与赋值：<\/p>\n<ol><li>\n<code>long big = 1000000;<\/code>：<code>1000000<\/code> 按 <code>int<\/code> 字面量处理，只要该值在 <code>int<\/code> 范围内就安全；若平台 <code>int<\/code> 为 16 位（上界 32767），这个字面量本身已超出，需要写 <code>1000000L<\/code> 标明 <code>long<\/code>。\n<\/li><li>\n<code>float f = 3.14;<\/code>：<code>3.14<\/code> 是 <code>double<\/code> 字面量，赋给 <code>float<\/code> 时尾数按 <code>float<\/code> 精度舍入；若直接写 <code>3.14f<\/code>，字面量本身就是 <code>float<\/code>。\n<\/li><li>\n<code>char c = 200;<\/code>：若 <code>char<\/code> 按有符号解释，200 超出 127，位模式解码为负数；按无符号解释才是 200。同一个位串在两种解释下数值不同，说明类型同时约束解码方向。\n<\/ol>\n<p>核对依据：字面量后缀决定字面量类型；赋值时右侧先按自身类型求值，再按左侧类型转换；转换是否丢精度，看两侧范围与精度差。<\/p>\n<p>再看一次算术提升链。表达式 <code>&#x27;A&#x27; + 1<\/code>：<\/p>\n<ol><li>\n<code>&#x27;A&#x27;<\/code> 是 <code>char<\/code> 常量，先提升为 <code>int<\/code>，编码值 65。\n<\/li><li>\n与整数 1 相加，<code>int<\/code> 加 <code>int<\/code>，结果 66。\n<\/li><li>\n若写 <code>char c = &#x27;A&#x27; + 1;<\/code>，66 再截断存入 <code>char<\/code>；66 在 8 位范围内，存储结果为 <code>&#x27;B&#x27;<\/code>。\n<\/ol>\n<p>这条链展示提升方向：窄类型在运算前加宽，运算在较宽类型上完成，赋值时才按目标类型收窄；收窄是否安全，要看原值是否落在目标范围内。<\/p>\n<h2>类型选择决策顺序<\/h2>\n<p>面对一个新变量，按四步判断类型：<\/p>\n<ol><li>\n数值是离散计数还是连续测量：离散用整数系列，测量用浮点系列。\n<\/li><li>\n估计最大可能值：选能覆盖上界的最窄宽度；需要固定位数再用 <code>stdint.h<\/code> 别名。\n<\/li><li>\n是否涉及模回绕或位模式操作：语义明确时才用 <code>unsigned<\/code>；普通计数保持有符号。\n<\/li><li>\n精度需求：默认 <code>double<\/code>，批量存储且精度宽松再考虑 <code>float<\/code>。\n<\/ol>\n<p>四步的依据是范围先于精度、精度先于存储代价；顺序颠倒会先挑省空间的类型，再发现数值装不下或精度不够。原书第 3 章 §3.5 提示使用数据类型时先确认变量用途，§3.6 列出参数与陷阱，其中类型与格式符错配、字符与数字混淆都属于类型选择阶段遗留的问题。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>假定 <code>int<\/code> 恒为 4 字节<\/strong>。在 16 位平台上 <code>int<\/code> 为 2 字节，上界仅 32767；按 4 字节推算数组跨度或地址差，结果错位。复盘：需要固定宽度就用 <code>int32_t<\/code> 这类定宽类型，通用计数用平台默认宽度并以 <code>sizeof<\/code> 核对。<\/p>\n<p><strong>字符与数字直接比较<\/strong>。判断输入是否为数字，写成 <code>if (c &gt;= 0 &amp;&amp; c &lt;= 9)<\/code>；<code>c<\/code> 存的是字符编码，数字字符编码为 48 到 57，比较应写成 <code>c &gt;= &#x27;0&#x27; &amp;&amp; c &lt;= &#x27;9&#x27;<\/code>，再用 <code>c - &#x27;0&#x27;<\/code> 转数值。<\/p>\n<p><strong>用浮点做循环计数<\/strong>。<code>for (double d = 0; d &lt; 10; d += 0.1)<\/code> 累加 0.1 存在舍入误差，累计次数可能偏离预期；循环次数是离散计数，应用整数类型承载。<\/p>\n<p><strong>混合符号比较未察觉转换<\/strong>。见场景 C：负的 <code>int<\/code> 与 <code>unsigned<\/code> 比较前被转无符号，结论反转。复盘：比较前先确认两侧是否同符号类型，必要时显式转换。<\/p>\n<h2>补码编码与解码推演<\/h2>\n<p>以 4 位宽度（<span class=\"katex-inline\">w=4<\/span>）为例把补码规则走一遍，便于把 32 位结论压缩到可手算规模。<\/p>\n<ol><li>\n编码 0110：符号位 0，非负；数值位 110 为 <span class=\"katex-inline\">2^2+2^1=6<\/span>，解码 +6。\n<\/li><li>\n编码 1000：符号位 1，按约定是最小负值 <span class=\"katex-inline\">-2^{3}=-8<\/span>。\n<\/li><li>\n编码 1111：符号位 1，数值位全 1；补码解码为 <span class=\"katex-inline\">-8+7=-1<\/span>。\n<\/li><li>\n编码 0000：解码 0。\n<\/li><li>\n范围核对：非负侧 0 到 7，负侧 -8 到 -1，共 16 个编码，等于 <span class=\"katex-inline\">2^4<\/span>。\n<\/ol>\n<p>推广到 <span class=\"katex-inline\">w<\/span> 位：符号位决定方向，数值位按二进制展开；负侧比正侧多一个最小负值编码。手算小宽度编码，是为了理解 32 位机器上同一规则的放大版本，而不是把 4 位数值直接搬到程序里。<\/p>\n<p>再看无符号对照：同样 4 位，0110 解码 6，1000 解码 8，1111 解码 15，0000 解码 0，范围 0 到 15。位串相同，解码规则不同，数值不同；这就是&quot;类型同时绑定宽度与解释&quot;的具体含义。<\/p>\n<h2>浮点累加误差算例<\/h2>\n<p>设用 <code>double<\/code> 反复累加 0.1，共 10 次。<\/p>\n<ol><li>\n0.1 在二进制下无法精确表示，存入时已是最近的可表示近似值。\n<\/li><li>\n每加一次，近似误差叠加一次；10 次累加后结果与理论值 1.0 可能存在极小偏差。\n<\/li><li>\n若循环条件写成&quot;累加值等于 1.0 时停止&quot;，比较可能因偏差不成立，循环多走或少走。\n<\/li><li>\n离散次数用整数计数：<code>for (int i = 0; i &lt; 10; i++)<\/code>，次数由整数变量控制，不依赖浮点相等判断。\n<\/ol>\n<p>这条算例说明浮点类型的边界：量级跨度大，但同一量级内分辨有限；涉及累计、计数、相等判断的场景，优先选整数类型。原书第 3 章 §3.4.6 介绍 <code>float<\/code>、<code>double<\/code>、<code>long double<\/code> 时，应结合这条边界理解：选浮点是为了连续测量，不是为了替代所有整数用途。<\/p>\n<h2>类型选择对照算例<\/h2>\n<p>按用途选类型，逐个核对范围与精度：<\/p>\n<ol><li>\n人数计数：非负、通常不大，用 <code>int<\/code>；需要更大范围用 <code>long<\/code>。\n<\/li><li>\n字符编码：用 <code>char<\/code>；参与算术时提升为 <code>int<\/code>。\n<\/li><li>\n真假状态：用 <code>_Bool<\/code>，取值 0 或 1。\n<\/li><li>\n金额测量：用 <code>double<\/code>；批量省空间且精度宽松才用 <code>float<\/code>。\n<\/li><li>\n必须固定 32 位存整数：用 <code>int32_t<\/code>，不假定 <code>int<\/code> 宽度。\n<\/ol>\n<p><strong>宽度核对动作<\/strong>。在目标平台运行 <code>sizeof<\/code> 打印各类型字节数，再与上界估计对照：估计上界落在类型范围内才选定。把某一台机器的 <code>sizeof<\/code> 结果抄成通用结论，是移植错误的常见来源。<\/p>\n<p><strong>符号选择核对<\/strong>。普通计数保持有符号；只有做位模式操作、模回绕语义明确、或纯非负数量时才用 <code>unsigned<\/code>。混合比较前先确认两侧符号一致，避免负 <code>int<\/code> 被转无符号后结论反转。浮点不承担离散计数；循环次数、数组下标用整数类型。<\/p>\n<h2>再推一层：类型宽度怎样支撑后续概念<\/h2>\n<p>指针算术的步长等于元素类型宽度：<code>int <em><\/code> 加 1 移动 4 字节（平台实测），<code>char <\/em><\/code> 加 1 移动 1 字节；这条规则直接来自本章位宽结论。函数参数按值传递时，形参按类型宽度在栈上留出空间；表达式隐式提升按类型层次方向进行。离开本章后，凡涉及&quot;占多少位、能存多大、按什么解码&quot;的判断，都回到位宽与解释规则两层来分析。<\/p>\n<p>原书第 3 章 §3.4.5 介绍 <code>stdint.h<\/code> 与 <code>inttypes.h<\/code> 的可移植类型：当代码必须假定固定位数时，这些头文件提供 <code>int8_t<\/code>、<code>uint32_t<\/code> 等别名，把&quot;平台宽度不确定&quot;的风险收敛到显式选择。§3.4.9 的类型大小表，应配合 <code>sizeof<\/code> 在目标平台实测阅读，不能把某一台机器的字节数抄成通用结论。<\/p>\n<p>把本章结论压缩成三条可执行判断：其一，声明变量前先估计上界，上界落在哪个范围就选哪个宽度；其二，有符号溢出不可依赖，无符号回绕才可依赖，混合符号比较先查转换方向；其三，格式符必须与变量类型配套，<code>%d<\/code>、<code>%u<\/code>、<code>%f<\/code>、<code>%ld<\/code> 各对应一类类型，配错时编译期未必报错，运行期按错误宽度读内存。这三条在后面字符串输入输出、表达式求值与指针计算中反复用到。判断类型选择是否合理，最终回到两个可核对事实：上界是否被覆盖，解释规则是否与用途一致；两条都满足，类型选择才算落地。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n不看公式，能否从 <span class=\"katex-inline\">w<\/span> 位推出有符号与无符号的上下界？\n<\/li><li>\n有符号溢出与无符号回绕，后果一个是未定义行为、一个是明确定义，差别落在哪条规则上？\n<\/li><li>\n<code>char &#x27;0&#x27;<\/code>、<code>&#x27;A&#x27;<\/code> 与整数 0、65 的关系是什么？为什么不能直接比较字符与数字？\n<\/li><li>\n混合 <code>int<\/code> 与 <code>unsigned<\/code> 比较时，转换方向朝哪一侧？\n<\/li><li>\n为什么循环计数不用 <code>double<\/code>？\n<\/li><li>\n需要固定 32 位宽度时，应该用哪类类型，而不是假定 <code>int<\/code> 宽度？\n<\/ol>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出 8 位、16 位、32 位有符号与无符号整数的取值范围，并核对编码状态总数。\n<\/li><li>\n32 位下 <code>-1<\/code> 转 <code>unsigned int<\/code> 得到多少？推导模 <span class=\"katex-inline\">2^{32}<\/span> 的计算过程。\n<\/li><li>\n为什么 <code>double<\/code> 不能直接判断两次计算结果全等？尾数精度与指数各承担什么职责？\n<\/li><li>\n<code>short<\/code>、<code>int<\/code>、<code>long<\/code> 的宽度次序由什么保证？绝对字节数在哪个阶段确定？\n<\/li><li>\n一段代码把循环次数存在 <code>float<\/code> 里，可能出现什么偏离？换成整数类型解决了哪一层问题？\n<\/ol><\/div><\/details>", "c03": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.178<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">基本数据类型、位宽与整数取值范围<\/a><\/span><\/div><h1>字符数组、null 终止符与字符串长度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch02（原书第 4 章 §4.2，PDF 第 178 页起）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>C 语言的字符串是存放在 <code>char<\/code> 数组中、以 null 字符 <code>&#x27;\\0&#x27;<\/code>（数值 0）收尾的字符序列；长度由遍历到 null 之前的字符个数确定，末尾的 null 本身不计入长度。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>程序要处理名字、句子、提示语这类文本，困难在于字符序列本身没有自带长度字段。早期语言用长度前缀存字符串，C 的做法是用一个结束标记划定序列边界。这个设计带来两个必须弄清的问题：一是数组里怎样安排字符与结束标记，二是所有字符串函数怎样知道在哪停止。不理解 null 终止规则，写字符串时会漏写结束符，读字符串时会越界读到相邻内存；<code>strlen<\/code>、<code>puts<\/code>、<code>%s<\/code>、<code>strcpy<\/code>、<code>strcmp<\/code> 全部依赖这条规则。本章把字符数组的内存布局与遍历不变式讲清，为第 11 章字符串函数与第 10 章指针遍历打基础。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>字符数组<\/strong>：元素类型为 <code>char<\/code> 的数组，每个元素占一个字节，存放一个字符编码。声明形如 <code>char name[40];<\/code>，方括号内是元素个数。<\/p>\n<p><strong>null 字符<\/strong>：字面量写作 <code>&#x27;\\0&#x27;<\/code>，数值为 0，是字符串结束标志。它与字符 <code>&#x27;0&#x27;<\/code> 不同：<code>&#x27;0&#x27;<\/code> 编码 48，<code>&#x27;\\0&#x27;<\/code> 编码 0；两者位模式不同，不能互换。<\/p>\n<p><strong>字符串字面量<\/strong>：用双引号括起的字符序列，如 <code>&quot;Amy&quot;<\/code>；编译器在末尾自动补一个 null，并存放在只读数据区。用数组接收字面量时，字符被复制进数组，末尾同样带 null。<\/p>\n<p><strong><code>strlen()<\/code><\/strong>：标准库函数，参数为字符数组首地址，从首元素逐个计数，遇到 null 停止，返回 null 之前的字符个数。头文件 <code>&lt;string.h&gt;<\/code> 提供其原型。<\/p>\n<p><strong>两种初始化对照<\/strong>：<\/p>\n<pre class=\"lang-c\"><code>char a[6] = &quot;Hello&quot;;   /* 5 个字符加 null，占 6 字节 */\nchar b[] = &quot;Hi&quot;;       /* 编译器按字面量长度加 1 定数组大小 */<\/code><\/pre>\n<p><strong>正例<\/strong>：<code>char s[10] = &quot;cat&quot;;<\/code> 布局为 <code>c<\/code>、<code>a<\/code>、<code>t<\/code>、<code>\\0<\/code>，其余字节未使用；<code>strlen(s)<\/code> 返回 3。<\/p>\n<p><strong>反例<\/strong>：<code>char s[3] = &quot;cat&quot;;<\/code> 没有给 null 留位置，数组不构成合法字符串；后续 <code>strlen<\/code> 遍历越过数组边界，结果未定义。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>遍历不变式<\/strong>：设指针从数组首元素出发，每读到一个非 null 字符，计数加 1 并前进一格；读到 null 即停止。不变式：当前计数等于从起点到当前指针之前的字符个数。终止条件是当前元素为 <code>&#x27;\\0&#x27;<\/code>，停止位置就是结束标记。<\/p>\n<p><strong>长度计数推导<\/strong>：若有效字符有 <span class=\"katex-inline\">n<\/span> 个，数组至少需要 <span class=\"katex-inline\">n+1<\/span> 个元素存字符与 null。<code>strlen<\/code> 返回 <span class=\"katex-inline\">n<\/span>；<code>sizeof<\/code> 数组得到的是声明宽度（含未使用字节），两者口径不同。<\/p>\n<p><strong>内存布局推演<\/strong>。设 <code>char msg[8];<\/code> 存入 <code>&quot;Bye&quot;<\/code>：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>下标<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><\/tr><\/thead><tbody><tr><td>内容<\/td><td><code>B<\/code><\/td><td><code>y<\/code><\/td><td><code>e<\/code><\/td><td><code>\\0<\/code><\/td><td>未用<\/td><td>未用<\/td><td>未用<\/td><td>未用<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>strlen(msg)=3<\/code>；<code>sizeof(msg)=8<\/code>；若只看有效内容，占用 4 字节（含 null）。<\/p>\n<p><strong>为什么必须显式留 null<\/strong>：数组本身只提供连续字节，函数无法从数组对象上直接读出长度；没有结束标记，遍历就没有停止依据。C 用一个额外字节换得遍历规则的统一，代价是数组宽度必须为字符数加 1 预留位置。<\/p>\n<p><strong>与其他语言字符串的差别<\/strong>：带长度前缀的结构把长度存在独立字段，取长度是一次读取；C 字符串取长度要遍历到结尾。这一差别影响性能判断：频繁求长度的场景，不能假设 <code>strlen<\/code> 是常数时间操作；也影响安全判断：任何写入字符串的操作都要同时检查字符位置与 null 位置。<\/p>\n<p><strong>字符数组的两种用途<\/strong>：一是当字符串用，末尾带 null，交给字符串库函数；二是当字节缓冲区用，存任意二进制数据，不要求 null 结尾。同一块内存两种用途，差别只在是否遵守 null 终止约定；混用是错误来源。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：所有标准字符串函数都要求参数指向以 null 结尾的字符序列；自己手写遍历也应遵循同一规则。\n<\/li><li>\n边界一：字符数组可以存任意字符，但只有末尾带 null 才是合法字符串；不带 null 的字符数组只能按字节逐个访问，不能传给 <code>strlen<\/code> 一类函数。\n<\/li><li>\n边界二：向数组写入字符串时，目标宽度必须大于等于字符数加 1；只复制字符不留 null，是缓冲区溢出类错误的常见来源。\n<\/li><li>\n失败案例：用 <code>scanf(&quot;%s&quot;, name)<\/code> 读入超长内容，输入超过数组宽度时覆盖相邻内存，null 位置不可控。\n<\/li><li>\n边界三：字符串字面量属于只读区；用 <code>char *<\/code> 直接指向字面量并尝试修改，属于未定义行为，存放字符串应使用数组。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong><code>strlen<\/code> vs <code>sizeof<\/code><\/strong>：<code>strlen<\/code> 数 null 之前的字符个数，随内容变化；<code>sizeof<\/code> 给声明的字节宽度，是编译期确定的常量。对数组求 <code>sizeof<\/code> 得数组大小；对退化成指针的形参求 <code>sizeof<\/code> 只得指针宽度。\n<\/li><li>\n<strong>字符数组 vs 字符指针<\/strong>：数组名是数组对象标识，表达式中退化为首元素地址；指针变量可以重新指向别处，数组名不能被赋值。<code>char *p = &quot;Hi&quot;;<\/code> 中 <code>p<\/code> 指向只读字面量。\n<\/li><li>\n<strong>null 字符 vs 空字符串<\/strong>：空字符串 <code>&quot;&quot;<\/code> 占一个字节存 <code>&#x27;\\0&#x27;<\/code>，<code>strlen<\/code> 返回 0；它不是没有存储，而是有结束标记的最短字符串。\n<\/li><li>\n<strong><code>char<\/code> 数值 vs 字符<\/strong>：<code>char<\/code> 是窄整数，字符与编码可互转；字符串语义针对字符序列，算术语义针对编码值。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 的 <code>char<\/code> 类型宽度是数组元素大小的依据；c01 的头文件规则说明 <code>&lt;string.h&gt;<\/code> 提供 <code>strlen<\/code> 原型。后继：c04 的 <code>%s<\/code> 格式按 null 规则输出字符串；c09 的指针遍历把本章逐格前进的规则推广到任意元素类型；第 11 章的 <code>strcat<\/code>、<code>strcmp<\/code>、<code>strcpy<\/code> 都以 null 终止为前提。本章的遍历不变式是理解一切字符串操作的底层规则。<\/p>\n<p>写字符串相关代码时，容量、写入、读取三个环节分别核对：数组宽度按字符数加 1 预留；写入结束补 null；读取前确认已被合法字符串初始化。<code>strlen<\/code> 随内容变化，<code>sizeof<\/code> 随声明宽度固定，两个口径不能互相替代。原书第 4 章 §4.2.2 讲字符串使用，§4.2.3 讲 <code>strlen()<\/code>；每个示例都应先画内存表，再核对长度与容量两个数。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（字符数组、null 终止符与字符串长度）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：null 终止依赖链、字符串遍历推演与长度口径对照<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把字符串存对、读对，往回追四层：<\/p>\n<ol><li>\n元素层：字符串由 <code>char<\/code> 元素组成，每个元素一个字节，存字符编码。这是存储基础。\n<\/li><li>\n标记层：序列末尾追加一个数值 0 的 <code>&#x27;\\0&#x27;<\/code>，作为遍历停止依据；没有标记，字节序列没有边界。\n<\/li><li>\n遍历层：<code>strlen<\/code>、输出、复制、比较都从首元素出发逐格前进，遇到 null 停在标记位，不计入长度。\n<\/li><li>\n容量层：数组声明宽度必须至少为字符数加 1；写满字符不留 null，后续函数行为未定义。\n<\/ol>\n<p>依赖链方向：<code>char<\/code> 元素 → null 标记 → 统一遍历规则 → 容量预留。抽掉标记层，所有字符串函数失去停止条件；抽掉容量层，写入会覆盖相邻内存。<\/p>\n<p>再追一层为什么 C 选结束标记而不是长度前缀：结束标记让字符串字面量与字符数组共用同一套遍历规则，数组不必额外携带长度字段；代价是每次遍历都要扫到 null，且容量必须多留一个字节。这一取舍决定了 C 字符串库函数的统一接口：参数只传首地址，边界由结尾标记提供。<\/p>\n<h2>正向推导：遍历规则与长度公式<\/h2>\n<p><strong>遍历不变式<\/strong>。设数组首地址为 <span class=\"katex-inline\">p_0<\/span>，指针 <span class=\"katex-inline\">p<\/span> 从 <span class=\"katex-inline\">p_0<\/span> 出发，计数器 <span class=\"katex-inline\">n<\/span> 初始 0。每一步：<\/p>\n<ol><li>\n检查 <span class=\"katex-inline\">*p<\/span> 是否为 0（null）。若是，停止，返回 <span class=\"katex-inline\">n<\/span>。\n<\/li><li>\n若不是，<span class=\"katex-inline\">n<\/span> 加 1，<span class=\"katex-inline\">p<\/span> 前进一格（一个 <code>char<\/code> 宽度），回到第 1 步。\n<\/ol>\n<p>不变式：进入每一步时，<span class=\"katex-inline\">n<\/span> 等于 <span class=\"katex-inline\">[p_0,p)<\/span> 区间内的字符个数。停止时 <span class=\"katex-inline\">*p=0<\/span>，因此 <span class=\"katex-inline\">n<\/span> 等于 null 之前的字符总数。<\/p>\n<p><strong>长度与容量公式<\/strong>。若有效字符数为 <span class=\"katex-inline\">n<\/span>，合法数组宽度 <span class=\"katex-inline\">W<\/span> 满足 <span class=\"katex-inline\">W \\ge n+1<\/span>：<span class=\"katex-inline\">n<\/span> 个位置存字符，1 个位置存 null。<code>strlen<\/code> 返回 <span class=\"katex-inline\">n<\/span>；<code>sizeof(数组名)<\/code> 返回 <span class=\"katex-inline\">W<\/span>；数组中未使用字节不参与 <code>strlen<\/code> 计数。<\/p>\n<p><strong>字面量到数组的复制<\/strong>。编译器处理 <code>&quot;Amy&quot;<\/code> 时，在只读区生成 <code>A,m,y,\\0<\/code> 四个字节；用数组接收时，这四个字节被复制进数组，数组宽度由声明或字面量长度确定。字面量本身的 null 随复制一起进入数组。<\/p>\n<p><strong>遍历与指针的关系<\/strong>。<code>strlen<\/code> 内部按元素前进；因为 <code>char<\/code> 宽度为 1，指针加 1 对应地址加 1。换成其他元素类型，同一套遍历规则仍成立，只是步长换成对应元素宽度，这是 c09 指针算术的基础。<\/p>\n<p>推导依据：停止条件只看元素是否为 0；计数口径只统计 null 之前的字符；容量口径在编译期由声明确定，与运行期内容无关。<\/p>\n<h2>算例一：<code>&quot;Amy&quot;<\/code> 的内存布局与逐格计数<\/h2>\n<p>声明 <code>char name[40];<\/code>，执行 <code>scanf(&quot;%s&quot;, name);<\/code> 输入 <code>Amy<\/code>。<\/p>\n<p>内存布局（下标 0 起）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>下标<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4…39<\/th><\/tr><\/thead><tbody><tr><td>内容<\/td><td><code>A<\/code><\/td><td><code>m<\/code><\/td><td><code>y<\/code><\/td><td><code>\\0<\/code><\/td><td>未使用<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>strlen(name)<\/code> 推演：<\/p>\n<ol><li>\n<span class=\"katex-inline\">p<\/span> 指向下标 0，<code>*p=&#x27;A&#x27;<\/code>，非 null，<span class=\"katex-inline\">n=1<\/span>，前进到下标 1。\n<\/li><li>\n<code>*p=&#x27;m&#x27;<\/code>，非 null，<span class=\"katex-inline\">n=2<\/span>，前进到下标 2。\n<\/li><li>\n<code>*p=&#x27;y&#x27;<\/code>，非 null，<span class=\"katex-inline\">n=3<\/span>，前进到下标 3。\n<\/li><li>\n<code>*p=&#x27;\\0&#x27;<\/code>，停止，返回 <span class=\"katex-inline\">n=3<\/span>。\n<\/li><li>\n核对：<code>strlen(&quot;Amy&quot;)=3<\/code>；有效内容占 3 字节，含 null 共占 4 字节；数组声明宽度 40，<code>sizeof(name)=40<\/code>。\n<\/ol>\n<p>再核对两个易混点：字符 <code>&#x27;A&#x27;<\/code> 编码 65、<code>&#x27;m&#x27;<\/code> 编码 109、<code>&#x27;y&#x27;<\/code> 编码 121，都不是 0；null 编码 0，与数字字符 <code>&#x27;0&#x27;<\/code>（编码 48）位模式不同。若把 <code>&#x27;0&#x27;<\/code> 当 null 判断停止位置，遍历会继续往下走。<\/p>\n<h2>算例二：三种声明下 <code>strlen<\/code> 与 <code>sizeof<\/code> 对照<\/h2>\n<p><strong>声明 A<\/strong>：<code>char a[6] = &quot;Hello&quot;;<\/code><\/p>\n<ol><li>\n字符 <code>H,e,l,l,o<\/code> 加 null 共 6 字节，宽度刚好。\n<\/li><li>\n<code>strlen(a)=5<\/code>，<code>sizeof(a)=6<\/code>。\n<\/li><li>\n数组后 0 字节空余；再追加字符就越界。\n<\/ol>\n<p><strong>声明 B<\/strong>：<code>char b[] = &quot;Hi&quot;;<\/code><\/p>\n<ol><li>\n编译器按字面量长度加 1 定宽：<code>H,i,\\0<\/code>，宽度 3。\n<\/li><li>\n<code>strlen(b)=2<\/code>，<code>sizeof(b)=3<\/code>。\n<\/li><li>\n不显式写宽度时，数组大小由初始化内容决定。\n<\/ol>\n<p><strong>声明 C<\/strong>：<code>char c[10] = &quot;&quot;;<\/code><\/p>\n<ol><li>\n空字符串只存一个 null，<code>strlen(c)=0<\/code>，<code>sizeof(c)=10<\/code>。\n<\/li><li>\n它不是空存储：第 0 字节是 <code>&#x27;\\0&#x27;<\/code>，其余字节未使用。\n<\/li><li>\n遍历立即停止，计数 0。\n<\/ol>\n<p>对照结论：<code>strlen<\/code> 随内容变化，运行期计算；<code>sizeof<\/code> 随声明宽度变化，编译期确定。同一个数组上两个数经常不等，差值是预留与未使用的字节数。<\/p>\n<p>再看一个形参场景：函数定义 <code>void f(char arr[20])<\/code>，在函数内对 <code>arr<\/code> 求 <code>sizeof<\/code>，得到的是指针宽度（如 8 字节），不是 20。数组作形参时退化为首元素指针，原数组宽度信息在函数接口处丢失；要在函数内知道容量，需要额外传长度参数。<\/p>\n<h2>反事实推演：去掉 null 会怎样<\/h2>\n<p><strong>数组只存字符不存 null<\/strong>。<code>char s[3] = &quot;cat&quot;;<\/code> 没有结束标记。<code>strlen<\/code> 从 0 号元素读到 <code>c,a,t<\/code> 后，继续读下标 3、4……直到内存里偶然遇到一个 0 字节；返回值不可预测，输出 <code>%s<\/code> 同样把相邻字节当字符打印。反例后果：乱码、越界访问，严重时覆盖返回地址导致崩溃。<\/p>\n<p><strong>写入时只复制字符不留 null<\/strong>。手写复制循环逐字符搬运，结束后忘记补 <code>&#x27;\\0&#x27;<\/code>；目标数组此前内容不是 0，遍历位置取决于残留数据。这与漏写结束标记同源。<\/p>\n<p><strong>假设字符串自带长度字段<\/strong>。若每个数组额外存一个长度整数，遍历不必扫到结尾，但数组布局、传参规则都要跟着改；C 现状是用 null 标记换取统一接口，理解这一取舍才能解释库函数为什么只传首地址。<\/p>\n<h2>字符串遍历与其他数组遍历的对照<\/h2>\n<p>整数数组遍历通常按下标范围 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">n-1<\/span> 控制，长度 <span class=\"katex-inline\">n<\/span> 由外部传入；字符串遍历由结尾标记控制，不需要外部长度参数。两者的共同点是指针逐格前进，差别在停止条件：<\/p>\n<ol><li>\n整数数组：条件是下标是否落在声明范围内，越界即停。\n<\/li><li>\n字符串：条件是当前字符是否为 null，遇到标记即停。\n<\/li><li>\n若字符串缺少 null，遍历行为退化成无边界扫描，与整数数组漏写下界判断同类。\n<\/ol>\n<p>把这套对照搬到指针层面：<code>char <em>p = str;<\/code> 后 <code>p++<\/code> 每次移动一个字节；<code><\/em>p<\/code> 取当前字符；<code>p - str<\/code> 得到已走过的元素个数。<code>strlen<\/code> 的返回值正是这个差值。理解这一层，后面第 10 章把遍历推广到 <code>int<\/code>、<code>double<\/code> 数组时，只需把步长换成对应元素宽度，停止条件的写法不变。<\/p>\n<h2>越界与残留算例<\/h2>\n<p><strong>算例：短数组存长字面量<\/strong>。<code>char s[5] = &quot;Hello!&quot;;<\/code> 字面量有 6 个字符加 null 共 7 字节，数组只有 5 格。<\/p>\n<ol><li>\n编译期可能给出越界初始化警告；即使通过，数组内放不下结束标记。\n<\/li><li>\n调用 <code>strlen(s)<\/code> 时，读完 <code>H,e,l,l,o<\/code> 后继续读下标 5 以外的内存。\n<\/li><li>\n读到的下一个 0 字节位置不确定，返回值可能大于 5；输出时同样打印相邻字节。\n<\/li><li>\n修正方式：数组宽度至少为 7，或改用不显式定宽的初始化 <code>char s[] = &quot;Hello!&quot;;<\/code>。\n<\/ol>\n<p><strong>算例：未初始化数组与残留值<\/strong>。<code>char buf[20];<\/code> 未赋值就传给 <code>printf(&quot;%s&quot;, buf)<\/code>。<\/p>\n<ol><li>\n数组各字节是栈上残留内容，null 位置取决于上次使用该栈区留下的数据。\n<\/li><li>\n输出长度与内容每次运行可能不同；这与局部变量不自动初始化是同一规则。\n<\/li><li>\n合法做法：先写入带 null 的字符串，或显式把首字节置 <code>&#x27;\\0&#x27;<\/code> 得到空串。\n<\/ol>\n<p><strong>算例：<code>scanf<\/code> 读入超长词<\/strong>。<code>char name[10]; scanf(&quot;%s&quot;, name);<\/code> 输入超过 9 个字符。<\/p>\n<ol><li>\n<code>%s<\/code> 按空白分词，不检查目标宽度；超出部分写到数组后续内存。\n<\/li><li>\n结束标记被放到数组外，相邻变量、返回地址可能被覆盖。\n<\/li><li>\n稳妥写法用宽度限制 <code>%9s<\/code>，并在读取后核对返回值与字符串长度。\n<\/ol>\n<p>三个算例的共同结构：写入侧容量不足或未初始化，读取侧就失去可靠停止位置；null 终止规则要求写入与读取两侧都遵守同一容量公式。<\/p>\n<h2>长度口径在函数接口中的传递<\/h2>\n<p>数组作函数形参时，编译器把形参当作指向首元素的指针处理。这带来两个后果：<\/p>\n<ol><li>\n函数内 <code>sizeof(形参名)<\/code> 得到指针宽度，不是原数组宽度；原数组的声明大小没有随指针传进来。\n<\/li><li>\n函数内遍历字符串仍可依靠 null 停止；若要处理字节缓冲区，必须额外接收长度参数。\n<\/ol>\n<p>设计接口时据此分工：字符串函数只传首地址，边界交给 null；缓冲区函数同时传首地址与长度。混淆两类接口的典型错误是在函数内用 <code>sizeof<\/code> 推算容量，得到指针宽度后按错误上限写入。<\/p>\n<p>再看初始化与赋值的差别。<code>char b[] = &quot;Hi&quot;;<\/code> 是初始化，编译器在编译期按字面量定宽并复制字符；<code>char b[3]; b = &quot;Hi&quot;;<\/code> 是赋值，数组名不可被赋值，语法不成立。要把字面量放进已声明数组，使用复制函数逐字符搬运并补 null。初始化发生在编译期定宽，赋值发生在运行期写值，两者规则不同，不能互换写法。<\/p>\n<h2>常见手写遍历推演<\/h2>\n<p>手写打印字符串每个字符：<\/p>\n<pre class=\"lang-c\"><code>void print_str(const char *s)\n{\n    int i = 0;\n    while (s[i] != &#x27;\\0&#x27;)\n    {\n        putchar(s[i]);\n        i++;\n    }\n}<\/code><\/pre>\n<p>推演：进入循环时 <code>i<\/code> 是待检查下标；条件检查 <code>s[i]<\/code> 是否为 null；非 null 则输出并前进；遇到 null 退出。不变式：<code>s[0]<\/code> 到 <code>s[i-1]<\/code> 已输出。退出时 <code>s[i]==&#x27;\\0&#x27;<\/code>，全部有效字符处理完毕。若把条件写成 <code>s[i] != &#x27;0&#x27;<\/code>，数字字符 48 不是 0，停止位置错误；若漏写 <code>i++<\/code>，指针停在同一位置形成死循环。<\/p>\n<p>这段手写与 <code>strlen<\/code> 的差别只在动作：<code>strlen<\/code> 计数，本例输出；停止条件与前进规则一致。把动作换成复制、比较、拼接，骨架不变，这就是字符串库函数的统一结构。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>把 <code>sizeof<\/code> 当字符串长度<\/strong>。对 <code>char name[40]<\/code> 求长度写 <code>sizeof(name)<\/code>，得到 40 而不是名字字符数；复盘：长度走 <code>strlen<\/code>，容量才走 <code>sizeof<\/code>。函数形参上更要注意，<code>sizeof<\/code> 拿到指针宽度，不能反推原数组大小。<\/p>\n<p><strong>缓冲区宽度算成字符数<\/strong>。声明数组时按名字长度留位，漏掉 null 的一个字节；写入后结束标记落在数组外。复盘：容量 = 字符数 + 1，定义数组与复制前都按这个公式留位。<\/p>\n<p><strong>修改字符串字面量<\/strong>。<code>char *p = &quot;Hi&quot;; p[0] = &#x27;h&#x27;;<\/code> 字面量在只读区，修改行为未定义；需要可修改的字符串应声明为数组并复制字面量。<\/p>\n<p><strong>混淆 <code>&#x27;\\0&#x27;<\/code> 与 <code>&#x27;0&#x27;<\/code><\/strong>。判断结束写成比较字符 <code>&#x27;0&#x27;<\/code>，数字字符编码 48 不是 0，遍历不会在正确位置停止；判断 null 必须与数值 0 或 <code>&#x27;\\0&#x27;<\/code> 比较。<\/p>\n<h2>字符串容量与写入核对<\/h2>\n<p>合法字符串容量公式：宽度 <span class=\"katex-inline\">W \\ge n+1<\/span>，<span class=\"katex-inline\">n<\/span> 为有效字符数。写入前核对目标数组剩余位置：<\/p>\n<ol><li>\n初始化字面量：编译器按字面量长度加 1 定宽，不显式写宽度时最安全。\n<\/li><li>\n<code>scanf(&quot;%s&quot;, arr)<\/code>：用宽度限制如 <code>%9s<\/code>，对应 10 元素数组留 1 字节 null。\n<\/li><li>\n复制函数：目标宽度必须大于等于源字符串长度加 1；末尾补 null 是写入动作的一部分。\n<\/ol>\n<p><strong>短数组反例核对<\/strong>。<code>char s[4] = &quot;hello&quot;;<\/code> 字面量 5 字符加 null 共 6 字节，数组只 4 格；编译期可能警告，运行期遍历越界。修正：放宽数组或改 <code>char s[] = &quot;hello&quot;;<\/code>。<\/p>\n<p><strong>空串与单字符对照<\/strong>。<code>&quot;&quot;<\/code> 占 1 字节（<code>&#x27;\\0&#x27;<\/code>），<code>strlen=0<\/code>；<code>&quot;A&quot;<\/code> 占 2 字节（<code>&#x27;A&#x27;<\/code>、<code>&#x27;\\0&#x27;<\/code>），<code>strlen=1<\/code>。两者都必须有结束标记，差别在有无有效字符。<\/p>\n<h2>再推一层：null 规则怎样延伸到其他操作<\/h2>\n<p>字符串复制：把源数组字符逐个搬到目标数组，末尾必须补 null；拼接：在目标结尾找到 null，从该位置接续源内容；比较：两侧同步前进，遇到 null 且字符相等才判等。所有操作的停止条件都回到本章不变式。第 11 章的 <code>strcat<\/code>、<code>strncat<\/code>、<code>strcmp<\/code>、<code>strcpy<\/code> 只是在这条规则上叠加长度限制与比较逻辑。<\/p>\n<p>指针遍历视角下，字符数组与整数数组没有本质差别：都是首地址加步长逐格访问；差别只在字符序列多了一个结束标记，且元素宽度为 1。把本章规则与 c09 指针算术对照阅读，能看清&quot;遍历&quot;在不同类型上的统一形式。<\/p>\n<p>原书第 4 章 §4.2.1 说明 <code>char<\/code> 类型数组与 null 字符的关系，§4.2.3 给出 <code>strlen()<\/code> 的用法；阅读时应把每个示例的内存表画出来，先标字符再标 null，再核对 <code>strlen<\/code> 与 <code>sizeof<\/code> 两个口径。<\/p>\n<p>把本章规则落成三条可执行检查：声明数组时按&quot;字符数加 1&quot;留位；写入后确认末尾有 null；读取前确认数组已被合法字符串初始化。三条分别对应容量、写入、读取三个环节，任一环节缺失，遍历就失去边界依据。后续接触任何字符串库函数，先问它在哪里找 null、在哪里写 null，就能判断使用条件是否满足。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n不看公式，能否说出 <code>strlen<\/code> 每一步检查什么、计数什么、在哪停止？\n<\/li><li>\n存 <span class=\"katex-inline\">n<\/span> 个字符的合法数组至少需要多少元素？这个 1 字节留给谁？\n<\/li><li>\n<code>strlen<\/code> 与 <code>sizeof<\/code> 的口径差别在哪一个是运行期、哪一个是编译期？\n<\/li><li>\n形参里的数组为什么丢失原宽度信息？要在函数内知道容量该怎么办？\n<\/li><li>\n<code>&#x27;\\0&#x27;<\/code>、<code>&#x27;0&#x27;<\/code>、空字符串 <code>&quot;&quot;<\/code> 三者各占什么、编码是多少？\n<\/li><li>\n为什么不能通过字符指针修改指向的字面量？\n<\/ol>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n画出 <code>char msg[7] = &quot;sunny&quot;;<\/code> 的内存表，写出 <code>strlen(msg)<\/code> 与 <code>sizeof(msg)<\/code>。\n<\/li><li>\n函数形参 <code>char s[30]<\/code> 内 <code>sizeof(s)<\/code> 是多少？为什么不等于 30？\n<\/li><li>\n手写一个字符串复制循环，说明结束后必须补哪一个字节，不补会发生什么。\n<\/li><li>\n空字符串在数组里占几个字节？<code>strlen<\/code> 返回多少？\n<\/li><li>\n两个字符串比较时，两侧指针怎样同步前进，什么条件下判定相等？\n<\/ol><\/div><\/details>", "c04": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.194<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">字符数组、null 终止符与字符串长度<\/a><\/span><\/div><h1>printf/scanf 格式串解析与参数绑定<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch02（原书第 4 章 §4.4，PDF 第 194 页起）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><code>printf<\/code> 按格式串把后续参数转成字符序列输出，<code>scanf<\/code> 按格式串把输入字符解析后写入对应地址；格式串中普通字符原样处理，<code>%<\/code> 开头的转换说明规定下一个参数的类型、宽度与精度，参数按位置一一绑定。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>程序要把内部数值变成可读文本，也要把用户敲入的文本变回内部数值。困难在于数值的二进制存储与外部字符表示之间没有自动对应：整数要转成十进制数字序列，浮点要控制小数位数，字符串要按 null 边界输出。格式串机制用一条模板同时规定&quot;显示成什么样&quot;和&quot;取哪个参数&quot;。不理解绑定规则，常见错误有三类：转换说明与参数类型不匹配，输出乱码；<code>scanf<\/code> 漏写取地址符，值写不回变量；宽度、精度修饰符位置写错，对齐与小数位不符合预期。本章把格式解析过程与参数对应关系讲清，为第 8 章输入验证和第 13 章文件格式化 I/O 打基础。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>格式串<\/strong>：第一个参数，是字符序列。其中普通字符原样输出（<code>printf<\/code>）或要求原样匹配（<code>scanf<\/code>）；<code>%<\/code> 引入转换说明。<\/p>\n<p><strong>常用转换说明<\/strong>：<\/p>\n<ul><li>\n<code>%d<\/code>：十进制整数，对应 <code>int<\/code>（<code>printf<\/code> 取值，<code>scanf<\/code> 写 <code>int *<\/code>）。\n<\/li><li>\n<code>%u<\/code>：无符号十进制，对应 <code>unsigned int<\/code>。\n<\/li><li>\n<code>%f<\/code>：浮点，<code>printf<\/code> 对应 <code>double<\/code>（<code>float<\/code> 变参提升为 <code>double<\/code>），<code>scanf<\/code> 对应 <code>float *<\/code>。\n<\/li><li>\n<code>%lf<\/code>：<code>scanf<\/code> 读 <code>double<\/code>；<code>%ld<\/code> 读 <code>long<\/code>。\n<\/li><li>\n<code>%c<\/code>：单个字符。\n<\/li><li>\n<code>%s<\/code>：字符串，对应字符数组地址。\n<\/li><li>\n<code>%o<\/code>、<code>%x<\/code>：八进制、十六进制整数。\n<\/ul>\n<p><strong>修饰符<\/strong>：宽度如 <code>%10d<\/code> 规定最小字段宽度；精度如 <code>%.2f<\/code> 规定小数位数；<code>%m.nf<\/code> 同时给宽度与精度；<code>-<\/code> 表示左对齐，<code>0<\/code> 表示补前导零。<\/p>\n<p><strong>绑定方向<\/strong>：<code>printf<\/code> 从参数读出值，按说明格式化后写入输出流；<code>scanf<\/code> 从输入流解析字符，按说明换算后写入参数指向的内存。<code>scanf<\/code> 的整数参数必须是地址，所以写 <code>&amp;age<\/code>；字符串参数本身已是数组地址，不再加 <code>&amp;<\/code>。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-c\"><code>int age = 20;\ndouble weight = 62.5;\nchar name[40];\nscanf(&quot;%s %d&quot;, name, &amp;age);\nprintf(&quot;%s is %d years, %.1f kg\\n&quot;, name, age, weight);<\/code><\/pre>\n<p><strong>反例<\/strong>：<code>printf(&quot;%d&quot;, 3.14)<\/code> 用 <code>%d<\/code> 读 <code>double<\/code>，位模式按整数拆读，结果无意义；<code>scanf(&quot;%d&quot;, age)<\/code> 漏 <code>&amp;<\/code>，函数把整数值当地址写入，行为未定义。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>printf 解析过程<\/strong>。从格式串首字符扫描：<\/p>\n<ol><li>\n普通字符：直接复制到输出。\n<\/li><li>\n遇到 <code>%<\/code>：读完整个转换说明（含修饰符），取下一个参数，按说明类型解码并格式化，结果追加到输出。\n<\/li><li>\n重复直到格式串结束。参数与说明按位置对应：第 1 个说明配第 1 个额外参数，依次类推。\n<\/ol>\n<p><strong>scanf 解析过程<\/strong>。扫描格式串：普通字符要求输入流出现相同字符并跳过；转换说明从输入读取字符，按说明换算，结果写入对应地址。<code>%s<\/code> 跳过空白后读到下一个空白；<code>%d<\/code> 读数字序列并转成整数；<code>%c<\/code> 读取下一个字符，包括空白。<\/p>\n<p><strong>变参传递的依据<\/strong>。<code>printf<\/code>/<code>scanf<\/code> 接收可变参数，编译器不逐个核对类型；类型匹配全靠格式串说明与实参约定。这与普通函数原型检查不同：原型约束固定参数个数，变参部分只按格式串解释。因此说明写错时编译期未必报错，错误在运行期按错误宽度读内存。<\/p>\n<p><strong>宽度与精度的作用位置<\/strong>。宽度控制字段最小占用列数，不足补空格或零；精度对整数是最少位数，对浮点是小数位数。修饰符写在 <code>%<\/code> 与字母之间，顺序为标志、宽度、点、精度、长度修饰。<\/p>\n<p><strong>返回值的意义<\/strong>。<code>printf<\/code> 返回输出的字符个数；<code>scanf<\/code> 返回成功匹配并赋值的项数。检查返回值可以判断输入是否按预期读到：返回项数少于格式说明个数，说明部分输入缺失或类型不符，后续变量未被写入。把返回值纳入检查，是输入验证的第一步，原书第 8 章在此基础上处理残留字符与非法值。<\/p>\n<p><strong>格式串与字符串存储的衔接<\/strong>。<code>%s<\/code> 输出时从给定地址读到 null；<code>scanf<\/code> 写入数组时在末尾补 null。两侧共享 c03 的终止规则：数组容量不足，写入侧先溢出，读取侧随后越界。选说明符时既要管类型，也要管目标宽度。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：标准输出/输入的格式化交互；简单文本与数值互转。复杂解析应改用专门解析函数并配合输入验证。\n<\/li><li>\n边界一：类型必须与说明配套。<code>%d<\/code> 配 <code>int<\/code>、<code>%u<\/code> 配 <code>unsigned<\/code>、<code>%f<\/code> 在 <code>printf<\/code> 侧对应 <code>double<\/code>；配错属于未定义行为。\n<\/li><li>\n边界二：<code>scanf<\/code> 写数值变量必须传地址；传数组名不需要再加 <code>&amp;<\/code>，因为数组名已是首地址。\n<\/li><li>\n失败案例：<code>%s<\/code> 不检查目标宽度，读入超长词会溢出；用 <code>%9s<\/code> 一类宽度限制目标数组容量。\n<\/li><li>\n边界三：<code>scanf<\/code> 留下的换行或残留在缓冲区，会被下一个 <code>%c<\/code> 读到；混合数值与字符输入时要处理残留字符。\n<\/li><li>\n边界四：格式串本身是字符串，其中 <code>\\n<\/code>、<code>\\t<\/code> 是转义字符，输出换行与制表，不是普通反斜杠。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong><code>printf<\/code> 取值 vs <code>scanf<\/code> 写值<\/strong>：前者参数给值，后者参数给地址；方向相反，地址符要求不同。\n<\/li><li>\n<strong><code>%f<\/code> vs <code>%lf<\/code><\/strong>：<code>printf<\/code> 中 <code>float<\/code> 提升为 <code>double<\/code>，用 <code>%f<\/code>；<code>scanf<\/code> 读 <code>double<\/code> 用 <code>%lf<\/code>。两侧规则不对称，不能照搬。\n<\/li><li>\n<strong>宽度 vs 精度<\/strong>：宽度管整段字段占多少列，精度管小数位或最少数字位；<code>%10.2f<\/code> 是总宽 10、小数 2 位。\n<\/li><li>\n<strong>普通字符匹配 vs 空白匹配<\/strong>：<code>scanf<\/code> 格式串里的空格跳过输入空白；<code>%c<\/code> 不跳过空白，直接读下一字符。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 的类型宽度决定说明符选择；c03 的 null 规则是 <code>%s<\/code> 输出与停止的依据。后继：c05 的表达式结果经 <code>printf<\/code> 输出时按类型选说明符；第 8 章在格式输入之上做输入验证与缓冲区清理；第 13 章把同一套格式化函数扩展到文件流。本章的位置绑定规则，是理解一切变参格式化函数的基础。<\/p>\n<p>选说明符的顺序：先确定参数类型，再确定输出侧或输入侧方向，末尾补宽度与精度修饰。返回值检查输入是否读到足够项；复杂、可校验的输入不应硬塞给 <code>scanf<\/code>，先整行读入再解析是更稳的路线。原书第 4 章 §4.4.5 讲 <code>scanf()<\/code>，§4.4.6 讲 <code>*<\/code> 修饰符；对照示例时逐个说明符配参数，数清个数与类型。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（printf/scanf 格式串解析与参数绑定）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：格式串扫描依赖链、参数绑定推演与解析失败复盘<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把格式化输入输出用对，往回追四层：<\/p>\n<ol><li>\n表示层：内部数值是二进制位模式，外部交互是字符序列；两者之间必须有换算规则。\n<\/li><li>\n模板层：格式串用普通字符与转换说明混合写成，同时描述输出样子与参数对应关系。\n<\/li><li>\n绑定层：转换说明按出现次序与后续参数一一配对；说明规定类型，参数按该类型解释。\n<\/li><li>\n方向层：<code>printf<\/code> 从参数取值格式化到流，<code>scanf<\/code> 从流解析写入参数指向的内存；两侧地址要求相反。\n<\/ol>\n<p>依赖链方向：二进制与字符需要换算 → 格式串提供模板 → 说明与参数按位置绑定 → 按方向决定取值或写址。抽掉绑定层，说明符找不到对应参数；抽掉方向层，地址符用错方向，值写不回或读到错误内存。<\/p>\n<p>再追一层为什么用可变参数实现：格式化函数要支持任意个数、任意类型的混合输出，固定参数原型无法覆盖；标准库采用变参接口，把类型检查推迟到运行期按格式串解释。这一设计代价是编译期不核对类型，说明与实参必须由写代码的人保证一致。<\/p>\n<h2>正向推导：扫描与配对规则<\/h2>\n<p><strong>printf 扫描<\/strong>。指针从格式串开头移动：<\/p>\n<ol><li>\n字符不是 <code>%<\/code>：复制到输出流，指针前进。\n<\/li><li>\n字符是 <code>%<\/code>：继续读标志、宽度、精度、长度修饰，直到转换字母；这一段构成一个转换说明。\n<\/li><li>\n取下一个额外参数：按说明字母规定的类型，从参数存储位置读出值，格式化后追加到输出。\n<\/li><li>\n回到第 1 步，直到格式串结束。\n<\/ol>\n<p>配对规则：说明顺序与参数顺序一致，第 <span class=\"katex-inline\">k<\/span> 个说明配第 <span class=\"katex-inline\">k<\/span> 个额外参数。说明多于参数，缺参读取未定义；参数多于说明，多余参数被忽略。<\/p>\n<p><strong>scanf 扫描<\/strong>。指针同样移动：<\/p>\n<ol><li>\n普通字符：在输入流要求出现相同字符，匹配后跳过；格式串中的空白跳过输入中的任意空白序列。\n<\/li><li>\n转换说明：按说明读取输入字符，换算成目标类型，写入参数给出的地址。\n<\/li><li>\n<code>%s<\/code> 跳过前导空白，读到下一个空白为止；<code>%d<\/code> 读可选符号加数字序列；<code>%c<\/code> 读下一字符，含空白。\n<\/ol>\n<p><strong>类型配套依据<\/strong>。说明字母决定解码方式：<code>%d<\/code> 按 <code>int<\/code> 宽度与补码解释，<code>%u<\/code> 按无符号解释，<code>%f<\/code> 按浮点格式解释；<code>scanf<\/code> 侧再取该地址写入。类型与说明不符时，位模式被错误宽度或错误格式拆开，输出乱码或写入错误位置。<\/p>\n<p><strong>修饰符解析次序<\/strong>。<code>%<\/code> 之后依次可选：标志（<code>-<\/code>、<code>+<\/code>、<code>0<\/code> 等）、宽度整数、点与精度、长度修饰（<code>l<\/code>、<code>h<\/code> 等），末尾转换字母。解析时按这个次序读，写错位置会被当成普通字符或引发说明无效。<\/p>\n<h2>算例一：printf 参数配对逐格推演<\/h2>\n<p>语句：<\/p>\n<pre class=\"lang-c\"><code>int age = 20;\ndouble w = 62.5;\nchar name[] = &quot;Tom&quot;;\nprintf(&quot;%s: %d years, %.1f kg\\n&quot;, name, age, w);<\/code><\/pre>\n<p>输出推演：<\/p>\n<ol><li>\n扫描到 <code>%s<\/code>：取参数 <code>name<\/code>，输出字符串 <code>Tom<\/code>，遇到 null 停止。\n<\/li><li>\n扫描到 <code>: <\/code>：普通字符，输出冒号与空格。\n<\/li><li>\n扫描到 <code>%d<\/code>：取参数 <code>age=20<\/code>，转十进制序列 <code>20<\/code> 输出。\n<\/li><li>\n扫描到 <code> years, <\/code>：原样输出。\n<\/li><li>\n扫描到 <code>%.1f<\/code>：取参数 <code>w=62.5<\/code>，保留 1 位小数，输出 <code>62.5<\/code>。\n<\/li><li>\n扫描到 <code> kg\\n<\/code>：原样输出空格、<code>kg<\/code>，再换行。\n<\/li><li>\n最终输出：<code>Tom: 20 years, 62.5 kg<\/code>。\n<\/ol>\n<p>核对配对：<code>%s<\/code> 配 <code>name<\/code>，<code>%d<\/code> 配 <code>age<\/code>，<code>%.1f<\/code> 配 <code>w<\/code>；顺序错位一位，后面全部串位。假设把参数写成 <code>printf(&quot;%s: %d\\n&quot;, age, name)<\/code>：<code>%s<\/code> 会把 <code>age<\/code> 的整数值当地址去读字符串，属于严重错误，而不是显示成数字 20。<\/p>\n<p>再看宽度修饰：<code>printf(&quot;[%10d]\\n&quot;, 42)<\/code>。<code>%10d<\/code> 规定最小 10 列，<code>42<\/code> 占 2 列，左侧补 8 个空格，输出 <code>[        42]<\/code>；<code>%-10d<\/code> 改为左对齐，输出 <code>[42        ]<\/code>；<code>%010d<\/code> 用前导零补足，输出 <code>[0000000042]<\/code>。宽度只补不足，超长数字不会被截断。<\/p>\n<h2>算例二：scanf 解析与写入推演<\/h2>\n<p>输入行为 <code>Amy 130<\/code>，语句：<\/p>\n<pre class=\"lang-c\"><code>char name[40];\nint age;\nscanf(&quot;%s %d&quot;, name, &amp;age);<\/code><\/pre>\n<p>解析推演：<\/p>\n<ol><li>\n<code>%s<\/code> 跳过前导空白，读 <code>A,m,y<\/code>，遇空格停止；字符复制进 <code>name<\/code>，末尾补 <code>&#x27;\\0&#x27;<\/code>。\n<\/li><li>\n格式串空格跳过输入中残留的空格。\n<\/li><li>\n<code>%d<\/code> 读 <code>1,3,0<\/code>，转成整数 130，写入 <code>age<\/code> 所在地址。\n<\/li><li>\n返回成功匹配项数 2；<code>name<\/code> 存 <code>Amy<\/code>，<code>age=130<\/code>。\n<\/ol>\n<p>地址方向核对：<code>%s<\/code> 的参数 <code>name<\/code> 是数组首地址，函数把字符写入该地址起的空间；<code>%d<\/code> 的参数必须是 <code>int *<\/code>，所以写 <code>&amp;age<\/code> 给出变量地址。若写成 <code>scanf(&quot;%d&quot;, age)<\/code>，传进去的是 <code>age<\/code> 当前值（未初始化），函数按这个不确定值写内存，行为未定义。<\/p>\n<p>再看字符读取残留。紧接上面输入后执行 <code>scanf(&quot;%c&quot;, &amp;ch)<\/code>：输入缓冲里 <code>130<\/code> 之后可能残留换行符，<code>%c<\/code> 不跳过空白，直接把换行读进 <code>ch<\/code>，而不是读到下一个可见字符。要读可见字符，需在格式串前加空格跳过空白，或先清空缓冲区残留。<\/p>\n<h2>反事实推演：改掉绑定条件会怎样<\/h2>\n<p><strong>去掉类型配套检查<\/strong>：假设编译器不核对说明与实参。<code>printf(&quot;%d&quot;, 3.14)<\/code> 会按 <code>int<\/code> 宽度拆读 <code>double<\/code> 的位模式；<code>double<\/code> 通常 8 字节，<code>int<\/code> 按 4 字节解释，得到无意义整数，其余字节错位。这说明类型配套不是形式要求，而是解码规则的前提。<\/p>\n<p><strong>scanf 数值参数不传地址<\/strong>：见上，函数把值当地址写入；若去掉&quot;必须传地址&quot;这条规则，就无法区分取值与写址参数，接口失去方向。<\/p>\n<p><strong>格式串普通字符不做匹配<\/strong>：若 <code>scanf<\/code> 跳过所有普通字符，输入分隔符无法被校验，<code>12,34<\/code> 与 <code>12 34<\/code> 会被当成同一输入；普通字符匹配正是格式校验的一部分。<\/p>\n<h2>说明符与类型配对对照推演<\/h2>\n<p>把常见说明符按输出侧、输入侧两列核对：<\/p>\n<ol><li>\n<code>%d<\/code>：输出侧取 <code>int<\/code>，输入侧写 <code>int *<\/code>；对应有符号十进制整数。\n<\/li><li>\n<code>%u<\/code>：输出侧取 <code>unsigned int<\/code>，输入侧写 <code>unsigned int *<\/code>；无符号十进制。\n<\/li><li>\n<code>%f<\/code>：输出侧取 <code>double<\/code>（<code>float<\/code> 变参提升），输入侧写 <code>float *<\/code>；单精度浮点。\n<\/li><li>\n<code>%lf<\/code>：输出侧在现代实现中与 <code>%f<\/code> 等价，输入侧写 <code>double *<\/code>；双精度浮点。\n<\/li><li>\n<code>%ld<\/code>：输出侧取 <code>long<\/code>，输入侧写 <code>long *<\/code>；长整数。\n<\/li><li>\n<code>%c<\/code>：输出侧取字符，输入侧写 <code>char *<\/code>；读取不跳过空白。\n<\/li><li>\n<code>%s<\/code>：输出侧取字符数组地址，输入侧写字符数组地址；读到空白停止。\n<\/ol>\n<p>核对方法：先看说明字母确定类型，再看函数方向确定传值还是传址。两侧不对称的典型是浮点：输出侧 <code>float<\/code> 已提升为 <code>double<\/code>，输入侧仍按目标类型取指针；记混就会按错误宽度解析。<\/p>\n<p>再看长度修饰与类型宽度的关系。<code>%h d<\/code> 对应 <code>short<\/code>，<code>%ld<\/code> 对应 <code>long<\/code>，<code>%lld<\/code> 对应 <code>long long<\/code>；修饰符把说明与更窄或更宽的整数类型绑定。类型宽度来自 c02 的位宽结论，说明符只是把该宽度告诉格式化函数。<\/p>\n<h2>边界输入与残留字符算例<\/h2>\n<p><strong>算例：数值后紧跟字符<\/strong>。输入行为 <code>130A<\/code>，先 <code>scanf(&quot;%d&quot;, &amp;age)<\/code> 再 <code>scanf(&quot;%c&quot;, &amp;ch)<\/code>。<\/p>\n<ol><li>\n<code>%d<\/code> 读 <code>1,3,0<\/code>，留下 <code>A<\/code> 在缓冲。\n<\/li><li>\n<code>%c<\/code> 不跳过空白，读到的下一字符是 <code>A<\/code>，<code>ch=&#x27;A&#x27;<\/code>。\n<\/li><li>\n若预期读下一行首字符，残留处理不足会读到意料之外的字符。\n<\/li><li>\n修正：读字符前在格式串写空格 <code>scanf(&quot; %c&quot;, &amp;ch)<\/code>，跳过任意前导空白；或读完数值后循环读到换行。\n<\/ol>\n<p><strong>算例：类型不匹配的输出<\/strong>。语句 <code>printf(&quot;price=%d\\n&quot;, 19.99);<\/code>。<\/p>\n<ol><li>\n<code>%d<\/code> 按 <code>int<\/code> 宽度读取参数位置；<code>19.99<\/code> 是 <code>double<\/code>，占 8 字节。\n<\/li><li>\n位模式被按整数规则拆出，显示为一个与 19.99 无关的整数。\n<\/li><li>\n修正：类型与说明配套，写 <code>%f<\/code> 或 <code>%.2f<\/code>。\n<\/ol>\n<p><strong>算例：宽度限制防溢出<\/strong>。<code>char name[12];<\/code> 用 <code>scanf(&quot;%11s&quot;, name);<\/code>。<\/p>\n<ol><li>\n<code>%11s<\/code> 最多读 11 个非空白字符，第 12 字节留 null。\n<\/li><li>\n输入更长词时多余字符留在缓冲，不覆盖数组后续内存。\n<\/li><li>\n宽度 = 数组宽度减 1，与 c03 的容量公式一致。\n<\/ol>\n<p>三个算例分别覆盖残留字符、类型错配、容量限制；共同点是格式串规则与类型、容量规则必须同时满足。<\/p>\n<h2>返回值与错误处理推演<\/h2>\n<p><code>scanf<\/code> 返回成功完成赋值的项数；这个返回值是判断输入是否合法的第一道依据。<\/p>\n<ol><li>\n格式串有 <span class=\"katex-inline\">k<\/span> 个转换说明，返回值等于成功匹配并写入的个数。\n<\/li><li>\n返回 <span class=\"katex-inline\">k<\/span>：全部项读到，变量已被赋值。\n<\/li><li>\n返回小于 <span class=\"katex-inline\">k<\/span>：部分输入缺失、类型不符或流结束；未成功赋值的变量保持原值，不能当作已读入使用。\n<\/li><li>\n返回 <code>EOF<\/code>：流结束或读取失败，与 0 个匹配要区分处理。\n<\/ol>\n<p>推演一个失败场景：<code>scanf(&quot;%d %d&quot;, &amp;a, &amp;b)<\/code> 输入 <code>abc<\/code>。<code>%d<\/code> 读不到数字，返回 0；<code>a<\/code>、<code>b<\/code> 都未被写入。若程序继续按已读入计算，就用到未初始化值。正确流程：检查返回值是否等于 2，不等则提示重输，并把缓冲残留字符清掉。<\/p>\n<p><code>printf<\/code> 返回输出字符个数；写日志或核对输出长度时可用。格式串本身出错（如无效说明符）属于未定义行为，编译期不报错，运行期表现依赖实现。把返回值检查纳入输入流程，是第 8 章输入验证的起点：先确认读到几个合法值，再进入换算与计算。<\/p>\n<p>再看格式串中的转义与普通字符。<code>\\n<\/code> 是换行、<code>\\t<\/code> 是制表、<code>\\\\<\/code> 才是反斜杠；<code>%%<\/code> 输出一个百分号。若要在文本里写 <code>%<\/code> 而它出现在格式串中，必须写成 <code>%%<\/code>，否则编译器把后续字符当成无效说明符。普通字符在 <code>scanf<\/code> 中要求输入匹配，在 <code>printf<\/code> 中原样输出；同一字符在两个方向上的角色不同，配对时分别处理。<\/p>\n<h2>格式串扫描的状态迁移<\/h2>\n<p>把格式串解析看成状态迁移：普通状态下逐字符复制或匹配；读到 <code>%<\/code> 进入说明符状态，依次吸收标志、宽度、精度、长度修饰，遇到转换字母回到普通状态。状态边界清楚，才能判断一个 <code>%<\/code> 后哪些字符属于修饰、哪些属于普通文本。<\/p>\n<ol><li>\n普通状态：字符非 <code>%<\/code>，按方向处理（输出复制、输入匹配）。\n<\/li><li>\n说明符状态：<code>%<\/code> 之后先读可选标志（<code>-<\/code>、<code>+<\/code>、空格、<code>0<\/code>、<code>#<\/code>），再读宽度整数，再读 <code>.<\/code> 与精度，再读长度修饰（<code>hh<\/code>、<code>h<\/code>、<code>l<\/code>、<code>ll<\/code>、<code>L<\/code>、<code>z<\/code> 等），末尾转换字母结束。\n<\/li><li>\n回到普通状态，继续扫描剩余字符。\n<\/ol>\n<p>按这条迁移核对无效说明符：修饰符顺序写错，会被解析成非预期说明；<code>%%<\/code> 在普通状态输出一个百分号。格式串本身是 <code>char<\/code> 数组内容，转义字符在进入解析前已由编译器转换为对应控制字符。<\/p>\n<p>再核对参数个数与说明个数的关系：说明多于参数，缺参读取未定义；参数多于说明，多余实参被忽略但仍按规则求值。写代码时把格式串说明与实参列成两列对照，个数类型逐行核对，是最直接的防错动作。<\/p>\n<h2>格式符与类型配套核对表<\/h2>\n<p>按输出侧与输入侧核对常见配套：<\/p>\n<ol><li>\n<code>%d<\/code>：输出 <code>int<\/code>，输入 <code>int *<\/code>；有符号十进制。\n<\/li><li>\n<code>%u<\/code>：输出 <code>unsigned int<\/code>，输入 <code>unsigned int *<\/code>。\n<\/li><li>\n<code>%ld<\/code>/<code>%lld<\/code>：长整数对应 <code>long<\/code>/<code>long long<\/code>。\n<\/li><li>\n<code>%f<\/code>：输出取 <code>double<\/code>，输入写 <code>float <em><\/code>；<code>%lf<\/code> 输入写 <code>double <\/em><\/code>。\n<\/li><li>\n<code>%c<\/code>：读下一字符，不跳过空白；<code>%s<\/code>：读非空白序列，写字符数组地址。\n<\/li><li>\n<code>%x<\/code>/<code>%o<\/code>：十六进制、八进制整数；宽度修饰符作用于字段最小列数。\n<\/ol>\n<p>核对顺序：先看说明字母定类型，再看函数方向定传值还是传址，末尾补宽度精度。配错类型时编译期未必拦截，运行期按错误宽度读内存，现象多为乱码或写错位；这类问题回到配套表逐项对照最直接。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>说明与参数错位<\/strong>。漏写一个参数或多写一个说明，后续全部串位；复盘：写完格式串逐个对照说明与参数，数清个数与类型。<\/p>\n<p><strong><code>%s<\/code> 不设宽度<\/strong>。<code>char name[10]; scanf(&quot;%s&quot;, name);<\/code> 输入超过 9 字符即溢出；复盘：按数组容量写 <code>%9s<\/code>，预留 null 位置。<\/p>\n<p><strong>混淆 <code>%f<\/code> 与 <code>%lf<\/code><\/strong>。<code>scanf<\/code> 读 <code>double<\/code> 用 <code>%lf<\/code>，误写 <code>%f<\/code> 会按 <code>float<\/code> 宽度解析；<code>printf<\/code> 输出 <code>double<\/code> 用 <code>%f<\/code>，两边规则不对称，分别记忆。<\/p>\n<p><strong>残留换行被 <code>%c<\/code> 读取<\/strong>。混合数值与字符输入时，上一次输入的换行留在缓冲，<code>%c<\/code> 直接读走；复盘：读字符前在格式串加空格，或显式排掉残留字符。<\/p>\n<p><strong>把转义字符当普通字符<\/strong>。格式串里 <code>\\n<\/code> 是换行、<code>\\t<\/code> 是制表；想输出反斜杠本身要写 <code>\\\\<\/code>。漏看转义会导致输出换行位置与预期不符。<\/p>\n<h2>再推一层：格式化函数与类型系统的分工<\/h2>\n<p>类型检查在编译期覆盖固定参数；变参部分靠格式串在运行期解释。理解这一分工，就能解释为什么标准库字符串、文件 I/O 函数也遵循同一模式：<code>fprintf<\/code>、<code>fscanf<\/code> 多一个流参数，说明与绑定规则不变。第 13 章处理文件时，把标准输出/输入换成文件指针，扫描与配对过程完全一致。<\/p>\n<p>反过来，复杂输入不应用 <code>scanf<\/code> 硬解析：带分隔符、可校验格式、需要容错的输入，应整行读入后再用解析函数拆分；<code>scanf<\/code> 擅长简单数值与词法转换，不擅长严格格式校验。这条边界与第 8 章输入验证衔接：先读入字符流，判断合法性，再换算数值，残留字符单独清理。<\/p>\n<p>原书第 4 章 §4.4.3 列出 <code>printf<\/code>/<code>scanf<\/code> 的转换说明修饰符表，§4.4.4 解释转换说明的意义；阅读时应把每个说明符对应到参数类型，而不是背字母表。§4.4.6 的 <code>*<\/code> 修饰符用参数指定宽度或精度，属于同一绑定规则的扩展：宽度也可以由参数提供，仍按位置配对。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n能否按顺序说出 <code>printf<\/code> 扫描格式串时普通字符与转换说明各做什么？\n<\/li><li>\n<code>printf<\/code> 与 <code>scanf<\/code> 在参数方向上有什么相反要求？地址符各自怎么写？\n<\/li><li>\n<code>%f<\/code> 在输出侧与输入侧分别对应什么类型？为什么两侧不对称？\n<\/li><li>\n<code>%s<\/code> 为什么不需要在数组名前再加 <code>&amp;<\/code>？\n<\/li><li>\n混合数值与字符输入时，残留换行怎样影响 <code>%c<\/code>？\n<\/li><li>\n宽度与精度各控制哪一段？<code>%10.2f<\/code> 两个数字分别管什么？\n<\/ol>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出语句 <code>printf(&quot;%-5s|%3d|%.2f\\n&quot;, &quot;ab&quot;, 7, 3.14159)<\/code> 的输出，并说明每个修饰符的作用。\n<\/li><li>\n<code>scanf(&quot;%d,%d&quot;, &amp;a, &amp;b)<\/code> 输入 <code>12,34<\/code> 与 <code>12 34<\/code>，两种情况下匹配结果有何不同？\n<\/li><li>\n为什么变参函数不能在编译期核对参数类型？这条代价由哪条规则补偿？\n<\/li><li>\n数组宽度为 12，用 <code>scanf<\/code> 读字符串应写什么格式说明？为什么留 1 字节给 null？\n<\/li><li>\n格式串中一个空格在 <code>scanf<\/code> 里起什么作用？<code>%c<\/code> 与 <code>%s<\/code> 对空白的处理差别在哪？\n<\/ol><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.239<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">基本数据类型、位宽与整数取值范围<\/a><\/span><\/div><h1>运算符优先级、求值顺序与类型转换<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch02（原书第 5 章 §5.2–5.5，PDF 第 239 页起）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>表达式由运算符与操作数组成；优先级规定不同运算符谁先结合，结合性规定同级运算符从哪一侧分组；混合类型运算时窄类型按层次提升为宽类型，赋值时再按目标类型收窄。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>写一条含多个运算符的语句，困难在于结果依赖计算次序，而书写次序不等于计算次序。不掌握优先级与结合性，同一表达式可以被读出多种分组；不掌握类型转换，整数除法、浮点混合运算、字符提升的结果都会判断错。具体问题有三类：一是 <code>a + b * c<\/code> 这类混合乘加谁先算；二是 <code>x = y = z<\/code> 这类连续赋值从哪侧开始；三是 <code>7 / 2<\/code>、<code>7.0 / 2<\/code>、<code>&#x27;A&#x27; + 1<\/code> 各按什么类型得到什么结果。本章把表达式分组规则与转换方向讲清，第 6 章循环条件、第 7 章分支条件都建立在这套求值规则上。<\/p>\n<p>读表达式时常见的误判来自把书写顺序当成计算顺序。代码从左向右写，运算却按优先级、结合性分组；换行与缩进不改变分组。判断一条表达式是否可读，先把它还原成分组树，再看每个叶子的类型，末尾沿树向上求值。这个顺序与编译器处理表达式的次序一致。<\/p>\n<p>类型转换还要区分三个时点：字面量生成时确定自身类型；运算前按层次提升；赋值时按左值类型收窄。把三个时点混在一起，就会把&quot;<code>7/2<\/code> 先截断再提升&quot;误判成&quot;先提升再除&quot;，得到错误的 3.5。<\/p>\n<p><strong>表达式与语句的分界<\/strong>。表达式求出一个值；语句以分号结束，包含表达式语句、声明语句、分支与循环语句。复合表达式可以作为条件、实参或返回值出现；理解分组规则后，读条件表达式与读算术表达式用同一套次序。<\/p>\n<p><strong>副作用与序列点<\/strong>。赋值、自增、自减都产生副作用；相邻序列点之间不要对同一变量多次修改。<code>&amp;&amp;<\/code>、<code>||<\/code>、<code>?:<\/code>、逗号运算符内部有序列点，普通算术运算符不保证操作数求值顺序。需要固定执行次序时，拆成独立语句比依赖未指定顺序可靠。<\/p>\n<p><strong>读表达式的顺序<\/strong>：先还原分组树，再核对叶子类型，末尾沿树向上求值；与编译器处理次序一致，避免按书写直觉猜结果。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>表达式<\/strong>：由运算符和操作数组成、能求出一个值的组合；语句以分号结束，表达式加上分号构成表达式语句。<\/p>\n<p><strong>基本算术运算符<\/strong>：<code>+<\/code>、<code>-<\/code>、<code>*<\/code>、<code>/<\/code>、<code>%<\/code>（求模）；<code>=<\/code> 赋值；一元正负号改变单个操作数符号。<\/p>\n<p><strong>自增自减<\/strong>：<code>++<\/code> 加 1、<code>--<\/code> 减 1；前置 <code>++x<\/code> 返回加 1 后的新值，后置 <code>x++<\/code> 返回加 1 前的旧值，副作用在序列点前完成。<\/p>\n<p><strong>优先级分组（由高到低概览）<\/strong>：一元正负与自增自减 → 乘除模 → 加减 → 移位 → 关系比较 → 相等判断 → 位逻辑 → 逻辑与 → 逻辑或 → 条件运算符 → 赋值与复合赋值。同级再按结合性分组。<\/p>\n<p><strong>结合性<\/strong>：左结合从左向右分组（多数二元运算符），右结合从右向左分组（赋值、一元运算符、条件运算符）。<\/p>\n<p><strong>类型提升<\/strong>：运算前，<code>char<\/code>、<code>short<\/code> 先提升为 <code>int<\/code>；<code>int<\/code> 与 <code>unsigned<\/code> 运算时 <code>int<\/code> 转 <code>unsigned<\/code>；整数与 <code>double<\/code> 运算时整数转 <code>double<\/code>。提升方向是向更宽、精度更高的类型。<\/p>\n<p><strong>显式转换<\/strong>：<code>(类型) 表达式<\/code> 把结果显式转为指定类型；括号转换不改变被转换对象本身，只产生一个临时转换值。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-c\"><code>int a = 7, b = 2;\ndouble r = (double)a / b;   /* 3.5 */\nint m = a % b;              /* 1 */<\/code><\/pre>\n<p><strong>反例<\/strong>：以为 <code>7 / 2<\/code> 得 3.5；两侧都是整数，先做整数除法得 3，再谈后续提升。以为 <code>x = y = 0<\/code> 从左向右赋值；右结合下先算 <code>y = 0<\/code>，再把结果赋给 <code>x<\/code>。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>分组推导<\/strong>。给定表达式，先按优先级把高优先级运算符与相邻操作数圈成组；同级按结合性确定分组方向；分组完成后每组先求值，再按组间运算符继续算。以 <code>a + b <em> c<\/code> 为例：<code><\/em><\/code> 优先级高于 <code>+<\/code>，先圈 <code>b * c<\/code>，再加到 <code>a<\/code>。<\/p>\n<p><strong>结合性推导<\/strong>。以连续赋值 <code>x = y = z<\/code> 为例：<code>=<\/code> 右结合，先算右侧 <code>y = z<\/code>，其结果再赋给 <code>x<\/code>；若按左结合，次序相反但赋值语义相同，这条规则在多重赋值、复合赋值中决定分组。<\/p>\n<p><strong>整数除法推导<\/strong>。两侧都是整数时，除法截断小数部分，向零取整：<code>7 / 2 = 3<\/code>，<code>-7 / 2 = -3<\/code>；求模结果符号与被除数一致。只要有一侧是浮点，另一侧先提升为浮点，除法按浮点算。<\/p>\n<p><strong>提升链推导<\/strong>。<code>&#x27;A&#x27; + 1<\/code>：<code>char<\/code> 先提升 <code>int<\/code>，编码 65 加 1 得 66；<code>int + double<\/code>：<code>int<\/code> 转 <code>double<\/code>，按浮点相加；赋值给 <code>float<\/code> 变量时，结果再按 <code>float<\/code> 精度收窄。提升发生在运算前，收窄发生在赋值时，两个方向不能混。<\/p>\n<p><strong>优先级与求值顺序的区别<\/strong>。优先级定分组，不定操作数内部的求值先后；<code>&amp;&amp;<\/code>、<code>||<\/code>、<code>?:<\/code>、逗号运算符有专门的次序保证，其他运算符的操作数求值顺序由实现决定。不要依赖未指定的次序安排副作用。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：普通算术表达式、条件表达式、赋值语句；复杂表达式用括号显式分组，减少对优先级记忆的依赖。\n<\/li><li>\n边界一：有符号整数溢出属未定义行为；无符号按模回绕。表达式安排类型前先判断上界。\n<\/li><li>\n边界二：自增自减在同一表达式里对同一变量多次副作用，次序未指定，结果不可移植；清晰写法是把副作用拆成独立语句。\n<\/li><li>\n失败案例：把 <code>*<\/code> <code>/<\/code> <code>%<\/code> 与 <code>+<\/code> <code>-<\/code> 混排时漏算优先级，先加后乘，结果偏离。\n<\/li><li>\n边界三：关系与逻辑运算结果为 <code>int<\/code> 0 或 1；比较表达式可直接作为循环或分支条件。\n<\/li><li>\n边界四：<code>sizeof<\/code> 是运算符不是函数，求类型宽度时括号可省于单个变量，求类型名宽度必须带括号。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>优先级 vs 结合性<\/strong>：优先级解决跨级谁先算；结合性解决同级谁先分组。两者都不是操作数求值顺序的保证。\n<\/li><li>\n<strong>隐式提升 vs 显式转换<\/strong>：提升自动发生在运算前；显式转换是写在代码里的临时类型变换，目的是改变除法或赋值的目标类型。\n<\/li><li>\n<strong>整数除法 vs 浮点除法<\/strong>：差别在两侧类型，不在字面量形状；<code>5 / 2<\/code> 是整数除法，<code>5.0 / 2<\/code> 是浮点除法。\n<\/li><li>\n<strong>前置 vs 后置自增<\/strong>：返回值不同（新值/旧值），副作用完成时机相同；在独立语句里两者等价，嵌在表达式右侧才有差别。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 的类型宽度与取值范围是提升链与溢出判断的依据；c01 的编译期类型检查覆盖表达式类型匹配。后继：c06 的循环条件、c07 的分支条件与短路求值都按本章分组规则解释；c08 函数实参按本章提升规则传递；c09 指针算术的步长计算以类型宽度为参数。本章规则是读条件表达式与写混合运算的底层语法依据。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（运算符优先级、求值顺序与类型转换）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：优先级依赖链、表达式分组推演与类型转换链<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把表达式算对，往回追四层：<\/p>\n<ol><li>\n操作数层：每个操作数有确定类型与值；类型来自声明或字面量后缀。\n<\/li><li>\n分组层：优先级把高优先级运算符与操作数圈成组，结合性决定同级分组方向。\n<\/li><li>\n求值层：每组先求值，再按组间运算符合并；有专门次序保证的运算符除外，操作数内部次序未指定。\n<\/li><li>\n转换层：运算前窄类型提升为宽类型，赋值时按目标类型收窄；溢出按有无符号区分后果。\n<\/ol>\n<p>依赖链方向：操作数有类型 → 规则定分组 → 分组后求值 → 转换贯穿运算与赋值。抽掉分组层，同一串符号读出多种计算顺序；抽掉转换层，除法与混合运算结果无法预判。<\/p>\n<p>再追一层为什么标准不把操作数求值顺序全部写死：给编译器留出调度优化空间，只要不违反有次序保证的运算符规则。这决定了代码不能依赖 <code>f(x) + g(x)<\/code> 里先调哪个函数；要固定次序，就拆成独立语句。<\/p>\n<h2>正向推导：分组与求值规则<\/h2>\n<p><strong>优先级圈组<\/strong>。从最高优先级开始：一元运算符（正负、<code>++<\/code>、<code>--<\/code>、<code>sizeof<\/code>）先结合；接着是 <code>*<\/code> <code>/<\/code> <code>%<\/code>；再次 <code>+<\/code> <code>-<\/code>；然后移位、关系、相等、位逻辑；逻辑与高于逻辑或；条件运算符与赋值在低优先级层。跨级表达式先把高优先级子表达式圈出。<\/p>\n<p><strong>结合性分组<\/strong>。二元算术、关系、逻辑运算符左结合：<code>a - b - c<\/code> 按 <code>(a - b) - c<\/code> 分组；赋值、一元、条件运算符右结合：<code>a = b = c<\/code> 按 <code>a = (b = c)<\/code> 分组。结合性只在同级之间起作用。<\/p>\n<p><strong>求值顺序的保证范围<\/strong>。<code>&amp;&amp;<\/code>、<code>||<\/code>、<code>?:<\/code>、逗号运算符保证左操作数先算，右侧按需执行；其余运算符的操作数求值顺序未指定。副作用在序列点结束前落地：相邻序列点之间不要对同一变量多次修改。<\/p>\n<p><strong>提升层次<\/strong>。整数提升：<code>char<\/code>、<code>short<\/code> → <code>int<\/code>；常规算术转换：若一侧 <code>double<\/code>，另一侧转 <code>double<\/code>；否则一侧 <code>unsigned long long<\/code> 时另一侧随之提升；依次按宽度与符号层次对齐。赋值转换：右侧表达式求值后转左侧变量类型，超范围按收窄或回绕规则处理。<\/p>\n<p><strong>截断方向<\/strong>。整数除法向零取整：<code>7/2=3<\/code>，<code>-7/2=-3<\/code>；求模满足 <code>(a/b)*b + a%b = a<\/code>。浮点不精确是尾数舍入，与整数截断不是同一机制。<\/p>\n<h2>算例一：混合表达式分组逐格推演<\/h2>\n<p>取表达式：<\/p>\n<pre class=\"lang-c\"><code>int a = 7, b = 2, c = 3;\nint x = a + b * c - a % b;<\/code><\/pre>\n<ol><li>\n优先级：先圈 <code>b <em> c = 2 <\/em> 3 = 6<\/code>；再圈 <code>a % b = 7 % 2 = 1<\/code>。\n<\/li><li>\n代入原式：<code>7 + 6 - 1<\/code>。\n<\/li><li>\n<code>+<\/code> <code>-<\/code> 同级左结合：先 <code>7 + 6 = 13<\/code>，再 <code>13 - 1 = 12<\/code>。\n<\/li><li>\n<code>x = 12<\/code>。\n<\/ol>\n<p>核对分组依据：若误按从左到右先算 <code>a + b = 9<\/code>，再 <code>9 * c = 27<\/code>，再减 <code>1<\/code> 得 26，与正确结果 12 不同；差别就来自乘除优先级高于加减。<\/p>\n<p>再看含自增的语句：<\/p>\n<pre class=\"lang-c\"><code>int i = 2, y;\ny = i++ * 3;<\/code><\/pre>\n<ol><li>\n后置 <code>i++<\/code>：在表达式中取 <code>i<\/code> 旧值 2 参与乘法，<code>y = 2 * 3 = 6<\/code>。\n<\/li><li>\n表达式结束前，<code>i<\/code> 自增为 3。\n<\/li><li>\n若换成前置 <code>++i * 3<\/code>：先把 <code>i<\/code> 增到 3，再取新值 3 相乘，<code>y = 9<\/code>。\n<\/li><li>\n对照：返回值差在旧值与新值，副作用落地时机一致。\n<\/ol>\n<h2>算例二：类型转换链逐值推演<\/h2>\n<p><strong>场景 A：整数除法<\/strong>。<code>7 / 2<\/code>：两侧 <code>int<\/code>，整数除法截断，结果 3；不是 3.5。<\/p>\n<p><strong>场景 B：强制浮点一侧<\/strong>。<code>(double)a / b<\/code>，<code>a=7<\/code>：<\/p>\n<ol><li>\n<code>(double)a<\/code> 产生临时值 7.0，<code>a<\/code> 本身仍是 <code>int<\/code>。\n<\/li><li>\n<code>b=2<\/code> 在与 <code>double<\/code> 运算前提升为 2.0。\n<\/li><li>\n<code>7.0 / 2.0 = 3.5<\/code>，结果 <code>double<\/code>。\n<\/ol>\n<p><strong>场景 C：字符加整数<\/strong>。<code>&#x27;A&#x27; + 1<\/code>：<\/p>\n<ol><li>\n<code>&#x27;A&#x27;<\/code> 是 <code>char<\/code> 常量，先提升为 <code>int<\/code>，编码 65。\n<\/li><li>\n<code>65 + 1 = 66<\/code>，结果 <code>int<\/code>。\n<\/li><li>\n若赋给 <code>char c = &#x27;A&#x27; + 1;<\/code>，66 在 8 位范围内，存为 <code>&#x27;B&#x27;<\/code>；若值超出 <code>char<\/code> 范围，收窄按实现规则处理。\n<\/ol>\n<p><strong>场景 D：混合浮点累加<\/strong>。<code>int n = 5; double s = n + 0.5;<\/code><\/p>\n<ol><li>\n<code>n<\/code> 提升为 <code>double<\/code> 5.0。\n<\/li><li>\n<code>5.0 + 0.5 = 5.5<\/code>，结果 <code>double<\/code>。\n<\/li><li>\n若写 <code>int k = n + 0.5;<\/code>，加法先得 5.5，赋值收窄为 <code>int<\/code> 5，小数部分丢弃。\n<\/ol>\n<p><strong>场景 E：混合符号比较<\/strong>。<code>int a = -1; unsigned u = 1;<\/code> 判 <code>a &lt; u<\/code>：<\/p>\n<ol><li>\n<code>a<\/code> 在比较前转 <code>unsigned<\/code>，位模式全 1 解码为 <span class=\"katex-inline\">2^{32}-1<\/span>。\n<\/li><li>\n比较变成 <span class=\"katex-inline\">2^{32}-1 &lt; 1<\/span>，结果假。\n<\/li><li>\n直觉上 <code>-1 &lt; 1<\/code>，转换方向使结论反转；写比较前先统一符号类型。\n<\/ol>\n<h2>反事实推演：改变规则会怎样<\/h2>\n<p><strong>取消优先级，全部从左到右分组<\/strong>。<code>a + b * c<\/code> 先加后乘，乘法失去高于加法的分组位置；含乘除的算式都要靠括号显式指定顺序，漏括号即错。优先级的存在就是把常用算术次序固化成规则。<\/p>\n<p><strong>取消自动提升，窄类型按原宽运算<\/strong>。<code>char<\/code> 参与相加可能溢出窄位，<code>int<\/code> 与浮点混合无法直接换算；提升层保证运算在较宽类型上完成，避免精度先损失。<\/p>\n<p><strong>把有符号溢出也定义成确定回绕<\/strong>。编译器优化空间被压缩，且与补码硬件行为绑定；标准选择让有符号溢出成为未定义行为，无符号回绕才是可依赖规则。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>漏算乘除优先级<\/strong>。<code>a + b * c<\/code> 先加后乘，结果偏离；复盘：复杂表达式先画分组树，必要时加括号，不靠记优先级表硬算。<\/p>\n<p><strong>整数除法当浮点除法<\/strong>。<code>7 / 2<\/code> 期待 3.5，得到 3；复盘：看两侧类型，需要浮点结果就先把一侧转 <code>double<\/code>。<\/p>\n<p><strong>同表达式多次副作用<\/strong>。<code>x = i++ + i++;<\/code> 两次修改 <code>i<\/code> 且中间无序列点，次序未指定；复盘：拆成 <code>i++; x = i + i;<\/code> 一类独立语句。<\/p>\n<p><strong>混淆前置后置返回值<\/strong>。以为 <code>x++<\/code> 在表达式里就用新值；复盘：后置返回旧值，前置返回新值，嵌在赋值右侧时差别直接影响结果。<\/p>\n<p><strong>混合符号比较未转换<\/strong>。见场景 E：负 <code>int<\/code> 与 <code>unsigned<\/code> 比较前被转无符号；复盘：比较前确认两侧符号一致，必要时显式转换。<\/p>\n<h2>优先级层级与括号策略<\/h2>\n<p>把常用运算符按层级从高到低排开，逐层圈组：<\/p>\n<ol><li>\n后缀与一元：数组下标、成员访问、<code>++<\/code> 后置、<code>--<\/code> 后置；一元正负、<code>++<\/code> 前置、<code>--<\/code> 前置、<code>sizeof<\/code>。\n<\/li><li>\n乘除模：<code>*<\/code> <code>/<\/code> <code>%<\/code>，同级左结合。\n<\/li><li>\n加减：<code>+<\/code> <code>-<\/code>，同级左结合。\n<\/li><li>\n移位：<code>&lt;&lt;<\/code> <code>&gt;&gt;<\/code>。\n<\/li><li>\n关系：<code>&lt;<\/code> <code>&lt;=<\/code> <code>&gt;<\/code> <code>&gt;=<\/code>。\n<\/li><li>\n相等：<code>==<\/code> <code>!=<\/code>。\n<\/li><li>\n位与 <code>&amp;<\/code>、位异或 <code>^<\/code>、位或 <code>|<\/code>，逐层降低。\n<\/li><li>\n逻辑与 <code>&amp;&amp;<\/code>，逻辑或 <code>||<\/code>。\n<\/li><li>\n条件运算符 <code>?:<\/code>，赋值与复合赋值，右结合。\n<\/ol>\n<p>层级之间跨级先归高优先级；同一行内按结合性分组。实际写代码时，不要求背完整张表，拿不准的位置直接加括号：括号强制分组，优先级规则被覆盖，读者也不必反推表序。括号策略的边界是：括号只改分组，不改类型转换规则；分组正确后仍要单独检查两侧类型。<\/p>\n<h2>复合赋值与连续表达式算例<\/h2>\n<p><strong>复合赋值<\/strong>。<code>a += b <em> 2<\/code> 展开等价于 <code>a = a + (b <\/em> 2)<\/code>。<\/p>\n<ol><li>\n右侧先算 <code>b * 2<\/code>，优先级按乘法。\n<\/li><li>\n再与 <code>a<\/code> 相加，结果写回 <code>a<\/code>。\n<\/li><li>\n复合赋值的右操作数是整条右侧表达式，不是逐位相加；不要把 <code>a <em>= b + c<\/code> 读成 <code>a = a <\/em> b + c<\/code>。\n<\/ol>\n<p><strong>逗号表达式<\/strong>。<code>a = (1, 2, 3);<\/code> 逗号从左向右依次求值，取最右值：<\/p>\n<ol><li>\n先求值 1，丢弃；再求值 2，丢弃；末位求值 3。\n<\/li><li>\n<code>a = 3<\/code>。\n<\/li><li>\n逗号运算符次序有保证，但多用于循环表头与序列展开，普通语句不建议滥用。\n<\/ol>\n<p><strong>条件运算符<\/strong>。<code>x = a &gt; b ? a : b<\/code>：<\/p>\n<ol><li>\n先判 <code>a &gt; b<\/code>，结果 1 或 0。\n<\/li><li>\n为 1 取冒号前值，为 0 取冒号后值；只有被选中的分支求值。\n<\/li><li>\n两侧类型按常规转换对齐后赋给 <code>x<\/code>。\n<\/ol>\n<p><strong>自增与函数参数<\/strong>。<code>printf(&quot;%d %d\\n&quot;, i, i++);<\/code> 中两个参数的求值顺序未指定，输出哪个在前不可移植。要固定顺序，先把需要的值存入临时变量，再分语句传递。这条边界与 c07 短路求值不同：<code>&amp;&amp;<\/code>、<code>||<\/code> 有次序保证，普通函数实参没有。<\/p>\n<h2>求值顺序与序列点推演<\/h2>\n<p>优先级与结合性只决定分组，不决定操作数内部谁先求值。这条边界要单独拆开：<\/p>\n<ol><li>\n普通二元运算符：两侧操作数的求值顺序由实现选择，代码不能假定先左后右。\n<\/li><li>\n<code>&amp;&amp;<\/code>、<code>||<\/code>、<code>?:<\/code>、逗号运算符：标准规定左侧先求值，右侧按需执行。\n<\/li><li>\n序列点：上一个表达式的副作用全部落地后，才进入下一个表达式；相邻序列点之间重复修改同一变量，行为未定义。\n<\/ol>\n<p>推演一个含函数调用的表达式：<code>f(a) + g(a)<\/code>。<code>f<\/code> 与 <code>g<\/code> 谁先调用，标准未指定；若两者都修改同一个全局变量，最终值依赖调用次序，结果不可移植。修正方式：先分别把结果存入临时变量，再相加：<\/p>\n<pre class=\"lang-c\"><code>int x = f(a);\nint y = g(a);\nint z = x + y;<\/code><\/pre>\n<p>三条独立语句次序确定，不再依赖未指定求值顺序。<\/p>\n<p>再看自增副作用。<code>x = i++ + i++;<\/code> 在两个序列点之间两次修改 <code>i<\/code>，中间没有序列点；读旧值与写新值交错，结果未定义。拆成：<\/p>\n<pre class=\"lang-c\"><code>int t = i;\ni++;\nx = t + i;<\/code><\/pre>\n<p>每步一个动作，次序明确。判断一段代码是否安全，先找副作用位置，再看它们之间有没有序列点隔开。<\/p>\n<h2>类型提升链对照表<\/h2>\n<p>按从窄到宽排列常见提升路径：<\/p>\n<ol><li>\n<code>char<\/code>、<code>short<\/code> → <code>int<\/code>：整数提升，参与算术前先加宽。\n<\/li><li>\n<code>int<\/code> 与 <code>unsigned int<\/code>：<code>int<\/code> 转 <code>unsigned int<\/code>。\n<\/li><li>\n<code>int<\/code> 与 <code>long<\/code>：<code>int<\/code> 转 <code>long<\/code>。\n<\/li><li>\n整数与 <code>double<\/code>：整数转 <code>double<\/code>。\n<\/li><li>\n赋值时：右侧结果转左侧变量类型，超范围按收窄或回绕处理。\n<\/ol>\n<p>对照算例：表达式 <code>&#x27;0&#x27; + 1<\/code>。<code>&#x27;0&#x27;<\/code> 提升为 <code>int<\/code>（编码 48），加 1 得 49；若赋给 <code>char<\/code>，49 在 8 位范围内，存为 <code>&#x27;1&#x27;<\/code>。表达式 <code>1L + 2<\/code>：<code>2<\/code> 提升为 <code>long<\/code>，结果 <code>long<\/code>。表达式 <code>3.5f + 2<\/code>：<code>2<\/code> 转 <code>float<\/code>（<code>3.5f<\/code> 是 <code>float<\/code>），结果 <code>float<\/code>；若右侧是 <code>double<\/code> 字面量，则按 <code>double<\/code> 相加。<\/p>\n<p>提升方向永远是向更宽、精度更高的类型；收窄只发生在赋值或显式转换时。把提升与收窄的时点分清，就不会把整数除法的截断位置判错。<\/p>\n<h2>综合表达式分组与求值算例<\/h2>\n<p><strong>算例一<\/strong>：<code>int x = 10 - 3 * 2 + 4 % 3;<\/code><\/p>\n<ol><li>\n高优先级先圈：<code>3*2=6<\/code>，<code>4%3=1<\/code>。\n<\/li><li>\n代入：<code>10 - 6 + 1<\/code>。\n<\/li><li>\n加减同级左结合：<code>10-6=4<\/code>，<code>4+1=5<\/code>。\n<\/li><li>\n<code>x=5<\/code>。\n<\/ol>\n<p>核对常见误判：若从左到右先算 <code>10-3=7<\/code>，再 <code>7*2=14<\/code>，再 <code>14+1=15<\/code>，结果偏离；差别来自乘除模优先级高于加减。<\/p>\n<p><strong>算例二<\/strong>：<code>int a = 5, b = 3; double c = a / b + 0.5;<\/code><\/p>\n<ol><li>\n<code>a/b<\/code> 两侧整数，整数除法 <code>5/3=1<\/code>。\n<\/li><li>\n加 <code>0.5<\/code> 前，1 提升为 <code>double<\/code>，<code>1.0+0.5=1.5<\/code>。\n<\/li><li>\n<code>c=1.5<\/code>。若期待 <code>5/3≈1.67<\/code> 再加 0.5，需要先把一侧转 <code>double<\/code>：<code>(double)a/b<\/code>。\n<\/ol>\n<p><strong>算例三<\/strong>：关系与逻辑混合。<code>int r = a &gt; b &amp;&amp; b &gt; 1;<\/code><\/p>\n<ol><li>\n先算关系：<code>a&gt;b<\/code>（5&gt;3）为 1，<code>b&gt;1<\/code>（3&gt;1）为 1。\n<\/li><li>\n<code>1 &amp;&amp; 1 = 1<\/code>，<code>r=1<\/code>。\n<\/li><li>\n短路核对：左侧为 1 才算右侧；左侧若为 0，右侧省略。\n<\/ol>\n<p><strong>算例四<\/strong>：复合赋值。<code>a *= b + 2;<\/code><\/p>\n<ol><li>\n右侧整体 <code>b+2=5<\/code>；<code>a = a * 5 = 25<\/code>。\n<\/li><li>\n不能拆成 <code>a = a*b + 2<\/code>；复合赋值右操作数是整条右侧表达式。\n<\/li><li>\n对照 <code>a += b <em> 2<\/code>：先 <code>b<\/em>2<\/code>，再 <code>a+<\/code> 该积。\n<\/ol>\n<h2>再推一层：表达式规则怎样支撑控制流<\/h2>\n<p>循环条件与分支条件都是表达式：<code>while (i &lt;= n)<\/code> 里 <code>&lt;=<\/code> 是关系运算，结果 0 或 1；<code>if (a &gt; 0 &amp;&amp; b &lt; 10)<\/code> 里 <code>&amp;&amp;<\/code> 先算两侧关系再短路合并。本章分组规则决定条件表达式怎样被读出真假值，c06、c07 的推演都从这套规则出发。<\/p>\n<p>函数传参时，实参按常规算术转换提升后再压栈；返回值按函数返回类型转换。指针表达式中，指针加整数的步长是元素宽度，减法差值以元素为单位，宽度结论来自 c02，分组规则来自本章。离开本章后，凡读到一条含多个运算符的语句，先分组、再查类型、末尾看转换方向，三步顺序不要颠倒。<\/p>\n<p>原书第 5 章 §5.2.7 与 §5.2.8 讨论优先级和求值顺序，§5.3 讲解 <code>sizeof<\/code>、求模与自增，§5.5 讲类型转换；阅读时应把每个示例先翻译成分组树，再逐步求值，避免按书写直觉猜结果。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n不查表，能否说出乘除模与加减的高低次序、赋值属于哪一层？\n<\/li><li>\n左结合与右结合各作用于哪类运算符？连续赋值按哪侧分组？\n<\/li><li>\n整数除法与浮点除法的分界条件是什么？\n<\/li><li>\n提升与收窄各发生在运算前还是赋值时？方向朝宽还是朝窄？\n<\/li><li>\n哪些运算符有求值顺序保证？其他运算符的操作数次序能否依赖？\n<\/li><li>\n混合 <code>int<\/code> 与 <code>unsigned<\/code> 比较时转换方向是什么？\n<\/ol>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出 <code>2 + 3 * 4 - 6 % 4<\/code> 的分组树与每步结果。\n<\/li><li>\n<code>double d = 9 / 4;<\/code> 与 <code>double d = 9.0 / 4;<\/code> 结果各是多少？差别在哪一步？\n<\/li><li>\n<code>char c = &#x27;Z&#x27; - 2;<\/code> 经过哪些提升与收窄步骤？结果字符是什么？\n<\/li><li>\n为什么 <code>x = i++ + i++;<\/code> 的结果不可移植？改成两条独立语句怎样写？\n<\/li><li>\n关系表达式的结果类型是什么？可以怎样直接用在循环条件里？\n<\/ol><\/div><\/details>", "c06": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.321<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">运算符优先级、求值顺序与类型转换<\/a><\/span><\/div><h1>循环结构、关系真值与循环不变式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch03（原书第 6 章 §6.2、§6.5、§6.8，PDF 第 321 页起）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>循环用重复执行的代码段处理成组数据；<code>while<\/code> 与 <code>for<\/code> 是入口条件循环，先判断后执行，<code>do while<\/code> 是出口条件循环，先执行后判断；循环不变式是每圈开始前都成立的断言，用来核对积累状态并证明退出结果。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>程序要反复做同一类动作：累加计数、遍历数组、读取一串输入。困难在于重复既不能多走也不能少走：条件永远成立会死循环，条件提前变假会漏掉元素。初学者常把注意力放在循环体写什么，却说不清&quot;每一圈之前状态应该是什么&quot;&quot;退出时凭什么得到目标结果&quot;。本章解决三个问题：三种循环各在什么位置判断条件；关系表达式怎样给出真与假；怎样用不变式验证循环做对了什么。循环是后面数组遍历、输入处理、递归展开的基础结构。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>循环四要素<\/strong>：初始化（循环开始前设置的起点状态）、条件（入口或出口判断）、步进（每圈改变状态的动作）、循环体（重复执行的动作）。<\/p>\n<p><strong><code>while<\/code> 循环<\/strong>：先判断条件，为真执行循环体，再回到条件；条件为假退出。语法：<\/p>\n<pre class=\"lang-c\"><code>while (条件)\n{\n    循环体;\n}<\/code><\/pre>\n<p><strong><code>for<\/code> 循环<\/strong>：初始化、条件、步进写在括号内，分号分隔；流程为初始化一次 → 判断 → 执行体 → 步进 → 再判断。适合次数明确的计数循环。<\/p>\n<p><strong><code>do while<\/code> 循环<\/strong>：先执行一次循环体，再判断条件；为真继续，为假退出。至少执行一次，尾部带分号。<\/p>\n<p><strong>关系运算符<\/strong>：<code>&lt;<\/code> <code>&lt;=<\/code> <code>&gt;<\/code> <code>&gt;=<\/code> <code>==<\/code> <code>!=<\/code>；运算结果是 <code>int<\/code> 类型的 1（真）或 0（假）。数值 0 为假，任何非 0 值为真。<\/p>\n<p><strong>循环不变式<\/strong>：进入每一圈之前都成立的断言。验证循环分三步：初始时不变式成立；每圈执行后不变式仍成立；条件退出时由不变式推出目标结果。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-c\"><code>int sum = 0, i;\nfor (i = 1; i &lt;= 5; i++)\n    sum = sum + i;<\/code><\/pre>\n<p><strong>反例<\/strong>：循环体内忘记修改步进变量，条件永远成立；把 <code>&lt;=<\/code> 写成 <code>&lt;<\/code>，漏掉末尾元素；在循环体内改动被遍历的下标，导致重复或越界。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>不变式三步骤<\/strong>。<\/p>\n<ol><li>\n初始化成立：进入第一圈前，起点状态使不变式为真。\n<\/li><li>\n保持：假设某圈开始时不变式为真，执行体与步进后，下一圈开始时不变式仍为真。\n<\/li><li>\n退出结论：条件为假退出时，结合不变式与退出条件，推出所求结果。\n<\/ol>\n<p>以累加 <span class=\"katex-inline\">1<\/span> 到 <span class=\"katex-inline\">n<\/span> 为例：不变式&quot;进入第 <span class=\"katex-inline\">k<\/span> 圈前，<code>sum<\/code> 等于 <span class=\"katex-inline\">1+\\dots+(i-1)<\/span>，<code>i<\/code> 是下一个待加数&quot;。初始化 <code>sum=0<\/code>、<code>i=1<\/code>，不变式成立；每圈把 <code>i<\/code> 加入 <code>sum<\/code> 再增 1，保持不变式；退出时 <code>i&gt;n<\/code>，<code>sum<\/code> 等于 <span class=\"katex-inline\">1+\\dots+n<\/span>。<\/p>\n<p><strong>终止性推演<\/strong>。循环必须存在一个朝退出方向变化的量：每圈步进使该量靠近边界；若条件不依赖这个量，或步进方向相反，循环不终止。计数循环看步进变量与边界的距离，输入循环看是否读到 EOF 或终止标记。<\/p>\n<p><strong>三种循环的条件位置<\/strong>。<code>while<\/code>/<code>for<\/code> 条件在入口，首次即为假时循环体一次不执行；<code>do while<\/code> 条件在出口，体至少执行一次。选哪种由&quot;是否需要先判断&quot;决定，而不是凭习惯。<\/p>\n<p><strong>真值判断<\/strong>。条件位置接受任意表达式：值为 0 判假，非 0 判真；关系表达式结果 1 或 1。复合条件用 <code>&amp;&amp;<\/code>、<code>||<\/code> 连接，短路规则见 c07。<\/p>\n<p><strong>循环与数组的配合<\/strong>。数组遍历是循环最常见的落点：下标变量从 0 起步，条件 <code>&lt; n<\/code>，体内访问 <code>a[i]<\/code>。计数循环控制重复次数，输入循环控制读到标记或结尾；两类循环的距离量不同，但不变式写法一致：记录已积累了哪些元素、还差哪些。<\/p>\n<p><strong>循环效率的初步判断<\/strong>。循环次数由边界与步进决定；体内动作固定时，总执行量约为圈数乘单圈代价。嵌套循环的总次数是外层圈数乘内层圈数。读循环先估算圈数量级，再看体内是否有可剥离的重复计算。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：次数明确用 <code>for<\/code>；依赖输入或标记终止用 <code>while<\/code>；必须先执行一次再判断用 <code>do while<\/code>。\n<\/li><li>\n边界一：循环变量初始化必须在进入条件之前完成；在循环体内初始化会每圈重置状态。\n<\/li><li>\n边界二：边界比较用对符号。<code>i &lt;= n<\/code> 含第 <span class=\"katex-inline\">n<\/span> 个元素，<code>i &lt; n<\/code> 不含；数组下标范围 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">n-1<\/span>，遍历常用 <code>i &lt; n<\/code>。\n<\/li><li>\n失败案例：步进变量在循环体内被其他语句意外修改，循环次数偏离；复盘：遍历变量只在步进位置改变。\n<\/li><li>\n边界三：浮点累加、浮点比较做循环边界可能因舍入误差不收敛；离散计数用整数。\n<\/li><li>\n边界四：嵌套循环中外层变量控制外层行，内层变量控制内层列；内层循环完整跑完一圈，外层才步进一次。\n<\/ul>\n<p><strong>循环与选择结构的分工<\/strong>。循环负责重复次数，分支负责单次筛选；读一段重复代码，先找循环骨架（初始化、条件、步进），再看体内分支处理什么元素。循环不变式同时约束骨架与体内动作：积累了什么、还剩什么，在每一圈前后都能对照。<\/p>\n<p><strong>常见循环写法对照<\/strong>。计数确定用 <code>for<\/code>，三要素集中表头；依赖输入状态用 <code>while<\/code>；必须先执行一次再校验用 <code>do while<\/code>。三种结构可互相改写，差别在条件位置与最少执行次数，不在表达能力。选择时先问&quot;条件是否可能首次即为假&quot;，再定结构。<\/p>\n<p><strong>调试循环的顺序<\/strong>。先确认初始化起点正确，再核对条件边界含不含端点，然后看步进方向是否靠近退出，末尾用不变式检查积累结果。顺序反了容易在体内动作里找问题，而断裂其实在起点或边界。<\/p>\n<h2>辨析<\/h2>\n<ul><li>\n<strong><code>for<\/code> vs <code>while<\/code><\/strong>：<code>for<\/code> 把三要素集中在表头，适合计数；<code>while<\/code> 表头只留条件，适合依赖状态变化的不确定循环。两者可互相改写。\n<\/li><li>\n<strong>入口条件 vs 出口条件<\/strong>：<code>do while<\/code> 体至少一次；其余两种可能零次执行。需要先校验再执行的场景不能用 <code>do while<\/code>。\n<\/li><li>\n<strong>真 vs 非零<\/strong>：C 条件把 0 当假、非 0 当真；关系运算结果严格为 0 或 1，其他表达式可以是任意非零值。\n<\/li><li>\n<strong>不变式 vs 循环体<\/strong>：循环体是动作，不变式是动作前后成立的状态断言；写得出不变式，才说得清循环积累了什么。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c05 的优先级与类型规则决定条件表达式怎样求值；c02 的整数类型承载计数变量。后继：c07 的分支在循环体内筛选与跳转；c08 递归的展开顺序对应一套自顶向下的循环结构；c09 数组遍历以本章循环为骨架，下标步进按元素宽度移动。本章的不变式方法也用于验证后续算法是否正确。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（循环结构、关系真值与循环不变式）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：循环依赖链、不变式证明与逐圈状态推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把循环写对、证明对，往回追四层：<\/p>\n<ol><li>\n状态层：循环开始前有起点状态，由初始化设置；状态包括计数变量、积累结果、输入位置。\n<\/li><li>\n条件层：条件表达式在入口或出口判断，结果 0 为假、非 0 为真；条件决定继续还是退出。\n<\/li><li>\n步进层：每圈改变朝边界靠近的量；没有朝退出方向的变化，循环不终止。\n<\/li><li>\n不变式层：每圈开始前成立的断言，连接起点、每圈保持与退出结论；它是验证循环正确性的工具。\n<\/ol>\n<p>依赖链方向：起点状态 → 条件判断 → 步进靠近边界 → 不变式贯穿全程。抽掉步进层，条件永远不翻转；抽掉不变式层，只能靠试跑判断对错，无法说明退出结果凭什么成立。<\/p>\n<p>再追一层为什么需要不变式：循环体可以跑很多圈，试跑只能覆盖个别输入；不变式把&quot;每一圈都保持的关系&quot;抽出来，一次证明所有圈，再由退出条件推出结果。这与数学归纳法同构：初始成立对应基例，保持步骤对应归纳步。<\/p>\n<h2>正向推导：不变式三步骤与终止性<\/h2>\n<p><strong>步骤一：初始化成立<\/strong>。进入第一圈前，检查起点状态是否满足断言。累加循环起点 <code>sum=0<\/code>、<code>i=1<\/code>，断言&quot;前 <code>i-1<\/code> 个数之和为 <code>sum<\/code>&quot;在 <code>i=1<\/code> 时即前 0 个数之和为 0，成立。<\/p>\n<p><strong>步骤二：保持<\/strong>。假设某圈开始时断言为真：<code>sum<\/code> 等于前 <code>i-1<\/code> 个数之和。执行体把 <code>i<\/code> 加入 <code>sum<\/code>，<code>sum<\/code> 变为前 <code>i<\/code> 个数之和；步进把 <code>i<\/code> 加 1。下一圈开始时，新 <code>i<\/code> 的前 <code>新i-1<\/code> 个数之和正是当前 <code>sum<\/code>，断言保持。<\/p>\n<p><strong>步骤三：退出结论<\/strong>。条件 <code>i &lt;= n<\/code> 为假即 <code>i &gt; n<\/code>；结合断言，<code>sum<\/code> 等于前 <code>n<\/code> 个数之和，正是目标结果。<\/p>\n<p><strong>终止性<\/strong>。设距离量 <span class=\"katex-inline\">d = n - i<\/span>（计数循环）。每圈 <code>i<\/code> 加 1，<span class=\"katex-inline\">d<\/span> 减 1；有限步后 <span class=\"katex-inline\">d \\le 0<\/span>，条件翻转。若步进使 <span class=\"katex-inline\">d<\/span> 增大或不变，循环不终止。输入循环的距离量是&quot;是否读到 EOF/终止标记&quot;，每读一个字符靠近一次结尾。<\/p>\n<p><strong>三种循环的流程对照<\/strong>：<\/p>\n<ol><li>\n<code>while<\/code>：初始化 → 判断（真进体，假退出）→ 体 → 回判断。\n<\/li><li>\n<code>for<\/code>：初始化一次 → 判断 → 体 → 步进 → 回判断。\n<\/li><li>\n<code>do while<\/code>：体 → 判断（真回体，假退出）；体至少一次。\n<\/ol>\n<p>条件位置决定零次与一次的差别：入口条件循环可能零次执行，出口条件循环至少一次。<\/p>\n<h2>算例一：累加循环逐圈状态表<\/h2>\n<p>程序求 <span class=\"katex-inline\">1+2+\\dots+5<\/span>：<\/p>\n<pre class=\"lang-c\"><code>int sum = 0, i = 1;\nwhile (i &lt;= 5)\n{\n    sum = sum + i;\n    i = i + 1;\n}<\/code><\/pre>\n<p>不变式：进入第 <span class=\"katex-inline\">k<\/span> 圈前，<code>sum<\/code> 等于 <span class=\"katex-inline\">1+\\dots+(i-1)<\/span>，<code>i<\/code> 是下一个待加数。逐圈状态：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>圈次<\/th><th>进入 i<\/th><th>进入 sum<\/th><th>体后 sum<\/th><th>体后 i<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>2<\/td><td>1<\/td><td>3<\/td><td>3<\/td><\/tr><tr><td>3<\/td><td>3<\/td><td>3<\/td><td>6<\/td><td>4<\/td><\/tr><tr><td>4<\/td><td>4<\/td><td>6<\/td><td>10<\/td><td>5<\/td><\/tr><tr><td>5<\/td><td>5<\/td><td>10<\/td><td>15<\/td><td>6<\/td><\/tr><\/tbody><\/table><\/div>\n<p>第 5 圈后 <code>i=6<\/code>，条件 <code>6 &lt;= 5<\/code> 为假，退出。退出时不变式给出 <code>sum=1+2+3+4+5=15<\/code>。核对每一行：体后 <code>sum<\/code> = 进入 <code>sum<\/code> + 进入 <code>i<\/code>；体后 <code>i<\/code> = 进入 <code>i<\/code> + 1；相邻两行衔接，不变式在每圈前后都成立。<\/p>\n<p>再看边界值。若 <code>n=0<\/code>：条件 <code>1 &lt;= 0<\/code> 首次即假，循环体零次执行，<code>sum=0<\/code>，与空和为 0 一致。若边界写成 <code>i &lt; 5<\/code>：第 5 圈 <code>i=5<\/code> 时条件 <code>5 &lt; 5<\/code> 为假，<code>sum=10<\/code>，漏掉 5；边界符号决定含不含端点。<\/p>\n<h2>算例二：数组遍历的不变式推演<\/h2>\n<p>设 <code>int a[5] = {3, 7, 2, 9, 4};<\/code>，求元素个数为 <span class=\"katex-inline\">n=5<\/span> 的总和：<\/p>\n<pre class=\"lang-c\"><code>int total = 0, j;\nfor (j = 0; j &lt; n; j++)\n    total = total + a[j];<\/code><\/pre>\n<p>不变式：进入第 <span class=\"katex-inline\">j<\/span> 圈前，<code>total<\/code> 等于 <code>a[0]<\/code> 到 <code>a[j-1]<\/code> 之和。<\/p>\n<ol><li>\n初始化 <code>j=0<\/code>，前 0 个元素之和为 0，<code>total=0<\/code>，成立。\n<\/li><li>\n每圈加 <code>a[j]<\/code>，<code>total<\/code> 覆盖到 <code>a[j]<\/code>；<code>j<\/code> 增 1，下一圈断言保持。\n<\/li><li>\n退出时 <code>j=5<\/code>，<code>total<\/code> 等于 <code>a[0]<\/code> 到 <code>a[4]<\/code> 之和。\n<\/li><li>\n逐值：<code>total<\/code> 依次 3、10、12、21、25；退出 <code>total=25<\/code>。\n<\/ol>\n<p>边界核对：数组下标范围 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">n-1<\/span>，条件用 <code>j &lt; n<\/code>；若写 <code>j &lt;= n<\/code>，末位一次访问 <code>a[5]<\/code> 越界。遍历不变式与累加循环同构，只是叶子从整数换成数组元素。<\/p>\n<p>再看反向遍历：<\/p>\n<pre class=\"lang-c\"><code>for (j = n - 1; j &gt;= 0; j--)\n    putchar(a[j]);<\/code><\/pre>\n<p>不变式：<code>a[j+1]<\/code> 到 <code>a[n-1]<\/code> 已处理。步进方向朝 0 靠近；退出时 <code>j=-1<\/code>。注意 <code>j<\/code> 若为无符号类型，<code>j &gt;= 0<\/code> 恒真，会形成死循环；反向遍历计数变量应使用有符号类型，或改写为 <code>j &gt; 0<\/code> 的递减结构。<\/p>\n<h2>反事实推演：改掉循环条件会怎样<\/h2>\n<p><strong>去掉步进变化<\/strong>。循环体只读不写步进变量，条件量不变，条件永远为真，程序卡在死循环。反例场景：<code>while (i &lt;= n)<\/code> 体里漏写 <code>i++<\/code>，<code>i<\/code> 一直是起点值。<\/p>\n<p><strong>去掉边界检查<\/strong>。遍历数组不写下限判断，读到尾部后继续访问相邻内存；地址能算出位置，访问却不合法。这与 c09 越界规则同源。<\/p>\n<p><strong>把入口条件换成出口条件<\/strong>。若首次就需要判断合法性却用 <code>do while<\/code>，体在未校验前先执行一次，非法输入已被处理；选循环结构必须先看条件位置要求。<\/p>\n<p><strong>取消不变式约束<\/strong>。写循环只看体动作，退出时结果靠猜；复杂循环一旦出错，无法定位是起点、保持还是终止环节断裂。不变式把正确性验证拆成可核对的三步。<\/p>\n<h2>三种循环互相改写对照<\/h2>\n<p>同一计数问题可以写成三种结构，对照流程差异：<\/p>\n<p><strong><code>for<\/code> 版本<\/strong>：<\/p>\n<pre class=\"lang-c\"><code>int i, sum = 0;\nfor (i = 1; i &lt;= 5; i++)\n    sum += i;<\/code><\/pre>\n<p>初始化 <code>i=1<\/code> 在表头执行一次；每圈先判 <code>i&lt;=5<\/code>，再执行体，末尾 <code>i++<\/code>。<\/p>\n<p><strong><code>while<\/code> 版本<\/strong>：<\/p>\n<pre class=\"lang-c\"><code>int i = 1, sum = 0;\nwhile (i &lt;= 5)\n{\n    sum += i;\n    i++;\n}<\/code><\/pre>\n<p>初始化在循环前；条件在入口；步进放在体尾。与 <code>for<\/code> 流程等价，只是三要素分散在三处。<\/p>\n<p><strong><code>do while<\/code> 版本<\/strong>：<\/p>\n<pre class=\"lang-c\"><code>int i = 1, sum = 0;\ndo\n{\n    sum += i;\n    i++;\n} while (i &lt;= 5);<\/code><\/pre>\n<p>体先执行一次，再判条件；即使条件首次为假，体已跑过一次。需要&quot;先校验再执行&quot;的场景不能用这一结构。<\/p>\n<p>改写核对：<code>for<\/code> 与 <code>while<\/code> 可在零次执行上保持等价；<code>do while<\/code> 多一次保底执行。选结构的依据是条件位置要求，不是个人习惯。<\/p>\n<h2>边界与计数算例<\/h2>\n<p><strong>算例：累加偶数<\/strong>。求 <span class=\"katex-inline\">2+4+\\dots+10<\/span>：<\/p>\n<pre class=\"lang-c\"><code>int s = 0, j;\nfor (j = 2; j &lt;= 10; j += 2)\n    s += j;<\/code><\/pre>\n<ol><li>\n不变式：进入时 <code>s<\/code> 等于已遍历偶数之和，<code>j<\/code> 是下一个待加偶数。\n<\/li><li>\n逐值：<code>s<\/code> 依次 2、6、12、20、30；<code>j<\/code> 到 12 退出。\n<\/li><li>\n退出 <code>s=30<\/code>，即 <span class=\"katex-inline\">2+4+6+8+10<\/span>。\n<\/li><li>\n边界核对：步长 2，终点仍含 10；若条件写 <code>j &lt; 10<\/code>，漏掉 10。\n<\/ol>\n<p><strong>算例：读入直到 EOF<\/strong>。<\/p>\n<pre class=\"lang-c\"><code>int ch;\nwhile ((ch = getchar()) != EOF)\n{\n    /* 处理 ch */\n}<\/code><\/pre>\n<ol><li>\n距离量是流是否结束；每读一个字符靠近结尾。\n<\/li><li>\n<code>EOF<\/code> 是负值状态标志，不是普通字符；变量用 <code>int<\/code> 承接，避免与字符编码混淆。\n<\/li><li>\n循环体内处理当前字符，回到条件再读下一个；读到流结尾退出。\n<\/ol>\n<p><strong>算例：嵌套循环行列<\/strong>。打印 <span class=\"katex-inline\">3<\/span> 行 <span class=\"katex-inline\">4<\/span> 列星号：<\/p>\n<pre class=\"lang-c\"><code>int r, c;\nfor (r = 0; r &lt; 3; r++)\n{\n    for (c = 0; c &lt; 4; c++)\n        putchar(&#x27;*&#x27;);\n    putchar(&#x27;\\n&#x27;);\n}<\/code><\/pre>\n<ol><li>\n外层 <code>r<\/code> 控制行，内层 <code>c<\/code> 控制列；内层跑完 4 次，外层才步进一次。\n<\/li><li>\n总圈数 <span class=\"katex-inline\">3\\times4=12<\/span> 次内层动作，加 3 次换行。\n<\/li><li>\n内层变量不能冲到外层条件里判断；行列变量各管一层。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>循环变量在体内被意外修改<\/strong>。遍历变量除步进外又在其他语句被改，圈数偏离；复盘：遍历变量只在步进位置更新，临时值用另一个变量存。<\/p>\n<p><strong>边界符号用错<\/strong>。<code>&lt;=<\/code> 与 <code>&lt;<\/code> 混淆导致漏端点或越界；复盘：先写下标范围 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">n-1<\/span>，再选对应比较符。<\/p>\n<p><strong>浮点做循环边界<\/strong>。累加 0.1 累计误差使条件不按预期翻转；复盘：离散次数用整数计数，浮点只承担测量值。<\/p>\n<p><strong>嵌套循环内外层混淆<\/strong>。内层变量跑到外层条件里判断，行列次序错乱；复盘：外层变量控行、内层变量控列，内层整圈跑完外层才步进。<\/p>\n<p><strong>初始化写进循环体<\/strong>。每圈重置 <code>sum<\/code> 或下标，积累结果被清空；复盘：初始化只在进入循环前执行一次。<\/p>\n<h2>不变式断裂位置排查<\/h2>\n<p>循环结果不对时，按不变式三步骤定位断裂点：<\/p>\n<ol><li>\n起点检查：进入第一圈前，初始化是否使不变式成立。若积累变量未清 0、下标未置起点，初始断言就不成立。\n<\/li><li>\n保持检查：假设某圈断言为真，执行体与步进后，下一圈断言是否仍成立。断裂常在遍历变量被其他语句改写，或步进方向与边界相反。\n<\/li><li>\n退出检查：条件为假时，结合断言能否推出目标结果。若边界符号用错，退出时多处理或少处理一个元素。\n<\/ol>\n<p><strong>算例：漏初始化<\/strong>。求乘积却把 <code>product<\/code> 留在随机值：<\/p>\n<pre class=\"lang-c\"><code>int i, product;\nfor (i = 1; i &lt;= 5; i++)\n    product *= i;<\/code><\/pre>\n<p>起点断言&quot;前 0 个数乘积为 1&quot;不成立：<code>product<\/code> 未置 1。修正为 <code>product = 1;<\/code>。对照求和初值是 0，求积初值是 1，初值由积累规则决定。<\/p>\n<p><strong>算例：步进方向反了<\/strong>。从 0 向 <span class=\"katex-inline\">n<\/span> 遍历，条件却写 <code>i--<\/code>；距离量不靠近边界，循环不终止。核对：每圈后 <code>i<\/code> 与边界的距离应缩小，而不是增大或不变。<\/p>\n<p><strong>算例：边界差一<\/strong>。数组 5 个元素，条件 <code>i &lt;= 5<\/code> 访问 <code>a[5]<\/code>；条件应为 <code>i &lt; 5<\/code>。退出时不变式覆盖到 <code>a[4]<\/code>，多走一步即越界。排查差一错误，先写下标合法区间 <span class=\"katex-inline\">[0,n)<\/span>，再对照比较符含不含端点。<\/p>\n<p><strong>循环次数估算<\/strong>。计数循环圈数等于终点减起点加 1（含端点）；输入循环圈数取决于标记出现位置。嵌套循环总动作量为外层圈数乘内层圈数。估算量级有助于判断循环是否卡住：圈数发散通常是步进或边界错误，不是体内动作慢。<\/p>\n<h2>循环终止性与圈数估算<\/h2>\n<p>终止性要求距离量每圈靠近边界。计数循环距离量是下标与边界的差；输入循环距离量是与结尾标记的距离。推演时先写出距离量，再核对步进方向：<\/p>\n<ol><li>\n递增计数：<code>i<\/code> 每圈加 1，距离 <code>n-i<\/code> 递减，有限步后 <code>i&gt;n<\/code>。\n<\/li><li>\n递减计数：<code>i<\/code> 每圈减 1，距离 <code>i<\/code> 递减，有限步后 <code>i&lt;0<\/code> 或达到目标。\n<\/li><li>\n输入读取：每读一个字符靠近 EOF 或终止标记；没有标记且输入不结束，循环不终止。\n<\/ol>\n<p>圈数估算：含端点的递增循环从 <span class=\"katex-inline\">a<\/span> 到 <span class=\"katex-inline\">b<\/span>，圈数 <span class=\"katex-inline\">b-a+1<\/span>；数组遍历 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">n-1<\/span>，圈数 <span class=\"katex-inline\">n<\/span>。嵌套循环总动作量为外层圈数乘内层圈数。估算量级用于判断循环是否卡住：若圈数发散，先查步进方向与边界，再看体内动作是否耗时。<\/p>\n<p><strong>循环变量的改动约束<\/strong>。遍历变量只在步进位置改变；体内其他语句写这个变量会打乱距离量。需要临时值时另设变量保存。条件中出现的变量与步进变量应一致，避免条件看一个量、步进改另一个量。<\/p>\n<p><strong>零次执行场景<\/strong>。入口条件循环在条件首次为假时体一次不跑；需要先校验数据再处理的场景选 <code>while<\/code> 或 <code>for<\/code>，不能用保底执行一次的 <code>do while<\/code>。反过来，菜单提示至少显示一次时，<code>do while<\/code> 结构与需求匹配。<\/p>\n<h2>再推一层：循环在后续结构中的位置<\/h2>\n<p>递归可以展开成一套自顶向下的调用链，每层对应循环的一圈；递归基准条件对应循环退出条件，每层状态对应不变式。数组排序、查找、字符串遍历都以本章循环为骨架：循环提供重复框架，条件控制边界，不变式核对积累状态。<\/p>\n<p>读已有循环时，按四步还原：找初始化状态、找条件与退出边界、找步进方向、写一条不变式说清积累了什么。四步写得出，循环是否正确就有了判断依据；四步缺一步，先补这一步再谈优化。原书第 6 章 §6.2 讲 <code>while<\/code>，§6.5 讲 <code>for<\/code>，§6.8 讲 <code>do while<\/code>，§6.10 讲嵌套循环；阅读示例时应先画状态表，再对照不变式核对每一圈。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n循环四要素是哪四个？各写在代码什么位置？\n<\/li><li>\n不变式三步骤分别对应什么？初始不成立会怎样？\n<\/li><li>\n<code>while<\/code>/<code>for<\/code> 与 <code>do while<\/code> 在执行次数上的最小差别是什么？\n<\/li><li>\n关系表达式结果是什么类型、什么取值？条件怎样判真假？\n<\/li><li>\n数组下标范围是多少？遍历条件用 <code>&lt; n<\/code> 还是 <code>&lt;= n<\/code>？\n<\/li><li>\n终止性看哪个量朝退出方向变化？步进不变会怎样？\n<\/ol>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n为求乘积 <span class=\"katex-inline\">1\\times2\\times\\dots\\times n<\/span> 的循环写一条不变式，并列出 <code>n=4<\/code> 的逐圈状态表。\n<\/li><li>\n<code>do while<\/code> 能否替代 <code>while<\/code> 处理&quot;首次可能不合法&quot;的输入？为什么？\n<\/li><li>\n反向遍历数组时，计数变量为什么不宜用无符号类型？\n<\/li><li>\n一段循环退出结果与预期不符，按初始化、保持、退出结论三步，应分别检查什么？\n<\/li><li>\n嵌套循环中，外层变量与内层变量各控制什么？内层未跑完外层能否步进？\n<\/ol><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C Primer Plus 第6版 中文版 ([美]史蒂芬·普拉达(Stephen Prata)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.407<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">循环结构、关系真值与循环不变式<\/a><\/span><\/div><h1>分支跳转、逻辑短路与 switch 匹配规则<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch03（原书第 7 章 §7.1、§7.3、§7.7，PDF 第 407 页起）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><code>if<\/code>/<code>if else<\/code> 按条件真假选择执行路径，<code>else<\/code> 与最近未配对的 <code>if<\/code> 结合；<code>&amp;&amp;<\/code>、<code>||<\/code> 在结果已定时短路，右侧可能不执行；<code>switch<\/code> 按表达式值匹配标签，命中后从该标签向下贯穿，<code>break<\/code> 跳出分支结构。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>程序要按数据走不同路径：分类、筛选、菜单选择、错误分流。困难集中在三处：一是多个 <code>if<\/code> 嵌套时 <code>else<\/code> 挂在哪一层；二是复合条件中右侧表达式会不会被执行；三是 <code>switch<\/code> 缺少 <code>break<\/code> 时语句怎样贯穿。误判配对会走错分支，误估短路会让本该执行的副作用丢失，漏写 <code>break<\/code> 会串入后续标签的处理。本章把分支配对、短路求值与标签匹配三条规则讲清，它们是循环体内筛选与函数内错误分流的依据。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong><code>if<\/code> 语句<\/strong>：条件为真执行其后语句（或花括号块）；条件为假跳过。<\/p>\n<p><strong><code>if else<\/code><\/strong>：条件为真走 <code>
