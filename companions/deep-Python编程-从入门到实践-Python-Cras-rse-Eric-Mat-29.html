>定义逐句拆<\/h2>\n<p><strong>打开文件<\/strong>：<code>open(filename)<\/code> 返回文件对象；模式 <code>&#x27;r&#x27;<\/code> 读取、<code>&#x27;w&#x27;<\/code> 写入（覆盖）、<code>&#x27;a&#x27;<\/code> 附加到末尾。<\/p>\n<p><strong>with 语句<\/strong>：<code>with open(...) as f_obj:<\/code> 块结束时自动关闭文件，即使块内出现异常也会关闭。<\/p>\n<p><strong>读取方式<\/strong>：一次性读取整个文件；逐行读取；生成包含各行内容的列表，每行末尾换行符可去除。<\/p>\n<p><strong>写入文件<\/strong>：写入模式打开后用文件对象写入字符串；写入多行需自行包含换行符；附加模式在末尾续写而不清空原内容。<\/p>\n<p><strong>异常对象<\/strong>：运行出错时解释器创建的特殊对象，如 <code>ZeroDivisionError<\/code>、<code>FileNotFoundError<\/code>；未被捕获则沿调用栈向上传播，程序终止并显示 traceback。<\/p>\n<p><strong>try-except-else<\/strong>：try 块放可能出错的代码；except 接住指定类型异常并执行兜底；else 块在无异常时继续执行。<\/p>\n<p><strong>json.dump / json.load<\/strong>：<code>json.dump(数据, 文件对象)<\/code> 把数据写成 JSON 文本；<code>json.load(文件对象)<\/code> 读回并重建对应 Python 数据结构。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>import json\nnumbers = [2, 3, 5, 7, 11, 13]\nwith open(&#x27;numbers.json&#x27;, &#x27;w&#x27;) as f_obj:\n    json.dump(numbers, f_obj)<\/code><\/pre>\n<p><strong>反例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>try:\n    print(5 / 0)\nexcept ZeroDivisionError:\n    print(&quot;You can&#x27;t divide by zero!&quot;)<\/code><\/pre>\n<p>除数为零的异常被指定类型接住，程序不显示 traceback，继续向后运行。<\/p>\n<h2>原理推导：文件路径、异常传播与序列化往返<\/h2>\n<p>推演分五步。<\/p>\n<p>第一步，打开与读取。<code>open<\/code> 按路径定位文件，返回文件对象；读取操作把磁盘内容调入内存。相对路径相对程序运行目录，绝对路径从根目录写起。<code>with<\/code> 块退出时关闭文件。<\/p>\n<p>第二步，写入与覆盖语义。<code>&#x27;w&#x27;<\/code> 打开已有文件时先清空原内容再写入；<code>&#x27;a&#x27;<\/code> 保留原内容，新内容追加到末尾。写入的是字符串，数值与列表需先转成文本或交给 json 序列化。<\/p>\n<p>第三步，异常创建与匹配。try 块代码运行出错时，解释器创建对应类型的异常对象；依次查找 except 子句，类型匹配则执行 except 块，异常被就地处理；不匹配则继续向上传播。<\/p>\n<p>第四步，else 与正常路径。try 块无异常抛出时，跳过 except，进入 else 块执行后续逻辑；异常被接住后，try 块余下语句不再执行。<\/p>\n<p>第五步，JSON 往返。dump 把列表、字典等结构转成 JSON 文本写入文件；load 读取文本并按 JSON 结构重建 Python 对象。文件里存的是文本，不是内存对象本身。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：需要留存内存数据、读取外部文件、对可能失败的操作兜底时使用；错误属于预期内分支时处理异常，明显可预判的条件也可先做判断。\n<\/li><li>\n边界一：读取不存在的文件抛 <code>FileNotFoundError<\/code>；except 应指定该类型，避免吞掉其他错误。\n<\/li><li>\n边界二：<code>&#x27;w&#x27;<\/code> 会清空已有文件；需要保留旧内容用 <code>&#x27;a&#x27;<\/code>。\n<\/li><li>\n边界三：宽泛 <code>except:<\/code> 会捕获包括拼写错误、中断在内的所有异常，掩盖真正问题；应按具体类型书写。\n<\/li><li>\n失败案例：不用 with 打开文件，中间代码抛异常，文件来不及关闭，长期运行占用文件句柄。\n<\/li><li>\n失败案例：把 JSON 文本读回后直接当原对象修改嵌套结构，未意识到读回的是新重建出的对象。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>读取 / 写入 / 附加模式<\/strong>：<code>&#x27;r&#x27;<\/code> 只读；<code>&#x27;w&#x27;<\/code> 覆盖写；<code>&#x27;a&#x27;<\/code> 末尾追加。模式选错会清空数据或拒绝写入。\n<\/li><li>\n<strong>异常处理 vs 条件预判<\/strong>：异常处理接住已经发生的错误；条件预判在错误发生前判断分支。预期内偶发错误用异常，稳定可判断的情形用条件分支。\n<\/li><li>\n<strong>json.dump vs 手工写文本<\/strong>：dump 自动处理结构转义与格式；手工拼接文本在数据含特殊字符时容易出错。\n<\/li><li>\n<strong>except 类型匹配 vs 全捕获<\/strong>：指定类型只接对应异常；全捕获把不该吞的错误也藏起来。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c05 的输入循环收集用户数据，本章把收集结果写入文件；c07 实例属性可整理成字典后用 json 保存。后继：c10 测试函数会核对文件读写与异常处理路径是否符合预期；第二部分数据可视化项目读取数据文件，Web 应用保存用户输入，都建立在文件与持久化机制之上。异常传播路径与函数调用帧（c06）沿同一方向：从出错函数向外层调用者传递。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（文件读写、异常处理与 JSON 持久化）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：文件读写路径、异常传播链与 JSON 序列化往返<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把“文件怎样读进内存、异常在哪一步被接住、结构化数据怎样保存再读回”讲到可推演，先往回追四层前提：<\/p>\n<ol><li>\n<strong>内存数据断电即失<\/strong>。程序运行结果要留存到磁盘，必须经过文件读写；文件对象是程序与磁盘之间的入口。\n<\/li><li>\n<strong>打开模式决定读写语义<\/strong>：读取、覆盖写、末尾追加三种模式对原内容的处理不同，模式选错直接影响数据存亡。\n<\/li><li>\n<strong>错误以异常对象形式出现并沿栈传播<\/strong>：解释器在出错点创建异常，先在当前 try 块内找匹配 except，找不到则向外层调用者传递，直到被捕获或程序终止。\n<\/li><li>\n<strong>结构化数据需要序列化<\/strong>：内存中的列表、字典不能直接写进纯文本文件，要经 json 转成文本格式；读回时再反序列化为对象。\n<\/ol>\n<p>依赖链方向：文件入口 → 模式与关闭语义 → 异常创建与匹配 → JSON 序列化与重建。任何一层前提缺失，就会用写入模式清空原文件，或把未捕获异常误当成正常分支。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：open 返回文件对象<\/h3>\n<p><code>open(filename, mode)<\/code> 按路径定位文件，成功后返回文件对象；程序通过文件对象的读取、写入方法操作内容。相对路径以程序运行目录为基准，绝对路径从根目录写起。<\/p>\n<h3>第二步：with 块与自动关闭<\/h3>\n<p><code>with open(...) as f_obj:<\/code> 把文件对象绑到 <code>f_obj<\/code>；块内执行读写，块退出时无论正常结束还是异常跳出，都执行关闭。手动 <code>open<\/code> 若中间出错，关闭语句可能被跳过。<\/p>\n<h3>第三步：读取的三种粒度<\/h3>\n<p>一次性读取得到整个文件的大字符串；逐行读取每次取一行；读取各行列表把每行作为列表元素。每行末尾保留换行符，需要时用字符串方法去除。大文件逐行处理可避免一次性载入全部内容。<\/p>\n<h3>第四步：写入与模式语义<\/h3>\n<p><code>&#x27;w&#x27;<\/code>：打开时清空原文件，后续写入覆盖；<code>&#x27;a&#x27;<\/code>：保留原内容，写入位置在末尾；写入内容必须是字符串，多行之间需加换行符。数值、列表不直接写入文本文件。<\/p>\n<h3>第五步：异常创建<\/h3>\n<p>try 块语句运行出错时，解释器创建对应类型的异常对象，例如除数为零创建 <code>ZeroDivisionError<\/code>，文件不存在创建 <code>FileNotFoundError<\/code>。异常对象携带出错位置与类型信息。<\/p>\n<h3>第六步：except 匹配与传播<\/h3>\n<p>解释器在当前 try 块的 except 子句中按顺序匹配异常类型；类型匹配则执行 except 块，异常处理完毕，程序继续向后。类型不匹配，异常离开当前块，沿调用栈向上一层查找；一直未被捕获，程序终止并打印 traceback。<\/p>\n<h3>第七步：else 正常路径<\/h3>\n<p>try 块全部语句无异常时，跳过所有 except，进入 else 块执行依赖成功结果的语句。把可能出错的代码放 try，把依赖成功结果的代码放 else，路径区分更清楚。<\/p>\n<h3>第八步：JSON 序列化与重建<\/h3>\n<p><code>json.dump(数据, 文件对象)<\/code> 把列表、字典转成 JSON 文本写入文件；<code>json.load(文件对象)<\/code> 读取文本，按 JSON 结构重建出对应的 Python 列表或字典。重建出的是新对象，与写入前的内存对象不是同一身份。<\/p>\n<h2>算例一：逐行读取并生成各行列表<\/h2>\n<p>给定 <code>pi_digits.txt<\/code> 内容为三行圆周率数字。代码：<\/p>\n<pre class=\"lang-python\"><code>with open(&#x27;pi_digits.txt&#x27;) as f_obj:\n    lines = f_obj.readlines()\n\nfor line in lines:\n    print(line.rstrip())<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n<code>open<\/code> 以默认读取模式打开文件，返回文件对象；<code>f_obj<\/code> 绑定它。\n<\/li><li>\n<code>readlines()<\/code> 把各行读入列表，每个元素带行末换行符。\n<\/li><li>\nwith 块结束，文件自动关闭；<code>lines<\/code> 列表在块外仍可使用。\n<\/li><li>\n循环中 <code>line.rstrip()<\/code> 去掉行末空白与换行，逐行打印。\n<\/li><li>\n核对：文件对象在块外已关闭，但读入内存的 <code>lines<\/code> 数据保留；未读入内存的磁盘内容不会因关闭而丢失。\n<\/ol>\n<h2>算例二：除零异常的 try-except-else 路径<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>try:\n    answer = int(first) / int(second)\nexcept ZeroDivisionError:\n    print(&quot;You can&#x27;t divide by zero!&quot;)\nelse:\n    print(answer)<\/code><\/pre>\n<p>两组输入对照：<\/p>\n<ol><li>\n<code>first=&#x27;5&#x27;<\/code>、<code>second=&#x27;2&#x27;<\/code>：try 内转换成功，<code>5 / 2 = 2.5<\/code>，无异常；跳过 except，进入 else 打印 <code>2.5<\/code>。\n<\/li><li>\n<code>second=&#x27;0&#x27;<\/code>：除法创建 <code>ZeroDivisionError<\/code>；except 类型匹配，打印除零提示；else 不执行。\n<\/li><li>\n若 except 写的是 <code>FileNotFoundError<\/code>，类型不匹配，<code>ZeroDivisionError<\/code> 继续向上传播，未被捕获则程序终止。\n<\/li><li>\n核对：except 只接住声明的类型；转换 <code>int(&#x27;abc&#x27;)<\/code> 产生的 ValueError 不在该 except 覆盖范围内。\n<\/ol>\n<h2>算例三：文件不存在的异常处理<\/h2>\n<p>给定统计文本词数的程序：<\/p>\n<pre class=\"lang-python\"><code>filename = &#x27;alice.txt&#x27;\ntry:\n    with open(filename) as f_obj:\n        contents = f_obj.read()\nexcept FileNotFoundError:\n    print(&quot;Sorry, the file &quot; + filename + &quot; does not exist.&quot;)\nelse:\n    words = contents.split()\n    print(len(words))<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n文件存在：with 打开成功，<code>contents<\/code> 读入全文；else 中按空白拆分统计词数。\n<\/li><li>\n文件不存在：<code>open<\/code> 创建 <code>FileNotFoundError<\/code>；except 匹配，打印友好提示；else 不执行，程序不崩溃。\n<\/li><li>\n对照：不写 try，文件缺失时异常向上传播，traceback 直接暴露出错位置与类型。\n<\/ol>\n<h2>算例四：JSON 保存与读回往返<\/h2>\n<p>写入：<\/p>\n<pre class=\"lang-python\"><code>import json\nnumbers = [2, 3, 5, 7, 11, 13]\nwith open(&#x27;numbers.json&#x27;, &#x27;w&#x27;) as f_obj:\n    json.dump(numbers, f_obj)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n<code>numbers<\/code> 绑到列表对象；<code>&#x27;w&#x27;<\/code> 模式打开文件。\n<\/li><li>\n<code>json.dump<\/code> 把列表序列化为 JSON 文本 <code>[2, 3, 5, 7, 11, 13]<\/code> 写入文件；with 块结束关闭文件。\n<\/li><li>\n内存中的 <code>numbers<\/code> 与文件文本是两份存在形式；文件里是纯文本。\n<\/ol>\n<p>读回：<\/p>\n<pre class=\"lang-python\"><code>with open(&#x27;numbers.json&#x27;) as f_obj:\n    numbers = json.load(f_obj)\nprint(numbers)<\/code><\/pre>\n<p>推演：<code>json.load<\/code> 读取文本，重建出新列表对象并赋给 <code>numbers<\/code>；输出 <code>[2, 3, 5, 7, 11, 13]<\/code>。重建列表与写入前的列表值相同，但不是同一个对象；修改读回列表不影响磁盘文件，需要留存改动要再次 dump。<\/p>\n<h2>算例五：未捕获异常的传播路径<\/h2>\n<p>给定调用链：<code>main()<\/code> 调用 <code>read_config()<\/code>，后者 <code>open<\/code> 一个不存在的文件，两处都没有 try。<\/p>\n<p>推演：<\/p>\n<ol><li>\n<code>read_config()<\/code> 内 <code>open<\/code> 失败，创建 <code>FileNotFoundError<\/code>。\n<\/li><li>\n该函数内无匹配 except，异常离开函数帧，回到调用处 <code>main()<\/code>。\n<\/li><li>\n<code>main()<\/code> 内也无 except，异常继续向上传播到程序顶层；未被捕获，程序终止，traceback 依次列出 <code>read_config<\/code> 与 <code>main<\/code> 的调用位置。\n<\/li><li>\n若在 <code>main()<\/code> 一层写了匹配 except，异常在该层被接住，<code>read_config<\/code> 帧已结束，except 中只能拿到异常信息，不能回到出错语句重试。\n<\/ol>\n<h2>算例六：写入多行与附加模式对照<\/h2>\n<p>写入程序：<\/p>\n<pre class=\"lang-python\"><code>with open(&#x27;guest_book.txt&#x27;, &#x27;w&#x27;) as f_obj:\n    f_obj.write(&quot;Eric\\n&quot;)\n    f_obj.write(&quot;Lin\\n&quot;)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n<code>&#x27;w&#x27;<\/code> 模式打开，若文件已有内容先被清空；两次 <code>write<\/code> 依次写入两行，<code>\\n<\/code> 负责换行。\n<\/li><li>\n文件内容为两行文本；<code>write<\/code> 不会自动追加换行符，多行内容必须在字符串中显式带上。\n<\/ol>\n<p>再运行附加程序：<\/p>\n<pre class=\"lang-python\"><code>with open(&#x27;guest_book.txt&#x27;, &#x27;a&#x27;) as f_obj:\n    f_obj.write(&quot;Sarah\\n&quot;)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n<code>&#x27;a&#x27;<\/code> 模式不清空原内容，写入位置在文件末尾。\n<\/li><li>\n原有两行保留，<code>Sarah<\/code> 作为第三行追加；文件内容变为三行。\n<\/li><li>\n对照：若这段附加代码误用 <code>&#x27;w&#x27;<\/code> 打开，前两行被清空，文件只剩 <code>Sarah<\/code> 一行。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：用写入模式覆盖已有文件。<\/strong> 想追加记录却以 <code>&#x27;w&#x27;<\/code> 打开，原内容先被清空。保留旧内容应使用 <code>&#x27;a&#x27;<\/code>。<\/p>\n<p><strong>案例 2：宽泛 except 吞掉错误。<\/strong> <code>except:<\/code> 接住所有异常，代码拼写错误、键盘中断也被藏起，调试时无从定位。按具体异常类型书写 except。<\/p>\n<p><strong>案例 3：不用 with 导致文件未关闭。<\/strong> 手动打开后读写中途抛异常，关闭语句跳过；长期运行占用文件句柄。用 with 保证退出时关闭。<\/p>\n<p><strong>案例 4：except 类型写错接不住目标异常。<\/strong> 除零错误写了文件类型 except，异常继续传播崩溃。复盘：核对异常类型名与报错提示一致。<\/p>\n<p><strong>案例 5：把读回对象当成原对象身份。<\/strong> json.load 重建的是新对象，别名关系不复存在；需要保留内存对象与文件的同步，改动后要重新写回。<\/p>\n<p><strong>案例 6：写入多行漏写换行符。<\/strong> 连续 <code>write<\/code> 不带 <code>\\n<\/code>，所有内容连成一行；读回时无法按行拆分。多行写入在每条字符串末尾加换行符。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：<code>&#x27;w&#x27;<\/code>、<code>&#x27;a&#x27;<\/code>、<code>&#x27;r&#x27;<\/code> 各做什么？答：覆盖写、末尾追加、只读。\n<\/li><li>\n问：with 块退出时文件由谁关闭？答：with 自动关闭，异常跳出也会关闭。\n<\/li><li>\n问：异常在哪一步创建？答：try 块语句运行出错时，解释器创建对应类型异常对象。\n<\/li><li>\n问：except 类型不匹配会怎样？答：异常继续沿调用栈向上传播，直到被捕获或终止程序。\n<\/li><li>\n问：else 块什么时候执行？答：try 块无异常时执行。\n<\/li><li>\n问：json 文件里存的是对象还是文本？答：JSON 文本；load 读回时重建 Python 对象。\n<\/li><li>\n问：为什么不写宽泛 except？答：会吞掉其他类型错误，掩盖真正问题。\n<\/li><li>\n问：write 会自动换行吗？答：不会，多行内容要在字符串里显式写 <code>\\n<\/code>。\n<\/li><li>\n问：附加模式与写入模式对原文件的处理差别？答：<code>&#x27;a&#x27;<\/code> 保留原内容末尾续写，<code>&#x27;w&#x27;<\/code> 先清空再写。\n<\/li><li>\n问：with 块内读取得到的列表，块结束后还能用吗？答：能用，数据已读入内存；关闭的是文件对象，不是内存中的数据。\n<\/ul>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出用 with 逐行读取 <code>guests.txt<\/code>、去掉每行换行后存入列表的代码；说明文件在哪一步关闭。\n<\/li><li>\n除数为零的程序中，except 写成 <code>FileNotFoundError<\/code> 会发生什么？异常沿什么路径走？\n<\/li><li>\n<code>&#x27;w&#x27;<\/code> 与 <code>&#x27;a&#x27;<\/code> 打开同一已有文件，写入后原内容分别怎样？\n<\/li><li>\njson.dump 保存字典后，json.load 读回的字典与原字典是同一对象吗？改动读回字典会自动写回文件吗？\n<\/li><li>\n把一段可能抛 ValueError 的输入转换代码放进 try，except 应写哪个类型？else 里适合放什么语句？\n<\/ol><\/div><\/details>", "c10": "<div class=\"source-badge\">📖 出处：Python编程__从入门到实践_=_Python_Cras...rse_(Eric_Matthes)_(Z-Library).pdf · p.208<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">文件读写、异常处理与 JSON 持久化<\/a><\/span><\/div><h1>单元测试、断言方法与 setUp 复用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（原书第 11 章 §11.1–11.3，PDF 第 206–218 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>单元测试把“函数输出是否符合预期”写成继承 <code>unittest.TestCase<\/code> 的测试类；以 <code>test_<\/code> 打头的方法被框架自动运行，断言方法比对实际值与预期值，<code>setUp()<\/code> 在每个测试方法前建好共用对象。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>函数写完后手工跑几组输入核对，改一处代码又要重新手敲一遍；手测容易漏掉边界情形，出了问题不知道是哪次改动引入的。单元测试把核对标准写成可重复运行的代码：每次改动后运行测试，断言通过说明覆盖到的路径仍符合预期，失败立刻定位到哪个方法不符。困难在于：测试类为什么要继承 TestCase？哪些方法会被自动运行？断言怎样判定通过与失败？多个测试方法共用的对象为什么放在 setUp 而不是各写一遍？本概念把测试执行流程、断言比对与 setUp 复用拆开推演。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>unittest 模块<\/strong>：Python 自带的测试框架，提供测试基类、断言方法与运行入口。<\/p>\n<p><strong>测试类<\/strong>：继承 <code>unittest.TestCase<\/code> 的类，把针对同一组函数的测试方法收在一起；类名通常含 Test 字样。<\/p>\n<p><strong>测试方法<\/strong>：以 <code>test_<\/code> 打头的方法；框架扫描并逐个运行，方法名其余部分描述被测情形。<\/p>\n<p><strong>断言方法<\/strong>：TestCase 提供的核对手段，如 <code>assertEqual(实际值, 预期值)<\/code> 核对相等，<code>assertIn<\/code> 核对成员归属；不满足条件时该测试记为失败并给出两侧取值。<\/p>\n<p><strong>setUp 方法<\/strong>：在每个测试方法运行前自动执行一次，把共用的实例或数据建好；各测试方法拿到的是 setUp 新建的独立对象。<\/p>\n<p><strong>测试通过与失败<\/strong>：全部断言满足记为通过；任一断言不满足，测试方法失败，报告列出失败方法与取值对比。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>import unittest\nfrom name_function import get_formatted_name\n\nclass NamesTestCase(unittest.TestCase):\n    def test_first_last_name(self):\n        formatted_name = get_formatted_name(&#x27;janis&#x27;, &#x27;joplin&#x27;)\n        self.assertEqual(formatted_name, &#x27;Janis Joplin&#x27;)\n\nunittest.main()<\/code><\/pre>\n<p><strong>反例<\/strong>：测试方法命名为 <code>check_name()<\/code>，不以 <code>test_<\/code> 打头，框架不扫描它，写错也不会在报告中暴露。<\/p>\n<h2>原理推导：测试执行与断言比对路径<\/h2>\n<p>推演分五步。<\/p>\n<p>第一步，导入与继承。导入 <code>unittest<\/code> 与被测函数；测试类继承 <code>unittest.TestCase<\/code>，由此获得断言方法与框架识别所需的行为。<\/p>\n<p>第二步，框架扫描测试方法。运行 <code>unittest.main()<\/code> 时，框架在测试类中查找以 <code>test_<\/code> 打头的方法，逐个安排执行；不以该前缀开头的方法被视为普通辅助方法。<\/p>\n<p>第三步，setUp 建共用对象。每个测试方法运行前，框架先调用 <code>setUp()<\/code>；在其中创建的实例或数据挂到 <code>self<\/code> 上，测试方法经 <code>self<\/code> 使用。每个测试方法都重新跑一遍 setUp，对象互不干扰。<\/p>\n<p>第四步，调用被测函数并断言。测试方法内调用被测函数，把返回值存下来；断言方法把实际值与预期值比对。相等、成员归属、真假等各有对应断言方法。<\/p>\n<p>第五步，记录结果。断言满足，测试方法通过；不满足，断言抛出失败信号，报告记录失败方法与两侧取值。所有方法跑完后汇总通过与失败数量。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：函数或类有明确输入输出、需要反复回归核对时编写单元测试；一个测试方法覆盖一种情形。\n<\/li><li>\n边界一：测试方法必须以 <code>test_<\/code> 打头才会被运行；辅助准备代码放 setUp 或普通方法。\n<\/li><li>\n边界二：断言核对的是实际返回值；被测函数不 return 时，拿到 None，断言自然失败。\n<\/li><li>\n边界三：setUp 为每个测试方法新建对象，避免上一个测试改动残留到下一个测试。\n<\/li><li>\n失败案例：测试只覆盖正常输入，边界值、缺失参数、异常分支没有断言，改坏这些路径时测试仍全绿。\n<\/li><li>\n失败案例：多个测试方法共用同一个在类层级创建的对象，前一个测试的修改残留，后一个测试结果不稳定。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>单元测试 vs 手工验证<\/strong>：手测临时敲输入，不可重复；测试代码固化输入与预期，每次自动运行，可纳入回归检查。\n<\/li><li>\n<strong>setUp vs <code>__init__<\/code><\/strong>：setUp 由框架在每个测试方法前调用，保证对象独立；测试类不是靠 <code>__init__<\/code> 建被测对象。\n<\/li><li>\n<strong>断言 vs print 核对<\/strong>：print 只把值显示出来供人眼判断；断言自动判定相等与否，失败时进入测试报告。\n<\/li><li>\n<strong>单元测试 vs 整体验证<\/strong>：单元测试针对单个函数或类的行为；多个模块协同的端到端流程需要另外的集成验证，二者覆盖范围不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c06 函数返回值是断言核对的对象；c08 继承机制在测试类上直接使用，<code>NamesTestCase<\/code> 继承 <code>TestCase<\/code> 获得断言方法；c09 文件读写与异常处理函数同样可被测试方法调用核对。后继：第二部分项目迭代时，测试作为改动后的回归检查；先有可被调用、有明确返回值的函数，才有可断言的单元测试。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（单元测试、断言方法与 setUp 复用）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：测试框架扫描、断言比对与 setUp 隔离复用<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把“测试怎样被自动运行、断言怎样判定成败、共用对象为什么互不残留”讲到可推演，先往回追四层前提：<\/p>\n<ol><li>\n<strong>被测对象有明确返回值<\/strong>。单元测试核对的是函数或方法交出的结果；没有 return 的过程式代码，缺少可断言的返回值。\n<\/li><li>\n<strong>测试类由框架驱动<\/strong>。继承 TestCase 后，框架识别测试类、扫描测试方法、按顺序运行并汇总结果；断言方法来自父类。\n<\/li><li>\n<strong>方法名前缀是运行标记<\/strong>：<code>test_<\/code> 打头的方法被框架当作测试；其余方法是辅助代码，不自动运行。\n<\/li><li>\n<strong>每个测试独立起步<\/strong>：setUp 在每个测试方法前重建共用对象，测试之间的改动不残留，结果可重复。\n<\/ol>\n<p>依赖链方向：可断言的返回值 → TestCase 继承 → test_ 前缀扫描 → setUp 独立建对象 → 断言比对与报告。任何一层前提缺失，就会写出不被运行的测试，或让测试结果受上一个测试污染。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：导入被测代码与框架<\/h3>\n<p><code>import unittest<\/code> 载入测试框架；<code>from name_function import get_formatted_name<\/code> 载入被测函数。测试文件与被测模块在同一可导入路径下。<\/p>\n<h3>第二步：定义测试类并继承<\/h3>\n<p><code>class NamesTestCase(unittest.TestCase):<\/code> 建立继承关系；子类实例沿链获得 <code>assertEqual<\/code>、<code>assertIn<\/code> 等断言方法。类名只起标识作用，约定含 Test。<\/p>\n<h3>第三步：框架扫描 test_ 方法<\/h3>\n<p><code>unittest.main()<\/code> 启动框架：遍历测试类的方法名，以 <code>test_<\/code> 开头的列入运行清单；其他名称的方法跳过。清单中的方法逐个执行。<\/p>\n<h3>第四步：setUp 先行<\/h3>\n<p>每个测试方法运行前，框架调用一次 <code>setUp()<\/code>；在 setUp 中通过 <code>self.属性名<\/code> 建好的对象，挂到当前测试实例上。下一个测试方法运行前 setUp 再跑一遍，新建一套对象。<\/p>\n<h3>第五步：调用被测函数<\/h3>\n<p>测试方法内调用被测函数，传入测试输入，把返回值存入局部变量。输入可以是正常情形、边界情形或预期触发错误的情形。<\/p>\n<h3>第六步：断言比对<\/h3>\n<p>断言方法接收实际值与预期值：<code>assertEqual<\/code> 核对两者相等；相等则该断言通过，方法继续；不等则断言记录失败，保存两侧取值，方法标记失败。其他断言方法分别核对成员归属、真假、大小关系等。<\/p>\n<h3>第七步：汇总报告<\/h3>\n<p>全部测试方法跑完，框架统计通过与失败数量；失败项列出方法名、实际值与预期值。断言未触发不代表程序无缺陷，只说明覆盖到的情形符合预期。<\/p>\n<h2>算例一：姓名格式化测试的执行流程<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>import unittest\nfrom name_function import get_formatted_name\n\nclass NamesTestCase(unittest.TestCase):\n    def test_first_last_name(self):\n        formatted_name = get_formatted_name(&#x27;janis&#x27;, &#x27;joplin&#x27;)\n        self.assertEqual(formatted_name, &#x27;Janis Joplin&#x27;)\n\nunittest.main()<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n框架扫描 <code>NamesTestCase<\/code>，<code>test_first_last_name<\/code> 以 <code>test_<\/code> 打头，列入清单。\n<\/li><li>\n运行该方法：调用 <code>get_formatted_name(&#x27;janis&#x27;, &#x27;joplin&#x27;)<\/code>，返回值存入 <code>formatted_name<\/code>。\n<\/li><li>\n<code>assertEqual<\/code> 比对：实际 <code>&#x27;Janis Joplin&#x27;<\/code>，预期 <code>&#x27;Janis Joplin&#x27;<\/code>，相等，断言通过。\n<\/li><li>\n清单清空，报告该测试通过。\n<\/li><li>\n对照：若函数返回 <code>&#x27;Janis joplin&#x27;<\/code>（姓首字母未大写），断言不等，失败报告给出实际值与预期值两侧文本。\n<\/ol>\n<h2>算例二：断言通过与失败的两侧取值对照<\/h2>\n<p>被测函数 <code>get_formatted_name(first, last)<\/code> 预期拼接为首字母大写的全名。<\/p>\n<ol><li>\n输入 <code>&#x27;janis&#x27;<\/code>、<code>&#x27;joplin&#x27;<\/code>，实际 <code>&#x27;Janis Joplin&#x27;<\/code>，预期 <code>&#x27;Janis Joplin&#x27;<\/code>：相等，通过。\n<\/li><li>\n输入 <code>&#x27;wolfgang&#x27;<\/code>、<code>&#x27;mozart&#x27;<\/code>，若实际 <code>&#x27;Wolfgang mozart&#x27;<\/code>，预期 <code>&#x27;Wolfgang Mozart&#x27;<\/code>：<code>assertEqual<\/code> 判定不等，失败记录实际值与预期值。\n<\/li><li>\n成员断言：若被测方法向列表追加选项，用 <code>assertIn(&#x27;python&#x27;, options)<\/code> 核对值在列表中；不在则失败。\n<\/li><li>\n真假断言：核对某状态为真或为假，使用对应真假断言方法；把布尔判断写进 <code>assertEqual(x, True)<\/code> 也可，但专用断言给出的失败提示更直接。\n<\/ol>\n<h2>算例三：setUp 复用调查类测试<\/h2>\n<p>参照第 11.2 节的 <code>AnonymousSurvey<\/code>：<\/p>\n<pre class=\"lang-python\"><code>class TestSurvey(unittest.TestCase):\n    def setUp(self):\n        self.survey = AnonymousSurvey(&quot;What language do you like?&quot;)\n        self.responses = [&#x27;python&#x27;, &#x27;c&#x27;, &#x27;ruby&#x27;]\n\n    def test_store_single_response(self):\n        self.survey.store_response(&#x27;english&#x27;)\n        self.assertIn(&#x27;english&#x27;, self.survey.responses)\n\n    def test_store_three_responses(self):\n        for response in self.responses:\n            self.survey.store_response(response)\n        for response in self.responses:\n            self.assertIn(response, self.survey.responses)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n运行 <code>test_store_single_response<\/code> 前，setUp 新建 <code>self.survey<\/code> 与 <code>self.responses<\/code>。\n<\/li><li>\n方法内存入 <code>&#x27;english&#x27;<\/code>，断言它在调查响应列表中。\n<\/li><li>\n该方法结束，实例丢弃；运行 <code>test_store_three_responses<\/code> 前，setUp 再次新建一套对象。\n<\/li><li>\n第二个方法存入三条响应并逐条断言；第一个方法留下的 <code>&#x27;english&#x27;<\/code> 不在新对象中，不产生残留。\n<\/li><li>\n对照：若把 <code>self.survey<\/code> 在类层级创建一次，两个测试方法共用同一对象，第一个方法存入的响应会出现在第二个方法的列表里，结果不稳定。\n<\/ol>\n<h2>算例四：测试方法前缀扫描对照<\/h2>\n<p>同一测试类中两个方法：<\/p>\n<pre class=\"lang-python\"><code>class DemoTestCase(unittest.TestCase):\n    def test_addition(self):\n        self.assertEqual(1 + 1, 2)\n\n    def check_multiplication(self):\n        self.assertEqual(2 * 3, 6)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n框架扫描方法名：<code>test_addition<\/code> 符合前缀，运行并通过；<code>check_multiplication<\/code> 不符合前缀，不进入运行清单。\n<\/li><li>\n即使乘法实现写错，报告中也不会出现该方法的失败记录。\n<\/li><li>\n修正：辅助逻辑可保留为普通方法，需要被测试的情形一律以 <code>test_<\/code> 命名。\n<\/ol>\n<h2>算例五：无返回值函数的断言失败<\/h2>\n<p>被测函数写成只打印不返回：<\/p>\n<pre class=\"lang-python\"><code>def greet(name):\n    print(&quot;Hello, &quot; + name)<\/code><\/pre>\n<p>测试：<\/p>\n<pre class=\"lang-python\"><code>def test_greet(self):\n    result = greet(&#x27;eric&#x27;)\n    self.assertEqual(result, &#x27;Hello, eric&#x27;)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n调用 <code>greet(&#x27;eric&#x27;)<\/code>，函数内 print 显示文本，但无 return，返回 <code>None<\/code>。\n<\/li><li>\n<code>result<\/code> 绑到 <code>None<\/code>；<code>assertEqual(None, &#x27;Hello, eric&#x27;)<\/code> 不等，测试失败。\n<\/li><li>\n修正方向：函数把拼好的字符串 return 出来，测试才能核对返回值；只想核对显示内容，需要另外的输出捕获手段，不在本书展开。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：测试方法不带 test_ 前缀。<\/strong> 框架不扫描，缺陷不进入报告。复盘：检查运行清单中是否包含预期方法。<\/p>\n<p><strong>案例 2：被测函数不返回值。<\/strong> 测试拿到 None，断言失败；需要可核对的结果，函数应 return。<\/p>\n<p><strong>案例 3：测试间对象残留。<\/strong> 共用类层级对象，前一测试的修改影响后一测试。共用对象放 setUp，每个测试重建。<\/p>\n<p><strong>案例 4：测试覆盖不全。<\/strong> 只测正常输入，边界值、异常路径未断言；改坏这些路径时测试仍全绿。复盘：为边界与错误分支补测试方法。<\/p>\n<p><strong>案例 5：断言方法与数据类型不匹配。<\/strong> 用相等断言核对成员归属，失败提示读不懂；应按核对目的选成员断言、真假断言或相等断言。<\/p>\n<p><strong>案例 6：测试方法之间依赖执行顺序。<\/strong> 后一个测试假设前一个测试留下的状态，调换运行顺序就失败。每个测试应在 setUp 中自建所需对象，彼此独立。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：测试类必须继承哪个类？答：<code>unittest.TestCase<\/code>，由此获得断言方法。\n<\/li><li>\n问：哪些方法会被框架自动运行？答：以 <code>test_<\/code> 打头的方法。\n<\/li><li>\n问：setUp 在什么时候运行？答：每个测试方法运行前各执行一次。\n<\/li><li>\n问：断言不满足时发生什么？答：该测试方法记为失败，报告给出实际值与预期值。\n<\/li><li>\n问：setUp 里建的对象为什么互不残留？答：每个测试方法前重新跑 setUp，新建独立对象。\n<\/li><li>\n问：测试全绿能证明程序没有缺陷吗？答：不能，只说明被断言覆盖的情形符合预期。\n<\/li><li>\n问：被测函数不 return，断言会拿到什么？答：None。\n<\/li><li>\n问：测试之间为什么不能依赖先后顺序？答：每个测试由 setUp 独立起步，顺序调换后共享状态不应残留。\n<\/li><li>\n问：失败报告里除了方法名还有什么？答：实际值与预期值两侧取值，便于定位差异。\n<\/li><li>\n问：一个测试方法可以包含多条断言吗？答：可以，多条断言依次核对；任一条不满足该方法即记为失败。\n<\/li><li>\n问：setUp 中创建的对象挂在哪里供测试方法使用？答：挂到 <code>self<\/code> 上，测试方法经 <code>self<\/code> 属性访问。\n<\/ul>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出针对 <code>get_formatted_name(&#x27;janis&#x27;, &#x27;joplin&#x27;)<\/code> 的测试类骨架，标明导入语句、继承关系与测试方法名前缀。\n<\/li><li>\n两个测试方法都需要一个 <code>Survey<\/code> 实例，为什么放在 setUp 而不是类层级创建？\n<\/li><li>\n测试方法命名为 <code>verify_name()<\/code> 会被运行吗？怎样改才能进入测试清单？\n<\/li><li>\n断言 <code>assertEqual(result, &#x27;Eric&#x27;)<\/code> 失败时，报告里能看到哪两侧取值？\n<\/li><li>\n一个函数只在屏幕打印结果，测试想核对输出内容会遇到什么困难？函数应怎样改才便于断言？\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：把数据组织起来：变量、列表、字典<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 2、3、4、6 章：变量、列表与字典——程序怎样组织一批数据<\/a><br>检查点：能画出变量名指向对象的绑定关系，说出列表切片的起止边界，用字典按键取回对应值，并指出把可变对象当默认值会踩到什么坑<\/li><li class='path-step' id='path-02'><strong>步骤 02：让程序按条件走：if 分支与 while 输入循环<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 5、7 章：if 条件分支与 while 用户输入循环<\/a><br>检查点：能把一个多档判断写成 if-elif-else 链，用 input() 取文本并转成数值，用标志与 break 控制退出，说明 continue 与 break 的差别<\/li><li class='path-step' id='path-03'><strong>步骤 03：把代码块成函数与类<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 8、9 章：函数与类——把重复动作和成可复用结构<\/a><br>检查点：能定义带默认值与返回值的函数并区分位置参数与关键字参数；能解释实例化时 __init__ 做了什么，顺着实例属性链找到方法，写出子类并重写父类方法<\/li><li class='path-step' id='path-04'><strong>步骤 04：落地与兜底：文件、异常、JSON 与单元测试<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 10、11 章：文件、异常、JSON 持久化与测试代码<\/a><br>检查点：能用 with open 读入与写入文本文件，按异常类型写 try-except-else 分支，用 json.dump/json.load 保存列表，并用 TestCase 断言方法核对函数返回值<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='变量（variable）'>变量（variable） — 一个名字，解释器把它与某个对象绑定；程序运行时名字记录的是最新绑定的对象，重新赋值会改变绑定目标而不是改写旧对象的内容（不可变对象情形） <span class=glossary-ref>（第 2、3、4、6 章：变量、列表与字典——程序怎样组织一批数据）<\/span><\/li><li data-term='可变对象 / 不可变对象（mutable / immutable）'>可变对象 / 不可变对象（mutable / immutable） — 列表、字典可在原地增删改元素；字符串、数字、元组不能原地修改，任何“改动”都会生成新对象并把名字重新绑定过去 <span class=glossary-ref>（第 2、3、4、6 章：变量、列表与字典——程序怎样组织一批数据）<\/span><\/li><li data-term='列表索引（index）'>列表索引（index） — 元素在列表中的位置编号，从 0 开始；最后一个元素可写 -1，越界访问会触发 IndexError <span class=glossary-ref>（第 2、3、4、6 章：变量、列表与字典——程序怎样组织一批数据）<\/span><\/li><li data-term='切片（slice）'>切片（slice） — 形如 list[start:end] 的取值写法，包含 start 位置的元素，不包含 end 位置的元素；两端省略时分别取到开头与结尾 <span class=glossary-ref>（第 2、3、4、6 章：变量、列表与字典——程序怎样组织一批数据）<\/span><\/li><li data-term='键—值对（key-value pair）'>键—值对（key-value pair） — 字典中由冒号连接的一对关联数据：指定键即可取回对应的值；同一字典中键不能重复，重复赋值会覆盖旧值 <span class=glossary-ref>（第 2、3、4、6 章：变量、列表与字典——程序怎样组织一批数据）<\/span><\/li><li data-term='条件测试（conditional test）'>条件测试（conditional test） — 求值结果为 True 或 False 的表达式，用 ==、!=、&gt;、&lt;、and、or、in、not in 等比较与组合；它是 if 分支选择走哪条路的依据 <span class=glossary-ref>（第 5、7 章：if 条件分支与 while 用户输入循环）<\/span><\/li><li data-term='标志（flag）'>标志（flag） — 一个取值 True/False 的变量，用来记录程序是否处于应继续运行的状态；循环每轮先检查标志，为 False 时退出 <span class=glossary-ref>（第 5、7 章：if 条件分支与 while 用户输入循环）<\/span><\/li><li data-term='break 与 continue'>break 与 continue — break 立即跳出所在循环；continue 跳过本轮剩余语句，直接回到循环条件判断处进入下一轮 <span class=glossary-ref>（第 5、7 章：if 条件分支与 while 用户输入循环）<\/span><\/li><li data-term='位置参数 / 关键字参数'>位置参数 / 关键字参数 — 位置参数按调用时的顺序与形参对应；关键字参数以 形参名=值 的形式传入，与书写顺序无关 <span class=glossary-ref>（第 8、9 章：函数与类——把重复动作和成可复用结构）<\/span><\/li><li data-term='实例（instance）'>实例（instance） — 按类模板创建出的具体对象；类定义属性与行为，每个实例各自保存一份属性值，方法通过 self 访问本实例 <span class=glossary-ref>（第 8、9 章：函数与类——把重复动作和成可复用结构）<\/span><\/li><li data-term='异常（exception）'>异常（exception） — 运行出错时解释器创建的特殊对象；用 try-except 捕获指定类型异常后程序可继续执行，未被捕获则沿调用栈向上传播并终止 <span class=glossary-ref>（第 10、11 章：文件、异常、JSON 持久化与测试代码）<\/span><\/li><li data-term='断言方法（assert method）'>断言方法（assert method） — unittest.TestCase 提供的核对手段，如 assertEqual、assertIn；实际值与预期不符时测试方法记为失败并给出报告 <span class=glossary-ref>（第 10、11 章：文件、异常、JSON 持久化与测试代码）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>Python 编程：从入门到实践 · 常用模式库<\/h1>\n<h2>模式 1：按键组织属性（字典记录）<\/h2>\n<ul><li>\n<strong>触发<\/strong>：一个事物有多条带名称的属性，后续要按名称查找，而不是按位置排队。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n用花括号写出键—值对，键取描述性名称；\n<\/li><li>\n取值时按键访问，缺键先判断或使用容错取值；\n<\/li><li>\n新属性直接对新键赋值；已有键再赋值即覆盖；\n<\/li><li>\n多条同类事物组成字典列表，遍历时先取字典再按键取值。\n<\/li><li>\n<strong>落点<\/strong>：外星人属性、用户资料、调查问卷答复等结构。\n<\/li><li>\n<strong>边界<\/strong>：键必须可哈希，列表不能做键；值可以是列表或字典，嵌套取值逐层给键；遍历过程中不增删键。\n<\/ol>\n<\/ul>\n<h2>模式 2：多档条件分发（if-elif-else 链）<\/h2>\n<ul><li>\n<strong>触发<\/strong>：同一输入按互斥档位走不同分支，如分数评级、颜色对应动作、区间判断。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n先写最容易判定的高档或边界清晰的一档 <code>if<\/code>；\n<\/li><li>\n其余档位依次 <code>elif<\/code>，每档写清比较符是否带等号；\n<\/li><li>\n所有未命中情形收束到 <code>else<\/code>；\n<\/li><li>\n核对边界值落在哪一档，确认条件区间互不交叉。\n<\/li><li>\n<strong>落点<\/strong>：评级、分类、菜单选择、状态提示。\n<\/li><li>\n<strong>边界<\/strong>：并列需求（同一对象可同时贴多个标签）用多条独立 if，不用 elif 链；条件位置写 <code>==<\/code> 不是 <code>=<\/code>；数值与文本先统一类型再比较。\n<\/ol>\n<\/ul>\n<h2>模式 3：条件驱动循环收集（while + 标志 + 输入）<\/h2>\n<ul><li>\n<strong>触发<\/strong>：重复次数由用户决定或由集合是否清空决定，需要反复接收输入、填充列表或字典。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n设标志变量初始为 True，或用待处理列表是否为空作条件；\n<\/li><li>\n循环体内 <code>input()<\/code> 取文本，需要数值时 <code>int()<\/code> 转换；\n<\/li><li>\n命中退出条件时翻转标志或执行 <code>break<\/code>；\n<\/li><li>\n收集到的数据追加进列表或写入字典；\n<\/li><li>\n每轮确认条件相关变量被更新，避免原地打转。\n<\/li><li>\n<strong>落点<\/strong>：受访者收集、配料录入、名单搬运、反复查询直到退出。\n<\/li><li>\n<strong>边界<\/strong>：<code>continue<\/code> 只跳本轮，不能当退出；输入文本未转换直接比较会报 TypeError；边遍历边按值删除重复元素要倒序或先收集待删项。\n<\/ol>\n<\/ul>\n<h2>模式 4：数据与行为封装（类 + <code>__init__<\/code> + self）<\/h2>\n<ul><li>\n<strong>触发<\/strong>：一批对象具有相同结构与行为，各自持有不同数据；动作需要读写这批属性。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n写类名，<code>__init__<\/code> 接收创建实例时的参数；\n<\/li><li>\n用 <code>self.属性名 = 参数<\/code> 把值存到实例；\n<\/li><li>\n定义方法，首参为 <code>self<\/code>，方法内经 <code>self.属性名<\/code> 访问本实例数据；\n<\/li><li>\n按类名造出实例，用实例调用方法；\n<\/li><li>\n需要校验规则时，把修改属性的动作收进方法内部。\n<\/li><li>\n<strong>落点<\/strong>：小狗、汽车、餐馆、用户等实体建模；游戏中的飞船、子弹、外星人。\n<\/li><li>\n<strong>边界<\/strong>：属性必须挂到 <code>self<\/code>，局部变量帧结束即消失；方法首参不能漏 <code>self<\/code>；访问未初始化属性抛 AttributeError；两个实例属性互不影响。\n<\/ol>\n<\/ul>\n<h2>模式 5：出错兜底分支（try-except-else）<\/h2>\n<ul><li>\n<strong>触发<\/strong>：操作可能因外部输入、文件缺失或非法数值失败，不希望一个错误让整个程序崩溃。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n把可能出错的语句放进 <code>try<\/code> 块；\n<\/li><li>\n按具体异常类型写 <code>except<\/code>，兜底分支给出友好提示或替代处理；\n<\/li><li>\n依赖成功结果的语句放 <code>else<\/code>；\n<\/li><li>\n确认 except 类型与报错提示一致，不使用宽泛捕获；\n<\/li><li>\n文件操作配合 <code>with<\/code>，保证异常跳出时也关闭文件。\n<\/li><li>\n<strong>落点<\/strong>：除零、文件不存在、文本转数值、用户输入校验。\n<\/li><li>\n<strong>边界<\/strong>：except 接不住的异常沿调用栈向上传播；宽泛 <code>except:<\/code> 会吞掉拼写错误等其他问题；异常处理不消除错误本身，只定义出错后的路径。\n<\/ol>\n<\/ul>\n<h2>模式 6：可回归核对（TestCase + test_ + setUp）<\/h2>\n<ul><li>\n<strong>触发<\/strong>：函数或类有明确输入输出，改动后需要重复核对有没有改坏。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n导入 <code>unittest<\/code> 与被测函数；\n<\/li><li>\n写继承 <code>unittest.TestCase<\/code> 的测试类；\n<\/li><li>\n以 <code>test_<\/code> 前缀命名测试方法，一个方法覆盖一种情形；\n<\/li><li>\n调用被测函数保存返回值，用断言方法核对实际值与预期值；\n<\/li><li>\n多个测试共用的对象放 <code>setUp<\/code>，每个测试方法前自动重建。\n<\/li><li>\n<strong>落点<\/strong>：格式化函数、调查类、计算方法的回归测试。\n<\/li><li>\n<strong>边界<\/strong>：不带 <code>test_<\/code> 前缀的方法不被运行；被测函数不 return 时断言拿到 None；测试只覆盖写到的情形，未触及路径仍可能有缺陷；测试之间不共享残留状态。\n<\/ol>\n<\/ul>", "__cheatsheet__": "<h1>Python 编程：从入门到实践 · 速查表<\/h1>\n<h2>1. 变量、对象与绑定<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>写法<\/th><th>作用<\/th><th>注意点<\/th><\/tr><\/thead><tbody><tr><td><code>x = 10<\/code><\/td><td>把名字 <code>x<\/code> 绑到整数对象 10<\/td><td>重新赋值改绑目标，不改旧对象<\/td><\/tr><tr><td><code>y = x<\/code><\/td><td><code>y<\/code> 与 <code>x<\/code> 绑到同一对象（别名）<\/td><td>可变对象原地修改两边都看到<\/td><\/tr><tr><td><code>s = s + &quot;d&quot;<\/code><\/td><td>字符串拼接生成新串，<code>s<\/code> 改绑新对象<\/td><td>字符串不可变，不能 <code>s[0] = &#x27;X&#x27;<\/code><\/td><\/tr><tr><td><code>b = a[:]<\/code><\/td><td>切片生成新列表<\/td><td>嵌套子列表仍共享（浅复制）<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>2. 列表常用操作<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>操作<\/th><th>写法<\/th><th>结果 / 边界<\/th><\/tr><\/thead><tbody><tr><td>索引取值<\/td><td><code>names[0]<\/code>、<code>names[-1]<\/code><\/td><td>合法索引 <code>0 … len-1<\/code>，越界抛 IndexError<\/td><\/tr><tr><td>切片<\/td><td><code>names[1:4]<\/code><\/td><td>含头不含尾，个数 <code>end-start<\/code>，返回新列表<\/td><\/tr><tr><td>末尾追加<\/td><td><code>names.append(&#x27;amy&#x27;)<\/code><\/td><td>旧元素编号不变<\/td><\/tr><tr><td>中间插入<\/td><td><code>names.insert(0, &#x27;amy&#x27;)<\/code><\/td><td>其后元素后移一位<\/td><\/tr><tr><td>按索引删除<\/td><td><code>names.pop(0)<\/code><\/td><td>返回被删元素，其后元素前移<\/td><\/tr><tr><td>按值删除<\/td><td><code>names.remove(&#x27;amy&#x27;)<\/code><\/td><td>只删第一个匹配项<\/td><\/tr><tr><td>长度<\/td><td><code>len(names)<\/code><\/td><td>元素个数<\/td><\/tr><tr><td>遍历<\/td><td><code>for n in names:<\/code><\/td><td>循环变量依次绑到每个元素<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>3. 字典常用操作<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>操作<\/th><th>写法<\/th><th>结果 / 边界<\/th><\/tr><\/thead><tbody><tr><td>创建<\/td><td><code>d = {&#x27;color&#x27;: &#x27;green&#x27;, &#x27;points&#x27;: 5}<\/code><\/td><td>花括号，键值对逗号分隔<\/td><\/tr><tr><td>按键取值<\/td><td><code>d[&#x27;color&#x27;]<\/code><\/td><td>缺键抛 KeyError<\/td><\/tr><tr><td>新增 / 覆盖<\/td><td><code>d[&#x27;x&#x27;] = 0<\/code><\/td><td>键存在则覆盖，不存在则新增<\/td><\/tr><tr><td>遍历键值<\/td><td><code>for k, v in d.items():<\/code><\/td><td>同时取键与值<\/td><\/tr><tr><td>遍历键<\/td><td><code>for k in d.keys():<\/code><\/td><td>成员判断默认查键<\/td><\/tr><tr><td>遍历值<\/td><td><code>for v in d.values():<\/code><\/td><td>值可能重复<\/td><\/tr><tr><td>可哈希键<\/td><td>字符串、数字、元组<\/td><td>列表、字典不能做键<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>4. 分支与循环<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>结构<\/th><th>写法<\/th><th>要点<\/th><\/tr><\/thead><tbody><tr><td>单分支<\/td><td><code>if test:<\/code><\/td><td>条件求值为 True 才执行块<\/td><\/tr><tr><td>多档<\/td><td><code>if … elif … else:<\/code><\/td><td>自上而下命中首条成立者，随后跳出<\/td><\/tr><tr><td>逻辑组合<\/td><td><code>a and b<\/code>、<code>a or b<\/code>、<code>not a<\/code><\/td><td>and/or 左侧已定结果时右侧短路<\/td><\/tr><tr><td>成员判断<\/td><td><code>x in names<\/code>、<code>x not in d<\/code><\/td><td>字典默认查键<\/td><\/tr><tr><td>条件循环<\/td><td><code>while active:<\/code><\/td><td>每轮重新求值条件<\/td><\/tr><tr><td>立即退出<\/td><td><code>break<\/code><\/td><td>跳出所在循环<\/td><\/tr><tr><td>跳过本轮<\/td><td><code>continue<\/code><\/td><td>回到条件判断处<\/td><\/tr><tr><td>取文本<\/td><td><code>msg = input(&quot;提示：&quot;)<\/code><\/td><td>返回字符串，数值用 <code>int()<\/code> 转换<\/td><\/tr><tr><td>求模<\/td><td><code>n % 2<\/code><\/td><td>余数 0 偶数，1 奇数<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 函数<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>要素<\/th><th>写法<\/th><th>要点<\/th><\/tr><\/thead><tbody><tr><td>定义<\/td><td><code>def f(name, age=18):<\/code><\/td><td>定义时不执行，调用时才建帧<\/td><\/tr><tr><td>位置参数<\/td><td><code>f(&#x27;eric&#x27;, 20)<\/code><\/td><td>按顺序绑定<\/td><\/tr><tr><td>关键字参数<\/td><td><code>f(age=20, name=&#x27;eric&#x27;)<\/code><\/td><td>按形参名绑定，位置参数须在前<\/td><\/tr><tr><td>返回值<\/td><td><code>return full_name<\/code><\/td><td>无 return 返回 <code>None<\/code><\/td><\/tr><tr><td>可变默认值<\/td><td>默认值用 <code>None<\/code>，函数体内新建<\/td><td>可变默认对象多次调用共享<\/td><\/tr><tr><td>传参<\/td><td>实参绑到形参<\/td><td>原地修改穿透帧，重新绑定形参不穿透<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>6. 类与继承<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>要素<\/th><th>写法<\/th><th>要点<\/th><\/tr><\/thead><tbody><tr><td>定义类<\/td><td><code>class Dog():<\/code><\/td><td>类名约定首字母大写<\/td><\/tr><tr><td>初始化<\/td><td><code>def __init__(self, name):<\/code><\/td><td>实例化时自动运行<\/td><\/tr><tr><td>实例属性<\/td><td><code>self.name = name<\/code><\/td><td>挂在实例上，各实例独立<\/td><\/tr><tr><td>方法<\/td><td><code>def sit(self):<\/code><\/td><td>首参 <co /* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

function initQuizzes(rid){

      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();

        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  if(typeof vis !== 'undefined'){ networkLoaded = true; cb(); return; }
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE) { cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库未加载：离线构建请加 <code>--offline all</code>，或联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

function getMastery(cid){
  if(!cid) return 0.5;
  const m = (state.mastery||{})[cid];
  return m !== undefined ? m : 0.3;
}
function updateMastery(cid, delta){
  if(!cid) return;
  if(!state.mastery) state.mastery = {};
  const cur = state.mastery[cid] !== undefined ? state.mastery[cid] : 0.3;
  state.mastery[cid] = Math.max(0, Math.min(1, cur + delta));
  store.set('mastery', state.mastery);
}

}

/* ---------- 搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIndex = null;
let pendingHl = [];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP = new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                        '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                        '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw = q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out = [];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length > 2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low = text.toLowerCase();
  let pos = -1, hit = '';
  for(const t of terms){ const i = low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start = Math.max(0, (pos<0?0:pos) - 60);
  const end = Math.min(text.length, (pos<0?0:pos) + 140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms = pendingHl.slice(); pendingHl = [];
  if(!terms.length) return;
  const root = $('#view'); if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first = null, idx = -1, term = '';
  while((node = walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low = node.nodeValue.toLowerCase();
    for(const t of terms){
      const i = low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){
        first = node; idx = i; term = t;
      }
    }
  }
  if(!first) return;
  try{
    const i = first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range = document.createRange();
    range.setStart(first, i); range.setEnd(first, i+term.length);
    const mark = document.createElement('mark');
    mark.className = 'hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'), 1800);
  }catch(e){}
}
document.addEventListener('click', (e)=>{
  const a = (e.target && e.target.closest) ? e.target.closest('.search-hit a') : null;
  if(a && a.dataset.hl) pendingHl = tokenizeQuery(a.dataset.hl);
});
function searchHref(id){
  const map = {'__path__':'#/path','__diagnosis__':'#/diagnosis','__graph__':'#/graph',
               '__cards__':'#/cards','__glossary__':'#/glossary','__patterns__':'#/patterns',
               '__cheatsheet__':'#/cheatsheet'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '#/quiz/'+id.replace('__quiz_','').replace(/__$/,'');
  if(id.startsWith('__')) return '';
  return '#/'+id;
}
function searchLabel(id){
  if((manifest.chapters||[]).some(c=>c.id===id)) return '章节：'+id;
  if((manifest.concepts||[]).some(c=>c.id===id)) return '概念：'+id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '测验';
  return id;
}
function pageTitle(id){
  const ch = (manifest.chapters||[]).find(c=>c.id===id);
  if(ch) return ch.title || id;
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp) return cp.title || id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')){
    const q = (manifest.quizzes||[]).find(x=>'__quiz_'+x.id===id);
    return q ? '测验 · '+String(q.question||'').slice(0,14) : '测验';
  }
  return id;
}
function chapOf(id){
  const chs = manifest.chapters || [];
  const ci = chs.findIndex(c=>c.id===id);
  if(ci >= 0) return {key:'ch:'+id, label:chs[ci].title||id, order:ci};
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp){
    const chId = (cp.chapterIds||[])[0];
    const i = chs.findIndex(c=>c.id===chId);
    if(i >= 0) return {key:'ch:'+chId, label:chs[i].title||chId, order:i};
    return {key:'zz', label:'未归入章节', order:900};
  }
  return {key:'tools', label:'术语与工具页', order:950, ref:true};
}
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    const href = searchHref(id);
    if(!href) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, href, text, label:pageTitle(id), chap:chapOf(id)});
  });
  return searchIndex;
}
function synOf(t){
  const out = [];
  for(const g of SYN_GROUPS){ if(g.indexOf(t) >= 0){ for(const x of g){ if(x !== t) out.push(x); } } }
  return out.slice(0,6);
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim();
  if(!v){ showPage(routeIdFromHash()); return; }
  const terms = tokenizeQuery(v);
  if(!terms.length){ showPage(routeIdFromHash()); return; }
  const grams = [];
  terms.forEach(t=>{ if(t.length >= 2){ for(let i=0;i+2<=t.length;i++) grams.push(t.slice(i,i+2)); } });
  const qGrams = [...new Set(grams)].slice(0,16);
  const snippetTerms = terms.concat(...terms.map(synOf)).slice(0,24);
  const hits = [];
  buildSearchIndex().forEach(p=>{
    const low = p.text.toLowerCase();
    let tHit = 0, sHit = 0, gHit = 0, first = '', viaSyn = '';
    for(const t of terms){
      if(low.includes(t)){ tHit++; if(!first) first = t; continue; }
      for(const s of synOf(t)){
        if(low.includes(s)){ sHit++; if(!viaSyn) viaSyn = s; if(!first) first = s; break; }
      }
    }
    for(const gm of qGrams){ if(low.includes(gm)) gHit++; }
    if(tHit > 0 || sHit > 0 || gHit >= 4){
      hits.push({p, score: tHit*100 + sHit*30 + Math.min(gHit,20), first, viaSyn});
    }
  });
  hits.sort((a,b)=> b.score-a.score || a.p.text.length-b.p.text.length);
  const top = hits.slice(0,20);
  let body;
  if(top.length){
    const gs = {};
    top.forEach(h=>{
      const k = h.p.chap.key;
      (gs[k] = gs[k] || {label:h.p.chap.label, order:h.p.chap.order, ref:!!h.p.chap.ref, hits:[]}).hits.push(h);
    });
    const eff = g => Math.max(...g.hits.map(x=>x.score)) * (g.ref ? 0.55 : 1);
    const order = Object.values(gs).sort((a,b)=> eff(b)-eff(a));
    body = order.map(g=>{
      const inner = g.hits.sort((a,b)=> b.score-a.score).map(h=>
        `<div class="search-hit"><a href="${h.p.href}" data-hl="${esc(h.first)}">${esc(h.p.label)}</a>${h.viaSyn?`<span class="syn-note">同义命中：${esc(h.viaSyn)}</span>`:''}<br><span class="sub">${hlSnippet(h.p.text, snippetTerms)}</span></div>`).join('');
      return `<div class="search-group"><div class="grp-head">${esc(g.label)}<span class="grp-count">${g.hits.length}</span></div>${inner}</div>`;
    }).join('');
  } else {
    body = '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语，或减少关键词。</div>';
  }
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' + body;
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof mermaid === 'undefined') return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  if(typeof mermaid !== 'undefined'){ boot(); return; }
  const urls=['https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js',
              'https://registry.npmmirror.com/mermaid/10.9.1/files/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js'];
  let ui=0, done=false;
  const tryNext=()=>{
    if(done || ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    const timer=setTimeout(()=>{ if(done) return; s.onload=null; s.onerror=null; s.remove(); tryNext(); }, 4000);
    s.onload=()=>{ done=true; clearTimeout(timer); boot(); };
    s.onerror=()=>{ clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

/* ---------- 句级出处：点击角标弹出原句 ---------- */
let citePop = null;
function closeCite(){ if(citePop){ citePop.remove(); citePop = null; } }
function showCite(id){
  const c = (typeof SOURCES !== 'undefined') ? SOURCES[id] : null;
  if(!c) return;
  closeCite();
  citePop = document.createElement('div');
  citePop.className = 'cite-pop';
  citePop.innerHTML = '<div class="cite-head">出处' + (c.page!=='' && c.page!=null ? (' · p.'+esc(String(c.page))) : '') +
    '<button class="cite-x" aria-label="关闭">×</button></div>' +
    (c.quote ? '<blockquote>'+esc(c.quote)+'</blockquote>' : '') +
    (c.zh ? '<div class="cite-zh">'+esc(c.zh)+'</div>' : '');
  document.body.appendChild(citePop);
  citePop.querySelector('.cite-x').onclick = closeCite;
}
document.addEventListener('click', e=>{
  const t = e.target.closest('.cite');
  if(t){ e.preventDefault(); showCite(t.dataset.cite); return; }
  if(citePop && !e.target.closest('.cite-pop')) closeCite();
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeCite(); });
</script>
<script id="zs-visual-init">
(function(){
  try{
    var B=document.body, H=document.documentElement;
    if(!B.dataset.theme && !H.dataset.theme) B.dataset.theme='dark';
    var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
    var scope=document.querySelectorAll('header, .topbar, .topbar-fixed, #topbar, .sidebar, .tabs, .hdr-right, .card-actions, .card-controls, .section-title, .card .icon, .icon-label');
    for(var i=0;i<scope.length;i++){
      var w=document.createTreeWalker(scope[i],NodeFilter.SHOW_TEXT,null,false), n;
      while(n=w.nextNode()){
        if(EMOJI.test(n.nodeValue)){
          n.nodeValue=n.nodeValue.replace(EMOJI,'').replace(/[ \t]+/g,' ').replace(/^ | $/g,'');
        }
      }
    }
    var btn=document.getElementById('theme-btn')||document.getElementById('theme')||document.getElementById('themeToggle');
    function label(){
      if(!btn) return;
      var light=B.dataset.theme==='light'||H.getAttribute('data-theme')==='light'||B.dataset.theme==='';
      if(btn.textContent.trim()===''||/浅色|深色/.test(btn.textContent)) btn.textContent=light?'深色':'浅色';
    }
    label();
    if(btn){
      new MutationObserver(label).observe(B,{attributes:true,attributeFilter:['data-theme']});
      new MutationObserver(label).observe(H,{attributes:true,attributeFilter:['data-theme']});
      btn.addEventListener('click',function(){setTimeout(label,0);},true);
    }
  }catch(e){}
})();
</script>
