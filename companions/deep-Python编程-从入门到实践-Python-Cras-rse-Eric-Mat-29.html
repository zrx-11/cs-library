Python编程__从入门到实践_=_Python_Cras...rse_(Eric_Matthes)_(Z-Library).pdf · p.208<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">文件读写、异常处理与 JSON 持久化<\/a><\/span><\/div><h1>单元测试、断言方法与 setUp 复用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（原书第 11 章 §11.1–11.3，PDF 第 206–218 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>单元测试把“函数输出是否符合预期”写成继承 <code>unittest.TestCase<\/code> 的测试类；以 <code>test_<\/code> 打头的方法被框架自动运行，断言方法比对实际值与预期值，<code>setUp()<\/code> 在每个测试方法前建好共用对象。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>函数写完后手工跑几组输入核对，改一处代码又要重新手敲一遍；手测容易漏掉边界情形，出了问题不知道是哪次改动引入的。单元测试把核对标准写成可重复运行的代码：每次改动后运行测试，断言通过说明覆盖到的路径仍符合预期，失败立刻定位到哪个方法不符。困难在于：测试类为什么要继承 TestCase？哪些方法会被自动运行？断言怎样判定通过与失败？多个测试方法共用的对象为什么放在 setUp 而不是各写一遍？本概念把测试执行流程、断言比对与 setUp 复用拆开推演。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>unittest 模块<\/strong>：Python 自带的测试框架，提供测试基类、断言方法与运行入口。<\/p>\n<p><strong>测试类<\/strong>：继承 <code>unittest.TestCase<\/code> 的类，把针对同一组函数的测试方法收在一起；类名通常含 Test 字样。<\/p>\n<p><strong>测试方法<\/strong>：以 <code>test_<\/code> 打头的方法；框架扫描并逐个运行，方法名其余部分描述被测情形。<\/p>\n<p><strong>断言方法<\/strong>：TestCase 提供的核对手段，如 <code>assertEqual(实际值, 预期值)<\/code> 核对相等，<code>assertIn<\/code> 核对成员归属；不满足条件时该测试记为失败并给出两侧取值。<\/p>\n<p><strong>setUp 方法<\/strong>：在每个测试方法运行前自动执行一次，把共用的实例或数据建好；各测试方法拿到的是 setUp 新建的独立对象。<\/p>\n<p><strong>测试通过与失败<\/strong>：全部断言满足记为通过；任一断言不满足，测试方法失败，报告列出失败方法与取值对比。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>import unittest\nfrom name_function import get_formatted_name\n\nclass NamesTestCase(unittest.TestCase):\n    def test_first_last_name(self):\n        formatted_name = get_formatted_name(&#x27;janis&#x27;, &#x27;joplin&#x27;)\n        self.assertEqual(formatted_name, &#x27;Janis Joplin&#x27;)\n\nunittest.main()<\/code><\/pre>\n<p><strong>反例<\/strong>：测试方法命名为 <code>check_name()<\/code>，不以 <code>test_<\/code> 打头，框架不扫描它，写错也不会在报告中暴露。<\/p>\n<h2>原理推导：测试执行与断言比对路径<\/h2>\n<p>推演分五步。<\/p>\n<p>第一步，导入与继承。导入 <code>unittest<\/code> 与被测函数；测试类继承 <code>unittest.TestCase<\/code>，由此获得断言方法与框架识别所需的行为。<\/p>\n<p>第二步，框架扫描测试方法。运行 <code>unittest.main()<\/code> 时，框架在测试类中查找以 <code>test_<\/code> 打头的方法，逐个安排执行；不以该前缀开头的方法被视为普通辅助方法。<\/p>\n<p>第三步，setUp 建共用对象。每个测试方法运行前，框架先调用 <code>setUp()<\/code>；在其中创建的实例或数据挂到 <code>self<\/code> 上，测试方法经 <code>self<\/code> 使用。每个测试方法都重新跑一遍 setUp，对象互不干扰。<\/p>\n<p>第四步，调用被测函数并断言。测试方法内调用被测函数，把返回值存下来；断言方法把实际值与预期值比对。相等、成员归属、真假等各有对应断言方法。<\/p>\n<p>第五步，记录结果。断言满足，测试方法通过；不满足，断言抛出失败信号，报告记录失败方法与两侧取值。所有方法跑完后汇总通过与失败数量。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：函数或类有明确输入输出、需要反复回归核对时编写单元测试；一个测试方法覆盖一种情形。\n<\/li><li>\n边界一：测试方法必须以 <code>test_<\/code> 打头才会被运行；辅助准备代码放 setUp 或普通方法。\n<\/li><li>\n边界二：断言核对的是实际返回值；被测函数不 return 时，拿到 None，断言自然失败。\n<\/li><li>\n边界三：setUp 为每个测试方法新建对象，避免上一个测试改动残留到下一个测试。\n<\/li><li>\n失败案例：测试只覆盖正常输入，边界值、缺失参数、异常分支没有断言，改坏这些路径时测试仍全绿。\n<\/li><li>\n失败案例：多个测试方法共用同一个在类层级创建的对象，前一个测试的修改残留，后一个测试结果不稳定。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>单元测试 vs 手工验证<\/strong>：手测临时敲输入，不可重复；测试代码固化输入与预期，每次自动运行，可纳入回归检查。\n<\/li><li>\n<strong>setUp vs <code>__init__<\/code><\/strong>：setUp 由框架在每个测试方法前调用，保证对象独立；测试类不是靠 <code>__init__<\/code> 建被测对象。\n<\/li><li>\n<strong>断言 vs print 核对<\/strong>：print 只把值显示出来供人眼判断；断言自动判定相等与否，失败时进入测试报告。\n<\/li><li>\n<strong>单元测试 vs 整体验证<\/strong>：单元测试针对单个函数或类的行为；多个模块协同的端到端流程需要另外的集成验证，二者覆盖范围不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c06 函数返回值是断言核对的对象；c08 继承机制在测试类上直接使用，<code>NamesTestCase<\/code> 继承 <code>TestCase<\/code> 获得断言方法；c09 文件读写与异常处理函数同样可被测试方法调用核对。后继：第二部分项目迭代时，测试作为改动后的回归检查；先有可被调用、有明确返回值的函数，才有可断言的单元测试。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（单元测试、断言方法与 setUp 复用）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：测试框架扫描、断言比对与 setUp 隔离复用<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把“测试怎样被自动运行、断言怎样判定成败、共用对象为什么互不残留”讲到可推演，先往回追四层前提：<\/p>\n<ol><li>\n<strong>被测对象有明确返回值<\/strong>。单元测试核对的是函数或方法交出的结果；没有 return 的过程式代码，缺少可断言的返回值。\n<\/li><li>\n<strong>测试类由框架驱动<\/strong>。继承 TestCase 后，框架识别测试类、扫描测试方法、按顺序运行并汇总结果；断言方法来自父类。\n<\/li><li>\n<strong>方法名前缀是运行标记<\/strong>：<code>test_<\/code> 打头的方法被框架当作测试；其余方法是辅助代码，不自动运行。\n<\/li><li>\n<strong>每个测试独立起步<\/strong>：setUp 在每个测试方法前重建共用对象，测试之间的改动不残留，结果可重复。\n<\/ol>\n<p>依赖链方向：可断言的返回值 → TestCase 继承 → test_ 前缀扫描 → setUp 独立建对象 → 断言比对与报告。任何一层前提缺失，就会写出不被运行的测试，或让测试结果受上一个测试污染。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：导入被测代码与框架<\/h3>\n<p><code>import unittest<\/code> 载入测试框架；<code>from name_function import get_formatted_name<\/code> 载入被测函数。测试文件与被测模块在同一可导入路径下。<\/p>\n<h3>第二步：定义测试类并继承<\/h3>\n<p><code>class NamesTestCase(unittest.TestCase):<\/code> 建立继承关系；子类实例沿链获得 <code>assertEqual<\/code>、<code>assertIn<\/code> 等断言方法。类名只起标识作用，约定含 Test。<\/p>\n<h3>第三步：框架扫描 test_ 方法<\/h3>\n<p><code>unittest.main()<\/code> 启动框架：遍历测试类的方法名，以 <code>test_<\/code> 开头的列入运行清单；其他名称的方法跳过。清单中的方法逐个执行。<\/p>\n<h3>第四步：setUp 先行<\/h3>\n<p>每个测试方法运行前，框架调用一次 <code>setUp()<\/code>；在 setUp 中通过 <code>self.属性名<\/code> 建好的对象，挂到当前测试实例上。下一个测试方法运行前 setUp 再跑一遍，新建一套对象。<\/p>\n<h3>第五步：调用被测函数<\/h3>\n<p>测试方法内调用被测函数，传入测试输入，把返回值存入局部变量。输入可以是正常情形、边界情形或预期触发错误的情形。<\/p>\n<h3>第六步：断言比对<\/h3>\n<p>断言方法接收实际值与预期值：<code>assertEqual<\/code> 核对两者相等；相等则该断言通过，方法继续；不等则断言记录失败，保存两侧取值，方法标记失败。其他断言方法分别核对成员归属、真假、大小关系等。<\/p>\n<h3>第七步：汇总报告<\/h3>\n<p>全部测试方法跑完，框架统计通过与失败数量；失败项列出方法名、实际值与预期值。断言未触发不代表程序无缺陷，只说明覆盖到的情形符合预期。<\/p>\n<h2>算例一：姓名格式化测试的执行流程<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>import unittest\nfrom name_function import get_formatted_name\n\nclass NamesTestCase(unittest.TestCase):\n    def test_first_last_name(self):\n        formatted_name = get_formatted_name(&#x27;janis&#x27;, &#x27;joplin&#x27;)\n        self.assertEqual(formatted_name, &#x27;Janis Joplin&#x27;)\n\nunittest.main()<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n框架扫描 <code>NamesTestCase<\/code>，<code>test_first_last_name<\/code> 以 <code>test_<\/code> 打头，列入清单。\n<\/li><li>\n运行该方法：调用 <code>get_formatted_name(&#x27;janis&#x27;, &#x27;joplin&#x27;)<\/code>，返回值存入 <code>formatted_name<\/code>。\n<\/li><li>\n<code>assertEqual<\/code> 比对：实际 <code>&#x27;Janis Joplin&#x27;<\/code>，预期 <code>&#x27;Janis Joplin&#x27;<\/code>，相等，断言通过。\n<\/li><li>\n清单清空，报告该测试通过。\n<\/li><li>\n对照：若函数返回 <code>&#x27;Janis joplin&#x27;<\/code>（姓首字母未大写），断言不等，失败报告给出实际值与预期值两侧文本。\n<\/ol>\n<h2>算例二：断言通过与失败的两侧取值对照<\/h2>\n<p>被测函数 <code>get_formatted_name(first, last)<\/code> 预期拼接为首字母大写的全名。<\/p>\n<ol><li>\n输入 <code>&#x27;janis&#x27;<\/code>、<code>&#x27;joplin&#x27;<\/code>，实际 <code>&#x27;Janis Joplin&#x27;<\/code>，预期 <code>&#x27;Janis Joplin&#x27;<\/code>：相等，通过。\n<\/li><li>\n输入 <code>&#x27;wolfgang&#x27;<\/code>、<code>&#x27;mozart&#x27;<\/code>，若实际 <code>&#x27;Wolfgang mozart&#x27;<\/code>，预期 <code>&#x27;Wolfgang Mozart&#x27;<\/code>：<code>assertEqual<\/code> 判定不等，失败记录实际值与预期值。\n<\/li><li>\n成员断言：若被测方法向列表追加选项，用 <code>assertIn(&#x27;python&#x27;, options)<\/code> 核对值在列表中；不在则失败。\n<\/li><li>\n真假断言：核对某状态为真或为假，使用对应真假断言方法；把布尔判断写进 <code>assertEqual(x, True)<\/code> 也可，但专用断言给出的失败提示更直接。\n<\/ol>\n<h2>算例三：setUp 复用调查类测试<\/h2>\n<p>参照第 11.2 节的 <code>AnonymousSurvey<\/code>：<\/p>\n<pre class=\"lang-python\"><code>class TestSurvey(unittest.TestCase):\n    def setUp(self):\n        self.survey = AnonymousSurvey(&quot;What language do you like?&quot;)\n        self.responses = [&#x27;python&#x27;, &#x27;c&#x27;, &#x27;ruby&#x27;]\n\n    def test_store_single_response(self):\n        self.survey.store_response(&#x27;english&#x27;)\n        self.assertIn(&#x27;english&#x27;, self.survey.responses)\n\n    def test_store_three_responses(self):\n        for response in self.responses:\n            self.survey.store_response(response)\n        for response in self.responses:\n            self.assertIn(response, self.survey.responses)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n运行 <code>test_store_single_response<\/code> 前，setUp 新建 <code>self.survey<\/code> 与 <code>self.responses<\/code>。\n<\/li><li>\n方法内存入 <code>&#x27;english&#x27;<\/code>，断言它在调查响应列表中。\n<\/li><li>\n该方法结束，实例丢弃；运行 <code>test_store_three_responses<\/code> 前，setUp 再次新建一套对象。\n<\/li><li>\n第二个方法存入三条响应并逐条断言；第一个方法留下的 <code>&#x27;english&#x27;<\/code> 不在新对象中，不产生残留。\n<\/li><li>\n对照：若把 <code>self.survey<\/code> 在类层级创建一次，两个测试方法共用同一对象，第一个方法存入的响应会出现在第二个方法的列表里，结果不稳定。\n<\/ol>\n<h2>算例四：测试方法前缀扫描对照<\/h2>\n<p>同一测试类中两个方法：<\/p>\n<pre class=\"lang-python\"><code>class DemoTestCase(unittest.TestCase):\n    def test_addition(self):\n        self.assertEqual(1 + 1, 2)\n\n    def check_multiplication(self):\n        self.assertEqual(2 * 3, 6)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n框架扫描方法名：<code>test_addition<\/code> 符合前缀，运行并通过；<code>check_multiplication<\/code> 不符合前缀，不进入运行清单。\n<\/li><li>\n即使乘法实现写错，报告中也不会出现该方法的失败记录。\n<\/li><li>\n修正：辅助逻辑可保留为普通方法，需要被测试的情形一律以 <code>test_<\/code> 命名。\n<\/ol>\n<h2>算例五：无返回值函数的断言失败<\/h2>\n<p>被测函数写成只打印不返回：<\/p>\n<pre class=\"lang-python\"><code>def greet(name):\n    print(&quot;Hello, &quot; + name)<\/code><\/pre>\n<p>测试：<\/p>\n<pre class=\"lang-python\"><code>def test_greet(self):\n    result = greet(&#x27;eric&#x27;)\n    self.assertEqual(result, &#x27;Hello, eric&#x27;)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n调用 <code>greet(&#x27;eric&#x27;)<\/code>，函数内 print 显示文本，但无 return，返回 <code>None<\/code>。\n<\/li><li>\n<code>result<\/code> 绑到 <code>None<\/code>；<code>assertEqual(None, &#x27;Hello, eric&#x27;)<\/code> 不等，测试失败。\n<\/li><li>\n修正方向：函数把拼好的字符串 return 出来，测试才能核对返回值；只想核对显示内容，需要另外的输出捕获手段，不在本书展开。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：测试方法不带 test_ 前缀。<\/strong> 框架不扫描，缺陷不进入报告。复盘：检查运行清单中是否包含预期方法。<\/p>\n<p><strong>案例 2：被测函数不返回值。<\/strong> 测试拿到 None，断言失败；需要可核对的结果，函数应 return。<\/p>\n<p><strong>案例 3：测试间对象残留。<\/strong> 共用类层级对象，前一测试的修改影响后一测试。共用对象放 setUp，每个测试重建。<\/p>\n<p><strong>案例 4：测试覆盖不全。<\/strong> 只测正常输入，边界值、异常路径未断言；改坏这些路径时测试仍全绿。复盘：为边界与错误分支补测试方法。<\/p>\n<p><strong>案例 5：断言方法与数据类型不匹配。<\/strong> 用相等断言核对成员归属，失败提示读不懂；应按核对目的选成员断言、真假断言或相等断言。<\/p>\n<p><strong>案例 6：测试方法之间依赖执行顺序。<\/strong> 后一个测试假设前一个测试留下的状态，调换运行顺序就失败。每个测试应在 setUp 中自建所需对象，彼此独立。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：测试类必须继承哪个类？答：<code>unittest.TestCase<\/code>，由此获得断言方法。\n<\/li><li>\n问：哪些方法会被框架自动运行？答：以 <code>test_<\/code> 打头的方法。\n<\/li><li>\n问：setUp 在什么时候运行？答：每个测试方法运行前各执行一次。\n<\/li><li>\n问：断言不满足时发生什么？答：该测试方法记为失败，报告给出实际值与预期值。\n<\/li><li>\n问：setUp 里建的对象为什么互不残留？答：每个测试方法前重新跑 setUp，新建独立对象。\n<\/li><li>\n问：测试全绿能证明程序没有缺陷吗？答：不能，只说明被断言覆盖的情形符合预期。\n<\/li><li>\n问：被测函数不 return，断言会拿到什么？答：None。\n<\/li><li>\n问：测试之间为什么不能依赖先后顺序？答：每个测试由 setUp 独立起步，顺序调换后共享状态不应残留。\n<\/li><li>\n问：失败报告里除了方法名还有什么？答：实际值与预期值两侧取值，便于定位差异。\n<\/li><li>\n问：一个测试方法可以包含多条断言吗？答：可以，多条断言依次核对；任一条不满足该方法即记为失败。\n<\/li><li>\n问：setUp 中创建的对象挂在哪里供测试方法使用？答：挂到 <code>self<\/code> 上，测试方法经 <code>self<\/code> 属性访问。\n<\/ul>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出针对 <code>get_formatted_name(&#x27;janis&#x27;, &#x27;joplin&#x27;)<\/code> 的测试类骨架，标明导入语句、继承关系与测试方法名前缀。\n<\/li><li>\n两个测试方法都需要一个 <code>Survey<\/code> 实例，为什么放在 setUp 而不是类层级创建？\n<\/li><li>\n测试方法命名为 <code>verify_name()<\/code> 会被运行吗？怎样改才能进入测试清单？\n<\/li><li>\n断言 <code>assertEqual(result, &#x27;Eric&#x27;)<\/code> 失败时，报告里能看到哪两侧取值？\n<\/li><li>\n一个函数只在屏幕打印结果，测试想核对输出内容会遇到什么困难？函数应怎样改才便于断言？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "单元测试、断言方法与 setUp 复用"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：把数据组织起来：变量、列表、字典<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 2、3、4、6 章：变量、列表与字典——程序怎样组织一批数据<\/a><br>检查点：能画出变量名指向对象的绑定关系，说出列表切片的起止边界，用字典按键取回对应值，并指出把可变对象当默认值会踩到什么坑<\/li><li class='path-step' id='path-02'><strong>步骤 02：让程序按条件走：if 分支与 while 输入循环<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 5、7 章：if 条件分支与 while 用户输入循环<\/a><br>检查点：能把一个多档判断写成 if-elif-else 链，用 input() 取文本并转成数值，用标志与 break 控制退出，说明 continue 与 break 的差别<\/li><li class='path-step' id='path-03'><strong>步骤 03：把代码块成函数与类<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 8、9 章：函数与类——把重复动作和成可复用结构<\/a><br>检查点：能定义带默认值与返回值的函数并区分位置参数与关键字参数；能解释实例化时 __init__ 做了什么，顺着实例属性链找到方法，写出子类并重写父类方法<\/li><li class='path-step' id='path-04'><strong>步骤 04：落地与兜底：文件、异常、JSON 与单元测试<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 10、11 章：文件、异常、JSON 持久化与测试代码<\/a><br>检查点：能用 with open 读入与写入文本文件，按异常类型写 try-except-else 分支，用 json.dump/json.load 保存列表，并用 TestCase 断言方法核对函数返回值<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='变量（variable）'>变量（variable） — 一个名字，解释器把它与某个对象绑定；程序运行时名字记录的是最新绑定的对象，重新赋值会改变绑定目标而不是改写旧对象的内容（不可变对象情形） <span class=glossary-ref>（第 2、3、4、6 章：变量、列表与字典——程序怎样组织一批数据）<\/span><\/li><li data-term='可变对象 / 不可变对象（mutable / immutable）'>可变对象 / 不可变对象（mutable / immutable） — 列表、字典可在原地增删改元素；字符串、数字、元组不能原地修改，任何“改动”都会生成新对象并把名字重新绑定过去 <span class=glossary-ref>（第 2、3、4、6 章：变量、列表与字典——程序怎样组织一批数据）<\/span><\/li><li data-term='列表索引（index）'>列表索引（index） — 元素在列表中的位置编号，从 0 开始；最后一个元素可写 -1，越界访问会触发 IndexError <span class=glossary-ref>（第 2、3、4、6 章：变量、列表与字典——程序怎样组织一批数据）<\/span><\/li><li data-term='切片（slice）'>切片（slice） — 形如 list[start:end] 的取值写法，包含 start 位置的元素，不包含 end 位置的元素；两端省略时分别取到开头与结尾 <span class=glossary-ref>（第 2、3、4、6 章：变量、列表与字典——程序怎样组织一批数据）<\/span><\/li><li data-term='键—值对（key-value pair）'>键—值对（key-value pair） — 字典中由冒号连接的一对关联数据：指定键即可取回对应的值；同一字典中键不能重复，重复赋值会覆盖旧值 <span class=glossary-ref>（第 2、3、4、6 章：变量、列表与字典——程序怎样组织一批数据）<\/span><\/li><li data-term='条件测试（conditional test）'>条件测试（conditional test） — 求值结果为 True 或 False 的表达式，用 ==、!=、&gt;、&lt;、and、or、in、not in 等比较与组合；它是 if 分支选择走哪条路的依据 <span class=glossary-ref>（第 5、7 章：if 条件分支与 while 用户输入循环）<\/span><\/li><li data-term='标志（flag）'>标志（flag） — 一个取值 True/False 的变量，用来记录程序是否处于应继续运行的状态；循环每轮先检查标志，为 False 时退出 <span class=glossary-ref>（第 5、7 章：if 条件分支与 while 用户输入循环）<\/span><\/li><li data-term='break 与 continue'>break 与 continue — break 立即跳出所在循环；continue 跳过本轮剩余语句，直接回到循环条件判断处进入下一轮 <span class=glossary-ref>（第 5、7 章：if 条件分支与 while 用户输入循环）<\/span><\/li><li data-term='位置参数 / 关键字参数'>位置参数 / 关键字参数 — 位置参数按调用时的顺序与形参对应；关键字参数以 形参名=值 的形式传入，与书写顺序无关 <span class=glossary-ref>（第 8、9 章：函数与类——把重复动作和成可复用结构）<\/span><\/li><li data-term='实例（instance）'>实例（instance） — 按类模板创建出的具体对象；类定义属性与行为，每个实例各自保存一份属性值，方法通过 self 访问本实例 <span class=glossary-ref>（第 8、9 章：函数与类——把重复动作和成可复用结构）<\/span><\/li><li data-term='异常（exception）'>异常（exception） — 运行出错时解释器创建的特殊对象；用 try-except 捕获指定类型异常后程序可继续执行，未被捕获则沿调用栈向上传播并终止 <span class=glossary-ref>（第 10、11 章：文件、异常、JSON 持久化与测试代码）<\/span><\/li><li data-term='断言方法（assert method）'>断言方法（assert method） — unittest.TestCase 提供的核对手段，如 assertEqual、assertIn；实际值与预期不符时测试方法记为失败并给出报告 <span class=glossary-ref>（第 10、11 章：文件、异常、JSON 持久化与测试代码）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>Python 编程：从入门到实践 · 常用模式库<\/h1>\n<h2>模式 1：按键组织属性（字典记录）<\/h2>\n<ul><li>\n<strong>触发<\/strong>：一个事物有多条带名称的属性，后续要按名称查找，而不是按位置排队。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n用花括号写出键—值对，键取描述性名称；\n<\/li><li>\n取值时按键访问，缺键先判断或使用容错取值；\n<\/li><li>\n新属性直接对新键赋值；已有键再赋值即覆盖；\n<\/li><li>\n多条同类事物组成字典列表，遍历时先取字典再按键取值。\n<\/li><li>\n<strong>落点<\/strong>：外星人属性、用户资料、调查问卷答复等结构。\n<\/li><li>\n<strong>边界<\/strong>：键必须可哈希，列表不能做键；值可以是列表或字典，嵌套取值逐层给键；遍历过程中不增删键。\n<\/ol>\n<\/ul>\n<h2>模式 2：多档条件分发（if-elif-else 链）<\/h2>\n<ul><li>\n<strong>触发<\/strong>：同一输入按互斥档位走不同分支，如分数评级、颜色对应动作、区间判断。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n先写最容易判定的高档或边界清晰的一档 <code>if<\/code>；\n<\/li><li>\n其余档位依次 <code>elif<\/code>，每档写清比较符是否带等号；\n<\/li><li>\n所有未命中情形收束到 <code>else<\/code>；\n<\/li><li>\n核对边界值落在哪一档，确认条件区间互不交叉。\n<\/li><li>\n<strong>落点<\/strong>：评级、分类、菜单选择、状态提示。\n<\/li><li>\n<strong>边界<\/strong>：并列需求（同一对象可同时贴多个标签）用多条独立 if，不用 elif 链；条件位置写 <code>==<\/code> 不是 <code>=<\/code>；数值与文本先统一类型再比较。\n<\/ol>\n<\/ul>\n<h2>模式 3：条件驱动循环收集（while + 标志 + 输入）<\/h2>\n<ul><li>\n<strong>触发<\/strong>：重复次数由用户决定或由集合是否清空决定，需要反复接收输入、填充列表或字典。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n设标志变量初始为 True，或用待处理列表是否为空作条件；\n<\/li><li>\n循环体内 <code>input()<\/code> 取文本，需要数值时 <code>int()<\/code> 转换；\n<\/li><li>\n命中退出条件时翻转标志或执行 <code>break<\/code>；\n<\/li><li>\n收集到的数据追加进列表或写入字典；\n<\/li><li>\n每轮确认条件相关变量被更新，避免原地打转。\n<\/li><li>\n<strong>落点<\/strong>：受访者收集、配料录入、名单搬运、反复查询直到退出。\n<\/li><li>\n<strong>边界<\/strong>：<code>continue<\/code> 只跳本轮，不能当退出；输入文本未转换直接比较会报 TypeError；边遍历边按值删除重复元素要倒序或先收集待删项。\n<\/ol>\n<\/ul>\n<h2>模式 4：数据与行为封装（类 + <code>__init__<\/code> + self）<\/h2>\n<ul><li>\n<strong>触发<\/strong>：一批对象具有相同结构与行为，各自持有不同数据；动作需要读写这批属性。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n写类名，<code>__init__<\/code> 接收创建实例时的参数；\n<\/li><li>\n用 <code>self.属性名 = 参数<\/code> 把值存到实例；\n<\/li><li>\n定义方法，首参为 <code>self<\/code>，方法内经 <code>self.属性名<\/code> 访问本实例数据；\n<\/li><li>\n按类名造出实例，用实例调用方法；\n<\/li><li>\n需要校验规则时，把修改属性的动作收进方法内部。\n<\/li><li>\n<strong>落点<\/strong>：小狗、汽车、餐馆、用户等实体建模；游戏中的飞船、子弹、外星人。\n<\/li><li>\n<strong>边界<\/strong>：属性必须挂到 <code>self<\/code>，局部变量帧结束即消失；方法首参不能漏 <code>self<\/code>；访问未初始化属性抛 AttributeError；两个实例属性互不影响。\n<\/ol>\n<\/ul>\n<h2>模式 5：出错兜底分支（try-except-else）<\/h2>\n<ul><li>\n<strong>触发<\/strong>：操作可能因外部输入、文件缺失或非法数值失败，不希望一个错误让整个程序崩溃。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n把可能出错的语句放进 <code>try<\/code> 块；\n<\/li><li>\n按具体异常类型写 <code>except<\/code>，兜底分支给出友好提示或替代处理；\n<\/li><li>\n依赖成功结果的语句放 <code>else<\/code>；\n<\/li><li>\n确认 except 类型与报错提示一致，不使用宽泛捕获；\n<\/li><li>\n文件操作配合 <code>with<\/code>，保证异常跳出时也关闭文件。\n<\/li><li>\n<strong>落点<\/strong>：除零、文件不存在、文本转数值、用户输入校验。\n<\/li><li>\n<strong>边界<\/strong>：except 接不住的异常沿调用栈向上传播；宽泛 <code>except:<\/code> 会吞掉拼写错误等其他问题；异常处理不消除错误本身，只定义出错后的路径。\n<\/ol>\n<\/ul>\n<h2>模式 6：可回归核对（TestCase + test_ + setUp）<\/h2>\n<ul><li>\n<strong>触发<\/strong>：函数或类有明确输入输出，改动后需要重复核对有没有改坏。\n<\/li><li>\n<strong>步骤<\/strong>：\n<ol>\n<li>\n导入 <code>unittest<\/code> 与被测函数；\n<\/li><li>\n写继承 <code>unittest.TestCase<\/code> 的测试类；\n<\/li><li>\n以 <code>test_<\/code> 前缀命名测试方法，一个方法覆盖一种情形；\n<\/li><li>\n调用被测函数保存返回值，用断言方法核对实际值与预期值；\n<\/li><li>\n多个测试共用的对象放 <code>setUp<\/code>，每个测试方法前自动重建。\n<\/li><li>\n<strong>落点<\/strong>：格式化函数、调查类、计算方法的回归测试。\n<\/li><li>\n<strong>边界<\/strong>：不带 <code>test_<\/code> 前缀的方法不被运行；被测函数不 return 时断言拿到 None；测试只覆盖写到的情形，未触及路径仍可能有缺陷；测试之间不共享残留状态。\n<\/ol>\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>Python 编程：从入门到实践 · 速查表<\/h1>\n<h2>1. 变量、对象与绑定<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>写法<\/th><th>作用<\/th><th>注意点<\/th><\/tr><\/thead><tbody><tr><td><code>x = 10<\/code><\/td><td>把名字 <code>x<\/code> 绑到整数对象 10<\/td><td>重新赋值改绑目标，不改旧对象<\/td><\/tr><tr><td><code>y = x<\/code><\/td><td><code>y<\/code> 与 <code>x<\/code> 绑到同一对象（别名）<\/td><td>可变对象原地修改两边都看到<\/td><\/tr><tr><td><code>s = s + &quot;d&quot;<\/code><\/td><td>字符串拼接生成新串，<code>s<\/code> 改绑新对象<\/td><td>字符串不可变，不能 <code>s[0] = &#x27;X&#x27;<\/code><\/td><\/tr><tr><td><code>b = a[:]<\/code><\/td><td>切片生成新列表<\/td><td>嵌套子列表仍共享（浅复制）<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>2. 列表常用操作<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>操作<\/th><th>写法<\/th><th>结果 / 边界<\/th><\/tr><\/thead><tbody><tr><td>索引取值<\/td><td><code>names[0]<\/code>、<code>names[-1]<\/code><\/td><td>合法索引 <code>0 … len-1<\/code>，越界抛 IndexError<\/td><\/tr><tr><td>切片<\/td><td><code>names[1:4]<\/code><\/td><td>含头不含尾，个数 <code>end-start<\/code>，返回新列表<\/td><\/tr><tr><td>末尾追加<\/td><td><code>names.append(&#x27;amy&#x27;)<\/code><\/td><td>旧元素编号不变<\/td><\/tr><tr><td>中间插入<\/td><td><code>names.insert(0, &#x27;amy&#x27;)<\/code><\/td><td>其后元素后移一位<\/td><\/tr><tr><td>按索引删除<\/td><td><code>names.pop(0)<\/code><\/td><td>返回被删元素，其后元素前移<\/td><\/tr><tr><td>按值删除<\/td><td><code>names.remove(&#x27;amy&#x27;)<\/code><\/td><td>只删第一个匹配项<\/td><\/tr><tr><td>长度<\/td><td><code>len(names)<\/code><\/td><td>元素个数<\/td><\/tr><tr><td>遍历<\/td><td><code>for n in names:<\/code><\/td><td>循环变量依次绑到每个元素<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>3. 字典常用操作<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>操作<\/th><th>写法<\/th><th>结果 / 边界<\/th><\/tr><\/thead><tbody><tr><td>创建<\/td><td><code>d = {&#x27;color&#x27;: &#x27;green&#x27;, &#x27;points&#x27;: 5}<\/code><\/td><td>花括号，键值对逗号分隔<\/td><\/tr><tr><td>按键取值<\/td><td><code>d[&#x27;color&#x27;]<\/code><\/td><td>缺键抛 KeyError<\/td><\/tr><tr><td>新增 / 覆盖<\/td><td><code>d[&#x27;x&#x27;] = 0<\/code><\/td><td>键存在则覆盖，不存在则新增<\/td><\/tr><tr><td>遍历键值<\/td><td><code>for k, v in d.items():<\/code><\/td><td>同时取键与值<\/td><\/tr><tr><td>遍历键<\/td><td><code>for k in d.keys():<\/code><\/td><td>成员判断默认查键<\/td><\/tr><tr><td>遍历值<\/td><td><code>for v in d.values():<\/code><\/td><td>值可能重复<\/td><\/tr><tr><td>可哈希键<\/td><td>字符串、数字、元组<\/td><td>列表、字典不能做键<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>4. 分支与循环<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>结构<\/th><th>写法<\/th><th>要点<\/th><\/tr><\/thead><tbody><tr><td>单分支<\/td><td><code>if test:<\/code><\/td><td>条件求值为 True 才执行块<\/td><\/tr><tr><td>多档<\/td><td><code>if … elif … else:<\/code><\/td><td>自上而下命中首条成立者，随后跳出<\/td><\/tr><tr><td>逻辑组合<\/td><td><code>a and b<\/code>、<code>a or b<\/code>、<code>not a<\/code><\/td><td>and/or 左侧已定结果时右侧短路<\/td><\/tr><tr><td>成员判断<\/td><td><code>x in names<\/code>、<code>x not in d<\/code><\/td><td>字典默认查键<\/td><\/tr><tr><td>条件循环<\/td><td><code>while active:<\/code><\/td><td>每轮重新求值条件<\/td><\/tr><tr><td>立即退出<\/td><td><code>break<\/code><\/td><td>跳出所在循环<\/td><\/tr><tr><td>跳过本轮<\/td><td><code>continue<\/code><\/td><td>回到条件判断处<\/td><\/tr><tr><td>取文本<\/td><td><code>msg = input(&quot;提示：&quot;)<\/code><\/td><td>返回字符串，数值用 <code>int()<\/code> 转换<\/td><\/tr><tr><td>求模<\/td><td><code>n % 2<\/code><\/td><td>余数 0 偶数，1 奇数<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 函数<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>要素<\/th><th>写法<\/th><th>要点<\/th><\/tr><\/thead><tbody><tr><td>定义<\/td><td><code>def f(name, age=18):<\/code><\/td><td>定义时不执行，调用时才建帧<\/td><\/tr><tr><td>位置参数<\/td><td><code>f(&#x27;eric&#x27;, 20)<\/code><\/td><td>按顺序绑定<\/td><\/tr><tr><td>关键字参数<\/td><td><code>f(age=20, name=&#x27;eric&#x27;)<\/code><\/td><td>按形参名绑定，位置参数须在前<\/td><\/tr><tr><td>返回值<\/td><td><code>return full_name<\/code><\/td><td>无 return 返回 <code>None<\/code><\/td><\/tr><tr><td>可变默认值<\/td><td>默认值用 <code>None<\/code>，函数体内新建<\/td><td>可变默认对象多次调用共享<\/td><\/tr><tr><td>传参<\/td><td>实参绑到形参<\/td><td>原地修改穿透帧，重新绑定形参不穿透<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>6. 类与继承<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>要素<\/th><th>写法<\/th><th>要点<\/th><\/tr><\/thead><tbody><tr><td>定义类<\/td><td><code>class Dog():<\/code><\/td><td>类名约定首字母大写<\/td><\/tr><tr><td>初始化<\/td><td><code>def __init__(self, name):<\/code><\/td><td>实例化时自动运行<\/td><\/tr><tr><td>实例属性<\/td><td><code>self.name = name<\/code><\/td><td>挂在实例上，各实例独立<\/td><\/tr><tr><td>方法<\/td><td><code>def sit(self):<\/code><\/td><td>首参 <code>self<\/code> 指向调用实例<\/td><\/tr><tr><td>实例化<\/td><td><code>my = Dog(&#x27;willie&#x27;)<\/code><\/td><td><code>my<\/code> 绑到新建实例<\/td><\/tr><tr><td>继承<\/td><td><code>class ElectricCar(Car):<\/code><\/td><td>子类获得父类成员<\/td><\/tr><tr><td>父类初始化<\/td><td><code>super().__init__(make, model, year)<\/code><\/td><td>子类 <code>__init__<\/code> 先调用<\/td><\/tr><tr><td>重写<\/td><td>子类定义同名方法<\/td><td>实例查找先命中子类版本<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>7. 文件、异常、JSON 与测试<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>主题<\/th><th>写法<\/th><th>要点<\/th><\/tr><\/thead><tbody><tr><td>读取<\/td><td><code>with open(&#x27;f.txt&#x27;) as f:<\/code><\/td><td>块结束自动关闭<\/td><\/tr><tr><td>写入<\/td><td><code>open(&#x27;f.txt&#x27;, &#x27;w&#x27;)<\/code><\/td><td>覆盖原内容<\/td><\/tr><tr><td>追加<\/td><td><code>open(&#x27;f.txt&#x27;, &#x27;a&#x27;)<\/code><\/td><td>末尾续写<\/td><\/tr><tr><td>逐行 / 全行<\/td><td><code>f.readlines()<\/code>、<code>f.read()<\/code><\/td><td>行末换行可用 <code>rstrip()<\/code> 去除<\/td><\/tr><tr><td>异常兜底<\/td><td><code>try: … except 类型: … else: …<\/code><\/td><td>except 按类型匹配，未捕获沿栈传播<\/td><\/tr><tr><td>保存数据<\/td><td><code>json.dump(data, f_obj)<\/code><\/td><td>序列化为 JSON 文本<\/td><\/tr><tr><td>读回数据<\/td><td><code>data = json.load(f_obj)<\/code><\/td><td>重建新对象<\/td><\/tr><tr><td>测试类<\/td><td><code>class T(unittest.TestCase):<\/code><\/td><td>继承 TestCase 获得断言方法<\/td><\/tr><tr><td>测试方法<\/td><td><code>def test_x(self):<\/code><\/td><td><code>test_<\/code> 前缀才被运行<\/td><\/tr><tr><td>共用对象<\/td><td><code>setUp(self)<\/code><\/td><td>每个测试方法前各跑一遍<\/td><\/tr><tr><td>断言<\/td><td><code>self.assertEqual(a, b)<\/code><\/td><td>不等则该测试失败<\/td><\/tr><\/tbody><\/table><\/div>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/python-crash-course", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 2、3、4、6 章：变量、列表与字典——程序怎样组织一批数据", "href": "#/chapter/ch01"}, {"label": "第 5、7 章：if 条件分支与 while 用户输入循环", "href": "#/chapter/ch02"}, {"label": "第 8、9 章：函数与类——把重复动作和成可复用结构", "href": "#/chapter/ch03"}, {"label": "第 10、11 章：文件、异常、JSON 持久化与测试代码", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "变量绑定与可变/不可变对象", "href": "#/concept/c01"}, {"label": "列表、索引与切片边界", "href": "#/concept/c02"}, {"label": "字典：键值对、键唯一与按键查找", "href": "#/concept/c03"}, {"label": "条件测试与 if-elif-else 分支链", "href": "#/concept/c04"}, {"label": "while 循环、用户输入与循环控制", "href": "#/concept/c05"}, {"label": "函数定义、参数传递与返回值", "href": "#/concept/c06"}, {"label": "类、实例与实例属性链", "href": "#/concept/c07"}, {"label": "继承、方法重写与父类调用", "href": "#/concept/c08"}, {"label": "文件读写、异常处理与 JSON 持久化", "href": "#/concept/c09"}, {"label": "单元测试、断言方法与 setUp 复用", "href": "#/concept/c10"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 2、3、4、6 章：变量、列表与字典——程序怎样组织一批数据", "href": "#/quiz/ch01"}, {"label": "测验：第 5、7 章：if 条件分支与 while 用户输入循环", "href": "#/quiz/ch02"}, {"label": "测验：第 8、9 章：函数与类——把重复动作和成可复用结构", "href": "#/quiz/ch03"}, {"label": "测验：第 10、11 章：文件、异常、JSON 持久化与测试代码", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：Python编程__从入门到实践_=_Python_Cras...rse_(Eric_Matthes)_(Z-Library).pdf · p.34<\/div><h1>第 2、3、4、6 章：变量、列表与字典——程序怎样组织一批数据<\/h1>\n<blockquote>对应原书第 2 章「变量和简单数据类型」、第 3 章「列表简介」、第 4 章「操作列表」、第 6 章「字典」（印刷页 15–99，PDF 第 34–118 页；偏移 = PDF 页 − 印刷页 = 19，已用第 1 章 PDF 21/印刷 2、第 4 章 PDF 63/印刷 44、第 6 章 PDF 100/印刷 81 三处章首互核）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n写出一条变量赋值语句，说清名字与对象的绑定关系，指出重新赋值改的是绑定目标；\n<\/li><li>\n用列表存放有序集合，完成索引访问、切片、追加、插入与删除，并说出切片的起止边界；\n<\/li><li>\n用字典存放键—值对，按键取回值、新增键、覆盖旧值；\n<\/li><li>\n区分列表、字典这类可变对象与字符串、数字这类不可变对象在原地修改时的不同表现；\n<\/li><li>\n读懂 traceback 中的 NameError、IndexError、KeyError 指向哪一类写法错误。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>程序先要有地方放数据：变量把一个名字绑到一个对象上，列表按位置把多个对象排成有序序列，字典按键把多个对象组织成可按名称查找的结构；选哪种容器，取决于你之后要靠位置取数还是靠名字取数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：变量绑定与可变/不可变对象（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。第 2 章从 <code>message = &quot;Hello Python world!&quot;<\/code> 出发：解释器先造出字符串对象，再把名字 <code>message<\/code> 绑到这个对象上；下一行 <code>print(message)<\/code> 沿绑定取回对象并打印（PDF 第 35 页）。第 2.2.2 节给出拼写错误 <code>print(mesage)<\/code> 的 traceback，报 <code>NameError: name &#x27;mesage&#x27; is not defined<\/code>，原因是这个名字从来没有被绑定过。字符串、数字属于不可变对象，所谓“改字符串”实际是造新对象再重新绑定；列表、字典属于可变对象，可以在原地增删元素。<\/p>\n<h3>2. 概念 2：列表、索引与切片边界（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。第 3 章用 <code>bicycles = [&#x27;trek&#x27;, &#x27;cannondale&#x27;, &#x27;redline&#x27;, &#x27;specialized&#x27;]<\/code> 说明列表是用方括号写出的有序集合，索引从 0 开始（PDF 第 51 页）。第 4.4 节讲切片 <code>players[0:3]<\/code>、<code>players[1:4]<\/code>：切片包含起始索引位置的元素，不包含终止索引位置的元素；两端省略时分别取到开头与结尾。追加用 <code>append()<\/code>，插入用 <code>insert()<\/code>，按值删除用 <code>remove()<\/code>，按索引删除用 <code>pop()<\/code>。<\/p>\n<h3>3. 概念 3：字典：键值对、键唯一与按键查找（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。第 6 章用 <code>alien_0 = {&#x27;color&#x27;: &#x27;green&#x27;, &#x27;points&#x27;: 5}<\/code> 说明字典是花括号包裹的键—值对集合，指定键就能取回对应的值（PDF 第 101 页）。值可以是数字、字符串、列表乃至另一个字典；同一字典里键不重复，给已有键再赋值会覆盖旧值。字典适合记录“一个事物有多条带名称的属性”，列表适合记录“一排有先后次序的条目”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[名字 message] --&gt; B[字符串对象]\nC[列表 bicycles] --&gt; D1[索引 0: trek]\nC --&gt; D2[索引 1: cannondale]\nC --&gt; D3[索引 2: redline]\nE[字典 alien_0] --&gt; F1[键 color → green]\nE --&gt; F2[键 points → 5]\nB --&gt; G[print 沿绑定取回对象]\nD1 --&gt; H[按位置取值]\nF1 --&gt; I[按键取值]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条通路分别对应变量、列表、字典。绑定关系断在名字上会报 NameError；列表通路断在索引上会报 IndexError；字典通路断在键上会报 KeyError。容器选错——例如想用位置号查一个只有属性名的外星人——就取不到数。<\/p>\n<h2>推导一（执行推演）：列表索引与切片逐位定位<\/h2>\n<p>参照第 3 章与第 4.4 节的例子，给定列表：<\/p>\n<pre class=\"lang-python\"><code>players = [&#x27;charles&#x27;, &#x27;martina&#x27;, &#x27;michael&#x27;, &#x27;florence&#x27;, &#x27;eli&#x27;]<\/code><\/pre>\n<p>推演按索引编号逐位展开：列表长度为 5，合法正索引是 0、1、2、3、4；负索引 -1 对应末位元素，-2 对应倒数第二个。<\/p>\n<ol><li>\n<code>players[0]<\/code> 取索引 0，得到 <code>&#x27;charles&#x27;<\/code>；<code>players[3]<\/code> 取索引 3，得到 <code>&#x27;florence&#x27;<\/code>；<code>players[-1]<\/code> 得到 <code>&#x27;eli&#x27;<\/code>。\n<\/li><li>\n切片 <code>players[0:3]<\/code>：起始 0 包含，终止 3 不包含，取出索引 0、1、2 三个元素，结果是 <code>[&#x27;charles&#x27;, &#x27;martina&#x27;, &#x27;michael&#x27;]<\/code>。\n<\/li><li>\n切片 <code>players[1:4]<\/code>：取出索引 1、2、3，结果是 <code>[&#x27;martina&#x27;, &#x27;michael&#x27;, &#x27;florence&#x27;]<\/code>，与第 4.4 节印刷页 54 的示例一致。\n<\/li><li>\n边界核对：<code>players[5]<\/code> 的索引 5 不在 0–4 范围内，访问时抛 <code>IndexError: list index out of range<\/code>；切片越界则不报错，超出部分被截断，例如 <code>players[1:9]<\/code> 仍返回到末尾为止的元素。\n<\/ol>\n<p>这条推演的依据是 Python 列表的两段约定：编号从 0 起；切片是“含头不含尾”。记住终止索引是被排除的边界，就能避免差一错误。<\/p>\n<h2>推导二（执行推演）：字典查找、新增与覆盖，对照可变/不可变<\/h2>\n<p>给定第 6 章的字典：<\/p>\n<pre class=\"lang-python\"><code>alien_0 = {&#x27;color&#x27;: &#x27;green&#x27;, &#x27;points&#x27;: 5}<\/code><\/pre>\n<p>逐行推演：<\/p>\n<ol><li>\n<code>alien_0[&#x27;color&#x27;]<\/code>：解释器拿键 <code>&#x27;color&#x27;<\/code> 在字典中查找，命中返回 <code>&#x27;green&#x27;<\/code>；若写 <code>alien_0[&#x27;speed&#x27;]<\/code>，字典里没有这个键，抛 <code>KeyError: &#x27;speed&#x27;<\/code>。\n<\/li><li>\n<code>alien_0[&#x27;x_position&#x27;] = 0<\/code>：字典里原本没有 <code>&#x27;x_position&#x27;<\/code>，这一步新增一个键—值对，字典在原地变大。\n<\/li><li>\n<code>alien_0[&#x27;color&#x27;] = &#x27;yellow&#x27;<\/code>：键 <code>&#x27;color&#x27;<\/code> 已存在，赋值覆盖旧值，<code>&#x27;green&#x27;<\/code> 不再留在该键下。\n<\/ol>\n<p>对照不可变对象的表现：<\/p>\n<pre class=\"lang-python\"><code>message = &quot;Hello&quot;\nmessage = message + &quot; world&quot;<\/code><\/pre>\n<p>第一步 <code>message<\/code> 绑到字符串 <code>&quot;Hello&quot;<\/code>；拼接 <code>&quot; world&quot;<\/code> 时原字符串 <code>&quot;Hello&quot;<\/code> 不能被改写，解释器造出一个新字符串 <code>&quot;Hello world&quot;<\/code>，再把 <code>message<\/code> 重新绑过去。列表的情形不同：<\/p>\n<pre class=\"lang-python\"><code>fruits = [&#x27;apple&#x27;, &#x27;banana&#x27;]\nfruits.append(&#x27;cherry&#x27;)<\/code><\/pre>\n<p><code>append()<\/code> 在原列表对象上追加元素，<code>fruits<\/code> 的绑定目标没有换，列表内部多了一项。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>把列表换成元组<\/strong>：<code>fruits = (&#x27;apple&#x27;, &#x27;banana&#x27;)<\/code> 之后再调 <code>fruits.append(&#x27;cherry&#x27;)<\/code>，元组不支持原地追加，抛 <code>AttributeError: &#x27;tuple&#x27; object has no attribute &#x27;append&#x27;<\/code>。元组适合存放不该被中途改动的固定集合；需要后续增删，就只能用列表。\n<\/li><li>\n<strong>把字符串当可变对象原地改<\/strong>：想写 <code>s[0] = &#x27;X&#x27;<\/code> 去改字符串首字符，字符串是不可变的，抛 <code>TypeError: &#x27;str&#x27; object does not support item assignment<\/code>。可行做法是切片拼接造新字符串，再把变量重新绑到新对象。\n<\/li><li>\n<strong>把列表当作字典的键<\/strong>：<code>{[&#x27;a&#x27;, &#x27;b&#x27;]: 1}<\/code> 会抛 <code>TypeError: unhashable type: &#x27;list&#x27;<\/code>。字典按键查找依赖键的哈希值稳定，列表内容可在原地变化，哈希值会跟着变，因此不能做键；字符串、数字、元组这类不可变对象可以做键。\n<\/li><li>\n<strong>用位置号去查字典<\/strong>：外星人属性只有名称没有次序，写 <code>alien_0[0]<\/code> 会被当成取键 <code>0<\/code>，查不到就抛 KeyError。这说明容器选型要匹配之后的取值方式：按位置用列表，按名称用字典。\n<\/ul>\n<h2>本章的几个为什么<\/h2>\n<ol><li>\n<strong>为什么变量是绑定对象而不是装值的盒子？<\/strong> 解释器先在内存造出对象，再让名字指向它；这样多个名字才能指向同一对象，别名与原地修改才有统一解释。若把变量当成盒子，就无法解释两个列表名为什么看到同一次追加。\n<\/li><li>\n<strong>为什么切片规定含头不含尾？<\/strong> 终止位置被排除后，切片长度等于 <code>end − start<\/code>，从 <code>start<\/code> 取到 <code>end<\/code> 与“前 end 个再去掉前 start 个”两种算法结果一致；边界统一后切片拼接与计数都不用额外修正。\n<\/li><li>\n<strong>为什么列表能做字典的值却不能做键？<\/strong> 字典按键查找要靠哈希值稳定定位；列表内容可在原地变化，哈希值随之改变，存放时的位置与查找时对不上。值只被存取，不参与定位，所以可变对象可以放进值槽位。\n<\/li><li>\n<strong>为什么同名键写两次会被覆盖？<\/strong> 字典内部一个键只对应一条映射，键是查找入口；允许两个同名键并存，查找时就无法确定取回哪一个，因此后写的值替换先写的值。\n<\/ol>\n<h2>类比与实例<\/h2>\n<p>列表像一排按编号摆放的抽屉，抽屉编号从 0 起；切片是一次抽出连续编号的一段抽屉，抽出的是新列表。字典像一本按词条翻查的登记簿，词条（键）唯一，翻到词条才读到对应的说明（值）。变量名像贴在对象上的标签，重新贴标签不会改变被贴的那个抽屉或登记簿。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解一：变量是装值的盒子，赋值把值写进盒子。<\/strong> 更准确的说法是绑定：名字指向对象；不可变对象被“改动”时换的是指向，不是旧对象内部。\n<\/li><li>\n<strong>误解二：切片会修改原列表。<\/strong> 切片返回的是子集新列表，原列表保持不变；要改原列表需要赋值、append、insert、remove、pop 这类原地操作。\n<\/li><li>\n<strong>误解三：字典允许出现两个同名键。<\/strong> 重复写同名键时后写的值覆盖先写的值，查找时只能取回末次写入的值。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n给定 <code>colors = [&#x27;red&#x27;, &#x27;green&#x27;, &#x27;blue&#x27;]<\/code>，写出 <code>colors[1]<\/code>、<code>colors[-1]<\/code>、<code>colors[0:2]<\/code> 的结果，并说明哪些索引越界会报 IndexError。\n<\/li><li>\n给定 <code>book = {&#x27;title&#x27;: &#x27;Crash Course&#x27;, &#x27;year&#x27;: 2016}<\/code>，新增键 <code>&#x27;pages&#x27;<\/code> 值 482，再把 <code>&#x27;year&#x27;<\/code> 改成 2026，写出改动后字典里的两个键—值对。\n<\/li><li>\n为什么列表可以做字典的值，却不能做字典的键？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\n变量名绑定对象；不可变对象改动生成新对象，可变对象可原地修改。\n<\/li><li>\n列表索引从 0 起，切片含头不含尾，越界索引报错而越界切片被截断。\n<\/li><li>\n字典按键存取，键唯一且必须可哈希，重复赋值覆盖旧值。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章把数据放进容器，但容器里的元素还没有被逐个处理。第 5、7 章的 if 分支负责决定取哪条路，for 与 while 循环负责把列表、字典里的条目逐个过一遍；第 8、9 章再把对这批数据反复执行的动作封装成函数与类。字典的键唯一约束、列表的有序特征，会在后续循环遍历与函数传参时反复出现。<\/p>", "ch02": "<div class=\"source-badge\">📖 出处：Python编程__从入门到实践_=_Python_Cras...rse_(Eric_Matthes)_(Z-Library).pdf · p.83<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 2、3、4、6 章：变量、列表与字典——程序怎样组织一批数据<\/a><\/span><\/div><h1>第 5、7 章：if 条件分支与 while 用户输入循环<\/h1>\n<blockquote>对应原书第 5 章「if 语句」、第 7 章「用户输入和 while 循环」（印刷页 64–113，PDF 第 83–132 页；偏移 = PDF 页 − 印刷页 = 19，已用第 5 章 PDF 83/印刷 64、第 7 章 PDF 119/印刷 100 两处章首互核）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n写出求值为 True/False 的条件测试，组合 and、or、in、not in 判断多个条件；\n<\/li><li>\n把多档判断写成 if-elif-else 链，说清各分支互斥与兜底关系；\n<\/li><li>\n用 <code>input()<\/code> 取到文本，用 <code>int()<\/code> 把数值文本转成整数后再做比较；\n<\/li><li>\n用 while 循环配合标志、break、continue 控制重复执行，指出无限循环是怎么形成的；\n<\/li><li>\n在 while 循环中遍历列表、填充字典，并说清循环途中修改被遍历集合要注意什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>if 语句让程序根据条件测试的结果选择走哪条分支；while 循环让程序在条件成立时反复执行同一代码块；<code>input()<\/code> 把用户敲进来的文本送进变量，程序由此变成可以交互、可以一直运行到用户主动退出的样子。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：条件测试与 if-elif-else 分支链（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。第 5 章把每条可判断真假的表达式称为条件测试：相等比较 <code>==<\/code>、不等 <code>!=<\/code>、大小比较 <code>&gt;<\/code> <code>&lt;<\/code>、成员判断 <code>in<\/code> <code>not in<\/code>，再用 <code>and<\/code> <code>or<\/code> 组合（PDF 第 83 页起）。<code>if<\/code> 后接测试结果为 True 的分支；多档判断用 <code>elif<\/code> 接续，<code>else<\/code> 收束所有未被前面分支命中的情况。<code>if<\/code> 行尾必须有冒号，分支内语句必须缩进。<\/p>\n<h3>2. 概念 2：while 循环、用户输入与循环控制（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。第 7 章用 <code>message = input(&quot;Tell me something, and I will repeat it back to you: &quot;)<\/code> 说明 <code>input()<\/code> 让程序暂停等待输入，取回的始终是文本（PDF 第 119 页）。要做数值比较时先用 <code>int()<\/code> 转换；while 在条件为 True 时重复执行循环体，用标志变量记录是否继续，用 <code>break<\/code> 立即退出，用 <code>continue<\/code> 跳过本轮余下语句。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[input 取文本] --&gt; B{需要数值比较?}\nB --&gt;|是| C[int 转换]\nB --&gt;|否| D[条件测试]\nC --&gt; D\nD --&gt; E{测试结果}\nE --&gt;|True| F[执行 if 分支]\nE --&gt;|False| G[elif 继续判断]\nG --&gt; H{仍有分支?}\nH --&gt;|是| D\nH --&gt;|否| I[else 兜底]\nF --&gt; J[while 条件成立?]\nG --&gt; J\nI --&gt; J\nJ --&gt;|True| K[重复循环体]\nJ --&gt;|False| L[退出循环]\nK --&gt; J<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：条件测试先把数据归到 True 或 False；分支链从上往下命中第一条成立的就停下。循环通路若条件始终为 True 又没有 break，就会卡在 J 到 K 之间形成无限循环。<\/p>\n<h2>推导一（执行推演）：多档评分分支链逐档判定<\/h2>\n<p>参照第 5 章的条件判断写法，给定分数 <code>score = 72<\/code>，写出档位分支：<\/p>\n<pre class=\"lang-python\"><code>if score &gt;= 90:\n    grade = &#x27;A&#x27;\nelif score &gt;= 80:\n    grade = &#x27;B&#x27;\nelif score &gt;= 60:\n    grade = &#x27;C&#x27;\nelse:\n    grade = &#x27;F&#x27;<\/code><\/pre>\n<p>推演按分支顺序逐档展开：<\/p>\n<ol><li>\n第一档测试 <code>score &gt;= 90<\/code>：<code>72 &gt;= 90<\/code> 为 False，进入下一条 elif。\n<\/li><li>\n第二档测试 <code>score &gt;= 80<\/code>：<code>72 &gt;= 80<\/code> 为 False，进入下一条 elif。\n<\/li><li>\n第三档测试 <code>score &gt;= 60<\/code>：<code>72 &gt;= 60<\/code> 为 True，执行 <code>grade = &#x27;C&#x27;<\/code>。\n<\/li><li>\n执行完该分支后跳出整条 if-elif-else 链，<code>else<\/code> 不再进入。\n<\/ol>\n<p>换几个值核对边界：<code>score = 80<\/code> 时第一档 False，第二档 <code>80 &gt;= 80<\/code> 为 True，得 <code>&#x27;B&#x27;<\/code>；<code>score = 59<\/code> 前三档全 False，落到 <code>else<\/code> 得 <code>&#x27;F&#x27;<\/code>。分支链的判定顺序决定边界归属：把 <code>&gt;= 60<\/code> 写在 <code>&gt;= 80<\/code> 前面，80 分就会被提前归到 C 档。<\/p>\n<h2>推导二（执行推演）：带退出标志的输入循环与类型转换<\/h2>\n<p>参照第 7 章让用户选择何时退出的写法：<\/p>\n<pre class=\"lang-python\"><code>active = True\nwhile active:\n    message = input(&quot;请输入内容，输入 q 退出：&quot;)\n    if message == &#x27;q&#x27;:\n        active = False\n    else:\n        print(&quot;你输入的是：&quot; + message)<\/code><\/pre>\n<p>逐轮推演：<\/p>\n<ol><li>\n首轮开始，<code>active<\/code> 为 True，进入循环体；<code>input()<\/code> 暂停等待，用户敲入 <code>hello<\/code>，<code>message<\/code> 绑到文本 <code>&#x27;hello&#x27;<\/code>。\n<\/li><li>\n<code>if message == &#x27;q&#x27;<\/code> 测试为 False，走 else 打印 <code>你输入的是：hello<\/code>；回到 while 条件，<code>active<\/code> 仍为 True。\n<\/li><li>\n第二轮用户敲入 <code>q<\/code>，测试 <code>message == &#x27;q&#x27;<\/code> 为 True，把 <code>active<\/code> 改为 False；本轮不再打印。\n<\/li><li>\n回到 while 条件，<code>active<\/code> 为 False，循环结束。\n<\/ol>\n<p>数值输入对照：若程序要比较年龄，<code>age = input(&quot;请输入年龄：&quot;)<\/code> 取回的是文本；直接写 <code>age &gt;= 18<\/code> 在 Python 3 中会因文本与整数不能比较而报错。先执行 <code>age = int(age)<\/code>，把文本 <code>&quot;20&quot;<\/code> 转成整数 <code>20<\/code>，再与 18 比较才成立。求模运算 <code>age % 2<\/code> 用于判断奇偶：余数为 0 是偶数，余数为 1 是奇数。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>把 for 循环换成 while 去逐个处理列表<\/strong>：<code>for name in names:<\/code> 由循环结构自行取下一个元素；换成 while 就要自己维护一个索引变量，每轮加 1，再判断索引是否到达列表长度。索引漏加 1 会原地打转，索引越界会报 IndexError。for 适合遍历已知集合，while 适合按条件反复运行。\n<\/li><li>\n<strong>去掉 <code>int()<\/code> 转换<\/strong>：用户输入 <code>&quot;20&quot;<\/code> 后变量仍是字符串，字符串与整数比较触发 TypeError；把输入当文本拼接则不会报错，但会出现 <code>&quot;20&quot; + 1<\/code> 这类类型错误。类型不匹配的错误往往不在输入那一刻暴露，而在首次参与运算时。\n<\/li><li>\n<strong>误用 continue 替代 break<\/strong>：想让用户输入 <code>q<\/code> 时退出循环，却写成 <code>continue<\/code>。continue 只跳过本轮余下语句，直接回到条件判断；只要循环条件仍为 True，下一轮又会再次提示输入，程序退不出去。break 才是跳出所在循环。\n<\/li><li>\n<strong>省略 if 行尾冒号或漏缩进<\/strong>：冒号缺失会在解析阶段报 SyntaxError；循环体该缩进的语句没有缩进，会被解释器认作循环之外的代码，重复逻辑只执行一次；多余缩进则报 IndentationError。\n<\/li><li>\n<strong>循环条件永远成立且无退出出口<\/strong>：标志始终为 True、循环体内不把它改 False，也没有 break，while 条件每轮都为 True，程序一直占用运行，只能从外部强制终止。\n<\/ul>\n<h2>本章的几个为什么<\/h2>\n<ol><li>\n<strong>为什么 <code>input()<\/code> 取回的是字符串？<\/strong> 输入通道读到的是一行文本，解释器无法凭外观判断使用者要把它当数字还是文字处理；显式 <code>int()<\/code> 转换把类型决定留给代码，避免文本与数字在比较时出错。\n<\/li><li>\n<strong>为什么 elif 链命中一条后就跳出？<\/strong> 各档分支按互斥设计，命中首条成立分支后任务已分流；继续求值后续 elif 既多余，也可能让同一对象落入多个档位。并列需要多个标签时才改用独立 if。\n<\/li><li>\n<strong>为什么 while 条件每轮结束后要重新求值？<\/strong> 重复次数由运行时状态决定，循环体内标志、计数变量、列表长度都可能改变；只有每轮回到条件位置重新判断，循环才能在状态满足退出条件时停下来。\n<\/li><li>\n<strong>为什么 <code>continue<\/code> 不能用来退出循环？<\/strong> continue 的职责是跳过本轮余下语句并回到条件判断；它不改变退出条件，只要条件仍为 True，下一轮还会进入。要退出循环必须翻转标志或执行 break。\n<\/ol>\n<h2>类比与实例<\/h2>\n<p>if 链像检票口的多道闸机：旅客走到第一道闸机符合条件就放行，不符合就走到下一道；所有闸机都不符，由末道兜底通道处理。while 循环像传送带：只要开关（循环条件）合上，物品就流过一遍；标志是总开关，break 是紧急停机，continue 是把当前这件拨到一边继续下一件。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解一：elif 各分支都会被检查一遍。<\/strong> 命中第一条成立分支后就跳出整条链，后面的 elif 不再求值。\n<\/li><li>\n<strong>误解二：input() 取回的内容按外观自动是数字。<\/strong> 取回的永远是字符串；需要数值运算必须显式转换。\n<\/li><li>\n<strong>误解三：else 可以接在每个 if 后面表示“再判断一次”。<\/strong> else 不接测试条件，它只收束离它最近的那条 if/elif 链；独立的 else 配对错位置会报语法错误。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n给定 <code>temperature = 31<\/code>，写一条 if-elif-else 链：<code>&gt; 30<\/code> 输出 <code>hot<\/code>，<code>20–30<\/code> 输出 <code>warm<\/code>，其余输出 <code>cool<\/code>，并说明温度取 30 时落到哪一档。\n<\/li><li>\n写出一个 while 循环：反复提示输入配料名，输入 <code>quit<\/code> 时退出，把每次输入的配料追加到列表；说明如果漏掉把退出标志改 False 的语句会发生什么。\n<\/li><li>\n<code>continue<\/code> 和 <code>break<\/code> 在循环中各自把控制流带到哪里？用一句话区分。\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\n条件测试求值为 True/False，分支链自上而下命中首条成立者，else 兜底。\n<\/li><li>\ninput() 返回文本，数值比较前用 int() 转换；标志、break、continue 是三种循环控制手段。\n<\/li><li>\nwhile 条件每轮重新求值；条件恒 True 且无退出出口即无限循环。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章的条件测试与循环处理的是上一章容器里的元素：if 判断单个元素是否满足条件，while 反复接收新条目并追加到列表或字典。第 8 章把分支与循环包进函数，让同一段判断逻辑可以反复调用；第 9 章的类把属性与判断行为绑到实例上；第 10 章的异常处理则是另一层“出错时走哪条路”的分支机制，与本章的 if 分支在控制流结构上一脉相承。<\/p>", "ch03": "<div class=\"source-badge\">📖 出处：Python编程__从入门到实践_=_Python_Cras...rse_(Eric_Matthes)_(Z-Library).pdf · p.133<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 5、7 章：if 条件分支与 while 用户输入循环<\/a><\/span><\/div><h1>第 8、9 章：函数与类——把重复动作和成可复用结构<\/h1>\n<blockquote>对应原书第 8 章「函数」、第 9 章「类」（印刷页 114–161，PDF 第 133–180 页；偏移 = PDF 页 − 印刷页 = 19，已用第 8 章 PDF 133/印刷 114、第 9 章 PDF 157/印刷 138 两处章首互核）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n用 <code>def<\/code> 定义带形参的函数，区分位置参数与关键字参数，写出默认值形参；\n<\/li><li>\n用 <code>return<\/code> 把结果交回调用处，说明函数没有 return 时调用处取到的是什么；\n<\/li><li>\n解释实例化时 <code>__init__<\/code> 做了什么，顺着 <code>self<\/code> 访问实例属性与方法；\n<\/li><li>\n写出子类，在子类方法中调用父类方法，说清属性与方法沿类链查找的顺序；\n<\/li><li>\n把函数与类分别放进模块文件，用 import 引入后调用。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>函数是带名字的代码块，把一段动作连同需要的输入打包，调用处给实参、取回返回值；类是一张模板，按模板造出的实例各自保存属性值，方法通过 <code>self<\/code> 操作本实例；继承让子类在父类已有行为上扩展或替换。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：函数定义、参数传递与返回值（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。第 8.1 节用 <code>def greet_user():<\/code> 定义函数，括号内写形参，函数体缩进，文档字符串写在函数体首行（PDF 第 133 页）。调用时按位置把实参绑到形参，也可以用 <code>形参名=值<\/code> 的关键字形式传入；形参可设默认值。<code>return<\/code> 把结果送回调用处；不写 return 的函数执行完返回 <code>None<\/code>。<\/p>\n<h3>2. 概念 2：类、实例与实例属性链（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。第 9.1 节用 <code>class Dog():<\/code> 定义类，<code>__init__(self, name, age)<\/code> 在创建实例时运行，把传入值存成 <code>self.name<\/code>、<code>self.age<\/code>（PDF 第 158 页）。方法第一个形参约定为 <code>self<\/code>，调用时解释器自动把实例本身传进去；实例方法内通过 <code>self.属性名<\/code> 访问本实例数据。第 9.2 节用 <code>Car<\/code> 类说明属性可在方法内修改，也可通过方法加校验后再改。<\/p>\n<h3>3. 概念 3：继承、方法重写与父类调用（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。第 9.3 节说明：编写另一个现成类的特殊版本时，让新类在括号里写上父类名即建立继承；子类自动获得父类的属性与方法，需要不同行为时在子类中重写同名方法；用 <code>super()<\/code> 调用父类的 <code>__init__()<\/code>，先把父类那部分属性初始化好，再补充子类自己的属性。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[def 定义函数] --&gt; B[形参列表]\nB --&gt; C[调用处给实参]\nC --&gt; D[实参绑定形参]\nD --&gt; E[执行函数体]\nE --&gt; F{有无 return}\nF --&gt;|有| G[返回值交回调用处]\nF --&gt;|无| H[返回 None]\nI[class 定义模板] --&gt; J[__init__ 运行]\nJ --&gt; K[实例属性存到 self]\nK --&gt; L[实例调用方法]\nL --&gt; M[self 指向本实例]\nM --&gt; N[沿实例→类链查找方法]\nO[子类] --&gt; P[继承父类]\nP --&gt; Q[重写同名方法 或 super 调用父类]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：函数通路在 return 处把控制权交回调用处；类通路先实例化存属性，再沿实例与类链找方法。<code>self<\/code> 漏写、形参与实参数量对不上、子类没先初始化父类部分，都会在调用环节报错。<\/p>\n<h2>推导一（执行推演）：函数调用时实参怎样绑到形参<\/h2>\n<p>参照第 8.1.1 节的问候函数：<\/p>\n<pre class=\"lang-python\"><code>def greet_user(username):\n    &quot;&quot;&quot;显示简单的问候语&quot;&quot;&quot;\n    print(&quot;Hello, &quot; + username.title() + &quot;!&quot;)\n\ngreet_user(&#x27;jesse&#x27;)<\/code><\/pre>\n<p>逐行推演：<\/p>\n<ol><li>\n执行 <code>def<\/code> 语句时，解释器创建一个函数对象，把名字 <code>greet_user<\/code> 绑到它身上；函数体此刻不运行。\n<\/li><li>\n调用 <code>greet_user(&#x27;jesse&#x27;)<\/code> 时，解释器新建函数调用帧，把实参 <code>&#x27;jesse&#x27;<\/code> 绑到形参 <code>username<\/code>。\n<\/li><li>\n函数体执行：<code>username.title()<\/code> 对字符串 <code>&#x27;jesse&#x27;<\/code> 生成首字母大写的新字符串 <code>&#x27;Jesse&#x27;<\/code>，拼接后打印 <code>Hello, Jesse!<\/code>。\n<\/li><li>\n函数体执行完毕，没有 <code>return<\/code> 语句，调用处取回 <code>None<\/code>。\n<\/ol>\n<p>参数形式对照：再定义带默认值的函数<\/p>\n<pre class=\"lang-python\"><code>def describe_pet(pet_name, animal_type=&#x27;dog&#x27;):\n    print(animal_type + &quot;: &quot; + pet_name)<\/code><\/pre>\n<ul><li>\n位置调用 <code>describe_pet(&#x27;willie&#x27;)<\/code>：<code>pet_name=&#x27;willie&#x27;<\/code>，<code>animal_type<\/code> 取默认值 <code>&#x27;dog&#x27;<\/code>。\n<\/li><li>\n关键字调用 <code>describe_pet(animal_type=&#x27;hamster&#x27;, pet_name=&#x27;harry&#x27;)<\/code>：按形参名绑定，书写顺序与形参顺序无关。\n<\/li><li>\n位置参数必须写在关键字参数前面，否则解释器无法判断实参对应哪个形参。\n<\/ul>\n<h2>推导二（执行推演）：实例化与方法调用的属性链<\/h2>\n<p>参照第 9.1 节的 <code>Dog<\/code> 类：<\/p>\n<pre class=\"lang-python\"><code>class Dog():\n    &quot;&quot;&quot;一次模拟小狗的简单尝试&quot;&quot;&quot;\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\n    def sit(self):\n        print(self.name.title() + &quot; is now sitting.&quot;)<\/code><\/pre>\n<p>创建实例并调用方法：<\/p>\n<pre class=\"lang-python\"><code>my_dog = Dog(&#x27;willie&#x27;, 6)\nmy_dog.sit()<\/code><\/pre>\n<p>推演步骤：<\/p>\n<ol><li>\n<code>Dog(&#x27;willie&#x27;, 6)<\/code> 触发实例化：解释器新建一个空实例，把它作为第一个实参传给 <code>self<\/code>，<code>&#x27;willie&#x27;<\/code> 绑到 <code>name<\/code>，<code>6<\/code> 绑到 <code>age<\/code>。\n<\/li><li>\n<code>__init__<\/code> 内执行 <code>self.name = name<\/code>：把 <code>&#x27;willie&#x27;<\/code> 存到该实例的 <code>name<\/code> 属性；<code>self.age = age<\/code> 存入 <code>6<\/code>。\n<\/li><li>\n实例建好后，名字 <code>my_dog<\/code> 绑到这个实例。\n<\/li><li>\n<code>my_dog.sit()<\/code> 调用方法：解释器把 <code>my_dog<\/code> 传进 <code>self<\/code>，方法体内 <code>self.name<\/code> 沿实例属性链取到 <code>&#x27;willie&#x27;<\/code>，<code>.title()<\/code> 得到 <code>&#x27;Willie&#x27;<\/code>，打印 <code>Willie is now sitting.<\/code>。\n<\/ol>\n<p>属性修改对照第 9.2 节的 <code>Car<\/code> 类：<code>self.odometer_reading = 0<\/code> 在 <code>__init__<\/code> 中给实例设初始里程；<code>update_odometer(self, mileage)<\/code> 方法内先比较新里程与旧里程，再决定是否改写 <code>self.odometer_reading<\/code>。属性属于实例，两个实例各自保存一份，互不影响。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>函数形参用可变对象做默认值<\/strong>：若写成 <code>def add_item(item, bag=[]): bag.append(item); return bag<\/code>，默认列表在函数定义阶段只创建一次，多次调用共享同一个列表，上一次追加的元素会残留到下一次调用。稳妥写法是把默认值设为 <code>None<\/code>，在函数体内新建列表。\n<\/li><li>\n<strong>方法漏写 <code>self<\/code><\/strong>：<code>def sit():<\/code> 没有 <code>self<\/code>，调用 <code>my_dog.sit()<\/code> 时解释器自动把实例传进第一个形参位置，参数数量对不上会报 TypeError；方法内想访问实例属性也找不到入口。\n<\/li><li>\n<strong>子类不调用父类初始化<\/strong>：子类 <code>__init__<\/code> 里漏写 <code>super().__init__(...)<\/code>，父类在 <code>__init__<\/code> 中设置的属性就不会出现在子类实例上，后续方法访问这些属性时抛 AttributeError。\n<\/li><li>\n<strong>函数需要返回值却没写 return<\/strong>：调用处拿到 <code>None<\/code>，再对 <code>None<\/code> 做字符串拼接或索引取值，会在使用环节报 TypeError。返回值要在调用处继续参与运算，就必须显式 <code>return<\/code>。\n<\/li><li>\n<strong>把类当实例直接调用方法<\/strong>：类模板本身没有具体属性值，绕过实例化直接调方法，<code>self<\/code> 没有可访问的属性，行为与预期不符；必须先按类造出实例。\n<\/ul>\n<h2>本章的几个为什么<\/h2>\n<ol><li>\n<strong>为什么定义函数时函数体不运行？<\/strong> def 阶段要做的是把动作打包成函数对象并绑定名字；同一函数可能被调用多次，体现在每次调用时才建帧执行，定义阶段运行一次就无法复用。\n<\/li><li>\n<strong>为什么方法第一个形参必须是 <code>self<\/code>？<\/strong> 调用方法时实例本身要被传进方法体，方法才能访问本实例的属性；<code>self<\/code> 就是这个入口形参，漏写后实例对象无处安放，属性也找不到访问路径。\n<\/li><li>\n<strong>为什么两个实例的属性各存一份？<\/strong> 实例是按模板造出的具体对象，各自持有自己的属性值；方法定义留在类里共享，数据挂在实例上，这样多只小狗、多辆汽车才能同时保留各自的名字与里程。\n<\/li><li>\n<strong>为什么子类 <code>__init__<\/code> 要先调用 <code>super()<\/code>？<\/strong> 父类那部分属性由父类初始化写入实例；不先转交，子类实例上缺这些属性，后续沿属性链访问时抛 AttributeError。先复用父类初始化，再补充子类独有属性，链路才闭合。\n<\/ol>\n<h2>类比与实例<\/h2>\n<p>函数像一台带进料口的加工机器：进料口对应形参，投进去的原料是实参，加工完从出料口取出返回值；不写出料口，机器内部做完就结束，调用处拿到空。类像建筑图纸，实例是按图纸盖出的一栋房子；图纸规定有哪些房间（属性）和哪些动作（方法），每栋房子的房间陈设各自独立，<code>self<\/code> 就是工人当前所在的那栋房子。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解一：定义函数时函数体就运行了。<\/strong> <code>def<\/code> 只创建函数对象并绑定名字，函数体在调用那一刻才执行。\n<\/li><li>\n<strong>误解二：方法里的变量自动属于实例。<\/strong> 只有通过 <code>self.属性名<\/code> 赋值的名字才存到实例上；函数体内普通局部变量在调用结束后就消失。\n<\/li><li>\n<strong>误解三：子类重写方法会覆盖父类的类定义。<\/strong> 重写只影响子类实例沿类链查找时命中子类版本，父类自身与父类实例不受影响。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n定义函数 <code>make_shirt(size, text=&#x27;I love Python&#x27;)<\/code>，写出两次调用：一次用位置参数传尺码 <code>&#x27;M&#x27;<\/code>，一次用关键字参数把文字改成 <code>&#x27;Hello&#x27;<\/code>，说明默认值在什么情况下被使用。\n<\/li><li>\n给定 <code>Dog<\/code> 类，写出 <code>my_dog = Dog(&#x27;willie&#x27;, 6)<\/code> 之后 <code>my_dog.name<\/code> 的取值，并说明 <code>self.name<\/code> 中的 <code>self<\/code> 指向哪个对象。\n<\/li><li>\n子类 <code>ElectricCar<\/code> 继承 <code>Car<\/code>，写出子类 <code>__init__<\/code> 中调用父类初始化的那一行，并说明漏掉这一行会缺哪部分属性。\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\n函数定义时不执行，调用时实参按位置或关键字绑到形参，return 交回结果，无 return 返回 None。\n<\/li><li>\n实例化运行 <code>__init__<\/code>，属性存到 <code>self<\/code> 上，方法调用时 <code>self<\/code> 指向本实例。\n<\/li><li>\n继承获得父类成员，子类可重写同名方法，<code>super()<\/code> 用于调用父类初始化或方法。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章把前两章的数据处理动作封装起来：函数复用一段过程，类把数据与操作数据的方法绑在一起。第 10 章的文件读写与异常处理会以函数形式组织，<code>json.dump<\/code>、<code>json.load<\/code> 本身就是可调用的函数；第 11 章的测试用例则以类的形式继承 <code>unittest.TestCase<\/code>，每个测试方法是一个可独立运行的小函数。继承机制在测试类上再次出现。<\/p>", "ch04": "<div class=\"source-badge\">📖 出处：Python编程__从入门到实践_=_Python_Cras...rse_(Eric_Matthes)_(Z-Library).pdf · p.181<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 8、9 章：函数与类——把重复动作和成可复用结构<\/a><\/span><\/div><h1>第 10、11 章：文件、异常、JSON 持久化与测试代码<\/h1>\n<blockquote>对应原书第 10 章「文件和异常」、第 11 章「测试代码」（印刷页 162–199，PDF 第 181–205 页；偏移 = PDF 页 − 印刷页 = 19，已用第 10 章 PDF 181/印刷 162、第 11 章 PDF 206/印刷 187 两处章首互核）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n用 <code>with open(...)<\/code> 读取整个文件、逐行读取或生成各行列表，说出文件路径的相对与绝对写法；\n<\/li><li>\n以写入模式与附加模式打开文件，区分覆盖写入与追加写入；\n<\/li><li>\n用 <code>try-except-else<\/code> 捕获指定类型异常，说明未捕获异常沿调用栈传播的路径；\n<\/li><li>\n用 <code>json.dump()<\/code> 与 <code>json.load()<\/code> 把列表或字典保存到文件并读回内存；\n<\/li><li>\n继承 <code>unittest.TestCase<\/code> 编写测试方法，使用断言方法核对返回值，用 <code>setUp()<\/code> 复用测试对象。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>文件让程序把数据留在内存之外，下次运行还能读回；异常处理给“可能出错的代码”准备一条兜底分支，避免一个错误让整个程序崩掉；单元测试把“函数输出是否符合预期”写成可重复运行的断言，改动代码后能立刻知道有没有改坏。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：文件读写、异常处理与 JSON 持久化（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。第 10.1 节先用 <code>open()<\/code> 把文件读进内存，可一次性读取整个文件、逐行读取，或生成包含各行内容的列表（PDF 第 181 页起）。第 10.2 节区分写入模式 <code>&#x27;w&#x27;<\/code>（覆盖）与附加模式 <code>&#x27;a&#x27;<\/code>（在末尾追加）。第 10.3 节用 <code>try-except<\/code> 处理 <code>ZeroDivisionError<\/code>、<code>FileNotFoundError<\/code> 等异常对象；第 10.4 节用 <code>json.dump()<\/code> 把数据写入 <code>.json<\/code> 文件，<code>json.load()<\/code> 读回内存。<\/p>\n<h3>2. 概念 2：单元测试、断言方法与 setUp 复用（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。第 11.1 节导入 <code>unittest<\/code>，写一个继承 <code>unittest.TestCase<\/code> 的测试类，方法名以 <code>test_<\/code> 打头即被自动运行；方法内调用被测函数，用 <code>assertEqual<\/code> 核对实际值与预期值（PDF 第 208 页）。第 11.2 节的 <code>setUp()<\/code> 方法在每个测试方法运行前自动执行，把共用的实例建好，避免在每个测试方法里重复书写。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[open 文件] --&gt; B{模式}\nB --&gt;|r 读取| C[读入内存]\nB --&gt;|w 写入| D[覆盖写]\nB --&gt;|a 附加| E[末尾追加]\nF[try 代码块] --&gt; G{是否抛异常}\nG --&gt;|无异常| H[else 分支继续]\nG --&gt;|命中指定类型| I[except 兜底]\nG --&gt;|未被捕获| J[沿调用栈向上传播 终止]\nK[json.dump 写文件] --&gt; L[json.load 读回]\nM[TestCase 子类] --&gt; N[test_ 方法自动运行]\nN --&gt; O[断言核对实际值与预期值]\nP[setUp 建共用对象] --&gt; N<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：文件通路在 with 块结束后自动关闭文件；异常通路按类型匹配 except，匹配不上就向上传播；测试通路以 <code>test_<\/code> 前缀作为被运行的标记，断言不通过则该测试记为失败。<\/p>\n<h2>推导一（执行推演）：除零异常的传播与 try-except-else 分支<\/h2>\n<p>参照第 10.3.1 节的除零示例：<\/p>\n<pre class=\"lang-python\"><code>try:\n    print(5 / 0)\nexcept ZeroDivisionError:\n    print(&quot;You can&#x27;t divide by zero!&quot;)<\/code><\/pre>\n<p>逐行推演：<\/p>\n<ol><li>\n解释器进入 <code>try<\/code> 块，执行 <code>5 / 0<\/code>。除法运算要求除数非零，除数为 0 时解释器创建 <code>ZeroDivisionError<\/code> 异常对象。\n<\/li><li>\n解释器查找匹配的 <code>except<\/code>：该 except 指定的类型正是 <code>ZeroDivisionError<\/code>，命中后跳过 try 块余下语句，执行 except 块，打印 <code>You can&#x27;t divide by zero!<\/code>。\n<\/li><li>\n异常被就地处理，程序继续向后运行；不会显示 traceback。\n<\/ol>\n<p>对照带 <code>else<\/code> 的除法提示程序：<\/p>\n<pre class=\"lang-python\"><code>try:\n    answer = int(first_number) / int(second_number)\nexcept ZeroDivisionError:\n    print(&quot;You can&#x27;t divide by zero!&quot;)\nelse:\n    print(answer)<\/code><\/pre>\n<p>推演路径：输入 <code>first_number=&#x27;5&#x27;<\/code>、<code>second_number=&#x27;2&#x27;<\/code> 时，try 块内转换并相除得到 <code>2.5<\/code>，无异常抛出，进入 else 分支打印 <code>2.5<\/code>；输入除数 <code>&#x27;0&#x27;<\/code> 时除法抛异常，命中 except 打印提示，else 不执行。若 except 写的是别的异常类型（例如只捕获 <code>FileNotFoundError<\/code>），<code>ZeroDivisionError<\/code> 匹配不上，异常继续沿调用栈向上传播，最终未被捕获，程序终止并输出 traceback。<\/p>\n<h2>推导二（执行推演）：JSON 读写往返与测试断言核对<\/h2>\n<p>参照第 10.4.1 节的数字列表示例：<\/p>\n<pre class=\"lang-python\"><code>import json\n\nnumbers = [2, 3, 5, 7, 11, 13]\nfilename = &#x27;numbers.json&#x27;\nwith open(filename, &#x27;w&#x27;) as f_obj:\n    json.dump(numbers, f_obj)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n<code>numbers<\/code> 绑到列表对象；<code>open(filename, &#x27;w&#x27;)<\/code> 以写入模式打开文件，with 块结束后文件自动关闭。\n<\/li><li>\n<code>json.dump(numbers, f_obj)<\/code> 把列表序列化为 JSON 文本写入文件，文件内容为 <code>[2, 3, 5, 7, 11, 13]<\/code>。\n<\/li><li>\n另一个程序用 <code>json.load(f_obj)<\/code> 读回，重建出同样的列表对象，赋给变量继续使用。\n<\/ol>\n<p>测试断言参照第 11.1.2 节：<\/p>\n<pre class=\"lang-python\"><code>import unittest\nfrom name_function import get_formatted_name\n\nclass NamesTestCase(unittest.TestCase):\n    def test_first_last_name(self):\n        formatted_name = get_formatted_name(&#x27;janis&#x27;, &#x27;joplin&#x27;)\n        self.assertEqual(formatted_name, &#x27;Janis Joplin&#x27;)\n\nunittest.main()<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n测试类继承 <code>unittest.TestCase<\/code>；运行 <code>unittest.main()<\/code> 时，框架扫描类中以 <code>test_<\/code> 打头的方法并逐个执行。\n<\/li><li>\n调用 <code>get_formatted_name(&#x27;janis&#x27;, &#x27;joplin&#x27;)<\/code>，返回值存入 <code>formatted_name<\/code>。\n<\/li><li>\n<code>assertEqual<\/code> 比对实际值 <code>&#x27;Janis Joplin&#x27;<\/code> 与预期值：相等则该测试通过；不相等则记录失败并在报告中给出两侧取值。\n<\/ol>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉异常处理直接做除法<\/strong>：<code>print(5 / 0)<\/code> 没有 try 块，异常对象无人捕获，解释器沿调用栈向上传播，程序终止并打印 traceback；用户看到的是令人生惑的错误栈，而不是友好提示。\n<\/li><li>\n<strong>不用 <code>with<\/code> 打开文件<\/strong>：手动 <code>open()<\/code> 后若中间代码抛异常，文件可能来不及关闭，长期运行会占用文件句柄。<code>with<\/code> 块退出时无论正常结束还是异常跳出，都会关闭文件。\n<\/li><li>\n<strong>测试方法名不以 <code>test_<\/code> 开头<\/strong>：测试框架只扫描 <code>test_<\/code> 前缀的方法；命名为 <code>check_name()<\/code> 的方法不会被自动运行，写错了也不会在测试报告里暴露。\n<\/li><li>\n<strong>用宽泛的 <code>except:<\/code> 捕获所有异常<\/strong>：把 <code>ZeroDivisionError<\/code>、<code>FileNotFoundError<\/code> 之外的错误（包括代码拼写错误、键盘中断）一并吞掉，真正的问题被隐藏，调试时无从定位。应按具体异常类型写 except。\n<\/li><li>\n<strong>写入模式覆盖已有文件<\/strong>：以 <code>&#x27;w&#x27;<\/code> 打开已有文件时，原有内容先被清空再写入；想保留旧内容只能用附加模式 <code>&#x27;a&#x27;<\/code>。\n<\/ul>\n<h2>本章的几个为什么<\/h2>\n<ol><li>\n<strong>为什么读写文件要经过 <code>open<\/code> 而不是直接操作磁盘文本？<\/strong> 文件对象是程序与磁盘之间的入口，由它负责定位路径、按模式读写与关闭资源；with 块退出时自动关闭，避免异常中途跳出后句柄泄漏。\n<\/li><li>\n<strong>为什么 except 要按具体异常类型写？<\/strong> 不同错误的处理方式不同：除零给提示，文件缺失换默认文件；宽泛捕获会把拼写错误、中断等不该吞掉的问题一并藏起，掩盖真正缺陷。\n<\/li><li>\n<strong>为什么保存结构化数据用 json 而不是手工拼文本？<\/strong> 列表、字典含嵌套与特殊字符，手工拼接容易出错；json.dump 统一完成序列化与转义，json.load 读回时按结构重建对象，往返格式一致。\n<\/li><li>\n<strong>为什么测试方法要以 <code>test_<\/code> 打头？<\/strong> 框架靠这个前缀扫描需要运行的测试；辅助准备方法不属于测试情形，不加前缀即被排除。前缀约定让测试代码与普通工具方法区分开。\n<\/ol>\n<h2>类比与实例<\/h2>\n<p>文件像仓库：<code>r<\/code> 是取货，<code>w<\/code> 是清空货架重新码放，<code>a<\/code> 是在货架末尾补货；with 语句像进出仓库自动锁门。异常处理像流水线的应急工位：零件正常就走下一道，出了指定故障就转到应急工位；没有对应工位，故障件沿传送带一路退回起点。单元测试像出厂检验清单：每个断言对应一项规格，产品（函数）送上来逐项核对，不合格就挂出失败标记。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解一：异常处理是为了让代码不出错。<\/strong> 异常处理承认错误会发生，把出错后的路径写清楚；它不消除错误本身。\n<\/li><li>\n<strong>误解二：json 文件存的是 Python 列表对象本身。<\/strong> 文件里存的是 JSON 文本；读回时由 <code>json.load()<\/code> 重建对应的数据结构。\n<\/li><li>\n<strong>误解三：测试通过说明程序没有任何缺陷。<\/strong> 测试只覆盖了断言写到的那些输入与分支；未被测试触及的路径仍可能存在问题。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n写出用 <code>with open(&#x27;pi.txt&#x27;) as f_obj:<\/code> 逐行读取文件并把每行去掉末尾换行后存入列表的代码；说明 <code>&#x27;w&#x27;<\/code> 与 <code>&#x27;a&#x27;<\/code> 在处理已有文件时的差别。\n<\/li><li>\n给定除数可能为 0 的两段整数相除代码，写出 try-except-else 结构：除零打印提示，否则打印商；说明 except 类型写错会发生什么。\n<\/li><li>\n为什么测试方法必须以 <code>test_<\/code> 打头？<code>setUp()<\/code> 与在每个测试方法内部重复建实例相比，省去了哪一步？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\n<code>with open<\/code> 自动关闭文件；<code>&#x27;w&#x27;<\/code> 覆盖、<code>&#x27;a&#x27;<\/code> 追加；json.dump/json.load 完成文本化保存与读回。\n<\/li><li>\ntry 块正常无异常走 else；命中指定异常走 except；未捕获异常沿调用栈传播并终止程序。\n<\/li><li>\n测试类继承 TestCase，<code>test_<\/code> 方法自动运行，断言核对实际值与预期值，setUp 在每个测试前建共用对象。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章是全书第一部分的收尾：文件与持久化让第 1、2 章组织的数据在程序关闭后留存；异常处理把第 5 章的分支判断扩展到“出错时走哪条路”；测试类继承第 9 章的继承机制，断言方法核对第 8 章函数的返回值。第二部分的三个项目（游戏、数据可视化、Web 应用）都在这套地基上展开：游戏用类管理飞船与子弹，可视化用文件读取数据集，Web 应用用文件与数据库保存用户输入。<\/p>", "c01": "<div class=\"source-badge\">📖 出处：Python编程__从入门到实践_=_Python_Cras...rse_(Eric_Matthes)_(Z-Library).pdf · p.35<\/div><h1>变量绑定与可变/不可变对象<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书第 2 章 §2.2，PDF 第 35–36 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>变量是一个名字，解释器把它与内存中的某个对象绑定；重新赋值改变的是这个名字绑到哪个对象，而不是旧对象内部；对象按能否在原地被修改分为可变对象与不可变对象两类。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>初学者写程序时常遇到三类现象，单看语法说明很难解释清楚。其一，字符串“改了一个字符”之后原串没有变；其二，把一个列表赋给另一个变量后，对后者追加元素，前者也跟着变；其三，函数内部修改传进来的参数，调用处的数据有时跟着变、有时不变。这三类现象的共同根源是没有把“名字”和“对象”分开，也没有区分对象是否允许原地修改。如果把变量理解成装着值的盒子，就会以为赋值是把旧值擦掉重写；实际执行时，解释器先造出对象，再让名字指向它，赋值与原地修改走的是两条不同路径。本概念把这两条路径拆开，为后面学习列表、字典、函数传参打地基。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>名字（标识符）<\/strong>：由字母、数字、下划线组成且不以数字开头的符号，如 <code>message<\/code>、<code>my_dog<\/code>。名字本身不装数据，它只是一张贴在对象上的标签。<\/p>\n<p><strong>对象<\/strong>：内存中存在的一段数据，对象自带类型与值。字符串 <code>&quot;Hello&quot;<\/code>、整数 <code>6<\/code>、列表 <code>[1, 2]<\/code> 都是对象；类型依附于对象，不依附于名字。<\/p>\n<p><strong>绑定<\/strong>：执行 <code>message = &quot;Hello&quot;<\/code> 时，解释器先创建字符串对象，再把名字 <code>message<\/code> 绑定到该对象；名字与对象之间的这条对应关系就是绑定。<\/p>\n<p><strong>重新赋值<\/strong>：执行 <code>message = &quot;World&quot;<\/code> 时，原字符串对象没有被改写，名字 <code>message<\/code> 改绑到新的字符串对象；旧对象若再没有任何名字指向它，会被回收。<\/p>\n<p><strong>可变对象<\/strong>：内容可以在原地增、删、改的对象，典型代表是列表、字典、集合。原地修改后对象身份不变，指向它的所有名字都看到改动后的内容。<\/p>\n<p><strong>不可变对象<\/strong>：一旦创建，内容不能在原地改动的对象，典型代表是整数、浮点数、字符串、元组。任何“修改”动作都会生成新对象，再把名字重新绑过去。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>message = &quot;Hello Python world!&quot;\nprint(message)          # 输出 Hello Python world!<\/code><\/pre>\n<p><strong>反例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>message = &quot;Hello Python Crash Course reader!&quot;\nprint(mesage)           # NameError: name &#x27;mesage&#x27; is not defined<\/code><\/pre>\n<p>报错原因是 <code>mesage<\/code> 这个名字从未被绑定，解释器沿当前作用域找不到它，而不是字符串内容出错。<\/p>\n<h2>原理推导：赋值、别名与原地修改的执行路径<\/h2>\n<p>推演分三步，每一步对照解释器实际做的事。<\/p>\n<p>第一步，单名字绑定。执行 <code>message = &quot;Hello&quot;<\/code>：解释器创建字符串对象 <code>&quot;Hello&quot;<\/code>，建立绑定 <code>message → &quot;Hello&quot;<\/code>。执行 <code>print(message)<\/code> 时沿绑定取回对象再打印。第二次执行 <code>message = &quot;World&quot;<\/code>，创建新对象 <code>&quot;World&quot;<\/code>，把绑定改成 <code>message → &quot;World&quot;<\/code>；旧对象 <code>&quot;Hello&quot;<\/code> 保持原样。<\/p>\n<p>第二步，两个名字绑到同一个可变对象。<\/p>\n<pre class=\"lang-python\"><code>a = [1, 2]\nb = a\nb.append(3)\nprint(a)                # 输出 [1, 2, 3]<\/code><\/pre>\n<p>推演：<code>a<\/code> 绑到列表对象 <code>[1, 2]<\/code>；<code>b = a<\/code> 把 <code>b<\/code> 也绑到同一个列表对象，这叫别名；<code>b.append(3)<\/code> 在原列表对象末尾追加元素，对象身份没变；<code>a<\/code> 指向的仍是这个对象，因此 <code>print(a)<\/code> 看到追加后的结果。<\/p>\n<p>第三步，不可变对象的“改动”生成新对象。<\/p>\n<pre class=\"lang-python\"><code>s = &quot;abc&quot;\nt = s\ns = s + &quot;d&quot;\nprint(t)                # 输出 abc\nprint(s)                # 输出 abcd<\/code><\/pre>\n<p>推演：<code>s<\/code>、<code>t<\/code> 都绑到字符串 <code>&quot;abc&quot;<\/code>；<code>s + &quot;d&quot;<\/code> 不能在原字符串上改，解释器造出 <code>&quot;abcd&quot;<\/code>，把 <code>s<\/code> 改绑过去；<code>t<\/code> 仍绑到旧字符串 <code>&quot;abc&quot;<\/code>，内容不变。<\/p>\n<p>第四步，函数传参时的绑定方向。把可变对象传入函数，函数内原地修改会影响外部对象；函数内重新绑定形参，只是让形参改指新对象，外部名字不动。这一区分在 c06 函数概念中继续展开。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：讨论赋值、传参、别名、拼接、追加等动作时，先分清这一步是改绑名字还是原地改对象。\n<\/li><li>\n边界一：元组是不可变的，但元组里装的列表仍可变。<code>pair = ([1, 2], 3)<\/code> 中不能替换 <code>pair[0]<\/code>，但可以对 <code>pair[0]<\/code> 调 <code>append<\/code>。\n<\/li><li>\n边界二：数字与字符串的“看似修改”都生成新对象；连续拼接长字符串时，反复造新对象会带来额外开销。\n<\/li><li>\n失败案例：把可变对象用作函数默认值，默认列表在函数定义阶段只创建一次，多次调用共享同一对象，上一次追加的元素残留到下一次调用。\n<\/li><li>\n失败案例：以为 <code>b = a<\/code> 复制了列表，随后通过 <code>b<\/code> 追加元素，发现 <code>a<\/code> 也变了；需要独立副本时应显式切片或复制。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>赋值 vs 复制<\/strong>：<code>b = a<\/code> 建立别名，两个名字指向同一对象；切片 <code>b = a[:]<\/code> 或复制方法才生成新列表，两个对象互不影响。\n<\/li><li>\n<strong>相等 <code>==<\/code> vs 身份 <code>is<\/code><\/strong>：<code>==<\/code> 比较两个对象的值是否相同；<code>is<\/code> 判断两个名字是否指向同一个对象。两个值相等的字符串可能是不同对象，两个别名则 <code>is<\/code> 为真。\n<\/li><li>\n<strong>变量 vs 盒子<\/strong>：盒子模型暗示值被存进变量内部；绑定模型中变量只是标签，对象独立存在于内存。\n<\/li><li>\n<strong>不可变 vs 不可修改引用<\/strong>：不可变约束的是对象内容；名字可以被重新绑到任何对象，绑定关系本身不受不可变约束。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无，本概念是全书数据表示的最底层。后继：c02 列表在可变对象基础上提供按位置存取与切片；c03 字典作为可变容器按键组织数据；c06 函数调用时实参到形参的绑定沿用本概念的传参方向；c07 实例属性通过 <code>self.属性名<\/code> 绑定到实例对象。理解“改绑”与“原地改”的差别，是排查别名串扰、默认值残留两类常见错误的前提。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（变量绑定与可变/不可变对象）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：名字与对象的绑定路径、别名串扰与可变/不可变语义<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把“变量赋值后谁变了、为什么另一个名字也跟着变”讲到能逐步推演，先往回追四层前提：<\/p>\n<ol><li>\n<strong>程序里出现的每个数据都是对象<\/strong>。整数、字符串、列表、字典在解释器内部都以对象形式存在，对象携带类型与值；名字只是访问对象的入口。承认这一点，才能把“名字”和“数据”分开讨论。\n<\/li><li>\n<strong>赋值动作建立绑定而不是搬运内容<\/strong>。<code>x = 表达式<\/code> 先求表达式得到一个对象，再让名字 <code>x<\/code> 指向该对象；不存在把一份数据复制进变量内部这一步。\n<\/li><li>\n<strong>对象分可变与不可变两类<\/strong>。可变对象允许原地增删改，对象身份保持不变；不可变对象不允许原地改，任何修改动作都生成新对象。这条分类决定了同一个动作走“原地改”还是“造新对象”。\n<\/li><li>\n<strong>多个名字可以绑到同一对象<\/strong>。把一个已绑定的名字赋给另一个名字，两个标签贴在同一个对象上；此后从任一标签进入，看到的都是对象当前的内容。\n<\/ol>\n<p>依赖链方向：对象存在 → 赋值建立绑定 → 对象按可变性分类 → 别名共享同一对象。任何一层前提缺失，就会把别名串扰误判成“赋值复制了一份”，把不可变对象的新对象误判成“原对象被改了”。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：画出绑定关系<\/h3>\n<p>设执行 <code>message = &quot;Hello Python world!&quot;<\/code>。解释器先在内存创建字符串对象，值为 <code>Hello Python world!<\/code>；随后在当前作用域的名字表中登记 <code>message<\/code>，其指向该字符串对象。绑定关系记为 <code>message → 对象 S1<\/code>，其中 S1 的类型是 <code>str<\/code>，值是该串。<\/p>\n<h3>第二步：重新赋值改绑目标<\/h3>\n<p>再执行 <code>message = &quot;Hello Python Crash Course world!&quot;<\/code>。解释器创建第二个字符串对象 S2；名字表中 <code>message<\/code> 的指向从 S1 改为 S2。S1 本身没有被改写，它的内容仍是旧串；若没有其他名字指向 S1，该对象后续被回收。这一步的依据是字符串属于不可变对象，解释器不会在 S1 内部做字符替换。<\/p>\n<h3>第三步：别名指向同一可变对象<\/h3>\n<p>执行 <code>a = [1, 2]<\/code>：创建列表对象 L1，<code>a → L1<\/code>。执行 <code>b = a<\/code>：不创建新列表，名字表中 <code>b<\/code> 也指向 L1，即 <code>a<\/code> 与 <code>b<\/code> 是别名。执行 <code>b.append(3)<\/code>：列表是可变对象，<code>append<\/code> 在 L1 末尾原地加入元素 3，L1 内部变为 <code>[1, 2, 3]<\/code>，L1 的身份没有变。由于 <code>a<\/code> 仍指向 L1，<code>print(a)<\/code> 取回的就是追加后的 L1。<\/p>\n<h3>第四步：不可变对象上的修改生成新对象<\/h3>\n<p>执行 <code>s = &quot;abc&quot;<\/code>：字符串对象 T1，<code>s → T1<\/code>。执行 <code>t = s<\/code>：<code>t → T1<\/code>。执行 <code>s = s + &quot;d&quot;<\/code>：拼接运算符不能改写 T1，解释器创建新字符串 T2，值为 <code>abcd<\/code>，把 <code>s<\/code> 改绑到 T2；<code>t<\/code> 的指向没有动，仍为 T1。因此 <code>print(t)<\/code> 得 <code>abc<\/code>，<code>print(s)<\/code> 得 <code>abcd<\/code>。<\/p>\n<h3>第五步：传参时的绑定方向<\/h3>\n<p>函数调用 <code>f(x)<\/code> 时，形参在函数帧内绑到实参指向的对象。函数体内若对形参做原地修改（可变对象调 append、字典赋值），改动落在共享对象上；若对形参重新赋值，只是形参改指新对象，调用处的外部名字不受影响。这一步把绑定规则从模块级名字推广到函数帧内名字。<\/p>\n<h2>算例一：列表别名、追加与切片复制的对照<\/h2>\n<p>给定代码：<\/p>\n<pre class=\"lang-python\"><code>a = [10, 20, 30]\nb = a\nb.append(40)\nc = a[:]\nc.append(50)\nprint(a)\nprint(b)\nprint(c)<\/code><\/pre>\n<p>逐行推演并记录中间状态：<\/p>\n<ol><li>\n<code>a = [10, 20, 30]<\/code>：列表 L1 内容 <code>[10, 20, 30]<\/code>，<code>a → L1<\/code>。\n<\/li><li>\n<code>b = a<\/code>：<code>b → L1<\/code>，别名成立，没有新列表产生。\n<\/li><li>\n<code>b.append(40)<\/code>：L1 原地追加，内容变为 <code>[10, 20, 30, 40]<\/code>；<code>a<\/code>、<code>b<\/code> 都指向 L1。\n<\/li><li>\n<code>c = a[:]<\/code>：切片生成新列表 L2，内容复制 L1 当前的 <code>[10, 20, 30, 40]<\/code>，<code>c → L2<\/code>；L1 与 L2 是两个对象。\n<\/li><li>\n<code>c.append(50)<\/code>：L2 原地追加，内容变为 <code>[10, 20, 30, 40, 50]<\/code>；L1 不受影响。\n<\/li><li>\n输出核对：<code>print(a)<\/code> 取 L1，得 <code>[10, 20, 30, 40]<\/code>；<code>print(b)<\/code> 同取 L1，结果相同；<code>print(c)<\/code> 取 L2，得 <code>[10, 20, 30, 40, 50]<\/code>。\n<\/ol>\n<p>身份核对：<code>a is b<\/code> 为 True，因为二者指向 L1；<code>a is c<\/code> 为 False，因为 L1 与 L2 是两个对象；<code>a == c<\/code> 在追加 50 之前为 True，追加之后值不同，比较结果为 False。<\/p>\n<h3>第六步：身份比较与相等比较的区分<\/h3>\n<p><code>id(obj)<\/code> 给出对象在当前运行期间的唯一标识；两个名字指向同一对象时 <code>id<\/code> 相同，<code>is<\/code> 判定为真。<code>==<\/code> 调用对象自身的相等判定规则，比较值而不比较身份。列表 <code>[1, 2]<\/code> 与另一个新建列表 <code>[1, 2]<\/code> 值相等，<code>==<\/code> 为 True，但二者是不同对象，<code>is<\/code> 为 False。这条区分用于排查别名：当改动一个名字导致另一个名字跟着变，先查二者是否 <code>is<\/code> 同一对象，而不是只看值是否相等。<\/p>\n<h2>算例二：字符串、数字拼接与元组含列表的边界<\/h2>\n<p>给定代码：<\/p>\n<pre class=\"lang-python\"><code>x = 10\ny = x\nx = x + 5\ntext = &quot;py&quot;\ntext2 = text\ntext = text + &quot;3&quot;\npair = ([1, 2], 3)\npair[0].append(9)\nprint(y)\nprint(text2)\nprint(pair)<\/code><\/pre>\n<p>逐行推演：<\/p>\n<ol><li>\n<code>x = 10<\/code>：整数对象 N1 值 10，<code>x → N1<\/code>。\n<\/li><li>\n<code>y = x<\/code>：<code>y → N1<\/code>。\n<\/li><li>\n<code>x = x + 5<\/code>：整数不可变，运算生成新整数 N2 值 15，<code>x → N2<\/code>；<code>y<\/code> 仍指向 N1，<code>print(y)<\/code> 得 <code>10<\/code>。\n<\/li><li>\n<code>text = &quot;py&quot;<\/code>：字符串 S1，<code>text → S1<\/code>。\n<\/li><li>\n<code>text2 = text<\/code>：<code>text2 → S1<\/code>。\n<\/li><li>\n<code>text = text + &quot;3&quot;<\/code>：拼接生成新字符串 S2 值 <code>py3<\/code>，<code>text → S2<\/code>；<code>text2<\/code> 仍指 S1，<code>print(text2)<\/code> 得 <code>py<\/code>。\n<\/li><li>\n<code>pair = ([1, 2], 3)<\/code>：元组对象 P1，其第一个元素是列表 L1 <code>[1, 2]<\/code>，第二个元素是整数 3。元组不可变指不能替换 P1 里的两个槽位，但 L1 本身是列表。\n<\/li><li>\n<code>pair[0].append(9)<\/code>：取到 L1 后原地追加 9，L1 变为 <code>[1, 2, 9]<\/code>；元组槽位没有被替换，这条操作合法。<code>print(pair)<\/code> 得 <code>([1, 2, 9], 3)<\/code>。\n<\/ol>\n<p>边界核对：若写 <code>pair[0] = [7, 8]<\/code>，元组不支持元素替换，抛 <code>TypeError: &#x27;tuple&#x27; object does not support item assignment<\/code>；这与上一步对内部列表追加是两种不同动作。<\/p>\n<h2>算例三：函数传参时原地修改与重新绑定的对照<\/h2>\n<p>给定两段函数，对照传参后的外部状态：<\/p>\n<pre class=\"lang-python\"><code>def append_one(seq):\n    seq.append(1)\n\ndef rebind(seq):\n    seq = [9, 9]\n\nnums = [2, 3]\nappend_one(nums)\nprint(nums)\n\nrebind(nums)\nprint(nums)<\/code><\/pre>\n<p>逐行推演：<\/p>\n<ol><li>\n<code>nums = [2, 3]<\/code>：列表 L1，<code>nums → L1<\/code>。\n<\/li><li>\n调用 <code>append_one(nums)<\/code>：函数帧内形参 <code>seq<\/code> 绑到 L1；<code>seq.append(1)<\/code> 在 L1 原地追加，L1 变为 <code>[2, 3, 1]<\/code>；函数返回，<code>nums<\/code> 仍指向 L1，<code>print(nums)<\/code> 得 <code>[2, 3, 1]<\/code>。\n<\/li><li>\n调用 <code>rebind(nums)<\/code>：形参 <code>seq<\/code> 绑到 L1；函数体执行 <code>seq = [9, 9]<\/code>，创建新列表 L2，把形参 <code>seq<\/code> 改绑到 L2；这一动作只改函数帧内的名字，外部 <code>nums<\/code> 仍指向 L1。函数返回后帧内 <code>seq<\/code> 消失，L2 失去引用。<code>print(nums)<\/code> 仍得 <code>[2, 3, 1]<\/code>。\n<\/li><li>\n对照结论：原地修改穿透函数帧影响共享对象；重新绑定形参不影响外部名字。判断函数会不会改外部数据，看函数体对形参做的是原地操作还是重新赋值。\n<\/ol>\n<p>补充推演：若传入不可变对象，例如 <code>n = 5<\/code> 传给执行 <code>n = n + 1<\/code> 的函数，函数内造新整数并改绑形参，外部 <code>n<\/code> 保持 5；不可变对象没有原地修改的入口，形参重新绑定与外部无关。<\/p>\n<h2>算例四：嵌套容器的别名扩散<\/h2>\n<p>给定代码：<\/p>\n<pre class=\"lang-python\"><code>board = [[0, 0], [0, 0]]\nrow = board[0]\nrow.append(1)\nprint(board)\nboard[1].append(2)\nprint(row)<\/code><\/pre>\n<p>逐行推演：<\/p>\n<ol><li>\n<code>board = [[0, 0], [0, 0]]<\/code>：外层列表 L0，内含两个子列表 L1 <code>[0, 0]<\/code>、L2 <code>[0, 0]<\/code>；<code>board → L0<\/code>。\n<\/li><li>\n<code>row = board[0]<\/code>：<code>board[0]<\/code> 取回 L1，<code>row → L1<\/code>，别名成立。\n<\/li><li>\n<code>row.append(1)<\/code>：L1 原地追加，变为 <code>[0, 0, 1]<\/code>；L0 的第一个槽位仍指向 L1。<code>print(board)<\/code> 得 <code>[[0, 0, 1], [0, 0]]<\/code>。\n<\/li><li>\n<code>board[1].append(2)<\/code>：取到 L2 原地追加，L2 变为 <code>[0, 0, 2]<\/code>；<code>row<\/code> 指向 L1，不受影响，<code>print(row)<\/code> 得 <code>[0, 0, 1]<\/code>。\n<\/li><li>\n边界核对：嵌套结构中，外层列表的每个槽位存的是内层对象的引用；复制外层列表只复制一层引用（浅复制），子列表仍被共享。需要完全独立的嵌套副本时要逐层复制。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：可变默认参数残留。<\/strong> 代码：<\/p>\n<pre class=\"lang-python\"><code>def add_item(item, bag=[]):\n    bag.append(item)\n    return bag\n\nprint(add_item(&#x27;a&#x27;))     # [&#x27;a&#x27;]\nprint(add_item(&#x27;b&#x27;))     # [&#x27;a&#x27;, &#x27;b&#x27;]，不是 [&#x27;b&#x27;]<\/code><\/pre>\n<p>复盘：默认列表在 <code>def<\/code> 执行阶段创建一次，后续每次调用复用同一个列表对象；第一次追加 <code>&#x27;a&#x27;<\/code> 留在该对象上，第二次调用时默认值仍是含 <code>&#x27;a&#x27;<\/code> 的列表。修复方式：形参默认值写 <code>None<\/code>，函数体内 <code>if bag is None: bag = []<\/code>，每次调用新建列表。<\/p>\n<p><strong>案例 2：以为切片是别名、别名是复制。<\/strong> 把 <code>b = a<\/code> 当成复制，后续 <code>b.append<\/code> 改动了 <code>a<\/code>；反过来把 <code>b = a[:]<\/code> 当成别名，以为改 <code>b<\/code> 会反映到 <code>a<\/code>。两种误判都源于没分清“指向同一对象”与“生成新对象”。<\/p>\n<p><strong>案例 3：对不可变对象做索引赋值。<\/strong> 写 <code>text[0] = &#x27;P&#x27;<\/code> 想改首字符，字符串不支持项赋值，抛 <code>TypeError: &#x27;str&#x27; object does not support item assignment<\/code>。可行路径是切片拼接造新串，再把变量重新绑过去。<\/p>\n<p><strong>案例 4：浅复制在嵌套结构里残留共享。<\/strong> 用 <code>b = a[:]<\/code> 复制外层列表，以为两个列表完全独立；当 <code>a<\/code> 的元素本身是列表时，<code>b<\/code> 的对应槽位仍指向同一子列表，改子列表会同时反映到两边。复盘：切片复制只复制最外层一层引用，嵌套层需要显式逐层复制或使用深复制手段。<\/p>\n<p><strong>案例 5：把名字复用当成对象被覆盖。<\/strong> 循环中反复用同一个名字收集结果，旧对象在失去引用后被回收；若之前把旧对象通过别名保存在另一个列表里，追加进去的只是当时的引用，后续原地修改会改变那个被保存的对象。保存可变对象前先想清楚后续是否还会原地改动它。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：赋值时对象被复制进变量了吗？答：没有，只是建立名字到对象的绑定。\n<\/li><li>\n问：两个名字 <code>is<\/code> 判定为真意味着什么？答：指向同一个对象；值相等但不是同一对象时 <code>==<\/code> 为真而 <code>is<\/code> 为假。\n<\/li><li>\n问：列表追加后别名为什么都看到新元素？答：追加是原地修改，对象身份没变，所有指向它的名字取回的都是改后内容。\n<\/li><li>\n问：字符串拼接后旧串为什么不变？答：字符串不可变，拼接造新对象，旧对象保持原样，被改绑的只是名字。\n<\/li><li>\n问：元组不可变，为什么还能往它装的列表里追加？答：不可变约束的是元组槽位不能替换，槽位里的列表对象本身仍可变。\n<\/li><li>\n问：函数里对形参重新赋值，外部变量为什么不变？答：重新绑定只改函数帧内的形参名字，外部名字仍指向原对象；只有原地修改共享对象才会穿透帧边界。\n<\/li><li>\n问：两个列表值相同，为什么 <code>is<\/code> 为 False？答：<code>is<\/code> 比较身份不比较值；两个独立创建的列表即使元素相同也是两个对象。\n<\/li><li>\n问：<code>id<\/code> 在什么阶段用来判断别名？答：在需要确认两个名字是否指向同一对象时比较 <code>id<\/code> 或直接用 <code>is<\/code>；只判断数据是否相等用 <code>==<\/code>。\n<\/ul>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n给定 <code>nums = [3, 6]<\/code>，<code>other = nums<\/code>，<code>other += [9]<\/code>，<code>nums<\/code> 的内容是什么？若 <code>other = nums + [9]<\/code>，<code>nums<\/code> 又是什么？两种写法的对象身份有何差别？\n<\/li><li>\n写出一段代码，让两个字符串名字指向不同对象但值相等，并验证 <code>==<\/code> 为 True、<code>is<\/code> 为 False。\n<\/li><li>\n为什么可变对象适合做字典的值却不适合做字典的键？结合对象身份与内容稳定性说明。\n<\/li><li>\n函数 <code>def f(item, store=[])<\/code> 被连续调用三次后 <code>store<\/code> 里会有什么？要得到每次独立的空列表，函数体应怎样写？\n<\/li><li>\n元组 <code>t = ([], 5)<\/code> 中哪些位置允许原地修改，哪些位置不允许？各举一条合法写法与一条报错写法。\n<\/ol><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：Python编程__从入门到实践_=_Python_Cras...rse_(Eric_Matthes)_(Z-Library).pdf · p.51<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">变量绑定与可变/不可变对象<\/a><\/span><\/div><h1>列表、索引与切片边界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书第 3 章 §3.1–3.3、第 4 章 §4.4，PDF 第 51–62、73–76 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>列表是用方括号写出的有序可变集合，元素按从 0 开始的编号排列；通过索引定位单个元素，通过 <code>[start:end]<\/code> 切片取出连续一段，边界规则是含头不含尾。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>程序经常要处理一排有先后次序的数据：一组自行车品牌、一串魔术师名字、一支球队的队员名单。困难在于：怎样按位置取出某一项？怎样取出中间连续的几项？怎样在末尾或中间加入一项、删掉一项？编号从 0 还是 1 起、切片到哪个位置结束，是新手最容易写出差一错误的地方；索引超过合法范围会直接报错，切片越界却被截断，两种行为不一致，需要单独记清。本概念把索引定位、切片边界、增删动作与越界规则拆开推演，为遍历列表、在循环中移动元素打基础。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>列表字面量<\/strong>：方括号内用逗号分隔元素，如 <code>bicycles = [&#x27;trek&#x27;, &#x27;cannondale&#x27;, &#x27;redline&#x27;, &#x27;specialized&#x27;]<\/code>。列表元素可以是字符串、数字，也可以是另一个列表。<\/p>\n<p><strong>索引<\/strong>：元素在列表中的位置编号，从 0 开始。第一个元素索引 0，第二个索引 1，第 n 个元素索引 n−1；负索引从末尾倒数，<code>-1<\/code> 是末位元素，<code>-2<\/code> 是倒数第二个。<\/p>\n<p><strong>切片<\/strong>：写法 <code>list[start:end]<\/code>，取出索引 <code>start<\/code> 到 <code>end−1<\/code> 的元素；<code>start<\/code> 省略时从开头起，<code>end<\/code> 省略时取到末尾。切片返回一个新列表，原列表不变。<\/p>\n<p><strong>长度<\/strong>：<code>len(list)<\/code> 返回元素个数；合法正索引范围是 <code>0<\/code> 到 <code>len(list)−1<\/code>。<\/p>\n<p><strong>原地增删方法<\/strong>：<code>append(x)<\/code> 末尾追加；<code>insert(i, x)<\/code> 在索引 i 处插入；<code>pop(i)<\/code> 移除并返回索引 i 处元素，省略索引移除末尾；<code>remove(x)<\/code> 删除第一个值等于 x 的元素。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>bicycles = [&#x27;trek&#x27;, &#x27;cannondale&#x27;, &#x27;redline&#x27;, &#x27;specialized&#x27;]\nprint(bicycles[0])     # trek\nprint(bicycles[3])     # specialized\nprint(bicycles[-1])    # specialized<\/code><\/pre>\n<p><strong>反例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>print(bicycles[4])     # IndexError: list index out of range<\/code><\/pre>\n<p>列表长度为 4，合法索引是 0–3，索引 4 超出范围。<\/p>\n<h2>原理推导：定位、切片与增删的执行路径<\/h2>\n<p>推演分四步。<\/p>\n<p>第一步，索引定位。列表在内部把元素排成一段连续槽位；索引编号相当于从起点算起的偏移量。取 <code>bicycles[1]<\/code> 时，解释器从起点偏移 1 个槽位，取回 <code>&#x27;cannondale&#x27;<\/code>。索引 0 对应起点本身，这是编号从 0 起的原因。<\/p>\n<p>第二步，切片边界。给定 <code>players = [&#x27;charles&#x27;, &#x27;martina&#x27;, &#x27;michael&#x27;, &#x27;florence&#x27;, &#x27;eli&#x27;]<\/code>：<\/p>\n<pre class=\"lang-python\"><code>print(players[0:3])     # [&#x27;charles&#x27;, &#x27;martina&#x27;, &#x27;michael&#x27;]\nprint(players[1:4])     # [&#x27;martina&#x27;, &#x27;michael&#x27;, &#x27;florence&#x27;]<\/code><\/pre>\n<p><code>0:3<\/code> 包含 0、1、2，排除 3；<code>1:4<\/code> 包含 1、2、3，排除 4。终止位置是被排除的边界，因此切片元素个数等于 <code>end − start<\/code>。<\/p>\n<p>第三步，增删后的索引移位。末尾追加不影响已有元素编号；在中间插入元素时，插入位置之后的元素依次后移一位；按索引删除时，被删位置之后的元素依次前移一位。循环中边遍历边按索引删除，后面元素前移会导致下一项被跳过，处理这类情形应倒序遍历或先收集待删元素。<\/p>\n<p>第四步，代价对照。按索引取值不搬动元素，代价与列表长度无关；末尾追加在多数情况下直接放入末尾；在中间插入或按值删除需要挪动后续元素，代价随长度增长。切片生成新列表，需要复制取出的那一段元素。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：数据有先后次序、需要按位置存取、后续要增删改时使用列表。\n<\/li><li>\n边界一：索引越界访问报 <code>IndexError<\/code>；切片越界不报错，超出部分截断，例如长度 5 的列表写 <code>players[1:9]<\/code> 返回到末尾为止的元素。\n<\/li><li>\n边界二：切片是新列表，对切片结果追加、删除不会改原列表；想改原列表必须用赋值或原地方法。\n<\/li><li>\n边界三：列表元素可以是混合类型，也可以嵌套列表；嵌套时要按多层索引逐层取。\n<\/li><li>\n失败案例：把编号从 1 起的习惯带进 Python，取“第四个元素”写成索引 4，实际拿到第五个元素或越界。\n<\/li><li>\n失败案例：循环中用 <code>remove()<\/code> 反复按值删除，只删掉了连续重复值中的第一个，因为 <code>remove<\/code> 每次只删第一个匹配项。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>列表 vs 元组<\/strong>：列表可变，支持增删改；元组不可变，创建后槽位不能替换。需要固定集合用元组，需要后续改动用列表。\n<\/li><li>\n<strong>切片 vs 整列表复制<\/strong>：<code>players[:]<\/code> 切出整个列表的新副本；<code>players<\/code> 本身仍是原列表别名。嵌套结构中切片只复制一层引用。\n<\/li><li>\n<strong>pop vs remove<\/strong>：<code>pop<\/code> 按索引移除并返回元素；<code>remove<\/code> 按值移除第一个匹配项，不返回元素。值有重复时两者行为不同。\n<\/li><li>\n<strong>列表索引 vs 字典键<\/strong>：列表靠位置编号取值，编号与内容无关；字典靠键取值，键是有名称的标识。位置会随增删移动，键不会因为插入其他项而移位。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 绑定与可变对象是列表别名、切片复制的底层依据。后继：c05 的 while 循环在列表之间移动元素、删除含特定值的所有元素；c06 把列表作为参数传入函数，原地修改与别名规则沿用 c01；c07 实例属性常以列表形式保存一组子对象。列表的有序特征也决定了第 4 章 for 循环按索引顺序逐个取出元素。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（列表、索引与切片边界）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：索引定位、切片边界与增删移位的逐步推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把“第几个元素取出来、取一段边界落在哪、增删之后编号怎么变”讲到可推演，先往回追四层前提：<\/p>\n<ol><li>\n<strong>列表是有序槽位序列<\/strong>。元素按书写顺序排在一串槽位里，次序本身是数据的一部分；这与按键存放、次序无关的字典区分开。\n<\/li><li>\n<strong>编号从 0 起<\/strong>。索引是从列表起点算起的偏移量，起点偏移 0，第二个元素偏移 1。承认偏移量视角，差一错误就能用“位置减 1”核对。\n<\/li><li>\n<strong>对象可原地增删<\/strong>。列表是可变容器，append、insert、pop、remove 直接改原列表内部，不生成新列表；切片则相反，生成新列表。\n<\/li><li>\n<strong>合法范围由长度决定<\/strong>。<code>len(list)<\/code> 给出槽位总数，正索引必须落在 <code>0<\/code> 到 <code>len−1<\/code>；负索引从末尾反向数。\n<\/ol>\n<p>依赖链方向：有序槽位 → 偏移量编号 → 原地增删与切片新列表两条路径 → 长度界定合法范围。任何一层前提缺失，就会把切片当成改原列表，把越界索引与越界切片当成同一种行为。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：索引即偏移<\/h3>\n<p>设列表 L 有 n 个元素，从左到右槽位编号为 0、1、…、n−1。取 <code>L[i]<\/code> 时，解释器从起点移动 i 个槽位取回元素；负索引 <code>L[-k]<\/code> 等价于 <code>L[n−k]<\/code>。合法条件：<code>0 ≤ i ≤ n−1<\/code>，或 <code>-n ≤ i ≤ -1<\/code>。<\/p>\n<h3>第二步：切片区间是半开区间<\/h3>\n<p>切片 <code>L[start:end]<\/code> 收集槽位 <code>start, start+1, …, end−1<\/code>。区间左端闭合、右端开放，因此取出元素个数为 <code>end − start<\/code>；<code>start<\/code> 缺省取 0，<code>end<\/code> 缺省取 n。切片过程不改原列表，返回的新列表按相同次序装这些元素。<\/p>\n<h3>第三步：末尾追加不改变旧编号<\/h3>\n<p><code>L.append(x)<\/code> 在槽位 n 处放入 x，旧槽位 0…n−1 的编号保持不变；新元素编号为 n。这是代价最低的原地扩充方式。<\/p>\n<h3>第四步：中间插入引发后移<\/h3>\n<p><code>L.insert(i, x)<\/code> 在槽位 i 放入 x，原槽位 i 及之后的元素依次后移一位；插入后长度为 n+1。被后移的元素编号都加 1。<\/p>\n<h3>第五步：删除引发前移<\/h3>\n<p><code>L.pop(i)<\/code> 移除槽位 i 的元素并返回它，其后元素依次前移一位，长度变为 n−1；<code>L.remove(x)<\/code> 找到第一个值等于 x 的槽位执行相同前移。被前移的元素编号都减 1。<\/p>\n<h3>第六步：代价对照<\/h3>\n<p>按索引取值只需偏移定位，不搬动元素；append 多数情况直接放入末尾；insert 与 remove 要挪动插入点或删除点之后的元素，挪动步数随位置往后增长；切片复制取出段的元素，新列表长度等于区间元素个数。<\/p>\n<p>把代价写成步数对照：长度 n 的列表，索引取值步数与 n 无关；末尾追加步数固定；在槽位 i 插入需要把 i 之后的 n−i 个元素后移；按值删除需要先扫描匹配位置，再挪动其后元素；切片 <code>[start:end]<\/code> 需要复制 <code>end−start<\/code> 个元素。判断一段列表操作是否会拖慢长列表，先看它有没有在中间位置反复插入或删除。<\/p>\n<h3>第七步：遍历与索引的配合<\/h3>\n<p>for 循环按槽位顺序逐个取出元素，循环变量绑定到当前元素，不直接暴露索引；需要同时拿到索引与元素时，按编号范围取值。遍历过程中列表长度改变，已排好的槽位编号随之重排，这也是边遍历边删除容易出错的根源：循环前进的是编号，元素却在前移。<\/p>\n<h2>算例一：索引、负索引与多组切片手算<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>players = [&#x27;charles&#x27;, &#x27;martina&#x27;, &#x27;michael&#x27;, &#x27;florence&#x27;, &#x27;eli&#x27;]<\/code><\/pre>\n<p>长度 <code>len(players) = 5<\/code>，合法正索引 0–4，负索引 -5 到 -1。逐组推演：<\/p>\n<ol><li>\n<code>players[0]<\/code>：偏移 0，得 <code>&#x27;charles&#x27;<\/code>。\n<\/li><li>\n<code>players[3]<\/code>：偏移 3，得 <code>&#x27;florence&#x27;<\/code>。\n<\/li><li>\n<code>players[-1]<\/code>：等价 <code>players[4]<\/code>，得 <code>&#x27;eli&#x27;<\/code>；<code>players[-2]<\/code> 等价 <code>players[3]<\/code>，得 <code>&#x27;florence&#x27;<\/code>。\n<\/li><li>\n<code>players[0:3]<\/code>：区间 0、1、2，得 <code>[&#x27;charles&#x27;, &#x27;martina&#x27;, &#x27;michael&#x27;]<\/code>，个数 <code>3−0=3<\/code>。\n<\/li><li>\n<code>players[1:4]<\/code>：区间 1、2、3，得 <code>[&#x27;martina&#x27;, &#x27;michael&#x27;, &#x27;florence&#x27;]<\/code>，个数 <code>4−1=3<\/code>。\n<\/li><li>\n<code>players[:2]<\/code>：start 缺省为 0，区间 0、1，得 <code>[&#x27;charles&#x27;, &#x27;martina&#x27;]<\/code>。\n<\/li><li>\n<code>players[2:]<\/code>：end 缺省为 5，区间 2、3、4，得 <code>[&#x27;michael&#x27;, &#x27;florence&#x27;, &#x27;eli&#x27;]<\/code>。\n<\/li><li>\n越界核对：<code>players[5]<\/code> 不在 0–4，抛 <code>IndexError: list index out of range<\/code>；<code>players[1:9]<\/code> 切片越界，end 截断为 5，得 <code>[&#x27;martina&#
