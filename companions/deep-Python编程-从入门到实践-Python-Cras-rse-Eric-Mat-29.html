7;green&#x27;<\/code>，映射条数不增加。<\/p>\n<h3>第四步：缺键路径<\/h3>\n<p>访问不存在的键，如 <code>alien_0[&#x27;speed&#x27;]<\/code>：哈希定位后比对不到相同键，解释器抛 <code>KeyError: &#x27;speed&#x27;<\/code>。缺键不是类型错误，而是查找未命中；程序可在访问前判断键是否在字典中，或使用带默认返回值的取值方式。<\/p>\n<h3>第五步：键唯一性<\/h3>\n<p>写字典时出现同名键，后写的值覆盖先写的值。字典内部一个键只对应一条映射；查找同名键时只能取回末次写入的值，前面的值不再保留。<\/p>\n<h3>第六步：值的任意性<\/h3>\n<p>值可以是数字、字符串、列表、字典。键决定查找入口，值只作为被存取的数据，因此值允许重复、允许是可变对象。两个不同键可以指向同一个列表对象，别名规则沿用 c01。<\/p>\n<h3>第七步：嵌套取值层级<\/h3>\n<p>字典中存字典时，取值要逐层给键：<code>alien[&#x27;location&#x27;][&#x27;x&#x27;]<\/code> 先取外层键 <code>&#x27;location&#x27;<\/code> 得到内层字典，再取内层键 <code>&#x27;x&#x27;<\/code>。字典列表则先按列表索引取到某个字典，再按键取属性。<\/p>\n<h2>算例一：新增、覆盖与缺键的逐行跟踪<\/h2>\n<p>给定初始字典：<\/p>\n<pre class=\"lang-python\"><code>alien = {&#x27;color&#x27;: &#x27;green&#x27;, &#x27;points&#x27;: 5}<\/code><\/pre>\n<p>逐行推演并记录映射状态：<\/p>\n<ol><li>\n初始：<code>color → green<\/code>，<code>points → 5<\/code>。\n<\/li><li>\n<code>alien[&#x27;points&#x27;] = 10<\/code>：<code>points<\/code> 已存在，覆盖为 10；映射变为 <code>color → green<\/code>，<code>points → 10<\/code>。\n<\/li><li>\n<code>alien[&#x27;speed&#x27;] = &#x27;medium&#x27;<\/code>：新增映射，状态变为 <code>color → green<\/code>，<code>points → 10<\/code>，<code>speed → medium<\/code>。\n<\/li><li>\n<code>print(alien[&#x27;points&#x27;])<\/code>：命中键 <code>points<\/code>，返回 <code>10<\/code>。\n<\/li><li>\n<code>print(alien[&#x27;height&#x27;])<\/code>：无此键，抛 <code>KeyError: &#x27;height&#x27;<\/code>；程序若未处理，traceback 指出出错的键名。\n<\/li><li>\n遍历核对：<code>for k in alien.keys():<\/code> 依次取到 <code>color<\/code>、<code>points<\/code>、<code>speed<\/code>；<code>for v in alien.values():<\/code> 取到 <code>green<\/code>、<code>10<\/code>、<code>medium<\/code>；<code>for k, v in alien.items():<\/code> 同时取键值。\n<\/ol>\n<h2>算例二：字典列表与字典中存列表<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>aliens = [\n    {&#x27;color&#x27;: &#x27;green&#x27;, &#x27;points&#x27;: 5},\n    {&#x27;color&#x27;: &#x27;yellow&#x27;, &#x27;points&#x27;: 10}\n]<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n<code>aliens<\/code> 是列表，两个槽位各装一个字典 D1、D2。\n<\/li><li>\n<code>aliens[0]<\/code> 取列表索引 0，得 D1；<code>aliens[0][&#x27;color&#x27;]<\/code> 再按键取 <code>&#x27;green&#x27;<\/code>。\n<\/li><li>\n<code>aliens[1][&#x27;points&#x27;]<\/code> 得 <code>10<\/code>。\n<\/li><li>\n对列表做 for 遍历：每个循环变量绑到当前字典，再用 <code>[&#x27;color&#x27;]<\/code> 取颜色。\n<\/ol>\n<p>再看字典中存列表：<\/p>\n<pre class=\"lang-python\"><code>pizza = {&#x27;toppings&#x27;: [&#x27;mushrooms&#x27;, &#x27;cheese&#x27;, &#x27;pepper&#x27;]}<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n键 <code>&#x27;toppings&#x27;<\/code> 对应一个列表对象；<code>pizza[&#x27;toppings&#x27;]<\/code> 取回该列表。\n<\/li><li>\n<code>pizza[&#x27;toppings&#x27;].append(&#x27;onion&#x27;)<\/code> 在原列表上原地追加；字典值指向的列表被修改，与 c01 可变对象规则一致。\n<\/li><li>\n取值 <code>pizza[&#x27;toppings&#x27;][1]<\/code> 先取列表，再按索引 1 得 <code>&#x27;cheese&#x27;<\/code>。\n<\/ol>\n<h2>算例三：哪些对象能做键<\/h2>\n<p>逐组核对：<\/p>\n<ol><li>\n<code>{&#x27;name&#x27;: &#x27;eric&#x27;}<\/code>：键是字符串，不可变可哈希，合法。\n<\/li><li>\n<code>{2016: &#x27;first edition&#x27;}<\/code>：键是整数，可哈希，合法。\n<\/li><li>\n<code>{(1, 2): &#x27;pair&#x27;}<\/code>：键是元组，元组不可变，合法。\n<\/li><li>\n<code>{[&#x27;a&#x27;, &#x27;b&#x27;]: 1}<\/code>：列表可变不可哈希，抛 <code>TypeError: unhashable type: &#x27;list&#x27;<\/code>。\n<\/li><li>\n<code>{({&#x27;a&#x27;: 1},): 2}<\/code>：元组里装字典，整体仍不可哈希，报错。\n<\/li><li>\n对照：把列表存进值的位置 <code>{&#x27;tags&#x27;: [&#x27;a&#x27;, &#x27;b&#x27;]}<\/code> 合法；可变对象不能进键槽位，可以进值槽位。\n<\/ol>\n<h2>算例四：遍历字典与按键统计<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>favorite_languages = {\n    &#x27;jen&#x27;: &#x27;python&#x27;,\n    &#x27;sarah&#x27;: &#x27;c&#x27;,\n    &#x27;edward&#x27;: &#x27;ruby&#x27;,\n    &#x27;phil&#x27;: &#x27;python&#x27;\n}<\/code><\/pre>\n<p>推演遍历：<\/p>\n<ol><li>\n<code>for name, lang in favorite_languages.items():<\/code> 依次接住每条映射：<code>jen → python<\/code>、<code>sarah → c<\/code>、<code>edward → ruby<\/code>、<code>phil → python<\/code>。\n<\/li><li>\n循环体内判断 <code>lang == &#x27;python&#x27;<\/code>，命中 jen 与 phil 两条；sarah、edward 不命中。\n<\/li><li>\n<code>for name in favorite_languages.keys():<\/code> 只遍历键，循环变量依次为 jen、sarah、edward、phil；需要判断某人是否在受邀名单时，成员判断在键集合上进行。\n<\/li><li>\n<code>for lang in favorite_languages.values():<\/code> 只遍历值，会出现重复的 <code>python<\/code>；要去掉重复值需另行处理。\n<\/li><li>\n核对：键 <code>&#x27;jen&#x27;<\/code> 与键 <code>&#x27;sarah&#x27;<\/code> 互不影响；新增 <code>&#x27;erin&#x27;: &#x27;python&#x27;<\/code> 只加入一条映射，已有键的位置关系不重排。\n<\/ol>\n<p>补充推演：查找成员 <code>&#x27;sarah&#x27; in favorite_languages<\/code> 等价于在键集合上判断；写成 <code>&#x27;sarah&#x27; in favorite_languages.keys()<\/code> 语义相同。判断值是否存在要写在 <code>values()<\/code> 上，不能默认成员判断查的是值。<\/p>\n<h2>算例五：字典中存字典的逐层取值<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>users = {\n    &#x27;erin&#x27;: {&#x27;first&#x27;: &#x27;Erin&#x27;, &#x27;last&#x27;: &#x27;Matthes&#x27;, &#x27;age&#x27;: 38},\n    &#x27;eric&#x27;: {&#x27;first&#x27;: &#x27;Eric&#x27;, &#x27;last&#x27;: &#x27;Matthes&#x27;, &#x27;age&#x27;: 40}\n}<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n外层字典 U1 有两个键 <code>&#x27;erin&#x27;<\/code>、<code>&#x27;eric&#x27;<\/code>，各自映射到一个内层字典。\n<\/li><li>\n<code>users[&#x27;erin&#x27;]<\/code> 取回 erin 对应的内层字典 D1；<code>users[&#x27;erin&#x27;][&#x27;last&#x27;]<\/code> 在 D1 上取键 <code>&#x27;last&#x27;<\/code>，得 <code>&#x27;Matthes&#x27;<\/code>。\n<\/li><li>\n<code>users[&#x27;eric&#x27;][&#x27;age&#x27;]<\/code> 得 <code>40<\/code>。\n<\/li><li>\n新增嵌套属性：<code>users[&#x27;erin&#x27;][&#x27;city&#x27;] = &#x27;portland&#x27;<\/code>，先取到 D1，再在 D1 上新增键 <code>&#x27;city&#x27;<\/code>；外层映射条数不变。\n<\/li><li>\n遍历外层：<code>for username, info in users.items():<\/code> 循环变量 <code>info<\/code> 接住内层字典，再用 <code>info[&#x27;first&#x27;]<\/code>、<code>info[&#x27;last&#x27;]<\/code> 取属性。\n<\/li><li>\n边界核对：<code>users[&#x27;john&#x27;]<\/code> 缺外层键抛 KeyError；即使外层命中，内层缺键同样抛 KeyError，两层缺键路径一致。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：缺键直接索引取值崩溃。<\/strong> 字典里没有 <code>&#x27;height&#x27;<\/code> 就写 <code>alien[&#x27;height&#x27;]<\/code>，抛 KeyError。复盘：属性可能缺失时，先判断键是否存在，或使用取不到时返回默认值的取值方式，避免分支因缺键终止。<\/p>\n<p><strong>案例 2：列表当键触发类型错误。<\/strong> 想用两个城市名组成的列表做查找键，写 <code>{[&#x27;杭州&#x27;, &#x27;上海&#x27;]: 300}<\/code>，解释器要求键可哈希，列表不满足，抛 TypeError。需要组合键时用元组。<\/p>\n<p><strong>案例 3：同名键覆盖而未察觉。<\/strong> 写字典字面量时两次写 <code>&#x27;color&#x27;<\/code>，第二个值覆盖第一个；读取时以为两个颜色都在，实际只剩后者。复盘：建字典后核对键集合，确认预期的键都在。<\/p>\n<p><strong>案例 4：混淆键与值的可重复性。<\/strong> 以为值重复也会被覆盖；实际两个不同键可以取相同值，覆盖只发生在键相同时。<\/p>\n<p><strong>案例 5：嵌套层级取值漏层。<\/strong> 内层是字典却只给外层键，取回的是字典对象本身，再去做字符串拼接或数值运算时报类型错误。取值前先确认当前取回的是字典、列表还是标量。<\/p>\n<p><strong>案例 6：成员判断误查到值上。<\/strong> 写 <code>if &#x27;python&#x27; in favorite_languages<\/code> 想判断有没有人选 python，实际成员判断默认作用于键集合，<code>&#x27;python&#x27;<\/code> 是值，条件恒为 False。判断值是否存在要遍历 <code>values()<\/code>。<\/p>\n<p><strong>案例 7：在遍历字典时删改条目。<\/strong> 遍历过程中增删键会改变字典内部结构，可能导致条目跳过或报错。需要删除满足条件的条目时，先在遍历时收集待删键，遍历结束后再统一删除。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：字典用什么符号书写？答：花括号，内部是键—值对，键与值用冒号分隔。\n<\/li><li>\n问：按键查找没命中会报什么？答：KeyError，指出缺失的键名。\n<\/li><li>\n问：为什么列表不能做键？答：列表可变，内容改变会让哈希值失稳，无法支撑查找定位。\n<\/li><li>\n问：同名键写两次会怎样？答：后写的值覆盖先写的值，字典里只保留一条映射。\n<\/li><li>\n问：值可以是列表或字典吗？答：可以，值的类型不受限，还能嵌套。\n<\/li><li>\n问：items、keys、values 各取什么？答：items 取键值对，keys 取键，values 取值。\n<\/li><li>\n问：字典插入新键会不会让已有键移位？答：不会，键是名称标识，不按位置排队。\n<\/li><li>\n问：元组装着列表时能不能做键？答：不能，元组整体因内含可变对象而不可哈希。\n<\/li><li>\n问：<code>in<\/code> 直接作用在字典上查的是键还是值？答：查键；查值要写在 <code>values()<\/code> 上。\n<\/li><li>\n问：字典遍历需要依赖编号吗？答：不需要，items、keys、values 直接在映射集合上遍历。\n<\/li><li>\n问：哈希碰撞时查找还能命中吗？答：能，碰撞位置内继续比对键本身，相同才取回值。\n<\/ul>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n给定 <code>car = {&#x27;make&#x27;: &#x27;audi&#x27;, &#x27;year&#x27;: 2016}<\/code>，新增键 <code>&#x27;color&#x27;<\/code> 值 <code>&#x27;black&#x27;<\/code>，再把 <code>&#x27;year&#x27;<\/code> 改为 2020，写出改动后的映射。\n<\/li><li>\n访问不存在的键 <code>&#x27;price&#x27;<\/code> 会发生什么？写出两种避免程序崩溃的处理思路。\n<\/li><li>\n为什么字符串和元组可以做键，列表和字典不行？用哈希值稳定性解释。\n<\/li><li>\n写出一个“字典列表”，每个字典表示一名学生（姓、名、成绩），并写出取出第二名学生成绩的取值表达式。\n<\/li><li>\n字典中存一个列表，向该列表追加元素后，字典对应键取回的值会不会变？结合可变对象说明。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "字典：键值对、键唯一与按键查找"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：Python编程__从入门到实践_=_Python_Cras...rse_(Eric_Matthes)_(Z-Library).pdf · p.83<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">变量绑定与可变/不可变对象<\/a><\/span><\/div><h1>条件测试与 if-elif-else 分支链<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch02（原书第 5 章 §5.1–5.5，PDF 第 83–99 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>条件测试是求值结果为 True 或 False 的表达式；if 语句按测试结果选择分支，多档判断用 elif 接续、else 兜底，整条链自上而下求值，命中第一条成立分支后即跳出。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>程序不能总是一条路走到黑：外星人颜色不同就要换不同动作，分数落在不同档位要给不同评级，列表里有没有某个名字决定显示哪条提示。困难在于：怎样把“是否满足某条件”写成机器能判断的表达式？多个条件怎样组合？多档判断的先后顺序为什么会影响结果？写错比较符号、把赋值号写进判断、分支缩进错位，都是新手常踩的坑。本概念把条件测试的求值、分支链的命中顺序与常见错误拆开推演。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>条件测试<\/strong>：一条表达式，解释器求值后得到布尔值 <code>True<\/code> 或 <code>False<\/code>，它是 if 分支选择走哪条路的依据。<\/p>\n<p><strong>比较运算<\/strong>：<code>==<\/code> 判相等，<code>!=<\/code> 判不等，<code>&gt;<\/code>、<code>&lt;<\/code>、<code>&gt;=<\/code>、<code>&lt;=<\/code> 比较大小；字符串按字符次序比较，区分大小写。<\/p>\n<p><strong>逻辑组合<\/strong>：<code>and<\/code> 两侧都为 True 才为 True；<code>or<\/code> 任一为 True 即为 True；<code>not<\/code> 对结果取反。<\/p>\n<p><strong>成员判断<\/strong>：<code>x in 集合<\/code> 判断 x 是否在列表、字典键等集合中；<code>x not in 集合<\/code> 判断是否不在。<\/p>\n<p><strong>if 分支<\/strong>：<code>if 测试:<\/code> 后缩进书写成立时执行的语句；测试为 False 时跳过该块。<\/p>\n<p><strong>elif 链<\/strong>：<code>elif 测试:<\/code> 接续下一档判断；前序分支都不成立时才求值当前 elif。<\/p>\n<p><strong>else 兜底<\/strong>：不接测试条件，收束前面所有分支都未命中的情况；一条链最多一个 else。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>age = 20\nif age &gt;= 18:\n    print(&quot;adult&quot;)\nelse:\n    print(&quot;minor&quot;)<\/code><\/pre>\n<p><strong>反例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>if age = 18:        # SyntaxError: 赋值号不能写在判断位置\n    print(&quot;eighteen&quot;)<\/code><\/pre>\n<p>判断位置必须写比较表达式，<code>=<\/code> 是赋值，<code>==<\/code> 才是相等比较。<\/p>\n<h2>原理推导：测试求值与分支命中顺序<\/h2>\n<p>推演分四步。<\/p>\n<p>第一步，单个测试求值。<code>age &gt;= 18<\/code> 先取变量绑定的整数，再与 18 比较，结果为 True 或 False。字符串比较 <code>&#x27;trek&#x27; == &#x27;Trek&#x27;<\/code> 区分大小写，两个串不相等。<\/p>\n<p>第二步，组合条件求值。<code>and<\/code> 两侧都为 True，整体才为 True；<code>or<\/code> 一侧为 True 整体即为 True。组合表达式按从左到右求值，左侧已能决定整体结果时，右侧不再求值。<\/p>\n<p>第三步，分支链自上而下命中。if-elif-else 链从顶部开始逐条求值测试；第一条结果为 True 的分支被执行，随后跳出整条链，后面的 elif 不再求值；全部不成立才进入 else。<\/p>\n<p>第四步，顺序决定边界归属。档位判断把高档写在前面、低档写在后面；若把低档条件写在前面，高档值会被提前截走。条件之间有重叠时，排在前面的分支优先。<\/p>\n<p>第五步，空集合与边界值处理。条件位置先判断集合是否为空：空列表、空字典进入对应兜底分支，再考虑取元素或按键访问。边界值（恰好等于阈值）按比较符是否带等号归入对应档位，<code>&gt;=<\/code> 与 <code>&gt;<\/code> 的差别就在边界那一点。<\/p>\n<p>第六步，多条件需求的组织方式。多个条件互不排斥、需要各自给出提示时，写成并列 if；多个档位互斥、同一对象只归一档时，写成 if-elif-else。两种结构可以在同一程序中按需求混用。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：需要根据数据取值选择不同执行路径时使用分支；互斥档位用 if-elif-else，互不排斥的独立判断可用多条并列 if。\n<\/li><li>\n边界一：<code>==<\/code> 比较值相等，<code>is<\/code> 判断身份相同；判断两个字符串内容是否相同用 <code>==<\/code>。\n<\/li><li>\n边界二：数值与字符串不能直接用大小运算符比较；先转换类型再比较。\n<\/li><li>\n边界三：else 不接条件，它配对最近的 if/elif 链；没有兜底需求时可以省略 else。\n<\/li><li>\n失败案例：把 <code>&gt;= 60<\/code> 写在 <code>&gt;= 80<\/code> 前面，80 分被归入低档；分支顺序与档位高低不匹配。\n<\/li><li>\n失败案例：列表为空时仍按“有元素”分支取首项，进入后索引越界；分支应先覆盖空集合情形。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>if vs elif<\/strong>：并列 if 各自独立判断，可能多个分支都执行；elif 属于同一条互斥链，命中一条即跳出。\n<\/li><li>\n<strong><code>==<\/code> vs <code>=<\/code><\/strong>：<code>==<\/code> 是相等比较，返回布尔值；<code>=<\/code> 是赋值，改变绑定。判断位置写 <code>=<\/code> 触发语法错误。\n<\/li><li>\n<strong>成员判断 vs 索引取值<\/strong>：<code>in<\/code> 只回答在不在；确认存在后再用索引或键取值，避免缺成员时越界或缺键。\n<\/li><li>\n<strong>布尔值 vs 非空判断<\/strong>：非空字符串、非空列表在条件位置视为真；空串、空列表、0 视为假。需要精确比较时写出比较表达式。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 绑定提供变量取值；c02 列表、c03 字典提供被成员判断的集合。后继：c05 while 循环把条件测试作为重复执行的闸门，每轮重新求值；c09 异常处理是另一层“出错时走哪条路”的分支机制；c10 断言方法核对实际值与预期值是否相等，比较规则与本章一致。分支链的命中顺序思路也用于函数内多档返回值。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（条件测试与 if-elif-else 分支链）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：条件求值、分支链命中顺序与短路组合的逐步推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把“条件为什么成立、分支为什么走这一条、顺序错位会落到哪一档”讲到可推演，先往回追四层前提：<\/p>\n<ol><li>\n<strong>条件先归约为布尔值<\/strong>。任何写在 if、elif、while 位置的表达式，解释器都先求值成 True 或 False，再决定走不走对应块。这一步把复杂表达式与分支动作分开。\n<\/li><li>\n<strong>比较与成员判断有确定规则<\/strong>：相等、不等、大小、成员归属各有比较对象；字符串区分大小写，数值与文本按各自规则比较。\n<\/li><li>\n<strong>组合条件由 and、or、not 连接<\/strong>：组合结果由两侧布尔值决定，存在短路规则。\n<\/li><li>\n<strong>分支按书写顺序求值<\/strong>：if-elif-else 链自上而下，首条命中即跳出；分支之间是否互斥，取决于条件区间与书写顺序。\n<\/ol>\n<p>依赖链方向：表达式求值布尔值 → 比较规则 → 组合短路 → 链式命中顺序。任何一层前提缺失，就会把并列判断写成互斥链，或把比较号与赋值号混淆。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：单个测试归约为布尔值<\/h3>\n<p>设条件位置写 <code>age &gt;= 18<\/code>。解释器先沿绑定取回 <code>age<\/code> 的整数值，再执行大小比较；比较成立得 True，不成立得 False。条件位置也可以直接写变量，变量值为非空对象视为真，空串、空列表、0、None 视为假。<\/p>\n<h3>第二步：相等与大小比较的对象<\/h3>\n<p><code>==<\/code> 与 <code>!=<\/code> 比较两侧值是否相同；<code>&gt;<\/code>、<code>&lt;<\/code>、<code>&gt;=<\/code>、<code>&lt;=<\/code> 按大小次序比较。字符串比较按字符次序逐位进行，且区分大小写：<code>&#x27;trek&#x27; == &#x27;Trek&#x27;<\/code> 为 False，因为首字母大小写不同。数值与字符串混用大小比较时类型不一致，解释器直接报错，不做隐式转换。<\/p>\n<h3>第三步：and、or、not 与短路<\/h3>\n<p><code>and<\/code>：两侧都 True 才 True，左侧为 False 时整体已为 False，右侧不求值；<code>or<\/code>：一侧 True 即 True，左侧为 True 时右侧不求值；<code>not<\/code>：把紧随其后的布尔结果取反。短路意味着右侧表达式若含修改变量的动作，在被跳过时不会执行。<\/p>\n<h3>第四步：成员判断<\/h3>\n<p><code>x in 集合<\/code> 在列表中逐个比对元素、在字典中比对键集合；命中得 True。<code>not in<\/code> 是 <code>in<\/code> 的取反。成员判断只回答存在性，不取元素本身；确认存在后再取值。<\/p>\n<h3>第五步：链式命中<\/h3>\n<p>if-elif-else 从顶部开始：求值 if 测试，True 则执行 if 块并跳出链；False 则求值第一条 elif，依次向下；全部 False 才执行 else。链中某个分支命中后，后续 elif 的测试不再求值。<\/p>\n<h3>第六步：顺序与区间重叠<\/h3>\n<p>各档条件区间若有重叠，排在前面的分支优先命中。高档与低档写反时，落在高档的值先被低档条件截走。互斥档位应按边界从高到低或从低到高排列，使每一档区间互不交叉。<\/p>\n<h2>算例一：外星人颜色动作的分支链手算<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>alien_color = &#x27;yellow&#x27;\n\nif alien_color == &#x27;green&#x27;:\n    points = 5\nelif alien_color == &#x27;yellow&#x27;:\n    points = 10\nelif alien_color == &#x27;red&#x27;:\n    points = 15\nelse:\n    points = 0<\/code><\/pre>\n<p>逐档推演：<\/p>\n<ol><li>\nif 测试 <code>&#x27;yellow&#x27; == &#x27;green&#x27;<\/code>：False，进入第一条 elif。\n<\/li><li>\nelif 测试 <code>&#x27;yellow&#x27; == &#x27;yellow&#x27;<\/code>：True，执行 <code>points = 10<\/code>。\n<\/li><li>\n跳出整条链，后面的 red 分支与 else 不再求值。<code>points<\/code> 为 10。\n<\/li><li>\n换值核对：<code>alien_color = &#x27;green&#x27;<\/code> 时首条命中，<code>points = 5<\/code>；<code>&#x27;red&#x27;<\/code> 时前两条 False，第三条命中，<code>points = 15<\/code>；<code>&#x27;blue&#x27;<\/code> 三条全 False，进入 else，<code>points = 0<\/code>。\n<\/ol>\n<h2>算例二：and、or、in 组合求值<\/h2>\n<p>给定 <code>age = 25<\/code>，<code>names = [&#x27;jen&#x27;, &#x27;sarah&#x27;, &#x27;eric&#x27;]<\/code>：<\/p>\n<ol><li>\n<code>age &gt;= 18 and age &lt;= 65<\/code>：<code>25 &gt;= 18<\/code> 为 True，<code>25 &lt;= 65<\/code> 为 True，and 两侧都 True，整体 True。\n<\/li><li>\n<code>age &lt; 18 or age &gt; 65<\/code>：左侧 False，右侧 False，or 两侧都 False，整体 False。\n<\/li><li>\n<code>&#x27;sarah&#x27; in names<\/code>：列表中存在该元素，True。\n<\/li><li>\n<code>&#x27;mike&#x27; not in names<\/code>：不存在，True。\n<\/li><li>\n组合 <code>age &gt;= 18 and &#x27;mike&#x27; not in names<\/code>：左侧 True，右侧 True，整体 True。\n<\/li><li>\n短路核对：<code>age &lt; 18 and names[5] == &#x27;x&#x27;<\/code>：左侧 False，and 短路，右侧不求值；即使索引 5 越界也不会在这一步触发错误。反过来 <code>age &gt;= 18 or names[5] == &#x27;x&#x27;<\/code>：左侧 True，or 短路，右侧同样不求值。\n<\/ol>\n<h2>算例三：并列 if 与 elif 链的执行条数对照<\/h2>\n<p>两段代码对照同一组条件：<\/p>\n<pre class=\"lang-python\"><code>score = 95\n\nif score &gt;= 60:\n    print(&quot;pass&quot;)\nif score &gt;= 90:\n    print(&quot;honor&quot;)<\/code><\/pre>\n<p>推演：第一条 if 独立判断，<code>95 &gt;= 60<\/code> True，打印 <code>pass<\/code>；第二条 if 再独立判断，<code>95 &gt;= 90<\/code> True，打印 <code>honor<\/code>。两个分支都执行。<\/p>\n<p>改写为链：<\/p>\n<pre class=\"lang-python\"><code>if score &gt;= 60:\n    print(&quot;pass&quot;)\nelif score &gt;= 90:\n    print(&quot;honor&quot;)<\/code><\/pre>\n<p>推演：首条 <code>95 &gt;= 60<\/code> True，打印 <code>pass<\/code> 后跳出链，elif 不再求值，<code>honor<\/code> 不打印。需要两个标签同时给出用并列 if；需要互斥档位用 elif 链。<\/p>\n<h2>算例四：大小写与类型对照<\/h2>\n<ol><li>\n<code>&#x27;Trek&#x27; == &#x27;trek&#x27;<\/code>：首字母大小写不同，False。先做大小写归一处理再比较，才能忽略大小写差异。\n<\/li><li>\n<code>age_text = &#x27;20&#x27;<\/code>，<code>age_text &gt;= 18<\/code>：字符串与整数不能直接比较大小，解释器报 TypeError。先 <code>int(age_text)<\/code> 转成整数再比较。\n<\/li><li>\n<code>&#x27;&#x27;<\/code> 在条件位置为假，<code>[]<\/code> 为假，<code>0<\/code> 为假；<code>&#x27;0&#x27;<\/code> 是非空字符串，为真。条件位置的真假与数值零不是一回事。\n<\/li><li>\n字典成员判断 <code>&#x27;color&#x27; in alien<\/code> 查键；<code>&#x27;green&#x27; in alien<\/code> 不查值，除非显式写在 <code>values()<\/code> 上。\n<\/ol>\n<h2>算例五：分支顺序错位的落点复盘<\/h2>\n<p>错误写法：<\/p>\n<pre class=\"lang-python\"><code>if score &gt;= 60:\n    grade = &#x27;C&#x27;\nelif score &gt;= 80:\n    grade = &#x27;B&#x27;\nelif score &gt;= 90:\n    grade = &#x27;A&#x27;<\/code><\/pre>\n<p>推演 <code>score = 85<\/code>：首条 <code>85 &gt;= 60<\/code> True，直接归为 <code>&#x27;C&#x27;<\/code>，后面两条 elif 不求值。85 分本应是 B，被低档条件提前截走。修正：高档条件写在前面。<\/p>\n<pre class=\"lang-python\"><code>if score &gt;= 90:\n    grade = &#x27;A&#x27;\nelif score &gt;= 80:\n    grade = &#x27;B&#x27;\nelif score &gt;= 60:\n    grade = &#x27;C&#x27;\nelse:\n    grade = &#x27;F&#x27;<\/code><\/pre>\n<p><code>85<\/code> 时首条 False，第二条 True，得 <code>&#x27;B&#x27;<\/code>；<code>59<\/code> 前三档全 False，进入 else 得 <code>&#x27;F&#x27;<\/code>。<\/p>\n<h2>算例六：条件位置的真假判定<\/h2>\n<p>判断下列对象直接写在 if 条件位置时的真假：<\/p>\n<ol><li>\n<code>&#x27;&#x27;<\/code>：空字符串，假；<code>&#x27;0&#x27;<\/code>：非空字符串，真。\n<\/li><li>\n<code>[]<\/code>：空列表，假；<code>[0]<\/code>：非空列表，真。\n<\/li><li>\n<code>0<\/code>：数值零，假；<code>1<\/code>：非零数值，真。\n<\/li><li>\n<code>None<\/code>：假。\n<\/li><li>\n对照：需要判断“列表里有没有元素”，直接 <code>if names:<\/code> 即可；需要判断“第一个元素是不是某个值”，必须先确认非空再取索引，否则空列表时越界。\n<\/li><li>\n布尔变量 <code>flag = True<\/code> 直接写 <code>if flag:<\/code>；取反判断写 <code>if not flag:<\/code>，等价于 <code>if flag == False<\/code>。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：判断位置写赋值号。<\/strong> <code>if age = 18:<\/code> 在判断位置出现 <code>=<\/code>，解释器按语法解析失败，报 SyntaxError。判断相等写 <code>==<\/code>。<\/p>\n<p><strong>案例 2：类型不匹配直接比较。<\/strong> 输入取回的文本未转换就与整数比较，报 TypeError。复盘：参与大小比较前先确认两侧类型一致。<\/p>\n<p><strong>案例 3：空集合取首项。<\/strong> 分支只写了“列表非空时处理”的正面路径，遗漏空列表分支；程序在空列表时走到取索引 0 的语句，抛 IndexError。空集合应作为单独分支处理。<\/p>\n<p><strong>案例 4：把并列需求写成互斥链。<\/strong> 同一对象同时满足两个标签条件，用 elif 链只发出第一个标签。需要多重标签时改用并列 if。<\/p>\n<p><strong>案例 5：成员判断查错位置。<\/strong> 想查某个值在不在字典里，直接 <code>in 字典<\/code>，实际查的是键；条件恒 False。查值要遍历 <code>values()<\/code>。<\/p>\n<p><strong>案例 6：缩进错位导致块外执行。<\/strong> 该属于分支块的语句没有缩进，被解释器放到链之外，无论条件是否成立都执行；多余缩进则报 IndentationError。<\/p>\n<p><strong>案例 7：多重比较写成链式范围却误判方向。<\/strong> 判断 <code>20 &lt;= temp &lt;= 30<\/code> 是两端同时成立；若拆成两个条件用 or 连接，边界外的值也会命中。范围闭合条件用 and 或链式比较，开区间的排除条件单独写。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：条件测试最终归约成什么？答：True 或 False 两个布尔值之一。\n<\/li><li>\n问：and 与 or 的成立条件各是什么？答：and 两侧都真才真；or 一侧真即真。\n<\/li><li>\n问：命中一条 elif 后后面的分支还求值吗？答：不求值，整条链跳出。\n<\/li><li>\n问：<code>==<\/code> 和 <code>=<\/code> 分别做什么？答：<code>==<\/code> 比较相等返回布尔值；<code>=<\/code> 赋值改绑定。\n<\/li><li>\n问：并列 if 与 elif 链的差别？答：并列 if 各自判断可多条执行；elif 互斥，命中一条即跳出。\n<\/li><li>\n问：字符串比较区分大小写吗？答：区分，忽略大小写需先做归一处理。\n<\/li><li>\n问：成员判断 <code>in 字典<\/code> 查的是键还是值？答：查键；查值写在 <code>values()<\/code> 上。\n<\/ul>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n给定 <code>temp = 31<\/code>，写 if-elif-else 链：<code>&gt; 30<\/code> 输出 hot，<code>20–30<\/code> 输出 warm，其余 cool；说明 30 落在哪一档。\n<\/li><li>\n写出 <code>age &gt;= 18 and age &lt; 65<\/code> 在 <code>age = 17<\/code>、<code>age = 40<\/code>、<code>age = 70<\/code> 三种取值下的结果，并指出短路是否发生。\n<\/li><li>\n两段代码：一段用并列 if 同时判断“及格”和“优秀”，一段用 elif 链，<code>score = 92<\/code> 时各自打印什么？\n<\/li><li>\n为什么把低档条件写在高档前面会让高分被截走？用命中顺序解释。\n<\/li><li>\n输入文本 <code>&quot;18&quot;<\/code> 直接与整数 18 比较会发生什么？正确的处理顺序是什么？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "条件测试与 if-elif-else 分支链"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：Python编程__从入门到实践_=_Python_Cras...rse_(Eric_Matthes)_(Z-Library).pdf · p.119<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">条件测试与 if-elif-else 分支链<\/a><\/span><\/div><h1>while 循环、用户输入与循环控制<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch02（原书第 7 章 §7.1–7.4，PDF 第 119–132 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>while 循环在条件为 True 时反复执行循环体，每轮结束后重新求值条件；<code>input()<\/code> 把用户敲入的文本送进变量，标志、break、continue 分别控制继续运行、立即退出与跳过本轮。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>有些动作不知道要重复多少次：让用户反复输入内容直到主动退出，一批条目逐个搬运到另一个列表，不断询问直到输入合法值。for 循环适合遍历已知长度的集合，while 适合“条件成立就继续”的条件驱动重复。困难在于：循环每轮从哪里开始判断？输入进来的为什么是文本？标志什么时候翻转为 False？break 和 continue 各把控制流带到哪里？条件恒真又没有退出出口，就会形成无限循环。本概念把循环推进路径、输入类型转换与三种控制手段拆开推演。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>while 循环<\/strong>：<code>while 条件:<\/code> 后缩进书写循环体；每轮先求值条件，True 则执行循环体，False 则退出循环。<\/p>\n<p><strong>input()<\/strong>：<code>message = input(&quot;提示: &quot;)<\/code> 让程序暂停等待用户输入，取回的内容始终是字符串；提示文本末尾留空格可区分提示与输入起点。<\/p>\n<p><strong>类型转换<\/strong>：参与数值比较前，用 <code>int()<\/code> 把数字文本转成整数；<code>int()<\/code> 无法转换非数字文本时抛 ValueError。<\/p>\n<p><strong>标志<\/strong>：一个取值 True/False 的变量，记录程序是否处于应继续运行的状态；循环每轮先检查标志，为 False 时退出。<\/p>\n<p><strong>break<\/strong>：立即跳出所在循环，不再执行循环体剩余语句，也不再回到条件判断。<\/p>\n<p><strong>continue<\/strong>：跳过本轮剩余语句，直接回到循环条件判断处，进入下一轮。<\/p>\n<p><strong>求模运算符<\/strong>：<code>%<\/code> 返回除法余数；<code>n % 2<\/code> 为 0 是偶数，为 1 是奇数。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>active = True\nwhile active:\n    message = input(&quot;输入 q 退出：&quot;)\n    if message == &#x27;q&#x27;:\n        active = False\n    else:\n        print(message)<\/code><\/pre>\n<p><strong>反例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>count = 1\nwhile count &lt;= 5:\n    print(count)          # 漏写 count += 1，条件恒真，无限循环<\/code><\/pre>\n<h2>原理推导：一轮循环的推进路径<\/h2>\n<p>推演分五步。<\/p>\n<p>第一步，条件求值。进入 while 前先求条件；条件为 False 时循环体一次都不执行。条件为 True 时执行循环体，一轮结束后回到条件位置重新求值。<\/p>\n<p>第二步，输入取回文本。<code>input()<\/code> 阻塞等待，用户回车后把整行文本（不含换行）存入变量；即使敲入数字，取回的仍是字符串。需要运算时显式 <code>int()<\/code> 转换。<\/p>\n<p>第三步，标志控制继续与否。标志初始为 True；循环体内某条件成立时把标志改为 False。下一轮回到条件位置，标志为 False，循环退出。<\/p>\n<p>第四步，break 与 continue 的跳转方向。break 把控制流直接移出循环；continue 把控制流送回条件判断处，本轮余下语句不再执行。若 continue 之前没有改变循环变量或标志，条件可能仍为 True，造成原地打转。<\/p>\n<p>第五步，循环中处理集合。用 while 把未验证用户从列表移到已验证列表：弹出原列表元素、处理、追加到新列表；原列表不断变短，条件随之走向结束。边遍历边按值删除要处理重复元素，避免漏删。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：重复次数由运行时条件决定、需要接收用户输入、需要在循环中逐步清空或搬运集合时使用 while；已知集合的逐项遍历优先用 for。\n<\/li><li>\n边界一：循环条件每轮必须有机会变 False；循环体内要有修改条件相关变量、翻转标志或执行 break 的路径。\n<\/li><li>\n边界二：<code>input()<\/code> 取回字符串，数值比较前必须转换；非数字文本转换失败会抛 ValueError。\n<\/li><li>\n边界三：break 只跳出所在那一层循环；嵌套循环中外层循环不受内层 break 直接控制。\n<\/li><li>\n失败案例：循环变量在循环体内不更新，条件恒真，程序一直占用运行，只能外部强制终止。\n<\/li><li>\n失败案例：想用 continue 退出循环，实际只跳过本轮，下一轮仍继续提示输入。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>while vs for<\/strong>：for 遍历已知集合，自行取下一个元素；while 按条件反复运行，循环变量与退出条件由代码维护。\n<\/li><li>\n<strong>break vs continue<\/strong>：break 终止整个循环；continue 只结束本轮，进入下一轮判断。\n<\/li><li>\n<strong>标志退出 vs break 退出<\/strong>：标志通过把条件改为 False 让循环在下一轮自然退出；break 立即跳出。多个退出出口或循环体较长时，标志把退出条件集中到一处。\n<\/li><li>\n<strong>输入文本 vs 数值<\/strong>：input 返回字符串；<code>int()<\/code> 转换后才参与大小比较与算术运算。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c04 条件测试是 while 条件与 if 退出判断的依据；c02 列表提供循环搬运与删除的目标集合。后继：c06 把循环与输入处理封装成函数，退出条件作为函数内部分支；c09 在循环中收集用户输入并写入文件、用 json 保存；c10 的测试方法不涉及交互循环，但会调用内部含 while 的函数并核对其结果。无限循环与漏删问题在游戏主循环、输入校验等项目中反复出现。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（while 循环、用户输入与循环控制）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：循环推进、输入转换与 break/continue 跳转路径<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把“循环为什么一轮轮往下走、输入为什么要转换、控制语句把流带到哪里”讲到可推演，先往回追四层前提：<\/p>\n<ol><li>\n<strong>重复由条件闸门控制<\/strong>。while 每轮先求值条件，True 进循环体，False 退出；重复次数由条件何时变 False 决定，而不是写死的次数。\n<\/li><li>\n<strong>输入进入程序时是文本<\/strong>。input 取回整行字符串，数字外观不代表类型；参与运算前必须显式转换。\n<\/li><li>\n<strong>循环状态在循环体内被修改<\/strong>：计数变量递增、标志翻转、集合变短，都是让条件走向 False 的动作；缺少这类动作，条件恒真。\n<\/li><li>\n<strong>控制语句改变正常推进顺序<\/strong>：break 移出循环，continue 回到条件；二者跳转目标不同，不能互换。\n<\/ol>\n<p>依赖链方向：条件闸门 → 文本输入与转换 → 循环状态更新 → 控制语句跳转。任何一层前提缺失，就会写出条件恒真的死循环，或把 continue 当成退出手段。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：一轮循环的标准路径<\/h3>\n<p>进入 <code>while 条件:<\/code>：求值条件。False 则跳过循环体，继续执行循环之后的语句；True 则顺序执行循环体各语句，一轮结束后回到条件位置再次求值。循环体一次都不执行的情形：进入前条件已为 False。<\/p>\n<h3>第二步：input 的阻塞与返回类型<\/h3>\n<p>执行 <code>input(提示)<\/code>：程序暂停，等待用户键入并回车；整行文本（去掉末尾换行）作为字符串返回，存入左侧变量。用户敲入 <code>20<\/code>，变量值是字符串 <code>&#x27;20&#x27;<\/code>，不是整数 20。<\/p>\n<h3>第三步：数值转换路径<\/h3>\n<p>需要比较或算术时，先 <code>age = int(age)<\/code>：<code>int()<\/code> 把数字文本解析为整数；文本含非数字字符时抛 ValueError。转换失败属于运行时错误，需要在异常处理分支中兜底（见 c09）。<\/p>\n<h3>第四步：标志翻转<\/h3>\n<p>标志变量初始 True；循环体内判断退出输入，命中时把标志赋 False。本轮余下语句照常执行，回到条件位置时标志为 False，循环退出。标志把“是否继续”集中成一个布尔条件，循环体可以有多个出口判断。<\/p>\n<h3>第五步：break 跳转<\/h3>\n<p>执行 break 时，控制流立即移出所在循环，循环体后续语句与条件重新求值都不再进行。嵌套循环中 break 只跳出当前内层循环，外层循环继续。<\/p>\n<h3>第六步：continue 跳转<\/h3>\n<p>执行 continue 时，本轮剩余语句跳过，控制流回到循环条件位置；条件为 True 则进入下一轮。continue 之前必须有改变状态的动作，否则下一轮条件仍成立，重复同一判断。<\/p>\n<h3>第七步：集合搬运的终止条件<\/h3>\n<p>while 处理列表时，通常以原列表是否为空作为条件：每轮弹出一个元素，处理后追加到目标列表；原列表长度逐轮减小，为空时条件 False。搬运过程中两个列表的此消彼长就是循环状态。<\/p>\n<h2>算例一：标志输入循环逐轮跟踪<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>active = True\nwhile active:\n    message = input(&quot;请输入内容，输入 q 退出：&quot;)\n    if message == &#x27;q&#x27;:\n        active = False\n    else:\n        print(&quot;你输入的是：&quot; + message)<\/code><\/pre>\n<p>逐轮推演：<\/p>\n<ol><li>\n进入循环前 <code>active = True<\/code>。首轮条件 True，进入循环体。\n<\/li><li>\n<code>input()<\/code> 阻塞；用户敲入 <code>hello<\/code> 回车，<code>message<\/code> 绑到字符串 <code>&#x27;hello&#x27;<\/code>。\n<\/li><li>\n<code>if message == &#x27;q&#x27;<\/code>：<code>&#x27;hello&#x27; == &#x27;q&#x27;<\/code> False，走 else，打印 <code>你输入的是：hello<\/code>。\n<\/li><li>\n回到条件位置，<code>active<\/code> 仍 True，进入第二轮。\n<\/li><li>\n用户敲入 <code>q<\/code>，<code>message = &#x27;q&#x27;<\/code>；if 测试 True，<code>active = False<\/code>；else 不执行。\n<\/li><li>\n回到条件位置，<code>active<\/code> False，循环退出，继续执行循环之后的语句。\n<\/ol>\n<h2>算例二：计数循环与漏更新对照<\/h2>\n<p>正确写法：<\/p>\n<pre class=\"lang-python\"><code>count = 1\nwhile count &lt;= 5:\n    print(count)\n    count += 1<\/code><\/pre>\n<p>推演：<code>count<\/code> 初值 1；条件 <code>1 &lt;= 5<\/code> True，打印 1，<code>count<\/code> 变 2；第二轮打印 2，变 3；依次到 <code>count = 5<\/code> 打印 5，变 6；条件 <code>6 &lt;= 5<\/code> False，退出。输出 1、2、3、4、5。<\/p>\n<p>错误写法：循环体漏 <code>count += 1<\/code>。推演：首轮条件 True，打印 1；回到条件，<code>count<\/code> 仍是 1，条件仍 True；下一轮再打印 1，如此往复。条件恒真且无 break，形成无限循环。<\/p>\n<h2>算例三：continue 跳过与 break 终止对照<\/h2>\n<p>给定 <code>numbers = [1, 2, 3, 4, 5]<\/code>，用 while 配合索引遍历：<\/p>\n<pre class=\"lang-python\"><code>i = 0\nwhile i &lt; len(numbers):\n    n = numbers[i]\n    i += 1\n    if n % 2 == 0:\n        continue\n    print(n)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n<code>i = 0<\/code>，条件 <code>0 &lt; 5<\/code> True；<code>n = 1<\/code>，<code>i<\/code> 变 1；<code>1 % 2 == 0<\/code> False，打印 1。\n<\/li><li>\n第二轮 <code>n = 2<\/code>，<code>i<\/code> 变 2；<code>2 % 2 == 0<\/code> True，continue 跳过打印，回到条件。\n<\/li><li>\n第三轮 <code>n = 3<\/code>，<code>i<\/code> 变 3，打印 3；第四轮 <code>n = 4<\/code>，continue；第五轮 <code>n = 5<\/code>，<code>i<\/code> 变 5，打印 5。\n<\/li><li>\n回到条件 <code>5 &lt; 5<\/code> False，退出。输出 1、3、5。\n<\/ol>\n<p>break 对照：在循环中找第一个偶数，命中即停：<\/p>\n<pre class=\"lang-python\"><code>i = 0\nwhile i &lt; len(numbers):\n    if numbers[i] % 2 == 0:\n        break\n    i += 1\nprint(numbers[i])<\/code><\/pre>\n<p>推演：<code>i=0<\/code> 时 1 非偶，<code>i<\/code> 变 1；<code>i=1<\/code> 时 2 为偶，break 跳出循环；<code>numbers[1]<\/code> 为 2。break 后不再取下一个元素。<\/p>\n<h2>算例四：列表之间搬运元素<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>unconfirmed = [&#x27;alice&#x27;, &#x27;david&#x27;, &#x27;carolina&#x27;]\nconfirmed = []\n\nwhile unconfirmed:\n    current = unconfirmed.pop()\n    confirmed.append(current)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n初始 <code>unconfirmed<\/code> 长度 3，<code>confirmed<\/code> 为空。\n<\/li><li>\n首轮 <code>pop()<\/code> 取末尾 <code>&#x27;carolina&#x27;<\/code>，<code>unconfirmed<\/code> 剩 <code>[&#x27;alice&#x27;, &#x27;david&#x27;]<\/code>，追加到 <code>confirmed<\/code>。\n<\/li><li>\n第二轮取 <code>&#x27;david&#x27;<\/code>，第三轮取 <code>&#x27;alice&#x27;<\/code>；<code>unconfirmed<\/code> 变空。\n<\/li><li>\n回到条件，空列表为假，循环退出；<code>confirmed<\/code> 为 <code>[&#x27;carolina&#x27;, &#x27;david&#x27;, &#x27;alice&#x27;]<\/code>。\n<\/li><li>\n核对：pop 从末尾取，搬运结果次序与原列表相反；需要保持次序可改从头部取或事后调整。\n<\/ol>\n<h2>算例五：输入转换与奇偶判断<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>age_text = input(&quot;请输入年龄：&quot;)\nage = int(age_text)\nif age &gt;= 18:\n    print(&quot;adult&quot;)\nelse:\n    print(&quot;minor&quot;)<\/code><\/pre>\n<p>推演：用户敲入 <code>20<\/code>，<code>age_text<\/code> 为字符串 <code>&#x27;20&#x27;<\/code>；<code>int(&#x27;20&#x27;)<\/code> 得整数 20；<code>20 &gt;= 18<\/code> True，打印 adult。若敲入 <code>twenty<\/code>，<code>int()<\/code> 解析失败抛 ValueError，程序在转换处终止。<\/p>\n<p>奇偶对照：<code>n % 2<\/code> 余数为 0 是偶数，余数为 1 是奇数；求模结果用于分支判断，不改变 n 本身。<\/p>\n<h2>算例六：用 while 循环填充字典<\/h2>\n<p>参照第 7.3.3 节收集受访者与原因的写法：<\/p>\n<pre class=\"lang-python\"><code>responses = {}\npolling_active = True\n\nwhile polling_active:\n    name = input(&quot;姓名：&quot;)\n    reason = input(&quot;为什么喜欢编程？&quot;)\n    responses[name] = reason\n    repeat = input(&quot;还有其他人吗？(yes/no) &quot;)\n    if repeat == &#x27;no&#x27;:\n        polling_active = False<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n初始 <code>responses<\/code> 为空字典，<code>polling_active = True<\/code>。\n<\/li><li>\n首轮条件 True：输入姓名与原因，<code>responses[name] = reason<\/code> 新增一条映射；询问是否继续。\n<\/li><li>\n回答 <code>yes<\/code>：标志仍 True，下一轮再收集一组；回答 <code>no<\/code>：标志改 False，本轮结束后回到条件，循环退出。\n<\/li><li>\n退出后 <code>responses<\/code> 装下所有受访者键值对；字典在循环中原原地增长，与 c03 新增映射规则一致。\n<\/li><li>\n边界核对：若同名受访者输入两次，后一次原因覆盖前一次；需要保留多条原因，值应改为列表。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：循环变量不更新导致无限循环。<\/strong> 条件依赖的变量在循环体内没有被修改，每轮条件结果相同，循环永远不退出。复盘：写 while 前先确认哪条语句让条件走向 False。<\/p>\n<p><strong>案例 2：continue 被当成退出手段。<\/strong> 想让用户输入 <code>q<\/code> 时退出，却写 continue；continue 只跳过本轮，回到条件后仍为 True，下一轮再次提示。退出应改标志或用 break。<\/p>\n<p><strong>案例 3：输入未转换直接比较。<\/strong> 字符串与整数比较大小报 TypeError；复盘：输入取回后先确认类型，需要数值时先转换。<\/p>\n<p><strong>案例 4：嵌套循环 break 只跳内层。<\/strong> 内层 break 跳出内层后外层继续下一轮；想结束整个外层循环，需要标志配合或在外层条件中判断。<\/p>\n<p><strong>案例 5：循环中按值删除漏项。<\/strong> 列表元素前移后循环索引继续向后，重复值被跳过；应倒序遍历或先收集待删元素再统一删除。<\/p>\n<p><strong>案例 6：循环体遗漏冒号或缩进。<\/strong> while 行尾缺冒号报 SyntaxError；循环体该缩进的语句未缩进，被放到循环之外，重复逻辑只执行一次。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：while 每轮从哪里开始判断？答：从条件位置开始，True 进循环体，False 退出。\n<\/li><li>\n问：input 取回的是什么类型？答：字符串，数字外观也要再转换。\n<\/li><li>\n问：标志怎样让循环退出？答：循环体内把标志改 False，下一轮条件求值为 False。\n<\/li><li>\n问：break 和 continue 各跳到哪里？答：break 移出整个循环；continue 回到条件判断处进入下一轮。\n<\/li><li>\n问：无限循环是怎么形成的？答：条件恒真，循环体内又没有改状态、翻标志或 break 的路径。\n<\/li><li>\n问：while 搬运列表靠什么条件终止？答：原列表被清空，空列表在条件位置为假。\n<\/li><li>\n问：break 在嵌套循环中跳出几层？答：只跳出所在内层循环。\n<\/ul>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出一个 while 循环：反复提示输入配料名，输入 <code>quit<\/code> 时退出，每次输入追加到列表；指出循环体内哪条语句让条件走向 False。\n<\/li><li>\n<code>continue<\/code> 写在递增循环变量之前，下一轮可能出现什么问题？结合状态更新顺序说明。\n<\/li><li>\n用户输入 <code>&#x27;18&#x27;<\/code> 后直接写 <code>age &gt;= 18<\/code> 会发生什么？正确的两步顺序是什么？\n<\/li><li>\n把未验证用户列表搬运到已验证列表，pop 从末尾取会让次序发生什么变化？要保持原次序应怎么取？\n<\/li><li>\n嵌套两层循环，内层 break 后外层是否继续？若要两层都退出，可用什么机制？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "while 循环、用户输入与循环控制"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：Python编程__从入门到实践_=_Python_Cras...rse_(Eric_Matthes)_(Z-Library).pdf · p.133<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">while 循环、用户输入与循环控制<\/a><\/span><\/div><h1>函数定义、参数传递与返回值<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch03（原书第 8 章 §8.1–8.6，PDF 第 133–156 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>函数是带名字的代码块：<code>def<\/code> 语句定义函数名与形参列表，调用时把实参绑到形参并执行函数体，<code>return<\/code> 把结果交回调用处；不写 return 的函数执行完返回 <code>None<\/code>。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>同一段动作在程序里反复出现：多次打印问候语、多次格式化姓名、多次计算统计值。把重复代码复制粘贴多处，改一处就要同步改所有副本，容易漏改。函数把动作打包成一个命名代码块，需要时调用即可；困难在于：定义时函数体为什么不运行？实参和形参怎样对应？位置参数与关键字参数有什么差别？带默认值的参数什么时候用默认值？返回值和打印出来的内容有什么不同？本概念把函数创建、调用帧、参数绑定与返回路径拆开推演。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>def 语句<\/strong>：<code>def greet_user(username):<\/code> 定义函数，括号内是形参列表，行尾冒号，函数体缩进。<\/p>\n<p><strong>文档字符串<\/strong>：函数体首行的说明字符串，记录函数用途，不参与执行。<\/p>\n<p><strong>形参与实参<\/strong>：形参是函数定义时占位的名字；实参是调用时实际传入的值。调用把实参绑到对应形参。<\/p>\n<p><strong>位置参数<\/strong>：按书写顺序与形参一一对应；调用顺序与形参顺序一致。<\/p>\n<p><strong>关键字参数<\/strong>：以 <code>形参名=值<\/code> 形式传入，与书写顺序无关。<\/p>\n<p><strong>默认值<\/strong>：形参可设默认值；调用未传该实参时使用默认值。<\/p>\n<p><strong>return<\/strong>：把表达式结果送回调用处，函数随即结束；没有 return 的函数执行完返回 <code>None<\/code>。<\/p>\n<p><strong>模块<\/strong>：函数可存进独立 <code>.py<\/code> 文件，用 <code>import<\/code> 引入后按模块名调用。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>def greet_user(username):\n    &quot;&quot;&quot;显示简单的问候语&quot;&quot;&quot;\n    print(&quot;Hello, &quot; + username.title() + &quot;!&quot;)\n\ngreet_user(&#x27;jesse&#x27;)      # Hello, Jesse!<\/code><\/pre>\n<p><strong>反例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>def describe_pet(pet_name, animal_type=&#x27;dog&#x27;):\n    print(animal_type + &quot;: &quot; + pet_name)\n\ndescribe_pet(animal_type=&#x27;hamster&#x27;, pet_name=&#x27;harry&#x27;)<\/code><\/pre>\n<p>关键字参数按形参名绑定，顺序与形参顺序不同也能正确对应。<\/p>\n<h2>原理推导：创建、调用与返回的执行路径<\/h2>\n<p>推演分五步。<\/p>\n<p>第一步，定义时只创建函数对象。执行 <code>def<\/code> 语句，解释器创建函数对象，把函数名绑到它身上；函数体此刻不运行，形参也还没有绑定对象。<\/p>\n<p>第二步，调用时建立函数帧。调用 <code>greet_user(&#x27;jesse&#x27;)<\/code>，解释器新建一个函数调用帧，把实参 <code>&#x27;jesse&#x27;<\/code> 绑到形参 <code>username<\/code>，再顺序执行函数体。<\/p>\n<p>第三步，参数对应规则。位置参数按顺序绑定；关键字参数按形参名绑定；位置参数必须写在关键字参数前面。有默认值的形参，调用省略对应实参时取默认值。<\/p>\n<p>第四步，返回路径。函数体执行到 <code>return 表达式<\/code>，先求表达式的值，把该值交回调用处，函数结束；调用处用变量接收这个返回值。没有 return 时，函数体走完后返回 <code>None<\/code>。<\/p>\n<p>第五步，传参与别名。可变对象传入函数，形参与外部名字指向同一对象；函数内原地修改会影响共享对象。函数内对形参重新赋值，只改函数帧内的绑定，外部名字不动（与 c01 一致）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：一段动作要在多处复用、输入不同而处理步骤相同时，封装成函数；返回结果供后续运算时用 return，只展示信息时用 print。\n<\/li><li>\n边界一：实参数量与形参不匹配，调用时报 TypeError；缺少必传形参或多出实参都会报错。\n<\/li><li>\n边界二：默认值应使用不可变对象；可变默认对象在定义阶段创建一次，多次调用共享，残留上一次的数据。\n<\/li><li>\n边界三：函数内普通局部变量只在函数帧内存在，调用结束后消失；通过返回值才能把结果带出函数。\n<\/li><li>\n失败案例：把 print 当 return，调用处拿到 <code>None<\/code>，再对它做拼接或索引时报 TypeError。\n<\/li><li>\n失败案例：关键字参数写在位置参数前面，解释器无法判断实参对应哪个形参，报语法错误。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>定义 vs 调用<\/strong>：def 只登记函数；函数体在调用那一刻才执行。\n<\/li><li>\n<strong>形参 vs 实参<\/strong>：形参是定义时的占位名字；实参是调用时传入的具体对象。\n<\/li><li>\n<strong>return vs print<\/strong>：print 只把内容显示到屏幕，不交回调用处；return 把结果对象交回，供继续运算。\n<\/li><li>\n<strong>局部变量 vs 外部变量<\/strong>：函数内赋值的名字属于函数帧；读取外部对象可以，但在函数内重新绑定不会改到外部名字。\n<\/li><li>\n<strong>位置参数 vs 关键字参数<\/strong>：位置靠顺序对应，关键字靠名字对应；关键字参数让调用意图更清楚，顺序变化不影响对应。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 绑定与别名规则决定传参时哪些改动穿透函数帧；c05 的输入循环可被收进函数内部。后继：c07 类的方法本质是第一个形参为 <code>self<\/code> 的函数；c08 子类重写方法沿用参数与返回规则；c09 把文件读写、异常处理组织成函数；c10 测试方法调用被测函数并用断言核对其返回值。函数封装是从脚本走向模块化程序的第一步。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（函数定义、参数传递与返回值）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：函数帧建立、参数绑定与返回值交回的逐步推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把“定义时为什么不运行、实参怎样对上形参、结果怎样交回调用处”讲到可推演，先往回追四层前提：<\/p>\n<ol><li>\n<strong>函数是可被调用的对象<\/strong>。def 语句创建函数对象并绑定名字，函数体作为对象的一部分保存起来，等待调用。\n<\/li><li>\n<strong>每次调用新建独立帧<\/strong>。调用发生时建立函数帧，形参在帧内绑定实参；帧内局部名字与外部名字互不干扰。\n<\/li><li>\n<strong>参数对应有确定规则<\/strong>：位置按顺序，关键字按名字，默认值在缺省时启用；规则决定实参落到哪个形参。\n<\/li><li>\n<strong>结果通过 return 出帧<\/strong>。没有 return 时帧结束返回 None；print 只展示数据，不把对象带出帧。\n<\/ol>\n<p>依赖链方向：函数对象创建 → 调用帧与形参绑定 → 参数对应规则 → return 交回结果。任何一层前提缺失，就会把定义当调用，或把显示出来的内容误当成可继续运算的返回值。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：def 阶段<\/h3>\n<p>执行 <code>def greet_user(username):<\/code>：解释器创建函数对象，函数体代码作为对象属性保存；名字 <code>greet_user<\/code> 绑到该函数对象。此阶段形参 <code>username<\/code> 没有绑定任何对象，函数体不执行。<\/p>\n<h3>第二步：调用帧建立<\/h3>\n<p>执行 <code>greet_user(&#x27;jesse&#x27;)<\/code>：解释器新建函数帧，在帧内把形参 <code>username<\/code> 绑到实参 <code>&#x27;jesse&#x27;<\/code>；外部作用域不新增 <code>username<\/code>。随后按顺序执行函数体语句。<\/p>\n<h3>第三步：位置参数绑定<\/h3>\n<p>位置调用按书写顺序对应形参：第一个实参绑第一个形参，第二个实参绑第二个形参。顺序调换而形参顺序固定时，值会落到错误的形参上。<\/p>\n<h3>第四步：关键字参数绑定<\/h3>\n<p>关键字调用 <code>describe_pet(animal_type=&#x27;hamster&#x27;, pet_name=&#x27;harry&#x27;)<\/code>：解释器按形参名匹配，<code>animal_type<\/code> 收到 <code>&#x27;hamster&#x27;<\/code>，<code>pet_name<\/code> 收到 <code>&#x27;harry&#x27;<\/code>；实参书写顺序不影响绑定结果。位置参数必须出现在关键字参数之前。<\/p>\n<h3>第五步：默认值启用<\/h3>\n<p>形参设默认值后，调用未传该实参时，形参绑到默认值对象；传入实参则覆盖默认绑定。默认值在函数定义阶段求值一次，这一点决定了可变默认值会被多次调用共享。<\/p>\n<h3>第六步：return 出帧<\/h3>\n<p>执行 <code>return 表达式<\/code>：先求表达式值，把该对象作为调用结果交回调用处，函数帧随即结束；调用处可用变量接收。函数体中 return 之后的语句不再执行。<\/p>\n<h3>第七步：无 return 的返回值<\/h3>\n<p>函数体走完没有遇到 return，解释器把 <code>None<\/code> 作为返回值。调用处若不接收，结果被丢弃；若接收后继续运算，<code>None<\/code> 参与拼接或索引会报 TypeError。<\/p>\n<h2>算例一：问候函数的调用帧跟踪<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>def greet_user(username):\n    &quot;&quot;&quot;显示简单的问候语&quot;&quot;&quot;\n    print(&quot;Hello, &quot; + username.title() + &quot;!&quot;)\n\ngreet_user(&#x27;jesse&#x27;)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\ndef 阶段：函数对象创建，<code>greet_user<\/code> 绑定它；函数体未运行。\n<\/li><li>\n调用 <code>greet_user(&#x27;jesse&#x27;)<\/code>：新建帧，<code>username → &#x27;jesse&#x27;<\/code>。\n<\/li><li>\n函数体：<code>username.title()<\/code> 对 <code>&#x27;jesse&#x27;<\/code> 生成 <code>&#x27;Jesse&#x27;<\/code>；拼接 <code>Hello, Jesse!<\/code>，print 显示到屏幕。\n<\/li><li>\n函数体结束，无 return，返回 <code>None<\/code>；本次调用处没有接收变量，<code>None<\/code> 被丢弃。\n<\/li><li>\n核对：屏幕看到 <code>Hello, Jesse!<\/code>，但调用处拿不到这个字符串；需要继续使用该串时应改为 return。\n<\/ol>\n<h2>算例二：默认值与两种传参形式<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>def describe_pet(pet_name, animal_type=&#x27;dog&#x27;):\n    print(animal_type + &quot;: &quot; + pet_name)<\/code><\/pre>\n<p>三种调用对照：<\/p>\n<ol><li>\n<code>describe_pet(&#x27;willie&#x27;)<\/code>：位置绑定 <code>pet_name=&#x27;willie&#x27;<\/code>；<code>animal_type<\/code> 缺省取默认值 <code>&#x27;dog&#x27;<\/code>，输出 <code>dog: willie<\/code>。\n<\/li><li>\n<code>describe_pate(&#x27;harry&#x27;, &#x27;hamster&#x27;)<\/code> 改为 <code>describe_pet(&#x27;harry&#x27;, &#x27;hamster&#x27;)<\/code>：位置绑定 <code>pet_name=&#x27;harry&#x27;<\/code>、<code>animal_type=&#x27;hamster&#x27;<\/code>，输出 <code>hamster: harry<\/code>。\n<\/li><li>\n<code>describe_pet(animal_type=&#x27;hamster&#x27;, pet_name=&#x27;harry&#x27;)<\/code>：关键字绑定，输出 <code>hamster: harry<\/code>，实参顺序与形参顺序不同仍正确对应。\n<\/li><li>\n错误对照：<code>describe_pet(animal_type=&#x27;hamster&#x27;, &#x27;harry&#x27;)<\/code> 关键字参数后再跟位置参数，解释器无法判断 <code>&#x27;harry&#x27;<\/code> 对应哪个形参，报语法错误。\n<\/ol>\n<h2>算例三：格式化姓名的返回值路径<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>def get_formatted_name(first, last):\n    &quot;&quot;&quot;返回整洁的全名&quot;&quot;&quot;\n    full_name = first + &quot; &quot; + last\n    return full_name.title()\n\nresult = get_formatted_name(&#x27;janis&#x27;, &#x27;joplin&#x27;)\nprint(result)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n调用建帧：<code>first=&#x27;janis&#x27;<\/code>，<code>last=&#x27;joplin&#x27;<\/code>。\n<\/li><li>\n局部变量 <code>full_name<\/code> 绑到 <code>&#x27;janis joplin&#x27;<\/code>；<code>title()<\/code> 生成新串 <code>&#x27;Janis Joplin&#x27;<\/code>。\n<\/li><li>\nreturn 把该串交回调用处，<code>result<\/code> 绑到它；帧结束，<code>full_name<\/code>、<code>first<\/code>、<code>last<\/code> 不再存在。\n<\/li><li>\n<code>print(result)<\/code> 显示 <code>Janis Joplin<\/code>。\n<\/li><li>\n对照：若函数体只写 <code>print(full_name.title())<\/code> 不 return，<code>result<\/code> 为 <code>None<\/code>，<code>print(result)<\/code> 输出 <code>None<\/code>。\n<\/ol>\n<h2>算例四：可变对象传参的两种改动方向<\/h2>\n<p>给定两段函数：<\/p>\n<pre class=\"lang-python\"><code>def append_one(seq):\n    seq.append(1)\n\ndef rebind(seq):\n    seq = [9, 9]\n\nnums = [2, 3]\nappend_one(nums)\nprint(nums)\nrebind(nums)\nprint(nums)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n<code>nums → L1<\/code>，内容 <code>[2, 3]<\/code>。\n<\/li><li>\n<code>append_one(nums)<\/code>：形参 <code>seq<\/code> 绑到 L1；<code>seq.append(1)<\/code> 原地修改，L1 变 <code>[2, 3, 1]<\/code>；<code>nums<\/code> 仍指 L1，<code>print(nums)<\/code> 得 <code>[2, 3, 1]<\/code>。\n<\/li><li>\n<code>rebind(nums)<\/code>：形参 <code>seq<\/code> 先绑 L1；函数体 <code>seq = [9, 9]<\/code> 让形参改指新列表 L2；外部 <code>nums<\/code> 不动。帧结束 L2 失去引用，<code>print(nums)<\/code> 仍得 <code>[2, 3, 1]<\/code>。\n<\/li><li>\n结论：原地修改穿透帧边界，重新绑定形参不穿透。\n<\/ol>\n<h2>算例五：可变默认值残留<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>def add_item(item, bag=[]):\n    bag.append(item)\n    return bag\n\nprint(add_item(&#x27;a&#x27;))\nprint(add_item(&#x27;b&#x27;))<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\ndef 阶段：默认列表 D1 创建一次，作为 <code>bag<\/code> 的默认值保存。\n<\/li><li>\n第一次调用未传 <code>bag<\/code>，形参绑 D1；追加 <code>&#x27;a&#x27;<\/code>，D1 变 <code>[&#x27;a&#x27;]<\/code>，返回 D1。\n<\/li><li>\n第二次调用仍未传 <code>bag<\/code>，默认值还是同一个 D1；追加 <code>&#x27;b&#x27;<\/code>，D1 变 <code>[&#x27;a&#x27;, &#x27;b&#x27;]<\/code>，输出 <code>[&#x27;a&#x27;, &#x27;b&#x27;]<\/code> 而非 <code>[&#x27;b&#x27;]<\/code>。\n<\/li><li>\n修复：默认值写 <code>None<\/code>，函数体内 <code>if bag is None: bag = []<\/code>，每次调用新建列表。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：参数数量不匹配。<\/strong> 定义两个形参只传一个实参，调用时报 TypeError，指出缺少必填参数；多传实参同样报错。复盘：调用前核对形参清单与实参数量。<\/p>\n<p><strong>案例 2：把 print 当 return。<\/strong> 函数内 print 出结果，调用处接收为 <code>None<\/code>，后续拼接报 TypeError。需要把结果带出函数必须写 return。<\/p>\n<p><strong>案例 3：关键字参数位置错误。<\/strong> 关键字参数后再写位置参数，解析失败。位置参数全部前置，关键字参数后置。<\/p>\n<p><strong>案例 4：局部变量想带到函数外。<\/strong> 在函数内赋值的局部变量帧结束后消失，外部访问报 NameError；要带出结果通过 return 返回，或在调用处接收返回值。<\/p>\n<p><strong>案例 5：可变默认对象共享残留。<\/strong> 默认列表在多次调用间累积数据，与“每次调用独立初始值”的预期不符。默认值用不可变对象，可变容器在函数体内创建。<\/p>\n<p><strong>案例 6：同名形参与外部名字混淆。<\/strong> 函数内重新绑定形参后，误以为外部变量被改；复盘：区分原地修改共享对象与重新绑定形参两条路径。<\/p>\n<p><strong>案例 7：返回多个值的拆解误解。<\/strong> 函数用 return 交回多个值时，调用处得到的是打包在一起的结构；调用侧按对应数量接收才能拆开。把返回结构当成单个标量继续运算，会出现类型不符。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：def 执行时函数体运行吗？答：不运行，只创建函数对象并绑定名字。\n<\/li><li>\n问：位置参数按什么对应形参？答：按书写顺序逐一对应。\n<\/li><li>\n问：关键字参数按什么对应？答：按形参名绑定，顺序无关。\n<\/li><li>\n问：没有 return 的函数返回什么？答：None。\n<\/li><li>\n问：print 和 return 的差别？答：print 只显示不交回；return 把对象交回调用处。\n<\/li><li>\n问：可变对象传入函数，原地修改会影响外部吗？答：会，形参与外部指向同一对象；重新绑定形参不影响外部。\n<\/li><li>\n问：默认列表为什么残留数据？答：默认对象在定义阶段创建一次，多次调用共享。\n<\/li><li>\n问：函数内读取外部对象算不算改外部变量？答：读取不改绑定；只有重新赋值形参或原地修改共享对象才需要区分方向。\n<\/li><li>\n问：模块中的函数怎样被其他文件使用？答：import 对应模块后按模块名调用，函数定义留在模块文件内。\n<\/ul>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n定义 <code>def make_shirt(size, text=&#x27;I love Python&#x27;)<\/code>，写出位置调用与关键字调用各一次，说明默认值在什么情况下启用。\n<\/li><li>\n函数 <code>def square(n): print(n * n)<\/code>，调用后 <code>result = square(4)<\/code>，<code>result<\/code> 是什么？要让 <code>result<\/code> 拿到 16，函数应怎样改？\n<\/li><li>\n传入列表 <code>[1, 2]<\/code>，函数内 <code>seq.append(3)<\/code> 与 <code>seq = [4, 5]<\/code> 分别对外部列表产生什么影响？\n<\/li><li>\n为什么可变对象不宜直接做函数默认值？写出修复后的函数开头写法。\n<\/li><li>\n函数内局部变量在调用结束后还能访问吗？结果要带到调用处应通过什么机制？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "函数定义、参数传递与返回值"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：Python编程__从入门到实践_=_Python_Cras...rse_(Eric_Matthes)_(Z-Library).pdf · p.158<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">函数定义、参数传递与返回值<\/a><\/span><\/div><h1>类、实例与实例属性链<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch03（原书第 9 章 §9.1–9.2、9.4，PDF 第 157–165、172–180 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>类是描述一类对象共有属性与行为的模板；按类创建实例时，<code>__init__<\/code> 把传入值存到 <code>self<\/code> 指向的实例上，方法通过 <code>self<\/code> 访问本实例属性，实例之间各自保存一份属性值。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>程序里常有一批同类事物：多只小狗各有名字和年龄，多辆汽车各有制造商、型号、里程。用分散的列表或字典记录，属性与操作属性的代码是分开的，新增一只动物就要重复一组结构。类把“这类事物有哪些属性、能做哪些动作”写成一张模板；实例是按模板造出的具体对象，各自保存自己的属性值。困难在于：实例化那一刻发生了什么？<code>self<\/code> 指向谁？方法内怎样访问本实例数据？为什么两个实例互不影响？本概念把实例化路径、属性存放与方法调用沿属性链拆开推演。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>类定义<\/strong>：<code>class Dog():<\/code> 定义类名，约定首字母大写；类体缩进书写属性初始化与方法。<\/p>\n<p><strong><code>__init__<\/code> 方法<\/strong>：创建实例时自动运行的初始化方法，第一个形参为 <code>self<\/code>，后续形参接收创建实例时传入的值。<\/p>\n<p><strong>实例属性<\/strong>：<code>self.name = name<\/code> 把值存到当前实例；属性属于实例，每个实例各有一份。<\/p>\n<p><strong>方法<\/strong>：类体内定义的函数，第一个形参约定为 <code>self<\/code>；方法通过 <code>self.属性名<\/code> 访问本实例数据。<\/p>\n<p><strong>实例化<\/strong>：<code>my_dog = Dog(&#x27;willie&#x27;, 6)<\/code> 调用类名创建实例，<code>my_dog<\/code> 绑到该实例。<\/p>\n<p><strong>调用方法<\/strong>：<code>my_dog.sit()<\/code> 解释器把实例 <code>my_dog<\/code> 作为 <code>self<\/code> 传入方法，再执行方法体。<\/p>\n<p><strong>修改属性<\/strong>：可直接通过实例属性名赋值修改，也可写方法在修改前加校验逻辑。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>class Dog():\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\n    def sit(self):\n        print(self.name.title() + &quot; is now sitting.&quot;)\n\nmy_dog = Dog(&#x27;willie&#x27;, 6)\nmy_dog.sit()      # Willie is now sitting.<\/code><\/pre>\n<p><strong>反例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>class Dog():\n    def __init__(self, name, age):\n        name = name          # 漏写 self.，值没有存到实例\n\nmy_dog = Dog(&#x27;willie&#x27;, 6)\nprint(my_dog.name)           # AttributeError: &#x27;Dog&#x27; object has no attribute &#x27;name&#x27;<\/code><\/pre>\n<h2>原理推导：实例化与方法调用的属性链<\/h2>\n<p>推演分五步。<\/p>\n<p>第一步，类定义阶段。执行 <code>class Dog():<\/code> 创建类对象，把方法定义收进类；此时还没有任何实例，<code>self<\/code> 也没有指向。<\/p>\n<p>第二步，新建空实例。<code>Dog(&#x27;willie&#x27;, 6)<\/code> 触发实例化：解释器先创建一个空实例，把它作为第一个实参传给 <code>__init__<\/code> 的 <code>self<\/code>，<code>&#x27;willie&#x27;<\/code> 绑到 <code>name<\/code>，<code>6<\/code> 绑到 <code>age<\/code>。<\/p>\n<p>第三步，属性存入实例。<code>__init__<\/code> 内执行 <code>self.name = name<\/code>，把 <code>&#x27;willie&#x27;<\/code> 挂到该实例的 <code>name<\/code> 属性；<code>self.age = age<\/code> 存入 <code>6<\/code>。实例建好后，名字 <code>my_dog<\/code> 绑到这个实例。<\/p>\n<p>第四步，方法调用沿 self 进入。<code>my_dog.sit()<\/code> 调用方法时，解释器把 <code>my_dog<\/code> 传进 <code>self<\/code>；方法体内 <code>self.name<\/code> 沿实例属性链取到 <code>&#x27;willie&#x27;<\/code>，再做标题化处理并打印。<\/p>\n<p>第五步，实例相互独立。再建 <code>your_dog = Dog(&#x27;lucy&#x27;, 3)<\/code>，它有自己的 <code>name<\/code>、<code>age<\/code>；改 <code>my_dog<\/code> 的属性不影响 <code>your_dog<\/code>。两个实例共享类中定义的方法，属性值各自保存。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：一批对象具有相同结构与行为、各自持有不同数据时，用类组织；动作只操作一组零散数据时，函数可能更直接。\n<\/li><li>\n边界一：方法第一个形参必须是 <code>self<\/code>；漏写时实例传入的实例对象无处安放，调用报参数数量错误。\n<\/li><li>\n边界二：属性必须通过 <code>self.属性名<\/code> 赋值才挂到实例；函数体内普通局部变量在方法结束后消失，外部访问不到。\n<\/li><li>\n边界三：访问未初始化的属性抛 AttributeError；<code>__init__<\/code> 应把实例用到的属性都设好初始值。\n<\/li><li>\n失败案例：在方法内写 <code>name = name<\/code> 而不写 <code>self.name<\/code>，值只留在局部帧，实例上没有该属性。\n<\/li><li>\n失败案例：把类模板当实例直接调方法，<code>self<\/code> 没有具体属性可访问，行为与预期不符。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>类 vs 实例<\/strong>：类是模板，规定结构与行为；实例是按模板造出的具体对象，持有自己的属性值。\n<\/li><li>\n<strong>属性 vs 局部变量<\/strong>：<code>self.x<\/code> 挂在实例上，方法调用后仍存在；方法内不带 <code>self<\/code> 的变量是局部变量，帧结束即消失。\n<\/li><li>\n<strong>方法 vs 函数<\/strong>：方法定义在类体内，第一个形参是 <code>self<\/code>，由实例调用；函数定义在模块层级，没有 <code>self<\/code>。\n<\/li><li>\n<strong>直接改属性 vs 方法改属性<\/strong>：直接赋值简单直接；方法改属性可以在写入前加校验、计算或记录，把规则封装在类内部。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c06 函数的参数绑定与返回规则是方法的基础，方法就是首参为 <code>self<\/code> 的函数；c01 绑定与别名解释两个名字指向同一实例的情形。后继：c08 继承在已有类模板上扩展子类；c09 实例属性常以列表、字典形式保存一组子对象；c10 测试类继承 <code>unittest.TestCase<\/code>，测试方法通过 <code>self<\/code> 调用断言方法。类把数据与行为绑定，是组织较大程序的主要结构。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（类、实例与实例属性链）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：实例化路径、self 绑定与实例属性链查找<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把“造实例时属性从哪来、方法里 self 指谁、两个实例为什么互不影响”讲到可推演，先往回追四层前提：<\/p>\n<ol><li>\n<strong>类是模板不是对象数据<\/strong>。类定义规定属性清单与方法行为，本身不保存某个具体事物的属性值；具体值要靠实例承载。\n<\/li><li>\n<strong>实例化先建空实例再初始化<\/strong>。调用类名时先创建空实例，再把实例交给 <code>__init__<\/code> 填充属性；填充完成后实例才可用。\n<\/li><li>\n<strong>self 是当前实例的入口<\/strong>。方法第一个形参接住调用它的实例；方法内所有本实例数据都经 <code>self<\/code> 访问。\n<\/li><li>\n<strong>属性挂在实例上，方法留在类里<\/strong>。每个实例各存一份属性值；方法定义在类中，由实例沿属性链找到并调用。\n<\/ol>\n<p>依赖链方向：类模板 → 空实例 → <code>__init__<\/code> 经 self 存属性 → 方法调用经 self 取属性。任何一层前提缺失，就会把局部变量当成实例属性，或误以为所有实例共享同一份属性值。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：类定义阶段<\/h3>\n<p>执行 <code>class Dog():<\/code>：解释器创建类对象，把 <code>__init__<\/code>、<code>sit<\/code>、<code>roll_over<\/code> 等方法定义收进类对象；此阶段没有实例，<code>self<\/code> 未指向任何对象。<\/p>\n<h3>第二步：创建空实例<\/h3>\n<p><code>Dog(&#x27;willie&#x27;, 6)<\/code> 调用类名：解释器先新建一个空实例对象；随后调用 <code>__init__<\/code>，把空实例作为第一个实参传给形参 <code>self<\/code>，<code>&#x27;willie&#x27;<\/code> 绑到 <code>name<\/code>，<code>6<\/code> 绑到 <code>age<\/code>。<\/p>\n<h3>第三步：属性写入实例<\/h3>\n<p><code>__init__<\/code> 内 <code>self.name = name<\/code>：在该实例上登记 <code>name<\/code> 属性，值为 <code>&#x27;willie&#x27;<\/code>；<code>self.age = age<\/code> 登记 <code>age<\/code> 值为 <code>6<\/code>。赋值左侧是 <code>self.属性名<\/code>，写入目标是当前实例；右侧 <code>name<\/code>、<code>age<\/code> 是帧内形参。<\/p>\n<h3>第四步：实例绑定到名字<\/h3>\n<p><code>__init__<\/code> 执行完毕，实例建好；<code>my_dog<\/code> 绑到这个实例。此时实例上已有 <code>name<\/code>、<code>age<\/code> 两个属性，方法可从类中取得。<\/p>\n<h3>第五步：方法调用传 self<\/h3>\n<p><code>my_dog.sit()<\/code>：解释器在实例 <code>my_dog<\/code> 上查找 <code>sit<\/code>，沿属性链找到类中定义的方法；调用时把 <code>my_dog<\/code> 作为 <code>self<\/code> 传入。方法体 <code>self.name<\/code> 经 <code>self<\/code> 回到该实例，取到 <code>&#x27;willie&#x27;<\/code>。<\/p>\n<h3>第六步：多实例各自存值<\/h3>\n<p>再执行 <code>your_dog = Dog(&#x27;lucy&#x27;, 3)<\/code>：新建另一个空实例，独立填充 <code>name=&#x27;lucy&#x27;<\/code>、<code>age=3<\/code>。两个实例的属性槽位互不重叠；改 <code>my_dog.name<\/code> 不改变 <code>your_dog.name<\/code>。<\/p>\n<h3>第七步：属性查找方向<\/h3>\n<p>在实例上访问属性：先在实例自身属性表查找，命中即返回；实例上没有，再沿类链查找方法或类级定义。方法不在实例属性表里复制，实例只保存自己的属性值。<\/p>\n<h2>算例一：Dog 类实例化与方法调用逐帧跟踪<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>class Dog():\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\n    def sit(self):\n        print(self.name.title() + &quot; is now sitting.&quot;)\n\nmy_dog = Dog(&#x27;willie&#x27;, 6)\nmy_dog.sit()<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n类定义：类对象创建，方法登记，无实例。\n<\/li><li>\n<code>Dog(&#x27;willie&#x27;, 6)<\/code>：空实例 I1 创建；<code>self → I1<\/code>，<code>name=&#x27;willie&#x27;<\/code>，<code>age=6<\/code>。\n<\/li><li>\n<code>self.name = name<\/code>：I1 上写入 <code>name=&#x27;willie&#x27;<\/code>；<code>self.age = age<\/code>：写入 <code>age=6<\/code>。\n<\/li><li>\n<code>my_dog → I1<\/code>。\n<\/li><li>\n<code>my_dog.sit()<\/code>：<code>self → I1<\/code>；<code>self.name<\/code> 取 I1 的 <code>&#x27;willie&#x27;<\/code>；<code>.title()<\/code> 得 <code>&#x27;Willie&#x27;<\/code>；打印 <code>Willie is now sitting.<\/code>。\n<\/li><li>\n核对：<code>my_dog.age<\/code> 取 I1 属性得 <code>6<\/code>；方法执行结束，帧内形参消失，I1 与属性保留。\n<\/ol>\n<h2>算例二：Car 类初始里程与方法校验修改<\/h2>\n<p>给定第 9.2 节的简化版本：<\/p>\n<pre class=\"lang-python\"><code>class Car():\n    def __init__(self, make, model, year):\n        self.make = make\n        self.model = model\n        self.year = year\n        self.odometer_reading = 0\n\n    def update_odometer(self, mileage):\n        if mileage &gt;= self.odometer_reading:\n            self.odometer_reading = mileage\n        else:\n            print(&quot;You can&#x27;t roll back an odometer!&quot;)\n\nmy_new_car = Car(&#x27;audi&#x27;, &#x27;a4&#x27;, 2016)\nmy_new_car.update_odometer(23)\nmy_new_car.update_odometer(10)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n实例 I1 创建：<code>make=&#x27;audi&#x27;<\/code>、<code>model=&#x27;a4&#x27;<\/code>、<code>year=2016<\/code>，<code>odometer_reading<\/code> 初始 0。\n<\/li><li>\n<code>update_odometer(23)<\/code>：<code>self → I1<\/code>；<code>23 &gt;= 0<\/code> 成立，<code>self.odometer_reading = 23<\/code>。\n<\/li><li>\n<code>update_odometer(10)<\/code>：<code>10 &gt;= 23<\/code> 不成立，打印回拨警告，里程保持 23。\n<\/li><li>\n核对：校验规则封装在方法内部，外部调用不能绕过比较直接写回拨后的里程；直接写 <code>my_new_car.odometer_reading = 10<\/code> 则会跳过校验，这是直接改属性与方法改属性的差别。\n<\/ol>\n<h2>算例三：两个实例的属性隔离<\/h2>\n<p>接算例一类：<\/p>\n<pre class=\"lang-python\"><code>my_dog = Dog(&#x27;willie&#x27;, 6)\nyour_dog = Dog(&#x27;lucy&#x27;, 3)\nmy_dog.name = &#x27;willie jr.&#x27;\nprint(your_dog.name)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\nI1：<code>name=&#x27;willie&#x27;<\/code>、<code>age=6<\/code>；I2：<code>name=&#x27;lucy&#x27;<\/code>、<code>age=3<\/code>。\n<\/li><li>\n<code>my_dog.name = &#x27;willie jr.&#x27;<\/code>：只改 I1 的 <code>name<\/code> 属性。\n<\/li><li>\n<code>your_dog.name<\/code> 沿 I2 属性表取 <code>&#x27;lucy&#x27;<\/code>，不受 I1 改动影响。\n<\/li><li>\n方法共享：两个实例调用 <code>sit<\/code> 都沿类链找到同一个方法定义；方法内经 <code>self<\/code> 各自取到本实例名字，输出不同。\n<\/ol>\n<h2>算例四：漏写 self 的属性丢失<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>class Dog():\n    def __init__(self, name, age):\n        name = name\n        age = age\n\nmy_dog = Dog(&#x27;willie&#x27;, 6)\nprint(my_dog.name)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n实例 I1 创建，<code>self → I1<\/code>，形参 <code>name=&#x27;willie&#x27;<\/code>、<code>age=6<\/code>。\n<\/li><li>\n<code>name = name<\/code> 是局部赋值，只在 <code>__init__<\/code> 帧内改形参名字，没有写入 I1；<code>age = age<\/code> 也是如此。\n<\/li><li>\n帧结束，局部 <code>name<\/code>、<code>age<\/code> 消失；I1 上没有 <code>name<\/code>、<code>age<\/code> 属性。\n<\/li><li>\n<code>my_dog.name<\/code> 在 I1 属性表与类链上都找不到 <code>name<\/code>，抛 <code>AttributeError: &#x27;Dog&#x27; object has no attribute &#x27;name&#x27;<\/code>。\n<\/li><li>\n修正：两处改为 <code>self.name = name<\/code>、<code>self.age = age<\/code>。\n<\/ol>\n<h2>算例五：方法内局部变量不进实例<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>class Counter():\n    def __init__(self):\n        self.count = 0\n\n    def bump(self):\n        step = 1\n        self.count += step\n\nc = Counter()\nc.bump()\nprint(c.count)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\nI1 创建，<code>self.count = 0<\/code>。\n<\/li><li>\n<code>bump()<\/code>：<code>self → I1<\/code>；局部变量 <code>step = 1<\/code> 只在方法帧内存在；<code>self.count += step<\/code> 取 I1 当前 <code>count<\/code> 0，加 1 写回 I1，得 1。\n<\/li><li>\n方法结束，<code>step<\/code> 消失；<code>c.count<\/code> 仍为 1。\n<\/li><li>\n核对：<code>c.step<\/code> 访问不到，<code>step<\/code> 不是实例属性；需要跨方法保留的值必须挂到 <code>self<\/code> 上。\n<\/ol>\n<h2>算例六：直接改属性与方法封装改属性对照<\/h2>\n<p>给定带里程属性的汽车类：<\/p>\n<pre class=\"lang-python\"><code>class Car():\n    def __init__(self, make, model, year):\n        self.make = make\n        self.model = model\n        self.year = year\n        self.odometer_reading = 0\n\n    def update_odometer(self, mileage):\n        if mileage &gt;= self.odometer_reading:\n            self.odometer_reading = mileage\n        else:\n            print(&quot;You can&#x27;t roll back an odometer!&quot;)<\/code><\/pre>\n<p>推演两种修改路径：<\/p>\n<ol><li>\n直接赋值：<code>my_car.odometer_reading = 10<\/code>。实例属性表直接被改写，<code>update_odometer<\/code> 里的比较校验没有经过，里程可以被回拨到更小值。\n<\/li><li>\n方法修改：<code>my_car.update_odometer(23)<\/code>。进入方法后先比较 <code>23 &gt;= 0<\/code>，成立才写入；传入 <code>10<\/code> 时比较 <code>10 &gt;= 23<\/code> 不成立，打印警告，属性保持 23。\n<\/li><li>\n两种路径写入目标都是同一个实例属性；差别在于方法路径把校验规则留在类内部，直接赋值路径绕过规则。\n<\/li><li>\n递增方法对照：<code>increment_odometer(self, miles)<\/code> 内执行 <code>self.odometer_reading += miles<\/code>，先取实例当前值加增量，再写回实例；增量累计跨多次调用保留在实例上。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：方法漏写 self 形参。<\/strong> <code>def sit():<\/code> 没有 <code>self<\/code>，调用 <code>my_dog.sit()<\/code> 时实例被传入第一个形参位置，参数数量对不上报 TypeError。方法首参约定为 <code>self<\/code>。<\/p>\n<p><strong>案例 2：访问未初始化属性。<\/strong> <code>__init__<\/code> 没有给某属性设初始值，方法内却访问它，抛 AttributeError。初始化应把实例用到的属性都设好。<\/p>\n<p><strong>案例 3：局部变量当成实例属性。<\/strong> 方法内写普通赋值，帧结束后外部访问不到；需要保留到实例上必须 <code>self.属性名 = 值<\/code>。<\/p>\n<p><strong>案例 4：绕过校验直接改属性。<\/strong> 把受方法保护的里程直接赋值回拨，校验规则被跳过。需要强制走规则时，把属性访问限制在方法内部处理。<\/p>\n<p><strong>案例 5：把类当实例调用方法。<\/strong> 不经过实例化直接在类上调方法，<code>self<\/code> 没有具体属性，取属性时报错；必须先按类造出实例。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：类和实例哪个是模板、哪个是具体对象？答：类是模板，实例是按模板造出的具体对象。\n<\/li><li>\n问：<code>__init__<\/code> 在什么时候运行？答：创建实例时自动运行，负责把属性存到实例。\n<\/li><li>\n问：self 指向谁？答：调用方法的那个实例本身。\n<\/li><li>\n问：属性写在实例上还是类上？答：实例属性挂在实例上，每个实例各一份；方法定义留在类里。\n<\/li><li>\n问：不带 self 的局部变量帧结束后还在吗？答：不在，只在方法帧内存在。\n<\/li><li>\n问：两个实例改各自属性会互相影响吗？答：不会，属性槽位独立；方法定义共享。\n<\/li><li>\n问：访问不存在的实例属性报什么错？答：AttributeError。\n<\/ul>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出一个 <code>Restaurant<\/code> 类：<code>__init__<\/code> 接收餐馆名与菜系，定义 <code>describe()<\/code> 方法打印信息；创建两个实例并调用方法，说明两个实例的名字为什么互不影响。\n<\/li><li>\n方法内 <code>total = 0<\/code> 与 <code>self.total = 0<\/code> 在实例留存上有什么差别？后续方法要读取这个值应写哪种？\n<\/li><li>\n<code>update_odometer<\/code> 方法里校验里程不能回拨；外部直接给属性赋更小的值会发生什么？怎样理解这种绕过？\n<\/li><li>\n实例化时 <code>self<\/code>、<code>name<\/code>、<code>age<\/code> 三者各绑定到什么对象？\n<\/li><li>\n方法找不到实例上的某属性时，查找顺序是怎样的？AttributeError 在哪一步抛出？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "类、实例与实例属性链"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：Python编程__从入门到实践_=_Python_Cras...rse_(Eric_Matthes)_(Z-Library).pdf · p.166<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">类、实例与实例属性链<\/a><\/span><\/div><h1>继承、方法重写与父类调用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch03（原书第 9 章 §9.3，PDF 第 166–171 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>子类在类名括号里写上父类名即建立继承；子类自动获得父类的属性与方法，需要不同行为时在子类中重写同名方法，用 <code>super()<\/code> 调用父类的初始化或方法，先复用父类部分再补充子类自己的部分。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>编写新类时，它往往是某个现成类的特殊版本：电动车是汽车的一种，有制造商、型号、里程这些共有属性，又多了电池容量等自己的属性；射击飞船是游戏飞船的一种，共有位置与移动行为，又多了开火动作。如果从零再写一遍共有部分，两份代码平行维护，改一处要同步两处。继承让子类复用父类已有的结构与行为，只在差异处写新代码。困难在于：子类实例怎样先把父类那部分初始化好？同名方法在子类和父类之间命中哪一个？<code>super()<\/code> 调用的是哪一份？本概念把继承链上的初始化顺序、方法查找与重写覆盖拆开推演。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>父类与子类<\/strong>：被继承的类称父类（超类），新建的类称子类；子类括号内写父类名，如 <code>class ElectricCar(Car):<\/code>。<\/p>\n<p><strong>继承获得成员<\/strong>：子类实例可以使用父类定义的属性与方法，不必在子类中重写一遍。<\/p>\n<p><strong>super() 调用父类初始化<\/strong>：子类 <code>__init__<\/code> 中用 <code>super().__init__(...)<\/code> 调用父类 <code>__init__<\/code>，把父类那部分属性先初始化好。<\/p>\n<p><strong>方法重写<\/strong>：子类中定义与父类同名的方法，子类实例调用时命中子类版本；父类自身与父类实例不受影响。<\/p>\n<p><strong>子类扩展<\/strong>：子类在父类基础上新增自己的属性与方法，描述特殊版本独有的部分。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>class Car():\n    def __init__(self, make, model, year):\n        self.make = make\n        self.model = model\n        self.year = year\n\nclass ElectricCar(Car):\n    def __init__(self, make, model, year):\n        super().__init__(make, model, year)\n        self.battery_size = 75\n\nmy_tesla = ElectricCar(&#x27;tesla&#x27;, &#x27;model s&#x27;, 2016)<\/code><\/pre>\n<p><strong>反例<\/strong>：子类 <code>__init__<\/code> 漏写 <code>super().__init__(...)<\/code>，父类在初始化中设置的属性不出现在子类实例上，后续方法访问时抛 AttributeError。<\/p>\n<h2>原理推导：初始化顺序与方法查找链<\/h2>\n<p>推演分五步。<\/p>\n<p>第一步，定义子类。<code>class ElectricCar(Car):<\/code> 建立继承关系，子类对象沿链可追溯到父类；类定义阶段同样不创建实例。<\/p>\n<p>第二步，子类实例化先走父类初始化。<code>ElectricCar(...)<\/code> 创建子类实例后调用子类 <code>__init__<\/code>；<code>super().__init__(make, model, year)<\/code> 把实参交给父类 <code>__init__<\/code>，父类部分属性写入实例；再回到子类 <code>__init__<\/code> 补充 <code>battery_size<\/code>。<\/p>\n<p>第三步，方法沿链查找。子类实例调用方法：先在子类定义中找同名方法，命中即用子类版本；找不到再沿继承链到父类查找。<\/p>\n<p>第四步，重写覆盖。子类定义与父类同名方法后，查找在子类处即命中，父类版本被遮蔽；需要保留父类行为并追加新逻辑时，方法内可用 <code>super()<\/code> 调用父类同名方法，再写子类增量。<\/p>\n<p>第五步，属性归属。父类 <code>__init__<\/code> 写入的属性挂在同一个子类实例上；子类新增属性也挂在该实例。实例是一份，属性与方法按链分工提供。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：新类是旧类的特殊版本，共有结构与行为可复用、仅在局部差异时使用继承；两类只是碰巧有几个相似方法，不构成“是一种”关系时，不宜硬套继承。\n<\/li><li>\n边界一：子类 <code>__init__<\/code> 必须先调用父类初始化，父类属性才会出现在实例上；漏写则访问父类属性时报错。\n<\/li><li>\n边界二：重写方法的形参清单要与调用处匹配；签名不一致会在调用时出现参数数量错误。\n<\/li><li>\n边界三：<code>super()<\/code> 调用沿继承链向上定位父类方法；多层继承时调用顺序由链结构决定。\n<\/li><li>\n失败案例：子类重写方法时把父类原有行为整体丢掉，又没有用 <code>super()<\/code> 复用，导致共有行为在子类中缺失。\n<\/li><li>\n失败案例：在子类 <code>__init__<\/code> 中先使用父类属性、后调用 <code>super().__init__()<\/code>，属性尚未初始化就被读取。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>继承 vs 新增方法<\/strong>：继承带来父类已有成员；子类扩展是在共有之外追加独有方法。重写是替换同名方法的行为。\n<\/li><li>\n<strong>重写 vs 重载<\/strong>：本子概念范围内，重写指子类覆盖父类同名方法；参数清单不同的多个同名方法不是本书展开的重载机制。\n<\/li><li>\n<strong>super() vs 直接写父类名<\/strong>：<code>super()<\/code> 沿链定位父类，随继承结构调整；直接按父类名调用写死了来源，链结构变化时不够灵活。\n<\/li><li>\n<strong>is-a vs has-a<\/strong>：继承表达“子类是一种父类”；一个类持有另一个类的实例作为属性，是“有一个”的组合关系，不写成继承。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c07 实例化、self 与属性链是继承的基础；c06 方法的参数规则沿用。后继：c10 测试类 <code>NamesTestCase(unittest.TestCase)<\/code> 是继承的直接应用，子类复用 TestCase 的断言方法；第二部分游戏项目中飞船、子弹、外星人群的类层次同样沿继承与重写组织。继承把类与类之间的共性沉淀到父类，差异留在子类。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（继承、方法重写与父类调用）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：继承链初始化、方法查找顺序与重写覆盖<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把“子类实例为什么先有父类属性、同名方法命中哪一份、super 调用到哪里”讲到可推演，先往回追四层前提：<\/p>\n<ol><li>\n<strong>子类是父类的特殊版本<\/strong>。二者共有属性与行为先沉淀在父类，子类只描述差异；继承关系在类定义的括号中声明。\n<\/li><li>\n<strong>实例只有一份，属性按链分工写入<\/strong>。子类实例是同一个对象，父类初始化写入父类部分属性，子类初始化再补充独有属性。\n<\/li><li>\n<strong>方法查找沿链向上<\/strong>：实例调用方法先查子类，再查父类；子类同名方法遮蔽父类版本。\n<\/li><li>\n<strong>super 沿链定位父类部分<\/strong>：需要复用父类初始化或父类方法时，经 super 调用，避免把父类代码复制进子类。\n<\/ol>\n<p>依赖链方向：继承声明 → 父类初始化先行 → 子类补充属性 → 方法沿链查找与重写覆盖。任何一层前提缺失，就会漏掉父类初始化，或把重写误当成复制一份父类代码。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：建立继承关系<\/h3>\n<p>执行 <code>class ElectricCar(Car):<\/code>：解释器创建子类对象，并记录其父类为 <code>Car<\/code>；子类实例沿链可使用 <code>Car<\/code> 中定义的方法。此阶段无实例。<\/p>\n<h3>第二步：子类实例化<\/h3>\n<p><code>ElectricCar(&#x27;tesla&#x27;, &#x27;model s&#x27;, 2016)<\/code>：先创建子类空实例，调用子类 <code>__init__<\/code>，实例作为 <code>self<\/code> 传入。<\/p>\n<h3>第三步：super 转交父类初始化<\/h3>\n<p>子类 <code>__init__<\/code> 中 <code>super().__init__(make, model, year)<\/code>：沿链定位父类 <code>__init__<\/code>，把三个实参交给父类方法；父类方法经同一个 <code>self<\/code> 把 <code>make<\/code>、<code>model<\/code>、<code>year<\/code> 写入实例。父类部分初始化完成后，回到子类 <code>__init__<\/code>。<\/p>\n<h3>第四步：子类补充独有属性<\/h3>\n<p>回到子类 <code>__init__<\/code>，执行 <code>self.battery_size = 75<\/code>，把独有属性写入同一实例。至此实例上既有父类属性，也有子类属性。<\/p>\n<h3>第五步：方法查找顺序<\/h3>\n<p>实例调用方法时，先在子类定义中查找同名方法；命中则执行子类版本，父类版本被遮蔽；子类没有该方法，再到父类定义中查找。<\/p>\n<h3>第六步：重写中复用父类行为<\/h3>\n<p>子类重写某方法时，方法体内可经 <code>super().方法名(...)<\/code> 调用父类同名版本，先完成父类行为，再写子类增量。这样既替换整体行为，也保留可复用的那一段。<\/p>\n<h3>第七步：属性与方法的分工<\/h3>\n<p>父类 <code>__init__<\/code> 写入的属性属于实例，不属于父类独有副本；子类新增属性也在同一实例。两个子类实例之间属性仍各自独立，规则与 c07 一致。<\/p>\n<h2>算例一：电动车实例化的属性写入顺序<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>class Car():\n    def __init__(self, make, model, year):\n        self.make = make\n        self.model = model\n        self.year = year\n\n    def get_descriptive_name(self):\n        return str(self.year) + &quot; &quot; + self.make + &quot; &quot; + self.model\n\nclass ElectricCar(Car):\n    def __init__(self, make, model, year):\n        super().__init__(make, model, year)\n        self.battery_size = 75\n\nmy_tesla = ElectricCar(&#x27;tesla&#x27;, &#x27;model s&#x27;, 2016)\nprint(my_tesla.get_descriptive_name())\nprint(my_tesla.battery_size)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n<code>ElectricCar(...)<\/code> 创建子类实例 I1，调用子类 <code>__init__<\/code>，<code>self → I1<\/code>。\n<\/li><li>\n<code>super().__init__(&#x27;tesla&#x27;, &#x27;model s&#x27;, 2016)<\/code> 转交父类：I1 写入 <code>make=&#x27;tesla&#x27;<\/code>、<code>model=&#x27;model s&#x27;<\/code>、<code>year=2016<\/code>。\n<\/li><li>\n回到子类，I1 写入 <code>battery_size=75<\/code>。\n<\/li><li>\n<code>get_descriptive_name()<\/code> 在子类定义中找不到，沿链到父类命中；经 <code>self<\/code> 取 I1 属性，返回 <code>2016 tesla model s<\/code>。\n<\/li><li>\n<code>my_tesla.battery_size<\/code> 取子类属性 <code>75<\/code>。\n<\/ol>\n<h2>算例二：重写方法命中子类版本<\/h2>\n<p>在子类中增加与父类同名的描述方法：<\/p>\n<pre class=\"lang-python\"><code>class Car():\n    def describe(self):\n        print(&quot;This is a car.&quot;)\n\nclass ElectricCar(Car):\n    def describe(self):\n        print(&quot;This is an electric car.&quot;)\n\nmy_car = Car()\nmy_tesla = ElectricCar()\nmy_car.describe()\nmy_tesla.describe()<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n<code>my_car<\/code> 是父类实例，调用 <code>describe<\/code> 命中父类版本，打印 <code>This is a car.<\/code>。\n<\/li><li>\n<code>my_tesla<\/code> 是子类实例，查找 <code>describe<\/code> 先在子类命中，打印 <code>This is an electric car.<\/code>。\n<\/li><li>\n父类实例不受子类重写影响；重写只改变子类实例沿链查找时命中的版本。\n<\/ol>\n<h2>算例三：重写中用 super 复用父类行为<\/h2>\n<pre class=\"lang-python\"><code>class ElectricCar(Car):\n    def __init__(self, make, model, year, battery_size):\n        super().__init__(make, model, year)\n        self.battery_size = battery_size\n\n    def describe(self):\n        super().describe()\n        print(&quot;Battery size: &quot; + str(self.battery_size) + &quot; kWh.&quot;)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n子类 <code>describe<\/code> 被调用：<code>super().describe()<\/code> 沿链执行父类 <code>describe<\/code>，打印父类那一句；随后执行子类增量，打印电池容量。\n<\/li><li>\n实例上最终看到两句输出：父类行为保留，子类追加独有信息。\n<\/li><li>\n对照：若子类 <code>describe<\/code> 不调用 <code>super().describe()<\/code>，父类那句行为在子类实例上不再出现。\n<\/ol>\n<h2>算例四：漏写父类初始化的报错路径<\/h2>\n<p>给定错误写法：<\/p>\n<pre class=\"lang-python\"><code>class ElectricCar(Car):\n    def __init__(self, make, model, year):\n        self.battery_size = 75\n\nmy_tesla = ElectricCar(&#x27;tesla&#x27;, &#x27;model s&#x27;, 2016)\nprint(my_tesla.make)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n子类 <code>__init__<\/code> 没有调用 <code>super().__init__(...)<\/code>，父类部分属性从未写入 I1。\n<\/li><li>\nI1 上只有 <code>battery_size<\/code>；<code>make<\/code>、<code>model<\/code>、<code>year<\/code> 缺失。\n<\/li><li>\n<code>my_tesla.make<\/code> 在实例属性表与父类链上都找不到 <code>make<\/code>，抛 <code>AttributeError: &#x27;ElectricCar&#x27; object has no attribute &#x27;make&#x27;<\/code>。\n<\/li><li>\n修正：子类 <code>__init__<\/code> 首行调用 <code>super().__init__(make, model, year)<\/code>，再补充子类属性。\n<\/ol>\n<h2>算例五：先使用父类属性后初始化的顺序错误<\/h2>\n<p>错误写法：<\/p>\n<pre class=\"lang-python\"><code>class ElectricCar(Car):\n    def __init__(self, make, model, year):\n        self.description = self.make + &quot; &quot; + self.model\n        super().__init__(make, model, year)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n进入子类 <code>__init__<\/code>，<code>self.make<\/code> 还未由父类初始化，实例上没有该属性。\n<\/li><li>\n执行 <code>self.make + &quot; &quot;<\/code> 时即抛 AttributeError，程序到不了 super 那一行。\n<\/li><li>\n正确顺序：先 <code>super().__init__(...)<\/code> 把父类属性写入实例，再读取或基于这些属性构造子类属性。\n<\/ol>\n<h2>算例六：子类实例沿用父类方法访问父类属性<\/h2>\n<p>接算例一的 <code>ElectricCar<\/code>，新增调用：<\/p>\n<pre class=\"lang-python\"><code>my_tesla = ElectricCar(&#x27;tesla&#x27;, &#x27;model s&#x27;, 2016)\nprint(my_tesla.year)\nprint(my_tesla.get_descriptive_name())<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n<code>my_tesla.year<\/code>：实例属性表中有父类 <code>__init__<\/code> 写入的 <code>year<\/code>，直接取回 <code>2016<\/code>。\n<\/li><li>\n<code>get_descriptive_name<\/code> 在子类定义中没有，沿链到父类命中；方法内经 <code>self<\/code> 取实例上的 <code>year<\/code>、<code>make<\/code>、<code>model<\/code>，拼出描述串。\n<\/li><li>\n子类没有重写该方法，父类版本原样服务于子类实例；父类方法引用的属性由父类初始化写入实例，链路闭合。\n<\/li><li>\n边界核对：若父类方法引用了子类才会有的属性，子类未传入对应值，调用到该方法时会在属性查找处失败。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：漏调父类初始化。<\/strong> 子类实例缺父类属性，访问时报 AttributeError。复盘：子类 <code>__init__<\/code> 先经 super 转交父类初始化。<\/p>\n<p><strong>案例 2：重写时丢掉父类行为。<\/strong> 子类同名方法整体新写，没有调用 super，父类原本的校验或初始化逻辑在子类中失效。需要保留父类行为时在方法内 super 调用。<\/p>\n<p><strong>案例 3：重写方法签名不匹配。<\/strong> 子类方法形参与调用处传入的实参数量对不上，调用时报 TypeError。重写应保持与调用预期一致的参数清单。<\/p>\n<p><strong>案例 4：先读父类属性后初始化。<\/strong> 顺序颠倒导致属性尚未写入就被读取。初始化顺序按“父类部分先行，子类补充在后”。<\/p>\n<p><strong>案例 5：不构成是一种关系却套继承。<\/strong> 两个类只有个别方法相似，硬写成父子类后，父类约束强加给子类，方法查找链出现不该有的命中。这种“有一个”的关系应写成属性持有，而不是继承。<\/p>\n<p><strong>案例 6：子类新增属性未在 __init__ 初始化。<\/strong> 子类方法读取一个只在别处偶发赋值的属性，某些实例上该属性不存在，调用到这条方法时抛 AttributeError。子类独有属性应在 <code>__init__<\/code> 中设好初始值。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：子类怎样声明继承父类？答：类名括号里写父类名。\n<\/li><li>\n问：子类实例先初始化哪部分？答：先经 super 调用父类 <code>__init__<\/code> 写入父类属性，再补充子类属性。\n<\/li><li>\n问：子类与父类有同名方法时实例调用哪个？答：先在子类命中，子类版本覆盖父类版本。\n<\/li><li>\n问：super() 的作用是什么？答：沿链定位并调用父类的初始化或同名方法。\n<\/li><li>\n问：漏写 super().__init__ 会缺什么？答：父类在初始化中设置的属性不会出现在子类实例上。\n<\/li><li>\n问：父类实例会被子类重写影响吗？答：不会，重写只改变子类实例的查找命中。\n<\/li><li>\n问：继承表达什么关系？答：is-a，子类是父类的一种特殊版本。\n<\/li><li>\n问：子类实例上的父类属性存在哪里？答：存在同一个子类实例上，由父类 <code>__init__<\/code> 经 self 写入。\n<\/li><li>\n问：父类方法在子类实例上怎样被找到？答：子类没有同名方法时，沿继承链到父类定义中查找。\n<\/ul>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出 <code>Restaurant<\/code> 与其子类 <code>IceCreamStand<\/code>：父类初始化餐馆名与菜系，子类新增口味列表；写出子类 <code>__init__<\/code> 的正确顺序。\n<\/li><li>\n子类重写 <code>describe<\/code> 方法时，怎样在保留父类描述的基础上追加一句子类信息？写出 super 调用行。\n<\/li><li>\n子类 <code>__init__<\/code> 漏写 super 调用，访问父类属性时抛什么错误？属性是在哪一步丢失的？\n<\/li><li>\n子类实例调用一个子类没有定义的方法，查找路径是怎样的？\n<\/li><li>\n“一个学生有一辆自行车”适合用继承还是属性持有？为什么？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "继承、方法重写与父类调用"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：Python编程__从入门到实践_=_Python_Cras...rse_(Eric_Matthes)_(Z-Library).pdf · p.191<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">类、实例与实例属性链<\/a><\/span><\/div><h1>文件读写、异常处理与 JSON 持久化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch04（原书第 10 章 §10.1–10.4，PDF 第 181–205 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><code>open()<\/code> 配合 <code>with<\/code> 把文件内容读进内存或把数据写入磁盘；<code>try-except-else<\/code> 按异常类型接住运行错误并继续执行；<code>json.dump()<\/code> 与 <code>json.load()<\/code> 把 Python 数据结构序列化为文本保存、再读回重建。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>程序在内存中处理的数据，关闭后就消失；需要留存结果、读取外部数据集时，必须读写文件。运行中还会遇到文件不存在、除以零、文本无法转成数字等错误；不处理时程序直接崩溃并抛出 traceback，用户看到的是难懂的错误栈。困难在于：文件怎样打开、读完由谁关闭？读取与写入模式有什么差别？异常在哪一步被创建、沿什么路径传播？为什么 except 要按类型写？结构化数据怎样保存到文件再读回？本概念把文件路径、异常分支与 JSON 往返拆开推演。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>打开文件<\/strong>：<code>open(filename)<\/code> 返回文件对象；模式 <code>&#x27;r&#x27;<\/code> 读取、<code>&#x27;w&#x27;<\/code> 写入（覆盖）、<code>&#x27;a&#x27;<\/code> 附加到末尾。<\/p>\n<p><strong>with 语句<\/strong>：<code>with open(...) as f_obj:<\/code> 块结束时自动关闭文件，即使块内出现异常也会关闭。<\/p>\n<p><strong>读取方式<\/strong>：一次性读取整个文件；逐行读取；生成包含各行内容的列表，每行末尾换行符可去除。<\/p>\n<p><strong>写入文件<\/strong>：写入模式打开后用文件对象写入字符串；写入多行需自行包含换行符；附加模式在末尾续写而不清空原内容。<\/p>\n<p><strong>异常对象<\/strong>：运行出错时解释器创建的特殊对象，如 <code>ZeroDivisionError<\/code>、<code>FileNotFoundError<\/code>；未被捕获则沿调用栈向上传播，程序终止并显示 traceback。<\/p>\n<p><strong>try-except-else<\/strong>：try 块放可能出错的代码；except 接住指定类型异常并执行兜底；else 块在无异常时继续执行。<\/p>\n<p><strong>json.dump / json.load<\/strong>：<code>json.dump(数据, 文件对象)<\/code> 把数据写成 JSON 文本；<code>json.load(文件对象)<\/code> 读回并重建对应 Python 数据结构。<\/p>\n<p><strong>正例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>import json\nnumbers = [2, 3, 5, 7, 11, 13]\nwith open(&#x27;numbers.json&#x27;, &#x27;w&#x27;) as f_obj:\n    json.dump(numbers, f_obj)<\/code><\/pre>\n<p><strong>反例<\/strong>：<\/p>\n<pre class=\"lang-python\"><code>try:\n    print(5 / 0)\nexcept ZeroDivisionError:\n    print(&quot;You can&#x27;t divide by zero!&quot;)<\/code><\/pre>\n<p>除数为零的异常被指定类型接住，程序不显示 traceback，继续向后运行。<\/p>\n<h2>原理推导：文件路径、异常传播与序列化往返<\/h2>\n<p>推演分五步。<\/p>\n<p>第一步，打开与读取。<code>open<\/code> 按路径定位文件，返回文件对象；读取操作把磁盘内容调入内存。相对路径相对程序运行目录，绝对路径从根目录写起。<code>with<\/code> 块退出时关闭文件。<\/p>\n<p>第二步，写入与覆盖语义。<code>&#x27;w&#x27;<\/code> 打开已有文件时先清空原内容再写入；<code>&#x27;a&#x27;<\/code> 保留原内容，新内容追加到末尾。写入的是字符串，数值与列表需先转成文本或交给 json 序列化。<\/p>\n<p>第三步，异常创建与匹配。try 块代码运行出错时，解释器创建对应类型的异常对象；依次查找 except 子句，类型匹配则执行 except 块，异常被就地处理；不匹配则继续向上传播。<\/p>\n<p>第四步，else 与正常路径。try 块无异常抛出时，跳过 except，进入 else 块执行后续逻辑；异常被接住后，try 块余下语句不再执行。<\/p>\n<p>第五步，JSON 往返。dump 把列表、字典等结构转成 JSON 文本写入文件；load 读取文本并按 JSON 结构重建 Python 对象。文件里存的是文本，不是内存对象本身。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：需要留存内存数据、读取外部文件、对可能失败的操作兜底时使用；错误属于预期内分支时处理异常，明显可预判的条件也可先做判断。\n<\/li><li>\n边界一：读取不存在的文件抛 <code>FileNotFoundError<\/code>；except 应指定该类型，避免吞掉其他错误。\n<\/li><li>\n边界二：<code>&#x27;w&#x27;<\/code> 会清空已有文件；需要保留旧内容用 <code>&#x27;a&#x27;<\/code>。\n<\/li><li>\n边界三：宽泛 <code>except:<\/code> 会捕获包括拼写错误、中断在内的所有异常，掩盖真正问题；应按具体类型书写。\n<\/li><li>\n失败案例：不用 with 打开文件，中间代码抛异常，文件来不及关闭，长期运行占用文件句柄。\n<\/li><li>\n失败案例：把 JSON 文本读回后直接当原对象修改嵌套结构，未意识到读回的是新重建出的对象。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>读取 / 写入 / 附加模式<\/strong>：<code>&#x27;r&#x27;<\/code> 只读；<code>&#x27;w&#x27;<\/code> 覆盖写；<code>&#x27;a&#x27;<\/code> 末尾追加。模式选错会清空数据或拒绝写入。\n<\/li><li>\n<strong>异常处理 vs 条件预判<\/strong>：异常处理接住已经发生的错误；条件预判在错误发生前判断分支。预期内偶发错误用异常，稳定可判断的情形用条件分支。\n<\/li><li>\n<strong>json.dump vs 手工写文本<\/strong>：dump 自动处理结构转义与格式；手工拼接文本在数据含特殊字符时容易出错。\n<\/li><li>\n<strong>except 类型匹配 vs 全捕获<\/strong>：指定类型只接对应异常；全捕获把不该吞的错误也藏起来。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c05 的输入循环收集用户数据，本章把收集结果写入文件；c07 实例属性可整理成字典后用 json 保存。后继：c10 测试函数会核对文件读写与异常处理路径是否符合预期；第二部分数据可视化项目读取数据文件，Web 应用保存用户输入，都建立在文件与持久化机制之上。异常传播路径与函数调用帧（c06）沿同一方向：从出错函数向外层调用者传递。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（文件读写、异常处理与 JSON 持久化）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：文件读写路径、异常传播链与 JSON 序列化往返<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把“文件怎样读进内存、异常在哪一步被接住、结构化数据怎样保存再读回”讲到可推演，先往回追四层前提：<\/p>\n<ol><li>\n<strong>内存数据断电即失<\/strong>。程序运行结果要留存到磁盘，必须经过文件读写；文件对象是程序与磁盘之间的入口。\n<\/li><li>\n<strong>打开模式决定读写语义<\/strong>：读取、覆盖写、末尾追加三种模式对原内容的处理不同，模式选错直接影响数据存亡。\n<\/li><li>\n<strong>错误以异常对象形式出现并沿栈传播<\/strong>：解释器在出错点创建异常，先在当前 try 块内找匹配 except，找不到则向外层调用者传递，直到被捕获或程序终止。\n<\/li><li>\n<strong>结构化数据需要序列化<\/strong>：内存中的列表、字典不能直接写进纯文本文件，要经 json 转成文本格式；读回时再反序列化为对象。\n<\/ol>\n<p>依赖链方向：文件入口 → 模式与关闭语义 → 异常创建与匹配 → JSON 序列化与重建。任何一层前提缺失，就会用写入模式清空原文件，或把未捕获异常误当成正常分支。<\/p>\n<h2>正向推导（逐步）<\/h2>\n<h3>第一步：open 返回文件对象<\/h3>\n<p><code>open(filename, mode)<\/code> 按路径定位文件，成功后返回文件对象；程序通过文件对象的读取、写入方法操作内容。相对路径以程序运行目录为基准，绝对路径从根目录写起。<\/p>\n<h3>第二步：with 块与自动关闭<\/h3>\n<p><code>with open(...) as f_obj:<\/code> 把文件对象绑到 <code>f_obj<\/code>；块内执行读写，块退出时无论正常结束还是异常跳出，都执行关闭。手动 <code>open<\/code> 若中间出错，关闭语句可能被跳过。<\/p>\n<h3>第三步：读取的三种粒度<\/h3>\n<p>一次性读取得到整个文件的大字符串；逐行读取每次取一行；读取各行列表把每行作为列表元素。每行末尾保留换行符，需要时用字符串方法去除。大文件逐行处理可避免一次性载入全部内容。<\/p>\n<h3>第四步：写入与模式语义<\/h3>\n<p><code>&#x27;w&#x27;<\/code>：打开时清空原文件，后续写入覆盖；<code>&#x27;a&#x27;<\/code>：保留原内容，写入位置在末尾；写入内容必须是字符串，多行之间需加换行符。数值、列表不直接写入文本文件。<\/p>\n<h3>第五步：异常创建<\/h3>\n<p>try 块语句运行出错时，解释器创建对应类型的异常对象，例如除数为零创建 <code>ZeroDivisionError<\/code>，文件不存在创建 <code>FileNotFoundError<\/code>。异常对象携带出错位置与类型信息。<\/p>\n<h3>第六步：except 匹配与传播<\/h3>\n<p>解释器在当前 try 块的 except 子句中按顺序匹配异常类型；类型匹配则执行 except 块，异常处理完毕，程序继续向后。类型不匹配，异常离开当前块，沿调用栈向上一层查找；一直未被捕获，程序终止并打印 traceback。<\/p>\n<h3>第七步：else 正常路径<\/h3>\n<p>try 块全部语句无异常时，跳过所有 except，进入 else 块执行依赖成功结果的语句。把可能出错的代码放 try，把依赖成功结果的代码放 else，路径区分更清楚。<\/p>\n<h3>第八步：JSON 序列化与重建<\/h3>\n<p><code>json.dump(数据, 文件对象)<\/code> 把列表、字典转成 JSON 文本写入文件；<code>json.load(文件对象)<\/code> 读取文本，按 JSON 结构重建出对应的 Python 列表或字典。重建出的是新对象，与写入前的内存对象不是同一身份。<\/p>\n<h2>算例一：逐行读取并生成各行列表<\/h2>\n<p>给定 <code>pi_digits.txt<\/code> 内容为三行圆周率数字。代码：<\/p>\n<pre class=\"lang-python\"><code>with open(&#x27;pi_digits.txt&#x27;) as f_obj:\n    lines = f_obj.readlines()\n\nfor line in lines:\n    print(line.rstrip())<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n<code>open<\/code> 以默认读取模式打开文件，返回文件对象；<code>f_obj<\/code> 绑定它。\n<\/li><li>\n<code>readlines()<\/code> 把各行读入列表，每个元素带行末换行符。\n<\/li><li>\nwith 块结束，文件自动关闭；<code>lines<\/code> 列表在块外仍可使用。\n<\/li><li>\n循环中 <code>line.rstrip()<\/code> 去掉行末空白与换行，逐行打印。\n<\/li><li>\n核对：文件对象在块外已关闭，但读入内存的 <code>lines<\/code> 数据保留；未读入内存的磁盘内容不会因关闭而丢失。\n<\/ol>\n<h2>算例二：除零异常的 try-except-else 路径<\/h2>\n<p>给定：<\/p>\n<pre class=\"lang-python\"><code>try:\n    answer = int(first) / int(second)\nexcept ZeroDivisionError:\n    print(&quot;You can&#x27;t divide by zero!&quot;)\nelse:\n    print(answer)<\/code><\/pre>\n<p>两组输入对照：<\/p>\n<ol><li>\n<code>first=&#x27;5&#x27;<\/code>、<code>second=&#x27;2&#x27;<\/code>：try 内转换成功，<code>5 / 2 = 2.5<\/code>，无异常；跳过 except，进入 else 打印 <code>2.5<\/code>。\n<\/li><li>\n<code>second=&#x27;0&#x27;<\/code>：除法创建 <code>ZeroDivisionError<\/code>；except 类型匹配，打印除零提示；else 不执行。\n<\/li><li>\n若 except 写的是 <code>FileNotFoundError<\/code>，类型不匹配，<code>ZeroDivisionError<\/code> 继续向上传播，未被捕获则程序终止。\n<\/li><li>\n核对：except 只接住声明的类型；转换 <code>int(&#x27;abc&#x27;)<\/code> 产生的 ValueError 不在该 except 覆盖范围内。\n<\/ol>\n<h2>算例三：文件不存在的异常处理<\/h2>\n<p>给定统计文本词数的程序：<\/p>\n<pre class=\"lang-python\"><code>filename = &#x27;alice.txt&#x27;\ntry:\n    with open(filename) as f_obj:\n        contents = f_obj.read()\nexcept FileNotFoundError:\n    print(&quot;Sorry, the file &quot; + filename + &quot; does not exist.&quot;)\nelse:\n    words = contents.split()\n    print(len(words))<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n文件存在：with 打开成功，<code>contents<\/code> 读入全文；else 中按空白拆分统计词数。\n<\/li><li>\n文件不存在：<code>open<\/code> 创建 <code>FileNotFoundError<\/code>；except 匹配，打印友好提示；else 不执行，程序不崩溃。\n<\/li><li>\n对照：不写 try，文件缺失时异常向上传播，traceback 直接暴露出错位置与类型。\n<\/ol>\n<h2>算例四：JSON 保存与读回往返<\/h2>\n<p>写入：<\/p>\n<pre class=\"lang-python\"><code>import json\nnumbers = [2, 3, 5, 7, 11, 13]\nwith open(&#x27;numbers.json&#x27;, &#x27;w&#x27;) as f_obj:\n    json.dump(numbers, f_obj)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n<code>numbers<\/code> 绑到列表对象；<code>&#x27;w&#x27;<\/code> 模式打开文件。\n<\/li><li>\n<code>json.dump<\/code> 把列表序列化为 JSON 文本 <code>[2, 3, 5, 7, 11, 13]<\/code> 写入文件；with 块结束关闭文件。\n<\/li><li>\n内存中的 <code>numbers<\/code> 与文件文本是两份存在形式；文件里是纯文本。\n<\/ol>\n<p>读回：<\/p>\n<pre class=\"lang-python\"><code>with open(&#x27;numbers.json&#x27;) as f_obj:\n    numbers = json.load(f_obj)\nprint(numbers)<\/code><\/pre>\n<p>推演：<code>json.load<\/code> 读取文本，重建出新列表对象并赋给 <code>numbers<\/code>；输出 <code>[2, 3, 5, 7, 11, 13]<\/code>。重建列表与写入前的列表值相同，但不是同一个对象；修改读回列表不影响磁盘文件，需要留存改动要再次 dump。<\/p>\n<h2>算例五：未捕获异常的传播路径<\/h2>\n<p>给定调用链：<code>main()<\/code> 调用 <code>read_config()<\/code>，后者 <code>open<\/code> 一个不存在的文件，两处都没有 try。<\/p>\n<p>推演：<\/p>\n<ol><li>\n<code>read_config()<\/code> 内 <code>open<\/code> 失败，创建 <code>FileNotFoundError<\/code>。\n<\/li><li>\n该函数内无匹配 except，异常离开函数帧，回到调用处 <code>main()<\/code>。\n<\/li><li>\n<code>main()<\/code> 内也无 except，异常继续向上传播到程序顶层；未被捕获，程序终止，traceback 依次列出 <code>read_config<\/code> 与 <code>main<\/code> 的调用位置。\n<\/li><li>\n若在 <code>main()<\/code> 一层写了匹配 except，异常在该层被接住，<code>read_config<\/code> 帧已结束，except 中只能拿到异常信息，不能回到出错语句重试。\n<\/ol>\n<h2>算例六：写入多行与附加模式对照<\/h2>\n<p>写入程序：<\/p>\n<pre class=\"lang-python\"><code>with open(&#x27;guest_book.txt&#x27;, &#x27;w&#x27;) as f_obj:\n    f_obj.write(&quot;Eric\\n&quot;)\n    f_obj.write(&quot;Lin\\n&quot;)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n<code>&#x27;w&#x27;<\/code> 模式打开，若文件已有内容先被清空；两次 <code>write<\/code> 依次写入两行，<code>\\n<\/code> 负责换行。\n<\/li><li>\n文件内容为两行文本；<code>write<\/code> 不会自动追加换行符，多行内容必须在字符串中显式带上。\n<\/ol>\n<p>再运行附加程序：<\/p>\n<pre class=\"lang-python\"><code>with open(&#x27;guest_book.txt&#x27;, &#x27;a&#x27;) as f_obj:\n    f_obj.write(&quot;Sarah\\n&quot;)<\/code><\/pre>\n<p>推演：<\/p>\n<ol><li>\n<code>&#x27;a&#x27;<\/code> 模式不清空原内容，写入位置在文件末尾。\n<\/li><li>\n原有两行保留，<code>Sarah<\/code> 作为第三行追加；文件内容变为三行。\n<\/li><li>\n对照：若这段附加代码误用 <code>&#x27;w&#x27;<\/code> 打开，前两行被清空，文件只剩 <code>Sarah<\/code> 一行。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：用写入模式覆盖已有文件。<\/strong> 想追加记录却以 <code>&#x27;w&#x27;<\/code> 打开，原内容先被清空。保留旧内容应使用 <code>&#x27;a&#x27;<\/code>。<\/p>\n<p><strong>案例 2：宽泛 except 吞掉错误。<\/strong> <code>except:<\/code> 接住所有异常，代码拼写错误、键盘中断也被藏起，调试时无从定位。按具体异常类型书写 except。<\/p>\n<p><strong>案例 3：不用 with 导致文件未关闭。<\/strong> 手动打开后读写中途抛异常，关闭语句跳过；长期运行占用文件句柄。用 with 保证退出时关闭。<\/p>\n<p><strong>案例 4：except 类型写错接不住目标异常。<\/strong> 除零错误写了文件类型 except，异常继续传播崩溃。复盘：核对异常类型名与报错提示一致。<\/p>\n<p><strong>案例 5：把读回对象当成原对象身份。<\/strong> json.load 重建的是新对象，别名关系不复存在；需要保留内存对象与文件的同步，改动后要重新写回。<\/p>\n<p><strong>案例 6：写入多行漏写换行符。<\/strong> 连续 <code>write<\/code> 不带 <code>\\n<\/code>，所有内容连成一行；读回时无法按行拆分。多行写入在每条字符串末尾加换行符。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n问：<code>&#x27;w&#x27;<\/code>、<code>&#x27;a&#x27;<\/code>、<code>&#x27;r&#x27;<\/code> 各做什么？答：覆盖写、末尾追加、只读。\n<\/li><li>\n问：with 块退出时文件由谁关闭？答：with 自动关闭，异常跳出也会关闭。\n<\/li><li>\n问：异常在哪一步创建？答：try 块语句运行出错时，解释器创建对应类型异常对象。\n<\/li><li>\n问：except 类型不匹配会怎样？答：异常继续沿调用栈向上传播，直到被捕获或终止程序。\n<\/li><li>\n问：else 块什么时候执行？答：try 块无异常时执行。\n<\/li><li>\n问：json 文件里存的是对象还是文本？答：JSON 文本；load 读回时重建 Python 对象。\n<\/li><li>\n问：为什么不写宽泛 except？答：会吞掉其他类型错误，掩盖真正问题。\n<\/li><li>\n问：write 会自动换行吗？答：不会，多行内容要在字符串里显式写 <code>\\n<\/code>。\n<\/li><li>\n问：附加模式与写入模式对原文件的处理差别？答：<code>&#x27;a&#x27;<\/code> 保留原内容末尾续写，<code>&#x27;w&#x27;<\/code> 先清空再写。\n<\/li><li>\n问：with 块内读取得到的列表，块结束后还能用吗？答：能用，数据已读入内存；关闭的是文件对象，不是内存中的数据。\n<\/ul>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出用 with 逐行读取 <code>guests.txt<\/code>、去掉每行换行后存入列表的代码；说明文件在哪一步关闭。\n<\/li><li>\n除数为零的程序中，except 写成 <code>FileNotFoundError<\/code> 会发生什么？异常沿什么路径走？\n<\/li><li>\n<code>&#x27;w&#x27;<\/code> 与 <code>&#x27;a&#x27;<\/code> 打开同一已有文件，写入后原内容分别怎样？\n<\/li><li>\njson.dump 保存字典后，json.load 读回的字典与原字典是同一对象吗？改动读回字典会自动写回文件吗？\n<\/li><li>\n把一段可能抛 ValueError 的输入转换代码放进 try，except 应写哪个类型？else 里适合放什么语句？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "文件读写、异常处理与 JSON 持久化"}, "c10": {"html": "<div class=\"source-badge\">📖 出处：
