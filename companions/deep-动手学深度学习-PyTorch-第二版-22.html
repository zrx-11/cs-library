<\/div><h1>批量归一化：训练/推理统计量差异与对优化景观的改变<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3 章（原书 7.5 批量规范化，PDF 第 286–289 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>深层网络训练中，每层输入分布随上游参数更新而漂移：某层激活均值偏移、方差变大或变小，下游层要持续适应这种漂移，训练变慢且对初始化敏感。批量归一化（BN）在每个小批量上把激活重新拉回均值 0、单位方差，再经可学习参数拉伸偏移，让各层输入尺度稳定下来。它在训练与推理两种模式下统计量来源不同，这是实践中最容易踩错的位置。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>批量统计量<\/strong>：小批量 <span class=\"katex-inline\">B<\/span> 上样本均值 <span class=\"katex-inline\">\\hat\\mu_B=\\frac1{|B|}\\sum_{x\\in B}x<\/span>，方差 <span class=\"katex-inline\">\\hat\\sigma_B^2=\\frac1{|B|}\\sum_{x\\in B}(x-\\hat\\mu_B)^2+\\epsilon<\/span>，<span class=\"katex-inline\">\\epsilon&gt;0<\/span> 防止除零（原书公式 7.5.2，PDF 第 287 页）。<\/p>\n<p><strong>批量归一化变换<\/strong>：<\/p>\n<div class=\"katex-block\">\\mathrm{BN}(x)=\\gamma\\odot\\frac{x-\\hat\\mu_B}{\\hat\\sigma_B}+\\beta.<\/div>\n<p><span class=\"katex-inline\">\\gamma<\/span> 是拉伸系数、<span class=\"katex-inline\">\\beta<\/span> 是偏移系数，形状与激活特征维度对齐，随模型参数一起学习；初始 <span class=\"katex-inline\">\\gamma=1<\/span>、<span class=\"katex-inline\">\\beta=0<\/span>（原书公式 7.5.1，PDF 第 287 页）。<\/p>\n<p><strong>移动平均<\/strong>：训练时维护全局均值与方差的移动平均，供推理使用；推理模式不再算批量统计，直接用移动平均标准化（原书 7.5.2 节，PDF 第 288 页）。<\/p>\n<p><strong>统计维度<\/strong>：全连接层在特征维上统计；卷积层在批量维与空间维上统计，每个输出通道一套 <span class=\"katex-inline\">\\gamma,\\beta<\/span>（原书 7.5.2 节，PDF 第 288 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>标准化步骤：先减均值 <span class=\"katex-inline\">\\hat x=x-\\hat\\mu_B<\/span>，再除标准差 <span class=\"katex-inline\">(x-\\hat\\mu_B)/\\sqrt{\\hat\\sigma_B^2+\\epsilon}<\/span>。标准化后批量内均值为 0、方差为 1；<span class=\"katex-inline\">\\gamma<\/span> 把尺度调回需要的大小，<span class=\"katex-inline\">\\beta<\/span> 平移到需要的位置。若直接固定标准化不设可学习参数，激活尺度被钉死，网络失去调整空间；<span class=\"katex-inline\">\\gamma,\\beta<\/span> 保留了这层自由度。<\/p>\n<p>移动平均更新：<span class=\"katex-inline\">\\mathrm{moving\\_mean}\\leftarrow\\alpha\\,\\mathrm{moving\\_mean}+(1-\\alpha)\\hat\\mu_B<\/span>，方差按同一式更新。推理时模型可能逐样本输入，批量统计无意义，因此切到移动平均得到确定输出。原书实现按 <code>torch.is_grad_enabled()<\/code> 区分模式：训练分支算批量统计并更新移动平均，预测分支直接用移动平均（PDF 第 288–289 页）。<\/p>\n<p>噪声估计的作用：批量均值方差是带噪声的估计，原书指出优化中的噪声源常带来更快训练与轻度正则效果；BN 在中等批量（50–100 量级）下表现最稳（PDF 第 287 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：批量大小足够大；全连接层或卷积层激活后、激活函数前插入 BN（原书公式 7.5.3，PDF 第 288 页）。\n<\/li><li>\n失败案例一：批量大小为 1。减去均值后每个隐藏单元为 0，学不到任何东西；BN 对批量大小比无 BN 网络更敏感（PDF 第 287 页）。\n<\/li><li>\n失败案例二：推理阶段忘记切 eval 模式。测试样本仍按当前批量算均值方差，输出随批量波动；正确做法是推理用训练累积的移动平均。\n<\/li><li>\n失败案例三：把 BN 统计维度写反。卷积层若按通道逐个样本统计，会破坏跨空间聚合；正确口径是通道内跨批量与空间位置统计。\n<\/li><li>\n边界：BN 的理论解释仍有争议，原书 7.5.6 节专门列出争议（PDF 第 292 页前后）；它缓解训练漂移，不替代合理初始化与架构设计。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>BN vs 层归一化（LN）<\/strong>：BN 跨批量/空间统计通道分布；LN 在单个样本内跨特征统计，不依赖批量大小，适合 RNN 与小批量场景。Transformer 编码器用 LN（原书 10.7.1 节，PDF 第 432 页）。\n<\/li><li>\n<strong>BN vs 权重衰减<\/strong>：BN 校准激活分布、稳定优化；权重衰减压缩参数范数、抑制过拟合。作用环节不同，可叠加。\n<\/li><li>\n<strong>训练统计 vs 推理统计<\/strong>：训练统计随批量波动并累积移动平均；推理统计固定为移动平均。两者行为差异不是实现冗余，而是设计必需。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c07 的初始化解决起点尺度，BN 解决训练中途的分布漂移；概念 c06 的 dropout 提供另一条正则路径。后继：概念 c13 的 Transformer 子层用层归一化配合残差连接；概念 c14 的优化器在 BN 稳定后的激活上更新参数。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（批量归一化：训练/推理统计量差异与对优化景观的改变）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：BN 统计量计算、标准化链路与双模式算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要讲清 BN 的机制与踩坑点，先往回追四层前提：<\/p>\n<ol><li>\n深层训练存在分布漂移。上游参数更新后，每层输入的均值方差随之改变，下游持续追这套漂移，这是 BN 登场的问题背景。\n<\/li><li>\n标准化先把批量内激活拉到标准尺度。减均值、除标准差两步先写清，<span class=\"katex-inline\">\\gamma,\\beta<\/span> 再在标准尺度上恢复自由度。\n<\/li><li>\n训练统计不能直接留给推理。训练用当前批量估计，同时累积移动平均；推理批量可能只有单样本，必须切到移动平均。\n<\/li><li>\n统计维度随层类型变化。全连接按特征维统计，卷积按通道跨批量与空间位置统计，维度写错会破坏聚合口径。\n<\/ol>\n<p>依赖链方向：激活分布漂移 → 批量均值方差估计 → 标准化加可学习拉伸偏移 → 移动平均累积 → 推理模式切换统计来源。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：批量均值与方差<\/h3>\n<p>批量 <span class=\"katex-inline\">B<\/span>，激活张量 <span class=\"katex-inline\">X<\/span>。对每个被统计特征维：<\/p>\n<div class=\"katex-block\">\\hat\\mu_B=\\frac1{|B|}\\sum_{x\\in B}x,\\qquad \\hat\\sigma_B^2=\\frac1{|B|}\\sum_{x\\in B}(x-\\hat\\mu_B)^2+\\epsilon.<\/div>\n<p><span class=\"katex-inline\">\\epsilon<\/span> 取 <span class=\"katex-inline\">10^{-5}<\/span> 量级，防止经验方差为 0 时除零。样本方差用 <span class=\"katex-inline\">1/|B|<\/span> 而非无偏估计，BN 实践中两者差异可忽略。<\/p>\n<h3>第二步：标准化与拉伸偏移<\/h3>\n<p>标准化 <span class=\"katex-inline\">\\hat x=(x-\\hat\\mu_B)/\\sqrt{\\hat\\sigma_B^2+\\epsilon}<\/span>。批量内 <span class=\"katex-inline\">\\hat x<\/span> 均值 0、方差 1：<\/p>\n<div class=\"katex-block\">E[\\hat x]=0,\\quad \\mathrm{Var}(\\hat x)=\\frac{\\mathrm{Var}(x)}{\\hat\\sigma_B^2}=1.<\/div>\n<p>最终输出 <span class=\"katex-inline\">y=\\gamma\\odot\\hat x+\\beta<\/span>。<span class=\"katex-inline\">\\gamma<\/span> 学习恢复所需尺度，<span class=\"katex-inline\">\\beta<\/span> 学习所需偏移；初值 <span class=\"katex-inline\">\\gamma=1,\\beta=0<\/span>，起步等价于纯标准化。<\/p>\n<h3>第三步：移动平均更新<\/h3>\n<p>训练每步更新全局估计：<\/p>\n<div class=\"katex-block\">m\\leftarrow\\alpha\\,m+(1-\\alpha)\\hat\\mu_B,\\qquad v\\leftarrow\\alpha\\,v+(1-\\alpha)\\hat\\sigma_B^2.<\/div>\n<p><span class=\"katex-inline\">\\alpha<\/span> 是动量系数（原书实现中参数名 momentum）。移动平均把多步批量统计汇总成稳定的全局估计，不随当前批量抖动。<\/p>\n<h3>第四步：两种模式分支<\/h3>\n<ul><li>\n训练模式（梯度开启）：算当前批量均值方差，标准化后更新移动平均。\n<\/li><li>\n预测模式（梯度关闭）：跳过批量统计，直接用 <span class=\"katex-inline\">m,v<\/span> 标准化：<span class=\"katex-inline\">\\hat x=(x-m)/\\sqrt{v+\\epsilon}<\/span>。\n<p>原书 <code>batch_norm<\/code> 函数按 <code>torch.is_grad_enabled()<\/code> 分叉（PDF 第 288–289 页）。<\/p>\n<\/ul>\n<h3>第五步：统计维度<\/h3>\n<p>全连接层输入 <span class=\"katex-inline\">(n,d)<\/span>：均值方差沿样本维 dim=0 统计，得形状 <span class=\"katex-inline\">(1,d)<\/span>。卷积层输入 <span class=\"katex-inline\">(n,c,h,w)<\/span>：沿批量维与空间维 dim=(0,2,3) 统计，得形状 <span class=\"katex-inline\">(1,c,1,1)<\/span>，每个通道一套 <span class=\"katex-inline\">\\gamma,\\beta<\/span>。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：小批量标准化手算<\/h3>\n<p>批量 4 个样本、2 个特征，激活<\/p>\n<div class=\"katex-block\">X=\\begin{pmatrix}1&-1\\\\2&0\\\\3&1\\\\4&2\\end{pmatrix}.<\/div>\n<p>第一列均值 <span class=\"katex-inline\">(1+2+3+4)/4=2.5<\/span>，方差 <span class=\"katex-inline\">((1-2.5)^2+(2-2.5)^2+(3-2.5)^2+(4-2.5)^2)/4=(2.25+0.25+0.25+2.25)/4=1.25<\/span>，<span class=\"katex-inline\">\\sigma\\approx1.118<\/span>。 第二列均值 <span class=\"katex-inline\">(-1+0+1+2)/4=0.5<\/span>，方差 <span class=\"katex-inline\">((-1.5)^2+(-0.5)^2+(0.5)^2+(1.5)^2)/4=(2.25+0.25+0.25+2.25)/4=1.25<\/span>，<span class=\"katex-inline\">\\sigma\\approx1.118<\/span>。 标准化第一样本：<span class=\"katex-inline\">(1-2.5)/1.118\\approx-1.342<\/span>，<span class=\"katex-inline\">(-1-0.5)/1.118\\approx-1.342<\/span>。 若 <span class=\"katex-inline\">\\gamma=1,\\beta=0<\/span>，输出即标准化结果；学习后 <span class=\"katex-inline\">\\gamma,\\beta<\/span> 可把该维尺度与位置调到网络需要的值。<\/p>\n<h3>算例 2：卷积 BN 的统计形状<\/h3>\n<p>卷积输出 <span class=\"katex-inline\">X\\in\\mathbb R^{8\\times16\\times32\\times32}<\/span>（批量 8、16 通道、32×32 空间）。mean 沿 dim=(0,2,3) 求，keepdim 后形状 <span class=\"katex-inline\">(1,16,1,1)<\/span>；var 同形。<span class=\"katex-inline\">\\gamma,\\beta<\/span> 形状 <span class=\"katex-inline\">(1,16,1,1)<\/span>，广播到整个张量。同一通道内所有批量样本、所有空间位置共享一套统计与系数。<\/p>\n<h3>代码片段：BN 双模式分支（原书 7.5.3 节，PDF 第 289 页）<\/h3>\n<pre class=\"lang-python\"><code>def batch_norm(X, gamma, beta, moving_mean, moving_var, eps, momentum):\n    if not torch.is_grad_enabled():\n        X_hat = (X - moving_mean) / torch.sqrt(moving_var + eps)\n    else:\n        if len(X.shape) == 2:\n            mean = X.mean(dim=0)\n            var = ((X - mean) ** 2).mean(dim=0)\n        else:\n            mean = X.mean(dim=(0, 2, 3), keepdim=True)\n            var = ((X - mean) ** 2).mean(dim=(0, 2, 3), keepdim=True)\n        X_hat = (X - mean) / torch.sqrt(var + eps)\n        moving_mean = momentum * moving_mean + (1 - momentum) * mean\n        moving_var = momentum * moving_var + (1 - momentum) * var\n    Y = gamma * X_hat + beta\n    return Y, moving_mean.data, moving_var.data<\/code><\/pre>\n<h2>延伸推演<\/h2>\n<h3>BN 怎样改变优化景观<\/h3>\n<p>各层输入被拉回标准尺度后，损失面在不同特征方向上的曲率差距缩小，梯度更新不必追赶漂移的分布；训练对初始化、学习率的容忍度提高。原书把批量统计的噪声估计与轻度正则效应联系起来，噪声源有时带来更快收敛（PDF 第 287 页）。<\/p>\n<h3>BN 与 dropout 的叠加顺序<\/h3>\n<p>dropout 扰动隐表示，BN 校准激活分布；实践中 BN 常放在仿射之后、激活之前，dropout 放在激活之后。两者都带轻度正则效应，叠加时注意批量大小不能过小，否则 BN 统计不稳。<\/p>\n<h3>BN 的争议在哪<\/h3>\n<p>原书 7.5.6 节列出争议：BN 有效但理论解释不统一，有工作把它与贝叶斯先验联系，也有分析质疑其正则归因（PDF 第 292 页前后）。工程上 BN 是深度卷积网络标配，但不能把所有训练改善都归于归一化单一因素。<\/p>\n<h3>对抗性追问：BN 能替代初始化吗<\/h3>\n<p>不能。BN 校准训练过程中的激活分布，初始化决定权重起点与对称性打破；起点全 0 或尺度极端时，BN 无法把坏起点修成好模型。两者配套，不互相替代。<\/p>\n<h3>对抗性追问：小批量场景为什么改用 LN<\/h3>\n<p>BN 统计依赖批量样本数，批量 1 直接失效；LN 在单样本内跨特征归一化，批量大小不影响统计口径，因此 RNN、小批量微调常用 LN。选择由统计口径对批量的依赖程度决定。<\/p>\n<h2>补充推演与第二算例<\/h2>\n<h3>第二算例：批量 1 与小批量的统计失效<\/h3>\n<p>批量 1 时，单样本激活减自身均值为 0，标准化输出全 0，<span class=\"katex-inline\">\\gamma<\/span> 拉伸后仍是 0，该层不携带判别信息。批量 2 时均值方差只由两个点估计，统计量抖动大，批量归一化结果随批量构成明显波动；批量增大后统计量趋稳。RNN 与小批量微调因此常用 LN 绕过批量依赖。<\/p>\n<h3>BN 梯度的回传路径<\/h3>\n<p>输出 <span class=\"katex-inline\">y=\\gamma\\hat x+\\beta<\/span>。<span class=\"katex-inline\">\\nabla_\\gamma\\hat x<\/span> 按被归一化位置聚合，<span class=\"katex-inline\">\\nabla_\\beta=1<\/span> 按位置求和；对输入的梯度还要穿过标准化除法反传。训练时批量统计量本身由当前批量样本算出，上游梯度对统计量的依赖在 BN 实现内部处理；推理用移动平均，回传路径关闭。<\/p>\n<h3>移动平均偏差的累积<\/h3>\n<p>移动平均系数 <span class=\"katex-inline\">\\alpha<\/span> 偏小，平均跟上批量统计快但抖动大；<span class=\"katex-inline\">\\alpha<\/span> 偏大，平均稳定但滞后于分布漂移。训练中后期分布趋于稳定，移动平均才适合作为推理统计量；训练初期就切推理模式，移动平均还未积累到可靠水平。<\/p>\n<h3>对抗性追问：更换批量大小后 BN 权重能否直接沿用<\/h3>\n<p>批量大小改变，批量统计分布随之改变；沿用原 <span class=\"katex-inline\">\\gamma,\\beta<\/span> 时激活尺度可能偏离校准区间。批量变化显著的场景，常需要重训若干步让移动平均与激活分布重新对齐。<\/p>\n<h3>第二轮补充<\/h3>\n<h3>第二算例：<span class=\"katex-inline\">\\gamma,\\beta<\/span> 学习方向<\/h3>\n<p>标准化后 <span class=\"katex-inline\">\\hat x<\/span> 均值 0 方差 1；若该层理想输出尺度为 2、偏移为 0.5，<span class=\"katex-inline\">\\gamma<\/span> 学到约 2、<span class=\"katex-inline\">\\beta<\/span> 学到约 0.5。<span class=\"katex-inline\">\\gamma=1,\\beta=0<\/span> 起步等价纯标准化；训练中 <span class=\"katex-inline\">\\gamma,\\beta<\/span> 的梯度由上游损失回传，统计量本身不参与这两个参数的梯度更新。<\/p>\n<h3>对抗性追问：BN 放在激活前还是激活后<\/h3>\n<p>常见做法是仿射 → BN → 激活：先把仿射输出校准到标准尺度，再进非线性；放在激活之后会校准已经被掰弯的分布，效果次序不同。实现顺序要与原书骨架一致，调换位置会改变每一步的输入分布。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nBN 变换公式中 <span class=\"katex-inline\">\\gamma,\\beta<\/span> 各起什么作用？（<span class=\"katex-inline\">\\gamma<\/span> 拉伸尺度，<span class=\"katex-inline\">\\beta<\/span> 平移偏移，随参数学习。）\n<\/li><li>\n训练与推理分别用哪套统计量？（训练用当前批量统计并更新移动平均；推理用累积的移动平均。）\n<\/li><li>\n卷积 BN 的统计维度是什么？（沿批量维与空间维 dim=(0,2,3)，每通道一套系数。）\n<\/li><li>\n批量为 1 时 BN 为什么失效？（减均值后单元全为 0，标准化结果无信息。）\n<\/li><li>\nBN 与 LN 的统计口径差别是什么？（BN 跨批量/空间统计通道分布；LN 单样本内跨特征统计，不依赖批量大小。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "批量归一化：训练/推理统计量差异与对优化景观的改变"}, "c11": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.330<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">自动微分的反向模式：计算图、链式法则与梯度反向累积<\/a><\/span><\/div><h1>RNN 与通过时间反向传播：梯度沿时间步的连乘与长依赖问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章（原书 8.4 循环神经网络、8.7 通过时间反向传播，PDF 第 330、347–350 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>序列预测要根据当前词元和之前所有词元推断下一个词元，普通前馈网络每个输入独立、不保留历史表示。循环神经网络（RNN）用隐状态沿时间步传递信息：每步读入当前输入，更新隐状态，再产出输出。训练时损失要在整条序列上汇总，反向传播沿时间链把梯度回传到每个时间步的共享权重上，这就是通过时间反向传播（BPTT）。长序列上梯度沿时间连乘，直接带来消失或爆炸，理解这条链是看懂门控 RNN 的前提。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>隐状态递归<\/strong>：<span class=\"katex-inline\">h_t=f(x_t,h_{t-1},w_h)<\/span>，<span class=\"katex-inline\">o_t=g(h_t,w_o)<\/span>。<span class=\"katex-inline\">x_t<\/span> 第 <span class=\"katex-inline\">t<\/span> 步输入，<span class=\"katex-inline\">h_t<\/span> 隐状态，<span class=\"katex-inline\">o_t<\/span> 输出；<span class=\"katex-inline\">w_h<\/span> 隐藏层权重，<span class=\"katex-inline\">w_o<\/span> 输出层权重（原书公式 8.7.1，PDF 第 348 页）。 <strong>序列损失<\/strong>：<span class=\"katex-inline\">L=\\frac1T\\sum_{t=1}^T l(y_t,o_t)<\/span>，各步损失平均。 <strong>独热编码<\/strong>：输入词元先转词表长度的 0/1 向量，再进入循环层（原书 8.5.1 节，PDF 第 335 页前后）。 <strong>困惑度<\/strong>：按平均负对数似然取指数的语言模型评价指标，值越小预测越确定（原书 8.4.4 节，PDF 第 333 页前后）。 <strong>梯度裁剪<\/strong>：梯度范数超过阈值时按比例缩回阈值内，防止单步更新爆炸（原书 8.5.5 节，PDF 第 339 页前后）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>损失对 <span class=\"katex-inline\">w_h<\/span> 的梯度按时间步求和：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_h}=\\frac1T\\sum_{t=1}^T\\frac{\\partial l(y_t,o_t)}{\\partial o_t}\\frac{\\partial g(h_t,w_o)}{\\partial h_t}\\frac{\\partial h_t}{\\partial w_h}.<\/div>\n<p>关键项 <span class=\"katex-inline\">\\partial h_t/\\partial w_h<\/span> 满足递归：<span class=\"katex-inline\">h_t<\/span> 直接依赖 <span class=\"katex-inline\">w_h<\/span>，又经 <span class=\"katex-inline\">h_{t-1}<\/span> 间接依赖 <span class=\"katex-inline\">w_h<\/span>，故<\/p>\n<div class=\"katex-block\">\\frac{\\partial h_t}{\\partial w_h}=\\frac{\\partial f(x_t,h_{t-1},w_h)}{\\partial w_h}+\\frac{\\partial f(x_t,h_{t-1},w_h)}{\\partial h_{t-1}}\\frac{\\partial h_{t-1}}{\\partial w_h}.<\/div>\n<p>展开到起点，<span class=\"katex-inline\">\\partial h_t/\\partial w_h<\/span> 含 <span class=\"katex-inline\">\\prod_{j=i+1}^{t}\\partial f/\\partial h_{j-1}<\/span> 形式的连乘项（原书公式 8.7.5，PDF 第 348 页）。各步雅可比特征值长期小于 1 时，乘积随时间步指数衰减；长期大于 1 时指数放大。前者梯度消失，浅层/早期步收不到有效更新；后者梯度爆炸，单步更新破坏收敛。<\/p>\n<p>对照前馈网络：前馈梯度沿层连乘，RNN 梯度沿时间步连乘；共享权重 <span class=\"katex-inline\">w_h<\/span> 在每个时间步被复用，梯度要把各步贡献累加回同一组参数。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：序列长度可控，训练用截断 BPTT 按子序列回传；梯度裁剪作为爆炸时的止损手段。\n<\/li><li>\n失败案例一：长序列整段 BPTT。时间链过长，连乘后梯度消失或爆炸，早期词元对当前预测的影响传不回来。\n<\/li><li>\n失败案例二：只靠梯度裁剪处理长依赖。裁剪压住单步范数，不改变连乘结构；长程记忆问题仍需门控结构（概念 c12）。\n<\/li><li>\n失败案例三：隐状态跨序列未重置。不同样本序列之间沿用旧隐状态，历史串到新样本，训练与评估都失真。\n<\/li><li>\n边界：普通 RNN 假设隐状态能压缩全部历史；实际长程依赖下信息沿链衰减，这是结构局限而非训练技巧能完全弥补的。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>BPTT vs 普通反向传播<\/strong>：普通反向传播沿网络层回传；BPTT 把循环展开成时间步链再回传，共享权重在各步的梯度累加。数学上都是链式法则，图结构不同。\n<\/li><li>\n<strong>RNN vs 前馈网络<\/strong>：前馈无状态、输入独立；RNN 有隐状态、步间依赖，参数在时间步复用。\n<\/li><li>\n<strong>梯度消失 vs 梯度爆炸<\/strong>：消失是连乘因子过小、早期步不更新；爆炸是因子过大、更新发散。RNN 两者都可能出现，裁剪只针对爆炸。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c02 的反向模式是 BPTT 的求导引擎；概念 c07 的深层连乘分析在时间维度复现。后继：概念 c12 的 LSTM/GRU 门控针对长程记忆与梯度连乘问题设计；概念 c13 的注意力跳出循环链，直接按相关性聚合历史。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（RNN 与通过时间反向传播：梯度沿时间步的连乘与长依赖问题）<\/summary><div class=\"depth-body\"><h1>c11 深度推导：BPTT 梯度递归展开、连乘量级算例与长依赖分析<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要讲清 RNN 训练为什么困难，先往回追四层前提：<\/p>\n<ol><li>\n序列模型必须保留历史表示。前馈网络输入独立，无法参考过去词元，这是隐状态登场的动机。\n<\/li><li>\n隐状态按时间步递归更新。先写清 <span class=\"katex-inline\">h_t<\/span> 对 <span class=\"katex-inline\">x_t<\/span>、<span class=\"katex-inline\">h_{t-1}<\/span>、<span class=\"katex-inline\">w_h<\/span> 的依赖，再谈反向求导。\n<\/li><li>\n序列损失是各步损失平均。梯度对共享权重的回传要把各时间步贡献汇总到同一组参数上。\n<\/li><li>\n梯度沿时间链连乘。递归式展开后得到雅可比连乘项，因子大小决定消失还是爆炸。\n<\/ol>\n<p>依赖链方向：隐状态递归 → 序列损失汇总 → 链式法则回传 → <span class=\"katex-inline\">\\partial h_t/\\partial w_h<\/span> 递归式 → 展开为雅可比连乘 → 长程梯度衰减/放大。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：前向递归<\/h3>\n<div class=\"katex-block\">h_t=f(x_t,h_{t-1},w_h),\\qquad o_t=g(h_t,w_o).<\/div>\n<p>初始 <span class=\"katex-inline\">h_0<\/span> 通常为零向量。每个时间步读入 <span class=\"katex-inline\">x_t<\/span>，更新 <span class=\"katex-inline\">h_t<\/span>，产出 <span class=\"katex-inline\">o_t<\/span>；<span class=\"katex-inline\">w_h<\/span> 在所有时间步复用。<\/p>\n<h3>第二步：序列损失<\/h3>\n<div class=\"katex-block\">L=\\frac1T\\sum_{t=1}^T l(y_t,o_t).<\/div>\n<p>训练目标是最小化平均损失；语言模型场景下 <span class=\"katex-inline\">l<\/span> 是交叉熵，困惑度 <span class=\"katex-inline\">\\exp(L)<\/span> 由平均负对数似然取指数得到。<\/p>\n<h3>第三步：损失对 <span class=\"katex-inline\">w_h<\/span> 的梯度<\/h3>\n<p>按链式法则：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_h}=\\frac1T\\sum_{t=1}^T\\frac{\\partial l(y_t,o_t)}{\\partial o_t}\\frac{\\partial g(h_t,w_o)}{\\partial h_t}\\frac{\\partial h_t}{\\partial w_h}.<\/div>\n<p>前两项在输出侧，计算直接；第三项是循环带来的难点。<\/p>\n<h3>第四步：<span class=\"katex-inline\">\\partial h_t/\\partial w_h<\/span> 的递归<\/h3>\n<p><span class=\"katex-inline\">h_t<\/span> 两条路径依赖 <span class=\"katex-inline\">w_h<\/span>：直接经 <span class=\"katex-inline\">f<\/span> 的权重项，间接经 <span class=\"katex-inline\">h_{t-1}<\/span>。<\/p>\n<div class=\"katex-block\">\\frac{\\partial h_t}{\\partial w_h}=\\frac{\\partial f}{\\partial w_h}+\\frac{\\partial f}{\\partial h_{t-1}}\\frac{\\partial h_{t-1}}{\\partial w_h}.<\/div>\n<p>令 <span class=\"katex-inline\">a_t=\\partial h_t/\\partial w_h<\/span>，<span class=\"katex-inline\">b_t=\\partial f/\\partial w_h<\/span>，<span class=\"katex-inline\">c_t=\\partial f/\\partial h_{t-1}<\/span>，递归 <span class=\"katex-inline\">a_t=b_t+c_t a_{t-1}<\/span>，<span class=\"katex-inline\">a_0=0<\/span>。展开：<\/p>\n<div class=\"katex-block\">a_t=b_t+\\sum_{i=1}^{t-1}\\left(\\prod_{j=i+1}^{t}c_j\\right)b_i.<\/div>\n<p>每段贡献 <span class=\"katex-inline\">b_i<\/span> 前面挂一串 <span class=\"katex-inline\">c_j<\/span> 连乘；<span class=\"katex-inline\">c_j=\\partial f/\\partial h_{j-1}<\/span> 是隐状态雅可比。<\/p>\n<h3>第五步：连乘的两种失控方向<\/h3>\n<p>若 <span class=\"katex-inline\">c_j<\/span> 谱半径长期小于 1，<span class=\"katex-inline\">\\prod c_j<\/span> 随 <span class=\"katex-inline\">t-i<\/span> 指数衰减，早期步的 <span class=\"katex-inline\">b_i<\/span> 贡献传到当前步时趋近 0，梯度消失；若谱半径长期大于 1，乘积指数放大，梯度爆炸。前馈网络是层间雅可比连乘，RNN 换成时间步雅可比连乘，结构同类。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：两个时间步的小网络<\/h3>\n<p>设 <span class=\"katex-inline\">h_t=W_h h_{t-1}+x_t<\/span>，标量简化，<span class=\"katex-inline\">W_h=0.8<\/span>，<span class=\"katex-inline\">x_1=1,x_2=1<\/span>。 前向：<span class=\"katex-inline\">h_0=0<\/span>，<span class=\"katex-inline\">h_1=0.8\\times0+1=1<\/span>，<span class=\"katex-inline\">h_2=0.8\\times1+1=1.8<\/span>。 损失 <span class=\"katex-inline\">L=\\frac12[(h_1-y_1)^2+(h_2-y_2)^2]<\/span>，取 <span class=\"katex-inline\">y_1=1,y_2=2<\/span>。 对 <span class=\"katex-inline\">W_h<\/span> 求导：<span class=\"katex-inline\">\\partial h_1/\\partial W_h=h_0=0<\/span>；<span class=\"katex-inline\">\\partial h_2/\\partial W_h=h_1+W_h\\partial h_1/\\partial W_h=1+0=1<\/span>。 <span class=\"katex-inline\">\\partial L/\\partial W_h=(h_1-y_1)h_0+(h_2-y_2)\\cdot1=(1-1)\\cdot0+(1.8-2)\\cdot1=-0.2<\/span>。 第二步隐状态对权重的依赖只走当前步；三步以上才出现长连乘项。<\/p>\n<h3>算例 2：雅可比因子连乘的量级<\/h3>\n<p>标量因子 <span class=\"katex-inline\">c<\/span>，步差 <span class=\"katex-inline\">T-i<\/span>：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>步差 <span class=\"katex-inline\">T-i<\/span><\/th><th><span class=\"katex-inline\">c=0.9<\/span><\/th><th><span class=\"katex-inline\">c=1.1<\/span><\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>0.900<\/td><td>1.100<\/td><\/tr><tr><td>5<\/td><td>0.590<\/td><td>1.611<\/td><\/tr><tr><td>10<\/td><td>0.349<\/td><td>2.594<\/td><\/tr><tr><td>20<\/td><td>0.122<\/td><td>6.727<\/td><\/tr><tr><td>50<\/td><td>0.00515<\/td><td>117.39<\/td><\/tr><\/tbody><\/table><\/div>\n<p><span class=\"katex-inline\">0.9^{50}\\approx5.2\\times10^{-3}<\/span>，早期信号基本传不回；<span class=\"katex-inline\">1.1^{50}\\approx117<\/span>，梯度被放大两个量级。深链上两种失控只在两头出现，中间稳定区很窄。<\/p>\n<h3>算例 3：梯度裁剪的作用<\/h3>\n<p>设梯度范数 <span class=\"katex-inline\">\\|\\nabla g\\|=12<\/span>，裁剪阈值 <span class=\"katex-inline\">\\theta=5<\/span>。裁剪后梯度 <span class=\"katex-inline\">\\nabla g\\leftarrow\\theta\\,\\nabla g/\\|\\nabla g\\|=5\\,\\nabla g/12<\/span>，方向不变、范数压到 5。裁剪防止单步更新越过损失面，但 <span class=\"katex-inline\">c_j<\/span> 连乘结构没有改变，长程梯度问题依旧。<\/p>\n<h2>延伸推演<\/h2>\n<h3>截断 BPTT 怎么切时间链<\/h3>\n<p>实践中把长序列切成子序列，每段内做 BPTT，隐状态跨段传递但不跨段回传梯度。截断降低单次反向计算图长度，缓解连乘累积；代价是段间依赖学不深。窗口长度是偏差与计算量的权衡。<\/p>\n<h3>独热编码与输入维度<\/h3>\n<p>词元先转词表长度独热向量，再乘输入权重矩阵。独热向量稀疏，多数分量为 0；循环层主体计算在隐状态递归部分，输入只在每步加项进入。<\/p>\n<h3>困惑度与训练动态<\/h3>\n<p>困惑度 <span class=\"katex-inline\">\\exp(\\frac1T\\sum_t-\\log p(y_t|x_t))<\/span>：完美预测困惑度 1，均匀随机预测困惑度等于词表大小。训练中困惑度持续下降表示模型对序列预测越来越确定；它是评估指标，不参与梯度计算。<\/p>\n<h3>对抗性追问：RNN 能不能靠调学习率解决长依赖<\/h3>\n<p>不能。学习率只缩放更新步长，连乘导致的消失/爆炸是梯度量级问题；消失时调大学习率会放大残存噪声，爆炸时调小也压不住结构性放大。长程记忆要改门控结构。<\/p>\n<h3>对抗性追问：隐状态为什么必须跨样本重置<\/h3>\n<p>同一批量内不同序列共享批处理计算，但隐状态不能沿序列串用；上一样本尾部隐状态带入下一样本，等于泄露历史。评估与训练每个新样本序列都从零初始化隐状态。<\/p>\n<h2>补充推演与第二算例<\/h2>\n<h3>第二算例：三步 RNN 的递归梯度<\/h3>\n<p>标量递归 <span class=\"katex-inline\">h_t=W_h h_{t-1}+x_t<\/span>，<span class=\"katex-inline\">W_h=0.8<\/span>，<span class=\"katex-inline\">x_1=x_2=x_3=1<\/span>。 前向：<span class=\"katex-inline\">h_0=0<\/span>，<span class=\"katex-inline\">h_1=1<\/span>，<span class=\"katex-inline\">h_2=1.8<\/span>，<span class=\"katex-inline\">h_3=2.44<\/span>。 梯度递归 <span class=\"katex-inline\">a_t=\\partial h_t/\\partial W_h=h_{t-1}+W_h a_{t-1}<\/span>，<span class=\"katex-inline\">a_0=0<\/span>：<span class=\"katex-inline\">a_1=h_0=0<\/span>；<span class=\"katex-inline\">a_2=h_1+0.8a_1=1<\/span>；<span class=\"katex-inline\">a_3=h_2+0.8a_2=1.8+0.8=2.6<\/span>。<span class=\"katex-inline\">a_3<\/span> 里既有当前步 <span class=\"katex-inline\">h_2<\/span>，也有经 <span class=\"katex-inline\">0.8<\/span> 连乘传回的历史项；步差越大，历史项前面挂的 <span class=\"katex-inline\">0.8<\/span> 幂次越高。<\/p>\n<h3>共享权重的梯度汇总<\/h3>\n<p><span class=\"katex-inline\">w_h<\/span> 在所有时间步复用，损失对它的梯度是各步梯度之和。同一组参数既影响当前步更新，也受历史步回传影响；展开的计算图在时间维重复堆叠，参数叶节点只存一份梯度，多路贡献累加到同一位置。<\/p>\n<h3>展开图的内存位置<\/h3>\n<p>BPTT 把 <span class=\"katex-inline\">T<\/span> 个时间步的隐状态与中间量全部留在内存里供反向遍历；序列越长，前向保存的激活越多，显存占用随 <span class=\"katex-inline\">T<\/span> 线性增长。截断 BPTT 切段后，单段图长度受限，跨段只传隐状态不传梯度，是内存与长程依赖之间的折中。<\/p>\n<h3>代码片段：RNN 批量形状<\/h3>\n<pre class=\"lang-python\"><code>import torch\nfrom torch import nn\nrnn = nn.RNN(16, 32, batch_first=True)\nx = torch.randn(4, 10, 16)   # 批量 4、序列 10、特征 16\nout, h = rnn(x)\nprint(out.shape, h.shape)    # torch.Size([4, 10, 32]) torch.Size([1, 4, 32])<\/code><\/pre>\n<h3>对抗性追问：双向 RNN 的梯度路径<\/h3>\n<p>双向 RNN 正向层从左到右、反向层从右到左，两条链各自独立 BPTT；输出拼接后再算损失。双向结构利用整句上下文，但推理流式生成时反向层看不到未来，不能直接套用。<\/p>\n<h3>第二轮补充<\/h3>\n<h3>第二算例：步长因子为 1 附近的临界情形<\/h3>\n<p>标量 <span class=\"katex-inline\">c=1<\/span>：<span class=\"katex-inline\">c^{20}=1<\/span>，长程梯度不衰减也不放大；<span class=\"katex-inline\">c=0.99<\/span>，<span class=\"katex-inline\">0.99^{20}\\approx0.818<\/span>，<span class=\"katex-inline\">0.99^{50}\\approx0.605<\/span>，缓慢衰减；<span class=\"katex-inline\">c=1.01<\/span>，<span class=\"katex-inline\">1.01^{50}\\approx1.645<\/span>，缓慢放大。临界带很窄，实际 RNN 权重训练中容易偏向一侧，这是长依赖训练困难的定量背景。<\/p>\n<h3>困惑度与损失的换算<\/h3>\n<p>平均负对数似然 <span class=\"katex-inline\">L=\\frac1T\\sum_t-\\log p(y_t|x_t)<\/span>，困惑度 <span class=\"katex-inline\">\\mathrm{PPL}=\\exp(L)<\/span>。<span class=\"katex-inline\">L=2.3026<\/span> 对应 PPL 约 10；均匀预测词表大小 <span class=\"katex-inline\">V<\/span> 时 <span class=\"katex-inline\">L=\\log V<\/span>，PPL=<span class=\"katex-inline\">V<\/span>。困惑度跨词表比较时要注意词表规模口径。<\/p>\n<h3>对抗性追问：截断 BPTT 会不会丢掉长程依赖<\/h3>\n<p>会切段内回传。跨段隐状态保留信息，但段间梯度不回传，超长依赖的权重关系学不深；窗口长度是长程建模能力与计算内存的权衡。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nRNN 两个递归方程怎么写？（<span class=\"katex-inline\">h_t=f(x_t,h_{t-1},w_h)<\/span>，<span class=\"katex-inline\">o_t=g(h_t,w_o)<\/span>。）\n<\/li><li>\n<span class=\"katex-inline\">\\partial h_t/\\partial w_h<\/span> 递归式与展开式是什么？（<span class=\"katex-inline\">a_t=b_t+c_t a_{t-1}<\/span>；<span class=\"katex-inline\">a_t=b_t+\\sum_{i&lt;t}(\\prod_{j=i+1}^t c_j)b_i<\/span>。）\n<\/li><li>\n梯度消失与爆炸在连乘项上各对应什么？（因子谱半径长期小于 1 消失；长期大于 1 爆炸。）\n<\/li><li>\n梯度裁剪改变什么、不改变什么？（压单步更新范数、保方向；不改连乘结构与长程梯度问题。）\n<\/li><li>\n截断 BPTT 的权衡是什么？（切段降低单次回传长度、缓解连乘；段间依赖学不深。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "RNN 与通过时间反向传播：梯度沿时间步的连乘与长依赖问题"}, "c12": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.353<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">RNN 与通过时间反向传播：梯度沿时间步的连乘与长依赖问题<\/a><\/span><\/div><h1>LSTM/GRU 的门控：各门解决哪个问题与门值推演<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章（原书 9.1 门控循环单元、9.2 长短期记忆网络，PDF 第 353–355、361–362 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>普通 RNN 的隐状态沿时间链递归，长程依赖下梯度连乘消失，无关词元会冲刷已有记忆，遇到逻辑中断也没有通道重置状态。门控循环单元（GRU）与长短期记忆网络（LSTM）在递归中加入可学习的门：门输出在 <span class=\"katex-inline\">(0,1)<\/span> 区间，按凸组合比例控制旧状态保留多少、新状态写入多少、记忆对外暴露多少。门让模型学会跳过无关观测、在需要时重置状态、把重要信息跨时间步保存下来。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>GRU 两门<\/strong>：重置门 <span class=\"katex-inline\">R_t=\\sigma(X_tW_{xr}+H_{t-1}W_{hr}+b_r)<\/span>，更新门 <span class=\"katex-inline\">Z_t=\\sigma(X_tW_{xz}+H_{t-1}W_{hz}+b_z)<\/span>（原书公式 9.1.1，PDF 第 355 页）。 <strong>GRU 候选隐状态<\/strong>：<span class=\"katex-inline\">\\tilde H_t=\\tanh(X_tW_{xh}+(R_t\\odot H_{t-1})W_{hh}+b_h)<\/span>。重置门控制构造候选时参考多少过去状态（原书公式 9.1.2，PDF 第 355 页）。 <strong>GRU 隐状态更新<\/strong>：<span class=\"katex-inline\">H_t=Z_t\\odot H_{t-1}+(1-Z_t)\\odot\\tilde H_t<\/span>。更新门控制新状态里旧状态副本与候选状态的比例。<\/p>\n<p><strong>LSTM 三门一记忆元<\/strong>：输入门 <span class=\"katex-inline\">I_t<\/span>、遗忘门 <span class=\"katex-inline\">F_t<\/span>、输出门 <span class=\"katex-inline\">O_t<\/span>，均由 sigmoid 得到；候选记忆元 <span class=\"katex-inline\">\\tilde C_t=\\tanh(X_tW_{xc}+H_{t-1}W_{hc}+b_c)<\/span>（原书公式 9.2.1–9.2.2，PDF 第 361 页）。 <strong>记忆元更新<\/strong>：<span class=\"katex-inline\">C_t=F_t\\odot C_{t-1}+I_t\\odot\\tilde C_t<\/span>（原书公式 9.2.3，PDF 第 362 页）。 <strong>LSTM 隐状态<\/strong>：<span class=\"katex-inline\">H_t=O_t\\odot\\tanh(C_t)<\/span>。记忆元 <span class=\"katex-inline\">C_t<\/span> 专门保存跨步记忆，隐状态 <span class=\"katex-inline\">H_t<\/span> 是对外暴露的表示。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>门的数学角色：sigmoid 把门值压到 <span class=\"katex-inline\">(0,1)<\/span>，按元素乘实现凸组合。遗忘门 <span class=\"katex-inline\">F_t=1<\/span> 时旧记忆全部保留，<span class=\"katex-inline\">F_t=0<\/span> 时旧记忆清空；输入门 <span class=\"katex-inline\">I_t<\/span> 控制候选记忆写入比例。原书 9.2.3 节指出，遗忘门恒 1、输入门恒 0 时，<span class=\"katex-inline\">C_{t-1}<\/span> 随时间保存传递，这一设计针对梯度消失与长距离依赖（PDF 第 362 页）。<\/p>\n<p>GRU 极端门值推演：<span class=\"katex-inline\">R_t\\approx1<\/span> 时候选状态参考完整旧隐状态，退化为普通 RNN；<span class=\"katex-inline\">R_t\\approx0<\/span> 时候选只由当前输入算出，旧状态被重置。<span class=\"katex-inline\">Z_t\\approx1<\/span> 时新状态基本沿用旧隐状态；<span class=\"katex-inline\">Z_t\\approx0<\/span> 时新状态主要取候选。<\/p>\n<p>LSTM 极端门值推演：<span class=\"katex-inline\">F_t=1,I_t=0<\/span> 记忆原样传递；<span class=\"katex-inline\">F_t=0,I_t=1<\/span> 记忆被候选完全替换；<span class=\"katex-inline\">O_t=0<\/span> 记忆元内容不暴露到隐状态；<span class=\"katex-inline\">O_t=1<\/span> 记忆元经 tanh 后全部输出。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：序列存在长短不一的依赖关系；门控参数与循环权重一起通过 BPTT 训练。\n<\/li><li>\n失败案例一：门值长期饱和。sigmoid 两端梯度趋零，对应门失去调节能力；训练初期门值分布要避免全部贴边。\n<\/li><li>\n失败案例二：把门控当梯度消失的万能解。门控提供选择性通路，缓解长程记忆，但超长序列上仍可能出现梯度问题，裁剪与截断 BPTT 仍需配套。\n<\/li><li>\n失败案例三：混淆记忆元与隐状态。LSTM 的 <span class=\"katex-inline\">C_t<\/span> 是内部记忆，<span class=\"katex-inline\">H_t<\/span> 是对外表示；跨步保存靠 <span class=\"katex-inline\">C_t<\/span>，输出给下游的是 <span class=\"katex-inline\">H_t<\/span>。\n<\/li><li>\n边界：门控增加参数与计算量；短序列、简单模式上门控结构可能 over-engineering。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>LSTM vs GRU<\/strong>：LSTM 三门加独立记忆元，记忆保存与对外输出分开；GRU 两门合并更新路径，结构更简、参数更少，实践中效果常接近。GRU 重置门对应候选构造，更新门对应状态融合；LSTM 遗忘门对应记忆保留，输入门对应写入，输出门对应暴露。\n<\/li><li>\n<strong>门控 vs 残差连接<\/strong>：门控按学习到的比例选择信息通路；残差连接提供恒等捷径。两者都缓解深层/长链梯度衰减，但作用对象不同：门控在时间维，残差在层间。\n<\/li><li>\n<strong>候选状态 vs 最终状态<\/strong>：候选 <span class=\"katex-inline\">\\tilde H_t/\\tilde C_t<\/span> 是本步新算的备选表示，最终状态还要经门与旧状态凸组合；不要把候选当成更新后的隐状态。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c11 的 BPTT 连乘分析是门控设计的问题来源；概念 c02 的反向求导沿各门与记忆元回传。后继：概念 c13 的注意力不再依赖门控递归，直接按相关性聚合历史；概念 c14 的优化器在门控参数上更新。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（LSTM/GRU 的门控：各门解决哪个问题与门值推演）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：GRU/LSTM 门方程逐项拆解与门值极端推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要讲清门控机制，先往回追四层前提：<\/p>\n<ol><li>\n普通 RNN 的长程缺陷先定位。梯度沿时间连乘消失，无关观测冲刷记忆，逻辑中断无法重置；这是各门设计对应的具体问题。\n<\/li><li>\n门是 <span class=\"katex-inline\">(0,1)<\/span> 区间的可学习权重向量。sigmoid 输出按元素乘，实现旧状态与候选状态的凸组合。\n<\/li><li>\nGRU 把重置与更新拆成两门。重置门作用在候选构造，更新门作用在状态融合，两步职责分开。\n<\/li><li>\nLSTM 把记忆保存与对外输出分开。记忆元 <span class=\"katex-inline\">C_t<\/span> 跨步传递，隐状态 <span class=\"katex-inline\">H_t<\/span> 经输出门暴露，三门各司其职。\n<\/ol>\n<p>依赖链方向：普通 RNN 长程问题 → sigmoid 门与凸组合 → GRU 两门方程 → LSTM 三门一记忆元 → 门值极端情形推演。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：GRU 重置门与更新门<\/h3>\n<div class=\"katex-block\">R_t=\\sigma(X_tW_{xr}+H_{t-1}W_{hr}+b_r),\\quad Z_t=\\sigma(X_tW_{xz}+H_{t-1}W_{hz}+b_z).<\/div>\n<p><span class=\"katex-inline\">X_t\\in\\mathbb R^{n\\times d}<\/span>，<span class=\"katex-inline\">H_{t-1}\\in\\mathbb R^{n\\times h}<\/span>，门形状 <span class=\"katex-inline\">(n,h)<\/span>。<span class=\"katex-inline\">\\sigma<\/span> 把仿射结果压到 <span class=\"katex-inline\">(0,1)<\/span>；求和时偏置按广播加到每行（原书公式 9.1.1，PDF 第 355 页）。<\/p>\n<h3>第二步：GRU 候选隐状态<\/h3>\n<div class=\"katex-block\">\\tilde H_t=\\tanh(X_tW_{xh}+(R_t\\odot H_{t-1})W_{hh}+b_h).<\/div>\n<p><span class=\"katex-inline\">R_t\\odot H_{t-1}<\/span> 先按元素筛掉旧状态中被重置的部分，再进循环权重。<span class=\"katex-inline\">R_t\\approx1<\/span> 时保留完整旧状态，行为接近普通 RNN；<span class=\"katex-inline\">R_t\\approx0<\/span> 时候选只由当前输入算出。<\/p>\n<h3>第三步：GRU 状态融合<\/h3>\n<div class=\"katex-block\">H_t=Z_t\\odot H_{t-1}+(1-Z_t)\\odot\\tilde H_t.<\/div>\n<p><span class=\"katex-inline\">Z_t<\/span> 是旧状态保留比例，<span class=\"katex-inline\">1-Z_t<\/span> 是候选采用比例，两者逐位互补。<span class=\"katex-inline\">Z_t\\approx1<\/span> 状态沿用旧值；<span class=\"katex-inline\">Z_t\\approx0<\/span> 状态换成候选。<\/p>\n<h3>第四步：LSTM 三门与候选记忆元<\/h3>\n<div class=\"katex-block\">I_t=\\sigma(X_tW_{xi}+H_{t-1}W_{hi}+b_i),\\quad F_t=\\sigma(X_tW_{xf}+H_{t-1}W_{hf}+b_f),\\quad O_t=\\sigma(X_tW_{xo}+H_{t-1}W_{ho}+b_o).<\/div>\n<div class=\"katex-block\">\\tilde C_t=\\tanh(X_tW_{xc}+H_{t-1}W_{hc}+b_c).<\/div>\n<p><span class=\"katex-inline\">I_t<\/span> 输入门控制写入，<span class=\"katex-inline\">F_t<\/span> 遗忘门控制保留，<span class=\"katex-inline\">O_t<\/span> 输出门控制暴露（原书公式 9.2.1–9.2.2，PDF 第 361 页）。<\/p>\n<h3>第五步：记忆元与隐状态<\/h3>\n<div class=\"katex-block\">C_t=F_t\\odot C_{t-1}+I_t\\odot\\tilde C_t,\\quad H_t=O_t\\odot\\tanh(C_t).<\/div>\n<p><span class=\"katex-inline\">C_t<\/span> 是跨步记忆通道；<span class=\"katex-inline\">H_t<\/span> 是交给下游的表示。遗忘门与输入门决定记忆更新，输出门决定记忆元内容能否进入隐状态。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：LSTM 单单元门值四象限<\/h3>\n<p>设 <span class=\"katex-inline\">C_{t-1}=0.8<\/span>，<span class=\"katex-inline\">\\tilde C_t=-0.4<\/span>。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><span class=\"katex-inline\">F_t<\/span><\/th><th><span class=\"katex-inline\">I_t<\/span><\/th><th><span class=\"katex-inline\">C_t=F_tC_{t-1}+I_t\\tilde C_t<\/span><\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>0<\/td><td>0.8<\/td><td>旧记忆原样保留<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>−0.4<\/td><td>记忆被候选替换<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>0.8−0.4=0.4<\/td><td>保留旧值并写入新候选<\/td><\/tr><tr><td>0<\/td><td>0<\/td><td>0<\/td><td>记忆清空<\/td><\/tr><\/tbody><\/table><\/div>\n<p>再取 <span class=\"katex-inline\">O_t=0.3<\/span>：<span class=\"katex-inline\">\\tanh(0.4)\\approx0.380<\/span>，<span class=\"katex-inline\">H_t=0.3\\times0.380\\approx0.114<\/span>；<span class=\"katex-inline\">O_t=1<\/span> 时 <span class=\"katex-inline\">H_t\\approx0.380<\/span>。输出门把记忆元内容按比例放出。<\/p>\n<h3>算例 2：GRU 门值推演<\/h3>\n<p>设 <span class=\"katex-inline\">H_{t-1}=0.6<\/span>，<span class=\"katex-inline\">\\tilde H_t=-0.2<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">Z_t=1<\/span>：<span class=\"katex-inline\">H_t=1\\times0.6+0\\times(-0.2)=0.6<\/span>，沿用旧状态。\n<\/li><li>\n<span class=\"katex-inline\">Z_t=0<\/span>：<span class=\"katex-inline\">H_t=0\\times0.6+1\\times(-0.2)=-0.2<\/span>，采用候选。\n<\/li><li>\n<span class=\"katex-inline\">Z_t=0.5<\/span>：<span class=\"katex-inline\">H_t=0.5\\times0.6+0.5\\times(-0.2)=0.2<\/span>，新旧各半。\n<p>重置门 <span class=\"katex-inline\">R_t<\/span> 作用在 <span class=\"katex-inline\">\\tilde H_t<\/span> 内部：<span class=\"katex-inline\">R_t=0<\/span> 时候选不含旧状态信息；<span class=\"katex-inline\">R_t=1<\/span> 时候选参考完整旧隐状态。<\/p>\n<\/ul>\n<h3>算例 3：门控梯度通路<\/h3>\n<p>记忆元更新 <span class=\"katex-inline\">C_t=F_t\\odot C_{t-1}+I_t\\odot\\tilde C_t<\/span>。反向时 <span class=\"katex-inline\">\\partial C_t/\\partial C_{t-1}=F_t<\/span>：遗忘门接近 1，旧记忆的梯度通路保持畅通；<span class=\"katex-inline\">F_t<\/span> 接近 0，通路被切断。这正是门控缓解梯度消失的直接位置——不是消除连乘，而是给记忆元留一条可选择保留的直通路。<\/p>\n<h2>延伸推演<\/h2>\n<h3>门值初始化的偏置选择<\/h3>\n<p>实践中遗忘门偏置常初始化为 1（或较大正值），训练初期倾向保留旧记忆，避免早期就把历史清空；输入门偏置配合候选尺度调整。门偏置初始化影响训练初期的记忆保留倾向，属于稳定性配套。<\/p>\n<h3>双向与深层 RNN 的位置<\/h3>\n<p>单向 RNN 只看历史；双向 RNN 从两个方向各跑一层再拼接，适合整句已给定的编码任务。深层 RNN 把循环层堆叠，上层在下层隐状态上再递归。门控单元是这些结构的基本循环块。<\/p>\n<h3>门控与注意力的分工<\/h3>\n<p>门控在递归中选择性保存/遗忘信息，状态仍沿时间步传递；注意力直接查询历史所有位置，按相关度加权聚合，不依赖逐步记忆。两者解决序列建模的不同环节，现代模型常组合使用。<\/p>\n<h3>对抗性追问：门控能不能让长程梯度完全不消失<\/h3>\n<p>不能。门控给记忆元提供选择性直通路，缓解消失；超长链上其他路径仍有连乘，梯度裁剪、截断 BPTT 仍是配套手段。把门控当万能解会忽视序列长度带来的根本限制。<\/p>\n<h3>对抗性追问：GRU 一定比 LSTM 快且好<\/h3>\n<p>GRU 参数更少、计算更简，短中期任务表现常接近 LSTM；效果依赖任务与调参，不存在 GRU 全面占优的结论。选择要看序列长度、数据量与算力预算。<\/p>\n<h2>补充推演与第二算例<\/h2>\n<h3>第二算例：LSTM 三步记忆保持推演<\/h3>\n<p>单单元，<span class=\"katex-inline\">C_0=0.5<\/span>，候选 <span class=\"katex-inline\">\\tilde C_t=0.2<\/span>。遗忘门 <span class=\"katex-inline\">F=1<\/span>，输入门 <span class=\"katex-inline\">I=0.5<\/span>：<span class=\"katex-inline\">C_1=1\\times0.5+0.5\\times0.2=0.6<\/span>；第二步 <span class=\"katex-inline\">F=1,I=0.5<\/span>，<span class=\"katex-inline\">C_2=0.6+0.5\\times0.2=0.7<\/span>；第三步遗忘门降到 <span class=\"katex-inline\">F=0<\/span>，<span class=\"katex-inline\">I=1<\/span>，<span class=\"katex-inline\">C_3=0+1\\times0.2=0.2<\/span>，旧记忆被整体替换。记忆元轨迹由两门逐位决定：<span class=\"katex-inline\">F<\/span> 控制保留比例，<span class=\"katex-inline\">I<\/span> 控制写入强度，两步组合决定 <span class=\"katex-inline\">C_t<\/span> 走向。<\/p>\n<h3>门控参数共享<\/h3>\n<p>门权重矩阵在时间步之间复用，与普通 RNN 一致；门值由当前输入与上一步隐状态共同算出。每个门是一套仿射加 sigmoid，参数量随门数增长：LSTM 三门一候选共四组仿射，GRU 两门一候选共三组。<\/p>\n<h3>门值饱和区的梯度<\/h3>\n<p>sigmoid 门值接近 0 或 1 时，门导数 <span class=\"katex-inline\">\\sigma(1-\\sigma)<\/span> 趋近 0，门参数梯度被压平；长期卡在饱和区的门很难调整开闭倾向。训练初期遗忘门偏置取正值，是让门先停在中段、留出梯度空间的配套选择。<\/p>\n<h3>GRU 与 LSTM 的单元对应<\/h3>\n<p>GRU 用更新门融合新旧状态、重置门约束候选构造；LSTM 把记忆保存与对外输出拆成记忆元加输出门。两者都用门控选择信息通路，LSTM 多一条独立记忆通道，GRU 参数更少。任务上两者表现接近，选择依赖序列长度与调参预算。<\/p>\n<h3>对抗性追问：门控能消除所有长程梯度问题<\/h3>\n<p>不能。门控给记忆元留可选直通路，缓解消失；超长链上其他路径仍有连乘，饱和门还会压住局部梯度。截断 BPTT、梯度裁剪仍是配套手段，门控不是长程建模的完整答案。<\/p>\n<h3>第二轮补充<\/h3>\n<h3>第二算例：GRU 更新门凸组合数值<\/h3>\n<p><span class=\"katex-inline\">H_{t-1}=0.6<\/span>，<span class=\"katex-inline\">\\tilde H_t=-0.2<\/span>，<span class=\"katex-inline\">Z_t=0.2<\/span>：<span class=\"katex-inline\">H_t=0.2\\times0.6+0.8\\times(-0.2)=0.12-0.16=-0.04<\/span>；<span class=\"katex-inline\">Z_t=0.8<\/span>：<span class=\"katex-inline\">H_t=0.48-0.04=0.44<\/span>。更新门偏向保留旧状态时，候选被采用比例小；偏向新候选时，旧状态占比小。<\/p>\n<h3>门控与残差连接的结构对照<\/h3>\n<p>LSTM 记忆元 <span class=\"katex-inline\">C_t=F_t\\odot C_{t-1}+\\cdots<\/span> 与残差捷径 <span class=\"katex-inline\">x+\\mathrm{sublayer}(x)<\/span> 同构：保留通路由门控系数或加法连接控制，梯度可沿保留通路直达早期步或浅层。门控是带可学习开关的捷径，残差是固定恒等捷径。<\/p>\n<h3>门控单元的参数量对照<\/h3>\n<p>单层普通 RNN：输入到隐状态一组权重；GRU 两门一候选三组；LSTM 三门一候选四组。门越多可学习开关越多，表达能力增强的同时参数量与过拟合风险上升。<\/p>\n<h3>对抗性追问：门控状态能否跨样本沿用<\/h3>\n<p>不能。门控记忆元与隐状态都随序列开始初始化；跨样本沿用等于把上一样本的记忆带入下一样本，造成信息泄漏。评估与新样本序列同样从零状态起步。<\/p>\n<h3>第三轮补充<\/h3>\n<h3>第二算例：遗忘门关闭时的记忆轨迹<\/h3>\n<p><span class=\"katex-inline\">C_{t-1}=0.7<\/span>，<span class=\"katex-inline\">F=0<\/span>，<span class=\"katex-inline\">I=0<\/span>，<span class=\"katex-inline\">\\tilde C=0.3<\/span>：<span class=\"katex-inline\">C_t=0\\times0.7+0\\times0.3=0<\/span>，记忆清空；<span class=\"katex-inline\">F=0,I=1<\/span>：<span class=\"katex-inline\">C_t=\\tilde C<\/span>，整体替换；<span class=\"katex-inline\">F=1,I=1<\/span>：<span class=\"katex-inline\">C_t=C_{t-1}+\\tilde C<\/span>，记忆叠加。两门组合覆盖保留、替换、清空、叠加四种记忆操作。<\/p>\n<h3>延伸：门控单元在深层堆叠中的位置<\/h3>\n<p>门控循环块沿时间递归；多层堆叠时上层接收下层隐状态再递归。门控缓解时间维长依赖，层间深度问题仍要靠残差、归一化配套；不要把门控当成解决所有深度问题的结构。<\/p>\n<h3>对抗性追问：门值能不能取硬 0/1 训练<\/h3>\n<p>硬门不可导，无法走梯度下降；sigmoid 软化出 <span class=\"katex-inline\">(0,1)<\/span> 连续值，让门参数可学习。训练后期门值可能接近饱和，但训练通路仍依赖软化导数。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nGRU 两门各作用在哪一步？（重置门作用候选构造；更新门作用状态融合。）\n<\/li><li>\nLSTM 记忆元更新公式是什么？（<span class=\"katex-inline\">C_t=F_t\\odot C_{t-1}+I_t\\odot\\tilde C_t<\/span>。）\n<\/li><li>\n遗忘门接近 1 时梯度通路怎样？（<span class=\"katex-inline\">\\partial C_t/\\partial C_{t-1}=F_t<\/span>，通路保持畅通；接近 0 则切断。）\n<\/li><li>\nLSTM 的 <span class=\"katex-inline\">C_t<\/span> 与 <span class=\"katex-inline\">H_t<\/span> 分工是什么？（<span class=\"katex-inline\">C_t<\/span> 内部跨步记忆；<span class=\"katex-inline\">H_t<\/span> 经输出门暴露给下游。）\n<\/li><li>\n门控缓解梯度消失的位置在哪？（记忆元保留通路由遗忘门控制，给旧记忆梯度留出可选直通路。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "LSTM/GRU 的门控：各门解决哪个问题与门值推演"}, "c13": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.411<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c12\">LSTM/GRU 的门控：各门解决哪个问题与门值推演<\/a><\/span><\/div><h1>注意力与 Transformer：缩放点积注意力、方差缩放与多头/自注意力<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章（原书 10.3 注意力评分函数、10.3.3 缩放点积注意力、10.7 Transformer，PDF 第 411、415、431–432 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>编码器—解码器模型把整句压缩进一个隐状态，长句信息在压缩中丢失；解码时该关注源句哪些位置，靠递归状态传递不够直接。注意力机制让输出端按查询与各键的相关度，对历史值做加权聚合：相关度高的位置权重高，聚合结果保留对应信息。Transformer 完全建立在自注意力之上，没有卷积层或循环层，靠多头自注意力加位置编码捕捉序列关系。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>查询、键、值<\/strong>：<span class=\"katex-inline\">Q\\in\\mathbb R^{n\\times d}<\/span> 查询矩阵，<span class=\"katex-inline\">K\\in\\mathbb R^{m\\times d}<\/span> 键矩阵，<span class=\"katex-inline\">V\\in\\mathbb R^{m\\times v}<\/span> 值矩阵。查询提出需求，键做匹配，值是被聚合的内容。 <strong>评分函数<\/strong>：衡量查询与键的匹配程度；加性注意力用单隐层前网络，点积注意力用向量内积（原书 10.3 节，PDF 第 411 页）。 <strong>缩放点积注意力<\/strong>：<\/p>\n<div class=\"katex-block\">\\mathrm{softmax}\\left(\\frac{QK^\\top}{\\sqrt d}\\right)V\\in\\mathbb R^{n\\times v}.<\/div>\n<p>评分 <span class=\"katex-inline\">a(q,k)=q^\\top k/\\sqrt d<\/span>（原书公式 10.3.4–10.3.5，PDF 第 415 页）。 <strong>多头注意力<\/strong>：把 <span class=\"katex-inline\">Q,K,V<\/span> 切到多个子空间分别做注意力，再拼接投影（原书 10.5 节，PDF 第 422 页前后）。 <strong>自注意力<\/strong>：查询、键、值来自同一组输入；序列内任意两个位置直接交互，最大路径长度为 1。 <strong>位置编码<\/strong>：自注意力本身不含顺序信息，输入嵌入加位置编码注入绝对或相对位置（原书 10.7.1 节，PDF 第 431 页）。 <strong>Transformer 子层<\/strong>：编码器每层含多头自注意力子层加位置前馈网络，子层采用残差连接与层规范化（原书 10.7.1 节，PDF 第 432 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>点积方差推导：设 <span class=\"katex-inline\">q_i,k_i<\/span> 独立、零均值、单位方差。<span class=\"katex-inline\">a=q^\\top k=\\sum_{i=1}^d q_i k_i<\/span>，<span class=\"katex-inline\">E[q_i k_i]=E[q_i]E[k_i]=0<\/span>，<span class=\"katex-inline\">\\mathrm{Var}(q_i k_i)=E[q_i^2]E[k_i^2]=1<\/span>。各分量独立，方差可加 <span class=\"katex-inline\">\\mathrm{Var}(a)=d<\/span>。维度越大点积波动随 <span class=\"katex-inline\">\\sqrt d<\/span> 增大，softmax 进入饱和区、梯度趋零；除以 <span class=\"katex-inline\">\\sqrt d<\/span> 后方差回到 1：<span class=\"katex-inline\">\\mathrm{Var}(q^\\top k/\\sqrt d)=d/d=1<\/span>。<\/p>\n<p>形状流转：<span class=\"katex-inline\">QK^\\top<\/span> 形状 <span class=\"katex-inline\">(n,m)<\/span>，逐行 softmax 得注意力权重，再乘 <span class=\"katex-inline\">V<\/span> 得 <span class=\"katex-inline\">(n,v)<\/span>。批量维度保留，注意力在批量内独立计算。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：查询与键维度相同才能做点积；加性注意力可处理不同长度。掩码 softmax 用于屏蔽无效位置（原书 10.3.1 节掩蔽 softmax，PDF 第 412 页前后）。\n<\/li><li>\n失败案例一：不做缩放。<span class=\"katex-inline\">d<\/span> 大时点积方差为 <span class=\"katex-inline\">d<\/span>，softmax 输出接近 one-hot，训练前期更新缓慢，不同维度规模不可比。\n<\/li><li>\n失败案例二：去掉位置编码。自注意力对输入排列不变，打乱词序不改变注意力结果；不加位置信息模型分不清顺序。\n<\/li><li>\n失败案例三：长序列硬套自注意力。注意力复杂度关于序列长度二次方，序列很长时计算与内存成本失控。\n<\/li><li>\n边界：注意力聚合所有位置加权信息，不替代局部特征提取；视觉、语音任务中常与卷积配合。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>注意力 vs 全连接<\/strong>：全连接按固定权重跨位置连接；注意力权重由查询—键匹配动态算出，每个查询的聚合组合随输入变化。\n<\/li><li>\n<strong>自注意力 vs CNN/RNN<\/strong>：自注意力任意位置直接交互、路径长度 1、可并行；CNN 局部连接、权值共享；RNN 沿时间递归、路径长度随序列增长。自注意力代价是二次复杂度（原书 10.6.2 节对比，PDF 第 430 页前后）。\n<\/li><li>\n<strong>点积注意力 vs 加性注意力<\/strong>：点积要求 <span class=\"katex-inline\">q,k<\/span> 等长、计算快；加性用前网络适配不同长度，表达灵活但更慢。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c11 的序列建模与概念 c12 的门控递归是注意力要替代/补充的路径；概念 c04 的 softmax 稳定化手法复用于注意力权重。后继：概念 c14 的优化器在注意力参数上更新；Transformer 残差连接复用第 3 章 ResNet 的捷径思想。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（注意力与 Transformer：缩放点积注意力、方差缩放与多头/自注意力）<\/summary><div class=\"depth-body\"><h1>c13 深度推导：缩放点积注意力方差、批量形状与 Transformer 子层算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要讲清注意力机制，先往回追四层前提：<\/p>\n<ol><li>\n序列到序列建模存在隐状态瓶颈。递归压缩长句信息有损，解码时定位源句相关位置不直接，这是注意力登场的动机。\n<\/li><li>\n聚合按相关度加权。查询与键匹配出评分，评分经 softmax 归一为权重，权重对值加权求和。\n<\/li><li>\n点积评分的方差随维度增长。先推点积方差，再解释除以 <span class=\"katex-inline\">\\sqrt d<\/span> 把方差压回 1 的依据。\n<\/li><li>\n多头与位置编码补两个缺口。多头把子空间拆分学习；位置编码补上自注意力缺失的顺序信息。\n<\/ol>\n<p>依赖链方向：隐状态瓶颈 → 查询/键/值定义 → 评分归一加权 → 点积方差与缩放 → 多头、位置编码与 Transformer 子层组装。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：评分到加权聚合<\/h3>\n<p>单查询 <span class=\"katex-inline\">q<\/span>、键 <span class=\"katex-inline\">k_j<\/span>、值 <span class=\"katex-inline\">v_j<\/span>：<\/p>\n<div class=\"katex-block\">a(q,k_j)=\\frac{q^\\top k_j}{\\sqrt d},\\quad \\alpha_j=\\frac{\\exp(a(q,k_j))}{\\sum_l\\exp(a(q,k_l))},\\quad \\mathrm{Att}(q,K,V)=\\sum_j\\alpha_j v_j.<\/div>\n<p>批量形式 <span class=\"katex-inline\">QK^\\top<\/span> 一次算全部查询—键评分，逐行 softmax，再乘 <span class=\"katex-inline\">V<\/span>。<\/p>\n<h3>第二步：点积方差推导<\/h3>\n<p><span class=\"katex-inline\">q,k\\in\\mathbb R^d<\/span>，各分量独立、零均值、单位方差。分量积 <span class=\"katex-inline\">q_i k_i<\/span>：<\/p>\n<div class=\"katex-block\">E[q_i k_i]=E[q_i]E[k_i]=0,\\quad \\mathrm{Var}(q_i k_i)=E[q_i^2]E[k_i^2]=1.<\/div>\n<p>独立分量方差可加：<span class=\"katex-inline\">\\mathrm{Var}(q^\\top k)=\\sum_{i=1}^d 1=d<\/span>。 除以 <span class=\"katex-inline\">\\sqrt d<\/span>：<span class=\"katex-inline\">\\mathrm{Var}(q^\\top k/\\sqrt d)=d/d=1<\/span>。不缩放时 <span class=\"katex-inline\">d<\/span> 越大评分分布越宽，softmax 在大评分差处饱和，梯度被压住；缩放保持评分落在敏感区间。<\/p>\n<h3>第三步：批量形状流转<\/h3>\n<p><span class=\"katex-inline\">Q\\in\\mathbb R^{n\\times d}<\/span>，<span class=\"katex-inline\">K\\in\\mathbb R^{m\\times d}<\/span>，<span class=\"katex-inline\">V\\in\\mathbb R^{m\\times v}<\/span>。 <span class=\"katex-inline\">S=QK^\\top\\in\\mathbb R^{n\\times m}<\/span>；<span class=\"katex-inline\">A=\\mathrm{softmax}(S/\\sqrt d)\\in\\mathbb R^{n\\times m}<\/span>；输出 <span class=\"katex-inline\">AV\\in\\mathbb R^{n\\times v}<\/span>。批量维 <span class=\"katex-inline\">b<\/span> 全程保留，注意力在每个批量内独立算。<\/p>\n<h3>第四步：多头与子层结构<\/h3>\n<p>多头把 <span class=\"katex-inline\">Q,K,V<\/span> 按子空间切 <span class=\"katex-inline\">h<\/span> 份，每份做缩放点积注意力，结果拼接后线性投影。编码器子层流程：输入 <span class=\"katex-inline\">x<\/span> → 多头自注意力 → 残差 <span class=\"katex-inline\">x+\\mathrm{sublayer}(x)<\/span> → 层规范化；再接位置前馈网络，同样残差加 LN（原书 10.7.1 节，PDF 第 432 页）。要求子层输出维度与输入一致，残差相加才有定义。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：两查询三键注意力手算<\/h3>\n<p><span class=\"katex-inline\">Q=\\begin{pmatrix}1&amp;0\\\\0&amp;1\\end{pmatrix}<\/span>，<span class=\"katex-inline\">K=\\begin{pmatrix}1&amp;1\\\\0&amp;1\\\\1&amp;0\\end{pmatrix}<\/span>，<span class=\"katex-inline\">V=\\begin{pmatrix}1&amp;2\\\\3&amp;4\\\\5&amp;6\\end{pmatrix}<\/span>，<span class=\"katex-inline\">d=2<\/span>，<span class=\"katex-inline\">\\sqrt d\\approx1.414<\/span>。 <span class=\"katex-inline\">QK^\\top=\\begin{pmatrix}1&amp;0\\\\0&amp;1\\end{pmatrix}\\begin{pmatrix}1&amp;0&amp;1\\\\1&amp;1&amp;0\\end{pmatrix}=\\begin{pmatrix}1&amp;0&amp;1\\\\1&amp;1&amp;0\\end{pmatrix}<\/span>。 评分除以 <span class=\"katex-inline\">\\sqrt2<\/span>：第一行 <span class=\"katex-inline\">(0.707,0,0.707)<\/span>，第二行 <span class=\"katex-inline\">(0.707,0.707,0)<\/span>。 第一行 softmax：<span class=\"katex-inline\">e^{0.707}=2.028,e^0=1,e^{0.707}=2.028<\/span>，和 5.056，权重 <span class=\"katex-inline\">(0.401,0.198,0.401)<\/span>。 加权值：<span class=\"katex-inline\">0.401(1,2)+0.198(3,4)+0.401(5,6)\\approx(0.401+0.594+2.005,\\ 0.802+0.792+2.406)=(3.00,4.00)<\/span>。 第二行对称地得 <span class=\"katex-inline\">(1.99,3.99)<\/span> 量级。<\/p>\n<h3>算例 2：维度对方差的影响<\/h3>\n<p><span class=\"katex-inline\">d=1<\/span> 时点积方差 1；<span class=\"katex-inline\">d=64<\/span> 时未缩放方差 64，评分标准差 8；除以 <span class=\"katex-inline\">\\sqrt{64}=8<\/span> 后标准差回到 1。维度越大，不缩放的 softmax 越容易压成接近 one-hot 的分布，训练前期梯度越薄。<\/p>\n<h3>代码片段：缩放点积注意力（原书 10.3.3 节，PDF 第 415 页）<\/h3>\n<pre class=\"lang-python\"><code>import math, torch\nfrom torch import nn\n\nclass DotProductAttention(nn.Module):\n    def __init__(self, dropout, **kwargs):\n        super().__init__(**kwargs)\n        self.dropout = nn.Dropout(dropout)\n\n    def forward(self, queries, keys, values, valid_lens=None):\n        d = queries.shape[-1]\n        scores = torch.bmm(queries, keys.transpose(1, 2)) / math.sqrt(d)\n        self.attention_weights = masked_softmax(scores, valid_lens)\n        return torch.bmm(self.dropout(self.attention_weights), values)<\/code><\/pre>\n<p><code>bmm<\/code> 按批量做矩阵乘；<code>masked_softmax<\/code> 把无效位置屏蔽出权重分布。<\/p>\n<h2>延伸推演<\/h2>\n<h3>位置编码为什么必需<\/h3>\n<p>自注意力对集合排列不变：调换输入顺序，注意力权重与输出只跟着换位，模型本身不记录先后。位置编码把位置向量加到嵌入上，让每层注意力能区分词元顺序；可学习位置编码或固定三角正弦编码两类实现（原书 10.7.1 节，PDF 第 431 页）。<\/p>\n<h3>CNN/RNN/自注意力三对比<\/h3>\n<ul><li>\n并行性：自注意力与 CNN 可批量并行；RNN 步间依赖，串行更新。\n<\/li><li>\n路径长度：自注意力任意两点直达，路径长度 1；RNN 路径长度随序列增长；CNN 靠堆叠扩大感受野。\n<\/li><li>\n复杂度：自注意力关于序列长度二次方；CNN 局部窗口线性；RNN 线性但串行。\n<\/ul>\n<h3>掩蔽 softmax 的位置<\/h3>\n<p>解码器自注意力不能看到未来位置；掩蔽 softmax 把未来键评分设为 <span class=\"katex-inline\">-\\infty<\/span>，softmax 后权重为 0。掩蔽在归一化前施加，避免未来信息泄漏（原书 10.3.1 节，PDF 第 412 页前后）。<\/p>\n<h3>对抗性追问：注意力能不能替代卷积做局部提取<\/h3>\n<p>注意力全局加权，缺少卷积的局部卷积核结构；纯注意力在小数据、局部纹理任务上未必占优。视觉 Transformer 仍切块嵌入再注意力，局部归纳偏置要靠切块与位置编码补。<\/p>\n<h3>对抗性追问：多头是不是越多越好<\/h3>\n<p>多头增加子空间划分与参数，但头数超过维度预算后每个子空间过窄，区分度下降；头数与模型宽度配套选择，不是越多越细。<\/p>\n<h2>补充推演与第二算例<\/h2>\n<h3>第二算例：打乱顺序后自注意力结果不变<\/h3>\n<p>自注意力权重由 <span class=\"katex-inline\">QK^\\top<\/span> 决定，输入词元顺序不进入计算；把序列词元打乱，各位置的查询—键配对跟着换位，聚合结果按换位重排，模型本身不察觉顺序。位置编码把位置向量加到嵌入后，注意力才能区分先后；去掉位置编码，调换词序不改变每组注意力配对的集合。<\/p>\n<h3>多头子空间维度<\/h3>\n<p><span class=\"katex-inline\">d<\/span> 维表示切 <span class=\"katex-inline\">h<\/span> 个头，每头维度 <span class=\"katex-inline\">d/h<\/span>；每头在子空间内独立算缩放点积注意力，结果拼接回 <span class=\"katex-inline\">d<\/span> 维再投影。头数增加使每头子空间变窄，<span class=\"katex-inline\">d/h<\/span> 过小时分头区分度下降；头数与模型宽度配套，不能把宽度拆得过细。<\/p>\n<h3>残差与层规范化的位置<\/h3>\n<p>Transformer 子层结构：注意力 → 残差相加 → 层规范化，前馈网络 → 残差相加 → 层规范化。残差让梯度沿捷径直达低层，LN 稳住子层输入尺度；这与第 3 章 ResNet 残差连接同源，只是规范化换成层规范化。<\/p>\n<h3>对抗性追问：长序列自注意力怎么压成本<\/h3>\n<p>注意力复杂度关于序列长度二次方，长序列需要稀疏注意力、滑动窗口或分段聚合等近似结构，限制每个查询能接触的键范围。纯全局注意力在超长序列上的算力与内存代价不会被优化器抵消。<\/p>\n<h3>第二轮补充<\/h3>\n<h3>第二算例：缩放前后 softmax 饱和度对照<\/h3>\n<p><span class=\"katex-inline\">d=64<\/span>，两查询键点积未缩放标准差约 8；评分差 16 时 softmax 趋近 one-hot。除以 <span class=\"katex-inline\">\\sqrt{64}=8<\/span> 后评分标准差约 1，评分差落在 softmax 敏感区间。维度越高，未缩放的饱和风险越大；缩放是把评分尺度拉回可学习区间的措施。<\/p>\n<h3>注意力权重与特征复用的对照<\/h3>\n<p>全连接权重对所有输入固定；注意力权重随查询—键匹配动态变化，同一组值在不同查询下聚合组合不同。动态权重带来灵活性，也带来二次复杂度计算成本。<\/p>\n<h3>对抗性追问：位置编码能不能用相对位置替代绝对位置<\/h3>\n<p>可以。相对位置编码只编码词元间距，平移整句不改变间距关系；绝对位置编码记录绝对序号。两类方案在 Transformer 中都有实现，关键是注意力输入必须携带顺序信息。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n缩放点积注意力公式与输出形状是什么？（<span class=\"katex-inline\">\\mathrm{softmax}(QK^\\top/\\sqrt d)V<\/span>，输出 <span class=\"katex-inline\">(n,v)<\/span>。）\n<\/li><li>\n点积方差为什么随 <span class=\"katex-inline\">d<\/span> 增长，缩放依据是什么？（独立分量方差可加，<span class=\"katex-inline\">\\mathrm{Var}(q^\\top k)=d<\/span>；除以 <span class=\"katex-inline\">\\sqrt d<\/span> 后方差回到 1。）\n<\/li><li>\n自注意力为什么必须加位置编码？（注意力对排列不变，本身不含顺序信息。）\n<\/li><li>\n自注意力相对 CNN/RNN 的两项结构优势与一项代价是什么？（并行、路径长度 1；二次复杂度。）\n<\/li><li>\n掩蔽 softmax 屏蔽的是什么位置？（解码器未来位置，评分设 <span class=\"katex-inline\">-\\infty<\/span> 使权重为 0。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "注意力与 Transformer：缩放点积注意力、方差缩放与多头/自注意力"}, "c14": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.445<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">线性回归：正规方程解析解与梯度下降/小批量随机梯度下降<\/a><\/span><\/div><h1>优化算法：SGD、动量法与 Adam 的状态更新及偏差修正<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书 11.4 随机梯度下降、11.6 动量法、11.10 Adam 算法，PDF 第 445、484、506–508 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>训练深度网络要在损失面上反复更新参数。纯随机梯度下降沿当前小批量梯度走一步，在狭长损失面上沿浅方向来回震荡、下降缓慢；不同坐标的曲率差异大时，统一学习率顾此失彼。动量法累积历史梯度抵消震荡、加速一致方向；Adam 同时维护梯度一阶矩与二阶矩，按坐标自适应缩放更新。理解各优化器的状态变量、更新式与偏差修正，才能在训练中判断收敛行为。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>小批量随机梯度下降<\/strong>：<span class=\"katex-inline\">x_t\\leftarrow x_{t-1}-\\eta g_t<\/span>，<span class=\"katex-inline\">g_t<\/span> 是当前批量损失对参数的梯度，<span class=\"katex-inline\">\\eta<\/span> 学习率。 <strong>动量法状态（原书 11.6 累加型约定）<\/strong>：<span class=\"katex-inline\">v_t\\leftarrow\\beta v_{t-1}+g_t<\/span>，<span class=\"katex-inline\">\\beta<\/span> 动量系数；更新 <span class=\"katex-inline\">x_t\\leftarrow x_{t-1}-\\eta v_t<\/span>（原书公式 11.6.2、11.6.5，PDF 第 484、486 页）。这版递推把历史梯度按 <span class=\"katex-inline\">\\beta<\/span> 衰减累加，不显式乘 <span class=\"katex-inline\">(1-\\beta)<\/span>；<span class=\"katex-inline\">\\beta=0<\/span> 退回普通梯度下降。稳态下权重和 <span class=\"katex-inline\">\\sum_{\\tau=0}^{\\infty}\\beta^\\tau=1/(1-\\beta)<\/span>，<span class=\"katex-inline\">v<\/span> 的量级是平均梯度的 <span class=\"katex-inline\">1/(1-\\beta)<\/span> 倍，等效学习率放大为 <span class=\"katex-inline\">\\eta/(1-\\beta)<\/span>（原书 PDF 第 488 页）。深度学习框架与 Adam 一阶矩常用另一套 EMA 凸组合约定 <span class=\"katex-inline\">v_t\\leftarrow\\beta v_{t-1}+(1-\\beta)g_t<\/span>，<span class=\"katex-inline\">v<\/span> 直接估计梯度均值，不带这一放大；两套写法的 <span class=\"katex-inline\">\\beta<\/span> 含义不同，套用更新式前要先确认是哪一套。 <strong>Adam 一阶矩与二阶矩<\/strong>：<\/p>\n<div class=\"katex-block\">v_t\\leftarrow\\beta_1 v_{t-1}+(1-\\beta_1)g_t,\\quad s_t\\leftarrow\\beta_2 s_{t-1}+(1-\\beta_2)g_t^2.<\/div>\n<p><span class=\"katex-inline\">\\beta_1=0.9<\/span>，<span class=\"katex-inline\">\\beta_2=0.999<\/span>（原书公式 11.10.1，PDF 第 507 页）。 <strong>偏差修正<\/strong>：<span class=\"katex-inline\">\\hat v_t=v_t/(1-\\beta_1^t)<\/span>，<span class=\"katex-inline\">\\hat s_t=s_t/(1-\\beta_2^t)<\/span>（原书公式 11.10.2，PDF 第 507 页）。 <strong>Adam 更新<\/strong>：<span class=\"katex-inline\">g&#x27;_t=\\eta\\,\\hat v_t/\\sqrt{\\hat s_t+\\epsilon}<\/span>，<span class=\"katex-inline\">x_t\\leftarrow x_{t-1}-g&#x27;_t<\/span>，<span class=\"katex-inline\">\\epsilon<\/span> 取 <span class=\"katex-inline\">10^{-6}<\/span> 量级（原书公式 11.10.3–11.10.4，PDF 第 507 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>动量为什么能减震：当前梯度在浅方向符号反复翻转，历史累加后正负抵消；在一致下降方向上，动量累积放大前进速度。按原书递推 <span class=\"katex-inline\">v_t=\\beta v_{t-1}+g_t<\/span> 展开，<span class=\"katex-inline\">v_t=\\sum_{\\tau=0}^{t-1}\\beta^\\tau g_{t-\\tau}<\/span>，近期梯度权重高、远期梯度按 <span class=\"katex-inline\">\\beta<\/span> 几何衰减；这一约定下 <span class=\"katex-inline\">v<\/span> 是带 <span class=\"katex-inline\">1/(1-\\beta)<\/span> 放大的历史累加量，而非归一化后的梯度均值。<\/p>\n<p>Adam 偏差修正的来源：<span class=\"katex-inline\">v_0=s_0=0<\/span>，前几步矩估计被零初值拖低，尤其二阶矩偏小会让步长虚高。除以 <span class=\"katex-inline\">1-\\beta^t<\/span> 把早期估计的偏差补回来：<span class=\"katex-inline\">t<\/span> 很小时分母小、修正幅度大，<span class=\"katex-inline\">t<\/span> 增大后 <span class=\"katex-inline\">\\beta^t\\to0<\/span>，修正项趋近 1。<\/p>\n<p>更新尺度：<span class=\"katex-inline\">\\hat v_t<\/span> 沿梯度方向给动量，<span class=\"katex-inline\">\\sqrt{\\hat s_t}<\/span> 按梯度平方的长期大小缩放；梯度波动大的坐标步长被压低，稳定坐标步长保留。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：损失可求梯度；学习率仍是主超参数，自适应方法不替代调学习率。\n<\/li><li>\n失败案例一：Adam 不做偏差修正。初期矩估计偏低，二阶矩过小导致更新步长虚高，参数在起步阶段震荡。\n<\/li><li>\n失败案例二：把 Adam 当收敛保证。原书指出 Adam 在方差控制不良时可能发散，后续工作提出 Yogi 等修补（PDF 第 507 页）；训练发散不能只换优化器，要查梯度、学习率与数据。\n<\/li><li>\n失败案例三：忽略优化目标与泛化目标的差别。优化最小化训练经验风险，泛化风险还要靠正则化与模型选择控制（原书 11.1.1 节，PDF 第 446 页）。\n<\/li><li>\n边界：凸问题上的收敛分析不能直接套到深度网络非凸损失；优化器加速经验收敛，不保证找到全局最优。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>SGD vs 动量法<\/strong>：SGD 只看当前梯度，窄面易震荡；动量累积历史梯度，一致方向加速、翻转方向抵消。\n<\/li><li>\n<strong>动量法 vs Adam<\/strong>：动量只累积一阶方向；Adam 再加二阶矩做逐坐标缩放，并显式偏差修正。Adam 参数自适应更强，SGD 加动量在泛化表现上常被认为更稳。\n<\/li><li>\n<strong>一阶矩 vs 二阶矩<\/strong>：一阶矩 <span class=\"katex-inline\">v_t<\/span> 估计梯度均值方向；二阶矩 <span class=\"katex-inline\">s_t<\/span> 估计梯度平方的长期水平，用于尺度归一。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c03 的梯度下降是所有优化器的基线；概念 c02 提供梯度计算。后继：优化器在门控网络（概念 c12）、注意力（概念 c13）参数上更新；权重衰减（概念 c06）可叠加在任一优化器更新规则上。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（优化算法：SGD、动量法与 Adam 的状态更新及偏差修正）<\/summary><div class=\"depth-body\"><h1>c14 深度推导：动量递推、Adam 矩估计与偏差修正算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要讲清各优化器差别，先往回追四层前提：<\/p>\n<ol><li>\n基线更新规则来自梯度下降。先写纯 SGD 更新式，所有后续算法都在它之上叠加状态估计。\n<\/li><li>\n窄损失面的震荡需要历史信息抵消。动量按衰减累加历史梯度，一致方向累积、翻转方向抵消。\n<\/li><li>\n逐坐标曲率差异需要二阶信息。Adam 维护梯度平方长期水平，按坐标自适应缩放步长。\n<\/li><li>\n零初值带来早期偏差。矩从 0 起步，前几步估计偏低，偏差修正把这部分补回。\n<\/ol>\n<p>依赖链方向：纯 SGD 更新 → 动量一阶矩递推 → Adam 一阶/二阶矩 → 偏差修正 → 自适应步长更新。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：纯 SGD<\/h3>\n<div class=\"katex-block\">x_t=x_{t-1}-\\eta g_t,\\quad g_t=\\nabla L(x_{t-1}).<\/div>\n<p>批量大小影响 <span class=\"katex-inline\">g_t<\/span> 的方差：批量小梯度噪声大，批量大估计稳但每轮计算重。学习率 <span class=\"katex-inline\">\\eta<\/span> 控制单步幅度。<\/p>\n<h3>第二步：动量递推与展开（原书 11.6 累加型约定）<\/h3>\n<div class=\"katex-block\">v_t=\\beta v_{t-1}+g_t.<\/div>\n<p>展开：<\/p>\n<div class=\"katex-block\">v_t=g_t+\\beta g_{t-1}+\\beta^2 g_{t-2}+\\cdots+\\beta^{t-1}g_1=\\sum_{\\tau=0}^{t-1}\\beta^\\tau g_{t-\\tau}.<\/div>\n<p>权重 <span class=\"katex-inline\">\\beta^\\tau<\/span> 按几何级数衰减，近期梯度权重大。更新 <span class=\"katex-inline\">x_t=x_{t-1}-\\eta v_t<\/span>。连续两步梯度同向时 <span class=\"katex-inline\">v_t<\/span> 比单步梯度大，加速下降；符号翻转时历史累加把震荡抹平。<span class=\"katex-inline\">\\beta=0<\/span> 时 <span class=\"katex-inline\">v_t=g_t<\/span>，退回纯梯度下降。<\/p>\n<p>稳态下权重和 <span class=\"katex-inline\">\\sum_{\\tau=0}^{\\infty}\\beta^\\tau=1/(1-\\beta)<\/span>，若梯度均值为 <span class=\"katex-inline\">\\mu<\/span>，则 <span class=\"katex-inline\">v\\approx\\mu/(1-\\beta)<\/span>，等效步长为 <span class=\"katex-inline\">\\eta/(1-\\beta)<\/span>。对照 EMA 凸组合约定 <span class=\"katex-inline\">v_t=\\beta v_{t-1}+(1-\\beta)g_t<\/span>：其展开权重为 <span class=\"katex-inline\">(1-\\beta)\\beta^\\tau<\/span>，权重和为 1，<span class=\"katex-inline\">v<\/span> 直接估计均值 <span class=\"katex-inline\">\\mu<\/span>，没有 <span class=\"katex-inline\">1/(1-\\beta)<\/span> 放大；框架优化器与下面 Adam 一阶矩用的是这一套。两套 <span class=\"katex-inline\">\\beta<\/span> 不可直接互换。<\/p>\n<h3>第三步：Adam 双矩<\/h3>\n<div class=\"katex-block\">v_t=\\beta_1 v_{t-1}+(1-\\beta_1)g_t,\\quad s_t=\\beta_2 s_{t-1}+(1-\\beta_2)g_t^2.<\/div>\n<p><span class=\"katex-inline\">v_t<\/span> 一阶矩估计梯度期望方向，<span class=\"katex-inline\">s_t<\/span> 二阶矩估计梯度平方水平。<span class=\"katex-inline\">\\beta_1=0.9<\/span> 一阶矩跟踪快，<span class=\"katex-inline\">\\beta_2=0.999<\/span> 二阶矩跟踪慢。<\/p>\n<h3>第四步：偏差修正<\/h3>\n<p>零初值 <span class=\"katex-inline\">v_0=s_0=0<\/span>。一阶矩期望 <span class=\"katex-inline\">E[v_t]\\approx(1-\\beta_1^t)E[g]<\/span>，除以 <span class=\"katex-inline\">1-\\beta_1^t<\/span> 修正：<\/p>\n<div class=\"katex-block\">\\hat v_t=\\frac{v_t}{1-\\beta_1^t},\\quad \\hat s_t=\\frac{s_t}{1-\\beta_2^t}.<\/div>\n<p><span class=\"katex-inline\">t=1<\/span> 时分母 <span class=\"katex-inline\">1-\\beta<\/span> 最小，修正幅度最大；<span class=\"katex-inline\">t\\to\\infty<\/span> 时 <span class=\"katex-inline\">\\beta^t\\to0<\/span>，分母趋 1，修正自动淡出。<\/p>\n<h3>第五步：自适应更新<\/h3>\n<div class=\"katex-block\">g'_t=\\eta\\frac{\\hat v_t}{\\sqrt{\\hat s_t+\\epsilon}},\\quad x_t=x_{t-1}-g'_t.<\/div>\n<p><span class=\"katex-inline\">\\hat v_t<\/span> 给方向，<span class=\"katex-inline\">\\sqrt{\\hat s_t}<\/span> 给坐标尺度；梯度平方长期大的坐标步长被压，波动小的坐标步长保留。<span class=\"katex-inline\">\\epsilon<\/span> 防二阶矩为 0 时除零，常取 <span class=\"katex-inline\">10^{-6}<\/span>。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：单坐标 SGD 多步<\/h3>\n<p>损失 <span class=\"katex-inline\">L(x)=x^2/2<\/span>，梯度 <span class=\"katex-inline\">g=x<\/span>，<span class=\"katex-inline\">\\eta=0.1<\/span>，<span class=\"katex-inline\">x_0=5<\/span>。 <span class=\"katex-inline\">x_1=5-0.1\\times5=4.5<\/span>；<span class=\"katex-inline\">x_2=4.5-0.1\\times4.5=4.05<\/span>；<span class=\"katex-inline\">x_3=3.645<\/span>；序列按 <span class=\"katex-inline\">1-\\eta=0.9<\/span> 收缩，向 0 逼近。<\/p>\n<h3>算例 2：动量序列对照（原书累加型约定）<\/h3>\n<p>同损失，<span class=\"katex-inline\">\\beta=0.9<\/span>，<span class=\"katex-inline\">x_0=5<\/span>，<span class=\"katex-inline\">v_0=0<\/span>，递推 <span class=\"katex-inline\">v_t=\\beta v_{t-1}+g_t<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">t=1<\/span>：<span class=\"katex-inline\">v_1=0.9\\times0+5=5.0<\/span>，<span class=\"katex-inline\">x_1=5-0.1\\times5.0=4.5<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">t=2<\/span>：<span class=\"katex-inline\">v_2=0.9\\times5.0+4.5=9.0<\/span>，<span class=\"katex-inline\">x_2=4.5-0.1\\times9.0=3.6<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">t=3<\/span>：<span class=\"katex-inline\">v_3=0.9\\times9.0+3.6=11.7<\/span>，<span class=\"katex-inline\">x_3=3.6-0.1\\times11.7=2.43<\/span>。\n<p>累加型约定下 <span class=\"katex-inline\">v<\/span> 随同向梯度持续抬高，单步位移比纯 SGD 大；这正是稳态等效步长 <span class=\"katex-inline\">\\eta/(1-\\beta)<\/span> 的体现。在一致下降方向上加速，震荡方向上历史累加抑制来回。若改用 EMA 约定 <span class=\"katex-inline\">v_t=\\beta v_{t-1}+(1-\\beta)g_t<\/span>，同一组数据的 <span class=\"katex-inline\">v<\/span> 量级会小到约 <span class=\"katex-inline\">1/(1-\\beta)<\/span> 分之一，两者不可混用。<\/p>\n<\/ul>\n<h3>算例 3：Adam 前两步矩与修正<\/h3>\n<p>设 <span class=\"katex-inline\">g_1=2<\/span>，<span class=\"katex-inline\">g_2=1<\/span>，<span class=\"katex-inline\">\\beta_1=0.9<\/span>，<span class=\"katex-inline\">\\beta_2=0.999<\/span>。 一阶矩：<span class=\"katex-inline\">v_1=0.1\\times2=0.2<\/span>，<span class=\"katex-inline\">\\hat v_1=0.2/(1-0.9)=2.0<\/span>；<span class=\"katex-inline\">v_2=0.9\\times0.2+0.1\\times1=0.28<\/span>，<span class=\"katex-inline\">\\hat v_2=0.28/(1-0.9^2)=0.28/0.19\\approx1.474<\/span>。 二阶矩：<span class=\"katex-inline\">s_1=0.001\\times4=0.004<\/span>，<span class=\"katex-inline\">\\hat s_1=0.004/(1-0.999)=4.0<\/span>；<span class=\"katex-inline\">s_2=0.999\\times0.004+0.001\\times1\\approx0.004996<\/span>，<span class=\"katex-inline\">\\hat s_2=0.004996/(1-0.999^2)\\approx2.501<\/span>。 未修正时 <span class=\"katex-inline\">s_1=0.004<\/span> 远小于真实梯度平方 4，直接除会让步长虚高；修正后二阶矩回到合理水平。<\/p>\n<h3>代码片段：Adam 状态更新（原书 11.10.2 节，PDF 第 508 页）<\/h3>\n<pre class=\"lang-python\"><code>def adam(params, states, hyperparams):\n    beta1, beta2, eps = 0.9, 0.999, 1e-6\n    for p, (v, s) in zip(params, states):\n        with torch.no_grad():\n            v[:] = beta1 * v + (1 - beta1) * p.grad\n            s[:] = beta2 * s + (1 - beta2) * torch.square(p.grad)\n            v_corr = v / (1 - beta1 ** hyperparams[&#x27;t&#x27;])\n            s_corr = s / (1 - beta2 ** hyperparams[&#x27;t&#x27;])\n            p[:] -= hyperparams[&#x27;lr&#x27;] * v_corr / (torch.sqrt(s_corr) + eps)\n        p.grad.data.zero_()\n        hyperparams[&#x27;t&#x27;] += 1<\/code><\/pre>\n<h2>延伸推演<\/h2>\n<h3>自适应学习率谱系<\/h3>\n<p>AdaGrad 按累计梯度平方缩放，长期累积使步长单调收缩；RMSProp 用指数加权平均替换累计，避免二阶矩无限增长；Adam 在 RMSProp 思路上加回一阶动量。谱系主线：坐标尺度自适应逐步替代全局统一学习率。<\/p>\n<h3>偏差修正的证明位置（Adam 一阶矩，EMA 约定）<\/h3>\n<p>Adam 一阶矩按 <span class=\"katex-inline\">v_t=(1-\\beta_1)\\sum_{i=1}^t\\beta_1^{t-i}g_i<\/span> 更新，若 <span class=\"katex-inline\">g_i<\/span> 期望为 <span class=\"katex-inline\">\\mu<\/span>，则 <span class=\"katex-inline\">E[v_t]=(1-\\beta_1)\\mu\\sum_{i=1}^t\\beta_1^{t-i}=\\mu(1-\\beta_1^t)<\/span>。除以 <span class=\"katex-inline\">1-\\beta_1^t<\/span> 后期望回到 <span class=\"katex-inline\">\\mu<\/span>。这就是修正公式 <span class=\"katex-inline\">1-\\beta_1^t<\/span> 的来源，不是经验系数。注意此证明对应的是 Adam 的 EMA 凸组合递推，不是 11.6 节的累加型动量。<\/p>\n<h3>优化目标与泛化目标分离<\/h3>\n<p>优化器最小化训练集经验风险；泛化风险（未知数据损失）还受模型容量、正则化、数据量影响。训练损失低不等于测试损失低，优化器不替代模型选择与正则化（原书 11.1.1 节，PDF 第 446 页）。<\/p>\n<h3>对抗性追问：Adam 能不能替代学习率调参<\/h3>\n<p>不能。<span class=\"katex-inline\">\\eta<\/span> 仍是主步长控制；自适应只在坐标间缩放。Adam 起步步长虚高或后期收敛慢，常要回调学习率，而不是换优化器。<\/p>\n<h3>对抗性追问：动量越大越好吗<\/h3>\n<p><span class=\"katex-inline\">\\beta<\/span> 接近 1 历史窗口长，平滑性好但响应滞后，突变方向跟不上；<span class=\"katex-inline\">\\beta<\/span> 过小则退化为单步 SGD。动量系数与学习率配套，偏大偏小都有稳定代价。<\/p>\n<h2>补充推演与第二算例<\/h2>\n<h3>第二算例：累计平方与指数加权对照<\/h3>\n<p>AdaGrad 累计 <span class=\"katex-inline\">s_t=\\sum_{i=1}^t g_i^2<\/span>，单调不减，后期步长持续收缩；RMSProp 改用 <span class=\"katex-inline\">s_t=\\beta_2 s_{t-1}+(1-\\beta_2)g_t^2<\/span>，只跟踪近期平方水平。设 <span class=\"katex-inline\">g_1=1,g_2=1<\/span>：AdaGrad <span class=\"katex-inline\">s_2=2<\/span>；RMSProp <span class=\"katex-inline\">\\beta_2=0.999<\/span>，<span class=\"katex-inline\">s_2=0.999\\times0.001+0.001\\times1\\approx0.001999<\/span>。前者把早期平方长期计入，后者快速遗忘旧量级；Adam 在 RMSProp 思路上叠加一阶动量。<\/p>\n<h3>偏差修正的时间位置<\/h3>\n<p><span class=\"katex-inline\">t=1<\/span> 时 <span class=\"katex-inline\">1-\\beta_1^t=0.1<\/span>，修正幅度最大；随 <span class=\"katex-inline\">t<\/span> 增大分母趋近 1，修正自动淡出。若省略修正，前几步矩估计被零初值压低，二阶矩偏小会让起步步长虚高。修正公式来自矩的期望推导，不是经验系数。<\/p>\n<h3>对抗性追问：优化器选择要配套什么<\/h3>\n<p>批量大小、梯度噪声水平与任务损失面形状都影响优化器表现。自适应方法在非凸深度网络上的泛化优势没有定论，SGD 加动量在部分视觉任务上泛化更稳；选优化器要连同学习率、批量一起调，不能只看更新规则。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n动量递推式与展开权重是什么？（原书累加型：<span class=\"katex-inline\">v_t=\\beta v_{t-1}+g_t<\/span>，展开 <span class=\"katex-inline\">v_t=\\sum_{\\tau=0}^{t-1}\\beta^\\tau g_{t-\\tau}<\/span>，权重 <span class=\"katex-inline\">\\beta^\\tau<\/span> 几何衰减，稳态等效步长 <span class=\"katex-inline\">\\eta/(1-\\beta)<\/span>；EMA 凸组合版为 <span class=\"katex-inline\">v_t=\\beta v_{t-1}+(1-\\beta)g_t<\/span>，权重 <span class=\"katex-inline\">(1-\\beta)\\beta^\\tau<\/span>。）\n<\/li><li>\nAdam 两个状态变量各估计什么？（<span class=\"katex-inline\">v_t<\/span> 梯度一阶矩方向；<span class=\"katex-inline\">s_t<\/span> 梯度平方二阶矩水平。）\n<\/li><li>\n偏差修正分母怎么来的？（<span class=\"katex-inline\">E[v_t]=\\mu(1-\\beta^t)<\/span>，除以 <span class=\"katex-inline\">1-\\beta^t<\/span> 使期望回到 <span class=\"katex-inline\">\\mu<\/span>。）\n<\/li><li>\nAdam 更新式中 <span class=\"katex-inline\">\\hat v_t<\/span> 与 <span class=\"katex-inline\">\\sqrt{\\hat s_t}<\/span> 各起什么作用？（<span class=\"katex-inline\">\\hat v_t<\/span> 给更新方向；<span class=\"katex-inline\">\\sqrt{\\hat s_t}<\/span> 按坐标梯度尺度缩放步长。）\n<\/li><li>\n优化器收敛等于泛化好吗？（不等；优化压经验风险，泛化还要正则化与模型选择控制。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "优化算法：SGD、动量法与 Adam 的状态更新及偏差修正"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：预备知识与自动微分：张量、广播、线性代数、微积分、概率与反向模式求导<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：预备知识与自动微分（张量与广播、线性代数、微积分、自动微分、概率初步）<\/a><br>检查点：能说出张量每个维度的语义与形状规则，判出广播何时合法何时报错，沿一个小计算图把链式法则的梯度反向累积到底，并用 PyTorch 张量复现<\/li><li class='path-step' id='path-02'><strong>步骤 02：线性模型与多层感知机：线性回归、softmax 交叉熵、MLP、正则化与参数初始化<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化）<\/a><br>检查点：能写出平方损失与交叉熵的梯度，说明分类为什么不用平方损失，证明纯线性堆叠叠多少层都退化成一层，区分权重衰减、dropout、初始化三种正则/稳定手段的作用位置<\/li><li class='path-step' id='path-03'><strong>步骤 03：卷积网络与现代架构：卷积参数共享、池化下采样、批量归一化与残差/现代网络谱系<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：卷积网络与现代架构（卷积与池化、LeNet、AlexNet/VGG/ResNet、批量归一化）<\/a><br>检查点：能按输入尺寸、核尺寸、填充、步幅推出卷积输出形状，逐层累积感受野，讲清池化带来的平移不变性与信息损失，说出 BN 在训练与推理下统计量来源的差别<\/li><li class='path-step' id='path-04'><strong>步骤 04：循环网络、注意力与优化：RNN/BPTT、LSTM/GRU 门控、缩放点积注意力与 Transformer、SGD/动量/Adam<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：循环网络、注意力与优化（RNN 与时间反向传播、LSTM/GRU、注意力与 Transformer、优化算法）<\/a><br>检查点：能沿时间步推 BPTT 梯度并定位连乘项，逐个门推演 LSTM/GRU 的记忆与遗忘路径，推出点积方差随 $d$ 增长的结论并解释缩放，写出 Adam 的一阶/二阶矩状态与偏差修正公式<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='张量（tensor）'>张量（Tensor） — 按多维数组组织数值的结构：标量是 0 阶张量、向量是 1 阶、矩阵是 2 阶，更高阶按维度逐个枚举；每个维度对应一种语义（批量、通道、高、宽等），形状由各维度长度构成 <span class=glossary-ref>（第 1 章：预备知识与自动微分（张量与广播、线性代数、微积分、自动微分、概率初步））<\/span><\/li><li data-term='广播机制（broadcasting）'>广播机制（Broadcasting） — 对形状不同的张量逐元素运算时，按规则把较小维度扩展对齐：从右往左比对，维度长度相等或其中一方为 1 时合法；两维既不相等也不为 1 时报形状错误（原书 2.1.3 节，PDF 第 62 页） <span class=glossary-ref>（第 1 章：预备知识与自动微分（张量与广播、线性代数、微积分、自动微分、概率初步））<\/span><\/li><li data-term='自动微分（automatic differentiation）'>自动微分（Automatic Differentiation） — 框架按前向过程构建计算图，再沿图反向累积每个参数偏导数的求导方式；本书采用反向模式，先记录操作链，调用 backward 后把梯度填回各参数（原书 2.5 节，PDF 第 87 页） <span class=glossary-ref>（第 1 章：预备知识与自动微分（张量与广播、线性代数、微积分、自动微分、概率初步））<\/span><\/li><li data-term='计算图（computational graph）'>计算图（Computational Graph） — 把张量与运算组织成节点和边的有向图：输入为叶节点，每个运算记录输入、输出与梯度函数；反向传播沿图从损失叶节点回溯到各参数叶节点 <span class=glossary-ref>（第 1 章：预备知识与自动微分（张量与广播、线性代数、微积分、自动微分、概率初步））<\/span><\/li><li data-term='平方损失（squared loss）'>平方损失（Squared Loss） — 回归问题常用损失，样本上为预测与真值之差的平方；对应高斯噪声假设下的负对数似然，梯度是预测误差的线性放大（原书 3.1.3 节，PDF 第 109 页前后） <span class=glossary-ref>（第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化））<\/span><\/li><li data-term='交叉熵损失（cross-entropy loss）'>交叉熵损失（Cross-Entropy Loss） — 分类损失 $l(y,\\hat y)=-\\sum_j y_j\\log \\hat y_j$，$y$ 为独热标签；独热下只保留正确类那一项，即 $-\\log \\hat y_{y}$，梯度为预测概率减标签（原书 3.4.6 节，PDF 第 126 页） <span class=glossary-ref>（第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化））<\/span><\/li><li data-term='独热编码（one-hot encoding）'>独热编码（One-Hot Encoding） — 类别用等长 0/1 向量表示，对应类别分量为 1、其余为 0；类别之间不携带自然顺序，避免把分类问题误当成有序回归（原书 3.4.1 节，PDF 第 124 页） <span class=glossary-ref>（第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化））<\/span><\/li><li data-term='权重衰减（weight decay / l2 正则化）'>权重衰减（Weight Decay / L2 正则化） — 在损失中加入权重范数平方项 $\\lambda\\sum w^2$，梯度更新等价于在每步把权重乘上小于 1 的衰减因子，把参数约束在较小范数内，缓解高维过拟合（原书 4.5 节，PDF 第 167 页） <span class=glossary-ref>（第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化））<\/span><\/li><li data-term='暂退法（dropout）'>暂退法（Dropout） — 训练时按概率 $p$ 把隐层激活置零并按 $1-p$ 缩放保留值，使单次迭代相当于采样一个子网络；推理时关闭丢弃，用完整网络做确定性预测（原书 4.6 节，PDF 第 174 页） <span class=glossary-ref>（第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化））<\/span><\/li><li data-term='梯度消失 / 梯度爆炸'>梯度消失 / 梯度爆炸 — 深层网络反向传播时梯度沿层连乘：乘积过小则参数几乎不动（消失），过大则更新破坏收敛（爆炸）；sigmoid 饱和区易致消失，初始权重尺度偏大易致爆炸（原书 4.8.1 节，PDF 第 184 页） <span class=glossary-ref>（第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化））<\/span><\/li><li data-term='xavier 初始化'>Xavier 初始化 — 按前向与反向方差平衡取权重分布：方差 $\\sigma^2=2/(n_{in}+n_{out})$，高斯采样或均匀分布 $U(-\\sqrt{6/(n_{in}+n_{out})},\\sqrt{6/(n_{in}+n_{out})})$；用于把激活与梯度尺度控制在 1 附近（原书 4.8.2 节，PDF 第 186 页） <span class=glossary-ref>（第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化））<\/span><\/li><li data-term='感受野（receptive field）'>感受野（Receptive Field） — 输出张量上某个位置在输入图上所能影响到的区域；卷积层逐层叠加时感受野按核尺寸与步幅累积，深层特征对应原图更大范围（原书 6.2.6 节，PDF 第 245 页前后） <span class=glossary-ref>（第 3 章：卷积网络与现代架构（卷积与池化、LeNet、AlexNet/VGG/ResNet、批量归一化））<\/span><\/li><li data-term='汇聚层（pooling）'>汇聚层（Pooling） — 用固定窗口在输入上滑动取最大值或平均值的无参数层，作用是降低对位置的敏感度并做空间下采样；最大汇聚保留最显著响应，平均汇聚取区域平均（原书 6.5 节，PDF 第 254 页） <span class=glossary-ref>（第 3 章：卷积网络与现代架构（卷积与池化、LeNet、AlexNet/VGG/ResNet、批量归一化））<\/span><\/li><li data-term='批量归一化（batch normalization）'>批量归一化（Batch Normalization） — 对小批量内激活按通道做标准化再经可学习 $\\gamma,\beta$ 拉伸偏移；训练用批量均值方差并维护移动平均，推理切换为移动平均统计量（原书 7.5 节，PDF 第 286 页） <span class=glossary-ref>（第 3 章：卷积网络与现代架构（卷积与池化、LeNet、AlexNet/VGG/ResNet、批量归一化））<\/span><\/li><li data-term='残差连接（residual connection）'>残差连接（Residual Connection） — 把层输入与层输出直接相加 $h=x+\\mathrm{sublayer}(x)$，让梯度可以沿捷径直达浅层；ResNet 与 Transformer 编码器/解码器子层均采用该结构（原书 7.6、10.7 节，PDF 第 295、432 页） <span class=glossary-ref>（第 3 章：卷积网络与现代架构（卷积与池化、LeNet、AlexNet/VGG/ResNet、批量归一化））<\/span><\/li><li data-term='困惑度（perplexity）'>困惑度（Perplexity） — 语言模型按平均负对数似然取指数得到的评价指标，衡量模型对序列预测的不确定程度；值越小表示模型对观测词元的预测越确定（原书 8.4.4 节，PDF 第 333 页前后） <span class=glossary-ref>（第 4 章：循环网络、注意力与优化（RNN 与时间反向传播、LSTM/GRU、注意力与 Transformer、优化算法））<\/span><\/li><li data-term='门控循环单元（gru）'>门控循环单元（GRU） — 带重置门与更新门的 RNN 变体：更新门控制新旧隐状态的凸组合比例，重置门控制构造候选状态时参考多少过去状态（原书 9.1 节，PDF 第 353 页） <span class=glossary-ref>（第 4 章：循环网络、注意力与优化（RNN 与时间反向传播、LSTM/GRU、注意力与 Transformer、优化算法））<\/span><\/li><li data-term='长短期记忆网络（lstm）'>长短期记忆网络（LSTM） — 带输入门、遗忘门、输出门与记忆元的 RNN 变体；遗忘门控制旧记忆保留比例，输入门写入候选记忆，输出门控制记忆元对外暴露的程度（原书 9.2 节，PDF 第 360 页） <span class=glossary-ref>（第 4 章：循环网络、注意力与优化（RNN 与时间反向传播、LSTM/GRU、注意力与 Transformer、优化算法））<\/span><\/li><li data-term='缩放点积注意力（scaled dot-product attention）'>缩放点积注意力（Scaled Dot-Product Attention） — 评分函数 $a(q,k)=q^\top k/\\sqrt{d}$，把查询键点积除以键维度平方根以把点积方差压回 1；批量形式为 $\\mathrm{softmax}(QK^\top/\\sqrt d)V$（原书 10.3.3 节，PDF 第 415 页） <span class=glossary-ref>（第 4 章：循环网络、注意力与优化（RNN 与时间反向传播、LSTM/GRU、注意力与 Transformer、优化算法））<\/span><\/li><li data-term='adam 优化器'>Adam 优化器 — 同时维护梯度一阶矩 $v_t$ 与二阶矩 $s_t$ 的自适应优化算法，用 $1-\beta_1^t$、$1-\beta_2^t$ 做偏差修正，再按 $v_t/\\sqrt{s_t}$ 缩放更新（原书 11.10 节，PDF 第 506 页） <span class=glossary-ref>（第 4 章：循环网络、注意力与优化（RNN 与时间反向传播、LSTM/GRU、注意力与 Transformer、优化算法））<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库<\/h1>\n<h2>模式 1：先定张量形状与维度语义，再写运算<\/h2>\n<p>写网络层前先把每个张量的形状与维度语义标出来（批量、通道、高、宽、时间步），逐维比对再决定相加、相乘还是拼接。广播错误、通道错位、全连接输入维度对不上，多数在形状核对阶段就能拦住；先跑代码再猜形状，排查路径会绕远。线性模型偏置、BN 拉伸参数、卷积通道维都按这套对齐方式处理。<\/p>\n<h2>模式 2：沿计算图反向累积梯度，把链式法则机械化<\/h2>\n<p>复合函数求导先画前向节点与边，记录每个中间量；反向从损失标量出发，上游梯度乘本地偏导再下传，多条路径汇入时按路径求和。排查梯度异常时沿图分段：先看输出侧损失是否非法，再逐段核对上游激活量级，按边二分定位问题层。非标量输出回传需要同形状权重向量；训练循环每轮更新后清零梯度。<\/p>\n<h2>模式 3：损失函数由数据假设与任务类型反推<\/h2>\n<p>回归在高斯噪声假设下取平方损失，分类在互斥类别下取交叉熵。选损失先问：输出是否互斥、标签是连续值还是类别分布、错误置信度该不该被重罚。平方损失套在 softmax 分类上，自信判错时梯度被饱和因子压平；多标签问题不能用 softmax 互斥归一，要换逐位置 sigmoid 二元交叉熵。<\/p>\n<h2>模式 4：容量与正则化按偏差—方差权衡调参<\/h2>\n<p>欠拟合对应高偏差，过拟合对应高方差。约束复杂度有三条不同位置的路径：损失层加权重衰减压参数范数，前向层 dropout 扰动单元路径，初始化与归一化稳住尺度。强度过头把偏差抬上来；<span class=\"katex-inline\">\\lambda<\/span>、<span class=\"katex-inline\">p<\/span> 在验证集上选，测试集只做最终评估。训练低验证高指向过拟合，训练验证同步偏高指向欠拟合或优化问题。<\/p>\n<h2>模式 5：深链尺度维持是一条配套链条，不单靠初始化<\/h2>\n<p>深层网络尺度失控来自前向激活放大、反向梯度连乘、激活饱和三处。初始化把起点方差压在 1 附近，BN 校准层间分布，残差连接给梯度留捷径，ReLU 保持正区间导数；四者配合才把深链维持在可控区间。初始化只约束起点，训练中的分布漂移要靠后续机制补；梯度裁剪是运行时止损，不改变长链连乘结构。<\/p>\n<h2>模式 6：局部连接逐层累积感受野，骨架尺寸按公式复核<\/h2>\n<p>卷积在滑动窗口上复用同一组核权重，参数与图像边长脱钩；深层单元覆盖的原图范围由各层核尺寸与步幅按 <span class=\"katex-inline\">r_l=s_l r_{l-1}+(k_l-1)<\/span> 累积。搭骨架时逐层用输出边长公式复核，避免末端尺寸与全连接输入对不上。大核可由多层小核叠加替代，参数更少且多几次非线性变换；<span class=\"katex-inline\">1\\times1<\/span> 卷积只做跨通道融合，不改空间尺寸。<\/p>\n<h2>模式 7：长链连乘先定位因子谱半径，再选结构对策<\/h2>\n<p>RNN 的 BPTT 梯度沿时间步雅可比连乘，前馈网络沿层间雅可比连乘，结构同类。因子长期小于 1 梯度消失，长期大于 1 梯度爆炸；临界稳定带很窄。对策分层：截断 BPTT 切短回传链，梯度裁剪压单步爆炸，门控单元给记忆元留可选直通路。门控缓解但不消除长程连乘问题，饱和门还会压住局部梯度。<\/p>\n<h2>模式 8：优化器按状态估计分层选择<\/h2>\n<p>纯 SGD 只看当前梯度，窄损失面易震荡；动量法累积一阶历史方向抵消翻转；Adam 再加二阶矩做逐坐标缩放，并用偏差修正补偿零初值。选优化器要连同学习率、批量大小一起调：自适应方法不替代学习率调参，SGD 加动量在部分任务上泛化更稳。优化最小化训练经验风险，泛化风险还要靠正则化与模型选择控制，两者目标分开看。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 预备知识与自动微分<\/strong>：张量与广播、线性代数、微积分、自动微分、概率初步（原书第 2 章，PDF 第 57–102 页）。\n<\/li><li>\n<strong>第 2 章 线性模型与多层感知机<\/strong>：线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化（原书第 3–5 章，PDF 第 103–234 页）。\n<\/li><li>\n<strong>第 3 章 卷积网络与现代架构<\/strong>：卷积与池化、LeNet、AlexNet/VGG/ResNet、批量归一化（原书第 6–7 章，PDF 第 235–306 页）。\n<\/li><li>\n<strong>第 4 章 循环网络、注意力与优化<\/strong>：RNN 与 BPTT、LSTM/GRU、注意力与 Transformer、优化算法（原书第 8–11 章，PDF 第 307–520 页）。\n<\/ul>\n<h2>张量与广播规则<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>情形<\/th><th>比对结果<\/th><th>输出形状<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">(3,1)+(1,4)<\/span><\/td><td>两维各有一方为 1<\/td><td><span class=\"katex-inline\">(3,4)<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">(2,3)+(3,)<\/span><\/td><td>右侧对齐，<span class=\"katex-inline\">(3,)<\/span> 视为 <span class=\"katex-inline\">(1,3)<\/span><\/td><td><span class=\"katex-inline\">(2,3)<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">(2,3)+(2,4)<\/span><\/td><td>最右维 3 与 4 既不等也不为 1<\/td><td>报错<\/td><\/tr><tr><td><span class=\"katex-inline\">(n,c,h,w)+\\gamma(1,c,1,1)<\/span><\/td><td>批量维与空间维复用<\/td><td><span class=\"katex-inline\">(n,c,h,w)<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>比对方向：从最右维向左；较短形状左侧补 1；参数数量只数可学习张量本身形状。<\/p>\n<h2>损失与梯度速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>任务<\/th><th>损失<\/th><th>对参数/输出的梯度<\/th><\/tr><\/thead><tbody><tr><td>回归<\/td><td><span class=\"katex-inline\">L=\\frac1n\\|X\\mathbf w-\\mathbf y\\|^2<\/span><\/td><td><span class=\"katex-inline\">\\nabla_{\\mathbf w}L=\\frac2n(X^\\top X\\mathbf w-X^\\top\\mathbf y)<\/span><\/td><\/tr><tr><td>分类<\/td><td><span class=\"katex-inline\">l=-\\sum_j y_j\\log\\hat y_j<\/span><\/td><td><span class=\"katex-inline\">\\partial l/\\partial o_k=\\hat y_k-y_k<\/span><\/td><\/tr><tr><td>正规方程<\/td><td><span class=\"katex-inline\">X^\\top X\\mathbf w=X^\\top\\mathbf y<\/span><\/td><td>解 <span class=\"katex-inline\">\\mathbf w^*=(X^\\top X)^{-1}X^\\top\\mathbf y<\/span>，要求列满秩<\/td><\/tr><\/tbody><\/table><\/div>\n<p>softmax 稳定实现：先减每行最大值再取幂；<span class=\"katex-inline\">\\hat y_j=\\exp(o_j)/\\sum_k\\exp(o_k)<\/span>。<\/p>\n<h2>正则化与稳定性对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>手段<\/th><th>作用位置<\/th><th>机制<\/th><th>失效信号<\/th><\/tr><\/thead><tbody><tr><td>权重衰减<\/td><td>损失/更新式<\/td><td>加 <span class=\"katex-inline\">\\lambda\\sum w^2<\/span>，更新乘 <span class=\"katex-inline\">(1-\\eta\\lambda)<\/span><\/td><td>训练误差同步走高<\/td><\/tr><tr><td>dropout<\/td><td>前向隐层<\/td><td>概率 <span class=\"katex-inline\">p<\/span> 置零、按 <span class=\"katex-inline\">1-p<\/span> 缩放，<span class=\"katex-inline\">E[h&#x27;]=h<\/span><\/td><td>推理忘切 eval<\/td><\/tr><tr><td>参数初始化<\/td><td>权重起点<\/td><td>Xavier <span class=\"katex-inline\">\\sigma^2=2/(n_{in}+n_{out})<\/span><\/td><td>深层激活/梯度尺度漂移<\/td><\/tr><tr><td>梯度裁剪<\/td><td>优化更新<\/td><td>范数超阈值按比例缩回<\/td><td>只压单步，不改长链结构<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>卷积几何<\/h2>\n<ul><li>\n输出边长：<span class=\"katex-inline\">o_h=\\lfloor(n_h+2p_h-k_h)/s_h\\rfloor+1<\/span>。\n<\/li><li>\n感受野递推：<span class=\"katex-inline\">r_l=s_l r_{l-1}+(k_l-1)<\/span>，<span class=\"katex-inline\">r_0=1<\/span>。\n<\/li><li>\n卷积参数：<span class=\"katex-inline\">k_h k_w c_{in}c_{out}<\/span>（加 <span class=\"katex-inline\">c_{out}<\/span> 偏置），与输入空间边长无关。\n<\/li><li>\n池化输出通道数等于输入通道数，无可学习参数。\n<\/ul>\n<h2>归一化对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>类型<\/th><th>统计口径<\/th><th>批量依赖<\/th><th>典型场景<\/th><\/tr><\/thead><tbody><tr><td>BN<\/td><td>跨批量/空间，按通道统计<\/td><td>依赖批量大小，批量 1 失效<\/td><td>卷积网络训练<\/td><\/tr><tr><td>LN<\/td><td>单样本内跨特征统计<\/td><td>不依赖批量<\/td><td>RNN、小批量微调<\/td><\/tr><\/tbody><\/table><\/div>\n<p>BN 训练用当前批量统计并更新移动平均；推理切移动平均。<span class=\"katex-inline\">\\gamma<\/span> 拉伸尺度，<span class=\"katex-inline\">\\beta<\/span> 平移偏移。<\/p>\n<h2>循环网络与门控<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>单元<\/th><th>门/通道<\/th><th>解决的问题<\/th><\/tr><\/thead><tbody><tr><td>RNN<\/td><td>无门控<\/td><td>沿时间递归保留历史；长链梯度连乘消失/爆炸<\/td><\/tr><tr><td>GRU<\/td><td>重置门 <span class=\"katex-inline\">R_t<\/span>、更新门 <span class=\"katex-inline\">Z_t<\/span><\/td><td>重置门约束候选构造；更新门融合新旧状态<\/td><\/tr><tr><td>LSTM<\/td><td>输入门 <span class=\"katex-inline\">I_t<\/span>、遗忘门 <span class=\"katex-inline\">F_t<\/span>、输出门 <span class=\"katex-inline\">O_t<\/span>、记忆元 <span class=\"katex-inline\">C_t<\/span><\/td><td><span class=\"katex-inline\">C_t=F_t\\odot C_{t-1}+I_t\\odot\\tilde C_t<\/span>；<span class=\"katex-inline\">H_t=O_t\\odot\\tanh(C_t)<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>BPTT 梯度含 <span class=\"katex-inline\">\\prod_{j=i+1}^{t}\\partial f/\\partial h_{j-1}<\/span> 连乘；因子谱半径长期小于 1 消失，长期大于 1 爆炸。<\/p>\n<h2>注意力与优化器<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>项<\/th><th>公式/要点<\/th><\/tr><\/thead><tbody><tr><td>缩放点积注意力<\/td><td><span class=\"katex-inline\">\\mathrm{softmax}(QK^\\top/\\sqrt d)V<\/span>；点积方差 <span class=\"katex-inline\">d<\/span>，除以 <span class=\"katex-inline\">\\sqrt d<\/span> 后方差 1<\/td><\/tr><tr><td>SGD<\/td><td><span class=\"katex-inline\">x_t\\leftarrow x_{t-1}-\\eta g_t<\/span><\/td><\/tr><tr><td>动量法（原书 11.6 累加型）<\/td><td><span class=\"katex-inline\">v_t\\leftarrow\\beta v_{t-1}+g_t<\/span>，<span class=\"katex-inline\">x_t\\leftarrow x_{t-1}-\\eta v_t<\/span>；稳态等效步长 <span class=\"katex-inline\">\\eta/(1-\\beta)<\/span>。框架 EMA 型为 <span class=\"katex-inline\">v_t\\leftarrow\\beta v_{t-1}+(1-\\beta)g_t<\/span>，两套 <span class=\"katex-inline\">\\beta<\/span> 不可混用<\/td><\/tr><tr><td>Adam<\/td><td><span class=\"katex-inline\">v_t<\/span> 一阶矩、<span class=\"katex-inline\">s_t<\/span> 二阶矩；修正 <span class=\"katex-inline\">\\hat v_t=v_t/(1-\\beta_1^t)<\/span>，<span class=\"katex-inline\">\\hat s_t=s_t/(1-\\beta_2^t)<\/span>；更新 <span class=\"katex-inline\">\\eta\\hat v_t/\\sqrt{\\hat s_t+\\epsilon}<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>默认 <span class=\"katex-inline\">\\beta_1=0.9<\/span>，<span class=\"katex-inline\">\\beta_2=0.999<\/span>，<span class=\"katex-inline\">\\epsilon=10^{-6}<\/span> 量级。<\/p>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/deep2/src/动手学深度学习-PyTorch-第二版-22", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：预备知识与自动微分（张量与广播、线性代数、微积分、自动微分、概率初步）", "href": "#/chapter/ch01"}, {"label": "第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化）", "href": "#/chapter/ch02"}, {"label": "第 3 章：卷积网络与现代架构（卷积与池化、LeNet、AlexNet/VGG/ResNet、批量归一化）", "href": "#/chapter/ch03"}, {"label": "第 4 章：循环网络、注意力与优化（RNN 与时间反向传播、LSTM/GRU、注意力与 Transformer、优化算法）", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "张量与广播机制：形状语义、广播规则与内存占用", "href": "#/concept/c01"}, {"label": "自动微分的反向模式：计算图、链式法则与梯度反向累积", "href": "#/concept/c02"}, {"label": "线性回归：正规方程解析解与梯度下降/小批量随机梯度下降", "href": "#/concept/c03"}, {"label": "softmax 与交叉熵：分类损失、数值稳定实现与梯度", "href": "#/concept/c04"}, {"label": "多层感知机与非线性激活：为什么线性堆叠会退化", "href": "#/concept/c05"}, {"label": "过拟合、权重衰减与 dropout：三种正则化的机制差别", "href": "#/concept/c06"}, {"label": "数值稳定性与参数初始化：梯度消失/爆炸的来源与 Xavier 初始化", "href": "#/concept/c07"}, {"label": "卷积与参数共享：输出尺寸公式、参数复用与感受野累积", "href": "#/concept/c08"}, {"label": "池化与下采样：不变性来源、信息损失与 stride 卷积的差别", "href": "#/concept/c09"}, {"label": "批量归一化：训练/推理统计量差异与对优化景观的改变", "href": "#/concept/c10"}, {"label": "RNN 与通过时间反向传播：梯度沿时间步的连乘与长依赖问题", "href": "#/concept/c11"}, {"label": "LSTM/GRU 的门控：各门解决哪个问题与门值推演", "href": "#/concept/c12"}, {"label": "注意力与 Transformer：缩放点积注意力、方差缩放与多头/自注意力", "href": "#/concept/c13"}, {"label": "优化算法：SGD、动量法与 Adam 的状态更新及偏差修正", "href": "#/concept/c14"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：预备知识与自动微分（张量与广播、线性代数、微积分、自动微分、概率初步）", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化）", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：卷积网络与现代架构（卷积与池化、LeNet、AlexNet/VGG/ResNet、批量归一化）", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：循环网络、注意力与优化（RNN 与时间反向传播、LSTM/GRU、注意力与 Transformer、优化算法）", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.57<\/div><h1>第 1 章：预备知识与自动微分<\/h1>\n<blockquote>对应原书第 2 章 预备知识（PDF 第 57–102 页；印刷页 = PDF 页 − 18）。覆盖原书 2.1 数据操作、2.3 线性代数、2.4 微积分、2.5 自动微分、2.6 概率。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清一个张量每个维度的语义与形状含义，判断两个张量做逐元素运算时广播是否合法；\n<\/li><li>\n沿一条链式法则把复合函数的偏导数逐层写开，对照 PyTorch 张量的 <code>requires_grad<\/code>、<code>backward()<\/code>、<code>grad<\/code> 行为；\n<\/li><li>\n手算一个两层小计算图的前向数值与反向梯度，并解释非标量变量反向传播为什么要传 <code>gradient<\/code> 参数；\n<\/li><li>\n区分张量原地操作与复制操作对内存的影响，说清梯度为什么默认累积、何时必须清零。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>深度学习的一切计算都落在张量上：先把数据组织成带形状的多维数组，按广播规则做逐元素运算；框架在前向时记下操作链形成计算图，再用反向模式把损失对每个参数的梯度沿图反向累积出来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 张量：从标量到多维数组<\/h3>\n<p>原书 2.1 节从 <code>torch.arange(4.0)<\/code> 这类一维向量起步（PDF 第 58 页）。张量的阶由维度个数决定：标量是 0 阶，向量是 1 阶，矩阵是 2 阶，图像批量常是 4 阶张量（批量大小、通道、高、宽）。每个维度都要能回答“这一维上放的是什么”：批量维放样本，通道维放特征通道，空间维放位置。形状不同的张量做加减乘除时，框架按广播规则对齐，而不是要求两边形状完全一致。<\/p>\n<h3>2. 概念 1：张量与广播机制（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。广播从右往左逐维比对：两边该维长度相等，或其中一方为 1，就可以对齐；两维既不相等也不为 1，直接抛形状错误。本书 2.1.3 节给出广播示例（PDF 第 62 页）。除了形状合法性，原地操
