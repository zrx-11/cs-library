<style>
:root{

  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}

ites": ["c04"], "depthFragment": "concepts/c05-depth.md"}, {"id": "c06", "title": "过拟合、权重衰减与 dropout：三种正则化的机制差别", "file": "concepts/c06.md", "chapterIds": ["ch02"], "difficulty": "进阶", "source": {"file": "library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf", "page": 157}, "prerequisites": ["c05"], "depthFragment": "concepts/c06-depth.md"}, {"id": "c07", "title": "数值稳定性与参数初始化：梯度消失/爆炸的来源与 Xavier 初始化", "file": "concepts/c07.md", "chapterIds": ["ch02"], "difficulty": "高难", "source": {"file": "library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf", "page": 184}, "prerequisites": ["c05"], "depthFragment": "concepts/c07-depth.md"}, {"id": "c08", "title": "卷积与参数共享：输出尺寸公式、参数复用与感受野累积", "file": "concepts/c08.md", "chapterIds": ["ch03"], "difficulty": "进阶", "source": {"file": "library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf", "page": 236}, "prerequisites": ["c05"], "depthFragment": "concepts/c08-depth.md"}, {"id": "c09", "title": "池化与下采样：不变性来源、信息损失与 stride 卷积的差别", "file": "concepts/c09.md", "chapterIds": ["ch03"], "difficulty": "基础", "source": {"file": "library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf", "page": 254}, "prerequisites": ["c08"], "depthFragment": "concepts/c09-depth.md"}, {"id": "c10", "title": "批量归一化：训练/推理统计量差异与对优化景观的改变", "file": "concepts/c10.md", "chapterIds": ["ch03"], "difficulty": "高难", "source": {"file": "library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf", "page": 286}, "prerequisites": ["c07"], "depthFragment": "concepts/c10-depth.md"}, {"id": "c11", "title": "RNN 与通过时间反向传播：梯度沿时间步的连乘与长依赖问题", "file": "concepts/c11.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf", "page": 330}, "prerequisites": ["c02"], "depthFragment": "concepts/c11-depth.md"}, {"id": "c12", "title": "LSTM/GRU 的门控：各门解决哪个问题与门值推演", "file": "concepts/c12.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf", "page": 353}, "prerequisites": ["c11"], "depthFragment": "concepts/c12-depth.md"}, {"id": "c13", "title": "注意力与 Transformer：缩放点积注意力、方差缩放与多头/自注意力", "file": "concepts/c13.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf", "page": 411}, "prerequisites": ["c12"], "depthFragment": "concepts/c13-depth.md"}, {"id": "c14", "title": "优化算法：SGD、动量法与 Adam 的状态更新及偏差修正", "file": "concepts/c14.md", "chapterIds": ["ch04"], "difficulty": "进阶", "source": {"file": "library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf", "page": 445}, "prerequisites": ["c03"], "depthFragment": "concepts/c14-depth.md"}], "glossary": [{"term": "张量（Tensor）", "def": "按多维数组组织数值的结构：标量是 0 阶张量、向量是 1 阶、矩阵是 2 阶，更高阶按维度逐个枚举；每个维度对应一种语义（批量、通道、高、宽等），形状由各维度长度构成", "chapterId": "ch01"}, {"term": "广播机制（Broadcasting）", "def": "对形状不同的张量逐元素运算时，按规则把较小维度扩展对齐：从右往左比对，维度长度相等或其中一方为 1 时合法；两维既不相等也不为 1 时报形状错误（原书 2.1.3 节，PDF 第 62 页）", "chapterId": "ch01"}, {"term": "自动微分（Automatic Differentiation）", "def": "框架按前向过程构建计算图，再沿图反向累积每个参数偏导数的求导方式；本书采用反向模式，先记录操作链，调用 backward 后把梯度填回各参数（原书 2.5 节，PDF 第 87 页）", "chapterId": "ch01"}, {"term": "计算图（Computational Graph）", "def": "把张量与运算组织成节点和边的有向图：输入为叶节点，每个运算记录输入、输出与梯度函数；反向传播沿图从损失叶节点回溯到各参数叶节点", "chapterId": "ch01"}, {"term": "平方损失（Squared Loss）", "def": "回归问题常用损失，样本上为预测与真值之差的平方；对应高斯噪声假设下的负对数似然，梯度是预测误差的线性放大（原书 3.1.3 节，PDF 第 109 页前后）", "chapterId": "ch02"}, {"term": "交叉熵损失（Cross-Entropy Loss）", "def": "分类损失 $l(y,\\hat y)=-\\sum_j y_j\\log \\hat y_j$，$y$ 为独热标签；独热下只保留正确类那一项，即 $-\\log \\hat y_{y}$，梯度为预测概率减标签（原书 3.4.6 节，PDF 第 126 页）", "chapterId": "ch02"}, {"term": "独热编码（One-Hot Encoding）", "def": "类别用等长 0/1 向量表示，对应类别分量为 1、其余为 0；类别之间不携带自然顺序，避免把分类问题误当成有序回归（原书 3.4.1 节，PDF 第 124 页）", "chapterId": "ch02"}, {"term": "权重衰减（Weight Decay / L2 正则化）", "def": "在损失中加入权重范数平方项 $\\lambda\\sum w^2$，梯度更新等价于在每步把权重乘上小于 1 的衰减因子，把参数约束在较小范数内，缓解高维过拟合（原书 4.5 节，PDF 第 167 页）", "chapterId": "ch02"}, {"term": "暂退法（Dropout）", "def": "训练时按概率 $p$ 把隐层激活置零并按 $1-p$ 缩放保留值，使单次迭代相当于采样一个子网络；推理时关闭丢弃，用完整网络做确定性预测（原书 4.6 节，PDF 第 174 页）", "chapterId": "ch02"}, {"term": "梯度消失 / 梯度爆炸", "def": "深层网络反向传播时梯度沿层连乘：乘积过小则参数几乎不动（消失），过大则更新破坏收敛（爆炸）；sigmoid 饱和区易致消失，初始权重尺度偏大易致爆炸（原书 4.8.1 节，PDF 第 184 页）", "chapterId": "ch02"}, {"term": "Xavier 初始化", "def": "按前向与反向方差平衡取权重分布：方差 $\\sigma^2=2/(n_{in}+n_{out})$，高斯采样或均匀分布 $U(-\\sqrt{6/(n_{in}+n_{out})},\\sqrt{6/(n_{in}+n_{out})})$；用于把激活与梯度尺度控制在 1 附近（原书 4.8.2 节，PDF 第 186 页）", "chapterId": "ch02"}, {"term": "感受野（Receptive Field）", "def": "输出张量上某个位置在输入图上所能影响到的区域；卷积层逐层叠加时感受野按核尺寸与步幅累积，深层特征对应原图更大范围（原书 6.2.6 节，PDF 第 245 页前后）", "chapterId": "ch03"}, {"term": "汇聚层（Pooling）", "def": "用固定窗口在输入上滑动取最大值或平均值的无参数层，作用是降低对位置的敏感度并做空间下采样；最大汇聚保留最显著响应，平均汇聚取区域平均（原书 6.5 节，PDF 第 254 页）", "chapterId": "ch03"}, {"term": "批量归一化（Batch Normalization）", "def": "对小批量内激活按通道做标准化再经可学习 $\\gamma,\beta$ 拉伸偏移；训练用批量均值方差并维护移动平均，推理切换为移动平均统计量（原书 7.5 节，PDF 第 286 页）", "chapterId": "ch03"}, {"term": "残差连接（Residual Connection）", "def": "把层输入与层输出直接相加 $h=x+\\mathrm{sublayer}(x)$，让梯度可以沿捷径直达浅层；ResNet 与 Transformer 编码器/解码器子层均采用该结构（原书 7.6、10.7 节，PDF 第 295、432 页）", "chapterId": "ch03"}, {"term": "困惑度（Perplexity）", "def": "语言模型按平均负对数似然取指数得到的评价指标，衡量模型对序列预测的不确定程度；值越小表示模型对观测词元的预测越确定（原书 8.4.4 节，PDF 第 333 页前后）", "chapterId": "ch04"}, {"term": "门控循环单元（GRU）", "def": "带重置门与更新门的 RNN 变体：更新门控制新旧隐状态的凸组合比例，重置门控制构造候选状态时参考多少过去状态（原书 9.1 节，PDF 第 353 页）", "chapterId": "ch04"}, {"term": "长短期记忆网络（LSTM）", "def": "带输入门、遗忘门、输出门与记忆元的 RNN 变体；遗忘门控制旧记忆保留比例，输入门写入候选记忆，输出门控制记忆元对外暴露的程度（原书 9.2 节，PDF 第 360 页）", "chapterId": "ch04"}, {"term": "缩放点积注意力（Scaled Dot-Product Attention）", "def": "评分函数 $a(q,k)=q^\top k/\\sqrt{d}$，把查询键点积除以键维度平方根以把点积方差压回 1；批量形式为 $\\mathrm{softmax}(QK^\top/\\sqrt d)V$（原书 10.3.3 节，PDF 第 415 页）", "chapterId": "ch04"}, {"term": "Adam 优化器", "def": "同时维护梯度一阶矩 $v_t$ 与二阶矩 $s_t$ 的自适应优化算法，用 $1-\beta_1^t$、$1-\beta_2^t$ 做偏差修正，再按 $v_t/\\sqrt{s_t}$ 缩放更新（原书 11.10 节，PDF 第 506 页）", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [], "flashcards": []}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.57<\/div><h1>第 1 章：预备知识与自动微分<\/h1>\n<blockquote>对应原书第 2 章 预备知识（PDF 第 57–102 页；印刷页 = PDF 页 − 18）。覆盖原书 2.1 数据操作、2.3 线性代数、2.4 微积分、2.5 自动微分、2.6 概率。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清一个张量每个维度的语义与形状含义，判断两个张量做逐元素运算时广播是否合法；\n<\/li><li>\n沿一条链式法则把复合函数的偏导数逐层写开，对照 PyTorch 张量的 <code>requires_grad<\/code>、<code>backward()<\/code>、<code>grad<\/code> 行为；\n<\/li><li>\n手算一个两层小计算图的前向数值与反向梯度，并解释非标量变量反向传播为什么要传 <code>gradient<\/code> 参数；\n<\/li><li>\n区分张量原地操作与复制操作对内存的影响，说清梯度为什么默认累积、何时必须清零。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>深度学习的一切计算都落在张量上：先把数据组织成带形状的多维数组，按广播规则做逐元素运算；框架在前向时记下操作链形成计算图，再用反向模式把损失对每个参数的梯度沿图反向累积出来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 张量：从标量到多维数组<\/h3>\n<p>原书 2.1 节从 <code>torch.arange(4.0)<\/code> 这类一维向量起步（PDF 第 58 页）。张量的阶由维度个数决定：标量是 0 阶，向量是 1 阶，矩阵是 2 阶，图像批量常是 4 阶张量（批量大小、通道、高、宽）。每个维度都要能回答“这一维上放的是什么”：批量维放样本，通道维放特征通道，空间维放位置。形状不同的张量做加减乘除时，框架按广播规则对齐，而不是要求两边形状完全一致。<\/p>\n<h3>2. 概念 1：张量与广播机制（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。广播从右往左逐维比对：两边该维长度相等，或其中一方为 1，就可以对齐；两维既不相等也不为 1，直接抛形状错误。本书 2.1.3 节给出广播示例（PDF 第 62 页）。除了形状合法性，原地操作会覆盖原张量内存，复制操作会另开内存；训练中反复更新同一参数时，预先分配梯度空间而不是每次新建张量，是内存管理的基本做法（原书 2.5.1 节，PDF 第 88 页）。<\/p>\n<h3>3. 线性代数与微积分：求导的两条工具<\/h3>\n<p>原书 2.3 节回顾标量、向量、矩阵、点积、矩阵乘法与范数（PDF 第 68 页起）；2.4 节给出导数、偏导数、梯度与链式法则（PDF 第 83 页前后）。梯度是把所有偏导数排成同形状向量；复合函数 <span class=\"katex-inline\">y=f(u(x))<\/span> 的导数按链式法则 <span class=\"katex-inline\">\\frac{\\partial y}{\\partial x}=\\frac{\\partial y}{\\partial u}\\frac{\\partial u}{\\partial x}<\/span> 逐层相乘。多变量链式法则的形式为：若 <span class=\"katex-inline\">y<\/span> 经中间变量 <span class=\"katex-inline\">u_1,\\dots,u_m<\/span> 依赖 <span class=\"katex-inline\">x_i<\/span>，则<\/p>\n<div class=\"katex-block\">\\frac{\\partial y}{\\partial x_i}=\\sum_{k=1}^{m}\\frac{\\partial y}{\\partial u_k}\\frac{\\partial u_k}{\\partial x_i}.<\/div>\n<p>这正是自动微分要机械化执行的规则。<\/p>\n<h3>4. 概念 2：自动微分的反向模式（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。原书 2.5 节说明：复杂模型手工求导既痛苦又易错，框架构建计算图跟踪“哪些数据通过哪些操作产生输出”，再反向传播把关于每个参数的偏导数填回去（PDF 第 87 页）。本书示例对 <span class=\"katex-inline\">y=2x^\\top x<\/span> 求导，<span class=\"katex-inline\">x=(0,1,2,3)<\/span>，<span class=\"katex-inline\">y=28<\/span>，反向后 <span class=\"katex-inline\">x.\\mathrm{grad}=(0,4,8,12)<\/span>，与解析结果 <span class=\"katex-inline\">4x<\/span> 一致（PDF 第 88 页）。<\/p>\n<h2>推导一（推演）：小计算图的前向数值与反向梯度手算<\/h2>\n<p>设输入标量 <span class=\"katex-inline\">x=1.5<\/span>，中间量 <span class=\"katex-inline\">a=x^2<\/span>，<span class=\"katex-inline\">b=a+2<\/span>，损失 <span class=\"katex-inline\">L=b^2<\/span>。<\/p>\n<p>前向：<span class=\"katex-inline\">a=1.5^2=2.25<\/span>；<span class=\"katex-inline\">b=2.25+2=4.25<\/span>；<span class=\"katex-inline\">L=4.25^2=18.0625<\/span>。<\/p>\n<p>反向从 <span class=\"katex-inline\">L<\/span> 往回走：<span class=\"katex-inline\">\\partial L/\\partial b=2b=8.5<\/span>；<span class=\"katex-inline\">\\partial b/\\partial a=1<\/span>，所以 <span class=\"katex-inline\">\\partial L/\\partial a=8.5\\times 1=8.5<\/span>；<span class=\"katex-inline\">\\partial a/\\partial x=2x=3<\/span>，所以 <span class=\"katex-inline\">\\partial L/\\partial x=8.5\\times 3=25.5<\/span>。<\/p>\n<p>对照链式法则整体式：<span class=\"katex-inline\">L=(x^2+2)^2<\/span>，展开求导得 <span class=\"katex-inline\">dL/dx=2(x^2+2)\\cdot 2x=4x(x^2+2)=4\\times1.5\\times4.25=25.5<\/span>，两种路径结果一致。这个例子说明反向模式做的事，就是把链式法则按计算图的边逐条执行，每条边只需要该局部的偏导数，不需要全局闭合形式。<\/p>\n<h2>推导二（推演）：非标量变量为什么要传 <code>gradient<\/code> 参数<\/h2>\n<p>当 <span class=\"katex-inline\">y<\/span> 不是标量时，<span class=\"katex-inline\">y<\/span> 关于 <span class=\"katex-inline\">x<\/span> 的导数在矩阵意义下是雅可比矩阵。训练时通常并不想存整张雅可比，而要的是“批量内每个样本损失偏导数之和”。原书 2.5.2 节给出示例：<span class=\"katex-inline\">y=x\\odot x<\/span>，<span class=\"katex-inline\">x=(0,1,2,3)<\/span>，调用 <code>y.sum().backward()<\/code> 等价于传入全 1 的梯度，反向后 <span class=\"katex-inline\">x.\\mathrm{grad}=(0,2,4,6)<\/span>（PDF 第 89 页）。<\/p>\n<p>逐项核对：对 <span class=\"katex-inline\">y_i=x_i^2<\/span>，<span class=\"katex-inline\">\\partial y_i/\\partial x_i=2x_i<\/span>，代入得 <span class=\"katex-inline\">(0,2,4,6)<\/span>。若直接对向量 <span class=\"katex-inline\">y<\/span> 调 <code>backward()<\/code> 而不传梯度，框架无法确定要对输出各分量做哪种线性组合，会报错；传入全 1 相当于求各分量偏导数之和。分离计算（<code>detach<\/code>）则把某段子图从记录中摘出，梯度不再流经它回到上游参数（PDF 第 89 页）。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>去掉广播、要求两边形状完全一致<\/strong>：每个批量样本都要手工把标量偏置扩成矩阵形状再相加，代码量随维度翻倍；更关键的是，扩写过程中容易把某一维对齐方向写反，得到形状看似合法、语义错位的结果。广播规则把“对齐”这件事变成可检查的固定规则，而不是靠人逐维度抄写。\n<\/li><li>\n<strong>前向时不记录计算图<\/strong>：没有图就没有每条边的局部偏导数，反向传播无从回溯；这时只能对每个参数单独重跑前向做数值差分，计算量随参数个数线性放大，且精度受浮点差分步长限制。\n<\/li><li>\n<strong>梯度不做清零就连续 backward<\/strong>：PyTorch 默认累积梯度，第二次 <code>backward()<\/code> 会把新梯度加到旧梯度上。原书示例在计算 <span class=\"katex-inline\">y=x.\\mathrm{sum()}<\/span> 之前先执行 <code>x.grad.zero_()<\/code>（PDF 第 89 页）；跳过这一步，参数更新方向混入上一轮残留，优化轨迹漂移。\n<\/li><li>\n<strong>把 detach 用在需要回传梯度的位置<\/strong>：若 <span class=\"katex-inline\">u=y.\\mathrm{detach}()<\/span> 后再参与损失，梯度只按 <span class=\"katex-inline\">u<\/span> 是常数处理，<span class=\"katex-inline\">y<\/span> 上游参数收不到梯度；需要训练上游时误用 detach，表现为对应层损失长期不动。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章是全书的计算底座：张量形状与广播贯穿后面所有层的前向传播；自动微分是第 2 章线性模型、MLP 训练循环里“算损失→反向→更新参数”这一步的引擎。下一章在这套张量与求导工具之上，先搭回归与分类的单层模型，再引入隐层与激活函数。<\/p>", "kind": "chapter", "title": "第 1 章：预备知识与自动微分（张量与广播、线性代数、微积分、自动微分、概率初步）"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.103<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：预备知识与自动微分（张量与广播、线性代数、微积分、自动微分、概率初步）<\/a><\/span><\/div><h1>第 2 章：线性模型与多层感知机<\/h1>\n<blockquote>对应原书第 3 章 线性神经网络、第 4 章 多层感知机、第 5 章 深度学习计算（PDF 第 103–234 页；印刷页 = PDF 页 − 18）。本章聚焦线性回归、softmax 回归、MLP 结构、过拟合与正则化、数值稳定性与参数初始化。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出线性回归模型与平方损失，推导出损失对权重的梯度，比较正规方程解析解与小批量梯度下降的适用条件；\n<\/li><li>\n说明分类问题为什么不用平方损失，写出 softmax 与交叉熵表达式并推出其梯度，解释数值上溢时的稳定实现；\n<\/li><li>\n证明“纯线性层堆叠再多层也退化为一层仿射变换”，说清非线性激活函数在其中的角色；\n<\/li><li>\n区分权重衰减、dropout、参数初始化三者的作用位置与机制差别，定位梯度消失与梯度爆炸的来源。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>单层仿射变换只能拟合线性关系；加入隐层与非线性激活后模型才有分段拟合能力，但随之而来的是过拟合、梯度尺度失控与对称冗余，需要正则化手段和初始化策略把训练稳住。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 线性回归：从模型到损失<\/h3>\n<p>原书 3.1 节给出线性回归的基本元素：模型 <span class=\"katex-inline\">\\hat y=\\mathbf w^\\top\\mathbf x+b<\/span>，平方损失 <span class=\"katex-inline\">l(\\mathbf w,b)=\\frac1n\\sum_{i=1}^n(\\hat y^{(i)}-y^{(i)})^2<\/span>（PDF 第 103–104 页）。回归任务的标签是连续数值，模型输出一个实数；训练通过最小化经验损失调整权重与偏置。3.2、3.3 节分别给出从零开始与简洁实现的训练循环：初始化参数、定义模型与损失、用优化算法更新参数、在小批量上迭代（PDF 第 106 页前后）。<\/p>\n<h3>2. 概念 3：线性回归的解析解与梯度下降（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。当设计矩阵 <span class=\"katex-inline\">X<\/span> 列满秩时，平方损失有闭式解 <span class=\"katex-inline\">\\mathbf w^*=(X^\\top X)^{-1}X^\\top\\mathbf y<\/span>，即正规方程；数据维数高、样本量大时求逆代价高，实践中多用小批量随机梯度下降沿损失面逐步逼近。<\/p>\n<h3>3. softmax 回归与交叉熵<\/h3>\n<p>原书 3.4 节处理多分类：输出 <span class=\"katex-inline\">q<\/span> 个未规范化预测（logit），经 softmax 变成非负且和为 1 的类别概率 <span class=\"katex-inline\">\\hat y_j=\\exp(o_j)/\\sum_k\\exp(o_k)<\/span>，再用交叉熵 <span class=\"katex-inline\">l=-\\sum_j y_j\\log\\hat y_j<\/span> 度量（PDF 第 125–126 页）。标签用独热编码表示，类别之间不假设自然顺序。<\/p>\n<h3>4. 概念 4：softmax 与交叉熵（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。交叉熵对正确类预测概率的梯度形式为 <span class=\"katex-inline\">\\partial l/\\partial o_j=\\hat y_j-y_j<\/span>：模型预测越准，梯度越接近 0。logit 数值很大时直接求幂会上溢，稳定实现先减去每行最大值再做 softmax。<\/p>\n<h3>5. 多层感知机与激活函数<\/h3>\n<p>原书 4.1 节在输入与输出之间插入一个或多个隐藏层，层间接非线性激活函数（PDF 第 145 页）。常用激活包括 ReLU、sigmoid、tanh 等；非线性把线性堆叠变成真正的多层模型。4.2、4.3 节给出从零实现与简洁实现；4.4 节讲训练误差与泛化误差、欠拟合与过拟合；4.5 节权重衰减；4.6 节暂退法（dropout）；4.7 节前向传播、反向传播与计算图；4.8 节数值稳定性与初始化。<\/p>\n<h3>6. 概念 5：MLP 与非线性激活（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。概念 6、7 分别覆盖正则化组合（<a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">c06<\/a>）与稳定性/初始化（<a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">c07<\/a>）。<\/p>\n<h2>推导一（推导）：平方损失对权重的梯度与正规方程<\/h2>\n<p>把 <span class=\"katex-inline\">n<\/span> 个样本排成设计矩阵 <span class=\"katex-inline\">X\\in\\mathbb R^{n\\times d}<\/span>，标签向量 <span class=\"katex-inline\">\\mathbf y\\in\\mathbb R^n<\/span>，模型输出 <span class=\"katex-inline\">\\hat{\\mathbf y}=X\\mathbf w<\/span>，忽略偏置项可把它并入权重与增广列。平方损失写作<\/p>\n<div class=\"katex-block\">L(\\mathbf w)=\\frac1n\\|X\\mathbf w-\\mathbf y\\|_2^2=\\frac1n(X\\mathbf w-\\mathbf y)^\\top(X\\mathbf w-\\mathbf y).<\/div>\n<p>展开：<span class=\"katex-inline\">L=\\frac1n(\\mathbf w^\\top X^\\top X\\mathbf w-2\\mathbf y^\\top X\\mathbf w+\\mathbf y^\\top\\mathbf y)<\/span>。对 <span class=\"katex-inline\">\\mathbf w<\/span> 求梯度，用二次型梯度公式 <span class=\"katex-inline\">\\nabla_{\\mathbf w}(\\mathbf w^\\top A\\mathbf w)=2A\\mathbf w<\/span>（<span class=\"katex-inline\">A<\/span> 对称），得<\/p>\n<div class=\"katex-block\">\\nabla_{\\mathbf w}L=\\frac2n(X^\\top X\\mathbf w-X^\\top\\mathbf y).<\/div>\n<p>令梯度为 0，<span class=\"katex-inline\">X^\\top X\\mathbf w=X^\\top\\mathbf y<\/span>；当 <span class=\"katex-inline\">X^\\top X<\/span> 可逆时，<span class=\"katex-inline\">\\mathbf w^*=(X^\\top X)^{-1}X^\\top\\mathbf y<\/span>。这就是正规方程。<\/p>\n<p>数值算例：单输入单输出，样本 <span class=\"katex-inline\">x=(1,2,3)<\/span>，标签 <span class=\"katex-inline\">y=(2,4,6)<\/span>。<span class=\"katex-inline\">X^\\top X=1+4+9=14<\/span>，<span class=\"katex-inline\">X^\\top y=2+8+18=28<\/span>，<span class=\"katex-inline\">w^*=28/14=2<\/span>，拟合直线 <span class=\"katex-inline\">\\hat y=2x<\/span>。梯度下降每步按 <span class=\"katex-inline\">\\mathbf w\\leftarrow\\mathbf w-\\eta\\nabla_{\\mathbf w}L<\/span> 更新；按损失面曲率推演，学习率 <span class=\"katex-inline\">\\eta<\/span> 过大在凸损失面上越过最低点来回震荡，过小则收敛缓慢。<\/p>\n<h2>推导二（推导）：为什么纯线性层堆叠会退化成一层<\/h2>\n<p>设第一层 <span class=\"katex-inline\">\\mathbf h=W_1\\mathbf x+\\mathbf b_1<\/span>，第二层 <span class=\"katex-inline\">\\mathbf o=W_2\\mathbf h+\\mathbf b_2<\/span>。代入得<\/p>\n<div class=\"katex-block\">\\mathbf o=W_2(W_1\\mathbf x+\\mathbf b_1)+\\mathbf b_2=(W_2W_1)\\mathbf x+(W_2\\mathbf b_1+\\mathbf b_2).<\/div>\n<p>令 <span class=\"katex-inline\">W&#x27;=W_2W_1<\/span>，<span class=\"katex-inline\">\\mathbf b&#x27;=W_2\\mathbf b_1+\\mathbf b_2<\/span>，则 <span class=\"katex-inline\">\\mathbf o=W&#x27;\\mathbf x+\\mathbf b&#x27;<\/span>，仍是单层仿射变换。再接第三层 <span class=\"katex-inline\">\\mathbf z=W_3\\mathbf o+\\mathbf b_3<\/span>，同样合并为 <span class=\"katex-inline\">W&#x27;&#x27;=W_3W&#x27;<\/span>、<span class=\"katex-inline\">\\mathbf b&#x27;&#x27;=W_3\\mathbf b&#x27;+\\mathbf b_3<\/span>。无论叠多少层线性变换，复合结果都等价于一个单层线性模型；隐层宽度再大也不增加函数类的表达能力。<\/p>\n<p>接入非线性激活 <span class=\"katex-inline\">\\phi<\/span> 后，<span class=\"katex-inline\">\\mathbf h=\\phi(W_1\\mathbf x+\\mathbf b_1)<\/span>，代入第二层得 <span class=\"katex-inline\">\\mathbf o=W_2\\phi(W_1\\mathbf x+\\mathbf b_1)+\\mathbf b_2<\/span>；沿这条复合路径推演，<span class=\"katex-inline\">\\phi<\/span> 破坏了矩阵乘法的可合并性，不同隐层单元在不同输入区域被激活，模型才具备分段拟合能力。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>去掉所有非线性激活<\/strong>：按推导二，三层 MLP 退化成单层线性模型；在异或、图像分类这类线性不可分任务上，训练误差与测试误差都压不下去，加宽隐藏层不改变结果。\n<\/li><li>\n<strong>去掉权重衰减、放任权重增大<\/strong>：高维线性回归中噪声特征的权重会被训练得很大以贴合训练样本波动，训练损失继续下降而测试损失回升；权重范数变大意味着决策边界在某些方向上剧烈摆动，泛化差距拉大（原书 4.5.1 节高维线性回归，PDF 第 167 页前后）。\n<\/li><li>\n<strong>把 dropout 留在推理阶段开启<\/strong>：推理时每个样本经过的子网络随机不同，输出带额外噪声；标准做法是训练时按概率置零并缩放，推理时关闭丢弃、用完整网络做确定性预测。若忘记把模型切到 eval 模式，BN 层同样会误用批量统计量（见第 3 章概念 c10）。\n<\/li><li>\n<strong>初始权重全部设成同一个常数<\/strong>：同一层各隐单元前向激活相同，反向梯度也相同，梯度下降后权重仍保持一致，对称性无法打破；网络实际只相当于一个单元（原书 4.8.1 节打破对称性，PDF 第 186 页）。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章把第 1 章的求导工具用在单层与浅层模型上：回归与分类损失的梯度是训练循环的核心，非线性激活是后面卷积层、循环层的共同组件。下一章转向图像数据，看卷积怎样利用局部性与参数共享替代全连接，以及批量归一化、残差连接怎样稳住深层网络的训练。<\/p>", "kind": "chapter", "title": "第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化）"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.235<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化）<\/a><\/span><\/div><h1>第 3 章：卷积网络与现代架构<\/h1>\n<blockquote>对应原书第 6 章 卷积神经网络、第 7 章 现代卷积神经网络（PDF 第 235–306 页；印刷页 = PDF 页 − 18）。覆盖卷积与互相关、填充与步幅、多通道、汇聚层、LeNet、AlexNet、VGG、NiN、GoogLeNet、批量归一化、ResNet、DenseNet。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按输入尺寸、核尺寸、填充、步幅推出卷积输出形状，逐层累积感受野，说清卷积相对全连接层的参数共享与局部连接；\n<\/li><li>\n解释最大汇聚/平均汇聚带来的平移不变性与信息损失，说明为什么不能简单用大步幅卷积替代池化；\n<\/li><li>\n写出批量归一化的标准化与可学习拉伸/偏移公式，区分训练模式与预测模式下统计量的来源；\n<\/li><li>\n梳理 LeNet→AlexNet→VGG→ResNet 的结构演进，说明残差连接怎样缓解深层梯度传播问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>卷积用局部窗口滑动加参数复用提取空间特征，池化逐步降采样并减弱位置敏感性；批量归一化把每层激活拉回稳定尺度，残差连接给梯度一条直达浅层的捷径，现代卷积网络在这条主线上不断加深加宽。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 从全连接到卷积<\/h3>\n<p>原书 6.1 节指出全连接层处理图像时忽略了相邻像素的局部关联，参数开销随图像尺寸爆炸（PDF 第 236 页）。6.2 节用互相关运算定义卷积层：核张量在输入上滑动，窗口内对应元素相乘求和得到输出（PDF 第 241 页）。同一个卷积核在所有空间位置复用，这就是参数共享；每个输出只看输入的一个局部窗口，这就是局部连接。<\/p>\n<h3>2. 概念 8：卷积与参数共享、感受野（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。填充在边界补 0 防止边缘像素反复丢失；步幅控制窗口滑动间隔。多输入通道要跨通道求和，多输出通道每组核学一类特征；<span class=\"katex-inline\">1\\times1<\/span> 卷积只做通道维融合，不改空间位置。<\/p>\n<h3>3. 概念 9：池化与下采样（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。6.5 节给出最大汇聚与平均汇聚：窗口内取最大值或平均值，汇聚层没有可学习参数（PDF 第 254 页）。池化同时承担降低空间分辨率、减弱位置敏感性两个作用。<\/p>\n<h3>4. 现代网络谱系<\/h3>\n<p>6.6 节 LeNet 是“卷积—汇聚—卷积—汇聚—全连接”的早期样板（PDF 第 262 页前后）；7.1 节 AlexNet 用更深网络、ReLU 与 GPU 训练推动深度学习突破；7.2 节 VGG 用重复堆叠的 VGG 块统一架构风格；7.3 节 NiN 用 <span class=\"katex-inline\">1\\times1<\/span> 卷积嵌入通道信息融合；7.4 节 GoogLeNet 用并行 Inception 块多尺度提取；7.6 节 ResNet 引入残差块；7.7 节 DenseNet 稠密连接各层。<\/p>\n<h3>5. 概念 10：批量归一化（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。7.5 节给出 BN 公式 <span class=\"katex-inline\">\\mathrm{BN}(x)=\\gamma\\odot(\\hat x-\\hat\\mu_B)/\\hat\\sigma_B+\\beta<\/span>，<span class=\"katex-inline\">\\gamma,\\beta<\/span> 随模型参数学习；训练用当前小批量统计量并维护移动平均，推理切换为移动平均（PDF 第 287–289 页）。<\/p>\n<h2>推导一（推导）：卷积输出尺寸公式与感受野累积<\/h2>\n<p>设输入空间尺寸为 <span class=\"katex-inline\">n_h\\times n_w<\/span>，卷积核 <span class=\"katex-inline\">k_h\\times k_w<\/span>，填充 <span class=\"katex-inline\">p_h,p_w<\/span>，步幅 <span class=\"katex-inline\">s_h,s_w<\/span>。每个输出位置对应一个核窗口，窗口起点沿高度从 0 走到 <span class=\"katex-inline\">(n_h+2p_h-k_h)<\/span>，步长 <span class=\"katex-inline\">s_h<\/span>，可放置的窗口个数为<\/p>\n<div class=\"katex-block\">o_h=\\left\\lfloor\\frac{n_h+2p_h-k_h}{s_h}\\right\\rfloor+1,\\quad o_w=\\left\\lfloor\\frac{n_w+2p_w-k_w}{s_w}\\right\\rfloor+1.<\/div>\n<p>无填充无步幅时 <span class=\"katex-inline\">o_h=n_h-k_h+1<\/span>，与原书 6.3 节给出的 <span class=\"katex-inline\">3\\times3<\/span> 输入、<span class=\"katex-inline\">2\\times2<\/span> 核得到 <span class=\"katex-inline\">2\\times2<\/span> 输出一致（PDF 第 246 页）。<\/p>\n<p>感受野算例：输入 <span class=\"katex-inline\">32\\times32<\/span>，第一层 <span class=\"katex-inline\">5\\times5<\/span> 卷积、步幅 1、无填充，输出 <span class=\"katex-inline\">28\\times28<\/span>，每个输出单元感受野 <span class=\"katex-inline\">5\\times5<\/span>；第二层 <span class=\"katex-inline\">3\\times3<\/span> 卷积、步幅 1，输出 <span class=\"katex-inline\">26\\times26<\/span>，第二层每个单元对应第一层 <span class=\"katex-inline\">3\\times3<\/span> 窗口，回放到输入即覆盖 <span class=\"katex-inline\">(5+3-1)\\times(5+3-1)=7\\times7<\/span> 区域；再接一个 <span class=\"katex-inline\">3\\times3<\/span>、步幅 1 的卷积，感受野扩到 <span class=\"katex-inline\">7+3-1=9<\/span>。沿这条递推关系逐层推演，步幅为 <span class=\"katex-inline\">s<\/span> 时上一层感受野按步幅放大：若上一层感受野 <span class=\"katex-inline\">r_{l-1}<\/span>，当前层核 <span class=\"katex-inline\">k<\/span>、步幅 <span class=\"katex-inline\">s<\/span>，则 <span class=\"katex-inline\">r_l=s\\cdot r_{l-1}+(k-1)<\/span>。<\/p>\n<h2>推导二（推演）：残差块为什么能让深层网络训得动<\/h2>\n<p>普通块直接学 <span class=\"katex-inline\">\\mathcal F(x)=\\mathrm{block}(x)<\/span>；残差块改学残差 <span class=\"katex-inline\">\\mathcal F(x)=\\mathrm{block}(x)<\/span>，输出 <span class=\"katex-inline\">h=x+\\mathcal F(x)<\/span>（原书 7.6.2 节，PDF 第 295 页）。反向传播时，损失对 <span class=\"katex-inline\">x<\/span> 的梯度为<\/p>\n<div class=\"katex-block\">\\frac{\\partial h}{\\partial x}=I+\\frac{\\partial\\mathcal F(x)}{\\partial x}.<\/div>\n<p>按反向梯度通路推演，恒等矩阵 <span class=\"katex-inline\">I<\/span> 让梯度不必整段穿过块内卷积与激活；即使 <span class=\"katex-inline\">\\partial\\mathcal F/\\partial x<\/span> 很小，梯度仍有 <span class=\"katex-inline\">I<\/span> 这条通路回传。对照普通块，梯度完全依赖块内各层连乘，层数一多就趋于消失。ResNet 由此把网络深度推到上百层；DenseNet 进一步把各层特征图按通道拼接，建立跨层的特征复用通路（原书 7.7 节，PDF 第 299 页前后）。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>去掉批量归一化<\/strong>：深层各层激活的均值与方差随训练漂移，某层输入尺度偏大或偏小时，下游层要么饱和要么信号微弱；训练对初始化与学习率更敏感，深层网络更容易出现梯度爆炸或收敛停滞。原书也指出批量大小在使用 BN 时比无 BN 时更关键，批量为 1 时减去均值后每个隐藏单元都为 0，学不到东西（PDF 第 287 页）。\n<\/li><li>\n<strong>用大步幅卷积替代池化做下采样<\/strong>：大步幅卷积同时改变特征提取与分辨率，但它仍带可学习权重，会把降采样与特征选择耦合在一起；池化是无参数的确定性聚合，只做分辨率与不变性处理。两者混用时，下采样丢失的细节由卷积权重决定，缺乏池化那种对窗口内最显著响应的稳定保留。\n<\/li><li>\n<strong>去掉残差连接、把百层网络当普通串联块训练<\/strong>：梯度沿百层连乘后趋近 0，浅层权重几乎不更新，训练误差降不下去；加深不仅没带来容量收益，反而比浅层网络更难收敛。\n<\/li><li>\n<strong>通道维度不加约束、堆全连接层做图像分类<\/strong>：全连接把每个空间位置的像素都与输出全连接，参数量随图像边长平方增长；卷积共享核权重后参数规模与空间尺寸脱钩，这是卷积替代全连接的直接理由。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章的卷积、池化、归一化与残差组件，是第 4 章序列模型之外所有视觉结构的积木；注意力机制在第 4 章登场时，会被拿来与卷积对比局部性、并行性与路径长度（原书 10.6.2 节，PDF 第 430 页前后）。<\/p>", "kind": "chapter", "title": "第 3 章：卷积网络与现代架构（卷积与池化、LeNet、AlexNet/VGG/ResNet、批量归一化）"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.307<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：卷积网络与现代架构（卷积与池化、LeNet、AlexNet/VGG/ResNet、批量归一化）<\/a><\/span><\/div><h1>第 4 章：循环网络、注意力与优化<\/h1>\n<blockquote>对应原书第 8 章 循环神经网络、第 9 章 现代循环神经网络、第 10 章 注意力机制、第 11 章 优化算法（PDF 第 307–520 页；印刷页 = PDF 页 − 18）。第 12 章 计算性能只在涉及训练效率处顺带提及，不展开。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★★ | <strong>前置<\/strong>：第 3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 RNN 的隐状态递归式，推导通过时间反向传播（BPTT）的梯度结构，指出长依赖下梯度消失/爆炸的连乘来源；\n<\/li><li>\n逐个门推演 GRU 的重置门/更新门与 LSTM 的输入门/遗忘门/输出门各自控制什么，给出门值极端情形下的状态变化；\n<\/li><li>\n推出查询—键点积的方差随维度 <span class=\"katex-inline\">d<\/span> 增长，说明缩放点积注意力为何除以 <span class=\"katex-inline\">\\sqrt d<\/span>，并说出自注意力相对 CNN/RNN 的并行性与路径长度特征；\n<\/li><li>\n对比 SGD、动量法、Adam 的状态变量与更新公式，解释 Adam 偏差修正为什么必要。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>RNN 用隐状态沿时间步传递信息，反向传播把梯度沿时间链回溯；门控结构为长记忆提供选择性保留通道；注意力按相关性对值加权聚合，Transformer 完全建立在自注意力之上；优化算法在梯度方向之上叠加历史动量与逐坐标自适应缩放。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 序列模型与 RNN 结构<\/h3>\n<p>原书 8.1 节先讲序列数据的统计工具与预测，8.2 节文本预处理（词元化、词表），8.3 节语言模型与马尔可夫假设，8.4 节给出有隐状态的循环网络：<span class=\"katex-inline\">h_t=f(x_t,h_{t-1},w_h)<\/span>，<span class=\"katex-inline\">o_t=g(h_t,w_o)<\/span>（PDF 第 330 页）。隐状态把过去观测压缩进当前表示，使模型处理 <span class=\"katex-inline\">x_t<\/span> 时能参考之前的词元。8.5、8.6 节给出从零实现与简洁实现，8.5.5 节讲梯度裁剪。<\/p>\n<h3>2. 概念 11：RNN 与通过时间反向传播（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c11.md\" target=\"_blank\" rel=\"noopener\">概念 c11<\/a>。8.7 节把损失对参数 <span class=\"katex-inline\">w_h<\/span> 的梯度拆成各时间步贡献之和，<span class=\"katex-inline\">\\partial h_t/\\partial w_h<\/span> 满足递归式，展开后是一串雅可比矩阵连乘（PDF 第 347–350 页）。<\/p>\n<h3>3. 门控 RNN：GRU 与 LSTM<\/h3>\n<p>普通 RNN 沿时间链传播时梯度容易消失或爆炸，长程依赖学不到。9.1 节 GRU 引入重置门与更新门（PDF 第 353 页）；9.2 节 LSTM 引入输入门、遗忘门、输出门与记忆元（PDF 第 360 页）。<\/p>\n<h3>4. 概念 12：LSTM/GRU 门控（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c12.md\" target=\"_blank\" rel=\"noopener\">概念 c12<\/a>。门输出在 <span class=\"katex-inline\">(0,1)<\/span> 区间，按凸组合比例控制旧状态保留、候选状态写入与记忆元对外暴露。<\/p>\n<h3>5. 注意力与 Transformer<\/h3>\n<p>10.1 节提示注意力评分，10.3 节给出加性注意力与缩放点积注意力（PDF 第 411、415 页）；10.4 节 Bahdanau 注意力把上下文向量换成注意力加权；10.5 节多头注意力；10.7 节 Transformer 编码器—解码器结构：多头自注意力子层加位置前馈网络，子层采用残差连接与层规范化，输入嵌入加位置编码（PDF 第 431–432 页）。<\/p>\n<h3>6. 概念 13：注意力与 Transformer（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c13.md\" target=\"_blank\" rel=\"noopener\">概念 c13<\/a>。10.6.2 节对比 CNN、RNN 与自注意力：自注意力并行计算、最大路径长度最短，但复杂度关于序列长度二次方。<\/p>\n<h3>7. 优化算法<\/h3>\n<p>11.1 节区分优化目标与深度学习目标：经验风险最小不等于泛化风险最小（PDF 第 446 页）。11.4 节随机梯度下降，11.5 节小批量随机梯度下降，11.6 节动量法，11.7 节 AdaGrad，11.10 节 Adam（PDF 第 469、484、506 页）。<\/p>\n<h3>8. 概念 14：SGD、动量法与 Adam（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c14.md\" target=\"_blank\" rel=\"noopener\">概念 c14<\/a>。<\/p>\n<h2>推导一（推导）：BPTT 梯度的递归结构与连乘来源<\/h2>\n<p>按原书 8.7.1 节的简化记号，隐状态与输出为<\/p>\n<div class=\"katex-block\">h_t=f(x_t,h_{t-1},w_h),\\quad o_t=g(h_t,w_o),<\/div>\n<p>总损失 <span class=\"katex-inline\">L=\\frac1T\\sum_{t=1}^T l(y_t,o_t)<\/span>。对 <span class=\"katex-inline\">w_h<\/span> 求偏导，按链式法则<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_h}=\\frac1T\\sum_{t=1}^T\\frac{\\partial l(y_t,o_t)}{\\partial o_t}\\frac{\\partial g(h_t,w_o)}{\\partial h_t}\\frac{\\partial h_t}{\\partial w_h}.<\/div>\n<p>关键项 <span class=\"katex-inline\">\\partial h_t/\\partial w_h<\/span> 满足递归：<span class=\"katex-inline\">h_t<\/span> 既直接依赖 <span class=\"katex-inline\">w_h<\/span>，又经 <span class=\"katex-inline\">h_{t-1}<\/span> 间接依赖 <span class=\"katex-inline\">w_h<\/span>，故<\/p>\n<div class=\"katex-block\">\\frac{\\partial h_t}{\\partial w_h}=\\frac{\\partial f(x_t,h_{t-1},w_h)}{\\partial w_h}+\\frac{\\partial f(x_t,h_{t-1},w_h)}{\\partial h_{t-1}}\\frac{\\partial h_{t-1}}{\\partial w_h}.<\/div>\n<p>展开到起点，<span class=\"katex-inline\">\\partial h_t/\\partial w_h<\/span> 中包含 <span class=\"katex-inline\">\\prod_{j=i+1}^{t}\\partial f/\\partial h_{j-1}<\/span> 这样的连乘项（原书公式 8.7.5，PDF 第 348 页）。若各步雅可比的特征值长期小于 1，乘积随时间步指数衰减，梯度消失；若大于 1，乘积指数放大，梯度爆炸。这正是普通 RNN 难学长程依赖的数学来源：信息从第 1 步传到第 <span class=\"katex-inline\">T<\/span> 步，梯度要反向穿过同样长度的连乘链。<\/p>\n<h2>推导二（推演）：点积方差随 <span class=\"katex-inline\">d<\/span> 增长，以及缩放的依据<\/h2>\n<p>设查询 <span class=\"katex-inline\">q\\in\\mathbb R^d<\/span>、键 <span class=\"katex-inline\">k\\in\\mathbb R^d<\/span>，各分量独立、零均值、单位方差。点积 <span class=\"katex-inline\">a=q^\\top k=\\sum_{i=1}^d q_i k_i<\/span>。<span class=\"katex-inline\">E[q_i k_i]=E[q_i]E[k_i]=0<\/span>；方差 <span class=\"katex-inline\">q_i k_i<\/span> 为 <span class=\"katex-inline\">E[q_i^2]E[k_i^2]=1<\/span>。各分量独立，和的方差可加：<\/p>\n<div class=\"katex-block\">\\mathrm{Var}(a)=\\sum_{i=1}^d \\mathrm{Var}(q_i k_i)=d.<\/div>\n<p>维度 <span class=\"katex-inline\">d<\/span> 越大，点积的波动幅度越随 <span class=\"katex-inline\">\\sqrt d<\/span> 增大；未经缩放时，点积数值被推得很大，softmax 进入饱和区，梯度趋近 0。除以 <span class=\"katex-inline\">\\sqrt d<\/span> 后方差回到 1：<span class=\"katex-inline\">\\mathrm{Var}(q^\\top k/\\sqrt d)=d/d=1<\/span>，评分分布保持在 softmax 敏感区间。批量形式 <span class=\"katex-inline\">\\mathrm{softmax}(QK^\\top/\\sqrt d)V<\/span> 即原书公式 10.3.5（PDF 第 415 页）。<\/p>\n<h2>反事实：改掉条件会怎样<\/h2>\n<ul><li>\n<strong>普通 RNN 去掉门控、直接把隐状态递归连到底<\/strong>：梯度沿整条时间链连乘，长序列上要么消失要么爆炸；遇到逻辑中断或无关词元时没有通道跳过观测，隐状态被噪声逐步冲刷。GRU/LSTM 的门就是在这条链上加选择性通路（见概念 c12）。\n<\/li><li>\n<strong>注意力评分不做缩放<\/strong>：<span class=\"katex-inline\">d<\/span> 较大时点积方差为 <span class=\"katex-inline\">d<\/span>，softmax 输入绝对值很大，输出接近 one-hot，梯度回传时被饱和区压住；训练前期更新缓慢，且不同维度规模的模型表现不可比。\n<\/li><li>\n<strong>Adam 不做偏差修正<\/strong>：一阶矩、二阶矩初始化为 0，前几个时间步的矩估计被零初值拖低；尤其二阶矩偏小会让更新步长虚高，初期参数震荡。除以 <span class=\"katex-inline\">1-\\beta_1^t<\/span>、<span class=\"katex-inline\">1-\\beta_2^t<\/span> 正是把早期估计的偏差补回来（原书公式 11.10.2，PDF 第 507 页）。\n<\/li><li>\n<strong>把动量法和逐坐标自适应缩放拆成两种极端<\/strong>：纯 SGD 在狭长损失面上沿浅方向来回震荡、下降缓慢；动量法累积历史梯度抵消震荡，自适应方法按坐标曲率缩放步长；Adam 把两者合在同一状态里，但原书也提示 Adam 在方差控制不良时可能发散（PDF 第 507 页）。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章把第 1 章的自动微分用于时间维度与注意力权重，把第 2 章的损失梯度更新推进到带状态、带自适应步长的优化器。至此全书主干闭合：预备工具→单层/浅层模型→视觉卷积结构→序列与注意力→训练优化；第 13、14 章的计算机视觉与自然语言处理应用，都是在这些组件上拼装任务管线。<\/p>", "kind": "chapter", "title": "第 4 章：循环网络、注意力与优化（RNN 与时间反向传播、LSTM/GRU、注意力与 Transformer、优化算法）"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.58<\/div><h1>张量与广播机制：形状语义、广播规则与内存占用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章（原书 2.1 数据操作、2.1.3 广播机制，PDF 第 58、62 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>神经网络的输入、权重、激活值都是多维数组。写代码时最常见的错误不是算法错，而是形状对不上：两个张量相加时某一维长度不一致，程序直接报错；或者更隐蔽的情况——形状看似合法，但对齐方向写反，得到语义错位的结果。张量概念要回答三件事：每个维度上放的是什么、两个张量做逐元素运算时按什么规则对齐、运算过程中哪里另开内存哪里覆盖原张量。不先建立形状语义，后面卷积输出尺寸、批量矩阵乘法、注意力批量计算都会读不懂。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>张量（Tensor）<\/strong>：按多维数组组织数值的结构。阶数是维度个数：标量 0 阶，向量 1 阶，矩阵 2 阶，图像批量常为 4 阶（批量大小、通道数、高度、宽度）。形状（shape）是各维度长度组成的元组，例如 <code>(32, 1, 28, 28)<\/code> 表示 32 个样本、1 个通道、28×28 空间尺寸。<\/p>\n<p><strong>逐元素运算<\/strong>：加减乘除、幂、比较等运算对两个张量的对应位置元素分别执行。它不做矩阵乘法，也不归约任何维度；输出形状与参与运算的张量形状一致（广播对齐后）。<\/p>\n<p><strong>广播规则（Broadcasting）<\/strong>：两个形状不同的张量做逐元素运算时，框架从右往左逐维比对：<\/p>\n<ol><li>\n两边该维长度相等，对齐；\n<\/li><li>\n其中一方长度为 1，把该维复制扩展到与另一方同长，参与广播；\n<\/li><li>\n两维既不相等也不为 1，形状不合法，抛出错误。\n<p>若某个张量维度个数较少，缺失的左侧维度补 1 再比对。<\/p>\n<\/ol>\n<p><strong>原地操作与复制操作<\/strong>：原地操作在原张量内存上改写内容；复制操作分配新张量保存结果。训练中反复更新同一参数时，梯度空间预先分配而不是每次新建张量，否则内存会被快速耗尽（原书 2.5.1 节，PDF 第 88 页）。<\/p>\n<p>正例：<code>(3,1)<\/code> 与 <code>(1,4)<\/code> 相加。最右维 1 与 4 合法（1 扩成 4），次右维 3 与 1 合法（1 扩成 3），结果形状 <code>(3,4)<\/code>。反例：<code>(3,2)<\/code> 与 <code>(3,4)<\/code> 相加，最右维 2 与 4 既不等也不为 1，报错。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>广播的本质是“缺失维度用复制补齐”。设张量 <span class=\"katex-inline\">A<\/span> 形状 <span class=\"katex-inline\">(3,1)<\/span>，张量 <span class=\"katex-inline\">B<\/span> 形状 <span class=\"katex-inline\">(1,4)<\/span>。先补左侧：<span class=\"katex-inline\">B<\/span> 视为 <span class=\"katex-inline\">(1,1,4)<\/span> 不影响比较；第一维 <span class=\"katex-inline\">3<\/span> 与 <span class=\"katex-inline\">1<\/span>，把 <span class=\"katex-inline\">B<\/span> 沿第一维复制 3 份；第二维 <span class=\"katex-inline\">1<\/span> 与 <span class=\"katex-inline\">4<\/span>，把 <span class=\"katex-inline\">A<\/span> 沿第二维复制 4 份。补齐后两边都是 <span class=\"katex-inline\">(3,4)<\/span>，再逐元素相加。<\/p>\n<p>内存推演：广播扩展不真的复制底层数据，框架在索引时按广播规则映射位置；但一旦运算产生输出，输出会按补齐后的形状分配内存。标量与矩阵相加时，标量在每个位置复用同一个值，不需要把标量扩成整张矩阵再存。<\/p>\n<p>代码行为对照（原书 2.1.3 节思路，PDF 第 62 页）：<\/p>\n<pre class=\"lang-python\"><code>import torch\na = torch.arange(3).reshape(3, 1)\nb = torch.arange(4).reshape(1, 4)\nc = a + b          # 形状 (3, 4)，广播后逐元素相加\na.shape, b.shape, c.shape<\/code><\/pre>\n<p>原地改写成 <code>a += b<\/code> 时，<code>a<\/code> 的内存被覆盖，原内容丢失；<code>a = a + b<\/code> 则产出新张量，<code>a<\/code> 指向新内存。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：逐元素运算；参与运算的张量在每个维度上满足相等或一方为 1。广播不改变数据类型，整数与浮点混合时按类型提升规则处理。\n<\/li><li>\n失败案例一：<code>(2,3)<\/code> 加 <code>(3,)<\/code>。右侧比对：3 与 2 不等且都不为 1，报错；正确做法是先 <code>reshape<\/code> 成 <code>(2,1)<\/code> 再广播，明确补的是哪一维。\n<\/li><li>\n失败案例二：把“广播合法”误当成“语义正确”。例如权重形状 <code>(d,)<\/code> 与批量矩阵输出 <code>(n,d)<\/code> 相加时，若本意是按列加偏置，广播方向必须是右侧对齐；方向反了不会报错，但每个样本加的偏置错位。\n<\/li><li>\n边界：广播只解决逐元素对齐；矩阵乘法要求左边列数等于右边行数，不归由广播规则处理。高维张量的广播维数较多时，建议打印双方形状逐维核对，不要凭直觉写。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>广播 vs 矩阵乘法<\/strong>：广播是逐元素运算的对齐规则，输出不做跨位置求和；矩阵乘法是跨列/跨行的加权聚合，维度约束是“左列数 = 右行数”。两者常配合出现：<span class=\"katex-inline\">XW<\/span> 是矩阵乘法，结果再加偏置 <span class=\"katex-inline\">\\mathbf b<\/span> 时走广播。\n<\/li><li>\n<strong>广播扩展 vs 真实复制<\/strong>：广播在索引层面映射位置，不预先把 1 维填满；真实复制（如 <code>expand<\/code> 后再接有副作用操作）才产生独立数据。判断是否会重复占内存，要看后续是否生成新输出张量。\n<\/li><li>\n<strong>原地操作 vs 别名引用<\/strong>：原地改写改的是原张量；把一个张量赋值给新变量只是增加别名，两个名字指向同一内存，改其中一个另一个跟着变。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无，本章起点。后继：概念 c02 在张量之上接自动微分；概念 c03 的批量线性模型里，设计矩阵 <span class=\"katex-inline\">X<\/span> 与权重 <span class=\"katex-inline\">\\mathbf w<\/span> 的乘法、偏置广播会反复用到本章规则；卷积层、注意力批量计算的形状推演也以本章广播与形状语义为基础。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（张量与广播机制：形状语义、广播规则与内存占用）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：张量形状、广播规则与内存行为的逐维推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要判断两个张量能否做逐元素运算，先往回追四层前提：<\/p>\n<ol><li>\n运算类型先分清：是逐元素运算还是矩阵乘法。逐元素运算才有广播规则适用；矩阵乘法的维度约束是另一条链条。本片段只处理逐元素运算。\n<\/li><li>\n每个张量的形状必须能逐维读出来。形状是各维度长度的有序元组，顺序不能换：图像批量 <code>(N,C,H,W)<\/code> 中 <span class=\"katex-inline\">N<\/span> 是批量、<span class=\"katex-inline\">C<\/span> 是通道、<span class=\"katex-inline\">H,W<\/span> 是空间位置；把通道维和批量维调换，数值含义全变。\n<\/li><li>\n两个张量维数不一致时，先在较短形状左侧补 1，再从最右维开始向左比对。补 1 只是比对手段，不代表张量真实多了一维。\n<\/li><li>\n比对到每一维时，合法条件只有两种：长度相等，或其中一方为 1。其余组合都不合法。\n<\/ol>\n<p>依赖链方向：运算类型判定 → 读出双方形状 → 左补 1 对齐维数 → 逐维检验合法条件 → 补齐形状后逐元素计算 → 判断输出内存分配方式。任何一层前提缺失，写出的形状公式都可能错位。<\/p>\n<h2>正向推导：广播算法逐步执行<\/h2>\n<h3>第一步：写清双方形状与维度语义<\/h3>\n<p>设 <span class=\"katex-inline\">A\\in\\mathbb R^{3\\times1}<\/span>，三行一列；<span class=\"katex-inline\">B\\in\\mathbb R^{1\\times4}<\/span>，一行四列。<span class=\"katex-inline\">A<\/span> 的列维长度为 1，表示该维上只有一个共享值；<span class=\"katex-inline\">B<\/span> 的行维长度为 1，表示该行只有一个共享值。<\/p>\n<h3>第二步：左补 1 对齐维数<\/h3>\n<p><span class=\"katex-inline\">A<\/span> 形状 <span class=\"katex-inline\">(3,1)<\/span>，<span class=\"katex-inline\">B<\/span> 形状 <span class=\"katex-inline\">(1,4)<\/span>，维数相同，无需补 1。若换成 <span class=\"katex-inline\">A<\/span> 形状 <span class=\"katex-inline\">(3,1)<\/span>、<span class=\"katex-inline\">B<\/span> 形状 <span class=\"katex-inline\">(4,)<\/span>，则 <span class=\"katex-inline\">B<\/span> 视为 <span class=\"katex-inline\">(1,4)<\/span> 后再比对。<\/p>\n<h3>第三步：从右往左逐维检验<\/h3>\n<p>最右维：<span class=\"katex-inline\">A<\/span> 为 1，<span class=\"katex-inline\">B<\/span> 为 4。一方为 1，合法，该维补齐到 4。 次右维：<span class=\"katex-inline\">A<\/span> 为 3，<span class=\"katex-inline\">B<\/span> 为 1。一方为 1，合法，该维补齐到 3。 补齐后双方形状都是 <span class=\"katex-inline\">(3,4)<\/span>。<\/p>\n<h3>第四步：补齐语义<\/h3>\n<p><span class=\"katex-inline\">A<\/span> 在第二维（列维）复制 4 份：原第一列四个位置的值分别在四列复用；<span class=\"katex-inline\">B<\/span> 在第一维（行维）复制 3 份：原第一行四个值分别在三行复用。补齐后的张量与原张量共享底层数值，广播层不预先填满内存。<\/p>\n<h3>第五步：逐元素计算<\/h3>\n<p><span class=\"katex-inline\">C_{ij}=A_{i1}+B_{1j}<\/span>。输出按 <span class=\"katex-inline\">(3,4)<\/span> 分配内存，因为结果需要保存 12 个独立位置的值；广播阶段的复用不产生第二份底层数据。<\/p>\n<h3>第六步：内存行为判定<\/h3>\n<ul><li>\n表达式 <code>A + B<\/code>：输出新张量，<code>A<\/code>、<code>B<\/code> 底层不变。\n<\/li><li>\n表达式 <code>A += B<\/code>：原地改写 <code>A<\/code>，<code>A<\/code> 原内容被覆盖；若别处还有别名指向 <code>A<\/code>，读到的是改写后的值。\n<\/li><li>\n表达式 <code>A = A + B<\/code>：右侧生成新张量，<code>A<\/code> 名字改指新内存，旧张量若无别名引用则待回收。\n<\/ul>\n<h2>数值算例<\/h2>\n<h3>算例 1：广播加法的具体数值<\/h3>\n<p><span class=\"katex-inline\">A=\\begin{pmatrix}0\\\\1\\\\2\\end{pmatrix}<\/span>，<span class=\"katex-inline\">B=\\begin{pmatrix}0&amp;1&amp;2&amp;3\\end{pmatrix}<\/span>。 补齐后逐位相加：<\/p>\n<div class=\"katex-block\">C=\\begin{pmatrix}0+0&0+1&0+2&0+3\\\\1+0&1+1&1+2&1+3\\\\2+0&2+1&2+2&2+3\\end{pmatrix}=\\begin{pmatrix}0&1&2&3\\\\1&2&3&4\\\\2&3&4&5\\end{pmatrix}.<\/div>\n<p>核对第一行：<span class=\"katex-inline\">A<\/span> 第一行值为 0，四列复用；第一列 <span class=\"katex-inline\">B<\/span> 值为 0，三行复用。<span class=\"katex-inline\">C_{23}=1+2=3<\/span>，<span class=\"katex-inline\">C_{34}=2+3=5<\/span>，与表格一致。<\/p>\n<h3>算例 2：不合法形状与修正路径<\/h3>\n<p><span class=\"katex-inline\">A<\/span> 形状 <span class=\"katex-inline\">(2,3)<\/span>，<span class=\"katex-inline\">B<\/span> 形状 <span class=\"katex-inline\">(3,)<\/span>。右侧比对：<span class=\"katex-inline\">B<\/span> 视为 <span class=\"katex-inline\">(1,3)<\/span>，最右维 3 与 3 相等；次右维 2 与 1，一方为 1 本应合法——这一组合实际合法，结果形状 <span class=\"katex-inline\">(2,3)<\/span>。 真正不合法的例子：<span class=\"katex-inline\">A<\/span> 形状 <span class=\"katex-inline\">(2,3)<\/span>，<span class=\"katex-inline\">B<\/span> 形状 <span class=\"katex-inline\">(2,4)<\/span>。最右维 3 与 4，既不等也不为 1，抛形状错误。修正要先明确意图：若本意是给每行加一组长度 4 的权重，应检查 <span class=\"katex-inline\">A<\/span> 列数是否写成 3；若本意是列方向加偏置，应把 <span class=\"katex-inline\">B<\/span> <code>reshape<\/code> 成 <span class=\"katex-inline\">(2,1)<\/span>，让次右维走 1 维广播。<\/p>\n<h3>代码片段：形状核对与原地操作<\/h3>\n<pre class=\"lang-python\"><code>import torch\nA = torch.arange(6).reshape(2, 3)\nB = torch.arange(3).reshape(1, 3)\nprint(A.shape, B.shape, (A + B).shape)   # torch.Size([2,3]) ... [1,3]) ... [2,3])\nA += B\nprint(A.shape)                            # 原地改写，形状不变<\/code><\/pre>\n<p><code>A += B<\/code> 不改变形状；若右侧广播结果形状与左侧不兼容（例如 <code>(2,3)<\/code> 加 <code>(2,4)<\/code>），原地操作同样会报错，不会静默截断。<\/p>\n<h2>延伸推演<\/h2>\n<h3>广播与参数数量无关<\/h3>\n<p>广播不复制可学习参数。偏置向量形状 <span class=\"katex-inline\">(d,)<\/span>，与批量输出 <span class=\"katex-inline\">(n,d)<\/span> 相加时广播到 <span class=\"katex-inline\">n<\/span> 行；参数本身仍是 <span class=\"katex-inline\">d<\/span> 个，不随批量增长。判断参数量只数可学习张量本身的形状，不要把广播补齐后的尺寸当成参数规模。<\/p>\n<h3>高维张量的比对顺序<\/h3>\n<p>三维例子：<span class=\"katex-inline\">X<\/span> 形状 <span class=\"katex-inline\">(n,c,h,w)<\/span>，归一化参数 <span class=\"katex-inline\">\\gamma<\/span> 形状 <span class=\"katex-inline\">(1,c,1,1)<\/span>。逐维比对：<span class=\"katex-inline\">n<\/span> 维 <span class=\"katex-inline\">n<\/span> 与 1，合法；<span class=\"katex-inline\">c<\/span> 维 <span class=\"katex-inline\">c<\/span> 与 <span class=\"katex-inline\">c<\/span>，相等；<span class=\"katex-inline\">h,w<\/span> 维 <span class=\"katex-inline\">h,w<\/span> 与 1，合法。<span class=\"katex-inline\">\\gamma<\/span> 沿批量与空间位置复用，每个通道一套拉伸系数。若 <span class=\"katex-inline\">\\gamma<\/span> 形状误写成 <span class=\"katex-inline\">(c,1,1)<\/span>，左补 1 后是 <span class=\"katex-inline\">(1,c,1,1)<\/span>，比对方向不变；但写成 <span class=\"katex-inline\">(1,1,c,1)<\/span> 就会把通道维对齐到高度维，不报错时语义错位。<\/p>\n<h3>对抗性追问：标量广播占多少内存<\/h3>\n<p>标量与任意张量运算时，标量在每个位置复用同一数值，运算输出按张量形状分配，标量本身不扩成满形状数组。反例判断：把标量 <code>expand<\/code> 成大张量后再接依赖长度的操作，扩展结果才占独立内存；只做逐元素乘加时，广播映射在索引层完成。<\/p>\n<h3>对抗性追问：广播能替代维度拼接吗<\/h3>\n<p>不能。拼接（concatenate）沿指定维把两张表首尾相接，输出该维长度为两表之和；广播是对齐后逐位运算，不产生新的位置条目。需要保留两组原始输入时走拼接，需要逐位组合时才走广播。<\/p>\n<h2>延伸推演：广播在后续模型层中的出现位置<\/h2>\n<h3>线性模型里的偏置广播<\/h3>\n<p>批量样本矩阵 <span class=\"katex-inline\">X\\in\\mathbb R^{n\\times d}<\/span>，权重 <span class=\"katex-inline\">W\\in\\mathbb R^{d\\times q}<\/span>，偏置 <span class=\"katex-inline\">\\mathbf b\\in\\mathbb R^{1\\times q}<\/span>。矩阵乘积 <span class=\"katex-inline\">XW<\/span> 形状 <span class=\"katex-inline\">(n,q)<\/span>，加 <span class=\"katex-inline\">\\mathbf b<\/span> 时右侧比对：<span class=\"katex-inline\">q<\/span> 维相等，<span class=\"katex-inline\">n<\/span> 维 <span class=\"katex-inline\">n<\/span> 与 1 合法，<span class=\"katex-inline\">\\mathbf b<\/span> 沿批量复制 <span class=\"katex-inline\">n<\/span> 份。训练代码里偏置参数只存 <span class=\"katex-inline\">q<\/span> 个标量，前向时每个样本共享同一组偏置；若把偏置误写成形状 <span class=\"katex-inline\">(n,q)<\/span>，参数量随批量翻倍，且不会复用统计量。<\/p>\n<h3>归一化层的拉伸参数广播<\/h3>\n<p>批量归一化中 <span class=\"katex-inline\">\\gamma<\/span>、<span class=\"katex-inline\">\\beta<\/span> 形状与该层激活的特征维度对齐。全连接层输入形状 <span class=\"katex-inline\">(n,d)<\/span>，<span class=\"katex-inline\">\\gamma<\/span> 形状 <span class=\"katex-inline\">(1,d)<\/span>；卷积层输入 <span class=\"katex-inline\">(n,c,h,w)<\/span>，<span class=\"katex-inline\">\\gamma<\/span> 形状 <span class=\"katex-inline\">(1,c,1,1)<\/span>。逐维比对后，<span class=\"katex-inline\">\\gamma<\/span> 在批量维与空间维复用，每个通道一套系数。这里广播方向与线性模型一致：可学习参数沿“样本/位置”维复用，不沿特征维复用。<\/p>\n<h3>索引、切片与降维的形状变化<\/h3>\n<p>索引取单行会把该维消去：<code>X[i]<\/code> 形状从 <span class=\"katex-inline\">(n,d)<\/span> 变 <span class=\"katex-inline\">(d,)<\/span>；切片保留维数：<code>X[i:i+1]<\/code> 仍是 <span class=\"katex-inline\">(1,d)<\/span>。两种写法后续广播行为不同：<code>(d,)<\/code> 与 <span class=\"katex-inline\">(n,d)<\/span> 相加走右侧对齐广播；<span class=\"katex-inline\">(1,d)<\/span> 走同一条对齐路径，但语义上一个是单行向量，一个是单样本批量。写代码时若发现广播方向与预期不符，先查索引是不是把维度消掉了。<\/p>\n<h3>类型提升与广播的先后<\/h3>\n<p>两个张量运算时，框架先做类型提升（如整数张量与浮点张量运算，结果取浮点），再做形状广播。形状合法但类型不可转换时会在类型检查阶段报错；排查顺序是先报形状、再报类型，不要把两类错误混在一起。<\/p>\n<h2>补充推演与第二算例<\/h2>\n<h3>第二算例：四维张量的合法与非法对齐<\/h3>\n<p><span class=\"katex-inline\">X<\/span> 形状 <span class=\"katex-inline\">(2,3,4,5)<\/span>，候选 <span class=\"katex-inline\">A<\/span> 形状 <span class=\"katex-inline\">(3,4,5)<\/span>。左补 1 后 <span class=\"katex-inline\">A<\/span> 视为 <span class=\"katex-inline\">(1,3,4,5)<\/span>：逐维比对 <span class=\"katex-inline\">2<\/span> 与 <span class=\"katex-inline\">1<\/span> 合法，<span class=\"katex-inline\">3=3<\/span>、<span class=\"katex-inline\">4=4<\/span>、<span class=\"katex-inline\">5=5<\/span> 相等，输出 <span class=\"katex-inline\">(2,3,4,5)<\/span>，<span class=\"katex-inline\">A<\/span> 沿批量维复用。 候选 <span class=\"katex-inline\">B<\/span> 形状 <span class=\"katex-inline\">(3,5,4)<\/span>：比对时最右维 <span class=\"katex-inline\">5<\/span> 与 <span class=\"katex-inline\">4<\/span> 既不等也不为 1，抛形状错误；错误不是数值问题，而是维序语义错位。修正前先确认通道维与空间维谁是谁，不能靠调换数字凑出合法形状。 候选 <span class=\"katex-inline\">C<\/span> 形状 <span class=\"katex-inline\">(2,1,4,1)<\/span>：<span class=\"katex-inline\">2=2<\/span>，<span class=\"katex-inline\">3<\/span> 与 <span class=\"katex-inline\">1<\/span> 合法，<span class=\"katex-inline\">4=4<\/span>，<span class=\"katex-inline\">5<\/span> 与 <span class=\"katex-inline\">1<\/span> 合法，输出 <span class=\"katex-inline\">(2,3,4,5)<\/span>；<span class=\"katex-inline\">C<\/span> 在通道维与最右空间维复用同一组值。<\/p>\n<h3>视图、拷贝与原地操作的边界<\/h3>\n<p><code>expand<\/code> 只在索引层复制视图，不新增底层数据；一旦后续操作把扩展结果写入独立张量（如 <code>.clone()<\/code>、接梯度更新），才占满形状内存。<code>A += B<\/code> 原地改写时，若 <span class=\"katex-inline\">B<\/span> 由广播得到与 <span class=\"katex-inline\">A<\/span> 不同的中间形状，框架先做形状兼容检查再覆盖；不兼容时同样报错，不会静默截断某一维。排查广播错误的顺序：先看 <code>.shape<\/code> 逐维比对，再看索引是否把维度消去，最后查 dtype 类型提升。<\/p>\n<h3>代码片段：四维形状核对<\/h3>\n<pre class=\"lang-python\"><code>import torch\nX = torch.randn(2, 3, 4, 5)\nA = torch.randn(3, 4, 5)\nB = torch.randn(2, 1, 4, 1)\nprint((X + A).shape)   # torch.Size([2, 3, 4, 5])\nprint((X + B).shape)   # torch.Size([2, 3, 4, 5])<\/code><\/pre>\n<h3>对抗性追问：广播报错会不会静默取截断值<\/h3>\n<p>不会。逐维比对到既不等也不为 1 的位置，框架直接抛运行时错误；不存在“多余维度被丢掉”的默认行为。若训练日志里出现形状不匹配，先回查上一层输出形状与当前层参数形状，不要在错误张量上继续前向。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n两个张量做逐元素运算，广播合法的两种条件是什么？（该维长度相等，或其中一方为 1。）\n<\/li><li>\n形状 <span class=\"katex-inline\">(3,1)<\/span> 与 <span class=\"katex-inline\">(4,)<\/span> 相加，结果形状是什么？比对时 <span class=\"katex-inline\">B<\/span> 先看成什么形状？（结果 <span class=\"katex-inline\">(3,4)<\/span>；<span class=\"katex-inline\">B<\/span> 先视为 <span class=\"katex-inline\">(1,4)<\/span>。）\n<\/li><li>\n原地操作 <code>A += B<\/code> 与 <code>A = A + B<\/code> 在内存上的差别是什么？（前者覆盖原张量，后者生成新张量并改名指向。）\n<\/li><li>\n形状 <span class=\"katex-inline\">(2,3)<\/span> 与 <span class=\"katex-inline\">(2,4)<\/span> 为什么报错？修正前必须先明确哪件事？（最右维 3 与 4 既不等也不为 1；修正前先明确偏置的语义对齐方向。）\n<\/li><li>\n广播补齐会不会把可学习参数数量放大？（不会，参数只数可学习张量本身形状。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "张量与广播机制：形状语义、广播规则与内存占用"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.87<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">张量与广播机制：形状语义、广播规则与内存占用<\/a><\/span><\/div><h1>自动微分的反向模式：计算图、链式法则与梯度反向累积<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章（原书 2.5 自动微分，PDF 第 87–89 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>深度学习模型参数动辄上万，损失对每个参数的偏导数是训练更新的依据。手工推导复合函数的闭合导数，模型一变就要重推一遍，容易出错；用数值差分（给参数加小扰动看损失变化）逼近导数，计算量随参数个数线性放大，精度还受扰动步长限制。自动微分要在复杂模型上机械化地给出每个参数的偏导数：前向时记下计算路径，反向时沿路径把梯度累积回各参数。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>计算图（Computational Graph）<\/strong>：把张量作为节点、运算作为有向边组织的图。叶节点是输入与可学习参数，中间节点是运算输出；每条边记录局部偏导数的计算方式。前向传播按图的拓扑顺序算数值，反向传播从损失叶节点回溯到各参数叶节点。<\/p>\n<p><strong>反向模式（Reverse Mode）<\/strong>：先完成前向、保存中间量与操作链，再从输出端反向遍历，逐层把“上游梯度 × 局部偏导”累加到下游张量。本书 PyTorch 实现中，张量调用 <code>requires_grad_(True)<\/code> 加入求图；<code>backward()<\/code> 触发反向；梯度存放在张量的 <code>.grad<\/code> 属性中，形状与原张量一致（原书 2.5.1 节，PDF 第 88 页）。<\/p>\n<p><strong>梯度累积与清零<\/strong>：PyTorch 默认累积梯度，多次 <code>backward()<\/code> 会把新梯度加到旧梯度上。训练循环每轮更新前必须 <code>x.grad.zero_()<\/code>，否则更新方向混入上一轮残留（原书 2.5 节，PDF 第 89 页）。<\/p>\n<p><strong>非标量反向传播<\/strong>：当输出 <span class=\"katex-inline\">y<\/span> 不是标量时，<span class=\"katex-inline\">y<\/span> 对 <span class=\"katex-inline\">x<\/span> 的导数在矩阵意义下是雅可比矩阵。训练时通常只求批量内各样本损失偏导数之和，调用 <code>backward(gradient=...)<\/code> 传入权重向量；传全 1 等价于对各分量偏导数求和（原书 2.5.2 节，PDF 第 89 页）。<\/p>\n<p><strong>分离计算（detach）<\/strong>：<code>y.detach()<\/code> 返回与 <span class=\"katex-inline\">y<\/span> 同值的新变量，但丢弃 <span class=\"katex-inline\">y<\/span> 上游的计算图信息；梯度不再流经分离点回到上游参数（原书 2.5.3 节，PDF 第 89 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>链式法则是反向模式的数学依据。复合函数 <span class=\"katex-inline\">y=f(u(x))<\/span>，<span class=\"katex-inline\">dy/dx=(dy/du)(du/dx)<\/span>；多变量情形 <span class=\"katex-inline\">y<\/span> 经 <span class=\"katex-inline\">u_1,\\dots,u_m<\/span> 依赖 <span class=\"katex-inline\">x_i<\/span>，则<\/p>\n<div class=\"katex-block\">\\frac{\\partial y}{\\partial x_i}=\\sum_{k=1}^{m}\\frac{\\partial y}{\\partial u_k}\\frac{\\partial u_k}{\\partial x_i}.<\/div>\n<p>反向模式做的就是这条规则的图上执行：每个节点收到上游传来的 <span class=\"katex-inline\">\\partial y/\\partial(\\text{该节点})<\/span>，乘上本地边的局部偏导，继续往下传。<\/p>\n<p>算例对照原书示例：<span class=\"katex-inline\">x=(0,1,2,3)<\/span>，<span class=\"katex-inline\">y=2x^\\top x<\/span>。前向 <span class=\"katex-inline\">x^\\top x=0+1+4+9=14<\/span>，<span class=\"katex-inline\">y=28<\/span>。解析梯度 <span class=\"katex-inline\">\\nabla_x y=4x=(0,4,8,12)<\/span>。<code>y.backward()<\/code> 后 <code>x.grad<\/code> 与该解析结果逐项相等（PDF 第 88 页）。<\/p>\n<p>再取 <span class=\"katex-inline\">y=x\\odot x<\/span>（逐元素平方），<span class=\"katex-inline\">y_i=x_i^2<\/span>，<span class=\"katex-inline\">\\partial y_i/\\partial x_i=2x_i<\/span>，对 <span class=\"katex-inline\">y<\/span> 求和后反向得 <span class=\"katex-inline\">x.\\mathrm{grad}=(0,2,4,6)<\/span>（PDF 第 89 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：参与求导的张量可微；前向过程已记录计算图；损失是标量，或非标量时显式传入梯度权重。\n<\/li><li>\n失败案例一：未清零梯度连续反向。第二轮梯度叠在第一轮上，参数更新步长与方向都偏离当前损失面。\n<\/li><li>\n失败案例二：对向量输出直接 <code>backward()<\/code> 不传 <code>gradient<\/code>。框架无法确定对输出各分量做哪种线性组合，报错；需求是偏导数之和时传全 1 向量。\n<\/li><li>\n失败案例三：需要训练上游参数时误用 <code>detach<\/code>。分离点切断回传路径，上游层梯度保持初始值不动，损失长期不降。\n<\/li><li>\n边界：Python 控制流（循环、条件分支）仍可被自动微分覆盖，因为图在每次前向时按实际执行路径构建；高阶导数需要在反向结果上再次建立求图，普通 <code>backward()<\/code> 只给一阶梯度。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>自动微分 vs 数值微分<\/strong>：数值差分用 <span class=\"katex-inline\">(f(x+\\epsilon)-f(x-\\epsilon))/(2\\epsilon)<\/span> 近似导数，受 <span class=\"katex-inline\">\\epsilon<\/span> 大小制约且每点要两次前向；自动微分沿链式法则精确计算局部偏导，一次前向配一次反向覆盖全部参数。\n<\/li><li>\n<strong>自动微分 vs 符号微分<\/strong>：符号微分对表达式树推闭合解析式，中间表达式可能膨胀；自动微分保留数值与局部导数，不显式生成全局解析公式，适合工程实现。\n<\/li><li>\n<strong>反向模式 vs 前向模式<\/strong>：反向模式从输出端回溯，适合参数多、输出少的深度学习场景；前向模式沿输入侧伴随，适合输入少、输出多的场合。本书训练过程走反向模式。\n<\/li><li>\n<strong>计算图 vs 计算结果<\/strong>：图记录的是“怎么算出来的”，不是数值本身；<code>detach<\/code> 保留数值切断图，<code>zero_<\/code> 清空梯度不动前向数值。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的张量形状与内存规则——梯度张量与参数同形状，累积与清零都作用在参数内存上。后继：概念 c03 的回归损失梯度、概念 c11 的 BPTT 梯度，都是反向模式在特定结构上的实例；优化算法（概念 c14）拿到反向得到的梯度后再做更新。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（自动微分的反向模式：计算图、链式法则与梯度反向累积）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：计算图上的链式法则、反向累积与手算算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要解释框架怎样自动给出参数梯度，先往回追四层前提：<\/p>\n<ol><li>\n损失对参数的偏导数服从链式法则。复合函数的导数可以拆成局部偏导的乘积与求和；自动微分只是把这条规则机械化执行，不发明新的求导定律。\n<\/li><li>\n前向过程必须留下可回溯的记录。纯数值算完即丢，反向时找不到每条边的局部偏导；计算图把输入、输出、运算类型绑定保存，供反向遍历。\n<\/li><li>\n反向遍历从损失标量出发。上游梯度传到每个节点后，与该节点本地偏导相乘再下传；梯度累积到叶节点参数上，形状与参数一致。\n<\/li><li>\n非标量输出需要指定线性组合。雅可比矩阵完整存储代价高，训练目标是批量内损失偏导之和，因此 <code>backward<\/code> 接受一个与输出同形状的梯度权重。\n<\/ol>\n<p>依赖链方向：可微复合函数 → 前向构建计算图保存中间量 → 从损失叶节点反向遍历 → 边上游梯度乘局部偏导 → 累积到参数叶节点 → 清零准备下一轮。任何一层前提缺失，要么求不出梯度，要么梯度混入残留。<\/p>\n<h2>正向推导：一个两层小图的前向与反向<\/h2>\n<h3>节点与边<\/h3>\n<p>输入标量 <span class=\"katex-inline\">x<\/span>，中间量 <span class=\"katex-inline\">a=x^2<\/span>，中间量 <span class=\"katex-inline\">b=a+2<\/span>，损失 <span class=\"katex-inline\">L=b^2<\/span>。图上有三条边：<span class=\"katex-inline\">x\\to a<\/span> 对应平方，<span class=\"katex-inline\">a\\to b<\/span> 对应加常数，<span class=\"katex-inline\">b\\to L<\/span> 对应平方。<\/p>\n<h3>前向数值<\/h3>\n<p><span class=\"katex-inline\">x=1.5<\/span>：<span class=\"katex-inline\">a=1.5^2=2.25<\/span>；<span class=\"katex-inline\">b=2.25+2=4.25<\/span>；<span class=\"katex-inline\">L=4.25^2=18.0625<\/span>。前向表记录每个节点数值，供反向算局部偏导使用。<\/p>\n<h3>反向逐层累积<\/h3>\n<p>从 <span class=\"katex-inline\">L<\/span> 出发：<span class=\"katex-inline\">\\partial L/\\partial b=2b=8.5<\/span>。 到 <span class=\"katex-inline\">b\\to a<\/span>：<span class=\"katex-inline\">\\partial b/\\partial a=1<\/span>，所以 <span class=\"katex-inline\">\\partial L/\\partial a=(8.5)(1)=8.5<\/span>。 到 <span class=\"katex-inline\">a\\to x<\/span>：<span class=\"katex-inline\">\\partial a/\\partial x=2x=3<\/span>，所以 <span class=\"katex-inline\">\\partial L/\\partial x=(8.5)(3)=25.5<\/span>。<\/p>\n<p>整体校验：<span class=\"katex-inline\">L=(x^2+2)^2<\/span>，展开求导 <span class=\"katex-inline\">dL/dx=2(x^2+2)\\cdot 2x=4x(x^2+2)=4\\times1.5\\times4.25=25.5<\/span>，局部反向与整体闭合导数一致。<\/p>\n<h3>图上累积规则<\/h3>\n<p>若一个节点有多条上游路径汇入，上游梯度按路径求和；若一个节点向下游分出多条边，本地偏导分别与各下游回传梯度相乘。框架在每个算子内部实现“本地偏导 × 上游梯度”的乘法，再把结果累加到输入张量的 <code>.grad<\/code>。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：向量二次型 <span class=\"katex-inline\">y=2x^\\top x<\/span>（原书示例，PDF 第 88 页）<\/h3>\n<p><span class=\"katex-inline\">x=(0,1,2,3)<\/span>。前向：<span class=\"katex-inline\">x^\\top x=0^2+1^2+2^2+3^2=14<\/span>，<span class=\"katex-inline\">y=2\\times14=28<\/span>。 解析求导：<span class=\"katex-inline\">y=2\\sum_i x_i^2<\/span>，<span class=\"katex-inline\">\\partial y/\\partial x_i=4x_i<\/span>，梯度应为 <span class=\"katex-inline\">(0,4,8,12)<\/span>。 代码行为：<\/p>\n<pre class=\"lang-python\"><code>import torch\nx = torch.arange(4.0)\nx.requires_grad_(True)\ny = 2 * torch.dot(x, x)\ny.backward()\nprint(x.grad)        # tensor([0., 4., 8., 12.])\nprint(x.grad == 4 * x)  # 逐项 True<\/code><\/pre>\n<p>逐位核对：<span class=\"katex-inline\">x_0=0\\to0<\/span>，<span class=\"katex-inline\">x_1=1\\to4<\/span>，<span class=\"katex-inline\">x_2=2\\to8<\/span>，<span class=\"katex-inline\">x_3=3\\to12<\/span>，与解析结果一致。<\/p>\n<h3>算例 2：逐元素平方 <span class=\"katex-inline\">y=x\\odot x<\/span>（原书示例，PDF 第 89 页）<\/h3>\n<p><span class=\"katex-inline\">x=(0,1,2,3)<\/span>，<span class=\"katex-inline\">y_i=x_i^2<\/span>。<span class=\"katex-inline\">\\partial y_i/\\partial x_i=2x_i<\/span>；对 <span class=\"katex-inline\">y<\/span> 求和后反向，梯度 <span class=\"katex-inline\">(0,2,4,6)<\/span>。<\/p>\n<pre class=\"lang-python\"><code>x.grad.zero_()\ny = x * x\ny.sum().backward()\nprint(x.grad)        # tensor([0., 2., 4., 6.])<\/code><\/pre>\n<p>若直接写 <code>y.backward()<\/code> 而 <span class=\"katex-inline\">y<\/span> 是向量，框架要求传入 <code>gradient<\/code>；<code>y.sum().backward()<\/code> 等价于传全 1 权重，即求各分量偏导数之和。<\/p>\n<h3>算例 3：分离点切断回传<\/h3>\n<p><span class=\"katex-inline\">y=x\\odot x<\/span>，<span class=\"katex-inline\">u=y.\\mathrm{detach}()<\/span>，<span class=\"katex-inline\">z=u\\odot x<\/span>。按定义 <span class=\"katex-inline\">z<\/span> 对 <span class=\"katex-inline\">x<\/span> 求偏导时 <span class=\"katex-inline\">u<\/span> 视为常数：<span class=\"katex-inline\">\\partial z/\\partial x=u<\/span>，梯度不流经 <span class=\"katex-inline\">y<\/span> 回到 <span class=\"katex-inline\">x<\/span> 的平方分支。若不分离，<span class=\"katex-inline\">z=x^3<\/span>，<span class=\"katex-inline\">\\partial z/\\partial x=3x^2<\/span>，两条路径都回传。<code>detach<\/code> 改变的是图的连通性，不改变当前数值。<\/p>\n<h2>延伸推演<\/h2>\n<h3>梯度为什么与参数同形状<\/h3>\n<p>梯度的每个分量对应参数张量的一个位置，偏导数逐位定义，因此 <code>.grad<\/code> 形状必须与参数一致。批量维度、通道维度、空间维度上的梯度位置一一对应；检查梯度形状是排查广播错误的第一步。<\/p>\n<h3>为什么默认累积而不是自动覆盖<\/h3>\n<p>框架无法区分“同一张图第二次 backward”与“新一轮训练的梯度叠加”。累积语义让梯度可以在多个损失分支间分别回传再合并；训练循环因此承担清零责任：每轮更新参数后、下一轮前 <code>zero_()<\/code>。遗漏清零时，等效于把历史梯度按轮次加权平均，优化轨迹出现持续偏移。<\/p>\n<h3>Python 控制流怎样被覆盖<\/h3>\n<p>前向执行到哪个分支，图就记录哪条路径。<code>if<\/code> 条件走真分支就记录真分支算子，循环重复几次就记录几层；反向时沿实际路径回溯。写自定义模块时不要在图外偷偷改参数值，否则前向数值与记录的图不一致，反向结果失真。<\/p>\n<h3>高阶导数从哪里来<\/h3>\n<p>一阶梯度本身也是张量，若对梯度张量再次开启求图并调用反向，可得到二阶梯度；普通训练只需要一阶梯度，优化器按一阶信息更新。高阶导数计算图更深、内存占用更大，深度学习常规训练不主动计算。<\/p>\n<h3>对抗性追问：自动微分能替代手推链式法则吗<\/h3>\n<p>不能替代理解。框架给出数值梯度，但排查梯度爆炸、消失、异常 NaN 时，仍要能沿图说出每条边的局部偏导量级；不懂链式法则就无法判断某层梯度反常是上游问题还是本地算子问题。自动微分是执行工具，不是推导依据。<\/p>\n<h2>补充推演与第二算例<\/h2>\n<h3>第二算例：小批量线性回归图的形状与梯度<\/h3>\n<p>设批量 <span class=\"katex-inline\">n=2<\/span>，特征维 <span class=\"katex-inline\">d=3<\/span>，<span class=\"katex-inline\">X=\\begin{pmatrix}1&amp;0&amp;1\\\\0&amp;1&amp;1\\end{pmatrix}<\/span>，标签 <span class=\"katex-inline\">\\mathbf y=(2,3)<\/span>，权重 <span class=\"katex-inline\">W\\in\\mathbb R^{3\\times1}<\/span>，偏置 <span class=\"katex-inline\">b\\in\\mathbb R<\/span>。前向 <span class=\"katex-inline\">\\hat{\\mathbf y}=XW+b<\/span>；平方损失 <span class=\"katex-inline\">L=\\frac1n(\\hat{\\mathbf y}-\\mathbf y)^\\top(\\hat{\\mathbf y}-\\mathbf y)<\/span>。 梯度闭合式 <span class=\"katex-inline\">\\nabla_W L=\\frac2n X^\\top(\\hat{\\mathbf y}-\\mathbf y)<\/span>，<span class=\"katex-inline\">\\nabla_b L=\\frac2n\\sum_i(\\hat y_i-y_i)<\/span>。取 <span class=\"katex-inline\">W=(0,0,0)^\\top<\/span>，<span class=\"katex-inline\">b=0<\/span>，则 <span class=\"katex-inline\">\\hat{\\mathbf y}=(0,0)<\/span>，误差 <span class=\"katex-inline\">\\mathbf e=(-2,-3)<\/span>。 <span class=\"katex-inline\">X^\\top\\mathbf e=\\begin{pmatrix}1&amp;0\\\\0&amp;1\\\\1&amp;1\\end{pmatrix}\\begin{pmatrix}-2\\\\-3\\end{pmatrix}=(-2,-3,-5)^\\top<\/span>，<span class=\"katex-inline\">\\nabla_W L=X^\\top\\mathbf e<\/span>（<span class=\"katex-inline\">n=2<\/span> 时系数 <span class=\"katex-inline\">2/2=1<\/span>），即 <span class=\"katex-inline\">(-2,-3,-5)^\\top<\/span>；<span class=\"katex-inline\">\\nabla_b L=(-2-3)/2=-2.5<\/span>。梯度形状与 <span class=\"katex-inline\">W<\/span>、<span class=\"katex-inline\">b<\/span> 一一对应：<span class=\"katex-inline\">3\\times1<\/span> 与标量。<\/p>\n<h3>更深一层：反向模式与前向模式的选择<\/h3>\n<p>自动微分有两条遍历方向。前向模式沿输入方向逐节点传导数，一次前向回传一个输入方向的导数；参数数量远大于输出数量时，要重复参数次，代价高。反向模式先记录前向图，再从输出标量反向累积一次给出所有参数梯度，正好匹配训练场景（参数多、损失标量）。本书训练代码全走反向模式；理解方向选择有助于判断为什么框架要求损失先聚合成标量再 <code>backward<\/code>。<\/p>\n<h3>雅可比向量积与非标量回传<\/h3>\n<p>若输出是向量 <span class=\"katex-inline\">\\mathbf o<\/span>，对它调用 <code>backward<\/code> 需要传入同形状权重向量 <span class=\"katex-inline\">\\mathbf g<\/span>，回传的是 <span class=\"katex-inline\">\\mathbf g^\\top J<\/span> 这一雅可比向量积，而不是完整雅可比矩阵。<code>y.sum().backward()<\/code> 等价于 <span class=\"katex-inline\">\\mathbf g<\/span> 全 1；要得到某一分量偏导，对应分量权重取 1、其余取 0。完整雅可比只在需要逐分量分析时分批回传，常规训练不存储整张矩阵。<\/p>\n<h3>代码片段：多参数图梯度形状核对<\/h3>\n<pre class=\"lang-python\"><code>import torch\nX = torch.tensor([[1., 0., 1.], [0., 1., 1.]])\ny = torch.tensor([2., 3.])\nW = torch.zeros(3, 1, requires_grad=True)\nb = torch.zeros(1, requires_grad=True)\ny_hat = X @ W + b\nloss = ((y_hat.squeeze(-1) - y) ** 2).mean()\nloss.backward()\nprint(W.grad.shape, b.grad.shape)   # torch.Size([3, 1]) torch.Size([1])<\/code><\/pre>\n<h3>梯度异常沿图定位<\/h3>\n<p>训练出现 NaN 或梯度全零，沿计算图分段检查：先看输出侧损失是否非法（对数零值、除零），再逐段核对上游激活量级。手推某条边的局部偏导量级，与框架回传梯度对照；局部偏导正常而上游梯度异常，问题在更上游链路。不掌握链式法则时，只能在整图范围猜；掌握链条后可以按边二分定位。<\/p>\n<h3>对抗性追问：自动微分能不能替代有限差分校验<\/h3>\n<p>有限差分 <span class=\"katex-inline\">\\partial f/\\partial w_i\\approx(f(w_i+\\epsilon)-f(w_i-\\epsilon))/(2\\epsilon)<\/span> 可在小网络上抽查梯度数值，但浮点精度受 <span class=\"katex-inline\">\\epsilon<\/span> 取值约束，不能当常规求导工具。自动微分给精确数值梯度，有限差分只作起步阶段的正确性抽查；两者口径不同，不要用差分结果覆盖框架梯度。<\/p>\n<h3>第二轮补充<\/h3>\n<h3>延伸：计算图上的内存与复用<\/h3>\n<p>前向保存中间激活供反向使用；激活要求梯度的张量会被留存，<code>detach<\/code> 的节点不保留上游图。训练循环里损失每轮重新建图，上一轮图在 backward 后释放；累积梯度跨轮保留，激活不跨轮。<\/p>\n<h3>第二算例：标量复合函数的两条路径<\/h3>\n<p><span class=\"katex-inline\">z=u\\cdot v<\/span>，<span class=\"katex-inline\">u=x+1<\/span>，<span class=\"katex-inline\">v=x-1<\/span>，<span class=\"katex-inline\">x=2<\/span>。前向 <span class=\"katex-inline\">u=3,v=1,z=3<\/span>。反向：<span class=\"katex-inline\">\\partial z/\\partial u=v=1<\/span>，<span class=\"katex-inline\">\\partial z/\\partial v=u=3<\/span>；<span class=\"katex-inline\">\\partial u/\\partial x=1<\/span>，<span class=\"katex-inline\">\\partial v/\\partial x=1<\/span>；<span class=\"katex-inline\">\\partial z/\\partial x=1\\times1+3\\times1=4<\/span>。展开 <span class=\"katex-inline\">z=x^2-1<\/span>，<span class=\"katex-inline\">dz/dx=2x=4<\/span>，两路求和闭合。<\/p>\n<h3>对抗性追问：停止梯度的节点能否再回传<\/h3>\n<p><code>detach<\/code> 后节点值保留，上游边断开；在被分离张量上接的新损失，梯度只流新支路，旧支路参数不更新。需要部分冻结特征时用该机制；误 detach 会让对应参数长期零梯度。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n反向模式与前向模式各适合什么场合？（反向适合参数多输出少的训练场景；前向适合输入少输出多的场合。）\n<\/li><li>\n<code>y.sum().backward()<\/code> 等价于传入什么权重？（全 1 权重，求各分量偏导数之和。）\n<\/li><li>\n训练循环里遗漏 <code>grad.zero_()<\/code> 会发生什么？（新旧梯度叠加，更新步长与方向偏离当前损失面。）\n<\/li><li>\n<code>detach()<\/code> 保留什么、切断什么？（保留当前数值，切断上游计算图的梯度回传。）\n<\/li><li>\n一个节点有多条上游路径时，上游梯度怎样合并？（按路径分别回传后在节点处求和。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "自动微分的反向模式：计算图、链式法则与梯度反向累积"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.103<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">自动微分的反向模式：计算图、链式法则与梯度反向累积<\/a><\/span><\/div><h1>线性回归：正规方程解析解与梯度下降/小批量随机梯度下降<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章（原书 3.1 线性回归、3.2/3.3 训练实现，PDF 第 103–104、106 页前后）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>回归任务要从观测数据学出一条直线（或超平面），使预测值与标签尽量接近。求解有两条路：一条是把损失写成矩阵形式，令梯度为 0 直接解出最优权重，即正规方程；另一条是从初始权重出发，沿损失下降方向反复更新，即梯度下降。两条路各有适用条件：数据规模小、设计矩阵可逆时解析解一步到位；样本多、维度高时求逆代价过大，实践中多用小批量随机梯度下降。弄清两条路的梯度来源与更新规则，是后面所有模型训练循环的蓝本。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>模型<\/strong>：单个样本特征 <span class=\"katex-inline\">\\mathbf x\\in\\mathbb R^d<\/span>，权重 <span class=\"katex-inline\">\\mathbf w\\in\\mathbb R^d<\/span>，偏置 <span class=\"katex-inline\">b<\/span>，预测 <span class=\"katex-inline\">\\hat y=\\mathbf w^\\top\\mathbf x+b<\/span>。<span class=\"katex-inline\">w_j<\/span> 对应第 <span class=\"katex-inline\">j<\/span> 个特征的斜率，<span class=\"katex-inline\">b<\/span> 是直线在纵轴的截距。<\/p>\n<p><strong>设计矩阵<\/strong>：<span class=\"katex-inline\">n<\/span> 个样本排成 <span class=\"katex-inline\">X\\in\\mathbb R^{n\\times d}<\/span>，标签向量 <span class=\"katex-inline\">\\mathbf y\\in\\mathbb R^n<\/span>；把偏置并入权重可增广一列 1，统一写成 <span class=\"katex-inline\">\\hat{\\mathbf y}=X\\mathbf w<\/span>。<\/p>\n<p><strong>平方损失<\/strong>：<span class=\"katex-inline\">L(\\mathbf w)=\\frac1n\\sum_{i=1}^n(\\hat y^{(i)}-y^{(i)})^2=\\frac1n\\|X\\mathbf w-\\mathbf y\\|_2^2<\/span>。每项是预测与真值之差的平方，整体取平均。平方损失对应高斯噪声假设下的负对数似然（原书 3.1.3 节，PDF 第 110 页前后）。<\/p>\n<p><strong>正规方程<\/strong>：令 <span class=\"katex-inline\">\\nabla_{\\mathbf w}L=0<\/span>，在 <span class=\"katex-inline\">X^\\top X<\/span> 可逆条件下，<span class=\"katex-inline\">\\mathbf w^*=(X^\\top X)^{-1}X^\\top\\mathbf y<\/span>。<\/p>\n<p><strong>梯度下降<\/strong>：按 <span class=\"katex-inline\">\\mathbf w\\leftarrow\\mathbf w-\\eta\\nabla_{\\mathbf w}L<\/span> 更新，<span class=\"katex-inline\">\\eta<\/span> 为学习率。小批量随机梯度下降（minibatch SGD）每轮抽取一小批样本估计梯度，沿该方向更新。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>平方损失展开：<span class=\"katex-inline\">L=\\frac1n(\\mathbf w^\\top X^\\top X\\mathbf w-2\\mathbf y^\\top X\\mathbf w+\\mathbf y^\\top\\mathbf y)<\/span>。对 <span class=\"katex-inline\">\\mathbf w<\/span> 求梯度，二次型梯度 <span class=\"katex-inline\">\\nabla_{\\mathbf w}(\\mathbf w^\\top A\\mathbf w)=2A\\mathbf w<\/span>（<span class=\"katex-inline\">A<\/span> 对称），一次项梯度为 <span class=\"katex-inline\">-2X^\\top\\mathbf y<\/span>，故<\/p>\n<div class=\"katex-block\">\\nabla_{\\mathbf w}L=\\frac2n(X^\\top X\\mathbf w-X^\\top\\mathbf y).<\/div>\n<p>令其为 0 得 <span class=\"katex-inline\">X^\\top X\\mathbf w=X^\\top\\mathbf y<\/span>；左乘 <span class=\"katex-inline\">(X^\\top X)^{-1}<\/span> 得正规方程解。<\/p>\n<p>数值算例：单输入 <span class=\"katex-inline\">x=(1,2,3)<\/span>，标签 <span class=\"katex-inline\">y=(2,4,6)<\/span>。<span class=\"katex-inline\">X^\\top X=1+4+9=14<\/span>，<span class=\"katex-inline\">X^\\top y=2+8+18=28<\/span>，<span class=\"katex-inline\">\\mathbf w^*=28/14=2<\/span>，拟合 <span class=\"katex-inline\">\\hat y=2x<\/span>。<\/p>\n<p>梯度下降算例：损失面为抛物面，梯度指向上升最快方向，更新取反方向。学习率 <span class=\"katex-inline\">\\eta=0.1<\/span>，若当前 <span class=\"katex-inline\">w=0<\/span>，单样本 <span class=\"katex-inline\">x=1,y=2<\/span>，误差 <span class=\"katex-inline\">\\hat y-y=-2<\/span>，<span class=\"katex-inline\">\\partial l/\\partial w=2x(\\hat y-y)=-4<\/span>，更新 <span class=\"katex-inline\">w\\leftarrow0-0.1(-4)=0.4<\/span>。多步迭代后逼近最优解。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：正规方程要求 <span class=\"katex-inline\">X^\\top X<\/span> 可逆，即设计矩阵列满秩；特征间高度共线或特征数超过样本数时不可逆，解析解不存在唯一最优。梯度下降对损失面凸性要求宽松，非凸场景也能局部下降。\n<\/li><li>\n失败案例一：学习率过大。更新步长越过最低点，在损失面两侧来回震荡，损失不降反升；学习率过小则每步移动微弱，收敛轮次拉长。\n<\/li><li>\n失败案例二：特征尺度未归一化。不同特征量纲差异大时，损失面被拉成狭长椭球，梯度在短轴方向震荡、长轴方向缓慢，收敛变慢。\n<\/li><li>\n失败案例三：把解析解当万能方法。<span class=\"katex-inline\">X^\\top X<\/span> 是 <span class=\"katex-inline\">d\\times d<\/span> 矩阵，求逆复杂度约 <span class=\"katex-inline\">O(d^3)<\/span>；<span class=\"katex-inline\">d<\/span> 上千后每步解析重算不现实，这是工程上选 SGD 族算法的直接原因。\n<\/li><li>\n边界：线性回归假设模型为线性，拟合不了曲线关系；残差存在异方差或噪声非高斯时，平方损失的最优估计仍可用，但概率解释需要调整。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>正规方程 vs 梯度下降<\/strong>：正规方程一步求出闭式解，不涉及学习率与迭代轮次，但受可逆条件与求逆复杂度限制；梯度下降逐轮逼近，超参数是学习率与批量大小，适合高维大数据。\n<\/li><li>\n<strong>批量梯度下降 vs 小批量 SGD<\/strong>：批量 GD 用全部样本算一次梯度，方向稳定但每轮计算量大；小批量 SGD 用一批样本估计梯度，引入噪声换取并行与泛化，更新频率高。\n<\/li><li>\n<strong>平方损失 vs 后续分类损失<\/strong>：平方损失假设标签连续、误差高斯；分类任务类别无序，直接套平方损失会让模型为“错误类输出偏大”继续受罚，分类要换交叉熵（见概念 c04）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c02 的反向模式提供梯度计算；概念 c01 的矩阵形状规则支撑 <span class=\"katex-inline\">X\\mathbf w<\/span> 与偏置广播。后继：概念 c04 的 softmax 交叉熵沿用“模型输出—损失—梯度—更新”的同一训练循环；概念 c14 的动量法、Adam 都是在 SGD 更新规则上叠加状态估计。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（线性回归：正规方程解析解与梯度下降/小批量随机梯度下降）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：平方损失梯度、正规方程求解与下降步长算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把线性回归的两条求解路径讲透，先往回追四层前提：<\/p>\n<ol><li>\n模型输出必须写成矩阵形式，损失才能对整组权重求导。单样本公式不够支撑批量计算，需要设计矩阵 <span class=\"katex-inline\">X<\/span> 与标签向量 <span class=\"katex-inline\">\\mathbf y<\/span> 的统一记号。\n<\/li><li>\n平方损失是权重的二次函数，梯度有闭合表达式。二次型与一次项分别求导是推导关键；不掌握矩阵梯度公式就只能逐项展开。\n<\/li><li>\n解析解存在以 <span class=\"katex-inline\">X^\\top X<\/span> 可逆为条件。列满秩保证特征之间没有冗余；条件不满足时正规方程只能给最小范数解或退化为迭代法。\n<\/li><li>\n迭代路径的步长由学习率控制。学习率与损失面曲率共同决定更新是否越过最低点；步长选择是梯度下降落地的核心超参数。\n<\/ol>\n<p>依赖链方向：线性模型定义 → 平方损失矩阵式 → 求梯度闭合式 → 令梯度为 0 得正规方程（可逆条件）→ 不可逆或高维时转小批量 SGD → 学习率/批量影响收敛轨迹。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：写模型与损失<\/h3>\n<p><span class=\"katex-inline\">n<\/span> 个样本，<span class=\"katex-inline\">X\\in\\mathbb R^{n\\times d}<\/span>，<span class=\"katex-inline\">\\mathbf y\\in\\mathbb R^n<\/span>，<span class=\"katex-inline\">\\hat{\\mathbf y}=X\\mathbf w<\/span>。损失<\/p>\n<div class=\"katex-block\">L(\\mathbf w)=\\frac1n\\sum_{i=1}^n(\\hat y_i-y_i)^2=\\frac1n(X\\mathbf w-\\mathbf y)^\\top(X\\mathbf w-\\mathbf y).<\/div>\n<p>展开被求导项：<span class=\"katex-inline\">(X\\mathbf w-\\mathbf y)^\\top(X\\mathbf w-\\mathbf y)=\\mathbf w^\\top X^\\top X\\mathbf w-2\\mathbf y^\\top X\\mathbf w+\\mathbf y^\\top\\mathbf y<\/span>。<\/p>\n<h3>第二步：逐项求梯度<\/h3>\n<p>常数项 <span class=\"katex-inline\">\\mathbf y^\\top\\mathbf y<\/span> 对 <span class=\"katex-inline\">\\mathbf w<\/span> 梯度为 0。 一次项 <span class=\"katex-inline\">-2\\mathbf y^\\top X\\mathbf w<\/span>：线性函数 <span class=\"katex-inline\">\\mathbf a^\\top\\mathbf w<\/span> 的梯度为 <span class=\"katex-inline\">\\mathbf a<\/span>，这里 <span class=\"katex-inline\">\\mathbf a=X^\\top\\mathbf y<\/span>，梯度为 <span class=\"katex-inline\">-2X^\\top\\mathbf y<\/span>。 二次项 <span class=\"katex-inline\">\\mathbf w^\\top X^\\top X\\mathbf w<\/span>：记 <span class=\"katex-inline\">A=X^\\top X<\/span> 对称，<span class=\"katex-inline\">\\nabla_{\\mathbf w}(\\mathbf w^\\top A\\mathbf w)=2A\\mathbf w=2X^\\top X\\mathbf w<\/span>。 合并并除以 <span class=\"katex-inline\">n<\/span>：<\/p>\n<div class=\"katex-block\">\\nabla_{\\mathbf w}L=\\frac2n(X^\\top X\\mathbf w-X^\\top\\mathbf y).<\/div>\n<h3>第三步：令梯度为 0 推正规方程<\/h3>\n<p><span class=\"katex-inline\">\\nabla_{\\mathbf w}L=0 \\Rightarrow X^\\top X\\mathbf w=X^\\top\\mathbf y<\/span>。若 <span class=\"katex-inline\">X^\\top X<\/span> 可逆，两边左乘逆矩阵：<\/p>\n<div class=\"katex-block\">\\mathbf w^*=(X^\\top X)^{-1}X^\\top\\mathbf y.<\/div>\n<p>几何含义：<span class=\"katex-inline\">\\hat{\\mathbf y}=X\\mathbf w<\/span> 落在 <span class=\"katex-inline\">X<\/span> 的列空间内，残差 <span class=\"katex-inline\">\\mathbf y-\\hat{\\mathbf y}<\/span> 与列空间正交；正规方程找到的是列空间中离 <span class=\"katex-inline\">\\mathbf y<\/span> 最近的点。<\/p>\n<h3>第四步：梯度下降更新<\/h3>\n<p>不在闭式解停留时，按 <span class=\"katex-inline\">\\mathbf w_{t+1}=\\mathbf w_t-\\eta\\nabla_{\\mathbf w}L(\\mathbf w_t)<\/span> 更新。批量 GD 用全量样本算梯度；小批量 SGD 用一批样本 <span class=\"katex-inline\">B<\/span> 估计 <span class=\"katex-inline\">\\nabla L\\approx\\frac1{|B|}\\sum_{i\\in B}2\\mathbf x_i(\\hat y_i-y_i)<\/span>，沿估计方向更新。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：一维正规方程<\/h3>\n<p><span class=\"katex-inline\">x=(1,2,3)<\/span>，<span class=\"katex-inline\">y=(2,4,6)<\/span>。<span class=\"katex-inline\">X^\\top X=\\sum x_i^2=1+4+9=14<\/span>，<span class=\"katex-inline\">X^\\top y=\\sum x_i y_i=2+8+18=28<\/span>，<span class=\"katex-inline\">w^*=28/14=2<\/span>。残差 <span class=\"katex-inline\">\\hat y-y=0<\/span>，训练损失为 0。<\/p>\n<h3>算例 2：梯度下降多步迭代（单样本、学习率 0.1）<\/h3>\n<p>样本 <span class=\"katex-inline\">x=1<\/span>，<span class=\"katex-inline\">y=2<\/span>，初始 <span class=\"katex-inline\">w_0=0<\/span>。损失 <span class=\"katex-inline\">l=(wx-y)^2<\/span>，<span class=\"katex-inline\">\\partial l/\\partial w=2x(wx-y)<\/span>。<\/p>\n<ul><li>\n第 1 步：<span class=\"katex-inline\">\\hat y=0<\/span>，误差 <span class=\"katex-inline\">-2<\/span>，梯度 <span class=\"katex-inline\">2\\times1\\times(-2)=-4<\/span>，<span class=\"katex-inline\">w_1=0-0.1(-4)=0.4<\/span>。\n<\/li><li>\n第 2 步：<span class=\"katex-inline\">\\hat y=0.4<\/span>，误差 <span class=\"katex-inline\">-1.6<\/span>，梯度 <span class=\"katex-inline\">-3.2<\/span>，<span class=\"katex-inline\">w_2=0.4+0.32=0.72<\/span>。\n<\/li><li>\n第 3 步：<span class=\"katex-inline\">\\hat y=0.72<\/span>，误差 <span class=\"katex-inline\">-1.28<\/span>，梯度 <span class=\"katex-inline\">-2.56<\/span>，<span class=\"katex-inline\">w_3=0.72+0.256=0.976<\/span>。\n<\/li><li>\n序列向 <span class=\"katex-inline\">w^*=2<\/span> 逼近；每步残差按 <span class=\"katex-inline\">1-2\\eta x^2=0.8<\/span> 的比例收缩，多步后收敛到最优附近。\n<\/ul>\n<h3>算例 3：二维小批量与特征尺度<\/h3>\n<p>样本 <span class=\"katex-inline\">(x_1,x_2)<\/span>：<span class=\"katex-inline\">(1,100)<\/span> 标签 <span class=\"katex-inline\">3<\/span>，<span class=\"katex-inline\">(2,200)<\/span> 标签 <span class=\"katex-inline\">6<\/span>。第二特征量纲是第一特征百倍，损失面在 <span class=\"katex-inline\">w_2<\/span> 方向曲率小、<span class=\"katex-inline\">w_1<\/span> 方向曲率大；同一步长下 <span class=\"katex-inline\">w_2<\/span> 更新缓慢，<span class=\"katex-inline\">w_1<\/span> 易震荡。归一化做法
