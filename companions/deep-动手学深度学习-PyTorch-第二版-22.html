class=\"katex-inline\">0.8<\/span> 连乘传回的历史项；步差越大，历史项前面挂的 <span class=\"katex-inline\">0.8<\/span> 幂次越高。<\/p>\n<h3>共享权重的梯度汇总<\/h3>\n<p><span class=\"katex-inline\">w_h<\/span> 在所有时间步复用，损失对它的梯度是各步梯度之和。同一组参数既影响当前步更新，也受历史步回传影响；展开的计算图在时间维重复堆叠，参数叶节点只存一份梯度，多路贡献累加到同一位置。<\/p>\n<h3>展开图的内存位置<\/h3>\n<p>BPTT 把 <span class=\"katex-inline\">T<\/span> 个时间步的隐状态与中间量全部留在内存里供反向遍历；序列越长，前向保存的激活越多，显存占用随 <span class=\"katex-inline\">T<\/span> 线性增长。截断 BPTT 切段后，单段图长度受限，跨段只传隐状态不传梯度，是内存与长程依赖之间的折中。<\/p>\n<h3>代码片段：RNN 批量形状<\/h3>\n<pre class=\"lang-python\"><code>import torch\nfrom torch import nn\nrnn = nn.RNN(16, 32, batch_first=True)\nx = torch.randn(4, 10, 16)   # 批量 4、序列 10、特征 16\nout, h = rnn(x)\nprint(out.shape, h.shape)    # torch.Size([4, 10, 32]) torch.Size([1, 4, 32])<\/code><\/pre>\n<h3>对抗性追问：双向 RNN 的梯度路径<\/h3>\n<p>双向 RNN 正向层从左到右、反向层从右到左，两条链各自独立 BPTT；输出拼接后再算损失。双向结构利用整句上下文，但推理流式生成时反向层看不到未来，不能直接套用。<\/p>\n<h3>第二轮补充<\/h3>\n<h3>第二算例：步长因子为 1 附近的临界情形<\/h3>\n<p>标量 <span class=\"katex-inline\">c=1<\/span>：<span class=\"katex-inline\">c^{20}=1<\/span>，长程梯度不衰减也不放大；<span class=\"katex-inline\">c=0.99<\/span>，<span class=\"katex-inline\">0.99^{20}\\approx0.818<\/span>，<span class=\"katex-inline\">0.99^{50}\\approx0.605<\/span>，缓慢衰减；<span class=\"katex-inline\">c=1.01<\/span>，<span class=\"katex-inline\">1.01^{50}\\approx1.645<\/span>，缓慢放大。临界带很窄，实际 RNN 权重训练中容易偏向一侧，这是长依赖训练困难的定量背景。<\/p>\n<h3>困惑度与损失的换算<\/h3>\n<p>平均负对数似然 <span class=\"katex-inline\">L=\\frac1T\\sum_t-\\log p(y_t|x_t)<\/span>，困惑度 <span class=\"katex-inline\">\\mathrm{PPL}=\\exp(L)<\/span>。<span class=\"katex-inline\">L=2.3026<\/span> 对应 PPL 约 10；均匀预测词表大小 <span class=\"katex-inline\">V<\/span> 时 <span class=\"katex-inline\">L=\\log V<\/span>，PPL=<span class=\"katex-inline\">V<\/span>。困惑度跨词表比较时要注意词表规模口径。<\/p>\n<h3>对抗性追问：截断 BPTT 会不会丢掉长程依赖<\/h3>\n<p>会切段内回传。跨段隐状态保留信息，但段间梯度不回传，超长依赖的权重关系学不深；窗口长度是长程建模能力与计算内存的权衡。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nRNN 两个递归方程怎么写？（<span class=\"katex-inline\">h_t=f(x_t,h_{t-1},w_h)<\/span>，<span class=\"katex-inline\">o_t=g(h_t,w_o)<\/span>。）\n<\/li><li>\n<span class=\"katex-inline\">\\partial h_t/\\partial w_h<\/span> 递归式与展开式是什么？（<span class=\"katex-inline\">a_t=b_t+c_t a_{t-1}<\/span>；<span class=\"katex-inline\">a_t=b_t+\\sum_{i&lt;t}(\\prod_{j=i+1}^t c_j)b_i<\/span>。）\n<\/li><li>\n梯度消失与爆炸在连乘项上各对应什么？（因子谱半径长期小于 1 消失；长期大于 1 爆炸。）\n<\/li><li>\n梯度裁剪改变什么、不改变什么？（压单步更新范数、保方向；不改连乘结构与长程梯度问题。）\n<\/li><li>\n截断 BPTT 的权衡是什么？（切段降低单次回传长度、缓解连乘；段间依赖学不深。）\n<\/ol><\/div><\/details>", "c12": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.353<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">RNN 与通过时间反向传播：梯度沿时间步的连乘与长依赖问题<\/a><\/span><\/div><h1>LSTM/GRU 的门控：各门解决哪个问题与门值推演<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章（原书 9.1 门控循环单元、9.2 长短期记忆网络，PDF 第 353–355、361–362 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>普通 RNN 的隐状态沿时间链递归，长程依赖下梯度连乘消失，无关词元会冲刷已有记忆，遇到逻辑中断也没有通道重置状态。门控循环单元（GRU）与长短期记忆网络（LSTM）在递归中加入可学习的门：门输出在 <span class=\"katex-inline\">(0,1)<\/span> 区间，按凸组合比例控制旧状态保留多少、新状态写入多少、记忆对外暴露多少。门让模型学会跳过无关观测、在需要时重置状态、把重要信息跨时间步保存下来。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>GRU 两门<\/strong>：重置门 <span class=\"katex-inline\">R_t=\\sigma(X_tW_{xr}+H_{t-1}W_{hr}+b_r)<\/span>，更新门 <span class=\"katex-inline\">Z_t=\\sigma(X_tW_{xz}+H_{t-1}W_{hz}+b_z)<\/span>（原书公式 9.1.1，PDF 第 355 页）。 <strong>GRU 候选隐状态<\/strong>：<span class=\"katex-inline\">\\tilde H_t=\\tanh(X_tW_{xh}+(R_t\\odot H_{t-1})W_{hh}+b_h)<\/span>。重置门控制构造候选时参考多少过去状态（原书公式 9.1.2，PDF 第 355 页）。 <strong>GRU 隐状态更新<\/strong>：<span class=\"katex-inline\">H_t=Z_t\\odot H_{t-1}+(1-Z_t)\\odot\\tilde H_t<\/span>。更新门控制新状态里旧状态副本与候选状态的比例。<\/p>\n<p><strong>LSTM 三门一记忆元<\/strong>：输入门 <span class=\"katex-inline\">I_t<\/span>、遗忘门 <span class=\"katex-inline\">F_t<\/span>、输出门 <span class=\"katex-inline\">O_t<\/span>，均由 sigmoid 得到；候选记忆元 <span class=\"katex-inline\">\\tilde C_t=\\tanh(X_tW_{xc}+H_{t-1}W_{hc}+b_c)<\/span>（原书公式 9.2.1–9.2.2，PDF 第 361 页）。 <strong>记忆元更新<\/strong>：<span class=\"katex-inline\">C_t=F_t\\odot C_{t-1}+I_t\\odot\\tilde C_t<\/span>（原书公式 9.2.3，PDF 第 362 页）。 <strong>LSTM 隐状态<\/strong>：<span class=\"katex-inline\">H_t=O_t\\odot\\tanh(C_t)<\/span>。记忆元 <span class=\"katex-inline\">C_t<\/span> 专门保存跨步记忆，隐状态 <span class=\"katex-inline\">H_t<\/span> 是对外暴露的表示。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>门的数学角色：sigmoid 把门值压到 <span class=\"katex-inline\">(0,1)<\/span>，按元素乘实现凸组合。遗忘门 <span class=\"katex-inline\">F_t=1<\/span> 时旧记忆全部保留，<span class=\"katex-inline\">F_t=0<\/span> 时旧记忆清空；输入门 <span class=\"katex-inline\">I_t<\/span> 控制候选记忆写入比例。原书 9.2.3 节指出，遗忘门恒 1、输入门恒 0 时，<span class=\"katex-inline\">C_{t-1}<\/span> 随时间保存传递，这一设计针对梯度消失与长距离依赖（PDF 第 362 页）。<\/p>\n<p>GRU 极端门值推演：<span class=\"katex-inline\">R_t\\approx1<\/span> 时候选状态参考完整旧隐状态，退化为普通 RNN；<span class=\"katex-inline\">R_t\\approx0<\/span> 时候选只由当前输入算出，旧状态被重置。<span class=\"katex-inline\">Z_t\\approx1<\/span> 时新状态基本沿用旧隐状态；<span class=\"katex-inline\">Z_t\\approx0<\/span> 时新状态主要取候选。<\/p>\n<p>LSTM 极端门值推演：<span class=\"katex-inline\">F_t=1,I_t=0<\/span> 记忆原样传递；<span class=\"katex-inline\">F_t=0,I_t=1<\/span> 记忆被候选完全替换；<span class=\"katex-inline\">O_t=0<\/span> 记忆元内容不暴露到隐状态；<span class=\"katex-inline\">O_t=1<\/span> 记忆元经 tanh 后全部输出。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：序列存在长短不一的依赖关系；门控参数与循环权重一起通过 BPTT 训练。\n<\/li><li>\n失败案例一：门值长期饱和。sigmoid 两端梯度趋零，对应门失去调节能力；训练初期门值分布要避免全部贴边。\n<\/li><li>\n失败案例二：把门控当梯度消失的万能解。门控提供选择性通路，缓解长程记忆，但超长序列上仍可能出现梯度问题，裁剪与截断 BPTT 仍需配套。\n<\/li><li>\n失败案例三：混淆记忆元与隐状态。LSTM 的 <span class=\"katex-inline\">C_t<\/span> 是内部记忆，<span class=\"katex-inline\">H_t<\/span> 是对外表示；跨步保存靠 <span class=\"katex-inline\">C_t<\/span>，输出给下游的是 <span class=\"katex-inline\">H_t<\/span>。\n<\/li><li>\n边界：门控增加参数与计算量；短序列、简单模式上门控结构可能 over-engineering。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>LSTM vs GRU<\/strong>：LSTM 三门加独立记忆元，记忆保存与对外输出分开；GRU 两门合并更新路径，结构更简、参数更少，实践中效果常接近。GRU 重置门对应候选构造，更新门对应状态融合；LSTM 遗忘门对应记忆保留，输入门对应写入，输出门对应暴露。\n<\/li><li>\n<strong>门控 vs 残差连接<\/strong>：门控按学习到的比例选择信息通路；残差连接提供恒等捷径。两者都缓解深层/长链梯度衰减，但作用对象不同：门控在时间维，残差在层间。\n<\/li><li>\n<strong>候选状态 vs 最终状态<\/strong>：候选 <span class=\"katex-inline\">\\tilde H_t/\\tilde C_t<\/span> 是本步新算的备选表示，最终状态还要经门与旧状态凸组合；不要把候选当成更新后的隐状态。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c11 的 BPTT 连乘分析是门控设计的问题来源；概念 c02 的反向求导沿各门与记忆元回传。后继：概念 c13 的注意力不再依赖门控递归，直接按相关性聚合历史；概念 c14 的优化器在门控参数上更新。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（LSTM/GRU 的门控：各门解决哪个问题与门值推演）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：GRU/LSTM 门方程逐项拆解与门值极端推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要讲清门控机制，先往回追四层前提：<\/p>\n<ol><li>\n普通 RNN 的长程缺陷先定位。梯度沿时间连乘消失，无关观测冲刷记忆，逻辑中断无法重置；这是各门设计对应的具体问题。\n<\/li><li>\n门是 <span class=\"katex-inline\">(0,1)<\/span> 区间的可学习权重向量。sigmoid 输出按元素乘，实现旧状态与候选状态的凸组合。\n<\/li><li>\nGRU 把重置与更新拆成两门。重置门作用在候选构造，更新门作用在状态融合，两步职责分开。\n<\/li><li>\nLSTM 把记忆保存与对外输出分开。记忆元 <span class=\"katex-inline\">C_t<\/span> 跨步传递，隐状态 <span class=\"katex-inline\">H_t<\/span> 经输出门暴露，三门各司其职。\n<\/ol>\n<p>依赖链方向：普通 RNN 长程问题 → sigmoid 门与凸组合 → GRU 两门方程 → LSTM 三门一记忆元 → 门值极端情形推演。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：GRU 重置门与更新门<\/h3>\n<div class=\"katex-block\">R_t=\\sigma(X_tW_{xr}+H_{t-1}W_{hr}+b_r),\\quad Z_t=\\sigma(X_tW_{xz}+H_{t-1}W_{hz}+b_z).<\/div>\n<p><span class=\"katex-inline\">X_t\\in\\mathbb R^{n\\times d}<\/span>，<span class=\"katex-inline\">H_{t-1}\\in\\mathbb R^{n\\times h}<\/span>，门形状 <span class=\"katex-inline\">(n,h)<\/span>。<span class=\"katex-inline\">\\sigma<\/span> 把仿射结果压到 <span class=\"katex-inline\">(0,1)<\/span>；求和时偏置按广播加到每行（原书公式 9.1.1，PDF 第 355 页）。<\/p>\n<h3>第二步：GRU 候选隐状态<\/h3>\n<div class=\"katex-block\">\\tilde H_t=\\tanh(X_tW_{xh}+(R_t\\odot H_{t-1})W_{hh}+b_h).<\/div>\n<p><span class=\"katex-inline\">R_t\\odot H_{t-1}<\/span> 先按元素筛掉旧状态中被重置的部分，再进循环权重。<span class=\"katex-inline\">R_t\\approx1<\/span> 时保留完整旧状态，行为接近普通 RNN；<span class=\"katex-inline\">R_t\\approx0<\/span> 时候选只由当前输入算出。<\/p>\n<h3>第三步：GRU 状态融合<\/h3>\n<div class=\"katex-block\">H_t=Z_t\\odot H_{t-1}+(1-Z_t)\\odot\\tilde H_t.<\/div>\n<p><span class=\"katex-inline\">Z_t<\/span> 是旧状态保留比例，<span class=\"katex-inline\">1-Z_t<\/span> 是候选采用比例，两者逐位互补。<span class=\"katex-inline\">Z_t\\approx1<\/span> 状态沿用旧值；<span class=\"katex-inline\">Z_t\\approx0<\/span> 状态换成候选。<\/p>\n<h3>第四步：LSTM 三门与候选记忆元<\/h3>\n<div class=\"katex-block\">I_t=\\sigma(X_tW_{xi}+H_{t-1}W_{hi}+b_i),\\quad F_t=\\sigma(X_tW_{xf}+H_{t-1}W_{hf}+b_f),\\quad O_t=\\sigma(X_tW_{xo}+H_{t-1}W_{ho}+b_o).<\/div>\n<div class=\"katex-block\">\\tilde C_t=\\tanh(X_tW_{xc}+H_{t-1}W_{hc}+b_c).<\/div>\n<p><span class=\"katex-inline\">I_t<\/span> 输入门控制写入，<span class=\"katex-inline\">F_t<\/span> 遗忘门控制保留，<span class=\"katex-inline\">O_t<\/span> 输出门控制暴露（原书公式 9.2.1–9.2.2，PDF 第 361 页）。<\/p>\n<h3>第五步：记忆元与隐状态<\/h3>\n<div class=\"katex-block\">C_t=F_t\\odot C_{t-1}+I_t\\odot\\tilde C_t,\\quad H_t=O_t\\odot\\tanh(C_t).<\/div>\n<p><span class=\"katex-inline\">C_t<\/span> 是跨步记忆通道；<span class=\"katex-inline\">H_t<\/span> 是交给下游的表示。遗忘门与输入门决定记忆更新，输出门决定记忆元内容能否进入隐状态。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：LSTM 单单元门值四象限<\/h3>\n<p>设 <span class=\"katex-inline\">C_{t-1}=0.8<\/span>，<span class=\"katex-inline\">\\tilde C_t=-0.4<\/span>。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><span class=\"katex-inline\">F_t<\/span><\/th><th><span class=\"katex-inline\">I_t<\/span><\/th><th><span class=\"katex-inline\">C_t=F_tC_{t-1}+I_t\\tilde C_t<\/span><\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>0<\/td><td>0.8<\/td><td>旧记忆原样保留<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>−0.4<\/td><td>记忆被候选替换<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>0.8−0.4=0.4<\/td><td>保留旧值并写入新候选<\/td><\/tr><tr><td>0<\/td><td>0<\/td><td>0<\/td><td>记忆清空<\/td><\/tr><\/tbody><\/table><\/div>\n<p>再取 <span class=\"katex-inline\">O_t=0.3<\/span>：<span class=\"katex-inline\">\\tanh(0.4)\\approx0.380<\/span>，<span class=\"katex-inline\">H_t=0.3\\times0.380\\approx0.114<\/span>；<span class=\"katex-inline\">O_t=1<\/span> 时 <span class=\"katex-inline\">H_t\\approx0.380<\/span>。输出门把记忆元内容按比例放出。<\/p>\n<h3>算例 2：GRU 门值推演<\/h3>\n<p>设 <span class=\"katex-inline\">H_{t-1}=0.6<\/span>，<span class=\"katex-inline\">\\tilde H_t=-0.2<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">Z_t=1<\/span>：<span class=\"katex-inline\">H_t=1\\times0.6+0\\times(-0.2)=0.6<\/span>，沿用旧状态。\n<\/li><li>\n<span class=\"katex-inline\">Z_t=0<\/span>：<span class=\"katex-inline\">H_t=0\\times0.6+1\\times(-0.2)=-0.2<\/span>，采用候选。\n<\/li><li>\n<span class=\"katex-inline\">Z_t=0.5<\/span>：<span class=\"katex-inline\">H_t=0.5\\times0.6+0.5\\times(-0.2)=0.2<\/span>，新旧各半。\n<p>重置门 <span class=\"katex-inline\">R_t<\/span> 作用在 <span class=\"katex-inline\">\\tilde H_t<\/span> 内部：<span class=\"katex-inline\">R_t=0<\/span> 时候选不含旧状态信息；<span class=\"katex-inline\">R_t=1<\/span> 时候选参考完整旧隐状态。<\/p>\n<\/ul>\n<h3>算例 3：门控梯度通路<\/h3>\n<p>记忆元更新 <span class=\"katex-inline\">C_t=F_t\\odot C_{t-1}+I_t\\odot\\tilde C_t<\/span>。反向时 <span class=\"katex-inline\">\\partial C_t/\\partial C_{t-1}=F_t<\/span>：遗忘门接近 1，旧记忆的梯度通路保持畅通；<span class=\"katex-inline\">F_t<\/span> 接近 0，通路被切断。这正是门控缓解梯度消失的直接位置——不是消除连乘，而是给记忆元留一条可选择保留的直通路。<\/p>\n<h2>延伸推演<\/h2>\n<h3>门值初始化的偏置选择<\/h3>\n<p>实践中遗忘门偏置常初始化为 1（或较大正值），训练初期倾向保留旧记忆，避免早期就把历史清空；输入门偏置配合候选尺度调整。门偏置初始化影响训练初期的记忆保留倾向，属于稳定性配套。<\/p>\n<h3>双向与深层 RNN 的位置<\/h3>\n<p>单向 RNN 只看历史；双向 RNN 从两个方向各跑一层再拼接，适合整句已给定的编码任务。深层 RNN 把循环层堆叠，上层在下层隐状态上再递归。门控单元是这些结构的基本循环块。<\/p>\n<h3>门控与注意力的分工<\/h3>\n<p>门控在递归中选择性保存/遗忘信息，状态仍沿时间步传递；注意力直接查询历史所有位置，按相关度加权聚合，不依赖逐步记忆。两者解决序列建模的不同环节，现代模型常组合使用。<\/p>\n<h3>对抗性追问：门控能不能让长程梯度完全不消失<\/h3>\n<p>不能。门控给记忆元提供选择性直通路，缓解消失；超长链上其他路径仍有连乘，梯度裁剪、截断 BPTT 仍是配套手段。把门控当万能解会忽视序列长度带来的根本限制。<\/p>\n<h3>对抗性追问：GRU 一定比 LSTM 快且好<\/h3>\n<p>GRU 参数更少、计算更简，短中期任务表现常接近 LSTM；效果依赖任务与调参，不存在 GRU 全面占优的结论。选择要看序列长度、数据量与算力预算。<\/p>\n<h2>补充推演与第二算例<\/h2>\n<h3>第二算例：LSTM 三步记忆保持推演<\/h3>\n<p>单单元，<span class=\"katex-inline\">C_0=0.5<\/span>，候选 <span class=\"katex-inline\">\\tilde C_t=0.2<\/span>。遗忘门 <span class=\"katex-inline\">F=1<\/span>，输入门 <span class=\"katex-inline\">I=0.5<\/span>：<span class=\"katex-inline\">C_1=1\\times0.5+0.5\\times0.2=0.6<\/span>；第二步 <span class=\"katex-inline\">F=1,I=0.5<\/span>，<span class=\"katex-inline\">C_2=0.6+0.5\\times0.2=0.7<\/span>；第三步遗忘门降到 <span class=\"katex-inline\">F=0<\/span>，<span class=\"katex-inline\">I=1<\/span>，<span class=\"katex-inline\">C_3=0+1\\times0.2=0.2<\/span>，旧记忆被整体替换。记忆元轨迹由两门逐位决定：<span class=\"katex-inline\">F<\/span> 控制保留比例，<span class=\"katex-inline\">I<\/span> 控制写入强度，两步组合决定 <span class=\"katex-inline\">C_t<\/span> 走向。<\/p>\n<h3>门控参数共享<\/h3>\n<p>门权重矩阵在时间步之间复用，与普通 RNN 一致；门值由当前输入与上一步隐状态共同算出。每个门是一套仿射加 sigmoid，参数量随门数增长：LSTM 三门一候选共四组仿射，GRU 两门一候选共三组。<\/p>\n<h3>门值饱和区的梯度<\/h3>\n<p>sigmoid 门值接近 0 或 1 时，门导数 <span class=\"katex-inline\">\\sigma(1-\\sigma)<\/span> 趋近 0，门参数梯度被压平；长期卡在饱和区的门很难调整开闭倾向。训练初期遗忘门偏置取正值，是让门先停在中段、留出梯度空间的配套选择。<\/p>\n<h3>GRU 与 LSTM 的单元对应<\/h3>\n<p>GRU 用更新门融合新旧状态、重置门约束候选构造；LSTM 把记忆保存与对外输出拆成记忆元加输出门。两者都用门控选择信息通路，LSTM 多一条独立记忆通道，GRU 参数更少。任务上两者表现接近，选择依赖序列长度与调参预算。<\/p>\n<h3>对抗性追问：门控能消除所有长程梯度问题<\/h3>\n<p>不能。门控给记忆元留可选直通路，缓解消失；超长链上其他路径仍有连乘，饱和门还会压住局部梯度。截断 BPTT、梯度裁剪仍是配套手段，门控不是长程建模的完整答案。<\/p>\n<h3>第二轮补充<\/h3>\n<h3>第二算例：GRU 更新门凸组合数值<\/h3>\n<p><span class=\"katex-inline\">H_{t-1}=0.6<\/span>，<span class=\"katex-inline\">\\tilde H_t=-0.2<\/span>，<span class=\"katex-inline\">Z_t=0.2<\/span>：<span class=\"katex-inline\">H_t=0.2\\times0.6+0.8\\times(-0.2)=0.12-0.16=-0.04<\/span>；<span class=\"katex-inline\">Z_t=0.8<\/span>：<span class=\"katex-inline\">H_t=0.48-0.04=0.44<\/span>。更新门偏向保留旧状态时，候选被采用比例小；偏向新候选时，旧状态占比小。<\/p>\n<h3>门控与残差连接的结构对照<\/h3>\n<p>LSTM 记忆元 <span class=\"katex-inline\">C_t=F_t\\odot C_{t-1}+\\cdots<\/span> 与残差捷径 <span class=\"katex-inline\">x+\\mathrm{sublayer}(x)<\/span> 同构：保留通路由门控系数或加法连接控制，梯度可沿保留通路直达早期步或浅层。门控是带可学习开关的捷径，残差是固定恒等捷径。<\/p>\n<h3>门控单元的参数量对照<\/h3>\n<p>单层普通 RNN：输入到隐状态一组权重；GRU 两门一候选三组；LSTM 三门一候选四组。门越多可学习开关越多，表达能力增强的同时参数量与过拟合风险上升。<\/p>\n<h3>对抗性追问：门控状态能否跨样本沿用<\/h3>\n<p>不能。门控记忆元与隐状态都随序列开始初始化；跨样本沿用等于把上一样本的记忆带入下一样本，造成信息泄漏。评估与新样本序列同样从零状态起步。<\/p>\n<h3>第三轮补充<\/h3>\n<h3>第二算例：遗忘门关闭时的记忆轨迹<\/h3>\n<p><span class=\"katex-inline\">C_{t-1}=0.7<\/span>，<span class=\"katex-inline\">F=0<\/span>，<span class=\"katex-inline\">I=0<\/span>，<span class=\"katex-inline\">\\tilde C=0.3<\/span>：<span class=\"katex-inline\">C_t=0\\times0.7+0\\times0.3=0<\/span>，记忆清空；<span class=\"katex-inline\">F=0,I=1<\/span>：<span class=\"katex-inline\">C_t=\\tilde C<\/span>，整体替换；<span class=\"katex-inline\">F=1,I=1<\/span>：<span class=\"katex-inline\">C_t=C_{t-1}+\\tilde C<\/span>，记忆叠加。两门组合覆盖保留、替换、清空、叠加四种记忆操作。<\/p>\n<h3>延伸：门控单元在深层堆叠中的位置<\/h3>\n<p>门控循环块沿时间递归；多层堆叠时上层接收下层隐状态再递归。门控缓解时间维长依赖，层间深度问题仍要靠残差、归一化配套；不要把门控当成解决所有深度问题的结构。<\/p>\n<h3>对抗性追问：门值能不能取硬 0/1 训练<\/h3>\n<p>硬门不可导，无法走梯度下降；sigmoid 软化出 <span class=\"katex-inline\">(0,1)<\/span> 连续值，让门参数可学习。训练后期门值可能接近饱和，但训练通路仍依赖软化导数。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nGRU 两门各作用在哪一步？（重置门作用候选构造；更新门作用状态融合。）\n<\/li><li>\nLSTM 记忆元更新公式是什么？（<span class=\"katex-inline\">C_t=F_t\\odot C_{t-1}+I_t\\odot\\tilde C_t<\/span>。）\n<\/li><li>\n遗忘门接近 1 时梯度通路怎样？（<span class=\"katex-inline\">\\partial C_t/\\partial C_{t-1}=F_t<\/span>，通路保持畅通；接近 0 则切断。）\n<\/li><li>\nLSTM 的 <span class=\"katex-inline\">C_t<\/span> 与 <span class=\"katex-inline\">H_t<\/span> 分工是什么？（<span class=\"katex-inline\">C_t<\/span> 内部跨步记忆；<span class=\"katex-inline\">H_t<\/span> 经输出门暴露给下游。）\n<\/li><li>\n门控缓解梯度消失的位置在哪？（记忆元保留通路由遗忘门控制，给旧记忆梯度留出可选直通路。）\n<\/ol><\/div><\/details>", "c13": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.411<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c12\">LSTM/GRU 的门控：各门解决哪个问题与门值推演<\/a><\/span><\/div><h1>注意力与 Transformer：缩放点积注意力、方差缩放与多头/自注意力<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章（原书 10.3 注意力评分函数、10.3.3 缩放点积注意力、10.7 Transformer，PDF 第 411、415、431–432 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>编码器—解码器模型把整句压缩进一个隐状态，长句信息在压缩中丢失；解码时该关注源句哪些位置，靠递归状态传递不够直接。注意力机制让输出端按查询与各键的相关度，对历史值做加权聚合：相关度高的位置权重高，聚合结果保留对应信息。Transformer 完全建立在自注意力之上，没有卷积层或循环层，靠多头自注意力加位置编码捕捉序列关系。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>查询、键、值<\/strong>：<span class=\"katex-inline\">Q\\in\\mathbb R^{n\\times d}<\/span> 查询矩阵，<span class=\"katex-inline\">K\\in\\mathbb R^{m\\times d}<\/span> 键矩阵，<span class=\"katex-inline\">V\\in\\mathbb R^{m\\times v}<\/span> 值矩阵。查询提出需求，键做匹配，值是被聚合的内容。 <strong>评分函数<\/strong>：衡量查询与键的匹配程度；加性注意力用单隐层前网络，点积注意力用向量内积（原书 10.3 节，PDF 第 411 页）。 <strong>缩放点积注意力<\/strong>：<\/p>\n<div class=\"katex-block\">\\mathrm{softmax}\\left(\\frac{QK^\\top}{\\sqrt d}\\right)V\\in\\mathbb R^{n\\times v}.<\/div>\n<p>评分 <span class=\"katex-inline\">a(q,k)=q^\\top k/\\sqrt d<\/span>（原书公式 10.3.4–10.3.5，PDF 第 415 页）。 <strong>多头注意力<\/strong>：把 <span class=\"katex-inline\">Q,K,V<\/span> 切到多个子空间分别做注意力，再拼接投影（原书 10.5 节，PDF 第 422 页前后）。 <strong>自注意力<\/strong>：查询、键、值来自同一组输入；序列内任意两个位置直接交互，最大路径长度为 1。 <strong>位置编码<\/strong>：自注意力本身不含顺序信息，输入嵌入加位置编码注入绝对或相对位置（原书 10.7.1 节，PDF 第 431 页）。 <strong>Transformer 子层<\/strong>：编码器每层含多头自注意力子层加位置前馈网络，子层采用残差连接与层规范化（原书 10.7.1 节，PDF 第 432 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>点积方差推导：设 <span class=\"katex-inline\">q_i,k_i<\/span> 独立、零均值、单位方差。<span class=\"katex-inline\">a=q^\\top k=\\sum_{i=1}^d q_i k_i<\/span>，<span class=\"katex-inline\">E[q_i k_i]=E[q_i]E[k_i]=0<\/span>，<span class=\"katex-inline\">\\mathrm{Var}(q_i k_i)=E[q_i^2]E[k_i^2]=1<\/span>。各分量独立，方差可加 <span class=\"katex-inline\">\\mathrm{Var}(a)=d<\/span>。维度越大点积波动随 <span class=\"katex-inline\">\\sqrt d<\/span> 增大，softmax 进入饱和区、梯度趋零；除以 <span class=\"katex-inline\">\\sqrt d<\/span> 后方差回到 1：<span class=\"katex-inline\">\\mathrm{Var}(q^\\top k/\\sqrt d)=d/d=1<\/span>。<\/p>\n<p>形状流转：<span class=\"katex-inline\">QK^\\top<\/span> 形状 <span class=\"katex-inline\">(n,m)<\/span>，逐行 softmax 得注意力权重，再乘 <span class=\"katex-inline\">V<\/span> 得 <span class=\"katex-inline\">(n,v)<\/span>。批量维度保留，注意力在批量内独立计算。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：查询与键维度相同才能做点积；加性注意力可处理不同长度。掩码 softmax 用于屏蔽无效位置（原书 10.3.1 节掩蔽 softmax，PDF 第 412 页前后）。\n<\/li><li>\n失败案例一：不做缩放。<span class=\"katex-inline\">d<\/span> 大时点积方差为 <span class=\"katex-inline\">d<\/span>，softmax 输出接近 one-hot，训练前期更新缓慢，不同维度规模不可比。\n<\/li><li>\n失败案例二：去掉位置编码。自注意力对输入排列不变，打乱词序不改变注意力结果；不加位置信息模型分不清顺序。\n<\/li><li>\n失败案例三：长序列硬套自注意力。注意力复杂度关于序列长度二次方，序列很长时计算与内存成本失控。\n<\/li><li>\n边界：注意力聚合所有位置加权信息，不替代局部特征提取；视觉、语音任务中常与卷积配合。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>注意力 vs 全连接<\/strong>：全连接按固定权重跨位置连接；注意力权重由查询—键匹配动态算出，每个查询的聚合组合随输入变化。\n<\/li><li>\n<strong>自注意力 vs CNN/RNN<\/strong>：自注意力任意位置直接交互、路径长度 1、可并行；CNN 局部连接、权值共享；RNN 沿时间递归、路径长度随序列增长。自注意力代价是二次复杂度（原书 10.6.2 节对比，PDF 第 430 页前后）。\n<\/li><li>\n<strong>点积注意力 vs 加性注意力<\/strong>：点积要求 <span class=\"katex-inline\">q,k<\/span> 等长、计算快；加性用前网络适配不同长度，表达灵活但更慢。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c11 的序列建模与概念 c12 的门控递归是注意力要替代/补充的路径；概念 c04 的 softmax 稳定化手法复用于注意力权重。后继：概念 c14 的优化器在注意力参数上更新；Transformer 残差连接复用第 3 章 ResNet 的捷径思想。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（注意力与 Transformer：缩放点积注意力、方差缩放与多头/自注意力）<\/summary><div class=\"depth-body\"><h1>c13 深度推导：缩放点积注意力方差、批量形状与 Transformer 子层算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要讲清注意力机制，先往回追四层前提：<\/p>\n<ol><li>\n序列到序列建模存在隐状态瓶颈。递归压缩长句信息有损，解码时定位源句相关位置不直接，这是注意力登场的动机。\n<\/li><li>\n聚合按相关度加权。查询与键匹配出评分，评分经 softmax 归一为权重，权重对值加权求和。\n<\/li><li>\n点积评分的方差随维度增长。先推点积方差，再解释除以 <span class=\"katex-inline\">\\sqrt d<\/span> 把方差压回 1 的依据。\n<\/li><li>\n多头与位置编码补两个缺口。多头把子空间拆分学习；位置编码补上自注意力缺失的顺序信息。\n<\/ol>\n<p>依赖链方向：隐状态瓶颈 → 查询/键/值定义 → 评分归一加权 → 点积方差与缩放 → 多头、位置编码与 Transformer 子层组装。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：评分到加权聚合<\/h3>\n<p>单查询 <span class=\"katex-inline\">q<\/span>、键 <span class=\"katex-inline\">k_j<\/span>、值 <span class=\"katex-inline\">v_j<\/span>：<\/p>\n<div class=\"katex-block\">a(q,k_j)=\\frac{q^\\top k_j}{\\sqrt d},\\quad \\alpha_j=\\frac{\\exp(a(q,k_j))}{\\sum_l\\exp(a(q,k_l))},\\quad \\mathrm{Att}(q,K,V)=\\sum_j\\alpha_j v_j.<\/div>\n<p>批量形式 <span class=\"katex-inline\">QK^\\top<\/span> 一次算全部查询—键评分，逐行 softmax，再乘 <span class=\"katex-inline\">V<\/span>。<\/p>\n<h3>第二步：点积方差推导<\/h3>\n<p><span class=\"katex-inline\">q,k\\in\\mathbb R^d<\/span>，各分量独立、零均值、单位方差。分量积 <span class=\"katex-inline\">q_i k_i<\/span>：<\/p>\n<div class=\"katex-block\">E[q_i k_i]=E[q_i]E[k_i]=0,\\quad \\mathrm{Var}(q_i k_i)=E[q_i^2]E[k_i^2]=1.<\/div>\n<p>独立分量方差可加：<span class=\"katex-inline\">\\mathrm{Var}(q^\\top k)=\\sum_{i=1}^d 1=d<\/span>。 除以 <span class=\"katex-inline\">\\sqrt d<\/span>：<span class=\"katex-inline\">\\mathrm{Var}(q^\\top k/\\sqrt d)=d/d=1<\/span>。不缩放时 <span class=\"katex-inline\">d<\/span> 越大评分分布越宽，softmax 在大评分差处饱和，梯度被压住；缩放保持评分落在敏感区间。<\/p>\n<h3>第三步：批量形状流转<\/h3>\n<p><span class=\"katex-inline\">Q\\in\\mathbb R^{n\\times d}<\/span>，<span class=\"katex-inline\">K\\in\\mathbb R^{m\\times d}<\/span>，<span class=\"katex-inline\">V\\in\\mathbb R^{m\\times v}<\/span>。 <span class=\"katex-inline\">S=QK^\\top\\in\\mathbb R^{n\\times m}<\/span>；<span class=\"katex-inline\">A=\\mathrm{softmax}(S/\\sqrt d)\\in\\mathbb R^{n\\times m}<\/span>；输出 <span class=\"katex-inline\">AV\\in\\mathbb R^{n\\times v}<\/span>。批量维 <span class=\"katex-inline\">b<\/span> 全程保留，注意力在每个批量内独立算。<\/p>\n<h3>第四步：多头与子层结构<\/h3>\n<p>多头把 <span class=\"katex-inline\">Q,K,V<\/span> 按子空间切 <span class=\"katex-inline\">h<\/span> 份，每份做缩放点积注意力，结果拼接后线性投影。编码器子层流程：输入 <span class=\"katex-inline\">x<\/span> → 多头自注意力 → 残差 <span class=\"katex-inline\">x+\\mathrm{sublayer}(x)<\/span> → 层规范化；再接位置前馈网络，同样残差加 LN（原书 10.7.1 节，PDF 第 432 页）。要求子层输出维度与输入一致，残差相加才有定义。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：两查询三键注意力手算<\/h3>\n<p><span class=\"katex-inline\">Q=\\begin{pmatrix}1&amp;0\\\\0&amp;1\\end{pmatrix}<\/span>，<span class=\"katex-inline\">K=\\begin{pmatrix}1&amp;1\\\\0&amp;1\\\\1&amp;0\\end{pmatrix}<\/span>，<span class=\"katex-inline\">V=\\begin{pmatrix}1&amp;2\\\\3&amp;4\\\\5&amp;6\\end{pmatrix}<\/span>，<span class=\"katex-inline\">d=2<\/span>，<span class=\"katex-inline\">\\sqrt d\\approx1.414<\/span>。 <span class=\"katex-inline\">QK^\\top=\\begin{pmatrix}1&amp;0\\\\0&amp;1\\end{pmatrix}\\begin{pmatrix}1&amp;0&amp;1\\\\1&amp;1&amp;0\\end{pmatrix}=\\begin{pmatrix}1&amp;0&amp;1\\\\1&amp;1&amp;0\\end{pmatrix}<\/span>。 评分除以 <span class=\"katex-inline\">\\sqrt2<\/span>：第一行 <span class=\"katex-inline\">(0.707,0,0.707)<\/span>，第二行 <span class=\"katex-inline\">(0.707,0.707,0)<\/span>。 第一行 softmax：<span class=\"katex-inline\">e^{0.707}=2.028,e^0=1,e^{0.707}=2.028<\/span>，和 5.056，权重 <span class=\"katex-inline\">(0.401,0.198,0.401)<\/span>。 加权值：<span class=\"katex-inline\">0.401(1,2)+0.198(3,4)+0.401(5,6)\\approx(0.401+0.594+2.005,\\ 0.802+0.792+2.406)=(3.00,4.00)<\/span>。 第二行对称地得 <span class=\"katex-inline\">(1.99,3.99)<\/span> 量级。<\/p>\n<h3>算例 2：维度对方差的影响<\/h3>\n<p><span class=\"katex-inline\">d=1<\/span> 时点积方差 1；<span class=\"katex-inline\">d=64<\/span> 时未缩放方差 64，评分标准差 8；除以 <span class=\"katex-inline\">\\sqrt{64}=8<\/span> 后标准差回到 1。维度越大，不缩放的 softmax 越容易压成接近 one-hot 的分布，训练前期梯度越薄。<\/p>\n<h3>代码片段：缩放点积注意力（原书 10.3.3 节，PDF 第 415 页）<\/h3>\n<pre class=\"lang-python\"><code>import math, torch\nfrom torch import nn\n\nclass DotProductAttention(nn.Module):\n    def __init__(self, dropout, **kwargs):\n        super().__init__(**kwargs)\n        self.dropout = nn.Dropout(dropout)\n\n    def forward(self, queries, keys, values, valid_lens=None):\n        d = queries.shape[-1]\n        scores = torch.bmm(queries, keys.transpose(1, 2)) / math.sqrt(d)\n        self.attention_weights = masked_softmax(scores, valid_lens)\n        return torch.bmm(self.dropout(self.attention_weights), values)<\/code><\/pre>\n<p><code>bmm<\/code> 按批量做矩阵乘；<code>masked_softmax<\/code> 把无效位置屏蔽出权重分布。<\/p>\n<h2>延伸推演<\/h2>\n<h3>位置编码为什么必需<\/h3>\n<p>自注意力对集合排列不变：调换输入顺序，注意力权重与输出只跟着换位，模型本身不记录先后。位置编码把位置向量加到嵌入上，让每层注意力能区分词元顺序；可学习位置编码或固定三角正弦编码两类实现（原书 10.7.1 节，PDF 第 431 页）。<\/p>\n<h3>CNN/RNN/自注意力三对比<\/h3>\n<ul><li>\n并行性：自注意力与 CNN 可批量并行；RNN 步间依赖，串行更新。\n<\/li><li>\n路径长度：自注意力任意两点直达，路径长度 1；RNN 路径长度随序列增长；CNN 靠堆叠扩大感受野。\n<\/li><li>\n复杂度：自注意力关于序列长度二次方；CNN 局部窗口线性；RNN 线性但串行。\n<\/ul>\n<h3>掩蔽 softmax 的位置<\/h3>\n<p>解码器自注意力不能看到未来位置；掩蔽 softmax 把未来键评分设为 <span class=\"katex-inline\">-\\infty<\/span>，softmax 后权重为 0。掩蔽在归一化前施加，避免未来信息泄漏（原书 10.3.1 节，PDF 第 412 页前后）。<\/p>\n<h3>对抗性追问：注意力能不能替代卷积做局部提取<\/h3>\n<p>注意力全局加权，缺少卷积的局部卷积核结构；纯注意力在小数据、局部纹理任务上未必占优。视觉 Transformer 仍切块嵌入再注意力，局部归纳偏置要靠切块与位置编码补。<\/p>\n<h3>对抗性追问：多头是不是越多越好<\/h3>\n<p>多头增加子空间划分与参数，但头数超过维度预算后每个子空间过窄，区分度下降；头数与模型宽度配套选择，不是越多越细。<\/p>\n<h2>补充推演与第二算例<\/h2>\n<h3>第二算例：打乱顺序后自注意力结果不变<\/h3>\n<p>自注意力权重由 <span class=\"katex-inline\">QK^\\top<\/span> 决定，输入词元顺序不进入计算；把序列词元打乱，各位置的查询—键配对跟着换位，聚合结果按换位重排，模型本身不察觉顺序。位置编码把位置向量加到嵌入后，注意力才能区分先后；去掉位置编码，调换词序不改变每组注意力配对的集合。<\/p>\n<h3>多头子空间维度<\/h3>\n<p><span class=\"katex-inline\">d<\/span> 维表示切 <span class=\"katex-inline\">h<\/span> 个头，每头维度 <span class=\"katex-inline\">d/h<\/span>；每头在子空间内独立算缩放点积注意力，结果拼接回 <span class=\"katex-inline\">d<\/span> 维再投影。头数增加使每头子空间变窄，<span class=\"katex-inline\">d/h<\/span> 过小时分头区分度下降；头数与模型宽度配套，不能把宽度拆得过细。<\/p>\n<h3>残差与层规范化的位置<\/h3>\n<p>Transformer 子层结构：注意力 → 残差相加 → 层规范化，前馈网络 → 残差相加 → 层规范化。残差让梯度沿捷径直达低层，LN 稳住子层输入尺度；这与第 3 章 ResNet 残差连接同源，只是规范化换成层规范化。<\/p>\n<h3>对抗性追问：长序列自注意力怎么压成本<\/h3>\n<p>注意力复杂度关于序列长度二次方，长序列需要稀疏注意力、滑动窗口或分段聚合等近似结构，限制每个查询能接触的键范围。纯全局注意力在超长序列上的算力与内存代价不会被优化器抵消。<\/p>\n<h3>第二轮补充<\/h3>\n<h3>第二算例：缩放前后 softmax 饱和度对照<\/h3>\n<p><span class=\"katex-inline\">d=64<\/span>，两查询键点积未缩放标准差约 8；评分差 16 时 softmax 趋近 one-hot。除以 <span class=\"katex-inline\">\\sqrt{64}=8<\/span> 后评分标准差约 1，评分差落在 softmax 敏感区间。维度越高，未缩放的饱和风险越大；缩放是把评分尺度拉回可学习区间的措施。<\/p>\n<h3>注意力权重与特征复用的对照<\/h3>\n<p>全连接权重对所有输入固定；注意力权重随查询—键匹配动态变化，同一组值在不同查询下聚合组合不同。动态权重带来灵活性，也带来二次复杂度计算成本。<\/p>\n<h3>对抗性追问：位置编码能不能用相对位置替代绝对位置<\/h3>\n<p>可以。相对位置编码只编码词元间距，平移整句不改变间距关系；绝对位置编码记录绝对序号。两类方案在 Transformer 中都有实现，关键是注意力输入必须携带顺序信息。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n缩放点积注意力公式与输出形状是什么？（<span class=\"katex-inline\">\\mathrm{softmax}(QK^\\top/\\sqrt d)V<\/span>，输出 <span class=\"katex-inline\">(n,v)<\/span>。）\n<\/li><li>\n点积方差为什么随 <span class=\"katex-inline\">d<\/span> 增长，缩放依据是什么？（独立分量方差可加，<span class=\"katex-inline\">\\mathrm{Var}(q^\\top k)=d<\/span>；除以 <span class=\"katex-inline\">\\sqrt d<\/span> 后方差回到 1。）\n<\/li><li>\n自注意力为什么必须加位置编码？（注意力对排列不变，本身不含顺序信息。）\n<\/li><li>\n自注意力相对 CNN/RNN 的两项结构优势与一项代价是什么？（并行、路径长度 1；二次复杂度。）\n<\/li><li>\n掩蔽 softmax 屏蔽的是什么位置？（解码器未来位置，评分设 <span class=\"katex-inline\">-\\infty<\/span> 使权重为 0。）\n<\/ol><\/div><\/details>", "c14": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.445<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">线性回归：正规方程解析解与梯度下降/小批量随机梯度下降<\/a><\/span><\/div><h1>优化算法：SGD、动量法与 Adam 的状态更新及偏差修正<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书 11.4 随机梯度下降、11.6 动量法、11.10 Adam 算法，PDF 第 445、484、506–508 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>训练深度网络要在损失面上反复更新参数。纯随机梯度下降沿当前小批量梯度走一步，在狭长损失面上沿浅方向来回震荡、下降缓慢；不同坐标的曲率差异大时，统一学习率顾此失彼。动量法累积历史梯度抵消震荡、加速一致方向；Adam 同时维护梯度一阶矩与二阶矩，按坐标自适应缩放更新。理解各优化器的状态变量、更新式与偏差修正，才能在训练中判断收敛行为。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>小批量随机梯度下降<\/strong>：<span class=\"katex-inline\">x_t\\leftarrow x_{t-1}-\\eta g_t<\/span>，<span class=\"katex-inline\">g_t<\/span> 是当前批量损失对参数的梯度，<span class=\"katex-inline\">\\eta<\/span> 学习率。 <strong>动量法状态（原书 11.6 累加型约定）<\/strong>：<span class=\"katex-inline\">v_t\\leftarrow\\beta v_{t-1}+g_t<\/span>，<span class=\"katex-inline\">\\beta<\/span> 动量系数；更新 <span class=\"katex-inline\">x_t\\leftarrow x_{t-1}-\\eta v_t<\/span>（原书公式 11.6.2、11.6.5，PDF 第 484、486 页）。这版递推把历史梯度按 <span class=\"katex-inline\">\\beta<\/span> 衰减累加，不显式乘 <span class=\"katex-inline\">(1-\\beta)<\/span>；<span class=\"katex-inline\">\\beta=0<\/span> 退回普通梯度下降。稳态下权重和 <span class=\"katex-inline\">\\sum_{\\tau=0}^{\\infty}\\beta^\\tau=1/(1-\\beta)<\/span>，<span class=\"katex-inline\">v<\/span> 的量级是平均梯度的 <span class=\"katex-inline\">1/(1-\\beta)<\/span> 倍，等效学习率放大为 <span class=\"katex-inline\">\\eta/(1-\\beta)<\/span>（原书 PDF 第 488 页）。深度学习框架与 Adam 一阶矩常用另一套 EMA 凸组合约定 <span class=\"katex-inline\">v_t\\leftarrow\\beta v_{t-1}+(1-\\beta)g_t<\/span>，<span class=\"katex-inline\">v<\/span> 直接估计梯度均值，不带这一放大；两套写法的 <span class=\"katex-inline\">\\beta<\/span> 含义不同，套用更新式前要先确认是哪一套。 <strong>Adam 一阶矩与二阶矩<\/strong>：<\/p>\n<div class=\"katex-block\">v_t\\leftarrow\\beta_1 v_{t-1}+(1-\\beta_1)g_t,\\quad s_t\\leftarrow\\beta_2 s_{t-1}+(1-\\beta_2)g_t^2.<\/div>\n<p><span class=\"katex-inline\">\\beta_1=0.9<\/span>，<span class=\"katex-inline\">\\beta_2=0.999<\/span>（原书公式 11.10.1，PDF 第 507 页）。 <strong>偏差修正<\/strong>：<span class=\"katex-inline\">\\hat v_t=v_t/(1-\\beta_1^t)<\/span>，<span class=\"katex-inline\">\\hat s_t=s_t/(1-\\beta_2^t)<\/span>（原书公式 11.10.2，PDF 第 507 页）。 <strong>Adam 更新<\/strong>：<span class=\"katex-inline\">g&#x27;_t=\\eta\\,\\hat v_t/\\sqrt{\\hat s_t+\\epsilon}<\/span>，<span class=\"katex-inline\">x_t\\leftarrow x_{t-1}-g&#x27;_t<\/span>，<span class=\"katex-inline\">\\epsilon<\/span> 取 <span class=\"katex-inline\">10^{-6}<\/span> 量级（原书公式 11.10.3–11.10.4，PDF 第 507 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>动量为什么能减震：当前梯度在浅方向符号反复翻转，历史累加后正负抵消；在一致下降方向上，动量累积放大前进速度。按原书递推 <span class=\"katex-inline\">v_t=\\beta v_{t-1}+g_t<\/span> 展开，<span class=\"katex-inline\">v_t=\\sum_{\\tau=0}^{t-1}\\beta^\\tau g_{t-\\tau}<\/span>，近期梯度权重高、远期梯度按 <span class=\"katex-inline\">\\beta<\/span> 几何衰减；这一约定下 <span class=\"katex-inline\">v<\/span> 是带 <span class=\"katex-inline\">1/(1-\\beta)<\/span> 放大的历史累加量，而非归一化后的梯度均值。<\/p>\n<p>Adam 偏差修正的来源：<span class=\"katex-inline\">v_0=s_0=0<\/span>，前几步矩估计被零初值拖低，尤其二阶矩偏小会让步长虚高。除以 <span class=\"katex-inline\">1-\\beta^t<\/span> 把早期估计的偏差补回来：<span class=\"katex-inline\">t<\/span> 很小时分母小、修正幅度大，<span class=\"katex-inline\">t<\/span> 增大后 <span class=\"katex-inline\">\\beta^t\\to0<\/span>，修正项趋近 1。<\/p>\n<p>更新尺度：<span class=\"katex-inline\">\\hat v_t<\/span> 沿梯度方向给动量，<span class=\"katex-inline\">\\sqrt{\\hat s_t}<\/span> 按梯度平方的长期大小缩放；梯度波动大的坐标步长被压低，稳定坐标步长保留。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：损失可求梯度；学习率仍是主超参数，自适应方法不替代调学习率。\n<\/li><li>\n失败案例一：Adam 不做偏差修正。初期矩估计偏低，二阶矩过小导致更新步长虚高，参数在起步阶段震荡。\n<\/li><li>\n失败案例二：把 Adam 当收敛保证。原书指出 Adam 在方差控制不良时可能发散，后续工作提出 Yogi 等修补（PDF 第 507 页）；训练发散不能只换优化器，要查梯度、学习率与数据。\n<\/li><li>\n失败案例三：忽略优化目标与泛化目标的差别。优化最小化训练经验风险，泛化风险还要靠正则化与模型选择控制（原书 11.1.1 节，PDF 第 446 页）。\n<\/li><li>\n边界：凸问题上的收敛分析不能直接套到深度网络非凸损失；优化器加速经验收敛，不保证找到全局最优。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>SGD vs 动量法<\/strong>：SGD 只看当前梯度，窄面易震荡；动量累积历史梯度，一致方向加速、翻转方向抵消。\n<\/li><li>\n<strong>动量法 vs Adam<\/strong>：动量只累积一阶方向；Adam 再加二阶矩做逐坐标缩放，并显式偏差修正。Adam 参数自适应更强，SGD 加动量在泛化表现上常被认为更稳。\n<\/li><li>\n<strong>一阶矩 vs 二阶矩<\/strong>：一阶矩 <span class=\"katex-inline\">v_t<\/span> 估计梯度均值方向；二阶矩 <span class=\"katex-inline\">s_t<\/span> 估计梯度平方的长期水平，用于尺度归一。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c03 的梯度下降是所有优化器的基线；概念 c02 提供梯度计算。后继：优化器在门控网络（概念 c12）、注意力（概念 c13）参数上更新；权重衰减（概念 c06）可叠加在任一优化器更新规则上。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（优化算法：SGD、动量法与 Adam 的状态更新及偏差修正）<\/summary><div class=\"depth-body\"><h1>c14 深度推导：动量递推、Adam 矩估计与偏差修正算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要讲清各优化器差别，先往回追四层前提：<\/p>\n<ol><li>\n基线更新规则来自梯度下降。先写纯 SGD 更新式，所有后续算法都在它之上叠加状态估计。\n<\/li><li>\n窄损失面的震荡需要历史信息抵消。动量按衰减累加历史梯度，一致方向累积、翻转方向抵消。\n<\/li><li>\n逐坐标曲率差异需要二阶信息。Adam 维护梯度平方长期水平，按坐标自适应缩放步长。\n<\/li><li>\n零初值带来早期偏差。矩从 0 起步，前几步估计偏低，偏差修正把这部分补回。\n<\/ol>\n<p>依赖链方向：纯 SGD 更新 → 动量一阶矩递推 → Adam 一阶/二阶矩 → 偏差修正 → 自适应步长更新。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：纯 SGD<\/h3>\n<div class=\"katex-block\">x_t=x_{t-1}-\\eta g_t,\\quad g_t=\\nabla L(x_{t-1}).<\/div>\n<p>批量大小影响 <span class=\"katex-inline\">g_t<\/span> 的方差：批量小梯度噪声大，批量大估计稳但每轮计算重。学习率 <span class=\"katex-inline\">\\eta<\/span> 控制单步幅度。<\/p>\n<h3>第二步：动量递推与展开（原书 11.6 累加型约定）<\/h3>\n<div class=\"katex-block\">v_t=\\beta v_{t-1}+g_t.<\/div>\n<p>展开：<\/p>\n<div class=\"katex-block\">v_t=g_t+\\beta g_{t-1}+\\beta^2 g_{t-2}+\\cdots+\\beta^{t-1}g_1=\\sum_{\\tau=0}^{t-1}\\beta^\\tau g_{t-\\tau}.<\/div>\n<p>权重 <span class=\"katex-inline\">\\beta^\\tau<\/span> 按几何级数衰减，近期梯度权重大。更新 <span class=\"katex-inline\">x_t=x_{t-1}-\\eta v_t<\/span>。连续两步梯度同向时 <span class=\"katex-inline\">v_t<\/span> 比单步梯度大，加速下降；符号翻转时历史累加把震荡抹平。<span class=\"katex-inline\">\\beta=0<\/span> 时 <span class=\"katex-inline\">v_t=g_t<\/span>，退回纯梯度下降。<\/p>\n<p>稳态下权重和 <span class=\"katex-inline\">\\sum_{\\tau=0}^{\\infty}\\beta^\\tau=1/(1-\\beta)<\/span>，若梯度均值为 <span class=\"katex-inline\">\\mu<\/span>，则 <span class=\"katex-inline\">v\\approx\\mu/(1-\\beta)<\/span>，等效步长为 <span class=\"katex-inline\">\\eta/(1-\\beta)<\/span>。对照 EMA 凸组合约定 <span class=\"katex-inline\">v_t=\\beta v_{t-1}+(1-\\beta)g_t<\/span>：其展开权重为 <span class=\"katex-inline\">(1-\\beta)\\beta^\\tau<\/span>，权重和为 1，<span class=\"katex-inline\">v<\/span> 直接估计均值 <span class=\"katex-inline\">\\mu<\/span>，没有 <span class=\"katex-inline\">1/(1-\\beta)<\/span> 放大；框架优化器与下面 Adam 一阶矩用的是这一套。两套 <span class=\"katex-inline\">\\beta<\/span> 不可直接互换。<\/p>\n<h3>第三步：Adam 双矩<\/h3>\n<div class=\"katex-block\">v_t=\\beta_1 v_{t-1}+(1-\\beta_1)g_t,\\quad s_t=\\beta_2 s_{t-1}+(1-\\beta_2)g_t^2.<\/div>\n<p><span class=\"katex-inline\">v_t<\/span> 一阶矩估计梯度期望方向，<span class=\"katex-inline\">s_t<\/span> 二阶矩估计梯度平方水平。<span class=\"katex-inline\">\\beta_1=0.9<\/span> 一阶矩跟踪快，<span class=\"katex-inline\">\\beta_2=0.999<\/span> 二阶矩跟踪慢。<\/p>\n<h3>第四步：偏差修正<\/h3>\n<p>零初值 <span class=\"katex-inline\">v_0=s_0=0<\/span>。一阶矩期望 <span class=\"katex-inline\">E[v_t]\\approx(1-\\beta_1^t)E[g]<\/span>，除以 <span class=\"katex-inline\">1-\\beta_1^t<\/span> 修正：<\/p>\n<div class=\"katex-block\">\\hat v_t=\\frac{v_t}{1-\\beta_1^t},\\quad \\hat s_t=\\frac{s_t}{1-\\beta_2^t}.<\/div>\n<p><span class=\"katex-inline\">t=1<\/span> 时分母 <span class=\"katex-inline\">1-\\beta<\/span> 最小，修正幅度最大；<span class=\"katex-inline\">t\\to\\infty<\/span> 时 <span class=\"katex-inline\">\\beta^t\\to0<\/span>，分母趋 1，修正自动淡出。<\/p>\n<h3>第五步：自适应更新<\/h3>\n<div class=\"katex-block\">g'_t=\\eta\\frac{\\hat v_t}{\\sqrt{\\hat s_t+\\epsilon}},\\quad x_t=x_{t-1}-g'_t.<\/div>\n<p><span class=\"katex-inline\">\\hat v_t<\/span> 给方向，<span class=\"katex-inline\">\\sqrt{\\hat s_t}<\/span> 给坐标尺度；梯度平方长期大的坐标步长被压，波动小的坐标步长保留。<span class=\"katex-inline\">\\epsilon<\/span> 防二阶矩为 0 时除零，常取 <span class=\"katex-inline\">10^{-6}<\/span>。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：单坐标 SGD 多步<\/h3>\n<p>损失 <span class=\"katex-inline\">L(x)=x^2/2<\/span>，梯度 <span class=\"katex-inline\">g=x<\/span>，<span class=\"katex-inline\">\\eta=0.1<\/span>，<span class=\"katex-inline\">x_0=5<\/span>。 <span class=\"katex-inline\">x_1=5-0.1\\times5=4.5<\/span>；<span class=\"katex-inline\">x_2=4.5-0.1\\times4.5=4.05<\/span>；<span class=\"katex-inline\">x_3=3.645<\/span>；序列按 <span class=\"katex-inline\">1-\\eta=0.9<\/span> 收缩，向 0 逼近。<\/p>\n<h3>算例 2：动量序列对照（原书累加型约定）<\/h3>\n<p>同损失，<span class=\"katex-inline\">\\beta=0.9<\/span>，<span class=\"katex-inline\">x_0=5<\/span>，<span class=\"katex-inline\">v_0=0<\/span>，递推 <span class=\"katex-inline\">v_t=\\beta v_{t-1}+g_t<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">t=1<\/span>：<span class=\"katex-inline\">v_1=0.9\\times0+5=5.0<\/span>，<span class=\"katex-inline\">x_1=5-0.1\\times5.0=4.5<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">t=2<\/span>：<span class=\"katex-inline\">v_2=0.9\\times5.0+4.5=9.0<\/span>，<span class=\"katex-inline\">x_2=4.5-0.1\\times9.0=3.6<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">t=3<\/span>：<span class=\"katex-inline\">v_3=0.9\\times9.0+3.6=11.7<\/span>，<span class=\"katex-inline\">x_3=3.6-0.1\\times11.7=2.43<\/span>。\n<p>累加型约定下 <span class=\"katex-inline\">v<\/span> 随同向梯度持续抬高，单步位移比纯 SGD 大；这正是稳态等效步长 <span class=\"katex-inline\">\\eta/(1-\\beta)<\/span> 的体现。在一致下降方向上加速，震荡方向上历史累加抑制来回。若改用 EMA 约定 <span class=\"katex-inline\">v_t=\\beta v_{t-1}+(1-\\beta)g_t<\/span>，同一组数据的 <span class=\"katex-inline\">v<\/span> 量级会小到约 <span class=\"katex-inline\">1/(1-\\beta)<\/span> 分之一，两者不可混用。<\/p>\n<\/ul>\n<h3>算例 3：Adam 前两步矩与修正<\/h3>\n<p>设 <span class=\"katex-inline\">g_1=2<\/span>，<span class=\"katex-inline\">g_2=1<\/span>，<span class=\"katex-inline\">\\beta_1=0.9<\/span>，<span class=\"katex-inline\">\\beta_2=0.999<\/span>。 一阶矩：<span class=\"katex-inline\">v_1=0.1\\times2=0.2<\/span>，<span class=\"katex-inline\">\\hat v_1=0.2/(1-0.9)=2.0<\/span>；<span class=\"katex-inline\">v_2=0.9\\times0.2+0.1\\times1=0.28<\/span>，<span class=\"katex-inline\">\\hat v_2=0.28/(1-0.9^2)=0.28/0.19\\approx1.474<\/span>。 二阶矩：<span class=\"katex-inline\">s_1=0.001\\times4=0.004<\/span>，<span class=\"katex-inline\">\\hat s_1=0.004/(1-0.999)=4.0<\/span>；<span class=\"katex-inline\">s_2=0.999\\times0.004+0.001\\times1\\approx0.004996<\/span>，<span class=\"katex-inline\">\\hat s_2=0.004996/(1-0.999^2)\\approx2.501<\/span>。 未修正时 <span class=\"katex-inline\">s_1=0.004<\/span> 远小于真实梯度平方 4，直接除会让步长虚高；修正后二阶矩回到合理水平。<\/p>\n<h3>代码片段：Adam 状态更新（原书 11.10.2 节，PDF 第 508 页）<\/h3>\n<pre class=\"lang-python\"><code>def adam(params, states, hyperparams):\n    beta1, beta2, eps = 0.9, 0.999, 1e-6\n    for p, (v, s) in zip(params, states):\n        with torch.no_grad():\n            v[:] = beta1 * v + (1 - beta1) * p.grad\n            s[:] = beta2 * s + (1 - beta2) * torch.square(p.grad)\n            v_corr = v / (1 - beta1 ** hyperparams[&#x27;t&#x27;])\n            s_corr = s / (1 - beta2 ** hyperparams[&#x27;t&#x27;])\n            p[:] -= hyperparams[&#x27;lr&#x27;] * v_corr / (torch.sqrt(s_corr) + eps)\n        p.grad.data.zero_()\n        hyperparams[&#x27;t&#x27;] += 1<\/code><\/pre>\n<h2>延伸推演<\/h2>\n<h3>自适应学习率谱系<\/h3>\n<p>AdaGrad 按累计梯度平方缩放，长期累积使步长单调收缩；RMSProp 用指数加权平均替换累计，避免二阶矩无限增长；Adam 在 RMSProp 思路上加回一阶动量。谱系主线：坐标尺度自适应逐步替代全局统一学习率。<\/p>\n<h3>偏差修正的证明位置（Adam 一阶矩，EMA 约定）<\/h3>\n<p>Adam 一阶矩按 <span class=\"katex-inline\">v_t=(1-\\beta_1)\\sum_{i=1}^t\\beta_1^{t-i}g_i<\/span> 更新，若 <span class=\"katex-inline\">g_i<\/span> 期望为 <span class=\"katex-inline\">\\mu<\/span>，则 <span class=\"katex-inline\">E[v_t]=(1-\\beta_1)\\mu\\sum_{i=1}^t\\beta_1^{t-i}=\\mu(1-\\beta_1^t)<\/span>。除以 <span class=\"katex-inline\">1-\\beta_1^t<\/span> 后期望回到 <span class=\"katex-inline\">\\mu<\/span>。这就是修正公式 <span class=\"katex-inline\">1-\\beta_1^t<\/span> 的来源，不是经验系数。注意此证明对应的是 Adam 的 EMA 凸组合递推，不是 11.6 节的累加型动量。<\/p>\n<h3>优化目标与泛化目标分离<\/h3>\n<p>优化器最小化训练集经验风险；泛化风险（未知数据损失）还受模型容量、正则化、数据量影响。训练损失低不等于测试损失低，优化器不替代模型选择与正则化（原书 11.1.1 节，PDF 第 446 页）。<\/p>\n<h3>对抗性追问：Adam 能不能替代学习率调参<\/h3>\n<p>不能。<span class=\"katex-inline\">\\eta<\/span> 仍是主步长控制；自适应只在坐标间缩放。Adam 起步步长虚高或后期收敛慢，常要回调学习率，而不是换优化器。<\/p>\n<h3>对抗性追问：动量越大越好吗<\/h3>\n<p><span class=\"katex-inline\">\\beta<\/span> 接近 1 历史窗口长，平滑性好但响应滞后，突变方向跟不上；<span class=\"katex-inline\">\\beta<\/span> 过小则退化为单步 SGD。动量系数与学习率配套，偏大偏小都有稳定代价。<\/p>\n<h2>补充推演与第二算例<\/h2>\n<h3>第二算例：累计平方与指数加权对照<\/h3>\n<p>AdaGrad 累计 <span class=\"katex-inline\">s_t=\\sum_{i=1}^t g_i^2<\/span>，单调不减，后期步长持续收缩；RMSProp 改用 <span class=\"katex-inline\">s_t=\\beta_2 s_{t-1}+(1-\\beta_2)g_t^2<\/span>，只跟踪近期平方水平。设 <span class=\"katex-inline\">g_1=1,g_2=1<\/span>：AdaGrad <span class=\"katex-inline\">s_2=2<\/span>；RMSProp <span class=\"katex-inline\">\\beta_2=0.999<\/span>，<span class=\"katex-inline\">s_2=0.999\\times0.001+0.001\\times1\\approx0.001999<\/span>。前者把早期平方长期计入，后者快速遗忘旧量级；Adam 在 RMSProp 思路上叠加一阶动量。<\/p>\n<h3>偏差修正的时间位置<\/h3>\n<p><span class=\"katex-inline\">t=1<\/span> 时 <span class=\"katex-inline\">1-\\beta_1^t=0.1<\/span>，修正幅度最大；随 <span class=\"katex-inline\">t<\/span> 增大分母趋近 1，修正自动淡出。若省略修正，前几步矩估计被零初值压低，二阶矩偏小会让起步步长虚高。修正公式来自矩的期望推导，不是经验系数。<\/p>\n<h3>对抗性追问：优化器选择要配套什么<\/h3>\n<p>批量大小、梯度噪声水平与任务损失面形状都影响优化器表现。自适应方法在非凸深度网络上的泛化优势没有定论，SGD 加动量在部分视觉任务上泛化更稳；选优化器要连同学习率、批量一起调，不能只看更新规则。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n动量递推式与展开权重是什么？（原书累加型：<span class=\"katex-inline\">v_t=\\beta v_{t-1}+g_t<\/span>，展开 <span class=\"katex-inline\">v_t=\\sum_{\\tau=0}^{t-1}\\beta^\\tau g_{t-\\tau}<\/span>，权重 <span class=\"katex-inline\">\\beta^\\tau<\/span> 几何衰减，稳态等效步长 <span class=\"katex-inline\">\\eta/(1-\\beta)<\/span>；EMA 凸组合版为 <span class=\"katex-inline\">v_t=\\beta v_{t-1}+(1-\\beta)g_t<\/span>，权重 <span class=\"katex-inline\">(1-\\beta)\\beta^\\tau<\/span>。）\n<\/li><li>\nAdam 两个状态变量各估计什么？（<span class=\"katex-inline\">v_t<\/span> 梯度一阶矩方向；<span class=\"katex-inline\">s_t<\/span> 梯度平方二阶矩水平。）\n<\/li><li>\n偏差修正分母怎么来的？（<span class=\"katex-inline\">E[v_t]=\\mu(1-\\beta^t)<\/span>，除以 <span class=\"katex-inline\">1-\\beta^t<\/span> 使期望回到 <span class=\"katex-inline\">\\mu<\/span>。）\n<\/li><li>\nAdam 更新式中 <span class=\"katex-inline\">\\hat v_t<\/span> 与 <span class=\"katex-inline\">\\sqrt{\\hat s_t}<\/span> 各起什么作用？（<span class=\"katex-inline\">\\hat v_t<\/span> 给更新方向；<span class=\"katex-inline\">\\sqrt{\\hat s_t}<\/span> 按坐标梯度尺度缩放步长。）\n<\/li><li>\n优化器收敛等于泛化好吗？（不等；优化压经验风险，泛化还要正则化与模型选择控制。）\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：预备知识与自动微分：张量、广播、线性代数、微积分、概率与反向模式求导<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：预备知识与自动微分（张量与广播、线性代数、微积分、自动微分、概率初步）<\/a><br>检查点：能说出张量每个维度的语义与形状规则，判出广播何时合法何时报错，沿一个小计算图把链式法则的梯度反向累积到底，并用 PyTorch 张量复现<\/li><li class='path-step' id='path-02'><strong>步骤 02：线性模型与多层感知机：线性回归、softmax 交叉熵、MLP、正则化与参数初始化<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化）<\/a><br>检查点：能写出平方损失与交叉熵的梯度，说明分类为什么不用平方损失，证明纯线性堆叠叠多少层都退化成一层，区分权重衰减、dropout、初始化三种正则/稳定手段的作用位置<\/li><li class='path-step' id='path-03'><strong>步骤 03：卷积网络与现代架构：卷积参数共享、池化下采样、批量归一化与残差/现代网络谱系<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：卷积网络与现代架构（卷积与池化、LeNet、AlexNet/VGG/ResNet、批量归一化）<\/a><br>检查点：能按输入尺寸、核尺寸、填充、步幅推出卷积输出形状，逐层累积感受野，讲清池化带来的平移不变性与信息损失，说出 BN 在训练与推理下统计量来源的差别<\/li><li class='path-step' id='path-04'><strong>步骤 04：循环网络、注意力与优化：RNN/BPTT、LSTM/GRU 门控、缩放点积注意力与 Transformer、SGD/动量/Adam<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：循环网络、注意力与优化（RNN 与时间反向传播、LSTM/GRU、注意力与 Transformer、优化算法）<\/a><br>检查点：能沿时间步推 BPTT 梯度并定位连乘项，逐个门推演 LSTM/GRU 的记忆与遗忘路径，推出点积方差随 $d$ 增长的结论并解释缩放，写出 Adam 的一阶/二阶矩状态与偏差修正公式<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='张量（tensor）'>张量（Tensor） — 按多维数组组织数值的结构：标量是 0 阶张量、向量是 1 阶、矩阵是 2 阶，更高阶按维度逐个枚举；每个维度对应一种语义（批量、通道、高、宽等），形状由各维度长度构成 <span class=glossary-ref>（第 1 章：预备知识与自动微分（张量与广播、线性代数、微积分、自动微分、概率初步））<\/span><\/li><li data-term='广播机制（broadcasting）'>广播机制（Broadcasting） — 对形状不同的张量逐元素运算时，按规则把较小维度扩展对齐：从右往左比对，维度长度相等或其中一方为 1 时合法；两维既不相等也不为 1 时报形状错误（原书 2.1.3 节，PDF 第 62 页） <span class=glossary-ref>（第 1 章：预备知识与自动微分（张量与广播、线性代数、微积分、自动微分、概率初步））<\/span><\/li><li data-term='自动微分（automatic differentiation）'>自动微分（Automatic Differentiation） — 框架按前向过程构建计算图，再沿图反向累积每个参数偏导数的求导方式；本书采用反向模式，先记录操作链，调用 backward 后把梯度填回各参数（原书 2.5 节，PDF 第 87 页） <span class=glossary-ref>（第 1 章：预备知识与自动微分（张量与广播、线性代数、微积分、自动微分、概率初步））<\/span><\/li><li data-term='计算图（computational graph）'>计算图（Computational Graph） — 把张量与运算组织成节点和边的有向图：输入为叶节点，每个运算记录输入、输出与梯度函数；反向传播沿图从损失叶节点回溯到各参数叶节点 <span class=glossary-ref>（第 1 章：预备知识与自动微分（张量与广播、线性代数、微积分、自动微分、概率初步））<\/span><\/li><li data-term='平方损失（squared loss）'>平方损失（Squared Loss） — 回归问题常用损失，样本上为预测与真值之差的平方；对应高斯噪声假设下的负对数似然，梯度是预测误差的线性放大（原书 3.1.3 节，PDF 第 109 页前后） <span class=glossary-ref>（第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化））<\/span><\/li><li data-term='交叉熵损失（cross-entropy loss）'>交叉熵损失（Cross-Entropy Loss） — 分类损失 $l(y,\\hat y)=-\\sum_j y_j\\log \\hat y_j$，$y$ 为独热标签；独热下只保留正确类那一项，即 $-\\log \\hat y_{y}$，梯度为预测概率减标签（原书 3.4.6 节，PDF 第 126 页） <span class=glossary-ref>（第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化））<\/span><\/li><li data-term='独热编码（one-hot encoding）'>独热编码（One-Hot Encoding） — 类别用等长 0/1 向量表示，对应类别分量为 1、其余为 0；类别之间不携带自然顺序，避免把分类问题误当成有序回归（原书 3.4.1 节，PDF 第 124 页） <span class=glossary-ref>（第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化））<\/span><\/li><li data-term='权重衰减（weight decay / l2 正则化）'>权重衰减（Weight Decay / L2 正则化） — 在损失中加入权重范数平方项 $\\lambda\\sum w^2$，梯度更新等价于在每步把权重乘上小于 1 的衰减因子，把参数约束在较小范数内，缓解高维过拟合（原书 4.5 节，PDF 第 167 页） <span class=glossary-ref>（第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化））<\/span><\/li><li data-term='暂退法（dropout）'>暂退法（Dropout） — 训练时按概率 $p$ 把隐层激活置零并按 $1-p$ 缩放保留值，使单次迭代相当于采样一个子网络；推理时关闭丢弃，用完整网络做确定性预测（原书 4.6 节，PDF 第 174 页） <span class=glossary-ref>（第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化））<\/span><\/li><li data-term='梯度消失 / 梯度爆炸'>梯度消失 / 梯度爆炸 — 深层网络反向传播时梯度沿层连乘：乘积过小则参数几乎不动（消失），过大则更新破坏收敛（爆炸）；sigmoid 饱和区易致消失，初始权重尺度偏大易致爆炸（原书 4.8.1 节，PDF 第 184 页） <span class=glossary-ref>（第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化））<\/span><\/li><li data-term='xavier 初始化'>Xavier 初始化 — 按前向与反向方差平衡取权重分布：方差 $\\sigma^2=2/(n_{in}+n_{out})$，高斯采样或均匀分布 $U(-\\sqrt{6/(n_{in}+n_{out})},\\sqrt{6/(n_{in}+n_{out})})$；用于把激活与梯度尺度控制在 1 附近（原书 4.8.2 节，PDF 第 186 页） <span class=glossary-ref>（第 2 章：线性模型与多层感知机（线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化））<\/span><\/li><li data-term='感受野（receptive field）'>感受野（Receptive Field） — 输出张量上某个位置在输入图上所能影响到的区域；卷积层逐层叠加时感受野按核尺寸与步幅累积，深层特征对应原图更大范围（原书 6.2.6 节，PDF 第 245 页前后） <span class=glossary-ref>（第 3 章：卷积网络与现代架构（卷积与池化、LeNet、AlexNet/VGG/ResNet、批量归一化））<\/span><\/li><li data-term='汇聚层（pooling）'>汇聚层（Pooling） — 用固定窗口在输入上滑动取最大值或平均值的无参数层，作用是降低对位置的敏感度并做空间下采样；最大汇聚保留最显著响应，平均汇聚取区域平均（原书 6.5 节，PDF 第 254 页） <span class=glossary-ref>（第 3 章：卷积网络与现代架构（卷积与池化、LeNet、AlexNet/VGG/ResNet、批量归一化））<\/span><\/li><li data-term='批量归一化（batch normalization）'>批量归一化（Batch Normalization） — 对小批量内激活按通道做标准化再经可学习 $\\gamma,\beta$ 拉伸偏移；训练用批量均值方差并维护移动平均，推理切换为移动平均统计量（原书 7.5 节，PDF 第 286 页） <span class=glossary-ref>（第 3 章：卷积网络与现代架构（卷积与池化、LeNet、AlexNet/VGG/ResNet、批量归一化））<\/span><\/li><li data-term='残差连接（residual connection）'>残差连接（Residual Connection） — 把层输入与层输出直接相加 $h=x+\\mathrm{sublayer}(x)$，让梯度可以沿捷径直达浅层；ResNet 与 Transformer 编码器/解码器子层均采用该结构（原书 7.6、10.7 节，PDF 第 295、432 页） <span class=glossary-ref>（第 3 章：卷积网络与现代架构（卷积与池化、LeNet、AlexNet/VGG/ResNet、批量归一化））<\/span><\/li><li data-term='困惑度（perplexity）'>困惑度（Perplexity） — 语言模型按平均负对数似然取指数得到的评价指标，衡量模型对序列预测的不确定程度；值越小表示模型对观测词元的预测越确定（原书 8.4.4 节，PDF 第 333 页前后） <span class=glossary-ref>（第 4 章：循环网络、注意力与优化（RNN 与时间反向传播、LSTM/GRU、注意力与 Transformer、优化算法））<\/span><\/li><li data-term='门控循环单元（gru）'>门控循环单元（GRU） — 带重置门与更新门的 RNN 变体：更新门控制新旧隐状态的凸组合比例，重置门控制构造候选状态时参考多少过去状态（原书 9.1 节，PDF 第 353 页） <span class=glossary-ref>（第 4 章：循环网络、注意力与优化（RNN 与时间反向传播、LSTM/GRU、注意力与 Transformer、优化算法））<\/span><\/li><li data-term='长短期记忆网络（lstm）'>长短期记忆网络（LSTM） — 带输入门、遗忘门、输出门与记忆元的 RNN 变体；遗忘门控制旧记忆保留比例，输入门写入候选记忆，输出门控制记忆元对外暴露的程度（原书 9.2 节，PDF 第 360 页） <span class=glossary-ref>（第 4 章：循环网络、注意力与优化（RNN 与时间反向传播、LSTM/GRU、注意力与 Transformer、优化算法））<\/span><\/li><li data-term='缩放点积注意力（scaled dot-product attention）'>缩放点积注意力（Scaled Dot-Product Attention） — 评分函数 $a(q,k)=q^\top k/\\sqrt{d}$，把查询键点积除以键维度平方根以把点积方差压回 1；批量形式为 $\\mathrm{softmax}(QK^\top/\\sqrt d)V$（原书 10.3.3 节，PDF 第 415 页） <span class=glossary-ref>（第 4 章：循环网络、注意力与优化（RNN 与时间反向传播、LSTM/GRU、注意力与 Transformer、优化算法））<\/span><\/li><li data-term='adam 优化器'>Adam 优化器 — 同时维护梯度一阶矩 $v_t$ 与二阶矩 $s_t$ 的自适应优化算法，用 $1-\beta_1^t$、$1-\beta_2^t$ 做偏差修正，再按 $v_t/\\sqrt{s_t}$ 缩放更新（原书 11.10 节，PDF 第 506 页） <span class=glossary-ref>（第 4 章：循环网络、注意力与优化（RNN 与时间反向传播、LSTM/GRU、注意力与 Transformer、优化算法））<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：先定张量形状与维度语义，再写运算<\/h2>\n<p>写网络层前先把每个张量的形状与维度语义标出来（批量、通道、高、宽、时间步），逐维比对再决定相加、相乘还是拼接。广播错误、通道错位、全连接输入维度对不上，多数在形状核对阶段就能拦住；先跑代码再猜形状，排查路径会绕远。线性模型偏置、BN 拉伸参数、卷积通道维都按这套对齐方式处理。<\/p>\n<h2>模式 2：沿计算图反向累积梯度，把链式法则机械化<\/h2>\n<p>复合函数求导先画前向节点与边，记录每个中间量；反向从损失标量出发，上游梯度乘本地偏导再下传，多条路径汇入时按路径求和。排查梯度异常时沿图分段：先看输出侧损失是否非法，再逐段核对上游激活量级，按边二分定位问题层。非标量输出回传需要同形状权重向量；训练循环每轮更新后清零梯度。<\/p>\n<h2>模式 3：损失函数由数据假设与任务类型反推<\/h2>\n<p>回归在高斯噪声假设下取平方损失，分类在互斥类别下取交叉熵。选损失先问：输出是否互斥、标签是连续值还是类别分布、错误置信度该不该被重罚。平方损失套在 softmax 分类上，自信判错时梯度被饱和因子压平；多标签问题不能用 softmax 互斥归一，要换逐位置 sigmoid 二元交叉熵。<\/p>\n<h2>模式 4：容量与正则化按偏差—方差权衡调参<\/h2>\n<p>欠拟合对应高偏差，过拟合对应高方差。约束复杂度有三条不同位置的路径：损失层加权重衰减压参数范数，前向层 dropout 扰动单元路径，初始化与归一化稳住尺度。强度过头把偏差抬上来；<span class=\"katex-inline\">\\lambda<\/span>、<span class=\"katex-inline\">p<\/span> 在验证集上选，测试集只做最终评估。训练低验证高指向过拟合，训练验证同步偏高指向欠拟合或优化问题。<\/p>\n<h2>模式 5：深链尺度维持是一条配套链条，不单靠初始化<\/h2>\n<p>深层网络尺度失控来自前向激活放大、反向梯度连乘、激活饱和三处。初始化把起点方差压在 1 附近，BN 校准层间分布，残差连接给梯度留捷径，ReLU 保持正区间导数；四者配合才把深链维持在可控区间。初始化只约束起点，训练中的分布漂移要靠后续机制补；梯度裁剪是运行时止损，不改变长链连乘结构。<\/p>\n<h2>模式 6：局部连接逐层累积感受野，骨架尺寸按公式复核<\/h2>\n<p>卷积在滑动窗口上复用同一组核权重，参数与图像边长脱钩；深层单元覆盖的原图范围由各层核尺寸与步幅按 <span class=\"katex-inline\">r_l=s_l r_{l-1}+(k_l-1)<\/span> 累积。搭骨架时逐层用输出边长公式复核，避免末端尺寸与全连接输入对不上。大核可由多层小核叠加替代，参数更少且多几次非线性变换；<span class=\"katex-inline\">1\\times1<\/span> 卷积只做跨通道融合，不改空间尺寸。<\/p>\n<h2>模式 7：长链连乘先定位因子谱半径，再选结构对策<\/h2>\n<p>RNN 的 BPTT 梯度沿时间步雅可比连乘，前馈网络沿层间雅可比连乘，结构同类。因子长期小于 1 梯度消失，长期大于 1 梯度爆炸；临界稳定带很窄。对策分层：截断 BPTT 切短回传链，梯度裁剪压单步爆炸，门控单元给记忆元留可选直通路。门控缓解但不消除长程连乘问题，饱和门还会压住局部梯度。<\/p>\n<h2>模式 8：优化器按状态估计分层选择<\/h2>\n<p>纯 SGD 只看当前梯度，窄损失面易震荡；动量法累积一阶历史方向抵消翻转；Adam 再加二阶矩做逐坐标缩放，并用偏差修正补偿零初值。选优化器要连同学习率、批量大小一起调：自适应方法不替代学习率调参，SGD 加动量在部分任务上泛化更稳。优化最小化训练经验风险，泛化风险还要靠正则化与模型选择控制，两者目标分开看。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 预备知识与自动微分<\/strong>：张量与广播、线性代数、微积分、自动微分、概率初步（原书第 2 章，PDF 第 57–102 页）。\n<\/li><li>\n<strong>第 2 章 线性模型与多层感知机<\/strong>：线性回归、softmax 回归、MLP、过拟合与正则化、数值稳定性与初始化（原书第 3–5 章，PDF 第 103–234 页）。\n<\/li><li>\n<strong>第 3 章 卷积网络与现代架构<\/strong>：卷积与池化、LeNet、AlexNet/VGG/ResNet、批量归一化（原书第 6–7 章，PDF 第 235–306 页）。\n<\/li><li>\n<strong>第 4 章 循环网络、注意力与优化<\/strong>：RNN 与 BPTT、LSTM/GRU、注意力与 Transformer、优化算法（原书第 8–11 章，PDF 第 307–520 页）。\n<\/ul>\n<h2>张量与广播规则<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>情形<\/th><th>比对结果<\/th><th>输出形状<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">(3,1)+(1,4)<\/span><\/td><td>两维各有一方为 1<\/td><td><span class=\"katex-inline\">(3,4)<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">(2,3)+(3,)<\/span><\/td><td>右侧对齐，<span class=\"katex-inline\">(3,)<\/span> 视为 <span class=\"katex-inline\">(1,3)<\/span><\/td><td><span class=\"katex-inline\">(2,3)<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">(2,3)+(2,4)<\/span><\/td><td>最右维 3 与 4 既不等也不为 1<\/td><td>报错<\/td><\/tr><tr><td><span class=\"katex-inline\">(n,c,h,w)+\\gamma(1,c,1,1)<\/span><\/td><td>批量维与空间维复用<\/td><td><span class=\"katex-inline\">(n,c,h,w)<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>比对方向：从最右维向左；较短形状左侧补 1；参数数量只数可学习张量本身形状。<\/p>\n<h2>损失与梯度速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>任务<\/th><th>损失<\/th><th>对参数/输出的梯度<\/th><\/tr><\/thead><tbody><tr><td>回归<\/td><td><span class=\"katex-inline\">L=\\frac1n\\|X\\mathbf w-\\mathbf y\\|^2<\/span><\/td><td><span class=\"katex-inline\">\\nabla_{\\mathbf w}L=\\frac2n(X^\\top X\\mathbf w-X^\\top\\mathbf y)<\/span><\/td><\/tr><tr><td>分类<\/td><td><span class=\"katex-inline\">l=-\\sum_j y_j\\log\\hat y_j<\/span><\/td><td><span class=\"katex-inline\">\\partial l/\\partial o_k=\\hat y_k-y_k<\/span><\/td><\/tr><tr><td>正规方程<\/td><td><span class=\"katex-inline\">X^\\top X\\mathbf w=X^\\top\\mathbf y<\/span><\/td><td>解 <span class=\"katex-inline\">\\mathbf w^*=(X^\\top X)^{-1}X^\\top\\mathbf y<\/span>，要求列满秩<\/td><\/tr><\/tbody><\/table><\/div>\n<p>softmax 稳定实现：先减每行最大值再取幂；<span class=\"katex-inline\">\\hat y_j=\\exp(o_j)/\\sum_k\\exp(o_k)<\/span>。<\/p>\n<h2>正则化与稳定性对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>手段<\/th><th>作用位置<\/th><th>机制<\/th><th>失效信号<\/th><\/tr><\/thead><tbody><tr><td>权重衰减<\/td><td>损失/更新式<\/td><td>加 <span class=\"katex-inline\">\\lambda\\sum w^2<\/span>，更新乘 <span class=\"katex-inline\">(1-\\eta\\lambda)<\/span><\/td><td>训练误差同步走高<\/td><\/tr><tr><td>dropout<\/td><td>前向隐层<\/td><td>概率 <span class=\"katex-inline\">p<\/span> 置零、按 <span class=\"katex-inline\">1-p<\/span> 缩放，<span class=\"katex-inline\">E[h&#x27;]=h<\/span><\/td><td>推理忘切 eval<\/td><\/tr><tr><td>参数初始化<\/td><td>权重起点<\/td><td>Xavier <span class=\"katex-inline\">\\sigma^2=2/(n_{in}+n_{out})<\/span><\/td><td>深层激活/梯度尺度漂移<\/td><\/tr><tr><td>梯度裁剪<\/td><td>优化更新<\/td><td>范数超阈值按比例缩回<\/td><td>只压单步，不改长链结构<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>卷积几何<\/h2>\n<ul><li>\n输出边长：<span class=\"katex-inline\">o_h=\\lfloor(n_h+2p_h-k_h)/s_h\\rfloor+1<\/span>。\n<\/li><li>\n感受野递推：<span class=\"katex-inline\">r_l=s_l r_{l-1}+(k_l-1)<\/span>，<span class=\"katex-inline\">r_0=1<\/span>。\n<\/li><li>\n卷积参数：<span class=\"katex-inline\">k_h k_w c_{in}c_{out}<\/span>（加 <span class=\"katex-inline\">c_{out}<\/span> 偏置），与输入空间边长无关。\n<\/li><li>\n池化输出通道数等于输入通道数，无可学习参数。\n<\/ul>\n<h2>归一化对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>类型<\/th><th>统计口径<\/th><th>批量依赖<\/th><th>典型场景<\/th><\/tr><\/thead><tbody><tr><td>BN<\/td><td>跨批量/空间，按通道统计<\/td><td>依赖批量大小，批量 1 失效<\/td><td>卷积网络训练<\/td><\/tr><tr><td>LN<\/td><td>单样本内跨特征统计<\/td><td>不依赖批量<\/td><td>RNN、小批量微调<\/td><\/tr><\/tbody><\/table><\/div>\n<p>BN 训练用当前批量统计并更新移动平均；推理切移动平均。<span class=\"katex-inline\">\\gamma<\/span> 拉伸尺度，<span class=\"katex-inline\">\\beta<\/span> 平移偏移。<\/p>\n<h2>循环网络与门控<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>单元<\/th><th>门/通道<\/th><th>解决的问题<\/th><\/tr><\/thead><tbody><tr><td>RNN<\/td><td>无门控<\/td><td>沿时间递归保留历史；长链梯度连乘消失/爆炸<\/td><\/tr><tr><td>GRU<\/td><td>重置门 <span class=\"katex-inline\">R_t<\/span>、更新门 <span class=\"katex-inline\">Z_t<\/span><\/td><td>重置门约束候选构造；更新门融合新旧状态<\/td><\/tr><tr><td>LSTM<\/td><td>输入门 <span class=\"katex-inline\">I_t<\/span>、遗忘门 <span class=\"katex-inline\">F_t<\/span>、输出门 <span class=\"katex-inline\">O_t<\/span>、记忆元 <span class=\"katex-inline\">C_t<\/span><\/td><td><span class=\"katex-inline\">C_t=F_t\\odot C_{t-1}+I_t\\odot\\tilde C_t<\/span>；<span class=\"katex-inline\">H_t=O_t\\odot\\tanh(C_t)<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>BPTT 梯度含 <span class=\"katex-inline\">\\prod_{j=i+1}^{t}\\partial   if(h==='path') return 'path';

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  if(typeof vis !== 'undefined'){ networkLoaded = true; cb(); return; }
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE) { cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库未加载：离线构建请加 <code>--offline all</code>，或联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

function getMastery(cid){

function updateMastery(cid, delta){

/* ---------- 搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIndex = null;
let pendingHl = [];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP = new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                        '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                        '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw = q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out = [];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length > 2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low = text.toLowerCase();
  let pos = -1, hit = '';
  for(const t of terms){ const i = low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start = Math.max(0, (pos<0?0:pos) - 60);
  const end = Math.min(text.length, (pos<0?0:pos) + 140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms = pendingHl.slice(); pendingHl = [];
  if(!terms.length) return;
  const root = $('#view'); if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first = null, idx = -1, term = '';
  while((node = walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low = node.nodeValue.toLowerCase();
    for(const t of terms){
      const i = low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){
        first = node; idx = i; term = t;
      }
    }
  }
  if(!first) return;
  try{
    const i = first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range = document.createRange();
    range.setStart(first, i); range.setEnd(first, i+term.length);
    const mark = document.createElement('mark');
    mark.className = 'hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'), 1800);
  }catch(e){}
}
document.addEventListener('click', (e)=>{
  const a = (e.target && e.target.closest) ? e.target.closest('.search-hit a') : null;
  if(a && a.dataset.hl) pendingHl = tokenizeQuery(a.dataset.hl);
});
function searchHref(id){
  const map = {'__path__':'#/path','__diagnosis__':'#/diagnosis','__graph__':'#/graph',
               '__cards__':'#/cards','__glossary__':'#/glossary','__patterns__':'#/patterns',
               '__cheatsheet__':'#/cheatsheet'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '#/quiz/'+id.replace('__quiz_','').replace(/__$/,'');
  if(id.startsWith('__')) return '';
  return '#/'+id;
}
function searchLabel(id){
  if((manifest.chapters||[]).some(c=>c.id===id)) return '章节：'+id;
  if((manifest.concepts||[]).some(c=>c.id===id)) return '概念：'+id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '测验';
  return id;
}
function pageTitle(id){
  const ch = (manifest.chapters||[]).find(c=>c.id===id);
  if(ch) return ch.title || id;
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp) return cp.title || id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')){
    const q = (manifest.quizzes||[]).find(x=>'__quiz_'+x.id===id);
    return q ? '测验 · '+String(q.question||'').slice(0,14) : '测验';
  }
  return id;

function chapOf(id){
  const chs = manifest.chapters || [];
  const ci = chs.findIndex(c=>c.id===id);
  if(ci >= 0) return {key:'ch:'+id, label:chs[ci].title||id, order:ci};
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp){
    const chId = (cp.chapterIds||[])[0];
    const i = chs.findIndex(c=>c.id===chId);
    if(i >= 0) return {key:'ch:'+chId, label:chs[i].title||chId, order:i};
    return {key:'zz', label:'未归入章节', order:900};
  }
  return {key:'tools', label:'术语与工具页', order:950, ref:true};
}
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    const href = searchHref(id);
    if(!href) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, href, text, label:pageTitle(id), chap:chapOf(id)});
  });
  return searchIndex;
}
function synOf(t){
  const out = [];
  for(const g of SYN_GROUPS){ if(g.indexOf(t) >= 0){ for(const x of g){ if(x !== t) out.push(x); } } }
  return out.slice(0,6);
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim();
  if(!v){ showPage(routeIdFromHash()); return; }
  const terms = tokenizeQuery(v);
  if(!terms.length){ showPage(routeIdFromHash()); return; }
  const grams = [];
  terms.forEach(t=>{ if(t.length >= 2){ for(let i=0;i+2<=t.length;i++) grams.push(t.slice(i,i+2)); } });
  const qGrams = [...new Set(grams)].slice(0,16);
  const snippetTerms = terms.concat(...terms.map(synOf)).slice(0,24);
  const hits = [];
  buildSearchIndex().forEach(p=>{
    const low = p.text.toLowerCase();
    let tHit = 0, sHit = 0, gHit = 0, first = '', viaSyn = '';
    for(const t of terms){
      if(low.includes(t)){ tHit++; if(!first) first = t; continue; }
      for(const s of synOf(t)){
        if(low.includes(s)){ sHit++; if(!viaSyn) viaSyn = s; if(!first) first = s; break; }
      }
    }
    for(const gm of qGrams){ if(low.includes(gm)) gHit++; }
    if(tHit > 0 || sHit > 0 || gHit >= 4){
      hits.push({p, score: tHit*100 + sHit*30 + Math.min(gHit,20), first, viaSyn});
    }
  });
  hits.sort((a,b)=> b.score-a.score || a.p.text.length-b.p.text.length);
  const top = hits.slice(0,20);
  let body;
  if(top.length){
    const gs = {};
    top.forEach(h=>{
      const k = h.p.chap.key;
      (gs[k] = gs[k] || {label:h.p.chap.label, order:h.p.chap.order, ref:!!h.p.chap.ref, hits:[]}).hits.push(h);
    });
    const eff = g => Math.max(...g.hits.map(x=>x.score)) * (g.ref ? 0.55 : 1);
    const order = Object.values(gs).sort((a,b)=> eff(b)-eff(a));
    body = order.map(g=>{
      const inner = g.hits.sort((a,b)=> b.score-a.score).map(h=>
        `<div class="search-hit"><a href="${h.p.href}" data-hl="${esc(h.first)}">${esc(h.p.label)}</a>${h.viaSyn?`<span class="syn-note">同义命中：${esc(h.viaSyn)}</span>`:''}<br><span class="sub">${hlSnippet(h.p.text, snippetTerms)}</span></div>`).join('');
      return `<div class="search-group"><div class="grp-head">${esc(g.label)}<span class="grp-count">${g.hits.length}</span></div>${inner}</div>`;
    }).join('');
  } else {
    body = '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语，或减少关键词。</div>';
  }
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' + body;
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof mermaid === 'undefined') return;
  const boot=()=>{ try{

    document.querySelectorAll('.mermaid').forEach(el=>{

        .catch(()=>{ el.textContent=code; });

  }catch(e){} };
  if(typeof mermaid !== 'undefined'){ boot(); return; }
  const urls=['https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js',
              'https://registry.npmmirror.com/mermaid/10.9.1/files/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js'];
  let ui=0, done=false;
  const tryNext=()=>{
    if(done || ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    const timer=setTimeout(()=>{ if(done) return; s.onload=null; s.onerror=null; s.remove(); tryNext(); }, 4000);
    s.onload=()=>{ done=true; clearTimeout(timer); boot(); };
    s.onerror=()=>{ clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

/* ---------- 句级出处：点击角标弹出原句 ---------- */
let citePop = null;
function closeCite(){ if(citePop){ citePop.remove(); citePop = null; } }
function showCite(id){
  const c = (typeof SOURCES !== 'undefined') ? SOURCES[id] : null;
  if(!c) return;
  closeCite();
  citePop = document.createElement('div');
  citePop.className = 'cite-pop';
  citePop.innerHTML = '<div class="cite-head">出处' + (c.page!=='' && c.page!=null ? (' · p.'+esc(String(c.page))) : '') +
    '<button class="cite-x" aria-label="关闭">×</button></div>' +
    (c.quote ? '<blockquote>'+esc(c.quote)+'</blockquote>' : '') +
    (c.zh ? '<div class="cite-zh">'+esc(c.zh)+'</div>' : '');
  document.body.appendChild(citePop);
  citePop.querySelector('.cite-x').onclick = closeCite;
}
document.addEventListener('click', e=>{
  const t = e.target.closest('.cite');
  if(t){ e.preventDefault(); showCite(t.dataset.cite); return; }
  if(citePop && !e.target.closest('.cite-pop')) closeCite();
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeCite(); });
</script>
<script id="zs-visual-init">
(function(){
  try{
    var B=document.body, H=document.documentElement;
    if(!B.dataset.theme && !H.dataset.theme) B.dataset.theme='dark';
    var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
    var scope=document.querySelectorAll('header, .topbar, .topbar-fixed, #topbar, .sidebar, .tabs, .hdr-right, .card-actions, .card-controls, .section-title, .card .icon, .icon-label');
    for(var i=0;i<scope.length;i++){
      var w=document.createTreeWalker(scope[i],NodeFilter.SHOW_TEXT,null,false), n;
      while(n=w.nextNode()){
        if(EMOJI.test(n.nodeValue)){
          n.nodeValue=n.nodeValue.replace(EMOJI,'').replace(/[ \t]+/g,' ').replace(/^ | $/g,'');
        }
      }
    }
    var btn=document.getElementById('theme-btn')||document.getElementById('theme')||document.getElementById('themeToggle');
    function label(){
      if(!btn) return;
      var light=B.dataset.theme==='light'||H.getAttribute('data-theme')==='light'||B.dataset.theme==='';
      if(btn.textContent.trim()===''||/浅色|深色/.test(btn.textContent)) btn.textContent=light?'深色':'浅色';
    }
    label();
    if(btn){
      new MutationObserver(label).observe(B,{attributes:true,attributeFilter:['data-theme']});
      new MutationObserver(label).observe(H,{attributes:true,attributeFilter:['data-theme']});
      btn.addEventListener('click',function(){setTimeout(label,0);},true);
    }
  }catch(e){}
})();
</script>
