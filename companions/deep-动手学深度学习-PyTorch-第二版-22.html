是把各特征减均值除标准差，使损失面接近各向同性椭圆。<\/p>\n<h2>延伸推演<\/h2>\n<h3>共线特征为什么让矩阵不可逆<\/h3>\n<p>若两个特征满足 <span class=\"katex-inline\">x_2=c\\,x_1<\/span>，则 <span class=\"katex-inline\">X<\/span> 两列成比例，列空间维数小于列数，<span class=\"katex-inline\">X^\\top X<\/span> 行列式为 0，不存在唯一逆。此时任一满足 <span class=\"katex-inline\">\\mathbf w_1+c\\mathbf w_2<\/span> 固定的权重组合预测相同，解析解不唯一；实践中靠权重衰减（概念 c06）压缩范数，或先做特征筛选/PCA 去冗余。<\/p>\n<h3>学习率的稳定区间<\/h3>\n<p>一维二次损失 <span class=\"katex-inline\">L(w)=\\frac12 a w^2<\/span>，梯度 <span class=\"katex-inline\">aw<\/span>，更新 <span class=\"katex-inline\">w_{t+1}=(1-\\eta a)w_t<\/span>。收敛要求 <span class=\"katex-inline\">|1-\\eta a|&lt;1<\/span>，即 <span class=\"katex-inline\">0&lt;\\eta&lt;2/a<\/span>；<span class=\"katex-inline\">\\eta<\/span> 接近 <span class=\"katex-inline\">2/a<\/span> 时震荡衰减，超过则发散。多维情形 <span class=\"katex-inline\">a<\/span> 对应各方向曲率，学习率受最大曲率方向约束。这解释了为什么损失面越狭长，可用学习率越小。<\/p>\n<h3>解析解的代价来自哪里<\/h3>\n<p><span class=\"katex-inline\">(X^\\top X)^{-1}<\/span> 是 <span class=\"katex-inline\">d\\times d<\/span> 求逆，LU 分解量级 <span class=\"katex-inline\">O(d^3)<\/span>；<span class=\"katex-inline\">d<\/span> 增大时内存与算力随立方膨胀。此外 <span class=\"katex-inline\">X^\\top X<\/span> 数值条件数随噪声变差，直接求逆易放大浮点误差。工程上即便能解正规方程，大规模数据仍选 SGD 族。<\/p>\n<h3>对抗性追问：梯度下降能否找到全局最优<\/h3>\n<p>凸二次损失面上任意局部下降方向都通向全局最优点；深度网络损失非凸，梯度下降只保证到达某个局部平稳点，是否找到好解取决于初始化、正则化与优化器。把线性回归的凸结论直接套到深度网络是常见误用。<\/p>\n<h2>补充推演与第二算例<\/h2>\n<h3>第二算例：二维正规方程手算<\/h3>\n<p>两样本 <span class=\"katex-inline\">X=\\begin{pmatrix}1&amp;1\\\\1&amp;2\\end{pmatrix}<\/span>，<span class=\"katex-inline\">\\mathbf y=(2,3)<\/span>。 <span class=\"katex-inline\">X^\\top X=\\begin{pmatrix}1&amp;1\\\\1&amp;2\\end{pmatrix}\\begin{pmatrix}1&amp;1\\\\1&amp;2\\end{pmatrix}=\\begin{pmatrix}2&amp;3\\\\3&amp;5\\end{pmatrix}<\/span>，<span class=\"katex-inline\">X^\\top\\mathbf y=\\begin{pmatrix}1&amp;1\\\\1&amp;2\\end{pmatrix}\\begin{pmatrix}2\\\\3\\end{pmatrix}=(5,8)^\\top<\/span>。 解 <span class=\"katex-inline\">(X^\\top X)\\mathbf w=(5,8)^\\top<\/span>：行列式 <span class=\"katex-inline\">2\\times5-3\\times3=1<\/span>，逆矩阵 <span class=\"katex-inline\">\\begin{pmatrix}5&amp;-3\\\\-3&amp;2\\end{pmatrix}<\/span>，<span class=\"katex-inline\">\\mathbf w=\\begin{pmatrix}5&amp;-3\\\\-3&amp;2\\end{pmatrix}(5,8)^\\top=(25-24,-15+16)=(1,1)^\\top<\/span>。回代：<span class=\"katex-inline\">\\hat{\\mathbf y}=X\\mathbf w=(2,3)<\/span>，残差为 0。<\/p>\n<h3>几何投影与正交残差<\/h3>\n<p>正规方程找到的是列空间 <span class=\"katex-inline\">\\mathrm{col}(X)<\/span> 中离 <span class=\"katex-inline\">\\mathbf y<\/span> 最近的点。残差 <span class=\"katex-inline\">\\mathbf y-\\hat{\\mathbf y}<\/span> 与列空间正交：对任意 <span class=\"katex-inline\">X\\mathbf z<\/span>，<span class=\"katex-inline\">(X\\mathbf z)^\\top(\\mathbf y-X\\mathbf w^*)=\\mathbf z^\\top X^\\top(\\mathbf y-\\hat{\\mathbf y})=0<\/span>。投影失败时（列空间维数不足），残差里有无法被特征解释的分量，对应不可约误差。<\/p>\n<h3>病态条件数与岭回归补偿<\/h3>\n<p><span class=\"katex-inline\">X^\\top X<\/span> 条件数大时，输入微小扰动会被逆矩阵放大成权重大幅摆动。岭回归在正规方程两侧加 <span class=\"katex-inline\">\\lambda I<\/span>：<span class=\"katex-inline\">(X^\\top X+\\lambda I)\\mathbf w=X^\\top\\mathbf y<\/span>，矩阵对角占优、条件数下降；代价是偏向把权重压小。这与概念 c06 的权重衰减是同一组正则思想在闭式解里的写法。<\/p>\n<h3>批量大小对梯度方差的影响<\/h3>\n<p>单样本梯度 <span class=\"katex-inline\">g_i=2x_i(\\hat y_i-y_i)<\/span>；批量 <span class=\"katex-inline\">B<\/span> 梯度是 <span class=\"katex-inline\">\\frac1{|B|}\\sum_{i\\in B}g_i<\/span>。若各样本梯度方差为 <span class=\"katex-inline\">\\sigma_g^2<\/span> 且独立，批量平均后方差 <span class=\"katex-inline\">\\sigma_g^2/|B|<\/span>。批量翻倍梯度方差减半，但单轮计算量翻倍；实践中在梯度稳定性与更新频率之间取批量折中，不是越大越好。<\/p>\n<h3>代码片段：闭式解与迭代解对照<\/h3>\n<pre class=\"lang-python\"><code>import torch\nX = torch.tensor([[1., 1.], [1., 2.]])\ny = torch.tensor([2., 3.])\nw_closed = torch.linalg.solve(X.T @ X, X.T @ y)\nw = torch.zeros(2, requires_grad=True)\nopt = torch.optim.SGD([w], lr=0.1)\nfor _ in range(200):\n    loss = ((X @ w - y) ** 2).mean()\n    opt.zero_grad(); loss.backward(); opt.step()\nprint(w_closed, w)   # 两条路径收敛到 (1, 1) 附近<\/code><\/pre>\n<h3>对抗性追问：逻辑回归为什么不用正规方程<\/h3>\n<p>正规方程只对平方损失（二次型）有闭合解。交叉熵损失对权重不是二次函数，梯度方程 <span class=\"katex-inline\">X^\\top(\\hat y-y)=0<\/span> 不含可逆矩阵形式，只能迭代求解。把线性回归的闭式路径套到分类任务，是对损失函数形式的误用。<\/p>\n<h3>第二轮补充<\/h3>\n<h3>第二算例：学习率越过稳定边界<\/h3>\n<p><span class=\"katex-inline\">L(w)=w^2/2<\/span>，<span class=\"katex-inline\">a=1<\/span>，<span class=\"katex-inline\">\\eta=2.1<\/span>（超过 <span class=\"katex-inline\">2/a=2<\/span>）。<span class=\"katex-inline\">w_0=1<\/span>，<span class=\"katex-inline\">w_1=(1-2.1)w_0=-1.1<\/span>，<span class=\"katex-inline\">w_2=(1-2.1)(-1.1)=1.21<\/span>，序列绝对值 <span class=\"katex-inline\">1\\to1.1\\to1.21<\/span> 单调放大，震荡发散；<span class=\"katex-inline\">\\eta=1.9<\/span> 时因子 <span class=\"katex-inline\">-0.9<\/span>，序列衰减震荡收敛。多维损失面上，最大曲率方向先越界，可用学习率由该方向约束。<\/p>\n<h3>特征标准化的位置<\/h3>\n<p>特征量纲差异使损失面成狭长椭圆：大曲率方向步幅受限，小曲率方向前进缓慢。标准化把各特征放到相近尺度，损失面接近各向同性，同一步长在各方向利用率更均衡；标准化统计量只用训练集估计，验证测试集套用同一均值方差。<\/p>\n<h3>对抗性追问：闭式解能否处理非线性特征<\/h3>\n<p>正规方程只要求模型对参数线性；特征可以先做多项式、交互项变换，再进 <span class=\"katex-inline\">X<\/span> 矩阵。模型对 <span class=\"katex-inline\">w<\/span> 仍是线性二次损失，闭式解成立；判断能否闭式求解看损失对参数是否二次，不看原始输入是否线性。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n正规方程解的表达式与可逆条件是什么？（<span class=\"katex-inline\">\\mathbf w^*=(X^\\top X)^{-1}X^\\top\\mathbf y<\/span>，要求 <span class=\"katex-inline\">X^\\top X<\/span> 可逆即列满秩。）\n<\/li><li>\n二次型 <span class=\"katex-inline\">\\mathbf w^\\top A\\mathbf w<\/span> 对 <span class=\"katex-inline\">\\mathbf w<\/span> 的梯度是什么？（<span class=\"katex-inline\">2A\\mathbf w<\/span>，<span class=\"katex-inline\">A<\/span> 对称。）\n<\/li><li>\n一维二次损失 <span class=\"katex-inline\">L=\\frac12 aw^2<\/span> 的收敛学习率区间是什么？（<span class=\"katex-inline\">0&lt;\\eta&lt;2/a<\/span>。）\n<\/li><li>\n特征高度共线时正规方程为什么失效？（列成比例导致 <span class=\"katex-inline\">X^\\top X<\/span> 奇异，解不唯一。）\n<\/li><li>\n批量 GD 与小批量 SGD 在梯度估计与计算量上的差别是什么？（GD 全量算梯度方向稳但每轮重；SGD 小批估计引入噪声，换并行与更新频率。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "线性回归：正规方程解析解与梯度下降/小批量随机梯度下降"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.123<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">线性回归：正规方程解析解与梯度下降/小批量随机梯度下降<\/a><\/span><\/div><h1>softmax 与交叉熵：分类损失、数值稳定实现与梯度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书 3.4 softmax 回归、3.6/3.7 实现，PDF 第 123–126、135 页前后）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>多分类任务要给每个类别输出一个概率估计：输出非负、总和为 1，且模型预测正确时损失接近 0。线性层直接给出的 logit 可正可负、不加约束，不满足概率公理；分类标签之间没有自然顺序，回归那套平方损失套用过来，会在模型自信判错时仍按“差值平方”受罚，且饱和区梯度很小。softmax 把 logit 转成概率分布，交叉熵度量预测分布与独热标签分布的差距，两者配合构成分类模型的标准输出与损失。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>未规范化预测（logit）<\/strong>：样本经仿射变换得到 <span class=\"katex-inline\">o_1,\\dots,o_q<\/span>，批量矩阵式 <span class=\"katex-inline\">O=XW+\\mathbf b<\/span>，形状 <span class=\"katex-inline\">(n,q)<\/span>（原书 3.4.5 节，PDF 第 126 页）。<\/p>\n<p><strong>softmax<\/strong>：<span class=\"katex-inline\">\\hat y_j=\\exp(o_j)/\\sum_{k=1}^q\\exp(o_k)<\/span>。分子取幂保证非负，分母归一保证总和为 1。softmax 不改 logit 之间的大小次序，因此预测类别仍是 <span class=\"katex-inline\">\\arg\\max_j o_j<\/span>（原书 3.4.4 节，PDF 第 125 页）。<\/p>\n<p><strong>独热标签<\/strong>：<span class=\"katex-inline\">y\\in\\{0,1\\}^q<\/span>，正确类分量为 1、其余为 0；类别之间不假设顺序。<\/p>\n<p><strong>交叉熵损失<\/strong>：<span class=\"katex-inline\">l(y,\\hat y)=-\\sum_{j=1}^q y_j\\log\\hat y_j<\/span>。独热下只剩正确类一项：<span class=\"katex-inline\">l=-\\log\\hat y_{y}<\/span>。批量损失为各样本平均（原书 3.4.6 节，PDF 第 126 页）。<\/p>\n<p><strong>数值稳定实现<\/strong>：直接对大 logit 取幂会上溢，对极小 logit 会下溢；标准做法先减去每行最大值 <span class=\"katex-inline\">m=\\max_j o_j<\/span>，再做 softmax，比值不变。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>softmax 求导：对 <span class=\"katex-inline\">k\\neq j<\/span>，<span class=\"katex-inline\">\\partial\\hat y_j/\\partial o_k=-\\hat y_j\\hat y_k<\/span>；对 <span class=\"katex-inline\">k=j<\/span>，<span class=\"katex-inline\">\\partial\\hat y_j/\\partial o_j=\\hat y_j(1-\\hat y_j)<\/span>。写成统一形式 <span class=\"katex-inline\">\\partial\\hat y_j/\\partial o_k=\\hat y_j(\\delta_{jk}-\\hat y_k)<\/span>。<\/p>\n<p>交叉熵对 logit 求梯度：<span class=\"katex-inline\">l=-\\sum_j y_j\\log\\hat y_j<\/span>，<span class=\"katex-inline\">\\partial l/\\partial o_k=-\\sum_j y_j\\frac{1}{\\hat y_j}\\frac{\\partial\\hat y_j}{\\partial o_k}<\/span>。代入 softmax 导数并利用 <span class=\"katex-inline\">\\sum_j\\hat y_j=1<\/span>，化简得<\/p>\n<div class=\"katex-block\">\\frac{\\partial l}{\\partial o_k}=\\hat y_k-y_k.<\/div>\n<p>即梯度为预测概率减标签：预测正确且自信时梯度接近 0；判错或概率分散时梯度明显。<\/p>\n<p>数值算例：<span class=\"katex-inline\">o=(2,1,-1)<\/span>，<span class=\"katex-inline\">m=2<\/span>。<span class=\"katex-inline\">\\exp(0)=1<\/span>，<span class=\"katex-inline\">\\exp(-1)\\approx0.3679<\/span>，<span class=\"katex-inline\">\\exp(-3)\\approx0.0498<\/span>，和 <span class=\"katex-inline\">\\approx1.4177<\/span>，<span class=\"katex-inline\">\\hat y\\approx(0.7054,0.2595,0.0351)<\/span>。若标签为第二类，<span class=\"katex-inline\">y=(0,1,0)<\/span>，梯度 <span class=\"katex-inline\">(\\hat y-y)\\approx(0.7054,-0.7405,0.0351)<\/span>。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：类别互斥、单标签分类；模型输出经 softmax 解释为类别条件概率。多标签或类别层次结构要换相应损失。\n<\/li><li>\n失败案例一：logit 数值很大时直接 <code>exp<\/code>。分子分母同时上溢得 <code>inf/inf<\/code>，概率变 NaN；减最大值后指数项不超过 1，避免上溢。\n<\/li><li>\n失败案例二：把 softmax 输出当硬类别直接回传。精度不可导，训练仍要用交叉熵；精度只作为评估指标（原书 3.6.5 节，PDF 第 136 页）。\n<\/li><li>\n失败案例三：标签编码顺序错位。独热向量与类别索引对不上，交叉熵惩罚的类别就错了，训练表现为损失不降甚至发散。\n<\/li><li>\n边界：softmax 回归仍是线性模型，决策边界是超平面；非线性分类要靠隐层与激活函数（概念 c05）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>交叉熵 vs 平方损失<\/strong>：平方损失假设连续标签、误差高斯；交叉熵面对独热分布，梯度形式为概率减标签，判错时梯度不会被饱和压平。分类套平方损失，模型在 sigmoid/softmax 饱和区更新缓慢。\n<\/li><li>\n<strong>softmax vs sigmoid<\/strong>：sigmoid 把单个 logit 压到 <span class=\"katex-inline\">(0,1)<\/span>，用于二分类或独立多标签；softmax 在 <span class=\"katex-inline\">q<\/span> 类间归一，用于互斥多分类。二分类时 softmax 退化为两项归一，与 sigmoid 等价。\n<\/li><li>\n<strong>概率校准 vs 排序正确<\/strong>：softmax 输出的数值要满足校准（输出 0.5 的样本应有一半属于该类），训练目标是估计条件概率；排序正确只要求 argmax 对，两者不是一回事。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c03 的模型—损失—梯度—更新循环；概念 c02 提供反向求导。后继：概念 c05 的 MLP 在输出层前加隐层，输出端仍接 softmax 与交叉熵；注意力权重经 softmax 归一（概念 c13），用到同一套数值稳定手法。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（softmax 与交叉熵：分类损失、数值稳定实现与梯度）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：softmax 导数、交叉熵梯度化简与稳定实现算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把分类损失的梯度讲透，先往回追四层前提：<\/p>\n<ol><li>\n分类输出必须先变成合法概率分布。logit 无约束，softmax 用取幂加归一满足非负与和 1；这是交叉熵能定义的前提。\n<\/li><li>\n标签用独热向量表示。类别无序，标签分布与预测分布同维，才能逐项比较。\n<\/li><li>\n交叉熵对 logit 的梯度要经两层复合：损失对概率求导，概率对 logit 求导。两层都写清才能化简到 <span class=\"katex-inline\">\\hat y-y<\/span>。\n<\/li><li>\n数值稳定性要求比值在大数值下不变。减最大值不改变 softmax 比值，这是稳定实现的代数依据。\n<\/ol>\n<p>依赖链方向：logit 向量 → softmax 归一得概率分布 → 独热标签比对得交叉熵 → 链式法则回传到 logit → 稳定化处理防上溢。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：softmax 导数<\/h3>\n<p>记 <span class=\"katex-inline\">s_j=\\exp(o_j)/Z<\/span>，<span class=\"katex-inline\">Z=\\sum_k\\exp(o_k)<\/span>。 对 <span class=\"katex-inline\">k=j<\/span>：<\/p>\n<div class=\"katex-block\">\\frac{\\partial s_j}{\\partial o_j}=\\frac{\\exp(o_j)Z-\\exp(o_j)\\exp(o_j)}{Z^2}=s_j(1-s_j).<\/div>\n<p>对 <span class=\"katex-inline\">k\\neq j<\/span>：<\/p>\n<div class=\"katex-block\">\\frac{\\partial s_j}{\\partial o_k}=\\frac{0-\\exp(o_j)\\exp(o_k)}{Z^2}=-s_j s_k.<\/div>\n<p>合并为 <span class=\"katex-inline\">\\partial s_j/\\partial o_k=s_j(\\delta_{jk}-s_k)<\/span>，其中 <span class=\"katex-inline\">\\delta_{jk}<\/span> 在 <span class=\"katex-inline\">j=k<\/span> 时为 1，否则为 0。<\/p>\n<h3>第二步：交叉熵对概率求导<\/h3>\n<p><span class=\"katex-inline\">l=-\\sum_j y_j\\log s_j<\/span>，对 <span class=\"katex-inline\">s_k<\/span> 求偏导：<\/p>\n<div class=\"katex-block\">\\frac{\\partial l}{\\partial s_k}=-\\frac{y_k}{s_k}.<\/div>\n<h3>第三步：链式法则回传到 logit<\/h3>\n<div class=\"katex-block\">=\\sum_j\\left(-\\frac{y_j}{s_j}\\right)s_j(\\delta_{jk}-s_k)\\\\=-y_k+s_k\\sum_j y_j.<\/div>\n<p>独热标签满足 <span class=\"katex-inline\">\\sum_j y_j=1<\/span>，故 <span class=\"katex-inline\">\\sum_j y_j=1<\/span>，化简得<\/p>\n<div class=\"katex-block\">\\frac{\\partial l}{\\partial o_k}=s_k-y_k=\\hat y_k-y_k.<\/div>\n<p>关键中间步：<span class=\"katex-inline\">s_j<\/span> 在分子分母约掉，避免了 <span class=\"katex-inline\">1/s_j<\/span> 出现在最终梯度里；求和 <span class=\"katex-inline\">\\sum_j y_j=1<\/span> 是独热结构带来的简化。<\/p>\n<h3>第四步：稳定化证明<\/h3>\n<p>设 <span class=\"katex-inline\">m=\\max_j o_j<\/span>，令 <span class=\"katex-inline\">o&#x27;_j=o_j-m<\/span>。比值<\/p>\n<div class=\"katex-block\">\\frac{\\exp(o'_j)}{\\sum_k\\exp(o'_k)}=\\frac{\\exp(o_j-m)}{\\sum_k\\exp(o_k-m)}=\\frac{e^{-m}\\exp(o_j)}{e^{-m}\\sum_k\\exp(o_k)}=\\frac{\\exp(o_j)}{\\sum_k\\exp(o_k)}.<\/div>\n<p>分子分母同乘 <span class=\"katex-inline\">e^{-m}<\/span> 约去，减最大值不改变 softmax 输出。减后 <span class=\"katex-inline\">o&#x27;_j\\le0<\/span>，指数项落在 <span class=\"katex-inline\">(0,1]<\/span>，上溢被消除。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：三类样本的概率与梯度<\/h3>\n<p><span class=\"katex-inline\">o=(2,1,-1)<\/span>，<span class=\"katex-inline\">m=2<\/span>，<span class=\"katex-inline\">o&#x27;=(0,-1,-3)<\/span>。 <span class=\"katex-inline\">\\exp(0)=1<\/span>，<span class=\"katex-inline\">\\exp(-1)=0.367879<\/span>，<span class=\"katex-inline\">\\exp(-3)=0.049787<\/span>，<span class=\"katex-inline\">Z=1.417666<\/span>。 <span class=\"katex-inline\">s=(1/1.417666,\\ 0.367879/1.417666,\\ 0.049787/1.417666)\\approx(0.7054,\\ 0.2595,\\ 0.0351)<\/span>。 校验：<span class=\"katex-inline\">0.7054+0.2595+0.0351=1.0000<\/span>。 标签 <span class=\"katex-inline\">y=(0,1,0)<\/span>（第二类正确），梯度 <span class=\"katex-inline\">s-y\\approx(0.7054,\\ -0.7405,\\ 0.0351)<\/span>。第二类概率 0.2595 偏低，梯度为负，下一步更新会增大该 logit；第一类概率虚高，梯度为正压低它。<\/p>\n<h3>算例 2：两样本批量交叉熵<\/h3>\n<p><span class=\"katex-inline\">y_{\\hat{h}}=\\begin{pmatrix}0.1&amp;0.3&amp;0.6\\\\0.3&amp;0.2&amp;0.5\\end{pmatrix}<\/span>，标签 <span class=\"katex-inline\">y=(0,2)<\/span>（原书 3.6.4 节，PDF 第 135 页）。 第一样本正确类概率 0.1，损失 <span class=\"katex-inline\">-\\log0.1=2.3026<\/span>；第二样本正确类概率 0.5，损失 <span class=\"katex-inline\">-\\log0.5=0.6931<\/span>，与原书给出数值一致。批量平均损失 <span class=\"katex-inline\">(2.3026+0.6931)/2=1.4979<\/span>。<\/p>\n<h3>代码片段：稳定 softmax<\/h3>\n<pre class=\"lang-python\"><code>import torch\no = torch.tensor([[2.0, 1.0, -1.0]])\no_shifted = o - o.max(dim=1, keepdim=True).values\ns = torch.softmax(o_shifted, dim=1)\nprint(s)                 # 与直接 softmax(o) 数值一致，且无上溢风险<\/code><\/pre>\n<p>框架内置 <code>torch.softmax<\/code> 与交叉熵算子已合并稳定化处理；从零实现手写 softmax 时必须保留减最大值这一步。<\/p>\n<h2>延伸推演<\/h2>\n<h3>为什么平方损失不适合分类<\/h3>\n<p>若对 softmax 输出套平方损失 <span class=\"katex-inline\">l=\\frac12\\sum_j(\\hat y_j-y_j)^2<\/span>，其梯度含 <span class=\"katex-inline\">(\\hat y_j-y_j)\\hat y_j(1-\\hat y_j)<\/span> 一类因子。当模型自信判错，<span class=\"katex-inline\">\\hat y<\/span> 接近 one-hot，<span class=\"katex-inline\">\\hat y_j(1-\\hat y_j)<\/span> 趋近 0，梯度被饱和压平；而交叉熵梯度为 <span class=\"katex-inline\">\\hat y-y<\/span>，判错越坚决、拉动该类概率的梯度越直接。这是分类选交叉熵的核心原因。<\/p>\n<h3>softmax 与注意力权重的同源关系<\/h3>\n<p>注意力评分经 softmax 归一成权重分布（概念 c13），同样要求非负、和 1，同样在大评分差时面临上溢与饱和。稳定 softmax 的减最大值手法在注意力打分处直接复用；权重分布的梯度形式也是“权重减目标分布”。<\/p>\n<h3>独热之外的标签平滑<\/h3>\n<p>标签平滑把独热的 1 换成 <span class=\"katex-inline\">1-\\epsilon<\/span>，0 换成 <span class=\"katex-inline\">\\epsilon/(q-1)<\/span>，避免模型把概率压到极端 0/1。它改变的是标签分布 <span class=\"katex-inline\">y<\/span>，交叉熵与梯度推导结构不变，梯度仍为 <span class=\"katex-inline\">s-y<\/span>。<\/p>\n<h3>对抗性追问：argmax 与概率估计必须分开看<\/h3>\n<p>排序正确只要求 <span class=\"katex-inline\">\\arg\\max s_j<\/span> 命中标签；概率校准要求数值接近真实频率。模型可能 argmax 全对但各类概率过度自信，也可能概率接近真实分布。训练目标交叉熵优化后者，评估指标看前者，两者别混为一谈。<\/p>\n<h2>补充推演与第二算例<\/h2>\n<h3>第二算例：等 logit 与温度缩放<\/h3>\n<p>三类 logit <span class=\"katex-inline\">o=(0,0,0)<\/span>，<span class=\"katex-inline\">Z=3<\/span>，<span class=\"katex-inline\">s=(1/3,1/3,1/3)<\/span>，均匀分布；标签 <span class=\"katex-inline\">(0,1,0)<\/span>，梯度 <span class=\"katex-inline\">(1/3,-2/3,1/3)<\/span>，三个方向同时被拉动。温度系数 <span class=\"katex-inline\">T<\/span> 把评分除 <span class=\"katex-inline\">T<\/span>：<span class=\"katex-inline\">s_j=\\exp(o_j/T)/\\sum_k\\exp(o_k/T)<\/span>。<span class=\"katex-inline\">T&lt;1<\/span> 放大 logit 差，分布趋近 one-hot；<span class=\"katex-inline\">T&gt;1<\/span> 拉平分布。梯度形式仍是 <span class=\"katex-inline\">s-y<\/span>，缩放改变的是概率分布的尖锐程度。<\/p>\n<h3>交叉熵与 KL 散度的位置<\/h3>\n<p>标签分布 <span class=\"katex-inline\">y<\/span> 与预测分布 <span class=\"katex-inline\">s<\/span> 的 KL 散度 <span class=\"katex-inline\">D_{\\mathrm{KL}}(y\\|s)=\\sum_j y_j\\log y_j-\\sum_j y_j\\log s_j<\/span>。第一项与模型无关，最小化 KL 等价于最小化交叉熵 <span class=\"katex-inline\">-\\sum_j y_j\\log s_j<\/span>。交叉熵因此可以看成“让预测分布向标签分布靠拢”的散度度量；训练中只回传第二项对应的梯度。<\/p>\n<h3>softmax 雅可比的秩<\/h3>\n<p>雅可比 <span class=\"katex-inline\">\\partial s/\\partial o<\/span> 每行和为 0：<span class=\"katex-inline\">\\sum_k\\partial s_j/\\partial o_k=s_j(1-s_j)-s_j\\sum_{k\\neq j}s_k=s_j-s_j\\sum_k s_k=0<\/span>。各分量概率受“和为 1”约束，一个 logit 增大必然挤占其他概率；这解释了为什么判对类概率上升时其余类概率同步下降。<\/p>\n<h3>合并算子的等价写法<\/h3>\n<p><code>CrossEntropyLoss<\/code> 内部先做 log-softmax 再算负对数似然，数值上等价于 <code>log_softmax + NLLLoss<\/code>，但合并实现减少一次中间概率存储。手写时先 <code>log_s=torch.log_softmax(o, dim=1)<\/code>，再取标签对应位置 <span class=\"katex-inline\">-\\log s_y<\/span>；分开写稳定化步骤容易遗漏减最大值。<\/p>\n<h3>代码片段：标签平滑后的梯度<\/h3>\n<pre class=\"lang-python\"><code>import torch\no = torch.tensor([2.0, 1.0, -1.0])\neps = 0.1\ny_smooth = torch.tensor([eps/2, 1-eps, eps/2])\nlog_s = torch.log_softmax(o, dim=0)\nloss = -(y_smooth * log_s).sum()\nloss.backward()\nprint(o.grad)   # 梯度形式仍为 softmax(o) - y_smooth<\/code><\/pre>\n<h3>对抗性追问：多标签分类为什么改用 sigmoid<\/h3>\n<p>单标签各类互斥，softmax 归一到和 1；多标签允许一个样本同时属于多个类别，各类别独立判定，损失换成逐位置 sigmoid 二元交叉熵。把多标签问题套 softmax，会迫使类别之间互相挤压，单个标签得分被其他标签压低。<\/p>\n<h3>第二轮补充<\/h3>\n<h3>第二算例：logit 上溢与下溢对照<\/h3>\n<p><span class=\"katex-inline\">o=(1000,999)<\/span>，直接 <span class=\"katex-inline\">\\exp<\/span> 两项上溢；减最大值 <span class=\"katex-inline\">m=1000<\/span>，<span class=\"katex-inline\">o&#x27;=(0,-1)<\/span>，<span class=\"katex-inline\">s=(1/(1+e^{-1}),e^{-1}/(1+e^{-1}))\\approx(0.731,0.269)<\/span>。反向极端情形：某类 logit 远小于其余，对应概率趋 0，<span class=\"katex-inline\">-\\log s<\/span> 趋于无穷，损失与梯度同步放大；标签平滑与置信度裁剪用于压住这种极端。<\/p>\n<h3>梯度更新方向核对<\/h3>\n<p><span class=\"katex-inline\">\\partial l/\\partial o_k=s_k-y_k<\/span>：正确类 <span class=\"katex-inline\">y_k=1<\/span>，<span class=\"katex-inline\">s_k&lt;1<\/span> 时梯度为负，下一步 <span class=\"katex-inline\">o_k<\/span> 增大；错误类 <span class=\"katex-inline\">y_k=0<\/span>，<span class=\"katex-inline\">s_k<\/span> 偏高时梯度为正，下一步压低该类。梯度符号与“增大正确类、压低错误类”的直觉一致。<\/p>\n<h3>对抗性追问：softmax 输出概率能否直接当置信度使用<\/h3>\n<p>训练集上的 softmax 概率受模型容量与正则影响，常过度自信；校准要靠温度缩放、置信度惩罚或验证集校准。排序准确率与概率数值是两件事，评估时分开看。<\/p>\n<h2>自检<\/h2>\n<ol><li>\nsoftmax 导数的统一公式是什么？（<span class=\"katex-inline\">\\partial s_j/\\partial o_k=s_j(\\delta_{jk}-s_k)<\/span>。）\n<\/li><li>\n交叉熵对 logit 的梯度化简结果是什么？（<span class=\"katex-inline\">\\partial l/\\partial o_k=s_k-y_k<\/span>，预测概率减标签。）\n<\/li><li>\n减最大值为什么不改变 softmax 比值？（分子分母同乘 <span class=\"katex-inline\">e^{-m}<\/span> 约去，比值不变。）\n<\/li><li>\n平方损失套在 softmax 分类上，饱和区为什么更新慢？（梯度带 <span class=\"katex-inline\">s_j(1-s_j)<\/span> 因子，自信判错时该因子趋近 0。）\n<\/li><li>\n独热标签在梯度化简中起了什么作用？（<span class=\"katex-inline\">\\sum_j y_j=1<\/span>，使 <span class=\"katex-inline\">-y_k+s_k\\sum_j y_j<\/span> 化简为 <span class=\"katex-inline\">s_k-y_k<\/span>。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "softmax 与交叉熵：分类损失、数值稳定实现与梯度"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.145<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">softmax 与交叉熵：分类损失、数值稳定实现与梯度<\/a><\/span><\/div><h1>多层感知机与非线性激活：为什么线性堆叠会退化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书 4.1 多层感知机、4.1.2 激活函数，PDF 第 145、148 页前后）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>线性回归与 softmax 回归的决策边界是超平面，解决不了异或、图像分类这类线性不可分问题。在输入与输出之间插入隐藏层可以增加模型容量，但如果层与层之间不加非线性变换，再深的网络都等价于一个单层线性模型，容量没有增加。多层感知机（MLP）的关键不是层数本身，而是层间激活函数引入的非线性：它把每层输出掰成不同输入区域的分段响应，使复合函数能拟合复杂映射。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>隐藏层<\/strong>：夹在输入层与输出层之间的全连接层。设输入 <span class=\"katex-inline\">\\mathbf x\\in\\mathbb R^d<\/span>，第一隐层权重 <span class=\"katex-inline\">W_1\\in\\mathbb R^{h\\times d}<\/span>、偏置 <span class=\"katex-inline\">\\mathbf b_1<\/span>，第二隐层输出权重 <span class=\"katex-inline\">W_2\\in\\mathbb R^{q\\times h}<\/span>、偏置 <span class=\"katex-inline\">\\mathbf b_2<\/span>。<\/p>\n<p><strong>前向计算<\/strong>：<span class=\"katex-inline\">\\mathbf h=\\phi(W_1\\mathbf x+\\mathbf b_1)<\/span>，<span class=\"katex-inline\">\\mathbf o=W_2\\mathbf h+\\mathbf b_2<\/span>。<span class=\"katex-inline\">\\phi<\/span> 是逐元素作用的激活函数，对每个隐单元独立施加。<\/p>\n<p><strong>常用激活函数<\/strong>：<\/p>\n<ul><li>\nReLU：<span class=\"katex-inline\">\\phi(x)=\\max(0,x)<\/span>，负区间梯度为 0、正区间梯度为 1，计算简单。\n<\/li><li>\nsigmoid：<span class=\"katex-inline\">\\phi(x)=1/(1+e^{-x})<\/span>，输出 <span class=\"katex-inline\">(0,1)<\/span>，两端饱和。\n<\/li><li>\ntanh：<span class=\"katex-inline\">\\phi(x)=(e^x-e^{-x})/(e^x+e^{-x})<\/span>，输出 <span class=\"katex-inline\">(-1,1)<\/span>，同样两端饱和。\n<\/ul>\n<p><strong>万能逼近<\/strong>：宽度足够的单隐藏层前馈网络，在隐含条件下可以逼近紧集上的连续函数；实践中深层网络比宽单层更省参数（原书 3.1.4 节从线性回归到深度网络，PDF 第 113 页前后）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>先看无激活的两层网络：<span class=\"katex-inline\">\\mathbf h=W_1\\mathbf x+\\mathbf b_1<\/span>，<span class=\"katex-inline\">\\mathbf o=W_2\\mathbf h+\\mathbf b_2<\/span>。代入得<\/p>\n<div class=\"katex-block\">\\mathbf o=W_2W_1\\mathbf x+(W_2\\mathbf b_1+\\mathbf b_2).<\/div>\n<p>令 <span class=\"katex-inline\">W&#x27;=W_2W_1<\/span>、<span class=\"katex-inline\">\\mathbf b&#x27;=W_2\\mathbf b_1+\\mathbf b_2<\/span>，<span class=\"katex-inline\">\\mathbf o=W&#x27;\\mathbf x+\\mathbf b&#x27;<\/span>，仍是单层仿射。再接第三层 <span class=\"katex-inline\">\\mathbf z=W_3\\mathbf o+\\mathbf b_3<\/span>，合并为 <span class=\"katex-inline\">W&#x27;&#x27;=W_3W&#x27;<\/span>、<span class=\"katex-inline\">\\mathbf b&#x27;&#x27;=W_3\\mathbf b&#x27;+\\mathbf b_3<\/span>。线性变换复合仍线性，层数不增加函数类。<\/p>\n<p>接入 <span class=\"katex-inline\">\\phi<\/span> 后：<span class=\"katex-inline\">\\mathbf o=W_2\\phi(W_1\\mathbf x+\\mathbf b_1)+\\mathbf b_2<\/span>。<span class=\"katex-inline\">\\phi<\/span> 对仿射结果逐元素分段作用，矩阵乘法无法跨激活合并；不同隐单元在不同输入区域被激活，复合函数获得分段拟合能力。<\/p>\n<p>数值算例：输入 <span class=\"katex-inline\">x=1.5<\/span>，<span class=\"katex-inline\">w_1=0.8<\/span>，<span class=\"katex-inline\">b_1=-1<\/span>。仿射结果 <span class=\"katex-inline\">u=0.8\\times1.5-1=0.2<\/span>。ReLU 后 <span class=\"katex-inline\">\\phi(0.2)=0.2<\/span>；sigmoid 后 <span class=\"katex-inline\">\\sigma(0.2)\\approx0.5498<\/span>；tanh 后 <span class=\"katex-inline\">\\tanh(0.2)\\approx0.1974<\/span>。同一仿射值经不同激活得到不同非线性变换后的表示。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：激活函数至少在部分区间可导，使反向传播能传梯度；逐元素作用不改变张量形状。\n<\/li><li>\n失败案例一：sigmoid/tanh 两端饱和。输入绝对值很大时输出贴近 0 或 1，激活导数趋近 0，多层连乘后梯度消失；深层网络默认选 ReLU 系正是避开两端饱和。\n<\/li><li>\n失败案例二：死亡 ReLU。某隐单元输入长期为负，ReLU 输出恒 0，梯度也恒 0，该单元再也不更新；学习率过大或负偏置过大会加剧这一情况。\n<\/li><li>\n失败案例三：把宽度当深度。单隐层要逼近复杂函数需要很宽，参数随输入维度与类别数膨胀；深层逐级抽象比宽单层参数效率高，但深度叠加会引入稳定性问题（概念 c07、c10）。\n<\/li><li>\n边界：MLP 把每个输入位置与全部隐单元全连接，处理高分辨率图像时参数量随边长平方增长；空间局部性要靠卷积利用（概念 c08）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>激活函数 vs 正则化手段<\/strong>：激活改变模型函数类，是结构必需；权重衰减、dropout 约束已有模型的复杂度，不改变层间变换形式。缺激活的网络加再多正则也学不到非线性关系。\n<\/li><li>\n<strong>隐层宽度 vs 网络深度<\/strong>：宽度增加单层可分的区域数，深度逐级组合低级特征；宽单层逼近定理给存在性，实践中深而不太宽的结构参数效率更高。\n<\/li><li>\n<strong>逐元素激活 vs 层间连接<\/strong>：<span class=\"katex-inline\">\\phi<\/span> 不混合通道，通道混合由权重矩阵完成；把激活写成矩阵乘法是概念混淆。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c03、c04 的单层模型是 MLP 去掉隐层的特例；概念 c02 反向求导沿“激活—仿射”逐层回传。后继：概念 c07 讲深层梯度尺度与初始化；卷积层、循环层、注意力层在各自结构里都重复“仿射/聚合—激活”这一基本单元。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（多层感知机与非线性激活：为什么线性堆叠会退化）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：线性合并退化证明、分段响应与异或算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要解释非线性激活为什么是 MLP 的容量来源，先往回追四层前提：<\/p>\n<ol><li>\n单层仿射变换只能表示线性决策边界。回归与分类的单层模型函数类受限，这是引入隐层的动机。\n<\/li><li>\n多层仿射复合在数学上仍等价于单层。矩阵乘法结合律、偏置可合并，层数不扩大函数类；不先证明这一点，就看不出激活承担的角色。\n<\/li><li>\n逐元素非线性破坏矩阵可合并性。激活对每个仿射结果单独掰弯，后续权重不能跨激活折叠。\n<\/li><li>\n非线性组合产生分段响应。每个隐单元在特定输入区域接通，多层叠加后覆盖复杂决策边界。\n<\/ol>\n<p>依赖链方向：单层仿射局限 → 多层仿射复合仍退化 → 插入激活打断可合并性 → 分段响应叠加 → 万能逼近给出容量存在性。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：两层无激活网络的合并<\/h3>\n<p>第一层 <span class=\"katex-inline\">\\mathbf h=W_1\\mathbf x+\\mathbf b_1<\/span>，第二层 <span class=\"katex-inline\">\\mathbf o=W_2\\mathbf h+\\mathbf b_2<\/span>。 代入：<span class=\"katex-inline\">\\mathbf o=W_2(W_1\\mathbf x+\\mathbf b_1)+\\mathbf b_2=W_2W_1\\mathbf x+W_2\\mathbf b_1+\\mathbf b_2<\/span>。 记 <span class=\"katex-inline\">W&#x27;=W_2W_1<\/span>，<span class=\"katex-inline\">\\mathbf b&#x27;=W_2\\mathbf b_1+\\mathbf b_2<\/span>，则 <span class=\"katex-inline\">\\mathbf o=W&#x27;\\mathbf x+\\mathbf b&#x27;<\/span>。结果只含一个权重矩阵与一个偏置向量，与两层结构无关。<\/p>\n<h3>第二步：再接线性层仍可合并<\/h3>\n<p>第三层 <span class=\"katex-inline\">\\mathbf z=W_3\\mathbf o+\\mathbf b_3=W_3(W&#x27;\\mathbf x+\\mathbf b&#x27;)+\\mathbf b_3=W_3W&#x27;\\mathbf x+W_3\\mathbf b&#x27;+\\mathbf b_3<\/span>。令 <span class=\"katex-inline\">W&#x27;&#x27;=W_3W&#x27;<\/span>，<span class=\"katex-inline\">\\mathbf b&#x27;&#x27;=W_3\\mathbf b&#x27;+\\mathbf b_3<\/span>，依旧是单层仿射。归纳可知任意层线性变换复合都是单层线性模型，隐层宽度不增加可表示函数集合。<\/p>\n<h3>第三步：插入激活后不可合并<\/h3>\n<p><span class=\"katex-inline\">\\mathbf h=\\phi(W_1\\mathbf x+\\mathbf b_1)<\/span>，<span class=\"katex-inline\">\\mathbf o=W_2\\mathbf h+\\mathbf b_2=W_2\\phi(W_1\\mathbf x+\\mathbf b_1)+\\mathbf b_2<\/span>。 <span class=\"katex-inline\">\\phi<\/span> 是逐元素函数，<span class=\"katex-inline\">\\phi(W_1\\mathbf x+\\mathbf b_1)<\/span> 不能写成某个矩阵左乘 <span class=\"katex-inline\">\\mathbf x<\/span>；第二层权重只能作用在掰弯后的表示上，无法回卷进第一层权重。复合函数类从此超出线性范围。<\/p>\n<h3>第四步：分段响应的几何视角<\/h3>\n<p>ReLU 隐单元在 <span class=\"katex-inline\">w^\\top x+b&gt;0<\/span> 时接通、否则断开。每个单元对应输入空间一个半平面；隐层把输入切分成若干区域，输出层在各区域组合这些接通信号。多层叠加时，上层单元再组合下层区域，形成更复杂的多边形/多面体决策边界。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：异或为什么线性不可分<\/h3>\n<p>异或真值表：<span class=\"katex-inline\">(0,0)\\to0<\/span>，<span class=\"katex-inline\">(0,1)\\to1<\/span>，<span class=\"katex-inline\">(1,0)\\to1<\/span>，<span class=\"katex-inline\">(1,1)\\to0<\/span>。任一一条直线都不能把两类点分开：点 <span class=\"katex-inline\">(0,0)<\/span> 与 <span class=\"katex-inline\">(1,1)<\/span> 同类，<span class=\"katex-inline\">(0,1)<\/span> 与 <span class=\"katex-inline\">(1,0)<\/span> 同类，两条连线交叉，线性超平面无法隔离。<\/p>\n<p>加两个 ReLU 隐单元后：<\/p>\n<ul><li>\n单元 A 划分：<span class=\"katex-inline\">u_A=x_1+x_2-0.5<\/span>，<span class=\"katex-inline\">h_A=\\max(0,u_A)<\/span>；\n<\/li><li>\n单元 B 划分：<span class=\"katex-inline\">u_B=x_1+x_2-1.5<\/span>，<span class=\"katex-inline\">h_B=\\max(0,u_B)<\/span>。\n<p>四组输入的隐层响应：<\/p>\n<\/ul>\n<div class=\"table-wrap\"><table><thead><tr><th>输入<\/th><th><span class=\"katex-inline\">u_A<\/span><\/th><th><span class=\"katex-inline\">h_A<\/span><\/th><th><span class=\"katex-inline\">u_B<\/span><\/th><th><span class=\"katex-inline\">h_B<\/span><\/th><\/tr><\/thead><tbody><tr><td>(0,0)<\/td><td>−0.5<\/td><td>0<\/td><td>−1.5<\/td><td>0<\/td><\/tr><tr><td>(0,1)<\/td><td>0.5<\/td><td>0.5<\/td><td>−0.5<\/td><td>0<\/td><\/tr><tr><td>(1,0)<\/td><td>0.5<\/td><td>0.5<\/td><td>−0.5<\/td><td>0<\/td><\/tr><tr><td>(1,1)<\/td><td>1.5<\/td><td>1.5<\/td><td>0.5<\/td><td>0.5<\/td><\/tr><\/tbody><\/table><\/div>\n<p>输出层取 <span class=\"katex-inline\">\\hat y=h_A-2h_B<\/span>：(0,0)→0，(0,1)→0.5，(1,0)→0.5，(1,1)→1.5−1=0，与异或标签一致。两个半平面的组合把非线性问题切开。<\/p>\n<h3>算例 2：同一仿射值经不同激活<\/h3>\n<p><span class=\"katex-inline\">u=0.2<\/span>。ReLU：<span class=\"katex-inline\">\\max(0,0.2)=0.2<\/span>。sigmoid：<span class=\"katex-inline\">1/(1+e^{-0.2})\\approx0.5498<\/span>。tanh：<span class=\"katex-inline\">(e^{0.2}-e^{-0.2})/(e^{0.2}+e^{-0.2})\\approx0.1974<\/span>。激活导数在 <span class=\"katex-inline\">u=0.2<\/span> 处：ReLU 为 1，sigmoid 为 <span class=\"katex-inline\">\\sigma(1-\\sigma)\\approx0.2475<\/span>，tanh 为 <span class=\"katex-inline\">1-\\tanh^2\\approx0.9610<\/span>。同一输入位置，不同激活留下的回传梯度量级差别明显。<\/p>\n<h3>代码片段：单隐层 MLP 前向<\/h3>\n<pre class=\"lang-python\"><code>import torch\nfrom torch import nn\nnet = nn.Sequential(\n    nn.Linear(2, 4), nn.ReLU(),\n    nn.Linear(4, 2)\n)\nX = torch.tensor([[0., 0.], [0., 1.], [1., 0.], [1., 1.]])\nprint(net(X).shape)   # torch.Size([4, 2])<\/code><\/pre>\n<p><code>nn.Linear<\/code> 完成仿射，<code>nn.ReLU<\/code> 逐元素掰弯；去掉中间激活，两层 Linear 可合并为一层 Linear。<\/p>\n<h2>延伸推演<\/h2>\n<h3>激活导数的量级分布<\/h3>\n<p>sigmoid 导数 <span class=\"katex-inline\">\\sigma&#x27;(x)=\\sigma(x)(1-\\sigma(x))<\/span>，最大值 0.25 在 <span class=\"katex-inline\">x=0<\/span>，两端趋近 0；tanh 导数 <span class=\"katex-inline\">1-\\tanh^2(x)<\/span>，两端趋近 0。深层网络反向传播时，若多个激活都落在饱和区，梯度逐次乘小于 1 的因子，连乘后接近消失。ReLU 正区间导数恒 1，不压制梯度，这是深度网络默认选 ReLU 系的直接原因。<\/p>\n<h3>宽度与深度的参数账<\/h3>\n<p>单隐层逼近定理说明宽单层够用，但要覆盖复杂函数，宽度可能随输入维度组合爆炸；深层逐级组合特征，每层只学局部变换，总参数通常更少。代价是深度叠加带来梯度连乘与优化困难，需要初始化、归一化、残差连接配套。<\/p>\n<h3>对抗性追问：网络越深越好吗<\/h3>\n<p>深度不是天然收益。层数加深后若没有配套稳定性措施，梯度沿层连乘消失或爆炸，训练误差压不下去；过深网络还更易在训练集上记忆噪声。深度优势要在初始化、归一化、残差结构支持下才能兑现。<\/p>\n<h3>对抗性追问：激活能不能换成任意非线性<\/h3>\n<p>可导、逐元素、至少局部有正梯度是基本要求；恒等激活退化为线性堆叠，饱和型激活在深层压制梯度。激活选择还要配合归一化与初始化，不是随便挑一个非线性即可。<\/p>\n<h2>补充推演与第二算例<\/h2>\n<h3>第二算例：一维输入上的分段线性<\/h3>\n<p>单隐层两个 ReLU 单元，<span class=\"katex-inline\">u_1=x-0.5<\/span>，<span class=\"katex-inline\">u_2=x-1.5<\/span>，<span class=\"katex-inline\">h_1=\\max(0,u_1)<\/span>，<span class=\"katex-inline\">h_2=\\max(0,u_2)<\/span>，输出 <span class=\"katex-inline\">\\hat y=h_1-2h_2<\/span>。 分段结果：<span class=\"katex-inline\">x&lt;0.5<\/span> 两段断开，<span class=\"katex-inline\">\\hat y=0<\/span>；<span class=\"katex-inline\">0.5\\le x&lt;1.5<\/span> 仅 <span class=\"katex-inline\">h_1<\/span> 接通，<span class=\"katex-inline\">\\hat y=x-0.5<\/span>；<span class=\"katex-inline\">x\\ge1.5<\/span> 两段都接通，<span class=\"katex-inline\">\\hat y=(x-0.5)-2(x-1.5)=2.5-x<\/span>。整条输出由三段直线拼成。对照无激活两层线性网络，输出恒为一条直线，两段拐点不会出现。<\/p>\n<h3>激活可微性与拐角次梯度<\/h3>\n<p>训练用梯度下降，激活需要在几乎处处可导；ReLU 在 0 点不可导，实践中该点导数取 0 或 1 作为次梯度处理。sigmoid、tanh 处处可导但两端饱和；ReLU 拐角处的次梯度选择不影响正向分段结构。激活不必全局光滑，可导且局部有正梯度即可。<\/p>\n<h3>宽度与深度的函数类差别<\/h3>\n<p>宽单层靠大量半平面单元直接覆盖输入空间；深层靠下层组合局部模式、上层组合部件。同一函数两类结构都能逼近，深而窄的层级特征复用减少参数总量，但要承担深度叠加的优化困难。选深度还是宽度，受数据量、算力与任务模式复杂度约束。<\/p>\n<h3>代码片段：去掉激活后的合并对照<\/h3>\n<pre class=\"lang-python\"><code>import torch\nfrom torch import nn\nnet_relu = nn.Sequential(nn.Linear(2, 4), nn.ReLU(), nn.Linear(4, 2))\nnet_lin = nn.Sequential(nn.Linear(2, 4), nn.Linear(4, 2))\nx = torch.randn(3, 2)\n# net_lin 两层权重可合并为单层 Linear；net_relu 因 ReLU 打断可合并性\nW = net_lin[1].weight @ net_lin[0].weight\nb = net_lin[1].bias + net_lin[1].weight @ net_lin[0].bias\nprint(W.shape, b.shape)   # (2, 2) 单层权重与偏置<\/code><\/pre>\n<h3>对抗性追问：激活换成恒等函数会发生什么<\/h3>\n<p>恒等映射 <span class=\"katex-inline\">\\phi(u)=u<\/span> 代入复合式，<span class=\"katex-inline\">W_2\\phi(W_1x+b_1)+b_2=W_2W_1x+W_2b_1+b_2<\/span>，退化为单层仿射。任何可写成线性函数的激活都不扩大函数类；判断一个激活是否有效，先看它能否被矩阵线性表示。<\/p>\n<h3>第二轮补充<\/h3>\n<h3>第二算例：两层 ReLU 网络的参数量<\/h3>\n<p>输入 2、隐层 4、输出 2：第一层 <span class=\"katex-inline\">2\\times4+4=12<\/span> 参数，第二层 <span class=\"katex-inline\">4\\times2+2=10<\/span>，共 22。去掉激活仍为两层 Linear，数学等价单层 <span class=\"katex-inline\">2\\times2<\/span> 矩阵加偏置，单层参数 <span class=\"katex-inline\">2\\times2+2=6<\/span>；多出来的 16 个参数在纯线性网络里被矩阵乘积吸收，不扩大表示能力。<\/p>\n<h3>激活在反向中的角色<\/h3>\n<p>反向时激活导数与上游梯度相乘：ReLU 正区间传 1，负区间传 0；sigmoid/tanh 传 <span class=\"katex-inline\">\\sigma(1-\\sigma)<\/span> 或 <span class=\"katex-inline\">1-\\tanh^2<\/span>。激活同时决定前向分段形状与反向梯度通路，不是只在前向起作用。<\/p>\n<h3>对抗性追问：深网络能不能靠堆叠线性层加数据增广获得非线性<\/h3>\n<p>数据增广改变输入分布，不改变模型函数类；纯线性堆叠对线性可分问题够用，对异或类非线性边界仍不可分。非线性来自模型内的逐元素变换，不能由输入端处理替代。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n两层无激活网络怎样合并成单层？（<span class=\"katex-inline\">W&#x27;=W_2W_1<\/span>，<span class=\"katex-inline\">\\mathbf b&#x27;=W_2\\mathbf b_1+\\mathbf b_2<\/span>。）\n<\/li><li>\n激活函数为什么打断矩阵可合并性？（逐元素非线性作用在仿射结果上，后续权重无法回卷进上游权重。）\n<\/li><li>\nReLU 相比 sigmoid 在深层的梯度优势是什么？（正区间导数恒 1，不出现两端饱和压平梯度。）\n<\/li><li>\n死亡 ReLU 的表现与诱因是什么？（单元恒输出 0、梯度恒 0；长期负输入、过大学习率或负偏置诱发。）\n<\/li><li>\n万能逼近定理说的是宽单层还是深层？（宽度足够的单隐层可逼近连续函数；实践中深而不太宽的结构参数效率更高。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "多层感知机与非线性激活：为什么线性堆叠会退化"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.157<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">多层感知机与非线性激活：为什么线性堆叠会退化<\/a><\/span><\/div><h1>过拟合、权重衰减与 dropout：三种正则化的机制差别<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书 4.4 模型选择/欠拟合/过拟合、4.5 权重衰减、4.6 暂退法，PDF 第 157、167、174 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>模型在训练数据上误差很低，一换没见过的数据就明显变差，这是过拟合：模型把训练集里的噪声波动也学了进去。泛化差距来自模型复杂度相对数据量过高。控制复杂度有三类常用手段：约束权重范数（权重衰减）、训练时随机丢弃单元（dropout）、以及把初始化与归一化作为稳定性配套。三者作用位置不同：权重衰减改损失函数，dropout 改前向传播的采样方式，不能互相替代。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>训练误差与泛化误差<\/strong>：训练误差是训练集上的平均损失；泛化误差是未知数据上的预期损失。模型容量不足导致欠拟合（两者都高），容量过高导致过拟合（训练低、测试高）（原书 4.4.1 节，PDF 第 157 页前后）。<\/p>\n<p><strong>权重衰减（L2 正则化）<\/strong>：在损失后加权重范数平方项 <span class=\"katex-inline\">\\frac{\\lambda}{2}\\sum_j w_j^2<\/span>。<span class=\"katex-inline\">\\lambda<\/span> 是衰减超参数，越大权重被压得越紧。加入后梯度为 <span class=\"katex-inline\">\\nabla L+\\lambda\\mathbf w<\/span>，更新式带乘性衰减因子（原书 4.5 节，PDF 第 167 页）。<\/p>\n<p><strong>暂退法（dropout）<\/strong>：训练前向时，按概率 <span class=\"katex-inline\">p<\/span> 把当前层激活置零，保留值按 <span class=\"katex-inline\">1-p<\/span> 缩放；单次迭代相当于采样一个子网络。推理时关闭丢弃，用完整网络做确定性预测（原书 4.6.3 节，PDF 第 177 页前后）。<\/p>\n<p><strong>模型选择<\/strong>：用验证集比较超参数与模型结构，K 折交叉验证把数据轮流切分，避免测试集参与调参（原书 4.4.2、4.10.6 节，PDF 第 158、186 页前后）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>权重衰减推导：带正则损失 <span class=\"katex-inline\">\\tilde L(\\mathbf w)=L(\\mathbf w)+\\frac{\\lambda}{2}\\mathbf w^\\top\\mathbf w<\/span>。梯度 <span class=\"katex-inline\">\\nabla_{\\mathbf w}\\tilde L=\\nabla L+\\lambda\\mathbf w<\/span>。梯度下降更新<\/p>\n<div class=\"katex-block\">\\mathbf w\\leftarrow\\mathbf w-\\eta(\\nabla L+\\lambda\\mathbf w)=(1-\\eta\\lambda)\\mathbf w-\\eta\\nabla L.<\/div>\n<p>每步权重先乘小于 1 的因子 <span class=\"katex-inline\">(1-\\eta\\lambda)<\/span>，再沿损失梯度移动。权重范数被持续压缩，决策边界在噪声方向上摆动幅度受限。<\/p>\n<p>dropout 无偏性：激活 <span class=\"katex-inline\">h<\/span> 以概率 <span class=\"katex-inline\">p<\/span> 置零，以概率 <span class=\"katex-inline\">1-p<\/span> 取 <span class=\"katex-inline\">h/(1-p)<\/span>。期望<\/p>\n<div class=\"katex-block\">E[h']=(1-p)\\cdot\\frac{h}{1-p}+p\\cdot0=h.<\/div>\n<p>缩放因子 <span class=\"katex-inline\">1/(1-p)<\/span> 保证丢弃后期望值不变，训练与推理的激活尺度对齐。<\/p>\n<p>数值对照：高维线性回归中，无衰减时噪声特征权重被练得很大去贴合训练波动；加衰减后这些方向权重受范数约束，训练损失略升，测试损失下降。dropout 采样使输出不能过度依赖任何单个隐单元，单元间共适应性被破坏（原书 4.6.2 节，PDF 第 175 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：权重衰减适合线性模型与全连接层；dropout 适合隐层激活，概率 <span class=\"katex-inline\">p<\/span> 常在 0.1–0.5 区间按验证集选择。\n<\/li><li>\n失败案例一：衰减系数 <span class=\"katex-inline\">\\lambda<\/span> 过大。权重被压到接近 0，模型退化为近似常数输出，训练误差与测试误差同时偏高，落入欠拟合。\n<\/li><li>\n失败案例二：dropout 概率过高。每轮保留的单元太少，子网络容量不足，训练收敛慢；推理却用完整网络，两者分布差距拉大。\n<\/li><li>\n失败案例三：推理阶段忘记切 eval 模式。测试样本仍经过随机丢弃，输出带额外噪声，评估指标不稳；BN 层在同样问题上误用批量统计量（概念 c10）。\n<\/li><li>\n失败案例四：用训练集选超参数。验证集与训练集同源偏差被忽略，测试集表现被高估；必须留出验证集或做交叉验证。\n<\/li><li>\n边界：正则化不能补充缺失的信号；数据量极小或标签噪声严重时，再强的正则也无法恢复泛化能力。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>权重衰减 vs dropout<\/strong>：衰减在损失与梯度层面压缩参数范数，作用于训练全程；dropout在前向层间随机采样子网络，破坏单元共适应。前者约束参数大小，后者约束单元间依赖路径。\n<\/li><li>\n<strong>正则化 vs 早停<\/strong>：早停在验证损失回升时终止训练，限制更新轮次；正则化在目标函数或前向过程中约束复杂度。两者可叠加。\n<\/li><li>\n<strong>dropout vs 随机噪声注入<\/strong>：Bishop 证明带输入噪声训练等价于 Tikhonov 正则化；dropout 把同类思路搬到内部层，逐轮采样扰动隐表示（原书 4.6.2 节，PDF 第 175 页）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c05 的 MLP 结构是 dropout 的作用载体；概念 c03 的损失梯度更新叠加衰减项。后继：概念 c07 的初始化解决对称打破与梯度尺度，概念 c10 的 BN 也带轻度正则效应；优化算法（概念 c14）的更新规则都可叠加权重衰减。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（过拟合、权重衰减与 dropout：三种正则化的机制差别）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：衰减更新式、dropout 无偏性与泛化差距算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要分清三种正则化手段的机制，先往回追四层前提：<\/p>\n<ol><li>\n过拟合表现为训练误差低、泛化误差高，根因是模型容量相对数据量过高。先分清欠拟合、恰好拟合、过拟合三种误差组合。\n<\/li><li>\n约束复杂度可从参数规模入手：权重衰减在目标函数加范数惩罚，把权重往小压。推导要写清惩罚项对梯度与更新式的影响。\n<\/li><li>\n约束复杂度也可从前向采样入手：dropout 每轮随机丢单元，迫使网络不依赖单一单元。无偏性要求缩放后期望与完整网络一致。\n<\/li><li>\n正则化手段各有作用位置：损失层、前向层间、初始化/归一化层；位置不同决定了不能互相替代。\n<\/ol>\n<p>依赖链方向：误差分解 → 权重范数惩罚进入损失 → 梯度与更新式带衰减因子 → dropout 随机采样并保证期望无偏 → 验证集/交叉验证选择强度。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：权重衰减进入损失<\/h3>\n<p>原损失 <span class=\"katex-inline\">L(\\mathbf w)<\/span>，加 L2 惩罚 <span class=\"katex-inline\">R(\\mathbf w)=\\frac{\\lambda}{2}\\sum_j w_j^2=\\frac{\\lambda}{2}\\mathbf w^\\top\\mathbf w<\/span>。 正则损失 <span class=\"katex-inline\">\\tilde L=L+R<\/span>。对单个权重 <span class=\"katex-inline\">w_j<\/span> 求偏导：<\/p>\n<div class=\"katex-block\">\\frac{\\partial \\tilde L}{\\partial w_j}=\\frac{\\partial L}{\\partial w_j}+\\lambda w_j.<\/div>\n<p>向量形式 <span class=\"katex-inline\">\\nabla_{\\mathbf w}\\tilde L=\\nabla L+\\lambda\\mathbf w<\/span>。<\/p>\n<h3>第二步：衰减更新式展开<\/h3>\n<p>梯度下降更新：<\/p>\n<div class=\"katex-block\">=(1-\\eta\\lambda)w_j-\\eta\\frac{\\partial L}{\\partial w_j}.<\/div>\n<p>第一项是乘性收缩，第二项是沿损失面下降。固定学习率 <span class=\"katex-inline\">\\eta<\/span> 下，<span class=\"katex-inline\">\\eta\\lambda<\/span> 越大收缩越快；若 <span class=\"katex-inline\">\\eta\\lambda\\ge1<\/span>，权重在纯衰减方向被压到 0 甚至反向震荡，因此衰减强度要与学习率配套看。<\/p>\n<h3>第三步：dropout 采样与缩放<\/h3>\n<p>隐激活 <span class=\"katex-inline\">h<\/span>，丢弃概率 <span class=\"katex-inline\">p<\/span>：<span class=\"katex-inline\">h&#x27;=0<\/span>（概率 <span class=\"katex-inline\">p<\/span>），<span class=\"katex-inline\">h&#x27;=h/(1-p)<\/span>（概率 <span class=\"katex-inline\">1-p<\/span>）。期望<\/p>\n<div class=\"katex-block\">E[h']=p\\cdot0+(1-p)\\cdot\\frac{h}{1-p}=h.<\/div>\n<p>方差 <span class=\"katex-inline\">\\mathrm{Var}(h&#x27;)=(1-p)\\left(\\frac{h}{1-p}\\right)^2-h^2=\\frac{p}{1-p}h^2<\/span>，引入扰动但均值不变。推理时不丢弃，直接用 <span class=\"katex-inline\">h<\/span>，与训练期望对齐。<\/p>\n<h3>第四步：泛化的偏差—方差视角<\/h3>\n<p>模型误差可拆为偏差（容量不足导致的系统性偏离）与方差（对训练集波动的敏感程度）。欠拟合对应高偏差，过拟合对应高方差。权重衰减压低参数摆动幅度，dropout 降低单元间依赖，两者都在削方差；强度过头则把偏差抬上来。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：衰减对权重序列的影响<\/h3>\n<p>一维回归，损失面 <span class=\"katex-inline\">L(w)=w^2/2<\/span>，梯度 <span class=\"katex-inline\">w<\/span>。学习率 <span class=\"katex-inline\">\\eta=0.1<\/span>，初始 <span class=\"katex-inline\">w_0=5<\/span>。 无衰减：<span class=\"katex-inline\">w_{t+1}=(1-0.1)w_t=0.9w_t<\/span>，序列 5, 4.5, 4.05, 3.645, 3.2805。 加衰减 <span class=\"katex-inline\">\\lambda=0.2<\/span>：更新因子 <span class=\"katex-inline\">1-\\eta\\lambda=0.98<\/span>，<span class=\"katex-inline\">w_{t+1}=0.98w_t-0.1w_t=0.88w_t<\/span>，序列 5, 4.4, 3.872, 3.407, 2.998。衰减使权重收缩更快，长期范数更小。<\/p>\n<h3>算例 2：dropout 单次采样数值<\/h3>\n<p>隐层 5 个单元激活 <span class=\"katex-inline\">\\mathbf h=(1.0,0.8,1.2,0.6,0.9)<\/span>，<span class=\"katex-inline\">p=0.5<\/span>。伯努利采样掩码 <span class=\"katex-inline\">m=(1,0,1,1,0)<\/span>（保留第 1、3、4 单元）。缩放后 <span class=\"katex-inline\">\\mathbf h&#x27;=\\mathbf h\\odot m/(1-p)=(2.0,0,2.4,1.2,0)<\/span>。 期望核对：每个单元 <span class=\"katex-inline\">E[h_i&#x27;]=h_i<\/span>；本次采样均值 <span class=\"katex-inline\">(2.0+0+2.4+1.2+0)/5=1.12<\/span>，完整网络均值 <span class=\"katex-inline\">(1.0+0.8+1.2+0.6+0.9)/5=0.9<\/span>，单次样本有偏，多轮平均后接近期望。<\/p>\n<h3>算例 3：高维线性回归的泛化差距对照<\/h3>\n<p>设真实关系只依赖 2 个特征，另有 18 个噪声特征。无衰减训练时，噪声特征权重被调大贴合训练集波动：训练损失低，测试损失随噪声权重增大而回升。加 <span class=\"katex-inline\">\\lambda<\/span> 后，噪声方向权重受范数约束，训练损失略升，测试损失下降；<span class=\"katex-inline\">\\lambda<\/span> 继续增大，所有权重被压小，两类误差同时走高。拐点由验证集选定。<\/p>\n<h2>延伸推演<\/h2>\n<h3>dropout 破坏的是什么适应性<\/h3>\n<p>原书 4.6.2 节指出，深层过拟合常伴随层间“共适应性”：某个单元的输出只有配合特定上游单元才有用。dropout 每轮去掉不同单元，使路径不能绑定固定搭档，特征必须在多条随机子路径上都有效（原书 PDF 第 175 页）。<\/p>\n<h3>批量归一化的附带正则效应<\/h3>\n<p>BN 用小批量统计量标准化激活，批量均值方差带来噪声扰动；原书 7.5.2 节提到优化中的噪声源常带来更快训练与轻度正则效果（PDF 第 287 页）。这是附带效应，不能替代显式正则化；批量大小在 BN 网络里比无 BN 时更关键。<\/p>\n<h3>验证集与交叉验证怎么选强度<\/h3>\n<p>权重衰减 <span class=\"katex-inline\">\\lambda<\/span>、dropout 概率 <span class=\"katex-inline\">p<\/span> 都在验证集上比较；数据少时用 K 折交叉验证：轮流把一份做验证、其余训练，取平均表现选超参。测试集只在最终评估时碰一次，不参与调参。<\/p>\n<h3>对抗性追问：正则化越强越好吗<\/h3>\n<p>不是。正则削方差但抬偏差：强度越过拐点后，模型连训练集规律都拟合不动，两类误差同步上升。正则化强度是偏差—方差权衡的连续旋钮，不是越大越稳妥。<\/p>\n<h3>对抗性追问：dropout 能代替权重衰减吗<\/h3>\n<p>不能。dropout 约束单元间路径依赖，不改参数范数；权重衰减直接压参数大小。宽层、特征冗余场景两者常叠加使用，作用层与数学形式都不同。<\/p>\n<h2>补充推演与第二算例<\/h2>\n<h3>第二算例：dropout 概率对扰动的影响<\/h3>\n<p>保留概率 <span class=\"katex-inline\">1-p<\/span>，缩放因子 <span class=\"katex-inline\">1/(1-p)<\/span>。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><span class=\"katex-inline\">p<\/span><\/th><th>缩放因子<\/th><th>单元输出方差因子 <span class=\"katex-inline\">p/(1-p)<\/span><\/th><\/tr><\/thead><tbody><tr><td>0.1<\/td><td>1.111<\/td><td>0.111<\/td><\/tr><tr><td>0.5<\/td><td>2.000<\/td><td>1.000<\/td><\/tr><tr><td>0.9<\/td><td>10.000<\/td><td>9.000<\/td><\/tr><\/tbody><\/table><\/div>\n<p><span class=\"katex-inline\">p<\/span> 越大单次采样扰动越强，保留单元被放大得越多；期望仍等于原值，但方差升高。<span class=\"katex-inline\">p<\/span> 过高时多数单元被丢弃，单次前向网络容量被削得太薄，训练欠拟合。<\/p>\n<h3>L1 与 L2 惩罚的几何差别<\/h3>\n<p>L2 惩罚 <span class=\"katex-inline\">\\frac\\lambda2\\sum w_j^2<\/span> 约束权重范数球，解各分量按梯度比例缩小；L1 惩罚 <span class=\"katex-inline\">\\lambda\\sum|w_j|<\/span> 约束菱形区域，解在坐标轴上出现零分量，产生稀疏权重。权重衰减在深度学习中默认指 L2；需要稀疏特征选择时才引入 L1 类惩罚。两类惩罚改变的是权重分布形状，不直接削减激活噪声。<\/p>\n<h3>解耦权重衰减与优化器耦合<\/h3>\n<p>Adam 等自适应优化器里，把权重衰减写成损失惩罚项会让衰减步长被二阶矩缩放，与 SGD 下的 L2 衰减行为不一致；解耦衰减（如 AdamW）在更新式里单独乘收缩因子，不经过自适应尺度。实践中在 Adam 类优化器上做权重衰减时，要确认框架用的是耦合还是解耦实现。<\/p>\n<h3>早停与正则化的对应<\/h3>\n<p>训练中验证损失先降后升，回升阶段对应模型开始贴合训练集噪声；在拐点停止训练，等效于在权重未到达高范数区域前截断迭代。早停是时间维度上的正则化，与范数惩罚、采样丢弃作用位置不同，但都把复杂度约束在泛化更好的区间。<\/p>\n<h3>代码片段：权重衰减与 dropout 切换<\/h3>\n<pre class=\"lang-python\"><code>import torch\nfrom torch import nn\nnet = nn.Sequential(nn.Linear(16, 32), nn.ReLU(), nn.Dropout(0.5), nn.Linear(32, 10))\nopt = torch.optim.SGD(net.parameters(), lr=0.1, weight_decay=1e-4)\nnet.train()    # dropout 生效\n# 评估前：net.eval()，dropout 关闭，BN 切到移动平均<\/code><\/pre>\n<h3>对抗性追问：数据增强算不算正则化<\/h3>\n<p>数据增强在输入侧扩充有效样本分布，降低模型对固定样本位置与形态的依赖；它缓解的是数据量不足导致的过拟合，与在参数或激活上加约束的手段不同。增强强度过头会改变样本分布，把真实规律也抹掉。<\/p>\n<h3>第二轮补充<\/h3>\n<h3>第二算例：权重衰减对两条特征方向的差别<\/h3>\n<p>真实信号方向权重 <span class=\"katex-inline\">w_1<\/span> 与噪声方向 <span class=\"katex-inline\">w_2<\/span>。无衰减时 <span class=\"katex-inline\">w_2<\/span> 被训练集噪声调大；加 <span class=\"katex-inline\">\\lambda<\/span> 后两类权重都乘 <span class=\"katex-inline\">(1-\\eta\\lambda)<\/span>，噪声方向因信号弱、收缩占比更高，<span class=\"katex-inline\">w_2<\/span> 先压到小值。<span class=\"katex-inline\">\\lambda<\/span> 过大时信号方向也被压小，训练误差上升。<\/p>\n<h3>dropout 期望无偏性的批量视角<\/h3>\n<p>单次采样是完整网络的一个子网络；训练多轮相当于在指数级子网络上做平均，推理用完整网络近似这个集成。子网络共享参数，不像独立集成那样训练多套模型；集成效果来自采样扰动，不是显式多模型。<\/p>\n<h3>正则化强度的验证选择<\/h3>\n<p><span class=\"katex-inline\">\\lambda<\/span>、<span class=\"katex-inline\">p<\/span> 构成二维超参网格，每组配置在验证集比较泛化损失；数据量小时交叉验证折数取高。测试集只在最终模型上评估一次，不参与强度选择。<\/p>\n<h3>对抗性追问：训练损失上升是不是一定正则过头<\/h3>\n<p>训练损失上升也可能由学习率过大、梯度爆炸、数据标签噪声引起；对照验证损失曲线判断：训练验证同步偏高是欠拟合或优化问题，训练低验证高才指向正则不足或过拟合。<\/p>\n<h3>第三轮补充<\/h3>\n<h3>第三算例：正则强度在验证曲线上的位置<\/h3>\n<p>横轴 <span class=\"katex-inline\">\\log\\lambda<\/span> 从左到右增大：左端欠拟合（训练验证都高），中段训练低验证也低，右端过正则（训练验证同步回升）。拐点选在验证损失最低点；dropout <span class=\"katex-inline\">p<\/span> 与 <span class=\"katex-inline\">\\lambda<\/span> 同向作用，两者同时调大时偏差叠加，网格搜索要错开强度范围。<\/p>\n<h3>辨析补充：参数范数与激活稀疏<\/h3>\n<p>权重衰减约束参数空间范数，不直接让激活稀疏；dropout 扰动激活但不约束参数大小。需要激活稀疏时靠激活侧惩罚或专用结构，不要把范数惩罚当成稀疏化手段。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n带 L2 惩罚的更新式是什么？（<span class=\"katex-inline\">w_j\\leftarrow(1-\\eta\\lambda)w_j-\\eta\\,\\partial L/\\partial w_j<\/span>。）\n<\/li><li>\ndropout 缩放因子为什么是 <span class=\"katex-inline\">1/(1-p)<\/span>？（保证 <span class=\"katex-inline\">E[h&#x27;]=h<\/span>，训练推理激活尺度对齐。）\n<\/li><li>\n过拟合与欠拟合各自对应高偏差还是高方差？（过拟合高方差，欠拟合高偏差。）\n<\/li><li>\n推理阶段开启 dropout 会造成什么？（测试输出带随机丢弃噪声，指标不稳，应切 eval 模式。）\n<\/li><li>\n超参数强度为什么要在验证集而非训练集上选？（训练集选参会把训练波动也纳入选择，高估泛化表现。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "过拟合、权重衰减与 dropout：三种正则化的机制差别"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.184<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">多层感知机与非线性激活：为什么线性堆叠会退化<\/a><\/span><\/div><h1>数值稳定性与参数初始化：梯度消失/爆炸的来源与 Xavier 初始化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2 章（原书 4.8 数值稳定性和模型初始化，PDF 第 184–187 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>深层网络训练时两类数值问题反复出现：梯度消失——参数更新几乎不动，模型学不到东西；梯度爆炸——更新幅度过大，破坏已经收敛的状态。两类问题的数学根源都是梯度沿层连乘，初始权重尺度与激活饱和方式决定连乘结果往哪头偏。此外，初始权重若全取相同常数，同一层各单元前向相同、反向梯度相同，梯度下降后仍保持一致，对称性无法打破，网络实际退化成单个单元。初始化方案就是在训练开始前把激活与梯度的尺度控制住，并打破参数对称。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>深层网络的梯度结构<\/strong>：<span class=\"katex-inline\">L<\/span> 层网络，<span class=\"katex-inline\">h^{(0)}=x<\/span>，<span class=\"katex-inline\">h^{(l)}=f_l(h^{(l-1)})<\/span>。损失对第 <span class=\"katex-inline\">l<\/span> 层权重的梯度为一串雅可比矩阵连乘（原书公式 4.8.2，PDF 第 184 页）：<\/p>\n<div class=\"katex-block\">\\frac{\\partial o}{\\partial W^{(l)}}=M^{(L)}\\cdots M^{(l+1)}\\,v^{(l)}.<\/div>\n<p><span class=\"katex-inline\">M^{(r)}=\\partial h^{(r)}/\\partial h^{(r-1)}<\/span> 是层间雅可比，<span class=\"katex-inline\">v^{(l)}<\/span> 是本地梯度项。<\/p>\n<p><strong>梯度消失<\/strong>：连乘因子长期小于 1，乘积随层数趋近 0，浅层权重更新微弱。sigmoid 在两端饱和时导数趋近 0，是常见诱因（原书 4.8.1 节，PDF 第 184–185 页）。<\/p>\n<p><strong>梯度爆炸<\/strong>：连乘因子长期大于 1，乘积指数放大，参数更新破坏收敛。初始权重尺度偏大时容易出现（原书 4.8.1 节，PDF 第 185 页）。<\/p>\n<p><strong>打破对称性<\/strong>：同一隐层单元若初始参数相同，前向激活相同、反向梯度相同，迭代后仍一致；随机初始化让各单元走上不同响应方向（原书 4.8.1 节，PDF 第 186 页）。<\/p>\n<p><strong>Xavier 初始化<\/strong>：权重零均值、方差 <span class=\"katex-inline\">\\sigma^2=2/(n_{in}+n_{out})<\/span> 的高斯采样；改均匀分布时取 <span class=\"katex-inline\">U(-\\sqrt{6/(n_{in}+n_{out})},\\sqrt{6/(n_{in}+n_{out})})<\/span>（原书 4.8.2 节，PDF 第 187 页）。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>先推前向方差。单层输出 <span class=\"katex-inline\">o_i=\\sum_{j=1}^{n_{in}}w_{ij}x_j<\/span>，<span class=\"katex-inline\">w_{ij}<\/span> 零均值方差 <span class=\"katex-inline\">\\sigma^2<\/span>，<span class=\"katex-inline\">x_j<\/span> 零均值方差 <span class=\"katex-inline\">\\gamma^2<\/span>，且彼此独立。独立乘积期望可拆：<span class=\"katex-inline\">E[w_{ij}x_j]=E[w_{ij}]E[x_j]=0<\/span>。方差<\/p>\n<div class=\"katex-block\">\\mathrm{Var}(o_i)=\\sum_j E[w_{ij}^2x_j^2]=\\sum_j E[w_{ij}^2]E[x_j^2]=n_{in}\\sigma^2\\gamma^2.<\/div>\n<p>要保持前向方差不放大，取 <span class=\"katex-inline\">n_{in}\\sigma^2=1<\/span>。<\/p>\n<p>反向传播面临对称问题：梯度从输出侧传回，要保持梯度方差不放大，需 <span class=\"katex-inline\">n_{out}\\sigma^2=1<\/span>。两个条件不能同时满足，折中取两者平均：<\/p>\n<div class=\"katex-block\">\\frac{n_{in}+n_{out}}{2}\\sigma^2=1\\quad\\Longrightarrow\\quad\\sigma^2=\\frac{2}{n_{in}+n_{out}}.<\/div>\n<p>均匀分布 <span class=\"katex-inline\">U(-a,a)<\/span> 的方差为 <span class=\"katex-inline\">a^2/3<\/span>，代入得 <span class=\"katex-inline\">a=\\sqrt{6/(n_{in}+n_{out})}<\/span>。<\/p>\n<p>数值对照：原书生成 100 个 <span class=\"katex-inline\">4\\times4<\/span> 高斯随机矩阵连乘，<span class=\"katex-inline\">\\sigma^2=1<\/span> 尺度下结果放大到 <span class=\"katex-inline\">10^{26}<\/span> 量级（PDF 第 185–186 页），这是爆炸的矩阵版本；sigmoid 在 <span class=\"katex-inline\">|x|<\/span> 很大时导数趋近 0，多层后梯度压到接近消失。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：Xavier 推导假设激活处无非线性、输入与权重独立同分布；深层实践中假设被违反，但该初始化仍是有效基线。\n<\/li><li>\n失败案例一：sigmoid/tanh 放深层使用。两端饱和区导数趋近 0，反向连乘后浅层梯度消失；深度网络默认 ReLU 系激活。\n<\/li><li>\n失败案例二：初始权重全 0 或全常数。对称性不被打破，隐单元行为重合，模型容量没释放；dropout 可以辅助打破对称，但不能替代随机初始化。\n<\/li><li>\n失败案例三：权重初始尺度偏大。前向激活与梯度连乘后放大，出现爆炸型更新，损失面震荡发散。\n<\/li><li>\n边界：初始化只决定起点，训练过程中的尺度漂移要靠归一化层（概念 c10）与合理学习率控制；初始化不能修正架构缺陷。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>梯度消失 vs 梯度爆炸<\/strong>：消失是连乘因子过小、浅层不更新；爆炸是因子过大、更新破坏收敛。前者常见于饱和激活，后者常见于初始尺度过大或深层无约束连乘。\n<\/li><li>\n<strong>初始化 vs 批量归一化<\/strong>：初始化把起点尺度控制在合理范围；BN 在训练每层重新校准激活分布。两者配套，初始化不替代运行时归一化。\n<\/li><li>\n<strong>随机初始化 vs 确定性初始化<\/strong>：确定性常数初始化保对称，随机采样破对称；Xavier 类方法同时决定分布尺度与采样随机性。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c05 的 MLP 分层结构是连乘链条的载体；概念 c02 的反向模式给出梯度计算路径。后继：概念 c10 的批量归一化解决训练中途的尺度漂移；循环网络的 BPTT 长链（概念 c11）是时间维度上的同类连乘问题。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（数值稳定性与参数初始化：梯度消失/爆炸的来源与 Xavier 初始化）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：梯度连乘结构、前向/反向方差平衡与初始化算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要讲清初始化为什么这样取方差，先往回追四层前提：<\/p>\n<ol><li>\n深层梯度是层间雅可比的连乘。先写出损失对任一层权重的梯度分解，定位消失与爆炸各自出现在哪一段乘积。\n<\/li><li>\n前向激活方差由输入方差与权重方差共同决定。独立乘积的期望与方差可拆，这是方差公式的推导基础。\n<\/li><li>\n反向梯度面对同一问题，只是维度换成输出单元数 <span class=\"katex-inline\">n_{out}<\/span>。两个方向的方差条件要分别列出。\n<\/li><li>\n两条件不能同时满足时取折中，得到 Xavier 方差；均匀分布再由方差反推取值区间。\n<\/ol>\n<p>依赖链方向：梯度连乘分解 → 前向方差 <span class=\"katex-inline\">n_{in}\\sigma^2\\gamma^2<\/span> → 反向方差 <span class=\"katex-inline\">n_{out}\\sigma^2<\/span> → 折中 <span class=\"katex-inline\">\\sigma^2=2/(n_{in}+n_{out})<\/span> → 均匀分布区间换算。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：写出深层梯度的连乘形式<\/h3>\n<p><span class=\"katex-inline\">h^{(0)}=x<\/span>，<span class=\"katex-inline\">h^{(l)}=f_l(h^{(l-1)})<\/span>，输出 <span class=\"katex-inline\">o=f_L(\\cdots f_1(x))<\/span>。令<\/p>\n<div class=\"katex-block\">M^{(r)}=\\frac{\\partial h^{(r)}}{\\partial h^{(r-1)}},\\qquad v^{(l)}=\\frac{\\partial h^{(l)}}{\\partial W^{(l)}}.<\/div>\n<p>按链式法则，损失对 <span class=\"katex-inline\">W^{(l)}<\/span> 的梯度<\/p>\n<div class=\"katex-block\">\\frac{\\partial o}{\\partial W^{(l)}}=M^{(L)}M^{(L-1)}\\cdots M^{(l+1)}v^{(l)}.<\/div>\n<p>从 <span class=\"katex-inline\">l+1<\/span> 到 <span class=\"katex-inline\">L<\/span> 共 <span class=\"katex-inline\">L-l<\/span> 个雅可比相乘。每个 <span class=\"katex-inline\">M^{(r)}<\/span> 的特征值若长期小于 1，乘积指数衰减；长期大于 1，乘积指数放大。这是消失与爆炸的共同结构来源。<\/p>\n<h3>第二步：前向方差推导<\/h3>\n<p>单层 <span class=\"katex-inline\">o_i=\\sum_{j=1}^{n_{in}}w_{ij}x_j<\/span>。假设 <span class=\"katex-inline\">w_{ij}<\/span> 与 <span class=\"katex-inline\">x_j<\/span> 独立，<span class=\"katex-inline\">E[w_{ij}]=0<\/span>，<span class=\"katex-inline\">\\mathrm{Var}(w_{ij})=\\sigma^2<\/span>，<span class=\"katex-inline\">E[x_j]=0<\/span>，<span class=\"katex-inline\">\\mathrm{Var}(x_j)=\\gamma^2<\/span>。 <span class=\"katex-inline\">E[w_{ij}x_j]=E[w_{ij}]E[x_j]=0<\/span>。 二阶矩 <span class=\"katex-inline\">E[w_{ij}^2x_j^2]=E[w_{ij}^2]E[x_j^2]=\\sigma^2\\gamma^2<\/span>。 各 <span class=\"katex-inline\">j<\/span> 独立，和的方差可加：<\/p>\n<div class=\"katex-block\">\\mathrm{Var}(o_i)=\\sum_{j=1}^{n_{in}}\\sigma^2\\gamma^2=n_{in}\\sigma^2\\gamma^2.<\/div>\n<p>保持前向方差不随层数放大，要求 <span class=\"katex-inline\">n_{in}\\sigma^2=1<\/span>。<\/p>\n<h3>第三步：反向方差的对称推导<\/h3>\n<p>梯度从输出层往回传，对权重 <span class=\"katex-inline\">w_{ij}<\/span> 的梯度含下游雅可比连乘与本地项。沿与前向相同的推理，要保持梯度方差不放大，要求 <span class=\"katex-inline\">n_{out}\\sigma^2=1<\/span>，<span class=\"katex-inline\">n_{out}<\/span> 是该层输出单元数。<\/p>\n<h3>第四步：折中与分布换算<\/h3>\n<p>前向条件 <span class=\"katex-inline\">n_{in}\\sigma^2=1<\/span> 与反向条件 <span class=\"katex-inline\">n_{out}\\sigma^2=1<\/span> 一般不能同时成立。折中令<\/p>\n<div class=\"katex-block\">\\frac{n_{in}+n_{out}}{2}\\sigma^2=1\\quad\\Rightarrow\\quad\\sigma^2=\\frac{2}{n_{in}+n_{out}}.<\/div>\n<p>高斯分布直接按此方差采样。若用均匀分布 <span class=\"katex-inline\">U(-a,a)<\/span>，其方差为 <span class=\"katex-inline\">a^2/3<\/span>；令 <span class=\"katex-inline\">a^2/3=2/(n_{in}+n_{out})<\/span>，得<\/p>\n<div class=\"katex-block\">a=\\sqrt{\\frac{6}{n_{in}+n_{out}}},\\qquad W\\sim U\\left(-\\sqrt{\\frac{6}{n_{in}+n_{out}}},\\sqrt{\\frac{6}{n_{in}+n_{out}}}\\right).<\/div>\n<h2>数值算例<\/h2>\n<h3>算例 1：高斯矩阵连乘的爆炸量级<\/h3>\n<p>原书 4.8.1 节生成单个 <span class=\"katex-inline\">4\\times4<\/span> 标准高斯矩阵，反复左乘独立标准高斯矩阵 100 次。单步矩阵谱半径在 1 附近波动，连乘 100 步后元素落到 <span class=\"katex-inline\">10^{25}<\/span>–<span class=\"katex-inline\">10^{26}<\/span> 量级（PDF 第 185–186 页给出矩阵元素如 <span class=\"katex-inline\">-2.1897\\times10^{26}<\/span>）。对照：若每步谱半径小于 1，同长度连乘会压到机器精度附近。深网梯度连乘与该矩阵链同构，尺度失控只在两头之一出现。<\/p>\n<h3>算例 2：单层方差平衡对照<\/h3>\n<p>设 <span class=\"katex-inline\">n_{in}=128<\/span>，<span class=\"katex-inline\">n_{out}=64<\/span>，输入方差 <span class=\"katex-inline\">\\gamma^2=1<\/span>。<\/p>\n<ul><li>\n取 <span class=\"katex-inline\">\\sigma^2=1/128<\/span>：前向方差 <span class=\"katex-inline\">n_{in}\\sigma^2=1<\/span>，前向不放大；反向方差 <span class=\"katex-inline\">n_{out}\\sigma^2=0.5<\/span>，梯度收缩。\n<\/li><li>\n取 <span class=\"katex-inline\">\\sigma^2=1/64<\/span>：反向不放大，前向方差 2，激活放大。\n<\/li><li>\nXavier：<span class=\"katex-inline\">\\sigma^2=2/(128+64)=1/96\\approx0.0104<\/span>，前向方差 <span class=\"katex-inline\">128/96\\approx1.333<\/span>，反向方差 <span class=\"katex-inline\">64/96\\approx0.667<\/span>，两端都不极端。\n<p>均匀区间 <span class=\"katex-inline\">a=\\sqrt{6/192}=\\sqrt{0.03125}\\approx0.1768<\/span>，权重落在 <span class=\"katex-inline\">[-0.177,0.177]<\/span>。<\/p>\n<\/ul>\n<h3>算例 3：饱和激活的梯度量级<\/h3>\n<p>sigmoid <span class=\"katex-inline\">\\sigma(x)=1/(1+e^{-x})<\/span>，导数 <span class=\"katex-inline\">\\sigma&#x27;(x)=\\sigma(x)(1-\\sigma(x))<\/span>。<span class=\"katex-inline\">x=0<\/span> 时导数 0.25；<span class=\"katex-inline\">x=3<\/span> 时 <span class=\"katex-inline\">\\sigma\\approx0.953<\/span>，导数 <span class=\"katex-inline\">\\approx0.045<\/span>；<span class=\"katex-inline\">x=-3<\/span> 时导数量级相同。多层各落在 <span class=\"katex-inline\">|x|=3<\/span> 附近，三层后梯度因子 <span class=\"katex-inline\">0.045^3\\approx9.1\\times10^{-5}<\/span>，浅层信号基本消失。<\/p>\n<h2>延伸推演<\/h2>\n<h3>ReLU 网络的初始化调整<\/h3>\n<p>Xavier 推导未计入非线性。ReLU 负区间输出为 0，通过单元的方差减半；针对 ReLU 的初始化把方差因子调整为 <span class=\"katex-inline\">2/n_{in}<\/span>（He 初始化思路），补偿被置零的那一半单元。本书正文以 Xavier 为主线，实践中 ReLU 网络常配合 He 类尺度。<\/p>\n<h3>对称性为什么随机采样能打破<\/h3>\n<p>若 <span class=\"katex-inline\">W^{(1)}<\/span> 全部取常数 <span class=\"katex-inline\">c<\/span>，两隐单元输入相同、激活相同，输出层回传梯度逐位相同；梯度下降后权重仍相等，迭代不改变对称。随机采样使各单元初始响应错开，前向走不同方向，反向梯度自然分化。dropout 在训练中进一步破坏单元绑定，但起点对称仍要靠随机初始化解除。<\/p>\n<h3>梯度裁剪在爆炸定位中的位置<\/h3>\n<p>训练中若梯度范数超过阈值，按范数比例缩回到阈值内（原书 8.5.5 节梯度裁剪，PDF 第 339 页前后）。裁剪是运行时止损手段，不改变初始化与架构；它压住单步爆炸，不解决长链连乘的根本尺度问题。<\/p>\n<h3>对抗性追问：初始化合理就不会消失爆炸吗<\/h3>\n<p>不会。初始化只约束起点，训练中激活分布随层漂移，长链连乘仍可能失控；需要 BN、合理学习率、残差结构共同维持。把初始化当唯一防线是常见误判。<\/p>\n<h3>对抗性追问：Xavier 假设被违反为什么还有效<\/h3>\n<p>推导假设无非线性、输入权重独立同分布，深度网络中这两条都近似成立。实践中 Xavier 给出的尺度在 1 附近，避免了极端放大或缩小；理论不严密但经验稳健，后续初始化方法多在此框架上按激活类型调整。<\/p>\n<h2>补充推演与第二算例<\/h2>\n<h3>第二算例：两层配置下的方差对照<\/h3>\n<p><span class=\"katex-inline\">n_{in}=100<\/span>，<span class=\"katex-inline\">n_{out}=100<\/span>，输入方差 1。 Xavier：<span class=\"katex-inline\">\\sigma^2=2/200=0.01<\/span>，<span class=\"katex-inline\">\\sigma=0.1<\/span>，均匀区间 <span class=\"katex-inline\">a=\\sqrt{6/200}\\approx0.173<\/span>。前向方差 <span class=\"katex-inline\">n_{in}\\sigma^2=1<\/span>，反向方差 <span class=\"katex-inline\">n_{out}\\sigma^2=1<\/span>，两端平衡。 ReLU 对照 He 尺度：<span class=\"katex-inline\">\\sigma^2=2/n_{in}=0.02<\/span>，<span class=\"katex-inline\">\\sigma\\approx0.141<\/span>，补偿负区间被置零的一半单元。直接沿用 Xavier 到 ReLU 深层，通过单元方差逐层减半，几层后激活尺度偏低。<\/p>\n<h3>逐层方差递推<\/h3>\n<p>第 <span class=\"katex-inline\">l<\/span> 层输入方差 <span class=\"katex-inline\">\\gamma_{l-1}^2<\/span>，权重方差 <span class=\"katex-inline\">\\sigma_l^2<\/span>，前向输出方差 <span class=\"katex-inline\">n_{in,l}\\sigma_l^2\\gamma_{l-1}^2<\/span>。要让 <span class=\"katex-inline\">\\gamma_l^2<\/span> 不随层变化，每层都满足 <span class=\"katex-inline\">n_{in,l}\\sigma_l^2=1<\/span>。任一层权重方差偏离该条件，偏差沿后续层累积；初始化只约束第一层起点，后续层分布漂移仍需 BN 等机制维持。<\/p>\n<h3>谱半径与连乘速率<\/h3>\n<p>矩阵连乘的长期尺度由谱半径决定：谱半径小于 1，乘积按几何速率收缩；大于 1，按几何速率放大。标量情形对应因子 <span class=\"katex-inline\">c<\/span>；矩阵情形对应最大特征值模。深链上稳定窗口很窄，初始化把权重尺度放在 1 附近，是让单步雅可比谱半径贴近 1 的起点选择。<\/p>\n<h3>偏置初始化的位置<\/h3>\n<p>偏置 <span class=\"katex-inline\">b<\/span> 不参与输入维度连乘，通常初始化为 0；偏置项梯度来自下游，不需要按 <span class=\"katex-inline\">n_{in},n_{out}<\/span> 缩放方差。把偏置也按权重尺度采样，会给网络起点引入多余偏移。门控单元的偏置另当别论：遗忘门偏置常取正值，控制初期记忆保留倾向。<\/p>\n<h3>对抗性追问：全零初始化权重会怎样<\/h3>\n<p>权重全 0 时，同一层所有单元输入相同、输出相同，回传梯度逐位相同；梯度下降更新后权重仍相等，对称不被打破，网络退化为单单元重复。随机采样错开起点，是解除单元对称的必要条件，与尺度控制是初始化的两件事。<\/p>\n<h3>第二轮补充<\/h3>\n<h3>第二算例：深层激活尺度递推<\/h3>\n<p>每层输入方差 1，权重方差 <span class=\"katex-inline\">\\sigma^2<\/span>，<span class=\"katex-inline\">n_{in}=64<\/span>。取 <span class=\"katex-inline\">\\sigma^2=1/64<\/span>：单层输出方差 1；多层后尺度仍贴近 1。取 <span class=\"katex-inline\">\\sigma^2=1/16<\/span>：单层方差 4，两层后 16，几层内激活放大到饱和区间。权重方差偏离平衡条件的偏差沿层累积，层数越多起点尺度越关键。<\/p>\n<h3>梯度消失与激活饱和的叠加<\/h3>\n<p>前向激活落入 sigmoid 两端，本地导数趋近 0；反向梯度再乘该小导数，信号被压一次。深网中饱和层与连乘叠加，消失速度快于单一因素。改用 ReLU、配合 BN 与合理初始化，分别从激活导数、分布校准、起点尺度三处缓解。<\/p>\n<h3>对抗性追问：初始化方差取大一点是否更稳妥<\/h3>\n<p>方差偏大前向放大、梯度爆炸；偏小前向收缩、梯度消失。两端都失控，平衡条件把单步方差压在 1 附近。初始化没有“越大越安全”的方向，尺度偏离平衡条件都会沿深链放大偏差。<\/p>\n<h3>第三轮补充<\/h3>\n<h3>第二算例：偏置梯度与尺度隔离<\/h3>\n<p>偏置 <span class=\"katex-inline\">b_j<\/span> 梯度 <span class=\"katex-inline\">\\partial L/\\partial b_j=\\sum_i\\partial L/\\partial o_{ij}<\/span>，不乘输入 <span class=\"katex-inline\">x_i<\/span>；偏置不参与输入维度连乘，初始 0 不破坏单元对称。权重负责单元间区分，偏置负责位置平移，初始化尺度分别处理。<\/p>\n<h3>延伸：深层网络的尺度维持链条<\/h3>\n<p>初始化定起点尺度，BN 校准层间分布，残差提供梯度捷径，ReLU 保持正区间导数；四者配合才把深链尺度维持在可控区间。单靠初始化覆盖不了训练过程中的分布漂移。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n深层梯度连乘由哪些矩阵与向量组成？（<span class=\"katex-inline\">M^{(L)}\\cdots M^{(l+1)}v^{(l)}<\/span>，<span class=\"katex-inline\">M^{(r)}<\/span> 为层间雅可比。）\n<\/li><li>\n前向方差公式与保持条件是什么？（<span class=\"katex-inline\">\\mathrm{Var}(o_i)=n_{in}\\sigma^2\\gamma^2<\/span>，要求 <span class=\"katex-inline\">n_{in}\\sigma^2=1<\/span>。）\n<\/li><li>\nXavier 方差与均匀区间是什么？（<span class=\"katex-inline\">\\sigma^2=2/(n_{in}+n_{out})<\/span>；<span class=\"katex-inline\">U(-\\sqrt{6/(n_{in}+n_{out})},\\sqrt{6/(n_{in}+n_{out})})<\/span>。）\n<\/li><li>\n全常数初始化为什么破不了对称？（各单元前向相同、梯度相同，迭代后权重仍相等。）\n<\/li><li>\n梯度裁剪与初始化各解决什么环节？（裁剪运行时压住单步爆炸；初始化约束起点尺度，两者不互相替代。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "数值稳定性与参数初始化：梯度消失/爆炸的来源与 Xavier 初始化"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.236<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">多层感知机与非线性激活：为什么线性堆叠会退化<\/a><\/span><\/div><h1>卷积与参数共享：输出尺寸公式、参数复用与感受野累积<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（原书 6.1 从全连接到卷积、6.2 图像卷积、6.3 填充和步幅，PDF 第 236、241、246 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>把高分辨率图像直接展平接全连接层，每个像素都与每个输出全连接，参数量随图像边长平方增长；而且全连接不承认相邻像素的局部关联，把边缘、纹理这类局部模式打散。卷积层用固定大小的窗口在输入上滑动，同一组核权重在所有位置复用，既提取局部模式，又把参数量与空间尺寸脱钩。理解卷积要能从输入尺寸、核尺寸、填充、步幅推出输出形状，并逐层算出感受野。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>互相关运算<\/strong>：核张量 <span class=\"katex-inline\">K<\/span> 在输入 <span class=\"katex-inline\">X<\/span> 上滑动，窗口内对应元素相乘求和得到输出（原书 6.2.1 节，PDF 第 241 页）。深度学习教材常把互相关直接称作卷积；严格卷积要把核翻转 180°，而可学习核翻转与否不影响表达能力。<\/p>\n<p><strong>卷积层<\/strong>：由一组可学习核加偏置组成；每个输出通道对应一组核，跨输入通道求和。<\/p>\n<p><strong>输出尺寸<\/strong>：输入 <span class=\"katex-inline\">n_h\\times n_w<\/span>，核 <span class=\"katex-inline\">k_h\\times k_w<\/span>，填充 <span class=\"katex-inline\">p_h,p_w<\/span>，步幅 <span class=\"katex-inline\">s_h,s_w<\/span>，输出<\/p>\n<div class=\"katex-block\">o_h=\\left\\lfloor\\frac{n_h+2p_h-k_h}{s_h}\\right\\rfloor+1,\\quad o_w=\\left\\lfloor\\frac{n_w+2p_w-k_w}{s_w}\\right\\rfloor+1.<\/div>\n<p><strong>参数共享<\/strong>：同一核在所有空间位置复用，权重只存一份；局部连接指每个输出只由输入的一个窗口区域算出。<\/p>\n<p><strong>感受野<\/strong>：输出张量某位置在原始输入上能影响到的区域大小；逐层卷积时感受野按核尺寸与步幅累积（原书 6.2.6 节，PDF 第 245 页前后）。<\/p>\n<p><strong>填充与步幅<\/strong>：填充在边界补 0，防止边缘像素反复丢失；步幅是窗口每次滑动的间隔，控制下采样节奏。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>输出尺寸推导：窗口起点沿高度从 0 到 <span class=\"katex-inline\">n_h+2p_h-k_h<\/span>，相邻起点间隔 <span class=\"katex-inline\">s_h<\/span>，可放置窗口数为区间长度除以步幅取整再加 1。无填充无步幅时 <span class=\"katex-inline\">o_h=n_h-k_h+1<\/span>，与原书 <span class=\"katex-inline\">3\\times3<\/span> 输入、<span class=\"katex-inline\">2\\times2<\/span> 核得 <span class=\"katex-inline\">2\\times2<\/span> 输出一致（PDF 第 246 页）。<\/p>\n<p>感受野递推：第 <span class=\"katex-inline\">l<\/span> 层感受野 <span class=\"katex-inline\">r_l=s_l\\,r_{l-1}+(k_l-1)<\/span>，首层 <span class=\"katex-inline\">r_0=1<\/span>。步幅为 1 时简化为 <span class=\"katex-inline\">r_l=r_{l-1}+k_l-1<\/span>。<\/p>\n<p>参数量对照：全连接层输入 <span class=\"katex-inline\">d<\/span>、输出 <span class=\"katex-inline\">q<\/span>，参数 <span class=\"katex-inline\">dq<\/span>；卷积层核 <span class=\"katex-inline\">k_h\\times k_w<\/span>、输出通道 <span class=\"katex-inline\">c_{out}<\/span>，参数 <span class=\"katex-inline\">k_h k_w c_{in}c_{out}<\/span>，与输入空间尺寸无关。<\/p>\n<p>数值算例：输入 <span class=\"katex-inline\">5\\times5<\/span>，<span class=\"katex-inline\">3\\times3<\/span> 核，填充 1，步幅 1，输出 <span class=\"katex-inline\">o_h=(5+2-3)/1+1=5<\/span>。再接一个 <span class=\"katex-inline\">2\\times2<\/span> 核、步幅 2，输出 <span class=\"katex-inline\">(5-2)/2+1=2<\/span>。感受野：首层 <span class=\"katex-inline\">r_1=3<\/span>，第二层 <span class=\"katex-inline\">r_2=2\\times3+(2-1)=7<\/span>。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：输入具有空间局部结构，同一模式可能出现在不同位置；卷积核在位置间复用才有意义。\n<\/li><li>\n失败案例一：忽略填充与步幅直接套 <span class=\"katex-inline\">n-k+1<\/span>。带填充或步幅时输出尺寸算错，后续层形状对不上。\n<\/li><li>\n失败案例二：核选得过大。单核覆盖区域太宽，局部模式提取变粗，参数量与计算量随核面积平方增长。\n<\/li><li>\n失败案例三：通道维度约束写错。多输入通道卷积要跨通道求和，核通道数必须与输入通道一致；<span class=\"katex-inline\">1\\times1<\/span> 卷积不改空间位置，只做通道融合。\n<\/li><li>\n边界：卷积对整体形状、全局布局的把握弱于全连接；深层堆叠扩大感受野后才覆盖全局信息。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>卷积 vs 全连接<\/strong>：全连接跨位置全连接、参数随空间尺寸膨胀；卷积局部连接加参数共享，参数规模只与核大小和通道数有关。\n<\/li><li>\n<strong>互相关 vs 严格卷积<\/strong>：严格卷积先翻转核再做互相关；深度学习中核可学习，翻转不改变可表达函数，工程实现多取互相关。\n<\/li><li>\n<strong>感受野 vs 输出尺寸<\/strong>：输出尺寸描述张量边长，感受野描述单个输出对应的原图区域；两者都由核、填充、步幅决定，但回答的问题不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的张量形状规则是卷积形状推演的基础；概念 c05 的局部连接思想由卷积落地。后继：概念 c09 的池化在卷积输出上做下采样；概念 c13 的自注意力被拿来与卷积对比局部性、并行性与路径长度。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（卷积与参数共享：输出尺寸公式、参数复用与感受野累积）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：互相关逐项计算、输出尺寸公式与感受野递推算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把卷积机制讲透，先往回追四层前提：<\/p>\n<ol><li>\n全连接处理图像的参数账先算清。每个像素连到每个输出，参数随边长平方膨胀，且不利用局部关联；这是卷积登场的动机。\n<\/li><li>\n卷积运算定义在滑动窗口上。先写清单窗口内的乘加规则，再推广到所有窗口位置。\n<\/li><li>\n输出形状由输入、核、填充、步幅四个量决定。公式要从窗口起点个数推出来，不能只记结论。\n<\/li><li>\n感受野是逐层累积的。单层核覆盖局部区域，多层叠加后深层单元对应原图更大范围；递推式要写清步幅与核尺寸两项。\n<\/ol>\n<p>依赖链方向：全连接参数局限 → 滑动窗口互相关 → 输出尺寸公式 → 参数量与空间尺寸脱钩 → 感受野逐层累积。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：单窗口互相关<\/h3>\n<p>输入 <span class=\"katex-inline\">X<\/span>，核 <span class=\"katex-inline\">K<\/span>，窗口位置 <span class=\"katex-inline\">(i,j)<\/span> 的输出<\/p>\n<div class=\"katex-block\">Y_{ij}=\\sum_{u=0}^{k_h-1}\\sum_{v=0}^{k_w-1}X_{i+u,j+v}K_{uv}.<\/div>\n<p>核在输入上从左上到右下滑动，每个位置重复同一乘加；偏置逐项加上。严格卷积定义要求核先上下左右翻转 180°，深度学习实现多直接做互相关，核可学习时两者表达能力等价。<\/p>\n<h3>第二步：输出尺寸公式<\/h3>\n<p>高度方向：填充后输入边长 <span class=\"katex-inline\">n_h+2p_h<\/span>，核占 <span class=\"katex-inline\">k_h<\/span>，可用起点区间长度 <span class=\"katex-inline\">n_h+2p_h-k_h+1<\/span>；起点间隔 <span class=\"katex-inline\">s_h<\/span>，可放窗口数<\/p>\n<div class=\"katex-block\">o_h=\\left\\lfloor\\frac{n_h+2p_h-k_h}{s_h}\\right\\rfloor+1.<\/div>\n<p>宽度方向 <span class=\"katex-inline\">o_w=\\lfloor(n_w+2p_w-k_w)/s_w\\rfloor+1<\/span>。无填充无步幅退化为 <span class=\"katex-inline\">o_h=n_h-k_h+1<\/span>。<\/p>\n<h3>第三步：感受野递推<\/h3>\n<p>设第 <span class=\"katex-inline\">l-1<\/span> 层感受野 <span class=\"katex-inline\">r_{l-1}<\/span>，当前层核 <span class=\"katex-inline\">k_l<\/span>、步幅 <span class=\"katex-inline\">s_l<\/span>。当前层一个单元看上一层 <span class=\"katex-inline\">k_l<\/span> 个相邻位置，每个位置对应原图 <span class=\"katex-inline\">r_{l-1}<\/span> 区域；上一层相邻位置在原图间隔 <span class=\"katex-inline\">s_l<\/span>，故<\/p>\n<div class=\"katex-block\">r_l=s_l\\,r_{l-1}+(k_l-1).<\/div>\n<p>首层 <span class=\"katex-inline\">r_0=1<\/span>。步幅 1 时 <span class=\"katex-inline\">r_l=r_{l-1}+k_l-1<\/span>。<\/p>\n<h3>第四步：参数量对照<\/h3>\n<p>全连接：输入 <span class=\"katex-inline\">d<\/span>、输出 <span class=\"katex-inline\">q<\/span>，参数 <span class=\"katex-inline\">dq<\/span>（偏置 <span class=\"katex-inline\">q<\/span>）。卷积：核 <span class=\"katex-inline\">k_h\\times k_w<\/span>、输入通道 <span class=\"katex-inline\">c_{in}<\/span>、输出通道 <span class=\"katex-inline\">c_{out}<\/span>，参数 <span class=\"katex-inline\">k_h k_w c_{in}c_{out}<\/span>（偏置 <span class=\"katex-inline\">c_{out}<\/span>），不含输入空间边长。图像边长翻倍，卷积参数不变，全连接参数翻四倍。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：<span class=\"katex-inline\">3\\times3<\/span> 输入、<span class=\"katex-inline\">2\\times2<\/span> 核互相关<\/h3>\n<p><span class=\"katex-inline\">X=\\begin{pmatrix}0&amp;1&amp;2\\\\3&amp;4&amp;5\\\\6&amp;7&amp;8\\end{pmatrix}<\/span>，<span class=\"katex-inline\">K=\\begin{pmatrix}1&amp;2\\\\3&amp;4\\end{pmatrix}<\/span>。 窗口 (0,0)：<span class=\"katex-inline\">0\\cdot1+1\\cdot2+3\\cdot3+4\\cdot4=0+2+9+16=27<\/span>。 窗口 (0,1)：<span class=\"katex-inline\">1\\cdot1+2\\cdot2+4\\cdot3+5\\cdot4=1+4+12+20=37<\/span>。 窗口 (1,0)：<span class=\"katex-inline\">3\\cdot1+4\\cdot2+6\\cdot3+7\\cdot4=3+8+18+28=57<\/span>。 窗口 (1,1)：<span class=\"katex-inline\">4\\cdot1+5\\cdot2+7\\cdot3+8\\cdot4=4+10+21+32=67<\/span>。 输出 <span class=\"katex-inline\">Y=\\begin{pmatrix}27&amp;37\\\\57&amp;67\\end{pmatrix}<\/span>，形状 <span class=\"katex-inline\">(3-2+1)\\times(3-2+1)=2\\times2<\/span>。<\/p>\n<h3>算例 2：三层网络感受野累积<\/h3>\n<p>输入 <span class=\"katex-inline\">32\\times32<\/span>：<\/p>\n<ul><li>\n第 1 层 <span class=\"katex-inline\">5\\times5<\/span>、步幅 1：<span class=\"katex-inline\">r_1=1+5-1=5<\/span>，输出 <span class=\"katex-inline\">28\\times28<\/span>。\n<\/li><li>\n第 2 层 <span class=\"katex-inline\">3\\times3<\/span>、步幅 1：<span class=\"katex-inline\">r_2=5+3-1=7<\/span>，输出 <span class=\"katex-inline\">26\\times26<\/span>。\n<\/li><li>\n第 3 层 <span class=\"katex-inline\">3\\times3<\/span>、步幅 2：<span class=\"katex-inline\">r_3=2\\times7+(3-1)=16<\/span>，输出 <span class=\"katex-inline\">12\\times12<\/span>。\n<p>第三层每个单元对应原图 <span class=\"katex-inline\">16\\times16<\/span> 区域；若第 3 层仍步幅 1，<span class=\"katex-inline\">r_3=7+3-1=9<\/span>，步幅放大了感受野增速。<\/p>\n<\/ul>\n<h3>算例 3：参数量对照<\/h3>\n<p><span class=\"katex-inline\">28\\times28<\/span> 灰度图，输出 10 类。全连接：<span class=\"katex-inline\">28\\times28\\times10=7840<\/span> 参数。卷积：一层 <span class=\"katex-inline\">5\\times5<\/span> 核、16 输出通道，参数 <span class=\"katex-inline\">5\\times5\\times1\\times16=400<\/span>；再接 <span class=\"katex-inline\">3\\times3<\/span> 核、32 通道，参数 <span class=\"katex-inline\">3\\times3\\times16\\times32=4608<\/span>。卷积参数与原图边长无关，加深加宽通道比拉大全连接层可控。<\/p>\n<h2>延伸推演<\/h2>\n<h3>学习到的核对应什么特征<\/h3>\n<p>浅层核学边缘、方向梯度等局部模式：横向核响应上下亮度变化，纵向核响应左右变化；深层核在浅层特征上组合出纹理、部件。核权重由数据反传更新，不是人工手设（原书 6.2.4 节学习卷积核，PDF 第 244 页前后）。<\/p>\n<h3><span class=\"katex-inline\">1\\times1<\/span> 卷积的位置<\/h3>\n<p><span class=\"katex-inline\">1\\times1<\/span> 核窗口只覆盖单位置，跨通道对特征做线性组合，不改高宽。它相当于在每个空间位置上接一个全连接层，用于通道降维或跨通道融合；不要把它当空间局部提取器。<\/p>\n<h3>多输入多输出通道<\/h3>\n<p>多输入通道：核与输入通道一一对应，各通道窗口相乘后求和；多输出通道：每组核学一类模式，输出通道堆叠。通道维卷积约束：核通道数必须等于输入通道数，否则无法逐通道相乘求和。<\/p>\n<h3>对抗性追问：卷积能不能替代全连接做全局判断<\/h3>\n<p>卷积局部提取、逐层扩大感受野；全局类别判断仍常由末端全连接或全局汇聚完成。卷积把局部性做进结构，不等于不需要全局聚合。<\/p>\n<h3>对抗性追问：核越大感受野越大，为什么不直接用大核<\/h3>\n<p>大核参数按 <span class=\"katex-inline\">k^2<\/span> 增长，计算量同步上升；多层小核叠加可以用更少参数达到相近感受野，还多几次非线性变换。大核只在需要宽视野且参数预算允许时使用。<\/p>\n<h2>补充推演与第二算例<\/h2>\n<h3>第二算例：带填充与步幅的输出尺寸<\/h3>\n<p>输入 <span class=\"katex-inline\">n_h=5<\/span>，核 <span class=\"katex-inline\">k_h=3<\/span>，填充 <span class=\"katex-inline\">p_h=1<\/span>，步幅 <span class=\"katex-inline\">s_h=2<\/span>：<span class=\"katex-inline\">o_h=\\lfloor(5+2-3)/2\\rfloor+1=\\lfloor4/2\\rfloor+1=3<\/span>。 输入 <span class=\"katex-inline\">n_h=6<\/span>，核 <span class=\"katex-inline\">k_h=3<\/span>，无填充，步幅 <span class=\"katex-inline\">s_h=2<\/span>：<span class=\"katex-inline\">o_h=\\lfloor(6-3)/2\\rfloor+1=\\lfloor1.5\\rfloor+1=2<\/span>。边界除不尽时向下取整，最后一个不完整窗口被舍弃；设计骨架时按公式复核各层输出边长，避免末端尺寸与全连接输入维度对不上。<\/p>\n<h3>权值共享与平移等变性<\/h3>\n<p>同一组核权重在所有空间位置复用，参数不随图像边长增长。输入平移后，卷积响应整体平移相同方向；这一性质来自权值共享，而不是训练出来的。池化在卷积之后再叠一层位置稳健性，两层分工不同。<\/p>\n<h3><span class=\"katex-inline\">1\\times1<\/span> 卷积与通道混合<\/h3>\n<p><span class=\"katex-inline\">1\\times1<\/span> 核窗口不覆盖相邻空间位置，跨通道对同一空间位置做线性组合；它不改高宽，只调整通道数。需要空间局部提取时用 <span class=\"katex-inline\">3\\times3<\/span> 类核，需要跨通道融合或降维时用 <span class=\"katex-inline\">1\\times1<\/span> 核，两者在现代网络里交替出现。<\/p>\n<h3>转置卷积的职责位置<\/h3>\n<p>转置卷积用于上采样：把低分辨率特征图映射到高分辨率，常接在分割网络解码器部分；它不是池化的可逆逆运算，输出没有恢复被池化丢弃的细节。不要把“下采样用池化”与“上采样用转置卷积”当成一对互逆操作。<\/p>\n<h3>代码片段：输出尺寸与感受野复核<\/h3>\n<pre class=\"lang-python\"><code>import torch\nfrom torch import nn\nconv = nn.Conv2d(1, 16, kernel_size=3, padding=1, stride=2)\nx = torch.randn(1, 1, 32, 32)\ny = conv(x)\nprint(y.shape)   # torch.Size([1, 16, 16, 16])，按公式复核边长<\/code><\/pre>\n<h3>对抗性追问：核通道数写错会怎样<\/h3>\n<p>卷积核通道数必须等于输入通道数；不一致时逐通道相乘求和无法配对，框架报通道维度错误。多输出通道只增加每组核的数量，不放宽对输入通道的约束。<\/p>\n<h3>第二轮补充<\/h3>\n<h3>第二算例：多通道卷积参数<\/h3>\n<p>输入 3 通道、输出 16 通道、核 <span class=\"katex-inline\">5\\times5<\/span>：每组核 <span class=\"katex-inline\">5\\times5\\times3=75<\/span> 权重，16 组共 1200 权重，加 16 偏置。输入图边长从 <span class=\"katex-inline\">28\\times28<\/span> 变 <span class=\"katex-inline\">32\\times32<\/span>，参数不变；全连接在同两图上参数随边长平方变化。<\/p>\n<h3>感受野与步幅的复核公式<\/h3>\n<p>步幅 <span class=\"katex-inline\">s_l<\/span> 同时放大上一层感受野在原图的间隔：<span class=\"katex-inline\">r_l=s_l r_{l-1}+(k_l-1)<\/span>。连续步幅 2 的层会让感受野增速快于单纯核尺寸叠加；末端单元覆盖范围由全部层的核与步幅共同决定，不能只数最后一层核大小。<\/p>\n<h3>对抗性追问：卷积核能学到任意位置的平移不变吗<\/h3>\n<p>权值共享提供平移等变，不提供平移不变；真正不变性还要靠池化、汇聚或数据增广。卷积核响应随输入平移而平移，位置信息仍保留在特征图上。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n输出尺寸公式中四个量各是什么？（输入 <span class=\"katex-inline\">n_h,n_w<\/span>，核 <span class=\"katex-inline\">k_h,k_w<\/span>，填充 <span class=\"katex-inline\">p_h,p_w<\/span>，步幅 <span class=\"katex-inline\">s_h,s_w<\/span>。）\n<\/li><li>\n感受野递推式怎么写？（<span class=\"katex-inline\">r_l=s_l r_{l-1}+(k_l-1)<\/span>，首层 <span class=\"katex-inline\">r_0=1<\/span>。）\n<\/li><li>\n卷积参数为什么与输入空间边长无关？（参数只含核尺寸与通道数，位置间复用同一组权重。）\n<\/li><li>\n<span class=\"katex-inline\">1\\times1<\/span> 卷积改变什么、不改变什么？（跨通道融合，不改高宽空间位置。）\n<\/li><li>\n互相关与严格卷积差在哪？（严格卷积先翻转核 180°；可学习核下两者表达能力等价。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "卷积与参数共享：输出尺寸公式、参数复用与感受野累积"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.254<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">卷积与参数共享：输出尺寸公式、参数复用与感受野累积<\/a><\/span><\/div><h1>池化与下采样：不变性来源、信息损失与 stride 卷积的差别<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 3 章（原书 6.5 汇聚层，PDF 第 254–255 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>卷积输出保留了精确位置信息，但物体在画面里平移一两个像素，卷积特征就可能跟着变动；同时深层网络需要逐步降低空间分辨率，让末端单元覆盖全局输入。池化（汇聚）层用固定窗口在特征图上滑动，窗口内取最大值或平均值，同时做两件事：降低对位置的敏感度，压缩空间尺寸。它没有可学习参数，聚合规则是确定性的。<\/p>\n<h2>定义与记号逐项拆<\/h2>\n<p><strong>最大汇聚层<\/strong>：窗口内取最大值，<span class=\"katex-inline\">\\max_{(u,v)\\in R}X_{uv}<\/span>，保留该区域最显著的响应。 <strong>平均汇聚层<\/strong>：窗口内取平均值，<span class=\"katex-inline\">\\frac1{|R|}\\sum_{(u,v)\\in R}X_{uv}<\/span>，保留区域平均水平。 <strong>窗口与步幅<\/strong>：汇聚窗口形状 <span class=\"katex-inline\">p_h\\times p_w<\/span>，沿输入滑动；输出尺寸公式与卷积同形，<span class=\"katex-inline\">o_h=\\lfloor(n_h-p_h)/s_h\\rfloor+1<\/span>。 <strong>平移不变性<\/strong>：输入整体小幅平移后，池化输出在对应区域保持不变或变化很小；这来自窗口内取极值/平均的规则，而不是参数学到的。<\/p>\n<h2>原理推导与推演<\/h2>\n<p>原书示例：输入 <span class=\"katex-inline\">X=\\begin{pmatrix}0&amp;1&amp;2\\\\3&amp;4&amp;5\\\\6&amp;7&amp;8\\end{pmatrix}<\/span>，<span class=\"katex-inline\">2\\times2<\/span> 最大汇聚，四个窗口结果 <span class=\"katex-inline\">\\max(0,1,3,4)=4<\/span>，<span class=\"katex-inline\">\\max(1,2,4,5)=5<\/span>，<span class=\"katex-inline\">\\max(3,4,6,7)=7<\/span>，<span class=\"katex-inline\">\\max(4,5,7,8)=8<\/span>，输出 <span class=\"katex-inline\">\\begin{pmatrix}4&amp;5\\\\7&amp;8\\end{pmatrix}<\/span>（PDF 第 255 页）。<\/p>\n<p>平移对照：边缘检测得到的特征图，物体右移一个像素后，卷积结果位置跟着移动；经过 <span class=\"katex-inline\">2\\times2<\/span> 最大汇聚，只要模式仍落在同一窗口邻域，窗口极值不变，汇聚输出仍识别到该模式。原书 6.5 节据此说明池化降低卷积层对位置的敏感性（PDF 第 254–255 页）。<\/p>\n<p>下采样节奏：卷积提取特征后接池化，特征图边长逐级缩小，后续每层单元的感受野相对原图扩大；末端全局判断由覆盖整个特征图的汇聚或全连接完成。<\/p>\n<p>窗口与步幅的定量关系：窗口边长 <span class=\"katex-inline\">p<\/span>、步幅 <span class=\"katex-inline\">s<\/span> 决定位置容忍范围。<span class=\"katex-inline\">p=2,s=2<\/span> 时相邻窗口不重叠，一个像素的平移至多让响应在两个相邻窗口间迁移；<span class=\"katex-inline\">p=3,s=1<\/span> 时窗口重叠，极值更容易跨窗口保持，但下采样幅度更小。输入边长 <span class=\"katex-inline\">n=5<\/span>、窗口 <span class=\"katex-inline\">2\\times2<\/span>、步幅 2，输出边长 <span class=\"katex-inline\">\\lfloor(5-2)/2\\rfloor+1=2<\/span>；输入 <span class=\"katex-inline\">n=6<\/span> 时同配置输出 <span class=\"katex-inline\">\\lfloor(6-2)/2\\rfloor+1=3<\/span>。通道侧对照：一张 <span class=\"katex-inline\">4\\times4<\/span> 单通道特征图做 <span class=\"katex-inline\">2\\times2<\/span> 平均汇聚，四个窗口均值分别为 <span class=\"katex-inline\">(0+1+3+4)/4=2.0<\/span>、<span class=\"katex-inline\">(1+2+4+5)/4=3.0<\/span>、<span class=\"katex-inline\">(3+4+6+7)/4=5.0<\/span>、<span class=\"katex-inline\">(4+5+7+8)/4=6.0<\/span>，峰值被压平，区域水平被保留。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：特征图存在冗余空间响应，需要聚合局部信息并减弱位置抖动；最大汇聚适合突出显著激活，平均汇聚适合平滑区域统计。\n<\/li><li>\n失败案例一：池化窗口过大。一次聚合区域太宽，细小纹理与位置细节被压掉，后续层无法恢复。\n<\/li><li>\n失败案例二：用大步幅卷积直接替代所有池化。大步幅卷积仍带可学习权重，把降采样与特征选择耦合；池化是无参数确定性聚合，两者职责不同，混用时降采样丢失的细节由卷积权重决定。\n<\/li><li>\n失败案例三：通道维度误池化。池化默认在空间维滑动，通道维各自独立取极值/平均；对通道做聚合属于另一类操作（如全局平均汇聚接分类）。\n<\/li><li>\n边界：池化丢失窗口内具体位置，只保留极值或均值；需要精确定位的任务（检测、分割）常在特征图上保留位置分支，不全靠池化。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>池化 vs 卷积<\/strong>：卷积窗口内乘加并有可学习核；池化窗口内取极值或平均，无参数。池化不提取新特征，只聚合已有响应。\n<\/li><li>\n<strong>最大汇聚 vs 平均汇聚<\/strong>：最大汇聚保留最显著激活，对稀疏响应更敏感；平均汇聚抹除尖峰、保留区域水平。边缘纹理类特征多用最大汇聚。\n<\/li><li>\n<strong>下采样 vs 感受野扩大<\/strong>：下采样缩小特征图边长，感受野扩大指输出对应原图区域变大；池化同时推动两者，但概念上分开。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c08 的卷积输出是池化的输入；局部连接与参数共享是卷积侧机制。后继：概念 c10 的 BN 在卷积/汇聚前后校准激活；现代网络谱系（概念 c08 章节衔接）中池化与卷积块交替堆叠。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（池化与下采样：不变性来源、信息损失与 stride 卷积的差别）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：汇聚前向计算、平移不变性与下采样尺寸算例<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要讲清池化的作用与边界，先往回追四层前提：<\/p>\n<ol><li>\n卷积特征图对精确位置敏感。物体小幅平移会移动卷积响应位置，这是引入池化的直接问题。\n<\/li><li>\n聚合需要固定规则。池化在窗口内取极值或均值，规则确定性、无可学习参数，与卷积窗口乘加区分开。\n<\/li><li>\n下采样尺寸沿用卷积同套几何公式。窗口、步幅决定输出边长，先把尺寸关系写清。\n<\/li><li>\n不变性来自聚合规则本身。窗口内极值/均值对小幅平移不敏感，这是池化平移稳健性的来源，不是额外训练出来的。\n<\/ol>\n<p>依赖链方向：卷积位置敏感 → 窗口聚合规则定义 → 输出尺寸公式 → 极值/均值带来局部不变性 → 逐级下采样扩大末端感受野。<\/p>\n<h2>正向推导<\/h2>\n<h3>第一步：两种汇聚前向<\/h3>\n<p>设窗口 <span class=\"katex-inline\">R_{ij}<\/span> 为以 <span class=\"katex-inline\">(i,j)<\/span> 为左上的 <span class=\"katex-inline\">p_h\\times p_w<\/span> 区域。 最大汇聚：<span class=\"katex-inline\">Y_{ij}=\\max_{(u,v)\\in R_{ij}}X_{uv}<\/span>。 平均汇聚：<span class=\"katex-inline\">Y_{ij}=\\frac1{|R_{ij}|}\\sum_{(u,v)\\in R_{ij}}X_{uv}<\/span>。 两种运算都不跨通道混合，每个输入通道独立产生一个输出通道。<\/p>\n<h3>第二步：输出尺寸<\/h3>\n<p>与卷积几何一致：<\/p>\n<div class=\"katex-block\">o_h=\\left\\lfloor\\frac{n_h-p_h}{s_h}\\right\\rfloor+1,\\quad o_w=\\left\\lfloor\\frac{n_w-p_w}{s_w}\\right\\rfloor+1.<\/div>\n<p>带填充时分子改为 <span class=\"katex-inline\">n_h+2p_h-p_h<\/span>。池化无核权重，输出通道数等于输入通道数。<\/p>\n<h3>第三步：平移不变性论证<\/h3>\n<p>设输入 <span class=\"katex-inline\">X<\/span> 右移一列得 <span class=\"katex-inline\">Z[i,j]=X[i,j+1]<\/span>。对最大汇聚，<span class=\"katex-inline\">Z<\/span> 的窗口极值落在 <span class=\"katex-inline\">X<\/span> 相邻窗口内；若模式在原图上的宽度不超过窗口步幅，平移前后覆盖该模式的窗口极值保持同一数值。平均汇聚按同一规则，区域均值对单点位置移动不敏感。 对照卷积：卷积响应由窗口内乘加得到，位置移动会改变每个窗口对应的像素组合；池化在聚合层把这部分位置抖动抹掉一层。<\/p>\n<h3>第四步：逐级下采样的链条<\/h3>\n<p>卷积提特征 → 池化缩边长 → 再卷积提组合特征 → 再池化。特征图边长递减，末端单元覆盖原图区域递增；全局判断由末端全局汇聚或全连接完成。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：<span class=\"katex-inline\">3\\times3<\/span> 输入两模式汇聚<\/h3>\n<p><span class=\"katex-inline\">X=\\begin{pmatrix}0&amp;1&amp;2\\\\3&amp;4&amp;5\\\\6&amp;7&amp;8\\end{pmatrix}<\/span>，<span class=\"katex-inline\">2\\times2<\/span> 窗口。 最大汇聚：<\/p>\n<ul><li>\n窗口 (0,0)：<span class=\"katex-inline\">\\max(0,1,3,4)=4<\/span>\n<\/li><li>\n窗口 (0,1)：<span class=\"katex-inline\">\\max(1,2,4,5)=5<\/span>\n<\/li><li>\n窗口 (1,0)：<span class=\"katex-inline\">\\max(3,4,6,7)=7<\/span>\n<\/li><li>\n窗口 (1,1)：<span class=\"katex-inline\">\\max(4,5,7,8)=8<\/span>\n<\/li><li>\n(0,0)：<span class=\"katex-inline\">(0+1+3+4)/4=2.0<\/span>\n<\/li><li>\n(0,1)：<span class=\"katex-inline\">(1+2+4+5)/4=3.0<\/span>\n<\/li><li>\n(1,0)：<span class=\"katex-inline\">(3+4+6+7)/4=5.0<\/span>\n<\/li><li>\n(1,1)：<span class=\"katex-inline\">(4+5+7+8)/4=6.0<\/span>\n<p>输出 <span class=\"katex-inline\">\\begin{pmatrix}4&amp;5\\\\7&amp;8\\end{pmatrix}<\/span>（原书公式 6.5.1，PDF 第 255 页）。 平均汇聚： 输出 <span class=\"katex-inline\">\\begin{pmatrix}2.0&amp;3.0\\\\5.0&amp;6.0\\end{pmatrix}<\/span>。同一输入，最大汇聚保留尖峰，平均汇聚压低峰值。<\/p>\n<\/ul>\n<h3>算例 2：平移前后的汇聚对照<\/h3>\n<p>设边缘特征图 <span class=\"katex-inline\">X<\/span> 中模式出现在第 2 列；右移一列后 <span class=\"katex-inline\">Z<\/span> 模式到第 3 列。<span class=\"katex-inline\">2\\times2<\/span> 池化第一步：<span class=\"katex-inline\">X<\/span> 左上窗口含模式边缘，极值为 5；<span class=\"katex-inline\">Z<\/span> 左上窗口少了该边缘、但右上窗口含边缘，极值仍为 5。两层池化后，输出图上响应位置可能错开一格，而“是否存在该模式”的判断不变。<\/p>\n<h3>算例 3：下采样尺寸链<\/h3>\n<p><span class=\"katex-inline\">32\\times32<\/span> 输入：卷积 <span class=\"katex-inline\">3\\times3<\/span> 步幅 1 得 <span class=\"katex-inline\">30\\times30<\/span>；<span class=\"katex-inline\">2\\times2<\/span> 池化步幅 2 得 <span class=\"katex-inline\">15\\times15<\/span>；再卷积 <span class=\"katex-inline\">3\\times3<\/span> 得 <span class=\"katex-inline\">13\\times13<\/span>；再池化得 <span class=\"katex-inline\">6\\times6<\/span>。末端 <span class=\"katex-inline\">6\\times6<\/span> 特征图每个单元对应的原图区域，由两次卷积核与两次步幅按感受野递推累积。<\/p>\n<h2>延伸推演<\/h2>\n<h3>全局平均汇聚<\/h3>\n<p>末端把整张特征图每个通道取平均，得通道级描述向量再接分类器；它是平均汇聚在整图尺寸上的特例，参数量为零，替代末端全连接可大幅压参数。<\/p>\n<h3>池化的通道独立性<\/h3>\n<p>最大/平均汇聚默认沿空间维滑动，通道之间不聚合。需要通道选择时，靠后续卷积或注意力权重；不要在池化层把不同通道的极值混在一起。<\/p>\n<h3>池化与大步幅卷积的职责边界<\/h3>\n<p>大步幅卷积：窗口内乘加、权重可学习，一次完成降采样与特征筛选；池化：无参数聚合，只缩小分辨率与减弱位置敏感。用大步幅卷积替代池化，降采样丢什么细节由权重学出来；保留池化则聚合规则固定、行为可预期。现代网络两者按任务搭配，不是非此即彼。<\/p>\n<h3>对抗性追问：池化越多越好吗<\/h3>\n<p>不是。池化逐级丢位置信息，窗口过大或层级过多，细粒度定位无法恢复；检测分割任务需要在高分辨率特征图上回归位置，池化只在提取语义的分支使用。<\/p>\n<h3>对抗性追问：平均汇聚能不能替代最大汇聚<\/h3>\n<p>稀疏特征响应下，平均汇聚把尖峰摊平，显著特征容易被背景均值盖过；最大汇聚对局部最强响应敏感。两类汇聚的选择由特征分布决定，不能互换默认值。<\/p>\n<h2>补充推演与第二算例<\/h2>\n<h3>第二算例：窗口重叠与位置容忍<\/h3>\n<p><span class=\"katex-inline\">3\\times3<\/span> 窗口、步幅 1：相邻窗口共享两行两列，局部峰值在窗口间迁移时更容易被相邻窗口继承；<span class=\"katex-inline\">2\\times2<\/span> 窗口、步幅 2：窗口互不重叠，平移一格就跨到下一个窗口。容忍小幅平移的能力来自窗口覆盖范围，重叠越多位置越稳，但下采样幅度越小。<\/p>\n<h3>可学习汇聚与固定汇聚的差别<\/h3>\n<p>注意力汇聚（如自注意力的加权池化）按查询动态分配权重，权重随输入变化；固定最大/平均汇聚规则不变。可学习汇聚灵活但引入参数与优化成本，固定汇聚行为可预期、无参数。现代视觉网络末端常用全局平均汇聚接分类器，中间局部特征仍多由固定池化或大步幅卷积处理。<\/p>\n<h3>池化不恢复被丢弃的细节<\/h3>\n<p>最大汇聚只留窗口极值，均值只留窗口水平；窗口内哪个像素取到极值、背景如何分布，在汇聚后无法从输出反推。检测分割任务需要坐标回归时，保留高分辨率特征分支，不在语义主干里把位置细节全部池化掉。<\/p>\n<h3>对抗性追问：池化能抵消卷积的位置敏感吗<\/h3>\n<p>只能抵消一层。卷积响应位置随输入平移移动一次，池化聚合抹掉局部抖动；大幅平移、旋转或形变超出窗口覆盖范围，池化不再提供不变性。指望池化解决所有位置变化，会高估其稳健性边界。<\/p>\n<h3>第二轮补充<\/h3>\n<h3>第二算例：两种池化在尖峰信号上的对照<\/h3>\n<p>特征图 <span class=\"katex-inline\">X=\\begin{pmatrix}1&amp;0&amp;0\\\\0&amp;0&amp;0\\\\0&amp;0&amp;2\\end{pmatrix}<\/span>，<span class=\"katex-inline\">2\\times2<\/span> 窗口。最大汇聚四窗口：左上 1，右上 0，左下 0，右下 2，尖峰位置被保留。平均汇聚：左上 <span class=\"katex-inline\">(1+0+0+0)/4=0.25<\/span>，右上 0，左下 0，右下 <span class=\"katex-inline\">(0+0+0+2)/4=0.5<\/span>，峰值被摊成区域均值。稀疏特征上最大汇聚更易检出显著响应，密集平滑区域平均汇聚更稳。<\/p>\n<h3>第二算例：逐级下采样尺寸链复核<\/h3>\n<p><span class=\"katex-inline\">32\\times32<\/span> 输入：卷积 <span class=\"katex-inline\">3\\times3<\/span> 步幅 1 填充 1 得 <span class=\"katex-inline\">32\\times32<\/span>；池化 <span class=\"katex-inline\">2\\times2<\/span> 步幅 2 得 <span class=\"katex-inline\">16\\times16<\/span>；卷积 <span class=\"katex-inline\">3\\times3<\/span> 步幅 1 填充 1 得 <span class=\"katex-inline\">16\\times16<\/span>；池化得 <span class=\"katex-inline\">8\\times8<\/span>。末端 <span class=\"katex-inline\">8\\times8<\/span> 通道特征图接全局平均汇聚，得通道级描述向量。尺寸链每一步都可按 <span class=\"katex-inline\">o=\\lfloor(n+2p-k)/s\\rfloor+1<\/span> 复核。<\/p>\n<h3>池化梯度回传的位置<\/h3>\n<p>最大汇聚反向把梯度回传给前向取到最大值的那个输入位置，其余位置梯度为 0；平均汇聚把梯度均摊到窗口内所有位置。池化无可学习参数，回传只负责把上游梯度分配回输入，不更新窗口规则。<\/p>\n<h3>下采样方式对细节保留的影响<\/h3>\n<p>大步幅卷积在降采样时由权重决定保留哪些响应；固定池化按极值或均值规则丢弃细节。检测任务需要定位细粒度时，常用带高分辨率分支的结构，主干语义分支做粗粒度汇聚。<\/p>\n<h3>对抗性追问：全局平均汇聚会不会丢掉空间布局<\/h3>\n<p>会。整图平均后通道内的位置分布被压成一个数，空间布局信息不再保留；需要空间位置判断的任务要保留空间特征图，或用注意力加权保留关键位置。<\/p>\n<h3>第三轮补充<\/h3>\n<h3>第二算例：窗口覆盖与特征尺度匹配<\/h3>\n<p>小目标特征图上一个尖峰跨 2 个像素，<span class=\"katex-inline\">2\\times2<\/span> 池化窗口能覆盖；窗口扩到 <span class=\"katex-inline\">5\\times5<\/span>，尖峰被背景均值稀释，最大汇聚也只在该窗口内取到低值。池化窗口要与要保留的特征尺度匹配，不能为下采样盲目放大窗口。<\/p>\n<h3>池化与步幅卷积的信息通路对照<\/h3>\n<p>大步幅卷积每个输出位置由一组可学习权重筛选窗口响应，哪些细节保留由数据学出；池化窗口规则固定，最大响应位置与平均水平两类信息二选一。需要端到端学降采样策略时用卷积，需要确定性压缩时用池化。<\/p>\n<h3>延伸：现代网络中的池化位置<\/h3>\n<p>LeNet 类骨架卷积池化交替；VGG 用 <span class=\"katex-inline\">2\\times2<\/span> 步幅 2 池化逐级减半；末端全局平均汇聚替代大参数全连接。池化不是必选项，纯步幅卷积骨架同样可以下采样，区别在参数与确定性聚合的权衡。<\/p>\n<h3>对抗性追问：池化能带来旋转不变性吗<\/h3>\n<p>不能。池化只对小幅平移提供稳健性；旋转、尺度变化超出窗口邻域，池化规则不产生对应不变性。旋转不变性要靠数据增广、专门结构或特征归一化处理。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n最大汇聚与平均汇聚的窗口运算各是什么？（取窗口内最大值；取窗口内元素平均。）\n<\/li><li>\n池化输出尺寸公式与卷积有何异同？（同套几何公式；池化输出通道数等于输入通道数，无核权重。）\n<\/li><li>\n池化平移稳健性从哪里来？（窗口内极值/均值对小幅位置移动不敏感，规则本身提供不变性。）\n<\/li><li>\n大步幅卷积与池化职责差别是什么？（卷积带可学习权重，降采样与特征选择耦合；池化无参数确定性聚合。）\n<\/li><li>\n池化在通道维度做什么？（默认不聚合通道，各通道独立取极值/平均；通道聚合另由卷积或注意力完成。）\n<\/ol><\/div><\/details>", "kind": "concept", "title": "池化与下采样：不变性来源、信息损失与 stride 卷积的差别"}, "c10": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/Python/PyTorch/动手学深度学习-PyTorch(第二版).pdf · p.286<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">数值稳定性与参数初始化：梯度消失/爆炸的来源与 Xavier 初始化<\/a><\/span>
