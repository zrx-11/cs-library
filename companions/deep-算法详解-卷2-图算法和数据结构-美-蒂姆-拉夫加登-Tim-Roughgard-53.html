pan>；\n<\/li><li>\n<span class=\"katex-inline\">C<\/span> 在 <span class=\"katex-inline\">8<\/span> 右：<span class=\"katex-inline\">8&lt;C<\/span>。\n<p><strong>中序序列<\/strong>：旋转前后都是 <span class=\"katex-inline\">A,5,B,8,C<\/span>，键序未变。左旋是镜像：<span class=\"katex-inline\">a<\/span> 为左孩子侧父节点，<span class=\"katex-inline\">b<\/span> 为左子，换位后 <span class=\"katex-inline\">b<\/span> 升位，<span class=\"katex-inline\">a<\/span> 挂右。<\/p>\n<\/ul>\n<h2>删除三情形逐步推演<\/h2>\n<p><strong>情形 1：叶节点<\/strong>。被删节点无子女，直接摘除，父节点对应子女指针置空。例：删 <span class=\"katex-inline\">4<\/span>（叶），其父 <span class=\"katex-inline\">3<\/span> 的右孩子置空。 <strong>情形 2：单子女<\/strong>。被删节点唯一子女顶替其位置。例：节点 <span class=\"katex-inline\">b<\/span> 只有左子女 <span class=\"katex-inline\">c<\/span>，删 <span class=\"katex-inline\">b<\/span> 后 <span class=\"katex-inline\">c<\/span> 接到 <span class=\"katex-inline\">b<\/span> 父节点对应位置。 <strong>情形 3：双子女<\/strong>。取前驱（左子树最右）或后继（右子树最左）键值顶替被删节点，再删除前驱/后继节点；被删位置的子树由顶替链条承接。例：删根 <span class=\"katex-inline\">5<\/span>，前驱取左子树最右 <span class=\"katex-inline\">3<\/span>，把 <span class=\"katex-inline\">3<\/span> 的键值放到 <span class=\"katex-inline\">5<\/span> 位置，再删原 <span class=\"katex-inline\">3<\/span> 节点；若 <span class=\"katex-inline\">3<\/span> 有左子树，按单子女情形承接。<\/p>\n<p>三种情形结束后 BST 性质保持；双子女删除多一次顶替键查找，总代价仍 <span class=\"katex-inline\">O(h)<\/span>。<\/p>\n<h2>高度与代价核算<\/h2>\n<ul><li>\n平衡树：<span class=\"katex-inline\">h=O(\\log n)<\/span>，各查找插入删除 <span class=\"katex-inline\">O(\\log n)<\/span>。\n<\/li><li>\n退化链：<span class=\"katex-inline\">h=n-1<\/span>，最坏 <span class=\"katex-inline\">O(n)<\/span>。\n<\/li><li>\n中序遍历：全部节点访问一次，<span class=\"katex-inline\">O(n)<\/span>。\n<\/li><li>\nSelect：存子树大小字段，按大小跳转 <span class=\"katex-inline\">O(h)<\/span>；不存大小只能遍历计数。\n<\/ul>\n<p>高度由插入删除序列与平衡规则共同决定；普通 BST 不承诺对数高度，平衡结构（旋转加触发条件）才把高度压到对数级。<\/p>\n<h2>各操作路径汇总<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>操作<\/th><th>路径方向<\/th><th>代价<\/th><\/tr><\/thead><tbody><tr><td>Search(<span class=\"katex-inline\">k<\/span>)<\/td><td>根到叶，按大小分叉<\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><\/tr><tr><td>Min<\/td><td>反复向左<\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><\/tr><tr><td>Max<\/td><td>反复向右<\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><\/tr><tr><td>Predecessor<\/td><td>左子树最右或向上回溯祖先<\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><\/tr><tr><td>Insert<\/td><td>走到空位挂叶<\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><\/tr><tr><td>Delete<\/td><td>查节点 + 顶替链条<\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><\/tr><tr><td>OutputSorted<\/td><td>中序遍历<\/td><td><span class=\"katex-inline\">O(n)<\/span><\/td><\/tr><tr><td>Select(<span class=\"katex-inline\">i<\/span>)<\/td><td>按子树大小跳转<\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>除全序遍历外，其余操作都沿单条根到叶路径，比较次数不超过树高。<\/p>\n<h2>平衡调整的边界<\/h2>\n<ul><li>\n旋转是局部 <span class=\"katex-inline\">O(1)<\/span> 换位，不改中序序列；用于把过高侧压回。\n<\/li><li>\n旋转触发条件由平衡规则规定；普通 BST 插入后不自动重排。\n<\/li><li>\n旋转解决局部层级失衡，不解决键集分布问题；最坏分布仍需平衡结构兜底。\n<\/li><li>\n多次旋转可重构局部子树，但目标是恢复高度平衡，不是重排全部节点。\n<\/ul>\n<h2>结构选型对照补充<\/h2>\n<ul><li>\n<strong>需要范围查询<\/strong>（找 <span class=\"katex-inline\">[a,b]<\/span> 内全部键）：BST 可沿边界定位后中序展开；散列表无键序，做不到。\n<\/li><li>\n<strong>需要前驱后继<\/strong>：BST 沿父链与子树定位；堆只能给极值。\n<\/li><li>\n<strong>只判存在性<\/strong>：散列表期望 <span class=\"katex-inline\">O(1)<\/span>，比 BST 对数级更快。\n<\/li><li>\n<strong>动态插入频繁<\/strong>：BST 挂叶 <span class=\"katex-inline\">O(h)<\/span>，有序数组要 <span class=\"katex-inline\">O(n)<\/span> 搬动。\n<\/ul>\n<p>选型先列查询清单：有序、范围、前驱走 BST；极值优先走堆；纯存在性走散列表。<\/p>\n<h2>常见错误清单<\/h2>\n<ol><li>\n分叉方向判反，漏检目标子树。\n<\/li><li>\n旋转时子树 <span class=\"katex-inline\">B<\/span> 丢挂或重复挂靠。\n<\/li><li>\n把退化链 <span class=\"katex-inline\">O(n)<\/span> 当 BST 普遍承诺。\n<\/li><li>\n双子女删除直接摘根，子树悬空。\n<\/li><li>\nSelect 未存子树大小却按 <span class=\"katex-inline\">O(h)<\/span> 报代价。\n<\/li><li>\n认为旋转改动键值；实际只改挂靠。\n<\/ol>\n<h2>差生通读检查（补充）<\/h2>\n<ul><li>\n<strong>卡在&quot;中序为什么必然升序&quot;<\/strong>：性质递归保证左小根大；中序先左后根再右，三段次序接上即升序。\n<\/li><li>\n<strong>卡在&quot;前驱两种位置&quot;<\/strong>：有左子树取其最右；没有则向上到第一个右祖先。后继镜像。\n<\/li><li>\n<strong>卡在&quot;旋转与重组差别&quot;<\/strong>：旋转换两个节点挂靠，<span class=\"katex-inline\">O(1)<\/span>；重组整树遍历重排，代价高。平衡优先用旋转。\n<\/li><li>\n<strong>卡在&quot;高度为什么是对数目标&quot;<\/strong>：<span class=\"katex-inline\">n<\/span> 节点平衡二叉树每层约翻倍，<span class=\"katex-inline\">h\\approx\\log_2 n<\/span>；单侧过长打破翻倍结构，高度退化为线性。\n<\/ul>\n<h2>Search 算例逐路径<\/h2>\n<p>树键集 <span class=\"katex-inline\">\\{2,3,4,5,8\\}<\/span>，根 5，左 2（右 3，3 右 4），右 8。<\/p>\n<ul><li>\n查 4：5→2（<span class=\"katex-inline\">4&gt;2<\/span>）→3（<span class=\"katex-inline\">4&gt;3<\/span>）→右空位命中前判断；实际 4 是 3 右孩子，命中。\n<\/li><li>\n查 6：5→8（<span class=\"katex-inline\">6&lt;8<\/span>）→左空位，不存在。\n<\/li><li>\n查 2：5 向左命中。\n<p>每步比较排除另一子树：走左则右子树全部大于根，目标不可能在右；走右反之。路径不回退，比较次数等于路径长度。<\/p>\n<\/ul>\n<h2>Insert 算例<\/h2>\n<p>插入 6：5→8→左空位，挂 6 为 8 左叶。复核：<span class=\"katex-inline\">6&lt;8<\/span>，<span class=\"katex-inline\">5&lt;6<\/span>，性质保持；中序 <span class=\"katex-inline\">2,3,4,5,6,8<\/span>。插入只在空位挂叶，既有父子对不动，新叶方向由 Search 路径决定。<\/p>\n<h2>平衡与退化对照<\/h2>\n<ul><li>\n平衡形态：5 节点树高约 <span class=\"katex-inline\">\\lceil\\log_2 5\\rceil=3<\/span>，操作对数级。\n<\/li><li>\n退化链：有序 <span class=\"katex-inline\">1,2,3,4,5<\/span> 依次插入成右链，高 4，查找 5 走 4 步，<span class=\"katex-inline\">O(n)<\/span>。\n<\/li><li>\n平衡触发：插入删除后某侧过高，旋转把高位子树压向另一侧；单次旋转 <span class=\"katex-inline\">O(1)<\/span>，中序不变。\n<\/li><li>\n高度目标：平衡 BST 维持 <span class=\"katex-inline\">h=O(\\log n)<\/span>；普通 BST 只承诺 <span class=\"katex-inline\">O(h)<\/span>，最坏线性。\n<\/ul>\n<h2>与堆、散列表的分工<\/h2>\n<ul><li>\n频繁取极值：堆根 <span class=\"katex-inline\">O(1)<\/span>，插入抽取 <span class=\"katex-inline\">O(\\log n)<\/span>。\n<\/li><li>\n有序遍历、前驱后继、范围切片：BST 中序与父链定位。\n<\/li><li>\n纯存在性判断：散列表期望 <span class=\"katex-inline\">O(1)<\/span>，不维护键序。\n<\/li><li>\n动态有序集合：BST 在查找与插入间折中，插入挂叶不必搬动数组元素。\n<\/ul>\n<p>同一数据集可按不同查询需求配不同组织；选型先列查询清单，再定结构。<\/p>\n<h2>前驱后继定位细化<\/h2>\n<p><strong>前驱<\/strong>：节点 <span class=\"katex-inline\">u<\/span> 有左子树时，前驱是左子树的最右节点（沿右链到底）；无左子树时，向上回溯到第一个把 <span class=\"katex-inline\">u<\/span> 放在其右子树的祖先。 <strong>后继<\/strong>：对称——有右子树取右子树最左节点；无右子树向上回溯到第一个把 <span class=\"katex-inline\">u<\/span> 放在其左子树的祖先。 <strong>用途<\/strong>：有序列邻接、范围遍历的端点定位；BST 凭父链与子树方向完成，不需要全序数组支持。<\/p>\n<h2>删除顶替链条<\/h2>\n<p>双子女节点 <span class=\"katex-inline\">u<\/span>：取前驱 <span class=\"katex-inline\">p<\/span>（或后继 <span class=\"katex-inline\">s<\/span>），把 <span class=\"katex-inline\">p<\/span> 键值复制到 <span class=\"katex-inline\">u<\/span> 位置；再删除原 <span class=\"katex-inline\">p<\/span> 节点。<span class=\"katex-inline\">p<\/span> 若有子树，按叶节点或单子女情形承接。整轮操作保持 BST 性质：顶替键落在 <span class=\"katex-inline\">u<\/span> 的大小区间内，子树归属沿链条重接。代价 <span class=\"katex-inline\">O(h)<\/span>，不触发整树重组。<\/p>\n<h2>平衡结构触发直觉<\/h2>\n<p>普通 BST 插入后不自动重排；平衡规则在节点高度差越界时触发旋转。旋转把高位侧子树压向低位侧，局部恢复层级平衡。多次旋转可调整局部子树，目标是把高度维持对数级。旋转不改键值、不改中序序列，只改父子挂靠；这是它能作为平衡基本操作的原因。<\/p>\n<h2>结构选择再对照<\/h2>\n<ul><li>\n极值优先：堆。\n<\/li><li>\n有序集合动态查询：BST。\n<\/li><li>\n纯存在性极速判断：散列表。\n<\/li><li>\n静态有序只读：有序数组二分。\n<p>需求混合时可分层：外层散列表判存在，内层 BST 维护有序索引；选型先拆查询类型，不追求单一结构覆盖全部操作。<\/p>\n<\/ul>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出 BST 性质两条方向约束，说明中序遍历输出次序。\n<\/li><li>\nSearch 一个键沿什么路径下行？为什么不需要回退另一分支？\n<\/li><li>\n右旋列出 <span class=\"katex-inline\">A,a,B,b,C<\/span> 归属，核验每对父子键大小。\n<\/li><li>\n有序序列依次插入 BST 为什么退化成链？高度是多少？\n<\/li><li>\n删除双子女节点分哪几步？顶替键取前驱还是后继是否唯一？\n<\/ol><\/div><\/details>", "c10": "<div class=\"source-badge\">📖 出处：算法详解 卷2 图算法和数据结构.pdf · p.167<\/div><h1>散列表：散列函数、冲突解决、负载因子与布隆过滤器<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch04（原书 §6.1–6.6，PDF 第 159、167–186 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>散列表把键经散列函数映射到槽位编号，期望 <span class=\"katex-inline\">O(1)<\/span> 完成插入与存在性查找；冲突由链地址法（槽位挂链表）或开放地址法（槽内探查空位）解决，负载因子决定平均探查长度。布隆过滤器是多位散列加位数组的紧凑成员判断结构，只支持插入与查找，允许假阳性、不允许假阴性。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>有序结构（BST、有序数组）查找代价随高度或对数增长；许多场景只需要快速判断&quot;这个键在不在集合里&quot;，不需要键序与范围查询。散列表用散列函数把键直接算到存储位置，省去比较查找过程。冲突不可避免：槽位数少于键数，不同键可能落到同一槽；需要冲突解决规则把同槽对象组织起来。负载升高后探查链变长，性能随负载退化，还要会估负载、选冲突策略。<\/p>\n<p>不解决冲突会出两类错。一是假设映射一一对应，同槽键互相覆盖，对象丢失。二是忽略负载因子，表快填满时插入查找变慢，仍按常数时间估算。本概念把散列函数要求、两类冲突解决、负载性能与布隆过滤器边界讲清。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>散列函数 <span class=\"katex-inline\">h<\/span><\/strong>：把键映射到槽位编号 <span class=\"katex-inline\">\\{0,1,\\dots,m-1\\}<\/span>。好的散列函数把相似键分散到不同槽，分布均匀，避免聚集。 <strong>槽位（桶）<\/strong>：散列表数组的一个位置；链地址法下挂一个链表，开放地址法下存单个对象或空位。 <strong>冲突<\/strong>：两个不同键 <span class=\"katex-inline\">x\\neq y<\/span> 满足 <span class=\"katex-inline\">h(x)=h(y)<\/span>。槽位少于键数时冲突不可避免。 <strong>链地址法<\/strong>：每个槽位挂链表，同槽对象追加到链尾；查找沿链表比较键。删除直接摘链。 <strong>开放地址法<\/strong>：冲突时按探查序列（线性探查、双重散列等）找下一个空位；每槽最多一个对象，负载不超过 1。 <strong>负载因子 <span class=\"katex-inline\">\\alpha<\/span><\/strong>：已存对象数 <span class=\"katex-inline\">n<\/span> 与槽位数 <span class=\"katex-inline\">m<\/span> 之比，<span class=\"katex-inline\">\\alpha=n/m<\/span>。链地址法可超过 1，开放地址法达到 1 无法再插入。 <strong>散列冲突与散列碰撞<\/strong>：碰撞即同槽；均匀散列下碰撞概率由负载决定。 <strong>布隆过滤器<\/strong>：位数组加 <span class=\"katex-inline\">k<\/span> 个散列函数；插入对象把 <span class=\"katex-inline\">k<\/span> 个位置置 1；查找检查 <span class=\"katex-inline\">k<\/span> 位全 1 才判存在。 <strong>假阳性/假阴性<\/strong>：未插入对象被误判存在为假阳性；已插入对象被判不存在为假阴性。布隆过滤器只可能假阳性，不可能假阴性。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">m=10<\/span>，<span class=\"katex-inline\">n=5<\/span>，<span class=\"katex-inline\">\\alpha=0.5<\/span>；链地址法平均链长 0.5，查找常数级。 <strong>反例<\/strong>：<span class=\"katex-inline\">n=100,m=10<\/span>，<span class=\"katex-inline\">\\alpha=10<\/span>；平均链长 10，查找随负载线性变长；散列函数若把相似键聚到同槽，实际更差。<\/p>\n<h2>原理推导：负载与探查长度<\/h2>\n<ol><li>\n<strong>均匀散列假设<\/strong>：键落入各槽概率均等；同一槽对象数期望为 <span class=\"katex-inline\">\\alpha<\/span>。\n<\/li><li>\n<strong>链地址法期望<\/strong>：平均链表长 <span class=\"katex-inline\">\\alpha<\/span>；查找成功比较约 <span class=\"katex-inline\">\\alpha/2<\/span>，失败扫完整链 <span class=\"katex-inline\">\\alpha<\/span>。<span class=\"katex-inline\">\\alpha<\/span> 小时常数级，<span class=\"katex-inline\">\\alpha<\/span> 增大线性退化。\n<\/li><li>\n<strong>开放地址法<\/strong>：空位探查序列长度随 <span class=\"katex-inline\">\\alpha<\/span> 趋近 1 快速上升；负载 1 时无空位可插。\n<\/li><li>\n<strong>扩容重散列<\/strong>：负载超阈值时扩大槽位数，重散列全部键；均摊插入被扩容代价摊薄。\n<\/li><li>\n<strong>布隆过滤器假阳性来源<\/strong>：某对象的 <span class=\"katex-inline\">k<\/span> 个位恰被其他对象置 1，对象未插入也判存在；已插入对象的位必然保持 1，故不漏报。\n<\/li><li>\n<strong>空间权衡<\/strong>：布隆过滤器不存对象本体，位数组紧凑；代价是容忍假阳性，且不支持删除（一位被多对象共享）。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：存在性判断、去重、两数之和查补集、状态空间记录；不需要键序与范围查询。\n<\/li><li>\n边界 1：散列表不维护有序；范围查询、前驱后继需另配结构。\n<\/li><li>\n边界 2：开放地址法删除复杂，删除标记需特殊处理；大量删除场景更适合链地址法。\n<\/li><li>\n边界 3：布隆过滤器不支持删除；要删除需计数布隆等变体。\n<\/li><li>\n边界 4：散列函数分布不良会使聚集加剧，再好的冲突策略也救不回查找代价。\n<\/li><li>\n失败案例：负载接近 1 仍不扩容，开放地址法探查链越来越长；链地址法长链把常数查找拖成线性。\n<\/li><li>\n失败案例：把布隆过滤器当精确集合用，依据假阳性结果做不可逆操作；过滤器结论只作&quot;可能存在&quot;的初筛。\n<\/li><li>\n失败案例：期待散列表按键序遍历；散列位置与键序无关。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>链地址法 vs 开放地址法<\/strong>：前者槽位挂链、可超负载、删除方便；后者槽内探查、负载 ≤1、删除需标记。空间紧选后者，删除多选前者。\n<\/li><li>\n<strong>散列表 vs BST<\/strong>：散列表期望 <span class=\"katex-inline\">O(1)<\/span> 存在性，不维护键序；BST 支持有序操作，代价 <span class=\"katex-inline\">O(\\log n)<\/span>。\n<\/li><li>\n<strong>假阳性 vs 假阴性<\/strong>：误报存在 vs 漏报已存在；布隆过滤器只许前者。\n<\/li><li>\n<strong>散列函数 vs 加密哈希<\/strong>：散列函数求分布均匀与速度；加密哈希求抗碰撞，用途不同，不可混用要求。\n<\/ul>\n<h2>一个负载对照演示<\/h2>\n<p><span class=\"katex-inline\">m=10<\/span> 槽：<span class=\"katex-inline\">n=5<\/span> 时 <span class=\"katex-inline\">\\alpha=0.5<\/span>，平均链长半格，查找常数级；<span class=\"katex-inline\">n=10<\/span> 时 <span class=\"katex-inline\">\\alpha=1<\/span>，链长约 1；<span class=\"katex-inline\">n=30<\/span> 时 <span class=\"katex-inline\">\\alpha=3<\/span>，平均链长 3，比较负担随负载线性上升。开放地址法在 <span class=\"katex-inline\">\\alpha<\/span> 接近 1 时探查空位越来越远，必须扩容重散列。散列函数若把相似键聚到同槽，实际链长比均匀假设更差。<\/p>\n<h2>常见误判<\/h2>\n<ul><li>\n误判：散列表查找一定 <span class=\"katex-inline\">O(1)<\/span>。这是均匀散列、低负载下的期望；聚集或高负载时探查链变长，代价随负载增长。\n<\/li><li>\n误判：布隆过滤器会漏报。已插入对象的位保持置位，查找必命中；错误方向只有假阳性。\n<\/li><li>\n误判：开放地址法可无限插入。每槽一个对象，负载到 1 即无法再插，需扩容。\n<\/li><li>\n误判：散列表能按键序遍历。散列位置与键序无关，有序查询要换 BST 类结构。\n<\/ul>\n<h2>两类冲突策略的选择<\/h2>\n<p>链地址法在槽位挂链表，同槽对象追加链尾，删除摘链直接，负载可超过 1，代价随平均链长增长；空间上要为链表指针付额外开销。开放地址法槽内探查空位，每槽一个对象，负载上限 1，删除需墓碑标记，内存更紧凑但删除复杂。空间优先、删除少选开放地址；删除频繁、负载可能偏高选链地址法。探查技巧上，线性探查实现简单但易形成连续块，双重散列分散更好，具体选择按实测与内存层次决定。<\/p>\n<h2>散列表与布隆过滤器的分工<\/h2>\n<p>散列表存键本身（或键值对），支持精确存在性与取值；布隆过滤器只存多位标志，不存对象，空间更紧，结论允许假阳性。工程链路常把布隆过滤器前置初筛：判&quot;一定不在&quot;直接拒绝，判&quot;可能在&quot;再查散列表或后端存储。两者不是替代关系，而是按空间与错误容忍度分层使用。<\/p>\n<h2>失败方向复核<\/h2>\n<p>散列表的失败主要来自聚集与高负载：散列函数把相似键压到同槽，或 <span class=\"katex-inline\">\\alpha<\/span> 接近 1 仍不扩容，查找从常数退化为长链遍历。布隆过滤器的失败方向固定为假阳性，不产生假阴性；标准结构不支持删除，一位被多对象共享，清位会连带抹除他人标记。两类结构都不维护键序，需要范围切片或前驱后继时应换搜索树。<\/p>\n<h2>联系<\/h2>\n<p>前置：无前置结构概念；可比较键不是必需，散列只要求可映射。后继：c09 的 BST 与本章散列表构成有序/无序两条路线；布隆过滤器的空间—错误权衡思想在缓存预热、去重、状态过滤场景复用。散列表是现代符号表、字典与索引的常用实现。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（散列表：散列函数、冲突解决、负载因子与布隆过滤器）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：散列映射、冲突负载核算与布隆过滤器权衡<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>讲清查散列表，往回追四层：<\/p>\n<ol><li>\n<strong>键到位置的映射<\/strong>：散列函数把任意键折算成槽位编号；分布均匀是性能前提。\n<\/li><li>\n<strong>冲突不可避免<\/strong>：槽少键多，同槽必然出现；需要组织同槽对象的规则。\n<\/li><li>\n<strong>负载性能<\/strong>：对象数与槽位数之比决定探查/链长；负载越高压查代价上升。\n<\/li><li>\n<strong>紧凑近似结构<\/strong>：布隆过滤器用多位散列换空间，错误方向限定为假阳性。\n<\/ol>\n<p>依赖链方向：散列映射 → 冲突组织 → 负载与扩容 → 近似成员判断。<\/p>\n<h2>正向推导：散列函数与槽位映射<\/h2>\n<p><strong>步骤 1：函数口径<\/strong>。<span class=\"katex-inline\">h:K\\to\\{0,1,\\dots,m-1\\}<\/span>，<span class=\"katex-inline\">K<\/span> 为键集合。相同键必须映射同槽；不同键尽量分散。 <strong>步骤 2：均匀性要求<\/strong>：每个槽承接键数期望接近 <span class=\"katex-inline\">n/m<\/span>；相似键（前缀相同、编号相邻）不应落到相邻或同一槽。 <strong>步骤 3：常见构造思路<\/strong>：把键折算成整数，取模槽位数；或乘法散列取小数部分位。本书 §6.3.6 讨论良好散列函数的性质：分布均匀、计算快速、对典型输入不聚集。 <strong>步骤 4：冲突定位<\/strong>。<span class=\"katex-inline\">x\\neq y<\/span> 而 <span class=\"katex-inline\">h(x)=h(y)<\/span> 即碰撞；<span class=\"katex-inline\">m&lt;n<\/span> 时由抽屉原理，碰撞必然存在。 <strong>步骤 5：与表示形式分工<\/strong>：散列函数决定位置，冲突解决决定同槽内怎么存；两者分开设计。<\/p>\n<h2>正向推导二：两类冲突解决<\/h2>\n<p><strong>链地址法<\/strong>：<\/p>\n<ol><li>\n槽位 <span class=\"katex-inline\">i<\/span> 挂链表 <span class=\"katex-inline\">L_i<\/span>；插入把键追加到 <span class=\"katex-inline\">L_{h(x)}<\/span>。\n<\/li><li>\n查找沿 <span class=\"katex-inline\">L_{h(x)}<\/span> 逐项比较键；命中返回，链空或扫完未中即不存在。\n<\/li><li>\n删除从链中摘除节点；指针操作直接。\n<\/li><li>\n负载可超 1：<span class=\"katex-inline\">\\alpha&gt;1<\/span> 时平均链长超过 1，性能随 <span class=\"katex-inline\">\\alpha<\/span> 增长。\n<\/ol>\n<p><strong>开放地址法<\/strong>：<\/p>\n<ol><li>\n槽位只存一个对象；冲突时按探查序列找空位。\n<\/li><li>\n线性探查：<span class=\"katex-inline\">i,i+1,i+2,\\dots<\/span> 环绕；双重散列：第二步长由另一散列函数定。\n<\/li><li>\n查找沿同一探查序列；遇空位即不存在。\n<\/li><li>\n删除不能直接清空，否则截断探查链；需墓碑标记占位。\n<\/li><li>\n负载 <span class=\"katex-inline\">\\alpha&lt;1<\/span>，达到 1 无空位可插，必须扩容。\n<\/ol>\n<h2>数值算例一：链地址法负载对照<\/h2>\n<p><span class=\"katex-inline\">m=10<\/span> 槽，键集按散列分布。<\/p>\n<ul><li>\n<strong><span class=\"katex-inline\">n=5<\/span>，<span class=\"katex-inline\">\\alpha=0.5<\/span><\/strong>：平均链长 0.5；查找成功平均比较约 0.25，失败扫平均半条链。\n<\/li><li>\n<strong><span class=\"katex-inline\">n=10<\/span>，<span class=\"katex-inline\">\\alpha=1<\/span><\/strong>：平均链长 1；查找常数级偏紧。\n<\/li><li>\n<strong><span class=\"katex-inline\">n=30<\/span>，<span class=\"katex-inline\">\\alpha=3<\/span><\/strong>：平均链长 3；成功比较约 1.5，失败扫 3，线性负担显现。\n<\/li><li>\n<strong><span class=\"katex-inline\">n=100,m=10<\/span>，<span class=\"katex-inline\">\\alpha=10<\/span><\/strong>：平均链长 10；散列不均时个别链更长，查找退回长链遍历。\n<\/ul>\n<p>扩容方向：<span class=\"katex-inline\">\\alpha<\/span> 超阈值（常见 0.7–0.9 依策略）时 <span class=\"katex-inline\">m<\/span> 翻倍，全部键重散列；均摊代价把一次性扩容摊到多次插入。<\/p>\n<h2>数值算例二：布隆过滤器置位与判定<\/h2>\n<p>设位数组 <span class=\"katex-inline\">B<\/span> 长 <span class=\"katex-inline\">m<\/span>，<span class=\"katex-inline\">k=3<\/span> 个散列函数。<\/p>\n<p><strong>插入对象 <span class=\"katex-inline\">x<\/span><\/strong>：算 <span class=\"katex-inline\">h_1(x),h_2(x),h_3(x)<\/span>，把 <span class=\"katex-inline\">B<\/span> 对应位置 1。 <strong>插入 <span class=\"katex-inline\">y<\/span><\/strong>：同样置 <span class=\"katex-inline\">y<\/span> 的三个位。 <strong>查找 <span class=\"katex-inline\">z<\/span><\/strong>：三位全 1 → 判&quot;可能在&quot;；任一为 0 → 判&quot;一定不在&quot;。<\/p>\n<p><strong>假阳性构造<\/strong>：<span class=\"katex-inline\">z<\/span> 未插入，但其 <span class=\"katex-inline\">h_1(z)<\/span> 位被 <span class=\"katex-inline\">x<\/span> 置 1，<span class=\"katex-inline\">h_2(z)<\/span> 位被 <span class=\"katex-inline\">y<\/span> 置 1，<span class=\"katex-inline\">h_3(z)<\/span> 位被 <span class=\"katex-inline\">x,y<\/span> 共同覆盖；三位全 1，过滤器判存在，实际未插入。 <strong>无假阴性理由<\/strong>：<span class=\"katex-inline\">x<\/span> 插入后其三位保持 1，后续操作只置位不清位；再查 <span class=\"katex-inline\">x<\/span> 三位必为 1，不会漏报。<\/p>\n<p><strong>位数与误报关系<\/strong>：位数固定时 <span class=\"katex-inline\">k<\/span> 增大置位更多，假阳性上升；对象数固定时增大位数组长度可压低误报。空间、误报率、<span class=\"katex-inline\">k<\/span> 三者权衡，§6.6 给启发式分析。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：假设散列一一对应<\/strong>。同槽键互相覆盖，对象丢失；复盘：冲突必然存在，必须配链表或探查序列。 <strong>案例 2：高负载不扩容<\/strong>。开放地址法探查链聚集，链地址法长链遍历；复盘：监控 <span class=\"katex-inline\">\\alpha<\/span>，超阈值扩容重散列。 <strong>案例 3：散列函数聚集<\/strong>。相似键落同槽，链表局部超长；复盘：先检验分布均匀性，再调冲突策略。 <strong>案例 4：开放地址法直接删位<\/strong>。探查链被截断，后续查找找不到已存对象；复盘：删除用墓碑标记。 <strong>案例 5：布隆过滤器做删除<\/strong>。一位多对象共享，清位会连带抹掉他人标记；复盘：只插入不删除，删除需求换计数变体。 <strong>案例 6：按布隆阳性做不可逆操作<\/strong>。假阳性导致误判；复盘：过滤器只作初筛，确认再走精确结构。<\/p>\n<h2>延伸推演：散列表典型应用<\/h2>\n<ol><li>\n<strong>去重<\/strong>：插入前查存在，已在则跳过；记录见过的对象。\n<\/li><li>\n<strong>两数之和<\/strong>：遍历数组，对当前数 <span class=\"katex-inline\">x<\/span> 查补集 <span class=\"katex-inline\">target-x<\/span> 是否在表中；命中即得配对。\n<\/li><li>\n<strong>状态空间记录<\/strong>：搜索过程中记录已达状态，避免重复展开；散列提供快速存在性判断。\n<\/li><li>\n<strong>符号表/字典<\/strong>：键名到定义的映射，插入查找期望常数级。\n<\/ol>\n<p>应用边界：这些场景都不要求按键序输出；需要排序、范围、前驱后继时回到 BST 类结构。<\/p>\n<h2>散列与有序结构对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>需求<\/th><th>散列表<\/th><th>BST<\/th><th>有序数组<\/th><\/tr><\/thead><tbody><tr><td>存在性查找<\/td><td>期望 <span class=\"katex-inline\">O(1)<\/span><\/td><td><span class=\"katex-inline\">O(\\log n)<\/span><\/td><td><span class=\"katex-inline\">O(\\log n)<\/span><\/td><\/tr><tr><td>插入<\/td><td>期望 <span class=\"katex-inline\">O(1)<\/span><\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><td><span class=\"katex-inline\">O(n)<\/span> 搬动<\/td><\/tr><tr><td>键序遍历<\/td><td>不支持<\/td><td>中序 <span class=\"katex-inline\">O(n)<\/span><\/td><td>遍历 <span class=\"katex-inline\">O(n)<\/span><\/td><\/tr><tr><td>范围查询<\/td><td>不支持<\/td><td>支持<\/td><td>支持<\/td><\/tr><tr><td>最坏情况<\/td><td>聚集退化<\/td><td>退化链 <span class=\"katex-inline\">O(n)<\/span><\/td><td>插入 <span class=\"katex-inline\">O(n)<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>选型顺序：先问是否需要键序与范围；不需要则散列表占优，需要则 BST/数组。<\/p>\n<h2>布隆过滤器边界清单<\/h2>\n<ul><li>\n<strong>支持操作<\/strong>：Insert、Lookup；不支持 Delete（标准布隆）。\n<\/li><li>\n<strong>错误方向<\/strong>：只假阳性，不假阴性。\n<\/li><li>\n<strong>空间<\/strong>：不存对象本体，仅位数组加 <span class=\"katex-inline\">k<\/span> 个函数位置；比散列表紧凑。\n<\/li><li>\n<strong>参数权衡<\/strong>：位数 <span class=\"katex-inline\">m<\/span>、函数数 <span class=\"katex-inline\">k<\/span>、对象数 <span class=\"katex-inline\">n<\/span> 共同决定假阳性率。\n<\/li><li>\n<strong>典型位置<\/strong>：缓存前的存在性初筛、爬虫去重、状态空间过滤；确认环节仍需精确存储。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ul><li>\n<strong>卡在&quot;冲突为什么不可避免&quot;<\/strong>：槽位 <span class=\"katex-inline\">m<\/span> 少于键数 <span class=\"katex-inline\">n<\/span>，抽屉原理保证同槽；均匀散列只能摊薄，不能消除。\n<\/li><li>\n<strong>卡在&quot;负载因子怎么影响代价&quot;<\/strong>：链地址法平均链长 <span class=\"katex-inline\">\\alpha<\/span>；开放地址法探查长度随 <span class=\"katex-inline\">\\alpha\\to1<\/span> 急升；<span class=\"katex-inline\">\\alpha<\/span> 是性能直接指标。\n<\/li><li>\n<strong>卡在&quot;布隆为何不漏报&quot;<\/strong>：插入只置位不清位，已插入对象的位一直为 1；假阳性来自他人位恰好覆盖，不是自身位被清。\n<\/li><li>\n<strong>卡在&quot;开放地址删除为何复杂&quot;<\/strong>：直接清空会截断后续对象的探查路径；需墓碑标记，查找时跳过墓碑继续探。\n<\/ul>\n<h2>散列构造小算例<\/h2>\n<p>取槽位 <span class=\"katex-inline\">m=7<\/span>，键为整数编号。散列函数 <span class=\"katex-inline\">h(x)=x\\bmod 7<\/span>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">x=3\\to 3<\/span>，<span class=\"katex-inline\">x=10\\to 3<\/span>（同槽冲突），<span class=\"katex-inline\">x=17\\to 3<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">x=5\\to 5<\/span>，<span class=\"katex-inline\">x=12\\to 5<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">x=1\\to 1<\/span>，<span class=\"katex-inline\">x=8\\to 1<\/span>。\n<\/ul>\n<p>链地址法下槽 3 挂 <span class=\"katex-inline\">[3,10,17]<\/span>，槽 5 挂 <span class=\"katex-inline\">[5,12]<\/span>，槽 1 挂 <span class=\"katex-inline\">[1,8]<\/span>。查找 10：算 <span class=\"katex-inline\">h(10)=3<\/span>，扫槽 3 链表命中。查找 4：<span class=\"katex-inline\">h(4)=4<\/span>，槽 4 空，判定不存在。<\/p>\n<p><strong>函数分布检查<\/strong>：若输入是连续编号，取模槽位应均匀落在各槽；若函数把多数键压到同一槽，链表局部超长，查找退化为遍历。良好散列函数要求计算快、分布匀、对典型输入不聚集。<\/p>\n<h2>链地址法操作推演<\/h2>\n<p><strong>插入<\/strong>：算槽位 <span class=\"katex-inline\">h(x)<\/span>，把 <span class=\"katex-inline\">x<\/span> 追加到该槽链表尾。重复键按策略忽略或覆盖。 <strong>查找<\/strong>：算槽位，沿链表逐项比较键；命中返回，链扫完未中即不存在。 <strong>删除<\/strong>：在链表中摘除对应节点；指针操作直接，不影响其他槽探查链。 <strong>负载表现<\/strong>：平均链长 <span class=\"katex-inline\">\\alpha=n/m<\/span>；成功查找平均比较约 <span class=\"katex-inline\">\\alpha/2<\/span>，失败扫完整链 <span class=\"katex-inline\">\\alpha<\/span>。<span class=\"katex-inline\">\\alpha<\/span> 小时常数级，<span class=\"katex-inline\">\\alpha<\/span> 增大线性退化。<\/p>\n<h2>开放地址法操作推演<\/h2>\n<p><strong>插入<\/strong>：槽位 <span class=\"katex-inline\">h(x)<\/span> 占用则按探查序列找下一空槽；线性探查步长 1，双重散列步长由第二散列函数定。 <strong>查找<\/strong>：沿同一探查序列；遇空槽即不存在，遇墓碑需继续探。 <strong>删除<\/strong>：不能直接清空，否则截断后续对象探查路径；置墓碑标记，查找跳过墓碑继续，插入可复用墓碑位。 <strong>负载上限<\/strong>：<span class=\"katex-inline\">\\alpha&lt;1<\/span>；<span class=\"katex-inline\">\\alpha=1<\/span> 无空位，必须扩容。删除多的场景链地址法更省事。<\/p>\n<h2>负载与扩容核算<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th><span class=\"katex-inline\">n<\/span><\/th><th><span class=\"katex-inline\">m<\/span><\/th><th><span class=\"katex-inline\">\\alpha<\/span><\/th><th>链地址法平均链长<\/th><th>表现<\/th><\/tr><\/thead><tbody><tr><td>5<\/td><td>10<\/td><td>0.5<\/td><td>0.5<\/td><td>常数级<\/td><\/tr><tr><td>10<\/td><td>10<\/td><td>1.0<\/td><td>1.0<\/td><td>偏紧<\/td><\/tr><tr><td>20<\/td><td>10<\/td><td>2.0<\/td><td>2.0<\/td><td>线性负担显现<\/td><\/tr><tr><td>30<\/td><td>10<\/td><td>3.0<\/td><td>3.0<\/td><td>长链遍历<\/td><\/tr><\/tbody><\/table><\/div>\n<p>扩容时机：<span class=\"katex-inline\">\\alpha<\/span> 超阈值（常见 0.7–0.9）时槽位翻倍，全部键重散列；一次性扩容代价均摊到多次插入，均摊插入仍接近常数。开放地址法扩容压力随 <span class=\"katex-inline\">\\alpha\\to1<\/span> 急剧上升，更早触发。<\/p>\n<h2>布隆过滤器位数与误报权衡<\/h2>\n<p><strong>参数<\/strong>：位数组长 <span class=\"katex-inline\">m<\/span>，散列函数个数 <span class=\"katex-inline\">k<\/span>，已插入对象数 <span class=\"katex-inline\">n<\/span>。 <strong>置位<\/strong>：插入 <span class=\"katex-inline\">x<\/span> 把 <span class=\"katex-inline\">k<\/span> 个位置 1；查找 <span class=\"katex-inline\">z<\/span> 三位全 1 判可能在，任一为 0 判不在。 <strong>假阳性<\/strong>：<span class=\"katex-inline\">z<\/span> 未插入，但其 <span class=\"katex-inline\">k<\/span> 位恰被其他对象分别置 1；判存在属误报。 <strong>无假阴性<\/strong>：插入对象的位只置不清，再查必为 1。 <strong>权衡方向<\/strong>：<span class=\"katex-inline\">m<\/span> 增大压低误报但占空间；<span class=\"katex-inline\">k<\/span> 过少区分度不足，过多加速置位填满；对象数固定时误报率由 <span class=\"katex-inline\">m<\/span> 与 <span class=\"katex-inline\">k<\/span> 共同决定。 <strong>不支持删除<\/strong>：一位被多对象共享，清位会连带抹掉他人标记；删除需求需计数布隆等变体。<\/p>\n<h2>典型应用场景<\/h2>\n<ol><li>\n<strong>去重<\/strong>：记录见过的对象，插入前查存在，重复跳过。\n<\/li><li>\n<strong>两数之和<\/strong>：遍历数组，对 <span class=\"katex-inline\">x<\/span> 查 <span class=\"katex-inline\">target-x<\/span> 是否在表，命中即配对。\n<\/li><li>\n<strong>状态空间记录<\/strong>：搜索中记下已达状态，避免重复展开。\n<\/li><li>\n<strong>初筛过滤<\/strong>：布隆过滤器挡掉确定不存在的请求，确认环节再查精确存储，减轻后端压力。\n<\/ol>\n<p>场景边界：以上都不要求键序；范围查询、前驱后继、有序输出不适合散列表。<\/p>\n<h2>散列与有序结构选型<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>需求<\/th><th>散列表<\/th><th>BST<\/th><th>有序数组<\/th><\/tr><\/thead><tbody><tr><td>存在性<\/td><td>期望 <span class=\"katex-inline\">O(1)<\/span><\/td><td><span class=\"katex-inline\">O(\\log n)<\/span><\/td><td><span class=\"katex-inline\">O(\\log n)<\/span><\/td><\/tr><tr><td>插入<\/td><td>期望 <span class=\"katex-inline\">O(1)<\/span><\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><td><span class=\"katex-inline\">O(n)<\/span> 搬动<\/td><\/tr><tr><td>键序遍历<\/td><td>不支持<\/td><td>中序 <span class=\"katex-inline\">O(n)<\/span><\/td><td><span class=\"katex-inline\">O(n)<\/span><\/td><\/tr><tr><td>范围/前驱<\/td><td>不支持<\/td><td>支持<\/td><td>支持<\/td><\/tr><tr><td>最坏情况<\/td><td>聚集退化<\/td><td>退化链 <span class=\"katex-inline\">O(n)<\/span><\/td><td>插入 <span class=\"katex-inline\">O(n)<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>选型先问是否需要键序与范围；不需要散列表占优，需要则 BST 或数组。<\/p>\n<h2>常见错误清单<\/h2>\n<ol><li>\n假设映射一一对应，同槽覆盖丢对象。\n<\/li><li>\n高负载不扩容，探查链/长链拖慢查找。\n<\/li><li>\n散列函数聚集，冲突局部集中。\n<\/li><li>\n开放地址法直接删位，截断探查链。\n<\/li><li>\n布隆过滤器清位删除，产生假阴性。\n<\/li><li>\n用假阳性结果做不可逆操作。\n<\/li><li>\n期待散列表输出有序序列。\n<\/ol>\n<h2>差生通读检查（补充）<\/h2>\n<ul><li>\n<strong>卡在&quot;冲突为何不可避免&quot;<\/strong>：<span class=\"katex-inline\">m&lt;n<\/span> 抽屉原理保证同槽；均匀散列只能摊薄，不能消除。\n<\/li><li>\n<strong>卡在&quot;负载怎么进代价&quot;<\/strong>：链地址法链长 <span class=\"katex-inline\">\\alpha<\/span>，开放地址法探查长度随 <span class=\"katex-inline\">\\alpha<\/span> 升；<span class=\"katex-inline\">\\alpha<\/span> 是性能直接指标。\n<\/li><li>\n<strong>卡在&quot;布隆为何只误报不漏报&quot;<\/strong>：置位只增不减，已插入对象位恒为 1；假阳性是他人位覆盖，不是自身位丢失。\n<\/li><li>\n<strong>卡在&quot;两类冲突策略删谁方便&quot;<\/strong>：链地址法摘链直接；开放地址要墓碑，删多场景选链地址。\n<\/ul>\n<h2>两数之和应用推演<\/h2>\n<p>目标 <span class=\"katex-inline\">target=9<\/span>，数组 <span class=\"katex-inline\">[2,7,11,15]<\/span>。<\/p>\n<ol><li>\n取 2：表空，查 <span class=\"katex-inline\">9-2=7<\/span> 不在，插入 2。\n<\/li><li>\n取 7：查 <span class=\"katex-inline\">9-7=2<\/span>，表中有 2，命中配对 <span class=\"katex-inline\">(2,7)<\/span>。\n<\/li><li>\n散列表把补集查找压到期望常数级；暴力枚举配对是 <span class=\"katex-inline\">O(n^2)<\/span>。\n<\/ol>\n<p>去重场景：遍历流对象，插入前先查存在；已在则跳过，未在则登记。状态空间搜索中同样用散列表记录已达状态，避免同一状态重复展开。<\/p>\n<h2>布隆过滤器部署位置<\/h2>\n<p>典型链路：请求先过布隆过滤器，判&quot;一定不在&quot;则直接拒绝，判&quot;可能在&quot;再查后端精确存储。过滤器挡掉确定不存在的请求，减轻后端压力；代价是少量假阳性请求落到后端才被排除。过滤器不存对象本体，位数组紧凑，适合缓存预热、爬虫去重、大规模状态初筛。<\/p>\n<h2>参数权衡方向<\/h2>\n<ul><li>\n位数组越长，误报越低，空间越大。\n<\/li><li>\n散列函数 <span class=\"katex-inline\">k<\/span> 过少：区分度不足，多位共享抬高假阳性；<span class=\"katex-inline\">k<\/span> 过多：位快速填满，同样抬高误报。\n<\/li><li>\n对象数 <span class=\"katex-inline\">n<\/span> 固定时，<span class=\"katex-inline\">m<\/span> 与 <span class=\"katex-inline\">k<\/span> 配合决定假阳性率；§6.6 给启发式分析推导部分位被置 1 的比例与假阳性公式。\n<\/li><li>\n标准布隆不支持删除；一位多对象共享，清位连带抹除他人标记，删除需计数变体。\n<\/ul>\n<h2>散列表实现备忘<\/h2>\n<ul><li>\n散列函数：分布均匀、计算快速、相似键分散；密码学哈希不替代散列函数。\n<\/li><li>\n冲突策略：链地址法删方便、负载可超 1；开放地址法紧凑、负载 ≤1、删除要墓碑。\n<\/li><li>\n负载因子：<span class=\"katex-inline\">\\alpha=n/m<\/span>，超阈值扩容重散列，均摊插入接近常数。\n<\/li><li>\n有序性：散列位置与键序无关，范围查询与前驱后继不适用。\n<\/ul>\n<h2>散列函数质量检查角度<\/h2>\n<ul><li>\n均匀性：各槽承接键数期望接近 <span class=\"katex-inline\">n/m<\/span>，无局部超长链。\n<\/li><li>\n分散性：前缀相同、编号相邻的相似键不落到相邻或同一槽。\n<\/li><li>\n速度：计算开销小，不成为插入查找瓶颈。\n<\/li><li>\n稳健性：对典型输入分布不退化到单一槽位。\n<\/ul>\n<p>密码学哈希追求抗碰撞，与散列函数的分布均匀、快速要求不同；不能因为同名&quot;哈希&quot;就互相替代。函数分布不良时，冲突解决策略再好也只能在坏槽内排队，查找代价由函数质量先决定。<\/p>\n<h2>与其他结构的边界复核<\/h2>\n<p>散列表不回答键序问题：位置由散列函数决定，相邻槽位的键之间没有大小关系；需要范围切片、前驱后继、有序输出时，应改用 BST 类结构。布隆过滤器不存对象本体，不能取回原值；它只能做成员初筛，确认环节必须落到精确存储。链地址法与开放地址法的取舍围绕删除频率、空间预算与负载上限：删除多选链表，空间紧选探查序列，负载过高先扩容而不是调冲突技巧。<\/p>\n<h2>小结：散列路线的适用面<\/h2>\n<p>散列表服务&quot;快速存在性判断&quot;：键经函数直达槽位，冲突由链或探查组织，负载决定平均代价；布隆过滤器是其近似变体，用多位标志换紧凑空间，错误方向限定假阳性。接到题目先拆分查询类型：要有序与范围走搜索树，要极值走堆，要纯存在性与去重走散列；类型未定不先套数据结构。<\/p>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出散列函数映射范围，好散列函数的两条分布要求。\n<\/li><li>\n链地址法与开放地址法在负载上限、删除难度上各有什么差别？\n<\/li><li>\n<span class=\"katex-inline\">\\alpha=n/m<\/span>，链地址法平均链表长是多少？查找成功与失败的比较量级？\n<\/li><li>\n布隆过滤器为什么只可能假阳性？假阴性在什么条件下才会出现？\n<\/li><li>\n什么查询需求不该用散列表？应换哪种结构？\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：图的表示与线性搜索：术语、邻接表示、BFS、连通分量、DFS 与拓扑排序<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1–2 章：图的基础知识、图的搜索及其应用（表示、BFS、连通分量、DFS、拓扑排序、强连通分量）<\/a><br>检查点：能在邻接列表上手工跑一遍 BFS 与 DFS，按层数读出无权最短路径，列出一个无向图的全部连通分量，并对一个 DAG 给出合法拓扑顺序<\/li><li class='path-step' id='path-02'><strong>步骤 02：加权图上的最短路径：单源问题、Dijkstra 得分与贪心不变量<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 3 章：Dijkstra 最短路径算法（单源问题、Dijkstra 得分、贪心不变量与非负权正确性）<\/a><br>检查点：能按 Dijkstra 得分逐步迭代画出 X 集合的扩张过程，复述非负权前提在正确性证明中的作用，指出负边长图上 Dijkstra 出错的具体环节<\/li><li class='path-step' id='path-03'><strong>步骤 03：堆：堆序不变量、数组表示、插入与抽取最小，以及优先队列提速<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 4 章：堆数据结构（堆操作、应用、数组形式实现与 Dijkstra 提速）<\/a><br>检查点：能写出父子下标公式，手推一次向上冒泡与一次向下交换，说明堆排序与 Dijkstra 用堆后运行时间从什么量级降到什么量级<\/li><li class='path-step' id='path-04'><strong>步骤 04：搜索树与散列表：有序操作、旋转平衡、散列冲突、负载与布隆过滤器<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 5–6 章：搜索树、散列表与布隆过滤器（BST 有序操作、旋转平衡、散列与冲突、布隆过滤器）<\/a><br>检查点：能说出 BST 各有序操作与树高的关系，画出一次旋转前后子树位置，解释链地址法与开放地址法的差别，估算负载因子对散列表查找的影响，并说明布隆过滤器为何只允许假阳性<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='图 $g=(v,e)$'>图 $G=(V,E)$ — 由顶点集 $V$ 与边集 $E$ 组成的结构；顶点表示对象，边表示对象之间的关系 <span class=glossary-ref>（第 1–2 章：图的基础知识、图的搜索及其应用（表示、BFS、连通分量、DFS、拓扑排序、强连通分量））<\/span><\/li><li data-term='有向图与无向图'>有向图与无向图 — 无向图的边 $(v,w)$ 是无序对，$(v,w)$ 与 $(w,v)$ 相同；有向图的边是有序对，从尾 $v$ 指向头 $w$，两条方向各算一条边 <span class=glossary-ref>（第 1–2 章：图的基础知识、图的搜索及其应用（表示、BFS、连通分量、DFS、拓扑排序、强连通分量））<\/span><\/li><li data-term='邻接列表'>邻接列表 — 为每个顶点维护一个列表，存放与它相邻的顶点；空间随边数线性增长，适合稀疏图 <span class=glossary-ref>（第 1–2 章：图的基础知识、图的搜索及其应用（表示、BFS、连通分量、DFS、拓扑排序、强连通分量））<\/span><\/li><li data-term='邻接矩阵'>邻接矩阵 — 用 $n\\times n$ 矩阵记录每对顶点之间是否有边（或边长）；判断单条边在不在为 $O(1)$，空间随顶点数平方增长 <span class=glossary-ref>（第 1–2 章：图的基础知识、图的搜索及其应用（表示、BFS、连通分量、DFS、拓扑排序、强连通分量））<\/span><\/li><li data-term='连通分量'>连通分量 — 无向图中互相可达的极大顶点子集；UCC 算法通过反复从未访问顶点发起搜索把整个图切成若干分量 <span class=glossary-ref>（第 1–2 章：图的基础知识、图的搜索及其应用（表示、BFS、连通分量、DFS、拓扑排序、强连通分量））<\/span><\/li><li data-term='拓扑排序'>拓扑排序 — 对有向无环图给出顶点顺序，使每条边都从排在前面的顶点指向排在后面的顶点；可用 DFS 逆后序构造 <span class=glossary-ref>（第 1–2 章：图的基础知识、图的搜索及其应用（表示、BFS、连通分量、DFS、拓扑排序、强连通分量））<\/span><\/li><li data-term='强连通分量'>强连通分量 — 有向图中任意两个顶点互相可达的极大子集；Kosaraju 算法在原图与反转图上各跑一遍 DFS 完成划分 <span class=glossary-ref>（第 1–2 章：图的基础知识、图的搜索及其应用（表示、BFS、连通分量、DFS、拓扑排序、强连通分量））<\/span><\/li><li data-term='最短路径长度 $\\mathrm{dist}(s,v)$'>最短路径长度 $\\mathrm{dist}(s,v)$ — 从起点 $s$ 到顶点 $v$ 的所有路径中边长之和的最小值；BFS 只在边长全为 1 时给出这个值 <span class=glossary-ref>（第 3 章：Dijkstra 最短路径算法（单源问题、Dijkstra 得分、贪心不变量与非负权正确性））<\/span><\/li><li data-term='dijkstra 得分'>Dijkstra 得分 — 对跨集合边 $(v,w)$，$v\\in X$、$w\\notin X$，得分定义为 $\\mathrm{len}(v)+A_{vw}$；主循环选得分最低的边把头顶点加入 $X$ <span class=glossary-ref>（第 3 章：Dijkstra 最短路径算法（单源问题、Dijkstra 得分、贪心不变量与非负权正确性））<\/span><\/li><li data-term='堆序不变量'>堆序不变量 — 堆中每个节点的键不大于其两个子节点的键；根节点因此是全堆最小键；数组形式下父子位置由 $\\lfloor i/2\\rfloor$、$2i$、$2i+1$ 确定 <span class=glossary-ref>（第 4 章：堆数据结构（堆操作、应用、数组形式实现与 Dijkstra 提速））<\/span><\/li><li data-term='二叉搜索树（bst）'>二叉搜索树（BST） — 满足左子树所有键小于节点键、右子树所有键大于节点键的树；Search、Min、Max、前驱、插入、删除均在 $O(\\text{高度})$ 时间完成 <span class=glossary-ref>（第 5–6 章：搜索树、散列表与布隆过滤器（BST 有序操作、旋转平衡、散列与冲突、布隆过滤器））<\/span><\/li><li data-term='负载因子'>负载因子 — 散列表中对象数与槽位数之比；开放地址法负载不超过 1，链地址法可超过 1，但平均桶长随负载增长 <span class=glossary-ref>（第 5–6 章：搜索树、散列表与布隆过滤器（BST 有序操作、旋转平衡、散列与冲突、布隆过滤器））<\/span><\/li><li data-term='散列函数'>散列函数 — 把对象键映射到槽位编号的函数；好的散列函数应把相似键分散到不同槽位，冲突尽量均匀 <span class=glossary-ref>（第 5–6 章：搜索树、散列表与布隆过滤器（BST 有序操作、旋转平衡、散列与冲突、布隆过滤器））<\/span><\/li><li data-term='布隆过滤器'>布隆过滤器 — 用多个散列函数与位数组实现的紧凑集合成员判断；只支持插入与查找，允许假阳性，不允许假阴性，不支持删除 <span class=glossary-ref>（第 5–6 章：搜索树、散列表与布隆过滤器（BST 有序操作、旋转平衡、散列与冲突、布隆过滤器））<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>模式库：图算法与数据结构选型模式<\/h1>\n<h2>模式 1：先定图口径，再选搜索载体<\/h2>\n<ul><li>\n<strong>触发<\/strong>：接到网络、关系、依赖类问题，需要遍历或分组。\n<\/li><li>\n<strong>步骤<\/strong>：先判无向/有向，再判需求（距离、归属、排序）；无向分组走 UCC，有向双向可达走 Kosaraju，等权距离走 BFS，次序归属走 DFS。\n<\/li><li>\n<strong>落点<\/strong>：搜索载体（BFS/DFS）不改变可达集合与最终划分，只改变访问次序；口径定错，后续算法全部错位。\n<\/li><li>\n<strong>边界<\/strong>：有向图不能套无向 UCC；单向可达与双向可达是两类口径。\n<\/ul>\n<h2>模式 2：集合扩张框架，按选边规则分流<\/h2>\n<ul><li>\n<strong>触发<\/strong>：算法维护&quot;已确定集合 <span class=\"katex-inline\">X<\/span>&quot;，每轮纳入一个新顶点。\n<\/li><li>\n<strong>步骤<\/strong>：初始化起点入 <span class=\"katex-inline\">X<\/span>；枚举跨集合边；按规则选边；纳入顶点并登记；重复到无跨边。BFS 选层序边，Dijkstra 选得分最低边。\n<\/li><li>\n<strong>落点<\/strong>：骨架复用，差别只在选边规则与距离递推式；等权递推 <span class=\"katex-inline\">+1<\/span>，加权递推 <span class=\"katex-inline\">+A_{vw}<\/span>。\n<\/li><li>\n<strong>边界<\/strong>：贪心锁定的正确性依赖非负权；含负权时入 <span class=\"katex-inline\">X<\/span> 不回改会保留错误值。\n<\/ul>\n<h2>模式 3：不变量拆分，先保形状再恢复次序<\/h2>\n<ul><li>\n<strong>触发<\/strong>：动态树形结构插入删除后需要恢复结构约束。\n<\/li><li>\n<strong>步骤<\/strong>：把约束分成形状不变量与次序不变量；插入先在空位保形状，再沿父链/子链恢复次序；堆用冒泡与下沉，BST 用挂叶与旋转。\n<\/li><li>\n<strong>落点<\/strong>：破坏点方向决定恢复路径：新键过小向上冒泡，补位键过大向下下沉；每步只处理父子局部。\n<\/li><li>\n<strong>边界<\/strong>：形状破坏导致下标映射错位，次序破坏导致极值失真；两类违反不能混在一个修复动作里。\n<\/ul>\n<h2>模式 4：取极值需求走优先队列，有序需求走搜索树<\/h2>\n<ul><li>\n<strong>触发<\/strong>：动态集合需要反复拿当前最优元素，或需要按键序查询。\n<\/li><li>\n<strong>步骤<\/strong>：只取极值、不遍历次序 → 堆；插入查找前驱后继范围切片 → BST；纯存在性极速判断 → 散列表。\n<\/li><li>\n<strong>落点<\/strong>：堆 <span class=\"katex-inline\">O(\\log n)<\/span> 插入抽取，根 <span class=\"katex-inline\">O(1)<\/span>；BST 操作 <span class=\"katex-inline\">O(h)<\/span>，平衡后对数级；散列表期望 <span class=\"katex-inline\">O(1)<\/span>。\n<\/li><li>\n<strong>边界<\/strong>：堆不支持有序遍历；BST 无平衡规则时退化链 <span class=\"katex-inline\">O(n)<\/span>；散列表不维护键序。\n<\/ul>\n<h2>模式 5：冲突与负载先算比值，再定扩容时机<\/h2>\n<ul><li>\n<strong>触发<\/strong>：散列表插入查找变慢，或需要组织同槽对象。\n<\/li><li>\n<strong>步骤<\/strong>：算 <span class=\"katex-inline\">\\alpha=n/m<\/span>；链地址法看平均链长，开放地址法看探查空位；超阈值翻倍槽位重散列；删除多选链地址，空间紧选开放地址。\n<\/li><li>\n<strong>落点<\/strong>：均匀散列下探查长度随负载线性增长；函数分布不良时，冲突策略只能在坏槽内排队。\n<\/li><li>\n<strong>边界<\/strong>：开放地址法负载到 1 无法再插；删除需墓碑；散列函数质量先于冲突策略决定查找代价。\n<\/ul>\n<h2>模式 6：近似结构按错误方向选空间权衡<\/h2>\n<ul><li>\n<strong>触发<\/strong>：大规模成员判断，允许偶发误报，存储受限。\n<\/li><li>\n<strong>步骤<\/strong>：确认不需要删除、不需要取值，只要存在性；多位散列位置位构成布隆过滤器；判&quot;一定不在&quot;直接拒绝，判&quot;可能在&quot;再查精确存储。\n<\/li><li>\n<strong>落点<\/strong>：布隆过滤器只许假阳性、不假阴性；位数、函数数、对象数共同决定误报率。\n<\/li><li>\n<strong>边界<\/strong>：标准布隆不支持删除；假阳性结果不能直接触发不可逆操作；需要精确取值仍要散列表或 BST。\n<\/ul>", "__cheatsheet__": "<h1>速查表：算法详解 卷2 图算法和数据结构<\/h1>\n<h2>1. 四章路线对照<\/h2>\n<ul><li>\n<strong>ch01 图基础与搜索<\/strong>：术语、邻接列表/矩阵、BFS、连通分量、DFS、拓扑排序、强连通分量（PDF 19–87）。\n<\/li><li>\n<strong>ch02 最短路径<\/strong>：单源问题口径、Dijkstra 得分选择与非负权正确性（PDF 88–105）。\n<\/li><li>\n<strong>ch03 堆<\/strong>：堆序不变量、数组表示、Insert/ExtractMin、应用与 Dijkstra 提速（PDF 106–134）。\n<\/li><li>\n<strong>ch04 搜索树与散列<\/strong>：BST 有序操作、旋转平衡、散列冲突、负载因子、布隆过滤器（PDF 135–198）。\n<\/ul>\n<h2>2. 图搜索算法对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>算法<\/th><th>数据结构<\/th><th>产出<\/th><th>前提<\/th><th>时间<\/th><\/tr><\/thead><tbody><tr><td>BFS<\/td><td>队列<\/td><td>层号 = 最少跳数<\/td><td>边权全 1<\/td><td><span class=\"katex-inline\">O(n+m)<\/span><\/td><\/tr><tr><td>DFS<\/td><td>栈/递归栈<\/td><td>完成次序、边分类<\/td><td>有限图<\/td><td><span class=\"katex-inline\">O(n+m)<\/span><\/td><\/tr><tr><td>UCC<\/td><td>BFS/DFS + 外层循环<\/td><td>连通分量编号<\/td><td>无向图<\/td><td><span class=\"katex-inline\">O(n+m)<\/span><\/td><\/tr><tr><td>拓扑排序<\/td><td>DFS 逆后序<\/td><td>DAG 合法顺序<\/td><td>无环<\/td><td><span class=\"katex-inline\">O(n+m)<\/span><\/td><\/tr><tr><td>Kosaraju<\/td><td>两遍 DFS<\/td><td>强连通分量<\/td><td>有向图<\/td><td><span class=\"katex-inline\">O(n+m)<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>3. 最短路径口径与算法<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>情形<\/th><th>问题存在有限解<\/th><th>可用思路<\/th><\/tr><\/thead><tbody><tr><td>边权全 1<\/td><td>是<\/td><td>BFS 求最少跳数<\/td><\/tr><tr><td>边权非负<\/td><td>是<\/td><td>Dijkstra 贪心锁定<\/td><\/tr><tr><td>含负权、无负环<\/td><td>是<\/td><td>多轮松弛可回改（本书未展开）<\/td><\/tr><tr><td>含负环<\/td><td>否，长度无下界<\/td><td>先检测负环<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>\n路径长度：<span class=\"katex-inline\">L(P)=\\sum A_{v_{i-1}v_i}<\/span>；<span class=\"katex-inline\">\\mathrm{dist}(s,v)=\\min L(P)<\/span>，不可达记 <span class=\"katex-inline\">+\\infty<\/span>。\n<\/li><li>\nDijkstra 得分：跨集合边 <span class=\"katex-inline\">(v,w)<\/span> 的 <span class=\"katex-inline\">\\mathrm{len}(v)+A_{vw}<\/span>；每轮取最低分边纳入 <span class=\"katex-inline\">X<\/span>。\n<\/li><li>\n正确性关键步：剩余路段非负压住反设路径；负权打破该步。\n<\/ul>\n<h2>4. 数据结构操作代价<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>结构<\/th><th>查找<\/th><th>插入<\/th><th>极值<\/th><th>有序遍历<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>有序数组<\/td><td><span class=\"katex-inline\">O(\\log n)<\/span><\/td><td><span class=\"katex-inline\">O(n)<\/span> 搬动<\/td><td>两端 <span class=\"katex-inline\">O(1)<\/span><\/td><td><span class=\"katex-inline\">O(n)<\/span><\/td><td>静态只读<\/td><\/tr><tr><td>堆<\/td><td>不支持按值查<\/td><td><span class=\"katex-inline\">O(\\log n)<\/span><\/td><td>根 <span class=\"katex-inline\">O(1)<\/span><\/td><td>不支持<\/td><td>只保父子极值<\/td><\/tr><tr><td>BST<\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><td>最左/右 <span class=\"katex-inline\">O(h)<\/span><\/td><td>中序 <span class=\"katex-inline\">O(n)<\/span><\/td><td>平衡后 <span class=\"katex-inline\">h=O(\\log n)<\/span><\/td><\/tr><tr><td>散列表<\/td><td>期望 <span class=\"katex-inline\">O(1)<\/span><\/td><td>期望 <span class=\"katex-inline\">O(1)<\/span><\/td><td>无<\/td><td>不支持<\/td><td>冲突看负载<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. 堆下标与操作备忘<\/h2>\n<ul><li>\n父节点：<span class=\"katex-inline\">\\lfloor i/2\\rfloor<\/span>（<span class=\"katex-inline\">i\\ge2<\/span>）；左子：<span class=\"katex-inline\">2i<\/span>；右子：<span class=\"katex-inline\">2i+1<\/span>。\n<\/li><li>\n堆序：父键 <span class=\"katex-inline\">\\le<\/span> 子键；根为全堆最小。\n<\/li><li>\nInsert：末尾追加 → 向上冒泡；ExtractMin：末尾补根 → 与较小子键交换下沉。\n<\/li><li>\n单次操作 <span class=\"katex-inline\">O(\\log n)<\/span>；建堆逐个插入 <span class=\"katex-inline\">O(n\\log n)<\/span>，Heapify 自底向上 <span class=\"katex-inline\">O(n)<\/span>；堆排序 <span class=\"katex-inline\">O(n\\log n)<\/span>，额外空间 <span class=\"katex-inline\">O(1)<\/span>。\n<\/li><li>\n0 起算数组：左子 <span class=\"katex-inline\">2i+1<\/span>，右子 <span class=\"katex-inline\">2i+2<\/span>，父 <span class=\"katex-inline\">\\lfloor(i-1)/2\\rfloor<\/span>。\n<\/ul>\n<h2>6. 散列表与布隆过滤器<\/h2>\n<ul><li>\n散列函数：键 → <span class=\"katex-inline\">\\{0,\\dots,m-1\\}<\/span>；要求分布均匀、计算快速、相似键分散。\n<\/li><li>\n链地址法：槽位挂链表；负载可超 1；删除摘链方便。\n<\/li><li>\n开放地址法：槽内探查空位；负载 <span class=\"katex-inline\">\\alpha&lt;1<\/span>；删除需墓碑标记。\n<\/li><li>\n负载因子 <span class=\"katex-inline\">\\alpha=n/m<\/span>；链地址法平均链长 <span class=\"katex-inline\">\\alpha<\/span>，成功查找约 <span class=\"katex-inline\">\\alpha/2<\/span>。\n<\/li><li>\n扩容：<span class=\"katex-inline\">\\alpha<\/span> 超阈值翻倍槽位并重散列。\n<\/li><li>\n布隆过滤器：<span class=\"katex-inline\">k<\/span> 个散列函数位置位；只支持插入查找；只许假阳性，不许假阴性；不支持删除。\n<\/ul>\n<h2>7. 复杂度速查<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>环节<\/th><th>朴素<\/th><th>堆优化<\/th><\/tr><\/thead><tbody><tr><td>Dijkstra 选边<\/td><td><span class=\"katex-inline\">O(mn)<\/span><\/td><td><span class=\"katex-inline\">O(m\\log n)<\/span><\/td><\/tr><tr><td>松弛合计<\/td><td><span class=\"katex-inline\">O(n+m)<\/span><\/td><td><span class=\"katex-inline\">O(n+m)<\/span><\/td><\/tr><tr><td>空间<\/td><td><span class=\"katex-inline\">O(n+m)<\/span><\/td><td><span class=\"katex-inline\">O(n+m)<\/span>，堆 <span class=\"katex-inline\">O(n)<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>\n图遍历总代价默认邻接列表口径；邻接矩阵下邻居扫描升到 <span class=\"katex-inline\">O(n)<\/span> 每顶点。\n<\/li><li>\n拓扑序不唯一；BST 中序为升序；堆不维护全局有序。\n<\/ul>"}};

  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
const ZS_VERSION = '1.9.0';
/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  const steps = manifest.learningPath||[];
  const passed = steps.filter(s=>(s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))).length;
  const lbl = document.getElementById('path-progress-label');
  if(lbl) lbl.textContent = `${passed}/${steps.length} 步`;
  $$('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  if(typeof vis !== 'undefined'){ networkLoaded = true; cb(); return; }
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE) { cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库未加载：离线构建请加 <code>--offline all</code>，或联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 掌握度（简化 BKT） ---------- */
function getMastery(cid){
  if(!cid) return 0.5;
  const m = (state.mastery||{})[cid];
  return m !== undefined ? m : 0.3;
}
function updateMastery(cid, delta){
  if(!cid) return;
  if(!state.mastery) state.mastery = {};
  const cur = state.mastery[cid] !== undefined ? state.mastery[cid] : 0.3;
  state.mastery[cid] = Math.max(0, Math.min(1, cur + delta));
  store.set('mastery', state.mastery);
}
function masteryBar(cid){
  const v = Math.round(getMastery(cid)*100);
  return `<div class="mastery-bar"><div style="width:${v}%"></div></div><span class="mastery-label">掌握度 ${v}%</span>`;
}

/* ---------- 搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIndex = null;
let pendingHl = [];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP = new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                        '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                        '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw = q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out = [];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length > 2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low = text.toLowerCase();
  let pos = -1, hit = '';
  for(const t of terms){ const i = low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start = Math.max(0, (pos<0?0:pos) - 60);
  const end = Math.min(text.length, (pos<0?0:pos) + 140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms = pendingHl.slice(); pendingHl = [];
  if(!terms.length) return;
  const root = $('#view'); if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first = null, idx = -1, term = '';
  while((node = walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low = node.nodeValue.toLowerCase();
    for(const t of terms){
      const i = low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){
        first = node; idx = i; term = t;
      }
    }
  }
  if(!first) return;
  try{
    const i = first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range = document.createRange();
    range.setStart(first, i); range.setEnd(first, i+term.length);
    const mark = document.createElement('mark');
    mark.className = 'hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'), 1800);
  }catch(e){}
}
document.addEventListener('click', (e)=>{
  const a = (e.target && e.target.closest) ? e.target.closest('.search-hit a') : null;
  if(a && a.dataset.hl) pendingHl = tokenizeQuery(a.dataset.hl);
});
function searchHref(id){
  const map = {'__path__':'#/path','__diagnosis__':'#/diagnosis','__graph__':'#/graph',
               '__cards__':'#/cards','__glossary__':'#/glossary','__patterns__':'#/patterns',
               '__cheatsheet__':'#/cheatsheet'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '#/quiz/'+id.replace('__quiz_','').replace(/__$/,'');
  if(id.startsWith('__')) return '';
  return '#/'+id;
}
function searchLabel(id){
  if((manifest.chapters||[]).some(c=>c.id===id)) return '章节：'+id;
  if((manifest.concepts||[]).some(c=>c.id===id)) return '概念：'+id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '测验';
  return id;
}
function pageTitle(id){
  const ch = (manifest.chapters||[]).find(c=>c.id===id);
  if(ch) return ch.title || id;
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp) return cp.title || id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')){
    const q = (manifest.quizzes||[]).find(x=>'__quiz_'+x.id===id);
    return q ? '测验 · '+String(q.question||'').slice(0,14) : '测验';
  }
  return id;
}
function chapOf(id){
  const chs = manifest.chapters || [];
  const ci = chs.findIndex(c=>c.id===id);
  if(ci >= 0) return {key:'ch:'+id, label:chs[ci].title||id, order:ci};
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp){
    const chId = (cp.chapterIds||[])[0];
    const i = chs.findIndex(c=>c.id===chId);
    if(i >= 0) return {key:'ch:'+chId, label:chs[i].title||chId, order:i};
    return {key:'zz', label:'未归入章节', order:900};
  }
  return {key:'tools', label:'术语与工具页', order:950, ref:true};
}
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    const href = searchHref(id);
    if(!href) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, href, text, label:pageTitle(id), chap:chapOf(id)});
  });
  return searchIndex;
}
function synOf(t){
  const out = [];
  for(const g of SYN_GROUPS){ if(g.indexOf(t) >= 0){ for(const x of g){ if(x !== t) out.push(x); } } }
  return out.slice(0,6);
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim();
  if(!v){ showPage(routeIdFromHash()); return; }
  const terms = tokenizeQuery(v);
  if(!terms.length){ showPage(routeIdFromHash()); return; }
  const grams = [];
  terms.forEach(t=>{ if(t.length >= 2){ for(let i=0;i+2<=t.length;i++) grams.push(t.slice(i,i+2)); } });
  const qGrams = [...new Set(grams)].slice(0,16);
  const snippetTerms = terms.concat(...terms.map(synOf)).slice(0,24);
  const hits = [];
  buildSearchIndex().forEach(p=>{
    const low = p.text.toLowerCase();
    let tHit = 0, sHit = 0, gHit = 0, first = '', viaSyn = '';
    for(const t of terms){
      if(low.includes(t)){ tHit++; if(!first) first = t; continue; }
      for(const s of synOf(t)){
        if(low.includes(s)){ sHit++; if(!viaSyn) viaSyn = s; if(!first) first = s; break; }
      }
    }
    for(const gm of qGrams){ if(low.includes(gm)) gHit++; }
    if(tHit > 0 || sHit > 0 || gHit >= 4){
      hits.push({p, score: tHit*100 + sHit*30 + Math.min(gHit,20), first, viaSyn});
    }
  });
  hits.sort((a,b)=> b.score-a.score || a.p.text.length-b.p.text.length);
  const top = hits.slice(0,20);
  let body;
  if(top.length){
    const gs = {};
    top.forEach(h=>{
      const k = h.p.chap.key;
      (gs[k] = gs[k] || {label:h.p.chap.label, order:h.p.chap.order, ref:!!h.p.chap.ref, hits:[]}).hits.push(h);
    });
    const eff = g => Math.max(...g.hits.map(x=>x.score)) * (g.ref ? 0.55 : 1);
    const order = Object.values(gs).sort((a,b)=> eff(b)-eff(a));
    body = order.map(g=>{
      const inner = g.hits.sort((a,b)=> b.score-a.score).map(h=>
        `<div class="search-hit"><a href="${h.p.href}" data-hl="${esc(h.first)}">${esc(h.p.label)}</a>${h.viaSyn?`<span class="syn-note">同义命中：${esc(h.viaSyn)}</span>`:''}<br><span class="sub">${hlSnippet(h.p.text, snippetTerms)}</span></div>`).join('');
      return `<div class="search-group"><div class="grp-head">${esc(g.label)}<span class="grp-count">${g.hits.length}</span></div>${inner}</div>`;
    }).join('');
  } else {
    body = '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语，或减少关键词。</div>';
  }
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' + body;
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof mermaid === 'undefined') return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  if(typeof mermaid !== 'undefined'){ boot(); return; }
  const urls=['https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js',
              'https://registry.npmmirror.com/mermaid/10.9.1/files/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js'];
  let ui=0, done=false;
  const tryNext=()=>{
    if(done || ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    const timer=setTimeout(()=>{ if(done) return; s.onload=null; s.onerror=null; s.remove(); tryNext(); }, 4000);
    s.onload=()=>{ done=true; clearTimeout(timer); boot(); };
    s.onerror=()=>{ clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

let citePop = null;
function closeCite(){ if(citePop){ citePop.remove(); citePop = null; } }
function showCite(id){
  const c = (typeof SOURCES !== 'undefined') ? SOURCES[id] : null;
  if(!c) return;
  closeCite();
  citePop = document.createElement('div');
  citePop.className = 'cite-pop';
  citePop.innerHTML = '<div class="cite-head">出处' + (c.page!=='' && c.page!=null ? (' · p.'+esc(String(c.page))) : '') +
    '<button class="cite-x" aria-label="关闭">×</button></div>' +
    (c.quote ? '<blockquote>'+esc(c.quote)+'</blockquote>' : '') +
    (c.zh ? '<div class="cite-zh">'+esc(c.zh)+'</div>' : '');
  document.body.appendChild(citePop);
  citePop.querySelector('.cite-x').onclick = closeCite;
}
document.addEventListener('click', e=>{

});

<script id="zs-visual-init">
(function(){
  try{
    var B=document.body, H=document.documentElement;
    if(!B.dataset.theme && !H.dataset.theme) B.dataset.theme='dark';
    var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
    var scope=document.querySelectorAll('header, .topbar, .topbar-fixed, #topbar, .sidebar, .tabs, .hdr-right, .card-actions, .card-controls, .section-title, .card .icon, .icon-label');
    for(var i=0;i<scope.length;i++){
      var w=document.createTreeWalker(scope[i],NodeFilter.SHOW_TEXT,null,false), n;
      while(n=w.nextNode()){
        if(EMOJI.test(n.nodeValue)){
          n.nodeValue=n.nodeValue.replace(EMOJI,'').replace(/[ \t]+/g,' ').replace(/^ | $/g,'');
        }
      }
    }
    var btn=document.getElementById('theme-btn')||document.getElementById('theme')||document.getElementById('themeToggle');
    function label(){
      if(!btn) return;
      var light=B.dataset.theme==='light'||H.getAttribute('data-theme')==='light'||B.dataset.theme==='';
      if(btn.textContent.trim()===''||/浅色|深色/.test(btn.textContent)) btn.textContent=light?'深色':'浅色';
    }
    label();
    if(btn){
      new MutationObserver(label).observe(B,{attributes:true,attributeFilter:['data-theme']});
      new MutationObserver(label).observe(H,{attributes:true,attributeFilter:['data-theme']});
      btn.addEventListener('click',function(){setTimeout(label,0);},true);
    }
  }catch(e){}
})();
</script>
