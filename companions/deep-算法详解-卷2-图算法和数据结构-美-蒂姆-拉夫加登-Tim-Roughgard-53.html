边数与顶点数同阶；遍历邻居为主选邻接列表，矩阵条目 40000 而有边条目 380。\n<\/li><li>\n<span class=\"katex-inline\">n=50<\/span>，<span class=\"katex-inline\">m=1200<\/span>：<span class=\"katex-inline\">m<\/span> 接近 <span class=\"katex-inline\">n^2/2<\/span>，稠密；若程序频繁判断两顶点是否相邻，矩阵的 <span class=\"katex-inline\">O(1)<\/span> 查边更稳。\n<\/li><li>\n<span class=\"katex-inline\">n=10000<\/span>，<span class=\"katex-inline\">m=15000<\/span>：稀疏大图；列表条目 30000，矩阵条目 <span class=\"katex-inline\">10^8<\/span>，列表空间优势随规模拉大。\n<\/ol>\n<p>三组数字覆盖稀疏、稠密、大图稀疏三个常见位置；判断顺序都是先估 <span class=\"katex-inline\">m<\/span> 对 <span class=\"katex-inline\">n^2<\/span> 的比值，再核对高频操作类型。<\/p>\n<h2>第二组对照：简单图口径之外需要补什么<\/h2>\n<p>基本术语讨论简单图：顶点对之间至多一条边，不含自环。落地真实场景时常见三种扩展，各有约定成本：<\/p>\n<ul><li>\n<strong>多重边<\/strong>：同一对顶点之间多条边，邻接矩阵单条目放不下，需在条目内挂列表或计数组。\n<\/li><li>\n<strong>自环<\/strong>：顶点连向自身，在度统计中按约定计两次（无向）；矩阵对角条目需要单独解释。\n<\/li><li>\n<strong>带权边<\/strong>：列表条目附带长度，矩阵条目存边长；无权图的 0/1 判定升级为数值比较。\n<\/ul>\n<p>本书后续章节的图算法以简单有向/无向图加非负边长为主；遇到上述扩展，先确认表示能否承载，再套用算法结论。<\/p>\n<p><strong>案例 4：把表示成本记反<\/strong>。常见误写是&quot;邻接矩阵省空间，因为不用存指针&quot;。复盘：指针开销只在列表的表头与链接处，矩阵省掉的是指针，换回的是 <span class=\"katex-inline\">n^2<\/span> 个条目；稀疏图上条目空位的代价远高于指针。记成本时分别列出存储项：列表 <span class=\"katex-inline\">n<\/span> 表头加 <span class=\"katex-inline\">2m<\/span> 条目，矩阵 <span class=\"katex-inline\">n^2<\/span> 条目，不要只比单项。<\/p>\n<p><strong>案例 5：有向图套用无向邻接口径<\/strong>。无向列表把邻居双向登记，有向图若照做，出边信息被入边信息覆盖；需要两个方向各维护一份序列，或者在遍历时只读出边表。复盘：表示层的方向约定必须与图类型一致，类型在建模阶段确定，不在遍历阶段临时补。<\/p>\n<h2>表示选择速查清单<\/h2>\n<ul><li>\n先估 <span class=\"katex-inline\">n<\/span>、<span class=\"katex-inline\">m<\/span>，算 <span class=\"katex-inline\">m<\/span> 对 <span class=\"katex-inline\">n^2<\/span> 的比值；\n<\/li><li>\n高频操作是遍历邻居 → 列表优先；高频操作是查单条边 → 矩阵优先；\n<\/li><li>\n稀疏大图 <span class=\"katex-inline\">(m=O(n))<\/span> 直接选列表；稠密近完全图选矩阵；\n<\/li><li>\n多重边、自环、带权边先确认表示能否承载，再选结构；\n<\/li><li>\n算法分析里的 <span class=\"katex-inline\">O(m+n)<\/span> 结论默认邻接列表口径，换矩阵要重算遍历代价。\n<\/ul>\n<h2>差生通读检查（补充）<\/h2>\n<ul><li>\n<strong>卡在&quot;为什么列表遍历邻居是线性而矩阵不是&quot;<\/strong>：回到步骤 5，列表存的就是邻居本身，读出即输出；矩阵把非邻居也铺在行里，必须逐个排除。输出规模相同，排除空条目的工作量不同。\n<\/li><li>\n<strong>卡在&quot;稀疏稠密没有硬界线&quot;<\/strong>：界线是 <span class=\"katex-inline\">m<\/span> 与 <span class=\"katex-inline\">n^2<\/span> 的比值；<span class=\"katex-inline\">m=O(n\\log n)<\/span> 仍属稀疏，<span class=\"katex-inline\">m=\\Theta(n^2)<\/span> 才称稠密，中间情形按高频查询类型定表示。\n<\/li><li>\n<strong>卡在&quot;度和等式怎么用来查错&quot;<\/strong>：统计完度序列先求和，奇数和直接说明计数有误；有向图再分别核出度和、入度和是否都等于 <span class=\"katex-inline\">m<\/span>。\n<\/ul>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n一个 <span class=\"katex-inline\">n=6<\/span> 的无向图有 7 条边，邻接列表的邻居条目总数是多少？写出推导等式。\n<\/li><li>\n邻接矩阵判断 <span class=\"katex-inline\">(v,w)<\/span> 存在性的时间是多少？邻接列表在最坏情况下受哪个量约束？\n<\/li><li>\n有向图中入度之和与出度之和各等于什么？若二者不相等，统计环节可能出了什么错？\n<\/li><li>\n为什么稀疏图上邻接矩阵的空条目占比随 <span class=\"katex-inline\">n<\/span> 增大而升高？\n<\/li><li>\n建模&quot;关注关系&quot;与&quot;好友关系&quot;时，各应选有向图还是无向图？说明理由。\n<\/ol><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：算法详解 卷2 图算法和数据结构.pdf · p.41<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">图的基本术语与邻接列表、邻接矩阵两种表示<\/a><\/span><\/div><h1>宽度优先搜索（BFS）：访问层数与无权最短路径<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch01（原书 §2.2，PDF 第 41–49 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>宽度优先搜索（Breadth-First Search, BFS）从起点 <span class=\"katex-inline\">s<\/span> 出发，用队列维护待扩张顶点，按&quot;距 <span class=\"katex-inline\">s<\/span> 的边数&quot;由近及远逐层访问；在每条边权值相同（取 1）的图上，顶点被访问时登记的层数就是从 <span class=\"katex-inline\">s<\/span> 到该顶点的无权最短路径跳数。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>给定一张网络，要回答&quot;从起点到每个顶点最少走几条边&quot;。朴素做法是枚举所有路径再比长度，路径数随顶点数指数增长，不可行。需要一种只沿边走一遍、就能把每个顶点的最短跳数定下来的搜索过程。<\/p>\n<p>不用 BFS 会出两类问题。第一类是访问次序混乱：沿一条岔路扎到底（DFS 式走法），先访问到的顶点未必离起点近，用先发现次序充当距离会把距离算大。第二类是重复访问与漏访问：没有已访问标记，同一顶点可能被多条路径反复推入队列；标记规则不清，又可能把不可达顶点误判为已访问。BFS 用队列保证近层先于远层扩张，用已访问标记保证每个顶点只入队一次，把&quot;最短跳数&quot;与&quot;访问次序&quot;两件事同时定住。<\/p>\n<p>具体场景：社交网络要算出每个账号距新人账号的间隔层数，路网软件在等权街区图上估算最少转弯次数。这类问题的共同结构是&quot;边数最少&quot;，不是&quot;路程最短&quot;。若没有按层扩张的过程，逐路径枚举会随顶点数爆炸；若次序不受控，距离标签会被先到先得的偶然顺序带偏。BFS 把扩张次序固定为层序，使距离可以被归纳证明，而不是凭个别例子猜出来。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>起点 <span class=\"katex-inline\">s<\/span><\/strong>：搜索的根，层数 <span class=\"katex-inline\">d(s)=0<\/span>。<\/p>\n<p><strong>队列 <span class=\"katex-inline\">Q<\/span><\/strong>：先进先出结构，存放已发现但尚未扩张的顶点。初始化时 <span class=\"katex-inline\">Q<\/span> 只含 <span class=\"katex-inline\">s<\/span>。<\/p>\n<p><strong>已访问标记<\/strong>：顶点一旦入队即标记，防止后续边再次把它推入；标记时机是入队时，不是出队时。<\/p>\n<p><strong>层（level）<\/strong>：<span class=\"katex-inline\">d(v)<\/span> 记录 <span class=\"katex-inline\">v<\/span> 距 <span class=\"katex-inline\">s<\/span> 的最少边数。<span class=\"katex-inline\">s<\/span> 在第 0 层；第 <span class=\"katex-inline\">k<\/span> 层顶点由第 <span class=\"katex-inline\">k-1<\/span> 层顶点的未访问邻居构成。<\/p>\n<p><strong>BFS 过程<\/strong>：<\/p>\n<ol><li>\n初始化 <span class=\"katex-inline\">d(s)=0<\/span>，其余顶点未标记，<span class=\"katex-inline\">Q=[s]<\/span>。\n<\/li><li>\n出队头部顶点 <span class=\"katex-inline\">u<\/span>，扫描 <span class=\"katex-inline\">u<\/span> 的全部邻居 <span class=\"katex-inline\">w<\/span>。\n<\/li><li>\n若 <span class=\"katex-inline\">w<\/span> 未标记，标记 <span class=\"katex-inline\">w<\/span>，令 <span class=\"katex-inline\">d(w)=d(u)+1<\/span>，入队 <span class=\"katex-inline\">Q<\/span>。\n<\/li><li>\n重复直到 <span class=\"katex-inline\">Q<\/span> 为空；未标记顶点即从 <span class=\"katex-inline\">s<\/span> 不可达。\n<\/ol>\n<p><strong>最短路径长度（无权口径）<\/strong>：<span class=\"katex-inline\">\\mathrm{dist}(s,v)<\/span> 是 <span class=\"katex-inline\">s<\/span> 到 <span class=\"katex-inline\">v<\/span> 的路径中边数的最小值；BFS 给出的 <span class=\"katex-inline\">d(v)<\/span> 在边权全 1 时等于这个值。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">s<\/span> 邻居为 <span class=\"katex-inline\">a,b<\/span>；<span class=\"katex-inline\">a<\/span> 邻居为 <span class=\"katex-inline\">c<\/span>。BFS 次序：<span class=\"katex-inline\">s<\/span>（层 0）→ <span class=\"katex-inline\">a,b<\/span>（层 1）→ <span class=\"katex-inline\">c<\/span>（层 2），<span class=\"katex-inline\">d(c)=2<\/span>。<\/p>\n<p><strong>反例<\/strong>：边权不等时，路径 <span class=\"katex-inline\">s\\to a\\to c<\/span> 长 <span class=\"katex-inline\">1+10=11<\/span>，直达 <span class=\"katex-inline\">s\\to c<\/span> 长 4；按跳数 BFS 会把 <span class=\"katex-inline\">c<\/span> 记为层 1，但总长最短路径仍是直达。跳数最短不等于总长最短，BFS 结论只在等权口径下成立。<\/p>\n<h2>原理推导：层数等于最少跳数的证明<\/h2>\n<p>下面按归纳方向逐步证明 <span class=\"katex-inline\">d(v)=\\mathrm{dist}(s,v)<\/span>。<\/p>\n<ol><li>\n<strong>基例<\/strong>：<span class=\"katex-inline\">d(s)=0<\/span>，<span class=\"katex-inline\">\\mathrm{dist}(s,s)=0<\/span>，相等。\n<\/li><li>\n<strong>上界<\/strong>：顶点 <span class=\"katex-inline\">w<\/span> 由 <span class=\"katex-inline\">u<\/span> 扩展入队时，存在一条 <span class=\"katex-inline\">s\\to u\\to w<\/span> 的路径，长 <span class=\"katex-inline\">d(u)+1<\/span>；按归纳假设 <span class=\"katex-inline\">d(u)=\\mathrm{dist}(s,u)<\/span>，故 <span class=\"katex-inline\">\\mathrm{dist}(s,w)\\le d(u)+1=d(w)<\/span>。\n<\/li><li>\n<strong>下界<\/strong>：反设存在长度小于 <span class=\"katex-inline\">d(w)<\/span> 的路径到达 <span class=\"katex-inline\">w<\/span>。沿该路径取倒数第二个顶点 <span class=\"katex-inline\">x<\/span>，<span class=\"katex-inline\">x<\/span> 的层数按归纳假设已是其最少跳数；<span class=\"katex-inline\">w<\/span> 会在 <span class=\"katex-inline\">x<\/span> 被扩张的那一轮入队，层号不超过 <span class=\"katex-inline\">d(x)+1<\/span>，与 <span class=\"katex-inline\">w<\/span> 首次在第 <span class=\"katex-inline\">d(w)<\/span> 层入队矛盾。故 <span class=\"katex-inline\">\\mathrm{dist}(s,w)\\ge d(w)<\/span>。\n<\/li><li>\n<strong>相合<\/strong>：上下界相等，<span class=\"katex-inline\">d(w)=\\mathrm{dist}(s,w)<\/span>。\n<\/li><li>\n<strong>时间代价<\/strong>：每个顶点入队一次，每条无向边在两端各被扫描一次（有向边一次），全部扫描合计 <span class=\"katex-inline\">O(n+m)<\/span>；队列操作每个顶点常数次。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：图有限；每条边权值相同（无权图，或权值全取 1）；求的是最少边数路径。\n<\/li><li>\n边界 1：边权不等时，BFS 层数不再等于总长最短路径，需要第 3 章的 Dijkstra。\n<\/li><li>\n边界 2：BFS 只回答可达性与跳数，不直接给出路径上的中间顶点；要还原路径需记录每个顶点的前驱指针。\n<\/li><li>\n边界 3：有向图上 BFS 沿出边方向扩张，可达性是单向的；不能把出边邻居当成双向邻居。\n<\/li><li>\n失败案例：把标记时机放在出队时，同一顶点被多条入边反复入队，队列膨胀，<span class=\"katex-inline\">O(n+m)<\/span> 结论失效；标记必须在入队瞬间完成。\n<\/li><li>\n失败案例：在带负权或混合权图上套用 BFS 层数结论，把跳数当总长，得到的路线可能绕远。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>BFS vs DFS<\/strong>：BFS 用队列按层扩张，回答距离与可达范围；DFS 用栈（或递归调用栈）走到底再回退，回答次序与归属。连通图上两者访问到的顶点集合相同，给出的次序与结论不同。\n<\/li><li>\n<strong>最少跳数 vs 最短总长<\/strong>：前者只数边的条数，后者数边权之和；边权全 1 时两者重合，权值不等时分开。\n<\/li><li>\n<strong>访问标记 vs 距离登记<\/strong>：标记防止重复入队，距离登记记录层号；二者绑定在同一顶点上，但职责不同——标记管&quot;去不去重&quot;，层号管&quot;距离是多少&quot;。\n<\/li><li>\n<strong>BFS 树 vs 原图<\/strong>：BFS 过程中每个顶点由某条入队边确定前驱，这些边构成一棵 BFS 树；树给出最短跳数路径，原图中其余边不参与距离登记。\n<\/li><li>\n<strong>层号标签 vs 连通分量<\/strong>：层号描述单点到起点的距离，分量描述一组顶点互相可达；前者是搜索结果标签，后者是按可达性切出的顶点块。一次 BFS 只能给出起点所在分量的内部距离标签。\n<\/li><li>\n<strong>队列操作 vs 距离比较<\/strong>：BFS 选下一个扩张顶点时不比较路径总长，只按入队顺序；这与 Dijkstra 每轮比较得分不同。等权前提下层序等价于得分序，加权前提下两者分开。\n<\/ul>\n<h2>常见误判<\/h2>\n<ul><li>\n误判：BFS 能在任意图上找最短路径。实际只能找最少跳数路径；边长不等时最短总长要换加权算法。\n<\/li><li>\n误判：先被访问的顶点距离更近。访问次序由队列决定，在 DFS 式次序中先访问可以是远层；只有 BFS 的层序才与近远一致。\n<\/li><li>\n误判：BFS 结束后未标记顶点距离为 0。未标记表示不可达，距离记 <span class=\"katex-inline\">+\\infty<\/span>，与起点自身的层 0 完全不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的邻接列表表示是 BFS 扫描邻居的输入格式。后继：c03 的连通分量划分以 BFS/DFS 的可达集合为单位；c05 指出 BFS 在加权图上失效的边界，引出 c06 的 Dijkstra；BFS 的&quot;已处理集合逐步扩张&quot;框架被第 3 章沿用，只替换选边规则。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（宽度优先搜索（BFS）：访问层数与无权最短路径）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：BFS 依赖链、层数证明、小图逐步推演与失效边界<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把 BFS 的距离结论讲清，往回追四层：<\/p>\n<ol><li>\n<strong>图的表示与可达性<\/strong>：先能列出一个顶点的全部邻居（c01 邻接列表），搜索才有扩张方向；可达性定义为沿边是否存在路径。\n<\/li><li>\n<strong>访问次序约束<\/strong>：近层顶点必须先于远层顶点扩张，这要求队列的先进先出性质；栈式次序不保证近先远后。\n<\/li><li>\n<strong>去重规则<\/strong>：入队即标记，保证每顶点一次入队，代价线性；标记时机错放会破坏线性结论。\n<\/li><li>\n<strong>距离口径<\/strong>：层数登记的是最少边数；结论成立的前提是边权全 1，离开这个前提距离口径改变。\n<\/ol>\n<p>依赖链方向：表示与可达性 → 队列次序 → 入队标记 → 层数等于最少跳数。<\/p>\n<h2>正向推导：从初始化到最短跳数结论<\/h2>\n<p>下面一步步推出 BFS 的距离正确性与运行时间。<\/p>\n<p><strong>步骤 1：初始化<\/strong>。起点 <span class=\"katex-inline\">s<\/span> 入队，<span class=\"katex-inline\">d(s)=0<\/span>；其余顶点未标记。队列 <span class=\"katex-inline\">Q<\/span> 只含 <span class=\"katex-inline\">s<\/span>。已访问集合一开始只有 <span class=\"katex-inline\">s<\/span>。<\/p>\n<p><strong>步骤 2：扩张一轮<\/strong>。出队头部 <span class=\"katex-inline\">u<\/span>，逐条考察邻居 <span class=\"katex-inline\">w<\/span>：未标记则标记、令 <span class=\"katex-inline\">d(w)=d(u)+1<\/span>、入队；已标记跳过。已标记顶点不再进入队列，因此同一顶点不会被第二条路径再次登记。<\/p>\n<p><strong>步骤 3：层间递推<\/strong>。第 <span class=\"katex-inline\">k-1<\/span> 层顶点全部出队后，它们扩展出的新顶点构成第 <span class=\"katex-inline\">k<\/span> 层。队列按入队顺序排列，第 <span class=\"katex-inline\">k<\/span> 层顶点排在第 <span class=\"katex-inline\">k-1<\/span> 层之后，扩张次序与层号一致。<\/p>\n<p><strong>步骤 4：上界归纳<\/strong>。基例 <span class=\"katex-inline\">d(s)=0=\\mathrm{dist}(s,s)<\/span>。设所有层号小于 <span class=\"katex-inline\">k<\/span> 的顶点满足 <span class=\"katex-inline\">d=\\mathrm{dist}<\/span>。顶点 <span class=\"katex-inline\">w<\/span> 由层 <span class=\"katex-inline\">k-1<\/span> 的 <span class=\"katex-inline\">u<\/span> 扩展，存在长 <span class=\"katex-inline\">d(u)+1<\/span> 的路径到 <span class=\"katex-inline\">w<\/span>，故 <span class=\"katex-inline\">\\mathrm{dist}(s,w)\\le d(w)<\/span>。<\/p>\n<p><strong>步骤 5：下界归纳<\/strong>。反设 <span class=\"katex-inline\">w<\/span> 存在更短路径 <span class=\"katex-inline\">P<\/span>，长度 <span class=\"katex-inline\">r&lt;d(w)<\/span>。<span class=\"katex-inline\">P<\/span> 上倒数第二个顶点 <span class=\"katex-inline\">x<\/span> 按归纳假设层数为 <span class=\"katex-inline\">\\mathrm{dist}(s,x)=r-1<\/span>；<span class=\"katex-inline\">x<\/span> 出队时 <span class=\"katex-inline\">w<\/span> 作为未访问邻居被发现并入队，层号至多 <span class=\"katex-inline\">r<\/span>，与 <span class=\"katex-inline\">d(w)&gt;r<\/span> 矛盾。故 <span class=\"katex-inline\">\\mathrm{dist}(s,w)\\ge d(w)<\/span>。<\/p>\n<p><strong>步骤 6：结论与代价<\/strong>。上下界相合，<span class=\"katex-inline\">d(w)=\\mathrm{dist}(s,w)<\/span>。时间上：<span class=\"katex-inline\">n<\/span> 个顶点各入队出队一次；无向图每条边在两端各扫描一次，共 <span class=\"katex-inline\">2m<\/span> 次邻居检查；合计 <span class=\"katex-inline\">O(n+m)<\/span>。空间上：队列与标记表 <span class=\"katex-inline\">O(n)<\/span>。<\/p>\n<h2>数值算例一：六顶点无向图逐步跑 BFS<\/h2>\n<p>取顶点 <span class=\"katex-inline\">\\{s,a,b,c,d,e\\}<\/span>，边 <span class=\"katex-inline\">(s,a)<\/span>、<span class=\"katex-inline\">(s,b)<\/span>、<span class=\"katex-inline\">(a,c)<\/span>、<span class=\"katex-inline\">(b,c)<\/span>、<span class=\"katex-inline\">(b,d)<\/span>、<span class=\"katex-inline\">(c,e)<\/span>。<\/p>\n<p><strong>初始化<\/strong>：<span class=\"katex-inline\">Q=[s]<\/span>，<span class=\"katex-inline\">d(s)=0<\/span>，其余未标记。<\/p>\n<p><strong>第 1 轮<\/strong>：出队 <span class=\"katex-inline\">s<\/span>。邻居 <span class=\"katex-inline\">a<\/span>：未标记，<span class=\"katex-inline\">d(a)=1<\/span>，入队；邻居 <span class=\"katex-inline\">b<\/span>：未标记，<span class=\"katex-inline\">d(b)=1<\/span>，入队。<span class=\"katex-inline\">Q=[a,b]<\/span>。<\/p>\n<p><strong>第 2 轮<\/strong>：出队 <span class=\"katex-inline\">a<\/span>。邻居 <span class=\"katex-inline\">s<\/span> 已标记；邻居 <span class=\"katex-inline\">c<\/span>：未标记，<span class=\"katex-inline\">d(c)=2<\/span>，入队。<span class=\"katex-inline\">Q=[b,c]<\/span>。<\/p>\n<p><strong>第 3 轮<\/strong>：出队 <span class=\"katex-inline\">b<\/span>。邻居 <span class=\"katex-inline\">s<\/span> 已标记；邻居 <span class=\"katex-inline\">c<\/span> 已标记；邻居 <span class=\"katex-inline\">d<\/span>：未标记，<span class=\"katex-inline\">d(d)=2<\/span>，入队。<span class=\"katex-inline\">Q=[c,d]<\/span>。<\/p>\n<p><strong>第 4 轮<\/strong>：出队 <span class=\"katex-inline\">c<\/span>。邻居 <span class=\"katex-inline\">a,b<\/span> 已标记；邻居 <span class=\"katex-inline\">e<\/span>：未标记，<span class=\"katex-inline\">d(e)=3<\/span>，入队。<span class=\"katex-inline\">Q=[d,e]<\/span>。<\/p>\n<p><strong>第 5 轮<\/strong>：出队 <span class=\"katex-inline\">d<\/span>，邻居 <span class=\"katex-inline\">b<\/span> 已标记；出队 <span class=\"katex-inline\">e<\/span>，邻居 <span class=\"katex-inline\">c<\/span> 已标记。队列为空。<\/p>\n<p><strong>结果<\/strong>：层 0 <span class=\"katex-inline\">\\{s\\}<\/span>，层 1 <span class=\"katex-inline\">\\{a,b\\}<\/span>，层 2 <span class=\"katex-inline\">\\{c,d\\}<\/span>，层 3 <span class=\"katex-inline\">\\{e\\}<\/span>。核验最短跳数：<span class=\"katex-inline\">s\\to e<\/span> 经 <span class=\"katex-inline\">c<\/span> 为 3 跳；不存在两跳路径到 <span class=\"katex-inline\">e<\/span>，<span class=\"katex-inline\">d(e)=3<\/span> 与最少跳数一致。<\/p>\n<p><strong>前驱还原路径<\/strong>：<span class=\"katex-inline\">e<\/span> 的前驱是 <span class=\"katex-inline\">c<\/span>，<span class=\"katex-inline\">c<\/span> 的前驱是 <span class=\"katex-inline\">a<\/span>（或 <span class=\"katex-inline\">b<\/span>，取决于谁先发现），<span class=\"katex-inline\">a<\/span> 的前驱是 <span class=\"katex-inline\">s<\/span>；回溯得 <span class=\"katex-inline\">s\\to a\\to c\\to e<\/span>。<\/p>\n<h2>数值算例二：不等权图上 BFS 层数失效对照<\/h2>\n<p>取边 <span class=\"katex-inline\">(s,a)=1<\/span>、<span class=\"katex-inline\">(a,c)=10<\/span>、<span class=\"katex-inline\">(s,c)=4<\/span>。BFS 按跳数执行：<span class=\"katex-inline\">s<\/span> 层 0，<span class=\"katex-inline\">a,c<\/span> 同被发现入队，<span class=\"katex-inline\">d(c)=1<\/span>。但总长比较：直达路径长 4，绕行路径长 <span class=\"katex-inline\">1+10=11<\/span>，<span class=\"katex-inline\">\\mathrm{dist}(s,c)=4<\/span>，BFS 登记的层号 1 不等于总长最短跳数口径下的总长。<\/p>\n<p>对照说明：BFS 证明第 4、5 步依赖&quot;每条边贡献相同代价&quot;；边长不等时，层号只记录边数，不再压住总长比较。此例中 <span class=\"katex-inline\">c<\/span> 的跳数确实是 1，但总长最短路线不能由层号读出。补救方向是第 3 章按得分扩张的 Dijkstra。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：标记放在出队时<\/strong>。同一顶点 <span class=\"katex-inline\">w<\/span> 被 <span class=\"katex-inline\">u_1,u_2<\/span> 先后发现，两次都入队；队列中 <span class=\"katex-inline\">w<\/span> 出现两次，后续扩张又重复扫描其邻居。复盘：入队瞬间标记，后续发现直接跳过，入队次数才是一次。<\/p>\n<p><strong>案例 2：把 BFS 层号当加权距离<\/strong>。混合边长图上用层号报路线代价，跳数少的路线可能总长更大；复盘：先确认边权口径，等权图才用 BFS 距离，不等权换加权算法。<\/p>\n<p><strong>案例 3：有向图按双向邻居扩张<\/strong>。把出边列表当成无向邻居表扫描，可达范围被放大；复盘：有向 BFS 只沿出边走，入边方向不在本次搜索范围。<\/p>\n<p><strong>案例 4：不可达顶点留空标记<\/strong>。算法结束后未标记顶点未被检查，汇报时把它们与层号 <span class=\"katex-inline\">+\\infty<\/span> 混在一起；复盘：结束后区分已标记可达与未标记不可达两类。<\/p>\n<h2>延伸推演：BFS 树与原图边的分类<\/h2>\n<p>BFS 过程中，每个顶点除起点外由一条入队边确定前驱，全部前驱边构成 BFS 树。原图其余边分两类对照：<\/p>\n<ol><li>\n<strong>树边<\/strong>：发现新顶点的边，登记层号与前驱。\n<\/li><li>\n<strong>非树边<\/strong>：两端都已标记的边。在无权无向图上，非树边连接的顶点层号差不超过 1；若层号差达到 2，沿该边可构造更短路径，与 BFS 层号结论冲突。\n<\/ol>\n<p>这条分类在 c04 的 DFS 边分类中对照阅读：DFS 的非树边分回边、前向边、横叉边，BFS 的非树边层级约束更弱。<\/p>\n<h2>延伸推演二：BFS 的两个派生用途<\/h2>\n<p><strong>连通范围统计<\/strong>：一次 BFS 结束后，已标记集合就是 <span class=\"katex-inline\">s<\/span> 的可达集合；这是 c03 UCC 算法的基本块。反复取未标记顶点发起 BFS，即可切出全部连通分量。<\/p>\n<p><strong>分层距离标签<\/strong>：层号本身是一种图结构特征，用于网络圈层分析、扩散范围估计；标签只在等权口径下解释为距离，跨权场景只能称&quot;跳数层&quot;。<\/p>\n<h2>对抗性追问：队列换成栈会怎样<\/h2>\n<p>追问：把 BFS 的队列换成栈，算法还能不能给出最短跳数？<\/p>\n<ol><li>\n栈后进先出，新发现的顶点被优先扩张，搜索沿一条路径扎到底，成为 DFS 次序。\n<\/li><li>\n先发现次序不再按层排列，先访问的顶点可能层数更大；用发现次序登记距离，下界归纳（步骤 5）不成立。\n<\/li><li>\n可达集合仍完整（连通图上访问全部顶点），但距离标签不可靠。\n<\/li><li>\n结论：数据结构不只是实现细节，队列的层序性质是最短跳数结论的前提；换栈得到的是另一种搜索，不能继承 BFS 的距离定理。\n<\/ol>\n<h2>差生通读检查<\/h2>\n<ul><li>\n<strong>卡在&quot;层号为什么不会偏大&quot;<\/strong>：回到步骤 4，每次入队都对应一条真实存在的路径，层号是某条路径的边数上界；再用步骤 5 排除更短路径存在的可能。\n<\/li><li>\n<strong>卡在&quot;为什么每条边只扫描两次&quot;<\/strong>：无向边 <span class=\"katex-inline\">(u,w)<\/span> 挂在 <span class=\"katex-inline\">A(u)<\/span> 与 <span class=\"katex-inline\">A(w)<\/span> 两个列表里；<span class=\"katex-inline\">u<\/span> 出队扫一次、<span class=\"katex-inline\">w<\/span> 出队扫一次，合计两次；有向边只在尾节点列表中出现一次。\n<\/li><li>\n<strong>卡在&quot;前驱指针怎么还原路径&quot;<\/strong>：入队时记录是从哪个顶点发现当前顶点；终点沿前驱回溯到 <span class=\"katex-inline\">s<\/span>，反向即路径。没有前驱记录，BFS 只给距离不给路线。\n<\/li><li>\n<strong>卡在&quot;不可达顶点怎么处理&quot;<\/strong>：队列空后仍未标记的顶点，距离记 <span class=\"katex-inline\">+\\infty<\/span>；它们与起点之间没有任何路径，不是距离 0。\n<\/ul>\n<h2>伪码逐行走查<\/h2>\n<p>下面把 BFS 写成可对照的文本伪码，逐行说明职责。<\/p>\n<pre class=\"lang-text\"><code>BFS(G, s):\n  1  for each v in V: mark[v] := false, dist[v] := +∞\n  2  mark[s] := true, dist[s] := 0, Q := [s]\n  3  while Q not empty:\n  4    u := dequeue(Q)\n  5    for each neighbor w of u:\n  6      if not mark[w]:\n  7        mark[w] := true\n  8        dist[w] := dist[u] + 1\n  9        enqueue(Q, w)\n 10       predecessor[w] := u<\/code><\/pre>\n<ul><li>\n第 1 行：全局复位标记与距离，<span class=\"katex-inline\">+\\infty<\/span> 占位表示尚未可达。\n<\/li><li>\n第 2 行：起点入队并标记；起点距离为 0，不是 <span class=\"katex-inline\">+\\infty<\/span>。\n<\/li><li>\n第 3–4 行：队列非空就取头部；队列先进先出保证层序。\n<\/li><li>\n第 5 行：扫描 <span class=\"katex-inline\">u<\/span> 的邻居，遍历范围由表示形式决定（c01）。\n<\/li><li>\n第 6–8 行：未标记才登记；标记与距离同一步完成，避免重复入队。\n<\/li><li>\n第 9 行：新顶点排到队尾，等待当前层处理完。\n<\/li><li>\n第 10 行：前驱记录服务路径还原，不参与距离计算。\n<\/ul>\n<p>逐行核查点：第 6 行的判断不能省；省掉后已标记顶点再次入队，队列长度失控。第 8 行的 <span class=\"katex-inline\">+1<\/span> 只在等权口径下成立；加权图这里要换成边权 <span class=\"katex-inline\">A_{uw}<\/span>，距离口径随之改变。<\/p>\n<h2>第二算例：不可达顶点与多分量图<\/h2>\n<p>取顶点 <span class=\"katex-inline\">\\{s,a,b,c,d\\}<\/span>，边 <span class=\"katex-inline\">(s,a)<\/span>、<span class=\"katex-inline\">(a,b)<\/span>、<span class=\"katex-inline\">(c,d)<\/span>。<span class=\"katex-inline\">n=5<\/span>，<span class=\"katex-inline\">m=2<\/span>。<\/p>\n<p><strong>BFS 从 <span class=\"katex-inline\">s<\/span> 出发<\/strong>：层 0 <span class=\"katex-inline\">\\{s\\}<\/span>，层 1 <span class=\"katex-inline\">\\{a\\}<\/span>，层 2 <span class=\"katex-inline\">\\{b\\}<\/span>；<span class=\"katex-inline\">c,d<\/span> 始终未标记。结束后 <code>dist(c)=dist(d)=+∞<\/code>。<\/p>\n<p><strong>核算<\/strong>：<span class=\"katex-inline\">s<\/span> 所在分量为 <span class=\"katex-inline\">\\{s,a,b\\}<\/span>，另一分量为 <span class=\"katex-inline\">\\{c,d\\}<\/span>。本次 BFS 只覆盖前者；若要给 <span class=\"katex-inline\">c,d<\/span> 定层，需另起一次搜索。这个算例说明单遍 BFS 的输出边界：已标记集合等于起点可达集合，未标记部分不属于本次结果。<\/p>\n<p><strong>时间复核<\/strong>：已访问顶点 3 个，扫描边 <span class=\"katex-inline\">(s,a)<\/span>、<span class=\"katex-inline\">(a,b)<\/span> 各两次（无向），合计邻居检查 4 次；未访问分量的边 <span class=\"katex-inline\">(c,d)<\/span> 本次未扫。总代价仍按 <span class=\"katex-inline\">O(n+m)<\/span> 上界估计，单遍不会超过全图扫描量。<\/p>\n<h2>与 Dijkstra 的结构对照<\/h2>\n<p>BFS 与第 3 章 Dijkstra 共享同一套骨架，差别在选边规则：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>环节<\/th><th>BFS<\/th><th>Dijkstra<\/th><\/tr><\/thead><tbody><tr><td>已处理集合<\/td><td>已标记顶点<\/td><td><span class=\"katex-inline\">X<\/span> 集合<\/td><\/tr><tr><td>扩张依据<\/td><td>层序（队列先入先出）<\/td><td>Dijkstra 得分最低<\/td><\/tr><tr><td>距离更新<\/td><td><span class=\"katex-inline\">d(w)=d(u)+1<\/span><\/td><td><code>len(w)=len(v)+A_{vw}<\/code><\/td><\/tr><tr><td>前提条件<\/td><td>边权全 1<\/td><td>边长非负<\/td><\/tr><tr><td>失效方向<\/td><td>不等权时层号不等于总长<\/td><td>负权边可推翻已登记值<\/td><\/tr><\/tbody><\/table><\/div>\n<p>对照用途：学 Dijkstra 时不必另起炉灶，先认出哪一步是 BFS 骨架、哪一步换成得分比较；c06 的正确性证明在结构上对应本概念步骤 4、5 的上下界归纳。<\/p>\n<h2>常见错误清单与纠正<\/h2>\n<ol><li>\n<strong>错误：标记写在出队分支<\/strong>。纠正：第 7 行在入队前完成标记；出队时顶点早已标记，重复入队在标记环节被挡住。\n<\/li><li>\n<strong>错误：把层号累加成长度<\/strong>。纠正：等权图层号即跳数；要报总长时逐层记边权，不能把层号当加权距离。\n<\/li><li>\n<strong>错误：有向图扫描反向边<\/strong>。纠正：有向 BFS 只读 <span class=\"katex-inline\">A_{\\text{out}}<\/span>；需要反向可达性应在反转图上另跑。\n<\/li><li>\n<strong>错误：队列空后默认全部顶点已访问<\/strong>。纠正：队空只表示当前可达集合扩张完毕，未标记顶点不可达，距离 <span class=\"katex-inline\">+\\infty<\/span>。\n<\/li><li>\n<strong>错误：用 BFS 树边替代原图<\/strong>。纠正：树边只服务最短跳数路径；统计边权、判断环路时仍回到原图全部边。\n<\/ol>\n<h2>应用场景展开：BFS 标签能回答哪几类问题<\/h2>\n<ol><li>\n<strong>可达范围<\/strong>：一次 BFS 的已标记集合即起点可达区域；判断两个顶点是否同处一个连通块，等价于互相是否在对方 BFS 集合内。\n<\/li><li>\n<strong>最少跳转次数<\/strong>：在网页链接、好友关注、代码调用关系等网络中，BFS 层号给出最少跳转条数；这类场景边的代价默认相同。\n<\/li><li>\n<strong>分层扩散估计<\/strong>：层号作为圈层标签，用于估计一轮轮扩散的覆盖顺序；标签只在等权口径下解释为距离，跨权场景改称跳数层。\n<\/li><li>\n<strong>无权图上的路径重建<\/strong>：配合前驱指针，回溯得到一条最短跳数路径；若存在多条等长路径，前驱记录哪一条取决于发现次序，不影响长度正确性。\n<\/ol>\n<p>场景边界：一旦边的代价不同（路段长短、转账额度、依赖耗时），层序不能替代加权比较；此时仍可借 BFS 框架枚举可达点，但距离标签要由加权算法重新登记。<\/p>\n<h2>小图核验：层号约束的反向检查<\/h2>\n<p>取一张 4 顶点图，边 <span class=\"katex-inline\">(s,a)<\/span>、<span class=\"katex-inline\">(s,b)<\/span>、<span class=\"katex-inline\">(a,c)<\/span>、<span class=\"katex-inline\">(b,c)<\/span>。BFS 结果：<span class=\"katex-inline\">d(s)=0<\/span>，<span class=\"katex-inline\">d(a)=d(b)=1<\/span>，<span class=\"katex-inline\">d(c)=2<\/span>。<\/p>\n<p>反向核验三层约束：<\/p>\n<ul><li>\n层 1 顶点的邻居只能是层 0 或层 1 或层 2；<span class=\"katex-inline\">a<\/span> 的邻居 <span class=\"katex-inline\">s<\/span>（层 0）、<span class=\"katex-inline\">c<\/span>（层 2），差 1 与 1。\n<\/li><li>\n层 2 顶点 <span class=\"katex-inline\">c<\/span> 的前驱在层 1；两条候选前驱 <span class=\"katex-inline\">a,b<\/span> 均合法。\n<\/li><li>\n不存在跨层差 2 以上的边；若出现边连接层 0 与层 2，说明层号登记有误，应回到队列次序检查标记时机。\n<\/ul>\n<p>这条反向检查可作为手算 BFS 后的自查步骤：先列层号，再逐条边核对层号差，差超限即搜索过程有漏标记或错序。<\/p>\n<h2>差生通读检查（补充）<\/h2>\n<ul><li>\n<strong>卡在&quot;队列怎么保证层序&quot;<\/strong>：层 <span class=\"katex-inline\">k-1<\/span> 的顶点先入队，层 <span class=\"katex-inline\">k<\/span> 的顶点后入队；出队按同一顺序，前一层出完才出后一层。栈没有这个性质，所以 DFS 不给出层序。\n<\/li><li>\n<strong>卡在&quot;上界下界各防什么&quot;<\/strong>：上界防层号报大（登记值必须有路径支撑），下界防层号报小（不能存在更短路径被漏掉）；两条夹住才等于真实最短距离。\n<\/li><li>\n<strong>卡在&quot;前驱和距离为什么分开存&quot;<\/strong>：距离是标量标签，前驱是回溯指针；查距离不用指针，还原路径不用重算距离。二者职责分离，更新时同时写入即可。\n<\/ul>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出 BFS 初始化、入队标记、出队扩张三个动作的顺序，说明标记为什么必须在入队时完成。\n<\/li><li>\n一张无权图中 <span class=\"katex-inline\">d(a)=2<\/span>、<span class=\"katex-inline\">d(b)=3<\/span>，能否断定 <span class=\"katex-inline\">s\\to a<\/span> 的最少跳数是 2？写出依据是证明的哪一步。\n<\/li><li>\n无向图 BFS 的总邻居检查次数与 <span class=\"katex-inline\">n,m<\/span> 是什么关系？有向图呢？\n<\/li><li>\n举一个跳数最少但总长不是最短的小例子，指出 BFS 在哪一步失去总长结论。\n<\/li><li>\nBFS 树由哪些边构成？非树边两端的层号有什么约束？\n<\/ol><\/div><\/details>", "c03": "<div class=\"source-badge\">📖 出处：算法详解 卷2 图算法和数据结构.pdf · p.50<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">宽度优先搜索（BFS）：访问层数与无权最短路径<\/a><\/span><\/div><h1>无向图连通分量与 UCC 算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch01（原书 §2.3，PDF 第 50–56 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>无向图的连通分量是互相可达的极大顶点子集；UCC（Undirected Connected Components）算法遍历全部顶点，遇到未访问顶点就从它发起一次完整 BFS 或 DFS，把本次访问到的顶点归入同一分量编号，输出对顶点集的一个不相交划分。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>拿到一张大图，先要回答&quot;图被切成几块&quot;&quot;哪些顶点属于同一群体&quot;。单遍搜索只能覆盖起点所在的一块，无法看到全图的分组结构。需要一种过程把每个顶点归入恰好一个分量，既不漏掉孤立顶点，也不把两块误并成一块。<\/p>\n<p>不用分量划分会出两类错。第一类是把可达性当等价关系只在局部使用：从 <span class=\"katex-inline\">s<\/span> 搜到的集合被当成全图，另一块顶点被遗漏。第二类是重复计数：同一顶点在多次搜索中被反复归入不同编号，划分出现重叠，无法回答&quot;两个顶点是否同块&quot;。UCC 用两层循环：外层扫描每个顶点，内层跑完整搜索；分量编号在入队/访问时落定，之后不再改动。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>可达<\/strong>：无向图中从 <span class=\"katex-inline\">u<\/span> 到 <span class=\"katex-inline\">v<\/span> 存在一条路径，称 <span class=\"katex-inline\">u<\/span> 可达 <span class=\"katex-inline\">v<\/span>；无向边双向可走，可达关系对称。<\/p>\n<p><strong>连通分量<\/strong>：满足两个条件的顶点子集 <span class=\"katex-inline\">C<\/span>：其一，<span class=\"katex-inline\">C<\/span> 内任意两顶点互相可达；其二，<span class=\"katex-inline\">C<\/span> 是极大的——不存在 <span class=\"katex-inline\">C<\/span> 外顶点能与 <span class=\"katex-inline\">C<\/span> 内顶点相连。极大性保证分量不能再并入新顶点。<\/p>\n<p><strong>分量编号 <span class=\"katex-inline\">c(v)<\/span><\/strong>：给每个顶点分配的所属分量标签；同分量编号相同，不同分量编号不同。<\/p>\n<p><strong>UCC 过程<\/strong>：<\/p>\n<ol><li>\n全部顶点置未访问，计数器 <span class=\"katex-inline\">k=0<\/span>。\n<\/li><li>\n外层循环取每个顶点 <span class=\"katex-inline\">v<\/span>：若 <span class=\"katex-inline\">v<\/span> 未访问，<span class=\"katex-inline\">k\\leftarrow k+1<\/span>，从 <span class=\"katex-inline\">v<\/span> 发起一次 BFS/DFS，把本次访问到的全部顶点标记并编号 <span class=\"katex-inline\">k<\/span>。\n<\/li><li>\n外层结束后，<span class=\"katex-inline\">k<\/span> 即分量个数，<span class=\"katex-inline\">c(v)<\/span> 给出归属。\n<\/ol>\n<p><strong>正例<\/strong>：边 <span class=\"katex-inline\">(1,2)<\/span>、<span class=\"katex-inline\">(1,3)<\/span>、<span class=\"katex-inline\">(4,5)<\/span> 的图，分量为 <span class=\"katex-inline\">\\{1,2,3\\}<\/span> 与 <span class=\"katex-inline\">\\{4,5\\}<\/span>，<span class=\"katex-inline\">k=2<\/span>。<\/p>\n<p><strong>反例<\/strong>：把有向单向边当无向边分组。<span class=\"katex-inline\">a\\to b<\/span> 单向可达时，无向口径下二者不可互达；沿用 UCC 会要求双向可达，分组口径必须换成强连通分量（c04）。另一个反例：外层只扫起点邻居，未访问的孤立顶点永远不发起搜索，分量被漏记。<\/p>\n<h2>原理推导：UCC 输出划分的正确性<\/h2>\n<p>下面分三个方向证明输出满足分量定义。<\/p>\n<ol><li>\n<strong>同编号可达<\/strong>：一次内层搜索从 <span class=\"katex-inline\">v<\/span> 出发，访问到的每个顶点都由搜索树中的边与 <span class=\"katex-inline\">v<\/span> 相连；无向边双向通行，沿树边可往返，故同分量内任意两顶点互相可达。\n<\/li><li>\n<strong>异编号不可达<\/strong>：反设 <span class=\"katex-inline\">c(u)\\neq c(w)<\/span> 但存在 <span class=\"katex-inline\">u<\/span> 到 <span class=\"katex-inline\">w<\/span> 的无向路径。设 <span class=\"katex-inline\">u<\/span> 所属搜索先发起，沿该路径可达 <span class=\"katex-inline\">w<\/span>，<span class=\"katex-inline\">w<\/span> 会在同一次搜索中被访问并分到同一编号，与编号不同矛盾。\n<\/li><li>\n<strong>无遗漏无重叠<\/strong>：外层逐个检查顶点；已访问顶点跳过，未访问顶点立即发起新搜索。每个顶点在首次被遇到时分配唯一编号，不会二次分配；<span class=\"katex-inline\">V<\/span> 中顶点全部落编号，划分是不相交并集。\n<\/li><li>\n<strong>极大性<\/strong>：若某分量 <span class=\"katex-inline\">C<\/span> 外有顶点 <span class=\"katex-inline\">x<\/span> 与 <span class=\"katex-inline\">C<\/span> 内顶点相连，按第 2 步的反证方向，<span class=\"katex-inline\">x<\/span> 会并入 <span class=\"katex-inline\">C<\/span> 对应搜索，故 <span class=\"katex-inline\">C<\/span> 已是极大可达子集。\n<\/li><li>\n<strong>时间代价<\/strong>：每个顶点入队/访问一次，每条无向边在两端各扫描一次，合计 <span class=\"katex-inline\">O(n+m)<\/span>；外层循环 <span class=\"katex-inline\">n<\/span> 次判断只增加线性开销。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：无向图；可达口径为双向路径；图有限。\n<\/li><li>\n边界 1：有向图不能直接套用 UCC。有向连通性分弱连通（忽略方向后的无向连通）与强连通（双向可达），后者用 Kosaraju 算法。\n<\/li><li>\n边界 2：分量划分只关心归属，不输出分量内部的距离或路径；距离标签由 c02 的 BFS 另算。\n<\/li><li>\n边界 3：带权不影响分量划分，边权大小不改变可达性；权值只在最短路径问题中进入计算。\n<\/li><li>\n失败案例：内层搜索不标记就扩展，同一顶点重复入队，外层可能把它再算一次；标记必须随访问完成。\n<\/li><li>\n失败案例：把&quot;有边相连&quot;误当同分量而跳过搜索，实际需要沿边传递；分量是可达闭包，不是直接邻居集合。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>连通分量 vs 团<\/strong>：分量要求内部互相可达，不要求两两之间有直接边；团要求每对顶点直接相邻。分量内可以隔多跳相连，团是更强的结构。\n<\/li><li>\n<strong>连通分量 vs 强连通分量<\/strong>：前者无向、双向通行由边的无向性保证；后者有向、要求沿方向互相可达，需双遍 DFS 划分。\n<\/li><li>\n<strong>分量编号 vs 层号<\/strong>：编号是归属标签，同块同号；层号是到起点的距离标签，块内逐层不同。一次 UCC 得到编号，块内距离另跑 BFS。\n<\/li><li>\n<strong>极大 vs 最大<\/strong>：极大指不能再并入顶点；最大指顶点数最多。一个图可以有多个极大分量，其中规模最大的只是其中之一。\n<\/ul>\n<h2>一个完整小图的分组演示<\/h2>\n<p>取顶点 <span class=\"katex-inline\">\\{1,2,3,4,5,6\\}<\/span>，边 <span class=\"katex-inline\">(1,2)<\/span>、<span class=\"katex-inline\">(2,3)<\/span>、<span class=\"katex-inline\">(1,3)<\/span>、<span class=\"katex-inline\">(4,5)<\/span>。外层从 1 发起搜索，访问 <span class=\"katex-inline\">1,2,3<\/span>，编号 <span class=\"katex-inline\">C_1<\/span>；随后 4 未访问，搜索 <span class=\"katex-inline\">4,5<\/span>，编号 <span class=\"katex-inline\">C_2<\/span>；顶点 6 无边，自成 <span class=\"katex-inline\">C_3<\/span>。最终 <span class=\"katex-inline\">k=3<\/span>，编号表为 <span class=\"katex-inline\">c(1)=c(2)=c(3)=1<\/span>，<span class=\"katex-inline\">c(4)=c(5)=2<\/span>，<span class=\"katex-inline\">c(6)=3<\/span>。核验跨块：<span class=\"katex-inline\">C_1<\/span> 与 <span class=\"katex-inline\">C_2<\/span> 之间无边，<span class=\"katex-inline\">C_2<\/span> 与 <span class=\"katex-inline\">C_3<\/span> 之间无边，划分满足互不相交且覆盖全部顶点。<\/p>\n<p>把这条演示与检索场景对照：文档引用网络中，同一引用闭包内的文档可互相跳转；论坛用户关系网中，同一连通块代表可经由好友链接触达的人群；代码调用图中，同一块内的模块存在传递调用关系。分量划分给出这些网络的一级骨架。<\/p>\n<h2>常见误判<\/h2>\n<ul><li>\n误判：分量内任意两人必须是直接好友。实际可达允许中转，隔两跳、三跳仍同块；直连是邻居集合的要求，不是分量的要求。\n<\/li><li>\n误判：边权越大的连接越不该算同块。分量划分只看可达与否，权值不进入归属判断；权值影响的是最短路径代价。\n<\/li><li>\n误判：一次 BFS 覆盖的顶点就是全图分量。单遍搜索只给出起点所在分量，外层循环缺了会漏掉其余块。\n<\/li><li>\n误判：分量数等于邻居最少的顶点数。分量数由可达闭包个数决定，与顶点度数没有直接等式；孤立点各占一个分量是特例，不是一般公式。\n<\/ul>\n<h2>分量计数与边增删方向<\/h2>\n<p>全连通图分量数为 1，全孤立点为 <span class=\"katex-inline\">n<\/span>。加入一条跨分量边把两块打通，分量数减 1；加入块内边分量数不变。删除边方向相反：删掉桥（删后分量增加的边）分量数加 1。这条计数方向用于快速核验增删边后的分组变化，不必每次重跑全部分类。<\/p>\n<h2>联系<\/h2>\n<p>前置：c01 的表示形式决定内层搜索的邻居遍历代价；c02 的 BFS 可达集合是内层搜索的基本块。后继：c04 在有向图上处理更强的双向可达口径；分量划分思路在网络社群识别、任务分组、孤岛节点检查中复用。UCC 的两层循环结构——外层找未访问点、内层扩张可达集——也是 c04 Kosaraju 算法第一遍搜索的框架原型。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（无向图连通分量与 UCC 算法）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：连通分量依赖链、划分正确性证明与分组推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要讲清 UCC 算法，往回追四层：<\/p>\n<ol><li>\n<strong>可达性定义<\/strong>：沿边是否存在路径，这是分量内聚的判据；无向图可达天然对称。\n<\/li><li>\n<strong>搜索扩张<\/strong>：从一个顶点出发能扫出多大可达集合，依赖 c01 的表示与 c02 的 BFS/DFS 过程。\n<\/li><li>\n<strong>去重标记<\/strong>：访问即标记，保证一个顶点只归入一次；标记时机错误会导致划分重叠。\n<\/li><li>\n<strong>全局扫描<\/strong>：单遍搜索只覆盖一块，外层循环兜底未访问顶点，保证全图落块。\n<\/ol>\n<p>依赖链方向：可达定义 → 单遍搜索可达集 → 入访问标记 → 外层扫描成划分。<\/p>\n<h2>正向推导：从可达关系到划分定理<\/h2>\n<p>下面一步步推出 UCC 输出满足连通分量的全部条件。<\/p>\n<p><strong>步骤 1：把可达关系写成等价关系<\/strong>。无向图中可达满足自反（顶点到自身长度 0 路径）、对称（无向边双向通行，路径反向仍成立）、传递（<span class=\"katex-inline\">u<\/span> 到 <span class=\"katex-inline\">v<\/span>、<span class=\"katex-inline\">v<\/span> 到 <span class=\"katex-inline\">w<\/span> 拼接得 <span class=\"katex-inline\">u<\/span> 到 <span class=\"katex-inline\">w<\/span>）。等价关系把顶点集分成互不相交的等价类，每个等价类就是一个连通分量。<\/p>\n<p><strong>步骤 2：内层搜索给出一个等价类<\/strong>。从 <span class=\"katex-inline\">v<\/span> 发起 BFS/DFS，所有被访问顶点与 <span class=\"katex-inline\">v<\/span> 可达；按对称性与传递性，它们两两可达。搜索树边串起 <span class=\"katex-inline\">v<\/span> 到每个访问点的路径，路径反向回到 <span class=\"katex-inline\">v<\/span>。<\/p>\n<p><strong>步骤 3：反证跨分量路径不存在<\/strong>。设 <span class=\"katex-inline\">u<\/span> 属分量 <span class=\"katex-inline\">C_i<\/span>、<span class=\"katex-inline\">w<\/span> 属分量 <span class=\"katex-inline\">C_j<\/span>，<span class=\"katex-inline\">i\\neq j<\/span>。若存在无向路径 <span class=\"katex-inline\">u\\to\\cdots\\to w<\/span>，<span class=\"katex-inline\">u<\/span> 所在搜索沿该路径可到达 <span class=\"katex-inline\">w<\/span>，<span class=\"katex-inline\">w<\/span> 应在同一搜索中被编号 <span class=\"katex-inline\">i<\/span>，与 <span class=\"katex-inline\">c(w)=j<\/span> 矛盾。故不同分量之间没有路径相连。<\/p>\n<p><strong>步骤 4：极大性核验<\/strong>。任取分量 <span class=\"katex-inline\">C<\/span>，若 <span class=\"katex-inline\">C<\/span> 外存在顶点 <span class=\"katex-inline\">x<\/span> 与 <span class=\"katex-inline\">C<\/span> 内某顶点 <span class=\"katex-inline\">y<\/span> 相邻，边 <span class=\"katex-inline\">(x,y)<\/span> 使二者可达，<span class=\"katex-inline\">x<\/span> 会在 <span class=\"katex-inline\">y<\/span> 所属搜索中被纳入 <span class=\"katex-inline\">C<\/span>；与 <span class=\"katex-inline\">x<\/span> 在 <span class=\"katex-inline\">C<\/span> 外矛盾。因此 <span class=\"katex-inline\">C<\/span> 不能再并入外部顶点，达到极大。<\/p>\n<p><strong>步骤 5：无遗漏核验<\/strong>。外层逐个检查 <span class=\"katex-inline\">V<\/span> 中顶点；已访问的跳过，未访问的立即发起新搜索并编号。循环结束时不存在未检查顶点，每个顶点都有编号；编号在首次访问时落定，之后不二次分配，故划分不重叠。<\/p>\n<p><strong>步骤 6：代价核算<\/strong>。内层搜索合计：每顶点访问一次，无向边两端各扫描一次，<span class=\"katex-inline\">O(n+m)<\/span>；外层 <span class=\"katex-inline\">n<\/span> 次判断为 <span class=\"katex-inline\">O(n)<\/span>；总时间 <span class=\"katex-inline\">O(n+m)<\/span>，标记表与队列/栈空间 <span class=\"katex-inline\">O(n)<\/span>。<\/p>\n<h2>数值算例一：八顶点图的分组推演<\/h2>\n<p>取顶点 <span class=\"katex-inline\">\\{1,2,3,4,5,6,7,8\\}<\/span>，无向边：<span class=\"katex-inline\">(1,2)<\/span>、<span class=\"katex-inline\">(1,3)<\/span>、<span class=\"katex-inline\">(2,3)<\/span>、<span class=\"katex-inline\">(3,4)<\/span>、<span class=\"katex-inline\">(5,6)<\/span>、<span class=\"katex-inline\">(6,7)<\/span>、<span class=\"katex-inline\">(8,8)<\/span> 视为孤立点（无自环边）。<\/p>\n<p><strong>外层第 1 轮<\/strong>：顶点 1 未访问，<span class=\"katex-inline\">k=1<\/span>，发起搜索。访问序列：<span class=\"katex-inline\">1\\to 2,3\\to 4<\/span>。编号 1 集合 <span class=\"katex-inline\">C_1=\\{1,2,3,4\\}<\/span>。<\/p>\n<p><strong>外层第 2 轮<\/strong>：顶点 2、3、4 已标记；顶点 5 未访问，<span class=\"katex-inline\">k=2<\/span>，搜索 <span class=\"katex-inline\">5\\to 6\\to 7<\/span>。编号 2 集合 <span class=\"katex-inline\">C_2=\\{5,6,7\\}<\/span>。<\/p>\n<p><strong>外层第 3 轮<\/strong>：顶点 8 未访问，<span class=\"katex-inline\">k=3<\/span>，搜索只含 8。编号 3 集合 <span class=\"katex-inline\">C_3=\\{8\\}<\/span>。<\/p>\n<p><strong>核验<\/strong>：<span class=\"katex-inline\">C_1<\/span> 内 1 到 4 路径 <span class=\"katex-inline\">1-3-4<\/span>；<span class=\"katex-inline\">C_2<\/span> 内 5 到 7 路径 <span class=\"katex-inline\">5-6-7<\/span>；<span class=\"katex-inline\">C_3<\/span> 单点。跨块检查：<span class=\"katex-inline\">C_1<\/span> 与 <span class=\"katex-inline\">C_2<\/span> 之间无边，<span class=\"katex-inline\">C_2<\/span> 与 <span class=\"katex-inline\">C_3<\/span> 之间无边。分量个数 <span class=\"katex-inline\">k=3<\/span>。<\/p>\n<p><strong>编号表<\/strong>：<span class=\"katex-inline\">c(1)=c(2)=c(3)=c(4)=1<\/span>，<span class=\"katex-inline\">c(5)=c(6)=c(7)=2<\/span>，<span class=\"katex-inline\">c(8)=3<\/span>。<\/p>\n<h2>数值算例二：两分量被一条边误连前后的对照<\/h2>\n<p>先取边 <span class=\"katex-inline\">(a,b)<\/span>、<span class=\"katex-inline\">(c,d)<\/span>、<span class=\"katex-inline\">(d,e)<\/span>，分量为 <span class=\"katex-inline\">\\{a,b\\}<\/span>、<span class=\"katex-inline\">\\{c,d,e\\}<\/span>，<span class=\"katex-inline\">k=2<\/span>。再加入边 <span class=\"katex-inline\">(b,c)<\/span>。<\/p>\n<p><strong>重跑 UCC<\/strong>：外层从 <span class=\"katex-inline\">a<\/span> 搜索，<span class=\"katex-inline\">a\\to b\\to c\\to d\\to e<\/span>，全部归入同一编号，<span class=\"katex-inline\">k=1<\/span>。<\/p>\n<p><strong>对照结论<\/strong>：可达性是传递闭包，一条跨块边把两块的可达范围打通；分量合并不要求块内两两直连，只要求沿边传递可达。反方向拆分量只能删边，单靠编号调整不能拆分已连通的集合。<\/p>\n<p><strong>数字核算<\/strong>：加入跨边前 <span class=\"katex-inline\">m=3<\/span>，加入后 <span class=\"katex-inline\">m=4<\/span>；两图顶点数 <span class=\"katex-inline\">n=5<\/span>。UCC 时间随 <span class=\"katex-inline\">m<\/span> 线性变化，分组结果的突变来自可达关系改变，不是算法次数改变。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：内层不标记<\/strong>。顶点 <span class=\"katex-inline\">w<\/span> 被两条邻居边重复推入队列，外层再次遇到时可能另起编号；复盘：访问时刻标记，重复发现直接跳过，编号只落一次。<\/p>\n<p><strong>案例 2：外层只扫起点邻居<\/strong>。未与起点相邻的孤立顶点永远不进入搜索，分量漏记；复盘：外层循环遍历 <span class=\"katex-inline\">V<\/span> 全体，不是遍历起点邻域。<\/p>\n<p><strong>案例 3：把直接邻居当分量<\/strong>。检查到 <span class=\"katex-inline\">(u,v)<\/span> 有边就把 <span class=\"katex-inline\">v<\/span> 划入 <span class=\"katex-inline\">u<\/span> 的块，不继续沿 <span class=\"katex-inline\">v<\/span> 的边传递；复盘：分量是可达闭包，搜索必须扩展到整条路径，不能停在一跳之内。<\/p>\n<p><strong>案例 4：有向图套 UCC 口径<\/strong>。<span class=\"katex-inline\">a\\to b<\/span> 单向边被当成双向连通，分组偏大；复盘：有向图先区分弱连通与强连通，强连通另走 Kosaraju。<\/p>\n<p><strong>案例 5：把极大当最大<\/strong>。报告时说&quot;分量是图中最大顶点子集&quot;；复盘：极大指不可再并入，最大才指规模第一；多个分量同时极大，规模可以不同。<\/p>\n<h2>延伸推演：分量与图的连通度<\/h2>\n<ol><li>\n<strong>连通图判据<\/strong>：<span class=\"katex-inline\">k=1<\/span> 即全图一个分量，称为连通图；<span class=\"katex-inline\">k&gt;1<\/span> 为非连通图。\n<\/li><li>\n<strong>孤立点<\/strong>：度数为 0 的顶点自成一个分量；单点分量不违反极大性——它没有外部邻居可并入。\n<\/li><li>\n<strong>割点直觉<\/strong>：删掉某顶点后分量数增加，该顶点为割点；分量划分是观察割点作用的基础框架，具体割点算法属进阶图论专题。\n<\/li><li>\n<strong>分量内距离<\/strong>：UCC 只给归属；要报块内最短路径，在对应分量内另跑 c02 的 BFS，层号才是距离标签。\n<\/ol>\n<h2>伪码逐行走查<\/h2>\n<pre class=\"lang-text\"><code>UCC(G):\n  1  for each v in V: mark[v] := false\n  2  k := 0\n  3  for each v in V:\n  4    if not mark[v]:\n  5      k := k + 1\n  6      queue Q := [v], mark[v] := true\n  7      while Q not empty:\n  8        u := dequeue(Q)\n  9        comp[u] := k\n 10       for each neighbor w of u:\n 11         if not mark[w]:\n 12           mark[w] := true, enqueue(Q, w)<\/code><\/pre>\n<ul><li>\n第 1 行：复位全部标记。\n<\/li><li>\n第 3–5 行：外层兜底，未访问点开新块。\n<\/li><li>\n第 6 行：新块起点立即标记，避免重复入队。\n<\/li><li>\n第 9 行：分量编号在出队时落定；也可在入队时落定，两种时机不影响划分。\n<\/li><li>\n第 10–12 行：邻居未标记才纳入，扫描范围随表示形式。\n<\/ul>\n<p>核查点：第 4 行判断不可省；省掉后每个已访问点都触发一次新搜索，分量数虚增。<\/p>\n<h2>与其他分组结构的对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>结构<\/th><th>内聚判据<\/th><th>是否要求直连<\/th><th>方向口径<\/th><\/tr><\/thead><tbody><tr><td>连通分量<\/td><td>互相可达<\/td><td>否，可隔多跳<\/td><td>无向<\/td><\/tr><tr><td>强连通分量<\/td><td>沿方向互相可达<\/td><td>否<\/td><td>有向<\/td><\/tr><tr><td>团<\/td><td>两两直接相邻<\/td><td>是<\/td><td>无向/有向均可定义<\/td><\/tr><tr><td>邻域集合<\/td><td>与某点直接相邻<\/td><td>是，一跳之内<\/td><td>随图类型<\/td><\/tr><\/tbody><\/table><\/div>\n<p>对照用途：看到&quot;分组&quot;先问内聚判据是可达还是直连、是双向还是单向；判据不同，算法与结论不能互换。<\/p>\n<h2>应用场景与派生用途<\/h2>\n<ol><li>\n<strong>孤岛节点检查<\/strong>：分量大小为 1 的顶点即孤立点，常对应录入缺失、断线账号或未挂载资源；UCC 扫描时直接列出。\n<\/li><li>\n<strong>社群骨架<\/strong>：社交网络先按连通分量切大块，块内再做更细的聚类；分量是粗粒度分组，不替代社群发现算法。\n<\/li><li>\n<strong>任务依赖图体检<\/strong>：任务依赖若形成无向口径的连通块，块内任务的可达影响范围被圈定；调度顺序另由 DAG 拓扑排序决定。\n<\/li><li>\n<strong>图算法前置步骤<\/strong>：最短路径、环检测、二分图判断等算法常在单个分量内执行；先划分量可缩小每次搜索的作用域。\n<\/ol>\n<p>场景边界：分量回答&quot;能不能到达&quot;，不回答&quot;走哪条路最短&quot;；把归属标签当距离标签是常见误用。块内最短路径要在分量内重新跑 BFS 或加权最短路径算法。<\/p>\n<h2>分组核验清单（手算后自查）<\/h2>\n<ul><li>\n<strong>覆盖性<\/strong>：全部顶点都有编号，没有未分配标签的顶点。\n<\/li><li>\n<strong>不相交<\/strong>：任一顶点只出现在一个分量集合中；编号表无重复归属。\n<\/li><li>\n<strong>内聚性<\/strong>：同分量内任取两点，能沿边写出一条连接路径。\n<\/li><li>\n<strong>分离性<\/strong>：任取两个不同分量，跨分量之间不存在边；存在边就说明两块应合并。\n<\/li><li>\n<strong>极大性<\/strong>：分量外顶点无法经一条边并入当前分量；能并入则划分有误。\n<\/ul>\n<p>五条清单对应推导步骤 3、4、5 的结论；手算分组后逐条核对，可定位是漏搜、重号还是跨块误连。<\/p>\n<h2>第二算例补充：环与链的分量对照<\/h2>\n<p>图 A：顶点 <span class=\"katex-inline\">1,2,3,4<\/span>，边 <span class=\"katex-inline\">(1,2)<\/span>、<span class=\"katex-inline\">(2,3)<\/span>、<span class=\"katex-inline\">(3,4)<\/span>、<span class=\"katex-inline\">(4,1)<\/span>，单分量 <span class=\"katex-inline\">C=\\{1,2,3,4\\}<\/span>。图 B：顶点相同，边 <span class=\"katex-inline\">(1,2)<\/span>、<span class=\"katex-inline\">(3,4)<\/span>，两分量 <span class=\"katex-inline\">\\{1,2\\}<\/span>、<span class=\"katex-inline\">\\{3,4\\}<\/span>。<\/p>\n<p>核算两图边数：A 有 4 条边，B 有 2 条边；<span class=\"katex-inline\">n=4<\/span>。A 中环使任意两点双向可达，B 中两组之间没有中转路径。把 A 的边 <span class=\"katex-inline\">(4,1)<\/span> 删掉，A 退化为链 <span class=\"katex-inline\">1-2-3-4<\/span>，仍是单分量；这说明连通性只要求路径存在，环不是分量成立的必要条件。<\/p>\n<h2>内层搜索选 BFS 还是 DFS<\/h2>\n<p>UCC 内层可以换用 BFS 或 DFS，最终划分相同，差别只在过程次序：<\/p>\n<ul><li>\n<strong>BFS 内层<\/strong>：按层扩张，顺带得到块内到起点的跳数；队列实现，无递归栈深度问题。\n<\/li><li>\n<strong>DFS 内层<\/strong>：沿路径扎到底再回退；递归实现受调用栈深度限制，大图可能栈溢出，需显式栈改写。\n<\/li><li>\n<strong>划分等价性<\/strong>：两种过程扫出的可达集合一致，因为可达性只由边的连接关系决定，与扩张次序无关。外层编号规则不变，输出分量相同。\n<\/li><li>\n<strong>代价对照<\/strong>：两者合计都是 <span class=\"katex-inline\">O(n+m)<\/span>；BFS 队列与 DFS 栈的空间都为 <span class=\"katex-inline\">O(n)<\/span>。\n<\/ul>\n<p>这条等价性解释了本书 §2.3 把 UCC 描述为&quot;反复调用图搜索&quot;的理由：搜索载体可以替换，分量结论不动；到了 c04，DFS 的完成次序被拓扑排序与强连通分量算法利用，那时载体选择才进入结论本身。<\/p>\n<h2>连通性随边增删的变化方向<\/h2>\n<ol><li>\n<strong>加边<\/strong>：只可能合并分量，不可能拆分分量；跨分量的边把两块打通，块内边不改变划分。\n<\/li><li>\n<strong>删边<\/strong>：只可能拆分分量，不可能合并；删掉桥（删后增加分量数的边）会把一块切成两块。\n<\/li><li>\n<strong>判断方向<\/strong>：给定两组顶点是否同块，查编号是否相等；给定删边后是否拆块，沿删边两侧各自重跑可达检查。\n<\/li><li>\n<strong>计数直觉<\/strong>：<span class=\"katex-inline\">n<\/span> 个孤立点时分量数为 <span class=\"katex-inline\">n<\/span>；每加一条连通两块的边，分量数减 1；加块内边分量数不变。\n<\/ol>\n<p>用小图核验：<span class=\"katex-inline\">n=5<\/span> 孤立点 <span class=\"katex-inline\">k=5<\/span>；加边 <span class=\"katex-inline\">(1,2)<\/span> 后 <span class=\"katex-inline\">k=4<\/span>；加边 <span class=\"katex-inline\">(3,4)<\/span> 后 <span class=\"katex-inline\">k=3<\/span>；再加边 <span class=\"katex-inline\">(2,3)<\/span> 把两块打通，<span class=\"katex-inline\">k=2<\/span>；再加边 <span class=\"katex-inline\">(4,5)<\/span>，<span class=\"katex-inline\">k=1<\/span>。每步分量数变化与加边方向一致。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n<strong>卡在&quot;极大和最大分不清&quot;<\/strong>：极大是边界性质（加不进新点），最大是规模比较（点数最多）；单点分量也是极大分量。\n<\/li><li>\n<strong>卡在&quot;同分量为什么不必有直连边&quot;<\/strong>：可达允许路径中转，<span class=\"katex-inline\">u<\/span> 到 <span class=\"katex-inline\">w<\/span> 经 <span class=\"katex-inline\">v<\/span> 相连即同块；直连只是可达的特例。\n<\/li><li>\n<strong>卡在&quot;外层内层各管什么&quot;<\/strong>：内层扫出一个可达块，外层保证没块的顶点被兜底；缺内层得不到闭包，缺外层漏孤立块。\n<\/li><li>\n<strong>卡在&quot;时间为什么是 <span class=\"katex-inline\">O(n+m)<\/span>&quot;<\/strong>：顶点各访问一次，边各被看常数次；外层判断是 <span class=\"katex-inline\">O(n)<\/span> 附加项，不改变线性量级。\n<\/ul>\n<h2>证明边界与容易被跳过的环节<\/h2>\n<ul><li>\n<strong>可达关系三性质<\/strong>：自反、对称、传递三条都要核验；缺对称性，无向口径不成立；缺传递性，等价类无法拼接。UCC 正确性证明的地基是这三条，不是搜索技巧。\n<\/li><li>\n<strong>极大性不能由&quot;同块可达&quot;自动推出<\/strong>：同块可达只覆盖内部，还要排除外部顶点能并入；推导步骤 4 单独处理这一步。\n<\/li><li>\n<strong>外层循环的兜底作用<\/strong>：内层搜索再完整，也只覆盖一个闭包；没有外层，第二块及以后全部漏记。两层职责在证明里分别对应无遗漏与内聚性。\n<\/li><li>\n<strong>标记与编号的先后<\/strong>：先标记防重复，再编号定归属；若先编号后标记，两次发现之间可能插入第二次分配，编号重叠。\n<\/ul>\n<h2>数值复核：三张表对照分量数<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>图<\/th><th>边集<\/th><th><span class=\"katex-inline\">n<\/span><\/th><th><span class=\"katex-inline\">m<\/span><\/th><th>分量数 <span class=\"katex-inline\">k<\/span><\/th><\/tr><\/thead><tbody><tr><td>孤立点集<\/td><td>无<\/td><td>5<\/td><td>0<\/td><td>5<\/td><\/tr><tr><td>两条边<\/td><td><span class=\"katex-inline\">(1,2),(3,4)<\/span><\/td><td>5<\/td><td>2<\/td><td>3<\/td><\/tr><tr><td>一条链<\/td><td><span class=\"katex-inline\">(1,2),(2,3),(3,4)<\/span><\/td><td>4<\/td><td>3<\/td><td>1<\/td><\/tr><tr><td>三角加孤立点<\/td><td><span class=\"katex-inline\">(1,2),(2,3),(3,1)<\/span><\/td><td>4<\/td><td>3<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>复核方法：先列出每个顶点的可达邻居链，再按跨块无边检查；<span class=\"katex-inline\">k<\/span> 等于可达闭包个数。链图与三角图差别在有无环，分量数相同，说明连通性不依赖环结构。<\/p>\n<h2>计数边界补充<\/h2>\n<p>分量个数 <span class=\"katex-inline\">k<\/span> 满足 <span class=\"katex-inline\">1\\le k\\le n<\/span>：全连通图 <span class=\"katex-inline\">k=1<\/span>，全孤立点 <span class=\"katex-inline\">k=n<\/span>。加入一条跨分量边 <span class=\"katex-inline\">k<\/span> 减 1，加入块内边 <span class=\"katex-inline\">k<\/span> 不变；删除边则方向相反，删桥使 <span class=\"katex-inline\">k<\/span> 加 1。这个计数方向用于快速核验加边删边后的划分变化，不必每次重跑全部分类。<\/p>\n<h2>分量划分与算法选择对照<\/h2>\n<p>无向图分组走 UCC，单遍搜索加外层兜底；有向图要双向可达走 Kosaraju 双遍；只看单向可达则是另一类连通口径。分量编号是归属标签，不记录块内距离；需要最短路径在块内另跑 BFS 或加权算法。判图时先定方向口径，再选搜索载体；载体（BFS/DFS）不改变最终划分，只改变访问次序。<\/p>\n<h2>时间与空间复核<\/h2>\n<p>UCC 外层 <span class=\"katex-inline\">n<\/span> 次判断，内层搜索合计每顶点访问一次、每条无向边两端各扫一次，总时间 <span class=\"katex-inline\">O(n+m)<\/span>；标记表与队列/栈空间 <span class=\"katex-inline\">O(n)<\/span>。连通图上一次搜索覆盖全图，非连通图外层兜底未访问顶点。分量划分不计算路径长度，块内距离另跑搜索算法。<\/p>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出 UCC 两层循环各自动作，说明内层搜索使用 BFS 还是 DFS 是否影响最终划分。\n<\/li><li>\n反证&quot;不同分量之间存在路径&quot;会推出什么矛盾？逐步写出链条。\n<\/li><li>\n一张 <span class=\"katex-inline\">n=7<\/span> 的无向图有三条互不相连的边和一个孤立点，分量个数是多少？\n<\/li><li>\n为什么分量编号在入队时落定与出队时落定得到相同划分？\n<\/li><li>\n弱连通分量与强连通分量的判据差别在哪一步？\n<\/ol><\/div><\/details>", "c04": "<div class=\"source-badge\">📖 出处：算法详解 卷2 图算法和数据结构.pdf · p.57<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">宽度优先搜索（BFS）：访问层数与无权最短路径<\/a><\/span><\/div><h1>深度优先搜索、拓扑排序与强连通分量（Kosaraju 算法）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch01（原书 §2.4、§2.5、§2.6，PDF 第 57–67、68–72 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>深度优先搜索（DFS）沿当前未访问边一直扎到尽头，回退后再考察其余岔路；它的完成次序可构造有向无环图的拓扑顺序，两遍 DFS（原图记次序、反转图按逆序搜索）即 Kosaraju 算法，把有向图划分为互相可达的强连通分量。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>BFS 按层扩张，回答距离与可达范围；还有两类问题 BFS 次序用不上。一是任务排程：若干任务有前后依赖，需要排出一个顺序使每条依赖边都从先到后，这就是拓扑排序。二是有向网络的归属划分：网页与网页之间单向引用，要找出任意两点沿方向互相可达的最大子集，即强连通分量。两类问题都依赖 DFS 的&quot;完成次序&quot;——顶点什么时候探索完毕、什么时候回退。<\/p>\n<p>不用 DFS 次序会出两类错。排程上按任意顺序安排任务，可能把被依赖的任务放到依赖者之后，执行到该任务时前置条件未满足。划分量上沿用无向 UCC 口径，单向可达会被误判为双向可达，分组偏大。DFS 用递归栈记录当前路径，完成时登记后序位置；拓扑排序取逆后序，Kosaraju 用这个次序决定第二遍搜索顺序。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>DFS 过程<\/strong>：从起点出发，标记当前顶点；逐条考察未访问邻居，递归深入；邻居全部处理完后登记完成时间（后序），回退。显式实现用栈模拟递归调用栈。<\/p>\n<p><strong>树边与非树边<\/strong>：DFS 中发现新顶点的边为树边；其余边分回边（指向当前路径上的祖先）、前向边（指向后代）、横叉边（指向另一分支）。无向图上非树边主要表现为回边。<\/p>\n<p><strong>拓扑顺序<\/strong>：对有向无环图（DAG）<span class=\"katex-inline\">G=(V,E)<\/span>，顶点排列 <span class=\"katex-inline\">v_1,\\dots,v_n<\/span>，使每条边 <span class=\"katex-inline\">(v_i,v_j)<\/span> 都满足 <span class=\"katex-inline\">i&lt;j<\/span>，即尾排在头之前。<\/p>\n<p><strong>拓扑排序构造<\/strong>：跑一遍 DFS，记录每个顶点的完成次序（后序）；按完成时间从晚到早排列，即逆后序，就是合法拓扑顺序。<\/p>\n<p><strong>强连通分量（SCC）<\/strong>：有向图中互相可达的极大顶点子集；子集内任意 <span class=\"katex-inline\">u,v<\/span> 存在 <span class=\"katex-inline\">u<\/span> 到 <span class=\"katex-inline\">v<\/span> 与 <span class=\"katex-inline\">v<\/span> 到 <span class=\"katex-inline\">u<\/span> 的有向路径。<\/p>\n<p><strong>Kosaraju 算法<\/strong>：<\/p>\n<ol><li>\n第一遍在原图 <span class=\"katex-inline\">G<\/span> 上跑 DFS，记录顶点完成次序。\n<\/li><li>\n把图反转：每条边 <span class=\"katex-inline\">(v,w)<\/span> 改为 <span class=\"katex-inline\">(w,v)<\/span>，得反转图 <span class=\"katex-inline\">G^R<\/span>。\n<\/li><li>\n第二遍按第一遍完成次序的逆序，在 <span class=\"katex-inline\">G^R<\/span> 上跑 DFS；每棵 DFS 树是一个强连通分量。\n<\/ol>\n<p><strong>正例<\/strong>：DAG 边 <span class=\"katex-inline\">(a,b)<\/span>、<span class=\"katex-inline\">(b,c)<\/span>、<span class=\"katex-inline\">(a,c)<\/span>，DFS 逆后序可得 <span class=\"katex-inline\">a,b,c<\/span>；每条边尾在前、头在后。<\/p>\n<p><strong>反例<\/strong>：含环图 <span class=\"katex-inline\">a\\to b\\to c\\to a<\/span>，环上三点互相等待，任何排列都有一条边从后往前，拓扑顺序不存在。强连通口径下这个三点集本身是一个 SCC。<\/p>\n<h2>原理推导<\/h2>\n<p><strong>拓扑排序正确性<\/strong>：取 DAG 中任意边 <span class=\"katex-inline\">(u,v)<\/span>。DFS 访问 <span class=\"katex-inline\">u<\/span> 时沿边可到 <span class=\"katex-inline\">v<\/span>；若 <span class=\"katex-inline\">v<\/span> 未访问则深入 <span class=\"katex-inline\">v<\/span>，<span class=\"katex-inline\">v<\/span> 先于 <span class=\"katex-inline\">u<\/span> 完成；若 <span class=\"katex-inline\">v<\/span> 已访问，<span class=\"katex-inline\">v<\/span> 的完成时间更早或在前一路径结束。逆后序排列中，完成晚的 <span class=\"katex-inline\">u<\/span> 排在前，完成早的 <span class=\"katex-inline\">v<\/span> 排在后，故 <span class=\"katex-inline\">u<\/span> 在 <span class=\"katex-inline\">v<\/span> 之前，满足边方向要求。环的存在使某条回边指向祖先，逆后序无法同时满足环上全部边，这是 DAG 前提不可去掉的原因。<\/p>\n<p><strong>Kosaraju 划分正确性<\/strong>：设第二遍在 <span class=\"katex-inline\">G^R<\/span> 上从顶点 <span class=\"katex-inline\">s<\/span> 发起 DFS，访问到集合 <span class=\"katex-inline\">C<\/span>。<\/p>\n<ol><li>\n<strong><span class=\"katex-inline\">C<\/span> 内互相可达<\/strong>：若 <span class=\"katex-inline\">u,w\\in C<\/span>，<span class=\"katex-inline\">G^R<\/span> 中 <span class=\"katex-inline\">s<\/span> 到 <span class=\"katex-inline\">u<\/span>、<span class=\"katex-inline\">s<\/span> 到 <span class=\"katex-inline\">w<\/span> 各有路径；反转回 <span class=\"katex-inline\">G<\/span> 即 <span class=\"katex-inline\">u<\/span> 到 <span class=\"katex-inline\">s<\/span>、<span class=\"katex-inline\">w<\/span> 到 <span class=\"katex-inline\">s<\/span>，再由第一遍次序约束推出 <span class=\"katex-inline\">s<\/span> 到 <span class=\"katex-inline\">u<\/span>、<span class=\"katex-inline\">s<\/span> 到 <span class=\"katex-inline\">w<\/span> 的路径，双向可达闭合。\n<\/li><li>\n<strong>跨分量分离<\/strong>：不同第二遍 DFS 树之间，按原图方向不存在双向路径；否则两个集合应在同一次搜索中连通。\n<\/li><li>\n<strong>极大性<\/strong>：与 c03 的划分论证相同，能并入的顶点必被本次搜索纳入，故每个树是极大 SCC。\n<\/li><li>\n<strong>时间代价<\/strong>：两遍 DFS 各扫顶点一次、边常数次，合计 <span class=\"katex-inline\">O(n+m)<\/span>；反转图构造 <span class=\"katex-inline\">O(n+m)<\/span>。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n拓扑排序适用条件：图是 DAG；存在环时算法能识别为&quot;出现回边&quot;，但不输出顺序。\n<\/li><li>\nKosaraju 适用条件：有向图；求双向可达极大子集。无向图可退回 UCC，不必双遍。\n<\/li><li>\n边界 1：DFS 完成次序不是访问次序；拓扑与 SCC 用的是完成时间，混淆两个次序会得到错误顺序。\n<\/li><li>\n边界 2：Kosaraju 两遍方向不可颠倒；先在反转图记次序、再原图搜索，分组不保证互相可达。\n<\/li><li>\n边界 3：拓扑顺序不唯一；同一 DAG 可有多条合法顺序，DFS 逆后序给出其中一条。\n<\/li><li>\n失败案例：把有向无环图的边方向排反，输出顺序全部违反依赖；核验时逐条边检查尾前头后。\n<\/li><li>\n失败案例：在含环图上强行输出拓扑序，环上循环等待无法消除；应先报&quot;存在环，无拓扑序&quot;。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>DFS vs BFS<\/strong>：DFS 用栈深入单路径，产出完成次序；BFS 用队列按层扩张，产出距离标签。连通图上可达集合相同，次序与派生结论不同。\n<\/li><li>\n<strong>拓扑排序 vs 排序算法<\/strong>：拓扑按依赖偏序排列，允许并列元素任意先后；普通排序按全序键值比较，二者约束对象不同。\n<\/li><li>\n<strong>强连通分量 vs 弱连通分量<\/strong>：SCC 要求沿方向双向可达；弱连通忽略方向后按无向连通分组，口径更松。\n<\/li><li>\n<strong>回边 vs 横叉边<\/strong>：回边指向当前递归栈上的祖先，是环的标志；横叉边连接已结束的不同分支，不构成环。无向图不出现横叉边。\n<\/ul>\n<h2>常见误判<\/h2>\n<ul><li>\n误判：DFS 一定比 BFS 慢。两者连通扫描都是 <span class=\"katex-inline\">O(n+m)<\/span>；差别在次序与派生结论，不在渐近量级。\n<\/li><li>\n误判：拓扑排序就是按顶点编号排序。拓扑约束的是依赖方向，与编号大小无关；编号有序不代表依赖有序。\n<\/li><li>\n误判：SCC 内两点必须有直连边。SCC 只要求双向路径存在，中转多跳不影响归属。\n<\/li><li>\n误判：第一遍 DFS 从哪个顶点启动会改变 SCC 结果。启动点只影响搜索次序与树的编号，分量集合不变；第二遍逆序规则保证剥离正确。\n<\/ul>\n<h2>一个次序对照演示<\/h2>\n<p>同一张 DAG：<span class=\"katex-inline\">a<\/span> 依赖前置位，边 <span class=\"katex-inline\">a\\to b<\/span>、<span class=\"katex-inline\">a\\to c<\/span>、<span class=\"katex-inline\">b\\to d<\/span>、<span class=\"katex-inline\">c\\to d<\/span>。DFS 完成先后为 <span class=\"katex-inline\">d,b,c,a<\/span>，逆后序为 <span class=\"katex-inline\">a,c,b,d<\/span>。逐条边核对：<span class=\"katex-inline\">a<\/span> 在 <span class=\"katex-inline\">b,c<\/span> 前，<span class=\"katex-inline\">b,c<\/span> 在 <span class=\"katex-inline\">d<\/span> 前，方向全部对齐。若改按发现顺序排列 <span class=\"katex-inline\">a,b,c,d<\/span>，同样对齐；但在更复杂的图上，发现顺序可能把边尾放到头之后，这正是算法必须取完成逆序的原因。<\/p>\n<h2>联系<\/h2>\n<p>前置：c01 的有向/无向区分与邻接表示，c02 的搜索标记规则。后继：拓扑顺序是任务调度、编译依赖排序的骨架；SCC 划分是 Web 图结构分析（§2.7）的基础。本章的 DFS 次序思想在 c06 正确性证明、第 5 章搜索树遍历中以不同形式复用：遍历次序决定派生结论。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（深度优先搜索、拓扑排序与强连通分量（Kosaraju 算法））<\/summary><div class=\"depth-body\"><h1>c04 深度推导：DFS 次序、拓扑排序证明与 Kosaraju 双遍划分推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要讲清 DFS 派生的两类算法，往回追五层：<\/p>\n<ol><li>\n<strong>搜索标记与扩张<\/strong>：沿邻接表示访问未访问顶点（c01、c02 的基础），DFS 与 BFS 共享标记规则。\n<\/li><li>\n<strong>递归栈与当前路径<\/strong>：DFS 深入时栈记录从起点到当前顶点的路径，回边判断依赖这条路径。\n<\/li><li>\n<strong>完成次序<\/strong>：顶点邻居全部处理完才登记完成时间；这个后序位置是拓扑与 SCC 的输入。\n<\/li><li>\n<strong>DAG 前提<\/strong>：无环是拓扑顺序存在的充要条件；回边是环的识别信号。\n<\/li><li>\n<strong>图反转与两遍配对<\/strong>：反转边方向，按第一遍逆序在反转图搜索，次序与图方向配对构成 Kosaraju。\n<\/ol>\n<p>依赖链方向：标记扩张 → 栈上路径 → 完成次序 → 偏序排列 → 双遍划分 SCC。<\/p>\n<h2>正向推导一：DFS 过程与边分类<\/h2>\n<p><strong>步骤 1：启动<\/strong>。任选起点 <span class=\"katex-inline\">s<\/span>，标记 <span class=\"katex-inline\">s<\/span>，进入递归过程。 <strong>步骤 2：深入<\/strong>。考察当前顶点 <span class=\"katex-inline\">u<\/span> 的邻居 <span class=\"katex-inline\">w<\/span>：未访问则标记、递归进入 <span class=\"katex-inline\">w<\/span>；已访问则按边类型记录。 <strong>步骤 3：回退<\/strong>。<span class=\"katex-inline\">u<\/span> 的邻居全部处理完毕，登记 <span class=\"katex-inline\">u<\/span> 的完成时间，返回到父顶点。 <strong>步骤 4：边分类<\/strong>：<\/p>\n<ul><li>\n树边：发现新顶点的递归边；\n<\/li><li>\n回边：指向栈上祖先的边，提示存在环；\n<\/li><li>\n前向边：指向已访问后代的边；\n<\/li><li>\n横叉边：指向已结束分支顶点的边。\n<p><strong>步骤 5：无向图对照<\/strong>：无向边双向扫描，第二次遇到的已访问边多为回边；无向 DFS 不产生横叉边。<\/p>\n<\/ul>\n<h2>正向推导二：拓扑排序正确性逐步核验<\/h2>\n<p>设 DAG <span class=\"katex-inline\">G<\/span>，DFS 记录完成时间 <span class=\"katex-inline\">f(u)<\/span>（完成越晚数值越大）。取任意边 <span class=\"katex-inline\">(u,v)<\/span>，分两种情形。<\/p>\n<ol><li>\n<strong><span class=\"katex-inline\">v<\/span> 未被访问过<\/strong>：递归从 <span class=\"katex-inline\">u<\/span> 进入 <span class=\"katex-inline\">v<\/span>，<span class=\"katex-inline\">v<\/span> 在 <span class=\"katex-inline\">u<\/span> 之前完成，<span class=\"katex-inline\">f(v)&lt;f(u)<\/span>。\n<\/li><li>\n<strong><span class=\"katex-inline\">v<\/span> 已访问过<\/strong>：<span class=\"katex-inline\">v<\/span> 处于已结束分支或当前路径；其完成时间不晚于本次 <span class=\"katex-inline\">u<\/span> 的完成，仍有 <span class=\"katex-inline\">f(v)\\le f(u)<\/span>。\n<\/ol>\n<p>逆后序把 <span class=\"katex-inline\">f<\/span> 大的排在前：<span class=\"katex-inline\">u<\/span> 完成晚、排在前，<span class=\"katex-inline\">v<\/span> 完成早、排在后，排列中 <span class=\"katex-inline\">u<\/span> 在 <span class=\"katex-inline\">v<\/span> 之前，边 <span class=\"katex-inline\">(u,v)<\/span> 方向与排列一致。全部边核验完毕，排列即合法拓扑顺序。<\/p>\n<p><strong>环的阻断作用<\/strong>：若图含环 <span class=\"katex-inline\">v_1\\to v_2\\to\\cdots\\to v_k\\to v_1<\/span>，环上每个顶点都需排在下一个之前，形成 <span class=\"katex-inline\">v_1&lt;v_2&lt;\\cdots&lt;v_k&lt;v_1<\/span> 的循环等待；不存在满足全部边方向的排列。DFS 遇到回边即标记环存在。<\/p>\n<h2>数值算例一：DAG 拓扑顺序手推<\/h2>\n<p>顶点 <span class=\"katex-inline\">\\{a,b,c,d\\}<\/span>，边 <span class=\"katex-inline\">(a,b)<\/span>、<span class=\"katex-inline\">(a,c)<\/span>、<span class=\"katex-inline\">(b,d)<\/span>、<span class=\"katex-inline\">(c,d)<\/span>。<\/p>\n<p><strong>DFS 从 <span class=\"katex-inline\">a<\/span> 启动<\/strong>：<\/p>\n<ol><li>\n进入 <span class=\"katex-inline\">a<\/span>，邻居先取 <span class=\"katex-inline\">b<\/span>；\n<\/li><li>\n进入 <span class=\"katex-inline\">b<\/span>，邻居 <span class=\"katex-inline\">d<\/span>；\n<\/li><li>\n进入 <span class=\"katex-inline\">d<\/span>，无未访问邻居，<span class=\"katex-inline\">f(d)=1<\/span>，回退 <span class=\"katex-inline\">b<\/span>；<span class=\"katex-inline\">f(b)=2<\/span>，回退 <span class=\"katex-inline\">a<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">a<\/span> 再取邻居 <span class=\"katex-inline\">c<\/span>，进入 <span class=\"katex-inline\">c<\/span>，<span class=\"katex-inline\">d<\/span> 已访问，<span class=\"katex-inline\">f(c)=3<\/span>；回退 <span class=\"katex-inline\">a<\/span>，<span class=\"katex-inline\">f(a)=4<\/span>。\n<\/ol>\n<p><strong>逆后序<\/strong>（<span class=\"katex-inline\">f<\/span> 降序）：<span class=\"katex-inline\">a(4),c(3),b(2),d(1)<\/span>。核验边：<span class=\"katex-inline\">a\\to b<\/span> 中 <span class=\"katex-inline\">a<\/span> 在前；<span class=\"katex-inline\">a\\to c<\/span> 在前；<span class=\"katex-inline\">b\\to d<\/span> 在前；<span class=\"katex-inline\">c\\to d<\/span> 在前，全部满足。另一合法顺序 <span class=\"katex-inline\">a,b,c,d<\/span> 同样成立，拓扑序不唯一。<\/p>\n<h2>数值算例二：Kosaraju 在五顶点图上的推演<\/h2>\n<p>顶点 <span class=\"katex-inline\">\\{a,b,c,d,e\\}<\/span>，有向边：<span class=\"katex-inline\">a\\to b<\/span>、<span class=\"katex-inline\">b\\to a<\/span>、<span class=\"katex-inline\">b\\to c<\/span>、<span class=\"katex-inline\">c\\to d<\/span>、<span class=\"katex-inline\">d\\to c<\/span>、<span class=\"katex-inline\">d\\to e<\/span>、<span class=\"katex-inline\">e\\to d<\/span>。<\/p>\n<p><strong>结构识别<\/strong>：<span class=\"katex-inline\">\\{a,b\\}<\/span> 双向可达，<span class=\"katex-inline\">\\{c,d,e\\}<\/span> 双向可达；两组之间由 <span class=\"katex-inline\">b\\to c<\/span> 单向连接。预期 SCC：<span class=\"katex-inline\">C_1=\\{a,b\\}<\/span>，<span class=\"katex-inline\">C_2=\\{c,d,e\\}<\/span>。<\/p>\n<p><strong>第一遍（原图 DFS）<\/strong>：假设从 <span class=\"katex-inline\">a<\/span> 启动，深入 <span class=\"katex-inline\">a\\to b\\to c\\to d\\to e<\/span>；完成次序登记为 <span class=\"katex-inline\">e,d,c,b,a<\/span>（完成从早到晚）。<\/p>\n<p><strong>构造反转图 <span class=\"katex-inline\">G^R<\/span><\/strong>：边反向：<span class=\"katex-inline\">b\\to a<\/span>、<span class=\"katex-inline\">a\\to b<\/span>、<span class=\"katex-inline\">c\\to b<\/span>、<span class=\"katex-inline\">d\\to c<\/span>、<span class=\"katex-inline\">c\\to d<\/span>、<span class=\"katex-inline\">e\\to d<\/span>、<span class=\"katex-inline\">d\\to e<\/span>。<\/p>\n<p><strong>第二遍（<span class=\"katex-inline\">G^R<\/span> 上按逆序）<\/strong>：第一遍完成最晚的是 <span class=\"katex-inline\">a<\/span>，从 <span class=\"katex-inline\">a<\/span> 在 <span class=\"katex-inline\">G^R<\/span> 搜索，可达 <span class=\"katex-inline\">b<\/span>，树集 <span class=\"katex-inline\">\\{a,b\\}=C_1<\/span>；剩余未访问取完成次序下一个，<span class=\"katex-inline\">c<\/span> 发起搜索，可达 <span class=\"katex-inline\">d,e<\/span>，树集 <span class=\"katex-inline\">\\{c,d,e\\}=C_2<\/span>。<\/p>\n<p><strong>核验<\/strong>：<span class=\"katex-inline\">C_1<\/span> 内 <span class=\"katex-inline\">a\\leftrightarrow b<\/span> 双向；<span class=\"katex-inline\">C_2<\/span> 内 <span class=\"katex-inline\">c\\leftrightarrow d\\leftrightarrow e<\/span> 双向；<span class=\"katex-inline\">b\\to c<\/span> 单向不构成 <span class=\"katex-inline\">C_1<\/span> 到 <span class=\"katex-inline\">C_2<\/span> 的反向通道，跨分量分离成立。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：用访问次序代替完成次序<\/strong>。拓扑排序若按先发现顺序排列，边尾可能排在头之后；复盘：派生结论依赖完成时间，入队/入栈时刻与完成时刻分开记录。 <strong>案例 2：颠倒两遍方向<\/strong>。先在反转图记次序、再原图按逆序搜，DFS 树内不保证双向可达；复盘：第一遍记次序的图与第二遍搜索的图必须按算法配对。 <strong>案例 3：含环图强排拓扑序<\/strong>。环上循环等待无法消除，强行输出必有一条边违反方向；复盘：先检测回边，有环则报告无拓扑序。 <strong>案例 4：无向图套用 SCC 口径<\/strong>。无向边天然双向，SCC 退化为 UCC 分量；复盘：先判图类型再选算法，口径松紧不同。 <strong>案例 5：把横叉边当回边<\/strong>。已结束分支的顶点不是栈上祖先，横叉边不提示环；复盘：判断环只认指向当前递归栈祖先的回边。<\/p>\n<h2>延伸推演：拓扑排序的派生用途<\/h2>\n<ol><li>\n<strong>任务调度<\/strong>：编译模块依赖、课程先修关系、项目任务排程，都抽象为 DAG 边；拓扑序给出执行顺序，同层无依赖任务可并行。\n<\/li><li>\n<strong>DAG 最短/最长路径<\/strong>：按拓扑序松弛边，避免重复迭代；这是动态规划在 DAG 上的标准实现顺序。\n<\/li><li>\n<strong>环检测<\/strong>：DFS 回边计数；工程上用于发现依赖死锁、循环引用。\n<\/li><li>\n<strong>层级展开<\/strong>：网页目录、组织结构树的展开顺序可借拓扑次序确定父先于子。\n<\/ol>\n<h2>延伸推演二：SCC 与 Web 图结构<\/h2>\n<p>§2.7 把万维网建模为有向图：网页为顶点，超链接为有向边。SCC 划分后，互相链接紧密的站点群落在同一分量；分量之间的单向链接形成&quot;中心—外围&quot;结构。Kosaraju 两遍扫描在大图上仍是线性时间，分量清单可进一步用于链接分析与群落识别。<\/p>\n<h2>伪码对照<\/h2>\n<pre class=\"lang-text\"><code>TopoSort(G):\n  1  for each v: mark[v] := false\n  2  for each v: if not mark[v]: DFS_topo(v)\n  3  append v to order when finished\n  4  reverse(order)  // 逆后序\n\nKosaraju(G):\n  1  run DFS on G, record finish order F\n  2  build G^R by reversing every edge\n  3  for v in reverse(F):\n  4    if not visited[v]: start DFS on G^R, tree = new SCC<\/code><\/pre>\n<p>核查点：TopoSort 第 3 行在完成时追加，不是进入时追加；Kosaraju 第 3 行遍历顺序必须是 <span class=\"katex-inline\">F<\/span> 的逆序，第二遍图是 <span class=\"katex-inline\">G^R<\/span> 不是 <span class=\"katex-inline\">G<\/span>。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n<strong>卡在&quot;完成时间怎么登记&quot;<\/strong>：当前顶点所有邻居处理完、即将返回父顶点时记一笔；递归深入期间不记。画递归树时，叶节点先完成，根在最末完成。\n<\/li><li>\n<strong>卡在&quot;为什么逆后序合法&quot;<\/strong>：对每条边 <span class=\"katex-inline\">(u,v)<\/span>，<span class=\"katex-inline\">v<\/span> 不晚于 <span class=\"katex-inline\">u<\/span> 完成；逆序排列把完成晚的 <span class=\"katex-inline\">u<\/span> 放前，方向自然对齐。\n<\/li><li>\n<strong>卡在&quot;两遍为什么不能换&quot;<\/strong>：第一遍在原图得到分量 condensation 的一个次序，第二遍在反转图沿这个次序剥离；图与次序配对是证明双向可达的条件，互换后证明链条断开。\n<\/li><li>\n<strong>卡在&quot;环和 SCC 的关系&quot;<\/strong>：环上所有顶点同属一个 SCC；一个 SCC 内可以含多个环，但 SCC 不等同于单个环。\n<\/ul>\n<h2>边分类小算例<\/h2>\n<p>取有向图：<span class=\"katex-inline\">a\\to b<\/span>、<span class=\"katex-inline\">a\\to c<\/span>、<span class=\"katex-inline\">b\\to d<\/span>、<span class=\"katex-inline\">c\\to d<\/span>、<span class=\"katex-inline\">d\\to a<\/span>。DFS 从 <span class=\"katex-inline\">a<\/span> 启动：<\/p>\n<ol><li>\n<span class=\"katex-inline\">a\\to b<\/span>：树边；<span class=\"katex-inline\">b\\to d<\/span>：树边；<span class=\"katex-inline\">d\\to a<\/span>：<span class=\"katex-inline\">a<\/span> 在当前栈上，回边，环 <span class=\"katex-inline\">a-b-d-a<\/span> 由此识别。\n<\/li><li>\n回退到 <span class=\"katex-inline\">a<\/span>，<span class=\"katex-inline\">a\\to c<\/span>：树边；<span class=\"katex-inline\">c\\to d<\/span>：<span class=\"katex-inline\">d<\/span> 已结束，横叉边。\n<\/li><li>\n分类计数：树边 3（<span class=\"katex-inline\">a b<\/span>、<span class=\"katex-inline\">b d<\/span>、<span class=\"katex-inline\">a c<\/span>），回边 1（<span class=\"katex-inline\">d a<\/span>），横叉边 1（<span class=\"katex-inline\">c d<\/span>），无前向边。\n<\/ol>\n<p>对照要点：回边指向栈内祖先，是环的直接信号；横叉边连接已结束分支，不提示环。工程上环检测只跟踪回边，把横叉边误记为回边会误报环。<\/p>\n<h2>拓扑序不唯一性的解释<\/h2>\n<p>一个 DAG 中若无依赖关系的顶点对，先后次序可互换。算例 <span class=\"katex-inline\">\\{a,b,c,d\\}<\/span> 边 <span class=\"katex-inline\">(a,b)<\/span>、<span class=\"katex-inline\">(a,c)<\/span>、<span class=\"katex-inline\">(b,d)<\/span>、<span class=\"katex-inline\">(c,d)<\/span> 中，<span class=\"katex-inline\">b<\/span> 与 <span class=\"katex-inline\">c<\/span> 之间无边，<span class=\"katex-inline\">b,c<\/span> 可互换位置：<span class=\"katex-inline\">a,b,c,d<\/span> 与 <span class=\"katex-inline\">a,c,b,d<\/span> 都是合法拓扑序。DFS 选邻居的先后不同，逆后序给出其中一条；不存在&quot;唯一正确拓扑序&quot;，只有&quot;满足全部边方向&quot;的次序集合。<\/p>\n<p>判据：两个顶点在拓扑序中可交换，当且仅当二者之间没有方向路径约束；有路径约束的一对，先后被偏序钉死。<\/p>\n<h2>SCC 缩图（condensation）直觉<\/h2>\n<p>把每个 SCC 收缩成一个结点，原图跨分量有向边成为缩图的边。缩图一定是 DAG：若缩图含环，环上各分量双向可达，按定义应合并为一个 SCC，与收缩矛盾。这条性质给出两层结构：内部双向连通，分量之间单向衔接。Kosaraju 输出的每个树对应缩图的一个结点，第二遍剥离顺序沿缩图拓扑方向展开。<\/p>\n<p>Web 图的蝴蝶结结构（§2.7）即在这张缩图上描述：强核为中心 SCC，入链分量与出链分量分居两侧，管道与孤岛挂在边缘。分量划分是观察整体结构的前置步骤。<\/p>\n<h2>常见错误清单<\/h2>\n<ol><li>\n<strong>完成次序与访问次序混用<\/strong>：拓扑与 SCC 用完成时间；入栈时刻只记录发现，不参与派生排序。\n<\/li><li>\n<strong>两遍图方向配错<\/strong>：第一遍原图记次序，第二遍反转图搜索；配反后树内可达性不闭合。\n<\/li><li>\n<strong>有环图强行排拓扑<\/strong>：应先报环；输出顺序必有违反方向的边。\n<\/li><li>\n<strong>无向图误用 SCC<\/strong>：无向边天然双向，直接用 UCC 口径即可，双遍搜索是多余开销。\n<\/li><li>\n<strong>回边与横叉边混淆<\/strong>：栈上祖先才是回边；已结束分支是横叉边，环检测结论随之不同。\n<\/li><li>\n<strong>忽略拓扑序并列性<\/strong>：要求&quot;唯一顺序&quot;是误解；无约束顶点对允许任意先后，算法给出一条合法序即可。\n<\/ol>\n<h2>代价与边界复核<\/h2>\n<ul><li>\n两遍 DFS 各 <span class=\"katex-inline\">O(n+m)<\/span>，反转图构造遍历全部边 <span class=\"katex-inline\">O(m)<\/span>，总时间 <span class=\"katex-inline\">O(n+m)<\/span>，空间 <span class=\"katex-inline\">O(n+m)<\/span> 存反转图。\n<\/li><li>\n拓扑排序单遍 DFS，时间 <span class=\"katex-inline\">O(n+m)<\/span>，空间 <span class=\"katex-inline\">O(n)<\/span> 存次序与标记。\n<\/li><li>\n两类算法都以邻接列表为输入；邻接矩阵下邻居扫描变为 <span class=\"katex-inline\">O(n)<\/span> 每顶点，总代价升到 <span class=\"katex-inline\">O(n^2)<\/span>。\n<\/li><li>\n算法不计算路径长度或最短路径；归属与次序结论不替代距离结论。\n<\/ul>\n<h2>DFS 实现：递归栈与显式栈对照<\/h2>\n<p><strong>递归实现<\/strong>：过程调用栈自动保存父顶点返回位置；优点是写法直接，缺点是栈深度等于当前路径长度，图很深时语言栈可能溢出。 <strong>显式栈实现<\/strong>：手动压入待考察顶点；弹出时区分&quot;首次访问&quot;与&quot;完成回退&quot;两个时刻，完成时刻登记后序。两种实现的边分类与完成次序一致。 <strong>栈内容与当前路径<\/strong>：栈上顶点就是从起点到当前顶点的路径；回边判定只在这个集合内查祖先。横叉边的另一端不在栈上，已在之前的分支结束。 <strong>与 BFS 栈/队列对照<\/strong>：BFS 队列内容是待扩张的层序顶点；DFS 栈内容是当前深入路径。数据结构次序不同，派生结论不同：BFS 出距离标签，DFS 出完成次序。<\/p>\n<h2>第二算例：三节点环与链的 SCC 对照<\/h2>\n<p>图甲：<span class=\"katex-inline\">a\\to b<\/span>、<span class=\"katex-inline\">b\\to c<\/span>、<span class=\"katex-inline\">c\\to a<\/span>，三点互相可达，单个 SCC <span class=\"katex-inline\">\\{a,b,c\\}<\/span>。 图乙：<span class=\"katex-inline\">a\\to b<\/span>、<span class=\"katex-inline\">b\\to c<\/span>，单向链，三个单点 SCC <span class=\"katex-inline\">\\{a\\},\\{b\\},\\{c\\}<\/span>。<\/p>\n<p>Kosaraju 在甲上：第一遍完成次序任意，反转图同构；第二遍单棵树覆盖三点。在乙上：第一遍次序 <span class=\"katex-inline\">c,b,a<\/span>，反转图边 <span class=\"katex-inline\">b\\to a<\/span>、<span class=\"katex-inline\">c\\to b<\/span>；第二遍从 <span class=\"katex-inline\">a<\/span> 起只达 <span class=\"katex-inline\">a<\/span>，再 <span class=\"katex-inline\">b<\/span>，再 <span class=\"katex-inline\">c<\/span>，三个单点树。<\/p>\n<p>对照结论：SCC 判据是双向路径；单向链上 <span class=\"katex-inline\">a<\/span> 到 <span class=\"katex-inline\">c<\/span> 有路径但 <span class=\"katex-inline\">c<\/span> 回不到 <span class=\"katex-inline\">a<\/span>，不能并入同块。环是双向可达的充分结构，不是唯一结构。<\/p>\n<h2>拓扑与 SCC 的算法选择速查<\/h2>\n<ul><li>\n输入是 DAG、要排依赖顺序：走拓扑排序，单遍 DFS 取逆后序。\n<\/li><li>\n输入含环：先报环存在；若需求是分组，改求强连通分量。\n<\/li><li>\n输入有向图、要双向可达子集：走 Kosaraju 双遍 DFS。\n<\/li><li>\n输入无向图：分组用 UCC 单遍框架，不必双遍。\n<\/li><li>\n需要块内距离：分量划分完成后，在块内另跑 BFS（等权）或加权最短路径算法。\n<\/ul>\n<p>选择顺序：先判图方向（有向/无向），再判需求（排序/分组/距离），再落算法；跳过前两步直接套搜索，是次序类错误的常见来源。<\/p>\n<h2>环检测的执行细节<\/h2>\n<p>DFS 维护当前递归栈集合：访问顶点 <span class=\"katex-inline\">u<\/span> 时入栈；考察邻居 <span class=\"katex-inline\">w<\/span>，若 <span class=\"katex-inline\">w<\/span> 在栈中，回边 <span class=\"katex-inline\">(u,w)<\/span> 发现，环存在。回退时把 <span class=\"katex-inline\">u<\/span> 移出栈。横叉边的 <span class=\"katex-inline\">w<\/span> 已结束、不在栈中，不触发环判定。无向图中第二次遇到已访问邻居即为回边，不另设横叉分支。<\/p>\n<p>工程上环检测用于：依赖死锁发现、循环引用检查、调度图合法性校验。检测到环后，输出顺序任务不可排，应回退到任务侧解除循环依赖。<\/p>\n<h2>第二遍 DFS 树为何恰是一个 SCC<\/h2>\n<p>第二遍在反转图 <span class=\"katex-inline\">G^R<\/span> 上按第一遍逆序剥离。设树根 <span class=\"katex-inline\">s<\/span>，树内顶点 <span class=\"katex-inline\">u<\/span>：<span class=\"katex-inline\">G^R<\/span> 中有 <span class=\"katex-inline\">s\\to u<\/span> 路径，反转回 <span class=\"katex-inline\">G<\/span> 即 <span class=\"katex-inline\">u\\to s<\/span>；第一遍完成次序约束保证 <span class=\"katex-inline\">G<\/span> 中 <span class=\"katex-inline\">s\\to u<\/span> 路径存在。双向路径闭合，<span class=\"katex-inline\">u<\/span> 与 <span class=\"katex-inline\">s<\/span> 同 SCC。树外顶点在另一棵树，跨树不存在双向路径，否则两次搜索会连通。这一闭合链条依赖两遍图方向与次序配对，颠倒后链条断开。<\/p>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出 DFS 树边、回边、前向边、横叉边的判定位置，哪一类边标志环存在？\n<\/li><li>\n对边 <span class=\"katex-inline\">(u,v)<\/span>，证明拓扑逆后序中 <span class=\"katex-inline\">u<\/span> 排在 <span class=\"katex-inline\">v<\/span> 之前，分 <span class=\"katex-inline\">v<\/span> 已访问与未访问两种情形。\n<\/li><li>\n含环图为什么不存在拓扑顺序？用循环等待描述。\n<\/li><li>\nKosaraju 两遍各在什么图上执行？遍历次序由哪一遍提供？\n<\/li><li>\n为什么无向图上跑 SCC 算法会退化为 UCC 划分？\n<\/ol><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：算法详解 卷2 图算法和数据结构.pdf · p.89<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">宽度优先搜索（BFS）：访问层数与无权最短路径<\/a><\/span><\/div><h1>单源最短路径问题：边长前提与 BFS 的失效边界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch02（原书 §3.1，PDF 第 89–91 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>单源最短路径问题要求给定有向图 <span class=\"katex-inline\">G=(V,E)<\/span>、每条边的长度 <span class=\"katex-inline\">A_{vw}<\/span> 与起点 <span class=\"katex-inline\">s<\/span>，对每个 <span class=\"katex-inline\">v\\in V<\/span> 求出从 <span class=\"katex-inline\">s<\/span> 到 <span class=\"katex-inline\">v<\/span> 的路径长度最小值 <span class=\"katex-inline\">\\mathrm{dist}(s,v)<\/span>；路径长度是沿途边长之和，BFS 只在边长全为 1 时给出这个值，边长不等时需要加权搜索算法。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>路网导航、任务依赖耗时、通信链路开销，本质都是&quot;从起点到各点的最小代价路径&quot;。与无权图问&quot;最少几跳&quot;不同，这里每条边带一个代价数字，路径总代价是边权相加，跳数少不代表代价小。先要把问题口径钉住：输入是什么、输出是什么、边长允许取什么符号，再判断现有搜索工具能不能用。<\/p>\n<p>不先划清边界会出两类错。一是把 BFS 的层号直接当加权距离，在混合权值图上报出偏长或偏短的路线；二是忽略边长符号前提，把只在非负权成立的算法套到负权甚至负环场景，得到无法修正的错误结果。本概念把最短路径问题的形式定义、代价口径与 BFS 的适用边界讲清，为 c06 的 Dijkstra 铺好前提。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>输入图<\/strong>：有向图 <span class=\"katex-inline\">G=(V,E)<\/span>；本书口径下边可带长度，记边 <span class=\"katex-inline\">(v,w)<\/span> 的长度为 <span class=\"katex-inline\">A_{vw}<\/span>。无向图可视为双向各一条同边长有向边。<\/p>\n<p><strong>起点 <span class=\"katex-inline\">s<\/span><\/strong>：指定的源点；<span class=\"katex-inline\">\\mathrm{dist}(s,s)=0<\/span>。<\/p>\n<p><strong>路径长度<\/strong>：路径 <span class=\"katex-inline\">P=(v_0,v_1,\\dots,v_k)<\/span> 的长度为 <span class=\"katex-inline\">\\sum_{i=0}^{k-1} A_{v_i v_{i+1}}<\/span>，即沿途边权之和，不是边的条数。<\/p>\n<p><strong>最短路径长度<\/strong>：<span class=\"katex-inline\">\\mathrm{dist}(s,v)=\\min\\{\\text{所有 }s\\to v\\text{ 路径的长度}\\}<\/span>；若不可达，记 <span class=\"katex-inline\">+\\infty<\/span>。<\/p>\n<p><strong>最短路径<\/strong>：取得这个最小长度的路径本身；要还原路径需记录前驱指针。<\/p>\n<p><strong>边长前提分类<\/strong>：<\/p>\n<ul><li>\n非负权：<span class=\"katex-inline\">A_{vw}\\ge 0<\/span> 对全部边成立；\n<\/li><li>\n含负权：存在 <span class=\"katex-inline\">A_{vw}&lt;0<\/span> 的边；\n<\/li><li>\n负环：绕一圈总长为负的环；绕环次数越多路径越短，<span class=\"katex-inline\">\\mathrm{dist}<\/span> 趋向 <span class=\"katex-inline\">-\\infty<\/span>，不存在有限最短路径。\n<\/ul>\n<p><strong>BFS 口径<\/strong>：BFS 把每条边贡献记为 1，层号是最少跳数；只有在 <span class=\"katex-inline\">A_{vw}\\equiv 1<\/span>（或权值全相等）时，最少跳数路径才与总长最短路径重合。<\/p>\n<p><strong>正例<\/strong>：边 <span class=\"katex-inline\">(s,a)=1<\/span>、<span class=\"katex-inline\">(a,c)=10<\/span>、<span class=\"katex-inline\">(s,c)=4<\/span>。<span class=\"katex-inline\">\\mathrm{dist}(s,c)=4<\/span>（直达），绕行 <span class=\"katex-inline\">1+10=11<\/span>；跳数上直达 1 跳、绕行 2 跳，两个口径结论方向一致但数值含义不同。<\/p>\n<p><strong>反例<\/strong>：若直接用 BFS 层号报 <span class=\"katex-inline\">c<\/span> 的&quot;距离&quot;，层号记 1，与总长 4 是两种量纲；在不等权图上把层号当路程，比较基准已经错了。<\/p>\n<h2>原理推导：BFS 为什么在加权图上失效<\/h2>\n<ol><li>\n<strong>BFS 距离归纳的前提<\/strong>：c02 证明层号等于最少跳数时，每步递推是 <span class=\"katex-inline\">d(w)=d(u)+1<\/span>，假设每条边贡献相同代价。\n<\/li><li>\n<strong>加权递推应有的形式<\/strong>：加权口径下候选距离为 <span class=\"katex-inline\">\\mathrm{len}(u)+A_{uw}<\/span>，边权 <span class=\"katex-inline\">A_{uw}<\/span> 随边变化；候选值不再只由层号决定。\n<\/li><li>\n<strong>次序冲突<\/strong>：BFS 按层序扩张，先发现的顶点不一定候选代价最低；若在发现时登记距离，后续经其他路径可能得到更小候选，已登记值需要回改。BFS 没有回改机制，距离标签会偏大。\n<\/li><li>\n<strong>结论分界<\/strong>：边权全相等时，层序与代价序一致，BFS 结论继承；边权不等时，必须按候选代价选下一个顶点，这正是 c06 Dijkstra 的规则。\n<\/li><li>\n<strong>符号前提的位置<\/strong>：即使换成按代价选边，算法正确性还依赖边长非负；负权边可使已锁定顶点日后出现更短路径，负环则使最短路径不存在。符号边界在 c06 证明中定位到具体一步。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n问题适用：求单源到各点的最小路径代价；路径可重复经过顶点，但简单路径（不绕环）在非负权下已足够优。\n<\/li><li>\n非负权边界：<span class=\"katex-inline\">A_{vw}\\ge 0<\/span> 是 Dijkstra 类贪心算法的前提；含负权需换支持负权的最短路径算法（如 Bellman-Ford 口径，本书未展开）。\n<\/li><li>\n负环边界：负环可达时 <span class=\"katex-inline\">\\mathrm{dist}<\/span> 无有限值，任何枚举固定次数的算法都不能给出答案；应先检测负环。\n<\/li><li>\n不可达边界：起点到 <span class=\"katex-inline\">v<\/span> 无路径时 <span class=\"katex-inline\">\\mathrm{dist}=+\\infty<\/span>，不是 0。\n<\/li><li>\n失败案例：把路径长度理解为边数，混合权值下比较的是跳数而非代价；输出路线时量纲必须写明。\n<\/li><li>\n失败案例：忽略前驱记录，只存最短长度；要报告路径本身时无法回溯中间顶点。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>最少跳数路径 vs 最短总长路径<\/strong>：前者数边的条数，后者数边权之和；等权时重合，不等权时分立。BFS 服务前者，Dijkstra 服务后者。\n<\/li><li>\n<strong>路径长度 vs 路径本身<\/strong>：长度是标量代价，路径是顶点序列；算法可只输出长度，也可借前驱还原序列。\n<\/li><li>\n<strong>非负权 vs 含负权 vs 负环<\/strong>：三者是递进边界；含负权不一定有负环，但已有算法前提需要更换；负环使最短路径长度不存在有限值。\n<\/li><li>\n<strong>单源 vs 全源<\/strong>：单源固定一个起点求到各点；全源求每对顶点间最短路径，问题规模与算法不同。本书本章只处理单源。\n<\/ul>\n<h2>一个口径对照演示<\/h2>\n<p>取边 <span class=\"katex-inline\">(s,a)=2<\/span>、<span class=\"katex-inline\">(a,b)=3<\/span>、<span class=\"katex-inline\">(s,b)=6<\/span>。跳数口径：<span class=\"katex-inline\">s\\to b<\/span> 直达 1 跳，绕行 2 跳；BFS 层号记 <span class=\"katex-inline\">b=1<\/span>。总长口径：直达长 6，绕行长 <span class=\"katex-inline\">2+3=5<\/span>，<span class=\"katex-inline\">\\mathrm{dist}(s,b)=5<\/span>。两个口径在同一图上给出不同排序依据：层号看边数，总长看权值和。接到规划题先确认比较的是哪种口径，再决定搜索类型。<\/p>\n<p>工程场景中，导航路线按路程或耗时加权，任务调度按工序耗时加权，网络路由按链路开销加权；这些场景边权不等权值也不全为 1，BFS 的层序结论不能直接搬用。等权简化只出现在跳数估计、圈层扩散等少数问题里。<\/p>\n<h2>常见误判<\/h2>\n<ul><li>\n误判：最短路径就是边最少的路径。只有等权图二者重合；不等权图最短是总长最小，边数可能更多。\n<\/li><li>\n误判：含负权边的图一定不存在最短路径。单条负权边若无负环，最短路径仍存在，只是锁定式贪心不适用。\n<\/li><li>\n误判：不可达顶点距离记 0。不可达候选集合为空，距离 <span class=\"katex-inline\">+\\infty<\/span>；0 是起点自身的特殊值。\n<\/li><li>\n误判：算法输出长度就等于输出路线。长度是标量，路线是顶点序列；要序列必须另存前驱指针。\n<\/ul>\n<h2>问题口径速查<\/h2>\n<p>单源固定一个起点求到各点；全源求每对顶点间最短长度，规模与算法不同。本书本章只处理单源。边权全 1 时 BFS 即可，边权非负走 Dijkstra，含负权需可回改的多轮松弛方法，负环则最短路径无有限下界。接到题目先核符号与起点个数，再落算法类型。<\/p>\n<h2>联系<\/h2>\n<p>前置：c02 的 BFS 给出等权口径下的距离，本概念划出它不能覆盖的加权区域。后继：c06 在非负权前提下把 BFS 的扩张框架改为按 Dijkstra 得分选择；c08 再用堆把这套选择做成高效优先队列。最短路径问题是后续网络路由、调度规划与图上动态规划的公共骨架。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（单源最短路径问题：边长前提与 BFS 的失效边界）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：最短路径口径、BFS 失效边界与权值符号推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要划清最短路径问题的边界，往回追四层：<\/p>\n<ol><li>\n<strong>图与边权表示<\/strong>：顶点、边、边权存进邻接列表或矩阵（c01）；搜索能沿边列出候选邻居。\n<\/li><li>\n<strong>路径代价口径<\/strong>：路径长度定义为边权之和，区别于边数；口径先于算法确定。\n<\/li><li>\n<strong>等权搜索结论<\/strong>：BFS 层号在边权全 1 时等于最少跳数（c02）；这条结论的前提是每条边贡献相同。\n<\/li><li>\n<strong>权值符号分层<\/strong>：非负权、含负权、负环三种情形决定哪些贪心规则成立；符号边界定位到正确性证明的具体步骤。\n<\/ol>\n<p>依赖链方向：图表示 → 代价口径 → 等权 BFS 结论 → 加权与符号边界 → 后续算法选型。<\/p>\n<h2>正向推导：从路径定义到问题形式化<\/h2>\n<p><strong>步骤 1：写出路径<\/strong>。<span class=\"katex-inline\">s<\/span> 到 <span class=\"katex-inline\">v<\/span> 的一条路径是顶点序列 <span class=\"katex-inline\">P=(v_0=s,v_1,\\dots,v_k=v)<\/span>，每段 <span class=\"katex-inline\">(v_{i-1},v_i)\\in E<\/span>。 <strong>步骤 2：定义长度<\/strong>。<span class=\"katex-inline\">L(P)=\\sum_{i=1}^{k} A_{v_{i-1}v_i}<\/span>，各边权值相加；<span class=\"katex-inline\">k=0<\/span> 时 <span class=\"katex-inline\">L(P)=0<\/span>。 <strong>步骤 3：取最小值<\/strong>。<span class=\"katex-inline\">\\mathrm{dist}(s,v)=\\min_{P:s\\to v} L(P)<\/span>；候选路径集合为空时记 <span class=\"katex-inline\">+\\infty<\/span>。 <strong>步骤 4：区分输出对象<\/strong>。最短长度是标量；最短路径是取得最小值的序列。要还原序列需在松弛时记录前驱。 <strong>步骤 5：界定符号情形<\/strong>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">A_{vw}\\ge 0<\/span> 全部成立：非负权图；\n<\/li><li>\n存在 <span class=\"katex-inline\">A_{vw}&lt;0<\/span>：含负权图；\n<\/li><li>\n存在总长为负的环：绕环使路径长度递减，<span class=\"katex-inline\">\\mathrm{dist}<\/span> 无有限下界。\n<\/ul>\n<h2>数值算例一：等权与不等权两图对照<\/h2>\n<p><strong>等权图<\/strong>：<span class=\"katex-inline\">s<\/span> 邻居 <span class=\"katex-inline\">a,b<\/span>，<span class=\"katex-inline\">a<\/span> 邻居 <span class=\"katex-inline\">c<\/span>。边权全 1。BFS 层号 <span class=\"katex-inline\">d(s)=0,d(a)=d(b)=1,d(c)=2<\/span>；总长最短路径长度同为 <span class=\"katex-inline\">0,1,2<\/span>，两口径重合。<\/p>\n<p><strong>不等权图<\/strong>：边 <span class=\"katex-inline\">(s,a)=1<\/span>、<span class=\"katex-inline\">(a,c)=10<\/span>、<span class=\"katex-inline\">(s,c)=4<\/span>。<\/p>\n<ul><li>\n跳数口径：直达 <span class=\"katex-inline\">s\\to c<\/span> 1 跳，绕行 <span class=\"katex-inline\">s\\to a\\to c<\/span> 2 跳，BFS 记 <span class=\"katex-inline\">d(c)=1<\/span>。\n<\/li><li>\n总长口径：直达长 4，绕行长 <span class=\"katex-inline\">1+10=11<\/span>，<span class=\"katex-inline\">\\mathrm{dist}(s,c)=4<\/span>。\n<\/li><li>\n对照：跳数少的路线不保证总长最短；层号 1 与总长 4 量纲不同，不能互替。\n<\/ul>\n<p><strong>延伸核算<\/strong>：再加边 <span class=\"katex-inline\">(b,c)=2<\/span>，<span class=\"katex-inline\">s\\to b\\to c<\/span> 长 <span class=\"katex-inline\">2<\/span>；候选三条：直达 4，经 <span class=\"katex-inline\">a<\/span> 为 11，经 <span class=\"katex-inline\">b<\/span> 为 2。最短 <span class=\"katex-inline\">\\mathrm{dist}(s,c)=2<\/span>，而 BFS 层号仍为 1。差别随权值分散拉大。<\/p>\n<h2>数值算例二：负权边与负环的方向<\/h2>\n<p><strong>含单条负权边，无负环<\/strong>：边 <span class=\"katex-inline\">(s,a)=5<\/span>、<span class=\"katex-inline\">(a,b)=2<\/span>、<span class=\"katex-inline\">(s,b)=6<\/span>、<span class=\"katex-inline\">(b,a)=-3<\/span>。<\/p>\n<ul><li>\n候选到 <span class=\"katex-inline\">a<\/span>：直达 5；经 <span class=\"katex-inline\">s\\to b\\to a<\/span> 为 <span class=\"katex-inline\">6-3=3<\/span>，更短。\n<\/li><li>\n到 <span class=\"katex-inline\">b<\/span>：直达 6；经 <span class=\"katex-inline\">s\\to a\\to b<\/span> 为 <span class=\"katex-inline\">5+2=7<\/span>。\n<\/li><li>\n此图无负环，但 Dijkstra 式锁定规则可能把 <span class=\"katex-inline\">a<\/span> 按 5 锁定，漏掉后到的 3；含负权需要不锁定、可回改的算法。\n<\/ul>\n<p><strong>负环情形<\/strong>：边 <span class=\"katex-inline\">(x,y)=1<\/span>、<span class=\"katex-inline\">(y,z)=1<\/span>、<span class=\"katex-inline\">(z,x)=-5<\/span>，环长 <span class=\"katex-inline\">1+1-5=-3<\/span>。从环上任意点出发，绕环一圈路径减 3，绕 <span class=\"katex-inline\">k<\/span> 圈长度趋向 <span class=\"katex-inline\">-\\infty<\/span>；<span class=\"katex-inline\">\\mathrm{dist}<\/span> 不存在有限最小值。任何固定迭代次数的算法都报不出有限答案，前置任务是先检测负环。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：层号当加权距离<\/strong>。不等权图上用 BFS 层号报路程，跳数口径覆盖了代价口径；复盘：先确认边权是否相等，不等权则距离标签另算。 <strong>案例 2：忽略符号前提选算法<\/strong>。把非负权贪心算法套到含负权图，已锁定顶点不回改，后续更短路径被丢弃；复盘：选算法前核边权符号，负权场景换支持松弛回改的方法。 <strong>案例 3：负环上报有限距离<\/strong>。绕环递减使长度无下界，输出任何有限值都可被更长绕环推翻；复盘：先判负环，存在则报告距离不存在。 <strong>案例 4：不可达记 0<\/strong>。起点到 <span class=\"katex-inline\">v<\/span> 无边连通时 <span class=\"katex-inline\">\\mathrm{dist}=+\\infty<\/span>，与起点自身的 0 混淆会把孤岛当起点；复盘：不可达与零代价分开记录。 <strong>案例 5：只存长度不留前驱<\/strong>。算出最短长度后要报告路线，中间顶点无法回溯；复盘：需要路径序列就在松弛时同步记前驱。<\/p>\n<h2>延伸推演：松弛操作的一般形式<\/h2>\n<p>加权搜索的基本动作是松弛（relaxation）：对边 <span class=\"katex-inline\">(u,w)<\/span>，若 <code>len(u) + A_uw &lt; len(w)<\/code>，则更新 <code>len(w)<\/code> 为该候选值，并记前驱 <span class=\"katex-inline\">u<\/span>。<\/p>\n<ol><li>\n松弛比较的是候选总长，不是层号；每条边可被考察多次。\n<\/li><li>\nBFS 的 <span class=\"katex-inline\">d(w)=d(u)+1<\/span> 是松弛在等权时的特例。\n<\/li><li>\n贪心最短路径算法围绕&quot;何时锁定哪个顶点&quot;组织：非负权保证先锁定的点不会被后续更短路径推翻。\n<\/li><li>\n含负权算法允许顶点距离被反复松弛更新，代价是迭代次数上升；负环则使松弛不收敛。\n<\/ol>\n<h2>与后续算法的衔接位置<\/h2>\n<ul><li>\nc06 Dijkstra：非负权前提下，每轮选候选得分最低的跨集合边扩张 <span class=\"katex-inline\">X<\/span>；正确性证明的下界环节依赖边权非负。\n<\/li><li>\nc08 堆提速：取最低候选与松弛后更新位置，由堆的 ExtractMin 与下降操作承担。\n<\/li><li>\n本书未展开的负权算法：Bellman-Ford 口径按轮松弛全部边，可检测负环；本概念只划出边界，不替代其证明。\n<\/ul>\n<h2>问题分类对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>问题类型<\/th><th>输入<\/th><th>输出<\/th><th>代表算法<\/th><\/tr><\/thead><tbody><tr><td>无权最短路径<\/td><td>图，边权默认 1<\/td><td>最少跳数<\/td><td>BFS<\/td><\/tr><tr><td>非负权最短路径<\/td><td>图，<span class=\"katex-inline\">A\\ge 0<\/span><\/td><td>最小总长<\/td><td>Dijkstra<\/td><\/tr><tr><td>含负权最短路径<\/td><td>图，可有负边<\/td><td>最小总长或负环报告<\/td><td>支持多轮松弛的算法<\/td><\/tr><tr><td>全源最短路径<\/td><td>图，每对顶点<\/td><td>两两最短长度<\/td><td>全源算法，本书未展开<\/td><\/tr><\/tbody><\/table><\/div>\n<p>对照用途：接到路线规划题先判边权符号与起点个数，再落表选类型；类型错配是最短路径类错误的主要来源。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n<strong>卡在&quot;路径长度到底加什么&quot;<\/strong>：加边权 <span class=\"katex-inline\">A_{vw}<\/span>，不是数边；把边权全换成 1，长度表达式退化为边数。\n<\/li><li>\n<strong>卡在&quot;BFS 失效在哪一步&quot;<\/strong>：失效在递推式——BFS 用 <span class=\"katex-inline\">+1<\/span>，加权应用 <span class=\"katex-inline\">+A_{uw}<\/span>；次序规则没跟着换，距离标签就不压住总长。\n<\/li><li>\n<strong>卡在&quot;负权边和负环差别&quot;<\/strong>：负权边是单条边为负，不一定成环；负环是闭环总长为负，使最短路径无下界。前者换算法，后者距离不存在。\n<\/li><li>\n<strong>卡在&quot;不可达为什么是 <span class=\"katex-inline\">+\\infty<\/span>&quot;<\/strong>：候选路径集合为空，最小值不存在；记 0 会被误读为零代价直达。\n<\/ul>\n<h2>松弛动作逐边推演<\/h2>\n<p>取图：<span class=\"katex-inline\">s\\to a<\/span> 权 2，<span class=\"katex-inline\">a\\to b<\/span> 权 3，<span class=\"katex-inline\">s\\to b<\/span> 权 6，<span class=\"katex-inline\">b\\to c<\/span> 权 1。初始 <code>len(s)=0<\/code>，其余 <span class=\"katex-inline\">+\\infty<\/span>。<\/p>\n<ol><li>\n松弛 <span class=\"katex-inline\">(s,a)<\/span>：候选 <span class=\"katex-inline\">0+2=2&lt;+\\infty<\/span>，<code>len(a)=2<\/code>，前驱 <span class=\"katex-inline\">s<\/span>。\n<\/li><li>\n松弛 <span class=\"katex-inline\">(s,b)<\/span>：候选 <span class=\"katex-inline\">0+6=6&lt;+\\infty<\/span>，<code>len(b)=6<\/code>，前驱 <span class=\"katex-inline\">s<\/span>。\n<\/li><li>\n松弛 <span class=\"katex-inline\">(a,b)<\/span>：候选 <code>len(a)+3=5&lt;6<\/code>，更新 <code>len(b)=5<\/code>，前驱 <span class=\"katex-inline\">a<\/span>。\n<\/li><li>\n松弛 <span class=\"katex-inline\">(b,c)<\/span>：候选 <code>len(b)+1=6<\/code>，<code>len(c)=6<\/code>。\n<\/ol>\n<p>最终 <code>len(a)=2,len(b)=5,len(c)=6<\/code>。步骤 3 是回改动作：<span class=\"katex-inline\">b<\/span> 的临时值 6 被更短候选 5 替换。支持回改是加权最短路径的基本动作；Dijkstra 把回改限制在未处理顶点上，已入 <span class=\"katex-inline\">X<\/span> 顶点锁定。<\/p>\n<p><strong>对照 BFS<\/strong>：等权图同一松弛式为 <span class=\"katex-inline\">d(w)=d(u)+1<\/span>；层序保证先发现即最短，无需回改。加权候选随边权变化，发现次序不再压住代价，回改成为必要环节。<\/p>\n<h2>路径口径常见追问<\/h2>\n<p><strong>追问 1：路径能不能重复走顶点？<\/strong> 非负权下绕环只增不减代价，最优可取简单路径（顶点不重复）；含负权时绕负环递减，问题转为负环检测。算法实现不必先禁止重复，结论在符号边界上分别成立。 <strong>追问 2：边长可以是零吗？<\/strong> 可以。零权边不改变非负前提；得分比较时零边贡献 0，Dijkstra 证明第 4 步 <span class=\"katex-inline\">R\\ge 0<\/span> 仍成立。 <strong>追问 3：无向图怎么建模？<\/strong> 每条无向边在两个方向各存一条同权有向边，最短路径口径不变。 <strong>追问 4：起点到自身距离为什么是 0？<\/strong> 空路径长度求和为 0；不是&quot;没有边所以不可达&quot;。<\/p>\n<h2>符号边界对算法选型的影响<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>情形<\/th><th>最短路径是否存在有限值<\/th><th>可用思路<\/th><th>本书对应<\/th><\/tr><\/thead><tbody><tr><td>边权全 1<\/td><td>存在<\/td><td>BFS<\/td><td>c02<\/td><\/tr><tr><td>边权非负<\/td><td>存在<\/td><td>Dijkstra 贪心锁定<\/td><td>c06<\/td><\/tr><tr><td>含负权、无负环<\/td><td>存在<\/td><td>多轮松弛（本书未展开）<\/td><td>仅划边界<\/td><\/tr><tr><td>含负环<\/td><td>不存在有限最小值<\/td><td>先检测负环，报告无下界<\/td><td>c05 边界<\/td><\/tr><\/tbody><\/table><\/div>\n<p>选型顺序：先看边权符号，再看是否含环；符号未定就选算法，正确性无从保证。本书第 3 章只展开非负权情形，负权场景作为边界认识即可。<\/p>\n<h2>与距离标签相关的存储分工<\/h2>\n<ul><li>\n<code>len(v)<\/code>：当前已知最佳候选长度；未处理顶点可为临时值，已处理顶点为确定值。\n<\/li><li>\npredecessor(<span class=\"katex-inline\">v<\/span>)：松弛成功时记录来源顶点；回溯到 <span class=\"katex-inline\">s<\/span> 得路径序列。\n<\/li><li>\n标记表：防止重复入队；与距离标签分离，职责不混。\n<\/li><li>\n不可达集合：算法结束后仍 <code>len=+∞<\/code> 的顶点，单独归类，不混入零代价。\n<\/ul>\n<p>这套分工在 c06 的 Dijkstra 与 c08 的堆实现中延续；存储层先分清标签、前驱、标记三类信息，算法流程才好落地。<\/p>\n<h2>常见错误清单<\/h2>\n<ol><li>\n把边数当路径长度，量纲错位。\n<\/li><li>\n不等权图上直接引用 BFS 层号结论。\n<\/li><li>\n未核边权符号就套用贪心锁定算法。\n<\/li><li>\n负环场景输出有限最短长度。\n<\/li><li>\n不可达顶点记 0 而非 <span class=\"katex-inline\">+\\infty<\/span>。\n<\/li><li>\n只存长度不留前驱，无法还原路线。\n<\/li><li>\n把临时候选值当作最终确定距离报告。\n<\/ol>\n<h2>完整数值表：四顶点候选路径枚举<\/h2>\n<p>顶点 <span class=\"katex-inline\">s,a,b,c<\/span>，边权：<span class=\"katex-inline\">s\\to a=3<\/span>，<span class=\"katex-inline\">s\\to b=8<\/span>，<span class=\"katex-inline\">a\\to b=1<\/span>，<span class=\"katex-inline\">a\\to c=5<\/span>，<span class=\"katex-inline\">b\\to c=2<\/span>。<\/p>\n<p><strong>枚举候选路径<\/strong>：<\/p>\n<ul><li>\n到 <span class=\"katex-inline\">a<\/span>：<span class=\"katex-inline\">s\\to a<\/span>，长 3。\n<\/li><li>\n到 <span class
