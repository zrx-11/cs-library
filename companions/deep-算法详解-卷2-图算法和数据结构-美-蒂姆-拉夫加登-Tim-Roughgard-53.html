.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}

.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}

.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}

.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}

.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;

.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}

.card-counts{color:var(--muted);font-size:13px}

.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}

.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}

[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}

#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */

#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}

#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}

  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}

  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}

page": 108}, "prerequisites": [], "depthFragment": "concepts/c07-depth.md"}, {"id": "c08", "title": "堆的应用与 Dijkstra 的优先队列提速", "file": "concepts/c08.md", "chapterIds": ["ch03"], "difficulty": "进阶", "source": {"file": "算法详解 卷2 图算法和数据结构.pdf", "page": 111}, "prerequisites": ["c06", "c07"], "depthFragment": "concepts/c08-depth.md"}, {"id": "c09", "title": "二叉搜索树：有序操作与旋转平衡", "file": "concepts/c09.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "算法详解 卷2 图算法和数据结构.pdf", "page": 140}, "prerequisites": ["c07"], "depthFragment": "concepts/c09-depth.md"}, {"id": "c10", "title": "散列表：散列函数、冲突解决、负载因子与布隆过滤器", "file": "concepts/c10.md", "chapterIds": ["ch04"], "difficulty": "进阶", "source": {"file": "算法详解 卷2 图算法和数据结构.pdf", "page": 167}, "prerequisites": [], "depthFragment": "concepts/c10-depth.md"}], "glossary": [{"term": "图 $G=(V,E)$", "def": "由顶点集 $V$ 与边集 $E$ 组成的结构；顶点表示对象，边表示对象之间的关系", "chapterId": "ch01"}, {"term": "有向图与无向图", "def": "无向图的边 $(v,w)$ 是无序对，$(v,w)$ 与 $(w,v)$ 相同；有向图的边是有序对，从尾 $v$ 指向头 $w$，两条方向各算一条边", "chapterId": "ch01"}, {"term": "邻接列表", "def": "为每个顶点维护一个列表，存放与它相邻的顶点；空间随边数线性增长，适合稀疏图", "chapterId": "ch01"}, {"term": "邻接矩阵", "def": "用 $n\\times n$ 矩阵记录每对顶点之间是否有边（或边长）；判断单条边在不在为 $O(1)$，空间随顶点数平方增长", "chapterId": "ch01"}, {"term": "连通分量", "def": "无向图中互相可达的极大顶点子集；UCC 算法通过反复从未访问顶点发起搜索把整个图切成若干分量", "chapterId": "ch01"}, {"term": "拓扑排序", "def": "对有向无环图给出顶点顺序，使每条边都从排在前面的顶点指向排在后面的顶点；可用 DFS 逆后序构造", "chapterId": "ch01"}, {"term": "强连通分量", "def": "有向图中任意两个顶点互相可达的极大子集；Kosaraju 算法在原图与反转图上各跑一遍 DFS 完成划分", "chapterId": "ch01"}, {"term": "最短路径长度 $\\mathrm{dist}(s,v)$", "def": "从起点 $s$ 到顶点 $v$ 的所有路径中边长之和的最小值；BFS 只在边长全为 1 时给出这个值", "chapterId": "ch02"}, {"term": "Dijkstra 得分", "def": "对跨集合边 $(v,w)$，$v\\in X$、$w\\notin X$，得分定义为 $\\mathrm{len}(v)+A_{vw}$；主循环选得分最低的边把头顶点加入 $X$", "chapterId": "ch02"}, {"term": "堆序不变量", "def": "堆中每个节点的键不大于其两个子节点的键；根节点因此是全堆最小键；数组形式下父子位置由 $\\lfloor i/2\\rfloor$、$2i$、$2i+1$ 确定", "chapterId": "ch03"}, {"term": "二叉搜索树（BST）", "def": "满足左子树所有键小于节点键、右子树所有键大于节点键的树；Search、Min、Max、前驱、插入、删除均在 $O(\\text{高度})$ 时间完成", "chapterId": "ch04"}, {"term": "负载因子", "def": "散列表中对象数与槽位数之比；开放地址法负载不超过 1，链地址法可超过 1，但平均桶长随负载增长", "chapterId": "ch04"}, {"term": "散列函数", "def": "把对象键映射到槽位编号的函数；好的散列函数应把相似键分散到不同槽位，冲突尽量均匀", "chapterId": "ch04"}, {"term": "布隆过滤器", "def": "用多个散列函数与位数组实现的紧凑集合成员判断；只支持插入与查找，允许假阳性，不允许假阴性，不支持删除", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [], "flashcards": []}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：算法详解 卷2 图算法和数据结构.pdf · p.19<\/div><h1>第 1–2 章：图的基础知识、图的搜索及其应用<\/h1>\n<blockquote>对应原书第 1 章「图的基础知识」、第 2 章「图的搜索及其应用」（PDF 第 19–87 页；印刷页 = PDF 页 − 18，已用第 1 章章首 PDF 19 / 印刷 1、第 2 章章首 PDF 32 / 印刷 14 两处互核）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n区分无向边与有向边，说出顶点、边、邻接、度、出度、入度等术语，并判断一个图是稀疏图还是稠密图；\n<\/li><li>\n在邻接列表与邻接矩阵两种表示之间做选择，说明各自的空间开销与单条边查询代价；\n<\/li><li>\n在一张小图上手工跑通 BFS，按访问层数读出每个顶点到起点的无权最短路径；\n<\/li><li>\n用 UCC 算法列出无向图的全部连通分量，说明算法为什么不会把同一分量重复计数；\n<\/li><li>\n跑通 DFS 遍历顺序，对一个有向无环图给出合法拓扑顺序；\n<\/li><li>\n说出强连通分量的定义，复述 Kosaraju 双遍 DFS 的两遍各做什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>图是把对象与对象间关系打包成 <span class=\"katex-inline\">G=(V,E)<\/span> 的结构；搜索算法在这套结构上维护一个已访问集合，沿边把未访问顶点逐个纳入。BFS 按层扩张、回答无权最短路径，DFS 沿一条路扎到底、服务于拓扑排序与强连通分量划分；两类搜索的线性时间开销来自每条边只被考察常数次。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：图的基本术语与两种表示（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。第 1 章先把对象集合记为顶点集 <span class=\"katex-inline\">V<\/span>，把关系记为边集 <span class=\"katex-inline\">E<\/span>（PDF 第 19 页，§1.1）。无向边 <span class=\"katex-inline\">(v,w)<\/span> 与 <span class=\"katex-inline\">(w,v)<\/span> 是同一条；有向边 <span class=\"katex-inline\">(v,w)<\/span> 有尾 <span class=\"katex-inline\">v<\/span> 与头 <span class=\"katex-inline\">w<\/span>，方向不能互换。第 1.4 节比较两种实现：邻接列表为每个顶点挂一个相邻顶点列表，邻接矩阵用 <span class=\"katex-inline\">n\\times n<\/span> 表记录边是否存在（PDF 第 25 页，§1.4）。选哪一种取决于图稀疏还是稠密，以及程序更常问&quot;某条边在不在&quot;还是&quot;一个顶点的邻居有哪些&quot;。<\/p>\n<h3>2. 概念 2：宽度优先搜索与无权最短路径（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。§2.2 的 BFS 从起点 <span class=\"katex-inline\">s<\/span> 出发，用队列维护待扩张顶点；顶点按到 <span class=\"katex-inline\">s<\/span> 的边数层次被访问，第 <span class=\"katex-inline\">k<\/span> 层顶点距 <span class=\"katex-inline\">s<\/span> 的跳数就是 <span class=\"katex-inline\">k<\/span>（PDF 第 41 页）。这条层数结论只在每条边权值相同（取 1）时成立；边权不等时，跳数最少的路径未必总长最短，这一限制在第 3 章展开。<\/p>\n<h3>3. 概念 3：无向图连通分量（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。§2.3 把连通分量定义为互相可达的极大顶点子集。UCC 算法遍历所有顶点，遇到未访问顶点就从它发起一次完整搜索，把这次访问到的全部顶点标为同一个分量编号（PDF 第 50 页）。每个顶点只被分配一次编号，分量之间没有边相连，否则两个分量本应合并。<\/p>\n<h3>4. 概念 4：深度优先搜索、拓扑排序与强连通分量（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。§2.4 的 DFS 像走迷宫：沿当前边一直扎到走不动，再回退换岔路（PDF 第 57 页）。§2.5 用 DFS 的逆后序构造拓扑排序：对有向无环图，每条边的尾在逆后序中排在头之前。§2.6 的 Kosaraju 算法先在原图上跑 DFS 记录完成次序，再按该次序的逆序在反转图上跑 DFS，每一棵 DFS 树就是一个强连通分量（PDF 第 68 页）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[顶点集 V 与边集 E] --&gt; B[选表示: 邻接列表/邻接矩阵]\nB --&gt; C{边权是否全为 1?}\nC --&gt;|是| D[BFS: 按层扩张, 读无权最短路径]\nC --&gt;|否| E[留待第 3 章 Dijkstra]\nD --&gt; F[UCC: 反复发起搜索切连通分量]\nD --&gt; G[DFS: 走到底再回退]\nG --&gt; H[拓扑排序: DAG 的合法顺序]\nG --&gt; I[Kosaraju: 双遍 DFS 划强连通分量]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这条链的断点在&quot;边权全为 1&quot;这一判断上。若把不等权图硬套 BFS 层数，得到的只是跳数最少的路径，不是总长最短的路径；Kosaraju 的两遍顺序不可颠倒，颠倒后得到的分组不保证互相可达。<\/p>\n<h2>推导一（推演）：BFS 层数为何等于无权最短跳数<\/h2>\n<p>下面按算法执行顺序逐步证明：BFS 给顶点 <span class=\"katex-inline\">v<\/span> 标记的层数 <span class=\"katex-inline\">d(v)<\/span> 等于从 <span class=\"katex-inline\">s<\/span> 到 <span class=\"katex-inline\">v<\/span> 的最少边数。<\/p>\n<ol><li>\n<strong>初始化<\/strong>：<span class=\"katex-inline\">d(s)=0<\/span>，其余顶点未标层。队列只含 <span class=\"katex-inline\">s<\/span>。\n<\/li><li>\n<strong>入队规则<\/strong>：从队列头部取出顶点 <span class=\"katex-inline\">u<\/span>，扫描它的邻居；未访问邻居 <span class=\"katex-inline\">w<\/span> 入队，并令 <span class=\"katex-inline\">d(w)=d(u)+1<\/span>。\n<\/li><li>\n<strong>第一层情形<\/strong>：<span class=\"katex-inline\">s<\/span> 的邻居都在第一层，<span class=\"katex-inline\">d(w)=1<\/span>。从 <span class=\"katex-inline\">s<\/span> 到 <span class=\"katex-inline\">w<\/span> 至少需要一条边，最少边数就是 1，与 <span class=\"katex-inline\">d(w)<\/span> 相等。\n<\/li><li>\n<strong>归纳步<\/strong>：假设所有层号小于 <span class=\"katex-inline\">k<\/span> 的顶点，其 <span class=\"katex-inline\">d<\/span> 值已等于最少边数。取一个首次在第 <span class=\"katex-inline\">k<\/span> 层入队的顶点 <span class=\"katex-inline\">w<\/span>，它由层号 <span class=\"katex-inline\">k-1<\/span> 的顶点 <span class=\"katex-inline\">u<\/span> 扩展而来，于是存在一条长 <span class=\"katex-inline\">k<\/span> 的 <span class=\"katex-inline\">s\\to w<\/span> 路径，最少边数不超过 <span class=\"katex-inline\">k<\/span>。\n<\/li><li>\n<strong>下界<\/strong>：若存在一条长度小于 <span class=\"katex-inline\">k<\/span> 的路径到达 <span class=\"katex-inline\">w<\/span>，沿该路径倒数第二个顶点的层数已小于 <span class=\"katex-inline\">k-1<\/span>，<span class=\"katex-inline\">w<\/span> 会在更早一层被访问并入队，与 <span class=\"katex-inline\">w<\/span> 首次在第 <span class=\"katex-inline\">k<\/span> 层入队矛盾。故最少边数不小于 <span class=\"katex-inline\">k<\/span>。\n<\/li><li>\n上下界相合，<span class=\"katex-inline\">d(w)=k<\/span> 就是无权最短路径的跳数。\n<\/ol>\n<h2>推导二（证明）：UCC 算法输出的分量既不漏也不重<\/h2>\n<p>设 UCC 对无向图 <span class=\"katex-inline\">G=(V,E)<\/span> 输出分量编号 <span class=\"katex-inline\">c(v)<\/span>。下面分两步证明：同一编号的顶点互相可达，不同编号的顶点不可达。<\/p>\n<ol><li>\n<strong>同编号可达<\/strong>：一次搜索从顶点 <span class=\"katex-inline\">u<\/span> 出发，访问到的每个顶点都经由搜索树中的边与 <span class=\"katex-inline\">u<\/span> 相连；无向边双向可达，沿搜索树反向走回 <span class=\"katex-inline\">u<\/span> 即可，故同分量内任意两顶点互相可达。\n<\/li><li>\n<strong>不同编号不可达<\/strong>：反设 <span class=\"katex-inline\">c(v)\\neq c(w)<\/span> 但 <span class=\"katex-inline\">v<\/span> 与 <span class=\"katex-inline\">w<\/span> 之间有一条无向路径。设 <span class=\"katex-inline\">v<\/span> 所属分量的搜索先发起：当那次搜索扩展到 <span class=\"katex-inline\">v<\/span> 后，沿这条路径一路可达 <span class=\"katex-inline\">w<\/span>，<span class=\"katex-inline\">w<\/span> 会在同一次搜索中被访问并分配同一编号，与 <span class=\"katex-inline\">c(w)<\/span> 不同矛盾。\n<\/li><li>\n每个顶点在遇到时要么已有编号、要么被本次搜索编号，<span class=\"katex-inline\">V<\/span> 中没有遗漏的顶点；两次搜索之间不共享顶点编号。输出的划分因此是 <span class=\"katex-inline\">V<\/span> 的一个不相交并集，且每个块是极大可达子集。\n<\/ol>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉&quot;边权全为 1&quot;这条前提<\/strong>：若边权取 <span class=\"katex-inline\">1<\/span> 与 <span class=\"katex-inline\">10<\/span> 混合，BFS 按跳数分层。一个跳数 2、总权 11 的顶点可能比一个跳数 3、总权 3 的顶点先出队；此时 BFS 层数不反映总长最短，第 3 章的 Dijkstra 就是为补救这一情形设计的。\n<\/li><li>\n<strong>把无向边改成有向边却仍用 UCC 分组<\/strong>：无向边 <span class=\"katex-inline\">(v,w)<\/span> 双向可走，有向边只能沿一个方向。<span class=\"katex-inline\">v<\/span> 能到 <span class=\"katex-inline\">w<\/span> 不代表 <span class=\"katex-inline\">w<\/span> 能回 <span class=\"katex-inline\">v<\/span>，沿用无向可达标准会把单向连通误判为双向连通；有向图需要强连通分量口径（§2.6）。\n<\/li><li>\n<strong>颠倒 Kosaraju 两遍的次序<\/strong>：先在反转图上跑、再按完成次序在原图上跑，得到的 DFS 树不保证内部互相可达。次序与图方向的配对是算法成立的条件，不是实现细节。\n<\/li><li>\n<strong>在带环有向图上跑拓扑排序<\/strong>：若图存在环，环上顶点互相等待对方先排，拓扑顺序不存在；算法输出前必须先确认图是 DAG，或由 DFS 是否出现回边来识别环。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：BFS 像往水面投石子后一圈圈扩散的波纹；DFS 像沿走廊一路走到头、再折返找岔路的走迷宫方式。UCC 把整片水域按连通的水域切块，湖与湖之间有陆地隔开。\n<\/li><li>\n实例：一张 5 顶点无向图，边为 <span class=\"katex-inline\">(1,2)<\/span>、<span class=\"katex-inline\">(1,3)<\/span>、<span class=\"katex-inline\">(2,3)<\/span>、<span class=\"katex-inline\">(4,5)<\/span>。BFS 从 1 出发：层 0 为 <span class=\"katex-inline\">\\{1\\}<\/span>，层 1 为 <span class=\"katex-inline\">\\{2,3\\}<\/span>，4、5 不可达。UCC 输出分量 <span class=\"katex-inline\">\\{1,2,3\\}<\/span> 与 <span class=\"katex-inline\">\\{4,5\\}<\/span> 两个块。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n误解 1：BFS 给出的路径就是总长最短路径。为什么错：BFS 优化的是边数；总长最短只在边长相等时与边数最短重合。边长不等时必须按权值重新计算。\n<\/li><li>\n误解 2：邻接矩阵总是更省空间。为什么错：矩阵占 <span class=\"katex-inline\">O(n^2)<\/span> 位置，邻接列表占 <span class=\"katex-inline\">O(n+m)<\/span> 位置。顶点多而边少时，列表远省；边数接近 <span class=\"katex-inline\">n^2<\/span> 时，矩阵才摊得平。\n<\/li><li>\n误解 3：DFS 与 BFS 只是栈和队列的差别，遍历出来的可达集合相同。可达集合在连通图上确实相同，但层数、完成次序与适用结论不同：拓扑排序与强连通分量依赖 DFS 的完成次序，不能换成 BFS。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n一张 <span class=\"katex-inline\">n=6<\/span> 的无向图只有三条互不相连的边，邻接列表与邻接矩阵各占多少量级的存储？哪种更省？\n<\/li><li>\n从 <span class=\"katex-inline\">s<\/span> 做 BFS，顶点 <span class=\"katex-inline\">a<\/span> 在第 2 层入队、顶点 <span class=\"katex-inline\">b<\/span> 在第 3 层入队。能否据此断定 <span class=\"katex-inline\">s\\to a<\/span> 的最少跳数是 2、<span class=\"katex-inline\">s\\to b<\/span> 的最少跳数是 3？说明依据。\n<\/li><li>\n给出一个 4 顶点有向图，使它含有一条环；指出为什么这个图不存在拓扑顺序。\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n图由顶点集与边集组成，无向边无序、有向边有序；表示选择随稀疏程度与查询类型而定。\n<\/li><li>\nBFS 按层扩张，层号等于无权最短路径的跳数；前提是每条边权值相同。\n<\/li><li>\nUCC 每次搜索切出一个极大可达块；DFS 的逆后序给出 DAG 拓扑顺序；Kosaraju 在原图与反转图上各跑一遍 DFS 划分强连通分量。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章把图的建模语言与两类线性搜索讲完：BFS 回答&quot;跳数最近&quot;，DFS 回答&quot;次序与归属&quot;。第 2 章交付的分层搜索框架是第 3 章的骨架——Dijkstra 沿用&quot;已处理集合 <span class=\"katex-inline\">X<\/span> 逐步扩张&quot;的循环结构，只把选边规则从&quot;按层&quot;换成&quot;按 Dijkstra 得分&quot;。本章的邻接列表表示直接作为第 3 章算法的输入格式；拓扑排序与强连通分量的概念则在后续图论课程与调度问题中继续使用。<\/p>", "kind": "chapter", "title": "第 1–2 章：图的基础知识、图的搜索及其应用（表示、BFS、连通分量、DFS、拓扑排序、强连通分量）"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：算法详解 卷2 图算法和数据结构.pdf · p.88<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1–2 章：图的基础知识、图的搜索及其应用（表示、BFS、连通分量、DFS、拓扑排序、强连通分量）<\/a><\/span><\/div><h1>第 3 章：Dijkstra 最短路径算法<\/h1>\n<blockquote>对应原书第 3 章「Dijkstra 最短路径算法」（PDF 第 88–105 页；印刷页 = PDF 页 − 18，章首 PDF 88 / 印刷 70，3.3 节 PDF 95 / 印刷 77，两处互核）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n写出单源最短路径问题的输入与输出：起点 <span class=\"katex-inline\">s<\/span>，每个 <span class=\"katex-inline\">v<\/span> 的 <span class=\"katex-inline\">\\mathrm{dist}(s,v)<\/span>；\n<\/li><li>\n解释为什么 BFS 不能直接搬到边长不等的加权图上；\n<\/li><li>\n复述 Dijkstra 主循环：已处理集合 <span class=\"katex-inline\">X<\/span>、跨集合边、Dijkstra 得分、选最低分边加入 <span class=\"katex-inline\">X<\/span>；\n<\/li><li>\n在手算小图上逐步跑出各顶点的 <code>len<\/code> 值，并通过 predecessor 指针还原最短路径；\n<\/li><li>\n说清非负边长前提在正确性证明中起哪一步作用；\n<\/li><li>\n指出边长出现负值（尤其负环）时 Dijkstra 会在哪一步出错。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>Dijkstra 算法把第 2 章的&quot;集合扩张&quot;改成按得分扩张：维护已处理集合 <span class=\"katex-inline\">X<\/span>，每次在所有从 <span class=\"katex-inline\">X<\/span> 跨向 <span class=\"katex-inline\">V-X<\/span> 的边中选 Dijkstra 得分 <span class=\"katex-inline\">\\mathrm{len}(v)+A_{vw}<\/span> 最低的一条，把头顶点纳入 <span class=\"katex-inline\">X<\/span>。在边长全部非负的条件下，每个顶点被纳入时登记的 <code>len<\/code> 值就是真正的最短路径长度。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：单源最短路径问题与 BFS 的失效边界（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。§3.1 把问题定义为：给定有向图 <span class=\"katex-inline\">G=(V,E)<\/span>、每条边长度 <span class=\"katex-inline\">A_{vw}\\ge 0<\/span> 与起点 <span class=\"katex-inline\">s<\/span>，对每个 <span class=\"katex-inline\">v\\in V<\/span> 求从 <span class=\"katex-inline\">s<\/span> 到 <span class=\"katex-inline\">v<\/span> 的路径长度最小值 <span class=\"katex-inline\">\\mathrm{dist}(s,v)<\/span>（PDF 第 89 页）。BFS 只按跳数分层；当边权不等时，跳数少的路径总长未必短，这正是本章要补救的缺口。<\/p>\n<h3>2. 概念 2：Dijkstra 的贪心选择不变量与非负权正确性（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。§3.2 给出伪码：初始化 <span class=\"katex-inline\">X=\\{s\\}<\/span>，<code>len(s)=0<\/code>，其余 <code>len<\/code> 为 <span class=\"katex-inline\">+\\infty<\/span>；循环中选得分最低的跨集合边 <span class=\"katex-inline\">(v^<em>,w^<\/em>)<\/span>，把 <span class=\"katex-inline\">w^<em><\/span> 加入 <span class=\"katex-inline\">X<\/span>，并令 <code>len(w<\/em>)=len(v<em>)+A_{v<\/em>w*}<\/code>（PDF 第 92 页）。§3.3 证明：非负边长保证&quot;最短路径前缀仍是最短路径&quot;，于是被选中的顶点登记值不会被后续更短路径推翻。负边长会打断这条前缀性质，算法可能在顶点已入 <span class=\"katex-inline\">X<\/span> 之后才出现更短路径。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[起点 s, X={s}] --&gt; B[枚举跨集合边 v∈X, w∉X]\nB --&gt; C[计算得分 len(v)+A_vw]\nC --&gt; D[选得分最低边 v*,w*]\nD --&gt; E[w* 入 X, len(w*)=得分]\nE --&gt; F{还有跨集合边?}\nF --&gt;|是| B\nF --&gt;|否| G[未达顶点 len=+∞, 结束]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：链条断在&quot;得分最低边&quot;的选择依据上。若边长可为负，留在 <span class=\"katex-inline\">V-X<\/span> 里的顶点日后可能经过一条负权边回头压低得分，已纳入 <span class=\"katex-inline\">X<\/span> 的顶点就被错误锁定；循环结构本身不变，变的是选边规则的合法性。<\/p>\n<h2>推导一（推演）：小图上逐步执行 Dijkstra<\/h2>\n<p>参照 §3.2.2 的例子，顶点为 <span class=\"katex-inline\">s,v,w,t<\/span>，有向边与长度：<span class=\"katex-inline\">(s,v)=1<\/span>，<span class=\"katex-inline\">(s,w)=4<\/span>，<span class=\"katex-inline\">(v,w)=2<\/span>，<span class=\"katex-inline\">(v,t)=6<\/span>，<span class=\"katex-inline\">(w,t)=3<\/span>。逐步推演如下。<\/p>\n<ol><li>\n<strong>初始化<\/strong>：<span class=\"katex-inline\">X=\\{s\\}<\/span>，<code>len(s)=0<\/code>，<code>len(v)=len(w)=len(t)=+∞<\/code>。\n<\/li><li>\n<strong>第 1 次迭代<\/strong>：跨集合边为 <span class=\"katex-inline\">(s,w)<\/span> 与 <span class=\"katex-inline\">(s,v)<\/span>。得分：<span class=\"katex-inline\">0+4=4<\/span>，<span class=\"katex-inline\">0+1=1<\/span>。最低分是 <span class=\"katex-inline\">(s,v)<\/span>，把 <span class=\"katex-inline\">v<\/span> 加入 <span class=\"katex-inline\">X<\/span>，<code>len(v)=1<\/code>，predecessor(v)=s。\n<\/li><li>\n<strong>第 2 次迭代<\/strong>：<span class=\"katex-inline\">X=\\{s,v\\}<\/span>，跨集合边为 <span class=\"katex-inline\">(s,w)<\/span>、<span class=\"katex-inline\">(v,w)<\/span>、<span class=\"katex-inline\">(v,t)<\/span>。得分：<span class=\"katex-inline\">0+4=4<\/span>，<span class=\"katex-inline\">1+2=3<\/span>，<span class=\"katex-inline\">1+6=7<\/span>。最低分是 <span class=\"katex-inline\">(v,w)<\/span>，把 <span class=\"katex-inline\">w<\/span> 加入 <span class=\"katex-inline\">X<\/span>，<code>len(w)=3<\/code>，predecessor(w)=v。\n<\/li><li>\n<strong>第 3 次迭代<\/strong>：跨集合边只剩 <span class=\"katex-inline\">(v,t)<\/span>、<span class=\"katex-inline\">(w,t)<\/span>。得分：<span class=\"katex-inline\">1+6=7<\/span>，<span class=\"katex-inline\">3+3=6<\/span>。最低分是 <span class=\"katex-inline\">(w,t)<\/span>，把 <span class=\"katex-inline\">t<\/span> 加入 <span class=\"katex-inline\">X<\/span>，<code>len(t)=6<\/code>，predecessor(t)=w。\n<\/li><li>\n<strong>收尾<\/strong>：<span class=\"katex-inline\">X=V<\/span>，无跨集合边。结果 <code>len(s)=0, len(v)=1, len(w)=3, len(t)=6<\/code>。沿 predecessor 回溯：<span class=\"katex-inline\">t\\leftarrow w\\leftarrow v\\leftarrow s<\/span>，对应路径 <span class=\"katex-inline\">s\\to v\\to w\\to t<\/span>，总长 <span class=\"katex-inline\">1+2+3=6<\/span>。\n<\/ol>\n<h2>推导二（证明）：非负权下入 <span class=\"katex-inline\">X<\/span> 顶点的 <code>len<\/code> 值不再被推翻<\/h2>\n<p>设算法某次迭代把 <span class=\"katex-inline\">w^<em><\/span> 经边 <span class=\"katex-inline\">(v^<\/em>,w^<em>)<\/span> 选入 <span class=\"katex-inline\">X<\/span>，声称 <code>len(w<\/em>)=len(v<em>)+A_{v<\/em>w<em>}<\/code> 等于 <span class=\"katex-inline\">\\mathrm{dist}(s,w^<\/em>)<\/span>。下面用路径比较给出证明框架。<\/p>\n<ol><li>\n<strong>上界<\/strong>：<span class=\"katex-inline\">v^<em><\/span> 已在 <span class=\"katex-inline\">X<\/span> 中，按归纳假设 <code>len(v<\/em>)=dist(s,v<em>)<\/code>；沿边 <span class=\"katex-inline\">(v^<\/em>,w^<em>)<\/span> 得到一条长 <code>len(v<\/em>)+A_{v<em>w<\/em>}<\/code> 的 <span class=\"katex-inline\">s\\to w^<em><\/span> 路径，故 <span class=\"katex-inline\">\\mathrm{dist}(s,w^<\/em>)\\le \\mathrm{len}(w^*)<\/span>。\n<\/li><li>\n<strong>下界思路<\/strong>：反设存在一条更短的 <span class=\"katex-inline\">s\\to w^*<\/span> 路径 <span class=\"katex-inline\">P<\/span>。这条路径从 <span class=\"katex-inline\">X<\/span> 出发，必然在某处第一次穿出 <span class=\"katex-inline\">X<\/span>，记穿出边为 <span class=\"katex-inline\">(x,y)<\/span>。算法在本次迭代选择的是得分最低的跨集合边，故该边得分不高于 <span class=\"katex-inline\">(x,y)<\/span> 的得分。\n<\/li><li>\n<strong>非负权的作用<\/strong>：沿 <span class=\"katex-inline\">P<\/span> 从 <span class=\"katex-inline\">y<\/span> 继续走到 <span class=\"katex-inline\">w^<em><\/span> 的剩余边长非负，于是 <span class=\"katex-inline\">P<\/span> 的总长不会小于 <span class=\"katex-inline\">(x,y)<\/span> 得分。结合第 2 步，<span class=\"katex-inline\">w^<\/em><\/span> 的登记得分不高于任何更短路径的总长，与&quot;存在更短路径&quot;的反设冲突。\n<\/li><li>\n两侧夹定：<code>len(w<em>)=dist(s,w<\/em>)<\/code>。归纳从 <span class=\"katex-inline\">s<\/span>（<code>len(s)=0=dist(s,s)<\/code>）开始，每加入一个顶点重复上述论证，全部顶点登记值成立。\n<\/ol>\n<p>证明中第 3 步是唯一依赖非负权的环节：剩余边长非负，才能保证后续路段不会把总长压低；若剩余边长为负，穿出之后的路段可以把总分拉低，第 2 步的得分比较就不再压住反设路径。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>允许边长为负<\/strong>：构造 <span class=\"katex-inline\">s\\to a<\/span> 长 1、<span class=\"katex-inline\">a\\to b<\/span> 长 1、<span class=\"katex-inline\">s\\to b<\/span> 长 4、<span class=\"katex-inline\">b\\to a<\/span> 长 −3。Dijkstra 先把 <span class=\"katex-inline\">a<\/span> 按 <code>len(a)=1<\/code> 锁定入 <span class=\"katex-inline\">X<\/span>；之后经 <span class=\"katex-inline\">s\\to b\\to a<\/span> 得到 <span class=\"katex-inline\">a<\/span> 的更短路径 <span class=\"katex-inline\">4-3=1<\/span> 与登记值持平，换一组负数可使登记值偏高。顶点入 <span class=\"katex-inline\">X<\/span> 后不再更新，错误就被保留。\n<\/li><li>\n<strong>图中存在负环<\/strong>：绕环一圈总长为负，绕环次数越多路径越短，最短路径长度趋向 <span class=\"katex-inline\">-\\infty<\/span>，<span class=\"katex-inline\">\\mathrm{dist}<\/span> 本身不存在有限值；任何固定迭代次数的算法都给不出有限答案，需要先做负环检测。\n<\/li><li>\n<strong>把选边规则改成队列先到先出（退回 BFS 规则）<\/strong>：不按得分而按发现次序扩张，加权图上先发现的顶点未必路径更短，登记值可能被后续路径推翻，正确性证明的下界环节失效。\n<\/li><li>\n<strong>起点不可达的顶点<\/strong>：算法结束后其 <code>len<\/code> 仍为 <span class=\"katex-inline\">+\\infty<\/span>，这不是错误；只要跨集合边不存在，主循环终止，未达顶点按不可达处理。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：Dijkstra 像按&quot;已探明路线的当前总长&quot;排名的导航规划，每一步先把路线代价最低的那个路口划进&quot;已确定&quot;名单；非负权保证之后新探到的路不会比已确定名单里的路线更短。\n<\/li><li>\n实例：上面推导一的小图中，<span class=\"katex-inline\">s\\to w<\/span> 直达长 4，绕行 <span class=\"katex-inline\">s\\to v\\to w<\/span> 长 3；Dijkstra 在第 2 次迭代通过 <span class=\"katex-inline\">(v,w)<\/span> 得分 3 把 <span class=\"katex-inline\">w<\/span> 登记为 3，正确识别出绕行更短。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n误解 1：Dijkstra 可以处理带负权边的图，只是慢一点。为什么错：问题不在速度，在正确性。入 <span class=\"katex-inline\">X<\/span> 锁定后不回改，负权边可能在锁定之后造出更短路径，登记值永久偏高。\n<\/li><li>\n误解 2：得分是给顶点算的。为什么错：Dijkstra 得分 <span class=\"katex-inline\">\\mathrm{len}(v)+A_{vw}<\/span> 是按跨集合边定义的；同一个未处理顶点可能被多条跨集合边指向，各条边得分不同，算法选边后才给顶点登记 <code>len<\/code>。\n<\/li><li>\n误解 3：算法结束时 <code>len<\/code> 值相等的顶点路径总长相同，但路径本身也相同。为什么错：总长相等时可能存在多条等长路径，predecessor 指针只记录被算法选中的那一条。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n写出 Dijkstra 主循环中跨集合边的定义，说明得分表达式中两个量各来自哪里。\n<\/li><li>\n一张 4 顶点图中，某条边长度为 −1。指出正确性证明的哪一步不再成立，为什么。\n<\/li><li>\n推导一的例子中，若把 <span class=\"katex-inline\">(w,t)<\/span> 长度改为 5，其余不变，第 3 次迭代选中哪条边？<code>len(t)<\/code> 是多少？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n单源最短路径求 <span class=\"katex-inline\">\\mathrm{dist}(s,v)<\/span>，BFS 只在边长全 1 时等价于它。\n<\/li><li>\nDijkstra 维护 <span class=\"katex-inline\">X<\/span>，每步选得分 <span class=\"katex-inline\">\\mathrm{len}(v)+A_{vw}<\/span> 最低的跨集合边纳入 <span class=\"katex-inline\">X<\/span>。\n<\/li><li>\n非负权是&quot;前缀最短&quot;成立的前提；负权边或负环会让入 <span class=\"katex-inline\">X<\/span> 锁定失效。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章承接第 1 章的集合扩张框架，把选边规则从层数换成加权得分。Dijkstra 的朴素实现每次迭代全表扫描跨集合边，运行时间 <span class=\"katex-inline\">O(mn)<\/span>；第 4 章引入堆作为优先队列，把&quot;取最低分边&quot;与&quot;登记新 <code>len<\/code>&quot;交给堆操作完成，运行时间降到 <span class=\"katex-inline\">O(m\\log n)<\/span>。下一章先讲堆的结构与操作，再回到本章的算法做提速。<\/p>", "kind": "chapter", "title": "第 3 章：Dijkstra 最短路径算法（单源问题、Dijkstra 得分、贪心不变量与非负权正确性）"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：算法详解 卷2 图算法和数据结构.pdf · p.106<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 3 章：Dijkstra 最短路径算法（单源问题、Dijkstra 得分、贪心不变量与非负权正确性）<\/a><\/span><\/div><h1>第 4 章：堆数据结构<\/h1>\n<blockquote>对应原书第 4 章「堆数据结构」（PDF 第 106–134 页；印刷页 = PDF 页 − 18，章首 PDF 106 / 印刷 88，4.3 节 PDF 111 / 印刷 93，两处互核）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n列出堆支持的核心操作：Insert、ExtractMin，以及可选的 Heapify、Delete；\n<\/li><li>\n说清堆序不变量：每个节点的键不大于两个子节点的键，根节点为全堆最小；\n<\/li><li>\n写出数组形式下父子位置公式：父 <span class=\"katex-inline\">\\lfloor i/2\\rfloor<\/span>，左子 <span class=\"katex-inline\">2i<\/span>，右子 <span class=\"katex-inline\">2i+1<\/span>；\n<\/li><li>\n手推一次 Insert 的向上冒泡与一次 ExtractMin 的向下交换；\n<\/li><li>\n解释堆排序、事件管理器、中位值维护三个应用各用了堆的哪条性质；\n<\/li><li>\n说明堆怎样把 Dijkstra 的取最低分边与松弛登记变成优先队列操作，给出提速后的运行时间量级。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>堆是一棵满足堆序不变量的完全二叉树，用数组存储、父子下标由简单公式确定。插入把新键放到末尾再向上冒泡恢复堆序，抽取最小把根与末尾节点交换再向下下沉；两类操作都沿树高走 <span class=\"katex-inline\">O(\\log n)<\/span>。堆用&quot;只保最小、不保全局有序&quot;换取紧凑存储与快速极值操作，正好充当 Dijkstra 的优先队列。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：堆序不变量、数组表示与 Insert/ExtractMin（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。§4.2 定义堆支持的操作：Insert 加入对象，ExtractMin 返回并删除键最小的对象（PDF 第 108 页）。§4.5.2 把树压成数组：位置 1 为根，按层填充；位置 <span class=\"katex-inline\">i<\/span> 的子节点在 <span class=\"katex-inline\">2i<\/span> 与 <span class=\"katex-inline\">2i+1<\/span>，父节点在 <span class=\"katex-inline\">\\lfloor i/2\\rfloor<\/span>（PDF 第 124 页）。堆序要求父键不大于子键，因此根必为最小；插入走向上冒泡，抽取最小走向下下沉。<\/p>\n<h3>2. 概念 2：堆的应用与 Dijkstra 提速（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。§4.3 给出三类应用：反复抽取最小即堆排序；按时间键管理事件队列；两个堆分持较小一半与较大一半维护中位值（PDF 第 111 页）。§4.4 回到第 3 章：Dijkstra 每步要在候选顶点中取最小 <code>len<\/code>，堆恰好提供 ExtractMin；边松弛后若新得分更低，用堆内的下降操作更新位置（PDF 第 116 页）。朴素 Dijkstra 的 <span class=\"katex-inline\">O(mn)<\/span> 扫描被替换为堆操作序列。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[完全二叉树 + 堆序不变量] --&gt; B[数组存储: 父 floor(i/2), 子 2i/2i+1]\nB --&gt; C[Insert: 末尾加入, 向上冒泡]\nB --&gt; D[ExtractMin: 根与末尾交换, 向下下沉]\nC --&gt; E[堆排序: 反复抽取最小]\nD --&gt; E\nC --&gt; F[事件队列: 按时间键出队]\nD --&gt; G[Dijkstra 优先队列: 取最小得分 + 下降更新]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：链条的前提是&quot;父不大于子&quot;。这条不变量一旦被破坏，根不再保证最小，ExtractMin 拿到的就不是全局最小；冒泡与下沉两套流程都是在破坏点出现后把不变量恢复，而不是重新排序整棵树。<\/p>\n<h2>推导一（推演）：一次 Insert 的向上冒泡<\/h2>\n<p>设堆已有 6 个节点，数组键依次为 <span class=\"katex-inline\">[2,5,8,9,6,7]<\/span>（位置 1–6）。新键 <span class=\"katex-inline\">x=3<\/span> 插入位置 7。<\/p>\n<ol><li>\n<strong>保持完全性<\/strong>：新节点放在末尾位置 7，树的形状仍是完全二叉树。\n<\/li><li>\n<strong>检查堆序<\/strong>：位置 7 的父节点是 <span class=\"katex-inline\">\\lfloor 7/2\\rfloor=3<\/span>，位置 3 的键为 8。<span class=\"katex-inline\">3&lt;8<\/span>，子键小于父键，堆序在这条边上被破坏。\n<\/li><li>\n<strong>向上交换<\/strong>：交换位置 3 与位置 7，数组变为 <span class=\"katex-inline\">[2,5,3,9,6,7,8]<\/span>，新键到达位置 3。\n<\/li><li>\n<strong>继续检查<\/strong>：位置 3 的父节点是 <span class=\"katex-inline\">\\lfloor 3/2\\rfloor=1<\/span>，位置 1 键为 2。<span class=\"katex-inline\">3\\ge 2<\/span>，父子方向满足堆序，停止冒泡。\n<\/li><li>\n<strong>结果核验<\/strong>：逐对检查父与子：<span class=\"katex-inline\">2\\le 5,2\\le 3<\/span>；<span class=\"katex-inline\">5\\le 9,5\\le 6<\/span>；<span class=\"katex-inline\">3\\le 8<\/span>，全部满足。冒泡经过的路径长度是树高，本例为 2 次交换。\n<\/ol>\n<h2>推导二（推演）：一次 ExtractMin 的向下下沉<\/h2>\n<p>沿用上面恢复后的数组 <span class=\"katex-inline\">[2,5,3,9,6,7,8]<\/span>，执行 ExtractMin。<\/p>\n<ol><li>\n<strong>取出根<\/strong>：最小键在位置 1，为 2。把末尾位置 7 的键 8 移到位置 1，数组暂为 <span class=\"katex-inline\">[8,5,3,9,6,7]<\/span>，节点数减 1。\n<\/li><li>\n<strong>检查下沉点<\/strong>：位置 1 的子节点为位置 2（键 5）与位置 3（键 3）。父键 8 大于两个子键，堆序被破坏；下沉规则是与较小子键交换，避免交换后仍大于另一子键。\n<\/li><li>\n<strong>第一次交换<\/strong>：8 与位置 3 的 3 交换，数组变为 <span class=\"katex-inline\">[3,5,8,9,6,7]<\/span>，8 到达位置 3。\n<\/li><li>\n<strong>继续下沉<\/strong>：位置 3 的子节点为位置 6（键 7）。<span class=\"katex-inline\">8\\ge 7<\/span>，方向满足堆序，停止下沉。\n<\/li><li>\n<strong>结果核验<\/strong>：父子对 <span class=\"katex-inline\">3\\le 5,3\\le 8<\/span>；<span class=\"katex-inline\">5\\le 9,5\\le 6<\/span>；<span class=\"katex-inline\">8\\le 7<\/span> 不成立——位置 6 的父是位置 3，键 8 大于子键 7，需要再交换一次：8 与 7 换位，最终数组 <span class=\"katex-inline\">[3,5,7,9,6,8]<\/span>。核验全部父子对满足父不大于子，抽取完成，返回值为 2。\n<\/ol>\n<p>下沉路径同样沿树高走，交换次数不超过 <span class=\"katex-inline\">\\lceil\\log_2 n\\rceil<\/span>。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉堆序不变量<\/strong>：只保留完全二叉树形状，父键与子键无约束。根可能是任意键，ExtractMin 必须遍历全部节点找最小，退回 <span class=\"katex-inline\">O(n)<\/span>；堆区别于普通数组的效率来源消失。\n<\/li><li>\n<strong>用数组但丢掉完全二叉树形状<\/strong>：若允许节点空缺只挂部分子树，父子下标公式 <span class=\"katex-inline\">2i<\/span>、<span class=\"katex-inline\">2i+1<\/span> 会指到空槽，需要额外存指针，空间开销向普通二叉树靠拢，堆的紧凑存储优势丧失。\n<\/li><li>\n<strong>下沉时与较大子键交换<\/strong>：位置 1 父键 8、子键 5 与 3，若与 5 交换，8 到达位置 2 后仍可能大于其右子树；正确做法是与较小子键 3 交换，保证交换后父键不超过该子树的最小值。\n<\/li><li>\n<strong>要求堆支持全局有序输出之外的任意键序操作<\/strong>：堆只保证最小可达，不保证中序有序；若程序需要按整体键序遍历全部元素，堆不是合适结构，应转向第 5 章的搜索树。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：堆像一摞按&quot;长辈不小于晚辈&quot;整理的家谱树，最小成员在根部；插入新成员先挂在末尾，辈分不对就向上换房；抽走最小成员后，把末尾成员扶到根部，再一路向下换到辈分相符的位置。\n<\/li><li>\n实例：堆排序对数组 <span class=\"katex-inline\">[3,1,4,1,5,9,2,6]<\/span> 建堆后反复 ExtractMin，依次输出 1、1、2、3、4、5、6、9；建堆 <span class=\"katex-inline\">O(n)<\/span>，<span class=\"katex-inline\">n<\/span> 次抽取各 <span class=\"katex-inline\">O(\\log n)<\/span>，总时间 <span class=\"katex-inline\">O(n\\log n)<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n误解 1：堆就是一棵排序二叉树。为什么错：BST 要求左小右大并维护整体有序，堆只要求父不大于子，兄弟之间无大小关系；堆的中序遍历不给出有序序列。\n<\/li><li>\n误解 2：ExtractMin 只删根就结束。为什么错：根位置空出后必须把末尾节点补回并下沉恢复堆序；不补位下沉，树形状与堆序都会留下缺口。\n<\/li><li>\n误解 3：堆的高度一定是 <span class=\"katex-inline\">\\log_2 n<\/span>。为什么错：完全二叉树的高度为 <span class=\"katex-inline\">\\lceil\\log_2(n+1)\\rceil<\/span> 量级，操作代价按高度计；<span class=\"katex-inline\">n<\/span> 个节点的堆高度不超过 <span class=\"katex-inline\">\\lceil\\log_2 n\\rceil<\/span>，但不是每个节点都占满最后一层。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n数组位置 <span class=\"katex-inline\">i=10<\/span> 的父节点与两个子节点分别在什么位置？写出下标计算。\n<\/li><li>\n向数组 <span class=\"katex-inline\">[4,6,5,9,7,8]<\/span> 插入键 2，逐步写出冒泡经过的交换。\n<\/li><li>\n为什么 Dijkstra 用堆取代全表扫描后，取最小候选顶点的代价从 <span class=\"katex-inline\">O(n)<\/span> 降到 <span class=\"katex-inline\">O(\\log n)<\/span>？这依赖堆的哪条不变量？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n堆序：父键 <span class=\"katex-inline\">\\le<\/span> 子键，根为全堆最小；完全二叉树压进数组，父子下标由除法与乘法给出。\n<\/li><li>\nInsert 末尾加入向上冒泡，ExtractMin 根与末尾交换后向下下沉，代价均 <span class=\"katex-inline\">O(\\log n)<\/span>。\n<\/li><li>\n堆是优先队列的实现：堆排序、事件管理、中位值维护与 Dijkstra 提速都建立在&quot;快速取最小&quot;上。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章为第 2 章的 Dijkstra 补上优先队列实现：§4.4 把朴素扫描换成堆的 ExtractMin 与下降更新，运行时间由 <span class=\"katex-inline\">O(mn)<\/span> 降至 <span class=\"katex-inline\">O(m\\log n)<\/span>。堆只维护极值、不维护整体有序；下一章的搜索树补上&quot;按键序组织全部对象&quot;的能力，两者覆盖优先队列与有序集合两类需求。<\/p>", "kind": "chapter", "title": "第 4 章：堆数据结构（堆操作、应用、数组形式实现与 Dijkstra 提速）"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：算法详解 卷2 图算法和数据结构.pdf · p.135<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 4 章：堆数据结构（堆操作、应用、数组形式实现与 Dijkstra 提速）<\/a><\/span><\/div><h1>第 5–6 章：搜索树、散列表与布隆过滤器<\/h1>\n<blockquote>对应原书第 5 章「搜索树」、第 6 章「散列表和布隆过滤器」（PDF 第 135–198 页；印刷页 = PDF 页 − 18，第 5 章章首 PDF 135 / 印刷 117，第 6 章章首 PDF 158 / 印刷 140，两处互核）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<ol><li>\n说出有序数组支持与不支持的操作，说明插入为什么慢；\n<\/li><li>\n列出二叉搜索树支持的 Search、Min、Max、Predecessor、OutputSorted、Insert、Delete、Select 操作及其与树高的关系；\n<\/li><li>\n复述 BST 性质：左子树键小于节点键，右子树键大于节点键；\n<\/li><li>\n解释旋转怎样在不破坏 BST 性质的前提下调整平衡，为什么旋转是 <span class=\"katex-inline\">O(1)<\/span> 局部操作；\n<\/li><li>\n说明散列表的散列函数、冲突不可避免性、链地址法与开放地址法两类冲突解决方式；\n<\/li><li>\n解释负载因子对查找代价的影响，以及布隆过滤器用空间换错误率、只允许假阳性的边界。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>搜索树把对象按键序组织成树，每条路径沿比较方向下行，操作代价取决于树高；旋转是不破坏有序性质的局部平衡调整。散列表用散列函数把键直接映射到槽位，平均 <span class=\"katex-inline\">O(1)<\/span> 查找，代价是不维护键序且要处理冲突；布隆过滤器进一步压缩空间，用多个散列函数与位数组换取允许假阳性的紧凑成员判断。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：二叉搜索树的有序操作与旋转平衡（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。§5.1 先对照有序数组：二分查找 <span class=\"katex-inline\">O(\\log n)<\/span>，但插入要搬动后续元素 <span class=\"katex-inline\">O(n)<\/span>（PDF 第 135 页）。§5.3 的 BST 用树形结构同时容纳查找与动态插入；每个节点的左子树所有键小于该节点、右子树所有键大于该节点，Search、Min、Max、前驱都沿一条路径下行，时间 <span class=\"katex-inline\">O(\\text{高度})<\/span>；中序遍历输出全序（PDF 第 140 页）。§5.4 的旋转把一对父子节点的上下关系互换，子树归属重新分配，BST 性质保持不变，用于在插入或删除后把过高的一侧压下来（PDF 第 153 页）。<\/p>\n<h3>2. 概念 2：散列表、冲突解决、负载因子与布隆过滤器（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。§6.3 把键经散列函数映射到槽位；抽屉多于鸽子，冲突不可避免（PDF 第 167 页）。链地址法在每个槽位挂链表，开放地址法在槽位内按探查序列找空位；§6.4 用负载因子衡量装填程度，开放地址法负载不超过 1，链地址法平均桶长随负载增长（PDF 第 180 页前后）。§6.5 的布隆过滤器是只支持插入与查找的位数组结构，多个散列函数各置一位；查找命中只说明&quot;可能在集合中&quot;，漏掉则说明&quot;一定不在&quot;（PDF 第 184 页）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[需要维护键序的集合] --&gt; B[有序数组: 二分快, 插入慢]\nB --&gt; C[BST: 操作沿路径下行, 代价 O 高度]\nC --&gt; D{树是否失衡?}\nD --&gt;|是| E[旋转: 局部调整, 保持 BST 性质]\nA2[需要超快速查找, 不要求键序] --&gt; F[散列函数映射槽位]\nF --&gt; G[冲突解决: 链地址法/开放地址法]\nG --&gt; H[负载因子决定平均探查长度]\nF --&gt; I[布隆过滤器: 多位散列 + 位数组, 允许假阳性]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条路线服务不同需求。要按键序遍历、找前驱后继，走搜索树；只判存在性且平均常数时间，走散列表。选错路线的典型症状：用散列表做范围查询，或用 BST 做超大规模纯存在性判断。<\/p>\n<h2>推导一（推演）：BST 上一次 Search 的路径推演<\/h2>\n<p>设 BST 节点键依次满足 BST 性质，待查键 <span class=\"katex-inline\">k=7<\/span>，树根键为 5。<\/p>\n<ol><li>\n<strong>根比较<\/strong>：<span class=\"katex-inline\">7&gt;5<\/span>，目标不可能在左子树（左子树全部键小于 5），进入右子树。\n<\/li><li>\n<strong>第二层比较<\/strong>：右子树根键为 8，<span class=\"katex-inline\">7&lt;8<\/span>，目标不可能在其右子树（右子树全部键大于 8），进入左子树。\n<\/li><li>\n<strong>第三层比较<\/strong>：该子树根键为 7，命中，返回节点。若此处为空，路径上每步都排除了一整棵子树，说明 <span class=\"katex-inline\">k<\/span> 不在树中。\n<\/li><li>\n<strong>代价核算<\/strong>：比较次数等于路径长度，即树高 <span class=\"katex-inline\">h<\/span>；每次比较排除的子树由 BST 性质保证不含目标，不需要回退另一条岔路。\n<\/li><li>\n<strong>对照有序数组<\/strong>：数组二分查找也是 <span class=\"katex-inline\">O(\\log n)<\/span>，但插入要把 <span class=\"katex-inline\">k<\/span> 之后元素整体后移；BST 插入只走一条路径挂新叶，代价 <span class=\"katex-inline\">O(h)<\/span>，不必搬动已有节点。\n<\/ol>\n<h2>推导二（证明）：旋转前后 BST 性质保持不变<\/h2>\n<p>考虑一次向右旋转：父节点 <span class=\"katex-inline\">a<\/span> 在左、子节点 <span class=\"katex-inline\">b<\/span> 在右（<span class=\"katex-inline\">b<\/span> 原为 <span class=\"katex-inline\">a<\/span> 的右孩子），旋转后 <span class=\"katex-inline\">b<\/span> 升到父位、<span class=\"katex-inline\">a<\/span> 变为 <span class=\"katex-inline\">b<\/span> 的左孩子。记 <span class=\"katex-inline\">a<\/span> 的左子树为 <span class=\"katex-inline\">A<\/span>，<span class=\"katex-inline\">b<\/span> 的左子树为 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">b<\/span> 的右子树为 <span class=\"katex-inline\">C<\/span>。<\/p>\n<ol><li>\n<strong>旋转前的次序约束<\/strong>：BST 性质给出 <span class=\"katex-inline\">A &lt; a &lt; B &lt; b &lt; C<\/span>（&quot;&lt;&quot;表示键的大小次序）。\n<\/li><li>\n<strong>旋转后的归属<\/strong>：<span class=\"katex-inline\">A<\/span> 仍挂在 <span class=\"katex-inline\">a<\/span> 左侧；<span class=\"katex-inline\">B<\/span> 改挂为 <span class=\"katex-inline\">a<\/span> 的右子树；<span class=\"katex-inline\">C<\/span> 仍挂在 <span class=\"katex-inline\">b<\/span> 右侧；<span class=\"katex-inline\">a<\/span> 挂为 <span class=\"katex-inline\">b<\/span> 的左子树。\n<\/li><li>\n<strong>逐对核验<\/strong>：<span class=\"katex-inline\">A&lt;a<\/span> 保持；<span class=\"katex-inline\">B<\/span> 作为 <span class=\"katex-inline\">a<\/span> 的右子树，满足 <span class=\"katex-inline\">a&lt;B<\/span>；<span class=\"katex-inline\">B&lt;b<\/span> 保持；<span class=\"katex-inline\">a<\/span> 作为 <span class=\"katex-inline\">b<\/span> 的左子树，满足 <span class=\"katex-inline\">a&lt;b<\/span>；<span class=\"katex-inline\">b&lt;C<\/span> 保持。次序链 <span class=\"katex-inline\">A&lt;a&lt;B&lt;b&lt;C<\/span> 在新归属下逐条成立。\n<\/li><li>\n<strong>结论<\/strong>：旋转只改变 <span class=\"katex-inline\">a,b<\/span> 之间的上下关系与 <span class=\"katex-inline\">B<\/span> 的挂靠位置，不改动任何子树内部结构；一次旋转涉及常数个节点，时间 <span class=\"katex-inline\">O(1)<\/span>，BST 性质不被破坏。向左旋转是对称操作。\n<\/ol>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>BST 性质只约束直接父子，不约束整棵子树<\/strong>：若允许右子树出现比节点小的键，Search 沿比较方向排除子树的依据失效，下行路径可能漏掉目标节点，查找退回遍历全树。\n<\/li><li>\n<strong>插入后不做平衡处理<\/strong>：按有序序列依次插入，树退化成一条链，树高 <span class=\"katex-inline\">h=n<\/span>，Search 与插入都从 <span class=\"katex-inline\">O(\\log n)<\/span> 变为 <span class=\"katex-inline\">O(n)<\/span>；旋转或平衡结构的作用就是阻止单侧过长。\n<\/li><li>\n<strong>散列函数把相似键映射到同一槽位<\/strong>：若所有键经函数后只落在少数槽位，冲突集中在这些槽，链表或探查链变长，平均查找接近 <span class=\"katex-inline\">O(n)<\/span>；散列函数的分散程度直接决定散列表是否仍为常数时间。\n<\/li><li>\n<strong>布隆过滤器支持删除<\/strong>：一个位被多个对象共享，删除某对象不能简单清位，否则会连带把其他对象的标记抹掉，产生假阴性；只插入不删除是其结构边界，要支持删除需换计数布隆一类变体。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：BST 像逐级分流的问路牌，每到一个节点按大小指示走左还是走右；旋转像把路口上下层级互换，路牌指的分流关系不变。散列表像按姓名首字母分柜的储物柜，号由名字直接算出；布隆过滤器像多个印章叠加的签到簿，盖过章可能是别人盖的，但没盖章一定没来。\n<\/li><li>\n实例：散列表槽位数 <span class=\"katex-inline\">m=10<\/span>，插入 <span class=\"katex-inline\">n=5<\/span> 个对象，负载因子 <span class=\"katex-inline\">n/m=0.5<\/span>；链地址法下平均链表长 0.5，开放地址法下平均探查次数仍接近常数。若 <span class=\"katex-inline\">n=100<\/span>、<span class=\"katex-inline\">m=10<\/span>，负载 10，平均桶长 10，查找代价随负载线性上升。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n误解 1：散列表查找一定是 <span class=\"katex-inline\">O(1)<\/span>。为什么错：<span class=\"katex-inline\">O(1)<\/span> 是均匀散列、低负载下的平均期望；冲突集中或负载过高时，探查链与链表长度上升，实际代价随负载增长。\n<\/li><li>\n误解 2：布隆过滤器误报和漏报都可能出现。为什么错：已插入对象对应的位必然被置位，查找已存在对象不会漏掉；错误方向只有假阳性（未插入却判存在），不会有假阴性。\n<\/li><li>\n误解 3：旋转改变了树中节点的键值。为什么错：旋转只调整父子挂靠与子树归属，节点键不变；BST 性质保持，中序遍历序列与旋转前一致。\n<\/li><li>\n误解 4：开放地址法可以无限插入。为什么错：每个槽位最多存一个对象，负载达到 1 后无法再插入新对象，必须扩容重散列。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n一棵 BST 依次插入键 <span class=\"katex-inline\">3,1,2<\/span>，画出树形；说明它的树高是多少，Search 键 2 需要几次比较。\n<\/li><li>\n链地址法与开放地址法在删除操作上哪个更方便？各自代价来自哪里？\n<\/li><li>\n布隆过滤器判&quot;不存在&quot;时结论为何可靠？判&quot;存在&quot;时为何只能说可能？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nBST 按大小分流：左小右大，操作代价 <span class=\"katex-inline\">O(\\text{高度})<\/span>；旋转是保持有序性质的 <span class=\"katex-inline\">O(1)<\/span> 局部调整。\n<\/li><li>\n散列表靠散列函数直接定位槽位，冲突用链表或探查序列解决；负载因子决定平均探查长度。\n<\/li><li>\n布隆过滤器多位散列、位数组存储，只支持插入与查找，错误方向只有假阳性。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章与第 4 章构成数据结构对照：堆回答&quot;快速取极值&quot;，搜索树回答&quot;按键序组织与查询&quot;，散列表回答&quot;最快存在性判断&quot;。第 3 章的 Dijkstra 用堆做优先队列；若后续问题需要在候选集合中做前驱后继或范围查询，就要换成本章的搜索树。散列表与布隆过滤器的权衡思路（空间、时间、允许的错误方向）在后续缓存、去重与集合成员判断场景中继续使用。<\/p>", "kind": "chapter", "title": "第 5–6 章：搜索树、散列表与布隆过滤器（BST 有序操作、旋转平衡、散列与冲突、布隆过滤器）"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：算法详解 卷2 图算法和数据结构.pdf · p.19<\/div><h1>图的基本术语与邻接列表、邻接矩阵两种表示<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书 §1.1、§1.4，PDF 第 19、25 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>图 <span class=\"katex-inline\">G=(V,E)<\/span> 是由顶点集 <span class=\"katex-inline\">V<\/span>（表示对象）与边集 <span class=\"katex-inline\">E<\/span>（表示对象间关系）组成的离散结构；按边是否区分方向分为无向图与有向图，在程序中可用邻接列表（每顶点挂相邻顶点序列）或邻接矩阵（<span class=\"katex-inline\">n\\times n<\/span> 表记录边是否存在）两种形式落地。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>算法要处理的网络对象——道路交叉口与路段、网页与超链接、人与人的好友关系、任务之间的依赖——共性是&quot;一组对象加上对象两两之间的关系&quot;。如果直接用一张对象清单加一堆文字描述关系，后续要问&quot;两个对象之间有没有边&quot;&quot;一个对象的邻居有哪些&quot;时，只能逐条扫描全部描述，代价随对象数平方增长。<\/p>\n<p>不用图结构会出两类错。第一类是关系语义混淆：把单向引用当成双向好友，统计出的连通范围偏大；把无向边 <span class=\"katex-inline\">(v,w)<\/span> 写成 <span class=\"katex-inline\">(w,v)<\/span> 时重复计数，边数翻倍。第二类是表示选错：顶点很多而边很少时硬上矩阵，空间被大量空位占满；边很密时用列表，查&quot;某条边在不在&quot;要沿列表逐项翻。图的术语先把对象与关系的语义钉死，两种表示再把查询类型与空间开销匹配起来。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>顶点集 <span class=\"katex-inline\">V<\/span><\/strong>：图所表示的全部对象的集合。集合中的每个元素称为一个顶点（vertex，又称端点）。顶点个数记为 <span class=\"katex-inline\">|V|<\/span>，通常写作 <span class=\"katex-inline\">n<\/span>。<\/p>\n<p><strong>边集 <span class=\"katex-inline\">E<\/span><\/strong>：记录对象之间关系的集合。每条边连接两个顶点，边的个数记为 <span class=\"katex-inline\">|E|<\/span>，通常写作 <span class=\"katex-inline\">m<\/span>。<\/p>\n<p><strong>无向图<\/strong>：边是无序顶点对，记作 <span class=\"katex-inline\">(v,w)<\/span>。在无向图中 <span class=\"katex-inline\">(v,w)<\/span> 与 <span class=\"katex-inline\">(w,v)<\/span> 是同一条边，边没有指向哪一端。例：好友关系，<span class=\"katex-inline\">v<\/span> 把 <span class=\"katex-inline\">w<\/span> 加为好友通常对应关系对称。<\/p>\n<p><strong>有向图<\/strong>：边是有序顶点对，记作 <span class=\"katex-inline\">(v,w)<\/span>，第一个顶点 <span class=\"katex-inline\">v<\/span> 称为尾（tail），第二个顶点 <span class=\"katex-inline\">w<\/span> 称为头（head），方向从尾指向头。例：超链接，网页 <span class=\"katex-inline\">v<\/span> 链接到 <span class=\"katex-inline\">w<\/span> 不代表 <span class=\"katex-inline\">w<\/span> 链接回 <span class=\"katex-inline\">v<\/span>。<\/p>\n<p><strong>邻接<\/strong>：若 <span class=\"katex-inline\">(v,w)\\in E<\/span>，称 <span class=\"katex-inline\">v<\/span> 与 <span class=\"katex-inline\">w<\/span> 相邻。无向图中 <span class=\"katex-inline\">v<\/span> 的邻居是与它相邻的全部顶点；有向图中再分出出边邻居（<span class=\"katex-inline\">v<\/span> 指向的顶点）与入边邻居（指向 <span class=\"katex-inline\">v<\/span> 的顶点）。<\/p>\n<p><strong>度<\/strong>：无向图中顶点 <span class=\"katex-inline\">v<\/span> 的度是与 <span class=\"katex-inline\">v<\/span> 相连的边数。有向图中分入度（指向 <span class=\"katex-inline\">v<\/span> 的边数）与出度（<span class=\"katex-inline\">v<\/span> 指出去的边数）。<\/p>\n<p><strong>邻接列表表示<\/strong>：为每个顶点 <span class=\"katex-inline\">v<\/span> 维护一个列表 <span class=\"katex-inline\">A(v)<\/span>，列出 <span class=\"katex-inline\">v<\/span> 的全部邻居（有向图可分入边、出边两个列表）。存储内容随边数增长。<\/p>\n<p><strong>邻接矩阵表示<\/strong>：取一个 <span class=\"katex-inline\">n\\times n<\/span> 矩阵，行列都按顶点编号；矩阵条目记录边是否存在（无权图记 0/1，有权图记边长，无边记 <span class=\"katex-inline\">\\infty<\/span> 或缺省值）。<\/p>\n<p><strong>正例<\/strong>：三个顶点 <span class=\"katex-inline\">a,b,c<\/span>，无向边 <span class=\"katex-inline\">(a,b)<\/span>、<span class=\"katex-inline\">(b,c)<\/span>。邻接列表 <span class=\"katex-inline\">A(a)=[b]<\/span>，<span class=\"katex-inline\">A(b)=[a,c]<\/span>，<span class=\"katex-inline\">A(c)=[b]<\/span>；邻接矩阵 <span class=\"katex-inline\">M_{ab}=M_{ba}=1<\/span>，其余无向条目为 0。<\/p>\n<p><strong>反例<\/strong>：在有向图中把 <span class=\"katex-inline\">(a,b)<\/span> 与 <span class=\"katex-inline\">(b,a)<\/span> 当成同一条边。二者方向不同，是两条独立的边；邻接矩阵中 <span class=\"katex-inline\">M_{ab}<\/span> 与 <span class=\"katex-inline\">M_{ba}<\/span> 也是两个不同条目。另一个反例：给一个只有 10 条边、500 个顶点的图分配 <span class=\"katex-inline\">500\\times500<\/span> 矩阵，绝大多数条目空置，这是表示与稀疏程度不匹配。<\/p>\n<h2>原理推导：两种表示的空间与查询代价对照<\/h2>\n<p>设图有 <span class=\"katex-inline\">n=|V|<\/span> 个顶点、<span class=\"katex-inline\">m=|E|<\/span> 条边。<\/p>\n<ol><li>\n<strong>邻接列表的存储量<\/strong>：每个顶点的邻居列表长度之和，无向图每条边在两端各记一次，总条目数 <span class=\"katex-inline\">2m<\/span>；加上 <span class=\"katex-inline\">n<\/span> 个列表头，空间为 <span class=\"katex-inline\">O(n+m)<\/span>。有向图每条边记一次，总条目数 <span class=\"katex-inline\">m<\/span>，空间同样 <span class=\"katex-inline\">O(n+m)<\/span>。\n<\/li><li>\n<strong>邻接矩阵的存储量<\/strong>：矩阵有 <span class=\"katex-inline\">n^2<\/span> 个条目，与 <span class=\"katex-inline\">m<\/span> 无关，空间 <span class=\"katex-inline\">O(n^2)<\/span>。\n<\/li><li>\n<strong>邻居遍历代价<\/strong>：要列出顶点 <span class=\"katex-inline\">v<\/span> 的全部邻居，邻接列表直接读 <span class=\"katex-inline\">A(v)<\/span>，代价与邻居个数成正比；邻接矩阵要扫描第 <span class=\"katex-inline\">v<\/span> 行全部 <span class=\"katex-inline\">n<\/span> 个条目，代价 <span class=\"katex-inline\">O(n)<\/span>。\n<\/li><li>\n<strong>单条边查询代价<\/strong>：要判断 <span class=\"katex-inline\">(v,w)<\/span> 是否存在，邻接矩阵直接看条目 <span class=\"katex-inline\">M_{vw}<\/span>，<span class=\"katex-inline\">O(1)<\/span>；邻接列表要在 <span class=\"katex-inline\">A(v)<\/span> 中查找，代价不超过 <span class=\"katex-inline\">v<\/span> 的度。\n<\/li><li>\n<strong>对照结论<\/strong>：<span class=\"katex-inline\">m<\/span> 接近 <span class=\"katex-inline\">n^2<\/span> 的稠密图，列表的总条目数与矩阵同量级，矩阵的 <span class=\"katex-inline\">O(1)<\/span> 边查询更划算；<span class=\"katex-inline\">m<\/span> 远小于 <span class=\"katex-inline\">n^2<\/span> 的稀疏图，列表空间随 <span class=\"katex-inline\">m<\/span> 线性增长，更省。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：顶点集合有限、关系可以用成对边记录；两种表示都适用于静态或小规模动态图。\n<\/li><li>\n稀疏图判据：<span class=\"katex-inline\">m=O(n)<\/span> 量级，边数与顶点数同阶；道路网、社交网络多属此类，选邻接列表。\n<\/li><li>\n稠密图判据：<span class=\"katex-inline\">m=\\Theta(n^2)<\/span> 量级，边数与顶点数平方同阶；小团体完全图、关系全连接矩阵多属此类，可选邻接矩阵。\n<\/li><li>\n边界 1：邻接列表不直接支持 <span class=\"katex-inline\">O(1)<\/span> 的边存在性判断，若程序最频繁的操作是&quot;给定两顶点查边&quot;且图较密，矩阵更合适。\n<\/li><li>\n边界 2：多重边与自环在标准表示中需要额外约定；基本术语讨论的是简单图，顶点对之间至多一条边、顶点不与自身相连。\n<\/li><li>\n失败案例：把一条无向好友边存成有向单向边，连通分量算法只沿一个方向走，会把双向可达的关系切成两个单向块；建模阶段先确认关系是否对称。\n<\/li><li>\n数值对照：<span class=\"katex-inline\">n=1000<\/span>、<span class=\"katex-inline\">m=3000<\/span> 的稀疏图，邻接列表存 <span class=\"katex-inline\">2m=6000<\/span> 条邻居记录；邻接矩阵要填 <span class=\"katex-inline\">10^6<\/span> 个条目，其中空条目约占 99.4%。<span class=\"katex-inline\">n=1000<\/span>、<span class=\"katex-inline\">m=400000<\/span> 的稠密图，矩阵条目与边数同量级，此时列表要挂 80 万条记录，矩阵的固定开销被摊平，单条边查询还能做到 <span class=\"katex-inline\">O(1)<\/span>。两组数字说明表示选择随 <span class=\"katex-inline\">m<\/span> 与 <span class=\"katex-inline\">n^2<\/span> 的比值移动。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>无向边 vs 有向边<\/strong>：差别在次序是否重要。无向边 <span class=\"katex-inline\">(v,w)=(w,v)<\/span>；有向边 <span class=\"katex-inline\">(v,w)\\neq(w,v)<\/span>，尾与头不能互换。判断依据是关系本身是否对称，而不是画图时箭头怎么画。\n<\/li><li>\n<strong>邻接列表 vs 邻接矩阵<\/strong>：列表省空间、擅长遍历邻居；矩阵查边快、空间随 <span class=\"katex-inline\">n^2<\/span> 膨胀。两者不是优劣关系，而是查询类型与图密度的匹配问题。\n<\/li><li>\n<strong>度 vs 出度/入度<\/strong>：无向图一个度概括全部相连边；有向图必须分两个方向统计，混在一起会把单向边算成双向连接。\n<\/li><li>\n<strong>顶点 vs 边<\/strong>：顶点是被描述的对象，边是对象间关系；建模时先列对象清单，再逐条登记关系，顺序不能反。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无，本章是全书图算法的语言层。后继：c02 的 BFS 沿邻接列表扫描邻居，c03 的连通分量划分建立在可达性定义上；第 3 章 Dijkstra 的输入格式沿用邻接列表，边长度作为条目附带信息。两种表示的选择结论会在后续每个图算法的实现分析中重复出现：算法遍历邻居的总代价取决于表示形式。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（图的基本术语与邻接列表、邻接矩阵两种表示）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：图术语依赖链、两种表示的代价核算与小图落地推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把图的术语与表示讲清楚，往回追四层：<\/p>\n<ol><li>\n<strong>对象与关系的区分<\/strong>：先有被描述的对象清单（顶点），再登记对象之间的成对关系（边）。这一层决定后续所有术语挂在哪种对象上。\n<\/li><li>\n<strong>关系的对称性<\/strong>：判断关系是否对称，决定边写成无序对还是有序对，进而分出无向图与有向图。\n<\/li><li>\n<strong>图的度量口径<\/strong>：顶点数 <span class=\"katex-inline\">n<\/span>、边数 <span class=\"katex-inline\">m<\/span>、度/入度/出度，用于判断图稀疏还是稠密，这是选表示的依据。\n<\/li><li>\n<strong>表示落地<\/strong>：把顶点与边翻译成程序里的数据结构，邻接列表随 <span class=\"katex-inline\">m<\/span> 增长，邻接矩阵随 <span class=\"katex-inline\">n^2<\/span> 增长；查询类型（遍历邻居 vs 查单条边）再修正选择。\n<\/ol>\n<p>依赖链方向：对象清单 → 关系对称性 → 度量口径 → 稀疏/稠密判断 → 表示选择。<\/p>\n<h2>正向推导：从集合定义到存储代价<\/h2>\n<p>下面一步步把定义展开成可核算的存储与查询代价。<\/p>\n<p><strong>步骤 1：写出图的形式定义<\/strong>。图 <span class=\"katex-inline\">G=(V,E)<\/span>，<span class=\"katex-inline\">V<\/span> 是顶点集，<span class=\"katex-inline\">E<\/span> 是边集。每条边由两个顶点确定；无向边记无序对 <span class=\"katex-inline\">(v,w)<\/span>，有向边记有序对 <span class=\"katex-inline\">(v,w)<\/span>，尾为 <span class=\"katex-inline\">v<\/span>、头为 <span class=\"katex-inline\">w<\/span>。定义中不预设边权、不预设环，先在简单图口径下讨论。<\/p>\n<p><strong>步骤 2：统计连接强度<\/strong>。无向图中顶点 <span class=\"katex-inline\">v<\/span> 的度 <span class=\"katex-inline\">\\deg(v)<\/span> 是与 <span class=\"katex-inline\">v<\/span> 相连的边数；把全部顶点的度求和，每条无向边在两端各贡献一次，故 <span class=\"katex-inline\">\\sum_{v\\in V}\\deg(v)=2m<\/span>。有向图中入度之和等于出度之和，二者都等于 <span class=\"katex-inline\">m<\/span>：每条边给尾贡献一次出度、给头贡献一次入度。这两个等式是后续校验边数统计是否重复计数的依据。<\/p>\n<p><strong>步骤 3：推导邻接列表存储量<\/strong>。无向图中，边 <span class=\"katex-inline\">(v,w)<\/span> 同时出现在 <span class=\"katex-inline\">A(v)<\/span> 与 <span class=\"katex-inline\">A(w)<\/span> 中，全部列表条目数为 <span class=\"katex-inline\">2m<\/span>；<span class=\"katex-inline\">n<\/span> 个列表头各占一份固定空间，总空间 <span class=\"katex-inline\">O(n+m)<\/span>。有向图中边 <span class=\"katex-inline\">(v,w)<\/span> 只记入出边列表 <span class=\"katex-inline\">A(v)<\/span>，条目数 <span class=\"katex-inline\">m<\/span>，总空间同样 <span class=\"katex-inline\">O(n+m)<\/span>。<\/p>\n<p><strong>步骤 4：推导邻接矩阵存储量<\/strong>。矩阵行列各对应 <span class=\"katex-inline\">n<\/span> 个顶点，条目总数 <span class=\"katex-inline\">n^2<\/span>；无权图条目存 0/1，有权图条目存边长或 <span class=\"katex-inline\">\\infty<\/span>。无论 <span class=\"katex-inline\">m<\/span> 是多少，空间都是 <span class=\"katex-inline\">O(n^2)<\/span>。<\/p>\n<p><strong>步骤 5：核算两类查询<\/strong>。遍历顶点 <span class=\"katex-inline\">v<\/span> 的邻居：列表直接读 <span class=\"katex-inline\">A(v)<\/span>，输出规模等于邻居数；矩阵要扫第 <span class=\"katex-inline\">v<\/span> 行 <span class=\"katex-inline\">n<\/span> 个条目。判断 <span class=\"katex-inline\">(v,w)<\/span> 是否存在：矩阵看 <span class=\"katex-inline\">M_{vw}<\/span> 一个条目，<span class=\"katex-inline\">O(1)<\/span>；列表要在 <span class=\"katex-inline\">A(v)<\/span> 内查找，代价受 <span class=\"katex-inline\">v<\/span> 的度约束。<\/p>\n<p><strong>步骤 6：给出选择判据<\/strong>。稀疏图 <span class=\"katex-inline\">m=O(n)<\/span>，列表空间随 <span class=\"katex-inline\">m<\/span> 线性增长，矩阵被空位占满；稠密图 <span class=\"katex-inline\">m=\\Theta(n^2)<\/span>，矩阵与列表条目同量级，矩阵的 <span class=\"katex-inline\">O(1)<\/span> 边查询成为优势。判据的两端是 <span class=\"katex-inline\">m<\/span> 与 <span class=\"katex-inline\">n^2<\/span> 的比值，而不是图看起来复杂不复杂。<\/p>\n<h2>数值算例一：五顶点无向图的两种表示<\/h2>\n<p>取顶点 <span class=\"katex-inline\">\\{1,2,3,4,5\\}<\/span>，无向边 <span class=\"katex-inline\">(1,2)<\/span>、<span class=\"katex-inline\">(1,3)<\/span>、<span class=\"katex-inline\">(2,3)<\/span>、<span class=\"katex-inline\">(3,4)<\/span>、<span class=\"katex-inline\">(4,5)<\/span>。<span class=\"katex-inline\">n=5<\/span>，<span class=\"katex-inline\">m=5<\/span>。<\/p>\n<p><strong>邻接列表落地<\/strong>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">A(1)=[2,3]<\/span>\n<\/li><li>\n<span class=\"katex-inline\">A(2)=[1,3]<\/span>\n<\/li><li>\n<span class=\"katex-inline\">A(3)=[1,2,4]<\/span>\n<\/li><li>\n<span class=\"katex-inline\">A(4)=[3,5]<\/span>\n<\/li><li>\n<span class=\"katex-inline\">A(5)=[4]<\/span>\n<\/ul>\n<p>条目总数 <span class=\"katex-inline\">2+2+3+2+1=10=2m<\/span>，与步骤 3 的等式相合。<\/p>\n<p><strong>邻接矩阵落地<\/strong>（行先列后，1 表示有边）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>2<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>3<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>4<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>5<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div>\n<p>矩阵条目 25 个，其中有边条目 10 个（无向边双向各记一次），空条目 15 个。<\/p>\n<p><strong>查询对照<\/strong>：查邻居 3，列表读 <span class=\"katex-inline\">A(3)=[1,2,4]<\/span>，3 步读完；矩阵扫第 3 行 5 个条目。查边 <span class=\"katex-inline\">(2,4)<\/span>，矩阵看 <span class=\"katex-inline\">M_{24}=0<\/span> 一步判定；列表在 <span class=\"katex-inline\">A(2)=[1,3]<\/span> 中翻完两个条目判定不存在。<\/p>\n<h2>数值算例二：有向图的入边出边分列<\/h2>\n<p>取顶点 <span class=\"katex-inline\">\\{a,b,c,d\\}<\/span>，有向边 <span class=\"katex-inline\">(a,b)<\/span>、<span class=\"katex-inline\">(a,c)<\/span>、<span class=\"katex-inline\">(b,c)<\/span>、<span class=\"katex-inline\">(c,d)<\/span>、<span class=\"katex-inline\">(d,b)<\/span>。<span class=\"katex-inline\">n=4<\/span>，<span class=\"katex-inline\">m=5<\/span>。<\/p>\n<p><strong>出边列表<\/strong>：<span class=\"katex-inline\">A_{\\text{out}}(a)=[b,c]<\/span>，<span class=\"katex-inline\">A_{\\text{out}}(b)=[c]<\/span>，<span class=\"katex-inline\">A_{\\text{out}}(c)=[d]<\/span>，<span class=\"katex-inline\">A_{\\text{out}}(d)=[b]<\/span>。条目总数 <span class=\"katex-inline\">2+1+1+1=5=m<\/span>。<\/p>\n<p><strong>入边列表<\/strong>：<span class=\"katex-inline\">A_{\\text{in}}(a)=[]<\/span>，<span class=\"katex-inline\">A_{\\text{in}}(b)=[a,d]<\/span>，<span class=\"katex-inline\">A_{\\text{in}}(c)=[a,b]<\/span>，<span class=\"katex-inline\">A_{\\text{in}}(d)=[c]<\/span>。<\/p>\n<p><strong>度数核算<\/strong>：出度 <span class=\"katex-inline\">\\deg^+(a)=2,\\deg^+(b)=1,\\deg^+(c)=1,\\deg^+(d)=1<\/span>，和为 5；入度 <span class=\"katex-inline\">\\deg^-(a)=0,\\deg^-(b)=2,\\deg^-(c)=2,\\deg^-(d)=1<\/span>，和为 5。两个和都等于 <span class=\"katex-inline\">m<\/span>，统计没有重复计数。<\/p>\n<p><strong>对照无向误判<\/strong>：若把 <span class=\"katex-inline\">(d,b)<\/span> 误记成无向边，<span class=\"katex-inline\">b<\/span> 的邻居会多出一个对称方向；按无向口径算度时 <span class=\"katex-inline\">b<\/span> 的度被抬高，连通范围判断随之偏大。有向图必须把方向保留到表示层，不能在存储阶段抹平。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：稀疏图硬上矩阵<\/strong>。<span class=\"katex-inline\">n=500<\/span>、<span class=\"katex-inline\">m=300<\/span>，矩阵占 <span class=\"katex-inline\">250000<\/span> 个条目，有边条目仅 <span class=\"katex-inline\">600<\/span>（双向），空位占比 <span class=\"katex-inline\">99.76\\%<\/span>；列表条目 <span class=\"katex-inline\">600<\/span> 加 500 个表头，空间差出两个量级。复盘：选择表示前先估 <span class=\"katex-inline\">m<\/span> 与 <span class=\"katex-inline\">n^2<\/span>，不能因为矩阵&quot;整齐&quot;就默认它省。<\/p>\n<p><strong>案例 2：稠密图误用列表查边<\/strong>。<span class=\"katex-inline\">n=1000<\/span>、<span class=\"katex-inline\">m=400000<\/span>，判断 <span class=\"katex-inline\">(u,v)<\/span> 是否存在时在 <span class=\"katex-inline\">A(u)<\/span> 中线性翻找，<span class=\"katex-inline\">u<\/span> 的平均度为 <span class=\"katex-inline\">800<\/span>；矩阵直接读 <span class=\"katex-inline\">M_{uv}<\/span>。复盘：若高频操作是边存在性判断，稠密场景下矩阵的常数时间更稳。<\/p>\n<p><strong>案例 3：有向边双向混记<\/strong>。把 <span class=\"katex-inline\">(a,b)<\/span> 同时写成 <span class=\"katex-inline\">(b,a)<\/span>，边数从 <span class=\"katex-inline\">m<\/span> 膨胀到 <span class=\"katex-inline\">2m<\/span>，入度出度统计失衡；后续强连通分量划分会把单向引用误读为双向可达。复盘：建模时先写清关系方向，存储时尾、头分列。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n<strong>卡在&quot;度和为什么等于 <span class=\"katex-inline\">2m<\/span>&quot;<\/strong>：回到步骤 2，逐条边数一遍：每条无向边两端各记一次，所以全部度的和是边数的两倍；拿算例一的度序列 <span class=\"katex-inline\">2,2,3,2,1<\/span> 求和 <span class=\"katex-inline\">10=2\\times5<\/span> 核对。\n<\/li><li>\n<strong>卡在&quot;列表与矩阵到底选哪个&quot;<\/strong>：先问两个问题——图稀不稀（<span class=\"katex-inline\">m<\/span> 对 <span class=\"katex-inline\">n<\/span>），程序最常做哪类查询（遍历邻居还是查单条边）。稀疏加遍历邻居选列表，稠密加查边选矩阵；两个条件指向不同表示时，按高频操作定。\n<\/li><li>\n<strong>卡在&quot;有向图为什么要分入边出边&quot;<\/strong>：回到算例二，沿出边列表能回答&quot;从 <span class=\"katex-inline\">a<\/span> 能走到谁&quot;，沿入边列表能回答&quot;谁能走到 <span class=\"katex-inline\">b<\/span>&quot;；混在一个列表里两个方向都答不全。\n<\/ul>\n<h2>延伸推演：握手定理的逐步证明与用途<\/h2>\n<p>无向图的度和等式 <span class=\"katex-inline\">\\sum_{v\\in V}\\deg(v)=2m<\/span> 通常称为握手定理。下面逐步证明，并说明它在什么地方被拿来校验统计。<\/p>\n<ol><li>\n<strong>计数对象拆成两端<\/strong>：每条无向边 <span class=\"katex-inline\">(v,w)<\/span> 在 <span class=\"katex-inline\">v<\/span> 的度中记一次，在 <span class=\"katex-inline\">w<\/span> 的度中记一次；不存在第三条记录位置。\n<\/li><li>\n<strong>逐条边累加<\/strong>：<span class=\"katex-inline\">m<\/span> 条边各贡献两次计数，全部计数位置共 <span class=\"katex-inline\">2m<\/span> 个；度序列是按顶点归并这些计数的结果，归并不改变总数。\n<\/li><li>\n<strong>等式成立<\/strong>：按顶点归并前后计数总数相等，故度和为 <span class=\"katex-inline\">2m<\/span>。\n<\/li><li>\n<strong>推论方向<\/strong>：度序列之和必为偶数；若手工统计出度和为奇数，说明有边漏记、重记或把有向边混入。\n<\/li><li>\n<strong>有向版本对照<\/strong>：每条有向边给尾记一次出度、给头记一次入度，故出度和等于入度和，二者都等于 <span class=\"katex-inline\">m<\/span>。这两条等式在 c03 划分连通分量、c04 统计强连通分量时用于复核边数。\n<\/ol>\n<h2>规模外推算例：同一图两种表示的存储增长<\/h2>\n<p>固定稀疏率 <span class=\"katex-inline\">m=3n<\/span>，对比 <span class=\"katex-inline\">n=100<\/span>、<span class=\"katex-inline\">n=1000<\/span>、<span class=\"katex-inline\">n=10000<\/span> 三档。<\/p>\n<ul><li>\n<strong>邻接列表<\/strong>：条目数 <span class=\"katex-inline\">2m=6n<\/span>，加 <span class=\"katex-inline\">n<\/span> 个表头，空间随 <span class=\"katex-inline\">n<\/span> 线性增长；<span class=\"katex-inline\">n=10000<\/span> 时条目 60000。\n<\/li><li>\n<strong>邻接矩阵<\/strong>：条目数 <span class=\"katex-inline\">n^2<\/span>；<span class=\"katex-inline\">n=10000<\/span> 时条目 <span class=\"katex-inline\">10^8<\/span>，其中有边条目仅 60000，空位占比 <span class=\"katex-inline\">99.94\\%<\/span>。\n<\/ul>\n<p>再看稠密情形 <span class=\"katex-inline\">m=n^2/2<\/span>：矩阵条目 <span class=\"katex-inline\">n^2<\/span>，列表条目 <span class=\"katex-inline\">2m=n^2<\/span>，两者同量级；此时矩阵查边 <span class=\"katex-inline\">O(1)<\/span> 的优势才压过列表的遍历优势。两档情形说明：表示选择不是固定偏好，而是 <span class=\"katex-inline\">m/n^2<\/span> 比值与查询类型的联合函数。<\/p>\n<h2>表示形式怎样约束后续算法的总代价<\/h2>\n<p>后续图算法的运行时间常写成&quot;每条边被考察常数次&quot;的形式，这个常数次数能否成立依赖表示：<\/p>\n<ol><li>\n<strong>遍历邻居<\/strong>：邻接列表下读 <span class=\"katex-inline\">A(v)<\/span> 的代价等于邻居数，全部顶点扫完合计 <span class=\"katex-inline\">O(n+m)<\/span>；矩阵下每顶点扫一行 <span class=\"katex-inline\">n<\/span> 个条目，合计 <span class=\"katex-inline\">O(n^2)<\/span>。同一段算法逻辑，换表示后总代价改变。\n<\/li><li>\n<strong>松弛与登记<\/strong>：第 3 章 Dijkstra 扫描跨集合边时，从已处理顶点出发列出候选边，列表形式按邻居数走，矩阵形式按整行走。\n<\/li><li>\n<strong>存储边界<\/strong>：矩阵无法表达多重边（同对顶点多条边），列表可以在同一桶内追加；需要多重边建模时表示形式先受限。\n<\/ol>\n<p>这一层解释了为什么本书算法伪码普遍以邻接列表为输入格式：算法分析里的线性时间 <span class=\"katex-inline\">O(m+n)<\/span> 是在列表口径下写出的。<\/p>\n<h2>对抗性追问：为什么不直接用矩阵统一一切<\/h2>\n<p>追问：矩阵查边快、实现简单，为什么不在所有图上都用矩阵？<\/p>\n<ol><li>\n<strong>空间项不可忽略<\/strong>：<span class=\"katex-inline\">n<\/span> 增大时 <span class=\"katex-inline\">n^2<\/span> 增长远快于 <span class=\"katex-inline\">m<\/span>；真实网络顶点常以万、十万计，矩阵空位占多数，内存被无意义条目占满。\n<\/li><li>\n<strong>遍历代价被放大<\/strong>：算法要列出某顶点全部邻居时，矩阵扫整行；即使邻居只有两三个，也要检查 <span class=\"katex-inline\">n<\/span> 个条目。\n<\/li><li>\n<strong>矩阵的强项只在两点<\/strong>：稠密图（边数接近平方）与高频单条边查询；离开这两点，矩阵的固定成本收不回来。\n<\/li><li>\n<strong>反过来的追问<\/strong>：列表为什么不做 <span class=\"katex-inline\">O(1)<\/span> 查边？列表把邻居分散在序列里，定位条目要按值查找；要做到常数查边，需要额外在桶内加索引，那已经是另一种结构。\n<\/ol>\n<h2>程序落地对照：两种表示的读写动作<\/h2>\n<p>下面用伪码对照两类表示上最基础的两个动作，看清表示怎样影响每一步操作。<\/p>\n<p><strong>加一条边 <span class=\"katex-inline\">(v,w)<\/span>，无向图<\/strong>：<\/p>\n<ul><li>\n邻接列表：把 <span class=\"katex-inline\">w<\/span> 追加进 <span class=\"katex-inline\">A(v)<\/span>，把 <span class=\"katex-inline\">v<\/span> 追加进 <span class=\"katex-inline\">A(w)<\/span>；两次追加，常数时间。\n<\/li><li>\n邻接矩阵：令 <span class=\"katex-inline\">M_{vw}=M_{wv}=1<\/span>；两次赋值，常数时间。\n<\/ul>\n<p><strong>列出顶点 <span class=\"katex-inline\">v<\/span> 的全部邻居<\/strong>：<\/p>\n<ul><li>\n邻接列表：遍历序列 <span class=\"katex-inline\">A(v)<\/span>，逐个输出；输出个数即邻居数。\n<\/li><li>\n邻接矩阵：循环下标 <span class=\"katex-inline\">u=1,\\dots,n<\/span>，仅当 <span class=\"katex-inline\">M_{vu}=1<\/span> 时输出 <span class=\"katex-inline\">u<\/span>；循环 <span class=\"katex-inline\">n<\/span> 次，不论输出几个。\n<\/ul>\n<p><strong>判断边 <span class=\"katex-inline\">(v,w)<\/span> 是否存在<\/strong>：<\/p>\n<ul><li>\n邻接列表：在 <span class=\"katex-inline\">A(v)<\/span> 中逐项比较，找到即停，未找到则扫完整序列。\n<\/li><li>\n邻接矩阵：读取 <span class=\"katex-inline\">M_{vw}<\/span> 一个条目，按 0/1 判定。\n<\/ul>\n<p>把这三组动作对照后可见：列表的成本跟着边数走，矩阵的成本跟着顶点数走；选表示等于选择把成本挂在 <span class=\"katex-inline\">m<\/span> 上还是 <span class=\"katex-inline\">n^2<\/span> 上。后续 c02 的 BFS 每访问一个顶点就列一次邻居，列表口径下全部边各被看两次，这是 <span class=\"katex-inline\">O(m+n)<\/span> 线性结论的来源。<\/p>\n<h2>小测验式核算：三组数字的表示判断<\/h2>\n<ol><li>\n<span class=\"katex-inline\">n=200<\/span>，<span class=\"katex-inline\">m=190<\/span>：稀疏图，边数与顶点数同阶；遍历邻居为主选邻接列表，矩阵条目 40000 而有边条目 380。\n<\/li><li>\n<span class=\"katex-inline\">n=50<\/span>，<span class=\"katex-inline\">m=1200<\/span>：<span class=\"katex-inline\">m<\/span> 接近 <span class=\"katex-inline\">n^2/2<\/span>，稠密；若程序频繁判断两顶点是否相邻，矩阵的 <span class=\"katex-inline\">O(1)<\/span> 查边更稳。\n<\/li><li>\n<span class=\"katex-inline\">n=10000<\/span>，<span class=\"katex-inline\">m=15000<\/span>：稀疏大图；列表条目 30000，矩阵条目 <span class=\"katex-inline\">10^8<\/span>，列表空间优势随规模拉大。\n<\/ol>\n<p>三组数字覆盖稀疏、稠密、大图稀疏三个常见位置；判断顺序都是先估 <span class=\"katex-inline\">m<\/span> 对 <span class=\"katex-inline\">n^2<\/span> 的比值，再核对高频操作类型。<\/p>\n<h2>第二组对照：简单图口径之外需要补什么<\/h2>\n<p>基本术语讨论简单图：顶点对之间至多一条边，不含自环。落地真实场景时常见三种扩展，各有约定成本：<\/p>\n<ul><li>\n<strong>多重边<\/strong>：同一对顶点之间多条边，邻接矩阵单条目放不下，需在条目内挂列表或计数组。\n<\/li><li>\n<strong>自环<\/strong>：顶点连向自身，在度统计中按约定计两次（无向）；矩阵对角条目需要单独解释。\n<\/li><li>\n<strong>带权边<\/strong>：列表条目附带长度，矩阵条目存边长；无权图的 0/1 判定升级为数值比较。\n<\/ul>\n<p>本书后续章节的图算法以简单有向/无向图加非负边长为主；遇到上述扩展，先确认表示能否承载，再套用算法结论。<\/p>\n<p><strong>案例 4：把表示成本记反<\/strong>。常见误写是&quot;邻接矩阵省空间，因为不用存指针&quot;。复盘：指针开销只在列表的表头与链接处，矩阵省掉的是指针，换回的是 <span class=\"katex-inline\">n^2<\/span> 个条目；稀疏图上条目空位的代价远高于指针。记成本时分别列出存储项：列表 <span class=\"katex-inline\">n<\/span> 表头加 <span class=\"katex-inline\">2m<\/span> 条目，矩阵 <span class=\"katex-inline\">n^2<\/span> 条目，不要只比单项。<\/p>\n<p><strong>案例 5：有向图套用无向邻接口径<\/strong>。无向列表把邻居双向登记，有向图若照做，出边信息被入边信息覆盖；需要两个方向各维护一份序列，或者在遍历时只读出边表。复盘：表示层的方向约定必须与图类型一致，类型在建模阶段确定，不在遍历阶段临时补。<\/p>\n<h2>表示选择速查清单<\/h2>\n<ul><li>\n先估 <span class=\"katex-inline\">n<\/span>、<span class=\"katex-inline\">m<\/span>，算 <span class=\"katex-inline\">m<\/span> 对 <span class=\"katex-inline\">n^2<\/span> 的比值；\n<\/li><li>\n高频操作是遍历邻居 → 列表优先；高频操作是查单条边 → 矩阵优先；\n<\/li><li>\n稀疏大图 <span class=\"katex-inline\">(m=O(n))<\/span> 直接选列表；稠密近完全图选矩阵；\n<\/li><li>\n多重边、自环、带权边先确认表示能否承载，再选结构；\n<\/li><li>\n算法分析里的 <span class=\"katex-inline\">O(m+n)<\/span> 结论默认邻接列表口径，换矩阵要重算遍历代价。\n<\/ul>\n<h2>差生通读检查（补充）<\/h2>\n<ul><li>\n<strong>卡在&quot;为什么列表遍历邻居是线性而矩阵不是&quot;<\/strong>：回到步骤 5，列表存的就是邻居本身，读出即输出；矩阵把非邻居也铺在行里，必须逐个排除。输出规模相同，排除空条目的工作量不同。\n<\/li><li>\n<strong>卡在&quot;稀疏稠密没有硬界线&quot;<\/strong>：界线是 <span class=\"katex-inline\">m<\/span> 与 <span class=\"katex-inline\">n^2<\/span> 的比值；<span class=\"katex-inline\">m=O(n\\log n)<\/span> 仍属稀疏，<span class=\"katex-inline\">m=\\Theta(n^2)<\/span> 才称稠密，中间情形按高频查询类型定表示。\n<\/li><li>\n<strong>卡在&quot;度和等式怎么用来查错&quot;<\/strong>：统计完度序列先求和，奇数和直接说明计数有误；有向图再分别核出度和、入度和是否都等于 <span class=\"katex-inline\">m<\/span>。\n<\/ul>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n一个 <span class=\"katex-inline\">n=6<\/span> 的无向图有 7 条边，邻接列表的邻居条目总数是多少？写出推导等式。\n<\/li><li>\n邻接矩阵判断 <span class=\"katex-inline\">(v,w)<\/span> 存在性的时间是多少？邻接列表在最坏情况下受哪个量约束？\n<\/li><li>\n有向图中入度之和与出度之和各等于什么？若二者不相等，统计环节可能出了什么错？\n<\/li><li>\n为什么稀疏图上邻接矩阵的空条目占比随 <span class=\"katex-inline\">n<\/span> 增大而升高？\n<\/li><li>\n建模&quot;关注关系&quot;与&quot;好友关系&quot;时，各应选有向图还是无向图？说明理由。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "图的基本术语与邻接列表、邻接矩阵两种表示"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：算法详解 卷2 图算法和数据结构.pdf · p.41<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">图的基本术语与邻接列表、邻接矩阵两种表示<\/a><\/span><\/div><h1>宽度优先搜索（BFS）：访问层数与无权最短路径<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch01（原书 §2.2，PDF 第 41–49 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>宽度优先搜索（Breadth-First Search, BFS）从起点 <span class=\"katex-inline\">s<\/span> 出发，用队列维护待扩张顶点，按&quot;距 <span class=\"katex-inline\">s<\/span> 的边数&quot;由近及远逐层访问；在每条边权值相同（取 1）的图上，顶点被访问时登记的层数就是从 <span class=\"katex-inline\">s<\/span> 到该顶点的无权最短路径跳数。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>给定一张网络，要回答&quot;从起点到每个顶点最少走几条边&quot;。朴素做法是枚举所有路径再比长度，路径数随顶点数指数增长，不可行。需要一种只沿边走一遍、就能把每个顶点的最短跳数定下来的搜索过程。<\/p>\n<p>不用 BFS 会出两类问题。第一类是访问次序混乱：沿一条岔路扎到底（DFS 式走法），先访问到的顶点未必离起点近，用先发现次序充当距离会把距离算大。第二类是重复访问与漏访问：没有已访问标记，同一顶点可能被多条路径反复推入队列；标记规则不清，又可能把不可达顶点误判为已访问。BFS 用队列保证近层先于远层扩张，用已访问标记保证每个顶点只入队一次，把&quot;最短跳数&quot;与&quot;访问次序&quot;两件事同时定住。<\/p>\n<p>具体场景：社交网络要算出每个账号距新人账号的间隔层数，路网软件在等权街区图上估算最少转弯次数。这类问题的共同结构是&quot;边数最少&quot;，不是&quot;路程最短&quot;。若没有按层扩张的过程，逐路径枚举会随顶点数爆炸；若次序不受控，距离标签会被先到先得的偶然顺序带偏。BFS 把扩张次序固定为层序，使距离可以被归纳证明，而不是凭个别例子猜出来。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>起点 <span class=\"katex-inline\">s<\/span><\/strong>：搜索的根，层数 <span class=\"katex-inline\">d(s)=0<\/span>。<\/p>\n<p><strong>队列 <span class=\"katex-inline\">Q<\/span><\/strong>：先进先出结构，存放已发现但尚未扩张的顶点。初始化时 <span class=\"katex-inline\">Q<\/span> 只含 <span class=\"katex-inline\">s<\/span>。<\/p>\n<p><strong>已访问标记<\/strong>：顶点一旦入队即标记，防止后续边再次把它推入；标记时机是入队时，不是出队时。<\/p>\n<p><strong>层（level）<\/strong>：<span class=\"katex-inline\">d(v)<\/span> 记录 <span class=\"katex-inline\">v<\/span> 距 <span class=\"katex-inline\">s<\/span> 的最少边数。<span class=\"katex-inline\">s<\/span> 在第 0 层；第 <span class=\"katex-inline\">k<\/span> 层顶点由第 <span class=\"katex-inline\">k-1<\/span> 层顶点的未访问邻居构成。<\/p>\n<p><strong>BFS 过程<\/strong>：<\/p>\n<ol><li>\n初始化 <span class=\"katex-inline\">d(s)=0<\/span>，其余顶点未标记，<span class=\"katex-inline\">Q=[s]<\/span>。\n<\/li><li>\n出队头部顶点 <span class=\"katex-inline\">u<\/span>，扫描 <span class=\"katex-inline\">u<\/span> 的全部邻居 <span class=\"katex-inline\">w<\/span>。\n<\/li><li>\n若 <span class=\"katex-inline\">w<\/span> 未标记，标记 <span class=\"katex-inline\">w<\/span>，令 <span class=\"katex-inline\">d(w)=d(u)+1<\/span>，入队 <span class=\"katex-inline\">Q<\/span>。\n<\/li><li>\n重复直到 <span class=\"katex-inline\">Q<\/span> 为空；未标记顶点即从 <span class=\"katex-inline\">s<\/span> 不可达。\n<\/ol>\n<p><strong>最短路径长度（无权口径）<\/strong>：<span class=\"katex-inline\">\\mathrm{dist}(s,v)<\/span> 是 <span class=\"katex-inline\">s<\/span> 到 <span class=\"katex-inline\">v<\/span> 的路径中边数的最小值；BFS 给出的 <span class=\"katex-inline\">d(v)<\/span> 在边权全 1 时等于这个值。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">s<\/span> 邻居为 <span class=\"katex-inline\">a,b<\/span>；<span class=\"katex-inline\">a<\/span> 邻居为 <span class=\"katex-inline\">c<\/span>。BFS 次序：<span class=\"katex-inline\">s<\/span>（层 0）→ <span class=\"katex-inline\">a,b<\/span>（层 1）→ <span class=\"katex-inline\">c<\/span>（层 2），<span class=\"katex-inline\">d(c)=2<\/span>。<\/p>\n<p><strong>反例<\/strong>：边权不等时，路径 <span class=\"katex-inline\">s\\to a\\to c<\/span> 长 <span class=\"katex-inline\">1+10=11<\/span>，直达 <span class=\"katex-inline\">s\\to c<\/span> 长 4；按跳数 BFS 会把 <span class=\"katex-inline\">c<\/span> 记为层 1，但总长最短路径仍是直达。跳数最短不等于总长最短，BFS 结论只在等权口径下成立。<\/p>\n<h2>原理推导：层数等于最少跳数的证明<\/h2>\n<p>下面按归纳方向逐步证明 <span class=\"katex-inline\">d(v)=\\mathrm{dist}(s,v)<\/span>。<\/p>\n<ol><li>\n<strong>基例<\/strong>：<span class=\"katex-inline\">d(s)=0<\/span>，<span class=\"katex-inline\">\\mathrm{dist}(s,s)=0<\/span>，相等。\n<\/li><li>\n<strong>上界<\/strong>：顶点 <span class=\"katex-inline\">w<\/span> 由 <span class=\"katex-inline\">u<\/span> 扩展入队时，存在一条 <span class=\"katex-inline\">s\\to u\\to w<\/span> 的路径，长 <span class=\"katex-inline\">d(u)+1<\/span>；按归纳假设 <span class=\"katex-inline\">d(u)=\\mathrm{dist}(s,u)<\/span>，故 <span class=\"katex-inline\">\\mathrm{dist}(s,w)\\le d(u)+1=d(w)<\/span>。\n<\/li><li>\n<strong>下界<\/strong>：反设存在长度小于 <span class=\"katex-inline\">d(w)<\/span> 的路径到达 <span class=\"katex-inline\">w<\/span>。沿该路径取倒数第二个顶点 <span class=\"katex-inline\">x<\/span>，<span class=\"katex-inline\">x<\/span> 的层数按归纳假设已是其最少跳数；<span class=\"katex-inline\">w<\/span> 会在 <span class=\"katex-inline\">x<\/span> 被扩张的那一轮入队，层号不超过 <span class=\"katex-inline\">d(x)+1<\/span>，与 <span class=\"katex-inline\">w<\/span> 首次在第 <span class=\"katex-inline\">d(w)<\/span> 层入队矛盾。故 <span class=\"katex-inline\">\\mathrm{dist}(s,w)\\ge d(w)<\/span>。\n<\/li><li>\n<strong>相合<\/strong>：上下界相等，<span class=\"katex-inline\">d(w)=\\mathrm{dist}(s,w)<\/span>。\n<\/li><li>\n<strong>时间代价<\/strong>：每个顶点入队一次，每条无向边在两端各被扫描一次（有向边一次），全部扫描合计 <span class=\"katex-inline\">O(n+m)<\/span>；队列操作每个顶点常数次。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：图有限；每条边权值相同（无权图，或权值全取 1）；求的是最少边数路径。\n<\/li><li>\n边界 1：边权不等时，BFS 层数不再等于总长最短路径，需要第 3 章的 Dijkstra。\n<\/li><li>\n边界 2：BFS 只回答可达性与跳数，不直接给出路径上的中间顶点；要还原路径需记录每个顶点的前驱指针。\n<\/li><li>\n边界 3：有向图上 BFS 沿出边方向扩张，可达性是单向的；不能把出边邻居当成双向邻居。\n<\/li><li>\n失败案例：把标记时机放在出队时，同一顶点被多条入边反复入队，队列膨胀，<span class=\"katex-inline\">O(n+m)<\/span> 结论失效；标记必须在入队瞬间完成。\n<\/li><li>\n失败案例：在带负权或混合权图上套用 BFS 层数结论，把跳数当总长，得到的路线可能绕远。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>BFS vs DFS<\/strong>：BFS 用队列按层扩张，回答距离与可达范围；DFS 用栈（或递归调用栈）走到底再回退，回答次序与归属。连通图上两者访问到的顶点集合相同，给出的次序与结论不同。\n<\/li><li>\n<strong>最少跳数 vs 最短总长<\/strong>：前者只数边的条数，后者数边权之和；边权全 1 时两者重合，权值不等时分开。\n<\/li><li>\n<strong>访问标记 vs 距离登记<\/strong>：标记防止重复入队，距离登记记录层号；二者绑定在同一顶点上，但职责不同——标记管&quot;去不去重&quot;，层号管&quot;距离是多少&quot;。\n<\/li><li>\n<strong>BFS 树 vs 原图<\/strong>：BFS 过程中每个顶点由某条入队边确定前驱，这些边构成一棵 BFS 树；树给出最短跳数路径，原图中其余边不参与距离登记。\n<\/li><li>\n<strong>层号标签 vs 连通分量<\/strong>：层号描述单点到起点的距离，分量描述一组顶点互相可达；前者是搜索结果标签，后者是按可达性切出的顶点块。一次 BFS 只能给出起点所在分量的内部距离标签。\n<\/li><li>\n<strong>队列操作 vs 距离比较<\/strong>：BFS 选下一个扩张顶点时不比较路径总长，只按入队顺序；这与 Dijkstra 每轮比较得分不同。等权前提下层序等价于得分序，加权前提下两者分开。\n<\/ul>\n<h2>常见误判<\/h2>\n<ul><li>\n误判：BFS 能在任意图上找最短路径。实际只能找最少跳数路径；边长不等时最短总长要换加权算法。\n<\/li><li>\n误判：先被访问的顶点距离更近。访问次序由队列决定，在 DFS 式次序中先访问可以是远层；只有 BFS 的层序才与近远一致。\n<\/li><li>\n误判：BFS 结束后未标记顶点距离为 0。未标记表示不可达，距离记 <span class=\"katex-inline\">+\\infty<\/span>，与起点自身的层 0 完全不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的邻接列表表示是 BFS 扫描邻居的输入格式。后继：c03 的连通分量划分以 BFS/DFS 的可达集合为单位；c05 指出 BFS 在加权图上失效的边界，引出 c06 的 Dijkstra；BFS 的&quot;已处理集合逐步扩张&quot;框架被第 3 章沿用，只替换选边规则。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（宽度优先搜索（BFS）：访问层数与无权最短路径）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：BFS 依赖链、层数证明、小图逐步推演与失效边界<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把 BFS 的距离结论讲清，往回追四层：<\/p>\n<ol><li>\n<strong>图的表示与可达性<\/strong>：先能列出一个顶点的全部邻居（c01 邻接列表），搜索才有扩张方向；可达性定义为沿边是否存在路径。\n<\/li><li>\n<strong>访问次序约束<\/strong>：近层顶点必须先于远层顶点扩张，这要求队列的先进先出性质；栈式次序不保证近先远后。\n<\/li><li>\n<strong>去重规则<\/strong>：入队即标记，保证每顶点一次入队，代价线性；标记时机错放会破坏线性结论。\n<\/li><li>\n<strong>距离口径<\/strong>：层数登记的是最少边数；结论成立的前提是边权全 1，离开这个前提距离口径改变。\n<\/ol>\n<p>依赖链方向：表示与可达性 → 队列次序 → 入队标记 → 层数等于最少跳数。<\/p>\n<h2>正向推导：从初始化到最短跳数结论<\/h2>\n<p>下面一步步推出 BFS 的距离正确性与运行时间。<\/p>\n<p><strong>步骤 1：初始化<\/strong>。起点 <span class=\"katex-inline\">s<\/span> 入队，<span class=\"katex-inline\">d(s)=0<\/span>；其余顶点未标记。队列 <span class=\"katex-inline\">Q<\/span> 只含 <span class=\"katex-inline\">s<\/span>。已访问集合一开始只有 <span class=\"katex-inline\">s<\/span>。<\/p>\n<p><strong>步骤 2：扩张一轮<\/strong>。出队头部 <span class=\"katex-inline\">u<\/span>，逐条考察邻居 <span class=\"katex-inline\">w<\/span>：未标记则标记、令 <span class=\"katex-inline\">d(w)=d(u)+1<\/span>、入队；已标记跳过。已标记顶点不再进入队列，因此同一顶点不会被第二条路径再次登记。<\/p>\n<p><strong>步骤 3：层间递推<\/strong>。第 <span class=\"katex-inline\">k-1<\/span> 层顶点全部出队后，它们扩展出的新顶点构成第 <span class=\"katex-inline\">k<\/span> 层。队列按入队顺序排列，第 <span class=\"katex-inline\">k<\/span> 层顶点排在第 <span class=\"katex-inline\">k-1<\/span> 层之后，扩张次序与层号一致。<\/p>\n<p><strong>步骤 4：上界归纳<\/strong>。基例 <span class=\"katex-inline\">d(s)=0=\\mathrm{dist}(s,s)<\/span>。设所有层号小于 <span class=\"katex-inline\">k<\/span> 的顶点满足 <span class=\"katex-inline\">d=\\mathrm{dist}<\/span>。顶点 <span class=\"katex-inline\">w<\/span> 由层 <span class=\"katex-inline\">k-1<\/span> 的 <span class=\"katex-inline\">u<\/span> 扩展，存在长 <span class=\"katex-inline\">d(u)+1<\/span> 的路径到 <span class=\"katex-inline\">w<\/span>，故 <span class=\"katex-inline\">\\mathrm{dist}(s,w)\\le d(w)<\/span>。<\/p>\n<p><strong>步骤 5：下界归纳<\/strong>。反设 <span class=\"katex-inline\">w<\/span> 存在更短路径 <span class=\"katex-inline\">P<\/span>，长度 <span class=\"katex-inline\">r&lt;d(w)<\/span>。<span class=\"katex-inline\">P<\/span> 上倒数第二个顶点 <span class=\"katex-inline\">x<\/span> 按归纳假设层数为 <span class=\"katex-inline\">\\mathrm{dist}(s,x)=r-1<\/span>；<span class=\"katex-inline\">x<\/span> 出队时 <span class=\"katex-inline\">w<\/span> 作为未访问邻居被发现并入队，层号至多 <span class=\"katex-inline\">r<\/span>，与 <span class=\"katex-inline\">d(w)&gt;r<\/span> 矛盾。故 <span class=\"katex-inline\">\\mathrm{dist}(s,w)\\ge d(w)<\/span>。<\/p>\n<p><strong>步骤 6：结论与代价<\/strong>。上下界相合，<span class=\"katex-inline\">d(w)=\\mathrm{dist}(s,w)<\/span>。时间上：<span class=\"katex-inline\">n<\/span> 个顶点各入队出队一次；无向图每条边在两端各扫描一次，共 <span class=\"katex-inline\">2m<\/span> 次邻居检查；合计 <span class=\"katex-inline\">O(n+m)<\/span>。空间上：队列与标记表 <span class=\"katex-inline\">O(n)<\/span>。<\/p>\n<h2>数值算例一：六顶点无向图逐步跑 BFS<\/h2>\n<p>取顶点 <span class=\"katex-inline\">\\{s,a,b,c,d,e\\}<\/span>，边 <span class=\"katex-inline\">(s,a)<\/span>、<span class=\"katex-inline\">(s,b)<\/span>、<span class=\"katex-inline\">(a,c)<\/span>、<span class=\"katex-inline\">(b,c)<\/span>、<span class=\"katex-inline\">(b,d)<\/span>、<span class=\"katex-inline\">(c,e)<\/span>。<\/p>\n<p><strong>初始化<\/strong>：<span class=\"katex-inline\">Q=[s]<\/span>，<span class=\"katex-inline\">d(s)=0<\/span>，其余未标记。<\/p>\n<p><strong>第 1 轮<\/strong>：出队 <span class=\"katex-inline\">s<\/span>。邻居 <span class=\"katex-inline\">a<\/span>：未标记，<span class=\"katex-inline\">d(a)=1<\/span>，入队；邻居 <span class=\"katex-inline\">b<\/span>：未标记，<span class=\"katex-inline\">d(b)=1<\/span>，入队。<span class=\"katex-inline\">Q=[a,b]<\/span>。<\/p>\n<p><strong>第 2 轮<\/strong>：出队 <span class=\"katex-inline\">a<\/span>。邻居 <span class=\"katex-inline\">s<\/span> 已标记；邻居 <span class=\"katex-inline\">c<\/span>：未标记，<span class=\"katex-inline\">d(c)=2<\/span>，入队。<span class=\"katex-inline\">Q=[b,c]<\/span>。<\/p>\n<p><strong>第 3 轮<\/strong>：出队 <span class=\"katex-inline\">b<\/span>。邻居 <span class=\"katex-inline\">s<\/span> 已标记；邻居 <span class=\"katex-inline\">c<\/span> 已标记；邻居 <span class=\"katex-inline\">d<\/span>：未标记，<span class=\"katex-inline\">d(d)=2<\/span>，入队。<span class=\"katex-inline\">Q=[c,d]<\/span>。<\/p>\n<p><strong>第 4 轮<\/strong>：出队 <span class=\"katex-inline\">c<\/span>。邻居 <span class=\"katex-inline\">a,b<\/span> 已标记；邻居 <span class=\"katex-inline\">e<\/span>：未标记，<span class=\"katex-inline\">d(e)=3<\/span>，入队。<span class=\"katex-inline\">Q=[d,e]<\/span>。<\/p>\n<p><strong>第 5 轮<\/strong>：出队 <span class=\"katex-inline\">d<\/span>，邻居 <span class=\"katex-inline\">b<\/span> 已标记；出队 <span class=\"katex-inline\">e<\/span>，邻居 <span class=\"katex-inline\">c<\/span> 已标记。队列为空。<\/p>\n<p><strong>结果<\/strong>：层 0 <span class=\"katex-inline\">\\{s\\}<\/span>，层 1 <span class=\"katex-inline\">\\{a,b\\}<\/span>，层 2 <span class=\"katex-inline\">\\{c,d\\}<\/span>，层 3 <span class=\"katex-inline\">\\{e\\}<\/span>。核验最短跳数：<span class=\"katex-inline\">s\\to e<\/span> 经 <span class=\"katex-inline\">c<\/span> 为 3 跳；不存在两跳路径到 <span class=\"katex-inline\">e<\/span>，<span class=\"katex-inline\">d(e)=3<\/span> 与最少跳数一致。<\/p>\n<p><strong>前驱还原路径<\/strong>：<span class=\"katex-inline\">e<\/span> 的前驱是 <span class=\"katex-inline\">c<\/span>，<span class=\"katex-inline\">c<\/span> 的前驱是 <span class=\"katex-inline\">a<\/span>（或 <span class=\"katex-inline\">b<\/span>，取决于谁先发现），<span class=\"katex-inline\">a<\/span> 的前驱是 <span class=\"katex-inline\">s<\/span>；回溯得 <span class=\"katex-inline\">s\\to a\\to c\\to e<\/span>。<\/p>\n<h2>数值算例二：不等权图上 BFS 层数失效对照<\/h2>\n<p>取边 <span class=\"katex-inline\">(s,a)=1<\/span>、<span class=\"katex-inline\">(a,c)=10<\/span>、<span class=\"katex-inline\">(s,c)=4<\/span>。BFS 按跳数执行：<span class=\"katex-inline\">s<\/span> 层 0，<span class=\"katex-inline\">a,c<\/span> 同被发现入队，<span class=\"katex-inline\">d(c)=1<\/span>。但总长比较：直达路径长 4，绕行路径长 <span class=\"katex-inline\">1+10=11<\/span>，<span class=\"katex-inline\">\\mathrm{dist}(s,c)=4<\/span>，BFS 登记的层号 1 不等于总长最短跳数口径下的总长。<\/p>\n<p>对照说明：BFS 证明第 4、5 步依赖&quot;每条边贡献相同代价&quot;；边长不等时，层号只记录边数，不再压住总长比较。此例中 <span class=\"katex-inline\">c<\/span> 的跳数确实是 1，但总长最短路线不能由层号读出。补救方向是第 3 章按得分扩张的 Dijkstra。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：标记放在出队时<\/strong>。同一顶点 <span class=\"katex-inline\">w<\/span> 被 <span class=\"katex-inline\">u_1,u_2<\/span> 先后发现，两次都入队；队列中 <span class=\"katex-inline\">w<\/span> 出现两次，后续扩张又重复扫描其邻居。复盘：入队瞬间标记，后续发现直接跳过，入队次数才是一次。<\/p>\n<p><strong>案例 2：把 BFS 层号当加权距离<\/strong>。混合边长图上用层号报路线代价，跳数少的路线可能总长更大；复盘：先确认边权口径，等权图才用 BFS 距离，不等权换加权算法。<\/p>\n<p><strong>案例 3：有向图按双向邻居扩张<\/strong>。把出边列表当成无向邻居表扫描，可达范围被放大；复盘：有向 BFS 只沿出边走，入边方向不在本次搜索范围。<\/p>\n<p><strong>案例 4：不可达顶点留空标记<\/strong>。算法结束后未标记顶点未被检查，汇报时把它们与层号 <span class=\"katex-inline\">+\\infty<\/span> 混在一起；复盘：结束后区分已标记可达与未标记不可达两类。<\/p
