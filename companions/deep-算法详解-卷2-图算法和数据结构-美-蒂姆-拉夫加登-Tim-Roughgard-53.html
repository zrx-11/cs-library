ass=\"katex-inline\">X=\\{s,v\\}<\/span>，<code>len(v)=1<\/code>。 <strong>轮 2<\/strong>：跨边 <span class=\"katex-inline\">(s,w)<\/span> 得分 4，<span class=\"katex-inline\">(v,w)<\/span> 得分 <span class=\"katex-inline\">1+2=3<\/span>，<span class=\"katex-inline\">(v,t)<\/span> 得分 <span class=\"katex-inline\">1+6=7<\/span>。选 <span class=\"katex-inline\">(v,w)<\/span>，<span class=\"katex-inline\">X<\/span> 加 <span class=\"katex-inline\">w<\/span>，<code>len(w)=3<\/code>。 <strong>轮 3<\/strong>：跨边 <span class=\"katex-inline\">(v,t)<\/span> 得分 7，<span class=\"katex-inline\">(w,t)<\/span> 得分 <span class=\"katex-inline\">3+3=6<\/span>。选 <span class=\"katex-inline\">(w,t)<\/span>，<code>len(t)=6<\/code>。 <strong>结果<\/strong>：<code>len(s)=0,len(v)=1,len(w)=3,len(t)=6<\/code>。回溯前驱 <span class=\"katex-inline\">t\\leftarrow w\\leftarrow v\\leftarrow s<\/span>，路径 <span class=\"katex-inline\">s\\to v\\to w\\to t<\/span> 长 6。<\/p>\n<p><strong>核验<\/strong>：<span class=\"katex-inline\">s\\to w<\/span> 直达 4，绕行 3；算法在轮 2 经 <span class=\"katex-inline\">(v,w)<\/span> 登记 3，正确识别绕行更短。<span class=\"katex-inline\">t<\/span> 的两条候选 7 与 6，取 6。<\/p>\n<h2>数值算例二：负权图出错位置<\/h2>\n<p>边 <span class=\"katex-inline\">(s,a)=1<\/span>，<span class=\"katex-inline\">(a,b)=1<\/span>，<span class=\"katex-inline\">(s,b)=4<\/span>，<span class=\"katex-inline\">(b,a)=-3<\/span>。<\/p>\n<p><strong>Dijkstra 执行<\/strong>：<\/p>\n<ol><li>\n<span class=\"katex-inline\">X=\\{s\\}<\/span>，跨边 <span class=\"katex-inline\">(s,a)<\/span> 得分 1，<span class=\"katex-inline\">(s,b)<\/span> 得分 4；选 <span class=\"katex-inline\">(s,a)<\/span>，<code>len(a)=1<\/code>，<span class=\"katex-inline\">a<\/span> 入 <span class=\"katex-inline\">X<\/span> 锁定。\n<\/li><li>\n跨边 <span class=\"katex-inline\">(a,b)<\/span> 得分 <span class=\"katex-inline\">1+1=2<\/span>，<span class=\"katex-inline\">(s,b)=4<\/span>；选 <span class=\"katex-inline\">(a,b)<\/span>，<code>len(b)=2<\/code>。\n<\/li><li>\n此后 <span class=\"katex-inline\">(b,a)=-3<\/span> 给出候选 <span class=\"katex-inline\">2-3=-1<\/span>，比已锁定的 <code>len(a)=1<\/code> 更短；但 <span class=\"katex-inline\">a<\/span> 已在 <span class=\"katex-inline\">X<\/span>，算法不回改，<code>len(a)<\/code> 保留错误值 1。\n<\/ol>\n<p><strong>定位失效步骤<\/strong>：证明下界环节假设剩余路段非负；本例 <span class=\"katex-inline\">b\\to a=-3<\/span> 使剩余段为负，<span class=\"katex-inline\">P<\/span> 总长可压到低于跨边得分，下界比较不再压住反设路径。锁定规则失去前提。<\/p>\n<p><strong>负环对照<\/strong>：若再加边使闭环总长为负，绕环递减，最短路径无下界；任何有限登记值都会被更长绕环推翻，问题本身无有限解。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：得分挂到顶点<\/strong>。把同一顶点多条入边的得分混成一个值，选错扩张边；复盘：得分定义在边上，选边后才登记头顶点。 <strong>案例 2：负权图套结论<\/strong>。引用 Dijkstra 正确性而不核边权符号；复盘：证明第 4 步依赖非负，含负权需另选可回改算法。 <strong>案例 3：未处理顶点临时值当最终值<\/strong>。把松弛中的临时 <code>len<\/code> 报成最短长度；复盘：只有入 <span class=\"katex-inline\">X<\/span> 后的值确定，未处理点仍可能被更新。 <strong>案例 4：忽略前驱只存长度<\/strong>。需要路线序列时无法回溯；复盘：松弛同时记 predecessor，结束后沿指针反向还原。 <strong>案例 5：并列得分随意换边后怀疑结果<\/strong>。同分时不同选择只影响前驱记录，不影响距离值；复盘：距离由上下界保证，与选边先后无关。<\/p>\n<h2>延伸推演：前缀最短性质<\/h2>\n<p>非负权图中，最短路径 <span class=\"katex-inline\">s\\to v<\/span> 的任一前缀 <span class=\"katex-inline\">s\\to u<\/span> 本身也是最短路径。反证：若存在更短的 <span class=\"katex-inline\">s\\to u<\/span> 路径，替换原前缀可得更短 <span class=\"katex-inline\">s\\to v<\/span> 路径，与原路径最短矛盾。这条性质是归纳步的支柱：已确定的 <span class=\"katex-inline\">v^*<\/span> 距离可信，经它扩展的候选才有上界意义。<\/p>\n<p>含负权时前缀最短仍可成立（前缀本身在其两端间最短），但剩余段可为负，破坏的是下界比较，不是前缀性质本身。区分两条性质有助于看清：Dijkstra 失效点在&quot;后续路段压低总长&quot;，不在前缀替换环节。<\/p>\n<h2>朴素实现与堆优化的代价位置<\/h2>\n<p><strong>朴素实现<\/strong>：每轮枚举所有跨边选最小，<span class=\"katex-inline\">n<\/span> 轮、<span class=\"katex-inline\">m<\/span> 条边候选各被反复比较，选边合计 <span class=\"katex-inline\">O(mn)<\/span>；松弛沿邻接表 <span class=\"katex-inline\">O(m+n)<\/span>。 <strong>堆优化方向<\/strong>：候选顶点及其得分存入优先队列，ExtractMin 取最低 <span class=\"katex-inline\">O(\\log n)<\/span>，松弛后下降更新 <span class=\"katex-inline\">O(\\log n)<\/span>；总时间 <span class=\"katex-inline\">O(m\\log n)<\/span>。堆的结构与操作见 c07，提速衔接见 c08。 <strong>代价分界<\/strong>：选边环节是朴素版瓶颈；边多时 <span class=\"katex-inline\">O(mn)<\/span> 与 <span class=\"katex-inline\">O(m\\log n)<\/span> 差距随 <span class=\"katex-inline\">n<\/span> 拉大。<\/p>\n<h2>常见错误清单<\/h2>\n<ol><li>\n把 BFS 层序规则搬进加权图，未换成得分比较。\n<\/li><li>\n忘记非负权前提，在负权示例上声称算法正确。\n<\/li><li>\n把边得分与顶点距离混为一个量。\n<\/li><li>\n入 <span class=\"katex-inline\">X<\/span> 后仍期待回改更新，与锁定规则冲突。\n<\/li><li>\n不可达顶点 <code>len<\/code> 误记 0，应为 <span class=\"katex-inline\">+\\infty<\/span>。\n<\/li><li>\n证明只写&quot;贪心天然正确&quot;，不走上界下界两条夹逼。\n<\/ol>\n<h2>差生通读检查<\/h2>\n<ul><li>\n<strong>卡在&quot;得分为什么按边不按顶点&quot;<\/strong>：一个未处理顶点可被多条已处理边指向，各边候选长度不同；按边选得分，才能比较所有通道。\n<\/li><li>\n<strong>卡在&quot;上界下界各防什么&quot;<\/strong>：上界防登记值报大（有真实路径支撑），下界防登记值报小（排除更短路径）；夹住才等于真实距离。\n<\/li><li>\n<strong>卡在&quot;非负权到底用在哪一步&quot;<\/strong>：用在反设路径剩余段 <span class=\"katex-inline\">R\\ge 0<\/span>；去掉它，<span class=\"katex-inline\">P<\/span> 总长可小于穿出边得分，下界断开。\n<\/li><li>\n<strong>卡在&quot;前缀最短怎么帮证明&quot;<\/strong>：已入 <span class=\"katex-inline\">X<\/span> 的 <span class=\"katex-inline\">v^*<\/span> 距离可信，经它扩展的候选才构成合法上界；前缀最短保证已确定部分不被替换推翻。\n<\/ul>\n<h2>证明边界追问：去掉各前提会怎样<\/h2>\n<p><strong>去掉非负权<\/strong>：反设路径剩余段可为负，<span class=\"katex-inline\">L(P)<\/span> 可低于穿出边得分；下界步骤 <span class=\"katex-inline\">L(P)\\ge \\mathrm{len}(x)+A_{xy}<\/span> 断开，反设路径不再被压住，登记值可能偏小或偏大。 <strong>去掉已处理集合可信前提<\/strong>：若 <span class=\"katex-inline\">v^*<\/span> 的距离本身未确定，经它扩展的候选不构成合法上界，归纳基例与递推同时失效。 <strong>把选边规则换成先到先得<\/strong>：不比较得分，扩张次序由发现顺序决定；加权图上先发现点未必代价最低，锁定后回改无门。 <strong>允许入 <span class=\"katex-inline\">X<\/span> 后回改<\/strong>：算法变成多轮松弛框架，正确性不再依赖贪心锁定；代价是迭代次数上升，对应含负权算法口径。<\/p>\n<h2>第二算例：等权时 Dijkstra 退化为 BFS<\/h2>\n<p>边权全 1 时，得分 <span class=\"katex-inline\">\\mathrm{len}(v)+1<\/span> 只由层号决定；得分最低即层号最小，选边等价于按层扩张。主循环纳入顶点的次序与 BFS 出队次序一致，登记值等于最少跳数。这条退化关系解释了本书注记&quot;所有边长为 1 时 Dijkstra 等同于 BFS&quot;：骨架相同，差别只在得分表达式。<\/p>\n<p><strong>对照数字<\/strong>：无权图 <span class=\"katex-inline\">s<\/span> 邻居 <span class=\"katex-inline\">a,b<\/span>，<span class=\"katex-inline\">a<\/span> 邻居 <span class=\"katex-inline\">c<\/span>。Dijkstra 轮 1 选 <span class=\"katex-inline\">a<\/span> 或 <span class=\"katex-inline\">b<\/span>（得分均 1），轮 2 纳入 <span class=\"katex-inline\">c<\/span>（得分 2）；层号结果 <span class=\"katex-inline\">d(s)=0,d(a)=d(b)=1,d(c)=2<\/span>，与 BFS 相同。<\/p>\n<h2>朴素实现逐轮代价核算<\/h2>\n<p>设 <span class=\"katex-inline\">n<\/span> 个顶点、<span class=\"katex-inline\">m<\/span> 条边。每轮：<\/p>\n<ol><li>\n枚举跨边：最坏扫全部 <span class=\"katex-inline\">m<\/span> 条边；\n<\/li><li>\n比较得分取最小；\n<\/li><li>\n松弛新顶点邻居。\n<p>共 <span class=\"katex-inline\">n<\/span> 轮，选边比较合计 <span class=\"katex-inline\">O(mn)<\/span>；邻居松弛合计 <span class=\"katex-inline\">O(m+n)<\/span>。整体 <span class=\"katex-inline\">O(mn)<\/span>。<\/p>\n<\/ol>\n<p>堆优化把步骤 1、2 换成优先队列：ExtractMin 取最低候选 <span class=\"katex-inline\">O(\\log n)<\/span>，松弛下降 <span class=\"katex-inline\">O(\\log n)<\/span>；<span class=\"katex-inline\">m<\/span> 次松弛加 <span class=\"katex-inline\">n<\/span> 次抽取，总 <span class=\"katex-inline\">O(m\\log n)<\/span>。瓶颈从选边扫描转为堆操作，堆结构见 c07，衔接见 c08。<\/p>\n<h2>前驱指针与路径还原<\/h2>\n<p>每次松弛成功（含主循环纳入顶点）记 predecessor(<span class=\"katex-inline\">w<\/span>)=<span class=\"katex-inline\">v<\/span>。算法结束后，求 <span class=\"katex-inline\">s\\to x<\/span> 路径：从 <span class=\"katex-inline\">x<\/span> 沿 predecessor 走到 <span class=\"katex-inline\">s<\/span>，得到反向序列，反转即路径。等长路径可能有多条，前驱记录哪条取决于选边次序；长度结论不受影响。<\/p>\n<p>若只需最短长度，前驱字段可省；需要路线、导航转向提示或任务链顺序时，前驱是必备存储。<\/p>\n<h2>常见错误清单（补充）<\/h2>\n<ol><li>\n证明跳过下界，只写&quot;贪心选出最近点&quot;。\n<\/li><li>\n把得分写成顶点距离，漏掉边权 <span class=\"katex-inline\">A_{vw}<\/span> 项。\n<\/li><li>\n负权示例上未标注前提失效。\n<\/li><li>\n未处理顶点临时值被当成最终值汇报。\n<\/li><li>\n不可达顶点与起点自身的 0 混淆。\n<\/li><li>\n并列选边后怀疑距离结果；并列只影响前驱，不影响长度。\n<\/li><li>\n朴素版与堆版代价混写：选边环节量级不同，不能一概而论 <span class=\"katex-inline\">O(m\\log n)<\/span>。\n<\/ol>\n<h2>完整迭代表：五顶点小图<\/h2>\n<p>边权：<span class=\"katex-inline\">s\\to a=2<\/span>，<span class=\"katex-inline\">s\\to b=5<\/span>，<span class=\"katex-inline\">a\\to b=1<\/span>，<span class=\"katex-inline\">a\\to c=4<\/span>，<span class=\"katex-inline\">b\\to c=2<\/span>，<span class=\"katex-inline\">c\\to t=3<\/span>。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>轮次<\/th><th><span class=\"katex-inline\">X<\/span><\/th><th>候选跨边与得分<\/th><th>选中边<\/th><th>登记值<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><span class=\"katex-inline\">\\{s\\}<\/span><\/td><td><span class=\"katex-inline\">(s,a):2<\/span>，<span class=\"katex-inline\">(s,b):5<\/span><\/td><td><span class=\"katex-inline\">(s,a)<\/span><\/td><td><code>len(a)=2<\/code><\/td><\/tr><tr><td>2<\/td><td><span class=\"katex-inline\">\\{s,a\\}<\/span><\/td><td><span class=\"katex-inline\">(s,b):5<\/span>，<span class=\"katex-inline\">(a,b):3<\/span>，<span class=\"katex-inline\">(a,c):6<\/span><\/td><td><span class=\"katex-inline\">(a,b)<\/span><\/td><td><code>len(b)=3<\/code><\/td><\/tr><tr><td>3<\/td><td><span class=\"katex-inline\">\\{s,a,b\\}<\/span><\/td><td><span class=\"katex-inline\">(a,c):6<\/span>，<span class=\"katex-inline\">(b,c):5<\/span><\/td><td><span class=\"katex-inline\">(b,c)<\/span><\/td><td><code>len(c)=5<\/code><\/td><\/tr><tr><td>4<\/td><td><span class=\"katex-inline\">\\{s,a,b,c\\}<\/span><\/td><td><span class=\"katex-inline\">(c,t):8<\/span><\/td><td><span class=\"katex-inline\">(c,t)<\/span><\/td><td><code>len(t)=8<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>核验最短长度：<span class=\"katex-inline\">s\\to t<\/span> 经 <span class=\"katex-inline\">a,b,c<\/span> 长 <span class=\"katex-inline\">2+1+2+3=8<\/span>；其余候选 <span class=\"katex-inline\">s\\to a\\to c\\to t<\/span> 长 <span class=\"katex-inline\">2+4+3=9<\/span>。登记值 8 与最短一致。<\/p>\n<p><strong>前驱回溯<\/strong>：<span class=\"katex-inline\">t\\leftarrow c\\leftarrow b\\leftarrow a\\leftarrow s<\/span>，路径序列 <span class=\"katex-inline\">s,a,b,c,t<\/span>。<\/p>\n<h2>证明环节对照图<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>证明步骤<\/th><th>作用<\/th><th>依赖的前提<\/th><\/tr><\/thead><tbody><tr><td>基例 <code>len(s)=0<\/code><\/td><td>归纳起点<\/td><td>起点到自身空路径长 0<\/td><\/tr><tr><td>上界 <span class=\"katex-inline\">\\mathrm{dist}\\le\\mathrm{len}<\/span><\/td><td>登记值有真实路径支撑<\/td><td>已确定顶点距离可信（前缀最短）<\/td><\/tr><tr><td>穿出边 <span class=\"katex-inline\">(x,y)<\/span><\/td><td>反设路径与 <span class=\"katex-inline\">X<\/span> 的交界<\/td><td>路径从 <span class=\"katex-inline\">X<\/span> 内到 <span class=\"katex-inline\">X<\/span> 外<\/td><\/tr><tr><td>得分比较<\/td><td>选中边得分不高于穿出边<\/td><td>贪心选择规则<\/td><\/tr><tr><td>剩余段 <span class=\"katex-inline\">R\\ge 0<\/span><\/td><td>压住反设路径总长<\/td><td>边长非负<\/td><\/tr><tr><td>相合<\/td><td>上下界夹定距离<\/td><td>以上各步同时成立<\/td><\/tr><\/tbody><\/table><\/div>\n<p>读证明时按这张表定位：哪一步被质疑，就回到对应前提检查。非负权只出现在剩余段一行，其余步骤是通用集合扩张逻辑。<\/p>\n<h2>与 BFS 证明的结构对应<\/h2>\n<p>BFS 距离证明（c02 深度）：上界由入队路径给出，下界由更短路径反推矛盾。Dijkstra 证明骨架相同，两处替换：<\/p>\n<ol><li>\n递推 <span class=\"katex-inline\">+1<\/span> 换成 <span class=\"katex-inline\">+A_{vw}<\/span>；\n<\/li><li>\n层序次序换成得分次序。\n<p>BFS 下界依赖层号先到先得，Dijkstra 下界依赖非负权压住剩余段。理解对应关系后，两种证明可以对照复习，不必当作两套无关逻辑。<\/p>\n<\/ol>\n<h2>实现细节备忘<\/h2>\n<ul><li>\n邻接列表输入：每个顶点的出边挂邻居与权值；松弛沿列表走。\n<\/li><li>\n距离初始化：<code>len(s)=0<\/code>，其余 <span class=\"katex-inline\">+\\infty<\/span>；<span class=\"katex-inline\">+\\infty<\/span> 用大于任意可行路径长度的占位值。\n<\/li><li>\n终止条件：无跨集合边；剩余顶点不可达，不强行纳入。\n<\/li><li>\n并列得分：任选其一，距离值不变；前驱记录随选择而定。\n<\/li><li>\n算法不检测负环：负环场景需另配检测步骤，不能由 Dijkstra 输出反推。\n<\/ul>\n<p>这些备忘对应伪码各行职责；写实现时先分清初始化、选边、纳入、松弛四个环节，再补具体数据结构。<\/p>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出 Dijkstra 主循环四步，说明跨集合边的两端归属。\n<\/li><li>\n对选中边 <span class=\"katex-inline\">(v^<em>,w^<\/em>)<\/span> 分别给出上界与下界证明依据，指出非负权出现在哪一步。\n<\/li><li>\n含一条负权边的图上，Dijkstra 锁定哪个顶点后可能漏掉更短路径？用数字说明。\n<\/li><li>\n为什么并列得分不影响最终 <code>len<\/code> 值？\n<\/li><li>\n朴素实现选边代价是多少量级？堆优化替换了哪个环节？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "Dijkstra 算法：贪心选择不变量与非负权正确性"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：算法详解 卷2 图算法和数据结构.pdf · p.108<\/div><h1>堆的堆序不变量、数组表示与 Insert/ExtractMin<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch03（原书 §4.2、§4.5，PDF 第 108、124–113 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>堆是一棵满足堆序不变量的完全二叉树：每个节点的键不大于其两个子节点的键，根节点即全堆最小；它用数组存储，父子位置由 <span class=\"katex-inline\">\\lfloor i/2\\rfloor<\/span>、<span class=\"katex-inline\">2i<\/span>、<span class=\"katex-inline\">2i+1<\/span> 确定，Insert 在末尾加入后向上冒泡恢复堆序，ExtractMin 把根与末尾节点交换后向下下沉，两类操作均 <span class=\"katex-inline\">O(\\log n)<\/span>。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>程序常需要维护一个动态键集合，反复取走最小值：排序时逐个输出最小键，事件管理按时间先后处理，最短路径每轮取候选代价最低的顶点。普通数组取最小要遍历全表 <span class=\"katex-inline\">O(n)<\/span>，有序数组插入要搬动元素 <span class=\"katex-inline\">O(n)<\/span>；二叉搜索树能维护有序但节点需额外存指针。堆在&quot;快速取最小&quot;与&quot;紧凑存储&quot;之间折中：只保极值、不保全局有序，用完全二叉树形状加堆序不变量支撑两类高效操作。<\/p>\n<p>不立不变量会出两类错。一是形状与次序混管：插入删除后既要保持树完全，又要恢复父不大于子，两套约束分开处理才不乱。二是下沉方向选错：父键大于子键时与较大子键交换，换完仍可能大于另一子树，堆序继续被破坏。本概念把堆的结构约束、数组映射与两个核心操作的恢复过程讲清。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>堆序不变量<\/strong>：对每个非叶节点 <span class=\"katex-inline\">i<\/span>，其键 <span class=\"katex-inline\">\\mathrm{key}(i)\\le \\mathrm{key}(\\text{左子})<\/span> 且 <span class=\"katex-inline\">\\mathrm{key}(i)\\le \\mathrm{key}(\\text{右子})<\/span>。推论：根节点键是全堆最小。<\/p>\n<p><strong>完全二叉树形状<\/strong>：节点按层填充，最末层从左到右不留空缺；形状保证数组下标映射确定，不需存子树指针。<\/p>\n<p><strong>数组表示<\/strong>：位置 <span class=\"katex-inline\">1,2,\\dots,n<\/span> 存堆节点；位置 1 为根。父子关系：<\/p>\n<ul><li>\n父节点：<span class=\"katex-inline\">i\\ge 2<\/span> 时在 <span class=\"katex-inline\">\\lfloor i/2\\rfloor<\/span>；\n<\/li><li>\n左子节点：<span class=\"katex-inline\">2i<\/span>（前提 <span class=\"katex-inline\">2i\\le n<\/span>）；\n<\/li><li>\n右子节点：<span class=\"katex-inline\">2i+1<\/span>（前提 <span class=\"katex-inline\">2i+1\\le n<\/span>）。\n<\/ul>\n<p><strong>Insert(<span class=\"katex-inline\">x<\/span>)<\/strong>：把 <span class=\"katex-inline\">x<\/span> 放到数组末尾保持完全性；若新键小于父键，交换父子，向上重复直到堆序满足或到达根。这条恢复路径称向上冒泡（bubble-up / sift-up）。<\/p>\n<p><strong>ExtractMin<\/strong>：返回根键；把末尾节点移到根位置，节点数减 1；若父键大于某子键，与较小子键交换，向下重复直到堆序满足。这条路径称向下下沉（sift-down）。<\/p>\n<p><strong>其他操作<\/strong>：Heapify 把一组键建成堆；Delete 删除指定节点；堆排序反复 ExtractMin 输出有序序列。<\/p>\n<p><strong>正例<\/strong>：数组 <span class=\"katex-inline\">[2,5,3,9,6,7,8]<\/span>。父子对：<span class=\"katex-inline\">2\\le 5,2\\le 3<\/span>；<span class=\"katex-inline\">5\\le 9,5\\le 6<\/span>；<span class=\"katex-inline\">3\\le 8<\/span>，堆序成立，根 2 最小。<\/p>\n<p><strong>反例<\/strong>：数组 <span class=\"katex-inline\">[8,5,3,9,6,7]<\/span>，根 8 大于子 5 与 3，堆序破坏；若下沉时与 5 交换，8 到位置 2 后仍可能大于其右子，正确做法是与较小子键 3 交换。<\/p>\n<h2>原理推导：操作代价与不变量恢复<\/h2>\n<ol><li>\n<strong>高度量级<\/strong>：<span class=\"katex-inline\">n<\/span> 个节点的完全二叉树高度 <span class=\"katex-inline\">h=\\lceil\\log_2(n+1)\\rceil<\/span>，任意根到叶路径长度不超过 <span class=\"katex-inline\">h<\/span>。\n<\/li><li>\n<strong>Insert 代价<\/strong>：新节点沿父链向上，每步一次交换，路径长度 <span class=\"katex-inline\">\\le h<\/span>；时间 <span class=\"katex-inline\">O(\\log n)<\/span>。完全性由&quot;末尾追加&quot;一步保住，堆序由冒泡恢复。\n<\/li><li>\n<strong>ExtractMin 代价<\/strong>：根补位后沿子链向下，每步一次交换，路径长度 <span class=\"katex-inline\">\\le h<\/span>；时间 <span class=\"katex-inline\">O(\\log n)<\/span>。完全性由删末尾节点保住，堆序由下沉恢复。\n<\/li><li>\n<strong>下沉选较小子键的依据<\/strong>：父键大于两子键时，需换到一个不大于该子树最小值的位置；与较小子键交换后，父键不超过该子树根，另一子树仍保持原堆序。若与较大子键交换，父键可能压在较小子树之上，破坏继续。\n<\/li><li>\n<strong>建堆代价<\/strong>：逐个 Insert 建堆 <span class=\"katex-inline\">O(n\\log n)<\/span>；自底向上逐个下沉可做到 <span class=\"katex-inline\">O(n)<\/span>（Heapify）。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：动态集合需要快速取最小；元素可比较大小；不要求按键序遍历全部元素。\n<\/li><li>\n边界 1：堆不维护全局有序；中序遍历不给出有序序列，需要范围查询或前驱后继应选搜索树（c09）。\n<\/li><li>\n边界 2：堆顶是最小键，兄弟节点之间无大小约束；不能据左兄弟判断右兄弟次序。\n<\/li><li>\n边界 3：数组下标从 1 起算；从 0 起算时下标公式整体偏移，实现时需统一口径。\n<\/li><li>\n失败案例：插入后只加末尾不冒泡，堆序在新节点与父之间被破坏，后续 ExtractMin 取不到真最小。\n<\/li><li>\n失败案例：下沉与较大子键交换，父键落入仍不满足堆序的分支，需要多轮修补甚至留下隐患。\n<\/li><li>\n失败案例：把堆当排序数组使用，期待按下标直接读出第 <span class=\"katex-inline\">k<\/span> 小；堆只保证根最小，第 <span class=\"katex-inline\">k<\/span> 小需反复抽取。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>堆 vs 二叉搜索树<\/strong>：堆只要求父不大于子，兄弟无序；BST 要求左小右大并维护整体有序。堆取极值快，BST 支持范围与前驱查询。\n<\/li><li>\n<strong>堆序 vs 树序<\/strong>：堆序是父子间的局部约束；树序（中序有序）是全局次序约束，堆不满足后者。\n<\/li><li>\n<strong>向上冒泡 vs 向下下沉<\/strong>：冒泡处理新节点过小（低于父），自底向上；下沉处理补位节点过大（高于子），自顶向下。触发方向相反，恢复路径相反。\n<\/li><li>\n<strong>最小堆 vs 最大堆<\/strong>：本书讨论最小堆（父不大于子，根最小）；最大堆把约束反向，根为最大，操作对称。\n<\/ul>\n<h2>一个操作演示<\/h2>\n<p>堆数组 <span class=\"katex-inline\">[3,5,4,8,6,7]<\/span>。插入键 2：末尾到位置 7，父位置 3 键 4，<span class=\"katex-inline\">2&lt;4<\/span> 交换；再父位置 1 键 3，<span class=\"katex-inline\">2&lt;3<\/span> 交换，得 <span class=\"katex-inline\">[2,5,3,8,6,7,4]<\/span>，两次冒泡。ExtractMin 取根 2，末尾 4 补到根，与较小子键 3 交换，下沉到位置 3，核验父子对全部满足父不大于子。<\/p>\n<h2>常见误判<\/h2>\n<ul><li>\n误判：堆是有序数组。堆只保证根最小，兄弟与跨层节点之间无序；读出全序要反复抽取。\n<\/li><li>\n误判：堆高一定是 <span class=\"katex-inline\">\\log_2 n<\/span>。高度为 <span class=\"katex-inline\">\\lceil\\log_2(n+1)\\rceil<\/span> 量级，最末层可能未满，路径长度不超过该上界。\n<\/li><li>\n误判：插入只需追加。追加只保形状，堆序要靠冒泡恢复；缺了冒泡根不再保证最小。\n<\/li><li>\n误判：最大堆与最小堆操作不同。两者约束方向相反，冒泡下沉流程对称，交换规则一致。\n<\/ul>\n<h2>堆的两类不变量备忘<\/h2>\n<p>次序不变量是父不大于子，约束每对父子；形状不变量是完全二叉树，保证下标映射紧凑。插入先保形状再修次序，抽取先保形状再修次序；两条 invariant 分开恢复，不混在同一动作里。违反次序时根不再最小，违反形状时下标映射错位。<\/p>\n<h2>联系<\/h2>\n<p>前置：无前置数据结构概念；可比较键是基本假设。后继：c08 用堆实现 Dijkstra 的优先队列，把取最低候选与松弛更新交给堆操作；堆的&quot;极值优先&quot;模式在排序、事件队列、中位值维护中复用。第 5 章搜索树与堆对照阅读：两类树形结构服务不同查询。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（堆的堆序不变量、数组表示与 Insert/ExtractMin）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：堆序不变量、下标映射与两类操作的逐步推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要讲清堆结构，往回追四层：<\/p>\n<ol><li>\n<strong>可比较键<\/strong>：元素之间能定大小，堆序约束才有比较对象。\n<\/li><li>\n<strong>树形层次<\/strong>：父子关系定义局部次序约束；完全二叉树形状确定下标映射。\n<\/li><li>\n<strong>不变量拆分<\/strong>：完全性（形状）与堆序（次序）分开维护；插入删除先保形状，再恢复次序。\n<\/li><li>\n<strong>操作路径<\/strong>：冒泡沿父链向上，下沉沿子链向下；路径长度由树高决定，代价 <span class=\"katex-inline\">O(\\log n)<\/span>。\n<\/ol>\n<p>依赖链方向：键可比较 → 树形父子约束 → 形状与次序双不变量 → 冒泡/下沉恢复 → 操作代价。<\/p>\n<h2>正向推导：数组下标与父子关系<\/h2>\n<p><strong>步骤 1：按层映射<\/strong>。完全二叉树根在位置 1；第二层左右孩子在 2、3；第三层在 4、5、6、7；逐层填充。位置 <span class=\"katex-inline\">i<\/span> 的左子为 <span class=\"katex-inline\">2i<\/span>，右子为 <span class=\"katex-inline\">2i+1<\/span>。 <strong>步骤 2：反推父节点<\/strong>。位置 <span class=\"katex-inline\">i<\/span> 来自父链：偶数 <span class=\"katex-inline\">i=2p<\/span> 为左子，奇数 <span class=\"katex-inline\">i=2p+1<\/span> 为右子；统一父位置 <span class=\"katex-inline\">p=\\lfloor i/2\\rfloor<\/span>。例：<span class=\"katex-inline\">i=9<\/span>，<span class=\"katex-inline\">\\lfloor 9/2\\rfloor=4<\/span>；<span class=\"katex-inline\">i=8<\/span>，<span class=\"katex-inline\">\\lfloor 8/2\\rfloor=4<\/span>。 <strong>步骤 3：边界条件<\/strong>：子位置超出 <span class=\"katex-inline\">n<\/span> 表示该子不存在；<span class=\"katex-inline\">i=1<\/span> 无父节点。 <strong>步骤 4：空间开销<\/strong>：数组 <span class=\"katex-inline\">n<\/span> 个位置存 <span class=\"katex-inline\">n<\/span> 个节点，无额外子树指针；对照普通二叉树每节点两个指针，堆的紧凑性来自完全形状。 <strong>步骤 5：高度核算<\/strong>：<span class=\"katex-inline\">n<\/span> 个节点完全二叉树高度 <span class=\"katex-inline\">h=\\lceil\\log_2(n+1)\\rceil<\/span>；最右路径与最左路径长度差不超过 1，任意路径不超过 <span class=\"katex-inline\">h<\/span>。<\/p>\n<h2>正向推导二：Insert 恢复过程<\/h2>\n<p><strong>步骤 1：保形状<\/strong>。新键 <span class=\"katex-inline\">x<\/span> 放末尾位置 <span class=\"katex-inline\">n+1<\/span>，树仍完全。 <strong>步骤 2：查堆序<\/strong>。取父位置 <span class=\"katex-inline\">p=\\lfloor i/2\\rfloor<\/span>；若 <span class=\"katex-inline\">\\mathrm{key}(x)&lt;\\mathrm{key}(p)<\/span>，父子违反堆序。 <strong>步骤 3：向上交换<\/strong>。交换 <span class=\"katex-inline\">x<\/span> 与父键，<span class=\"katex-inline\">x<\/span> 到达 <span class=\"katex-inline\">p<\/span>；重复步骤 2，直到父键不大于 <span class=\"katex-inline\">x<\/span> 或 <span class=\"katex-inline\">x<\/span> 到根。 <strong>步骤 4：不变量闭合<\/strong>。交换只影响父子两节点；路径之外父子对未动。到达停止点后，沿途父子对全部满足父不大于子，堆序恢复。 <strong>步骤 5：代价<\/strong>。每步一次比较加一次交换，步数 <span class=\"katex-inline\">\\le h=O(\\log n)<\/span>。<\/p>\n<h2>数值算例一：Insert 冒泡推演<\/h2>\n<p>原堆数组 <span class=\"katex-inline\">[4,6,5,9,7,8]<\/span>，键集 <span class=\"katex-inline\">\\{4,5,6,7,8,9\\}<\/span>。插入新键 2。<\/p>\n<ol><li>\n末尾追加位置 7：数组 <span class=\"katex-inline\">[4,6,5,9,7,8,2]<\/span>。\n<\/li><li>\n父位置 <span class=\"katex-inline\">\\lfloor 7/2\\rfloor=3<\/span>，键 5；<span class=\"katex-inline\">2&lt;5<\/span>，交换。数组 <span class=\"katex-inline\">[4,6,2,9,7,8,5]<\/span>，新键到位置 3。\n<\/li><li>\n父位置 <span class=\"katex-inline\">\\lfloor 3/2\\rfloor=1<\/span>，键 4；<span class=\"katex-inline\">2&lt;4<\/span>，交换。数组 <span class=\"katex-inline\">[2,6,4,9,7,8,5]<\/span>，新键到位置 1（根）。\n<\/li><li>\n到根停止。核验父子对：<span class=\"katex-inline\">2\\le 6,2\\le 4<\/span>；<span class=\"katex-inline\">6\\le 9,6\\le 7<\/span>；<span class=\"katex-inline\">4\\le 8<\/span>，全部满足。冒泡两次交换。\n<\/ol>\n<p><strong>对照插入较大键<\/strong>：若插入键 10，末尾追加后父键 5 不大于 10，一次比较即停，无交换；堆序本已满足。<\/p>\n<h2>数值算例二：ExtractMin 下沉推演<\/h2>\n<p>承上例恢复后堆 <span class=\"katex-inline\">[2,6,4,9,7,8,5]<\/span>，执行 ExtractMin。<\/p>\n<ol><li>\n取根键 2 作为返回值；末尾键 5 移到根，节点数变 6，暂为 <span class=\"katex-inline\">[5,6,4,9,7,8]<\/span>。\n<\/li><li>\n根子节点位置 2（键 6）、位置 3（键 4）；父 5 大于两子。较小子键为 4（位置 3），与 5 交换：<span class=\"katex-inline\">[4,6,5,9,7,8]<\/span>，5 到位置 3。\n<\/li><li>\n位置 3 子节点位置 6（键 8）；<span class=\"katex-inline\">5\\le 8<\/span>，方向满足，停止下沉。\n<\/li><li>\n核验：<span class=\"katex-inline\">4\\le 6,4\\le 5<\/span>；<span class=\"katex-inline\">6\\le 9,6\\le 7<\/span>；<span class=\"katex-inline\">5\\le 8<\/span>，堆序成立。返回最小值 2。\n<\/ol>\n<p><strong>错误路径对照<\/strong>：第 2 步若与较大子键 6 交换，5 到位置 2；其右子位置 5 键 7，<span class=\"katex-inline\">5\\le 7<\/span> 暂满足，但位置 2 左子 9 仍大于 5，需要继续下沉；选错子键增加修补轮次，正确规则是与较小子键交换。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：只追加不冒泡<\/strong>。新小键留在末尾，其父链堆序违反；下一次 ExtractMin 根可能不是最小。复盘：插入末尾后必须走完冒泡到停止点。 <strong>案例 2：下沉选较大子键<\/strong>。父键落入较小子树一侧，继续违反堆序；复盘：比较两子键，选较小者交换。 <strong>案例 3：破坏完全性<\/strong>。删除时直接留空中间节点，数组下标映射错位；复盘：删除一律补末尾节点，再下沉。 <strong>案例 4：下标口径混用<\/strong>。数组 0 起算仍套 <span class=\"katex-inline\">2i<\/span> 公式，父子错位；复盘：实现前确定起算点，公式统一换算。 <strong>案例 5：期待堆输出有序序列<\/strong>。反复 ExtractMin 才得有序；单次遍历堆数组不是有序序列。<\/p>\n<h2>延伸推演：建堆与堆排序<\/h2>\n<p><strong>逐个插入建堆<\/strong>：<span class=\"katex-inline\">n<\/span> 次 Insert，每次 <span class=\"katex-inline\">O(\\log n)<\/span>，合计 <span class=\"katex-inline\">O(n\\log n)<\/span>。 <strong>自底向上 Heapify<\/strong>：从最末一个非叶节点 <span class=\"katex-inline\">\\lfloor n/2\\rfloor<\/span> 向前，逐个对节点做下沉；每个节点下沉代价按子树高度分摊，合计 <span class=\"katex-inline\">O(n)<\/span>。 <strong>堆排序<\/strong>：建堆后反复 ExtractMin，第 <span class=\"katex-inline\">i<\/span> 次输出第 <span class=\"katex-inline\">i<\/span> 小；<span class=\"katex-inline\">n<\/span> 次抽取各 <span class=\"katex-inline\">O(\\log n)<\/span>，总时间 <span class=\"katex-inline\">O(n\\log n)<\/span>，原地额外空间 <span class=\"katex-inline\">O(1)<\/span>。 <strong>对照<\/strong>：堆排序不保证稳定（相等键的相对次序可能被交换改变）；需要稳定排序另选算法。<\/p>\n<h2>堆操作与优先队列对应<\/h2>\n<p>优先队列的抽象操作：<\/p>\n<ul><li>\nInsert(键)：入队；\n<\/li><li>\nExtractMin：出队代价最小元素；\n<\/li><li>\n（可选）DecreaseKey：已入队元素键值降低，向上冒泡；\n<\/li><li>\n（可选）Delete：删指定节点，补末尾后双向恢复。\n<\/ul>\n<p>c08 的 Dijkstra 提速用到 Insert、ExtractMin 与 DecreaseKey；堆是优先队列的紧凑实现，操作语义与上述一一对应。<\/p>\n<h2>伪码对照<\/h2>\n<pre class=\"lang-text\"><code>Insert(H, x):\n  n := n + 1, H[n] := x\n  i := n\n  while i &gt; 1 and H[i] &lt; H[parent(i)]:\n    swap H[i], H[parent(i)]\n    i := parent(i)\n\nExtractMin(H):\n  ans := H[1]\n  H[1] := H[n], n := n - 1\n  i := 1\n  while true:\n    j := smaller-child(i)\n    if H[i] &lt;= H[j]: break\n    swap H[i], H[j]\n    i := j\n  return ans<\/code><\/pre>\n<p>核查点：Insert 循环条件同时查根边界与堆序；ExtractMin 的 <span class=\"katex-inline\">j<\/span> 取较小子键；节点数 <span class=\"katex-inline\">n<\/span> 在补位后先减 1，再判断子节点是否存在。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n<strong>卡在&quot;父子下标怎么推&quot;<\/strong>：左子 <span class=\"katex-inline\">2i<\/span>、右子 <span class=\"katex-inline\">2i+1<\/span> 来自按层填充；父 <span class=\"katex-inline\">\\lfloor i/2\\rfloor<\/span> 是反推。拿位置 6、7 各算一次父节点核对。\n<\/li><li>\n<strong>卡在&quot;冒泡和下沉方向为何相反&quot;<\/strong>：新键过小要往上找更小的父；补位键过大要往下找更大的子。触发破坏点不同，恢复路径相反。\n<\/li><li>\n<strong>卡在&quot;为什么选较小子键&quot;<\/strong>：父键只需压过子树根；选较小子树交换，保证父键不超过该子树根，另一子树原状不动。\n<\/li><li>\n<strong>卡在&quot;堆为什么不能给有序遍历&quot;<\/strong>：堆约束只在父子间，兄弟无次序；全局有序需要 BST 的左小右大约束。\n<\/ul>\n<h2>不变量破坏与恢复对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>动作<\/th><th>先破坏的约束<\/th><th>恢复手段<\/th><th>恢复路径<\/th><\/tr><\/thead><tbody><tr><td>Insert 末尾追加<\/td><td>堆序（新键可能小于父）<\/td><td>向上冒泡<\/td><td>自底向上沿父链<\/td><\/tr><tr><td>ExtractMin 补根<\/td><td>堆序（补位键可能大于子）<\/td><td>向下下沉<\/td><td>自顶向下沿子链<\/td><\/tr><tr><td>Delete 中间节点<\/td><td>完全性与堆序<\/td><td>补末尾节点，再冒泡或下沉<\/td><td>视补位键大小选方向<\/td><\/tr><tr><td>Heapify 建堆<\/td><td>全树堆序<\/td><td>自底向上逐节点下沉<\/td><td>后序逆层序<\/td><\/tr><\/tbody><\/table><\/div>\n<p>对照要点：形状约束只在删除环节需要专门保，次序约束由冒泡下沉恢复；两类 invariant 不混在同一动作里处理。<\/p>\n<h2>数字核算：堆高与操作步数<\/h2>\n<p>取 <span class=\"katex-inline\">n=15<\/span>：完全二叉树四层，<span class=\"katex-inline\">h=4<\/span>；Insert 最多交换 3 次，ExtractMin 最多下沉 3 次。<span class=\"katex-inline\">n=16<\/span>：<span class=\"katex-inline\">h=\\lceil\\log_2 17\\rceil=5<\/span>。一般地，路径步数不超过 <span class=\"katex-inline\">\\lceil\\log_2 n\\rceil<\/span>。<\/p>\n<p>建堆代价对照：<\/p>\n<ul><li>\n逐个 Insert：<span class=\"katex-inline\">n<\/span> 次 × <span class=\"katex-inline\">O(\\log n)<\/span> = <span class=\"katex-inline\">O(n\\log n)<\/span>；\n<\/li><li>\n自底向上下沉：各节点下沉代价按子树高度累加，底层节点不下沉，上层节点路径短，总和 <span class=\"katex-inline\">O(n)<\/span>。\n<\/ul>\n<p>堆排序总代价：<span class=\"katex-inline\">O(n)<\/span> 建堆加 <span class=\"katex-inline\">n<\/span> 次 ExtractMin × <span class=\"katex-inline\">O(\\log n)<\/span>，合计 <span class=\"katex-inline\">O(n\\log n)<\/span>，原地空间 <span class=\"katex-inline\">O(1)<\/span>。<\/p>\n<h2>应用场景展开<\/h2>\n<ol><li>\n<strong>排序<\/strong>：堆排序反复抽取最小；适合空间受限、不要求稳定的场合。\n<\/li><li>\n<strong>事件管理器<\/strong>：事件按时间键入堆，ExtractMin 取下一时刻事件；插入新事件与到期处理交替进行。\n<\/li><li>\n<strong>中位值维护<\/strong>：两个堆分持较小一半与较大一半，小顶堆与大顶堆配合，堆顶即中位附近元素。\n<\/li><li>\n<strong>最短路径候选<\/strong>：Dijkstra 每轮取代价最低顶点，堆作为优先队列（c08 展开）。\n<\/li><li>\n<strong>批量取前 <span class=\"katex-inline\">k<\/span> 小<\/strong>：维护大小 <span class=\"katex-inline\">k<\/span> 的堆流处理，避免全排序。\n<\/ol>\n<p>场景边界：堆回答&quot;下一个最小/最大&quot;；要按键序遍历、找前驱后继、做范围切片，堆不支持，转 c09 搜索树。<\/p>\n<h2>下标实现备忘<\/h2>\n<ul><li>\n起算口径：本书位置 1 起算；代码若 0 起算，左子 <span class=\"katex-inline\">2i+1<\/span>、右子 <span class=\"katex-inline\">2i+2<\/span>、父 <span class=\"katex-inline\">\\lfloor(i-1)/2\\rfloor<\/span>。\n<\/li><li>\n子节点存在性：<span class=\"katex-inline\">2i\\le n<\/span>、<span class=\"katex-inline\">2i+1\\le n<\/span> 判断后再访问。\n<\/li><li>\n键比较：最小堆父 <span class=\"katex-inline\">\\le<\/span> 子；最大堆父 <span class=\"katex-inline\">\\ge<\/span> 子，方向在初始化时固定。\n<\/li><li>\n重复键：允许父子相等；相等不触发交换，堆序 <span class=\"katex-inline\">\\le<\/span> 包含等值。\n<\/ul>\n<h2>与其他树形结构的边界<\/h2>\n<ul><li>\n普通二叉树：无次序约束，遍历需存指针；堆借完全形状省指针。\n<\/li><li>\nBST：左小右大全局有序，支持 Search、前驱、范围；堆只保极值。\n<\/li><li>\n堆：父不大于子局部约束，取根 <span class=\"katex-inline\">O(1)<\/span>，插入抽取 <span class=\"katex-inline\">O(\\log n)<\/span>。\n<\/ul>\n<p>三种结构按查询需求选：频繁取极值选堆，频繁有序查询选 BST，只存遍历选普通二叉树。<\/p>\n<h2>堆序不变量的两条独立含义<\/h2>\n<p><strong>次序不变量<\/strong>：父键不大于子键。约束范围是每对父子，不涉及兄弟与跨层；推论只有根最小。 <strong>形状不变量<\/strong>：完全二叉树，节点按层从左到右填满。约束下标映射与空间紧凑性。<\/p>\n<p>两条 invariant 在操作中分开恢复：Insert 先保形状（末尾追加）再修次序（冒泡）；ExtractMin 先保形状（删末尾补根）再修次序（下沉）。把两条混在一个步骤里，容易出现形状有空缺或次序漏修补。<\/p>\n<p><strong>违反次序的表现<\/strong>：根不是最小；抽取极值错误。 <strong>违反形状的表现<\/strong>：下标映射错位，子节点位置指向空槽或错误节点；指针式实现则空间开销上升。<\/p>\n<h2>父子关系小算例<\/h2>\n<p><span class=\"katex-inline\">n=10<\/span> 的堆，位置对应关系：<\/p>\n<ul><li>\n位置 1 子节点 2、3；父无。\n<\/li><li>\n位置 4 子节点 8、9；父 2。\n<\/li><li>\n位置 5 子节点 10、11（11 超 <span class=\"katex-inline\">n<\/span> 不存在）；父 2。\n<\/li><li>\n位置 10 父 5；无子女。\n<\/ul>\n<p>反推练习：位置 7 的父 <span class=\"katex-inline\">\\lfloor 7/2\\rfloor=3<\/span>；位置 6 的父 <span class=\"katex-inline\">\\lfloor 6/2\\rfloor=3<\/span>；位置 3 的父 1。左子右子由奇偶区分：偶数为左子，奇数为右子。<\/p>\n<h2>与优先队列操作的对应备忘<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>堆操作<\/th><th>优先队列动作<\/th><th>恢复路径<\/th><\/tr><\/thead><tbody><tr><td>Insert<\/td><td>入队新元素<\/td><td>末尾追加后冒泡<\/td><\/tr><tr><td>ExtractMin<\/td><td>出队最小元素<\/td><td>末尾补根后下沉<\/td><\/tr><tr><td>DecreaseKey<\/td><td>降低已入队元素键值<\/td><td>原位向上冒泡<\/td><\/tr><tr><td>Delete<\/td><td>删除指定元素<\/td><td>补末尾节点后按大小冒泡或下沉<\/td><\/tr><\/tbody><\/table><\/div>\n<p>堆不提供按键查找；需要查找配合外部索引。优先队列语义只承诺极值取出，不承诺队列内有序。<\/p>\n<h2>常见错误补充<\/h2>\n<ol><li>\n冒泡只比较一次就停止，漏掉上层违反父子对。\n<\/li><li>\n下沉时两子键未比较，随机选一边交换。\n<\/li><li>\n删除中间节点留空，破坏完全性映射。\n<\/li><li>\n0 起算数组套用 1 起算公式。\n<\/li><li>\n把堆中序遍历当有序序列输出。\n<\/li><li>\n重复键触发不必要交换；等值应停止。\n<\/ol>\n<h2>堆操作代价汇总<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>操作<\/th><th>路径<\/th><th>次数<\/th><th>时间<\/th><\/tr><\/thead><tbody><tr><td>Insert<\/td><td>末尾追加 + 冒泡<\/td><td>1 次<\/td><td><span class=\"katex-inline\">O(\\log n)<\/span><\/td><\/tr><tr><td>ExtractMin<\/td><td>补根 + 下沉<\/td><td>1 次<\/td><td><span class=\"katex-inline\">O(\\log n)<\/span><\/td><\/tr><tr><td>DecreaseKey<\/td><td>原位冒泡<\/td><td>1 次<\/td><td><span class=\"katex-inline\">O(\\log n)<\/span><\/td><\/tr><tr><td>建堆（逐个插入）<\/td><td><span class=\"katex-inline\">n<\/span> 次 Insert<\/td><td><span class=\"katex-inline\">n<\/span><\/td><td><span class=\"katex-inline\">O(n\\log n)<\/span><\/td><\/tr><tr><td>建堆（Heapify）<\/td><td>自底向上下沉<\/td><td><span class=\"katex-inline\">n<\/span> 节点<\/td><td><span class=\"katex-inline\">O(n)<\/span><\/td><\/tr><tr><td>堆排序<\/td><td>建堆 + <span class=\"katex-inline\">n<\/span> 次抽取<\/td><td>—<\/td><td><span class=\"katex-inline\">O(n\\log n)<\/span>，<span class=\"katex-inline\">O(1)<\/span> 额外空间<\/td><\/tr><\/tbody><\/table><\/div>\n<p>高度上界 <span class=\"katex-inline\">h=\\lceil\\log_2(n+1)\\rceil<\/span>；冒泡下沉步数不超过 <span class=\"katex-inline\">h<\/span>。重复键等值不触发交换，堆序 <span class=\"katex-inline\">\\le<\/span> 包含相等情形。<\/p>\n<h2>堆与优先队列落地备忘<\/h2>\n<p>堆是优先队列的紧凑实现：Insert 入队，ExtractMin 出队极值，DecreaseKey 降低已入队键值。位置索引记录顶点到堆下标，支撑直达更新；无索引时更新退回查找，丢失对数级优势。重复键等值不触发交换；数组起算口径要统一，1 起算与 0 起算公式整体偏移。堆只承诺极值可取，不承诺队列内有序；需要有序遍历转 BST。<\/p>\n<h2>完全性与次序性复核<\/h2>\n<p>堆的两条 invariant 分开守：完全二叉树形状保证数组下标映射确定，无需存子树指针；堆序保证根为最小。Insert 末尾追加保形状，冒泡修次序；ExtractMin 删末尾补根保形状，下沉修次序。形状破坏时下标错位，次序破坏时根不再保证最小；两类违反的表现与修复路径不同，操作时分别核对。<\/p>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出位置 <span class=\"katex-inline\">i<\/span> 的父、左子、右子下标公式，并说明边界条件。\n<\/li><li>\n<span class=\"katex-inline\">n=7<\/span> 的最小堆，根最小键是多少？兄弟节点之间有无大小约束？\n<\/li><li>\n插入键 1 到堆 <span class=\"katex-inline\">[3,5,4,8,6,7]<\/span>，逐步写出交换过程。\n<\/li><li>\nExtractMin 下沉时为什么与较小子键交换？换较大子键会出什么问题？\n<\/li><li>\n逐个插入建堆与自底向上 Heapify 的时间量级各是多少？堆排序总代价？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "堆的堆序不变量、数组表示与 Insert/ExtractMin"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：算法详解 卷2 图算法和数据结构.pdf · p.111<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">Dijkstra 算法：贪心选择不变量与非负权正确性<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">堆的堆序不变量、数组表示与 Insert/ExtractMin<\/a><\/span><\/div><h1>堆的应用与 Dijkstra 的优先队列提速<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch03（原书 §4.3、§4.4，PDF 第 111、116–123 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>堆作为优先队列落地三类应用：堆排序反复抽取最小输出有序序列，事件管理器按时间键先后处理，双堆维护中位值；在 Dijkstra 算法中，堆承担&quot;取最低候选得分&quot;与&quot;松弛后下降更新&quot;两个动作，把朴素实现的 <span class=\"katex-inline\">O(mn)<\/span> 选边扫描降为 <span class=\"katex-inline\">O(m\\log n)<\/span> 的堆操作序列。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>c06 的 Dijkstra 每轮要在全部跨集合边中找得分最低者，朴素做法每轮扫表；边数多时选边开销成为瓶颈。堆的 ExtractMin 正好对应&quot;取最低候选&quot;，DecreaseKey 对应&quot;候选距离被松弛压低后更新位置&quot;。把这两个动作交给堆，算法循环骨架不变，选边环节从线性扫描换成对数级操作。本章还要看清堆在排序、事件、中位值三个场景复用了哪条共同性质：快速取得当前极值。<\/p>\n<p>不借助优先队列抽象会出两类错。一是把堆当普通数组反复全表扫描，丢失 <span class=\"katex-inline\">O(\\log n)<\/span> 优势；二是松弛更新时只改距离不更新堆内位置，队列中残留旧得分，ExtractMin 取出过期候选。本概念把应用场景与提速后的代价核算讲清。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>优先队列<\/strong>：支持插入元素、取出极值元素的抽象队列；元素带可比较键。堆是优先队列的一种紧凑实现。<\/p>\n<p><strong>堆排序<\/strong>：把待排序键建堆，反复 ExtractMin 依次输出第 1 小、第 2 小……直到堆空；输出序列即升序。<\/p>\n<p><strong>事件管理器<\/strong>：事件以发生时间为键入堆；ExtractMin 取最近到期事件，处理中插入新事件；时间键最小的事件最先出队。<\/p>\n<p><strong>中位值维护<\/strong>：两个堆——小顶堆存较小一半，大顶堆存较大一半；两堆大小差不超过 1，堆顶给出中位值或中位附近两值。<\/p>\n<p><strong>Dijkstra 提速对应<\/strong>：<\/p>\n<ol><li>\n候选顶点及其当前 <code>len<\/code> 入堆；\n<\/li><li>\nExtractMin 取出得分最低顶点 <span class=\"katex-inline\">w^*<\/span>，纳入 <span class=\"katex-inline\">X<\/span>；\n<\/li><li>\n松弛其出边；若邻居 <code>len<\/code> 被压低，对堆内该顶点做 DecreaseKey（下降更新）；\n<\/li><li>\n重复直到无候选。\n<\/ol>\n<p><strong>DecreaseKey<\/strong>：已知堆内某元素键值降低，更新后沿父链向上冒泡恢复堆序；与 Insert 的冒泡环节相同。<\/p>\n<p><strong>朴素 vs 堆优化代价<\/strong>：朴素每轮扫全部候选边，<span class=\"katex-inline\">n<\/span> 轮合计 <span class=\"katex-inline\">O(mn)<\/span>；堆优化 <span class=\"katex-inline\">n<\/span> 次 ExtractMin、<span class=\"katex-inline\">m<\/span> 次松弛更新，各 <span class=\"katex-inline\">O(\\log n)<\/span>，合计 <span class=\"katex-inline\">O(m\\log n)<\/span>。<\/p>\n<p><strong>正例<\/strong>：Dijkstra 小图候选得分 1、3、6；堆依次抽出 1、3、6，与 c06 迭代次序一致。<\/p>\n<p><strong>反例<\/strong>：松弛后只改外部 <code>len<\/code> 不调 DecreaseKey，堆内仍是旧高得分；ExtractMin 可能先取出旧候选，距离登记错误。<\/p>\n<h2>原理推导：提速代价核算<\/h2>\n<ol><li>\n<strong>朴素选边<\/strong>：每轮枚举跨边比较，最坏 <span class=\"katex-inline\">m<\/span> 条边；<span class=\"katex-inline\">n<\/span> 轮后选边合计 <span class=\"katex-inline\">O(mn)<\/span>。松弛沿邻接表 <span class=\"katex-inline\">O(m+n)<\/span>，非瓶颈。\n<\/li><li>\n<strong>堆操作计数<\/strong>：\n<ul>\n<li>\n每个顶点一次 ExtractMin，<span class=\"katex-inline\">n<\/span> 次；\n<\/li><li>\n每条边触发一次松弛检查，成功时一次 DecreaseKey，最多 <span class=\"katex-inline\">m<\/span> 次；\n<\/li><li>\n单次堆操作 <span class=\"katex-inline\">O(\\log n)<\/span>。\n<\/li><li>\n<strong>总时间<\/strong>：<span class=\"katex-inline\">O(n\\log n+m\\log n)=O(m\\log n)<\/span>（连通图 <span class=\"katex-inline\">m\\ge n-1<\/span> 时）。\n<\/li><li>\n<strong>空间<\/strong>：堆存 <span class=\"katex-inline\">n<\/span> 个候选顶点，距离与前驱表 <span class=\"katex-inline\">O(n)<\/span>，邻接表 <span class=\"katex-inline\">O(m+n)<\/span>。\n<\/li><li>\n<strong>正确性不变<\/strong>：堆只替换选边与更新的数据结构；c06 的贪心不变量与非负权证明不随实现改变。\n<\/ul>\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：优先队列需求——反复取极值；Dijkstra 非负权场景；动态集合的最值维护。\n<\/li><li>\n边界 1：堆优化不改变算法前提；负权图即使加速，正确性仍不成立。\n<\/li><li>\n边界 2：DecreaseKey 需要能定位堆内元素；若只存键不存位置指针，更新要先查找，退回线性。实现中通常为每个顶点记录堆内下标。\n<\/li><li>\n边界 3：事件管理要求时间键可比较；相等时间的事件次序按并列处理。\n<\/li><li>\n边界 4：中位值双堆维护的是近似中位；样本偶数时中位为中间两值平均，堆顶给出两侧端点。\n<\/li><li>\n失败案例：把堆排序当稳定排序使用；堆交换可能改变相等键相对次序。\n<\/li><li>\n失败案例：提速后仍按 <span class=\"katex-inline\">O(mn)<\/span> 报代价，未区分朴素实现与堆实现。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>优先队列 vs 普通队列<\/strong>：普通队列按入队先后出队；优先队列按键值大小出队，次序由键比较决定。\n<\/li><li>\n<strong>ExtractMin vs Search<\/strong>：堆擅长取根极值；不支持按值查找，查找需遍历或另配索引。\n<\/li><li>\n<strong>堆排序 vs 插入排序<\/strong>：堆排序 <span class=\"katex-inline\">O(n\\log n)<\/span> 原地；插入排序 <span class=\"katex-inline\">O(n^2)<\/span> 但对近有序序列友好；稳定性两者都不保证（插入排序稳定）。\n<\/li><li>\n<strong>DecreaseKey vs Insert<\/strong>：Insert 新增元素入堆；DecreaseKey 修改堆内已有元素键值，更新后冒泡。前者保形状加次序，后者只恢复次序。\n<\/ul>\n<h2>一个提速对照演示<\/h2>\n<p>朴素 Dijkstra 在 5 顶点图上每轮扫全部候选边；堆版把候选放入优先队列。三轮抽取得分 2、3、5，登记 <code>len(a)=2,len(b)=3,len(c)=5<\/code>。两版结果一致，差别在选边环节：朴素版逐边比较，堆版由队列内部维护最小。边数增大时，<span class=\"katex-inline\">O(mn)<\/span> 与 <span class=\"katex-inline\">O(m\\log n)<\/span> 的差距随 <span class=\"katex-inline\">n<\/span> 拉大。<\/p>\n<h2>常见误判<\/h2>\n<ul><li>\n误判：堆优化能修复负权错误。加速只换数据结构，非负权前提不变；负权下锁定仍失效。\n<\/li><li>\n误判：DecreaseKey 可以遍历堆找到元素。无位置索引时遍历是 <span class=\"katex-inline\">O(n)<\/span>，抵消提速；实现需配下标记录。\n<\/li><li>\n误判：堆排序是稳定排序。父子交换可挪动相等键，相对次序不保留。\n<\/li><li>\n误判：事件队列按入队先后处理。优先队列按时间键出队，入队次序不决定出队次序。\n<\/ul>\n<h2>优先队列抽象与堆实现的对应<\/h2>\n<p>优先队列只承诺两个接口：插入带键元素、取出当前极值。堆是它的紧凑实现：Insert 对应入队，ExtractMin 对应出队极值，DecreaseKey 对应已入队元素键值降低。事件管理器按时间键取出队，堆排序按最小键出队，Dijkstra 按得分最低出队，三者共享同一套接口。判断一个场景是否适合优先队列，看它是否反复需要&quot;当前最优元素先处理&quot;；需要按键序遍历则不属于这个抽象。<\/p>\n<h2>三类应用的共同骨架<\/h2>\n<p>堆排序、事件管理器、中位值维护与 Dijkstra 提速，表面场景不同，骨架都是&quot;动态键集合反复取当前极值&quot;。插入随时入队，极值随时出队；差别只在键的语义：排序键为元素大小，事件键为时间，中位堆键为两侧边界，Dijkstra 键为候选长度。反过来说，只要需求是反复拿当前最优元素，堆就是候选；要按键序遍历或范围切片，不属堆的适用面。<\/p>\n<h2>联系<\/h2>\n<p>前置：c07 堆操作，c06 Dijkstra 循环骨架。后继：本章把&quot;极值优先&quot;模式交付给后续图算法与调度场景；c09 搜索树补堆不支持的有序查询。提速结论 <span class=\"katex-inline\">O(m\\log n)<\/span> 是后续网络路由实现的常用复杂度口径。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（堆的应用与 Dijkstra 的优先队列提速）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：优先队列复用、Dijkstra 提速代价与松弛更新推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>讲清堆的应用与提速，往回追四层：<\/p>\n<ol><li>\n<strong>堆操作基础<\/strong>：Insert、ExtractMin、DecreaseKey 的冒泡下沉过程（c07）。\n<\/li><li>\n<strong>优先队列抽象<\/strong>：插入与取极值两个动作对应应用层需求。\n<\/li><li>\n<strong>Dijkstra 骨架<\/strong>：选最低候选边、纳入 <span class=\"katex-inline\">X<\/span>、松弛邻居（c06）。\n<\/li><li>\n<strong>代价替换<\/strong>：朴素扫描换堆操作，选边量级从 <span class=\"katex-inline\">O(mn)<\/span> 到 <span class=\"katex-inline\">O(m\\log n)<\/span>；正确性证明不动。\n<\/ol>\n<p>依赖链方向：堆操作 → 优先队列接口 → 三类应用 → Dijkstra 选边替换 → 提速后复杂度。<\/p>\n<h2>正向推导：朴素实现瓶颈定位<\/h2>\n<p><strong>步骤 1：回顾 Dijkstra 循环<\/strong>。每轮：枚举跨集合边，算得分，取最低，纳入顶点，松弛邻居。 <strong>步骤 2：朴素选边代价<\/strong>。候选边最多 <span class=\"katex-inline\">m<\/span> 条，每轮全部比较；共 <span class=\"katex-inline\">n<\/span> 轮，选边合计 <span class=\"katex-inline\">O(mn)<\/span>。邻居松弛沿邻接表合计 <span class=\"katex-inline\">O(m+n)<\/span>。 <strong>步骤 3：瓶颈判断<\/strong>。<span class=\"katex-inline\">m<\/span> 较大时 <span class=\"katex-inline\">mn<\/span> 主导；松弛是线性的，选边扫描是可替换环节。 <strong>步骤 4：替换对象<\/strong>。&quot;取最低候选&quot;对应 ExtractMin；&quot;候选距离被压低&quot;对应 DecreaseKey。堆提供这两个操作，单次 <span class=\"katex-inline\">O(\\log n)<\/span>。 <strong>步骤 5：计数<\/strong>。ExtractMin 每顶点一次共 <span class=\"katex-inline\">n<\/span> 次；DecreaseKey 每条边松弛成功至多一次共 <span class=\"katex-inline\">m<\/span> 次；堆操作总代价 <span class=\"katex-inline\">O((n+m)\\log n)<\/span>，连通图记 <span class=\"katex-inline\">O(m\\log n)<\/span>。<\/p>\n<h2>数值算例一：堆上的 Dijkstra 迭代<\/h2>\n<p>图：<span class=\"katex-inline\">s\\to a=2<\/span>，<span class=\"katex-inline\">s\\to b=5<\/span>，<span class=\"katex-inline\">a\\to b=1<\/span>，<span class=\"katex-inline\">a\\to c=4<\/span>，<span class=\"katex-inline\">b\\to c=2<\/span>。<\/p>\n<ol><li>\n初始化堆 <span class=\"katex-inline\">\\{(s,0)\\}<\/span>，<code>len(s)=0<\/code>。\n<\/li><li>\nExtractMin 取 <span class=\"katex-inline\">s<\/span>；松弛 <span class=\"katex-inline\">(s,a)<\/span>：<code>len(a)=2<\/code>，Insert 入堆；松弛 <span class=\"katex-inline\">(s,b)<\/span>：<code>len(b)=5<\/code>，入堆。\n<\/li><li>\n堆内候选 <span class=\"katex-inline\">(a,2),(b,5)<\/span>；ExtractMin 取 <span class=\"katex-inline\">a<\/span>；松弛 <span class=\"katex-inline\">(a,b)<\/span>：候选 <span class=\"katex-inline\">2+1=3&lt;5<\/span>，DecreaseKey <span class=\"katex-inline\">b<\/span> 到 3；松弛 <span class=\"katex-inline\">(a,c)<\/span>：<code>len(c)=6<\/code>，入堆。\n<\/li><li>\n堆内 <span class=\"katex-inline\">(b,3),(c,6)<\/span>；ExtractMin 取 <span class=\"katex-inline\">b<\/span>；松弛 <span class=\"katex-inline\">(b,c)<\/span>：候选 <span class=\"katex-inline\">3+2=5&lt;6<\/span>，DecreaseKey <span class=\"katex-inline\">c<\/span> 到 5。\n<\/li><li>\nExtractMin 取 <span class=\"katex-inline\">c<\/span>；无未松弛出边。结束。登记 <code>len(a)=2,len(b)=3,len(c)=5<\/code>。\n<\/ol>\n<p><strong>对照朴素版<\/strong>：每轮扫描全部跨边比较，结果相同；堆版把比较压进队列内部，取出次序仍按得分递增。<\/p>\n<h2>数值算例二：堆排序过程<\/h2>\n<p>键集 <span class=\"katex-inline\">\\{3,1,4,1,5,9,2,6\\}<\/span>。<\/p>\n<ol><li>\n建堆（自底向上 Heapify，<span class=\"katex-inline\">O(n)<\/span>）。\n<\/li><li>\n第 1 次 ExtractMin 输出 1；补位后下沉，堆余 <span class=\"katex-inline\">\\{1,2,3,4,5,6,9\\}<\/span>。\n<\/li><li>\n第 2 次输出 1；继续抽取：2、3、4、5、6、9。\n<\/li><li>\n输出序列 <span class=\"katex-inline\">1,1,2,3,4,5,6,9<\/span>，升序。\n<\/ol>\n<p><strong>代价<\/strong>：建堆 <span class=\"katex-inline\">O(n)<\/span>，8 次抽取各 <span class=\"katex-inline\">O(\\log n)<\/span>，总 <span class=\"katex-inline\">O(n\\log n)<\/span>，额外空间 <span class=\"katex-inline\">O(1)<\/span>（原地）。相等键 1 的相对次序在交换中可能改变，堆排序不保证稳定。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：松弛后不更新堆内位置<\/strong>。外部 <code>len<\/code> 已压低，堆内仍存旧高得分；ExtractMin 取出过期候选，距离登记错误。复盘：松弛成功必须同步 DecreaseKey，或重新入队并以旧标记跳过。 <strong>案例 2：查找堆内元素用遍历<\/strong>。没有位置指针时 DecreaseKey 先全表找元素，退回 <span class=\"katex-inline\">O(n)<\/span>，提速失效。复盘：为每顶点存堆内下标，更新直达位置。 <strong>案例 3：负权图套用堆优化 Dijkstra<\/strong>。加速只改善常数与量级，不修复正确性；负权下锁定前提已破。复盘：先核 c05 符号边界。 <strong>案例 4：把优先队列当普通队列<\/strong>。按入队先后出队而非按键，事件次序或候选选择出错。复盘：优先队列出队依据是键比较。 <strong>案例 5：堆排序承诺稳定<\/strong>。父子交换可跨相等键，相对次序不保留；需要稳定排序另选算法。<\/p>\n<h2>延伸推演：中位值双堆结构<\/h2>\n<p><strong>结构<\/strong>：小顶堆 <span class=\"katex-inline\">L<\/span> 存较小一半，大顶堆 <span class=\"katex-inline\">R<\/span> 存较大一半。 <strong>不变量<\/strong>：<span class=\"katex-inline\">|L|<\/span> 与 <span class=\"katex-inline\">|R|<\/span> 差不超过 1；<span class=\"katex-inline\">L<\/span> 顶 <span class=\"katex-inline\">\\le R<\/span> 顶。 <strong>插入<\/strong>：按键落入对应堆；破坏大小差则把堆顶移到另一堆。 <strong>取中位<\/strong>：奇数样本取较多堆堆顶；偶数样本取两堆顶平均。 <strong>代价<\/strong>：每次插入 <span class=\"katex-inline\">O(\\log n)<\/span>，取中位 <span class=\"katex-inline\">O(1)<\/span>。 <strong>边界<\/strong>：双堆维护的是位置中位，不是频数或权值中位；流式样本到达即处理，不需留存全量。<\/p>\n<h2>延伸推演二：事件管理器时序<\/h2>\n<p><strong>输入<\/strong>：事件 <span class=\"katex-inline\">\\{(t_i,\\text{动作})\\}<\/span>，<span class=\"katex-inline\">t_i<\/span> 为发生时间。 <strong>循环<\/strong>：堆按 <span class=\"katex-inline\">t_i<\/span> 建队；ExtractMin 取最近事件执行；执行中新产生事件插入堆；直到堆空。 <strong>对照现实<\/strong>：闹钟调度、网络定时器、模拟离散事件系统都按这一结构；时间键最小先出，与 Dijkstra 取代价最低同构。 <strong>边界<\/strong>：相等时间事件并列先后不定；若事件有优先级次级键，需复合键比较。<\/p>\n<h2>代价核算清单<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>环节<\/th><th>朴素实现<\/th><th>堆优化<\/th><\/tr><\/thead><tbody><tr><td>取最低候选<\/td><td>每轮扫 <span class=\"katex-inline\">m<\/span> 条边<\/td><td>ExtractMin <span class=\"katex-inline\">O(\\log n)<\/span><\/td><\/tr><tr><td>松弛更新<\/td><td>改邻接表标记<\/td><td>DecreaseKey <span class=\"katex-inline\">O(\\log n)<\/span><\/td><\/tr><tr><td>选边总代价<\/td><td><span class=\"katex-inline\">O(mn)<\/span><\/td><td><span class=\"katex-inline\">O(m\\log n)<\/span><\/td><\/tr><tr><td>松弛总代价<\/td><td><span class=\"katex-inline\">O(m+n)<\/span><\/td><td><span class=\"katex-inline\">O(m+n)<\/span><\/td><\/tr><tr><td>空间<\/td><td><span class=\"katex-inline\">O(n+m)<\/span><\/td><td><span class=\"katex-inline\">O(n+m)<\/span>，堆 <span class=\"katex-inline\">O(n)<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>表中正确性结论两版相同；差别只在选边数据结构。堆优化不改变 c06 的上下界证明，也不放宽非负权前提。<\/p>\n<h2>伪码对照（堆版 Dijkstra）<\/h2>\n<pre class=\"lang-text\"><code>Dijkstra-Heap(G, s):\n  1  len[s] := 0, others := +∞\n  2  H := empty heap, insert(H, (s, 0))\n  3  while H not empty:\n  4    (v, score) := ExtractMin(H)\n  5    if v already settled: skip\n  6    mark v settled\n  7    for each edge (v, w, A_vw):\n  8      if len[v] + A_vw &lt; len[w]:\n  9        len[w] := len[v] + A_vw\n 10       DecreaseKey(H, w, len[w])<\/code><\/pre>\n<p>核查点：第 5 行跳过已定居顶点，处理重复入队；第 10 行键值降低后向上冒泡。若实现用&quot;重新入队 + 旧条目跳过&quot;代替 DecreaseKey，堆内可能有冗余条目，ExtractMin 时按定居标记丢弃。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n<strong>卡在&quot;提速提的是哪个环节&quot;<\/strong>：选边扫描换堆操作；松弛本来就是线性，不在提速范围。\n<\/li><li>\n<strong>卡在&quot;DecreaseKey 怎么定位元素&quot;<\/strong>：需要位置索引记录每顶点堆内下标；无索引则更新退回查找。\n<\/li><li>\n<strong>卡在&quot;为什么堆排序不保证稳定&quot;<\/strong>：父子交换可跨过相等键，相对次序被挪动；稳定排序要求相等键不动。\n<\/li><li>\n<strong>卡在&quot;双堆中位不变量&quot;<\/strong>：两侧大小差 ≤1，<span class=\"katex-inline\">L<\/span> 顶 ≤ <span class=\"katex-inline\">R<\/span> 顶；破环则搬堆顶平衡。\n<\/ul>\n<h2>松弛更新明细表<\/h2>\n<p>沿算例一逐边记录候选与动作：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>边<\/th><th>候选长度<\/th><th>更新前 len<\/th><th>动作<\/th><th>更新后 len<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">(s,a)<\/span><\/td><td><span class=\"katex-inline\">0+2=2<\/span><\/td><td><span class=\"katex-inline\">+\\infty<\/span><\/td><td>Insert<\/td><td>2<\/td><\/tr><tr><td><span class=\"katex-inline\">(s,b)<\/span><\/td><td><span class=\"katex-inline\">0+5=5<\/span><\/td><td><span class=\"katex-inline\">+\\infty<\/span><\/td><td>Insert<\/td><td>5<\/td><\/tr><tr><td><span class=\"katex-inline\">(a,b)<\/span><\/td><td><span class=\"katex-inline\">2+1=3<\/span><\/td><td>5<\/td><td>DecreaseKey<\/td><td>3<\/td><\/tr><tr><td><span class=\"katex-inline\">(a,c)<\/span><\/td><td><span class=\"katex-inline\">2+4=6<\/span><\/td><td><span class=\"katex-inline\">+\\infty<\/span><\/td><td>Insert<\/td><td>6<\/td><\/tr><tr><td><span class=\"katex-inline\">(b,c)<\/span><\/td><td><span class=\"katex-inline\">3+2=5<\/span><\/td><td>6<\/td><td>DecreaseKey<\/td><td>5<\/td><\/tr><\/tbody><\/table><\/div>\n<p>表中两次 DecreaseKey 都是键值降低后冒泡；若实现用冗余重入队，旧条目在 ExtractMin 时被定居标记跳过，正确性等价但堆内条目数略增。<\/p>\n<h2>三类应用的共同结构<\/h2>\n<ol><li>\n<strong>输入流<\/strong>：一系列带键元素到达；\n<\/li><li>\n<strong>反复取极值<\/strong>：当前最优（最小/最大）先处理；\n<\/li><li>\n<strong>插入与取出交替<\/strong>：新元素随时入队，极值随时出队。\n<\/ol>\n<p>堆排序取最小输出序列；事件队列取最近时间；中位值双堆取两侧堆顶；Dijkstra 取最低得分顶点。四个场景表面不同，骨架都是优先队列。反过来说，只要需求是&quot;反复拿当前极值&quot;，堆就是候选结构；需求是有序遍历或范围查询，则不属于堆的适用面。<\/p>\n<h2>代价边界复核<\/h2>\n<ul><li>\n<strong>堆操作单次代价<\/strong>：<span class=\"katex-inline\">O(\\log n)<\/span>，路径长度由树高限制。\n<\/li><li>\n<strong>ExtractMin 次数<\/strong>：每顶点一次，<span class=\"katex-inline\">n<\/span> 次。\n<\/li><li>\n<strong>更新次数<\/strong>：每条边松弛检查一次，成功更新至多一次，<span class=\"katex-inline\">m<\/span> 次。\n<\/li><li>\n<strong>总时间<\/strong>：<span class=\"katex-inline\">O((n+m)\\log n)<\/span>；连通图 <span class=\"katex-inline\">m=\\Omega(n)<\/span>，记 <span class=\"katex-inline\">O(m\\log n)<\/span>。\n<\/li><li>\n<strong>空间<\/strong>：邻接表 <span class=\"katex-inline\">O(n+m)<\/span>，堆与距离表 <span class=\"katex-inline\">O(n)<\/span>。\n<\/li><li>\n<strong>正确性前提<\/strong>：边长非负；堆优化不放宽这条。\n<\/ul>\n<h2>实现选择备忘<\/h2>\n<ul><li>\n<strong>位置索引<\/strong>：顶点 → 堆内下标，支撑 DecreaseKey 直达；无索引则更新退化为查找。\n<\/li><li>\n<strong>重复入队策略<\/strong>：可选择原位下降，或新条目入队、旧条目跳过；后者堆内冗余，前者需要索引维护。\n<\/li><li>\n<strong>定居标记<\/strong>：ExtractMin 取出已定居顶点直接跳过，防止重复处理。\n<\/li><li>\n<strong>不可达顶点<\/strong>：留在堆外或 <code>len=+∞<\/code>，不参与抽取。\n<\/ul>\n<h2>常见错误清单<\/h2>\n<ol><li>\n松弛成功不改堆，残留旧得分。\n<\/li><li>\nDecreaseKey 全表查找，丢失对数级优势。\n<\/li><li>\n把朴素版 <span class=\"katex-inline\">O(mn)<\/span> 套到堆版结论上。\n<\/li><li>\n负权图引用堆版 Dijkstra 正确性。\n<\/li><li>\n优先队列按入队次序而非键次序出队。\n<\/li><li>\n中位堆两侧大小差失控未再平衡。\n<\/li><li>\n堆排序结果承诺稳定排序。\n<\/ol>\n<h2>优先队列接口与实现备忘<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>接口<\/th><th>堆内部动作<\/th><th>代价<\/th><th>应用对应<\/th><\/tr><\/thead><tbody><tr><td>Insert<\/td><td>末尾追加后冒泡<\/td><td><span class=\"katex-inline\">O(\\log n)<\/span><\/td><td>新事件入队、新候选入堆<\/td><\/tr><tr><td>ExtractMin<\/td><td>补根后下沉<\/td><td><span class=\"katex-inline\">O(\\log n)<\/span><\/td><td>最近事件出队、最低得分顶点定居<\/td><\/tr><tr><td>DecreaseKey<\/td><td>原位冒泡<\/td><td><span class=\"katex-inline\">O(\\log n)<\/span><\/td><td>候选距离被松弛压低<\/td><\/tr><tr><td>定居标记<\/td><td>跳过重复条目<\/td><td><span class=\"katex-inline\">O(1)<\/span><\/td><td>防旧候选重复处理<\/td><\/tr><\/tbody><\/table><\/div>\n<p>实现两种更新策略：原位下降需维护顶点到堆下标的映射；冗余重入队则旧条目在 ExtractMin 时按定居标记丢弃。前者省空间，后者省索引维护；两种策略不改变距离正确性。<\/p>\n<h2>事件队列与 Dijkstra 的同构对照<\/h2>\n<ul><li>\n<strong>事件队列<\/strong>：键为时间，ExtractMin 取下一时刻事件；新事件随时插入。\n<\/li><li>\n<strong>Dijkstra<\/strong>：键为当前最短候选长度，ExtractMin 取最低得分顶点；松弛成功插入或更新。\n<\/li><li>\n<strong>共同骨架<\/strong>：动态键集合，反复取极值，插入与取出交替。\n<\/li><li>\n<strong>差别<\/strong>：事件队列不回溯改时间；Dijkstra 的候选距离在定居前可被更低值替换。\n<\/ul>\n<p>中位值双堆是同一抽象的变体：两侧堆顶分别给出较小半区与较大半区的边界，插入后再平衡两侧大小。<\/p>\n<h2>复杂度边界复核<\/h2>\n<ul><li>\n朴素 Dijkstra：选边 <span class=\"katex-inline\">O(mn)<\/span>，松弛 <span class=\"katex-inline\">O(m+n)<\/span>。\n<\/li><li>\n堆优化：<span class=\"katex-inline\">n<\/span> 次 ExtractMin、至多 <span class=\"katex-inline\">m<\/span> 次 DecreaseKey，各 <span class=\"katex-inline\">O(\\log n)<\/span>，总 <span class=\"katex-inline\">O(m\\log n)<\/span>。\n<\/li><li>\n空间：邻接表 <span class=\"katex-inline\">O(n+m)<\/span>，堆与距离表 <span class=\"katex-inline\">O(n)<\/span>。\n<\/li><li>\n正确性前提仍是边长非负；提速不放宽该前提，也不替代负环检测。\n<\/ul>\n<h2>中位值双堆细节<\/h2>\n<p><strong>结构<\/strong>：小顶堆 <span class=\"katex-inline\">L<\/span> 存较小一半，大顶堆 <span class=\"katex-inline\">R<\/span> 存较大一半。 <strong>不变量<\/strong>：两侧大小差不超过 1；<span class=\"katex-inline\">L<\/span> 顶 <span class=\"katex-inline\">\\le R<\/span> 顶。 <strong>插入<\/strong>：按键落入对应堆；大小差失控时把堆顶移到另一堆。 <strong>取中位<\/strong>：奇数样本取较多堆堆顶；偶数样本取两堆顶平均。 <strong>代价<\/strong>：插入 <span class=\"katex-inline\">O(\\log n)<\/span>，取中位 <span class=\"katex-inline\">O(1)<\/span>，流式到达不需留存全量。 <strong>边界<\/strong>：维护的是位置中位，不是频数或权值中位；样本分布偏斜时双堆仍按大小平衡，不反映频数重心。<\/p>\n<h2>事件管理循环<\/h2>\n<p>事件以时间键入堆；ExtractMin 取最近到期事件执行；执行中新产生事件再插入；堆空结束。闹钟调度、网络定时器、离散事件模拟都按此结构。相等时间事件并列先后不定；有次级优先级时需复合键比较。该循环与 Dijkstra 同构：都是动态键集合反复取极值，差别在事件不改时间，Dijkstra 候选定居前可被更低值替换。<\/p>\n<h2>提速前后对照备忘<\/h2>\n<p>朴素版选边每轮扫全部候选边，<span class=\"katex-inline\">n<\/span> 轮合计 <span class=\"katex-inline\">O(mn)<\/span>；松弛沿邻接表 <span class=\"katex-inline\">O(m+n)<\/span>。堆版 <span class=\"katex-inline\">n<\/span> 次 ExtractMin、至多 <span class=\"katex-inline\">m<\/span> 次 DecreaseKey，单次 <span class=\"katex-inline\">O(\\log n)<\/span>，总 <span class=\"katex-inline\">O(m\\log n)<\/span>。空间邻接表 <span class=\"katex-inline\">O(n+m)<\/span>，堆与距离表 <span class=\"katex-inline\">O(n)<\/span>。正确性前提仍是边长非负，加速不放宽前提，也不替代负环检测。<\/p>\n<h2>松弛更新与堆操作对应明细<\/h2>\n<p>Dijkstra 每轮：ExtractMin 取出定居顶点 <span class=\"katex-inline\">v<\/span>；遍历出边 <span class=\"katex-inline\">(v,w,A_{vw})<\/span>；若 <code>len(v)+A_vw &lt; len(w)<\/code>，更新 <code>len(w)<\/code> 并对堆内 <span class=\"katex-inline\">w<\/span> 做 DecreaseKey（或冗余重入队）。未定居顶点的临时距离可被反复压低；定居标记防止旧条目重复处理。堆只承担取极值与位置更新，距离正确性仍由 c06 的非负权归纳保证。<\/p>\n<h2>应用落地检查清单<\/h2>\n<ul><li>\n是否反复取当前最优元素：是则优先队列适用。\n<\/li><li>\n是否需要键序或范围：需要则堆不适用，转 BST。\n<\/li><li>\n松弛更新能否定位堆内元素：无位置索引则更新退回查找。\n<\/li><li>\n负权前提是否满足：不满足则堆加速不修复正确性。\n<\/li><li>\n事件时间是否可比较：相等时间需次级键定次序。\n<\/ul>\n<p>清单按&quot;需求类型 → 数据结构 → 前提条件&quot;顺序核对，避免把堆用到它不服务的查询上。<\/p>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n朴素 Dijkstra 选边为什么是 <span class=\"katex-inline\">O(mn)<\/span>？堆版把哪两个动作换成堆操作？\n<\/li><li>\n写出堆版 Dijkstra 的 ExtractMin 次数与 DecreaseKey 次数量级。\n<\/li><li>\n松弛成功后不同步更新堆会产生什么错误？两种补救实现各是什么？\n<\/li><li>\n堆排序总时间与额外空间是多少？为什么不保证稳定？\n<\/li><li>\n中位值维护的两个堆各存什么？不变量有哪两条？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "堆的应用与 Dijkstra 的优先队列提速"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：算法详解 卷2 图算法和数据结构.pdf · p.140<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">堆的堆序不变量、数组表示与 Insert/ExtractMin<\/a><\/span><\/div><h1>二叉搜索树：有序操作与旋转平衡<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（原书 §5.1–5.4，PDF 第 135、140–157 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>二叉搜索树（BST）是满足 BST 性质的二叉树：任一节点的左子树全部键小于该节点键，右子树全部键大于该节点键；Search、Min、Max、前驱、插入、删除等操作沿一条路径下行，时间 <span class=\"katex-inline\">O(\\text{高度})<\/span>；旋转是不破坏 BST 性质的 <span class=\"katex-inline\">O(1)<\/span> 局部父子换位，用于在插入删除后把过高的一侧压回平衡。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>有序数组二分查找快，但插入要搬动后续元素 <span class=\"katex-inline\">O(n)<\/span>；堆只保极值，给不出全局有序。动态集合需要同时支持查找、插入、删除与有序遍历，BST 用树形结构把比较方向固化在分叉里：每次比较排除一整棵子树。问题在于树形可能退化——按有序序列插入会得到一条链，高度 <span class=\"katex-inline\">n<\/span>，操作退回 <span class=\"katex-inline\">O(n)<\/span>。旋转提供局部调整手段，在不破坏键序的前提下重排父子位置，阻止单侧过长。<\/p>\n<p>不立 BST 性质会出两类错。一是分叉方向判断错：把应进右子树的键放进左子树，后续查找排除掉错误子树，目标漏检。二是平衡调整破坏有序：旋转或重组时改动子树归属，未核对次序约束，中序序列被打乱。本概念把 BST 性质、各操作的路径代价与旋转的不变量讲清。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>BST 性质<\/strong>：对节点 <span class=\"katex-inline\">u<\/span>，左子树所有键 <span class=\"katex-inline\">&lt;\\mathrm{key}(u)<\/span>，右子树所有键 <span class=\"katex-inline\">&gt;\\mathrm{key}(u)<\/span>；等值键按约定归一侧。 <strong>中序遍历<\/strong>：左—根—右依次访问，输出严格升序序列；这是 BST 全局有序的体现。 <strong>Search(<span class=\"katex-inline\">k<\/span>)<\/strong>：从根比较；<span class=\"katex-inline\">k<\/span> 小走左，<span class=\"katex-inline\">k<\/span> 大走右，相等命中；走到空则不存在。 <strong>Min/Max<\/strong>：Min 沿左子节点走到最左，Max 沿右走到最右。 <strong>Predecessor(<span class=\"katex-inline\">u<\/span>)<\/strong>：<span class=\"katex-inline\">u<\/span> 的左子树最右节点；或向上回溯到第一个把 <span class=\"katex-inline\">u<\/span> 放在右子树的祖先。 <strong>Insert(<span class=\"katex-inline\">k<\/span>)<\/strong>：按 Search 方向走到空位，挂为新叶；新叶不破坏已有 BST 性质。 <strong>Delete(<span class=\"katex-inline\">k<\/span>)<\/strong>：叶节点直接删；单子女节点用子女顶替；双子女节点取前驱（或后继）顶替，再删前驱/后继。 <strong>Select(<span class=\"katex-inline\">i<\/span>)<\/strong>：利用子树大小统计，找第 <span class=\"katex-inline\">i<\/span> 小节点。 <strong>高度 <span class=\"katex-inline\">h<\/span><\/strong>：根到叶最长路径边数；平衡 BST 维持 <span class=\"katex-inline\">h=O(\\log n)<\/span>，退化链 <span class=\"katex-inline\">h=n<\/span>。 <strong>旋转<\/strong>：局部父子换位。右旋：父 <span class=\"katex-inline\">a<\/span> 与右子 <span class=\"katex-inline\">b<\/span> 互换上下，<span class=\"katex-inline\">b<\/span> 的左子树 <span class=\"katex-inline\">B<\/span> 改挂为 <span class=\"katex-inline\">a<\/span> 的右子；左旋对称。旋转保持 BST 性质，<span class=\"katex-inline\">O(1)<\/span>。<\/p>\n<p><strong>正例<\/strong>：根 5，左 2，右 8；2 右子 3。中序 <span class=\"katex-inline\">2,3,5,8<\/span>，满足左小右大。<\/p>\n<p><strong>反例<\/strong>：根 5，右子挂 4；4 小于 5，违反右子树全大，查找 4 时从根向右排除左子树，目标被漏掉。<\/p>\n<h2>原理推导：操作代价与旋转保序<\/h2>\n<ol><li>\n<strong>路径下行代价<\/strong>：Search、Min、Max、前驱、Insert 各沿一条根到叶路径，比较次数不超过高度 <span class=\"katex-inline\">h<\/span>；<span class=\"katex-inline\">O(h)<\/span>。\n<\/li><li>\n<strong>中序有序<\/strong>：按 BST 性质递归，左子树全部小于根，根小于右子树；中序遍历先左、再根、后右，输出升序。\n<\/li><li>\n<strong>旋转保序证明<\/strong>：右旋前次序链 <span class=\"katex-inline\">A&lt;a&lt;B&lt;b&lt;C<\/span>（<span class=\"katex-inline\">A<\/span> 为 <span class=\"katex-inline\">a<\/span> 左子，<span class=\"katex-inline\">B<\/span> 为 <span class=\"katex-inline\">b<\/span> 左子，<span class=\"katex-inline\">C<\/span> 为 <span class=\"katex-inline\">b<\/span> 右子）。旋转后 <span class=\"katex-inline\">A<\/span> 仍在 <span class=\"katex-inline\">a<\/span> 左，<span class=\"katex-inline\">B<\/span> 改挂 <span class=\"katex-inline\">a<\/span> 右，<span class=\"katex-inline\">C<\/span> 仍在 <span class=\"katex-inline\">b<\/span> 右，<span class=\"katex-inline\">a<\/span> 挂为 <span class=\"katex-inline\">b<\/span> 左；逐对核验 <span class=\"katex-inline\">A&lt;a&lt;B&lt;b&lt;C<\/span> 全部成立，中序序列不变。\n<\/li><li>\n<strong>平衡作用<\/strong>：插入删除后某侧过高，旋转把高位子树压向另一侧；单次旋转 <span class=\"katex-inline\">O(1)<\/span>，平衡结构（如本书选读的强化搜索树）按规则触发旋转，维持 <span class=\"katex-inline\">h=O(\\log n)<\/span>。\n<\/li><li>\n<strong>退化对照<\/strong>：按 <span class=\"katex-inline\">1,2,3,\\dots,n<\/span> 顺序插入，每次新键挂右叶，树成右链，<span class=\"katex-inline\">h=n<\/span>；查找最坏 <span class=\"katex-inline\">O(n)<\/span>。旋转或平衡结构阻止这一退化。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：动态有序集合；需要按键查找、前驱后继、有序遍历、范围查询。\n<\/li><li>\n边界 1：普通 BST 不保证平衡，最坏高度 <span class=\"katex-inline\">n<\/span>；保证 <span class=\"katex-inline\">O(\\log n)<\/span> 需要平衡规则（旋转 + 触发条件）。\n<\/li><li>\n边界 2：BST 操作依赖键可比较；不可比较对象不能走大小分叉。\n<\/li><li>\n边界 3：删除双子女节点时，顶替键选前驱或后继，两种选择都合法，结果树形态不同。\n<\/li><li>\n边界 4：Select 需要额外存子树大小；不存大小只能遍历计数。\n<\/li><li>\n失败案例：插入后未按方向走到空位，强行插入中间节点，破坏既有父子约束。\n<\/li><li>\n失败案例：旋转后未核对子树归属，<span class=\"katex-inline\">B<\/span> 树仍挂原位或丢失，中序次序错乱。\n<\/li><li>\n失败案例：把退化链 BST 的 <span class=\"katex-inline\">O(n)<\/span> 当成 BST 普遍复杂度；平均与最坏要分清。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>BST vs 堆<\/strong>：BST 全局有序、支持范围与前驱；堆只保父子极值，兄弟无序。查有序选 BST，取极值选堆。\n<\/li><li>\n<strong>BST vs 有序数组<\/strong>：数组二分 <span class=\"katex-inline\">O(\\log n)<\/span> 但插入 <span class=\"katex-inline\">O(n)<\/span> 搬动；BST 插入沿路径挂叶 <span class=\"katex-inline\">O(h)<\/span>，动态场景更合适。\n<\/li><li>\n<strong>旋转 vs 重组<\/strong>：旋转是 <span class=\"katex-inline\">O(1)<\/span> 局部换位；整树重排代价更高。平衡调整优先用旋转，不轻易重构。\n<\/li><li>\n<strong>高度 vs 层数<\/strong>：高度是根到叶最长路径；平衡指高度 <span class=\"katex-inline\">O(\\log n)<\/span>，不是所有叶同层。\n<\/ul>\n<h2>一个查找与插入演示<\/h2>\n<p>树根 5，左子 2（右子 3），右子 8。查 7：到 5 向右，到 8 向左，左为空，判定不存在。查 3：5 向左到 2，向右命中。插入 4：沿 5→2→3 向右走到空位，挂为 3 的右叶；复核父子键 <span class=\"katex-inline\">3&lt;4<\/span>、<span class=\"katex-inline\">2&lt;4<\/span>、<span class=\"katex-inline\">5&gt;4<\/span>，性质保持。中序遍历 <span class=\"katex-inline\">2,3,4,5,8<\/span> 为升序，验证全局有序。<\/p>\n<h2>常见误判<\/h2>\n<ul><li>\n误判：BST 操作一定是 <span class=\"katex-inline\">O(\\log n)<\/span>。无平衡规则时退化链高度 <span class=\"katex-inline\">n<\/span>，操作 <span class=\"katex-inline\">O(n)<\/span>；<span class=\"katex-inline\">O(\\log n)<\/span> 需要平衡结构维持。\n<\/li><li>\n误判：旋转改变树中键值。旋转只换父子挂靠与子树归属，键不变，中序序列不变。\n<\/li><li>\n误判：BST 与堆都是树形结构，取极值能力相同。堆根为最小，BST 极值在最左最右；BST 另支持前驱与范围查询。\n<\/li><li>\n误判：删除双子女节点直接摘除根。需取前驱或后继顶替，再删顶替来源，子树由顶替链条承接。\n<\/ul>\n<h2>适用场景与边界<\/h2>\n<p>BST 适合动态符号表：键名到定义的映射、有序集合的插入查找删除、需要前驱后继或范围切片的索引。不适合只判存在性且追求常数时间的场景，那是散列表的领域；也不适合只反复取极值，堆更紧凑。普通 BST 不承诺对数高度，需要 <span class=\"katex-inline\">O(\\log n)<\/span> 最坏保证时必须配平衡规则；键不可比较时无法走大小分叉，不能用 BST 组织。<\/p>\n<h2>联系<\/h2>\n<p>前置：c07 树形层次与父子路径概念。后继：BST 的有序操作是符号表、索引结构的基础；散列表（c10）走另一条不维护键序的路线，两者对照覆盖有序查询与极速存在性两类需求。旋转保序思路在平衡树、红黑树等后续结构中复用。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（二叉搜索树：有序操作与旋转平衡）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：BST 性质、操作路径与旋转保序推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>讲清搜索树，往回追四层：<\/p>\n<ol><li>\n<strong>键可比较<\/strong>：大小关系是分叉方向的依据。\n<\/li><li>\n<strong>树形路径<\/strong>：每次比较排除一棵子树，操作沿根到叶一条路径。\n<\/li><li>\n<strong>全局有序<\/strong>：BST 性质递归保证中序升序，支撑前驱后继与范围查询。\n<\/li><li>\n<strong>平衡调整<\/strong>：退化链抬高高度；旋转局部换位保序，平衡结构维持 <span class=\"katex-inline\">O(\\log n)<\/span> 高度。\n<\/ol>\n<p>依赖链方向：键比较 → 分叉排除子树 → 中序有序 → 高度代价 → 旋转平衡。<\/p>\n<h2>正向推导：BST 性质与操作路径<\/h2>\n<p><strong>步骤 1：性质陈述<\/strong>。节点 <span class=\"katex-inline\">u<\/span> 左子树键全部 <span class=\"katex-inline\">&lt;\\mathrm{key}(u)<\/span>，右子树键全部 <span class=\"katex-inline\">&gt;\\mathrm{key}(u)<\/span>；等值按约定归一侧。 <strong>步骤 2：Search 路径<\/strong>。从根起：<span class=\"katex-inline\">k&lt;\\mathrm{key}(u)<\/span> 走左，<span class=\"katex-inline\">k&gt;<\/span> 走右，相等命中；遇空路径即不存在。每步排除另一整棵子树，不需回退。 <strong>步骤 3：极值路径<\/strong>。Min 反复向左到无左子；Max 反复向右到无右子。 <strong>步骤 4：前驱定位<\/strong>。<span class=\"katex-inline\">u<\/span> 有左子树时，前驱是左子树最右节点；无左子树时，向上找第一个把 <span class=\"katex-inline\">u<\/span> 放在其右子树的祖先。后继对称。 <strong>步骤 5：插入路径<\/strong>。Search 到空位挂新叶；新叶只影响悬挂点附近，既有父子对不动。 <strong>步骤 6：代价<\/strong>。各操作沿一条路径，比较次数 <span class=\"katex-inline\">\\le h<\/span>，时间 <span class=\"katex-inline\">O(h)<\/span>；中序遍历全部节点 <span class=\"katex-inline\">O(n)<\/span>。<\/p>\n<h2>正向推导二：旋转保序逐步核验<\/h2>\n<p>取右旋：父 <span class=\"katex-inline\">a<\/span>，右孩子 <span class=\"katex-inline\">b<\/span>；<span class=\"katex-inline\">a<\/span> 左子 <span class=\"katex-inline\">A<\/span>，<span class=\"katex-inline\">b<\/span> 左子 <span class=\"katex-inline\">B<\/span>，<span class=\"katex-inline\">b<\/span> 右子 <span class=\"katex-inline\">C<\/span>。<\/p>\n<ol><li>\n<strong>旋转前次序<\/strong>：由 BST 性质，<span class=\"katex-inline\">A&lt;a&lt;B&lt;b&lt;C<\/span>。\n<\/li><li>\n<strong>旋转动作<\/strong>：<span class=\"katex-inline\">b<\/span> 升到父位；<span class=\"katex-inline\">a<\/span> 变为 <span class=\"katex-inline\">b<\/span> 左孩子；<span class=\"katex-inline\">B<\/span> 从 <span class=\"katex-inline\">b<\/span> 左子改挂 <span class=\"katex-inline\">a<\/span> 右子；<span class=\"katex-inline\">C<\/span> 不变。\n<\/li><li>\n<strong>逐对核验<\/strong>：\n<ul>\n<li>\n<span class=\"katex-inline\">A<\/span> 挂 <span class=\"katex-inline\">a<\/span> 左：<span class=\"katex-inline\">A&lt;a<\/span> 保持；\n<\/li><li>\n<span class=\"katex-inline\">B<\/span> 挂 <span class=\"katex-inline\">a<\/span> 右：<span class=\"katex-inline\">a&lt;B<\/span> 保持；\n<\/li><li>\n<span class=\"katex-inline\">B&lt;b<\/span> 保持；\n<\/li><li>\n<span class=\"katex-inline\">a<\/span> 挂 <span class=\"katex-inline\">b<\/span> 左：<span class=\"katex-inline\">a&lt;b<\/span> 保持；\n<\/li><li>\n<span class=\"katex-inline\">C<\/span> 挂 <span class=\"katex-inline\">b<\/span> 右：<span class=\"katex-inline\">b&lt;C<\/span> 保持。\n<\/li><li>\n<strong>中序不变<\/strong>：次序链 <span class=\"katex-inline\">A,a,B,b,C<\/span> 旋转前后一致；旋转只改父子挂靠，不改键值与子树内部结构。\n<\/li><li>\n<strong>代价<\/strong>：涉及常数个节点指针，<span class=\"katex-inline\">O(1)<\/span>。左旋是镜像操作。\n<\/ul>\n<\/ol>\n<h2>数值算例一：Search 与插入推演<\/h2>\n<p>树：根 5，左 2（右子 3），右 8。<\/p>\n<p><strong>Search 7<\/strong>：根 5，<span class=\"katex-inline\">7&gt;5<\/span> 走右；到 8，<span class=\"katex-inline\">7&lt;8<\/span> 走左；左为空，7 不存在。 <strong>Search 3<\/strong>：根 5 走左到 2，<span class=\"katex-inline\">3&gt;2<\/span> 走右；命中 3。 <strong>Insert 4<\/strong>：Search 4：5 左、2 右、3 右为空；挂 4 为 3 的右叶。核验：3 左无、右 4，<span class=\"katex-inline\">3&lt;4<\/span>；父链 <span class=\"katex-inline\">2&lt;4<\/span>、<span class=\"katex-inline\">5&gt;4<\/span>，性质保持。 <strong>中序<\/strong>：<span class=\"katex-inline\">2,3,4,5,8<\/span>，升序。<\/p>\n<p><strong>高度核算<\/strong>：该树三层，<span class=\"katex-inline\">h=2<\/span>（边数）；操作最多比较 2–3 次。<\/p>\n<h2>数值算例二：有序插入退化链<\/h2>\n<p>依次插入 <span class=\"katex-inline\">1,2,3,4,5<\/span>：<\/p>\n<ol><li>\n1 为根；2 大于 1 挂右；3 大于 2 挂右；4、5 继续挂右。\n<\/li><li>\n树成右链：<span class=\"katex-inline\">1\\to2\\to3\\to4\\to5<\/span>，<span class=\"katex-inline\">h=4<\/span>。\n<\/li><li>\nSearch 5 要走 4 次比较；<span class=\"katex-inline\">n<\/span> 个有序键插入后最坏 <span class=\"katex-inline\">O(n)<\/span>。\n<\/li><li>\n对照平衡形态：同键集可构成 <span class=\"katex-inline\">h=\\lceil\\log_2 5\\rceil=3<\/span> 的树，操作对数级。\n<\/ol>\n<p><strong>退化原因<\/strong>：每次新键都大于已有全部键，只走右分支；BST 性质满足，但形状单侧过长。平衡规则在插入触发旋转，把高位子树压向另一侧。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：分叉方向判反<\/strong>。把小于根的键挂右子树，查找时沿右路排除左子，目标漏检。复盘：插入查找先按性质定方向，空位悬挂前复核父子键大小。 <strong>案例 2：旋转丢子树<\/strong>。换位时 <span class=\"katex-inline\">B<\/span> 未改挂 <span class=\"katex-inline\">a<\/span> 右子，子树丢失或重复挂靠；复盘：旋转列出 <span class=\"katex-inline\">A,B,C<\/span> 三处归属，逐个核对。 <strong>案例 3：把普通 BST 最坏复杂度当承诺<\/strong>。无平衡规则时退化链 <span class=\"katex-inline\">O(n)<\/span>；<span class=\"katex-inline\">O(\\log n)<\/span> 需要平衡结构支撑。 <strong>案例 4：删除双子女误删根<\/strong>。双子女节点不能直接移除；取前驱或后继顶替，再删顶替来源节点。 <strong>案例 5：Select 不存子树大小<\/strong>。第 <span class=\"katex-inline\">i<\/span> 小无法按大小跳转，只能中序遍历计数；需要 Select 就维护 size 字段。<\/p>\n<h2>延伸推演：删除三种情形<\/h2>\n<ol><li>\n<strong>叶节点<\/strong>：直接摘除，父节点子女置空。\n<\/li><li>\n<strong>单子女<\/strong>：用唯一子女顶替被删节点位置。\n<\/li><li>\n<strong>双子女<\/strong>：取前驱（左子树最右）或后继（右子树最左）键值顶替，再删除前驱/后继节点；被删位置的子树由顶替链条承接。\n<\/ol>\n<p>三种情形都保持 BST 性质；双子女删除多一步查找顶替键，代价仍 <span class=\"katex-inline\">O(h)<\/span>。<\/p>\n<h2>平衡直觉：旋转解决什么、不解决什么<\/h2>\n<p><strong>解决<\/strong>：局部父子层级过高，通过一次或多次旋转把侧高压回；旋转不改变中序序列。 <strong>不解决<\/strong>：键集本身的分布选择；平衡结构靠触发规则决定何时旋转，不是插入后自动重排全树。 <strong>高度目标<\/strong>：平衡 BST 维持 <span class=\"katex-inline\">h=O(\\log n)<\/span>，使查找插入删除均 <span class=\"katex-inline\">O(\\log n)<\/span>；普通 BST 只保证 <span class=\"katex-inline\">O(h)<\/span>。<\/p>\n<h2>与其他结构对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>结构<\/th><th>有序性<\/th><th>极值<\/th><th>插入代价<\/th><th>典型查询<\/th><\/tr><\/thead><tbody><tr><td>有序数组<\/td><td>全局有序<\/td><td>两端 <span class=\"katex-inline\">O(1)<\/span><\/td><td><span class=\"katex-inline\">O(n)<\/span> 搬动<\/td><td>二分查找<\/td><\/tr><tr><td>堆<\/td><td>父子局部序<\/td><td>根 <span class=\"katex-inline\">O(1)<\/span><\/td><td><span class=\"katex-inline\">O(\\log n)<\/span><\/td><td>取极值<\/td><\/tr><tr><td>BST<\/td><td>全局有序（中序）<\/td><td>最左最右 <span class=\"katex-inline\">O(h)<\/span><\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><td>查找、前驱、范围<\/td><\/tr><tr><td>散列表<\/td><td>不维护键序<\/td><td>无<\/td><td>期望 <span class=\"katex-inline\">O(1)<\/span><\/td><td>存在性判断<\/td><\/tr><\/tbody><\/table><\/div>\n<p>对照用途：先列查询需求（有序遍历/范围/极值/存在性），再选结构；同一数据集可按不同需求配不同组织。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n<strong>卡在&quot;每次比较为什么能排除一棵子树&quot;<\/strong>：BST 性质保证另一侧全部键落在大小区间外；走左则右子树不可能含目标，反之亦然。\n<\/li><li>\n<strong>卡在&quot;旋转为什么不改中序&quot;<\/strong>：旋转只交换 <span class=\"katex-inline\">a,b<\/span> 挂靠，<span class=\"katex-inline\">A,B,C<\/span> 内部不动；次序链 <span class=\"katex-inline\">A&lt;a&lt;B&lt;b&lt;C<\/span> 保持，中序序列不变。\n<\/li><li>\n<strong>卡在&quot;高度与平衡关系&quot;<\/strong>：高度是路径长度；平衡指高度对数级，叶不必同层。退化链高度 <span class=\"katex-inline\">n<\/span>，平衡树高度 <span class=\"katex-inline\">\\log n<\/span>。\n<\/li><li>\n<strong>卡在&quot;前驱怎么找&quot;<\/strong>：有左子树取其最右；无左子树向上回溯到第一个右祖先。后继镜像。\n<\/ul>\n<h2>旋转小算例：右旋前后对照<\/h2>\n<p>设 <span class=\"katex-inline\">a=5<\/span>，<span class=\"katex-inline\">b=8<\/span>，<span class=\"katex-inline\">A=\\{2,3\\}<\/span>，<span class=\"katex-inline\">B=\\{6,7\\}<\/span>，<span class=\"katex-inline\">C=\\{9\\}<\/span>。<\/p>\n<p><strong>旋转前<\/strong>：<span class=\"katex-inline\">5<\/span> 的右孩子是 <span class=\"katex-inline\">8<\/span>；<span class=\"katex-inline\">8<\/span> 的左孩子是 <span class=\"katex-inline\">B<\/span>，右孩子是 <span class=\"katex-inline\">C<\/span>。次序链 <span class=\"katex-inline\">A&lt;5&lt;B&lt;8&lt;C<\/span>。 <strong>右旋动作<\/strong>：<span class=\"katex-inline\">8<\/span> 升到父位；<span class=\"katex-inline\">5<\/span> 变为 <span class=\"katex-inline\">8<\/span> 的左孩子；<span class=\"katex-inline\">B<\/span> 改挂为 <span class=\"katex-inline\">5<\/span> 的右孩子；<span class=\"katex-inline\">C<\/span> 留在 <span class=\"katex-inline\">8<\/span> 右孩子。 <strong>归属核验<\/strong>：<\/p>\n<ul><li>\n<span class=\"katex-inline\">A<\/span> 仍在 <span class=\"katex-inline\">5<\/span> 左：<span class=\"katex-inline\">A&lt;5<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">B<\/span> 在 <span class=\"katex-inline\">5<\/span> 右：<span class=\"katex-inline\">5&lt;B<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">B&lt;8<\/span> 不变；\n<\/li><li>\n<span class=\"katex-inline\">5<\/span> 在 <span class=\"katex-inline\">8<\/span> 左：<span class=\"katex-inline\">5&lt;8<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">C<\/span> 在 <span class=\"katex-inline\">8<\/span> 右：<span class=\"katex-inline\">8&lt;C<\/span>。\n<p><strong>中序序列<\/strong>：旋转前后都是 <span class=\"katex-inline\">A,5,B,8,C<\/span>，键序未变。左旋是镜像：<span class=\"katex-inline\">a<\/span> 为左孩子侧父节点，<span class=\"katex-inline\">b<\/span> 为左子，换位后 <span class=\"katex-inline\">b<\/span> 升位，<span class=\"katex-inline\">a<\/span> 挂右。<\/p>\n<\/ul>\n<h2>删除三情形逐步推演<\/h2>\n<p><strong>情形 1：叶节点<\/strong>。被删节点无子女，直接摘除，父节点对应子女指针置空。例：删 <span class=\"katex-inline\">4<\/span>（叶），其父 <span class=\"katex-inline\">3<\/span> 的右孩子置空。 <strong>情形 2：单子女<\/strong>。被删节点唯一子女顶替其位置。例：节点 <span class=\"katex-inline\">b<\/span> 只有左子女 <span class=\"katex-inline\">c<\/span>，删 <span class=\"katex-inline\">b<\/span> 后 <span class=\"katex-inline\">c<\/span> 接到 <span class=\"katex-inline\">b<\/span> 父节点对应位置。 <strong>情形 3：双子女<\/strong>。取前驱（左子树最右）或后继（右子树最左）键值顶替被删节点，再删除前驱/后继节点；被删位置的子树由顶替链条承接。例：删根 <span class=\"katex-inline\">5<\/span>，前驱取左子树最右 <span class=\"katex-inline\">3<\/span>，把 <span class=\"katex-inline\">3<\/span> 的键值放到 <span class=\"katex-inline\">5<\/span> 位置，再删原 <span class=\"katex-inline\">3<\/span> 节点；若 <span class=\"katex-inline\">3<\/span> 有左子树，按单子女情形承接。<\/p>\n<p>三种情形结束后 BST 性质保持；双子女删除多一次顶替键查找，总代价仍 <span class=\"katex-inline\">O(h)<\/span>。<\/p>\n<h2>高度与代价核算<\/h2>\n<ul><li>\n平衡树：<span class=\"katex-inline\">h=O(\\log n)<\/span>，各查找插入删除 <span class=\"katex-inline\">O(\\log n)<\/span>。\n<\/li><li>\n退化链：<span class=\"katex-inline\">h=n-1<\/span>，最坏 <span class=\"katex-inline\">O(n)<\/span>。\n<\/li><li>\n中序遍历：全部节点访问一次，<span class=\"katex-inline\">O(n)<\/span>。\n<\/li><li>\nSelect：存子树大小字段，按大小跳转 <span class=\"katex-inline\">O(h)<\/span>；不存大小只能遍历计数。\n<\/ul>\n<p>高度由插入删除序列与平衡规则共同决定；普通 BST 不承诺对数高度，平衡结构（旋转加触发条件）才把高度压到对数级。<\/p>\n<h2>各操作路径汇总<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>操作<\/th><th>路径方向<\/th><th>代价<\/th><\/tr><\/thead><tbody><tr><td>Search(<span class=\"katex-inline\">k<\/span>)<\/td><td>根到叶，按大小分叉<\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><\/tr><tr><td>Min<\/td><td>反复向左<\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><\/tr><tr><td>Max<\/td><td>反复向右<\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><\/tr><tr><td>Predecessor<\/td><td>左子树最右或向上回溯祖先<\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><\/tr><tr><td>Insert<\/td><td>走到空位挂叶<\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><\/tr><tr><td>Delete<\/td><td>查节点 + 顶替链条<\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><\/tr><tr><td>OutputSorted<\/td><td>中序遍历<\/td><td><span class=\"katex-inline\">O(n)<\/span><\/td><\/tr><tr><td>Select(<span class=\"katex-inline\">i<\/span>)<\/td><td>按子树大小跳转<\/td><td><span class=\"katex-inline\">O(h)<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>除全序遍历外，其余操作都沿单条根到叶路径，比较次数不超过树高。<\/p>\n<h2>平衡调整的边界<\/h2>\n<ul><li>\n旋转是局部 <span class=\"katex-inline\">O(1)<\/span> 换位，不改中序序列；用于把过高侧压回。\n<\/li><li>\n旋转触发条件由平衡规则规定；普通 BST 插入后不自动重排。\n<\/li><li>\n旋转解决局部层级失衡，不解决键集分布问题；最坏分布仍需平衡结构兜底。\n<\/li><li>\n多次旋转可重构局部子树，但目标是恢复高度平衡，不是重排全部节点。\n<\/ul>\n<h2>结构选型对照补充<\/h2>\n<ul><li>\n<strong>需要范围查询<\/strong>（找 <span class=\"katex-inline\">[a,b]<\/span> 内全部键）：BST 可沿边界定位后中序展开；散列表无键序，做不到。\n<\/li><li>\n<strong>需要前驱后继<\/strong>：BST 沿父链与子树定位；堆只能给极值。\n<\/li><li>\n<strong>只判存在性<\/strong>：散列表期望 <span class=\"katex-inline\">O(1)<\/span>，比 BST 对数级更快。\n<\/li><li>\n<strong>动态插入频繁<\/strong>：BST 挂叶 <span class=\"katex-inline\">O(h)<\/span>，有序数组要 <span class=\"katex-inline\">O(n)<\/span> 搬动。\n<\/ul>\n<p>选型先列查询清单：有序、范围、前驱走 BST；极值优先走堆；纯存在性走散列表。<\/p>\n<h2>常见错误清单<\/h2>\n<ol><li>\n分叉方向判反，漏检目标子树。\n<\/li><li>\n旋转时子树 <span class=\"katex-inline\">B<\/span> 丢挂或重复挂靠。\n<\/li><li>\n把退化链 <span class=\"katex-inline\">O(n)<\/span> 当 BST 普遍承诺。\n<\/li><li>\n双子女删除直接摘根，子树悬空。\n<\/li><li>\nSelect 未存子树大小却按 <span class=\"katex-inline\">O(h)<\/span> 报代价。\n<\/li><li>\n认为旋转改动键值；实际只改挂靠。\n<\/ol>\n<h2>差生通读检查（补充）<\/h2>\n<ul><li>\n<strong>卡在&quot;中序为什么必然升序&quot;<\/strong>：性质递归保证左小根大；中序先左后根再右，三段次序接上即升序。\n<\/li><li>\n<strong>卡在&quot;前驱两种位置&quot;<\/strong>：有左子树取其最右；没有则向上到第一个右祖先。后继镜像。\n<\/li><li>\n<strong>卡在&quot;旋转与重组差别&quot;<\/strong>：旋转换两个节点挂靠，<span class=\"katex-inline\">O(1)<\/span>；重组整树遍历重排，代价高。平衡优先用旋转。\n<\/li><li>\n<strong>卡在&quot;高度为什么是对数目标&quot;<\/strong>：<span class=\"katex-inline\">n<\/span> 节点平衡二叉树每层约翻倍，<span class=\"katex-inline\">h\\approx\\log_2 n<\/span>；单侧过长打破翻倍结构，高度退化为线性。\n<\/ul>\n<h2>Search 算例逐路径<\/h2>\n<p>树键集 <span class=\"katex-inline\">\\{2,3,4,5,8\\}<\/span>，根 5，左 2（右 3，3 右 4），右 8。<\/p>\n<ul><li>\n查 4：5→2（<span class=\"katex-inline\">4&gt;2<\/span>）→3（<span class=\"katex-inline\">4&gt;3<\/span>）→右空位命中前判断；实际 4 是 3 右孩子，命中。\n<\/li><li>\n查 6：5→8（<span class=\"katex-inline\">6&lt;8<\/span>）→左空位，不存在。\n<\/li><li>\n查 2：5 向左命中。\n<p>每步比较排除另一子树：走左则右子树全部大于根，目标不可能在右；走右反之。路径不回退，比较次数等于路径长度。<\/p>\n<\/ul>\n<h2>Insert 算例<\/h2>\n<p>插入 6：5→8→左空位，挂 6 为 8 左叶。复核：<span class=\"katex-inline\">6&lt;8<\/span>，<span class=\"katex-inline\">5&lt;6<\/span>，性质保持；中序 <span class=\"katex-inline\">2,3,4,5,6,8<\/span>。插入只在空位挂叶，既有父子对不动，新叶方向由 Search 路径决定。<\/p>\n<h2>平衡与退化对照<\/h2>\n<ul><li>\n平衡形态：5 节点树高约 <span class=\"katex-inline\">\\lceil\\log_2 5\\rceil=3<\/span>，操作对数级。\n<\/li><li>\n退化链：有序 <span class=\"katex-inline\">1,2,3,4,5<\/span> 依次插入成右链，高 4，查找 5 走 4 步，<span class=\"katex-inline\">O(n)<\/span>。\n<\/li><li>\n平衡触发：插入删除后某侧过高，旋转把高位子树压向另一侧；单次旋转 <span class=\"katex-inline\">O(1)<\/span>，中序不变。\n<\/li><li>\n高度目标：平衡 BST 维持 <span class=\"katex-inline\">h=O(\\log n)<\/span>；普通 BST 只承诺 <span class=\"katex-inline\">O(h)<\/span>，最坏线性。\n<\/ul>\n<h2>与堆、散列表的分工<\/h2>\n<ul><li>\n频繁取极值：堆根 <span class=\"katex-inline\">O(1)<\/span>，插入抽取 <span class=\"katex-inline\">O(\\log n)<\/span>。\n<\/li><li>\n有序遍历、前驱后继、范围切片：BST 中序与父链定位。\n<\/li><li>\n纯存在性判断：散列表期望 <span class=\"katex-inline\">O(1)<\/span>，不维护键序。\n<\/li><li>\n动态有序集合：BST 在查找与插入间折中，插入挂叶不必搬动数组元素。\n<\/ul>\n<p>同一数据集可按不同查询需求配不同组织；选型先列查询清单，再定结构。<\/p>\n<h2>前驱后继定位细化<\/h2>\n<p><strong>前驱<\/strong>：节点 <span class=\"katex-inline\">u<\/span> 有左子树时，前驱是左子树的最右节点（沿右链到底）；无左子树时，向上回溯到第一个把 <span class=\"katex-inline\">u<\/span> 放在其右子树的祖先。 <strong>后继<\/strong>：对称——有右子树取右子树最左节点；无右子树向上回溯到第一个把 <span class=\"katex-inline\">u<\/span> 放在其左子树的祖先。 <strong>用途<\/strong>：有序列邻接、范围遍历的端点定位；BST 凭父链与子树方向完成，不需要全序数组支持。<\/p>\n<h2>删除顶替链条<\/h2>\n<p>双子女节点 <span class=\"katex-inline\">u<\/span>：取前驱 <span class=\"katex-inline\">p<\/span>（或后继 <span class=\"katex-inline\">s<\/span>），把 <span class=\"katex-inline\">p<\/span> 键值复制到 <span class=\"katex-inline\">u<\/span> 位置；再删除原 <span class=\"katex-inline\">p<\/span> 节点。<span class=\"katex-inline\">p<\/span> 若有子树，按叶节点或单子女情形承接。整轮操作保持 BST 性质：顶替键落在 <span class=\"katex-inline\">u<\/span> 的大小区间内，子树归属沿链条重接。代价 <span class=\"katex-inline\">O(h)<\/span>，不触发整树重组。<\/p>\n<h2>平衡结构触发直觉<\/h2>\n<p>普通 BST 插入后不自动重排；平衡规则在节点高度差越界时触发旋转。旋转把高位侧子树压向低位侧，局部恢复层级平衡。多次旋转可调整局部子树，目标是把高度维持对数级。旋转不改键值、不改中序序列，只改父子挂靠；这是它能作为平衡基本操作的原因。<\/p>\n<h2>结构选择再对照<\/h2>\n<ul><li>\n极值优先：堆。\n<\/li><li>\n有序集合动态查询：BST。\n<\/li><li>\n纯存在性极速判断：散列表。\n<\/li><li>\n静态有序只读：有序数组二分。\n<p>需求混合时可分层：外层散列表判存在，内层 BST 维护有序索引；选型先拆查询类型，不追求单一结构覆盖全部操作。<\/p>\n<\/ul>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出 BST 性质两条方向约束，说明中序遍历输出次序。\n<\/li><li>\nSearch 一个键沿什么路径下行？为什么不需要回退另一分支？\n<\/li><li>\n右旋列出 <span class=\"katex-inline\">A,a,B,b,C<\/span> 归属，核验每对父子键大小。\n<\/li><li>\n有序序列依次插入 BST 为什么退化成链？高度是多少？\n<\/li><li>\n删除双子女节点分哪几步？顶替键取前驱还是后继是否唯一？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "二叉搜索树：有序操作与旋转平衡"}, "c10": {"html": "<div class=\"source-badge\">📖 出处：算法详解 卷2 图算法和数据结构.pdf · p.167<\/div><h1>散列表：散列函数、冲突解决、负载因子与布隆过滤器<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch04（原书 §6.1–6.6，PDF 第 159、167–186 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>散列表把键经散列函数映射到槽位编号，期望 <span class=\"katex-inline\">O(1)<\/span> 完成插入与存在性查找；冲突由链地址法（槽位挂链表）或开放地址法（槽内探查空位）解决，负载因子决定平均探查长度。布隆过滤器是多位散列加位数组的紧凑成员判断结构，只支持插入与查找，允许假阳性、不允许假阴性。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>有序结构（BST、有序数组）查找代价随高度或对数增长；许多场景只需要快速判断&quot;这个键在不在集合里&quot;，不需要键序与范围查询。散列表用散列函数把键直接算到存储位置，省去比较查找过程。冲突不可避免：槽位数少于键数，不同键可能落到同一槽；需要冲突解决规则把同槽对象组织起来。负载升高后探查链变长，性能随负载退化，还要会估负载、选冲突策略。<\/p>\n<p>不解决冲突会出两类错。一是假设映射一一对应，同槽键互相覆盖，对象丢失。二是忽略负载因子，表快填满时插入查找变慢，仍按常数时间估算。本概念把散列函数要求、两类冲突解决、负载性能与布隆过滤器边界讲清。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>散列函数 <span class=\"katex-inline\">h<\/span><\/strong>：把键映射到槽位编号 <span class=\"katex-inline\">\\{0,1,\\dots,m-1\\}<\/span>。好的散列函数把相似键分散到不同槽，分布均匀，避免聚集。 <strong>槽位（桶）<\/strong>：散列表数组的一个位置；链地址法下挂一个链表，开放地址法下存单个对象或空位。 <strong>冲突<\/strong>：两个不同键 <span class=\"katex-inline\">x\\neq y<\/span> 满足 <span class=\"katex-inline\">h(x)=h(y)<\/span>。槽位少于键数时冲突不可避免。 <strong>链地址法<\/strong>：每个槽位挂链表，同槽对象追加到链尾；查找沿链表比较键。删除直接摘链。 <strong>开放地址法<\/strong>：冲突时按探查序列（线性探查、双重散列等）找下一个空位；每槽最多一个对象，负载不超过 1。 <strong>负载因子 <span class=\"katex-inline\">\\alpha<\/span><\/strong>：已存对象数 <span class=\"katex-inline\">n<\/span> 与槽位数 <span class=\"katex-inline\">m<\/span> 之比，<span class=\"katex-inline\">\\alpha=n/m<\/span>。链地址法可超过 1，开放地址法达到 1 无法再插入。 <strong>散列冲突与散列碰撞<\/strong>：碰撞即同槽；均匀散列下碰撞概率由负载决定。 <strong>布隆过滤器<\/strong>：位数组加 <span class=\"katex-inline\">k<\/span> 个散列函数；插入对象把 <span class=\"katex-inline\">k<\/span> 个位置置 1；查找检查 <span class=\"katex-inline\">k<\/span> 位全 1 才判存在。 <strong>假阳性/假阴性<\/strong>：未插入对象被误判存在为假阳性；已插入对象被判不存在为假阴性。布隆过滤器只可能假阳性，不可能假阴性。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">m=10<\/span>，<span class=\"katex-inline\">n=5<\/span>，<span class=\"katex-inline\">\\alpha=0.5<\/span>；链地址法平均链长 0.5，查找常数级。 <strong>反例<\/strong>：<span class=\"katex-inline\">n=100,m=10<\/span>，<span class=\"katex-inline\">\\alpha=10<\/span>；平均链长 10，查找随负载线性变长；散列函数若把相似键聚到同槽，实际更差。<\/p>\n<h2>原理推导：负载与探查长度<\/h2>\n<ol><li>\n<strong>均匀散列假设<\/strong>：键落入各槽概率均等；同一槽对象数期望为 <span class=\"katex-inline\">\\alpha<\/span>。\n<\/li><li>\n<strong>链地址法期望<\/strong>：平均链表长 <span class=\"katex-inline\">\\alpha<\/span>；查找成功比较约 <span class=\"katex-inline\">\\alpha/2<\/span>，失败扫完整链 <span class=\"katex-inline\">\\alpha<\/span>。<span class=\"katex-inline\">\\alpha<\/span> 小时常数级，<span class=\"katex-inline\">\\alpha<\/span> 增大线性退化。\n<\/li><li>\n<strong>开放地址法<\/strong>：空位探查序列长度随 <span class=\"katex-inline\">\\alpha<\/span> 趋近 1 快速上升；负载 1 时无空位可插。\n<\/li><li>\n<strong>扩容重散列<\/strong>：负载超阈值时扩大槽位数，重散列全部键；均摊插入被扩容代价摊薄。\n<\/li><li>\n<strong>布隆过滤器假阳性来源<\/strong>：某对象的 <span class=\"katex-inline\">k<\/span> 个位恰被其他对象置 1，对象未插入也判存在；已插入对象的位必然保持 1，故不漏报。\n<\/li><li>\n<strong>空间权衡<\/strong>：布隆过滤器不存对象本体，位数组紧凑；代价是容忍假阳性，且不支持删除（一位被多对象共享）。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：存在性判断、去重、两数之和查补集、状态空间记录；不需要键序与范围查询。\n<\/li><li>\n边界 1：散列表不维护有序；范围查询、前驱后继需另配结构。\n<\/li><li>\n边界 2：开放地址法删除复杂，删除标记需特殊处理；大量删除场景更适合链地址法。\n<\/li><li>\n边界 3：布隆过滤器不支持删除；要删除需计数布隆等变体。\n<\/li><li>\n边界 4：散列函数分布不良会使聚集加剧，再好的冲突策略也救不回查找代价。\n<\/li><li>\n失败案例：负载接近 1 仍不扩容，开放地址法探查链越来越长；链地址法长链把常数查找拖成线性。\n<\/li><li>\n失败案例：把布隆过滤器当精确集合用，依据假阳性结果做不可逆操作；过滤器结论只作&quot;可能存在&quot;的初筛。\n<\/li><li>\n失败案例：期待散列表按键序遍历；散列位置与键序无关。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>链地址法 vs 开放地址法<\/strong>：前者槽位挂链、可超负载、删除方便；后者槽内探查、负载 ≤1、删除需标记。空间紧选后者，删除多选前者。\n<\/li><li>\n<strong>散列表 vs BST<\/strong>：散列表期望 <span class=\"katex-inline\">O(1)<\/span> 存在性，不维护键序；BST 支持有序操作，代价 <span class=\"katex-inline\">O(\\log n)<\/span>。\n<\/li><li>\n<strong>假阳性 vs 假阴性<\/strong>：误报存在 vs 漏报已存在；布隆过滤器只许前者。\n<\/li><li>\n<strong>散列函数 vs 加密哈希<\/strong>：散列函数求分布均匀与速度；加密哈希求抗碰撞，用途不同，不可混用要求。\n<\/ul>\n<h2>一个负载对照演示<\/h2>\n<p><span class=\"katex-inline\">m=10<\/span> 槽：<span class=\"katex-inline\">n=5<\/span> 时 <span class=\"katex-inline\">\\alpha=0.5<\/span>，平均链长半格，查找常数级；<span class=\"katex-inline\">n=10<\/span> 时 <span class=\"katex-inline\">\\alpha=1<\/span>，链长约 1；<span class=\"katex-inline\">n=30<\/span> 时 <span class=\"katex-inline\">\\alpha=3<\/span>，平均链长 3，比较负担随负载线性上升。开放地址法在 <span class=\"katex-inline\">\\alpha<\/span> 接近 1 时探查空位越来越远，必须扩容重散列。散列函数若把相似键聚到同槽，实际链长比均匀假设更差。<\/p>\n<h2>常见误判<\/h2>\n<ul><li>\n误判：散列表查找一定 <span class=\"katex-inline\">O(1)<\/span>。这是均匀散列、低负载下的期望；聚集或高负载时探查链变长，代价随负载增长。\n<\/li><li>\n误判：布隆过滤器会漏报。已插入对象的位保持置位，查找必命中；错误方向只有假阳性。\n<\/li><li>\n误判：开放地址法可无限插入。每槽一个对象，负载到 1 即无法再插，需扩容。\n<\/li><li>\n误判：散列表能按键序遍历。散列位置与键序无关，有序查询要换 BST 类结构。\n<\/ul>\n<h2>两类冲突策略的选择<\/h2>\n<p>链地址法在槽位挂链表，同槽对象追加链尾，删除摘链直接，负载可超过 1，代价随平均链长增长；空间上要为链表指针付额外开销。开放地址法槽内探查空位，每槽一个对象，负载上限 1，删除需墓碑标记，内存更紧凑但删除复杂。空间优先、删除少选开放地址；删除频繁、负载可能偏高选链地址法。探查技巧上，线性探查实现简单但易形成连续块，双重散列分散更好，具体选择按实测与内存层次决定。<\/p>\n<h2>散列表与布隆过滤器的分工<\/h2>\n<p>散列表存键本身（或键值对），支持精确存在性与取值；布隆过滤器只存多位标志，不存对象，空间更紧，结论允许假阳性。工程链路常把布隆过滤器前置初筛：判&quot;一定不在&quot;直接拒绝，判&quot;可能在&quot;再查散列表或后端存储。两者不是替代关系，而是按空间与错误容忍度分层使用。<\/p>\n<h2>失败方向复核<\/h2>\n<p>散列表的失败主要来自聚集与高负载：散列函数把相似键压到同槽，或 <span class=\"katex-inline\">\\alpha<\/span> 接近 1 仍不扩容，查找从常数退化为长链遍历。布隆过滤器的失败方向固定为假阳性，不产生假阴性；标准结构不支持删除，一位被多对象共享，清位会连带抹除他人标记。两类结构都不维护键序，需要范围切片或前驱后继时应换搜索树。<\/p>\n<h2>联系<\/h2>\n<p>前置：无前置结构概念；可比较键不是必需，散列只要求可映射。后继：c09 的 BST 与本章散列表构成有序/无序两条路线；布隆过滤器的空间—错误权衡思想在缓存预热、去重、状态过滤场景复用。散列表是现代符号表、字典与索引的常用实现。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（散列表：散列函数、冲突解决、负载因子与布隆过滤器）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：散列映射、冲突负载核算与布隆过滤器权衡<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>讲清查散列表，往回追四层：<\/p>\n<ol><li>\n<strong>键到位置的映射<\/strong>：散列函数把任意键折算成槽位编号；分布均匀是性能前提。\n<\/li><li>\n<strong>冲突不可避免<\/strong>：槽少键多，同槽必然出现；需要组织同槽对象的规则。\n<\/li><li>\n<strong>负载性能<\/strong>：对象数与槽位数之比决定探查/链长；负载越高压查代价上升。\n<\/li><li>\n<strong>紧凑近似结构<\/strong>：布隆过滤器用多位散列换空间，错误方向限定为假阳性。\n<\/ol>\n<p>依赖链方向：散列映射 → 冲突组织 → 负载与扩容 → 近似成员判断。<\/p>\n<h2>正向推导：散列函数与槽位映射<\/h2>\n<p><strong>步骤 1：函数口径<\/strong>。<span class=\"katex-inline\">h:K\\to\\{0,1,\\dots,m-1\\}<\/span>，<span class=\"katex-inline\">K<\/span> 为键集合。相同键必须映射同槽；不同键尽量分散。 <strong>步骤 2：均匀性要求<\/strong>：每个槽承接键数期望接近 <span class=\"katex-inline\">n/m<\/span>；相似键（前缀相同、编号相邻）不应落到相邻或同一槽。 <strong>步骤 3：常见构造思路<\/strong>：把键折算成整数，取模槽位数；或乘法散列取小数部分位。本书 §6.3.6 讨论良好散列函数的性质：分布均匀、计算快速、对典型输入不聚集。 <strong>步骤 4：冲突定位<\/strong>。<span class=\"katex-inline\">x\\neq y<\/span> 而 <span class=\"katex-inline\">h(x)=h(y)<\/span> 即碰撞；<span class=\"katex-inline\">m&lt;n<\/span> 时由抽屉原理，碰撞必然存在。 <strong>步骤 5：与表示形式分工<\/strong>：散列函数决定位置，冲突解决决定同槽内怎么存；两者分开设计。<\/p>\n<h2>正向推导二：两类冲突解决<\/h2>\n<p><strong>链地址法<\/strong>：<\/p>\n<ol><li>\n槽位 <span class=\"katex-inline\">i<\/span> 挂链表 <span class=\"katex-inline\">L_i<\/span>；插入把键追加到 <span class=\"katex-inline\">L_{h(x)}<\/span>。\n<\/li><li>\n查找沿 <span class=\"katex-inline\">L_{h(x)}<\/span> 逐项比较键；命中返回，链空或扫完未中即不存在。\n<\/li><li>\n删除从链中摘除节点；指针操作直接。\n<\/li><li>\n负载可超 1：<span class=\"katex-inline\">\\alpha&gt;1<\/span> 时平均链长超过 1，性能随 <span class=\"katex-inline\">\\alpha<\/span> 增长。\n<\/ol>\n<p><strong>开放地址法<\/strong>：<\/p>\n<ol><li>\n槽位只存一个对象；冲突时按探查序列找空位。\n<\/li><li>\n线性探查：<span class=\"katex-inline\">i,i+1,i+2,\\dots<\/span> 环绕；双重散列：第二步长由另一散列函数定。\n<\/li><li>\n查找沿同一探查序列；遇空位即不存在。\n<\/li><li>\n删除不能直接清空，否则截断探查链；需墓碑标记占位。\n<\/li><li>\n负载 <span class=\"katex-inline\">\\alpha&lt;1<\/span>，达到 1 无空位可插，必须扩容。\n<\/ol>\n<h2>数值算例一：链地址法负载对照<\/h2>\n<p><span class=\"katex-inline\">m=10<\/span> 槽，键集按散列分布。<\/p>\n<ul><li>\n<strong><span class=\"katex-inline\">n=5<\/span>，<span class=\"katex-inline\">\\alpha=0.5<\/span><\/strong>：平均链长 0.5；查找成功平均比较约 0.25，失败扫平均半条链。\n<\/li><li>\n<strong><span class=\"katex-inline\">n=10<\/span>，<span class=\"katex-inline\">\\alpha=1<\/span><\/strong>：平均链长 1；查找常数级偏紧。\n<\/li><li>\n<strong><span class=\"katex-inline\">n=30<\/span>，<span class=\"katex-inline\">\\alpha=3<\/span><\/strong>：平均链长 3；成功比较约 1.5，失败扫 3，线性负担显现。\n<\/li><li>\n<strong><span class=\"katex-inline\">n=100,m=10<\/span>，<span class=\"katex-inline\">\\alpha=10<\/span><\/strong>：平均链长 10；散列不均时个别链更长，查找退回长链遍历。\n<\/ul>\n<p>扩容方向：<span class=\"katex-inline\">\\alpha<\/span> 超阈值（常见 0.7–0.9 依策略）时 <span class=\"katex-inline\">m<\/span> 翻倍，全部键重散列；均摊代价把一次性扩容摊到多次插入。<\/p>\n<h2>数值算例二：布隆过滤器置位与判定<\/h2>
