——音调关系可编码后由机器改编；机器织出代数图案，正如提花机织出花叶（PDF 第 132 页）。反例：差分机只能沿固定差分路径出表，程序嵌在齿轮位置里，卡片换不了任务。<\/p>\n<h2>原理推导<\/h2>\n<p>先推差分机的能力边界。多项式表的相邻项有固定差分关系，装置按差分一步步摇出下一项；它自动化的是重复算术，不通用。巴贝奇看清其局限：仅通过相加差分，不能计算每一种数、解决每一个数学问题（PDF 第 125 页）。<\/p>\n<p>再推分析机需要补的分工。要让同一台机器换做不同计算，运算规则必须像数值一样可送入、可更换。于是机器分成仓库与工场：数值暂存仓库，运算在工场执行；两类卡片分别编排变量与操作。推演成立条件：数值可暂存可读出；操作可编码成卡片序列；工场按卡片取数、运算、回写。<\/p>\n<p>接着推编码抽象从布匹到数值。雅卡尔卡片把图案转成孔位，丝线颜色可换而图案不变；巴贝奇强调把信息从物理载体抽象出来这一概念（PDF 第 125 页）。爱达在注释中把机器对象分得更清：被加工的数与加工数的规则；运算被定义为改变两种或多种事物之间相互关系的过程，涵盖宇宙间一切主题（PDF 第 131 页）。机器从处理数的机器变成处理信息的机器。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：运算步骤可分解为有限基本操作；数值与操作都可编码成可顺序读取的符号；机器有暂存区存放中间结果。\n<\/li><li>\n边界一：分析机停留在设想与注释层面，未建成运转；其通用性来自概念分工，不代表当时工程已实现电子存储程序。\n<\/li><li>\n边界二：机器不自行创造运算规则。爱达区分机器与操作者：机器只能执行我们教它执行的步骤；它的普遍性在于可编排任意有限步骤，不在自动产生意图。\n<\/li><li>\n失败案例：把操作规则固化在机械结构里，机器退化为专用表生成装置；没有可更换的指令载体，可编程性不成立。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>专用计算机器 vs 通用机器<\/strong>：差分机任务内嵌结构，换任务要改机械；分析机靠卡片换程序，结构不变而操作可变。\n<\/li><li>\n<strong>数据 vs 指令<\/strong>：在分析机中二者都以卡片进入机器，但角色不同：数据是被加工对象，指令是加工规则；后世存储程序计算机把二者放进同一存储器。\n<\/li><li>\n<strong>机械实现 vs 抽象分工<\/strong>：齿轮、卡片是当时载体；仓库—工场分工是抽象结构，可由继电器、晶体管重新实现。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 符号映射；卡片把变量与操作分别编成符号。后继：c06 电报把字母编成点划序列，c09 把讯息看成可编码符号序列；第 6 章香农用继电器实现与、或、否电路，把分析机的运算分工接到电气装置上。爱达关于机器可处理任意有意义关系的设想，是后来通用计算与机器思维讨论的先声（c10）。<\/p>\n<p>补充对照：雅卡尔织布机的打孔卡片先把织布花纹编入穿孔模式；巴贝奇把卡片思路搬到计算，变量卡片提供数、运算卡片指定操作（PDF 第 125、131 页）。梅纳布雷亚据巴贝奇讲演写成报告，爱达 1843 年译注篇幅近原论文三倍，并给出计算伯努利数的程序步骤（PDF 第 133–134 页）。分析机未实际建成，但存储与运算分离、指令与数据分别编排这两条结构，在后世通用计算机里保留下来；运算被定义为改变两事物之间的关系，而不是某一种固定算术。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（分析机与可编程机械：存储与运算分离的齿轮前身）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：差分机局限、仓库工场分工与可编程性成立条件<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把分析机为什么是通用机器前身讲成可推演链条，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先分清专用表生成与通用计算<\/strong>。差分机沿固定差分路径出表，任务内嵌结构；通用机要靠更换指令切换任务。两者边界不清，可编程性论证就落不到实处。\n<\/li><li>\n<strong>确认数值与操作都可编码<\/strong>。通用机要求被加工的数与加工数的规则都能变成可顺序读取的符号；只有数可编码、操作固化在机械里，机器仍是专用装置。\n<\/li><li>\n<strong>确认暂存与运算可分离<\/strong>。数值要能暂存、读出、回写，运算在另一部件执行；没有暂存区，中间结果无处存放，多步计算无法展开。\n<\/li><li>\n<strong>确认指令载体可更换<\/strong>。程序要能以卡片一类可更换符号进入机器，而不是刻在齿轮位置上；载体不可换，换任务必须改机械。\n<\/ol>\n<p>依赖链方向：专用机局限 → 数值与操作可编码 → 暂存与运算分离 → 指令载体可更换 → 可编程通用机。任何一层缺失：操作不可编码则退化为差分机；无暂存则多步计算断链；指令不可换则换任务改机械。<\/p>\n<h2>正向推导：从差分机边界推到分析机分工<\/h2>\n<h3>第一步：推差分机的能力边界<\/h3>\n<p>多项式表的相邻项有固定差分关系，装置按差分一步步摇出下一项；它自动化的是重复算术，不通用。巴贝奇看清其局限：仅通过相加差分，并不能计算出每一种数、解决每一个数学问题（PDF 第 125 页）。差分机适合批量造表，换多项式要改动齿轮与凸轮结构；装置结构内嵌计算规则，卡片换不了任务。<\/p>\n<h3>第二步：推分析机需要补的分工<\/h3>\n<p>要让同一台机器换做不同计算，运算规则必须像数值一样可送入、可更换。机器分成仓库与工场：数值暂存仓库，运算在工场执行；变量卡片送入待处理的数，运算卡片送入要做的操作，两类卡片分别编排（PDF 第 125–129 页）。推演成立条件：数值可暂存可读出；操作可编码成卡片序列；工场按卡片取数、运算、回写。<\/p>\n<h3>第三步：推编码抽象从布匹到数值<\/h3>\n<p>雅卡尔提花机把布匹图案编码存储在打孔卡片上，卡片置入后机器按孔位纺织。巴贝奇取走的不是纺织过程，而是图案从一种媒介转换到另一种媒介的编码过程；丝线颜色可换而图案不变（PDF 第 125 页）。他强调把信息从物理载体抽象出来这一概念：载体材料更换，图案规则保留。这一步把提花机的卡片控制迁移到数值与操作编码。<\/p>\n<h3>第四步：推爱达对机器对象的区分<\/h3>\n<p>梅纳布雷亚记述分析机结构，爱达 1843 年译出报告并作注，注释 A 到 G，长度将近论文三倍（PDF 第 131 页）。她把机器对象分得更清：被加工的数与加工数的规则；运算被定义为改变两种或多种事物之间相互关系的过程，涵盖宇宙间一切主题（PDF 第 131 页）。机器从处理数的机器变成处理信息的机器：理论上可操纵语言、谱写乐曲，音调关系可编码后由机器改编（PDF 第 132 页）。<\/p>\n<h3>第五步：推程序样例的结构<\/h3>\n<p>爱达设计假想程序计算伯努利数：伯努利数由 1 到 n 的整数次幂求和产生，无法用直接公式生成，需一步步扩展特定公式并逐步查看系数（PDF 第 132 页）。程序样例把多步运算、中间结果暂存、逐步系数检查串成卡片序列；这是后世程序控制流在机械装置上的雏形。<\/p>\n<h3>第六步：推机器能力边界<\/h3>\n<p>机器不自行创造运算规则。爱达区分机器与操作者：机器只能执行我们教它执行的步骤；它的普遍性在于可编排任意有限步骤，不在自动产生意图。分析机未实际建成运转，通用性来自概念分工；齿轮卡片是当时载体，仓库—工场结构可由继电器、晶体管重新实现。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：差分法出表路径<\/h3>\n<p>给定多项式相邻项的一阶差分、二阶差分，装置从初始值出发，每步把差分相加摇出下一项；差分关系固定，更换多项式要重新安排齿轮位置。差分机自动化的是表内重复算术，不能在同一结构内换算另一类问题。<\/p>\n<h3>算例 2：仓库—工场分工对照<\/h3>\n<p>仓库存放变量数值与中间结果，工场执行运算。一次运算：仓库取两个数送入工场，工场按运算卡片执行加法，结果回写仓库。变量卡片决定取哪些数，运算卡片决定做哪种操作；两类卡片分别更换，机器任务随之切换。<\/p>\n<h3>算例 3：卡片编码的孔位对照<\/h3>\n<p>雅卡尔卡片以孔位表示图案：有孔无孔对应丝线起落；分析机卡片以孔位表示变量选择与操作选择。同一套打孔介质承载两种编码对象，孔位规则不同。载体是纸板，编码抽象是孔位序列。<\/p>\n<h3>算例 4：伯努利数逐步扩展<\/h3>\n<p>伯努利数无法直接公式生成，程序先举简单例子，一步步扩展特定公式，每一步查看系数；中间结果留在仓库，下一步取用上一步系数。步骤表由爱达在注释中给出，被后世视为最早的程序样例（PDF 第 132–133 页）。<\/p>\n<h3>算例 5：通用性推演<\/h3>\n<p>若机器只处理数，输入输出都是数值；按爱达的运算定义，改变两事物关系的过程都可编码，音调关系可入机器作曲，语言关系可入机器分析（PDF 第 132 页）。通用性边界是：关系可分解为有限基本操作；不可分解为有限步骤的任务，机器样例也无法编排。<\/p>\n<h3>算例 6：数据与指令同形对照<\/h3>\n<p>在分析机中，变量卡片与运算卡片都是打孔序列，角色不同：数据是被加工对象，指令是加工规则。后世存储程序计算机把二者放进同一存储器；分析机阶段二者分卡编排，但都以可更换符号进入机器。<\/p>\n<h3>算例 7：专用机退化路径<\/h3>\n<p>去掉可更换指令载体，运算规则固化在齿轮结构里；机器只能沿固定差分路径出表，换任务要改机械。这是差分机状态，也是分析机设想被抽掉可编程前提后的退化形态。<\/p>\n<h3>算例 8：载体换代而结构保留<\/h3>\n<p>齿轮卡片 → 继电器电路 → 晶体管存储器，物理实现多次换代；仓库（存储）与工场（运算）的职责划分保留。看后世机器先按职责对号入座，再谈工艺差异，结构分工不随载体换代改变。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>分析机不能把指令编成卡片送入<\/strong>：运算规则固化在机械结构里，机器退化成差分机一类专用表生成装置；换任务必须改机械，可编程性不成立。\n<\/li><li>\n<strong>数值与操作混在同一类卡片<\/strong>：取数与操作步骤无法区分编排，工场不知道当前卡片是给数还是给命令；两类卡片分工是可编程性的结构要求。\n<\/li><li>\n<strong>没有暂存区存放中间结果<\/strong>：多步计算的中间数无处留存，下一步无法取用上一步结果；伯努利数这类逐步扩展的程序跑不起来。\n<\/li><li>\n<strong>机器自行创造运算规则<\/strong>：按爱达区分，机器只执行编排好的步骤；若假设机器自动产生意图，超出分析机概念分工，也超出后世通用机的指令边界。\n<\/ul>\n<h2>延伸层：从分析机到存储程序的结构演进<\/h2>\n<p>把时间拉开一层：巴贝奇设想存储与运算分离、指令与数据分别编码，但受限于当时材料与工具，机器未建成。爱达注释把通用性设想推得比巴贝奇本人更远，提出机器可处理任意有意义关系。后世电子计算机把指令与数据放进同一存储器，处理器取指译码执行；仓库—工场分工演化为内存与处理器分工。分析机留下的不是一台可用机器，而是通用计算的概念骨架：可暂存数据、可更换指令、可分步执行有限操作。<\/p>\n<h2>补足推导：前提塌陷点、执行不变量与可组合性<\/h2>\n<p>分析机可编程性成立依赖三条前提：变量与操作都可编码成卡片；仓库可读写暂存；工场按卡片序列取数运算回写。去掉编码前提，操作无法进入机器；去掉暂存，中间结果丢失；去掉顺序执行，卡片无法串成步骤。执行不变量：当前运算对象在仓库待取，运算卡片指向下一操作，结果回写对应仓库位置；每转一圈，卡片前进到下一编排步骤。可组合性：基本运算可按卡片序列组合成复杂过程，伯努利数程序就是基本步骤的多层组合。爱达关于机器可操纵语言、谱写音乐的设想，是可组合性向数值以外关系的推广；其边界仍在有限可描述步骤之内。<\/p>\n<h2>补充算例与延伸辨析<\/h2>\n<h3>补充算例四：仓库与工场的分工走查<\/h3>\n<p>分析机分仓库与工场：仓库存数，工场执行运算。变量卡片提供数值，运算卡片指定操作；指令与数据分别编排（PDF 第 125、131 页）。差分机用有限差分法计算多项式表，面向固定计算；分析机把运算步骤也编成卡片，换卡片就换任务，具备通用可编程结构。两条机器的差别不在齿轮精度，而在操作步骤是否可由外部卡片更换。<\/p>\n<h3>补充算例五：爱达译注与伯努利数程序<\/h3>\n<p>梅纳布雷亚据巴贝奇讲演写成分析机报告；爱达 1843 年译注，篇幅近原论文三倍，补入自己的解释与程序步骤，其中包含计算伯努利数的程序安排（PDF 第 133–134 页）。她把运算理解为改变两事物之间的关系：数值进入工场，关系被改变，结果送回仓库。程序由卡片序列编排，卡片更换后同一台机械执行不同运算。<\/p>\n<h3>延伸辨析：分析机与差分机<\/h3>\n<p>差分机解决多项式制表这一类固定任务，运算规则固化在齿轮机构里；分析机把变量与操作分别编成卡片，可编排步骤序列。可编程性的核心不是「能算数」，而是操作步骤可由外部介质更换、同一硬件换指令换任务。后世通用计算机保留存储与运算分离、指令与数据分别编排两条结构，换的是继电器、晶体管等工艺，不是职责划分。<\/p>\n<h3>边界走查：未建成与思想落地<\/h3>\n<p>分析机在巴贝奇时代未实际建成，齿轮加工精度与资金条件受限；但存储运算分离、卡片编码、步骤可编程这三条结构被后续设计继承。评估这类设想时，区分机械实物是否造出与结构思想是否成立：未建成不等于结构不可行，结构可行性要靠后世实现对照检验。<\/p>\n<h3>延伸辨析：卡片作为编码介质<\/h3>\n<p>雅卡尔织布机先把花纹编入打孔卡片；巴贝奇把卡片思路从花纹搬到数值与操作。卡片孔洞是可分辨符号，孔位组合对应变量或指令。同一编码抽象（c01）落到卡片介质：孔位集合为符号，变量与运算为对象，穿孔规则为映射。这一介质后来影响电报穿孔纸带与早期程序存储，载体不同，卡片编码结构延续。<\/p>\n<h2>再算一例与边界补推<\/h2>\n<h3>补充算例六：卡片分工走查<\/h3>\n<p>变量卡片提供进入工场的数值，运算卡片指定对两数执行的操作；结果送回仓库暂存，下一步卡片再取数运算（PDF 第 131 页）。步骤序列由卡片编排，换一套卡片序列，同一台机械执行另一项计算。差分机的运算规则固化在齿轮机构里，面向多项式制表；分析机把操作步骤也外部化成卡片，通用可编程结构由此成立。<\/p>\n<h3>边界补推：实物未建成与结构成立分开<\/h3>\n<p>分析机受齿轮加工精度与资金条件限制未实际建成；存储运算分离、卡片编码、步骤可编程三条结构被后世设计继承。评估时把两层分开：机械实物是否造出受当时工艺约束，结构思想是否成立由后续实现对照检验。未建成不能直接推出结构不可行，结构可行也不代表当时工艺能落地。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n差分机与分析机在程序固化位置上差别在哪？\n<\/li><li>\n仓库与工场各承担什么职责？\n<\/li><li>\n雅卡尔卡片给巴贝奇的启发是纺织过程还是编码过程？\n<\/li><li>\n变量卡片与运算卡片各编码什么？\n<\/li><li>\n伯努利数为什么需要逐步扩展而不能直接公式生成？\n<\/li><li>\n机器普遍性与自动产生意图的分界在哪里？\n<\/ol>\n<h2>自检问题<\/h2>\n<ol><li>\n用自己的话说明可编程性为什么要求指令可更换。\n<\/li><li>\n推一下：没有暂存区，多步计算会断在哪一环？\n<\/li><li>\n数据与指令在分析机中角色有何不同？\n<\/li><li>\n爱达怎样把机器从处理数推广到处理信息？\n<\/li><li>\n分析机的概念分工在后世电子计算机中对应哪些部件？\n<\/ol><\/div><\/details>", "c06": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/信息/信息简史 (［美］詹姆斯•格雷克 (作者) 高博 (译者)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.162<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">编码与符号映射：两类事物之间的任意对应<\/a><\/span><\/div><h1>电报与不等长编码：按符号频率分配码长<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（第 5 章 地球的神经系统，PDF 第 147–186 页；频次统计见第 1 章 PDF 第 38–39 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>远距离传讯在电报之前靠信号灯、马匹与邮政，速度受人和交通工具限制。电报要解决两个分开的问题：物理上怎样让电流跨距离保持可辨，符号上怎样把字母编成电路通断序列。指针式电报用多根电线控制磁针排列，设备笨重、速度慢；摩尔斯的洞见是退回最简单的电路通断，用一系列中断组织意义。不区分物理中继与符号编码两层，就看不出电报网络怎样同时靠继电器放大信号、靠不等长码长压缩平均时间。<\/p>\n<h2>定义<\/h2>\n<p><strong>电报编码<\/strong>：把字母与词编成电路通断序列的符号系统；摩尔斯路线只用电路通断，不用磁针，信号就是电流的中断（PDF 第 162 页）。<\/p>\n<p><strong>不等长编码<\/strong>：出现概率高的符号配短码，罕见符号配长码。摩尔斯电码中最常见的 E 用一个点，Q、X、Z 等罕见字母用更长的点划序列；码长参照字母在真实文本中的出现频次安排。<\/p>\n<p><strong>中继器（relay）<\/strong>：弱电流操纵电磁铁、再接通新电池驱动的新电路的装置；词本来指替换疲惫马匹的健壮马匹。衰弱电流经中继器激活新电路，把信号重新放大，扫除远距离电报的最大障碍（PDF 第 162 页）。<\/p>\n<p><strong>键<\/strong>：韦尔精简出的发送端界面，一根弹簧支承的杠杆，手指触碰控制电路通断；比库克–惠特斯通的按钮曲柄快至少一个数量级（PDF 第 162 页）。<\/p>\n<p>正例：1844 年华盛顿至巴尔的摩线路，普拉特街火车站段线路悬在六米多高木杆上，报告可每分钟传输三十个字符（PDF 第 163 页）。反例：库克–惠特斯通六线三回路指针装置，一个信号至少两秒钟，排列组合多而操作笨重（PDF 第 160–161 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>先推物理层：信号为什么会衰减。电流沿长线流动逐渐衰弱，远端电磁铁驱动不了；靠加大功率沿线放大，噪声与衰减一起积累。中继器换思路：衰弱电流不直接驱动远端，而是操纵本地电磁铁，电磁铁再接通新电池供电的新电路，信号在每段线路上重新起步（PDF 第 162 页）。约瑟夫·亨利与爱德华·戴维几乎同时想到这一组合。<\/p>\n<p>再推符号层：码长为什么按频率分配。长文本里各字母出现概率悬殊。韦尔翻阅报社铅字盘统计用量：约 12000 个 E、9000 个 T、只有约 200 个 Z（PDF 第 38–39 页）。若所有字母等长，平均码长由最罕见字母决定；不等长把短码让给高频字母，长码留给低频字母，平均每字符码长下降。原书记录这套安排距理论最优仍有约 15% 的差距（PDF 第 39 页）。<\/p>\n<p>接着推编码的中间层。摩尔斯系统建立在字母表上：点划只表示字母，字母组词，词再对应口语；点划与口语语音无直接联系（PDF 第 40 页）。这与鼓语直接映射声调不同。编码需要停顿区分：点、划、词间停顿、句间停顿共同构成可分辨符号序列，接收端靠停顿把点划切成字母。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：字母表固定；文本频次分布可统计；信道符号（点、划、停顿）可被分辨；两端共享码本。\n<\/li><li>\n边界一：不等长编码的收益依赖频次分布不均。各字母概率接近均匀时，长短码节省有限；若文本换成频率分布不同的语言，码长安排要重估。\n<\/li><li>\n边界二：码长受可分辨性约束。短码之间要能靠点划模式与停顿区分，不能把高频字母压到无法辨认；频次最优与解码可分辨性要折中。\n<\/li><li>\n失败案例：只优化物理中继、不优化符号编码，线路拉长后平均时间仍被低频字母拖长；只做不等长码、没有中继器，信号到远端衰弱不可辨。两层缺一不可。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>电报码 vs 鼓语<\/strong>：电报经字母表中转，点划不直接表音；鼓语是口语变形，无中间层。两者都靠冗余与停顿消歧，但抽象层级不同。\n<\/li><li>\n<strong>中继放大 vs 功率放大<\/strong>：中继器分段重发信号，不放大沿线噪声积累；单纯加大发射功率会把噪声一起带走。\n<\/li><li>\n<strong>不等长码 vs 等长码<\/strong>：等长码解码规则简单、无需频次表；不等长码压低平均码长，代价是解码需按码本切分序列。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 编码映射，c02 冗余消歧。后继：c08 香农熵给出平均码长的理论下界——不等长码压缩的极限由信源不确定性决定；c09 信道模型把电报作为典型离散系统纳入；继电器在 c05 延伸线索与第 6 章中被改造成逻辑开关（PDF 第 193 页）。<\/p>\n<p>补充对照：韦尔统计铅字盘频次，E 约一万二千次、T 约九千次、Z 约两千次，据此把常见字母配短码；最终码长分布距理论最优约一成五（PDF 第 160–163 页）。继电器最初为电报中继器而设，把弱电流重发以延长线路；同一装置后来被组合成逻辑电路。博多码改用五单位固定长度，三十二种组合对应字母与控制符号，是电报从人工点划走向机械编码的一步（PDF 第 218 页）。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（电报与不等长编码：按符号频率分配码长）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：中继放大、频次码长与不等长编码效率<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>电报案例要推到可检验，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先分物理层与符号层<\/strong>。物理层解决信号跨距离保持可辨，符号层解决字母如何编成通断序列；两层混在一起，分不清中继器与码长各解决什么问题。\n<\/li><li>\n<strong>确认信号会衰减<\/strong>。电流沿长线流动逐渐衰弱，远端电磁铁驱动不了；先承认衰减约束，才理解中继器为什么必要。\n<\/li><li>\n<strong>确认字母频次不均匀<\/strong>。长文本各字母出现概率悬殊；频次分布可统计，不等长码才有分配依据。\n<\/li><li>\n<strong>确认字母表中间层存在<\/strong>。摩尔斯系统经字母表中转，点划表示字母、字母组词；中间层使编码与口语语音脱钩。\n<\/ol>\n<p>依赖链方向：信号衰减 → 中继分段重发 → 频次统计 → 不等长码分配 → 停顿切分可解码。物理层保证信号到得了，符号层保证传得快、辨得清；两层缺一，电报要么跨不了距离，要么平均效率被低频字母拖长。<\/p>\n<h2>正向推导：从衰减与频次推到电报编码<\/h2>\n<h3>第一步：推信号为什么衰减<\/h3>\n<p>电流沿漫长电线流动时逐渐衰弱，远端电磁铁驱动不了；早期靠加大功率沿线放大，信号放大时噪声一起积累，长距离上失效。电报线路越长，衰减越严重，这是远距离传信的物理障碍（PDF 第 162 页）。<\/p>\n<h3>第二步：推中继器的分段重发结构<\/h3>\n<p>中继器换思路：衰弱电流不直接驱动远端，而是操纵本地电磁铁，电磁铁再接通新电池供电的新电路，信号在每段线路上重新起步（PDF 第 162 页）。词本来指替换疲惫马匹的健壮马匹；约瑟夫·亨利与爱德华·戴维几乎同时想到这一组合。中继器把长线切成若干短段，每段信号独立放大，扫除远距离电报的最大障碍。<\/p>\n<h3>第三步：推符号层的最简选择<\/h3>\n<p>摩尔斯的洞见是退回最简单电路：不要再用磁针，电流流通然后被中断，一系列中断组织起来传递意义（PDF 第 162 页）。韦尔把首个复杂装置精简成一根弹簧支承杠杆，即键；发送端手指触碰控制电路通断，另一端电流控制电磁铁。键比库克–惠特斯通按钮曲柄快至少一个数量级，操作员可把发送速度提到每分钟数百个（PDF 第 162 页）。<\/p>\n<h3>第四步：推频次统计与码长分配<\/h3>\n<p>长文本各字母概率悬殊。韦尔翻阅报社铅字盘统计用量：约 12000 个 E、9000 个 T、只有约 200 个 Z（PDF 第 38–39 页）。若所有字母等长，平均码长由最罕见字母决定；不等长把短码让给高频字母，长码留给低频字母，平均每字符码长下降。E 配一个点，Q、X、Z 配更长点划序列；这套安排距理论最优仍有约 15% 差距（PDF 第 39 页）。<\/p>\n<h3>第五步：推编码的中间层与切分<\/h3>\n<p>摩尔斯系统建立在字母表上：点划只表示字母，字母组词，词再对应口语；点划与口语语音无直接联系（PDF 第 40 页）。这与鼓语直接映射声调不同。编码需要停顿区分：点、划、词间停顿、句间停顿共同构成可分辨序列，接收端靠停顿把点划切成字母。没有停顿规则，连续点划流无法切分成字符。<\/p>\n<h3>第六步：推早期线路与业务形态<\/h3>\n<p>库克–惠特斯通 1837 年合作指针式电报，六线三回路控制磁针，一个信号至少两秒钟（PDF 第 160–161 页）。1844 年华盛顿至巴尔的摩线路架通，普拉特街段悬在六米多高木杆上，报告可每分钟传输三十个字符（PDF 第 163 页）。早期讯息与法国远距离传讯的军事政府内容不同，多是行李招领、零售交易；电报开始进入日常商业通信。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：频次占比对照<\/h3>\n<p>铅字盘约 12000 个 E、9000 个 T、约 200 个 Z（PDF 第 38–39 页）。以总量约计，E 占比远高于 Z；若按出现频次排码长，E 排最短，Z 排最长。频次差两个量级以上，长短码拉开的空间充足。<\/p>\n<h3>算例 2：等长与不等长平均码长对照<\/h3>\n<p>设字母 26 个，等长二进制需 5 位/字符；不等长按频次分配，高频 E、T 用短码，低频长码。平均码长 <span class=\"katex-inline\">L=\\sum_i p_i l_i<\/span>，分布越不均，<span class=\"katex-inline\">L<\/span> 低于 5 位越多。频次均匀时长短码节省有限。<\/p>\n<h3>算例 3：中继分段<\/h3>\n<p>长线被中继器切成 <span class=\"katex-inline\">m<\/span> 段，每段衰弱电流触发本地继电器，接新电池驱动下一段；信号不在整条线上累积衰减。去掉中继器，整条线末端信号弱到不可辨；加上中继器，每段信号重新起步。<\/p>\n<h3>算例 4：博多码对照<\/h3>\n<p>博多码使用五个单位表示一个字符，可能字符数目 <span class=\"katex-inline\">2^5=32<\/span>；每字符信息量是二元单位的五倍，不是三十二倍（PDF 第 218 页）。这是等长五单位码，与摩尔斯不等长码形成对照：等长解码简单，不等长平均更短。<\/p>\n<h3>算例 5：15% 效率差距<\/h3>\n<p>摩尔斯安排距理论最优约 15%（PDF 第 39 页）。差距来源：码长还要受停顿可分辨性、操作习惯约束，不能纯按频次压到最短；频次最优与解码可分辨性折中。<\/p>\n<h3>算例 6：字符速度对照<\/h3>\n<p>库克–惠特斯通一个信号至少两秒钟；韦尔键式电报可每分钟数十到数百字符（PDF 第 161–162 页）。界面精简与编码简化共同提升速度；物理中继解决距离，符号编码解决单位时间容量。<\/p>\n<h3>算例 7：切分必要性<\/h3>\n<p>点划流若没有词间、句间停顿，连续一串点划无法判断哪里是字母分界；停顿本身是编码符号。摩尔斯四符号：点、划、词间停顿、句间停顿，共同构成码表。<\/p>\n<h3>算例 8：电报离散性<\/h3>\n<p>电报基本单位是离散点划，字符可一一编码；与电话连续波形相对。离散性使符号可按码本切分、纠错与计数，是香农把电报作为典型离散系统纳入模型的原因（PDF 第 239 页）。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>摩尔斯码改成等长码<\/strong>：26 字母同长，平均码长由最罕见字母决定；高频 E、T 不享短码，平均时间被低频字母拖长，业务量越大损失越明显。\n<\/li><li>\n<strong>去掉中继器<\/strong>：电流到远端衰弱不可辨，电报只能短距离工作，跨城跨大陆线路无从建立。\n<\/li><li>\n<strong>电报经直接表音而非字母中转<\/strong>：没有字母表中间层，点划要复刻语音细节；鼓语式受限映射会撞上维度不足，编码不可行。\n<\/li><li>\n<strong>码长只按字母形状不看频次<\/strong>：高频字母配长码、低频配短码，平均码长高于频次安排；铅字盘统计失去意义。\n<\/ul>\n<h2>延伸层：电报编码在信息论中的位置<\/h2>\n<p>电报是离散通信的早期工程实践：不等长压缩、停顿切分、中继放大都已出现，但没有统一度量。哈特利把信息量与符号数目对数挂钩；香农随后用熵给出平均码长下界，用信道容量划定速率上限。继电器最初为信号中继设计，第 6 章被香农用做逻辑开关，与、或、否电路在其上实现（PDF 第 193 页）。电报网络因此同时站在通信史与计算史的交汇点：它的符号编码通向信息论，它的开关装置通向数字电路。<\/p>\n<h2>补足推导：前提塌陷点、平均码长与可分辨性折中<\/h2>\n<p>电报系统成立依赖三条前提：信道可分段中继；频次分布可统计；码本与停顿规则两端共享。去掉中继，距离受限；去掉频次统计，码长安排无依据；去掉共享码本，点划无法还原字母。平均码长 <span class=\"katex-inline\">L=\\sum_i p_i l_i<\/span>，理论下界由信源熵给出（c08）。可分辨性折中：短码之间必须靠点划模式与停顿区分，不能把高频字母压到无法辨认；15% 差距即这一折中留下的余量。物理不变量：每段线路上信号由新电池驱动，继电器只做通断控制，不把噪声沿线路累积。<\/p>\n<h2>补充算例与延伸辨析<\/h2>\n<h3>补充算例四：频次与码长对照<\/h3>\n<p>韦尔统计铅字盘频次：E 约一万二千次、T 约九千次、Z 约两千次（PDF 第 160–163 页）。摩尔斯码把最常见的 E 配一个点，罕见字母配更长点划序列；频次越高码长越短，平均传输时间随频次分布压缩。最终码长分布距理论最优约一成五，说明人工参照频次分配已接近按概率加权的下界，但未达到最优。<\/p>\n<h3>补充算例五：不等长码的前缀条件<\/h3>\n<p>不等长编码要可即时解码，短码不能是长码的前缀：若 E 编为「点」，另一字母编为「点划」，接收端收到一个点时无法判断是 E 还是长码开头。摩尔斯码靠字母间停顿切分，把码与码隔开；博多码改用五单位固定长度，三十二种组合对应字母与控制符号，不靠停顿切分（PDF 第 218 页）。不等长省平均时长但要停顿规则配合，等长规则简单但平均码长不随频次压缩。<\/p>\n<h3>延伸辨析：不等长编码与信源压缩<\/h3>\n<p>不等长编码把高频符号配短码，是按概率分布压缩平均码长；压缩的依据是信源自身统计结构。电报字母频次来自真实书面语，双字母组合与上下文依赖是更高一层结构。香农后来把这套统计结构写成熵与冗余：分布越不均，可压缩空间越大。电报码是不等长编码在电气信道上的早期实践，理论下界由熵给出。<\/p>\n<h3>边界走查：频次统计的样本依赖<\/h3>\n<p>频次分布来自特定书面语样本；换一种语言、换一类文本，字母频次改变，最优码长分配随之改变。摩尔斯码按英语铅字盘频次设计，直接搬到其他语言要重新统计频次。频次估计样本不足时，罕见字母码长分配可能偏离真实分布，压缩收益打折。<\/p>\n<h3>延伸辨析：继电器的两重身份<\/h3>\n<p>继电器最初为电报中继器而设：弱电流操纵电磁铁，再控制下一段电路开关，把信号分段重发以延长线路（PDF 第 162、193 页）。同一装置后来被组合成与、或、否逻辑电路，中继信号的部件同时承担逻辑运算。编码与电路逻辑在继电器上汇合：通断是符号，组合规则是运算，为 c08、c09 的离散系统分析提供硬件前身。<\/p>\n<h2>再算一例与边界补推<\/h2>\n<h3>补充算例六：等长与不等长平均码长对照<\/h3>\n<p>26 字母等长编码每位固定 5 位；不等长编码按频次分配，E 配一点、罕见字母配长码，平均码长低于 5 位。频次越集中，长短码收益越大；分布接近均匀时，不等长平均码长趋近等长下界。博多五单位码固定 5 位、32 种组合，规则简单、不靠停顿切分，代价是平均码长不随频次压缩。两种方案在省时长与规则简单之间取舍。<\/p>\n<h3>边界补推：前缀条件失败走查<\/h3>\n<p>若短码是长码前缀，接收端收到短码信号时无法判断该立即解码还是等待后续信号；即时解码失败，必须靠额外停顿或同步标记切分。摩尔斯码靠字母间停顿把码隔开，前缀条件由停顿规则补全；去掉停顿，点划串连成一片，字母边界丢失。不等长编码要可即时解码，要么满足前缀条件，要么配套切分规则，两者至少占一条。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n中继器放大的是信号还是噪声？它怎样避免噪声累积？\n<\/li><li>\n不等长编码为什么要先统计字母频次？\n<\/li><li>\n摩尔斯码与口语语音之间隔着哪一层？\n<\/li><li>\n停顿在摩尔斯编码中承担什么角色？\n<\/li><li>\n博多五单位码与摩尔斯不等长码各有什么取舍？\n<\/li><li>\n电报离散性为什么适合纳入香农离散模型？\n<\/ol>\n<h2>自检问题<\/h2>\n<ol><li>\n推一下：频次分布均匀时，不等长码相对等长码收益如何？\n<\/li><li>\n中继器与单纯加大功率在抗衰减上有什么差别？\n<\/li><li>\n为什么说点划与口语语音无直接联系？\n<\/li><li>\n平均码长公式 <span class=\"katex-inline\">L=\\sum_i p_i l_i<\/span> 中各项代表什么？\n<\/li><li>\n摩尔斯安排距理论最优 15% 的差距来自哪些约束？\n<\/ol><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/信息/信息简史 (［美］詹姆斯•格雷克 (作者) 高博 (译者)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.206<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">电报与不等长编码：按符号频率分配码长<\/a><\/span><\/div><h1>电话：连续语音信号与交换网络<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（第 6 章 新电线，新逻辑，PDF 第 189–220 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>电报要求使用者先写字、编码、由受训中间人敲键；电话跳过这些环节，开口即可通话。要解释电话为何普及速度与电报不同，必须分开两层：信号形态上，电话传的是随时间连续起伏的声波电流，电报传的是离散点划；网络组织上，用户不能与全世界各拉专线，需要临时接通两条线路的交换装置。不区分这两层，就说不清电话为何对口语文化友好、又为何催生了号码簿这类目录工程。<\/p>\n<h2>定义<\/h2>\n<p><strong>模拟语音信号<\/strong>：声波经送话器转换成随时间连续起伏的电流，接收端再换回声音；波形在时间上连续，不像电报字符那样切成离散点划（PDF 第 218 页）。<\/p>\n<p><strong>交换网络<\/strong>：用户线路不两两直连，而是汇到交换机，接线员用插头临时接通两条用户线路，通话结束拆开；科伊的交换机允许从二十一个用户中任选两路同时通话（PDF 第 211 页）。<\/p>\n<p><strong>号码目录<\/strong>：用户规模扩大后，给每部电话配一个号码并按字母表顺序排列，形成号码簿；1879 年底洛厄尔市四名接线员管理两百多用户，医生帕克担心接线员染病无人替换，建议给电话编号（PDF 第 211 页）。<\/p>\n<p><strong>采样逼近<\/strong>：哈特利延续奈奎斯特观点，把连续曲线看作一连串离散步骤逼近的极限，步骤可由间隔采样还原；这样电话与电报可纳入同一套数学分析，信息量取决于可用时间与信道带宽（PDF 第 218 页）。<\/p>\n<p>正例：1880 年美国已有超过六万部电话投入使用，距贝尔成功传出「华生先生，快来，我要见你！」不过四年（PDF 第 208 页）。反例：早期点对点租用对电话，工厂与办公室之间直连，用户一多专线数量爆炸，必须引入交换机。<\/p>\n<h2>原理推导<\/h2>\n<p>先推信号形态差别。电报基本单位是离散的点和划，字符可一一编码；电话传波浪起伏的模拟波，符号藏在连续波形里。哈特利的处理路径：对波形间隔采样，把连续曲线拆成离散步骤序列，离散化后即可同电报一样做信息量分析（PDF 第 218 页）。信息量不再只看字符集大小，而取决于传输时间与信道带宽两个因素。<\/p>\n<p>再推网络拓扑约束。<span class=\"katex-inline\">N<\/span> 个用户两两直连需要 <span class=\"katex-inline\">N(N-1)/2<\/span> 条专线，用户数增长时线路数平方膨胀。交换方案把每户接到交换机，通话时临时占一条入户线加一段局内连接，通话结束释放；线路成本与组织方式随之改变。接线员先按名字找线路，用户增多后名字查询不可靠，才给每部电话配号码、编号码簿（PDF 第 211 页）。<\/p>\n<p>接着推易用性带来的文化差别。电报要求书面文化配合：讯息先写下、编码、由受训人员敲入；电话拥抱口语文化，使用者只需开口说话，小孩也会用，传过去的不仅是字词还有感受（PDF 第 207 页）。电话不留持久记录，商务人士起初认为它不够正式；贝尔本人先把它演示成广播音乐与布道的设备，用户上手后才转向交谈用途（PDF 第 208 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：送受话器可把声波与电流互相转换；交换机可临时接通释放线路；用户可被编号寻址。\n<\/li><li>\n边界一：连续信号要纳入离散数学分析，必须先采样；采样间隔与带宽决定可还原的波形细节，过度压缩会丢失语音信息。\n<\/li><li>\n边界二：电话早期传模拟波，噪声在线路上累积；约翰逊先度量电路固有热噪声，奈奎斯特给出波动公式，噪声研究为香农信道模型铺路（PDF 第 215 页）。\n<\/li><li>\n失败案例：用电报经验评估电话。电报熟悉书面编码，无法移用到口语设备；早期决策者因想象力失灵，把电话当玩具或展示品（PDF 第 207 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>模拟信号 vs 离散编码<\/strong>：模拟波形连续起伏，离散编码由可数字符组成；二者可经采样转换，但直接传输时抗噪与编码方式不同。\n<\/li><li>\n<strong>点对点专线 vs 交换网络<\/strong>：专线随用户数平方增线；交换网络共享局内连接，按通话临时占用。\n<\/li><li>\n<strong>电话 vs 电报<\/strong>：电话口语、连续、不留记录、诉诸感受；电报书面、离散、留有记录、与事实和数打交道（PDF 第 207 页）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c06 电报离散编码与中继器。后继：c08 熵与 c09 信道容量把电话带宽、噪声、采样纳入香农模型；奈奎斯特的传输速率因素分析是容量理论的先声（PDF 第 215、218 页）。第 6 章香农用继电器电路实现布尔逻辑，交换网络的开关装置也是数字电路前身（PDF 第 193 页）。<\/p>\n<p>补充对照：贝尔与格雷围绕电话专利相争，1875 年格雷曾评价这类装置无商业价值；贝尔 1876 年喊出「华生先生，快来，我要见你！」，到 1880 年美国已有超过六万部电话（PDF 第 206–208 页）。科伊最早担任接线员，同时接二十一路；1879 年帕克建议用编号配合字母排序管理用户目录。工程分析上，奈奎斯特 1924 年讲演处理电报信号速率，约翰逊测出热噪声并由奈奎斯特给出公式，哈特利把连续曲线用采样逼近，指出信息量取决于传输时间与带宽（PDF 第 215–218 页）。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（电话：连续语音信号与交换网络）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：连续信号采样、交换拓扑与号码目录生成<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>电话案例要推到可检验，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先分信号形态与网络组织<\/strong>。信号形态解决声波怎样变成电流再换回声音；网络组织解决多用户怎样临时接通。两层混在一起，说不清电话为何易用、又为何催生目录。\n<\/li><li>\n<strong>确认连续波形可离散化分析<\/strong>。连续曲线要能被间隔采样拆成步骤序列，才能与电报纳入同一套数学分析；不先采样，连续信号无法计数。\n<\/li><li>\n<strong>确认专线拓扑不可扩展<\/strong>。用户两两直连随人数平方增线；先承认专线成本约束，才理解交换机为什么出现。\n<\/li><li>\n<strong>确认用户可被寻址<\/strong>。用户增多后名字查询不可靠，需要编号；号码目录是寻址需求的产物。\n<\/ol>\n<p>依赖链方向：连续声波 → 采样离散化 → 带宽时间定容量 → 专线成本约束 → 交换临时接通 → 编号目录。信号层保留口语连续体验，网络层解决多用户连接；两层分别对应电话的易用性与目录工程。<\/p>\n<h2>正向推导：从波形连续推到交换网络<\/h2>\n<h3>第一步：推信号形态差别<\/h3>\n<p>电报基本单位是离散点划，字符可一一编码；电话传波浪起伏的模拟波，符号藏在连续波形里（PDF 第 218 页）。送话器把声波转换成随时间连续变化的电流，接收端再换回声音；波形在时间上连续，不像电报字符切成离散点划。<\/p>\n<h3>第二步：推采样逼近路径<\/h3>\n<p>哈特利延续奈奎斯特观点，把连续曲线看作一连串离散步骤逼近的极限，步骤可由间隔采样还原；这样电话与电报可纳入同一套数学分析（PDF 第 218 页）。信息量取决于传输时间与信道带宽两个因素。采样间隔与带宽决定可还原的波形细节，过度压缩丢失语音信息。<\/p>\n<h3>第三步：推专线拓扑的成本膨胀<\/h3>\n<p><span class=\"katex-inline\">N<\/span> 个用户两两直连需要 <span class=\"katex-inline\">N(N-1)/2<\/span> 条专线，用户数增长时线路数平方膨胀。交换方案把每户接到交换机，通话时临时占一条入户线加一段局内连接，通话结束释放；线路成本与组织方式随之改变。<\/p>\n<h3>第四步：推交换装置与接线员<\/h3>\n<p>科伊的交换机允许从二十一个用户中任选两路同时通话；他用金属丝做插头插座，成为世界首位电话接线员（PDF 第 211 页）。插头频繁磨损，早期改进用约五厘米长对折金属片，因像折叠刀刀柄得名 jack，沿用至今。接线员先按名字找线路，用户增多后名字查询不可靠。<\/p>\n<h3>第五步：推编号与号码簿生成<\/h3>\n<p>1879 年底洛厄尔市四名接线员管理两百多用户；医生帕克担心接线员染病无人替换，建议给每部电话配号码并按字母表顺序排列（PDF 第 211 页）。号码无法申请专利，类似设想各地冒出；电话号码簿成为人类有史以来最广泛的列表和目录。编号把用户从名字识别转为号码寻址。<\/p>\n<h3>第六步：推易用性与文化差别<\/h3>\n<p>电报要求书面文化配合：讯息先写下、编码、由受训人员敲入；电话拥抱口语文化，使用者只需开口说话，小孩也会用，传过去的不仅是字词还有感受（PDF 第 207 页）。电话不留持久记录，商务人士起初认为不够正式；贝尔先把它演示成广播音乐与布道设备，用户上手后才转向交谈用途（PDF 第 208 页）。1880 年美国已有超过六万部电话，距贝尔成功传出「华生先生，快来，我要见你！」不过四年（PDF 第 208 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：专线线路数<\/h3>\n<p><span class=\"katex-inline\">N=10<\/span> 用户两两直连需 <span class=\"katex-inline\">10\\times9/2=45<\/span> 条专线；<span class=\"katex-inline\">N=100<\/span> 需 <span class=\"katex-inline\">100\\times99/2=4950<\/span> 条。交换网络每户一条入户线，局内连接按通话临时占用，线路增长不再平方膨胀。<\/p>\n<h3>算例 2：采样与带宽<\/h3>\n<p>连续波形经间隔采样变成离散步骤；采样间隔越密、带宽越宽，可还原细节越多。哈特利分析：信息量取决于可用时间与信道带宽（PDF 第 218 页）。语音带宽不足时，高频细节丢失，声音发闷。<\/p>\n<h3>算例 3：用户规模增长<\/h3>\n<p>1880 年美国超六万部电话；早期点对点租用对电话，工厂与办公室直连（PDF 第 208 页）。规模从几对用户到数百用户，交换机与编号目录随之出现；科伊交换机最初二十一路，洛厄尔两百多用户已需编号管理（PDF 第 211 页）。<\/p>\n<h3>算例 4：贝尔与格雷专利竞争<\/h3>\n<p>贝尔与伊莱沙·格雷争夺电话发明专利；1875 年格雷告诉律师，这项「会说话的电报」当时没有商业价值（PDF 第 206 页）。技术判断受既有电报经验约束，想象力失灵使早期评估低估电话。<\/p>\n<h3>算例 5：噪声研究铺垫<\/h3>\n<p>约翰逊先度量电路固有热噪声，指出噪声非电路设计缺陷；奈奎斯特给出波动公式（PDF 第 215 页）。电话线路噪声研究为香农信道模型铺路：噪声成为信道模型中独立一方。<\/p>\n<h3>算例 6：模拟与离散对照<\/h3>\n<p>电报点划离散，字符可切分计数；电话模拟波连续，符号需采样后计数。博多五单位码是离散等长编码；电话语音采样后才可套用离散信息量分析（PDF 第 218 页）。<\/p>\n<h3>算例 7：号码簿排序<\/h3>\n<p>1879 年建议号码按字母表顺序排列（PDF 第 211 页）。这是 c04 字母排序在电话用户目录上的延伸：用户作为条目，号码作为键，按字母序定位。<\/p>\n<h3>算例 8：易用性对照<\/h3>\n<p>电报使用者需识字、编码、受训操作电键；电话使用者只需听和说，无编码环节。门槛差别解释电话普及速度：谁都会用的设备，用户增长不依赖识字率与培训。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>电话只传离散符号<\/strong>：通话者须先把声音转文字或编码再发送，识字编码成为门槛；语气停顿语调无法直接过线，口语文化优势不出现。\n<\/li><li>\n<strong>用户两两专线直连<\/strong>：<span class=\"katex-inline\">N<\/span> 增大线路数平方膨胀，多用户网络无法经济建设；交换机临时接通释放线路是拓扑必需。\n<\/li><li>\n<strong>不给电话编号<\/strong>：接线员只能按名字找线路，用户增多后重名、改名、查询都不可靠；换人接替也无稳定寻址依据。\n<\/li><li>\n<strong>连续波形不做采样直接分析<\/strong>：符号藏在连续曲线里无法计数，电话与电报不能纳入同一数学框架；容量与带宽分析无从建立。\n<\/ul>\n<h2>延伸层：电话网络通向信道理论与交换逻辑<\/h2>\n<p>电话早期传模拟波，噪声在线路上累积；约翰逊、奈奎斯特的噪声研究，哈特利的时间带宽分析，为香农信道模型准备了经验材料。交换网络的开关装置与继电器同源，第 6 章香农用继电器实现与、或、否逻辑电路，交换开关成为数字电路前身（PDF 第 193 页）。电话同时留下两条线索：语音连续信号通向采样与带宽理论，线路交换通向网络拓扑与寻址目录。<\/p>\n<h2>补足推导：前提塌陷点、寻址不变量与模拟数字分界<\/h2>\n<p>电话系统成立依赖三条前提：送受话器可完成声波电流互转；交换机可临时接通释放线路；用户可被编号寻址。去掉互转，声音过不了线；去掉交换，专线成本不可承受；去掉编号，用户无法稳定定位。寻址不变量：给定号码，接线员或交换机定位到对应用户线路；号码与用户绑定关系在目录中登记。模拟数字分界：模拟波形连续起伏，离散编码由可数字符组成；采样是二者转换桥梁。早期电话为模拟传输，后世语音数字化后经编码进入离散信道，分界随技术演进移动，但信号形态分析框架保留。<\/p>\n<h2>补充算例与延伸辨析<\/h2>\n<h3>补充算例四：连续信号的采样逼近<\/h3>\n<p>电话传输连续语音波形；哈特利把连续曲线用采样点逼近，指出信息量取决于传输时间与带宽（PDF 第 218 页）。奈奎斯特 1924 年讲演处理电报信号速率与间隔；约翰逊测出热噪声，奈奎斯特给出噪声公式。连续信号先经采样离散化，才能纳入符号与速率分析；采样间隔与带宽决定可还原的频率上限。电话直接把声波振动变成电信号，中间没有字母表这一层。<\/p>\n<h3>补充算例五：交换网络与用户目录<\/h3>\n<p>早期电话靠接线员临时接通：科伊最早担任接线员，同时接二十一路（PDF 第 206–208 页）。用户增多后，1879 年帕克建议用编号配合字母排序管理目录，交换机把主叫与被叫临时接通，通话结束拆线。网络层面解决的是任意两端临时连通，不是固定线路；编号与排序让接线员按目录定位被叫。<\/p>\n<h3>延伸辨析：电话与电报的中间层差别<\/h3>\n<p>电报先把口语写成字母，再把字母编成点划，中间经过字母表这一符号层；电话直接映射口语声调与波形，开口说话即可使用，门槛低但信号连续、抗噪分析不同。电报离散符号可逐码纠错，电话连续波形受噪声与失真影响，采样后才纳入离散框架。两类系统对应 c09 模型中的离散与连续两类。<\/p>\n<h3>边界走查：专利与商业判断<\/h3>\n<p>贝尔与格雷围绕电话专利相争，1875 年格雷曾评价这类装置无商业价值；贝尔 1876 年喊出「华生先生，快来，我要见你！」，到 1880 年美国已有超过六万部电话（PDF 第 206–208 页）。商业判断不能替代技术可能性分析：装置价值随网络规模与使用习惯变化，早期评估受当时信道与需求条件限制。<\/p>\n<h3>延伸辨析：带宽、噪声到信道容量<\/h3>\n<p>电话线路的带宽与热噪声是 c09 信道容量的物理来源：带宽决定单位时间可承载的信号变化，噪声决定可分辨程度。哈特利把信息量归到时间与带宽，香农把噪声概率结构纳入后给出容量概念。本章的连续信号与交换网络是信息论模型落地前的工程经验积累，电报离散分析与电话连续分析在香农模型中汇合。<\/p>\n<h2>再算一例与边界补推<\/h2>\n<h3>补充算例六：采样、时间与带宽<\/h3>\n<p>哈特利把连续曲线用采样点逼近，指出信息量取决于传输时间与带宽（PDF 第 218 页）。传输时间越长、带宽越宽，可承载的采样点与信号变化越多；带宽受限则高频变化传不过去。奈奎斯特处理电报信号速率与间隔，约翰逊测出热噪声、奈奎斯特给出噪声公式；连续语音先采样离散化，才能纳入符号与速率分析。采样间隔与带宽共同决定可还原频率上限，量化位数决定幅值分辨精度。<\/p>\n<h3>补充算例七：交换网络临时接通<\/h3>\n<p>早期电话由接线员把主叫与被叫临时接通，通话结束拆线；科伊同时接二十一路（PDF 第 206–208 页）。用户增多后，1879 年帕克建议编号配合字母排序管理目录，接线员按编号定位被叫。网络解决任意两端临时连通，不铺固定专线；目录与编号是网络规模扩大后的组织配套。线路接通是临时路径，号码排序是定位规则，两层分工不同。<\/p>\n<h3>边界补推：连续信号的抗噪分析路径<\/h3>\n<p>电话波形连续，噪声与失真混入波形，不能像电报那样逐码对照纠错；采样离散化后，信号变成可分析的符号序列，才纳入离散抗噪框架。贝尔与格雷专利之争、1875 年格雷「无商业价值」评价，属于早期商业判断；装置价值随网络规模与使用习惯变化，早期评估受当时信道条件限制，不能替代技术可能性分析。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n电话与电报在信号形态上差别在哪？\n<\/li><li>\n连续曲线为什么要先采样才能做信息量分析？\n<\/li><li>\n专线线路数随用户数怎样增长？交换机怎样缓解？\n<\/li><li>\n号码簿为什么在用户规模扩大后才出现？\n<\/li><li>\n电话易用性来自去掉了哪些电报环节？\n<\/li><li>\n电路噪声研究怎样为信道模型铺路？\n<\/ol>\n<h2>自检问题<\/h2>\n<ol><li>\n推一下：<span class=\"katex-inline\">N=50<\/span> 用户专线需要多少条线路？\n<\/li><li>\n采样间隔与带宽怎样影响可还原的语音细节？\n<\/li><li>\n编号与按名字找线路相比，解决了什么问题？\n<\/li><li>\n电话拥抱口语文化具体去掉了哪些门槛？\n<\/li><li>\n电话网络的开关装置与后世逻辑电路有什么渊源？\n<\/ol><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/信息/信息简史 (［美］詹姆斯•格雷克 (作者) 高博 (译者)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.243<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">电报与不等长编码：按符号频率分配码长<\/a><\/span><\/div><h1>比特与香农熵：不确定性的对数度量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（第 7 章 信息论，PDF 第 223–248 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>电报码长、频次分布、噪声里的信号分离，在工程上积累了几十年，却没有一把统一尺子衡量「一条讯息携带多少信息」。哈特利把信息量与符号数目取对数挂钩，但符号概率不等时，频繁出现的符号与罕见符号不该算成同样意外。香农要解决的问题是：怎样按概率分布把信源的不确定性算成一个数值，使等概率选择、不等概率选择、自然语言冗余都能在同一把尺子上比较。<\/p>\n<h2>定义<\/h2>\n<p><strong>比特（bit，binary digit）<\/strong>：以 2 为底的信息单位；一次等概率二选一的不确定性对应 1 比特。比特一词由约翰·怀尔德·图基最早提出，香农采用了这个缩写（PDF 第 30 页）。<\/p>\n<p><strong>香农熵（信息熵，<span class=\"katex-inline\">H<\/span>）<\/strong>：对信源平均不确定性的度量，公式 <span class=\"katex-inline\">H=-\\sum_i p_i\\log_2 p_i<\/span>。<span class=\"katex-inline\">p_i<\/span> 是第 <span class=\"katex-inline\">i<\/span> 种消息出现概率，<span class=\"katex-inline\">-\\log_2 p_i<\/span> 是该消息出现时带来的意外程度；按概率加权求和即平均不确定性。<\/p>\n<p><strong>冗余<\/strong>：信源统计结构中可在不丢失信息前提下缩减的部分。英语有字母组合习惯与前后文约束，冗余使缺字句子仍可读懂；冗余与熵此消彼长。<\/p>\n<p><strong>单位对照<\/strong>：以 10 为底称班（ban），以 <span class=\"katex-inline\">e<\/span> 为底称 nat，以 2 为底称 bit；同一不确定性换底只差一个常数因子（PDF 第 243 页）。<\/p>\n<p>正例：掷一次等概率硬币，<span class=\"katex-inline\">p=1/2<\/span>，<span class=\"katex-inline\">H=1<\/span> 比特；32 个等概率字符，<span class=\"katex-inline\">H=\\log_2 32=5<\/span> 比特（PDF 第 244 页）。反例：所有概率集中在一个符号上，<span class=\"katex-inline\">p_1=1<\/span>，<span class=\"katex-inline\">H=0<\/span>，没有不确定性，不携带信息。<\/p>\n<h2>原理推导<\/h2>\n<p>先推等概率情形。信源有 <span class=\"katex-inline\">s<\/span> 种等概率符号，每种 <span class=\"katex-inline\">p_i=1/s<\/span>。可能讯息数目为 <span class=\"katex-inline\">s<\/span>，一次选择的不确定性随数目取对数增长；以 2 为底，每符号信息量 <span class=\"katex-inline\">\\log_2 s<\/span>。端点检验：<span class=\"katex-inline\">s=1<\/span> 时 <span class=\"katex-inline\">\\log_2 1=0<\/span>；<span class=\"katex-inline\">s=2<\/span> 时 1 比特；<span class=\"katex-inline\">s=32<\/span> 时 5 比特。1000 个这样的字符组成的串，可能讯息数目 <span class=\"katex-inline\">32^{1000}<\/span>，取 2 为底对数得 5000 比特（PDF 第 244 页）。<\/p>\n<p>再推不等概率加权。频繁出现的符号出人意料程度低，罕见符号出现时意外程度高。把每个符号的不可能性对数 <span class=\"katex-inline\">-\\log_2 p_i<\/span> 按概率 <span class=\"katex-inline\">p_i<\/span> 加权，求和得 <span class=\"katex-inline\">H=-\\sum_i p_i\\log_2 p_i<\/span>。退化检验：概率集中于一符号，<span class=\"katex-inline\">H=0<\/span>；概率越分散，<span class=\"katex-inline\">H<\/span> 越大。<\/p>\n<p>接着推自然语言的熵与冗余。香农估计英语在不超过八个字母的统计结构内冗余度约 50%，每字母信息量约 2.3 比特，到不了 32 字符字母表的 5 比特；扩展到句段层面，冗余度估计升到约 75%（PDF 第 244、245 页）。双字母 th 在千词中出现约 168 次，字母与字母间存在可预测关联；香农妻子贝蒂参与猜字母测试，逐字母补全句子（PDF 第 243 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：信源可给出各消息概率；符号序列可按概率统计；度量以不确定性为对象，不涉及消息语义。\n<\/li><li>\n边界一：熵度量平均不确定性，不衡量消息真假、价值或意义；同一串符号在不同信源分布下熵值不同。\n<\/li><li>\n边界二：公式假设符号概率可长期统计；短样本估计的概率不稳，熵估计随之波动。自然语言还有前后文依赖，单字母概率只是第一层近似。\n<\/li><li>\n失败案例：把字符集大小直接当信息量。字符集翻倍，单字符信息量只增加 1 比特；博多码五单位表示 32 字符，每字符价值是二元单位的五倍，不是三十二倍（PDF 第 218 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>信息熵 vs 热力学熵<\/strong>：二者公式同构（见 c10），但信息熵度量不确定性，热力学熵度量微观状态数目；跨学科借用前先确认对象。\n<\/li><li>\n<strong>熵 vs 冗余<\/strong>：熵是平均意外程度，冗余是可缩减的结构余量；高冗余信源熵低，冗余可被压缩但不能为零。\n<\/li><li>\n<strong>信息量 vs 字符数<\/strong>：一条长讯息字符多，不代表信息量大；若全是可预测重复，熵值很低。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c06 不等长码按频率分配码长，c08 给出平均码长的理论下界。后继：c09 信道容量在熵的基础上限定传输速率上限；c10 把同一对数形式接到热力学熵；c13 算法复杂度把信息量改写成最短程序长度；c11 遗传编码的四字母码本也可用熵度量序列不确定性。<\/p>\n<p>补充对照：bit 一词由约翰·怀尔德·图基最早提出，香农采用它作为以 2 为底的信息单位；以 10 为底称班（ban），以自然对数为底称 nat，三种底数只是单位换算（PDF 第 243 页）。英语实测估计，每个字母平均约 2.3 比特，八字母以内结构冗余约一半，句段层面冗余约四分之三；双字母组合与上下文依赖使真实信源比单字母分布更有结构（PDF 第 243–245 页）。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（比特与香农熵：不确定性的对数度量）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：从等概率对数到加权熵与自然语言冗余<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把熵度量讲到可手算，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先把信息定义为不确定性<\/strong>。讯息是从一组可能消息里选出的一条；信息与不确定性、意外程度、选择困难程度相关。不先立这个定义，比特与熵没有度量对象。\n<\/li><li>\n<strong>确认符号概率可统计<\/strong>。信源各消息出现概率可长期统计；概率分布给出后，才能按分布加权算平均不确定性。\n<\/li><li>\n<strong>确认对数尺度合理<\/strong>：可能数目翻倍，不确定性增加一个固定单位；对数把乘法增长转成加法累加。\n<\/li><li>\n<strong>区分统计分布与个体串<\/strong>：熵是信源集合层面的平均量，不直接度量单个字符串；个体串的可压缩性由算法复杂度另给定义（c13）。\n<\/ol>\n<p>依赖链方向：信息即不确定性 → 概率分布可统计 → 对数尺度 → 等概情形 → 不等概加权熵 → 冗余度量。任何一层缺失：概率不可统计则加权无依据；不采用对数则数目增长与信息量不成线性累加。<\/p>\n<h2>正向推导：从符号数目推到香农熵<\/h2>\n<h3>第一步：推等概率情形<\/h3>\n<p>信源有 <span class=\"katex-inline\">s<\/span> 种等概率符号，每种 <span class=\"katex-inline\">p_i=1/s<\/span>。可能讯息数目为 <span class=\"katex-inline\">s<\/span>，一次选择的不确定性随数目取对数增长；以 2 为底，每符号信息量 <span class=\"katex-inline\">\\log_2 s<\/span>。端点检验：<span class=\"katex-inline\">s=1<\/span> 时 <span class=\"katex-inline\">\\log_2 1=0<\/span>，没有选择；<span class=\"katex-inline\">s=2<\/span> 时 1 比特；<span class=\"katex-inline\">s=32<\/span> 时 5 比特。<\/p>\n<h3>第二步：推对数底与单位<\/h3>\n<p>以 10 为底称班（ban），以 <span class=\"katex-inline\">e<\/span> 为底称 nat，以 2 为底称 bit；同一不确定性换底只差常数因子（PDF 第 243 页）。比特一词由约翰·怀尔德·图基最早提出，香农采用了这个缩写（PDF 第 30 页）。选 2 为底对应二选一设备，与双稳态电路自然对应。<\/p>\n<h3>第三步：推不等概率加权<\/h3>\n<p>频繁出现的符号出人意料程度低，罕见符号出现时意外程度高。把每个符号的不可能性对数 <span class=\"katex-inline\">-\\log_2 p_i<\/span> 按概率 <span class=\"katex-inline\">p_i<\/span> 加权，求和得 <span class=\"katex-inline\">H=-\\sum_i p_i\\log_2 p_i<\/span>。每一项 <span class=\"katex-inline\">p_i\\log_2(1/p_i)<\/span> 是第 <span class=\"katex-inline\">i<\/span> 种消息在长期平均中分摊到的意外程度，求和即平均不确定性。<\/p>\n<h3>第四步：推退化与极值检验<\/h3>\n<p>概率集中于一符号，<span class=\"katex-inline\">p_1=1<\/span>，其余为 0，<span class=\"katex-inline\">H=0<\/span>，与「没有不确定性」一致；概率越分散，<span class=\"katex-inline\">H<\/span> 越大。等概率分布在固定符号数下熵最大；偏向少数符号则熵下降。退化检验保证公式在边界情形给出合理值。<\/p>\n<h3>第五步：推自然语言熵与冗余<\/h3>\n<p>香农估计英语在不超过八个字母的统计结构内冗余度约 50%，每字母信息量约 2.3 比特，到不了 32 字符字母表的 5 比特；扩展到句段层面，冗余度估计升到约 75%（PDF 第 244、245 页）。双字母 th 在千词中出现约 168 次，字母与字母间存在可预测关联；香农妻子贝蒂参与猜字母测试，逐字母补全句子（PDF 第 243 页）。<\/p>\n<h3>第六步：推存储状态数与比特关系<\/h3>\n<p><span class=\"katex-inline\">N<\/span> 个双稳态设备存 <span class=\"katex-inline\">N<\/span> 比特，可能状态总数 <span class=\"katex-inline\">2^N<\/span>。状态数随设备数指数增长，比特数随设备数线性增长；这与 <span class=\"katex-inline\">\\log_2 2^N=N<\/span> 对应。信息度量落在设备状态选择上，不落在设备材料上。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：掷硬币<\/h3>\n<p>等概率 <span class=\"katex-inline\">p=1/2<\/span>，<span class=\"katex-inline\">H=-\\frac12\\log_2\\frac12-\\frac12\\log_2\\frac12=1<\/span> 比特。掷一次硬币的不确定性对应 1 比特；掷两次独立硬币为 2 比特。<\/p>\n<h3>算例 2：32 符号等概<\/h3>\n<p><span class=\"katex-inline\">s=32<\/span>，<span class=\"katex-inline\">H=\\log_2 32=5<\/span> 比特；1000 个这样的字符组成的串，可能数目 <span class=\"katex-inline\">32^{1000}<\/span>，取 2 为底对数 <span class=\"katex-inline\">1000\\times5=5000<\/span> 比特（PDF 第 244 页）。<\/p>\n<h3>算例 3：不等概率二选一<\/h3>\n<p><span class=\"katex-inline\">p=0.9<\/span> 与 <span class=\"katex-inline\">0.1<\/span>：<span class=\"katex-inline\">H=-0.9\\log_2 0.9-0.1\\log_2 0.1\\approx0.469<\/span> 比特，低于等概 1 比特。偏向越强熵越低；<span class=\"katex-inline\">p=1<\/span> 时熵为 0。<\/p>\n<h3>算例 4：英语每字母熵<\/h3>\n<p>字母表 32 字符等概为 5 比特；英语实际每字母约 2.3 比特，其余约 2.7 比特位置由语言统计结构可预测，即冗余（PDF 第 244 页）。句段层面冗余约 75%，上下文可预测比例更高。<\/p>\n<h3>算例 5：双字母频次<\/h3>\n<p>th 每千词出现约 168 次（PDF 第 243 页）。高频双字母使后续字母可预测，单字母概率估计之外还有字母间关联；多层统计结构共同压低自然语言熵。<\/p>\n<h3>算例 6：状态数对照<\/h3>\n<p>1 个双稳态设备 2 种状态；10 个设备 <span class=\"katex-inline\">2^{10}=1024<\/span> 种状态，存 10 比特；<span class=\"katex-inline\">N<\/span> 个设备 <span class=\"katex-inline\">2^N<\/span> 状态。设备数线性增加，状态空间指数扩大。<\/p>\n<h3>算例 7：换底对照<\/h3>\n<p>同一不确定性：<span class=\"katex-inline\">\\log_2 s<\/span> 比特，<span class=\"katex-inline\">\\log_{10}s<\/span> 班，<span class=\"katex-inline\">\\ln s<\/span> nat；换算因子 <span class=\"katex-inline\">\\ln 2<\/span> 等。单位不同不改变不确定性大小，只是底数选择。<\/p>\n<h3>算例 8：冗余可读性<\/h3>\n<p>英语缺字句子仍可读懂，因为上下文补足可预测部分；被省略字母就是冗余。冗余高的信源熵低，压缩空间大；完全无冗余的序列每一位都不可预测。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>所有消息等概率处理<\/strong>：忽略频次差异，频繁符号与罕见符号算成同样意外；平均不确定性被高估，码长压缩失去依据。\n<\/li><li>\n<strong>用字符集大小直接当信息量<\/strong>：字符集翻倍，单字符信息量只增加 1 比特；按 32 字符算 32 倍价值是错的，博多五单位字符价值是二元单位五倍（PDF 第 218 页）。\n<\/li><li>\n<strong>熵纳入消息真假与价值<\/strong>：熵只度量不确定性，不判断消息对错、轻重；把语义价值混进公式，度量无法统一计算。\n<\/li><li>\n<strong>自然语言无冗余<\/strong>：缺一个字母句子即不可解；上下文无法补足，猜字母测试无法逐字推进。\n<\/ul>\n<h2>延伸层：熵在本书各章的位置<\/h2>\n<p>熵是香农 1948 年《通信的数学理论》的核心度量；韦弗 1949 年文章把理论普及给更宽读者。c06 不等长码按频率分配码长，平均码长下界由熵给出；c09 信道容量在熵之上限定速率上限；c10 同一对数形式接到热力学熵；c13 算法复杂度把信息量改写成最短程序长度；c11 碱基序列不确定性也可用熵度量。熵是全书从工程到生命、文化、物理各章共用的度量底座。<\/p>\n<h2>补足推导：前提塌陷点、加权不变量与熵的边界<\/h2>\n<p>熵公式成立依赖三条前提：消息概率可长期统计；符号选择可重复观察；对数底选定并一致使用。概率不可统计则加权项落空；符号前后强依赖时，单字母概率只是第一层近似，需引入条件熵。加权不变量：每个消息贡献 <span class=\"katex-inline\">p_i\\log_2(1/p_i)<\/span>，长期平均后求和；概率换序不改变总和。熵的边界：不衡量真假、价值、意义；短样本概率估计不稳；自然语言上下文依赖使单字母熵只是近似。把熵当唯一信息度量，会漏掉个体串可压缩性（c13）与阐释层意义（c15）。<\/p>\n<h2>补充算例与延伸辨析<\/h2>\n<h3>补充算例四：三分布熵手算<\/h3>\n<p>分布一：等概二选一，<span class=\"katex-inline\">p_1=p_2=1/2<\/span>，<span class=\"katex-inline\">H=-\\frac12\\log_2\\frac12-\\frac12\\log_2\\frac12=1<\/span> 比特。分布二：<span class=\"katex-inline\">0.9/0.1<\/span>，<span class=\"katex-inline\">H=-0.9\\log_2 0.9-0.1\\log_2 0.1<\/span>，约 0.469 比特。分布三：确定事件 <span class=\"katex-inline\">p_1=1<\/span>，<span class=\"katex-inline\">H=-1\\log_2 1=0<\/span>。同一两个符号，概率越集中熵越低，越分散熵越高；熵度量的是不确定性，不是符号数目。<\/p>\n<h3>补充算例五：等概上界与冗余估计<\/h3>\n<p>等概率 <span class=\"katex-inline\">s<\/span> 种符号时 <span class=\"katex-inline\">H=\\log_2 s<\/span>：<span class=\"katex-inline\">s=2<\/span> 为 1 比特，<span class=\"katex-inline\">s=32<\/span> 为 5 比特。英语实测估计每字母约 2.3 比特；八字母以内结构冗余约一半，句段层面冗余约四分之三（PDF 第 243–245 页）。冗余来自字母组合习惯与上下文依赖：给定前文，后续字母选择范围收窄，平均意外程度下降。冗余既可被压缩利用，也可在噪声环境下帮助还原。<\/p>\n<h3>延伸辨析：熵、信息量与概率<\/h3>\n<p>熵是信源平均不确定性；一次具体讯息带来的信息量取决于该讯息的意外程度。概率集中的符号出现时意外低，罕见符号出现时意外高。熵对概率分布加权平均，不是对符号数目计数。等概时熵达到上界 <span class=\"katex-inline\">\\log_2 s<\/span>；分布越偏离均匀，熵离上界越远。<\/p>\n<h3>边界走查：单位与底数<\/h3>\n<p>bit 由约翰·怀尔德·图基最早提出，香农采用为以 2 为底单位；以 10 为底称班（ban），以自然对数为底称 nat（PDF 第 243 页）。同一不确定性换底数只做单位换算，度量本身不变。公式 <span class=\"katex-inline\">H=-\\sum_i p_i\\log_2 p_i<\/span> 中，<span class=\"katex-inline\">p_i<\/span> 为第 <span class=\"katex-inline\">i<\/span> 个符号概率，求和遍历全部符号；<span class=\"katex-inline\">0\\log 0<\/span> 按 0 处理。<\/p>\n<h3>延伸辨析：冗余的两个方向<\/h3>\n<p>自然语言冗余帮助读懂错别字与残缺字句，对应抗噪方向；压缩算法去掉可缩减冗余，对应缩短长度方向。冗余多少由信源统计结构决定，不由使用者任意增减。贝蒂猜字母测试中，受试凭上下文逐字母补全，依赖的正是语言冗余（PDF 第 245 页）。c09 纠错编码在信道侧加入受控冗余，与信源侧压缩去冗余方向相反。<\/p>\n<h2>再算一例与边界补推<\/h2>\n<h3>补充算例六：三符号分布熵手算<\/h3>\n<p>三符号等概 <span class=\"katex-inline\">p=1/3<\/span>：<span class=\"katex-inline\">H=-3\\times\\frac13\\log_2\\frac13=\\log_2 3\\approx1.585<\/span> 比特。分布 <span class=\"katex-inline\">0.8/0.1/0.1<\/span>：<span class=\"katex-inline\">H=-0.8\\log_2 0.8-2\\times0.1\\log_2 0.1<\/span>，约 0.922 比特。同一三符号集合，概率集中后熵明显下降。熵按概率加权，不按符号个数计数；符号再多，概率集中于一个，熵趋近 0。<\/p>\n<h3>补充算例七：冗余与平均码长关系<\/h3>\n<p>信源冗余越大，分布越不均，不等长编码可压缩的平均码长空间越大；冗余越小、分布越均匀，压缩空间越小。英语每字母约 2.3 比特，距等概 26 字母的 <span class=\"katex-inline\">\\log_2 26\\approx4.7<\/span> 比特有明显差额，差额对应可压缩冗余（PDF 第 243–245 页）。句段层面冗余更高，是双字母组合与上下文依赖叠加的结果。<\/p>\n<h3>边界补推：上下文依赖分层纳入<\/h3>\n<p>单字母概率只是第一层近似；双字母组合、词组习惯、上下文预判逐层收窄后续选择范围。只按单字母频次估熵，会高估真实信源不确定性；只凭单字母分布设计压缩码，也用不上更高一层的结构。贝蒂猜字母测试中，受试凭上下文逐字母补全，依赖的正是高层冗余（PDF 第 245 页）。熵度量随纳入的结构层级不同而取值不同。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n信息在香农定义中对应什么量？\n<\/li><li>\n等概率 <span class=\"katex-inline\">s<\/span> 符号的熵是多少？端点 <span class=\"katex-inline\">s=1<\/span> 给出什么值？\n<\/li><li>\n不等概率时为什么要按概率加权？\n<\/li><li>\n英语冗余与熵此消彼长，方向是什么？\n<\/li><li>\n比特、班、nat 差别在底数还是大小？\n<\/li><li>\n熵为什么不衡量消息真假与价值？\n<\/ol>\n<h2>自检问题<\/h2>\n<ol><li>\n手算 <span class=\"katex-inline\">p=0.5/0.5<\/span> 与 <span class=\"katex-inline\">p=0.9/0.1<\/span> 两种二选一的熵，比较大小。\n<\/li><li>\n推一下：10 个双稳态设备有多少种状态、存多少比特？\n<\/li><li>\n为什么字符集大小不等于单字符信息量？\n<\/li><li>\n自然语言冗余高对压缩和可读性各意味着什么？\n<\/li><li>\n香农熵与算法复杂度分别度量什么对象？\n<\/ol><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/信息/信息简史 (［美］詹姆斯•格雷克 (作者) 高博 (译者)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.245<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">比特与香农熵：不确定性的对数度量<\/a><\/span><\/div><h1>信道容量与有噪信道编码定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（第 7 章 信息论，PDF 第 223–248 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>远距离通信中信号总被噪声削弱：静电、天电、干扰、失真混入线路。早期工程思路是增大发射功率，但信号放大时噪声一起积累，长距离上失效。香农要回答：在给定信道与噪声条件下，信息最多能以多快速率可靠传输？低于这个速率，能不能不靠提升功率，而靠编码把错误概率压下来？这两个问题的答案分别是信道容量与有噪信道编码定理。<\/p>\n<h2>定义<\/h2>\n<p><strong>通信模型<\/strong>：信源产生讯息，发送器把讯息编码成信号，信号经信道传到接收端，接收器执行逆操作解码，信宿收到讯息；噪声是模型中独立一方，涵盖一切削弱信号的因素（PDF 第 238–239 页）。<\/p>\n<p><strong>信道容量<\/strong>：任何信道上信息传输速率的上限（香农限）。容量由信道物理条件决定，与用什么编码、发什么内容无关。<\/p>\n<p><strong>有噪信道编码定理<\/strong>：只要信息传输速率不超过信道容量，就存在一种纠错编码方案，克服任何程度噪声，使错误概率任意小；速率越接近容量，所需纠错比特越多、传输越慢（PDF 第 245 页）。<\/p>\n<p><strong>离散/连续/混合系统<\/strong>：模型按信号形态分三类；离散情形数学上更基本，电报是典型离散系统，电话语音属连续系统，采样后可纳入离散分析（PDF 第 239、218 页）。<\/p>\n<p>正例：鼓语不靠更用力击鼓，而给言语增加额外字词补语境；工程上对应不靠功率而靠纠错冗余对抗噪声（PDF 第 239 页）。反例：速率超过容量时，定理不承诺可靠传输；再精巧的编码也突破不了信道物理上限。<\/p>\n<h2>原理推导<\/h2>\n<p>先推模型剥离。通信基本问题是在一点精确或近似复现另一点选取的讯息；意义依赖接收者阐释体系，无法在工程上统一度量，因此被排除在模型之外。模型只处理符号可还原：发送器编码、接收器解码，噪声干扰符号序列（PDF 第 237–239 页）。<\/p>\n<p>再推容量作为上限。信道带宽、信噪比、采样速率共同决定单位时间可传的最大比特数；这个上界 <span class=\"katex-inline\">C<\/span> 与讯息内容无关。哈特利早先把信息量归结为传输时间与带宽两个因素（PDF 第 218 页），香农把噪声概率结构纳入后给出容量概念。<\/p>\n<p>接着推定理为何能压错误概率。发送端不加大功率，而在讯息外加冗余符号；接收端利用冗余对照纠错。定理断言 <span class=\"katex-inline\">R&lt;C<\/span> 时存在编码使错误概率任意小；<span class=\"katex-inline\">R<\/span> 越近 <span class=\"katex-inline\">C<\/span>，冗余占比越高、速率越慢。定理只证明存在性，不给出具体码本；费诺回忆，此前没人想过错误概率可以被压到任意小（PDF 第 245 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：噪声可用统计模型描述；信道容量可估计；编码在两端共享；速率控制在容量以内。\n<\/li><li>\n边界一：定理是存在性结论，不直接提供可用编码；具体码本设计是后续工程问题。\n<\/li><li>\n边界二：编码利用概率结构抗噪，不能消除物理失真本身；超过容量的可靠传输无定理保障。\n<\/li><li>\n失败案例：把功率当唯一抗噪手段。信号与噪声同被放大，长距离上噪声积累抵消功率收益；鼓语与纠错码都走冗余路径，而非加力路径（PDF 第 239 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>容量 vs 速率<\/strong>：容量是信道物理上限，速率是实际传输选择；可靠传输要求速率低于容量，留有纠错余量。\n<\/li><li>\n<strong>纠错冗余 vs 信源压缩<\/strong>：压缩去掉信源自身冗余以缩短长度，纠错编码加入额外符号对抗信道噪声；两者方向相反，常在系统两端分别进行。\n<\/li><li>\n<strong>模型剥离意义 vs 否认意义<\/strong>：香农模型把意义请出门外是工程建模需要，不等于意义不存在；意义问题在尾声重新接回（c15）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c08 熵度量信源不确定性，c06 电报离散系统，c07 电话带宽与噪声。后继：c14 信息是物理的把信道载体与能耗约束接回；c15 信息过载时代的索引筛选可视为信道容量有限时的组织补偿。本章模型是全书通信与编码讨论的理论框架。<\/p>\n<p>补充对照：模型五要素依次为信源、发送器、信道、接收器、信宿，噪声作为独立一方插入信道；模型分离散、连续、混合三类，离散情形先建立理论，连续语音采样后再纳入分析（PDF 第 238–239 页）。韦弗 1949 年把香农 1948 年《通信的数学理论》整理成面向更宽读者的解释，使信息论从工程论文扩散到其他领域。定理只证明存在性：在 <span class=\"katex-inline\">R&lt;C<\/span> 范围内存在编码使错误概率任意小，具体码本长度、结构与译码算法不随定理一并给出；费诺回忆，在这之前工程上没人设想错误概率可以被压到任意小，而非只能靠加大功率缓解。<\/p>\n<p>边界补充：容量由带宽、噪声概率结构与采样条件共同决定，不随信源内容改变；同一信道传不同讯息，容量上限不变。把定理结论误读成「任何噪声下都能无错传输」，会忽略速率必须低于容量这一前提；误读成「定理给出现成码本」，会跳过码长、冗余比例与译码复杂度的工程设计。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（信道容量与有噪信道编码定理）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：通信模型剥离、容量上限与有噪信道编码定理<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把信道容量与编码定理讲成可推演结论，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先把通信抽象成模型<\/strong>。信源、发送器、信道、接收器、信宿加噪声，各方格分工明确；不先建模，噪声与信号混在一起无法分析。\n<\/li><li>\n<strong>确认意义可剥离<\/strong>。工程模型只处理符号可还原，意义依赖阐释体系不纳入度量；剥离意义是建模需要，不是否认意义存在。\n<\/li><li>\n<strong>确认噪声是统计干扰<\/strong>。噪声可用概率结构描述，编码利用冗余对照纠错；噪声若完全不可统计，定理无从成立。\n<\/li><li>\n<strong>确认速率与容量可比较<\/strong>。信道有物理上限，实际速率可与之比较；低于容量才有可靠传输空间。\n<\/ol>\n<p>依赖链方向：模型建模 → 意义剥离 → 噪声统计化 → 容量定上限 → 冗余编码纠错。任何一层缺失：模型不清则各方职责混叠；意义不剥离则工程问题退化为阐释问题；噪声不可统计则编码无依据；无容量概念则可靠传输边界说不清。<\/p>\n<h2>正向推导：从模型剥离推到编码定理<\/h2>\n<h3>第一步：推模型各方职责<\/h3>\n<p>通信基本问题是在一点精确或近似复现另一点选取的讯息。信源产生讯息，发送器编码成信号，信号经信道传到接收端，接收器逆操作解码，信宿收到讯息；噪声是独立一方，涵盖静电、天电、干扰、失真等一切削弱信号的因素（PDF 第 238–239 页）。各方格可单独分析，再拼成完整链路。<\/p>\n<h3>第二步：推意义为何被请出门外<\/h3>\n<p>意义依赖接收者阐释体系，无法在工程上统一度量；香农明确把语义因素排除在工程问题之外（PDF 第 237–238 页）。模型只处理符号可还原：发送器编码、接收器解码，噪声干扰符号序列。剥离意义使信道、速率、码长成为可计算对象；意义问题留待阐释层处理。<\/p>\n<h3>第三步：推系统分类<\/h3>\n<p>模型按信号形态分连续、离散、混合三类；离散情形数学上更基本，电报是典型离散系统，电话语音属连续系统，采样后可纳入离散分析（PDF 第 239、218 页）。分类决定用哪套数学工具：离散用符号序列，连续用波形采样。<\/p>\n<h3>第四步：推容量作为物理上限<\/h3>\n<p>信道带宽、信噪比、采样速率共同决定单位时间可传最大比特数，这个上界 <span class=\"katex-inline\">C<\/span> 与讯息内容无关。哈特利早先把信息量归结为传输时间与带宽两个因素（PDF 第 218 页）；香农把噪声概率结构纳入后给出容量概念。容量是信道物理条件决定的香农限。<\/p>\n<h3>第五步：推定理成立条件<\/h3>\n<p>发送端不加大功率，而在讯息外加冗余符号；接收端利用冗余对照纠错。定理断言：只要 <span class=\"katex-inline\">R&lt;C<\/span>，存在编码使错误概率任意小；<span class=\"katex-inline\">R<\/span> 越近 <span class=\"katex-inline\">C<\/span>，冗余占比越高、速率越慢（PDF 第 245 页）。定理只证明存在性，不给出具体码本；费诺回忆，此前没人想过错误概率可被压到任意小（PDF 第 245 页）。<\/p>\n<h3>第六步：推功率路径为何失效<\/h3>\n<p>早期远距离通信靠增大发射功率对抗噪声，但信号放大时噪声一起积累，长距离上失效（PDF 第 239 页）。香农换冗余路径：正如非洲鼓手不是更用力击鼓，而给言语增加额外字词（PDF 第 239 页）。冗余符号在接收端提供第二次对照机会，把统计性错误压下去。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：模型链路对照<\/h3>\n<p>电报链路：信源为待发文字，发送器为电键编码，信道为电线加中继器，接收器为电磁铁记录，信宿为收报人；噪声为线路静电与干扰。各方格对应清楚后，可单独优化编码或中继。<\/p>\n<h3>算例 2：容量与速率比较<\/h3>\n<p>设信道容量 <span class=\"katex-inline\">C<\/span>，实际速率 <span class=\"katex-inline\">R<\/span>。<span class=\"katex-inline\">R&lt;C<\/span> 定理保障可靠传输；<span class=\"katex-inline\">R=C<\/span> 处于边界；<span class=\"katex-inline\">R&gt;C<\/span> 定理不承诺可靠。工程设计在 <span class=\"katex-inline\">C<\/span> 之下留纠错余量，余量大小决定错误概率水平。<\/p>\n<h3>算例 3：冗余占比与速率<\/h3>\n<p>速率越接近容量，所需纠错比特越多，有效讯息占比越低；<span class=\"katex-inline\">R<\/span> 远低于 <span class=\"katex-inline\">C<\/span> 时冗余占比小、速率快。纠错冗余与信源压缩方向相反：压缩去信源冗余，纠错加信道冗余。<\/p>\n<h3>算例 4：鼓语冗余对照<\/h3>\n<p>鼓语不靠更用力击鼓，而加固定套语补语境（PDF 第 42、239 页）。工程纠错码对应额外符号：传输时长或比特预算换可分辨性，与鼓语同构。<\/p>\n<h3>算例 5：噪声来源<\/h3>\n<p>噪声涵盖静电、天电、线路干扰、信号失真；约翰逊度量电路固有热噪声，奈奎斯特给出波动公式（PDF 第 215 页）。噪声是统计性随机干扰，编码利用概率结构对抗，不能消除物理失真本身。<\/p>\n<h3>算例 6：离散连续混合<\/h3>\n<p>电报离散点划；电话连续声波；传真扫描图像明暗成比例电流（PDF 第 215 页）。混合系统含离散与连续环节，模型分别处理再拼接。<\/p>\n<h3>算例 7：存在性与码本设计<\/h3>\n<p>定理证明存在一种编码使错误概率任意小，但不给出码本；具体码本设计是后续工程问题。费诺等人在定理之后才逐步逼近可用编码方案（PDF 第 245 页）。<\/p>\n<h3>算例 8：功率放大对照<\/h3>\n<p>加大发射功率：信号与噪声同被放大，沿线噪声积累；中继分段重发与纠错编码：信号分段再生，冗余对照纠错。两条路径在长距离上的表现差别明显。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>去掉纠错冗余<\/strong>：讯息压到最短，信道出现符号错误时无多余符号对照，错误直接落到明文；速率看似提高，错误概率随噪声累积。\n<\/li><li>\n<strong>把意义纳入工程模型<\/strong>：要求模型先判断讯息指向的实体，通信问题退化为心理学与哲学问题；容量、码长这些可计算对象无法建立。\n<\/li><li>\n<strong>速率超过容量<\/strong>：再精巧编码也突破不了信道物理上限；定理不承诺可靠传输，错误概率压不到任意小。\n<\/li><li>\n<strong>只靠功率抗噪<\/strong>：信号噪声同被放大，长距离噪声积累抵消功率收益；冗余路径才是定理给出的方向。\n<\/ul>\n<h2>延伸层：信道模型在全书的框架地位<\/h2>\n<p>香农模型把电报、电话、噪声统一成一套抽象：信源—信道—信宿。c08 熵度量信源不确定性，c09 容量限定传输上限；c14 把信道载体与能耗约束接回物理；c15 过载时代的索引筛选可视为容量有限时的组织补偿。模型剥离意义是工程建模需要，尾声再把意义接回（c15）。理解模型边界，才不会把信息论结论套到意义判断上。<\/p>\n<h2>补足推导：前提塌陷点、定理适用边界与冗余分工<\/h2>\n<p>信道模型成立依赖三条前提：噪声可用统计模型描述；容量可估计；编码两端共享。噪声不可统计则编码无依据；容量不可估则速率比较落空；码本不共享则解码失败。定理边界：存在性结论不提供具体码本；超过容量无保障；编码利用概率结构，不消除物理失真。冗余分工：信源压缩去掉自身冗余缩短长度，信道纠错加入额外符号对抗噪声，两者常在系统两端分别进行。不变量：给定信道与噪声统计，容量是物理上限；可靠传输要求速率留有余量。模型不回答讯息是否有意义、是否正确，这些属阐释与价值判断。<\/p>\n<h2>补充算例与延伸辨析<\/h2>\n<h3>补充算例四：速率与容量余量走查<\/h3>\n<p>设信道容量为 <span class=\"katex-inline\">C<\/span>，实际速率 <span class=\"katex-inline\">R<\/span>。<span class=\"katex-inline\">R&lt;C<\/span> 时定理承诺存在编码使错误概率任意小；<span class=\"katex-inline\">R<\/span> 越接近 <span class=\"katex-inline\">C<\/span>，纠错要占的比特越多，有效净速率越低。<span class=\"katex-inline\">R&gt;C<\/span> 时定理不承诺可靠传输，再精巧编码也突破不了物理上限。设计上需在容量以内留出纠错余量，余量大小由噪声强度与可接受错误概率决定。<\/p>\n<h3>补充算例五：纠错冗余随速率变化<\/h3>\n<p>讯息外加冗余符号，接收端用冗余对照纠错。<span class=\"katex-inline\">R<\/span> 离 <span class=\"katex-inline\">C<\/span> 越远，需要的冗余占比越低；逼近容量时，几乎所有传输预算都用来抗噪。冗余不是越多越好：冗余过高压缩有效讯息速率，冗余不足错误概率压不下来。定理只给存在性，码长、冗余比例与译码复杂度要由具体编码方案解决。<\/p>\n<h3>延伸辨析：信源压缩与信道纠错的分工<\/h3>\n<p>信源压缩去掉信源自身冗余，缩短待传长度；信道纠错加入额外符号，对抗传输噪声。两端方向相反，常在同一通信系统前后分别进行：先压缩源端冗余，再为信道加纠错冗余。把两者混在一起，会在不该省的地方省掉抗噪符号，或在不该加的地方重复源端已有结构。<\/p>\n<h3>边界走查：存在性结论的范围<\/h3>\n<p>定理断言 <span class=\"katex-inline\">R&lt;C<\/span> 时存在编码，使错误概率任意小；它不给出具体码本，也不保证译码简单。费诺回忆，此前工程上没人设想错误概率可被压到任意小（PDF 第 245 页）。把存在性结论当成现成可用方案，会跳过码长设计、冗余比例核算与译码算法实现。超过容量的可靠传输无定理保障，放大信号会连同噪声一起放大。<\/p>\n<h3>延伸辨析：模型五要素与噪声位置<\/h3>\n<p>信源产生讯息，发送器编码，信道传输，接收器解码，信宿收到；噪声独立一方插入信道，涵盖静电、天电、干扰、失真等（PDF 第 238–239 页）。模型分离散、连续、混合三类，离散先建理论，连续语音采样后纳入。意义被剥离是建模需要：意义依赖阐释体系，工程上无法统一度量；剥离不等于否认意义，意义问题在 c15 重新接回。<\/p>\n<h2>再算一例与边界补推<\/h2>\n<h3>补充算例六：重复码与错误概率直觉<\/h3>\n<p>把一个讯息位重复多次发送，接收端按多数表决纠错：重复次数增加，单段同时出错并压倒多数的概率下降。这是最简单的受控冗余思路；重复码冗余占比高、有效速率低，只作直觉示例，不是高效编码。定理在 <span class=\"katex-inline\">R&lt;C<\/span> 范围内承诺存在更优编码使错误概率任意小，具体码本不随定理给出。<\/p>\n<h3>补充算例七：容量由物理条件决定<\/h3>\n<p>信道带宽、噪声概率结构、采样速率共同决定单位时间可传最大比特数；容量 <span class=\"katex-inline\">C<\/span> 与讯息内容、编码方案无关。哈特利早先把信息量归结为传输时间与带宽（PDF 第 218 页），香农把噪声概率结构纳入后给出容量概念。换讯息内容不改变信道容量；改善带宽或降低噪声才抬高容量上限。<\/p>\n<h3>边界补推：存在性结论再走查<\/h3>\n<p>定理证明的是「存在编码」，不是「任意编码都行」，也不给出码长、冗余比例与译码复杂度。<span class=\"katex-inline\">R<\/span> 越近 <span class=\"katex-inline\">C<\/span>，所需冗余越多、译码越复杂；<span class=\"katex-inline\">R&gt;C<\/span> 时无可靠传输保障。工程落地要在定理存在性之外，另做码本设计、冗余核算与译码实现。把定理结论当成现成可用方案，会跳过这些工程环节；把容量当成实际速率，又忽略了纠错余量。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n通信模型各方格各承担什么职责？\n<\/li><li>\n意义为什么被排除在工程模型之外？\n<\/li><li>\n容量与实际速率是什么关系？\n<\/li><li>\n定理说的「存在编码」是否等于给出可用码本？\n<\/li><li>\n纠错冗余与信源压缩方向为何相反？\n<\/li><li>\n功率放大为什么在长距离上失效？\n<\/ol>\n<h2>自检问题<\/h2>\n<ol><li>\n画出通信模型链路，标出噪声位置。\n<\/li><li>\n推一下：<span class=\"katex-inline\">R<\/span> 接近 <span class=\"katex-inline\">C<\/span> 时纠错冗余占比怎样变化？\n<\/li><li>\n为什么定理只证明存在性，不直接给编码方案？\n<\/li><li>\n离散、连续、混合三类系统各举本书一例。\n<\/li><li>\n模型剥离意义与否认意义存在，差别在哪里？\n<\/ol><\/div><\/details>", "c10": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/信息/信息简史 (［美］詹姆斯•格雷克 (作者) 高博 (译者)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.291<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">比特与香农熵：不确定性的对数度量<\/a><\/span><\/div><h1>热力学熵、麦克斯韦妖与信息转向<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（第 8 章 信息转向、第 9 章 熵及其妖，PDF 第 251–302 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>信息熵与热力学熵公式长得像，两者是不是一回事？麦克斯韦设想一个能逐个分辨分子快慢的小存在，看似无需做功就把冷热分开，违背第二定律。要解开这个悖论，必须追问：妖观察、记忆分子状态的过程要不要付代价？与此同时，控制论、反馈、神经元模型把信息观念从通信工程推进到动物、机器与心智，这一转向的概念支点是什么。<\/p>\n<h2>定义<\/h2>\n<p><strong>热力学熵<\/strong>：克劳修斯造出 entropy 一词；第一定律是宇宙能量守恒，第二定律是宇宙熵恒增。统计力学把熵写成微观状态数目的对数：宏观状态对应的微观组合越多，熵越高（PDF 第 287–291 页）。<\/p>\n<p><strong>麦克斯韦妖<\/strong>：麦克斯韦设想的智能存在，能看清分子快慢、控制隔板微孔，把快分子慢分子分到两侧；它看似违背第二定律，实则必须为获取和记忆信息支付熵成本（PDF 第 291 页）。<\/p>\n<p><strong>齐拉特分析<\/strong>：齐拉特 1929 年指出，妖在两个分子间作选择要消耗一比特信息；度量与记忆不是免费的，旧记忆清除时熵增加 <span class=\"katex-inline\">k\\ln 2<\/span> 量级（PDF 第 294–295 页）。<\/p>\n<p><strong>控制论<\/strong>：维纳 1948 年出版《控制论：或关于在动物和机器中控制和通信的科学》，cybernetics 借自希腊语「舵手」；反馈分正反馈（输出回授输入端导致失控）与负反馈（导向均衡）（PDF 第 252–255 页）。<\/p>\n<p>正例：混合气体自发分成冷热两半并非不可能，只是概率极小；熵增方向对应微观状态从少到多的统计倾向（PDF 第 290–291 页）。反例：妖若不付信息成本就分辨分子，第二定律在微观尺度被持续违背，悖论无法消解。<\/p>\n<h2>原理推导<\/h2>\n<p>先推热力学熵的统计形式。宏观状态由大量微观分子位置速度组合实现；一个宏观状态对应的微观组合数目记 <span class=\"katex-inline\">\\Omega<\/span>，熵 <span class=\"katex-inline\">S=k\\ln\\Omega<\/span>。混合气体的微观组合远多于分层气体，自发分层概率极低，第二定律是统计规律而非绝对禁令（PDF 第 290–291 页）。<\/p>\n<p>再推妖悖论的结构。隔板两侧各有快慢分子混杂，妖守微孔：快分子放行到一侧，慢分子留另一侧。无需做功，两侧形成温差，可驱动热机循环，第二定律被绕过。悖论缺口在妖的信息环节：看清分子快慢、记住哪些已放行，本身是物质过程。<\/p>\n<p>接着推信息成本核算。齐拉特把妖的选择对应一比特信息；每次测量获得状态，旧记忆需要清除才能继续工作。擦除一比特把信息熵换回热力学熵，代价 <span class=\"katex-inline\">k\\ln 2<\/span> 量级；计入这笔成本，系统总熵仍不减，第二定律守住（PDF 第 294–295 页）。两公式对照：<span class=\"katex-inline\">S=-k\\sum_i p_i\\ln p_i<\/span> 与 <span class=\"katex-inline\">H=-\\sum_i p_i\\log_2 p_i<\/span> 同构，是同一概率问题在两套系统里的表达。<\/p>\n<p>最后推信息转向。维纳把反馈机制推广到手眼协调、高射炮火控；区分模拟机器与数值机器，把神经元看作双稳态继电器阵列，并提出「信息就是信息，既不是物质也不是能量」（PDF 第 256–257 页）。信息作为独立对象进入动物、机器与心智讨论；维纳称信息是负熵，薛定谔 1943 年《生命是什么》用负熵描述生命体从环境吸取秩序（PDF 第 295 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：妖的观察与记忆依托物质过程；熵成本可计入系统总账；反馈回路有可观测的输出回授输入端。\n<\/li><li>\n边界一：信息熵与热力学熵同构不等同。跨领域类比要先确认概率对象；信息熵度量不确定性，热力学熵度量微观状态数。\n<\/li><li>\n边界二：麦克斯韦妖是思想实验，不构造实际机器；论证目标是说明信息处理有物理代价，不是造出永动机。\n<\/li><li>\n失败案例：把妖当成免费全知观察者，不计测量与记忆成本；这是悖论成立的错误前提，不是第二定律被推翻。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>负反馈 vs 正反馈<\/strong>：负反馈把系统导向均衡，如离心调速器；正反馈让输出回授后放大偏离，可能失控（PDF 第 253 页）。\n<\/li><li>\n<strong>信息 vs 物质能量<\/strong>：信息不与物质、能量混同，但必须依托物质过程传输存储；维纳命题强调对象独立性，不否认物理载体。\n<\/li><li>\n<strong>控制论 vs 信息论<\/strong>：信息论处理符号传输与度量，控制论处理动物与机器中的反馈、通信与控制；两者在维纳工作中汇合。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c08 熵公式，c09 通信模型。后继：c14 兰道尔原理把妖的记忆擦除成本写成单比特热力学下限；c11 生命体以负熵维持秩序是薛定谔线索的延伸；c13 算法随机性另起一套不依赖热力学的信息定义。本章是工程熵与物理熵合流的枢纽。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（热力学熵、麦克斯韦妖与信息转向）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：热力学熵统计形式、妖悖论成本核算与信息转向<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把信息熵与热力学熵合流讲清，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先分清两条熵的来源<\/strong>。热力学熵来自分子热运动与微观状态统计；信息熵来自信源不确定性。公式同构不等于对象等同，先分来源再看对应。\n<\/li><li>\n<strong>确认第二定律是统计规律<\/strong>。熵增方向对应微观状态从少到多的概率倾向，不是绝对禁令；混合气体自发分层概率极低但不为零。\n<\/li><li>\n<strong>追踪妖的信息环节<\/strong>。妖分辨分子快慢要观察、要记忆；悖论缺口在这些物质过程，不在分子运动本身。\n<\/li><li>\n<strong>确认信息依托物质过程<\/strong>。观察、度量、记忆都耗散能量；不承认这一点，妖悖论无法消解。\n<\/ol>\n<p>依赖链方向：热力学熵统计形式 → 妖思想实验 → 观察记忆信息成本 → 擦除增熵 → 两公式同构 → 信息进入动物机器心智。任何一层缺失：不承认统计性则把熵增当绝对禁令；漏掉信息环节则妖看似违背定律；不承认物理依托则成本核算落空。<\/p>\n<h2>正向推导：从热力学熵推到信息转向<\/h2>\n<h3>第一步：推热力学熵的统计形式<\/h3>\n<p>克劳修斯造出 entropy 一词；第一定律是宇宙能量守恒，第二定律是宇宙熵恒增（PDF 第 287–288 页）。统计力学把熵写成微观状态数目的对数：宏观状态对应的微观组合越多，熵越高。混合气体的微观组合远多于分层气体，自发分层概率极低，第二定律是统计规律而非绝对禁令（PDF 第 290–291 页）。<\/p>\n<h3>第二步：推妖悖论的结构<\/h3>\n<p>隔板两侧各有快慢分子混杂，妖守微孔：快分子放行到一侧，慢分子留另一侧。无需做功，两侧形成温差，可驱动热机循环，第二定律被绕过（PDF 第 291 页）。悖论缺口在妖的信息环节：看清分子快慢、记住哪些已放行，本身是物质过程。<\/p>\n<h3>第三步：推信息成本核算<\/h3>\n<p>齐拉特 1929 年指出，妖在两个分子间作选择要消耗一比特信息；度量与记忆不是免费的，旧记忆清除时熵增加 <span class=\"katex-inline\">k\\ln 2<\/span> 量级（PDF 第 294–295 页）。观察选择可逆，旧记录擦除不可逆；擦除把信息熵换回热力学熵。计入这笔成本，系统总熵仍不减，第二定律守住。<\/p>\n<h3>第四步：推两公式同构<\/h3>\n<p>热力学 <span class=\"katex-inline\">S=-k\\sum_i p_i\\ln p_i<\/span>，信息熵 <span class=\"katex-inline\">H=-\\sum_i p_i\\log_2 p_i<\/span>，形式同构：同一概率问题在两套系统里的表达（PDF 第 295 页）。差别在常数与底数：热力学乘玻尔兹曼常数 <span class=\"katex-inline\">k<\/span>、用自然对数；信息熵以 2 为底、单位比特。同构使信息与热力学可互相参照，但对象不混同。<\/p>\n<h3>第五步：推信息转向<\/h3>\n<p>维纳 1948 年出版《控制论》，cybernetics 借自希腊语「舵手」；反馈分正反馈（输出回授输入端导致失控）与负反馈（导向均衡）（PDF 第 252–255 页）。手眼协调、高射炮火控都靠反馈信息维持稳态。维纳区分模拟机器与数值机器，把神经元看作双稳态继电器阵列，提出「信息就是信息，既不是物质也不是能量」（PDF 第 256–257 页）。<\/p>\n<h3>第六步：推负熵与生命<\/h3>\n<p>维纳称信息是负熵；薛定谔 1943 年《生命是什么》用负熵描述生命体从环境吸取秩序（PDF 第 295 页）。生命体维持低熵结构，靠环境输入物质与能量；信息作为秩序的度量进入生命讨论。1946 至 1953 年梅西会议把神经生理学家、人类学家、数学家与工程师聚到一起，信息观念跨学科扩散（PDF 第 258 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：微观状态对照<\/h3>\n<p>隔板两侧分子混杂，微观组合数目巨大；分成快慢两侧后组合数目少。熵 <span class=\"katex-inline\">S=k\\ln\\Omega<\/span>，<span class=\"katex-inline\">\\Omega<\/span> 大则 <span class=\"katex-inline\">S<\/span> 高。自发分层对应 <span class=\"katex-inline\">\\Omega<\/span> 骤降，概率极低，不是不可能。<\/p>\n<h3>算例 2：一比特擦除代价<\/h3>\n<p>妖每作一次选择对应一比特信息；擦除旧记忆熵增 <span class=\"katex-inline\">k\\ln 2<\/span> 量级（PDF 第 295 页）。<span class=\"katex-inline\">k<\/span> 为玻尔兹曼常数，<span class=\"katex-inline\">T<\/span> 为温度；温度越高，擦除一比特热熵代价越大。观察本身可逆，擦除不可逆。<\/p>\n<h3>算例 3：公式同构对照<\/h3>\n<p><span class=\"katex-inline\">S=-k\\sum p_i\\ln p_i<\/span> 与 <span class=\"katex-inline\">H=-\\sum p_i\\log_2 p_i<\/span>：求和结构相同，底数与常数不同。换底只差因子，概率加权方式一致。<\/p>\n<h3>算例 4：反馈回路<\/h3>\n<p>负反馈：输出与目标比较，偏差回授输入端纠正，如离心调速器把转速导向均衡；正反馈：输出回授后放大偏离，可能失控（PDF 第 253 页）。两类反馈在控制系统中方向相反。<\/p>\n<h3>算例 5：神经元阵列<\/h3>\n<p>维纳把神经元看作双稳态继电器阵列；每个单元两态，组合状态对应信息处理。这一类比把生物神经与电路开关放在同一信息框架下（PDF 第 256 页）。<\/p>\n<h3>算例 6：生命负熵<\/h3>\n<p>薛定谔描述生命体以负熵为食，从环境吸取秩序维持自身低熵结构；环境相应增熵，总账仍符合第二定律（PDF 第 295 页）。局部低熵不违反全局熵增。<\/p>\n<h3>算例 7：妖的总账<\/h3>\n<p>妖观察分子：信息获取可逆，不增熵；擦除上一次记录：不可逆，增 <span class=\"katex-inline\">k\\ln 2<\/span>。把擦除成本计入系统，总熵不减；不计这笔成本，悖论才出现。<\/p>\n<h3>算例 8：信息独立性命题<\/h3>\n<p>维纳命题：信息既不是物质也不是能量（PDF 第 257 页）。这强调信息作为独立对象；但信息必须依托物质过程传输存储，两条主张分别针对抽象层与实现层。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>妖免费获取分子信息<\/strong>：不付度量记忆成本就分辨快慢分子，隔板两侧自发分成冷热，第二定律微观尺度被持续违背；悖论无法消解。\n<\/li><li>\n<strong>每个逻辑动作都付热熵代价<\/strong>：冯·诺伊曼 1949 年这一估算被兰道尔修正；多数可逆操作不增熵，只有擦除增熵（c14）。\n<\/li><li>\n<strong>把信息熵与热力学熵当成同一对象<\/strong>：跨领域类比忽略概率对象差别；信息熵度量不确定性，热力学熵度量微观状态数。\n<\/li><li>\n<strong>反馈只走正反馈<\/strong>：系统偏离被放大失控；负反馈导向均衡。两类反馈在控制系统中不可混用。\n<\/ul>\n<h2>延伸层：妖悖论通向信息物理<\/h2>\n<p>本章把 c08 工程熵接到热力学：妖的记忆擦除环节正是 c14 兰道尔原理的思想前身。本内特沿齐拉特与兰道尔进路分析妖的记忆擦除，确认许多计算可逆、热量只在擦除时耗散。控制论则把信息推向动物与机器：反馈、神经元模型、梅西会议构成信息转向的社会网络。图灵 1950 年模仿博弈把机器能否思考纳入讨论（PDF 第 269 页）；米勒神奇之数七把观察者视为信道（PDF 第 275 页）。信息由此从通信工程扩散到心智与生命领域。<\/p>\n<h2>补足推导：前提塌陷点、同构边界与可逆不可逆<\/h2>\n<p>熵与妖论证成立依赖三条前提：观察记忆依托物质过程；擦除不可逆可计入总账；反馈回路有输出回授输入端。去掉物质依托，妖成为免费全知观察者；不计擦除成本，总账少算一笔；无回授则反馈不成立。同构边界：公式形式相同，对象与单位不同；信息熵可在无热力学温度处使用，热力学熵不能直接搬到信源。可逆不可逆：翻转一比特信息守恒不增熵，擦除压缩状态空间增熵；可逆计算理论上零能耗，现实存储擦除需求使纯可逆难以落地。不变量：系统总熵不减，局部低熵由环境增熵补偿。<\/p>\n<h2>补充算例与延伸辨析<\/h2>\n<h3>补充算例四：两条熵公式对照<\/h3>\n<p>热力学熵 <span class=\"katex-inline\">S=k\\ln\\Omega<\/span>，玻尔兹曼把宏观熵对应微观状态数目；概率形式 <span class=\"katex-inline\">S=-k\\sum_i p_i\\ln p_i<\/span>（PDF 第 291–293 页）。信息熵 <span class=\"katex-inline\">H=-\\sum_i p_i\\log_2 p_i<\/span>。两条公式同构：都按概率加权对数，差别在常数与底数——热力学带玻尔兹曼常数 <span class=\"katex-inline\">k<\/span>、用自然对数，信息熵以 2 为底、单位比特。换底数与单位，结构形式一致。<\/p>\n<h3>补充算例五：妖的两步成本走查<\/h3>\n<p>麦克斯韦妖逐个分辨分子快慢、控制隔板微孔，看似让气体自发分冷热，绕过第二定律。齐拉特 1929 年分析指出妖的观察与记录环节要入账；本内特后续分析确认，观察选择分子可视为可逆操作，不增熵；擦除上一次观察记录、为下一次腾出空间时不可逆，增 <span class=\"katex-inline\">k\\ln 2<\/span> 量级热熵（PDF 第 291–295 页）。计入擦除成本，妖所在系统总熵不减，第二定律守住。<\/p>\n<h3>延伸辨析：信息转向与控制论<\/h3>\n<p>维纳 1948 年《控制论》，cybernetics 取自希腊语舵手一词，研究正负反馈与系统行为；他讨论神经元双稳态阵列，并提出「信息既非物质也非能量」（PDF 第 252–257 页）。梅西会议 1946–1953 年汇集跨学科讨论；信息概念从工程扩散到生物、社会与行为研究。薛定谔 1943 年《生命是什么》提负熵，维纳称信息为负熵，生命靠汲取秩序维持自身。<\/p>\n<h3>边界走查：同构不等于等同<\/h3>\n<p>两条熵公式形式同构，度量对象不同：热力学熵对应微观状态数目与热温过程，信息熵对应信源不确定性。把信息熵直接当热熵相加，或反过来把热力学无序直接当通信不确定性，属于跨层混用。妖悖论消解在物理层擦除成本，不在信息层度量换算。<\/p>\n<h3>延伸辨析：第一定律与第二定律背景<\/h3>\n<p>第一定律能量守恒；第二定律孤立系统熵恒增。开尔文 1862 年提出热寂设想；克劳修斯造出 entropy 一词（PDF 第 287–291 页）。妖的设想正是在第二定律背景下提出：若存在一个能跳过统计平均、逐个分选分子的智能体，第二定律是否被绕过。结论是信息获取与记忆本身要付物理代价，统计规律未被违反。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n热力学熵的统计形式怎样写微观状态数？\n<\/li><li>\n妖悖论缺口在观察、记忆还是分子运动？\n<\/li><li>\n擦除一比特的熵代价量级是多少？\n<\/li><li>\n信息熵与热力学熵公式哪里同构、哪里不同？\n<\/li><li>\n正反馈与负反馈各导向什么结果？\n<\/li><li>\n维纳「信息既非物质也非能量」否认物理依托吗？\n<\/ol>\n<h2>自检问题<\/h2>\n<ol><li>\n推一下：为什么自发分层概率极低但不为零？\n<\/li><li>\n妖在哪一步付熵成本？观察本身为什么可逆？\n<\/li><li>\n两公式对照：底数、常数、求和结构各是什么？\n<\/li><li>\n负反馈怎样维持系统稳态？\n<\/li><li>\n生命体局部低熵为什么不违反第二定律？\n<\/ol><\/div><\/details>", "c11": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/信息/信息简史 (［美］詹姆斯•格雷克 (作者) 高博 (译者)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.308<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">比特与香农熵：不确定性的对数度量<\/a><\/span><\/div><h1>遗传编码：DNA 作为四字母码本<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（第 10 章 生命的编码，PDF 第 305–326 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>生物体发育需要指令，指令存放在哪里、用什么符号写成？孟德尔豌豆实验三比一比例说明遗传因子作为整体传递、不混合扩散，但因子的物质载体与符号形式长期不明。20 世纪中叶的问题是：把基因看成一套编码，能否像电报码、字母表那样在两端规模之间推导出码长结构？碱基怎样对应氨基酸，又怎样从一维长链造出三维生物体。<\/p>\n<h2>定义<\/h2>\n<p><strong>基因<\/strong>：约翰森提出的遗传因子术语；孟德尔实验中遗传因子整体传递，豌豆性状以三比一比例分离，不发生混合稀释（PDF 第 305 页）。<\/p>\n<p><strong>DNA 双螺旋<\/strong>：1953 年沃森与克里克在《自然》发表结构：两条碱基序列互补缠绕，分开后每条可作复制模板；碱基共四种，记为 A、C、G、T，构成四字母码表（PDF 第 308 页）。<\/p>\n<p><strong>遗传编码（遗传密码）<\/strong>：四碱基序列对应二十种氨基酸的映射；DNA 一维长链存信息，经转录为 RNA、翻译为蛋白质完成信息转移（PDF 第 312 页）。<\/p>\n<p><strong>三联体<\/strong>：三个碱基组成一个编码单元，<span class=\"katex-inline\">4^3=64<\/span> 种组合对应二十种氨基酸，余量留给同义密码子与终止信号。<\/p>\n<p>正例：薛定谔从摩尔斯电码借例：两个符号有序组合即可生成全部语言，基因也必采用某种编码（PDF 第 305 页）。反例：把遗传当成性状直接混合，无法解释三比一分离比；编码视角要求区分信息载体、复制机制与表达产物。<\/p>\n<h2>原理推导<\/h2>\n<p>先推两端规模。一端是四种碱基，另一端是二十种氨基酸。单碱基 <span class=\"katex-inline\">4^1=4<\/span> 种组合，不够二十；双碱基 <span class=\"katex-inline\">4^2=16<\/span> 种，仍不足；三联体 <span class=\"katex-inline\">4^3=64<\/span> 种，超过二十。满足 <span class=\"katex-inline\">4^k\\ge20<\/span> 的最小 <span class=\"katex-inline\">k=3<\/span>，这是码长下界（PDF 第 310 页）。<\/p>\n<p>再推映射设计的两条路径。组合论先给码长约束，具体哪三联体对应哪氨基酸是实验问题。伽莫夫先提方块码设计，被蛋白质序列实验数据否定；三联体形式被保留，具体映射靠生化实验逐步破解。RNA 领带俱乐部成员在非正式讨论中交换各类编码设想（PDF 第 310–311 页）。<\/p>\n<p>接着推信息转移链路。DNA 存一维序列；转录把碱基信息抄到 RNA；翻译按码本把序列换成氨基酸链，再折叠成蛋白质。人类 DNA 的核苷酸单位超过十亿（PDF 第 312 页）。编码表约定碱基组合与氨基酸对应，生物体按同一码本完成从序列到结构的表达。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：碱基序列可复制；转录翻译机制可执行码本映射；环境提供复制与表达的材料与能量。\n<\/li><li>\n边界一：组合数只给码长下界，不指定具体映射；哪三联体对应哪氨基酸由实验确定，纯组合论推不出。\n<\/li><li>\n边界二：遗传编码是分子水平映射，不等于生物体全部信息都写在 DNA 序列里；发育还受细胞环境、调控关系与外部条件影响。\n<\/li><li>\n失败案例：用字母编码类比直接套全部细节。DNA 是一维存储，但表达产物是三维结构；折叠、调控、翻译后加工不在碱基—氨基酸映射表内。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>遗传编码 vs 电报码<\/strong>：两者都是符号映射，前者载体是碱基分子，后者载体是电路通断；码本分别由生化机制与两端约定维护。\n<\/li><li>\n<strong>复制 vs 表达<\/strong>：DNA 互补链完成复制，把序列传给下一代；转录翻译完成表达，把序列换成蛋白质产物。\n<\/li><li>\n<strong>信息 vs 化学物质<\/strong>：碱基是化学分子，承载的序列关系是信息；同一信息可由不同化学实现表达，编码结构优先于载体材料。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 符号映射，c08 熵可度量碱基序列不确定性。后继：c12 模因把复制子概念从基因推广到文化；c14 信息依托物理载体在分子层面同样成立；c13 算法复杂度可比较 DNA 序列的可压缩程度。遗传编码是信息观念进入生命领域的落点。<\/p>\n<p>补充对照：基因一词由约翰森造出；孟德尔杂交实验给出约 3:1 的性状分离比例，为颗粒遗传提供早期观测。1953 年沃森与克里克在《自然》发表双螺旋结构；碱基为 A、C、G、T 四种。组合计数上，单碱基仅 4 种、双碱基 16 种，都不足对应二十种氨基酸，三联体 64 种留出同义密码子与终止信号的余量（PDF 第 308–312 页）。伽莫夫提出的方块码方案被后续实验否定；RNA 领带俱乐部成员围绕编码问题互通设想。人类 DNA 核苷酸数目超过十亿，一维长链把遗传信息按顺序存储（PDF 第 312 页）。<\/p>\n<p>边界补充：三联体组合数 64 大于二十种氨基酸，余量由同义密码子与终止信号占用；同一氨基酸可对应多个三联体，编码存在冗余。分子机器按顺序读取一维长链，转录与翻译各有对应环节；编码映射是分子层面的约定，与符号层面的字母表一样需要两端按同一规则完成对应。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（遗传编码：DNA 作为四字母码本）<\/summary><div class=\"depth-body\"><h1>c11 深度推导：碱基规模约束、三联体码长与遗传信息转移链路<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把遗传编码讲成可推演的码本问题，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先确认遗传因子作为整体传递<\/strong>。孟德尔三比一分离比说明因子不混合稀释；先承认因子离散传递，编码视角才有对象。\n<\/li><li>\n<strong>确认载体与符号形式<\/strong>。DNA 双螺旋互补缠绕，四种碱基构成符号表；载体结构先于映射方案确定。\n<\/li><li>\n<strong>确认两端规模<\/strong>：一端四碱基，另一端二十种氨基酸；码长由两端规模不等式决定。\n<\/li><li>\n<strong>区分组合约束与具体映射<\/strong>：组合论给码长下界，哪三联体对应哪氨基酸是实验问题；两层不能混推。\n<\/ol>\n<p>依赖链方向：因子离散传递 → DNA 双螺旋载体 → 四碱基符号表 → 两端规模不等式 → 三联体码长 → 转录翻译表达。任何一层缺失：因子混合则无编码对象；载体不明则符号无处存；规模不清则码长推不出；把组合约束当映射方案会越界。<\/p>\n<h2>正向推导：从两端规模推到三联体与表达链路<\/h2>\n<h3>第一步：推遗传因子的离散性<\/h3>\n<p>约翰森提出「基因」术语；孟德尔豌豆实验三比一比例说明遗传因子整体传递、不混合扩散（PDF 第 305 页）。性状在后代按比例分离，而非父母性状调和；这与编码符号可分离传递一致，为基因作为信息单元提供前提。<\/p>\n<h3>第二步：推薛定谔的编码类比<\/h3>\n<p>薛定谔从摩尔斯电码借例：两个符号有序组合就能生成人类全部语言，基因也必采用某种编码（PDF 第 305 页）。类比要点：少量符号经有序组合承载大量信息；遗传信息不靠性状直接传递，而靠符号序列存储。<\/p>\n<h3>第三步：推双螺旋载体结构<\/h3>\n<p>1953 年沃森与克里克在《自然》发表 DNA 双螺旋结构：两条碱基序列互补缠绕，分开后每条可作复制模板；碱基共四种，记为 A、C、G、T，构成四字母码表（PDF 第 308 页）。互补链使复制有模板可依：一条链序列决定另一条链序列。<\/p>\n<h3>第四步：推码长不等式<\/h3>\n<p>一端四种碱基，另一端二十种氨基酸。单碱基 <span class=\"katex-inline\">4^1=4<\/span> 种组合，不够二十；双碱基 <span class=\"katex-inline\">4^2=16<\/span> 种，仍不足；三联体 <span class=\"katex-inline\">4^3=64<\/span> 种，超过二十。满足 <span class=\"katex-inline\">4^k\\ge20<\/span> 的最小 <span class=\"katex-inline\">k=3<\/span>，这是码长下界（PDF 第 310 页）。64 对 20 的余量留给同义密码子与终止信号。<\/p>\n<h3>第五步：推映射设计路径<\/h3>\n<p>组合论先给码长约束，具体哪三联体对应哪氨基酸是实验问题。伽莫夫先提方块码设计，被蛋白质序列实验数据否定；三联体形式被保留，具体映射靠生化实验逐步破解。RNA 领带俱乐部成员在非正式讨论中交换各类编码设想（PDF 第 310–311 页）。<\/p>\n<h3>第六步：推信息转移链路<\/h3>\n<p>DNA 存一维序列；转录把碱基信息抄到 RNA；翻译按码本把序列换成氨基酸链，再折叠成蛋白质。人类 DNA 核苷酸单位超过十亿（PDF 第 312 页）。编码表约定碱基组合与氨基酸对应，生物体按同一码本完成从序列到结构的表达。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：组合数对照<\/h3>\n<p><span class=\"katex-inline\">k=1<\/span>：<span class=\"katex-inline\">4^1=4&lt;20<\/span>；<span class=\"katex-inline\">k=2<\/span>：<span class=\"katex-inline\">4^2=16&lt;20<\/span>；<span class=\"katex-inline\">k=3<\/span>：<span class=\"katex-inline\">4^3=64&gt;20<\/span>。三联体是满足下界的最小长度；若氨基酸种类增至 65 以上，三联体容量不足，需更长码或额外信号。<\/p>\n<h3>算例 2：余量分配<\/h3>\n<p>64 种三联体对应二十种氨基酸，余下组合作同义密码子与终止信号；同义密码子使部分碱基替换不改变氨基酸，提供容错缓冲。<\/p>\n<h3>算例 3：互补复制<\/h3>\n<p>双链 A 配 T、C 配 G；分开后每条链按互补规则合成新链。模板链序列决定新链序列，复制保真靠碱基配对规则。<\/p>\n<h3>算例 4：转录翻译路径<\/h3>\n<p>DNA 序列 → 转录为 RNA → 翻译为氨基酸链 → 折叠蛋白质。信息在各环节以分子形式转移；码本在翻译环节把碱基三联体换成氨基酸。<\/p>\n<h3>算例 5：序列规模<\/h3>\n<p>人类 DNA 核苷酸单位超过十亿（PDF 第 312 页）。一维长链存信息，表达产物是三维结构；折叠与调控不在碱基—氨基酸映射表内。<\/p>\n<h3>算例 6：方块码被否<\/h3>\n<p>伽莫夫方块码按组合论设计，被蛋白质序列实验数据否定（PDF 第 310 页）。说明组合约束只给可行范围，具体映射要实验数据裁决。<\/p>\n<h3>算例 7：符号规模对照<\/h3>\n<p>电报码端是 26 字母，遗传码端是四碱基；两端规模不同，码长与冗余安排随之不同。两者都是符号映射，载体分别是电路通断与碱基分子。<\/p>\n<h3>算例 8：单碱基替换效应<\/h3>\n<p>同义密码子内替换不改变氨基酸；非同义替换改变氨基酸。码本余量使部分替换容错，部分替换影响表达产物。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>遗传编码改用双碱基<\/strong>：<span class=\"katex-inline\">4^2=16<\/span> 种组合装不下二十种氨基酸，必须引入额外位置或信号；编码表更拥挤，容错空间更小。\n<\/li><li>\n<strong>性状直接混合传递<\/strong>：无法解释三比一分离比；因子被调和稀释，离散编码视角不成立。\n<\/li><li>\n<strong>组合论直接指定映射<\/strong>：哪三联体对应哪氨基酸无法由 <span class=\"katex-inline\">4^k\\ge20<\/span> 推出；跳过生化实验会把约束当答案。\n<\/li><li>\n<strong>DNA 序列包含全部发育信息<\/strong>：发育还受细胞环境、调控关系与外部条件影响；序列是信息载体之一，不是生物体全部信息。\n<\/ul>\n<h2>延伸层：遗传编码在信息观念中的位置<\/h2>\n<p>c01 符号映射落到分子水平；c08 熵可度量碱基序列不确定性。遗传编码是信息观念进入生命领域的落点：复制子概念随后在 c12 推广到模因；c14 信息依托物理载体在分子层面同样成立；c13 算法复杂度可比较 DNA 序列可压缩程度。生物体按码本表达序列，但折叠、调控、环境作用超出静态码表，编码视角解释存储与转移，不替代发育生物学全部内容。<\/p>\n<h2>补足推导：前提塌陷点、映射边界与信息化学区分<\/h2>\n<p>遗传编码成立依赖三条前提：碱基序列可复制；转录翻译机制可执行码本映射；环境提供材料与能量。去掉复制，序列无法传代；去掉翻译机制，碱基序列换不成蛋白质；去掉环境材料，表达无法进行。映射边界：组合数只给码长下界，不指定具体对应；发育调控不在映射表内。信息与化学物质区分：碱基是化学分子，承载的序列关系是信息；同一信息可由不同化学实现表达，编码结构优先于载体材料。不变量：复制按互补模板，表达按码本翻译；序列在代际间传递，产物在个体内表达。<\/p>\n<h2>补充算例与延伸辨析<\/h2>\n<h3>补充算例九：孟德尔三比一分离走查<\/h3>\n<p>设亲本杂合子基因型 Aa，自交组合按配子拆分：AA、Aa、Aa、aa，基因型比例 1:2:1；显性表型 AA 与 Aa 合计占三份，隐性 aa 占一份，表型比例 3:1（PDF 第 305 页）。这一比例说明遗传因子成份传递、不被父母性状调和稀释。若因子在后代中混合稀释，显性与隐性表型不会按固定比例分离；编码视角要求因子可整体重组与传递，三比一比例是这一前提的观测支撑。<\/p>\n<h3>补充算例十：同义密码子容错余量量化<\/h3>\n<p>64 种三联体对应二十种氨基酸，平均每种氨基酸分到 3.2 组三联体；余下组合另留终止信号。同一氨基酸对应多个三联体时，第三位碱基替换常不改变氨基酸，同义密码子提供容错缓冲。计算上，单碱基替换落在同义组内则产物不变，落到非同义组则氨基酸改变；容错比例由码本分配决定，不由组合数自动给出。若二十种氨基酸全占满 64 组且不留终止信号，编码表将没有缓冲空间，单点替换容错率下降。<\/p>\n<h3>边界失效推演：转录、模板与材料各环节断裂<\/h3>\n<p>复制环节断裂：双链没有互补模板，一条链序列无法决定另一条链序列，代际序列丢失。转录环节断裂：DNA 序列抄不到 RNA，碱基信息停留在核内分子上，翻译环节拿不到输入。翻译机制断裂：RNA 序列没有码本对应，换不成氨基酸链。环境材料断裂：缺少核苷酸、氨基酸与能量供应，表达各步无法执行。三条前提任一去掉，信息从序列到产物的转移链就在对应环节断开；编码表本身正确也无法补上断裂环节。<\/p>\n<h3>史料因果链：从因子术语到码本破解<\/h3>\n<p>约翰森造出基因术语，先给遗传因子一个可讨论的名称；孟德尔三比一比例提供因子离散传递的观测证据；薛定谔借摩尔斯电码类比，提出基因必采用某种编码；1953 年沃森与克里克发表双螺旋，给出碱基互补的载体结构；组合不等式推出三联体码长；具体映射由生化实验逐步破解，伽莫夫方块码被实验否定。链条方向：现象证据 → 术语与类比 → 载体结构 → 码长约束 → 实验定映射。跳过实验环节直接由组合论指定对应，结论站不住；跳过载体结构谈编码，符号无处存放。<\/p>\n<h3>延伸辨析：序列信息、化学物质与调控网络<\/h3>\n<p>碱基是化学分子，序列关系是信息：同一信息可由不同化学实现表达，编码结构优先于载体材料。折叠与调控不在碱基—氨基酸映射表内：一维链到三维结构还受细胞环境、调控关系与外部条件影响。把 DNA 序列当成生物体全部信息，会漏掉调控网络与环境作用；把化学分子本身当成信息，又混淆了载体与所指。遗传编码视角解释序列存储与转移，发育生物学的其余环节由其他理论覆盖。<\/p>\n<h2>再算一例与边界补推<\/h2>\n<h3>补充算例十一：终止信号与同义分配走查<\/h3>\n<p>64 组三联体中，部分组合作终止信号，不对应氨基酸；其余分组分配给二十种氨基酸。分配一旦确定，同义组内第三碱基替换不改变产物，非同义替换改变氨基酸。终止信号位置错误会使翻译链提前或延后结束，产物长度异常。码本余量的用途由翻译机制与实验数据确定，不由组合数自动指定。<\/p>\n<h3>边界补推：序列之外的发育信息<\/h3>\n<p>DNA 序列是信息载体之一；折叠方向、细胞环境、调控关系与外部条件不在碱基—氨基酸映射表内。把序列当成生物体全部信息，会漏掉调控网络与环境作用；反过来，把化学碱基分子本身当成信息，混淆了载体与所指。编码视角解释序列存储与转移，不替代发育生物学对调控与环境的解释。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n孟德尔三比一比例怎样支持因子离散传递？\n<\/li><li>\n四碱基与二十种氨基酸两端规模怎样决定码长？\n<\/li><li>\n组合约束与具体映射各由什么确定？\n<\/li><li>\n转录与翻译各完成哪一步信息转移？\n<\/li><li>\n64 对 20 的余量留作什么用途？\n<\/li><li>\nDNA 序列为什么不等于生物体全部信息？\n<\/ol>\n<h2>自检问题<\/h2>\n<ol><li>\n推一下：若氨基酸增至 30 种，三联体容量够不够？\n<\/li><li>\n互补链复制怎样保证序列传给下一代？\n<\/li><li>\n伽莫夫方块码为什么被实验否定？\n<\/li><li>\n遗传编码与电报码在映射结构上有何相同与不同？\n<\/li><li>\n折叠与调控为什么不在碱基—氨基酸映射表内？\n<\/ol><\/div><\/details>", "c12": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/信息/信息简史 (［美］詹姆斯•格雷克 (作者) 高博 (译者)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.329<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">遗传编码：DNA 作为四字母码本<\/a><\/span><\/div><h1>模因：文化领域的复制子<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 4 章（第 11 章 跃入模因池，PDF 第 329–340 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>思想、旋律、流行语、图像会在人群间扩散，有些传播力强，有些迅速湮灭。这类传播与基因繁衍有没有共同结构？道金斯之前，莫诺已提出「抽象王国」：思想像生物体一样维持结构、繁衍、融合重组，并在选择淘汰中进化（PDF 第 329 页）。要界定文化复制现象，必须回答：复制子需要哪些环节，什么算模因、什么只是模因的载具，文化传播与生物复制在保真度、变异速度上差别在哪。<\/p>\n<h2>定义<\/h2>\n<p><strong>复制子<\/strong>：可自我复制、在生存差别中接受自然选择的实体；道金斯指出主角是复制子，是否由核酸组成无关紧要，自然选择规律通过可自我复制实体的存活差别实现进化（PDF 第 329 页）。<\/p>\n<p><strong>模因（meme）<\/strong>：道金斯 1976 年在《自私的基因》结尾提出的文化复制子；通过广义的模仿在一个个大脑间跳转，在模因池中传播，相互争夺大脑运算时间、带宽与注意力（PDF 第 329–330 页）。<\/p>\n<p><strong>模因池<\/strong>：所有模因共存竞争的环境；模因在此复制、变异、被选择，传播力强的留存，弱的湮灭。<\/p>\n<p><strong>载具<\/strong>：承载模因的物质或行为对象。呼拉圈是模因的实物化身，构成它的塑料不是比特；热衷呼拉圈与晃动摇摆旋转的技能才是模因，呼拉圈与玩它的人都是载具（PDF 第 331 页）。<\/p>\n<p>正例：信仰上帝、日心地动说属思想模因；贝多芬第五交响曲「命运」主题与流行一时的旋律属旋律模因；「read my lips」一类说法属流行语模因；《蒙娜丽莎》《呐喊》复制品属图像模因（PDF 第 330–331 页）。反例：数字三、蓝色不是模因，任何简单想法都不是；单个核苷酸不是基因，模因是复杂、易记、有持久力的单元（PDF 第 331 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>先推复制子三环节。文化复制要经过：复制——从一个大脑跳到另一个大脑；变异——复制品在传播中改动、产生新变体；选择——争夺有限注意力，传播力强的留存。三环节缺一，文化演化失去材料或筛选机制。<\/p>\n<p>再推传播资源约束。大脑运算时间、带宽、注意是有限资源；模因相互竞争，能借文字、音乐、艺术多通道复制的思想更易存活。符合真理只是帮助模因生存的属性之一，不是唯一标准（PDF 第 330 页）。<\/p>\n<p>接着推单元规模界定。模因不是基本粒子而是生物体：简单想法不成模因，复杂单元才具备持久力；物件本身不是模因，模因在纸张、胶卷、硅片及信息可及处建立滩头堡（PDF 第 331 页）。流行语在传播中产生突变变体，如「适者生存」衍生出「胖者生存」「病者生存」等说法（PDF 第 330 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：存在可模仿的传播渠道；复制有一定保真度但允许变异；注意力资源有限形成选择压力。\n<\/li><li>\n边界一：模因类比是分析框架，不是基因理论的照搬。文化复制靠模仿，保真度、变异速度、选择标准与核酸复制不同；不能把模因竞争简化为基因决定论。\n<\/li><li>\n边界二：符合真理有助于模因留存，但传播力强不等于内容正确；错误流行语与图像也可广泛复制。\n<\/li><li>\n失败案例：把实物当模因。呼拉圈、肖像画是载具；把载具材料误当复制子，会混淆信息与载体（PDF 第 331 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>基因 vs 模因<\/strong>：基因由核酸复制，模因靠模仿跨大脑跳转；两者都经复制、变异、选择，物质载体与保真机制不同。\n<\/li><li>\n<strong>模因 vs 载具<\/strong>：模因是复制的信息单元，载具是承载它的物件、身体或媒介；同一模因可换载具传播。\n<\/li><li>\n<strong>思想 vs 模因<\/strong>：单个简单思想不成模因；能在大脑间复制竞争、具备持久结构的复杂思想单元才进入模因池。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c11 基因作为生物复制子；c01 符号映射，模因以符号与行为为载体传播。后继：c15 信息过载时代注意力竞争是模因选择压力的社会背景；c13 算法复杂度可比较模因序列的可压缩性。模因概念把信息复制从工程与生命推广到文化领域。<\/p>\n<p>补充对照：莫诺把可复制的抽象实体归入抽象王国，斯佩里区分脑内信息处理；道金斯 1976 年《自私的基因》提出 meme，指通过模仿在大脑之间跳转的文化复制子。模因竞争对象是大脑时间、带宽与注意力；呼拉圈是模因的载具而非复制子本身，丹尼特用四轮马车类比说明复制子与外部材料的关系。「适者生存」这类说法在传播中产生突变变体，变体又参与新一轮选择；传播力强只代表在竞争中留存下来，不代表内容本身为真或为善。<\/p>\n<p>边界补充：界定模因单元要区分复制子与载具。单个核苷酸不是基因，单个音符或一句口号也不自动是模因；只有在复制、变异、选择三环节中作为稳定跳转单位传播的信息单元，才按模因处理。载具（呼拉圈、书籍、屏幕）是材料与渠道，复制子是其中跳转的信息模式；把载具规模当成模因复杂度，会误判选择对象。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（模因：文化领域的复制子）<\/summary><div class=\"depth-body\"><h1>c12 深度推导：复制子三环节、模因单元规模与载具区分<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把模因讲成文化复制子而非比喻罗列，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先确认生物复制子结构<\/strong>：复制、变异、选择三环节在基因进化上成立；先看清这一结构，再搬向文化领域。\n<\/li><li>\n<strong>确认思想有传播力<\/strong>：莫诺指出思想像生物体一样维持结构、繁衍、融合重组并经历选择淘汰；传播力强弱有差别。\n<\/li><li>\n<strong>确认文化复制靠模仿<\/strong>：模因在大脑间跳转依赖广义模仿渠道；无模仿通道，复制子无法跨个体传播。\n<\/li><li>\n<strong>区分复制单元与载具<\/strong>：模因是信息单元，实物与身体是承载它的载具；混同两者会把材料当复制子。\n<\/ol>\n<p>依赖链方向：生物复制子 → 思想传播力观察 → 模仿渠道 → 模因三环节 → 单元规模界定 → 载具区分。任何一层缺失：复制结构不清则模因沦为比喻；无传播渠道则跳转不成立；单元与载具混同则分析对象错位。<\/p>\n<h2>正向推导：从基因复制子推到模因<\/h2>\n<h3>第一步：推生物复制子结构<\/h3>\n<p>道金斯指出主角是复制子，是否由核酸组成无关紧要；自然选择规律是所有生命通过可自我复制实体的生存差别实现进化（PDF 第 329 页）。复制子先复制自身，在变异中产生差别，再由选择留存淘汰；三环节缺一则进化无材料或无筛选。<\/p>\n<h3>第二步：推思想的生物体属性<\/h3>\n<p>莫诺提出「抽象王国」：正如无生命世界之上有生物圈，生物圈之上有思想王国。思想保留生物体某些属性：倾向维持结构、繁衍生息，可融合、重组、分离内容，并在进化中接受选择淘汰；思想有传播力，强弱不同（PDF 第 329 页）。斯佩里更早提出思想与其安身的神经元「一样真实」且拥有力量（PDF 第 329 页）。<\/p>\n<h3>第三步：推模因定义与竞争资源<\/h3>\n<p>道金斯 1976 年在《自私的基因》结尾提出模因：通过广义模仿在一个个大脑间跳转，在模因池中传播；各模因相互竞争有限资源，如大脑运算时间、带宽或注意（PDF 第 329–330 页）。资源有限是选择压力来源：传播力强的模因占住更多注意力，弱的湮灭。<\/p>\n<h3>第四步：推模因实例类别<\/h3>\n<p>思想：信仰上帝、日心地动说，不仅通过文字也通过音乐艺术自我复制；旋律：流传数个世纪的主题与短期快传的流行旋律；流行语：取自《圣经》的说法与「read my lips」一类说法；图像：《蒙娜丽莎》《呐喊》及虚构外星人样貌复制品（PDF 第 330–331 页）。类别覆盖可在大脑间复制的各类文化单元。<\/p>\n<h3>第五步：推单元规模界定<\/h3>\n<p>模因不应被视为基本粒子，而应视为生物体；数字三、蓝色不是模因，任何简单想法都不是，就像单个核苷酸不是基因一样（PDF 第 331 页）。模因是复杂、与众不同又易于记忆、具有持久力的单元。流行语在传播中产生突变变体，如「适者生存」衍生「胖者生存」「病者生存」等（PDF 第 330 页）。<\/p>\n<h3>第六步：推载具区分<\/h3>\n<p>物件本身不是模因。呼拉圈 1958 年发明后风靡全球，但构成它的是塑料不是比特；它是一个或数个模因的产物与实物化身，模因包括对呼拉圈的热衷与玩呼拉圈的技能（晃动、摇摆、旋转）；呼拉圈与玩它的人都是载具（PDF 第 331 页）。丹尼特类比：四轮马车既运谷物货物，也在各个心智之间运送想法。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：三环节对照<\/h3>\n<p>基因：核酸复制 → 突变重组 → 自然选择；模因：模仿跳转 → 传播中改动 → 注意力选择。环节对应，物质载体与保真机制不同。<\/p>\n<h3>算例 2：资源竞争<\/h3>\n<p>大脑运算时间、带宽、注意有限；多个模因争夺同一时段。符合真理只是帮助留存的属性之一，不是唯一标准；错误流行语也可广泛复制（PDF 第 330 页）。<\/p>\n<h3>算例 3：单元规模对照<\/h3>\n<p>单个核苷酸不是基因；单个简单想法不是模因。基因是 DNA 上一段功能单元，模因是可复制的复杂文化单元；规模过小不构成复制子。<\/p>\n<h3>算例 4：载具换算<\/h3>\n<p>呼拉圈是载具，热衷与技能是模因；肖像画是载具，图像复制品传播的样貌观念是模因。同一模因可换载具：纸张、胶卷、硅片都可承载图像模因。<\/p>\n<h3>算例 5：突变变体<\/h3>\n<p>「适者生存」衍生「胖者生存」「病者生存」「做假者生存」「发推特者生存」（PDF 第 330 页）。变体在传播中产生，接受选择；保留传播力的变体留存。<\/p>\n<h3>算例 6：跨通道复制<\/h3>\n<p>信仰上帝通过文字、音乐、艺术自我复制；模因不只走单一渠道，多通道复制增强传播力。通道越多，可接触大脑越多。<\/p>\n<h3>算例 7：模因池生死<\/h3>\n<p>一个思想只出现一次，可能在模因池昌盛，也可能湮灭（PDF 第 330 页）。留存取决于复制频率、变异适应性与注意力竞争结果，不取决于出现次数本身。<\/p>\n<h3>算例 8：真理与传播力<\/h3>\n<p>日心地动说在竞争中存活，部分符合真理；但真理只是成功属性之一。传播力强不等于内容正确，评估模因留存不能反推其真假。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>模因传播不经过变异<\/strong>：每个大脑复制出完全相同副本，模因池无新变体可供选择，文化演化失去材料，选择环节空转。\n<\/li><li>\n<strong>复制不争夺有限资源<\/strong>：注意力无约束，传播力差别不形成选择压力，模因留存淘汰机制不成立。\n<\/li><li>\n<strong>把实物当模因<\/strong>：呼拉圈塑料被当成复制子，混淆信息与载体；载具材料更换不影响模因存续。\n<\/li><li>\n<strong>模因竞争等同于基因决定<\/strong>：文化复制靠模仿，保真度、变异速度、选择标准与核酸复制不同；照搬基因理论会过度简化。\n<\/ul>\n<h2>延伸层：模因与信息过载<\/h2>\n<p>模因争夺注意力正是 c15 信息过载时代的选择压力背景：讯息洪流中，传播力强的模因占住带宽，筛选与索引成为组织补偿。c11 基因是生物复制子，模因把复制子概念推广到文化；c13 算法复杂度可比较模因序列可压缩性。模因类比是分析框架，不主张文化现象全部还原为复制竞争；情感、制度、物质条件在文化形成中另有作用。<\/p>\n<h2>补足推导：前提塌陷点、类比边界与保真度<\/h2>\n<p>模因成立依赖三条前提：存在可模仿传播渠道；复制有一定保真度但允许变异；注意力资源有限形成选择压力。去掉渠道，模因无法跨大脑跳转；去掉变异，选择无材料；去掉资源约束，竞争压力消失。类比边界：模因保真度低于基因复制，变异更频繁，选择标准含文化价值与情境；不能把模因竞争简化为基因决定论。单元不变量：模因作为复杂可记忆单元，载具可更换；简单想法与实物材料不构成复制子。传播力与正确性分离：留存只说明在竞争中胜出，不证明内容为真。<\/p>\n<h2>补充算例与延伸辨析<\/h2>\n<h3>补充算例六：三环节走查一个模因<\/h3>\n<p>以一支流行旋律为例：复制环节，听者听到旋律后凭记忆哼唱、转录或录制，旋律模式从一个大脑跳到另一个大脑；变异环节，转唱时某句音高或节奏改动，形成变体；选择环节，变体在有限注意力下留存或淘汰，传播力强的版本被反复传唱。呼拉圈作为载具，承载的行为模式（玩呼拉圈这一做法）才是跳转的复制子；书籍、屏幕、实物材料也是如此，是载具不是复制子本身。三环节缺一：无复制则模式只存于一人脑中；无变异则群体内无新变体可选；无选择则留存与淘汰没有压力。<\/p>\n<h3>补充算例七：竞争资源的分配对照<\/h3>\n<p>模因争夺的资源是大脑时间、带宽与注意力。单位时间内一个大脑能容纳的模式数量有限，传播力强的条目占住注意力，其余条目被挤出。竞争结果只说明该模式在这轮选择中留存下来，不证明内容为真、为善或长期适用。「适者生存」这一说法自身在传播中也产生突变变体，变体又参与新一轮选择；变体流传广，是选择环节的结果，不是变体正确的证据。<\/p>\n<h3>边界失效推演：三环节各断一环会怎样<\/h3>\n<p>去掉复制：模式无法跨个体跳转，只停留在最初主体，谈不上群体传播，模因视角退化为个人习惯。去掉变异：复制品全部相同，选择没有变体可比较，留存差异只能来自外部偶然，演化方向收窄。去掉选择：所有变体平等留存，资源竞争不发生，传播力强弱无从显现。界定单元时再断一层：把载具规模当成复制子规模，单个核苷酸不是基因，单个音符也不自动是模因；只有在三环节中作为稳定跳转单位传播的信息模式，才按模因处理。<\/p>\n<h3>史料因果链：从基因复制子到文化复制子<\/h3>\n<p>道金斯 1976 年《自私的基因》先把基因界定为生物领域复制子：复制、变异、选择三环节在核酸材料上运行。书末把复制子概念外推到文化，提出 meme，指通过模仿在大脑之间跳转的文化复制子。莫诺把可复制的抽象实体归入抽象王国，斯佩里讨论脑内信息处理，为文化信息单元提供跨学科背景；丹尼特用四轮马车类比说明复制子与外部材料的关系。链条方向：生物复制子结构成立 → 抽象实体可复制 → 模仿作为文化复制路径 → 注意力与带宽成为选择资源。外推时保留三环节结构，更换的是载体材料与复制方式。<\/p>\n<h3>延伸辨析：模因与基因、传播力与正确性<\/h3>\n<p>基因靠核酸复制传递，模因靠模仿跳转传播；物质载体不同，三环节结构相同。基因映射到分子表型，模因映射到行为、旋律、口号、图像等文化模式。传播力强只代表在竞争中占住注意力，不附带价值判断：一个错误或有害的说法也可广泛流传。评估模因要分两层：先看它是否完成复制跳转，再单独判断内容对错；把流传广当成正确，是选择结果与价值判断的混同。<\/p>\n<h2>再算一例与边界补推<\/h2>\n<h3>补充算例八：注意力带宽分配对照<\/h3>\n<p>单位大脑时间内能留存的模式数量有限，多个模因竞争同一注意力窗口。传播路径多、转写成本低的模式占住窗口；转写复杂、需要额外解释的模式被挤出。竞争结果是留存差异，不是价值排序。旋律、口号、图像转写成本低，易在群体内跳转；长论证转写成本高，传播速度受材料与渠道约束。<\/p>\n<h3>边界补推：载具与复制子再区分<\/h3>\n<p>呼拉圈、书籍、屏幕是载具；玩呼拉圈的做法、书中论点、屏幕上的图像模式才是复制子候选。把载具大小、材料价值当成模因复杂度，会误判选择对象。模因跳转通过模仿完成，模仿可能改动原模式；改动产生变体，变体再参与选择。三环节中任何一环只在群体传播层面成立，个人脑中未传出的想法不构成模因。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n复制子三环节是哪三个？\n<\/li><li>\n莫诺「抽象王国」指什么？\n<\/li><li>\n模因争夺哪些有限资源？\n<\/li><li>\n为什么单个简单想法不算模因？\n<\/li><li>\n呼拉圈本身为什么不是模因？\n<\/li><li>\n传播力强是否等于内容正确？\n<\/ol>\n<h2>自检问题<\/h2>\n<ol><li>\n基因与模因在三环节上如何对应？载体差别在哪？\n<\/li><li>\n推一下：无变异时文化选择为什么空转？\n<\/li><li>\n模因与载具怎样区分？各举一例。\n<\/li><li>\n多通道复制为什么增强传播力？\n<\/li><li>\n模因类比的边界在哪里？哪些文化现象不能还原为复制竞争？\n<\/ol><\/div><\/details>", "c13": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/信息/信息简史 (［美］詹姆斯•格雷克 (作者) 高博 (译者)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.348<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">比特与香农熵：不确定性的对数度量<\/a><\/span><\/div><h1>算法随机性：最短程序长度定义的不可压缩性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（第 12 章 认识随机性，PDF 第 343–368 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>日常把随机理解为无规律、不可预测，但掷硬币轨迹可由牛顿定律计算，法国人口数的奇偶性本身并非随机；统计上每个数字出现概率均匀，也不能断定序列随机。香农用概率分布定义熵，只看频率；还有一类问题：一个序列能不能被短程序生成？蔡廷、柯尔莫哥洛夫各自从图灵机出发，把随机性改写成算法问题——什么样的 0/1 串没有更短的生成方式，必须照抄原始表格。<\/p>\n<h2>定义<\/h2>\n<p><strong>算法复杂度（最短程序长度，<span class=\"katex-inline\">K(x)<\/span>）<\/strong>：在通用图灵机上，能打印出字符串 <span class=\"katex-inline\">x<\/span> 并停机的最短程序长度（比特）。可被短程序生成的序列有模式，不可压缩的才接近随机（PDF 第 348–349 页）。<\/p>\n<p><strong>可计算性<\/strong>：一个数或序列能被一个可定义的计算机程序生成，即称可计算；蔡廷指出，只要可计算就不是随机数，可计算性是随机性的一种量度（PDF 第 349 页）。<\/p>\n<p><strong>伪随机数<\/strong>：由决定论算法加有限存储生成的数字序列；统计上像随机，但生成方式可复现，冯·诺伊曼承认算术方法造不出真正随机数（PDF 第 345 页）。<\/p>\n<p><strong>蒙特卡洛模拟<\/strong>：冯·诺伊曼在原子弹项目中领导小组发明并命名的方法，用随机采样建模无法解析求解的现象；采样序列的随机性直接影响模拟可信度（PDF 第 345 页）。<\/p>\n<p>正例：程序写「重复 01 一百万次」即可生成「010101…」一百万次，程序很短；一百万个无模式随机数字没有捷径，必须全部录入卡片（PDF 第 348 页）。反例：π 的小数位在统计上像正规数，每位、双位、三位组合接近期望，下一位总出人意料；但 π 可由短算法生成，不是随机数（PDF 第 348–349 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>先推压缩与模式的关系。给定长度 <span class=\"katex-inline\">n<\/span> 的 0/1 串 <span class=\"katex-inline\">x<\/span>，定义 <span class=\"katex-inline\">K(x)<\/span> 为最短生成程序长度。有规律的串：重复、周期、公式可生成，程序只需描述规则，<span class=\"katex-inline\">K(x)\\ll n<\/span>；无规律串：没有规律可抄，程序必须照录全部数字，<span class=\"katex-inline\">K(x)\\approx n<\/span>。<\/p>\n<p>再推随机性的两层判据。第一层统计判据：频率均匀、组合分布符合期望；第二层算法判据：不可压缩。π 过第一层，不过第二层；统计均匀不等于算法随机。两层都看，才接近蔡廷定义的随机序列。<\/p>\n<p>接着推科学归纳的对应。科学家观察封闭系统每秒发光或不发光，整理成 0/1 序列；若找不到更短算法，只能照抄表格，序列很可能没有模式；若发现短算法生成同一序列，则确认存在规律，这就是一种理论（PDF 第 349 页）。算法复杂度把奥卡姆剃刀写成程序长度比较：更短的理论解释更多现象。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：序列可编码为 0/1 串；通用图灵机可作为基准机器；程序长度可比特度量。\n<\/li><li>\n边界一：<span class=\"katex-inline\">K(x)<\/span> 一般不可由程序自动求出——停机问题限制了最短程序判定；定义可用，计算上通常只能给上界。\n<\/li><li>\n边界二：算法随机性不替代统计随机性。工程采样、密码学场景还要同时看统计分布与伪随机周期。\n<\/li><li>\n失败案例：把统计均匀当随机。π 各数字频率接近期望，仍可计算；反之伪随机序列统计表现良好，生成算法确定，也不是真随机。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>香农熵 vs 算法复杂度<\/strong>：熵按概率分布度量平均不确定性；算法复杂度按最短程序长度度量单个串的可压缩性。前者是集合层面统计量，后者是个体串描述长度。\n<\/li><li>\n<strong>真随机 vs 伪随机<\/strong>：真随机不可由短算法生成；伪随机由确定算法产出，可复现，周期有限。\n<\/li><li>\n<strong>模式 vs 秩序<\/strong>：模式与秩序表达可计算性，算法生成模式；越缺乏模式的串，最短程序越长，越接近随机（PDF 第 349 页）。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c08 香农熵，c05 图灵机模型。后继：c14 信息物理约束程序与存储的能耗；c11 DNA 序列可按可压缩程度比较其模式密度；c15 信息过载中短算法（理论、索引、分类）是压缩海量序列的手段。算法信息论把信息度量从概率分布推进到单个字符串。<\/p>\n<p>补充对照：蔡廷 1965 年前后给出算法随机性表述，定义字符串信息量为能生成它并停机的最短程序长度 <span class=\"katex-inline\">K(x)<\/span>；柯尔莫哥洛夫与所罗门诺夫分别沿相近思路独立工作。π 的数字分布统计上正规，但可由短算法生成，按算法判据不是随机序列；冯·诺伊曼用蒙特卡洛方法产出的随机数依赖确定算法，属伪随机，可复现（PDF 第 348–350、354 页）。兰德 1955 年出版《一百万个随机数字》作为随机数资料；奥卡姆剃刀对应短程序假设。最短程序长度一般受停机问题限制，无法对任意字符串自动求出精确值。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（算法随机性：最短程序长度定义的不可压缩性）<\/summary><div class=\"depth-body\"><h1>c13 深度推导：最短程序长度、可压缩性与随机性两层判据<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把算法随机性讲成可判定的程序长度问题，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先有通用计算模型<\/strong>。图灵机作为通用计算机，程序可打印任意 0/1 串并停机；没有通用机器，程序长度无从度量。\n<\/li><li>\n<strong>区分统计随机与算法随机<\/strong>：频率均匀是统计判据，可压缩性是算法判据；两层不能互相替代。\n<\/li><li>\n<strong>确认模式对应可计算性<\/strong>：有规律的串可由短算法生成，无规律的串只能照录；模式与秩序表达可计算性。\n<\/li><li>\n<strong>承认最短程序通常不可自动求出<\/strong>：停机问题限制判定；定义可用，计算上一般只能给上界。\n<\/ol>\n<p>依赖链方向：通用图灵机 → 模式可短程序生成 → 最短程序长度定义 → 可压缩性判随机 → 科学归纳对应短理论。任何一层缺失：无通用机器则长度不可比；只看统计分布会把 π 误判随机；不承认停机限制则高估可判定性。<\/p>\n<h2>正向推导：从可计算性推到最短程序长度<\/h2>\n<h3>第一步：推日常随机概念的不足<\/h3>\n<p>掷硬币轨迹可由牛顿定律计算，法国人口数奇偶性本身并非随机；知识、因果、设计被当作随机对立面（PDF 第 343–344 页）。冯·诺伊曼在原子弹项目领导小组发明命名蒙特卡洛模拟，用随机采样建模无法解析求解的现象；他同时承认决定论算法加有限存储生成的是伪随机数，算术方法造不出真正随机数（PDF 第 345 页）。<\/p>\n<h3>第二步：推蔡廷的算法定义<\/h3>\n<p>1965 年，本科生蔡廷把图灵机视为通用计算机，提出与编程相关的问题：撰写程序让图灵机打印「010101…」一百万次，程序可以非常短；给定一百万个无模式随机数字，没有捷径可抄，程序必须包含全部数字（PDF 第 348 页）。最短程序长度成为串所含信息量的算法度量。<\/p>\n<h3>第三步：推可计算性判随机<\/h3>\n<p>π 的小数位统计上像正规数：每位数字概率接近期望十分之一，双位、三位组合亦然，下一位总出人意料；但 π 可由短算法生成，不是随机数（PDF 第 348–349 页）。蔡廷明确回答：一个数只要可被可定义计算机程序生成，就不是随机数；可计算性是随机性的一种量度。<\/p>\n<h3>第四步：推复杂度定义<\/h3>\n<p>给定长度 <span class=\"katex-inline\">n<\/span> 的 0/1 串 <span class=\"katex-inline\">x<\/span>，定义 <span class=\"katex-inline\">K(x)<\/span> 为通用图灵机上打印 <span class=\"katex-inline\">x<\/span> 并停机的最短程序长度（比特）。有规律的串：重复、周期、公式可生成，<span class=\"katex-inline\">K(x)\\ll n<\/span>；无规律串：无规律可抄，程序照录全部数字，<span class=\"katex-inline\">K(x)\\approx n<\/span>。算法长短度量可计算性，也度量字符串含多少信息（PDF 第 349 页）。<\/p>\n<h3>第五步：推科学过程对应<\/h3>\n<p>科学家观察封闭系统每秒发光或不发光，整理成 0/1 序列；若找不到更短算法，只能照抄原始表格，序列很可能没有模式；若发现短算法生成同一序列，则确认存在规律，这就是一种理论（PDF 第 349 页）。算法复杂度把奥卡姆剃刀写成程序长度比较：更短理论解释更多现象。<\/p>\n<h3>第六步：推并行发展与局限<\/h3>\n<p>柯尔莫哥洛夫在苏联独立发展同一方向的度量；所罗门诺夫从归纳推断角度接近同一问题。算法复杂度与香农熵分工：熵按概率分布度量集合平均不确定性，复杂度按最短程序长度度量个体串描述长度（PDF 第 350、354 页）。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：重复串压缩<\/h3>\n<p>「01」重复五十遍，程序写「重复 01 五十遍」，长度远小于 <span class=\"katex-inline\">n<\/span>；<span class=\"katex-inline\">K(x)\\ll n<\/span>。串有周期模式，短程序即可生成。<\/p>\n<h3>算例 2：随机串照录<\/h3>\n<p>一百万个无模式随机数字，程序必须把百万数字一一录入打孔卡片；<span class=\"katex-inline\">K(x)\\approx n<\/span>，无可压缩余量。<\/p>\n<h3>算例 3：π 前缀<\/h3>\n<p>π 前 <span class=\"katex-inline\">n<\/span> 位统计均匀，各数字接近期望频率；但生成 π 的算法很短，<span class=\"katex-inline\">K(\\text{π 前缀})\\ll n<\/span>。统计正规不推出算法随机。<\/p>\n<h3>算例 4：伪随机序列<\/h3>\n<p>确定算法加有限存储产出伪随机数，统计像随机但可复现；生成算法是短程序，<span class=\"katex-inline\">K(x)<\/span> 受算法长度限制，不是真随机。<\/p>\n<h3>算例 5：熵与复杂度对照<\/h3>\n<p>香农熵看集合概率分布平均；<span class=\"katex-inline\">K(x)<\/span> 看单个串最短描述。同一分布下不同个体串复杂度可有差别，平均后与熵相关但不等同。<\/p>\n<h3>算例 6：观测序列建模<\/h3>\n<p>科学家记录 0/1 光束序列数千比特；找到短算法生成序列，即发现理论；只能照抄表格，则很可能无模式（PDF 第 349 页）。理论长度对应程序长度。<\/p>\n<h3>算例 7：停机问题限制<\/h3>\n<p>最短程序是否存在、长度多少，一般不可由程序自动判定；<span class=\"katex-inline\">K(x)<\/span> 通常只能给上界。定义清晰，判定不可行是另一回事。<\/p>\n<h3>算例 8：随机数表<\/h3>\n<p>兰德公司 1955 年出版《一百万个随机数字》，供采样与模拟使用（PDF 第 344 页）。表中数字统计随机，但印制成册后可被照抄复制；其随机性来自生成来源，不来自记录形式。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>只按统计均匀判随机<\/strong>：π 各数字频率接近期望，会被误判随机；算法判据缺失，可计算序列混进随机类。\n<\/li><li>\n<strong>所有串都照原始表格存储<\/strong>：有规律串无法用短程序压缩，存储传输成本按原始长度计算；冗余结构不产生节省。\n<\/li><li>\n<strong>最短程序可自动求出<\/strong>：停机问题限制下这一判定不可行；认为能自动列出所有串的复杂度，会撞上不可计算边界。\n<\/li><li>\n<strong>伪随机当真随机<\/strong>：生成算法确定、周期有限，采样模拟中周期性会显现；工程场景需区分两类随机性。\n<\/ul>\n<h2>延伸层：算法信息论在本书中的位置<\/h2>\n<p>c08 香农熵度量概率分布，c13 把信息度量推进到单个字符串；c05 图灵机模型是复杂度定义的计算基准。c11 DNA 序列可按可压缩程度比较模式密度；c15 过载时代短算法（理论、索引、分类）是压缩海量序列的手段。科学归纳在蔡廷框架里变成程序长度比较：短理论对应短程序，解释大量现象对应输出长序列。这一视角把数学、科学方法与信息度量连到一起。<\/p>\n<h2>补足推导：前提塌陷点、不可判定性与两层随机<\/h2>\n<p>算法复杂度成立依赖三条前提：串可编码为 0/1；通用图灵机作基准；程序长度可比特度量。去掉通用基准，长度比较无共同机器；串不可编码则无法定义。不可判定性：停机问题使最短程序一般不可自动求出，实务给上界。两层随机：统计层看频率与组合分布，算法层看可压缩性；两层都通过才接近随机。伪随机统计表现良好但生成确定，不属算法随机。不变量：短程序生成的串有模式，长度接近原始串的串接近不可压缩；复杂度越高，可预测余地越小。<\/p>\n<h2>补充算例与延伸辨析<\/h2>\n<h3>补充算例六：最短程序长度对照<\/h3>\n<p>字符串 <span class=\"katex-inline\">x<\/span> 的算法复杂度 <span class=\"katex-inline\">K(x)<\/span> 等于能生成 <span class=\"katex-inline\">x<\/span> 并停机的最短程序长度。周期序列 010101… 可由短程序「重复 01 到长度 <span class=\"katex-inline\">n<\/span>」生成，<span class=\"katex-inline\">K(x)<\/span> 远小于 <span class=\"katex-inline\">n<\/span>；随机外观的序列若无规律可压缩，最短程序长度接近 <span class=\"katex-inline\">n<\/span>，<span class=\"katex-inline\">K(x)\\approx n<\/span>。<span class=\"katex-inline\">K(x)<\/span> 越接近串长，序列越不可压缩，越接近算法随机。可压缩不等于统计上不随机，可压缩也不等于错误；判断随机性要在算法层另算最短程序，不能只看频率分布。<\/p>\n<h3>补充算例七：π、伪随机与随机数表对照<\/h3>\n<p>π 的数字分布统计上正规：各位频率与组合分布均匀，符合统计随机外观；但 π 可由短算法生成，<span class=\"katex-inline\">K(x)<\/span> 很小，按算法判据不是随机数（PDF 第 348–350 页）。冯·诺伊曼蒙特卡洛方法产出的随机数依赖确定算法，属伪随机：给定种子可复现同一序列，不能当真随机用。兰德 1955 年出版《一百万个随机数字》，作为可查阅的随机数资料；表中数字脱离生成算法使用，但序列本身仍是被记录的确定数据。三条路径分别说明：统计均匀、可由短程序生成、由确定算法复现，是三种不同判断。<\/p>\n<h3>边界失效推演：停机问题对最短程序求解的限制<\/h3>\n<p>求 <span class=\"katex-inline\">K(x)<\/span> 要比较所有能生成 <span class=\"katex-inline\">x<\/span> 的程序长度；程序是否停机本身受停机问题限制，不存在一台机器能对任意程序判定它是否停机。因此最短程序长度一般无法对任意字符串自动求出精确值，只能上界估计或近似比较。去掉这一限制假设，<span class=\"katex-inline\">K(x)<\/span> 才可逐串精确计算；现实算法随机性判据以不可压缩性为方向，实际操作受可计算性约束。奥卡姆剃刀对应短程序假设：同样能解释数据，选更短的假设，短假设在复杂度上占优。<\/p>\n<h3>史料因果链：两条算法随机性进路<\/h3>\n<p>蔡廷 1965 年前后给出算法随机性表述，定义字符串信息量为最短停机程序长度；柯尔莫哥洛夫与所罗门诺夫分别沿相近思路独立工作（PDF 第 348–349 页）。此前统计层随机性只看频率分布均匀；算法层把不可压缩性纳入定义。冯·诺伊曼用蒙特卡洛处理数值模拟，伪随机复现问题随之出现；兰德随机数表为模拟提供现成资料。链条方向：统计判据不足 → 引入程序长度度量 → 可压缩性区分模式与随机 → 可计算性限制落到最短程序求解。三条进路独立汇合在最短程序长度这一定义上。<\/p>\n<h3>延伸辨析：统计随机、算法随机与伪随机<\/h3>\n<p>统计随机看频率与组合分布是否均匀；算法随机看最短程序是否接近串长；伪随机由确定算法产出、可复现。三者交叉：π 统计正规但算法上可压缩；伪随机序列统计外观可能均匀但生成确定。真随机来源涉及物理过程与测量规则，不在字符串复杂度定义内。把统计均匀当成算法随机，会误判 π 一类可计算序列；把伪随机当成真随机，模拟结果可被种子复现。<\/p>\n<h2>再算一例与边界补推<\/h2>\n<h3>补充算例八：串长与最短程序对照<\/h3>\n<p>长度 <span class=\"katex-inline\">n<\/span> 的串，若全部规律都写进程序，程序长度加上串长才够生成；可压缩部分由短算法替代。周期串短程序加长度参数即可，<span class=\"katex-inline\">K(x)<\/span> 显著小于 <span class=\"katex-inline\">n<\/span>；无规律串最短程序接近直接输出串本身，<span class=\"katex-inline\">K(x)\\approx n<\/span>。<span class=\"katex-inline\">K(x)/n<\/span> 越接近 1，不可压缩程度越高。<\/p>\n<h3>边界补推：可计算性约束<\/h3>\n<p>最短程序长度受停机问题限制，无法对任意字符串自动求出精确值；实际只能上界估计或两串比较。奥卡姆剃刀在这一框架下对应短程序假设：同效解释选更短者。可压缩性判据给出方向，精确计算受可计算性限制，两条边界要分开陈述。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n算法复杂度 <span class=\"katex-inline\">K(x)<\/span> 怎样定义？\n<\/li><li>\n为什么 π 统计正规却不是随机数？\n<\/li><li>\n可计算性与随机性是什么关系？\n<\/li><li>\n香农熵与算法复杂度各度量什么对象？\n<\/li><li>\n最短程序为什么一般不可自动求出？\n<\/li><li>\n伪随机与真随机差别在哪？\n<\/ol>\n<h2>自检问题<\/h2>\n<ol><li>\n推一下：重复串与随机串的 <span class=\"katex-inline\">K(x)<\/span> 各接近什么值？\n<\/li><li>\n统计均匀为什么不足以判定随机？\n<\/li><li>\n奥卡姆剃刀怎样写成程序长度比较？\n<\/li><li>\n伪随机序列在什么情况下会暴露周期性？\n<\/li><li>\n算法复杂度为什么不能替代统计随机性度量？\n<\/ol><\/div><\/details>", "c14": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/信息/信息简史 (［美］詹姆斯•格雷克 (作者) 高博 (译者)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.375<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c10\">热力学熵、麦克斯韦妖与信息转向<\/a><\/span><\/div><h1>信息是物理的：兰道尔原理与量子信息<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（第 13 章 信息是物理的，PDF 第 371–386 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>信息论把讯息抽象成符号序列，似乎可以脱离物质讨论。但信息总要写在石板刻记、卡片孔洞、粒子自旋上；计算机能耗不断下降时，能耗有没有理论最小值？麦克斯韦妖的记忆擦除环节，熵增加发生在哪一步？兰道尔与本内特要回答：哪些逻辑操作不付热熵代价，哪些不可逆操作必须耗散热；量子效应又怎样改变信息存储与传输。<\/p>\n<h2>定义<\/h2>\n<p><strong>万物源自比特<\/strong>：惠勒 1989 年提出的观点：任何粒子、力场乃至时空连续统，其功能、意义与存在本身都源自信息；信息第一性，物质第二性（PDF 第 371 页）。<\/p>\n<p><strong>兰道尔原理<\/strong>：兰道尔 1961 年论证信息处理必须依托物理载体并遵循物理定律；大多数逻辑操作可逆，一比特从零翻到一或反向时信息守恒、熵不增；只有擦除信息这类不可逆操作导致熵增加，代价 <span class=\"katex-inline\">kT\\ln 2<\/span> 量级每比特（PDF 第 375–376 页）。<\/p>\n<p><strong>可逆计算<\/strong>：逻辑操作可反推输入、信息守恒的计算过程；本内特分析图灵机、信使 RNA、弹道计算机后确认，许多计算可不耗能量完成，热量只在擦除信息时出现（PDF 第 376 页）。<\/p>\n<p><strong>量子信息<\/strong>：量子比特、量子密码、量子纠错与量子隐形传态等方向；量子测量本身参与信息获取，量子力学围绕信息展开（PD
