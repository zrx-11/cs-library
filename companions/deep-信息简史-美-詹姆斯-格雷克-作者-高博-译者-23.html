F 第 377、381 页）。<\/p>\n<p>正例：妖观察或选择分子时无需付熵代价；只有擦除上一次观察结果、为下一次腾出空间时熵增加，遗忘需要功（PDF 第 376 页）。反例：冯·诺伊曼 1949 年估算每个基础二元选择都耗散热量；兰道尔指出多数逻辑操作不增熵，这一估算被修正（PDF 第 375–376 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>先推信息不可脱离载体。信息表现为刻记、孔洞、自旋等物理状态；无物理载体则状态无处留存、无法读取。这一步把 c01 的符号映射拉回物质层：符号要有可分辨的物理实现。<\/p>\n<p>再推可逆操作与熵的关系。一比特从零翻到一或反向，输入可由输出反推，信息守恒，微观状态数不增，熵不变；不耗散热。可逆计算沿此路径，理论上可做到零能耗。<\/p>\n<p>接着推擦除为何不可逆。擦除把两个可能状态压成同一确定状态，输入无法由输出反推；信息被损失，微观状态减少对应热熵增加，代价 <span class=\"katex-inline\">kT\\ln 2<\/span> 量级。妖的悖论缺口正在这里：观察选择可逆，旧记录擦除不可逆，熵成本计入后系统总熵不减。<\/p>\n<p>最后推量子层约束。经典比特非 0 即 1；量子比特可处于叠加态，测量与信道规则改变，引出量子密码与隐形传态设想（PDF 第 377、381 页）。黑洞信息悖论追问信息能否消失：微观定律可逆，信息若消失违反幺正性（PDF 第 372 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：计算过程可区分可逆与不可逆步骤；温度 <span class=\"katex-inline\">T<\/span> 可度量；载体物理定律已知。\n<\/li><li>\n边界一：<span class=\"katex-inline\">kT\\ln 2<\/span> 是擦除一比特的理论下限，不是实际电路能耗；工程电路还有门电路、信号衰减等额外损耗。\n<\/li><li>\n边界二：可逆计算要求操作可反推，现实存储与擦除需求使纯可逆计算难以直接落地；原理给出下限，不规定实现路线。\n<\/li><li>\n失败案例：认为每个逻辑动作都付热熵代价。兰道尔修正了这一估算：增熵只发生在不可逆擦除，翻转本身不增熵（PDF 第 376 页）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>可逆操作 vs 不可逆擦除<\/strong>：可逆操作信息守恒、熵不增；擦除压缩状态空间、信息损失、增熵。两者在计算中常同时出现。\n<\/li><li>\n<strong>信息独立性 vs 物理依托<\/strong>：维纳称信息既非物质也非能量，强调对象独立；兰道尔强调信息必须依托物理载体，两条主张分别针对抽象层与实现层。\n<\/li><li>\n<strong>经典比特 vs 量子比特<\/strong>：经典比特确定处于 0 或 1；量子比特可叠加，测量规则与传输协议不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c10 麦克斯韦妖与熵成本，c08 比特定义。后继：c15 信息过载讨论存储与传输，但未触及物理能耗下限；c11 生物分子机器可作为可逆计算的自然对照。本章把信息观念从抽象度量接回物理定律，闭合 c10 留下的妖悖论。<\/p>\n<p>补充对照：惠勒 1989 年提出「万物源自比特」，主张粒子、力场乃至时空连续统的存在都源自信息；黑洞信息悖论追问信息能否随黑洞消失，关系到微观定律是否可逆（PDF 第 371–372 页）。本内特沿齐拉特与兰道尔进路分析妖与各类计算机；1949 年冯·诺伊曼对单比特操作能耗的估算后来被兰道尔修正。量子比特可处于叠加态，测量规则改变，由此引出量子密码、量子纠错与量子隐形传态设想；量子态仍是物理状态，信息依托物理载体这一约束并未取消（PDF 第 376–381 页）。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（信息是物理的：兰道尔原理与量子信息）<\/summary><div class=\"depth-body\"><h1>c14 深度推导：载体依托、可逆操作与擦除熵代价<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把兰道尔原理讲成可核算的物理结论，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先承认信息依托物理载体<\/strong>：刻记、孔洞、自旋都是物理状态；无载体则信息无处留存。这是信息与物理世界交接的第一前提。\n<\/li><li>\n<strong>区分可逆与不可逆逻辑操作<\/strong>：翻转一比特输入可由输出反推，擦除不能反推；两类操作熵行为不同。\n<\/li><li>\n<strong>确认热力学熵可计入计算过程<\/strong>：计算步骤对应微观状态变化，状态压缩对应热熵增加；不把物理过程入账，妖与计算的能耗论证落空。\n<\/li><li>\n<strong>确认实验与理论的修正路径<\/strong>：冯·诺伊曼早期估算被兰道尔修正；结论随物理分析细化，不是一步到位。\n<\/ol>\n<p>依赖链方向：信息依托载体 → 操作分可逆不可逆 → 可逆翻转信息守恒 → 擦除压缩状态增熵 → 单比特能耗下限 → 量子信息扩展。任何一层缺失：无载体依托则信息可脱离物理；不分可逆不可逆则所有操作都付热熵；不入热力学账则妖悖论消解不掉。<\/p>\n<h2>正向推导：从物理载体推到擦除下限<\/h2>\n<h3>第一步：推信息不可脱离载体<\/h3>\n<p>兰道尔强调，信息无论表现为石板刻记、卡片孔洞还是粒子自旋，都不可能摆脱某种物理载体独立存在（PDF 第 376 页）。无物理状态则符号无法留存、读取。这一步把 c01 符号映射拉回物质层：符号要有可分辨的物理实现。<\/p>\n<h3>第二步：推惠勒的极端主张<\/h3>\n<p>惠勒 1989 年提出「万物源自比特」：任何粒子、力场乃至时空连续统，其功能、意义与存在本身都源自信息；信息第一性，物质第二性（PDF 第 371 页）。黑洞信息悖论追问信息能否消失：微观定律可逆，信息若消失违反幺正性（PDF 第 372 页）。<\/p>\n<h3>第三步：推可逆操作不增熵<\/h3>\n<p>1961 年兰道尔尝试证明冯·诺伊曼信息处理能耗公式，发现大多数逻辑操作其实不增加熵。一比特从零翻到一或反向，信息守恒，过程可逆，熵没有改变，也没有热量需要耗散（PDF 第 376 页）。可逆计算沿此路径，理论上可不耗能量完成。<\/p>\n<h3>第四步：推擦除为何不可逆增熵<\/h3>\n<p>擦除把两个可能状态压成同一确定状态，输入无法由输出反推；信息损失，微观状态减少对应热熵增加。图灵机读写头清除纸带方格、计算机清空电容器，一比特信息损失，有热量必须耗散；擦除是不可逆逻辑操作（PDF 第 376 页）。单比特擦除代价 <span class=\"katex-inline\">kT\\ln 2<\/span> 量级。<\/p>\n<h3>第五步：推妖的记忆擦除环节<\/h3>\n<p>本内特分析各类计算机后确认，许多计算可不耗费能量完成，热量耗散只在擦除信息时发生（PDF 第 376 页）。齐拉特思想实验中，妖观察或选择分子时无需付熵代价；只有消除记录、擦除上一次观察结果为下一次腾出空间时，熵增加才发生。遗忘需要功。<\/p>\n<h3>第六步：推量子层约束<\/h3>\n<p>经典比特非 0 即 1；量子比特可处于叠加态，测量规则与信道规则改变，引出量子密码、量子纠错与量子隐形传态设想（PDF 第 377、381 页）。量子力学里测量本身参与信息获取：观察需借助光子，「看」一个分子不简单。信息在量子层仍受物理定律约束，只是状态规则改变。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：翻转与擦除对照<\/h3>\n<p>翻转：0→1 或 1→0，输出可反推输入，信息守恒，熵不增；擦除：两态压成一态，输入不可反推，增 <span class=\"katex-inline\">kT\\ln 2<\/span> 量级热熵。两类操作热力学行为相反。<\/p>\n<h3>算例 2：能耗下限<\/h3>\n<p>擦除一比特代价 <span class=\"katex-inline\">kT\\ln 2<\/span>，<span class=\"katex-inline\">k<\/span> 为玻尔兹曼常数，<span class=\"katex-inline\">T<\/span> 为温度；温度越高下限越大。这是理论最小值，实际电路还有门电路、信号衰减等额外损耗。<\/p>\n<h3>算例 3：冯·诺伊曼估算修正<\/h3>\n<p>1949 年冯·诺伊曼估算每个基础二元选择都耗散热量；兰道尔指出多数逻辑操作不增熵，这一估算被修正（PDF 第 375–376 页）。修正点：增熵只在不可逆擦除，不在可逆翻转。<\/p>\n<h3>算例 4：妖的两步成本<\/h3>\n<p>观察选择分子：可逆，不增熵；擦除上一次记录：不可逆，增 <span class=\"katex-inline\">k\\ln 2<\/span> 量级。计入擦除成本，妖系统总熵不减，第二定律守住。<\/p>\n<h3>算例 5：可逆计算路径<\/h3>\n<p>许多计算可不耗能量完成；本内特分析图灵机、信使 RNA、弹道计算机后确认这一点（PDF 第 376 页）。现实存储与擦除需求使纯可逆计算难以直接落地，原理给出下限。<\/p>\n<h3>算例 6：量子比特<\/h3>\n<p>经典比特确定处于 0 或 1；量子比特可叠加。叠加态测量规则不同，信息编码与传输协议随之改变，形成量子信息各方向。<\/p>\n<h3>算例 7：黑洞信息<\/h3>\n<p>黑洞外部只能观察质量、电荷、自旋，其他信息观察不到；信息是否随黑洞消失，关系到微观定律可逆性（PDF 第 372 页）。<\/p>\n<h3>算例 8：载体形式对照<\/h3>\n<p>石板刻记、卡片孔洞、粒子自旋承载同一信息概念；载体更换，信息依托物理状态这一约束不变。不同载体能耗与容量各有工程差别。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>信息可脱离物理载体存在<\/strong>：无载体则符号无处留存；信息第一性主张若脱离物理依托，妖与计算的能耗论证全部落空。\n<\/li><li>\n<strong>每个逻辑动作都付热熵代价<\/strong>：按冯·诺伊曼早期估算，可逆翻转也增熵；兰道尔修正后，增熵只归不可逆擦除。\n<\/li><li>\n<strong>擦除信息不付热熵<\/strong>：妖不付擦除成本即可循环分辨分子，第二定律被绕过；<span class=\"katex-inline\">kT\\ln 2<\/span> 下限不存在。\n<\/li><li>\n<strong>量子比特按经典规则处理<\/strong>：忽略叠加与测量约束，量子密码、隐形传态设想不成立；量子层规则不能照搬经典比特。\n<\/ul>\n<h2>延伸层：信息物理闭合 c10 妖悖论<\/h2>\n<p>c10 妖悖论缺口在记忆擦除，本章把它写成单比特热力学下限。本内特沿齐拉特—兰道尔进路分析妖与各类计算机；兰道尔原理成为连接信息论与热力学的节点。c08 比特定义在物理层落到双稳态设备；c11 生物分子机器可作为可逆计算的自然对照。量子信息是经典信息物理约束的扩展，不是脱离物理：量子态仍是物理状态，测量仍依托光子与相互作用。<\/p>\n<h2>补足推导：前提塌陷点、下限性质与可逆现实边界<\/h2>\n<p>兰道尔论证成立依赖三条前提：计算过程可区分可逆不可逆步骤；温度可度量；载体物理定律已知。去掉区分，所有操作被当作不可逆；温度不可度量则 <span class=\"katex-inline\">kT\\ln 2<\/span> 无法核算。下限性质：<span class=\"katex-inline\">kT\\ln 2<\/span> 是擦除一比特理论最小热熵，不是实际能耗；工程损耗另计。可逆现实边界：可逆计算要求操作可反推，现实存储需擦除旧值，纯可逆难以直接落地。不变量：可逆操作信息守恒，不可逆擦除损失信息并增熵；系统总熵不减。量子扩展：叠加改变状态规则，不改变信息必须依托物理状态这一约束。<\/p>\n<h2>补充算例与延伸辨析<\/h2>\n<h3>补充算例六：翻转与擦除的状态走查<\/h3>\n<p>设一个双稳态设备存 0 或 1。翻转操作：0→1 或 1→0，输出状态唯一对应输入状态，可由输出反推输入，信息守恒，过程可逆，熵不增。擦除操作：两个可能状态压成同一确定状态，输入有两种、输出只有一种，无法由输出反推输入；微观状态减少对应热熵增加。两类操作差别在可反推性，不在设备是否通电。可逆计算要求每一步可反推，理论上可不耗能量完成；现实存储需擦除旧值，纯可逆难以直接落地。<\/p>\n<h3>补充算例七：单比特擦除代价量级<\/h3>\n<p>擦除一比特的热熵代价量级为 <span class=\"katex-inline\">kT\\ln 2<\/span>，<span class=\"katex-inline\">k<\/span> 为玻尔兹曼常数，<span class=\"katex-inline\">T<\/span> 为绝对温度；温度越高，理论下限越大。这是理论最小值，实际电路还有门电路切换、信号衰减、散热工程损耗。1949 年冯·诺伊曼估算每个基础二元选择都耗散热量；兰道尔 1961 年分析后修正：多数逻辑操作不增熵，增熵只归不可逆擦除（PDF 第 375–376 页）。修正点是把可逆翻转与不可逆擦除分开入账，而非否定计算有物理成本。<\/p>\n<h3>边界失效推演：三条前提各断一环<\/h3>\n<p>信息脱离物理载体：符号无处留存，刻记、孔洞、自旋等状态都不存在，妖与计算的能耗论证落空。擦除不付热熵：妖不付擦除成本即可循环分辨分子，第二定律被绕过，<span class=\"katex-inline\">kT\\ln 2<\/span> 下限不存在。量子比特按经典规则处理：忽略叠加态与测量约束，量子密码、量子纠错、隐形传态设想不成立。三条前提恢复：信息依托物理状态，可逆与不可逆操作区分入账，量子规则单独建模；妖系统总熵不减，第二定律守住。<\/p>\n<h3>史料因果链：从信息物理主张到量子扩展<\/h3>\n<p>兰道尔 1961 年《信息必然是物理的》确立信息依托载体的立场；齐拉特 1929 年先分析妖的观察记录环节，本内特沿此进路把擦除成本接回妖悖论。惠勒 1989 年提出「万物源自比特」，主张信息第一性；黑洞信息悖论追问信息能否消失，关系微观定律是否可逆（PDF 第 371–372 页）。量子层出现量子比特、量子密码、量子纠错与量子隐形传态设想。链条方向：信息依托载体 → 可逆操作不增熵 → 擦除付熵代价 → 妖悖论消解 → 量子态作为新物理载体。信息第一性主张是哲学层命题，物理依托是工程与热力学层约束，两层不互相取消。<\/p>\n<h3>延伸辨析：可逆不可逆与独立性命题<\/h3>\n<p>可逆翻转信息守恒，不可逆擦除损失信息并增熵；判断标准是输入能否由输出反推。信息独立性命题追问信息能否脱离物质与能量存在；物理依托主张约束信息必须落到可分辨状态。维纳「信息既非物质也非能量」说的是信息不能直接归为物质或能量类别，不等于信息可脱离物理过程。量子比特可叠加，测量规则改变，但量子态仍是物理状态，依托物理载体这一约束在量子层继续成立。<\/p>\n<h2>再算一例与边界补推<\/h2>\n<h3>补充算例八：量子态与测量规则<\/h3>\n<p>经典比特确定处于 0 或 1；量子比特可处于叠加态，测量时规则不同，信息编码与传输协议随之改变，引出量子密码、量子纠错与量子隐形传态设想（PDF 第 377、381 页）。量子态仍是物理状态，测量依托光子与相互作用；叠加改变状态规则，不取消信息必须依托物理载体这一约束。<\/p>\n<h3>边界补推：两层主张分开陈述<\/h3>\n<p>惠勒「万物源自比特」是信息第一性的哲学层主张；兰道尔原理是信息依托物理载体、擦除付熵代价的工程热力学层结论。两层主张回答不同问题：前者追问存在的本原，后者约束信息处理的物理代价。把哲学主张当成工程约束，或把热力学结论当成存在论判断，都属于跨层混用。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n信息为什么不能摆脱物理载体？\n<\/li><li>\n可逆翻转与不可逆擦除熵行为差别在哪？\n<\/li><li>\n擦除一比特的代价量级是什么？\n<\/li><li>\n妖在哪一步付熵成本？观察本身为什么不增熵？\n<\/li><li>\n兰道尔怎样修正冯·诺伊曼早期估算？\n<\/li><li>\n量子比特与经典比特规则差别在哪？\n<\/ol>\n<h2>自检问题<\/h2>\n<ol><li>\n推一下：为什么擦除比翻转多付热熵代价？\n<\/li><li>\n<span class=\"katex-inline\">kT\\ln 2<\/span> 是理论下限还是实际电路能耗？\n<\/li><li>\n可逆计算为什么现实中难以纯落地？\n<\/li><li>\n黑洞信息悖论与微观定律可逆性有什么关系？\n<\/li><li>\n信息独立性命题与物理依托主张分别针对哪一层？\n<\/ol><\/div><\/details>", "c15": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/信息/信息简史 (［美］詹姆斯•格雷克 (作者) 高博 (译者)) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.415<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">信道容量与有噪信道编码定理<\/a><\/span><\/div><h1>信息过载与意义回归：洪流中的筛选、索引与阐释<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 4 章（第 14 章 洪流过后、第 15 章 每天都有新消息、尾声 意义的回归，PDF 第 389–434 页）\n<\/ul>\n<h2>问题<\/h2>\n<p>讯息积累速度超过索引与筛选能力时，知识库变成找不到入口的垃圾堆。词典与目录解决过词表规模问题，面对每日新增消息、图像与数据，组织手段为什么仍频频失效？香农模型把意义排除在工程问题之外，走到信息社会尽头，信息与意义的关系怎样重新提出？本章概念梳理过载的历史脉络、组织手段，以及信息量与意义之分。<\/p>\n<h2>定义<\/h2>\n<p><strong>信息过载<\/strong>：可获取讯息量超过个人与机构处理、筛选、消化能力的状态；新增消息不断涌入，索引、分类与注意力跟不上积累速度。<\/p>\n<p><strong>消歧义<\/strong>：一名多义条目在目录中拆成分歧路径，逐个区分不同所指。维基百科 Babel 词条可指古巴比伦名字、巴别塔、报纸、图书、电影、唱片公司、岛屿、山脉乃至虚构星球，消歧义页层层分岔（PDF 第 389 页）。<\/p>\n<p><strong>次生口语与媒介塑造<\/strong>：艾森斯坦 1979 年两卷本《作为变革动因的印刷机》论证印刷副本众多使文本趋于固定；麦克卢汉 1962 年《古登堡星系》提示历史学家注意媒介本身影响知识稳定性（PDF 第 415–416 页）。<\/p>\n<p><strong>信息与意义之分<\/strong>：信息可作为客观对象度量传输；意义是经过阐释生成的最终产品。冯·弗尔斯特抱怨信息论研究的只是「哔哔声」；德雷特斯科区分二者，认为信息是原材料，意义需阐释生成（PDF 第 433 页）。<\/p>\n<p>正例：早在 1621 年伯顿就在《忧郁的解剖》中描述每日新消息造成的信息过多感受；过载不是数字时代独有（PDF 第 417 页）。反例：把讯息量增长等同于意义增长。信息社会悖论是：关于世界的信息越来越多，世界在人看来却可能越来越缺乏意义（PDF 第 433 页）。<\/p>\n<h2>原理推导<\/h2>\n<p>先推过载产生的条件。讯息留存成本下降、复制渠道增多，存量累积；处理能力受注意力、索引规则、分类体系约束。存量增速超过组织手段增速，查找成本上升，冗余与垃圾讯息混入。<\/p>\n<p>再推组织手段的演进。早期靠主题分类与字母排序（c04）；规模扩大后出现消歧义页、号码簿、目录与索引。巴贝奇设想空气图书馆，爱伦·坡 1845 年议论言语脉冲在空气中无限扩散，拉普拉斯设想掌握全部粒子状态的智能生命，都是信息留存想象的前身（PDF 第 390 页）。威尔斯 1938 年《世界大脑》与 1937 年巴黎世界通用文献大会，尝试把人类知识组织成可检索整体（PDF 第 432 页）。<\/p>\n<p>接着推意义回归的逻辑。香农模型剥离意义是建模需要：意义依赖阐释体系，无法在工程上统一度量（c09）。走到信息社会，讯息洪流压过筛选，问题从「传得过去吗」变成「传过去的算不算有意义」。德雷特斯科区分信息与意义：信息可度量传输，意义在阐释中生成；信息增多不自动带来意义（PDF 第 433 页）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：讯息可被索引、分类、筛选；受众有阐释能力；组织规则在群体内共享。\n<\/li><li>\n边界一：索引与分类不能替代理解。消歧义只区分所指，不判断条目价值；意义生成在阐释层完成。\n<\/li><li>\n边界二：过载感受受渠道与注意力约束；同一讯息量在不同筛选能力下，过载程度不同。\n<\/li><li>\n失败案例：以为增加存储与复制就能解决过载。留存更多讯息只扩大存量，不自动建立索引；没有筛选与阐释，累积反而加重查找负担。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>信息 vs 意义<\/strong>：信息是可度量的原材料，意义是经阐释的最终产品；信息论研究符号传输，意义问题属阐释与价值判断。\n<\/li><li>\n<strong>索引 vs 理解<\/strong>：索引把条目定位到位置，理解判断条目与问题的关联；目录齐全不等于知识掌握。\n<\/li><li>\n<strong>冗余留存 vs 冗余压缩<\/strong>：历史词典留存不同年代证据，压缩算法去掉可缩减部分；过载场景两者都需要，取舍取决于用途。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c04 词典排序，c09 信道模型剥离意义，c12 模因竞争注意力。后继收束全书：本章把 c01–c14 的编码、冗余、容量、熵、复制子、复杂度、物理载体线索汇总到社会层面；意义回归回应引子提出的命名与理解问题。信息过载是工程能力与阐释能力之间的落差，不是单一技术问题。<\/p>\n<p>补充对照：特伦的巴别图书馆设想所有书籍组合齐备，巴贝奇设想空气图书馆留存言语痕迹，爱伦·坡 1845 年议论言语脉冲在空气中无限扩散，拉普拉斯设想掌握全部粒子状态的智能生命，都是信息全留存想象的前身（PDF 第 389–390 页）。艾森斯坦 1979 年《作为变革动因的印刷机》论证印刷副本众多使文本固定，麦克卢汉 1962 年《古登堡星系》提示媒介本身影响知识形态；伯顿 1621 年《忧郁的解剖》已记录新消息过多的感受。冯·弗尔斯特抱怨信息论只研究「哔哔声」，德雷特斯科把信息与意义分开：信息客观可度量传输，意义是阐释后的产品（PDF 第 415–433 页）。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（信息过载与意义回归：洪流中的筛选、索引与阐释）<\/summary><div class=\"depth-body\"><h1>c15 深度推导：过载条件、组织手段演进与信息意义之分<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把信息过载与意义回归讲成可分析问题，先往回追四层前提：<\/p>\n<ol><li>\n<strong>先确认存量与处理能力两条增长曲线<\/strong>：讯息留存成本下降使存量累积，处理能力受注意力、索引规则约束；两条曲线速度差产生过载。\n<\/li><li>\n<strong>区分组织手段与留存手段<\/strong>：复制留存扩大存量，索引分类解决定位；两者不是一回事。\n<\/li><li>\n<strong>确认意义在阐释层<\/strong>：香农模型剥离意义是建模需要；信息可度量传输，意义需阐释生成。\n<\/li><li>\n<strong>区分信息量与意义增长<\/strong>：讯息量增加不自动带来意义增多；两条曲线分别对应工程层与阐释层。\n<\/ol>\n<p>依赖链方向：留存成本下降 → 存量累积 → 索引筛选跟不上 → 过载 → 组织手段演进 → 意义回归。任何一层缺失：只谈技术不谈处理能力，过载原因说不清；把留存当组织，目录建设被漏掉；混同信息与意义，会以为讯息多了意义自然多。<\/p>\n<h2>正向推导：从过载条件推到意义回归<\/h2>\n<h3>第一步：推过载产生条件<\/h3>\n<p>讯息留存成本下降、复制渠道增多，存量累积；处理能力受注意力、索引规则、分类体系约束。存量增速超过组织手段增速，查找成本上升，冗余与垃圾讯息混入。过载不是数字时代独有：1621 年伯顿就在《忧郁的解剖》中描述每日新消息造成的信息过多感受（PDF 第 417 页）。<\/p>\n<h3>第二步：推组织手段演进<\/h3>\n<p>早期靠主题分类与字母排序（c04）；规模扩大后出现消歧义页、号码簿、目录与索引。维基百科 Babel 词条可指古巴比伦名字、巴别塔、报纸、图书、电影、唱片公司、岛屿、山脉乃至虚构星球，消歧义页层层分岔（PDF 第 389 页）。巴贝奇设想空气图书馆，爱伦·坡 1845 年议论言语脉冲在空气中无限扩散，拉普拉斯设想掌握全部粒子状态的智能生命，都是信息留存想象的前身（PDF 第 390 页）。<\/p>\n<h3>第三步：推媒介对知识稳定性的影响<\/h3>\n<p>印刷术改变知识稳定性：艾森斯坦 1979 年两卷本《作为变革动因的印刷机》论证印刷副本众多使文本趋于固定；麦克卢汉 1962 年《古登堡星系》提示历史学家注意媒介本身影响知识稳定性（PDF 第 415–416 页）。留存与复制技术改变文本漂移速度，进而改变可检索与可核对程度。<\/p>\n<h3>第四步：推知识组织的早期设想<\/h3>\n<p>威尔斯 1938 年《世界大脑》与 1937 年巴黎世界通用文献大会，尝试把人类知识组织成可检索整体（PDF 第 432 页）。这类设想面对的矛盾与今天相同：知识总量超出个人掌握，需要外部组织装置把分散条目连成可查网络。<\/p>\n<h3>第五步：推意义回归的逻辑<\/h3>\n<p>香农模型剥离意义是建模需要：意义依赖阐释体系，无法在工程上统一度量（c09）。走到信息社会，讯息洪流压过筛选，问题从「传得过去吗」变成「传过去的算不算有意义」。冯·弗尔斯特抱怨信息论研究的只是「哔哔声」；德雷特斯科区分信息与意义：信息可作为客观对象度量传输，意义是经过阐释生成的最终产品（PDF 第 433 页）。<\/p>\n<h3>第六步：推信息社会悖论<\/h3>\n<p>关于世界的信息越来越多，世界在人看来却可能越来越缺乏意义（PDF 第 433 页）。悖论根源：信息在工程层累积，意义在阐释层生成；留存更多讯息不自动提升阐释能力。过载压力下，筛选、索引、阐释成为与传输并列的问题。<\/p>\n<h2>数值算例<\/h2>\n<h3>算例 1：消歧义分岔<\/h3>\n<p>Babel 一名多义：人名、塔、报纸、图书、电影、唱片公司、岛屿、山脉、虚构星球（PDF 第 389 页）。消歧义页把一个入口拆成多条路径，每条指向不同所指；条目越多，分岔层级越深。<\/p>\n<h3>算例 2：历史对照<\/h3>\n<p>1621 年伯顿描述每日新消息过多（PDF 第 417 页）；19 世纪电报报纸、20 世纪广播电视、21 世纪网络消息各有过载形态。技术载体变了，存量与处理能力落差反复出现。<\/p>\n<h3>算例 3：印刷副本稳定性<\/h3>\n<p>手抄本每次复制可能漂移；印刷副本众多，文本趋于固定，勘误可跨副本对照（PDF 第 416 页）。复制保真度提高，知识版本稳定，索引与引用才可靠。<\/p>\n<h3>算例 4：信息与意义分层<\/h3>\n<p>信息：可度量、可传输的符号序列；意义：接收者阐释后生成的产品。同一串信息在不同阐释下意义不同；信息增多不保证意义增多。<\/p>\n<h3>算例 5：索引职责<\/h3>\n<p>索引把条目定位到位置；理解判断条目与问题的关联。目录齐全不等于知识掌握，消歧义只区分所指，不判断价值。<\/p>\n<h3>算例 6：留存想象前身<\/h3>\n<p>巴贝奇空气图书馆、爱伦·坡言语脉冲扩散、拉普拉斯智能生命，都设想信息全留存或全掌握（PDF 第 390 页）。现实受存储与处理能力约束，全留存不等于全可懂。<\/p>\n<h3>算例 7：媒介影响<\/h3>\n<p>麦克卢汉提示媒介本身塑造知识形态；艾森斯坦论证印刷使文本固定（PDF 第 415–416 页）。换媒介不只换载体，还改变知识稳定方式与传播节奏。<\/p>\n<h3>算例 8：过载与注意力<\/h3>\n<p>模因竞争有限注意力（c12）；过载环境下传播力强的条目占住带宽，筛选压力上升。索引与分类是对注意力约束的组织补偿。<\/p>\n<h2>反事实推演<\/h2>\n<ul><li>\n<strong>以为增加存储复制就解决过载<\/strong>：留存更多讯息只扩大存量，不自动建立索引；没有筛选与阐释，累积加重查找负担。\n<\/li><li>\n<strong>索引替代理解<\/strong>：消歧义与目录只定位条目，不判断价值关联；目录齐全而阐释能力不足，过载仍在。\n<\/li><li>\n<strong>信息增多等于意义增多<\/strong>：工程层累积不自动生成阐释；信息社会悖论正是这一混同的反面。\n<\/li><li>\n<strong>把过载只当数字时代新问题<\/strong>：1621 年已有新消息过多描述；技术放大落差，但矛盾反复出现。\n<\/ul>\n<h2>延伸层：全书线索在社会层面汇合<\/h2>\n<p>本章把 c01–c14 线索汇总：编码、冗余、容量、熵、复制子、复杂度、物理载体各在生命文化随机物理方向接受检验。c04 词典排序是第一批可检索组织规则，后世索引目录沿此结构扩展；c09 信道模型剥离意义，本章把意义请回讨论；c12 模因竞争注意力是过载的微观机制。信息过载是工程能力与阐释能力之间的落差，不是单一技术问题；索引、分类、筛选、阐释分别对应不同环节。<\/p>\n<h2>补足推导：前提塌陷点、组织不变量与信息意义边界<\/h2>\n<p>过载分析成立依赖三条前提：讯息可被索引分类；受众有阐释能力；组织规则群体共享。不可索引则条目散落；无阐释能力则定位后仍不理解；规则不共享则目录失效。组织不变量：给定条目键，索引定位到位置；同一键每次指向同一条目。信息意义边界：信息客观可度量，意义主观生成；信息论研究符号传输，意义问题属阐释与价值判断。冗余留存与压缩取舍：历史词典留存年代证据，压缩算法去掉可缩减部分；过载场景两者都需要，取舍取决于用途。不变量：讯息量增长不改变意义生成机制；阐释能力跟不上存量时，过载感受加剧。<\/p>\n<h2>补充算例与延伸辨析<\/h2>\n<h3>补充算例九：消歧义分岔走查<\/h3>\n<p>Babel 一名多义：古巴比伦名字、巴别塔、报纸、图书、电影、唱片公司、岛屿、山脉、虚构星球（PDF 第 389 页）。消歧义页把一个入口拆成多条路径，每条指向不同所指；条目越多，分岔层级越深。定位过程按名称逐级匹配，匹配到多条并列时进入消歧义页；消歧义只区分所指，不判断条目与提问的价值关联。目录齐全不等于知识掌握：索引把条目送到位置，理解判断条目关联是另一层能力。<\/p>\n<h3>补充算例十：过载形态的历史对照<\/h3>\n<p>1621 年伯顿在《忧郁的解剖》中描述每日新消息造成的信息过多感受（PDF 第 417 页）；19 世纪电报与报纸扩大新闻供给；20 世纪广播电视加入信息流；21 世纪网络消息进一步放大存量。技术载体更替，存量增速与组织能力落差反复出现。留存手段下降复制成本，扩大存量；组织手段靠分类、排序、消歧义、目录解决定位。两条曲线速度差产生过载：存量增速超过索引、筛选与注意力处理能力时，查找成本上升，冗余与垃圾讯息混入。<\/p>\n<h3>边界失效推演：三条补偿路径各断一环<\/h3>\n<p>只扩大存储复制：留存更多讯息不自动建立索引，存量累积加重查找负担，过载不缓解。索引替代理解：消歧义与目录只定位条目，不判断价值关联；目录齐全而阐释能力不足，过载仍在。信息增多当成意义增多：工程层累积不自动生成阐释，讯息量增长不改变意义生成机制。三条路径各自只补一层：存储补留存，索引补定位，阐释补理解；把其中一层当成全部，是过载讨论常见混淆。<\/p>\n<h3>史料因果链：媒介稳定性到意义回归<\/h3>\n<p>印刷术改变知识稳定性：艾森斯坦 1979 年《作为变革动因的印刷机》论证印刷副本众多使文本趋于固定；麦克卢汉 1962 年《古登堡星系》提示历史学家注意媒介本身影响知识形态（PDF 第 415–416 页）。威尔斯 1938 年《世界大脑》与 1937 年巴黎世界通用文献大会尝试把人类知识组织成可检索整体（PDF 第 432 页）。冯·弗尔斯特抱怨信息论只研究「哔哔声」；德雷特斯科区分信息与意义：信息可客观度量传输，意义是经阐释生成的最终产品（PDF 第 433 页）。链条方向：复制技术改变文本稳定性 → 知识总量超出个人掌握 → 外部组织装置设想出现 → 工程传输与阐释意义重新分层。<\/p>\n<h3>延伸辨析：留存、组织与阐释三层分工<\/h3>\n<p>留存：复制与存储扩大讯息存量，对应载体技术；组织：分类、字母排序、消歧义、目录索引解决定位；阐释：理解、判断、意义生成对应受众能力。巴贝奇空气图书馆、爱伦·坡言语脉冲扩散、拉普拉斯智能生命都是全留存或全掌握想象的前身（PDF 第 390 页），现实受存储与处理能力约束。信息社会悖论：关于世界的信息越来越多，世界在人看来却可能越缺乏意义；根源在工程层累积与阐释层生成之间的落差，不是某一项传输技术单独造成。<\/p>\n<h2>再算一例与边界补推<\/h2>\n<h3>补充算例十一：索引层级与定位职责<\/h3>\n<p>条目先按大类分岔，再按字母或主题排序，多义词进入消歧义页；每一级只做一层匹配，定位到具体条目。索引职责是把条目送到位置；判断条目与提问是否相关、内容是否可靠，属于阐释层。目录层级再深，也不自动生成理解；消歧义页再全，也不替代价值判断。<\/p>\n<h3>边界补推：信息与意义再分层<\/h3>\n<p>信息可作为客观对象度量与传输；意义是接收者阐释后生成的产品。同一串信息在不同阐释下意义不同，信息增多不保证意义增多。信息社会悖论的根源在工程层累积与阐释层生成之间的落差；缓解过载要同时补存储、索引与阐释三层，单靠扩大任何一层都不够。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\n过载产生的两条增长曲线各是什么？\n<\/li><li>\n留存手段与组织手段差别在哪？\n<\/li><li>\n消歧义页解决什么问题、不解决什么问题？\n<\/li><li>\n信息与意义怎样分层？\n<\/li><li>\n为什么讯息增多不自动带来意义增多？\n<\/li><li>\n过载是不是数字时代独有现象？\n<\/ol>\n<h2>自检问题<\/h2>\n<ol><li>\n推一下：只扩大存储能力，过载为什么仍可能加剧？\n<\/li><li>\n字母排序、消歧义页、号码簿共享什么索引结构？\n<\/li><li>\n印刷副本怎样提高文本稳定性？\n<\/li><li>\n德雷特斯科怎样区分信息与意义？\n<\/li><li>\n信息社会悖论的根源在哪一层？\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：符号与编码的史前形态：鼓语、口头文化、文字与词典<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1–3 章：会说话的鼓、持久的文字与两本词典——信号、符号与词表<\/a><br>检查点：能说出编码是符号集合到另一集合的映射，解释鼓语为何用两套音高加固定套语补歧义，说明文字如何把记忆从心智外部化到载体上，以及字母排序怎样让词表可检索<\/li><li class='path-step' id='path-02'><strong>步骤 02：机械计算与电气通信：分析机、电报码与电话交换<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 4–6 章：齿轮上的机械计算、电报与电话——可编程性与电气通信<\/a><br>检查点：能推演出分析机存储与运算分离带来的可编程性，按频率分布说明不等长编码节省的平均时间，区分电报离散符号与电话连续语音，并解释继电器如何同时承担信号中继与逻辑运算<\/li><li class='path-step' id='path-03'><strong>步骤 03：信息论与熵：比特度量、信道容量、纠错编码、热力学熵与妖<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 7–9 章：信息论、信息转向与熵及其妖——把信息变成可度量对象<\/a><br>检查点：能代入具体概率分布计算香农熵，复述通信系统五要素与噪声位置，说清低于信道容量时纠错编码如何让错误概率任意小，对比热力学熵与信息熵的同构形式，说明麦克斯韦妖为何不能免费获取信息<\/li><li class='path-step' id='path-04'><strong>步骤 04：信息的延伸：遗传编码、模因、算法随机性、信息物理与过载<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 10–15 章及尾声：生命编码、模因、随机性、信息物理与洪流过后<\/a><br>检查点：能从四碱基与二十种氨基酸推出三联体的组合约束，界定模因复制、变异、选择三环节，按最短程序长度区分可计算序列与随机序列，复述擦除一比特的熵代价，区分信息与意义并说明信息过载为何不等于意义过剩<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='编码（code）'>编码（code） — 在两类事物之间建立的符号映射：用一组符号表示另一组消息、对象或指令；映射可以是任意约定，接收端需按同一码本解码（原书引子、第1章，PDF 第 33–44 页） <span class=glossary-ref>（第 1–3 章：会说话的鼓、持久的文字与两本词典——信号、符号与词表）<\/span><\/li><li data-term='冗余（redundancy）'>冗余（redundancy） — 消息中可在不丢失信息前提下缩减的部分；自然语言的统计结构、鼓语的固定套语、纠错码里的额外符号都是冗余，既帮人消除歧义，也可被压缩（原书第1、7章，PDF 第 41–43、233–234 页） <span class=glossary-ref>（第 1–3 章：会说话的鼓、持久的文字与两本词典——信号、符号与词表）<\/span><\/li><li data-term='声调语言'>声调语言 — 词的意义同时由音节的高低音高与读音决定；鼓语只保留高低两个音素，靠节奏与套语补偿被丢弃的辅音元音信息（原书第1章，PDF 第 40–42 页） <span class=glossary-ref>（第 1–3 章：会说话的鼓、持久的文字与两本词典——信号、符号与词表）<\/span><\/li><li data-term='次生口语文化'>次生口语文化 — 印刷与电子媒介出现后，社会重新以口头表达为中心的状态；书写把记忆从人脑外部化到载体，又反过来改变了口头传承的组织方式（原书第2章，PDF 第 49–50 页） <span class=glossary-ref>（第 1–3 章：会说话的鼓、持久的文字与两本词典——信号、符号与词表）<\/span><\/li><li data-term='分析机（analytical engine）'>分析机（Analytical Engine） — 巴贝奇设想的通用机械计算机：仓库存数、工场运算，变量卡片与运算卡片分工，指令与数据可分别编排；未实际建成，但包含存储程序与可编程性的核心思想（原书第4章，PDF 第 125–134 页） <span class=glossary-ref>（第 4–6 章：齿轮上的机械计算、电报与电话——可编程性与电气通信）<\/span><\/li><li data-term='不等长编码'>不等长编码 — 出现概率高的符号用短码、罕见符号用长码的编码方式；摩尔斯电码中最常见的字母 E 用一个点，罕见字母用更长的点划序列，以压缩平均传输时间（原书第1、7章，PDF 第 38–39、240 页） <span class=glossary-ref>（第 4–6 章：齿轮上的机械计算、电报与电话——可编程性与电气通信）<\/span><\/li><li data-term='继电器（relay）'>继电器（relay） — 用弱电流操纵电磁铁、再控制下一段电路开关的装置；最初为电报中继信号而设，后来被发现可组合成与、或、否逻辑电路（原书第5、6章，PDF 第 162、193 页） <span class=glossary-ref>（第 4–6 章：齿轮上的机械计算、电报与电话——可编程性与电气通信）<\/span><\/li><li data-term='比特（bit，binary digit）'>比特（bit，binary digit） — 以2为底的信息单位；一次等概率二选一的不确定性对应 1 比特；N 个双稳态设备可存 N 比特，可能状态总数为 $2^N$（原书第7章，PDF 第 243–246 页） <span class=glossary-ref>（第 7–9 章：信息论、信息转向与熵及其妖——把信息变成可度量对象）<\/span><\/li><li data-term='香农熵（信息熵，h）'>香农熵（信息熵，H） — 对信源不确定性的度量：$H=-\\sum_i p_i\\log_2 p_i$；等概率 $s$ 种符号时 $H=\\log_2 s$；概率越分散、越出人意料，熵越大（原书第7章，PDF 第 243 页） <span class=glossary-ref>（第 7–9 章：信息论、信息转向与熵及其妖——把信息变成可度量对象）<\/span><\/li><li data-term='信道容量'>信道容量 — 任何信道上信息传输速率的上限（香农限）；只要速率不超过容量，就存在纠错编码使错误概率任意小（原书第7章，PDF 第 245 页） <span class=glossary-ref>（第 7–9 章：信息论、信息转向与熵及其妖——把信息变成可度量对象）<\/span><\/li><li data-term='麦克斯韦妖'>麦克斯韦妖 — 麦克斯韦设想的能逐个分辨分子快慢并控制隔板微孔的智能存在；它看似违背热力学第二定律，实则必须为获取和记忆信息支付熵成本（原书第9章，PDF 第 291–295 页） <span class=glossary-ref>（第 7–9 章：信息论、信息转向与熵及其妖——把信息变成可度量对象）<\/span><\/li><li data-term='遗传编码（遗传密码）'>遗传编码（遗传密码） — 用四种碱基 A、C、G、T 的三联体序列对应二十种氨基酸的映射；DNA 一维长链存储信息，经转录为 RNA、翻译为蛋白质完成信息转移（原书第10章，PDF 第 308–313 页） <span class=glossary-ref>（第 10–15 章及尾声：生命编码、模因、随机性、信息物理与洪流过后）<\/span><\/li><li data-term='模因（meme）'>模因（meme） — 道金斯提出的文化复制子：通过模仿在大脑之间跳转传播，经历复制、变异与选择竞争，争夺注意力与大脑带宽；思想、旋律、流行语、图像均可成为模因（原书第11章，PDF 第 329–331 页） <span class=glossary-ref>（第 10–15 章及尾声：生命编码、模因、随机性、信息物理与洪流过后）<\/span><\/li><li data-term='算法复杂度（最短程序长度）'>算法复杂度（最短程序长度） — 蔡廷、柯尔莫哥洛夫各自给出的随机性算法定义：一个字符串所含信息量等于能生成它的最短程序的长度；可被短程序压缩生成的序列有模式，不可压缩的才接近随机（原书第12章，PDF 第 348–349 页） <span class=glossary-ref>（第 10–15 章及尾声：生命编码、模因、随机性、信息物理与洪流过后）<\/span><\/li><li data-term='兰道尔原理'>兰道尔原理 — 兰道尔 1961 年提出：信息处理必须依托物理载体并遵循物理定律；可逆逻辑操作不增熵，只有擦除信息这类不可逆操作才把一比特代价转化为 $kT\\ln2$ 量级的热熵（原书第13章，PDF 第 375–376 页） <span class=glossary-ref>（第 10–15 章及尾声：生命编码、模因、随机性、信息物理与洪流过后）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：先立码本与共享规则，再谈符号能否还原<\/h2>\n<p>分析任何通信或编码现象，先问四样：被表示对象有哪些、可用符号有哪些、映射规则是什么、接收端是否持有同一规则。鼓语、摩尔斯码、遗传编码、程序指令都先落这张码本表。码本不共享，信道再通畅也只是收到无归属记号；符号与所指的对应是约定出来的，约定可换，但两端必须一致。评估一个编码系统够用不够用，先看对象规模与符号组合容量是否匹配，再看停顿、套语等切分规则是否完备。<\/p>\n<h2>模式 2：组合容量先算上下界，再谈具体映射<\/h2>\n<p>对象规模 <span class=\"katex-inline\">M<\/span>、符号种类 <span class=\"katex-inline\">s<\/span>、位置数 <span class=\"katex-inline\">k<\/span> 先满足 <span class=\"katex-inline\">s^k\\ge M<\/span>，解出最小 <span class=\"katex-inline\">k<\/span> 作为码长下界。电报字母、鼓语两音素、遗传三联体都先经这一步：四碱基配二十种氨基酸，单碱基 4、双碱基 16 都不够，三联体 64 才过线。组合论只给码长下界，不指定哪组符号对应哪个对象；具体映射要靠实验数据或两端约定确定。把组合约束误当映射方案，是编码讨论常见的越界。<\/p>\n<h2>模式 3：冗余按用途分方向——口语套语与纠错码加冗余，压缩去冗余<\/h2>\n<p>冗余有两个相反方向。对抗噪声与歧义时，有意加入额外符号：鼓语套语、电报停顿、纠错编码，用传输时长或比特预算换可分辨性；压缩时去掉信源自身冗余，高频短码、短程序生成有规律序列，缩短长度。先分清目标是保可靠还是省带宽：前者加冗余，后者去冗余。自然语言两者兼有，上下文冗余让人读懂错别字，也给压缩留出空间。冗余与效率在同一信道上此消彼长，不存在越多越好或越少越好的笼统结论。<\/p>\n<h2>模式 4：抽象结构与物理载体分开评估<\/h2>\n<p>同一映射可落到鼓面、电线、齿轮、卡片、碱基、量子态等不同载体。分析问题先抽符号层：对象、符号、规则、分工；再谈载体物理实现。仓库与工场、存储与运算的分工，从齿轮分析机到电子计算机保留下来，换的是工艺不是职责。载体更换不改变映射结构；反过来，载体物理约束（音高时长、电路通断、分子化学）会限制符号可分辨维度，抽象设计要落回可行载体。<\/p>\n<h2>模式 5：度量先看概率分布，再算平均量<\/h2>\n<p>不等概率信源不能按符号数目直接估信息量：频繁符号意外程度低，罕见符号意外程度高。熵 <span class=\"katex-inline\">H=-\\sum_i p_i\\log_2 p_i<\/span> 按概率加权；平均码长 <span class=\"katex-inline\">L=\\sum_i p_i l_i<\/span> 按频次分配。先估分布是否均匀：分布越不均，不等长压缩空间越大；分布接近均匀，长短码收益有限。频次统计、双字母关联、上下文依赖分层纳入，单字母概率只是第一层近似。<\/p>\n<h2>模式 6：建工程模型时先剥离意义，边界处再请回意义<\/h2>\n<p>香农把语义因素请出通信模型，是因为意义依赖阐释体系、无法统一度量；模型只处理符号可还原。剥离意义后，信道、速率、码长成为可计算对象。这一边界不是否认意义：信息可客观传输，意义在接收端阐释中生成。读到信息论结论时先确认它在哪一层：符号传输层还是阐释价值层；把容量、熵套到真假判断或价值评估上，属于跨层混用。<\/p>\n<h2>模式 7：复制子现象按复制、变异、选择三环节拆解<\/h2>\n<p>看文化或生物传播，先拆三环节：复制（信息单元跨个体跳转）、变异（复制品改动产生新变体）、选择（有限资源下留存淘汰）。基因靠核酸复制，模因靠模仿跳转；物质载体不同，三环节结构相同。界定单元规模时区分复制子与载具：单个核苷酸不是基因，单个简单想法不是模因，实物材料是载具。传播力强只说明在竞争中胜出，不证明内容正确；变异缺失则选择空转。<\/p>\n<h2>模式 8：信息归信息，意义归阐释；过载是能力落差<\/h2>\n<p>讨论讯息洪流时分两层：工程层看存量、传输、索引、筛选；阐释层看理解、判断、意义生成。留存复制扩大存量，不自动建立索引；目录定位条目，不判断条目价值。信息增多不自动带来意义增多，信息社会悖论正源于两层落差。组织手段（分类、排序、消歧义、目录）只解决定位；理解与阐释是另一套能力。评估一项信息机制先问它处理哪一层，再看它的盲区在哪一层。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>四章路线对照<\/h2>\n<ul><li>\n<strong>第 1 章 符号与编码史前形态<\/strong>：非洲鼓语、口头文化、文字外部化、词典与字母排序（原书引子及第 1–3 章，PDF 第 23–96 页）。\n<\/li><li>\n<strong>第 2 章 机械计算与电气通信<\/strong>：巴贝奇分析机、电报不等长码、电话连续信号与交换网络（原书第 4–6 章，PDF 第 99–220 页）。\n<\/li><li>\n<strong>第 3 章 信息论与熵<\/strong>：比特与香农熵、信道容量与纠错编码、热力学熵与麦克斯韦妖、控制论信息转向（原书第 7–9 章，PDF 第 223–302 页）。\n<\/li><li>\n<strong>第 4 章 信息的延伸与过载<\/strong>：遗传编码、模因、算法随机性、信息物理、信息洪流与意义回归（原书第 10–15 章及尾声，PDF 第 305–434 页）。\n<\/ul>\n<h2>编码组合容量<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>项<\/th><th>关系<\/th><th>数值<\/th><\/tr><\/thead><tbody><tr><td>单符号组合数<\/td><td><span class=\"katex-inline\">s<\/span> 种<\/td><td><span class=\"katex-inline\">s=2<\/span> 二选一，<span class=\"katex-inline\">s=26<\/span> 字母表<\/td><\/tr><tr><td><span class=\"katex-inline\">k<\/span> 位置组合数<\/td><td><span class=\"katex-inline\">s^k<\/span><\/td><td>二进制 <span class=\"katex-inline\">2^k<\/span>；<span class=\"katex-inline\">k=5<\/span> 得 32 种<\/td><\/tr><tr><td>等概率信息量上界<\/td><td><span class=\"katex-inline\">\\log_2 s<\/span> 比特<\/td><td><span class=\"katex-inline\">s=2<\/span> 为 1，<span class=\"katex-inline\">s=32<\/span> 为 5<\/td><\/tr><tr><td><span class=\"katex-inline\">N<\/span> 双稳态设备<\/td><td>存 <span class=\"katex-inline\">N<\/span> 比特<\/td><td>状态总数 <span class=\"katex-inline\">2^N<\/span><\/td><\/tr><tr><td>遗传三联体<\/td><td><span class=\"katex-inline\">4^3=64<\/span><\/td><td>对应二十种氨基酸，余量留同义密码子与终止信号<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>香农熵算例<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>分布<\/th><th>熵计算<\/th><th>结果<\/th><\/tr><\/thead><tbody><tr><td>等概二选一<\/td><td><span class=\"katex-inline\">H=-\\frac12\\log_2\\frac12-\\frac12\\log_2\\frac12<\/span><\/td><td>1 比特<\/td><\/tr><tr><td>不等概 <span class=\"katex-inline\">0.9/0.1<\/span><\/td><td><span class=\"katex-inline\">H=-0.9\\log_2 0.9-0.1\\log_2 0.1<\/span><\/td><td>约 0.469 比特<\/td><\/tr><tr><td>32 字符等概<\/td><td><span class=\"katex-inline\">\\log_2 32<\/span><\/td><td>5 比特<\/td><\/tr><tr><td>英语每字母<\/td><td>实测估计<\/td><td>约 2.3 比特；字母结构冗余约 50%，句段层面约 75%<\/td><\/tr><\/tbody><\/table><\/div>\n<p>公式 <span class=\"katex-inline\">H=-\\sum_i p_i\\log_2 p_i<\/span>；概率集中于一符号时 <span class=\"katex-inline\">H=0<\/span>，分布越分散熵越大。<\/p>\n<h2>通信模型与容量<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>环节<\/th><th>职责<\/th><\/tr><\/thead><tbody><tr><td>信源<\/td><td>产生讯息<\/td><\/tr><tr><td>发送器<\/td><td>编码成信号<\/td><\/tr><tr><td>信道<\/td><td>传输信号，含带宽与噪声<\/td><\/tr><tr><td>接收器<\/td><td>解码还原<\/td><\/tr><tr><td>信宿<\/td><td>收到讯息<\/td><\/tr><tr><td>噪声<\/td><td>静电、天电、干扰、失真等独立干扰方<\/td><\/tr><\/tbody><\/table><\/div>\n<p>定理：速率 <span class=\"katex-inline\">R<\/span> 低于容量 <span class=\"katex-inline\">C<\/span> 时，存在纠错编码使错误概率任意小；越接近 <span class=\"katex-inline\">C<\/span>，纠错比特越多、速率越慢。定理只证明存在性，不给出具体码本。<\/p>\n<h2>两类熵对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>项<\/th><th>热力学熵<\/th><th>信息熵<\/th><\/tr><\/thead><tbody><tr><td>公式<\/td><td><span class=\"katex-inline\">S=-k\\sum_i p_i\\ln p_i<\/span><\/td><td><span class=\"katex-inline\">H=-\\sum_i p_i\\log_2 p_i<\/span><\/td><\/tr><tr><td>度量对象<\/td><td>微观状态数目<\/td><td>信源平均不确定性<\/td><\/tr><tr><td>常数/底数<\/td><td>玻尔兹曼常数 <span class=\"katex-inline\">k<\/span>，自然对数<\/td><td>以 2 为底，单位比特<\/td><\/tr><tr><td>妖的环节<\/td><td>擦除记忆增 <span class=\"katex-inline\">kT\\ln 2<\/span> 量级<\/td><td>观察选择可逆，擦除不可逆<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>电报与电话对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>项<\/th><th>电报<\/th><th>电话<\/th><\/tr><\/thead><tbody><tr><td>信号形态<\/td><td>离散点划<\/td><td>连续模拟波形<\/td><\/tr><tr><td>中间层<\/td><td>字母表中转<\/td><td>直接映射口语声调轮廓不适用<\/td><\/tr><tr><td>使用门槛<\/td><td>识字、编码、受训按键<\/td><td>开口说话即可<\/td><\/tr><tr><td>网络<\/td><td>中继器分段重发<\/td><td>交换机临时接通，后配号码目录<\/td><\/tr><tr><td>冗余<\/td><td>停顿切分 + 不等长码<\/td><td>采样后纳入离散分析<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>随机性两层判据<\/h2>\n<ul><li>\n<strong>统计层<\/strong>：频率与组合分布均匀，像正规数。\n<\/li><li>\n<strong>算法层<\/strong>：最短程序长度 <span class=\"katex-inline\">K(x)\\approx n<\/span>，不可压缩。\n<\/li><li>\nπ 统计正规但可由短算法生成，不是随机数；伪随机由确定算法产出、可复现，不是真随机。最短程序一般受停机问题限制不可自动求出。\n<\/ul>\n<h2>信息物理成本<\/h2>\n<ul><li>\n可逆翻转一比特：信息守恒，熵不增，不耗散热。\n<\/li><li>\n擦除一比特（不可逆）：增 <span class=\"katex-inline\">kT\\ln 2<\/span> 量级热熵；遗忘需要功。\n<\/li><li>\n信息必须依托物理载体；量子比特可叠加，测量规则改变，但仍受物理定律约束。\n<\/ul>\n<h2>过载与意义<\/h2>\n<ul><li>\n过载条件：存量增速超过索引、筛选与注意力处理能力。\n<\/li><li>\n组织手段：主题分类、字母排序、消歧义页、号码簿、目录索引。\n<\/li><li>\n信息可客观度量传输；意义是经阐释生成的最终产品。讯息量增长不自动带来意义增多。\n<\/ul>"}};
const pages = DATA.rendered;

const SOURCES = {};

const SLUG = manifest.slug || 'book';
const store = {

const ZS_VERSION = '1.9.0';
/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');

}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;

}
function updatePath(){
  const steps = manifest.learningPath||[];
  const passed = steps.filter(s=>(s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))).length;
  const lbl = document.getElementById('path-progress-label');
  if(lbl) lbl.textContent = `${passed}/${steps.length} 步`;
  $$('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

function initQuizzes(rid){

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  if(typeof vis !== 'undefined'){ networkLoaded = true; cb(); return; }
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE) { cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库未加载：离线构建请加 <code>--offline all</code>，或联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;

}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIndex = null;
let pendingHl = [];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP = new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                        '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                        '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw = q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out = [];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length > 2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low = text.toLowerCase();
  let pos = -1, hit = '';
  for(const t of terms){ const i = low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start = Math.max(0, (pos<0?0:pos) - 60);
  const end = Math.min(text.length, (pos<0?0:pos) + 140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms = pendingHl.slice(); pendingHl = [];
  if(!terms.length) return;
  const root = $('#view'); if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first = null, idx = -1, term = '';
  while((node = walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low = node.nodeValue.toLowerCase();
    for(const t of terms){
      const i = low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){
        first = node; idx = i; term = t;
      }
    }
  }
  if(!first) return;
  try{
    const i = first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range = document.createRange();
    range.setStart(first, i); range.setEnd(first, i+term.length);
    const mark = document.createElement('mark');
    mark.className = 'hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'), 1800);
  }catch(e){}
}
document.addEventListener('click', (e)=>{

$('#q').addEventListener('input', e=>{

  if(!terms.length){ showPage(routeIdFromHash()); return; }

  const qGrams = [...new Set(grams)].slice(0,16);
  const snippetTerms = terms.concat(...terms.map(synOf)).slice(0,24);
  const hits = [];
  buildSearchIndex().forEach(p=>{
    const low = p.text.toLowerCase();
    let tHit = 0, sHit = 0, gHit = 0, first = '', viaSyn = '';
    for(const t of terms){
      if(low.includes(t)){ tHit++; if(!first) first = t; continue; }
      for(const s of synOf(t)){
        if(low.includes(s)){ sHit++; if(!viaSyn) viaSyn = s; if(!first) first = s; break; }
      }
    }
    for(const gm of qGrams){ if(low.includes(gm)) gHit++; }
    if(tHit > 0 || sHit > 0 || gHit >= 4){
      hits.push({p, score: tHit*100 + sHit*30 + Math.min(gHit,20), first, viaSyn});
    }
  });
  hits.sort((a,b)=> b.score-a.score || a.p.text.length-b.p.text.length);
  const top = hits.slice(0,20);
  let body;
  if(top.length){
    const gs = {};
    top.forEach(h=>{
      const k = h.p.chap.key;
      (gs[k] = gs[k] || {label:h.p.chap.label, order:h.p.chap.order, ref:!!h.p.chap.ref, hits:[]}).hits.push(h);
    });
    const eff = g => Math.max(...g.hits.map(x=>x.score)) * (g.ref ? 0.55 : 1);
    const order = Object.values(gs).sort((a,b)=> eff(b)-eff(a));
    body = order.map(g=>{
      const inner = g.hits.sort((a,b)=> b.score-a.score).map(h=>
        `<div class="search-hit"><a href="${h.p.href}" data-hl="${esc(h.first)}">${esc(h.p.label)}</a>${h.viaSyn?`<span class="syn-note">同义命中：${esc(h.viaSyn)}</span>`:''}<br><span class="sub">${hlSnippet(h.p.text, snippetTerms)}</span></div>`).join('');
      return `<div class="search-group"><div class="grp-head">${esc(g.label)}<span class="grp-count">${g.hits.length}</span></div>${inner}</div>`;
    }).join('');
  } else {
    body = '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语，或减少关键词。</div>';
  }
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' + body;
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof mermaid === 'undefined') return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  if(typeof mermaid !== 'undefined'){ boot(); return; }
  const urls=['https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js',
              'https://registry.npmmirror.com/mermaid/10.9.1/files/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js'];
  let ui=0, done=false;
  const tryNext=()=>{
    if(done || ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    const timer=setTimeout(()=>{ if(done) return; s.onload=null; s.onerror=null; s.remove(); tryNext(); }, 4000);
    s.onload=()=>{ done=true; clearTimeout(timer); boot(); };
    s.onerror=()=>{ clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

/* ---------- 句级出处：点击角标弹出原句 ---------- */
let citePop = null;
function closeCite(){ if(citePop){ citePop.remove(); citePop = null; } }
function showCite(id){
  const c = (typeof SOURCES !== 'undefined') ? SOURCES[id] : null;
  if(!c) return;
  closeCite();
  citePop = document.createElement('div');
  citePop.className = 'cite-pop';
  citePop.innerHTML = '<div class="cite-head">出处' + (c.page!=='' && c.page!=null ? (' · p.'+esc(String(c.page))) : '') +
    '<button class="cite-x" aria-label="关闭">×</button></div>' +
    (c.quote ? '<blockquote>'+esc(c.quote)+'</blockquote>' : '') +
    (c.zh ? '<div class="cite-zh">'+esc(c.zh)+'</div>' : '');
  document.body.appendChild(citePop);
  citePop.querySelector('.cite-x').onclick = closeCite;
}
document.addEventListener('click', e=>{
  const t = e.target.closest('.cite');
  if(t){ e.preventDefault(); showCite(t.dataset.cite); return; }
  if(citePop && !e.target.closest('.cite-pop')) closeCite();
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeCite(); });
</script>
<script id="zs-visual-init">
(function(){
  try{
    var B=document.body, H=document.documentElement;
    if(!B.dataset.theme && !H.dataset.theme) B.dataset.theme='dark';
    var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
    var scope=document.querySelectorAll('header, .topbar, .topbar-fixed, #topbar, .sidebar, .tabs, .hdr-right, .card-actions, .card-controls, .section-title, .card .icon, .icon-label');
    for(var i=0;i<scope.length;i++){
      var w=document.createTreeWalker(scope[i],NodeFilter.SHOW_TEXT,null,false), n;
      while(n=w.nextNode()){
        if(EMOJI.test(n.nodeValue)){
          n.nodeValue=n.nodeValue.replace(EMOJI,'').replace(/[ \t]+/g,' ').replace(/^ | $/g,'');
        }
      }
    }
    var btn=document.getElementById('theme-btn')||document.getElementById('theme')||document.getElementById('themeToggle');
    function label(){
      if(!btn) return;
      var light=B.dataset.theme==='light'||H.getAttribute('data-theme')==='light'||B.dataset.theme==='';
      if(btn.textContent.trim()===''||/浅色|深色/.test(btn.textContent)) btn.textContent=light?'深色':'浅色';
    }
    label();
    if(btn){
      new MutationObserver(label).observe(B,{attributes:true,attributeFilter:['data-theme']});
      new MutationObserver(label).observe(H,{attributes:true,attributeFilter:['data-theme']});
      btn.addEventListener('click',function(){setTimeout(label,0);},true);
    }
  }catch(e){}
})();
</script>
