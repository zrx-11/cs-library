所有同名函数版本在派生类作用域内被隐藏。隐藏与函数是否为虚函数无关，只看名字是否相同；签名不同也算隐藏。通过派生类对象调用该名字时，只能看到派生类版本，基类版本不参与重载决议。<\/p>\n<p><strong>覆盖（override）<\/strong>：基类函数声明为 <code>virtual<\/code>，派生类提供一个签名匹配的重新定义（协变返回类型除外）。派生类版本替换基类版本进入虚函数表，经基类指针或引用调用时，按实际对象类型选择版本，即动态绑定。<\/p>\n<p><strong>覆盖成立的条件<\/strong>：基类函数是虚函数；派生类函数名相同；参数列表一致；返回类型兼容（协变返回：返回基类指针/派生类指针这类兼容关系允许例外）；派生类函数可加 <code>override<\/code> 关键字让编译器核对签名是否真的覆盖。<\/p>\n<p><strong>隐藏的解除<\/strong>：在派生类类内写 <code>using 基类::函数名;<\/code>，把基类同名重载版本引入派生类作用域，重载决议才能同时看到基类与派生类版本。<\/p>\n<h2>原理推导与机制推演<\/h2>\n<p>先推名字查找顺序。经派生类对象或引用查找名字时，编译器先在派生类作用域找；找到同名声明后停止向外层基类作用域查找。只要派生类有同名函数，基类全部同名版本就被挡在外面，即使参数列表与本次调用不匹配也不回退补位。隐藏按名字发生，不是按签名发生。<\/p>\n<p>再推覆盖的匹配条件。基类函数必须是 <code>virtual<\/code>，否则派生类同名版本只是隐藏，静态绑定到指针/引用的静态类型。签名必须一致：参数类型、const 属性、引用限定符都要对齐；返回类型除协变情形外也要兼容。条件齐备后，派生类版本进入该对象的虚函数表对应槽位，替换基类版本。<\/p>\n<p>看一段只触发隐藏的代码：基类 <code>Base<\/code> 有虚函数 <code>void f(int)<\/code>；派生类 <code>Derived<\/code> 声明 <code>void f(double)<\/code>。名字相同，派生类版本隐藏基类 <code>f(int)<\/code>；签名不同，不构成覆盖。经 <code>Base*<\/code> 指向 <code>Derived<\/code> 对象调用 <code>f(1)<\/code>：动态绑定查虚表，槽位里仍是基类 <code>f(int)<\/code>（派生类 <code>f(double)<\/code> 没进同槽位），调用基类版本；经 <code>Derived<\/code> 对象调用 <code>f(1)<\/code>：作用域只有 <code>f(double)<\/code>，<code>1<\/code> 转成 <code>double<\/code> 后调派生类版本。同一份代码两条路径行为不同，编译期不报错。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：派生类想替换基类某个虚行为时，用覆盖并核对签名；想新增一个同名重载而保留基类版本时，加 <code>using<\/code> 声明把基类版本带进来；用 <code>override<\/code> 标注派生类虚函数，签名写错时编译器当场报错。\n<\/li><li>\n失败案例一：签名写错（参数类型不一致、漏写 const），本意覆盖实际变成隐藏，经基类指针调用仍走基类版本；无 <code>override<\/code> 提示时容易漏检。\n<\/li><li>\n失败案例二：派生类新增同名函数后，基类其他重载版本在派生类对象上全部不可见，需显式 <code>基类::函数名(...)<\/code> 或加 <code>using<\/code> 声明。基类函数不是虚函数时，派生类同名版本不进虚表，经基类指针按静态类型解析。\n<\/li><li>\n边界：隐藏不删除基类函数，基类子对象里的版本仍在；通过基类指针或 <code>基类::<\/code> 限定仍可访问。\n<\/li><li>\n边界：析构函数在继承体系中是特殊虚函数；隐藏规则对它同样适用，基类析构应为虚函数（概念 c07、概念 c04）。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>隐藏 vs 覆盖<\/strong>：隐藏按名字阻断基类版本的可见性，静态决议；覆盖按虚函数签名替换表槽位，动态分派。隐藏不要求 <code>virtual<\/code>，覆盖必须要求。\n<\/li><li>\n<strong>重载 vs 覆盖<\/strong>：重载在同一作用域内同名不同参，编译期选定；覆盖跨基类/派生类，签名一致且虚，运行期选定。\n<\/li><li>\n<strong>派生类对象调用 vs 基类指针调用<\/strong>：隐藏场景下两者解析路径不同——对象走派生类作用域，指针走静态类型加虚表；覆盖场景下两者最终都按实际对象类型分派。\n<\/li><li>\n<strong><code>override<\/code> vs <code>using<\/code><\/strong>：<code>override<\/code> 核对派生类函数是否真的覆盖基类虚函数；<code>using<\/code> 把被隐藏的基类重载版本重新引入派生类作用域。两者解决的是不同方向的问题。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的指针/引用静态类型与实际对象类型区分，是理解动态分派的基础。后继：概念 c07 展开虚函数表结构与查表过程；概念 c08 的 RTTI 在多态体系内提供运行期类型识别；概念 c04 的拷贝与概念 c13 的移动在派生对象切片场景下与继承规则交互。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（继承中的名字隐藏 vs 虚函数覆盖）<\/summary><div class=\"depth-body\"><h1>c06 深度推演：名字查找顺序、覆盖成立条件与两条调用路径对照<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把隐藏与覆盖分开，先往回追四层前提：<\/p>\n<ol><li>\n继承体系中一个对象由基类子对象加派生类成员组成；名字查找沿作用域由内向外进行。\n<\/li><li>\n静态类型是指针/引用声明时的类型，实际类型是对象构造时的类型；动态绑定只在虚函数路径上按实际类型分派。\n<\/li><li>\n函数匹配先看名字是否在当前作用域可见，再在可见候选里按参数列表做重载决议。\n<\/li><li>\n虚函数通过虚函数表槽位分派；同名函数是否进入同一槽位，决定它能不能替换基类版本。\n<\/ol>\n<p>依赖链方向：作用域查找顺序 → 名字可见性（隐藏） → 虚表槽位替换（覆盖） → 指针/引用两条调用路径解析。<\/p>\n<h2>正向推导：一段可编译但行为分叉的代码<\/h2>\n<h3>算例代码<\/h3>\n<pre class=\"lang-cpp\"><code>#include &lt;iostream&gt;\nusing namespace std;\n\nclass Base {\npublic:\n    virtual void f(int n) {\n        cout &lt;&lt; &quot;Base::f(int) n=&quot; &lt;&lt; n &lt;&lt; &#x27;\\n&#x27;;\n    }\n    void g(int n) {\n        cout &lt;&lt; &quot;Base::g(int) n=&quot; &lt;&lt; n &lt;&lt; &#x27;\\n&#x27;;\n    }\n};\n\nclass Derived : public Base {\npublic:\n    void f(double n) override;   // 签名与基类不同：本意存疑\n    void g(int n) {\n        cout &lt;&lt; &quot;Derived::g(int) n=&quot; &lt;&lt; n &lt;&lt; &#x27;\\n&#x27;;\n    }\n};\n\nvoid Derived::f(double n) {\n    cout &lt;&lt; &quot;Derived::f(double) n=&quot; &lt;&lt; n &lt;&lt; &#x27;\\n&#x27;;\n}\n\nint main() {\n    Derived d;\n    Base *p = &amp;d;\n\n    p-&gt;f(1);    // 路径 A\n    d.f(1);     // 路径 B\n    p-&gt;g(2);    // 路径 C\n    d.g(2);     // 路径 D\n    return 0;\n}<\/code><\/pre>\n<h3>编译期做什么<\/h3>\n<p>第一步，检查 <code>Derived::f(double)<\/code> 的 <code>override<\/code> 标注：基类 <code>f(int)<\/code> 参数是 <code>int<\/code>，派生类参数是 <code>double<\/code>，签名不一致，没有可覆盖的基类虚函数；带 <code>override<\/code> 时编译器直接报错。去掉 <code>override<\/code> 后编译通过，此时发生的是隐藏而非覆盖。<\/p>\n<p>第二步，检查 <code>g<\/code>：基类 <code>g<\/code> 不是虚函数；派生类 <code>g(int)<\/code> 同名隐藏，不进虚表。<\/p>\n<p>第三步，四条调用路径分别记录候选：路径 A 静态类型 <code>Base<em><\/code>，候选来自 <code>Base<\/code>；路径 B 静态类型 <code>Derived<\/code>，候选先在 <code>Derived<\/code> 作用域找；路径 C 静态类型 <code>Base<\/em><\/code>，非虚函数按静态类型解析；路径 D 静态类型 <code>Derived<\/code>。<\/p>\n<h3>运行期与行为推演<\/h3>\n<p>路径 A：<code>p-&gt;f(1)<\/code>。<code>p<\/code> 静态类型 <code>Base*<\/code>，<code>f<\/code> 是虚函数，按实际对象 <code>Derived<\/code> 的虚表查槽位。派生类 <code>f(double)<\/code> 签名不同，没有替换 <code>f(int)<\/code> 的槽位；槽位仍是基类 <code>Base::f(int)<\/code>。调用基类版本，输出 <code>Base::f(int) n=1<\/code>。<\/p>\n<p>路径 B：<code>d.f(1)<\/code>。<code>d<\/code> 是 <code>Derived<\/code> 对象，名字查找先在 <code>Derived<\/code> 作用域找到 <code>f(double)<\/code>，基类 <code>f(int)<\/code> 被隐藏不可见；实参 <code>1<\/code> 转成 <code>double<\/code>，调用派生类版本，输出 <code>Derived::f(double) n=1<\/code>。<\/p>\n<p>路径 C：<code>p-&gt;g(2)<\/code>。<code>g<\/code> 非虚，静态绑定到 <code>Base<\/code>，输出 <code>Base::g(int) n=2<\/code>，即使实际对象是 <code>Derived<\/code> 也不派生类版本。<\/p>\n<p>路径 D：<code>d.g(2)<\/code>。派生类作用域直接匹配 <code>Derived::g(int)<\/code>，输出 <code>Derived::g(int) n=2<\/code>。<\/p>\n<p>四条路径中，路径 A 与路径 B 操作同一个对象，输出却分属两个版本；这就是“编译通过、多态预期落空”的典型形态。<\/p>\n<h2>具体算例：签名对齐后构成覆盖<\/h2>\n<pre class=\"lang-cpp\"><code>class Derived2 : public Base {\npublic:\n    void f(int n) override {\n        cout &lt;&lt; &quot;Derived2::f(int) n=&quot; &lt;&lt; n &lt;&lt; &#x27;\\n&#x27;;\n    }\n};\n\nint main() {\n    Derived2 d2;\n    Base *q = &amp;d2;\n    q-&gt;f(7);   // 路径 E\n    d2.f(7);   // 路径 F\n    return 0;\n}<\/code><\/pre>\n<p>推演：<code>Derived2::f(int)<\/code> 签名与基类一致，<code>override<\/code> 核对通过；派生类版本替换虚表对应槽位。路径 E 经 <code>Base*<\/code> 查虚表，落到 <code>Derived2::f(int)<\/code>；路径 F 经对象直接调用，也是派生类版本。两条路径输出一致：<code>Derived2::f(int) n=7<\/code>。覆盖场景下静态类型不再决定调用版本，实际对象类型决定分派结果。<\/p>\n<h2>第二算例：<code>using<\/code> 声明解除隐藏，恢复重载决议<\/h2>\n<pre class=\"lang-cpp\"><code>class Base2 {\npublic:\n    void show(int n)   { cout &lt;&lt; &quot;int &quot; &lt;&lt; n &lt;&lt; &#x27;\\n&#x27;; }\n    void show(double x){ cout &lt;&lt; &quot;double &quot; &lt;&lt; x &lt;&lt; &#x27;\\n&#x27;; }\n};\n\nclass Derived3 : public Base2 {\npublic:\n    using Base2::show;          // 把基类两个重载版本引入派生类作用域\n    void show(const char *s)    { cout &lt;&lt; &quot;string &quot; &lt;&lt; s &lt;&lt; &#x27;\\n&#x27;; }\n};\n\nint main() {\n    Derived3 d3;\n    d3.show(1);     // 路径 G\n    d3.show(2.5);   // 路径 H\n    d3.show(&quot;hi&quot;);  // 路径 I\n    return 0;\n}<\/code><\/pre>\n<p>推演：没有 <code>using<\/code> 时，<code>Derived3::show(const char<em>)<\/code> 隐藏基类两个 <code>show<\/code>，路径 G 的 <code>1<\/code> 会被转成 <code>const char<\/em><\/code> 失败或勉强匹配，基类 <code>show(int)<\/code> 不可见。加 <code>using Base2::show;<\/code> 后，基类两个重载进入派生类作用域，三个版本共同参与重载决议：<code>1<\/code> 匹配 <code>show(int)<\/code>，<code>2.5<\/code> 匹配 <code>show(double)<\/code>，<code>&quot;hi&quot;<\/code> 匹配 <code>show(const char*)<\/code>。路径 G 输出 <code>int 1<\/code>，路径 H 输出 <code>double 2.5<\/code>，路径 I 输出 <code>string hi<\/code>。<\/p>\n<h2>对抗性追问：去掉基类的 virtual 会怎样<\/h2>\n<p>把 <code>Base::f(int)<\/code> 前的 <code>virtual<\/code> 去掉，派生类即使签名一致，<code>f<\/code> 也只是隐藏：虚表不存在，经 <code>Base*<\/code> 调用按静态类型解析到 <code>Base::f(int)<\/code>，实际对象是派生类也不切换。多态要求基类入口先声明虚，派生类替换才有挂载点；去掉 <code>virtual<\/code>，整条动态分派链断开。<\/p>\n<p>再追问：返回类型不一致是否影响覆盖。参数签名一致但返回类型不同（基类返回 <code>void<em><\/code>，派生类返回 <code>int<\/em><\/code>）属于协变返回兼容范围，允许覆盖；返回完全无关类型则编译报错。除协变这一例外，覆盖要求返回类型兼容。<\/p>\n<h2>延伸推演：名字隐藏的查找规则细化<\/h2>\n<p>名字查找是作用域规则，先定可见候选，再做参数匹配。派生类作用域一旦出现同名声明，查找就在此停止，不会把基类同名版本拉进候选集；这解释了为什么“基类有更匹配的重载”也不会被选中。解除途径只有两条：类内 <code>using<\/code> 声明引入基类版本，或调用处显式写 <code>Base::f(...)<\/code> 限定到基类作用域。<\/p>\n<h2>延伸推演：隐藏与析构函数的交互<\/h2>\n<p>基类析构函数若未声明为虚，派生类析构函数名字（<code>~Derived<\/code>）与基类析构（<code>~Base<\/code>）按名字规则不构成同名覆盖；经基类指针 <code>delete<\/code> 时只调基类析构，派生类成员资源不释放（见概念 c07）。继承体系中的析构必须从基类起声明为虚，让析构链进入虚表分派。<\/p>\n<h2>延伸推演：隐藏后重载决议的候选范围<\/h2>\n<p>派生类作用域找到同名声明后查找停止，基类同名版本不进入候选集；即使派生类版本参数与实参不匹配，也不会回退到基类版本补位，编译期报无匹配函数。解除途径两条：类内 <code>using 基类::名字;<\/code> 把基类重载引入派生类作用域，候选集合并；调用处写 <code>基类::函数名(...)<\/code> 限定到基类作用域。读继承代码时，先确认派生类有没有同名声明，再判断基类版本是否可见。<\/p>\n<h2>延伸推演：协变返回与覆盖签名细节<\/h2>\n<p>覆盖要求参数列表一致；返回类型除协变情形外也要兼容。协变指基类返回基类指针/引用、派生类返回派生类指针/引用，二者指向类型存在派生关系。const 属性、引用限定符不一致也会使签名不同，构成隐藏而非覆盖。<code>override<\/code> 标注让编译器在签名写错时报错，是继承体系中防止“以为覆盖实际隐藏”的主要手段。<\/p>\n<h2>延伸推演：重载、隐藏、覆盖三者的判定顺序<\/h2>\n<p>判定一个同名函数走哪条路径，分三步：先看是否同一作用域——同一作用域同名不同参是重载；跨基类/派生类再看基类是否为虚——非虚即隐藏；为虚且签名一致才是覆盖。三步混在一起看容易把重载当覆盖，或把隐藏当多态；按作用域、虚属性、签名依次核对。<\/p>\n<h2>对抗性追问再补：派生类重载集合被隐藏后的调用报错形态<\/h2>\n<p>基类有 <code>f(int)<\/code>、<code>f(double)<\/code> 两个重载，派生类只写 <code>f(string)<\/code>。经派生类对象调用 <code>f(1)<\/code>，候选只剩 <code>f(string)<\/code>，<code>int<\/code> 到 <code>string<\/code> 无匹配转换，编译报错；读者以为基类 <code>f(int)<\/code> 应当接住，实际已被隐藏。加 <code>using Base::f;<\/code> 后三个重载共同参与决议，<code>1<\/code> 匹配 <code>f(int)<\/code>。<\/p>\n<h2>延伸推演：const 限定符不一致如何造成伪覆盖<\/h2>\n<p>基类 <code>virtual void f() const;<\/code>，派生类写成 <code>void f();<\/code>（漏 const）。参数列表看似相同，但 const 属性不同，两者不构成覆盖；派生类版本在派生类作用域隐藏基类 const 版本，也未进入基类虚表同槽位。经基类 const 引用调用仍落基类版本；加 <code>override<\/code> 后编译器核对签名不符直接报错。补上 const 后签名一致，派生类版本替换槽位，动态分派到派生类实现。运行期两条路径对象地址相同，差别只在虚表槽位填的是谁的地址。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n名字隐藏由哪条规则触发？隐藏是否要求基类函数是虚函数？\n<\/li><li>\n覆盖成立需要同时满足哪几个条件？<code>override<\/code> 关键字起什么核对作用？\n<\/li><li>\n一段签名不同的同名函数，经基类指针与经派生类对象调用，为什么会落到不同版本？\n<\/li><li>\n<code>using 基类::函数名;<\/code> 解决的是隐藏问题还是覆盖问题？\n<\/li><li>\n基类函数去掉 <code>virtual<\/code> 后，派生类同名版本还能不能参与动态分派？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "继承中的名字隐藏 vs 虚函数覆盖"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C++ Primer Plus：中文版（第六版） (Stephen Prata) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.522<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">继承中的名字隐藏 vs 虚函数覆盖<\/a><\/span><\/div><h1>虚函数表与动态绑定机制<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3 章（原书第 13 章类继承，13.4.2 虚成员函数和动态联编、13.4.3 有关虚函数注意事项，虚函数表 vtbl 工作原理，PDF 第 522 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>基类指针可指向派生类对象，调用同名函数时程序要决定执行哪个版本。非虚函数编译期按指针静态类型选定；虚函数运行期按对象实际类型选定，这个延迟分派就是动态绑定。要弄清它靠什么数据结构落地、调用时多走哪几步内存访问、对象布局多出什么分量，需拆开虚函数表（虚表）与虚指针（vptr）。本概念回答：多态对象布局里多了什么；每个类虚表存哪些槽位；构造析构中 vptr 怎样被设置；一次虚调用经过哪几级间接访问；什么情况动态绑定退化成静态绑定。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>虚函数（virtual function）<\/strong>：基类用 <code>virtual<\/code> 声明的成员函数，派生类可覆盖其版本；经基类指针或引用调用时，按对象实际类型分派。<\/p>\n<p><strong>虚函数表（vtbl）<\/strong>：每个声明了虚函数（或继承了虚函数）的类，编译器生成一张静态表，表项是各虚函数的地址。派生类覆盖了某个虚函数，对应槽位填入派生类版本地址；未覆盖的槽位保留基类版本地址。<\/p>\n<p><strong>虚指针（vptr）<\/strong>：多态对象头部隐式存放的一个指针，指向本类的虚表。对象构造时 vptr 被设置为当前类的表地址；派生类对象构造完成后，vptr 指向派生类表。<\/p>\n<p><strong>动态绑定（动态联编）<\/strong>：函数调用目标在运行期按对象实际类型解析；调用时经 vptr 找到虚表，再按槽位取函数地址。<\/p>\n<p><strong>静态绑定（静态联编）<\/strong>：函数调用目标在编译期按表达式静态类型确定；非虚成员函数、普通函数调用走这条路径。<\/p>\n<p><strong>对象切片（slicing）<\/strong>：派生类对象按值赋给基类对象时，派生类部分被切掉，留下基类子对象；切片后的对象不再是派生类型，虚表指向基类表。<\/p>\n<h2>原理推导与机制推演<\/h2>\n<p>先推对象布局。一个没有虚函数的类对象，存储内容就是各成员字段。含虚函数的类，编译器在对象头部插入 vptr 位置；这个位置由编译器安排，源码不可见。同一类的所有对象共享同一张虚表，vptr 各自指向这张共享表。<\/p>\n<p>再推虚表槽位的形成。基类声明三个虚函数，基类表有三个槽位，依次存三个基类版本地址。派生类继承基类表布局：覆盖了的函数，槽位换填派生类版本地址；没覆盖的槽位仍指基类版本。槽位顺序在基类确定，派生类按同一顺序对齐，新增的虚函数排在表尾。<\/p>\n<p>推构造阶段的 vptr 设置。构造基类子对象时，vptr 先指向基类虚表；进入派生类构造阶段后，vptr 改指派生类虚表。这解释了为什么构造函数内部调用虚函数不会分派到派生类版本——那一刻 vptr 还停在基类表。析构阶段相反：先执行派生类析构，vptr 切回派生类表；析构体退出后进入基类析构，vptr 再切回基类表。<\/p>\n<p>推一次虚调用的执行路径。<code>Base *p = &amp;derived; p-&gt;show();<\/code>：编译器生成的代码先取 <code>p<\/code> 指向对象的 vptr；vptr 给出虚表地址；按 <code>show<\/code> 对应的槽位偏移取出函数地址；跳转执行。比非虚调用多一次内存间接访问，分派目标在运行期才确定。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：需要经基类接口处理一族派生类对象、不同派生类行为不同时，基类入口声明虚函数；派生类覆盖后经指针/引用调用；基类析构函数声明为虚函数，保证 <code>delete<\/code> 经基类指针时析构链完整。\n<\/li><li>\n失败案例一：基类析构不是虚函数，经 <code>Base*<\/code> 删除 <code>Derived<\/code> 对象只调基类析构，派生类成员资源不释放。\n<\/li><li>\n失败案例二：按值传递或按值赋值派生类对象发生切片，对象退化为基类子对象，vptr 指向基类表，派生类行为丢失。\n<\/li><li>\n失败案例三：构造函数内调用虚函数，此时 vptr 尚未切到派生类表，调用落在基类版本。\n<\/li><li>\n边界：虚函数调用需经指针或引用触达；直接用对象名调用不发生跨类型分派。虚表排布与 vptr 位置由编译器决定，主流实现采用“对象头 vptr + 类共享表”结构。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>动态绑定 vs 静态绑定<\/strong>：静态绑定编译期按静态类型定目标；动态绑定运行期按实际类型经虚表定目标。判据是函数是否为虚、调用是否经指针/引用。\n<\/li><li>\n<strong>虚表 vs vptr<\/strong>：虚表是类级共享的函数地址表；vptr 是每个对象内指向本表的指针。一张表对应类，一个 vptr 对应对象。\n<\/li><li>\n<strong>覆盖 vs 隐藏<\/strong>：覆盖替换虚表槽位进入动态分派；隐藏只在派生类作用域挡名字，不碰虚表（见概念 c06）。\n<\/li><li>\n<strong>虚函数 vs 普通成员函数<\/strong>：虚函数有槽位、参与运行期分派；普通成员函数地址编译期固定，按静态类型调用。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c06 的覆盖条件决定哪些派生类版本进入虚表槽位；概念 c01 的静态类型与实际类型区分是分派基础。后继：概念 c08 RTTI 补充运行期类型识别；概念 c09 异常在析构与栈展开中回收资源；概念 c12 智能指针管理多态对象所有权。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（虚函数表与动态绑定机制）<\/summary><div class=\"depth-body\"><h1>c07 深度推演：对象布局、虚表槽位填充与一次虚调用的多级间接访问<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把动态绑定讲透，先往回追四层前提：<\/p>\n<ol><li>\n基类指针/引用可以绑定派生类对象，静态类型与实际类型分离；调用按哪个类型解析，决定行为走向。\n<\/li><li>\n非虚函数目标在编译期已知，编译器直接生成调用地址；要在运行期按实际类型切换目标，必须有一张运行期可查的地址表。\n<\/li><li>\n同一类的所有对象行为版本相同，函数地址表可以类级共享；每个对象只需一个指针找到这张表。\n<\/li><li>\n对象构造分基类子对象、派生类成员两段完成；vptr 必须随构造阶段切换到对应类的表，析构阶段逆序切回。\n<\/ol>\n<p>依赖链方向：静态/实际类型分离 → 运行期地址表需求 → vptr + 共享虚表布局 → 构造析构期 vptr 切换 → 虚调用多级间接寻址。<\/p>\n<h2>正向推导：逐行还原一个多态体系的内存与调用<\/h2>\n<h3>算例代码<\/h3>\n<pre class=\"lang-cpp\"><code>#include &lt;iostream&gt;\nusing namespace std;\n\nclass Animal {\npublic:\n    virtual void speak() const { cout &lt;&lt; &quot;Animal::speak\\n&quot;; }\n    virtual void move()  const { cout &lt;&lt; &quot;Animal::move\\n&quot;; }\n    virtual ~Animal() { cout &lt;&lt; &quot;~Animal\\n&quot;; }\n};\n\nclass Dog : public Animal {\npublic:\n    void speak() const override { cout &lt;&lt; &quot;Dog::speak\\n&quot;; }\n    ~Dog() override { cout &lt;&lt; &quot;~Dog\\n&quot;; }\n};\n\nclass Cat : public Animal {\npublic:\n    void speak() const override { cout &lt;&lt; &quot;Cat::speak\\n&quot;; }\n    void move()  const override { cout &lt;&lt; &quot;Cat::move\\n&quot;; }\n    ~Cat() override { cout &lt;&lt; &quot;~Cat\\n&quot;; }\n};\n\nvoid use(const Animal *a) {\n    a-&gt;speak();\n    a-&gt;move();\n}\n\nint main() {\n    Dog dog;\n    Cat cat;\n    use(&amp;dog);\n    use(&amp;cat);\n    return 0;\n}<\/code><\/pre>\n<h3>编译期做什么<\/h3>\n<p>第一步，编译器识别 <code>Animal<\/code> 含虚函数，为它生成虚表，表槽位顺序按声明排列：槽 0 <code>speak<\/code>，槽 1 <code>move<\/code>，槽 2 析构函数。<\/p>\n<p>第二步，<code>Dog<\/code> 覆盖 <code>speak<\/code> 与析构：槽 0 填 <code>Dog::speak<\/code>，槽 1 保留 <code>Animal::move<\/code>，槽 2 填 <code>~Dog<\/code>。<code>Cat<\/code> 覆盖 <code>speak<\/code>、<code>move<\/code> 与析构：槽 0 <code>Cat::speak<\/code>，槽 1 <code>Cat::move<\/code>，槽 2 <code>~Cat<\/code>。<\/p>\n<p>第三步，每个多态对象头部预留 vptr 位置；<code>use<\/code> 中 <code>a-&gt;speak()<\/code> 不直接写死函数地址，生成“取 vptr → 查表槽 0 → 跳转”的代码序列。<\/p>\n<h3>虚表结构（示意，槽位顺序由编译器确定）<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>槽位<\/th><th>Animal 表<\/th><th>Dog 表<\/th><th>Cat 表<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td><code>Animal::speak<\/code><\/td><td><code>Dog::speak<\/code><\/td><td><code>Cat::speak<\/code><\/td><\/tr><tr><td>1<\/td><td><code>Animal::move<\/code><\/td><td><code>Animal::move<\/code><\/td><td><code>Cat::move<\/code><\/td><\/tr><tr><td>2<\/td><td><code>~Animal<\/code><\/td><td><code>~Dog<\/code><\/td><td><code>~Cat<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>运行期与内存怎么变<\/h3>\n<p>构造 <code>dog<\/code>：先构造 <code>Animal<\/code> 子对象，vptr 指向 Animal 表；<code>Dog<\/code> 构造阶段把 vptr 改指 Dog 表。构造 <code>cat<\/code> 时走同一过程，vptr 最终指 Cat 表。<\/p>\n<p><code>use(&amp;dog)<\/code>：<code>a<\/code> 静态类型 <code>const Animal*<\/code>，实际指向 <code>dog<\/code>。<code>a-&gt;speak()<\/code>：取 <code>dog<\/code> 的 vptr → Dog 表 → 槽 0 地址 → <code>Dog::speak<\/code>，输出 <code>Dog::speak<\/code>。<code>a-&gt;move()<\/code>：Dog 表槽 1 仍指基类版本，输出 <code>Animal::move<\/code>。<\/p>\n<p><code>use(&amp;cat)<\/code>：vptr 指向 Cat 表。<code>speak<\/code> 槽 0 为 <code>Cat::speak<\/code>，<code>move<\/code> 槽 1 为 <code>Cat::move<\/code>，分别输出 <code>Cat::speak<\/code>、<code>Cat::move<\/code>。<\/p>\n<p><code>main<\/code> 返回，对象逆序析构：先 <code>cat<\/code>，<code>~Cat<\/code> 输出 <code>~Cat<\/code>，再进入基类析构输出 <code>~Animal<\/code>；后 <code>dog<\/code> 输出 <code>~Dog<\/code>、<code>~Animal<\/code>。析构函数为虚，经对象析构链完整展开。<\/p>\n<h2>具体算例：构造函数内调用虚函数落在哪张表<\/h2>\n<pre class=\"lang-cpp\"><code>class BaseV {\npublic:\n    BaseV() { who(); }            // 构造函数内调用虚函数\n    virtual void who() const { cout &lt;&lt; &quot;BaseV\\n&quot;; }\n};\n\nclass DerivedV : public BaseV {\npublic:\n    void who() const override { cout &lt;&lt; &quot;DerivedV\\n&quot;; }\n};\n\nint main() { DerivedV d; }<\/code><\/pre>\n<p>推演：构造 <code>DerivedV<\/code> 先构造 <code>BaseV<\/code> 子对象，此刻 vptr 指向 BaseV 表；<code>BaseV()<\/code> 内 <code>who()<\/code> 按当前 vptr 查表，落到 <code>BaseV::who<\/code>，输出 <code>BaseV<\/code>。派生类构造体还没执行，派生类成员尚未就位，分派到派生类版本反而会访问未初始化状态。构造完成后 vptr 才切到 DerivedV 表。这就是构造函数内虚调用不分派到派生类版本的原因。<\/p>\n<h2>第二算例：对象切片丢掉派生类部分<\/h2>\n<pre class=\"lang-cpp\"><code>int main() {\n    Cat cat;\n    Animal copied = cat;   // 按值拷贝，切片\n    copied.speak();\n    return 0;\n}<\/code><\/pre>\n<p>推演：<code>copied<\/code> 是独立的 <code>Animal<\/code> 对象，初始化时只复制 <code>cat<\/code> 的基类子对象部分，派生类成员被切掉；<code>copied<\/code> 的 vptr 指向 Animal 表。<code>copied.speak()<\/code> 即使是虚调用，目标对象本身已是基类类型，输出 <code>Animal::speak<\/code>。切片发生在按值传递、按值返回、按值赋值场景；保留多态要经指针或引用触达对象。<\/p>\n<h2>对抗性追问：基类析构去掉 virtual 会怎样<\/h2>\n<p>去掉 <code>virtual<\/code> 后析构不进虚表。经 <code>Animal*<\/code> 指向 <code>Dog<\/code> 对象执行 <code>delete<\/code>：静态绑定解析到 <code>~Animal<\/code>，<code>~Dog<\/code> 不被调用，<code>Dog<\/code> 新增成员资源不释放；基类子对象随后析构。堆上派生对象残留派生类资源泄漏。修正方式是基类析构声明为虚函数，派生类析构自动进入槽位分派。<\/p>\n<p>再追问：虚调用比普通调用多做哪些工作。非虚成员调用编译期已知函数地址，直接跳转；虚调用先从对象取 vptr（一次内存读），再按槽位偏移从表中取函数地址（第二次内存读），然后跳转。两次间接访问带来少量额外开销；虚表本身在程序静态区，不随对象复制。<\/p>\n<h2>延伸推演：多重继承下的 vptr 与表<\/h2>\n<p>单继承体系中对象头部一个 vptr。多重继承下对象含多个基类子对象，每个带虚函数的基类子对象各有自己的 vptr；最右基类等位置的调整在指针转换时完成。槽位顺序按各基类表分别对齐，派生类版本填入对应子对象的表中。本书第 14 章涉及多重继承（PDF 第 585 页附近），其虚表布局是单继承结构的扩展。<\/p>\n<h2>延伸推演：纯虚函数与抽象类<\/h2>\n<p>在虚函数声明末尾写 <code>= 0<\/code> 得到纯虚函数，对应槽位不填可调用版本（或标记为纯虚）；含纯虚函数的类是抽象类，不能实例化对象，只能经其指针/引用使用派生类。派生类必须覆盖全部纯虚函数才能实例化，否则仍是抽象类。纯虚函数定义了接口契约，基类表作为接口分派的锚点。<\/p>\n<h2>延伸推演：虚函数的开销与对象布局代价<\/h2>\n<p>含虚函数的类对象多出一个 vptr 位置，64 位平台占 8 字节；同一类所有对象共享一张虚表，表本身不随对象复制。虚调用比普通调用多两次内存读：取 vptr、按槽位取函数地址。这一开销在现代处理器上通常可接受；对极致紧凑的小对象或频繁内层循环，是否引入虚函数要权衡。无虚函数的类对象布局只含成员字段，没有 vptr。<\/p>\n<h2>延伸推演：空基类与无虚类的布局对照<\/h2>\n<p>既无成员又无虚函数的空基类，在派生类布局中可能被优化为空基类偏移；含虚函数但无数据成员的类，对象至少含一个 vptr。判断对象尺寸先数成员字段，再确认是否多态加 vptr。虚表槽位顺序在基类确定，派生类新增虚函数排在表尾，不打乱已有槽位偏移，保证基类指针按旧偏移查槽位仍成立。<\/p>\n<h2>延伸推演：虚析构链的槽位位置<\/h2>\n<p>析构函数作为虚函数进入虚表槽位；派生类析构覆盖该槽位。经基类指针 <code>delete<\/code> 时，动态分派先调派生类析构，派生类析构执行完自动进入基类析构，形成完整链。基类析构非虚时，槽位不存在，静态绑定只调基类析构，派生类部分不展开（概念 c06、c09）。<\/p>\n<h2>对抗性追问再补：构造函数为什么不能是虚函数<\/h2>\n<p>虚分派依赖对象 vptr 指向的虚表；构造对象时 vptr 还在切换过程中，构造函数执行阶段对象尚未定型。构造函数不能声明为虚，构造期内的虚调用按当前类表解析。需要在构造后按类型分派，应把动作放到构造完成后的普通虚函数调用。<\/p>\n<h2>延伸推演：引用形式的虚调用与指针形式走同一查表路径<\/h2>\n<p>经基类引用 <code>Base &amp;r = derived; r.show();<\/code> 调用，引用在底层绑定到对象地址，编译器生成的代码与指针形式一致：先取对象头 vptr，再按槽位偏移取函数地址跳转。引用本身不空，因此不存在判空问题；只要被引用对象是多态类型，分派仍按其实际类型进行。两种形式的差别只在语法层：引用使用时不写 <code>&amp;<\/code>/<code>*<\/code>，机器码层面查表步骤相同。把对象按值传给基类形参会发生切片（见第二算例），切片后 vptr 已指向基类表，引用与指针都无法再恢复派生类型。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n多态对象比普通对象多出哪个隐式成员？虚表是类级共享还是对象级私有？\n<\/li><li>\n派生类覆盖与未覆盖的虚函数，在虚表槽位中分别填什么地址？\n<\/li><li>\n一次 <code>p-&gt;func()<\/code> 虚调用经过哪几级内存访问？\n<\/li><li>\n构造函数内调用虚函数为什么不会分派到派生类版本？\n<\/li><li>\n对象切片发生在什么传值场景？切片后 vptr 指向哪张表？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "虚函数表与动态绑定机制"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C++ Primer Plus：中文版（第六版） (Stephen Prata) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.660<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">虚函数表与动态绑定机制<\/a><\/span><\/div><h1>RTTI 与 dynamic_cast 的边界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章（原书第 15 章友元、异常和其他，15.4 节运行阶段类型识别 RTTI，PDF 第 660 页起；第 13 章类继承）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>经基类指针或引用处理派生类对象时，接口只暴露基类接口；某些场景需要知道实际派生类型，才能调用派生类特有功能。编译期无法从静态类型推出实际类型，运行期需要一套机制查询对象类型，并在基类与派生类指针/引用间做带检查的转换，这套机制即 RTTI（运行阶段类型识别），核心工具是 <code>typeid<\/code> 与 <code>dynamic_cast<\/code>。本概念回答：两者各回答什么问题；<code>dynamic_cast<\/code> 需什么类型条件；失败时指针与引用分别给出什么结果；与 <code>static_cast<\/code> 检查责任有何差别。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>RTTI<\/strong>：运行阶段识别对象实际类型的机制，查询多态对象的动态类型，而不是只看表达式的静态类型。<\/p>\n<p><strong><code>typeid<\/code> 运算符<\/strong>：接收表达式或类型名，返回 <code>type_info<\/code> 对象引用；对多态表达式返回实际类型信息，对非多态类型返回静态类型信息；可比较两个 <code>type_info<\/code> 是否相同。<\/p>\n<p><strong><code>dynamic_cast<\/code><\/strong>：带运行期检查的向下转换，写法 <code>dynamic_cast&lt;派生类型*&gt;(基类指针)<\/code>、<code>dynamic_cast&lt;派生类型&amp;&gt;(基类引用)<\/code>。兼容则给出派生类指针/引用，不兼容按指针/引用分别处理失败。<\/p>\n<p><strong>转换失败行为<\/strong>：指针形式返回空指针 <code>nullptr<\/code>；引用形式抛出 <code>std::bad_cast<\/code>。引用没有空状态，只能用异常报告失败。<\/p>\n<p><strong>多态前提<\/strong>：下行转换要求基类是多态类型（含虚函数）；运行期判断依赖虚表关联的类型信息，非多态类型无此信息，下行转换编译报错。<\/p>\n<p><strong>交叉转换<\/strong>：同一基类的两个派生类之间、沿继承体系侧面的转换，<code>dynamic_cast<\/code> 运行期检查兼容关系；<code>static_cast<\/code> 不做这类检查。<\/p>\n<h2>原理推导与机制推演<\/h2>\n<p>先推类型信息从哪来。多态类的虚表旁伴随一份类型信息记录，对象经 vptr 找到虚表即可链到记录。<code>typeid<\/code> 对多态表达式读这份运行期记录；非多态类型没有虚表，类型编译期已知，返回静态类型。<\/p>\n<p>再推 <code>dynamic_cast<\/code> 检查路径。基类指针指向对象、目标是派生类指针时，运行期读取实际类型，沿继承体系检查是否兼容；兼容则调整指针偏移返回派生类指针，不兼容则指针返回空、引用抛异常。检查依赖虚表关联的类型信息，这就是基类必须含虚函数的原因。<\/p>\n<p>推与 <code>static_cast<\/code> 的分工。<code>static_cast&lt;Derived*&gt;(basePtr)<\/code> 编译期完成下行转换，不查实际类型；对象类型不符时使用属未定义行为。<code>dynamic_cast<\/code> 把检查推迟到运行期，付一次类型查询开销，换来失败可识别。上行转换天然安全，通常直接隐式完成。<\/p>\n<p>推不该用 RTTI 的场景。一族派生类都需要的动作，应在基类声明虚函数、派生类覆盖，经虚表分派；逐个 <code>dynamic_cast<\/code> 到具体类再调特有函数，等于把多态分支手写在调用点，新增派生类要回所有分支补判断。RTTI 只留给接口无法用虚函数统一表达的场景。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：经基类指针/引用传入，需确认实际派生类型后调用特有功能；下行转换需运行期检查；用 <code>typeid<\/code> 比较实际类型。\n<\/li><li>\n失败案例一：对非多态类做下行转换，基类无虚函数，编译期报错。\n<\/li><li>\n失败案例二：指针形式转换失败后未判空就解引用，踩到空地址。\n<\/li><li>\n失败案例三：<code>static_cast<\/code> 下行到错误派生类，编译通过，运行期访问错位成员。\n<\/li><li>\n失败案例四：用一串 <code>typeid<\/code> 分支替代虚函数，派生类扩充后分支遗漏。<code>dynamic_cast<\/code> 不能去掉 <code>const<\/code>，去常量性需 <code>const_cast<\/code>。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong><code>typeid<\/code> vs <code>dynamic_cast<\/code><\/strong>：前者回答“实际是哪个类型”，返回类型信息；后者回答“能否安全当目标类型用”，返回转换后指针/引用或失败。\n<\/li><li>\n<strong><code>dynamic_cast<\/code> vs <code>static_cast<\/code><\/strong>：前者运行期检查、失败可识别；后者编译期转换、不查实际类型。下行优先前者，上行两者均可。\n<\/li><li>\n<strong>指针失败 vs 引用失败<\/strong>：指针返回空可判空；引用抛 <code>bad_cast<\/code>，调用处需捕获或保证必然成立。\n<\/li><li>\n<strong>RTTI 分支 vs 虚函数多态<\/strong>：虚函数把行为分发到派生类内部，新增类不改调用点；RTTI 分支判断集中在调用点，新增类要补分支。优先虚函数。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c07 的虚表与 vptr 是类型信息附着点；概念 c06 的覆盖条件决定虚表槽位。后继：概念 c09 异常体系承接 <code>bad_cast<\/code>；概念 c12 智能指针在多态对象上经基类指针管理所有权。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（RTTI 与 dynamic_cast 的边界）<\/summary><div class=\"depth-body\"><h1>c08 深度推演：类型信息附着点、转换检查路径与三类 cast 的分工<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把 RTTI 讲透，先往回追四层前提：<\/p>\n<ol><li>\n基类指针/引用绑定派生类对象后，静态类型是基类，实际类型是派生类；编译期只能看见静态类型。\n<\/li><li>\n多态对象的虚表旁挂有类型信息记录；没有虚函数的类型在运行期不携带这份记录。\n<\/li><li>\n向下回到派生类接口存在安全前提：对象实际类型必须兼容目标类型；这个前提编译期无法验证，只能运行期查。\n<\/li><li>\n转换失败需要可识别的出口：指针可以为空，引用不能为空，两类出口对应不同失败处理方式。\n<\/ol>\n<p>依赖链方向：静态/实际类型分离 → 虚表关联类型信息 → 运行期兼容性检查 → 指针/引用两条失败路径 → 与 static_cast 的检查责任分界。<\/p>\n<h2>正向推导：逐行还原一次 RTTI 查询与下行转换<\/h2>\n<h3>算例代码<\/h3>\n<pre class=\"lang-cpp\"><code>#include &lt;iostream&gt;\n#include &lt;typeinfo&gt;\nusing namespace std;\n\nclass Shape {\npublic:\n    virtual ~Shape() = default;\n    virtual void draw() const { cout &lt;&lt; &quot;Shape::draw\\n&quot;; }\n};\n\nclass Circle : public Shape {\npublic:\n    void draw() const override { cout &lt;&lt; &quot;Circle::draw\\n&quot;; }\n    void radius() const { cout &lt;&lt; &quot;Circle::radius\\n&quot;; }\n};\n\nclass Square : public Shape {\npublic:\n    void draw() const override { cout &lt;&lt; &quot;Square::draw\\n&quot;; }\n};\n\nvoid inspect(const Shape *s) {\n    cout &lt;&lt; typeid(*s).name() &lt;&lt; &#x27;\\n&#x27;;          // 实际类型\n    if (const Circle *c = dynamic_cast&lt;const Circle*&gt;(s)) {\n        c-&gt;radius();\n    } else {\n        cout &lt;&lt; &quot;not a Circle\\n&quot;;\n    }\n}\n\nint main() {\n    Circle circle;\n    Square square;\n    inspect(&amp;circle);\n    inspect(&amp;square);\n    return 0;\n}<\/code><\/pre>\n<h3>编译期做什么<\/h3>\n<p>第一步，<code>Shape<\/code> 含虚析构，是多态类型；编译器为它及派生类生成虚表，并在表旁挂 <code>type_info<\/code> 记录。<\/p>\n<p>第二步，<code>typeid(<em>s)<\/code> 作用于多态表达式，编译期生成读取运行期类型信息的代码；<code>dynamic_cast&lt;const Circle<\/em>&gt;(s)<\/code> 生成运行期兼容性检查代码。<\/p>\n<p>第三步，<code>inspect<\/code> 内 <code>c<\/code> 是转换成功才有效的局部指针，<code>if<\/code> 条件同时完成转换与判空。<\/p>\n<h3>运行期与行为推演<\/h3>\n<p><code>inspect(&amp;circle)<\/code>：<code>s<\/code> 实际指向 <code>Circle<\/code>。<code>typeid(*s)<\/code> 读对象类型信息，返回 <code>Circle<\/code> 的类型记录（编译器修饰后的名字串）。<code>dynamic_cast<\/code> 检查实际类型兼容 <code>Circle<\/code>，返回有效指针；进入 <code>if<\/code>，调用 <code>Circle::radius<\/code>，输出 <code>Circle::radius<\/code>。<\/p>\n<p><code>inspect(&amp;square)<\/code>：实际类型是 <code>Square<\/code>。<code>typeid<\/code> 返回 <code>Square<\/code> 类型记录。<code>dynamic_cast<\/code> 检查不兼容 <code>Circle<\/code>，指针形式返回 <code>nullptr<\/code>；<code>if<\/code> 条件为假，输出 <code>not a Circle<\/code>，不解引用空指针。<\/p>\n<p>程序输出顺序（类型名字符串随编译器修饰，以下行为要点不变）：<code>Circle<\/code> 类型信息、<code>Circle::radius<\/code>；<code>Square<\/code> 类型信息、<code>not a Circle<\/code>。<\/p>\n<h2>具体算例：引用形式转换失败抛 bad_cast<\/h2>\n<pre class=\"lang-cpp\"><code>void useRef(const Shape &amp;s) {\n    const Circle &amp;c = dynamic_cast&lt;const Circle&amp;&gt;(s);\n    c.radius();\n}\n\nint main() {\n    Square square;\n    useRef(square);   // 引用转换失败\n    return 0;\n}<\/code><\/pre>\n<p>推演：引用没有空状态，<code>dynamic_cast&lt;Circle&amp;&gt;<\/code> 检查实际类型为 <code>Square<\/code>，不兼容，抛出 <code>std::bad_cast<\/code> 异常；异常沿调用栈展开（栈展开规则见概念 c09），未捕获时程序终止。与指针形式对照：指针失败给空值，调用处判空分支处理；引用失败只能走异常路径，调用处要么捕获异常，要么保证传入对象类型必然兼容。<\/p>\n<h2>第二算例：static_cast 下行转换不做检查<\/h2>\n<pre class=\"lang-cpp\"><code>int main() {\n    Square square;\n    Shape *p = &amp;square;\n    Circle *c = static_cast&lt;Circle*&gt;(p);   // 编译通过\n    c-&gt;radius();                           // 未定义行为\n    return 0;\n}<\/code><\/pre>\n<p>推演：<code>static_cast<\/code> 在编译期完成基类指针到 <code>Circle*<\/code> 的转换，不读取对象实际类型；<code>p<\/code> 实际指向 <code>Square<\/code>，转换后的 <code>c<\/code> 指向的对象不含 <code>Circle<\/code> 成员。<code>c-&gt;radius()<\/code> 访问到错位内存，属于未定义行为，可能崩溃或读到脏数据。<code>dynamic_cast<\/code> 在这里会返回空指针，把错误挡在解引用之前。下行转换只有在确信对象类型时才用 <code>static_cast<\/code>；类型不确定时用 <code>dynamic_cast<\/code> 并判空。<\/p>\n<h2>对抗性追问：基类去掉虚函数会怎样<\/h2>\n<p>把 <code>Shape<\/code> 的虚析构与 <code>draw<\/code> 都改成普通函数，<code>Shape<\/code> 成为非多态类型。<code>dynamic_cast&lt;Circle<em>&gt;(p)<\/code> 下行转换编译报错：运行期类型信息不存在，编译器无法生成检查代码。<code>typeid(<\/em>p)<\/code> 此时返回静态类型 <code>Shape<\/code> 的类型信息，不反映实际对象类型。RTTI 的整套查询能力依附于多态类型；非多态体系只能靠外部标记（如自定义类型枚举）做分流，那不是语言内置 RTTI。<\/p>\n<p>再追问：无关类型之间 <code>dynamic_cast<\/code> 会怎样。两个互不继承的类，<code>dynamic_cast<\/code> 检查实际类型与目标类型无兼容路径，指针形式返回空，引用形式抛 <code>bad_cast<\/code>；它不会像 <code>reinterpret_cast<\/code> 那样强行重解释地址。需要跨继承体系侧面转换（交叉转换）时，运行期检查沿继承图确认兼容关系后才给出结果。<\/p>\n<h2>延伸推演：typeid 在多态与非多态表达式上的差别<\/h2>\n<p><code>typeid<\/code> 作用于多态类型的解引用表达式，返回动态类型；作用于非多态类型或类型名本身，返回静态类型。同一基类引用绑定不同派生对象，<code>typeid<\/code> 结果随实际对象变化；普通变量的 <code>typeid<\/code> 结果在编译期固定。比较写法为 <code>typeid(*p) == typeid(Circle)<\/code>，相等比较的是类型信息对象，不是类型名字符串。<\/p>\n<h2>延伸推演：什么时候应把 RTTI 分支换成虚函数<\/h2>\n<p><code>inspect<\/code> 中按是否 <code>Circle<\/code> 分流、调用 <code>radius<\/code> 这类派生类特有功能，暴露了接口设计缺口。若各派生类都需要“输出自身特有信息”这类动作，应在基类声明对应虚函数，派生类覆盖后经虚表分派；调用点只面对基类接口，新增派生类时补一个覆盖版本即可，不用回到调用点加 <code>dynamic_cast<\/code> 分支。RTTI 保留给接口无法统一、确需按类型分流的场景，如序列化、类型工厂或诊断日志。<\/p>\n<h2>延伸推演：交叉转换与中间基类下行<\/h2>\n<p>继承体系中存在菱形或兄弟分支时，<code>dynamic_cast<\/code> 的检查沿继承图双向进行。一个指向基类子对象的指针，若实际对象同时含另一分支的子对象，交叉转换到兄弟类可以成功；编译器在编译期只检查类型之间是否存在继承路径，兼容性由运行期类型信息判定。转换到中间基类通常是安全的上行方向，可直接隐式完成；转换到最派生类才需要运行期检查。<\/p>\n<p><code>typeid<\/code> 返回的 <code>type_info<\/code> 名字串经过编译器修饰，不同编译器的串格式不同；跨编译器比较名字字符串不可靠，类型相等性判断应直接比较 <code>typeid<\/code> 对象本身，而不是解析名字串。对模板实例化出的具体类型，<code>typeid<\/code> 记录的是实例化后的完整类型，模板形参本身不构成可查询对象。<\/p>\n<h2>延伸推演：RTTI 信息与虚析构的连带关系<\/h2>\n<p><code>dynamic_cast<\/code> 下行转换依赖对象携带的运行期类型信息，而这份信息挂在虚表上；基类含虚函数（通常是虚析构）才使类型查询成立。反过来，需要经基类指针销毁派生对象时，基类析构应为虚函数（概念 c07）。两条规则同属多态体系：类型识别靠虚表链到类型记录，析构分派靠虚表槽位覆盖；缺虚函数，下行转换编译报错，析构链也无法展开。<\/p>\n<h2>对抗性追问再补：把 RTTI 当多态替代品的长期成本<\/h2>\n<p>按类型写一串 <code>if (typeid(*p) == typeid(Circle))<\/code> 分支，每新增一个派生类就要回到所有分支点补判断；漏写一处，新类型落到兜底分支行为错误。虚函数把动作分发到派生类内部，新增类只补覆盖版本，调用点不动。RTTI 适合工厂注册、序列化、诊断日志等确实要按类型分流的窄场景；业务行为分发优先虚接口。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n<code>typeid<\/code> 对多态表达式与非多态表达式分别返回什么类型的信息？\n<\/li><li>\n<code>dynamic_cast<\/code> 下行转换为什么要求基类是多态类型？类型信息依附在哪套结构上？\n<\/li><li>\n指针形式与引用形式转换失败分别给出什么结果？引用为什么不能返回空？\n<\/li><li>\n<code>static_cast<\/code> 下行转换与 <code>dynamic_cast<\/code> 在检查时机和失败处理上有何差别？\n<\/li><li>\n什么场景应优先用虚函数分派，而不是写一串 <code>typeid<\/code>/<code>dynamic_cast<\/code> 分支？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "RTTI 与 dynamic_cast 的边界"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C++ Primer Plus：中文版（第六版） (Stephen Prata) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.635<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">构造函数、析构函数与成员初始化列表<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">拷贝构造与赋值：深浅拷贝与三/五法则<\/a><\/span><\/div><h1>异常安全与栈展开<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3 章（原书第 15 章友元、异常和其他，15.3 节异常机制，15.3.2 捕获错误 try 和 catch，PDF 第 635 页起）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>函数中途出错时，返回错误码要沿每层调用手工传递检查；深层调用发现错误，中间各层都得记得判断返回值，漏掉一层错误就被吞掉。异常把错误信号沿调用栈自动带回，直到找到匹配处理代码。但异常跳出函数时，中途已申请的资源若没有配套回收路径，会在栈展开中漏掉。本概念回答：<code>throw<\/code>、<code>try<\/code>、<code>catch<\/code> 各在控制流中扮演什么角色；栈展开时局部对象按什么顺序析构；哪类资源在异常路径上泄漏，具体链路怎么走；RAII 怎样把回收绑到析构上；析构函数为何不该抛异常。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>异常<\/strong>：<code>throw<\/code> 抛出的错误对象；控制流立即离开当前函数，沿调用栈向上找匹配 <code>catch<\/code>。<\/p>\n<p><strong><code>try<\/code> 块<\/strong>：包裹可能抛异常的代码段，其后挂一个或多个 <code>catch<\/code> 处理器，按类型匹配被抛对象。<\/p>\n<p><strong><code>catch<\/code> 处理器<\/strong>：声明捕获类型与参数，匹配成功进入处理器；按类型或引用接收异常对象。<\/p>\n<p><strong>栈展开<\/strong>：异常从抛出点向上回溯调用栈的过程。退出每个函数帧时，已构造局部对象按构造逆序析构；展开到类型匹配的 <code>catch<\/code> 为止。<\/p>\n<p><strong>异常安全<\/strong>：代码在异常发生时仍资源不泄漏、状态一致。持有裸资源的函数要保证异常路径上资源被回收。<\/p>\n<p><strong>RAII<\/strong>：资源获取即初始化，把资源生命周期绑到局部对象——构造获取、析构释放；栈展开时局部对象自动析构回收资源。<\/p>\n<p><strong><code>noexcept<\/code><\/strong>：C++11 起标注函数不抛异常；带 <code>noexcept<\/code> 却抛出异常，程序调用 <code>std::terminate<\/code> 终止。它取代早期动态异常规范写法。<\/p>\n<h2>原理推导与机制推演<\/h2>\n<p>先推控制流路径。正常执行语句按序走完函数返回；<code>throw<\/code> 后当前函数剩余语句不再执行，异常对象被构造，调用栈逐层退出。每层退出时已构造局部对象由编译器插入的析构调用按逆序回收；到达某帧的 <code>try<\/code> 块类型匹配，控制流转入 <code>catch<\/code>，展开停止。<\/p>\n<p>再推局部对象析构与裸资源的差别。栈对象生命周期由作用域锚定，展开必然触发析构；<code>new<\/code> 出来的堆块只由裸指针记录，指针是栈上标量，析构指针不会 <code>delete<\/code> 块。异常跳过函数体内 <code>delete<\/code> 语句后，堆块地址失去持有者，泄漏。<\/p>\n<p>推泄漏例子链路：函数先 <code>new<\/code> 缓冲区存入裸指针，后续操作抛异常；异常跳过剩余语句（含原定 <code>delete<\/code>）；展开析构栈上裸指针变量（指针回收，堆块不动）；<code>catch<\/code> 在上层拿到控制权，堆块找不到地址。修法是把缓冲区交给 RAII 对象（局部智能指针或容器）持有，展开时其析构释放块。<\/p>\n<p>推析构抛异常的边界。展开过程中某局部对象析构又抛异常，此时已有异常正在展开，两个异常并存，程序调用 <code>std::terminate<\/code> 终止。析构函数约定不抛异常，清理动作内部消化错误。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：深层错误用异常带回上层；局部资源用 RAII 类型管理；析构不抛异常；确认不抛的函数标 <code>noexcept<\/code>；<code>catch<\/code> 先派生类后基类排列。\n<\/li><li>\n失败案例一：裸指针持堆资源，异常跳过 <code>delete<\/code>，堆块泄漏。\n<\/li><li>\n失败案例二：<code>catch<\/code> 基类处理器写在派生类前，派生类异常被基类分支截走。\n<\/li><li>\n失败案例三：析构函数抛异常，栈未展开完又起第二个异常，程序终止。\n<\/li><li>\n失败案例四：<code>noexcept<\/code> 函数内调用可能抛异常的操作，逃出时直接终止。\n<\/li><li>\n边界：未捕获异常传到 <code>main<\/code> 之上，程序 <code>terminate<\/code>；异常只用于错误与例外，不做常规控制流。\n<\/li><li>\n边界：异常对象按抛出处类型拷贝/移动到异常存储；按值捕获基类会切掉派生部分。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>错误码 vs 异常<\/strong>：错误码沿返回值逐层判断，每层显式检查；异常自动回溯到匹配处理器，中间层不透传。错误码适合常规返回，异常适合例外错误。\n<\/li><li>\n<strong>栈对象析构 vs 裸资源回收<\/strong>：栈对象展开中自动析构；裸堆资源只在显式 <code>delete<\/code> 时回收，异常跳过即泄漏。\n<\/li><li>\n<strong>RAII 对象 vs 裸指针<\/strong>：RAII 析构绑定释放，展开路径自动执行；裸指针析构什么都不做。\n<\/li><li>\n<strong><code>noexcept<\/code> vs 动态异常规范<\/strong>：早期写法标注可能抛出的类型集合，已弃用；<code>noexcept<\/code> 是编译期承诺，违约即终止。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c03 构造/析构配对是 RAII 落点；概念 c04 资源拷贝规则决定异常路径上对象复制是否安全。后继：概念 c12 智能指针是堆资源 RAII 的标准实现；概念 c13 移动语义在异常对象与临时对象传递中避免深拷贝；概念 c08 的 <code>bad_cast<\/code> 是引用转换失败时抛出的标准异常。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（异常安全与栈展开）<\/summary><div class=\"depth-body\"><h1>c09 深度推演：异常控制流、栈展开析构顺序与资源泄漏链路<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把异常安全讲透，先往回追四层前提：<\/p>\n<ol><li>\n函数调用在栈上逐层嵌套；错误发生在深层时，返回路径经过中间各层帧。\n<\/li><li>\n局部对象的析构由编译器在作用域出口插入调用；作用域被异常强制退出时，这些析构调用仍要执行。\n<\/li><li>\n堆资源不由栈对象自动回收；裸指针只是栈上一个地址标量，析构指针不释放堆块。\n<\/li><li>\n同一时刻只允许一个异常处于展开状态；析构路径再抛异常会把程序推入终止路径。\n<\/ol>\n<p>依赖链方向：调用栈嵌套结构 → 异常跳出当前帧 → 逐帧析构局部对象 → 匹配 catch 停止展开 → 裸资源泄漏点定位与 RAII 回收。<\/p>\n<h2>正向推导：逐行还原一次栈展开<\/h2>\n<h3>算例代码<\/h3>\n<pre class=\"lang-cpp\"><code>#include &lt;iostream&gt;\n#include &lt;stdexcept&gt;\nusing namespace std;\n\nstruct Reporter {\n    const char *name;\n    Reporter(const char *n) : name(n) { cout &lt;&lt; name &lt;&lt; &quot; 构造\\n&quot;; }\n    ~Reporter() { cout &lt;&lt; name &lt;&lt; &quot; 析构\\n&quot;; }\n};\n\nvoid level3() {\n    Reporter r3(&quot;r3&quot;);\n    throw runtime_error(&quot;boom&quot;);\n}\n\nvoid level2() {\n    Reporter r2(&quot;r2&quot;);\n    level3();\n}\n\nvoid level1() {\n    Reporter r1(&quot;r1&quot;);\n    level2();\n}\n\nint main() {\n    try {\n        level1();\n    } catch (const runtime_error &amp;e) {\n        cout &lt;&lt; &quot;捕获: &quot; &lt;&lt; e.what() &lt;&lt; &#x27;\\n&#x27;;\n    }\n    return 0;\n}<\/code><\/pre>\n<h3>编译期做什么<\/h3>\n<p>第一步，编译器为每个 <code>Reporter<\/code> 局部对象在作用域出口插入析构调用；<code>level1<\/code>、<code>level2<\/code>、<code>level3<\/code> 函数帧内都有对应的析构路径，正常返回与异常退出两条路径都覆盖。<\/p>\n<p>第二步，<code>throw runtime_error(&quot;boom&quot;)<\/code> 构造异常对象；<code>main<\/code> 的 <code>try<\/code> 块挂 <code>catch (const runtime_error&amp;)<\/code>，类型匹配关系在编译期登记。<\/p>\n<h3>运行期与析构顺序<\/h3>\n<p>进入 <code>level1<\/code>：构造 <code>r1<\/code>，输出 <code>r1 构造<\/code>；调用 <code>level2<\/code>。进入 <code>level2<\/code>：构造 <code>r2<\/code>，输出 <code>r2 构造<\/code>；调用 <code>level3<\/code>。进入 <code>level3<\/code>：构造 <code>r3<\/code>，输出 <code>r3 构造<\/code>；<code>throw<\/code> 抛出 <code>runtime_error<\/code>。<\/p>\n<p>栈展开从 <code>level3<\/code> 帧开始退出：<code>r3<\/code> 逆序析构，输出 <code>r3 析构<\/code>；回到 <code>level2<\/code> 帧，<code>r2<\/code> 析构，输出 <code>r2 析构<\/code>；回到 <code>level1<\/code> 帧，<code>r1<\/code> 析构，输出 <code>r1 析构<\/code>；回到 <code>main<\/code>，<code>try<\/code> 内调用链退出，<code>catch<\/code> 匹配 <code>runtime_error<\/code>，输出 <code>捕获: boom<\/code>。<\/p>\n<p>完整输出顺序：<\/p>\n<pre class=\"lang-text\"><code>r1 构造\nr2 构造\nr3 构造\nr3 析构\nr2 析构\nr1 析构\n捕获: boom<\/code><\/pre>\n<p>析构顺序与构造顺序严格相反：最后构造的 <code>r3<\/code> 最先析构。即使异常跳出，三个栈对象的析构都被执行；这是栈展开保证的部分。<\/p>\n<h2>具体算例：裸堆资源在异常路径上泄漏<\/h2>\n<h3>出错代码<\/h3>\n<pre class=\"lang-cpp\"><code>#include &lt;cstring&gt;\n\nvoid process() {\n    char *buffer = new char[1024];\n    std::strcpy(buffer, &quot;data&quot;);\n    throw std::runtime_error(&quot;fail&quot;);\n    // 下面这行在异常路径上永远到不了\n    delete[] buffer;\n}\n\nint main() {\n    try {\n        process();\n    } catch (const std::runtime_error &amp;) {\n        cout &lt;&lt; &quot;已捕获，但缓冲区已泄漏\\n&quot;;\n    }\n    return 0;\n}<\/code><\/pre>\n<p>推演：<code>new char[1024]<\/code> 在堆上申请块 <code>D<\/code>，<code>buffer<\/code> 存 <code>D<\/code> 地址。<code>throw<\/code> 执行后，<code>process<\/code> 函数体剩余语句（含 <code>delete[] buffer<\/code>）不再执行。栈展开退出 <code>process<\/code> 帧：<code>buffer<\/code> 是裸指针标量，其“析构”什么都不做，堆块 <code>D<\/code> 不被释放。<code>catch<\/code> 在 <code>main<\/code> 拿到控制权后，没有任何指针记录 <code>D<\/code> 的地址，堆块无法回收，泄漏成立。<\/p>\n<h3>RAII 修正<\/h3>\n<pre class=\"lang-cpp\"><code>#include &lt;memory&gt;\n\nvoid processSafe() {\n    auto buffer = std::make_unique&lt;char[]&gt;(1024);\n    std::strcpy(buffer.get(), &quot;data&quot;);\n    throw std::runtime_error(&quot;fail&quot;);\n}  // 异常展开退出本帧时，unique_ptr 析构释放数组<\/code><\/pre>\n<p>推演：<code>buffer<\/code> 是 RAII 对象，持有堆块 <code>D<\/code>；栈展开退出 <code>processSafe<\/code> 帧时，<code>buffer<\/code> 析构函数执行 <code>delete[]<\/code>，<code>D<\/code> 被回收。资源释放绑在对象析构上，不依赖正常路径走到函数末尾的 <code>delete<\/code> 语句。标准容器（<code>string<\/code>、<code>vector<\/code>）也是这一机制，其析构在展开路径上自动释放内部缓冲。<\/p>\n<h2>第二算例：catch 处理器顺序截走派生类异常<\/h2>\n<pre class=\"lang-cpp\"><code>void handler() {\n    try {\n        throw std::out_of_range(&quot;index&quot;);\n    } catch (const std::exception &amp;e) {      // 基类处理器先写\n        cout &lt;&lt; &quot;exception: &quot; &lt;&lt; e.what() &lt;&lt; &#x27;\\n&#x27;;\n    } catch (const std::out_of_range &amp;e) {   // 派生类处理器永远到不了\n        cout &lt;&lt; &quot;out_of_range: &quot; &lt;&lt; e.what() &lt;&lt; &#x27;\\n&#x27;;\n    }\n}<\/code><\/pre>\n<p>推演：<code>out_of_range<\/code> 派生自 <code>exception<\/code>。<code>catch<\/code> 按书写顺序匹配，基类 <code>exception<\/code> 处理器先接住派生类异常，第二个处理器不可达。修正顺序是先列派生类处理器、后列基类处理器；基类处理器作为兜底放在最后。<\/p>\n<h2>对抗性追问：析构函数内再抛异常会怎样<\/h2>\n<p>栈展开进行到某帧，局部对象析构函数执行期间又 <code>throw<\/code>。此时第一个异常尚未完成展开，第二个异常被抛出，程序处于两个异常并存的状态；标准库路径调用 <code>std::terminate<\/code> 终止程序，不进入正常 <code>catch<\/code> 匹配。约定由此而来：析构函数不承诺抛异常，清理动作内部消化错误，不把新异常带出析构体。<\/p>\n<p>再追问：<code>noexcept<\/code> 函数违约会怎样。标注 <code>noexcept<\/code> 的函数内部调用了可能抛异常的操作，异常逃出函数体时，不进入常规栈展开匹配，直接调用 <code>std::terminate<\/code>。<code>noexcept<\/code> 是给编译器与读者的承诺：该函数作为析构、移动、交换等清理路径的一环，不应引入新的异常出口。<\/p>\n<h2>延伸推演：异常安全的几个层次<\/h2>\n<ul><li>\n基本保证：异常抛出后程序不泄漏已管理资源，对象处于可销毁的合法状态，不要求回到某一特定值。\n<\/li><li>\n强保证：操作要么成功完成，要么异常后状态与操作前一致（提交/回滚语义），常用 copy-and-swap 实现：先在副本上改好，再交换到主对象。\n<\/li><li>\n不抛保证：操作不抛异常，对应 <code>noexcept<\/code> 标注；移动构造、交换、析构通常应满足这一层。\n<\/ul>\n<h2>延伸推演：异常对象的拷贝与切片<\/h2>\n<p><code>throw<\/code> 抛出的对象被复制（或移动）到异常存储位置；<code>catch<\/code> 按值接收时再发生一次拷贝，按引用接收则绑定到异常对象本身。按值捕获基类引用派生类异常时，派生类部分被切掉，派生类特有信息丢失；捕获异常优先用 <code>const 引用<\/code>，避免额外拷贝并保留完整类型。<\/p>\n<h2>延伸推演：catch 匹配规则与异常类型层次<\/h2>\n<p><code>catch<\/code> 按书写顺序尝试匹配：异常对象类型与处理器参数类型一致，或派生类到基类的引用兼容即命中。基类处理器放前面会截走派生类异常，顺序必须先派生后基类。捕获用 <code>const 引用<\/code> 避免额外拷贝并保留完整类型；按值捕获会切掉派生类部分。标准异常层次中 <code>runtime_error<\/code>、<code>out_of_range<\/code>、<code>bad_cast<\/code> 等互为派生关系，兜底处理器用基类 <code>std::exception<\/code> 放最后。<\/p>\n<h2>延伸推演：noexcept 推导与清理路径的异常约定<\/h2>\n<p>析构函数、释放函数、交换函数在设计上不应抛异常；<code>noexcept<\/code> 标注是给编译器与调用方的承诺。标准库容器在扩容转移元素时，若元素移动构造 <code>noexcept<\/code>，用移动；否则为保证强安全退回拷贝。标注 <code>noexcept<\/code> 的函数内部调用可能抛异常的操作，异常逃出时直接终止，不走常规匹配。写清理路径前先确认所调操作是否可能抛错。<\/p>\n<h2>延伸推演：RAII 守卫函数与临时对象清理<\/h2>\n<p>函数内临时申请的资源也可以包进局部守卫对象：守卫构造时记录资源，析构时释放。即使函数中途 <code>return<\/code> 或抛异常，守卫随栈帧退出析构，资源回收。这一思路从智能指针（概念 c12）推广到锁、文件句柄、套接字等各类资源；裸资源散落在函数体内逐条 <code>delete<\/code>，异常路径就多一条泄漏面。<\/p>\n<h2>对抗性追问再补：未捕获异常传到 main 之上会怎样<\/h2>\n<p>异常在调用栈上找不到匹配处理器，运行时调用 <code>std::terminate<\/code> 终止程序，不保证局部对象之外的资源继续回收。关键模块入口应留兜底处理器，把内部异常转成模块级错误状态；异常用于错误与例外，不替代正常返回值控制流。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n栈展开过程中局部对象按什么顺序析构？未展开到的帧里的对象处于什么状态？\n<\/li><li>\n为什么裸指针持有的堆资源在异常路径上会泄漏？指针变量本身的析构做了什么？\n<\/li><li>\nRAII 怎样把资源回收绑到异常路径上？智能指针在其中扮演什么角色？\n<\/li><li>\n<code>catch<\/code> 处理器为什么要先派生类后基类排列？顺序反了发生什么？\n<\/li><li>\n析构函数抛出异常为什么会导致程序终止？<code>noexcept<\/code> 违约后的行为是什么？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "异常安全与栈展开"}, "c10": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C++ Primer Plus：中文版（第六版） (Stephen Prata) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.600<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">值、指针、引用与对象生命周期：C++ 相对 C 的语义差别<\/a><\/span><\/div><h1>模板实例化与特化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书第 14 章 C++ 中的代码重用，14.4.6 模板的具体化：隐式实例化、显式实例化与显式具体化，PDF 第 600 页；第 18 章可变参数模板）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>同一套逻辑要作用在多种类型上：交换 <code>int<\/code>、<code>double<\/code>、字符串，函数体步骤相同，只有类型不同。为每种类型抄一份函数重复且新增类型要补写；<code>void*<\/code> 通用又丢掉类型检查。模板让逻辑写一遍，类型作为参数传入，编译器在编译期按用到的具体类型生成对应版本。本概念回答：模板怎样用类型参数描述通用逻辑；实例化在编译期做什么；隐式与显式实例化的差别；全特化改写哪部分；偏特化在什么条件下启用；模板代码为何通常放在头文件里。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>模板（template）<\/strong>：以 <code>template &lt;typename T&gt;<\/code>（或 <code>class T<\/code>）声明的参数化函数或类。<code>T<\/code> 是类型参数，在使用点由实参推导或显式指定。<\/p>\n<p><strong>函数模板<\/strong>：参数化的函数，实例化后得到针对某类型的具体函数。<\/p>\n<p><strong>类模板<\/strong>：参数化的类，实例化后得到具体类型的类；如本书第 16 章用到的 <code>vector&lt;T&gt;<\/code>、<code>array&lt;T, N&gt;<\/code>。<\/p>\n<p><strong>实例化（instantiation）<\/strong>：编译器把模板参数替换为具体类型，生成函数或类的具体版本的过程。实例化发生在编译期，用到哪个类型才生成哪个版本；未使用的版本不生成代码。<\/p>\n<p><strong>隐式实例化<\/strong>：使用点根据实参类型自动推导出模板实参，触发对应版本生成。<\/p>\n<p><strong>显式实例化<\/strong>：在代码中显式写出 <code>template 类名&lt;具体类型&gt;;<\/code> 或 <code>template 返回类型 函数名&lt;具体类型&gt;(...)<\/code>，强制编译器生成指定版本。<\/p>\n<p><strong>全特化（完全特化）<\/strong>：为模板的一组具体实参提供专门定义；主模板保留通用版本，特化版本在匹配具体实参时优先使用。<\/p>\n<p><strong>偏特化（部分特化）<\/strong>：类模板为部分参数、指针类型或其他限定条件提供专门版本；函数模板不支持偏特化，相关需求用函数重载实现。<\/p>\n<h2>原理推导与机制推演<\/h2>\n<p>先推模板到代码的转换。模板本身不是可直接运行的函数或类，而是一份生成代码的蓝图。使用点出现 <code>交换&lt;int&gt;(a, b)<\/code> 或编译器从实参推导出 <code>T=int<\/code>，编译器把模板定义中的 <code>T<\/code> 替换成 <code>int<\/code>，做类型检查，生成 <code>int<\/code> 版本；再遇到 <code>T=double<\/code> 生成另一套版本。每个实例化版本独立，类型检查在各自版本上进行。<\/p>\n<p>再推实例化的触发时机。隐式实例化在首次使用某类型版本时发生；编译器需要看到模板定义才能生成代码，这是模板实现通常写在头文件中的原因——包含头文件的每个编译单元都能拿到蓝图并按需实例化。显式实例化用于控制版本生成位置，避免同一版本在多个编译单元重复生成。<\/p>\n<p>推特化的匹配顺序。主模板描述通用行为；全特化针对具体实参给出专门实现。调用时编译器先找是否有匹配的特化版本，有则用特化，否则回退主模板。偏特化按模板实参的匹配程度选择最贴合的版本；匹配优先级在编译期由编译器规则确定。<\/p>\n<p>推模板与重载的分工。函数模板生成类型化版本；行为需按类型分叉的个别场景，全特化或函数重载提供专门实现。模板保证通用逻辑一致，特化处理类型相关动作。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：多套类型共用同一套算法或数据结构；类型参数只要求支持模板内部用到的操作；特定类型行为不同处用特化改写。\n<\/li><li>\n失败案例一：模板内部对 <code>T<\/code> 调用了某类型不支持的操作，实例化到该类型时编译报错，错误信息定位到模板定义处。\n<\/li><li>\n失败案例二：模板实现放在 <code>.cpp<\/code> 中，使用方编译单元看不到定义，链接期找不到实例化版本。\n<\/li><li>\n失败案例三：函数模板试图写偏特化；语言只允许类模板偏特化，函数场景改用重载。特化版本与主模板行为口径不一致时，同一逻辑在不同类型上表现分叉。\n<\/li><li>\n边界：实例化在编译期展开，类型越多生成版本越多；二进制体积随实例化类型数量增长。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>模板 vs 宏<\/strong>：模板编译期做类型替换并检查类型；宏预处理期做文本替换，不检查类型，不参与重载决议。\n<\/li><li>\n<strong>实例化 vs 特化<\/strong>：实例化是按通用蓝图生成具体类型版本；特化是为具体实参另写一份专门定义。特化本身也要被使用到才形成代码。\n<\/li><li>\n<strong>全特化 vs 偏特化<\/strong>：全特化固定全部模板参数；偏特化只固定部分参数或限定指针/引用等条件，仅类模板支持。\n<\/li><li>\n<strong>函数模板 vs 函数重载<\/strong>：模板按统一蓝图生成各类型版本；重载为不同类型手写不同函数体。类型相关的特殊动作用重载，通用骨架用模板。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的值/引用传递决定模板参数接收方式；概念 c04 拷贝语义影响类模板内部成员复制。后继：概念 c11 STL 容器是类模板的标准落地；概念 c12 智能指针是模板包装的 RAII 类型；概念 c13 移动语义决定按值传递是否触发移动构造。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（模板实例化与特化）<\/summary><div class=\"depth-body\"><h1>c10 深度推演：模板参数替换、实例化生成过程与特化匹配顺序<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把模板讲透，先往回追四层前提：<\/p>\n<ol><li>\n同一套算法步骤在不同类型上重复出现，差异只在类型标识；手工复制副本带来重复维护成本。\n<\/li><li>\n编译期具备类型信息，可以把类型参数替换成具体类型后再做类型检查；运行期泛型方案需要牺牲类型安全。\n<\/li><li>\n编译器按使用到的类型生成代码，未使用的版本不产生实例；生成位置与编译单元相关。\n<\/li><li>\n通用行为之外存在类型相关特例，需要一条优先级高于主模板的专门定义通道。\n<\/ol>\n<p>依赖链方向：类型重复问题 → 类型参数化蓝图 → 编译期替换与类型检查 → 按需实例化 → 特化匹配优先级。<\/p>\n<h2>正向推导：逐行还原函数模板的实例化<\/h2>\n<h3>算例代码<\/h3>\n<pre class=\"lang-cpp\"><code>#include &lt;iostream&gt;\nusing namespace std;\n\ntemplate &lt;typename T&gt;\nvoid swapValues(T &amp;a, T &amp;b) {\n    T tmp = a;\n    a = b;\n    b = tmp;\n}\n\nint main() {\n    int x = 1, y = 2;\n    swapValues(x, y);            // 隐式实例化 T=int\n\n    double u = 3.5, v = 4.5;\n    swapValues(u, v);            // 隐式实例化 T=double\n\n    cout &lt;&lt; x &lt;&lt; &#x27; &#x27; &lt;&lt; y &lt;&lt; &#x27;\\n&#x27;;\n    cout &lt;&lt; u &lt;&lt; &#x27; &#x27; &lt;&lt; v &lt;&lt; &#x27;\\n&#x27;;\n    return 0;\n}<\/code><\/pre>\n<h3>编译期做什么<\/h3>\n<p>第一步，编译器读取模板定义，登记 <code>swapValues<\/code> 是函数模板，<code>T<\/code> 为类型参数。模板本身不生成可调用函数。<\/p>\n<p>第二步，处理 <code>swapValues(x, y)<\/code>：实参 <code>x<\/code>、<code>y<\/code> 都是 <code>int<\/code>，模板实参推导得 <code>T=int<\/code>；把定义中所有 <code>T<\/code> 替换为 <code>int<\/code>，得到 <code>void swapValues(int&amp;, int&amp;)<\/code>，做类型检查：<code>T tmp = a<\/code> 即 <code>int tmp = a<\/code>，赋值与交换步骤类型匹配；生成 <code>int<\/code> 版本代码。<\/p>\n<p>第三步，处理 <code>swapValues(u, v)<\/code>：实参 <code>double<\/code>，推导 <code>T=double<\/code>；替换并检查，生成 <code>double<\/code> 版本。两个版本是各自独立的函数体，互不共享代码。<\/p>\n<h3>运行期行为<\/h3>\n<p><code>int<\/code> 版本交换 <code>x<\/code>、<code>y<\/code>：<code>tmp=1<\/code>，<code>x=2<\/code>，<code>y=1<\/code>；<code>double<\/code> 版本交换 <code>u<\/code>、<code>v<\/code>：<code>tmp=3.5<\/code>，<code>u=4.5<\/code>，<code>v=3.5<\/code>。输出：<\/p>\n<pre class=\"lang-text\"><code>2 1\n4.5 3.5<\/code><\/pre>\n<p>模板内部对 <code>T<\/code> 用到的操作是默认构造、拷贝赋值；<code>int<\/code>、<code>double<\/code> 都支持。若实例化到一个没有赋值语义的类型，对应版本在编译期报错。<\/p>\n<h2>具体算例：类模板实例化<\/h2>\n<pre class=\"lang-cpp\"><code>template &lt;typename T&gt;\nclass Pair {\n    T first;\n    T second;\npublic:\n    Pair(T a, T b) : first(a), second(b) {}\n    T sum() const { return first + second; }\n};\n\nint main() {\n    Pair&lt;int&gt; p1(3, 4);\n    Pair&lt;double&gt; p2(1.5, 2.5);\n    cout &lt;&lt; p1.sum() &lt;&lt; &#x27;\\n&#x27;;\n    cout &lt;&lt; p2.sum() &lt;&lt; &#x27;\\n&#x27;;\n    return 0;\n}<\/code><\/pre>\n<p>推演：<code>Pair&lt;int&gt;<\/code> 实例化出一个含两个 <code>int<\/code> 成员、构造函数与 <code>sum()<\/code> 返回 <code>int<\/code> 的类；<code>Pair&lt;double&gt;<\/code> 实例化出含两个 <code>double<\/code> 的类。<code>sum()<\/code> 内部执行 <code>first + second<\/code>，要求 <code>T<\/code> 支持 <code>+<\/code>。两个实例化类各自独立，成员布局按各自类型尺寸排布。输出 <code>7<\/code> 与 <code>4.0<\/code>（浮点格式随输出设置）。<\/p>\n<h2>第二算例：全特化为具体类型改专门行为<\/h2>\n<pre class=\"lang-cpp\"><code>#include &lt;cstring&gt;\n\ntemplate &lt;typename T&gt;\nclass Box {\n    T value;\npublic:\n    Box(T v) : value(v) {}\n    bool same(const T &amp;other) const { return value == other; }\n};\n\ntemplate &lt;&gt;\nclass Box&lt;const char*&gt; {\n    const char *value;\npublic:\n    Box(const char *v) : value(v) {}\n    bool same(const char *other) const {\n        return std::strcmp(value, other) == 0;   // 按内容比较\n    }\n};<\/code><\/pre>\n<p>推演：主模板 <code>same<\/code> 用 <code>==<\/code> 比较；对 <code>const char<em><\/code>，<code>==<\/code> 比较的是地址而非字符串内容。全特化 <code>Box&lt;const char<\/em>&gt;<\/code> 为该实参提供专门定义，改用 <code>strcmp<\/code> 比较内容。使用点 <code>Box&lt;const char*&gt;<\/code> 优先匹配特化版本，其他类型仍走主模板。若把指针比较误留在主模板，两个内容相同、地址不同的 C 字符串会被判不等。<\/p>\n<h2>第三算例：偏特化限定指针类型<\/h2>\n<pre class=\"lang-cpp\"><code>template &lt;typename T&gt;\nclass Wrap {\n    T data;\npublic:\n    Wrap(T d) : data(d) {}\n};\n\ntemplate &lt;typename T&gt;\nclass Wrap&lt;T*&gt; {\n    T *ptr;\npublic:\n    Wrap(T *p) : ptr(p) {}\n    T *get() const { return ptr; }\n};<\/code><\/pre>\n<p>推演：偏特化 <code>Wrap&lt;T<em>&gt;<\/code> 匹配任意指针类型，<code>T<\/code> 在该版本内指向所指类型；主模板处理非指针类型。实例化 <code>Wrap&lt;int&gt;<\/code> 走主模板，<code>Wrap&lt;int<\/em>&gt;<\/code> 走偏特化版本。类模板允许偏特化；函数模板不允许写偏特化，同类需求用函数重载解决。<\/p>\n<h2>对抗性追问：模板实现放进 .cpp 会怎样<\/h2>\n<p>主模板定义写在 <code>a.cpp<\/code>，<code>main.cpp<\/code> 只包含声明、使用 <code>swapValues&lt;int&gt;<\/code>。编译 <code>main.cpp<\/code> 时编译器只有声明、没有蓝图，无法生成 <code>int<\/code> 版本；链接期在 <code>a.o<\/code> 与其他目标文件中也找不到对应实例化符号，报链接错误。模板需要在每个使用它的编译单元可见定义，因此实现随声明放在头文件；显式实例化可在某一 <code>.cpp<\/code> 中强制生成指定版本供外部链接，但通用性受限。<\/p>\n<p>再追问：函数模板为什么不能偏特化。函数重载决议在编译期按参数类型选定函数；偏特化的匹配优先级规则与重载决议交叉会产生歧义，语言因此只给类模板开放偏特化。想为某类参数提供特殊函数版本，写一个普通函数重载即可，编译器按重载规则选定。<\/p>\n<h2>延伸推演：实例化与二进制体积<\/h2>\n<p>每个用到的具体类型生成一套独立代码；<code>swapValues<\/code> 实例化到 <code>int<\/code>、<code>double<\/code>、<code>string<\/code>、<code>long<\/code> 就有四份函数体。成员函数只有被调用到时才随类实例化生成；未使用的成员函数不占用二进制。类型数量膨胀是模板泛型的成本，标准库容器大量实例化时体积增长由编译器与链接器合并机制部分抵消。<\/p>\n<h2>延伸推演：模板参数对类型的隐含要求<\/h2>\n<p>模板内部使用了 <code>T<\/code> 的哪些操作，就是对类型的隐含约束：可构造、可拷贝、可比较、可相加等。实例化到不满足约束的类型，编译错误出现在模板定义内部，错误信息需要沿实例化栈回溯到使用点。C++ 后续版本用概念（concept）显式写明类型要求，把约束失败的提示提前到使用点；本书基础阶段以模板参数加隐式约束为主。<\/p>\n<h2>延伸推演：显式实例化声明与定义的位置<\/h2>\n<p>隐式实例化在使用点所在编译单元生成版本；多文件共用同一类型版本时，可在某一 <code>.cpp<\/code> 写显式实例化定义强制生成，其他文件用外部声明引用，避免每个编译单元各生成一份。模板蓝图仍需在头文件可见；显式实例化只控制版本生成位置，不替代定义可见性。函数模板的显式实例化写在命名空间作用域，类模板显式实例化列出具体类型实参。<\/p>\n<h2>延伸推演：模板友元与模板重载搭配<\/h2>\n<p>类模板可以把某个函数模板、另一个类模板声明为友元；友元关系按实例化类型对应。模板与重载配合时，普通函数重载优先于模板实例化：实参类型精确匹配普通函数时选普通版本，匹配不上才推演模板。为特定类型写专门逻辑，优先普通重载或全特化，不在主模板内堆类型分支。<\/p>\n<h2>延伸推演：编译错误定位与实例化栈<\/h2>\n<p>模板内部调用 <code>T<\/code> 的操作，<code>T<\/code> 不支持时错误报在模板定义内部，错误信息沿实例化栈回溯到使用点。读懂报错要从最内层模板定义向外找：哪一行对 <code>T<\/code> 用了什么操作，使用点传入的类型缺哪个接口。后续版本用概念显式约束类型要求，把不满足约束的错误提前到使用点报告。<\/p>\n<h2>对抗性追问再补：模板参数传值还是传引用<\/h2>\n<p>模板函数参数若按值接收，大类型实例化时每次调用都深拷贝；按 <code>const T&amp;<\/code> 接收避免副本，同时保留对内部操作的只读约束。需要在函数内修改参数才用 <code>T&amp;<\/code>；转发场景用右值引用与完美转发（概念 c13 相关）。写模板骨架时先定参数传递方式，避免实例化到重型类型后拷贝成本失控。<\/p>\n<h2>延伸推演：同一模板被多个编译单元实例化后的链接行为<\/h2>\n<p><code>vector&lt;int&gt;<\/code> 这类常用类型会在多个 <code>.cpp<\/code> 中各自触发隐式实例化；编译期每个单元都生成一份候选实例化代码，链接器按规则合并重复实例，保证最终二进制中同一类型版本只保留一份。显式实例化 <code>template class vector&lt;int&gt;;<\/code> 写在一个 <code>.cpp<\/code> 中可强制版本集中生成，其他单元声明外部实例化即可。模板实现留在头文件，是因为实例化需要看到完整定义；只放声明在 <code>.cpp<\/code>，使用方单元拿不到蓝图，链接期找不到对应版本。实例化版本之间类型不同即互不相关，<code>vector&lt;int&gt;<\/code> 与 <code>vector&lt;double&gt;<\/code> 是两个独立类，成员函数地址也各自独立。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n模板本身是可运行代码吗？实例化在编译期完成哪一步替换？\n<\/li><li>\n隐式实例化与显式实例化的触发方式有何差别？\n<\/li><li>\n全特化版本与主模板在匹配顺序上谁优先？偏特化为什么只对类模板开放？\n<\/li><li>\n模板实现为什么通常放在头文件中？实现放 <code>.cpp<\/code> 会在哪个阶段报错？\n<\/li><li>\n模板对 <code>T<\/code> 的隐含约束从哪里看出来？实例化到不支持某操作的类型会得到什么结果？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "模板实例化与特化"}, "c11": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C++ Primer Plus：中文版（第六版） (Stephen Prata) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.693<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c10\">模板实例化与特化<\/a><\/span><\/div><h1>STL 容器选择与迭代器失效<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章（原书第 16 章 string 类和标准模板库，16.3 节标准模板库，16.3.1 节模板类 vector，PDF 第 693 页起）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>数组长度固定、中间插入代价高；手写链表要自己维护节点指针与析构。STL 把常见数据结构封装成容器模板，配统一迭代器接口遍历。选容器要按访问方式、插入删除位置、增长频率权衡；更隐蔽的问题是：插删元素后，之前拿到的迭代器、指针、引用哪些还能用。继续使用失效迭代器属于未定义行为，故障随机、难定位。本概念回答：<code>vector<\/code>、<code>array<\/code>、<code>list<\/code>、<code>deque<\/code>、<code>string<\/code> 各自的存储与增长方式；迭代器分哪几类；各类容器插删扩容后哪些迭代器失效。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>容器<\/strong>：管理一组元素存储的类模板。本书基础范围覆盖 <code>vector<\/code>（动态数组）、<code>array<\/code>（固定数组）、<code>list<\/code>（双向链表）、<code>deque<\/code>（双端队列）与 <code>string<\/code>（字符序列）。<\/p>\n<p><strong>迭代器<\/strong>：指向容器元素的抽象位置。按访问能力分：随机访问迭代器可加减整数跳跃；双向迭代器可前后移动；前向迭代器只能向前；输入/输出迭代器用于流式读写。<\/p>\n<p><strong><code>vector<\/code><\/strong>：连续内存数组，元素紧挨存放；容量不足时申请更大连续块，转移现有元素后释放旧块。支持下标随机访问，尾部插入摊销成本低，中间插入要移动后继元素。<\/p>\n<p><strong><code>array<\/code><\/strong>：编译期固定长度连续数组，不增长，无额外堆分配。<\/p>\n<p><strong><code>list<\/code><\/strong>：双向链表，节点单独存放元素与前后指针；插删只改链接，不移动其他元素；不支持随机访问。<\/p>\n<p><strong><code>deque<\/code><\/strong>：分段连续双端队列，头尾插删成本低，随机访问弱于 <code>vector<\/code>。<\/p>\n<p><strong>迭代器失效<\/strong>：容器结构变化后，原有迭代器、指针、引用不再指向有效元素，继续解引用属未定义行为；失效范围由存储方式决定。<\/p>\n<h2>原理推导与机制推演<\/h2>\n<p>先推 <code>vector<\/code> 扩容为何全表失效。元素连续存放，迭代器通常记录元素位置（常为指针）。容量满后申请新连续块、转移元素、释放旧块；旧块上的迭代器、指针、引用全部指向已释放内存，整体失效。未扩容时尾部插入不移动已有元素；中间插入把后继后移，被移动元素的迭代器随之失效。<\/p>\n<p>再推 <code>list<\/code> 失效范围。节点独立分配，插入不移动已有节点；删除某节点只有该节点迭代器失效，其余不受影响。链表迭代器类别为双向。<\/p>\n<p>推容器选择顺序：下标随机访问、连续存放选 <code>vector<\/code>；长度编译期固定选 <code>array<\/code>；频繁中间增删且不随机访问选 <code>list<\/code>；频繁头尾增删选 <code>deque<\/code>；字符序列用 <code>string<\/code>。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：遍历为主、偶尔尾部追加、需下标访问选 <code>vector<\/code>；节点频繁中间增删选 <code>list<\/code>；定长选 <code>array<\/code>；两端进出选 <code>deque<\/code>。插删后按规则重新获取迭代器。\n<\/li><li>\n失败案例一：<code>vector<\/code> 扩容后沿用旧迭代器，解引用指向已释放旧块。\n<\/li><li>\n失败案例二：遍历 <code>vector<\/code> 删除当前元素未接收 <code>erase<\/code> 返回值，后继跳过或失效访问。\n<\/li><li>\n失败案例三：把 <code>list<\/code> 当随机访问容器 <code>it + n<\/code> 跳跃，迭代器类别不支持，编译报错。\n<\/li><li>\n失败案例四：容量未预留，<code>vector<\/code> 多次扩容反复整块复制，元素量大时性能损失明显。\n<\/li><li>\n边界：失效规则针对结构变化；只读遍历不改结构，迭代器保持有效。<code>vector&lt;bool&gt;<\/code> 是位压缩特化，引用行为与普通元素不同。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong><code>vector<\/code> vs <code>list<\/code><\/strong>：前者连续存储、随机访问快、中间插入移动成本高；后者节点离散、插删不改其他节点、访问沿链移动。判据是访问模式还是增删频率占主导。\n<\/li><li>\n<strong>迭代器 vs 指针<\/strong>：迭代器是容器抽象位置接口，类别随容器能力；指针是裸地址。<code>vector<\/code> 迭代器常见实现为指针，但不能脱离容器规则当裸指针复用。\n<\/li><li>\n<strong>扩容失效 vs 删除失效<\/strong>：扩容重分配使全部迭代器失效；普通删除只影响被删点及后继（<code>vector<\/code>）或被删节点（<code>list<\/code>）。\n<\/li><li>\n<strong><code>array<\/code> vs <code>vector<\/code><\/strong>：<code>array<\/code> 定长无增长；<code>vector<\/code> 动态增长，有容量与大小两个概念。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c10 的类模板是容器实现形式；概念 c01 的值/引用语义决定元素拷贝方式。后继：概念 c12 智能指针常作容器元素管理堆对象；概念 c13 移动语义让扩容转移元素时避免深拷贝；概念 c04 深拷贝规则适用于容器内自定义元素。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（STL 容器选择与迭代器失效）<\/summary><div class=\"depth-body\"><h1>c11 深度推演：容器存储布局、扩容转移过程与迭代器失效场景逐条核对<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把容器与失效规则讲透，先往回追四层前提：<\/p>\n<ol><li>\n元素要存进一块连续或离散的存储；存储方式决定插入删除时其他元素动不动。\n<\/li><li>\n迭代器是指向元素位置的抽象；位置所依附的内存一旦被释放或移动，迭代器就失去有效目标。\n<\/li><li>\n容器增长需要新存储空间；旧元素是否被搬到新块，决定旧位置上的迭代器是否还成立。\n<\/li><li>\n遍历代码在插删过程中继续持有的迭代器，必须按容器失效规则更新，否则访问落到无效位置。\n<\/ol>\n<p>依赖链方向：存储布局（连续/节点） → 增长与转移动作 → 迭代器依附位置变化 → 各类失效范围 → 选择容器的访问模式依据。<\/p>\n<h2>正向推导：vector 扩容时内存与迭代器怎么变<\/h2>\n<h3>算例代码<\/h3>\n<pre class=\"lang-cpp\"><code>#include &lt;vector&gt;\n#include &lt;iostream&gt;\nusing namespace std;\n\nint main() {\n    vector&lt;int&gt; v;\n    v.reserve(3);\n    v.push_back(10);\n    v.push_back(20);\n    auto it = v.begin();\n\n    v.push_back(30);   // 容量内，不扩容\n    cout &lt;&lt; *it &lt;&lt; &#x27;\\n&#x27;;\n\n    v.push_back(40);   // 容量满，触发扩容\n    cout &lt;&lt; *it &lt;&lt; &#x27;\\n&#x27;;  // 风险点：it 可能已失效\n    return 0;\n}<\/code><\/pre>\n<h3>编译期做什么<\/h3>\n<p><code>vector&lt;int&gt;<\/code> 实例化出动态数组类型；<code>push_back<\/code>、<code>begin<\/code>、迭代器加减按 <code>vector<\/code> 接口生成代码。迭代器 <code>it<\/code> 记录 <code>v<\/code> 当前元素位置，具体实现常为裸指针，但失效规则由容器语义规定。<\/p>\n<h3>运行期与内存怎么变<\/h3>\n<p><code>reserve(3)<\/code> 预留能放 3 个 <code>int<\/code> 的连续块，记为旧块 <code>D_old<\/code>，大小 3、容量 3。前两个 <code>push_back<\/code> 把 <code>10<\/code>、<code>20<\/code> 放进 <code>D_old<\/code>；<code>it<\/code> 指向 <code>D_old<\/code> 首元素。<\/p>\n<p>第三次 <code>push_back(30)<\/code>：容量未超，元素写入 <code>D_old<\/code> 第三个位置，旧块未动，<code>it<\/code> 仍指向首元素，<code>*it<\/code> 输出 <code>10<\/code>。<\/p>\n<p>第四次 <code>push_back(40)<\/code>：容量已满，<code>vector<\/code> 申请一块更大的新连续块 <code>D_new<\/code>（常见实现容量翻倍）；把旧块三个元素转移到 <code>D_new<\/code>，释放 <code>D_old<\/code>。<code>D_old<\/code> 被释放后，<code>it<\/code> 指向的位置不再属于有效容器，属于失效迭代器。后续 <code>*it<\/code> 解引用读到已释放内存，是未定义行为：可能碰巧仍读到 <code>10<\/code>，也可能崩溃或读到脏值，不能依赖任何一种表现。<\/p>\n<h3>失效范围核对<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>动作<\/th><th>vector 迭代器<\/th><th>vector 指针/引用<\/th><th>list 迭代器<\/th><\/tr><\/thead><tbody><tr><td>尾部插入未扩容<\/td><td>有效<\/td><td>有效<\/td><td>有效<\/td><\/tr><tr><td>尾部插入触发扩容<\/td><td>全部失效<\/td><td>全部失效<\/td><td>不适用<\/td><\/tr><tr><td>中间插入<\/td><td>插入点及后继失效<\/td><td>插入点及后继失效<\/td><td>已有节点有效<\/td><\/tr><tr><td>删除元素<\/td><td>被删点及后继失效<\/td><td>被删点及后继失效<\/td><td>仅被删节点失效<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>具体算例：遍历中删除元素的正确更新方式<\/h2>\n<h3>出错写法<\/h3>\n<pre class=\"lang-cpp\"><code>vector&lt;int&gt; v = {1, 2, 3, 4};\nfor (auto it = v.begin(); it != v.end(); ++it) {\n    if (*it % 2 == 0) {\n        v.erase(it);   // it 已失效，下一轮 ++it 踩到未定义行为\n    }\n}<\/code><\/pre>\n<p>推演：<code>erase(it)<\/code> 删除当前元素，其后继元素前移，<code>it<\/code> 成为失效迭代器；循环末尾 <code>++it<\/code> 在失效迭代器上移动，行为未定义。<\/p>\n<h3>修正写法：接收 erase 返回的新迭代器<\/h3>\n<pre class=\"lang-cpp\"><code>vector&lt;int&gt; v = {1, 2, 3, 4};\nfor (auto it = v.begin(); it != v.end(); ) {\n    if (*it % 2 == 0) {\n        it = v.erase(it);   // 返回被删元素后继的有效迭代器\n    } else {\n        ++it;\n    }\n}<\/code><\/pre>\n<p>推演：<code>erase<\/code> 返回删除位置之后第一个有效迭代器，赋值回 <code>it<\/code> 继续遍历；不删除时才 <code>++it<\/code>。循环条件每轮重新取 <code>v.end()<\/code>，避免持有旧尾迭代器。另一种常见写法是 erase-remove 惯用法：先用 <code>remove<\/code> 把待删元素移到容器尾部，再用一次 <code>erase<\/code> 删掉尾段，遍历过程中不逐个删元素。<\/p>\n<h2>第二算例：list 插入删除为什么不影响其他节点<\/h2>\n<pre class=\"lang-cpp\"><code>#include &lt;list&gt;\nint main() {\n    list&lt;int&gt; lst = {1, 3};\n    auto it = lst.begin();\n    lst.push_front(0);       // 新节点插在头部\n    lst.insert(next(lst.begin()), 2);  // 中间插节点\n    return *it;              // it 仍指向原首节点 1\n}<\/code><\/pre>\n<p>推演：<code>list<\/code> 每个节点独立堆分配，节点内保存前后指针。头部插入新节点只改头部链接，原节点位置不动；中间插入只调整相邻节点指针，已有节点不移动。<code>it<\/code> 指向的原节点没有被释放，继续有效。删除某节点时，仅该节点被释放，对应迭代器失效；其余节点迭代器不受影响。链表代价是访问元素要沿链移动，不支持 <code>it + n<\/code> 的随机访问。<\/p>\n<h2>对抗性追问：跨 push_back 长期持有 vector 迭代器会怎样<\/h2>\n<p>把 <code>it<\/code> 在函数开头取出，后续多次 <code>push_back<\/code> 后再使用。只要中间发生一次扩容，<code>it<\/code> 指向的旧块被释放，后续解引用即失效；未扩容期间看似正常工作，给人“迭代器一直有效”的错觉。规避方式：需要跨插删持有位置时，优先存元素下标（下标在扩容后仍可经 <code>v[下标]<\/code> 重新定位，只要下标小于新大小），或每次使用前重新取迭代器。<\/p>\n<p>再追问：为什么 list 不能按下标随机访问。链表节点地址离散分布，第 <span class=\"katex-inline\">n<\/span> 个节点要从头部沿指针走 <span class=\"katex-inline\">n<\/span> 步，访问成本 <span class=\"katex-inline\">O(n)<\/span>；<code>it + n<\/code> 要求常数时间跳跃，链表迭代器类别不支持该操作。随机访问需求强时应选 <code>vector<\/code> 或 <code>deque<\/code>。<\/p>\n<h2>延伸推演：迭代器类别与算法适配<\/h2>\n<p>STL 算法按迭代器类别工作：只要求前向遍历的算法可适配链表；要求随机访问的算法（如二分查找）只能用在 <code>vector<\/code>、<code>deque<\/code> 这类随机访问容器上。容器选择与算法要求互相约束：先定访问模式，再选容器，最后确认算法所需迭代器类别匹配。<\/p>\n<h2>延伸推演：容量、大小与预留空间<\/h2>\n<p><code>vector<\/code> 的大小是当前元素个数，容量是已分配内存可容纳的元素数；大小不超过容量。尾部插入在大小小于容量时不分配新块；达到容量才扩容。预知元素数量时先 <code>reserve(n)<\/code>，避免增长过程中多次申请大块、反复转移元素。元素类型为自定义类时，转移元素调用拷贝或移动构造；移动语义（概念 c13）让扩容转移成本从深拷贝降为指针接管。<\/p>\n<h2>延伸推演：迭代器类别与算法适配对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>类别<\/th><th>允许操作<\/th><th>代表容器<\/th><\/tr><\/thead><tbody><tr><td>随机访问迭代器<\/td><td>加减整数、下标、比较距离<\/td><td><code>vector<\/code>、<code>array<\/code>、<code>deque<\/code><\/td><\/tr><tr><td>双向迭代器<\/td><td><code>++<\/code>、<code>--<\/code> 前后移动<\/td><td><code>list<\/code><\/td><\/tr><tr><td>前向迭代器<\/td><td>只向前 <code>++<\/code><\/td><td>部分容器适配器<\/td><\/tr><tr><td>输入/输出迭代器<\/td><td>流式读/写<\/td><td>流迭代器<\/td><\/tr><\/tbody><\/table><\/div>\n<p>算法对迭代器类别有最低要求：只遍历一次的算法适配前向类别；二分查找、随机排序要求随机访问类别。容器选错会导致算法在编译期就无法匹配，而不是运行期变慢。<\/p>\n<h2>延伸推演：插入删除复杂度与元素移动成本<\/h2>\n<p><code>vector<\/code> 尾部追加在容量内为摊销常数；中间插入要把后继元素后移，成本随后继数量线性增长。<code>list<\/code> 插入删除只改链接指针，常数时间，但访问元素要沿链走。<code>deque<\/code> 头尾增删成本低，中间插入仍需移动分段元素。扩容转移元素时，元素类型可移动则走移动构造接管资源，不可移动则深拷贝；这也是自定义元素提供移动版本（概念 c13）对容器性能的直接影响。<\/p>\n<h2>延伸推演：string 与 vector&lt;char&gt; 的分工<\/h2>\n<p><code>string<\/code> 是字符序列专用容器，带字符串拼接、查找、比较等字符语义接口；<code>vector&lt;char&gt;<\/code> 是通用字节容器，不提供字符串操作。短字符串在部分实现中有栈上优化（SSO），长度超过阈值才堆分配；<code>vector<\/code> 无这一优化。字符序列处理优先 <code>string<\/code>，原始字节缓冲用 <code>vector&lt;char&gt;<\/code>。<\/p>\n<h2>对抗性追问再补：保留尾迭代器跨插入是否可靠<\/h2>\n<p>循环条件写成 <code>auto end = v.end(); for (auto it = v.begin(); it != end; )<\/code>，循环体内插入元素后 <code>end<\/code> 可能已失效。<code>vector<\/code> 扩容后旧尾迭代器指向释放块，与新尾位置无关；每轮重新取 <code>v.end()<\/code> 才是稳妥写法。<code>list<\/code> 尾迭代器在插入后仍有效，但遍历删除同样要按返回值更新当前迭代器。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n<code>vector<\/code> 扩容时旧元素被搬到哪里？为什么旧迭代器、指针、引用整体失效？\n<\/li><li>\n<code>list<\/code> 插入删除为什么不移动已有节点？哪一类迭代器会失效？\n<\/li><li>\n遍历 <code>vector<\/code> 删除元素时，<code>erase<\/code> 的返回值起什么作用？不接收返回值会踩到什么？\n<\/li><li>\n选择容器时先按哪几个问题权衡：访问模式、插入位置、增长方式？\n<\/li><li>\n为什么跨多次 <code>push_back<\/code> 持有 <code>vector<\/code> 迭代器不可靠？存下标为什么相对稳妥？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "STL 容器选择与迭代器失效"}, "c12": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C++ Primer Plus：中文版（第六版） (Stephen Prata) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.691<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">拷贝构造与赋值：深浅拷贝与三/五法则<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">异常安全与栈展开<\/a><\/span><\/div><h1>智能指针：unique_ptr / shared_ptr 的所有权语义与循环引用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章（原书第 16 章 string 类和标准模板库，16.2.3 节独特智能指针，PDF 第 691 页起）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>堆对象用裸指针记录，释放责任全靠手工配对 <code>new<\/code>/<code>delete<\/code>：提前返回、异常跳过、协作忘配对都会泄漏；多指针指向同一对象时，谁释放、释放几次也易混乱。智能指针把所有权包装进对象，利用栈展开自动析构释放，并在类型层区分独占与共享。本概念回答：<code>unique_ptr<\/code> 独占由哪些语法约束保证；<code>shared_ptr<\/code> 计数怎样记录共享者、归谁释放；<code>weak_ptr<\/code> 怎样观察而不抬高计数；两个 <code>shared_ptr<\/code> 互相持有时计数为何归不到零；创建为何优先 <code>make_unique<\/code>/<code>make_shared<\/code>。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>智能指针<\/strong>：包装裸指针的 RAII 对象，构造接管堆对象，析构自动释放；重载 <code>-&gt;<\/code> 与 <code>*<\/code>，使用方式接近裸指针。<\/p>\n<p><strong><code>unique_ptr<\/code><\/strong>：独占所有权。同一时刻只有一个 <code>unique_ptr<\/code> 指向对象；不可拷贝，只能 <code>std::move<\/code> 转移；离开作用域析构释放。<\/p>\n<p><strong><code>shared_ptr<\/code><\/strong>：共享所有权。内部引用计数记录共享者数量；拷贝计数加一，销毁计数减一；计数归零释放对象与控制块。<\/p>\n<p><strong>控制块<\/strong>：<code>shared_ptr<\/code> 配套管理结构，存强引用计数、弱引用计数与删除方式；多个 <code>shared_ptr<\/code> 与 <code>weak_ptr<\/code> 共享同一控制块。<\/p>\n<p><strong><code>weak_ptr<\/code><\/strong>：不持有所有权的观察者，绑定到 <code>shared_ptr<\/code> 管理的对象；构造不增强计数，使用前 <code>lock()<\/code> 检查存活并返回临时 <code>shared_ptr<\/code>。<\/p>\n<p><strong>循环引用<\/strong>：两个对象各自经 <code>shared_ptr<\/code> 持有对方，两侧强计数互相抬高，任何一方都降不到零，对象与控制块无法释放。<\/p>\n<p><strong><code>make_unique<\/code> / <code>make_shared<\/code><\/strong>：创建智能指针的辅助函数；<code>make_shared<\/code> 一次分配对象与控制块，优先使用可避免裸 <code>new<\/code> 与两次分配。<\/p>\n<h2>原理推导与机制推演<\/h2>\n<p>先推 <code>unique_ptr<\/code> 独占约束。拷贝构造与拷贝赋值被删除，类型层禁止复制；转移所有权显式 <code>std::move<\/code>，源被置空，目标接管裸指针；析构对持有指针释放。释放责任唯一对应一个智能指针对象。<\/p>\n<p>再推 <code>shared_ptr<\/code> 计数路径。对象创建时伴随控制块，强计数为 1；每拷贝一个 <code>shared_ptr<\/code> 计数加一，每析构一个减一；归零释放对象，强计数与弱计数都归零才回收控制块。<code>weak_ptr<\/code> 只登记观察者不抬强计数，<code>lock()<\/code> 时计数大于零则升级出临时 <code>shared_ptr<\/code>，否则返回空。<\/p>\n<p>推循环引用故障链。A 内有 <code>shared_ptr&lt;B&gt; b<\/code>，B 内有 <code>shared_ptr&lt;A&gt; a<\/code>。外部用来创建两者的指针销毁后，A 仍被 B 持有，B 仍被 A 持有，两侧计数至少为 1 不归零，析构不执行。修法是一侧改 <code>weak_ptr<\/code>：观察方向不持强所有权，观察前 <code>lock()<\/code> 确认存活。<\/p>\n<p>推与裸指针的边界。智能指针可 <code>get()<\/code> 取裸指针，但裸指针不参与所有权管理，交出后裸指针侧不要自行 <code>delete<\/code>。返回 <code>unique_ptr<\/code> 表达调用方接管；按 <code>shared_ptr<\/code> 传参表达共享语义。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：单一所有者用 <code>unique_ptr<\/code>；多处共享、最后持有者释放用 <code>shared_ptr<\/code>；双向观察避免环引用用 <code>weak_ptr<\/code>；创建优先辅助函数。\n<\/li><li>\n失败案例一：两个 <code>shared_ptr<\/code> 互相持有形成环，计数不归零，对象泄漏。\n<\/li><li>\n失败案例二：同一裸指针交给两个独立 <code>shared_ptr<\/code>，各建控制块，析构双重释放。\n<\/li><li>\n失败案例三：试图拷贝 <code>unique_ptr<\/code> 被编译期删除的构造拦下；<code>weak_ptr<\/code> 不检查直接访问会踩到悬空，必须先 <code>lock()<\/code> 升级。\n<\/li><li>\n边界：<code>shared_ptr<\/code> 计数增减有原子保护，对象本身数据仍需另行同步。\n<\/li><li>\n边界：默认删除器 <code>delete<\/code>，数组类型用 <code>unique_ptr&lt;T[]&gt;<\/code> 配套 <code>delete[]<\/code>。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong><code>unique_ptr<\/code> vs <code>shared_ptr<\/code><\/strong>：前者独占、不可拷贝、无计数成本；后者共享、带控制块计数。所有权唯一选前者，共享选后者。\n<\/li><li>\n<strong>强计数 vs 弱计数<\/strong>：强计数决定对象是否释放；弱计数只决定控制块是否回收。<code>weak_ptr<\/code> 抬弱计数不抬强计数。\n<\/li><li>\n<strong><code>shared_ptr<\/code> vs 裸指针数组<\/strong>：裸数组靠程序员配对释放；智能指针把释放绑到析构，异常展开自动回收（概念 c09）。\n<\/li><li>\n<strong><code>weak_ptr::lock()<\/code> vs 直接解引用<\/strong>：<code>lock()<\/code> 先查存活再升级；不检查直接访问可能踩到已释放对象。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c04 的资源所有权与三法则是智能指针接管裸资源的基础；概念 c09 的 RAII 思路由智能指针落地为标准类型。后继：概念 c13 移动语义支撑 <code>unique_ptr<\/code> 所有权转移；概念 c11 容器存放智能指针元素时与所有权规则交互。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（智能指针：unique_ptr / shared_ptr 的所有权语义与循环引用）<\/summary><div class=\"depth-body\"><h1>c12 深度推演：所有权转移、引用计数增减路径与循环引用泄漏链路<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把智能指针讲透，先往回追四层前提：<\/p>\n<ol><li>\n堆对象释放必须有唯一明确的责任方；多个裸指针并存时责任划分靠约定，容易失效。\n<\/li><li>\nRAII 把释放动作绑到栈对象析构上；栈展开路径自动执行析构，资源不依赖正常流走到末尾。\n<\/li><li>\n独占与共享是两种所有权模型：独占要求类型层禁止复制，共享要求计数跟踪持有者数量。\n<\/li><li>\n双向持有的对象图可能形成环；环内计数互相抬高，需要一条不持强所有权的观察边断开环。\n<\/ol>\n<p>依赖链方向：裸资源配对问题 → RAII 包装 → 独占模型（unique） → 共享计数模型（shared） → 环引用与 weak 观察边。<\/p>\n<h2>正向推导：unique_ptr 所有权转移路径<\/h2>\n<h3>算例代码<\/h3>\n<pre class=\"lang-cpp\"><code>#include &lt;memory&gt;\n#include &lt;iostream&gt;\nusing namespace std;\n\nstruct Block {\n    int id;\n    Block(int i) : id(i) { cout &lt;&lt; &quot;Block &quot; &lt;&lt; id &lt;&lt; &quot; 构造\\n&quot;; }\n    ~Block() { cout &lt;&lt; &quot;Block &quot; &lt;&lt; id &lt;&lt; &quot; 析构\\n&quot;; }\n};\n\nunique_ptr&lt;Block&gt; makeBlock(int i) {\n    auto p = make_unique&lt;Block&gt;(i);\n    return p;                 // 所有权移出函数\n}\n\nint main() {\n    auto a = makeBlock(1);\n    auto b = move(a);         // 所有权从 a 转到 b\n    // a 此时为空\n    cout &lt;&lt; &quot;a 为空? &quot; &lt;&lt; (a == nullptr) &lt;&lt; &#x27;\\n&#x27;;\n    cout &lt;&lt; &quot;b-&gt;id = &quot; &lt;&lt; b-&gt;id &lt;&lt; &#x27;\\n&#x27;;\n    return 0;\n}<\/code><\/pre>\n<h3>编译期做什么<\/h3>\n<p><code>unique_ptr&lt;Block&gt;<\/code> 的拷贝构造与拷贝赋值被删除；<code>move(a)<\/code> 调用移动构造，<code>a<\/code> 转为右值匹配移动版本。编译期拦截任何隐式拷贝写法。<\/p>\n<h3>运行期与内存怎么变<\/h3>\n<p><code>makeBlock<\/code> 内 <code>make_unique&lt;Block&gt;(1)<\/code> 分配堆块，构造 <code>Block 1<\/code>，<code>p<\/code> 独占。<code>return p<\/code> 移出所有权：调用移动构造把裸指针交给返回值，<code>p<\/code> 置空。<code>main<\/code> 中 <code>a<\/code> 接管；<code>move(a)<\/code> 后裸指针转入 <code>b<\/code>，<code>a<\/code> 置空。<code>a == nullptr<\/code> 成立，输出 <code>1<\/code>；<code>b-&gt;id<\/code> 为 <code>1<\/code>。<\/p>\n<p><code>main<\/code> 返回，<code>b<\/code> 析构释放堆块，输出 <code>Block 1 析构<\/code>。全程只有一个智能指针持有该对象，释放一次。<\/p>\n<h2>具体算例：shared_ptr 计数增减<\/h2>\n<pre class=\"lang-cpp\"><code>#include &lt;memory&gt;\n#include &lt;iostream&gt;\nusing namespace std;\n\nstruct Node {\n    int id;\n    Node(int i) : id(i) {}\n    ~Node() { cout &lt;&lt; &quot;Node &quot; &lt;&lt; id &lt;&lt; &quot; 析构\\n&quot;; }\n};\n\nvoid share(shared_ptr&lt;Node&gt; q) {        // 按值传参，计数加一\n    cout &lt;&lt; &quot;函数内计数: &quot; &lt;&lt; q.use_count() &lt;&lt; &#x27;\\n&#x27;;\n}\n\nint main() {\n    auto p = make_shared&lt;Node&gt;(7);\n    cout &lt;&lt; &quot;创建后计数: &quot; &lt;&lt; p.use_count() &lt;&lt; &#x27;\\n&#x27;;\n    {\n        auto q = p;                      // 拷贝，计数加一\n        cout &lt;&lt; &quot;副本后计数: &quot; &lt;&lt; q.use_count() &lt;&lt; &#x27;\\n&#x27;;\n        share(q);\n    }                                    // q 析构，计数减一\n    cout &lt;&lt; &quot;离开块后计数: &quot; &lt;&lt; p.use_count() &lt;&lt; &#x27;\\n&#x27;;\n    return 0;\n}                                        // p 析构，计数归零，释放对象<\/code><\/pre>\n<p>推演：<code>make_shared&lt;Node&gt;(7)<\/code> 一次分配对象与控制块，强计数 1。<code>auto q = p<\/code> 拷贝，强计数 2。<code>share(q)<\/code> 按值传参，形参 <code>q<\/code> 再拷贝一次，函数内计数 3；函数返回形参析构，计数回 2。离开内层块，<code>q<\/code> 析构，计数回 1。<code>main<\/code> 返回，<code>p<\/code> 析构，强计数归零，<code>Node 7<\/code> 析构，控制块回收。计数随持有者增减一一对应，最后一个持有者退出触发释放。<\/p>\n<h2>第二算例：循环引用泄漏与 weak_ptr 修正<\/h2>\n<h3>泄漏写法<\/h3>\n<pre class=\"lang-cpp\"><code>struct B;\nstruct A {\n    shared_ptr&lt;B&gt; b;\n    ~A() { cout &lt;&lt; &quot;~A\\n&quot;; }\n};\nstruct B {\n    shared_ptr&lt;A&gt; a;\n    ~B() { cout &lt;&lt; &quot;~B\\n&quot;; }\n};\n\nint main() {\n    auto x = make_shared&lt;A&gt;();\n    auto y = make_shared&lt;B&gt;();\n    x-&gt;b = y;\n    y-&gt;a = x;\n    // x、y 离开作用域后，A 被 B 持有，B 被 A 持有\n    return 0;\n}<\/code><\/pre>\n<p>推演：<code>x<\/code> 与 <code>y<\/code> 是外部两个 <code>shared_ptr<\/code>，创建时 A、B 强计数各 1。互相赋值后，A 的强计数被 <code>y-&gt;a<\/code> 抬高，B 的强计数被 <code>x-&gt;b<\/code> 抬高。<code>main<\/code> 返回，<code>x<\/code>、<code>y<\/code> 析构，外部两个持有者退出；但 A 仍被 B 内部 <code>shared_ptr<\/code> 持有，B 仍被 A 内部持有，两侧强计数各剩 1，不归零。<code>~A<\/code>、<code>~B<\/code> 都不执行，两个对象与控制块滞留堆上。<\/p>\n<h3>修正写法：一侧改 weak_ptr<\/h3>\n<pre class=\"lang-cpp\"><code>struct B;\nstruct A {\n    weak_ptr&lt;B&gt; b;                 // 观察者，不抬强计数\n    ~A() { cout &lt;&lt; &quot;~A\\n&quot;; }\n};\nstruct B {\n    shared_ptr&lt;A&gt; a;\n    ~B() { cout &lt;&lt; &quot;~B\\n&quot;; }\n};\n\nint main() {\n    auto x = make_shared&lt;A&gt;();\n    auto y = make_shared&lt;B&gt;();\n    x-&gt;b = y;\n    y-&gt;a = x;\n    return 0;\n}<\/code><\/pre>\n<p>推演：B 仍强持有 A；A 内 <code>weak_ptr<\/code> 只观察 B，不抬 B 的强计数。<code>main<\/code> 返回，<code>y<\/code> 析构使 B 的强计数归零，B 析构；B 析构释放内部对 A 的持有，A 强计数归零，A 析构。需要经 <code>weak_ptr<\/code> 访问 B 时，先 <code>lock()<\/code>：存活则升级出一个临时 <code>shared_ptr<\/code> 使用，不存活则返回空指针。<\/p>\n<h2>对抗性追问：同一裸指针交给两个 shared_ptr 会怎样<\/h2>\n<pre class=\"lang-cpp\"><code>Node *raw = new Node(3);\nshared_ptr&lt;Node&gt; p1(raw);\nshared_ptr&lt;Node&gt; p2(raw);   // 错误：各自新建控制块<\/code><\/pre>\n<p>推演：<code>p1<\/code> 为 <code>raw<\/code> 建控制块，计数 1；<code>p2<\/code> 又为同一裸指针建另一控制块，计数也是 1。两个控制块互不知道对方存在。<code>p1<\/code> 析构释放对象，<code>p2<\/code> 析构再次释放同一地址，双重释放。正确路径是直接 <code>make_shared<\/code> 或从已有 <code>shared_ptr<\/code> 拷贝，不要从裸指针分别构造。<\/p>\n<p>再追问：<code>unique_ptr<\/code> 能不能按值传进函数。按值传参触发拷贝，而拷贝构造被删除，编译报错；需要转移所有权时形参写 <code>unique_ptr&amp;&amp;<\/code> 或值形参并由调用方 <code>move<\/code>，进入函数后所有权归形参。函数只借用对象不接管，形参用普通引用 <code>Block&amp;<\/code>，不包智能指针。<\/p>\n<h2>延伸推演：控制块的分配与计数构成<\/h2>\n<p><code>make_shared<\/code> 把对象内存与控制块分配在同一块内存；用裸指针构造 <code>shared_ptr<\/code> 则对象与控制块两次分配。控制块内通常有强引用计数与弱引用计数：强计数归零释放对象，弱计数归零回收控制块。<code>weak_ptr<\/code> 存在时控制块要保留到弱计数也归零；对象已释放但控制块未回收的区间，<code>weak_ptr<\/code> 仍能查到对象已死亡。<\/p>\n<h2>延伸推演：智能指针作容器元素<\/h2>\n<p>容器存放 <code>shared_ptr&lt;T&gt;<\/code> 时，容器复制元素会增加共享计数；存放 <code>unique_ptr&lt;T&gt;<\/code> 时容器不可整体拷贝，只能移动元素。容器扩容转移元素（概念 c11）对 <code>unique_ptr<\/code> 走移动构造，所有权随元素转移；对 <code>shared_ptr<\/code> 拷贝时计数同步增减。把堆对象放进容器管理，比容器里存裸指针再手工释放稳妥。<\/p>\n<h2>延伸推演：从 unique_ptr 到 shared_ptr 的转换边界<\/h2>\n<p><code>unique_ptr<\/code> 表达独占所有权，不能拷贝；需要共享时显式从 <code>unique_ptr<\/code> 构造 <code>shared_ptr<\/code>，独占权移交共享体系。反向不能把 <code>shared_ptr<\/code> 降级为 <code>unique_ptr<\/code>：共享计数可能大于一，独占前提不成立。函数接口形参类型就是所有权声明：按 <code>unique_ptr<\/code> 值形参表达调用方放弃独占，按 <code>shared_ptr<\/code> 值形参表达纳入共享，普通引用只借用不接管。<\/p>\n<p>控制块还支持自定义删除器：默认 <code>delete<\/code>，数组类型配套 <code>delete[]<\/code>；删除器类型是智能指针类型的一部分，不同删除器的 <code>unique_ptr<\/code> 类型不相同。<code>weak_ptr<\/code> 观察对象时若对象已释放，<code>lock()<\/code> 返回空 <code>shared_ptr<\/code>；在多对象互相持有但存在明确主从关系的图结构中，主对象持强引用，从属观察方持弱引用。<\/p>\n<h2>延伸推演：循环引用之外的两类常见所有权错误<\/h2>\n<p>一类是裸指针与智能指针混用：对象由智能指针管理期间，又把裸指针交给外部长期持有，外部在智能指针释放后访问悬空；裸指针只在对象存活区间内临时使用，不参与释放决策。另一类是两个 <code>shared_ptr<\/code> 由同一 <code>new<\/code> 表达式之外的裸指针分别构造，控制块分裂；正确入口是 <code>make_shared<\/code> 或从已有 <code>shared_ptr<\/code> 拷贝，让控制块唯一。<\/p>\n<h2>延伸推演：weak_ptr 升级出的临时 shared_ptr 存活窗口<\/h2>\n<p><code>weak_ptr::lock()<\/code> 内部先检查强计数：大于零则强计数加一、返回绑定到对象的临时 <code>shared_ptr<\/code>；为零则返回空 <code>shared_ptr<\/code>。这个临时强引用在语句结束时析构，计数回落。使用方在同一语句内完成访问，不能把临时指针保存下来跨语句使用：保存下来的是独立 <code>shared_ptr<\/code>，期间对象可能被释放，悬空风险与裸指针相同。多线程场景下 <code>lock()<\/code> 的计数增减有原子保护，但对象内部数据的读写仍需另行同步；计数只回答“还有多少强持有者”，不回答对象状态是否一致。观察方向选 <code>weak_ptr<\/code> 的一侧，正是为了不把环上的强计数抬住。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n<code>unique_ptr<\/code> 的独占所有权由哪条语法规则保证？所有权转移用什么操作？\n<\/li><li>\n<code>shared_ptr<\/code> 的强计数在哪几个时机增减？计数归零时释放哪些部分？\n<\/li><li>\n循环引用中两侧计数为什么归不到零？<code>weak_ptr<\/code> 从哪一侧断开环？\n<\/li><li>\n同一裸指针分别构造两个 <code>shared_ptr<\/code> 为什么会双重释放？\n<\/li><li>\n<code>weak_ptr::lock()<\/code> 做什么？为什么不能不检查直接访问对象？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "智能指针：unique_ptr / shared_ptr 的所有权语义与循环引用"}, "c13": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C++ Primer Plus：中文版（第六版） (Stephen Prata) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.820<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">拷贝构造与赋值：深浅拷贝与三/五法则<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">值、指针、引用与对象生命周期：C++ 相对 C 的语义差别<\/a><\/span><\/div><h1>移动语义与右值引用的收益测算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章（原书第 18 章探讨 C++ 新标准，18.2 节移动语义和右值引用，PDF 第 820 页起）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>函数按值返回持有堆缓冲区的对象时，旧规则先深拷贝一份缓冲区给调用方，源对象随后析构；拷贝成本随缓冲区大小线性增长，而源对象马上销毁，这次复制是浪费。C++11 引入移动语义：对即将销毁的临时对象或显式标记的对象，可直接接管其资源，不必复制缓冲区。本概念回答：左值与右值怎样区分；右值引用 <code>T&amp;&amp;<\/code> 绑定哪类表达式；移动构造/赋值怎样接管资源、把源对象置成什么状态；<code>std::move<\/code> 做什么转换；一次移动相对深拷贝省多少工作量；移动在什么条件下触发，移动后源对象为何必须保持可析构的合法状态。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>左值（lvalue）<\/strong>：有名字、可取地址、在表达式结束后通常仍存在的表达式，如具名变量、解引用后的指针。<\/p>\n<p><strong>右值（rvalue）<\/strong>：表达式求值结果是临时值，马上就要销毁，如函数返回的临时对象、字面量、<code>std::move<\/code> 转换后的对象。<\/p>\n<p><strong>右值引用（<code>T&amp;&amp;<\/code>）<\/strong>：绑定到右值的引用类型，专门用于识别“这个对象即将销毁、资源可以被接管”的场景。<\/p>\n<p><strong>移动构造函数<\/strong>：构造函数的重载，签名 <code>类名(类名 &amp;&amp;other)<\/code>。用一个右值对象初始化新对象时调用；接管 <code>other<\/code> 持有的资源，把 <code>other<\/code> 置为合法的空状态。<\/p>\n<p><strong>移动赋值运算符<\/strong>：<code>类名 &amp;operator=(类名 &amp;&amp;other)<\/code>；释放 <code>this<\/code> 旧资源后接管 <code>other<\/code> 的资源，<code>other<\/code> 置空。<\/p>\n<p><strong><code>std::move<\/code><\/strong>：把表达式转换成右值引用的辅助函数；它本身不搬任何内存，只是告诉编译器“这个对象可以被移动”。<\/p>\n<p><strong>移动后状态<\/strong>：被移动的源对象处于合法、可析构但内容不确定的状态；可以再赋值或析构，不能假设其保留原值。<\/p>\n<h2>原理推导与机制推演<\/h2>\n<p>先推拷贝路径成本。持缓冲区的类，深拷贝要为新对象分配等大缓冲区，逐字节复制内容，源对象不动。设缓冲区长度 <span class=\"katex-inline\">n<\/span> 字节：分配与复制工作量 <span class=\"katex-inline\">O(n)<\/span>。<\/p>\n<p>再推移动路径动作。移动构造不分配新缓冲区：把源对象指针复制到新对象，源对象指针置空。新对象接管原缓冲区，工作量只有指针赋值 <span class=\"katex-inline\">O(1)<\/span>，没有 <span class=\"katex-inline\">n<\/span> 字节复制。<\/p>\n<p>推触发条件。绑定到右值（临时对象、按值返回值、<code>std::move<\/code> 结果）时，重载决议优先选移动构造/移动赋值；绑定到左值时选拷贝版本。返回局部对象、按值传参等场景临时对象天然是右值，移动被自动触发。<\/p>\n<p>推移动赋值的顺序。先释放 <code>this<\/code> 旧资源，再接管 <code>other<\/code> 资源，最后把 <code>other<\/code> 置空；与拷贝赋值对照（概念 c04）：拷贝复制内容，移动接管指针。移动操作应标注 <code>noexcept<\/code>：容器扩容转移元素时，若移动构造可能抛异常，容器为保证强安全会退回拷贝。<\/p>\n<p>推源对象置空的必要性。若移动后源对象仍指向原缓冲区，新对象与源对象共享内存，析构时重复释放；置空后源对象析构什么都不做。被移动对象仍要能安全析构与重新赋值。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：返回大对象、按值传临时对象、容器扩容转移元素由移动接管；明确放弃左值内容时用 <code>std::move<\/code> 转右值；移动构造/赋值标注 <code>noexcept<\/code>。\n<\/li><li>\n失败案例一：移动构造只复制指针不置空源对象，析构时双重释放。\n<\/li><li>\n失败案例二：移动构造抛异常且未标 <code>noexcept<\/code>，容器扩容不敢用移动，退回深拷贝。\n<\/li><li>\n失败案例三：<code>std::move<\/code> 一个局部常量对象后仍读取原值，移动后内容不确定；对 <code>std::move<\/code> 结果再做拷贝假设，编译器按右值匹配移动版本。\n<\/li><li>\n边界：移动不是强制发生；无移动版本时右值退回拷贝。<code>std::move<\/code> 只做右值类型转换，是否真搬资源取决于移动构造/赋值实现。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>拷贝 vs 移动<\/strong>：拷贝创建独立副本、复制内容，<span class=\"katex-inline\">O(n)<\/span>；移动接管所有权、复制指针，<span class=\"katex-inline\">O(1)<\/span>，源对象置空。\n<\/li><li>\n<strong>左值引用 <code>T&amp;<\/code> vs 右值引用 <code>T&amp;&amp;<\/code><\/strong>：前者绑定具名对象，表达共享或修改；后者绑定即将销毁的对象，表达资源可接管。\n<\/li><li>\n<strong>移动 vs 交换（swap）<\/strong>：交换是两个已有对象互换资源；移动是新对象接管源对象资源、源对象置空。交换常由两次移动实现。\n<\/li><li>\n<strong><code>std::move<\/code> vs 实际搬移<\/strong>：<code>std::move<\/code> 只做右值转换；真正搬资源发生在被匹配到的移动函数体内。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c04 深拷贝与三/五法则界定拷贝路径，移动版本是五法则补充；概念 c01 左值/右值与引用模型是右值引用基础。后继：概念 c11 容器扩容转移元素依赖移动降本；概念 c12 所有权转移是 <code>unique_ptr<\/code> 移动语义的标准实现；概念 c09 移动构造的 <code>noexcept<\/code> 承诺影响容器安全选择。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（移动语义与右值引用的收益测算）<\/summary><div class=\"depth-body\"><h1>c13 深度推演：右值识别、资源接管步骤与拷贝/移动成本对照测算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把移动语义讲透，先往回追四层前提：<\/p>\n<ol><li>\n按值返回、按值传参会产生临时对象；临时对象马上销毁，为它深拷贝一份缓冲区是冗余动作。\n<\/li><li>\n资源所有权可以在对象间转移：接管指针后源对象不再持有，资源不复制也不重复释放。\n<\/li><li>\n编译器要在重载决议中区分“可接管的临时对象”与“仍要保留的具名对象”，右值引用就是这条区分通道。\n<\/li><li>\n移动操作不能在中途抛异常，否则容器转移元素时无法保证回滚安全；<code>noexcept<\/code> 标注是这条约束的接口表达。\n<\/ol>\n<p>依赖链方向：临时对象深拷贝浪费 → 资源可接管 → 右值引用识别可接管对象 → 移动构造/赋值接管指针并置空源 → 成本对比与异常承诺。<\/p>\n<h2>正向推导：逐行还原拷贝与移动两条路径<\/h2>\n<h3>算例代码<\/h3>\n<pre class=\"lang-cpp\"><code>#include &lt;cstring&gt;\n#include &lt;iostream&gt;\n#include &lt;utility&gt;\nusing namespace std;\n\nclass Buffer {\n    char *data;\n    size_t len;\npublic:\n    Buffer(const char *s) {\n        len = std::strlen(s);\n        data = new char[len + 1];\n        std::strcpy(data, s);\n    }\n\n    // 拷贝构造：深拷贝\n    Buffer(const Buffer &amp;other) {\n        len = other.len;\n        data = new char[len + 1];\n        std::strcpy(data, other.data);\n    }\n\n    // 移动构造：接管资源\n    Buffer(Buffer &amp;&amp;other) noexcept : data(other.data), len(other.len) {\n        other.data = nullptr;\n        other.len = 0;\n    }\n\n    ~Buffer() { delete[] data; }\n\n    const char *get() const { return data; }\n};\n\nBuffer makeBuffer() {\n    Buffer tmp(&quot;hello-move&quot;);\n    return tmp;        // 局部对象按值返回，走移动路径\n}\n\nint main() {\n    Buffer a = makeBuffer();\n    Buffer b = std::move(a);   // 显式移动 a\n    cout &lt;&lt; b.get() &lt;&lt; &#x27;\\n&#x27;;\n    return 0;\n}<\/code><\/pre>\n<h3>编译期做什么<\/h3>\n<p>第一步，类同时提供拷贝构造 <code>const Buffer&amp;<\/code> 与移动构造 <code>Buffer&amp;&amp;<\/code>。重载决议按实参值类别选择：左值匹配拷贝版本，右值匹配移动版本。<\/p>\n<p>第二步，<code>return tmp<\/code>：<code>tmp<\/code> 是局部对象，按值返回场景视为右值候选，匹配移动构造把资源交给出返回值。<\/p>\n<p>第三步，<code>std::move(a)<\/code> 把 <code>a<\/code> 转成右值引用，<code>b<\/code> 的初始化匹配移动构造。<\/p>\n<h3>运行期与内存怎么变<\/h3>\n<p><code>makeBuffer<\/code> 内构造 <code>tmp<\/code>：<code>new char[]<\/code> 分配块 <code>D1<\/code>，写入字符串。返回时移动构造执行：新对象的 <code>data<\/code> 接 <code>D1<\/code> 地址，<code>len<\/code> 接长度；<code>tmp.data<\/code> 置空、<code>len<\/code> 置 0。<code>tmp<\/code> 随后析构，空指针不释放任何块。<\/p>\n<p><code>main<\/code> 中 <code>b = std::move(a)<\/code>：移动构造把 <code>a<\/code> 持有的块交给 <code>b<\/code>，<code>a<\/code> 置空。<code>b.get()<\/code> 输出字符串内容。<code>main<\/code> 返回，<code>b<\/code> 析构释放 <code>D1<\/code>；<code>a<\/code> 析构为空操作。全程一块堆缓冲区，复制动作没有发生。<\/p>\n<h3>成本测算<\/h3>\n<p>设缓冲区长度 <span class=\"katex-inline\">n<\/span> 字节。<\/p>\n<ul><li>\n拷贝路径：新对象 <code>new<\/code> 一块 <span class=\"katex-inline\">n+1<\/span> 字节块，<code>strcpy<\/code> 逐字节复制 <span class=\"katex-inline\">n<\/span> 字节，工作量含分配与 <span class=\"katex-inline\">O(n)<\/span> 字节拷贝；源对象保留原块，析构时两块各释放一次。\n<\/li><li>\n移动路径：两个指针赋值（<code>data<\/code>、<code>len<\/code>）加源对象置空，工作量 <span class=\"katex-inline\">O(1)<\/span>；不申请新块，不复制字节。\n<\/ul>\n<p>元素数量为 <span class=\"katex-inline\">m<\/span> 的容器扩容时，若元素可移动，转移 <span class=\"katex-inline\">m<\/span> 个元素的成本为 <span class=\"katex-inline\">O(m)<\/span> 次指针接管；走拷贝则为 <span class=\"katex-inline\">O(m \\cdot n)<\/span> 字节复制。<span class=\"katex-inline\">n<\/span> 越大，移动相对拷贝省下的字节量越显著。<\/p>\n<h2>具体算例：左值不会被自动移动<\/h2>\n<pre class=\"lang-cpp\"><code>int main() {\n    Buffer x(&quot;left-value&quot;);\n    Buffer y(x);          // x 是左值，匹配拷贝构造，深拷贝\n    Buffer z(std::move(x)); // 显式转右值，匹配移动构造\n    return 0;\n}<\/code><\/pre>\n<p>推演：<code>x<\/code> 是具名左值，<code>Buffer y(x)<\/code> 实参是左值，重载决议选拷贝构造，<code>y<\/code> 得到独立深拷贝块；<code>x<\/code> 内容不变。<code>Buffer z(std::move(x))<\/code> 中 <code>move(x)<\/code> 是右值，选移动构造，<code>x<\/code> 被置空。编译器不会因为“x 之后不再用”就自动移动左值；是否移动由值类别与签名匹配决定。<\/p>\n<h2>第二算例：移动构造的 noexcept 与容器扩容<\/h2>\n<pre class=\"lang-cpp\"><code>#include &lt;vector&gt;\n\nint main() {\n    vector&lt;Buffer&gt; boxes;\n    boxes.reserve(2);\n    boxes.emplace_back(&quot;one&quot;);\n    boxes.emplace_back(&quot;two&quot;);\n    boxes.push_back(makeBuffer());  // 触发扩容转移已有元素\n    return 0;\n}<\/code><\/pre>\n<p>推演：<code>vector<\/code> 扩容要把已有元素搬到新块。若元素移动构造标注 <code>noexcept<\/code>，扩容可以放心使用移动：中途抛异常的风险不存在，移动失败无需回滚。若移动构造未承诺不抛，扩容为满足强异常安全，可能退回拷贝构造转移元素，移动收益落空。这也是移动构造与移动赋值通常标注 <code>noexcept<\/code> 的原因。<\/p>\n<h2>对抗性追问：移动后继续读源对象会怎样<\/h2>\n<pre class=\"lang-cpp\"><code>Buffer x(&quot;data&quot;);\nBuffer y(std::move(x));\ncout &lt;&lt; x.get();   // 未定义/不可依赖<\/code><\/pre>\n<p>推演：移动构造已把 <code>x.data<\/code> 置空，<code>x<\/code> 处于合法可析构但内容不确定的状态；<code>x.get()<\/code> 返回空指针，继续解引用读到空。被移动对象可以重新赋值（再获得一块资源），但不能假设它保留移动前的值。<code>std::move<\/code> 一个声明为 <code>const<\/code> 的对象，移动构造拿到的是常量右值，通常无法接管其资源，退回拷贝或编译受限。<\/p>\n<p>再追问：移动只复制指针会漏什么。若类除了缓冲区指针还有长度、容量、状态标记等成员，移动构造必须一并接管并把源对象对应字段置空；只搬主指针、漏掉长度，新对象按错误长度操作缓冲区。移动是整组资源所有权的接管，不是单个指针的复制。<\/p>\n<h2>延伸推演：返回值优化与移动的关系<\/h2>\n<p>按值返回局部对象时，编译器在可行情况下直接在返回位置构造对象（返回值优化），连移动构造都不调用；优化不可行时，退回移动构造，再退回拷贝构造。移动语义是优化不可行时的保底低成本路径；代码提供移动版本，各编译器优化程度不同都不会被迫走深拷贝。<\/p>\n<h2>延伸推演：移动语义与五法则的位置<\/h2>\n<p>一个持有资源的类需要界定五个特殊函数：析构、拷贝构造、拷贝赋值、移动构造、移动赋值。拷贝版本负责深拷贝，移动版本负责接管；缺移动版本，按值返回与容器扩容退回拷贝，语义仍正确但成本更高。<code>unique_ptr<\/code> 这类独占类型只可移动不可拷贝，是移动语义在标准库的直接落地（概念 c12）。<\/p>\n<h2>延伸推演：移动构造必须接管的成员清单<\/h2>\n<p>持缓冲区的类通常不止一个指针：长度、容量、状态标记都属于资源描述。移动构造要把这些字段一并从源对象复制过来，再把源对象对应字段置零或置默认空态；只搬主指针、漏搬长度，新对象按错误长度操作缓冲区。移动赋值顺序：先释放 <code>this<\/code> 旧资源，再接管源资源，最后源置空；自移动赋值（<code>x = std::move(x)<\/code>）也要保证安全。<\/p>\n<h2>延伸推演：返回值优化与移动的层次关系<\/h2>\n<p>按值返回局部对象时，编译器优先在返
