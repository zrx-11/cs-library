<style>
:root{

  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}

，共同界定对象拷贝、移动与释放口径", "chapterId": "ch02"}, {"term": "运算符重载", "def": "为类类型定义 operator@ 函数；优先级、结合律、操作数个数不变，只补充类版本动作；赋值/下标/调用/成员访问必须写成成员", "chapterId": "ch02"}, {"term": "友元（friend）", "def": "类内用 friend 声明的外部函数或类，可访问私有与保护成员；友元不是成员、无 this，归属外部", "chapterId": "ch02"}, {"term": "名字隐藏", "def": "派生类声明同名函数后，基类全部同名版本在派生类作用域被阻断；按名字发生，与虚函数无关，不参与动态绑定", "chapterId": "ch03"}, {"term": "覆盖（override）", "def": "基类虚函数在派生类中签名一致地重新定义，替换虚表对应槽位；经基类指针/引用按实际对象类型分派", "chapterId": "ch03"}, {"term": "虚函数表 / 虚指针", "def": "vtbl 是类级共享的函数地址表；vptr 是多态对象头部指向本表的指针。虚调用经 vptr 查表取槽位地址跳转", "chapterId": "ch03"}, {"term": "RTTI / dynamic_cast", "def": "运行阶段类型识别；typeid 查询实际类型信息，dynamic_cast 做运行期兼容检查，指针失败返回空，引用失败抛 bad_cast", "chapterId": "ch03"}, {"term": "栈展开", "def": "异常抛出后沿调用栈回溯的过程；退出各帧时局部对象按构造逆序析构，直到匹配 catch 处理器", "chapterId": "ch03"}, {"term": "RAII", "def": "资源获取即初始化：把资源生命周期绑到局部对象上，构造获取、析构释放；栈展开时自动析构回收资源", "chapterId": "ch03"}, {"term": "模板实例化 / 特化", "def": "编译器把模板参数替换为具体类型生成函数或类版本；全特化为具体实参另写定义，偏特化限定部分参数（仅类模板）", "chapterId": "ch04"}, {"term": "迭代器失效", "def": "容器结构变化后原有迭代器/指针/引用不再指向有效元素；vector 扩容全表失效，list 仅被删节点失效，继续解引用属未定义行为", "chapterId": "ch04"}, {"term": "unique_ptr / shared_ptr / weak_ptr", "def": "unique_ptr 独占所有权不可拷贝；shared_ptr 引用计数共享，计数归零释放；weak_ptr 观察不抬强计数，用于断开循环引用", "chapterId": "ch04"}, {"term": "移动构造 / 移动赋值", "def": "接收右值引用的特殊函数，接管源对象资源并把源置空；不复制缓冲区，工作量为指针接管 O(1)", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [], "flashcards": []}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C++ Primer Plus：中文版（第六版） (Stephen Prata) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.19<\/div><h1>第 1 章：从 C 到 C++——数据类型、表达式、函数与内存模型<\/h1>\n<blockquote>对应原书第 1–9 章（PDF 第 19–357 页；印刷页 = PDF 页 − 18）。覆盖预备知识、开始学习 C++、处理数据、复合类型、循环和关系表达式、分支语句和逻辑运算符、函数、函数探幽、内存模型和名称空间。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 C++ 在 C 的过程式基础上叠加了哪些面向对象与泛型机制，区分程序在编译期与运行期各自确定了什么；\n<\/li><li>\n区分值、指针、引用三种绑定方式，判断函数参数按哪种方式传递，指出悬空指针与悬空引用的产生条件；\n<\/li><li>\n把一个对象的存储持续性、作用域、链接性分别归类，说明 <code>static<\/code> 在不同语境下改变的是哪一项；\n<\/li><li>\n按编译单元与链接阶段解释全局变量重复定义、内部链接隔离与名称空间命名隔离的规则；\n<\/li><li>\n读懂函数模板出现之前，C++ 怎样用函数、引用、默认参数与重载组织模块化代码。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>C++ 保留 C 的值与指针模型，补上引用作为不可改绑的别名；对象的存活范围由存储持续性决定，名字的可见范围由作用域决定，跨文件可见性由链接性决定，名称空间再把通用名字划分到独立命名域。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. C 与 C++ 的语义衔接<\/h3>\n<p>原书第 1 章从 C 语言的过程式背景讲起：C 是编译型、中级语言，按编译单元组织程序；C++ 在其上加入面向对象、泛型编程与异常等机制（原书第 1 章，PDF 第 19 页起）。本章不要求先写过大量 C++，但需要能读懂普通函数、变量与指针。<\/p>\n<h3>2. 概念 1：值、指针、引用与对象生命周期（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。值对象持有数据本身；指针保存地址、可为空、可改绑；引用是已有对象的别名，声明即初始化、不可改绑、无空状态。对象在构造完成到析构完成之间存活，栈对象随作用域退出自动析构，堆对象由 <code>new<\/code>/<code>delete<\/code> 配对管理（原书 8.2.1 节，PDF 第 274 页）。<\/p>\n<h3>3. 概念 2：存储持续性、作用域、链接性与名称空间（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。自动、静态、线程、动态四类存储持续性回答“内存活多久”；局部、命名空间、类作用域回答“名字在哪看得见”；外部链接、内部链接、无链接回答“跨文件能不能找到”。名称空间把一组名字包进独立命名域，避免跨库通用名撞车（原书 9.2 节，PDF 第 322 页）。<\/p>\n<h3>4. 数据类型、表达式与函数组织<\/h3>\n<p>原书第 3 章处理基本数据类型与算术、关系表达式；第 4 章展开数组、结构体、共用体、指针与自由存储；第 5、6 章讲循环与分支控制流；第 7 章把函数作为模块化工具；第 8 章引入内联函数、引用变量、默认参数与函数重载；第 9 章收束到内存模型与名称空间。这些内容是后续类机制的地基：函数怎么传参、对象活多久、名字在哪可见，都在本章定型。<\/p>\n<h2>推导一（推演）：一次函数调用在值、指针、引用三种方式下的数据路径<\/h2>\n<p>设函数签名分别为 <code>void byValue(int x)<\/code>、<code>void byPointer(int *p)<\/code>、<code>void byRef(int &amp;r)<\/code>，调用处有实参 <code>int a = 1<\/code>。<\/p>\n<p>第一步，编译期检查形参匹配。<code>byValue(a)<\/code> 按值匹配，形参在被调用方栈帧获得独立位置；<code>byPointer(&amp;a)<\/code> 取 <code>a<\/code> 的地址匹配指针形参；<code>byRef(a)<\/code> 左值绑定到引用形参。<\/p>\n<p>第二步，运行期进入函数。值传递把 <code>a<\/code> 的值复制进形参位置，函数内改写的是副本；指针传递把 <code>a<\/code> 的地址复制进指针形参，经解引用触达原对象；引用传递不产生副本，形参直接绑定 <code>a<\/code>。<\/p>\n<p>第三步，返回后对照结果。值传递不回写调用处；指针与引用传递的修改落在原对象上。指针可以为空、可以改绑，引用不行；这层约束由编译器在编译期检查。<\/p>\n<h2>推导二（推演）：多文件项目中一个全局名字的可见性链路<\/h2>\n<p>设项目含两个源文件，头文件中声明一个共享计数器。<\/p>\n<p>第一步，编译阶段各自处理编译单元。文件作用域不加 <code>static<\/code> 的变量具备外部链接，符号进入导出表；加 <code>static<\/code> 后具备内部链接，符号不对外暴露；局部变量无链接，留在栈帧。<\/p>\n<p>第二步，链接阶段对接外部符号。外部链接名字在各目标文件间按名字匹配；同一外部变量只能有一处定义，其余编译单元看到的是 <code>extern<\/code> 声明。内部链接名字被限制在本文件，其他文件用同名互不干扰。<\/p>\n<p>第三步，名称空间隔离。两个库各自定义通用函数名时，放进不同命名空间后按 <code>库A::名字<\/code>、<code>库B::名字<\/code> 区分；<code>using<\/code> 声明引入单个名字，<code>using namespace<\/code> 指令引入整个域，在头文件中滥用会把名字污染扩散到所有包含者。<\/p>\n<h2>反事实：去掉本章的哪条约束会怎样<\/h2>\n<ul><li>\n<strong>把引用当可空指针用<\/strong>：未做空检查就解引用指针绑定引用，运行期踩到空地址；引用语法层没有判空入口，可能为空的目标必须用指针传。\n<\/li><li>\n<strong>头文件直接定义外部链接全局变量<\/strong>：每个包含头文件的编译单元各得一份定义，链接阶段报重复定义；正确做法是头文件放 <code>extern<\/code> 声明，某一个源文件放定义。\n<\/li><li>\n<strong>函数内 <code>static<\/code> 变量在多线程下共享<\/strong>：静态对象全程序一份，并发读写无同步保护产生数据竞争；需要每线程一份改用 <code>thread_local<\/code>。\n<\/li><li>\n<strong>内层作用域遮蔽外层同名变量<\/strong>：阅读时误以为改的是外层，实际操作内层副本；显式区分名字比依赖默认遮蔽规则可靠。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章定下的是对象存储、参数传递与名字可见性规则。下一章进入类与对象：构造函数把对象摆到合法状态，析构函数回收资源，拷贝与运算符重载在本章的值/引用模型上展开。本章的存储期与作用域概念，是后续理解类成员初始化顺序、堆对象所有权管理的前提。<\/p>", "kind": "chapter", "title": "第 1 章：从 C 到 C++——数据类型、表达式、函数与内存模型"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C++ Primer Plus：中文版（第六版） (Stephen Prata) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.358<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：从 C 到 C++——数据类型、表达式、函数与内存模型<\/a><\/span><\/div><h1>第 2 章：类与对象——构造/析构、拷贝、运算符重载、友元<\/h1>\n<blockquote>对应原书第 10–12 章（PDF 第 358–439 页；印刷页 = PDF 页 − 18）。覆盖对象和类、使用类、类和动态内存分配。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清对象创建时构造函数、初始化列表、函数体三个阶段各做什么，成员按什么顺序初始化；\n<\/li><li>\n判断一段类代码是浅拷贝还是深拷贝，指出默认拷贝在什么情况下导致双重释放；\n<\/li><li>\n按三/五法则列出持有资源的类需要自定义的特殊函数；\n<\/li><li>\n区分成员运算符与非成员运算符的适用场景，判断哪些运算符必须成员、哪些不能重载；\n<\/li><li>\n说明友元授权的访问边界，识别不适合用运算符重载表达的动作。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>类把数据与操作打包成对象：构造函数保证诞生即合法，析构函数保证消亡前回收资源；持有堆资源的类必须把拷贝、赋值、移动口径对齐；运算符重载只是给已有符号挂类版本，友元是受控的私有成员访问通道。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 从结构体到类<\/h3>\n<p>原书第 10 章从过程式与面向对象的差别讲起：类把数据成员与处理数据的成员函数打包，公有接口对外暴露操作，私有字段对内隐藏（原书第 10 章，PDF 第 358 页起）。本章概念建立在第 1 章的值/引用传递与对象生命周期规则之上。<\/p>\n<h3>2. 概念 3：构造函数、析构函数与成员初始化列表（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。构造函数与类同名、无返回类型，对象创建时自动调用；析构函数 <code>~类名<\/code> 在对象销毁时调用。初始化列表在进入函数体之前构造成员，成员按声明顺序而非列表书写顺序初始化；<code>const<\/code> 成员、引用成员、无默认构造的成员必须进列表（原书 10.3 节类的构造函数和析构函数，PDF 第 370 页起）。<\/p>\n<h3>3. 概念 4：拷贝构造与赋值——深浅拷贝与三/五法则（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。默认拷贝逐成员复制，指针成员只抄地址；含堆缓冲区的类走默认浅拷贝会让两个对象共享一块内存，析构时双重释放。深拷贝为新对象另分配缓冲区复制内容；需要析构、拷贝构造、拷贝赋值之一时通常三者都要自定义，加上移动构造与移动赋值构成五法则（原书第 12 章，PDF 第 443 页起）。<\/p>\n<h3>4. 概念 5：运算符重载的语义与友元（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。<code>a @ b<\/code> 在类类型参与时匹配 <code>operator@<\/code> 函数；成员版本左操作数是调用对象，非成员版本两参数对称。赋值、下标、调用、成员访问必须写成成员；流输出左操作数是流对象，必须是非成员并常声明为友元。重载不改优先级与结合律，语义应与内置直觉对齐（原书 11.2.2 节，PDF 第 405 页）。<\/p>\n<h2>推导一（推演）：一个含堆缓冲区的对象从诞生到复制的完整路径<\/h2>\n<p>第一步，构造阶段。<code>Blob a(&quot;alpha&quot;)<\/code> 先分配对象存储，构造函数内 <code>new char[]<\/code> 申请缓冲区 <code>D1<\/code>，字符串复制进去；成员指针指向 <code>D1<\/code>。<\/p>\n<p>第二步，拷贝阶段。<code>Blob b(a)<\/code> 若走默认拷贝，<code>b.data = a.data = D1<\/code>，两块对象共享 <code>D1<\/code>；若走深拷贝构造，先 <code>new<\/code> 新块 <code>D2<\/code>，再把 <code>D1<\/code> 内容复制进 <code>D2<\/code>，<code>b.data<\/code> 指向 <code>D2<\/code>。<\/p>\n<p>第三步，析构阶段。浅拷贝路径下 <code>b<\/code> 析构释放 <code>D1<\/code>，<code>a<\/code> 析构再次释放 <code>D1<\/code>，重复释放破坏堆管理；深拷贝路径下两块堆块各释放一次。拷贝赋值在深拷贝之外先释放 <code>this<\/code> 旧块并检查自赋值。<\/p>\n<h2>推导二（推演）：一次运算符表达式的匹配与友元授权<\/h2>\n<p>以 <code>cout &lt;&lt; obj<\/code> 与 <code>a + b<\/code> 两条表达式对照。<\/p>\n<p>第一步，解析 <code>a + b<\/code>。<code>a<\/code> 是类对象，编译器先在类内找成员 <code>operator+<\/code>；匹配成功等价于 <code>a.operator+(b)<\/code>。成员版本要求左操作数是本类对象；写成 <code>内置类型 + 对象<\/code> 时成员版本接不住，需非成员版本参与隐式转换。<\/p>\n<p>第二步，解析 <code>cout &lt;&lt; obj<\/code>。左操作数是 <code>ostream<\/code>，不可能是当前类成员；编译器在外部作用域找非成员 <code>operator&lt;&lt;<\/code>。该函数要读私有字段，类内用 <code>friend<\/code> 声明授予访问权；函数定义仍在类外，归属外部函数。<\/p>\n<p>第三步，语义核对。<code>+<\/code> 应返回新对象、不改两操作数；修改左操作数的动作交给 <code>+=<\/code>。重载 <code>&amp;&amp;<\/code>、<code>||<\/code> 会丢掉短路求值，这两类不应重载。<\/p>\n<h2>反事实：去掉本章的哪个动作会怎样<\/h2>\n<ul><li>\n<strong>去掉拷贝构造、沿用默认浅拷贝<\/strong>：两个对象共享堆缓冲区，一方析构后另一方悬空，双方析构 double free。\n<\/li><li>\n<strong>拷贝赋值不检查自赋值<\/strong>：<code>a = a<\/code> 先释放自身缓冲区，再从已释放地址复制内容，读到回收内存。\n<\/li><li>\n<strong>流输出写成成员函数<\/strong>：<code>cout &lt;&lt; obj<\/code> 左操作数是 <code>ostream<\/code>，成员版本挂不上去，编译期匹配失败。\n<\/li><li>\n<strong>构造函数体里给 const/引用成员赋值<\/strong>：两类成员一经绑定不能再赋值，写法编译报错，必须移到初始化列表。\n<\/li><li>\n<strong>构造函数申请资源后抛异常<\/strong>：对象未构造完成，析构不被调用，裸申请的堆块泄漏；资源应交给 RAII 成员持有。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章把对象的诞生、复制、销毁与自定义运算讲完。下一章进入继承体系：基类与派生类共享代码、覆盖行为，虚函数表支撑运行期分派；本章的构造/析构配对在继承链上扩展为基类与派生类的构造析构顺序，拷贝与移动规则也沿派生对象继续生效。<\/p>", "kind": "chapter", "title": "第 2 章：类与对象——构造/析构、拷贝、运算符重载、友元"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C++ Primer Plus：中文版（第六版） (Stephen Prata) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.498<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：类与对象——构造/析构、拷贝、运算符重载、友元<\/a><\/span><\/div><h1>第 3 章：继承、多态与虚函数、RTTI、异常<\/h1>\n<blockquote>对应原书第 13、15 章（PDF 第 498–551、620–672 页；印刷页 = PDF 页 − 18）。覆盖类继承、友元/异常和其他中的虚函数、RTTI 与异常机制。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分名字隐藏与虚函数覆盖，指出一段签名不匹配的同名函数为什么编译通过却不参与多态；\n<\/li><li>\n画出多态对象的 vptr 与虚表结构，说清一次虚调用经过哪几级间接访问；\n<\/li><li>\n说明 <code>typeid<\/code> 与 <code>dynamic_cast<\/code> 各自回答什么问题，掌握指针与引用转换失败的不同出口；\n<\/li><li>\n描述栈展开过程中局部对象的析构顺序，定位裸堆资源在异常路径上的泄漏点；\n<\/li><li>\n按异常安全层次判断一段持有资源的代码在异常抛出后是否仍一致、不泄漏。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>继承复用基类代码，覆盖让派生类替换虚表槽位支撑动态分派；RTTI 在多态体系上补充运行期类型识别；异常沿调用栈自动回溯并逐帧析构局部对象，裸资源必须靠 RAII 绑到析构上才不会在展开中泄漏。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 继承与多态的问题背景<\/h3>\n<p>原书第 13 章从 is-a 关系讲起：派生类从基类继承成员，经基类指针处理一族派生对象；不同派生类同名行为需要在运行期切换版本，这就是多态（原书第 13 章，PDF 第 498 页起）。本章依赖第 2 章的构造/析构配对与对象拷贝规则。<\/p>\n<h3>2. 概念 6：继承中的名字隐藏 vs 虚函数覆盖（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。派生类声明同名函数即隐藏基类全部同名重载版本，与是否为虚无关；覆盖要求基类函数为 <code>virtual<\/code>、签名匹配（协变返回除外），派生类版本进入虚表槽位。签名写错时本意覆盖、实际隐藏，经基类指针调用仍走基类版本（原书 13.4 节，PDF 第 525 页）。<\/p>\n<h3>3. 概念 7：虚函数表与动态绑定机制（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。多态对象头部有 vptr 指向本类共享虚表；覆盖版本替换对应槽位，未覆盖槽位保留基类地址。虚调用先取 vptr，再按槽位取函数地址跳转；构造函数内虚调用落在当前类表，对象切片后 vptr 指向基类表。<\/p>\n<h3>4. 概念 8：RTTI 与 dynamic_cast 的边界（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。<code>typeid<\/code> 查询对象实际类型信息；<code>dynamic_cast<\/code> 做运行期兼容性检查，指针失败返回空，引用失败抛 <code>bad_cast<\/code>。下行转换要求基类是多态类型；<code>static_cast<\/code> 下行不做检查，类型不符属未定义行为（原书 15.4 节，PDF 第 660 页）。<\/p>\n<h3>5. 概念 9：异常安全与栈展开（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。<code>throw<\/code> 抛出异常对象后控制流沿栈向上回溯，已构造局部对象按构造逆序析构，直到匹配 <code>catch<\/code>。裸指针持有的堆资源在展开中不自动回收；RAII 对象析构释放资源。析构函数不抛异常，<code>noexcept<\/code> 函数违约即终止（原书 15.3 节，PDF 第 635 页）。<\/p>\n<h2>推导一（推演）：一条经基类指针的虚调用如何落到派生类版本<\/h2>\n<p>第一步，构造对象。<code>Derived<\/code> 对象先构造基类子对象，vptr 指基类表；派生类构造阶段把 vptr 改指派生类表。<\/p>\n<p>第二步，建立基类指针。<code>Base <em>p = &amp;derived;<\/code> 静态类型是 <code>Base<\/em><\/code>，实际对象是 <code>Derived<\/code>。<\/p>\n<p>第三步，虚调用分派。<code>p-&gt;func()<\/code> 先取对象 vptr 得到派生类表，按 <code>func<\/code> 槽位偏移取函数地址；派生类覆盖了该槽位则落到派生类版本，未覆盖则保留基类版本。非虚函数不进虚表，按静态类型解析。<\/p>\n<p>第四步，对照隐藏场景。若派生类同名函数签名不同，它没有替换对应槽位；经 <code>p<\/code> 调用仍走基类版本，经派生类对象调用才在派生类作用域匹配到新版本。<\/p>\n<h2>推导二（推演）：异常抛出后栈上各帧的回收顺序<\/h2>\n<p>设调用链为 <code>level1 → level2 → level3<\/code>，每帧各有一个带构造/析构输出的局部对象，<code>level3<\/code> 抛出 <code>runtime_error<\/code>。<\/p>\n<p>第一步，抛出点所在帧退出。<code>level3<\/code> 帧内已构造对象按逆序析构，帧撤销。<\/p>\n<p>第二步，回溯到上一帧。<code>level2<\/code> 局部对象析构，帧撤销；再回溯 <code>level1<\/code>，其局部对象析构。<\/p>\n<p>第三步，匹配处理器。回到 <code>main<\/code> 的 <code>try<\/code> 块，<code>catch (const runtime_error&amp;)<\/code> 类型匹配，控制流转入处理器，展开停止。<\/p>\n<p>栈对象析构由编译器在展开路径自动插入；裸 <code>new<\/code> 的堆块只由指针记录，指针标量析构不释放块，异常跳过 <code>delete<\/code> 语句即泄漏。<\/p>\n<h2>反事实：去掉本章的哪个条件会怎样<\/h2>\n<ul><li>\n<strong>基类函数去掉 <code>virtual<\/code><\/strong>：派生类同名版本不进虚表，经基类指针调用按静态类型解析，多态分派链断开。\n<\/li><li>\n<strong>覆盖时签名写错且不加 <code>override<\/code><\/strong>：变成隐藏，编译通过但基类指针调用仍走基类版本；加 <code>override<\/code> 让编译器当场核对签名。\n<\/li><li>\n<strong>基类析构不是虚函数<\/strong>：经基类指针 <code>delete<\/code> 派生对象，只调基类析构，派生类成员资源不释放。\n<\/li><li>\n<strong>按值切片派生对象<\/strong>：派生部分被切掉，vptr 指基类表，派生类行为丢失。\n<\/li><li>\n<strong>裸指针持有堆资源时抛异常<\/strong>：<code>delete<\/code> 语句被跳过，堆块随展开泄漏；改用智能指针或容器持有资源。\n<\/li><li>\n<strong>析构函数内再抛异常<\/strong>：已有一个异常正在展开，第二个异常并存导致 <code>std::terminate<\/code>。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章的继承与分派机制是第 4 章模板与标准库的使用背景：STL 容器在多态对象场景下存放指针或智能指针，避免切片；智能指针在基类指针上管理独占或共享所有权。异常体系承接 <code>bad_cast<\/code> 等标准异常，RAII 思路由标准库智能指针落地为具体类型。<\/p>", "kind": "chapter", "title": "第 3 章：继承、多态与虚函数、RTTI、异常"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C++ Primer Plus：中文版（第六版） (Stephen Prata) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.552<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：继承、多态与虚函数、RTTI、异常<\/a><\/span><\/div><h1>第 4 章：模板、STL 容器与迭代器、智能指针与移动语义<\/h1>\n<blockquote>对应原书第 14、16、18 章（PDF 第 552–619、673–748、813–849 页；印刷页 = PDF 页 − 18）。覆盖 C++ 中的代码重用（类模板）、string 类和标准模板库（容器、迭代器、智能指针）、探讨 C++ 新标准（移动语义与右值引用）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch02、ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清模板从蓝图到具体类型版本的实例化过程，区分全特化与偏特化的适用条件；\n<\/li><li>\n按访问模式与增删位置选择 <code>vector<\/code>、<code>array<\/code>、<code>list<\/code>、<code>deque<\/code>，核对插删后哪些迭代器失效；\n<\/li><li>\n区分 <code>unique_ptr<\/code> 独占与 <code>shared_ptr<\/code> 共享两种所有权模型，识别循环引用并用 <code>weak_ptr<\/code> 断开；\n<\/li><li>\n解释移动语义怎样把深拷贝换成资源接管，估算拷贝与移动在缓冲区复制量上的差别；\n<\/li><li>\n把前三章的构造析构、深拷贝、异常安全规则串联到标准库类型的使用方式上。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>模板把同一套逻辑参数化类型、编译期按需实例化；STL 容器以迭代器统一遍历并按存储方式决定失效规则；智能指针把堆资源所有权包进 RAII 类型；移动语义为即将销毁的对象提供接管资源的低成本路径。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 代码复用的两条路线<\/h3>\n<p>原书第 14 章先讲包含成员对象、私有/公有继承等复用方式，再引入类模板；第 16 章展开 string 与 STL；第 18 章复习并补充 C++11 新特性，移动语义是其中与资源管理直接相关的部分（原书第 14 章 PDF 第 552 页起，第 16 章 PDF 第 673 页起，第 18 章 PDF 第 813 页起）。<\/p>\n<h3>2. 概念 10：模板实例化与特化（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。模板是类型参数化的蓝图，使用点按实参推导类型，编译器替换并类型检查后生成具体版本；全特化为具体实参另写专门定义，偏特化只类模板支持。模板实现需在使用编译单元可见，通常放在头文件（原书 14.4.6 模板的具体化，PDF 第 600 页起）。<\/p>\n<h3>3. 概念 11：STL 容器选择与迭代器失效（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c11.md\" target=\"_blank\" rel=\"noopener\">概念 c11<\/a>。<code>vector<\/code> 连续存储、随机访问快，扩容重分配使全部迭代器失效；<code>list<\/code> 节点离散，仅被删节点失效；<code>array<\/code> 定长，<code>deque<\/code> 双端进出。选择先定访问模式与增删位置，插删后按容器规则重新获取迭代器（原书 16.3.1 节，PDF 第 693 页）。<\/p>\n<h3>4. 概念 12：智能指针所有权与循环引用（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c12.md\" target=\"_blank\" rel=\"noopener\">概念 c12<\/a>。<code>unique_ptr<\/code> 独占、不可拷贝、可移动转移；<code>shared_ptr<\/code> 带引用计数，最后持有者释放对象；<code>weak_ptr<\/code> 观察不抬强计数。两个 <code>shared_ptr<\/code> 互相持有形成环，计数不归零导致泄漏，一侧改 <code>weak_ptr<\/code> 断开（原书 16.2.3 节，PDF 第 691 页起）。<\/p>\n<h3>5. 概念 13：移动语义与右值引用的收益测算（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c13.md\" target=\"_blank\" rel=\"noopener\">概念 c13<\/a>。右值引用 <code>T&amp;&amp;<\/code> 绑定即将销毁的对象；移动构造/赋值接管源对象资源并把源置空，不复制缓冲区。<code>std::move<\/code> 只做右值转换，不搬内存；移动路径 <span class=\"katex-inline\">O(1)<\/span> 指针接管对照深拷贝 <span class=\"katex-inline\">O(n)<\/span> 字节复制。移动操作应标注 <code>noexcept<\/code>（原书 18.2 节，PDF 第 820 页起）。<\/p>\n<h2>推导一（推演）：一个 vector 扩容时元素转移与迭代器命运<\/h2>\n<p>第一步，容量判断。<code>vector<\/code> 大小小于容量时尾部插入不分配新块，已有元素位置不动。<\/p>\n<p>第二步，扩容转移。容量满后申请更大连续块，把旧元素转移到新块；元素可移动时走移动构造接管资源，不可移动时退回深拷贝。旧块释放。<\/p>\n<p>第三步，失效核对。扩容后旧迭代器、指针、引用全部指向已释放旧块；未扩容时尾部插入不影响已有元素位置。遍历中删除元素要接收 <code>erase<\/code> 返回的新迭代器，<code>list<\/code> 则仅被删节点失效。<\/p>\n<h2>推导二（推演）：一对互相持有的对象为什么泄漏，weak_ptr 怎样断开<\/h2>\n<p>第一步，建立共享。两个对象各持 <code>shared_ptr<\/code> 指向对方，外部两个 <code>shared_ptr<\/code> 是初始持有者。<\/p>\n<p>第二步，外部退出。外部指针析构后，对象 A 仍被 B 内部指针持有，对象 B 仍被 A 内部指针持有，两侧强计数各剩 1，不归零。<\/p>\n<p>第三步，泄漏成立。计数不归零，析构不执行，对象与控制块滞留堆上。<\/p>\n<p>第四步，断开环。一侧改 <code>weak_ptr<\/code>：观察方不抬强计数；外部持有退出后被观察对象强计数归零析构，反向持有随之释放。访问前 <code>lock()<\/code> 升级为临时 <code>shared_ptr<\/code>，确认对象存活。<\/p>\n<h2>反事实：去掉本章的哪个机制会怎样<\/h2>\n<ul><li>\n<strong>不用智能指针、回到裸 <code>new<\/code>/<code>delete<\/code><\/strong>：异常跳过释放语句、协作忘记配对都造成泄漏；多个裸指针共享对象时释放责任不清。\n<\/li><li>\n<strong><code>shared_ptr<\/code> 从同一裸指针分别构造两次<\/strong>：各建控制块、计数互不知情，析构双重释放。\n<\/li><li>\n<strong>容器扩容退回拷贝而非移动<\/strong>：元素缓冲区被深复制一遍，<span class=\"katex-inline\">O(n)<\/span> 字节复制量随元素尺寸放大；移动构造未标 <code>noexcept<\/code> 时容器为强安全不敢用移动。\n<\/li><li>\n<strong>模板实现放进 <code>.cpp<\/code><\/strong>：使用编译单元看不到蓝图，链接期找不到实例化符号。\n<\/li><li>\n<strong><code>weak_ptr<\/code> 不 <code>lock()<\/code> 直接访问<\/strong>：对象可能已释放，观察到悬空；必须先升级再使用。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章收束全书主线：第 1 章的存储与传递规则在模板参数与容器元素上复用；第 2 章的深拷贝、五法则是智能指针与移动语义接管资源的对照基线；第 3 章的多态对象在容器中经指针/智能指针存放，异常安全由 RAII 类型兜底。至此，从基础类型到类、继承、模板与标准库的 C++ 主线闭环。<\/p>", "kind": "chapter", "title": "第 4 章：模板、STL 容器与迭代器、智能指针与移动语义"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C++ Primer Plus：中文版（第六版） (Stephen Prata) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.274<\/div><h1>值、指针、引用与对象生命周期：C++ 相对 C 的语义差别<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章（原书第 4 章复合类型、第 7 章函数、第 8 章函数探幽 8.2 节引用变量）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>C 语言里只有两类东西能在函数间传递：值和指针。传值会把整个变量复制一份，大型结构体按值传递时拷贝成本高；传指针不复制数据，但指针本身可以是空地址、可以指向已经释放的内存，也可以在中途改指向别的对象，调用方无法从函数签名上看出这个指针是不是“必须有效”。C++ 在 C 的这套模型上加了引用（reference）作为第三类绑定方式，同时把“对象从出生到销毁”的责任交给构造函数与析构函数锚定。这个概念要回答：值、指针、引用各自把对象的哪一份交到函数手里；一个对象在什么时候占内存、什么时候释放；C++ 的引用相对 C 的指针在哪些语义约束上收了口。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>值对象<\/strong>：变量自己持有数据本身。把值对象传给函数、用它初始化另一个对象时，发生逐成员复制；两个对象此后互不相干，改其中一个不影响另一个。<\/p>\n<p><strong>指针<\/strong>：指针是一个保存内存地址的变量。它本身有独立的存储位置，里面放的是另一个对象的地址；通过解引用 <code>*p<\/code> 才能访问目标。指针可以重新赋值指向别的对象，可以取值为 0（空指针），也可以在目标失效后变成悬空指针。<\/p>\n<p><strong>引用<\/strong>：引用是已有对象的别名（原书 8.2.1 节，PDF 第 274 页）。声明引用时必须用一个已存在的对象完成初始化，此后引用在它整个生命周期内绑定在该对象上，不能改绑到另一个对象；引用不存在“空别名”这一状态。语法上使用引用时不需要解引用符号，写法与值对象一致。<\/p>\n<p><strong>对象生命周期<\/strong>：一个对象从构造完成获得存储，到析构完成释放存储，中间这段时间是它的存活期。栈上局部对象在离开所在块时自动析构；用 <code>new<\/code> 得到的堆对象存活到对应的 <code>delete<\/code> 执行为止；生命周期内被拷贝出来的副本是独立对象，各有各的存活期。<\/p>\n<p><strong>const 引用绑定临时对象<\/strong>：const 引用可以绑定到临时对象上，此时临时对象的生命期被延长到引用所在的作用域结束；非 const 引用不能绑定到临时对象。<\/p>\n<h2>原理推导与机制推演<\/h2>\n<p>先看值传递。函数 <code>void f(int x)<\/code> 中的 <code>x<\/code> 是形参，调用处把实参的值复制进栈帧为 <code>x<\/code> 分配的位置；函数体内对 <code>x<\/code> 的写操作落在这份副本上，调用处原变量不变。对结构体或类对象按值传递时，复制动作由拷贝构造函数完成，对象多大，复制成本就有多大。<\/p>\n<p>再看指针传递。<code>void f(int <em>p)<\/code> 接收的是地址副本：指针变量 <code>p<\/code> 本身在栈上有自己的位置，里面存的是实参变量的地址；函数通过 <code><\/em>p<\/code> 读写的是地址指向的那块内存。指针副本本身是值传递，但经它触达的目标是共享的。指针可以为 0，可以在初始化之后改指向，调用方必须自己保证目标在整个调用期间有效。<\/p>\n<p>第三看引用传递。<code>void f(int &amp;r)<\/code> 中的 <code>r<\/code> 是实参对象的别名，函数体内对 <code>r<\/code> 的读写直接落在原对象上，不产生对象副本。语言规则在三处收口：声明处必须初始化；绑定后不能改绑；不存在空引用。多数编译器在底层把引用实现成一个保存地址的位置，与指针的机器码接近，但语法层不允许重绑定、不允许出现空值，这层约束由编译器在编译期检查。<\/p>\n<p>对象生命周期在栈上按作用域嵌套管理：进入块时构造局部对象，离开块时按构造顺序的逆序析构；堆对象的生命周期与 <code>new<\/code>/<code>delete<\/code> 显式配对，编译器不会自动回收。引用绑定到栈对象上时，引用不能超出被引用对象的存活期，否则得到悬空引用。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：函数需要读入一个较大对象且不修改它，用 const 引用避免复制；函数需要修改调用处对象本身，用非 const 引用；需要表达“可能没有目标”或需要在中途改指向，才使用指针。\n<\/li><li>\n失败案例一：把局部变量的地址或引用传出函数。函数返回后栈帧撤销，局部对象析构，返回的指针或引用指向已回收栈位置；引用绑定到已 <code>delete<\/code> 的堆对象同样属未定义行为。\n<\/li><li>\n边界：const 引用延长临时对象生命期只发生在绑定那一刻；绑定到非 const 引用上编译器直接报错。引用不能构成引用数组。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>指针 vs 引用<\/strong>：指针是空与非空两可、可改绑、需解引用；引用必绑定、不可改绑、无空状态、语法直用。函数签名里出现指针，调用方要防空；出现引用，编译器保证它绑定着某个对象。\n<\/li><li>\n<strong>值传递 vs 引用传递<\/strong>：值传递产生独立副本，互不影响；引用传递共享同一对象，函数内修改会回写调用处。按值传递大对象时拷贝成本随对象尺寸增长，const 引用是只读共享、不复制的折中。\n<\/li><li>\n<strong>C 结构体传值 vs C++ 类对象传值<\/strong>：C 的结构体按位复制，没有额外语义；C++ 对象按值传递触发拷贝构造函数，复制过程可以自定义，内含指针成员时浅拷贝会把地址也复制过去（见概念 c04）。\n<\/li><li>\n<strong>引用 vs 别名概念<\/strong>：引用受初始化、不可改绑、不能为空三条规则约束；数组名退化指针、函数名退化函数指针，与引用机制不是一回事。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：无（本章起点，承接 C 语言基础）。后继：概念 c02 展开对象在不同存储期下的存活范围；概念 c04 说明按值传递对象时拷贝构造函数与深浅拷贝如何工作；概念 c13 讲右值引用如何把“复制大对象”替换成“接管资源”。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（值、指针、引用与对象生命周期：C++ 相对 C 的语义差别）<\/summary><div class=\"depth-body\"><h1>c01 深度推演：值、指针、引用在编译期与运行期各自落到哪里<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把值、指针、引用三种绑定方式讲透，先往回追四层前提：<\/p>\n<ol><li>\n程序里的每个名字都要落到一块具体存储上。栈上局部变量进入块时分配位置，离开块时收回；堆对象由 <code>new<\/code> 申请、<code>delete<\/code> 归还；静态对象在程序启动时构造、退出时析构。不谈存储位置，就分不清“变量本身”和“变量指向的东西”。\n<\/li><li>\n函数调用在栈帧之间传递数据。形参在被调用方栈帧里有自己的位置，实参按签名约定复制或绑定过去；函数返回后被调用方栈帧撤销，里面的局部位置不再可信。\n<\/li><li>\n指针在 C 里已经存在：它保存地址，解引用访问目标。C++ 没有替换指针，而是在指针之外补了引用，并用规则把引用收窄成“必绑定、不可改绑、无空值”。\n<\/li><li>\n对象从 C 的裸数据升级为带构造、析构行为的实体后，复制对象不再是按位拷贝一件事，而是触发拷贝构造；这一层语义是理解按值传类对象的前提（细节见概念 c04）。\n<\/ol>\n<p>依赖链方向：存储位置模型 → 栈帧与参数传递 → 指针与引用两种地址绑定 → 对象构造析构与生命周期管理。任何一层前提跳过，后面讨论“悬空引用”“临时对象延长生命期”都会失去落点。<\/p>\n<h2>正向推导：逐行还原一段代码在编译期与运行期发生什么<\/h2>\n<h3>算例代码<\/h3>\n<pre class=\"lang-cpp\"><code>#include &lt;iostream&gt;\nusing namespace std;\n\nvoid byValue(int x)      { x = 100; }\nvoid byPointer(int *p)   { *p = 200; }\nvoid byRef(int &amp;r)       { r = 300; }\n\nint main() {\n    int a = 1;\n    byValue(a);\n    cout &lt;&lt; a &lt;&lt; &#x27;\\n&#x27;;   // 行为 A\n\n    byPointer(&amp;a);\n    cout &lt;&lt; a &lt;&lt; &#x27;\\n&#x27;;   // 行为 B\n\n    byRef(a);\n    cout &lt;&lt; a &lt;&lt; &#x27;\\n&#x27;;   // 行为 C\n\n    int *q = nullptr;\n    // int &amp;bad = *q;    // 解引用空指针本身是未定义行为\n    return 0;\n}<\/code><\/pre>\n<h3>编译期做什么<\/h3>\n<p>第一步，编译器为 <code>main<\/code> 栈帧分配局部位置：<code>a<\/code> 占一个 <code>int<\/code> 的宽度，<code>q<\/code> 占一个指针的宽度（64 位平台为 8 字节）。编译器按声明顺序在栈帧内排布位置，具体偏移由编译器决定，源码不写死。<\/p>\n<p>第二步，检查三个调用的形参匹配。<code>byValue(a)<\/code> 按值匹配：<code>int<\/code> 实参复制到形参 <code>x<\/code>，类型检查通过。<code>byPointer(&amp;a)<\/code> 要求形参是 <code>int<em><\/code>，实参取 <code>a<\/code> 的地址得到 <code>int<\/em><\/code>，匹配。<code>byRef(a)<\/code> 要求形参是 <code>int&amp;<\/code>，实参 <code>a<\/code> 是左值，可绑定，匹配。<\/p>\n<p>第三步，检查引用规则。引用声明处必须初始化；<code>int &amp;r<\/code> 在函数签名里由调用处实参完成绑定，规则在调用点检查。被注释掉的 <code>int &amp;bad = <em>q<\/code>：<code>q<\/code> 是空指针，解引用属于未定义行为，即使引用绑定动作本身在语法上能写成，编译器也无法在编译期证明 <code><\/em>q<\/code> 有效，运行期踩到空地址即崩溃。<\/p>\n<h3>运行期与内存怎么变<\/h3>\n<p>进入 <code>byValue<\/code>：栈帧为形参 <code>x<\/code> 分配位置，把 <code>a<\/code> 的值 <code>1<\/code> 复制进去。函数体内 <code>x = 100<\/code> 写在 <code>x<\/code> 这份副本上；返回时栈帧撤销，<code>x<\/code> 的位置收回。回到 <code>main<\/code>，<code>a<\/code> 仍是 <code>1<\/code>，行为 A 输出 <code>1<\/code>。<\/p>\n<p>进入 <code>byPointer<\/code>：形参 <code>p<\/code> 是栈上的指针位置，存入 <code>a<\/code> 的地址。<code>*p = 200<\/code> 经地址触达 <code>a<\/code> 所在内存，把那里的值改成 <code>200<\/code>；指针副本 <code>p<\/code> 随栈帧撤销，目标 <code>a<\/code> 保留改动。行为 B 输出 <code>200<\/code>。<\/p>\n<p>进入 <code>byRef<\/code>：形参 <code>r<\/code> 绑定到 <code>a<\/code>，函数体内 <code>r = 300<\/code> 直接写 <code>a<\/code> 的位置，没有第二个 <code>int<\/code> 被复制出来。行为 C 输出 <code>300<\/code>。<\/p>\n<p>内存布局上，64 位平台一个 <code>int<\/code> 占 4 字节，一个指针占 8 字节；引用在常见实现里也落一个保存地址的位置，但语法层不暴露“改绑”“置空”两个操作，编译器在编译期把这两类写法拦下来。把 <code>main<\/code> 栈帧抽象成一张表：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>名字<\/th><th>角色<\/th><th>存放内容<\/th><th>离开 main 后<\/th><\/tr><\/thead><tbody><tr><td><code>a<\/code><\/td><td>值对象<\/td><td>一个 <code>int<\/code> 的值<\/td><td>栈帧撤销，位置收回<\/td><\/tr><tr><td><code>q<\/code><\/td><td>指针<\/td><td>空地址（<code>nullptr<\/code>）<\/td><td>指针位置收回，目标本就不存在<\/td><\/tr><tr><td><code>x<\/code>（byValue 形参）<\/td><td>值副本<\/td><td><code>a<\/code> 的值复制件<\/td><td>随 byValue 栈帧撤销<\/td><\/tr><tr><td><code>p<\/code>（byPointer 形参）<\/td><td>指针副本<\/td><td><code>a<\/code> 的地址副本<\/td><td>随栈帧撤销，<code>a<\/code> 不受影响<\/td><\/tr><tr><td><code>r<\/code>（byRef 形参）<\/td><td>别名<\/td><td>绑定到 <code>a<\/code>，无独立副本<\/td><td>随栈帧撤销，绑定关系结束<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>具体算例：const 引用绑定临时对象的生命期延长<\/h2>\n<pre class=\"lang-cpp\"><code>#include &lt;string&gt;\nusing namespace std;\n\nstring makeGreeting() { return string(&quot;hello&quot;); }\n\nint main() {\n    const string &amp;g = makeGreeting();  // 临时 string 被绑定到 const 引用\n    // 离开 main 之前，g 都可用；临时对象随 g 所在作用域结束才析构\n    return 0;\n}<\/code><\/pre>\n<p>推演过程：<code>makeGreeting<\/code> 返回一个临时 <code>string<\/code>，按普通规则这个临时对象在完整表达式结束时就该析构；当它被 const 引用 <code>g<\/code> 绑定，语言规则把临时对象的生命期延长到引用 <code>g<\/code> 所在作用域结束。反过来，若写成 <code>string &amp;g = makeGreeting();<\/code>，非 const 引用不能绑定到右值临时对象，编译期报错。这组对照说明：生命期延长是 const 引用独有的规则，不是“只要有引用绑着就延长”。<\/p>\n<p>再看临时对象按值返回的拷贝路径：函数返回时先在调用方上下文构造临时对象，再由它初始化 <code>g<\/code>；延长规则生效后，临时对象不再在返回语句处析构，而是挂到 <code>g<\/code> 的生命期上。若 <code>g<\/code> 是普通值对象 <code>string g = makeGreeting();<\/code>，临时对象用于拷贝构造 <code>g<\/code>，随后临时对象析构，<code>g<\/code> 自己存活到作用域结束；两条路径最终都留下一个可用的 <code>string<\/code>，中间临时对象的析构时机不同。<\/p>\n<h2>第二算例：指针重绑定与引用不可改绑的对照<\/h2>\n<pre class=\"lang-cpp\"><code>#include &lt;iostream&gt;\nusing namespace std;\n\nint main() {\n    int x = 1, y = 2;\n    int *p = &amp;x;\n    *p = 10;        // p 指向 x，x 变成 10\n    p = &amp;y;         // 指针改绑到 y，x 不受影响\n    *p = 20;        // y 变成 20\n\n    int &amp;r = x;\n    r = y;          // 把 y 的值赋给 x，r 仍绑定 x\n    cout &lt;&lt; x &lt;&lt; &#x27; &#x27; &lt;&lt; y &lt;&lt; &#x27;\\n&#x27;;  // 输出 2 2\n    return 0;\n}<\/code><\/pre>\n<p>逐行推演：<code>p<\/code> 是指针变量，第一次存 <code>x<\/code> 的地址，<code>*p = 10<\/code> 写 <code>x<\/code>；<code>p = &amp;y<\/code> 改写指针变量本身，让它存 <code>y<\/code> 的地址，这是指针变量的赋值，允许发生。<code>r<\/code> 是 <code>x<\/code> 的引用，<code>r = y<\/code> 在语法层是对象赋值：取 <code>r<\/code> 绑定对象 <code>x<\/code>，把 <code>y<\/code> 的值复制进去；<code>r<\/code> 不会改绑到 <code>y<\/code>。最终 <code>x<\/code> 被赋成 <code>y<\/code> 的值 <code>2<\/code>，<code>y<\/code> 仍是 <code>2<\/code>，输出 <code>2 2<\/code>。把 <code>r = y<\/code> 误读成“引用改绑”，就会预期 <code>r<\/code> 后续跟着 <code>y<\/code> 走，实际行为与预期不符。<\/p>\n<h2>对抗性追问：如果把引用当可空指针用会发生什么<\/h2>\n<p>有人写 <code>int &amp;r = *p;<\/code> 而 <code>p<\/code> 来自外部传入、未做空检查。编译期 <code>p<\/code> 是不是空，编译器未必能证明；运行期若 <code>p<\/code> 为空，解引用得到的地址非法，经引用读写触发段错误。引用语法上没有“判断是否为空”的入口，函数内部想防空也做不到。结论是：可能为空的目标必须用指针传，把空判断留在调用处或函数开头；引用只用于调用方能保证有效的绑定。<\/p>\n<p>再追问：函数返回局部对象的引用会怎样。局部对象在函数返回时析构，返回的引用绑定点随即失效；调用方拿到引用后第一次访问就踩到已回收栈帧。编译器对这类返回常有警告，但语法不禁止；同类问题也出现在返回 <code>new<\/code> 堆对象的指针却忘记配对 <code>delete<\/code>，那是堆上资源泄漏，与栈帧撤销的悬空不是同一条故障路径。<\/p>\n<h2>延伸推演：按值传类对象时复制成本落在哪<\/h2>\n<p>对内置类型按值传，复制几个字节；对类对象按值传，复制动作调用拷贝构造函数。若对象内含一块堆分配的缓冲区，浅拷贝只复制指针值，两个对象指向同一块缓冲区（见概念 c04）；深拷贝则各自分配一块等大缓冲区并逐字节复制，成本随缓冲区大小线性增长。设缓冲区大小为 <span class=\"katex-inline\">n<\/span> 字节：深拷贝的复制工作量为 <span class=\"katex-inline\">O(n)<\/span>，引用绑定不产生缓冲区复制，工作量为 <span class=\"katex-inline\">O(1)<\/span> 的绑定记录。这也是“大对象只读访问一律用 const 引用”的直接原因：引用绑定不复制对象，函数内只读不回写，既避开拷贝成本，又不破坏共享语义。<\/p>\n<h2>延伸推演：悬空引用与悬空指针的故障形态对照<\/h2>\n<ul><li>\n悬空指针：指针变量本身还在，里面存的地址已失效；读指针看不出目标是否有效，访问时才踩到回收内存。\n<\/li><li>\n悬空引用：引用绑定的对象已析构，引用名仍指向原位置；经引用访问同样落到回收内存，且没有“先判空再用”的语法入口。\n<\/li><li>\n两者共同的根源是被引用对象先于绑定它的名字消亡。排查方向一致：检查对象存活期是否覆盖引用/指针的使用区间，栈对象地址不外传，堆对象释放后不再留别名。\n<\/ul>\n<h2>延伸推演：数组名退化与函数参数中的指针形态<\/h2>\n<p>数组名在多数表达式中退化为首元素指针；数组作为函数参数时，形参被调整为指针，数组长度信息在函数内不可直接获得。引用数组可以保留数组类型与长度：<code>int (&amp;ref)[N]<\/code> 绑定数组，不发生退化。这一规则与指针/引用区分相关：指针形态丢失长度，引用形态保留类型信息。<\/p>\n<h2>延伸推演：对象按值返回时的绑定路径<\/h2>\n<p>函数返回局部对象，返回路径上临时对象按右值处理；拷贝或移动构造接收该临时对象（概念 c13）。返回引用给局部对象是悬空来源之一：局部对象随函数返回析构，引用绑定点失效。返回堆对象的指针或引用要明确所有权归属；返回值对象让生命周期随返回值走，避开栈帧回收问题。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n值传递、指针传递、引用传递三者各自复制的是什么？哪一种不产生对象副本？\n<\/li><li>\n引用的三条编译期约束是什么？为什么说“不存在空引用”是语法规则而不是运行期约定？\n<\/li><li>\nconst 引用绑定临时对象时，临时对象的析构时机被推迟到什么时候？非 const 引用绑定临时对象会得到什么结果？\n<\/li><li>\n函数体内 <code>r1 = r2<\/code>（两个引用）完成的是改绑还是对象赋值？依据是什么？\n<\/li><li>\n可能为空的目标为什么必须用指针传，而不能用引用传？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "值、指针、引用与对象生命周期：C++ 相对 C 的语义差别"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C++ Primer Plus：中文版（第六版） (Stephen Prata) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.322<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">值、指针、引用与对象生命周期：C++ 相对 C 的语义差别<\/a><\/span><\/div><h1>存储持续性、作用域、链接性与名称空间<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章（原书第 9 章内存模型和名称空间，9.2 节存储持续性、作用域和链接性，PDF 第 322 页起）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>多源文件程序编译、链接到一起后，同一个名字要回答三件事：内存活到什么时候（存储持续性）；名字在哪些代码位置可见（作用域）；能不能被别的源文件找到（链接性）。C 用全局变量、<code>static<\/code> 与头文件声明处理这些问题，规则分散，容易写出跨文件同名冲突或局部静态状态被意外共享的代码。C++ 用名称空间把名字划分成独立命名域，并用存储期、作用域、链接性三组规则把存活范围与可见范围拆开描述。本概念回答：四类存储持续性各自由谁管理生命周期；各类作用域的可见边界；三种链接性的含义；名称空间怎样避免跨文件撞名。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>存储持续性<\/strong>：对象从获得存储到释放存储的整段时间，分四类（原书 9.2 节，PDF 第 322 页）：<\/p>\n<ul><li>\n自动：函数内局部变量，进入块分配，离开块释放；\n<\/li><li>\n静态：程序整个运行期间存在，启动构造、退出析构，含全局对象、<code>static<\/code> 局部对象、命名空间作用域对象；\n<\/li><li>\n线程：<code>thread_local<\/code> 声明，每线程各一份，线程结束释放；\n<\/li><li>\n动态：<code>new<\/code> 申请的堆对象，存活到对应 <code>delete<\/code> 为止。\n<\/ul>\n<p><strong>作用域<\/strong>：名字在程序文本中可见的区域。局部作用域限于所在块；命名空间作用域从声明点延伸到文件末尾；类作用域属于类成员。内层可声明与外层同名的名字，内层遮蔽外层。<\/p>\n<p><strong>链接性<\/strong>：名字在编译单元之间的可见性。外部链接可被其他编译单元使用（全局非 <code>static<\/code> 变量、普通函数）；内部链接只限本编译单元（文件作用域 <code>static<\/code> 变量与函数）；无链接只在自身作用域存在（局部变量、函数参数）。<\/p>\n<p><strong>名称空间<\/strong>：把一组名字包进独立命名域；域外使用需限定符 <code>命名空间::名字<\/code>，或用 <code>using<\/code> 声明/指令引入。<\/p>\n<h2>原理推导与机制推演<\/h2>\n<p>先推存储期与作用域的分工。存储期回答“活多久”，作用域回答“在哪看得见”，两者正交：函数内 <code>static<\/code> 变量存活整个程序但只在函数内可见；自动对象离开块即释放。<\/p>\n<p>再推链接性落地路径。多文件项目先各自编译成目标文件，编译单元内编译器按声明检查名字，链接阶段再对接外部链接名字。文件作用域不加 <code>static<\/code> 具备外部链接，链接器在其他目标文件找同名定义；加 <code>static<\/code> 为内部链接，名字限制在本编译单元，其他文件同名不冲突。局部变量无链接，不进链接器视野。<\/p>\n<p>名称空间解决外部链接名字撞车：两个库各自定义 <code>sort<\/code>、<code>print<\/code> 这类通用名，分置不同命名空间后按 <code>库A::sort<\/code>、<code>库B::sort<\/code> 区分。<code>using<\/code> 声明引入单个名字；<code>using namespace<\/code> 指令引入整个域，在头文件滥用会把名字污染带回所有包含者。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：跨函数保留状态用函数内 <code>static<\/code>；跨文件共享用外部链接加头文件声明；本文件隐藏辅助函数用文件作用域 <code>static<\/code>；多库通用名共存用命名空间隔离。\n<\/li><li>\n失败案例一：头文件定义不带 <code>static<\/code>/<code>inline<\/code> 的全局变量，每个包含单元各得一份外部定义，链接报重复定义；应头文件放 <code>extern<\/code> 声明，某源文件放定义。\n<\/li><li>\n失败案例二：函数内 <code>static<\/code> 变量被多线程无保护并发读写，产生数据竞争；每线程一份改用 <code>thread_local<\/code>。\n<\/li><li>\n失败案例三：内层同名遮蔽外层，阅读时误以为改的是外层；显式区分名字更可靠。\n<\/li><li>\n边界：跨编译单元静态对象的构造析构顺序无跨文件保证，互相引用易踩未构造或已析构状态。\n<\/li><li>\n边界：<code>static<\/code> 三处分属不同规则——修饰局部变量改存储期，修饰文件作用域符号改链接性，修饰类成员表示属于类。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>存储期 vs 作用域<\/strong>：前者是时间维度，后者是文本维度。静态局部是“长寿命、窄可见”，自动局部是“短寿命、窄可见”，全局是“长寿命、宽可见”。\n<\/li><li>\n<strong>外部链接 vs 内部链接<\/strong>：前者进入跨文件符号表可被引用；后者编译单元私有，不同文件同名互不干扰。\n<\/li><li>\n<strong><code>using<\/code> 声明 vs <code>using<\/code> 指令<\/strong>：前者引入指定名字，后者引入整个命名空间；头文件写 <code>using namespace<\/code> 会把名字扩散到所有包含者。\n<\/li><li>\n<strong>静态成员 vs 静态局部变量<\/strong>：类 <code>static<\/code> 成员属于类、全类一份；函数内 <code>static<\/code> 局部属于函数，首次进入时初始化。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的值、指针、引用模型是讨论存储位置的基础。后继：概念 c03 类对象按构造顺序初始化；概念 c04 拷贝时区分静态对象与堆对象；概念 c12 智能指针管理动态存储期下的堆对象生命周期。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（存储持续性、作用域、链接性与名称空间）<\/summary><div class=\"depth-body\"><h1>c02 深度推演：四类存储期、三种链接性与名称空间的落地路径<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把内存模型讲清，先往回追四层前提：<\/p>\n<ol><li>\n程序先按编译单元各自编译，再由链接器拼到一起。编译器在单个文件内检查类型与作用域；跨文件的名字对接发生在链接阶段。不区分这两个阶段，就解释不了“编译通过却链接报重复定义”这类故障。\n<\/li><li>\n对象必须先有存储，名字才能绑定到存储上。存储从哪来、活到什么时候，由存储持续性决定；名字在文本哪些位置可见，由作用域决定。这两件事回答的是不同问题，不能互相替代。\n<\/li><li>\n跨文件共享名字需要进入链接器符号表，这就是链接性；不进符号表的名字只在编译单元内部存在。\n<\/li><li>\n多库并存时通用函数名容易撞车，名称空间提供一层命名隔离，把“名字相同”与“符号冲突”分开。\n<\/ol>\n<p>依赖链方向：编译/链接两阶段模型 → 存储期决定生命周期 → 作用域决定可见文本范围 → 链接性决定跨文件可见性 → 名称空间做命名隔离。<\/p>\n<h2>正向推导：逐行走一段含四种存储期的代码<\/h2>\n<h3>算例代码<\/h3>\n<pre class=\"lang-cpp\"><code>#include &lt;iostream&gt;\n\nint globalCount = 0;              // 静态存储期，外部链接\n\nstatic int fileCount = 0;         // 静态存储期，内部链接\n\nvoid counter() {\n    static int callCount = 0;     // 静态存储期，局部作用域，无链接\n    int local = 0;                // 自动存储期，局部作用域，无链接\n    callCount++;\n    local++;\n    globalCount++;\n    fileCount++;\n    std::cout &lt;&lt; callCount &lt;&lt; &#x27; &#x27; &lt;&lt; local &lt;&lt; &#x27; &#x27;\n              &lt;&lt; globalCount &lt;&lt; &#x27; &#x27; &lt;&lt; fileCount &lt;&lt; &#x27;\\n&#x27;;\n}\n\nint main() {\n    counter();\n    counter();\n    counter();\n    return 0;\n}<\/code><\/pre>\n<h3>编译期做什么<\/h3>\n<p>第一步，编译器扫描文件作用域：<code>globalCount<\/code> 是普通全局定义，具备外部链接，符号进入本编译单元的导出表；<code>fileCount<\/code> 带 <code>static<\/code>，具备内部链接，符号不导出。<\/p>\n<p>第二步，进入 <code>counter<\/code> 函数体：<code>callCount<\/code> 带 <code>static<\/code>，编译器把它安排到静态存储区，而不是栈帧；<code>local<\/code> 不带 <code>static<\/code>，安排进栈帧。静态局部变量的初始化只在程序首次进入该函数时执行一次，编译器额外记录初始化标志。<\/p>\n<p>第三步，类型检查：自增与输出语句按各自类型匹配；<code>callCount<\/code>、<code>local<\/code>、<code>globalCount<\/code>、<code>fileCount<\/code> 都是 <code>int<\/code>，输出流拼接通过。<\/p>\n<h3>运行期与内存怎么变<\/h3>\n<p>程序启动阶段，静态存储区的 <code>globalCount<\/code>、<code>fileCount<\/code> 被默认初始化为 0；<code>callCount<\/code> 不在启动期初始化，首次进入 <code>counter<\/code> 时置 0。<\/p>\n<p>第一次调用 <code>counter<\/code>：栈帧为 <code>local<\/code> 分配位置并置 0；<code>callCount<\/code> 从 0 自增到 1，<code>local<\/code> 从 0 自增到 1，<code>globalCount<\/code> 到 1，<code>fileCount<\/code> 到 1，输出 <code>1 1 1 1<\/code>。函数返回，栈帧撤销，<code>local<\/code> 的位置收回；<code>callCount<\/code>、<code>globalCount<\/code>、<code>fileCount<\/code> 留在静态存储区。<\/p>\n<p>第二次调用：新栈帧里的 <code>local<\/code> 重新置 0 再自增到 1；<code>callCount<\/code> 保留上次的 1，自增到 2；<code>globalCount<\/code> 到 2，<code>fileCount<\/code> 到 2，输出 <code>2 1 2 2<\/code>。<\/p>\n<p>第三次调用沿同一路径：<code>callCount<\/code> 到 3，<code>local<\/code> 仍为 1，<code>globalCount<\/code> 到 3，<code>fileCount<\/code> 到 3，输出 <code>3 1 3 3<\/code>。<\/p>\n<p>对照四个数字可以看出分工：<code>local<\/code> 每次调用从零开始（自动存储期）；<code>callCount<\/code> 跨调用保留（静态存储期、局部作用域）；<code>globalCount<\/code> 与 <code>fileCount<\/code> 也跨调用保留，区别在链接性——前者可被其他文件引用，后者被限制在本文件。<\/p>\n<h3>静态存储区与栈区的位置差别<\/h3>\n<p>静态存储区在程序加载时划定，对象地址在整个运行期间稳定；栈区随函数调用伸缩，栈帧位置每次调用可能不同。静态局部变量放在静态存储区而不是栈上，这是它离开函数后值仍在的直接原因；把静态局部变量误放到栈上，函数返回后值随栈帧回收，与观察到的跨调用累加行为矛盾。<\/p>\n<h2>具体算例：头文件全局变量的重复定义故障<\/h2>\n<h3>出错写法<\/h3>\n<p><code>helper.h<\/code>：<\/p>\n<pre class=\"lang-cpp\"><code>int cache = 0;   // 头文件内直接定义，外部链接<\/code><\/pre>\n<p><code>a.cpp<\/code>：<\/p>\n<pre class=\"lang-cpp\"><code>#include &quot;helper.h&quot;\nvoid fa() { cache++; }<\/code><\/pre>\n<p><code>b.cpp<\/code>：<\/p>\n<pre class=\"lang-cpp\"><code>#include &quot;helper.h&quot;\nvoid fb() { cache++; }<\/code><\/pre>\n<h3>推演过程<\/h3>\n<p>编译阶段：<code>a.cpp<\/code> 与 <code>b.cpp<\/code> 各自包含 <code>helper.h<\/code>，各自编译出一份外部链接的 <code>cache<\/code> 定义，两个目标文件各自编译通过。链接阶段：链接器看到两个编译单元导出同名外部符号 <code>cache<\/code>，违反“同一外部链接变量只能有一处定义”的规则，报重复定义错误。<\/p>\n<h3>正确写法<\/h3>\n<p><code>helper.h<\/code> 放声明：<\/p>\n<pre class=\"lang-cpp\"><code>extern int cache;<\/code><\/pre>\n<p>某一个 <code>.cpp<\/code> 放定义：<\/p>\n<pre class=\"lang-cpp\"><code>int cache = 0;<\/code><\/pre>\n<p>这样所有编译单元看到的是同一个外部符号，定义只出现一次。若确实想让每个编译单元各持一份独立副本，可在头文件定义上加 <code>static<\/code>（内部链接），但这属于“每文件一份”的隔离语义，不是跨文件共享。<\/p>\n<h2>对抗性追问：去掉 static 局部变量的静态存储期会怎样<\/h2>\n<p>若把 <code>counter<\/code> 里的 <code>static int callCount<\/code> 改成普通局部变量，每次进入函数都在栈帧重新分配、重新初始化 0，自增到 1 后随返回销毁；三次调用输出的第一个数字永远是 <code>1<\/code>，跨调用累加的观察行为消失。反过来，若把 <code>local<\/code> 改成 <code>static<\/code>，它也会跨调用保留值，第二次调用从 1 自增到 2，这与“局部临时变量每次重置”的预期不符。存储期改动直接改变运行期数据保留范围。<\/p>\n<p>再追问：多线程下函数内静态局部变量会出什么问题。<code>callCount<\/code> 全程序一份，两个线程同时执行 <code>callCount++<\/code>，自增动作在机器码层面通常是读、加、写三步，线程交错时可能两个线程读到同一个旧值，各自加一后写回，计数少加。需要每线程一份时改用 <code>thread_local<\/code>；需要跨线程共享且计数准确，要配合同步手段。<\/p>\n<h2>延伸推演：名称空间怎样隔离同名符号<\/h2>\n<pre class=\"lang-cpp\"><code>namespace engineA {\n    int version = 1;\n}\nnamespace engineB {\n    int version = 2;\n}\n\nint main() {\n    return engineA::version + engineB::version;  // 1 + 2\n}<\/code><\/pre>\n<p>编译期：两个 <code>version<\/code> 分属不同命名域，符号内部按命名空间修饰区分，不会撞名。域外访问必须带 <code>engineA::<\/code> 限定，或先用 <code>using engineA::version;<\/code> 把单个名字引入当前作用域。若在头文件写 <code>using namespace engineB;<\/code>，每个包含该头文件的文件都会把 <code>version<\/code> 等名字带进全局域，与其他库同名定义冲突的面被放大到所有包含者。<\/p>\n<h2>延伸推演：静态对象的构造析构顺序边界<\/h2>\n<p>静态存储期对象在程序启动阶段按所在编译单元内的定义顺序构造；跨编译单元之间的构造顺序没有标准保证。文件 A 的静态对象初始化时引用文件 B 的静态对象，B 的对象可能尚未构造，拿到未初始化状态。析构按构造的逆序在程序退出时执行，跨单元引用同样踩在顺序不确定的区间内。规避方式是把跨单元共享的静态对象包进函数内静态局部变量，在首次访问时才构造（Meyers 单例思路），把构造推迟到使用点。<\/p>\n<h2>延伸推演：函数内静态局部变量的初始化线程安全<\/h2>\n<p>函数内 <code>static<\/code> 局部变量在控制流首次到达声明处时初始化；C++11 起，这一初始化在并发下受保护：多个线程同时首次进入函数，变量只被构造一次。初始化完成后的读写仍需自行同步，静态变量全程序一份，并发修改不加锁就是数据竞争。需要每线程独立状态改用 <code>thread_local<\/code>，其存储在线程结束时释放，生命周期与线程对齐。<\/p>\n<h2>延伸推演：匿名命名空间与内部链接的等价位置<\/h2>\n<p>文件作用域写 <code>static<\/code> 函数或变量获得内部链接；现代写法也用匿名命名空间包裹本文件私有符号。两者效果接近：名字不导出到链接器符号表，其他文件同名不冲突。头文件中不应放具名外部链接定义；只想在本文件可见的辅助符号收进内部链接或匿名命名空间，避免污染全局命名域。<\/p>\n<h2>延伸推演：const 与链接性的组合<\/h2>\n<p>全局 <code>const<\/code> 对象在默认情况下具备内部链接（与普通全局变量不同），可以在头文件中定义而不产生重复定义；需要跨文件共享时在声明与定义上加 <code>extern<\/code>。局部 <code>const<\/code> 仍是无链接的栈上对象，规则与链接性无关。读多文件代码时，先看名字在文件作用域还是局部作用域，再看有无 <code>static<\/code>、<code>extern<\/code>、<code>namespace<\/code> 修饰，链接性归属才能定准。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n四类存储持续性分别由谁分配和释放对象？<code>thread_local<\/code> 对象在哪一维度上与普通静态对象不同？\n<\/li><li>\n存储期与作用域回答的问题有什么分工？举一个“长寿命、窄可见”的对象例子。\n<\/li><li>\n外部链接、内部链接、无链接三者在链接阶段的可见范围有何差别？文件作用域 <code>static<\/code> 改变的是哪一项？\n<\/li><li>\n头文件里直接定义外部链接全局变量，编译期与链接期分别表现为什么？正确的声明/定义分离怎么写？\n<\/li><li>\n函数内 <code>static<\/code> 局部变量在多线程环境下有什么风险？什么情况下应改用 <code>thread_local<\/code>？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "存储持续性、作用域、链接性与名称空间"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C++ Primer Plus：中文版（第六版） (Stephen Prata) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.370<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">值、指针、引用与对象生命周期：C++ 相对 C 的语义差别<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">存储持续性、作用域、链接性与名称空间<\/a><\/span><\/div><h1>构造函数、析构函数与成员初始化列表<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书第 10 章对象和类 10.3 节类的构造函数和析构函数，PDF 第 370 页起；第 12 章类和动态内存分配 12.2 节）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>C 的结构体只有数据，字段值全靠调用者手动赋值。类把数据与操作打包后，对象诞生那一刻就要被摆到合法状态：成员初始化好，资源申请好；消亡时也要有人归还资源。若靠“使用者记得创建后手动调初始化函数”，漏掉一次对象就落在非法状态。C++ 用构造函数保证创建必经初始化路径，析构函数保证销毁必经清理路径，初始化列表把成员构造提到函数体之前。本概念回答：构造函数何时调用、可重载成哪些形式；析构承担什么责任；列表与函数体赋值的差别；成员按什么顺序初始化，顺序错了踩什么未定义行为。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>构造函数<\/strong>：与类同名、无返回类型的成员函数，对象创建时自动调用，把对象初始化为合法状态；可重载多个版本，不带参数的称默认构造函数。<\/p>\n<p><strong>析构函数<\/strong>：<code>~类名<\/code>，无参数无返回类型，对象生命周期结束时自动调用，释放持有资源；栈对象离开作用域调用，堆对象在 <code>delete<\/code> 时调用。<\/p>\n<p><strong>成员初始化列表<\/strong>：写在参数表后、函数体前，形式 <code>构造函数(形参) : 成员1(初值1), 成员2(初值2) { ... }<\/code>。列表成员在进入函数体前完成构造；函数体内 <code>成员 = 值<\/code> 是先默认构造再赋值，不是初始化。<\/p>\n<p><strong>初始化顺序规则<\/strong>：成员按类中声明先后初始化，不按列表书写顺序；两者不一致时编译器给重排警告。<\/p>\n<p><strong>必须进列表的成员<\/strong>：<code>const<\/code> 成员、引用成员、无默认构造的基类或成员对象——无法在函数体内再赋值，只能列表阶段初始化。<\/p>\n<h2>原理推导与机制推演<\/h2>\n<p>先推对象诞生路径。<code>类名 对象(实参);<\/code> 先分配存储（栈上或堆上），再选定匹配构造函数；进入函数体前，列表按声明顺序逐个构造成员；列表走完才执行函数体语句。函数体内 <code>= 值<\/code> 时成员已构造，这一步是赋值，构造与赋值是两个阶段。<\/p>\n<p>再推顺序与声明分离的原因。成员在内存按声明顺序排布，基类子对象先于派生类成员构造，析构按构造逆序。语言把初始化顺序固定为声明顺序，使先构造先析构、后构造后析构形成稳定逆序，避免成员互引时析构顺序不确定。列表只给初值表达式，执行顺序仍服从声明顺序。<\/p>\n<p>推一个依赖声明顺序的例子：先声明 <code>int a;<\/code> 再声明 <code>int b;<\/code>，想让 <code>b<\/code> 等于 <code>a<\/code>。列表写成 <code>b(a), a(0)<\/code> 看似先 <code>b<\/code> 后 <code>a<\/code>；实际 <code>a<\/code> 先初始化，<code>b<\/code> 再用 <code>a<\/code> 初始化。若 <code>b<\/code> 排在 <code>a<\/code> 前声明，<code>b(a)<\/code> 读到尚未构造的 <code>a<\/code>，属未定义行为。<\/p>\n<p>析构路径与构造对称：先执行析构体，再按构造逆序析构成员，存储收回。持有堆资源的类由析构 <code>delete<\/code> 资源（配套规则见概念 c04）。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：成员能在列表阶段给初值就优先列表，避开先默认构造再赋值的二次动作；<code>const<\/code>、引用、无默认构造成员必须进列表；资源申请放构造，释存放析构。\n<\/li><li>\n失败案例一：列表顺序与声明顺序相反，且后声明成员依赖先声明成员初值；代码能编译，顺序与直觉不符，开警告才暴露。\n<\/li><li>\n失败案例二：函数体给 <code>const<\/code>/引用成员赋值，两类成员一经绑定不可再赋值，编译报错，必须移到列表。\n<\/li><li>\n失败案例三：构造函数抛异常，对象未构造完成，析构不被调用；已构造成员由编译器逆序析构，体内裸申请的资源需自行在异常路径释放。\n<\/li><li>\n边界：写了带参构造却没写默认构造，编译器不再生成默认版本，无参创建编译失败。\n<\/li><li>\n边界：析构函数不能带参数、不能重载，一个类只有一个析构。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>列表 vs 函数体赋值<\/strong>：列表阶段直接用初值构造；函数体赋值是先默认构造再覆盖。类类型成员后者多一次构造加一次赋值；<code>const<\/code> 与引用成员后者写不通。\n<\/li><li>\n<strong>构造函数 vs 成员函数<\/strong>：构造无返回类型、创建对象时由编译器调用；普通成员由对象显式调用。\n<\/li><li>\n<strong>构造顺序 vs 析构顺序<\/strong>：基类先构造，再按声明顺序构造派生成员；析构先派生析构体，再逆序析构成员，最后析构基类。两条顺序严格镜像。\n<\/li><li>\n<strong>默认构造 vs 带参构造<\/strong>：默认构造可无参调用；写了带参构造后编译器不再自动生成默认构造。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的对象生命周期与概念 c02 的存储期决定存储落点。后继：概念 c04 拷贝构造是构造函数的特殊重载，深拷贝与三/五法则建立在构造/析构配对上；概念 c07 多态基类析构必须为虚，保证经基类指针删除派生对象时析构链完整。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（构造函数、析构函数与成员初始化列表）<\/summary><div class=\"depth-body\"><h1>c03 深度推演：对象诞生与销毁的构造链、初始化顺序与资源配对<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把构造与析构讲透，先往回追四层前提：<\/p>\n<ol><li>\n对象必须先有存储，构造函数才有操作对象的位置。栈对象存储在栈帧，堆对象存储在 <code>new<\/code> 申请的堆块，静态对象存储在静态区；存储期由概念 c02 的规则决定。\n<\/li><li>\n类把数据成员打包在一起，成员在内存中按声明顺序排布；基类子对象位于派生类对象前部。排布顺序决定了构造与析构的稳定次序。\n<\/li><li>\n成员对象自身也有构造函数。初始化一个成员就是调用它的构造函数；没给初值时调用默认构造。\n<\/li><li>\n资源申请与释放必须成对。构造函数负责把对象摆到合法状态，析构函数负责把申请到的资源归还；这条配对思路是后续智能指针与 RAII 的基础。\n<\/ol>\n<p>依赖链方向：存储位置 → 成员排布顺序 → 成员构造调用 → 构造函数体 → 析构逆序回收。<\/p>\n<h2>正向推导：逐行还原对象创建到销毁的全过程<\/h2>\n<h3>算例代码<\/h3>\n<pre class=\"lang-cpp\"><code>#include &lt;iostream&gt;\nusing namespace std;\n\nclass Box {\n    int width;\n    int height;\npublic:\n    Box(int w, int h) : width(w), height(h) {\n        cout &lt;&lt; &quot;Box(&quot; &lt;&lt; width &lt;&lt; &quot;, &quot; &lt;&lt; height &lt;&lt; &quot;)\\n&quot;;\n    }\n    ~Box() {\n        cout &lt;&lt; &quot;~Box(&quot; &lt;&lt; width &lt;&lt; &quot;, &quot; &lt;&lt; height &lt;&lt; &quot;)\\n&quot;;\n    }\n};\n\nint main() {\n    Box small(3, 4);          // 栈对象\n    Box *big = new Box(5, 6); // 堆对象\n    delete big;\n    return 0;\n}<\/code><\/pre>\n<h3>编译期做什么<\/h3>\n<p>第一步，编译器为 <code>Box<\/code> 确定成员布局：<code>width<\/code> 先声明，排在前；<code>height<\/code> 后声明，排在后。构造函数 <code>Box(int, int)<\/code> 的初始化列表给出两个成员的初值表达式。<\/p>\n<p>第二步，检查列表与声明顺序：列表 <code>width(w), height(h)<\/code> 与声明顺序一致，不触发重排警告。函数体内只有输出语句，不再对成员赋值。<\/p>\n<p>第三步，<code>main<\/code> 中 <code>Box small(3, 4)<\/code> 选定带参构造；<code>new Box(5, 6)<\/code> 先申请堆存储再调用同一构造。<code>delete big<\/code> 先调用析构函数再释放堆块。<\/p>\n<h3>运行期与内存怎么变<\/h3>\n<p><code>Box small(3, 4)<\/code>：栈帧为 <code>small<\/code> 分配两个 <code>int<\/code> 的位置；进入构造函数前，列表按声明顺序先构造 <code>width = 3<\/code>，再构造 <code>height = 4<\/code>；随后进入函数体输出 <code>Box(3, 4)<\/code>。<\/p>\n<p><code>new Box(5, 6)<\/code>：堆上分配两个 <code>int<\/code> 的位置，同样先 <code>width = 5<\/code>、后 <code>height = 6<\/code>，函数体输出 <code>Box(5, 6)<\/code>，指针 <code>big<\/code> 存这块堆地址。<\/p>\n<p><code>delete big<\/code>：先调用析构函数输出 <code>~Box(5, 6)<\/code>，再释放堆块。<code>main<\/code> 返回时，栈对象 <code>small<\/code> 离开作用域，析构输出 <code>~Box(3, 4)<\/code>。完整输出顺序：<\/p>\n<pre class=\"lang-text\"><code>Box(3, 4)\nBox(5, 6)\n~Box(5, 6)\n~Box(3, 4)<\/code><\/pre>\n<p>栈对象析构顺序与构造顺序相反：<code>small<\/code> 后构造，先随 <code>main<\/code> 返回析构；堆对象的析构时机由 <code>delete<\/code> 位置决定，不依赖作用域退出。<\/p>\n<h2>具体算例：成员初始化顺序服从声明顺序，不服从列表顺序<\/h2>\n<h3>正确写法<\/h3>\n<pre class=\"lang-cpp\"><code>class Pair {\n    int a;\n    int b;\npublic:\n    Pair(int x) : a(x), b(a) {}  // 声明顺序 a 先、b 后，b 用 a 的值\n    int getA() const { return a; }\n    int getB() const { return b; }\n};<\/code><\/pre>\n<p>推演：声明顺序 <code>a<\/code> 在前、<code>b<\/code> 在后。列表先写 <code>a(x)<\/code> 再写 <code>b(a)<\/code>，执行顺序与之一致：<code>a<\/code> 先被置为形参 <code>x<\/code>，<code>b<\/code> 再用已构造好的 <code>a<\/code> 初始化，<code>b<\/code> 与 <code>a<\/code> 相等。<\/p>\n<h3>顺序颠倒的写法<\/h3>\n<pre class=\"lang-cpp\"><code>class BadPair {\n    int a;\n    int b;\npublic:\n    BadPair(int x) : b(a), a(x) {}  // 列表先写 b，实际 a 先初始化\n};<\/code><\/pre>\n<p>推演：阅读列表以为 <code>b(a)<\/code> 先执行，此时 <code>a<\/code> 尚未构造；实际执行顺序按声明顺序，<code>a<\/code> 先被 <code>x<\/code> 初始化，<code>b<\/code> 再用 <code>a<\/code> 初始化。本例中 <code>a<\/code> 有初值 <code>x<\/code>，<code>b<\/code> 读到的是 <code>x<\/code>，表面结果碰巧正常；编译器仍会对列表顺序与声明顺序不一致给出 <code>-Wreorder<\/code> 警告。<\/p>\n<h3>真正踩雷的变体<\/h3>\n<pre class=\"lang-cpp\"><code>class Risky {\n    int b;\n    int a;\npublic:\n    Risky(int x) : a(x), b(a) {}  // 声明顺序 b 在前、a 在后\n};<\/code><\/pre>\n<p>这里声明顺序是 <code>b<\/code> 先、<code>a<\/code> 后。列表写 <code>a(x), b(a)<\/code>，实际先初始化 <code>b<\/code>，而 <code>b(a)<\/code> 表达式里的 <code>a<\/code> 还没构造，读到的是 <code>a<\/code> 所在位置的未初始化值；随后 <code>a<\/code> 才被置为 <code>x<\/code>。<code>b<\/code> 的初值是未定义行为，输出不可预测。修正方式是把列表顺序改成与声明顺序一致，或调整成员声明顺序，让被依赖的成员排在前面。<\/p>\n<h2>第二算例：const 成员与引用成员只能进初始化列表<\/h2>\n<pre class=\"lang-cpp\"><code>class Holder {\n    const int id;\n    int &amp;ref;\npublic:\n    Holder(int v, int &amp;r) : id(v), ref(r) {}  // 必须在列表绑定\n};<\/code><\/pre>\n<p>推演：<code>id<\/code> 是 <code>const<\/code> 成员，一经初始化不能再赋值；<code>ref<\/code> 是引用成员，绑定后不能改绑。两者都无法在构造函数体内用 <code>= <\/code> 完成，编译器只接受列表阶段初始化。若把 <code>id(v)<\/code>、<code>ref(r)<\/code> 从列表挪到函数体写 <code>id = v; ref = r;<\/code>，编译期直接报错：<code>const<\/code> 成员不可赋值，引用不可重绑。<\/p>\n<h2>对抗性追问：构造函数体内申请资源后抛异常会怎样<\/h2>\n<pre class=\"lang-cpp\"><code>class FileHolder {\n    int *buffer;\npublic:\n    FileHolder(int n) {\n        buffer = new int[n];\n        if (n &lt;= 0) throw std::invalid_argument(&quot;n&quot;);\n        // 若异常抛出，buffer 指向的堆块不会随对象析构回收\n    }\n    ~FileHolder() { delete[] buffer; }\n};<\/code><\/pre>\n<p>推演：对象尚未构造完成时构造函数抛出异常，编译器不会调用这个对象的析构函数。<code>buffer<\/code> 在异常前已 <code>new<\/code> 出来，但析构路径不会执行，堆块泄漏。已在列表阶段构造好的成员由编译器按逆序自动析构；函数体内裸申请、还没挂进成员管理的资源，需要在异常发生前自行释放，或改用智能指针持有（概念 c12），让成员对象在异常路径上自动析构。<\/p>\n<p>再追问：去掉析构函数会怎样。类持有堆缓冲区却不写析构函数，对象销毁时缓冲区不会被 <code>delete<\/code>，内存随对象销毁持续泄漏；编译器生成的默认析构函数只析构成员本身，不会替成员 <code>delete<\/code> 它指向的堆块。<\/p>\n<h2>延伸推演：基类与派生类的构造析构链<\/h2>\n<p>派生类对象创建时，先调用基类构造函数构造基类子对象，再按声明顺序构造派生类成员，最后执行派生类构造函数体。销毁时顺序镜像：先执行派生类析构体，逆序析构派生类成员，最后析构基类子对象。派生类构造函数列表中未显式写基类构造时，编译器调用基类默认构造；基类没有默认构造时，必须在列表中显式指定基类构造参数。多态场景下基类析构函数应声明为虚函数（概念 c07），否则经基类指针删除派生对象时，派生类析构链不会完整展开。<\/p>\n<h2>延伸推演：委托构造与初始化复用<\/h2>\n<p>一个类的多个构造函数有公共初始化动作时，C++11 允许一个构造函数在列表中调用同类另一个构造函数（委托构造），避免把同一组成员初值复制粘贴到多个版本。被委托的构造函数先执行完，委托构造函数体再执行。委托目标与成员初始化列表不能同时罗列同一成员；这条限制是为了避免同一成员被两条路径重复构造。<\/p>\n<h2>延伸推演：explicit 构造函数与默认成员初始化<\/h2>\n<p>单参数构造函数定义了隐式转换路径；声明 <code>explicit<\/code> 后只能在显式构造处调用，阻止实参类型自动转成类对象。多个构造函数重载时，隐式转换参与重载决议可能选错版本，关键构造函数加 <code>explicit<\/code> 收口。<\/p>\n<p>类内可以在成员声明处直接给默认初值；构造函数列表未提及的成员按声明处默认值初始化。成员初值来源优先级：初始化列表指定的值高于声明处默认值，声明处默认值高于成员默认构造。整理构造逻辑时，公共默认初值放声明处，各构造差异放列表，避免在多个构造函数体里重复赋值。<\/p>\n<h2>延伸推演：拷贝/移动构造与初始化列表的位置<\/h2>\n<p>拷贝构造、移动构造也是构造函数，成员同样在列表阶段初始化。深拷贝构造在列表中接管或复制源对象成员，函数体只做补充校验；移动构造在列表中接管源对象资源，函数体把源对象字段置空。构造函数体抛出异常时，列表阶段已构造好的成员由编译器逆序析构，函数体内裸申请的资源不在自动回收范围（概念 c09）。<\/p>\n<h2>对抗性追问再补：成员依赖基类子对象的初始化顺序<\/h2>\n<p>派生类构造时基类子对象先于派生类成员构造；派生类成员初始化列表中可以引用基类子对象的状态。顺序反过来不成立：派生类成员先构造时基类子对象尚未就位，读到基类成员属于未定义状态。整理继承体系初始化顺序时，先确认基类构造参数，再排派生类成员列表。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n对象创建时，初始化列表阶段与构造函数体阶段各做什么？函数体内的 <code>成员 = 值<\/code> 属于初始化还是赋值？\n<\/li><li>\n成员初始化按什么顺序执行？列表书写顺序与声明顺序不一致时编译器给出什么提示？\n<\/li><li>\n哪几类成员必须放在初始化列表中？写在函数体赋值为什么编译不过？\n<\/li><li>\n构造函数抛出异常时，析构函数会不会被调用？已构造好的成员由谁回收？\n<\/li><li>\n基类子对象与派生类成员的构造、析构先后顺序是什么？两条顺序如何镜像？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "构造函数、析构函数与成员初始化列表"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C++ Primer Plus：中文版（第六版） (Stephen Prata) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.443<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">构造函数、析构函数与成员初始化列表<\/a><\/span><\/div><h1>拷贝构造与赋值：深浅拷贝与三/五法则<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2 章（原书第 12 章类和动态内存分配，12.1–12.3 节，PDF 第 443 页起）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>类对象会被复制：按值传参、按值返回、用已有对象初始化新对象、对象间赋值。成员只是内置类型时，编译器默认逐成员复制就能工作；一旦类内用指针持有堆缓冲区，逐成员复制只把指针值抄过去，两个对象指向同一块内存。一方析构释放缓冲区，另一方指针悬空；双方析构同一块内存被释放两次，触发重复释放。本概念回答：拷贝构造在什么时机调用、默认版本做什么；浅拷贝与深拷贝分界在哪；拷贝赋值与拷贝构造的差别；三法则与五法则各覆盖哪几个函数。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>拷贝构造函数<\/strong>：特殊构造函数，签名 <code>类名(const 类名 &amp;other)<\/code>。用已有同类型对象初始化新对象时调用；默认版本由编译器生成，逐成员复制。<\/p>\n<p><strong>拷贝赋值运算符<\/strong>：成员函数 <code>类名 &amp;operator=(const 类名 &amp;other)<\/code>。已存在对象之间赋值时调用，需处理自赋值与旧资源释放。<\/p>\n<p><strong>浅拷贝<\/strong>：逐成员复制值。指针成员被复制的是地址值，新旧对象共享同一块堆缓冲区，缓冲区内容不复制。<\/p>\n<p><strong>深拷贝<\/strong>：为新对象单独分配等大缓冲区，逐字节复制源缓冲区内容；新旧各持独立内存，析构互不影响。<\/p>\n<p><strong>三法则<\/strong>：类需要自定义析构、拷贝构造、拷贝赋值三者之一时，通常三者都要自定义。理由是类持手动管理资源时，默认另外两个拷贝动作会把资源共享成浅拷贝。<\/p>\n<p><strong>五法则<\/strong>：三法则再加移动构造与移动赋值；需要接管资源的类把五个特殊函数都明确写出（移动语义见概念 c13）。<\/p>\n<h2>原理推导与机制推演<\/h2>\n<p>先推默认拷贝行为。编译器生成的拷贝构造对每个成员复制：内置成员复制值，类成员调用其拷贝构造。指针成员复制地址，不触碰地址指向的缓冲区，两个对象指针相等指向同一堆块。<\/p>\n<p>再推故障链。设类内含 <code>char *str<\/code>，构造时 <code>new char[]<\/code> 申请缓冲区。<code>a<\/code> 经默认拷贝复制出 <code>b<\/code>：<code>b.str<\/code> 与 <code>a.str<\/code> 存同一地址。<code>a<\/code> 析构 <code>delete[] str<\/code> 释放该块；<code>b<\/code> 析构再 <code>delete[]<\/code> 同一地址，重复释放破坏堆管理器空闲链。中途一方经指针改写缓冲区，另一方读到的内容跟着变，共享语义也与独立副本预期不符。<\/p>\n<p>深拷贝修法：拷贝构造先按源缓冲区长度 <code>new<\/code> 新内存，再复制内容；新对象指针指向新块，与源对象互不重叠。拷贝赋值在深拷贝外多一步：先释放 <code>this<\/code> 旧缓冲区，再分配新块复制内容，并检查自赋值。<\/p>\n<p>三法则推理链：类自己写析构，说明持有需手动释放资源；默认拷贝只抄指针，必然共享资源；因此拷贝构造与拷贝赋值也必须写成深拷贝，缺任何一条都留浅拷贝入口。五法则在移动语义引入后补两个移动版本：移动接管源对象指针、源对象置空，避免深拷贝。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：类持裸指针自行 <code>new<\/code>/<code>delete<\/code> 时，写深拷贝的拷贝构造与赋值；对象独占一份资源时考虑移动版本；不需拷贝的类可显式删除拷贝构造与赋值。\n<\/li><li>\n失败案例一：两个对象析构同一缓冲区（double free），默认浅拷贝加自定义析构是最典型组合。\n<\/li><li>\n失败案例二：拷贝赋值未查自赋值，<code>a = a<\/code> 先释放自身缓冲区，随后从已释放内存复制。\n<\/li><li>\n失败案例三：拷贝赋值只复制指针不释放旧缓冲区，旧块地址被覆盖后找不到入口，泄漏。\n<\/li><li>\n边界：成员是值语义且无裸资源时，默认逐成员拷贝足够；能用容器或智能指针管理资源就优先用它们。\n<\/li><li>\n边界：拷贝构造参数必须是引用类型；按值传参作为参数会引发无限递归。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>拷贝构造 vs 拷贝赋值<\/strong>：构造用于新对象诞生，目标此前不存在；赋值用于两个已存在对象，目标先持旧资源，需先释放再覆盖。\n<\/li><li>\n<strong>浅拷贝 vs 深拷贝<\/strong>：浅拷贝共享堆资源，副本与原件指向同一缓冲区；深拷贝各持独立缓冲区。判据是指针资源有没有重新分配并复制内容。\n<\/li><li>\n<strong>三法则 vs 五法则<\/strong>：三法则覆盖析构、拷贝构造、拷贝赋值；五法则再补移动构造、移动赋值。缺移动版本退回深拷贝，语义正确但成本更高。\n<\/li><li>\n<strong>默认生成 vs 显式删除<\/strong>：类未声明拷贝构造时编译器按需生成；<code>= delete<\/code> 后拷贝请求编译期报错，用于禁止复制的独占资源类。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 按值传递会触发拷贝构造；概念 c03 构造/析构配对是资源释放落点。后继：概念 c12 智能指针用计数或独占语义接管裸资源；概念 c13 移动语义在深拷贝路径上提供接管资源的低成本替代。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（拷贝构造与赋值：深浅拷贝与三/五法则）<\/summary><div class=\"depth-body\"><h1>c04 深度推演：浅拷贝故障链、深拷贝逐行实现与三/五法则推导<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把拷贝规则讲透，先往回追四层前提：<\/p>\n<ol><li>\n对象按值出现时会被复制：按值传参、按值返回、初始化新对象、对象赋值，每条路径都要落到一个拷贝动作上。\n<\/li><li>\n类对象的复制默认逐成员进行；内置成员复制值，类成员调用其拷贝构造，指针成员只复制地址。\n<\/li><li>\n持有堆缓冲区的类，资源所有权只能属于一个对象；两个对象共享一块缓冲区，释放责任就无法分清。\n<\/li><li>\n析构函数负责释放资源；拷贝路径决定资源是否被复制。析构、拷贝构造、拷贝赋值三个动作围绕同一块资源，必须口径一致，这是三法则的来源。\n<\/ol>\n<p>依赖链方向：按值复制场景 → 默认逐成员拷贝 → 指针成员共享堆块 → 双重释放与泄漏故障 → 深拷贝与五函数配对。<\/p>\n<h2>正向推导：逐行还原默认浅拷贝的故障路径<\/h2>\n<h3>出错代码<\/h3>\n<pre class=\"lang-cpp\"><code>#include &lt;cstring&gt;\n\nclass Blob {\n    char *data;\npublic:\n    Blob(const char *s) {\n        data = new char[std::strlen(s) + 1];\n        std::strcpy(data, s);\n    }\n    ~Blob() { delete[] data; }\n};\n\nint main() {\n    Blob a(&quot;alpha&quot;);\n    Blob b(a);   // 默认拷贝构造：浅拷贝\n    return 0;\n}<\/code><\/pre>\n<h3>编译期做什么<\/h3>\n<p>类没有声明拷贝构造函数，编译器按需生成一个默认版本：对每个成员执行复制。<code>data<\/code> 是 <code>char*<\/code>，默认版本复制指针值，不调用 <code>new<\/code>，不复制缓冲区内容。编译期不报错，故障在运行期释放阶段才暴露。<\/p>\n<h3>运行期与内存怎么变<\/h3>\n<p>构造 <code>a<\/code>：<code>new char[]<\/code> 申请一块缓冲区，地址记为 <code>D1<\/code>，<code>a.data = D1<\/code>，字符串 <code>&quot;alpha&quot;<\/code> 复制进 <code>D1<\/code>。<\/p>\n<p><code>Blob b(a)<\/code>：默认拷贝构造执行，<code>b.data = a.data = D1<\/code>。此时内存中只有一块缓冲区 <code>D1<\/code>，两个指针 <code>a.data<\/code>、<code>b.data<\/code> 指向它；<code>b<\/code> 没有自己的缓冲区。<\/p>\n<p><code>main<\/code> 返回，栈对象析构顺序与构造相反：先析构 <code>b<\/code>，<code>delete[] b.data<\/code> 释放 <code>D1<\/code>；再析构 <code>a<\/code>，<code>delete[] a.data<\/code> 再次释放 <code>D1<\/code>。同一块堆块被释放两次，堆管理器的空闲记录被破坏，程序崩溃或出现堆损坏。<\/p>\n<p>中途还有一条隐性故障：若 <code>b<\/code> 通过指针改写 <code>D1<\/code> 内容，<code>a<\/code> 读到的字符串跟着变；两个对象名义上是独立副本，实际共享同一数据。<\/p>\n<h3>深拷贝修正<\/h3>\n<pre class=\"lang-cpp\"><code>class Blob {\n    char *data;\npublic:\n    Blob(const char *s) {\n        data = new char[std::strlen(s) + 1];\n        std::strcpy(data, s);\n    }\n    Blob(const Blob &amp;other) {\n        data = new char[std::strlen(other.data) + 1];\n        std::strcpy(data, other.data);\n    }\n    Blob &amp;operator=(const Blob &amp;other) {\n        if (this == &amp;other) return *this;       // 自赋值检查\n        delete[] data;                          // 释放旧缓冲区\n        data = new char[std::strlen(other.data) + 1];\n        std::strcpy(data, other.data);\n        return *this;\n    }\n    ~Blob() { delete[] data; }\n};<\/code><\/pre>\n<p>逐行推演拷贝构造：进入函数时新对象尚未有缓冲区；先按 <code>other.data<\/code> 长度 <code>new<\/code> 一块新块 <code>D2<\/code>，再把 <code>other.data<\/code> 指向的内容复制进 <code>D2<\/code>；新对象指针指向 <code>D2<\/code>，与 <code>other<\/code> 的 <code>D1<\/code> 独立。析构时 <code>a<\/code> 释放 <code>D1<\/code>，<code>b<\/code> 释放 <code>D2<\/code>，两块堆块各释放一次。<\/p>\n<h2>具体算例：拷贝赋值的自赋值与旧缓冲区处理<\/h2>\n<pre class=\"lang-cpp\"><code>int main() {\n    Blob x(&quot;first&quot;);\n    Blob y(&quot;second&quot;);\n    y = x;          // 拷贝赋值\n    x = x;          // 自赋值\n    return 0;\n}<\/code><\/pre>\n<p>推演 <code>y = x<\/code>：<code>this<\/code> 是 <code>y<\/code>，<code>other<\/code> 是 <code>x<\/code>。先比较 <code>this<\/code> 地址与 <code>&amp;other<\/code>，不相等；释放 <code>y<\/code> 旧缓冲区（<code>&quot;second&quot;<\/code> 那块）；按 <code>x<\/code> 长度分配新块；复制内容；返回 <code>*this<\/code>。<code>y<\/code> 此后持有 <code>&quot;first&quot;<\/code> 的独立副本。<\/p>\n<p>推演 <code>x = x<\/code>：<code>this == &amp;other<\/code> 成立，直接返回 <code>*this<\/code>。若省略自赋值检查，流程会先 <code>delete[] data<\/code> 释放 <code>x<\/code> 自己的缓冲区，再从 <code>other.data<\/code>（已释放地址）复制内容，读到的是已回收内存。自赋值检查放在释放旧资源之前，拦住这条路径。<\/p>\n<p>再看省略旧缓冲区释放的版本：赋值只 <code>data = other.data<\/code>，<code>y<\/code> 原有的旧缓冲区地址被覆盖，再也找不到入口，那块内存泄漏；新指针又与 <code>x<\/code> 共享 <code>D1<\/code>，退回浅拷贝故障。<\/p>\n<h2>第二算例：拷贝构造参数写成按值传参会无限递归<\/h2>\n<pre class=\"lang-cpp\"><code>class Bad {\npublic:\n    Bad(Bad other) { ... }  // 错误：参数按值传递\n};<\/code><\/pre>\n<p>推演：调用 <code>Bad b(a)<\/code> 时，形参 <code>other<\/code> 需要由实参 <code>a<\/code> 拷贝构造；形参是按值传递，构造形参又要调用拷贝构造；拷贝构造的形参仍是按值，再次触发拷贝构造，调用链无限递归直到栈溢出。拷贝构造参数必须是引用 <code>const Bad &amp;<\/code>，绑定到实参而不产生副本，递归链在入口处断开。<\/p>\n<h2>对抗性追问：只写析构函数、不写拷贝构造会怎样<\/h2>\n<p>这正是开头故障代码的组合：析构函数负责 <code>delete[] data<\/code>，拷贝路径走默认浅拷贝。只要代码里出现一次按值复制（传值、返回值、初始化副本），两个对象共享缓冲区，析构时 double free。反过来，只写深拷贝构造、不写拷贝赋值，复制构造路径安全，但已存在对象之间的 <code>=<\/code> 仍走默认浅赋值，留下另一条共享路径。三法则要求三个动作口径一致，就是为了不留绕过深拷贝的入口。<\/p>\n<p>再追问：五法则比三法则多覆盖什么。C++11 起对象可以被“移动”：移动构造把源对象的缓冲区指针接管过来，源对象指针置空，不分配新块、不复制内容。需要手写析构与深拷贝的类，资源语义明确，通常也应提供移动构造与移动赋值，让按值返回、临时对象传参走低成本接管路径。五个函数分别对应：销毁、复制诞生、复制赋值、移动诞生、移动赋值；缺移动版本不会造成内存错误，只让本可接管资源的场景退回深拷贝。<\/p>\n<h2>延伸推演：copy-and-swap 赋值惯用法<\/h2>\n<pre class=\"lang-cpp\"><code>Blob &amp;operator=(Blob other) {   // 形参按值，副本由拷贝或移动构造生成\n    swap(*this, other);         // 交换新旧资源\n    return *this;\n}                               // other 析构，释放被换走的旧资源<\/code><\/pre>\n<p>推演：赋值运算符形参 <code>other<\/code> 是独立副本，进入函数前已构造完成；<code>swap<\/code> 把 <code>this<\/code> 的旧资源与 <code>other<\/code> 的副本资源互换；函数结束 <code>other<\/code> 析构，带着被换过来的旧资源释放。自赋值场景下副本仍是独立对象，不需要单独判断；旧资源释放由 <code>other<\/code> 的析构统一完成，避免在函数体内先释放再分配的异常中间态。<\/p>\n<h2>延伸推演：成员是标准容器时为什么不用手写深拷贝<\/h2>\n<p>若类成员是 <code>std::string<\/code>、<code>std::vector<\/code> 这类容器，容器自身的拷贝构造已实现深拷贝：容器复制时分配自己的内存并复制元素。类的默认逐成员拷贝会调用容器的拷贝构造，缓冲区复制由容器完成。手写深拷贝只在类持有裸指针、自行管理 <code>new<\/code>/<code>delete<\/code> 时才成为必要；优先使用容器与智能指针，相当于把三法则的资源管理外包给经过验证的类型。<\/p>\n<h2>延伸推演：数组成员与 new[] 的配对<\/h2>\n<p>类持有的是字符数组或对象数组时，申请用 <code>new[]<\/code>，释放必须配对 <code>delete[]<\/code>；混用 <code>new<\/code> 配 <code>delete[]<\/code> 或 <code>new[]<\/code> 配 <code>delete<\/code> 属于未定义行为。数组元素有析构函数时，<code>delete[]<\/code> 按元素逆序逐个析构；只释放单个元素不会走完数组析构链。智能指针数组版本 <code>unique_ptr&lt;T[]&gt;<\/code> 配套 <code>delete[]<\/code> 删除器，把配对关系写进类型。<\/p>\n<h2>延伸推演：成员是类类型时的拷贝路径<\/h2>\n<p>类成员本身是可拷贝的类类型（如 <code>string<\/code>、自定义值类），默认拷贝构造调用该成员的拷贝构造；成员是裸指针才落入浅拷贝问题。判断一个类要不要深拷贝，先列成员清单：值成员与容器成员自带拷贝语义，裸指针成员才需要手写接管/复制逻辑。能用容器或智能指针替换裸指针成员，三法则需要手写的代码量随之减少。<\/p>\n<h2>对抗性追问再补：只写拷贝构造不写拷贝赋值留下的入口<\/h2>\n<p>对象初始化路径走拷贝构造被修对，但已存在对象之间的 <code>=<\/code> 仍走默认浅赋值；代码中出现链式赋值或先默认构造后再赋值的写法，共享路径被重新打开。三法则要求两条拷贝入口口径一致，修资源类时把析构、拷贝构造、拷贝赋值作为一组同时检查，而不是只补最先踩到故障的那一个。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n默认拷贝构造对指针成员做了什么？为什么两个对象会共享同一块缓冲区？\n<\/li><li>\n深拷贝在拷贝构造里依次完成哪几个动作？新对象与源对象的缓冲区为什么不再重叠？\n<\/li><li>\n拷贝赋值为什么必须先做自赋值检查？不检查会读到什么内存？\n<\/li><li>\n三法则的推理链是什么：为什么写了析构函数通常也要写拷贝构造与拷贝赋值？\n<\/li><li>\n拷贝构造参数为什么必须是引用？按值传参触发的递归是怎么形成的？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "拷贝构造与赋值：深浅拷贝与三/五法则"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C++ Primer Plus：中文版（第六版） (Stephen Prata) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.405<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">值、指针、引用与对象生命周期：C++ 相对 C 的语义差别<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">构造函数、析构函数与成员初始化列表<\/a><\/span><\/div><h1>运算符重载的语义与友元<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章（原书第 11 章使用类，11.1–11.3 节运算符重载与友元，PDF 第 405 页起）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>自定义类想支持加法、比较、流输出这类写法时，若只能写成 <code>a.add(b)<\/code>、<code>a.compare(b)<\/code>，表达式读起来与内置类型的 <code>a + b<\/code>、<code>a &lt; b<\/code> 不一致。C++ 允许给已有运算符赋予类类型版本，让自定义类型沿用熟悉语法。但重载不是给符号随便换动作：优先级、结合律、操作数个数保持不变，语义应与内置版本直觉对齐。本概念回答：重载用什么语法写，成员与非成员版本各适用什么场景；哪些运算符不能重载、哪些必须成员；友元怎样拿到私有成员访问权；什么情况不该重载。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>运算符重载<\/strong>：定义名为 <code>operator@<\/code> 的函数。<code>a @ b<\/code> 在操作数至少有一个类类型时，编译器按重载决议匹配对应函数；优先级、结合律、操作数个数沿用内置规则，不能通过重载改变。<\/p>\n<p><strong>成员版本<\/strong>：<code>operator@<\/code> 作为类成员，左操作数是调用对象 <code>this<\/code>，右操作数是函数参数。<\/p>\n<p><strong>非成员版本<\/strong>：外部函数，两个操作数都是参数。左操作数不能是当前类对象（如流输出左操作数是 <code>ostream<\/code>），或左操作数需要隐式类型转换时，必须用非成员版本。<\/p>\n<p><strong>友元（friend）<\/strong>：在类定义内用 <code>friend<\/code> 声明外部函数或外部类，被声明者可访问私有与保护成员。友元不是成员，不占成员位置，调用方式是普通外部函数调用。<\/p>\n<p><strong>必须成员重载的运算符<\/strong>：赋值 <code>=<\/code>、下标 <code>[]<\/code>、调用 <code>()<\/code>、成员访问 <code>-&gt;<\/code>，左操作数必须是本类对象。<\/p>\n<p><strong>不能重载的运算符<\/strong>：成员访问 <code>.<\/code>、成员指针 <code>.*<\/code>、作用域 <code>::<\/code>、条件 <code>?:<\/code>、<code>sizeof<\/code>、<code>typeid<\/code> 等（原书 11.2.2 节不可重载清单，PDF 第 405 页）。<\/p>\n<h2>原理推导与机制推演<\/h2>\n<p>先推表达式到函数调用的转换。<code>a + b<\/code> 中 <code>a<\/code> 是类对象：编译器先在类内找成员 <code>operator+<\/code>，找不到再找外部非成员版本；匹配成功后等价于 <code>a.operator+(b)<\/code> 或 <code>operator+(a, b)<\/code>。算术类通常返回新对象，赋值类返回 <code>*this<\/code> 引用。<\/p>\n<p>再推成员/非成员选择条件。成员版本要求左操作数是本类对象；写成 <code>内置类型 + 对象<\/code> 时成员版本接不住。非成员版本两参数都可参与隐式转换。流输出 <code>cout &lt;&lt; obj<\/code> 左操作数是 <code>ostream<\/code>，不可能给 <code>ostream<\/code> 加成员，因此 <code>operator&lt;&lt;<\/code> 必须是非成员，常声明为友元访问私有字段。<\/p>\n<p>友元访问路径：私有成员默认只允许成员访问；外部函数要读私有字段，在类内写 <code>friend<\/code> 声明授权，函数定义仍写在类外。<\/p>\n<p>推不该重载的情形：重载后语义与内置直觉相反，如 <code>+<\/code> 修改左操作数、<code>==<\/code> 比较地址；或符号承担多个不相关动作，读者无法从符号猜出含义。这类场景显式命名成员函数更清楚。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：动作与内置直觉一致（加法合并、相等比较、流输出）；左操作数是本类对象优先成员版本，左操作数是其他类型或需隐式转换用非成员；需访问私有字段的非成员声明友元。\n<\/li><li>\n失败案例一：<code>operator+<\/code> 写成修改左操作数并返回 <code>*this<\/code>，读者按内置 <code>+<\/code> 预期原对象不变，实际被改；修改左操作数应交给 <code>operator+=<\/code>。\n<\/li><li>\n失败案例二：流输出写成成员函数，<code>cout &lt;&lt; obj<\/code> 左操作数是 <code>ostream<\/code>，成员版本挂不上去。\n<\/li><li>\n失败案例三：重载 <code>&amp;&amp;<\/code>、<code>||<\/code>，内置短路求值丢失，两个操作数都被求值；这两类不应重载。\n<\/li><li>\n边界：重载不能改优先级与结合律，也不能改内置类型间运算含义，只补充类版本。\n<\/li><li>\n边界：友元只在声明列出的函数范围内开放访问，不是把私有成员公开给全部外部代码。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>成员 vs 非成员<\/strong>：成员版本左操作数固定为本类对象；非成员两参数对称，支持左操作数隐式转换。交换律需求与左操作数类型决定选哪侧。\n<\/li><li>\n<strong>友元 vs 成员函数<\/strong>：成员属于类、有 <code>this<\/code>；友元是外部函数、无 <code>this<\/code>，靠参数拿对象。访问权限相同，归属不同。\n<\/li><li>\n<strong><code>+<\/code> vs <code>+=<\/code><\/strong>：<code>+<\/code> 生成新对象、两操作数不变；<code>+=<\/code> 修改左操作数并返回引用。常用 <code>+<\/code> 调用 <code>+=<\/code>，避免两套逻辑分叉。\n<\/li><li>\n<strong>重载 vs 命名函数<\/strong>：语义直观、与内置符号对齐用重载；动作多义或读者无法从符号推断时，显式命名更稳妥。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：概念 c01 的值/引用传递决定运算符参数接收方式；概念 c03 构造路径负责返回新对象初始化。后继：概念 c04 拷贝语义影响返回值是副本还是共享；概念 c07 期望动态行为的运算符需按虚函数规则处理，普通重载不参与动态绑定。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（运算符重载的语义与友元）<\/summary><div class=\"depth-body\"><h1>c05 深度推演：运算符重载的决议路径、成员/非成员选择与友元授权<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把运算符重载讲透，先往回追四层前提：<\/p>\n<ol><li>\n表达式由运算符与操作数组成；编译器先看操作数类型，再决定调用内置动作还是匹配用户定义函数。内置类型之间的运算含义不能改，重载只作用于类类型参与的表达式。\n<\/li><li>\n类对象的动作由成员函数或外部函数实现；运算符函数只是名字固定为 <code>operator@<\/code> 的函数，调用规则与普通函数一致。\n<\/li><li>\n私有成员默认封闭在类内；外部函数要访问字段，需要显式授权，友元声明就是这条授权通道。\n<\/li><li>\n表达式可读性依赖符号直觉：重载保持优先级、结合律与操作数个数不变，能改的只是类类型版本的动作语义。\n<\/ol>\n<p>依赖链方向：表达式解析规则 → 运算符函数匹配 → 成员/非成员版本选择 → 友元访问授权 → 语义边界检查。<\/p>\n<h2>正向推导：逐行还原一次重载表达式的匹配过程<\/h2>\n<h3>算例代码<\/h3>\n<pre class=\"lang-cpp\"><code>#include &lt;iostream&gt;\n#include &lt;string&gt;\n\nclass Vec {\n    int x, y;\npublic:\n    Vec(int a = 0, int b = 0) : x(a), y(b) {}\n\n    Vec operator+(const Vec &amp;b) const {\n        return Vec(x + b.x, y + b.y);\n    }\n\n    friend std::ostream &amp;operator&lt;&lt;(std::ostream &amp;os, const Vec &amp;v);\n};\n\nstd::ostream &amp;operator&lt;&lt;(std::ostream &amp;os, const Vec &amp;v) {\n    os &lt;&lt; &quot;(&quot; &lt;&lt; v.x &lt;&lt; &quot;, &quot; &lt;&lt; v.y &lt;&lt; &quot;)&quot;;\n    return os;\n}\n\nint main() {\n    Vec a(1, 2);\n    Vec b(3, 4);\n    Vec c = a + b;\n    std::cout &lt;&lt; c &lt;&lt; &#x27;\\n&#x27;;\n    return 0;\n}<\/code><\/pre>\n<h3>编译期做什么<\/h3>\n<p>第一步，类内声明成员 <code>operator+<\/code>，左操作数是 <code>Vec<\/code>，右参数是 <code>const Vec&amp;<\/code>；声明友元 <code>operator&lt;&lt;<\/code>，授予外部函数访问 <code>x<\/code>、<code>y<\/code> 的权限。<\/p>\n<p>第二步，解析 <code>a + b<\/code>：<code>a<\/code> 是 <code>Vec<\/code> 类对象，编译器在 <code>Vec<\/code> 类内找成员 <code>operator+<\/code>，签名 <code>(const Vec&amp;)<\/code> 匹配 <code>b<\/code>，表达式等价于 <code>a.operator+(b)<\/code>。<\/p>\n<p>第三步，解析 <code>std::cout &lt;&lt; c<\/code>：左操作数类型是 <code>std::ostream<\/code>，不可能是 <code>Vec<\/code> 成员；编译器在外部作用域找到友元 <code>operator&lt;&lt;(ostream&amp;, const Vec&amp;)<\/code>，匹配成功。<\/p>\n<h3>运行期与内存怎么变<\/h3>\n<p><code>a + b<\/code> 调用成员 <code>operator+<\/code>：函数内 <code>x + b.x<\/code> 得 <code>4<\/code>，<code>y + b.y<\/code> 得 <code>6<\/code>，返回一个临时 <code>Vec(4, 6)<\/code>；用它拷贝构造 <code>c<\/code>。<code>a<\/code>、<code>b<\/code> 自身未被修改，符合内置 <code>+<\/code> 的直觉。<\/p>\n<p><code>operator&lt;&lt;<\/code> 把 <code>4<\/code>、<code>6<\/code> 写入输出流，返回流引用继续拼接。程序输出 <code>(4, 6)<\/code>。<\/p>\n<h3>成员版本为什么接不住左操作数转换<\/h3>\n<pre class=\"lang-cpp\"><code>Vec d(1, 1);\nVec e = 2 + d;   // 若 operator+ 是成员版本，此行匹配失败<\/code><\/pre>\n<p>成员版本调用形式是 <code>d.operator+(2)<\/code>，要求左操作数 <code>d<\/code> 是 <code>Vec<\/code>。写成 <code>2 + d<\/code> 时左操作数是 <code>int<\/code>，没有成员可挂；编译器不会把 <code>int<\/code> 隐式转成 <code>Vec<\/code> 再调成员（成员版本不参与左操作数转换）。改成非成员：<\/p>\n<pre class=\"lang-cpp\"><code>Vec operator+(const Vec &amp;a, const Vec &amp;b) {\n    return Vec(a.x + b.x, a.y + b.y);\n}<\/code><\/pre>\n<p><code>2<\/code> 先经 <code>Vec(int, int)<\/code> 构造隐式转为临时 <code>Vec<\/code>，再匹配非成员 <code>operator+<\/code>，双向加法都可用。<\/p>\n<h2>具体算例：比较运算符与相等语义<\/h2>\n<pre class=\"lang-cpp\"><code>class Point {\n    int px, py;\npublic:\n    Point(int a, int b) : px(a), py(b) {}\n    friend bool operator==(const Point &amp;p, const Point &amp;q);\n};\n\nbool operator==(const Point &amp;p, const Point &amp;q) {\n    return p.px == q.px &amp;&amp; p.py == q.py;\n}<\/code><\/pre>\n<p>推演：<code>p == q<\/code> 匹配非成员 <code>operator==<\/code>，比较两个对象的字段值。若只比较地址（比较 <code>&amp;p == &amp;q<\/code>），两个内容相同的对象也被判不等，与读者对相等比较的预期相反；相等运算符应比较值语义。<code>!=<\/code> 可由 <code>==<\/code> 取反实现，避免两套比较逻辑分叉。<\/p>\n<h2>第二算例：流运算符为什么必须是非成员<\/h2>\n<p><code>std::cout &lt;&lt; obj<\/code> 的语法树里，左操作数是 <code>cout<\/code>（<code>ostream<\/code> 实例）。成员运算符的左操作数必须是当前类对象，<code>operator&lt;&lt;<\/code> 若写成 <code>Vec<\/code> 的成员，调用形式是 <code>obj &lt;&lt; cout<\/code>，与实际表达式方向相反；也不能去给标准库 <code>ostream<\/code> 类添加成员函数。因此流插入/提取运算符固定为外部函数，两个参数分别是流对象与待输出对象；需要访问私有字段时声明友元。返回流引用是为了支持 <code>cout &lt;&lt; a &lt;&lt; b<\/code> 链式拼接：每一级返回同一个流对象引用，下一级继续往流里写。<\/p>\n<h2>对抗性追问：重载 <code>&amp;&amp;<\/code> 会丢掉什么<\/h2>\n<p>内置 <code>a &amp;&amp; b<\/code> 有短路规则：<code>a<\/code> 为假时不求值 <code>b<\/code>。重载成函数后：<\/p>\n<pre class=\"lang-cpp\"><code>BoolBox operator&amp;&amp;(const BoolBox &amp;a, const BoolBox &amp;b);<\/code><\/pre>\n<p>函数调用前两个参数都要先求值，<code>b<\/code> 一定会被计算，短路语义不再存在。若 <code>b<\/code> 的求值有副作用或依赖 <code>a<\/code> 成立才安全，行为与内置版本不一致。<code>||<\/code> 也是如此。这两类运算符以及按成员访问 <code>.<\/code>、作用域 <code>::<\/code>、条件 <code>?:<\/code> 不允许重载或不应重载，原因都在于短路/语法绑定是语言核心规则，无法用函数调用复刻。<\/p>\n<p>再追问：把 <code>operator+<\/code> 写成修改左操作数会怎样。<\/p>\n<pre class=\"lang-cpp\"><code>Vec &amp;Vec::operator+(const Vec &amp;b) {\n    x += b.x; y += b.y;   // 错误方向：+ 被写成 +=\n    return *this;\n}<\/code><\/pre>\n<p>读者按内置 <code>+<\/code> 预期 <code>a + b<\/code> 不改 <code>a<\/code>，链式 <code>(a + b) + c<\/code> 中 <code>a<\/code> 被第一步悄悄改写，后续结果失真。修改左操作数的动作应放进 <code>operator+=<\/code>，<code>operator+<\/code> 基于它生成新对象：<\/p>\n<pre class=\"lang-cpp\"><code>Vec Vec::operator+(const Vec &amp;b) const {\n    Vec r = *this;\n    r += b;\n    return r;\n}<\/code><\/pre>\n<h2>延伸推演：友元的授权边界<\/h2>\n<p>友元声明写在类内部，但函数归属类外：类外定义不带 <code>friend<\/code> 关键字，调用时不是 <code>a.friendFn()<\/code>，而是普通函数 <code>friendFn(a, b)<\/code>。一个函数可以同时是多个类的友元，从而在两个类的私有成员之间做对接；友元关系不能继承、不能转换，基类友元不自动成为派生类友元。封装没有被整体打开，只在声明列出的函数范围内开放访问面。<\/p>\n<h2>延伸推演：运算符重载与类型转换的配合<\/h2>\n<p>单参数构造函数定义了从形参类型到类类型的隐式转换。非成员运算符配合隐式转换，可以让内置类型与类对象双向运算；若不希望构造函数被隐式调用，可把构造函数声明为 <code>explicit<\/code>，此时表达式中的自动转换被拦住，必须显式构造对象。运算符能否触发左操作数转换，是选成员还是非成员的判断依据之一。<\/p>\n<h2>延伸推演：赋值运算符与自增自减的重载形式<\/h2>\n<p><code>operator=<\/code> 必须是成员函数，签名返回 <code>*this<\/code> 引用；它在对象已存在时被调用，需处理自赋值与旧资源释放（概念 c04）。前缀自增 <code>operator++()<\/code> 与后缀自增 <code>operator++(int)<\/code> 靠一个哑元参数区分：前缀先改后返回自身引用，后缀先存旧值、改动后返回旧值副本。混淆两种形式会导致链式表达式返回错误对象。<\/p>\n<p>类型转换运算符写成 <code>operator 目标类型()<\/code>，定义在类内，可把类对象隐式转成目标类型；<code>explicit<\/code> 标注后只在显式转换处生效。转换运算符与单参数构造函数共同定义类型转换路径，方向相反：构造函数是外部类型到类类型，转换运算符是类类型到外部类型。<\/p>\n<h2>延伸推演：重载决议在运算符表达式中的顺序<\/h2>\n<p>表达式 <code>a + b<\/code> 中 <code>a<\/code> 是类对象时，编译器先在成员候选中找 <code>operator+<\/code>，再在外部候选中找非成员版本，同时考虑内置类型版本；候选按参数匹配程度排序，最佳匹配被选中。成员版本不参与左操作数隐式转换，非成员版本两侧都可转换；这也是数值类型与类对象双向相加时必须用非成员的原因。找不到匹配候选时编译报错，而不是退回按位解释。<\/p>\n<h2>对抗性追问再补：把语义无关的动作挂到运算符上<\/h2>\n<p>若把 <code>+<\/code> 用于清空对象、把 <code>==<\/code> 用于交换两端，读者按内置直觉写出的表达式全部误判。运算符重载的价值在于沿用既有语法直觉；动作与符号语义脱节时，显式命名成员函数（如 <code>merge<\/code>、<code>equals<\/code>）比重载符号清楚。判断标准：换一个没读过这段代码的人，能否从符号猜出动作；猜不出就不该重载。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n<code>a + b<\/code> 在成员版本与非成员版本下分别等价于什么函数调用？\n<\/li><li>\n哪些运算符必须写成类成员？流插入运算符为什么必须是非成员？\n<\/li><li>\n左操作数需要隐式类型转换时，为什么成员版本接不住，非成员版本可以？\n<\/li><li>\n重载 <code>&amp;&amp;<\/code>、<code>||<\/code> 为什么会丢失短路求值？\n<\/li><li>\n友元函数与成员函数在归属、<code>this<\/code>、访问权限上有什么差别？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "运算符重载的语义与友元"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：library_raw/Library/计算机/c.../C++ Primer Plus：中文版（第六版） (Stephen Prata) (z-library.sk, 1lib.sk, z-lib.sk).pdf · p.525<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">值、指针、引用与对象生命周期：C++ 相对 C 的语义差别<\/a><\/span><\/div><h1>继承中的名字隐藏 vs 虚函数覆盖<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3 章（原书第 13 章类继承，13.4 节静态联编和动态联编中关于虚函数重定义与重载版本隐藏的讨论，PDF 第 525 页）\n<\/ul>\n<h2>问题：这个概念为了解决什么困难<\/h2>\n<p>派生类声明与基类同名的函数，读者容易以为派生类“改写”了基类版本；实际同名匹配分两种机制：名字隐藏与虚函数覆盖。隐藏只改变名字在派生类作用域的可见性，不参与运行期动态绑定；覆盖才是派生类替换基类虚函数版本、支撑多态的机制。两者编译期都能通过，经基类指针调用时行为完全不同。本概念回答：隐藏由什么规则触发，被隐藏的基类重载还能不能调到；覆盖需满足哪几个条件；看似相近却只触发隐藏的代码为何行为与多态预期不符；<code>using<\/code> 与 <code>override<\/code> 各修哪类问题。<\/p>\n<h2>定义与机制逐项拆<\/h2>\n<p><strong>名字隐藏（name hiding）<\/strong>：派生类中声明了与基类同名的函数后，基类
