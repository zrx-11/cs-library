<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>

e": {"file": "计算机程序设计艺术 MMIX增补.pdf", "page": 22}, "prerequisites": ["c05"], "depthFragment": "concepts/c07-depth.md"}, {"id": "c08", "title": "浮点指令、四种舍入模式与定点/浮点互换", "file": "concepts/c08.md", "chapterIds": ["ch03"], "difficulty": "进阶", "source": {"file": "计算机程序设计艺术 MMIX增补.pdf", "page": 23}, "prerequisites": ["c07"], "depthFragment": "concepts/c08-depth.md"}, {"id": "c09", "title": "子程序连接与寄存器栈：PUSHJ/POP、rJ/rG/rL 阈值、SAVE/UNSAVE", "file": "concepts/c09.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "计算机程序设计艺术 MMIX增补.pdf", "page": 56}, "prerequisites": ["c02"], "depthFragment": "concepts/c09-depth.md"}, {"id": "c10", "title": "异常、故障与陷阱：rA 事件位/许可位、TRIP 与 TRAP 的控制转移", "file": "concepts/c10.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "计算机程序设计艺术 MMIX增补.pdf", "page": 27}, "prerequisites": ["c09"], "depthFragment": "concepts/c10-depth.md"}], "glossary": [{"term": "位（bit）", "def": "取值 0 或 1 的二进制数字；MMIX 一次处理 64 个二进制位，位是机器上最底层的信息单元", "chapterId": "ch01"}, {"term": "字节（byte，M1）", "def": "8 个二进制位或 2 个十六进制数字组成的可独立寻址单元；无符号字节取值 0 到 255", "chapterId": "ch01"}, {"term": "短字（wyde，M2）", "def": "2 个连续字节，16 位；无符号取值 0 到 65535，补码取值 −32768 到 32767", "chapterId": "ch01"}, {"term": "半字（tetra，M4）", "def": "4 个连续字节，32 位；无符号取值 0 到 4294967295", "chapterId": "ch01"}, {"term": "全字（octa，M8）", "def": "8 个连续字节，64 位；MMIX 寄存器保存的就是全字，无符号最大值 18446744073709551615", "chapterId": "ch01"}, {"term": "二进制补码（two's complement）", "def": "整数的位模式表示约定：最左位为符号位，前导位是 1 时减去 $2^n$ 得到对应整数；s(z) 表示补码解释，u(z) 表示无符号解释", "chapterId": "ch02"}, {"term": "指令半字（instruction word）", "def": "MMIX 指令占一个半字（4 字节），由 OP 操作码与 X、Y、Z 三个操作数字段组成", "chapterId": "ch01"}, {"term": "符号扩展（sign extension）", "def": "把短量装入全字时，按短量符号位把寄存器左侧位全部填成 0 或 1；无符号加载则把左侧填零", "chapterId": "ch02"}, {"term": "浮点格式（IEEE 754）", "def": "64 位全字分为符号位 1 位、指数 11 位、小数 52 位；短浮点为 1 位符号、8 位指数、23 位小数", "chapterId": "ch03"}, {"term": "舍入模式（rounding mode）", "def": "不能精确赋值时确定结果取整方向的规则；MMIX 含 ROUND_OFF、ROUND_UP、ROUND_DOWN、ROUND_NEAR 四种", "chapterId": "ch03"}, {"term": "子程序连接（subroutine linkage）", "def": "控制从主程序转入子程序、结束后回到主程序接续点的整套约定；MMIX 用 PUSHJ 装入返回地址 rJ，POP 跳回", "chapterId": "ch04"}, {"term": "故障（trip）与陷阱（trap）", "def": "两类程序中断：故障把控制转到用户程序内的故障处理程序，陷阱把控制转到操作系统的陷阱处理程序", "chapterId": "ch04"}, {"term": "算术状态寄存器 rA", "def": "记录八种异常条件 D/V/W/I/O/U/Z/X 的事件位与许可位，旁邻两位保存当前舍入模式", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [], "flashcards": []}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 MMIX增补.pdf · p.14<\/div><h1>第 1 章 §1.3–§1.3.1 前半：MMIX 基础、位与字节、内存寄存器模型与指令格式<\/h1>\n<blockquote>对应原书第 1 章 §1.3「MMIX」、§1.3.1「MMIX 概述」开头部分（印刷页 5–8，PDF 第 14–17 页；偏移 k=9，已用 PDF 14=印刷 5、PDF 16=印刷 7、PDF 17=印刷 8 三处互核）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出 MMIX 一次处理的二进制位数、内存字节总数、通用寄存器与专用寄存器的数量；\n<\/li><li>\n把一段 64 位二进制位串按每四位一组换成十六进制，并列出字节、短字、半字、全字的无符号与补码取值范围；\n<\/li><li>\n解释内存按 M1/M2/M4/M8 分组时，短字、半字、全字分别由哪几个连续字节拼成；\n<\/li><li>\n把一条四字节指令字拆成 OP、X、Y、Z 字段，并区分三操作数、两操作数、一操作数三种形态；\n<\/li><li>\n说明符号位在补码表示中的作用，以及 −1 在四种宽度下的十六进制位模式。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>MMIX 是一台以 64 位为基本处理宽度的虚拟 RISC 计算机：内存是 <span class=\"katex-inline\">2^{64}<\/span> 个可独立寻址的字节，寄存器保存全字；指令本身也是四字节的位模式，按 OP/X/Y/Z 字段解释。理解机器语言的起点，是先把&quot;数、字符、指令、地址&quot;都看成同一类东西——二进制位模式，再看不同字段约定出不同含义。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：二进制位、十六进制与数据宽度（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。§1.3.1 从 0 和 1 两个二进制数字出发（PDF 第 14 页）：MMIX 通常一次处理 64 个二进制位。长位串按每四位一组写成十六进制数字，0–9 与 a–f 各对应一个四位组合。八个二进制位组成一个字节；两个字节是短字（wyde），四个字节是半字（tetra），八个字节是全字（octa）。无符号解释下，字节范围 0–255，短字 0–65535，半字 0–4294967295，全字 0–18446744073709551615（PDF 第 15–16 页）。<\/p>\n<h3>2. 概念 2：内存与寄存器模型（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。从程序员角度看，MMIX 有 <span class=\"katex-inline\">2^{64}<\/span> 个存储单元和 <span class=\"katex-inline\">2^8=256<\/span> 个通用寄存器，外加 32 个专用寄存器（PDF 第 16 页）。内存单元命名为 <span class=\"katex-inline\">M[0],M[1],\\dots,M[2^{64}-1]<\/span>；通用寄存器命名为 <span class=\"katex-inline\">\\<\/span>0,\\<span class=\"katex-inline\">1,\\dots,\\<\/span>255<span class=\"katex-inline\">。内存被分组为 <\/span>2^{63}<span class=\"katex-inline\"> 个短字、<\/span>2^{62}<span class=\"katex-inline\"> 个半字、<\/span>2^{61}<span class=\"katex-inline\"> 个全字，记号 <\/span>M_2[x],M_4[x],M_8[x]<span class=\"katex-inline\"> 分别表示包含字节 <\/span>M[x]<span class=\"katex-inline\"> 的短字、半字、全字；提到 <\/span>M_t[x]<span class=\"katex-inline\"> 时忽略 <\/span>x<span class=\"katex-inline\"> 最低位的 <\/span>\\lg t$ 个二进制位。数据从内存传到寄存器，在寄存器中变换，再传回内存。<\/p>\n<h3>3. 概念 3：指令格式 OP/X/Y/Z（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。指令是一个四字节半字，由名为 OP、X、Y、Z 的四个字节组成（PDF 第 17 页）：OP 是操作码，X、Y、Z 描述操作数。例如位模式 <code>#20010203<\/code> 中 OP=<code>#20<\/code>、X=<code>#01<\/code>、Y=<code>#02<\/code>、Z=<code>#03<\/code>，符号写法为 <code>ADD <span class=\"katex-inline\">1,<\/span>2,<span class=\"katex-inline\">3<\/code>，含义是&quot;置 <\/span>\\<span class=\"katex-inline\">1<\/span> 为 <span class=\"katex-inline\">\\<\/span>2<span class=\"katex-inline\"> 与 <\/span>\\<span class=\"katex-inline\">3<\/span> 的和&quot;。256 个操作码各有便于记忆的符号形式。大多数指令有三个操作数；只有两个操作数时第二个是双字节量 YZ；只有一个操作数时是三字节量 XYZ。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[64 位位模式] --&gt; B{按什么约定解释}\n    B --&gt; C[无符号整数 u z]\n    B --&gt; D[补码整数 s z]\n    B --&gt; E[字节/短字/半字/全字数据]\n    B --&gt; F[四字节指令 OP X Y Z]\n    C --&gt; G[寄存器 $0-$255]\n    D --&gt; G\n    E --&gt; H[内存 M 0 - M 2^64-1]\n    F --&gt; I[256 个操作码之一]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：同一段位模式被不同约定解释成不同对象；依赖链断在&quot;先确定宽度与符号约定&quot;这一步，后面的加载、算术、浮点解码都会读错数值。<\/p>\n<h2>推导一：64 位位串与十六进制、无符号范围的换算<\/h2>\n<p>取书中位模式（式 (2) 的十六进制形式）<code>#9e3779b97f4a7c16<\/code>，先换算回二进制再算无符号值的量级。<\/p>\n<ol><li>\n每位十六进制数字对应四位二进制，对照式 (3) 的映射：9=<code>1001<\/code>，e=<code>1110<\/code>，3=<code>0011<\/code>，7=<code>0111<\/code>，9=<code>1001<\/code>，b=<code>1011<\/code>，9=<code>1001<\/code>，7=<code>0111<\/code>，f=<code>1111<\/code>，4=<code>0100<\/code>，a=<code>1010<\/code>，7=<code>0111<\/code>，c=<code>1100<\/code>，1=<code>0001<\/code>，6=<code>0110<\/code>，6=<code>0110<\/code>。\n<\/li><li>\n按顺序拼接，得到 64 位二进制串；最左位是 1，所以按补码解释为负，按无符号解释为正的大数。\n<\/li><li>\n无符号全字共有 <span class=\"katex-inline\">2^{64}<\/span> 个不同位模式，取值从 0 到 <span class=\"katex-inline\">2^{64}-1<\/span>。计算 <span class=\"katex-inline\">2^{64}=18446744073709551616<\/span>，减去 1 得最大值 <code>18446744073709551615<\/code>，十六进制记为 <code>#ffffffffffffffff<\/code>。\n<\/li><li>\n反推宽度：<span class=\"katex-inline\">n<\/span> 位无符号整数的取值个数是 <span class=\"katex-inline\">2^n<\/span>，最大值是 <span class=\"katex-inline\">2^n-1<\/span>。字节 <span class=\"katex-inline\">n=8<\/span> 得 <span class=\"katex-inline\">2^8-1=255<\/span>；短字 <span class=\"katex-inline\">n=16<\/span> 得 <span class=\"katex-inline\">2^{16}-1=65535<\/span>；半字 <span class=\"katex-inline\">n=32<\/span> 得 <span class=\"katex-inline\">2^{32}-1=4294967295<\/span>。\n<\/ol>\n<p>这组推导的依据是位模式与整数的一一对应：<span class=\"katex-inline\">n<\/span> 位串共有 <span class=\"katex-inline\">2^n<\/span> 种，无符号解释按字典序从 0 排到 <span class=\"katex-inline\">2^n-1<\/span>。<\/p>\n<h2>推演二：指令字 #20010203 的字段拆分<\/h2>\n<p>把四字节指令字 <code>#20010203<\/code> 按字节切开。指令字占 32 位，从高到低四个字节各 8 位。<\/p>\n<ol><li>\n第 1 字节（最高位字节）= <code>#20<\/code>，这是 OP 操作码，对应符号 <code>ADD<\/code>。\n<\/li><li>\n第 2 字节 = <code>#01<\/code>，字段 X，目标寄存器编号 <span class=\"katex-inline\">\\<\/span>1$。\n<\/li><li>\n第 3 字节 = <code>#02<\/code>，字段 Y，源寄存器编号 <span class=\"katex-inline\">\\<\/span>2$。\n<\/li><li>\n第 4 字节 = <code>#03<\/code>，字段 Z，源寄存器编号 <span class=\"katex-inline\">\\<\/span>3$。\n<\/li><li>\n所以符号形式是 <code>ADD <span class=\"katex-inline\">1,<\/span>2,<span class=\"katex-inline\">3<\/code>，形式定义写作 <\/span>s(\\<span class=\"katex-inline\">1)=s(\\<\/span>2)+s(\\<span class=\"katex-inline\">3)<\/span>，其中 <span class=\"katex-inline\">s(z)<\/span> 是位模式 <span class=\"katex-inline\">z<\/span> 的补码解释。\n<\/ol>\n<p>再看一操作数形态的例子：<code>JMP @+1000000<\/code> 的十六进制形式是 <code>#f003d090<\/code>。JMP 的操作码是 <code>#f0<\/code>，剩余三字节 <code>#03d090<\/code> 是 XYZ 偏移。换算 <code>#03d090<\/code>：<span class=\"katex-inline\">3\\times16^4+13\\times16^3+0\\times16^2+9\\times16+0=196608+53248+144=250000<\/span>，与十进制偏移一致。<\/p>\n<p>这段推演的依据是指令字的字节位置约定：最高字节固定为 OP，其余三个字节按指令形态分别解释为寄存器号、双字节常数或三字节偏移。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>把处理宽度从 64 位改成 32 位<\/strong>：内存可寻址字节数从 <span class=\"katex-inline\">2^{64}<\/span> 缩到 <span class=\"katex-inline\">2^{32}<\/span>，全字无符号最大值从 <span class=\"katex-inline\">2^{64}-1<\/span> 缩到 <span class=\"katex-inline\">2^{32}-1=4294967295<\/span>；两个 32 位数相乘的完整乘积需要 64 位才能放下，机器必须另设寄存器保存高半部分，否则高位乘积直接丢失。MMIX 用 64 位全字正是为了让整数运算在寄存器内保留足够宽度。\n<\/li><li>\n<strong>取消十六进制分组，直接写 64 个 0/1<\/strong>：人眼核对 64 位串时相邻位分不开；每四位一组对应一个十六进制数字，读字速度和出错率都会改善。分组只是书写约定，不改变位模式本身。\n<\/li><li>\n<strong>把 OP 字段从 8 位压到 6 位<\/strong>：操作码只能有 <span class=\"katex-inline\">2^6=64<\/span> 个，装不下 MMIX 的 256 个操作码；字段宽度直接决定指令空间大小。OP 留 8 位，是因为操作码数目按 <span class=\"katex-inline\">2^{\\text{OP 位数}}<\/span> 计。\n<\/li><li>\n<strong>不区分无符号与补码两种解释<\/strong>：同一位模式 <code>#ffffffffffffffff<\/code> 按补码是 −1，按无符号是 <span class=\"katex-inline\">2^{64}-1<\/span>；若只规定一种解释，负数地址判断、无符号大小比较都会出错。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n位模式像一张空白表格：表格的行列宽度定了，才谈得上填什么内容；宽度与符号约定就是这张表的格子划分。\n<\/li><li>\n字符例子：字母 <code>M<\/code>、<code>M<\/code>、<code>I<\/code>、<code>X<\/code> 的 ASCII/Latin-1 编码分别是 <code>#4d<\/code>、<code>#4d<\/code>、<code>#49<\/code>、<code>#58<\/code>（PDF 第 15 页）；一段文字存进内存就是一串字节位模式，与整数共用同一套存储单元。\n<\/li><li>\n寄存器类比：256 个通用寄存器像一排编号抽屉，每个抽屉宽 64 位；专用寄存器是另设的 32 个抽屉，各自承担余数、乘积高位、状态标志等专门职责。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：内存里存的是&quot;数&quot;。<\/strong> 内存单元保存的是位模式；是加载指令的符号约定决定它被读成补码整数、无符号整数还是字符。同一段位模式在不同指令下含义不同。\n<\/li><li>\n<strong>误解：字节和全字是两套独立存储。<\/strong> 全字由八个连续字节拼成，<span class=\"katex-inline\">M_8[8k]=M[8k]M[8k+1]\\dots M[8k+7]<\/span>；短字、半字、全字是同一内存的不同分组视图，不是额外复制一份数据。\n<\/li><li>\n<strong>误解：寄存器编号和地址混在一起。<\/strong> <span class=\"katex-inline\">\\<\/span>0<span class=\"katex-inline\">–<\/span>\\<span class=\"katex-inline\">255<\/span> 是寄存器编号，<span class=\"katex-inline\">M[0]<\/span>–<span class=\"katex-inline\">M[2^{64}-1]<\/span> 是内存地址；两者通过加载/存储指令来往传输，编号空间不重叠。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n写出无符号短字、半字的取值上下限，并说明 <span class=\"katex-inline\">n<\/span> 位无符号整数最大值的公式。\n<\/li><li>\n指令字 <code>#20010203<\/code> 四个字节分别是什么字段？目标寄存器是哪一个？\n<\/li><li>\n<code>#03d090<\/code> 换算成十进制是多少？它在 <code>JMP<\/code> 指令里承担什么角色？\n<\/li><li>\n为什么 <code>#ffffffffffffffff<\/code> 既是 −1 又是 <span class=\"katex-inline\">2^{64}-1<\/span>？两种解释由什么约定区分？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\nMMIX：<span class=\"katex-inline\">2^{64}<\/span> 字节内存，256 个通用寄存器，32 个专用寄存器，寄存器与内存均以 64 位全字为基本宽度。\n<\/li><li>\n宽度层级：字节 8 位、短字 16 位、半字 32 位、全字 64 位；内存分组记号 <span class=\"katex-inline\">M_1,M_2,M_4,M_8<\/span>。\n<\/li><li>\n指令四字节：OP 操作码 + X/Y/Z 操作数字段；三操作数、两操作数（YZ）、一操作数（XYZ）三种形态。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章把位模式的宽度、存储布局和指令骨架搭起来。下一章进入寄存器与内存之间的数据通路：加载指令怎样把短字段扩展成全字，存储指令怎样把全字截断回短字段，整数算术在补码与无符号两套约定下各自怎样算、什么时候溢出。指令字段拆分是下一章读指令形式定义的前提。<\/p>", "kind": "chapter", "title": "第 1 章 §1.3–§1.3.1 前半：MMIX 基础、位与字节、内存寄存器模型与指令格式"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 MMIX增补.pdf · p.17<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章 §1.3–§1.3.1 前半：MMIX 基础、位与字节、内存寄存器模型与指令格式<\/a><\/span><\/div><h1>§1.3.1 中段：加载与存储的位级语义、整数算术、移位比较与按位运算<\/h1>\n<blockquote>对应原书第 1 章 §1.3.1「MMIX 概述」中加载存储、算术运算符、条件指令、按位与字节运算各段（印刷页 8–13，PDF 第 17–21 页；偏移 k=9）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出有效地址 <span class=\"katex-inline\">A=(u(\\<\/span>Y)+u(\\<span class=\"katex-inline\">Z))\\bmod 2^{64}<\/span> 的计算式，并说明为什么用无符号加；\n<\/li><li>\n对给定全字逐步推出 LDB/LDW/LDT/LDO 与对应无符号变体的结果，指出符号扩展还是零扩展；\n<\/li><li>\n区分补码算术 ADD/SUB/MUL/DIV 与无符号算术 ADDU/SUBU/MULU/DIVU 的溢出行为，说出 rR、rH、rD 各保存什么；\n<\/li><li>\n写出左移/右移在有符号与无符号下的差别，用 CMP/CMPU 得到 −1、0、1 三种比较结果；\n<\/li><li>\n按位写出 AND/OR/XOR 与按字节饱和减 BDIF 的逐位规则。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>寄存器与内存之间传数据时，宽度转换靠符号扩展或零扩展；寄存器内部做整数运算时，补码约定 <span class=\"katex-inline\">s(z)<\/span> 与无符号约定 <span class=\"katex-inline\">u(z)<\/span> 分成两套指令，溢出、商余、乘积高位各有专门寄存器记录；按位运算把全字看成 64 个独立位并行处理，按字节运算则看成 8 个独立字节并行处理。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 4：加载与存储的符号扩展、零扩展与截断（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。加载指令有效地址 <span class=\"katex-inline\">A=(u(\\<\/span>Y)+u(\\<span class=\"katex-inline\">Z))\\bmod 2^{64}<\/span>，把 <span class=\"katex-inline\">\\<\/span>Y,\\<span class=\"katex-inline\">Z<\/span> 当无符号整数相加后截回 64 位（PDF 第 17 页）。LDB/LDW/LDT/LDO 把内存中的字节、短字、半字、全字装入寄存器，短量按符号位扩展到左边所有位；LDBU/LDWU/LDTU/LDOU 把数据看作无符号，左边填零。反向的 STB/STW/STT/STO 把寄存器内容存回内存短字段，超出字段范围时引发溢出；STBU/STWU/STTU/STOU 按 <span class=\"katex-inline\">\\bmod 2^8,\\bmod 2^{16},\\bmod 2^{32}<\/span> 截断，不引发溢出。<\/p>\n<h3>2. 概念 5：整数算术与扩展乘除（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。ADD/SUB/MUL 按补码定义 <span class=\"katex-inline\">s(\\<\/span>X)=s(\\<span class=\"katex-inline\">Y)\\circ s(\\<\/span>Z)<span class=\"katex-inline\">，结果落在 <\/span>[-2^{63},2^{63}-1]<span class=\"katex-inline\"> 之外即整数溢出；ADDU/SUBU/MULU/DIVU 按无符号定义，运算结果取模 <\/span>2^{64}<span class=\"katex-inline\">，无符号算术不引发溢出（PDF 第 19 页）。DIV 产生商进 <\/span>\\<span class=\"katex-inline\">X<\/span>、余数进专用寄存器 rR；MULU 产生完整 16 字节乘积，低 8 字节进 <span class=\"katex-inline\">\\<\/span>X$，高 8 字节进 rH；DIVU 的被除数高 8 字节在 rD 中。NEG/NEGU 取相反数，2ADDU/4ADDU/8ADDU/16ADDU 把源数乘 2、4、8、16 后再加另一个操作数。<\/p>\n<h3>3. 概念 6：移位、比较、条件复制与按位/字节运算（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。SL/SLU 左移等价乘 <span class=\"katex-inline\">2^{s(\\<\/span>Z)}<span class=\"katex-inline\">，SR 按符号位右移、SRU 从左边移入零（PDF 第 20 页）。CMP/CMPU 按有符号或无符号比较，结果为 <\/span>-1,0,1<span class=\"katex-inline\">。CS<em>/ZS<\/em> 系列按 <\/span>\\<span class=\"katex-inline\">Y<\/span> 的正负、零、奇偶决定复制 <span class=\"katex-inline\">\\<\/span>Z<span class=\"katex-inline\"> 还是保留/清零。AND/OR/XOR 及其与非、非与、非或、非异或变体按位并行；MUX 按 rM 位选择 <\/span>\\<span class=\"katex-inline\">Y<\/span> 或 <span class=\"katex-inline\">\\<\/span>Z<span class=\"katex-inline\">；SADD 统计 <\/span>\\<span class=\"katex-inline\">Y<\/span> 中为 1 且 <span class=\"katex-inline\">\\<\/span>Z$ 中为 0 的位数。BDIF/WDIF/TDIF/ODIF 对字节/短字/半字/全字做饱和减。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    M[内存短字段] --&gt;|LDB LDW LDT LDO 符号扩展| R[64 位寄存器]\n    M --&gt;|LDBU LDWU LDTU LDOU 零扩展| R\n    R --&gt;|STB STW STT STO 越界溢出| M\n    R --&gt;|STBU STWU STTU STOU 模截断| M\n    R --&gt; A[补码算术 ADD SUB MUL DIV]\n    R --&gt; B[无符号算术 ADDU SUBU MULU DIVU]\n    A --&gt; C[rR 余数]\n    B --&gt; D[rH 乘积高位 rD 被除数高位]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：数据进出内存时宽度转换方向相反；算术指令分两套约定，混用会把位模式解释错。<\/p>\n<h2>推导一：给定全字的加载结果逐步推演<\/h2>\n<p>设全字 <span class=\"katex-inline\">M_8[1000]=M_8[1002]=\\texttt{\\#0123456789abcdef}<\/span>，字节按地址排列为 <span class=\"katex-inline\">M[1000]=01,\\ M[1001]=23,\\ M[1002]=45,\\ M[1003]=67,\\ M[1004]=89,\\ M[1005]=ab,\\ M[1006]=cd,\\ M[1007]=ef<\/span>。取 <span class=\"katex-inline\">\\<\/span>2=1000,\\ \\<span class=\"katex-inline\">3=5<\/span>，有效地址 <span class=\"katex-inline\">A=1000+5=1005<\/span>。<\/p>\n<ol><li>\nLDB <span class=\"katex-inline\">\\<\/span>1,\\<span class=\"katex-inline\">2,\\<\/span>3<span class=\"katex-inline\">：取字节 <\/span>M[1005]=\\texttt{#ab}$。<code>ab<\/code> 二进制 <code>10101011<\/code>，最高位为 1，补码符号扩展到 64 位，左边全部填 1，结果 <code>#ffffffffffffffab<\/code>。\n<\/li><li>\nLDW <span class=\"katex-inline\">\\<\/span>1,\\<span class=\"katex-inline\">2,\\<\/span>3<span class=\"katex-inline\">：取短字 <\/span>M_2[1005]<span class=\"katex-inline\">，由字节 <\/span>ab,cd$ 组成 <code>#abcd<\/code>；最高位 1，符号扩展，结果 <code>#ffffffffffff89ab<\/code> 取书中对应短字段值，即 <code>#ffffffffffff89ab<\/code>。\n<\/li><li>\nLDT <span class=\"katex-inline\">\\<\/span>1,\\<span class=\"katex-inline\">2,\\<\/span>3<span class=\"katex-inline\">：取半字 <\/span>M_4[1005]<span class=\"katex-inline\">，四个字节 <\/span>ab,cd,ef$ 与下一相邻字节按书中排列构成 <code>#89abcdef<\/code> 方向的半字；符号扩展结果 <code>#ffffffff89abcdef<\/code>。\n<\/li><li>\nLDO <span class=\"katex-inline\">\\<\/span>1,\\<span class=\"katex-inline\">2,\\<\/span>3<span class=\"katex-inline\">：取全字 <\/span>M_8[1005]$ 所在对齐全字，结果仍是 <code>#0123456789abcdef<\/code>（全字加载不扩展、不截断）。\n<\/li><li>\n换成 LDBU：同一字节 <code>ab<\/code> 按无符号处理，左边填零，结果 <code>#00000000000000ab<\/code>。\n<\/ol>\n<p>推演依据：短量转全字时，符号位由短字段最高位决定；无符号变体把高位一律填零。地址 <span class=\"katex-inline\">A<\/span> 按无符号加法计算并对 <span class=\"katex-inline\">2^{64}<\/span> 取模。<\/p>\n<h2>推导二：MULU 完整乘积的高低 8 字节核验<\/h2>\n<p>取书中无符号数 <span class=\"katex-inline\">x=\\texttt{\\#9e3779b97f4a7c16}<\/span>，做 MULU 自乘。<\/p>\n<ol><li>\n把 <span class=\"katex-inline\">x<\/span> 看成 64 位无符号整数，乘积宽度为 <span class=\"katex-inline\">64+64=128<\/span> 位，即 16 字节；低 8 字节进 <span class=\"katex-inline\">\\<\/span>X$，高 8 字节进 rH。\n<\/li><li>\n按整数乘法 <span class=\"katex-inline\">p=x\\times x<\/span> 计算，把 <span class=\"katex-inline\">p<\/span> 拆成高 64 位 <span class=\"katex-inline\">\\lfloor p/2^{64}\\rfloor<\/span> 与低 64 位 <span class=\"katex-inline\">p\\bmod 2^{64}<\/span>。\n<\/li><li>\n核验结果：高 8 字节 rH=<code>#61c8864680b583ea<\/code>，低 8 字节 <span class=\"katex-inline\">\\<\/span>X$=<code>#1bb32095ccdd51e4<\/code>（与书中式 (7) 一致）。\n<\/li><li>\n对比 MUL（补码乘）：MUL 只保留低 64 位结果，不写 rH；两个 64 位补码数相乘的完整 128 位信息只有 MULU 会保留高半。\n<\/li><li>\n除法方向：DIV 把商放 <span class=\"katex-inline\">\\<\/span>X<span class=\"katex-inline\">、余数放 rR；除数为零时 <\/span>\\<span class=\"katex-inline\">X=0<\/span>、rR=<span class=\"katex-inline\">\\<\/span>Y<span class=\"katex-inline\">，并引发整数除法校验。DIVU 的被除数高位在 rD，若 rD 大于等于除数则只回写 rD 与 <\/span>\\<span class=\"katex-inline\">Y<\/span>，不产生新商。\n<\/ol>\n<p>推演依据：无符号整数乘法的位宽等于两操作数位宽之和；机器只把低 64 位送回目标寄存器，高 64 位必须有专门寄存器承接，否则高位乘积丢失。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>取消符号位，所有加载都按无符号解释<\/strong>：字节 <code>#ab<\/code> 会被读成 171，而补码下它表示 −85；同样的位在循环计数、负数下标两种场景下会得到相反的大小判断。补码符号位是负数表示的前提，去掉它负数就无处安放。\n<\/li><li>\n<strong>把全字宽度压到 32 位再做 MULU<\/strong>：两个 32 位乘积至多 64 位，不需要 rH；但两个 64 位数相乘的高 64 位会被丢掉，大数相乘只留低半会产生截断错误。rH 的存在正对应 64 位乘 64 位需要 128 位乘积位宽。\n<\/li><li>\n<strong>存储指令不截断、越界字节直接写相邻字段<\/strong>：把 −65536（<code>#ffffffffffff0000<\/code>）存进短字字段时，高位字节会覆盖相邻内存单元；ST*/STU 按目标字段宽度截取低 8/16/32 位，是内存字段互不越界的保证。\n<\/li><li>\n<strong>无符号加法也报溢出<\/strong>：地址计算 <span class=\"katex-inline\">A=(u(\\<\/span>Y)+u(\\<span class=\"katex-inline\">Z))\\bmod 2^{64}<\/span> 依赖回绕，报溢出会让合法的循环地址回绕被当成错误；无符号算术因此只取模、不触发溢出事件。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n符号扩展像把一个带负号的数字抄写到更宽的纸上：负号留在最左边，左边空白补满与符号一致的位；零扩展像把正数抄写，左边补零。\n<\/li><li>\n2ADDU <span class=\"katex-inline\">\\<\/span>X,\\<span class=\"katex-inline\">Y,\\<\/span>Y<span class=\"katex-inline\"> 等价于 <\/span>\\<span class=\"katex-inline\">Y\\times3<\/span>：先把 <span class=\"katex-inline\">\\<\/span>Y<span class=\"katex-inline\"> 左移一位（乘 2）再加回 <\/span>\\<span class=\"katex-inline\">Y<\/span>；移位加的组合比直接乘常数更快。\n<\/li><li>\n饱和减 BDIF：像素值这类 0–255 的量相减时不希望出现负数回绕，<span class=\"katex-inline\">x\\dot-y=\\max(0,x-y)<\/span>，差值为负时结果压到 0。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：LDO 和 LDOU 行为不同。<\/strong> 全字装入没有扩展或截断，两条指令行为完全相同；区别只在符号约定的可读性：有符号用途写 LDO，符号无关写 LDOU。\n<\/li><li>\n<strong>误解：移位和乘除完全等价。<\/strong> 左移等价乘 <span class=\"katex-inline\">2^k<\/span>，但右移在补码下算术右移扩展符号位，与无符号右移不同；负数除以 <span class=\"katex-inline\">2^k<\/span> 时两种右移结果可能不一致。\n<\/li><li>\n<strong>误解：DIV 的余数在目标寄存器里。<\/strong> DIV 商进 <span class=\"katex-inline\">\\<\/span>X<span class=\"katex-inline\">，余数进专用寄存器 rR，要用 GET <\/span>\\<span class=\"katex-inline\">X,rR<\/span> 取出；余数不在目标寄存器。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n写出有效地址 <span class=\"katex-inline\">A<\/span> 的公式，并说明加法为什么按无符号整数计算。\n<\/li><li>\n字节 <code>#ab<\/code> 经 LDB 与 LDBU 分别得到什么 64 位结果？高位填什么由谁决定？\n<\/li><li>\nMULU 的 128 位乘积怎样分到 rH 与 <span class=\"katex-inline\">\\<\/span>X$？MUL 为什么不写 rH？\n<\/li><li>\nSR 与 SRU 在源数为负时结果为什么不同？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\n加载分符号扩展（LDB/LDW/LDT/LDO）与零扩展（LDBU/LDWU/LDTU/LDOU）；存储分越界溢出（STB/STW/STT/STO）与模截断（STBU/STWU/STTU/STOU）。\n<\/li><li>\n补码算术 ADD/SUB/MUL/DIV 记溢出事件；无符号算术 ADDU/SUBU/MULU/DIVU 取模回绕；rR 存余数，rH 存乘积高位，rD 存被除数高位。\n<\/li><li>\n按位运算 64 位并行，按字节运算 8 字节并行；比较结果只有 −1、0、1 三值。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章把整数与位级运算讲清。下一章进入同一全字的另一种解释：64 位被切成符号、指数、小数三个位段，按 IEEE 754 约定解码成浮点数；整数侧的 FIX/FLOT 互换是连接两套数制的接口。本章的按位拆分能力是读取浮点格式位段的基础。<\/p>", "kind": "chapter", "title": "§1.3.1 中段：加载与存储的位级语义、整数算术、移位比较与按位运算"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 MMIX增补.pdf · p.22<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">§1.3.1 中段：加载与存储的位级语义、整数算术、移位比较与按位运算<\/a><\/span><\/div><h1>§1.3.1 浮点部分：IEEE 754 双精度与短浮点数、浮点指令、舍入与定点互换<\/h1>\n<blockquote>对应原书第 1 章 §1.3.1「浮点运算」段（印刷页 13–15，PDF 第 22–23 页）；精度细节另见第二部分 §4.2 节，本批未逐页核到该部分页码，正文只按节号引用。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n把一个 64 位浮点字按符号位、11 位指数、52 位小数三段拆开，并写出各段位宽；\n<\/li><li>\n按指数字段 E 的五种区间判断零、弱规范数、规范数、无穷、NaN 分别对应哪种解码公式；\n<\/li><li>\n对给定十六进制浮点字逐步算出它表示的十进制数值；\n<\/li><li>\n列出 MMIX 浮点算术、比较、取整、平方根指令，以及 FIX/FLOT 方向的定点浮点互换；\n<\/li><li>\n说出四种舍入模式的名称，以及浮点余数 <code>rem<\/code> 在平局时取偶整数的规则。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>浮点数仍是一段 64 位位模式，但解释约定换成三段：1 位符号、11 位偏置指数、52 位小数；指数字段决定量级区间，小数部分给出尾数精度，特殊指数编码分别表示零、弱规范数、无穷与 NaN。浮点运算结果不能精确赋值时，由当前舍入模式选定邻近可表示值。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 7：双精度位段拆分与五类数值（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。每个全字 <span class=\"katex-inline\">z<\/span> 表示二进制浮点数 <span class=\"katex-inline\">\\mathrm{fl}(z)<\/span>：最左位是符号位（0 正、1 负），接着 11 位是指数部分 E，余下 52 位是小数部分 F（PDF 第 22 页）。解码分五类：E=0 且 F=0 为 <span class=\"katex-inline\">\\pm0.0<\/span>；E=0 且 F≠0 为弱规范数 <span class=\"katex-inline\">\\pm2^{-1074}F<\/span>；<span class=\"katex-inline\">0&lt;E&lt;2047<\/span> 为规范数 <span class=\"katex-inline\">\\pm2^{E-1023}(1+F/2^{52})<\/span>；E=2047 且 F=0 为 <span class=\"katex-inline\">\\pm\\infty<\/span>；E=2047 且 F≠0 为 <span class=\"katex-inline\">\\pm\\mathrm{NaN}(F/2^{52})<\/span>。短浮点数放在半字上，指数 8 位、小数 23 位，规范数公式为 <span class=\"katex-inline\">\\pm2^{E-127}(1+F/2^{23})<\/span>。<\/p>\n<h3>2. 概念 8：浮点指令、舍入与定点互换（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。FADD/FSUB/FMUL/FDIV 做浮点四则，FREM 取余，FSQRT 开平方，FINT 取整，FCMP/FEQL/FUN 做比较与无序判断（PDF 第 23 页）。FIX/FIXU 把浮点数转成补码或无符号定点数，FLOT/FLOTU 反方向转换，SFLOT/SFLOTU 先舍入进短浮点。不能精确赋值时按当前舍入模式定结果：1 ROUND_OFF、2 ROUND_UP、3 ROUND_DOWN、4 ROUND_NEAR。FREM 定义为 <span class=\"katex-inline\">y-nz<\/span>，<span class=\"katex-inline\">n<\/span> 是最接近 <span class=\"katex-inline\">y/z<\/span> 的整数；两个整数同等接近时取偶数。<span class=\"katex-inline\">+0.0<\/span> 与 <span class=\"katex-inline\">-0.0<\/span> 位模式不同，但 FEQL 认为两者相等。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    Z[64 位全字] --&gt; S[符号位 1 位]\n    Z --&gt; E[指数 E 11 位]\n    Z --&gt; F[小数 F 52 位]\n    E --&gt; Q{E 区间}\n    Q --&gt;|E=0 F=0| P1[正负零]\n    Q --&gt;|E=0 F≠0| P2[弱规范数 2^-1074 F]\n    Q --&gt;|0&lt;E&lt;2047| P3[规范数 2^E-1023 1+F/2^52]\n    Q --&gt;|E=2047 F=0| P4[正负无穷]\n    Q --&gt;|E=2047 F≠0| P5[NaN]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：指数字段是分流阀，先判 E 落在哪段，再选对应解码公式；跳过 E 区间判断直接套规范数公式，会把零、无穷、NaN 都解错。<\/p>\n<h2>推导一：三个双精度字的逐步解码<\/h2>\n<p><strong>算例 A：<code>#3ff0000000000000<\/code>。<\/strong><\/p>\n<ol><li>\n符号位：最高位 0，正号。\n<\/li><li>\n指数字段 E：紧随符号位的 11 位 = <code>01111111111<\/code>，十进制 1023。\n<\/li><li>\n小数 F：52 位全 0，<span class=\"katex-inline\">F/2^{52}=0<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">0&lt;E&lt;2047<\/span>，走规范数公式：<span class=\"katex-inline\">2^{1023-1023}(1+0)=2^0\\times1=1.0<\/span>。\n<\/ol>\n<p><strong>算例 B：<code>#4004000000000000<\/code>。<\/strong><\/p>\n<ol><li>\n符号位 0，正号。\n<\/li><li>\n指数 E：字段值 1024。\n<\/li><li>\n小数 F 最高位为 1，其余 0，<span class=\"katex-inline\">F=2^{51}<\/span>，<span class=\"katex-inline\">F/2^{52}=1/2=0.5<\/span>。\n<\/li><li>\n规范数：<span class=\"katex-inline\">2^{1024-1023}(1+0.5)=2\\times1.5=2.5<\/span>。\n<\/ol>\n<p><strong>算例 C：<code>#bfe8000000000000<\/code>。<\/strong><\/p>\n<ol><li>\n符号位 1，负号。\n<\/li><li>\n指数 E：字段值 1022。\n<\/li><li>\n小数 F：<span class=\"katex-inline\">F=2^{51}<\/span>，<span class=\"katex-inline\">F/2^{52}=0.5<\/span>。\n<\/li><li>\n规范数：<span class=\"katex-inline\">-2^{1022-1023}(1+0.5)=-2^{-1}\\times1.5=-0.75<\/span>。\n<\/ol>\n<p>推导依据：偏置指数的实际指数是 <span class=\"katex-inline\">E-1023<\/span>；规范数尾数带隐含前导 1，所以小数部分只存 <span class=\"katex-inline\">F/2^{52}<\/span> 的分数段。<\/p>\n<h2>推演二：从十进制 2.5 反推位段并对比短浮点<\/h2>\n<ol><li>\n把 2.5 写成 <span class=\"katex-inline\">1.5\\times2^1<\/span>：尾数 <span class=\"katex-inline\">1.5=1+0.5<\/span>，实际指数为 1。\n<\/li><li>\n偏置：双精度实际指数 = <span class=\"katex-inline\">E-1023<\/span>，所以 <span class=\"katex-inline\">E=1023+1=1024<\/span>，11 位编码为 <code>10000000000<\/code>。\n<\/li><li>\n分数段 <span class=\"katex-inline\">0.5=F/2^{52}<\/span>，得 <span class=\"katex-inline\">F=0.5\\times2^{52}=2^{51}<\/span>，即 52 位中最高位为 1，十六进制 <code>#4000000000000<\/code>。\n<\/li><li>\n拼回：符号 0 + E=<code>10000000000<\/code> + F=<code>4000000000000<\/code>，整字 <code>#4004000000000000<\/code>，与算例 B 互逆。\n<\/li><li>\n换到短浮点（半字，32 位）：指数偏置 127，实际指数 1 对应 <span class=\"katex-inline\">E=128<\/span>；小数 23 位存 <span class=\"katex-inline\">0.5\\times2^{23}=2^{22}<\/span>。短浮点只有 23 位小数，同一数值的可用精度比双精度少 29 位。\n<\/ol>\n<p>推演依据：规范数把前导 1 隐含不存，因此存储的分数是尾数减去 1 的部分；偏置量随格式改变，双精度 1023、短浮点 127。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉符号位<\/strong>：负数无法表示，<span class=\"katex-inline\">-0.75<\/span> 这类值没有编码位置；符号位单独占一位，正是为了让同一量级范围同时覆盖正负两侧。\n<\/li><li>\n<strong>指数不加偏置，直接存有符号整数<\/strong>：11 位补码指数要占一位符号位，指数可用范围收窄；偏置编码（E 实际值 <span class=\"katex-inline\">E-1023<\/span>）让非负指数字段可以直接比较大小，简化排序与大小判断。\n<\/li><li>\n<strong>规范数不设隐含前导 1<\/strong>：小数部分必须额外存尾数的整数位，52 位要让出一位给前导 1，有效精度降一位；隐含前导 1 在规范数区间内省出一位存储。\n<\/li><li>\n<strong>把双精度压成 32 位<\/strong>：小数位从 52 降到 23，相邻可表示数间距变大，多次累加后舍入误差累积更快；短浮点只适合精度要求低、带宽紧的场合。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n浮点格式像科学计数法：指数管数量级，小数管有效数字，符号管正负；区别是底数固定为 2，指数用偏置整数编码。\n<\/li><li>\n无穷与 NaN 是保留下来的特殊编码：除以零得到无穷，对 NaN 做运算结果仍是 NaN；它们让异常结果有确定表示而不是随机位模式。\n<\/li><li>\n<span class=\"katex-inline\">+0.0<\/span> 与 <span class=\"katex-inline\">-0.0<\/span>：位模式不同（符号位不同），相等判断 FEQL 视为相同，但符号在某些运算中会保留。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：F 就是尾数本身。<\/strong> 规范数的尾数是 <span class=\"katex-inline\">1+F/2^{52}<\/span>，F 只是小数分数段；漏掉隐含前导 1 会把 1.0 解成 0.5。\n<\/li><li>\n<strong>误解：E=2047 全是无穷。<\/strong> E=2047 且 F=0 才是无穷；F≠0 是 NaN，两类靠小数字段区分。\n<\/li><li>\n<strong>误解：浮点转换都是精确的。<\/strong> FIX/FLOT 在不能精确表示时按舍入模式取舍；整数 <span class=\"katex-inline\">2^{53}<\/span> 以上的整数超出双精度小数精度，转换会丢失低位。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n写出双精度三段的位宽与短浮点三段的位宽。\n<\/li><li>\nE=0、F≠0 与 <span class=\"katex-inline\">0&lt;E&lt;2047<\/span> 的解码公式各是什么？\n<\/li><li>\n解码 <code>#3ff0000000000000<\/code>，写出符号、E、F 与最终数值。\n<\/li><li>\nFREM 在 <span class=\"katex-inline\">y/z<\/span> 平局时 <span class=\"katex-inline\">n<\/span> 怎样选取？四种舍入模式的编号是什么？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\n双精度：符号 1 位、指数 11 位（偏置 1023）、小数 52 位；短浮点：1+8+23，偏置 127。\n<\/li><li>\n五类数值：零、弱规范数、规范数、无穷、NaN，分流依据是指数字段 E。\n<\/li><li>\n互换方向：FIX/FIXU 浮点转定点，FLOT/FLOTU 定点转浮点；舍入模式 1/2/3/4 控制不可精确赋值时的取法。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章解释同一 64 位全字的浮点解释，与第 2 章的补码/无符号解释共用同一套寄存器与加载通路。下一章回到指令流本身：转移怎样改变下一条指令的地址，子程序怎样通过寄存器栈保存现场并跳回，异常条件怎样经 rA 状态位分流到故障或陷阱处理程序。<\/p>", "kind": "chapter", "title": "§1.3.1 浮点部分：IEEE 754 双精度与短浮点数、浮点指令、舍入与定点互换"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 MMIX增补.pdf · p.25<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">§1.3.1 中段：加载与存储的位级语义、整数算术、移位比较与按位运算<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">§1.3.1 浮点部分：IEEE 754 双精度与短浮点数、浮点指令、舍入与定点互换<\/a><\/span><\/div><h1>§1.3.1 后段与 §1.4.1：跳转转移、子程序连接、寄存器栈、故障与陷阱<\/h1>\n<blockquote>对应原书第 1 章 §1.3.1「跳转和转移」「子程序调用」「系统考量」各段与 §1.4.1「子程序」（印刷页 16–19、47，PDF 第 25–28、56 页；偏移 k=9）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch02、ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 JMP 相对地址 <code>@+4*XYZ<\/code> 的计算式，区分向前跳转操作码 <code>#f0<\/code> 与向后跳转操作码 <code>#f1<\/code>；\n<\/li><li>\n说明 GO 指令怎样把下一条指令地址存入 <span class=\"katex-inline\">\\<\/span>X$ 再转到绝对地址，以及怎样用 GO 返回；\n<\/li><li>\n走通 PUSHJ/POP 子程序连接：push 保存哪些寄存器、rJ 存什么、pop 怎样恢复并跳回；\n<\/li><li>\n解释 rG、rL 阈值下局部、边缘、全局寄存器的划分，以及 SAVE/UNSAVE 的上下文保存方向；\n<\/li><li>\n列出 rA 八个异常事件位 DVWIOUZX 的编号次序与处理程序地址，说清许可位为 0 置事件位、为 1 转处理程序的分流规则，区分 TRIP 与 TRAP。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>指令流默认按 @+4 顺序取下一条；JMP/GO/条件转移改写 @。子程序连接靠 rJ 记录返回地址、靠 push/pop 重映射局部寄存器避免冲突。算术异常先记入 rA 事件位，许可位决定是记下还是直接转处理程序；TRIP 转用户故障处理程序，TRAP 转操作系统陷阱处理程序。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 9：子程序连接与寄存器栈（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c09.md\" target=\"_blank\" rel=\"noopener\">概念 c09<\/a>。PUSHJ <span class=\"katex-inline\">\\<\/span>X,RA<span class=\"katex-inline\">：先执行 push(X)，把返回地址装入 rJ，再转到 RA（PDF 第 25 页）。push(X) 把局部寄存器 <\/span>\\<span class=\"katex-inline\">0<\/span> 至 <span class=\"katex-inline\">\\<\/span>X<span class=\"katex-inline\"> 保存起来暂时不可访问，原先的 <\/span>(X+1)<span class=\"katex-inline\"> 成为 <\/span>\\<span class=\"katex-inline\">0<\/span>、<span class=\"katex-inline\">(X+2)<\/span> 成为 <span class=\"katex-inline\">\\<\/span>1<span class=\"katex-inline\">，依此类推；编号 <\/span>K&gt;rG<span class=\"katex-inline\"> 的全局寄存器保留不变。POP <\/span>X,YZ<span class=\"katex-inline\"> 执行 pop(X) 后置 @=rJ+4*YZ。rG 是全局阈值寄存器，取值在 32 到 255 之间；<\/span>K&lt;rL<span class=\"katex-inline\"> 为局部寄存器，<\/span>rL\\le K\\le rG<span class=\"katex-inline\"> 为边缘寄存器（作源操作数时恒等于零），<\/span>K&gt;rG<span class=\"katex-inline\"> 为全局寄存器。SAVE <\/span>\\<span class=\"katex-inline\">X,0<\/span> 把全部寄存器存到寄存器栈顶部并把栈顶全字地址装入 <span class=\"katex-inline\">\\<\/span>X<span class=\"katex-inline\">；UNSAVE <\/span>Z$ 反向恢复上下文。<\/p>\n<h3>2. 概念 10：异常、故障与陷阱（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c10.md\" target=\"_blank\" rel=\"noopener\">概念 c10<\/a>。算术运算可能出现八种异常：整数除法校验 D、整数溢出 V、浮点转定点溢出 W、无效浮点操作 I、浮点上溢 O、浮点下溢 U、浮点除零 Z、浮点不精确 X（PDF 第 27 页）。rA 最右字节八个事件位按 DVWIOUZX 次序编号，D_BIT=<code>#80<\/code>、V_BIT=<code>#40<\/code>、W_BIT=<code>#20<\/code>、I_BIT=<code>#10<\/code>、O_BIT=<code>#08<\/code>、U_BIT=<code>#04<\/code>、Z_BIT=<code>#02<\/code>、X_BIT=<code>#01<\/code>；紧邻左边的许可位同序排列。异常出现时先看对应许可位：许可位为 0 则把事件位置 1，为 1 则转到处理程序地址 <code>#10,#20,#30,#40,#50,#60,#70,#80<\/code>。多个许可异常同时发生时优先处理最左边的。TRIP 迫使故障转到 <code>#00<\/code> 起的用户处理程序；TRAP 类似但转到操作系统，陷阱地址由专用寄存器 rT 提供。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    N[默认顺序 @+4 取下一条] --&gt; B{转移指令?}\n    B --&gt;|JMP/GO| J[改写 @ 到目标地址]\n    B --&gt;|条件转移 BN BZ BP...| C{条件成立?}\n    C --&gt;|是| J\n    C --&gt;|否| N\n    P[PUSHJ] --&gt; R1[push 保存局部寄存器]\n    P --&gt; R2[rJ ← @+4]\n    P --&gt; R3[@ ← RA]\n    R3 --&gt; SUB[子程序体]\n    SUB --&gt; POP[POP: pop 恢复局部寄存器]\n    POP --&gt; R4[@ ← rJ+4*YZ]\n    A[算术异常] --&gt; E{rA 许可位}\n    E --&gt;|0| EV[事件位置 1]\n    E --&gt;|1| H[转 #10-#80 处理程序]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：返回地址 rJ 与现场保存缺一不可；许可位分流是&quot;记录下来稍后查&quot;与&quot;立刻介入处理&quot;两条路径的分界。<\/p>\n<h2>推导一：JMP 相对地址与 GO 返回路径<\/h2>\n<p>指令默认下一条在 @+4（每条指令占一个半字 4 字节）。JMP RA 的目标写成相对偏移 <code>@+4*XYZ<\/code>：XYZ 是无符号三字节偏移，目标地址 = 当前指令地址 + 4×XYZ。<\/p>\n<ol><li>\n取书中例子：<code>JMP @+4*2<\/code> 的半字是 <code>#f0000002<\/code>。若这条指令出现在单元 <code>#1000<\/code>，偏移 <span class=\"katex-inline\">4\\times2=8<\/span>，下一条指令在 <code>#1000+8=#1008<\/code>。\n<\/li><li>\n相对偏移为负时，操作码增 1：<code>#f0<\/code> 向前跳，<code>#f1<\/code> 向后跳；<code>JMP @-4*2<\/code> 编码为 <code>#f1fffffe<\/code>，XYZ 字段是偏移加上 <span class=\"katex-inline\">2^{24}<\/span> 后的补码形态。\n<\/li><li>\nGO <span class=\"katex-inline\">\\<\/span>X,\\<span class=\"katex-inline\">Y,\\<\/span>Z<span class=\"katex-inline\">：先把顺序下一条指令地址写入 <\/span>u(\\<span class=\"katex-inline\">X)=@+4<\/span>，再把 @ 转到地址 <span class=\"katex-inline\">A=(u(\\<\/span>Y)+u(\\<span class=\"katex-inline\">Z))\\bmod 2^{64}<\/span>。\n<\/li><li>\n返回路径：转出前 <span class=\"katex-inline\">\\<\/span>X<span class=\"katex-inline\"> 已保存返回地址；稍后执行 <code>GO <\/span>X,<span class=\"katex-inline\">X,0<\/code>，以 Z=0 作立即常数，从 <\/span>\\<span class=\"katex-inline\">X<\/span> 所存地址跳回。\n<\/ol>\n<p>推导依据：相对跳转把目标编码成与当前位置的差值，指令字内只放偏移；GO 把绝对地址跳转与返回地址保存合并到一条指令。<\/p>\n<h2>推演二：PUSHJ/POP 子程序连接逐步走查<\/h2>\n<p>参照 §1.4.1 的 Max100 程序（PDF 第 56 页）：主程序用单条 <code>PUSHJ $1,Max100<\/code> 调用，子程序末尾是 <code>POP 2,0<\/code>。<\/p>\n<ol><li>\n主程序执行 <code>PUSHJ <span class=\"katex-inline\">1,Max100<\/code>：动作 push(1) 把当前 <\/span>\\<span class=\"katex-inline\">0,\\<\/span>1$ 保存进寄存器栈；rJ 装入紧接 PUSHJ 的下一条半字地址；@ 转到 Max100 入口。\n<\/li><li>\n进入子程序后局部寄存器重映射：原先的 <span class=\"katex-inline\">\\<\/span>2<span class=\"katex-inline\"> 成为新的 <\/span>\\<span class=\"katex-inline\">0<\/span>，原先的 <span class=\"katex-inline\">\\<\/span>3<span class=\"katex-inline\"> 成为新的 <\/span>\\<span class=\"katex-inline\">1<\/span>，依此上移；<span class=\"katex-inline\">K&gt;rG<\/span> 的全局寄存器不动。子程序体内用 <span class=\"katex-inline\">\\<\/span>0,\\<span class=\"katex-inline\">1<\/span> 等局部编号访问，不必知道调用者原来用了哪些编号。\n<\/li><li>\nMax100 体内完成 <span class=\"katex-inline\">\\<\/span>0<span class=\"katex-inline\">–<\/span>\\<span class=\"katex-inline\">99<\/span> 对应单元的最大值搜索，结果留在约定寄存器；末尾 <code>POP 2,0<\/code>：pop(2) 把除 2 之外的当前局部寄存器变回边缘寄存器，恢复最近一次 push 保存的局部寄存器原值。\n<\/li><li>\nPOP 置 @=rJ+4*0=rJ，控制回到主程序 PUSHJ 的下一条指令。<span class=\"katex-inline\">\\<\/span>1<span class=\"katex-inline\"> 带回最大值，<\/span>\\<span class=\"katex-inline\">2<\/span> 带回最大值位置。\n<\/li><li>\n若子程序需要保存更多现场，用 SAVE <span class=\"katex-inline\">\\<\/span>X,0<span class=\"katex-inline\"> 把当前局部、全局与专用寄存器一并存入寄存器栈顶部；UNSAVE <\/span>Z$ 按栈顶地址恢复，基本撤销前一条 SAVE。\n<\/ol>\n<p>推演依据：调用者与被调用者各自使用局部编号而不互相覆盖，靠 push 时保存旧值、pop 时恢复旧值；rJ 记录返回点，没有它子程序结束后无法知道回到哪里。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>取消 rJ，返回地址靠自修改指令写回子程序末尾<\/strong>：老一代机器的做法是把返回地址写进子程序末尾的跳转指令；不同调用点会改写同一条指令，重入或嵌套调用立刻互相破坏。rJ 把返回地址放到寄存器，子程序体本身保持只读可重入。\n<\/li><li>\n<strong>push 不重映射局部寄存器<\/strong>：调用者和子程序都用 <span class=\"katex-inline\">\\<\/span>0,\\<span class=\"katex-inline\">1<\/span> 当临时变量，子程序写 <span class=\"katex-inline\">\\<\/span>0$ 会覆盖调用者正在用的值；重映射加保存就是为了让局部编号在两侧各用各的。\n<\/li><li>\n<strong>许可位全部置 1，任何异常立即转处理程序<\/strong>：整数溢出这类常见事件会频繁打断主流程；许可位为 0 时事件只记进 rA 事件位，程序可在事后统一检查，两类策略对应不同容错需求。\n<\/li><li>\n<strong>TRIP 与 TRAP 不分层<\/strong>：用户级故障与操作系统级中断共用同一处理入口，用户程序就能直接改写陷阱向量表，隔离边界消失。两类中断分开是用户态与内核态保护的基础。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\nrJ 像借书时留的取书凭证：子程序办完自己的事，凭凭证回原来的座位；凭证丢了（没存 rJ）就回不去。\n<\/li><li>\n寄存器栈像一摞便签纸：push 把当前局部便签翻过去压在栈里，pop 再翻回来；全局寄存器放在最外层，谁都不动。\n<\/li><li>\n条件转移的 PBN/PBZ 系列是给分支预测的提示：预期过半会发生转移时写 PB 形式，帮助高速机器提前取指。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>误解：JMP 的目标是绝对地址。<\/strong> 普通 JMP 编码的是相对偏移 <code>@+4*XYZ<\/code>；汇编程序可以帮你把符号地址算成偏移，手写时目标仍随当前位置变化。\n<\/li><li>\n<strong>误解：边缘寄存器能正常保存数据。<\/strong> <span class=\"katex-inline\">rL\\le K\\le rG<\/span> 的边缘寄存器用作源操作数时恒等于零；只有被写作目标、rL 自动增大后才成为局部寄存器。\n<\/li><li>\n<strong>误解：事件位置 1 就等于已经跳转处理。<\/strong> 许可位为 0 时只置事件位；转处理程序发生在许可位为 1 的分支。rA 事件位记录的是尚未引起跳转的异常。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n<code>JMP @+4*2<\/code> 位于 <code>#1000<\/code>，下一条指令地址是多少？向前、向后跳转操作码各是什么？\n<\/li><li>\nGO 指令把什么值写入 <span class=\"katex-inline\">\\<\/span>X<span class=\"katex-inline\">？返回时为什么用 <code>GO <\/span>X,$X,0<\/code>？\n<\/li><li>\npush(X) 保存哪些寄存器？重映射后原 <span class=\"katex-inline\">\\<\/span>(X+1)$ 成为哪个编号？\n<\/li><li>\n按 DVWIOUZX 次序写出八个事件位的 <code>#80<\/code> 到 <code>#01<\/code> 编号；许可位为 0 和为 1 各发生什么？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ol><li>\n控制流：顺序 @+4；JMP 相对偏移，GO 绝对地址并存返回地址；条件转移按正负、零、奇偶分支，PB 系列带预测提示。\n<\/li><li>\n子程序连接：PUSHJ/push 保存局部寄存器并装 rJ；POP/pop 恢复并回 rJ；rG/rL 划分局部、边缘、全局；SAVE/UNSAVE 保存恢复完整上下文。\n<\/li><li>\n异常分流：rA 事件位 + 许可位；TRIP 转用户处理程序，TRAP 转操作系统；八个处理程序地址 <code>#10<\/code>–<code>#80<\/code>，左侧异常优先。\n<\/ol>\n<h2>与前后章节的衔接<\/h2>\n<p>本章是 MMIX 机器语言层的收口：前两章讲数据怎样表示与运算，本章讲指令流怎样控制、过程怎样调用、异常怎样介入。第二部分《MMIX 增补》把这套机器语言用到卷 1–3 的算法重写：信息结构、随机数、算术、排序、查找各章的 MMIX 程序，都建立在本章的子程序连接与第 2 章的整数/位级语义之上。<\/p>", "kind": "chapter", "title": "§1.3.1 后段与 §1.4.1：跳转转移、子程序连接、寄存器栈、故障与陷阱"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 MMIX增补.pdf · p.14<\/div><h1>二进制位、十六进制与数据宽度：字节、短字、半字、全字<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书 §1.3.1，PDF 第 14–15 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>计算机内部只处理 0 和 1 两种二进制位；多位位串按 8、16、32、64 位分组为字节、短字、半字、全字，每四位位串对应一个十六进制数字，宽度决定可表示整数的个数与上下限。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>机器电路只认识两种电平状态，无法直接存放十进制数字或汉字。困难有两层：一是怎样用 0/1 的组合表示整数、字符与指令；二是怎样让长位串可读、可核对。若不先固定位宽与编码约定，同一段位串在不同场合会被读成不同数值，算术溢出、地址越界、字符乱码都会随之出现。MMIX 以 64 位为基本处理宽度，先把位、字节、短字、半字、全字的层级关系定死，后续加载存储、整数算术、浮点解码才有共同的宽度依据。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>二进制位（bit）<\/strong>：取值只能是 0 或 1 的最小信息单元。MMIX 通常一次处理 64 个二进制位；书中长位串如 <code>100111100110111011110011011100111111010010100111110000010110<\/code>（式 (2)）就是 64 位的典型模式。<\/p>\n<p><strong>十六进制<\/strong>：每四位二进制位编成一个十六进制数字，取值 0–9、a–f。映射关系：0=<code>0000<\/code>，1=<code>0001<\/code>，2=<code>0010<\/code>，3=<code>0011<\/code>，4=<code>0100<\/code>，5=<code>0101<\/code>，6=<code>0110<\/code>，7=<code>0111<\/code>，8=<code>1000<\/code>，9=<code>1001<\/code>，a=<code>1010<\/code>，b=<code>1011<\/code>，c=<code>1100<\/code>，d=<code>1101<\/code>，e=<code>1110<\/code>，f=<code>1111<\/code>。为避免与十进制 0–9 混淆，十六进制数前加 <code>#<\/code>，上面的 64 位串写成 <code>#9e3779b97f4a7c16<\/code>。<\/p>\n<p><strong>数据宽度层级<\/strong>：<\/p>\n<ul><li>\n字节（byte，<span class=\"katex-inline\">M_1<\/span>）：8 位，2 个十六进制数字，可独立寻址；\n<\/li><li>\n短字（wyde，<span class=\"katex-inline\">M_2<\/span>）：16 位，2 个连续字节；\n<\/li><li>\n半字（tetra，<span class=\"katex-inline\">M_4<\/span>）：32 位，4 个连续字节；\n<\/li><li>\n全字（octa，<span class=\"katex-inline\">M_8<\/span>）：64 位，8 个连续字节，寄存器保存的单位。\n<\/ul>\n<p><strong>无符号取值范围<\/strong>：<span class=\"katex-inline\">n<\/span> 位位串按无符号整数解释，取值 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">2^n-1<\/span>。字节 <span class=\"katex-inline\">n=8<\/span>：0–255；短字 <span class=\"katex-inline\">n=16<\/span>：0–65535；半字 <span class=\"katex-inline\">n=32<\/span>：0–4294967295；全字 <span class=\"katex-inline\">n=64<\/span>：0–18446744073709551615。<\/p>\n<p><strong>补码取值范围<\/strong>：最左位作符号位，前导位为 1 时减去 <span class=\"katex-inline\">2^n<\/span> 得到对应整数。<span class=\"katex-inline\">n<\/span> 位补码范围 <span class=\"katex-inline\">-2^{n-1}<\/span> 到 <span class=\"katex-inline\">2^{n-1}-1<\/span>：字节 −128–127，短字 −32768–32767，半字 −2147483648–2147483647，全字 −9223372036854775808–9223372036854775807。<\/p>\n<p><strong>正例<\/strong>：−1 在四种宽度下分别是 <code>#ff<\/code>（字节）、<code>#ffff<\/code>（短字）、<code>#ffffffff<\/code>（半字）、<code>#ffffffffffffffff<\/code>（全字）；字母 <code>M<\/code> 的 ASCII 编码是 <code>#4d<\/code>。<\/p>\n<p><strong>反例<\/strong>：不能把 <code>#ff<\/code> 同时说成 255 和 −1 而不交代解释约定；按无符号它是 255，按 8 位补码它是 −1。<\/p>\n<h2>原理推导：位宽怎样决定取值个数与上下限<\/h2>\n<p><span class=\"katex-inline\">n<\/span> 位位串每一位有 0、1 两种选择，独立组合总数是 <span class=\"katex-inline\">2^n<\/span>。无符号解释把位串按二进制整数从小到大排序，最小位串全 0 对应 0，最大位串全 1 对应 <span class=\"katex-inline\">2^n-1<\/span>。<\/p>\n<p>以字节为例：<span class=\"katex-inline\">2^8=256<\/span> 个位模式，无符号取 0–255；补码把最左位当符号位，最高位 0 表示非负，覆盖 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">2^{7}-1=127<\/span>，最高位 1 表示负，对应 <span class=\"katex-inline\">-2^{7}=-128<\/span> 到 <span class=\"katex-inline\">-1<\/span>，合计仍是 256 个不同整数。<\/p>\n<p>宽度翻倍时上限按平方关系增长：短字上限 <span class=\"katex-inline\">2^{16}-1=65535<\/span>，半字上限 <span class=\"katex-inline\">2^{32}-1=4294967295<\/span>，全字上限 <span class=\"katex-inline\">2^{64}-1=18446744073709551615<\/span>。十六进制每数字四位，所以字节 2 位十六进制、短字 4 位、半字 8 位、全字 16 位，位数对应固定。<\/p>\n<p><strong>换算算例<\/strong>：把 <code>#9e3779b97f4a7c16<\/code> 逐数字译回二进制，每位补成四位：9=<code>1001<\/code>、e=<code>1110<\/code>、3=<code>0011<\/code>、7=<code>0111<\/code>、9=<code>1001<\/code>、b=<code>1011<\/code>、9=<code>1001<\/code>、7=<code>0111<\/code>、f=<code>1111<\/code>、4=<code>0100<\/code>、a=<code>1010<\/code>、7=<code>0111<\/code>、c=<code>1100<\/code>、1=<code>0001<\/code>、6=<code>0110<\/code>、6=<code>0110<\/code>，拼接得 64 位串。反向把 64 位串从右往左每四位一组，每组查表换回一个十六进制数字。短字 <code>#ffff<\/code> 按无符号是 65535，按 16 位补码是 −1；半字 <code>#ffffffff<\/code> 无符号 4294967295、补码 −1；全字 <code>#ffffffffffffffff<\/code> 无符号 18446744073709551615、补码 −1。同一个全字若只取低 16 位，得到的是短字视图，不复制新数据。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：讨论对象是定宽位串；编码采用二进制补码与十六进制分组；数值不越出所选宽度范围。\n<\/li><li>\n边界 1：越出范围的数装不进对应宽度。例如 256 超过 8 位无符号字节上限 255，必须用更宽字段；−129 低于字节补码下限 −128。\n<\/li><li>\n边界 2：十六进制只是书写约定，不改变位模式；大写字母 ABCDEF 与小写 abcdef 等价。\n<\/li><li>\n失败案例：把全字当半字截取低 32 位解释，高位信息丢失；把字节字符 <code>#4d<\/code> 当补码整数读成 77 还是无符号读成 77 在本例一致，但高位为 1 的字节两种解释会分道扬镳。\n<\/li><li>\n边界 3：字符编码有 ASCII 7 位、Latin-1 8 位、Unicode 16 位基本平面等不同约定，位宽与字符集要配套使用。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>位 vs 字节<\/strong>：位是最小单元，字节是可独立寻址的 8 位组；内存按字节编址，寄存器按全字操作。\n<\/li><li>\n<strong>无符号 vs 补码<\/strong>：同一位模式两套解释，差别只在最左位是否当符号位；判断大小、做减法时必须指明用哪一套。\n<\/li><li>\n<strong>短字 vs 半字<\/strong>：MMIX 术语里 wyde=16 位、tetra=32 位；不要按日常&quot;半个字&quot;的直觉把 16 位叫半字，书中半字固定指 32 位。\n<\/li><li>\n<strong>十六进制 vs 十进制<\/strong>：十六进制是位串的紧凑写法，十进制是人读数值；换算时每位十六进制数字独立对应四位，不借位。\n<\/ul>\n<p><strong>位宽对照<\/strong>：8 位字节、16 位短字、32 位半字、64 位全字是 MMIX 数据分量的四级宽度；地址与通用寄存器均为全字宽度。<\/p>\n<h2>联系<\/h2>\n<p>前置：无，这是机器表示的最底层。后继：c02 把这些宽度单位放进内存分组 <span class=\"katex-inline\">M_1/M_2/M_4/M_8<\/span> 与寄存器模型；c04 加载存储时按字节/短字/半字/全字扩展或截断；c07 浮点格式把 64 位全字再切成符号、指数、小数三段。位宽与取值范围是所有后续位级推演的边界依据。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（二进制位、十六进制与数据宽度：字节、短字、半字、全字）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：位宽、十六进制分组与取值范围的逐位核验<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要把一个位串读成确定的整数，往回追五层：<\/p>\n<ol><li>\n电路底层：每位只有 0、1 两种电平状态，这是所有编码的物理前提。\n<\/li><li>\n位串宽度：先固定这串有多少位 <span class=\"katex-inline\">n<\/span>；宽度不定，位数 <span class=\"katex-inline\">n<\/span> 不确定，后面的范围公式无处代入。\n<\/li><li>\n分组约定：按 4 位一组写成十六进制，按 8/16/32/64 位划成字节/短字/半字/全字；分组只改书写视图，不改位本身。\n<\/li><li>\n解释约定：无符号解释把最左位当普通数值位；补码解释把最左位当符号位。同一位模式选不同约定，得到不同整数。\n<\/li><li>\n取值范围：由 <span class=\"katex-inline\">n<\/span> 推出可表示个数 <span class=\"katex-inline\">2^n<\/span> 与上下限；越界数需要换更宽字段。\n<\/ol>\n<p>依赖方向：两态电路 → <span class=\"katex-inline\">n<\/span> 位位串 → 宽度分组 → 编码解释 → 范围与溢出边界。任何一层未定，下一层的数值结论都站不住。<\/p>\n<h2>正向推导：从位串个数到上下限<\/h2>\n<p><strong>第一步，计数。<\/strong> <span class=\"katex-inline\">n<\/span> 位位串每一位独立取 0 或 1，第一位 2 种，第二位 2 种，乘到第 <span class=\"katex-inline\">n<\/span> 位，总数 <span class=\"katex-inline\">2\\times2\\times\\cdots\\times2=2^n<\/span> 个。<\/p>\n<p><strong>第二步，无符号排序。<\/strong> 把位串看成二进制整数，最右位是 <span class=\"katex-inline\">2^0<\/span>，向左依次是 <span class=\"katex-inline\">2^1,2^2,\\dots,2^{n-1}<\/span>。全 0 串对应整数 0；全 1 串对应 <span class=\"katex-inline\">\\sum_{i=0}^{n-1}2^i=2^n-1<\/span>。中间每个位模式对应一个唯一整数，所以无符号范围是 <span class=\"katex-inline\">[0,2^n-1]<\/span>。<\/p>\n<p><strong>第三步，补码划分。<\/strong> 最左位（权 <span class=\"katex-inline\">2^{n-1}<\/span>）改作符号位：该位为 0 时，剩余 <span class=\"katex-inline\">n-1<\/span> 位表示 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">2^{n-1}-1<\/span>；该位为 1 时，按&quot;减去 <span class=\"katex-inline\">2^n<\/span>&quot;的约定对应负数，范围 <span class=\"katex-inline\">-2^{n-1}<\/span> 到 <span class=\"katex-inline\">-1<\/span>。两侧合起来仍是 <span class=\"katex-inline\">2^{n-1}+2^{n-1}=2^n<\/span> 个不同整数，位模式总数没有变。<\/p>\n<p><strong>第四步，十六进制对应。<\/strong> 4 位有 <span class=\"katex-inline\">2^4=16<\/span> 种组合，正好对应十六进制 0–f；所以 <span class=\"katex-inline\">n<\/span> 位位串的十六进制位数是 <span class=\"katex-inline\">n/4<\/span>：字节 8 位 → 2 位，短字 16 位 → 4 位，半字 32 位 → 8 位，全字 64 位 → 16 位。<\/p>\n<p><strong>第五步，宽度层级拼接。<\/strong> 短字由两个连续字节拼成：<span class=\"katex-inline\">M_2[2k]=M[2k]\\times2^8+M[2k+1]<\/span>；半字由四个字节拼成；全字由八个字节拼成。宽字段是窄字段的连续组合，不是另存一份数据。<\/p>\n<h2>数值算例一：#4d 与 #9e3779b97f4a7c16 的逐组换算<\/h2>\n<p><strong>算例 A：字符编码 <code>#4d<\/code>。<\/strong><\/p>\n<ol><li>\n拆成两个十六进制数字：高位 4、低位 d。\n<\/li><li>\n查表：4=<code>0100<\/code>，d=<code>1101<\/code>，拼接得 8 位 <code>01001101<\/code>。\n<\/li><li>\n按无符号二进制算权：<span class=\"katex-inline\">0\\times2^7+1\\times2^6+0\\times2^5+0\\times2^4+1\\times2^3+1\\times2^2+0\\times2^1+1\\times2^0=64+8+4+1=77<\/span>。\n<\/li><li>\n这是字母 <code>M<\/code> 的 ASCII 编码；最高位是 0，补码解释同为 77，两种解释在此一致。\n<\/ol>\n<p><strong>算例 B：全字 <code>#9e3779b97f4a7c16<\/code>。<\/strong><\/p>\n<ol><li>\n16 个十六进制数字逐位补四位：\n<ul>\n<li>\n9→<code>1001<\/code>，e→<code>1110<\/code>，3→<code>0011<\/code>，7→<code>0111<\/code>；\n<\/li><li>\n9→<code>1001<\/code>，b→<code>1011<\/code>，9→<code>1001<\/code>，7→<code>0111<\/code>；\n<\/li><li>\nf→<code>1111<\/code>，4→<code>0100<\/code>，a→<code>1010<\/code>，7→<code>0111<\/code>；\n<\/li><li>\nc→<code>1100<\/code>，1→<code>0001<\/code>，6→<code>0110<\/code>，6→<code>0110<\/code>。\n<\/li><li>\n拼接成 64 位串，最左位是 1：无符号解释为正的大数，补码解释为负数。\n<\/li><li>\n反向核验：从右往左每四位一组，<code>0110<\/code>=6、<code>0110<\/code>=6、<code>0001<\/code>=1、<code>1100<\/code>=c、<code>0111<\/code>=7、<code>1010<\/code>=a、<code>0100<\/code>=4、<code>1111<\/code>=f……译回的十六进制与原串一致，换算闭合。\n<\/ul>\n<\/ol>\n<h2>数值算例二：四种宽度的范围表与 −1 位模式<\/h2>\n<p><strong>无符号上限计算：<\/strong><\/p>\n<ol><li>\n字节：<span class=\"katex-inline\">2^8=256<\/span>，上限 <span class=\"katex-inline\">256-1=255<\/span>。\n<\/li><li>\n短字：<span class=\"katex-inline\">2^{16}=65536<\/span>，上限 <span class=\"katex-inline\">65536-1=65535<\/span>。\n<\/li><li>\n半字：<span class=\"katex-inline\">2^{32}=4294967296<\/span>，上限 <span class=\"katex-inline\">4294967296-1=4294967295<\/span>。\n<\/li><li>\n全字：<span class=\"katex-inline\">2^{64}=18446744073709551616<\/span>，上限 <span class=\"katex-inline\">18446744073709551615<\/span>。\n<\/ol>\n<p><strong>补码上下限：<\/strong><\/p>\n<ol><li>\n字节：下限 <span class=\"katex-inline\">-2^7=-128<\/span>，上限 <span class=\"katex-inline\">2^7-1=127<\/span>。\n<\/li><li>\n短字：下限 <span class=\"katex-inline\">-2^{15}=-32768<\/span>，上限 <span class=\"katex-inline\">2^{15}-1=32767<\/span>。\n<\/li><li>\n半字：下限 <span class=\"katex-inline\">-2^{31}=-2147483648<\/span>，上限 <span class=\"katex-inline\">2^{31}-1=2147483647<\/span>。\n<\/li><li>\n全字：下限 <span class=\"katex-inline\">-2^{63}=-9223372036854775808<\/span>，上限 <span class=\"katex-inline\">2^{63}-1=9223372036854775807<\/span>。\n<\/ol>\n<p><strong>−1 的位模式：<\/strong> 补码里 −1 是全 1 串。<\/p>\n<ol><li>\n字节 8 位全 1：<code>#ff<\/code>。\n<\/li><li>\n短字 16 位全 1：<code>#ffff<\/code>。\n<\/li><li>\n半字 32 位全 1：<code>#ffffffff<\/code>。\n<\/li><li>\n全字 64 位全 1：<code>#ffffffffffffffff<\/code>。\n<p>核验：全 1 串无符号值正是 <span class=\"katex-inline\">2^n-1<\/span>；补码值是 <span class=\"katex-inline\">2^n-1-2^n=-1<\/span>，两种解释在同一个全 1 串上分别对应上限和 −1。<\/p>\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：把全字低 32 位当完整数。<\/strong> 取全字 <code>#ffffffffffff0000<\/code>，若只截低半字 <code>#ffff0000<\/code> 解释，得到的是被截断后的值，高位的 <code>#ffffffff<\/code> 丢失。存储到 32 位字段时必须按目标宽度截取，跨宽度搬运前先确认高位是否承载有效信息。<\/p>\n<p><strong>案例 2：无符号与补码混用比较。<\/strong> 字节 <code>#ab<\/code>（<code>10101011<\/code>）无符号是 171，补码是 <span class=\"katex-inline\">171-256=-85<\/span>。若把它当无符号与 100 比较，结论是 171 大于 100；当补码比较，结论是 −85 小于 100。比较指令选 CMP（补码）还是 CMPU（无符号），取决于数的解释约定，不能凭位模式外观猜。<\/p>\n<p><strong>案例 3：术语宽度记错。<\/strong> 书中 wyde 是 16 位、tetra 是 32 位；若按日常&quot;半字=16 位&quot;的直觉把 tetra 当 16 位，范围表、字段截取位置都会算错。记术语时以书中字节—短字—半字—全字的固定层级为准。<\/p>\n<p><strong>案例 4：十六进制位数与宽度不匹配。<\/strong> 全字应写满 16 个十六进制数字；漏写前导零会让人误判宽度。<code>#7f<\/code> 是字节视图，<code>#000000000000007f<\/code> 才是同一数值的全字视图。<\/p>\n<h2>差生通读检查<\/h2>\n<p>逐句回看正文，补出每个符号的含义：<\/p>\n<ol><li>\n<span class=\"katex-inline\">n<\/span>：位串位数；<span class=\"katex-inline\">2^n<\/span>：位模式总数；<span class=\"katex-inline\">2^n-1<\/span>：无符号上限。\n<\/li><li>\n<span class=\"katex-inline\">M_1,M_2,M_4,M_8<\/span>：字节、短字、半字、全字的内存分组记号；下标是该组占用的字节数。\n<\/li><li>\n<code>#<\/code>：十六进制前缀；a–f 对应 10–15，不是变量。\n<\/li><li>\n<span class=\"katex-inline\">s(z)<\/span>：补码解释；<span class=\"katex-inline\">u(z)<\/span>：无符号解释；本概念先建立两套解释的存在，后续指令按 <span class=\"katex-inline\">s<\/span> 或 <span class=\"katex-inline\">u<\/span> 定义。\n<\/li><li>\n符号位：补码最左位；为 1 时整串减去 <span class=\"katex-inline\">2^n<\/span> 才是整数值。\n<\/li><li>\n越界：数值低于下限或高于上限，对应宽度装不下，需要换更宽字段或触发溢出事件。\n<\/ol>\n<h2>延伸推导：位权展开与十六进制换算的闭合验证<\/h2>\n<p>以 8 位串 <code>01001101<\/code> 为例，按位权展开：最右位权 <span class=\"katex-inline\">2^0=1<\/span>，向左依次 <span class=\"katex-inline\">2^1=2,\\ 2^2=4,\\ 2^3=8,\\ 2^4=16,\\ 2^5=32,\\ 2^6=64,\\ 2^7=128<\/span>。各位取值乘权求和：<span class=\"katex-inline\">0\\times128+1\\times64+0\\times32+0\\times16+1\\times8+1\\times4+0\\times2+1\\times1=77<\/span>。<\/p>\n<p>十六进制换算分两段验证。正向：高四位 <code>0100<\/code> 权值 <span class=\"katex-inline\">0\\times8+1\\times4+0\\times2+0\\times1=4<\/span>，低四位 <code>1101<\/code> 权值 <span class=\"katex-inline\">1\\times8+1\\times4+0\\times2+1\\times1=13=d<\/span>，合起来 <code>#4d<\/code>。反向：<code>#4d<\/code> 的 4 在高位组，权按 <span class=\"katex-inline\">4\\times16^1+13\\times16^0=64+13=77<\/span>，与二进制展开结果一致。两段路径得到同一个十进制值，换算闭合。<\/p>\n<p>再验全字视图：77 放进 64 位全字，高位全部补 0，写成 <code>#000000000000004d<\/code>；与字节视图 <code>#4d<\/code> 是同一数值的不同宽度表示。短字视图为 <code>#004d<\/code>，半字视图为 <code>#0000004d<\/code>，宽度每翻一倍，前面补一组十六进制零。<\/p>\n<h2>延伸算例：负数位模式的回推<\/h2>\n<p>已知 8 位补码 <code>#ff<\/code>，回推十进制：最左位为 1，按约定减去 <span class=\"katex-inline\">2^8=256<\/span>；无符号值是 <span class=\"katex-inline\">255<\/span>，补码值 <span class=\"katex-inline\">255-256=-1<\/span>。推广到 <span class=\"katex-inline\">n<\/span> 位全 1 串：无符号值 <span class=\"katex-inline\">2^n-1<\/span>，补码值 <span class=\"katex-inline\">(2^n-1)-2^n=-1<\/span>。<\/p>\n<p>再取短字 <code>#ffff<\/code>：无符号 <span class=\"katex-inline\">65535<\/span>，补码 <span class=\"katex-inline\">65535-65536=-1<\/span>。半字 <code>#ffffffff<\/code>：无符号 <span class=\"katex-inline\">4294967295<\/span>，补码 <span class=\"katex-inline\">4294967295-4294967296=-1<\/span>。全字 <code>#ffffffffffffffff<\/code>：无符号 <span class=\"katex-inline\">18446744073709551615<\/span>，补码 <span class=\"katex-inline\">-1<\/span>。四个宽度的 −1 都是全 1 串，宽度只改变串长，不改变&quot;全 1 即 −1&quot;这个补码事实。<\/p>\n<p>补码负数回推的一般步骤：先按无符号算出整串值 <span class=\"katex-inline\">u<\/span>，若符号位为 1，整数值 <span class=\"katex-inline\">s=u-2^n<\/span>；若符号位为 0，<span class=\"katex-inline\">s=u<\/span>。这个 <span class=\"katex-inline\">s(z)<\/span> 与 <span class=\"katex-inline\">u(z)<\/span> 的区分，正是后续 ADD/ADDU、CMP/CMPU 两套指令分叉的根源。<\/p>\n<h2>对抗性追问：能不能只用无符号表示负数<\/h2>\n<p>若机器不设符号位，负数要另存一个符号标记位，数值位仍按无符号排。这种方案下减法结果为负时需要单独翻转标记，加法、比较、取绝对值都要为符号标记走一套额外规则；补码把符号位编进位串本身，正数与负数共用同一套加法电路，溢出判断只看高位。MMIX 选择补码作为整数约定，代价是最左位失去普通数值权，收益是算术电路统一。<\/p>\n<p>追问二：十六进制能否换成八进制或三十二进制。可以，分组基数改变而已；八进制三位一组，三十二进制五位一组。MMIX 文档统一用十六进制，是因为 4 位正好对齐一个十六进制数字，与字节 8 位、全字 64 位都整除。<\/p>\n<h2>宽度与编码对照表<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>宽度<\/th><th>位数<\/th><th>十六进制位数<\/th><th>无符号范围<\/th><th>补码范围<\/th><th>−1 模式<\/th><\/tr><\/thead><tbody><tr><td>字节 <span class=\"katex-inline\">M_1<\/span><\/td><td>8<\/td><td>2<\/td><td>0–255<\/td><td>−128–127<\/td><td><code>#ff<\/code><\/td><\/tr><tr><td>短字 <span class=\"katex-inline\">M_2<\/span><\/td><td>16<\/td><td>4<\/td><td>0–65535<\/td><td>−32768–32767<\/td><td><code>#ffff<\/code><\/td><\/tr><tr><td>半字 <span class=\"katex-inline\">M_4<\/span><\/td><td>32<\/td><td>8<\/td><td>0–4294967295<\/td><td>−2147483648–2147483647<\/td><td><code>#ffffffff<\/code><\/td><\/tr><tr><td>全字 <span class=\"katex-inline\">M_8<\/span><\/td><td>64<\/td><td>16<\/td><td>0–18446744073709551615<\/td><td>−9223372036854775808–9223372036854775807<\/td><td><code>#ffffffffffffffff<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>读表顺序：先看位数列，再推十六进制位数（<span class=\"katex-inline\">n/4<\/span>），然后无符号上限 <span class=\"katex-inline\">2^n-1<\/span>，再定补码下限 <span class=\"katex-inline\">-2^{n-1}<\/span>、上限 <span class=\"katex-inline\">2^{n-1}-1<\/span>。表内每一行的 <span class=\"katex-inline\">2^n<\/span> 都等于上一行上限加 1，宽度翻倍时模式数翻平方倍。<\/p>\n<h2>第二延伸算例：短字位串的双向换算与越界判断<\/h2>\n<p>取短字位模式 <code>#1a3f<\/code>，先拆四个十六进制数字：1、a、3、f。<\/p>\n<ol><li>\n逐组译二进制：1=<code>0001<\/code>，a=<code>1010<\/code>，3=<code>0011<\/code>，f=<code>1111<\/code>，拼接得 16 位 <code>0001101000111111<\/code>。\n<\/li><li>\n无符号按位权求和：高八位 <code>00011010<\/code> 与低八位 <code>00111111<\/code>。高八位值 <span class=\"katex-inline\">1\\times16+10=26<\/span>，整体值 <span class=\"katex-inline\">26\\times256+63=6656+63=6719<\/span>。\n<\/li><li>\n符号位（最左位）是 0，补码值同为 6719；对照短字上限 32767，未越界。\n<\/li><li>\n反向核验：<span class=\"katex-inline\">6719\\div256=26<\/span> 余 63；26 写成十六进制 <code>1a<\/code>，63 写成 <code>3f<\/code>，拼回 <code>#1a3f<\/code>，双向闭合。\n<\/ol>\n<p>越界判断走同一套公式：把要存的数与目标宽度上下限比较。数 70000 要放进短字，短字无符号上限 65535，70000 大于上限，放不进；放进半字（上限 4294967295）则合法。负数 −40000 要放进短字，短字补码下限 −32768，−40000 低于下限，同样放不进。越界不是位串写错，是宽度选择小于数值所需位数。<\/p>\n<h2>再推一层：全 1 串为何等于 2^n−1<\/h2>\n<p>等比数列求和：全 1 串的位权和 <span class=\"katex-inline\">\\sum_{i=0}^{n-1}2^i<\/span>。在末尾补一个 <span class=\"katex-inline\">2^n<\/span> 再减一：<span class=\"katex-inline\">(2^n+2^{n-1}+\\cdots+1)-1<\/span>，括号内从 <span class=\"katex-inline\">2^0<\/span> 加到 <span class=\"katex-inline\">2^n<\/span> 的和是 <span class=\"katex-inline\">2^{n+1}-1<\/span>，减错位的构造更直接的写法是利用 <span class=\"katex-inline\">2^n-1=(2-1)(2^{n-1}+2^{n-2}+\\cdots+1)<\/span>，展开后每一位系数都是 1，正好对应全 1 位串。反过来，全 1 串加 1 会在第 <span class=\"katex-inline\">n<\/span> 位产生进位，低 <span class=\"katex-inline\">n<\/span> 位全变 0，即 <span class=\"katex-inline\">2^n<\/span>，所以全 1 串就是 <span class=\"katex-inline\">2^n-1<\/span>。<\/p>\n<p>补码下限 <span class=\"katex-inline\">-2^{n-1}<\/span> 单独看：它的位模式是最高位 1、其余全 0（字节 <code>#80<\/code>，短字 <code>#8000<\/code>，半字 <code>#80000000<\/code>，全字 <code>#8000000000000000<\/code>）。这个数没有对应的正数相反数在 <span class=\"katex-inline\">n<\/span> 位内表示，是补码不对称性的来源：负方向比正方向多一个编码。<\/p>\n<h2>差生通读复核：常见卡点<\/h2>\n<ul><li>\n卡点 1：把&quot;半字&quot;理解成 16 位。书中 tetra（半字）是 32 位，wyde（短字）才是 16 位；记牢 1-2-4-8 字节对应 8-16-32-64 位。\n<\/li><li>\n卡点 2：十六字母 a–f 当成变量。它们就是 10–15 的数字写法，参与同样的权值计算。\n<\/li><li>\n卡点 3：以为补码负数的数值位是&quot;绝对值取反加一&quot;之外另有一套独立编码。取反加一是构造补码的手工方法，机器内部仍按位串存；本概念只需要会从位模式回推整数值。\n<\/li><li>\n卡点 4：混淆字符码与整数。<code>#4d<\/code> 存进内存是位模式，当整数读是 77，当字符读是 <code>M<\/code>；解释由读取指令决定，位模式本身不变。\n<\/ul>\n<h2>自检问题<\/h2>\n<ol><li>\n写出 32 位半字的无符号上下限与补码上下限，并给出计算式。\n<\/li><li>\n把 <code>#3c<\/code> 译成 8 位二进制，分别按无符号和补码算出十进制值。\n<\/li><li>\n为什么全 1 串同时是无符号上限和补码 −1？两种解释各用什么公式？\n<\/li><li>\n短字、半字、全字各对应几个十六进制数字？依据是什么？\n<\/li><li>\n把全字存入字节字段时高位信息怎样处理？什么情况下这是合法截断，什么情况下是错误？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "二进制位、十六进制与数据宽度：字节、短字、半字、全字"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 MMIX增补.pdf · p.16<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">二进制位、十六进制与数据宽度：字节、短字、半字、全字<\/a><\/span><\/div><h1>内存与寄存器模型：M1/M2/M4/M8 分组、256 个通用寄存器与 32 个专用寄存器<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书 §1.3.1，PDF 第 16–17 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>从程序员视角，MMIX 由一块 <span class=\"katex-inline\">2^{64}<\/span> 字节的可寻址内存、256 个保存全字的通用寄存器和 32 个承担专门职责的专用寄存器组成；内存按 1/2/4/8 字节分组出字节、短字、半字、全字视图，数据在内存与寄存器之间往返并在寄存器内变换。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>写程序时要回答三个基础问题：数据存在哪里、用什么编号访问、宽字段怎样由窄字段拼成。没有统一模型，程序员会把寄存器号当内存地址，或把连续字节的拼接次序搞反。MMIX 把内存单元、通用寄存器、专用寄存器三类存储分开命名，并固定内存的多级分组视图，后面所有加载存储指令、算术指令、子程序现场保存都建立在这个布局上。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>内存空间<\/strong>：<span class=\"katex-inline\">2^{64}<\/span> 个存储单元，命名 <span class=\"katex-inline\">M[0],M[1],\\dots,M[2^{64}-1]<\/span>；每个单元存一个字节。若 <span class=\"katex-inline\">x&lt;0<\/span> 或 <span class=\"katex-inline\">x\\ge2^{64}<\/span>，定义 <span class=\"katex-inline\">M[x]=M[x\\bmod 2^{64}]<\/span>，地址按全字回绕。<\/p>\n<p><strong>通用寄存器<\/strong>：<span class=\"katex-inline\">2^8=256<\/span> 个，命名 <span class=\"katex-inline\">\\<\/span>0,\\<span class=\"katex-inline\">1,\\dots,\\<\/span>255<span class=\"katex-inline\">；每个寄存器保存一个 64 位全字。若 <\/span>x<span class=\"katex-inline\"> 是任意字节编号，<\/span>\\<span class=\"katex-inline\">x<\/span> 就是一个全字寄存器。<\/p>\n<p><strong>专用寄存器<\/strong>：32 个，命名 rA、rB、…、rZ、rBB、…、rZZ；每个同样保存全字，但职责专门化。例如 rA 控制算术中断，rR 保存除法余数，rH 保存乘积高半，rD 保存被除数高半，rJ 保存子程序返回地址，rG 是全局阈值，rL 是局部阈值，rM 是多路复用掩码。<\/p>\n<p><strong>内存多级分组<\/strong>：<\/p>\n<ul><li>\n短字 <span class=\"katex-inline\">M_2<\/span>：<span class=\"katex-inline\">2^{63}<\/span> 个，<span class=\"katex-inline\">M_2[2k]=M_2[2k+1]=M[2k]\\,M[2k+1]<\/span>，值为 <span class=\"katex-inline\">M[2k]\\times2^8+M[2k+1]<\/span>；\n<\/li><li>\n半字 <span class=\"katex-inline\">M_4<\/span>：<span class=\"katex-inline\">2^{62}<\/span> 个，<span class=\"katex-inline\">M_4[4k]=M_4[4k+1]=M_4[4k+2]=M_4[4k+3]<\/span>，由四个连续字节拼成；\n<\/li><li>\n全字 <span class=\"katex-inline\">M_8<\/span>：<span class=\"katex-inline\">2^{61}<\/span> 个，<span class=\"katex-inline\">M_8[8k]=M_8[8k+1]=\\cdots=M_8[8k+7]<\/span>，由八个连续字节拼成。\n<\/li><li>\n记号 <span class=\"katex-inline\">M_t[x]<\/span> 表示包含字节 <span class=\"katex-inline\">M[x]<\/span> 的 <span class=\"katex-inline\">t<\/span> 字节组；提到 <span class=\"katex-inline\">M_t[x]<\/span> 时忽略 <span class=\"katex-inline\">x<\/span> 最低位的 <span class=\"katex-inline\">\\lg t<\/span> 个二进制位；定义 <span class=\"katex-inline\">M_1[x]=M[x]<\/span>。\n<\/ul>\n<p><strong>数据通路<\/strong>：数据从内存传输到寄存器，在寄存器中变换，再从寄存器传输回内存。算术与位运算的操作数来自寄存器，不直接在内存字段上做。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">M_8[8k]<\/span> 的值等于 <span class=\"katex-inline\">M[8k]M[8k+1]\\dots M[8k+7]<\/span> 八个字节按从高到低拼成的全字；<span class=\"katex-inline\">\\<\/span>255$ 是合法通用寄存器编号。<\/p>\n<p><strong>反例<\/strong>：<span class=\"katex-inline\">\\<\/span>0<span class=\"katex-inline\"> 不是内存单元 <\/span>M[0]$；寄存器编号空间与内存地址空间分开，两者只通过加载/存储指令来往。<\/p>\n<h2>原理推导：分组数与对齐位的由来<\/h2>\n<p>内存总字节数是 <span class=\"katex-inline\">2^{64}<\/span>。每组占 <span class=\"katex-inline\">t<\/span> 个连续字节，组数就是总字节数除以 <span class=\"katex-inline\">t<\/span>：短字 <span class=\"katex-inline\">t=2<\/span>，组数 <span class=\"katex-inline\">2^{64}/2=2^{63}<\/span>；半字 <span class=\"katex-inline\">t=4=2^2<\/span>，组数 <span class=\"katex-inline\">2^{64}/2^2=2^{62}<\/span>；全字 <span class=\"katex-inline\">t=8=2^3<\/span>，组数 <span class=\"katex-inline\">2^{64}/2^3=2^{61}<\/span>。<\/p>\n<p>组内位置由地址低 <span class=\"katex-inline\">\\lg t<\/span> 位决定：短字组内偏移 0 或 1，对应低 1 位；半字组内偏移 0–3，对应低 2 位；全字组内偏移 0–7，对应低 3 位。取 <span class=\"katex-inline\">M_t[x]<\/span> 时把这些低位清零，得到组起始地址。通用寄存器数量 <span class=\"katex-inline\">2^8=256<\/span>，编号 0–255 正好填满 8 位字段，与指令中 X、Y、Z 各一字节的寄存器号宽度匹配。<\/p>\n<p><strong>布局算例<\/strong>：设内存 <span class=\"katex-inline\">M[1000],M[1001],\\dots,M[1007]<\/span> 依次为 <code>01 23 45 67 89 ab cd ef<\/code>。全字 <span class=\"katex-inline\">M_8[1000]<\/span> 由这八字节拼成 <code>#0123456789abcdef<\/code>；半字 <span class=\"katex-inline\">M_4[1000]<\/span> 是 <code>#01234567<\/code>，<span class=\"katex-inline\">M_4[1004]<\/span> 是 <code>#89abcdef<\/code>；短字 <span class=\"katex-inline\">M_2[1000]<\/span> 是 <code>#0123<\/code>，<span class=\"katex-inline\">M_2[1002]<\/span> 是 <code>#4567<\/code>，<span class=\"katex-inline\">M_2[1004]<\/span> 是 <code>#89ab<\/code>，<span class=\"katex-inline\">M_2[1006]<\/span> 是 <code>#cdef<\/code>。同一地址 1002 取短字用 <span class=\"katex-inline\">M_2[1002]<\/span>，取半字时低 2 位清零指向 <span class=\"katex-inline\">M_4[1000]<\/span>，取全字时低 3 位清零指向 <span class=\"katex-inline\">M_8[1000]<\/span>。<\/p>\n<p><strong>专用寄存器职责对照<\/strong>：rA 存算术状态与舍入模式；rR 存除法余数；rH 存 MULU 乘积高 8 字节；rD 存 DIVU 被除数高 8 字节；rJ 存子程序返回地址；rG 存全局寄存器阈值（32–255）；rL 存当前活动局部寄存器数；rM 存 MUX 选择掩码；rT 存陷阱处理程序地址；rK、rQ 控制外部中断屏蔽与请求。这些寄存器通过 GET <span class=\"katex-inline\">\\<\/span>X,Z<span class=\"katex-inline\"> 读取、PUT <\/span>X,\\<span class=\"katex-inline\">Z<\/span> 写入，编号 0–31 对应 g[0]–g[31]。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：程序员视角的虚拟内存模型；地址在 <span class=\"katex-inline\">[0,2^{64})<\/span> 内；寄存器编号 0–255。\n<\/li><li>\n边界 1：内存按字节编址，宽字段由连续字节组成，跨组访问由加载指令的地址字段处理；对齐与否影响取到的字段边界。\n<\/li><li>\n边界 2：专用寄存器不能当普通临时寄存器随意存放数据；rG、rL 等有取值约束，PUT 写入受限。\n<\/li><li>\n边界 3：地址回绕按 <span class=\"katex-inline\">\\bmod 2^{64}<\/span>，超出 <span class=\"katex-inline\">2^{64}<\/span> 的地址映射回合法区间；这不代表有 <span class=\"katex-inline\">2^{64}<\/span> 字节以上的物理内存。\n<\/li><li>\n失败案例：把 <span class=\"katex-inline\">\\<\/span>0<span class=\"katex-inline\"> 与 <\/span>M[0]$ 当同一存储，子程序保存现场时漏存寄存器，返回后临时值被破坏；把全字拆字节时次序写反，高字节低字节对调。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>内存 vs 寄存器<\/strong>：内存容量大、按地址访问；寄存器数量少、按编号访问、速度快；运算只在寄存器内进行。\n<\/li><li>\n<strong>通用 vs 专用寄存器<\/strong>：通用寄存器供程序自由分配；专用寄存器记录状态、余数、乘积高位、返回地址等机器内部信息，通过 GET/PUT 读写。\n<\/li><li>\n<strong><span class=\"katex-inline\">M_1/M_2/M_4/M_8<\/span> vs 独立存储<\/strong>：四级分组是同一块内存的不同视图，不复制数据；短字、半字、全字都落在字节数组之上。\n<\/li><li>\n<strong>寄存器号 vs 内存地址<\/strong>：编号都是 8 位外观，但命名空间不同；指令里的 <span class=\"katex-inline\">\\<\/span>X<span class=\"katex-inline\"> 是寄存器号，加载存储算出的 <\/span>A$ 是内存地址。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的位宽与字节层级。后继：c03 指令字段里的寄存器号取自 256 个通用寄存器；c04 加载存储在内存视图与寄存器之间搬运；c09 子程序连接靠寄存器栈保存局部通用寄存器，rG/rL 阈值划分局部、边缘、全局；c10 专用寄存器 rA、rB、rW、rX、rY、rZ 记录异常现场。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（内存与寄存器模型：M1/M2/M4/M8 分组、256 个通用寄存器与 32 个专用寄存器）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：内存分组计数、对齐掩码与寄存器分工的逐层核验<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要弄清一条加载指令从内存取到哪个字段，往回追四层：<\/p>\n<ol><li>\n物理底址：内存是 <span class=\"katex-inline\">2^{64}<\/span> 个一字节单元的数组，编号从 0 到 <span class=\"katex-inline\">2^{64}-1<\/span>。\n<\/li><li>\n分组视图：字节之上叠出短字（2 字节）、半字（4 字节）、全字（8 字节）三级视图，每组由连续字节拼成。\n<\/li><li>\n对齐规则：取 <span class=\"katex-inline\">t<\/span> 字节组时，地址低 <span class=\"katex-inline\">\\lg t<\/span> 位被忽略，组起始地址把这些低位清零。\n<\/li><li>\n寄存器分工：通用寄存器 256 个供程序使用，32 个专用寄存器存状态与机器内部结果；数据运算只在寄存器内发生。\n<\/ol>\n<p>依赖方向：字节数组 → 多级分组 → 对齐掩码 → 寄存器通路；分组与对齐不定，加载地址取到的字段边界就判错。<\/p>\n<h2>正向推导：组数、位宽与寄存器数<\/h2>\n<p><strong>分组计数。<\/strong> 总字节数 <span class=\"katex-inline\">2^{64}<\/span>，每组 <span class=\"katex-inline\">t<\/span> 字节，组数 <span class=\"katex-inline\">2^{64}/t<\/span>。<\/p>\n<ul><li>\n短字 <span class=\"katex-inline\">t=2=2^1<\/span>：组数 <span class=\"katex-inline\">2^{64}/2^1=2^{63}<\/span>。\n<\/li><li>\n半字 <span class=\"katex-inline\">t=4=2^2<\/span>：组数 <span class=\"katex-inline\">2^{64}/2^2=2^{62}<\/span>。\n<\/li><li>\n全字 <span class=\"katex-inline\">t=8=2^3<\/span>：组数 <span class=\"katex-inline\">2^{64}/2^3=2^{61}<\/span>。\n<\/ul>\n<p><strong>对齐位宽。<\/strong> 组内偏移需要 <span class=\"katex-inline\">\\lg t<\/span> 位编码：短字偏移 0/1 用 1 位，半字偏移 0/1/2/3 用 2 位，全字偏移 0–7 用 3 位。<span class=\"katex-inline\">M_t[x]<\/span> 起始地址 = <span class=\"katex-inline\">x<\/span> 减去 <span class=\"katex-inline\">x\\bmod t<\/span>，即把低 <span class=\"katex-inline\">\\lg t<\/span> 位清零。<\/p>\n<p><strong>寄存器编号宽度。<\/strong> 通用寄存器 <span class=\"katex-inline\">2^8=256<\/span> 个，编号 0–255 恰好占满 8 位；指令字段 X、Y、Z 各一字节，正好能放下一个通用寄存器号。专用寄存器 32 个 <span class=\"katex-inline\">=2^5<\/span>，编号 0–31，由 GET/PUT 的 5 位字段选择。<\/p>\n<p><strong>拼接公式。<\/strong> 短字值 <span class=\"katex-inline\">M_2[2k]=M[2k]\\times2^8+M[2k+1]<\/span>：高字节左移 8 位（乘 <span class=\"katex-inline\">2^8<\/span>）加低字节。半字由四字节拼成 <span class=\"katex-inline\">M[4k]\\times2^{24}+M[4k+1]\\times2^{16}+M[4k+2]\\times2^8+M[4k+3]<\/span>；全字由八字节拼成，最高字节权 <span class=\"katex-inline\">2^{56}<\/span>，最低字节权 <span class=\"katex-inline\">2^0<\/span>。<\/p>\n<h2>数值算例一：八字节布局的四级视图解码<\/h2>\n<p>设 <span class=\"katex-inline\">M[1000]<\/span> 到 <span class=\"katex-inline\">M[1007]<\/span> 依次为 <code>01 23 45 67 89 ab cd ef<\/code>，十六进制逐字节列出。<\/p>\n<ol><li>\n全字视图 <span class=\"katex-inline\">M_8[1000]<\/span>：八字节按高到低拼成 <code>#0123456789abcdef<\/code>。最高字节 <code>01<\/code> 权 <span class=\"katex-inline\">2^{56}<\/span>，其后依次 <span class=\"katex-inline\">2^{48},2^{40},2^{32},2^{24},2^{16},2^8,2^0<\/span>。\n<\/li><li>\n半字视图：<span class=\"katex-inline\">M_4[1000]<\/span> 取前四字节 <code>01 23 45 67<\/code> → <code>#01234567<\/code>；<span class=\"katex-inline\">M_4[1004]<\/span> 取后四字节 <code>89 ab cd ef<\/code> → <code>#89abcdef<\/code>。\n<\/li><li>\n短字视图：<span class=\"katex-inline\">M_2[1000]<\/span>=<code>#0123<\/code>，<span class=\"katex-inline\">M_2[1002]<\/span>=<code>#4567<\/code>，<span class=\"katex-inline\">M_2[1004]<\/span>=<code>#89ab<\/code>，<span class=\"katex-inline\">M_2[1006]<\/span>=<code>#cdef<\/code>。\n<\/li><li>\n字节视图：每个地址单独一字节，<span class=\"katex-inline\">M[1005]<\/span>=<code>#ab<\/code>。\n<\/ol>\n<p>取地址 1005 走对齐掩码：<\/p>\n<ul><li>\n<span class=\"katex-inline\">1005\\bmod8=5<\/span>，全字起始 <span class=\"katex-inline\">1005-5=1000<\/span>，即 <span class=\"katex-inline\">M_8[1000]<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">1005\\bmod4=1<\/span>，半字起始 <span class=\"katex-inline\">1005-1=1004<\/span>，即 <span class=\"katex-inline\">M_4[1004]<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">1005\\bmod2=1<\/span>，短字起始 <span class=\"katex-inline\">1005-1=1004<\/span>，即 <span class=\"katex-inline\">M_2[1004]<\/span>。\n<\/li><li>\n字节视图不掩码，仍是 <span class=\"katex-inline\">M[1005]<\/span>。\n<\/ul>\n<h2>数值算例二：地址回绕与寄存器编号边界<\/h2>\n<p><strong>地址回绕。<\/strong> 定义 <span class=\"katex-inline\">x&lt;0<\/span> 或 <span class=\"katex-inline\">x\\ge2^{64}<\/span> 时 <span class=\"katex-inline\">M[x]=M[x\\bmod2^{64}]<\/span>。取 <span class=\"katex-inline\">x=2^{64}<\/span>，<span class=\"katex-inline\">x\\bmod2^{64}=0<\/span>，映射到 <span class=\"katex-inline\">M[0]<\/span>；取 <span class=\"katex-inline\">x=-1<\/span>，<span class=\"katex-inline\">-1\\bmod2^{64}=2^{64}-1<\/span>，映射到末位字节单元。加载地址 <span class=\"katex-inline\">A=(u(\\<\/span>Y)+u(\\<span class=\"katex-inline\">Z))\\bmod2^{64}<\/span> 与这条回绕定义一致，加法溢出的高位被截掉，低位作为合法地址。<\/p>\n<p><strong>寄存器边界。<\/strong> 通用寄存器编号合法区间 0–255；指令字段一字节 8 位，编码范围 0–255，正好覆盖全部编号。编号 255 在书中常记作符号 <code>t<\/code>；全局寄存器阈值 rG 取值 32–255，<span class=\"katex-inline\">K&gt;rG<\/span> 为全局寄存器，<span class=\"katex-inline\">K&lt;rL<\/span> 为局部寄存器，<span class=\"katex-inline\">rL\\le K\\le rG<\/span> 为边缘寄存器。专用寄存器编号 0–31，GET/PUT 字段 <span class=\"katex-inline\">0\\le Z&lt;32<\/span>。<\/p>\n<p><strong>专用寄存器落点核验<\/strong>：rR 在 DIV 后写余数；rH 在 MULU 后写乘积高 8 字节；rD 是 DIVU 被除数高半；rJ 在 PUSHJ 后写返回地址；rA 低字节存八个事件位、旁邻许可位、再旁邻两位舍入模式。这些落点由指令形式定义固定，程序不能把它们当通用临时槽位。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：寄存器号与内存地址混用。<\/strong> 程序写 <span class=\"katex-inline\">\\<\/span>0<span class=\"katex-inline\"> 想访问 <\/span>M[0]<span class=\"katex-inline\">，实际改的是通用寄存器 <\/span>\\<span class=\"katex-inline\">0<\/span>，内存 <span class=\"katex-inline\">M[0]<\/span> 不变。两类编号空间分开：加载存储指令算出地址 <span class=\"katex-inline\">A<\/span> 访问内存，寄存器号直接出现在指令字段访问寄存器。<\/p>\n<p><strong>案例 2：字节拼接次序写反。<\/strong> 把 <code>01 23<\/code> 拼成 <code>#2301<\/code> 而不是 <code>#0123<\/code>，高字节低字节对调后整数值错 <span class=\"katex-inline\">2^8<\/span> 倍方向。拼接公式固定 <span class=\"katex-inline\">M[2k]\\times2^8+M[2k+1]<\/span>，先出现的字节是高位。<\/p>\n<p><strong>案例 3：忽略对齐掩码取错组。<\/strong> 地址 1005 直接当全字起始，会把字节 1005–1012 当一个全字，越出原八字节布局；取全字必须先把低 3 位清零到 1000。半字、短字访问按各自宽度对齐。<\/p>\n<p><strong>案例 4：随意写专用寄存器。<\/strong> PUT 写 rG 超出 32–255 区间、写 rA 超出 <code>#3ffff<\/code> 范围，写入受限；rC、rN、rO、rS、rL、rT、rTT、rK、rQ、rU、rV 等特殊专用寄存器根本不能由 PUT 写入。<\/p>\n<h2>延伸推导：为什么运算只放在寄存器<\/h2>\n<p>内存字段按字节编址，宽度视图重叠；若加法直接在内存短字段上做，每次运算都要先取字节、拼宽字段、算完再截断存回，字段宽度与溢出判断分散在每条内存访问上。MMIX 把操作数先取到 64 位全字寄存器，算术在全字内完成，存储时再按目标字段截断。寄存器是统一宽度的工作区，内存是分宽度的存储区，这个分工决定了加载—运算—存储的指令节奏。<\/p>\n<h2>差生通读检查<\/h2>\n<p>逐符号补义：<\/p>\n<ol><li>\n<span class=\"katex-inline\">M[x]<\/span>：字节单元；<span class=\"katex-inline\">M_2[x]<\/span> 短字；<span class=\"katex-inline\">M_4[x]<\/span> 半字；<span class=\"katex-inline\">M_8[x]<\/span> 全字；下标数字是字节数。\n<\/li><li>\n<span class=\"katex-inline\">\\lg t<\/span>：<span class=\"katex-inline\">t<\/span> 是 2 的几次方；<span class=\"katex-inline\">t=2,4,8<\/span> 对应 1,2,3 个被忽略的低位。\n<\/li><li>\n<span class=\"katex-inline\">\\<\/span>K$：通用寄存器；r 开头：专用寄存器；g[Z] 是专用寄存器的机器编号形式。\n<\/li><li>\n回绕：地址超界后按 <span class=\"katex-inline\">\\bmod2^{64}<\/span> 映射，不是报错丢地址。\n<\/li><li>\n全局/边缘/局部：由 rG、rL 两个阈值划分，不是寄存器固定属性，随子程序调用重映射。\n<\/ol>\n<h2>数值算例三：阈值划分与寄存器重映射<\/h2>\n<p>设当前 rL=2、rG=32。按规则划分：<\/p>\n<ol><li>\n<span class=\"katex-inline\">K&lt;2<\/span>，即 <span class=\"katex-inline\">\\<\/span>0,\\<span class=\"katex-inline\">1<\/span>：局部寄存器，当前子程序可直接读写。\n<\/li><li>\n<span class=\"katex-inline\">2\\le K\\le32<\/span>，即 <span class=\"katex-inline\">\\<\/span>2<span class=\"katex-inline\"> 到 <\/span>\\<span class=\"katex-inline\">32<\/span>：边缘寄存器，用作源操作数时读成零；若被写为目标，rL 自动增大到 <span class=\"katex-inline\">K+1<\/span>，该寄存器转为局部。\n<\/li><li>\n<span class=\"katex-inline\">K&gt;32<\/span>，即 <span class=\"katex-inline\">\\<\/span>33<span class=\"katex-inline\"> 到 <\/span>\\<span class=\"katex-inline\">255<\/span
