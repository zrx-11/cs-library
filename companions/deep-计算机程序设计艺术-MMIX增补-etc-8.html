SRU 3 得 <code>#07<\/code>。负数 <code>#f9<\/code>（补码 −7）算术右移 1 位：<span class=\"katex-inline\">\\lfloor-7/2\\rfloor=-4<\/span>，8 位补码 <code>#fc<\/code>；逻辑右移得 <code>#7c<\/code>，高位填零。<\/p>\n<h2>位级运算的组合边界<\/h2>\n<p>按位布尔结果不产生进位链，位与位独立；移位改变的是权值位置，移出的位按指令规则丢弃或记录到异常。条件复制按状态位决定是否写目标，不修改源寄存器。SADD 统计交集位，BDIF 做分量饱和减，两类指令都不跨分量传播进位。<\/p>\n<h2>补充：比较指令与按位指令的分工<\/h2>\n<p>CMP/CMPU 输出三值整数，结果可作为条件复制与转移的依据；AND/OR/XOR 直接操作位向量，不产生大小结论。条件复制 CS/ZS 读状态位决定目标写不写，本身不做算术。位级整理（掩码、提取、合并）走布尔与移位，分量差值走 BDIF 族，计数走 SADD，三类指令不要互换。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n<code>#f0<\/code> 与 <code>#0f<\/code> 的 AND、OR、XOR 各是什么十六进制？\n<\/li><li>\n<code>#ab<\/code> 算术右移 1 位与逻辑右移 1 位结果为何不同？各得什么？\n<\/li><li>\nCMP 输出哪三个值？相等时两个指示函数各取什么？\n<\/li><li>\nCS 与 ZS 在条件不满足时对 <span class=\"katex-inline\">\\<\/span>X$ 的处理有何不同？\n<\/li><li>\nSADD 统计哪些位？写出 Y、Z 条件。\n<\/ol><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 MMIX增补.pdf · p.22<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">整数算术：补码 s(z) 与无符号 u(z)、商余寄存器 rR/rH/rD 与扩展乘除<\/a><\/span><\/div><h1>双精度浮点位段拆分：符号位、11 位指数、52 位小数与五类数值<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch03（原书 §1.3.1，PDF 第 22–23 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一个 64 位浮点字按 IEEE 754 拆成 1 位符号、11 位偏置指数 E、52 位小数 F；指数字段 E 落在五个区间之一，分别对应正负零、弱规范数、规范数、正负无穷与 NaN，规范数值为 <span class=\"katex-inline\">\\pm2^{E-1023}(1+F/2^{52})<\/span>。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>整数只能表示离散的定宽数，科学计算需要表示极大、极小和带小数的实数。困难在于：固定 64 位既要覆盖很宽的量级范围，又要在常用区间保留足够有效位；还要给零、无穷、非法结果留确定编码。纯整数补码做不到这两点。MMIX 按 IEEE/ANSI 754 标准把位段分工：符号管正负，指数管量级，小数管精度，特殊编码处理异常值。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>位段划分<\/strong>：全字 <span class=\"katex-inline\">z<\/span> 最左位是符号位（0 正、1 负）；接着 11 位是指数部分 E；余下 52 位是小数部分 F。<\/p>\n<p><strong>五类解码<\/strong>：<\/p>\n<ol><li>\n<span class=\"katex-inline\">E=0,\\ F=0<\/span>：<span class=\"katex-inline\">\\pm0.0<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">E=0,\\ F\\neq0<\/span>：弱规范数（非规范数）<span class=\"katex-inline\">\\pm2^{-1074}F<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">0&lt;E&lt;2047<\/span>：规范数 <span class=\"katex-inline\">\\pm2^{E-1023}(1+F/2^{52})<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">E=2047,\\ F=0<\/span>：<span class=\"katex-inline\">\\pm\\infty<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">E=2047,\\ F\\neq0<\/span>：<span class=\"katex-inline\">\\pm\\mathrm{NaN}(F/2^{52})<\/span>。\n<\/ol>\n<p><strong>短浮点数<\/strong>：放在半字（32 位）上，符号 1 位、指数 8 位、小数 23 位；规范数公式 <span class=\"katex-inline\">\\pm2^{E-127}(1+F/2^{23})<\/span>。<\/p>\n<p><strong>偏置<\/strong>：规范数实际指数为 <span class=\"katex-inline\">E-1023<\/span>（双精度）或 <span class=\"katex-inline\">E-127<\/span>（短浮点）；E 是偏置后的无符号编码。<\/p>\n<p><strong>隐含前导 1<\/strong>：规范数尾数写作 <span class=\"katex-inline\">1+F/2^{52}<\/span>，整数位 1 不存入字段，由规范区间隐含。<\/p>\n<p><strong>正例<\/strong>：<code>#3ff0000000000000<\/code>：符号 0，E=1023，F=0，得 <span class=\"katex-inline\">2^0(1+0)=1.0<\/span>。<code>#4004000000000000<\/code>：E=1024，<span class=\"katex-inline\">F=2^{51}<\/span>，得 <span class=\"katex-inline\">2^1(1+0.5)=2.5<\/span>。<code>#bfe8000000000000<\/code>：符号 1，E=1022，<span class=\"katex-inline\">F=2^{51}<\/span>，得 <span class=\"katex-inline\">-2^{-1}(1+0.5)=-0.75<\/span>。<\/p>\n<p><strong>反例<\/strong>：漏掉隐含前导 1，会把 1.0 解成 0.5；把 E=2047 全当无穷，忽略 F 是否为零，会把 NaN 读成无穷。<\/p>\n<h2>原理推导：位段宽度、偏置与量级区间<\/h2>\n<p>双精度 64 位 = 1 + 11 + 52。指数 11 位可编码 0–2047；偏置 1023 把实际指数移到 <span class=\"katex-inline\">[-1023,1024]<\/span> 方向。规范数 <span class=\"katex-inline\">0&lt;E&lt;2047<\/span>，实际指数 <span class=\"katex-inline\">E-1023<\/span> 覆盖 <span class=\"katex-inline\">[-1022,1024]<\/span>；E=0 留给零与弱规范数，E=2047 留给无穷与 NaN，两端是保留编码。<\/p>\n<p>小数 52 位：<span class=\"katex-inline\">F/2^{52}<\/span> 是 <span class=\"katex-inline\">[0,1)<\/span> 区间的二进制小数；加上隐含 1，尾数落在 <span class=\"katex-inline\">[1,2)<\/span>。规格化尾数乘以 <span class=\"katex-inline\">2^{E-1023}<\/span> 得到最终值。弱规范数没有隐含前导 1，公式直接用 <span class=\"katex-inline\">2^{-1074}F<\/span>，衔接规范数最小量级。<\/p>\n<p>短浮点 1+8+23，偏置 127；有效精度少 29 位，量级范围也更窄。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：位段按双精度 64 位解释；解码先判 E 所属区间，再选公式。\n<\/li><li>\n边界 1：<span class=\"katex-inline\">+0.0<\/span> 与 <span class=\"katex-inline\">-0.0<\/span> 位模式不同（符号位不同），但相等判断视为相同。\n<\/li><li>\n边界 2：NaN 参与运算结果仍是 NaN；无穷加减有限数仍为无穷，无穷减无穷得 NaN。\n<\/li><li>\n边界 3：弱规范数用于平滑下溢到零，精度低于规范数。\n<\/li><li>\n失败案例：把指数字段当补码整数；忽略偏置直接用 E 当实际指数；规范数公式漏掉前导 1。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>规范数 vs 弱规范数<\/strong>：规范数有隐含前导 1，指数区间 0&lt;E&lt;2047；弱规范数 E=0、无前导 1，用于极小数衔接。\n<\/li><li>\n<strong>无穷 vs NaN<\/strong>：同在 E=2047，F=0 是无穷，F≠0 是 NaN。\n<\/li><li>\n<strong>指数 E vs 实际指数<\/strong>：E 是偏置编码，实际指数 <span class=\"katex-inline\">E-1023<\/span>；两者差常数偏置。\n<\/li><li>\n<strong>双精度 vs 短浮点<\/strong>：位段宽度与偏置量不同，不可套用同一公式。\n<\/ul>\n<p><strong>位段提取步骤<\/strong>：从全字取符号位用算术位移到第 0 位；取指数用右移 52 位后掩码 <code>#7ff<\/code>；取小数用掩码 <code>#fffffffffffff<\/code> 保留低 52 位。提取后按区间选公式，不要把三段混在一个整数里直接参与浮点运算。<\/p>\n<p><strong>量级范围<\/strong>：双精度规范数绝对值最小约 <span class=\"katex-inline\">2^{-1022}\\approx2.225\\times10^{-308}<\/span>，最大约 <span class=\"katex-inline\">2^{1024}(2-2^{-52})\\approx1.798\\times10^{308}<\/span>；超出最大记上溢，低于最小非零记下溢，分别由浮点异常位 O、U 报告。短浮点范围更窄，最大约 <span class=\"katex-inline\">3.403\\times10^{38}<\/span>。<\/p>\n<p><strong>零的符号<\/strong>：<span class=\"katex-inline\">+0.0<\/span> 与 <span class=\"katex-inline\">-0.0<\/span> 位模式只差符号位；数值比较视为相等，在某些带符号运算（如倒数、除法分母）中行为可能不同。零由 E=0、F=0 共同决定，不是 F 一位为零即可。<\/p>\n<p><strong>NaN 的小数位<\/strong>：NaN 的 F 不表示数值大小，可携带用于诊断的区别码；两条 NaN 即使符号相同，F 不同也不是同一个码位。<\/p>\n<p><strong>常用编码对照<\/strong>：<span class=\"katex-inline\">+0.0<\/span> 为 <code>#0000000000000000<\/code>；<span class=\"katex-inline\">1.0<\/span> 为 <code>#3ff0000000000000<\/code>；<span class=\"katex-inline\">2.5<\/span> 为 <code>#4004000000000000<\/code>；<span class=\"katex-inline\">-0.75<\/span> 为 <code>#bfe8000000000000<\/code>；<span class=\"katex-inline\">+\\infty<\/span> 为 <code>#7ff0000000000000<\/code>；<span class=\"katex-inline\">-\\infty<\/span> 为 <code>#fff0000000000000<\/code>；典型 NaN 为 <code>#7ff8000000000000<\/code>。这些位模式可作为解码时的对照锚点。<\/p>\n<p><strong>尾数精度含义<\/strong>：52 位小数给出约 15–17 位十进制有效数字；两个极接近的数可能在最低位相差一个 ulp（末位单位）。弱规范数尾数无前导 1，有效位更少，接近下溢时精度下降。<\/p>\n<p><strong>可表示性边界<\/strong>：分母为 2 的幂的小数可精确表示；十进制有限小数如 0.1、0.2 在二进制中是循环位串，存入后带截断误差。判断一个十进制小数能否精确表示，看其最简分母是否仅含因子 2。<\/p>\n<p><strong>解码顺序复核<\/strong>：先读符号位，再判 E 区间，区间内查 F 是否为零；公式只在对应区间选用，规范数的隐含前导 1 不进入弱规范数公式。<\/p>\n<h2>联系<\/h2>\n<p>前置：c01 位宽与位段拆分，c06 掩码与移位提取位段。后继：c08 浮点算术指令、舍入模式与 FIX/FLOT 互换；c10 浮点上溢 O、下溢 U、除零 Z、无效操作 I、不精确 X 是 rA 异常位中的五位。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（双精度浮点位段拆分：符号位、11 位指数、52 位小数与五类数值）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：位段提取、五类区间判定与浮点值逐位解码<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>要从一个浮点字算出数值，往回追五层：<\/p>\n<ol><li>\n宽度前提：对象是 64 位全字（双精度）或 32 位半字（短浮点），不是整数补码。\n<\/li><li>\n位段切分：按符号 1 位、指数 11 位、小数 52 位切开；短浮点为 1/8/23。\n<\/li><li>\n区间判定：先看指数字段 E 落在哪段，零、弱规范、规范、无穷、NaN 五选一。\n<\/li><li>\n公式代入：按所选区间取对应公式，偏置指数与隐含前导 1 只在规范区间出现。\n<\/li><li>\n符号还原：末步乘符号位方向（0 正、1 负）。\n<\/ol>\n<p>依赖方向：全字 → 位段 → E 区间 → 解码公式 → 带符号结果。跳过区间判定直接套规范数公式，零、无穷、NaN 都会解错。<\/p>\n<h2>正向推导：字段位置与位宽<\/h2>\n<p><strong>双精度字段。<\/strong> 64 位从高到低：<\/p>\n<ul><li>\n符号位：第 63 位，<code>bits &gt;&gt; 63<\/code>；\n<\/li><li>\n指数 E：第 62–52 位，共 11 位，<code>(bits &gt;&gt; 52) &amp; 0x7ff<\/code>，范围 0–2047；\n<\/li><li>\n小数 F：第 51–0 位，共 52 位，<code>bits &amp; ((1&lt;&lt;52)-1)<\/code>。\n<\/ul>\n<p><strong>偏置。<\/strong> 规范数实际指数 <span class=\"katex-inline\">e=E-1023<\/span>。E=1023 对应 <span class=\"katex-inline\">e=0<\/span>；E=1024 对应 <span class=\"katex-inline\">e=1<\/span>；E=1022 对应 <span class=\"katex-inline\">e=-1<\/span>。偏置把非负编码 E 映射到有正负的实际指数。<\/p>\n<p><strong>尾数。<\/strong> 规范数尾数 <span class=\"katex-inline\">1+F/2^{52}<\/span>：F 是 52 位无符号小数，<span class=\"katex-inline\">F/2^{52}\\in[0,1)<\/span>，加隐含前导 1 后尾数在 <span class=\"katex-inline\">[1,2)<\/span>。<\/p>\n<p><strong>保留编码。<\/strong> E=0 与 E=2047 不进规范公式：E=0 表零与弱规范数，E=2047 表无穷与 NaN，再用 F 是否为零细分。<\/p>\n<h2>数值算例一：1.0、2.5、−0.75 逐段解码<\/h2>\n<p><strong><code>#3ff0000000000000<\/code>（1.0）。<\/strong><\/p>\n<ol><li>\n符号位：最高位 0，正号。\n<\/li><li>\nE：<code>3ff<\/code> = <span class=\"katex-inline\">3\\times256+15\\times16+15=1023<\/span>。\n<\/li><li>\nF：52 位全 0，<span class=\"katex-inline\">F/2^{52}=0<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">0&lt;E&lt;2047<\/span>，规范数：<span class=\"katex-inline\">2^{1023-1023}(1+0)=1.0<\/span>。\n<\/ol>\n<p><strong><code>#4004000000000000<\/code>（2.5）。<\/strong><\/p>\n<ol><li>\n符号 0。\n<\/li><li>\nE=1024，实际指数 <span class=\"katex-inline\">1024-1023=1<\/span>。\n<\/li><li>\nF 最高位为 1，<span class=\"katex-inline\">F=2^{51}<\/span>，<span class=\"katex-inline\">F/2^{52}=1/2=0.5<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">2^1(1+0.5)=2\\times1.5=2.5<\/span>。\n<\/ol>\n<p><strong><code>#bfe8000000000000<\/code>（−0.75）。<\/strong><\/p>\n<ol><li>\n符号位 1，负号。\n<\/li><li>\nE=1022，实际指数 <span class=\"katex-inline\">-1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">F=2^{51}<\/span>，分数段 0.5。\n<\/li><li>\n<span class=\"katex-inline\">-2^{-1}(1+0.5)=-0.5\\times1.5=-0.75<\/span>。\n<\/ol>\n<h2>数值算例二：零、弱规范数、最小规范数、无穷、NaN<\/h2>\n<ol><li>\n<code>#0000000000000000<\/code>：E=0，F=0 → <span class=\"katex-inline\">+0.0<\/span>；符号位 1 的同款为 <span class=\"katex-inline\">-0.0<\/span>。\n<\/li><li>\n<code>#0000000000000001<\/code>：E=0，F=1 → 弱规范数 <span class=\"katex-inline\">2^{-1074}\\times1\\approx5\\times10^{-324}<\/span>，最小正浮点数。\n<\/li><li>\n<code>#0010000000000000<\/code>：E=1，F=0 → 最小规范数 <span class=\"katex-inline\">2^{1-1023}\\times1=2^{-1022}\\approx2.225\\times10^{-308}<\/span>。\n<\/li><li>\n<code>#7ff0000000000000<\/code>：E=2047，F=0 → <span class=\"katex-inline\">+\\infty<\/span>；符号位 1 为 <span class=\"katex-inline\">-\\infty<\/span>。\n<\/li><li>\n<code>#7ff8000000000000<\/code>：E=2047，F≠0 → NaN，<span class=\"katex-inline\">F/2^{52}<\/span> 携带区别码。\n<\/ol>\n<p>区间衔接：弱规范数上限与最小规范数在 <span class=\"katex-inline\">2^{-1022}<\/span> 附近过渡；E=0 公式 <span class=\"katex-inline\">2^{-1074}F<\/span> 无前导 1，覆盖规范数下溢后的极小值。<\/p>\n<h2>数值算例三：短浮点 2.5<\/h2>\n<p>短浮点 32 位：符号 1、指数 8（偏置 127）、小数 23。<\/p>\n<ol><li>\n2.5 = <span class=\"katex-inline\">1.5\\times2^1<\/span>，实际指数 1，<span class=\"katex-inline\">E=127+1=128<\/span>。\n<\/li><li>\n分数段 0.5，<span class=\"katex-inline\">F=0.5\\times2^{23}=2^{22}<\/span>，十六进制 <code>#200000<\/code>。\n<\/li><li>\n位串：符号 0 + E=<code>10000000<\/code> + F=<code>200000<\/code>，编码 <code>#40200000<\/code>，与 IEEE 短浮点一致。\n<\/li><li>\n对照双精度：同一数值双精度 F 占 52 位，短浮点只 23 位，低位精度丢弃。\n<\/ol>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：漏掉隐含前导 1。<\/strong> 把规范数公式写成 <span class=\"katex-inline\">2^{E-1023}(F/2^{52})<\/span>，1.0 会解成 0.5。前导 1 只在规范区间隐含，弱规范数公式没有这一项。 <strong>案例 2：把 E 当实际指数。<\/strong> E=1024 若直接当指数得 <span class=\"katex-inline\">2^{1024}<\/span>，量级全错；实际指数必须减偏置 1023。 <strong>案例 3：E=2047 一律当无穷。<\/strong> F≠0 是 NaN；只看指数不看小数会把非法结果读成无穷。 <strong>案例 4：双精度公式套到短浮点。<\/strong> 偏置 1023、小数 52 位换成 127、23 位；套错偏置指数与精度位都错。<\/p>\n<h2>延伸推导：为什么指数要偏置编码<\/h2>\n<p>若指数用 11 位补码，要占一位符号位，指数可用范围收窄；偏置编码让 E 本身是非负整数，两个浮点数按位串比较大小时，指数字段可直接参与比较。偏置量 1023 取规范指数范围中点附近，使 0 附近数值的 E 接近 1023。<\/p>\n<p>小数位宽度决定有效精度：52 位小数约对应 15–17 位十进制有效数字；短浮点 23 位约 6–7 位。位段总数固定 64 位，指数位多则量级宽、小数位少，二者此消彼长。<\/p>\n<h2>五类数值对照表<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>E<\/th><th>F<\/th><th>类别<\/th><th>双精度公式<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>正负零<\/td><td><span class=\"katex-inline\">\\pm0.0<\/span><\/td><\/tr><tr><td>0<\/td><td>≠0<\/td><td>弱规范数<\/td><td><span class=\"katex-inline\">\\pm2^{-1074}F<\/span><\/td><\/tr><tr><td>1–2046<\/td><td>任意<\/td><td>规范数<\/td><td><span class=\"katex-inline\">\\pm2^{E-1023}(1+F/2^{52})<\/span><\/td><\/tr><tr><td>2047<\/td><td>0<\/td><td>正负无穷<\/td><td><span class=\"katex-inline\">\\pm\\infty<\/span><\/td><\/tr><tr><td>2047<\/td><td>≠0<\/td><td>NaN<\/td><td><span class=\"katex-inline\">\\pm\\mathrm{NaN}(F/2^{52})<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>差生通读检查<\/h2>\n<ol><li>\n符号位：最左 1 位，0 正 1 负。\n<\/li><li>\nE：11 位偏置指数；实际指数 <span class=\"katex-inline\">E-1023<\/span>。\n<\/li><li>\nF：52 位小数；规范数加隐含前导 1。\n<\/li><li>\n弱规范数：E=0 且 F≠0；无穷与 NaN：E=2047。\n<\/li><li>\n短浮点：1+8+23，偏置 127。\n<\/ol>\n<h2>正向推导：把实数编码回位串<\/h2>\n<p>以 <span class=\"katex-inline\">-2.5<\/span> 为例反推编码：<\/p>\n<ol><li>\n符号：负号，符号位 1。\n<\/li><li>\n规范化：<span class=\"katex-inline\">2.5=1.25\\times2^1<\/span>，实际指数 1，<span class=\"katex-inline\">E=1023+1=1024<\/span>，十六进制段 <code>400<\/code>。\n<\/li><li>\n尾数分数：<span class=\"katex-inline\">1.25-1=0.25<\/span>，<span class=\"katex-inline\">F=0.25\\times2^{52}=2^{50}<\/span>，二进制为第 50 位 1，低位全 0。\n<\/li><li>\n拼接：符号 1 + E=1024 + F=<span class=\"katex-inline\">2^{50}<\/span>，得 <code>#c004000000000000<\/code>，与解码结果一致。\n<\/ol>\n<p>编码走查顺序：先定符号，再把数写成尾数 <span class=\"katex-inline\">\\times2^e<\/span> 的规格化形式，尾数调到 <span class=\"katex-inline\">[1,2)<\/span>，指数偏置后填 E，小数段存尾数超出 1 的部分。<\/p>\n<h2>位串与十六进制对照<\/h2>\n<p>64 位写成 16 位十六进制：符号位在第一个十六进制位的最高位；E 占前三位十六进制的高 11 位；F 占后 13 位十六进制。读编码时先取前三位判断 E 区间，再看末位段是否为零区分无穷与 NaN。<\/p>\n<p>短浮点 32 位写成 8 位十六进制：符号位在首位最高位，E 占首两位中的高 8 位，F 占后 6 位。<\/p>\n<h2>数值算例四：位段数值换算核验<\/h2>\n<p>取编码 <code>#4004000000000000<\/code>：<\/p>\n<ol><li>\n二进制首位 0 → 正。\n<\/li><li>\n前 11 位：<code>10000000000<\/code> = 1024。\n<\/li><li>\n52 位 F：<code>0100 0000...<\/code>，最高位 1 对应权值 <span class=\"katex-inline\">2^{51}<\/span>。\n<\/li><li>\n分数 <span class=\"katex-inline\">F/2^{52}=2^{51}/2^{52}=0.5<\/span>；尾数 1.5；<span class=\"katex-inline\">2^1\\times1.5=2.5<\/span>。\n<p>逐位权值：第 <span class=\"katex-inline\">i<\/span> 位（从低位 0 起）权值 <span class=\"katex-inline\">2^i<\/span>；F 的最高位是第 51 位，权值 <span class=\"katex-inline\">2^{51}<\/span>。<\/p>\n<\/ol>\n<p>取 <code>#bfe8000000000000<\/code>：首位 1 → 负；E=1022；F 同样 <span class=\"katex-inline\">2^{51}<\/span>；<span class=\"katex-inline\">2^{-1}\\times1.5=0.75<\/span>，加负号得 −0.75。<\/p>\n<h2>失败案例延伸<\/h2>\n<p><strong>案例 5：符号位与补码混用。<\/strong> 浮点负数由符号位给出，不是把尾数写成补码；把负整数的补码解释套到浮点字上，符号位、指数段都会错位。 <strong>案例 6：弱规范数当零。<\/strong> F≠0 的弱规范数虽小但非零，参与累加可能逐步影响结果；判零必须 E=0 且 F=0。 <strong>案例 7：NaN 比较。<\/strong> 任一操作数为 NaN 的比较结果为假，不等关系成立；不能用 NaN 等于自身来判断 NaN（NaN≠NaN）。 <strong>案例 8：无穷参与有限运算。<\/strong> <span class=\"katex-inline\">\\infty-\\infty<\/span>、<span class=\"katex-inline\">0\\times\\infty<\/span> 得 NaN；<span class=\"katex-inline\">\\infty+<\/span> 有限数仍为无穷；除以零得到对应符号的无穷。<\/p>\n<h2>对抗性追问：为什么小数段存尾数超出 1 的部分<\/h2>\n<p>规范尾数恒在 <span class=\"katex-inline\">[1,2)<\/span>，整数位 1 固定出现，不必占用一个存储位；把这一位省略换给小数精度。代价是 E=0 区间必须另立弱规范数公式，因为那条路径没有隐含前导 1。两套公式衔接，下溢时数值平滑降到零，而不是在最小规范数处突然截断。<\/p>\n<p>追问二：为什么 E=2047 要保留给异常值。整数表示没有&quot;除零&quot;&quot;无定义&quot;的位置；浮点用整段保留编码区分无穷与 NaN，让异常结果有固定位模式可识别，处理程序按 E、F 判定类别。<\/p>\n<h2>差生通读复核：常见卡点<\/h2>\n<ul><li>\n卡点 1：隐含前导 1 只属于规范数。\n<\/li><li>\n卡点 2：偏置 1023 是双精度常数；短浮点是 127。\n<\/li><li>\n卡点 3：零要 E=0 且 F=0 同时成立。\n<\/li><li>\n卡点 4：无穷与 NaN 都在 E=2047，细分看 F。\n<\/li><li>\n卡点 5：NaN 不等于自身，判 NaN 用异常比较指令。\n<\/ul>\n<h2>与其他概念的接口<\/h2>\n<ul><li>\n回 c01：64 位数据宽度决定三段总长度。\n<\/li><li>\n回 c06：掩码与移位用于取出 E、F 字段。\n<\/li><li>\n接 c08：浮点运算后按舍入模式回填位段，并可能置 O/U/Z/I/X 异常位。\n<\/li><li>\n接 c10：浮点异常进入 rA 事件位，由陷阱处理程序介入。\n<\/ul>\n<h2>数值算例五：最大规范数与上溢边界<\/h2>\n<p>最大规范数：E=2046，F 全 1，值 <span class=\"katex-inline\">2^{2046-1023}(2-2^{-52})=2^{1024}(1-2^{-53})\\approx1.7977\\times10^{308}<\/span>。E=2047、F=0 才是无穷；运算结果超过最大规范数时按舍入模式落向无穷或边界值，并置上溢异常位。<\/p>\n<p>最小规范数：E=1，F=0，值 <span class=\"katex-inline\">2^{1-1023}=2^{-1022}<\/span>。低于此值进入弱规范数区，E=0，F 从 1 到 <span class=\"katex-inline\">2^{52}-1<\/span>；F=0 为零。<\/p>\n<h2>数值算例六：短浮点边界对照<\/h2>\n<p>短浮点最大规范数 E=254、F 全 1，值约 <span class=\"katex-inline\">3.4028\\times10^{38}<\/span>；最小规范数 <span class=\"katex-inline\">2^{-126}<\/span>；最小弱规范数 <span class=\"katex-inline\">2^{-149}<\/span>。双精度与短浮点转换时，短浮点范围内的数可回填 52 位小数低位补零；超出短浮点范围先判定上溢/下溢。<\/p>\n<h2>位段操作的指令落点<\/h2>\n<p>取指数：右移 52 位后掩码 <code>#7ff<\/code>；取符号：右移 63 位；取小数：与 <code>#fffffffffffff<\/code> AND。判类别按 E 分支：E=0 查 F 是否为零，E=2047 查 F 是否为零，中间段走规范公式。解码程序先出类别，再选公式，避免对零和无穷套乘法公式。<\/p>\n<h2>失败案例补充<\/h2>\n<p><strong>案例 9：比较位串代替数值比较。<\/strong> 浮点数符号位在最高位，正数位串大于负数；同号按位串比较与数值比较方向一致，但 NaN 不参与普通大小比较。无符号整数比较指令不能直接替代浮点大小比较。 <strong>案例 10：把小数段当整数读。<\/strong> F 是 <span class=\"katex-inline\">[0,1)<\/span> 的二进制分数，不是 <span class=\"katex-inline\">[0,2^{52})<\/span> 的整数尾数；读成整数会把尾数放大 <span class=\"katex-inline\">2^{52}<\/span> 倍。<\/p>\n<h2>差生通读复核：五类判定顺序<\/h2>\n<ol><li>\n读符号位。\n<\/li><li>\n读 E；E=0 进零/弱规范分支。\n<\/li><li>\nE=2047 进无穷/NaN 分支。\n<\/li><li>\n其余进规范分支。\n<\/li><li>\n每个分支内再查 F 是否为零。\n<\/ol>\n<p>判定顺序不能颠倒：先看 F 再看 E，会把 E=0、F=1 的弱规范数误判为零。<\/p>\n<h2>换算练习：从数值到位段的完整走查<\/h2>\n<p>把 0.1 作对照（不要求精确编码，看结构）：0.1 写成二进制为无限循环小数，52 位小数截断后存入 F；E 调整到使尾数落在 <span class=\"katex-inline\">[1,2)<\/span>。十进制 0.1 在双精度中的实际存储值略大于或小于 0.1，这是二进制尾数不能精确表示十进制分数的结果，不是编码错误。<\/p>\n<p>走查步骤：<\/p>\n<ol><li>\n把数乘除 2 的幂，尾数调到 <span class=\"katex-inline\">[1,2)<\/span>，记录实际指数 <span class=\"katex-inline\">e<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">E=e+1023<\/span>，检查是否越界（<span class=\"katex-inline\">0&lt;E&lt;2047<\/span> 为规范数）。\n<\/li><li>\n尾数小数部分乘 <span class=\"katex-inline\">2^{52}<\/span> 取整得 F；超出 52 位的低位按舍入模式处理。\n<\/li><li>\n拼接符号、E、F 成 64 位字。\n<\/ol>\n<h2>术语对位<\/h2>\n<ul><li>\n<strong>尾数（mantissa/significand）<\/strong>：规范数的 <span class=\"katex-inline\">1+F/2^{52}<\/span> 部分。\n<\/li><li>\n<strong>指数偏置（bias）<\/strong>：1023（双精度）、127（短浮点）。\n<\/li><li>\n<strong>ulp<\/strong>：末位单位，相邻两个可表示数在该量级的间距。\n<\/li><li>\n<strong>弱规范数（denormal）<\/strong>：E=0、无前导 1 的非零小数。\n<\/li><li>\n<strong>NaN<\/strong>：非数值，E=2047 且 F≠0。\n<\/ul>\n<h2>补充：双精度位串长度核验<\/h2>\n<p>64 位 = 1 + 11 + 52；校验和：1+11=12，12+52=64。短浮点 32 位 = 1+8+23；1+8=9，9+23=32。位段长度对不上时，先检查是否把半字指令的 32 位格式套到全字上。<\/p>\n<p>指数段可编码数：双精度 11 位共 <span class=\"katex-inline\">2^{11}=2048<\/span> 个取值，0 与 2047 保留，中间 2046 个编码规范数；短浮点 8 位共 256 个取值，0 与 255 保留。<\/p>\n<h2>补充：位段掩码常数核验<\/h2>\n<p>取指数段掩码 <code>#7ff<\/code>（11 位全 1）；取小数段掩码 <code>#fffffffffffff<\/code>（52 位全 1）；符号位用右移 63 位取出。三段掩码互不重叠，提取后再按区间公式解码。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出双精度三段的位宽与偏置量。\n<\/li><li>\n解码 <code>#3ff0000000000000<\/code>：符号、E、F 与数值。\n<\/li><li>\nE=2047 时怎样区分无穷与 NaN？\n<\/li><li>\n最小规范数与最小弱规范数的公式各是什么？\n<\/li><li>\n短浮点 2.5 的 E 和 F 各是多少？\n<\/ol><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 MMIX增补.pdf · p.23<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">双精度浮点位段拆分：符号位、11 位指数、52 位小数与五类数值<\/a><\/span><\/div><h1>浮点指令族：四则运算、舍入模式、FINT/FIX/FLOT 定点互换与 FREM<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch03（原书 §1.3.1，PDF 第 23–24 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>MMIX 浮点指令以 <span class=\"katex-inline\">f(\\<\/span>X)$ 表示浮点寄存器值：FADD/FSUB/FMUL/FDIV 做四则，FSQRT 开方，FINT 把浮点舍入成整数形式，FIX/FLOT 在定点整数与浮点之间转换，FREM 按&quot;最近整数、平局取偶&quot;取余；不能精确赋值时按 rR 中的四种舍入模式回填位段。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>同一台机器要同时算整数计数和实数方程。整数指令按补码/无符号规则进位，浮点指令按位段公式操作量级与尾数；两套数制不能混用。困难包括：运算结果超过可表示位宽时落到哪个最近编码、浮点与整数互转时截断还是舍入、余数定义与整数 DIV 余数有何差别、NaN 与无穷怎样参与比较。本节把浮点指令族按运算、比较、转换、取余四类归位。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>四则与开方<\/strong>：<\/p>\n<ul><li>\nFADD <span class=\"katex-inline\">\\<\/span>X,\\<span class=\"katex-inline\">Y,\\<\/span>Z<span class=\"katex-inline\">：<\/span>f(\\<span class=\"katex-inline\">X)=f(\\<\/span>Y)+f(\\<span class=\"katex-inline\">Z)<\/span>；\n<\/li><li>\nFSUB：<span class=\"katex-inline\">f(\\<\/span>X)=f(\\<span class=\"katex-inline\">Y)-f(\\<\/span>Z)$；\n<\/li><li>\nFMUL：<span class=\"katex-inline\">f(\\<\/span>X)=f(\\<span class=\"katex-inline\">Y)\\times f(\\<\/span>Z)$；\n<\/li><li>\nFDIV：<span class=\"katex-inline\">f(\\<\/span>X)=f(\\<span class=\"katex-inline\">Y)/f(\\<\/span>Z)$；\n<\/li><li>\nFSQRT：<span class=\"katex-inline\">f(\\<\/span>X)=\\sqrt{f(\\<span class=\"katex-inline\">Z)}<\/span>。\n<\/ul>\n<p><strong>取整<\/strong>：FINT <span class=\"katex-inline\">\\<\/span>X,\\<span class=\"katex-inline\">Z<\/span>：<span class=\"katex-inline\">f(\\<\/span>X)=\\operatorname{intf}(\\<span class=\"katex-inline\">Z)<\/span>，把浮点数舍入到整数形式的浮点值。<\/p>\n<p><strong>比较<\/strong>：FCMP 输出 <span class=\"katex-inline\">[f(\\<\/span>Y)&gt;f(\\<span class=\"katex-inline\">Z)]-[f(\\<\/span>Y)&lt;f(\\<span class=\"katex-inline\">Z)]<\/span>，取值 <span class=\"katex-inline\">1/0/-1<\/span>；FEQL 输出 <span class=\"katex-inline\">[f(\\<\/span>Y)=f(\\<span class=\"katex-inline\">Z)]<\/span>；FUN 输出&quot;无序&quot;标志（含 NaN 的比较不构成大小关系）。<\/p>\n<p><strong>定点互换<\/strong>：<\/p>\n<ul><li>\nFIX：<span class=\"katex-inline\">s(\\<\/span>X)=\\operatorname{intf}(\\<span class=\"katex-inline\">Z)<\/span>，浮点转补码整数；\n<\/li><li>\nFIXU：结果取模 <span class=\"katex-inline\">2^{64}<\/span>，转无符号定点；\n<\/li><li>\nFLOT：<span class=\"katex-inline\">f(\\<\/span>X)=s(\\<span class=\"katex-inline\">Z)<\/span>，补码整数转浮点；\n<\/li><li>\nFLOTU：<span class=\"katex-inline\">f(\\<\/span>X)=u(\\<span class=\"katex-inline\">Z)<\/span>，无符号整数转浮点；\n<\/li><li>\nSFLOT/SFLOTU：转半字短浮点。\n<\/ul>\n<p><strong>取余<\/strong>：FREM <span class=\"katex-inline\">\\<\/span>X,\\<span class=\"katex-inline\">Y,\\<\/span>Z<span class=\"katex-inline\">：<\/span>f(\\<span class=\"katex-inline\">X)=f(\\<\/span>Y)\\operatorname{rem}f(\\<span class=\"katex-inline\">Z)<\/span>，定义为 <span class=\"katex-inline\">y-nz<\/span>，<span class=\"katex-inline\">n<\/span> 是最接近 <span class=\"katex-inline\">y/z<\/span> 的整数；两个整数同等接近时取最近的偶数。<\/p>\n<p><strong>舍入模式<\/strong>：rR 中 1 ROUND_OFF、2 ROUND_UP、3 ROUND_DOWN、4 ROUND_NEAR；FSQRT、FINT、FIX、FIXU、FLOT、FLOTU、SFLOT、SFLOTU 的 Y 字段可指定本次模式，覆盖当前 rR。<\/p>\n<p><strong>正例<\/strong>：2.5 + (−0.75)=1.75，编码 <code>#3ffc000000000000<\/code>；5 转浮点得 <code>#4014000000000000<\/code>；5 rem 2 = 1，7 rem 2 = −1。<\/p>\n<p><strong>反例<\/strong>：把 FREM 当整数 DIV 的向下取整余数；FIX 直接截尾不看舍入模式；用 FCMP 比较 NaN 期待大小结论。<\/p>\n<h2>原理推导：运算后的位段回填<\/h2>\n<p>浮点四则先按实数规则算中间结果，再把结果规范化：尾数调到 <span class=\"katex-inline\">[1,2)<\/span>，记录实际指数，必要时调整位段。中间结果尾数超出 52 位低位时，按当前舍入模式决定末位进位还是丢弃。指数超出 <span class=\"katex-inline\">[0,2047]<\/span> 保留编码范围时，落向无穷并置上溢位；下溢落向弱规范数或零并置下溢位。<\/p>\n<p>舍入四模式方向：<\/p>\n<ul><li>\nROUND_OFF：向零方向截断；\n<\/li><li>\nROUND_UP：向正无穷方向；\n<\/li><li>\nROUND_DOWN：向负无穷方向；\n<\/li><li>\nROUND_NEAR：就近，平局取偶。\n<\/ul>\n<p>转换走查：FLOT 把整数写成浮点规格化位段；FIX 先 intf 按模式取整，再转补码。SFLOT 先舍入存进无名半字，再回填全字形式。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：源操作数是合法浮点编码；四则与转换都经过舍入回填。\n<\/li><li>\n边界 1：除以零得对应符号无穷并置 Z 异常；无穷减无穷、0×无穷得 NaN 并置 I 异常。\n<\/li><li>\n边界 2：NaN 参与 FCMP 为无序，FEQL 对 NaN 为假；NaN≠NaN。\n<\/li><li>\n边界 3：<span class=\"katex-inline\">+0.0<\/span> 与 <span class=\"katex-inline\">-0.0<\/span> 位模式不同，FEQL 视为相等。\n<\/li><li>\n边界 4：FIX 结果超出补码范围按 FIXU 取模处理；无法精确表示的整数低位被舍入。\n<\/li><li>\n失败案例：FREM 的 n 方向与整数取整混淆；舍入模式字段放错操作数位置。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>FINT vs FIX<\/strong>：FINT 结果仍是浮点形式的整数；FIX 结果是定点补码整数。\n<\/li><li>\n<strong>FIX vs FIXU<\/strong>：同一取整数值，FIX 解释补码，FIXU 取模 <span class=\"katex-inline\">2^{64}<\/span> 解释无符号。\n<\/li><li>\n<strong>FLOT vs FLOTU<\/strong>：源整数分别按补码、无符号解释。\n<\/li><li>\n<strong>FREM vs DIV 余数<\/strong>：DIV 余数配合向下取整商；FREM 配合最近整数（平局取偶），余数符号跟随被除数方向。\n<\/li><li>\n<strong>FEQL vs FUN<\/strong>：FEQL 判相等，FUN 判无序（NaN 参与）。\n<\/ul>\n<p><strong>相对精度比较<\/strong>：FCMPE、FEQLE、FUNE 带相对误差 <span class=\"katex-inline\">\\operatorname{rE}<\/span> 的比较，判断两值是否在约定容差内相等或有序；普通 FCMP/FEQL/FUN 不引入容差。<\/p>\n<p><strong>常数变体<\/strong>：整数算术有带立即数的形式，浮点四则没有对应立即常数变体；小浮点常数需先经 FLOT 装入寄存器或从内存取。<\/p>\n<p><strong>舍入覆盖字段<\/strong>：需要临时换模式时，把模式编号写进指令 Y 字段；不写则沿用 rR 当前模式。模式编号 1–4 与 ROUND_OFF/UP/DOWN/NEAR 一一对应。<\/p>\n<p><strong>零与无穷的运算约定<\/strong>：加正负零不改变有限数大小；零乘无穷、无穷减无穷为 NaN；有限数除零得对应符号无穷；无穷加有限数仍为无穷。这些约定在 FDIV、FADD 等指令结果回填前由特殊编码分支先判定，不进普通尾数运算。<\/p>\n<p><strong>短浮点装载存储<\/strong>：LDSF 从内存半字读短浮点回填寄存器全字；STSF 反向把寄存器全字浮点压成半字存入内存。半字格式位段宽度见 c07 短浮点部分。<\/p>\n<p><strong>精度上限<\/strong>：绝对值大于 <span class=\"katex-inline\">2^{53}<\/span> 的整数不能被双精度尾数精确表示；短浮点该界限为 <span class=\"katex-inline\">2^{24}<\/span>。超出部分按舍入模式回填，不精确事件位置位。<\/p>\n<p><strong>运算结果异常登记<\/strong>：四则、开方、转换指令在回填位段的同时判定 O/U/Z/I/X 类别；异常位写入 rA 的流程见 c10。不精确事件 X 在末位被舍入改变时置位，与结果是否落在正常范围无关。<\/p>\n<p><strong>浮点比较的无序分支<\/strong>：含 NaN 的操作数不构成大小关系，FUN 输出无序标志；FCMP 的三值结论只在两操作数均可排序时有效。相等判断 FEQL 把 <span class=\"katex-inline\">+0.0<\/span> 与 <span class=\"katex-inline\">-0.0<\/span> 视为相同。<\/p>\n<h2>联系<\/h2>\n<p>前置：c07 位段解码与五类数值；c05 整数 DIV/DIVU 余数寄存器 rR。后继：c10 浮点上溢 O、下溢 U、除零 Z、无效 I、不精确 X 进入 rA 事件位；rR 舍入模式与专用寄存器访问指令配套。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（浮点指令、四种舍入模式与定点/浮点互换）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：四则回填位段、舍入四方向、定点互换与平局取余<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把一条浮点指令结果算到底，往回追六层：<\/p>\n<ol><li>\n数制识别：操作数按浮点 <span class=\"katex-inline\">f(\\cdot)<\/span> 还是定点 <span class=\"katex-inline\">s(\\cdot)/u(\\cdot)<\/span> 解释。\n<\/li><li>\n实数运算：先在实数域算中间结果，不考虑位宽。\n<\/li><li>\n规范化：尾数调到 <span class=\"katex-inline\">[1,2)<\/span>，定实际指数。\n<\/li><li>\n舍入回填：低位超出位宽时按 rR（或 Y 字段模式）选最近编码。\n<\/li><li>\n异常判定：上溢、下溢、除零、无效、不精确对应 rA 事件位。\n<\/li><li>\n结果落点：回浮点寄存器或定点寄存器；转换指令先取整再换数制。\n<\/ol>\n<p>依赖方向：数制 → 实数结果 → 规范化 → 舍入 → 异常 → 寄存器。数制识别错，后续全部按补码或浮点错解。<\/p>\n<h2>正向推导：浮点加法的位段走查<\/h2>\n<p>以 <span class=\"katex-inline\">2.5+(-0.75)=1.75<\/span> 为例：<\/p>\n<ol><li>\n实数结果 <span class=\"katex-inline\">2.5-0.75=1.75<\/span>。\n<\/li><li>\n规范化：<span class=\"katex-inline\">1.75=1.75\\times2^0<\/span>，尾数在 <span class=\"katex-inline\">[1,2)<\/span>，实际指数 <span class=\"katex-inline\">e=0<\/span>，<span class=\"katex-inline\">E=1023<\/span>。\n<\/li><li>\n尾数小数 <span class=\"katex-inline\">1.75-1=0.75=3/4<\/span>；<span class=\"katex-inline\">F=0.75\\times2^{52}=3\\times2^{50}<\/span>，二进制小数段前两位为 11。\n<\/li><li>\n编码：符号 0 + E=1023 + F=<span class=\"katex-inline\">3\\times2^{50}<\/span>，得 <code>#3ffc000000000000<\/code>。\n<\/li><li>\n核验解码：<span class=\"katex-inline\">2^0(1+0.75)=1.75<\/span>，与输入和一致。\n<\/ol>\n<p>加法先对齐指数：两数指数不同时，小指数的尾数右移补位，低位在对齐时丢失，丢失位参与舍入判定。乘法尾数相乘、指数相加；除法尾数相除、指数相减，再各自规范化。<\/p>\n<h2>正向推导：整数转浮点走查<\/h2>\n<p>整数 5 经 FLOT：<\/p>\n<ol><li>\n<span class=\"katex-inline\">5=1.25\\times2^2<\/span>，尾数 1.25，实际指数 <span class=\"katex-inline\">e=2<\/span>，<span class=\"katex-inline\">E=1023+2=1025<\/span>。\n<\/li><li>\n小数段 <span class=\"katex-inline\">0.25=1/4<\/span>，<span class=\"katex-inline\">F=2^{50}<\/span>。\n<\/li><li>\n编码 <code>#4014000000000000<\/code>；解码 <span class=\"katex-inline\">2^2(1+0.25)=4\\times1.25=5.0<\/span>。\n<\/ol>\n<p>大数转换：整数低位超出 52 位小数宽度时按舍入模式截断；FLOTU 把 <span class=\"katex-inline\">u(\\<\/span>Z)$ 当无符号正整数规格化。<\/p>\n<h2>数值算例一：FREM 平局取偶<\/h2>\n<p><strong><span class=\"katex-inline\">y=5,\\ z=2<\/span><\/strong>：<span class=\"katex-inline\">y/z=2.5<\/span>，相邻整数 2 与 3 同等接近；平局取偶，<span class=\"katex-inline\">n=2<\/span>；余数 <span class=\"katex-inline\">y-nz=5-2\\times2=1<\/span>。 <strong><span class=\"katex-inline\">y=7,\\ z=2<\/span><\/strong>：<span class=\"katex-inline\">7/2=3.5<\/span>，相邻整数 3 与 4；平局取偶，<span class=\"katex-inline\">n=4<\/span>；余数 <span class=\"katex-inline\">7-4\\times2=-1<\/span>。<\/p>\n<p>余数绝对值不超过 <span class=\"katex-inline\">|z|/2<\/span>（就近取余约定），符号由 <span class=\"katex-inline\">y-nz<\/span> 决定。对照整数 DIV：<span class=\"katex-inline\">5/2<\/span> 商 2 余 1；<span class=\"katex-inline\">7/2<\/span> 商 3 余 1；FREM 在 7 rem 2 上得 −1，差别来自 n 取最近偶数而非向下取整。<\/p>\n<h2>数值算例二：FIX 四模式取整 2.5 与 −2.5<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模式<\/th><th>2.5 结果<\/th><th>−2.5 结果<\/th><th>方向<\/th><\/tr><\/thead><tbody><tr><td>ROUND_OFF(1)<\/td><td>2<\/td><td>−2<\/td><td>向零截断<\/td><\/tr><tr><td>ROUND_UP(2)<\/td><td>3<\/td><td>−2<\/td><td>向正无穷<\/td><\/tr><tr><td>ROUND_DOWN(3)<\/td><td>2<\/td><td>−3<\/td><td>向负无穷<\/td><\/tr><tr><td>ROUND_NEAR(4)<\/td><td>2<\/td><td>−2<\/td><td>就近，平局取偶<\/td><\/tr><\/tbody><\/table><\/div>\n<p>2.5 平局：最近偶数为 2；−2.5 平局：最近偶数为 −2。FINT 输出同值的浮点形式；FIX 再把该整数值装进补码寄存器。FIXU 对超出无符号范围的结果按 <span class=\"katex-inline\">\\bmod2^{64}<\/span> 回填。<\/p>\n<h2>数值算例三：短浮点转换先舍入<\/h2>\n<p>SFLOT 把整数或浮点先舍入到半字短浮点格式（1+8+23），再转回全字形式。短浮点小数只 23 位，双精度 52 位尾数的低位在这一步丢弃；转换路径上的舍入模式同样由 Y 字段或 rR 指定。LDSF/STSF 在内存与寄存器间装载、存储短浮点，存储时把全字浮点压成半字格式。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：FREM 余数方向记错。<\/strong> 按 DIV 向下取整写 7 rem 2=1，与平局取偶规则的 −1 不符；先定 n 再算 <span class=\"katex-inline\">y-nz<\/span>。 <strong>案例 2：FIX 一律截尾。<\/strong> ROUND_UP 下 2.5 得 3；模式不同结果不同，必须先看模式字段。 <strong>案例 3：NaN 比较取大小。<\/strong> FCMP 遇 NaN 属无序，不能产出有意义的 −1/0/1；判无序用 FUN。 <strong>案例 4：零符号忽略。<\/strong> <span class=\"katex-inline\">+0.0<\/span> 与 <span class=\"katex-inline\">-0.0<\/span> FEQL 相等，但带符号运算中零的符号可能影响结果符号约定。 <strong>案例 5：转换越界不判模。<\/strong> FIX 结果超出补码表示范围时，FIXU 路径按 <span class=\"katex-inline\">2^{64}<\/span> 取模；补码路径上溢由异常位报告。<\/p>\n<h2>延伸推导：异常位与指令的对应<\/h2>\n<ul><li>\nZ（除零）：FDIV 除数为零；\n<\/li><li>\nO（上溢）：结果指数超过规范范围；\n<\/li><li>\nU（下溢）：结果进入弱规范数区或低于最小规范数；\n<\/li><li>\nI（无效）：NaN 输入、无穷减无穷、0×无穷等非法操作；\n<\/li><li>\nX（不精确）：舍入发生、低位被丢弃。\n<\/ul>\n<p>运算指令结果回填后，这些事件位置入 rA 低八位；处理程序按 c10 的优先级与入口地址响应。<\/p>\n<h2>指令族对照表<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>类别<\/th><th>指令<\/th><th>结果<\/th><\/tr><\/thead><tbody><tr><td>四则<\/td><td>FADD/FSUB/FMUL/FDIV<\/td><td>浮点和/差/积/商<\/td><\/tr><tr><td>开方<\/td><td>FSQRT<\/td><td>非负浮点平方根<\/td><\/tr><tr><td>取整<\/td><td>FINT<\/td><td>浮点形式整数<\/td><\/tr><tr><td>比较<\/td><td>FCMP/FEQL/FUN<\/td><td>三值/相等/无序<\/td><\/tr><tr><td>转定点<\/td><td>FIX/FIXU<\/td><td>补码/无符号整数<\/td><\/tr><tr><td>转浮点<\/td><td>FLOT/FLOTU<\/td><td>整数补码/无符号转浮点<\/td><\/tr><tr><td>短浮点<\/td><td>SFLOT/SFLOTU/LDSF/STSF<\/td><td>半字格式转换与装载<\/td><\/tr><tr><td>取余<\/td><td>FREM<\/td><td><span class=\"katex-inline\">y-nz<\/span>，平局取偶<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>差生通读检查<\/h2>\n<ol><li>\n<span class=\"katex-inline\">f(\\<\/span>X)<span class=\"katex-inline\">：浮点寄存器值；<\/span>s/u$：补码/无符号定点解释。\n<\/li><li>\nrR：当前舍入模式寄存器；Y 字段可临时覆盖。\n<\/li><li>\nintf：按模式把浮点舍入为整数。\n<\/li><li>\nn：FREM 中最接近 <span class=\"katex-inline\">y/z<\/span> 的整数，平局取偶。\n<\/li><li>\n异常位：Z/O/U/I/X 在浮点运算后置入 rA。\n<\/ol>\n<h2>正向推导：指数对齐与尾数加减<\/h2>\n<p>浮点加法不像整数那样逐位进位相加，先对齐指数：<\/p>\n<ol><li>\n比较两数实际指数，取大者为结果指数方向；小指数尾数右移，位移差等于指数差。\n<\/li><li>\n右移移出的低位进入舍入判定位，不直接丢弃。\n<\/li><li>\n对齐后尾数按整数加减；若结果尾数不在 <span class=\"katex-inline\">[1,2)<\/span>，左移或右移回规格化区间，指数相应调整。\n<\/li><li>\n末位按舍入模式回填 52 位小数段。\n<\/ol>\n<p>减法同加法，只对减数尾数取反加一；两相近大数相减可能丢失有效位（相消），结果有效精度下降。<\/p>\n<h2>正向推导：乘除的指数与尾数<\/h2>\n<p>乘法：尾数相乘，实际指数相加；乘积尾数可能落在 <span class=\"katex-inline\">[2,4)<\/span>，右移一位归到 <span class=\"katex-inline\">[1,2)<\/span>，指数加一。除法：尾数相除，实际指数相减；商尾数若低于 1，左移归位，指数减一。开方：尾数开平方，指数折半，指数为奇数时配合尾数移位调整。<\/p>\n<h2>数值算例四：5.0 编码复核<\/h2>\n<p>整数 5 的浮点编码 <code>#4014000000000000<\/code>：<\/p>\n<ol><li>\n符号 0；E=<code>401<\/code> 十六进制 = <span class=\"katex-inline\">4\\times256+1=1025<\/span>；实际指数 <span class=\"katex-inline\">1025-1023=2<\/span>。\n<\/li><li>\nF 段 <code>4000000000000<\/code>，最高位权值 <span class=\"katex-inline\">2^{50}<\/span>；<span class=\"katex-inline\">F/2^{52}=2^{50}/2^{52}=0.25<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">2^2(1+0.25)=5.0<\/span>。\n<p>对照 1.0 的 E=1023、F=0；5.0 比 1.0 指数高 2，小数段带 0.25 尾数。<\/p>\n<\/ol>\n<h2>数值算例五：1.75 编码复核<\/h2>\n<p><code>#3ffc000000000000<\/code>：E=1023，实际指数 0；F=<code>c000000000000<\/code>=<span class=\"katex-inline\">3\\times2^{50}<\/span>；<span class=\"katex-inline\">F/2^{52}=3/4=0.75<\/span>；<span class=\"katex-inline\">1+0.75=1.75<\/span>。若结果是 3.5：<span class=\"katex-inline\">3.5=1.75\\times2^1<\/span>，E=1024，同一 F 段，编码 <code>#400c000000000000<\/code>。<\/p>\n<h2>失败案例延伸<\/h2>\n<p><strong>案例 6：把浮点余数当模运算。<\/strong> FREM 余数可正可负，取模定义才恒非负；两个概念在平局与负数方向上都不同。 <strong>案例 7：短浮点转换位宽。<\/strong> SFLOT 先压到 23 位小数，再扩回全字；低位不是补零保留原值，而是经舍入后的短格式回填。 <strong>案例 8：容差比较漏读 rE。<\/strong> FCMPE 类比较依赖 <span class=\"katex-inline\">\\operatorname{rE}<\/span> 给出的相对误差；普通指令把相等判成位段全等，NaN 与零符号另有约定。 <strong>案例 9：不精确事件忽略。<\/strong> 只要舍入改变了末位，X 位置位；即使结果落在正常范围，精度损失仍被记录。<\/p>\n<h2>对抗性追问：为什么转换要先取整再换数制<\/h2>\n<p>浮点表示的是实数近似，定点整数要求离散整值；直接把浮点位段当整数读会得到位串对应的补码大数，不是数值。FIX 先 intf 到整数再装补码，FLOT 先把整数规格化成浮点位段，两个方向各走一遍数制转换。<\/p>\n<p>追问二：为什么余数用最近整数而不是向下取整。就近余数绝对值小，配合距离度量与周期函数更自然；平局取偶保证余数在中点处可预测，避免正负方向随机选择。<\/p>\n<h2>差生通读复核：常见卡点<\/h2>\n<ul><li>\n卡点 1：FINT 结果仍是浮点；FIX 结果才是定点。\n<\/li><li>\n卡点 2：FIXU 按 <span class=\"katex-inline\">\\bmod2^{64}<\/span>，不等于补码符号解释。\n<\/li><li>\n卡点 3：FREM 的 n 平局取偶，不是向下取整。\n<\/li><li>\n卡点 4：舍入模式可由指令 Y 字段临时覆盖。\n<\/li><li>\n卡点 5：NaN 用 FUN 判无序，不进 FCMP 大小结论。\n<\/ul>\n<h2>与其他概念的接口<\/h2>\n<ul><li>\n回 c07：运算结果位段按五类区间回填；上溢下溢回到保留编码判定。\n<\/li><li>\n回 c05：整数 DIV 余数走 rR；浮点 FREM 结果回寄存器，规则不同。\n<\/li><li>\n接 c10：Z/O/U/I/X 五个事件位由浮点运算置入 rA。\n<\/ul>\n<h2>数值算例六：舍入末位走查<\/h2>\n<p>设中间结果尾数小数段在 52 位后多出一位 1，其余低位全 0，当前 ROUND_NEAR：<\/p>\n<ol><li>\n多余位恰为半 ulp，平局；看末位奇偶，偶数舍、奇数入。\n<\/li><li>\nROUND_UP：无论低位多少，向正方向进一位。\n<\/li><li>\nROUND_DOWN：向负方向截断。\n<\/li><li>\nROUND_OFF：向零方向截断，负数与正数截断方向各自靠近零。\n<p>舍入后的末位进位可能让尾数从 <span class=\"katex-inline\">1.111\\cdots<\/span> 进到 <span class=\"katex-inline\">2.000\\cdots<\/span>，此时尾数右移一位、指数加一，回规格化区间。<\/p>\n<\/ol>\n<h2>数值算例七：比较指令取值走查<\/h2>\n<p><span class=\"katex-inline\">f(\\<\/span>Y)=2.5,\\ f(\\<span class=\"katex-inline\">Z)=1.0<\/span>：FCMP 得 <span class=\"katex-inline\">[2.5&gt;1.0]-[2.5&lt;1.0]=1-0=1<\/span>。相等时两个指示函数都 0，得 0。<span class=\"katex-inline\">\\<\/span>Y<span class=\"katex-inline\"> 为 NaN：FUN 条件成立，FCMP 不产出有序结论。FEQL 对 <\/span>+0.0<span class=\"katex-inline\"> 与 <\/span>-0.0$ 输出 1，对两个不同 NaN 输出 0。<\/p>\n<h2>转换指令的操作数形式<\/h2>\n<p>多数转换指令有两种写法：单源 <code>FIX <span class=\"katex-inline\">X,<\/span>Z<\/code> 用当前模式；双源 <code>FIX <span class=\"katex-inline\">X,Y,<\/span>Z<\/code> 由 Y 字段给模式、<span class=\"katex-inline\">Z<\/span> 给源值。FLOT、FLOTU、SFLOT、SFLOTU、FINT、FSQRT 同此结构。模式字段取值 1–4，写越界按机器约定界定。<\/p>\n<h2>术语对位<\/h2>\n<ul><li>\n<strong>intf<\/strong>：浮点按模式舍入到整数的操作；输出仍是浮点位段时配 FINT，输出定点时配 FIX。\n<\/li><li>\n<strong>rem<\/strong>：就近取余；n 为最接近 <span class=\"katex-inline\">y/z<\/span> 的整数，平局取偶。\n<\/li><li>\n<strong>rR<\/strong>：舍入模式专用寄存器；GET/PUT 指令读写。\n<\/li><li>\n<strong>rE<\/strong>：相对精度寄存器，供 FCMPE 族容差比较使用。\n<\/ul>\n<h2>失败案例补充：转换源数类别<\/h2>\n<p>源值为无穷或 NaN 时，FIX/FLOT 路径进入无效操作分支，置 I 异常；结果不按普通整数换算。源值弱规范数在 FLOT 方向先解码到极小值，FIX 方向取整为零并可能置 U。<\/p>\n<h2>差生通读复核：运算—转换—比较三族边界<\/h2>\n<ol><li>\n四则与开方：输出浮点。\n<\/li><li>\nFINT：浮点取整，输出浮点。\n<\/li><li>\nFIX/FIXU：浮点取整后输出定点；FLOT/FLOTU：定点输出浮点。\n<\/li><li>\nFCMP/FEQL/FUN：输出整数标志位，不回浮点寄存器。\n<\/li><li>\nFREM：输出浮点余数。\n<\/ol>\n<h2>补充：运算精度与 ulp<\/h2>\n<p>相邻可表示数在指数 <span class=\"katex-inline\">e<\/span> 量级的间距为 <span class=\"katex-inline\">2^{e-52}<\/span>（双精度）。加减乘除后若结果落在两编码之间，舍入模式决定选上邻还是下邻；平局取偶保证中点处选择可复现。弱规范数区间 ulp 恒定为 <span class=\"katex-inline\">2^{-1074}<\/span>，规范数区间 ulp 随指数翻倍。<\/p>\n<p>FLOT 大整数时，超过 <span class=\"katex-inline\">2^{53}<\/span> 的整数不能被双精度尾数精确表示；末位按模式舍入，X 异常位置位。短浮点 <span class=\"katex-inline\">2^{24}<\/span> 以上整数即不可精确表示。<\/p>\n<h2>与整数指令族的对照<\/h2>\n<ul><li>\n整数 ADD/ADDU 进位传播；浮点 FADD 先对齐指数再尾数加减。\n<\/li><li>\n整数 MUL/MULU 结果存 rH 高半；浮点 FMUL 结果回填浮点全字，高半不另存寄存器。\n<\/li><li>\n整数 DIV 余数进 rR；浮点 FREM 余数回 <span class=\"katex-inline\">\\<\/span>X$，n 规则不同。\n<\/li><li>\n整数比较按补码/无符号输出三值；浮点比较另设 NaN 无序分支。\n<\/ul>\n<h2>全节走查清单<\/h2>\n<ol><li>\n读指令助记符，判定结果数制（浮点/定点/标志）。\n<\/li><li>\n源操作数按对应解释取出；特殊编码（零、无穷、NaN）先走特殊分支。\n<\/li><li>\n实数域运算，对齐指数或换算尾数。\n<\/li><li>\n规范化结果，按舍入模式回填位段。\n<\/li><li>\n判定异常类别，置 rA 事件位。\n<\/li><li>\n结果写入目标寄存器；转换指令记录源数制与目标数制。\n<\/ol>\n<p>清单顺序不可颠倒：先做实数运算再判特殊编码，会把 NaN 当普通尾数参与乘法。<\/p>\n<h2>补充：短浮点装载存储位宽对照<\/h2>\n<p>LDSF 从内存半字读 32 位短浮点，解码后回填 64 位寄存器全字；STSF 反向把全字浮点压成 32 位短格式存入半字。压格式时按 1+8+23 位段取舍，低位超出 23 位小数的部分经舍入处理。半字内存地址对齐与 c04 的分量访问规则一致。<\/p>\n<h2>数值算例八：浮点加减指数对齐续走查<\/h2>\n<p>取 <span class=\"katex-inline\">1.0+2.5<\/span>：<\/p>\n<ol><li>\n两数实际指数 0 与 1；对齐到指数 1，1.0 的尾数右移一位。\n<\/li><li>\n对齐后尾数相加，结果仍在 <span class=\"katex-inline\">[1,2)<\/span> 附近；规范化后回填 52 位小数段。\n<\/li><li>\n结果编码按尾数小数段与指数段重新拼接；低位丢失情况由 X 异常位记录。\n<\/ol>\n<p>取 <span class=\"katex-inline\">2.5-2.5<\/span>：尾数相消得零；零的符号按减法约定确定，位段为对应符号的全零编码。相近大数相减会丢失有效位，即使结果数值不大，精度损失仍可能置 X。<\/p>\n<h2>转换路径复核<\/h2>\n<p>FLOT：整数 → 规格化尾数与指数 → 浮点全字；FIX：浮点 → intf 取整 → 补码定点。两条路径方向相反，舍入都可能发生在转换末位。FLOTU 源数按无符号解释，整数高位不做符号扩展；FIXU 结果按 <span class=\"katex-inline\">\\bmod2^{64}<\/span> 回填无符号全字。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出 FADD、FSUB、FMUL、FDIV 的结果定义。\n<\/li><li>\nFIX 与 FINT 的结果数制有何不同？\n<\/li><li>\nFREM 中 n 的取值规则是什么？7 rem 2 为何得 −1？\n<\/li><li>\n四种舍入模式编号与方向各是什么？\n<\/li><li>\nNaN 参与 FCMP 时走哪条判定指令？\n<\/ol><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 MMIX增补.pdf · p.56<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">内存与寄存器模型：M1/M2/M4/M8 分组、256 个通用寄存器与 32 个专用寄存器<\/a><\/span><\/div><h1>子程序连接：PUSHJ/POP 返回地址、寄存器栈压弹与局部/边缘/全局寄存器划分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（原书 §1.4.1，PDF 第 56 页起）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>子程序连接靠两条指令闭环：PUSHJ 先 push(X) 保存局部寄存器、把返回地址写进专用寄存器 rJ，再跳转子程序入口；POP 先 pop(X) 恢复被隐藏的寄存器，再按 rJ 加偏移回到调用点；寄存器按 rL、rG 阈值分成局部、边缘、全局三类。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>一段重复代码只存一份，需要在调用处把控制交过去、执行完再回到断点继续。困难有三点：返回地址存哪里、被调用过程用寄存器时不破坏调用者还需要的值、嵌套调用时寄存器现场层层保存恢复。MMIX 用寄存器栈分担调用现场：PUSH 动作把低层局部寄存器压入隐藏层，POP 动作弹回；rJ 专存返回地址，不与通用寄存器抢位置。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>返回连接<\/strong>：<\/p>\n<ul><li>\nPUSHJ <span class=\"katex-inline\">\\<\/span>X,RA<span class=\"katex-inline\">：push(X)，置 <\/span>rJ\\leftarrow @+4<span class=\"katex-inline\">，然后置 <\/span>@\\leftarrow RA$；\n<\/li><li>\nPUSHGO <span class=\"katex-inline\">\\<\/span>X,\\<span class=\"katex-inline\">Y,\\<\/span>Z<span class=\"katex-inline\">：push(X)，置 <\/span>rJ\\leftarrow @+4<span class=\"katex-inline\">，然后 <\/span>@\\leftarrow A$（入口由寄存器计算）；\n<\/li><li>\nPOP <span class=\"katex-inline\">X,YZ<\/span>：pop(X)，然后置 <span class=\"katex-inline\">@\\leftarrow rJ+4\\times YZ<\/span>。\n<\/ul>\n<p><strong>push(X) 动作<\/strong>：把局部寄存器 <span class=\"katex-inline\">\\<\/span>0<span class=\"katex-inline\"> 至 <\/span>\\<span class=\"katex-inline\">X<\/span> 保存并暂时隐藏；原先的 <span class=\"katex-inline\">\\<\/span>(X+1)<span class=\"katex-inline\"> 成为新 <\/span>\\<span class=\"katex-inline\">0<\/span>，原先的 <span class=\"katex-inline\">\\<\/span>(X+2)<span class=\"katex-inline\"> 成为新 <\/span>\\<span class=\"katex-inline\">1<\/span>，依此类推；编号 <span class=\"katex-inline\">K&gt;rG<\/span> 的全局寄存器保留不变。<\/p>\n<p><strong>寄存器三类<\/strong>：<\/p>\n<ul><li>\n局部寄存器：<span class=\"katex-inline\">K&lt;rL<\/span>，当前活动，可读写；\n<\/li><li>\n边缘寄存器：<span class=\"katex-inline\">rL\\le K\\le rG<\/span>，作为源操作数读出恒为零；作为目标写入时，执行前 rL 自动增到 <span class=\"katex-inline\">K+1<\/span>，该寄存器升格为局部；\n<\/li><li>\n全局寄存器：<span class=\"katex-inline\">K&gt;rG<\/span>，跨调用保留。\n<\/ul>\n<p><strong>阈值寄存器<\/strong>：rG 是全局阈值，取值总在 32 至 255 之间（含两端）；rL 是局部阈值，记录当前活动局部寄存器数量。<\/p>\n<p><strong>现场保存<\/strong>：SAVE <span class=\"katex-inline\">\\<\/span>X,0<span class=\"katex-inline\">：把所有寄存器连同 rA、rD、rE、rG、rH、rJ、rM、rR 等专用寄存器存入内存寄存器栈顶部，顶部全字地址装入 <\/span>u(\\<span class=\"katex-inline\">X)<\/span>；<span class=\"katex-inline\">\\<\/span>X<span class=\"katex-inline\"> 必须是全局寄存器（<\/span>X&gt;rG<span class=\"katex-inline\">）；SAVE 清零 rL。UNSAVE <\/span>\\<span class=\"katex-inline\">Z<\/span>：按 <span class=\"katex-inline\">u(\\<\/span>Z)$ 恢复上下文并恢复 rL，基本撤销上一条 SAVE。<\/p>\n<p><strong>栈控制寄存器<\/strong>：寄存器栈偏移 rO、栈指针 rS 控制 PUSH、POP、SAVE、UNSAVE 的层定位。<\/p>\n<p><strong>正例<\/strong>：PUSHJ <span class=\"katex-inline\">\\<\/span>3<span class=\"katex-inline\">,Func 隐藏旧 <\/span>\\<span class=\"katex-inline\">0<\/span>–<span class=\"katex-inline\">\\<\/span>3<span class=\"katex-inline\">，rJ 存调用点下一条指令地址；子程序末尾 POP <\/span>\\<span class=\"katex-inline\">3,0<\/span> 恢复旧 <span class=\"katex-inline\">\\<\/span>0<span class=\"katex-inline\">–<\/span>\\<span class=\"katex-inline\">3<\/span>，@ 回到 rJ。<\/p>\n<p><strong>反例<\/strong>：把返回地址存在通用寄存器里被子程序覆盖；边缘寄存器读出期待旧值；SAVE 的目标寄存器选成局部寄存器。<\/p>\n<h2>原理推导：调用—返回闭环<\/h2>\n<ol><li>\n调用点执行 PUSHJ：先 push(X) 保存现场层，再把 @+4（下一条指令地址）写入 rJ，随后 @ 跳到入口 RA。\n<\/li><li>\n子程序运行：低层寄存器换帧，全局寄存器保持原持有值；边缘寄存器按需升格为局部。\n<\/li><li>\n子程序末尾 POP：pop(X) 把除 X 外当前局部寄存器退回边缘，并恢复最近一次 push 隐藏的值；@ 按 rJ+4·YZ 回到调用点偏移处。\n<\/li><li>\n嵌套调用：每一层 PUSH 压一层，POP 弹一层；rJ 每层覆盖，返回链由寄存器栈层与 rJ 共同维持。\n<\/ol>\n<p>地址按全字计数：指令定长 4 字节，返回偏移 <span class=\"katex-inline\">4\\times YZ<\/span>，YZ 是指令半字偏移量。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：子程序调用与返回配对；PUSH 的 X 与 POP 的 X 约定好帧大小；全局寄存器编号大于 rG。\n<\/li><li>\n边界 1：边缘寄存器读为零，不保留上一层残留值；写入才升格。\n<\/li><li>\n边界 2：rG 范围 32–255；rL 不得越过当前帧边界；越限写专用寄存器由特权规则拦截。\n<\/li><li>\n边界 3：SAVE 目标必须全局寄存器；UNSAVE 恢复整组上下文，不只恢复通用寄存器。\n<\/li><li>\n边界 4：PUSHGO 入口地址由寄存器算得，用于间接调用；PUSHJ 入口是指令内汇编地址。\n<\/li><li>\n失败案例：嵌套调用中 rJ 被子程序当普通寄存器改写；pop 的 X 与 push 不对称，恢复出错层。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>PUSHJ vs PUSHGO<\/strong>：入口一个是指令内地址 RA，一个是寄存器计算地址 A。\n<\/li><li>\n<strong>局部 vs 边缘 vs 全局<\/strong>：局部活动可读写；边缘读零、写升格；全局跨帧保留。\n<\/li><li>\n<strong>push/pop vs SAVE/UNSAVE<\/strong>：前者管寄存器栈帧内的局部寄存器，后者整组保存恢复进程上下文与专用寄存器。\n<\/li><li>\n<strong>rJ vs rL<\/strong>：rJ 存返回地址，rL 记局部阈值；功能不同。\n<\/ul>\n<p><strong>参数传递位置<\/strong>：调用方把参数放进约定编号的寄存器；被调用过程可见的低层编号由 push(X) 后的重映射决定。全局寄存器适用于跨多层调用仍需保留的值；局部寄存器随帧进出；边缘段用作临时扩充，用完即退回零。<\/p>\n<p><strong>递归调用<\/strong>：每递归一层压一帧，局部寄存器在新帧独立；返回时逐层 POP。深度受寄存器栈内存容量与 rL/rG 边界约束；SAVE 用于进程级上下文切换，不是普通递归帧。<\/p>\n<p><strong>专用寄存器访问<\/strong>：rJ、rL、rG、rO、rS 等用 GET/PUT 读写；PUT 对 rG 等阈值寄存器有取值范围限制，越界写被拦截。<\/p>\n<p><strong>间接调用场景<\/strong>：PUSHGO 的入口 A 来自寄存器内容，用于函数指针、跳转表、设备分发表；目标编号寄存器仍先经 push(X) 保存局部现场。<\/p>\n<p><strong>返回约定<\/strong>：POP 的 YZ 偏移由调用约定定；无偏移时 YZ=0。被调用过程负责把返回值放入约定寄存器，不负责恢复调用方局部寄存器，恢复动作由 POP 的帧规则完成。<\/p>\n<p><strong>薄程序与寄存器栈<\/strong>：短程序不依赖这些寄存器栈特征也能运行；只有需要多层调用、参数隔离与现场保存时才按 PUSH/POP/SAVE 约定组织帧。<\/p>\n<p><strong>与内存栈的分工<\/strong>：寄存器栈解决寄存器现场的快速换帧；需要按值传递大块数据、保存返回地址链到内存时，仍配合内存访问指令完成，两者不互相替代。<\/p>\n<p><strong>帧大小约定<\/strong>：PUSH 的 X 字段给出本帧隐藏的局部寄存器数量；被调用过程可见的低层编号从旧 <span class=\"katex-inline\">X+1<\/span> 开始重排。参数寄存器、返回值寄存器的编号位置由调用约定定，帧两侧按同一约定对齐。<\/p>\n<p><strong>寄存器栈与通用内存栈的分工<\/strong>：寄存器栈解决寄存器现场快速换帧；大块参数、返回地址链落盘由内存访问指令完成。SAVE/UNSAVE 是进程级整组上下文保存，粒度大于子程序帧，不用于普通递归帧。<\/p>\n<p><strong>间接调用入口<\/strong>：PUSHGO 用于函数指针与跳转表；入口地址从寄存器内容计算，rJ 写入规则与 PUSHJ 相同。被调用过程不区分两种调用来源，返回仍走 POP。<\/p>\n<h2>联系<\/h2>\n<p>前置：c03 指令格式与 @ 程序计数器；c02 寄存器编号模型。后继：c10 故障与陷阱处理也需要保存现场；TRAP 转入操作系统服务时按约定保留寄存器。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（子程序连接与寄存器栈：PUSHJ/POP、rJ/rG/rL 阈值、SAVE/UNSAVE）<\/summary><div class=\"depth-body\"><h1>c09 深度推导：调用帧寄存器映射、返回地址算术、三类寄存器边界与现场保存流程<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>走通一次子程序调用，往回追五层：<\/p>\n<ol><li>\n调用点位置：@ 指向当前 PUSHJ 指令；返回地址是 @+4。\n<\/li><li>\n帧保存：push(X) 把低层局部寄存器压入隐藏层，上层寄存器下移编号。\n<\/li><li>\n寄存器类别：按 rL、rG 判定当前编号属于局部、边缘还是全局，决定读写语义。\n<\/li><li>\n子程序执行：使用换帧后的低层编号；需要新寄存器时从边缘升格。\n<\/li><li>\n返回闭环：pop(X) 恢复隐藏层，@ 按 rJ 加偏移回到调用点。\n<\/ol>\n<p>依赖方向：@ 与 rJ → 帧层 → 类别判定 → 子程序体 → pop 回跳。类别判定错，边缘寄存器会被当成保留值使用。<\/p>\n<h2>正向推导：push(X) 编号重映射<\/h2>\n<p>设调用方现场中旧寄存器为 <span class=\"katex-inline\">v(0),v(1),\\dots,v(255)<\/span>，执行 push(X)：<\/p>\n<ol><li>\n旧 <span class=\"katex-inline\">\\<\/span>0<span class=\"katex-inline\"> 至 <\/span>\\<span class=\"katex-inline\">X<\/span> 压入寄存器栈当前层，暂时不可见。\n<\/li><li>\n旧 <span class=\"katex-inline\">\\<\/span>(X+1)<span class=\"katex-inline\"> 映射为新 <\/span>\\<span class=\"katex-inline\">0<\/span>；旧 <span class=\"katex-inline\">\\<\/span>(X+2)<span class=\"katex-inline\"> 映射为新 <\/span>\\<span class=\"katex-inline\">1<\/span>；……一般式：新 <span class=\"katex-inline\">\\<\/span>k<span class=\"katex-inline\"> 对应旧 <\/span>\\<span class=\"katex-inline\">(X+1+k)<\/span>，<span class=\"katex-inline\">k=0,1,\\dots<\/span>。\n<\/li><li>\n编号 <span class=\"katex-inline\">K&gt;rG<\/span> 的全局寄存器不参与重映射，值保持。\n<\/li><li>\nrL 在新帧内记录当前活动局部数量；边缘段 <span class=\"katex-inline\">rL\\le K\\le rG<\/span> 读零。\n<\/ol>\n<p>映射只重排可见编号，不改内存中的寄存器栈存储；隐藏层由 rO、rS 定位。<\/p>\n<h2>数值算例一：三层编号走查<\/h2>\n<p>取 <span class=\"katex-inline\">X=3<\/span>：<\/p>\n<ol><li>\n隐藏旧 <span class=\"katex-inline\">\\<\/span>0,\\<span class=\"katex-inline\">1,\\<\/span>2,\\<span class=\"katex-inline\">3<\/span>。\n<\/li><li>\n新 <span class=\"katex-inline\">\\<\/span>0=<span class=\"katex-inline\">旧 <\/span>\\<span class=\"katex-inline\">4<\/span>；新 <span class=\"katex-inline\">\\<\/span>1=<span class=\"katex-inline\">旧 <\/span>\\<span class=\"katex-inline\">5<\/span>；新 <span class=\"katex-inline\">\\<\/span>2=<span class=\"katex-inline\">旧 <\/span>\\<span class=\"katex-inline\">6<\/span>；新 <span class=\"katex-inline\">\\<\/span>3=<span class=\"katex-inline\">旧 <\/span>\\<span class=\"katex-inline\">7<\/span>。\n<\/li><li>\n旧 <span class=\"katex-inline\">\\<\/span>8<span class=\"katex-inline\"> 及以上依次顺延；全局段（<\/span>K&gt;rG$）原样保留。\n<\/li><li>\n返回 POP <span class=\"katex-inline\">\\<\/span>3,0<span class=\"katex-inline\">：旧 <\/span>\\<span class=\"katex-inline\">0<\/span>–<span class=\"katex-inline\">\\<\/span>3<span class=\"katex-inline\"> 从栈层恢复；新帧隐藏的 <\/span>\\<span class=\"katex-inline\">4<\/span>–<span class=\"katex-inline\">\\<\/span>7$ 编号交还上一层。\n<\/ol>\n<p>若子程序内部又一次 PUSHJ <span class=\"katex-inline\">\\<\/span>2<span class=\"katex-inline\">,Sub：再压一层，第二次隐藏的是当前帧的 <\/span>\\<span class=\"katex-inline\">0<\/span>–<span class=\"katex-inline\">\\<\/span>2$；两次 POP 按后进先出顺序逐层弹回。<\/p>\n<h2>数值算例二：返回地址算术<\/h2>\n<p>PUSHJ 指令自身占 4 字节；rJ←@+4，即下一条指令的地址。POP 时 @←rJ+4·YZ：<\/p>\n<ol><li>\nYZ=0：回到 rJ 原值，调用点下一条指令。\n<\/li><li>\nYZ 为正整数：返回点向后跳过 <span class=\"katex-inline\">YZ<\/span> 个全字（<span class=\"katex-inline\">4\\cdot YZ<\/span> 字节），用于调用点后有内联参数或补丁区的约定。\n<\/li><li>\n返回地址存入专用 rJ，不占通用寄存器；子程序内不得把 rJ 当普通工作寄存器覆盖，否则返回链断裂。\n<\/ol>\n<p>PUSHGO 与 PUSHJ 的 rJ 写入相同，差别只在入口地址来源：RA 是指令内汇编地址，A 由寄存器内容算得。<\/p>\n<h2>数值算例三：寄存器类别边界<\/h2>\n<p>取 rL=8，rG=32：<\/p>\n<ol><li>\n<span class=\"katex-inline\">\\<\/span>0<span class=\"katex-inline\">–<\/span>\\<span class=\"katex-inline\">7<\/span>：局部，读写当前帧值。\n<\/li><li>\n<span class=\"katex-inline\">\\<\/span>8<span class=\"katex-inline\">–<\/span>\\<span class=\"katex-inline\">31<\/span>：边缘；作为源读出恒为 0；作为目标写入前 rL 自动增到 <span class=\"katex-inline\">K+1<\/span>，该寄存器进入局部段。\n<\/li><li>\n<span class=\"katex-inline\">\\<\/span>32<span class=\"katex-inline\">–<\/span>\\<span class=\"katex-inline\">255<\/span>：全局，跨 PUSH/POP 保留。\n<\/ol>\n<p>边缘升格走查：写 <span class=\"katex-inline\">\\<\/span>12<span class=\"katex-inline\"> 时，rL 从 8 提到 13，<\/span>\\<span class=\"katex-inline\">8<\/span>–<span class=\"katex-inline\">\\<\/span>12$ 一并成为局部；之后这些编号在帧内有实际值，不再读零。rG 取值区间 32–255，小于 32 或大于 255 的写值被特权规则拦截。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：rJ 被覆盖。<\/strong> 子程序把 rJ 当临时寄存器写值，POP 时返回地址丢失；rJ 属专用寄存器，现场保护规则内优先处理。 <strong>案例 2：push 与 pop 不对称。<\/strong> push(X=3) 而 POP 时 X 取 1，恢复的帧边界错位，旧寄存器值错配。 <strong>案例 3：边缘寄存器读残留。<\/strong> 预期旧 <span class=\"katex-inline\">\\<\/span>9<span class=\"katex-inline\"> 保留传入值，实际边缘段读零；传参应走局部或全局编号。 <strong>案例 4：SAVE 目标选局部寄存器。<\/strong> <\/span>\\<span class=\"katex-inline\">X<\/span> 必须 <span class=\"katex-inline\">X&gt;rG<\/span>；选局部寄存器违反约定，上下文地址无处保存。 <strong>案例 5：嵌套返回顺序反。<\/strong> 先弹外层再弹内层，栈层错位；POP 顺序必须与 PUSH 相反。<\/p>\n<h2>延伸推导：SAVE/UNSAVE 上下文流转<\/h2>\n<ol><li>\nSAVE <span class=\"katex-inline\">\\<\/span>X,0<span class=\"katex-inline\">：把当前全部通用寄存器与 rA、rD、rE、rG、rH、rJ、rM、rR 等专用寄存器写入内存寄存器栈顶部；顶部全字地址写入 <\/span>u(\\<span class=\"katex-inline\">X)<\/span>；rL 清零。\n<\/li><li>\n保存后的现场可被中断、故障处理或另一个进程使用；寄存器栈层切换由 rO、rS 控制。\n<\/li><li>\nUNSAVE <span class=\"katex-inline\">\\<\/span>Z<span class=\"katex-inline\">：从 <\/span>u(\\<span class=\"katex-inline\">Z)<\/span> 指向的顶部全字读回整组上下文，恢复通用寄存器、专用寄存器与 rL。\n<\/li><li>\nSAVE/UNSAVE 成对出现；UNSAVE 基本撤销最近一次 SAVE，不做部分恢复。\n<\/ol>\n<h2>子程序连接对照表<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>动作<\/th><th>指令<\/th><th>关键写入<\/th><\/tr><\/thead><tbody><tr><td>直接调用<\/td><td>PUSHJ <span class=\"katex-inline\">\\<\/span>X,RA$<\/td><td>push(X)，rJ←@+4，@←RA<\/td><\/tr><tr><td>间接调用<\/td><td>PUSHGO <span class=\"katex-inline\">\\<\/span>X,\\<span class=\"katex-inline\">Y,\\<\/span>Z$<\/td><td>push(X)，rJ←@+4，@←A<\/td><\/tr><tr><td>返回<\/td><td>POP <span class=\"katex-inline\">X,YZ<\/span><\/td><td>pop(X)，@←rJ+4·YZ<\/td><\/tr><tr><td>整组保存<\/td><td>SAVE <span class=\"katex-inline\">\\<\/span>X,0$<\/td><td>上下文入栈，地址入 <span class=\"katex-inline\">\\<\/span>X$，rL 清零<\/td><\/tr><tr><td>整组恢复<\/td><td>UNSAVE <span class=\"katex-inline\">\\<\/span>Z$<\/td><td>上下文回寄存器，rL 恢复<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>差生通读检查<\/h2>\n<ol><li>\n@：程序计数器；rJ：返回跳转专用寄存器。\n<\/li><li>\npush(X)：隐藏旧 <span class=\"katex-inline\">\\<\/span>0<span class=\"katex-inline\">–<\/span>\\<span class=\"katex-inline\">X<\/span>，上层编号下移。\n<\/li><li>\nrL：局部阈值；rG：全局阈值，区间 32–255。\n<\/li><li>\n边缘寄存器：读零，写升格为局部。\n<\/li><li>\nSAVE 目标必须全局寄存器；UNSAVE 按保存地址恢复。\n<\/ol>\n<h2>正向推导：嵌套调用两层走查<\/h2>\n<p>初始帧：旧寄存器编号 <span class=\"katex-inline\">0..255<\/span>。<\/p>\n<ol><li>\n第一层 PUSHJ <span class=\"katex-inline\">\\<\/span>3<span class=\"katex-inline\">,Func：隐藏旧 <\/span>0..3<span class=\"katex-inline\">；Func 内可见新 <\/span>0=<span class=\"katex-inline\">旧<\/span>4<span class=\"katex-inline\">、新 <\/span>1=<span class=\"katex-inline\">旧<\/span>5<span class=\"katex-inline\">、新 <\/span>2=<span class=\"katex-inline\">旧<\/span>6<span class=\"katex-inline\">、新 <\/span>3=<span class=\"katex-inline\">旧<\/span>7$；rJ 存第一层返回地址。\n<\/li><li>\nFunc 内 PUSHJ <span class=\"katex-inline\">\\<\/span>2<span class=\"katex-inline\">,Sub：隐藏当前帧 <\/span>0..2<span class=\"katex-inline\">；Sub 内新 <\/span>0=<span class=\"katex-inline\">当前<\/span>3<span class=\"katex-inline\">（即旧<\/span>7<span class=\"katex-inline\">）、新 <\/span>1=<span class=\"katex-inline\">当前<\/span>4<span class=\"katex-inline\">（旧<\/span>8$）；rJ 被第二层返回地址覆盖。\n<\/li><li>\nSub 末尾 POP <span class=\"katex-inline\">\\<\/span>2,0<span class=\"katex-inline\">：弹回第一层帧，rJ 恢复为第一层返回地址（由栈层现场带回）；Func 末尾 POP <\/span>\\<span class=\"katex-inline\">3,0<\/span>：弹回初始帧。\n<p>两层 push 的 X 分别为 3、2；pop 必须同层配对。rJ 在第二层被覆盖，返回链依赖寄存器栈层保存的上层 rJ 现场，不是靠通用寄存器链接。<\/p>\n<\/ol>\n<h2>数值算例四：边缘升格过程<\/h2>\n<p>rL=8，子程序需要用到第 12 号寄存器：<\/p>\n<ol><li>\n首次写 <span class=\"katex-inline\">\\<\/span>12<span class=\"katex-inline\"> 前，rL 自动增到 <\/span>13<span class=\"katex-inline\">；<\/span>\\<span class=\"katex-inline\">8<\/span>–<span class=\"katex-inline\">\\<\/span>12$ 进入局部段。\n<\/li><li>\n此前 <span class=\"katex-inline\">\\<\/span>8<span class=\"katex-inline\">–<\/span>\\<span class=\"katex-inline\">11<\/span> 作为源读出为零；升格后在帧内持有写入值。\n<\/li><li>\n帧结束 POP 时，这些寄存器按 pop(X) 约定退回边缘段，隐藏层恢复的值交回上层。\n<\/li><li>\n若只写 <span class=\"katex-inline\">\\<\/span>12<span class=\"katex-inline\"> 未先读 <\/span>\\<span class=\"katex-inline\">8<\/span>–<span class=\"katex-inline\">\\<\/span>11$，升格段内其余编号值仍为零，需按初值约定处理。\n<\/ol>\n<h2>寄存器编号与阈值关系图<\/h2>\n<pre><code>$0 ──────── $rL-1   局部寄存器（当前帧活动）\n$rL ─────── $rG    边缘寄存器（读零，写升格）\n$rG+1 ───── $255   全局寄存器（跨帧保留）<\/code><\/pre>\n<p>rG ∈ [32,255]；rL 随边缘升格动态上移，帧退出时由 pop 与 SAVE/UNSAVE 恢复。<\/p>\n<h2>失败案例延伸<\/h2>\n<p><strong>案例 6：把全局编号当局部传参。<\/strong> 全局寄存器跨帧保留，子程序写入会改变调用方后续值；需要隔离的传参应放局部或边缘。 <strong>案例 7：rO/rS 越界。<\/strong> 寄存器栈层数超出内存栈容量时由栈溢出异常介入；普通程序不直接改 rO、rS，由 PUSH/POP 维护。 <strong>案例 8：返回偏移算错字节数。<\/strong> @←rJ+4·YZ，YZ 是全字偏移；按字节偏移写 YZ 会跳错位置。 <strong>案例 9：SAVE 后 rL 未清。<\/strong> SAVE 清零 rL，恢复前误用局部编号会读到边缘零；UNSAVE 才把 rL 带回旧值。<\/p>\n<h2>对抗性追问：为什么返回地址放专用 rJ 而不压内存<\/h2>\n<p>通用寄存器数量有限，子程序执行时全部可能被用作工作寄存器；返回地址若占用通用编号，保存恢复链条更长。专用 rJ 不参与工作分配，配合寄存器栈层现场，嵌套调用时上层 rJ 随帧保存。内存栈只在 SAVE/UNSAVE 进程级切换时整组落盘，普通调用帧留在寄存器栈中。<\/p>\n<p>追问二：为什么要设边缘段。子程序按需申请新寄存器，不必在入口一次性声明全部局部；写到哪个编号，rL 扩到哪个编号，未用编号保持零语义，减少帧内寄存器浪费。<\/p>\n<h2>差生通读复核：常见卡点<\/h2>\n<ul><li>\n卡点 1：push 后编号下移，不是旧编号原样不动。\n<\/li><li>\n卡点 2：边缘读零，写入才升格。\n<\/li><li>\n卡点 3：rJ 是专用寄存器，不可当工作寄存器覆盖。\n<\/li><li>\n卡点 4：SAVE 目标必须全局寄存器。\n<\/li><li>\n卡点 5：pop 顺序与 push 相反，X 约定配对。\n<\/ul>\n<h2>与其他概念的接口<\/h2>\n<ul><li>\n回 c03：@ 是程序计数器，指令定长 4 字节决定 @+4 与 4·YZ 偏移。\n<\/li><li>\n回 c02：寄存器编号 0–255 的划分以 rL、rG 为界。\n<\/li><li>\n接 c10：故障处理入口同样需要保存现场，SAVE/UNSAVE 与陷阱现场规则衔接。\n<\/ul>\n<h2>数值算例五：寄存器栈层定位<\/h2>\n<p>寄存器栈偏移 rO 与栈指针 rS 记录当前可见层在栈中的位置：<\/p>\n<ol><li>\nPUSH 时按 rO 定位隐藏层写入位置，更新层指针。\n<\/li><li>\nPOP 时按最近未弹的层恢复隐藏寄存器。\n<\/li><li>\nSAVE 把整组上下文写到栈顶，记录栈顶全字地址到目标全局寄存器。\n<\/li><li>\nUNSAVE 按该地址读回，恢复层指针与 rL。\n<\/ol>\n<p>程序不直接在指令里计算层地址，层定位由两条专用寄存器维护；越出栈容量时进入栈溢出异常分支。<\/p>\n<h2>数值算例六：rG 边界核验<\/h2>\n<p>rG 取值区间 32–255：<\/p>\n<ol><li>\nrG=32：全局段为 <span class=\"katex-inline\">\\<\/span>33<span class=\"katex-inline\">–<\/span>\\<span class=\"katex-inline\">255<\/span>，边缘段 <span class=\"katex-inline\">\\<\/span>rL<span class=\"katex-inline\">–<\/span>\\<span class=\"katex-inline\">32<\/span>。\n<\/li><li>\nrG=255：全局段只剩 <span class=\"katex-inline\">\\<\/span>255$ 一个编号，边缘段上界到 255。\n<\/li><li>\n写入 rG 小于 32 或大于 255 被 PUT 规则拦截；rG 决定哪些编号跨帧保留。\n<\/ol>\n<p>局部编号总数受帧大小限制；帧内可申请的编号从 rL 向 rG 方向扩展，超过 rG 即进入全局段，语义不再是临时局部。<\/p>\n<h2>术语对位<\/h2>\n<ul><li>\n<strong>寄存器栈<\/strong>：保存被隐藏局部寄存器的内存栈，由 rO、rS 控制。\n<\/li><li>\n<strong>帧（frame）<\/strong>：一次 PUSH 建立的寄存器现场层。\n<\/li><li>\n<strong>rJ<\/strong>：返回跳转寄存器，存 @+4。\n<\/li><li>\n<strong>rL/rG<\/strong>：局部/全局阈值专用寄存器。\n<\/li><li>\n<strong>上下文（context）<\/strong>：全部通用寄存器与专用寄存器的快照。\n<\/ul>\n<h2>失败案例补充：返回值寄存器约定<\/h2>\n<p>返回值放哪个编号由调用约定定；若被调用过程把结果写进局部编号，POP 后该编号随帧退回上层，调用方读不到。约定返回值编号必须是全局或调用方仍可见的局部编号。<\/p>\n<h2>差生通读复核：调用链顺序<\/h2>\n<ol><li>\n调用方准备参数寄存器。\n<\/li><li>\nPUSHJ/PUSHGO 压帧、写 rJ、跳入口。\n<\/li><li>\n被调用过程执行，按需升格边缘寄存器。\n<\/li><li>\n写返回值到约定编号。\n<\/li><li>\nPOP 弹帧、按 rJ 返回。\n<\/li><li>\n进程级切换才用 SAVE/UNSAVE 整组保存。\n<\/ol>\n<h2>补充：指令字段与操作数<\/h2>\n<p>PUSHJ <span class=\"katex-inline\">\\<\/span>X,RA<span class=\"katex-inline\">：X 字段给帧大小（push(X)），RA 是入口汇编地址。PUSHGO <\/span>\\<span class=\"katex-inline\">X,\\<\/span>Y,\\<span class=\"katex-inline\">Z<\/span>：入口 A 由寄存器内容计算得到。POP <span class=\"katex-inline\">X,YZ<\/span>：X 字段给弹帧约定，YZ 给返回偏移。字段语义与 c03 的指令格式段一一对应：每条指令 4 字节，编号、地址或寄存器字段按固定位段展开。<\/p>\n<h2>与其他章节的衔接<\/h2>\n<p>子程序连接是 ch04 的主干：控制流转移（BR/BE 类）决定分支方向，PUSHJ/POP 决定过程调用闭环；故障陷阱在 c10 中复用现场保存思路，但入口地址由异常向量表给出，不由指令内汇编地址给。<\/p>\n<h2>全节走查清单<\/h2>\n<ol><li>\n识别调用指令是 PUSHJ（直接入口）还是 PUSHGO（间接入口）。\n<\/li><li>\n读 X 字段确定 push 帧大小，核对旧编号隐藏范围。\n<\/li><li>\n写 rJ= @+4；核对 @ 跳转目标。\n<\/li><li>\n子程序体内按 rL/rG 判定寄存器类别，边缘写值前预期 rL 上移。\n<\/li><li>\n返回前把结果放约定编号。\n<\/li><li>\nPOP 按配对 X 弹帧，按 rJ+4·YZ 回跳。\n<\/li><li>\n进程级切换走 SAVE/UNSAVE，不与帧内 PUSH/POP 混用。\n<\/ol>\n<h2>补充：寄存器栈容量与溢出边界<\/h2>\n<p>每压一帧隐藏的局部寄存器写入寄存器栈；嵌套层数与帧大小受栈内存容量约束。栈指针 rS 与偏移 rO 跟踪当前层位置；压栈超出栈容量时进入栈溢出异常分支，由操作系统或处理程序扩展栈区。普通程序不直接改写 rO、rS，层定位由 PUSH、POP、SAVE、UNSAVE 四条指令维护。<\/p>\n<p>帧内边缘编号升格只影响本帧 rL；POP 后上一层 rL 从隐藏现场恢复，不会把升格带进调用方。全局寄存器编号大于 rG，帧切换时值保持不变，适合存放跨多层调用的基址、循环计数与返回值约定。<\/p>\n<h2>数值算例七：帧内寄存器分配走查<\/h2>\n<p>初始帧 rL=4，rG=32。被调用过程需要五个工作寄存器：<\/p>\n<ol><li>\n入口可见局部 <span class=\"katex-inline\">\\<\/span>0<span class=\"katex-inline\">–<\/span>\\<span class=\"katex-inline\">3<\/span>，来自上一层重映射后的编号。\n<\/li><li>\n写 <span class=\"katex-inline\">\\<\/span>4<span class=\"katex-inline\">：边缘升格，rL 增到 5；写 <\/span>\\<span class=\"katex-inline\">5<\/span>：rL 增到 6；依次扩到 <span class=\"katex-inline\">\\<\/span>8$，rL=9。\n<\/li><li>\n<span class=\"katex-inline\">\\<\/span>9<span class=\"katex-inline\">–<\/span>\\<span class=\"katex-inline\">31<\/span> 仍为边缘，读出零；<span class=\"katex-inline\">\\<\/span>33$ 以上为全局，值保持跨帧。\n<\/li><li>\nPOP 时除保留返回值约定的编号外，当前局部退回边缘；隐藏层寄存器恢复。\n<\/ol>\n<p>升格只在帧内有效；返回后上一层 rL 从栈层现场恢复，不会把本帧扩展的边缘编号带进调用方。<\/p>\n<h2>数值算例八：调用点指令流走查<\/h2>\n<p>设调用点指令序列：<\/p>\n<ol><li>\n地址 A：PUSHJ <span class=\"katex-inline\">\\<\/span>3$,Func；\n<\/li><li>\n地址 A+4：调用方后续指令；\n<\/li><li>\nFunc 入口：子程序体；\n<\/li><li>\n子程序末尾：POP <span class=\"katex-inline\">\\<\/span>3,0$。\n<\/ol>\n<p>PUSHJ 执行：rJ=A+4，@=Func。POP 执行：@=rJ+0=A+4，回到第 2 条指令。若 POP 带 YZ=2：@=rJ+8，跳过两个全字的内联参数区。rJ 在子程序体内保持不变，任何改写都会中断返回链。<\/p>\n<h2>寄存器栈层与编号映射表<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>层<\/th><th>局部可见编号<\/th><th>隐藏内容<\/th><\/tr><\/thead><tbody><tr><td>初始帧<\/td><td><span class=\"katex-inline\">\\<\/span>0<span class=\"katex-inline\">–<\/span>\\<span class=\"katex-inline\">rL-1<\/span><\/td><td>无<\/td><\/tr><tr><td>第一层 push(3)<\/td><td>旧 <span class=\"katex-inline\">\\<\/span>4$ 起下移<\/td><td>旧 <span class=\"katex-inline\">\\<\/span>0<span class=\"katex-inline\">–<\/span>\\<span class=\"katex-inline\">3<\/span><\/td><\/tr><tr><td>第二层 push(2)<\/td><td>当前 <span class=\"katex-inline\">\\<\/span>3$ 起下移<\/td><td>当前 <span class=\"katex-inline\">\\<\/span>0<span class=\"katex-inline\">–<\/span>\\<span class=\"katex-inline\">2<\/span><\/td><\/tr><tr><td>逐层 POP<\/td><td>反向恢复<\/td><td>对应隐藏层<\/td><\/tr><\/tbody><\/table><\/div>\n<p>全局段在所有层保持原值；边缘段各层独立读零。层指针由 rO、rS 维护，程序按指令约定压弹，不手工计算层偏移。<\/p>\n<h2>失败案例补充：参数寄存器越帧<\/h2>\n<p>返回值若写入帧内局部编号，POP 后该编号对上一层交还旧值，调用方读不到结果。约定返回值必须落在全局编号或调用方仍可见的局部编号；被调用过程申请的临时寄存器从边缘段升格，不占用约定参数编号。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\nPUSHJ 执行后 rJ 和 @ 各被写成什么？\n<\/li><li>\npush(3) 后新 <span class=\"katex-inline\">\\<\/span>0$ 对应旧哪个编号？\n<\/li><li>\nrL=8、rG=32 时 <span class=\"katex-inline\">\\<\/span>10$ 属哪类？读出值是多少？写入后 rL 变多少？\n<\/li><li>\nPOP 的返回地址公式是什么？YZ=0 时回到哪里？\n<\/li><li>\nSAVE 保存哪些内容？目标寄存器有何限制？\n<\/ol><\/div><\/details>", "c10": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 MMIX增补.pdf · p.27<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">子程序连接与寄存器栈：PUSHJ/POP、rJ/rG/rL 阈值、SAVE/UNSAVE<\/a><\/span><\/div><h1>异常、故障与陷阱：rA 许可位/事件位、八级向量地址与 TRIP/TRAP 现场保存<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（原书 §1.3.1，PDF 第 27–28 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>八类算术异常 D/V/W/I/O/U/Z/X 由专用寄存器 rA 记录：右字节事件位记录未跳转的异常，左邻字节许可位决定异常是置位留档还是立即跳转处理程序；TRIP 把故障交给用户程序内处理程序，TRAP 把陷阱交给操作系统，切换前用 rB/rW/rX/rY/rZ 保存中断现场。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>正常指令流按 @ 顺序推进，但除零、溢出、非法浮点操作、不精确结果等事件不可预测，硬件必须在指令执行后判定是否打断流程。困难在于：异常是先记录还是先跳转、多类异常同时发生时谁优先、处理程序从哪里找到出错指令与操作数、用户级故障与操作系统级陷阱如何分流。MMIX 用 rA 双字节位段做开关与留档，用固定向量地址表分发控制，用五个现场寄存器回溯现场。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>八类异常<\/strong>：<\/p>\n<ul><li>\nD：整数除法校验（除零）；\n<\/li><li>\nV：整数溢出；\n<\/li><li>\nW：浮点转定点溢出；\n<\/li><li>\nI：无效浮点操作；\n<\/li><li>\nO：浮点上溢；\n<\/li><li>\nU：浮点下溢；\n<\/li><li>\nZ：浮点除以零；\n<\/li><li>\nX：浮点不精确。\n<\/ul>\n<p><strong>rA 位段<\/strong>：最右字节八个事件位，按 DVWIOUZX 顺序：D_BIT=<code>#80<\/code>、V_BIT=<code>#40<\/code>、W_BIT=<code>#20<\/code>、I_BIT=<code>#10<\/code>、O_BIT=<code>#08<\/code>、U_BIT=<code>#04<\/code>、Z_BIT=<code>#02<\/code>、X_BIT=<code>#01<\/code>。事件位左边相邻八个许可位，同序排列。许可位与事件位左边两位保存当前舍入模式（模 4）；rA 其余 46 位保持零。<\/p>\n<p><strong>判定流程<\/strong>：算术运算出现异常时，下一条指令执行前查对应许可位：许可位为 0，把事件位置 1 留档；许可位为 1，调用故障处理程序，跳转到对应向量单元。<\/p>\n<p><strong>向量地址<\/strong>：D→<code>#10<\/code>，V→<code>#20<\/code>，W→<code>#30<\/code>，I→<code>#40<\/code>，O→<code>#50<\/code>，U→<code>#60<\/code>，Z→<code>#70<\/code>，X→<code>#80<\/code>。多个许可异常同时发生，优先处理左侧异常；例：O 与 X 同时出现先处理 O。<\/p>\n<p><strong>故障现场<\/strong>：故障发生时，rB←<code><span class=\"katex-inline\">255<\/code>；<code><\/span>255<\/code>←rJ；rW←@+4；rX 左半置 <code>#80000000<\/code>，右半置引发故障的指令。非存储指令：rY←<code><span class=\"katex-inline\">Y<\/code>，rZ←<code><\/span>Z<\/code>（操作数为立即常数时置 2）；存储指令：rY←A（内存地址），rZ←<code>$X<\/code>（被存储的量）；末步 @ 置为处理程序地址。<\/p>\n<p><strong>两类中断<\/strong>：TRIP 把故障转到位于 <code>#00<\/code> 的用户故障处理程序；TRAP 类似，但转到操作系统，现场寄存器换为陷阱版本，陷阱地址寄存器 rT 提供处理程序入口。<\/p>\n<p><strong>正例<\/strong>：浮点除零置 Z 位（<code>#02<\/code>）；若 Z 许可位为 1，跳到 <code>#70<\/code> 处理；若为 0，rA 事件字节记录 <code>#02<\/code>，继续流程。<\/p>\n<p><strong>反例<\/strong>：把事件位当许可开关；多异常同时按编号右先左后处理；故障现场寄存器与陷阱现场寄存器混用。<\/p>\n<h2>原理推导：异常判定与分发顺序<\/h2>\n<ol><li>\n指令执行后得到运算结果与异常类别集合。\n<\/li><li>\n对每个异常查 rA 对应许可位：0 → 事件位置 1，不打断；1 → 进入跳转候选。\n<\/li><li>\n候选异常按 DVWIOUZX 从左到右排序，取最左一项。\n<\/li><li>\n保存现场到 rB/rW/rX/rY/rZ，@ 换为向量地址，控制转入处理程序。\n<\/li><li>\n处理程序读完现场后按约定返回；事件位由程序用 PUT 清除。\n<\/ol>\n<p>位段展开：事件字节每位对应一类异常；许可字节同序同权值。舍入模式位在两字节左侧，不参与异常判定。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：异常由算术指令产生；许可位决定记录还是跳转；向量地址固定在 <code>#10<\/code>–<code>#80<\/code>。\n<\/li><li>\n边界 1：事件位记录的是未引起跳转的异常；已跳转的异常不留在事件位语义内。\n<\/li><li>\n边界 2：TRIP 处理程序属用户程序一部分；TRAP 处理程序属操作系统，入口经 rT。\n<\/li><li>\n边界 3：存储指令与非存储指令的 rY/rZ 含义不同；立即常数操作数在 rZ 中记 2。\n<\/li><li>\n边界 4：rA 其余 46 位必须保持零；舍入模式两位随 rA 保存。\n<\/li><li>\n失败案例：许可位与事件位读反；现场寄存器被处理程序当普通工作寄存器覆盖；向量地址按十进制编号映射。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>故障 vs 陷阱<\/strong>：TRIP 交用户处理程序；TRAP 交操作系统。\n<\/li><li>\n<strong>许可位 vs 事件位<\/strong>：许可位是开关（0 留档、1 跳转）；事件位是记录位。\n<\/li><li>\n<strong>rY/rZ 非存储 vs 存储<\/strong>：前者存寄存器操作数，后者存内存地址与待存值。\n<\/li><li>\n<strong>rA 事件位 vs c08 异常来源<\/strong>：O/U/Z/I/X 等事件位由浮点与整数运算指令置位，rA 是汇总状态寄存器。\n<\/ul>\n<p><strong>事件位复查<\/strong>：程序可在适当间隔读 rA 事件字节，检查此前被许可位拦住而留档的异常；事件位不会自动清除，需显式 PUT 写入新的 rA 值。<\/p>\n<p><strong>舍入模式共存<\/strong>：rA 高位两位保存当前舍入模式（对应 c08 的 1–4 编号）；读 rA 时先剥出这两位，不要把舍入模式位误读成异常位。<\/p>\n<p><strong>TRAP 入口<\/strong>：陷阱处理程序属操作系统一部分，入口地址由专用陷阱地址寄存器 rT 提供；TRAP 的现场寄存器与 TRIP 对应，但编号独立，避免故障现场与系统现场互相覆盖。<\/p>\n<p><strong>外部中断与算术异常的分工<\/strong>：本节八类异常来自算术运算；安全违例、硬件故障、外部信号等另有中断路径。TRIP 指令可主动触发位于 <code>#00<\/code> 的用户故障处理程序，用于程序内自检与异常模拟。<\/p>\n<p><strong>特权访问<\/strong>：rA、rT 等专用寄存器通过 GET/PUT 读写；部分专用寄存器的写入范围受特权规则限制，故障处理程序在必要时才更新状态位。<\/p>\n<p><strong>向量表布局<\/strong>：<code>#10<\/code> 至 <code>#80<\/code> 每类占一个十六进制间隔单元；处理程序在对应单元放置跳转指令或入口代码。<code>#00<\/code> 供 TRIP 直接故障入口使用。程序初始化时按异常类别把处理地址填入对应单元。<\/p>\n<p><strong>异常与指令流<\/strong>：未许可异常不打断指令流，下一条指令照常执行；已许可异常在当前指令结束、下一条指令开始前完成分发。处理程序返回后，中断指令是否重执行由处理程序约定决定。<\/p>\n<p><strong>状态位累积语义<\/strong>：事件字节是累积快照，同一类异常重复发生只对应同一位置 1；多类异常叠加在位组合中，读字节后按位拆解类别，不依赖计数。<\/p>\n<p><strong>异常向量初始化<\/strong>：程序启动时按 D/V/W/I/O/U/Z/X 类别把处理程序入口填入 <code>#10<\/code>–<code>#80<\/code> 对应单元；<code>#00<\/code> 留给 TRIP 直接入口。处理程序地址未填入时，对应向量单元保持初始约定内容。<\/p>\n<p><strong>事件位读取方式<\/strong>：读 rA 后按字节拆分许可段与事件段；事件字节按位拆解类别，不做计数。清除事件位用 PUT 写回，保留许可位与舍入模式位，避免整字清零改动策略。<\/p>\n<p><strong>故障与陷阱的现场隔离<\/strong>：TRIP 用 rB/rW/rX/rY/rZ，TRAP 用独立的一组陷阱现场寄存器；两套寄存器互不覆盖，保证用户故障处理与系统陷阱处理各自回溯现场。rT 只在陷阱路径提供入口地址。<\/p>\n<h2>联系<\/h2>\n<p>前置：c08 浮点异常类别与舍入模式；c09 rJ、@ 现场保存思路；c03 指令字段（rX 右半存故障指令）。后继：操作系统级上下文切换与 SAVE/UNSAVE 衔接；特权指令访问专用寄存器受 PUT 规则限制。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（异常、故障与陷阱：rA 事件位/许可位、TRIP 与 TRAP 的控制转移）<\/summary><div class=\"depth-body\"><h1>c10 深度推导：rA 位段展开、向量地址映射、多异常优先级与故障现场逐寄存器走查<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>从一条触发异常的指令走到处理程序，往回追六层：<\/p>\n<ol><li>\n运算结果：指令算出结果，同时标出产生的异常类别集合。\n<\/li><li>\n位段定位：rA 最右字节事件位、左邻字节许可位，两字节同序 DVWIOUZX。\n<\/li><li>\n开关判定：许可位 0 置事件位留档；许可位 1 进入跳转候选。\n<\/li><li>\n优先级：候选异常按位序从左到右取最左一项。\n<\/li><li>\n现场保存：rB/rW/rX/rY/rZ 记录中断点、故障指令与操作数。\n<\/li><li>\n分发：@ 换向量地址，控制转入处理程序；TRAP 走 rT 入口与陷阱现场寄存器。\n<\/ol>\n<p>依赖方向：异常集合 → rA 位段 → 许可判定 → 优先级 → 现场 → 向量分发。许可位与事件位读反，会把留档异常当成跳转请求。<\/p>\n<h2>正向推导：rA 位段布局<\/h2>\n<p>rA 共 64 位：<\/p>\n<ol><li>\n最低字节（位 7–0）：事件位，D 在位 7（<code>#80<\/code>），V 位 6（<code>#40<\/code>），W 位 5（<code>#20<\/code>），I 位 4（<code>#10<\/code>），O 位 3（<code>#08<\/code>），U 位 2（<code>#04<\/code>），Z 位 1（<code>#02<\/code>），X 位 0（<code>#01<\/code>）。\n<\/li><li>\n次低字节（位 15–8）：许可位，同序同权值。\n<\/li><li>\n再左两位：当前舍入模式，模 4。\n<\/li><li>\n其余 46 位保持零。\n<\/ol>\n<p>位权核验：<span class=\"katex-inline\">2^7=128=\\texttt{\\#80}<\/span>，<span class=\"katex-inline\">2^6=64=\\texttt{\\#40}<\/span>，<span class=\"katex-inline\">2^5=32=\\texttt{\\#20}<\/span>，<span class=\"katex-inline\">2^4=16=\\texttt{\\#10}<\/span>，<span class=\"katex-inline\">2^3=8=\\texttt{\\#08}<\/span>，<span class=\"katex-inline\">2^2=4=\\texttt{\\#04}<\/span>，<span class=\"katex-inline\">2^1=2=\\texttt{\\#02}<\/span>，<span class=\"katex-inline\">2^0=1=\\texttt{\\#01}<\/span>。<\/p>\n<h2>数值算例一：事件字节组合<\/h2>\n<ol><li>\n仅浮点除零：Z 位置 1，事件字节 <code>#02<\/code>。\n<\/li><li>\n仅浮点上溢：O 位，<code>#08<\/code>。\n<\/li><li>\n上溢与不精确同时留档：O+X = <code>#08<\/code>+<code>#01<\/code>=<code>#09<\/code>。\n<\/li><li>\n整数除零与整数溢出：D+V = <code>#80<\/code>+<code>#40<\/code>=<code>#c0<\/code>。\n<\/li><li>\n八类全置：<code>#ff<\/code>。\n<\/ol>\n<p>许可字节同规则：某位许可为 1 表示该类异常允许立即跳转；为 0 表示只置事件位。读 rA 时先按字节分开许可与事件，不要把两字节合并成一个整数解释。<\/p>\n<h2>数值算例二：向量地址映射<\/h2>\n<p>异常类别到向量单元，按位序每类占 <span class=\"katex-inline\">16<\/span> 字节（<code>#10<\/code>）间隔：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>异常<\/th><th>位权<\/th><th>向量地址<\/th><\/tr><\/thead><tbody><tr><td>D<\/td><td><code>#80<\/code><\/td><td><code>#10<\/code><\/td><\/tr><tr><td>V<\/td><td><code>#40<\/code><\/td><td><code>#20<\/code><\/td><\/tr><tr><td>W<\/td><td><code>#20<\/code><\/td><td><code>#30<\/code><\/td><\/tr><tr><td>I<\/td><td><code>#10<\/code><\/td><td><code>#40<\/code><\/td><\/tr><tr><td>O<\/td><td><code>#08<\/code><\/td><td><code>#50<\/code><\/td><\/tr><tr><td>U<\/td><td><code>#04<\/code><\/td><td><code>#60<\/code><\/td><\/tr><tr><td>Z<\/td><td><code>#02<\/code><\/td><td><code>#70<\/code><\/td><\/tr><tr><td>X<\/td><td><code>#01<\/code><\/td><td><code>#80<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>TRIP 直接指令入口在 <code>#00<\/code>；算术异常按上表分发。向量单元存放处理程序入口或跳转指令。<\/p>\n<h2>数值算例三：多异常优先级走查<\/h2>\n<p>同一次运算同时产生 O（上溢）与 X（不精确），两类许可位都为 1：<\/p>\n<ol><li>\n候选集合 {O, X}。\n<\/li><li>\n按 DVWIOUZX 位序，O 在左（位 3），X 在右（位 0）。\n<\/li><li>\n取最左 O，跳到 <code>#50<\/code>；X 不在本次分发中处理。\n<\/li><li>\n若 O 许可位为 0、X 许可位为 1：O 置事件位 <code>#08<\/code> 留档，候选只剩 X，跳 <code>#80<\/code>。\n<\/ol>\n<p>左侧优先意味着类别位序靠前的异常先打断；处理程序返回后，其余留档类别由后续判定或事件位复查。<\/p>\n<h2>数值算例四：故障现场逐寄存器保存<\/h2>\n<p>故障发生时按序写入：<\/p>\n<ol><li>\nrB←<code><span class=\"katex-inline\">255<\/code>：把当前 <code><\/span>255<\/code> 原值存入自举寄存器。\n<\/li><li>\n<code><span class=\"katex-inline\">255<\/code>←rJ：返回链接进 <code><\/span>255<\/code>，处理程序可用它回到中断点。\n<\/li><li>\nrW←@+4：中断指令的下一条指令地址。\n<\/li><li>\nrX 左半置 <code>#80000000<\/code>，右半置引发故障的指令本身（指令 4 字节落在右半）。\n<\/li><li>\n非存储指令：rY←<code><span class=\"katex-inline\">Y<\/code>，rZ←<code><\/span>Z<\/code>；操作数是立即常数时 rZ 置 2。\n<\/li><li>\n存储指令：rY←A（内存地址），rZ←<code>$X<\/code>（被存储的量）。\n<\/li><li>\n@←处理程序向量地址。\n<\/ol>\n<p>处理程序读 rX 右半识别指令，读 rY/rZ 取操作数；需要返回时按 rW 与 <code>$255<\/code> 中的链接恢复中断流。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：许可位与事件位混淆。<\/strong> 把许可位 0 当成&quot;允许跳转&quot;，实际 0 是留档；方向记反会导致该跳转时只置位、该留档时误打断。 <strong>案例 2：优先级按数值大小。<\/strong> O 位权 <code>#08<\/code> 大于 X <code>#01<\/code>，本例方向一致；位序靠左的类别即使权值小也先于靠右类别，判定必须按 DVWIOUZX 顺序，不是按位权大小排序。 <strong>案例 3：存储指令操作数读错。<\/strong> 存储指令 rY 是内存地址 A，不是 <code><span class=\"katex-inline\">Y<\/code>；rZ 是待存值 <code><\/span>X<\/code>，不是源寄存器编号。 <strong>案例 4：现场寄存器被覆盖。<\/strong> rB/rW/rX/rY/rZ 是中断现场，处理程序入口阶段不得当工作寄存器改写。 <strong>案例 5：TRAP 现场寄存器混用。<\/strong> 陷阱路径用 rB/rW/rX/rY/rZ 的陷阱版本，入口由 rT 给出；故障路径用故障版本寄存器，两套不通用。<\/p>\n<h2>延伸推导：异常类别与指令来源<\/h2>\n<ul><li>\nD：DIV 除零；DIVU 不引发整数除法校验。\n<\/li><li>\nV：整数加/减/乘结果超出补码范围。\n<\/li><li>\nW：FIX/FIXU 浮点转定点结果越界。\n<\/li><li>\nI：NaN 输入、无穷减无穷、0×无穷等无效操作。\n<\/li><li>\nO：浮点结果指数超出规范上限。\n<\/li><li>\nU：浮点结果进入弱规范数区或低于最小规范数。\n<\/li><li>\nZ：FDIV 浮点除零。\n<\/li><li>\nX：舍入改变末位、结果不精确。\n<\/ul>\n<p>事件位一旦置位，保持到程序用 PUT 清除；下一条指令执行前的判定只看许可位与当前异常集合。<\/p>\n<h2>差生通读检查<\/h2>\n<ol><li>\nrA：算术状态寄存器，含许可位、事件位、舍入模式位。\n<\/li><li>\nDVWIOUZX：八类异常顺序，位权 <code>#80<\/code> 到 <code>#01<\/code>。\n<\/li><li>\n许可位 0 留档，许可位 1 跳转。\n<\/li><li>\n向量 <code>#10<\/code>–<code>#80<\/code>，左侧异常优先。\n<\/li><li>\nrB/rW/rX/rY/rZ：故障现场五寄存器；TRAP 换陷阱版本与 rT 入口。\n<\/ol>\n<h2>数值算例五：rA 整字位段走查<\/h2>\n<p>设事件字节 <code>#09<\/code>（O+X 留档），许可字节 <code>#08<\/code>（仅 O 允许跳转），舍入模式 4（ROUND_NEAR）。<\/p>\n<ol><li>\n事件位：位 3=1（O）、位 0=1（X），其余 0；二进制 <code>00001001<\/code>。\n<\/li><li>\n许可位：位 3=1（O），其余 0；二进制 <code>00001000<\/code>。\n<\/li><li>\n舍入模式两位存 4 对应的模式编码（模 4），位于许可字节左侧。\n<\/li><li>\n其余 46 位为零。\n<\/li><li>\n判定本次新异常：若只有 X 出现，许可位 0 → 事件位 X 置 1；若 O 出现，许可位 1 → 跳 <code>#50<\/code>。\n<\/ol>\n<h2>正向推导：优先级形式规则<\/h2>\n<p>候选许可异常集合按字母序 D,V,W,I,O,U,Z,X 排列；取序列中第一个出现的类别。形式化：<\/p>\n<ol><li>\n扫位 7 到位 0；\n<\/li><li>\n位对应许可位为 1 且本次异常集合含该类，即选为分发项；\n<\/li><li>\n扫描停止，其余候选不进本次向量跳转。\n<p>位权大小不参与排序；同一位序内不重复分发同类。<\/p>\n<\/ol>\n<h2>数值算例六：返回路径核验<\/h2>\n<p>处理程序接管时：<\/p>\n<ol><li>\nrW 存 @+4，即中断指令下一条地址；<code>$255<\/code> 存旧 rJ。\n<\/li><li>\n处理程序完成清理后，按约定恢复 @ 到 rW 指向的位置，恢复 <code>$255<\/code> 与现场寄存器。\n<\/li><li>\n若异常不可恢复，处理程序可转入错误报告路径，不回到中断指令。\n<\/li><li>\n存储指令的待存值在 rZ，处理程序判定是否重新执行存储；非存储指令操作数在 rY/rZ。\n<\/ol>\n<h2>失败案例延伸<\/h2>\n<p><strong>案例 6：向量地址按位权映射。<\/strong> Z 位权 <code>#02<\/code>，向量不是 <code>#02<\/code> 而是 <code>#70<\/code>；向量地址按类别顺序排表，不按位权值照抄。 <strong>案例 7：立即常数操作数。<\/strong> 非存储指令操作数为立即常数时 rZ 置 2，不存常数本身；读 rZ 前先区分寄存器操作数与立即数形式。 <strong>案例 8：rA 保留位写非零。<\/strong> 其余 46 位约定保持零；PUT 写入时把保留位填 1 会违反规则。 <strong>案例 9：事件位跨指令累积。<\/strong> 事件位是累积状态，不清零则多次异常叠加在同一字节；复查时按位拆解类别。<\/p>\n<h2>对抗性追问：为什么许可位与事件位分两层<\/h2>\n<p>一层开关无法同时表达&quot;允许打断&quot;和&quot;已发生但未打断&quot;两类信息。许可位决定策略：遇到异常是记录还是跳转；事件位记录历史：哪些异常曾被留档。两层拆开后，程序可先批量开启危险异常的跳转许可，其余异常先留档后复查。<\/p>\n<p>追问二：为什么现场用五个专用寄存器而不是压内存栈。中断点必须在存储动作完成前快速保存；专用寄存器写入不经过内存访问，处理程序按需再把现场批量落盘。TRIP 与 TRAP 各用一套现场寄存器，避免用户故障处理程序与系统陷阱处理程序互相覆盖现场。<\/p>\n<h2>差生通读复核：常见卡点<\/h2>\n<ul><li>\n卡点 1：许可位 0 留档、1 跳转，方向不要记反。\n<\/li><li>\n卡点 2：优先级按 DVWIOUZX 位序，不按位权大小。\n<\/li><li>\n卡点 3：向量 <code>#10<\/code>–<code>#80<\/code> 等间隔，不对应位权值。\n<\/li><li>\n卡点 4：存储指令 rY=地址、rZ=待存值。\n<\/li><li>\n卡点 5：TRIP 现场与 TRAP 现场寄存器分属两套。\n<\/ul>\n<h2>与其他概念的接口<\/h2>\n<ul><li>\n回 c05：D/V 来自整数算术与除法；DIVU 不触发 D。\n<\/li><li>\n回 c08：W/I/O/U/Z/X 来自浮点指令；舍入模式位在 rA 高位共存。\n<\/li><li>\n回 c09：rJ 现场经 <code>$255<\/code> 中转；SAVE/UNSAVE 是进程级整组保存，故障现场是单事件快速保存。\n<\/ul>\n<h2>数值算例七：八类异常来源对照走查<\/h2>\n<ol><li>\n<code>DIV <span class=\"katex-inline\">X,<\/span>Y,<span class=\"katex-inline\">Z<\/code> 且 <\/span>Z=0<span class=\"katex-inline\">：D 候选；结果置商 0、余数取 <\/span>Y$。\n<\/li><li>\n整数加法结果超出补码上下限：V 候选。\n<\/li><li>\nFIX 把越界浮点转定点：W 候选。\n<\/li><li>\n无穷减无穷或 0×无穷：I 候选。\n<\/li><li>\n浮点结果绝对值超过最大规范数：O 候选。\n<\/li><li>\n结果低于最小规范数进入弱规范区：U 候选。\n<\/li><li>\nFDIV 除数为零：Z 候选。\n<\/li><li>\n运算末位被舍入改变：X 候选。\n<\/ol>\n<p>每个候选先过许可位；同一指令可能同时标记多类，例如上溢伴随不精确（O+X）。<\/p>\n<h2>术语对位<\/h2>\n<ul><li>\n<strong>rA<\/strong>：算术状态寄存器，许可位 + 事件位 + 舍入模式位。\n<\/li><li>\n<strong>事件位（event bit）<\/strong>：记录未跳转异常的留档位。\n<\/li><li>\n<strong>许可位（permit bit）<\/strong>：决定异常留档还是跳转的开关位。\n<\/li><li>\n<strong>向量单元<\/strong>：固定地址 <code>#10<\/code>–<code>#80<\/code>，存放各类异常处理入口。\n<\/li><li>\n<strong>rT<\/strong>：陷阱地址寄存器，提供 TRAP 处理程序入口。\n<\/li><li>\n<strong>rB/rW/rX/rY/rZ<\/strong>：故障现场五寄存器；陷阱路径有对应独立寄存器组。\n<\/ul>\n<h2>指令对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>指令<\/th><th>作用<\/th><th>现场<\/th><\/tr><\/thead><tbody><tr><td>TRIP X,Y,Z / X,YZ / XYZ<\/td><td>触发用户故障，入口 <code>#00<\/code><\/td><td>故障现场寄存器<\/td><\/tr><tr><td>TRAP X,Y,Z / X,YZ / XYZ<\/td><td>触发系统陷阱<\/td><td>陷阱现场寄存器，入口经 rT<\/td><\/tr><\/tbody><\/table><\/div>\n<p>两条指令的字段形式与普通转移指令类似；差别在控制归属与现场寄存器组。<\/p>\n<h2>失败案例补充：事件位清除时机<\/h2>\n<p>事件位由异常硬件置位，软件负责清除；处理程序若读完事件位不清除，下一轮判定会把旧异常误当成新事件。清除通过 PUT 写回新的 rA 值，写入时保留许可位与舍入模式位，不要整字清零。<\/p>\n<h2>差生通读复核：分发流程顺序<\/h2>\n<ol><li>\n算术指令执行，标出异常集合。\n<\/li><li>\n逐类查许可位，分出留档项与跳转候选。\n<\/li><li>\n候选按位序取最左。\n<\/li><li>\n保存故障现场五寄存器。\n<\/li><li>\n@ 换向量地址，转入处理程序。\n<\/li><li>\n处理程序读 rX/rY/rZ 识别指令与操作数。\n<\/li><li>\n返回前恢复 rW 链接，清除或复查事件位。\n<\/ol>\n<h2>数值算例八：位组合拆解练习<\/h2>\n<p>事件字节 <code>#b6<\/code>：<\/p>\n<ol><li>\n<code>#b6<\/code> = <code>10110110<\/code>。\n<\/li><li>\n位 7=1 → D；位 6=0 → V 无；位 5=1 → W；位 4=1 → I；位 3=0 → O 无；位 2=1 → U；位 1=1 → Z；位 0=0 → X 无。\n<\/li><li>\n留档类别：D、W、I、U、Z。\n<\/li><li>\n按位权核验：<code>#80<\/code>+<code>#20<\/code>+<code>#10<\/code>+<code>#04<\/code>+<code>#02<\/code>=<code>#b6<\/code>。\n<p>反向组合：要标记 V、O、X，字节 = <code>#40<\/code>+<code>#08<\/code>+<code>#01<\/code>=<code>#49<\/code>。<\/p>\n<\/ol>\n<h2>与 c09 现场保存的对照<\/h2>\n<ul><li>\n子程序帧：PUSH/POP 管理局部寄存器，rJ 存返回地址。\n<\/li><li>\n故障现场：五专用寄存器存中断点与操作数，<code>$255<\/code> 中转 rJ。\n<\/li><li>\n进程上下文：SAVE/UNSAVE 整组落盘恢复。\n<p>三层保存粒度不同：帧内换寄存器编号，故障保存单事件现场，进程切换保存全部上下文。故障处理程序若需要长期挂起现场，再配合 SAVE 把整组上下文写入内存栈。<\/p>\n<\/ul>\n<h2>全节走查清单<\/h2>\n<ol><li>\n指令执行结果标注异常类别集合。\n<\/li><li>\n按 DVWIOUZX 序逐类查许可位。\n<\/li><li>\n留档项置事件位；候选项取最左。\n<\/li><li>\n写故障现场五寄存器，区分存储/非存储操作数。\n<\/li><li>\n@ 换向量地址；TRAP 路径换陷阱寄存器与 rT 入口。\n<\/li><li>\n处理程序读 rX 右半指令、rY/rZ 操作数。\n<\/li><li>\n返回前恢复链接，按约定清除事件位。\n<\/ol>\n<h2>补充：rA 写入权限与状态恢复<\/h2>\n<p>GET 可读 rA 全字；PUT 写 rA 受特权规则约束，许可位、事件位与舍入模式位的改写范围由机器界定。故障处理程序清除事件位时，按位保留许可位与舍入模式两位，只清目标事件位；整字覆盖会误改策略位。rT 仅 TRAP 路径使用，故障路径不读陷阱入口寄存器。<\/p>\n<h2>数值算例九：许可位组合判定走查<\/h2>\n<p>许可字节 <code>#12<\/code>（I 位 <code>#10<\/code> 与 Z 位 <code>#02<\/code> 允许跳转），事件字节初始为零。本次 FDIV 除零同时结果不精确，候选异常 Z、X：<\/p>\n<ol><li>\nZ 许可位 1 → 跳转候选；X 许可位 0 → 事件位 X 置 1，事件字节 <code>#01<\/code>。\n<\/li><li>\n候选只有 Z，向量 <code>#70<\/code>。\n<\/li><li>\n现场保存：rX 右半存除法指令，rY/rZ 存操作数（除数为零的源寄存器值）。\n<\/li><li>\n若同时出现 I：I 在位序上靠左于 Z，候选优先 I，向量 <code>#40<\/code>。\n<\/ol>\n<h2>向量表布局复核<\/h2>\n<p><code>#00<\/code>：TRIP 直接故障入口；<code>#10<\/code>：D；<code>#20<\/code>：V；<code>#30<\/code>：W；<code>#40<\/code>：I；<code>#50<\/code>：O；<code>#60<\/code>：U；<code>#70<\/code>：Z；<code>#80<\/code>：X。每个单元间隔 16 字节，可放一条跳转指令或入口短代码。表项由初始化代码按处理程序地址填入。<\/p>\n<h2>现场寄存器用途对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>寄存器<\/th><th>故障路径写入内容<\/th><\/tr><\/thead><tbody><tr><td>rB<\/td><td>旧 <code>$255<\/code> 值<\/td><\/tr><tr><td>rW<\/td><td>@+4，中断指令下一条地址<\/td><\/tr><tr><td>rX<\/td><td>左半 <code>#80000000<\/code>，右半故障指令<\/td><\/tr><tr><td>rY<\/td><td>非存储：<code>$Y<\/code>；存储：内存地址 A<\/td><\/tr><tr><td>rZ<\/td><td>非存储：<code><span class=\"katex-inline\">Z<\/code>（立即数记 2）；存储：待存值 <code><\/span>X<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>TRAP 路径对应寄存器独立编号；入口地址读 rT。处理程序从 rX 右半取出指令字，解码字段后再决定读 rY 还是 rZ。<\/p>\n<h2>失败案例补充：中断指令重执行<\/h2>\n<p>处理程序修正异常条件后可回到中断指令重执行；若直接回到 rW 指向的下一条指令，异常指令被跳过。两种返回策略由处理程序约定，rW 保存的是下一条地址，重执行入口需另行恢复中断指令地址。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n写出八类异常的字母顺序与对应位权。\n<\/li><li>\n许可位为 0 和为 1 时分别怎么处理异常？\n<\/li><li>\nO 与 X 同时许可，先分发哪一类？向量地址是多少？\n<\/li><li>\n故障保存时 rX、rY、rZ 各记录什么？存储指令与非存储指令差别在哪？\n<\/li><li>\nTRIP 与 TRAP 的处理程序归属和入口来源有何不同？\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：位、字节与机器骨架：数据宽度、内存寄存器模型、指令字段<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章 §1.3–§1.3.1 前半：MMIX 基础、位与字节、内存寄存器模型与指令格式<\/a><br>检查点：能把 64 位位串换成十六进制，列出字节/短字/半字/全字的无符号与补码取值范围，说明 M1/M2/M4/M8 内存分组与通用/专用寄存器分工，把 #20010203 拆成 OP/X/Y/Z<\/li><li class='path-step' id='path-02'><strong>步骤 02：寄存器与内存之间：加载存储的位级语义、整数算术与按位运算<\/strong><br>阅读：<a href=\"#/chapter/ch02\">§1.3.1 中段：加载与存储的位级语义、整数算术、移位比较与按位运算<\/a><br>检查点：能对给定全字逐步推出 LDB/LDW/LDT/LDO 与无符号变体的结果，说明符号扩展方向，区分 ADD/SUB/MUL/DIV 与 AD DU 变体的溢出行为，按位写出 AND/OR/XOR 与移位、比较的结果<\/li><li class='path-step' id='path-03'><strong>步骤 03：浮点层：754 格式位段、五类数值、舍入与定点互换<\/strong><br>阅读：<a href=\"#/chapter/ch03\">§1.3.1 浮点部分：IEEE 754 双精度与短浮点数、浮点指令、舍入与定点互换<\/a><br>检查点：能从符号 1 位、指数 11 位、小数 52 位拆出一个双精度字并算出数值，区分零/弱规范数/规范数/无穷/NaN，说出四种舍入模式与 FIX/FLOT 互换的方向<\/li><li class='path-step' id='path-04'><strong>步骤 04：控制流与异常：转移、子程序连接、寄存器栈、故障与陷阱<\/strong><br>阅读：<a href=\"#/chapter/ch04\">§1.3.1 后段与 §1.4.1：跳转转移、子程序连接、寄存器栈、故障与陷阱<\/a><br>检查点：能解释 JMP/GO 与条件转移的目标地址计算，描述 PUSHJ/POP 怎样保存局部寄存器并装入 rJ，说明 rG/rL/rD 阈值与 SAVE/UNSAVE，列出 rA 八个异常位及 TRIP/TRAP 的处理程序地址路径<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='位（bit）'>位（bit） — 取值 0 或 1 的二进制数字；MMIX 一次处理 64 个二进制位，位是机器上最底层的信息单元 <span class=glossary-ref>（第 1 章 §1.3–§1.3.1 前半：MMIX 基础、位与字节、内存寄存器模型与指令格式）<\/span><\/li><li data-term='字节（byte，m1）'>字节（byte，M1） — 8 个二进制位或 2 个十六进制数字组成的可独立寻址单元；无符号字节取值 0 到 255 <span class=glossary-ref>（第 1 章 §1.3–§1.3.1 前半：MMIX 基础、位与字节、内存寄存器模型与指令格式）<\/span><\/li><li data-term='短字（wyde，m2）'>短字（wyde，M2） — 2 个连续字节，16 位；无符号取值 0 到 65535，补码取值 −32768 到 32767 <span class=glossary-ref>（第 1 章 §1.3–§1.3.1 前半：MMIX 基础、位与字节、内存寄存器模型与指令格式）<\/span><\/li><li data-term='半字（tetra，m4）'>半字（tetra，M4） — 4 个连续字节，32 位；无符号取值 0 到 4294967295 <span class=glossary-ref>（第 1 章 §1.3–§1.3.1 前半：MMIX 基础、位与字节、内存寄存器模型与指令格式）<\/span><\/li><li data-term='全字（octa，m8）'>全字（octa，M8） — 8 个连续字节，64 位；MMIX 寄存器保存的就是全字，无符号最大值 18446744073709551615 <span class=glossary-ref>（第 1 章 §1.3–§1.3.1 前半：MMIX 基础、位与字节、内存寄存器模型与指令格式）<\/span><\/li><li data-term='二进制补码（two&#x27;s complement）'>二进制补码（two&#x27;s complement） — 整数的位模式表示约定：最左位为符号位，前导位是 1 时减去 $2^n$ 得到对应整数；s(z) 表示补码解释，u(z) 表示无符号解释 <span class=glossary-ref>（§1.3.1 中段：加载与存储的位级语义、整数算术、移位比较与按位运算）<\/span><\/li><li data-term='指令半字（instruction word）'>指令半字（instruction word） — MMIX 指令占一个半字（4 字节），由 OP 操作码与 X、Y、Z 三个操作数字段组成 <span class=glossary-ref>（第 1 章 §1.3–§1.3.1 前半：MMIX 基础、位与字节、内存寄存器模型与指令格式）<\/span><\/li><li data-term='符号扩展（sign extension）'>符号扩展（sign extension） — 把短量装入全字时，按短量符号位把寄存器左侧位全部填成 0 或 1；无符号加载则把左侧填零 <span class=glossary-ref>（§1.3.1 中段：加载与存储的位级语义、整数算术、移位比较与按位运算）<\/span><\/li><li data-term='浮点格式（ieee 754）'>浮点格式（IEEE 754） — 64 位全字分为符号位 1 位、指数 11 位、小数 52 位；短浮点为 1 位符号、8 位指数、23 位小数 <span class=glossary-ref>（§1.3.1 浮点部分：IEEE 754 双精度与短浮点数、浮点指令、舍入与定点互换）<\/span><\/li><li data-term='舍入模式（rounding mode）'>舍入模式（rounding mode） — 不能精确赋值时确定结果取整方向的规则；MMIX 含 ROUND_OFF、ROUND_UP、ROUND_DOWN、ROUND_NEAR 四种 <span class=glossary-ref>（§1.3.1 浮点部分：IEEE 754 双精度与短浮点数、浮点指令、舍入与定点互换）<\/span><\/li><li data-term='子程序连接（subroutine linkage）'>子程序连接（subroutine linkage） — 控制从主程序转入子程序、结束后回到主程序接续点的整套约定；MMIX 用 PUSHJ 装入返回地址 rJ，POP 跳回 <span class=glossary-ref>（§1.3.1 后段与 §1.4.1：跳转转移、子程序连接、寄存器栈、故障与陷阱）<\/span><\/li><li data-term='故障（trip）与陷阱（trap）'>故障（trip）与陷阱（trap） — 两类程序中断：故障把控制转到用户程序内的故障处理程序，陷阱把控制转到操作系统的陷阱处理程序 <span class=glossary-ref>（§1.3.1 后段与 §1.4.1：跳转转移、子程序连接、寄存器栈、故障与陷阱）<\/span><\/li><li data-term='算术状态寄存器 ra'>算术状态寄存器 rA — 记录八种异常条件 D/V/W/I/O/U/Z/X 的事件位与许可位，旁邻两位保存当前舍入模式 <span class=glossary-ref>（§1.3.1 后段与 §1.4.1：跳转转移、子程序连接、寄存器栈、故障与陷阱）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：拿到一个十六进制字，先分段，再选解释公式<\/h2>\n<p><strong>触发<\/strong>：面对一个全字或半字，需要判断它是整数、地址、指令还是浮点值。 <strong>步骤<\/strong>：<\/p>\n<ol><li>\n先定对象宽度：字节 8 位、短字 16 位、半字 32 位、全字 64 位。\n<\/li><li>\n按格式切段：指令拆 OP/X/Y/Z；浮点拆符号/指数/小数；整数不切段只定补码或无符号解释。\n<\/li><li>\n段值换算成十进制或二进制中间结果，再代入对应公式。\n<p><strong>落点<\/strong>：指令字段展开成编号与地址；浮点按五类区间选解码公式；整数按 s(z) 或 u(z) 读数。 <strong>边界<\/strong>：同一字位模式在不同解释下数值不同；解释未定之前不算数。浮点 E=0 与 E=2047 是保留区间，不套规范数公式。<\/p>\n<\/ol>\n<h2>模式 2：装载存储先定分量宽度，再判符号扩展方向<\/h2>\n<p><strong>触发<\/strong>：分析 LDB/LDW/LDT/LDO 及无符号变体，或对应存储指令的结果。 <strong>步骤<\/strong>：<\/p>\n<ol><li>\n从助记符确认分量宽度：B 字节、W 短字、T 半字、O 全字。\n<\/li><li>\n补码路径看分量符号位：符号位 1 高位全填 1，符号位 0 高位填 0；无符号路径高位一律填零。\n<\/li><li>\n存储指令只读目标寄存器低位分量写入内存，高位不写入，也不做符号扩展。\n<p><strong>落点<\/strong>：写出装载后全字的十六进制结果；判断存储是否超出分量宽度记溢出。 <strong>边界<\/strong>：LDO/LDOU 同宽回填，无扩展差别；地址计算按无符号全字，分量内数值解释另算。立即常数操作数在异常现场记为 2，不填常数本身。<\/p>\n<\/ol>\n<h2>模式 3：整数运算先定补码/无符号解释，再查溢出与余数<\/h2>\n<p><strong>触发<\/strong>：ADD/SUB/MUL/DIV 及 AD DU 变体的结果与异常判定。 <strong>步骤<\/strong>：<\/p>\n<ol><li>\n选解释：补码走 s(z)，无符号走 u(z)；助记符带 U 的为无符号路径。\n<\/li><li>\n算实数域中间结果，再按分量宽度回填；补码越界记 V，除法除零记 D。\n<\/li><li>\n乘积分段：低半回目标寄存器，高半进 rH；除法商回目标，余数进 rR。\n<p><strong>落点<\/strong>：商、余数、高半分别写到约定寄存器；余数满足 <span class=\"katex-inline\">y=qz+r<\/span>。 <strong>边界<\/strong>：DIV 商向下取整，余数符号跟随被除数；DIVU 余数非负且不触发 D。MUL 与 MULU 高半整理规则不同，读 rH 前先确认乘法路径。<\/p>\n<\/ol>\n<h2>模式 4：浮点运算走&quot;实数结果—规范化—舍入回填—异常登记&quot;四步<\/h2>\n<p><strong>触发<\/strong>：FADD/FSUB/FMUL/FDIV/FSQRT/FINT 及 FIX/FLOT 转换结果分析。 <strong>步骤<\/strong>：<\/p>\n<ol><li>\n实数域算中间结果，乘法加指数、除法减指数，加减法先对齐指数。\n<\/li><li>\n尾数调到 <span class=\"katex-inline\">[1,2)<\/span>，定实际指数，判断落在规范、弱规范、零、无穷还是 NaN 区间。\n<\/li><li>\n超出 52 位小数段的低位按 rR 或 Y 字段舍入模式回填末位。\n<\/li><li>\n登记 O/U/Z/I/X 异常类别到 rA 事件位流程。\n<p><strong>落点<\/strong>：结果回浮点寄存器；转换指令先 intf 取整再换补码或无符号定点。 <strong>边界<\/strong>：NaN 参与比较属无序，不进 FCMP 大小结论；<span class=\"katex-inline\">+0.0<\/span> 与 <span class=\"katex-inline\">-0.0<\/span> 位模式不同但 FEQL 相等。FREM 的 n 取最近整数，平局取偶，与整数 DIV 向下取整余数不同。<\/p>\n<\/ol>\n<h2>模式 5：子程序调用按&quot;压帧—写 rJ—跳入口—配对弹帧&quot;闭环走查<\/h2>\n<p><strong>触发<\/strong>：PUSHJ/PUSHGO/POP/SAVE/UNSAVE 的现场与返回地址分析。 <strong>步骤<\/strong>：<\/p>\n<ol><li>\n读 X 字段定 push 帧大小，核对旧 <span class=\"katex-inline\">\\<\/span>0<span class=\"katex-inline\">–<\/span>\\<span class=\"katex-inline\">X<\/span> 隐藏范围，上层编号下移重排。\n<\/li><li>\nrJ←@+4，@ 跳入口；直接入口取指令内地址，间接入口取寄存器计算地址。\n<\/li><li>\n子程序内按 rL/rG 判定寄存器类别：局部读写、边缘读零写升格、全局跨帧保留。\n<\/li><li>\n返回时 POP 按配对 X 弹帧，@←rJ+4·YZ；进程级切换才用 SAVE/UNSAVE 整组保存。\n<p><strong>落点<\/strong>：返回值落在约定全局或可见局部编号；帧内临时寄存器从边缘升格。 <strong>边界<\/strong>：rJ 是专用寄存器，不当工作寄存器覆盖；SAVE 目标必须 <span class=\"katex-inline\">X&gt;rG<\/span>。嵌套调用 POP 顺序与 PUSH 相反，X 约定配对；边缘升格只在本帧有效。<\/p>\n<\/ol>\n<h2>模式 6：异常分发先查许可位，再按位序取最左候选<\/h2>\n<p><strong>触发<\/strong>：算术指令后置位判定，TRIP/TRAP 入口与现场寄存器走查。 <strong>步骤<\/strong>：<\/p>\n<ol><li>\n列出本次产生的异常类别集合（D/V/W/I/O/U/Z/X）。\n<\/li><li>\n逐类查 rA 许可位：0 → 事件位置 1 留档；1 → 进跳转候选。\n<\/li><li>\n候选按 DVWIOUZX 位序从左到右扫描，取第一个作为分发项。\n<\/li><li>\n保存现场：rB←<span class=\"katex-inline\">255<\/span>，<span class=\"katex-inline\">255<\/span>←rJ，rW←@+4，rX 右半存故障指令；非存储指令 rY/rZ 存操作数，存储指令
