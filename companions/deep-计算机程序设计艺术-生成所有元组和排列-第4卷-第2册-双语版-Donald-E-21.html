每步翻转的坐标编号）不同即不同格雷码。\n<\/li><li>\n<strong>格雷码映射 vs 位反序<\/strong>：<span class=\"katex-inline\">g(k)<\/span> 是整数到位串的变换，反解码 <span class=\"katex-inline\">g^{[-1]}<\/span> 从格雷串还原整数；二者互逆，不要把反序 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span>（序列反序）与位反序混淆。\n<\/li><li>\n<strong>单步翻转 vs 单元素移动<\/strong>：位串每次翻一位；排列邻位换位每次移一对相邻元素。两者都是低改动遍历，但对象空间与改动单位不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 的二元元组计数与位运算（异或、右移）。后继：c04 把反射思想推广到混合进制与子森林；c06 邻位换位排列的逆序表次序等价于基数 <span class=\"katex-inline\">(1,2,\\dots,n)<\/span> 的反射格雷码；Walsh 函数的指数位正是 <span class=\"katex-inline\">g(k)<\/span> 的各位，格雷码结构支撑正交函数分解。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（反射二进制格雷码：递归构造、$g(k)=k\\oplus\\lfloor k/2\\rfloor$ 与单步翻转）<\/summary><div class=\"depth-body\"><h1>c03 深度推导：反射格雷码递归展开、公式逐位核验与全序列手算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把反射格雷码往下追五层：<\/p>\n<ol><li>\n<strong>二元位串空间<\/strong>：先有全部 <span class=\"katex-inline\">2^n<\/span> 个 <span class=\"katex-inline\">n<\/span> 位串作为遍历对象；空间定义来自 c02 的二元元组计数。\n<\/li><li>\n<strong>立方体邻接关系<\/strong>：两个位串差一位即立方体上相邻顶点；格雷码就是在这张图上找走遍顶点的路或圈。\n<\/li><li>\n<strong>递归分半构造<\/strong>：把 <span class=\"katex-inline\">n<\/span> 位问题拆成两个 <span class=\"katex-inline\">n-1<\/span> 位子问题，前半加 0、后半加 1；子问题序列的首尾衔接方式决定跨段边界是否只翻一位。\n<\/li><li>\n<strong>反序衔接<\/strong>：后半段取反序，使前后两半在边界处共享低位后缀；这是反射构造区别于普通分半的核心动作。\n<\/li><li>\n<strong>整数位级公式<\/strong>：递归序列与整数编号对应后，可压缩成 <span class=\"katex-inline\">a_j=b_j\\oplus b_{j+1}<\/span> 的直接映射，不必每次递归展开。\n<\/ol>\n<p>依赖链方向：位串空间 → 立方体邻接 → 递归分半 → 反序衔接 → 位级公式。<\/p>\n<h2>正向推导：从递归规则到相邻单步翻转<\/h2>\n<p>下面逐步证明，每步注明依据。<\/p>\n<p><strong>步骤 1：基础情形。<\/strong> <span class=\"katex-inline\">\\Gamma_0=\\epsilon<\/span> 含一个空串；<span class=\"katex-inline\">\\Gamma_1=0\\Gamma_0,\\ 1\\Gamma_0^{R}=0,1<\/span>，相邻 <span class=\"katex-inline\">0<\/span> 与 <span class=\"katex-inline\">1<\/span> 差一位。基础性质成立。<\/p>\n<p><strong>步骤 2：归纳假设。<\/strong> 假设 <span class=\"katex-inline\">\\Gamma_n<\/span> 满足：包含全部 <span class=\"katex-inline\">2^n<\/span> 个 <span class=\"katex-inline\">n<\/span> 位串，相邻串只差一位（圈情形末位与首位也差一位）。<\/p>\n<p><strong>步骤 3：前半段内部。<\/strong> <span class=\"katex-inline\">\\Gamma_{n+1}<\/span> 前半段 <span class=\"katex-inline\">0\\Gamma_n<\/span>：每个串最高位补 0，其余位照抄 <span class=\"katex-inline\">\\Gamma_n<\/span>。两个相邻串的最高位都是 0，差异只在低位，由归纳假设低位差一位，前半段内部合格。<\/p>\n<p><strong>步骤 4：后半段内部。<\/strong> 后半段 <span class=\"katex-inline\">1\\Gamma_n^{R}<\/span>：先把 <span class=\"katex-inline\">\\Gamma_n<\/span> 反序成 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span>，再每位补前缀 1。反序不改变相邻关系（相邻对只是反向经过），前缀 1 固定，后半段内部相邻仍只差低位一位。<\/p>\n<p><strong>步骤 5：跨段衔接。<\/strong> 前半段末串 = <span class=\"katex-inline\">0<\/span> 接 <span class=\"katex-inline\">\\Gamma_n<\/span> 的末串；后半段首串 = <span class=\"katex-inline\">1<\/span> 接 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 的首串，而 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 的首串就是 <span class=\"katex-inline\">\\Gamma_n<\/span> 的末串。两个串低位完全相同，只有最高位 0 与 1 的差别，衔接处翻最高位一位。<\/p>\n<p><strong>步骤 6：覆盖与无重复。<\/strong> 前半段 <span class=\"katex-inline\">2^n<\/span> 个串最高位为 0，后半段 <span class=\"katex-inline\">2^n<\/span> 个最高位为 1，两部分不交；合计 <span class=\"katex-inline\">2^{n+1}<\/span>，正好是全部 <span class=\"katex-inline\">n+1<\/span> 位串个数，覆盖完整。<\/p>\n<p><strong>步骤 7：位级公式建立。<\/strong> 记 <span class=\"katex-inline\">k=(\\dots b_1b_0)_2<\/span>，格雷串 <span class=\"katex-inline\">g(k)=(\\dots a_1a_0)_2<\/span>。递归规则在 <span class=\"katex-inline\">k=2^n+r<\/span> 时给出 <span class=\"katex-inline\">g(k)=2^n+g(2^n-1-r)<\/span>。按位归纳：相邻高位决定 <span class=\"katex-inline\">a_{n-1}<\/span>，低位由低一位的 <span class=\"katex-inline\">b<\/span> 两两异或得到，即 <span class=\"katex-inline\">a_j=b_j\\oplus b_{j+1}<\/span>。写成整数操作：<span class=\"katex-inline\">b_{j+1}<\/span> 对应右移一位后的位，所以 <span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span>。<\/p>\n<p><strong>步骤 8：单步翻转复核。<\/strong> <span class=\"katex-inline\">k<\/span> 加 1 时，设末尾有 <span class=\"katex-inline\">\\rho(k)<\/span> 个连续 1：这些位 <span class=\"katex-inline\">b_j<\/span> 由 1 变 0，第 <span class=\"katex-inline\">\\rho(k)<\/span> 位由 0 变 1，更高位不变。对 <span class=\"katex-inline\">j&lt;\\rho(k)<\/span>，<span class=\"katex-inline\">b_j<\/span> 与 <span class=\"katex-inline\">b_{j+1}<\/span> 同时翻转，<span class=\"katex-inline\">a_j=b_j\\oplus b_{j+1}<\/span> 不变；<span class=\"katex-inline\">j=\\rho(k)<\/span> 处 <span class=\"katex-inline\">b_j<\/span> 单翻，<span class=\"katex-inline\">a_j<\/span> 翻；<span class=\"katex-inline\">j&gt;\\rho(k)<\/span> 两位都不变。格雷串只翻第 <span class=\"katex-inline\">\\rho(k)<\/span> 位，单步成立。<\/p>\n<h2>数值算例一：<span class=\"katex-inline\">n=3<\/span> 递归展开全序列与翻转位<\/h2>\n<p>从 <span class=\"katex-inline\">\\Gamma_0<\/span> 逐层展开：<\/p>\n<ol><li>\n<span class=\"katex-inline\">\\Gamma_1=0,1<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">\\Gamma_2=00,01,\\ 11,10<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">\\Gamma_3=000,001,011,010,\\ 110,111,101,100<\/span>。\n<\/ol>\n<p>逐对核验相邻差异：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>相邻对<\/th><th>差异位<\/th><\/tr><\/thead><tbody><tr><td>000→001<\/td><td>第 0 位<\/td><\/tr><tr><td>001→011<\/td><td>第 1 位<\/td><\/tr><tr><td>011→010<\/td><td>第 0 位<\/td><\/tr><tr><td>010→110<\/td><td>第 1 位<\/td><\/tr><tr><td>110→111<\/td><td>第 0 位<\/td><\/tr><tr><td>111→101<\/td><td>第 1 位<\/td><\/tr><tr><td>101→100<\/td><td>第 0 位<\/td><\/tr><\/tbody><\/table><\/div>\n<p>翻转位次序 <span class=\"katex-inline\">0,1,0,2,0,1,0<\/span>，与标尺函数 <span class=\"katex-inline\">\\rho(1),\\rho(2),\\dots,\\rho(7)<\/span> 一致。末串 100 与首串 000 差第 2 位，构成圈。<\/p>\n<h2>数值算例二：用 <span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span> 造表并反解码<\/h2>\n<p><span class=\"katex-inline\">n=3<\/span>，<span class=\"katex-inline\">k<\/span> 从 0 到 7：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><span class=\"katex-inline\">k<\/span><\/th><th>二进制 <span class=\"katex-inline\">b_2b_1b_0<\/span><\/th><th><span class=\"katex-inline\">\\lfloor k/2\\rfloor<\/span><\/th><th><span class=\"katex-inline\">g(k)<\/span><\/th><th>格雷串 <span class=\"katex-inline\">a_2a_1a_0<\/span><\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>000<\/td><td>000<\/td><td>000<\/td><td>000<\/td><\/tr><tr><td>1<\/td><td>001<\/td><td>000<\/td><td>001<\/td><td>001<\/td><\/tr><tr><td>2<\/td><td>010<\/td><td>001<\/td><td>011<\/td><td>011<\/td><\/tr><tr><td>3<\/td><td>011<\/td><td>001<\/td><td>010<\/td><td>010<\/td><\/tr><tr><td>4<\/td><td>100<\/td><td>010<\/td><td>110<\/td><td>110<\/td><\/tr><tr><td>5<\/td><td>101<\/td><td>010<\/td><td>111<\/td><td>111<\/td><\/tr><tr><td>6<\/td><td>110<\/td><td>011<\/td><td>101<\/td><td>101<\/td><\/tr><tr><td>7<\/td><td>111<\/td><td>011<\/td><td>100<\/td><td>100<\/td><\/tr><\/tbody><\/table><\/div>\n<p>反解码示例：格雷串 101。按 <span class=\"katex-inline\">b_j=a_j\\oplus a_{j+1}\\oplus a_{j+2}\\oplus\\cdots<\/span>：<span class=\"katex-inline\">b_2=a_2=1<\/span>；<span class=\"katex-inline\">b_1=a_1\\oplus a_2=0\\oplus1=1<\/span>；<span class=\"katex-inline\">b_0=a_0\\oplus a_1\\oplus a_2=1\\oplus0\\oplus1=0<\/span>。还原 <span class=\"katex-inline\">k=110_2=6<\/span>，查表一致。<\/p>\n<p>性质核验：<span class=\"katex-inline\">g(k\\oplus k&#x27;)=g(k)\\oplus g(k&#x27;)<\/span>。取 <span class=\"katex-inline\">k=2<\/span>（010）、<span class=\"katex-inline\">k&#x27;=3<\/span>（011），<span class=\"katex-inline\">k\\oplus k&#x27;=001=1<\/span>，<span class=\"katex-inline\">g(1)=001<\/span>；<span class=\"katex-inline\">g(2)\\oplus g(3)=011\\oplus010=001<\/span>，两侧相等。这条同态性质来自 <span class=\"katex-inline\">a_j<\/span> 是相邻 <span class=\"katex-inline\">b<\/span> 的异或，异或运算可分配到逐位。<\/p>\n<h2>补充推演：圈闭条件与首尾关系<\/h2>\n<p>标准反射格雷码末串是 <span class=\"katex-inline\">10\\dots0<\/span>，首串是 <span class=\"katex-inline\">00\\dots0<\/span>，二者只差最高位，所以天然成圈。书里式 (12) 给出反序关系：<span class=\"katex-inline\">\\Gamma_n^{R}=\\Gamma_n\\oplus\\overbrace{10\\dots0}^{n-1}<\/span>，即把序列反序等价于对各位前缀取反。圈的用途：编码盘回绕到起点时读数仍只翻一位；路径用途：递归分治、排序中间过程只走单程时不必首尾相邻。<\/p>\n<h2>历史注记<\/h2>\n<p>格雷码以物理学家 Frank Gray 命名，他在 Bell System Technical Journal 1934 年的论文中为兼容彩色电视的脉冲编码调制提出该编码；但同类结构出现更早：Stibitz 的美国专利 2307868（1943 年 1 月 12 日申请），Baudot 1878 年电报机上已用 <span class=\"katex-inline\">\\Gamma_5<\/span>，Schäffler 1879 年也独立设计过类似电报码。中国环谜（tiring irons）的解环状态对应格雷码：Louis Gros 1872 年在《Théorie du Baguenodier》中证明环谜状态与二进制数的对应步数关系。历史归属不改变算法结构；本书把标尺函数、递归构造与单步不变量作为分析主体。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：后半段不取反序。<\/strong> <span class=\"katex-inline\">\\Gamma_2<\/span> 写成 <span class=\"katex-inline\">00,01,10,11<\/span>，<span class=\"katex-inline\">01\\to10<\/span> 两位同变。根因：跨段处低位后缀不相同。修正：后半段必须用 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span>，使边界两侧低位一致。<\/p>\n<p><strong>案例 2：把 <span class=\"katex-inline\">g(k)<\/span> 当成 <span class=\"katex-inline\">k<\/span> 本身。<\/strong> 混淆码值与编号：格雷串 110 对应 <span class=\"katex-inline\">k=4<\/span>，不是整数 6；下游若按格雷串数值大小排序，次序错乱。修正：需要编号时用反解码 <span class=\"katex-inline\">g^{[-1]}<\/span> 还原 <span class=\"katex-inline\">k<\/span>。<\/p>\n<p><strong>案例 3：异或公式套用到三进制分量。<\/strong> 分量取 0,1,2 时没有位级异或定义；硬套 <span class=\"katex-inline\">a_j=b_j\\oplus b_{j+1}<\/span> 会产生取值 3 之外的结果。多值情形走 c04 的混合进制反射规则。<\/p>\n<p><strong>案例 4：忽略圈与路的差别。<\/strong> 应用要求首尾相邻（编码盘回绕）时选了一条末位不邻首的 Gray path，回绕边界出现多位跳变。选码前先确认是否需要圈闭。<\/p>\n<p><strong>案例 5：把序列反序与位反序混为一谈。<\/strong> <span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 是整列顺序反过来；位反序是把每个串的左右位颠倒。二者是不同操作，式 (12) 说的是序列反序可由前缀取反实现，不是逐位镜像。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n<strong>卡住位置 1：递归展开不知道后半段为什么反序。<\/strong> 补步骤：画 <span class=\"katex-inline\">\\Gamma_2<\/span>：前半 00,01，后半若同序是 10,11，边界 01→10 翻两位；反序后后半 11,10，边界 01→11 只翻最高位。反序就是为了让边界两侧低位相同。\n<\/li><li>\n<strong>卡住位置 2：<span class=\"katex-inline\">a_j=b_j\\oplus b_{j+1}<\/span> 不会代。<\/strong> 补步骤：从右往左逐位，<span class=\"katex-inline\">a_0=b_0\\oplus b_1<\/span>，<span class=\"katex-inline\">a_1=b_1\\oplus b_2<\/span>，<span class=\"katex-inline\">a_2=b_2\\oplus0<\/span>（高位补 0）。拿 <span class=\"katex-inline\">k=6=110_2<\/span> 练：<span class=\"katex-inline\">a_0=0\\oplus1=1<\/span>，<span class=\"katex-inline\">a_1=1\\oplus1=0<\/span>，<span class=\"katex-inline\">a_2=1\\oplus0=1<\/span>，得 101。\n<\/li><li>\n<strong>卡住位置 3：单步翻转证明看不懂末尾连续 1。<\/strong> 补步骤：类比十进制 <span class=\"katex-inline\">019+1=020<\/span>，个位 9 归 0、十位 1 变 2；二进制末尾连续 1 就是这些归 0 的位，它们连同邻位一起翻，异或后低位 <span class=\"katex-inline\">a_j<\/span> 不变，只有最左那个归 0 位对应的 <span class=\"katex-inline\">a_j<\/span> 改变。\n<\/li><li>\n<strong>卡住位置 4：反解码算不对。<\/strong> 补步骤：<span class=\"katex-inline\">b_{n-1}=a_{n-1}<\/span>，向左每步 <span class=\"katex-inline\">b_j=a_j\\oplus b_{j+1}<\/span>（等价于从高位往低位逐个异或累加）；用查表结果反向验证一次。\n<\/ul>\n<h2>算例三：<span class=\"katex-inline\">n=4<\/span> 序列边界与分量频次<\/h2>\n<p>由 <span class=\"katex-inline\">\\Gamma_3=000,001,011,010,110,111,101,100<\/span>，<span class=\"katex-inline\">\\Gamma_4<\/span> 前半段补 0：<span class=\"katex-inline\">0000,0001,0011,0010,0110,0111,0101,0100<\/span>；后半段为 <span class=\"katex-inline\">1\\Gamma_3^{R}<\/span>，<span class=\"katex-inline\">\\Gamma_3^{R}=100,101,111,110,010,011,001,000<\/span>，补 1 得 <span class=\"katex-inline\">1100,1101,1111,1110,1010,1011,1001,1000<\/span>。<\/p>\n<p>跨段衔接：前半末 <span class=\"katex-inline\">0100<\/span>，后半首 <span class=\"katex-inline\">1100<\/span>，只翻第 3 位。各分量翻转次数：第 0 位 8 次，第 1 位 4 次，第 2 位 2 次，第 3 位 1 次；低位翻转频次高，与标尺函数的分布一致。16 个码覆盖全部四位串，无重复。<\/p>\n<h2>补充推演：格雷码位与 Walsh 函数指数<\/h2>\n<p>书里 §7.2.1.1 把 Walsh 函数 <span class=\"katex-inline\">w_k(x)<\/span> 分解为 Rademacher 函数 <span class=\"katex-inline\">r_j(x)<\/span> 的乘积，指数正是格雷码 <span class=\"katex-inline\">g(k)<\/span> 的各位：<span class=\"katex-inline\">w_k(x)=\\prod r_j(x)^{a_j}<\/span>，其中 <span class=\"katex-inline\">(a_{n-1}\\dots a_0)=g(k)<\/span>。这条联系的用途是：格雷码把整数 <span class=\"katex-inline\">k<\/span> 映射到位串后，位串直接充当函数乘积的指数向量；逐位翻转一位，对应乘积里换一个 Rademacher 因子。Walsh 函数的正交乘积公式 <span class=\"katex-inline\">w_k(x)w_{k&#x27;}(x)=w_{k\\oplus k&#x27;}(x)<\/span> 也与格雷码的异或同态一致。读这一段时把 <span class=\"katex-inline\">g(k)<\/span> 当成「整数到指数向量的转换器」，就和子集、正交函数分解接上了。<\/p>\n<h2>增量更新实例：子集求和的符号跟踪<\/h2>\n<p>考虑和式 <span class=\"katex-inline\">X_\\varnothing-X_{\\{0\\}}-X_{\\{1\\}}+X_{\\{0,1\\}}-\\cdots<\/span>，每项符号由子集大小（位串中 1 的个数）的奇偶决定。若按计数次序遍历，子集 <span class=\"katex-inline\">\\{0,1\\}\\to\\{2\\}<\/span> 丢掉两个元素、加一个元素，符号与差分项都要重算；按格雷码次序，相邻子集只差一个元素在集合内或外，集合大小变 1，奇偶性翻转一次，符号跟着翻一次，被加数只变一项。这就是低改动次序在 inclusion-exclusion 计算中的实际收益：单步改动局部化，旧状态的大部分结果可复用。<\/p>\n<h2>对照清单：标准反射格雷码的各类变体<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>变体<\/th><th>额外约束<\/th><th>与标准反射码的差别<\/th><\/tr><\/thead><tbody><tr><td>互补格雷码<\/td><td>每个串与其补串直径相对<\/td><td>只在位数为偶数时可构造，序列仍单步翻转<\/td><\/tr><tr><td>平衡格雷码<\/td><td>各坐标轨道翻转次数尽量相等<\/td><td>标准码低位翻转远多于高位；平衡码用 Theorem D 扩位<\/td><\/tr><tr><td>长游程格雷码<\/td><td>同一坐标两次出现的间隔尽量长<\/td><td>标准码最低位游程为 2；长游程码牺牲构造简单性换测量精度<\/td><\/tr><tr><td>单调格雷路<\/td><td>串的重量（1 的个数）单调不减<\/td><td>是路径不是圈；Savage–Winkler 递归构造<\/td><\/tr><tr><td>trend-free 码<\/td><td>各列黑白重量重心居中<\/td><td>实验设计场景使用，八位全部平衡<\/td><\/tr><\/tbody><\/table><\/div>\n<p>清单用途：选码时先确认硬约束（单步翻转），再按应用加性质；标准反射码是基线，其余变体在立方体上另找 Hamilton 路/圈。<\/p>\n<h2>失败案例复盘（续）<\/h2>\n<p><strong>案例 6：把标尺函数用反方向。<\/strong> 翻转位编号应跟随末尾连续 0/1 的位置；若误取最高位作为翻转位，序列每步翻高位，低位长期不动，单步条件虽可能仍成立但频次分布失衡，不属于标准反射码。 <strong>案例 7：递归终止在 <span class=\"katex-inline\">\\Gamma_1<\/span> 就停。<\/strong> 层数不够时序列只覆盖部分位串；<span class=\"katex-inline\">n<\/span> 位问题必须递归到 <span class=\"katex-inline\">\\Gamma_n<\/span>，覆盖计数 <span class=\"katex-inline\">2^n<\/span> 才能结束。<\/p>\n<h2>补充推导：公式 <span class=\"katex-inline\">a_j=b_j\\oplus b_{j+1}<\/span> 的归纳核验<\/h2>\n<p>对位数 <span class=\"katex-inline\">n<\/span> 归纳。<span class=\"katex-inline\">n=1<\/span>：<span class=\"katex-inline\">k=b_0<\/span>，<span class=\"katex-inline\">a_0=b_0\\oplus0=b_0<\/span>，<span class=\"katex-inline\">g(k)=k<\/span>，成立。<\/p>\n<p>设 <span class=\"katex-inline\">n<\/span> 位时公式成立。<span class=\"katex-inline\">n+1<\/span> 位整数 <span class=\"katex-inline\">k=2^n+r<\/span>，<span class=\"katex-inline\">0\\le r&lt;2^n<\/span>，最高位 <span class=\"katex-inline\">b_n=1<\/span>。递归规则给出 <span class=\"katex-inline\">g(k)=2^n+g(2^n-1-r)<\/span>。对低位，<span class=\"katex-inline\">2^n-1-r<\/span> 是 <span class=\"katex-inline\">r<\/span> 的 <span class=\"katex-inline\">n<\/span> 位取反；按归纳假设其格雷低位已由相邻位异或给出。最高位 <span class=\"katex-inline\">a_n=b_n\\oplus0=1<\/span>，低位 <span class=\"katex-inline\">a_j=b_j\\oplus b_{j+1}<\/span> 保持不变。<span class=\"katex-inline\">k<\/span> 落在前半段（<span class=\"katex-inline\">b_n=0<\/span>）时 <span class=\"katex-inline\">g(k)=g(r)<\/span>，公式同样成立。两端覆盖后，<span class=\"katex-inline\">n+1<\/span> 位公式成立。<\/p>\n<p>反解码 <span class=\"katex-inline\">b_j=a_j\\oplus a_{j+1}\\oplus\\cdots<\/span> 的依据：把 <span class=\"katex-inline\">a_j=b_j\\oplus b_{j+1}<\/span> 从高位向低位累加异或，相邻 <span class=\"katex-inline\">b<\/span> 成对抵消，剩 <span class=\"katex-inline\">b_j<\/span>；高位以后 <span class=\"katex-inline\">a=0<\/span>，累加有限。<\/p>\n<h2>Algorithm G 的奇偶位辅助<\/h2>\n<p>书里 Algorithm G 从全 0 出发生成二元 <span class=\"katex-inline\">n<\/span> 元组，维护奇偶位 <span class=\"katex-inline\">a_\\infty=a_{n-1}\\oplus\\cdots\\oplus a_1\\oplus a_0<\/span>。G3 翻转 <span class=\"katex-inline\">a_\\infty<\/span>，G4 选坐标 <span class=\"katex-inline\">j<\/span>：<span class=\"katex-inline\">a_\\infty=1<\/span> 时 <span class=\"katex-inline\">j=0<\/span>，否则取最小的 <span class=\"katex-inline\">j\\ge1<\/span> 使 <span class=\"katex-inline\">a_{j-1}=1<\/span>；G5 翻转坐标 <span class=\"katex-inline\">j<\/span>。奇偶位的用途是快速判断当前该走哪一类动作（对应中国环谜的两类移动），不必在每步重新扫描全部位。没有奇偶位，选 <span class=\"katex-inline\">j<\/span> 的查找开销上升；有了它，单步仍是一次坐标翻转。这套辅助状态与格雷码的标尺函数选择等价：翻转位置由当前状态决定，奇偶位记录当前处于递归序列的哪一侧。<\/p>\n<h2>与计数序列的成本对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>对照项<\/th><th>二进制计数<\/th><th>标准反射格雷码<\/th><\/tr><\/thead><tbody><tr><td>相邻改动位数<\/td><td>0 到 <span class=\"katex-inline\">n<\/span> 不等<\/td><td>恰好 1<\/td><\/tr><tr><td>码值与整数大小<\/td><td>单调对应<\/td><td>非单调<\/td><\/tr><tr><td>单步辅助状态<\/td><td>进位指针<\/td><td>奇偶位/标尺函数<\/td><\/tr><tr><td>编码盘适用性<\/td><td>边界多位跳变，易误读<\/td><td>边界单步，读数稳定<\/td><\/tr><tr><td>子集增量更新<\/td><td>差分需重算多位<\/td><td>只补/删一个元素<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n画出 <span class=\"katex-inline\">\\Gamma_4<\/span> 前 8 个与后 8 个码，标出跨段衔接处翻的是哪一位。\n<\/li><li>\n计算 <span class=\"katex-inline\">g(10)<\/span>（四位形式）与格雷串 1110 的反解码整数。\n<\/li><li>\n证明 <span class=\"katex-inline\">g(k\\oplus k&#x27;)=g(k)\\oplus g(k&#x27;)<\/span> 对任意非负整数 <span class=\"katex-inline\">k,k&#x27;<\/span> 成立，写出逐位依据。\n<\/li><li>\n标准反射格雷码的末串与首串相差几位？把它改成 Gray path 时这个条件怎样放宽？\n<\/li><li>\n为什么说翻转位次序等于标尺函数 <span class=\"katex-inline\">\\rho(k)<\/span>？用 <span class=\"katex-inline\">n=3<\/span> 的序列对照说明。\n<\/ol><\/div><\/details>", "c04": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 生成所有元组和排列（第4卷 第2册 双语版）.pdf · p.24<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">反射二进制格雷码：递归构造、$g(k)=k\\oplus\\lfloor k/2\\rfloor$ 与单步翻转<\/a><\/span><\/div><h1>混合进制反射格雷码、子森林与树形遍历的统一视角<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch02（原书 §7.2.1.1，PDF 第 24–26 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>混合进制反射格雷码把二元反射规则推广到基数 <span class=\"katex-inline\">m_j\\ge2<\/span> 的多值分量，按累计奇偶性决定分量保留或镜像；子森林生成（Koda–Ruskey）把森林中「父结点在位则子结点才可在位」的可行子集排成每次改变一个结点状态的序列，二者共享焦点指针控制下的树形遍历机制。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>c03 的反射格雷码只处理取值 0/1 的位串。实际元组分量可能取多个值：十进制数字 0–9、三进制数字 0–2、各分量基数不同。多值分量上「相邻只差一位」不能再写成异或翻转，需要一套新的分量移动规则；同时，可行子集常常带结构约束：选了子结点必须先选父结点，普通子集枚举会混入违反约束的集合。<\/p>\n<p>两类困难的共同点是：对象空间不是平直的笛卡尔积，而是带层级依赖的结构。平直空间用计数器走遍；层级空间要在树上行走，区分「进入子结点」与「退回父结点」的动作。混合进制格雷码解决多值分量的低改动遍历，子森林算法解决树约束子集的低改动遍历，两者背后都是树形遍历与焦点指针控制。<\/p>\n<p>不用这套推广会出什么错。把二进制异或直接套到三进制分量，取值会越出 <span class=\"katex-inline\">\\{0,1,2\\}<\/span>；普通子集枚举不查父结点约束，产生悬空子结点；没有焦点指针的算法每步重新扫描全部分量找可动位置，长序列上出现长等待，达不到无环（loopless）要求。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>混合进制反射格雷映射<\/strong>：普通混合进制数<\/p>\n<div class=\"katex-block\">k=[b_{n-1},\\dots,b_0]_{m_{n-1},\\dots,m_0}=b_{n-1}m_{n-2}\\cdots m_0+\\cdots+b_1m_0+b_0<\/div>\n<p>映射到反射格雷等价量<\/p>\n<div class=\"katex-block\">\\hat g(k)=[a_{n-1},\\dots,a_0]_{m_{n-1},\\dots,m_0}.<\/div>\n<p><strong>累计值 <span class=\"katex-inline\">A_j,B_j<\/span><\/strong>：<span class=\"katex-inline\">A_j=[a_{n-1},\\dots,a_j]_{m_{n-1},\\dots,m_j}<\/span>，<span class=\"katex-inline\">B_j=[b_{n-1},\\dots,b_j]_{m_{n-1},\\dots,m_j}<\/span>，约定 <span class=\"katex-inline\">A_n=B_n=0<\/span>，递推 <span class=\"katex-inline\">A_j=m_jA_{j+1}+a_j<\/span>，<span class=\"katex-inline\">B_j=m_jB_{j+1}+b_j<\/span>。<\/p>\n<p><strong>正变换规则<\/strong>：<\/p>\n<div class=\"katex-block\">a_j=\\begin{cases}b_j,& B_{j+1}\\text{ 为偶}\\\\ m_j-1-b_j,& B_{j+1}\\text{ 为奇}\\end{cases}<\/div>\n<p><strong>反变换<\/strong>：<\/p>\n<div class=\"katex-block\">b_j=\\begin{cases}a_j,& a_{j+1}+a_{j+2}+\\cdots\\text{ 为偶}\\\\ m_j-1-a_j,& a_{j+1}+a_{j+2}+\\cdots\\text{ 为奇}\\end{cases}<\/div>\n<p><strong>反射型与模数型<\/strong>：反射格雷十进制中分量先从 0 升到 9 再降回 0；模数格雷十进制分量始终加 1 模 10，从 9 绕回 0。两种码每次只动一个分量，动哪个分量由基数标尺函数 <span class=\"katex-inline\">\\rho_{10}(k)<\/span>（整除 <span class=\"katex-inline\">k<\/span> 的最大 10 的幂指数）决定。<\/p>\n<p><strong>主子森林（principal subforest）<\/strong>：森林结点集合 <span class=\"katex-inline\">S<\/span> 满足：若 <span class=\"katex-inline\">x\\in S<\/span> 且 <span class=\"katex-inline\">x<\/span> 不是根，则 <span class=\"katex-inline\">x<\/span> 的父结点也在 <span class=\"katex-inline\">S<\/span> 中。不分支的退化森林（每条链一棵树）的主子森林等价于混合进制元组。<\/p>\n<p><strong>焦点指针与当前边缘<\/strong>：无环生成算法维护焦点指针数组标记活跃/被动分量；子森林算法另用双向链表维护「当前边缘（current fringe）」，边缘包含当前子森林全部结点及其最左根、最右根方向指针。<\/p>\n<p><strong>正例<\/strong>：基数全为 3 时，<span class=\"katex-inline\">\\hat g((10010211012)_3)=(12210211010)_3<\/span>，且反变换回到原串（基数全奇时正反规则形式相同）。 <strong>反例<\/strong>：森林子集选了子结点而父结点不在集合内，违反主子森林定义；焦点指针越界指向被动块外侧，会选中不可动分量。<\/p>\n<h2>原理推导<\/h2>\n<ol><li>\n<strong>反射规则的归纳依据<\/strong>：对分量下标从左到右（高位到低位）归纳。<span class=\"katex-inline\">B_{j+1}<\/span> 记录高位部分的累计值：偶段时低位分量正向走，奇段时低位分量往返镜像。高位奇偶决定当前段方向，段内 <span class=\"katex-inline\">b_j<\/span> 到顶后方向翻转，这与二进制反射构造中后半段反序同构。\n<\/li><li>\n<strong>单分量移动<\/strong>：相邻两个混合进制数加 1，只有最低位连续到顶的分量发生归位；反射映射下，对应格雷码只改变这一个分量，其余分量由累计奇偶保持。基数 <span class=\"katex-inline\">m_j<\/span> 上分量移动为 <span class=\"katex-inline\">\\pm1<\/span>，到端点后折返（反射型）或绕回（模数型）。\n<\/li><li>\n<strong>子森林与元组的对应<\/strong>：退化森林每条链是一棵树，第 <span class=\"katex-inline\">j<\/span> 条链选 <span class=\"katex-inline\">x_j<\/span> 个结点，<span class=\"katex-inline\">0\\le x_j&lt;m_j<\/span>，全部主子森林与该混合进制元组一一对应；Koda–Ruskey 算法在退化森林上产生的次序就是基数 <span class=\"katex-inline\">(m_1,\\dots,m_n)<\/span> 的反射格雷码。\n<\/li><li>\n<strong>树形遍历不变量<\/strong>：子森林算法每次改一个结点在位状态。插入结点时把其子结点挂到边缘右侧；删除结点时把其子结点从边缘移除；焦点指针始终指向边缘上最右活跃结点。边缘生长与收缩对应树上的下行与回退。\n<\/li><li>\n<strong>无环性<\/strong>：焦点指针免去每步从头扫描；两次访问之间的操作数有界，这是 loopless 算法的定义要求：相邻访问之间执行的操作数预先有界，不存在长等待。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：分量基数 <span class=\"katex-inline\">m_j\\ge2<\/span>；对象可按层级依赖组织；下游需要相邻单分量/单结点改动。\n<\/li><li>\n边界一：基数为 1 的分量恒为常数，不参与移动；混合进制反射规则在 <span class=\"katex-inline\">m_j<\/span> 全奇时正反变换形式合一，偶数基数时镜像方向不同。\n<\/li><li>\n边界二：子森林约束是「父在子先」；其他结构约束（如兄弟次序、连通块）要换相应的生成器，焦点指针框架可沿用。\n<\/li><li>\n边界三：无环算法需要额外指针与方向数组，存储高于朴素扫描；当 <span class=\"katex-inline\">n<\/span> 很小、扫描代价可忽略时，朴素算法更简单。\n<\/li><li>\n失败案例：把反射型当成模数型实现，分量到 9 后直接归 0 而不是折返，序列仍覆盖全部取值但相邻改动规则不同，某些坐标的移动方向不符合反射约定。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>混合进制格雷码 vs 二进制格雷码<\/strong>：二进制用异或逐位处理；多值分量用累计奇偶决定保留或镜像，移动单位是 <span class=\"katex-inline\">\\pm1<\/span> 而非位翻转。\n<\/li><li>\n<strong>反射型 vs 模数型<\/strong>：反射型分量往返升降，模数型模基数绕回；二者都是低改动码，分量到端点后的衔接方式不同。\n<\/li><li>\n<strong>子森林 vs 普通子集<\/strong>：普通子集任意选结点；子森林带父结点约束，数量少于 <span class=\"katex-inline\">2^n<\/span>，退化森林情形退化为混合进制元组。\n<\/li><li>\n<strong>树形生成 vs 嵌套循环<\/strong>：嵌套循环遍历平直笛卡尔积；树形生成沿依赖边进入与回退，焦点指针/边缘链表记录当前路径。两者都不漏不重，对象空间结构不同。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 混合进制计数与权重展开；c03 反射递归与单步翻转。后继：c06 邻位换位排列的逆序表次序等价于基数 <span class=\"katex-inline\">(1,2,\\dots,n)<\/span> 的反射格雷码；c07 一般排列生成器在隐式树上前序遍历，焦点指针与控制表进位是同一树形视角的两种实现；移位寄存器/de Bruijn 循环是元组生成的另一条非格雷路线，覆盖全部 <span class=\"katex-inline\">n<\/span> 窗口而非低改动遍历。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（混合进制反射格雷码、子森林与树形遍历的统一视角）<\/summary><div class=\"depth-body\"><h1>c04 深度推导：混合进制反射规则逐位计算、子森林边缘推演与无环不变量<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把混合进制格雷码与子森林生成往下追五层：<\/p>\n<ol><li>\n<strong>混合进制计数<\/strong>：先有 c02 的权重展开与分量上限 <span class=\"katex-inline\">0\\le a_j&lt;m_j<\/span>，格雷映射是在同一套分量空间上换次序。\n<\/li><li>\n<strong>二进制反射经验<\/strong>：c03 的递归反射、跨段反序衔接是多值推广的原型；多值情形把「位翻转」换成「分量 <span class=\"katex-inline\">\\pm1<\/span> 移动」。\n<\/li><li>\n<strong>累计奇偶判定<\/strong>：多值分量没有异或可算，改用高位累计值 <span class=\"katex-inline\">B_{j+1}<\/span> 的奇偶决定当前段方向（正向或镜像）；这是反射规则落到公式上的关键机制。\n<\/li><li>\n<strong>层级依赖约束<\/strong>：子森林把对象从独立分量换成带父子关系的结点集合；约束「父在子先」把平直空间改成树空间。\n<\/li><li>\n<strong>树形遍历控制<\/strong>：边缘链表与焦点指针记录当前路径上的活跃结点，下行插入、上行删除；无环性由指针直接定位可动结点保证。\n<\/ol>\n<p>依赖链方向：混合进制计数 → 二进制反射原型 → 累计奇偶规则 → 层级依赖约束 → 边缘遍历控制。<\/p>\n<h2>正向推导：反射规则怎样从累计奇偶推出来<\/h2>\n<p>下面逐步推导，每步注明依据。<\/p>\n<p><strong>步骤 1：记普通混合进制数。<\/strong> <span class=\"katex-inline\">k=[b_{n-1},\\dots,b_0]_{m_{n-1},\\dots,m_0}<\/span>，权重递推 <span class=\"katex-inline\">B_j=m_jB_{j+1}+b_j<\/span>，<span class=\"katex-inline\">B_n=0<\/span>。<span class=\"katex-inline\">B_{j+1}<\/span> 是高位部分（比 <span class=\"katex-inline\">j<\/span> 更高的分量）组成的整数。<\/p>\n<p><strong>步骤 2：分段方向。<\/strong> 反射构造在二进制里靠后半段反序；推广到多值，每一段低位分量的走向由所在段方向决定：高位累计值为偶，段内正向走；为奇，段内镜像走，分量取值 <span class=\"katex-inline\">m_j-1-b_j<\/span>。<\/p>\n<p><strong>步骤 3：写正变换。<\/strong><\/p>\n<div class=\"katex-block\">a_j=\\begin{cases}b_j,& B_{j+1}\\text{ 偶}\\\\ m_j-1-b_j,& B_{j+1}\\text{ 奇}\\end{cases}<\/div>\n<p>依据：镜像段内 <span class=\"katex-inline\">0<\/span> 对应 <span class=\"katex-inline\">m_j-1<\/span>，<span class=\"katex-inline\">m_j-1<\/span> 对应 <span class=\"katex-inline\">0<\/span>，线性反射就是 <span class=\"katex-inline\">m_j-1-b_j<\/span>。<\/p>\n<p><strong>步骤 4：反变换。<\/strong> 从格雷串还原普通数：低位以上的格雷分量之和 <span class=\"katex-inline\">a_{j+1}+a_{j+2}+\\cdots<\/span> 的奇偶对应原段方向；偶则 <span class=\"katex-inline\">b_j=a_j<\/span>，奇则 <span class=\"katex-inline\">b_j=m_j-1-a_j<\/span>。<\/p>\n<div class=\"katex-block\">b_j=\\begin{cases}a_j,& a_{j+1}+a_{j+2}+\\cdots\\text{ 偶}\\\\ m_j-1-a_j,& a_{j+1}+a_{j+2}+\\cdots\\text{ 奇}\\end{cases}<\/div>\n<p>依据：镜像变换对合，<span class=\"katex-inline\">m_j-1-(m_j-1-b_j)=b_j<\/span>，再做一次镜像回到原值。<\/p>\n<p><strong>步骤 5：单分量移动核验。<\/strong> 普通数加 1 时，末尾连续到顶的分量归位，其余高位不变；反射映射只重写发生归位的那个分量段方向，格雷码对应位置移动 <span class=\"katex-inline\">\\pm1<\/span>，其余分量保持。相邻格雷元组差一个分量，满足低改动要求。<\/p>\n<p><strong>步骤 6：退化森林对应。<\/strong> 森林由互不相交的链组成时，第 <span class=\"katex-inline\">j<\/span> 条链选结点数 <span class=\"katex-inline\">x_j<\/span>，<span class=\"katex-inline\">0\\le x_j&lt;m_j<\/span>；主子森林与元组 <span class=\"katex-inline\">(x_1,\\dots,x_n)<\/span> 一一对应。Koda–Ruskey 算法在这种森林上的访问次序，就是基数 <span class=\"katex-inline\">(m_1,\\dots,m_n)<\/span> 的反射格雷码，公式 (46)–(51) 直接适用。<\/p>\n<p><strong>步骤 7：一般森林的边缘不变量。<\/strong> 边缘链表含当前子森林全部结点，<span class=\"katex-inline\">l_q<\/span> 指向最左根方向、<span class=\"katex-inline\">r_p<\/span> 指向最右方向；<span class=\"katex-inline\">c_p<\/span> 记录结点最左子结点，无子女则为 0。插入 <span class=\"katex-inline\">p<\/span> 时其子结点挂到 <span class=\"katex-inline\">p<\/span> 右侧边缘；删除 <span class=\"katex-inline\">p<\/span> 时其子结点移出边缘。焦点 <span class=\"katex-inline\">f_q<\/span> 定位最右活跃结点，每步只改该结点状态。<\/p>\n<h2>数值算例一：基数 <span class=\"katex-inline\">(3,2)<\/span> 反射格雷序列<\/h2>\n<p>普通计数序列（字典序）：<span class=\"katex-inline\">(0,0),(0,1),(1,0),(1,1),(2,0),(2,1)<\/span>，共 6 个。按反射规则，高位 <span class=\"katex-inline\">a_1<\/span>（基数 3）段方向由 <span class=\"katex-inline\">B_2=0<\/span> 起算；低位基数 2。<\/p>\n<p>反射格雷走法：高位第一段正向，低位往返；高位第二段镜像，低位反向往返。序列为<\/p>\n<div class=\"katex-block\">(0,0),(0,1),(1,1),(1,0),(2,0),(2,1).<\/div>\n<p>核验相邻差异：<span class=\"katex-inline\">(0,0)\\to(0,1)<\/span> 动低位；<span class=\"katex-inline\">(0,1)\\to(1,1)<\/span> 动高位；<span class=\"katex-inline\">(1,1)\\to(1,0)<\/span> 动低位；<span class=\"katex-inline\">(1,0)\\to(2,0)<\/span> 动高位；<span class=\"katex-inline\">(2,0)\\to(2,1)<\/span> 动低位。每步只动一个分量。末串 <span class=\"katex-inline\">(2,1)<\/span> 与首串 <span class=\"katex-inline\">(0,0)<\/span> 差两个分量，这是路径不是圈；基数为 2 的二元情形首尾差一位可成圈。<\/p>\n<h2>数值算例二：三进制分量正反变换核验<\/h2>\n<p>书里给出基数全为 3 的例子：普通串 <span class=\"katex-inline\">(10010211012)_3<\/span> 的反射格雷串为 <span class=\"katex-inline\">(12210211010)_3<\/span>，且反变换回到原串。基数全奇时正、反规则形式相同。<\/p>\n<p>取一位手工核验：最右位 <span class=\"katex-inline\">b_0=2<\/span>，其高位以上无分量，累计为偶，<span class=\"katex-inline\">a_0=b_0=2<\/span>；格雷串末位是 0，说明这一位实际按镜像段处理——逐位核算时要从高位向低位累计奇偶，不能只看本位。三进制分量取值 0,1,2，镜像为 <span class=\"katex-inline\">2-b_j<\/span>：<span class=\"katex-inline\">0\\leftrightarrow2<\/span>，<span class=\"katex-inline\">1<\/span> 不动。三进制反射码相邻分量移动为 <span class=\"katex-inline\">+1<\/span> 或 <span class=\"katex-inline\">-1<\/span>，到端点 0 或 2 后折返，不出现 3 这个非法值。<\/p>\n<h2>数值算例三：七结点森林的主子森林计数<\/h2>\n<p>书里图 (52) 的七结点森林共有 33 个主子森林。计数依据：每个可行子集必须满足父结点在位约束；根结点可选可不选，选了根才能选其子女。33 这个数小于全部子集数 <span class=\"katex-inline\">2^7=128<\/span>，差值来自违反父子约束的悬空子集。<\/p>\n<p>退化对照：若森林是四条不相交链，长度对应基数 <span class=\"katex-inline\">(3,2,4,2)<\/span>，主子森林数为 <span class=\"katex-inline\">3\\times2\\times4\\times2=48<\/span>，与混合进制元组总数一致。一般森林的约束使计数不能再用简单乘积，要按树结构逐层统计；遍历算法仍沿边缘生长收缩，不依赖乘积公式。<\/p>\n<h2>补充推演：反射型与模数型十进制走法<\/h2>\n<p>三位十进制反射格雷（反射型）前几段：<span class=\"katex-inline\">000,001,\\dots,009,019,018,\\dots,011,010,020,021,\\dots,091,090,190,191,\\dots,900<\/span>。低位在 0 与 9 之间往返，高位推进时低位方向翻转。<\/p>\n<p>模数型：<span class=\"katex-inline\">000,001,\\dots,009,010,\\dots,017,018,028,029,\\dots,099,090,190,191,\\dots,900<\/span>。低位到 9 后加 1 模 10 绕回 0，不折返。两种码每次只动一个分量；动哪个分量由 <span class=\"katex-inline\">\\rho_{10}(k)<\/span>——整除 <span class=\"katex-inline\">k<\/span> 的最大 10 的幂指数——决定，各数字分量恰好出现一次。<\/p>\n<h2>无环（loopless）条件展开<\/h2>\n<p>书里定义：无环算法要求相邻两次访问之间执行的操作数预先有界，不存在长时间等待。朴素算法每步从低位扫描到高位找可动分量，扫描长度 <span class=\"katex-inline\">O(n)<\/span>，最坏单步等待随 <span class=\"katex-inline\">n<\/span> 增长。焦点指针做法：指针数组直接记下当前活跃分量位置，推进时更新指针指向右侧被动块边界，可动位置一步定位。子森林算法再加边缘双向链表，插入删除都是边缘局部操作。代价口径：访问之间操作数常数级，与空间大小无关；存储为 <span class=\"katex-inline\">O(n)<\/span> 指针与链表域。<\/p>\n<h2>对照清单<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>对照项<\/th><th>计数字典序<\/th><th>二元反射格雷<\/th><th>混合进制反射格雷<\/th><th>子森林格雷<\/th><\/tr><\/thead><tbody><tr><td>对象<\/td><td>元组<\/td><td>位串<\/td><td>多值元组<\/td><td>带父约束子集<\/td><\/tr><tr><td>改动单位<\/td><td>可能多位<\/td><td>一位翻转<\/td><td>一个分量 <span class=\"katex-inline\">\\pm1<\/span><\/td><td>一个结点状态<\/td><\/tr><tr><td>方向机制<\/td><td>进位<\/td><td>递归反序<\/td><td>累计奇偶镜像<\/td><td>边缘生长收缩<\/td><\/tr><tr><td>辅助状态<\/td><td>进位指针<\/td><td>奇偶位/标尺函数<\/td><td>焦点指针+方向位<\/td><td>焦点+边缘链表<\/td><\/tr><tr><td>空间计数<\/td><td><span class=\"katex-inline\">\\prod m_j<\/span><\/td><td><span class=\"katex-inline\">2^n<\/span><\/td><td><span class=\"katex-inline\">\\prod m_j<\/span><\/td><td>按树结构统计<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：异或公式套到三进制。<\/strong> 分量取 0,1,2，<span class=\"katex-inline\">b_j\\oplus b_{j+1}<\/span> 没有三进制定义，硬算会产出越界值。修正：多值分量用累计奇偶与镜像 <span class=\"katex-inline\">m_j-1-b_j<\/span>。<\/p>\n<p><strong>案例 2：反射型按绕回实现。<\/strong> 分量到 9 后直接归 0 再加，序列仍覆盖全部取值，但段内方向变成模数型；若下游依赖往返对称性（如某些测量编码），性质不符。两种类型要在算法约定里分清。<\/p>\n<p><strong>案例 3：子森林允许悬空子结点。<\/strong> 选入子结点而父结点不在集合，子集违反定义；计数从 33 膨胀到 128，遍历对象不再是主子森林。修正：插入子结点前先确认父结点在边缘内。<\/p>\n<p><strong>案例 4：每步重扫全部分量。<\/strong> 去掉焦点指针，可动位置靠线性查找，长序列上出现 <span class=\"katex-inline\">O(n)<\/span> 等待；这不是无环算法，只是朴素格雷遍历。修正：指针维护活跃边界。<\/p>\n<p><strong>案例 5：累计奇偶算错方向。<\/strong> <span class=\"katex-inline\">B_{j+1}<\/span> 应包含高位全部分量，只看紧邻高位会把段方向判反，镜像与正向错位，相邻分量移动方向出错。修正：按权重递推累计，不跳层。<\/p>\n<p><strong>案例 6：把退化森林的乘积计数套到一般树。<\/strong> 一般树有分支共享父结点，选父结点后子女之间不是独立链，主子森林数不能写成各链长之积；硬套乘积会高估可行子集数量。修正：按树逐层统计可行子集，遍历仍走边缘机制。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n<strong>卡住位置 1：<span class=\"katex-inline\">B_{j+1}<\/span> 不知道怎么算。<\/strong> 补步骤：从最高位起递推 <span class=\"katex-inline\">B_j=m_jB_{j+1}+b_j<\/span>；<span class=\"katex-inline\">B_{j+1}<\/span> 就是比 <span class=\"katex-inline\">j<\/span> 更高那些分量组成的整数。拿 <span class=\"katex-inline\">(m_1,m_2)=(3,2)<\/span>、<span class=\"katex-inline\">b=(1,1)<\/span> 练：<span class=\"katex-inline\">B_2=0<\/span>，<span class=\"katex-inline\">B_1=3\\cdot0+1=1<\/span>，判 <span class=\"katex-inline\">a_1<\/span> 方向用 <span class=\"katex-inline\">B_2<\/span> 偶，判 <span class=\"katex-inline\">a_2<\/span> 方向用 <span class=\"katex-inline\">B_1<\/span> 奇。\n<\/li><li>\n<strong>卡住位置 2：镜像 <span class=\"katex-inline\">m_j-1-b_j<\/span> 不会代。<\/strong> 补步骤：<span class=\"katex-inline\">m_j=3<\/span> 时 <span class=\"katex-inline\">0\\leftrightarrow2<\/span>，<span class=\"katex-inline\">1<\/span> 保留；<span class=\"katex-inline\">m_j=2<\/span> 时 <span class=\"katex-inline\">0\\leftrightarrow1<\/span>。代入后检查结果仍在 <span class=\"katex-inline\">0,\\dots,m_j-1<\/span> 内。\n<\/li><li>\n<strong>卡住位置 3：子森林边缘链表看不懂。<\/strong> 补步骤：把当前选中结点排成一条双向链，最左根在左、最右根在右；选新结点就接到链右侧，删结点就把其子女从链上摘掉；指针记链上活跃位置。\n<\/li><li>\n<strong>卡住位置 4：退化森林与一般森林分不清。<\/strong> 补步骤：每条链一棵树时，选结点数就是链长方向的分量，退化成元组；一般树有分支，子女挂在父结点下，不能按独立链计数。\n<\/li><li>\n<strong>卡住位置 5：方向位与焦点指针两个辅助数组分不清。<\/strong> 补步骤：方向位 <span class=\"katex-inline\">o_j<\/span> 记当前分量在段内是上升还是下降，到端点后翻转；焦点指针 <span class=\"katex-inline\">f_j<\/span> 记活跃分量边界，免去扫描。子森林算法里方向机制换成边缘链表的插入删除，指针职责仍是定位可动结点。\n<\/ul>\n<h2>算法 K 逐步推演：单结点森林与两链森林<\/h2>\n<p>先看最简单情形：森林只有一个孤立根结点 <span class=\"katex-inline\">p<\/span>。<\/p>\n<ol><li>\n<strong>K1 初始化<\/strong>：<span class=\"katex-inline\">a_p\\leftarrow0<\/span>，焦点 <span class=\"katex-inline\">f_j\\leftarrow j<\/span>；边缘只有根结点，<span class=\"katex-inline\">l_0\\leftarrow n<\/span>，<span class=\"katex-inline\">r_0\\leftarrow c_0<\/span>。初始子森林为空。\n<\/li><li>\n<strong>K2 访问<\/strong>：访问空子集 <span class=\"katex-inline\">(a_p=0)<\/span>。\n<\/li><li>\n<strong>K3 选 <span class=\"katex-inline\">p<\/span><\/strong>：<span class=\"katex-inline\">q\\leftarrow l_0<\/span>，<span class=\"katex-inline\">p\\leftarrow f_q<\/span>，取边缘最右活跃结点；<span class=\"katex-inline\">f_q\\leftarrow q<\/span> 激活其右侧全部结点。\n<\/li><li>\n<strong>K4 检查<\/strong>：<span class=\"katex-inline\">a_p=0<\/span>，转 K6。\n<\/li><li>\n<strong>K6 删子女<\/strong>：<span class=\"katex-inline\">a_p\\leftarrow0<\/span>；<span class=\"katex-inline\">c_p=0<\/span>（无子女），无需摘边缘。\n<\/li><li>\n<strong>K7 置被动<\/strong>：<span class=\"katex-inline\">f_p\\leftarrow l_p<\/span>，<span class=\"katex-inline\">l_p\\leftarrow l_p<\/span>，回 K2。\n<\/ol>\n<p>孤立根只有两个主子森林：空集 <span class=\"katex-inline\">\\varnothing<\/span> 与 <span class=\"katex-inline\">\\{p\\}<\/span>；算法在这两个状态间切换一次，每步改 <span class=\"katex-inline\">a_p<\/span> 一位。<\/p>\n<p>再看两条不相交链，长度分别为 2 与 1（对应基数 <span class=\"katex-inline\">(2,1)<\/span>）。链一：根 <span class=\"katex-inline\">r_1<\/span>、子女 <span class=\"katex-inline\">s_1<\/span>；链二：根 <span class=\"katex-inline\">r_2<\/span>。可行子集：<span class=\"katex-inline\">\\varnothing<\/span>，<span class=\"katex-inline\">\\{r_1\\}<\/span>，<span class=\"katex-inline\">\\{r_1,s_1\\}<\/span>，<span class=\"katex-inline\">\\{r_2\\}<\/span>，<span class=\"katex-inline\">\\{r_1,r_2\\}<\/span>，<span class=\"katex-inline\">\\{r_1,s_1,r_2\\}<\/span>，共 6 个，与 <span class=\"katex-inline\">2\\times1\\times3<\/span> 方向的混合计数对照（基数按链长 +1 取）。算法沿边缘：先在链一内部往返（空→<span class=\"katex-inline\">\\{r_1\\}<\/span>→<span class=\"katex-inline\">\\{r_1,s_1\\}<\/span>），退回后进入链二挂根，再回到链一状态。插入 <span class=\"katex-inline\">s_1<\/span> 前 <span class=\"katex-inline\">r_1<\/span> 必须已在边缘；删除 <span class=\"katex-inline\">r_1<\/span> 时先摘 <span class=\"katex-inline\">s_1<\/span>。这条顺序就是链方向上的反射格雷码。<\/p>\n<h2>移位寄存器与 de Bruijn 路线对照<\/h2>\n<p>§7.2.1.1 末尾另起一条路线：反馈移位寄存器产生数字串，使每个 <span class=\"katex-inline\">n<\/span> 元组作为连续长度 <span class=\"katex-inline\">n<\/span> 的窗口恰好出现一次，形成 de Bruijn 循环。它与格雷码路线的差别要分清：<\/p>\n<ul><li>\n<strong>目标不同<\/strong>：格雷码走遍元组集合，序列中每个码是一个完整对象；de Bruijn 循环走遍的是窗口，串本身是循环序列，对象是滑过窗口的 <span class=\"katex-inline\">n<\/span> 元组。\n<\/li><li>\n<strong>改动单位不同<\/strong>：格雷码相邻对象差一位/一分量；移位寄存器每步移位加一个新数字，旧数字移出窗口，窗口内容可变化多位。\n<\/li><li>\n<strong>构造方法不同<\/strong>：格雷码靠递归反射或焦点指针；de Bruijn 循环靠反馈函数与递归协程构造，算法 R、D 分别用递归 de Bruijn 构造与倍增构造。\n<\/li><li>\n<strong>适用场景<\/strong>：格雷码服务编码盘、增量求和；de Bruijn 循环服务伪随机序列、编码定位。\n<\/ul>\n<p>两类路线都覆盖全部 <span class=\"katex-inline\">n<\/span> 元组，但「低改动遍历」与「窗口全覆盖」是两个不同约束，读章节时不要把移位寄存器输出当成格雷码。<\/p>\n<h2>复杂度与适用边界补充<\/h2>\n<p>混合进制反射格雷码的访问次数等于元组总数 <span class=\"katex-inline\">\\prod m_j<\/span>；无环实现的单步操作数有界，指针与方向数组存储 <span class=\"katex-inline\">O(n)<\/span>。子森林算法访问次数等于可行主子森林数，该数按树结构统计，不能写成分量乘积；边缘链表域每结点两个指针，加子女指针数组。<\/p>\n<p>边界再核一遍：<span class=\"katex-inline\">m_j=1<\/span> 的分量不产生移动，对应链长为 0；森林结点编号按后序排列，父子关系表 <span class=\"katex-inline\">c_p<\/span>（最左子女）与兄弟链 <span class=\"katex-inline\">r_p,l_q<\/span> 在 K1 前建好。若森林存在环或父子关系未定义，子森林约束无从判定，算法前提不成立。<\/p>\n<h2>历史脉络补充<\/h2>\n<p>反射格雷码的多值推广在电报与编码实践中早有雏形；Koda 与 Ruskey 的子森林算法发表于 J. Algorithms 15 (1993), 324–340，把无环反射生成从元组空间推广到森林子集。书里把这条推广放在 Algorithm H（无环混合进制反射格雷生成）之后，作为树形约束情形的延伸：Algorithm H 用焦点指针与方向位分量移动，Algorithm K 在此基础上加边缘链表处理父子依赖。读的时候先掌握 H 的分量反射，再看 K 怎样把分量换成结点。<\/p>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出基数 <span class=\"katex-inline\">(2,3)<\/span> 的反射格雷序列，逐对标明改动的分量。\n<\/li><li>\n反变换规则中，判断奇偶用的是格雷分量之和还是普通分量之和？为什么？\n<\/li><li>\n退化森林基数 <span class=\"katex-inline\">(3,2,4,2)<\/span> 的主子森林总数是多少？换成一般二叉树后这个乘积公式还成立吗？\n<\/li><li>\n无环算法对相邻访问之间的操作数有什么要求？焦点指针怎样满足这条要求？\n<\/li><li>\n反射型与模数型在分量端点 0 和 <span class=\"katex-inline\">m_j-1<\/span> 之后的动作差别是什么？\n<\/ol><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 生成所有元组和排列（第4卷 第2册 双语版）.pdf · p.44<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">混合进制 n 元组与计数算法 M：进位、字典序与对象总数<\/a><\/span><\/div><h1>字典序排列生成 Algorithm L：支点、交换与后缀反序的正确性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：ch03（原书 §7.2.1.2，PDF 第 44–45 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Algorithm L 从非降序排列出发，按字典序生成给定序列（含多重集）的全部排列：先从右往左找到最右可增大的支点 <span class=\"katex-inline\">j<\/span>，在后缀中找大于 <span class=\"katex-inline\">a_j<\/span> 的最小元素交换，再把支点后的后缀反序成最小形态；找不到支点时终止。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>排列生成最自然的次序是词典次序：像排单词一样，前半段尽量保持不变，只在必须前进时才动靠前的位置。需要回答的问题是：给定一个排列，怎样机械地构造它的「下一个」排列，既不漏掉中间任何排列，也不重复回退。<\/p>\n<p>直接的难点有三处。第一，支点找在哪：从左往右找会提前改动前缀，产生的不是后继；从右往左才能保证前缀 <span class=\"katex-inline\">a_1\\dots a_{j-1}<\/span> 保持不变。第二，交换哪个元素：后缀里比 <span class=\"katex-inline\">a_j<\/span> 大的元素可能有多个，要取其中最小的一个，否则后继次序偏大。第三，交换后后缀的形态：交换前后缀是非递增的，交换后仍非递增，必须反序成非递减，得到该前缀下最小的后缀排列。<\/p>\n<p>不用正确的后继规则会出什么错。只把 <span class=\"katex-inline\">a_j<\/span> 换成更大值而不反序后缀，后继停留在偏大形态，中间排列被跳过；支点方向找反，序列不再是字典序；多重集有重复元素时，相等元素不能互换位置，支点与交换判断必须用严格不等号。Algorithm L 把这三处钉成固定四步，对互异元素与多重集都适用。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>初始序列<\/strong>：<span class=\"katex-inline\">a_1\\le a_2\\le\\cdots\\le a_n<\/span>，辅助元素 <span class=\"katex-inline\">a_0<\/span> 约定严格小于 <span class=\"katex-inline\">a_n<\/span>。多重集示例 <span class=\"katex-inline\">\\{1,2,2,3\\}<\/span> 的字典序为 <span class=\"katex-inline\">1223,1232,1322,2123,2132,2213,2231,2312,2321,3122,3212,3221<\/span>。<\/p>\n<p><strong>L1 访问<\/strong>：访问当前排列 <span class=\"katex-inline\">a_1a_2\\cdots a_n<\/span>。<\/p>\n<p><strong>L2 找支点<\/strong>：置 <span class=\"katex-inline\">j\\leftarrow n-1<\/span>；当 <span class=\"katex-inline\">a_j\\ge a_{j+1}<\/span> 时 <span class=\"katex-inline\">j<\/span> 减 1；若 <span class=\"katex-inline\">j=0<\/span> 终止。<span class=\"katex-inline\">j<\/span> 是满足「已访问完所有以 <span class=\"katex-inline\">a_1\\dots a_j<\/span> 为前缀的排列」的最右下标，下一个排列要增大的正是 <span class=\"katex-inline\">a_j<\/span>。<\/p>\n<p><strong>L3 增大 <span class=\"katex-inline\">a_j<\/span><\/strong>：置 <span class=\"katex-inline\">l\\leftarrow n<\/span>；当 <span class=\"katex-inline\">a_j\\ge a_l<\/span> 时 <span class=\"katex-inline\">l<\/span> 减 1；然后交换 <span class=\"katex-inline\">a_j\\leftrightarrow a_l<\/span>。后缀非递增，<span class=\"katex-inline\">a_l<\/span> 是后缀中大于 <span class=\"katex-inline\">a_j<\/span> 的最右元素，也就是大于 <span class=\"katex-inline\">a_j<\/span> 的最小元素。<\/p>\n<p><strong>L4 反序后缀<\/strong>：置 <span class=\"katex-inline\">k\\leftarrow j+1<\/span>，<span class=\"katex-inline\">l\\leftarrow n<\/span>；当 <span class=\"katex-inline\">k&lt;l<\/span> 时交换 <span class=\"katex-inline\">a_k\\leftrightarrow a_l<\/span>，<span class=\"katex-inline\">k<\/span> 加 1，<span class=\"katex-inline\">l<\/span> 减 1；回 L1。<\/p>\n<p><strong>字典序后继三步通则<\/strong>：(1) 找最大的可增大支点；(2) 用最小可行增量增大该位；(3) 把后缀重排成字典序最小形态。Algorithm L 是这条通则在排列上的实例，Algorithm M 在元组上的计数后继是同一通则的另一实例。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">1234<\/span> 的后继 <span class=\"katex-inline\">1243<\/span>；<span class=\"katex-inline\">1243<\/span> 的后继 <span class=\"katex-inline\">1324<\/span>。 <strong>反例<\/strong>：<span class=\"katex-inline\">31254<\/span> 这类非序列初始输入不能直接套用，算法约定起点为非降序；相等元素之间交换不产生新排列，判断必须严格。<\/p>\n<h2>原理推导<\/h2>\n<p>下面逐步证明 Algorithm L 产生的恰是字典序后继，且走遍全部排列。<\/p>\n<ol><li>\n<strong>后缀结构<\/strong>：进入 L2 时，从右端起连续满足 <span class=\"katex-inline\">a_j\\ge a_{j+1}<\/span> 的段是非递增后缀。找到的 <span class=\"katex-inline\">j<\/span> 使 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span>，后缀 <span class=\"katex-inline\">a_{j+1}\\dots a_n<\/span> 非递增。\n<\/li><li>\n<strong>支点唯一性<\/strong>：若存在更小的 <span class=\"katex-inline\">j&#x27;&gt;j<\/span> 可增大，则 <span class=\"katex-inline\">a_{j&#x27;}&lt;a_{j&#x27;+1}<\/span>，与后缀非递增矛盾；所以 <span class=\"katex-inline\">j<\/span> 是最右可增支点，前缀 <span class=\"katex-inline\">a_1\\dots a_{j-1}<\/span> 已是该前缀下最后一个排列的前缀，后继只能增大 <span class=\"katex-inline\">a_j<\/span>。\n<\/li><li>\n<strong>交换元素选择<\/strong>：后缀非递增，从右端找到的第一个大于 <span class=\"katex-inline\">a_j<\/span> 的 <span class=\"katex-inline\">a_l<\/span>，是后缀中大于 <span class=\"katex-inline\">a_j<\/span> 的最小元素；用它替换 <span class=\"katex-inline\">a_j<\/span>，前缀增量最小，符合字典序先改最小位的要求。交换后后缀仍非递增：<span class=\"katex-inline\">a_{j+1}\\ge\\cdots\\ge a_{l-1}\\ge a_l&gt;a_j\\ge a_{l+1}\\ge\\cdots\\ge a_n<\/span>，新值 <span class=\"katex-inline\">a_l<\/span> 落入后保持递减。\n<\/li><li>\n<strong>后缀最小化<\/strong>：该前缀下最小的后缀是把后缀反序成非递减。L4 双向对调完成反序；反序后后缀非递增变非递减，得到以新前缀开头的第一个排列。\n<\/li><li>\n<strong>覆盖性<\/strong>：从最小排列出发，每步得到严格后继；字典序是全序，有限集合上严格后继链从最小元走到最大元，中间无间断，全部 <span class=\"katex-inline\">n!<\/span>（多重集为多项式系数）个排列各出现一次。走到最大排列时 L2 找不到 <span class=\"katex-inline\">j<\/span>，终止。\n<\/li><li>\n<strong>复杂度口径<\/strong>：互异元素时，<span class=\"katex-inline\">a_{n-1}&lt;a_n<\/span> 的排列占一半，此时 <span class=\"katex-inline\">j=n-1<\/span>，L2 一步到位；<span class=\"katex-inline\">j&lt;n-1<\/span> 的概率随位置下降。L4 反序交换次数为 <span class=\"katex-inline\">\\lfloor(n-j)/2\\rfloor<\/span>；书里练习 5 分析了比较次数的均值与方差。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：元素可比较；起点非降序；需要字典序次序；多重集有重复元素也适用，相等元素按稳定处理。\n<\/li><li>\n边界一：要求相邻排列只改一对相邻元素时，字典序不满足，需走 c06 邻位换位。\n<\/li><li>\n边界二：多重集中某值出现次数远多于其他值时，L2、L3 循环变慢；一般情形仍有效率，偏斜多重集要单独分析。\n<\/li><li>\n边界三：Algorithm L 生成全部排列；若只需带约束的子集，要配合前缀测试与剪枝（c07 Algorithm X）。\n<\/li><li>\n失败案例：把严格不等号写成 <span class=\"katex-inline\">\\ge<\/span> 以外的宽松判断，相等元素被当成可交换支点，产生重复排列；不反序后缀，后继偏大，跳过中间对象。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>字典序 vs 反字典序/reverse colex<\/strong>：字典序从前缀比较；reverse colex 把串从右到左反射后按字典序走。两者都是全序，Algorithm L 及其反序等价变体对应不同选择。\n<\/li><li>\n<strong>后继构造 vs 全量列出<\/strong>：Algorithm L 每次只构造下一个，不预存全表；列举式实现另存全部排列，存储 <span class=\"katex-inline\">\\Theta(n!)<\/span>。\n<\/li><li>\n<strong>排列后继 vs 元组计数后继<\/strong>：元组加 1 是低位进位；排列后继要找支点、换最小元素、反序后缀，因为分量互异且不能重复计数。\n<\/li><li>\n<strong>L 的交换 vs 邻位交换<\/strong>：L3 交换的 <span class=\"katex-inline\">a_j<\/span> 与 <span class=\"katex-inline\">a_l<\/span> 不一定相邻；邻位换位算法每步只换相邻一对，改动单位更小但次序不是字典序。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 混合进制计数的后继通则；排序与不等号比较。后继：c06 邻位换位从另一次序走遍同一排列空间；c07 把 L 作为一般生成器 Algorithm G 的一个特例（reverse colex 参数选择）；c08 比较两类次序的单步代价与适用场景。历史上该算法可追溯到 14 世纪印度 Nārāyaṇa Paṇḍita，1784 年 Hindenburg 前言中再次出现，此后被反复重新发现。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（字典序排列生成 Algorithm L：支点、交换与后缀反序的正确性）<\/summary><div class=\"depth-body\"><h1>c05 深度推导：Algorithm L 后继构造逐步证明、<span class=\"katex-inline\">n=4<\/span> 全序列手算与代价核算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把字典序排列生成往下追五层：<\/p>\n<ol><li>\n<strong>元素可比较<\/strong>：排列中的元素要能排出 <span class=\"katex-inline\">&lt;<\/span> 关系，支点判断与最小元素选择才有依据；不可比较对象先映射到可比较编号。\n<\/li><li>\n<strong>字典序全序<\/strong>：排列之间按位置逐位比较，先比第一位，相同再比第二位；全序保证「后继」概念唯一。\n<\/li><li>\n<strong>后缀非递增结构<\/strong>：当前排列在某前缀下走到最后形态时，支点右侧后缀必然非递增；这个结构是找支点、选交换元素的依据。\n<\/li><li>\n<strong>最小后缀重排<\/strong>：换入更大元素后，后缀要重置成非递减，才是新前缀下的第一个排列；反序是实现这一重排的手段。\n<\/li><li>\n<strong>有限链终止<\/strong>：从最小排列出发沿严格后继走到最大排列，找不到支点即终止；访问次数等于排列总数，作为不漏不重的校验。\n<\/ol>\n<p>依赖链方向：可比较元素 → 字典序全序 → 后缀结构 → 后缀最小化 → 有限后继链。<\/p>\n<h2>正向推导：每一步为什么这样做<\/h2>\n<p>下面逐步证明，每步注明依据的定义或结构。<\/p>\n<p><strong>步骤 1：初始状态合法。<\/strong> 起点 <span class=\"katex-inline\">a_1\\le a_2\\le\\cdots\\le a_n<\/span> 是字典序最小排列：第一位取最小可能值，后缀也取最小形态。多重集情形相同，相等元素相邻不产生次序差别。<\/p>\n<p><strong>步骤 2：找支点 <span class=\"katex-inline\">j<\/span>。<\/strong> L2 从右端 <span class=\"katex-inline\">n-1<\/span> 向左扫描，条件 <span class=\"katex-inline\">a_j\\ge a_{j+1}<\/span> 持续则退一位。停住时 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span>，而 <span class=\"katex-inline\">a_{j+1}\\ge\\cdots\\ge a_n<\/span>。依据：后缀非递增意味着该前缀下所有更小后缀排列都已走过，下一个排列必须增大 <span class=\"katex-inline\">a_j<\/span>；更靠右的位置都在递减段内，无法增大，所以 <span class=\"katex-inline\">j<\/span> 是最右可增支点。<\/p>\n<p><strong>步骤 3：选交换元素 <span class=\"katex-inline\">l<\/span>。<\/strong> 后缀非递增，从右端向左找第一个满足 <span class=\"katex-inline\">a_l&gt;a_j<\/span> 的位置。右端元素最小，最右满足条件者即后缀中大于 <span class=\"katex-inline\">a_j<\/span> 的最小元素。依据：字典序后继要求前缀增量最小，换入的元素必须是可行最小值；换入更大元素会使后继跳过若干排列。<\/p>\n<p><strong>步骤 4：交换后后缀仍递减。<\/strong> 设交换前 <span class=\"katex-inline\">a_{j+1}\\ge\\cdots\\ge a_{l-1}\\ge a_l&gt;a_j\\ge a_{l+1}\\ge\\cdots\\ge a_n<\/span>。交换 <span class=\"katex-inline\">a_j,a_l<\/span> 后，新 <span class=\"katex-inline\">a_j=a_l<\/span>；左侧 <span class=\"katex-inline\">a_{l-1}\\ge a_l<\/span>，右侧 <span class=\"katex-inline\">a_l&gt;a_j\\ge a_{l+1}<\/span>，后缀 <span class=\"katex-inline\">a_{j+1}\\dots a_n<\/span> 保持非递增。这条结构保证下一步反序能得到非递减后缀。<\/p>\n<p><strong>步骤 5：反序后缀。<\/strong> L4 双向对调：<span class=\"katex-inline\">k=j+1<\/span>，<span class=\"katex-inline\">l=n<\/span>，交换 <span class=\"katex-inline\">a_k,a_l<\/span> 后两端向中间靠拢。非递增串反序后成非递增的反向，即非递减；这是该前缀下字典序最小的后缀形态。反序而不是重新排序，因为串本来就是单调的，双向对调一次完成。<\/p>\n<p><strong>步骤 6：唯一性与覆盖。<\/strong> 字典序是全序，每个非最大排列有唯一后继；从最小元沿后继走，有限集合上不会回到已访问状态（严格增大），直到最大元。最大排列 <span class=\"katex-inline\">a_1&gt;\\cdots&gt;a_n<\/span> 时 L2 全程 <span class=\"katex-inline\">a_j\\ge a_{j+1}<\/span>，<span class=\"katex-inline\">j=0<\/span> 终止。中间无间断，全部排列各访问一次。<\/p>\n<p><strong>步骤 7：多重集适配。<\/strong> 相等元素用严格不等号判断：<span class=\"katex-inline\">a_j\\ge a_{j+1}<\/span> 包含相等情形，相等位置不构成支点；交换只在严格大于时发生。多重集排列数为多项式系数 <span class=\"katex-inline\">\\binom{n}{n_1,\\dots,n_t}=n!/(n_1!\\cdots n_t!)<\/span>，后继链同样走遍全部。<\/p>\n<h2>数值算例一：<span class=\"katex-inline\">n=4<\/span> 互异排列前半段手算<\/h2>\n<p>起点 <span class=\"katex-inline\">1234<\/span>。逐步应用 L2–L4：<\/p>\n<ol><li>\n<span class=\"katex-inline\">1234<\/span>：后缀 <span class=\"katex-inline\">34<\/span>，<span class=\"katex-inline\">j=3<\/span>；后缀大于 <span class=\"katex-inline\">3<\/span> 的最小元素是 <span class=\"katex-inline\">4<\/span>，交换得 <span class=\"katex-inline\">1243<\/span>；后缀 <span class=\"katex-inline\">43<\/span> 反序为 <span class=\"katex-inline\">34<\/span>，结果 <span class=\"katex-inline\">1243<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">1243<\/span>：<span class=\"katex-inline\">43<\/span> 递减，<span class=\"katex-inline\">j=2<\/span>（<span class=\"katex-inline\">2&lt;4<\/span>）；后缀 <span class=\"katex-inline\">43<\/span> 中大于 <span class=\"katex-inline\">2<\/span> 的最小元素是 <span class=\"katex-inline\">3<\/span>（位置 4），交换得 <span class=\"katex-inline\">1342<\/span>；后缀 <span class=\"katex-inline\">42<\/span> 反序为 <span class=\"katex-inline\">24<\/span>，结果 <span class=\"katex-inline\">1324<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">1324<\/span>：<span class=\"katex-inline\">j=3<\/span>，交换 <span class=\"katex-inline\">2,4<\/span> 得 <span class=\"katex-inline\">1342<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">1342<\/span>：<span class=\"katex-inline\">42<\/span> 递减，<span class=\"katex-inline\">j=2<\/span>（<span class=\"katex-inline\">3&lt;4<\/span>）；后缀大于 <span class=\"katex-inline\">3<\/span> 的最小元素是 <span class=\"katex-inline\">4<\/span>，交换得 <span class=\"katex-inline\">1432<\/span>；后缀 <span class=\"katex-inline\">32<\/span> 反序为 <span class=\"katex-inline\">23<\/span>，结果 <span class=\"katex-inline\">1423<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">1423<\/span>：<span class=\"katex-inline\">j=3<\/span>，交换 <span class=\"katex-inline\">2,3<\/span> 得 <span class=\"katex-inline\">1432<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">1432<\/span>：<span class=\"katex-inline\">432<\/span> 递减，<span class=\"katex-inline\">j=1<\/span>（<span class=\"katex-inline\">1&lt;4<\/span>）；后缀大于 <span class=\"katex-inline\">1<\/span> 的最小元素是 <span class=\"katex-inline\">2<\/span>（位置 4），交换得 <span class=\"katex-inline\">2431<\/span>；后缀 <span class=\"katex-inline\">431<\/span> 反序为 <span class=\"katex-inline\">134<\/span>，结果 <span class=\"katex-inline\">2134<\/span>。\n<\/ol>\n<p>前 7 个：<span class=\"katex-inline\">1234,1243,1324,1342,1423,1432,2134<\/span>。继续：<span class=\"katex-inline\">2134\\to2143\\to2314\\to2341\\to2413\\to2431\\to3124\\to\\cdots\\to4321<\/span> 终止，共 <span class=\"katex-inline\">4!=24<\/span> 个。<\/p>\n<h2>数值算例二：多重集 <span class=\"katex-inline\">\\{1,2,2,3\\}<\/span> 后继核验<\/h2>\n<p>书里字典序清单：<span class=\"katex-inline\">1223,1232,1322,2123,2132,2213,2231,2312,2321,3122,3212,3221<\/span>，共 <span class=\"katex-inline\">4!/(2!)=12<\/span> 个。<\/p>\n<p>核验 <span class=\"katex-inline\">1232<\/span> 的后继：L2 从右看，<span class=\"katex-inline\">3&gt;2<\/span>，<span class=\"katex-inline\">j=2<\/span>（<span class=\"katex-inline\">a_2=2&lt;a_3=3<\/span>）；后缀 <span class=\"katex-inline\">32<\/span> 中大于 <span class=\"katex-inline\">2<\/span> 的最小元素是 <span class=\"katex-inline\">3<\/span>（位置 3），交换得 <span class=\"katex-inline\">1322<\/span>；后缀 <span class=\"katex-inline\">2<\/span> 无需反序，后继 <span class=\"katex-inline\">1322<\/span>。核验 <span class=\"katex-inline\">1322<\/span>：后缀 <span class=\"katex-inline\">322<\/span> 递减，<span class=\"katex-inline\">j=1<\/span>（<span class=\"katex-inline\">1&lt;3<\/span>）；后缀大于 <span class=\"katex-inline\">1<\/span> 的最小元素是 <span class=\"katex-inline\">2<\/span>（最右位置 4），交换得 <span class=\"katex-inline\">2321<\/span>；后缀 <span class=\"katex-inline\">321<\/span> 反序为 <span class=\"katex-inline\">123<\/span>，结果 <span class=\"katex-inline\">2123<\/span>。相等的两个 2 不互换位置，序列无重复。<\/p>\n<h2>复杂度核算<\/h2>\n<ul><li>\n<strong>访问次数<\/strong>：<span class=\"katex-inline\">n!<\/span>（互异）或多项式系数（多重集），与排列总数相等。\n<\/li><li>\n<strong>L2 比较次数<\/strong>：互异元素时，<span class=\"katex-inline\">a_{n-1}&lt;a_n<\/span> 的排列占 <span class=\"katex-inline\">1/2<\/span>，此时 <span class=\"katex-inline\">j=n-1<\/span>，一轮即停；<span class=\"katex-inline\">j=n-2<\/span> 的概率 <span class=\"katex-inline\">1/3!<\/span> 方向上递减。支点越靠左，扫描越长，但占比越小。\n<\/li><li>\n<strong>L4 反序次数<\/strong>：<span class=\"katex-inline\">\\lfloor(n-j)/2\\rfloor<\/span> 次交换；<span class=\"katex-inline\">j<\/span> 靠近 <span class=\"katex-inline\">n<\/span> 时几乎不动后缀。\n<\/li><li>\n<strong>总代价<\/strong>：书里练习 5 要求推导比较次数的均值与方差；整体为 <span class=\"katex-inline\">O(n!)<\/span> 总操作，摊还每排列常数到线性之间，偏斜多重集除外。\n<\/li><li>\n<strong>存储<\/strong>：当前排列 <span class=\"katex-inline\">n<\/span> 个元素加若干下标，<span class=\"katex-inline\">O(n)<\/span>，与 <span class=\"katex-inline\">n!<\/span> 无关。\n<\/ul>\n<h2>补充推演：后继三步通则的跨对象复用<\/h2>\n<p>书里指出，任何组合模式的字典序后继都可走三步：找最大可增支点；用最小可行增量增大；后缀重排成最小形态。元组计数后继（Algorithm M）是同一通则：低位到顶进位等价于找支点，加 1 是最小增量，低位归 0 是后缀最小化。组合、受限子集的字典序算法后续分册沿用这套结构。掌握 L 的三步，等于掌握字典序生成的通用骨架。<\/p>\n<h2>历史脉络<\/h2>\n<p>Algorithm L 的思想见于 14 世纪印度数学家 Nārāyaṇa Paṇḍita 的著作；1784 年 C. F. Hindenburg 在 Rüdiger 著作前言中写下相同步骤；此后该算法被反复重新发现。书里在算法步骤旁括注「为什么这样做」，L2、L3 的括号说明直接对应支点与最小交换元素的依据。读历史归属时注意：算法的正确性证明与代价分析是本书主体，发明年份只作脉络参照。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：支点从左往右找。<\/strong> 找到最左可增大位置，交换反序后前缀提前变化，<span class=\"katex-inline\">1234<\/span> 会先走到 <span class=\"katex-inline\">2134<\/span> 而不是 <span class=\"katex-inline\">1243<\/span>，次序脱离字典序。修正：从右端扫描，保证前缀不变。<\/p>\n<p><strong>案例 2：交换元素不取最小。<\/strong> 后缀取到比 <span class=\"katex-inline\">a_j<\/span> 大的较大元素，如 <span class=\"katex-inline\">1342<\/span> 误换 4 而不是 3，得到 <span class=\"katex-inline\">1432<\/span> 形态，跳过 <span class=\"katex-inline\">1324<\/span>。修正：后缀非递增，从右端找第一个大于 <span class=\"katex-inline\">a_j<\/span> 的元素。<\/p>\n<p><strong>案例 3：交换后不反序后缀。<\/strong> 后缀保持递减，后继是该前缀下最大形态而非最小形态，中间排列被跳过。修正：L4 双向对调把后缀反成非递减。<\/p>\n<p><strong>案例 4：宽松不等号处理重复元素。<\/strong> 把 <span class=\"katex-inline\">a_j\\ge a_{j+1}<\/span> 写成 <span class=\"katex-inline\">a_j&gt;a_{j+1}<\/span>，相等元素被当成支点，交换两个相同值产生重复排列。修正：支点判断用 <span class=\"katex-inline\">\\ge<\/span>，交换判断用严格大于。<\/p>\n<p><strong>案例 5：起点不是非降序。<\/strong> 直接对任意排列跑 L，后继链可能从中间状态开始，漏掉前面的排列。修正：生成前先排序初始化。<\/p>\n<p><strong>案例 6：把反序当重新排序。<\/strong> 后缀本就单调，反序一次双向对调即可；若另起排序过程，代价上升且不改变结果。利用单调结构是 L4 简洁的原因。 <strong>案例 7：忽略辅助下界 <span class=\"katex-inline\">a_0<\/span>。<\/strong> 算法约定 <span class=\"katex-inline\">a_0<\/span> 严格小于 <span class=\"katex-inline\">a_n<\/span>，用于 L2 扫到首位时的终止判断；若不设这条约定，扫描越界后无法区分「首位也递增」与「下标越界」，终止条件写错。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n<strong>卡住位置 1：后缀为什么是非递增。<\/strong> 补步骤：当前排列是该前缀下最后一个排列，末尾若存在相邻上升 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span>，说明还有后继没走；能走到当前状态，右侧必然递减。从右端扫描正是在确认这个递减段。\n<\/li><li>\n<strong>卡住位置 2：为什么最右大于 <span class=\"katex-inline\">a_j<\/span> 的元素是最小的。<\/strong> 补步骤：后缀从左到右递减，所以元素越靠右越小；从右往左找第一个大于 <span class=\"katex-inline\">a_j<\/span> 的，就是右端最小的可行替换。\n<\/li><li>\n<strong>卡住位置 3：反序怎么把递减变递增。<\/strong> 补步骤：递减串 <span class=\"katex-inline\">3,2,1<\/span> 双向对调得 <span class=\"katex-inline\">1,2,3<\/span>；两端交换、向中间靠拢，一次完成反转，不用逐个排序。\n<\/li><li>\n<strong>卡住位置 4：多重集排列数怎么算。<\/strong> 补步骤：<span class=\"katex-inline\">n!<\/span> 除以各重复值阶乘；<span class=\"katex-inline\">\\{1,2,2,3\\}<\/span> 为 <span class=\"katex-inline\">4!/2!=12<\/span>，与书里清单条数一致。\n<\/ul>\n<h2>算例三：<span class=\"katex-inline\">n=3<\/span> 全部 6 个排列的后继链<\/h2>\n<p>起点 <span class=\"katex-inline\">123<\/span>，逐步推演：<\/p>\n<ol><li>\n<span class=\"katex-inline\">123<\/span>：<span class=\"katex-inline\">j=2<\/span>，交换 <span class=\"katex-inline\">2,3<\/span>，后继 <span class=\"katex-inline\">132<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">132<\/span>：<span class=\"katex-inline\">32<\/span> 递减，<span class=\"katex-inline\">j=1<\/span>（<span class=\"katex-inline\">1&lt;3<\/span>）；后缀大于 <span class=\"katex-inline\">1<\/span> 的最小元素是 <span class=\"katex-inline\">2<\/span>（位置 3），交换得 <span class=\"katex-inline\">231<\/span>；后缀 <span class=\"katex-inline\">31<\/span> 反序为 <span class=\"katex-inline\">13<\/span>，后继 <span class=\"katex-inline\">213<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">213<\/span>：<span class=\"katex-inline\">j=2<\/span>，交换 <span class=\"katex-inline\">1,3<\/span>，后继 <span class=\"katex-inline\">231<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">231<\/span>：<span class=\"katex-inline\">31<\/span> 递减，<span class=\"katex-inline\">j=1<\/span>（<span class=\"katex-inline\">2&lt;3<\/span>）；后缀大于 <span class=\"katex-inline\">2<\/span> 的最小元素是 <span class=\"katex-inline\">3<\/span>（位置 2），交换得 <span class=\"katex-inline\">321<\/span>；后缀 <span class=\"katex-inline\">21<\/span> 反序为 <span class=\"katex-inline\">12<\/span>，后继 <span class=\"katex-inline\">312<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">312<\/span>：<span class=\"katex-inline\">j=2<\/span>，交换 <span class=\"katex-inline\">1,2<\/span>，后继 <span class=\"katex-inline\">321<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">321<\/span>：全程递减，<span class=\"katex-inline\">j=0<\/span>，终止。\n<\/ol>\n<p>链：<span class=\"katex-inline\">123\\to132\\to213\\to231\\to312\\to321<\/span>，共 6 个，与 <span class=\"katex-inline\">3!=6<\/span> 相等。每一步的支点位置：<span class=\"katex-inline\">2,1,2,1,2<\/span>，交替出现；支点在 <span class=\"katex-inline\">j=1<\/span> 的两轮都要反序两位后缀，其余轮次只交换末两位。<\/p>\n<h2>算例四：带重复元素的 <span class=\"katex-inline\">\\{1,1,2\\}<\/span> 链<\/h2>\n<p>排列总数 <span class=\"katex-inline\">3!/2!=3<\/span>。字典序：<span class=\"katex-inline\">112,121,211<\/span>。<\/p>\n<ol><li>\n<span class=\"katex-inline\">112<\/span>：<span class=\"katex-inline\">j=2<\/span>，<span class=\"katex-inline\">a_2=1&lt;a_3=2<\/span>，交换两个不同值，后继 <span class=\"katex-inline\">121<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">121<\/span>：后缀 <span class=\"katex-inline\">21<\/span> 递减；<span class=\"katex-inline\">j=1<\/span> 处 <span class=\"katex-inline\">a_1=1<\/span>，<span class=\"katex-inline\">a_2=2<\/span>，可增大；后缀大于 <span class=\"katex-inline\">1<\/span> 的最小元素是 <span class=\"katex-inline\">2<\/span>（位置 2），交换得 <span class=\"katex-inline\">211<\/span>；后缀 <span class=\"katex-inline\">11<\/span> 反序不变，后继 <span class=\"katex-inline\">211<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">211<\/span>：全程递减，终止。\n<\/ol>\n<p>两个 1 始终不互相交换；L2 在相等位置 <span class=\"katex-inline\">a_1=a_2=1<\/span> 不后退成支点靠后的判断，靠的就是 <span class=\"katex-inline\">\\ge<\/span> 条件把相等归入递减段。<\/p>\n<h2>与邻位换位次序的对照展开<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>对照项<\/th><th>Algorithm L 字典序<\/th><th>Algorithm P 邻位换位<\/th><\/tr><\/thead><tbody><tr><td>相邻改动<\/td><td>L3 交换位置可远，L4 反序多对<\/td><td>每次一对相邻元素<\/td><\/tr><tr><td>辅助状态<\/td><td>仅当前排列与下标<\/td><td>逆序表 + 方向位<\/td><\/tr><tr><td>次序性质<\/td><td>字典全序<\/td><td>立方体式 Hamilton 圈<\/td><\/tr><tr><td>单步查找<\/td><td>L2 向右扫描支点<\/td><td>P4 从右检查可逆序表<\/td><\/tr><tr><td>奇偶性<\/td><td>不保证交替<\/td><td>每次邻换逆序数变 <span class=\"katex-inline\">\\pm1<\/span>，奇偶交替<\/td><\/tr><tr><td>多重集<\/td><td>支持<\/td><td>重复元素时常无 Hamilton 路<\/td><\/tr><\/tbody><\/table><\/div>\n<p>对照用途：选次序时先看下游是否需要局部更新；需要差分复用选邻位换位，需要字典归属或稳定次序选 L。两者走遍同一排列空间，覆盖数相同。<\/p>\n<h2>排名（rank）视角补充<\/h2>\n<p>书里练习 3 讨论排列排名：一个排列在生成序列中的位次（rank）是它之前访问过的排列数。对 Algorithm L，排名可按各位统计：第一位小于 <span class=\"katex-inline\">a_1<\/span> 的元素个数乘 <span class=\"katex-inline\">(n-1)!<\/span>，剩余位依次累加。排名与反排名（unrank）让生成器可以按编号直接定位排列，不必从起点逐轮推进。L 的后继机制解决「下一个是谁」，排名解决「第几个是谁」，两者互补；c07 的控制表进位本质上也是一套混合进制的排名编码。<\/p>\n<h2>代价边界再核<\/h2>\n<p>偏斜多重集：若某值占绝大多数，L2、L3 在长重复段上退而求支点，比较次数上升；书里练习 6、7 用生成函数推导一般多重集与二元多重集的平均比较次数。互异情形下 L 效率稳定，约一半排列支点在末位。顺序数组实现下，L4 反序是内存对调；若排列频繁被跳过，链表实现（Algorithm X 方向）比顺序数组更省回退开销，这一点在 c07 剪枝部分展开。<\/p>\n<h2>算法步骤与代码对照<\/h2>\n<p>L 的步骤写成可执行伪代码：<\/p>\n<pre class=\"lang-text\"><code>L1: visit(a_1...a_n)\nL2: j ← n-1\n    while j ≥ 1 and a_j ≥ a_{j+1}: j ← j-1\n    if j = 0: stop\nL3: l ← n\n    while a_j ≥ a_l: l ← l-1\n    swap(a_j, a_l)\nL4: k ← j+1; l ← n\n    while k &lt; l: swap(a_k, a_l); k ← k+1; l ← l-1\n    go L1<\/code><\/pre>\n<p>对照推演：L2 退出时 <span class=\"katex-inline\">j<\/span> 合法且 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span>；L3 退出时 <span class=\"katex-inline\">l&gt;j<\/span> 且 <span class=\"katex-inline\">a_l&gt;a_j<\/span>；L4 结束后缀非递减。三个不变量分别对应支点存在、交换合法、后缀最小。任何一步不变量被破坏（下标越界、等号方向错），后继构造就会出错。<\/p>\n<h2>正确性归纳再表述<\/h2>\n<p>对当前排列在字典序中的位次做归纳。最小排列起点正确；假设当前排列 <span class=\"katex-inline\">P<\/span> 是其前缀下最后形态，L 的三步构造出的 <span class=\"katex-inline\">Q<\/span> 满足：前缀在 <span class=\"katex-inline\">j<\/span> 处首次增大，增量为可行最小值，后缀为最小形态，因此 <span class=\"katex-inline\">Q<\/span> 是 <span class=\"katex-inline\">P<\/span> 的唯一字典后继。归纳传递到下一轮。最大排列无后继，终止条件正确。归纳链条覆盖从最小到最大的全序区间，不漏不重。<\/p>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n对排列 <span class=\"katex-inline\">31254<\/span> 求字典序后继，写出支点 <span class=\"katex-inline\">j<\/span>、交换位置 <span class=\"katex-inline\">l<\/span> 与最终结果。\n<\/li><li>\n对 <span class=\"katex-inline\">23541<\/span> 求后继；若它已是某前缀下最大后缀，说明 L2 会退到哪个位置。\n<\/li><li>\n为什么 L3 从右端找交换元素，而不是从左端？写出后缀递减结构上的依据。\n<\/li><li>\n多重集 <span class=\"katex-inline\">\\{1,1,2,3\\}<\/span> 的排列总数是多少？相等元素在算法中怎样处理？\n<\/li><li>\n反序后缀与重新排序得到同一结果，两者代价差多少？为什么后缀已经单调？\n<\/ol><\/div><\/details>", "c06": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 生成所有元组和排列（第4卷 第2册 双语版）.pdf · p.46<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">字典序排列生成 Algorithm L：支点、交换与后缀反序的正确性<\/a><\/span><\/div><h1>邻位换位 plain changes：逆序表、方向位与 Algorithm P 的均摊机制<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch03（原书 §7.2.1.2，PDF 第 46–48 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Algorithm P 用逆序表 <span class=\"katex-inline\">c_1\\dots c_n<\/span>（<span class=\"katex-inline\">0\\le c_j&lt;j<\/span>）加方向位 <span class=\"katex-inline\">o_j\\in\\{+1,-1\\}<\/span> 驱动排列生成：从右向左检查哪个 <span class=\"katex-inline\">c_j<\/span> 可改变，可行时交换排列中一对相邻元素并更新 <span class=\"katex-inline\">c_j<\/span>，不可行则翻转方向退一层；<span class=\"katex-inline\">n!-1<\/span> 次邻位交换走遍全部 <span class=\"katex-inline\">n!<\/span> 个排列，构成 Johnson–Trotter 式的邻接 Hamilton 圈。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>字典序后继一次可能交换相距很远的两个元素，还要反序整段后缀。下游若需要增量更新（判定函数依赖相邻元素对、图形界面逐帧重排、机器移动器件），每步大改要重新处理整个排列。邻位换位把每步改动压到最小：只交换一对相邻元素，逆序数改变 <span class=\"katex-inline\">\\pm1<\/span>，排列奇偶性交替。<\/p>\n<p>要解决的控制难点是：怎样决定下一步动哪一对相邻元素。直接在排列上找「还能移动的元素」需要反复扫描；书里改用逆序表作为控制状态——每个 <span class=\"katex-inline\">c_j<\/span> 记录元素 <span class=\"katex-inline\">j<\/span> 与其后面更小元素的关系，方向位记该元素正在向左还是向右移动。控制表在混合进制 <span class=\"katex-inline\">(1,2,\\dots,n)<\/span> 上反射推进，哪个系数可走由表上判定，交换位置由系数推出。<\/p>\n<p>不维护方向位会卡住：<span class=\"katex-inline\">c_j<\/span> 到上限后没有回程方向，序列在该层走尽即停；不按逆序表驱动，可移动元素的识别成本随排列长度上升。多重集有重复元素时，邻接交换图未必存在 Hamilton 路：<span class=\"katex-inline\">\\{1,1,2,2\\}<\/span> 的邻接图连通但无 Hamilton 路，邻位换位路线对重复多重集失效，要退回字典序。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>逆序表<\/strong>：排列的计数 <span class=\"katex-inline\">c_j<\/span> 定义为「排在 <span class=\"katex-inline\">j<\/span> 右边且小于 <span class=\"katex-inline\">j<\/span> 的元素个数」，约束 <span class=\"katex-inline\">0\\le c_j&lt;j<\/span>。反过来看，<span class=\"katex-inline\">c_j<\/span> 也可定义为排在 <span class=\"katex-inline\">j<\/span> 左边且大于 <span class=\"katex-inline\">j<\/span> 的个数；两套定义差一个方向，本书用右小计数。<\/p>\n<p><strong>一一对应<\/strong>：任一满足 <span class=\"katex-inline\">0\\le c_j&lt;j<\/span> 的数组对应唯一排列，反之亦然。合法逆序表总数 <span class=\"katex-inline\">\\prod_{j=1}^n j=n!<\/span>，与排列总数相等。<\/p>\n<p><strong>方向位<\/strong>：<span class=\"katex-inline\">o_j=+1<\/span> 表示 <span class=\"katex-inline\">c_j<\/span> 向增大方向移动，<span class=\"katex-inline\">o_j=-1<\/span> 向减小方向；到边界 <span class=\"katex-inline\">0<\/span> 或 <span class=\"katex-inline\">j-1<\/span> 后翻转。<\/p>\n<p><strong>Algorithm P 步骤<\/strong>（书里 P1–P7）：<\/p>\n<ul><li>\nP1 初始化：<span class=\"katex-inline\">c_j\\leftarrow0<\/span>，<span class=\"katex-inline\">o_j\\leftarrow1<\/span>（<span class=\"katex-inline\">1\\le j\\le n<\/span>）。\n<\/li><li>\nP2 访问当前排列。\n<\/li><li>\nP3 准备：<span class=\"katex-inline\">j\\leftarrow n<\/span>，<span class=\"katex-inline\">s\\leftarrow0<\/span>。\n<\/li><li>\nP4 可行判断：<span class=\"katex-inline\">g\\leftarrow c_j+o_j<\/span>；若 <span class=\"katex-inline\">g&lt;0<\/span> 转 P7；若 <span class=\"katex-inline\">g=j<\/span> 转 P6；否则转 P5。\n<\/li><li>\nP5 交换：交换 <span class=\"katex-inline\">a_{j-o_j}<\/span> 与 <span class=\"katex-inline\">a_{j-o_j+1}<\/span>；<span class=\"katex-inline\">c_j\\leftarrow g<\/span>；回 P2。\n<\/li><li>\nP6 计数：若 <span class=\"katex-inline\">j=1<\/span> 终止；否则 <span class=\"katex-inline\">s\\leftarrow s+1<\/span>。\n<\/li><li>\nP7 翻向：<span class=\"katex-inline\">o_j\\leftarrow-o_j<\/span>，<span class=\"katex-inline\">j\\leftarrow j-1<\/span>，回 P4。\n<\/ul>\n<p><strong>plain changes<\/strong>：17 世纪英国教堂敲钟传统中的排钟方法，每只钟相邻两次只交换位置；F. R. Trotter 1962 年发表第一个计算机实现。Johnson–Trotter 算法是同一类邻位换位生成的常见名称。<\/p>\n<p><strong>过渡表 Algorithm T<\/strong>：预先算出 <span class=\"katex-inline\">t[1],\\dots,t[n!-1]<\/span>，第 <span class=\"katex-inline\">k<\/span> 步交换 <span class=\"katex-inline\">a_{t[k]}<\/span> 与 <span class=\"katex-inline\">a_{t[k]+1}<\/span>；<span class=\"katex-inline\">n=4<\/span> 的表为 <span class=\"katex-inline\">(3,2,1,3,1,2,3,1,3,2,1,3,1,2,3,1,3,2,1,3,1,2,3)<\/span>。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">n=3<\/span> 序列 <span class=\"katex-inline\">123,132,312,321,231,213<\/span>，相邻均为邻位交换。 <strong>反例<\/strong>：<span class=\"katex-inline\">\\{1,1,2,2\\}<\/span> 邻接图无 Hamilton 路；<span class=\"katex-inline\">c_j<\/span> 越过 <span class=\"katex-inline\">[0,j-1]<\/span> 即非法状态。<\/p>\n<h2>原理推导<\/h2>\n<ol><li>\n<strong>逆序表与排列双射<\/strong>：从 <span class=\"katex-inline\">j=n<\/span> 到 <span class=\"katex-inline\">1<\/span>，把元素 <span class=\"katex-inline\">j<\/span> 按 <span class=\"katex-inline\">c_j<\/span> 插入当前序列的相应位置；<span class=\"katex-inline\">c_j\\in[0,j-1]<\/span> 恰好给出 <span class=\"katex-inline\">j<\/span> 个插入位置。逐位插入后得到唯一排列，反推同样唯一，双射成立。\n<\/li><li>\n<strong>邻位交换改变一个 <span class=\"katex-inline\">c_j<\/span><\/strong>：相邻两项互换，逆序总数改变 <span class=\"katex-inline\">\\pm1<\/span>；对应逆序表只有一个系数 <span class=\"katex-inline\">c_j<\/span> 增减 1，其余不变。P5 的交换位置 <span class=\"katex-inline\">j-o_j<\/span> 由方向位推出，与表上变化同步。\n<\/li><li>\n<strong>反射控制表<\/strong>：约束 <span class=\"katex-inline\">0\\le c_j&lt;j<\/span>、<span class=\"katex-inline\">o_j<\/span> 到边界翻转，等价于基数 <span class=\"katex-inline\">(1,2,\\dots,n)<\/span> 的反射格雷码在逆序表上推进；不可行层翻向退一层，可行层交换并访问。\n<\/li><li>\n<strong>覆盖性<\/strong>：控制表走遍全部合法 <span class=\"katex-inline\">(c_1,\\dots,c_n)<\/span>，由双射关系覆盖全部排列；两次访问之间恰好一次邻位交换。\n<\/li><li>\n<strong>均摊分析<\/strong>：书里指出 <span class=\"katex-inline\">n<\/span> 个排列中 <span class=\"katex-inline\">(n-1)/n<\/span> 次不必走 P6、P7；多数轮次直接在最右层完成交换，回退只发生在某层到边界时。总交换次数 <span class=\"katex-inline\">n!-1<\/span>，回退层数摊还后为常数级。\n<\/li><li>\n<strong>奇偶交替<\/strong>：每次邻位交换逆序数变 <span class=\"katex-inline\">\\pm1<\/span>，排列奇偶性翻转；需要全部偶排列时每隔一个访问一次即可。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：元素互异；需要相邻低改动次序；钟式敲钟、增量更新、邻接图 Hamilton 遍历场景。\n<\/li><li>\n边界一：重复多重集邻接图可能无 Hamilton 路，<span class=\"katex-inline\">\\{1,1,2,2\\}<\/span> 即反例；此时回到字典序 Algorithm L。\n<\/li><li>\n边界二：邻位交换路径上元素移动步数多，单元素可能反复左右穿越；若问题关心元素总移动距离，需另估。\n<\/li><li>\n边界三：算法状态多一份逆序表与方向位，存储高于 L；控制表与排列表要同步维护。\n<\/li><li>\n失败案例：方向位不翻转，<span class=\"katex-inline\">c_j<\/span> 到边界后继续增减，越出合法范围；交换位置按 <span class=\"katex-inline\">j<\/span> 而不是 <span class=\"katex-inline\">j-o_j<\/span> 定位，换错相邻对。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>邻位换位 vs 字典序<\/strong>：邻位换位每步一对相邻交换，次序非字典序；L 按全序后继，单步可远距交换。两者覆盖同一 <span class=\"katex-inline\">n!<\/span> 空间。\n<\/li><li>\n<strong>逆序表 vs 排列本体<\/strong>：逆序表是控制状态，排列本体是访问产物；P5 同时更新两者，不能只动一边。\n<\/li><li>\n<strong>plain changes vs 其他邻接生成<\/strong>：邻接图上 Hamilton 路/圈有多种走法；plain changes 特指逆序表反射驱动的这一支，Johnson–Trotter 是现代计算称呼。\n<\/li><li>\n<strong>过渡表 vs 实时判定<\/strong>：Algorithm T 预计算交换位置表，运行时查表；Algorithm P 实时判定可动层。表生成适合反复运行同一规模，实时生成适合 <span class=\"katex-inline\">n<\/span> 动态。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c03/c04 反射格雷码与低改动遍历；逆序对概念。后继：c07 一般生成器把 P 作为 <span class=\"katex-inline\">\\sigma(k,j)<\/span> 选取的一个特例；c08 在 Cayley 图视角下把邻位换位看成生成元 <span class=\"katex-inline\">(1\\,2)<\/span> 的游走，Theorem R 讨论哪些生成元集合能走出 Hamilton 路。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（邻位换位 plain changes：逆序表、方向位与 Algorithm P 的均摊机制）<\/summary><div class=\"depth-body\"><h1>c06 深度推导：逆序表双射证明、<span class=\"katex-inline\">n=3<\/span> 全序列跟踪与均摊代价核算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把邻位换位生成往下追五层：<\/p>\n<ol><li>\n<strong>逆序对概念<\/strong>：先定义排列中的逆序（前面元素大于后面元素），逆序表才有的记录对象；逆序数是排列奇偶性的依据。\n<\/li><li>\n<strong>逆序表双射<\/strong>：计数 <span class=\"katex-inline\">c_j<\/span> 满足 <span class=\"katex-inline\">0\\le c_j&lt;j<\/span>，合法表与排列一一对应；控制状态有了唯一身份，遍历控制表即遍历排列。\n<\/li><li>\n<strong>邻位交换效应<\/strong>：相邻两项互换只改变一对元素的逆序关系，逆序数变 <span class=\"katex-inline\">\\pm1<\/span>；这是「一次一个邻位交换」能对应到表上单一系数变化的基础。\n<\/li><li>\n<strong>方向位回程<\/strong>：系数到边界后需要反向移动，<span class=\"katex-inline\">o_j<\/span> 记录当前方向；没有回程方向，序列在该层走尽即卡死。\n<\/li><li>\n<strong>反射推进机制<\/strong>：控制表按基数 <span class=\"katex-inline\">(1,2,\\dots,n)<\/span> 反射格雷码推进，不可行层翻向退一层；这与 c04 混合进制反射规则同源，只是对象换成排列逆序表。\n<\/ol>\n<p>依赖链方向：逆序对 → 逆序表双射 → 邻位交换效应 → 方向回程 → 反射控制推进。<\/p>\n<h2>正向推导：双射、交换同步与覆盖性<\/h2>\n<p>下面逐步证明。<\/p>\n<p><strong>步骤 1：逆序表定义。<\/strong> <span class=\"katex-inline\">c_j<\/span> 记排在 <span class=\"katex-inline\">j<\/span> 右边且小于 <span class=\"katex-inline\">j<\/span> 的元素个数。元素 <span class=\"katex-inline\">j<\/span> 右边共有 <span class=\"katex-inline\">n-j<\/span> 个位置，小于 <span class=\"katex-inline\">j<\/span> 的元素共 <span class=\"katex-inline\">j-1<\/span> 个；按本书定义约束 <span class=\"katex-inline\">0\\le c_j&lt;j<\/span>。另一等价定义：排在 <span class=\"katex-inline\">j<\/span> 左边且大于 <span class=\"katex-inline\">j<\/span> 的个数；两套定义相差左右视角，使用时统一一套。<\/p>\n<p><strong>步骤 2：从表重建排列。<\/strong> 按 <span class=\"katex-inline\">j=n,n-1,\\dots,1<\/span> 顺序插入：先放 <span class=\"katex-inline\">n<\/span>，再把 <span class=\"katex-inline\">n-1<\/span> 放到使右侧小于 <span class=\"katex-inline\">n-1<\/span> 的元素个数为 <span class=\"katex-inline\">c_{n-1}<\/span> 的位置，依此类推。每个 <span class=\"katex-inline\">j<\/span> 的插入位置有 <span class=\"katex-inline\">j<\/span> 种选择，<span class=\"katex-inline\">c_j<\/span> 唯一指定一种；全部插入后得到排列。<\/p>\n<p><strong>步骤 3：双射反向。<\/strong> 给定排列，逐个元素数出右侧更小元素个数即得 <span class=\"katex-inline\">c_j<\/span>；计数过程唯一。重建与计数互逆，表与排列一一对应。合法表总数 <span class=\"katex-inline\">\\prod_{j=1}^n j=n!<\/span>，与排列总数相等。<\/p>\n<p><strong>步骤 4：邻位交换对应表更新。<\/strong> 交换相邻两项 <span class=\"katex-inline\">x,y<\/span>（<span class=\"katex-inline\">x<\/span> 在左 <span class=\"katex-inline\">y<\/span> 在右）：若 <span class=\"katex-inline\">x&lt;y<\/span>，交换后新增一对逆序；若 <span class=\"katex-inline\">x&gt;y<\/span>，逆序对消失。其余元素对关系不变。逆序数变 <span class=\"katex-inline\">\\pm1<\/span>，表上对应系数增减 1，P5 更新 <span class=\"katex-inline\">c_j\\leftarrow c_j+o_j<\/span>。<\/p>\n<p><strong>步骤 5：可行层判定。<\/strong> P4 计算 <span class=\"katex-inline\">g=c_j+o_j<\/span>：<span class=\"katex-inline\">g&lt;0<\/span> 或 <span class=\"katex-inline\">g=j<\/span> 表示撞到边界，转 P7 翻向并退一层；<span class=\"katex-inline\">0\\le g&lt;j<\/span> 则可行，转 P5 交换。边界判断对照系数范围 <span class=\"katex-inline\">[0,j-1]<\/span>。<\/p>\n<p><strong>步骤 6：覆盖性。<\/strong> 控制表初始全 0（对应最小排列），反射推进走遍全部合法表；双射给出全部排列。每次访问之间一次邻位交换，序列是排列邻接图上的 Hamilton 路；末位可与首位相接成圈。<\/p>\n<p><strong>步骤 7：均摊口径。<\/strong> P3 从 <span class=\"katex-inline\">j=n<\/span> 起检查；可行层常在 <span class=\"katex-inline\">n<\/span> 或接近 <span class=\"katex-inline\">n<\/span> 的位置。书里统计：<span class=\"katex-inline\">n<\/span> 个排列中 <span class=\"katex-inline\">(n-1)/n<\/span> 次不必执行 P6、P7 回退；回退只在系数到边界时发生。总交换 <span class=\"katex-inline\">n!-1<\/span> 次，回退层数摊还到每个排列为常数级，单步代价有界。<\/p>\n<h2>数值算例一：<span class=\"katex-inline\">n=3<\/span> 全序列跟踪<\/h2>\n<p>初始排列 <span class=\"katex-inline\">123<\/span>，逆序表 <span class=\"katex-inline\">c_1=0<\/span>（恒成立，<span class=\"katex-inline\">c_1&lt;1<\/span>），<span class=\"katex-inline\">c_2=0<\/span>，<span class=\"katex-inline\">c_3=0<\/span>；方向 <span class=\"katex-inline\">o_2=o_3=+1<\/span>。<\/p>\n<ol><li>\n<strong>访问<\/strong> <span class=\"katex-inline\">123<\/span>。P3 <span class=\"katex-inline\">j=3<\/span>：<span class=\"katex-inline\">g=c_3+1=1&lt;3<\/span> 可行；交换位置 <span class=\"katex-inline\">j-o_j=2<\/span>，即 <span class=\"katex-inline\">a_2,a_3<\/span>：<span class=\"katex-inline\">123\\to132<\/span>；<span class=\"katex-inline\">c_3=1<\/span>。\n<\/li><li>\n<strong>访问<\/strong> <span class=\"katex-inline\">132<\/span>。<span class=\"katex-inline\">j=3<\/span>：<span class=\"katex-inline\">g=1+1=2&lt;3<\/span>；交换位置 2：<span class=\"katex-inline\">132\\to123<\/span>? 按 plain changes 序列应为 <span class=\"katex-inline\">132\\to312<\/span>。此处注意：元素编号与位置的对应在 P5 中按元素 <span class=\"katex-inline\">j<\/span> 的当前位置定位；<span class=\"katex-inline\">c_3<\/span> 变化时移动的是元素 3。跟踪书里标准序列 <span class=\"katex-inline\">123,132,312,321,231,213<\/span>：\n<ul>\n<li>\n<span class=\"katex-inline\">123\\to132<\/span>：元素 3 右移一位；\n<\/li><li>\n<span class=\"katex-inline\">132\\to312<\/span>：元素 3 左移回首位；\n<\/li><li>\n<span class=\"katex-inline\">312\\to321<\/span>：元素 2 右移；\n<\/li><li>\n<span class=\"katex-inline\">321\\to231<\/span>：元素 3 左移；\n<\/li><li>\n<span class=\"katex-inline\">231\\to213<\/span>：元素 2 左移。\n<\/li><li>\n每步逆序数：<span class=\"katex-inline\">123<\/span> 为 0，<span class=\"katex-inline\">132<\/span> 为 1，<span class=\"katex-inline\">312<\/span> 为 2（3&gt;1,3&gt;2），<span class=\"katex-inline\">321<\/span> 为 3，<span class=\"katex-inline\">231<\/span> 为 2（2&gt;1,3&gt;1），<span class=\"katex-inline\">213<\/span> 为 1（2&gt;1）。奇偶性：偶、奇、偶、奇、偶、奇，交替成立。\n<\/li><li>\n终止：<span class=\"katex-inline\">n=1<\/span> 层计数后结束；末位 <span class=\"katex-inline\">213<\/span> 与首位 <span class=\"katex-inline\">123<\/span> 交换位置 1 可回圈。\n<\/ul>\n<\/ol>\n<h2>数值算例二：<span class=\"katex-inline\">n=4<\/span> 过渡表<\/h2>\n<p>Algorithm T 预计算的交换位置表为<\/p>\n<div class=\"katex-block\">(3,2,1,3,1,2,3,1,3,2,1,3,1,2,3,1,3,2,1,3,1,2,3).<\/div>\n<p>共 <span class=\"katex-inline\">4!-1=23<\/span> 个数。运行时第 <span class=\"katex-inline\">k<\/span> 步交换 <span class=\"katex-inline\">a_{t[k]}<\/span> 与 <span class=\"katex-inline\">a_{t[k]+1}<\/span>。表中位置 1、2、3 分别对应前三对相邻位置；同一位置在表中多次出现，对应元素多次左右穿越。表生成一次后可反复使用，避免每轮 P4–P7 实时判定。<\/p>\n<h2>补充推演：Bell ringing 历史与算法命名<\/h2>\n<p>plain changes 源自英国教堂敲钟：每口钟在相邻两拍之间只能换到隔壁钟位，钟手依固定次序换钟；这套方法 17 世纪已有文字记载。F. R. Trotter 1962 年发表第一个计算机实现；Johnson 独立给出等价构造，现代文献常称 Johnson–Trotter 算法。书里在算法旁注历史脉络，但主体分析仍是逆序表、方向位与邻接图结构。<\/p>\n<h2>邻接图与 Hamilton 条件<\/h2>\n<p>排列作为顶点，邻位交换 <span class=\"katex-inline\">(1\\,2)<\/span> 作用于不同位置得到边；plain changes 在这张图上找 Hamilton 路。Theorem R（c08 展开）给出两生成元存在 Hamilton 圈的必要条件。邻接图连通是前提；重复多重集的邻接图可能连通却无 Hamilton 路，<span class=\"katex-inline\">\\{1,1,2,2\\}<\/span> 即书中反例。判断一类对象能否走邻位路线，先查邻接图的 Hamilton 路径存在性，不能默认总存在。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：方向位不翻转。<\/strong> <span class=\"katex-inline\">c_j<\/span> 到上限 <span class=\"katex-inline\">j-1<\/span> 后仍按 <span class=\"katex-inline\">+1<\/span> 走，<span class=\"katex-inline\">g=j<\/span> 越界；序列在该层卡死。修正：撞边界转 P7，<span class=\"katex-inline\">o_j\\leftarrow-o_j<\/span>。<\/p>\n<p><strong>案例 2：只更新排列不更新逆序表。<\/strong> P5 交换后 <span class=\"katex-inline\">c_j<\/span> 不变，下一轮判定依据错误表；后续交换位置错乱。修正：交换与 <span class=\"katex-inline\">c_j<\/span> 更新在同一步完成。<\/p>\n<p><strong>案例 3：交换位置按元素下标硬套。<\/strong> <span class=\"katex-inline\">j<\/span> 是元素编号，交换位置要经方向位折算成 <span class=\"katex-inline\">j-o_j<\/span>；直接按 <span class=\"katex-inline\">j<\/span> 定位位置会换错相邻对。修正：维护元素当前位置与表的对应。<\/p>\n<p><strong>案例 4：对重复多重集套用邻位换位。<\/strong> <span class=\"katex-inline\">\\{1,1,2,2\\}<\/span> 邻接图无 Hamilton 路，硬跑中途断链。修正：退回 Algorithm L 字典序生成。<\/p>\n<p><strong>案例 5：把逆序表定义方向写反。<\/strong> 左右视角混用会导致 <span class=\"katex-inline\">c_j<\/span> 计数与插入位置不匹配；重建排列时位置错位。修正：全书统一「右侧小于元素个数」一套定义。<\/p>\n<p><strong>案例 6：忽略偶排列筛选需求。<\/strong> 未利用奇偶交替性质，需要偶排列时逐个检验逆序数；实际上每隔一个访问即可得到奇偶一致的子序列。<\/p>\n<h2>复杂度核算<\/h2>\n<ul><li>\n<strong>访问次数<\/strong>：<span class=\"katex-inline\">n!<\/span>；<strong>交换次数<\/strong>：<span class=\"katex-inline\">n!-1<\/span>，每访问一次（除末位）一次邻位交换。\n<\/li><li>\n<strong>回退层数<\/strong>：多数轮次 <span class=\"katex-inline\">j=n<\/span> 直达；边界层回退摊还常数级；总 P6、P7 操作 <span class=\"katex-inline\">O(n!)<\/span>。\n<\/li><li>\n<strong>存储<\/strong>：排列表 <span class=\"katex-inline\">n<\/span> 项，逆序表 <span class=\"katex-inline\">n<\/span> 项，方向位 <span class=\"katex-inline\">n<\/span> 项；<span class=\"katex-inline\">O(n)<\/span>。\n<\/li><li>\n<strong>元素移动距离<\/strong>：plain changes 中元素反复穿越，总移动步数高于一次性定位；需要最小总移动的场景要另选算法。\n<\/ul>\n<h2>差生通读检查<\/h2>\n<ul><li>\n<strong>卡住位置 1：<span class=\"katex-inline\">c_j&lt;j<\/span> 而不是 <span class=\"katex-inline\">c_j\\le n-j<\/span>。<\/strong> 补步骤：本书定义按「右侧小于 <span class=\"katex-inline\">j<\/span> 的元素」计数，小于 <span class=\"katex-inline\">j<\/span> 的元素共 <span class=\"katex-inline\">j-1<\/span> 个，所以上界 <span class=\"katex-inline\">j-1<\/span>；若用「左侧大于 <span class=\"katex-inline\">j<\/span> 的个数」，上界同样是 <span class=\"katex-inline\">j-1<\/span>。两种定义都不是 <span class=\"katex-inline\">n-j<\/span>。\n<\/li><li>\n<strong>卡住位置 2：方向位为什么需要 <span class=\"katex-inline\">-1<\/span>。<\/strong> 补步骤：<span class=\"katex-inline\">c_j<\/span> 走到顶后要往回走才能让其他层推进；没有负方向，表只增不减，很快全部撞上限。\n<\/li><li>\n<strong>卡住位置 3：序列为什么不是字典序。<\/strong> 补步骤：邻位交换只动相邻一对，排列之间按邻接图行走；字典序后继可能远距交换。两种次序对象相同、走法不同。\n<\/li><li>\n<strong>卡住位置 4：逆序数怎样算奇偶。<\/strong> 补步骤：数逆序对个数，偶数为偶排列，奇数为奇排列；每次邻位交换逆序数变 <span class=\"katex-inline\">\\pm1<\/span>，奇偶翻转。\n<\/ul>\n<h2>算例三：逆序表与排列的双向对照（<span class=\"katex-inline\">n=4<\/span>）<\/h2>\n<p>取排列 <span class=\"katex-inline\">3142<\/span>。按「右侧小于元素个数」数：<\/p>\n<ul><li>\n<span class=\"katex-inline\">c_1<\/span>：元素 1 右侧无小于 1 的元素，<span class=\"katex-inline\">c_1=0<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">c_2<\/span>：元素 2 在末位，右侧无元素，<span class=\"katex-inline\">c_2=0<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">c_3<\/span>：元素 3 在首位，右侧小于 3 的有 1、2，共 2 个，<span class=\"katex-inline\">c_3=2<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">c_4<\/span>：元素 4 在第三位，右侧小于 4 的有 2，共 1 个，<span class=\"katex-inline\">c_4=1<\/span>。\n<\/ul>\n<p>逆序表 <span class=\"katex-inline\">(0,0,2,1)<\/span>，约束满足 <span class=\"katex-inline\">c_3&lt;3<\/span>、<span class=\"katex-inline\">c_4&lt;4<\/span>。反推：先放 4；元素 3 按 <span class=\"katex-inline\">c_3=2<\/span> 插到使右侧有两个更小元素的位置（首位）；元素 2 按 <span class=\"katex-inline\">c_2=0<\/span> 放右侧无更小元素的位置（末位）；元素 1 按 <span class=\"katex-inline\">c_1=0<\/span> 插入，还原 <span class=\"katex-inline\">3142<\/span>。<\/p>\n<p>逆序数总和 <span class=\"katex-inline\">c_1+c_2+c_3+c_4=3<\/span>，排列为奇排列。邻位交换一次后总和变 2 或 4，奇偶翻转，与 c05 字典序情形对照：L 路线不保证奇偶交替，P 路线天然交替。<\/p>\n<h2>置换乘法与位置/值视角铺垫<\/h2>\n<p>书里 §7.2.1.2 先讲置换记法：两行表示把位置与值一一对应；循环表示把轮换写成 <span class=\"katex-inline\">(a_1a_2\\cdots a_k)<\/span>。左乘 <span class=\"katex-inline\">\\beta<\/span> 改位置（<span class=\"katex-inline\">a_j<\/span> 换成 <span class=\"katex-inline\">a_j\\beta<\/span>），右乘 <span class=\"katex-inline\">\\beta<\/span> 改值（<span class=\"katex-inline\">a_j<\/span> 换成 <span class=\"katex-inline\">\\beta a_j<\/span>）。邻位交换 <span class=\"katex-inline\">(1\\,2)<\/span> 作为生成元，左乘作用于位置相邻对。理解 P 的交换位置 <span class=\"katex-inline\">j-o_j<\/span> 时，需要分清：<span class=\"katex-inline\">j<\/span> 是元素编号，<span class=\"katex-inline\">o_j<\/span> 给出移动方向，实际位置由元素当前所处位置加方向得到；这与群乘法的位置视角一致。<\/p>\n<h2>过渡表 Algorithm T 的生成与复用<\/h2>\n<p>T 的思路：先跑一遍 Algorithm P，把每次交换的位置记入数组 <span class=\"katex-inline\">t<\/span>；生成完成后，后续反复遍历同一 <span class=\"katex-inline\">n<\/span> 时按表执行。伪代码：<\/p>\n<pre class=\"lang-text\"><code>T1: 初始化同 P1；置 k ← 0\nT2: 若还有后继，按 P4–P7 确定本次交换位置 t[k]\nT3: 执行相邻交换，k ← k+1；回 T2<\/code><\/pre>\n<p>表长 <span class=\"katex-inline\">n!-1<\/span>。查表运行省去实时方向判定，但表本身占 <span class=\"katex-inline\">O(n!)<\/span> 存储；<span class=\"katex-inline\">n<\/span> 固定且程序多次运行才划算。<span class=\"katex-inline\">n=4<\/span> 表 23 项，<span class=\"katex-inline\">n=5<\/span> 表 119 项，规模随阶乘增长。<\/p>\n<h2>与格雷码的结构对照<\/h2>\n<p>邻位换位排列序列与反射格雷码都是低改动遍历：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>对照项<\/th><th>反射格雷码（位串）<\/th><th>邻位换位（排列）<\/th><\/tr><\/thead><tbody><tr><td>对象空间<\/td><td><span class=\"katex-inline\">2^n<\/span> 个位串<\/td><td><span class=\"katex-inline\">n!<\/span> 个排列<\/td><\/tr><tr><td>改动单位<\/td><td>一位 0/1 翻转<\/td><td>一对相邻元素互换<\/td><\/tr><tr><td>控制表<\/td><td>二进制计数/标尺函数<\/td><td>逆序表 <span class=\"katex-inline\">0\\le c_j&lt;j<\/span> + 方向位<\/td><\/tr><tr><td>边界回程<\/td><td>递归反序段<\/td><td>方向位翻转退一层<\/td><\/tr><tr><td>空间对应<\/td><td><span class=\"katex-inline\">n<\/span> 维立方体<\/td><td>排列邻接图<\/td><\/tr><tr><td>圈闭<\/td><td>标准码首尾相邻<\/td><td>plain changes 可成圈<\/td><\/tr><\/tbody><\/table><\/div>\n<p>两套机制在 c04 已点明：逆序表基数 <span class=\"katex-inline\">(1,2,\\dots,n)<\/span> 的反射格雷码就是邻位换位次序。读 P 时可把每个 <span class=\"katex-inline\">c_j<\/span> 想成反射格雷码的一个分量，方向位是分量的升降方向。<\/p>\n<h2>受限邻接生成的边界补充<\/h2>\n<p>并非所有邻接图都有 Hamilton 路。书里指出多重集 <span class=\"katex-inline\">\\{1,1,2,2\\}<\/span> 的排列邻接图：顶点 6 个，边由相邻不同值交换产生；图连通但不存在遍历全部 6 顶点的 Hamilton 路。一般判断 Hamilton 路存在性本身是图论难题；本书在排列互异情形给出构造，重复情形要个案分析。下游若坚持邻位改动，只能在图允许时使用 P；允许远距改动则回到 L 或一般生成器。<\/p>\n<h2>Algorithm P 伪代码与不变量对照<\/h2>\n<pre class=\"lang-text\"><code>P1: c_j ← 0; o_j ← 1   (1 ≤ j ≤ n)\nP2: visit(a_1...a_n)\nP3: j ← n; s ← 0\nP4: g ← c_j + o_j\n    if g &lt; 0: goto P7\n    if g = j: goto P6\nP5: swap(a_{j-o_j}, a_{j-o_j+1}); c_j ← g; goto P2\nP6: if j = 1: stop\n    s ← s+1\nP7: o_j ← -o_j; j ← j-1; goto P4<\/code><\/pre>\n<p>不变量逐条：<\/p>\n<ul><li>\n状态合法：<span class=\"katex-inline\">0\\le c_j&lt;j<\/span> 对所有 <span class=\"katex-inline\">j<\/span> 成立；P4 撞边界才翻向，可行分支直接落入界内。\n<\/li><li>\n表列同步：P5 交换排列相邻对的同时 <span class=\"katex-inline\">c_j<\/span> 更新为 <span class=\"katex-inline\">g<\/span>；排列与逆序表始终对应同一对象。\n<\/li><li>\n回退路径：P7 翻向 <span class=\"katex-inline\">o_j<\/span> 后 <span class=\"katex-inline\">j<\/span> 减 1，检查下一层；<span class=\"katex-inline\">s<\/span> 记录连续回退层数，P6 在 <span class=\"katex-inline\">j=1<\/span> 时判定终止。\n<\/li><li>\n起点终点：初始全 0 对应最小排列；<span class=\"katex-inline\">n=1<\/span> 层到边界后停止，序列覆盖 <span class=\"katex-inline\">n!<\/span> 个对象。\n<\/ul>\n<h2>与 Heap 方法的邻接改动对比<\/h2>\n<p>Heap 方法（c07 一般生成器的一个特例）每步也做单个对换，但对换不必相邻：<span class=\"katex-inline\">\\tau(k,j)<\/span> 在 <span class=\"katex-inline\">k<\/span> 偶时换 <span class=\"katex-inline\">(k,0)<\/span>，奇时换 <span class=\"katex-inline\">(k,j-1)<\/span>。对比 plain changes：<\/p>\n<ul><li>\n改动范围：P 只换相邻位置；Heap 可把首元素与另一位置对换。\n<\/li><li>\n邻接图：P 走邻位交换生成元构成的图；Heap 走含首元素星换位的图。\n<\/li><li>\n实现代价：P 维护逆序表与方向位；Heap 控制表进位更简单，交换规则按 <span class=\"katex-inline\">k<\/span> 奇偶分两类。\n<\/li><li>\n适用：需要相邻物理移动选 P；追求单步一次对换、次序不要求邻接选 Heap。\n<\/ul>\n<h2>均摊分析补充说明<\/h2>\n<p>回退层触发条件是某层系数到边界。系数 <span class=\"katex-inline\">c_j<\/span> 的取值周期为 <span class=\"katex-inline\">j<\/span>：每 <span class=\"katex-inline\">j<\/span> 轮到一次边界。<span class=\"katex-inline\">j<\/span> 越小，边界触发越频繁；但 <span class=\"katex-inline\">j<\/span> 小的层排在回退链低端，回退一次只翻向一层。<span class=\"katex-inline\">j=n<\/span> 层周期最长，绝大多数轮次直接在该层完成移动。书里 <span class=\"katex-inline\">(n-1)/n<\/span> 的比例口径说明：平均每 <span class=\"katex-inline\">n<\/span> 轮才有一轮需要穿过多层回退。把总回退操作除以 <span class=\"katex-inline\">n!<\/span>，摊还值为常数；这与 c02 计数进位的摊还口径一致，都是「低位快、高位慢」的反射/进位结构带来的结果。<\/p>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出排列 <span class=\"katex-inline\">312<\/span> 的逆序表 <span class=\"katex-inline\">(c_1,c_2,c_3)<\/span>，并用重建过程回到 <span class=\"katex-inline\">312<\/span>。\n<\/li><li>\n跟踪 <span class=\"katex-inline\">n=3<\/span> 每一步交换的是哪一对相邻位置，与过渡表前 5 个数对照。\n<\/li><li>\n为什么 <span class=\"katex-inline\">\\{1,1,2,2\\}<\/span> 不能用邻位换位走遍？邻接图连通还缺什么条件？\n<\/li><li>\nP4 中 <span class=\"katex-inline\">g&lt;0<\/span> 与 <span class=\"katex-inline\">g=j<\/span> 分别对应什么边界动作？方向位怎样翻转？\n<\/li><li>\n说明 Algorithm P 的摊还代价口径：为什么多数轮次不需要回退？回退在什么情形发生？\n<\/ol><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 生成所有元组和排列（第4卷 第2册 双语版）.pdf · p.52<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">邻位换位 plain changes：逆序表、方向位与 Algorithm P 的均摊机制<\/a><\/span><\/div><h1>Sims 表与一般排列生成器 Algorithm G：乘积分解、控制表进位与分支剪枝<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（原书 §7.2.1.2，PDF 第 51–54 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Algorithm G 把每个排列唯一分解成逐层置换的乘积 <span class=\"katex-inline\">\\sigma(1,c_1)\\sigma(2,c_2)\\cdots\\sigma(n-1,c_{n-1})<\/span>，用混合进制控制表 <span class=\"katex-inline\">c_n\\dots c_1<\/span> 进位驱动；选不同的 <span class=\"katex-inline\">\\sigma(k,j)<\/span> 得到字典序、邻位换位、Ord–Smith、Heap 等一族生成器，并可在后缀不
