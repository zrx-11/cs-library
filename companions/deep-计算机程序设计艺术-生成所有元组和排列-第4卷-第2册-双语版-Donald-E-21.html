可接受时沿控制表上溯剪枝。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>前面两类算法各管一种次序：L 走字典序，P 走邻位换位。实际问题里还会遇到 Ord–Smith 翻转次序、Heap 单对换次序、循环移位次序，以及带前缀约束的受限枚举。如果每种次序重写一套遍历，代码重复且正确性要各自证明。<\/p>\n<p>需要一个统一框架：把「生成全部排列」拆成「分解方式 + 控制表进位 + 置换施加」三件可替换的部件。分解方式由 Sims 表给出：第 <span class=\"katex-inline\">k<\/span> 层选一个置换 <span class=\"katex-inline\">\\sigma(k,j)<\/span>；控制表像混合进制计数器逐层进位；每步把对应置换施加到当前排列上。换一层的 <span class=\"katex-inline\">\\sigma<\/span> 选择，就换到一种已知算法；同一套进位、回退、剪枝逻辑复用。<\/p>\n<p>第二个困难是受限枚举：谜题、构型问题里大量前缀不可接受，全排列枚举浪费在必然失败的分支上。框架需要在树遍历中识别「当前前缀下整棵子树都不可行」，沿控制表退回父结点，直接走向右兄弟，而不是走进子树再逐个排除。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>置换两行表示<\/strong>：<span class=\"katex-inline\">a_0a_1\\cdots a_{n-1}<\/span> 是 <span class=\"katex-inline\">\\{0,\\dots,n-1\\}<\/span> 的排列；<span class=\"katex-inline\">\\beta<\/span> 是置换。左乘（位置置换）<span class=\"katex-inline\">a_j\\leftarrow a_j\\beta<\/span>；右乘（值置换）<span class=\"katex-inline\">a_j\\leftarrow\\beta a_j<\/span>。书里改用 0 起点记号。<\/p>\n<p><strong>群<\/strong>：乘法封闭的非空置换集合；群中元素可写成所选生成置换的乘积。<\/p>\n<p><strong>Sims 表<\/strong>：一族子集 <span class=\"katex-inline\">S_1,\\dots,S_{n-1}<\/span>，每个 <span class=\"katex-inline\">S_k<\/span> 恰含一个把 <span class=\"katex-inline\">k<\/span> 映射到相应值、固定更大元素的置换。表中 <span class=\"katex-inline\">\\sigma(k,j)\\in S_k<\/span>，<span class=\"katex-inline\">0\\le j&lt;k<\/span>。<\/p>\n<p><strong>Lemma S（唯一分解）<\/strong>：群中每个元素唯一写成<\/p>\n<div class=\"katex-block\">\\alpha=\\sigma(1,c_1)\\sigma(2,c_2)\\cdots\\sigma(n-1,c_{n-1}),\\qquad 0\\le c_k&lt;k+1.<\/div>\n<p>控制表取值总数 <span class=\"katex-inline\">\\prod_{k=1}^{n-1}(k+1)=n!<\/span>。<\/p>\n<p><strong>辅助定义<\/strong>：<span class=\"katex-inline\">\\tau(k,j)=\\sigma(k,j)\\sigma(k,j-1)^-<\/span>；<span class=\"katex-inline\">\\omega(k)=\\sigma(1,1)\\sigma(2,2)\\cdots\\sigma(k,k)<\/span>。不变量：<span class=\"katex-inline\">a_0a_1\\cdots a_{k-1}=\\omega(k)c_k\\omega(k-1)^-<\/span>。<\/p>\n<p><strong>Algorithm G 步骤<\/strong>：<\/p>\n<ul><li>\nG1 初始化控制表 <span class=\"katex-inline\">c_k=0<\/span>；<span class=\"katex-inline\">a_0\\dots a_{n-1}<\/span> 置恒等排列。\n<\/li><li>\nG2 访问；G2.0 后缀测试不可接受则 G2.1 退父结点；G2.1 沿控制表回退到父结点并走向右兄弟。\n<\/li><li>\nG3 控制表加 1（混合进制进位）。\n<\/li><li>\nG4 施加 <span class=\"katex-inline\">\\tau(k,c_k)\\omega(k-1)^-<\/span>，更新排列。\n<\/ul>\n<p><strong>参数特例<\/strong>：reverse colex 取 <span class=\"katex-inline\">\\sigma(k,j)=(k-j\\ k-j+1\\ \\dots\\ k)<\/span>；Ord–Smith 取 <span class=\"katex-inline\">\\sigma(k,j)=(k\\ \\dots\\ 1\\ 0)^j<\/span>；Heap 取 <span class=\"katex-inline\">\\tau(k,j)\\omega(k-1)^-<\/span> 在 <span class=\"katex-inline\">k<\/span> 偶时为 <span class=\"katex-inline\">(k\\ 0)<\/span>、奇时为 <span class=\"katex-inline\">(k\\ j-1)<\/span>。<\/p>\n<p><strong>Algorithm X<\/strong>：循环链表维护未用元素，按前缀测试 <span class=\"katex-inline\">t_k(a_1,\\dots,a_k)<\/span> 逐位进入或回退，是受限前缀排列生成的另一套实现。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">n=4<\/span> 控制表 <span class=\"katex-inline\">(c_3,c_2,c_1)<\/span> 合法取值共 <span class=\"katex-inline\">4!=24<\/span> 个。 <strong>反例<\/strong>：某层 <span class=\"katex-inline\">S_k<\/span> 缺置换，对应子树对象无法到达；不变量失效时同一控制串可能落进不同排列。<\/p>\n<h2>原理推导<\/h2>\n<ol><li>\n<strong>分解唯一性依据<\/strong>：逐层固定位置 <span class=\"katex-inline\">k<\/span> 的值。<span class=\"katex-inline\">S_k<\/span> 的置换只动前 <span class=\"katex-inline\">k+1<\/span> 个元素、固定更大元素；从 <span class=\"katex-inline\">k=1<\/span> 到 <span class=\"katex-inline\">n-1<\/span> 逐层选定，每个位置的归属唯一确定，乘积不重复。\n<\/li><li>\n<strong>控制表即排名编码<\/strong>：<span class=\"katex-inline\">c_k<\/span> 是第 <span class=\"katex-inline\">k<\/span> 层的选择编号，<span class=\"katex-inline\">0\\le c_k&lt;k+1<\/span>；混合进制进位走遍全部合法表，总数 <span class=\"katex-inline\">n!<\/span>。\n<\/li><li>\n<strong>G4 动作推导<\/strong>：从控制串 <span class=\"katex-inline\">c<\/span> 进到右邻串时，只改变某层 <span class=\"katex-inline\">k<\/span> 的系数；<span class=\"katex-inline\">\\tau(k,j)<\/span> 实现该层内从 <span class=\"katex-inline\">j-1<\/span> 到 <span class=\"katex-inline\">j<\/span> 的过渡，<span class=\"katex-inline\">\\omega(k-1)^-<\/span> 把上层状态还原到公共父结点。动作顺序：退到祖先，再下行到右兄弟。\n<\/li><li>\n<strong>不变量保持<\/strong>：每步施加的置换按 <span class=\"katex-inline\">\\tau,\\omega<\/span> 构造，使新控制串对应的乘积分解与新排列一致；G4 后不变量 (17) 成立。\n<\/li><li>\n<strong>剪枝机制<\/strong>：G2.0 在前缀层测试；不可接受时 G2.1 用 <span class=\"katex-inline\">\\sigma(k,k)^-<\/span> 上溯到父结点，再走向右兄弟。跳过整棵子树，而不是访问其中不可行对象。\n<\/li><li>\n<strong>覆盖性<\/strong>：合法控制表一一对应排列，进位遍历覆盖全部；剪枝只跳过不可接受分支，可行对象仍各访问一次。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：需要在多种置换次序间切换；受限前缀枚举；研究群结构与生成元。\n<\/li><li>\n边界一：<span class=\"katex-inline\">\\sigma<\/span> 选择要保证 <span class=\"katex-inline\">S_k<\/span> 结构完整；随意取置换会破坏唯一分解。\n<\/li><li>\n边界二：剪枝测试必须在进入对应层时完成；前缀测试晚于进入会漏可行对象，后缀测试错放前缀层会误剪。\n<\/li><li>\n边界三：框架有分解表与控制表的额外存储；小规模、单次运行时朴素 L 更直接。\n<\/li><li>\n失败案例：剪枝只改输出不回退控制表，留在被跳过的子树内继续走，产生非法排列；<span class=\"katex-inline\">\\sigma<\/span> 乘积顺序写反，分解对不上排列。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>Sims 表 vs 逆序表<\/strong>：逆序表是排列的一种计数表示；Sims 表是群的分层生成元结构，控制表系数选择一层置换。两者都与排列一一对应，但用途不同：P 用逆序表驱动邻位换位，G 用控制表驱动一般乘积分解。\n<\/li><li>\n<strong>一般框架 vs 特例算法<\/strong>：L、P、Ord–Smith、Heap 都是 G 选特定 <span class=\"katex-inline\">\\sigma<\/span> 的结果；框架统一证明不漏不重，特例优化单步动作。\n<\/li><li>\n<strong>控制表进位 vs 元组计数<\/strong>：进位机制同源（c02），系数范围 <span class=\"katex-inline\">0\\le c_k&lt;k+1<\/span>；差别在 G4 把系数变化翻译成置换乘积。\n<\/li><li>\n<strong>前缀剪枝 vs 后缀排除<\/strong>：前缀测试 <span class=\"katex-inline\">t_k<\/span> 在选第 <span class=\"katex-inline\">k<\/span> 位时判定；后缀排除在扩展时检查剩余元素是否可接受。Algorithm G 的 G2.0 与 Algorithm X 的链表测试分别实现两类。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c02 混合进制进位；c05 字典序特例；c06 邻位换位特例；置换乘法与群的基本概念。后继：c08 在 Cayley 图视角下讨论生成元集合与 Hamilton 路，Algorithm C 循环移位、Algorithm E 星换位都是框架内的其他 <span class=\"katex-inline\">\\sigma<\/span> 选择；拓扑排序生成是带偏序约束的受限枚举延伸。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（Sims 表与一般排列生成器 Algorithm G：乘积分解、控制表进位与分支剪枝）<\/summary><div class=\"depth-body\"><h1>c07 深度推导：Sims 表唯一分解证明、控制表树遍历与剪枝回退推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把一般生成器往下追六层：<\/p>\n<ol><li>\n<strong>置换乘法<\/strong>：先分清左乘改位置、右乘改值；乘积顺序决定分解动作怎样落到排列上。\n<\/li><li>\n<strong>群与生成元<\/strong>：排列集合在乘法下成群；群元素可由少数基本置换乘积表示。\n<\/li><li>\n<strong>分层结构<\/strong>：第 <span class=\"katex-inline\">k<\/span> 层只动前 <span class=\"katex-inline\">k+1<\/span> 个元素、固定更大元素；分层使每个位置的归属逐层确定。\n<\/li><li>\n<strong>唯一分解<\/strong>：每层选一个 <span class=\"katex-inline\">\\sigma(k,j)<\/span>，乘积不重不漏地表示群中元素；控制表系数即各层选择。\n<\/li><li>\n<strong>控制表进位<\/strong>：系数按混合进制 <span class=\"katex-inline\">(2,3,\\dots,n)<\/span> 进位，遍历全部合法表；这是 c02 计数机制的复用。\n<\/li><li>\n<strong>树上前序遍历与剪枝<\/strong>：控制表对应隐式树的路径；不可接受分支整枝跳过，回退父结点走向右兄弟。\n<\/ol>\n<p>依赖链方向：置换乘法 → 群生成元 → 分层 → 唯一分解 → 控制进位 → 树遍历剪枝。<\/p>\n<h2>正向推导：分解、动作与不变量逐步建立<\/h2>\n<p><strong>步骤 1：记号约定。<\/strong> 排列用 0 起点 <span class=\"katex-inline\">a_0a_1\\cdots a_{n-1}<\/span>。置换 <span class=\"katex-inline\">\\beta<\/span> 左乘：<span class=\"katex-inline\">a_j\\leftarrow a_j\\beta<\/span>（位置上的元素被移动）；右乘：<span class=\"katex-inline\">a_j\\leftarrow\\beta a_j<\/span>（值被替换）。乘积从左到右作用。<\/p>\n<p><strong>步骤 2：定义 Sims 表。<\/strong> 子集 <span class=\"katex-inline\">S_k<\/span> 含 <span class=\"katex-inline\">\\sigma(k,0),\\sigma(k,1),\\dots,\\sigma(k,k)<\/span>，每个 <span class=\"katex-inline\">\\sigma(k,j)<\/span> 把位置 <span class=\"katex-inline\">k<\/span> 映射到相应值，并固定 <span class=\"katex-inline\">k<\/span> 之后的元素。<span class=\"katex-inline\">S_k<\/span> 的基数为 <span class=\"katex-inline\">k+1<\/span>。<\/p>\n<p><strong>步骤 3：Lemma S 分解。<\/strong> 对群中任意 <span class=\"katex-inline\">\\alpha<\/span>，从 <span class=\"katex-inline\">k=1<\/span> 起逐层选 <span class=\"katex-inline\">c_k<\/span>：<span class=\"katex-inline\">\\sigma(k,c_k)<\/span> 匹配 <span class=\"katex-inline\">\\alpha<\/span> 在第 <span class=\"katex-inline\">k<\/span> 层应有的动作，剩余部分交给更高层。每层选择唯一，因为 <span class=\"katex-inline\">S_k<\/span> 中能固定更大元素并完成该层动作的置换只有一个。得<\/p>\n<div class=\"katex-block\">\\alpha=\\sigma(1,c_1)\\sigma(2,c_2)\\cdots\\sigma(n-1,c_{n-1}).<\/div>\n<p><strong>步骤 4：系数范围与计数。<\/strong> <span class=\"katex-inline\">c_k\\in\\{0,\\dots,k\\}<\/span>，合法控制表总数 <span class=\"katex-inline\">\\prod_{k=1}^{n-1}(k+1)=2\\cdot3\\cdots n=n!<\/span>，与排列数相等。表与排列一一对应，重复与遗漏都被计数排除。<\/p>\n<p><strong>步骤 5：过渡置换定义。<\/strong> <span class=\"katex-inline\">\\tau(k,j)=\\sigma(k,j)\\sigma(k,j-1)^-<\/span>，表示从该层第 <span class=\"katex-inline\">j-1<\/span> 个选择到第 <span class=\"katex-inline\">j<\/span> 个选择的层内过渡；<span class=\"katex-inline\">\\omega(k)=\\sigma(1,1)\\sigma(2,2)\\cdots\\sigma(k,k)<\/span> 是前 <span class=\"katex-inline\">k<\/span> 层都取末位选择的乘积。<\/p>\n<p><strong>步骤 6：不变量。<\/strong> 当前排列满足<\/p>\n<div class=\"katex-block\">a_0a_1\\cdots a_{k-1}=\\omega(k)c_k\\omega(k-1)^-.<\/div>\n<p>解释：上层已走到的状态经 <span class=\"katex-inline\">\\omega(k)<\/span> 衔接当前层系数 <span class=\"katex-inline\">c_k<\/span>，再用 <span class=\"katex-inline\">\\omega(k-1)^-<\/span> 还原下层基准。G4 施加 <span class=\"katex-inline\">\\tau(k,c_k)\\omega(k-1)^-<\/span> 后，新控制串对应新排列，不变量保持。<\/p>\n<p><strong>步骤 7：进位与下行/回退。<\/strong> G3 对 <span class=\"katex-inline\">c_n\\dots c_1<\/span> 混合进制加 1。若当前层系数可行，层内过渡 <span class=\"katex-inline\">\\tau(k,c_k)<\/span> 下行；若层走完，经 <span class=\"katex-inline\">\\sigma(k,k)^-<\/span> 上溯父结点，再走向右兄弟。动作序列与隐式树前序遍历一致。<\/p>\n<p><strong>步骤 8：剪枝。<\/strong> G2.0 测试当前前缀后缀是否可接受；不可接受时 G2.1 沿表上溯到父结点，跳过整棵子树。测试时机：选入第 <span class=\"katex-inline\">k<\/span> 位后立即判定前缀；不可行不进入更深层。<\/p>\n<h2>数值算例一：<span class=\"katex-inline\">n=4<\/span> 控制表与树路径<\/h2>\n<p><span class=\"katex-inline\">n=4<\/span> 时系数 <span class=\"katex-inline\">c_1\\in\\{0\\}<\/span>（恒 0），<span class=\"katex-inline\">c_2\\in\\{0,1\\}<\/span>，<span class=\"katex-inline\">c_3\\in\\{0,1,2\\}<\/span>。控制表 <span class=\"katex-inline\">(c_3,c_2,c_1)<\/span> 共 <span class=\"katex-inline\">3\\cdot2\\cdot1=6<\/span>? 注意 <span class=\"katex-inline\">\\prod_{k=1}^{3}(k+1)=2\\cdot3\\cdot4=24<\/span>：<span class=\"katex-inline\">c_1<\/span> 范围 <span class=\"katex-inline\">0\\le c_1&lt;2<\/span> 方向上 <span class=\"katex-inline\">k=1<\/span> 有 2 个选择，<span class=\"katex-inline\">c_2<\/span> 有 3 个，<span class=\"katex-inline\">c_3<\/span> 有 4 个，合计 24。<\/p>\n<p>隐式树：根下分 <span class=\"katex-inline\">c_3<\/span> 四枝，每枝下分 <span class=\"katex-inline\">c_2<\/span> 三枝，叶子对应 <span class=\"katex-inline\">c_1<\/span> 两枝。前序遍历：<\/p>\n<ol><li>\n<span class=\"katex-inline\">(0,0,0)<\/span> 访问叶子；\n<\/li><li>\n进到 <span class=\"katex-inline\">(0,0,1)<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">c_1<\/span> 走尽，回退父 <span class=\"katex-inline\">c_2<\/span> 层，进 <span class=\"katex-inline\">(0,1,0)<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">(0,1,1)<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">c_2<\/span> 走尽，回退 <span class=\"katex-inline\">c_3<\/span> 层，进 <span class=\"katex-inline\">(1,0,0)<\/span>；\n<\/li><li>\n依此推进到 <span class=\"katex-inline\">(2,2,1)<\/span>，终止。\n<\/ol>\n<p>G4 动作：从 <span class=\"katex-inline\">(1,2,1)<\/span> 到右邻 <span class=\"katex-inline\">(2,0,0)<\/span>，先左乘 <span class=\"katex-inline\">\\sigma(1,1)^-<\/span> 退到 <span class=\"katex-inline\">(1,2,0)<\/span> 方向的父结点，再退 <span class=\"katex-inline\">c_2<\/span> 层，随后 <span class=\"katex-inline\">\\tau(3,2)<\/span> 从 <span class=\"katex-inline\">c_3=1<\/span> 走到 <span class=\"katex-inline\">c_3=2<\/span>。书里图 19 画的就是这条上溯再下行路径。<\/p>\n<h2>数值算例二：三类 <span class=\"katex-inline\">\\sigma<\/span> 选择对照<\/h2>\n<ul><li>\n<strong>reverse colex<\/strong>：<span class=\"katex-inline\">\\sigma(k,j)=(k-j\\ k-j+1\\ \\dots\\ k)<\/span>，循环移位一段；<span class=\"katex-inline\">\\tau(k,j)=(k-j\\ k)<\/span>。生成次序接近反向组合字典序，后缀 rejection 少时效率好。\n<\/li><li>\n<strong>Ord–Smith<\/strong>：<span class=\"katex-inline\">\\sigma(k,j)=(k\\ \\dots\\ 1\\ 0)^j<\/span>，整段翻转；G4 一次翻转完成层内过渡，交换次数少但单次翻转动多个元素。\n<\/li><li>\n<strong>Heap<\/strong>：<span class=\"katex-inline\">\\tau(k,j)\\omega(k-1)^-<\/span> 在 <span class=\"katex-inline\">k<\/span> 偶时为对换 <span class=\"katex-inline\">(k\\ 0)<\/span>，<span class=\"katex-inline\">k<\/span> 奇时为 <span class=\"katex-inline\">(k\\ j-1)<\/span>；G4 每次单个对换，与邻位换位同属低单步动作，但对换不必相邻。\n<\/ul>\n<p>三类选择的控制表与树遍历相同，差别只在层内置换形态；这正是框架可复用的依据。<\/p>\n<h2>剪枝推演：受限前缀跳过<\/h2>\n<p>以 alphametic 问题为例，前缀到第 <span class=\"katex-inline\">k<\/span> 位后，测试 <span class=\"katex-inline\">t_k(a_0,\\dots,a_{k-1})<\/span>：数字分配与算式约束不矛盾才继续。<\/p>\n<ol><li>\n进入 <span class=\"katex-inline\">c_k<\/span> 某选择后跑前缀测试；\n<\/li><li>\n不可接受：G2.1 调 <span class=\"katex-inline\">\\sigma(k,k)^-<\/span> 上溯，<span class=\"katex-inline\">c_k<\/span> 进位到右兄弟；\n<\/li><li>\n右兄弟也不可接受，继续上溯到父层；\n<\/li><li>\n可行分支才下行扩展后缀。\n<\/ol>\n<p>书里实测：Algorithm G 配 Heap 方法加后缀剪枝，trio-sonata 问题少于 128 kilomems；reverse colex 版本 97 kilomems；Algorithm X 链表版 49 kilomems；暴力邻位换位近 128 megamems，剪枝路线快约 170 倍。加速来自跳过不可接受子树，而不是单步变快。<\/p>\n<h2>补充推导：为什么分解唯一<\/h2>\n<p>假设同一 <span class=\"katex-inline\">\\alpha<\/span> 有两种分解，逐层比较：<span class=\"katex-inline\">k=1<\/span> 层，<span class=\"katex-inline\">\\sigma(1,c_1)<\/span> 与 <span class=\"katex-inline\">\\sigma(1,c&#x27;_1)<\/span> 都固定更大元素，若 <span class=\"katex-inline\">c_1\\ne c&#x27;_1<\/span>，第 1 位置的归属不同，乘积结果在该位置不同，矛盾；故 <span class=\"katex-inline\">c_1=c&#x27;_1<\/span>。剥去第一层，剩余部分在 <span class=\"katex-inline\">k\\ge2<\/span> 层重复同一论证，逐层得 <span class=\"katex-inline\">c_k=c&#x27;_k<\/span>。分解唯一。反向：每个合法表按乘积算出一个排列，计数 <span class=\"katex-inline\">n!<\/span> 与排列数相等，无重复即全覆盖。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：<span class=\"katex-inline\">S_k<\/span> 缺置换。<\/strong> 某层可选置换少了一个，对应子树对象永远到不了，访问次数少于 <span class=\"katex-inline\">n!<\/span>。修正：按分层要求补全 <span class=\"katex-inline\">k+1<\/span> 个选择。<\/p>\n<p><strong>案例 2：乘积顺序写反。<\/strong> 分解写成 <span class=\"katex-inline\">\\sigma(n-1)\\cdots\\sigma(1)<\/span>，左乘右乘混淆，排列状态与控制表脱钩。修正：按层数从 1 到 <span class=\"katex-inline\">n-1<\/span> 的作用顺序，左乘位置置换。<\/p>\n<p><strong>案例 3：剪枝不回退控制表。<\/strong> 前缀不可接受却留在当前子树，下一轮进位在被跳过分支内产生非法排列。修正：G2.1 必须上溯父结点再走向右兄弟。<\/p>\n<p><strong>案例 4：前缀测试放错层。<\/strong> 第 <span class=\"katex-inline\">k<\/span> 位未选定就跑依赖后缀的测试，或后缀排除拖到叶子才做；前者误剪可行分支，后者浪费遍历。修正：前缀测试在选入第 <span class=\"katex-inline\">k<\/span> 位后立即跑，后缀排除在扩展时检查。<\/p>\n<p><strong>案例 5：把 G 当万能最优。<\/strong> 框架统一但单步效率取决于 <span class=\"katex-inline\">\\sigma<\/span>；后缀 rejection 少时 reverse colex 更划算，未必选 Heap。修正：按问题结构测特例版本，不迷信框架默认参数。<\/p>\n<p><strong>案例 6：不变量未随 G4 更新。<\/strong> 只进位控制表不施加置换，排列停留在旧状态；访问对象与控制表编号不一致。修正：G3 进位后必须 G4 同步施加过渡置换。 <strong>案例 7：把分层置换当成可任意替换的生成元。<\/strong> <span class=\"katex-inline\">\\sigma(k,j)<\/span> 必须满足「固定更大元素」的分层条件；随意取对换会让不同层动作互相干扰，唯一分解失效。修正：先检查置换固定哪些位置，再纳入 Sims 表。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n<strong>卡住位置 1：左乘右乘分不清。<\/strong> 补步骤：左乘 <span class=\"katex-inline\">\\beta<\/span> 改位置——<span class=\"katex-inline\">a_j<\/span> 位置上的元素被换成 <span class=\"katex-inline\">a_j\\beta<\/span>；右乘改值——元素值被换成 <span class=\"katex-inline\">\\beta a_j<\/span>。记住「左乘动位置，右乘动值」。\n<\/li><li>\n<strong>卡住位置 2：控制表系数范围。<\/strong> 补步骤：第 <span class=\"katex-inline\">k<\/span> 层有 <span class=\"katex-inline\">k+1<\/span> 个选择，<span class=\"katex-inline\">0\\le c_k&lt;k+1<\/span>；总数 <span class=\"katex-inline\">2\\cdot3\\cdots n=n!<\/span>。<span class=\"katex-inline\">c_1<\/span> 不是恒 0，按范围取两个值。\n<\/li><li>\n<strong>卡住位置 3：<span class=\"katex-inline\">\\tau<\/span> 与 <span class=\"katex-inline\">\\omega<\/span> 干什么用。<\/strong> 补步骤：<span class=\"katex-inline\">\\tau<\/span> 是同层内两个选择之间的过渡；<span class=\"katex-inline\">\\omega<\/span> 把上层状态衔接起来，<span class=\"katex-inline\">\\omega^-<\/span> 是回退上层的逆置换。G4 = 层内过渡 + 回退基准。\n<\/li><li>\n<strong>卡住位置 4：剪枝为什么能跳整棵子树。<\/strong> 补步骤：前缀不可行时，无论后缀怎么填都不会变可行；子树全部继承该前缀，整枝跳过不损失可行对象。\n<\/ul>\n<h2>Algorithm G 伪代码与逐步不变量<\/h2>\n<pre class=\"lang-text\"><code>G1: c_k ← 0 (1 ≤ k ≤ n-1); a ← 恒等排列\nG2: visit(a_0...a_{n-1})\n    G2.0: 后缀/前缀测试不可接受 → G2.1\n    G2.1: 沿控制表退到父结点, 走向右兄弟; 无右兄弟则终止\nG3: 控制表混合进制加 1\nG4: 施加 τ(k,c_k) ω(k-1)^-; 更新排列; 回 G2<\/code><\/pre>\n<p>逐步不变量：<\/p>\n<ul><li>\n表合法：<span class=\"katex-inline\">0\\le c_k&lt;k+1<\/span>；G3 进位到 <span class=\"katex-inline\">k=0<\/span> 终止。\n<\/li><li>\n分解一致：当前排列等于 <span class=\"katex-inline\">\\sigma(1,c_1)\\cdots\\sigma(n-1,c_{n-1})<\/span>。\n<\/li><li>\n树上位置：控制表路径对应隐式树结点；G2.1 上溯父结点与前序遍历回退一致。\n<\/li><li>\n测试时机：进入第 <span class=\"katex-inline\">k<\/span> 层后立即跑 <span class=\"katex-inline\">t_k<\/span>；不可接受不扩展后缀。\n<\/ul>\n<h2>Algorithm X 链表受限生成推演<\/h2>\n<p>Algorithm X 用循环链表维护尚未使用的元素：<\/p>\n<ol><li>\n初始链表含全部元素；\n<\/li><li>\n第 <span class=\"katex-inline\">k<\/span> 层从链表取一个元素放入 <span class=\"katex-inline\">a_k<\/span>，从前缀测试 <span class=\"katex-inline\">t_k<\/span>；\n<\/li><li>\n可行则把该元素从链表摘除，进入下一层；\n<\/li><li>\n后缀走尽后回退，元素重新挂回链表，取下一个候选。\n<\/ol>\n<p>链表摘除与挂回是前缀层局部操作；回退时不必重建顺序数组。书里 X 解 trio-sonata 问题 49 kilomems，优于 G 配 Heap 的 128 kilomems，原因是链表回退避开了顺序数组上的后缀扫描。X 与 G 的差别在数据结构：G 靠控制表回退，X 靠链表候选回退；两者都实现树遍历剪枝。<\/p>\n<h2>置换循环表示的小例<\/h2>\n<p><span class=\"katex-inline\">n=3<\/span>，排列 <span class=\"katex-inline\">231<\/span>（0 起点 <span class=\"katex-inline\">120<\/span>）可写循环 <span class=\"katex-inline\">(0\\,1\\,2)<\/span>：0→1，1→2，2→0。邻位对换 <span class=\"katex-inline\">(0\\,1)<\/span>、<span class=\"katex-inline\">(1\\,2)<\/span> 是基本生成元；任一置换可分解成对换乘积。Sims 表把分解按层组织：第 1 层动位置 0、1，第 2 层再动位置 2。分解顺序决定 G4 施加置换的次序；循环表示用于理解置换动作，不直接参与控制表编号。<\/p>\n<h2>实测性能数据对照<\/h2>\n<p>书里 alphametic 基准（trio-sonata 一类谜题）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>实现<\/th><th>实测代价（kilomems）<\/th><th>特点<\/th><\/tr><\/thead><tbody><tr><td>Algorithm G + Heap + 后缀剪枝<\/td><td>&lt;128<\/td><td>单步单个对换，后缀扫描开销<\/td><\/tr><tr><td>Algorithm G + reverse colex<\/td><td>97<\/td><td>后缀 rejection 少时占优<\/td><\/tr><tr><td>Algorithm X 链表<\/td><td>49<\/td><td>链表回退，候选遍历省扫描<\/td><\/tr><tr><td>暴力邻位换位<\/td><td>~128 megamems<\/td><td>无剪枝，全排列枚举<\/td><\/tr><\/tbody><\/table><\/div>\n<p>数据口径：mems 是内存访问次数量级。剪枝路线相对暴力路线约 170 倍加速；加速主要来自跳过不可接受子树，而非单步置换变快。对比时还要看 <span class=\"katex-inline\">n<\/span> 规模与谜题约束强度：约束越弱，剪枝收益越小，单步实现质量占比上升。<\/p>\n<h2>对偶框架铺垫<\/h2>\n<p>Algorithm H 是 G 的对偶形式，分解写成逆序乘积 <span class=\"katex-inline\">\\alpha=\\sigma_{n-1}^-\\cdots\\sigma_2^-\\sigma_1^-<\/span>，树遍历方向反过来。对偶框架下循环移位 Algorithm C 程序最短：C3 对前缀做循环移位，不行则缩短 <span class=\"katex-inline\">k<\/span>。对偶不是新遍历对象，而是把分层顺序从另一端组织；c08 展开 H、C、E 与 Cayley 图生成元视角。读 G 时记住：框架可换分解方向，控制表进位与剪枝机制不变。<\/p>\n<h2>排名与反排名在 Sims 框架中的对应<\/h2>\n<p>控制表 <span class=\"katex-inline\">(c_1,\\dots,c_{n-1})<\/span> 本身就是一套排名编码：<span class=\"katex-inline\">c_k<\/span> 取第 <span class=\"katex-inline\">k<\/span> 层编号，混进制权重为 <span class=\"katex-inline\">(k+1)<\/span> 方向上的阶乘分量。给定排列，逐层匹配 <span class=\"katex-inline\">\\sigma(k,c_k)<\/span> 可反解出控制表，即排名；给定控制表，逐层乘出置换即反排名。这套编码比 c05 的排列位次排名更贴近生成器内部状态：G3 进位就是排名加 1，G4 把编号变化翻译成排列动作。需要按编号直接取排列时，不必从恒等排列逐轮推进，按控制表乘一次乘积即可。<\/p>\n<p>阶乘对照：<span class=\"katex-inline\">c_k<\/span> 范围 <span class=\"katex-inline\">0,\\dots,k<\/span>，权重 <span class=\"katex-inline\">(k+1)<\/span> 的阶乘分量；控制表总数 <span class=\"katex-inline\">2\\cdot3\\cdots n=n!<\/span>，与阶乘计数一致。排名编码在后续组合、划分生成器中沿用：每层一个系数，系数范围由该层可选分支数给定。<\/p>\n<h2>框架选型决策清单<\/h2>\n<p>拿到排列生成需求时按顺序判断：<\/p>\n<ol><li>\n下游是否需要字典序归属？是 → Algorithm L；否 → 进入 2。\n<\/li><li>\n相邻对象是否必须邻位交换？是且元素互异 → Algorithm P；否 → 进入 3。\n<\/li><li>\n是否带前缀/后缀约束，且不可接受分支占比高？是 → Algorithm G/X 加剪枝；否 → 进入 4。\n<\/li><li>\n单步动作偏好：单个对换选 Heap，整段翻转选 Ord–Smith，循环移位选 Algorithm C；需要反复运行同一规模可预计算过渡表。\n<\/ol>\n<p>清单用途：框架统一理解，特例选择靠下游约束与实测代价，不按算法名称贵贱取舍。<\/p>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">n=4<\/span> 控制表系数范围与合法表总数，说明与 <span class=\"katex-inline\">4!<\/span> 的对应。\n<\/li><li>\nLemma S 证明中，逐层比较两种分解为什么能推出 <span class=\"katex-inline\">c_k=c&#x27;_k<\/span>？缺了分层固定条件会怎样？\n<\/li><li>\nreverse colex、Ord–Smith、Heap 三种 <span class=\"katex-inline\">\\sigma<\/span> 选择各自动作形态是什么？单步交换次数与单次改动元素数怎样权衡？\n<\/li><li>\nG2.1 回退父结点用的是哪个置换？为什么不能只把输出标记为不可接受？\n<\/li><li>\n对照书里 trio-sonata 问题的实测数据，剪枝带来的加速主要来自单步变快还是子树跳过？\n<\/ol><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 生成所有元组和排列（第4卷 第2册 双语版）.pdf · p.59<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">Sims 表与一般排列生成器 Algorithm G：乘积分解、控制表进位与分支剪枝<\/a><\/span><\/div><h1>排列生成的算法谱系：对偶与循环移位、Cayley 图生成元、复杂度与枚举边界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：ch04（原书 §7.2.1.2，PDF 第 55–64 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>排列生成算法可按分解方向（正向 Sims 表/对偶逆序乘积）、基本操作（邻位对换、星换位、循环移位）与图结构（Cayley 图上的 Hamilton 路/圈）归类；评价生成器要看摊还代价、生成元集合与问题结构，存在多项式解法时不应走 <span class=\"katex-inline\">n!<\/span> 全枚举。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>到目前为止已接触 L（字典序）、P（邻位换位）、G（一般生成器），书里还给出对偶 Algorithm H、循环移位 Algorithm C、Ehrlich 星换位 Algorithm E 等变体。零散记住每个算法不够，需要一张谱系图：哪些部件相同、哪些选择不同、代价口径怎样比。<\/p>\n<p>实际选型有三个判断难点。第一，基本操作不同：邻位对换只动相邻两位，星换位把首元素与其他位置对换，循环移位整段轮转；机器实现里这些操作的内存访问模式不同。第二，图结构约束：选定生成元集合后，排列是否存在走遍全部顶点的 Hamilton 路/圈，不是任意生成元都能保证。第三，枚举边界：很多问题表面是「找最好排列」，实际有排序、匹配、动态规划等更优路线；<span class=\"katex-inline\">n!<\/span> 膨胀速度决定枚举只作兜底。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>对偶分解<\/strong>：<span class=\"katex-inline\">\\alpha=\\sigma_{n-1}^-\\cdots\\sigma_2^-\\sigma_1^-<\/span>，与 G 的正向乘积方向相反；Algorithm H 按这套分解组织遍历。对偶形式不改变对象集合，只换分层与回退方向。<\/p>\n<p><strong>Algorithm C（循环移位）<\/strong>：Langdon 提出，程序最短；C3 对前缀做循环移位，不可行则缩短 <span class=\"katex-inline\">k<\/span>，下一层继续。基本操作是前缀轮转，不是对换。<\/p>\n<p><strong>Algorithm E（Ehrlich 星换位）<\/strong>：首元素星换位 <span class=\"katex-inline\">a_0\\leftrightarrow a_{b_k}<\/span>；E5 做一次翻转子表。平均交换次数低于 <span class=\"katex-inline\">0.18n<\/span>，每步动作简单。<\/p>\n<p><strong>Cayley 图<\/strong>：顶点为群中全部置换；对每个生成元 <span class=\"katex-inline\">\\alpha<\/span>，从 <span class=\"katex-inline\">\\pi<\/span> 连边到 <span class=\"katex-inline\">\\alpha\\pi<\/span>。生成元集合决定图的边结构；遍历全部顶点对应图上 Hamilton 路/圈。<\/p>\n<p><strong>Theorem R<\/strong>：两生成元 <span class=\"katex-inline\">a,b<\/span> 存在 Hamilton 圈的必要条件；循环移位 <span class=\"katex-inline\">\\sigma=(1\\,2\\,\\dots\\,n)<\/span> 加邻对换 <span class=\"katex-inline\">\\tau=(1\\,2)<\/span> 在 <span class=\"katex-inline\">n\\ge4<\/span> 偶数时不存在 Hamilton 圈。最小生成元集合能否产生遍历，要结合必要条件判断。<\/p>\n<p><strong>Algorithm V（拓扑排序生成）<\/strong>：把满足偏序 <span class=\"katex-inline\">x\\prec y<\/span> 的可行排列逐个左移生成；运行时间是 <span class=\"katex-inline\">M=t_n+\\cdots+t_1<\/span> 与 <span class=\"katex-inline\">N=t_n<\/span> 的线性组合，可行解数量远小于 <span class=\"katex-inline\">n!<\/span>。<\/p>\n<p><strong>摊还代价口径<\/strong>：总操作数除以对象数；区分单步最坏、摊还平均与总内存访问。书里实测 Heap 精简法在顺序数组上每排列约 <span class=\"katex-inline\">2.77\\mu+5.69v<\/span> 量级，寄存器展开后趋近两次存储指令代价。Ehrlich Algorithm E 平均交换次数低于 <span class=\"katex-inline\">0.18n<\/span>；循环移位 Algorithm C 的程序长度最短，适合对代码体量敏感的实现。<\/p>\n<p><strong>历史脉络<\/strong>：字典序后继见于 14 世纪印度 Nārāyaṇa Paṇḍita 与 1784 年 Hindenburg 前言；plain changes 源自 17 世纪英国教堂敲钟，Trotter 1962 年给出计算机实现；Ord–Smith、Heap、Ehrlich 为 20 世纪中后期工作；Sims 表来自群论计算。各算法的发明归属是脉络注记，本书分析主体是不变量、生成元条件与代价口径。<\/p>\n<p><strong>正例<\/strong>：邻位生成元 <span class=\"katex-inline\">(1\\,2)<\/span> 构成 plain changes 谱系；循环移位加星换位是另一组生成元。 <strong>反例<\/strong>：<span class=\"katex-inline\">n\\ge4<\/span> 偶数时 <span class=\"katex-inline\">\\sigma,\\tau<\/span> 组合无 Hamilton 圈，不能作为邻接遍历的生成元；把拓扑排序问题当全排列枚举，代价高估。<\/p>\n<h2>原理推导<\/h2>\n<ol><li>\n<strong>部件分离<\/strong>：任何排列生成器可拆为分解（怎样编号排列）、推进（控制表怎样进位）、基本操作（怎样把编号变化翻译成排列动作）、剪枝（怎样跳过不可行分支）。谱系按这四个部件归类。\n<\/li><li>\n<strong>正向与对偶<\/strong>：乘积顺序反向不改变合法分解集合；对偶树遍历从另一端回退，适合某些 <span class=\"katex-inline\">\\sigma<\/span> 形态短的实现。两套框架都保持唯一分解与不漏不重。\n<\/li><li>\n<strong>生成元与图连通<\/strong>：生成元集合要能生成整个群，Cayley 图才连通；连通是 Hamilton 路的前提。Theorem R 给出必要条件：某些两生成元在特定 <span class=\"katex-inline\">n<\/span> 下圈闭不存在。\n<\/li><li>\n<strong>摊还核算<\/strong>：每访问一个对象的总操作分摊；进位回退、置换施加、测试判定分别计数。低改动算法单步动作小但控制状态多；字典序单步可能远距交换但状态简单。\n<\/li><li>\n<strong>结构优先于枚举<\/strong>：若问题有多项式算法，枚举代价 <span class=\"katex-inline\">n!<\/span> 相对 <span class=\"katex-inline\">n^c<\/span> 迅速失去可行性；「Think twice before you permute」要求先查问题结构。\n<\/li><li>\n<strong>受限枚举代价<\/strong>：拓扑排序只走可行排列，<span class=\"katex-inline\">M,N<\/span> 按可行解计数；剪枝生成器的实测代价由可行解占比与单步成本共同决定。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：需要比较生成器实现；判断生成元集合可行性；评估枚举是否值得；处理带偏序的排列生成。\n<\/li><li>\n边界一：Theorem R 是必要条件，不是充分条件；满足条件不代表一定有 Hamilton 圈。\n<\/li><li>\n边界二：摊还平均掩盖个别长步骤；无环算法要求单步操作数有界，与摊还常数是两条要求。\n<\/li><li>\n边界三：星换位、循环移位的物理实现依赖机器指令；软件数组上的代价要实测，不能只看生成元理论步数。\n<\/li><li>\n失败案例：对 Assignment 类问题硬枚举全部排列；书里指出对角和最大化有 <span class=\"katex-inline\">O(n^3)<\/span> 解法，排序类问题 <span class=\"katex-inline\">O(n\\log n)<\/span>，枚举在 <span class=\"katex-inline\">n<\/span> 稍大即不可行。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>正向分解 vs 对偶分解<\/strong>：G 从第 1 层向第 <span class=\"katex-inline\">n-1<\/span> 层乘积；H 反向乘积；对象相同，树遍历方向相反。\n<\/li><li>\n<strong>邻位对换 vs 星换位 vs 循环移位<\/strong>：邻位换相邻两位；星换位固定首元素与另一位置；循环移位整段轮转。改动范围递增，生成元图结构不同。\n<\/li><li>\n<strong>Hamilton 路 vs Hamilton 圈<\/strong>：路不要求首尾相邻；圈要求回绕。编码盘类应用需要圈，单程遍历只需路。\n<\/li><li>\n<strong>全排列枚举 vs 拓扑排序生成<\/strong>：前者遍历 <span class=\"katex-inline\">n!<\/span> 个互异排列；后者只输出满足偏序的可行排列，数量按 <span class=\"katex-inline\">M,N<\/span> 估。\n<\/li><li>\n<strong>摊还代价 vs 无环性<\/strong>：摊还看平均，无环看单步上界；摊还常数但偶发长回退，不算 loopless。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c07 一般框架与 Sims 表；c06 邻位换位作为 Cayley 图上的生成元游走；c05 字典序作为正向分解特例。后继：本书分册后续展开组合、整数划分、集合划分与树的生成；同一谱系框架（分解—推进—操作—剪枝）与代价口径沿用。拓扑排序是 §2.2.3 偏序结构在生成问题上的延伸。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（排列生成的算法谱系：对偶与循环移位、Cayley 图生成元、复杂度与枚举边界）<\/summary><div class=\"depth-body\"><h1>c08 深度推导：算法谱系归类、Cayley 图条件推演、复杂度核算与枚举边界<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把谱系概念往下追六层：<\/p>\n<ol><li>\n<strong>置换群基础<\/strong>：排列在乘法下成群；生成元乘积表示群元素。没有群概念，生成元集合与图连通无从谈起。\n<\/li><li>\n<strong>分解与控制表<\/strong>：c07 的 Sims 表唯一分解把排列编号成控制表；正向与对偶是分解方向的两种选择。\n<\/li><li>\n<strong>基本操作分类<\/strong>：编号变化翻译成排列动作时，可选邻位对换、星换位、循环移位；动作类别决定生成元图的边。\n<\/li><li>\n<strong>Cayley 图结构<\/strong>：顶点排列，边由生成元给出；连通性、Hamilton 路/圈是图层面的存在性问题。\n<\/li><li>\n<strong>代价口径<\/strong>：摊还操作数、单步上界、存储与实测 mems；比较生成器要先定口径。\n<\/li><li>\n<strong>问题结构判断<\/strong>：枚举之前先查多项式解法；受限枚举按可行解计数，不按 <span class=\"katex-inline\">n!<\/span> 估。\n<\/ol>\n<p>依赖链方向：置换群 → 分解控制表 → 基本操作 → Cayley 图 → 代价口径 → 结构判断。<\/p>\n<h2>正向推导：谱系按四个部件归类<\/h2>\n<p><strong>步骤 1：分解部件。<\/strong> 正向 G：<span class=\"katex-inline\">\\alpha=\\sigma(1,c_1)\\cdots\\sigma(n-1,c_{n-1})<\/span>；对偶 H：<span class=\"katex-inline\">\\alpha=\\sigma_{n-1}^-\\cdots\\sigma_1^-<\/span>。两种分解都保证唯一编号；控制表系数范围由层数分支数给定。<\/p>\n<p><strong>步骤 2：推进部件。<\/strong> 控制表混合进制进位；可行层下行，走尽回退父结点走向右兄弟。正向与对偶推进机制相同，回退方向相反。<\/p>\n<p><strong>步骤 3：操作部件。<\/strong> 编号变化落到排列上的动作分三类：<\/p>\n<ul><li>\n邻位对换：<span class=\"katex-inline\">(j\\ j+1)<\/span>，P 算法；\n<\/li><li>\n星换位：<span class=\"katex-inline\">(0\\ j)<\/span>，E 算法；\n<\/li><li>\n循环移位：前缀整体轮转，C 算法；\n<\/li><li>\n整段翻转：Ord–Smith；单对换非邻位：Heap。\n<\/ul>\n<p><strong>步骤 4：剪枝部件。<\/strong> 前缀测试 <span class=\"katex-inline\">t_k<\/span>、后缀排除、链表候选回退；不可接受分支整枝跳过。剪枝不改变分解与操作，只影响是否进入子树。<\/p>\n<p><strong>步骤 5：图层面判断。<\/strong> 生成元集合 <span class=\"katex-inline\">S<\/span> 决定 Cayley 图：每个生成元对应一类边。图连通是存在遍历的前提；Hamilton 路/圈是更强的存在性要求。Theorem R 给出两生成元情形的必要条件。<\/p>\n<p><strong>步骤 6：代价核算。<\/strong> 总操作 <span class=\"katex-inline\">O(N\\cdot\\text{平均单步})<\/span>，<span class=\"katex-inline\">N<\/span> 为访问对象数；摊还每对象常数到线性；存储 <span class=\"katex-inline\">O(n)<\/span> 状态加过渡表。实测 mems 区分顺序数组与链表实现。<\/p>\n<h2>数值算例一：<span class=\"katex-inline\">n=3<\/span> 的生成元图<\/h2>\n<p>顶点 6 个排列。生成元邻位对换 <span class=\"katex-inline\">(0\\,1)<\/span>、<span class=\"katex-inline\">(1\\,2)<\/span>：边连接可交换相邻两位的排列。plain changes 序列 <span class=\"katex-inline\">123,132,312,321,231,213<\/span> 在图上走出 Hamilton 路，末位回首位成圈。<\/p>\n<p>加入循环移位 <span class=\"katex-inline\">(0\\,1\\,2)<\/span> 作为生成元：边连接整段轮转得到的排列。图连通性增强，但 Hamilton 圈存在性仍要单独判断；<span class=\"katex-inline\">n=3<\/span> 规模小可枚举检查。<span class=\"katex-inline\">n=4<\/span> 偶数时，<span class=\"katex-inline\">\\sigma=(1\\,2\\,3\\,4)<\/span> 与 <span class=\"katex-inline\">\\tau=(1\\,2)<\/span> 这组生成元不存在 Hamilton 圈，Theorem R 的必要条件在此失效侧给出反例。<\/p>\n<h2>数值算例二：拓扑排序生成 <span class=\"katex-inline\">M,N<\/span> 口径<\/h2>\n<p>偏序约束例：元素 0 必须在 1 前，元素 2 必须在 3 前。可行排列不是全部 <span class=\"katex-inline\">4!=24<\/span> 个，而是满足两条先后关系的子集。Algorithm V 逐个生成可行序列：维护可用元素（前驱都已排定），每次左移一个可用元素；<span class=\"katex-inline\">t_k<\/span> 记录第 <span class=\"katex-inline\">k<\/span> 层候选数。<\/p>\n<p>运行时间线性组合：<span class=\"katex-inline\">M=t_n+\\cdots+t_1<\/span> 是各层候选计数之和，<span class=\"katex-inline\">N=t_n<\/span> 是叶子计数（可行排列数）。<span class=\"katex-inline\">N<\/span> 远小于 <span class=\"katex-inline\">n!<\/span>；代价按 <span class=\"katex-inline\">M,N<\/span> 估，而不是按全排列枚举。拓扑排序生成与全排列生成的差别：约束把不可行前缀提前排除，图上只走可行分支。<\/p>\n<h2>算法谱系对照清单<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>算法<\/th><th>分解方向<\/th><th>基本操作<\/th><th>次序性质<\/th><th>剪枝适配<\/th><th>主要场景<\/th><\/tr><\/thead><tbody><tr><td>L<\/td><td>正向<\/td><td>远距交换+后缀反序<\/td><td>字典序<\/td><td>后缀测试<\/td><td>字典归属、稳定枚举<\/td><\/tr><tr><td>P<\/td><td>逆序表反射<\/td><td>邻位对换<\/td><td>邻接 Hamilton 圈<\/td><td>弱<\/td><td>增量更新、钟式遍历<\/td><\/tr><tr><td>G<\/td><td>正向 Sims<\/td><td>按 <span class=\"katex-inline\">\\sigma<\/span> 选<\/td><td>取决于参数<\/td><td>G2.1 回退剪枝<\/td><td>受限枚举、多次序切换<\/td><\/tr><tr><td>H<\/td><td>对偶逆积<\/td><td>按对偶 <span class=\"katex-inline\">\\sigma<\/span><\/td><td>反向树遍历<\/td><td>对偶回退<\/td><td>短实现参数<\/td><\/tr><tr><td>C<\/td><td>对偶<\/td><td>前缀循环移位<\/td><td>轮转次序<\/td><td>缩短 <span class=\"katex-inline\">k<\/span> 回退<\/td><td>最短程序实现<\/td><\/tr><tr><td>E<\/td><td>—<\/td><td>星换位+翻转子表<\/td><td>单对换为主<\/td><td>一般<\/td><td>低交换次数<\/td><\/tr><tr><td>X<\/td><td>链表候选<\/td><td>摘除/挂回元素<\/td><td>前缀树遍历<\/td><td>链表剪枝<\/td><td>强约束谜题<\/td><\/tr><tr><td>V<\/td><td>偏序状态<\/td><td>元素左移<\/td><td>可行拓扑序<\/td><td>偏序天然剪枝<\/td><td>拓扑排序枚举<\/td><\/tr><\/tbody><\/table><\/div>\n<p>清单用途：选型时先定分解方向与操作类别，再按剪枝强度和实测代价挑实现。<\/p>\n<h2>复杂度核算补充<\/h2>\n<ul><li>\n<strong>Heap 精简法实测<\/strong>：书里在 MMIX 顺序数组上给出每排列约 <span class=\"katex-inline\">2.77\\mu+5.69v<\/span> 的量级（<span class=\"katex-inline\">\\mu,v<\/span> 为指令类系数）；寄存器展开后，单步趋近两次存储指令的代价。\n<\/li><li>\n<strong>Ehrlich E<\/strong>：平均交换次数低于 <span class=\"katex-inline\">0.18n<\/span>，翻转子表动作偶发；摊还交换数低于邻位路线的邻接改动口径。\n<\/li><li>\n<strong>暴力路线<\/strong>：无剪枝全排列枚举，<span class=\"katex-inline\">n=10<\/span> 已达数百万对象；alphametic 基准中暴力邻位换位近 128 megamems，剪枝链表版 49 kilomems。\n<\/li><li>\n<strong>存储口径<\/strong>：状态表 <span class=\"katex-inline\">O(n)<\/span>；过渡表 <span class=\"katex-inline\">O(n!)<\/span> 仅适合固定规模反复运行。\n<\/ul>\n<h2>枚举边界判断展开<\/h2>\n<p>书里「Think twice before you permute」一节列举不应枚举的典型：<\/p>\n<ul><li>\n方阵对角和最大化：有 <span class=\"katex-inline\">O(n^3)<\/span> 解法；\n<\/li><li>\n单峰序列最优安排：<span class=\"katex-inline\">O(n\\log n)<\/span> 排序可解；\n<\/li><li>\n一般匹配、指派问题：多项式算法成熟。\n<\/ul>\n<p>判断流程：先看目标是「找最优」还是「穷举满足约束」；找最优且有结构定理，走专门算法；约束只能逐个判定且无解析构造，才用生成器。枚举可行性门槛：<span class=\"katex-inline\">n!<\/span> 增长远快于 <span class=\"katex-inline\">n^c<\/span>，<span class=\"katex-inline\">n=10<\/span> 已是百万级，<span class=\"katex-inline\">n=16<\/span> 超 <span class=\"katex-inline\">10^{13}<\/span>，软件枚举边界很低。受限枚举的可行解占比决定剪枝收益：约束强时 <span class=\"katex-inline\">N\\ll n!<\/span>，剪枝路线才划算。<\/p>\n<h2>历史脉络<\/h2>\n<p>排列生成的早期记载：字典序后继见于 Nārāyaṇa Paṇḍita（14 世纪）与 Hindenburg（1784）；plain changes 源自 17 世纪英国教堂敲钟，Trotter 1962 年计算机实现；Ord–Smith、Heap、Ehrlich 各 mid-20 世纪算法相继提出；Sims 表来自群论计算，Koda–Ruskey 子森林 1993 年发表。本书把历史作为脉络注记，分析主体放在不变量、生成元条件与代价口径上。后续分册的组合、划分、树生成沿用同一谱系框架。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：生成元集合不生成全群。<\/strong> 只选相邻某一对对换，图不连通，顶点无法走遍；纳入生成元前先查群生成性。 <strong>案例 2：把必要条件当充分条件。<\/strong> Theorem R 满足必要条件就断言有 Hamilton 圈，存在反例；必要条件只用于排除，存在性要构造或专门证明。 <strong>案例 3：只看摊还不看单步上界。<\/strong> 某些算法摊还常数但偶发长回退；无环应用（实时控制）要求单步操作数有界，不能只凭平均代价选算法。 <strong>案例 4：物理操作照搬软件理论步数。<\/strong> 星换位、循环移位在特定机器上有指令支持，软件数组实现代价不同；选型要实测内存访问模式。 <strong>案例 5：拓扑问题按全排列估代价。<\/strong> 忽略偏序剪枝，<span class=\"katex-inline\">n!<\/span> 口径高估运行时间；应按 <span class=\"katex-inline\">M,N<\/span> 可行解口径核算。 <strong>案例 6：对最优问题硬枚举。<\/strong> 排序、指派、匹配已有多项式解法，枚举 <span class=\"katex-inline\">n!<\/span> 在 <span class=\"katex-inline\">n<\/span> 稍大停止不了；先做问题结构分类。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n<strong>卡住位置 1：正向对偶分不清。<\/strong> 补步骤：G 乘积从第 1 层写到第 <span class=\"katex-inline\">n-1<\/span> 层；H 从第 <span class=\"katex-inline\">n-1<\/span> 层逆序写到第 1 层。对象集合相同，遍历树的回退方向相反。\n<\/li><li>\n<strong>卡住位置 2：生成元与置换动作的关系。<\/strong> 补步骤：每个生成元是一个基本置换；每走一条边就是乘一个生成元。邻位对换、星换位、循环移位是不同生成元，图边不同。\n<\/li><li>\n<strong>卡住位置 3：摊还和无环的差别。<\/strong> 补步骤：摊还是总操作除以总数；无环要求相邻两次访问之间操作数上界有界。一个可以摊还好但偶发长步骤，不满足无环。\n<\/li><li>\n<strong>卡住位置 4：<span class=\"katex-inline\">M,N<\/span> 怎样用。<\/strong> 补步骤：<span class=\"katex-inline\">N<\/span> 是可行叶子数，<span class=\"katex-inline\">M<\/span> 是各层候选计数之和；运行时间按这两个数线性组合估，不套 <span class=\"katex-inline\">n!<\/span>。\n<\/li><li>\n<strong>卡住位置 5：什么时候放弃枚举。<\/strong> 补步骤：目标是求最优且存在多项式算法，或 <span class=\"katex-inline\">n!<\/span> 越过可行规模；两者任一成立先找专门解法。\n<\/ul>\n<h2>对偶与三类变体的步骤展开<\/h2>\n<p><strong>Algorithm H（对偶生成器）<\/strong>：分解 <span class=\"katex-inline\">\\alpha=\\sigma_{n-1}^-\\cdots\\sigma_1^-<\/span>。控制表从另一端进位，回退沿逆序乘积上溯。书里指出 <span class=\"katex-inline\">n=4<\/span> 时这类最小对换方案已不可能，对偶框架每 <span class=\"katex-inline\">n(n-1)<\/span> 步才做一次额外动作；对偶不追求单步最省，而是换分解方向适配短 <span class=\"katex-inline\">\\sigma<\/span>。<\/p>\n<p><strong>Algorithm C（循环移位，Langdon）<\/strong>：C1 初始化；C2 访问；C3 对当前前缀做循环移位：把前缀首元素轮转到末位或反向轮转；C4 若当前长度不可行，缩短 <span class=\"katex-inline\">k<\/span> 再试。基本操作是一段元素整体轮转，不是两两对换。程序文本在各变体中最短，适合代码体量受限的环境。<\/p>\n<p><strong>Algorithm E（Ehrlich 星换位）<\/strong>：维护 <span class=\"katex-inline\">b_k<\/span> 指向首元素要对换的目标位置；E5 翻转子表调整方向。每步主动作是星换位 <span class=\"katex-inline\">a_0\\leftrightarrow a_{b_k}<\/span>，平均交换次数低于 <span class=\"katex-inline\">0.18n<\/span>；翻转子表是偶发辅助动作。星换位图比邻位图连接更宽，遍历路径更短，但单次对换跨距大。<\/p>\n<h2>Cayley 图与 Theorem R 细节<\/h2>\n<p>Cayley 图定义：顶点集为群 <span class=\"katex-inline\">G<\/span>；生成元集合 <span class=\"katex-inline\">S<\/span>，对每个 <span class=\"katex-inline\">\\alpha\\in S<\/span>，边 <span class=\"katex-inline\">\\pi\\to\\alpha\\pi<\/span>。图为无向时把 <span class=\"katex-inline\">\\alpha^-<\/span> 也纳入边。图连通当且仅当 <span class=\"katex-inline\">S<\/span> 生成 <span class=\"katex-inline\">G<\/span>。<\/p>\n<p>Theorem R 讨论两个生成元 <span class=\"katex-inline\">a,b<\/span> 何时存在 Hamilton 圈。书里给出的反例：<span class=\"katex-inline\">a=\\sigma=(1\\,2\\,\\dots\\,n)<\/span> 为循环移位，<span class=\"katex-inline\">b=\\tau=(1\\,2)<\/span> 为邻对换；当 <span class=\"katex-inline\">n\\ge4<\/span> 且 <span class=\"katex-inline\">n<\/span> 为偶数时，这组生成元的 Cayley 图不含 Hamilton 圈。必要条件从奇偶性、轨道或图的二分结构导出；满足条件只代表不被排除，不保证圈存在。生成元选型时：连通性先查，Hamilton 存在性再查；邻位对换集合在互异排列上 plain changes 已构造出圈，星换位与循环移位组合要单独论证。<\/p>\n<h2>寄存器排列实测场景<\/h2>\n<p>书里「Faster, faster」一节考察 MMIX 寄存器排列：程序需要把一组寄存器内容按置换映射到另一组寄存器。生成器在这里的用途不是穷举排列，而是比较各算法在机器级的存储访问代价。Heap 精简法展开后，单步趋近两次存储指令；<span class=\"katex-inline\">\\mu,v<\/span> 系数对应不同指令类。实测口径与理论步数分开：理论邻位改动小，机器上相邻位置访问可能仍走同一寄存器堆；跨位对换的内存模式要按实现测。<\/p>\n<h2><span class=\"katex-inline\">n=4<\/span> 变体对照推演<\/h2>\n<ul><li>\nL 字典序：24 个排列按全序后继；单步 L3 交换与 L4 反序，后缀长时反序多对。\n<\/li><li>\nP 邻位换位：23 次邻位交换；奇偶交替；逆序表 + 方向位状态。\n<\/li><li>\nHeap：每步单个对换，对换含首元素；无逆序表。\n<\/li><li>\nE 星换位：首元素跨位对换，子表翻转辅助。\n<\/li><li>\nC 循环移位：前缀轮转；程序最短。\n<\/ul>\n<p>24 个对象的小样本上各变体都能走完全空间；差别体现在单步动作种类、辅助状态量与机器访问模式。规模放大后，控制状态存储与摊还单步成本成为区分因素。<\/p>\n<h2>受限枚举与拓扑排序再核<\/h2>\n<p>Algorithm V 的输入是偏序关系集；输出是全部线性扩展。每层候选 <span class=\"katex-inline\">t_k<\/span> 是前驱已排定的可用元素数；<span class=\"katex-inline\">N=t_n<\/span> 为可行排列数，<span class=\"katex-inline\">M=\\sum t_k<\/span> 为候选计数总和。生成时间是 <span class=\"katex-inline\">M,N<\/span> 的线性组合。偏序越紧，<span class=\"katex-inline\">N<\/span> 越小；全序偏序下 <span class=\"katex-inline\">N=1<\/span>，只有一个线性扩展。把拓扑排序当成全排列问题是高估：不可行前缀在候选生成时就被偏序排除，不进枚举。<\/p>\n<h2>问题分类清单：什么时候用哪一类生成器<\/h2>\n<ul><li>\n<strong>需要按字典序输出或比对<\/strong>：Algorithm L。元素可比较，起点非降序；多重集适用。\n<\/li><li>\n<strong>相邻对象必须物理相邻移动<\/strong>：Algorithm P，前提元素互异且邻接图有 Hamilton 路。\n<\/li><li>\n<strong>多种次序切换或强前缀约束<\/strong>：Algorithm G/X 加剪枝；按实测选 <span class=\"katex-inline\">\\sigma<\/span> 与数据结构。\n<\/li><li>\n<strong>代码体量优先<\/strong>：Algorithm C 循环移位对偶框架。\n<\/li><li>\n<strong>交换次数优先<\/strong>：Algorithm E 星换位，平均交换数低于 <span class=\"katex-inline\">0.18n<\/span>。\n<\/li><li>\n<strong>带偏序的可行排列<\/strong>：Algorithm V 拓扑排序生成，按 <span class=\"katex-inline\">M,N<\/span> 估代价。\n<\/li><li>\n<strong>求最优排列且有结构算法<\/strong>：不走生成器；排序、匹配、指派、动态规划优先。\n<\/ul>\n<p>清单与 c07 的选型决策表互补：c07 侧重框架内参数选择，本节侧重生成器族外的边界与问题分类。<\/p>\n<h2>增长量级对照<\/h2>\n<ul><li>\n元组：<span class=\"katex-inline\">m^n<\/span>，基数固定时指数增长；\n<\/li><li>\n排列：<span class=\"katex-inline\">n!<\/span>，比指数增长更快（斯特林公式 <span class=\"katex-inline\">n!\\approx\\sqrt{2\\pi n}(n/e)^n<\/span>）；\n<\/li><li>\n组合：二项式系数 <span class=\"katex-inline\">\\binom{n}{k}<\/span>；\n<\/li><li>\n多项式解法：<span class=\"katex-inline\">n\\log n<\/span>、<span class=\"katex-inline\">n^2<\/span>、<span class=\"katex-inline\">n^3<\/span> 量级。\n<\/ul>\n<p><span class=\"katex-inline\">n=10<\/span> 时 <span class=\"katex-inline\">10!\\approx3.6\\times10^6<\/span>，软件可承受；<span class=\"katex-inline\">n=16<\/span> 时 <span class=\"katex-inline\">16!\\approx2.1\\times10^{13}<\/span>，枚举不可行；<span class=\"katex-inline\">n=20<\/span> 时超 <span class=\"katex-inline\">10^{18}<\/span>。枚举门槛由问题机器与剪枝强度共同决定，但阶乘量级的增长趋势不变。受限枚举的可行解 <span class=\"katex-inline\">N<\/span> 若仍随阶乘增长，同样会撞墙；这类问题要找结构性质而不是优化生成器。<\/p>\n<h2>与后续分册的衔接<\/h2>\n<p>本书 §7.2.1 后续小节展开组合（subsets/combinations）、整数划分、集合划分、树的生成。谱系框架沿用：分解编号、控制进位、基本操作、剪枝四部件；Cayley 图与生成元视角在群生成问题继续使用；代价口径仍分摊还、单步上界与存储。元组与排列是这套框架的前两类对象，后续对象在同样框架下替换约束与操作。<\/p>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n把 L、P、G、H、C、E、X、V 按分解方向、基本操作、次序性质三列归类。\n<\/li><li>\nTheorem R 中 <span class=\"katex-inline\">\\sigma=(1\\,2\\,\\dots\\,n)<\/span> 与 <span class=\"katex-inline\">\\tau=(1\\,2)<\/span> 在什么条件下无 Hamilton 圈？为什么说它是必要条件而非充分条件？\n<\/li><li>\n写出 Heap 精简法、Ehrlich E、暴力邻位换位三类路线的代价口径，说明剪枝加速来自哪里。\n<\/li><li>\n拓扑排序生成的 <span class=\"katex-inline\">M,N<\/span> 与 <span class=\"katex-inline\">n!<\/span> 是什么关系？偏序约束怎样降低可行解数量？\n<\/li><li>\n各举一个应走多项式解法、不应走全排列枚举的问题，并说明枚举路线的增长量级。\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：组合生成总框架与 n 元组计数<\/strong><br>阅读：<a href=\"#/chapter/ch01\">7.2.1–7.2.1.1：组合生成的基本模式与 n 元组计数生成<\/a><br>检查点：能区分枚举、列举与生成三个词，写出混合进制元组 $0\\le a_j&lt;m_j$ 的约束，逐步推演 Algorithm M 的进位流程并说出总数 $\\prod m_j$<\/li><li class='path-step' id='path-02'><strong>步骤 02：格雷码：反射构造、混合进制推广与树形生成<\/strong><br>阅读：<a href=\"#/chapter/ch02\">7.2.1.1：格雷码、混合进制与树形（子森林）生成<\/a><br>检查点：能画出 3 位反射格雷码序列，用公式 $g(k)=k\\oplus\\lfloor k/2\\rfloor$ 算出指定码，说明混合进制反射规则与子森林遍历的不变量<\/li><li class='path-step' id='path-03'><strong>步骤 03：排列生成：字典序与邻位换位<\/strong><br>阅读：<a href=\"#/chapter/ch03\">7.2.1.2：排列的字典序、邻位换位与 plain changes<\/a><br>检查点：能手算 Algorithm L 对给定排列的下一个排列，写出逆序表并跟踪 Algorithm P 的方向位与一次一个邻位交换，说明两类次序各自的改动代价<\/li><li class='path-step' id='path-04'><strong>步骤 04：一般生成器、受限枚举与复杂度比较<\/strong><br>阅读：<a href=\"#/chapter/ch04\">7.2.1.2：一般排列生成器、受限枚举与复杂度分析<\/a><br>检查点：能按 Sims 表分解写出 Algorithm G 的控制表进位与置换作用，讲清对偶生成、循环移位、星换位与 Cayley 图视角，用摊还代价与剪枝判断何时该枚举、何时该找最优算法<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='n 元组（n-tuple）'>n 元组（n-tuple） — 长度为 $n$ 的取值序列 $(a_1,\\dots,a_n)$，每个分量 $a_j$ 取遍规定范围 $0\\le a_j&lt;m_j$；二元组对应位串，总数为各分量范围之积 $\\prod m_j$ <span class=glossary-ref>（7.2.1–7.2.1.1：组合生成的基本模式与 n 元组计数生成）<\/span><\/li><li data-term='混合进制（mixed radix）'>混合进制（mixed radix） — 各分量基数 $m_j$ 可以不同的计数制；元组 $[a_{n-1},\\dots,a_0]_{m_{n-1},\\dots,m_0}$ 对应整数值 $b_{n-1}m_{n-2}\\cdots m_0+\\cdots+b_1m_0+b_0$ <span class=glossary-ref>（7.2.1–7.2.1.1：组合生成的基本模式与 n 元组计数生成）<\/span><\/li><li data-term='字典序（lexicographic order）'>字典序（lexicographic order） — 类比词典逐位比较先后的次序；计数算法 M 与 Algorithm L 都按字典序访问全部对象 <span class=glossary-ref>（7.2.1–7.2.1.1：组合生成的基本模式与 n 元组计数生成）<\/span><\/li><li data-term='反射格雷码（reflected gray code）'>反射格雷码（reflected Gray code） — 把全部元组排成一列或一圈，相邻两个元组只改变一个分量；递归规则 $\\Gamma_0=\\epsilon$，$\\Gamma_{n+1}=0\\Gamma_n,\\ 1\\Gamma_n^{R}$ <span class=glossary-ref>（7.2.1.1：格雷码、混合进制与树形（子森林）生成）<\/span><\/li><li data-term='格雷码到整数的映射 $g(k)$'>格雷码到整数的映射 $g(k)$ — 标准二进制格雷码下，整数 $k=(\\dots b_1b_0)_2$ 的格雷表示 $a_j=b_j\\oplus b_{j+1}$，可由 $g(k)=k\\oplus\\lfloor k/2\\rfloor$ 直接算出 <span class=glossary-ref>（7.2.1.1：格雷码、混合进制与树形（子森林）生成）<\/span><\/li><li data-term='焦点指针（focus pointers）'>焦点指针（focus pointers） — 无环（loopless）生成算法中替代逐位扫描的辅助指针数组，标记当前活跃分量与被动分量的边界，使相邻两次访问之间操作数有界 <span class=glossary-ref>（7.2.1.1：格雷码、混合进制与树形（子森林）生成）<\/span><\/li><li data-term='逆序表（inversion table）'>逆序表（inversion table） — 排列的辅助计数 $c_j$，$c_j$ 表示排在 $j$ 之前但大于 $j$（或按本书定义排在 $j$ 右边且小于 $j$）的元素个数，约束 $0\\le c_j&lt;j$；遍历全部合法逆序表即覆盖全部排列 <span class=glossary-ref>（7.2.1.2：排列的字典序、邻位换位与 plain changes）<\/span><\/li><li data-term='邻位换位（adjacent interchange）'>邻位换位（adjacent interchange） — 每次只交换排列中相邻两个元素；一次邻位交换使逆序总数改变 $\\pm1$，plain changes 用 $n!-1$ 次邻位交换走遍全部 $n!$ 个排列 <span class=glossary-ref>（7.2.1.2：排列的字典序、邻位换位与 plain changes）<\/span><\/li><li data-term='sims 表'>Sims 表 — Charles C. Sims 引入的置换群表示：一族子集 $S_1,\\dots,S_{n-1}$，每个 $S_k$ 恰含一个把 $k$ 映射到相应值、固定更大元素的置换；群中每个元素可唯一写成 $\\sigma_1\\sigma_2\\cdots\\sigma_{n-1}$ <span class=glossary-ref>（7.2.1.2：一般排列生成器、受限枚举与复杂度分析）<\/span><\/li><li data-term='cayley 图（cayley graph）'>Cayley 图（Cayley graph） — 以群的全部置换为顶点，对每个生成元 $\\alpha$ 连出从 $\\pi$ 到 $\\alpha\\pi$ 的有向边；生成元集合能否产生 Hamilton 路/圈，对应能否用极少基本操作走遍全部排列 <span class=glossary-ref>（7.2.1.2：一般排列生成器、受限枚举与复杂度分析）<\/span><\/li><li data-term='受限前缀剪枝（suffix/prefix bypass）'>受限前缀剪枝（suffix/prefix bypass） — 生成器按树遍历组织对象，当前缀或后缀不可接受时整棵子树跳过；Algorithm G 的 G2.1 与 Algorithm X 的链表测试都是这类剪枝 <span class=glossary-ref>（7.2.1.2：一般排列生成器、受限枚举与复杂度分析）<\/span><\/li><li data-term='摊还代价（amortized cost）'>摊还代价（amortized cost） — 把一段生成过程中各次访问的操作数分摊到每个对象上的平均代价；判断生成器效率时看总操作数除以对象数，而不是单步最坏值 <span class=glossary-ref>（7.2.1.2：一般排列生成器、受限枚举与复杂度分析）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p class='empty'>本书暂无测验题，无法诊断。<\/p>", "__patterns__": "<h1>模式库：元组与排列生成的可复用套路<\/h1>\n<h2>模式 1：混合进制计数遍历<\/h2>\n<p><strong>适用场景<\/strong>：各分量取值范围有限、互不依赖；需要按字典序走遍全部笛卡尔积；<span class=\"katex-inline\">n<\/span> 作为参数变化，写不出固定层数嵌套循环。<\/p>\n<p><strong>问题信号<\/strong>：约束写成 <span class=\"katex-inline\">0\\le a_j&lt;m_j<\/span>；下游逐个消费候选；没有「相邻只差一位」的要求；需要一个与层数无关的通用程序。<\/p>\n<p><strong>算法套路<\/strong>：<\/p>\n<ol><li>\n初始化全 0；\n<\/li><li>\n访问当前元组；\n<\/li><li>\n从最低位起找可增分量，到顶归 0 向左进位；\n<\/li><li>\n最高位溢出终止。\n<p>嵌套循环是 <span class=\"katex-inline\">n<\/span> 固定时的等价写法：内层循环对应低位快分量，外层对应高位慢分量。<\/p>\n<\/ol>\n<p><strong>材料变体<\/strong>：二元位串（<span class=\"katex-inline\">m_j=2<\/span>）退化为二进制计数器；十进制数字串（<span class=\"katex-inline\">m_j=10<\/span>）；分量基数各不相同的混合进制。<\/p>\n<p><strong>代价边界<\/strong>：访问次数 <span class=\"katex-inline\">\\prod m_j<\/span>；总进位 <span class=\"katex-inline\">O(N)<\/span>，摊还每对象常数；存储 <span class=\"katex-inline\">O(n)<\/span>。分量间有约束时纯计数会产生非法组合，要加访问前判定或换剪枝生成器。<\/p>\n<p><strong>易错复盘<\/strong>：进位后低位不归 0 会漏状态；上界写成 <span class=\"katex-inline\">m_j<\/span> 会越界；终止靠产物等于最大元组容易写错，用状态溢出判定更稳。<\/p>\n<h2>模式 2：反射低改动遍历<\/h2>\n<p><strong>适用场景<\/strong>：相邻候选只需改动一个分量/一个结点；下游依赖差分更新；编码盘、子集求和符号跟踪、钟式遍历。<\/p>\n<p><strong>问题信号<\/strong>：要求相邻对象邻接（差一位、差一对相邻元素、差一个结点状态）；计数序列多位同变导致误读；状态需要在两步之间局部延续。<\/p>\n<p><strong>算法套路<\/strong>：<\/p>\n<ol><li>\n确认对象空间的邻接关系（立方体边、邻接对换边、父子依赖边）；\n<\/li><li>\n递归分半构造：前半加固定前缀，后半反序加另一前缀，保证跨段边界单步；\n<\/li><li>\n控制表用方向位/焦点指针记录当前段方向与活跃位置；\n<\/li><li>\n到边界翻转方向退一层。\n<\/ol>\n<p><strong>材料变体<\/strong>：二元反射格雷码（异或映射）；混合进制反射格雷（累计奇偶镜像）；子森林（边缘链表生长收缩）；排列邻位换位（逆序表反射）。<\/p>\n<p><strong>代价边界<\/strong>：访问次数等于空间大小；无环实现单步操作数有界，需要额外指针与方向状态；重复多重集邻接图可能无 Hamilton 路，低改动路线不一定存在。<\/p>\n<p><strong>易错复盘<\/strong>：后半段不取反序会在跨段边界多位同变；异或公式不能套到基数 3 以上；方向位不翻转会在边界卡死；子森林不查父结点约束会产生悬空子集。<\/p>\n<h2>模式 3：字典序后继构造<\/h2>\n<p><strong>适用场景<\/strong>：输出需要词典次序；元素可比较；多重集有重复值；要按位次定位或反排名。<\/p>\n<p><strong>问题信号<\/strong>：需要「下一个排列/组合」的全序后继；下游按前缀归属组织；起点可排为非降序。<\/p>\n<p><strong>算法套路<\/strong>：<\/p>\n<ol><li>\n从右找最右可增支点 <span class=\"katex-inline\">j<\/span>（后缀非递增）；\n<\/li><li>\n后缀中取大于 <span class=\"katex-inline\">a_j<\/span> 的最小元素交换；\n<\/li><li>\n后缀反序成最小形态；\n<\/li><li>\n找不到支点终止。\n<\/ol>\n<p><strong>材料变体<\/strong>：排列 Algorithm L；元组计数后继（低位进位 + 低位归 0）；后续组合、受限子集的字典序算法沿用同一三步通则。<\/p>\n<p><strong>代价边界<\/strong>：总操作 <span class=\"katex-inline\">O(N)<\/span>；支点靠近末位占多数，反序交换随后缀长度变化；多重集偏斜时扫描变慢。<\/p>\n<p><strong>易错复盘<\/strong>：支点方向找反会提前改前缀；交换不取最小会跳后继；不反序后缀会停在偏大形态；宽松不等号对重复元素产生重复对象。<\/p>\n<h2>模式 4：分层乘积分解 + 控制表进位<\/h2>\n<p><strong>适用场景<\/strong>：要在多种置换次序间切换；受限前缀枚举；需要统一框架证明不漏不重；研究群结构与生成元。<\/p>\n<p><strong>问题信号<\/strong>：已有多种特例算法想统一理解；约束分支可按层组织；后缀不可接受时希望整枝跳过；需要按编号直接取对象（排名/反排名）。<\/p>\n<p><strong>算法套路<\/strong>：<\/p>\n<ol><li>\n定义分层置换 <span class=\"katex-inline\">\\sigma(k,j)<\/span>，第 <span class=\"katex-inline\">k<\/span> 层固定更大元素；\n<\/li><li>\n唯一分解 <span class=\"katex-inline\">\\alpha=\\prod_k\\sigma(k,c_k)<\/span>；\n<\/li><li>\n控制表混合进制进位，G4 施加层内过渡 + 上层回退；\n<\/li><li>\n前缀测试不可行时上溯父结点走向右兄弟。\n<\/ol>\n<p><strong>材料变体<\/strong>：reverse colex、Ord–Smith 翻转、Heap 单对换是不同 <span class=\"katex-inline\">\\sigma<\/span> 选择；对偶 H 反向乘积；Algorithm X 用链表候选替代控制表回退。<\/p>\n<p><strong>代价边界<\/strong>：访问 <span class=\"katex-inline\">n!<\/span>（或可行解数）；控制表与分解表存储 <span class=\"katex-inline\">O(n)<\/span>；剪枝收益取决于不可接受分支占比；<span class=\"katex-inline\">\\sigma<\/span> 结构不完整会破坏唯一分解。<\/p>\n<p><strong>易错复盘<\/strong>：<span class=\"katex-inline\">S_k<\/span> 缺置换导致子树不可达；乘积顺序写反使表列脱钩；剪枝不回退控制表会在跳过子树内产生非法对象；测试放错层会漏可行对象或误剪。<\/p>\n<h2>模式 5：生成元图上的遍历存在性判断<\/h2>\n<p><strong>适用场景<\/strong>：选定基本操作（邻位对换、星换位、循环移位）后，判断能否走遍全部排列；比较不同操作集合的图结构。<\/p>\n<p><strong>问题信号<\/strong>：讨论 Hamilton 路/圈；机器只支持某类基本指令；需要证明一组生成元能产生全部置换。<\/p>\n<p><strong>算法套路<\/strong>：<\/p>\n<ol><li>\n以全部置换为顶点，生成元为边建 Cayley 图；\n<\/li><li>\n先查生成元是否生成全群（连通性）；\n<\/li><li>\n再查 Hamilton 路/圈存在性，必要条件用于排除，构造用于证明；\n<\/li><li>\n按图上路径选择生成次序。\n<\/ol>\n<p><strong>材料变体<\/strong>：邻位对换图（plain changes）；星换位图（E）；循环移位图（C）；两生成元混合图（Theorem R 反例）。<\/p>\n<p><strong>代价边界<\/strong>：Hamilton 存在性本身是图论难题；互异排列邻位图 plain changes 有构造，重复多重集未必有图上路。<\/p>\n<p><strong>易错复盘<\/strong>：连通不等于有 Hamilton 路；必要条件满足不等于圈存在；理论步数要结合机器内存访问模式实测。<\/p>\n<h2>模式 6：枚举前的结构分类<\/h2>\n<p><strong>适用场景<\/strong>：拿到「找最好排列/最优安排」类问题，决定是否走生成器。<\/p>\n<p><strong>问题信号<\/strong>：目标是优化而非穷举；问题有排序、匹配、指派、动态规划结构；<span class=\"katex-inline\">n<\/span> 规模可能较大；候选约束只能逐个判定的信息不足。<\/p>\n<p><strong>算法套路<\/strong>：<\/p>\n<ol><li>\n分清需求：穷举满足约束，还是求最优；\n<\/li><li>\n查是否存在多项式解法；\n<\/li><li>\n估枚举量级：<span class=\"katex-inline\">n!<\/span>、<span class=\"katex-inline\">m^n<\/span> 与 <span class=\"katex-inline\">n^c<\/span> 对照；\n<\/li><li>\n必须枚举时再选次序、剪枝与数据结构。\n<\/ol>\n<p><strong>材料变体<\/strong>：全排列枚举；受限剪枝枚举；拓扑排序可行解枚举；元组参数扫描。<\/p>\n<p><strong>代价边界<\/strong>：<span class=\"katex-inline\">10!\\approx3.6\\times10^6<\/span> 可承受，<span class=\"katex-inline\">16!\\approx2.1\\times10^{13}<\/span> 不可行；剪枝后按可行解 <span class=\"katex-inline\">N<\/span> 与候选计数 <span class=\"katex-inline\">M<\/span> 估代价，不套 <span class=\"katex-inline\">n!<\/span>。<\/p>\n<p><strong>易错复盘<\/strong>：把有结构解法的问题硬枚举；忽略偏序剪枝高估拓扑排序代价；只看摊还不看单步上界，实时场景选到偶发长回退的算法。<\/p>", "__cheatsheet__": "<h1>速查表：生成所有元组和排列（TAOCP Vol.4 Fascicle 2）<\/h1>\n<h2>1. 两类对象与计数口径<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>对象<\/th><th>约束<\/th><th>总数<\/th><th>生成路线<\/th><\/tr><\/thead><tbody><tr><td>混合进制 n 元组<\/td><td><span class=\"katex-inline\">0\\le a_j&lt;m_j<\/span><\/td><td><span class=\"katex-inline\">\\prod m_j<\/span><\/td><td>计数 Algorithm M / 格雷码<\/td><\/tr><tr><td>二元位串<\/td><td><span class=\"katex-inline\">a_j\\in\\{0,1\\}<\/span><\/td><td><span class=\"katex-inline\">2^n<\/span><\/td><td>反射格雷码<\/td><\/tr><tr><td>互异排列<\/td><td><span class=\"katex-inline\">\\{1,\\dots,n\\}<\/span> 全排<\/td><td><span class=\"katex-inline\">n!<\/span><\/td><td>L / P / G / H / C / E<\/td><\/tr><tr><td>多重集排列<\/td><td>值 <span class=\"katex-inline\">x_i<\/span> 出现 <span class=\"katex-inline\">n_i<\/span> 次<\/td><td><span class=\"katex-inline\">n!/\\prod n_i!<\/span><\/td><td>Algorithm L（邻位路线常失效）<\/td><\/tr><tr><td>主子森林<\/td><td>父结点在位则子结点可选<\/td><td>按树结构统计<\/td><td>Algorithm K<\/td><\/tr><tr><td>拓扑可行排列<\/td><td>满足偏序 <span class=\"katex-inline\">x\\prec y<\/span><\/td><td><span class=\"katex-inline\">N=t_n<\/span><\/td><td>Algorithm V<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>2. 算法 M：混合进制计数生成<\/h2>\n<pre class=\"lang-text\"><code>M1: a_j ← 0 (0 ≤ j ≤ n)\nM2: visit(a_1...a_n)\nM3: j ← n\nM4: while a_j = m_j-1: a_j ← 0; j ← j-1\nM5: if j = 0: stop\n    a_j ← a_j+1; go M2<\/code><\/pre>\n<ul><li>\n次序：字典序；高位慢变、低位快变。\n<\/li><li>\n终止：最高位进位溢出，<span class=\"katex-inline\">j=0<\/span>。\n<\/li><li>\n摊还：总进位 <span class=\"katex-inline\">O(N)<\/span>，每元组常数级；存储 <span class=\"katex-inline\">O(n)<\/span>。\n<\/ul>\n<h2>3. 反射二进制格雷码<\/h2>\n<ul><li>\n递归：<span class=\"katex-inline\">\\Gamma_0=\\epsilon<\/span>；<span class=\"katex-inline\">\\Gamma_{n+1}=0\\Gamma_n,\\ 1\\Gamma_n^{R}<\/span>。\n<\/li><li>\n映射：<span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span>；<span class=\"katex-inline\">a_j=b_j\\oplus b_{j+1}<\/span>。\n<\/li><li>\n反解码：<span class=\"katex-inline\">b_j=a_j\\oplus a_{j+1}\\oplus a_{j+2}\\oplus\\cdots<\/span>。\n<\/li><li>\n单步翻转位：<span class=\"katex-inline\">\\rho(k)<\/span>（<span class=\"katex-inline\">k<\/span> 末尾连续 0 的个数方向）。\n<\/li><li>\n<span class=\"katex-inline\">n=3<\/span>：<span class=\"katex-inline\">000,001,011,010,110,111,101,100<\/span>。\n<\/ul>\n<h2>4. 混合进制反射格雷<\/h2>\n<ul><li>\n正变换：<span class=\"katex-inline\">B_{j+1}<\/span> 偶，<span class=\"katex-inline\">a_j=b_j<\/span>；奇，<span class=\"katex-inline\">a_j=m_j-1-b_j<\/span>。\n<\/li><li>\n反变换：高位以上格雷分量和为偶，<span class=\"katex-inline\">b_j=a_j<\/span>；奇，<span class=\"katex-inline\">b_j=m_j-1-a_j<\/span>。\n<\/li><li>\n反射型：分量 0↔<span class=\"katex-inline\">m_j-1<\/span> 往返；模数型：加 1 模 <span class=\"katex-inline\">m_j<\/span> 绕回。\n<\/li><li>\n退化森林（链森林）主子森林 = 混合进制元组。\n<\/ul>\n<h2>5. Algorithm L：字典序排列<\/h2>\n<pre class=\"lang-text\"><code>L1: visit\nL2: j ← n-1; while a_j ≥ a_{j+1}: j ← j-1; if j=0 stop\nL3: l ← n; while a_j ≥ a_l: l ← l-1; swap(a_j, a_l)\nL4: k ← j+1; l ← n; while k&lt;l: swap(a_k,a_l); k++; l--; go L1<\/code><\/pre>\n<ul><li>\n三步：找最右可增支点 → 换后缀最小可换元素 → 后缀反序。\n<\/li><li>\n支点判断严格不等号；相等元素不交换。\n<\/li><li>\n<span class=\"katex-inline\">1234\\to1243\\to1324\\to1342\\to1423\\to1432\\to2134\\to\\cdots\\to4321<\/span>。\n<\/ul>\n<h2>6. Algorithm P：邻位换位 plain changes<\/h2>\n<pre class=\"lang-text\"><code>P1: c_j ← 0; o_j ← 1\nP2: visit\nP3: j ← n; s ← 0\nP4: g ← c_j+o_j; g&lt;0 → P7; g=j → P6; else P5\nP5: swap(a_{j-o_j}, a_{j-o_j+1}); c_j ← g; go P2\nP6: if j=1 stop; s++\nP7: o_j ← -o_j; j ← j-1; go P4<\/code><\/pre>\n<ul><li>\n逆序表：<span class=\"katex-inline\">0\\le c_j&lt;j<\/span>，与排列一一对应，总数 <span class=\"katex-inline\">n!<\/span>。\n<\/li><li>\n每步一次邻位交换；逆序数变 <span class=\"katex-inline\">\\pm1<\/span>，奇偶交替。\n<\/li><li>\n<span class=\"katex-inline\">n=3<\/span>：<span class=\"katex-inline\">123,132,312,321,231,213<\/span>。\n<\/li><li>\n多重集 <span class=\"katex-inline\">\\{1,1,2,2\\}<\/span> 邻接图无 Hamilton 路。\n<\/ul>\n<h2>7. Algorithm G：Sims 表一般生成器<\/h2>\n<ul><li>\n唯一分解：<span class=\"katex-inline\">\\alpha=\\sigma(1,c_1)\\sigma(2,c_2)\\cdots\\sigma(n-1,c_{n-1})<\/span>，<span class=\"katex-inline\">0\\le c_k&lt;k+1<\/span>。\n<\/li><li>\n计数：<span class=\"katex-inline\">\\prod(k+1)=n!<\/span>。\n<\/li><li>\n过渡：<span class=\"katex-inline\">\\tau(k,j)=\\sigma(k,j)\\sigma(k,j-1)^-<\/span>；<span class=\"katex-inline\">\\omega(k)=\\prod_{r=1}^k\\sigma(r,r)<\/span>。\n<\/li><li>\n特例：\n<ul>\n<li>\nreverse colex：<span class=\"katex-inline\">\\sigma(k,j)=(k-j\\ \\dots\\ k)<\/span>；\n<\/li><li>\nOrd–Smith：<span class=\"katex-inline\">\\sigma(k,j)=(k\\ \\dots\\ 1\\ 0)^j<\/span>；\n<\/li><li>\nHeap：<span class=\"katex-inline\">k<\/span> 偶 <span class=\"katex-inline\">\\tau=(k\\ 0)<\/span>，奇 <span class=\"katex-inline\">\\tau=(k\\ j-1)<\/span>。\n<\/li><li>\n剪枝：G2.0 测试不可接受 → G2.1 退父结点走向右兄弟。\n<\/li><li>\nAlgorithm X：循环链表维护未用元素，前缀测试 <span class=\"katex-inline\">t_k<\/span> 摘挂回退。\n<\/ul>\n<\/ul>\n<h2>8. 其他变体<\/h2>\n<ul><li>\n<strong>H（对偶）<\/strong>：<span class=\"katex-inline\">\\alpha=\\sigma_{n-1}^-\\cdots\\sigma_1^-<\/span>，反向乘积树遍历。\n<\/li><li>\n<strong>C（循环移位）<\/strong>：前缀轮转，不可行缩短 <span class=\"katex-inline\">k<\/span>；程序最短。\n<\/li><li>\n<strong>E（星换位）<\/strong>：<span class=\"katex-inline\">a_0\\leftrightarrow a_{b_k}<\/span>，平均交换 <span class=\"katex-inline\">&lt;0.18n<\/span>，翻转子表辅助。\n<\/li><li>\n<strong>V（拓扑排序）<\/strong>：可行排列逐个左移；代价按 <span class=\"katex-inline\">M=\\sum t_k<\/span>、<span class=\"katex-inline\">N=t_n<\/span> 线性组合。\n<\/ul>\n<h2>9. Cayley 图与生成元<\/h2>\n<ul><li>\n顶点：全部置换；边：乘生成元 <span class=\"katex-inline\">\\alpha<\/span> 得 <span class=\"katex-inline\">\\alpha\\pi<\/span>。\n<\/li><li>\n连通是 Hamilton 路前提；Theorem R 给两生成元 Hamilton 圈必要条件。\n<\/li><li>\n<span class=\"katex-inline\">\\sigma=(1\\ 2\\ \\dots\\ n)<\/span>、<span class=\"katex-inline\">\\tau=(1\\ 2)<\/span>：<span class=\"katex-inline\">n\\ge4<\/span> 偶数时无 Hamilton 圈。\n<\/ul>\n<h2>10. 选型决策<\/h2>\n<ol><li>\n要字典序归属？→ L。\n<\/li><li>\n必须邻位物理移动且元素互异？→ P。\n<\/li><li>\n强约束受限枚举？→ G/X 加剪枝。\n<\/li><li>\n代码体量优先？→ C；交换次数优先？→ E。\n<\/li><li>\n带偏序？→ V。\n<\/li><li>\n求最优且有多项式解法？→ 不走 <span class=\"katex-inline\">n!<\/span> 枚举。\n<\/ol>\n<h2>11. 易错点<\/h2>\n<ul><li>\n进位后低位必须归 0；上界对照 <span class=\"katex-inline\">m_j-1<\/span>。\n<\/li><li>\n格雷码异或只适用基数 2；多值走累计奇偶镜像。\n<\/li><li>\nL 的支点从右找；交换取后缀最小；后缀必须反序。\n<\/li><li>\nP 的排列与逆序表同步更新；方向位到边界必须翻转。\n<\/li><li>\n剪枝必须回退控制表，不能只标记跳过。\n<\/li><li>\n生成 ≠ 计数 ≠ 列举：存储口径分开估。\n<\/ul>\n<h2>12. 历史脉络速记<\/h2>\n<ul><li>\n字典序后继：Nārāyaṇa Paṇḍita（14 世纪）、Hindenburg（1784）。\n<\/li><li>\nplain changes：17 世纪英国教堂敲钟；Trotter 1962 计算机实现。\n<\/li><li>\n格雷码：Gray 1934；Baudot 1878、Schäffler 1879 早有雏形；中国环谜对应状态序列。\n<\/li><li>\n子森林：Koda–Ruskey, J. Algorithms 15 (1993), 324–340。\n<\/ul>"}};

const ZS_VERSION = '1.9.0';
/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}

function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}

function routeIdFromHash(){

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  if(typeof vis !== 'undefined'){ networkLoaded = true; cb(); return; }
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE) { cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库未加载：离线构建请加 <code>--offline all</code>，或联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){

        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 掌握度（简化 BKT） ---------- */
function getMastery(cid){
  if(!cid) return 0.5;
  const m = (state.mastery||{})[cid];
  return m !== undefined ? m : 0.3;
}
function updateMastery(cid, delta){
  if(!cid) return;
  if(!state.mastery) state.mastery = {};
  const cur = state.mastery[cid] !== undefined ? state.mastery[cid] : 0.3;
  state.mastery[cid] = Math.max(0, Math.min(1, cur + delta));
  store.set('mastery', state.mastery);
}
function masteryBar(cid){
  const v = Math.round(getMastery(cid)*100);
  return `<div class="mastery-bar"><div style="width:${v}%"></div></div><span class="mastery-label">掌握度 ${v}%</span>`;
}
