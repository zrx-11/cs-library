<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>

ent": "concepts/c06-depth.md"}, {"id": "c07", "title": "Sims 表与一般排列生成器 Algorithm G：乘积分解、控制表进位与分支剪枝", "file": "concepts/c07.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "计算机程序设计艺术 生成所有元组和排列（第4卷 第2册 双语版）.pdf", "page": 52}, "prerequisites": ["c06"], "depthFragment": "concepts/c07-depth.md"}, {"id": "c08", "title": "排列生成的算法谱系：对偶与循环移位、Cayley 图生成元、复杂度与枚举边界", "file": "concepts/c08.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "计算机程序设计艺术 生成所有元组和排列（第4卷 第2册 双语版）.pdf", "page": 59}, "prerequisites": ["c07"], "depthFragment": "concepts/c08-depth.md"}], "glossary": [{"term": "n 元组（n-tuple）", "def": "长度为 $n$ 的取值序列 $(a_1,\\dots,a_n)$，每个分量 $a_j$ 取遍规定范围 $0\\le a_j<m_j$；二元组对应位串，总数为各分量范围之积 $\\prod m_j$", "chapterId": "ch01"}, {"term": "混合进制（mixed radix）", "def": "各分量基数 $m_j$ 可以不同的计数制；元组 $[a_{n-1},\\dots,a_0]_{m_{n-1},\\dots,m_0}$ 对应整数值 $b_{n-1}m_{n-2}\\cdots m_0+\\cdots+b_1m_0+b_0$", "chapterId": "ch01"}, {"term": "字典序（lexicographic order）", "def": "类比词典逐位比较先后的次序；计数算法 M 与 Algorithm L 都按字典序访问全部对象", "chapterId": "ch01"}, {"term": "反射格雷码（reflected Gray code）", "def": "把全部元组排成一列或一圈，相邻两个元组只改变一个分量；递归规则 $\\Gamma_0=\\epsilon$，$\\Gamma_{n+1}=0\\Gamma_n,\\ 1\\Gamma_n^{R}$", "chapterId": "ch02"}, {"term": "格雷码到整数的映射 $g(k)$", "def": "标准二进制格雷码下，整数 $k=(\\dots b_1b_0)_2$ 的格雷表示 $a_j=b_j\\oplus b_{j+1}$，可由 $g(k)=k\\oplus\\lfloor k/2\\rfloor$ 直接算出", "chapterId": "ch02"}, {"term": "焦点指针（focus pointers）", "def": "无环（loopless）生成算法中替代逐位扫描的辅助指针数组，标记当前活跃分量与被动分量的边界，使相邻两次访问之间操作数有界", "chapterId": "ch02"}, {"term": "逆序表（inversion table）", "def": "排列的辅助计数 $c_j$，$c_j$ 表示排在 $j$ 之前但大于 $j$（或按本书定义排在 $j$ 右边且小于 $j$）的元素个数，约束 $0\\le c_j<j$；遍历全部合法逆序表即覆盖全部排列", "chapterId": "ch03"}, {"term": "邻位换位（adjacent interchange）", "def": "每次只交换排列中相邻两个元素；一次邻位交换使逆序总数改变 $\\pm1$，plain changes 用 $n!-1$ 次邻位交换走遍全部 $n!$ 个排列", "chapterId": "ch03"}, {"term": "Sims 表", "def": "Charles C. Sims 引入的置换群表示：一族子集 $S_1,\\dots,S_{n-1}$，每个 $S_k$ 恰含一个把 $k$ 映射到相应值、固定更大元素的置换；群中每个元素可唯一写成 $\\sigma_1\\sigma_2\\cdots\\sigma_{n-1}$", "chapterId": "ch04"}, {"term": "Cayley 图（Cayley graph）", "def": "以群的全部置换为顶点，对每个生成元 $\\alpha$ 连出从 $\\pi$ 到 $\\alpha\\pi$ 的有向边；生成元集合能否产生 Hamilton 路/圈，对应能否用极少基本操作走遍全部排列", "chapterId": "ch04"}, {"term": "受限前缀剪枝（suffix/prefix bypass）", "def": "生成器按树遍历组织对象，当前缀或后缀不可接受时整棵子树跳过；Algorithm G 的 G2.1 与 Algorithm X 的链表测试都是这类剪枝", "chapterId": "ch04"}, {"term": "摊还代价（amortized cost）", "def": "把一段生成过程中各次访问的操作数分摊到每个对象上的平均代价；判断生成器效率时看总操作数除以对象数，而不是单步最坏值", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [], "flashcards": []}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 生成所有元组和排列（第4卷 第2册 双语版）.pdf · p.6<\/div><h1>7.2.1–7.2.1.1：组合生成的基本模式与 n 元组计数生成<\/h1>\n<blockquote>对应原书 §7.2.1「Generating Basic Combinatorial Patterns」与 §7.2.1.1「Generating all n-tuples」开头的计数生成部分（PDF 第 6–7 页；印刷页 1–2，偏移：印刷页 = PDF 页 − 5，已用两处章首互核）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清「枚举（enumerate）」「列举（listing）」「生成（generating）」三个词在组合查找语境里的差别；\n<\/li><li>\n写出一组混合进制约束 <span class=\"katex-inline\">0\\le a_j&lt;m_j\\ (1\\le j\\le n)<\/span>，并算出满足约束的 n 元组总数；\n<\/li><li>\n逐步推演 Algorithm M 的初始化、访问、进位与终止流程，说出每一步对应普通进位制里的哪个动作；\n<\/li><li>\n解释计数生成为何按字典序输出，并举出嵌套循环与进位算法等价的例子；\n<\/li><li>\n区分「把对象全部打印成清单」和「对象在数据结构中瞬时存在、逐个被检查」两种使用方式。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>组合查找要解决的不是数清楚有多少种，而是把空间里每个对象依次交到处理程序手里；最朴素的走法是把元组当成一个混合进制数反复加 1，进位到最高位溢出即走遍全部取值，这就是 Algorithm M，它按字典序不漏不重地访问所有 n 元组。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：组合生成的问题框架（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c01.md\" target=\"_blank\" rel=\"noopener\">概念 c01<\/a>。§7.2.1 开篇先区分三件事：如果只想回答 <span class=\"katex-inline\">\\{1,2,3\\}<\/span> 的排列有多少个，答案是 <span class=\"katex-inline\">3!=6<\/span>，这叫计数（enumeration 的通常含义）；如果把 <span class=\"katex-inline\">\\{123,132,213,231,312,321\\}<\/span> 全部写在纸上或存进文件，这叫列举（listing）；实际程序想要的第三种状态是——每个排列在数据结构里短暂存在，程序一次检查一个对象（PDF 第 6 页）。生成（generation）与树遍历同构：第 2.3.1 节访问树的每个结点，这里访问组合空间里的每个对象。<\/p>\n<h3>2. 概念 2：混合进制 n 元组与计数算法 M（难度：基础）<\/h3>\n<p>详见 <a href=\"../concepts/c02.md\" target=\"_blank\" rel=\"noopener\">概念 c02<\/a>。先看二进制特例：<span class=\"katex-inline\">n<\/span> 位串共有 <span class=\"katex-inline\">2^n<\/span> 个，从 <span class=\"katex-inline\">(0\\dots0)_2<\/span> 数到 <span class=\"katex-inline\">(1\\dots1)_2<\/span> 即走遍全部。推广到十进制数字串：从 <span class=\"katex-inline\">(0\\dots0)_{10}=0<\/span> 数到 <span class=\"katex-inline\">(9\\dots9)_{10}=10^n-1<\/span>。更一般地，各分量上限可以不同，约束 <span class=\"katex-inline\">0\\le a_j&lt;m_j<\/span>，对应的数是混合进制数 <span class=\"katex-inline\">[a_1,\\dots,a_n]_{m_1,\\dots,m_n}<\/span>（PDF 第 7 页）。Algorithm M 反复给这个混合进制数加 1，直到溢出。<\/p>\n<h3>3. 概念 3：嵌套循环与进位算法的等价（难度：基础）<\/h3>\n<p>Algorithm M 写起来只有几步，但当 <span class=\"katex-inline\">n<\/span> 是小常数时，直接写 <span class=\"katex-inline\">n<\/span> 层嵌套循环更直观。书里给出 <span class=\"katex-inline\">n=4<\/span> 的写法：对 <span class=\"katex-inline\">a_1<\/span> 从 0 到 <span class=\"katex-inline\">m_1-1<\/span> 循环，内层对 <span class=\"katex-inline\">a_2<\/span> 循环，再内层对 <span class=\"katex-inline\">a_3<\/span>、<span class=\"katex-inline\">a_4<\/span> 循环，最内层访问 <span class=\"katex-inline\">(a_1,a_2,a_3,a_4)<\/span>（PDF 第 7 页式 (3)）。这段嵌套循环与 Algorithm M 产生的序列完全相同：内层分量走动最快，外层分量走动最慢，这正是混合进制加法里低位进位快、高位进位慢的次序。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[组合空间: 满足 0≤a_j&amp;lt;m_j 的全部元组] --&gt; B[选定表示: 混合进制数]\nB --&gt; C[Algorithm M: 初始化全 0]\nC --&gt; D[访问当前元组]\nD --&gt; E[从右向左找可增分量 j]\nE --&gt; F{j=0?}\nF -- 是 --&gt; G[终止: 全部走尽]\nF -- 否 --&gt; H[a_j 加 1, 右侧分量归 0]\nH --&gt; D<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这条链断在「进位规则」一步会崩——若右侧分量不归 0，下一轮访问的元组会跳过合法取值；断在「初始化全 0」则起点不在字典序最小元组，序列前后次序对不上。<\/p>\n<h2>推导一（推演）：Algorithm M 对 <span class=\"katex-inline\">n=2<\/span>、<span class=\"katex-inline\">(m_1,m_2)=(3,2)<\/span> 走一遍<\/h2>\n<p>取 <span class=\"katex-inline\">n=2<\/span>，约束 <span class=\"katex-inline\">0\\le a_1&lt;3<\/span>，<span class=\"katex-inline\">0\\le a_2&lt;2<\/span>。按算法步骤逐步展开：<\/p>\n<ol><li>\n<strong>初始化<\/strong>：<span class=\"katex-inline\">a_1\\leftarrow0<\/span>，<span class=\"katex-inline\">a_2\\leftarrow0<\/span>，<span class=\"katex-inline\">m_0\\leftarrow2<\/span>（约定辅助位）。\n<\/li><li>\n<strong>访问<\/strong> <span class=\"katex-inline\">(a_1,a_2)=(0,0)<\/span>。\n<\/li><li>\n<strong>准备加 1<\/strong>：置 <span class=\"katex-inline\">j\\leftarrow n=2<\/span>。\n<\/li><li>\n<strong>进位判断<\/strong>：<span class=\"katex-inline\">a_2=0<\/span>，未到上限 <span class=\"katex-inline\">m_2-1=1<\/span>，不进位；到 M5，<span class=\"katex-inline\">a_2\\leftarrow1<\/span>，回 M2。\n<\/li><li>\n<strong>访问<\/strong> <span class=\"katex-inline\">(0,1)<\/span>。再次加 1：<span class=\"katex-inline\">j=2<\/span>，<span class=\"katex-inline\">a_2=1=m_2-1<\/span>，置 <span class=\"katex-inline\">a_2\\leftarrow0<\/span>，<span class=\"katex-inline\">j\\leftarrow1<\/span>；<span class=\"katex-inline\">a_1=0&lt;2<\/span>，<span class=\"katex-inline\">a_1\\leftarrow1<\/span>，回 M2。\n<\/li><li>\n<strong>访问<\/strong> <span class=\"katex-inline\">(1,0)<\/span>、<span class=\"katex-inline\">(1,1)<\/span>；然后 <span class=\"katex-inline\">a_2<\/span> 再次归 0，<span class=\"katex-inline\">a_1\\leftarrow2<\/span>，访问 <span class=\"katex-inline\">(2,0)<\/span>、<span class=\"katex-inline\">(2,1)<\/span>。\n<\/li><li>\n再一次加 1：<span class=\"katex-inline\">a_2<\/span> 归 0，<span class=\"katex-inline\">a_1=2=m_1-1<\/span>，<span class=\"katex-inline\">a_1\\leftarrow0<\/span>，<span class=\"katex-inline\">j\\leftarrow0<\/span>，M5 判定 <span class=\"katex-inline\">j=0<\/span>，终止。\n<\/ol>\n<p>访问序列为 <span class=\"katex-inline\">(0,0),(0,1),(1,0),(1,1),(2,0),(2,1)<\/span>，共 <span class=\"katex-inline\">3\\times2=6<\/span> 个，与计数 <span class=\"katex-inline\">m_1m_2<\/span> 一致，无重复无遗漏。<\/p>\n<h2>推导二（证明）：计数生成不漏不重的依据<\/h2>\n<p>下面证明 Algorithm M 访问的元组集合恰好是约束 <span class=\"katex-inline\">0\\le a_j&lt;m_j<\/span> 下的全部取值，且每个只出现一次。<\/p>\n<ol><li>\n<strong>基数对应<\/strong>：把元组 <span class=\"katex-inline\">(a_1,\\dots,a_n)<\/span> 看成混合进制整数 <span class=\"katex-inline\">k=a_1m_2\\cdots m_n+\\cdots+a_{n-1}m_n+a_n<\/span>（低位对应 <span class=\"katex-inline\">a_n<\/span>），每个合法元组对应唯一的整数 <span class=\"katex-inline\">0\\le k&lt;\\prod m_j<\/span>。\n<\/li><li>\n<strong>加法保持合法范围<\/strong>：加 1 时，最右分量未到上限就直接加 1；到上限则归 0 并向左进位，这与普通 <span class=\"katex-inline\">m_j<\/span> 进制加法的进位规则逐条相同，因此结果仍落在 <span class=\"katex-inline\">[0,\\prod m_j)<\/span> 内。\n<\/li><li>\n<strong>严格递增<\/strong>：每次加 1 使对应整数 <span class=\"katex-inline\">k<\/span> 增加 1，所以访问序列的 <span class=\"katex-inline\">k<\/span> 严格递增，不会重复。\n<\/li><li>\n<strong>覆盖全部<\/strong>：从 <span class=\"katex-inline\">k=0<\/span> 开始连续加 1，直到 <span class=\"katex-inline\">k=\\prod m_j<\/span> 引发最高位进位（<span class=\"katex-inline\">j=0<\/span>）终止；区间 <span class=\"katex-inline\">[0,\\prod m_j)<\/span> 内每个整数都被经过一次，对应每个合法元组被访问一次。\n<\/ol>\n<p>四条合起来：总数为 <span class=\"katex-inline\">\\prod_{j=1}^n m_j<\/span>，序列字典序递增，不漏不重。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>去掉「右侧分量进位后归 0」<\/strong>：普通十进制加法里 <span class=\"katex-inline\">09+1=10<\/span>，个位必须回 0。若进位后 <span class=\"katex-inline\">a_j<\/span> 保留原值，例如 <span class=\"katex-inline\">(1,1)<\/span> 进位得到 <span class=\"katex-inline\">(2,1)<\/span> 而不是 <span class=\"katex-inline\">(2,0)<\/span>，序列里 <span class=\"katex-inline\">(2,0)<\/span> 被跳过，后续还会出现非法状态；<span class=\"katex-inline\">n=2<\/span> 的例子中总数从 6 掉到 5。\n<\/li><li>\n<strong>去掉「各分量上限 <span class=\"katex-inline\">m_j<\/span> 可以不同」的假设，强行按等长二进制处理<\/strong>：若某个分量实际允许取值 3 个却被当成 2 进制，取值 <span class=\"katex-inline\">2<\/span> 被漏掉；当成十进制则把不合法的取值 2 以上也放进序列。混合进制的分量上限必须与对象空间的定义逐条对齐。\n<\/li><li>\n<strong>要求把全部元组打印成实体清单再处理<\/strong>：<span class=\"katex-inline\">10!=3,628,800<\/span> 个排列若逐条写进文件或纸面，要占成千上万张纸；实际需要的只是对象在结构中瞬时存在、逐个被检查。把列举当成交付物，会让空间开销随对象总数线性膨胀。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：Algorithm M 像汽车里程表。低位轮转最快，低位到顶后归零、高位进一格；全部位数到顶后再加一格就溢出回零，对应算法终止。\n<\/li><li>\n实例：<span class=\"katex-inline\">n=4<\/span>、各分量基数 <span class=\"katex-inline\">m_j=2<\/span> 时，Algorithm M 就是从 0000 数到 1111 的二进制计数器，共 <span class=\"katex-inline\">2^4=16<\/span> 个四位串；<span class=\"katex-inline\">n=3<\/span>、十进制数字时共 <span class=\"katex-inline\">10^3=1000<\/span> 个三位数串。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n误解 1：生成组合对象的第一步是把结果存成一张大表。为什么错：书里明确区分 listing 与 generation，多数程序只需要逐个访问；预存全表在 <span class=\"katex-inline\">n!<\/span> 规模下空间代价不可接受。\n<\/li><li>\n误解 2：只要把分量按某种顺序排一遍就算「生成」。为什么错：顺序排列若不保证覆盖全部合法取值，就可能漏对象；计数法靠加法与进位规则保证覆盖，不是靠人工列全。\n<\/li><li>\n误解 3：混合进制与普通进制是两套无关机制。为什么错：混合进制把各分量基数替换成 <span class=\"katex-inline\">m_j<\/span>，进位规则完全一致；普通二进制、十进制只是 <span class=\"katex-inline\">m_j<\/span> 全部相同的特例。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">n=3<\/span>、<span class=\"katex-inline\">(m_1,m_2,m_3)=(2,2,3)<\/span> 时 Algorithm M 访问的前 6 个元组，并算总数。\n<\/li><li>\n为什么 Algorithm M 的输出次序与字典序一致？把低位分量走动更快这一点和词典逐位比较联系起来说明。\n<\/li><li>\n若算法终止条件写成「<span class=\"katex-inline\">a_1=m_1<\/span>」而不是进位到 <span class=\"katex-inline\">j=0<\/span>，会漏掉哪些元组？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n生成 ≠ 计数 ≠ 列举：计数只回答个数，列举落盘全部对象，生成让对象逐个短暂存在供检查。\n<\/li><li>\n混合进制元组总数是各分量范围之积 <span class=\"katex-inline\">\\prod m_j<\/span>；加法进位到最高位溢出即走尽。\n<\/li><li>\n嵌套循环与进位算法等价：内层循环对应低位快分量，外层循环对应高位慢分量。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章确立组合生成的问题框架，并给出最朴素的计数路线。下一章（ch02）会保留「走遍全部元组」的目标，但换掉次序：计数路线每一步可能改动多个分量，格雷码路线要求相邻两个元组只差一位；混合进制计数的进位机制会作为反射格雷码、子森林遍历的对照基准。排列生成（ch03）则把对象从元组换成序列，字典序思路与本章 Algorithm M 一脉相承。<\/p>", "kind": "chapter", "title": "7.2.1–7.2.1.1：组合生成的基本模式与 n 元组计数生成"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 生成所有元组和排列（第4卷 第2册 双语版）.pdf · p.8<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">7.2.1–7.2.1.1：组合生成的基本模式与 n 元组计数生成<\/a><\/span><\/div><h1>7.2.1.1：格雷码、混合进制与树形（子森林）生成<\/h1>\n<blockquote>对应原书 §7.2.1.1「Generating all n-tuples」的格雷码与树形生成部分（PDF 第 8–26 页；印刷页 3–21，偏移：印刷页 = PDF 页 − 5）。移位寄存器序列与 de Bruijn 循环（PDF 第 27–43 页）作为另一类路线在本章末尾交代。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用递归规则 <span class=\"katex-inline\">\\Gamma_0=\\epsilon<\/span>、<span class=\"katex-inline\">\\Gamma_{n+1}=0\\Gamma_n,\\ 1\\Gamma_n^{R}<\/span> 画出 3 位与 4 位反射格雷码序列；\n<\/li><li>\n用 <span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span> 从整数 <span class=\"katex-inline\">k<\/span> 算出格雷码，并说明相邻码为何只差一位；\n<\/li><li>\n写出混合进制反射格雷码的分量转换规则 <span class=\"katex-inline\">(50)<\/span>，区分反射型与模数型两种格雷十进制；\n<\/li><li>\n讲清无环生成算法中焦点指针、方向位的作用，以及子森林算法怎样把树遍历映射成位串变化；\n<\/li><li>\n说出移位寄存器/de Bruijn 循环路线与格雷码路线的差别，各自适合什么场景。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>计数生成保证不漏不重，但相邻两步常改动一大片分量；格雷码把全部元组排成相邻只差一位的序列，反射构造靠「前半段加 0、后半段反序加 1」递归长出，混合进制与子森林是这套思想在不同对象空间上的推广；无环算法用辅助指针把两次访问之间的操作数压到有界。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：反射二进制格雷码（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c03.md\" target=\"_blank\" rel=\"noopener\">概念 c03<\/a>。Algorithm M 按字典序走元组，图 10(a) 里 0000 到 1111 的轨迹在扇区边界容易出现误读；格雷二进制码把 <span class=\"katex-inline\">2^n<\/span> 个 <span class=\"katex-inline\">n<\/span> 位串排成相邻只翻一位的序列（PDF 第 8 页图 10(b)）。<span class=\"katex-inline\">n=4<\/span> 的标准格雷码从 0000, 0001, 0011, 0010, 0110, 0111, 0101, 0100 开始。递归定义：<span class=\"katex-inline\">\\Gamma_0=\\epsilon<\/span>（空串），<span class=\"katex-inline\">\\Gamma_{n+1}=0\\Gamma_n,\\ 1\\Gamma_n^{R}<\/span>，其中 <span class=\"katex-inline\">\\Gamma_n^{R}<\/span> 是 <span class=\"katex-inline\">\\Gamma_n<\/span> 的反序（PDF 第 8 页式 (5)）。显式公式：<span class=\"katex-inline\">k=(\\dots b_1b_0)_2<\/span> 的格雷表示 <span class=\"katex-inline\">a_j=b_j\\oplus b_{j+1}<\/span>，即 <span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span>（PDF 第 9 页式 (7)、(9)）。<\/p>\n<h3>2. 概念 2：混合进制反射格雷码（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。二进制反射思路推广到各分量基数 <span class=\"katex-inline\">m_j<\/span> 不同的混合进制：把普通混合进制数 <span class=\"katex-inline\">k=[b_{n-1},\\dots,b_0]_{m_{n-1},\\dots,m_0}<\/span> 映射到反射格雷等价量 <span class=\"katex-inline\">\\hat g(k)=[a_{n-1},\\dots,a_0]_{m_{n-1},\\dots,m_0}<\/span>（PDF 第 24 页式 (46)、(47)）。转换规则：定义部分累计值 <span class=\"katex-inline\">B_j=m_jB_{j+1}+b_j<\/span>，则<\/p>\n<div class=\"katex-block\">a_j=\\begin{cases}b_j,& B_{j+1}\\text{ 为偶}\\\\ m_j-1-b_j,& B_{j+1}\\text{ 为奇}\\end{cases}<\/div>\n<p>反向恢复：<span class=\"katex-inline\">b_j=a_j<\/span>（若 <span class=\"katex-inline\">a_{j+1}+a_{j+2}+\\cdots<\/span> 为偶），否则 <span class=\"katex-inline\">b_j=m_j-1-a_j<\/span>。反射格雷十进制里每个分量先从 0 升到 9 再降回 0；模数格雷十进制则始终加 1 模 10，从 9 绕回 0。<\/p>\n<h3>3. 概念 3：子森林与树形生成（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c04.md\" target=\"_blank\" rel=\"noopener\">概念 c04<\/a>。Koda 与 Ruskey 把反射格雷码推广到森林的「主子森林」：结点集合 <span class=\"katex-inline\">S<\/span> 满足「若 <span class=\"katex-inline\">x\\in S<\/span> 且 <span class=\"katex-inline\">x<\/span> 不是根，则 <span class=\"katex-inline\">x<\/span> 的父结点也在 <span class=\"katex-inline\">S<\/span> 中」（PDF 第 25 页）。退化的不分支森林对应混合进制元组；一般森林的主子森林用 Algorithm K 生成，每次只改变一个结点的在位状态，焦点指针与双向链表「当前边缘（current fringe）」控制变化时机。移位寄存器/de Bruijn 循环是另一条路线：用反馈移位寄存器产生一串数字，使每个 <span class=\"katex-inline\">n<\/span> 元组作为连续窗口恰好出现一次，服务于 de Bruijn 环与伪随机序列构造（PDF 第 27 页起）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[元组空间] --&gt; B{走法目标}\nB --&gt;|字典序, 可改多位| C[计数算法 M]\nB --&gt;|相邻只差一位| D[反射格雷码]\nD --&gt; D1[递归: 0Γ_n, 1Γ_n^R]\nD1 --&gt; D2[公式: a_j=b_j⊕b_{j+1}]\nD2 --&gt; E[混合进制推广]\nE --&gt; E1[反射型: 分量升降往返]\nE --&gt; E2[模数型: 模基数绕回]\nE1 --&gt; F[子森林/树形生成]\nF --&gt; G[焦点指针 + 边缘链表]\nD -. 另一路线 .-&gt; H[移位寄存器/de Bruijn 循环]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：若把「相邻只差一位」这条要求去掉，整条格雷码支路退回到计数路线；若把子森林的「父结点必须同时在位」这条约束去掉，生成的就不再是主子森林，而是普通子集。<\/p>\n<h2>推导一（推演）：递归构造 3 位反射格雷码并核验相邻关系<\/h2>\n<p>从 <span class=\"katex-inline\">\\Gamma_0=\\epsilon<\/span> 出发逐步展开：<\/p>\n<ol><li>\n<span class=\"katex-inline\">\\Gamma_1=0\\Gamma_0,\\ 1\\Gamma_0^{R}=0,\\ 1<\/span>，得到 <span class=\"katex-inline\">\\{0,1\\}<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">\\Gamma_2=0\\Gamma_1,\\ 1\\Gamma_1^{R}=00,01,\\ 11,10<\/span>，序列为 <span class=\"katex-inline\">00,01,11,10<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">\\Gamma_3=0\\Gamma_2,\\ 1\\Gamma_2^{R}<\/span>：前半段 <span class=\"katex-inline\">000,001,011,010<\/span>；<span class=\"katex-inline\">\\Gamma_2^{R}=10,11,01,00<\/span>，加前缀 1 得 <span class=\"katex-inline\">110,111,101,100<\/span>。合起来：\n<\/ol>\n<div class=\"katex-block\">000,001,011,010,110,111,101,100.<\/div>\n<p>核验相邻差异：000→001 改第 3 位；001→011 改第 2 位；011→010 改第 3 位；010→110 改第 1 位；110→111 改第 3 位；111→101 改第 2 位；101→100 改第 3 位。每一步恰好一位翻转。衔接处：<span class=\"katex-inline\">\\Gamma_2<\/span> 末串 <span class=\"katex-inline\">010<\/span> 与前半段前缀 0 不参与比较；跨到后半段首串 <span class=\"katex-inline\">110<\/span> 时，前半段末串 <span class=\"katex-inline\">010<\/span> 与后半段首串 <span class=\"katex-inline\">110<\/span> 只差第 1 位——这正是后半段取反序的作用：反序后首尾相接处共享同一后缀，跨段边界仍只翻高位。<\/p>\n<h2>推导二（证明）：公式 <span class=\"katex-inline\">a_j=b_j\\oplus b_{j+1}<\/span> 给出相邻单比特翻转<\/h2>\n<p>设当前整数为 <span class=\"katex-inline\">k<\/span>，下一个为 <span class=\"katex-inline\">k+1<\/span>。设 <span class=\"katex-inline\">k<\/span> 的二进制表示中末尾有 <span class=\"katex-inline\">\\rho(k)<\/span> 个 1（ruler function，<span class=\"katex-inline\">\\rho(k)<\/span> 是整除 <span class=\"katex-inline\">k<\/span> 的最大 2 的幂的指数），则加 1 后：低位 <span class=\"katex-inline\">\\rho(k)<\/span> 位的 1 变 0，第 <span class=\"katex-inline\">\\rho(k)<\/span> 位的 0 变 1，更高位不变。<\/p>\n<ol><li>\n对低位 <span class=\"katex-inline\">j&lt;\\rho(k)<\/span>：<span class=\"katex-inline\">b_j<\/span> 与 <span class=\"katex-inline\">b_{j+1}<\/span> 同时翻转，<span class=\"katex-inline\">a_j=b_j\\oplus b_{j+1}<\/span> 两个量都变，异或结果不变。\n<\/li><li>\n对 <span class=\"katex-inline\">j=\\rho(k)<\/span>：<span class=\"katex-inline\">b_j<\/span> 由 0 变 1，<span class=\"katex-inline\">b_{j+1}<\/span> 不变，<span class=\"katex-inline\">a_j<\/span> 翻转。\n<\/li><li>\n对 <span class=\"katex-inline\">j&gt;\\rho(k)<\/span>：<span class=\"katex-inline\">b_j,b_{j+1}<\/span> 都不变，<span class=\"katex-inline\">a_j<\/span> 不变。\n<\/ol>\n<p>所以格雷码从 <span class=\"katex-inline\">g(k)<\/span> 到 <span class=\"katex-inline\">g(k+1)<\/span> 只有第 <span class=\"katex-inline\">\\rho(k)<\/span> 位翻转，相邻两码相差一位。反向解码用 <span class=\"katex-inline\">b_j=a_j\\oplus a_{j+1}\\oplus a_{j+2}\\oplus\\cdots<\/span>，高位以后 <span class=\"katex-inline\">a<\/span> 为 0，这个无限异或实际有限。<\/p>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>后半段不取反序（直接 <span class=\"katex-inline\">1\\Gamma_n<\/span>）<\/strong>：<span class=\"katex-inline\">\\Gamma_2<\/span> 若写成 <span class=\"katex-inline\">00,01,11,10<\/span> 已用反序；若后半段同序，<span class=\"katex-inline\">n=2<\/span> 会得到 <span class=\"katex-inline\">00,01,10,11<\/span>，跨段处 <span class=\"katex-inline\">01\\to10<\/span> 两位同时变，单步翻转条件在衔接边界被破坏。\n<\/li><li>\n<strong>混合进制反射规则按二进制异或硬套<\/strong>：基数 <span class=\"katex-inline\">m_j=3<\/span> 时分量取值 0,1,2，没有「翻转一位」的位运算对应；若直接用 <span class=\"katex-inline\">a_j=b_j\\oplus b_{j+1}<\/span>，分量取值会跑出 <span class=\"katex-inline\">\\{0,1,2\\}<\/span>，合法元组被破坏。混合进制必须按累计奇偶性做升降往返。\n<\/li><li>\n<strong>子森林去掉父结点约束<\/strong>：允许选某结点而不选其父结点，集合数量从「主子森林」变成全部 <span class=\"katex-inline\">2^n<\/span> 个子集；两者计数口径不同，Algorithm K 的边缘链表不变量也不再成立。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：反射格雷码像翻煎饼——先把上层煎好的一排原样留下，再把下层一排翻面排回去，两端相接处自然只翻最上面一层。\n<\/li><li>\n实例：<span class=\"katex-inline\">n=3<\/span> 时标准格雷码翻转位次序为 <span class=\"katex-inline\">\\rho(1),\\rho(2),\\dots,\\rho(7)=0,1,0,2,0,1,0<\/span>，对应上面推演一的第 3、2、3、1、3、2、3 位；中国环谜（Chinese ring puzzle）的解环动作次序正是这个翻转序列。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n误解 1：格雷码就是「0 和 1 交替排列的码表」。为什么错：格雷码的约束是相邻对象只差一个分量，码表里 0 与 1 的密度并不要求交替；标准反射格雷码只是众多 Gray cycle 中的一种。\n<\/li><li>\n误解 2：混合进制格雷码与二进制格雷码用同一个异或公式。为什么错：异或只在基数 2 时有定义；<span class=\"katex-inline\">m_j&gt;2<\/span> 时靠累计奇偶性决定分量是保留还是镜像（<span class=\"katex-inline\">m_j-1-b_j<\/span>）。\n<\/li><li>\n误解 3：树形生成与元组生成是两类互不相干的问题。为什么错：退化森林（每条链一棵树）的主子森林计数就是混合进制元组；树结构是元组空间加了「父在子先」的约束，遍历机制共享焦点指针与边缘链表这套设计。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">\\Gamma_3<\/span> 全部 8 个码，并标出每一步翻转的位编号。\n<\/li><li>\n用 <span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span> 算出 <span class=\"katex-inline\">k=5<\/span>、<span class=\"katex-inline\">k=6<\/span> 的格雷码（3 位形式），核验二者只差一位。\n<\/li><li>\n反射型与模数型三位格雷十进制在 009→010 这一步各怎样变化？差别落在哪条规则上？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n反射构造：<span class=\"katex-inline\">\\Gamma_{n+1}=0\\Gamma_n,\\ 1\\Gamma_n^{R}<\/span>；反序保证跨段边界只翻高位。\n<\/li><li>\n位级映射：<span class=\"katex-inline\">a_j=b_j\\oplus b_{j+1}<\/span>，<span class=\"katex-inline\">g(k)=k\\oplus\\lfloor k/2\\rfloor<\/span>；加 1 时只有 <span class=\"katex-inline\">\\rho(k)<\/span> 位翻转。\n<\/li><li>\n树视角：主子森林 = 父结点在位约束下的子集；焦点指针控制边缘生长与收缩，每次改一个结点状态。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章把元组空间从字典序走法推进到低改动走法，为 ch03 排列生成的邻位换位埋下对照：格雷码在 <span class=\"katex-inline\">n<\/span> 维立方体上找 Hamilton 路/圈，邻位换位在排列图上找 Hamilton 路/圈，两者都是「相邻对象改动最小」的组合遍历。混合进制反射规则还直接出现在 Algorithm P 的逆序表读法中：邻位换位排列的逆序表次序等价于基数 <span class=\"katex-inline\">(1,2,\\dots,n)<\/span> 的反射格雷码。<\/p>", "kind": "chapter", "title": "7.2.1.1：格雷码、混合进制与树形（子森林）生成"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 生成所有元组和排列（第4卷 第2册 双语版）.pdf · p.44<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">7.2.1.1：格雷码、混合进制与树形（子森林）生成<\/a><\/span><\/div><h1>7.2.1.2：排列的字典序、邻位换位与 plain changes<\/h1>\n<blockquote>对应原书 §7.2.1.2「Generating all permutations」的字典序算法、邻位换位算法与过渡表部分（PDF 第 44–48 页；印刷页 39–43，偏移：印刷页 = PDF 页 − 5）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n对一个给定排列，按 Algorithm L 三步构造它的字典序下一个排列，并说明支点为何从右往左找；\n<\/li><li>\n写出逆序表 <span class=\"katex-inline\">c_1\\dots c_n<\/span> 与方向位 <span class=\"katex-inline\">o_1\\dots o_n<\/span> 的约束 <span class=\"katex-inline\">0\\le c_j&lt;j<\/span>，跟踪 Algorithm P 一次邻位交换的完整判定过程；\n<\/li><li>\n解释为什么邻位换位序列中排列的奇偶性交替出现；\n<\/li><li>\n说出 plain changes（Algorithm P）与 17 世纪教堂敲钟传统、Trotter 计算机实现之间的历史脉络；\n<\/li><li>\n对比字典序与邻位换位两类次序在单步改动量、平均查找代价上的差别。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>排列生成有两条经典路线：字典序路线（Algorithm L）从最右可增大的支点出发，交换最小可换元素再把后缀反序，保证下一个排列恰是字典序后继；邻位换位路线（Algorithm P）用逆序表加方向位驱动，每次只交换一对相邻元素，<span class=\"katex-inline\">n!-1<\/span> 次交换走遍全部 <span class=\"katex-inline\">n!<\/span> 个排列，并能形成回到起点的 Hamilton 圈。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：字典序排列 Algorithm L（难度：进阶）<\/h3>\n<p>详见 <a href=\"../concepts/c05.md\" target=\"_blank\" rel=\"noopener\">概念 c05<\/a>。输入序列先按非降序排好 <span class=\"katex-inline\">a_1\\le a_2\\le\\cdots\\le a_n<\/span>，算法访问全部排列并按字典序输出（PDF 第 44 页）。书里以多重集 <span class=\"katex-inline\">\\{1,2,2,3\\}<\/span> 为例，字典序为 <span class=\"katex-inline\">1223,1232,1322,2123,2132,2213,2231,2312,2321,3122,3212,3221<\/span>。算法三步对应通用后继构造：找最大的可增大支点 <span class=\"katex-inline\">j<\/span>；用后缀中大于 <span class=\"katex-inline\">a_j<\/span> 的最小元素交换；把后缀重排成字典序最小形态。该算法可追溯到 14 世纪印度的 Nārāyaṇa Paṇḍita，1784 年 Hindenburg 的前言中也出现过，此后被反复重新发现（PDF 第 45 页）。<\/p>\n<h3>2. 概念 2：邻位换位 Algorithm P 与逆序表（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c06.md\" target=\"_blank\" rel=\"noopener\">概念 c06<\/a>。相邻元素互换是对排列最简单的改动；第 5 章讲过任何排列都能靠一串邻位交换排好，反过来从有序出发也能靠邻位交换走到任意排列。逆序表 <span class=\"katex-inline\">c_1\\dots c_n<\/span> 中 <span class=\"katex-inline\">c_j<\/span> 是排在 <span class=\"katex-inline\">j<\/span> 右边且小于 <span class=\"katex-inline\">j<\/span> 的元素个数，约束 <span class=\"katex-inline\">0\\le c_j&lt;j<\/span>（PDF 第 46 页式 (5)）。方向位 <span class=\"katex-inline\">o_j\\in\\{+1,-1\\}<\/span> 控制 <span class=\"katex-inline\">c_j<\/span> 增减。Algorithm P 从右向左检查哪个 <span class=\"katex-inline\">c_j<\/span> 可以改变，可行时交换 <span class=\"katex-inline\">a_{j-o_j}<\/span> 与 <span class=\"katex-inline\">a_{j-o_j+1}<\/span> 并更新 <span class=\"katex-inline\">c_j<\/span>；不可行则翻转方向、退回下一层。多重集有重复元素时这种 Gray 式序列不一定存在：<span class=\"katex-inline\">\\{1,1,2,2\\}<\/span> 的邻接交换图没有 Hamilton 路（PDF 第 46 页）。<\/p>\n<h3>3. 概念 3：plain changes 与过渡表 Algorithm T<\/h3>\n<p>Algorithm P 每访问一个排列只做一次交换，排列奇偶性因此交替出现；逆序总数 <span class=\"katex-inline\">c_1+\\cdots+c_n<\/span> 的奇偶性可直接从表上读出，需要全部偶排列时跳过奇数个即可。同一套过渡序列若要反复使用，可先用 Algorithm T 算出交换位置表 <span class=\"katex-inline\">t[1],\\dots,t[n!-1]<\/span>，运行时按表交换 <span class=\"katex-inline\">a_{t[k]}<\/span> 与 <span class=\"katex-inline\">a_{t[k]+1}<\/span>（PDF 第 48 页）。<span class=\"katex-inline\">n=4<\/span> 的过渡表为 <span class=\"katex-inline\">(3,2,1,3,1,2,3,1,3,2,1,3,1,2,3,1,3,2,1,3,1,2,3)<\/span>。这套方法源自 17 世纪英国教堂敲钟的 plain changes 传统，F. R. Trotter 在 1962 年发表了第一个计算机实现。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[当前排列] --&gt; B[Algorithm L: 字典序后继]\nB --&gt; B1[从右找最右 a_j&amp;lt;a_{j+1}]\nB1 --&gt; B2[后缀找大于 a_j 的最小元素交换]\nB2 --&gt; B3[后缀反序]\nA --&gt; C[Algorithm P: 邻位换位]\nC --&gt; C1[逆序表 c_j, 方向位 o_j]\nC1 --&gt; C2[从右找可改变的 j]\nC2 --&gt; C3[交换相邻一对, 更新 c_j]\nC3 --&gt; C1\nC2 --&gt;|不可行| C4[翻转方向, 退一层]\nC4 --&gt; C2<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：L 路线断在「后缀反序」会产生字典序偏大的后继；P 路线断在「方向位翻转」会使某个 <span class=\"katex-inline\">c_j<\/span> 越出 <span class=\"katex-inline\">0\\le c_j&lt;j<\/span> 的合法范围，遍历覆盖就不再完整。<\/p>\n<h2>推导一（推演）：Algorithm L 对 1234 求后继序列<\/h2>\n<p>从初始排列 <span class=\"katex-inline\">1234<\/span> 开始，逐次应用 L2–L4：<\/p>\n<ol><li>\n当前 <span class=\"katex-inline\">1234<\/span>：L2 找最右 <span class=\"katex-inline\">a_j&lt;a_{j+1}<\/span>，<span class=\"katex-inline\">j=3<\/span>（<span class=\"katex-inline\">a_3=3&lt;a_4=4<\/span>）；L4 后缀只有 4，交换 <span class=\"katex-inline\">a_3<\/span> 与 <span class=\"katex-inline\">a_4<\/span> 得 <span class=\"katex-inline\">1243<\/span>。\n<\/li><li>\n当前 <span class=\"katex-inline\">1243<\/span>：后缀 <span class=\"katex-inline\">a_3a_4=43<\/span> 递减，<span class=\"katex-inline\">j=2<\/span>（<span class=\"katex-inline\">a_2=2&lt;a_3=4<\/span>）；后缀中大于 2 的最小元素是 3（位置 4），交换得 <span class=\"katex-inline\">1342<\/span>；后缀 <span class=\"katex-inline\">42<\/span> 反序为 <span class=\"katex-inline\">24<\/span>，得 <span class=\"katex-inline\">1324<\/span>。\n<\/li><li>\n当前 <span class=\"katex-inline\">1324<\/span>：<span class=\"katex-inline\">j=3<\/span>，交换 2 与 4 得 <span class=\"katex-inline\">1342<\/span>。\n<\/li><li>\n当前 <span class=\"katex-inline\">1342<\/span>：后缀 <span class=\"katex-inline\">42<\/span> 递减，<span class=\"katex-inline\">j=2<\/span>（<span class=\"katex-inline\">3&lt;4<\/span>）；后缀大于 3 的最小元素是 4，交换得 <span class=\"katex-inline\">1432<\/span>；后缀 <span class=\"katex-inline\">32<\/span> 反序为 <span class=\"katex-inline\">23<\/span>，得 <span class=\"katex-inline\">1423<\/span>。\n<\/li><li>\n继续下去：<span class=\"katex-inline\">1432\\to2134\\to2143\\to2314\\to2341\\to2413\\to2431\\to3124\\to\\cdots<\/span>，直到 <span class=\"katex-inline\">4321<\/span> 时 L2 找不到 <span class=\"katex-inline\">j<\/span>，终止。\n<\/ol>\n<p>前几个后继为 <span class=\"katex-inline\">1234,1243,1324,1342,1423,1432,2134,\\dots<\/span>，与字典序一致。<\/p>\n<h2>推导二（证明）：Algorithm P 每次交换后逆序表仍合法且遍历全部排列<\/h2>\n<p>下面给出完整证明，证明分双射、同步更新、覆盖性三步展开。<\/p>\n<ol><li>\n<strong>逆序表与排列一一对应<\/strong>：对 <span class=\"katex-inline\">\\{1,\\dots,n\\}<\/span> 的排列，<span class=\"katex-inline\">c_j<\/span> 唯一确定；反过来，任取满足 <span class=\"katex-inline\">0\\le c_j&lt;j<\/span> 的数组 <span class=\"katex-inline\">(c_1,\\dots,c_n)<\/span>，按从 <span class=\"katex-inline\">j=n<\/span> 到 <span class=\"katex-inline\">1<\/span> 的顺序把 <span class=\"katex-inline\">j<\/span> 插入当前序列的相应位置，可重建唯一排列。合法逆序表总数为 <span class=\"katex-inline\">\\prod_{j=1}^n j=n!<\/span>。\n<\/li><li>\n<strong>每次改变只动一个 <span class=\"katex-inline\">c_j<\/span><\/strong>：P4 从 <span class=\"katex-inline\">j=n<\/span> 向下检查；<span class=\"katex-inline\">c_j+o_j<\/span> 落在 <span class=\"katex-inline\">[0,j-1]<\/span> 内则该分量可走；越界则 P7 翻转 <span class=\"katex-inline\">o_j<\/span> 并退到 <span class=\"katex-inline\">j-1<\/span>。这等价于在混合进制 <span class=\"katex-inline\">(1,2,\\dots,n)<\/span> 的反射格雷码上推进一位。\n<\/li><li>\n<strong>交换对应逆序表变化<\/strong>：可行时交换相邻两项 <span class=\"katex-inline\">a_{j-o_j}<\/span> 与 <span class=\"katex-inline\">a_{j-o_j+1}<\/span>，相邻两项互换使逆序总数改变 <span class=\"katex-inline\">\\pm1<\/span>，<span class=\"katex-inline\">c_j<\/span> 同步更新为 <span class=\"katex-inline\">c_j+o_j<\/span>；其余 <span class=\"katex-inline\">c<\/span> 值不变。\n<\/li><li>\n<strong>覆盖性证明<\/strong>：控制表走遍全部合法 <span class=\"katex-inline\">(c_1,\\dots,c_n)<\/span>，由第 1 条一一对应关系，全部排列被访问一次；两次访问之间恰好一次邻位交换。这条覆盖性证明与计数口径 <span class=\"katex-inline\">n!<\/span> 互相校验。\n<\/ol>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>支点从左往右找<\/strong>：找到的是最左可增大位置，交换并反序后缀后得到的不是字典序后继，而是前缀尽量早变的别的次序；<span class=\"katex-inline\">1234<\/span> 会先走到 <span class=\"katex-inline\">2134<\/span> 而不是 <span class=\"katex-inline\">1243<\/span>，与词典次序不符。\n<\/li><li>\n<strong>Algorithm P 不维护方向位，只让 <span class=\"katex-inline\">c_j<\/span> 单向递增<\/strong>：<span class=\"katex-inline\">c_j<\/span> 到上限 <span class=\"katex-inline\">j-1<\/span> 后无路可走，序列在该层卡死；<span class=\"katex-inline\">n=3<\/span> 时只能走出一部分排列，无法到达回绕方向上的对象。\n<\/li><li>\n<strong>对有重复元素的多重集强行套用邻位换位<\/strong>：<span class=\"katex-inline\">\\{1,1,2,2\\}<\/span> 的邻接交换图连通但无 Hamilton 路，硬跑会在中途断掉；重复元素的排列生成应回到字典序路线 Algorithm L。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：字典序后继像翻字典——先把靠前的字母压到最小，只有当前缀下所有词都翻完，才动前一个字母；L4 反序后缀就是把后缀重置成最小形态。\n<\/li><li>\n实例：<span class=\"katex-inline\">n=3<\/span> 的邻位换位序列为 <span class=\"katex-inline\">123,132,312,321,231,213<\/span>；相邻两项 <span class=\"katex-inline\">123\\to132<\/span> 交换末两位，<span class=\"katex-inline\">132\\to312<\/span> 交换前两位，每步改动一对相邻元素，末位 <span class=\"katex-inline\">213<\/span> 再交换可回到 <span class=\"katex-inline\">123<\/span>，构成圈。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n误解 1：下一个排列只要把右边第一个能变大的位置换大就行。为什么错：换大之后后缀仍可能是递减的大形态，必须反序重置成最小后缀，否则后继次序偏大。\n<\/li><li>\n误解 2：邻位换位算法只适用于整数排列。为什么错：元素可以是任意可比较对象；关键是元素互异，重复值会破坏邻接图的 Hamilton 路存在性。\n<\/li><li>\n误解 3：Algorithm P 每步做的查找和交换一样便宜。为什么错：交换本身一次完成，但 P4–P7 的方向回退会跨过不可行的层；书里指出 <span class=\"katex-inline\">n<\/span> 个排列里有 <span class=\"katex-inline\">(n-1)/n<\/span> 次不必走 P6、P7，摊还后单步代价很低，但并非每步常数。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n对排列 <span class=\"katex-inline\">31254<\/span> 求字典序下一个排列，写出支点位置、交换元素与反序后的结果。\n<\/li><li>\n写出 <span class=\"katex-inline\">123<\/span> 在 Algorithm P 下的逆序表与方向位初始值，并跟踪第一次交换后 <span class=\"katex-inline\">c<\/span> 表的变化。\n<\/li><li>\n为什么 <span class=\"katex-inline\">\\{1,1,2,2\\}<\/span> 不能用邻位换位走遍全部多重排列？用邻接图连通但无 Hamilton 路解释。\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nL 三步：找最右可增大支点 → 后缀换最小可换元素 → 后缀反序；支点找不到即终止。\n<\/li><li>\nP 驱动：逆序表 <span class=\"katex-inline\">0\\le c_j&lt;j<\/span> + 方向位 <span class=\"katex-inline\">o_j<\/span>；可行交换相邻一对，不可行翻方向退一层。\n<\/li><li>\n邻位交换一次逆序数变 <span class=\"katex-inline\">\\pm1<\/span>，排列奇偶交替；过渡表可预计算复用。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章两条路线分别承接 ch02 的两类元组走法：字典序对应计数路线，邻位换位对应格雷码路线。下一章（ch04）把视角抬到一般生成器：Sims 表把排列分解成逐层选择的乘积，Algorithm G 在一棵隐式树上前序遍历；Algorithm L 与 Algorithm P 都是这个一般框架的特例，受限分支剪枝与复杂度比较也在那一章展开。<\/p>", "kind": "chapter", "title": "7.2.1.2：排列的字典序、邻位换位与 plain changes"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 生成所有元组和排列（第4卷 第2册 双语版）.pdf · p.51<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">7.2.1.2：排列的字典序、邻位换位与 plain changes<\/a><\/span><\/div><h1>7.2.1.2：一般排列生成器、受限枚举与复杂度分析<\/h1>\n<blockquote>对应原书 §7.2.1.2 后半：置换群与 Sims 表、Algorithm G 一般生成器、对偶与循环移位、Cayley 图生成元、受限前缀算法 X、拓扑排序算法 V，以及「何时不该全排列枚举」的讨论（PDF 第 51–64 页；印刷页 46–64，偏移：印刷页 = PDF 页 − 5；PDF 第 50 页为错置他书页面，未采用）。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出排列的两行表示、循环表示与左右乘法（左乘改位置、右乘改值）的区别；\n<\/li><li>\n按 Sims 表分解写出 Algorithm G 的不变量 <span class=\"katex-inline\">a_0a_1\\cdots a_{n-1}=\\sigma(1,c_1)\\sigma(2,c_2)\\cdots\\sigma(n-1,c_{n-1})<\/span>，解释控制表加 1 与隐式树前序遍历的对应；\n<\/li><li>\n识别 reverse colex、Ord–Smith、Heap 方法、循环移位 Algorithm C、Ehrlich 星换位 Algorithm E 各自在一般框架里的参数选择；\n<\/li><li>\n用 Cayley 图与 Theorem R 判断「极少基本操作能否走遍全部排列」，讲清对偶生成器的限制；\n<\/li><li>\n估算各类生成器的摊还代价，说明拓扑排序生成与剪枝加速的关系，判断哪些问题不该走 <span class=\"katex-inline\">n!<\/span> 枚举。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>把每个排列看成若干层置换的乘积，Sims 表给出唯一分解；Algorithm G 用混合进制控制表逐层进位，在一棵隐式树上前序遍历，换不同的 <span class=\"katex-inline\">\\sigma(k,j)<\/span> 就得到字典序、邻位换位、循环移位等一大族生成器；评价生成器要看摊还代价、能否跳过不可接受分支，以及问题本身是否存在 <span class=\"katex-inline\">O(n\\log n)<\/span> 或 <span class=\"katex-inline\">O(n^3)<\/span> 的更优解法。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1. 概念 1：Sims 表与一般生成器 Algorithm G（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c07.md\" target=\"_blank\" rel=\"noopener\">概念 c07<\/a>。书里改用 0 起点记号 <span class=\"katex-inline\">a_0a_1\\cdots a_{n-1}<\/span> 表示 <span class=\"katex-inline\">\\{0,\\dots,n-1\\}<\/span> 的排列。置换乘法从左到右：位置置换是左乘 <span class=\"katex-inline\">\\beta<\/span>（<span class=\"katex-inline\">a_j<\/span> 换成 <span class=\"katex-inline\">a_j\\beta<\/span>），值置换是右乘 <span class=\"katex-inline\">\\beta<\/span>（<span class=\"katex-inline\">a_j<\/span> 换成 <span class=\"katex-inline\">\\beta a_j<\/span>）（PDF 第 52 页）。群是乘法封闭的非空置换集合。Sims 表是一族子集 <span class=\"katex-inline\">S_1,\\dots,S_{n-1}<\/span>，每个 <span class=\"katex-inline\">S_k<\/span> 恰含一个把 <span class=\"katex-inline\">k<\/span> 映射到相应值、固定更大元素的置换；Lemma S 证明群中每个元素唯一写成 <span class=\"katex-inline\">\\sigma(1,c_1)\\sigma(2,c_2)\\cdots\\sigma(n-1,c_{n-1})<\/span>。Algorithm G 维护控制表 <span class=\"katex-inline\">c_n\\dots c_1<\/span>，G3 给混合进制控制表加 1，G4 施加相应置换，不变量即上式（PDF 第 52 页）。<\/p>\n<h3>2. 概念 2：框架内的特例与受限剪枝（难度：进阶）<\/h3>\n<p>选不同的 <span class=\"katex-inline\">\\sigma(k,j)<\/span> 得到已知算法：reverse colex 取 <span class=\"katex-inline\">\\sigma(k,j)=(k-j\\ k-j+1\\ \\dots\\ k)<\/span>（式 (18)）；Ord–Smith 取 <span class=\"katex-inline\">\\sigma(k,j)=(k\\ \\dots\\ 1\\ 0)^j<\/span>（式 (23)），G4 只需一次翻转；Heap 方法让 G4 每次做单个对换，<span class=\"katex-inline\">\\tau(k,j)\\omega(k-1)^-<\/span> 在 <span class=\"katex-inline\">k<\/span> 偶时为 <span class=\"katex-inline\">(k\\ 0)<\/span>、奇时为 <span class=\"katex-inline\">(k\\ j-1)<\/span>（式 (27)）。Algorithm G 先把 <span class=\"katex-inline\">a_0\\cdots a_{k-1}<\/span> 的全部排列走完再动 <span class=\"katex-inline\">a_k<\/span>，因此后缀不可接受时可整枝跳过：G2.0 检查后缀，G2.1 沿控制表退到父结点再走向右兄弟（PDF 第 53 页图 20）。Algorithm X 用循环链表维护未用元素，按前缀测试 <span class=\"katex-inline\">t_k(a_1,\\dots,a_k)<\/span> 逐位进入或回退，是受限前缀排列生成的另一套实现（PDF 第 54 页）。<\/p>\n<h3>3. 概念 3：对偶算法、生成元与复杂度边界（难度：高难）<\/h3>\n<p>详见 <a href=\"../concepts/c08.md\" target=\"_blank\" rel=\"noopener\">概念 c08<\/a>。对偶形式把分解写成逆序乘积 <span class=\"katex-inline\">\\alpha=\\sigma_{n-1}^-\\cdots\\sigma_2^-\\sigma_1^-<\/span>，对应 Algorithm H。对偶框架下循环移位 Algorithm C 程序最短：C3 对前缀做循环移位，不行则缩短 <span class=\"katex-inline\">k<\/span>（PDF 第 56 页）。Ehrlich Algorithm E 用首元素星换位 <span class=\"katex-inline\">a_0\\leftrightarrow a_{b_k}<\/span>，E5 做一次翻转子表，平均交换次数低于 <span class=\"katex-inline\">0.18n<\/span>（PDF 第 57 页）。Cayley 图以置换为顶点、生成元为边；Theorem R 给出两生成元存在 Hamilton 圈的必要条件，循环移位 <span class=\"katex-inline\">\\sigma<\/span> 加邻对换 <span class=\"katex-inline\">\\tau<\/span> 在 <span class=\"katex-inline\">n\\ge4<\/span> 偶数时无 Hamilton 圈（PDF 第 58 页）。性能方面，Heap 精简法在顺序数组上每排列约 <span class=\"katex-inline\">2.77\\mu+5.69v<\/span> 量级，<span class=\"katex-inline\">r<\/span> 个寄存器展开后趋近两次存储指令的代价；拓扑排序 Algorithm V 把 <span class=\"katex-inline\">n<\/span> 个元素的可行排列逐个左移生成，运行时间是 <span class=\"katex-inline\">M=t_n+\\cdots+t_1<\/span>、<span class=\"katex-inline\">N=t_n<\/span> 的线性组合（PDF 第 63–64 页）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[排列群] --&gt; B[Sims 表分解: σ1σ2…σn-1]\nB --&gt; C[Algorithm G 控制表进位]\nC --&gt; D{选 σ(k,j)}\nD --&gt; D1[reverse colex]\nD --&gt; D2[Ord–Smith 翻转]\nD --&gt; D3[Heap 单对换]\nD --&gt; D4[对偶 Algorithm H]\nC --&gt; E[后缀不可接受?]\nE -- 是 --&gt; F[G2.1 退父结点, 跳整枝]\nE -- 否 --&gt; G[访问排列]\nA --&gt; H[Cayley 图: 生成元为边]\nH --&gt; I[Theorem R: Hamilton 圈必要条件]\nG --&gt; J[摊还代价与问题结构判断]\nJ --&gt; K[存在更优解法时不做 n! 枚举]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：分解唯一性是整棵树能不重不漏遍历的根基；若 Sims 表某层 <span class=\"katex-inline\">S_k<\/span> 缺了应有的置换，对应子树对象无法到达。剪枝只能跳不可接受后缀，前缀本身的测试必须在进入该层时完成，顺序错了会漏合法对象。<\/p>\n<h2>推导一（推演）：Algorithm G 在 <span class=\"katex-inline\">n=4<\/span> 隐式树上的一次进位<\/h2>\n<p>按图 19 的树：控制串 <span class=\"katex-inline\">c_3c_2c_1<\/span> 满足 <span class=\"katex-inline\">0\\le c_3&lt;3,\\ 0\\le c_2&lt;2,\\ 0\\le c_1&lt;1<\/span>（注意 <span class=\"katex-inline\">c_1<\/span> 恒为 0）。<\/p>\n<ol><li>\n不变量：当前排列 <span class=\"katex-inline\">a_0a_1a_2a_3=\\sigma(1,c_1)\\sigma(2,c_2)\\sigma(3,c_3)<\/span>。\n<\/li><li>\n控制表从 <span class=\"katex-inline\">121<\/span> 变到 <span class=\"katex-inline\">200<\/span>：先看最低位 <span class=\"katex-inline\">c_1<\/span>，进位到 <span class=\"katex-inline\">c_2<\/span>，<span class=\"katex-inline\">c_2<\/span> 到上限再进位到 <span class=\"katex-inline\">c_3<\/span>。\n<\/li><li>\nG4 施加 <span class=\"katex-inline\">\\tau(3,2)\\omega(2)^-=\\tau(3,2)\\sigma(2,2)^-\\sigma(1,1)^-<\/span>：左乘 <span class=\"katex-inline\">\\sigma(1,1)^-<\/span> 从结点 121 退到 12；再左乘 <span class=\"katex-inline\">\\sigma(2,2)^-<\/span> 退到 1；随后 <span class=\"katex-inline\">\\tau(3,2)=\\sigma(3,2)\\sigma(3,1)^-<\/span> 从 1 走到右兄弟 200。\n<\/li><li>\n这一串动作沿树从结点 121 上溯到祖先 1，再下行到右兄弟 200，对应前序遍历中跨过一棵被走完的子树。\n<\/ol>\n<h2>推导二（证明）：Algorithm G 不漏不重的依据<\/h2>\n<ol><li>\n<strong>唯一分解<\/strong>：由 Lemma S，每个 <span class=\"katex-inline\">\\alpha\\in G<\/span> 有唯一表示 <span class=\"katex-inline\">\\alpha=\\sigma(1,c_1)\\cdots\\sigma(n-1,c_{n-1})<\/span>，其中 <span class=\"katex-inline\">c_k\\in\\{0,\\dots,k\\}<\/span>。控制表取值总数 <span class=\"katex-inline\">\\prod_{k=1}^{n-1}(k+1)=n!<\/span>，与排列总数相等。\n<\/li><li>\n<strong>控制表连续进位<\/strong>：G3 对 <span class=\"katex-inline\">c_n\\dots c_1<\/span> 做混合进制加 1，从全 0 开始连续走到溢出，每个合法控制串出现一次。\n<\/li><li>\n<strong>不变量保持<\/strong>：G4 按式 (15)、(16) 定义 <span class=\"katex-inline\">\\tau(k,j)=\\sigma(k,j)\\sigma(k,j-1)^-<\/span>、<span class=\"katex-inline\">\\omega(k)=\\sigma(1,1)\\cdots\\sigma(k,k)<\/span>，施加 <span class=\"katex-inline\">\\tau(k,c_k)\\omega(k-1)^-<\/span> 后，新控制串对应的乘积分解与新排列一致；不变量 (17) 在每步成立。\n<\/li><li>\n<strong>结论<\/strong>：控制串一一对应排列，遍历控制串即遍历全部排列，每个排列恰好访问一次。\n<\/ol>\n<h2>反事实：改掉某个条件会怎样<\/h2>\n<ul><li>\n<strong>允许 G4 用任意置换而不按 <span class=\"katex-inline\">\\tau,\\omega<\/span> 规则构造<\/strong>：不变量 (17) 失效，同一个控制串可能对应多个排列，或两个控制串落到同一排列，覆盖性不再有保证。\n<\/li><li>\n<strong>跳过后缀时只改输出不回退控制表<\/strong>：后缀不可接受却留在当前结点，下一次进位会在被跳过的子树里继续走，产生非法排列；G2.1 必须沿 <span class=\"katex-inline\">\\sigma(k,k)^-<\/span> 上溯到父结点再走向右兄弟。\n<\/li><li>\n<strong>对 Assignment 问题或旅行商问题硬套全排列枚举<\/strong>：书里指出方阵列置换最大化对角和可用 <span class=\"katex-inline\">O(n^3)<\/span> 解法，排序找最优安排只需 <span class=\"katex-inline\">O(n\\log n)<\/span>；枚举代价随 <span class=\"katex-inline\">n!<\/span> 膨胀，<span class=\"katex-inline\">n<\/span> 稍大就不可行。生成器只在确实需要逐个检查每个排列时才值得用。\n<\/ul>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：Algorithm G 的隐式树像目录树——先翻完第一目录下所有子目录，再进第二目录；控制表进位就是按前序找下一个目录项，<span class=\"katex-inline\">\\tau,\\omega<\/span> 是返回上一级再进入右邻目录的导航动作。\n<\/li><li>\n实例：alphametic 问题中，扩展 Algorithm G 配 Heap 方法与后缀剪枝，解 trio-sonata 问题少于 128 kilomems；reverse colex 版本只需 97 kilomems；暴力邻位换位近 128 megamems，剪枝路线快约 170 倍（PDF 第 53 页）。Algorithm X 解同类问题仅需 49 kilomems。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n误解 1：一般生成器比特例算法高级，应当优先用 Algorithm G。为什么错：框架的价值是统一理解与换参数；实际效率取决于 <span class=\"katex-inline\">\\sigma<\/span> 选择与剪枝，reverse colex 在后缀 rejection 少时往往比 Heap 版本更划算。\n<\/li><li>\n误解 2：对偶 Algorithm H 也能做到每次单个对换。为什么错：书里证明 <span class=\"katex-inline\">n=4<\/span> 时这类最小对换方案已不可能；对偶框架需要额外工作，每 <span class=\"katex-inline\">n(n-1)<\/span> 步才做一次额外动作。\n<\/li><li>\n误解 3：拓扑排序生成与全排列生成是同一类问题。为什么错：前者只输出满足偏序 <span class=\"katex-inline\">x\\prec y<\/span> 的排列，Algorithm V 靠元素左移与逆序表约束；可行解数量远小于 <span class=\"katex-inline\">n!<\/span>，代价按 <span class=\"katex-inline\">M,N<\/span> 估而不是按 <span class=\"katex-inline\">n!<\/span> 估。\n<\/ul>\n<h2>自测题<\/h2>\n<ol><li>\n写出 <span class=\"katex-inline\">n=4<\/span> 时控制表 <span class=\"katex-inline\">c_3c_2c_1<\/span> 的全部合法取值个数，并与 <span class=\"katex-inline\">4!<\/span> 对照。\n<\/li><li>\nreverse colex 的 <span class=\"katex-inline\">\\sigma(k,j)=(k-j\\ k-j+1\\ \\dots\\ k)<\/span> 对应书中哪类已有的字典序算法特例？<span class=\"katex-inline\">\\tau(k,j)=(k-j\\ k)<\/span> 的动作是什么？\n<\/li><li>\nTheorem R 中，生成元为循环移位 <span class=\"katex-inline\">\\sigma=(1\\,2\\,\\dots\\,n)<\/span> 与对换 <span class=\"katex-inline\">\\tau=(1\\,2)<\/span> 时，<span class=\"katex-inline\">g,a,b,c<\/span> 各取什么？为什么 <span class=\"katex-inline\">n\\ge4<\/span> 偶数时无 Hamilton 圈？\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n唯一分解：排列 <span class=\"katex-inline\">=\\sigma(1,c_1)\\cdots\\sigma(n-1,c_{n-1})<\/span>；控制表总数 <span class=\"katex-inline\">n!<\/span>。\n<\/li><li>\n剪枝沿控制表上溯父结点、走向右兄弟；前缀测试与后缀跳过分工明确。\n<\/li><li>\n枚举前先查问题结构：有多项式解法就不走 <span class=\"katex-inline\">n!<\/span>；生成器摊还代价与跳过比例共同决定实测速度。\n<\/ul>\n<h2>与前后章节的衔接<\/h2>\n<p>本章把 ch03 的两个特例算法收进统一框架，并交代全书 §7.2.1.1 元组、§7.2.1.2 排列之后的去向：组合、整数划分、集合划分与树的生成在后续分册展开，同一套「控制表进位 + 树遍历 + 剪枝」视角会沿用。本手册到此走完元组与排列两条主线。<\/p>", "kind": "chapter", "title": "7.2.1.2：一般排列生成器、受限枚举与复杂度分析"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 生成所有元组和排列（第4卷 第2册 双语版）.pdf · p.6<\/div><h1>组合生成的问题框架：枚举、列举与生成<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书 §7.2.1，PDF 第 6 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>组合生成指这样一类程序任务：在给定约束的组合对象空间里，把每个对象依次交到处理例程手中逐个检查，而不是只数清对象个数，也不必把全部对象写成实体清单落盘；它与树遍历同构，目标是系统地走遍空间中的每一个对象。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>动手写组合算法之前，先要把「到底要输出什么」说清楚，否则程序的规模度量和存储设计都会做错方向。书里在 §7.2.1 开篇区分了三种经常被混在一起的说法。<\/p>\n<p>第一种是计数意义上的枚举：别人问 <span class=\"katex-inline\">\\{1,2,3\\}<\/span> 的排列有多少个，合理回答是 <span class=\"katex-inline\">3!=6<\/span>，不需要把 <span class=\"katex-inline\">\\{123,132,213,231,312,321\\}<\/span> 逐个列出来。这个意义下的 enumeration 只要求总数，对象本身不进入程序视野。如果把任务理解成计数，最省事的办法是套用组合公式算个数，不产生任何对象实例。<\/p>\n<p>第二种是列举：把所有可能性写成一张清单，打印在成千上万张纸上，或者全部写进一个计算机文件。书里举的对照是 <span class=\"katex-inline\">\\{0,1,\\dots,9\\}<\/span> 的 <span class=\"katex-inline\">10!=3,628,800<\/span> 个排列：没有哪个理智的人会把它们逐条誊抄成纸面清单，即使存进文件，<span class=\"katex-inline\">n<\/span> 稍大时空间代价也不可接受。列举把对象当成持久存在的成品，交付物是完整列表。<\/p>\n<p>第三种才是生成：程序并不要求对象同时存在于内存或文件里，只需要每个排列在某个数据结构中短暂出现一次，处理例程检查完这一个，再生成下一个。对象的生命周期就是一次访问：进来、被检查、被下一个覆盖。这种模式下存储规模只与当前对象的表示有关，不随对象总数线性膨胀。<\/p>\n<p>不用这套区分会出两类错误。一是把生成任务做成计数：只回一个阶乘数字，下游程序拿不到可检查的对象，谜题求解、候选筛选这类需要逐对象判定的工作无法开展。二是把生成任务做成全量落盘：为 <span class=\"katex-inline\">10!<\/span> 甚至 <span class=\"katex-inline\">20!<\/span> 规模的候选建清单，内存与磁盘先被撑满，而处理例程其实一次只看一个。框架概念先把交付形态钉死，后面选计数算法、格雷码还是邻位换位，才知道代价该按什么口径估。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>对象空间<\/strong>：由约束划定的一组组合对象。元组空间的约束形如 <span class=\"katex-inline\">0\\le a_j&lt;m_j<\/span>；排列空间是 <span class=\"katex-inline\">\\{a_1,\\dots,a_n\\}<\/span> 的全部序列；后续章节还会有组合、划分、树等。空间先定义清楚，生成才谈得上不漏不重。<\/p>\n<p><strong>逐个访问（visit）<\/strong>：每生成一个对象，就调用一次访问例程；例程读取当前对象做判定、累加或输出。访问动作与生成动作分离：生成器只负责把对象摆到结构里，不规定例程拿它做什么。<\/p>\n<p><strong>不漏不重<\/strong>：遍历结果满足两条性质——空间中每个对象至少被访问一次；同一对象不被当作两个不同对象重复访问。对有限空间，不漏不重等价于访问次数等于对象总数。<\/p>\n<p><strong>系统性次序<\/strong>：对象按某种确定规则排列先后，常见两类：字典序（类比词典逐位比较）与低改动次序（相邻对象尽量只改一个分量或一对相邻元素）。次序选择影响单步改动代价，但不改变空间本身。<\/p>\n<p><strong>与树遍历同构<\/strong>：第 2.3.1 节学过树遍历算法，目标是访问树的每个结点；组合生成是把组合空间看成一棵隐式树，对象是叶子或结点，生成算法沿树的分支前进、回退、走向右兄弟。两类遍历都需要「进入—访问—回退」的控制结构。<\/p>\n<p><strong>正例<\/strong>：从 0000 到 1111 逐个生成四位位串，每次把当前串交给判定函数检查——这是生成。把 <span class=\"katex-inline\">2^4=16<\/span> 写在答案里——这是计数。把 16 个串存成文本文件再读回处理——这是列举。<\/p>\n<p><strong>反例<\/strong>：程序一边跑一边把见过的对象追加到一个结果列表里，声称「反正最后也要输出」。这把生成退化成列举，存储代价随总数上涨；除非下游确实需要持久清单，否则不应这样做。<\/p>\n<h2>原理推导<\/h2>\n<p>组合生成的必要性可以从问题性质推出来。许多实际问题必须穷举全部情形：谜题求解要求试遍数字分配方案，构型枚举要求看遍满足约束的排列或子集。这类问题不存在预先知道的「最优方向」，候选空间只能逐个排查。<\/p>\n<ol><li>\n<strong>空间有限性<\/strong>：元组总数 <span class=\"katex-inline\">\\prod m_j<\/span>、排列总数 <span class=\"katex-inline\">n!<\/span>、组合总数二项式系数，都是有限正整数。有限集合上的逐个遍历在原理上可行。\n<\/li><li>\n<strong>表示唯一性<\/strong>：每个对象选定一种标准表示（位串、元素表、逆序表等），同一对象的不同写法归约到同一标准形式，重复访问才能被识别。\n<\/li><li>\n<strong>遍历控制<\/strong>：生成器维护当前对象与辅助状态（进位指针、方向位、控制表、链表等）；每次推进按规则把当前对象换成空间中的下一个，辅助状态记录已走分支。\n<\/li><li>\n<strong>终止条件<\/strong>：当推进规则无法再产生合法对象时终止；终止时访问次数应等于空间大小，作为不漏不重的检验口径。\n<\/ol>\n<p>计数公式给出终止时应有的对象数；生成算法给出逐个到达对象的路径。两者互补：计数验证规模，生成提供实例。书里强调 enumeration 在传统术语里偏计数，listing 偏落盘，而本书所用的 generating 是第三个意思：对象瞬时存在、逐个被访问。<\/p>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：候选空间有限且可被有限条约束描述；处理例程可以逐个消费对象；问题确实需要检查每个候选，或至少需要枚举到剪枝能排除的深度。\n<\/li><li>\n边界一：空间大到 <span class=\"katex-inline\">n!<\/span> 量级且问题存在多项式结构解法时，逐个枚举往往不是正确选择。排序找最优安排只需 <span class=\"katex-inline\">O(n\\log n)<\/span>，方阵对角和最大化有 <span class=\"katex-inline\">O(n^3)<\/span> 解法；这类问题用生成器穷举是把简单问题复杂化。\n<\/li><li>\n边界二：对象约束涉及不可比较或不可重复选择时，通用生成次序需要改造；重复元素的多重排列在邻位改动图上未必存在 Hamilton 路，低改动次序不总是可行。\n<\/li><li>\n失败案例：把「求最大代价排列」当成生成任务，枚举全部 <span class=\"katex-inline\">n!<\/span> 个排列再取最大值；书里指出这类问题应走排序或专门算法，枚举代价随 <span class=\"katex-inline\">n<\/span> 阶乘膨胀，<span class=\"katex-inline\">n=16<\/span> 时排列数已超过百亿亿量级，逐个生成不现实。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>生成 vs 计数<\/strong>：计数回答「有多少」，输出一个数；生成回答「每个是什么样」，输出可检查的对象序列。计数公式可以用来校验生成器访问次数，但不能替代对象遍历。\n<\/li><li>\n<strong>生成 vs 列举<\/strong>：列举把全部对象持久保存，存储 <span class=\"katex-inline\">\\propto<\/span> 总数；生成只保留当前对象，存储与总数无关。下游要持久清单时才需要列举，否则生成更省。\n<\/li><li>\n<strong>字典序遍历 vs 低改动遍历<\/strong>：字典序保证后继是次序上紧邻的下一个，实现简单但单步可能改动多处；低改动次序（格雷码、邻位换位）相邻对象改动最小，适合增量更新判定，但构造依赖辅助状态。两条路线都满足不漏不重，差别在次序与改动代价。\n<\/li><li>\n<strong>组合生成 vs 回溯搜索<\/strong>：组合生成走遍整个空间；回溯在约束分支上剪枝，只走可行部分。受限枚举（带前缀测试的生成器）是两者的结合：生成框架不变，访问前加约束判定，不可接受的子树整枝跳过。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：集合、序列、计数（阶乘、乘积法则）这些基础概念；树遍历的进入—访问—回退结构。后继：c02 用混合进制计数把框架落成第一个具体生成算法；c03、c04 把次序从字典序换成低改动格雷码；c05、c06 把对象从元组换成排列；c07、c08 在一般生成器框架里处理剪枝与复杂度判断。本概念把全书四章的共同问题——怎样在有限组合空间里不漏不重地逐个交出对象——先立起来。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（组合生成的问题框架：枚举、列举与生成）<\/summary><div class=\"depth-body\"><h1>c01 深度推导：组合生成框架的依赖链、三概念分界与穷举口径核算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把「组合生成」这个概念往下追五层，每层写清要讲清它必须先有哪条，以及缺了它会断在哪一步：<\/p>\n<ol><li>\n<strong>对象与约束<\/strong>：先定义空间里有什么对象。元组由分量取值范围 <span class=\"katex-inline\">0\\le a_j&lt;m_j<\/span> 定义，排列由元素集合定义，后续还有组合、划分、树。约束是判断候选是否属于空间的唯一依据；约束不清，合法与非法的边界划不出来，计数公式也无从套。\n<\/li><li>\n<strong>标准表示<\/strong>：同一对象要能写成同一个标准形式。排列可写成元素表，也可写成逆序表；元组可写成位串，也可写成整数。表示不统一，同一个对象换种写法就被当成新对象，重复访问识别不出来，不漏不重这条性质没法核验。\n<\/li><li>\n<strong>计数口径<\/strong>：空间大小要有公式可算。元组总数 <span class=\"katex-inline\">\\prod m_j<\/span>，排列总数 <span class=\"katex-inline\">n!<\/span>，组合总数二项式系数。计数结果是生成器访问次数的校验基准：跑完应该正好这么多次，少了遗漏，多了重复。\n<\/li><li>\n<strong>遍历控制结构<\/strong>：需要一套状态记录「走到哪、哪些分支走过、下一步往哪走」。树遍历的进入—访问—回退是最基础的控制结构；组合生成把它搬到隐式组合树上，控制状态可以是进位指针、方向位、混合进制控制表或循环链表。\n<\/li><li>\n<strong>访问与生成分离<\/strong>：生成器只摆好当前对象，处理例程单独消费。两者解耦之后，同一套生成器可以服务计数、判定、累加、输出等不同下游；换判定逻辑不用重写遍历，换遍历次序不用改判定。\n<\/ol>\n<p>依赖链方向：对象约束 → 标准表示 → 计数口径 → 遍历控制 → 访问分离 → 生成算法落地。链条上任一层缺失，上层结论都站不住：没有约束就没有空间，没有表示就没有身份，没有计数就没有校验，没有控制就走不完树，没有分离就无法复用。<\/p>\n<h2>正向推导：从问题性质推出生成框架的四个要件<\/h2>\n<p>下面逐步把「需要逐个检查候选」这个实际问题推成一套可落地的生成框架，每一步注明依据的前提。<\/p>\n<p><strong>步骤 1：判定问题是否必须看每个候选。<\/strong> 依据：穷举型问题（谜题求解、构型枚举）不存在预先知道的最优方向，只能逐个排查；优化型问题若已有结构性解法（排序、匹配、动态规划、专门算法），不必走全枚举。判定标准落在下游：处理例程是否需要对每个候选做独立判定。需要逐个判定，才进入生成框架；能靠定理或公式直接求出答案，生成框架不启用。<\/p>\n<p><strong>步骤 2：确认空间有限且可描述。<\/strong> 依据：有限集合才能保证遍历终止。元组空间由各分量上限限定，排列空间由 <span class=\"katex-inline\">n<\/span> 个互异元素限定；每条约束写成可判定的检查式。若候选来自无限集合，框架要先加截断条件或分层抽样，不能直接套用全生成；本书讨论的元组、排列、组合、划分、树都属于有限空间。<\/p>\n<p><strong>步骤 3：选定标准表示并核算总数。<\/strong> 依据：计数法则给出空间大小。位串表示二元元组，元素表表示排列，逆序表辅助排列生成。总数公式逐条列出：<span class=\"katex-inline\">n<\/span> 位二元组 <span class=\"katex-inline\">2^n<\/span>；基数 <span class=\"katex-inline\">m_j<\/span> 的混合元组 <span class=\"katex-inline\">\\prod_{j=1}^n m_j<\/span>；<span class=\"katex-inline\">n<\/span> 个互异元素的排列 <span class=\"katex-inline\">n!<\/span>；<span class=\"katex-inline\">(s,t)<\/span> 组合 <span class=\"katex-inline\">\\binom{s+t}{t}<\/span>。这个数记为 <span class=\"katex-inline\">N<\/span>，生成器应恰好访问 <span class=\"katex-inline\">N<\/span> 次。表示选择还要便于推进规则：能从当前对象方便地算出下一个，辅助状态能跟着更新。<\/p>\n<p><strong>步骤 4：设计推进规则与终止条件。<\/strong> 依据：有限状态空间上的连续遍历。规则从当前对象与辅助状态出发，产生下一个合法对象；状态记录已走分支。终止情形有两类：推进规则给不出新对象（如字典序走到最大排列），或控制表进位到最高位溢出。终止后用访问次数与 <span class=\"katex-inline\">N<\/span> 对照：次数少于 <span class=\"katex-inline\">N<\/span> 有遗漏，多于 <span class=\"katex-inline\">N<\/span> 有重复，相等才满足不漏不重。<\/p>\n<p><strong>步骤 5：分离访问例程。<\/strong> 依据：职责单一。生成器把对象摆进固定结构，调用 visit；visit 内部做判定、累加或输出。生成侧负责合法次序，访问侧负责业务含义。这样换下游例程不改生成器，换生成次序不改判定逻辑，两套演进互不干扰。<\/p>\n<p><strong>步骤 6：把空间看成隐式树。<\/strong> 依据：树遍历框架可迁移。前缀对应内部结点，完整对象对应叶子；选择第一个分量进入第一层分支，选择第二个分量进入第二层，分支走尽回退到父结点，走向右兄弟。元组的嵌套循环、排列的字典序回退、一般生成器的控制表进位，都是这棵树上的前进与回退动作。这一步把第 2.3.1 节学过的树遍历能力接到组合空间上。<\/p>\n<h2>数值算例一：<span class=\"katex-inline\">n=3<\/span>、二元元组空间的三种交付方式对照<\/h2>\n<p>空间：三位位串 <span class=\"katex-inline\">a_2a_1a_0<\/span>，每位取 0 或 1，总数 <span class=\"katex-inline\">N=2^3=8<\/span>。<\/p>\n<p><strong>计数口径<\/strong>：只回答个数，<span class=\"katex-inline\">N=8<\/span>，不产生任何串。下游拿不到候选实例。<\/p>\n<p><strong>列举口径<\/strong>：把 8 个串持久保存，清单为 <span class=\"katex-inline\">000,001,010,011,100,101,110,111<\/span>；存储 8 份完整表示，外加清单管理开销。<\/p>\n<p><strong>生成口径<\/strong>：当前结构里始终只有一个三位串，推进次序用二进制计数，逐步展开：<\/p>\n<ol><li>\n当前 <span class=\"katex-inline\">000<\/span>，visit 检查；\n<\/li><li>\n加 1 得 <span class=\"katex-inline\">001<\/span>，visit；\n<\/li><li>\n加 1 得 <span class=\"katex-inline\">010<\/span>，visit；\n<\/li><li>\n加 1 得 <span class=\"katex-inline\">011<\/span>，visit；\n<\/li><li>\n加 1 得 <span class=\"katex-inline\">100<\/span>，visit；\n<\/li><li>\n加 1 得 <span class=\"katex-inline\">101<\/span>，visit；\n<\/li><li>\n加 1 得 <span class=\"katex-inline\">110<\/span>，visit；\n<\/li><li>\n加 1 得 <span class=\"katex-inline\">111<\/span>，visit；再加 1 进位溢出，终止。\n<\/ol>\n<p>访问次数 8，与 <span class=\"katex-inline\">N=8<\/span> 相等。存储上只有当前串加几个进位指针；列举口径要留 8 份串。复杂度口径：生成过程总操作数按推进规则估，单次访问的存储开销与 <span class=\"katex-inline\">N<\/span> 无关；列举口径存储 <span class=\"katex-inline\">\\Theta(N)<\/span>。<\/p>\n<p><strong>排列对照<\/strong>：<span class=\"katex-inline\">\\{1,2,3\\}<\/span> 排列总数 <span class=\"katex-inline\">3!=6<\/span>。计数回答 6；列举落盘 <span class=\"katex-inline\">123,132,213,231,312,321<\/span>；生成时结构里只存一个三元序列，visit 一次换一个。生成口径下辅助状态可以是逆序表，也可以只是当前排列本身加查找支点的扫描。<\/p>\n<h2>数值算例二：规模放大后的存储与次数对照<\/h2>\n<p>取 <span class=\"katex-inline\">n=10<\/span> 的数字排列，逐步核算三种口径：<\/p>\n<ol><li>\n排列总数 <span class=\"katex-inline\">10!=3,628,800<\/span>。\n<\/li><li>\n列举口径：每个排列按 10 位数字存，光字符量约 3600 万位以上，外加文件与列表管理开销；书里把这样逐条誊抄称为不理智的做法。\n<\/li><li>\n生成口径：当前结构存 10 个元素，辅助状态存逆序表或控制表，规模与 360 万这个总数无关；访问次数应为 3,628,800 次。\n<\/li><li>\n问题分类对照：若任务是求「最大代价排列」且存在 <span class=\"katex-inline\">O(n\\log n)<\/span> 的排序解法，连生成口径都不必采用。<span class=\"katex-inline\">n=16<\/span> 时 <span class=\"katex-inline\">16!=20,922,789,888,000<\/span>，逐个生成在时间上已经失去可行性；<span class=\"katex-inline\">n=20<\/span> 时排列数超过 <span class=\"katex-inline\">10^{18}<\/span>，超出任何机器逐年遍历的边界。\n<\/ol>\n<p>对照说明：框架的三条边界——空间有限、需要逐个检查、没有更优结构解法——缺哪一条，对应的交付方式就要改。空间无限先截断，不需要逐个检查就直接算答案，存在多项式解法就走专门路线。<\/p>\n<h2>延伸推演：隐式树上的前进与回退怎样对应生成动作<\/h2>\n<p>以元组嵌套循环为例画这棵树：根结点下面第一层分支对应 <span class=\"katex-inline\">a_1<\/span> 的每个取值，第二层分支对应 <span class=\"katex-inline\">a_2<\/span>，最下层叶子对应完整元组。<\/p>\n<ol><li>\n进入 <span class=\"katex-inline\">a_1<\/span> 的第一个取值，依次走完 <span class=\"katex-inline\">a_2,\\dots,a_n<\/span> 的全部组合——这是进入一棵子树并前序遍历。\n<\/li><li>\n子树走尽，回退到根的右兄弟分支，<span class=\"katex-inline\">a_1<\/span> 进下一个取值——这是回退父结点再走向右兄弟。\n<\/li><li>\n控制状态记录当前处在第几层、该层走到哪个取值；进位机制就是「最内层走尽，回退一层，下一层进一」。\n<\/ol>\n<p>排列的字典序算法在同一棵树上：前缀固定后走尽后缀，支点回退到可增大的位置，后缀重置成最小形态再下行。一般生成器 Algorithm G 把这棵树显式画成控制串的层级结构，c07 会展开这套对应关系。<\/p>\n<h2>数值算例三：三层混合元组的生成次序手算<\/h2>\n<p>空间约束：<span class=\"katex-inline\">0\\le a_1&lt;3<\/span>，<span class=\"katex-inline\">0\\le a_2&lt;2<\/span>，<span class=\"katex-inline\">0\\le a_3&lt;3<\/span>。总数 <span class=\"katex-inline\">N=3\\times2\\times3=18<\/span>。按混合进制加法，最右分量 <span class=\"katex-inline\">a_3<\/span> 走动最快，<span class=\"katex-inline\">a_2<\/span> 次之，<span class=\"katex-inline\">a_1<\/span> 最慢。逐步列出前 9 个与后 9 个的边界：<\/p>\n<ol><li>\n<span class=\"katex-inline\">a_1=0<\/span> 时，<span class=\"katex-inline\">a_2<\/span> 取 0：<span class=\"katex-inline\">a_3<\/span> 从 0 到 2，得 <span class=\"katex-inline\">(0,0,0),(0,0,1),(0,0,2)<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">a_2<\/span> 进到 1：<span class=\"katex-inline\">(0,1,0),(0,1,1),(0,1,2)<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">a_1<\/span> 进到 1：<span class=\"katex-inline\">(1,0,0),(1,0,1),(1,0,2),(1,1,0),(1,1,1),(1,1,2)<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">a_1<\/span> 进到 2：<span class=\"katex-inline\">(2,0,0),(2,0,1),(2,0,2),(2,1,0),(2,1,1),(2,1,2)<\/span>。\n<\/ol>\n<p>边界核验：<span class=\"katex-inline\">(0,1,2)<\/span> 之后 <span class=\"katex-inline\">a_3<\/span> 到上限 2 归 0，<span class=\"katex-inline\">a_2<\/span> 到上限 1 归 0，<span class=\"katex-inline\">a_1<\/span> 加 1，所以下一个是 <span class=\"katex-inline\">(1,0,0)<\/span>，不是 <span class=\"katex-inline\">(0,2,0)<\/span>——<span class=\"katex-inline\">a_2<\/span> 没有取值 2 的合法范围。终止时 <span class=\"katex-inline\">a_1=2,a_2=1,a_3=2<\/span> 再进位，<span class=\"katex-inline\">a_3<\/span> 归 0、<span class=\"katex-inline\">a_2<\/span> 归 0、<span class=\"katex-inline\">a_1<\/span> 归 0，<span class=\"katex-inline\">j=0<\/span> 终止。访问次数 18，与乘积一致。这个算例说明：框架层面的「不漏不重」落到具体算法上，就是进位归位规则与分量上限逐条对齐。<\/p>\n<h2>框架术语对照与历史脉络<\/h2>\n<p>书里对术语的区分有明确出处背景。组合查找一章要处理的对象包括元组、排列、组合、划分、树；不同作者用过 enumerating、listing 等说法，但这些词在传统数学里偏向计数或落盘。Knuth 在本章选定 generating 作为本书术语，含义是「对象在数据结构中瞬时存在、逐个被访问」。这一选择与第 2.3.1 节树遍历的术语体系对齐：遍历一棵树也是逐个结点访问，不把整棵树拷贝成清单。<\/p>\n<p>历史脉络上，字典序排列生成可追溯到 14 世纪印度的 Nārāyaṇa Paṇḍita；邻位换位 plain changes 源自 17 世纪英国教堂敲钟传统；格雷码以 Frank Gray 命名，但同类结构在 Baudot、Schäffler 的电报装置与中国环谜中早已出现。这些历史细节不改变框架定义，但说明「逐个走遍组合空间」是一个长期存在的实践问题，不同年代的装置各自独立摸到了生成算法的不同侧面。读历史时要区分：发明归属是一回事，算法的不变量与代价分析是另一回事，本书框架把后者作为讨论主体。<\/p>\n<h2>算例四：低改动次序仍是同一框架内的次序选择<\/h2>\n<p>框架只要求不漏不重地逐个访问，次序本身是可换的参数。以三位二元元组为例对照两种次序：<\/p>\n<ul><li>\n计数字典序：<span class=\"katex-inline\">000,001,010,011,100,101,110,111<\/span>。相邻两步的改动位数不等：<span class=\"katex-inline\">001\\to010<\/span> 同时翻两位，<span class=\"katex-inline\">011\\to100<\/span> 翻三位。\n<\/li><li>\n反射格雷码：<span class=\"katex-inline\">000,001,011,010,110,111,101,100<\/span>。每一步恰好翻一位。\n<\/ul>\n<p>两种次序访问的是同一个 8 对象空间，计数校验都是 8；差别在单步改动量与辅助状态。这个对照说明：框架概念不绑定具体次序，选字典序还是低改动次序，由下游是否需要增量更新判定决定。排列侧也是如此：字典序 Algorithm L 与邻位换位 Algorithm P 走遍同一个 <span class=\"katex-inline\">n!<\/span> 排列空间，属于框架内的两种次序实现。<\/p>\n<h2>失败案例复盘<\/h2>\n<p><strong>案例 1：把生成做成计数。<\/strong> 谜题求解要求找出满足字母数字互异的算式分配；程序只回一个「共 <span class=\"katex-inline\">10!<\/span> 种」，下游拿不到任何候选，谜题无法求解。根因：把 visit 该做的判定工作省略成了总数公式。修正：保留生成循环，每个候选进判定例程，计数只用于事后校验访问次数。<\/p>\n<p><strong>案例 2：把生成做成全量落盘。<\/strong> 为下游筛选准备候选文件，生成器边跑边把每个排列追加进列表；<span class=\"katex-inline\">n=10<\/span> 时列表占用随 360 万条增长，内存与磁盘先耗尽，而下游一次只看一条。根因：混淆了交付物形态。修正：对象只留在当前结构，需要持久结果时只保存通过判定的条目，未通过的不进清单。<\/p>\n<p><strong>案例 3：不校验访问次数。<\/strong> 某生成器声称走遍全部排列，实际支点查找方向写反，漏掉三分之一候选；因为没有用 <span class=\"katex-inline\">N=n!<\/span> 对照访问次数，漏排一直没被发现。修正：终止后核对访问次数与计数公式，次数不符即排查推进规则；辅助状态越界也是常见漏排来源。<\/p>\n<p><strong>案例 4：对有结构解法的问题硬枚举。<\/strong> 方阵对角和最大化、单峰序列安排这类问题有多项式解法；套用全排列生成器，<span class=\"katex-inline\">n<\/span> 稍大就跑不完。根因：问题分类在框架阶段没做。修正：先查问题是否存在排序、匹配、动态规划等更优路线，再决定是否枚举；生成器只作为兜底、对照或小规模验证。<\/p>\n<p><strong>案例 5：表示不统一导致重复计数。<\/strong> 同一组元素表在一处按递增记录、在另一处按原序记录，生成器把它们当成两个对象；访问次数超过 <span class=\"katex-inline\">N<\/span> 仍不自知。修正：规定唯一标准表示，进入 visit 前先归约成标准形式，重复对象在表示层就被识别。标准表示的选择要写进算法约定：元组按分量顺序固定，排列按位置顺序固定，辅助表与产物表分开存放，避免辅助状态被误当成产物身份。<\/p>\n<p><strong>案例 6：终止条件写在对象层面而非状态层面。<\/strong> 某生成器靠「当前排列是否等于最大排列」判断结束，遇到多重集或约束空间时最大排列不易写出，判定失效；状态层面的终止（控制表进位到溢出、找不到可增支点）才是通用口径。修正：终止判定落在辅助状态上，不依赖产物的特殊形态。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n<strong>卡住位置 1：分不清 enumeration、listing、generating 三个词。<\/strong> 补步骤：问自己「输出是一个数、一份完整文件、还是一个临时结构」。输出数是计数，输出文件是列举，输出临时结构逐个被检查是生成。书里三种说法对应这三种交付形态，术语差别先于算法差别。\n<\/li><li>\n<strong>卡住位置 2：不知道生成器为什么也要讲不漏不重。<\/strong> 补步骤：回到标准表示与计数口径。对象表示统一后，每个对象有唯一标准形式；推进规则连续遍历合法状态，访问次数应等于总数；少了是遗漏，多了是重复。不漏不重是性质判断，不是口号。\n<\/li><li>\n<strong>卡住位置 3：认为树遍历和组合生成没关系。<\/strong> 补步骤：把组合空间画成隐式树，对象对应叶子，前缀对应内部结点；进入分支、访问结点、回退到父结点走向右兄弟，这套动作和树遍历的前序、后序结构一一对应。c07 的 Algorithm G 就是在一棵这样的隐式树上前序遍历。\n<\/li><li>\n<strong>卡住位置 4：不知道什么时候该放弃枚举。<\/strong> 补步骤：检查问题是否存在已知结构性解法，以及 <span class=\"katex-inline\">n<\/span> 增大后 <span class=\"katex-inline\">n!<\/span> 或 <span class=\"katex-inline\">m^n<\/span> 是否越过可行边界；两条任一成立，先找专门算法，生成器只作为兜底或对照。书里「Think twice before you permute」一节专门讨论这个判断。\n<\/li><li>\n<strong>卡住位置 5：说不清访问例程和生成器怎么分工。<\/strong> 补步骤：列两列——生成侧管什么（对象合法、次序正确、状态推进、终止），访问侧管什么（读当前对象、判定、累加、保存结果）；两列交叉的只有「当前对象放在哪个结构」这一个接口。\n<\/ul>\n<h2>自检问题（不给答案）<\/h2>\n<ol><li>\n用自己的话写出计数、列举、生成三者在存储规模与输出形态上的差别，各举一个程序场景。\n<\/li><li>\n一个生成器跑完只访问了 <span class=\"katex-inline\">N-3<\/span> 个对象，可能是推进规则的哪一类缺陷？怎样用计数公式定位遗漏？\n<\/li><li>\n元组空间 <span class=\"katex-inline\">0\\le a_1&lt;3,\\ 0\\le a_2&lt;2<\/span> 的总数是多少？生成口径下当前结构需要存几个分量？\n<\/li><li>\n为什么访问例程要与生成器分离？绑在一起会给后续换次序、换下游带来什么麻烦？\n<\/li><li>\n举出一个存在多项式解法、因而不应走全排列枚举的问题，并说明枚举路线的代价量级。\n<\/li><li>\n隐式树上「进入子树—走尽—回退—走向右兄弟」分别对应计数进位机制的哪些动作？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "组合生成的问题框架：枚举、列举与生成"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：计算机程序设计艺术 生成所有元组和排列（第4卷 第2册 双语版）.pdf · p.7<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">组合生成的问题框架：枚举、列举与生成<\/a><\/span><\/div><h1>混合进制 n 元组与计数算法 M：进位、字典序与对象总数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：ch01（原书 §7.2.1.1，PDF 第 7 页）\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>混合进制 n 元组是满足 <span class=\"katex-inline\">0\\le a_j&lt;m_j<\/span> 的序列 <span class=\"katex-inline\">(a_1,\\dots,a_n)<\/span>，各分量基数 <span class=\"katex-inline\">m_j<\/span> 可以不同；Algorithm M 把这样一个元组看成混合进制数，反复加 1 并按各基数进位，从全 0 出发走遍全部 <span class=\"katex-inline\">\\prod m_j<\/span> 个合法元组，输出次序为字典序。<\/p>\n<h2>问题：这个概念解决什么具体困难<\/h2>\n<p>最朴素的组合生成需求是把一组带取值范围的分量全部组合一遍。直接手写嵌套循环在 <span class=\"katex-inline\">n<\/span> 固定且很小时可行，但 <span class=\"katex-inline\">n<\/span> 作为参数变化时，层数写不出来；需要一个与层数无关、靠进位机制驱动的通用程序。<\/p>\n<p>困难集中在三处。第一，各分量的取值上限可能不同：第一分量允许 3 个值，第二分量允许 2 个值，第三分量允许 3 个值，不能套统一的十进制或二进制计数器。第二，进位归位规则要明确：某个分量到上限后归 0，向左高位进一，高位若也到上限继续向左传。第三，终止条件要能识别「全部走尽」：最高位也溢出时停止，不能回绕成循环计数。<\/p>\n<p>不用混合进制计数会出现什么失败场景。若把各分量当成独立计数器并行走动，分量之间没有进位协调，会产生不对应任何合法整数的组合次序，重复与遗漏同时出现。若进位后不归 0，低位保留旧值，序列跳过一批状态。若终止条件只检查当前元组是否等于最大元组，遇到分量基数不同的空间，最大元组要逐位拼出，程序容易写错；状态层面的溢出判定更稳。<\/p>\n<p>Algorithm M 把普通进位制的加法机制推广到分量基数各不相同的情形，用一套固定步骤覆盖任意 <span class=\"katex-inline\">n<\/span>，是后面所有元组、排列生成算法的计数对照基准。<\/p>\n<h2>定义逐句拆<\/h2>\n<p><strong>约束条件<\/strong>：<span class=\"katex-inline\">0\\le a_j&lt;m_j<\/span>，<span class=\"katex-inline\">1\\le j\\le n<\/span>。<span class=\"katex-inline\">a_j<\/span> 是第 <span class=\"katex-inline\">j<\/span> 个分量，<span class=\"katex-inline\">m_j<\/span> 是该分量的基数（取值个数）。分量从 0 开始计数，这是混合进制记法的约定；若实际对象从 1 开始编号，进入算法前先平移。<\/p>\n<p><strong>混合进制数记法<\/strong>：<span class=\"katex-inline\">[a_1,a_2,\\dots,a_n]_{m_1,m_2,\\dots,m_n}<\/span>。对应整数值按权重展开：低位 <span class=\"katex-inline\">a_n<\/span> 权重 1，<span class=\"katex-inline\">a_{n-1}<\/span> 权重 <span class=\"katex-inline\">m_n<\/span>，依次向左；一般地 <span class=\"katex-inline\">a_j<\/span> 的权重是 <span class=\"katex-inline\">m_{j+1}m_{j+2}\\cdots m_n<\/span>。<\/p>\n<p><strong>Algorithm M 步骤<\/strong>（书里 M1–M5）：<\/p>\n<ul><li>\nM1 初始化：<span class=\"katex-inline\">a_j\\leftarrow0<\/span>（<span class=\"katex-inline\">0\\le j\\le n<\/span>），约定辅助位 <span class=\"katex-inline\">m_0\\leftarrow2<\/span>。\n<\/li><li>\nM2 访问：访问当前元组 <span class=\"katex-inline\">(a_1,\\dots,a_n)<\/span>。\n<\/li><li>\nM3 准备加 1：置 <span class=\"katex-inline\">j\\leftarrow n<\/span>。\n<\/li><li>\nM4 进位判断：若 <span class=\"katex-inline\">a_j=m_j-1<\/span>，置 <span class=\"katex-inline\">a_j\\leftarrow0<\/span>，<span class=\"katex-inline\">j\\leftarrow j-1<\/span>，重复本步；否则停下。\n<\/li><li>\nM5 增加或终止：<span class=\"katex-inline\">j=0<\/span> 时终止；否则 <span class=\"katex-inline\">a_j\\leftarrow a_j+1<\/span>，回 M2。\n<\/ul>\n<p><strong>字典序<\/strong>：序列按分量从左到右逐位比较大小，先比较 <span class=\"katex-inline\">a_1<\/span>，<span class=\"katex-inline\">a_1<\/span> 相同再比较 <span class=\"katex-inline\">a_2<\/span>，依此类推。混合进制加法中高位分量走动最慢、低位最快，恰好与字典序方向相反地对应：字典序先定高位，计数序列低位先变、高位后变，两种次序在「下一个对象」的构造上一致。<\/p>\n<p><strong>对象总数<\/strong>：各分量独立取值，由乘积法则 <span class=\"katex-inline\">N=m_1m_2\\cdots m_n=\\prod_{j=1}^n m_j<\/span>。二进制特例 <span class=\"katex-inline\">m_j=2<\/span> 时 <span class=\"katex-inline\">N=2^n<\/span>；十进制特例 <span class=\"katex-inline\">m_j=10<\/span> 时 <span class=\"katex-inline\">N=10^n<\/span>。<\/p>\n<p><strong>正例<\/strong>：<span class=\"katex-inline\">(m_1,m_2)=(3,2)<\/span>，元组序列 <span class=\"katex-inline\">(0,0),(0,1),(1,0),(1,1),(2,0),(2,1)<\/span>，总数 6。 <strong>反例<\/strong>：把 <span class=\"katex-inline\">a_j<\/span> 的上界写成 <span class=\"katex-inline\">m_j<\/span> 而不是 <span class=\"katex-inline\">m_j-1<\/span>，会让分量取到非法值 <span class=\"katex-inline\">m_j<\/span>；把进位方向写成向右传，高位低位对调，次序变成反字典序。<\/p>\n<h2>原理推导<\/h2>\n<p>下面从混合进制加法出发，逐步推出 Algorithm M 的不漏不重与字典序性质。<\/p>\n<ol><li>\n<strong>整数对应唯一性<\/strong>：每个合法元组对应唯一整数 <span class=\"katex-inline\">k=a_1m_2\\cdots m_n+\\cdots+a_{n-1}m_n+a_n<\/span>，范围 <span class=\"katex-inline\">0\\le k&lt;\\prod m_j<\/span>；不同元组展开值不同，因为低位权重都小于右侧各基数之积，不产生进位混淆。\n<\/li><li>\n<strong>加 1 的进位机制<\/strong>：<span class=\"katex-inline\">k<\/span> 加 1 时，从最低位 <span class=\"katex-inline\">a_n<\/span> 开始；当前位未到上限 <span class=\"katex-inline\">m_n-1<\/span>，直接加 1；到上限则归 0 并向高位进一。高位重复同一判断。这套规则与十进制、二进制进位逐条相同，只是每一位的基数换成 <span class=\"katex-inline\">m_j<\/span>。\n<\/li><li>\n<strong>合法性保持<\/strong>：进位后归 0 的分量回到合法下界；直接加 1 的分量未到上限，加 1 后仍小于 <span class=\"katex-inline\">m_j<\/span>；被进位改变的高位同样在界内。结果仍是合法元组。\n<\/li><li>\n<strong>严格递增与无重复<\/strong>：每次加 1 使 <span class=\"katex-inline\">k<\/span> 增加 1，访问序列的 <span class=\"katex-inline\">k<\/span> 严格递增，同一整数不会出现两次。\n<\/li><li>\n<strong>覆盖与终止<\/strong>：从 <span class=\"katex-inline\">k=0<\/span> 连续加 1，直到 <span class=\"katex-inline\">k=\\prod m_j<\/span> 引发最高位进位，<span class=\"katex-inline\">j<\/span> 退到 0，算法终止；区间内每个整数被经过一次，对应每个合法元组访问一次。\n<\/li><li>\n<strong>字典序一致性<\/strong>：整数 <span class=\"katex-inline\">k<\/span> 的高位分量 <span class=\"katex-inline\">a_1<\/span> 变化频率最低，字典序中下一个对象尽量保持前缀不变、只改变靠后的分量；计数加法在低位走尽后才动高位，两者产生的先后次序一致。\n<\/ol>\n<h2>适用条件与边界<\/h2>\n<ul><li>\n适用条件：各分量取值范围有限且互不依赖；分量取值可编号为连续整数 <span class=\"katex-inline\">0,\\dots,m_j-1<\/span>；对象空间就是这些分量的全部笛卡尔积。\n<\/li><li>\n边界一：分量之间有约束（如后一分份不能超过前一分份、分量互异）时，纯计数法会生成非法组合，需要加访问前判定或换用带剪枝的生成器。\n<\/li><li>\n边界二：<span class=\"katex-inline\">n<\/span> 很大且只需要低改动次序时，计数法每步可能改动多个分量，增量更新成本高；格雷码路线（c03）替代。\n<\/li><li>\n边界三：分量基数为 1 时该分量恒为 0，不产生变化；<span class=\"katex-inline\">m_j=0<\/span> 不是合法基数，空间为空。\n<\/li><li>\n失败案例：<span class=\"katex-inline\">n=2<\/span>、<span class=\"katex-inline\">(m_1,m_2)=(2,3)<\/span>，若进位方向写反（先动 <span class=\"katex-inline\">a_1<\/span>），序列变成 <span class=\"katex-inline\">(0,0),(1,0),(0,1),(1,1),(0,2),(1,2)<\/span>，仍是 6 个对象，但次序不是字典序；说明进位方向决定次序方向，机制本身仍不漏不重。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n<strong>混合进制 vs 普通进制<\/strong>：普通进制所有基数相同（十进制 10、二进制 2）；混合进制允许 <span class=\"katex-inline\">m_j<\/span> 各不相同，进位规则逐条相同，只是每位上限不同。普通进制是混合进制的等基数特例。\n<\/li><li>\n<strong>计数生成 vs 嵌套循环<\/strong>：两者输出相同序列。嵌套循环把进位机制显式写成外层到内层的循环；Algorithm M 用指针 <span class=\"katex-inline\">j<\/span> 模拟层级，<span class=\"katex-inline\">n<\/span> 可作为参数。<span class=\"katex-inline\">n<\/span> 是小常数时嵌套循环更直观，<span class=\"katex-inline\">n<\/span> 动态时进位算法更通用。\n<\/li><li>\n<strong>字典序后继 vs 低改动后继<\/strong>：计数法后继是整数加 1，可能多位同时变；格雷码后继要求相邻元组只差一位，进位机制换成反射规则。两者对象集合相同，次序不同。\n<\/li><li>\n<strong>元组 vs 排列<\/strong>：元组分量可重复、顺序位置固定；排列要求元素互异，分量位置上是不同元素。计数法直接生成元组；排列生成（c05、c06）要在元组基础上加互异约束或换邻位交换机制。\n<\/ul>\n<h2>联系<\/h2>\n<p>前置：c01 的生成框架与计数口径；整数的进制表示与乘积法则。后继：c03 反射格雷码以二进制元组空间为对象，把计数次序换成单步翻转次序；c04 把混合进制推广到反射格雷码与子森林；c05 字典序排列沿用「找可增支点—交换—后缀重置」的计数后继思想；c07 的控制表进位本质也是混合进制计数，只是计数对象换成排列的分解系数。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（混合进制 n 元组与计数算法 M：进位、字典序与对象总数）<\/summary><div class=\"depth-body\"><h1>c02 深度推导：混合进制进位规则逐步展开、全序列手算与代价核算<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>把混合进制计数生成往下追五层：<\/p>\n<ol><li>\n<strong>分量取值范围<\/strong>：每个 <span class=\"katex-inline\">a_j<\/span> 能取哪些值，由基数 <span class=\"katex-inline\">m_j<\/span> 划定 <span class=\"katex-inline\">0,\\dots,m_j-1<\/span>。范围是进位判断的依据：到没到上限，对照的就是 <span class=\"katex-inline\">m_j-1<\/span>。\n<\/li><li>\n<strong>进制权重<\/strong>：元组与整数的对应靠权重展开。低位权重 1，向左每位乘上右侧基数；没有权重就无法把元组看成可数的数，加 1 动作也没有参照。\n<\/li><li>\n<strong>普通进制加法<\/strong>：十进制、二进制的进位经验——低位到顶归 0、向高位进一。混合进制逐条沿用，只把统一基数换成每位自己的 <span class=\"katex-inline\">m_j<\/span>。\n<\/li><li>\n<strong>溢出终止<\/strong>：最高位也进位时 <span class=\"katex-inline\">j<\/span> 退到 0，空间走尽。终止判定落在状态（指针 <span class=\"katex-inline\">j<\/span>）上，不依赖产物是否等于某个特殊元组。\n<\/li><li>\n<strong>字典序对应<\/strong>：高位慢变、低位快变的计数次序，与逐位比较的字典序一致；这条对应把计数算法和后继构造联系起来，排列字典序算法沿用同一思路。\n<\/ol>\n<p>依赖链方向：分量范围 → 权重展开 → 加法进位 → 溢出终止 → 次序对应。<\/p>\n<h2>正向推导：Algorithm M 每一步凭什么合法<\/h2>\n<p>下面逐步推导，每步注明用到的定义或假设。<\/p>\n<p><strong>步骤 1：初始化合法。<\/strong> M1 置所有 <span class=\"katex-inline\">a_j=0<\/span>。由约束 <span class=\"katex-inline\">0\\le a_j&lt;m_j<\/span>，0 是每个分量的合法下界，初始元组合法。辅助位 <span class=\"katex-inline\">m_0<\/span> 仅为终止判断约定，不参与产物。<\/p>\n<p><strong>步骤 2：访问当前元组。<\/strong> M2 把当前 <span class=\"katex-inline\">(a_1,\\dots,a_n)<\/span> 交给访问例程。此时元组已由上一轮进位调整到合法状态，访问动作不改分量。<\/p>\n<p><strong>步骤 3：定位进位起点。<\/strong> M3 置 <span class=\"katex-inline\">j\\leftarrow n<\/span>，从最低位开始加 1。加法从低位起是进制约定：低位权重最小，加 1 先改变低位。<\/p>\n<p><strong>步骤 4：进位判断与归位。<\/strong> M4 检查 <span class=\"katex-inline\">a_j<\/span> 是否等于 <span class=\"katex-inline\">m_j-1<\/span>。若等于，该位已到上限，加 1 会越界，于是置 <span class=\"katex-inline\">a_j\\leftarrow0<\/span> 并把进位传给 <span class=\"katex-inline\">j-1<\/span>；重复本步直到某一位未到上限。若不等于，该位就是承接进位的位置。用到的假设：分量取值连续，上限归 0 后重新从下界开始。<\/p>\n<p><strong>步骤 5：增加或终止。<\/strong> M5 判断 <span class=\"katex-inline\">j<\/span>：若 <span class=\"katex-inline\">j=0<\/span>，说明最高位也完成了归 0，进位传出空间，全部元组走尽，终止。否则 <span class=\"katex-inline\">a_j\\leftarrow a_j+1<\/span>，承接进位的分量加 1 后仍满足 <span class=\"katex-inline\">a_j&lt;m_j<\/span>（因为它未到上限），回 M2。<\/p>\n<p><strong>步骤 6：不漏不重的归纳依据。<\/strong> 访问序列对应整数 <span class=\"katex-inline\">k=0,1,2,\\dots,\\prod m_j-1<\/span> 逐个加 1。每个整数有唯一混合进制表示，所以每个合法元组出现恰好一次；<span class=\"katex-inline\">k<\/span> 严格递增，无重复；走到 <span class=\"katex-inline\">k=\\prod m_j<\/span> 时溢出终止，区间内整数全覆盖。基数乘积 <span class=\"katex-inline\">\\prod m_j<\/span> 由乘法法则：各分量独立选择，组合数相乘。<\/p>\n<p><strong>步骤 7：次序与字典序对齐。<\/strong> 字典序先比较 <span class=\"katex-inline\">a_1<\/span>，<span class=\"katex-inline\">a_1<\/span> 相同再比 <span class=\"katex-inline\">a_2<\/span>。计数序列中 <span class=\"katex-inline\">a_1<\/span> 变化最慢：<span class=\"katex-inline\">a_1<\/span> 固定时 <span class=\"katex-inline\">a_2,\\dots,a_n<\/span> 全部走一遍；<span class=\"katex-inline\">a_1<\/span> 才进一。这与「前缀尽量保持不变、先排靠后分量」的字典序后继规则一致，所以计数输出就是字典序。<\/p>\n<h2>数值算例一：<span class=\"katex-inline\">(m_1,m_2)=(3,2)<\/span> 全序列逐步手算<\/h2>\n<p>约束 <span class=\"katex-inline\">0\\le a_1&lt;3<\/span>，<span class=\"katex-inline\">0\\le a_2&lt;2<\/span>，总数 <span class=\"katex-inline\">N=3\\times2=6<\/span>。权重：<span class=\"katex-inline\">a_1<\/span> 权重 <span class=\"katex-inline\">m_2=2<\/span>，<span class=\"katex-inline\">a_2<\/span> 权重 1。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>轮次<\/th><th>访问元组<\/th><th>整数 <span class=\"katex-inline\">k<\/span><\/th><th>进位过程<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><span class=\"katex-inline\">(0,0)<\/span><\/td><td>0<\/td><td>初始化<\/td><\/tr><tr><td>2<\/td><td><span class=\"katex-inline\">(0,1)<\/span><\/td><td>1<\/td><td><span class=\"katex-inline\">a_2<\/span> 未到 1，<span class=\"katex-inline\">a_2\\leftarrow1<\/span><\/td><\/tr><tr><td>3<\/td><td><span class=\"katex-inline\">(1,0)<\/span><\/td><td>2<\/td><td><span class=\"katex-inline\">a_2=1=m_2-1<\/span>，归 0；<span class=\"katex-inline\">a_1<\/span> 未到 2，<span class=\"katex-inline\">a_1\\leftarrow1<\/span><\/td><\/tr><tr><td>4<\/td><td><span class=\"katex-inline\">(1,1)<\/span><\/td><td>3<\/td><td><span class=\"katex-inline\">a_2\\leftarrow1<\/span><\/td><\/tr><tr><td>5<\/td><td><span class=\"katex-inline\">(2,0)<\/span><\/td><td>4<\/td><td><span class=\"katex-inline\">a_2<\/span> 归 0；<span class=\"katex-inline\">a_1\\leftarrow2<\/span><\/td><\/tr><tr><td>6<\/td><td><span class=\"katex-inline\">(2,1)<\/span><\/td><td>5<\/td><td><span class=\"katex-inline\">a_2\\leftarrow1<\/span><\/td><\/tr><tr><td>终止<\/td><td>—<\/td><td>6<\/td><td><span class=\"katex-inline\">a_2<\/span> 归 0；<span class=\"katex-inline\">a_1=2=m_1-1<\/span>，归 0；<span class=\"katex-inline\">j=0<\/span>，终止<\/td><\/tr><\/tbody><\/table><\/div>\n<p>核验：访问 6 次，与 <span class=\"katex-inline\">N=6<\/span> 相等；序列 <span class=\"katex-inline\">(0,0),(0,1),(1,0),(1,1),(2,0),(2,1)<\/span> 按字典序排列，无重复。<\/p>\n<h2>数值算例二：<span class=\"katex-inline\">(
