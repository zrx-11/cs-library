<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>

  background: var(--accent-soft) !important;
  border-left-color: var(--accent) !important;
  color: var(--text) !important;
}

.mermaid,
.mermaid-hint {
  background: var(--code-bg) !important;
  color: var(--muted) !important;
  border-color: var(--border) !important;
}

.quiz-item,
.path-step,
.book-card,
.concept-card,
.pattern-card,
.term-card,
.diag-card,
.search-hit,
.card,
.box,
.panel,
.fc-front,
.fc-back,

  border-color: var(--border) !important;
  color: var(--text) !important;
}

.book-card:hover,
.concept-card:hover,
.quiz-item:hover {
  border-color: var(--accent) !important;
}

.quiz-explain,
.source-badge,
.glossary-ref,
.card-counts,
.source,
.citation {
  color: var(--muted) !important;
  border-color: var(--border) !important;
}

.quiz-blank,
.quiz-opts label,
.quiz-opts label:hover {
  background: var(--bg-soft) !important;
  color: var(--text) !important;
  border-color: var(--border) !important;
}

.fc-back {
  background: var(--accent-soft) !important;
}

.tag,
.pill,
.badge {
  background: var(--panel-2) !important;
  border-color: var(--border) !important;
  color: var(--text2) !important;
}

.empty {
  color: var(--muted) !important;
}

.card .icon:empty,
.icon-label:empty {
  display: none !important;
}

* {
  scrollbar-color: #2a3a5f transparent;
  scrollbar-width: thin;
}

::selection {
  background: var(--accent);
  color: #fff;
}

/* 深色主题下代码高亮不要被旧样式压成白底 */
html[data-theme="dark"] .page pre,
body[data-theme="dark"] .page pre {
  background: var(--code-bg) !important;
}

/* 旧版页面里的白色卡片兜底 */
html[data-theme="dark"] .page .card,
body[data-theme="dark"] .page .card {
  background: var(--panel) !important;
}

@media (max-width: 820px) {
  body {
    background-size: 22px 22px;
    font-size: 15.5px;
  }
  header,
  .topbar,
  .topbar-fixed {
    background: var(--bg) !important;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: .001ms !important;
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
  }
}

@media print {
  html, body {
    background: #fff !important;
    color: #000 !important;
  }
  body {
    background-image: none !important;
  }
}

/* 多书总入口：窄屏下书籍标签横滑，不再堆成四五行 */
@media (max-width: 720px) {
  header .tabs,
  .tabs {
    display: flex !important;
    flex-wrap: nowrap !important;
    overflow-x: auto;
    overflow-y: hidden;
    max-width: 100%;
    padding-bottom: 4px;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }

  header .tabs > *,
  .tabs > * {
    flex: 0 0 auto;
  }

  .tabs::-webkit-scrollbar {
    height: 4px;
  }
  .tabs::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }
}

.md", "chapterIds": ["ch04"], "difficulty": "基础", "source": {"file": "SQL必知必会（第5版）", "page": 157}, "prerequisites": ["c03"], "depthFragment": "concepts/c11-depth.md"}, {"id": "c12", "title": "视图", "file": "concepts/c12.md", "chapterIds": ["ch04"], "difficulty": "进阶", "source": {"file": "SQL必知必会（第5版）", "page": 184}, "prerequisites": ["c09"], "depthFragment": "concepts/c12-depth.md"}, {"id": "c13", "title": "事务处理", "file": "concepts/c13.md", "chapterIds": ["ch04"], "difficulty": "进阶", "source": {"file": "SQL必知必会（第5版）", "page": 205}, "prerequisites": ["c11"], "depthFragment": "concepts/c13-depth.md"}, {"id": "c14", "title": "存储过程与游标", "file": "concepts/c14.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "SQL必知必会（第5版）", "page": 195}, "prerequisites": ["c13"], "depthFragment": "concepts/c14-depth.md"}], "glossary": [{"term": "主键（primary key）", "def": "唯一标识表中每一行的列（或列组合），值不可重复、不可为 NULL、不应被修改", "chapterId": "ch01"}, {"term": "外键（foreign key）", "def": "本表中引用另一表主键的列，其合法值必须在被引用表的主键中出现，用于保证引用完整性", "chapterId": "ch01"}, {"term": "引用完整性", "def": "DBMS 强制实施的规则：外键列只能填被引用表中真实存在的主键值，防止出现“指向不存在记录”的行", "chapterId": "ch01"}, {"term": "谓词/操作符", "def": "WHERE 子句中用于比较或联结条件的关键字，如 =、<>、BETWEEN、IN、LIKE、AND、OR、NOT", "chapterId": "ch01"}, {"term": "通配符（wildcard）", "def": "LIKE 搜索模式中代表部分字符的特殊符号：% 匹配任意多个字符（含零个），_ 匹配单个字符", "chapterId": "ch01"}, {"term": "计算字段", "def": "运行时在 SELECT 语句内由列值、常量与表达式算出的结果，并不物理存储在表中", "chapterId": "ch02"}, {"term": "别名（alias）", "def": "用 AS 给列、计算字段或表起的临时名字，供同一条语句的其他部分引用；表别名不返回给客户端", "chapterId": "ch02"}, {"term": "聚集函数（aggregate function）", "def": "对一组行计算并返回单个值的函数：AVG()、COUNT()、MAX()、MIN()、SUM()", "chapterId": "ch02"}, {"term": "分组（grouping）", "def": "按一列或多列把行划分为若干逻辑组，再对每个组分别做聚集计算，由 GROUP BY 建立、HAVING 过滤", "chapterId": "ch02"}, {"term": "子查询（subquery）", "def": "嵌套在另一条 SELECT 语句中的 SELECT，结果被外层查询当作条件值或计算字段使用；执行时由内向外处理", "chapterId": "ch03"}, {"term": "联结（join）", "def": "查询运行时按共同值把多张表的行配对在一起的机制；联结不是物理存在的表，只在查询执行期间存在", "chapterId": "ch03"}, {"term": "视图（view）", "def": "保存为虚拟表的一条查询；本身不存储数据，返回的数据实时来自底层表", "chapterId": "ch04"}, {"term": "事务（transaction）", "def": "一组要么完全执行、要么完全不执行的 SQL 语句；用 COMMIT 提交、ROLLBACK 回退，可用 SAVEPOINT 设保留点", "chapterId": "ch04"}, {"term": "游标（cursor）", "def": "存储在服务器上的查询结果集，应用程序可在其中逐行滚动浏览或取出数据", "chapterId": "ch04"}, {"term": "约束（constraint）", "def": "定义在表上、管理数据如何插入和处理的规则，如主键、外键、NOT NULL、检查约束，用于实施数据完整性", "chapterId": "ch04"}, {"term": "索引（index）", "def": "在一列或多列上保存的排过序的辅助列表，用于加快搜索和排序操作；视图不能建索引", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "Products 表中，供应商 DLL01 的产品为三只 3.49 美元的 bean bag toy 和一个 4.99 美元的 Raggedy Ann。执行下面语句会返回哪些行？\n```sql\nSELECT prod_id, prod_price, prod_name\nFROM Products\nWHERE vend_id = 'DLL01' AND prod_price <= 4;\n```", "options": ["三只 bean bag toy（3.49 美元）", "Raggedy Ann（4.99 美元）", "三只 bean bag toy 加 Raggedy Ann", "DLL01 的全部产品，但不含价格条件"], "answer": 0, "explain": "AND 要求两个条件同时成立：vend_id 为 DLL01 且价格 ≤4。Raggedy Ann 价格 4.99，不满足 ≤4，被排除；三只 bean bag toy 价格 3.49，满足。", "relatedConceptId": "c03"}, {"id": "q02", "chapterId": "ch01", "type": "single", "question": "需求：列出价格 10 美元及以上，且由 DLL01 或 BRS01 制造的产品。下面哪种写法的语义与需求一致？", "options": ["WHERE vend_id = 'DLL01' OR vend_id = 'BRS01' AND prod_price >= 10", "WHERE (vend_id = 'DLL01' OR vend_id = 'BRS01') AND prod_price >= 10", "WHERE vend_id IN ('DLL01','BRS01') AND prod_price < 10", "WHERE NOT vend_id = 'DLL01' AND prod_price >= 10"], "answer": 1, "explain": "AND 求值优先于 OR，不加括号时第一种写法会被理解成“BRS01 且价格 ≥10，或 DLL01 全部产品”。括号先圈定 OR 分组，再与价格条件 AND，才是需求原意。", "relatedConceptId": "c03"}, {"id": "q03", "chapterId": "ch01", "type": "single", "question": "Customers 表中有两行 cust_email 为 NULL。下面语句的执行结果是？\n```sql\nSELECT cust_id\nFROM Customers\nWHERE cust_email = NULL;\n```", "options": ["返回这两行 email 为 NULL 的顾客", "返回全部顾客", "返回 0 行", "报错，因为 NULL 不能出现在 WHERE 中"], "answer": 2, "explain": "SQL 采用三值逻辑：NULL 与任何值做 =、<> 比较结果都是 NULL（既不是真也不是假），WHERE 只保留结果为真的行，所以一行都返回不了。判空必须用 IS NULL。", "relatedConceptId": "c03"}, {"id": "q04", "chapterId": "ch01", "type": "single", "question": "假设子查询或列表里混入了 NULL：`WHERE cust_id NOT IN ('1000000001', NULL)`。按标准 SQL 语义，这条语句最可能出现什么现象？", "options": ["正常返回除 1000000001 外的所有顾客", "返回 0 行：NOT IN 列表中含 NULL 时，比较结果无法为真", "只返回 cust_id 为 NULL 的行", "自动把 NULL 当成空字符串跳过"], "answer": 1, "explain": "NOT IN 等价于一连串 <> 用 AND 相连；其中一项 x <> NULL 结果是 NULL，AND 链整体不可能为真，于是整组查询返回空。这是 IN/NOT IN 遇到 NULL 时最常见的翻车点，写子查询前要先确认被比较列不含 NULL。", "relatedConceptId": "c03"}, {"id": "q05", "chapterId": "ch01", "type": "single", "question": "要从 Products 中找出产品名以 Fish 开头的所有产品，正确的 LIKE 模式是？", "options": ["'Fish_'", "'Fish%'", "'%Fish'", "'_Fish_'"], "answer": 1, "explain": "% 匹配任意多个字符（含零个），放在 Fish 之后表示“Fish 后面跟任意内容”。_ 只匹配单个字符；前置 % 表示包含而非开头。", "relatedConceptId": "c04"}, {"id": "q06", "chapterId": "ch01", "type": "single", "question": "`ORDER BY prod_price DESC, prod_name` 的排序规则是？", "options": ["先按产品名升序，价格相同再按价格降序", "先按价格降序；价格相同的行再按产品名默认升序", "所有列都按降序排列", "只按产品名排序，价格被忽略"], "answer": 1, "explain": "ORDER BY 从左到右依次生效：DESC 只修饰它前面的 prod_price；prod_name 没写方向，按默认升序。先比价格，价格相同才比名称。", "relatedConceptId": "c02"}, {"id": "q07", "chapterId": "ch02", "type": "single", "question": "Customers 表共 5 行，其中 2 行 cust_email 为 NULL。`COUNT(*)` 与 `COUNT(cust_email)` 的结果分别是？", "options": ["5 和 5", "5 和 3", "3 和 5", "3 和 3"], "answer": 1, "explain": "COUNT(*) 按行计数，不关心列值，返回 5；COUNT(列名) 会忽略该列为 NULL 的行，email 非空的只有 3 行。AVG/SUM/MIN/MAX 同样忽略 NULL 行。", "relatedConceptId": "c06"}, {"id": "q08", "chapterId": "ch02", "type": "single", "question": "按标准 SQL 规则，下面语句错在哪？\n```sql\nSELECT vend_id, prod_name, COUNT(*)\nFROM Products\nGROUP BY vend_id;\n```", "options": ["COUNT(*) 不能和 GROUP BY 一起用", "prod_name 既不是分组列，也不在聚集函数里，不能出现在 SELECT 中", "vend_id 必须改写成别名才能分组", "没有错误，任何 DBMS 都会照原样执行"], "answer": 1, "explain": "分组后每个 vend_id 对应一组多行，组内 prod_name 可能有多个值，DBMS 无法替你决定取哪一行的名字。SELECT 里非聚集的列必须全部出现在 GROUP BY 中。部分宽松实现（如 SQLite）会放行并随机取一行，但这不符合标准语义。", "relatedConceptId": "c07"}, {"id": "q09", "chapterId": "ch02", "type": "single", "question": "要列出“订单数大于等于 2”的顾客，应该用哪个子句过滤？", "options": ["WHERE COUNT(*) >= 2", "HAVING COUNT(*) >= 2", "ORDER BY COUNT(*) >= 2", "GROUP BY COUNT(*) >= 2"], "answer": 1, "explain": "WHERE 在分组前行级过滤，看不到组级的聚集结果；HAVING 在 GROUP BY 之后过滤分组。按组统计出来的订单数只能用 HAVING 筛。", "relatedConceptId": "c07"}, {"id": "q10", "chapterId": "ch03", "type": "single", "question": "要找出订购过产品 RGAN01 的顾客 ID，书上的子查询写法是：\n```sql\nSELECT cust_id\nFROM Orders\nWHERE order_num IN (SELECT order_num\n                    FROM OrderItems\n                    WHERE prod_id = 'RGAN01');\n```\n关于这条语句的执行方式，哪条正确？", "options": ["先执行外层查询，再把结果交给内层", "子查询由内向外执行：先查出含 RGAN01 的订单号，再用它们过滤 Orders", "两条查询并行执行后随机合并", "子查询只能返回一列一行，否则报错"], "answer": 1, "explain": "非相关子查询由内向外处理：内层 SELECT 先返回订单号 20007、20008，外层再用 IN 匹配 Orders。子查询可以返回多行多列以外的单列多行结果，供 IN 使用。", "relatedConceptId": "c08"}, {"id": "q11", "chapterId": "ch03", "type": "single", "question": "需求：列出所有顾客，包括一个订单都没下过的顾客。应该选用哪种联结？", "options": ["内连接（INNER JOIN）", "左外连接（LEFT OUTER JOIN）", "自然联结即可，不需要外连接", "交叉联结"], "answer": 1, "explain": "内连接只保留两表匹配上的行，没订单的顾客会被丢掉；左外连接保留左表（Customers）全部行，右表匹配不到的列填 NULL。", "relatedConceptId": "c09"}, {"id": "q12", "chapterId": "ch03", "type": "single", "question": "下面两条 LEFT OUTER JOIN 语句，关于它们结果的说法哪条正确？\n```sql\n-- A：条件写在 ON\nSELECT C.cust_id, O.order_num\nFROM Customers C LEFT OUTER JOIN Orders O\n  ON C.cust_id = O.cust_id AND O.order_num = 20007;\n-- B：条件写在 WHERE\nSELECT C.cust_id, O.order_num\nFROM Customers C LEFT OUTER JOIN Orders O\n  ON C.cust_id = O.cust_id\nWHERE O.order_num = 20007;\n```", "options": ["A 和 B 结果完全相同", "A 保留全部顾客，只是 20007 之外的订单列填 NULL；B 过滤后等价于内连接，没匹配的顾客被排除", "B 保留全部顾客，A 会丢掉没订单的顾客", "ON 中不能出现右表的条件，A 直接报错"], "answer": 1, "explain": "ON 条件只作用于配对阶段：左表行全部保留，配对不上的右表列为 NULL。WHERE 在联结完成之后过滤，一旦写出 `O.order_num = 20007`，右表为 NULL 的行不满足条件被剔除，外连接退化成内连接。想保留左表全量，限制右表的条件应放 ON。", "relatedConceptId": "c09"}, {"id": "q13", "chapterId": "ch03", "type": "single", "question": "两条 SELECT 的结果有一行完全重复。用 UNION 与用 UNION ALL 分别组合，结果集行数差别是？", "options": ["UNION 与 UNION ALL 都保留重复行", "UNION 自动去掉重复行，UNION ALL 全部保留（含重复）", "UNION ALL 自动去重，UNION 保留重复", "两者都去重，只是写法不同"], "answer": 1, "explain": "UNION 组合后对结果集做去重，需要额外排序比较；UNION ALL 直接拼接全部行，不去重、更快。确认无重复或不需要去重时优先 UNION ALL。", "relatedConceptId": "c10"}, {"id": "q14", "chapterId": "ch04", "type": "single", "question": "关于事务处理中能回退（ROLLBACK）的语句，哪条符合本书结论？", "options": ["INSERT、UPDATE、DELETE 可以回退；CREATE TABLE、DROP TABLE 这类 DDL 不能回退", "所有 SQL 语句都可以回退", "只有 SELECT 可以回退", "只能回退 INSERT，UPDATE 和 DELETE 不行"], "answer": 0, "explain": "事务用来管理 INSERT、UPDATE、DELETE 这类数据修改；SELECT 回退没有意义，CREATE/DROP 等结构定义操作即使在事务中执行，回退时也不撤销（具体行为随 DBMS）。", "relatedConceptId": "c13"}, {"id": "q15", "chapterId": "ch04", "type": "single", "question": "“把常用的多表查询包成视图，查询速度会比直接查表更快”——这个说法错在哪？", "options": ["没错，视图会把结果存一份所以更快", "视图本身不包含数据，每次使用都要执行底层查询；它简化写法、不自动加速，复杂或嵌套视图反而可能拖慢性能", "视图可以建索引加速，但本书样例表没建", "视图只在第一次查询时慢，之后会缓存全部结果"], "answer": 1, "explain": "视图只是保存的一条查询，数据仍在底层表中；每次查视图都要重新执行联结和过滤。视图不能索引（本书规则），嵌套多层视图时性能可能明显下降，部署前需要实测。", "relatedConceptId": "c12"}, {"id": "q16", "chapterId": "ch04", "type": "single", "question": "执行下面语句时漏掉 WHERE 子句，最严重的后果是？\n```sql\nUPDATE Customers\nSET cust_email = 'kim@thetoystore.com';\n```", "options": ["只更新第一行", "整张 Customers 表的 cust_email 都被改成同一个值", "语句直接拒绝执行，不会改动任何行", "只更新 email 原本为 NULL 的行"], "answer": 1, "explain": "UPDATE 没有 WHERE 就作用于全表；SET 会把每一行的 cust_email 都覆盖成新值。DELETE 不带 WHERE 时也是同一类风险：会清空整张表。执行前先跑一遍等价 SELECT 确认命中行。", "relatedConceptId": "c11"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "SELECT 基本骨架", "back": "SELECT 列 FROM 表 [WHERE 条件] [ORDER BY 排序]；顺序不能乱，ORDER BY 必须在最后", "tags": ["语法"]}, {"id": "f02", "chapterId": "ch01", "front": "WHERE 常用比较操作符", "back": "=、<>（!=）、<、<=、>、>=、BETWEEN ... AND ...、IN (...)、IS NULL / IS NOT NULL", "tags": ["语法"]}, {"id": "f03", "chapterId": "ch01", "front": "AND 与 OR 的求值顺序", "back": "AND 先于 OR 求值；两者混用时用括号明确分组，不要依赖默认优先级", "tags": ["规则"]}, {"id": "f04", "chapterId": "ch01", "front": "LIKE 两个通配符", "back": "% 匹配任意多个字符（含零个）；_ 匹配单个字符；前导通配符通常无法利用索引", "tags": ["语法"]}, {"id": "f05", "chapterId": "ch02", "front": "拼接与别名", "back": "列拼接按 DBMS 用 + 或 ||；计算结果用 AS 起别名，客户端看到的就是别名", "tags": ["语法"]}, {"id": "f06", "chapterId": "ch02", "front": "五个聚集函数", "back": "AVG() 平均、COUNT() 计数、MAX() 最大、MIN() 最小、SUM() 求和；除 COUNT(*) 外都忽略 NULL 行", "tags": ["定义"]}, {"id": "f07", "chapterId": "ch02", "front": "COUNT(*) 与 COUNT(列)", "back": "COUNT(*) 数行数，不看列值；COUNT(列) 跳过该列为 NULL 的行", "tags": ["规则"]}, {"id": "f08", "chapterId": "ch02", "front": "WHERE 与 HAVING 分工", "back": "WHERE 分组前行级过滤；HAVING 分组后过滤组。顺序：WHERE → GROUP BY → HAVING → ORDER BY", "tags": ["规则"]}, {"id": "f09", "chapterId": "ch03", "front": "内连接 vs 外连接", "back": "内连接只留两表匹配行；左外连接保留左表全部行，匹配不到的右表列填 NULL；右外连接反之", "tags": ["定义"]}, {"id": "f10", "chapterId": "ch03", "front": "子查询执行方向", "back": "非相关子查询由内向外：内层先跑出结果，外层再拿来当条件；相关子查询则对外层每行重复执行内层", "tags": ["规则"]}, {"id": "f11", "chapterId": "ch04", "front": "事务四个关键词", "back": "事务 transaction：一组语句；提交 COMMIT 写库；回退 ROLLBACK 撤销；保留点 SAVEPOINT 可局部回退", "tags": ["定义"]}, {"id": "f12", "chapterId": "ch04", "front": "视图的本质", "back": "保存为虚拟表的一条查询，本身不存数据；可重用 SQL、简化复杂查询、做权限隔离，但不自动加速", "tags": ["定义"]}]}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.18<\/div><h1>第 1–6 课：SELECT 检索、排序、WHERE 与通配符过滤<\/h1>\n<blockquote>对应原书第 1 课 了解SQL、第 2 课 检索数据、第 3 课 排序检索数据、第 4 课 过滤数据、第 5 课 高级数据过滤、第 6 课 用通配符进行过滤。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：无，认识表格行列即可\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用 SELECT 从单张表中取指定列、去重取值，并给列起别名；\n<\/li><li>\n用 ORDER BY 按一列或多列、升序或降序排序；\n<\/li><li>\n用 WHERE + 比较操作符、AND/OR、IN、BETWEEN、IS NULL 过滤行；\n<\/li><li>\n用 LIKE 与 %、_ 做部分匹配，并说清 NULL 在比较里的行为。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>SQL 查询的第一组基本功是“从哪张表取、取哪些列、留下哪些行、按什么顺序排”——SELECT 定列、FROM 定表、WHERE 定行、ORDER BY 定序。<\/p>\n<h2>零基础讲解<\/h2>\n<p>本书样例库是一个假想玩具经销商的订单系统，共 5 张表：<\/p>\n<ul><li>\n<strong>Vendors<\/strong>：供应商，主键 <code>vend_id<\/code>，含 <code>vend_name<\/code>、<code>vend_country<\/code> 等；\n<\/li><li>\n<strong>Products<\/strong>：产品目录，主键 <code>prod_id<\/code>，外键 <code>vend_id<\/code> 指向 Vendors，含 <code>prod_name<\/code>、<code>prod_price<\/code>；\n<\/li><li>\n<strong>Customers<\/strong>：顾客，主键 <code>cust_id<\/code>，含 <code>cust_name<\/code>、<code>cust_contact<\/code>、<code>cust_state<\/code>、<code>cust_email<\/code>；\n<\/li><li>\n<strong>Orders<\/strong>：订单头，主键 <code>order_num<\/code>，外键 <code>cust_id<\/code> 指向 Customers；\n<\/li><li>\n<strong>OrderItems<\/strong>：订单明细，每个订单的每个物品一行，主键是 <code>order_num + order_item<\/code>，外键 <code>order_num<\/code>、<code>prod_id<\/code>。\n<\/ul>\n<p>本章所有例子都在这些表上跑。先看最基础的检索：<\/p>\n<pre class=\"lang-sql\"><code>SELECT prod_name\nFROM Products;<\/code><\/pre>\n<p>这条语句从 Products 表取出 <code>prod_name<\/code> 一列的全部行。取多列时列名用逗号分隔，最后一列后面不加逗号：<\/p>\n<pre class=\"lang-sql\"><code>SELECT prod_id, prod_name, prod_price\nFROM Products;<\/code><\/pre>\n<h3>概念 1：主键与外键（难度：基础）<\/h3>\n<p><strong>主键<\/strong>（primary key）是能唯一标识表中每一行的列（或列组合）：任意两行主键值不同，主键列不允许 NULL，也不应被修改。<strong>外键<\/strong>（foreign key）是本表中引用另一表主键的列，它的值必须在被引用表的主键里真实存在。Products 的 <code>vend_id<\/code> 指向 Vendors 的 <code>vend_id<\/code>，Orders 的 <code>cust_id<\/code> 指向 Customers 的 <code>cust_id<\/code>，这些就是外键。<\/p>\n<h3>概念 2：SELECT 与列选择（难度：基础）<\/h3>\n<p><code>SELECT *<\/code> 会取所有列，省事但会带出不需要的数据，降低检索和传输效率；除非确实要全部列，否则应明确列出列名。<code>DISTINCT<\/code> 让结果只保留不同的值：<\/p>\n<pre class=\"lang-sql\"><code>SELECT DISTINCT vend_id\nFROM Products;<\/code><\/pre>\n<p>注意 DISTINCT 作用于所有选定列的组合，不是只修饰第一列。列可以起别名（AS），这在第 7 课做计算字段时还会用到。<\/p>\n<h3>概念 3：WHERE 与比较、逻辑操作符（难度：基础）<\/h3>\n<p>WHERE 在分组和排序之前按行过滤，只保留条件为真的行。比较操作符包括 <code>=<\/code>、<code>&lt;&gt;<\/code>（不等于，部分 DBMS 也写 <code>!=<\/code>）、<code>&lt;<\/code>、<code>&lt;=<\/code>、<code>&gt;<\/code>、<code>&gt;=<\/code>、<code>BETWEEN ... AND ...<\/code>、<code>IN (...)<\/code>。多个条件用 <code>AND<\/code>（同时满足）、<code>OR<\/code>（满足其一）、<code>NOT<\/code>（取反）联结。<\/p>\n<pre class=\"lang-sql\"><code>SELECT prod_id, prod_price, prod_name\nFROM Products\nWHERE vend_id = &#x27;DLL01&#x27; AND prod_price &lt;= 4;<\/code><\/pre>\n<h3>概念 4：通配符与 LIKE 过滤（难度：基础）<\/h3>\n<p>已知值的比较解决不了“包含某段文字”的搜索。<code>LIKE<\/code> 配合两个通配符：<code>%<\/code> 匹配任意多个字符（含零个），<code>_<\/code> 匹配单个字符。<\/p>\n<pre class=\"lang-sql\"><code>SELECT prod_name\nFROM Products\nWHERE prod_name LIKE &#x27;Fish%&#x27;;<\/code><\/pre>\n<h2>为什么这么写（本章四个易踩坑点）<\/h2>\n<h3>为什么 NULL 不能用 <code>= NULL<\/code> 判断<\/h3>\n<p>SQL 里的 NULL 表示“没有值/未知”，不是空字符串，也不是 0。它参与比较时走<strong>三值逻辑<\/strong>：<code>NULL = NULL<\/code>、<code>NULL &lt;&gt; 3<\/code> 的结果都既不是真也不是假，而是 NULL。WHERE 子句只保留结果为真的行，所以 <code>WHERE cust_email = NULL<\/code> 一行都返回不了，哪怕表里确实有 NULL 行。判空只能用专门的谓词：<\/p>\n<pre class=\"lang-sql\"><code>SELECT cust_id\nFROM Customers\nWHERE cust_email IS NULL;<\/code><\/pre>\n<p>反过来，<code>IS NOT NULL<\/code> 排除空值行。写条件时先问自己：这一列可能为 NULL 吗？<\/p>\n<h3>为什么 NOT IN 遇到 NULL 会翻车<\/h3>\n<p><code>x IN (a, b, c)<\/code> 等价于 <code>x = a OR x = b OR x = c<\/code>；<code>x NOT IN (a, b, c)<\/code> 等价于 <code>x &lt;&gt; a AND x &lt;&gt; b AND x &lt;&gt; c<\/code>。AND 链里只要有一项比较结果是 NULL（比如列表里混进了 NULL，或子查询返回了 NULL），整条 AND 链就不可能为真，查询直接返回空。这不是“少返回几行”，而是整组结果消失。写 <code>NOT IN (子查询)<\/code> 之前，要先确认被比较的列不含 NULL；更稳妥的替代是用 <code>NOT EXISTS<\/code> 或在外层先过滤掉 NULL。<\/p>\n<h3>为什么 AND/OR 混用时必须加括号<\/h3>\n<p>SQL 规定 AND 的求值优先级高于 OR。下面这个 WHERE：<\/p>\n<pre class=\"lang-sql\"><code>WHERE vend_id = &#x27;DLL01&#x27; OR vend_id = &#x27;BRS01&#x27; AND prod_price &gt;= 10<\/code><\/pre>\n<p>会被理解成“(BRS01 且价格 ≥10)，或者 DLL01 的全部产品”，而不是“DLL01 或 BRS01 中价格 ≥10 的产品”。想先组合 OR，必须用括号圈起来：<\/p>\n<pre class=\"lang-sql\"><code>WHERE (vend_id = &#x27;DLL01&#x27; OR vend_id = &#x27;BRS01&#x27;)\n  AND prod_price &gt;= 10<\/code><\/pre>\n<h3>为什么 ORDER BY 放在 WHERE 之后<\/h3>\n<p>一条 SELECT 各子句有固定的逻辑执行顺序：先 FROM 找表，再 WHERE 按行过滤，再 SELECT 选列（含计算字段、DISTINCT），最后 ORDER BY 排序输出。所以 ORDER BY 永远写在 WHERE 后面；排序方向 <code>DESC<\/code> 只修饰它紧跟的那一列，没写方向的列默认升序。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[FROM 表] --&gt; B[WHERE 按行过滤]\n    B --&gt; C[SELECT 选列 / DISTINCT 去重]\n    C --&gt; D[ORDER BY 排序输出]\n    B --&gt; E{条件为真?}\n    E --&gt;|否| F[丢弃该行]\n    E --&gt;|是| B<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：过滤发生在选列和排序之前；NULL 比较结果为 NULL 的行，在 WHERE 阶段就被丢掉了。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：WHERE 像在仓库门口按清单验货，不合格的行根本进不到后面的环节；ORDER BY 是货都验完出库时才排的货架顺序。\n<\/li><li>\n实例：找名称中包含 <code>bean bag<\/code> 的产品：\n<\/ul>\n<pre class=\"lang-sql\"><code>SELECT prod_name\nFROM Products\nWHERE prod_name LIKE &#x27;%bean bag%&#x27;;<\/code><\/pre>\n<p>前后都加 <code>%<\/code> 表示“任意位置包含”；只想匹配第二个字符为 <code>i<\/code> 的名字，用 <code>_i%<\/code>。<\/p>\n<ul><li>\n实例：范围过滤等价写法。<code>WHERE prod_price BETWEEN 3 AND 6<\/code> 包含两端；<code>WHERE vend_id IN (&#x27;DLL01&#x27;,&#x27;BRS01&#x27;)<\/code> 等价于两个相等条件用 OR 相连。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为 <code>SELECT *<\/code> 方便就一直用：它会带出不需要的列，拖慢传输，也让列顺序依赖物理存储。\n<\/li><li>\n以为 <code>NULL<\/code> 是空字符串：空字符串是一个确定的值，可以用 <code>= &#x27;&#x27;<\/code> 比较；NULL 是未知，必须走 IS NULL。\n<\/li><li>\n以为 <code>%<\/code> 只匹配多个字符：它也匹配零个字符；<code>_<\/code> 才是单字符占位。\n<\/li><li>\n以为排序方向会作用于后面所有列：<code>ORDER BY a DESC, b<\/code> 里 b 仍是升序。\n<\/ul>\n<h2>完整执行推演与推导<\/h2>\n<p>下面按语句的逻辑执行顺序，逐步推导每条查询命中的行；推导过程给出每行的条件判定，不跳步。<\/p>\n<h3>推演 1：AND 条件在 Products 九行上逐行判定<\/h3>\n<p>语句：<\/p>\n<pre class=\"lang-sql\"><code>SELECT prod_id, prod_price, prod_name\nFROM Products\nWHERE vend_id = &#x27;DLL01&#x27; AND prod_price &lt;= 4;<\/code><\/pre>\n<p>Products 九行依次是：BNBG01 DLL01 3.49、BNBG02 DLL01 3.49、BNBG03 DLL01 3.49、BR01 BRS01 5.99、BR02 BRS01 8.99、BR03 BRS01 11.99、RGAN01 DLL01 4.99、RYL01 FNG01 9.49、RYL02 FNG01 9.49。<\/p>\n<p>逐行推演 AND 的两个条件：<\/p>\n<ol><li>\nBNBG01：vend_id=DLL01 为真，price≤4（3.49）为真，AND 为真，留下。\n<\/li><li>\nBNBG02：两条件都真，留下。\n<\/li><li>\nBNBG03：两条件都真，留下。\n<\/li><li>\nBR01：vend_id=BRS01，第一条件假，AND 为假，丢弃。\n<\/li><li>\nBR02：第一条件假，丢弃。\n<\/li><li>\nBR03：第一条件假，丢弃。\n<\/li><li>\nRGAN01：vend_id=DLL01 为真，price 4.99≤4 为假，AND 为假，丢弃。\n<\/li><li>\nRYL01：两条件都假，丢弃。\n<\/li><li>\nRYL02：两条件都假，丢弃。\n<\/ol>\n<p>推演结果留 BNBG01、BNBG02、BNBG03 三行，与书上输出一致。<\/p>\n<h3>推演 2：三值逻辑在 Customers 邮箱列上的传播<\/h3>\n<p>语句 <code>WHERE cust_email = NULL<\/code>，Customers 五行邮箱依次为：sales@villagetoys.com、NULL、jjones@fun4all.com、dstephens@fun4all.com、NULL。<\/p>\n<p>逐行推演比较结果：非空邮箱与 NULL 做相等比较，结果未知；NULL 与 NULL 做相等比较，结果仍是未知。五行判定全部未知，WHERE 只收结果为真的行，推演结果为 0 行。换成 <code>WHERE cust_email IS NULL<\/code> 后，判空谓词直接给出真/假，两个 NULL 行为真留下，结果两行。<\/p>\n<h2>反事实分析<\/h2>\n<ul><li>\n反事实一：把 AND 换成 OR。同一条件写成 <code>vend_id=&#x27;DLL01&#x27; OR prod_price&lt;=4<\/code>，推演时任一边为真即留行：三只 bag、RGAN01 因 DLL01 留下，BR01/02/03、RYL01/02 因价格 ≤4 不成立仍丢弃，结果仍偏 DLL01；与原 AND 语义不同，价格低于 4 的 BRS01/FNG01 产品（本例无）也会被纳入。\n<\/li><li>\n反事实二：去掉括号。条件 <code>vend_id=&#x27;DLL01&#x27; OR vend_id=&#x27;BRS01&#x27; AND prod_price&gt;=10<\/code> 按 AND 优先解析，推演结果是 DLL01 全部四行加 BR03；加上 <code>(vend_id=&#x27;DLL01&#x27; OR vend_id=&#x27;BRS01&#x27;)<\/code> 再 AND 价格 ≥10，只剩 BR03。数据层面 DLL01 的三个低价产品在两种写法间进出结果集。\n<\/li><li>\n反事实三：把 <code>= NULL<\/code> 保留、改判空为 <code>IS NULL<\/code>，结果从 0 行变为两行 NULL 顾客；这说明判空方式直接改变返回行数。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章完成单表的行选择与过滤，所有条件都作用在一张表上。下一章进入计算字段与聚集：先在 SELECT 列表做单行表达式计算，再把多行压成汇总值；本章的 WHERE 行过滤会作为聚集之前的预处理步骤被沿用。联结、子查询等跨表机制要等到第三章，建立在本章条件判定规则之上。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判断：<code>WHERE cust_email = &#x27;&#x27;<\/code> 能找出邮箱为 NULL 的顾客。（答案：否；NULL 与空字符串不同，应写 <code>IS NULL<\/code>。）\n<\/li><li>\n写出语句：从 Products 找出价格大于等于 10 美元的产品名和价格，按价格降序。（参考答案：<code>SELECT prod_name, prod_price FROM Products WHERE prod_price &gt;= 10 ORDER BY prod_price DESC;<\/code>）\n<\/li><li>\n判断：<code>SELECT DISTINCT vend_id, prod_name<\/code> 是对 <code>vend_id<\/code> 去重，同供应商只留一行。（答案：否；DISTINCT 作用于两列组合，(vend_id, prod_name) 不同的行都会保留。）\n<\/li><li>\n解释：为什么 <code>NOT IN (SELECT vend_id FROM ...)<\/code> 的子查询结果里一旦含 NULL，外层可能一行都查不到？（答案：NOT IN 是 AND 链，<code>x &lt;&gt; NULL<\/code> 为 NULL，整条链不为真。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n骨架：SELECT 列 FROM 表 WHERE 行条件 ORDER BY 排序。\n<\/li><li>\nNULL：三值逻辑，判空用 IS NULL，不能用 = 比较。\n<\/li><li>\n逻辑组合：AND 优先于 OR，混用必加括号。\n<\/li><li>\n通配符：<code>%<\/code> 任意多字符，<code>_<\/code> 单字符；前置 <code>%<\/code> 通常用不上索引。\n<\/ul>", "kind": "chapter", "title": "第 1–6 课：SELECT 检索、排序、WHERE 与通配符过滤"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.75<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1–6 课：SELECT 检索、排序、WHERE 与通配符过滤<\/a><\/span><\/div><h1>第 7–10 课：计算字段、函数、聚集与分组<\/h1>\n<blockquote>对应原书第 7 课 创建计算字段、第 8 课 使用函数处理数据、第 9 课 汇总数据、第 10 课 分组数据。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1–6 课的单表检索与 WHERE\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n在 SELECT 中做拼接、算术运算并用别名输出计算字段；\n<\/li><li>\n知道文本、数值、日期函数在不同 DBMS 间的可移植性差异；\n<\/li><li>\n使用五个聚集函数做表级汇总，并说清 NULL 对它们的影响；\n<\/li><li>\n用 GROUP BY 分组、HAVING 过滤分组，说清 WHERE 与 HAVING 的分工。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>前六章把行取出来，这一章把行压成汇总信息：要么在查询里现场算一个字段，要么按组把多行聚成一个数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：计算字段与常用函数（难度：基础）<\/h3>\n<p>存储进表的数据往往不是报表需要的格式：名字和国家分两列存，发票要把单价乘数量，混合大小写要转成统一形式。<strong>计算字段<\/strong>不物理存储，而是运行时在 SELECT 里由列、常量和表达式算出来。<\/p>\n<p>拼接两个列：按 DBMS 不同，连接符是 <code>+<\/code>（SQL Server 等）或 <code>||<\/code>（多数标准 SQL）；MySQL/MariaDB 用 <code>CONCAT()<\/code>。<\/p>\n<pre class=\"lang-sql\"><code>SELECT RTRIM(vend_name) || &#x27; (&#x27; || RTRIM(vend_country) || &#x27;)&#x27; AS vend_title\nFROM Vendors;<\/code><\/pre>\n<p>算术计算：OrderItems 里存了 <code>quantity<\/code> 和 <code>item_price<\/code>，每行总金额现算即可：<\/p>\n<pre class=\"lang-sql\"><code>SELECT order_num, quantity, item_price,\n       quantity * item_price AS expanded_price\nFROM OrderItems;<\/code><\/pre>\n<p>函数分几类：文本处理（UPPER、LOWER、LENGTH、SUBSTRING、RTRIM、SOUNDEX）、数值处理（ABS、COS、SQRT 等）、日期时间处理。<strong>日期函数是可移植性最差的一类<\/strong>，各 DBMS 形式差别很大，写跨库 SQL 时要单独查文档。<\/p>\n<h3>概念 2：聚集函数（难度：基础）<\/h3>\n<p>聚集函数对一组行计算后返回一个值。SQL 标准的五个：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>函数<\/th><th>作用<\/th><th>NULL 行为<\/th><\/tr><\/thead><tbody><tr><td><code>AVG(列)<\/code><\/td><td>列值平均<\/td><td>忽略 NULL 行<\/td><\/tr><tr><td><code>COUNT(*)<\/code><\/td><td>行数<\/td><td>不忽略，按行计数<\/td><\/tr><tr><td><code>COUNT(列)<\/code><\/td><td>该列非空行数<\/td><td>忽略 NULL 行<\/td><\/tr><tr><td><code>MAX(列)<\/code><\/td><td>最大值<\/td><td>忽略 NULL 行<\/td><\/tr><tr><td><code>MIN(列)<\/code><\/td><td>最小值<\/td><td>忽略 NULL 行<\/td><\/tr><tr><td><code>SUM(列)<\/code><\/td><td>列值求和<\/td><td>忽略 NULL 行<\/td><\/tr><\/tbody><\/table><\/div>\n<pre class=\"lang-sql\"><code>SELECT AVG(prod_price) AS avg_price\nFROM Products;<\/code><\/pre>\n<p>加 WHERE 先过滤再聚集：<\/p>\n<pre class=\"lang-sql\"><code>SELECT AVG(prod_price) AS avg_price\nFROM Products\nWHERE vend_id = &#x27;DLL01&#x27;;<\/code><\/pre>\n<p>聚集还可以作用于表达式，例如订单项的总金额：<\/p>\n<pre class=\"lang-sql\"><code>SELECT SUM(item_price * quantity) AS total_price\nFROM OrderItems\nWHERE order_num = 20005;<\/code><\/pre>\n<h3>概念 3：GROUP BY 与 HAVING 分组（难度：进阶）<\/h3>\n<p>表级汇总只给一个总数。要“每个供应商各有多少产品”，就得先按 <code>vend_id<\/code> 分组，再对每组计数：<\/p>\n<pre class=\"lang-sql\"><code>SELECT vend_id, COUNT(*) AS num_prods\nFROM Products\nGROUP BY vend_id;<\/code><\/pre>\n<p>输出按供应商分组成行：BRS01 3 个、DLL01 4 个、FNG01 2 个。分组之后还想筛掉“产品数少于 2”的组，用 HAVING：<\/p>\n<pre class=\"lang-sql\"><code>SELECT vend_id, COUNT(*) AS num_prods\nFROM Products\nGROUP BY vend_id\nHAVING COUNT(*) &gt;= 2;<\/code><\/pre>\n<h2>为什么这么写（本章四个易踩坑点）<\/h2>\n<h3>为什么 GROUP BY 之后只能选分组列和聚集表达式<\/h3>\n<p>分组的单位是“一组行”，SELECT 里出现的每个非聚集列，在这一组内必须唯一确定。<code>vend_id<\/code> 是分组列，每组只有一个值；<code>COUNT(*)<\/code> 是聚集，每组算出一个数。而 <code>prod_name<\/code> 在一组里可能对应多个产品名，DBMS 无法替你决定取哪一行，标准 SQL 直接拒绝这种写法：<\/p>\n<pre class=\"lang-sql\"><code>-- 标准 SQL 下非法：prod_name 既没分组也没被聚集\nSELECT vend_id, prod_name, COUNT(*)\nFROM Products\nGROUP BY vend_id;<\/code><\/pre>\n<p>部分宽松实现（如 SQLite）会放行并随机取组内一行，但这是实现容错，不是可移植的正确写法。规则一句话：SELECT 里除聚集函数外的列，都必须出现在 GROUP BY 中。<\/p>\n<h3>为什么过滤分组用 HAVING，而不是 WHERE<\/h3>\n<p>WHERE 在分组之前执行，它面对的是原始行，根本还不知道“每组有多少行”。<code>WHERE COUNT(*) &gt;= 2<\/code> 在语义上不成立：COUNT 是分组后才算出来的。HAVING 在 GROUP BY 之后执行，专门过滤分组。两者常配合使用：WHERE 先剔掉不要的行，HAVING 再筛掉不达标的组：<\/p>\n<pre class=\"lang-sql\"><code>SELECT vend_id, COUNT(*) AS num_prods\nFROM Products\nWHERE prod_price &gt;= 4\nGROUP BY vend_id\nHAVING COUNT(*) &gt;= 2;<\/code><\/pre>\n<p>这条语句先剔除价格低于 4 的产品，再分组计数，最后只留产品数 ≥2 的供应商。<\/p>\n<h3>为什么 COUNT(*) 和 COUNT(列) 结果可能不同<\/h3>\n<p><code>COUNT(<em>)<\/code> 数的是行数，不管列里是不是 NULL；<code>COUNT(列名)<\/code> 跳过该列为 NULL 的行。Customers 有 5 行、2 行 email 为空时，<code>COUNT(<\/em>)<\/code> 返回 5，<code>COUNT(cust_email)<\/code> 返回 3。AVG、SUM、MIN、MAX 同样忽略 NULL 行——注意这不是“把 NULL 当 0 参与计算”，而是整行不进入计算。<\/p>\n<h3>为什么函数（尤其日期函数）跨 DBMS 要谨慎<\/h3>\n<p>字符串截取、大小写转换这类函数各 DBMS 大致相通，但日期取年、取月的函数名和参数完全不同：SQL Server 用 <code>DATEPART(yy, order_date)<\/code>，PostgreSQL 用 <code>DATE_PART(&#x27;year&#x27;, order_date)<\/code>，MySQL 用 <code>YEAR(order_date)<\/code>。同一套业务逻辑换数据库，日期处理代码往往要重写；写可移植 SQL 时，能在应用层做的格式化可以放到应用层，数据库端只做必要的过滤。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[FROM 表] --&gt; B[WHERE 行级过滤]\n    B --&gt; C[GROUP BY 分组]\n    C --&gt; D[HAVING 过滤分组]\n    D --&gt; E[聚集计算: AVG/COUNT/MAX/MIN/SUM]\n    E --&gt; F[ORDER BY 输出]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：WHERE 看不到组级聚集值；HAVING 看不到被 WHERE 提前剔除的行。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：GROUP BY 像把一沓发票按门店分装成小摞，COUNT/SUM 是逐摞数张数、算金额；HAVING 是把金额不够的小摞整摞扔掉。WHERE 是分装前先把作废发票挑出去。\n<\/li><li>\n实例：统计每个顾客的订单数，只留下至少下过 2 单的顾客：\n<\/ul>\n<pre class=\"lang-sql\"><code>SELECT cust_id, COUNT(*) AS orders\nFROM Orders\nGROUP BY cust_id\nHAVING COUNT(*) &gt;= 2;<\/code><\/pre>\n<ul><li>\n实例：去重聚集。<code>COUNT(DISTINCT vend_id)<\/code> 只统计不同供应商的个数；不带 DISTINCT 时聚集按全部行计算。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为聚集函数会把 NULL 当 0：AVG/SUM 忽略 NULL 行，分母也不含这些行。\n<\/li><li>\n以为 HAVING 可以换成 WHERE：组级条件（计数、平均值阈值）只能用 HAVING。\n<\/li><li>\n以为先 SELECT 后 GROUP BY：逻辑顺序是先分组，再对每组做聚集和投影。\n<\/li><li>\n以为计算字段会存进表里：它只在这次查询的结果集中存在。\n<\/ul>\n<h2>完整执行推演与推导<\/h2>\n<p>下面按分组与聚集的执行顺序，逐步推导每组的计数结果；推导时先列出行集合，再分堆计数。<\/p>\n<h3>推演 1：GROUP BY 分堆与逐堆计数<\/h3>\n<p>语句：<\/p>\n<pre class=\"lang-sql\"><code>SELECT vend_id, COUNT(*) AS num_prods\nFROM Products\nGROUP BY vend_id;<\/code><\/pre>\n<p>Products 九行 vend_id 依次为：DLL01、DLL01、DLL01、BRS01、BRS01、BRS01、DLL01、FNG01、FNG01。<\/p>\n<p>推演分堆过程：先把 WHERE 之后留下的九行按 vend_id 等值归类。DLL01 堆含第一、二、三、七行共四行；BRS01 堆含第四、五、六行共三行；FNG01 堆含第八、九行共两行。再对每堆各跑一次 COUNT(*)：DLL01=4，BRS01=3，FNG01=2，与书上印刷输出一致。<\/p>\n<h3>推演 2：COUNT(*) 与 COUNT(列) 在 Customers 上的逐行判定<\/h3>\n<p>Customers 五行邮箱：非空、NULL、非空、非空、NULL。推演 <code>COUNT(*)<\/code>：逐行计数不看列值，五行各计一次，结果 5。推演 <code>COUNT(cust_email)<\/code>：逐行检查该列，非空行计一次，两个 NULL 行跳过，结果 3。再推演 <code>AVG(prod_price)<\/code>：Products 九行价格和为 61.41，非空行数 9，61.41/9=6.823333；限定 DLL01 后四行价格和 15.46，15.46/4=3.865，与书上两处输出一致。<\/p>\n<h2>反事实分析<\/h2>\n<ul><li>\n反事实一：去掉 WHERE 再分组。语句 <code>WHERE prod_price&gt;=4<\/code> 去掉后，三只 3.49 的 bag 进入分组；DLL01 堆从一行变回四行，HAVING COUNT(*)&gt;=2 会把 DLL01 也留下，结果从 BRS01、FNG01 两组变成三组。行级过滤与否直接改变分组基数。\n<\/li><li>\n反事实二：把 HAVING 换成 WHERE。<code>WHERE COUNT(*)&gt;=2<\/code> 在分组前执行，此时还没有产生组和计数，标准 SQL 无法求值；组级条件必须放在 HAVING。\n<\/li><li>\n反事实三：SELECT 加入非分组列。在 <code>GROUP BY vend_id<\/code> 后选 <code>prod_name<\/code>，DLL01 堆内有四个不同产品名，取哪一行不唯一，标准 SQL 拒绝；宽松实现随机取一行，结果不可移植。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章把单行计算（计算字段）和多行汇总（聚集、分组）补齐。下一章的子查询会把本章的聚集结果或筛选集合再嵌套进另一条查询；联结则把分组思路跨到多张表上。WHERE 滤行、HAVING 滤组的分工，在跨表查询中同样成立。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判断：<code>SELECT vend_id, prod_name, COUNT(*) FROM Products GROUP BY vend_id;<\/code> 在标准 SQL 下合法。（答案：否；prod_name 非分组列也未被聚集。）\n<\/li><li>\nCustomers 共 5 行、2 行 email 为 NULL，<code>COUNT(cust_email)<\/code> 返回几？（答案：3。）\n<\/li><li>\n写出语句：按 <code>cust_id<\/code> 统计订单数，只保留订单数 ≥2 的顾客。（参考答案：见本章“类比与实例”。）\n<\/li><li>\n为什么不能在 WHERE 里写 <code>COUNT(*) &gt;= 2<\/code>？（答案：WHERE 在分组前执行，此时还没有组级聚集值。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n计算字段：运行时算出，不入库；用 AS 起别名。\n<\/li><li>\n五聚集：AVG、COUNT、MAX、MIN、SUM；除 COUNT(*) 外忽略 NULL。\n<\/li><li>\n分组规则：非聚集列必须全部进 GROUP BY。\n<\/li><li>\n分工：WHERE 滤行，GROUP BY 分组，HAVING 滤组，ORDER BY 排序。\n<\/ul>", "kind": "chapter", "title": "第 7–10 课：计算字段、函数、聚集与分组"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.116<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 7–10 课：计算字段、函数、聚集与分组<\/a><\/span><\/div><h1>第 11–14 课：子查询、联结与组合查询<\/h1>\n<blockquote>对应原书第 11 课 使用子查询、第 12 课 联结表、第 13 课 创建高级联结、第 14 课 组合查询。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3.5 小时 | <strong>前置<\/strong>：第 7–10 课的过滤、聚集与分组\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n把一条 SELECT 嵌套进另一条 SELECT 的 WHERE 中做子查询过滤；\n<\/li><li>\n用内连接把多表按共同值配对，用表别名简化语句；\n<\/li><li>\n在左/右外连接之间做选择，说清外连接保留哪一侧的行；\n<\/li><li>\n用 UNION 组合多条查询，区分 UNION 与 UNION ALL。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>单表回答不了“谁买过什么”这类跨表问题：子查询把多步查询叠进一条语句，联结在运行时把多表行配对，UNION 把多条查询的结果上下拼起来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：子查询（难度：进阶）<\/h3>\n<p>有些问题要分几步走：先查出包含某物品的订单号，再查这些订单属于哪些顾客，最后取顾客信息。可以把第一步的 SELECT 包进第二步的 WHERE 里：<\/p>\n<pre class=\"lang-sql\"><code>SELECT cust_id\nFROM Orders\nWHERE order_num IN (SELECT order_num\n                    FROM OrderItems\n                    WHERE prod_id = &#x27;RGAN01&#x27;);<\/code><\/pre>\n<p>非相关子查询由内向外执行：内层先跑出订单号 20007、20008，外层再用 <code>IN<\/code> 匹配 Orders。子查询还可以作为计算字段出现在 SELECT 列表中（相关子查询），那时对外层每一行都要重复执行一次内层。<\/p>\n<h3>概念 2：内连接与外连接（难度：进阶）<\/h3>\n<p>关系表把同类信息拆成多张表：产品信息在 Products，供应商信息在 Vendors，两表靠 <code>vend_id<\/code> 关联。<strong>联结<\/strong>是查询运行时按共同值把行配对的机制，它本身不是物理存在的表。<\/p>\n<p>最常用的内连接（等值联结）：<\/p>\n<pre class=\"lang-sql\"><code>SELECT Vendors.vend_name, Products.prod_name\nFROM Vendors\nINNER JOIN Products\n  ON Vendors.vend_id = Products.vend_id;<\/code><\/pre>\n<p>内连接只保留两表匹配上的行。要把没下过订单的顾客也列出来，用左外连接：<\/p>\n<pre class=\"lang-sql\"><code>SELECT Customers.cust_name, Orders.order_num\nFROM Customers\nLEFT OUTER JOIN Orders\n  ON Customers.cust_id = Orders.cust_id;<\/code><\/pre>\n<p>左外连接保留左表（Customers）全部行，右表匹配不到的列填 NULL。右外连接方向相反；SQLite 只支持左外连接，需要右侧全量时把两表换个位置即可。<\/p>\n<p>表别名可以缩短语句，也允许在一条查询里多次引用同一张表（自联结）：<\/p>\n<pre class=\"lang-sql\"><code>SELECT C.cust_name, C.cust_contact\nFROM Customers AS C, Orders AS O, OrderItems AS OI\nWHERE C.cust_id = O.cust_id\n  AND OI.order_num = O.order_num\n  AND prod_id = &#x27;RGAN01&#x27;;<\/code><\/pre>\n<h3>概念 3：组合查询 UNION（难度：基础）<\/h3>\n<p>多条 SELECT 可以用 <code>UNION<\/code> 上下拼成一个结果集。两边选出的列数必须相同，对应列的数据类型兼容：<\/p>\n<pre class=\"lang-sql\"><code>SELECT cust_name, cust_contact, cust_email\nFROM Customers\nWHERE cust_state IN (&#x27;IL&#x27;, &#x27;IN&#x27;, &#x27;MI&#x27;)\nUNION\nSELECT cust_name, cust_contact, cust_email\nFROM Customers\nWHERE cust_name = &#x27;Fun4All&#x27;;<\/code><\/pre>\n<h2>为什么这么写（本章四个易踩坑点）<\/h2>\n<h3>为什么联结不是物理表，而是运行时配对<\/h3>\n<p>Products 里只存供应商 ID，不重复存供应商名和地址——同一供应商的多个产品共享 Vendors 里的一行，改地址只需改一处。代价是查询时必须把两表按 ID 配对起来。这个配对只在查询执行期间存在，数据库里并不存一张“联结好的大表”。理解这一点就明白：联结写得是否合理（有没有连接条件、条件是否用上索引）直接决定执行效率；漏掉 ON 条件会退化成笛卡尔积，行数按两表行数相乘。<\/p>\n<h3>为什么 LEFT JOIN 的条件放 ON 和放 WHERE 结果不同<\/h3>\n<p>这是外连接最容易写错的地方。ON 条件作用于<strong>配对阶段<\/strong>：左表行全部保留，右表按条件找匹配，找不到就填 NULL。WHERE 条件作用于<strong>联结完成之后<\/strong>，会把结果集再滤一遍。<\/p>\n<pre class=\"lang-sql\"><code>-- A：右表条件写在 ON，保留全部顾客\nSELECT C.cust_id, O.order_num\nFROM Customers C\nLEFT OUTER JOIN Orders O\n  ON C.cust_id = O.cust_id AND O.order_num = 20007;\n\n-- B：右表条件写在 WHERE，没匹配的行被剔除\nSELECT C.cust_id, O.order_num\nFROM Customers C\nLEFT OUTER JOIN Orders O\n  ON C.cust_id = O.cust_id\nWHERE O.order_num = 20007;<\/code><\/pre>\n<p>A 里没订 20007 的顾客仍在结果中，订单列是 NULL；B 经过 <code>O.order_num = 20007<\/code> 过滤后，NULL 行不满足条件被去掉，外连接实际退化成内连接。想保留左表全量，限制右表的条件要放 ON；只想看匹配上的行，用内连接更直接。<\/p>\n<h3>为什么子查询由内向外执行<\/h3>\n<p>非相关子查询的内层不依赖外层，DBMS 先把它跑成一个结果集合，再交给外层做 <code>IN<\/code>、比较或计算。写嵌套查询时先确认内层返回的列数和类型能被外层接受：<code>IN<\/code> 后面的子查询只能返回一列。反过来，相关子查询的内层引用了外层列，执行顺序变成“外层取一行 → 内层按这行的值跑一次 → 再取下一行”，数据量大时要留意性能。<\/p>\n<h3>为什么 UNION 自动去重，UNION ALL 不去重<\/h3>\n<p>UNION 把多条结果拼起来后做一次去重比较，重复行只留一条；UNION ALL 直接拼接，重复行全部保留，省去排序比较的开销。两条查询本来就互斥、或业务上允许重复行时，用 UNION ALL 更快。另外两边 SELECT 的列数必须一致、对应列类型兼容，否则 DBMS 报错；最终结果的列名以第一条 SELECT 为准。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[子查询: 内层 SELECT 先执行] --&gt; B[结果交给外层 WHERE IN]\n    C[内连接: 两表匹配行保留] --&gt; D[外连接: 左/右表全量 + NULL 补位]\n    E[UNION: 上下拼接并去重] --&gt; F[UNION ALL: 上下拼接不去重]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：联结像按学号把花名册和成绩单拼到一起；内连接只拼出两边都有的学生，外连接把没成绩单的学生也留在名单里、成绩栏空着。\n<\/li><li>\n实例：自联结找同公司的联系人。先按联系人名查出公司名，再用这个公司名反查同公司其他人；用表别名把 Customers 当两张表用。\n<\/li><li>\n实例：组合查询等价改写。本章 UNION 的例子也能用 <code>WHERE cust_state IN (&#x27;IL&#x27;,&#x27;IN&#x27;,&#x27;MI&#x27;) OR cust_name = &#x27;Fun4All&#x27;<\/code> 完成；条件来自不同表、或两条查询本身就是独立报表时，UNION 更清晰。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为外连接会把右表也全量保留：LEFT 只保左表，RIGHT 只保右表，别搞反方向。\n<\/li><li>\n以为 ON 里写什么条件都和 WHERE 等价：外连接中两者时机不同，结果差别很大。\n<\/li><li>\n以为子查询可以返回任意列给 IN：IN 后面只能是单列。\n<\/li><li>\n以为 UNION 比 UNION ALL 高级：去重是额外成本，不需要去重时优先 UNION ALL。\n<\/ul>\n<h2>完整执行推演与推导<\/h2>\n<p>下面按配对与过滤的先后时机，逐步推导联结结果的行数；推导过程区分配对阶段和事后过滤阶段。<\/p>\n<h3>推演 1：左外连接的行数与 NULL 补位<\/h3>\n<p>语句：<\/p>\n<pre class=\"lang-sql\"><code>SELECT C.cust_id, O.order_num\nFROM Customers C\nLEFT OUTER JOIN Orders O\n  ON C.cust_id = O.cust_id;<\/code><\/pre>\n<p>Customers 五行：1000000001、1000000002、1000000003、1000000004、1000000005。Orders 五行：20005→001，20006→003，20007→004，20008→005，20009→001。<\/p>\n<p>推演配对过程：001 匹配 20005、20009 两行；002 在 Orders 找不到匹配，保留左表行、订单列填 NULL；003 匹配 20006；004 匹配 20007；005 匹配 20008。推演结果共 6 行，其中 002 一行订单列为 NULL。<\/p>\n<h3>推演 2：子查询由内向外两步取值<\/h3>\n<p>语句：<\/p>\n<pre class=\"lang-sql\"><code>SELECT cust_id\nFROM Orders\nWHERE order_num IN (SELECT order_num\n                    FROM OrderItems\n                    WHERE prod_id = &#x27;RGAN01&#x27;);<\/code><\/pre>\n<p>推演第一步跑内层：OrderItems 中 prod_id 为 RGAN01 的行是 20007、20008，内层结果集合 {20007, 20008}。推演第二步跑外层：Orders 五行逐行匹配集合，20005、20006、20009 不在集合中排除，20007 留 1000000004，20008 留 1000000005。结果两行，与书上印刷输出一致。<\/p>\n<h2>反事实分析<\/h2>\n<ul><li>\n反事实一：LEFT JOIN 改成 INNER JOIN。002 没有匹配订单，内连接配对阶段就丢弃该行，结果从 6 行变为 5 行，NULL 补位行消失。\n<\/li><li>\n反事实二：右表条件从 ON 挪到 WHERE。语句先左外连接得到 6 行，再 <code>WHERE O.order_num=20007<\/code>：NULL 行与其他订单号行都不满足条件，只剩 004 一行；外连接退化成内连接效果。\n<\/li><li>\n反事实三：NOT IN 换成 NOT EXISTS。内层结果含 NULL 时 NOT IN 整组返回空；NOT EXISTS 按存在性判断，不把 NULL 带入逐值比较，行为不同。改写时要按数据是否含 NULL 选择写法。\n<\/li><li>\n反事实四：去掉联结条件。Customers 5 行与 Orders 5 行不做配对，推演为笛卡尔积 25 行，顾客与订单对错号。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章把查询从单表扩展到跨表：子查询分步取值，联结横向配对，UNION 纵向拼接。下一章转入写操作与数据库对象：增删改按主键定位单行，视图封装本章的联结查询，事务保护跨表写入。本章的联结类型选择和 ON/WHERE 分工，是理解视图展开的前提。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n需求：列出所有顾客及其订单，没订单的顾客也要出现。选内连接还是左外连接？（答案：左外连接，左表 Customers 全量保留。）\n<\/li><li>\n判断：<code>LEFT OUTER JOIN ... ON ... WHERE O.order_num IS NOT NULL<\/code> 之后，结果等价于内连接。（答案：是；右表 NULL 行被 WHERE 剔除。）\n<\/li><li>\nUNION 与 UNION ALL 哪个会去掉重复行？（答案：UNION。）\n<\/li><li>\n子查询 <code>IN (SELECT order_num ...)<\/code> 为什么只能返回一列？（答案：IN 把外层列值与子查询单列结果逐行比较，多列无法配对。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n子查询：非相关由内向外；IN 后子查询返回单列多行。\n<\/li><li>\n联结：运行时配对，不是物理表；内连接留匹配行，外连接补 NULL。\n<\/li><li>\nON 管配对，WHERE 管事后过滤；外连接退化多因右表条件写进了 WHERE。\n<\/li><li>\nUNION 去重，UNION ALL 保留重复；两边列数与类型必须对齐。\n<\/ul>", "kind": "chapter", "title": "第 11–14 课：子查询、联结与组合查询"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.157<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 11–14 课：子查询、联结与组合查询<\/a><\/span><\/div><h1>第 15–22 课：增删改、表与视图、存储过程、事务、游标与高级特性<\/h1>\n<blockquote>对应原书第 15 课 插入数据、第 16 课 更新和删除数据、第 17 课 创建和操纵表、第 18 课 使用视图、第 19 课 使用存储过程、第 20 课 管理事务处理、第 21 课 使用游标、第 22 课 高级SQL特性。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：前三章的查询、联结与分组\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出插入完整行、部分行和插入查询结果的 INSERT；\n<\/li><li>\n安全地写 UPDATE、DELETE，说清省略 WHERE 的后果；\n<\/li><li>\n用 CREATE TABLE / ALTER TABLE / DROP TABLE 操纵表结构，理解 NULL 与约束；\n<\/li><li>\n创建和使用视图，解释视图与真实表的差别；\n<\/li><li>\n说清存储过程、游标、事务、约束、索引、触发器各自解决什么问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>查询把数据读出来，本章把数据写进去、改掉、删掉，并管理表结构与一致性：所有写操作都要先想“影响哪些行”，所有成批操作都要想“中途失败怎么办”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：插入、更新与删除（难度：基础）<\/h3>\n<p>INSERT 插入一行。推荐写法显式列出列名，值按列名顺序给，不依赖表的物理列序：<\/p>\n<pre class=\"lang-sql\"><code>INSERT INTO Customers(cust_id, cust_name, cust_address,\n                      cust_city, cust_state, cust_zip,\n                      cust_country, cust_contact, cust_email)\nVALUES(1000000006, &#x27;Toy Land&#x27;, &#x27;123 Any Street&#x27;,\n       &#x27;New York&#x27;, &#x27;NY&#x27;, &#x27;11111&#x27;, &#x27;USA&#x27;, NULL, NULL);<\/code><\/pre>\n<p>某列没有值时用 NULL（前提是该列允许 NULL）。INSERT 也可以把另一条 SELECT 的结果整批插入。<\/p>\n<p>UPDATE 修改已有行，三部分：要更新的表、列名与新值、过滤条件：<\/p>\n<pre class=\"lang-sql\"><code>UPDATE Customers\nSET cust_email = &#x27;kim@thetoystore.com&#x27;\nWHERE cust_id = 1000000005;<\/code><\/pre>\n<p>更新多列时共用一个 SET，列值对之间用逗号分隔。DELETE 删除整行：<\/p>\n<pre class=\"lang-sql\"><code>DELETE FROM Customers\nWHERE cust_id = 1000000006;<\/code><\/pre>\n<h3>概念 2：视图（难度：进阶）<\/h3>\n<p>视图是保存为虚拟表的一条查询。复杂的多表联结写一次包成视图，之后像查表一样查它：<\/p>\n<pre class=\"lang-sql\"><code>CREATE VIEW ProductCustomers AS\nSELECT cust_name, cust_contact, cust_email, prod_id\nFROM Customers\nINNER JOIN Orders ON Customers.cust_id = Orders.cust_id\nINNER JOIN OrderItems ON Orders.order_num = OrderItems.order_num;<\/code><\/pre>\n<pre class=\"lang-sql\"><code>SELECT cust_name, cust_contact\nFROM ProductCustomers\nWHERE prod_id = &#x27;RGAN01&#x27;;<\/code><\/pre>\n<p>视图用于重用 SQL、简化复杂操作、只暴露表的一部分做权限隔离、更改数据的表示格式。<\/p>\n<h3>概念 3：事务处理（难度：进阶）<\/h3>\n<p>订单录入要跨 Orders 和 OrderItems 多张表：先加顾客、再加订单头、再逐条加明细。中途磁盘满或锁冲突，留下的就是“空订单”或“不完整订单”。<strong>事务<\/strong>把这一组语句绑成一个单元：要么全部提交写库，要么全部回退到之前的安全状态。<\/p>\n<ul><li>\n<strong>COMMIT<\/strong>：把未存储的结果正式写入表；\n<\/li><li>\n<strong>ROLLBACK<\/strong>：撤销指定语句的效果；\n<\/li><li>\n<strong>SAVEPOINT<\/strong>：事务内的临时占位符，可以只回退到某个保留点，而不是整个事务。\n<\/ul>\n<h3>概念 4：存储过程与游标（难度：高难）<\/h3>\n<p><strong>存储过程<\/strong>是为以后使用而保存的一条或多条 SQL 语句，可带参数。它把多步处理封装成一个调用单元，保证各处使用同一套逻辑、减少出错，也便于统一改动和做访问控制；通常以编译形式存储，执行开销更低。SQLite 不支持存储过程。<\/p>\n<p><strong>游标<\/strong>是存储在服务器上的查询结果集。普通 SELECT 返回一整组行，游标允许应用逐行取出、前后滚动浏览；步骤是声明游标、打开游标、逐行取出、关闭并释放。<\/p>\n<h3>概念 5：约束、索引与触发器（难度：进阶）<\/h3>\n<p><strong>约束<\/strong>是定义在表上、管理数据如何插入和处理的规则：主键约束保证唯一非空，外键约束保证引用完整性，NOT NULL 禁止空值，检查约束限定列取值范围。<strong>索引<\/strong>是一列或多列上保存的排序辅助列表，用来加快搜索和排序；视图不能建索引。<strong>触发器<\/strong>是在 INSERT/UPDATE/DELETE 发生时自动执行的 SQL 代码。<\/p>\n<h2>为什么这么写（本章四个易踩坑点）<\/h2>\n<h3>为什么视图不加速查询<\/h3>\n<p>视图本身不包含任何数据，它存的只是一条查询定义。每次查视图，DBMS 都要把底层的联结、过滤重新跑一遍，再把结果返回给你。视图解决的是“写法复用和权限隔离”，不是“性能加速”：复杂视图、嵌套视图每次执行都要展开成底层查询，性能可能明显下降；视图也不能建索引、不能挂触发器或默认值。想加速检索，手段是在底层表上建合适的索引、写好联结条件，而不是包一层视图。<\/p>\n<h3>为什么 UPDATE / DELETE 不能省略 WHERE<\/h3>\n<p>UPDATE 不带 WHERE，SET 会作用于整张表；DELETE 不带 WHERE，会清空整张表。这两类语句没有“只改第一行”的默认保护。动手前先用同样的 WHERE 跑一遍 SELECT，确认命中的就是目标行；多列更新时检查 SET 里的逗号，别把列值对写串。本书给的指导原则：UPDATE 和 DELETE 都要有 WHERE，除非确实要改/删全表；执行前确认自己有相应权限，并在事务里先试跑、核对结果再 COMMIT。<\/p>\n<h3>为什么事务要“要么全做，要么全不做”<\/h3>\n<p>跨表操作的中间状态对业务是非法的：订单头已插入、明细还没插入，就是一个空订单。事务用提交和回退把这组语句变成原子单元——中途出错就 ROLLBACK，把已做的修改全部撤销，数据库回到已知安全状态；全部成功才 COMMIT。需要注意边界：事务管理的是 INSERT、UPDATE、DELETE 这类数据修改；SELECT 回退没有意义，CREATE TABLE、DROP TABLE 等结构定义操作即使在事务中执行，回退时也不撤销（具体行为随 DBMS）。保留点 SAVEPOINT 让你可以只回退一段，而不必整个事务重来。<\/p>\n<h3>为什么外键约束要放在 DBMS 端执行<\/h3>\n<p>如果只靠应用程序检查“订单里的顾客 ID 必须存在”，多个应用、多条路径各写一遍校验，总有漏网的可能；一旦 Products 里出现 Vendors 中不存在的 <code>vend_id<\/code>，这些产品在联结时就成了访问不到的孤儿行。外键约束由 DBMS 强制：外键列只能填被引用表主键中真实存在的值，非法值直接被拒绝。这类完整性检查放在数据库端执行，比客户端逐条校验更高效，也绕不开。主键、外键、NOT NULL、检查约束共同构成引用完整性的防线。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n    A[写操作: INSERT / UPDATE / DELETE] --&gt; B{WHERE 命中行确认}\n    B --&gt;|成批跨表| C[事务: BEGIN]\n    C --&gt; D[全部成功?]\n    D --&gt;|是| E[COMMIT 写库]\n    D --&gt;|否| F[ROLLBACK 回退 / 回退到 SAVEPOINT]\n    G[视图: 保存的查询, 不存数据] --&gt; H[每次查询实时展开到底层表]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：事务像转账——扣款和入账必须同时成立，失败就两边都还原，不能只扣不加。视图像一份固定模板的报表入口，数据还是源账本里的，模板不替你存账。\n<\/li><li>\n实例：建表时声明主键和外键：\n<\/ul>\n<pre class=\"lang-sql\"><code>CREATE TABLE Orders\n(\n    order_num  INTEGER   NOT NULL PRIMARY KEY,\n    order_date DATETIME  NOT NULL,\n    cust_id    CHAR(10)  NOT NULL REFERENCES Customers(cust_id)\n);<\/code><\/pre>\n<ul><li>\n实例：事务骨架（语法随 DBMS）：\n<\/ul>\n<pre class=\"lang-sql\"><code>BEGIN TRANSACTION;\n\nINSERT INTO Orders(order_num, order_date, cust_id)\nVALUES(20010, &#x27;2020-06-15&#x27;, &#x27;1000000001&#x27;);\n\nINSERT INTO OrderItems(order_num, order_item, prod_id, quantity, item_price)\nVALUES(20010, 1, &#x27;BNBG01&#x27;, 1, 3.49);\n\nCOMMIT;<\/code><\/pre>\n<p>任一步出错则 <code>ROLLBACK;<\/code> 撤销本事务内的改动。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为视图存了一份数据、查视图更快：视图不存数据，每次重新执行底层查询。\n<\/li><li>\n以为 UPDATE/DELETE 忘写 WHERE 会只影响一行：实际是全表。\n<\/li><li>\n以为所有 SQL 都能回滚：DDL（CREATE/DROP）通常不能随事务撤销。\n<\/li><li>\n以为约束是可选的提醒：外键、NOT NULL 由 DBMS 强制执行，非法数据进不来。\n<\/li><li>\n以为游标是必须掌握的日常工具：普通报表和交互查询用结果集即可，游标主要用于逐行浏览或定向处理的场景。\n<\/ul>\n<h2>完整执行推演与推导<\/h2>\n<p>下面按事务提交边界和视图展开顺序，逐步推导写操作与查询的结果；推导过程标出每一步改动是否持久化。<\/p>\n<h3>推演 1：事务内跨表写入的成功与回退路径<\/h3>\n<p>流程：向 Orders 插订单头 20010，再向 OrderItems 插一条明细，同一事务内完成。<\/p>\n<p>推演成功路径：BEGIN TRANSACTION 后执行订单头 INSERT，Orders 内出现 20010 行；再执行明细 INSERT，OrderItems 内出现 20010 的第一条物品；两步都成功后 COMMIT，两行改动一起持久写入，其他连接可见完整订单。<\/p>\n<p>推演失败路径：第二条明细 INSERT 报错，执行 ROLLBACK。本事务内已插入的订单头一并撤销，Orders 回到事务前的行数，不留下空订单。若设了保留点，可只回退保留点之后的明细插入，订单头保留。<\/p>\n<h3>推演 2：查视图时的底层展开<\/h3>\n<p>视图 ProductCustomers 保存 Customers、Orders、OrderItems 三表联结的定义。推演 <code>SELECT cust_name, cust_contact FROM ProductCustomers WHERE prod_id=&#x27;RGAN01&#x27;<\/code> 的执行：DBMS 取出视图定义，把视图名替换成三表 INNER JOIN，叠加 prod_id=&#x27;RGAN01&#x27; 条件，按普通联结查询执行。底层 OrderItems 中 RGAN01 对应 20007、20008，Orders 对应 1000000004、1000000005，推演结果这两名顾客；视图本身没有保存这些行。<\/p>\n<h2>反事实分析<\/h2>\n<ul><li>\n反事实一：指望视图加速。视图不存数据，每次查询都重新展开底层联结；在视图上建索引在本书规则下不允许。把复杂视图当缓存使用，查视图不会比优化过的直接查表更快，嵌套多层时反而更慢。\n<\/li><li>\n反事实二：UPDATE 去掉 WHERE。<code>UPDATE Customers SET cust_email=&#x27;kim@...&#x27;<\/code> 没有条件限定，全表每行 email 都被覆盖成同一值；先跑等价 SELECT 核对命中行，是去掉 WHERE 之前必须做的检查。\n<\/li><li>\n反事实三：事务中执行 DDL 后期望回滚撤销。事务内 CREATE TABLE 后 ROLLBACK，表结构通常仍然存在；能随事务撤销的是 INSERT、UPDATE、DELETE，结构定义操作不在回退范围内。\n<\/li><li>\n反事实四：外键约束改成应用层校验。 Products 写入不存在的 vend_id 时数据库放行，联结后这些产品匹配不到供应商，报表中静默消失；约束放回 DBMS 端，非法写入在入库时即被拒绝。\n<\/ul>\n<h2>与相邻章节的衔接<\/h2>\n<p>本章是全书查询能力的落地与保障层：前三章的 SELECT、联结、分组被视图封装复用，写操作按主键定位单行，事务保证跨表写入不留下半成品。约束、索引、触发器在表结构层面配合这套机制。学完后回头看，单表检索 → 汇总分组 → 跨表组合 → 写入与一致性，构成一条完整的 SQL 使用链路。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判断：给常用多表查询建视图后，相同查询会比直接查表快。（答案：否；视图不存数据，每次仍执行底层查询，不自动加速。）\n<\/li><li>\n<code>UPDATE Customers SET cust_email = &#x27;x@y.com&#x27;;<\/code> 没有 WHERE，会发生什么？（答案：全表每行 email 都被改成同一个值。）\n<\/li><li>\n哪些语句不能靠 ROLLBACK 撤销？（答案：CREATE、DROP 等结构定义操作；SELECT 回退无意义。）\n<\/li><li>\nOrders 的 <code>cust_id<\/code> 为什么需要定义外键？（答案：保证订单引用的顾客在 Customers 中真实存在，防止孤儿订单。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n写操作先确认 WHERE 命中行；INSERT 显式列名，UPDATE 单 SET 多列，DELETE 按条件删行。\n<\/li><li>\n视图 = 保存的查询，不存数据、不自动加速、不能建索引。\n<\/li><li>\n事务：COMMIT / ROLLBACK / SAVEPOINT，保护数据修改的原子性。\n<\/li><li>\n存储过程封装多步 SQL；游标逐行访问结果集。\n<\/li><li>\n约束（主键/外键/NOT NULL/检查）保完整性，索引加快检索，触发器自动执行。\n<\/ul>", "kind": "chapter", "title": "第 15–22 课：增删改、表与视图、存储过程、事务、游标与高级特性"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.18<\/div><h1>主键与外键<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1–6 课、第 15–22 课\n<\/ul>\n<h2>问题<\/h2>\n<p>一张表里有很多行，应用程序要定位“某一个顾客”“某一个订单”，靠什么保证找到的是唯一那一行？多张表拆开存储之后，又靠什么把 Products 行和它的 Vendors 行对上？如果没有主键，UPDATE 或 DELETE 某一行时就可能误伤别的行；如果没有外键约束，订单里可以填一个根本不存在的顾客 ID，联结之后这些行就变成谁也匹配不上的孤儿行。主键和外键就是为解决“唯一标识一行”和“跨表合法引用”这两个困难出现的。<\/p>\n<h2>定义（逐句拆开）<\/h2>\n<p><strong>主键（primary key）<\/strong>：表中一列或一组列，用来唯一标识表中的每一行。拆开这句话：<\/p>\n<ul><li>\n“一列或一组列”：单列主键如 Customers 的 <code>cust_id<\/code>；组合主键如 OrderItems 的 <code>order_num + order_item<\/code>，两列合起来才能唯一确定一行。\n<\/li><li>\n“唯一标识”：任意两行在主键列上的值不能相同。\n<\/li><li>\n附加限定：主键列不允许 NULL；主键值不应被修改；删除一行后它的主键值不再分配给新行。\n<\/ul>\n<p><strong>外键（foreign key）<\/strong>：本表中的一列或一组列，其值必须出现在另一表的主键中。拆开：<\/p>\n<ul><li>\n“另一表的主键”：外键指向的目标必须是被引用表的主键（或唯一约束列）。\n<\/li><li>\n“必须出现”：外键列填的值，在被引用表中能找到对应行；找不到就违反约束，DBMS 拒绝写入。\n<\/ul>\n<p>正例：Orders 的 <code>cust_id<\/code> 取值 <code>1000000001<\/code>，Customers 中存在同一 <code>cust_id<\/code> 的行，引用合法。反例：Orders 填了一个 Customers 里没有的 <code>cust_id<\/code>，在有外键约束时这条 INSERT 会被拒绝。<\/p>\n<h2>原理推导（执行推演）<\/h2>\n<p>推演一张表为什么需要主键。假设 Products 表没有主键，两行产品恰好同名同价，应用想改掉其中一行的价格，WHERE 只能写 <code>WHERE prod_name = &#x27;...&#x27; AND prod_price = ...<\/code>，条件会同时命中两行，更新无法只落在目标行上。引入 <code>prod_id<\/code> 后，每行有一个不重复的值，<code>WHERE prod_id = &#x27;BR01&#x27;<\/code> 只命中一行，定位是确定的。<\/p>\n<p>再推演外键如何守住引用关系。Products 的 <code>vend_id<\/code> 引用 Vendors 的 <code>vend_id<\/code>。写入一行 Products 时，DBMS 拿这个 <code>vend_id<\/code> 去 Vendors 主键里查：查到就放行；查不到就报错。删除一个 Vendors 行之前，DBMS 先检查有没有 Products 行引用它：有引用时按约束策略阻止删除，或级联处理。这条链路保证“产品指向的供应商一定存在”。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>成立条件：被引用列必须是主键或带唯一约束；外键列的数据类型要与被引用列匹配。边界情况：<\/p>\n<ul><li>\n外键列可以重复：一个顾客多个订单，Orders 里多行 <code>cust_id<\/code> 相同是合法的，外键不要求唯一。\n<\/li><li>\n外键列可以为 NULL（除非同时声明 NOT NULL）：NULL 不参与引用匹配，表示“暂时还没有关联对象”。\n<\/li><li>\n失败案例：只在应用程序里“约定”ID 要对应，数据库不建外键。某条路径漏校验写入了无效 <code>vend_id<\/code>，联结 Products 与 Vendors 时这些产品行匹配不到供应商，报表里直接消失，事后排查要回溯所有写入路径。\n<\/ul>\n<h2>辨析<\/h2>\n<p>与“唯一约束”对比：唯一约束只保证本表列值不重复，不一定能被外键作为引用目标之外承担标识角色；主键是一种特殊的唯一约束，额外带有非空、不可随意修改的语义。与“索引”对比：主键默认附带索引以加速查找，但索引本身不保证唯一性和非空，二者不是一回事。外键与主键的差别在方向：主键在被引用方，外键在引用方；同一个 <code>cust_id<\/code> 在 Customers 是主键，在 Orders 是外键。<\/p>\n<h2>概念联系<\/h2>\n<p>前置概念：表、行、列这些最基本结构。后继概念：联结（第 12 课靠主键与外键的共同值配对行）、引用完整性约束（第 22 课把主键、外键作为约束类型声明）、事务与写操作（第 15、16、20 课按主键定位单行做修改）。主键与外键把“拆成多张表”的关系数据库重新串成一个整体。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（主键与外键）<\/summary><div class=\"depth-body\"><h1>主键与外键：完整推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>从“一条 UPDATE 能安全定位单行”这个结果往回推，需要哪些前提：<\/p>\n<ol><li>\n能定位单行，前提是存在一列（或列组合）在全表不重复，这就是主键要承担的角色。\n<\/li><li>\n跨表取数时两表能对上，前提是两表持有同一个可比较的值；被引用方用主键提供这个值，引用方用外键存放这个值。\n<\/li><li>\n引用值不能乱写，前提是 DBMS 在写入和删除时做检查，这就是外键约束的执行时机。\n<\/li><li>\n约束能被执行，前提是建表时把主键、外键显式声明出来；只靠口头约定，数据库不会自动检查。\n<\/li><li>\n检查动作能找到被引用行，前提是被引用列上存在主键或唯一约束提供的查找路径；没有这条路径，校验只能逐行扫描，开销随表增长。\n<\/ol>\n<p>沿着这条链往上，最底层的假设是：关系模型用共同值表示两行之间的对应关系，而不是把两张表的信息物理拼成一张宽表；数据拆开存，就必须有一套机制把行重新标识和配对。<\/p>\n<h2>正向推导（解析 → 执行顺序 → 行集合与列集合变化）<\/h2>\n<p>先把一条写语句在脑子里拆成几个执行阶段，每个阶段说清对行集合和列集合做了什么。<\/p>\n<p>第一阶段，解析。DBMS 拿到 <code>INSERT INTO Items(item_id, sup_id, item_name) VALUES(...)<\/code>，先对照 Items 的表结构解析列名：<code>item_id<\/code>、<code>sup_id<\/code>、<code>item_name<\/code> 三列分别对应 VALUES 里的三个值；未列出的列进入“取默认值或 NULL”的待填清单。解析阶段不查表内现有数据，只确认语句引用的列真实存在、类型可容纳。<\/p>\n<p>第二阶段，主键唯一性检查。DBMS 把新行的 <code>item_id<\/code> 拿去主键列做等值查找：已存在相同主键值，拒绝写入；不存在，候选行才继续往下走。这一步处理的对象是“新行是否与现有行冲突”，检查范围是主键列上的索引或全表。<\/p>\n<p>第三阶段，外键引用检查。对新行里的外键列 <code>sup_id<\/code>，DBMS 拿这个值去被引用表 Suppliers 的主键列查找：找到对应行，放行；找不到，整行写入被拒绝。这一步处理的对象是“引用值是否合法”，范围是被引用表的主键集合。<\/p>\n<p>第四阶段，落行。前两阶段都通过，新行按列名列表写入 Items；列名列表决定每个值落到哪一列，不依赖表的物理列顺序。<\/p>\n<p>再推演读路径上的主键作用。<code>UPDATE Items SET item_name=&#x27;Rope Pro&#x27; WHERE item_id=&#x27;I1&#x27;<\/code>：解析阶段确认 <code>item_id<\/code> 是 Items 的主键；执行时 DBMS 沿主键索引把行集合从“全表全部行”缩小到“主键等于 I1 的那一行”，SET 只对这一行生效。如果 WHERE 用的是普通业务列，匹配可能命中多行，行集合没有缩小到单行，更新就可能波及目标之外的行。<\/p>\n<p>结果为什么是这个结果：主键检查保证候选行在标识列上唯一，外键检查保证引用值落在被引用集合之内，两个检查一前一后把“写得进去”的条件钉死；读路径再靠主键索引把候选行集合缩到一行，单行定位才是确定的。<\/p>\n<h2>算例一（原书样例库）<\/h2>\n<p>Vendors（节选，主键 vend_id）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>vend_id<\/th><th>vend_name<\/th><\/tr><\/thead><tbody><tr><td>DLL01<\/td><td>Doll House Inc.<\/td><\/tr><tr><td>BRS01<\/td><td>Bear Emporium<\/td><\/tr><tr><td>FNG01<\/td><td>Fun Plus Dolls<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Products（节选，主键 prod_id，外键 vend_id）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>prod_id<\/th><th>vend_id<\/th><th>prod_name<\/th><th>prod_price<\/th><\/tr><\/thead><tbody><tr><td>BNBG01<\/td><td>DLL01<\/td><td>Fish bean bag toy<\/td><td>3.49<\/td><\/tr><tr><td>BR01<\/td><td>BRS01<\/td><td>8 inch teddy bear<\/td><td>5.99<\/td><\/tr><tr><td>RYL01<\/td><td>FNG01<\/td><td>King doll<\/td><td>9.49<\/td><\/tr><\/tbody><\/table><\/div>\n<p>推演两条写入：<\/p>\n<ul><li>\n<code>INSERT INTO Products(prod_id, vend_id, prod_name, prod_price) VALUES(&#x27;XXXX99&#x27;,&#x27;BAD99&#x27;,&#x27;Test&#x27;,1.0);<\/code>：<code>BAD99<\/code> 在 Vendors 主键中不存在，外键检查失败，语句被拒绝。\n<\/li><li>\n<code>INSERT INTO Products(prod_id, vend_id, prod_name, prod_price) VALUES(&#x27;BNBG04&#x27;,&#x27;DLL01&#x27;,&#x27;Mouse toy&#x27;,2.99);<\/code>：<code>DLL01<\/code> 存在于 Vendors，<code>BNBG04<\/code> 未与现有主键重复，检查通过，行写入。\n<\/ul>\n<p>再推演定位单行：<code>UPDATE Products SET prod_price = 3.99 WHERE prod_id = &#x27;BNBG01&#x27;;<\/code> 用主键过滤，只命中 BNBG01 一行；如果改成 <code>WHERE prod_name = &#x27;Fish bean bag toy&#x27;<\/code>，一旦未来出现同名产品，就会同时更新多行。<\/p>\n<h2>算例二（专用小表，SQLite 已跑通）<\/h2>\n<p>建表与插入：<\/p>\n<pre class=\"lang-sql\"><code>PRAGMA foreign_keys = ON;\n\nCREATE TABLE Suppliers(sup_id TEXT PRIMARY KEY, sup_name TEXT);\nCREATE TABLE Items(item_id TEXT PRIMARY KEY,\n                   sup_id TEXT REFERENCES Suppliers(sup_id),\n                   item_name TEXT);\n\nINSERT INTO Suppliers VALUES(&#x27;S1&#x27;, &#x27;Alpha Supplies&#x27;);\nINSERT INTO Items VALUES(&#x27;I1&#x27;, &#x27;S1&#x27;, &#x27;Rope&#x27;);<\/code><\/pre>\n<p>第一条越界写入：<\/p>\n<pre class=\"lang-sql\"><code>INSERT INTO Items VALUES(&#x27;I2&#x27;, &#x27;NOPE&#x27;, &#x27;Sling&#x27;);<\/code><\/pre>\n<p>执行结果：DBMS 在 Suppliers 主键集合里查找 <code>NOPE<\/code>，找不到，返回 <code>FOREIGN KEY constraint failed<\/code>，I2 没有写入。逐行看：Suppliers 此时只有 S1 一行，合法 sup_id 集合 = {S1}；NOPE 不在集合内，外键检查在落行前拦住。<\/p>\n<p>第二条被拦截的删除：<\/p>\n<pre class=\"lang-sql\"><code>DELETE FROM Suppliers WHERE sup_id=&#x27;S1&#x27;;<\/code><\/pre>\n<p>执行结果：Items 中 I1 仍引用 S1，删除前的引用扫描发现存在引用行，返回 <code>FOREIGN KEY constraint failed<\/code>，S1 保留。逐行看：被引用表要删的是 S1；引用表 Items 的 I1 行 sup_id=S1 命中，按默认 RESTRICT 策略阻止删除；若建表时声明了级联策略，这一步才会连带删除或置空明细行。<\/p>\n<h2>常见误读<\/h2>\n<p>误读 1：“外键列取值不能重复，重复就违反约束。” 反例查询：Orders 表中 <code>cust_id<\/code> 是外键，同一个顾客 1000000001 下了两单，Orders 出现两行 <code>cust_id=&#x27;1000000001&#x27;<\/code>。结果：两行都合法写入。差别在外键管的是“取值在被引用集合内”，不是“取值唯一”；唯一性是主键的职责。<\/p>\n<p>误读 2：“供应商名称这种业务列可以直接当主键。” 反例：假设用 <code>vend_name<\/code> 作主键，供应商从 Doll House Inc. 改名为 Doll House LLC，必须同步修改 Products 中所有引用它的行；漏改一处，Products 与 Vendors 按名称配对时就断裂。主键值要求稳定不变，名称属于会变的业务数据，应当让位于无意义的标识 ID。<\/p>\n<p>误读 3：“在外键列上建个普通索引，就等于有了外键约束。” 反例：在 <code>Items.sup_id<\/code> 上建索引后，写入 <code>sup_id=&#x27;NOPE&#x27;<\/code> 仍然放行；索引只加快“按 sup_id 查找”的速度，不做“这个值是否存在于 Suppliers”的合法性检查。索引是读取提速结构，外键是写入校验约束，两者解决的问题不同。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例 1：把可修改的业务名称当主键。供应商改名时必须同步修改所有引用它的 Products 行；漏改一处，联结就断裂。主键值应当稳定不变。<\/p>\n<p>反例 2：外键列允许重复被误解为错误。一个顾客下多个订单，Orders 中多行 <code>cust_id<\/code> 相同完全合法；外键管的是“取值合法”，不是“取值唯一”。<\/p>\n<p>反例 3：只建索引不建约束。在 <code>vend_id<\/code> 上建普通索引能加快联结查找，但不会阻止写入不存在的 ID；索引与约束解决的是两类问题。<\/p>\n<p>边界假设：本推演基于 DBMS 强制实施外键约束的情形。部分轻量数据库默认不启用外键检查，或建表时未声明 REFERENCES，此时约束不生效，孤儿行可以写入，需要应用层自行兜底。另一类边界：外键列可以同时是本表主键（一对一引用），也可以是组合外键中的一列；组合外键的取值要和被引用的组合主键整体对应。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n为什么产品名不适合作为 Products 的主键，而 <code>prod_id<\/code> 适合？\n<\/li><li>\nOrderItems 为什么用 <code>order_num + order_item<\/code> 组合主键，单用 <code>order_num<\/code> 为什么不够？\n<\/li><li>\n外键列取值重复为什么不算违反外键约束？\n<\/li><li>\n删除 Vendors 某一行之前，DBMS 要先做什么检查？\n<\/li><li>\n普通索引能不能替代外键约束保证引用完整性，差在哪一步？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "主键与外键"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.27<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">主键与外键<\/a><\/span><\/div><h1>SELECT 与列选择（DISTINCT、别名）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1–6 课\n<\/ul>\n<h2>问题<\/h2>\n<p>从表里取数时，常常不需要全部列：供应商名和地址在不同列，报表只要产品名和价格；同一供应商出现在多行，供应商清单里不希望重复出现；算出来的金额没有天然列名，结果集里不好引用。SELECT 后面的列表就是用来解决“取哪些列、去不去重、计算结果叫什么名字”的。<\/p>\n<h2>定义（逐句拆开）<\/h2>\n<p><strong>SELECT 列表<\/strong>：SELECT 关键字之后、FROM 之前的部分，声明结果集包含哪些列。<\/p>\n<ul><li>\n写列名：<code>SELECT prod_id, prod_name, prod_price<\/code>，三个列各取其值。\n<\/li><li>\n写 <code>*<\/code>：取表的全部列，列顺序一般是表的物理存储顺序，不保证稳定。\n<\/li><li>\n列名之间用逗号分隔，最后一列后面不加逗号。\n<\/ul>\n<p><strong>DISTINCT<\/strong>：修饰整个 SELECT 列表，去掉结果集中完全重复的行。“完全重复”指选定的所有列组合都相同，不是只看第一列。<\/p>\n<p><strong>别名（alias）<\/strong>：用 <code>AS<\/code> 给列或计算结果起一个临时名字，只在本次查询内有效。计算字段没有原生列名，必须靠别名让结果可读、可被引用。<\/p>\n<p>正例：<code>SELECT vend_id FROM Products<\/code> 返回 9 行（含重复供应商）；<code>SELECT DISTINCT vend_id FROM Products<\/code> 返回 3 行不同供应商。反例：以为 <code>SELECT DISTINCT vend_id, prod_name<\/code> 只对 <code>vend_id<\/code> 去重，实际上两列组合不同的行都会保留。<\/p>\n<h2>原理推导（执行推演）<\/h2>\n<p>推演一条查询的列选择过程。FROM Products 先把 9 行取出，SELECT 列表逐行投影：对每一行，按列表取出 <code>prod_name<\/code>、<code>prod_price<\/code>，不入选的列不进入结果。如果列表是表达式 <code>quantity * item_price<\/code>，则对每行现算一个值。<\/p>\n<p>推演 DISTINCT 的去重时机：DBMS 先按普通 SELECT 生成结果集，再把所有选定列排成组合，两两比较，组合相同的行只留一行。因此 DISTINCT 的开销来自这一步比较和排序，列越多比较成本越高。<\/p>\n<p>推演别名的作用范围：别名在本次查询的结果集列名上生效；部分 DBMS 允许同一条语句的后续部分（如 ORDER BY）引用别名，但不能在 WHERE 中引用 SELECT 里起的列别名，因为 WHERE 执行早于 SELECT 投影。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>成立条件：列名必须属于 FROM 后的表；多表联结时同名列要加表名限定。边界情况：<\/p>\n<ul><li>\n<code>*<\/code> 只在确实需要全部列时使用；明确列名可以避免表结构变化时结果列错位。\n<\/li><li>\nDISTINCT 不能只作用于某一列；想按一列去重、其他列取任意值，属于分组问题，要用 GROUP BY。\n<\/li><li>\n失败案例：把 <code>SELECT DISTINCT vend_id, prod_name<\/code> 当成“每供应商一行”，结果每个产品仍占一行，清单没有缩短。\n<\/ul>\n<h2>辨析<\/h2>\n<p>SELECT 列表与 WHERE 条件的差别：SELECT 决定输出哪些列，WHERE 决定留下哪些行，两者作用对象不同。DISTINCT 与 GROUP BY 的差别：DISTINCT 只做整行去重，不计算聚合；GROUP BY 按列分组后可以对每组做 COUNT、SUM 等聚集。列别名与表别名的差别：列别名出现在结果集列名上，表别名只在语句内部缩短表名，不返回给客户端。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：主键与外键确定表中有哪些列可引用。后继：计算字段（第 7 课在 SELECT 列表里写表达式并起别名）、聚集与分组（第 9、10 课在 SELECT 列表里放聚集函数和分组列）。SELECT 列表是后面所有查询的输出入口。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（SELECT 与列选择（DISTINCT、别名））<\/summary><div class=\"depth-body\"><h1>SELECT 与列选择：完整推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>从“结果集里有哪几列、每列叫什么名字”往回推：<\/p>\n<ol><li>\n结果列来自 SELECT 列表，列表中的列必须能在 FROM 后的表中找到。\n<\/li><li>\n要去掉重复供应商，先确认重复单位是单列还是多列组合，这决定用 DISTINCT 还是 GROUP BY。\n<\/li><li>\n计算结果要被读懂，必须给表达式起别名，否则结果集列名是原始表达式。\n<\/li><li>\n别名能被哪些子句引用，取决于各子句的逻辑执行顺序：WHERE 早于 SELECT，ORDER BY 晚于 SELECT。\n<\/li><li>\n投影阶段只改变列集合，不改变行集合；行的增减由 WHERE、JOIN、GROUP BY 这些步骤决定，混在一起就会把“取哪些列”和“留哪些行”搞反。\n<\/ol>\n<p>底层假设：SQL 是声明式查询，你描述要哪些列和条件，DBMS 决定具体怎么扫描和投影；SELECT 列表是结果集列结构的唯一来源。<\/p>\n<h2>正向推导（解析 → 执行顺序 → 行集合与列集合变化）<\/h2>\n<p>先明确一条查询在逻辑上的处理顺序：FROM 先确定行集合来自哪张表；WHERE 从行集合里剔除不满足条件的行；GROUP BY 把行集合分堆；SELECT 投影确定列集合并计算表达式；DISTINCT 对投影后的行组合去重；ORDER BY 按列排序输出。SELECT 列表只在投影阶段改变列集合，行集合此时已经定型。<\/p>\n<p>第一阶段，解析。DBMS 对照表结构检查 SELECT 列表里的每个名字：列名属于 FROM 后的表，表达式能由列、常量、函数组成；多表联合同名列要加表名限定。解析阶段不产生结果行，只判断语句引用是否合法。<\/p>\n<p>第二阶段，行集合定型。FROM Products 把 9 行取出；本算例没有 WHERE，行集合保持 9 行。这一步不关心 SELECT 写了哪些列。<\/p>\n<p>第三阶段，逐行投影。对行集合里的每一行，按 SELECT 列表取出对应列值或现算表达式：取列名就复制该行该列的值；写表达式就把该行的列值代入计算。未入选的列不进入结果集，列集合由列表决定。<\/p>\n<p>第四阶段，去重（如有 DISTINCT）。投影完成后，把选定列排成组合，两两比较；组合完全相同的行只保留一行。去重发生在投影之后，所以比较单位是投影出来的列组合，不是原始表的整行。<\/p>\n<p>第五阶段，命名。别名 <code>AS double_price<\/code> 把结果集该列的名字改成 double_price；别名只在本次查询的结果集上有效，不回写表结构。<\/p>\n<p>结果为什么是这个结果：行集合经过 WHERE、JOIN 定型后，SELECT 只做列的取舍和表达式计算；DISTINCT 在投影结果上按组合压重；别名是给结果集列贴的临时标签。三个动作分别作用在行、列、名字上，互不越界。<\/p>\n<h2>算例一（原书样例库）<\/h2>\n<p>Products 9 行（vend_id 与 prod_name 节选）：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>prod_id<\/th><th>vend_id<\/th><th>prod_name<\/th><\/tr><\/thead><tbody><tr><td>BNBG01<\/td><td>DLL01<\/td><td>Fish bean bag toy<\/td><\/tr><tr><td>BNBG02<\/td><td>DLL01<\/td><td>Bird bean bag toy<\/td><\/tr><tr><td>BNBG03<\/td><td>DLL01<\/td><td>Rabbit bean bag toy<\/td><\/tr><tr><td>BR01<\/td><td>BRS01<\/td><td>8 inch teddy bear<\/td><\/tr><tr><td>BR02<\/td><td>BRS01<\/td><td>12 inch teddy bear<\/td><\/tr><tr><td>BR03<\/td><td>BRS01<\/td><td>18 inch teddy bear<\/td><\/tr><tr><td>RGAN01<\/td><td>DLL01<\/td><td>Raggedy Ann<\/td><\/tr><tr><td>RYL01<\/td><td>FNG01<\/td><td>King doll<\/td><\/tr><tr><td>RYL02<\/td><td>FNG01<\/td><td>Queen dool<\/td><\/tr><\/tbody><\/table><\/div>\n<p>推演三条语句：<\/p>\n<ol><li>\n<code>SELECT vend_id FROM Products;<\/code> 逐行投影出 vend_id：DLL01、DLL01、DLL01、BRS01、BRS01、BRS01、DLL01、FNG01、FNG01，共 9 行，重复值原样保留。\n<\/li><li>\n<code>SELECT DISTINCT vend_id FROM Products;<\/code> 把 9 个值两两比较，不同取值只有 DLL01、BRS01、FNG01，结果 3 行。\n<\/li><li>\n<code>SELECT DISTINCT vend_id, prod_name FROM Products;<\/code> 去重单位是两列组合：DLL01 对应四个不同产品名，四组都不同；BRS01 三组不同；FNG01 两组不同。9 个组合没有完全重复，结果仍是 9 行。这一步说明 DISTINCT 不会“只按第一列压成一行”。\n<\/ol>\n<p>别名推演：<code>SELECT prod_price * 2 AS double_price FROM Products<\/code>，每行把价格乘 2，结果集该列命名为 double_price；不写 AS 时，列名随 DBMS 而定，通常是表达式文本，不利于后续引用。<\/p>\n<h2>算例二（Orders 表，SQLite 已跑通）<\/h2>\n<p>Orders 5 行：20005→1000000001，20006→1000000003，20007→1000000004，20008→1000000005，20009→1000000001。<\/p>\n<p>第一条：<\/p>\n<pre class=\"lang-sql\"><code>SELECT DISTINCT cust_id FROM Orders ORDER BY cust_id;<\/code><\/pre>\n<p>逐行投影先得到 5 个 cust_id：001、003、004、005、001；去重比较后保留 4 个组合：1000000001、1000000003、1000000004、1000000005。被筛掉的是第二行 001，因为它与第一行在选定列上完全相同；003、004、005 各不同，全部留下。<\/p>\n<p>第二条，表达式起别名：<\/p>\n<pre class=\"lang-sql\"><code>SELECT prod_id, ROUND(prod_price * 1.08, 2) AS price_with_tax\nFROM Products ORDER BY prod_id LIMIT 3;<\/code><\/pre>\n<p>结果前三行：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>prod_id<\/th><th>price_with_tax<\/th><\/tr><\/thead><tbody><tr><td>BNBG01<\/td><td>3.77<\/td><\/tr><tr><td>BNBG02<\/td><td>3.77<\/td><\/tr><tr><td>BNBG03<\/td><td>3.77<\/td><\/tr><\/tbody><\/table><\/div>\n<p>逐行看：3.49 × 1.08 = 3.7692，ROUND 到两位小数为 3.77；三行原价相同所以税后价相同。表达式在投影阶段对每行独立计算，行与行之间不汇总。<\/p>\n<h2>常见误读<\/h2>\n<p>误读 1：“DISTINCT 只作用于紧跟的第一列，其他列照常保留。” 反例查询：<code>SELECT DISTINCT vend_id, prod_name FROM Products<\/code>。实际结果仍是 9 行：同一 vend_id 下 prod_name 不同，两列组合不同，每一行都被判定为不同。DISTINCT 的比较单位是 SELECT 列表全部列的组合，不存在“只去重一列”的写法；要按一列去重、其余列取任意值，属于分组问题，要用 GROUP BY。<\/p>\n<p>误读 2：“列别名可以在 WHERE 里接着用。” 反例查询：<code>SELECT prod_price <em> 2 AS dp FROM Products WHERE dp &gt; 5<\/code>。执行顺序上 WHERE 先于 SELECT，WHERE 判定时 dp 这个别名还没生成，多数 DBMS 报“列不存在”。成立写法是把表达式写回 WHERE：<code>WHERE prod_price <\/em> 2 &gt; 5<\/code>。ORDER BY 晚于 SELECT，可以引用别名 dp。<\/p>\n<p>误读 3：“<code>SELECT <em><\/code> 和写明列名结果等价，写星号更省事。” 反例：表后来加了一列，<code>SELECT <\/em><\/code> 的结果集多一列，按固定位置解析的下游程序会把错位的值当成下一列；写明列名的查询结果列结构不变。星号只在临时探查表结构时使用，应用接口查询应显式列出列。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例 1：用 <code>SELECT *<\/code> 做应用接口输出。表加了一列，结果集就多一列，下游解析可能错位；明确列名把这种变化挡在接口之外。<\/p>\n<p>反例 2：误以为 DISTINCT 能加速。去重要额外比较排序，数据量大时反而更慢；不需要去重时不要加 DISTINCT。<\/p>\n<p>反例 3：在 WHERE 里引用列别名。执行顺序上 WHERE 先于 SELECT，别名尚未可见，条件应写原始表达式。<\/p>\n<p>边界假设：本推演按标准 SQL 的子句逻辑顺序展开；个别 DBMS 对别名在 WHERE 中的可见性有宽松扩展，跨库写法不要依赖这种扩展。另一类边界：联结多表时同名列必须用表别名限定，否则解析阶段报“列名不明确”；表别名只在语句内部缩短表名，不进入结果集列名。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n<code>SELECT DISTINCT a, b<\/code> 的去重单位是什么？\n<\/li><li>\n为什么 <code>SELECT *<\/code> 不适合作为稳定的应用接口？\n<\/li><li>\n想统计每个供应商的产品数，为什么不能用 DISTINCT 完成？\n<\/li><li>\nWHERE 子句为什么通常不能引用 SELECT 中刚起的列别名？\n<\/li><li>\n表别名和列别名在“是否返回给客户端”上有什么差别？\n<\/ol><\/div><\/details>", "kind": "concept", "title": "SELECT 与列选择（DISTINCT、别名）"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.48<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">SELECT 与列选择（DISTINCT、别名）<\/a><\/span><\/div><h1>WHERE 与比较、逻辑操作符<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1–6 课\n<\/ul>\n<h2>问题<\/h2>\n<p>表有几十上百行，查询只要其中满足条件的子集。困难在于：条件可能不止一个（既要某供应商、价格又要低于某值），条件之间可能是“同时满足”或“满足其一”，还可能遇到列值为空的情况。WHERE 子句负责按行判定，留下条件为真的行；AND/OR/NOT 负责组合条件。条件写错时数据库往往不报错，只是悄悄返回错的行，这比语法错误更难排查。<\/p>\n<h2>定义（逐句拆开）<\/h2>\n<p><strong>WHERE 子句<\/strong>：FROM 之后、对原始行逐行计算条件的子句；条件结果为真的行进入后续步骤，结果为假或未知的行被丢弃。<\/p>\n<p><strong>比较操作符<\/strong>：<code>=<\/code> 等于、<code>&lt;&gt;<\/code> 不等于（部分 DBMS 写 <code>!=<\/code>）、<code>&lt;<\/code>、<code>&lt;=<\/code>、<code>&gt;<\/code>、<code>&gt;=<\/code>；<code>BETWEEN 下限 AND 上限<\/code> 匹配闭区间；<code>IN (值列表)<\/code> 匹配列表中任一值。<\/p>\n<p><strong>逻辑操作符<\/strong>：<code>AND<\/code> 两边都真才为真；<code>OR<\/code> 任一为真即为真；<code>NOT<\/code> 把后面条件的结果取反。<\/p>\n<p><strong>三值逻辑<\/strong>：除了真、假，比较遇到 NULL 时结果是未知（NULL）。WHERE 只保留结果为真的行，结果为假或未知的行都不保留。判空必须用 <code>IS NULL<\/code>，不能写 <code>= NULL<\/code>。<\/p>\n<p>正例：<code>WHERE vend_id = &#x27;DLL01&#x27; AND prod_price &lt;= 4<\/code> 留下同时满足两条件的行。反例：<code>WHERE cust_email = NULL<\/code> 永远返回 0 行，因为 NULL 与 NULL 相等比较的结果是未知。<\/p>\n<h2>原理推导（执行推演）<\/h2>\n<p>推演 AND 的逐行判定。对每一行，先算左边条件，再算右边条件，两边都为真，AND 结果才为真；任一边为假，结果为假；任一边为未知，结果为未知。WHERE 只收真，未知行被丢弃。<\/p>\n<p>推演 OR 的逐行判定。任一边为真，OR 即为真；两边都假才为假；两边都未知，或一假一未知，结果为未知。<\/p>\n<p>推演优先级。SQL 规定 AND 先于 OR 求值。<code>a OR b AND c<\/code> 被解析为 <code>a OR (b AND c)<\/code>，不是 <code>(a OR b) AND c<\/code>。混用时必须用括号写明分组。<\/p>\n<p>推演 IN 与 NOT IN 的展开。<code>x IN (a,b,c)<\/code> 等价于 <code>x=a OR x=b OR x=c<\/code>；<code>x NOT IN (a,b,c)<\/code> 等价于 <code>x&lt;&gt;a AND x&lt;&gt;b AND x&lt;&gt;c<\/code>。列表中混入 NULL 时，后一式里出现 <code>x&lt;&gt;NULL<\/code>，结果为未知，整条 AND 链不为真，查询返回空。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>成立条件：比较两侧类型兼容；字符串比较是否区分大小写取决于 DBMS 排序规则。边界情况：<\/p>\n<ul><li>\nNULL 参与的任何相等或不等比较结果都是未知，不是真也不是假。\n<\/li><li>\nBETWEEN 包含两端，写 <code>BETWEEN 3 AND 6<\/code> 时 3 和 6 都在内。\n<\/li><li>\n失败案例：<code>NOT IN (子查询)<\/code> 的子查询返回了含 NULL 的列，外层整组查询返回空，排查时容易误以为是数据不存在。\n<\/ul>\n<h2>辨析<\/h2>\n<p>WHERE 与 HAVING 的差别：WHERE 在分组前行级过滤，看不到组级聚集值；HAVING 在分组后过滤组（见分组概念）。IN 与 OR 列表的差别：两者对固定列表等价；IN 更紧凑，且可以接子查询。<code>=<\/code> 与 <code>IS NULL<\/code> 的差别：<code>=<\/code> 是值比较，遇 NULL 结果未知；<code>IS NULL<\/code> 是专门的判空谓词，结果明确为真或假。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：SELECT 与列选择确定要输出的列。后继：通配符 LIKE 是 WHERE 中的一类模式匹配条件；子查询把 IN 后面的固定列表换成另一条 SELECT；HAVING 是分组场景下的过滤位置。WHERE 是所有行级条件判断的落脚点。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（WHERE 与比较、逻辑操作符）<\/summary><div class=\"depth-body\"><h1>WHERE 与逻辑操作符：完整推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>从“查询只留下目标行”往回推：<\/p>\n<ol><li>\n留下哪些行，前提是每行能算出一个明确的真/假判定，这就是 WHERE 条件。\n<\/li><li>\n多条件组合需要规则：AND 要求全真，OR 要求一真，规则由逻辑操作符给出。\n<\/li><li>\n列可能为空，比较结果除了真、假还有第三种状态“未知”，这要求理解三值逻辑。\n<\/li><li>\nNOT IN 能写成 AND 链，链条上任何一环未知，整环就不为真；这是 NULL 翻车的根因。\n<\/li><li>\n条件成立与否要逐行独立计算：WHERE 面对的是单行上的列值，看不到“这一组有多少行”，组级条件必须放到 HAVING。\n<\/ol>\n<p>底层假设：SQL 把 NULL 当作“值未知”，而不是空字符串或 0；未知参与运算时沿逻辑表达式传播。<\/p>\n<h2>正向推导（解析 → 执行顺序 → 行集合与列集合变化）<\/h2>\n<p>一条带 WHERE 的查询，逻辑执行顺序是：FROM 取出行集合 → WHERE 逐行计算条件 → 条件为真的行留下进入后续阶段；WHERE 不改变列集合，只改变行集合。<\/p>\n<p>第一阶段，解析。DBMS 检查 WHERE 里每个列名属于哪张表，比较两侧类型是否兼容，操作符（=、&lt;&gt;、&lt;、&gt;、BETWEEN、IN、LIKE、IS NULL）能否用于该类型。解析阶段不筛行，只确认条件写得合法。<\/p>\n<p>第二阶段，逐行求值。对行集合里的每一行，取出相关列值，按操作符计算比较结果：值与值可比时结果为真或假；任一参与比较的值是 NULL，结果为未知。比较结果再由 AND/OR/NOT 组合成最终条件状态。<\/p>\n<p>第三阶段，按状态收行。WHERE 只保留最终状态为真的行；状态为假的行丢弃，状态为未知的行同样丢弃。这一步解释了为什么 NULL 行在多数等值条件下“悄悄消失”：它们不是被判假，而是被判成未知，落不进“真”的篮子。<\/p>\n<p>第四阶段，组合规则展开。<code>x IN (a,b,c)<\/code> 展开成 <code>x=a OR x=b OR x=c<\/code>；<code>x NOT IN (a,b,c)<\/code> 展开成 <code>x&lt;&gt;a AND x&lt;&gt;b AND x&lt;&gt;c<\/code>。展开后按三值逻辑逐环求值，任一环未知，整条 AND 链不为真。<\/p>\n<p>结果为什么是这个结果：行集合在 WHERE 阶段被逐行判定，只有真状态行存活；未知状态没有被当成假，也没有被当成真，而是单独排除；AND 先于 OR 的优先级决定了不加括号时条件怎么分组。<\/p>\n<h2>算例一（原书样例库）<\/h2>\n<p>Customers 5 行：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>cust_id<\/th><th>cust_name<\/th><th>cust_state<\/th><th>cust_email<\/th><\/tr><\/thead><tbody><tr><td>1000000001<\/td><td>Village Toys<\/td><td>IL<\/td><td>sales@villagetoys.com<\/td><\/tr><tr><td>1000000002<\/td><td>Kids Place<\/td><td>OH<\/td><td>NULL<\/td><\/tr><tr><td>1000000003<\/td><td>Fun4All<\/td><td>IL<\/td><td>jjones@fun4all.com<\/td><\/tr><tr><td>1000000004<\/td><td>Fun4All<\/td><td>IN<\/td><td>dstephens@fun4all.com<\/td><\/tr><tr><td>1000000005<\/td><td>The Toy Store<\/td><td>MI<\/td><td>NULL<\/td><\/tr><\/tbody><\/table><\/div>\n<p>推演 <code>WHERE cust_email IS NULL<\/code>：逐行判 email 是否为空，001 非空为假，002 为空为真，003 非空为假，004 非空为假，005 为空为真，留下 002、005 两行。<\/p>\n<p>推演 <code>WHERE cust_email = NULL<\/code>：非空值与 NULL 比较结果未知；NULL 与 NULL 比较结果仍是未知。五行判定全部未知，WHERE 不收未知行，结果 0 行。这就是判空必须写 IS NULL 的原因。<\/p>\n<p>推演 AND：<code>cust_state=&#x27;IL&#x27; AND cust_email IS NOT NULL<\/code>。001：IL 真、email 非空真 → 真，留下；002：OH 假 → AND 假，丢弃；003：IL 真、非空真 → 真，留下；004：IN 假 → 假；005：MI 假 → 假。结果留 001、003。<\/p>\n<p>推演优先级歧义。Products 条件 <code>vend_id=&#x27;DLL01&#x27; OR vend_id=&#x27;BRS01&#x27; AND prod_price&gt;=10<\/code>。按 AND 优先，先算 <code>BRS01 AND price&gt;=10<\/code>：BR03 价格 11.99 命中；再与 DLL01 全部产品 OR，结果是 DLL01 四行加 BR03。需求若为“两家中价
