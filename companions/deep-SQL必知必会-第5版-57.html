oy Store<\/td><td>MI<\/td><td>NULL<\/td><\/tr><\/tbody><\/table><\/div>\n<p>推演 <code>WHERE cust_email IS NULL<\/code>：逐行判 email 是否为空，001 非空为假，002 为空为真，003 非空为假，004 非空为假，005 为空为真，留下 002、005 两行。<\/p>\n<p>推演 <code>WHERE cust_email = NULL<\/code>：非空值与 NULL 比较结果未知；NULL 与 NULL 比较结果仍是未知。五行判定全部未知，WHERE 不收未知行，结果 0 行。这就是判空必须写 IS NULL 的原因。<\/p>\n<p>推演 AND：<code>cust_state=&#x27;IL&#x27; AND cust_email IS NOT NULL<\/code>。001：IL 真、email 非空真 → 真，留下；002：OH 假 → AND 假，丢弃；003：IL 真、非空真 → 真，留下；004：IN 假 → 假；005：MI 假 → 假。结果留 001、003。<\/p>\n<p>推演优先级歧义。Products 条件 <code>vend_id=&#x27;DLL01&#x27; OR vend_id=&#x27;BRS01&#x27; AND prod_price&gt;=10<\/code>。按 AND 优先，先算 <code>BRS01 AND price&gt;=10<\/code>：BR03 价格 11.99 命中；再与 DLL01 全部产品 OR，结果是 DLL01 四行加 BR03。需求若为“两家中价格 ≥10 的产品”，应写成 <code>(vend_id=&#x27;DLL01&#x27; OR vend_id=&#x27;BRS01&#x27;) AND prod_price&gt;=10<\/code>，此时 DLL01 产品价格都低于 10，只留 BR03。<\/p>\n<p>推演 NOT IN 含 NULL。<code>cust_id NOT IN (&#x27;1000000001&#x27;, NULL)<\/code> 展开为 <code>cust_id&lt;&gt;&#x27;1000000001&#x27; AND cust_id&lt;&gt;NULL<\/code>。第二项结果未知，AND 链整体不为真，五行全部不留下，结果 0 行。<\/p>\n<h2>算例二（Staff 小表，SQLite 已跑通）<\/h2>\n<p>建表与插入：<\/p>\n<pre class=\"lang-sql\"><code>CREATE TABLE Staff(emp_id TEXT, emp_name TEXT, state TEXT, email TEXT);\nINSERT INTO Staff VALUES(&#x27;E1&#x27;,&#x27;Ann&#x27;,&#x27;IL&#x27;,&#x27;ann@x.com&#x27;);\nINSERT INTO Staff VALUES(&#x27;E2&#x27;,&#x27;Bob&#x27;,&#x27;OH&#x27;,NULL);\nINSERT INTO Staff VALUES(&#x27;E3&#x27;,&#x27;Cid&#x27;,&#x27;IL&#x27;,NULL);\nINSERT INTO Staff VALUES(&#x27;E4&#x27;,&#x27;Dot&#x27;,&#x27;IN&#x27;,&#x27;dot@x.com&#x27;);<\/code><\/pre>\n<p>第一条，AND 两边都真：<\/p>\n<pre class=\"lang-sql\"><code>SELECT emp_id FROM Staff WHERE state=&#x27;IL&#x27; AND email IS NOT NULL ORDER BY emp_id;<\/code><\/pre>\n<p>逐行：E1 州 IL 为真、email 非空为真 → 留；E2 州 OH 假 → 丢；E3 州 IL 真但 email 为空，<code>email IS NOT NULL<\/code> 为假 → AND 假，丢；E4 州 IN 假 → 丢。结果仅 E1。被筛掉的 E3 容易被误算成“IL 就该留下”，它死在第二条件上。<\/p>\n<p>第二条，IN 列表：<\/p>\n<pre class=\"lang-sql\"><code>SELECT emp_id FROM Staff WHERE state IN (&#x27;IL&#x27;,&#x27;IN&#x27;) ORDER BY emp_id;<\/code><\/pre>\n<p>展开为 <code>state=&#x27;IL&#x27; OR state=&#x27;IN&#x27;<\/code>：E1 IL 留，E2 OH 丢，E3 IL 留，E4 IN 留。结果 E1、E3、E4。E3 邮箱为空不影响本条，因为条件没碰 email。<\/p>\n<p>第三条，相等比较遇 NULL：<\/p>\n<pre class=\"lang-sql\"><code>SELECT emp_id FROM Staff WHERE email = NULL;<\/code><\/pre>\n<p>E1 的 email 与 NULL 比较未知；E2、E3 的 NULL 与 NULL 比较未知；E4 同样未知。四行全未知，结果 0 行。<\/p>\n<p>第四条，NOT 取反：<\/p>\n<pre class=\"lang-sql\"><code>SELECT emp_id FROM Staff WHERE NOT state=&#x27;IL&#x27; ORDER BY emp_id;<\/code><\/pre>\n<p>E1 条件真，NOT 后假 → 丢；E2 OH 假，NOT 后真 → 留；E3 IL 真，NOT 后假 → 丢；E4 IN 假，NOT 后真 → 留。结果 E2、E4。<\/p>\n<h2>常见误读<\/h2>\n<p>误读 1：“WHERE 和 HAVING 可以互换，把条件换个子句写结果一样。” 反例：分组统计订单数时，把组级条件写成 <code>WHERE COUNT(<em>)&gt;=2<\/code>。WHERE 在分组前执行，面对单行，此时 COUNT(<\/em>) 还没算出来，语义不成立；同样的条件放 HAVING，分组完成后才能对每组计数做筛选。两者执行阶段不同：WHERE 滤行，HAVING 滤组。<\/p>\n<p>误读 2：“NOT IN 里混进一个 NULL，最多漏掉那一行。” 反例查询：<code>SELECT cust_id FROM Customers WHERE cust_id NOT IN (&#x27;1000000001&#x27;, NULL)<\/code>。展开后第二项 <code>cust_id&lt;&gt;NULL<\/code> 对每行都是未知，AND 链不为真，结果整组为空，不是漏一行。稳妥写法是内层先把 NULL 排除，或改用 NOT EXISTS。<\/p>\n<p>误读 3：“OR 和 AND 优先级相同，按从左到右算就行。” 反例查询：<code>vend_id=&#x27;DLL01&#x27; OR vend_id=&#x27;BRS01&#x27; AND prod_price&gt;=10<\/code>。SQL 规定 AND 先于 OR，解析为 <code>DLL01 OR (BRS01 AND 高价)<\/code>，DLL01 全部低价产品被 OR 进来；加括号 <code>(DLL01 OR BRS01) AND price&gt;=10<\/code> 后才是“两家之一且高价”，只剩 BR03。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例 1：用 <code>= NULL<\/code> 找空值行。条件结果全为未知，一行留不下；改成 IS NULL 才得到两行。<\/p>\n<p>反例 2：NOT IN 子查询返回 NULL。即使业务上以为排除了个别值，整组结果也会变空；稳妥做法是外层先 <code>WHERE 列 IS NOT NULL<\/code>，或改用 NOT EXISTS。<\/p>\n<p>反例 3：AND/OR 不加括号依赖默认优先级。需求是“供应商在两家之一且价格 ≥10”，漏括号后变成“一家全部加另一家的高价行”，结果集多出 DLL01 的低价产品。<\/p>\n<p>边界假设：本推演按标准三值逻辑展开；部分 DBMS 配置下 NULL 行为或字符串大小写排序有差异，落地前应在目标库实测。另一类边界：BETWEEN 是闭区间，两端值都在内；比较两侧类型不兼容时，DBMS 可能做隐式转换，转换结果不可靠，应显式对齐类型。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n为什么 <code>cust_email = NULL<\/code> 不能取出 email 为空的行？\n<\/li><li>\nAND 链中有一项比较结果为未知，整条链的结果是什么？\n<\/li><li>\n<code>x NOT IN (a, NULL)<\/code> 为什么返回空结果集？\n<\/li><li>\n<code>a OR b AND c<\/code> 按什么顺序求值？要先组合 OR 该怎么写？\n<\/li><li>\nBETWEEN 的两端是否包含边界值？\n<\/ol><\/div><\/details>", "c04": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.66<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">WHERE 与比较、逻辑操作符<\/a><\/span><\/div><h1>通配符与 LIKE 过滤<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1–6 课\n<\/ul>\n<h2>问题<\/h2>\n<p>相等比较只能匹配已知的完整值。现实里经常要找“名字里包含某段文字”“以某个词开头”“第二个字符是某个字母”的行，列里存的是完整字符串，条件不知道完整串。LIKE 操作符配合通配符，就是为部分字符串匹配准备的过滤方式。<\/p>\n<h2>定义（逐句拆开）<\/h2>\n<p><strong>搜索模式<\/strong>：由字面值和通配符组成的字符串，交给 LIKE 去匹配列值。 <strong><code>%<\/code><\/strong>：匹配任意多个字符，个数可以是零个、一个或多个。<code>&#x27;Fish%&#x27;<\/code> 表示以 Fish 开头，后面跟任意内容。 <strong><code>_<\/code><\/strong>：只匹配单个字符，不多不少。<code>&#x27;_inch&#x27;<\/code> 匹配一个字符后接 inch。 <strong>LIKE<\/strong>：对字符串列做模式匹配的谓词；不匹配时条件为假，匹配为真。<\/p>\n<p>正例：<code>prod_name LIKE &#x27;%bean bag%&#x27;<\/code> 找出任意位置包含 bean bag 的产品名。反例：把 <code>%<\/code> 当成至少一个字符，写 <code>&#x27;Fish%&#x27;<\/code> 想排除正好叫 Fish 的行——实际上 Fish 后面零个字符也能匹配。<\/p>\n<h2>原理推导（执行推演）<\/h2>\n<p>推演模式如何逐段匹配。拿列值与搜索模式对齐扫描：模式中的字面值要求逐字符相等；遇到 <code>%<\/code>，允许跳过后续任意长度的字符；遇到 <code>_<\/code>，必须吃掉且只吃掉一个字符。扫描完成后两边都到末尾，才算匹配成功。<\/p>\n<p>推演开头与结尾的位置。<code>&#x27;Fish%&#x27;<\/code> 的字面值在模式最前，要求列值从第一个字符起就是 Fish；<code>&#x27;%Fish&#x27;<\/code> 要求以 Fish 结尾；<code>&#x27;%Fish%&#x27;<\/code> 要求 Fish 出现在中间任意位置。<\/p>\n<p>推演性能路径。普通索引是按列值排序的列表。模式以字面值开头时，索引能定位到该字面值对应的区段；模式以 <code>%<\/code> 开头，列值首字符不确定，索引无法缩小范围，只能逐行扫描全表。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>成立条件：LIKE 用于字符串类型列；匹配是否区分大小写取决于 DBMS 的排序规则。边界情况：<\/p>\n<ul><li>\n通配符本身要作为普通字符匹配时，需要转义（具体转义符随 DBMS）。\n<\/li><li>\n列尾部带空格、字符集差异都可能导致匹配不上预期行。\n<\/li><li>\n失败案例：在大表上写 <code>WHERE 列 LIKE &#x27;%关键词%&#x27;<\/code>，前导通配符让索引失效，全表扫描成本随行数线性增长。\n<\/ul>\n<h2>辨析<\/h2>\n<p>LIKE 与正则表达式的差别：LIKE 只有 <code>%<\/code>、<code>_<\/code> 两个通配符，表达能力有限；正则支持字符区间、重复次数等更强语法，是否支持随 DBMS。LIKE 与相等比较的差别：相等要求整串完全一致，LIKE 允许部分匹配。<code>%<\/code> 与 <code>_<\/code> 的差别在匹配长度：前者任意长度含零，后者固定一个字符。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：WHERE 与比较、逻辑操作符提供条件判定位置。后继：联结与分组不再直接使用模式匹配，但报表查询常把 LIKE 作为 WHERE 的一类条件。通配符是字符串列专用的过滤手段，数值、日期过滤应走比较操作符。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（通配符与 LIKE 过滤）<\/summary><div class=\"depth-body\"><h1>通配符与 LIKE：完整推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>从“找出名字包含某段文字的行”往回推：<\/p>\n<ol><li>\n相等比较要求完整值已知，部分匹配做不到，需要模式匹配谓词 LIKE。\n<\/li><li>\n模式要表达“任意长度片段”和“单个占位”，分别对应 <code>%<\/code> 和 <code>_<\/code>。\n<\/li><li>\n匹配是否成立，要把列值与模式逐字符对齐扫描才能判定。\n<\/li><li>\n扫描能否走索引，取决于模式开头是不是确定字面值；前导通配符排除了索引路径。\n<\/li><li>\n大小写是否敏感不由 LIKE 本身决定，而由数据库的排序规则（collation）和谓词选择决定；同一模式在不同库上结果可能不同。\n<\/ol>\n<p>底层假设：字符串是按字符顺序存储的有序序列，通配符描述的是序列上的位置约束。<\/p>\n<h2>正向推导（解析 → 执行顺序 → 行集合与列集合变化）<\/h2>\n<p>带 LIKE 的查询逻辑顺序：FROM 取行集合 → 对每行把列值与搜索模式做字符级扫描 → 匹配成功留真行，失败丢弃；LIKE 同样只改变行集合，不改变列集合。<\/p>\n<p>第一阶段，解析。DBMS 确认被匹配的列是字符串类型，搜索模式是一个字符串字面量；识别模式里的字面值位置和通配符位置。数值、日期列要先转成字符串再匹配，否则走比较操作符。<\/p>\n<p>第二阶段，模式拆解。把模式从左到右拆成段：字面值段要求逐字符相等；<code>%<\/code> 段允许跳过后续任意长度（含零个）字符；<code>_<\/code> 段必须吃掉且只吃掉一个字符。<\/p>\n<p>第三阶段，逐行对齐扫描。拿列值与模式对齐：指针同时在列值和模式上移动；遇到字面值就比对当前字符，不等则该行失败；遇到 <code>%<\/code> 先记录一个可回退的分叉点，跳到模式下一段；遇到 <code>_<\/code> 列值指针前进一格、模式指针前进一格。扫描到两边都到末尾才算匹配成功；中途失败可按 <code>%<\/code> 留下的分叉点回退重试。<\/p>\n<p>第四阶段，收行。匹配为真的行留下，其余丢弃。<\/p>\n<p>结果为什么是这个结果：字面值锁定位置约束，<code>%<\/code> 负责长度弹性，<code>_<\/code> 负责单字符占位；扫描走到末尾两边同时结束才命中。模式开头是确定字面值时，索引可按字面值区段缩小扫描范围；开头是 <code>%<\/code> 时首字符不确定，索引顺序用不上，只能逐行比对。<\/p>\n<h2>算例一（原书样例库）<\/h2>\n<p>Products 的 prod_name 列：Fish bean bag toy、Bird bean bag toy、Rabbit bean bag toy、8 inch teddy bear、12 inch teddy bear、18 inch teddy bear、Raggedy Ann、King doll、Queen dool。<\/p>\n<p>推演 <code>LIKE &#x27;Fish%&#x27;<\/code>：模式首段字面值 Fish，要求列值前四个字符依次为 F、i、s、h；<code>%<\/code> 跳过后面任意字符。Fish bean bag toy 前四字符匹配，成功；其余行首字符不是 F，失败。<\/p>\n<p>推演 <code>LIKE &#x27;%bean bag%&#x27;<\/code>：前后都有 <code>%<\/code>，只要求中间出现连续子串 bean bag。三只 bean bag toy 名称中含该子串，成功；teddy bear、Raggedy Ann、doll 不含，失败。<\/p>\n<p>推演 <code>LIKE &#x27;_ inch%&#x27;<\/code>：<code>_<\/code> 吃一个字符，接着匹配空格、inch。8 inch teddy bear 首字符 8 后接空格 inch，成功；12 inch 首字符是 1，第二字符 2，<code>_<\/code> 只吃一个字符后接下来要空格，第二字符位置是 2 不是空格，失败；18 inch 同样失败。<\/p>\n<p>四条语句结果行数：<code>LIKE &#x27;Fish%&#x27;<\/code> 1 行；<code>LIKE &#x27;%toy&#x27;<\/code> 6 行（三只 bean bag toy 加三只 teddy bear）；<code>LIKE &#x27;R%&#x27;<\/code> 2 行（Rabbit bean bag toy、Raggedy Ann）；<code>LIKE &#x27;%doll&#x27;<\/code> 1 行（King doll；Queen dool 末尾拼写为 dool，不匹配 doll）。<\/p>\n<p>易错点：<code>LIKE &#x27;Fish_&#x27;<\/code> 只匹配 Fish 后恰好一个字符的串。Fish bean bag toy 在 Fish 后是空格再加多个字符，<code>_<\/code> 只吃一个空格就要求到末尾，匹配失败；要匹配 Fish 开头必须用 <code>%<\/code>。<\/p>\n<h2>算例二（Words 小表，SQLite 已跑通）<\/h2>\n<p>建表与插入：<\/p>\n<pre class=\"lang-sql\"><code>CREATE TABLE Words(w TEXT);\nINSERT INTO Words VALUES(&#x27;Fish&#x27;),(&#x27;Fisher&#x27;),(&#x27;fish bait&#x27;),\n                       (&#x27;Bird&#x27;),(&#x27;B1rd&#x27;),(&#x27;Rabbit&#x27;);<\/code><\/pre>\n<p>第一条，<code>%<\/code> 允许零个字符：<\/p>\n<pre class=\"lang-sql\"><code>SELECT w FROM Words WHERE w LIKE &#x27;Fish%&#x27; ORDER BY w;<\/code><\/pre>\n<p>结果：Fish、Fisher、fish bait。逐行：Fish 后零个字符，<code>%<\/code> 跳过零个，匹配；Fisher 后接 her，跳过，匹配；fish bait 在 SQLite 默认排序规则下 LIKE 对 ASCII 字母不区分大小写，也被匹配；Bird、B1rd、Rabbit 首字符不符，排除。<\/p>\n<p>第二条，<code>_<\/code> 固定单字符：<\/p>\n<pre class=\"lang-sql\"><code>SELECT w FROM Words WHERE w LIKE &#x27;_ird&#x27; ORDER BY w;<\/code><\/pre>\n<p>结果仅 Bird。逐行：Bird 首字符 B 被 <code>_<\/code> 吃掉，后接 ird，长度 4，匹配；B1rd 第二个字符是数字 1，不是 i，失败；Fish、Fisher、fish bait、Rabbit 长度或后缀不符，排除。<\/p>\n<p>第三条，大小写敏感对照：<\/p>\n<pre class=\"lang-sql\"><code>SELECT w FROM Words WHERE w GLOB &#x27;Fish*&#x27; ORDER BY w;<\/code><\/pre>\n<p>结果：Fish、Fisher。GLOB 区分大小写，小写开头的 fish bait 被排除；<code>*<\/code> 在 GLOB 里对应任意长度，位置作用与 <code>%<\/code> 相同。<\/p>\n<p>第四条，前导通配符：<\/p>\n<pre class=\"lang-sql\"><code>SELECT w FROM Words WHERE w LIKE &#x27;%fish%&#x27; ORDER BY w;<\/code><\/pre>\n<p>结果：Fish、Fisher、fish bait。模式首字符不确定，索引无法定位区段，只能六行逐行扫描比对；本条在 SQLite 下大小写不敏感，三个含 fish 片段的串都命中。<\/p>\n<h2>常见误读<\/h2>\n<p>误读 1：“LIKE 一定区分大小写，写 Fish 就匹配不到 fish。” 反例：上面 <code>LIKE &#x27;Fish%&#x27;<\/code> 把 <code>fish bait<\/code> 也选了出来。大小写是否敏感取决于 DBMS 的排序规则：SQLite 默认 LIKE 对 ASCII 不区分大小写，GLOB 区分；SQL Server 默认排序规则区分或不区分由建库时设定。跨库移植这段过滤前要在目标库实测，需要敏感匹配时用数据库提供的区分大小写谓词或排序规则。<\/p>\n<p>误读 2：“<code>%<\/code> 代表至少一个字符，写 Fish% 会排除正好叫 Fish 的行。” 反例：<code>&#x27;Fish%&#x27;<\/code> 结果包含 Fish 本身。<code>%<\/code> 匹配任意多个字符，个数可以是零；要要求 Fish 后至少一个字符，模式应写 <code>&#x27;Fish_%&#x27;<\/code>。<code>_<\/code> 才是固定吃掉一个字符。<\/p>\n<p>误读 3：“LIKE 可以当正则表达式用，能表达字符区间和重复次数。” 反例：想找第二位是数字的行，LIKE 没有 <code>[0-9]<\/code> 这类区间写法，只能用 <code>_<\/code> 逐个占位；重复次数（出现 2 到 5 次）也无法在 LIKE 里表达。需要区间、量词、分组时应使用 DBMS 提供的正则谓词，是否支持随产品。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例 1：前导通配符追求模糊检索。大表上 <code>&#x27;%关键词%&#x27;<\/code> 走全表扫描，行数越多越慢；能限定开头就把字面值放模式前部。<\/p>\n<p>反例 2：把 <code>_<\/code> 当多字符占位。<code>&#x27;_ bear&#x27;<\/code> 匹配一个字符加空格 bear，匹配不到 teddy bear 这种多词前缀。<\/p>\n<p>反例 3：忽略大小写与尾部空格。排序规则下大小写敏感时，<code>&#x27;fish%&#x27;<\/code> 匹配不到 Fish 开头的行；列值尾部空格也会让结尾模式落空。<\/p>\n<p>边界假设：本推演按标准 LIKE 语义展开；通配符本身要作为普通字符匹配时需要转义，转义符写法随 DBMS；Unicode 多字节字符下 <code>_<\/code> 按字符还是按字节计数，也以目标库为准。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n<code>%<\/code> 能不能匹配零个字符？<code>_<\/code> 呢？\n<\/li><li>\n<code>&#x27;%Ann&#x27;<\/code> 与 <code>&#x27;Ann%&#x27;<\/code> 分别要求列值满足什么位置条件？\n<\/li><li>\n为什么前导 <code>%<\/code> 的查询通常用不上索引？\n<\/li><li>\n想匹配名称正好两个单词、第二个单词是 doll 的产品，模式该怎么写？\n<\/li><li>\n列值尾部有空格时，结尾字面值模式为什么可能匹配失败？\n<\/ol><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.75<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">SELECT 与列选择（DISTINCT、别名）<\/a><\/span><\/div><h1>计算字段与常用函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 7–10 课\n<\/ul>\n<h2>问题<\/h2>\n<p>表里存的是拆分好的原子数据：城市、州、邮编分三列，单价和数量分两列，字符串大小写混合。应用报表却要拼好的地址、乘出来的金额、统一大小写的文本。把原始数据全拉到客户端再格式化，要传多余数据、重复写转换逻辑；计算字段把这些转换放到数据库端，在 SELECT 里现场算出需要的形式。<\/p>\n<h2>定义（逐句拆开）<\/h2>\n<p><strong>计算字段<\/strong>：运行时在 SELECT 语句内由表列、常量和表达式算出的结果，不物理存储在表中。<\/p>\n<ul><li>\n拼接：把多个列或字符串连成一个值，连接符按 DBMS 用 <code>+<\/code>、<code>||<\/code> 或 <code>CONCAT()<\/code>。\n<\/li><li>\n算术：列与列、列与常量之间用 <code>+ - * /<\/code> 计算。\n<\/li><li>\n函数调用：把列值送进文本、数值、日期函数转换后返回。\n<\/ul>\n<p><strong>别名<\/strong>：计算结果没有原生列名，用 <code>AS<\/code> 起别名作为结果集列名。<\/p>\n<p>正例：<code>quantity * item_price AS expanded_price<\/code> 每行算出该行金额。反例：以为计算字段会随表存下来，下次查询还在——它只存在于本次结果集。<\/p>\n<h2>原理推导（执行推演）<\/h2>\n<p>推演计算字段的生成时机。FROM 取出原始行后，SELECT 投影阶段对每一行分别计算表达式：取出该行的 quantity 和 item_price，相乘得到 expanded_price；不涉及跨行汇总，每行独立算自己的结果。<\/p>\n<p>推演函数的作用方式。函数接收列值作为参数，按函数定义转换后返回：UPPER 把字母转大写，RTRIM 去掉尾部空格，SUBSTRING 按位置截子串。函数对单行的一个值操作，输出一个值。<\/p>\n<p>推演可移植性分层。字符串大小写、长度、截取函数各 DBMS 大体相通；日期取年、取月的函数名和参数形式差异最大，换数据库时这部分代码往往要重写。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>成立条件：表达式中列的类型与运算匹配，数值列才能做算术；拼接两侧通常转成字符串。边界情况：<\/p>\n<ul><li>\n表达式遇到 NULL 行，算术结果一般也是 NULL（NULL 参与运算传播）。\n<\/li><li>\n拼接函数忽略空值的行为随 DBMS，需要显式处理 NULL。\n<\/li><li>\n失败案例：把 SQL Server 的 <code>DATEPART(yy, d)<\/code> 原样搬到 PostgreSQL，函数名不存在，查询报错；跨库前日期处理要单独查文档。\n<\/ul>\n<h2>辨析<\/h2>\n<p>计算字段与聚集函数的差别：计算字段对每行独立算一个值，结果行数不变；聚集函数把多行压成一个值（见聚集函数概念）。数据库端计算与客户端格式化的差别：数据库端少传原始数据、转换一次完成；客户端灵活但要传输更多数据。拼接符 <code>+<\/code> 与 <code>||<\/code> 的差别是 DBMS 方言，不是逻辑差别。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：SELECT 与列选择提供表达式书写位置。后继：聚集函数在 SELECT 列表里对多行汇总；联结后可以跨表列做拼接。计算字段是单行表达式，聚集是多行表达式，两者都写在 SELECT 列表中。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（计算字段与常用函数）<\/summary><div class=\"depth-body\"><h1>计算字段与常用函数：完整推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>从“报表要一个拼好的标题/金额”往回推：<\/p>\n<ol><li>\n目标值不是表里现成列，必须由现有列现算，这就是计算字段。\n<\/li><li>\n现算发生在 SELECT 投影阶段，对每行独立求值，不需要跨行数据。\n<\/li><li>\n字符串、数值、日期的转换由函数承担，函数是单行单值的操作。\n<\/li><li>\n函数名和参数随 DBMS 分化，日期类分化最严重，跨库要分层对待。\n<\/li><li>\n表达式里任一参与值为 NULL，结果如何传播取决于运算类型：算术通常传播 NULL，拼接行为随 DBMS，需要显式兜底。\n<\/ol>\n<p>底层假设：存储范式把信息拆成原子列，展示层再按需要组合；组合逻辑写在查询里，而不是冗余存进表。<\/p>\n<h2>正向推导（解析 → 执行顺序 → 行集合与列集合变化）<\/h2>\n<p>带计算字段的查询逻辑顺序：FROM 取行集合 → WHERE 筛行 → SELECT 投影阶段对每行计算表达式。计算字段不增减行，只在列集合里追加现算列。<\/p>\n<p>第一阶段，解析。DBMS 把表达式拆成操作数和操作符：列名对照表结构确认存在，常量类型明确，函数名在当前 DBMS 函数表中可识别；类型不匹配时（数值列上做字符串拼接）按规则转换或报错。<\/p>\n<p>第二阶段，逐行代入。行集合定型后，对每一行取出表达式涉及的列值，按运算优先级代入：先括号内，再乘除，后加减；函数先把参数值转换，返回值再参与外层运算。每行独立算自己的结果，行与行之间不汇总。<\/p>\n<p>第三阶段，命名与输出。表达式结果作为新列进入结果集，用 <code>AS<\/code> 起别名；不写别名时列名随 DBMS 生成。结果集行数与输入行集合一致，只是列多了现算项。<\/p>\n<p>第四阶段，NULL 传播检查。算术表达式中任一操作数为 NULL，整条表达式结果为 NULL；文本拼接在不同 DBMS 下行为不同，有的把 NULL 当空串，有的整条变 NULL，需要用 COALESCE 显式替换。<\/p>\n<p>结果为什么是这个结果：计算字段是投影阶段的单行变换，输入几行就输出几行；表达式按运算优先级逐行求值；NULL 沿算术传播；函数把单值转换后交回表达式。<\/p>\n<h2>算例一（原书样例库）<\/h2>\n<p>OrderItems 节选：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>order_num<\/th><th>prod_id<\/th><th>quantity<\/th><th>item_price<\/th><\/tr><\/thead><tbody><tr><td>20007<\/td><td>RGAN01<\/td><td>5<\/td><td>4.99<\/td><\/tr><tr><td>20008<\/td><td>RGAN01<\/td><td>10<\/td><td>4.99<\/td><\/tr><\/tbody><\/table><\/div>\n<p>推演算术表达式 <code>quantity * item_price<\/code>：20007 行 5 × 4.99 = 24.95；20008 行 10 × 4.99 = 49.90。两行各算各的，行数仍是 2，没有合并。<\/p>\n<p>推演拼接表达式。Vendors 有 vend_name=&#x27;Doll House Inc.&#x27;、vend_country=&#x27;USA&#x27;。标准 SQL 写法 <code>RTRIM(vend_name) || &#x27; (&#x27; || RTRIM(vend_country) || &#x27;)&#x27;<\/code>：先 RTRIM 去掉名尾部空格，接上空格左括号，接国家，接右括号，得到 <code>Doll House Inc. (USA)<\/code>。加号写法在 SQL Server 中等价，MySQL 需用 CONCAT。<\/p>\n<p>推演文本函数逐值转换。<code>UPPER(prod_name)<\/code> 把名称字母转大写；<code>SUBSTRING(prod_name, 1, 4)<\/code> 取前四个字符；<code>RTRIM<\/code> 清尾部空格。每个函数吃一个列值，吐一个转换后的值。<\/p>\n<p>对 Products 9 行执行：<\/p>\n<pre class=\"lang-sql\"><code>SELECT prod_name, prod_price, prod_price * 2 AS double_price\nFROM Products;<\/code><\/pre>\n<p>逐行计算 double_price：3.49→6.98（三只 bean bag），5.99→11.98，8.99→17.98，11.99→23.98，4.99→9.98，9.49→18.98（两只 doll）。结果仍为 9 行，每行多一个现算列。再算平均价格属于跨行汇总，不能在这一层做；<code>AVG(prod_price)<\/code> 是聚集函数，结果只有一行，与单行乘法区分开。<\/p>\n<h2>算例二（SQLite 已跑通）<\/h2>\n<p>第一条，行金额：<\/p>\n<pre class=\"lang-sql\"><code>SELECT order_num, prod_id, quantity, item_price,\n       ROUND(quantity * item_price, 2) AS expanded_price\nFROM OrderItems ORDER BY order_num;<\/code><\/pre>\n<p>结果：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>order_num<\/th><th>prod_id<\/th><th>quantity<\/th><th>item_price<\/th><th>expanded_price<\/th><\/tr><\/thead><tbody><tr><td>20007<\/td><td>RGAN01<\/td><td>5<\/td><td>4.99<\/td><td>24.95<\/td><\/tr><tr><td>20008<\/td><td>RGAN01<\/td><td>10<\/td><td>4.99<\/td><td>49.90<\/td><\/tr><\/tbody><\/table><\/div>\n<p>逐行：20007 行 quantity=5、item_price=4.99，相乘 24.95；20008 行 quantity=10、item_price=4.99，相乘 49.90。ROUND 只做两位小数取整，不改变参与相乘的原值。<\/p>\n<p>第二条，文本函数与拼接：<\/p>\n<pre class=\"lang-sql\"><code>SELECT vend_id, UPPER(vend_name) AS name_upper,\n       vend_id || &#x27;-&#x27; || vend_name AS code_name\nFROM Vendors ORDER BY vend_id;<\/code><\/pre>\n<p>结果：BRS01 / BEAR EMPORIUM / BRS01-Bear Emporium；DLL01 / DOLL HOUSE INC. / DLL01-Doll House Inc.；FNG01 / FUN PLUS DOLLS / FNG01-Fun Plus Dolls。UPPER 只转字母大小写，vend_id 保持原样；<code>||<\/code> 把三串连成一个 code_name。<\/p>\n<p>第三条，NULL 兜底拼接：<\/p>\n<pre class=\"lang-sql\"><code>SELECT cust_id,\n       cust_name || &#x27; &lt;&#x27; || COALESCE(cust_email, &#x27;(no email)&#x27;) || &#x27;&gt;&#x27; AS contact\nFROM Customers ORDER BY cust_id;<\/code><\/pre>\n<p>结果：001 为 <code>Village Toys &lt;sales@villagetoys.com&gt;<\/code>；002 邮箱为空，COALESCE 替换成 <code>(no email)<\/code>，得到 <code>Kids Place &lt;(no email)&gt;<\/code>；003、004 拼上各自邮箱；005 同样走占位串。若不用 COALESCE，NULL 参与拼接的结果随 DBMS，可能整条 contact 变 NULL。<\/p>\n<h2>常见误读<\/h2>\n<p>误读 1：“计算字段算一次就存进表里，下次查询还在。” 反例：本次查询算出的 expanded_price 只存在于本次结果集；关闭结果集后，表里没有这一列。下次查询要金额，必须再写一次 <code>quantity * item_price<\/code>。想物理存金额要加真实列并由写入逻辑维护，那是冗余存储，不是计算字段。<\/p>\n<p>误读 2：“列值为 NULL 时，算术表达式把它当 0 参与计算。” 反例：某行 item_price 为 NULL，<code>quantity * item_price<\/code> 结果是 NULL，不是 quantity 本身。NULL 乘任何数仍是 NULL；需要补零要显式写 <code>COALESCE(item_price, 0)<\/code>。聚集时 NULL 行同样被剔除，不进分母。<\/p>\n<p>误读 3：“字符串拼接用 <code>+<\/code> 到处都能跑。” 反例：SQL Server 用 <code>+<\/code> 拼接字符串；标准 SQL 与 PostgreSQL、SQLite 用 <code>||<\/code>；MySQL 用 CONCAT()。同一段拼接代码换库后，<code>+<\/code> 可能被解析成数值加法，字符串被转成 0。跨库项目应把拼接表达式集中封装，按目标 DBMS 选写法。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例 1：把计算结果存成冗余列。名称格式一变，所有冗余副本都要更新；计算字段不存数据，格式调整只改表达式。<\/p>\n<p>反例 2：日期函数跨库照搬。在 SQL Server 上跑通的 DATEPART 语句搬到 PostgreSQL 报函数不存在；跨库项目把日期过滤放到应用层，或为每种 DBMS 写对应版本。<\/p>\n<p>反例 3：假设 NULL 参与乘法当 0。NULL 乘任何数仍是 NULL，avg、sum 也不会把它当 0；需要补零要显式用函数替换。<\/p>\n<p>边界假设：本推演基于标准 SQL 表达式语义；具体拼接符、函数名、NULL 拼接行为以目标 DBMS 文档为准。另一类边界：除零、类型隐式转换在不同库上的报错或静默处理不同，金额表达式应先校验除数非零。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n计算字段存不存储在表中？它在哪一步生成？\n<\/li><li>\n单行算术表达式与聚集函数在结果行数上有什么差别？\n<\/li><li>\n表达式中某列为 NULL，算术结果通常是什么？\n<\/li><li>\n哪一类函数在不同 DBMS 间语法差异最大？\n<\/li><li>\n为什么产品单价和数量不直接存“行金额”列？\n<\/ol><\/div><\/details>", "c06": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.95<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">计算字段与常用函数<\/a><\/span><\/div><h1>聚集函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 7–10 课\n<\/ul>\n<h2>问题<\/h2>\n<p>报表常常不要明细行，只要总数、平均价、最高价、最低价、销售额。把整张表的明细拉到应用里再数数、求和，传输和计算都浪费。聚集函数让数据库在服务端把多行压成一个汇总值，直接返回结果。<\/p>\n<h2>定义（逐句拆开）<\/h2>\n<p><strong>聚集函数<\/strong>：对一组行计算后返回单个值的函数。SQL 标准五个：<\/p>\n<ul><li>\n<code>AVG(列)<\/code>：列值之和除以非空行数，得平均；\n<\/li><li>\n<code>COUNT(*)<\/code>：数行数，不看列值；\n<\/li><li>\n<code>COUNT(列)<\/code>：数该列非空的行数；\n<\/li><li>\n<code>MAX(列)<\/code>：列值最大者；\n<\/li><li>\n<code>MIN(列)<\/code>：列值最小者；\n<\/li><li>\n<code>SUM(列)<\/code>：列值求和。\n<\/ul>\n<p>NULL 行为：除 <code>COUNT(*)<\/code> 外，聚集都忽略该列为 NULL 的行；不是把 NULL 当 0 参与计算。<code>DISTINCT<\/code> 加在参数前，只按不同值计算，如 <code>COUNT(DISTINCT vend_id)<\/code>。<\/p>\n<p>正例：<code>AVG(prod_price)<\/code> 返回全部产品平均价。反例：以为 <code>COUNT(列)<\/code> 也数 NULL 行，结果把空值行也算进分母。<\/p>\n<h2>原理推导（执行推演）<\/h2>\n<p>推演 COUNT(*) 的计数。逐行扫过结果集，每遇到一行计数加一，不论该行各列是否为空；最后返回行数。<\/p>\n<p>推演 COUNT(列) 的计数。逐行检查该列：非空才加一，NULL 行跳过。两列可空性不同时，两个 COUNT 结果可能不同。<\/p>\n<p>推演 AVG 的计算。先对非空行求列值之和，再除以非空行数；NULL 行既不进分子也不进分母。MAX/MIN 在非空行之间比较大小，SUM 只累加非空行。<\/p>\n<p>推演 WHERE 与聚集的先后。WHERE 先过滤行，留下的行再进入聚集；因此 <code>AVG(prod_price) WHERE vend_id=&#x27;DLL01&#x27;<\/code> 只对 DLL01 产品求平均。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>成立条件：AVG、SUM、MAX、MIN 用于数值列（MIN/MAX 也可用于可排序的文本、日期列）。边界情况：<\/p>\n<ul><li>\n聚集作用于空结果集时，COUNT 返回 0，AVG/SUM/MAX/MIN 返回 NULL。\n<\/li><li>\n多列汇总要写多个聚集函数，一个 AVG 只能算一列。\n<\/li><li>\n失败案例：把 NULL 当 0 算平均，空值行被错误纳入分母，平均值被拉低。\n<\/ul>\n<h2>辨析<\/h2>\n<p>COUNT(*) 与 COUNT(列) 的差别：前者数行、后者数非空值，这是最常考的边界。聚集函数与计算字段的差别：聚集把多行压成一行结果，计算字段每行独立算值。AVG 与 SUM/COUNT 的关系：AVG 等于 SUM 除以非空行数，NULL 行在两者中同样被剔除。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：WHERE 先过滤参与聚集的行；计算字段提供表达式写法，聚集参数可以是表达式。后继：GROUP BY 把聚集从“全表一个值”推进到“每组一个值”；HAVING 对聚集结果做组级过滤。聚集函数是分组查询的计算核心。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（聚集函数）<\/summary><div class=\"depth-body\"><h1>聚集函数：完整推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>从“返回一个汇总数”往回推：<\/p>\n<ol><li>\n汇总数由一组行算出，函数需要先确定参与计算的行集合。\n<\/li><li>\n行集合由 FROM 和 WHERE 划定，WHERE 剔除的行不进入聚集。\n<\/li><li>\n每行的列值可能为 NULL，函数要先决定 NULL 行是否参与，这决定了分母和求和范围。\n<\/li><li>\n不同函数的归约方式不同：计数、求和、最值、平均，按各自定义扫一遍非空行。\n<\/li><li>\n聚集把多行压成一行结果；SELECT 列表里同时放普通列和聚集值时，普通列必须先被分组，否则组内多值无法归约。\n<\/ol>\n<p>底层假设：聚集是对 multiset（可重复行集合）的归约操作，输入多行，输出一行单值。<\/p>\n<h2>正向推导（解析 → 执行顺序 → 行集合与列集合变化）<\/h2>\n<p>带聚集的查询逻辑顺序：FROM 取行集合 → WHERE 剔除不要的行 → （如有 GROUP BY 分堆）→ 聚集对每组或全表归约 → SELECT 输出汇总列。WHERE 在聚集之前，被剔除的行不参与任何汇总。<\/p>\n<p>第一阶段，解析。DBMS 确认聚集函数作用的列属于 FROM 后的表；区分 COUNT(*)（不指定列）与 COUNT(列)（指定可空列）；识别参数前的 DISTINCT。<\/p>\n<p>第二阶段，划定参与行。WHERE 先把不满足条件的行移出集合；剩下的行进入聚集。这一步决定了“对哪些行求和、对哪些行计数”。<\/p>\n<p>第三阶段，NULL 剔除。除 COUNT(<em>) 外，聚集逐行检查参数列：列为 NULL 的行跳过，不进分子也不进分母；COUNT(<\/em>) 不看列值，每行都计数。<\/p>\n<p>第四阶段，归约扫描。COUNT 逐行加一；SUM 累加非空值；MIN/MAX 在非空值之间比较；AVG 先求非空值之和，再除以非空行数。扫描一遍得到汇总值。<\/p>\n<p>第五阶段，输出。结果集从多行压成一行（未分组时）；汇总列名由函数表达式或别名给出。<\/p>\n<p>结果为什么是这个结果：参与行由 WHERE 划定，NULL 行按函数规则剔除，归约方式由函数名决定；AVG 的分母是非空行数而不是总行数，这是 NULL 边界最容易算错的一步。<\/p>\n<h2>算例一（原书样例库）<\/h2>\n<p>Products 9 行价格：BNBG01 3.49、BNBG02 3.49、BNBG03 3.49、BR01 5.99、BR02 8.99、BR03 11.99、RGAN01 4.99、RYL01 9.49、RYL02 9.49。<\/p>\n<p>推演 <code>COUNT(*)<\/code>：逐行计数，9 行全部计入，结果 9。<\/p>\n<p>推演 <code>SUM(prod_price)<\/code>：9 个非空价格相加 3.49+3.49+3.49+5.99+8.99+11.99+4.99+9.49+9.49 = 61.41。<\/p>\n<p>推演 <code>AVG(prod_price)<\/code>：分母是非空行数 9，61.41 / 9 = 6.823333，与书上印刷输出一致。<\/p>\n<p>推演 WHERE 过滤后聚集。<code>WHERE vend_id=&#x27;DLL01&#x27;<\/code> 留下 BNBG01、BNBG02、BNBG03、RGAN01 四行，价格 3.49、3.49、3.49、4.99，和为 15.46，平均 15.46 / 4 = 3.865，与书上输出一致。<\/p>\n<p>推演 NULL 计数。Customers 5 行，cust_email 有两行 NULL。<code>COUNT(*)<\/code> 逐行计数得 5；<code>COUNT(cust_email)<\/code> 跳过两个 NULL 行，得 3。<\/p>\n<p>推演最值。<code>MIN(prod_price)<\/code> 在 9 个非空价格中比较，最小 3.49；<code>MAX(prod_price)<\/code> 最大 11.99。空结果集上这两个函数返回 NULL，不是 0。<\/p>\n<p>OrderItems 节选：20007 行 quantity=5，20008 行 quantity=10。<\/p>\n<pre class=\"lang-sql\"><code>SELECT SUM(quantity) AS items_ordered FROM OrderItems WHERE order_num = 20008;<\/code><\/pre>\n<p>WHERE 只留 20008 一行，SUM(quantity)=10。<\/p>\n<pre class=\"lang-sql\"><code>SELECT COUNT(DISTINCT vend_id) FROM Products;<\/code><\/pre>\n<p>vend_id 取值 DLL01、BRS01、FNG01 三种不同值，结果 3；去掉 DISTINCT 的 <code>COUNT(vend_id)<\/code> 数 9 行非空值。<\/p>\n<h2>算例二（SQLite 已跑通）<\/h2>\n<p>第一条，Products 全表聚集：<\/p>\n<pre class=\"lang-sql\"><code>SELECT COUNT(*), COUNT(prod_desc), ROUND(AVG(prod_price),4),\n       SUM(prod_price), MIN(prod_price), MAX(prod_price)\nFROM Products;<\/code><\/pre>\n<p>结果：COUNT(<em>)=9，COUNT(prod_desc)=0，AVG=6.8233，SUM=61.41，MIN=3.49，MAX=11.99。逐行说明：prod_desc 九行全为 NULL，COUNT(prod_desc) 跳过全部 NULL 行得 0；COUNT(<\/em>) 不看描述列，仍得 9；AVG 与 SUM 只对非空价格计算；MIN/MAX 在非空价格间比较。<\/p>\n<p>第二条，Customers 空值计数：<\/p>\n<pre class=\"lang-sql\"><code>SELECT COUNT(*), COUNT(cust_email) FROM Customers;<\/code><\/pre>\n<p>结果 5、3。逐行：001 有邮箱计入，002 邮箱 NULL 被 COUNT(cust_email) 跳过，003 计入，004 计入，005 跳过；COUNT(*) 五行全计。<\/p>\n<p>第三条，空结果集：<\/p>\n<pre class=\"lang-sql\"><code>SELECT COUNT(*), AVG(prod_price) FROM Products WHERE vend_id=&#x27;NOPE&#x27;;<\/code><\/pre>\n<p>结果 COUNT(<em>)=0，AVG=NULL。WHERE 筛完一行不剩：COUNT(<\/em>) 对空集返回 0；AVG 没有非空值可除，返回 NULL，不是 0。<\/p>\n<h2>常见误读<\/h2>\n<p>误读 1：“COUNT(列) 和 COUNT(<em>) 都是数行数，结果一样。” 反例：Customers 上 <code>COUNT(<\/em>)<\/code> 得 5，<code>COUNT(cust_email)<\/code> 得 3。列可空时，COUNT(列) 跳过 NULL 行；要数全部行必须用 COUNT(*)。两列可空性不同时，同一张表上两个 COUNT 结果可以不同。<\/p>\n<p>误读 2：“AVG 把 NULL 当 0 算进平均。” 反例：某列三行值 4、6、NULL，正确 AVG=(4+6)/2=5；当 0 算会得到 (4+6+0)/3≈3.33，分母被错误拉大。NULL 行既不进分子也不进分母，需要补零应先 COALESCE 成 0 再平均。<\/p>\n<p>误读 3：“空表上 AVG、MAX 返回 0。” 反例：<code>WHERE vend_id=&#x27;NOPE&#x27;<\/code> 筛空后，AVG 返回 NULL，MAX/MIN/SUM 同样返回 NULL；只有 COUNT 返回 0。应用层拿到 NULL 要按“无数据”处理，不能当成 0 参与后续加减。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例 1：把 NULL 当 0 求平均。某列三行值 4、6、NULL，正确 AVG=(4+6)/2=5；当 0 算会得到 (4+6+0)/3≈3.33，分母被错误拉大。<\/p>\n<p>反例 2：用 COUNT(列) 数行数。列可空时结果少计 NULL 行；要数全部行必须用 COUNT(*)。<\/p>\n<p>反例 3：对空表求 AVG 期待返回 0。空结果集上 AVG/SUM/MAX/MIN 返回 NULL，COUNT 返回 0；应用层要分别处理。<\/p>\n<p>边界假设：本推演按标准 SQL 聚集语义；DISTINCT 在聚集参数中的写法、空集返回值细节，个别 DBMS 有扩展。另一类边界：AVG、SUM、MAX、MIN 用于数值列，MIN/MAX 也可用于可排序的文本、日期列；一个聚集函数只能汇总一列，多列汇总要写多个函数。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\nCOUNT(*) 与 COUNT(列) 在有 NULL 时结果为什么不同？\n<\/li><li>\nAVG 的分母包含 NULL 行吗？\n<\/li><li>\nWHERE 过滤发生在聚集之前还是之后？\n<\/li><li>\nCOUNT(DISTINCT vend_id) 统计的是什么？\n<\/li><li>\n空结果集上 MAX() 返回 0 还是 NULL？\n<\/ol><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.106<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">聚集函数<\/a><\/span><\/div><h1>GROUP BY 与 HAVING 分组<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 7–10 课\n<\/ul>\n<h2>问题<\/h2>\n<p>全表聚集只能给一个总数。业务要的是“每个供应商各有多少产品”“每个顾客下过几单”，必须按类别把行分组，再对每组分别聚集。分组之后还常常要筛掉不达标的组（产品数少于 2 的供应商）。困难在于：行级条件和组级条件发生在不同阶段，用错子句要么报错，要么结果不对。<\/p>\n<h2>定义（逐句拆开）<\/h2>\n<p><strong>GROUP BY<\/strong>：按一列或多列把行划分为若干组，每组内分组列取值相同；后续聚集对每组各算一次。 <strong>HAVING<\/strong>：在分组完成之后过滤分组，条件可以引用组级聚集结果。 <strong>分组列<\/strong>：GROUP BY 后列出的列；SELECT 中除聚集函数外的列必须全部出现在其中。<\/p>\n<p>正例：<code>GROUP BY vend_id<\/code> 把 Products 按供应商分成三组，每组 COUNT(*) 一次。反例：SELECT 里放一个没分组也没被聚集的列，组内该列多值，无法决定取哪一行。<\/p>\n<h2>原理推导（执行推演）<\/h2>\n<p>推演分组执行顺序。FROM 取行 → WHERE 剔除不要的行 → GROUP BY 按分组列排序分堆 → 每堆做聚集 → HAVING 筛堆 → SELECT 投影 → ORDER BY 输出。<\/p>\n<p>推演为什么非分组列不能进 SELECT。一组内分组列只有一个值，可以直接输出；聚集函数对组算出一个值；而普通非分组列在组内可能有多个取值，结果不唯一，标准 SQL 拒绝这种选择。<\/p>\n<p>推演 WHERE 与 HAVING 的分工。WHERE 作用在分堆之前，面对单行，看不到“这组有多少行”；HAVING 作用在分堆之后，可以引用 COUNT(*)、AVG() 等组级结果。要先剔行再筛组时两者并存：WHERE 决定哪些行进堆，HAVING 决定哪些堆留下。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>成立条件：分组列取值可比较；除聚集外 SELECT 列都进 GROUP BY。边界情况：<\/p>\n<ul><li>\n分组列含 NULL 时，NULL 会聚成单独一组；多行 NULL 算同一组。\n<\/li><li>\nGROUP BY 必须在 WHERE 之后、ORDER BY 之前。\n<\/li><li>\n失败案例：把组级条件写进 WHERE，<code>WHERE COUNT(*)&gt;=2<\/code> 在分组前执行，COUNT 还没算出来，语义不成立。\n<\/ul>\n<h2>辨析<\/h2>\n<p>WHERE 与 HAVING 的差别是执行阶段不同：WHERE 滤行、HAVING 滤组。GROUP BY 与 DISTINCT 的差别：DISTINCT 只去重不计算；GROUP BY 配合聚集产出每组统计。分组列与聚集列的差别：分组列决定怎么分堆，聚集列决定每堆放什么汇总值。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：聚集函数提供每组的汇总算法；WHERE 先完成行级过滤。后继：子查询可以把分组结果再嵌套进外层条件；联结后可以按一侧表的列分组。分组是把“全表一个值”细化为“每组一个值”的关键一步。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（GROUP BY 与 HAVING 分组）<\/summary><div class=\"depth-body\"><h1>GROUP BY 与 HAVING：完整推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>从“每个供应商一行统计”往回推：<\/p>\n<ol><li>\n一行统计对应一个供应商，前提是先把同供应商的行归到一起，这就是 GROUP BY。\n<\/li><li>\n归堆之后每堆算聚集值，聚集算法来自聚集函数。\n<\/li><li>\n要淘汰不达标的堆，过滤必须发生在归堆之后，这就是 HAVING 而不是 WHERE。\n<\/li><li>\nSELECT 能放哪些列，由“组内是否唯一确定”决定：分组列唯一，聚集结果唯一，普通列不唯一。\n<\/li><li>\n分组列上的 NULL 也参与分堆：多行 NULL 合成单独一组，不会被当成无效值剔除。\n<\/ol>\n<p>底层假设：分组是把行集合按等值关系划分成互不相交的子集，每个子集对应结果集一行。<\/p>\n<h2>正向推导（解析 → 执行顺序 → 行集合与列集合变化）<\/h2>\n<p>分组查询的逻辑执行顺序：FROM 取行 → WHERE 剔行 → GROUP BY 按分组列分堆 → 每堆聚集 → HAVING 筛堆 → SELECT 投影 → ORDER BY 输出。WHERE 面对的是单行，HAVING 面对的是堆。<\/p>\n<p>第一阶段，解析。DBMS 识别 GROUP BY 后的分组列，检查 SELECT 列表：非聚集列必须全部出现在分组列中；HAVING 中的条件可以引用聚集结果。解析阶段先把“哪些列合法”定下来。<\/p>\n<p>第二阶段，WHERE 先行过滤。行集合先经过 WHERE：不满足行级条件的行直接移出，不进入分堆。WHERE 看不到计数、均价这些堆级结果。<\/p>\n<p>第三阶段，等值分堆。剩余行按分组列取值分组：分组列值相同的行进入同一堆；NULL 与 NULL 归为一堆。每堆内部行顺序不保留，堆之间按后续排序输出。<\/p>\n<p>第四阶段，堆内聚集。对每堆分别跑聚集函数：COUNT 数堆内行数，AVG 对堆内非空值求平均，MIN/MAX 取堆内最值。每个聚集在每堆产出一个值。<\/p>\n<p>第五阶段，HAVING 筛堆。按堆级条件比较每堆的聚集值：不达标的整堆剔除，不进入结果集。HAVING 不能引用堆内普通列的多值，只能引用分组列或聚集结果。<\/p>\n<p>第六阶段，投影输出。每个留下的堆输出一行：分组列值加各聚集值。<\/p>\n<p>结果为什么是这个结果：行先被 WHERE 筛过，再按等值列分堆；堆内唯一可输出的是分组列和聚集值；HAVING 在堆形成之后淘汰堆。顺序一旦错位，要么条件无值可算，要么列值无法确定。<\/p>\n<h2>算例一（原书样例库）<\/h2>\n<p>Products 9 行（vend_id, prod_price）：BNBG01 DLL01 3.49；BNBG02 DLL01 3.49；BNBG03 DLL01 3.49；RGAN01 DLL01 4.99；BR01 BRS01 5.99；BR02 BRS01 8.99；BR03 BRS01 11.99；RYL01 FNG01 9.49；RYL02 FNG01 9.49。<\/p>\n<p>推演 <code>GROUP BY vend_id<\/code>：按 vend_id 等值分堆，DLL01 四行（三只 bag + RGAN01），BRS01 三行（BR01/02/03），FNG01 两行（RYL01/02）。<\/p>\n<p>推演每堆聚集。<code>COUNT(*)<\/code> 逐堆计数：DLL01=4，BRS01=3，FNG01=2，与书上印刷输出一致。<\/p>\n<p>推演 SELECT 列合法性。<code>SELECT vend_id, COUNT(<em>)<\/code>：vend_id 是分组列，堆内唯一；COUNT(<\/em>) 是聚集，堆内单值，合法。若再加 <code>prod_name<\/code>，DLL01 堆内有四个不同名字，DBMS 无法选一个，标准 SQL 拒绝。<\/p>\n<p>推演 WHERE 先行。语句 <code>WHERE prod_price&gt;=4 GROUP BY vend_id<\/code>：先剔除价格低于 4 的三只 bag（3.49），剩 RGAN01、BR01、BR02、BR03、RYL01、RYL02 六行；再分堆：DLL01 只剩 RGAN01 一行，BRS01 三行，FNG01 两行。<\/p>\n<p>推演 HAVING 筛堆。<code>HAVING COUNT(*)&gt;=2<\/code>：DLL01 堆只剩 1 行被淘汰，BRS01=3、FNG01=2 留下，结果 BRS01、FNG01 两行，与书上输出一致。<\/p>\n<h2>算例二（Orders 表，SQLite 已跑通）<\/h2>\n<p>Orders 5 行：20005→1000000001，20006→1000000003，20007→1000000004，20008→1000000005，20009→1000000001。<\/p>\n<p>第一条，分组计数：<\/p>\n<pre class=\"lang-sql\"><code>SELECT cust_id, COUNT(*) AS order_cnt\nFROM Orders GROUP BY cust_id ORDER BY cust_id;<\/code><\/pre>\n<p>分堆结果：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>cust_id<\/th><th>order_cnt<\/th><\/tr><\/thead><tbody><tr><td>1000000001<\/td><td>2<\/td><\/tr><tr><td>1000000003<\/td><td>1<\/td><\/tr><tr><td>1000000004<\/td><td>1<\/td><\/tr><tr><td>1000000005<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>逐行：20005、20009 同属 001，进同一堆计 2；20006 单独一堆 003；20007 单独一堆 004；20008 单独一堆 005。<\/p>\n<p>第二条，HAVING 筛堆：<\/p>\n<pre class=\"lang-sql\"><code>SELECT cust_id, COUNT(*) AS order_cnt\nFROM Orders GROUP BY cust_id HAVING COUNT(*)&gt;=2 ORDER BY cust_id;<\/code><\/pre>\n<p>逐堆比较计数：001 堆 2 满足 ≥2 留下；003、004、005 各 1 被淘汰。结果仅 001 / 2。<\/p>\n<p>第三条，反事实：去掉 GROUP BY：<\/p>\n<pre class=\"lang-sql\"><code>SELECT COUNT(*) AS order_cnt FROM Orders;<\/code><\/pre>\n<p>结果全表压成一行，order_cnt=5。没有分堆这一步，COUNT(*) 对 5 行整体归约；不会按顾客各出一行。<\/p>\n<h2>常见误读<\/h2>\n<p>误读 1：“组级条件写 WHERE 也能跑，和 HAVING 等价。” 反例：<code>WHERE COUNT(<em>)&gt;=2 GROUP BY cust_id<\/code>。WHERE 在分组前执行，此时每堆还没形成，COUNT(<\/em>) 没有可计数的组，标准 SQL 直接拒绝；同样条件放 HAVING，分组完成后才能比较堆计数。先剔行用 WHERE，再筛堆用 HAVING，两者阶段不同，不能互换。<\/p>\n<p>误读 2：“GROUP BY 之后 SELECT 可以顺带带上表里其他列。” 反例：<code>SELECT vend_id, prod_name, COUNT(*) FROM Products GROUP BY vend_id<\/code>。DLL01 堆内有四个 prod_name，普通列在堆内多值，结果无法决定取哪一行；标准 SQL 拒绝这种选择。宽松实现可能随机取组内一行，换数据库行为不可移植。<\/p>\n<p>误读 3：“去掉 GROUP BY，COUNT(<em>) 会对每行各算一个计数。” 反例：没有 GROUP BY 时，整表是一个隐式大堆，COUNT(<\/em>) 只输出全表行数一个值；想每个顾客一行，必须显式 GROUP BY cust_id。聚集函数在无分组时作用于全表，不是逐行计算。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例 1：SELECT 放非分组列。<code>SELECT vend_id, prod_name, COUNT(*) FROM Products GROUP BY vend_id<\/code> 在标准 SQL 非法；宽松实现可能随机取组内一行，换数据库行为不可移植。<\/p>\n<p>反例 2：组级条件写 WHERE。<code>WHERE COUNT(*)&gt;=2<\/code> 在分组前执行，此时还没产生组和计数，数据库无法求值。<\/p>\n<p>反例 3：NULL 分组被忽略。分组列含多行 NULL 时它们合成一组；以为 NULL 行会被排除，结果清单少一组。<\/p>\n<p>边界假设：本推演按标准 SQL 分组规则；个别 DBMS 允许宽松的非分组列选择、支持相对位置 GROUP BY，移植时不要依赖这些方言。另一类边界：按多列分组时，分组列组合相同的行才进同一堆；分组列类型不可比较时无法分堆。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n为什么 SELECT 里非聚集列必须出现在 GROUP BY 中？\n<\/li><li>\nWHERE 和 HAVING 分别在分组的什么阶段执行？\n<\/li><li>\n分组列里的多行 NULL 会被分成几组？\n<\/li><li>\n想先剔掉低价产品、再筛产品数 ≥2 的供应商，条件分别写在哪？\n<\/li><li>\nDISTINCT 能不能替代 GROUP BY 完成每组计数？\n<\/ol><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.116<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">WHERE 与比较、逻辑操作符<\/a><\/span><\/div><h1>子查询<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 11–14 课\n<\/ul>\n<h2>问题<\/h2>\n<p>有些查询要分几步才能回答：先查出包含某物品的订单号，再拿订单号找顾客，最后取顾客信息。分三次手动查询要在程序里中转中间结果，容易漏掉边界情况。子查询把内层 SELECT 嵌进外层 SELECT 的条件里，一条语句完成多步检索，避免手工搬运中间集合。<\/p>\n<h2>定义（逐句拆开）<\/h2>\n<p><strong>子查询（subquery）<\/strong>：嵌套在另一条 SELECT 内部的 SELECT 语句。<\/p>\n<ul><li>\n出现在 WHERE 中：结果交给外层做 <code>IN<\/code> 或比较。\n<\/li><li>\n出现在 SELECT 列表中：作为每行的计算字段。\n<p><strong>非相关子查询<\/strong>：内层不引用外层列，可以独立先跑，结果固定后再交给外层。 <strong>相关子查询<\/strong>：内层引用外层列，外层每取一行，内层按这行的值重复执行一次。<\/p>\n<\/ul>\n<p>正例：<code>WHERE order_num IN (SELECT order_num FROM OrderItems WHERE prod_id=&#x27;RGAN01&#x27;)<\/code>。反例：IN 后的子查询返回多列，外层无法逐值配对。<\/p>\n<h2>原理推导（执行推演）<\/h2>\n<p>推演非相关子查询的执行顺序。DBMS 先跑内层 SELECT，得到一个单列结果集合；外层再把自己的列值与这个集合做 IN 匹配。内层不依赖外层任何值，只跑一次。<\/p>\n<p>推演结果列数约束。IN 是把外层一个列值与集合中的元素逐个比较，集合必须是单列；多列配对属于另一种语法，不能塞进 IN。<\/p>\n<p>推演相关子查询的执行顺序。内层 WHERE 中出现外层表的列，外层取第一行 → 带这行的值跑内层 → 得到结果 → 外层判定 → 再取下一行。外层有多少行，内层就跑多少次。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>成立条件：内层返回的列数、类型与外层条件匹配；非相关子查询结果可作为集合使用。边界情况：<\/p>\n<ul><li>\nNOT IN 遇到内层返回 NULL，外层整组结果为空（见 WHERE 概念）。\n<\/li><li>\n子查询嵌套层数过多时可读性下降，复杂步骤可拆成联结或中间表。\n<\/li><li>\n失败案例：把含 NULL 的列放进 NOT IN 子查询，外层查不到任何行，误以为没有匹配数据。\n<\/ul>\n<h2>辨析<\/h2>\n<p>子查询与联结的差别：子查询先产集合再过滤，适合分步取值；联结同时取两表列做配对，需要输出多表字段时更直接。非相关与相关子查询的差别在内层是否引用外层列，执行次数因此不同。IN 子查询与比较子查询的差别：IN 配单列多行结果，单行比较（=、&gt;）要求内层只返回一行一列。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：WHERE 条件与 IN 操作符是子查询的落点；主键外键保证内层取值能对上外层。后继：联结是跨表取数的另一条路径；视图可以把常用子查询封装复用。子查询和联结在很多需求上可以互相改写。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（子查询）<\/summary><div class=\"depth-body\"><h1>子查询：完整推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>从“找出买过某产品的顾客”往回推：<\/p>\n<ol><li>\n产品在 OrderItems 里，先要有一步取出含该产品的订单号。\n<\/li><li>\n订单号在 Orders 里对应顾客 ID，第二步用订单号集合匹配顾客 ID。\n<\/li><li>\n两步可以串成一条语句：内层 SELECT 产出订单号集合，外层用 IN 接收。\n<\/li><li>\n内层能否独立先跑，决定它是非相关还是相关子查询。\n<\/li><li>\n内层返回的列数、行数必须与外层条件匹配：IN 配单列多行，单行比较配单列单行。\n<\/ol>\n<p>底层假设：SQL 查询可以分层组合，内层结果作为外层条件的输入，像函数嵌套一样由内向外求值。<\/p>\n<h2>正向推导（解析 → 执行顺序 → 行集合与列集合变化）<\/h2>\n<p>非相关子查询的逻辑顺序：先解析整条语句，识别内层 SELECT 与外层 SELECT 的边界 → 内层独立执行得到集合 → 外层逐行用集合做 IN 匹配 → 留下匹配行。<\/p>\n<p>第一阶段，解析。DBMS 把嵌套的 SELECT 分层：内层引用的列属于 OrderItems，外层引用的列属于 Orders；检查内层返回列数与外层操作符匹配。IN 要求内层单列，<code>=<\/code> 比较要求内层单列单行。<\/p>\n<p>第二阶段，非相关内层执行。内层不引用外层任何列，先完整跑一遍，得到一个固定的单列集合。这一步只跑一次，结果固定后交给外层。<\/p>\n<p>第三阶段，外层逐行匹配。外层取一行，把该行列值与内层集合逐个比较：在集合内留真行，不在集合内丢弃。集合是固定的，外层每行都拿同一个集合比对。<\/p>\n<p>第四阶段，相关子查询的执行。内层 WHERE 引用了外层表的列，内层不能独立先跑：外层取第一行，把这行的值代入内层跑一次，得到结果交外层判定；再取第二行，内层按新值再跑一次。外层有多少行，内层就执行多少次。<\/p>\n<p>结果为什么是这个结果：非相关子查询先产固定集合再过滤，内层一次；相关子查询随外层行重复触发，内层多次。列数不匹配在解析阶段就被拒绝；NULL 沿 IN/NOT IN 的三值逻辑传播。<\/p>\n<h2>算例一（原书样例库）<\/h2>\n<p>OrderItems：20007 行 prod_id=RGAN01；20008 行 prod_id=RGAN01。Orders：20005→1000000001，20006→1000000003，20007→1000000004，20008→1000000005，20009→1000000001。<\/p>\n<p>执行内层：<\/p>\n<pre class=\"lang-sql\"><code>SELECT order_num FROM OrderItems WHERE prod_id = &#x27;RGAN01&#x27;;<\/code><\/pre>\n<p>逐行筛出 RGAN01，得到订单号集合 {20007, 20008}。<\/p>\n<p>执行外层：<\/p>\n<pre class=\"lang-sql\"><code>SELECT cust_id FROM Orders WHERE order_num IN (20007, 20008);<\/code><\/pre>\n<p>逐行匹配：20005 不在集合，排除；20006 不在，排除；20007 在，留 1000000004；20008 在，留 1000000005；20009 不在，排除。结果 1000000004、1000000005，与书上印刷输出一致。<\/p>\n<p>嵌套合并后的语句：<\/p>\n<pre class=\"lang-sql\"><code>SELECT cust_id FROM Orders\nWHERE order_num IN (SELECT order_num\n                    FROM OrderItems WHERE prod_id = &#x27;RGAN01&#x27;);<\/code><\/pre>\n<p>DBMS 仍按先内后外跑：内层只执行一次，产出固定集合，外层再逐行匹配。<\/p>\n<p>等价联结写法：<\/p>\n<pre class=\"lang-sql\"><code>SELECT DISTINCT O.cust_id\nFROM Orders O\nINNER JOIN OrderItems OI ON O.order_num = OI.order_num\nWHERE OI.prod_id = &#x27;RGAN01&#x27;;<\/code><\/pre>\n<p>两种写法结果相同：联结先配对再去重，子查询先出集合再过滤。<\/p>\n<h2>算例二（SQLite 已跑通）<\/h2>\n<p>第一条，IN 子查询：<\/p>\n<pre class=\"lang-sql\"><code>SELECT cust_id FROM Orders\nWHERE order_num IN (SELECT order_num FROM OrderItems WHERE prod_id=&#x27;RGAN01&#x27;)\nORDER BY cust_id;<\/code><\/pre>\n<p>内层集合 {20007, 20008}；外层逐行：20005、20006、20009 不在集合排除，20007 留 004，20008 留 005。结果 1000000004、1000000005。<\/p>\n<p>第二条，相关子查询 EXISTS：<\/p>\n<pre class=\"lang-sql\"><code>SELECT C.cust_id FROM Customers C\nWHERE EXISTS (SELECT 1 FROM Orders O WHERE O.cust_id=C.cust_id)\nORDER BY C.cust_id;<\/code><\/pre>\n<p>外层逐顾客触发内层：001 内层查到 20005、20009，EXISTS 为真，留；002 内层查不到订单，为假，丢；003 查到 20006，留；004 查到 20007，留；005 查到 20008，留。结果 001、003、004、005，002 不出现。内层 SELECT 1 只判断是否存在行，不取具体列值。<\/p>\n<p>第三条，NOT IN 含 NULL：<\/p>\n<pre class=\"lang-sql\"><code>SELECT cust_id FROM Customers WHERE cust_id NOT IN (&#x27;1000000001&#x27;, NULL);<\/code><\/pre>\n<p>展开为 <code>cust_id&lt;&gt;&#x27;1000000001&#x27; AND cust_id&lt;&gt;NULL<\/code>，第二项对每行未知，AND 链不为真，结果 0 行。<\/p>\n<h2>常见误读<\/h2>\n<p>误读 1：“NOT IN 和 NOT EXISTS 等价，遇到 NULL 行为一样。” 反例：上面第三条 NOT IN 列表含 NULL，外层整组返空；换成 NOT EXISTS：<code>WHERE NOT EXISTS (SELECT 1 FROM Orders O WHERE O.cust_id=C.cust_id)<\/code>，内层只判断存在性，不把 NULL 值带回外层做不等比较，NULL 不会让结果变空。两者在无 NULL 时结果可能相同，有 NULL 时 NOT IN 先翻车。<\/p>\n<p>误读 2：“子查询一定比联结慢（或一定更快），选写法只看写法形式。” 反例：同一需求的 IN 子查询与内联结，DBMS 优化器可能把子查询改写成联结执行，也可能按嵌套方式跑；实际成本取决于索引、行数和执行计划。写法选择应先看可读性，再用执行计划对比实测，不能凭形式下结论。<\/p>\n<p>误读 3：“IN 后面的子查询返回几列都行，外层自动配对。” 反例：内层写成 <code>SELECT order_num, prod_id ...<\/code> 返回两列，外层 IN 只有一个列值可配对，标准 SQL 拒绝。IN 是单列值与单列集合的比较；需要多列配对时应改用联结。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例 1：NOT IN 内层含 NULL。若 OrderItems 某行 order_num 为 NULL，<code>NOT IN (..., NULL)<\/code> 展开的 AND 链出现 <code>x&lt;&gt;NULL<\/code>，结果未知，外层返回空；改用 NOT EXISTS 或先剔 NULL。<\/p>\n<p>反例 2：IN 后子查询返回多列。配对维度不一致，语句报错；需要多列匹配时应使用联结。<\/p>\n<p>反例 3：相关子查询在外层大表上逐行触发内层。行数很多时内层被重复执行，性能下降；应与联结写法对比实测。<\/p>\n<p>边界假设：本推演按标准非相关子查询顺序；具体 DBMS 可能把某些子查询改写成联结执行，结果一致但执行计划不同。另一类边界：嵌套层数过多时可读性下降，复杂步骤可拆成联结或中间表；单行比较（=、&gt;）要求内层只返回一行一列，返回多行时应改用 IN。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n非相关子查询由内向外执行，内层跑几次？\n<\/li><li>\nIN 后面的子查询为什么只能返回一列？\n<\/li><li>\n相关子查询与非相关子查询在内层执行次数上差在哪？\n<\/li><li>\nNOT IN 子查询结果含 NULL 时外层会怎样？\n<\/li><li>\n同一需求用子查询和内联结分别怎么写，结果为什么一致？\n<\/ol><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.125<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">主键与外键<\/a><\/span><\/div><h1>内连接与外连接<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 11–14 课\n<\/ul>\n<h2>问题<\/h2>\n<p>关系表拆开存储：产品在 Products，供应商在 Vendors；顾客在 Customers，订单在 Orders。一条报表要同时拿出两边的字段，必须在查询时把行按共同值配上对。困难点在于：配不上对的行要不要保留？限制某一侧的条件应该写在配对规则里，还是配对完成之后？联结类型和条件位置选错，结果集会少行或多行。<\/p>\n<h2>定义（逐句拆开）<\/h2>\n<p><strong>联结（join）<\/strong>：查询运行时按共同值把多张表的行配对的机制；联结不是物理存在的表，只在本次查询执行期间存在。 <strong>内连接（INNER JOIN）<\/strong>：只保留两表配对成功的行；任一侧匹配不到的行丢弃。 <strong>左外连接（LEFT OUTER JOIN）<\/strong>：保留左表全部行，右表匹配不到的列填 NULL。 <strong>右外连接（RIGHT OUTER JOIN）<\/strong>：保留右表全部行，左表匹配不到的列填 NULL。 <strong>ON 条件<\/strong>：配对阶段使用的等值或匹配规则。<strong>WHERE 条件<\/strong>：联结完成之后对结果集再做过滤。<\/p>\n<p>正例：要包含没下过订单的顾客，选左外连接，左表 Customers。反例：外连接后在 WHERE 里限定右表列非空，未匹配行被剔除，外连接退化成内连接。<\/p>\n<h2>原理推导（执行推演）<\/h2>\n<p>推演内连接行数。取左表每行，到右表按 ON 条件找匹配；找到一对就输出一行，找不到就跳过左表这行。结果行数等于配对成功的组合数。<\/p>\n<p>推演左外连接行数。左表每行都先保留：右表找到匹配就输出配对行；找不到就输出左表行加右表列 NULL。左表一行匹配右表多行时，仍按多行输出（一对多）。<\/p>\n<p>推演 ON 与 WHERE 的时机差别。ON 在配对阶段生效：右表条件写 ON，只影响怎么配对，不剔除左表行。WHERE 在配对完成后生效：写出 <code>右表列 = 值<\/code> 时，NULL 补位行不满足条件被剔除。<\/p>\n<p>推演自联结。同一张表起两个别名，分别当两张表用，配对条件引用别名区分；常用于找同公司、同类别这类表内对照。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>成立条件：联结两侧有可比的共同列（通常是主键与外键）；类型兼容。边界情况：<\/p>\n<ul><li>\n漏掉 ON 条件退化成笛卡尔积，行数按两表行数相乘。\n<\/li><li>\n一对多联结会让左表行重复出现，计数前要明确是否去重。\n<\/li><li>\n失败案例：左外连接想保留全部顾客，却把 <code>O.order_num = 20007<\/code> 写进 WHERE，没订单的顾客全被滤掉。\n<\/ul>\n<h2>辨析<\/h2>\n<p>内连接与外连接的差别在未匹配行去留。ON 与 WHERE 的差别在执行时机：ON 管配对，WHERE 管事后过滤。联结与子查询的差别：联结可同时输出多表列，子查询偏分步取值；很多需求可互相改写。自然联结按同名列自动配对，内联结显式写 ON 更可控。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：主键与外键提供配对的共同值；WHERE 条件提供过滤规则。后继：视图把常用联结封装成入口；组合查询把联结结果再上下拼接。联结是跨表取数的核心机制。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（内连接与外连接）<\/summary><div class=\"depth-body\"><h1>内连接与外连接：完整推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>从“报表同时出现顾客名和订单号”往回推：<\/p>\n<ol><li>\n顾客与订单分存两表，必须靠共同的 cust_id 把行配上对，这就是联结。\n<\/li><li>\n配对规则写在 ON 上；配不上的行是否保留，决定选内连接还是外连接。\n<\/li><li>\n配对完成后还可以用 WHERE 再过滤，但这一步会丢掉 NULL 补位行。\n<\/li><li>\n一对多关系下，左表行会按匹配的多行重复出现，行数要按组合数算。\n<\/li><li>\n联结只在查询执行期间存在，不生成物理宽表；结果列来自两侧表的投影。\n<\/ol>\n<p>底层假设：两表按等值条件做行的笛卡尔子集，内连接只留匹配子集，外连接把未匹配侧用 NULL 补齐。<\/p>\n<h2>正向推导（解析 → 执行顺序 → 行集合与列集合变化）<\/h2>\n<p>联结查询的逻辑顺序：FROM 列出参与表 → ON 按配对规则生成配对组合 → 外连接把未匹配侧用 NULL 补齐 → WHERE 对配对后的结果集再过滤 → SELECT 投影两侧列。<\/p>\n<p>第一阶段，解析。DBMS 确认两表有可比的共同列（通常是主键与外键），类型兼容；识别 JOIN 类型（INNER / LEFT / RIGHT）和 ON 条件；同名列用表别名限定。<\/p>\n<p>第二阶段，配对。取左表每行，到右表按 ON 条件找匹配：内连接找到一对输出一行，找不到跳过左表这行；左外连接找不到也输出左表行加右表列 NULL。左表一行匹配右表多行时，每个匹配各输出一行（一对多）。<\/p>\n<p>第三阶段，NULL 补齐（仅外连接）。未匹配的左表行保留骨架，右表侧列填 NULL；这些补位行还没被过滤，是否留下取决于后续 WHERE。<\/p>\n<p>第四阶段，事后过滤。WHERE 在配对完成后对结果集判定：条件引用右表列时，NULL 补位行不满足条件，被剔除；外连接此时可能退化成内连接效果。<\/p>\n<p>第五阶段，投影。从配对结果中选出两侧列，组成结果集行。<\/p>\n<p>结果为什么是这个结果：内连接行数等于配对成功的组合数；左外连接行数 = 配对组合数 + 左表未匹配行数；ON 只影响怎么配对，WHERE 影响配对后留哪些行。一对多让左表行重复，计数前要先明确去重口径。<\/p>\n<h2>算例一（原书样例库）<\/h2>\n<p>Customers 5 行：1000000001 Village Toys；1000000002 Kids Place；1000000003 Fun4All；1000000004 Fun4All；1000000005 The Toy Store。Orders 5 行：20005→001，20006→003，20007→004，20008→005，20009→001（后缀 10000000 省略）。<\/p>\n<p>推演内连接 <code>Customers C INNER JOIN Orders O ON C.cust_id=O.cust_id<\/code>。逐顾客配对：001 匹配 20005、20009 → 两行；002 无订单 → 跳过；003 匹配 20006 → 一行；004 匹配 20007 → 一行；005 匹配 20008 → 一行。结果 5 行，002 不出现。<\/p>\n<p>推演左外连接 <code>Customers C LEFT OUTER JOIN Orders O ON C.cust_id=O.cust_id<\/code>。左表 5 行全部保留：001 两行，002 一行订单列 NULL，003、004、005 各一行。结果 6 行，比内连接多 002 这一 NULL 补位行。<\/p>\n<p>推演右表条件写 ON。<code>ON C.cust_id=O.cust_id AND O.order_num=20007<\/code>：配对时只认 20007；001 没有 20007 订单，保留但订单列 NULL；002 保留 NULL；004 配上 20007。左表仍 5 行骨架。<\/p>\n<p>推演同一条件写 WHERE。先做左外连接得到 6 行，再 <code>WHERE O.order_num=20007<\/code>：NULL 行与不等于 20007 的行都被剔除，只剩 004 一行，外连接退化成内连接效果。<\/p>\n<p>推演行数计算。左表 5 顾客、右表 5 订单；一对多匹配组合数为 5（内连接），左外连接 = 内连接组合数 + 左表未匹配行数（1）= 6。<\/p>\n<h2>算例二（SQLite 已跑通）<\/h2>\n<p>第一条，内连接：<\/p>\n<pre class=\"lang-sql\"><code>SELECT C.cust_id, O.order_num\nFROM Customers C INNER JOIN Orders O ON C.cust_id=O.cust_id\nORDER BY C.cust_id;<\/code><\/pre>\n<p>结果：001/20005，001/20009，003/20006，004/20007，005/20008，共 5 行。逐顾客：002 在 Orders 找不到匹配，内连接跳过；001 匹配两行订单，输出两行。<\/p>\n<p>第二条，左外连接计数：<\/p>\n<pre class=\"lang-sql\"><code>SELECT COUNT(*) FROM Customers C\nLEFT OUTER JOIN Orders O ON C.cust_id=O.cust_id;<\/code><\/pre>\n<p>结果 6。配对组合 5 个加未匹配的 002 一行 NULL 补位，5+1=6。<\/p>\n<p>第三条，一对多重复与分组计数：<\/p>\n<pre class=\"lang-sql\"><code>SELECT C.cust_id, COUNT(O.order_num)\nFROM Customers C LEFT OUTER JOIN Orders O ON C.cust_id=O.cust_id\nGROUP BY C.cust_id ORDER BY C.cust_id;<\/code><\/pre>\n<p>结果：001=2，002=0，003=1，004=1，005=1。逐行：001 两行订单各配一次，COUNT(O.order_num) 计 2；002 无匹配，右表列 NULL，COUNT 跳过 NULL 计 0；其余各 1。注意这里 COUNT 的是右表订单列，不是左表行数；若写 COUNT(*)，002 的补位行也会被计成 1。<\/p>\n<h2>常见误读<\/h2>\n<p>误读 1：“LEFT JOIN 一定比 INNER JOIN 结果行数多。” 反例：左外连接后写 <code>WHERE O.order_num IS NOT NULL<\/code>，NULL 补位行被剔除，结果与内连接相同，002 消失。外连接只是在配对阶段保留左表骨架，事后 WHERE 照样可以把补位行滤掉；是否多出行取决于事后过滤，不取决于 JOIN 关键字本身。<\/p>\n<p>误读 2：“右表条件写 ON 还是 WHERE 都行，结果一样。” 反例：<code>ON C.cust_id=O.cust_id AND O.order_num=20007<\/code> 保留全部顾客骨架，001、002 以 NULL 补位；同样条件写 WHERE，NULL 行和非 20007 行全被剔除，只剩 004。ON 在配对阶段生效，不剔左表行；WHERE 在配对后生效，会剔 NULL 补位行。<\/p>\n<p>误读 3：“联结后 COUNT(<em>) 数出来的就是左表行数。” 反例：001 有两行订单，联结后 001 出现两次；直接 COUNT(<\/em>) 得到 6，是配对组合数加补位行，不是顾客数 5。要数顾客需 COUNT(DISTINCT C.cust_id)，或回到 Customers 表统计。一对多联结会让左表行重复，计数口径必须先定。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例 1：外连接后 WHERE 限定右表列。想保留全部顾客却写 <code>WHERE O.order_num IS NOT NULL<\/code>，NULL 补位行被剔除，等于内连接。<\/p>\n<p>反例 2：漏掉 ON 条件。两表不做配对，5 顾客 × 5 订单 = 25 行笛卡尔积，订单与顾客对错号。<\/p>\n<p>反例 3：一对多联结后直接 COUNT(*)。左表顾客被订单重复计数，得到的是订单行数不是顾客数；要数顾客需 DISTINCT 或改回顾客表统计。<\/p>\n<p>边界假设：本推演基于等值外连接；其他匹配条件、多表联结顺序下的 NULL 补位规则，以目标 DBMS 执行计划为准。另一类边界：右外连接保留右表骨架，左表列补 NULL；自联结是同一张表起两个别名分别当两表用，配对条件靠别名区分。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n内连接为什么会丢掉没订单的顾客？\n<\/li><li>\n左外连接结果里 NULL 补位行来自哪一侧？\n<\/li><li>\n右表条件写 ON 和写 WHERE，执行时机差在哪一步？\n<\/li><li>\n一对多联结后左表行为什么会重复？\n<\/li><li>\n漏掉联结条件会得到什么规模的结果集？\n<\/ol><\/div><\/details>", "c10": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.148<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">内连接与外连接<\/a><\/span><\/div><h1>组合查询 UNION<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 11–14 课\n<\/ul>\n<h2>问题<\/h2>\n<p>有些报表的条件来自不同维度：某几个州的顾客，加上名叫 Fun4All 的顾客；或者两条查询本身就查不同的表。用一长串 OR 拼条件会越来越难读，条件跨表时 OR 根本写不了。UNION 把多条 SELECT 的结果上下拼成一个结果集，每条查询保持独立，再合并输出。<\/p>\n<h2>定义（逐句拆开）<\/h2>\n<p><strong>UNION<\/strong>：多条 SELECT 之间用 UNION 连接，结果上下拼接，并自动去掉完全重复的行。 <strong>UNION ALL<\/strong>：同样拼接，但不做去重，重复行全部保留。 <strong>列对齐要求<\/strong>：每条 SELECT 选出的列数必须相同；对应列的数据类型兼容；结果列名以第一条 SELECT 为准。<\/p>\n<p>正例：两条顾客查询按州和按公司名合并。反例：两条 SELECT 一列数 3、一列数 2，列数不齐，语句报错。<\/p>\n<h2>原理推导（执行推演）<\/h2>\n<p>推演 UNION 的执行。DBMS 先分别执行每条 SELECT，得到各自结果集；再按对应列上下堆在一起；UNION 对堆叠后的整行做去重比较，重复组合只留一行；UNION ALL 跳过这步比较。<\/p>\n<p>推演去重单位。与 DISTINCT 一样，重复判定针对所有选定列的组合；两行只要有一列不同，就算不同行。<\/p>\n<p>推演排序位置。最终 ORDER BY 作用于合并后的结果集，写在整条语句最后；单条 SELECT 内部排序不保证延续到合并结果。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>成立条件：各分支列数相同、对应类型可比较；语义上是同类记录才能上下拼接。边界情况：<\/p>\n<ul><li>\n确认无重复或业务允许重复时，用 UNION ALL 省去去重开销。\n<\/li><li>\n分支来自不同表时，列含义要对应，避免把金额列接到日期列上。\n<\/li><li>\n失败案例：本想保留两条查询各自的重复记录，误用 UNION 后重复行被悄悄删掉，总数对不上。\n<\/ul>\n<h2>辨析<\/h2>\n<p>UNION 与 WHERE OR 的差别：同一表的同类条件，OR 可以替代 UNION；条件跨表或分支本身独立时，OR 写不了，只能 UNION。UNION 与 UNION ALL 的差别只在去重这一步，性能差别来自去重比较。UNION 与 JOIN 的差别：UNION 是上下拼行（列不变、行数相加），JOIN 是横向配对（行不变方向上扩充列）。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：各分支本身是合法的单表或联结查询。后继：组合结果可以再被视图封装；外联结与 UNION 分别处理横向配对和纵向拼接两类组合需求。理解两种组合方向，跨表查询就有了完整工具。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（组合查询 UNION）<\/summary><div class=\"depth-body\"><h1>组合查询 UNION：完整推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>从“一份报表包含两类来源的记录”往回推：<\/p>\n<ol><li>\n两类条件若在同一表，可先评估能否写成 OR；写不了或跨表时，需要纵向拼接机制。\n<\/li><li>\n每条分支先独立跑成结果集，再按列对齐上下堆叠。\n<\/li><li>\n堆叠后是否去重，区分 UNION 与 UNION ALL。\n<\/li><li>\n列数、类型不对齐时堆叠无意义，数据库直接拒绝。\n<\/li><li>\n最终排序作用在合并后的整体结果集上，单条分支内部排序不会延续到最终输出。\n<\/ol>\n<p>底层假设：结果集是同构行的集合；纵向拼接要求各分支行结构一致，像同一张表的两段记录。<\/p>\n<h2>正向推导（解析 → 执行顺序 → 行集合与列集合变化）<\/h2>\n<p>UNION 查询的逻辑顺序：解析各分支列结构 → 每条分支独立执行得到各自结果集 → 按对应列上下堆叠 → （UNION）整行去重 → ORDER BY 对合并结果排序。<\/p>\n<p>第一阶段，解析。DBMS 核对每条 SELECT 的列数：必须相同；对应位置列的数据类型兼容；结果列名以第一条分支为准。列数不齐或类型无法对应，解析阶段报错。<\/p>\n<p>第二阶段，分支独立执行。每条 SELECT 按自己的 FROM、WHERE 跑出结果集，分支之间互不影响；分支可以查同一表，也可以查不同表。<\/p>\n<p>第三阶段，堆叠。把第二条分支的行接到第一条分支结果集下方：第 1 列对第 1 列，第 2 列对第 2 列，行方向增长，列方向不变。<\/p>\n<p>第四阶段，去重（仅 UNION）。堆叠完成后，把全部选定列排成组合，两两比较；组合完全相同的行只留一行。UNION ALL 跳过这步，重复行全部保留。<\/p>\n<p>第五阶段，统一排序。最终 ORDER BY 写在整条语句最后，作用于合并后的结果集；不能给某条分支单独排序后指望顺序带到合并结果。<\/p>\n<p>结果为什么是这个结果：各分支先独立产行，再纵向对齐堆叠；去重单位是全部列组合；UNION 比 UNION ALL 多一步比较排序，代价也在这一步。<\/p>\n<h2>算例一（原书样例库）<\/h2>\n<p>Customers：001 Village Toys John Smith IL sales@villagetoys.com；002 Kids Place Michelle Green OH NULL；003 Fun4All Jim Jones IL jjones@fun4all.com；004 Fun4All Denise L. Stephens IN dstephens@fun4all.com；005 The Toy Store Kim Howard MI NULL。<\/p>\n<p>执行分支 A：<\/p>\n<pre class=\"lang-sql\"><code>SELECT cust_name, cust_contact, cust_email\nFROM Customers WHERE cust_state IN (&#x27;IL&#x27;,&#x27;IN&#x27;,&#x27;MI&#x27;);<\/code><\/pre>\n<p>留下 IL 的 001、003，IN 的 004，MI 的 005，共 4 行。<\/p>\n<p>执行分支 B：<\/p>\n<pre class=\"lang-sql\"><code>SELECT cust_name, cust_contact, cust_email\nFROM Customers WHERE cust_name = &#x27;Fun4All&#x27;;<\/code><\/pre>\n<p>留下 003、004 两行。<\/p>\n<p>推演 UNION 堆叠。A 的 4 行加 B 的 2 行，堆成 6 行；其中 003、004 两行列值完全重复。UNION 去重后剩 4 行：001、003、004、005，与书上印刷输出一致。<\/p>\n<p>推演 UNION ALL。跳过去重比较，6 行全部保留：A 的 4 行加 B 的 2 行，003、004 各出现两次。<\/p>\n<p>推演列对齐。分支 A 选三列，分支 B 若只选两列，堆叠时第三列无对应值，语句报错；两条分支必须列数相同，且 contact 对 contact、email 对 email 对应。<\/p>\n<h2>算例二（SQLite 已跑通）<\/h2>\n<p>第一条，UNION 去重：<\/p>\n<pre class=\"lang-sql\"><code>SELECT cust_contact FROM Customers WHERE cust_state IN (&#x27;IL&#x27;,&#x27;IN&#x27;,&#x27;MI&#x27;)\nUNION\nSELECT cust_contact FROM Customers WHERE cust_name=&#x27;Fun4All&#x27;\nORDER BY cust_contact;<\/code><\/pre>\n<p>分支 A 联系人：John Smith、Jim Jones、Denise L. Stephens、Kim Howard；分支 B：Jim Jones、Denise L. Stephens。堆叠 6 行后整行比较，Jim Jones、Denise L. Stephens 各重复一次被压掉，结果 4 行：Denise L. Stephens、Jim Jones、John Smith、Kim Howard。<\/p>\n<p>第二条，UNION ALL 计数：<\/p>\n<pre class=\"lang-sql\"><code>SELECT COUNT(*) FROM (\n  SELECT cust_contact FROM Customers WHERE cust_state IN (&#x27;IL&#x27;,&#x27;IN&#x27;,&#x27;MI&#x27;)\n  UNION ALL\n  SELECT cust_contact FROM Customers WHERE cust_name=&#x27;Fun4All&#x27;\n);<\/code><\/pre>\n<p>不去重，A 的 4 行加 B 的 2 行，结果 6。被保留下来的重复是 Jim Jones、Denise L. Stephens 各第二次出现。<\/p>\n<p>同一需求的 OR 等价写法：<code>WHERE cust_state IN (&#x27;IL&#x27;,&#x27;IN&#x27;,&#x27;MI&#x27;) OR cust_name=&#x27;Fun4All&#x27;<\/code>，在单表上结果与 UNION 去重后一致。<\/p>\n<h2>常见误读<\/h2>\n<p>误读 1：“UNION 和 JOIN 差不多，都是把两张表拼到一起。” 反例：JOIN 是横向配对，左表一行与右表一行按共同值拼成一行，列变多、行方向按组合数增长；UNION 是纵向拼接，两分支列结构相同，行上下堆叠、列不变。需要同时显示顾客名和订单号是横向配对，用联结；把两类顾客记录上下并成一份清单，用 UNION。方向用反会得到列对不上的结果。<\/p>\n<p>误读 2：“UNION 去重只看第一列，第一列相同就压掉。” 反例：两条分支若第一列同为 Fun4All，但联系人分别是 Jim Jones 和 Denise L. Stephens，整行组合不同，两行都会保留。重复判定针对 SELECT 列表全部列的组合，任一列为不同就算不同行。<\/p>\n<p>误读 3：“分支来自不同表，列名随便对上就行。” 反例：分支 A 选金额列、分支 B 选日期列，虽然列数相同，堆叠后同一列里混着金额和日期，类型虽可隐式转换但语义错位。跨表拼接前要确认对应位置列含义一致：金额对金额、日期对日期、文本对文本。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例 1：误用 UNION 去掉业务重复。订单明细表里同一产品出现在多个订单是合法重复，拼接统计量时用 UNION ALL；用 UNION 会误删重复明细。<\/p>\n<p>反例 2：列数不齐。一支选三列、一支选两列，数据库报错；先对齐 SELECT 列表。<\/p>\n<p>反例 3：把 JOIN 当 UNION 用。需要同时显示两表字段是横向配对，该用联结；上下拼同类记录才用 UNION，方向用反会得到列对不上的结果。<\/p>\n<p>边界假设：本推演按标准 UNION 语义；去重排序规则、各分支类型隐式转换细节随 DBMS 不同。另一类边界：确认无重复或业务允许重复时，用 UNION ALL 省去去重比较，数据量大时这一步成本明显。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\nUNION 和 UNION ALL 在去重步骤上差在哪？\n<\/li><li>\n两条分支 SELECT 的列数必须满足什么条件？\n<\/li><li>\n同一表单条件能用 OR 表达时，UNION 相对 OR 有什么代价？\n<\/li><li>\n重复判定是针对第一列还是全部选定列组合？\n<\/li><li>\n最终 ORDER BY 作用在合并前还是合并后的结果集上？\n<\/ol><\/div><\/details>", "c11": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.157<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">WHERE 与比较、逻辑操作符<\/a><\/span><\/div><h1>插入、更新与删除<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 15–22 课\n<\/ul>\n<h2>问题<\/h2>\n<p>查询只读数据，业务还需要把新记录写进去、改掉已有记录、删掉不再需要的记录。三类写操作各有语法，但共同风险是作用范围：条件写错或漏掉条件，改动会超出目标行。写操作不可像查询那样随意重跑，必须先确认命中范围再执行。<\/p>\n<h2>定义（逐句拆开）<\/h2>\n<p><strong>INSERT<\/strong>：向表中加入一行。显式写法列出表名、列名和对应 VALUES；也可以用 INSERT SELECT 把另一条查询结果整批插入。 <strong>UPDATE<\/strong>：修改已有行。三部分：要更新的表、SET 后列名与新值对、WHERE 过滤条件。多列共用一个 SET，列值对之间逗号分隔。 <strong>DELETE<\/strong>：按条件删除整行；不能只删某一列，清空列值用 UPDATE 置 NULL。<\/p>\n<p>正例：<code>UPDATE Customers SET cust_email=&#x27;...&#x27; WHERE cust_id=...<\/code> 只改目标顾客。反例：UPDATE 或 DELETE 不带 WHERE，作用于全表。<\/p>\n<h2>原理推导（执行推演）<\/h2>\n<p>推演 INSERT 的列对应。列名列表决定每个 VALUES 值落到哪一列；未列出的列取默认值或 NULL。显式列名让语句不依赖表的物理列序；省略列名时值按表定义顺序填充，结构一变就错位。<\/p>\n<p>推演 UPDATE 的行范围。DBMS 先用 WHERE 找出目标行，再对这些行逐行套用 SET 赋值；WHERE 为空条件时全表进入范围，每行都被覆盖。<\/p>\n<p>推演 DELETE 的删除粒度。DELETE 按行删除，满足条件的整行从表中移除；想保留行只清某列，写 UPDATE 把该列置 NULL。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>成立条件：写入值符合列类型与约束（主键唯一、外键合法、NOT NULL 有值）；执行用户具备相应权限。边界情况：<\/p>\n<ul><li>\n可空列没给值时写 NULL；有默认值的列可省略。\n<\/li><li>\n外键约束会拒绝引用不存在记录的写入。\n<\/li><li>\n失败案例：UPDATE 漏写 WHERE，全表 email 被覆盖成同一个值；DELETE 漏写 WHERE，清空整张表。\n<\/ul>\n<h2>辨析<\/h2>\n<p>UPDATE 与 DELETE 的差别：UPDATE 改行内列值、行仍在；DELETE 整行移除。INSERT 与 INSERT SELECT 的差别：前者单批 VALUES，后者把查询结果多行插入。TRUNCATE 与 DELETE 的差别（本书未展开）：DELETE 可按条件逐行删且可回滚，TRUNCATE 是清空整表的结构级操作；本书写操作以 WHERE 定位单行/多行的 DELETE 为主。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：主键用于 WHERE 定位目标行；外键约束守住写入合法性。后继：事务把多条写操作绑成原子单元；视图上的更新受底层表与视图定义限制。写操作是事务保护的主要对象。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（插入、更新与删除）<\/summary><div class=\"depth-body\"><h1>插入、更新与删除：完整推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>从“安全改掉一条记录”往回推：<\/p>\n<ol><li>\n要改的行必须能被条件唯一定位，主键是最可靠的定位列。\n<\/li><li>\nUPDATE 先按 WHERE 圈定行范围，再逐行赋新值；范围由 WHERE 决定。\n<\/li><li>\n插入一行要让每个值落到正确列，显式列名把位置关系写死。\n<\/li><li>\n写操作受约束检查：主键重复、外键非法、NOT NULL 缺值都会被拒绝。\n<\/li><li>\n写操作不可像查询那样随意重跑：改动落库后要靠事务回退才能撤销，执行前必须先核对命中范围。\n<\/ol>\n<p>底层假设：写操作在关系表上按行生效，约束在写入时由 DBMS 强制执行。<\/p>\n<h2>正向推导（解析 → 执行顺序 → 行集合与列集合变化）<\/h2>\n<p>写语句的逻辑顺序：解析列名与值对应关系 → 约束校验（主键唯一、外键合法、NOT NULL 有值、类型匹配）→ WHERE 圈定目标行集合 → 逐行写入或赋值/移除。<\/p>\n<p>第一阶段，解析（INSERT）。列名列表决定每个 VALUES 值落到哪一列；未列出的列取默认值或 NULL。显式列名让语句不依赖表的物理列序；省略列名时值按表定义顺序填充，结构一变就错位。<\/p>\n<p>第二阶段，约束校验。新行先过主键唯一性检查，再过外键引用检查，再检查 NOT NULL 列是否有值、类型是否兼容；任一项不通过，整行写入被拒绝，不留下半成品行。<\/p>\n<p>第三阶段，圈定范围（UPDATE/DELETE）。WHERE 先找出目标行集合：条件命中几行，后续操作就作用于几行；WHERE 条件为空或恒真时，全表进入范围。这一步是写操作风险最高的位置。<\/p>\n<p>第四阶段，逐行生效（UPDATE）。对目标行集合逐行套用 SET 赋值：多列共用一个 SET，列值对之间逗号分隔；未出现在 SET 中的列保持原值。DELETE 则把目标行整行移除，不能只删某一列。<\/p>\n<p>结果为什么是这个结果：INSERT 受列名列表和约束控制；UPDATE/DELETE 的作用范围由 WHERE 圈定，条件漏写范围放大到全表；约束在落库前拦住非法值。<\/p>\n<h2>算例一（原书样例库）<\/h2>\n<p>Customers 现有 5 行，主键 cust_id。<\/p>\n<p>显式插入：<\/p>\n<pre class=\"lang-sql\"><code>INSERT INTO Customers(cust_id, cust_name, cust_city, cust_state,\n                      cust_zip, cust_country, cust_contact, cust_email)\nVALUES(1000000006, &#x27;Toy Land&#x27;, &#x27;New York&#x27;, &#x27;NY&#x27;, &#x27;11111&#x27;, &#x27;USA&#x27;, NULL, NULL);<\/code><\/pre>\n<p>列名列表与 VALUES 位置一一对应：1000000006 进 cust_id，Toy Land 进 cust_name，contact 与 email 给 NULL。未在列表中的列若有默认值取默认值，否则必须允许 NULL。约束检查：新行 cust_id 与现有 5 行不重复，主键通过；email 允许 NULL，插入放行。若填一个不存在的关联 ID 到外键列，外键检查失败。<\/p>\n<p>单行更新：<\/p>\n<pre class=\"lang-sql\"><code>UPDATE Customers\nSET cust_email = &#x27;kim@thetoystore.com&#x27;\nWHERE cust_id = 1000000005;<\/code><\/pre>\n<p>WHERE 用主键定位 1000000005 一行；SET 只改这一行的 email，其他列不动。多列更新 <code>SET cust_contact=&#x27;Sam Roberts&#x27;, cust_email=&#x27;sam@toyland.com&#x27;<\/code>：一个 SET 后跟两个列值对，逗号分隔，同时作用于同一批目标行。<\/p>\n<p>删除粒度：<code>DELETE FROM Customers WHERE cust_id=1000000006<\/code> 定位到该整行后移除；若只想清空 email 保留行，应写 <code>UPDATE Customers SET cust_email=NULL WHERE ...<\/code>。<\/p>\n<p>现有 Customers 5 行：INSERT 后变 6 行；UPDATE 后 005 的 email 由 NULL 变为 kim@thetoystore.com，其余行 email 不变；DELETE 后回到 5 行。<\/p>\n<h2>算例二（Ledger 小表，SQLite 已跑通）<\/h2>\n<p>建表与插入：<\/p>\n<pre class=\"lang-sql\"><code>DROP TABLE IF EXISTS Ledger;\nCREATE TABLE Ledger(rid INTEGER PRIMARY KEY, note TEXT, amount REAL);\nINSERT INTO Ledger(note, amount) VALUES(&#x27;a&#x27;, 10.0);\nINSERT INTO Ledger(note, amount) VALUES(&#x27;b&#x27;, 20.0);\nINSERT INTO Ledger(note, amount) VALUES(&#x27;c&#x27;, 30.0);<\/code><\/pre>\n<p>更新：<\/p>\n<pre class=\"lang-sql\"><code>UPDATE Ledger SET amount=25.0 WHERE rid=2;<\/code><\/pre>\n<p>WHERE 定位 rid=2 一行，行计数（rowcount）=1。更新后三行：(1, a, 10.0)、(2, b, 25.0)、(3, c, 30.0)。被筛掉的 rid=1、rid=3 未进目标行集合，amount 保持原值。<\/p>\n<p>删除：<\/p>\n<pre class=\"lang-sql\"><code>DELETE FROM Ledger WHERE rid=3;<\/code><\/pre>\n<p>命中 rid=3 一行，rowcount=1。删除后两行：(1, a, 10.0)、(2, b, 25.0)，rid=3 整行移除。<\/p>\n<p>反事实：漏 WHERE 的 UPDATE。先看全表行数 <code>SELECT COUNT(*) FROM Ledger<\/code> 得 2；若写 <code>UPDATE Ledger SET amount=0.0<\/code> 不带 WHERE，目标行集合是全表 2 行，两行 amount 都被覆盖成 0.0，不是只改第一行。执行写语句前，先用同一 WHERE 跑 SELECT，核对返回行就是目标行。<\/p>\n<h2>常见误读<\/h2>\n<p>误读 1：“DELETE 可以只删掉某一列的值。” 反例：<code>DELETE FROM Ledger WHERE rid=3<\/code> 移除整行；想保留行只清 amount，应写 <code>UPDATE Ledger SET amount=NULL WHERE rid=3<\/code>。DELETE 的粒度是行，列值清空属于 UPDATE。<\/p>\n<p>误读 2：“UPDATE 漏写 WHERE，只会改掉第一行。” 反例：Ledger 两行，<code>UPDATE Ledger SET amount=0.0<\/code> 不带 WHERE，目标行集合没有被条件收窄，全表两行都被覆盖。数据库不会按“第一行”停手；rowcount 会返回被改的全部行数。<\/p>\n<p>误读 3：“INSERT 省略列名和显式列名写法等价，省事。” 反例：省略列名时 VALUES 按表定义顺序填；表后来在中间加了一列，旧脚本的值整体错位，数据写到错误列且可能不报错。显式列名把位置关系写死，结构调整时语句仍按列名对应。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例 1：省略列名靠顺序填值。表后来加了一列，VALUES 顺序错位，数据写到错误列；显式列名把这种结构变化挡在外面。<\/p>\n<p>反例 2：用 DELETE 清某一列。列值仍在行内，需要 UPDATE 置 NULL；DELETE 删的是整行。<\/p>\n<p>反例 3：跳过约束检查写入。未声明外键时应用漏校验，可写入无效 ID；有外键约束时该写入被数据库拒绝。<\/p>\n<p>边界假设：本推演基于标准 INSERT/UPDATE/DELETE 语法；批量插入、列默认值、自增主键行为随 DBMS 不同。另一类边界：执行写操作需要对应权限；外键约束可能阻止删除被引用行，或按级联策略连带处理明细行。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\nUPDATE 语句由哪三部分组成？\n<\/li><li>\n为什么插入时显式列出列名更稳妥？\n<\/li><li>\nDELETE 与“把某列置 NULL”分别用什么语句？\n<\/li><li>\nUPDATE 漏写 WHERE 会影响多少行？\n<\/li><li>\n写入外键非法值时谁来拒绝这次操作？\n<\/ol><\/div><\/details>", "c12": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.184<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">内连接与外连接<\/a><\/span><\/div><h1>视图<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 15–22 课\n<\/ul>\n<h2>问题<\/h2>\n<p>一条多表联结查询写完，换个产品还要改 WHERE；不同应用反复抄同一段联结逻辑，改一处要改很多地方；某些用户只应该看到部分列和部分行，不能暴露整张表。视图把一条查询保存成虚拟表，之后像查表一样查它，解决复用、简化和权限隔离三个问题。<\/p>\n<h2>定义（逐句拆开）<\/h2>\n<p><strong>视图（view）<\/strong>：用 <code>CREATE VIEW ... AS SELECT<\/code> 保存的一条查询；视图本身不包含列数据，数据仍在底层表中。 <strong>可查询性<\/strong>：创建后可以对视图执行 SELECT、过滤排序，也可以把视图联结到其他表或视图。 <strong>可更新性<\/strong>：部分视图允许写回底层表，限制取决于视图定义与 DBMS；只读视图只能检索。<\/p>\n<p>正例：把顾客—订单—明细的三表联结包成视图，后续按产品 ID 查顾客只写一行 WHERE。反例：以为视图存了一份结果数据，查视图比直接查表快。<\/p>\n<h2>原理推导（执行推演）<\/h2>\n<p>推演视图被查询时的展开过程。查视图时，DBMS 取出保存的查询定义，把对视图的引用替换成底层表和联结条件，按普通查询执行，再返回结果。底层表数据变化，下次查视图看到的就是新数据。<\/p>\n<p>推演视图不存数据的后果。每次访问视图都要重新执行底层联结和过滤；视图上不能建索引，不能挂触发器或默认值。复杂视图或多层嵌套视图每次展开都要重复整套逻辑。<\/p>\n<p>推演权限隔离路径。视图只 SELECT 部分列和行，把视图授予特定用户；用户通过视图接触不到未暴露的底层列，底层表本身不授权。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>成立条件：创建视图需要相应权限；视图名不能与表或其他视图重复。边界情况：<\/p>\n<ul><li>\n许多 DBMS 禁止视图查询中使用 ORDER BY；计算列需要别名。\n<\/li><li>\n视图可嵌套，但嵌套层数多了性能明显下降，部署前要测试。\n<\/li><li>\n失败案例：把多层嵌套视图当性能优化手段，每次查询都展开成一大串联结，响应时间随嵌套层数恶化。\n<\/ul>\n<h2>辨析<\/h2>\n<p>视图与真实表的差别：真实表存储数据，视图只存查询定义；真实表可建索引，视图不能。视图与计算字段的差别：计算字段是单条 SELECT 内的表达式，视图是跨表保存的完整查询。视图与存储过程的差别：视图主要封装检索，存储过程封装多步逻辑与参数化操作。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：联结提供视图封装的底层查询；SELECT 列表决定视图暴露哪些列。后继：索引是加速底层表检索的手段（视图本身不能建）；存储过程在视图之上再封装业务步骤。视图是查询层的复用机制，不改变底层存储。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（视图）<\/summary><div class=\"depth-body\"><h1>视图：完整推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>从“反复使用同一段多表查询”往回推：<\/p>\n<ol><li>\n这段查询涉及哪些表、哪些列、什么过滤，先写成一条普通 SELECT 并跑通。\n<\/li><li>\n把这条 SELECT 保存成视图定义，后续用视图名代替整段查询。\n<\/li><li>\n查视图时定义被展开到底层表，重新执行，因此视图不持有数据。\n<\/li><li>\n权限、可更新性、嵌套限制都来自“视图只是一层查询包装”这个事实。\n<\/li><li>\n视图暴露哪些列和行，由定义中的 SELECT 列表与 WHERE 决定；授权给用户的是视图，不是底层表本身。\n<\/ol>\n<p>底层假设：视图是逻辑层对象，存储的是查询文本而不是结果副本；数据唯一性仍由底层表保证。<\/p>\n<h2>正向推导（解析 → 执行顺序 → 行集合与列集合变化）<\/h2>\n<p>视图查询的逻辑顺序：解析视图名对应保存的 SELECT 定义 → 把对视图的引用替换成底层表与联结条件 → 外层 WHERE、ORDER BY 并入展开后的查询 → 按普通查询执行 → 返回结果。<\/p>\n<p>第一阶段，建视图。先写通底层查询，确认列、联结、过滤正确；<code>CREATE VIEW ... AS SELECT<\/code> 把这段定义存入数据字典。这一步不执行 SELECT，不复制任何行。<\/p>\n<p>第二阶段，查视图时展开。DBMS 取出视图定义，把 <code>FROM 视图名<\/code> 替换成定义里的 FROM 与 JOIN；外层写在视图上的 WHERE 条件接到展开后的查询上。视图名本身不参与数据查找。<\/p>\n<p>第三阶段，按普通查询执行。展开后的查询走与手写联结相同的路径：扫描底层表、按 ON 配对、按条件过滤、投影列集合。结果行列结构由视图定义的 SELECT 列表决定。<\/p>\n<p>第四阶段，实时取值。底层表插入、更新、删除后，下次查视图展开时读到的是新数据；视图不缓存上次结果。<\/p>\n<p>结果为什么是这个结果：视图只存定义，不存副本；每次访问都重新跑底层逻辑，所以数据永远当前，但也不会因为“建过视图”就少算一遍联结。加速只能来自底层表索引和查询优化，与视图对象无关。<\/p>\n<h2>算例一（原书样例库）<\/h2>\n<p>先写通底层查询。需求：按产品找出订购它的顾客名、联系名、邮箱。联结 Customers、Orders、OrderItems：<\/p>\n<pre class=\"lang-sql\"><code>SELECT C.cust_name, C.cust_contact, C.cust_email, OI.prod_id\nFROM Customers C\nINNER JOIN Orders O ON C.cust_id = O.cust_id\nINNER JOIN OrderItems OI ON O.order_num = OI.order_num;<\/code><\/pre>\n<p>封装成视图：<\/p>\n<pre class=\"lang-sql\"><code>CREATE VIEW ProductCustomers AS\nSELECT C.cust_name, C.cust_contact, C.cust_email, OI.prod_id\nFROM Customers C\nINNER JOIN Orders O ON C.cust_id = O.cust_id\nINNER JOIN OrderItems OI ON O.order_num = OI.order_num;<\/code><\/pre>\n<p>视图对象保存的是这条 SELECT 的定义，没有复制任何顾客或订单行。<\/p>\n<p>查视图：<\/p>\n<pre class=\"lang-sql\"><code>SELECT cust_name, cust_contact\nFROM ProductCustomers\nWHERE prod_id = &#x27;RGAN01&#x27;;<\/code><\/pre>\n<p>DBMS 把 ProductCustomers 替换成底层三表联结，加上 prod_id=&#x27;RGAN01&#x27; 条件，等价于直接查联结结果。底层订单 20007→004 含 RGAN01，20008→005 含 RGAN01；过滤后返回 004 Denise L. Stephens、005 Kim Howard（email 为 NULL 仍按底层值返回）。<\/p>\n<p>对比：若把这段结果物化存成一张真实表，新增订单后要手动刷新副本；视图不存副本，永远反映底层当前状态，代价是每次重新计算。<\/p>\n<h2>算例二（CustOrders 视图，SQLite 已跑通）<\/h2>\n<p>建视图：<\/p>\n<pre class=\"lang-sql\"><code>CREATE VIEW CustOrders AS\nSELECT C.cust_id, C.cust_name, O.order_num\nFROM Customers C\nLEFT OUTER JOIN Orders O ON C.cust_id=O.cust_id;<\/code><\/pre>\n<p>第一次查视图：<\/p>\n<pre class=\"lang-sql\"><code>SELECT cust_id, order_num FROM CustOrders ORDER BY cust_id;<\/code><\/pre>\n<p>结果：001/20005，001/20009，002/NULL，003/20006，004/20007，005/20008，共 6 行。展开后就是 Customers 左联结 Orders，002 无订单补 NULL。<\/p>\n<p>底层表插入新订单：<\/p>\n<pre class=\"lang-sql\"><code>INSERT INTO Orders VALUES(20010,&#x27;2020-06-15&#x27;,&#x27;1000000002&#x27;);<\/code><\/pre>\n<p>再查 002：<\/p>\n<pre class=\"lang-sql\"><code>SELECT cust_id, order_num FROM CustOrders WHERE cust_id=&#x27;1000000002&#x27;;<\/code><\/pre>\n<p>结果 002/20010。视图没有保存第一次查询时的 NULL 行，展开后读到底层新插入的 20010，NULL 被真实订单替换。<\/p>\n<p>执行计划（EXPLAIN QUERY PLAN）：<\/p>\n<pre class=\"lang-sql\"><code>EXPLAIN QUERY PLAN SELECT * FROM CustOrders WHERE cust_id=&#x27;1000000001&#x27;;<\/code><\/pre>\n<p>计划输出：<code>SCAN C<\/code>（扫描 Customers），<code>SEARCH O USING AUTOMATIC COVERING INDEX (cust_id=?) LEFT-JOIN<\/code>。视图名在计划里不出现，查询被展开成对 C、O 两表的联结；提速来自订单表的查找路径，不是视图本身。<\/p>\n<h2>常见误读<\/h2>\n<p>误读 1：“视图把查询结果存了一份，查视图比直接查表快。” 反例：上面计划显示查视图仍要扫描 Customers、联结 Orders；视图不存结果副本，每次访问都重新执行底层联结。复杂联结包进视图后，计算量没有减少，只是写法变短；指望视图加速方向就错了。<\/p>\n<p>误读 2：“可以在视图上建索引来提速。” 反例：视图没有自己的数据页，索引依附于物理存储；提速手段是在底层表的联结列、过滤列上建索引。多层嵌套视图每次展开叠加多层联结，响应时间随嵌套层数恶化，应展开后用执行计划实测。<\/p>\n<p>误读 3：“所有视图都能直接 UPDATE、INSERT 写回底层表。” 反例：含多表联结、聚集函数、GROUP BY 的视图通常不可更新；简单单表视图的更新还受“改动后的行是否仍满足视图条件”限制。可更新性规则随 DBMS，部署写回逻辑前要确认视图定义是否在可更新范围内。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例 1：指望视图加速查询。视图不含数据，每次重新跑底层联结；复杂视图性能可能比直接写优化过的 SQL 更差，部署前要实测。<\/p>\n<p>反例 2：在视图上建索引。本书规则明确视图不能索引；提速手段是底层表索引与联结条件优化。<\/p>\n<p>反例 3：以为所有视图都能写回。含联结、聚集的视图通常不可更新；简单单表视图的更新还受“行是否仍属于视图”限制，具体随 DBMS。<\/p>\n<p>边界假设：本推演基于标准视图概念；物化视图（存结果副本并定时刷新）是另一类对象，本书样例不涉及。另一类边界：许多 DBMS 禁止视图查询中使用 ORDER BY；计算列需要别名；视图可嵌套，但嵌套层数多了维护成本和性能都会上升。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n视图里存的是数据副本还是查询定义？\n<\/li><li>\n查视图时底层表数据变了，结果会不会自动更新？\n<\/li><li>\n为什么说视图不自动加速查询？\n<\/li><li>\n视图能承担哪几类权限隔离作用？\n<\/li><li>\n多层嵌套视图为什么可能拖慢性能？\n<\/ol><\/div><\/details>", "c13": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.205<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">插入、更新与删除<\/a><\/span><\/div><h1>事务处理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 15–22 课\n<\/ul>\n<h2>问题<\/h2>\n<p>录入一笔订单要跨多张表：加顾客、加订单头、逐条加明细。中途磁盘满、锁冲突或程序报错，数据库就留下空订单或不完整订单：订单头有了、明细缺失，反过来也一样。这些中间状态对业务是非法的。事务处理把一组相互依赖的写操作绑成一个单元，要么全部生效，要么全部撤销，避免半成品数据落库。<\/p>\n<h2>定义（逐句拆开）<\/h2>\n<p><strong>事务（transaction）<\/strong>：一组作为整体管理的 SQL 语句。 <strong>提交（COMMIT）<\/strong>：把事务内未存储的结果正式写入表，提交后改动持久生效。 <strong>回退（ROLLBACK）<\/strong>：撤销本事务内已做的修改，回到事务开始前的安全状态。 <strong>保留点（SAVEPOINT）<\/strong>：事务内设置的临时占位符，可以只回退到某个保留点，而不必撤销整个事务。<\/p>\n<p>正例：插订单头和明细放在同一事务，任一步出错就 ROLLBACK。反例：把多条写操作各自单独提交，中途失败后无法整体撤销。<\/p>\n<h2>原理推导（执行推演）<\/h2>\n<p>推演事务内修改的可见性边界。事务开始后的写操作先在事务范围内生效，其他连接通常看不到未提交改动；COMMIT 之后才对全局持久可见。<\/p>\n<p>推演回退的撤销范围。ROLLBACK 撤销本事务内 INSERT、UPDATE、DELETE 已做的修改；语句执行到哪一步，回退就把那一步及之前的改动全部还原。<\/p>\n<p>推演保留点分段。事务内设 SAVEPOINT A，之后继续写；出错时可以回退到 A，A 之前的改动保留，A 之后的撤销，再继续提交。<\/p>\n<p>推演不可回滚对象。CREATE、DROP 等结构定义操作即使写在事务里，回退时通常也不撤销；SELECT 不修改数据，回退没有意义。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>成立条件：被保护的是相互依赖的数据修改；DBMS 支持事务语法（BEGIN/COMMIT/ROLLBACK 形式随产品）。边界情况：<\/p>\n<ul><li>\n事务过长会占用锁和资源，影响并发；批量任务要分段提交。\n<\/li><li>\n隔离级别决定未提交改动对其他事务的可见程度。\n<\/li><li>\n失败案例：跨表插入不加事务，故障落在订单头与明细之间，数据库留下孤儿订单行。\n<\/ul>\n<h2>辨析<\/h2>\n<p>事务与存储过程的差别：事务管一批语句的原子性边界，存储过程封装可复用的多步逻辑；一个存储过程内部可以包含多个事务段。提交与保存的差别：COMMIT 永久落库不可回退，ROLLBACK 撤销到开始或保留点。单行写操作与事务的差别：单条语句本身原子，多条依赖语句才需要事务包裹。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：插入、更新与删除是事务保护的具体语句；外键约束保证跨表引用合法。后继：游标常在事务或存储过程内逐行处理；约束与事务共同维护数据完整性。事务是写操作可靠性的最后一道边界。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（事务处理）<\/summary><div class=\"depth-body\"><h1>事务处理：完整推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>从“数据库不能留下半成品订单”往回推：<\/p>\n<ol><li>\n一笔订单由订单头和多条明细组成，跨两张表，任一步失败都不能接受中间态。\n<\/li><li>\n中间态要能整体撤销，前提是这组语句被归入同一个事务边界。\n<\/li><li>\n事务内改动先不持久化，成功才 COMMIT，失败则 ROLLBACK。\n<\/li><li>\n需要分段撤销时设保留点；结构定义操作不在可回滚范围内。\n<\/li><li>\n事务边界内的多条语句共享同一套改动记录，回退时按记录把每条修改逐条还原。\n<\/ol>\n<p>底层假设：事务具备原子性——组内语句要么全部提交，要么全部不留痕迹地撤销。<\/p>\n<h2>正向推导（解析 → 执行顺序 → 行集合与列集合变化）<\/h2>\n<p>事务的逻辑流程：BEGIN 划定起点 → 事务内逐条执行写语句，改动先落在事务可见范围内 → 全部成功 COMMIT 持久化，或任一步失败 ROLLBACK 整体撤销；保留点支持撤销到中间位置。<\/p>\n<p>第一阶段，划定边界。BEGIN（或等价语法）开始一个事务；此后的 INSERT、UPDATE、DELETE 都记在本事务的改动记录里，直到 COMMIT 或 ROLLBACK。<\/p>\n<p>第二阶段，事务内执行。每条写语句先过约束检查，通过后改动生效：本事务内可以查到自己刚写入的行；其他连接按隔离级别通常看不到未提交改动。改动记录保留了行的旧值，供回退时还原。<\/p>\n<p>第三阶段，提交。COMMIT 把事务内全部改动正式写入表：之前未提交的内容对全局持久可见，改动记录清空，释放持有的锁。COMMIT 之后不能再用 ROLLBACK 撤销这批改动。<\/p>\n<p>第四阶段，整体回退。ROLLBACK 按改动记录逐条还原本事务内的修改：插入的行删除，更新的行恢复旧值，删除的行恢复；回到事务开始前的状态。<\/p>\n<p>第五阶段，分段回退。SAVEPOINT 在事务内打标记；ROLLBACK TO 保留点只撤销标记之后的改动，标记之前的改动保留，事务仍可继续走到下一次 COMMIT。<\/p>\n<p>结果为什么是这个结果：事务把多条相互依赖的写操作绑成一个原子单元；未提交改动隔离在事务内，提交才持久；回退按改动记录逐条还原；DDL 不在数据改动记录范围内，通常不可撤销。<\/p>\n<h2>算例一（原书样例库流程）<\/h2>\n<p>订单录入步骤：检查顾客是否存在 → 必要时加顾客 → 加 Orders 订单头 → 取新订单号 → 逐条加 OrderItems 明细。<\/p>\n<p>无事务时的故障点：假设故障发生在订单头插入之后、明细插入之前，Orders 多一行没有明细的空订单；故障在明细中途，数据库留下不完整订单。这两种状态外部无法自动修复。<\/p>\n<p>加事务后的流程：<\/p>\n<pre class=\"lang-sql\"><code>BEGIN TRANSACTION;\n\nINSERT INTO Orders(order_num, order_date, cust_id)\nVALUES(20010, &#x27;2020-06-15&#x27;, &#x27;1000000001&#x27;);\n\nINSERT INTO OrderItems(order_num, order_item, prod_id, quantity, item_price)\nVALUES(20010, 1, &#x27;BNBG01&#x27;, 1, 3.49);\n\nCOMMIT;<\/code><\/pre>\n<p>成功路径：两条 INSERT 都执行成功后 COMMIT，订单头与明细一起持久写入；其他连接此后能读到这笔完整订单。失败路径：第二条 INSERT 报错，执行 ROLLBACK，订单头那条插入被撤销，Orders 不留空行，数据库回到事务开始前状态。<\/p>\n<p>保留点：明细有三条时，在第二条明细后设 SAVEPOINT item2；第三条出错可只回退到 item2，前两条明细与订单头保留，重插第三条后再提交。<\/p>\n<p>不可回滚对象：事务内执行 <code>CREATE TABLE ...<\/code>，ROLLBACK 后该表通常仍然存在；DDL 不随数据修改一起撤销。<\/p>\n<p>事务开始前 Orders 有 5 行、OrderItems 有 2 行节选。事务内插入 20010 订单头和一条明细；未 COMMIT 前，本事务内可查到新行，其他连接按隔离级别通常看不到。COMMIT 后 Orders 6 行、明细 3 行。若第二条 INSERT 失败并 ROLLBACK，两表行数回到 5 和 2，新订单头一并撤销。<\/p>\n<h2>算例二（TLog 小表，SQLite 已跑通）<\/h2>\n<p>建表：<\/p>\n<pre class=\"lang-sql\"><code>CREATE TABLE TLog(id INTEGER PRIMARY KEY, msg TEXT);<\/code><\/pre>\n<p>第一条，整体回退：<\/p>\n<pre class=\"lang-sql\"><code>BEGIN;\nINSERT INTO TLog(msg) VALUES(&#x27;before-rollback&#x27;);\nSELECT msg FROM TLog;   -- 事务内可见：(&#x27;before-rollback&#x27;,)\nROLLBACK;\nSELECT msg FROM TLog;   -- 回退后：0 行<\/code><\/pre>\n<p>逐行：BEGIN 后插入一行，本连接立刻能查到；ROLLBACK 按改动记录撤销这次插入，表回到空状态。被撤销的行没有持久写入。<\/p>\n<p>第二条，保留点分段：<\/p>\n<pre class=\"lang-sql\"><code>BEGIN;\nINSERT INTO TLog(msg) VALUES(&#x27;sp1&#x27;);\nSAVEPOINT sp;\nINSERT INTO TLog(msg) VALUES(&#x27;after-sp&#x27;);\nROLLBACK TO sp;\nSELECT msg FROM TLog ORDER BY msg;  -- (&#x27;sp1&#x27;,)\nCOMMIT;<\/code><\/pre>\n<p>逐行：sp1 在保留点之前插入；after-sp 在保留点之后插入；ROLLBACK TO sp 只撤销 sp 之后的 after-sp，sp1 保留；最终结果只有 sp1 一行，COMMIT 后持久化。<\/p>\n<h2>常见误读<\/h2>\n<p>误读 1：“事务内刚插入的行，其他连接马上就能看到。” 反例：上面 BEGIN 后插入 before-rollback，未 COMMIT 前改动隔离在事务范围内；其他连接按隔离级别读不到这一行。要等 COMMIT 持久可见后，其他事务才能查到。<\/p>\n<p>误读 2：“ROLLBACK 能把事务里建的表也撤掉。” 反例：事务内执行 CREATE TABLE，之后 ROLLBACK，表结构在多数 DBMS 上仍然存在；结构定义操作不属于数据改动记录。需要撤销结构改动要单独 DROP，不能指望回退事务。<\/p>\n<p>误读 3：“每条写语句都要包一层事务才安全。” 反例：单条 INSERT/UPDATE/DELETE 语句本身就是原子执行的，要么生效要么不生效；事务保护的是多条相互依赖、必须同生共死的语句。只有一条语句时显式开事务没有额外收益；订单头加明细这种跨表多步才需要事务边界。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例 1：每条语句单独提交。订单头先 COMMIT，明细失败后无法撤回已提交的头，空订单留在库里。<\/p>\n<p>反例 2：以为 DDL 能回滚。事务里建表后 ROLLBACK，表结构可能仍在；需要撤销结构改动要单独 DROP。<\/p>\n<p>反例 3：事务长时间不提交。未提交修改持锁，其他事务等待，并发吞吐下降；长批量任务应分段提交。<\/p>\n<p>边界假设：本推演按标准事务原子性展开；隔离级别、锁行为、DDL 回滚支持随 DBMS 不同，落地前查目标产品文档。另一类边界：隔离级别决定未提交改动对其他事务的可见程度；保留点回退后事务并未结束，仍可继续写再提交。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n为什么订单头和明细要放进同一个事务？\n<\/li><li>\nCOMMIT 与 ROLLBACK 分别把改动带到什么状态？\n<\/li><li>\n保留点 SAVEPOINT 解决什么问题？\n<\/li><li>\n哪些语句通常不能靠 ROLLBACK 撤销？\n<\/li><li>\n事务过长会给并发带来什么影响？\n<\/ol><\/div><\/details>", "c14": "<div class=\"source-badge\">📖 出处：SQL必知必会（第5版） · p.195<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c13\">事务处理<\/a><\/span><\/div><h1>存储过程与游标<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 15–22 课\n<\/ul>\n<h2>问题<\/h2>\n<p>复杂业务不是单条 SELECT 能完成的：查库存、预定物品、扣减库存、通知顾客，步骤之间有条件分支，顺序也固定。把这套步骤在每个应用里各写一遍，重复劳动多、口径容易不一致；逐行浏览查询结果时，普通结果集只能整批返回，无法一行行前后翻动。存储过程封装多步 SQL，游标提供逐行访问结果集的能力。<\/p>\n<h2>定义（逐句拆开）<\/h2>\n<p><strong>存储过程<\/strong>：预先保存、可带参数的一批 SQL 语句，作为一个单元被调用。 <strong>封装收益<\/strong>：统一各处调用逻辑、减少重复出错、集中修改、限制对基础数据的访问；通常以编译形式存储，执行开销更低。 <strong>游标（cursor）<\/strong>：服务器上的查询结果集，应用可在其中声明、打开、逐行取出、关闭释放。 <strong>游标步骤<\/strong>：声明（定义 SELECT 与选项，不取数）→ 打开（执行 SELECT 取出结果集）→ 取出（逐行或定向浏览）→ 关闭并释放。<\/p>\n<p>正例：下单扣库存的多步判断封装进一个存储过程。反例：把游标当成每条查询的默认方式——普通报表整批取回结果集即可，不必引入游标。<\/p>\n<h2>原理推导（执行推演）<\/h2>\n<p>推演存储过程的复用路径。业务规则写进过程定义，调用方只传参数；过程内部按固定顺序执行各 SQL 与分支。规则调整时只改过程内部，调用方接口不变。<\/p>\n<p>推演存储过程的执行形态。过程通常以编译形式存于数据库，调用时省去反复解析计划的开销；安全性上可通过过程限制直接访问基础表。<\/p>\n<p>推演游标的生命周期。声明阶段只记录 SELECT 语句和选项，不检索数据；打开阶段才真正执行查询、形成结果集；取出阶段按位置逐行拿行；关闭阶段释放游标占用。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>成立条件：存储过程语法、过程支持随 DBMS 差异很大；SQLite 不支持存储过程。游标主要用于需要逐行浏览或定向处理的交互场景。边界情况：<\/p>\n<ul><li>\n游标可标记只读、限定滚动方向、限定可编辑列、控制访问范围。\n<\/li><li>\n嵌套过程与多层游标会增加维护成本，简单查询不必使用。\n<\/li><li>\n失败案例：在轻量数据库上照搬 Oracle 存储过程语法，过程无法创建；跨库项目要先确认目标 DBMS 支持范围。\n<\/ul>\n<h2>辨析<\/h2>\n<p>存储过程与视图的差别：视图封装一条检索查询，存储过程封装多步逻辑与参数化操作。存储过程与事务的差别：事务管原子性边界，过程是代码封装；过程内部可以安排事务段。游标与普通结果集的差别：结果集整批返回，游标可逐行滚动；普通查询默认走结果集方式。<\/p>\n<h2>概念联系<\/h2>\n<p>前置：事务保护过程内的写操作；视图提供可复用的检索入口。后继：约束、索引、触发器是数据库端的配套机制；存储过程和游标属于在这些基础之上的编程层工具。两者都是进阶能力，理解单表查询、联结、分组之后再深入。<\/p><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（存储过程与游标）<\/summary><div class=\"depth-body\"><h1>存储过程与游标：完整推演<\/h1>\n<h2>逆推依赖链<\/h2>\n<p>从“下单流程需要多步带分支”往回推：<\/p>\n<ol><li>\n流程由多条 SQL 按固定顺序组成，步骤间有条件判断，单条语句装不下。\n<\/li><li>\n多步逻辑要在多处复用，前提是封装成一个可调用单元，即存储过程。\n<\/li><li>\n封装后规则集中在过程内部，调用方传参数即可，改动只改一处。\n<\/li><li>\n逐行浏览结果集的需求，则需要游标把结果集变成可滚动对象。\n<\/li><li>\n过程内部的写操作仍受事务边界保护；游标只是访问句柄，不负责原子性。\n<\/ol>\n<p>底层假设：数据库不仅能执行单条声明式查询，还能保存过程化逻辑；游标是结果集上的逐行访问句柄。<\/p>\n<h2>正向推导（解析 → 执行顺序 → 行集合与列集合变化）<\/h2>\n<p>存储过程的逻辑流程：过程定义保存参数与语句序列 → 调用方传参进入过程 → 过程内按顺序执行各 SQL 与分支 → 需要逐行处理时打开游标遍历 → 提交或回退写操作 → 返回结果。<\/p>\n<p>第一阶段，定义封装。把库存检查、预定扣减、补货分支、通知等步骤写进过程体，声明输入参数（产品 ID、数量）与输出参数。定义保存的是语句序列，不执行任何下单动作。<\/p>\n<p>第二阶段，调用入参。应用按过程名调用，传入参数值；过程入口先校验参数合法性，非法值在过程内拦截，不进入后续写操作。<\/p>\n<p>第三阶段，过程内顺序执行。过程按固定顺序跑各 SQL：先查询库存与在订数量，按数量走不同分支；足够则插入明细并扣减可用量，不足则走补货分支。分支判断是过程化逻辑，单条 SELECT 表达不了这种顺序控制。<\/p>\n<p>第四阶段，游标遍历（如需要）。过程内声明游标绑定一条 SELECT，打开后形成服务器端结果集；逐行 FETCH 取出行做判断，处理完关闭释放。游标不改变结果集的行集合，只是提供逐行访问位置。<\/p>\n<p>结果为什么是这个结果：过程把多步 SQL 和分支集中成一个可调用单元；参数化让同一过程复用于不同输入；游标在结果集上提供行级指针，打开才取数、遍历完释放。<\/p>\n<h2>算例一（原书样例库流程）<\/h2>\n<p>Products 中 BNBG01 价格 3.49；OrderItems 记录已订购数量。过程 <code>PlaceOrder(p_prod_id, p_qty)<\/code> 推演：先查库存与在订数量，判断是否足够；足够则在 OrderItems 插入一行并扣减可用量；不足则走补货分支。调用方只传 <code>&#x27;BNBG01&#x27;, 1<\/code>，过程内部完成上述判断与写操作。<\/p>\n<p>游标示例形态（语法随 DBMS）：声明基于 Customers 的订单结果集，打开后逐行取出 cust_name 做浏览；普通 <code>SELECT * FROM Customers<\/code> 一次返回全部行，没有逐行指针。<\/p>\n<p>把下单流程再拆细一步推演。存储过程 <code>PlaceOrder<\/code> 内部可能需要先遍历候选库存行：这时在过程内声明一个游标，指向“该产品当前可用库存”的结果集；打开游标后逐行取出，判断哪一行库存足够，命中后通过该行完成扣减，再关闭游标。过程负责分支与提交边界，游标负责逐行访问，两者配合但职责不同：过程是逻辑封装单元，游标是行级访问句柄。<\/p>\n<p>参数化边界：过程接收产品 ID、数量作为参数，过程内部不写死具体值；同一过程复用于不同产品下单。参数在过程入口校验合法性，非法值在过程内被拦截，不进入后续写操作。这与视图“封装检索条件”不同：过程可以带输入输出参数、可以包含写操作和分支。<\/p>\n<p>性能与维护边界：过程以编译形式存储，重复调用省去重复解析；但过程逻辑集中在数据库端，版本管理、调试手段不如应用代码直观。游标逐行处理在大数据量下比集合操作慢，能整批完成的计算不要逐行循环。<\/p>\n<h2>算例二（游标生命周期，SQLite 已跑通）<\/h2>\n<p>SQLite 不支持存储过程；游标部分用客户端逐行遍历模拟，对应声明 → 打开 → 逐行取出 → 关闭释放四个阶段：<\/p>\n<pre class=\"lang-sql\"><code>SELECT prod_id, prod_price FROM Products ORDER BY prod_id LIMIT 3;<\/code><\/pre>\n<p>执行结果集三行：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>prod_id<\/th><th>prod_price<\/th><\/tr><\/thead><tbody><tr><td>BNBG01<\/td><td>3.49<\/td><\/tr><tr><td>BNBG02<\/td><td>3.49<\/td><\/tr><tr><td>BNBG03<\/td><td>3.49<\/td><\/tr><\/tbody><\/table><\/div>\n<p>客户端逐行取出：第一次 fetchone 得 BNBG01 / 3.49，指针推进到第二行；第二次得 BNBG02 / 3.49；第三次得 BNBG03 / 3.49；第四次 fetchone 返回 None，结果集遍历结束，占用释放。逐行过程中行集合已经由 SELECT 固定，游标只移动读取位置，不增删行。<\/p>\n<p>对照存储过程边界：本环境无法创建过程对象；同一套“查库存 → 判断 → 写明细”的步骤要在应用层按顺序调用多条 SQL 实现，并由应用侧控制事务提交与回退。<\/p>\n<h2>常见误读<\/h2>\n<p>误读 1：“存储过程和视图一回事，都是把一段 SQL 封装起来。” 反例：视图封装一条检索查询，没有参数、没有分支、通常不含写操作；存储过程封装多步逻辑，可带输入输出参数，内部可以有条件分支、INSERT/UPDATE/DELETE 和事务段。视图查的是包装好的结果集，过程调用的是一段可执行流程。<\/p>\n<p>误读 2：“游标声明那一刻就把数据取回来了。” 反例：声明阶段只记录 SELECT 语句和只读、滚动等选项，不检索数据；打开阶段才真正执行查询、形成结果集。声明后、打开前读行会取不到行；关闭阶段才释放游标占用。四个步骤顺序不能乱。<\/p>\n<p>误读 3：“游标逐行处理比整批查询灵活，统计也该逐行跑。” 反例：大数据量下逐行 FETCH 每行都有访问开销，比集合式聚集慢得多；报表计数、求和、分组这类能一条 SQL 完成的计算，应走集合操作。游标只在需要逐行浏览、定向滚动或按行做特殊处理时使用。<\/p>\n<h2>反例与边界检验<\/h2>\n<p>反例 1：在不支持存储过程的数据库上照搬过程语法。SQLite 不支持存储过程；同一业务要在应用层实现这套步骤。<\/p>\n<p>反例 2：每条简单查询都开游标。结果集整批取回就能满足报表展示，引入游标增加声明、打开、关闭的额外步骤，没有收益。<\/p>\n<p>反例 3：以为游标声明时就取到数据。声明只定义查询，打开阶段才检索；提前在声明后读行会取不到行。<\/p>\n<p>边界假设：本推演基于概念层面的标准流程；过程语法、游标选项与并发行为各 DBMS 差异很大，具体实现须查目标产品文档。另一类边界：游标可标记只读、限定滚动方向、限定可编辑列、控制访问范围；嵌套过程与多层游标会增加维护成本，简单查询不必使用。<\/p>\n<h2>自检问题<\/h2>\n<ol><li>\n存储过程相比散落各处的多条 SQL，解决了哪几类问题？\n<\/li><li>\n存储过程内部可以包含事务段吗？两者分工是什么？\n<\/li><li>\n游标四个步骤的顺序是什么，哪一步才真正检索数据？\n<\/li><li>\n只读游标与可编辑游标的差别在哪？\n<\/li><li>\n什么场景下才需要用游标，普通结果集为什么不够？\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：单表检索：SELECT、排序与过滤<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1–6 课：SELECT 检索、排序、WHERE 与通配符过滤<\/a><br>检查点：能写带 WHERE、AND/OR、IN、LIKE 的单表查询，并解释 NULL 为什么不能用 = 比较<\/li><li class='path-step' id='path-02'><strong>步骤 02：计算、函数、聚集与分组<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 7–10 课：计算字段、函数、聚集与分组<\/a><br>检查点：能区分 WHERE 与 HAVING，说清 COUNT(*) 与 COUNT(列) 的差别，写出按组统计的查询<\/li><li class='path-step' id='path-03'><strong>步骤 03：子查询、联结与组合查询<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 11–14 课：子查询、联结与组合查询<\/a><br>检查点：能在内连接、外连接之间做选择，说清 LEFT JOIN 的 ON 与 WHERE 分工，读懂子查询的执行顺序<\/li><li class='path-step' id='path-04'><strong>步骤 04：数据修改、视图、存储过程、事务与高级特性<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 15–22 课：增删改、表与视图、存储过程、事务、游标与高级特性<\/a><br>检查点：能安全地写 INSERT/UPDATE/DELETE，解释视图为何不加速、事务为何要么全做要么全不做<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q01' data-type='single' data-concept='c03' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> Products 表中，供应商 DLL01 的产品为三只 3.49 美元的 bean bag toy 和一个 4.99 美元的 Raggedy Ann。执行下面语句会返回哪些行？\n``<code>sql\nSELECT prod_id, prod_price, prod_name\nFROM Products\nWHERE vend_id = &#x27;DLL01&#x27; AND prod_price &lt;= 4;\n<\/code>``<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 三只 bean bag toy（3.49 美元）<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> Raggedy Ann（4.99 美元）<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 三只 bean bag toy 加 Raggedy Ann<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> DLL01 的全部产品，但不含价格条件<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c03' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 需求：列出价格 10 美元及以上，且由 DLL01 或 BRS01 制造的产品。下面哪种写法的语义与需求一致？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> WHERE vend_id = &#x27;DLL01&#x27; OR vend_id = &#x27;BRS01&#x27; AND prod_price &gt;= 10<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> WHERE (vend_id = &#x27;DLL01&#x27; OR vend_id = &#x27;BRS01&#x27;) AND prod_price &gt;= 10<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> WHERE vend_id IN (&#x27;DLL01&#x27;,&#x27;BRS01&#x27;) AND prod_price &lt; 10<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> WHERE NOT vend_id = &#x27;DLL01&#x27; AND prod_price &gt;= 10<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c03' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> Customers 表中有两行 cust_email 为 NULL。下面语句的执行结果是？\n``<code>sql\nSELECT cust_id\nFROM Customers\nWHERE cust_email = NULL;\n<\/code>``<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 返回这两行 email 为 NULL 的顾客<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 返回全部顾客<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 返回 0 行<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 报错，因为 NULL 不能出现在 WHERE 中<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c03' data-chapter='ch01'><p class='quiz-q'><b>Q4.<\/b> 假设子查询或列表里混入了 NULL：<code>WHERE cust_id NOT IN (&#x27;1000000001&#x27;, NULL)<\/code>。按标准 SQL 语义，这条语句最可能出现什么现象？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 正常返回除 1000000001 外的所有顾客<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 返回 0 行：NOT IN 列表中含 NULL 时，比较结果无法为真<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 只返回 cust_id 为 NULL 的行<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 自动把 NULL 当成空字符串跳过<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c04' data-chapter='ch01'><p class='quiz-q'><b>Q5.<\/b> 要从 Products 中找出产品名以 Fish 开头的所有产品，正确的 LIKE 模式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> &#x27;Fish_&#x27;<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> &#x27;Fish%&#x27;<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> &#x27;%Fish&#x27;<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> &#x27;_Fish_&#x27;<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q6.<\/b> <code>ORDER BY prod_price DESC, prod_name<\/code> 的排序规则是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 先按产品名升序，价格相同再按价格降序<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 先按价格降序；价格相同的行再按产品名默认升序<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 所有列都按降序排列<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 只按产品名排序，价格被忽略<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c06' data-chapter='ch02'><p class='quiz-q'><b>Q7.<\/b> Customers 表共 5 行，其中 2 行 cust_email 为 NULL。<code>COUNT(*)<\/code> 与 <code>COUNT(cust_email)<\/code> 的结果分别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 5 和 5<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 5 和 3<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 3 和 5<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 3 和 3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c07' data-chapter='ch02'><p class='quiz-q'><b>Q8.<\/b> 按标准 SQL 规则，下面语句错在哪？\n``<code>sql\nSELECT vend_id, prod_name, COUNT(*)\nFROM Products\nGROUP BY vend_id;\n<\/code>``<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> COUNT(*) 不能和 GROUP BY 一起用<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> prod_name 既不是分组列，也不在聚集函数里，不能出现在 SELECT 中<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> vend_id 必须改写成别名才能分组<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 没有错误，任何 DBMS 都会照原样执行<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c07' data-chapter='ch02'><p class='quiz-q'><b>Q9.<\/b> 要列出“订单数大于等于 2”的顾客，应该用哪个子句过滤？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> WHERE COUNT(*) &gt;= 2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> HAVING COUNT(*) &gt;= 2<\/label><label class='quiz-opt'><input t
