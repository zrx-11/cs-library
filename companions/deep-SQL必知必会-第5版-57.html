ype='radio' name='q09' value='2'> ORDER BY COUNT(*) &gt;= 2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> GROUP BY COUNT(*) &gt;= 2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c08' data-chapter='ch03'><p class='quiz-q'><b>Q10.<\/b> 要找出订购过产品 RGAN01 的顾客 ID，书上的子查询写法是：\n``<code>sql\nSELECT cust_id\nFROM Orders\nWHERE order_num IN (SELECT order_num\n                    FROM OrderItems\n                    WHERE prod_id = &#x27;RGAN01&#x27;);\n<\/code>``\n关于这条语句的执行方式，哪条正确？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 先执行外层查询，再把结果交给内层<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 子查询由内向外执行：先查出含 RGAN01 的订单号，再用它们过滤 Orders<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 两条查询并行执行后随机合并<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 子查询只能返回一列一行，否则报错<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c09' data-chapter='ch03'><p class='quiz-q'><b>Q11.<\/b> 需求：列出所有顾客，包括一个订单都没下过的顾客。应该选用哪种联结？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 内连接（INNER JOIN）<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 左外连接（LEFT OUTER JOIN）<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 自然联结即可，不需要外连接<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 交叉联结<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c09' data-chapter='ch03'><p class='quiz-q'><b>Q12.<\/b> 下面两条 LEFT OUTER JOIN 语句，关于它们结果的说法哪条正确？\n``<code>sql\n-- A：条件写在 ON\nSELECT C.cust_id, O.order_num\nFROM Customers C LEFT OUTER JOIN Orders O\n  ON C.cust_id = O.cust_id AND O.order_num = 20007;\n-- B：条件写在 WHERE\nSELECT C.cust_id, O.order_num\nFROM Customers C LEFT OUTER JOIN Orders O\n  ON C.cust_id = O.cust_id\nWHERE O.order_num = 20007;\n<\/code>``<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> A 和 B 结果完全相同<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> A 保留全部顾客，只是 20007 之外的订单列填 NULL；B 过滤后等价于内连接，没匹配的顾客被排除<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> B 保留全部顾客，A 会丢掉没订单的顾客<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> ON 中不能出现右表的条件，A 直接报错<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q13' data-type='single' data-concept='c10' data-chapter='ch03'><p class='quiz-q'><b>Q13.<\/b> 两条 SELECT 的结果有一行完全重复。用 UNION 与用 UNION ALL 分别组合，结果集行数差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> UNION 与 UNION ALL 都保留重复行<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> UNION 自动去掉重复行，UNION ALL 全部保留（含重复）<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> UNION ALL 自动去重，UNION 保留重复<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 两者都去重，只是写法不同<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single' data-concept='c13' data-chapter='ch04'><p class='quiz-q'><b>Q14.<\/b> 关于事务处理中能回退（ROLLBACK）的语句，哪条符合本书结论？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> INSERT、UPDATE、DELETE 可以回退；CREATE TABLE、DROP TABLE 这类 DDL 不能回退<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> 所有 SQL 语句都可以回退<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> 只有 SELECT 可以回退<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> 只能回退 INSERT，UPDATE 和 DELETE 不行<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single' data-concept='c12' data-chapter='ch04'><p class='quiz-q'><b>Q15.<\/b> “把常用的多表查询包成视图，查询速度会比直接查表更快”——这个说法错在哪？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 没错，视图会把结果存一份所以更快<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 视图本身不包含数据，每次使用都要执行底层查询；它简化写法、不自动加速，复杂或嵌套视图反而可能拖慢性能<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 视图可以建索引加速，但本书样例表没建<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 视图只在第一次查询时慢，之后会缓存全部结果<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q16' data-type='single' data-concept='c11' data-chapter='ch04'><p class='quiz-q'><b>Q16.<\/b> 执行下面语句时漏掉 WHERE 子句，最严重的后果是？\n``<code>sql\nUPDATE Customers\nSET cust_email = &#x27;kim@thetoystore.com&#x27;;\n<\/code>``<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 只更新第一行<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 整张 Customers 表的 cust_email 都被改成同一个值<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> 语句直接拒绝执行，不会改动任何行<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> 只更新 email 原本为 NULL 的行<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1–6 课：SELECT 检索、排序、WHERE 与通配符过滤<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c03' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> Products 表中，供应商 DLL01 的产品为三只 3.49 美元的 bean bag toy 和一个 4.99 美元的 Raggedy Ann。执行下面语句会返回哪些行？\n``<code>sql\nSELECT prod_id, prod_price, prod_name\nFROM Products\nWHERE vend_id = &#x27;DLL01&#x27; AND prod_price &lt;= 4;\n<\/code>``<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 三只 bean bag toy（3.49 美元）<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> Raggedy Ann（4.99 美元）<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 三只 bean bag toy 加 Raggedy Ann<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> DLL01 的全部产品，但不含价格条件<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c03' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 需求：列出价格 10 美元及以上，且由 DLL01 或 BRS01 制造的产品。下面哪种写法的语义与需求一致？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> WHERE vend_id = &#x27;DLL01&#x27; OR vend_id = &#x27;BRS01&#x27; AND prod_price &gt;= 10<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> WHERE (vend_id = &#x27;DLL01&#x27; OR vend_id = &#x27;BRS01&#x27;) AND prod_price &gt;= 10<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> WHERE vend_id IN (&#x27;DLL01&#x27;,&#x27;BRS01&#x27;) AND prod_price &lt; 10<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> WHERE NOT vend_id = &#x27;DLL01&#x27; AND prod_price &gt;= 10<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c03' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> Customers 表中有两行 cust_email 为 NULL。下面语句的执行结果是？\n``<code>sql\nSELECT cust_id\nFROM Customers\nWHERE cust_email = NULL;\n<\/code>``<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 返回这两行 email 为 NULL 的顾客<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 返回全部顾客<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 返回 0 行<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 报错，因为 NULL 不能出现在 WHERE 中<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c03' data-chapter='ch01'><p class='quiz-q'><b>Q4.<\/b> 假设子查询或列表里混入了 NULL：<code>WHERE cust_id NOT IN (&#x27;1000000001&#x27;, NULL)<\/code>。按标准 SQL 语义，这条语句最可能出现什么现象？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 正常返回除 1000000001 外的所有顾客<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 返回 0 行：NOT IN 列表中含 NULL 时，比较结果无法为真<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 只返回 cust_id 为 NULL 的行<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 自动把 NULL 当成空字符串跳过<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c04' data-chapter='ch01'><p class='quiz-q'><b>Q5.<\/b> 要从 Products 中找出产品名以 Fish 开头的所有产品，正确的 LIKE 模式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> &#x27;Fish_&#x27;<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> &#x27;Fish%&#x27;<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> &#x27;%Fish&#x27;<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> &#x27;_Fish_&#x27;<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q6.<\/b> <code>ORDER BY prod_price DESC, prod_name<\/code> 的排序规则是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 先按产品名升序，价格相同再按价格降序<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 先按价格降序；价格相同的行再按产品名默认升序<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 所有列都按降序排列<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 只按产品名排序，价格被忽略<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 7–10 课：计算字段、函数、聚集与分组<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c06' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> Customers 表共 5 行，其中 2 行 cust_email 为 NULL。<code>COUNT(*)<\/code> 与 <code>COUNT(cust_email)<\/code> 的结果分别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 5 和 5<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 5 和 3<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 3 和 5<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 3 和 3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c07' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 按标准 SQL 规则，下面语句错在哪？\n``<code>sql\nSELECT vend_id, prod_name, COUNT(*)\nFROM Products\nGROUP BY vend_id;\n<\/code>``<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> COUNT(*) 不能和 GROUP BY 一起用<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> prod_name 既不是分组列，也不在聚集函数里，不能出现在 SELECT 中<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> vend_id 必须改写成别名才能分组<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 没有错误，任何 DBMS 都会照原样执行<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c07' data-chapter='ch02'><p class='quiz-q'><b>Q3.<\/b> 要列出“订单数大于等于 2”的顾客，应该用哪个子句过滤？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> WHERE COUNT(*) &gt;= 2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> HAVING COUNT(*) &gt;= 2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> ORDER BY COUNT(*) &gt;= 2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> GROUP BY COUNT(*) &gt;= 2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 11–14 课：子查询、联结与组合查询<\/h1><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c08' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 要找出订购过产品 RGAN01 的顾客 ID，书上的子查询写法是：\n``<code>sql\nSELECT cust_id\nFROM Orders\nWHERE order_num IN (SELECT order_num\n                    FROM OrderItems\n                    WHERE prod_id = &#x27;RGAN01&#x27;);\n<\/code>``\n关于这条语句的执行方式，哪条正确？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 先执行外层查询，再把结果交给内层<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 子查询由内向外执行：先查出含 RGAN01 的订单号，再用它们过滤 Orders<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 两条查询并行执行后随机合并<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 子查询只能返回一列一行，否则报错<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c09' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 需求：列出所有顾客，包括一个订单都没下过的顾客。应该选用哪种联结？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 内连接（INNER JOIN）<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 左外连接（LEFT OUTER JOIN）<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 自然联结即可，不需要外连接<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 交叉联结<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c09' data-chapter='ch03'><p class='quiz-q'><b>Q3.<\/b> 下面两条 LEFT OUTER JOIN 语句，关于它们结果的说法哪条正确？\n``<code>sql\n-- A：条件写在 ON\nSELECT C.cust_id, O.order_num\nFROM Customers C LEFT OUTER JOIN Orders O\n  ON C.cust_id = O.cust_id AND O.order_num = 20007;\n-- B：条件写在 WHERE\nSELECT C.cust_id, O.order_num\nFROM Customers C LEFT OUTER JOIN Orders O\n  ON C.cust_id = O.cust_id\nWHERE O.order_num = 20007;\n<\/code>``<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> A 和 B 结果完全相同<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> A 保留全部顾客，只是 20007 之外的订单列填 NULL；B 过滤后等价于内连接，没匹配的顾客被排除<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> B 保留全部顾客，A 会丢掉没订单的顾客<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> ON 中不能出现右表的条件，A 直接报错<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q13' data-type='single' data-concept='c10' data-chapter='ch03'><p class='quiz-q'><b>Q4.<\/b> 两条 SELECT 的结果有一行完全重复。用 UNION 与用 UNION ALL 分别组合，结果集行数差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> UNION 与 UNION ALL 都保留重复行<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> UNION 自动去掉重复行，UNION ALL 全部保留（含重复）<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> UNION ALL 自动去重，UNION 保留重复<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 两者都去重，只是写法不同<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 15–22 课：增删改、表与视图、存储过程、事务、游标与高级特性<\/h1><div class='quiz-item' data-qid='q14' data-type='single' data-concept='c13' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 关于事务处理中能回退（ROLLBACK）的语句，哪条符合本书结论？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> INSERT、UPDATE、DELETE 可以回退；CREATE TABLE、DROP TABLE 这类 DDL 不能回退<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> 所有 SQL 语句都可以回退<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> 只有 SELECT 可以回退<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> 只能回退 INSERT，UPDATE 和 DELETE 不行<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single' data-concept='c12' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> “把常用的多表查询包成视图，查询速度会比直接查表更快”——这个说法错在哪？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 没错，视图会把结果存一份所以更快<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 视图本身不包含数据，每次使用都要执行底层查询；它简化写法、不自动加速，复杂或嵌套视图反而可能拖慢性能<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 视图可以建索引加速，但本书样例表没建<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 视图只在第一次查询时慢，之后会缓存全部结果<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q16' data-type='single' data-concept='c11' data-chapter='ch04'><p class='quiz-q'><b>Q3.<\/b> 执行下面语句时漏掉 WHERE 子句，最严重的后果是？\n``<code>sql\nUPDATE Customers\nSET cust_email = &#x27;kim@thetoystore.com&#x27;;\n<\/code>``<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 只更新第一行<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 整张 Customers 表的 cust_email 都被改成同一个值<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> 语句直接拒绝执行，不会改动任何行<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> 只更新 email 原本为 NULL 的行<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='主键（primary key）'>主键（primary key） — 唯一标识表中每一行的列（或列组合），值不可重复、不可为 NULL、不应被修改 <span class=glossary-ref>（第 1–6 课：SELECT 检索、排序、WHERE 与通配符过滤）<\/span><\/li><li data-term='外键（foreign key）'>外键（foreign key） — 本表中引用另一表主键的列，其合法值必须在被引用表的主键中出现，用于保证引用完整性 <span class=glossary-ref>（第 1–6 课：SELECT 检索、排序、WHERE 与通配符过滤）<\/span><\/li><li data-term='引用完整性'>引用完整性 — DBMS 强制实施的规则：外键列只能填被引用表中真实存在的主键值，防止出现“指向不存在记录”的行 <span class=glossary-ref>（第 1–6 课：SELECT 检索、排序、WHERE 与通配符过滤）<\/span><\/li><li data-term='谓词/操作符'>谓词/操作符 — WHERE 子句中用于比较或联结条件的关键字，如 =、&lt;&gt;、BETWEEN、IN、LIKE、AND、OR、NOT <span class=glossary-ref>（第 1–6 课：SELECT 检索、排序、WHERE 与通配符过滤）<\/span><\/li><li data-term='通配符（wildcard）'>通配符（wildcard） — LIKE 搜索模式中代表部分字符的特殊符号：% 匹配任意多个字符（含零个），_ 匹配单个字符 <span class=glossary-ref>（第 1–6 课：SELECT 检索、排序、WHERE 与通配符过滤）<\/span><\/li><li data-term='计算字段'>计算字段 — 运行时在 SELECT 语句内由列值、常量与表达式算出的结果，并不物理存储在表中 <span class=glossary-ref>（第 7–10 课：计算字段、函数、聚集与分组）<\/span><\/li><li data-term='别名（alias）'>别名（alias） — 用 AS 给列、计算字段或表起的临时名字，供同一条语句的其他部分引用；表别名不返回给客户端 <span class=glossary-ref>（第 7–10 课：计算字段、函数、聚集与分组）<\/span><\/li><li data-term='聚集函数（aggregate function）'>聚集函数（aggregate function） — 对一组行计算并返回单个值的函数：AVG()、COUNT()、MAX()、MIN()、SUM() <span class=glossary-ref>（第 7–10 课：计算字段、函数、聚集与分组）<\/span><\/li><li data-term='分组（grouping）'>分组（grouping） — 按一列或多列把行划分为若干逻辑组，再对每个组分别做聚集计算，由 GROUP BY 建立、HAVING 过滤 <span class=glossary-ref>（第 7–10 课：计算字段、函数、聚集与分组）<\/span><\/li><li data-term='子查询（subquery）'>子查询（subquery） — 嵌套在另一条 SELECT 语句中的 SELECT，结果被外层查询当作条件值或计算字段使用；执行时由内向外处理 <span class=glossary-ref>（第 11–14 课：子查询、联结与组合查询）<\/span><\/li><li data-term='联结（join）'>联结（join） — 查询运行时按共同值把多张表的行配对在一起的机制；联结不是物理存在的表，只在查询执行期间存在 <span class=glossary-ref>（第 11–14 课：子查询、联结与组合查询）<\/span><\/li><li data-term='视图（view）'>视图（view） — 保存为虚拟表的一条查询；本身不存储数据，返回的数据实时来自底层表 <span class=glossary-ref>（第 15–22 课：增删改、表与视图、存储过程、事务、游标与高级特性）<\/span><\/li><li data-term='事务（transaction）'>事务（transaction） — 一组要么完全执行、要么完全不执行的 SQL 语句；用 COMMIT 提交、ROLLBACK 回退，可用 SAVEPOINT 设保留点 <span class=glossary-ref>（第 15–22 课：增删改、表与视图、存储过程、事务、游标与高级特性）<\/span><\/li><li data-term='游标（cursor）'>游标（cursor） — 存储在服务器上的查询结果集，应用程序可在其中逐行滚动浏览或取出数据 <span class=glossary-ref>（第 15–22 课：增删改、表与视图、存储过程、事务、游标与高级特性）<\/span><\/li><li data-term='约束（constraint）'>约束（constraint） — 定义在表上、管理数据如何插入和处理的规则，如主键、外键、NOT NULL、检查约束，用于实施数据完整性 <span class=glossary-ref>（第 15–22 课：增删改、表与视图、存储过程、事务、游标与高级特性）<\/span><\/li><li data-term='索引（index）'>索引（index） — 在一列或多列上保存的排过序的辅助列表，用于加快搜索和排序操作；视图不能建索引 <span class=glossary-ref>（第 15–22 课：增删改、表与视图、存储过程、事务、游标与高级特性）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：先确认 WHERE 命中行，再执行写操作<\/h2>\n<p>写 UPDATE/DELETE 之前，把同样的条件放进 SELECT 跑一遍，确认命中的就是目标行；多列更新检查 SET 逗号，删行前确认条件能定位到具体主键。不带 WHERE 的写语句作用于全表。<\/p>\n<h2>模式 2：先分“行条件”还是“组条件”<\/h2>\n<p>看到统计需求先问：过滤条件针对单行吗（价格、地区），还是针对统计结果吗（订单数 ≥2、平均价 ≥10）？行条件写 WHERE，组条件写 HAVING；WHERE 先剔行再分组，HAVING 在分组后筛组。<\/p>\n<h2>模式 3：选联结类型前先问“没匹配的行要不要保留”<\/h2>\n<p>只关心两表都有的记录 → 内连接；要保留某一侧全部记录、另一侧补 NULL → 对应方向的外连接。限制右表的条件放 ON（保留左表全量）还是 WHERE（事后过滤、可能退化），取决于是否还要未匹配行。<\/p>\n<h2>模式 4：多步问题先拆步骤，再决定子查询还是联结<\/h2>\n<p>先在纸上拆成“先查订单号 → 再查顾客 → 再取信息”。步骤间是单列值传递时用子查询 IN；需要同时取两表列时改用联结。非相关子查询由内向外写，先保证内层返回单列、不含 NULL。<\/p>\n<h2>模式 5：写条件前先想 NULL 会怎么参与<\/h2>\n<p>比较、IN/NOT IN、聚集计数前，先判断涉及列是否可能为 NULL。判空走 IS NULL；NOT IN / 相关比较遇到 NULL 可能返回空；计数区分 COUNT(*) 与 COUNT(列)；聚集默认忽略 NULL 行而不是当 0。<\/p>\n<h2>模式 6：跨表写操作包进事务<\/h2>\n<p>跨 Orders、OrderItems 多张表的插入或修改，放进一个事务：全部成功 COMMIT，任一步出错 ROLLBACK；需要分段撤销时设 SAVEPOINT。提交前核对中间结果，确认无误再落库。<\/p>\n<h2>模式 7：复用复杂查询用视图，提速另找手段<\/h2>\n<p>一段多表联结反复出现，包成视图简化入口、隔离权限；不要指望视图加速。检索慢时检查联结条件、索引和过滤顺序，复杂/嵌套视图先实测性能。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>查询子句顺序（逻辑执行顺序）<\/h2>\n<ol><li>\n<code>FROM<\/code> 找表（多表先联结）\n<\/li><li>\n<code>WHERE<\/code> 行级过滤\n<\/li><li>\n<code>GROUP BY<\/code> 分组\n<\/li><li>\n<code>HAVING<\/code> 过滤分组\n<\/li><li>\n<code>SELECT<\/code> 选列 / 表达式 / <code>DISTINCT<\/code> 去重\n<\/li><li>\n<code>ORDER BY<\/code> 排序输出\n<\/ol>\n<h2>单表检索骨架<\/h2>\n<pre class=\"lang-sql\"><code>SELECT prod_name, prod_price\nFROM Products\nWHERE vend_id = &#x27;DLL01&#x27; AND prod_price &lt;= 4\nORDER BY prod_price DESC, prod_name;<\/code><\/pre>\n<h2>常用过滤条件<\/h2>\n<ul><li>\n等于/不等：<code>=  &lt;&gt;  &lt;  &lt;=  &gt;  &gt;=<\/code>\n<\/li><li>\n范围：<code>WHERE prod_price BETWEEN 3 AND 6<\/code>\n<\/li><li>\n枚举：<code>WHERE vend_id IN (&#x27;DLL01&#x27;,&#x27;BRS01&#x27;)<\/code>\n<\/li><li>\n判空：<code>WHERE cust_email IS NULL<\/code>（不能写 <code>= NULL<\/code>）\n<\/li><li>\n模糊：<code>WHERE prod_name LIKE &#x27;%bean bag%&#x27;<\/code>（<code>%<\/code> 任意多字符，<code>_<\/code> 单字符）\n<\/li><li>\n逻辑：<code>AND<\/code> 同时成立，<code>OR<\/code> 其一成立，<code>NOT<\/code> 取反；混用加括号\n<\/ul>\n<h2>聚集与分组<\/h2>\n<pre class=\"lang-sql\"><code>SELECT vend_id, COUNT(*) AS num_prods\nFROM Products\nWHERE prod_price &gt;= 4\nGROUP BY vend_id\nHAVING COUNT(*) &gt;= 2;<\/code><\/pre>\n<ul><li>\n五聚集：<code>AVG()<\/code> <code>COUNT(*)<\/code> <code>COUNT(列)<\/code> <code>MAX()<\/code> <code>MIN()<\/code> <code>SUM()<\/code>\n<\/li><li>\n<code>COUNT(*)<\/code> 数行；<code>COUNT(列)<\/code> 跳过该列 NULL 行；其余聚集忽略 NULL 行\n<\/li><li>\nSELECT 中非聚集列必须全部出现在 GROUP BY 中\n<\/li><li>\nWHERE 滤行，HAVING 滤组\n<\/ul>\n<h2>联结<\/h2>\n<pre class=\"lang-sql\"><code>-- 内连接：只留匹配行\nSELECT C.cust_name, O.order_num\nFROM Customers C\nINNER JOIN Orders O ON C.cust_id = O.cust_id;\n\n-- 左外连接：保留左表全部行\nSELECT C.cust_name, O.order_num\nFROM Customers C\nLEFT OUTER JOIN Orders O ON C.cust_id = O.cust_id;<\/code><\/pre>\n<ul><li>\n子查询：<code>WHERE order_num IN (SELECT order_num FROM OrderItems WHERE ...)<\/code>，内层返回单列\n<\/li><li>\n组合：<code>UNION<\/code> 去重；<code>UNION ALL<\/code> 保留重复；两边列数、类型对齐\n<\/ul>\n<h2>写操作<\/h2>\n<pre class=\"lang-sql\"><code>INSERT INTO Customers(cust_id, cust_name, ...)\nVALUES(1000000006, &#x27;Toy Land&#x27;, ...);\n\nUPDATE Customers\nSET cust_email = &#x27;kim@thetoystore.com&#x27;\nWHERE cust_id = 1000000005;\n\nDELETE FROM Customers\nWHERE cust_id = 1000000006;<\/code><\/pre>\n<h2>事务<\/h2>\n<pre class=\"lang-sql\"><code>BEGIN TRANSACTION;\n-- 一组 INSERT / UPDATE / DELETE\nCOMMIT;      -- 或 ROLLBACK;<\/code><\/pre>\n<h2>易错清单<\/h2>\n<ul><li>\n<code>= NULL<\/code> 查不到空值 → 用 <code>IS NULL<\/code>\n<\/li><li>\n<code>NOT IN<\/code> 列表含 NULL → 结果整组为空\n<\/li><li>\nAND/OR 混用不加括号 → 优先级出错\n<\/li><li>\n外连接右表条件写进 WHERE → 退化成内连接\n<\/li><li>\nGROUP BY 后 SELECT 非分组列 → 标准 SQL 非法\n<\/li><li>\nUPDATE/DELETE 漏 WHERE → 全表受影响\n<\/li><li>\n视图不存数据、不自动加速、不能建索引\n<\/li><li>\nCREATE/DROP 等 DDL 通常不能随事务回滚\n<\/ul>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const SYN_GROUPS = [["定义", "含义", "释义", "概念"], ["例题", "算例", "示例", "例子", "案例"], ["习题", "题目", "练习", "测验", "自测"], ["推导", "证明", "论证", "演算"], ["步骤", "流程", "过程", "环节"], ["性质", "特性", "特点", "属性"], ["公式", "表达式", "式子"], ["定理", "定律", "法则", "准则"], ["图像", "图形", "图示", "曲线"], ["计算", "求解", "算出", "求值"], ["平均值", "均值", "平均数"], ["误差", "偏差", "偏离"], ["函数", "映射", "对应关系"], ["导数", "变化率", "切线斜率", "微商"], ["原函数", "不定积分", "反导数"], ["概率", "几率", "可能性"]];
const SOURCES = {};
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
const ZS_VERSION = '1.9.0';
/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  const steps = manifest.learningPath||[];
  const passed = steps.filter(s=>(s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))).length;
  const lbl = document.getElementById('path-progress-label');
  if(lbl) lbl.textContent = `${passed}/${steps.length} 步`;
  $$('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  if(typeof vis !== 'undefined'){ networkLoaded = true; cb(); return; }
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE) { cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库未加载：离线构建请加 <code>--offline all</code>，或联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIndex = null;
let pendingHl = [];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP = new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                        '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                        '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw = q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out = [];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length > 2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low = text.toLowerCase();
  let pos = -1, hit = '';
  for(const t of terms){ const i = low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start = Math.max(0, (pos<0?0:pos) - 60);
  const end = Math.min(text.length, (pos<0?0:pos) + 140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms = pendingHl.slice(); pendingHl = [];
  if(!terms.length) return;
  const root = $('#view'); if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first = null, idx = -1, term = '';
  while((node = walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low = node.nodeValue.toLowerCase();
    for(const t of terms){
      const i = low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){
        first = node; idx = i; term = t;
      }
    }
  }
  if(!first) return;
  try{
    const i = first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range = document.createRange();
    range.setStart(first, i); range.setEnd(first, i+term.length);
    const mark = document.createElement('mark');
    mark.className = 'hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'), 1800);
  }catch(e){}
}
document.addEventListener('click', (e)=>{
  const a = (e.target && e.target.closest) ? e.target.closest('.search-hit a') : null;
  if(a && a.dataset.hl) pendingHl = tokenizeQuery(a.dataset.hl);

function synOf(t){

  for(const g of SYN_GROUPS){ if(g.indexOf(t) >= 0){ for(const x of g){ if(x !== t) out.push(x); } } }

  if(!v){ showPage(routeIdFromHash()); return; }
  const terms = tokenizeQuery(v);
  if(!terms.length){ showPage(routeIdFromHash()); return; }
  const grams = [];
  terms.forEach(t=>{ if(t.length >= 2){ for(let i=0;i+2<=t.length;i++) grams.push(t.slice(i,i+2)); } });
  const qGrams = [...new Set(grams)].slice(0,16);
  const snippetTerms = terms.concat(...terms.map(synOf)).slice(0,24);
  const hits = [];
  buildSearchIndex().forEach(p=>{
    const low = p.text.toLowerCase();
    let tHit = 0, sHit = 0, gHit = 0, first = '', viaSyn = '';
    for(const t of terms){
      if(low.includes(t)){ tHit++; if(!first) first = t; continue; }
      for(const s of synOf(t)){
        if(low.includes(s)){ sHit++; if(!viaSyn) viaSyn = s; if(!first) first = s; break; }
      }
    }
    for(const gm of qGrams){ if(low.includes(gm)) gHit++; }
    if(tHit > 0 || sHit > 0 || gHit >= 4){
      hits.push({p, score: tHit*100 + sHit*30 + Math.min(gHit,20), first, viaSyn});
    }
  });
  hits.sort((a,b)=> b.score-a.score || a.p.text.length-b.p.text.length);
  const top = hits.slice(0,20);
  let body;
  if(top.length){
    const gs = {};
    top.forEach(h=>{
      const k = h.p.chap.key;
      (gs[k] = gs[k] || {label:h.p.chap.label, order:h.p.chap.order, ref:!!h.p.chap.ref, hits:[]}).hits.push(h);
    });
    const eff = g => Math.max(...g.hits.map(x=>x.score)) * (g.ref ? 0.55 : 1);
    const order = Object.values(gs).sort((a,b)=> eff(b)-eff(a));
    body = order.map(g=>{
      const inner = g.hits.sort((a,b)=> b.score-a.score).map(h=>
        `<div class="search-hit"><a href="${h.p.href}" data-hl="${esc(h.first)}">${esc(h.p.label)}</a>${h.viaSyn?`<span class="syn-note">同义命中：${esc(h.viaSyn)}</span>`:''}<br><span class="sub">${hlSnippet(h.p.text, snippetTerms)}</span></div>`).join('');
      return `<div class="search-group"><div class="grp-head">${esc(g.label)}<span class="grp-count">${g.hits.length}</span></div>${inner}</div>`;
    }).join('');
  } else {
    body = '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语，或减少关键词。</div>';
  }
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' + body;
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof mermaid === 'undefined') return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  if(typeof mermaid !== 'undefined'){ boot(); return; }
  const urls=['https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js',
              'https://registry.npmmirror.com/mermaid/10.9.1/files/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js'];
  let ui=0, done=false;
  const tryNext=()=>{
    if(done || ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    const timer=setTimeout(()=>{ if(done) return; s.onload=null; s.onerror=null; s.remove(); tryNext(); }, 4000);
    s.onload=()=>{ done=true; clearTimeout(timer); boot(); };
    s.onerror=()=>{ clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

/* ---------- 句级出处：点击角标弹出原句 ---------- */
let citePop = null;
function closeCite(){ if(citePop){ citePop.remove(); citePop = null; } }
function showCite(id){
  const c = (typeof SOURCES !== 'undefined') ? SOURCES[id] : null;
  if(!c) return;
  closeCite();
  citePop = document.createElement('div');
  citePop.className = 'cite-pop';
  citePop.innerHTML = '<div class="cite-head">出处' + (c.page!=='' && c.page!=null ? (' · p.'+esc(String(c.page))) : '') +
    '<button class="cite-x" aria-label="关闭">×</button></div>' +
    (c.quote ? '<blockquote>'+esc(c.quote)+'</blockquote>' : '') +
    (c.zh ? '<div class="cite-zh">'+esc(c.zh)+'</div>' : '');
  document.body.appendChild(citePop);
  citePop.querySelector('.cite-x').onclick = closeCite;
}
document.addEventListener('click', e=>{
  const t = e.target.closest('.cite');
  if(t){ e.preventDefault(); showCite(t.dataset.cite); return; }
  if(citePop && !e.target.closest('.cite-pop')) closeCite();
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeCite(); });
</script>
<script id="zs-visual-init">
(function(){
  try{
    var B=document.body, H=document.documentElement;
    if(!B.dataset.theme && !H.dataset.theme) B.dataset.theme='dark';
    var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
    var scope=document.querySelectorAll('header, .topbar, .topbar-fixed, #topbar, .sidebar, .tabs, .hdr-right, .card-actions, .card-controls, .section-title, .card .icon, .icon-label');
    for(var i=0;i<scope.length;i++){
      var w=document.createTreeWalker(scope[i],NodeFilter.SHOW_TEXT,null,false), n;
      while(n=w.nextNode()){
        if(EMOJI.test(n.nodeValue)){
          n.nodeValue=n.nodeValue.replace(EMOJI,'').replace(/[ \t]+/g,' ').replace(/^ | $/g,'');
        }
      }
    }
    var btn=document.getElementById('theme-btn')||document.getElementById('theme')||document.getElementById('themeToggle');
    function label(){
      if(!btn) return;
      var light=B.dataset.theme==='light'||H.getAttribute('data-theme')==='light'||B.dataset.theme==='';
      if(btn.textContent.trim()===''||/浅色|深色/.test(btn.textContent)) btn.textContent=light?'深色':'浅色';
    }
    label();
    if(btn){
      new MutationObserver(label).observe(B,{attributes:true,attributeFilter:['data-theme']});
      new MutationObserver(label).observe(H,{attributes:true,attributeFilter:['data-theme']});
      btn.addEventListener('click',function(){setTimeout(label,0);},true);
    }
  }catch(e){}
})();
</script>
